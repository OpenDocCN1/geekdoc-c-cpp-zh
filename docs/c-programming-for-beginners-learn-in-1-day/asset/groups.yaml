    +   1. **Tutorial ID** – This will be used to store a unique number which would
    represent the Tutorial.

    +   2. **Tutorial Name** – This will be used to store the name of the tutorial
    as a string.


    A class also comprises of methods. Our class has the following methods,


    +   1. **SetTutorial** – This method would be used to set the ID and name of the
    Tutorial. So for example, if we wanted to create a tutorial for .Net, we might
    create an object for this. The object would have an ID of let’s say 1. Secondly,
    we would assign a name of “.Net” as the name of the Tutorial. The ID value of
    1 and the name of “.Net” would be stored as a property of the object.

    +   2. **GetTutorial** - This method would be used to get the details of a specific
    tutorial. So if we wanted to get the name of the Tutorial , this method would
    return the string “.Net”.'
