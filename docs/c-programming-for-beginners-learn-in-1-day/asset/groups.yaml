    # # Different versions of the .Net framework


    Below is the table of .Net framework versions, which have been released with their
    release dates. Every version has relevant changes to the framework.


    For example, in framework 3.5 and onwards a key framework called the **Entity
    framework** was released. This framework is used to change the approach in which
    the applications are developed while working with databases.


    | Version number | CLR version | Release date |

    |---|---|---|

    | 1.0 | 1.0 | 2002-02-13 |

    | 1.1 | 1.1 | 2003-04-24 |

    | 2.0 | 2.0 | 2005-11-07 |

    | 3.0 | 2.0 | 2006-11-06 |

    | 3.5 | 2.0 | 2007-11-19 |

    | 4.0 | 4 | 2010-04-12 |

    | 4.5 | 4 | 2012-08-15 |

    | 4.5.1 | 4 | 2013-10-17 |

    | 4.5.2 | 4 | 2014-05-05 |

    | 4.6 | 4 | 2015-07-20 |

    | 4.6.1 | 4 | 2015-11-17 |


    The biggest advantage of the .Net framework is that it supports Windows platform.
    Almost everyone works with Windows machines.


    Microsoft always ensures that .Net frameworks are in compliance with all the supported
    Windows operating systems.


    The following design principles of the .Net framework is what makes it very relevant
    to create .Net based applications.


    +   1. **Interoperability** - The .Net framework provides a lot of backward support.
    Suppose if you had an application built on an older version of the .Net framework,
    say 2.0. And if you tried to run the same application on a machine which had the
    higher version of the .Net framework, say 3.5. The application would still work.
    This is because with every release, Microsoft ensures that older framework versions
    gel well with the latest version.

    +   2. **Portability**- Applications built on the .Net framework can be made to
    work on any Windows platform. And now in recent times, Microsoft is also envisioning
    to make Microsoft products work on other platforms, such as iOS and Linux.'
