  mdcn: "\n\n## 流——读取和写入文件\n\n在 C# 文件操作中，通常使用流来读取和写入文件。流是创建于应用程序与文件之间的附加层。流用于确保文件能够顺利执行读写操作。\n\
    \n读取大型文件中的数据时，通常会使用流。通过使用流，大型文件中的数据会被分割成小块，并发送到流中。然后，应用程序可以从流中读取这些数据块。\n\n之所以将数据分割成小块，是因为一次性读取大文件会对性能造成影响。如果一次性读取一个大小为\
    \ 100 MB 的文件，应用程序可能会卡住并变得不稳定。因此，最佳做法是使用流将文件分割成易于处理的数据块。\n\n因此，当对文件执行写入操作时，要写入的数据首先会被写入流中，然后再由流写入文件。读取操作也是如此。在读取操作中，数据首先从文件传输到流中，然后应用程序通过流读取数据。下面来看一个如何使用流进行读写的示例。\n\
    \n在本示例中，我们假设 D 盘中有一个名为 Example.txt 的文件。该文件是一个简单的文本文件，其中包含如下所示的 2 行内容。\n\n```\n\
    Guru99 - .Net\nGuru99 - C#\n```\n\n在本示例中，我们将创建一个简单的控制台应用程序，并使用文件流进行操作。\n\n###\
    \ 1. 流读取器\n\n流读取器用于使用流从文件中读取数据。文件中的数据首先会被读入流中，然后应用程序再从流中读取数据。\n\n下面来看一个如何使用流从文件中读取数据的示例。将以下代码输入到\
    \ program.cs 文件中。\n\n```\nstring path = @\"D:\\Example.txt\";\n\nusing (StreamReader\
    \ sr = File.OpenText(path)){\n    string s = \"\";\n    while ((s = sr.ReadLine())\
    \ != null)\n    {\n        Console.WriteLine(s);\n    }\n}\nConsole.ReadKey();\n\
    ```\n\n- 定义流读取器\n- 定义临时字符串\n- 读取流中的每一行\n\n### 代码说明：\n\n- 1. 首先，我们声明一个流读取器对象。在\
    \ C# 中，流读取器对象用于定义从文件到应用程序的流。每当从文件中读取数据时，数据就会从文件推送到流中。File.OpenText 用于以只读模式打开“Example.txt”文件，然后将文件处理程序发送给流读取器对象。\n\
    - 2. 接下来，我们定义一个临时变量“s”，用于读取文件中的所有数据。\n- 3. 然后，我们使用流读取器的 ReadLine 方法，从流缓冲区中读取每一行。当执行此操作时，每一行会先从文件传输到缓冲区，然后字符串行会从缓冲区传输到变量“s”。随后，我们将字符串“s”的内容写入控制台。\n\
    \n设置好上述代码并使用 Visual Studio 运行项目后，将得到以下输出。\n\n### 输出：\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_162_0.png)\n\
    \n从输出中可以清楚地看到，流读取器读取了文件中的两行内容。最后，从流中读取的字符串行被发送到了控制台。\n\n### 2. 流写入器\n\n流写入器用于使用流将数据写入文件。应用程序中的数据首先会被写入流中，然后由流将数据写入文件。下面来看一个如何使用流将数据写入文件的示例。将以下代码输入到\
    \ program.cs 文件中。\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_163_0.png)\n\n###\
    \ 代码说明：\n\n- 1. 首先，我们声明一个流写入器对象。在 C# 中，流写入器对象用于定义流，然后使用该流将应用程序中的数据写入文件。每当需要写入数据时，数据就会从应用程序推送到流中。File.AppendText\
    \ 命令用于以追加模式打开“Example.txt”文件，然后将文件处理程序发送给流写入器对象。\n- 2. 我们使用流写入器的 WriteLine 方法，将“Guru99\
    \ – ASP.Net”这一行写入流中。随后，该行会通过流写入文件。\n- 3. 写入文件后，我们关闭流写入器。当文件不再需要执行写入操作时，通常建议关闭文件处理程序。\n\
    - 4. 最后，我们再次读取文件内容，并将其写入控制台日志，以检查该行是否确实已写入文件。\n\n设置好上述代码并使用 Visual Studio 运行项目后，将得到以下输出。\n\
    \n### 输出：\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_164_0.png)\n\n从输出中可以看到，“Guru99\
    \ – ASP.Net”这一行已成功添加到文件中。控制台中可以清楚地看到全部 3 行文本。\n\n## C# 序列化\n\n每当需要将对象相关的数据从一个应用程序发送到另一个应用程序时，就会使用序列化和反序列化的概念。序列化用于将应用程序数据导出到文件中。目标应用程序随后使用反序列化从文件中提取数据，以便进一步使用。\n\
    \n序列化是指将 C# 类对象写入文件或进行序列化的概念。假设有一个名为 Tutorial 的 C# 类，该类包含 ID 和 Tutorial 名称这 2\
    \ 个属性。\n\n序列化可以用于直接将 Tutorial 类的数据属性写入文件。反序列化则用于从文件中读取数据，并重新构造 Tutorial 对象。\n\n\
    下面来看一个如何实现这一过程的示例。\n\n在本示例中，我们将在代码中执行以下高级步骤。\n\n- 1. 创建一个名为 Tutorial 的类，该类包含 2\
    \ 个属性，即 ID 和 Name。\n- 2. 然后从该类创建一个对象，并为 ID 属性赋值“1”，为名称属性赋值“.Net”。\n- 3. 接着使用序列化，将上述对象序列化到名为\
    \ Example.txt 的文件中。\n- 4. 最后，使用反序列化从文件中反序列化对象，并在控制台中显示这些值。\n\n将以下代码输入到控制台应用程序的\
    \ program.cs 文件中。\n\n### 步骤 1）第一步是添加用于序列化的类\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_165_0.png)\n\
    \n### 代码说明：\n\n- 1. 需要进行序列化的类必须具有 [Serializable] 属性。这是 C# 中的一个关键字。该关键字随后会附加到 Tutorial\
    \ 类上。如果不声明此属性，尝试序列化该类时就会收到错误。\n- 2. 接下来是将要进行序列化的类的定义。这里定义了一个名为“Tutorial”的类，并提供了\
    \ 2 个属性，一个是“ID”，另一个是“Name”。\n\n### 步骤 2）在此步骤中，我们首先创建 Tutorial 类的对象，并将其序列化到名为 Example.txt\
    \ 的文件中\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_166_0.png)\n\n### 代码说明：\n\n\
    - 1. 首先，我们创建一个 Tutorial 类的对象，然后将“1”赋值给 ID，将“.net”赋值给名称属性。\n- 2. 接着使用 formatter\
    \ 类，该类用于将对象序列化或转换为二进制格式。序列化后的文件数据采用二进制格式。然后，我们创建一个文件流对象。文件流对象用于打开 Example.txt\
    \ 文件，以便执行写入操作。使用 FileMode.Create 和 FileAccess.Write 关键字，可以明确指定文件应以写入模式打开。\n- 3.\
    \ 最后，我们使用 Serialize 方法将二进制数据传输到文件中。由于写入操作已经完成，因此关闭流。\n\n### 步骤 3）最后，为确保数据存在于文件中，我们使用反序列化从文件中反序列化对象。\n\
    \n"
