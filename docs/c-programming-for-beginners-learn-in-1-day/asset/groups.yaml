    - 2. 主程序 Program.cs 是一个默认代码文件，当在 Visual Studio 中创建新应用程序时创建。此代码将包含我们控制台应用程序所需的代码。


    **步骤 3)** 现在让我们编写代码，该代码将用于在控制台应用程序中显示字符串“Welcome to .Net”。


