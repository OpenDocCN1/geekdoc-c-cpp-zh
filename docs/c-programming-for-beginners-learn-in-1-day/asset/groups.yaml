    \ \".Net\");\n          Console.WriteLine(pTutor.GetTutorial());\n          Console.ReadKey();\n\
    \      }\n  }\n  ```\n- 2. **Public** – 当此访问修饰符附加到属性或方法时，表示这些成员可以从任何外部程序访问。我们在之前的示例中已经看到过这一点。\n\
    \  \n  ```csharp\n  int TutorialID;\n  string TutorialName;\n  \n  public void\
    \ SetTutorial(int pID , String pName) {\n      TutorialID=pID;\n      TutorialName=pName;\n\
