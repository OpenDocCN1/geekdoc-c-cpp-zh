    \ label control.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_100_0.png)\n\nOnce\
    \ you make the above changes, you will see the following output\n\n### Output:-\n\
    \n![](img/8115a2172ef67838d7fe1933fc517c4d_100_1.png)\n\nYou can actually see\
    \ the label controls added to the form.\n\n### Textbox\nA textbox is used for\
    \ allowing a user to enter some text on the forms application. Let’s see how we\
    \ can implement this with an example shown below. We will add 2 textboxes to the\
    \ form, one for the Name and the other for the address to be entered for the user\n\
    \n**Step 1)** The first step is to drag the textbox control onto the Windows Form\
    \ from the toolbox as shown below\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_101_0.png)\n\
    \n**Step 2)** Once the text boxes have been added, go to the properties window\
    \ by clicking on the textbox control. In the properties window, go to the Name\
    \ property and add a meaningful name to each textbox. For example, name the textbox\
    \ for the user as txtUser and that for the address as txtAddress. A naming convention\
    \ and standard should be made for controls because it becomes easier to add extra\
    \ functionality to these controls, which we will see later on.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_102_0.png)\n\
    \nOnce you make the above changes, you will see the following output\n\n### Output:-\n\
    \n![](img/8115a2172ef67838d7fe1933fc517c4d_102_1.png)\n\nIn the output, you can\
    \ clearly see that the Textboxes were added to the form.\n\n### List box\nA Listbox\
    \ is used to showcase a list of items on the Windows form.\n\nLet’s see how we\
    \ can implement this with an example shown below. We will add a list box to the\
    \ form to store some city locations.\n\n**Step 1)** The first step is to drag\
    \ the list box control onto the Windows Form from the toolbox as shown below\n\
    \n![](img/8115a2172ef67838d7fe1933fc517c4d_103_0.png)\n\n**Step 2)** Once the\
    \ list box has been added, go to the properties window by clicking on the list\
    \ box control.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_103_1.png)\n\n- 1.\
    \ First, change the property of the Listbox control, in our case we have changed\
    \ this to lstCity\n- 2. Click on the Items property. This will allow you to add\
    \ different items which can show up in the list box. In our case, we have selected\
    \ items “collection”.\n- 3. In the String Collection Editor, which pops up, enter\
    \ the city names. In our case, we have entered “Mumbai”, “Bangalore” and “Hyderabad”.\n\
    - 4. Finally, click on the ‘OK’ button.\n\nOnce you make the above changes, you\
    \ will see the following output\n\n### Output:-\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_104_0.png)\n\
    \nIn the output, you can clearly see that the Listbox was added to the form. You\
    \ can also see that the list box has been populated with the city values.\n\n\
    ### RadioButton\nA Radiobutton is used to showcase a list of items out of which\
    \ the user can choose one. Let’s see how we can implement this with an example\
    \ shown below. We will add a radio button for a male/female option.\n\n**Step\
    \ 1)** The first step is to drag the ‘radiobutton’ control onto the Windows Form\
    \ from the toolbox as shown below.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_104_1.png)\n\
    \n**Step 2)** Once the Radiobutton has been added, go to the properties window\
    \ by clicking on the Radiobutton control.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_105_0.png)\n\
    \n- 1. First, you need to change the text property of both Radio controls. Go\
    \ to the properties window and change the text to male of one radiobutton and\
    \ the text of the other to female.\n- 2. Similarly, change the name property of\
    \ both Radio controls. Go to the properties window and change the name to ‘rdMale’\
    \ of one radiobutton and to ‘rdfemale’ for the other one.\n\nOnce you make the\
    \ above changes, you will see the following output\n\n### Output:-\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_106_0.png)\n\
    \nYou will see the Radio buttons added to the Windows form.\n\n### Checkbox\n\
    A checkbox is used to provide a list of options in which the user can choose multiple\
    \ choices. Let's see how we can implement this with an example shown below. We\
    \ will add 2 checkboxes to our Windows forms. These checkboxes will provide an\
    \ option to the user on whether they want to learn C# or ASP.Net.\n\n**Step 1)**\
    \ The first step is to drag the checkbox control onto the Windows Form from the\
    \ toolbox as shown below\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_106_1.png)\n\
    \n**Step 2)** Once the checkbox has been added, go to the properties window by\
    \ clicking on the Checkbox control.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_107_0.png)\n\
    \nIn the properties window,\n\n- 1. First, you need to change the text property\
    \ of both checkbox controls. Go to the properties window and change the text to\
    \ C# and ASP.Net.\n- 2. Similarly, change the name property of both Checkbox controls.\
    \ Go to the properties window and change the name to chkC of one checkbox and\
    \ to chkASP for the other one.\n\nOnce you make the above changes, you will see\
    \ the following output\n\n### Output:-\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_108_0.png)\n\
    \n### Button\nA button is used to allow the user to click on a button which would\
    \ then start the processing of the form. Let's see how we can implement this with\
    \ an example shown below. We will add a simple button called ‘Submit’ which will\
    \ be used to submit all the information on the form.\n\n**Step 1)** The first\
    \ step is to drag the button control onto the Windows Form from the toolbox as\
    \ shown below\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_108_1.png)\n\n**Step\
    \ 2)** Once the Button has been added, go to the properties window by clicking\
    \ on the Button control.\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_109_0.png)\n\
    \n- 1. First, you need to change the text property of the button control. Go to\
    \ the properties window and change the text to ‘submit’.\n- 2. Similarly, change\
    \ the name property of the control. Go to the properties window and change the\
    \ name to ‘btnSubmit’.\n\nOnce you make the above changes, you will see the following\
    \ output\n\n### Output:-\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_110_0.png)\n\
    \nCongrats, you now have your first basic Windows Form in place. Let’s now go\
    \ to the next topic to see how we can do Event handling for Controls.\n\n## C#\
    \ Event Handling for Controls\n\nWhen working with windows form, you can add events\
    \ to controls. An event is something that happens when an action is performed.\
    \ Probably the most common action is the clicking of a button on a form. In Windows\
    \ forms, you can add code which can be used to perform certain actions when a\
    \ button is pressed on the form.\n\nNormally when a button is pressed on a form,\
    \ it means that some processing should take place.\n\nLet's take a look at one\
    \ of the event and how it can be handled before we go onto the button event scenario.\n\
    \nThe below example will showcase an event for the Listbox control. So whenever\
    \ an item is selected in the listbox control, a message box should pop up which\
    \ shows the item selected. Let's perform the following steps to achieve this.\n\
    \n**Step 1)** Double click on the Listbox in the form designer. By doing this,\
    \ Visual Studio will automatically open up the code file for the form. And it\
    \ will automatically add an event method to the code. This event method will be\
    \ triggered, whenever any item in the listbox is selected.\n\n```csharp\nprivate\
    \ void lstCity_SelectedIndexChanged(object sender, EventArgs e)\n{\n}\n```\n\n\
    Above is the snippet of code which is automatically added by Visual Studio, when\
    \ you double-click the List box control on the form. Now let's add the below section\
    \ of code to this snippet of code, to add the required functionality to the listbox\
    \ event.\n\n```csharp\nprivate void lstCity_SelectedIndexChanged(object sender,\
    \ EventArgs e)\n{\n    string text = lstCity.GetItemText(lstCity.SelectedItem);\n\
    \    MessageBox.Show(text);\n}\n```\n"
