    \n## C# 初学者：1天学会\n\n由 Krishna Rungta\n\n版权 2016 - 保留所有权利 – Krishna Rungta\n\n\
    **保留所有权利。** 未经作者以书面形式、注明日期并签署的明确许可，不得以任何形式，无论是电子形式还是机械形式，包括复印、录音或通过任何信息存储或检索系统复制或传输本出版物的任何部分。\n\
    \n## 目录\n\n## 第1章：什么是 .NET Framework\n- 1. 什么是 .NET Framework\n- 2. .Net 框架的不同版本\n\
    \n## 第2章：下载和安装 Visual Studio\n\n## 第3章：数据类型\n- 1. 构建第一个控制台应用程序\n- 2. 基本数据类型\n\
    - 3. 枚举\n- 4. 变量和运算符\n- 5. 流程控制和条件语句\n- 6. 数组\n\n## 第4章：类和对象\n- 1. 什么是类和对象\n-\
    \ 2. 字段和方法\n- 3. 访问修饰符\n- 4. 构造函数\n- 5. 继承\n- 6. 多态\n- 7. 抽象类\n- 8. 接口\n\n## 第5章：集合\n\
    - 1. ArrayList\n- 2. Stack\n- 3. Queues\n- 4. Hashtable\n\n## 第6章：Windows Forms\
    \ 应用程序\n- 1. Windows Forms 基础\n- 2. Windows Forms 中的 Hello World\n- 3. 向窗体添加控件\n\
    - 4. 控件事件处理\n- 5. 其他控件\n\n## 第7章：数据库访问\n- 1. 数据库连接基础\n- 2. .Net 中的连接\n- 3. 访问数据\n\
    - 4. 插入记录\n- 5. 更新记录\n- 6. 删除记录\n- 7. 将控件连接到数据\n- 8. 使用 DataGrid\n\n## 第8章：文件操作\n\
    - 1. 基本文件 I/O 命令\n- 2. 流 – 读取和写入文件\n- 3. 序列化\n\n## 第1章：什么是 .NET Framework\n\n\
    .Net 框架是由 Microsoft 开发的软件开发平台。该框架用于创建可在 Windows 平台上运行的应用程序。.Net 框架的第一个版本于 2000\
    \ 年发布。\n\n该版本称为 .Net framework 1.0。.Net 框架此后发展迅速，当前版本为 4.6.1。\n\n.Net 框架可用于创建\
    \ **基于窗体** 和 **基于 Web** 的应用程序。Web 服务也可以使用 .Net 框架开发。\n\n该框架还支持多种编程语言，如 Visual\
    \ Basic 和 C#。因此开发人员可以选择语言来开发所需的应用程序。在本章中，您将学习 .Net 框架的一些基础知识。\n\n### .Net 框架架构\n\
    \n.Net 框架的基本架构如下所示。\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_5_0.png)\n\n.Net\
    \ 框架的架构基于以下关键组件；\n\n- 1. **通用语言运行时** - “通用语言基础结构”或 CLI 是 .Net 程序执行的平台。\n\nCLI\
    \ 具有以下主要功能：\n\n- **异常处理** - 异常是在应用程序执行时发生的错误。\n\n异常的示例有：\n- 如果应用程序尝试在本地计算机上打开文件，但文件不存在。\n\
    - 如果应用程序尝试从数据库获取一些记录，但数据库连接无效。\n\n- **垃圾回收** - 垃圾回收是在不再需要时删除不需要资源的过程。\n\n垃圾回收的示例有：\n\
    - 不再需要的 File handle。如果应用程序已完成对文件的全部操作，则可能不再需要文件句柄。\n- 不再需要的数据库连接。如果应用程序已完成对数据库的全部操作，则可能不再需要数据库连接。\n\
    \n### 使用各种编程语言\n\n如前一节所述，开发人员可以使用多种 .Net 编程语言开发应用程序。\n\n- 1. **语言** - 第一层是编程语言本身，最常见的是\
    \ VB.Net 和 C#。\n- 2. **编译器** – 每个编程语言都有单独的编译器。因此在 VB.Net 语言下，将有一个单独的 VB.Net 编译器。同样对于\
    \ C#，您将有另一个编译器。\n- 3. **通用语言解释器** – 这是 .Net 中的最后一层，用于运行使用任何编程语言开发的 .net 程序。因此后续编译器会将程序发送到\
    \ CLI 层以运行 .Net 应用程序。\n\n![](img/8115a2172ef67838d7fe1933fc517c4d_6_0.png)\n\n\
    - 2. **类库** - .NET Framework 包含一组标准类库。类库是可用于核心目的的方法和函数集合。\n\n例如，有一个类库包含处理所有文件级操作的方法。因此有一个方法可用于从文件中读取文本。同样，还有一个方法可用于向文件写入文本。\n\
    \n大多数方法分为 System.* 或 Microsoft.* 命名空间。（星号 * 仅表示对属于 System 或 Microsoft 命名空间下所有方法的引用）\n\
    \n命名空间是对方法的逻辑分离。我们将在后续章节中更详细地学习这些命名空间。\n\n- 3. **语言** - 可在 .Net 框架中构建的应用程序类型大致分为以下几类。\n\
    \n- **WinForms** – 用于开发基于窗体的应用程序，这些应用程序将在终端用户机器上运行。记事本是客户端应用程序的示例。\n- **ASP.Net**\
    \ – 用于开发基于 Web 的应用程序，这些应用程序可在 Internet Explorer、Chrome 或 Firefox 等任何浏览器上运行。\n\
    \  - Web 应用程序将在服务器上处理，该服务器已安装 Internet Information Services。\n  - Internet Information\
    \ Services 或 IIS 是用于执行 ASP.net 应用程序的 Microsoft 组件。\n  - 执行结果随后发送到客户端机器，并在浏览器中显示输出。\n\
    - **ADO.Net** – 该技术用于开发与 Oracle 或 Microsoft SQL Server 等数据库交互的应用程序。\n\n### .Net\
    \ 框架的不同版本\n\n下面是已发布其发布日期的 .Net 框架版本的表格。每个版本对框架都有相关更改。\n\n例如，在 framework 3.5 及以后，发布了一个名为\
    \ **Entity framework** 的关键框架。该框架用于改变在处理数据库时开发应用程序的方法。\n\n| 版本号 | CLR 版本 | 发布日期\
    \ |\n|---|---|---|\n| 1.0 | 1.0 | 2002-02-13 |\n| 1.1 | 1.1 | 2003-04-24 |\n|\
    \ 2.0 | 2.0 | 2005-11-07 |\n| 3.0 | 2.0 | 2006-11-06 |\n| 3.5 | 2.0 | 2007-11-19\
    \ |\n| 4.0 | 4 | 2010-04-12 |\n| 4.5 | 4 | 2012-08-15 |\n| 4.5.1 | 4 | 2013-10-17\
    \ |\n| 4.5.2 | 4 | 2014-05-05 |\n| 4.6 | 4 | 2015-07-20 |\n| 4.6.1 | 4 | 2015-11-17\
    \ |\n\n.Net 框架的最大优势在于它支持 Windows 平台。几乎每个人都使用 Windows 机器。\n\nMicrosoft 始终确保 .Net\
    \ 框架符合所有受支持的 Windows 操作系统。\n\n以下 .Net 框架的设计原则使其非常适合创建基于 .Net 的应用程序。\n\n- 1. **互操作性**\
