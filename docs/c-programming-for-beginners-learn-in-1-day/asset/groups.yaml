    the other is “Name.”


    # Step 2) In this step, first we will create the object of the Tutorial class
    and serialize it to the file called Example.txt


    ![](img/8115a2172ef67838d7fe1933fc517c4d_166_0.png)


    # Code Explanation:-


    +   1. First, we create an object of the Tutorial class. We then assign the value
    of “1” to ID and “.net” to the name property.

    +   2. We then use the formatter class which is used to serialize or convert the
    object to a binary format. The data in the file in serialization is done in binary
