  - '[PAGE 138]


    # Connecting Controls to Data


    In the earlier sections, we have seen how to we can use C# commands such as SQLCommand
    and SQLReader to fetch data from a database. We also saw how we read each row
    of the table and use a messagebox to display the contents of a table to the user.


    But obviously, users don’t want to see data sent via message boxes and would want
    better controls to display the data. Let’s take the below data structure in a
    table


    | TutorialID | TutorialName |

    |---|---|

    | 1 | C# |

    | 2 | ASP.Net |

    | 3 | VB.Net complete |


    From the above data structure, the user would ideally want to see the TutorialID
    and Tutorial Name displayed in a textbox. Secondly, they might want to have some
    sort of button control which could allow them to go to the next record or to the
    previous record in the table. This would require a bit of extra coding from the
    developer’s end.


    The good news is that C# has the ability to reduce the additional coding effort
    by allowing binding of controls to data. What this means is that C# can automatically
    populate the value of the textbox as per a particular field of the table.


    So, you can have 2 textboxes in a windows form. You can then link one text box
    to the TutorialID field and another textbox to the TutorialName field. This linking
    is done in the Visual Studio designer itself, and you don’t need to write extra
    code for this.


    Visual Studio will ensure that it actually writes the code for you to ensure the
    linkage works. Then when you run your application, the textbox controls will automatically
    connect to the database, fetch the data and display it in the textbox controls.
    No coding is required from the developer’s end to achieve this.


    Let’s look at a code example of how we can achieve binding of controls.


    In our example, we are going to create 2 textboxes on the windows form. They are
    going to represent the Tutorial ID and Tutorial Name respectively. They will be
    bound to the Tutorial ID and TutorialName fields of the database accordingly.


    Let’s follow the below-mentioned steps to achieve this.'
