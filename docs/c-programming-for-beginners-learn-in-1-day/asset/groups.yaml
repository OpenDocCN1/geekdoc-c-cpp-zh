    \ != null)\n        {\n            Console.WriteLine(s);\n        }\n    }\n \
    \   Console.ReadKey();\n```\n\nDefining the stream reader\n\nDefining temporary\
    \ string\n\nReading each line of the stream\n\n# ## Code Explanation:-\n\n+  \
