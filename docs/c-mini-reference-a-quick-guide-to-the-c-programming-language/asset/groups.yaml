  mdcn: "\n## 2.2. 顶级语句\n\n自 C# 9 起，程序中的一个源文件可以使用顶级语句，只要该程序不包含任何其他入口点方法。它是一种语法糖，有助于移除一些样板代码。顶级语句会自动包装在隐式定义的启动类的\
    \ Main 方法中。\n\n顶级语句可以使用类型为 string[] 的隐式定义变量 args 访问命令行参数。\n\n如果顶级语句返回整数值，该值将成为返回给操作系统/运行时的整数返回代码。\n\
    \n顶级语句可以包含异步表达式。\n\n例如，\n\n```\nConsole.WriteLine(\"Hello World\");\n```\n\n一个包含这一行代码的文件，使用自\
    \ C# 10 起可用的隐式全局 using 特性，大致等价于如下内容：\n\n```\nnamespace Namespace1 {\n    class\
    \ Program {\n        static void Main(string[] args) {\n            Console.WriteLine(\"\
    Hello World!\");\n        }\n    }\n}\n```\n\n自 C# 11 起，存在一些限制：\n\n- 应用程序中只能有一个文件使用顶级语句。\n\
    - 该文件中的所有顶级语句都应放在任何其他命名空间成员（例如类型声明）之前。\n- 程序不能同时具有顶级语句和显式入口点，例如 Main 方法。\n\n##\
    \ 2.3. 声明\n\nC# 程序由一系列命名空间组成。命名空间可以包含其他声明，即“成员”。当非命名空间成员声明包含在未显式指定封闭命名空间的程序中时，它们属于“全局命名空间”。\n\
    \n命名空间成员可以是类型声明或其他（嵌套）命名空间声明。类型声明用于定义类、结构体、记录、枚举、接口和委托。类型声明可以包含其他成员。例如，类声明可以包含常量、字段、属性、事件、索引器、运算符、方法、实例构造函数和静态构造函数、终结器以及其他嵌套类型的声明。\n\
    \n## 2.4. 访问控制\n\n顶级类型声明（例如，命名空间内）的访问可以使用以下可访问性声明之一进行控制：\n\n请注意，命名空间不提供访问限制。也就是说，它们都是隐式\n\
    \n类型声明（顶级或嵌套）的成员的访问在很大程度上受其包含类型的可访问性限制，并且可以根据类型使用以下一些访问修饰符进行额外控制：\n\n请注意\n\n-\
    \ 接口或枚举的所有成员默认都是 public，且不能使用访问修饰符。\n\n- 类的成员可以使用任何访问修饰符。\n\n- 结构体的成员只能使用 public\
    \ 和 private。\n\n- 类、记录和结构体的成员默认访问级别为 private。\n\n## 2.5. 块和作用域\n\n### 2.5.1. 作用域\n\
    \nC# 是一种词法作用域语言。名称的作用域被静态确定为程序文本的特定区域，在该区域内，无需限定名称即可引用由该名称声明的实体。\n\n作用域可以嵌套，内部作用域可以重新声明外部作用域中某个名称的含义。此时，来自外部作用域的名称被称为在内部作用域覆盖的程序文本区域中“隐藏”，并且只有使用限定名才能访问该隐藏名称。\n\
    \n### 2.5.2. 块\n\n块语句允许在只允许单个语句的上下文中编写多个语句。块由写在分隔符 { 和 } 之间的零个、一个或多个语句组成。\n\n\
    例如，\n\n```\n{\n  STATEMENTS\n}\n```\n\nSTATEMENTS 由零个、一个或多个语句组成。\n\n请注意，块中声明的局部变量或常量的作用域实际上就是该块。\n\
    \n## 3. 词法分析\n\nC# 在字符值和字符串值中使用 Unicode 码点的 16 位编码。Unicode 转义序列（\\U 或 \\u 后跟十六进制数）可用于在某些词法上下文中表示\
    \ Unicode 码点。也就是说，Unicode 转义序列会在字符字面量、字符串字面量、内插字符串表达式和标识符中处理（但不在关键字中）。例如，字符串字面量\
    \ \"\\u0061pple\" 中的序列 \\u0061 表示小写字母 'a'。因此，该字符串字面量等价于\n\n### 3.1. 词法元素\n\n以下\
    \ 5 个元素构成 C# 程序的词法结构：\n\n- 行终止符，\n- 空白，\n- 注释，\n- 编译器（或预处理）指令，以及\n- 诸如关键字和字面量之类的标记。\n\
    \n编译器指令允许对程序文本进行选择性编译，但除此之外它们对其语法结构没有影响。\n\n### 3.1.1. 行终止符\n\n行终止符元素将 C# 编译单元的字符划分为行。行终止符包括：\n\
    \n- 回车\n- 换行\n- 下一行字符\n- 行分隔符，以及\n- 段落分隔符\n\n### 3.1.2. 空白\n\nC# 中的空白定义为\n\n-\
    \ 任何 Unicode 类别为 Zs 的字符，包括 ASCII 空格字符\n- 水平制表符\n- 垂直制表符，以及\n- 换页符\n\n### 3.1.3.\
    \ 注释\n\nC# 支持两种形式的注释：C 风格的分隔注释和 C++ 风格的单行注释。\n\n分隔注释分别以字符序列 `/*` 和 `*/` 开始和结束。\n\
    \n单行注释以字符序列 `//` 开始，并延伸到同一行的末尾。\n\n```\n/* Delimited comment can span\nmultiple\
    \ lines */\nusing /*or, even just a portion of a line */ System;\n\n// A single\
    \ line comment.\nConsole.WriteLine(\"Hello /* Not a comment */ World.\");\n```\n\
    \n请注意，注释不能包含在 <u>字符串</u> 中。空白和注释充当标记的分隔符。\n\n### 3.2. 标记\n\n在上一节列出的 5 个基本[词法元素]中，只有标记在\
    \ C# 程序的语法文法中是有意义的。标记可以分为标识符、关键字、字面量、运算符和其他标点符号。下一节将解释[字面量]。\n\n### 3.2.1. 标识符\n\
    \nC# 标识符由 Unicode 字符组成，标识符的规则通常与其他 C 风格语言中的规则类似。例如，标识符可以以字母或下划线 _ 开头，并且可以包含其他字母和数字等。有几点需要注意：\n\
    \n- 标识符中允许使用 Unicode 转义序列。\n\n- 连续使用多个下划线（例如 __）虽然合法，但不鼓励。\n\n- 标识符可以选择性地以单个 @\
    \ 字符开头。\n\n- 逐字标识符通常用于“转义”C# 关键字，否则不鼓励使用。\n\n"
