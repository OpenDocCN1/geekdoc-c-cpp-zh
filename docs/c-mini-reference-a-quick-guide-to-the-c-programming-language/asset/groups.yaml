    ## 前言


    C# 最初是基于 Java 编程语言创建的，大约在 2000~2002 年，部分原因是微软当时想吸引熟悉 Java 的程序员。


    Java 在面向对象编程（OOP）成为业界最主流编程范式时几年前就已创建。Java 变得非常流行。在 Java 中，一切都是类。函数被降级为类的“方法”。甚至那些实际上不属于对象的函数也需要成为类的一部分，例如作为“静态”方法。至少在语法上，你无法在不先创建类的情况下用
    Java 编程。


    C# 最初遵循了这种“一切皆类”的设计。现在，在过去的 20 多年里，C# 一直试图摆脱 Java 的幽灵。


    近年来，人们开始认识到 OOP 的局限性，尤其是作为一种一刀切的编程范式。大多数现代编程语言，如 Go、Rust、Swift，甚至其他 JVM 语言如 Scala
    和 Kotlin 都不施加此类限制。事实上，Java 和 C# 是仅有的两种具有这种内置类优先限制的广泛使用的语言。


    C# 一直在不断演进。但它在 C# 6 和 C# 7 之间经历了重大变化。自那以后，C# 每年发布一个新主要版本。截至本文撰写时，C# 11 是当前最新版本。


    尽管多年来有许多大大小小的更新，但最近的变化实际上是关于 C# 脱离 Java。C# 现在正式成为一种“多范式”编程语言，而不仅仅是 OOP 语言。现代 C#
    鼓励函数式编程风格等。例如，C# 中的许多构造现在是表达式而不是语句。（另外，需要注意的是，C# 的许多新特性借鉴自 F#，另一种主要为函数式的 .NET
    编程语言。）自 C# 9 起，我们可以使用顶层语句，至少在一个程序中不超过一个源代码文件。这种外观上的变化使我们能够摆脱现代 C# 中的大量样板代码。


    C# 11 现在在接口中支持所谓的“静态抽象方法”。尽管其全部影响尚不完全清楚，这一变化使 C# 更接近其他更现代的语言。就其能力而言，C# 11 的接口可与
    Go 的接口、Rust 的 trait 和 Swift 的 protocol 等相媲美。


    本书主要关注 C# 语言的语法。但我们鼓励读者超越语法。特别是，我们需要调整编程风格，而不是坚持旧的“一切皆类”范式，以便利用新的现代特性并更有效地用 C#
    编程。


    话虽如此，如果你愿意，你可以从头到尾阅读本书，你将获得 C# 语言的完整图景。


    需要注意的是，本书有相当多的交叉引用，如果你之前没有 C# 或其他类似语言如 C++ 或 Java 的编程经验，你可能在阅读本书的某些部分时会遇到一些困难。我们还跳过了
    C# 的一些基础知识，以便在有限的篇幅内更详细地介绍更现代的特性。本书的目标读者是高级初学者到中级程序员。高级 C# 开发者也可以通过选择性地阅读更高级、更现代的特性从本书中受益。


    需要注意的是，本书不是权威的语言参考。如果本书中存在任何不一致、令人困惑或似乎不正确的解释，我们建议读者参考官方语言规范。


    ## 致读者：


    请在购买或开始阅读并投入时间于本书之前阅读此内容。


    本书是一本以非正式风格编写的语言参考书。它是系列丛书之一，涵盖了广泛使用的不同编程语言。这些书并不是以教程风格教你如何在这些语言中编程。


    在学习的各个阶段偶尔阅读这类语言参考风格的书籍，可以极大地提升你的编程技能。但你只能基于已有的知识学到这么多。我们是增量学习的。除非你是真正的资深开发者，否则不要在第一次阅读时试图一口吃成胖子。


    这些精简参考旨在在几个小时或几天内快速阅读，甚至只是浏览。另一方面，如果你觉得每个段落都在挣扎，那么这本书显然不适合你。我们建议你寻找更适合你的替代书籍。如果你已经购买了本书，只要仍在退货时间窗口内，你可以退回。


    否则，这里有一个快速建议。首先，你不必理解或记住一切。只需快速从头到尾浏览本书，看看哪些部分你更熟悉，哪些部分不熟悉。然后，在稍后练习编程一段时间后，再回来阅读本书。你会发现本书更容易阅读吗？


    你可以不时重复这些步骤。我们都倾向于忘记事情，快速复习总是一个好主意。你每次都会学到或重学到一些“新”东西。


    祝好运！


    ## 1. 引言


    C# 是一个相当复杂的语言。事实上，根据你衡量编程语言复杂性的方式，C# 可能是一些广泛使用语言中最复杂的语言。没有人喜欢复杂性。然而，C# 却是许多开发者最受欢迎和喜爱的语言之一。为什么？


    编程语言是一种工具。有时，拥有一个复杂且灵活的工具可以使完成实际任务变得更简单、更容易。例如，使用电锯可以使砍树的任务更容易。C# 就是这种情况。


    这有几个含义。一方面，C# 通常不被认为是对初学者友好的语言。在你获得收益之前，你需要做出前期投入。另一方面，一旦你掌握了工具，C# 可以成为构建大型企业级软件的强大工具。


    总的来说，使用像 C# 这样“更复杂”的语言，你最终会得到“更简单”的程序。至少这是想法。因此，正确有效地使用 C# 相当重要。否则，使用重量级语言的缺点，如果你愿意的话，将大于使用此类语言的好处。


    本书提供了 C# 语言语法的鸟瞰图。它分为几十个半独立的章节，涵盖了 C# 的大多数重要特性。


    编程语言不仅仅是其特性的总和。然而，为了最有效地使用像 C# 这样的语言，你需要知道有哪些特性可以使用。你需要对每个特性都有透彻的高层次理解。如前言所述，读者在研究每一棵树时应避免迷失森林。

    '
