    ## Preface


    C# was originally created based on the Java programming language, circa 2000~2002,
    partly because Microsoft wanted to lure programmers who were familiar with Java
    at the time.


    Java had been created a few years earlier when the object-oriented programming
    (OOP) was becoming the most dominant programming paradigm in the industry. Java
    became wildly popular. In Java, everything was a class. Functions were demoted
    to the "methods" of a class. Even the functions that do not really belong to an
    object needed to be part of a class, e.g., as "static" methods. You couldn’t program
    in Java without creating a class first, at least syntactically.


    C# initially followed this "everything is a class" design. Now, for the past 20+
    years, C# has been trying to liberate itself from the ghost of Java.


    In recent years, people have been realizing the limitations of the OOP, especially
    as a one-size-fits-all programming paradigm. Most modern programming languages
    like Go, Rust, Swift, and even other JVM languages like Scala and Kotlin do not
    impose such constraints. In fact, Java and C# are the only two widely used languages
    that have such built-in class-first constraints.


    C# has been constantly evolving. But, it went through major changes between C#
    6 and C# 7. And, ever since. Now, C# releases a new major version every year.
    As of this writing, C# 11 is the most current version.


    Although there have been many (small and big) updates over the years, the recent
    changes are really about C# becoming free of Java. C# is now officially a "multi-paradigm"
    programming language, and not just an OOP language. The modern C# encourages the
    functional programming styles, among other things. For example, a lot of constructs
    in C# are now expressions rather than statements. (Also, it should be noted that
    many new features of C# are borrowed from F#, another .NET programming language,
    which is primarily functional.) Since C# 9, we can use the top-level statements,
    at least in no more than one source code file in a program. This kind of (cosmetic)
    changes allow us to do away with much of the boilerplate code in the modern C#.


    C# 11 now supports so-called "static abstract methods" in interfaces. Although
    its full implications are not entirely clear, this change makes C# more on a par
    with other (more modern) languages. C# 11’s interface is comparable, in terms
    of its capabilities, to Go’s interface, Rust’s trait, and Swift’s protocol, among
    others.


    This book primarily focuses on the syntax of the C# language. But we encourage
    the readers to read beyond the syntax. In particular, we will need to adjust our
    programming styles, rather than sticking with the old "everything is a class"
    paradigm, to take advantage of the new modern features and to program more effectively
    in C#.


    Having said that, you can read the book more or less from beginning to end, if
    you’d like, and you will get the full picture of the C# language.


    One thing to note is that there’s a fair amount of cross references, and if you
    have no prior experience with programming in C#, or other similar languages like
    C++ or Java, you may have a little difficulty following some parts of the book.
    We also skip some basics of C# so that we can cover more modern features in more
    detail in the limited space. The book’s intended audience is advanced beginners
    to intermediate-level programmers. Advanced C# developers can also benefit from
    this book by selectively going through more advanced, and modern, features.


    It should be noted that this book is not an authoritative language reference.
    If there are any inconsistencies or confusing, or seemingly incorrect, explanations
    in the book, we recommend the readers to refer to the official language specification.


    ## Dear Readers:


    Please read this before you purchase, or start reading and investing your time
    on, this book.


    This book is a language reference, written in an informal style. It is one of
    the books in a series which cover different programming languages that are widely
    used. These books are not meant to teach you how to program in those languages
    in a tutorial style, however.


    Going through this kind of language reference-style books once in a while, at
    various stages of your learning, can boost your programming skills dramatically.
    But, you will only learn so much based on what you already know. We learn incrementally.
    Do not try to boil the ocean at your first reading unless you are a truly experienced
    developer.


    These mini references are intended to be read quickly, or even just browsed, in
    a few hours or a few days. If you feel like you are struggling with every paragraph,
    on the other hand, then this book is clearly not a right one for you. We suggest
    you look for an alternative book that is more suitable to you. If you have already
    purchased this book, you can return it if it’s still within the return time window.


    Otherwise, here’s a quick suggestion. First of all, you do not have to understand
    or remember everything. Just quickly go through the book from beginning to end,
    and see which parts you are more familiar with and which parts you are not. Then,
    come back to this book later, say, after practicing programming for a little while,
    and read it again. Do you find the book a bit easier to read?


    You can repeat these steps once in a while. We all tend to forget things, and
    a quick refresher is always a good idea. You will learn, or re-learn, something
    "new" every time.


    Good luck!


    ## 1. Introduction


    C# is a rather complex language. In fact, depending on how you measure the complexity
    of a programming language, C# could be the most complex language among some of
    the widely used languages. No one likes complexity. And yet, C# is one of the
    most popular and favorite languages for many developers. Why?


    A programming language is a tool. Sometimes, having a complex and flexible tool
    can make doing a real task much simpler and easier. Using a chainsaw can make
    the task of cutting a tree easier, for example. That’s the case with C#.


    There are a few implications for this. On the one hand, C# is not generally considered
    a beginner-friendly language. There is an upfront investment you need to make
    before you can reap the benefits. On the other hand, C# can be a powerful tool
    for building a large, enterprise-grade software once you master the tool.


    In general, you will end up with "simpler" programs using "more complex" languages
    like C#. At least, that''s the idea. Hence, it is rather important to use C# correctly
    and effectively. Otherwise, the downside of using a heavyweight language, if you
    will, will be bigger than the benefits of using such a language.


    This book provides a bird’s eye view of the C# language grammar. It is organized
    into a few dozen semi-independent chapters, covering most of the important features
    of C#.


    A programming language is not just a sum of its features. In order to be able
    to use a language like C# most effectively, however, you will need to know what
    features are available at your disposal. You will need to have a thorough high-level
    understanding of each of these features. As stated in the preface, the readers
    are encouraged not to lose the sight of the forest while going through each of
    these trees.

