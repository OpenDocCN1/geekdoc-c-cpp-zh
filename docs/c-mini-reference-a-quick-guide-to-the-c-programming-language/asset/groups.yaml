    \ C# 中，这两个属性的值都将被禁用。现在向前看，C# 社区的大多数人可能会使用 enable 值，因此 C# 在实际上已变得向后不兼容。\n\n我们将在本书中始终假设这两个值都设置为\
    \ enable。严格来说，本书中提供的一些信息可能“不正确”，例如在使用这些属性（以及可能还有其他属性）的不同值时。\n\n除非你有遗留代码等，我们建议读者也这样做：对两者始终使用\
    \ enable。ImplicitUsings 的影响相对较小，但 Nullable 完全改变了 C# 程序的工作方式。我们将在下一节讨论这一点。\n\n\
    # 1.2. 可空上下文\n\n引用类型的变量可以为 null。null 值 simply 意味着变量指向 nothing。也就是说，它不指向内存中的任何实际数据。引用变量的默认值是\
    \ null。\n\n这在所有支持引用类型或指针类型的不同 C 风格编程语言中都是如此。当这些变量为 null 时访问它们一直是许多（可能可以预防的）错误的根源，称为空指针异常。\n\
    \nC# 提供了编译时支持来解决这个问题。此功能称为“可空上下文”。默认情况下它是禁用的，这意味着所有引用变量都是可空的，就像一直以来一样。在启用的可空上下文中，传统的（可空）引用变量变为不可空。将这些变量设置为\
    \ null 将导致编译时错误。此外，在启用的可空上下文中可以使用一种新型的引用变量，称为“可空引用变量”。所有可空引用变量在使用前都应检查其可空性。否则编译器可能会抛出编译时错误或警告。\n\
    \n你可以像上一节讨论的那样在 C# 项目文件中设置可空上下文。此外，你还可以使用 C# 的编译器指令在代码的某些部分有选择地启用或禁用可空上下文。要启用，可以在源代码文件中放入以下内容：\n\
    \n```\n#nullable enable\n```\n\n这将一直生效到源文件末尾，或直到使用下一个 #nullable 指令（如果有）。要禁用，请使用以下内容：\n\
    \n```\n#nullable disable\n```\n\n你也可以使用以下指令恢复之前上下文的值：\n\n```\n#nullable restore\n\
    ```\n\n可空上下文纯粹是编译时支持。.NET 运行时对可空上下文一无所知，就它而言，所有引用变量都是可空的。\n\n以下是可空设置的有效值列表：\n\n\
    # 1.3. 书籍组织\n\n我们从 C# 程序的整体开始。C# 程序本质上是一组（将被）一起编译的 C# 源文件。可执行 C# 程序有且只有一个入口点，可以是启动类的\
    \ Main 方法或某个源代码文件中的顶层语句。我们还在本章中描述了访问的基本概念，例如 public 与 private、命名空间以及块和作用域。\n\n\
    源代码文件本质上是一个字符序列。接下来我们将介绍将输入字符序列转换为编译器理解的“标记”序列的基本过程。这通常被称为“词法分析”。C# 的词法结构与其它 C\
    \ 风格编程语言的词法结构相当相似。\n\nC# 程序在逻辑上由一个或多个命名空间组成。命名空间可以包含其他命名空间或自定义类型的声明，例如 using 指令等，这些又可以包含其他成员声明。在\
    \ C# 中，using 指令用于从其他命名空间导入名称。命名空间本身不参与访问控制。\n\nC# 类型按层次组织，以基类 object 为根。与许多 C\
    \ 风格语言一样，C# 具有值和引用（或指针），其特性不同。C# 支持两种不同且互斥的类型类别，即值类型和引用类型。此外，C# 包含 dynamic 类型，这在静态类型在某些情况下过于受限时有点像逃生舱口。\n"
