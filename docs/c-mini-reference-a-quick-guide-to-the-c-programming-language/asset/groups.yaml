    # 1.1. C# and .NET


    At the risk of oversimplifying, there are three aspects to a programming language,
    and programming in that language:


    +   - The language itself, e.g., the grammar and the standard library,

    +   - The runtime, and

    +   - The tooling (e.g., the language compiler).


    As an example, the C++ programming language specification is managed by the ISO.
    On the other hand, toolings are provided by various tool vendors like Microsoft,
    GNU/gcc, and clang. C++ has no separate runtime per se, other than the standard
    library support at run time. C++ programs are directly compiled to a machine code.


    In case of C# and .NET, Microsoft more or less owns a whole ecosystem comprising
    all three parts of the C# language. (We do not discuss other implementations of
    C# such as those used in Unity, etc.) The .NET system defines a set of standard
    libraries and their run time support. .NET is also a runtime, or a virtual machine,
    that runs the byte code compiled from C# programs.'
