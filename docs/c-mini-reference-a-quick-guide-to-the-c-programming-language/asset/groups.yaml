    \ `default(char)` returns `'\\0'`.\n\n### 10.2.1. Char literals\n\nYou can specify\
    \ a `char` value with:\n\n- A character literal.\n- A Unicode escape sequence;\
    \ or\n- A hexadecimal escape sequence, e.g., `\\x` followed by the hexadecimal\
    \ representation of a character code.\n\n## 10.3. Integral Types\n\nC# supports\
    \ 11 integral types: four unsigned integer types and four signed integer types,\
    \ which are represented using two’s complement format. The `char` type is also\
    \ an integral type. In addition, C# includes two native integer types, `nint`\
    \ and `nuint`.\n\n| Type | Description |\n| --- | --- |\n| `byte` | Unsigned 8-bit\
    \ integers with values from 0 to 255 |\n| `sbyte` | Signed 8-bit integers with\
    \ values from -128 to 127 |\n| `ushort` | Unsigned 16-bit integers with values\
    \ from 0 to 65535. |\n| `short` | Signed 16-bit integers with values from -32768\
    \ to 32767. |\n| `uint` | Unsigned 32-bit integers with values from 0 to 4294967295.\
    \ |\n| `int` | Signed 32-bit integers with values from -2147483648 to 2147483647.\
    \ |\n| `ulong` | Unsigned 64-bit integers with values from 0 to 18446744073709551615.\
    \ |\n| `long` | Signed 64-bit integers with values from -9223372036854775808 to\
    \ 9223372036854775807. |\n\nThe `checked` and `unchecked` operators and statements\
    \ are used to control overflow checking for integral-type arithmetic operations\
    \ and conversions.\n\n## 10.4. Native Integer Types\n\nC# now includes two new\
    \ contextual keywords, `nint` and `nuint`, which represent native signed and native\
    \ unsigned integer types, respectively, which are intended for use in low-level\
    \ libraries. These contextual keywords are only treated as keywords when name\
    \ lookup does not find a viable result at that program location.\n\nThe C# types\
    \ `nint` and `nuint` correspond to the underlying .NET types `System.IntPtr` and\
    \ `System.UIntPtr`, respectively, with compiler support for additional conversions\
    \ and operations for those types as native integer types on a specific platform,\
    \ or operating system.\n\n## 10.5. Floating Point Types\n\nC# supports two floating-point\
    \ types, `float` and `double`, which are represented using the 32-bit single-precision\
    \ and 64-bit double-precision IEC 60559 formats, respectively. Floating point\
    \ number literals are described in the Lexical Analysis chapter.\n\n## 10.6. The\
    \ `decimal` Type\n\nThe `decimal` type is a 128-bit real number type, suitable\
    \ for high-precision calculations. Internally a `decimal` is represented as an\
    \ integer scaled by a power of ten. Decimal numbers are guaranteed to have at\
    \ least 28-digit precision. The `decimal` type has greater precision but may have\
    \ a smaller range than the floating-point types.\n\nIf a `decimal` arithmetic\
    \ operation produces a result whose magnitude is too large for a `decimal`, a\
    \ `System.OverflowException` is thrown.\n"
  mdcn: "\n⑤ 此调用中方法参数 `a` 被称为“非尾随命名参数”，因为它位于位置参数 `'d'` 之前（例如）。\n\n⑥ 此调用中的 `a` 和 `b`\
    \ 必须使用命名参数语法。\n\n## 9.3. `params` 参数\n\n在 C# 中，形式参数列表中的最后一个参数可以是 `params` 数组参数，它由以下部分组成\n\
    \n- 可选\n- `params` 关键字\n- 一维数组类型，以及\n- 参数名。\n\n`params` 参数是值参数。（但请注意，数组是引用类型。）在方法调用中，`params`\
    \ 参数的参数可以指定为数组值，也可以指定为零个、一个或多个数组元素类型的参数。例如，给定以下函数，\n\n```csharp\nstatic int AddAll(params\
    \ int[] operands) => operands.Sum();\n```\n\n可以将其与 int 数组参数一起调用，\n\n```csharp\n\
    var ints = new int[] { 1, 2, 3 };\nvar sum1 = AddAll(ints);\nConsole.WriteLine($\"\
    sum = {sum1}\");\n```\n\n## 9.4. 值参数\n\n未使用任何参数修饰符声明的形式参数默认为值参数。值参数对应于一个局部变量，其初始值来自函数中提供的相应参数。因此，参数应为可隐式转换为参数类型的表达式。\n\
    \n## 9.5. `in` 参数\n\n使用 `in` 或 `ref` 修饰符的参数按引用传递。`in` 关键字指定被调用的方法不修改值。`in` 参数对应于局部\
    \ `ref readonly`。`in` 参数使用参数规范中的 `in` 修饰符声明，并且可以包含默认值。例如，\n\n```csharp\nstatic\
    \ void PrintCoord(in Coord cord) =>\n    Console.WriteLine($\"Lat = {cord.Lat};\
    \ Lon = {cord.Lon}\");\nrecord struct Coord(float Lat, float Lon);\n```\n\n① `in`\
    \ 参数 `cord` 使用按引用调用语义。`PrintCoord` 函数无法修改其值。\n\n此函数可以带或不带 `in` 关键字调用。\n\n```csharp\n\
    var coord = new Coord(40.0f, -100.0f);\nPrintCoord(coord);\nPrintCoord(in coord);\n\
    ```\n\n尽管它使用引用语义，但它不能更改 `in` 参数的值。因此，可以在不必担心数据可变性的情况下预期一定的性能提升。\n\n## 9.6. `out`\
    \ 参数\n\n使用 `out` 修饰符声明的参数是输出参数。相应的参数按引用传递。例如，\n\n```csharp\nstatic void SetCoord(out\
    \ Coord c) =>\n    c = new(0.0f, 0.0f);\n```\n\n① `out` 参数在被赋值之前不能被引用，并且必须在函数返回之前被赋一个值。\n\
    \n要使用 `out` 参数，方法定义和调用方法都必须显式使用 `out` 关键字。您可以在方法调用的参数列表中声明一个新的 `out` 变量。例如，\n\n\
    ```csharp\nSetCoord(out var c);\nConsole.WriteLine($\"Lat = {c.Lat}; Lon = {c.Lon}\"\
    );\n```\n\n① 我们也可以使用显式类型，例如 `SetCoord(out Coord c)`。这或多或少等同于 `Coord c; SetCoord(out\
    \ c);`。\n\n## 9.8. 通过引用返回\n\n### 9.8.1. Ref 返回\n\nC# 方法默认按与参数按值传递类似的方式返回值。相比之下，`ref`\
    \ 返回是方法通过引用返回给调用者的值。也就是说，而不是复制方法返回的值，而是返回其引用。（或者，更准确地说，复制其引用。）`ref` 返回正常工作有三个方面。\n\
    \n方法签名中的返回类型需要以 `ref` 为前缀。例如，`public ref MyStruct`。\n\n方法体中 `return` 语句的表达式需要标记为\
    \ `ref`。例如，`return ref`。\n\n为了使调用者能够修改对象的状态，`ref` 返回值需要被赋给一个 `ref` 局部变量。\n\n###\
    \ 9.8.2. Ref 只读返回\n\n被调用的方法也可以将返回值声明为 `ref readonly` 以通过引用返回该值，同时强制调用代码不能修改返回值。调用方法可以通过将值存储在局部\
    \ `ref readonly` 中来避免复制返回值。例如，\n\n```csharp\nstatic class RefReturnDemo {\n  \
    \  static ref readonly Coord Move(ref Coord moving) =>\n        ref moving; //\
    \ return ref\n    public static void PrintAfterMove(Coord here) {\n        ref\
    \ readonly var t = ref Move(ref here);\n        Console.WriteLine($\"Lat = {t.Lat};\
    \ Lon = {t.Lon}\");\n    }\n}\n```\n\n## 10. 内置值类型\n\n本章将介绍几种简单类型。内置的 `string`\
    \ 类型将在下一章讨论。\n\n## 10.1. `bool` 类型\n\nC# `bool` 类型是 .NET `System.Boolean` 结构类型的别名，其值可以是\
    \ `true` 或 `false`。`bool` 类型的默认值是 `false`。也就是说，`default(bool)` 返回 `false`。\n\n\
    ### 10.1.1. 可空的 `bool?` 类型\n\n可空的 `bool?` 类型可用于三值逻辑，例如在处理支持三值布尔类型的数据库时。预定义的 `&`\
    \ 和 `|` 运算符支持 `bool?` 操作数的三值逻辑。\n\n## 10.2. `char` 类型\n\nC# `char` 类型是 .NET `System.Char`\
    \ 结构类型的别名，表示 UTF-16 编码中的 Unicode 字符。`char` 类型的默认值是 `'\\0'`；也就是说，`default(char)`\
    \ 返回 `'\\0'`。\n\n### 10.2.1. 字符字面量\n\n您可以使用以下方式指定 `char` 值：\n\n- 一个字符字面量。\n- Unicode\
    \ 转义序列；或\n- 十六进制转义序列，例如 `\\x` 后跟字符代码的十六进制表示。\n\n## 10.3. 整数类型\n\nC# 支持 11 种整数类型：四种无符号整数类型和四种有符号整数类型，均使用二进制补码格式表示。`char`\
    \ 类型也是整数类型。此外，C# 还包括两种本机整数类型，`nint` 和 `nuint`。\n\n| 类型 | 描述 |\n| --- | --- |\n\
    | `byte` | 值范围为 0 到 255 的无符号 8 位整数 |\n| `sbyte` | 值范围为 -128 到 127 的有符号 8 位整数 |\n\
    | `ushort` | 值范围为 0 到 65535 的无符号 16 位整数。 |\n| `short` | 值范围为 -32768 到 32767 的有符号\
    \ 16 位整数。 |\n| `uint` | 值范围为 0 到 4294967295 的无符号 32 位整数。 |\n| `int` | 值范围为 -2147483648\
    \ 到 2147483647 的有符号 32 位整数。 |\n| `ulong` | 值范围为 0 到 18446744073709551615 的无符号\
    \ 64 位整数。 |\n| `long` | 值范围为 -9223372036854775808 到 9223372036854775807 的有符号 64\
    \ 位整数。 |\n\n`checked` 和 `unchecked` 运算符和语句用于控制整数类型算术运算和转换的溢出检查。\n\n## 10.4. 本机整数类型\n\
    \nC# 现在包含两个新的上下文关键字，`nint` 和 `nuint`，它们分别表示本机有符号和本机无符号整数类型，旨在用于低级库。这些上下文关键字仅在名称查找在该程序位置找不到可行结果时才被视为关键字。\n\
    \nC# 类型 `nint` 和 `nuint` 分别对应于底层的 .NET 类型 `System.IntPtr` 和 `System.UIntPtr`，编译器支持在特定平台或操作系统上将这些类型作为本机整数类型的额外转换和操作。\n\
    \n## 10.5. 浮点类型\n\nC# 支持两种浮点类型，`float` 和 `double`，它们分别使用 32 位单精度和 64 位双精度 IEC\
    \ 60559 格式表示。浮点数字面量在词法分析章节中描述。\n\n## 10.6. `decimal` 类型\n\n`decimal` 类型是 128 位实数类型，适用于高精度计算。内部\
    \ `decimal` 表示为按十的幂缩放的整数。十进制数保证至少有 28 位精度。`decimal` 类型的精度更高，但范围可能小于浮点类型。\n\n如果\
    \ `decimal` 算术运算产生的结果的绝对值对于 `decimal` 来说太大，则会抛出 `System.OverflowException`。\n"
