    # 12.1. Generic Type Parameters'
  - '[PAGE 145]


    # 12.1.1. Type parameters


    A generic type (and, a generic method, etc.) includes one or more type parameters
    (within angular brackets By declaring particular types for these type parameters,
    a specific constructed type is created.


    A type parameter is an identifier designating a value type or reference type that
    the parameter is to be bound to. Since a type parameter can be instantiated with
    many different type arguments, type parameters have slightly different operations
    and restrictions than other (real) types. For example, a type parameter cannot
    be used directly to declare a base class or interface in a generic type declaration.


    As a type, type parameters are purely a compile-time construct. At run time, each
    type parameter is bound to a run-time type that was specified by supplying a type
    argument to the generic type declaration. The run-time execution of all statements
    and expressions involving type parameters uses the type that was supplied as the
    type argument for that parameter.'
  - '[PAGE 146]


    # 12.1.2. Constraints on type parameters


    Type constraints indicate what capabilities a type argument should have. Constraints
    are specified using a contextual keyword, If a type argument is used that does
    not satisfy the given constraint, the compiler will issue an error (or, a warning
    in some cases).'
  - '[PAGE 147]


    # 12.2. Type Parameter Constraints


    The support for generic type constraints, both in terms of syntax and semantics,
    has been greatly extended over the past few C# releases. The following types of
    type parameter constraints are currently supported as of C# 11.'
  - '[PAGE 148]


    # 12.2.1. The notnull constraint


    ```

    class <T> where T : notnull { }

    ```


    The type argument T must be a non-nullable type. You can use the notnull constraint
    to specify that the type argument must be a non-nullable value type or non-nullable
    reference type. Unlike most other constraints, if a type argument violates the
    notnull constraint, the compiler generates a warning instead of an error.'
  - '[PAGE 149]


    # 12.2.2. The default constraint


    ```

    class <T> where T : default { }

    ```


    The default constraint implies that the base method does not have a class or struct
    constraint. This constraint resolves the ambiguity when you need to specify an
    unconstrained type parameter when you override a method or provide an explicit
    interface implementation.'
  - '[PAGE 150]


    # 12.2.3. The new() constraint


    ```

    class <T> where T : new() {}

    ```


    The new() constraint asserts that T must have a public parameterless constructor.
    When used together with other constraints, the new() constraint must be specified
    last.'
  - '[PAGE 151]


    # 12.2.4. The enum constraint


    ```

    class `<T>` where `T` : System.Enum { }

    ```


    You can use any System.Enum types as a base class. With the enum constraint, the
    type parameter T can be used with the System.Enum static methods. T can also be
    used in a context where a specific enum type is expected.'
  - '[PAGE 152]


    # 12.2.5. The delegate constraints


    ```

    ```csharp

    class C1<T> where T : System.Delegate { }

    class C2<T> where T : System.MulticastDelegate { }

    ```

    ```


    The generic type argument T must be a System.Delegate or System.MulticastDelegate
    type. The delegate constraint enables you to write code that works with delegates
    in a type-safe manner.'
  - '[PAGE 153]


    # 12.2.6. The struct constraint


    ```

    class <T> where T : struct { }

    ```


    The type argument T must be a non-nullable value type. Because all value types
    have an accessible parameterless constructor, the struct constraint implies the
    new() constraint, and they cannot be combined.'
  - '[PAGE 154]


    # 12.2.7. The class constraint


    ```

    class<T> where T : class { }

    ```


    This constraint asserts that T must be a non-nullable reference type. It applies
    to or When a type argument is a nullable reference type, a warning is issued.'
  - '[PAGE 155]


    # 12.2.8. The class? constraint


    ```

    class<T> where T : class? { }

    ```


    It asserts that T must be a reference type, either nullable or non-nullable.'
  - '[PAGE 156]


    # 12.2.9. Interface type constraints


    ```

    class <T> where T : I1, I2, I3<T> { }

    ```


    Specific interfaces, one or more, can be specified as part of a type constraint.
    In such a case, the type argument must be either an interface that inherits, or
    a non-nullable type that implements, the given interfaces, e.g., and I3 in this
    example.


    As shown, the constraining interfaces can be generic. it must be a non-nullable
    type that implements the specified interface,


    ```

    class <T> where T : I1, I2, I3<T?> { }

    ```


    This constraint is equivalent to the previous example, T : I1, I2, except that
    T can be a nullable or non-nullable reference type as well as a non-nullable value
    type.'
