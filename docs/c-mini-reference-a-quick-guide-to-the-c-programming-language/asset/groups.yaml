    \ 提供了简洁的语法来创建和使用记录。特别是，它支持用于创建记录类型的位置参数。例如，现在创建记录类型就像声明一个记录构造函数一样简单。编译器会自动生成整个类以及若干方法。\n\
    \n```csharp\nrecord Book(string Title, string Author);\n```\n\n结构体是值类型，基于 System.ValueType\
    \ 基类，而该基类又继承自 System.Object。结构体类型本身不支持继承。还存在一些特殊种类的结构体，例如只读结构体、ref 结构体和记录结构体。\n\
    \nC# 支持扩展方法，扩展方法是与其他现有类型关联的静态方法。扩展方法可以像目标类型的实例方法一样被调用。\n\n在本书的第一部分，我们主要关注类型。在本书其余部分，我们会介绍\
    \ C# 中其余的重要构造，例如表达式和语句。\n\nnew 运算符是 C# 表达式最重要的组成部分之一。它用于创建数组，或创建指定类型（例如类或结构体）的新值或新对象。本章中我们还会介绍对象初始值设定项和集合初始值设定项语法。\n\
    \n除了其他编程语言中常见的表达式外，C# 中还有许多不同种类的表达式。本书通篇都会讨论表达式和运算符，但一些更常见的表达式集中在表达式章节中介绍。lambda\
    \ 表达式是匿名函数。它使用“粗箭头”=> 运算符定义。Lambda 函数可以作为参数传递给其他方法。\n\nC# 的语句与其他 C 风格语言中的语句大体相同，只有一些细微差别。我们在语句章节中快速过一遍\
    \ C# 的所有语句，主要是为了完整性。\n\nswitch 语句最初基于 C 的 switch-case 语句，它的一项显著变化是现在支持模式匹配，以及\
    \ is 和 switch 表达式。模式匹配最初由 Haskell 等函数式编程语言推广，如今已成为许多（函数式或命令式）编程语言不可或缺的一部分，包括 C#。\n\
    \nusing 语句和 using 声明用于管理使用后需要清理的资源，例如文件句柄或数据库连接。当实现 IDisposable 接口的对象超出作用域时，会自动调用其\
    \ Dispose 方法。\n\n最后，我们通过对 C# 异常和特性的简要描述来结束这本迷你参考手册。异常使用 throw 语句抛出，它们表示程序执行期间的不寻常或异常情况。在\
    \ C# 中，异常处理使用 try 语句实现。特性是一种声明性标记，用于向运行时传达有关代码中各种元素（例如类、方法和属性）行为的信息。C# 特性只是继承自\
    \ System.Attribute 的常规类。\n\n需要注意的一点是，尽管本书涵盖了广泛的主题，但为了秉承“迷你参考手册”的精神，将篇幅控制在可管理的范围内，我们仍省略了\
    \ C# 的一些重要部分。\n\n这些包括 LINQ（语言集成查询）、表达式树、反射、异步编程、迭代器和异步流、泛型数学，以及委托和 .NET Func 与\
    \ Action 类型等。我们还省略了许多常用的 .NET 类型，例如 List、Set 和 Dictionary，它们实际上是 C# 的核心部分。鼓励读者就这些主题及更多内容查阅其他资源。此外，本书不讨论不安全代码。\n\
    \n## 2. C# 程序\n\n一个 C# 程序可以由一个或多个源代码文件（称为编译单元）组成，例如位于文件系统中的一个或多个目录中。程序（可执行文件或库）中的所有源文件会一起编译，因此源文件之间没有特定顺序。\n\
    \n每个源代码文件可以包含一组特殊声明和自定义类型定义。类型定义可以包含在零个或多个嵌套命名空间中。C# 中的命名空间是一种逻辑组织单元，主要用于降低名称冲突的可能性。\n\
    \n### 2.1. Main 方法\n\n可执行的 C# 程序（或“应用程序”）应当包含一个具有 Main() 静态方法的类型声明（例如类或接口），或者包含一个带有“顶级语句”的源文件。这是程序的入口点。\n\
    \nMain() 静态方法可以返回 int 类型的值，也可以不返回任何值（由 void 返回类型表示）。它可以接受 string[] 类型的参数，也可以定义为没有任何方法参数。Main()\
    \ 方法可以是同步的，也可以声明为 async 并返回 Task 或 Task<int>。\n\n因此，Main() 静态方法的有效签名有以下八种组合：\n\
    \n```csharp\nstatic void Main() { /* ... */ }\nstatic int Main() { /* ... */ }\n\
    static void Main(string[] args) { /* ... */ }\nstatic int Main(string[] args)\
    \ { /* ... */ }\nstatic async Task Main() { /* ... */ }\nstatic async Task<int>\
    \ Main() { /* ... */ }\nstatic async Task Main(string[] args) { /* ... */ }\n\
    static async Task<int> Main(string[] args) { /* ... */ }\n```\n"
