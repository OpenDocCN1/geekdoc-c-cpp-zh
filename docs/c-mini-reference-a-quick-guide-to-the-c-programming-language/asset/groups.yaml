    # ### 3.4. Compiler Directives


    In C#, the compiler directives, also known as "pre-processing directives", are
    processed as part of the lexical analysis phase (e.g., and not as a separate pre-processing
    step). They can be used to conditionally skip sections of compilation units, to
    report error and warning conditions, or to mark certain regions of source code.


    The following pre-processing directives are available:


    +   - `#undef` — Used to define and undefine conditional compilation symbols.

    +   - `#endif` — Used to skip sections of code based on the compilation symbols.

    +   - `#line` — Used to control line numbers emitted for errors and warnings.
    Since C# 10, the `#line` directive can accept up to 5 decimal numbers as arguments,
    e.g., the start line, start character, end line, end character, and character
    offset.

