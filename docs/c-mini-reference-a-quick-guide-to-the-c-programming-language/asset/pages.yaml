- pgno: 30
  md: '# 1. Introduction


    C# is a rather complex language. In fact, depending on how you measure the complexity
    of a programming language, C# could be the most complex language among some of
    the widely used languages. No one likes complexity. And yet, C# is one of the
    most popular and favorite languages for many developers. Why?


    A programming language is a tool. Sometimes, having a complex and flexible tool
    can make doing a real task much simpler and easier. Using a chainsaw can make
    the task of cutting a tree easier, for example. That’s the case with C#.


    There are a few implications for this. On the one hand, C# is not generally considered
    a beginner-friendly language. There is an upfront investment you need to make
    before you can reap the benefits. On the other hand, C# can be a powerful tool
    for building a large, enterprise-grade software once you master the tool.


    In general, you will end up with "simpler" programs using "more complex" languages
    like C#. At least, that''s the idea. Hence, it is rather important to use C# correctly
    and Otherwise, the downside of using a heavyweight language, if you will, will
    be bigger than the benefits of using such a language.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'This book provides a bird’s eye view of the C# language grammar. It is organized
    into a few dozen semi-independent chapters, covering most of the important features
    of C#.


    A programming language is not just a sum of its features. In order to be able
    to use a language like C# most effectively, however, you will need to know what
    features are available at your disposal. You will need to have a thorough high-level
    understanding of each of these features. As stated in the preface, the readers
    are encouraged not to lose the sight of the forest while going through each of
    these trees.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.1. C# and .NET


    At the risk of oversimplifying, there are three aspects to a programming language,
    and programming in that language:


    +   - The language itself, e.g., the grammar and the standard library,

    +   - The runtime, and

    +   - The tooling (e.g., the language compiler).


    As an example, the C++ programming language specification is managed by the ISO.
    On the other hand, toolings are provided by various tool vendors like Microsoft,
    GNU/gcc, and clang. C++ has no separate runtime per se, other than the standard
    library support at run time. C++ programs are directly compiled to a machine code.


    In case of C# and .NET, Microsoft more or less owns a whole ecosystem comprising
    all three parts of the C# language. (We do not discuss other implementations of
    C# such as those used in Unity, etc.) The .NET system defines a set of standard
    libraries and their run time support. .NET is also a runtime, or a virtual machine,
    that runs the byte code compiled from C# programs.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Microsoft’s .NET has a very complicated history, with many different versions
    and manifestations, and with many different (and ever-changing) names. The framework,
    and the version, that we use in this book is simply called .NET 7 (which was originally
    called .NET Core). This is a cross-platform version of the .NET framework. That
    is, once you create a C# program targeting .NET 7, you can run it on any system
    that is supported by .NET 7. (In addition, .NET, in general, supports multiple
    programming languages.)


    Another implication of this rather tightly integrated ecosystem is that C# does
    not stand by itself. In fact, at least in principle, you will not be able to read
    and interpret C# programs precisely without knowing what their associated .NET
    framework is.


    This is not necessarily unique to C#, with all programming languages evolving
    over time, etc. But, in case of C# and .NET, the interdependency is much tighter.


    C# uses a project file to manage build configurations and what not. The default
    version of C# for .NET 7 is C# 11. That is, if you plan to use a different version
    of C# on .NET 7, for instance, then you will need to explicitly specify that in
    the project file.


    When you scaffold an empty C# project on .NET 7, e.g., using Visual Studio or
    dotnet CLI, it creates the following placeholder project file:


    Listing 1. SampleProject.csproj


    ```

    ~~~xml

    <Project Sdk="Microsoft.NET.Sdk">

    ~~~

    ```'
  merge: -1
  img_proc: true
