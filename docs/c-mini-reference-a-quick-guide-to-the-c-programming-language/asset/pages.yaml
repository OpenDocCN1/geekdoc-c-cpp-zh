  md: '# 10.6. The decimal Type


    The decimal type is a 128-bit real number type, suitable for high-precision calculations.
    Internally a decimal is represented as an integer scaled by a power of ten. Decimal
    numbers are guaranteed to have at least 28-digit precision. The decimal type has
    greater precision but may have a smaller range than the floating-point types.


    If a decimal arithmetic operation produces a result whose magnitude is too large
    for a System.OverflowException is thrown.'
