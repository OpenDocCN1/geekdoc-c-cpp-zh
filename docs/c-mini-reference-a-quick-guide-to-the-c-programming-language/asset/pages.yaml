- pgno: 136
  md: "# 11.2. Verbatim String Literals\n\nVerbatim string literals start with @ and\
    \ they are also enclosed in double quote characters. They are sometimes called\
    \ \"@-quoted strings\". Special characters in verbatim string literals need not,\
    \ and should not, be escaped, which make them easier to write. In particular,\
    \ verbatim string literals preserve new line characters as part of the string\
    \ text. Hence, verbatim strings are convenient for multi-line strings, or strings\
    \ that contain many backslash etc. A double quotation mark in an @-quoted string\
    \ can be escaped as two quotation marks\n\nFor example,\n\n```\nConsole.WriteLine(@\"\
    \"\"Hello world\"\" is\n    really a cliche now.\");\n```\n\nThis statement will\
    \ print out\n\n```\n\"Hello world\" is\n    really a cliche now.\n```\n\n①\n\n\
    Notice that the leading white space characters as well as the newline at the end\
    \ of the first line are included in the output."
  merge: -1
  img_proc: true
- pgno: 137
  md: "# 11.3. Raw String Literals\n\nA new form of raw string literal has been introduced\
    \ in C# 11, which starts with a three or more double-quote character sequence,\
    \ e.g., and ends with the same character sequence, e.g., with the same number\
    \ of double quotes.\n\nThe opening double-quote sequence can be immediately followed\
    \ by an optional new line, in which case the enclosed string content should also\
    \ end with a new line. These new lines are not part of the string literal. When\
    \ the opening double-quote sequence is not followed by a new line, the raw string\
    \ literal cannot include new lines, and the closing double quote sequence should\
    \ be on the same line.\n\nFor a multiline raw string the starting position of\
    \ the ending double-quote sequence sets the \"trim line\" for the enclosed string\
    \ literal content. That is, the spaces before that position in the string literal\
    \ are not considered part of the string. For example,\n\n```\nvar xml = \"\"\"\
    \n    <element attr=\"content\">\n        <body>My body</body>\n    </element>\n\
    \"\"\";\n```"
