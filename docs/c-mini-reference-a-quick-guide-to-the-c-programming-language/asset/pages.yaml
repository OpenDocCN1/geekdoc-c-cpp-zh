- pgno: 145
  md: '# 12.1.1. Type parameters


    A generic type (and, a generic method, etc.) includes one or more type parameters
    (within angular brackets By declaring particular types for these type parameters,
    a specific constructed type is created.


    A type parameter is an identifier designating a value type or reference type that
    the parameter is to be bound to. Since a type parameter can be instantiated with
    many different type arguments, type parameters have slightly different operations
    and restrictions than other (real) types. For example, a type parameter cannot
    be used directly to declare a base class or interface in a generic type declaration.


    As a type, type parameters are purely a compile-time construct. At run time, each
    type parameter is bound to a run-time type that was specified by supplying a type
    argument to the generic type declaration. The run-time execution of all statements
    and expressions involving type parameters uses the type that was supplied as the
    type argument for that parameter.'
  merge: -1
  img_proc: true
