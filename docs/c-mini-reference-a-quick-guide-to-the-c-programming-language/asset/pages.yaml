- pgno: 38
  md: '# 1.3. Book Organization


    We start from the top, in terms of the general C# program. A C# program is essentially
    a collection of C# source files that are (to be) compiled together. An executable
    C# program has one and only entry point, which could be a Main method of a startup
    class or the top-level statements in one source code file. We also describe the
    basic concepts of access e.g., public vs namespaces, and blocks and scopes in
    this chapter.


    A source code file is essentially a sequence of characters. We next go through
    some basic process of converting an input sequence of characters to a sequence
    of "tokens" which the compiler understands. This is generally known as "lexing".
