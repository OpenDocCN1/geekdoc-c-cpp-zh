- pgno: 54
  md: '# 2.5.1. Scopes


    C# is a lexically scoped language. The scope of a name is statically determined
    to be a particular region of program text, within which the entity declared by
    the name can be referred to without qualification of the name.


    Scopes can be nested, and an inner scope may redeclare the meaning of a name from
    an outer scope. The name from the outer scope is then said to be "hidden" in the
    region of program text covered by the inner scope, and access to the hidden name
    is only possible by using the qualified name.'
