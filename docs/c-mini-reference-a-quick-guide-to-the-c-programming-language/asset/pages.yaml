- pgno: 35
  md: '# 1.2. Nullable Context


    A variable of a reference type can be The null value simply means that the variable
    points to nothing. That it points to no real data in memory. The default value
    of a reference variable is


    This is true across all different C-style programming languages which support
    the reference types or pointer types. Accessing these variables when they are
    null has been the cause of so many (potentially preventable) errors, called the
    null-pointer exceptions.


    C# has a compile time support to address this problem. This feature is called
    the "nullable context". It is disabled by default, which means that all reference
    variables are nullable, as they always have been. In the enabled nullable context,
    the traditional (nullable) reference variables become non-nullable. Setting these
    variables to null will cause a compile time error. In addition, one can use a
    new kind of reference variables within the enabled nullable context, called the
    "nullable reference variables". All nullable reference variables should be checked
    for nullability before using. Otherwise, the compiler will likely throw compile-time
    errors or warnings.


    You can set the nullable context in the C# project file as we discussed in the
    previous In addition, you can selectively enable or disable the nullable context
    in certain parts of the code using the C#''s compiler To enable, you can put this
    in your source code file:'
  merge: -1
  img_proc: true
- pgno: 36
  md: '```

    #nullable enable

    ```


    This is in effect until the end of the source file, or until the next #nullable
    directive is used, if any. To disable, use the following:


    ```

    #nullable disable

    ```


    You can also restore the previous context value using the following directive:


    ```

    #nullable restore

    ```


    The nullable context is purely a compile time support. The .NET runtime does not
    know anything about the nullable context, and as far as it is concerned, all reference
    variables are nullable.


