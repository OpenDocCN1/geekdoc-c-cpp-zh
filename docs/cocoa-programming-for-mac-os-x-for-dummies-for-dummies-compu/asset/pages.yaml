  md: '# 12 Part I: Developer Tools


    ![](img/ea40cad434a338535474e82c1a6ace20_31_0.png)


    Figure 1-3:

    You can view other types of files in Xcode.


    +   - When you get stuck, Xcode gives you access to the complete collection of
    Cocoa, Xcode, and other developer documentation. You can view and navigate the
    documentation with Xcode in much the same way as you would a Web browser. Figure
    1-4 shows what the screen looks like when documentation is loaded into Xcode.


    When you complete your Cocoa project, you use Xcode to compile, link, and build
    a final application. You can then distribute the application to friends, co-workers,
    and even the world (as long as they use Mac OS X).


    Xcode wears many hats. If you''re accustomed to other environments, you might
    be surprised to discover that Xcode performs tasks that require multiple tools
    in other environments. For example, Xcode functions as a


    +   - Project organizer, managing files and resources in your Cocoa projects


    +   - Code editor, allowing you to write and edit Xcode code


    +   - Browser, displaying built-in documentation or other kinds of resources in
    your Cocoa projects


    +   - Compiler and linker, spitting out a complete Cocoa application at the end
    of the development process'
