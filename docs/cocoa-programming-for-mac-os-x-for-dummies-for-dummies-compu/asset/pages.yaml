    }\n```\n```\n\n# ## Keeping track of windows\n\nMost Cocoa applications have a\
    \ Window menu to help users keep track of open windows. Normally, this menu lists\
    \ the open document windows. (You probably wouldn't display, say, a toolbar window\
    \ in the Window menu.) The great thing about the Window menu is that Cocoa takes\
    \ care of it for you automatically. If your window has the following properties,\
    \ Cocoa automatically adds it to the Window menu:\n\n+   - Has a title bar\n-\
    \ Is resizable\n- Can become the main window\n\nYou can exclude a window from\
    \ the Window menu by altering any one of these properties.\n\n> If you have a\
    \ window that obeys each of these rules but you still want it left out of the\
    \ Window menu, use the `setExcludedFromWindowsMenu:` method. The `awakeFromNib`\
    \ method is a good place to use this call because the method takes effect when\
    \ your application launches and the window resources is loaded from the NIB file.\n\
    \n```\n```objective-c\n- (void)awakeFromNib {\n    [theWindow setExcludedFromWindowsMenu:nil];\n\
    }\n```\n```"
