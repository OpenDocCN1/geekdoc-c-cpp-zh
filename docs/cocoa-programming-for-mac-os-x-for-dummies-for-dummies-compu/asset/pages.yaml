- pgno: 293
  md: "# Setting Up the Print Job and Printing the View\n\nTo add printing, all you\
    \ have to do is implement the printOnePage action that you defined as part of\
    \ MyPrintController in the preceding section. Click the MyPrintController.m file\
    \ in Xcode and change its code to read\n\n```\n```\n#import \"MyPrintController.h\"\
    \n\n@implementation MyPrintController\n\n- (IBAction)showPagePanel:(id)sender\
    \ {\n    int i;\n    thePrintInfo = [NSPrintInfo sharedPrintInfo];\n    NSPageLayout\
    \ *pageLayout = [NSPageLayout pageLayout];\n    i = [pageLayout\n         runModalWithPrintInfo:(NSPrintInfo\
    \ *)\n             thePrintInfo];\n}\n\n- (IBAction)printOnePage:(id)sender\n\
    {\n\n    thePrintInfo = [NSPrintInfo sharedPrintInfo];\n    NSPrintOperation *thePrintOperation;\n\
    \n    thePrintOperation =\n        [NSPrintOperation printOperationWithView:\n\
    \         myCanvasView printInfo:thePrintInfo];\n\n    [thePrintOperation setShowPanels:\
    \ YES];\n    [thePrintOperation runOperation];\n}\n\n@end\n```\n```\n\nThe printOnePage\
    \ method takes care of running the Print panel and executing the print job in\
    \ this way:\n\n+   1. It creates an NSPrintOperation instance using the class\
    \ method printOperationWithView.\n\n+   2. You pass the printOperationWithView\
    \ method a view to print and an NSPrintInfo instance."
  merge: -1
  img_proc: true
- pgno: 294
  md: '+   3. The `printOperationWithView` method returns an instance of `NSPrintOperation`.

    4. (Optional but typical in most applications) If you want to display the Print
    panel, call the `setShowPanels`, passing it a Boolean value of YES.

    5. The `runOperation` method of the `NSPrintOperation` object runs the print job.


    Cocoa takes care of everything else for you, including dismissing the Print panel
    and printing the view.


    # # Printing to Places Other Than a Printer


    So far, you’ve implemented some pretty boring stuff. Printing is nice, but it’s
    become a standard requirement on all applications and operating systems and it’s
    not altogether exciting. When it comes to printing, Cocoa really shines in its
    capability to print directly to PDF (Portable Document Format) files. Instead
    of printing your view to a standard printer, you can ask Cocoa to save it to a
    PDF-formatted file instead. PDF is a standard format for publishing and printing
    documents. In the past, you had to rely on third-party solutions when creating
    PDF content on the fly. With Cocoa, it’s as easy as adding a few lines of code
    to your project.


    Before you begin adding PDF features to your project, you should know that you
    already have one form of PDF printing: The user can click the PDF button that’s
    at the bottom of the Print panel.


    Here’s a more elegant solution if you don’t like that users have to open the Print
    panel to print to PDF:


    +   1. Open the MainMenu.xib file in the project for this chapter.

    2. Add a new push button to the existing interface by dragging one from the Library
    window.


    Figure 14-6 shows what the interface looks like.'
  merge: -1
  img_proc: true
