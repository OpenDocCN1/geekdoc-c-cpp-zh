- pgno: 298
  md: '# ## Chapter 15


    # # Cocoa on the Internet


    +   **In This Chapter**


    - Loading a Web site with Cocoa

    - Downloading files from the Internet

    - Sending e-mails with only a few lines of code


    The last two decades of personal computing have witnessed explosive growth in
    networking technologies. Consequently, the vast majority of personal computer
    owners use the Internet, many on a daily basis. Among the various means of communication
    available to a user on the Internet, the World Wide Web and e-mail stand out as
    the two main tools that everyone uses.


    In this chapter, you explore the wild and wooly world of the Internet and see
    how it applies to Cocoa applications. The chapter starts by showing you how to
    load Web pages, download files, and render HTML (HyperText Markup Language) in
    your own projects. Later, you add e-mail features to your application as well.
    By the end of this chapter, you’ll have a fully functional project that performs
    some important Internet functions. Although it’s not necessarily the kind of application
    you’ll want to use for your next best-selling killer app, it can serve as a handy
    reference for future projects.


    # ## Interacting with the Web


    Just over a decade ago, few were familiar with the Internet or the World Wide
    Web. Now, even your dog has a domain name, an e-mail address, and a MySpace account.
    Computer users have eaten up all that the Internet has to offer and in the process
    have become discerning consumers. They expect instant connectivity to any Web
    site in the world. Luckily, Cocoa has you covered. Perhaps the two most popular
    tasks on the Web are viewing Web pages and downloading files. With only a few
    lines of code, Cocoa gives you the ability to offer these important Internet functions
    in your own applications.'
  merge: -1
  img_proc: true
- pgno: 299
  md: "# ## Loading a Web page in a browser\n\nLoading a URL (Uniform Resource Locator)\
    \ into a Web browser is one of the most common Internet-related tasks that you'll\
    \ want to perform. It comes in handy for directing users to online documentation,\
    \ to a download page where they can get the latest version of your application,\
    \ or even to your Web-based store to purchase software.\n\nBecause viewing Web\
    \ pages is a task that you perform so frequently, Cocoa provides a class to handle\
    \ the dirty work for you: NSWorkspace. The NS Workspace class gives users easy\
    \ access to miscellaneous utilities. Every application has one, and only one,\
    \ NSWorkspace object. By calling the openURL method of the NSWorkspace instance,\
    \ you can load and view a URL with the default Web browser.\n\nTo use your application's\
    \ NSWorkspace instance, and, more important, its openURL method, use code like\
    \ this:\n\n```\n```\n[NSWorkspace sharedWorkspace] openURL:theURL]\n```\n```\n\
    \nThis code snipp et works by calling the sharedWorkspace class method of NSWorkspace.\
    \ From there, it's a simple matter of calling the openURL method and passing it\
    \ a valid URL in the form of an NSURL. The NSURL class lets you wrap a traditional\
    \ URL in a Cocoa object. You can define an NSURL with a hard-coded URL:\n\n```\n\
    ```\nNSURL *theURL = [NSURL URLWithString:@\"http://www.wiley.com\"];\n```\n```\n\
    \nIf you want users to supply the URL in an NSTextField (with a theURL Field outlet)\
    \ in your app's interface, you might do something like this instead:\n\n```\n\
    ```\nNSURL *theURL = [NSURL URLWithString:[theURLField stringValue]];\n```\n```\n\
    \nBecause openURL returns a Boolean value, you can determine whether the command\
    \ executed successfully. For example, if you create a loadWebPage action, the\
    \ code might look like this:\n\n```\n```\n- (IBAction)loadWebPage:(id) sender\n\
    {\n NSURL *theURL = [NSURL URLWithString:[theURLField\n stringValue]];\n\n if\
    \ ( [NSWorkspace sharedWorkspace] openURL:theURL ] )\n NSLog(@\"URL Loaded\");\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 300
  md: "If the `openURL` method performs as it should, the code displays a `URL Loaded`\
    \ message on the screen.\n\n# ## *Downloading files*\n\nAnother important feature\
    \ that you may want to add to your Cocoa applications is the capability to download\
    \ files from the Internet without using a browser. You can use download functionality\
    \ for a variety of situations:\n\n+   - Offer instant one-click access to the\
    \ latest version of your application on the Web.\n- Download and display HTML\
    \ help files from your Web site.\n- Retrieve a file from the Web that lists the\
    \ current version of your application.\n\nCocoa makes it easy to offer all these\
    \ features and more. With only two lines of code, you can download a file from\
    \ the Web to your hard drive. This example loads the *For Dummies* home page:\n\
    \n```\n```objective-c\nNSURL *theURL = [NSURL URLWithString:@\"http://www.dummies.\
    \ com\"]; \nNSData *pageData = [theURL resourceDataUsingCache:YES];\n```\n```\n\
    \nLike the browser code from earlier in this chapter, you first define an `NSURL`.\
    \ In this example, the URL is hard-coded to www.dummies.com. Although hard-coding\
    \ may suffice for some purposes, other times you'll want to be more flexible in\
    \ your approach to creating a URL. Because the `URLWithString` parameter is an\
    \ `NSString`, you can use any of the usual `NSString` functions with it, including\
    \ retrieving the URL from the interface.\n\n![](img/ea40cad434a338535474e82c1a6ace20_300_0.png)\n\
    \nDon't forget that an `NSURL` doesn't necessarily have to point to a file somewhere\
    \ on the Web. It can also point to a file on your local hard drive. For example,\
    \ you can use the `initFileURLWithPath` method of `NSURL` to build a URL to a\
    \ local file, based on its path. Check the built-in Cocoa documentation in Xcode\
    \ to see the complete list of `NSURL` methods.\n\nAfter you create and define\
    \ an `NSURL`, call its `resourceDataUsingCache` method to begin downloading the\
    \ file into memory. In the preceding code snippet, `pageData` points to data in\
    \ memory. From there, transferring that data from memory to a file on your hard\
    \ drive is a simple matter. For example, if you want to save a simple HTML document\
    \ to your desktop, call the `writeToFile` method of the `NSData` class."
  merge: -1
  img_proc: true
- pgno: 301
  md: "If you pass a relative path (for example, ~/Downloads/download.html) to the\
    \ `writeToFile` method, you must expand it into a full URL with the `stringByExpandingTildeInPath`\
    \ method:\n\n```\n```\nif ([pageData writeToFile:[@\"~/Downloads/download.html\"\
    \n    stringByExpandingTildeInPath]\n    atomically:YES])\n{\n    NSLog(@\"download\
    \ successful\");\n}\n```\n```\n\nOne shortcoming of this download-and-save-to-disk\
    \ approach is that it functions in a synchronous manner. Your application won't\
    \ do anything else until the file has finished downloading. This may suffice for\
    \ small downloads, but larger downloads become troublesome. The solution is to\
    \ use the `loadResourceDataNotifyingClient` method instead of `resourceDataUsingCache`:\n\
    \n```\n```\n[theURL loadResourceDataNotifyingClient:self\n    usingCache:YES];\n\
    ```\n```\n\nThis method enables you to perform other functions while downloading\
    \ the file. If you implement the `URLResourceDidFinishLoading` method, Cocoa notifies\
    \ you when the download finishes, giving you the chance to access the data. For\
    \ example, to save the download to an HTML file on the desktop, implement the\
    \ `URLResourceDidFinishLoading` method like this:\n\n```\n```\n- (void)URLResourceDidFinishLoading:\
    \ (NSURL *)sender\n{\n    NSData *pageData = [sender resourceDataUsingCache:YES];\n\
    \    if ([pageData writeToFile:[@\"~/Downloads/download.html\"\n        stringByExpandingTildeInPath]\
    \ atomically:YES])\n    {\n        NSLog(@\"download successful\");\n    }\n \
    \   else\n    {\n        NSLog(@\"download failed\");\n    }\n}\n```\n```\n\n\
    Just because you're downloading and saving an HTML file in this example doesn't\
    \ mean that you're limited to HTML downloads. You can download any kind of file\
    \ that you want. To download a JPG image, for instance, simply change the URL\
    \ and name of the destination file to indicate that it's a JPG file:\n\n```\n\
    ```\nNSURL *theURL = [NSURL\n    URLWithString:@\" http://purplee.net/images/cocoa_cover.jpg\"\
    ];\n...\n```\n```"
  merge: -1
  img_proc: true
- pgno: 302
  md: "```\nif ([pageData writeToFile:@\"~/Downloads/download.jpg\" \n           \
    \             stringByExpandingTildeInPath]\n                        atomically:YES))\n\
    …\n```\n\n# Building a Web browser\n\nYou could use the code from earlier in this\
    \ chapter to download an HTML file from the Web and display it with a Cocoa control.\
    \ Doing so is possible, but it requires a lot of work. Fortunately, the WebKit\
    \ Framework gives you the ability to load and display Web content very easily.\
    \ So easily in fact, you can do so without writing a single line of code.\n\n\
    At the heart of the WebKit is the webView control, which has built-in methods\
    \ for a variety of Web-related functions that you’d find in a typical Web browser:\n\
