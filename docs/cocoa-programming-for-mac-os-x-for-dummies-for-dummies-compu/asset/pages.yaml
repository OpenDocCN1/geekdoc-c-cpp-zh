  md: 'You can set many other aspects of playback using code. Besides the attributes
    that you found in Interface Builder, you can set the volume of the movie during
    playback. A volume of 1.0 is *full* volume, as defined by the maximum system volume
    level. Thus, a volume of 0.5 is half the maximum system volume level.


    ```

    [*moviePlayer* setVolume:1.0];

    ```


    Alternatively, if you prefer, you can mute the sound:


    ```

    [*moviePlayer* setMuted:YES];

    ```


