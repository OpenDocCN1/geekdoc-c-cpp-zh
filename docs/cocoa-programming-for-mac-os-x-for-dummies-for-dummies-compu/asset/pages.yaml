- pgno: 113
  md: '# 94 Part I: Developer Tools


    +   3. Click the Info button in the project''s toolbar to open the Info window.


    +   4. In the Info window, click the Build tab.


    +   5. Locate and change the Product Name key value.


    The Product Name resides within the Packaging section of the Info Window, as shown
    in Figure 5-6. Changing the Product Name causes your build application to have
    a new name, and that new name is reflected in the About Panel.


    ![](img/ea40cad434a338535474e82c1a6ace20_113_0.png)


    # Displaying a version number, a copyright date, and credits


    Besides using a title to identify your application, it''s also a good idea to
    provide a version number, a copyright, and credits in the About Panel:


    +   The version number helps users know at a quick glance what version of the
    application they are using, in case they want to know when it comes to download
    a new version of the application.'
  merge: -1
