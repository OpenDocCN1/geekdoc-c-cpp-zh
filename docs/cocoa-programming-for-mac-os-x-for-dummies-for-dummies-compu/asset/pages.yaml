- pgno: 79
  md: '# Building an Application


    Now that you''ve set up your project, altered its source code, and browsed the
    classes in it, you''re ready to build the final application. Choose Build+ and
    Go. Xcode then compiles, links, and executes the resulting application.


    ![](img/ea40cad434a338535474e82c1a6ace20_79_0.png)


    You don''t have to build and run, although it''s probably the most common method
    of working in Xcode. You can build your project without running it by choosing
    Build+ Build. This compiles, links, and creates the target application but doesn''t
    execute it. If you''d prefer to use the debugger, choose Build+ and Debug. Table
    3-1 lists the keyboard shortcuts for the various Build commands.


    | Table 3-1 Keyboard Shortcuts for the Build Menu |

    | Function(s) | Keyboard Shortcut | What It Does |

    | Build | Cmd+B | Builds an application from the current project |

    | Build and Run | Cmd+R | Builds an application and then executes it |

    | Build and Debug | Cmd+Y | Builds and launches an application from the current
    project and then starts the debugger |

    | Clean | Cmd+Shift+K | Cleans the current project by removing all object code
    from |


    In the standard menu items and corresponding keyboard shortcuts, Xcode gives you
    easy access to the Build and Run function by means of a button in the toolbar
    project window. Figure 3-15 shows the location and function of this button.


    Whenever you click the Build and Go toolbar, it turns into a stop sign. While
    the build or debugging processes, you can halt the process. Sometimes it takes
    a while to complete a build. If you forget to do something before building, it''s
    handy to be able to stop the build operation. That way, you can avoid the wait
    of completing the build and get back to work.


    After you complete a successful build, your new application appears in the Build
    folder of your project''s main folder in Finder. You can then distribute and run
    this application on any other computer that uses Mac OS X, which is the main goal
    of programming in Cocoa.'
  merge: -1
