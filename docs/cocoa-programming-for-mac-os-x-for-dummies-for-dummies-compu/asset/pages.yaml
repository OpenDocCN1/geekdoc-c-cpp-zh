  md: "```\nNSRange theRange;\ntheRange = NSMakeRange(0, [[textView string] length]);\n\
    [TextView setSelectedRange:theRange];\n```\n\n# # Saving Text for a Rainy Day\n\
    \nEventually, your users will want to save the text on which they’ve been working\
    \ so hard. Cocoa lets you save text in two ways:\n\n**Plain:** Plain text is text\
    \ without any formatting. You see this type of text in HTML and XML documents,\
    \ and plain text files (such as when you press ⌘+Shift+T in the TextEdit application).\
    \ When all you care about is the text data in a file and not its formatting, use\
    \ the plain text format.\n\n**Rich:** Rich text conveys information about the\
    \ formatting. You may recognize the rich text format from popular Microsoft applications,\
    \ such as Word. The rich text file format saves formatting data, such as fonts,\
    \ colors, and styles in the file along with the actual text data. If you’re building\
    \ a word processor or a similar type of application in which formatting matters,\
    \ use the rich text format.\n\nTo see how these two file formats work with Cocoa,\
    \ follow these steps:\n\n+   1. In Xcode, add the following lines of code to the\
    \ MyTextController.h file to define two new actions:\n\n```\n- (IBAction)saveRichTextFile:\
    \ (id) sender;\n- (IBAction)saveTextFile: (id) sender;\n```\n\n+   2. Navigate\
    \ to the MyTextController.m file and implement the two actions:\n\n```\n- (IBAction)saveTextFile:\
