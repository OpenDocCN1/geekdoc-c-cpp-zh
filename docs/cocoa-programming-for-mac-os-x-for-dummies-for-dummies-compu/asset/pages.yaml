- pgno: 176
  md: "In addition to the new look, the **textured** property also changes the behavior\
    \ of windows that have the property set. Whereas a non-textured window permits\
    \ dragging from its title bar, you can drag textured windows by clicking and dragging\
    \ anywhere in the window that isn't within the bounds of a control.\n\nThe first\
    \ time you see the cool metallic look of the textured window, you'll be tempted\
    \ to make the windows in every application with this style. After all, Apple does\
    \ with many of its applications (such as iTunes and iPhoto).\n\n![](img/ea40cad434a338535474e82c1a6ace20_176_0.png)\n\
    \nBefore you start giving every window in sight a textured look, keep in mind\
    \ that the Apple guidelines recommend that you use a textured window only when\
    \ hardware is involved. This explains why you see it in many Apple applications,\
    \ such as iMovie and iPhoto, which use hardware in one way or another. Although\
    \ textured windows look tempting, try to use them only when necessary. Your users\
    \ will thank you.\n\n# Sizing up your windows\n\nWhen you want to know the size\
    \ of a window in code, use the frame method in the same way that you did earlier\
    \ in this chapter. It gives you access to the window's position and size. To alter\
    \ the size of a window in code, use the setFrame method. You can use the following\
    \ code to resize a window to half its current width:\n\n```\n```c\n- (IBAction)halfAsWide:\
    \ (id) sender\n{\n    CGRect theFrame = [theWindow frame];\n    theFrame.size.width\
    \ = theFrame.size.width/2;\n    [theWindow setFrame:theFrame display:YES];\n}\n\
    ```\n```\n\nIf you want to zoom a window without forcing the user to click the\
    \ zoom button on that window, all you have to do is call the window's zoom method.\n\
    \n```\n```c\n[theWindow zoom];\n```\n```\n\n# Setting a window's title\n\nSometimes\
    \ you'll want to change the title that appears in the title bar of a window. This\
    \ is an easy task to perform with the setTitle method:\n\n```\n```c\n[theWindow\
    \ setTitle:@\"My New Window Title\"];\n```\n```\n\n![](img/ea40cad434a338535474e82c1a6ace20_176_1.png)\n\
    \nOf course, you can also set the title of the window in the Inspector window\
    \ of Interface Builder."
  merge: -1
  img_proc: true
