    can use. For example, Figure 9-5 shows the NSRefreshTemplate image name. **Note:**
    The vertical alignment of the button doesn’t look so great. Step 3 fixes this.


    Conversely, you could add an image file to your project window in Xcode (again,
    **Xcode**, not Interface Builder). The new image automatically appears in the
    list of choices in Interface Builder.


