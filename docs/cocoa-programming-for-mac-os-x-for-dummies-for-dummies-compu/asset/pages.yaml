- pgno: 40
  md: '# Chapter 2: Creating Your First Cocoa Application


    +   3. Select the Application template on the left side of the New Project window.


    On the left side of the New Project window is a list of project templates that
    Apple has created for you. You use the Application template for building standard
    OS X applications. Figure 2-3 shows the Application template selected on the left.


    +   4. Select Cocoa Application from the list of choices on the right side of
    the New Project window.


    On the right side of the New Project window is a list of application templates
    from which you can choose. For most applications in this book, choose Cocoa Application,
    as shown in Figure 2-3.


    +   5. Choose the button.


    A Save As opens.


    +   6. Type a name for your project in the Save As Dialog.


    For example, you can name the project My First Project, as shown in Figure 2-4.


    When you open a Save As Dialog, it may not appear like the one in Figure 2-4.
    Instead it may appear smaller and it may not display the expanded list of files.
    To expand the dialog, click the triangle button that''s adjacent to the Save As.


    ![](img/ea40cad434a338535474e82c1a6ace20_40_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_40_1.png)


    Figure 2-3: Choose the Cocoa Application.'
