    \ to /System/Library/Frameworks/WebKit.framework and click the Add button, as\
    \ shown in Figure 15-2.\n   The WebKit Framework enables the powerful webView\
    \ control. Because the framework isn’t used in most projects, it isn’t part of\
    \ a standard Cocoa project. Believe it or not, this is all you need to do in Xcode!\n\
    3. Double-click the MainMenu.xib file in the Xcode project to open it in Interface\
    \ Builder."
