- pgno: 348
  md: '# # Chapter 18


    # # Cocoa Bindings


    # **In This Chapter**


    +   - Understanding bindings

    - Working on a project with bindings

    - Using KVC and KVO to make your bindings work

    - Adding bindings to an existing project


    Whenever you create a Cocoa application the traditional way, you implement a Model
    class that manages data, an interface that users interact with, and a Controller
    class that ties the two together. This is all well and good, but Objective-C saves
    you from a substantial bit of coding and hassle by permitting you to bypass the
    Controller class altogether.


    Bindings let you bridge items in your interface directly to data in your Model
    classes. This is handy because Objective-C handles the tasks of keeping your interface
    updated and, more importantly, you don’t have to. That means less coding work
    for you and less chance of creating bugs.


    This chapter explains what bindings are and why you use them. Then, it describes
    some of the technology behind bindings (namely KVC and KVO). KVC and KVO are two
    complementary technologies that you can use to generically get and set the values
    of instance variables. Finally, you create a project that uses bindings instead
    of code to control an interface in your application.


    ![](img/ea40cad434a338535474e82c1a6ace20_348_0.png)


    Bindings is an advanced topic that is also voluminous, and as such, you have to
    do some exploration on your own to master the wild and wooly world of bindings.
    This chapter only scratches the surface of what you can do with bindings. You
    can bind all sorts of elements in your interface to many different keys in your
    classes to affect how the application behaves when it runs.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# What Are Bindings?


    The Model-View-Controller (MVC) design pattern is the preferred method for writing
    Cocoa applications (see Chapter 7). Part of what makes the design so great is
    that it separates data (the *Model*) from the interface (the *View*). In between
    the data and the interface sits an intermediary object, the *Controller*. When
    the Controller changes the view (for example, when a user makes a move), you have
    to write code. For example, this line of code changes the display (an outlet connected
    to an `NSTextField`) any time a user deposits or withdraws money from the account:


    ```

    ```text

    [display setFloatValue: [account balance]];

    ```

    ```


    This code also appears in the *awakeFromNib* method so the field displays an initial
    value on launch. With a MVC design, you set the text field in three different
    places.


    Imagine what a chore all this coding becomes when your application starts expanding.
    Soon, things can become quite unruly. You might have to toggle the enabled state
    of particular controls depending on the state of the application. Or, maybe you
    need to display values in other fields too. Each time you have to change the interface
    via code, you increase your workload (and the resulting spaghetti code) by leaps
    and bounds. Surely, there must be a better way. And indeed there is — bindings!


    *Bindings* is a technology in Cocoa that consists of some classes that help you
    keep data and an interface in sync. Instead of updating the interface each time
    a user changes the balance value in the bank account application, you can instead
    tell the interface to bind the balance value to the `NSTextField`. Then, whenever
    your application changes the balance value, the interface updates automatically.
    You can eliminate the three instances when you have to update the interface in
    the MVC design. And, because you used an outlet to update the interface, you can
    remove that too!


    ![](img/ea40cad434a338535474e82c1a6ace20_349_0.png)


    Bindings help you prune down your code significantly. Less code usually means
    fewer bugs.'
  merge: -1
  img_proc: true
