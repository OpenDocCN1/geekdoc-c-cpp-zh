    The NSTabView is the class in the Application Kit that provides you with tab views
    for your interface. A *tab view*, as its name implies, is a view consisting of
    multiple tabs that when clicked display a particular pane of the view. Figure
    9-14 shows a tab view with four tabs. Each pane can hold'
