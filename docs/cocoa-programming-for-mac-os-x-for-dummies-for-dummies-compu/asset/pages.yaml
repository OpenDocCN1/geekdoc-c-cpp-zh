    # Sending E-Mail from a Cocoa Application


    Downloading and displaying Web pages is just one of Cocoa''s many networking skills.
    Cocoa is equally adept at e-mail. With a few simple lines of code, you can create
    an e-mail message in your favorite e-mail client. With a few more lines of code,
    you can take care of sending the e-mail too. E-mail features in an application
    are handy for several uses:


    +   - Provide a contact e-mail in an About box

    - Give users the opportunity to automatically send you bug reports

    - Format an e-mail message in an existing client

    - Send spam, but you wouldn''t dare do that, would you? Would you?! I hope not!


    In this section, you add e-mail features to the demo project that you created
    earlier in this chapter.'
