  md: "The completed calculateAnswer action looks like this.\n\n```\n- (IBAction)calculateAnswer:\
    \ (id)sender {\n    float num1,num2,answer;\n    operation;\n    num1 = [numberField1Value];\n\
    \    num2 = [numberField2 floatValue];\n    operation = [operationPopup selectedTag];\n\
