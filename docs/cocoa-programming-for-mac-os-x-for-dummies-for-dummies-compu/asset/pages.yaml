  md: '# # Making Your Bindings Work: KVC and KVO


    KVC (Key-Value Coding) and KVO (Key-Value Observing) are conventions whereby you
    can get, set, and observe properties of a class by name.


    In a typical class, you might retrieve an instance variable with an accessor method
    like this:


    ```

    ```

    theBalance = [account balance];

    ```

    ```


    With KVC, you can retrieve that value like this instead:


    ```

    ```

    theBalance = [account valueForKey:@"balance"];

    ```

    ```


    You retrieve the value generically by using the *valueForKey* method and passing
    the *name* of the key instead of accessing its accessor method directly. This
    might not seem like it makes sense, but it’s what makes bindings work. When you
    call *valueForKey*, Cocoa tries to find a method with the same name as the key.
    So, it searches until it finds the accessor method that you defined and retrieves
    the value from it:


    ```

    ```

    - (float) balance;

    ```

    ```


    With KVC, you can also set values generically by key. For example, to set the
    balance, you’d do this:


    ```

    ```

    [account setValue:115 forKey:@"balance"];

    ```

    ```


    This time Cocoa searches for a *setBalance* method. It then uses that accessor
    method to set the value of *balance* to 115.


    ```

    ```

    - (void) setBalance: (float) theBalance;

    ```

    ```


    ![](img/ea40cad434a338535474e82c1a6ace20_352_0.png)


    Use *setX* as the name of the setter method, where *X* is the capitalized name
    of the instance variable. It might not make sense why you have to follow this
    convention, but bindings rely on it, so name your accessors this way!


    So, Cocoa has a way to get and set values of instance variables by key name. If
    you adhere to the conventions of KVC, you can also observe the values of variables
    by key name. KVO lets your application register observe a value based on key name.
    Then, whenever the value of the key changes, your application is notified of the
    value change. For example, if you want the register'
  merge: -1
  img_proc: true
- pgno: 353
  md: "to observe the balance variable, you'd do something like this (perhaps in awakeFromNib):\n\
    \n```\n```objectivec\n[account addObserver:self forKeyPath:@\"balance\" options:0\
    \ context:NULL];\n```\n```\n\nThe account class is now an observer of the balance\
    \ variable. Don't worry about the options and context parameters. They're for\
    \ advanced users, and you'll know what they mean when you reach that level. For\
    \ now, set options to zero and context to NULL. Whenever the value of the variable\
    \ changes, the class, as an observer, gets a message letting it know that the\
    \ value has changed. There, your code does something to respond. But where would\
    \ this message arrive? It arrives in an observeValueForKeyPath: method, which\
    \ you must implement, like so:\n\n```\n```objectivec\n-(void)observeValueForKeyPath:\
    \ (NSString *)keyPath\n  ofObject: (id)object  change: (NSDictionary *)\n    \
    \   change\n   context: (void *)context {\n}\n```\n```\n\nBecause observeValueForKeyPath\
    \ is generic and fires for all observed values, you have to check the keyPath\
    \ to see if the incoming value is one you care about:\n\n```\n```objectivec\n\
    if ( [keyPath isEqualToString:@\"balance\"] ) {\n   //do something here with regards\
    \ to the value of balance\n}\n```\n```\n\nThe reason KVC and KVO are so important\
    \ is that the bindings technology uses them to perform its magic. That's not to\
    \ say that you can't use KVC and KVO in your own applications separate from bindings.\
    \ You can! And when you do, you also get bindings support for free.\n\n# # Implementing\
    \ Bindings\n\nTo see how all this KVC and KVO stuff works, return to the project\
    \ that you started in the \"Starting a Project with Bindings\" section. Your interface\
    \ for AccountController has two actions for when the user clicks one of the buttons\
    \ in the interface, and it has two accessor methods: balance and SetBalance (which\
    \ follow the KVC naming conventions). If you're not sure how to name the KVC,\
    \ see the previous section."
