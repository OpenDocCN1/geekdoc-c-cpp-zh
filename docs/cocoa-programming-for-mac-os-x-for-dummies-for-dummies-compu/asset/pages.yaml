    You can assign a different icon to your application by adding an icon (ICNS) file
    to your project and setting the Icon key in Info.plist. Before you do that, though,
    you need an icon file in the first place. Apple gives you two utilities to help
    you work with icon files: Icon Composer and icns Browser.'
