- pgno: 314
  md: '# Chapter 16


    # Multimedia


    # In This Chapter


    +   - Playing system sounds and audio files

    - Building an audio player project

    - Playing movies with Cocoa

    - Loading and using dozens of other media formats


    **W**orking with text and creating files are useful functions for your applications,
    but they aren''t always the most exciting functions. Multimedia, on the other
    hand, *is* exciting. Cocoa continues the long Macintosh tradition of providing
    high-quality multimedia features for you to use in your projects.


    In this chapter, you discover how easy it is to add sophisticated multimedia features
    to your applications. First, you explore audio by creating a simple application
    that plays audio files from a number of sources. Then you delve into the real
    fun — movies! By building a movie player application, you see how easy it is to
    add dynamic QuickTime content to your Cocoa projects. By changing only one line
    of code, you also see how to (dis)play many other kinds of media beyond QuickTime
    movies.


    # Listening to Audio


    The Macintosh has long been a popular machine with audio aficionados. Cocoa continues
    in this tradition, offering a complete set of tools for producing audio with your
    own applications. Some of the possibilities that Cocoa offers are


    +   - Playing sounds that reside in your application''s bundle

    - Playing sounds that reside in the Mac OS X System folder

    - Playing sounds from anywhere on your hard drive'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Besides playing audio files that reside in a variety of locations, Cocoa can
    play many different audio file formats. In the past, you had to know about the
    various file formats to use them. Cocoa takes away this necessity and lets you
    play common audio file formats, such as AIFF, MP3, and WAVE, without knowing anything
    about them.


    # Playing system sounds


    Cocoa has a convenient method for playing sound in the **NSSound** class.


    To play audio with the **NSSound** class, you typically follow a simple three-step
    process:


    +   1. Create an object based on the **NSSound** class.

    2. Load an audio file into the **NSSound** object.

    3. Play the audio.


    You usually combine the first two steps or even all three into one line of code.
    The easiest way to load an audio file is by using its filename. For example, drag
    and drop an AIFF file (for this example, `banjo.aiff`) into your Cocoa project.
    Then load it as an **NSSound** object by using the **soundNamed** class method:


    ```

    NSSound *theSound = [NSSound soundNamed:@"banjo"];

    ```


    > **TIP** You can omit the file extension.


    Besides loading an audio file that you drag into your project, you can load sounds
    located in one of the three Mac OS X Sounds directories, located here:


    ```

    /System/Library/Sounds

    /Library/Sounds

    ~/Library/Sounds

    ```


    For example, suppose you want to play the famous Sosumi alert that ships with
    Mac OS X. The code is identical to the previous example, except for a name change:


    ```

    NSSound *theSound = [NSSound soundNamed:@"Sosumi"];

    ```


    After you load a sound, it’s a trivial matter to play it:


    ```

    [theSound play];

    ```'
  merge: -1
  img_proc: true
