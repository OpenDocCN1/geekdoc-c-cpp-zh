- pgno: 377
  md: 'The completed application has an astounding array of features:


    +   - It displays a complete working interface.

    - You can remove authors and categories.

    - You can add and remove a book and assign an author and a category to the book.

    - The application saves all the data upon closing.

    - It reloads all the data the next time you run the application.

    - It fully supports Undo, which is no small feat to add on your own.

    - The list of books is fully searchable based on title, ISBN, page count, and
    synopsis.

    - It even has spell-checking!


    This is an amazing feat and not only that, you didn''t have to write a single
    solitary line of code to make it happen. Outstanding!


    Granted, this may not be the interface you want, but it does give you a tremendous
    head start on creating your own interface for the application. This interface
    also gives you a significant number of clues about how Core Data works with interface
    and, in particular, bindings. In this project, bindings take care of updating
    your interface to match the data model. You can read more about bindings in Chapter
    18.


    Note that the interface project window now has new controller objects in it that
    represent the three entities. Note also that if you select one of those controllers
    and press ⌘+5, you can view all the various bindings that cause the interface
    to react with the data model. You can find out a lot about how Core Data works
    just by investigating these bindings on your own.'
  merge: -1
  img_proc: true
