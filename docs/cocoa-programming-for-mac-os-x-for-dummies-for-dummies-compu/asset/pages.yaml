  md: '![](img/ea40cad434a338535474e82c1a6ace20_193_0.png)


    **Figure 9-7:** A check box button shows the state of a setting.


    # # Square and rounded bevel buttons


    Bevel buttons are another style of button available to you. They come in two varieties:
    square and rounded. Besides the beveled appearance, they differ from standard
    push buttons and round buttons in that they often are used to display both text
    and icons. Further, they can perform other functions that a push button can''t.


    To add a bevel button to your application, search for **Bevel Button** in the
    Library window of Interface Builder and then drag one to your interface.


    You can use a bevel button like a standard button to trigger an action when a
    user clicks it. Beyond this simple button behavior, bevel buttons can also mimic
    other controls. Like the check box, a bevel button can indicate state by displaying
    a depressed look. Bevel buttons can also act like a menu by displaying a selection
    from a list of choices. Figure 9-8 shows the square and rounded bevel buttons
    with the pre-supplied **NSEveryone** and **NSFolderBurnable** images assigned
    to each button respectively.'
