- pgno: 186
  md: '# Chapter 9


    # Working with Interface Controls


    # In This Chapter


    +   - Working with button controls

    - Using radio and slider controls in your project

    - Working in tab views

    - Animating a progress indicator

    - Displaying data in a table


    The Mac OS has long been renowned for its graphical user interface, which probably
    stems from the fact that people like interacting with computers by using metaphors
    that relate to the real world. Interface Builder is your tool for creating these
    metaphors. With it, you build your interface by adding different elements that
    your users will use to control the application. Because they''re controlling the
    application, Cocoa calls these elements *controls*.


    Cocoa has a rich set of interface controls for you to use in your own applications.
    With drag-and-drop and a few lines of code, you can add a variety of useful controls
    to your projects. This chapter guides you through the basics of interface controls
    in Interface Builder. You''ll see how to use each of these controls by adding
    them to small projects.


    By the end of the chapter, you''ll have enough experience with controls to strike
    out on your own. The Cocoa framework is a vast one, and nothing prepares you better
    for programming than practice and experimentation.


    # Button Controls


    Perhaps the most ubiquitous interface control is the button. From the bank''s
    automatic teller machine to the doorbell at your front door, buttons are a nearly
    universal piece of hardware. Even your mouse and keyboard have button interfaces.
    Because so many people recognize buttons and know how to use them in the real
    world, it makes sense that they''re popular in the virtual world as well.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Cocoa provides many kinds of useful and attractive buttons for your interfaces.
    All buttons in Cocoa are the `NSButton` type. Most `NSButton` controls look and
    act the way you’d expect, but some may alter your notion of what constitutes a
    button.


    This section looks at the different types of buttons available to you in Cocoa.
    To begin working with buttons, follow these steps:


    +   1.  **Launch Project Builder and create a new Cocoa application.**

    2.  **Double-click the MainMenu.xib file to open it in Interface Builder.**

    3.  **Open the window found in the NIB file window.**

    4.  **Choose Tools:Library and enter Button in the Library’s search field to find
    all the `NSButton` controls in Interface Builder.**


    Figure 9-1 shows the Library with the various buttons listed.


    ![](img/ea40cad434a338535474e82c1a6ace20_187_0.png)


    > **Figure 9-1:**

    The Library provides a multitude of buttons for your interfaces.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Although each button in Figure 9-1 looks and behaves differently, they''re
    all examples of the NSButton class. This means you could drag a push button to
    your interface, for example, and later convert it to a square button. You''ll
    see how the buttons differ through the remainder of this section.


    # # Push button


    Perhaps the most recognizable form of NSButton, the push button is a staple of
    nearly all applications. The push button works simply: A user clicks the button,
    and your program does something in response. Probably the most common buttons
    are the OK and Cancel buttons, but you can also use buttons to perform almost
    any task. To add a push button to your interface, simply drag it from the Library
    to a window in your project. A default push button has a centered text label,
    as shown in Figure 9-2. You can change the text in a button by double-clicking
    it or by altering the Title entry in the Inspector window (also shown in Figure
    9-2). (The Inspector window changes its title based on context, so its title is
    now Button Attributes.)


    ![](img/ea40cad434a338535474e82c1a6ace20_188_0.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Besides the *Title* property, **NSButton** controls have many properties that
    you can customize. One that you''ll use frequently is *Key Equiv* (see Figure
    9-3). Click in this box and enter a keystroke that acts as if the user clicked
    the button with the mouse. The symbol representing that key then appears in the
    *Key Equiv.* field. One common keyboard equivalent is *Return*, which means a
    user can trigger the push button by pressing **Return** (or **Enter**) on the
    keyboard. When you set it to respond to the **Return** key, ⏎ appears in the *Key
    Equiv.* box, and the button automatically takes on a pulsating colored appearance
    at runtime (but not when you''re designing in Interface Builder). The color of
    the button will be aqua or graphite, depending on which appearance setting the
    user selected in **System Preferences**. This colored appearance suggests to users
    that this button performs the default action for the window in which it appears.
    For example, when a window has OK and Cancel buttons, OK is often the default
    button. This offers a hint to users that OK is probably the button that they want
    to click.


    In addition to appearance, an **NSButton** can play a sound when clicked. Follow
    these steps to make your button play a sound when it''s clicked:


    +   1. **Find a sound to play.**


    Click the **Media** tab at the top of the **Library** window. You find all the
    familiar system sounds that you can use. You can also drag your favorite audio
    files into the **Xcode** project window (yes, **Xcode**, not **Interface Builder**),
    and then those sounds appear in the **Media** section of the **Library** window.


    ![](img/ea40cad434a338535474e82c1a6ace20_189_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_189_1.png)


    **Figure 9-3:**

    Set the *Key Equiv* property to **Return** to make the button pulsate.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '+   2. In your application''s interface window in Interface Builder, click
    the NSButton that you want to alter and open the Inspector window. In the Sound
    field, type the name of the sound file that you want to play or select it from
    the drop-down list.


    Alternatively, you can drag sound files from the Media tab of the Library window
    directly on top of the push button that you want to play the sound. The sound
    filename appears automatically in the Sound field of the Inspector window as if
    you typed it by hand.


    Figure 9-4 shows a button that plays the frog system sound.


    +   3. Press ⌘+R in Interface Builder to test your work. A frog sound plays when
    you press ⌘+R.


    ![](img/ea40cad434a338535474e82c1a6ace20_190_0.png)


    # ## Round button


    A close relative to the push button is the round button. As its name implies,
    the round button has a circular shape, and that''s the main difference between
    a round button and a push button. In addition to text, a round button can display
    icons. For example, one common use for a round button is as an arrow button.'
  merge: -1
