- pgno: 134
  md: '# Coding in Objective-C


    After you declare a class, add instance variables and methods to its declaration,
    and set up the shell of the implementation file, it''s time to write some code!


    # Sending messages to objects


    One of the most basic ideas in Objective-C is the capability to send messages
    from one object to another. To do this in Objective-C, you typically send a message
    to an object telling it to perform that method. Objective-C uses square brackets
    to denote that you''re sending a message to an object.


    ![](img/ea40cad434a338535474e82c1a6ace20_134_0.png)


    Sending messages is similar to calling functions in other programming languages.


    For a generic object (named object), you''d send a message (named message) like
    this:


    ```

    [object message];

    ```


    Note two things:


    +   The syntax of this statement makes it behave much like a command in English.
    For example, you might say this to a taxicab driver:


    ```

    Driver, go!

    ```


    In Objective-C, the same command looks like this:


    ```

    [driver go];

    ```


    +   Each line of code ends with a semicolon. Except for the usual places where
    you might leave one out in C (for example, an if statement). Objective-C also
    requires a semicolon at the end of each line of code. Objective-C is C, after
    all!


    # Passing parameters


    Like traditional C functions, Objective-C lets you pass parameters (also known
    as arguments) to methods. Going back to the taxi analogy, you might want to tell
    the driver where to go:


    ```

    Driver, go left!

    ```'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'In Objective-C, the command might look like this:


    ```

    [driver go:left];

    ```


    For C programmers, the go method should seem roughly analogous to a standard C
    function. If you add another parameter, though, the analogy breaks down. Suppose,
    for example, that you want to pass two parameters (direction and distance) to
    the go method:


    ```

    [driver go:left distance:10];

    ```


    In Objective-C, the first parameter follows the colon after the name of the method
    (in this case go:left). Each subsequent parameter has a name, followed by a parameter
    (in this instance, distance:10). In contrast, a parallel C function might be


    ```

    go(left,10);

    ```


    In Objective-C, the meaning of the first parameter is usually obvious based on
    the name of the method. Additional parameters have names to help you identify
    their purpose.


    ![](img/ea40cad434a338535474e82c1a6ace20_135_0.png)


    # Returning values


    Like C functions, an Objective-C method can also return a value. If you tell a
    taxicab driver to a particular direction and distance, the next you''re likely
    to hear is the price of the fare. You tell the driver to do something. The driver
    replies with a price. In Objective-C, this works much like it in C.


    ```

    price = [driver go:left distance:10];

    ```


    Because some methods return values, Cocoa programmers are fond of nesting them
    within other methods. Suppose you based your directions to the cabbie on a go,
    but not necessarily far. In this situation, you might use a map object to find
    the desired location, embedding it in the go method.


    ```

    driver go:left

    distance:map startAt:location1

    destination:location2];

    ```


    Returning to the class you defined earlier in this chapter, you''ll want to write
    code in each of those methods that sends messages to other methods in the same
    class. To call other methods within the same class, use self like this:


    ```

    - (void)doSomething {

    [self drawString:@"hello" atXPosition:10

    atYPosition:6];

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Instantiating an object


    After you create a class, you''ll want to use it as an object. When you want to
    create an Objective-C object, you send the alloc message to the class, like so:


    ```

    MyClass* anInstance = [MyClass alloc];

    ```


    The alloc allocates memory and creates the class. An instantiated object must
    also be initialized. You do so by sending the init method to the instance, like
    this:


    ```

    [anInstance init];

    ```


    Because alloc and init are both required for a generic instantiation, it''s customary
    to embed them in one statement:


    ```

    MyClass * anInstance = [[MyClass alloc] init];

    ```


    Then, you''re free to work with the object (anInstance) as you need. You could
    send the drawString@"hello" to the instance:


    ```

    [anInstance drawString@"hello" atThisXPosition:10 atThisYPosition:6];

    ```


    Because you used alloc to create the instance, you must free up that memory using
    release:


    ```

    [anInstance release];

    ```


    # Managing memory


    Recent versions of Cocoa provide support for garbage collection, but historically
    Cocoa hadn''t had garbage collection. Garbage collection dynamically frees memory
    that you''ve allocated for objects. This is a newer feature and because so many
    sources of sample code do the old way, it''s best that you understand management
    in Cocoa without garbage collection.


    Cocoa tracks memory by way of reference counting. This is a simple counter that
    runs behind the scenes, keeping track of how many objects have allocated memory
    and how many objects have released memory. When you create an object with alloc,
    you increase the reference count by one. When you send a release message to the
    object, you decrease the count by one. The name of the game is that your reference
    count could end up being zero after you finish using an object. If the count is
    greater than zero, you''re leaking memory. And if the reference count is less
    than zero,'
  merge: -1
  img_proc: true
