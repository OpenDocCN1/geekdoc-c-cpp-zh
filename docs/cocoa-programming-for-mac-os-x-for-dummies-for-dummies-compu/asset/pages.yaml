- pgno: 84
  md: '# Chapter 4: Interface Builder


    Incidently, the XIB file extension in MainMenu.xib indicates that it is a newer
    Interface Builder project file format, introduced in Xcode 3. Previously, the
    file had a NIB extension, which is short for Next Interface Builder. Why NeXT?
    NeXT is the name of the company Steve Jobs headed before his return to Apple.
    Apple produced the Next operating system, which became the core of Mac OS X. The
    XIB file is a carryover from those days. Cocoa geeks still use these NIB files—old
    habits die besides. Have you ever tried to pronounce "NeXT”? Furthermore, the
    AS that appears at the beginning of class names in Cocoa stands for NextStep,
    another historical tidbit in Cocoa left over from NeXT.


    When you first launch Interface Builder, you may see as many as five windows.
    Figure 4-2 shows the various windows as they appear in Interface Builder. Although
    it is not one of the five main windows, the Strings window might make an appearance,
    too. The Strings window is less likely to be present than the others but if you
    use it, feel free to choose it. You dont use it in this chapter.


    ![](img/ea40cad434a338535474e82c1a6ace20_84_0.png)


    Figure 4-2: Interface Builder has five main windows.


    Design window'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Table 4-1 describes why you need each window and how to display one if it isn''t
    currently visible.


    | Table 4-1 Main Windows of Interface Builder |

    | Window | How to Display It | What You Do With It |

    | Project window | Double-click the XIB file in Xcode | Store the components of
    your interface file. |

    | Design window | Double-click the Window icon in the XIB project window | Use
    the window as part of your application''s interface. |

    | Inspector window | Choose Tools:Inspector | View and edit attributes of your
    interface and other classes in the project. |

    | Library | Choose Tools:Library | Drag controls from the Library window to a
    design window to create interface. |

    | Menu editor | Double-click the MainMenu icon in the XIB project window | Create,
    delete, or edit menus for your application. |


    Using these five windows form the main tools of Interface Builder. Using these
    tools in concert, you can build a complete interface for use in Cocoa application.
    That''s not all Interface Builder can do, though. You can


    +   - Create classes to your project.

    "- Connect classes to the elements of your interface by clicking and dragging.
    These connections serve as a bridge between an interface and your Xcode project.

    "- Allow Interface Builder to do the dirty work of writing some of the code for
    your interface. With one click, it produces the necessary interface and implementation
    files in Xcode, where you add code later.


    # The interface builder project window


    The NIB project window is the heart of your project''s interface. This is where
    you store the components of your project''s interface. The NIB project window
    has three different views much like the Finder:


    +   - Icon: List the objects in your XIB file as a grid of large icons. Figure
    4-3 shows the Icon view format of the Interface Builder project window.'
  merge: -1
  img_proc: true
