- pgno: 108
  md: '# Chapter 5


    # Putting Polishing Touches on Your Application


    In This Chapter


    +   - Implementing an About page

    - Renaming an application

    - Setting an application''s version

    - Creating and setting an application''s icon

    - Distributing applications


    After finish building an interface, writing code, and debugging your application,
    you''ll want to prepare it and build it for use as a standalone executable file
    to distribute. You may think that after you design and write an application, it''s
    ready for the world to see, but you still have a few more steps to complete before
    it passes muster with Mac users (they can be a demanding bunch!) and before it''s
    truly ready for public consumption.


    Mac users expect particular things to be present in a "good" Mac application.
    In this chapter, I show you some of the most common features that you can add
    to an application and settings that you need to tweak before releasing it to friends,
    family, co-workers, or the public.


    The bulk of your development tasks take place in Xcode and Interface Builder.
    Some of the items in this chapter can be completed found in Xcode and Interface
    Builder. However, these aren''t the only tools Apple gives you for creating Cocoa
    applications. Nestled in the Applications folder of your developer folder, you''ll
    find more than a dozen additional tools and utilities that help you create great
    Cocoa software. I show you how to use a couple of them in this chapter: Icon Composer
    to create icons and icns Browser to manage the icons in your project. Disk Utility,
    which comes with all Macs, also makes an appearance in this chapter.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# # Adding an About Panel


    Within every application menu is a menu item titled About My Application, where
    My Application is the name of your application. This is commonly known as the
    About Menu, and clicking it opens an About Panel. The About Panel conveys important
    information about the application (imagine that!). For many years, developers
    created their own About Panel (sometimes called an About Box or About Window),
    but Apple has standardized its use. Following Apple''s guidelines, an About Panel
    can display the following information about an application:


    +   - **Name or title**: The name of the application

    - **Icon**: The application''s icon

    - **Version number**: A number, such as 1.0, indicating which version this is

    - **Copyright date**: A copyright note stating the year the application is copyrighted

    - **Credits**: Other pertinent information about the application, which usually
    includes names of the team that built the application and other acknowledgments


    An application doesn''t have all these elements in the About Panel by default.
    You must either add them to the About Panel or alter the project settings for
    them to appear in the About Panel. Figure 5-1 shows the default About Panel, with
    the name of the application and the version number, when you create a Cocoa Application
    (in this case, the application is named Utility).


    ![](img/ea40cad434a338535474e82c1a6ace20_109_0.png)


    After you alter the appropriate settings and add a couple items to your project,
    the resulting About Panel is far more interesting to look at and is much more
    useful to users. Figure 5-2 shows an About Panel that includes the basic elements
    of an About Panel.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Surely as big as that requires some code, right? Nope! By setting a few parameters
    and adding the necessary files, Cocoa takes care of the rest!


    Figure 5-2: The enhanced About Panel looks lot better and is helpful to users.


    ![](img/ea40cad434a338535474e82c1a6ace20_110_0.png)


    Most of the settings you need to customize an About Panel are in the Info.plist
    file of your project. The Info.plist file resides within the Resource folder of
    your project. Figure 5-3 shows it in the project window.


    The Info.plist is somewhat unique. At its heart, it''s nothing more than a text
    file, but it contains XML (eensible Markup Language), which is parsable by special
    applications, such as the Property List Editor. One of the tools that resides
    in the Applications folder within your Developer folder (Property List Editor
    resides within the Utilities folder there).


    Figure 5-3: The plist file contains important settings for your application.


    ![](img/ea40cad434a338535474e82c1a6ace20_110_1.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 92 Part I: Developer Tools


    There''s no need to pull out the big guns though because Xcode can also parse
    the data in Info.plist. Instead of displaying the file as plain old text, Xcode
    parses the data and displays it as a hierarchical tree (the way XML is formed
    structurally). Each element in the hierarchy consists of a key/value combo. You
    can double-click any value and alter it from within Xcode.


    # Setting an icon


    Toward the top of the About Panel shows the application''s icon, which identifies
    your application at a glance but is present mostly for cosmetic reasons. Set the
    icon for an application, and as a result, you set the icon in the About Panel.
    You need to do two things to set the icon:


    +   1. Add an icon (with .ic file extension) to the project window by dragging
    and dropping it into Finder.


    It''s custom for the Icon file to reside in the Resources folder of a project.
    In this chapter, I show you how to build an icon with Icon Composer.


    +   2. In Info.plist, enter the name of the icon in the Icon File field.


    Type the name of the icon file exactly as you see it in Finder. The file extension
    (.icns), however, is optional.


    Figure 5-4 shows that an icon file Utility.icns has been added to the project.


    ![](img/ea40cad434a338535474e82c1a6ace20_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Setting the name or title


    Next, you might need to change the Bundle Name to affect the application name
    that appears in the About Panel. This is probably the single-important element
    in the About Panel because it''s the panel that appears when you click the About
    This Application menu. The title simply identifies that application.


    You might be tempted to change the next to the Bundle Name in Info.plist, but
    dont not. Instead, set the application''s name in the Info window for your project''s
    target. By default, projects assign the value ${ PRODUCT_NAME } to the Bundle
    Name in Info.plist. This means that the name comes from elsewhere in your project
    because ${ PRODUCT_NAME } is a variable. When you change the value in the Info
    window for your project''s target, the Info-plist automatically reflects these
    changes at runtime.


    The default name of the product usually matches the name of your project, but
    it doesn''t have to. To change the product name, and in turn, the application
    name that appears in the About Panel, follow these steps:


    +   1. Locate and expand the Targets folder in the project.


    +   The Targets has a red bull''s-eye icon, it should be easy to spot.


    +   2. Select the application target within the Targets folder.


    The target will have a name that you recognize; probably the same as the project
    target itself. Figure 5-5 shows the target selected.


    ![](img/ea40cad434a338535474e82c1a6ace20_112_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_112_1.png)'
  merge: -1
