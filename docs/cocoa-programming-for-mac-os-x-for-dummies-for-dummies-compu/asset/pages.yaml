  md: '![](img/ea40cad434a338535474e82c1a6ace20_259_0.png)


    Figure 12-10: So far, this doesn''t look much like a stop sign.


    Clearly, you want to define how the font looks. To accomplish this, pass something
    other than nil in the withAttributes parameter of the drawAtPoint function. The
    withAttributes parameter takes an NSDictionary, so you need to declare and create
    one of those.


    An NSMutableDictionary is a container for a collection of items; in this case,
    a collection of text attributes. NSMutableDictionary is a subclass of NSDictionary,
    so it works in place of an NSDictionary. A mutable object is one that you can
    change sometime after you create it. An immutable object is one that you can’t
    change after you create it. Mutable objects (such as NSMutableDictionary) have
    mutable in their names. Immutable objects (such as NSDictionary) don’t.


    Follow these steps to define your font:


    +   1. Create an NSMutableDictionary:

    In this situation, you use a predefined set of attributes, so you can use an immutable
    dictionary.

    ```objective-c

    NSMutableDictionary *theAttributes;

    //create the NSDictionary object

    theAttributes = [[NSMutableDictionary alloc] init];

    ```


    +   2. Add objects to the NSMutableDictionary that represent some text attribute.'
