- pgno: 370
  md: 'You could end your data modeling here, but you have one small additional detail
    to address. The *Book* entity knows about the *Author* and *Category* entities
    thanks to the relationships, but the *Author* and *Category* entities don’t know
    about the *Book* entity. So, return to the data modeler and follow these steps
    to assign relationships in reverse:


    +   1.  **Add a relationship, books, to the Author entity.** Select **Book** from
    its **Destination** pop-up menu and select the **To-Many Relationship** check
    box.


    A two-headed arrow connects the *Author* entity to the *Book* entity, as shown
    in Figure 19-11, because one author might have written multiple books.


    A one-headed arrow indicates the two entities have a one-to-one relationship.
    A two-headed arrow indicates a one-to-many relationship.


    ![](img/ea40cad434a338535474e82c1a6ace20_370_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_370_1.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_370_2.png)


    +   2.  **In the books relationship, select Author in the Inverse pop-up menu.**


    Because the *Book* and *Author* entities point at each other, the data modeler
    helps you clean up things by merging the two arrows, as shown in Figure 9-12.
    One end of the arrow has two heads. The opposite end has one head. The *Book*
    entity has a one-to-one relationship with the *Author* entity (one book is written
    by one author), but the *Author* entity has a one-to-many relationship with the
    *Book* entity (one author can write many books).'
  merge: -1
  img_proc: true
- pgno: 371
  md: "![](img/ea40cad434a338535474e82c1a6ace20_371_0.png)\n\n**Figure 19-12:** Inverse\
    \ the relationship.\n\n+   3.  **Add a relationship, books, to the Category entity,\
