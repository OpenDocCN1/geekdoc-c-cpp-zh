    # Doing Style the Easy Way!


    You can continue to add style functions to this project by manipulating the `NSTextView`
    programmatically. This may work great for some projects, but for others, there’s
    a much easier way to stylize text in an `NSTextView`. If you’re looking for traditional
    word-processor styles in your application, Cocoa can deliver!


    Follow these steps to stylize your text:


    +   1. In Xcode, click the **Build and Go** button in the toolbar to launch the
    application.


    +   2. Choose Format::Font::**Show Fonts**.


    Yes, that’s right . . . Cocoa has already implemented a Font menu for you. You
    don’t need to add a single line of code nor make any changes in Interface Builder.
    That’s all there is to it!


    +   3. **Select a font and use it while typing** in the text view.


    Figure 11-8 shows the Fonts panel after being opened by the Font menu.'
