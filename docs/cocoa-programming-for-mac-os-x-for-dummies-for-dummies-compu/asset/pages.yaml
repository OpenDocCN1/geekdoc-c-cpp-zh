  md: '# Chapter 8


    # A Window with a View


    # In This Chapter


    +   - Opening, closing, and hiding windows

    - Positioning windows anywhere on the screen

    - Tracking open windows

    - Changing the appearance of windows

    - Resizing windows

    - Seeing through a window

    - Using sheets and delegates


    Perhaps the most important element of any GUI-based application is the window.
    In fact, the window is so important that those guys from Redmond used it to name
    their operating system. The windows in an application are like pieces of paper
    that you use to collect ideas, display information, and record input.


    Windows in Cocoa are equally important. Mac OS X continues using the fine window
    traditions that made the Mac OS famous, but Cocoa builds on and improves those
    ideas from the past with exciting new features. In this chapter, you examine some
    of the most common window features of Cocoa applications. In the process, you
    create two projects that demonstrate these features.


    # Working with Windows


    Because windows form the basis for nearly all interfaces, you’ll use them often
    as part of your projects. Some of the most common functions that you’ll perform
    include


    +   - Opening and closing windows

    - Moving windows

    - Adding windows to the Windows menu'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'In the following sections, you discover how to accomplish all these tasks and
    more.


    # ## Opening and closing a window


    When you work with windows in your Cocoa projects, you''ll often use Interface
    Builder to design them. Further, if you leave a window open in Interface Builder
    when you''re designing an interface for an application, that window opens automatically
    when the application runs. Thus, if you''re building a one-window application,
    you may not even have to issue a command to open a window.


    Assume that `theWindow` is an outlet in your project. Closing the window in code
    is as simple as


    ```

    ```objective-c

    [theWindow close];

    ```

    ```


    The `close` method hides the window from view. If you want the window to also
    be released from memory when you close it, also use the `setReleasedWhenClosed`
    method:


    ```

    ```objective-c

    [theWindow setReleasedWhenClosed: YES];

    [theWindow close];

    ```

    ```


    When you close a window in this fashion, the window is gone. Its contents are
    gone from memory. It is no more. That means to see the window again, you have
    to create a new window object altogether. If the window has been released from
    memory, you have to create a new window like so:


    ```

    ```objective-c

    theWindow = [[NSWindow alloc] init];

    ```

    ```


    Then, to show the window, send it the `makeKeyAndOrderFront` message like this:


    ```

    ```objective-c

    [theWindow makeKeyAndOrderFront: self];

    ```

    ```


    # ## Hiding and showing a window


    If you''d prefer to keep a window around instead of deleting it from memory, you
    can hide it instead of closing it. Hiding a window is also an easy task to perform.
    Suppose you have an outlet (named `theWindow`) as part of your object class. The
    outlet represents a window in your interface. To hide that window, a `hideWindow`
    action might look like this:


    ```

    ```objective-c

    - (IBAction)hideWindow: (id) sender

    {

    ```

    ```'
