  img_proc: true
- pgno: 214
  md: 'With an **NSMutableArray**, you can change elements in the array after you
    create it. This makes it more suitable for maintaining dynamic lists of information:


    **Add items to an NSMutableArray:** Use the `addObject` method:


    ```

    [theArray  addObject:name1];

    [theArray  addObject:name2];

    [theArray  addObject:name3];

    ```


    **Remove an item from the array:** Use the `removeObjectAtIndex` method. This
    method removes an object from the array and resizes the array in the process.
    For example, to remove the second name (which is at `index 1`), use code like
    this:


    ```

    [theArray  remove0bjectAtIndex:1];

    ```


    **Insert an object:** Use the `insertObject` method. The method inserts an object
    into the array, resizing it as a result. This example reinserts the second name
    (`name2`) into the array:


    ```

    [theArray  insertObject:name2  atIndex:1];

    ```


    **Replace an element of the array with another object:** Use the `replace 0bjectAtIndex`
    method. This snip pet replaces the second name in the array with name3:


    ```

    [theArray  replaceObjectAtIndex:1  withObject:name3];

    ```


    Because **NSMutableArray** inherits from **NSArray**, you can use the methods
    from earlier in this section to find out the size of the array and to query it
    for specific elements.


    # # Working with Boolean Data Types


    A Boolean data type represents information that can occur in two, and only two,
    states. For example, an On/Off switch acts in a Boolean fashion because you have
    only two options. A Yes/No question works similarly. Objective-C has its own Boolean
    data type: **BOOL**. Instead of the usual **TRUE** and **FALSE** values, Objective-C
    uses **YES** and **NO**. This code snip pet shows some of the ways in which you''d
    typically use **BOOL** variables:


    ```

    BOOL  answerWasFound;


    answerWasFound =  FindTheAnswer();


    if  (answerWasFound)

    //  OR

    if  (answerWasFound ==  YES)

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Besides using **YES** or **NO** for the Objective-C **BOOL** type value, it’s
    important for another reason: It works with other objects in Cocoa. Again, arrays
    and other types of collection objects expect their elements to be objects themselves.
    If you wanted to create an **NSArray** of Boolean values in Cocoa, you''d pass
    the **BOOL** type to the **numberWithBool** class method of **NSNumber**:


    ```


    //create an NSNumber with a BOOL

    n = [NSNumber numberWithBool:YES];


    //add the NSNumber to an array

    [theArray addObject:n];


    ```


    # Working with Dates


    The **NSCalendarDate** class gives you many options when it comes to working with
    dates and times. One of the most common tasks you perform is finding the current
    date or time. You can do this in one line of code with an **NSCalendarDate** class
    method:


    ```


    NSDate *theDate = [NSCalendarDate date];


    ```


    After you retrieve this date, you can easily convert it into an **NSString**,
    suitable for display. Simply use the **description** method to display the date
    in standard international format. In this example, **NSLog** displays the date
    in the console:


    ```


    NSLog(@"theDate = %@", [theDate description]);


    ```


    This yields results like this:


    ```


    theDate = 2008-08-05 05:08:13 -0500


    ```


    The **description** method is okay for quick-and-dirty date displays, but sometimes
    you want to display the date in a more human-friendly format. The **descriptionWithCalendarFormat**
    method can help you build an **NSString** that holds the date or time. The **descriptionWithCalendarFormat**
    method has three parameters. The first parameter is the only one that you have
    to worry about for simple date work. That parameter is an **NSString** that represents
    the date in the format you desire.'
  merge: -1
  img_proc: true
- pgno: 216
  md: "Cocoa gives you lots of flexibility when it comes to formatting your date for\
    \ display. For example, the following code snippet formats a date as you might\
    \ expect to see it in the United States:\n\n```\n```objectivec\nNSLog(@\"theDate\
    \ = %@\",\n      [theDate descriptionWithCalend arFormat:@\"%A, %B %d, %Y\n  \
    \    (%I:%M)\" timeZone:nil locale:nil]);\n```\n```\n\nThis results in a date\
    \ formatted like so:\n\n```\n```\ntheDate = Monday, August 04, 2008 (10:15)\n\
    ```\n```\n\nThat odd-looking string that you pass to the descriptionWithCalendarFormat\
    \ method dictates which elements of the date you want to display. Apple calls\
    \ those strange characters date conversion specifiers. Each specifier is a one-letter\
    \ code that corresponds to some aspect of the date. In the preceding example,\
    \ %A represents the name of the day of the week, which in this case is Monday.\
    \ Next comes %B, which stands for the name of the month (in this case, August).\
    \ You can continue to string together these specifiers until you've built a date\
    \ in the format you prefer. Table 10-1 details some of the more common specifiers.\n\
    \n| Table 10-1 | Date Format Specifiers |\n| --- | --- |\n| Code | What It Represents\
    \ |\n| %B | Month name |\n| %m | Month as an integer |\n| %e | Day of the month\
    \ as an integer |\n| %d | Day of the month as a two-digit integer |\n| %A | Weekday\
    \ name |\n| %I | Hours |\n| %M | Minutes |\n| %S | Seconds |\n| %Y | Year |"
