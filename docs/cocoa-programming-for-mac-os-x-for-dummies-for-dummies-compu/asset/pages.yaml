- pgno: 74
  md: 'Although the numbers that your code displays are very close to the actual values
    entered in the interface at runtime, they aren''t the exact values. Clearly, you
    need a solution that formats numbers according to some guidelines. For example,
    you may only care about two decimal points of precision.


    # # Fixing the code


    Without getting into a bunch of technicalities, a float variable can have many
    digits in the decimal portion of its value. When num1, num2, or their sum have
    decimal digits that cannot be represented by a non-repeating sequence in binary,
    rounding and truncation problems exist. These problems are an inherent fact of
    life based on how your computer works with floating point numbers.


    To get around this problem, one solution is to format the answer before displaying
    it. A few lines of code from Cocoa''s NSNumberFormatter class of the problem:


    ```

    NSNumber *answerFormatter =

    [[NSNumberFormatter alloc] init] autorelease];

    [answerFormatter

    setFormat:@"#,###.00;0.00; (###0)"];

    [answerField cell setFormat:answerFormatter];

    ```


    Don''t be frightened if you don''t understand this intimidating blur of code.
    This chapter is about Xcode, not Objective-C code like Chapter 6.


    The first two lines of code (which incidentally are just function that appear
    on two lines) create an NSNumberFormatter object. The purpose behind NSNumberFormatter
    object is to regulate the format of numbers.


    Next, the code sends the setFormat message to the answerFormatter object, passing
    a string of text. This string designates what formats are allowed for this NSNumberFormatter
    object. The string is of three formats, each separated by a semicolon. You don''t
    have to worry about the precise format of these three strings, but to get a hint,
    the first one defines the format of positive numbers, the second one accounts
    for cases when the number is 0, and the last formats negative numbers.


    Finally, the code applies the NSNumberFormatter to answerField in the interface.
    To help you understand where this bit of code fits into the big picture, here''s
    the listing of the completed source code for Fusebox.m (the NSNumberFormatter
    object is in bold). Note that when you add the code, the last breakpoint moves
    accordingly.'
  merge: -1
  img_proc: true
