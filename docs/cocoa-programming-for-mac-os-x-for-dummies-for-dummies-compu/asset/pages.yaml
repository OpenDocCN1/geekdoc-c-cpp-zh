- pgno: 249
  md: "**11. Add the drawRect method to the MyCanvas.m file:**\n\n```\n```objc\n-\
    \ (void)drawRect:(NSRect)rect {\n    // Drawing code here.\n}\n```\n```\n\nThe\
    \ drawing code appears in this method. The `drawRect` function takes care of redrawing\
    \ your `Custom View` by automatically refreshing the view from your application’s\
    \ event loop.\n\n# ## Painting with Lines and Shapes\n\nWith your interface and\
    \ custom view ready for displaying graphics, you can now add some code to make\
    \ it actually display something. Before you draw something, you have to define\
    \ what *something* is. When it comes to defining shapes in Cocoa, paths are the\
    \ name of the game.\n\n# ### Starting with Bezier paths\n\nIf you’ve ever played\
    \ connect the dots, you’re already well on your way to understanding how paths\
    \ work. A *path* is a collection of points that together form the outline of a\
    \ shape. For example, a square-shaped path has four points, an octagon-shaped\
    \ path has eight points, and so on. Cocoa represents paths with the `NSBezierPath`\
    \ type. Typically you begin working with paths by declaring a pointer to a `NSBezierPath`:\n\
    \n```\n```objc\nNSBezierPath  *thePath;\n```\n```\n\nThen you create a path. Your\
    \ path might form a square, a circle, or some other shape. Because you’ll want\
    \ to create different shapes, Cocoa gives you several methods for creating paths.\n\
    \nOne of the most common paths you’ll create is the shape of a rectangle. For\
    \ that, you can use the `bezierPathWithRect` method of the `NSBezierPath` class.\
    \ The `bezierPathWithRect` method takes a `Rect` (which defines its origin and\
    \ size) as its sole parameter. Because the `drawRect` function passes in a `Rect`\
    \ that describes the dimensions of the `MyCanvas` object, you can easily create\
    \ a rectangular path around `MyCanvas`:\n\n```\n```objc\n- (void)drawRect:(NSRect)rect\
    \ {\n    \n    NSBezierPath  *thePath;\n    thePath = [NSBezierPath bezierPathWithRect:rect];\n\
    }\n```\n```"
