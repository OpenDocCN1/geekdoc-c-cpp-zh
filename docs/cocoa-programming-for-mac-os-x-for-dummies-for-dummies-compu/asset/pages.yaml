- pgno: 411
  md: '# Cocoa is hot! Stir up apps for Mac OS X, iPhone™, and iPod® Touch


    It’s a great time to go for Cocoa, because it’s not only Apple’s preferred framework
    for developing software, it’s also the best way for you to create software for
    Mac OS X and iPhone. This book gives you a solid foundation in Cocoa and the unusual
    syntax of Objective-C. You’ll learn what’s new in Cocoa frameworks and create
    applications step by step.


    +   *   **X marks the start** — see how Xcode underlies your applications as the
    main component of Apple’s Developer Tools

    *   **Be objective** — examine the basics of the Objective-C language and the
    elements of a Cocoa interface

    *   **Add bells and whistles** — spruce up your apps with audio, video, Internet
    features, stylized text, and more

    *   **Graphically speaking** — create applications with the stunning graphics
    for which Macs are famous

    *   **High-end Cocoa** — see how to build apps with multiple documents or even
    have Xcode build an interface for you


    Go to www.dummies.com/go/cocoafd to find project files for the examples in the
    book


    **Erick Tejkowski** was still in elementary school when he began helping to instruct
    teachers on Apple computers. As a professional developer, he has designed software
    for clients as varied as Chicken of the Sea, Energizer, Nextel, Edys-Dreyers,
    Rigid Medical, and Leap Pad.


    ![](img/ea40cad434a338535474e82c1a6ace20_411_0.png)


    # Open the book and find:


    +   *   Tips for building a good interface

    *   How to work with Cocoa numbers, arrays, Booleans, and dates

    *   Advice on managing files

    *   Ten tips for easier Cocoa programming

    *   How to simplify with key-value coding

    *   What to do with Cocoa on the Internet

    *   How to add bindings to your application

    *   Steps for building document-based applications


    Go to dummies.com for more!


    For Dummies®

    A Branded Imprint of

    WILEY


    $34.95 US / $41.99 CN / £22.99 UK


    ISBN 978-0-470-43289-1

