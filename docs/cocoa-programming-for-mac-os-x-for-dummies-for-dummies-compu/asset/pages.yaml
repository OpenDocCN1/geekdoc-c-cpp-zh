    # ### *NSMutableArray*


    The `NSArray` class’s one shortcoming is that you can’t alter it after you’ve
    created it. When you can’t change something (such as an array), it’s *immutable*.
    Conversely, those that you can change are *mutable* arrays. Thus, Cocoa also offers
    the `NSMutablerray`. To create an `NSMutablerray`, you can use its `arrayWithCapacity`
    method:


    ```

    ```

    NSMutableArray  *theArray = [NSMutableArray arrayWithCapacity:0];

    ```

    ```


    Because you can grow or shrink `NSMutablerray` arrays at will, it’s safe to create
    the array with space for zero items.


    ![](img/ea40cad434a338535474e82c1a6ace20_213_0.png)'
