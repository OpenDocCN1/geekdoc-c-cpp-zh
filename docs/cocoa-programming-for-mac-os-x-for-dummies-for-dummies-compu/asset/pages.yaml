  md: '# Slider Control


    *Sliders* are the controls you use to represent a range of values. The control
    gives users an opportunity to select a value in that range by moving (or sliding)
    the knob of the slider control. `NSSlider` is the class behind the slider functions
    in Cocoa. Again, the NSSlider control appears in the Library window, as shown
    in Figure 9-12.


    Sliders come in a variety of styles. They can span horizontally or vertically
    or even in a circular fashion. They can also display tick marks. Figure 9-13 illustrates
    the different combinations of styles that sliders can have.


    Sliders have two modes of operation: continuous and not continuous. When you check
    the Continuous property of an NSSlider in the Inspector window, that slider fires
    its action any time the user moves it. Conversely, when you deselect the Continuous
    property, the slider triggers its action when, and only when, the user lets up
    on the mouse.


    ![](img/ea40cad434a338535474e82c1a6ace20_197_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_197_1.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/ea40cad434a338535474e82c1a6ace20_198_0.png)


    Because sliders represent a range of values, they have minimum and maximum values.
    They also have a current value, which represents the position of the slider button
    in the range of minimum and maximum values. You can set these values in the Inspector
    window.


    If you want to find out what the current value of the slider is in code, do something
    like this:


    ```

    ```float x = [theSlider floatValue];```

    ```


    You can also set the current position of the slider by using the setFloatValue
    method:


    ```

    ```[theSlider setFloatValue:3.14];```

    ```


    You aren’t restricted to the setFloatValue method, however. Because NSSlider inherits
    from NSControl, among other classes, you can use the methods of NSControl to work
    with the slider. The setFloatValue method is just one method of NSControl. There
    are others, which you can view in the built-in documentation. For example, if
    you don’t care about slider values that contain decimal points, you can use the
    setValue method of the NSControl:


    ```

    ```[theSlider setIntValue:5];```

    ```


    # ## Tab Views


