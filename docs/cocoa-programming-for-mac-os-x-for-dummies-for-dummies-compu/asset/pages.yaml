- pgno: 360
  md: '# **Chapter 19**

    # Core Data


    +   **In This Chapter**


    * Discovering the greatness of Core Data

    * Creating your Core Data project

    * Defining your model

    * Building your interface


    After you have some experience programming applications for the Macintosh, you
    soon realize that you spend an inordinate amount of time doing some of the same
    tasks over and over. One aspect in particular that you find yourself repeating
    is handling data. Many applications help users with data management. For example,
    a recipe application might help users organize information like ingredients, steps
    in a recipe, and special cooking instructions. Other applications — for example,
    iTunes — might assist users in organizing, sorting, and managing media files like
    music and video.


    So many applications helping users with data aren’t a surprise. Computers are
    exceedingly good at managing data, and lots of it. What might be surprising though
    is that programmers usually have to do all the hard work of writing code to handle
    all this data — until now. In this chapter, I show you how Cocoa makes adding
    data management to your projects easy with Core Data.


    # ## What’s So Great about

    ## Core Data Anyway?


    Core Data is a relative newcomer to the Cocoa programming scene, but don’t let
    its youth and inexperience dissuade you from unleashing its talents. *Core Data*
    is a framework of around a dozen pre-made classes that allows you to easily add
    data management to your applications. And oftentimes, Core Data can do so without
    you even writing a single line of code!'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Core Data is handy for a number of reasons:


    +   Core Data helps you define data in a structured fashion.


    +   Core Data handles a lot of the messy (and boring) programming work for you,
    so you don’t have to do it.


    +   Core Data can save and open data files for you automatically.


    +   Core Data can even build a functional interface for you.


    +   You might not even have to write a lick of code to take advantage of it!


    When you’re writing Cocoa applications for personal use, sometimes all you want
    is a quick-and-dirty hack to fulfill your needs. In these cases, you probably
    don’t mind how the interface works or what additional applications the Cocoa project
    requires. All you care about is the functionality of your application.


    Core Data gives your Cocoa project instant access to all these powerful features
    that are inherent to a variety of applications. Data management is an important
    aspect for a wide range of applications, and Core Data can help you achieve your
    goals more smoothly and accomplish things faster.


    Core Data isn’t just good at juggling data for you. It also helps you write cleaner,
    more structured software. Furthermore, it often can do so without you writing
    any code. Less code means less bugs. And less support. And less headaches. That’s
    right, Core Data even has the healing power of aspirin! Just kidding on that last
    part, but you’ll be so amazed at how much Core Data can assist your programming
    efforts that you might be able to forego a trip or two to the pharmacy.


    # ## Creating a Core Data Project


    To begin working with Core Data in a Cocoa application, follow these steps:


    +   **1. Create a new Cocoa application project.**


    Launch Xcode and choose **File**:New Project.


    +   **2. From the list of project templates, choose Application on the left side,
    then Core Data Application on the right, as shown in Figure 19-1, and then click
    the Choose button.**'
  merge: -1
  img_proc: true
