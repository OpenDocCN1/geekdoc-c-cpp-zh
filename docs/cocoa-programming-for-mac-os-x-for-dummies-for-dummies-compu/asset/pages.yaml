  md: '![](img/ea40cad434a338535474e82c1a6ace20_41_0.png)


    Figure 2-4:

    Give your project a descriptive name and select a location for saving the project.


    # 7. Select a location for the project and click the Save button.


    Your hard drive buzzes and whirs for a few seconds, and then Xcode displays a
    project window. In the Finder, the project files are contained within a folder
    that has the same name as the one you designated in Step 6. In Xcode, the project
    window displays a list of elements in the project, grouped into folders (which,
    unsurprisingly, Xcode calls Groups & Files), as shown in Figure 2-5. Your project
    is comprised of the components on the left side of the project window. These components
    include class files, source code files, interface files, and images, among others.


    # 8. Open the Resources group folder and double-click the MainMenu.xib file.


    MainMenu.xib is the default interface file for your project. Your project opens
    in Interface Builder.


    Files in your project reside in one of a handful of group folders in Xcode. You
    can read all about these group folders in Chapter 3, which covers the operation
    of Xcode. For now, the only group folder that you need to be concerned with is
    the Resources folder.'
