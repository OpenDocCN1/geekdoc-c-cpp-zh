  md: '# 14 Part I: Developer Tools


    ![](img/ea40cad434a338535474e82c1a6ace20_33_0.png)


    Interface Builder''s features are not limited to WYSIWYG (what you see is what
    you get) interface editing. You can also create classes that have no visual representation.
    Although you don''t actually write the code in Interface Builder for your classes,
    you do define the basic structures and methods for them there. You can also connect
    the interface to your classes with simple drag-and-drop techniques, as shown in
    Figure 1-6.


    > Do you speak the language?


    Cocoa (like most kinds of programming) requires the use of a programming language.
    To create Objective-C, Python, Ruby, Java, or Script. This book uses Objective-C
    because it''s the ''native language'' of Cocoa. Objective-C is a superset of the
    traditional C programming language. If you have experience with C, you''re well
    on your way to understanding Objective-C. All the C functions you know and love
    are available to


    you in Cocoa. Objective-C, however, goes one step further and enhances C by adding
    oriented features to the language.

    Objective-C is a syntax that may look a little foreign to you at first, unless
    you''re familiar with Smalltalk. But after you get the hang of it, you''ll find
    that it isn''t hard to understand at all. Chapter 6 goes into the details of Objective-C,
    but you start using it in Chapter 2 to build your Cocoa project.'
