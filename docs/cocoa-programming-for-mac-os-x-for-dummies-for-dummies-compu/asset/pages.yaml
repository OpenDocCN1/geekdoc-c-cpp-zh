    # Adding outlets


    Next, add outlets to this new class. Outlets are references that connect your

    source code to elements in the interface.


    In the Simple Calculator project, users will enter numbers for a calculation in

    to text fields. The third text field displays the result of the calculation.

    Therefore, you need to make three outlets — one for each text field.


    To add outlets to a class in Xcode, add them to the Fusebox.h file.


    ```

    IBOutlet id answerField;

    IBOutlet id numberField1;

    IBOutlet id numberField2;

    ```


    These three outlets must appear between the Fusebox interface brackets,

    like this:


    ```

    @import <Cocoa/Cocoa.h>


    @interface Fusebox : NSObject {

    IBOutlet id answerField;

    IBOutlet id numberField1;

    IBOutlet id numberField2;

    }

    @end

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# Chapter 2: Creating Your First Cocoa Application\n\n# Adding an action\n\n\
    In addition to three outlets, add an action to the class. An action is a function\
    \ that executes when on some event that you assign in Interface Builder. The new\
    \ action in this class calculates the answer to the math problem posed by the\
    \ interface. You can name the new action calculateAnswer and define it this way:\n\
    \n+   - (IBAction)calculateAnswer:(id)sender;\n\nThis definition also appears\
    \ in Fusebox after the closing bracket, but before the @end statement. The completed\
    \ Fusebox.h file looks like this:\n\n```\n@import <Cocoa/Cocoa.h>\n@interface\
    \ Fusebox : NSObject {\n    IBOutlet id answerField;\nIBOutlet id numberField1;\n\
    IBOutlet id numberField2;\n}\n-(IBAction)calculateAnswer:(id) sender;\n@end\n\
    ```\n\n# Adding the class to the interface\n\nWith the class definition complete,\
    \ switch to Interface Builder.\n\n+   1. In Interface Builder, choose File:Read\
    \ Class Files.\n\n+   An Open dialog appears, as shown in Figure 2-13.\n\n+  \
    \ 2. Select Fusebox and click the Open button.\n\nYou won't see much happen yet,\
    \ but you have just informed your interface about the new Fusebox class.\n\n![](img/ea40cad434a338535474e82c1a6ace20_50_0.png)"
  merge: -1
