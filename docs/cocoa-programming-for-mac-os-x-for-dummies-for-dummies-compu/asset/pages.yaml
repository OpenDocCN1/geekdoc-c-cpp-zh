  md: '![](img/ea40cad434a338535474e82c1a6ace20_42_0.png)


    Figure 2-5: MainMenu.xib contains the interface for your project..


    # Building an Interface


    When you double-click the MainMenu.xib in Xcode, the Interface Builder launches.
    Figure 2-6 shows the MainMenu.xib file open in Interface Builder.


    By default, the project''s main window should be open, ready for adding new controls.
    You do not see an open window in Interface Builder, double-click the Window object
    in the XIB project.


    This window is the starting point for your application''s interface. Because other
    people may use this application, it''s a good idea to make it look as nice as
    possible. By changing the window''s title:


    +   1. Open the Inspector window by choosing Tools: Inspector.


    The Inspector appears, showing you properties that pertain to the window, as shown
    on the right side of Figure 2-7. The Inspector window can display different types
    of information, but when it''s showing properties relating to a window, it''s
    titled Window Attributes.


    +   2. In the Inspector window, change the Title property to the name of your
    window.


    For example, you can change the title to Simple Calculator. The name shows up
    in the title bar of your window, as shown on the left side of Figure 2-7.'
