  md: "# # Adding Code to Make Your App Work\n\nBack in Xcode, click the Fusebox.m\
    \ file to reveal its contents. This is your main source code file and the place\
    \ where you add functions to make this application do something. The file isn't\
    \ empty. Interface Builder was kind enough to add some code to get started:\n\n\
    ```\n```\n@import Fusebox.h\n@implementation Fusebox\n@end\n```\n```\n\n![](img/ea40cad434a338535474e82c1a6ace20_55_0.png)\n\
    \nCocoa programmers are a special breed. Instead of using the term header files,\
    \ they speak of interface files. Likewise, source code files are called implementation\
    \ files.\n\nDon't worry if you don't understand everything yet. This is a shell\
    \ for you to use when you begin beginning the project. This code uses the header\
    \ file with this line:\n\n```\n```@import Fusebox.h```\n```\n\nIf you're a seasoned\
    \ C programmer, remember that #import in Cocoa is like #include in standard C.\
    \ The directive lets you know where the definition of your class is.\n\nAfter\
    \ the header, the source code lists the implementation of the Fusebox class:\n\
    \n```\n```@implementation Fusebox\n```\n\nOne part that Fusebox class is a calculateAnswer\
