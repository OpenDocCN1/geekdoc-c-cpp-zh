- pgno: 327
  md: 'Here are the attributes you can set in Interface Builder:


    +   ▴ **Display color:** Control the color of the \texttt{QTMovieView} when no
    movie is loaded. The default color is black, but you can change it to whatever
    color you desire.


    +   ▴ **Show controller:** Toggle the display of the built-in QuickTime controller,
    which appears at the bottom of the \texttt{QTMovieView} control when you load
    a movie into it. You''ll be familiar with the QuickTime controller if you''ve
    ever viewed a QuickTime movie in a Web browser or in the QuickTime Player application.
    The controller lets users control the playback of QuickTime content using a set
    of familiar buttons. Besides starting and stopping playback, you can rewind and
    fast forward through portions of the movie as well as adjust the volume during
    playback. Figure 16-9 shows a typical QuickTime movie controller.


    +   ▴ **Editable:** By default, Editable has a value of \texttt{NO} (that is,
    it''s deselected in the Inspector window). The QuickTime controller appears, as
    shown in Figure 16-9. When you set Editable to \texttt{YES} by selecting the Editable
    check box in the Inspector window of Interface Builder and then loading a movie
    in code, you see a controller that looks like Figure 16-10.


    The Editable attribute causes a \texttt{QTMovieView} to display a slightly different
    QuickTime controller. You can use this type of controller for different purposes,
    such as to select some portion of the movie. As you can see in Figure 16-11, Shift-clicking
    permits you to select some or all the movie in the \texttt{QTMovieView}.


    +   ▴ **Volume:** Toggle the display of the volume button control that appears
    at the left edge of the \texttt{QTMovieView}. When you set this attribute to \texttt{YES}
    by clicking the Volume check box in the Inspector window, the volume button displays.
    When \texttt{NO} (deselected), the volume button doesn''t display.


    ![](img/ea40cad434a338535474e82c1a6ace20_327_0.png)


    Figure 16-9: The standard QuickTime controller offers simple playback interface
    elements.'
