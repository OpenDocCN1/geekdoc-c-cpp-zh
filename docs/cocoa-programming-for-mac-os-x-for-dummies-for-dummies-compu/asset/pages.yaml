- pgno: 373
  md: "![](img/ea40cad434a338535474e82c1a6ace20_373_0.png)\n\n# # Building the Interface\n\
    \nThis is where all your hard work pays off! Sure, you could go about creating\
    \ an interface, adding buttons and tables 'til the cows come home, but why bother?\
    \ Xcode can do all the hard work for you! Yes, you read that right. Xcode can\
    \ actually create a full interface for you based on the data model alone! And\
    \ what’s more, it can even add complete functionality to the interface as well.\
    \ Follow these steps:\n\n+   1. **In Xcode, move the project window to the right\
    \ side of your screen.**\n\n   You’ll need the extra room because you need to\
    \ work with Xcode and Interface Builder at the same time.\n2. **Double-click MainMenu.xib\
    \ in the Resources folder to open Interface Builder, and in Interface Builder,\
    \ open your project’s main interface window so that it’s visible.**\n\n   Interface\
    \ Builder opens and displays the typical items in a default interface file.\n\n\
    \   Drag the window to one side of the screen, so you can see it and the Xcode\
    \ project window at the same time.\n3. **Return to Xcode and Option-drag the Book\
    \ entity from the graph paper–looking pane to the interface window in Interface\
    \ Builder.**\n\n   This step can be a little tricky to master, so don’t fret if\
    \ you can’t get it to work on your first try. You can drag the graphical representation\
    \ of the Book entity, not the one in the Entity pane.\n4. **Return to Interface\
    \ Builder and choose Master/Detail View in the New Core Data Entity Interface\
    \ window, as shown in Figure 19-15.**\n5. **Select the Search Field, Details Fields,\
    \ and Add/Remove check boxes and then click the Next button.**\n6. **Accept the\
    \ defaults (see Figure 19-16) and click the Finish button.**\n7. **Return to Xcode\
    \ again and Option-drag the Category entity from the graph paper–looking pane\
    \ to the interface window in Interface Builder.**"
  merge: -1
  img_proc: true
