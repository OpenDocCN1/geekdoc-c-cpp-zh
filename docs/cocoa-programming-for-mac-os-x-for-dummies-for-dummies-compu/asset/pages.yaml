- pgno: 152
  md: '# Chapter 7


    # MVC Design


    # In This Chapter


    +   - Getting familiar with the Model-View-Controller (MVC) design pattern

    - Building a project with MVC

    - Adding a View and a Controller


    I read Chapter 6, you looked at some of the basics of object-oriented programming
    with Cocoa. You examined how to define a class and how to create an object with
    that class. Along the way, I promised that this would make programming simpler
    and, more importantly, reusable,


    Sure, you can make classes and objects all day long, but how do they actually
    fit together to make an application? This chapter takes object-oriented programming
    to the next level and shows you at a abstract level how to design an application
    with all these classes. A thoughtful Cocoa programmer doesn''t throw a bunch of
    classes together and come out on the other side with a masterpiece. Instead, a
    Cocoa programmer thinks about the various parts of an application work and then
    designs the application using the famous Model-View-Controller (MVC) design pattern.


    ![](img/ea40cad434a338535474e82c1a6ace20_152_0.png)


    By following this design pattern, you can build applications that are modular,
    easier to read, and consist of components that you can reuse in other applications.
    One of the great benefits of object-oriented programming is the ability to reuse
    code. By reusing code, you can reduce the amount you need to spend programming,
    reduce the number of bugs you have in your code, and ultimately create better
    software. All is not necessarily smiles and sunshine when it comes to code reuse,
    however. You must rigorously debug your code and maintain a single version. If
    you don''t, you might inject a bug that propagates across all applications where
    you use the code.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Taking a Look at MVC Design


    MVC stands for the Model-View-Controller design pattern. Don''t let the words
    scare you, though. What it really means is that you can *design* your software
    according to a specific *pattern* that gives you the most bang for your buck.
    In case you haven''t guessed already, an application that follows the MVC design
    pattern has three different objects (at a minimum):


    +   ☛ **Model**: An object that provides data to your application.


    +   ☛ **View**: An object that displays data in your application.


    +   ☛ **Controller**: An intermediary object that obtains data from the Model
    and passes it to the View for display. Alternatively, the Controller might take
    data that''s changed in a View and inform the Model that it has changed, so the
    Model too can change.


    For a real-world example analogy, suppose you''re a student sitting in a class-room
    with a chalkboard and a dictionary:


    +   ☛ The dictionary is a storage of information, or in MVC terms, the *Model*.


    +   ☛ The chalkboard is the *View*, a place to display information.


    +   ☛ You, the student, are the *Controller*.


    Someone asks for a definition of a word. You (the Controller) consult the dictionary
    (the Model), and report the definition to the chalkboard (the View).


    What makes the MVC pattern so great is that at any time, you could replace any
    of the objects:


    +   ☛ You could replace the Model (the dictionary), with a different Model (a
    dictionary from a different publisher). The Controller and the View stay the same,
    but the Model changes. You (the Controller) and the chalkboard (the View) keep
    doing the same tasks that you always do. The Controller looks up a new word, and
    the View displays it.


    +   ☛ You could replace the chalkboard with a dry-erase board. This time, the
    View changes, but the Controller (you) and the Model (the dictionary) remain the
    same. You look up a word in the dictionary (the Model) and display it on the dry-erase
    board (the View) instead.


    +   ☛ Someone else could take your place as the Controller. A new student could
    step in as your replacement. The Model (the dictionary) and the View (the chalkboard)
    don''t change, but a new Controller (another student) takes your place. He can
    look up the word in the same dictionary (the Model) and display the definition
    on the same old chalkboard (the View).'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'With MVC, the Dictionary-Chalkboard-Person pattern can also work in reverse.
    For example, suppose that a new definition appears on the chalkboard (the View).
    The Controller would see the new definition and, knowing that the definition isn''t
    already in the dictionary (the Model), could tell the Model that it needs to be
    updated with the new definition. The analogy starts to break down a little here,
    but hopefully you get the gist.


    By separating the tasks that your Cocoa objects perform, you can make your software
    much more modular. This permits you to reuse classes quite easily. You can always
    move the chalkboard into a different classroom completely and use it there. Similarly,
    you can move dictionary, or even the student, into a different classroom, and
    they''ll function in much the same way as they did in the original classroom.


    ![](img/ea40cad434a338535474e82c1a6ace20_154_0.png)


    By following the MVC design pattern, your Cocoa objects can gain the same benefits.
    If you have an interesting or useful Model in one application, you can easily
    move it for use in another application. Similarly, if you have a really nice-looking
    View in one application, you can use it in other applications as well.


    Another great benefit of using MVC design patterns in your applications is that
    several Cocoa technologies rely on MVC. By using MVC in your applications, you
    can take advantage of these other Cocoa technologies. For example, Cocoa''s bindings
    technology requires the use of MVC design. By incorporating MVC into your own
    application, you can then take advantage of all the goodies that bindings provide.
    Check out Chapter 18 for more on bindings.


    # # Building a Project with an MVC Design


    To design an application that follows the MVC design pattern, you differentiate
    the classes in your application based on the functions they perform. For example,
    suppose you want to create a banking application to track the money in your bank
    account. Your design works like this:


    +   A Model class stores the balance in the account. The View class, the interface
    of the application, displays information to the user and accepts data input from
    that user. The Controller sits between the Model and the View.


    +   When the application wants to display the current balance, the Controller
    gathers the information from the Model and passes it to the View for display.


    +   When a user changes something in the View (for example, via a deposit or a
    withdrawal), the Controller gathers the information from the interface and passes
    it to the Model, so the Model can update the information. And in a round-trip
    fashion, the Controller can then ask the Model what the new account balance is
    and pass it to the View for display.'
  merge: -1
  img_proc: true
