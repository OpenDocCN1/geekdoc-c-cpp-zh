- pgno: 266
  md: '# Chapter 13


    # Managing Your Files


    # In This Chapter


    +   - Using file paths in Cocoa

    - Opening files

    - Finding out about files

    - Displaying a Files icon in your interface

    - Copying, moving, creating, and deleting files and folders

    - Creating a folder


    Almost every device that Apple ships sports some kind of storage device. Whether
    it’s the hard drive in your old iPod, a SuperDrive in your desktop Macintosh,
    or a flash drive in your MacBook Air, all storage devices share one common trait
    — they store data. To facilitate this storage, the Mac OS X operating system uses
    a hierarchical system of files.


    Cocoa has a large array of functions that you can use to make your file manipulation
    tasks easier. With only a few lines of code, it’s a cinch to open, copy, move,
    and delete any file or folder on your hard drive, assuming that you have adequate
    privileges for the file or folder. This chapter shows you how.


    # About Files and Folders in Mac OS X


    Mac OS X has several types of files. You are undoubtedly familiar with the most
    basic file type—a *document*. You use document files every time you save work
    in your favorite word processor. When you want to view the document, you simply
    reopen it with your word processor.


    Documents aren’t the only type of file on your Mac, however. Another important
    file type is the *application*. You’re probably also very familiar with this file
    type because you use applications to surf the Web, send e-mail, draw pictures,
    or program with Xcode. In fact, the whole point of Cocoa programming is to create
    applications. Cocoa applications come in a special *directory* (*or bundle*)'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'that the Finder treats as a single file. An application bundle contains directories
    and individual files that contain the executable and supporting files for your
    application. The idea here is that an application can store its resources (such
    as pictures, audio, and data) in the same bundle as the application. The accessory
    files are kept with the application, while also hiding them from the user. That
    way, users are less likely to delete files that are important to the operation
    of an application. Many documents also come as bundles, such as iMovie and iDVD
    projects, RTFD files from TextEdit, and iPhoto Library files.


    To help you keep your documents and applications in order, Mac OS X organizes
    files in a hierarchical structure of folders. Folders are containers of files.
    A folder can hold documents, applications, or even other folders. Some folders
    contain your operating system; others are ones that you create and modify yourself.


    ![](img/ea40cad434a338535474e82c1a6ace20_267_0.png)


    Computer geeks also refer to folders as directories. This chapter uses the terms
    folder and directory interchangeably. Not content to keep things simple, geeks
    also refer to applications as executables. The two terms are synonymous, so whenever
    you hear someone say, “place the executable in the directory,” you can be sure
    that he could also mean “place the application in the folder.” To confuse naming
    matters even further, you’ll also hear the terms package and bundle used to mean
    the same thing. Control-click a bundle in Finder, and you’ll find a Show Package
    Contents menu item. Choosing it opens the bundle as a folder to reveal its contents.


    For years, Macintosh users have happily navigated the files on their hard drives
    by double-clicking a folder icon to open it. With Mac OS X, most Mac users got
    their first taste of the command line by using the Terminal, which uses the strange
    and frightening world of paths. Paths are a textual method of describing where
    a file or folder resides on a drive. For example, the Mac OS X Fonts folder resides
    in the following location:


    ```

    /Library/Fonts

    ```


    Whenever you see the / character, think folder or directory. The preceding example
    reveals that the Fonts folder resides in the Library folder. If your username
    is Fred, your home folder is located at this path:


    ```

    /Users/Fred

    ```


    These two examples of paths assume that you''re describing a file folder or file
    on your boot drive (assuming that the /Users file system mount point resides on
    the boot volume). The boot drive contains the operating system that you''re using
    at any one time. If you have other drives connected to your machine, the path
    of a file or folder located on that machine is pre- ceded by Volumes and the name
    of the drive. For example, if you have a'
  merge: -1
  img_proc: true
