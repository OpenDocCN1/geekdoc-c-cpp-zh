  md: '# Debugging Your Project


    Because computer programming can be a complex process, it''s easy to make mistakes.
    You can introduce errors to your code in a number of ways. Here are two:


    +   - Syntax errors are errors in the grammar of your code that make Xcode unable
    to interpret the code. Typographical mistakes in your code may lead to syntax
    errors in your project.

    - Runtime errors have nothing to do with the syntax of your code. Rather, the
    logic of your code contains errors that produce an application that doesn''t function
    properly. These mistakes might be syntactically correct and still allow Xcode
    to compile and link your code into an application, yet produce unexpected or incorrect
    results. The application may run and even work as expected sometimes, but at some
    point, your application will do something wrong. A purple apple might be displayed
    instead of a red one in your graphics application, an enemy invader won''t die
    when shot in your video game, or a miscalculation yields an incorrect numerical
    result in your spreadsheet application.


    The only way to know if you have any bugs in your code is to thoroughly test your
    projects. When you debug a project, you build, run, and test your application
    until you''re convinced it''s bug.


    To begin debugging, follow these steps:


    +   1. Build and run the project you''ve been working with throughout this chapter.

    2. Type values in the two number fields and then click the Calculate button.

    3. Change the numbers and click the Calculate button again.

    4. Repeat Step 3 until you''re convinced that the project operates as it should.


    For example, three consecutive tests of the project yield the following results:


    ```

    1 + 2 = 3

    3.25 + 4.75 = 7.999998099265137

    3.2 + 4.75 = 7.949998099265137

    ```


    Uh oh! That last test didn'' produce results that you might expect. What''s going
    on here? There seem to be three problems:'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 52 Part I: Developer Tools


    +   - The code is calculating the sum of the two numbers incorrectly in some situations.

    - The problem seems to occur only when using decimal numbers.

    - The error happens only when some decimal numbers are used, but not others. For
    example, 0.25 + 0.75 works as expected, but 4.2 + 2 does not. The reason that
    this happens is because the computer can''t display fractional values (the numbers
    after the decimal point) if the values can''t be represented as a non-repeating
    sequence in binary. If you want to know more about this topic (a word warning:
    it can get very messy), search for IEEE 794 on Google.com.


    To you figure out where things are going wrong, Xcode includes a powerful debugger.
    With the debugger, you can follow along as your project''s code executes and watch
    for any indication of a problem.


    # Adding breakpoints


    Before debugging this code, first set some breakpoints. Breakpoints are small
    markers that appear in the column to the left of the code. To insert a breakpoint,
    simply click in that leftmost column next to the line of code that you want to
    check with the debugger, as shown in Figure 3-9.


    ![](img/ea40cad434a338535474e82c1a6ace20_71_0.png)


    Figure 3-9:

    Click in the leftmost column of the editor to set a breakpoint.'
  merge: -1
  img_proc: true
