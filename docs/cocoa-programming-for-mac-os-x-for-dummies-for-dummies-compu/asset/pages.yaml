- pgno: 256
  md: "![](img/ea40cad434a338535474e82c1a6ace20_256_0.png)\n\nSuppose that you want\
    \ to display a stop sign next to your traffic-light graphic. A stop sign is an\
    \ octagon. To create a stop-sign-shaped path, simply create eight `NSPoint` variables\
    \ and populate them with points that represent the shape of a stop sign. Because\
    \ tracking the various points in complex paths can get tedious, Cocoa gives you\
    \ the ability to define paths relative to the last point in the path. That way,\
    \ you can define the starting point with the actual coordinates and define the\
    \ rest of the path relative to that point.\n\n![](img/ea40cad434a338535474e82c1a6ace20_256_1.png)\n\
    \n> If you want to move that path to another location later, you have to change\
    \ only one point — the first one. The rest of the path follows the first point\
    \ without any other code changes.\n\nThe following code creates the points for\
    \ a path in the shape of a stop sign. This code uses points that are relative\
    \ to the first point:\n\n```\n/*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*/\n//        \
    \  DRAW A STOP SIGN\n/\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\\
    *\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*\\*/\n\n    // Create the\
    \ eight points of an octagon (stop sign)\n    NSPoint pt1,pt2,pt3,pt4,pt5,pt6,pt7,pt8;\n\
    \n    //Define the points\n    pt1 = NSMakePoint(300, rect.size.height-220);\n\
    \    pt2 = NSMakePoint(100, 0);\n    pt3 = NSMakePoint(50, 50);\n    pt4 = NSMakePoint(0,\
    \ 100);\n    pt5 = NSMakePoint(-50, 50);\n    pt6 = NSMakePoint(-100, 0);\n  \
    \  pt7 = NSMakePoint(-50, -50);\n    pt8 = NSMakePoint(0, -100);\n```"
  merge: -1
  img_proc: true
- pgno: 257
  md: 'The first point is relative to the origin of the view. Each of the last seven
    points has a value that’s relative to the point that precedes it in the list.


    Here’s how to create a path with relative points:


    +   1. **Define relative point positions for a path.**


    Use the following guidelines:


    +   • *Positive x value*: Path moves to the right.

    • *Negative x value*: Path moves to the left.

    • *Positive y value*: Path moves up.

    • *Negative y value*: Path moves down.


    +   2. **After you define the various points on the path, create the NSBezierPath
    with the bezierPath class method of the NSBezierPath class.**


    ```

    // Create a stop sign path

    [NSBezierPath *stopSign = [NSBezierPath bezierPath];

    ```


    +   3. **Add the points to the path.**


    For the first point, use the moveToPoint function. For subsequent points, use
    the relativeLineToPoint function because you should position these points relative
    to the first point:


    ```

    [stopSign moveToPoint:pt1];

    [stopSign relativeLineToPoint:pt2];

    [stopSign relativeLineToPoint:pt3];

    [stopSign relativeLineToPoint:pt4];

    [stopSign relativeLineToPoint:pt5];

    [stopSign relativeLineToPoint:pt6];

    [stopSign relativeLineToPoint:pt7];

    [stopSign relativeLineToPoint:pt8];

    ```


    +   4. **Close the path with the closePath function:**


    ```

    [stopSign closePath];

    ```


    +   5. **With a path defined, you can apply the usual color, fill, and stroke
    commands to it.**


    For example, to fill in the stop sign with red and outline it in white, use code
    like this:


    ```

    // Draw the path

    [[NSColor redColor] set];

    [stopSign fill];


    // Draw the path

    [[NSColor whiteColor] set];

    [stopSign setLineWidth: 5];

    [stopSign stroke];

    ```'
  merge: -1
  img_proc: true
