- pgno: 229
  md: 'Manipulating Text


    So far in this chapter, I''ve shown you how to create style over substance. Other
    important aspects of working with text in NSTextView are the capability to edit,
    copy, paste, and alter its text.


    Pasteboard manipulations


    One common feature that every Mac OS X application has is access to the Pasteboard
    (or Clipboard). Like the Font menu, Cocoa takes care of the Edit menu too; you
    don''t have to do anything to implement it. The Edit menu just works! The Edit
    menu in OS X offers the typical cut, copy, and paste features that you might expect
    and also implements full-blown spell check and find functions. Figure 11-10 shows
    the spell-checker.


    ![](img/ea40cad434a338535474e82c1a6ace20_229_0.png)


    The Edit menu hasn''t enabled its Undo and Redo menu items. The fix for this is
    simple enough:


    +   1.  In Xcode, double-click the MainMenu.xib file to open it in Interface Builder.

    2.  Open the window for your interface and double-click the NSTextView. Make sure
    to double-click; a single click only selects its Scroll View container.

    3.  Press ⌘+I to open the Text View Attributes Inspector window.

    4.  In the Attributes section of the Info window, select the Undo check box, as
    shown in Figure 11-11.


    Now, your users can undo any actions that they perform in the text view. You managed
    to add this useful functionality by clicking one check box.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/ea40cad434a338535474e82c1a6ace20_230_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_230_1.png)


    # # Manual editing


    Sometimes you may want to alter the text in an `NSTextView` without using the
    Pasteboard. Perhaps the most common editing task that you''ll want to perform
    is to change the text that appears in an `NSTextView`. You can accomplish this
    task by using the `setString` method of the `NSSring` class. Create an `NSSring`
    and assign a string to it:


    ```

    ```objective-c

    NSSring* someString = @"Cocoa says Hello!";

    ```

    ```


    ![](img/ea40cad434a338535474e82c1a6ace20_230_2.png)


    Note the @ character preceding the string. The @ character is an Objective-C operator
    that tells the compiler to allocate a constant `NSSring` object with the stated
    value.


    After you have an `NSSring`, it''s a simple matter to display it in an `NSTextView`:


    ```

    ```objective-c

    [extView setString:someString];

    ```

    ```


    To see how it works, follow these steps:


    +   1. In Xcode, declare the `displayAsString` method by adding the following
    line to the `MyTextController.h` file.


    ```

    ```objective-c

    - (IBAction) displayAsString: (id) sender;

    ```

    ```'
  merge: -1
  img_proc: true
