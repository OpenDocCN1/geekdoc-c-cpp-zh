- pgno: 133
  md: '# # Defining methods in an interface file


    After you define a class in the interface file, you can move on to the implementation
    file. The implementation file has a filename extension of .m as in MyClass.m.
    It''s where you define the various methods for your class. The implementation
    file usually begins with an import statement to load the interface file:


    ```

    #import "MyClass.h"

    ```


    The implementation and end lines come after the import statement, within which
    you define the methods for the class:


    ```

    #import "MyClass.h"


    @implementation MyClass

    @end

    ```


    So far, this is all done for you Xcode when you create a new class. You then define
    the various methods that appear in the interface file. Following the previous
    example interface file, the implementation file looks like:


    ```

    #import "MyClass.h"


    @implementation MyClass

    -(void)doSomething {


    -(void)doSomethingElse:(NSString*)aString {


    -(void)drawNSString:(NSString*)NSString

    atThisPosition:(int)xPos atThisPosition:(int)yPos {


    @end

    ```


    Each of the methods are defined here. They look just like the declaration in the
    interface file, but instead of ending with a semi-colon; curly braces begin and
    end the method. You put the code for each method between those braces. Again,
    C programmers should feel more or less at home here because C does the same thing
    (as does C++, Java, and even JavaScript).'
  merge: -1
