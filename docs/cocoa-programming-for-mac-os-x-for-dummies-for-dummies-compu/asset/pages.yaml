    # # The Interface Building Process


    Now that you''ve surveyed the basics of Interface Builder, it''s time to put it
    to use. If you built the interface in Chapter 2, you have a Simple Calculator
    that adds two numbers together. Limited functionality doesn''t make for a very
    useful calculator.


    If you haven''t built the Simple Calculator in Chapter 2, you can use the My First
    Project.xcodeproj file.


    To give users a choice of mathematical operations, you can add a pop-up menu.
    Instead of being limited to addition, you can create also, subtract, multiply,
    or divide. This additional functionality clearly makes for a more useful calculator.


    If you simply drag a new pop-up button into your application''s interface and
    connect it to a outlet in the Controller class and header files in Xcode have
    no way of knowing about the change. Either you have to alter the source code files
    by hand or merge new files with the ones you already created. When doing so, you
    run the risk of deleting all your existing work. Interface Builder offers a solution
    to this dilemma. When you attempt to create header and implementation files that
    already exist, Interface Builder asks (see Figure 4-16) whether you''d prefer
    to overwrite existing files (thus deleting your previous work) or merge the new
    files with the existing ones (thus retaining your previous work).'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 78 Part I: Developer Tools


    Figure 4-16:

    To retain previous merges, merge your new header and implementation files with
    existing files.


    ![](img/ea40cad434a338535474e82c1a6ace20_97_0.png)


    Because of this special consideration, you need to create the files and add them
    to Xcode. If files already exist in your project, you can edit them by hand or
    merge them with the new files:


    +   * If your project doesn''t have header (.h) or implementation (.m) files,
    create them by choosing File:Write Class Files.

    * If the files already exist in your project in Xcode, choose File:Write Class
    Files and merge when queried in the dialog that appears. When you choose to merge
    files, Interface Builder launches the FileMerge application, which handles the
    sometimes complex task of merging source code and header files.


    If you''re making small changes to your interface, sometimes it''s just as easy
    to edit the header and source code files in Xcode by hand rather to go through
    the merge process.


    Improving your existing project to include addition, subtraction, multiplication,
    and division is simple. I show how you in in the next sections.


