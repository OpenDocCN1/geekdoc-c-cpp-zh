  md: '# Part I: Developer Tools


    10. Bring Xcode to the foreground and press Command+R to run your application.


    Something isn''t quite right, as shown in Figure 4-14. The Application menu is
    still stuck with MyProject.


    What''s going on here? Your application supplies the text for your Application
    menu by using a string in its Info.plist file, not from the text you entered in
    Interface Builder. Go figure!


    The Info.plist is a file that contains information about your application. You
    can find the version number for your application, assign an icon to the application,
    and set the default language for the application, among other tasks.


