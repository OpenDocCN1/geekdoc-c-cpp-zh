- pgno: 178
  md: '# Beneath the Sheets


    Besides the run-of-the-mill windows that you''ve used so far, Cocoa offers a special
    animated window — a sheet. A sheet is sort of a parasitic window, in that it needs
    a host, or a parent, from which to spring. Because its functionality is directly
    connected to another window, it appears from out of the blue at the top of its
    parent window, as shown in Figure 8-5. You''re probably already familiar with
    sheets because many common applications use them — often when working with files.


    Besides looking neat when they open, sheets also serve a useful purpose. Because
    they''re attached to a parent window, they indicate a specific scope for a task:
    that of the parent window. In other words, if a sheet appears, you can be certain
    that any actions you perform in that sheet are pertinent to the parent window
    when the sheet closes. This is a subtle, but important, distinction.


    ![](img/ea40cad434a338535474e82c1a6ace20_178_0.png)


    A sheet behaves in a particular manner — modally: it takes over a window and doesn''t
    let the user perform any other action in the parent window until you dismiss it.
    Usually the user has to make some kind of decision before the sheet can be dismissed.


    Implementing sheets takes some special preparation. To see how they work, launch
    Xcode and create a new Cocoa application. In the project window, double-click
    MainMenu.xib to open the interface in Interface Builder and then perform the following
    steps to add a sheet to your project:'
  merge: -1
  img_proc: true
