- pgno: 307
  md: '# Sending e-mail from your favorite client


    When you click an e-mail link on the Internet, your Web browser instructs your
    e-mail client to open a new message, often with the To and Subject fields completed
    for you. Adding this kind of functionality to a Cocoa application is simple. In
    fact, if you followed along earlier when loading a URL in a browser, you''re well
    on your way to creating an e-mail message.


    The main difference between creating an e-mail message and loading a URL in a
    browser is the format of the URL. Whereas a typical URL in a browser looks like
    this:


    ```

    http://www.wiley.com

    ```


    an e-mail URL looks like this:


    ```

    mailto:yourFriend@email.com

    ```


    Otherwise, you handle the two URLs identically. To create an e-mail addressed
    to your friend, simply pass the e-mail URL for that friend to the openURL method
    of the NSWorkspace class. For example, to send your friend an e-mail, use code
    like this:


    ```

    NSURL *theURL =

    [NSURL URLWithString:@"mailto:yourFriend@email.com"];

    if ( [[NSWorkspace sharedWorkspace] openURL:theURL] )

    NSLog(@"Email Loaded");

    ```


    If you know HTML, you''ve probably already guessed that it''s possible to add
    other attributes to the e-mail address. If you want to attach a subject to an
    e-mail, simply tack it to the end of the e-mail URL preceded by ?subject=, as
    follows:


    ```

    mailto:yourFriend@email.com?subject=Important Message

    ```


    If you want to e-mail more than one friend at a time, list additional addresses,
    with each separated by a comma:


    ```

    mailto:yourFriend@email.com, anotherFriend@email.

    com?subject=Important Message

    ```


    You can also CC and BCC your other friends with a simple e-mail URL. The following
    e-mail URL sends an e-mail to yourFriend@email.com with an'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'Important Message Subject heading. The same message also goes to your other
    friend (otherFriend@mail.com):


    ```

    mailto:yourFriend@mail.com?subject=Important Message

    ?cc=otherFriend@mail.com

    ```


    Keep on tacking the new parameters to the end of the e-mail URL address to suit
    your needs. Just remember to always precede each parameter with a question mark.
    Pass this URL to the openURL method of the NSWorkspace to launch your e-mail client
    and create a new e-mail according to your specifications. Or, you can enter a
    mailto address in a WebKit Web browser, as shown in Figure 15-6.


    ![](img/ea40cad434a338535474e82c1a6ace20_308_0.png)


    E-mail clients use the question mark character as a separator, so you can''t use
    it as-is in a URL. Instead, you must use a hex character encoding if you want
    to include a ? in your subject. For example, to send an e-mail with the subject
    *Ready?*, convert the question mark to its hex equivalent by modifying the mailto
    URL as follows:


    ```

    mailto:yourFriend@mail.com?subject=Ready%3F

    ```


    ![](img/ea40cad434a338535474e82c1a6ace20_308_1.png)


    Figure 15-6: Creating an e-mail is as easy as loading a Web page in your browser.'
