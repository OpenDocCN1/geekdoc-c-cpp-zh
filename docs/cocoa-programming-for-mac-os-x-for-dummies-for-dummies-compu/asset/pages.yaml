  md: '# Chapter 10


    # Cocoa Data Types


    # In This Chapter


    +   - Using the `NSNumber` class

    - Working with an array

    - Understanding Cocoa''s Booleean type

    - Finding out what day it is


    One of the main tasks that computers do well is manipulate data. Whether you need
    to calculate the national debt or keep track of the telephone numbers of the players
    in your poker club, computer programs can ease the task of handling information.
    Cocoa improves upon the various ways that you work with data in C.


    This chapter takes you on a tour of some data types unique to Cocoa. The Foundation
    Framework defines these data types. You can continue to use the data types that
    you know from C, but after you see what Cocoa has to offer, you just might stop
    thinking about those old C types altogether.


    # Working with Numbers


    When you program in Objective-C, you can use all the usual standard C numerical
    data types for making calculations. If you want to use these values with Cocoa''s
    array objects, however, you''re left out in the cold. For this reason, Cocoa offers
    you the `NSNumber` class. One of its great uses is to wrap numbers in a Cocoa
    object, for use with other objects, such as `NSArray`. The `NSArray` class is
    an array class that comes with the Foundation Kit. You hear more about it later
    in this chapter.


    To create an `NSNumber` object based on an integer value of 42, use code like
    this:


    ```

    NSNumber  *n =  [NSNumber  numberWithInt:42];

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Here are methods for creating NSNumbers based on a variety of numerical types:


    +   numberWithDouble

    numberWithFloat

    numberWithInt

    numberWithLong

    numberWithUnsignedShort


    To retrieve values from an NSNumber, use one of the many NSNumber accessor methods.
    Some of these include


    +   doubleValue

    floatValue

    intValue

    longValue

    unsignedShort


    If you want to compare the values of two NSNumber instances, use the isEqualToNumber
    method. Because an NSNumber is an object, you can’t opt for the brevity in C of
    “if(num1==num2)”. This example shows how to compare two NSNumbers named num1 and
    num2:


    ```

    if ([num1 isEqualToNumber:num2])

    NSLog(@"Numbers are equal");

    else

    NSLog(@"Numbers are not equal");

    ```


    # # Working with Arrays


    One of the most common programming tasks that you’ll encounter is working with
    a list of data. To pull off this task, Cocoa programmers use NSArray and NSMutableArray,
    which are storage units for a list of data. You use arrays when you need to keep
    track of a list of information, such as the titles of books in your bookcase,
    the people in your family, or the number of windows that are open currently. What
    makes Cocoa arrays unique is the fact that, unlike traditional C arrays, they
    can store references to objects.'
  merge: -1
  img_proc: true
- pgno: 212
  md: "# ### NSArray\n\nThe NSArray class is handy for storing a group of objects\
    \ in one place.\n\nTo demonstrate, here's one way you might create and populate\
    \ an array with NSString objects:\n\n```\n```\nNSArray *theArray;\nNSString *name1;\n\
    NSString *name2;\nNSString *name3;\nNSString *name4;\n\n//assign values to the\
    \ four names\nname1 = @\"Maria\";\nname2 = @\"Mercedes\";\nname3 = @\"Leopold\"\
    ;\nname4 = @\"Frederick\";\n\n//create and populate the array\ntheArray = [NSArray\
    \ arrayWithObjects:name1, name2,\n                                     name3,\
    \ name4, nil];\n```\n```\n\nNote the arrayWithObjects method lets you create an\
    \ NSArray by listing the objects in that array. The last object must always be\
    \ nil to indicate the end of the array.\n\nIf you want to find out how many items\
    \ were in that array, use the count method:\n\n```\n```\nint i = [theArray count];\n\
    ```\n```\n\nYou can then use the size of the array to retrieve the objects within\
    \ that array, based on the index. This code snippet displays each item in the\
    \ array that you just created:\n\n```\n```\nNSLog(@\"object1 = %@\",[theArray\
    \ objectAtIndex:0]);\nNSLog(@\"object2 = %@\",[theArray objectAtIndex:1]);\nNSLog(@\"\
    object3 = %@\",[theArray objectAtIndex:2]);\nNSLog(@\"object4 = %@\",[theArray\
    \ objectAtIndex:3]);\n```\n```\n\n![](img/ea40cad434a338535474e82c1a6ace20_212_0.png)\n\
    \nDon’t forget that the index is always zero-based."
  merge: -1
  img_proc: true
