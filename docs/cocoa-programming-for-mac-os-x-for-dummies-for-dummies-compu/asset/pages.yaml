    # # Building an interface


    To get started working with text, you need a project and an interface. Perform
    the following steps to prepare a project for the examples in this chapter:


    +   1. Create a project in Xcode.


    +   2. Double-click the MainMenu.xib file in Xcode in the Resources folder.


    +   3. In Interface Builder, open the Window window from the XIB project window
    if it isn''t already open. Add an NSTextView to the window.


    You can find the NSTextView in the Library window by scrolling or searching for
    NSTextView or simply TextView, as shown in Figure 11-1.


