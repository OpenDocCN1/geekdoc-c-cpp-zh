  md: '![](img/ea40cad434a338535474e82c1a6ace20_121_0.png)


    # # Creating a Disk Image for Distribution


    After you built a finished application with Cocoa, you''ll no doubt want to distribute
    it to friends, co-workers, or maybe even the world via the Internet. The easiest
    way to provide your users with an application is to put it on a disk image. Disk
    Utility is a tool that accompanies the Mac OS, and if you aren''t familiar with
    it, it''s located here:


    ```

    /Applications/Utilities/Disk Utility

    ```


    To create a new disk image for your application, perform these steps:


    +   1. Launch Disk Utility.


    +   2. Choose File::New::Blank Disk Image.


    A window opens asking you to name the new disk image, as shown in Figure 5-17.


    +   3. Name the file and volume name and assign a volume size, volume format,
    and image format:


    +   * Save As: The name of your disk image.


    +   * Volume Name: The name that appears on the mounted volume when a user double-clicks
    the disk image.


    +   * Volume Format: You can create disk images in a Variety of formats, but generally
    speaking, you want to use Mac OS Extended format for distributing your application
    to others.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Chapter 5: Putting Polishing Touches On Your Application 103


    +   **Volume Size:** Make sure that the volume size is large enough to hold your
    application and any auxiliary files you wish to include. Don''t worry if the volume
    size is too large; you can compress it later. In fact, make sure that the volume
    size is larger than the size of the application and auxiliary files in case you
    want to add something else to the image later. You can find the combined size
    of your application and its auxiliary files by selecting the parent folder of
    the application in Finder and choosing Files>Get Info.


    +   **Encryption:** You can encrypt disk images, but for most purposes, you don''t
    need this feature and can safely set it to None. If you need disk security from
    other eyes, encrypting the disk image lets you password-protect the image. Only
    those who know the password can open the disk image.


    +   **Partitions:** The Partitions setting lets you split a disk into multiple
    sections. In general, this isn''t a setting you need to adjust if you want to
    make your software available on a disk image. Unless you''re creating a disk master
    for burning CDs, usually select Single Partition — Apple Partition Map in the
    Partitions popup.


    +   **Image Format:** Set as read/write. This permits you to read from and write
    to the disk image and is handy when you want to add more files to the disk image
    later.


    ![](img/ea40cad434a338535474e82c1a6ace20_122_0.png)


