- pgno: 103
  md: "# 84 Part I: Developer Tools\n\n1. Change Fusebox.h to read as follows:\n\n\
    ```\n* Fusebox */\n#import <Cocoa/Cocoa.h>\n@interface Fusebox : NSObject\nnIBOutlet\
    \ id answerField;\nIBOutlet id numberField1;\nIBOutlet id numberField2;\nIBOutlet\
    \ id operationPopup;\n}\n-(IBAction)calculateAnswer:(id) sender;\n-(IBAction)changeOperation:(id)\
    \ sender;\n@end\n```\n\n2. Choose File:Save to save the header file.\n\n3. Select\
    \ Fusebox.m to edit its code.\n\n4. Modify the calculateAnswer function by adding\
    \ an integer that keeps track of the currently selected item in the pop-up button:\n\
    \n```\nint operation;\n```\n\n5. Find out which the user has selected from the\
    \ pop-up button by sending it the selectedTag message.\n\nWhen you do, the pop-up\
    \ button returns the tag of its currently selected item, which you store in the\
    \ operation variable. The first menu item, in a pop-up button has a tag of 0 (zero),\
    \ so all items in the operationPopup control are covered by the indices 0 through\
    \ 3:\n\n```\noperation = [operationPopup selectedTag];\n```\n\n6. After you know\
    \ which item the user selected from operationPopup, do the math based on that\
    \ index:\n\n```\nswitch (operation) {\n  case 0::division\n    answer = num1 +\
    \ num2;\n    break;\n  case 1::subtraction\n    answer = num1 - num2;\n    break;\n\
    \  case 2::multiplication\n    answer = num1 * num2;\n    break;\n  case 3::division\n\
    \    answer = num1 / num2;\n    break;\n}\n```"
  merge: -1
  img_proc: true
