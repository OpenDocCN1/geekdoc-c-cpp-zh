  md: "Combined, the code in this section produces result like those shown in Figure\
    \ 12-9.\n\n![](img/ea40cad434a338535474e82c1a6ace20_258_0.png)\n\n# Drawing Text\n\
    \nBesides shapes and paths, Cocoa is quite adept at displaying text in graphics.\
    \ Before you start drawing text, you need to load that text into an **NSS****tring**\
    \ variable. For example, to add ***STOP*** to a stop sign, follow these steps:\n\
    \n+   1. Create the `NSString` variable:\n\n    ```\n    NSString *theString;\n\
    \    theString = @\"STOP\";\n    ```\n\n+   2. Determine the location in the view\
    \ where you want to display the text and store that position in an `NSPoint`:\n\
    \n    ```\n    NSPoint theTextPos;\n    theTextPos = NSMakePoint(275, rect.size.height-150);\n\
    \    ```\n\n+   3. Draw the string with the `drawAtPoint` method, passing it the\
    \ `NSPoint`:\n\n    ```\n    [theString drawAtPoint:theTextPos withAttributes:nil];\n\
    \    ```\n\nThis line of code draws the text at the position determined by the\
    \ `NSPoint`. When you run the example, you may be disappointed with the results,\
    \ as shown in Figure 12-10. The ***STOP*** string appears in a tiny font, and\
    \ the letters are black, the default text settings."
