- pgno: 309
  md: '# Sending e-mail from your own apps


    Giving your users a way to contact you by e-mail is a useful feature, but sometimes
    it may not fit your needs. This may be true for a variety of reasons, including
    the following:


    +   - You''re creating an e-mail application.

    - You can''t guarantee that your user has an e-mail client installed.

    - You don''t want to reply by using an additional e-mail client.


    Cocoa offers you the opportunity to send e-mail from your own applications. Before
    you start sending e-mails *en masse*, though, you need to perform a preparatory
    step. E-mail functions aren''t part of the frameworks that typically accompany
    the average Cocoa project. Instead, Apple stores the e-mail functions in the Message
    framework. To use e-mail in your project, you must first add the Message framework
    to your project:


    +   1. Choose **Project**:\>Add Frameworks to add the Message framework.

    2. In the dialog that appears, select **Message.framework**, which you can find
    in the **System** directory:


    ```

    /System/Library/Frameworks

    ```


    After you add the framework, it appears in the project window, as shown in Figure
    15-7.


    ![](img/ea40cad434a338535474e82c1a6ace20_309_0.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: "With the Message.framework in place, you can now send e-mail. You'll be amazed\
    \ at just how easy it is to send an e-mail with Cocoa:\n\n+   1. **Create a handful\
    \ of NSStrings that represent different parts of an e-mail message:**\n\n```\n\
    ```objectivec\nNSString *theEmailDest = @\"youFriend@email.com\";\nNSString *theSubject\
    \ = @\"Important Message\";\nNSString *theBody = @\"Hello there!\";\n```\n```\n\
    \n+   2. **Call the deliverMessage method of the NSMailDelivery class.**\n\nBecause\
    \ deliverMessage is a class method, you don't have to create an NSMailDelivery\
    \ object before using it. The deliverMessage method has parameters for the message,\
    \ the subject of the e-mail, and the recipient. Furthermore, it returns a Boolean\
    \ value, telling you whether the delivery occurred.\n\n```\n```objectivec\nif\
    \ ( [NSMailDelivery\ndeliverMessage:theBody subject:theSubject\nto:theEmailDest]\
    \ )\n    NSLog(@\"Email Sent\");\nelse\n    NSLog(@\"Email Not Sent\");\n```\n\
    ```\n\nThat's all there is to it!\n\n# ## Adding e-mail functions to the project\n\
    \nTo see all these great e-mail functions in action, return to the project that\
