  md: '2. Display an NSOpenPanel, restricting the user’s choices in that panel to
    the file types in your array.


    In this instance, you aren’t restricting the sound file types because you used
    soundUnfilteredFileTypes in Step 1, which populates the array with all possible
    sound file types. Limit the number of files a user can open in the NSOpenPanel
    to only one file:


