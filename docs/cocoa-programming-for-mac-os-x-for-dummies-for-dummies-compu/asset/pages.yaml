    Here''s what the code does:


    +   1. Add a line to create three integer variables for temporarily storing three
    numbers in memory:


    ```

    int num1, num2, answer;

    ```


    The code then assigns values to the num1 and num2 variables. The values it uses
    are ones that pulls from the corresponding interface elements numberField1 and
    numberField2. These two elements are text fields. To get the integer value from
    a text field, send the intValue message to a corresponding outlet, which returns
    the integer value of the text in that field.


    +   2. To send a message to an object, such as an interface element, enclose the
    object name and message name in square brackets:


    ```

    num1 = [numberField1 intValue];

    num2 = [numberField2 intValue];

    ```


    The code adds the two numbers and puts the result in the answer variable.


    The answer is displayed by sending answerField a setIntValue message. This particular
    message requires a parameter: integer value.


    +   3. Add the answer variable to display the answer:


    ```

    answer = num1 + num2;

    [textField setValue:answer];

    ```


    +   4. Save the Fusebox.m file with its new source code by choosing File:Save.


