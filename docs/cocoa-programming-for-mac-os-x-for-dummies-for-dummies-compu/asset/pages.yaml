  md: 'Be careful here. You see three kinds of Core Data templates listed. For now,
    you don''t have to worry about the Core Data Document-Based Application templates.
    This application uses only one window, so a document-based application won''t
    help you here.


    ![](img/ea40cad434a338535474e82c1a6ace20_362_0.png)


    +   3. **Name the project Core Data and click the Save button to finish creating
    the new project.**


    A Core Data project looks much like other Cocoa projects with Classes, Resources,
    and Frameworks folders as you''ve seen in other projects. However, Core Data projects
    also have one additional folder: Models. The Models folder contains a single data
    model by default. You''ll use this model to design data storage for your application.
    You can add other models later if you need them, but for now, you need only this
    one. Figure 19-2 shows the Data Model file in a new project. Its name varies depending
    on the name you chose for the project.'
  merge: -1
