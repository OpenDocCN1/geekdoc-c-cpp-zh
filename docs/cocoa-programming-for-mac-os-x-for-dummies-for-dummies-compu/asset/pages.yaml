    # # Assigning an Icon to Your Project


    One of the first things users notice about your application is its icon. When
    you first build an application with Xcode, it assigns a Generic Application icon,
    as shown in Figure 5-11.


    ![](img/ea40cad434a338535474e82c1a6ace20_116_1.png)


