    # # Watching Movies with Cocoa


    Unless you''ve been living under a rock, you know that Mac OS X is a whiz at playing
    other kinds of multimedia content as well. *QuickTime* is a cross-platform multimedia
    engine that enables users to view, edit, and create all sorts of multimedia content.
    Chief among the various multimedia formats is the QuickTime movie. By using the
    QTKit framework in Cocoa, it''s easy to add movie playback functions to your applications.


    To work with QuickTime content in your projects, Cocoa provides you with five
    important classes:


    +   - **`QTMovie`**: A movie that you want to view, edit, or create.

    - **`QTTrack`**: Movies are composed of one or more tracks. `QTTrack` helps you
    to work with the individual tracks in a movie.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   - **QTMedia**: Each track in a movie is composed of media. **QTMedia**
    lets you get and set information media in a track.

    - **QTDataReference**: QuickTime is multifaceted and permits you to load movies
    from files, the Internet, or even straight from memory. **QTDataReference** is
    the QuickTime class that you use when you need this level of access.

    - **QTMovieView**: A movie player you use to play a **QTMovie**.


    Because the QTKit framework is so vast, and in certain cases, somewhat advanced,
    I show you two classes: **QTMovie** and **QTMovieView**. With these two classes,
    you can load a movie and display it in a fully functional player.


    # QTMovie


    **QTMovie** is a class that represents a QuickTime movie. **QTMovie** can load
    movies into from files, Uniform Resource Locators (URLs), data references, or
    even the Pasteboard (Clipboard). For this section, I show you how to use the movieWithFile
    class method of the **QTMovie** class to load a movie from a file.


    Earlier in this chapter, you loaded a sound file with an NSOpenPanel. Then you
    used the result from that NSOpenPanel to open the file using a traditional file
    path. You can follow a similar methodology for movies, but you have to expand
    the functionality a bit by filtering which files a user can select in the NSOpenPanel.
    To do this, you must pass an array to the runModalForType method of NSOpenPanel:


    +   1. Create an array that defines which file types a user can open.


    The last item in the array is always nil. For example, to define an array for
    .mov and .mp4 files, your code might look like this:


    ```objc

    NSArray *fileTypes = [NSArray arrayWithObjects:@"mov",

    @"mp4", nil];

    ```


    +   2. Pass the array to runModalForType:


    ```objc

    if ([openPanel runModalForTypes:fileTypes] ==

    NSOKButton) {

    // code to load a movie goes here

    }

    ```


    +   3. Pass the file path to the movieWithFile class method to create a **QTMovie**.


    ```objc

    QTMovie *movie = [QTMovie movieWithFile:theFilePath

    error:nil];

    ```'
  merge: -1
  img_proc: true
