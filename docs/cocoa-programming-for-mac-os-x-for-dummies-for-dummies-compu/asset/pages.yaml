- pgno: 380
  md: '# Chapter 20


    # Ten Tips to Make Cocoa

    Programming Easier


    +   #### In This Chapter

    *   Use keyboard shortcuts

    *   Read the documentation

    *   Use Class Browser

    *   Adjust the window count

    *   Use drag and drop

    *   Use init and awakeFromNib

    *   Don''t forget the methods of the superclass

    *   Position items with Cocoa coordinates

    *   Use guidelines in Interface Builder

    *   Reuse code


    As you familiarize yourself with Objective-C and the Cocoa frameworks, you''re
    bound to run across various tips and tricks that you''ll want to remember. This
    chapter attempts to reduce the amount of time you have to wait until you discover
    some of those tips and tricks.


    # Use Keyboard Shortcuts


    One of the easiest ways to speed up your Cocoa programming is to take advantage
    of the multitude of keyboard shortcuts available to you in Xcode and Interface
    Builder. Table 20-1 lists some of the common keyboard shortcuts that Xcode and
    Interface Builder share.'
  merge: -1
  img_proc: true
- pgno: 381
  md: '| Table 20-1 | Keyboard Shortcuts Shared by Xcode and Interface Builder |

    | --- | --- |

    | **Shortcut** | **What It Does** |

    | ⌘+S | Saves a file |

    | ⌘+O | Opens a file |

    | ⌘+M | Minimizes a window to the Dock |

    | ⌘+? | Displays help for Xcode or Interface Builder |

    | ⌘+N | Creates a new file in Xcode or a new NIB file in Interface Builder |

    | ⌘+Q | Quits the application |

    | ⌘+R | Runs a project or an interface |


    Besides the run-of-the-mill keyboard shortcuts, you can help your Cocoa programming
    along by using the keyboard shortcuts of the pros. Table 20-2 lists some keyboard
    shortcuts that give a decided advantage.


    | Table 20-2 | Keyboard Shortcuts Used by the Pros |

    | --- | --- |

    | **Shortcut** | **What It Does** |

    | *Option-double-click keyword* | In Xcode, looks up the keyword’s definition
    in the Xcode documentation |

    | ⌘+Z | Goes back in time whenever you make a mistake. Xcode and Interface Builder
    offer multiple Undos |

    | ⌘+Shift+F | Finds all instances of your search term in the Cocoa documentation
    |

    | Control-click | Control-click (or right-click if you have a multi-button mouse)
    anywhere in Xcode or Interface Builder to reveal a large menu of context-sensitive
    functions |


    # ## Read the Documentation


    It seems too much of a cliché to say it, but your best bet for accelerating your
    Cocoa programming is to read the manual. Some documentation explains how the Developer
    Tools work; other documentation details the various classes'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'and methods of Cocoa. You can view the built-in documentation by choosing Help•Documentation.
    You can also read the documentation by visiting the Apple Developer Connection
    Web site:


    ```

    developer.apple.com/techpubs/macosx/macosx.html

    ```


    # ## Use Class Browser


    In addition to using the standard documentation that’s part of Xcode, you can
    browse the various classes in Cocoa with Class Browser, although the Class Browser
    isn’t Cocoa-specific. Choose Project•Class Browser in Xcode to display the Class
    Browser window. The Class Browser displays all the classes in Cocoa in a structured
    fashion. You have one-click access to the definitions of Cocoa classes in the
    interface files.


    # ## Adjust the Window Count


    Setting up your work environment to best suit your needs is another quick way
    to improve your Cocoa programming experience. Xcode can operate with a different
    number of windows, and it’s up to you to set the number of windows with which
    you feel most comfortable.


    Throughout this book, I use the default setting in the General Layout section
    of the Preferences window. Some people don’t appreciate having all the various
    components of Xcode in one window and like to stretch out a bit. For them, Xcode
    offers a few other settings that force various Xcode functions to appear in different
    windows.


    Choose Xcode•Preferences and click the General button on the toolbar to adjust
    the window count setting.


    # ## Use Drag and Drop


    Drag and drop has long been an attractive feature of the Macintosh operating system.
    Xcode and Interface Builder continue in this tradition, offering many different
    drag-and-drop features.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'You can add files to Xcode from Finder by dragging them into your project window.
    These files include source code files, frameworks, image files, HTML (HyperText
    Markup Language) documents, rich text documents, and `.icns` icon files.


    When you create classes in Xcode, you can let your XIB file know about them by
    dragging the header files for those classes from Xcode to the Interface Builder
    NIB file window.


    In Interface Builder, drag and drop is, perhaps, the most important interface
    operation. You use drag and drop to create the entire interface.


    # ## Initialize and Awaken!


    When your application loads its NIB file, Cocoa creates the objects in that file
    and calls the `init` methods. Next, your application sets the outlets for your
    interface and calls the `awakeFromNib` method. Because the application sets the
    outlets after the `init` method, you can’t use any methods that rely on outlets
    in the `init` method. Because `awakeFromNib` loads after the outlets are set,
    you can use code that relies on outlets.


    As a basic rule, try to add initialization code to the `init` method of your object.
    If it doesn’t work properly or yields a compiler error, move that initialization
    code to the `awakeFromNib` method for that object. After you get the hang of Cocoa
    programming, you know which method to use and when.


    # ## Remember the Superclass


    One of the great features of object-oriented programming is the fact that it has
    a hierarchical structure. This has a wonderful benefit — *inheritance*. Because
    every class in Cocoa (with the exception of `NSObject`) is a subclass of some
    other class (or classes) above it in the class hierarchy, every class has more
    methods than those listed for its particular type. This can be confusing at first
    for some beginners.


    Consider this example. The `NSTextField` and `NSTextView` controls in Cocoa seem
    like they should work in a similar fashion because they both display text. By
    taking a quick look at the documentation, however, you find'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'that they''re very different controls. The NSTextView control doesn''t have
    a method for setting its text. The documentation for NSTextView shows that it''s
    a subclass of NSText. NSText, on the other hand, does have a method for setting
    the text of the view: `setString`. You may be tempted to use the `setString` method
    with an NSTextField control. It''s a good guess but an incorrect one.


    Like the NSTextView, the NSTextField control has no direct method for setting
    its text. Because it''s a subclass of the NSControl class, you can use the `setStringValue`
    method from that class. The lesson here is this: if you expect a control to have
    some kind of method and it doesn''t, check one of the superclasses of that class
    to see whether one of them has the function you need.


    # Position Items with Cocoa Coordinates


    Programmers who are migrating to Cocoa from other frameworks may be surprised
    to discover that Cocoa bases all its coordinate measurements on a different coordinate
    system. Whereas many frameworks define the upper-left corner of a view as the
    origin, Cocoa drawing designates the bottom-left corner as the origin. You may
    remember this arrangement as Quadrant I from your high school trigonometry class.


    If you''re familiar with PDF (Portable Document Format) and PostScript, you can
    skip this tip. You''re already living in an upside-down world. PDF and PostScript
    use the same coordinate system that Mac OS X uses — and this is no accident. NeXT
    based its image model on Display Postscript. Mac OS X also uses this model.


    # Use Guidelines in Interface Builder


    When it comes to building interfaces, Apple insists that you follow many human
    interface rules to ensure the best experience. There are so many human interface
    rules that it can be difficult to keep them all straight sometimes. To help you
    with this, Interface Builder offers a great feature in the form of guidelines.
    When you drag controls around your interface, Interface Builder displays lines
    in the interface to help you align controls and place them according to the Human
    Interface Guidelines.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'Pay attention to these interface suggestions! They make it a snap to follow
    the stringent interface guidelines in Mac OS X and help you create software that
    follows the Apple standards. Doing so results in software that’s easier to use
    by more people. If you follow your own rules, you’re bound to hear complaints.
    Macintosh users expect a certain user experience. If you stray from it, your users
    won’t be happy.


    Consider reading the Apple Style Guide, located on the Apple developer Web site.
    This guide describes the interface rules and helps you know what terms to use
    in your application’s Help and other documents.


    # Reuse Your Code


    The guiding principle of object-oriented programming is code-reuse, and Cocoa
    is no different. In fact, many programmers claim that Cocoa code is some of the
    most reusable code around because Cocoa programmers separate form from function
    through the Model-View-Controller paradigm.


    To reuse a NIB file, simply drag it into your project in Xcode. To reuse a class,
    drag its implementation (.m) and header (.h) files into your project in Xcode.
    It’s as simple as that!'
  merge: -1
  img_proc: true
