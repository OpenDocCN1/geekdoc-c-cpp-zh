    \ The error parameter can be set to `NULL`, as I won’t trap errors in this demo.\n\
    \nThe second method in the code listing saves the file to a rich text file. Much\
    \ of the code in it is identical to the plain text version, with one big exception.\
    \ Instead of retrieving text from text view with the `string` method of the `NSString`\
    \ class, you use the `RTFFFromRange` method for rich text. This has the effect\
    \ of retrieving the text with its style information (bold, size, color, and so\
    \ on) intact:\n\n```\n[[textView RTFFFromRange:\n        NSMakeRange(0, [[textView\
    \ string] length])]\n   writeToFile: [theSavePanel filename]\n   atomically: YES];\n\
    ```\n\nThe only parameter of the `RTFFFromRange` method is an `NSRange` value\
    \ indicating the portion of text that you want to retrieve from text view. To\
    \ retrieve all the text, you supply the method with the starting point of the\
    \ text and the length of text to grab. In this instance, you grab all the text\
    \ found in the text view, starting from position 0 (zero) and extending the length\
    \ of the text in the text view:\n\n```\nNSMakeRange(0, [[textView string] length])\n\
    ```\n\nAfter you have `NSSString` from `TextView`, `writeToFile` works the same\
