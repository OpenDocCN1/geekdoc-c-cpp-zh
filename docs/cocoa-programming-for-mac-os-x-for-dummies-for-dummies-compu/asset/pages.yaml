  md: "The code for both actions works similarly, with a few exceptions:\n\n+   *\
    \ Both actions display a SavePanel so that users can select the name and destination\
    \ of the file they want to save.\n* The two methods differ on the file type and\
    \ title that they display in the SavePanel and the fact that plain text files\
    \ need an encoding.\n\nTo display the panel, each method uses this line of code:\n\
    \n```\nif ([theSavePanel runModal] == NSOKButton)\n```\n\nThe runModal method\
    \ of the SavePanel takes care of displaying the modal window. A modal window is\
    \ one in which users are forced into a mode of operation — they must make a decision\
    \ (saving a file or halting the operation) before proceeding any further.\n\n\
    When a user clicks a file and clicks the Save button in the SavePanel, the runModal\
    \ function of the SavePanel returns a value. Instead of worrying about what numerical\
    \ value it returns, Cocoa provides you with the constant NSOKButton indicating\
    \ that the user clicked the Save button. The following code example checks for\
    \ the Save button. Conversely, you could check for the Cancel button by using\
    \ the appropriate constant for that button:\n\n```\nif ([theSavePanel runModal]\
    \ == NSCancelButton)\n```\n\nIf the users click Save in the SavePanel, the code\
    \ writes the text from the TextView to a plain or rich text file.\n\nFor plain\
    \ text files, this means using the writeToFile method of the NSString class:\n\
    \n```\n[[textView string] writeToFile: [savePanel filename]\n atomically: YES\
    \ encoding: NSUTF8StringEncoding\n error: NULL];\n```\n\nYou retrieve the text\
    \ from the text view as an NSString using the [textView string] method. The text\
    \ file is saved with the writeToFile method, passing it four parameters:\n\n+\
    \   * The name of the file that the user entered in the SavePanel.\n* A Boolean\
    \ value titled atomically: If you pass YES as the atomically parameter, the writeToFile\
    \ method first writes the data to a temporary file and renames that file after\
    \ the write operation is finished. If it has a value of NO, writeToFile writes\
    \ the data directly to the file returned by the filename method. Set the atomically\
    \ parameter to YES."
