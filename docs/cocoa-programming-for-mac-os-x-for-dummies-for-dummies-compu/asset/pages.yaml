    \ a Web page\n\nAre some of these functions sounding familiar? They should because\
    \ not only are they the staple of most Web browsers, but they’re used in Apple’s\
    \ own Safari Web browser. Safari uses the same exact rendering features that are\
    \ available to you with WebKit. And because these functions are so common, WebKit\
    \ has them ready to go without nary a line of code.\n\nTo see how the WebKit Framework\
    \ works, create a new Cocoa application project in Xcode (see Chapter 2). Then,\
    \ add the WebKit Framework to the project by following these steps:\n\n+   1.\
    \ Control-click the Frameworks Group in the project window, as shown in Figure\
