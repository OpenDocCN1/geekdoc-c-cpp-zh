    # # Opening and Using Files


    The project for this chapter, File Demo, displays important information about
    any file or folder that a user selects. You''ll be familiar with the information
    because it all appears in the Get Info window of Finder.


    # ## Building the interface


    The interface consists of a button and several NSTextField controls. Users click
    the button to select a file or folder, after which the application displays information
    about that file or folder in the various NSTextField controls. To create the interface
    for this project, perform these steps:


    +   1. Create a new Cocoa project in Xcode, name it File Info, and then after
    it opens, expand its Resources folder and double-click the MainMenu.xib file to
    open it in Interface Builder.

    2. In Interface Builder, open the default window in the XIB project window and
    add six NSTextField Label controls from the Library window and one Wrapping Label
    control.


    ![](img/ea40cad434a338535474e82c1a6ace20_268_0.png)


    You can locate the controls by searching for Label from the Library window''s
    search field.

    The wrapping label type is similar to the other labels, except that it''s preset
    to be a multiple line label. The multiple lines help display long file paths.

    Starting with the wrapping label, these seven labels display the following information
    about a selected file or folder:


    +   - File path

    - Filename

    - File exists: Displays yes if it exists; NO, if it doesn''t

    - File directory: Displays yes if the selection is a folder; no, if it isn''t

    - File creation date

    - File modification date

    - File size in bytes'
