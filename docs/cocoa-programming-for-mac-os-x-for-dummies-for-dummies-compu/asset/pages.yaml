    \ to the default button in the alert, the code deletes the file with the removeFileAtPath\
    \ method.\n\n# Creating folders\n\nTo create a folder on your drive, use the createDirectoryAtPath\
    \ method of the NSFileManager. You need to pass it two parameters:\n\n+   * The\
    \ first parameter is the path where you want to create the folder.\n* The second\
    \ parameter lets you set various attributes of the folder. You won't use this\
    \ second parameter very often, so you can simply set it to nil.\n\nTo show the\
    \ createDirectoryAtPath method in action, follow these steps:\n\n+   1. **Add\
    \ the following code to FileInfoController.m to create a MyNewFolder folder on\
    \ the desktop:**\n\n```\n- (IBAction) createAFolder: (id) sender\n{\nNSString\
    \ *theDestination = [ [NSHomeDirectory()\n stringByAppendingPathComponent:@\"\
    Desktop\"]\n stringByAppendingPathComponent:@\"MyNewFolder\"\n ];\n[theManager\
    \ createDirectoryAtPath:theDestination\nattributes:nil];\n}\n```"
