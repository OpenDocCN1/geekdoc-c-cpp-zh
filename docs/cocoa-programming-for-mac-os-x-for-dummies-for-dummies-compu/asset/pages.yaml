- pgno: 38
  md: '# Chapter 2: Creating Your First Cocoa Application


    Now you have a basic understanding of the steps that you must perform to create
    a Cocoa application, it''s time to create your own project! The remainder of this
    chapter guides you through the process of building, coding, and creating your
    first Cocoa application.


    # Beginning a Project


    To begin creating your first piece of Cocoa software, come up with an idea of
    what you want to create. After you establish the type of software that you want
    to build, you''ll create a new project with Xcode to begin programming it.


    # Thinking of an idea


    Instead of putting through the sometimes-arduous dream of your own idea, here''s
    one to get started. Everyone needs a calculator. Whether you want to add your
    earnings from selling great Cocoa software or figure out how you can retire from
    said earnings, a calculator is a handy tool for the task. Sure, Mac OS X has a
    few different, but no one ever said you weren''t allowed to build a better one.


    One troublesome aspect of traditional calculator applications rears its head when
    you press an operator key (+, *,) and enter another number. You can''t see the
    first number you entered. Your application solves this problem by displaying the
    two numbers you''re working with.


    Unlike a traditional calculator interface, your calculator will look more like
    a form. You enter numbers in the various fields of the interface and press a button
    to calculate the result. Figure 2-1 shows what the completed application looks
    like.


    Figure 2-1: When thinking of an idea for an application, try to imagine what it
    will look like.


    ![](img/ea40cad434a338535474e82c1a6ace20_38_0.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Part I: Developer Tools


    As you can see, you now have an idea (build a better calculator), you''ve thought
    about how to do it (with a form-like interface), and you''ve constructed a mental
    image of what it will look like. In this example, the mental image is an image
    of the finished product (refer to Figure 2-1). But because you can''t read my
    mind, I provided an image of the finished product.


    # Getting started with your Cocoa project


    Now that you have an idea in mind, you can begin the Cocoa development process:


    +   1. Launch Xcode by double-clicking its icon.

    The icon is on your hard drive at the following location:

    /Developer/Applications/Xcode

    When you launch Xcode, a happy window may be welcoming you to Xcode, as in Figure
    2-2. This window also offers convenient one-click access to documentation and
    tutorials for you. If it opens, close the Welcome to Xcode window to reduce clutter.
    It opens again the next time you launch Xcode, unless you deselect the Show at
    Launch check box.

    2. Choose File::New Project.

    The New Project window appears, asking what kind of project you want to create,
    as shown in Figure 2-3.


    ![](img/ea40cad434a338535474e82c1a6ace20_39_0.png)'
  merge: -1
