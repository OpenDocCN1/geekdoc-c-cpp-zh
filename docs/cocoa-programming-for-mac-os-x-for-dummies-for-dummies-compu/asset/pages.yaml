- pgno: 20
  md: '# Introduction


    Welcome to Cocoa Programming for Mac OS X For Dummies. This book shows you how
    to create applications for Mac OS X, complete with beautiful Aqua interfaces and
    advanced functionality. The best part is that Cocoa provides you with programming
    skills that you could only dream of a few short years ago.


    # About This Book


    Cocoa Programming for Mac OS X For Dummies is a newcomer''s guide to Cocoa programming
    for Mac OS X. This book guides you through the basics of Cocoa application development,
    so you can finally realize the full potential of your Macintosh. Although Cocoa
    isn''t the easiest thing on earth to figure out, it''s easy enough that beginners
    can create applications. Furthermore, even beginner projects can have features
    that rival professional applications. You''ll be surprised how easy it is to add
    complex features—features that would have taken an army of engineers to build
    in the past.


    This book won''t make you a certified Cocoa expert, but it will give you a good
    start on your way to becoming proficient with Cocoa. From the beginning of the
    book to the very end, you''ll explore Cocoa programming by using it. Each chapter
    guides you through the process of creating at least one simple application that
    illustrates the features presented in that chapter.


    Cocoa Programming for Mac OS X For Dummies covers the fundamentals of Cocoa programming
    as well as advanced features. The weird thing about Cocoa is that you sometimes
    can''t tell which is which. In Cocoa, the simple is complex, and the complex simple.
    You''ll gasp in awe as you add sophisticated graphics, multimedia, and professional
    typography to your application in minutes. Then you''ll turn around and bang your
    head against the wall trying to remember how to create a simple list of items
    in Cocoa. The great part about Cocoa is that after you get the hang of the basics,
    you can build applications with high-quality features that wouldve been near impossible
    for a beginner to achieve in the past.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Cocoa Programming for Mac OS X For Dummies


    # Conventions Used in This Book


    This book guides you through the process of building Cocoa applications. Throughout,
    you create interfaces and make them functional with the use of Objective-C code.
    The code examples in this book appear in a monospaced font. For instance:


    ```

    #import <Cocoa/Cocoa.h>

    ```


    Objective-C is intimately connected to the C language, which is a case-sensitive
    language. Therefore, it is a good idea to ensure that the code appears in this
    book *exactly* as it appears in the text. Some capitalization may not be mandatory,
    but until you are familiar with the rules, it''s best not to stray from the text.
    If you''re ever uncertain about case sensitivity, the source code on the *For
    Dummies* web site, at *www.dummies.com/cocoaf*. All URLs in this book appear in
    a monospaced font as well:


    ```

    www.apple.com

    ```


    # Foolish Assumptions


    By programming Cocoa applications, you need a Macintosh computer, a copy of Mac
    OS X (preferably 10-4 or higher), and the Developer Tools, which Apple offers
    for free as a download. If you''re not sure how to install the Developer Tools,
    the appendix can lead you through the steps necessary to prepare your Mac for
    Cocoa development.


    In addition to the computer and software, you''ll also need some computing skills.
    For starters, you''d be familiar with using the Macintosh operating system. You
    should know how to launch applications, save files, with use the Internet.


    You should have at least a passing knowledge of some computer language. Ideally,
    you''d have working skills in the C programming language. Even a passing experience
    with an object-oriented language, such as C++ or Java, would be beneficial, but
    it''s not an absolute must. This isn''t to say that you''ll be completely lost
    without these skills. Different computer languages share so many features in common.
    Whether you have a Pascal, a JavaScript, or an AppleScript background, you''ll
    find Objective-C, although strange at first, is easy to learn, and many aspects
    will feel familiar.


    The examples in this book focus on the Cocoa aspects of programming. Although
    some accessory C code is necessary to make this happen, the examples are not obfuscated
    code that an average programmer can''t grasp. If you''re still not sure that you''re
    ready for Cocoa, jump on in'
