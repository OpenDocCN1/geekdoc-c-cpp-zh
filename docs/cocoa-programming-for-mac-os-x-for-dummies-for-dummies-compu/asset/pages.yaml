- pgno: 128
  md: '# Chapter 6


    # The Basics of Objective-C


    In This Chapter


    +   - Using object-oriented programming

    - Knowing the differences among classes, variables, and methods

    - Understanding and coding in Objective-C

    - Using your own classes


    Objective-C is the language that most developers use to program Cocoa applications.
    Although it''s not the only language that you can use for Cocoa development, it''s
    far from the most popular. Objective-C is a superset of the popular C programming
    language that bears an uncanny resemblance to SmallTalk (which is no accident).
    If you''re an experienced C programmer already, you''ll find that Objective-C
    makes you feel like you''re in familiar surroundings, with a few ladies thrown
    in. If you''re not well versed in C but know another programming language, you
    can probably figure out what''s going on anyway.


    This chapter examines the basics of object-oriented programming and the Objective-C
    language. After you get the hang of how Objective-C works, the chapter helps solidify
    your skills by building a project and using Objective-C. In the process, you find
    out how to create objects in code. The next chapter runs through another important
    topic in Objective-C: class methods. The chapter concludes with a look at the
    way you should name things in Objective-C. Naming schemes plays an important role
    in Objective-C. As you can see, this chapter is a collection of several small
    facts. These bits of knowledge form a larger body of information that you will
    use every time you program with Cocoa using the Objective-C language.


    # Why Use Object-Oriented Programming?


    Objective-C, as you may have already guessed, extends C by adding object-oriented
    features to it. Object-oriented programming is a paradigm whereby you group related
    data and functionality into a construct called an object.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 110 Part II: Instant Cocoa and the Objective-C Language


    Because an object bundles together data and functionality into one “package,”
    your programming efforts gain several benefits:


    +   - It''s easier to design and write software that''s object-oriented. Objects
    in object-oriented computer programming (OOP) not to be confused with (OOPS!)
    are analogous to objects in the real world. Consider an everyday object like a
    kitchen window, which has properties height, width, glass color, thickness, and
    so on. Likewise, an OOP object like a computer window has properties like height,
    width, color, and transparency.

    - You can do several things to an object like a kitchen window. You can open it,
    close it, wash it, and even break it. Again, the analogy follows with an OOP window.
    You can open it, close it, and can change its size. But, I hope you don''t try
    to break it.

    - You classify various elements of your application as objects in a sort of modular
    relationship to one another, making the process of programming applications much
    quicker. The structure that OOP helps you to build very sophisticated software,
    but will still be to keep track of things.

    - Because OOP makes your software modular, your software is easier to maintain,
    to repair if it''s broken, or to modify later when you want to upgrade it.


    # Class 1 Is No Object!


    Objects in OOP, like objects in the real world, have properties and functions.
    Objective-C calls these instance variables and methods. The methods determine
    what functionality an object has, and they operate on the instance variables,
    or the properties of the object.


    For instance, every GUI (Graphical User Interface) application uses windows. A
    window object might have instance variables that describe its height, width, and
    color. Its methods would do something with those instance variables. One method
    might change the width of a window. Another method might change its height. Another
    method might change the color.


    Methods of an object are like gatekeepers for the instance variables. In Objective-C,
    other objects and their methods can''t access instance variables directly. Instead,
    they must access instance variables via methods.'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# # Declaring instance variables\n\nInstance of a class, as the name implies,\
    \ are variables that belong to an instance of a class. Instance is another name\
    \ for object. Objective-C variables, like variables in many other programming\
    \ languages, are references to data about a particular state of the object. For\
    \ example, to declare an instance variable that references a button control, aButton,\
    \ your interface would look like this:\n\n```\n@interface MyClass : NSObject\n\
    \    UIButton *aButton;\n\n@end```\n```\n\nHere's how code works:\n\n+   - The\
    \ @interface begins the class declaration and @end denotes the end of the class\
    \ declaration.\n- MyClass is the name of the class, and NSObject is the superclass\
    \ from which MyClass inherits. NSObject is a generic class type, and it is ultimately\
    \ the superclass of all classes.\n- Within the class declaration are two brackets.\
    \ You must declare instance variables within those brackets of the interface file.\n\
    \nThe interface file is the file in your project with an .h extension, and in\
    \ C you'd call it a header file. Interface files usually begin with an import\
    \ statement to load appropriate frameworks. C programmers would load libraries\
    \ (and in fact, libraries are allowed in Objective-C):\n\n```\n@import <Cocoa/Cocoa.h>\n\
    ```\n\nPointers to objects aren't the only type that can be declared as instance\
    \ variables. All the C variable types are fair game too in a class interface:\n\
    \n```\n@interface MyClass : NSObject\n    UIButton *aButton;\n    int age;\n \
    \   float percent;\n\n@end```\n```"
  merge: -1
  img_proc: true
- pgno: 131
  md: "# 112 Part II: Instant Cocoa and the Objective-C Language\n\nObjective-C also\
    \ has new and improved versions of data types that you might recognize from C.\
    \ For example, bool in C is BOOL in Objective-C, and it too can be used to declare\
    \ an instance variable:\n\n```\n@interface MyClass : NSObject {\n    UIButton\
    \ *abButton;\n    int age;\n    float percent;\n    BOOL collapsed;\n}\n@end\n\
    ```\n\n# Declaring methods\n\nBesides instance variables, you find method declarations\
    \ in the interface. Unlike the instance variables, however, method declarations\
    \ appear after the curly braces (but the @end). Here's a declaration for a doSomething\
    \ method:\n\n```\n@interface MyClass : NSObject {\n    UIButton *abButton;\n \
    \   int age;\n    float percent;\n    BOOL collapsed;\n}\n-(void)doSomething;\n\
    @end\n```\n\nIf you're coming to Objective-C from C, you notice something different\
    \ right away. All method declarations in Objective-C begin with a dash (-). Thereafter,\
    \ you assign a return type (in this case void) with parentheses. A return type\
    \ works just like those in C. A method can return a value, or in which you can\
    \ assign void, just like in C. Following the return type name. It is customary\
    \ to name methods beginning with a lower-case letter. Notice too, the doSomething\
    \ method has no parameters. In this following example, doSomethingElse is declared\
    \ with a single parameter, an NSString:\n\n```\n@interface MyClass : NSObject\
    \ {\n    UIButton *abButton;\n    int age;\n    float percent;\n    BOOL collapsed;\n\
    }\n```"
  merge: -1
  img_proc: true
