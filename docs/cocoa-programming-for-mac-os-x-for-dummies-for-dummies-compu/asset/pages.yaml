- pgno: 286
  md: '# Chapter 14

    Printing with Cocoa


    # In This Chapter


    +   ► Understanding the process of printing in Cocoa

    ► Adjusting the page settings

    ► Running a print job

    ► Printing to PDF files


    ![](img/ea40cad434a338535474e82c1a6ace20_286_0.png)


    Although Cocoa’s on-screen display of graphics and text is world class, that doesn’t
    mean Apple forgot about printing. Known for decades as one of the innovative adopting
    forces behind technologies, such as PostScript and laser printing, Apple continues
    in this tradition by adding easy-to-implement printing features to Cocoa. This
    chapter shows you how to add printing features to your Cocoa applications. Although
    printing has been a messy topic for programmers in the past, Cocoa makes it simple
    to implement some sophisticated printing features to your projects. You’ll love
    the consistency that Apple provides you as a developer, and your users will love
    the professional printing results that your application implements.


    To begin working with printing, copy the Start source code for this chapter to
    your hard drive. (To download the code, go to www.dummies.com/go/ cocoa.fd.) The
    printing project for this chapter is based on the completed project from the end
    of Chapter 12. Because you can print using any view, you can use the graphics
    view from Chapter 12 as your printable canvas.


    # How Printing Works in Cocoa


    To help you achieve great results that address all your printing needs, Cocoa
    offers a collection of important classes for printing in Mac OS X. You use these
    classes together to add printing to your applications:


    • NSView: Printing to a page is as simple as drawing text and graphics in an NSView.
    The examples in this chapter build on the graphics example in Chapter 12.'
  merge: -1
  img_proc: true
- pgno: 287
  md: "NSPageLayout: This class is responsible for displaying the Page Setup panel.\
    \ Typically applications display this panel when a user chooses File→ Page Setup.\
    \ Your users will invoke the Page Setup panel to choose the orientation of the\
    \ printed page. They can also set the paper size in the Page Setup panel. When\
    \ the user has finished adjusting the printing properties of the NSPageLayout\
    \ object, the NSPageLayoutObject saves the results in an NSPrintInfo object.\n\
    \nNSPrintInfo: NSPrintInfo is a storage class that holds the settings and options\
    \ for printing. NSPrintInfo stores the settings from the Page Setup panel as well\
    \ as the page count, margins, and other items that appear in the NSPrintPanel.\n\
    \nNSPrintPanel: When you choose File→Print from most applications, you see an\
    \ example of the NSPrintPanel. The NSPrintPanel is responsible for managing the\
    \ settings of a print job. NSPrintPanel stores its settings in an NSPrintInfo\
    \ object.\n\nNSPrintOperation: This class takes care of creating the printed page.\
    \ It displays the Print panel and carries out the print job.\n\nTo help you envision\
    \ how the printing process works in Cocoa, here’s a brief rundown of the steps\
    \ involved:\n\n+   1. Draw text and graphics to a view.\n    This drawing can\
    \ occur in any view, whether it’s a view in a graphics application, a word processor,\
    \ or even the background of a window. Cocoa can print from them all.\n2. The user\
    \ chooses File→ Page Setup.\n    Your application displays the Page panel.\n3.\
    \ The user selects the format and scale of the print job.\n    Figure 14-1 shows\
    \ what the Page panel looks like.\n4. The user dismisses the panel.\n    Your\
    \ application stores the settings in a PrintInfo object.\n5. The user chooses\
    \ File→Print.\n    Your application displays the Print panel, where the user tweaks\
    \ the settings for the print job. Figure 14-2 shows a typical Print panel. When\
    \ the user finishes preparing the print job, he may dismiss the panel by clicking\
    \ Cancel or start the print job by clicking OK.\n6. The user prints the view."
  merge: -1
  img_proc: true
