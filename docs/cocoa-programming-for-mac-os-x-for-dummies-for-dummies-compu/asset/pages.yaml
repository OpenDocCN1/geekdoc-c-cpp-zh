    # ## *Loading and playing sound files*


    For some applications, playing sounds that reside in your project or in one of
    the library Sounds folder isn''t sufficient. Suppose that you want your application
    to play any sound that a user selects. To accomplish this task, follow these steps:


    +   1. Create an array and fill it with all the sound file types that Cocoa recognizes
    by using the soundUnfilteredFileTypes class method:


    ```

    ```

    NSArray *audioFileTypes = [NSSound soundUnfilteredFileTypes];

    ```

    ```


    If you''re curious about which types of sounds Cocoa recognizes (and can play),
    you can display them in the console by looping through the elements in the *audioFileTypes*
    array and displaying each one in the console via NSLog. The following code snippet
    lists the file extensions of files that NSSound supports. Note that the list is
    case-sensitive, so you may see multiple instances of the same file type (for instance,
    mp3, MP3, Mp3):


    ```

    ```

    int i;

    for (i=0;i<[theFileType object count];i++)

    NSLog([theFileTypes objectAtIndex:i]);

    ```

    ```


    Figure 16-1 shows the available list of sound file types that a user can open.


    ![](img/ea40cad434a338535474e82c1a6ace20_316_0.png)'
