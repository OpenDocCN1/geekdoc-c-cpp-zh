  md: '# Working with Your Own Classes


    Because classes form the basis of your Cocoa projects, you use them frequently.
    Most often, you create a class to store and manipulate the data for your application.
    Cocoa calls this type of class a Model. The class that takes care of displaying
    your data is the View. A third class — a Controller mediates between the Model
    and the View.


    Here’s how you create and use your own class in board terms:


    +   1. Create a class.

    2. Build an interface.

    3. Add a Controller class and connect it to the interface.

    4. Define the methods for the class.

    5. Define an action for the class.


    To try your working with classes in Objective-C, follow these steps:


    +   1. Create a Cocoa project.

    Launch Xcode and choose File:New Project. In the dialog that appears, choose Cocoa
    Application from the list of choices, name the project, and create it.


    +   2. Create a class.

    You can create classes in Xcode or Interface Builder. For this class, use Xcode:


    +   a. Choose File:New File.

    b. In the window that appears, choose Objective-C Class and click Next.

    c. In the next pane that appears, name the implementation file of the new class.
    Name it Driver.m, as shown in Figure 6-1.


    This is the class you’ll use to create a taxi driver object. When you create the
    Driver class, header and implementation files — Driver.h and Driver.m, respectively
    — appear in your project.


    +   3. Create a new Controller class:

    a. Double-click mainMenu.xib in Xcode to show Interface Builder.

    b. In the Library window, search for object and drag an NSObject item to the project
    window.

    c. Press Cmd+D and name the new class MyViewController in the Identity Inspector,
    as shown in Figure 6-2.


    This class will communicate with your interface.'
