- pgno: 240
  md: '# Chapter 12


    # Graphics


    +   In This Chapter


    - Defining colors

    - Creating a custom view

    - Drawing rectangles and ovals

    - Painting irregular shapes

    - Creating text

    - Displaying images


    From the beautiful fonts in a word processor to the shiny Finder interface, the
    Mac OS has always prided itself on fantastic looking graphics. Mac OS X is no
    different. With its sophisticated Quartz graphics engine, Mac OS X can produce
    stunning graphics. Cocoa gives you direct access to these powerful features of
    Mac OS X.


    This chapter covers the basics of working with graphics in Cocoa. You create a
    custom view for displaying your graphics and draw on it with a variety of colors,
    shapes, and images. You even write code to change the opacity of your graphics,
    giving them the coveted see-through look.


    # Cocoa and the Art of Graphics


    Before jumping head first into graphics, you need to familiarize yourself with
    a few important Cocoa data types: NSPoint, NSRect, NSSize, and NSColor. You need
    them to do any type of graphics programming in Cocoa, so they make a good starting
    point.


    # Points


    Just like in geometry, Cocoa uses points to designate positions on a square grid.
    To work with points in Cocoa, you use an NSPoint structure. NSPoint'
  merge: -1
  img_proc: true
- pgno: 241
  md: "is a structure comprised of two floats (*x* and *y*, respectively). *Quartz*,\
    \ the graphics engine on the Mac OS, defines the bottom-left corner of a view\
    \ as the origin (0,0). The *x* value increases as you move to the right. The *y*\
    \ value increases as you advance up.\n\n![](img/ea40cad434a338535474e82c1a6ace20_241_0.png)\n\
    \nThe bottom-left origin is different than what you might be accustomed to in\
    \ other programming environments, where the origin is in the top-left corner.\
    \ This bottom-left arrangement comes from PostScript, upon which OS X's underlying\
    \ PDF (Portable Document Format) graphics model is based.\n\nThe following structure\
    \ shows how the Quartz framework defines a point:\n\n```\ntypedef struct _NSPoint\
    \ {\n    float x;\n    float y;\n} NSPoint;\n```\n\nThe *x* and *y* portion of\
    \ the structure are the coordinates of the point that you want to represent. To\
    \ use an `NSPoint` variable, you must first declare it like you would any other\
    \ variable or structure:\n\n```\nNSPoint thePoint;\n```\n\nThen to assign values\
    \ to the *x* and *y* members of an `NSPoint` structure, use the `NSMakePoint`\
    \ function. This example creates an `NSPoint` at the location (100,100):\n\n```\n\
    thePoint = NSMakePoint(100,100);\n```\n\n# ### *Rects and sizes*\n\nClosely related\
    \ to the `NSPoint` structure is the `NSRect` structure. An `NSRect` (*Rect* is\
    \ short for *rectangle*) is a structure comprised of an `NSPoint`, the *origin*\
    \ of the rectangle, and an `NSSize`, the size of the rectangle:\n\n```\ntypedef\
    \ struct _NSRect {\n    NSPoint origin;\n    NSSize size;\n} NSRect;\n```\n\n\
    To understand how this works, you also need to know about the `NSSize` structure:\n\
    \n```\ntypedef struct _NSSize {\n    float width;\n    float height;\n} NSSize;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Thus, an `NSRect` is really a structure of four float values: two for the `NSPoint`
    and two for the `NSSize`. The `NSPoint` portion describes where the `NSRect` begins,
    and the `NSSize` variable describes the dimensions of the `NSRect`.


    To create an `NSRect`, first declare the `NSRect` variable:


    ```

    ```c

    NSRect  theRect;

    ```

    ```


    Then initialize that variable with the `NSMakeRect` function. `NSMakeRect` takes
    four parameters: `x`, `y`, `width`, and `height`. For example, this line of code
    creates an `NSRect` with an origin at (100,100) and dimensions of 50 x 50:


    ```

    ```c

    theRect = NSMakeRect(100,100, 50, 50);

    ```

    ```


    Later, if you want to find the origin or size of the `theRect`, use code like
    this:


    ```

    ```c

    float theOriginX, theOriginY;

    float theSizeW, theSizeH;


    theOriginX = theRect.origin.x;

    theOriginY = theRect.origin.y;


    theSizeW = theRect.size.width;

    theSizeH = theRect.size.height;

    ```

    ```


    # ## Colors


    Cocoa''s AppKit includes the `NSColor` data type to help you work with color in
    your graphics projects. You have two ways of working with color.


    # ### Using convenience colors


    The easiest way to create and define an `NSColor` object is to use one of the
    color convenience methods. You''ll recognize immediately the colors that each
    `NSColor` convenience method represents because it has a plain-English name. For
    example, to create an `NSColor` object that stores the color black, use code like
    this:


    ```

    ```objective-c

    //Declare a pointer to an NSColor object

    NSColor *aColor;


    // assign the color black to it

    aColor = [NSColor blackColor];

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'As you may have guessed, this technique works for many other colors too (blueColor,
    redColor, and so on). Table 12-1 lists common colors that you can use.


    | **Table 12-1 Preset Color Components** |

    | :--- | :--- |

    | **Preset Component** | **Color It Produces** |

    | blackColor | Black |

    | blueColor | Bright blue |

    | brownColor | Brown |

    | clearColor | Clear/transparent |

    | cyanColor | Light blue |

    | darkGrayColor | Dark gray (for the Canadians, dark grey) |

    | grayColor | Medium gray |

    | greenColor | Bright green |

    | lightGrayColor | Light gray (you were expecting something else?) |

    | magentaColor | Pinkish purple color... or is it a purple-ish pink color |

    | orangeColor | Orange |

    | purpleColor | Purple |

    | redColor | Bright red |

    | whiteColor | White |

    | yellowColor | Bright and sunny yellow |



    # Using device-dependent color spaces


    Eventually, you''ll want some colors that the convenience methods don''t cover.
    In that case, you have to resort to some of the more sophisticated color methods
    in the AppKit. The AppKit has three kinds of color spaces that you can use to
    create colors:


    +   - **Device dependent (or device):** When you use *device colors*, you can''t
    be sure that you''ll always see the same color across devices. You''re probably
    most familiar with this kind of color because most home computer monitors and
    printers display it. Stand any two computer monitors next to each other, and you''ll
    soon discover that they don''t produce colors equally. Sure, it''s good enough
    to view Web pages, play games, and even create graphics. It also works for many
    kinds of home-printing chores. It''s not so good, however, for professional printing,
    color correction, and similar color tasks.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '❛ Device independent (or calibrated): Computer and printer manufacturers began
    creating hardware and software solutions to calibrate their equipment. The idea
    was that you could see the same kind of output no matter what device you used.
    The calibration is supposed to account for the peculiarities of your particular
    device and adjust it to produce accurate colors.


    ❛ Named: This color space is for even more sophisticated work with color. You
    can disregard it for this book.


    The device-dependent color space has three color spaces. A color space is just
    a fancy way of saying "ways of creating color." Normally, you create colors by
    mixing different amounts of specific base colors. The three mixing schemes that
    you can use in device-dependent color are


    +   ❛ DeviceRGB: Red, green, blue, and alpha components

    ❛ DeviceCMYK: Cyan, magenta, yellow, black, and alpha components

    ❛ DeviceWhite: White and alpha components


    For the rest of this chapter, you have to worry only about DeviceRGB because it''s
    the best choice for displaying graphics on a monitor. The colors that emanate
    from a monitor are produced by mixing varying amounts of red, green, and blue
    light, hence RGB. As you combine colors in RGB, the color approaches white. CMYK,
    on the other hand, is used for printing color. As you combine colors in CMYK,
    the color approaches black. After you get the hang of the DeviceRGB color space,
    it''s easy to use the DeviceCMYK and DeviceWhite color spaces. You''re not missing
    anything by forgetting about them for the time being because this chapter deals
    solely with color on a monitor, not a printer.


    Now, it''s time to get to the code. You define your own RGB (red, green, blue)
    colors with the colorWithDeviceRed function. The function takes four floats as
    parameters. These four numbers correspond to the three color channels (red, green,
    and blue) and the alpha channel. Each parameter can have a value between 0.0 and
    1.0; 1.0 is fully on for that particular color channel. The alpha parameter dictates
    how opaque the color is. A value of 1.0 is completely opaque, and a value of 0.0
    is fully transparent.


    ![](img/ea40cad434a338535474e82c1a6ace20_244_0.png)


    This numbering scheme contrasts with the colors used in familiar applications,
    such as Web pages and Photoshop documents, where the numbering usually has a range
    between 0 and 255. To correlate with the Cocoa way of doing things, add 1 to the
    value of each color component and divide by 256. For example, if you want to convert
    a Photoshop color with RGB values of (127,63,255) to the RGB values for an NSColor,
    perform this simple calculation:'
  merge: -1
  img_proc: true
- pgno: 245
  md: '```

    127 + 1 = 128/256 = 0.5

    63 + 1 = 64/256 = 0.25

    255 + 1 = 256/256 = 1.0

    ```


    To create an `NSColor` object in the DeviceRGB color space, use code like this:


    ```

    //Declare a pointer to an NSColor object

    NSColor* theColor;

    //create the object

    //and assign the color black to it

    theColor = [NSColor colorWithDeviceRed:(float)0.0

    green:(float)0.0 blue:(float)0.0

    alpha:(float)1.0];

    ```


    Notice that the red, green, and blue parameters are all set to 0.0, which yields
    the color black. If you wanted to create a red color object, you’d use code like
    this:


    ```

    //create the object

    //and assign the color red to it

    theColor = [NSColor colorWithDeviceRed:(float)1.0

    green:(float)0.0 blue:(float)0.0

    alpha:(float)1.0];

    ```


    The red parameter has a value of 1.0, and the green and blue components have a
    value of 0.0. By adjusting the alpha value, you can create different shades of
    the same color. I discuss color in more detail later in this chapter, in the “Painting
    with Lines and Shapes” section.


    After you create a color object, the only other thing you need to do before working
    with it is to use the set function. This sets the graphics pen to your desired
    color:


    ```

    [theColor set];

    ```


    Yes, it’s as easy as that. Again, you’ll see more clearly how Cocoa colors work
    in the code examples in the remainder of this chapter.'
