- pgno: 363
  md: '![](img/ea40cad434a338535474e82c1a6ace20_363_0.png)


    # Defining the Model


    Although it’s not technically true, it can be helpful to think of your core data
    model as a database. More specifically, the data model contains a definition for
    the data that your application will be managing. Much like creating a new database,
    you define the various data elements that make up the data model with Xcode’s
    data modeler. For this chapter, imagine an application that helps you keep track
    of your book collection. A book application might help you track information,
    such as


    +   *   Title

    *   Author

    *   Page count

    *   Category: fiction or non-fiction

    *   Synopsis

    *   ISBN


    In Core Data parlance, a book in this application is an *entity* and information
    about a book (title, author, and so on . . . ) is a *property*, or more specifically
    an *attribute*. The Xcode data modeler helps you define entities, properties,
    and their relationships.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'To create the data model for the book application, follow these steps:


    +   1. **Open the Models folder and select the default data model to display the
    data modeler.**


    If you want more elbow room, you can double-click the model to open the data modeler
    in a separate window.


    The data modeler consists of four panes (not panels): a list of entities, a list
    of properties, a pane that displays information about entities and attributes
    (currently displaying No Selection), and a big pane at the bottom that looks like
    graph paper. Refer to Figure 19-2.


    The graph paper--looking section at the bottom of the data modeler gives you a
    visual representation of the data model when you have entities and attributes
    in the model.


    +   2. **Click the + button at the bottom of the Entity pane to create a new entity.**


    A new entity appears in the Entity pane, as shown in Figure 19-3.


    +   3. **Change the entity name to *Book* by double-clicking its name in the Entity
    pane or by changing its name in the far-right pane of the data modeler.**


    The *Book* entity, as you might have already guessed, keeps track of your books.


    ![](img/ea40cad434a338535474e82c1a6ace20_364_0.png)'
  merge: -1
  img_proc: true
- pgno: 365
  md: '**4. Create Author and Category entities, respectively.**


    The author and category of a book might both be considered properties of a book,
    and in fact, you could define them that way. However, in this application, define
    both the Category and Author as entities instead (see Figure 19-4). That way,
    you can alter the author names and categories later without changing the author
    and category for each book in the collection.


    ![](img/ea40cad434a338535474e82c1a6ace20_365_0.png)


    If the three entities appear on top of one another on the graph paper-looking
    pane, move them by clicking and dragging each entity so you can see them better.


    ![](img/ea40cad434a338535474e82c1a6ace20_365_1.png)


    **Figure 19-4:** Create the Author and Category entities.


    **5. Select the Book entity and then click the + button at the bottom of the Property
    pane to add an attribute to the Book entity.**


    There are three kinds of properties: attributes, fetched properties, and relationships,
    which all appear in the pop-up menu that opens when you click the + button in
    the Property pane. For now, you need only concern yourself with the attributes
    property type.


    **6. Name the new attribute *title* and make it a non-optional String type.**'
  merge: -1
  img_proc: true
- pgno: 366
  md: "Deselect the **Optional** check box for the *title* attribute and select String\
    \ from the Type drop-down list, as shown in Figure 19-5. The title attribute will\
    \ store the name of the book as a string of characters, which is why you selected\
    \ the string type. Contrary to an entity name, an attribute name isn’t capitalized\
    \ (for example, use *title*, not *Title*).\n\n![](img/ea40cad434a338535474e82c1a6ace20_366_0.png)\n\
    \nFigure 19-5:  \nAdd a new title attribute to the Book entity.\n\n**7. Add a\
    \ *pages* attribute to the *Book* entity and choose *Integer 16* from the *Type*\
    \ drop-down list.**\n\nThe *pages* attribute tracks the page count of a book.\
    \ The *Integer 16* data type represents a 16-bit integer, large enough to store\
    \ values as high as 65,536. That number should suffice for most books — even *War\
    \ and Peace!* Figure 19-6 shows the *Book* entity with two attributes: *title*\
    \ and *pages*.\n\n**8. Add a third attribute, *synopsis*, and give it a *String*\
    \ type.**\n\nThis new attribute tracks the synopsis of the book. The attribute\
    \ uses the *String* type because you want to store a string of text.\n\n**9. Add\
    \ a fourth attribute, *isbn*, and designate it as a *String* type.**\n\nFigure\
    \ 19-7 shows the *Book* entity and its four attributes. The *isbn* attribute is\
    \ a string instead of an integer because some users might enter the ISBN with\
    \ hyphens separating the numbers, thus making it a string of characters. Also,\
    \ some books don’t have an ISBN and might use a different numbering system that\
    \ requires text data."
  merge: -1
  img_proc: true
- pgno: 367
  md: '![](img/ea40cad434a338535474e82c1a6ace20_367_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_367_1.png)


    10. Select the **Author** entity from the Entity pane on the left and add an attribute,
    name, to it and assign a String type. Deselect its Optional check box.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '+   11. Select the Category entity from the Entity pane on the left and add
    an attribute, name, to it and assign a String type. Deselect its Optional check
    box.


    Figure 19-8 shows the completed Category entity.


    ![](img/ea40cad434a338535474e82c1a6ace20_368_0.png)


    +   12. Select the Book entity, add a relationship, author, to it in the Property
    pane, select Author from its Destination pop-up menu, and select the To-Many Relationship
    check box.


    Like attributes, relationship names are lowercase.


    A relationship is a different kind of property than an attribute. Instead of storing
    data like an attribute does, a relationship defines a link between two entities.
    To find the name of an author, the Book entity links to the Author entity. The
    To-Many Relationship check box is selected because some books have multiple authors.
    The arrow also has two heads at the author end.


    The Book entity is now linked to the Author entity, showing their relationship.
    See Figure 19-9.


    +   13. Add a second relationship to the Book entity and name it category. Select
    Category from its Destination pop-up menu and select the To-Many Relationship.


    The category relationship gleans category information from the Category entity.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/ea40cad434a338535474e82c1a6ace20_369_0.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_369_1.png)


    The **Book** entity is now linked to the **Category** entity, as shown in Figure
    19-10. Because a book might belong to multiple categories, the To-Many Relationship
    check box is selected. Because of the To-Many relationship, the arrow has two
    heads.


    ![](img/ea40cad434a338535474e82c1a6ace20_369_2.png)


    ![](img/ea40cad434a338535474e82c1a6ace20_369_3.png)'
