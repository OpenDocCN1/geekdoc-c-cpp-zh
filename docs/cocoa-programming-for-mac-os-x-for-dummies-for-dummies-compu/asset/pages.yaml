- pgno: 60
  md: '# # Chapter 3


    # # Xcode


    # **In This Chapter**


    +   * Jumping headfirst into Xcode

    * Customizing the Xcode window

    * Adjusting the settings for your project

    * Editing source code with Xcode

    * Debugging your Cocoa projects to remove errors

    * Using the built-in Help features of Xcode

    * Building an application from your project


    Cocoa programming requires the use of some sophisticated development tools. Chief
    among these is Xcode. With Xcode, you can manage your Cocoa projects: write code,
    assemble, organize, and test your project, and finally build an application that
    you can run on any Mac OS X computer.


    Xcode is the main component of Apple''s integrated development environment (IDE).
    Xcode has everything you need for managing Cocoa projects, editing and debugging
    source code, and building applications. As you discover the different features
    of Xcode, you will continue to improve on the calculator project you created in
    Chapter 2. By the end of this chapter, you''ll have a calculator application that
    has improved functionality and is free of bugs. These two goals are all professional
    programmers want from their software, and Xcode can help you achieve them.


    If you didn''t build the simple calculator in Chapter 2, you can find the project
    files for this chapter on the For Dummies web site at www.dummies.com/go/cocoafd.
    The chapter starts with the My First Project file.


    ![](img/ea40cad434a338535474e82c1a6ace20_60_0.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Xcode: The Core of Apple''s Development Tools


    Because Xcode is a first-class development tool, its collection of windows, menus,
    and settings can look daunting to a budding Cocoa programmer. Xcode is professional
    software, so don''t be surprised if you have a bit of a learning curve. Apple
    created Mac OS X for use by the average Joe (and Jane), but it made Xcode for
    developers. Xcode has a classic Macintosh interface with windows and menus like
    other software, but the subject matter is technical, so don''t feel too intimidated
    if you don''t understand everything at once.


    With Xcode, you can do many types of programming. Because of this fact, Xcode
    offers tools, documentation, and settings for doing all these kinds of programming.


    As a Cocoa programmer, you''re focusing on only one aspect of Xcode''s total capabilities.
    Thus, you''ll need to use only the tools, documentation, and settings that pertain
    to Cocoa programming. Some features in Xcode you may use occasionally, rarely,
    or never at all.


    Think of Xcode as a hardware store. You might customarily go to the hardware-store
    to buy nails, screws, or wood glue. Once in a while, you pick up a hammer, a screwdriver,
    or even a tape measure. Every so many years, you even pay for the exterior of
    your house. You do not go into the roiling aisle, though. you''re afraid of heights
    and always leave that work to the professionals.


    You use Xcode in the same way you use the local hardware store. You perform some
    tasks all the time (writing code for your application), some less frequently (assigning
    an icon to your application), and some rarely (adjusting the preferences for an
    Xcode setting). Others may approach at all (creating drivers for a CD burner).
    This isn''t like adjusting preferences; Xcode is a tool you''ll seldom perform
    and CD drivers are only for professionals. It''s that Xcode is a tool for many
    kinds of development. Like a hardware store, everyone uses Xcode for specific
    needs. Maybe your neighbor likes to do plumbing and CD driver development. You,
    on the other hand, stick to furniture repair and Cocoa application development.
    The hardware store and Xcode can assist you and your neighbor in their endeavors
    even if neither of you understands what the other does.'
  merge: -1
  img_proc: true
