    int i;

    NSArray  *theArray;

    NSString  *name1;

    NSString  *name2;

    NSString  *name3;

    NSString  *name4;


    //assign values to the four names

    name1 = @"Maria";

    name2 = @"Mercedes";

    name3 = @"Leopold";

    name4 = @"Frederick";


