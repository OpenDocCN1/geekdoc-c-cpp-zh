    # Managing your icons


    Unlike the Icon Composer, which lets you create icon files, the icons Browser
    application is strictly an icon viewer. With icons Browser, you can view the contents
    of any ICNS file, but you can''t change those contents.


    The icons Browser is handy for finding out why a particular application isn''t
    displaying an icon property. For example, your application might display a nice-looking
    icon when viewed at 128 x 128, but displaying nothing at the 32 x 32 size. The
    icons Browser can help you discover which icon elements are missing so you can
    correct the situation.


    icons Browser resides here:


    ```

    /Developer/Applications/icns Browser

    ```


    To see how icons Browser work, launch it and choose File:Open to open the ICNS
    file you created with Icon Composer. You see something that looks like Figure
    5-16. Notice that several elements of the icon file are missing.


    This ICNS file doesn''t contain all the elements in an ICNS file because you made
    it for Mac OS only. The blank elements in this icon file are for maintaining compatibility
    with earlier versions of the Mac OS. As a Cocoa programmer, you can''t target
    earlier versions of the Mac OS anyway, so forget about that old technology! The
    Mac OS is smart enough that it can scale down larger icons for use at smaller
    sizes. You''ll notice the icons Browser application is getting a little dated
    because it doesn''t support 512 x 512 or 256 x 256 icons. It''s still a useful
    tool for sanity checks, though.'
