  md: '# Customizing Xcode Preferences


    Open the project file by double-clicking its icon in Finder. Xcode launches, displaying
    the project and its components. The default Xcode settings appear in Figure 3-1.
    If you''ve read Chapter 2, this window should look familiar because you used it
    to create your project.


    Xcode displays the code and components of your project in your window. It displays
    a single project window by default, but you aren''t limited to this setup. Follow
    these steps to change your layout:


    +   1. Close any projects.


    Xcode demands that all project windows be closed before it lets you change the
    Layout setting.


    +   2. Open the Xcode Preferences window by choosing Xcode Preferences.


    Across the top of this window is a row of buttons.


    +   3. Click the General button.


    The Xcode settings appear, as shown in Figure 3-2.


    ![](img/ea40cad434a338535474e82c1a6ace20_62_0.png)'
