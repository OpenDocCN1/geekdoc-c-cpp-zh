  md: '# Reading from and writing to documents


    Many types of files are on your hard drive. Each file type has its own format,
    whether it’s text, graphics, fonts, or audio. Cocoa has built-in functions to
    deal with common file formats. For example, Cocoa is adept at working with text
    documents of all sorts. See Chapter 11 to get the scoop on working with text files.


    Graphics is another place where Cocoa shines. Whether you need to view a PICT
    file, save a JPEG file, or convert a view to PDF, Cocoa and the underlying QuickTime
    engine of Mac OS X have you covered. You can find information about working with
    graphics files in Chapter 12.


    Multimedia is yet another highlight of the Mac OS. Chapter 16 discusses the use
    of audio and video files in your applications. There, you’ll find the code you
    need to view QuickTime movie files as well as play a variety of audio files.


    # Working with Files and Folders


    Copying and moving files are important functions that you may want to perform
    in your applications. To add these features to your project, follow these steps:


    +   1. Open your MainMenu.xib file in Interface Builder.


    +   2. To your main window, add two new NSButtons and change their titles.


    To follow along with the example, change the Title attribute of one button to
    Copy File to Desktop. As you may have guessed, when users click this button, they
    can select a file. The application then duplicates that file, placing it on the
    desktop.


    Change the Title attribute of the other NSButton to Move File to Desktop.


    +   3. Add a new action to the FileInfoController class in the Identity Inspector
    window.


    To follow along with the example, name the action copyTheFile.


    +   4. Connect the action to the button.


    To do so, Control+drag from the button to the FileInfoController instance in the
    NIB file.


    +   5. Save your interface and return to Xcode.'
