  md: "![](img/ea40cad434a338535474e82c1a6ace20_262_0.png)\n\n**Figure 12-12:**  \n\
    Drag an image from Finder to your project for easy access.\n\nTo draw this image\
    \ in a view, you need to add only a few lines of code:\n\n+   1.  **Create an\
    \ NSPoint to hold the coordinates for where you want to display the image.**\n\
    \    This code creates an NSPoint for the lower-left corner of the view:\n\n```\n\
    ```objectivec\nNSPoint theImagePos;\ntheImagePos = NSMakePoint(0, 0);\n```\n```\n\
    \n+   2.  **Create an NSImage object and load the image into it.**\n\n```\n```objectivec\n\
    NSImage* theImage;\ntheImage = [NSImage imageNamed:@\"face.jpg\"];\n```\n```\n\
    \n+   3.  **Display the image in the view by calling the dissolveToPoint function.**\n\
    \n```\n```objectivec\n[theImage dissolveToPoint: theImagePos\n    fraction:(1.0)];\n\
    ```\n```\n\nFigure 12-13 demonstrates the `dissolveToPoint` function in action.\n\
    \nThe fraction parameter of the `dissolveToPoint` function represents the opacity\
    \ of the image. The smaller the value you use for the fraction, the more transparent\
    \ it is. A value of 1.0 indicates no transparency; a value of 0.0 denotes complete\
    \ transparency. Figure 12-14 shows the effect of different opacity settings."
