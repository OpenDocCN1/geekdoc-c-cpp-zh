    #  Library window


    To create an interface, you need an assortment of buttons, sliders, and other
    controls. The Library window provides these controls for you to use in your interface.
    To view the controls that are available to you, follow these steps:


    +   1. Choose Controls: Library.


    The Library window appears, with a row tabs across the top, as shown in Figure
    4-9.


    +   2. Click the Objects tab to see the controls and other objects that are available
    to you.


    +   3. Select Cocoa from the frameworks listed at the top of the Library.


    The Library window is organized by framework. Selecting Cocoa displays the controls
    that are available to you via the Cocoa framework.


    +   4. Search for a control.


    You can search for specific class names, such as NSButton, or you can search for
    controls using descriptive terms like button.


    Table 4-2 describes the sets of controls available in the Library window.


    | Table 4-2 | Objects in the Library Window |

    |---|---|

    | Frameworks | Reveals These Types of Controls and Objects |

    | Cocoa | Windows, menus, toolbars, controllers, buttons, radio groups, image
    well, sliders, progress indicators, and others |

    | Interface Builder Kit | Library template (for advanced users) |

    | Web Kit | Web view |'
