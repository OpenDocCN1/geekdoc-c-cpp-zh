    - Cocoa Dev Central

    - CocoaDev


    The Internet is a virtual treasure chest for Cocoa developers. On the Web, you
    find scores of sites offering Cocoa source code, demo projects, tutorials, instructions,
    and even personal assistance. This chapter touches on ten important Web sites
    that will improve your Cocoa experience by offering help and insight into how
    to program most effectively in Cocoa. You’ll find links to professional Cocoa
    development companies as well as individual Web sites.


    ![](img/ea40cad434a338535474e82c1a6ace20_386_0.png)


    Many of these sites also support RSS feeds, so you can set up a subscription and
    avoid manually checking the sites for new information.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# Apple Developer Connection


    ```

    developer.apple.com

    ```


    It makes obvious sense that Apple’s Developer Connection would be your first stop
    in search of Cocoa information. Apple’s site offers online documentation (in addition
    to the built-in documentation in Xcode), tutorials, reference materials, and tons
    of sample source codes. Further, Apple hosts several user forums where you can
    ask questions from the professionals or simply read answers to thousands of questions
    that other developers have posted to the forums. If you visit only one Web site
    for Cocoa help, this is it.


    # Borkware Quickies


    ```

    www.borkware.com/quickies

    ```


    The Borkware Quickies site offers dozens of useful code snippets that pertain
    mostly to Cocoa. These snippets rarely offer much additional discussion; that’s
    okay! Here you find brief descriptions of how the snippets work, and the site
    does a good job of anticipating the common questions and requests of most developers
    working with Cocoa. If you find yourself lost in Apple’s documentation, give Borkware
    Quickies a try, and you might be surprised to find that it’s already documented
    the same exact solution you need.


    # Cocoa Is My Girlfriend


    ```

    www.cimgf.com

    ```


    Cocoa is My Girlfriend is a Cocoa-related blog written by Marcus Zarra and Matt
    Long. This blog has a couple good things going for it. For starters, the posts
    are always interesting and well written. Combine that with the fact that most
    entries are very practical in nature. The authors usually explain how they figure
    out how something Cocoa-related works. You get to go along for the ride.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Theocacao


    theocacao.com


    Another Cocoa blog, this one is run by Scott Stevenson. Scott is very involved
    in the Cocoa community, so don''t be surprised if you hear him speak one day at
    a convention or a get-together for coders. He also covers these events on his
    blog, so you won''t miss anything if you don''t attend these events. The blog
    also covers popular Cocoa topics with a fair amount of depth, provides interviews
    with Cocoa luminaries, and offers the occasional rant.


    # Call Me Fishmeal


    wilshipley.com/blog


    Wil Shipley is well-known among the Cocoa community, largely because of his outstanding
    business success writing Cocoa software and because he was the founder of The
    Omni Group, one of the seminal NeXT developers, and a major developer since the
    beginning of OS X. His site offers Wil''s musings on a variety of subjects, including
    Cocoa, Macintosh, iPhone development, fast cars, Microsoft, software design, and
    product design in general. He''s an opinionated bloke, but you can tell that his
    remarks are always well thought out and that he believes his stance strongly.
    One of the more popular Cocoa items on the blog is the Pimp My Code series, where
    Wil accepts a reader-submitted code submission and then explains how to fix and/or
    improve the code. It''s immensely interesting watching how a professional approaches
    real-life code.


    # Domain of the Bored


    boredzo.org/blog


    With a subtitle of “The personal Weblog of Peter Hosey,” this blog has a significant
    amount of Cocoa materials. Between in-depth explanations of Cocoa concepts and
    anecdotes about his development experiences with his Growl framework, Peter''s
    site is one not to miss. You have to do some digging on his site, but you come
    out with some useful gems. He also likes to tout the Macintosh platform as well
    as other kinds of programming, so you''re never bored here.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Dan Wood: The Eponymous Weblog


    ```

    http://gigliwood.com/weblog

    ```


    Dan Wood offers a lot of useful Cocoa discussions based on his real-world experience
    developing software. Sometimes he talks about his experiences releasing products,
    other times he riffs on software localization. Whatever the topic, you leave his
    site a better programmer.


    # Apple Forums


    ```

    www.cocoabuilder.com

    ```


    This site provides archives of Apple’s forums for Cocoa and Xcode development.
    With a quick search, you have instant access to thousands of posts by Cocoa developers
    from around the world. Mainly these come in the form of questions and requests
    for help, and the replies tend to come from Cocoa professionals. The answers are
    sometimes terse, but the information is always spot on. If a Cocoa developer has
    thought of it, it’s appeared on this site at one time or another (or more likely
    — multiple times).


    # Cocoa Dev Central


    ```

    cocoadevcentral.com

    ```


    Cocoa Dev Central hosts a couple dozen Cocoa tutorials. The tutorials are in-depth
    and very well done. Besides having a beautifully polished appearance, the tutorials
    are easy to follow and cover topics that aren’t always available elsewhere. The
    tutorials are usually geared toward beginners, but pros will find something beneficial
    here too.


    # CocoaDev


    ```

    cocoadev.com

    ```


    CocoaDev is a fantastically useful site that covers many different aspects of
    Cocoa development. Here you find all sorts of advice about Cocoa programming in
    a nice condensed format (just the facts, ma’am!). The site has a large user base,
    so you can be sure that the advice comes from a variety of developers. You also
    find on this site an enormous list of Cocoa blogs.'
  merge: -1
  img_proc: true
