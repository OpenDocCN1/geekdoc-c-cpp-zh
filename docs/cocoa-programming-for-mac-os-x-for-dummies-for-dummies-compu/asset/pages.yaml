- pgno: 191
  md: 'To set the icon displayed on a button, perform the following steps:


    +   1. **Drag a round button from the Library to the main window of your interface.**

    2. **Select an image to use as the button’s icon from the Image drop-down list
    in the Button Attributes window.**

    3. **Set the alignment of the button image.**


