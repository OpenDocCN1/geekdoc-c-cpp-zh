- pgno: 138
  md: "# Chapter 6: The Basics of Objective-C\n\nThe setName method sends the retain\
    \ message to aName. The retain method, just like alloc, increases the reference\
    \ count by one. (It might help to think of retain as the opposite of release.)\
    \ So, the code aName around memory for use elsewhere in the class. And because\
    \ you're done with whatever object name is pointing to, you then release name.\
    \ The method assigns aName. Following this simple plan prevents you from leaking\
    \ memory each time name is used, whatever it was pointing to previously and the\
    \ new thing it's pointing to retained.\n\nIf you're following along so far, you\
    \ might be wondering what happens when the object is finally destroyed. You won't\
    \ still have a reference count of one for the name instance variable? Yes! You\
    \ must release the last lingering name in the dealloc method of the class.\n\n\
    ```\n(void)dealloc {\n  [name release];\n}\n```\n\nHere are some special cases\
    \ where you don't have to worry about retaining and releasing objects:\n\n+  \
    \ When you create an object with one of the built-in convenience methods of a\
    \ class: That object is said to be autoreleased, which means you don't have to\
    \ release it releasing for you. For example, the NSString class has a stringWithString\
    \ convenience method. You can use it instead of alloc to create an NSString object:\n\
    \nYou don't have to alloc to create the object. And because you use a convenience\
    \ method, stringWithString, it's autoreleased, so no need to release it.\n\n+\
    \   When objects are autoreleased in code: For example, if you see an object that\
    \ has autorelease, there's no need to release that object:\n\n```\nSomeClass *someObject\
    \ = [[SomeClass alloc] init]\nautorelease];\n```\n\nThe autorelease method decreases\
    \ the reference count by one, which negates the increase by one of the reference\
    \ count by alloc.\n\n![](img/ea40cad434a338535474e82c1a6ace20_138_0.png)"
