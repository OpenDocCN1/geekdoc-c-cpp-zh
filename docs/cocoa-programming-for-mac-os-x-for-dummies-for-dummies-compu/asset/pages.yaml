- pgno: 37
  md: '# 18 Part I: Developer Tools




    For some people, this can be the toughest step in the programming process. For
    others, it''s the simplest. Consider a task that you want your computer to perform.
    Then think of a computer program that would do it. What would the program look
    like? How would it operate? What behaviors must it possess?




    You usually begin Cocoa development in the Xcode application. Xcode is the tool
    at the center of Cocoa programming; it''s where you create and work with the various
    parts of Cocoa projects. Chapter 3 covers Xcode in depth.




    After you create a project in Xcode, launch Interface Builder to work on your
    application''s interface. In traditional Mac fashion, creating an interface is
    as easy as dragging and dropping. Using only the tools in Interface Builder, you
    can quickly build attractive interfaces in minutes. Chapter 4 covers Interface
    Builder.




    After you create the interface, return to Xcode and add code to make the interface
    functional. This part of the programming process gives functionality to the interface
    you created. Fortunately, Interface Builder can help the process along by laying
    out a basic shell in Xcode where you can enter your code.




    No one gets everything right first time, especially with something potentially
    complex as programming a computer. To assist, Xcode gives you a complete set of
    tools for testing your application before you unleash it on the world.




    You''ve created interface, added the code, and tested your project. Now it''s
    time to build an application. With one click, you can build an application that
    can run on almost any Mac X computer.


    > If you''re using a version of Mac OS X prior to Leopard (10.5), you may not
    be able to run your application on later versions of Mac OS X. Because Apple is
    always improving the operating system, a time may come when frameworks from a
    newer version of the operating system are incompatible with an older version of
    the operating system. To ensure that you have the necessary frameworks to target
    the latest version of Mac OS X, always upgrade to the most recent version of Mac
    OS X and its corresponding Xcode Developer Tools.


    ![](img/ea40cad434a338535474e82c1a6ace20_37_0.png)'
