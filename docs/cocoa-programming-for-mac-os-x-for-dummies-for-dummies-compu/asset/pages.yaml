  md: "you've freed an object in memory that you still need. Your code will crash\
    \ when you try to access this freed object.\n\nAs you saw in the previous section,\
    \ an object is allocated with the alloc method. The alloc method increases the\
    \ reference count by one, so it needs a corresponding release.\n\n```\nSomeClass\
    \ *object = [[SomeClass alloc] init];\ndo stuff with someObject here...\n[someObject\
    \ release];\n```\n\nSo far, this is pretty simple because the allocation and release\
    \ of the object are all within the same block of code. Where things get a little\
    \ mind-bending is in the case of instance variables. Although it's legal to access\
    \ instance variables by name in your methods, it's far wiser to access them only\
    \ via\n\n![](img/ea40cad434a338535474e82c1a6ace20_137_0.png)\n\nBecause of memory\
    \ management issues, things can get ugly quickly if you don't use accessor methods\
    \ to access instance variables. If you don't use accessor methods, there's a very\
    \ real possibility that your application will leak memory or it will crash when\
    \ you try to release an object that's already released.\n\nFor example, suppose\
    \ that you have a class that has an NSString instance variable name. Declare two\
    \ methods for accessing the instance variable. A getter (name) and a setter (setName:\n\
    \n```\n@interface MyClass : NSObject {\nNSString *name;\n- (NSString *)name;\n\
