- pgno: 82
  md: '# Chapter 4


    # Interface Builder


    **In This Chapter**


    +   - Finding your way around Interface Builder

    - Adding controls to an interface

    - Editing attributes of a control

    - Editing and creating new menus

    - Implementing code to use an interface


    The second most important component of Cocoa development (Xcode is the first;
    see Chapter 3) is the eponymous Interface Builder application, which uses you
    to build interfaces for your Cocoa projects. Interface Builder gives you the ability
    to construct beautiful interfaces for your software with drag-and-drop ease —
    without a lick of code. More importantly, the interfaces you create in Interface
    Builder follow Apple''s stringent Human Interface Guidelines, so you have a good
    chance of producing applications that Mac users (they can be a finicky bunch)
    like look at and ultimately use.


    In this chapter, you take a tour of Interface Builder, examining its functionality
    as you go. To help you acclimate to Interface Builder, you improve the calculator
    application that you created in Chapter 3. By the end of this chapter, your calculator
    will have a new menu, additional interface elements, and added functionality.


    ![](img/ea40cad434a338535474e82c1a6ace20_82_0.png)


    You can find the project files for the chapter on *For Dummies* Web site at www.dummies.com/go/cocoafd.'
  merge: -1
  img_proc: true
