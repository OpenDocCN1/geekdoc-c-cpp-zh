- pgno: 63
  md: '# 44 Part I: Developer Tools


    Figure 3-2:

    You can choose how

    many

    windows

    Xcode

    displays

    during development.


    ![](img/ea40cad434a338535474e82c1a6ace20_63_0.png)


    Xcode has three choices for the Layout setting that affect the project window:


    +   * **All-in-One**: All tasks appear within one window: code, build results,
    build log, and debugging. If you have very limited space (like a small laptop),
    perhaps All-in-One is best for you.

    * **Condensed**: Tasks appear in separate windows: code, build results, build
    log, and debugging. If you have a large monitor or a multiple-monitor configuration,
    you may prefer the Condensed approach to spread out your work.

    * **Default**: The Default layout uses some elements from All-in-One and some
    from Condensed. The main project window contains most views, but displays additional
    windows in some cases, notably for the debugger and console. Neat freaks love
    this setting, and it’s the one I use in most.


    +   4. Choose the setting you want from the Layout pop-up menu.


    +   5. Click OK to apply the setting and dismiss the Preferences window.


    +   6. Reopen your project and choose Build:Build and Go.


    Your application runs as usual.


    +   7. Quit the application to return to Xcode.


    +   8. Choose Run:Console to see the status of the last run.


    If your project executed without a hitch, the Console window displays a message
    like this:


