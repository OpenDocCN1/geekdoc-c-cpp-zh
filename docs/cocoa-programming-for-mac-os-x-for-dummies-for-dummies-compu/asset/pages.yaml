    # Inspector window


    The Inspector window is another important window that you''ll use frequently when
    building an interface. The Inspector window displays important information about
    whatever element you''re working with in Builder. To see how the Inspector window
    works, perform these steps:


    +   1. **Choose Tools: Inspector.**

    The Inspector window appears. The purpose of the Inspector window is to give you
    the opportunity to view and edit the attributes of the controls and objects in
    your NIB file.


    +   2. **Open a window from your XIB file.**

    The Inspector window displays the attributes for that window (see Figure 4-10).

    The Inspector window is a bit of a chameleon, altering to match its surroundings.
    If you have a window open and its properties don''t appear in the Inspector window,
    click the window''s title bar.


    +   3. **Click the Calculate button in the Design window to select it.**

    The Inspector window immediately changes to display the attributes of that button.


    +   4. **Alter the window properties as you need.**

    For example, to add a key assignment in the Inspector window, click the Key Equiv.
    field to select it and then press Return. An icon appears in the Key Equiv. field,
    representing the Return key (see Figure 4-11).'
