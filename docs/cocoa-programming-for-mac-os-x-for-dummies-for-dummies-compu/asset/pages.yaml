  md: 'If the window title is the name of a document, use the `setTitleWith` `RepresentedFilename`
    method instead of `setTitle`. This method converts from a file path to a window
    title suitable for viewing:


    ```

    `[theWindow setTitleWithRepresentedFilename:theFileName];`

