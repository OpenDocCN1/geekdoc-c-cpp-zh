    \ method executes whenever a user clicks the button in your interface. The user\
    \ clicks the button, which in turn fires the calculateAnswer action, which executes\
    \ your code.\n\nAdd the following action to the Fusebox.m file:\n\n```\n```\n\
    @import \"Fusebox.h\"\n\n@implementation Fusebox\n\n-(IBAction)calculateAnswer:(id)sender\n\
    {\n    int num1, num2, answer;\n}\n```\n```"
