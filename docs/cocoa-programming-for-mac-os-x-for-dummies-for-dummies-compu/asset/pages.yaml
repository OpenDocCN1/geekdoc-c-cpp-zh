- pgno: 48
  md: "# Wiring the interface\n\nNow that you've constructed your interface, it's\
    \ time to wire it. After, a light switch in your house can't turn on a lamp without\
    \ a wire that connects the two; your interface is no different. At the center\
    \ of a typical home's electrical system is a fuse box, or a circuit breaker box.\
    \ All wires in the home lead back to the centrally located fuse box. Cocoa interfaces\
    \ follow a similar pattern. Instead of a fuse box, however, you use a class. A\
    \ class is an abstract representation of something that you want to model from\
    \ the real world in your program — for now, you can think of it as a virtual box.\
    \ Chapter 6 has more information about classes in Objective-C programs. You then\
    \ add outlets to connect the main Fusebox to the elements of your interface.\n\
    \n# Creating classes\n\nTo create a class in Xcode:\n\n+   1. **Return to your\
    \ project in Xcode and choose File:New File.**\n   A New File Wizard opens, displaying\
    \ possible file templates.\n2. **Select Cocoa in the left column.**\n   The wizard\
    \ displays Cocoa file templates.\n3. **Select Objective-C Class from the section\
    \ on the right side of the screen.**\n   The Objective-C class is the appropriate\
    \ type of class for this Cocoa project because you're using the Objective-C language\
    \ to write this program.\n4. **Click Next.**\n5. **Name the new file Fusebox.m\
    \ and make sure that the Also Create \"Fusebox.h\" check box is selected, as shown\
    \ in Figure 2-12.**\n   An Objective-C class has two parts — an implementation\
    \ with .m file extension and an interface with a .h file extension.\n6. **Click\
    \ Finish.**\n   Xcode creates adds Fusebox.m and Fusebox.h files to the project.\
    \ You may discover that the Fusebox.m and Fusebox.h files aren't in the correct\
    \ folder of your project. It's perfectly fine for you to drag the new files to\
    \ the desired folder. In fact, they can reside anywhere in the project — in any\
    \ folder or even outside the folder. Xcode is smart enough to find them for you\
    \ come build-time."
  merge: -1
  img_proc: true
