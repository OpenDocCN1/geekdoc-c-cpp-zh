- pgno: 292
  md: "```\n```\n- (IBAction) printOnePage:(id) sender;\n- (IBAction) showPagePanel:(id)\
    \ sender;\n@end\n```\n```\n\nBesides defining MyPrintController as an NSObject,\
    \ the only other addition is this line:\n\n```\n```objc\nNSPrintInfo *thePrintInfo;\n\
    ```\n```\n\nThis line declares a pointer to an NSPrintInfo object as an instance\
    \ variable to help you store settings that the user makes in the Page and Print\
    \ panels.\n\n# 7. Select the MyPrintController.m file and change its code to read\n\
    \n```\n```objc\n#import \"MyPrintController.h\"\n\n@implementation MyPrintController\n\
    \n- (IBAction) showPagePanel:(id) sender {\n\tint i;\n\tthePrintInfo = [NSPrintInfo\
    \ sharedPrintInfo];\n\tNSPageLayout *pageLayout = [NSPageLayout\n\t\tpageLayout];\n\
    \ti = [pageLayout runModalWithPrintInfo: (NSPrintInfo *)thePrintInfo];\n}\n\n\
    @end\n```\n```\n\nHere’s how the code works:\n\n+   1. The showPagePanel method\
    \ first populates the thePrintInfo variable with the NSPrintInfo value, which\
    \ is shared by all applications.\n2. The code creates an NSPageLayout instance\
    \ and displays it using the runModalWithPrintInfo method.\n\n\t\tBy passing thePrintInfo\
    \ to the runModalWithPrintInfo method, the Page panel retains its settings in\
    \ thePrintInfo when the user dismisses it.\n\nSo far, this code is functional\
    \ but not terribly interesting. You can run it and choose File→Page Setup to view\
    \ and play with the settings in the Page panel."
