- pgno: 332
  md: 'but fewer people know that in QuickTime, this is only one kind of movie. QuickTime
    treats all media types as movies.


    For example, if you open your favorite audio files as QuickTime movies, QuickTime
    dutifully plays the audio file. Because audio files don''t have a visual component,
    there''s no need to display any part of the `QTMovieView` other than the controller.
    Figure 16-14 shows an audio file loaded into a `QTMovieView`.


    ![](img/ea40cad434a338535474e82c1a6ace20_332_0.png)


    Some of the possible media file types that you can load into a `QTMovie` follow:


    +   Audio: AIFF, MP3, M4A, WAV

    Video: MOV, AVI, MPEG-1

    Graphics: JPEG, TIFF, PNG, BMP

    3D: QTVR

    Animation: Flash


    To give a user the option of loading other types of media, simply add them to
    the `FileTypes` array in the “Building a simple audio player” section from earlier
    in this chapter. For example, if you want to offer the option of loading a QuickTime
    movie or a TIFF file, change the code as follows:


    ```

    NSArray *theFileTypes = [NSArray arrayWithObjects:@"mov", @

    "tiff", nil];

    ```


    Cocoa (and subsequently QuickTime) treats both file types equally: as a `QTMovie`.
    This means you can load and play (or load and display if it''s an image) many
    kinds of media without special code. This is one of the most powerful features
    of QuickTime, so use it often! Figure 16-15 shows the `QTMovieView` with an image
    loaded into the `QTMovie`.'
