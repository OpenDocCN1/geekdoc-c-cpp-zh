    \nThe `printf` function, which follows the opening curly brace is the first line\
    \ of code in your `main` function or code block. Like the function `main`, the\
    \ `printf` also have a code block within it, which is already created and included\
    \ since you included `<stdio.h>` in your program. The function of `printf` is\
    \ to print text into your program’s display window.\n\nBeside `printf` is the\
    \ value or text that you want to print. It should be enclosed in parentheses to\
    \ abide standard practice. The value that the code want to print is Hello World!.\
    \ To make sure that `printf` to recognize that you want to print a string and\
    \ display the text properly, it should be enclosed inside double quotation marks.\n\
    \nBy the way, in programming, a single character is called a character while a\
    \ sequence of characters is called a string.\n\n[Click here to check out the rest\
