    \n# \n\nChapter 4: Structures a.k.a. Derived Data\n\nPreviously, you learned about\
    \ strings, arrays, and dynamic arrays. Just like those functions, the programming\
    \ language allows you to compile a collection of data in a different way; it can\
    \ be used to create records.\n\nIn FORTRAN, the records that you intend to create\
    \ will be named structures or derived data. With them, you can follow through\
    \ each of your commands. Granted each element in your program was subjected to\
    \ a thorough evaluation, monitoring future processes becomes less laborious.\n\
    \n## 4.1 - What Are Structures?\n\nStructures are also called derived data types.\
    \ Their purpose is to allow you to obtain a record or a list that you can monitor\
    \ easily. Rather than sift through large amounts of data when you’re in search\
    \ of a particular batch, you can quickly identify what you need.\n\nStructure\
    \ declaration to define three things namely: (1) data type, (2) data, and (3)\
    \ end data. Once you gathered the necessary info, you may begin the initial process.\
    \ For instance, the goal is to keep tabs on specific students. When you intend\
    \ to declare a structure for the sample situation, the code would be written as\
    \ follows:\n\nprogram type_studentclass\n\nimplicit none\n\n              declarations\n\
    \nend program type_studentclass\n\n## 4.2 - Structure Components"
