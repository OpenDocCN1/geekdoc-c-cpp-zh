    \nSample program:\n\nprogram internal_main\n\nimplicit none\n\nreal :: s, t\n\n\
                  s = 4.0\n\n              t = 5.0\n\n              print *, ‘Call\
    \ before swap’\n\n              print *, ‘s = ‘, s\n\n              print *, ‘t\
    \ = ‘, t\n\n              call swap (s, t)\n\n              print *, ‘Call after\
    \ swap’\n\n              print *, ‘s = ‘, s\n\n              print *, ‘t = ‘,\
    \ t\n\ncontains\n\ninternal swap (s, t)\n\nreal :: s, t, temp\n\ntemp = s\n\n\
    s = t\n\nt = temp\n\nend internal swap\n\nend program internal_main\n\nSample\
    \ program (execution):\n\nCall before swap\n\ns = 4.0\n\nt = 5.0\n\nCall after\
    \ swap\n\ns = 5.0\n\nt = 4.0\n\n## 6.6 - Procedures & Arguments\n\nDifferent discussions\
    \ have emerged regarding procedures and arguments; the most common of which gives\
    \ light to the question whether procedures can be written and used as arguments.\
    \ Granted a function is defined in the statement and an actual argument exists,\
    \ the answer is YES, PROCEDURES CAN BE CREATED AS ARGUMENTS.\n\nSample program:\n\
    \nprogram proc_arg\n\nimplicit none\n\n              interface\n\n             \
    \               real function function (t)\n\n                                         \
    \ real intent :: t\n\n                            end real function function\n\
    \n              end interface\n\n              call sub ( r, s, func (2) )\n\n\
    end program proc_arg\n\n## 6.7 - Modules & Procedures\n\nAlthough they are rather\
    \ new to FORTRAN, modules are important to the programming language. They were\
    \ introduced to contain heaps of elements such as data, procedures, and definitions.\
    \ With them, the substantial portions that were written using the language are\
    \ accessible to a programmer who is using another programming language.\n\nSample\
    \ code:\n\nprogram module_1\n\nimplicit none\n\n              module module_1\n\
    \n                            definitions\n\n                            ! contains\
    \ modules and procedures\n\n              end module module_1\n\nend program module_1\n\
    \n## 6.8 - Public & Private Modules\n\nGranted that the correct “use” statement\
    \ is declared, a module can be accessible to all audiences. However, since open\
    \ availability can herd in problem that can but a program in potential risk, it\
    \ is recommended to restrict access and limit it to variable declaration, procedures,\
    \ and statements.\n\n# \n\nChapter 7: Manipulating Variable Amounts\n\nNow let’s\
    \ do a little review of what has been learned so far. You have learned how to\
    \ create a simple program in FORTRAN that inputs and outputs characters and numbers\
    \ on the screen. You also have learned that there are operators that can do mathematical\
    \ functions, and you can also display the results of those computations on the\
    \ screen. You have also learned about variables and at least three different data\
    \ types. Given all that you should be able to write a short program that manipulates\
    \ variable amounts. In other words, you now know how to write a program in FORTRAN\
    \ that can do some math.\n\nBefore we start making a program that can do simple\
    \ arithmetic let’s take a look a little closer at the details behind the operators\
    \ first. The trick with operators is to not think of them as mathematical symbols.\
    \ For instance when you see the statement\n\na = 2\n\nIt simply means that a value\
    \ of 2 is stored in your computer’s memory location that has been labeled as “a.”\
    \ Don’t try to look at it as some sort of algebraic formula. In mathematics, “a”\
    \ will be equal to 2, but that’s not how it goes in FORTRAN or in any other programming\
    \ language. Now let’s take a look at a sequence of statements like this:\n\na\
    \ = 2\n\nb = 3\n\nc = a + b\n\nIn the above sequence of statements, the value\
    \ of 2 will be stored in your computer’s memory location labeled as “a” and memory\
    \ location “b” will store the value 3\\. Finally, memory location “c” will then\
    \ add the values stored in both “a” and “b.”\n\nRemember that you can’t write\
    \ the code in this manner:\n\na + b = c\n\nWhen the compiler goes through this\
    \ line it will return an error. Note that there can only be one variable on the\
    \ left hand side of the equal sign (“=”). Some people forget that they are writing\
    \ code and sometimes shift to writing math equations. Some mathematical rules\
    \ are also applied in FORTRAN but not all of them. You should make it a point\
    \ to learn all the coding conventions as you learn more about this and other programming\
    \ languages.\n\n## 7.1 - Arithmetic Operators\n\nNot all math symbols will appear\
    \ on your keyboard. It’s also not possible to incorporate into code all the symbols\
    \ in mathematics exactly as they appear. Since that is the case, FORTRAN makes\
    \ use of its own symbols to represent certain math operands. Here are some of\
    \ them that beginners should be aware of:\n\n*   + is for plus or addition\n\n\
    *   - is for minus or subtraction\n\n*   * is for multiplication\n\n*   / is the\
    \ symbol in FORTRAN for division\n\n*   ** is the symbol used for exponentiation\n\
    \n*   () is used for brackets\n\nNote that in FORTRAN the precedence of operands\
    \ in mathematics is followed. However, you can also override the sequence of evaluating\
    \ the math operations by using brackets. As you know, in algebra, when you see\
    \ two variables side by side it denotes multiplication. That isn’t possible in\
    \ this programming language. FORTRAN compilers won’t interpret it that way. You\
    \ will still have to include the symbol for multiplication. That means coding\
    \ it this way is wrong:\n\nab\n\nIf you want to multiply the value of “a” with\
    \ that of “b” then you will have to code it like this:\n\na * b\n\nMath operations\
    \ are usually evaluated from left to right especially if the operators in question\
    \ are of equal standing in their precedence. The evaluation of exponentiation\
    \ is also done from left to right when there are consecutive exponentiations.\n\
    \nHere’s a sample code that makes use of different arithmetic operators in FORTRAN:\n\
    \nprogram mysamplemath\n\nimplicit none\n\n! this demonstrates how math operations\
    \ work\n\nreal :: a, b, c, finalanswer\n\na= 2.6\n\nb= 3.7\n\nc= 4.8\n\nfinalanswer=\
    \ a + b / c\n\nprint *,'and the answer is', finalanswer\n\nend program mysamplemath\n\
    \nAt this point you should take time to experiment with the different math operators\
    \ available in FORTRAN. You can modify the code above to include different values.\
    \ Use brackets to alter the sequence of the operations. You may even do the math\
    \ yourself first and then write the code in FORTRAN and compare the results. That\
    \ way you will have an idea how each of these operators work.\n\nMake sure to\
    \ use exponentiations as well. Remember to open new files for each change or alteration\
    \ in the code that you make and make sure to change the program name each time\
    \ you change something. That way you can trace what each code sequence will do.\
    \ Doing these exercises will also help you practice providing logical sequences\
    \ of statements or instructions.\n\n## 7.2 - Blanks (Skip Positions)"
