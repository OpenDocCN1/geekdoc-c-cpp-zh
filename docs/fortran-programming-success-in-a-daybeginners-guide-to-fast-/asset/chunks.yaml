    \n## 2.1 - 使用通用名称与特定名称\n\n在 FORTRAN 中，你可以使用通用名称（generic name）来简化函数（特别是当该函数与至少一个参数结合使用时）。诚然，它仅被应用于类型转换或包含绝对绝对值的参数上。\n\
