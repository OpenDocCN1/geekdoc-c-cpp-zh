    # 第 1 章：FORTRAN – 入门者信息


    FORTRAN（Formula Translation 的缩写）对于初学者来说实际上是一门简单的编程语言——是的，即使对于那些没有其他编程语言经验的人也是如此。学习过其他语言编写代码的人会发现
    FORTRAN 背后的思想非常容易理解。


    它实际上是世界上最老的编程语言之一。它的历史是一把双刃剑——可以说，它既是优势，也是一种诅咒。这门编程语言随处可用，你并不需要购买编译器或任何其他软件来运行代码。一旦你掌握了它，你也可以查看关于它的更高级信息。


    这实际上是一类对工程师和科学家非常有用的编程语言。它拥有庞大的内置函数集合，可以处理许多不同的数学结构——这是它作为世界上首批编程语言之一的优势之一。你可以找到大量的算法库，它们让编码变得更简单、更短。


    ## 1.1 - 开始所需的准备工作


    要在这种编程语言中开始编写代码，需要的第一个工具是文本编辑器。有些人可能会推荐 Vim、Emacs 或其他文本编辑器，但任何工具都可以。重要的是，你的源代码应该保存为纯文本文件。这意味着你不能使用文字处理软件，因为这些应用程序不会以纯文本格式保存文件——它们包含了编译器无法理解的特殊格式。


    运行 FORTRAN 还需要你需要一个编译器。现在有很多编译器，其中许多是免费的。对于绝对初学者来说，编译器是一个读取你编写的编程代码并将其翻译成机器可读代码程序（即你的计算机可以理解的内容）。在你编写并保存代码后，你必须运行编译器让你的计算机执行这些代码。


    为了让事情变得简单得多，你可能还想安装所谓的 IDE 或集成开发环境。它是一件软件程序，兼具文本编辑器和编译器的功能。IDE 有许多优点，它让编写代码和排查你编写的代码变得容易得多。


    如果你使用的是 Windows 机器，强烈建议使用 IDE，因为你会更熟悉图形用户界面。你可以根据意愿下载喜爱的 IDE，如 Photran、Plato 或任何其他开发环境。确保你熟悉它的界面，这样你就知道需要点击哪个按钮来执行代码，或者在需要逐条检查代码中的每个语句时应该进入菜单的哪个部分。


    IDE 已经理解了它们所构建的不同编程语言的语法。这意味着……


    ## 1.2 - 测试你的第一个代码


    强烈建议你安装 IDE，特别是如果你使用的是 Windows 的话。安装完成后，双击其图标启动你的编程环境。创建一个新文件。注意，你创建的文件将具有 `.f95`扩展名——而不是
    `.txt`。注意，其他文件扩展也是有效的，例如 `.FPP`、`.F`、`.FOR` 和 `.f90` 等。这些扩展指的是你的编译器所遵循的 FORTRAN
    标准。简单来说，多年来创建了许多版本的 FORTRAN，每个版本都使用不同的扩展名。在本书中我们将使用 `.f95` 扩展。在学习过程中你可以不断尝试并了解更多这门编程语言。


    之后，你需要输入以下代码：


    ```fortran

    program mytest

    ! is a test

    print *,''This is an output test''

    end program mytest

    ```


    输入这段代码后，使用你的 IDE 执行或运行它。编程环境中的编译器将检查你的代码是否有错误（它使用的是 F95 标准）。它会提示你任何错误。如果没有问题，它将生成一个可执行文件——在这种情况下它会生成
    `mytest.exe`，你可以运行它并在屏幕上显示“This is an output test”。


    ## 1.3 - 代码解析


    让我们看看刚刚执行的代码，好吗？就像世界上许多其他编程语言一样，FORTRAN 执行不同的代码行，也称为语句。我们刚刚运行的代码的第一条语句是：


    ```fortran

    program mytest

    ```


    这声明了刚刚创建的程序名称。


    ```fortran

    ! is a test

    ```


    这一行或语句被称为注释。这条语句是给程序员（你）看的。编译器不会执行注释，因为它们只是供程序员阅读的文本。程序员使用注释来描述程序某些部分的作用。在示例代码中，注释用于描述整个程序。


    ```fortran

    print *,''This is an output test''

    ```


    这是一个输出命令，告诉你的计算机显示单引号内的文本。


    最后一段代码是：


    ```fortran

    end program mytest

    ```


    '
- fmt: '

    This statement terminates the program you have just written.


    Some versions of FORTRAN will have slightly different looking code. Some are less
    complicated than others. The one above should be really easy to understand. So,
    now you have seen the structure of a simple program in FORTRAN. The ones you have
    seen include the following:


    * Program name

    * Output statements

    * End of program

    * Comment


    All programs in this standard of FORTRAN begin with the `program <name of program>`
    statement and they end with `end program <name of program>` statement, where `<name
    of program>` is a user defined value.


    The comments can be placed anywhere since they will not be executed. Note that
    statements or commands will be executed sequentially from top to bottom. You will
    have to offer a logical sequence when giving statements that your computer will
    execute.


    ## 1.4 - Dealing with Input


    Now that you have seen what an output command looks like, in the next bit of code
    you will now see how an input command works and a basic loophole that beginners
    also experience. Try the following code this time:


    ```fortran

    program sum


    implicit none


    ! this is an example of how inputs work


    real :: total, a, b


    print *, ''Please enter two single digit numbers''


    read *, a


    read *, b


    total = x + y


    print *, ''The sum of both numbers is '', total


    end program sum

    ```


    Make sure to open a new file when you write down that code. You can name it `sum.f95`
    to make it unique from the rest of the codes you will be writing. In this code
    you are introduced to two new structures. The first one is a variable, which is
    declared or created when you issue the statement:


    `real :: total, a, b`


    You actually declared (or created) 3 variables, namely `total`, `a`, and `b`.
    You can think of these variables just like the ones you use in algebra. They hold
    a value and their values can change.


    The second bit of new code you are shown here is an input statement:


    `read *, <variable>`


    Input statements await a human response. In this case, the program you wrote is
    expecting a numeric value to be entered by the computer user. A user will have
    to enter a number and then press Enter. There are 2 `read *, <variable>` statements
    in this short code. That means the user will have to enter each of the two numbers
    and hit enter once for both.


    You are also introduced to mathematical operators in this code. You have a `+`
    and an `=` in the code.


    ## 1.5 - A Few Reminders


    Remember to keep the name of your program short but it should be meaningful or
    indicate what it’s supposed to do. If you have to explain exactly what the program
    will do then use the comment line, the one that begins with an exclamation point.
    The comments are supposed to help you or other programs understand what the program
    or code is for or how it works. Note that all the text to the right of the exclamation
    point in that statement will be ignored by the FORTRAN compiler.


    Note that there are many different kinds of variables. In the declaration:


    `real :: total, a, b`


    The variables `a`, `b`, and `total` are floating point type of variables. You
    don’t need to worry about the different types of variables in FORTRAN for now.
    In this program, the `read` statement gathers information from the keyboard and
    the variables store it. You may also be wondering why there is an asterisk in
    the `print` statement:


    `print *`


    The asterisk tells the compiler to use only the default number of decimal places
    when it outputs the digits to your computer monitor. The variable `total` stores
    the sum of the values of that the user inputs using the keyboard. That’s two ways
    a variable can obtain a value, one from the keyboard and one from operators.


    Another thing about the input statement – notice that we used two of them to input
    two numbers. Another way to do that is to use the following statement syntax:


    `read *, a, b, c`


    In that piece of code the user will have to enter each of the values for the variables
    in one line. Now here’s another thing you have to know about the `print` statement.
    Check out this code:


    `print *, ''you will see three numbers'', a, b, c`


    The `print` statement can output both text and numbers or the values of your variables
    (note that some types of variables will contain text). You separate each item
    you want to output to the screen with a comma.


    ## 1.6 - Put Everything in the Right Order


    Since the compiler and your computer will execute statements and programs in sequence,
    the order of your statements should be logical. Some statements must precede others
    in order to bring about the desired results. It’s just like when you’re trying
    to start your car. You have to put your car key in, turn the engine on, and then
    drive away. If you do things in the wrong order, for instance you step on the
    gas before you put your key in, you shouldn’t expect to get very far. Now take
    a look at the sequence of the statements below:


    ```fortran

    a = b + c

    read *,c

    print *,a

    ```


    Theoretically this piece of code won’t execute. It begins with the operators using
    no values (well theoretically, your computer may assign some junk value to the
    variables just to make the code execute). The next statement reads a value for
    the variable `c` only. The last statement (i.e. the `print` statement) outputs
