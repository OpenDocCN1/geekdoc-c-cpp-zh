    ## 5.4 - Commentaries


    Comments or sections that begin with `!` ` are sections that can only be read
    in a raw program. Usually, they are unlimited in length but to not defeat the
    purpose of clarifying a statement, they are best kept concise and straight to
    the point.


    It is not simply FORTRAN; all programming languages have features that enable
    you to make commentaries that can remain invisible upon program execution. it
    follows that since you may have notes while you were writing the program, a good
    approach is to contain them within your work.


    ## 5.5 - Portability of the Kind Attribute


    A beneficial aspect of the `kind` attribute is its portability; it can be used
    with numerical values and parameters that are dependent on a particular compiler.
    Compared to other programming languages, it isn’t strict when it comes to compilers.
    Granted there’s one, you have the opportunity to execute a program.


    While its portability is advantageous, the `kind` attribute’s dependence on particular
    compilers is a downside. As it follows, it can be operated using various compilers,
    but it also requires thorough editing according to what’s acceptable and what’s
    not. If you insist on running a code written with language that is incompatible
    with a compiler, there is hardly a chance that it will work as desired. It’s either
    that, or it will return critical errors.


    ## 5.6 - What Are Streams?


    In FORTRAN, streams are the terminology used to describe the approach of writing
    a program. They emphasize the fact that outputs can be complex, but a program
    is still required to follow a certain order – or else, his program may be useless.
    Thus, for your written program to be executed as desired, the goal is to determine
    the correct way of streaming.


    Sample program (that shows the complexity of an output):


    ```fortran

    program stream_complex

    implicit none

    ! contains

    do subroutine write_stream (array)

    implicit none

    integer, in, dimension (3, 5) :: array

    integer value = 4578, pos

    open ( unit = 7 )

    write

    close

    print *, ‘This is my array’

    end subroutine write_stream (array)

    end program stream_complex

    ```


