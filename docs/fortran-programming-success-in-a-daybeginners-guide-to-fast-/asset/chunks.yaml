    program structure_sample


    implicit none


                  ! type declaration


                  type Math Class


                                character (len = 40) :: name


                                character (len = 40) :: name


                                character (len = 40) :: name


                                character (len = 40) :: name


                  end type Math Class


                  ! declaring variables


                  type (Math Class) :: column 1


                  type (Math Class) :: column 2


                  type (Math Class) :: column 3


                  type (Math Class) :: column 4


                  ! accessing structure components


                  column 1%name = Dana Caulfield


    column 2%name = Rachel Price


    column 3%name = Warren Amber


    column 4%name = Kate Victoria


                  ! display Math Class components


                  print *, Dana Caulfield


                  print *, Rachel Price


                  print *, Warren Amber


                  print *, Kate Victoria


    end program structure_sample


    Sample program (execution):


    Dana Caulfield


                  column 1


    Rachel Price


                  column 2


    Warren Amber


                  column 3


    Kate Victoria


                  column 4


    ## 4.3 - Structures with Array-Creation


    When writing a program’s structure, you have the option to create arrays. The
    results are similar but with such approach, you won’t have to specify a value
    at the later portion of the program.


    While a structure sorts data, an array does the same in a different way. With
    the combination of the two, you can have a similar product, but it’s actually
    one with a more solid foundation. Moreover, rather than simply have a record,
    what you have are organized records.


    Sample code (array creation):


    program array_and_structure


    implicit none


                  ! type declaration


                  type Math Class


                                character (len = 40) :: name


                                character (len = 40) :: name


                                character (len = 40) :: name


                                character (len = 40) :: name


                  end type Math Class


                  ! declaring variables


                  type (Math Class) :: column 1


                  type (Math Class) :: column 2


                  type (Math Class) :: column 3


                  type (Math Class) :: column 4


                  ! accessing structure components into array


                  list (1)%name = Dana Caulfield


    list (2)%name = Rachel Price


    list (3)%name = Warren Amber


    list (4)%name = Kate Victoria


                  ! display Math Class components


                  print *, list (1)%name


    print *, list (2)%name


    print *, list (3)%name


    print *, list (4)%name


    end program array_and_structure


    Sample program (execution):


    Dana Caulfield


                  column 1


    Rachel Price


                  column 2


    Warren Amber


                  column 3


    Kate Victoria


                  column 4


    ## 4.4 – Structures & Arguments


    Contained within structures are arguments. Usually, they are in the form of expressions
    or variables. In a reference, they are called ‘actual arguments’ but in corresponding
    procedures, they are acknowledged as dummy arguments.


    Arguments, both actual arguments and dummy arguments, are linked to their order
    in a list. It follows that for a program to read through the statements, the pre-defined
    values are in order. For instance, the 1st actual argument is associated to the
    1st dummy argument, the 2nd actual argument is associated to the 2nd dummy argument,
    and the 3rd actual argument is associated to the 3rd dummy argument.


    There are 2 approaches to argument declaration:


    1.  With the use of a function – it allows the elements to be defined, according
    to its argument


    Sample code:


    program arg_function


    implicit none


                  real :: a, b, c


                  a = line (1, b, c)


                  function line (1, b, const)


                                real :: line


                                real :: b, const


                                line = 1 * b + const


                  end function line


    end program arg_function


    2.  With the use of a subroutine – it swaps the elements of arrays that are contained
    within structures


    Sample program:


    program arg_subroutine


    implicit none


                  real, dimension (7) :: x, z


                                call swap (x, z)


                                subroutine swap (x, y)


                                              real, dimension (7) :: x, z, temp


                                              temp = x


                                              x = z


                                              z = temp


    end program arg_subroutine


    #   Chapter 5: The Kind Attribute & Streams


    In initial versions of FORTRAN, instead of just one, there were 2 types of “real”
    numbers: (1) the default “real” and (2) the double precision “real”. With there
    being both types, sometimes, the presentation of data can cause a breakdown. Other
    than that, it can test a program’s overall integrity. As the solution, the approach
    that a programmer would usually turn to for enhanced numeric precision is to use
    the kind attribute.


    ## 5.1 - What Are Kind Attributes?


    As mentioned, kind attributes are responsible for the opportunity to have better
    precision control. They were designed to set order and arrange data, according
    to their class. Since various kinds of elements (e.g. real numbers, real data,
    and integers) may be stored inside a program, they may eventually turn into a
    disheveled group if they are not properly categorized with the help of the function. 


    Sample code (declaration):


    program kind_attribute


    implicit none


                  real (kind = 6) :: j, k, l


                  real (kind = 7) :: m, n, o


                  integer (kind = 4) :: b, c, d


                  integer (kind = 9) :: f, g, h


                  integer :: kind_j, kind_b, kind_m, kind_f


                  kind_j = kind (j)


                  kind_b = kind (b)


                  kind_m = kind (m)


                  kind_f = kind (f)


                  print *, ‘the default kind attribute for real is’, kind_j


                  print *, ‘the default kind attribute for int is’, kind_b


                  print *, ‘the default kind attribute for real is’, kind_m


                  print *, ‘the default kind attribute for int is’, kind_f


    end program kind_attribute


    Sample program (execution):


    the default kind attribute for real is 6


    the default kind attribute for int is 4


    the default kind attribute for real is 7


    the default kind attribute for int is 9


    ## 5.2 - Determining the Size of the Kind Attribute


    Determining the size of the kind attribute is useful especially when focusing
    on single elements. If you intend to know more about the nature of your program,
    an option is to inquire using functions. Among the list of tasks you can do includes:
    determine the value of decimals, identify the numbers of bits that are required,
    and find out a number’s exponential range.


    Sample code (declaration):


    program size_kind


    implicit none


          real (kind = 6) :: j


                  real (kind = 7) :: m


                  integer (kind = 4) :: b


                  integer (kind = 9) :: f


                  print *, ‘the precision of real (6) =’, precision (j)'
