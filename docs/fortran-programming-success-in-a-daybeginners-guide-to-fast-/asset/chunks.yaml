    Some novice programmers may wonder why blanks, sometimes called skip positions,
    are included in a program. While there are others who insist on writing programs
    without them, most programmers prefer to incorporate these additional spaces to
    improve readability.


    ## 7.3 - Special Characters


    In a program, special characters are used to deliver a function. Although they
    seem rather plain, you are advised to use them accordingly. If they are combined
    with each other, there may be conditions that dictate cancellation.


    | CHARACTER | DEFINITION |

    | :--- | :--- |

    | `/` | To specify another line |

    | `‘ ‘` | To output strings |

    | `:` | To terminate a list |

    | `( )` | To categorize descriptors |


    ## 7.5 – Descriptors


    Descriptors, or better known as edit descriptors, are variables intended for specifying
    the amount of data required for conversion. It’s recommended to keep track of
    their usage since processes may not end unless a succeeding descriptor is introduced.


    | LETTER | DEFINITION |

    | :--- | :--- |

    | A | Repetition |

    | D | Digits next to decimal points |

    | E | Exponential number |

    | M | Minimum digits |

    | W | Width; total characters |


    # Chapter 8: Intrinsic Functions in FORTRAN


    You have now been introduced to some of the basic mathematical functions in FORTRAN.
    This programming language is truly at its best where mathematical computations
    are required. The following are the intrinsic functions that you can use.


    *   `tan(x)` – this function is used for tangent and it returns real numbers

    *   `atan(x)` – this function is used to compute arctangent and it also returns
    real numbers

    *   `sin(x)` – used for sine and it returns real numbers

    *   `cos(x)` – this function is used to denote cosine and it also returns real
    numbers

    *   `abs(x)` – this function is used to compute for the absolute value and it
    can return either real numbers or integers.

    *   `sqrt(x)` – is the function used for the square root of a number and it also
    returns a real number


    You can use these intrinsic functions in your calculations. Of course, FORTRAN
    has a lot of functions and listing all of them in this book will be futile. However,
    given the functions provided in this list you practice making your code including
    different variables in your calculations. You should also note that trigonometric
    functions in FORTRAN are calculated in radians.


    The following code demonstrates how sine is calculated where the user is supposed
    to enter any angle that is between 0 and 90 degrees.


    ```fortran

    program testthefunk

    !this program computes for sine

    implicit none

    real :: x,y

    print *,''Please enter an angle, It should be between 0 degrees and 90 degrees''

    read *, x

    y = 4.0*atan(1.0)

    print *,''sine of '',x,''is'',sin(x*y/180)

    end program testthefunk

    ```


    You may use other equations and tweak the code provided here. As usual you may
    also test the results of the equations and do the math yourself. If you want to
    learn the other functions that are available in FORTRAN you may consult a more
    exhaustive guide. Remember that this book is only meant to teach you the basics.


    ## 8.1 - What about Monte Carlo Simulations & Random Numbers?


    In FORTRAN, Monte Carlo simulation describes the technique of picking out random
    (yet essential) data from a bunch. It argues that a basic presentation of data
    can go a long way; it can be used to alter the possible results or intervals of
    real numbers and integers.


    The term “Monte Carlo” is associated in FORTRAN simulation since in the old days,
    particularly, back when computers were unheard of, the place Monte Carlo had a
    reputation as the go-to when it comes to obtaining data randomly. During the early
    years, many people gambled and the concept behind one of their effective money-making
    approaches was adopted in the programming language.


    ## 8.2 - The WRITE Line


    Also called WRITE statements, WRITE lines are list-directed output. They can present
    the results of batches of expressions and strings. More importantly, they are
    declared to display an output on the screen.


    What to remember about WRITE lines lines:


    *   In most cases, if their elements can’t fit in a single line, the computer
    automatically proceeds their display onto the next line

    *   Their 2nd form does not contain any variable; instead they simply introduce
    a blank line

    *   They require a new line to start


    Sample program:


    ```fortran

    program write_line

    implicit none

    real :: destination

    integer :: time

    character ( len = 30 ), parameter :: ‘The time to reach your destination is’

    target :: 3.0

    destination ::4.0

    write *, ‘target’ = ‘, target

    write *, ‘destination’ = ‘, destination

    end program write_line

    ```


    Sample program (execution):

    target = 3.0 (hours)

    destination = 4.0 (kilometers)

    The target time to reach your destination is 12.0 hours


    ## 8.3 - The READ Line


    READ lines, also called READ statements, are list-directed data. As their name
    suggests, they can read through into a stack of input values, then, have them
    converted into variables that can be read even by non-programmers.


    What to remember about READ lines:


    *   If they are presented with a list, they tend to skip a line

    *   If they need input values, a new line has to be introduced together with the
    input

    *   Their execution always begins by searching for input values and fresh input
    lines

    *   They can accommodate limited conversions

    *   They can appear on several lines

    *   They require a new line to start


    Sample program:


    ```fortran

    program read_line

    implicit none

    character ( len = 5 ) :: name1

    real :: school, height

    integer :: weight, eye

    read *, name1, school, height, weight, eye

    end program read_line

    ```


    Sample program (execution):

    name1 = Danafield

    school = Blackwell Academy

    height = 5 feet, 5 inches

    weight = 55 kilos

    eye = almond


    # Chapter 9: Conditional Statements


    So far you have been introduced to mathematical operators as well as the intrinsic
    functions in FORTRAN. In this chapter you will be introduced to a different kind
    of operator – a logical operator. This is another reason why programming is such
    fun for many people. Note that all computer programming languages have conditional
    statements or conditional operators. Consider the syntax of the sample statement:


    ```fortran

    if (x == 1) then

    print *,''turn left''

    end if

    ```


    The logical operator `==` in this example are used in conjunction with the `if...
    then... end if` statements. Note the expression following the `if` statement.
    It provides a test, which is necessary when you are trying to imply a condition.
    In this case we can assume that the variable named `x` is an integer. One of its
    values can be equal to 1.


    Interpreting this logical operation, the program is testing if the value of the
    variable is 1. The program will then check if this is true or not. If it is true
    then the statements in between the `then` and `end if` will be executed. In case
    the value of the variable `x` is not equal to 1 then the statement `print *,''turn
    left''` will not be executed.


