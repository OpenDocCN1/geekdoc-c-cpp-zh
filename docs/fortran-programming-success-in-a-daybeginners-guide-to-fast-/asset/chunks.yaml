    \ Arrays?\n\nDynamic arrays are just like typical arrays. The difference, however,\
    \ is that they are almost unreadable during the compiling process; only upon execution\
    \ can they be interpreted. Due to this, they can be a challenge if the concept\
    \ of arrays has yet to be introduced.\n\nDynamic arrays are declared with the\
    \ use of the attribute called `allocatable`. During declaration, the dimensions\
    \ have to be specified with the attribute called `allocate`. Once completed, the\
    \ attribute called `deallocate` is required to free the memory that was created.\
    \ For example, when declaring a dynamic array named `dynamic_array`, with the\
    \ dimensions 7 x 7, the program would be written as follows:\n\n```fortran\nprogram\
    \ darray\nimplicit none\ndynamic_array, dimension (:, :) :: allocatable :: darray\n\
    allocate ( darray (7, 7) )\ndeallocate dynamic_array\nend program darray\n```\n\
    \n### Dynamic Arrays Using Statements\n\nDynamic arrays can be utilized with statements.\
    \ This eliminates confusion especially if multiple arrays need to be processed.\
    \ With the opportunity for conditional arguments to be defined, it allows error-free\
    \ program execution.\n\nStatement types:\n* `Where` statement – allows use of\
    \ elements inside an array\n* `Data` statement – focuses on the processing of\
    \ multiple arrays\n\nSample code (`where` statement):\n\n```fortran\nprogram sample_where\n\
    implicit none\n          integer :: c (7, 7), i, m\n          do i = 1, 7\n  \
