    # Chapter 1: FORTRAN – Info for Starters


    FORTRAN (a contraction of Formula Translation) is actually an easy programming
    language for beginners – yes, even for those who have no prior experience in other
    programming languages. Those who have learned to code using other languages will
    find the ideas behind FORTRAN to be easy to grasp.


    It’s actually one of the oldest programming languages out there. Its age is a
    double edged sword – it’s a benefit and it’s also a curse, so to speak. This programming
    language is readily available and you don’t really have to buy a compiler or any
    other software to run your code. Once you get the hang of it, you may also check
    out more advanced information about it.


    This is actually one kind of programming language that will be very useful for
    engineers and scientists. It has a vast collection of built-in functions that
    can handle a lot of different mathematical constructs – one of the advantages
    of being one of the first programming languages in the world. You can find literal
    libraries of algorithms that make coding easier and shorter.


    ## 1.1 - What You Need to Begin


    The first thing you need in order to begin writing code in this programming language
    is a text editor. Some people might recommend Vim, Emacs, or some other text editor
    but anything will do. The important thing is that your source code should be saved
    as a plain text file. That also means you can’t use word processors because those
    applications do not save their files in plain text – they contain special formatting
    that compilers won’t understand.


    The other thing you need in order to run FORTRAN is a compiler. Now, there are
    a lot of compilers out there and many of them are free. For absolute beginners,
    a compiler is a program that reads the programming code you have written and translates
    it to machine readable code (i.e. something that your computer can understand).
    After you have written and saved your code then you will have to run a compiler
    to make your computer execute the code.


    In order to make things a lot easier, you may also want to install what is called
    an IDE or an Integrated Development Environment. It’s a piece of software program
    that works like a text editor and a compiler in one. An IDE has a lot of advantages
    and it makes coding and troubleshooting your written code much easier.


    If you’re using a Windows machine then an IDE comes highly recommended since you
    will be more familiar with a graphical user interface. You may download your preferred
    IDE such as Photran, Plato, or any other development environment as you wish.
    Make sure that you become familiar with its interface so you will know which buttons
    you need to click to execute the code or which part of the menu should you go
    to in case you need to walk through each statement in your code.


    IDE’s already understand the syntax of different programming languages that they
    were built for. That means...


    ## 1.2 - Testing Your First Code


    It is highly recommended that you install an IDE especially if you are using Windows.
    Once you have that installed, double click on its icon to launch your programming
    environment. Create a new file. Note that the file you create will have an `.f95`
    extension – not `.txt`. Note there are other file extensions that will also be
    valid such as `.FPP`, `.F`, `.FOR`, and `.f90` among others. These extensions
    refer which FORTRAN standard is being followed by your compiler. Simply put, there
    are many versions of FORTRAN that have been created through the years and each
    one of them makes use of different extensions. Throughout this book we’ll use
    the `.f95` extension. You may experiment as you go along and learn more about
    this programming language.


    After that, you need to type the following code:


    ```fortran

    program mytest

    !this is a test

    print *,''This is an output test''

    end program mytest

    ```


    After typing that small bit of code, execute or run it using your IDE. The compiler
    in your programming environment will then check your code for errors (it’s using
    the FT95 standard). It will prompt you for any errors. If it doesn’t have any
    issues then it will generate and executable file – in this case it will make `mytest.exe`,
    which you can execute to display “This is an output test” on your screen.


    ## 1.3 - Breaking Down the Code


    Let’s look at the code we just executed, shall we? Just like many other programming
    languages out there, FORTRAN executes different lines of code, also known as statements.
    The first statement in the code that we just ran is:


    ```fortran

    program mytest

    ```


    This states the name of the program that has just been created.


    ```fortran

    ! this is a test

    ```


    This line or statement is known as a comment. This statement is meant for the
    programmer (that’s you). Your compiler will not execute comments since they are
    just text that is meant for the programmer to read. Programmers use comments to
    describe what certain parts of a program is supposed to do. In this sample code,
    the comment is used to describe the entire program.


    ```fortran

    print *,''This is an output test''

    ```


    This is an output command telling your computer to display the text inside the
    single quotes.


    The last bit of code is:


    ```fortran

    end program mytest

    ```

