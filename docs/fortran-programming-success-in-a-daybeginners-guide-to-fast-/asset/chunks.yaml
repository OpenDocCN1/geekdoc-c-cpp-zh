    ## 3.7 - The Substring Search


    In FORTRAN, you are allowed to search for a substring in a series of strings.
    You can take (at least) two strings and check whether string # 1 is a substring
    of string # 2\. Conversely, you can also check whether string # 2 is a substring
    of string # 1\. It follows that when string # 1’s argument is a substring of string
    # 2’s argument, the compiler will return either zero value or an integer.


