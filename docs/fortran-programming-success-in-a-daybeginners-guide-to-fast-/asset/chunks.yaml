- fmt: "\nThe declaration of recursive procedures requires that the word `recursive`\
    \ should be called prior to a desired execution. And, as a rule, if procedures\
    \ are used recursively, the option `result` needs to be in the equation, too.\n\
    \nSample program (declaration):\n\n```fortran\nprogram call_recursive\nimplicit\
    \ none\n              integer :: m, n\n              m = 10\n              print\
    \ *, ‘ it is defined that the factorial 10 has the value’\n              n = myfactorial\
    \ (10)\n              print *, n\nend program call_recursive\n\n! computation\
    \ for factorial\nrecursive function factorial result (fac)\n! result function\n\
    implicit none\n```\n\n## 6.5 – Understanding Internal Procedures\n\nInternal procedures\
    \ work similarly to external procedures. The difference with them, however, is\
    \ that they contain internal functions.\n\nUnlike their external counterparts,\
    \ the declaration for the procedures merely requires you to specify that within\
    \ the structure, there are executable statements. For example, when declaring\
    \ internal procedures, a program would be written as follows:\n\n```fortran\n\
    program internal_procedures\nimplicit none\n! type declaration\n! executable statements\n\
    . . .\ncontains\n! internal procedures\n. . .\nend program internal_procedures\n\
    ```\n\nSample program:\n\n```fortran\nprogram internal_main\nimplicit none\nreal\
    \ :: s, t\n              s = 4.0\n              t = 5.0\n              print *,\
    \ ‘Call before swap’\n              print *, ‘s = ‘, s\n              print *,\
    \ ‘t = ‘, t\n              call swap (s, t)\n              print *, ‘Call after\
    \ swap’\n              print *, ‘s = ‘, s\n              print *, ‘t = ‘, t\n\
    contains\ninternal swap (s, t)\nreal :: s, t, temp\ntemp = s\ns = t\nt = temp\n\
    end internal swap\nend program internal_main\n```\n\nSample program (execution):\n\
    \nCall before swap\ns = 4.0\nt = 5.0\nCall after swap\ns = 5.0\nt = 4.0\n\n##\
    \ 6.6 - Procedures & Arguments\n\nDifferent discussions have emerged regarding\
    \ procedures and arguments; the most common of which gives light to the question\
    \ whether procedures can be written and used as arguments. Granted a function\
    \ is defined in the statement and an actual argument exists, the answer is YES,\
    \ PROCEDURES CAN BE CREATED AS ARGUMENTS.\n\nSample program:\n\n```fortran\nprogram\
    \ proc_arg\nimplicit none\n              interface\n                         \
    \      real function function (t)\n                                real intent\
    \ :: t\n                             end real function function\n            \
    \  end interface\n              call sub ( r, s, func (2) )\nend program proc_arg\n\
    ```\n\n## 6.7 - Modules & Procedures\n\nAlthough they are rather new to FORTRAN,\
    \ modules are important to the programming language. They were introduced to contain\
    \ heaps of elements such as data, procedures, and definitions. With them, the\
    \ substantial portions that were written using the language are accessible to\
    \ a programmer who is using another programming language.\n\nSample code:\n\n\
    ```fortran\nprogram module_1\nimplicit none\n              module module_1\n \
    \                           definitions\n                            ! contains\
    \ modules and procedures\n              end module module_1\nend program module_1\n\
    ```\n\n## 6.8 - Public & Private Modules\n\nGranted that the correct `use` statement\
    \ is declared, a module can be accessible to all audiences. However, since open\
    \ availability can herd in problem that can but a program in potential risk, it\
    \ is recommended to restrict access and limit it to variable declaration, procedures,\
    \ and statements.\n\n# Chapter 7: Manipulating Variable Amounts\n\nNow we will\
    \ learn how to manipulate variable amounts in FORTRAN. This includes learning\
    \ about arithmetic operators and how to use them in expressions. We will also\
    \ explore how to use brackets to control the order of operations.\n\nIn this chapter,\
    \ we will learn how to perform basic arithmetic operations such as addition, subtraction,\
    \ multiplication, and division. We will also learn about exponentiation. By the\
    \ end of the chapter, you should be able to write complex mathematical expressions\
    \ in FORTRAN.\n\n## 7.1 - Arithmetic Operators\n\nFORTRAN provides several arithmetic\
    \ operators used to perform mathematical calculations. These operators are used\
    \ in expressions to calculate the value of an variable. The result of the expression\
    \ can then be assigned to a variable.\n\nHere are some of the common arithmetic\
    \ operators used in FORTRAN:\n\n### Addition\n\nTo add two values, we use the\
    \ `+` operator. For example:\n\n```fortran\na = 5\nb = 3\nc = a + b\n```\n\nIn\
    \ this case, the value of `c` will be the sum of `a` and `b`.\n\n### Subtraction\n\
    \nTo subtract one value from another, we use the `-` operator. For example:\n\n\
    ```fortran\na = 5\nb = 3\nc = a - b\n```\n\nIn this case, the value of `c` will\
    \ be the difference between `a` and `b`.\n\n### Multiplication\n\nTo multiply\
    \ two values, we use the `*` operator. For example:\n\n```fortran\na = 5\nb =\
    \ 3\nc = a * b\n```\n\nIn this case, the value of `c` will be the product of `a`\
    \ and `b`.\n\n### Division\n\nTo divide one value by another, we use the `/` operator.\
    \ For example:\n\n```fortran\na = 10\nb = 2\nc = a / b\n```\n\nIn this case, the\
    \ value of `c` will be the quotient of `a` divided by `b`.\n\n### Exponentiation\n\
    \nTo raise a value to a power, we use the `**` operator. For example:\n\n```fortran\n\
    a = 2\nb = 3\nc = a ** b\n```\n\nIn this case, the value of `c` will be `a` raised\
    \ to the power of `b`.\n\n## Order of Operations\n\nIn FORTRAN, the order in which\
    \ expressions are evaluated is determined by the precedence of operators. The\
    \ default order of precedence is as follows:\n\n1. Brackets `()`\n2. Exponentiation\
    \ `**`\n3. Multiplication `*` and Division `/`\n4. Addition `+` and Subtraction\
    \ `-`\n\nIf two operators have the same precedence, they are evaluated from left\
    \ to right.\n\nFor example:\n\n```fortran\nc = 2 + 3 * 4\n```\n\nIn this case,\
    \ the multiplication `3 * 4` is performed first, and then the result is added\
    \ to `2`. So, the value of `c` will be 14.\n\nTo change the order of operations,\
    \ we use brackets `()`. For example:\n\n```fortran\nc = (2 + 3) * 4\n```\n\nIn\
    \ this case, the addition inside the brackets `(2 + 3)` is performed first, and\
    \ then the result is multiplied by `4`. So, the value of `c` will be 20.\n\n##\
    \ Using Brackets\n\nBrackets are used to group parts of an expression together.\
    \ The expression inside the brackets is evaluated first. This is a useful tool\
    \ when you want to change the default order of operations.\n\nFor example:\n\n\
    ```fortran\nc = 10 / 2 * 5\n```\n\nIn this case, the division and multiplication\
    \ have the same precedence, so they are evaluated from left to right. So, `10\
    \ / 2` is performed first, giving `5`, and then `5` is multiplied by `5`, resulting\
    \ in `25`. This is the value of `c`.\n\nIf we want to perform the multiplication\
    \ first, we use brackets:\n\n```fortran\nc = 10 / (2 * 5)\n```\n\nIn this case,\
    \ the multiplication inside the brackets `(2 * 5)` is performed first, giving\
    \ `10`, and then `10` is divided by `10`, resulting in `1`. This is the value\
    \ of `c`.\n"
