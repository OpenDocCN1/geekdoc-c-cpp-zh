    \ do\n\nend program loop_factorial\n```\n\n## 2.4 – 清晰代码的技术\n\nFORTRAN 可以用作编写令其他程序员印象深刻的程序的工具。然而，这通常并非其目的。相反，这种编程语言的主要目标，以及倾向于使用它的程序员们的目标，是尽可能清晰地表达操作和计算。\n\
    \n如何编写清晰的代码：\n\n* 仔细选择变量名。你可以使用所需的变量名，但如果可能，请使用基础且有意义的术语，而不是随机单词的堆砌。例如，选择 `function\
