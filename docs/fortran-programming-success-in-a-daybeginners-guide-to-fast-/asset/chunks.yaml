- fmt: "\nSub-strings, as their name suggests, are part of strings. They are any part\
    \ of the executed program, and they can be extracted, if the programmer wishes.\
    \ In the example, the sub-strings can be any part of the program such as the single\
    \ words This, is, Dana, and Caulfield or the entire lines “This is Dana Caulfield.”\
    \ and “I would like to give you a warm welcome.”\n\nSample program (execution):\n\
    ```\nThis is Dana Caulfield.\nI would like to give you a warm welcome.\n```\n\n\
    ### How to extract sub-strings:\n\n```fortran\nprogram substring\ncharacter (len=9)\
    \ :: substring\n  substring = ‘Hi There’\n  print *, Hi (4 : 9)\nend program substring\n\
    ```\n\n## 3.4 - Concatenation\n\nIn FORTRAN, among other languages, there’s a\
    \ term called concatenation, which is marked by the operator `//`. It is the property\
    \ that describes programs being granted links to each other. Because of the established\
    \ connections, the chief goal is either (1) to draw attention to another branch\
    \ of a more complex FORTRAN program, or (2) to build a more solid framework. In\
    \ some cases, the links involve two separate programs; usually, the subjects are\
    \ single elements.\n\nSample code (declaration):\n```fortran\nprogram string_concatenation\n\
    implicit none\n  character (len = 5) :: name\n  character (len = 50) :: announcement\n\
    \  character (len = 50) :: message\n  name = ‘Dana Caulfield’\n  announcement\
    \ = ‘This is’\n  message = ‘I would like to give you a warm welcome to Prescott\
    \ Academy!’\n  print *, announcement, name\n  print *, message\nend program string_concatenation\n\
    ```\n\nSample program (execution):\n```\nThis is Dana Caulfield.\nI would like\
    \ to give you a warm welcome to Prescott Academy!\n```\n\n## 3.5 – Trimming\n\n\
    With the `trim` function, strings can be trimmed. It cuts out unnecessary lines\
    \ and proceeds with the execution of the desired results. Since there are unsubstantial\
    \ elements in a program called trailing blanks, trimming intends to eliminate\
    \ clutter and leave only the integral portions. It allows compilers to read through\
    \ commands faster.\n\nSample program:\n```fortran\nprogram trim\nimplicit none\n\
    character (len = 30), parameter, :: name1 = “Dana”, name2= “Caulfield”\n  character\
    \ (len = 30) :: name1, name2\n  full = name1//” “//name2 ! trim\n  print *, full,\
    \ “welcomes students to Prescott Academy!”\n  print *, trim (full), “ welcomes\
    \ students to Prescott Academy!”\nend program trim\n```\n\nSample program (execution):\n\
    ```\nDana Caulfield welcomes students to Prescott Academy!\n```\n\n## 3.6 - String\
    \ Adjustments\n\nWith the `adjust` function, strings can be adjusted. Just like\
    \ with the aforementioned `trim` function, programs need modification for compilers\
    \ to operate faster and more efficiently. Instead of writing a program from scratch,\
    \ this function allows you to make quick corrections without risking its integrity.\
    \ Especially if a program is rather lengthy, the feature, which eliminates complex\
    \ analysis, comes in handy.\n\nThere are two types of adjust functions:\n1. `adjustr`\
    \ – adjusts strings on the right and modifies them as trailing blanks\n2. `adjustl`\
    \ – adjusts strings on the left and modifies them as trailing blanks\n\nSample\
    \ code:\n```fortran\nprogram adjust\nimplicit none\n  character (len = 20) ::\
    \ name2, name1\n  character (len = 20) :: announcement\n  character (len = 20)\
    \ :: message\n  name2 = ‘Caulfield’\n  name1 = ‘Dana’\n  announcement = ‘Hi! I’m’\n\
    \  message = ‘Welcome to Prescott!’\n  name = adjustr (announcement) // adjustr\
    \ (name1) // adjustr (message)\n  print *, announcement, name1, message\n  name\
    \ = adjustl (announcement) // adjustl (name1) // adjustl (message)\n  print *,\
    \ announcement, name1, message\n  name = trim (announcement) // trim (name1) //\
    \ trim (message)\n  print *, announcement, name1, message\nend program adjust\n\
    ```\n\nSample program (execution):\n```\nHi! I’m Dana Caulfield.\nWelcome to Prescott!\n\
    Hi! I’m Dana Caulfield.\nWelcome to Prescott!\nHi! I’m Dana Caulfield.\nWelcome\
    \ to Prescott!\n```\n\n## 3.7 - The Substring Search\n\nIn FORTRAN, you are allowed\
    \ to search for a substring in a series of strings. You can take (at least) two\
    \ strings and check whether string #1 is a substring of string #2. Conversely,\
    \ you can also check whether string #2 is a substring of string #1. It follows\
    \ that when string #1’s argument is a substring of string #2’s argument, the compiler\
    \ will return either zero or an integer.\n\nSample code:\n```fortran\nprogram\
    \ search\nimplicit none\n  character (len = 40) :: substring1\n  character (len\
    \ = 20) :: substring2\n  substring1 = ‘This is a search’\n  substring2 = ‘search’\n\
    \  if (index (substring1, substring2) = 0)\n    print *, ‘search is not found’\n\
    \  else\n    print *, ‘search is found at index’, index (substring1, substring2)\n\
    \  end if\nend program search\n```\n\nSample program (execution):\n```\nSearch\
    \ is found: index 13\n```\n\n## 3.8 - What Are Arrays?\n\nDo you know why you\
    \ can store data or a collection of data? The reason is the existence of arrays;\
    \ they are responsible for storing a cluster of similar elements (e.g., characters,\
    \ variables). If piles of data are not stored accordingly, it’s almost impossible\
    \ for computers to interpret them. However, granted they are properly designated,\
    \ a compiler can run a program smoothly and deliver an intended function.\n\n\
    What to remember about arrays:\n* Specifying their individual elements is done\
    \ by addressing subscripts; their first element comes with a subscript of 1\n\
    * The term `extent` describes the elements (in numerical value) along a dimension\n\
    * The term `rank` describes the dimensions (in numerical value) that they have\n\
    * The term `size` describes the elements (in numerical value) that they contain\n\
    * Their shape consists of elements\n* They are declared with the attribute `dimension`\n\
    * They are linked to contiguous memory locations\n\nThere are two types of arrays:\n\
    1. One-dimensional arrays – arrays that serve as vectors\n2. Two dimensional arrays\
    \ – arrays that serve as matrices\n\n## 3.9 - Array Declaration\n\nArray declaration\
    \ is simple. The rule is to specify a desired dimension; granted, the compiler\
    \ can determine whether the involved elements are either `real` or `integer`.\n\
    \nFor example, when declaring a one-dimensional array called `Caulfield Lair`,\
    \ which contains 7 elements, the code would be written as follows:\n```fortran\n\
    real, dimension (7) :: Caulfield Lair\n```\n\nFor example, when declaring a two-dimensional\
    \ array called `Caulfield Lair`, which contains 7 x 7 elements, the program would\
    \ be written as follows:\n```fortran\ninteger, dimension (7, 7) :: Caulfield Lair\n\
    ```\n\n## 3.10 - Value Assignment in Arrays\n\nValue assignment involving arrays\
    \ is almost effortless; you simply have to enter an amount. It can be done by\
    \ addressing an entire array, or as recommended, an individual element.\n\nFor\
    \ example, when assigning the value `3.0` to all 7 elements in the array called\
    \ `Caulfield Lair`, the program would be written as follows:\n```fortran\ndo i\
    \ = 1, 7\n  Caulfield Lair = i * 3.0\nend program do\n```\n\nFor example, when\
    \ assigning the value `3.0` to the first element of the array called `Caulfield\
    \ Lair`, the program would be written as follows:\n```fortran\nCaulfield Lair\
    \ (1) = 3\n```\n\nSample code (for array declaration and value assignment):\n\
    ```fortran\nprogram array\nimplicit none\n  real :: Caulfield Lair (7) ! one-dimensional\
    \ array\n  integer :: Caulfield Lair (7, 7) ! two-dimensional array\n  ! value\
    \ assignment to one-dimensional array\n  do i = 1, 7\n    Caulfield Lair (i) =\
    \ i * 3.0\nend program do\n  ! value display for one-dimensional array\n  do i\
    \ = 1, 7\n    print *, Caulfield Lair (i)\n```\n"
