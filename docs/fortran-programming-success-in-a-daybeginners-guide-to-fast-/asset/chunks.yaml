    \ 2.3 – 循环\n\n在 FORTRAN 中，与所有的编程语言一样，循环是最重要的概念之一。通过循环，允许重复某些过程。如果你计划编写一个简单但很长的程序，你会发现这非常有用。与其至少设置两次相同的指令，你只需要设置一次即可按所需的次数执行该函数。\n\
    \n循环的组成部分：\n\n* `Step` – 意味着过程需要重复的组件\n* `Start` – 标记循环的开始\n* `Stop` – 标记循环的结束\n\
    * `Var` – 变量；意味着过程需要重复的次数\n\n循环如何工作？\n\n循环在设置 `start` 并定义 `var` 时初始化。它们利用了这样一个概念：`var`\
