  raw: 'The following is a bit of programming convention. It has no direct effect
    on how a compiler will translate your code. Take a look at how the previous code
    is written below:


    if  (x == 1) then 


    print *,''turn left''


    !do you notice anything


    end if


    Well, other than the comment line that was added, you will also notice that the
    statements in between the ‘if’ statement and the ‘end if’ statement have been
    indented. Yes, even the comment was indented as well. This is another programming
    convention or practice. It’s pretty common in many programming languages including
    the ones that make use of a top down design.


    Making these indentations make the code more readable to a human being. By that
    you will know that the indented statements are somewhat embedded within the ‘if…’
    – ‘end if statement.’


    You have already been introduced to other programming conventions earlier in this
    book. For instance, you have been encoding the statement ‘implicit none’ when
    dealing with variables and you even place it at the very beginning of your code.
    You have also been instructed that comments should be helpful to the reader of
    your code. The variable names that you choose in your code should make sense and
    be meaningful. The prompts that you display on the screen should help the user
    figure out what types of data is expected as input. Remember that making your
    program work isn’t the only important thing in programming, especially in FORTRAN.
    The way you code also speaks a lot about how well versed you are as a programmer.
    These conventions have been proven to make the work of coding and troubleshooting
    code a lot easier.


    ## 9.2 - Solving Logical Problems with Logic Operators


    You can actually write a series of logical operators to help the program figure
    out what action it is to take next. In the examples that have been provided in
    this book, a huge portion of the success of these logic operators depends on the
    user and his ability to input the correct response. Most of the time, you will
    give the user several options on the screen. Unfortunately, it doesn’t matter
    how well you have crafted the prompts in your code, some users still enter the
    wrong type of data. They may also enter a value that isn’t one of the options
    you have indicated in your prompts.


    To solve this dilemma, you may craft your if-then statements this way:


    if  (userinput == 1) then


    <the program will execute certain set of statements>


    else if  (userinput == 2) then


    <the program will execute certain set of statements>


    else


    <execute these statements if the user entered something else>


    end if


    This statement is actually a new structure in FORTRAN. This statement makes use
    of ‘if-else-end if’ to cancel out the possibility that the user will enter anything
    else other than the desired result. This is also especially useful when you want
    to be able to control the next statements that will be executed when equations
    may provide different results.


    Another bit of info that you should also know is that you can embed conditional
    statements within conditional statements. You can do that to test for a specific
    value or a specific type of condition. Just make sure that you arrange the code
    with proper indentation or else you some of  your if-statements will not have
    either an else-if or else-statement to pair with it. Your compiler will definitely
    return an error when such a mistake in syntax occurs.


    ## 9.3 - More Logical Operators


    Of course there are more logical operators in FORTRAN other than the “==” or test
    for equality. The following are the other logical operators that you can use when
    crafting your codes:


    | not equal to | /= |


    | less than | < |


    | greater than | > |


    | greater than or equal  to | >= |


    | less than/equal to | <= |


    Here is a sample code using different logical operators. This one actually makes
    use of multiple conditions where one conditional statement is embedded in another:


    if  (a > b) then


    if  (x <= y) then


    <perform these statements>


    end  if


    end  if


    Another construct that you can use in logical operations is “.and.” which you
    can use to satisfy different conditions. Consider the following example:


    if  (a == b .and. c < d) then


    <perform these statements>


    end  if


    # Conclusion


    Thank you again for downloading this book! 


    I hope this book was able to help you to understand the basics in FORTRAN programming.


    The next step is to practice the codes and make your first few programs. You should
    also test them and troubleshoot potential issues that may arise using your compiler.


    Finally, if you enjoyed this book, please take the time to share your thoughts
    and post a review on Amazon.  It’d be greatly appreciated!


    Thank you and good luck!


