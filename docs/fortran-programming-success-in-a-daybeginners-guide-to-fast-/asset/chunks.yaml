  trans: "\n\n以下是一些编程规范。它们对编译器如何翻译你的代码没有直接影响。请看下方的代码是如何编写的：\n\n```\nif  (x == 1) then\
    \ \nprint *,'turn left'\n!do you notice anything\nend if\n```\n\n嗯，除了添加了注释行外，你还会注意到\
    \ `if` 语句和 `end if` 语句之间的语句都经过了缩进。是的，甚至注释也都被缩进了。这是另一种编程规范或做法。这在许多编程语言中（包括那些使用自顶向下设计的语言）中非常常见。\n\
    \n通过这些缩进，代码对人类来说更易于阅读。通过这一点，你会知道缩进的语句在程度上嵌入了 `if...` – `end if` 语句之中。\n\n在本书的前面的部分，你已经接触过其他的编程规范。例如，在处理变量时，你编码了\
    \ `implicit none` 语句，甚至将其放在了代码的最开始。你还被告知注释应该对代码的阅读者有所帮助。你在代码中选择的变量名应该是通顺且有意义的。你在屏幕上显示的提示（prompts）应该帮助用户确定期望什么类型的数据输入。记住，让你的程序运行并不是编程中唯一重要的事情，特别是在\
    \ FORTRAN 中。你的编码方式也很大程度上反映了你作为一个程序员的熟练程度。这些规范被证明让编码和调试代码的工作变得简单得多。\n\n## 9.2 -\
    \ 使用逻辑运算符解决逻辑问题\n\n你实际上可以编写一系列逻辑运算符，帮助程序确定下一步要采取什么操作。在本书提供的示例中，这些逻辑运算符的成功很大程度上取决于用户及其输入正确响应的能力。大多数情况下，你会在屏幕上给用户提供几个选项。遗憾的是，无论你在代码中编写的提示有多有多完美，某些用户仍然会输入错误类型的数据。他们还可能输入一个并非你在提示中列出的选项之外的值。\n\
    \n为了解决这个困境，你可以按照如下方式编写你的 `if-then` 语句：\n\n```\nif  (userinput == 1) then\n<程序将执行一组语句>\n\
    else if  (userinput == 2) then\n<程序将执行一组语句>\nelse\n<如果用户输入了其他内容，则执行这些语句>\nend\
    \ if\n```\n\n该语句在 FORTRAN 中实际上是一个新结构。该语句利用 `if-else-end if` 来消除用户输入除所需结果之外任何其他可能性。当你希望在方程可能提供不同结果时能够控制后续将执行的语句时，这特别有用。\n\
    \n另一个你也应该知道的信息是，你可以在条件语句中嵌套条件语句。你可以这样做来测试特定的值或特定类型的条件。只需确保你通过适当的缩进来排列代码，否则你的一些\
    \ `if` 语句将没有 `else-if` 或 `else` 语句可以与之配对。当发生此类语法错误时，你的编译器肯定会返回错误。\n\n## 9.3 -\
    \ 更多逻辑运算符\n\n当然，FORTRAN 中除了 `==` 或测试等等的运算符外，还有更多逻辑运算符。以下是你在编写代码时可以使用的其他逻辑运算符：\n\
    \n| 不等于 | /= |\n| :--- | :--- |\n| 小于 | < |\n| 大于 | > |\n| 大于等于 | >= |\n| 小于等于\
    \ | <= |\n\n这里是一个使用不同逻辑运算符的示例代码。这段代码实际上使用了多个条件，其中一个条件语句嵌套在另一个语句之中：\n\n```\nif\
    \  (a > b) then\nif  (x <= y) then\n<执行这些语句>\nend  if\nend  if\n```\n\n你可以在逻辑操作中使用的另一个构造是\
    \ `.and.`，你可以用它来满足不同的条件。考虑以下示例：\n\n```\nif  (a == b .and. c < d) then\n<执行这些语句>\n\
    end  if\n```\n\n## 结论\n\n再次感谢下载本书！\n\n希望这本书能够帮助你理解 FORTRAN 编程的基础知识。\n\n下一步是练习代码并编写你的前几个程序。你还应该对它们进行测试，并使用你的编译器排除可能出现的潜在问题。\n\
    \n最后，如果你喜欢这本书，请花时间分享你的想法并在 Amazon 上发表评论。我们将不胜感激！\n\n感谢你并祝你好运！\n\n![thank-you](img/00001.jpeg)\n\
    \n点击此处在 amazon.com 上发表评论\n{\nprintf( \"Hello!\\n\" );\ngetchar();\nreturn 0;\n\
    }\n```\n\n正如第一行所示，代码使用了 `#include` 指令包含 `stdio.h`。在这种情况下，`stdio.h` 将为你提供函数 `printf`\
    \ 和 `getchar`。\n\n### Main 声明\n\n之后，第二行包含 `int main()`。此行告诉编译器存在名为 `main` 的函数。`int`\
    \ 表示 `main` 函数将返回一个整数。\n\n### 大括号\n\n接下来的一行包含大括号。在 C 编程中，大括号表示代码块的开始和结束。代码块是连接在一起的一系列代码。当程序调用一个函数时，其内部的所有代码行都将被执行。\n\
    \n### Printf()\n\n紧跟左大括号的 `printf` 函数是 `main` 函数中的第一行代码。像 `main` 函数一样，`printf`\
    \ 内部也包含一个代码块，由于你在程序中包含了 `<stdio.h>`，它是已经创建。`printf` 函数的功能是将文本打印到程序的显示窗口中。\n\n\
    `printf` 旁边是你想要打印的值或文本。它应该放在括号内以符合规范。代码想要打印的值是 Hello World! 为了确保 `printf` 识别你想打印的是字符串并正确显示文本，它应该包含在双引号内。\n\
    \n顺便说一下，在编程中，单个字符被称为字符，而字符序列被称为字符串。\n\n"
