    the way, a function is a collection of action that aims to achieve one or more
    goals. For example, a vegetable peeler has one function, which is to remove a
    skin of a vegetable. The peeler is composed of parts (such as the blade and handle)
    that will aid you to perform its function. A C function is also composed of such
    components and they are the lines of codes within it.


    Also, take note that in order to make your coding life easier, you will need to
    include some prebuilt headers or functions from your compiler.


    To give you an idea on what C code looks like, check the sample below:


    #include <stdio.h>


    int main()


    {


    printf( "Hello World!\n" );


    getchar();


    return 0;


    }


    As you can see in the first line, the code used the #include directive to include
    the stdio.h in the program. In this case, the stdio.h will provide you with access
    to functions such as printf and getchar.


    ## Main Declaration


    After that, the second line contains int main(). This line tells the compiler
    that there exist a function named main. The int in the line indicates that the
    function main will return an integer or number.


    ## Curly Braces


    The next line contains a curly brace. In C programming, curly braces indicate
    the start and end of a code block or a function. A code block is a series of codes
    joined together in a series. When a function is called by the program, all the
    line of codes inside it will be executed.


    ## Printf()


    The printf function, which follows the opening curly brace is the first line of
    code in your main function or code block. Like the function main, the printf also
    have a code block within it, which is already created and included since you included
    <stdio.h> in your program. The function of printf is to print text into your program’s
    display window.


    Beside printf is the value or text that you want to print. It should be enclosed
    in parentheses to abide standard practice. The value that the code want to print
    is Hello World!. To make sure that printf to recognize that you want to print
