    ## 5.3 - Obtaining the Value of the Kind Attribute


    FORTRAN is one of the very few programming languages that allow you to obtain
    the `kind` attribute’s value. With this, you can acknowledge even decimal digits
    of an element. Rather than generalize, which is somehow “a vague value”, you can
    be more specific.


