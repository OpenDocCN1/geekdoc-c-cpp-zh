  trans: "\n\n结构组件是结构中的单个元素，例如之前定义的三个要素：数据类型、数据和结束类型。在满足要求后，你可以使用 `%` 为每个组件分配值。因此，你可以访问结构的部分，如果结果存疑，你只需查找这些成员，而无必遍历整个程序。例如，下方\
