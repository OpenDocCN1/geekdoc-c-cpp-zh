    * 编写一个在创建一年后你仍然能理解的程序\n\n## 2.5 - 拆分表达式\n\n你也可以在 FORTRAN 中拆分表达式。这不仅提高了可读性，还能让程序顺利执行。如果出现算术错误，程序员可以更快地修改，而不需要修改整个程序。例如，为了获取复杂表达式的平方根，程序将如下所示：\n\
