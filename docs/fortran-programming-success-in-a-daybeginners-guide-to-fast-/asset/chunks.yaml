    \ for factorial\n\nrecursive function factorial result (fac)\n\n! result function\n\
    \nimplicit none\n\n## 6.5 – Understanding Internal Procedures\n\nInternal procedures\
    \ work similarly to external procedures. The difference with them, however, is\
    \ that they contain internal functions.\n\nUnlike their external counterparts,\
