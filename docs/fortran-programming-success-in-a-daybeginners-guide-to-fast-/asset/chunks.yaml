    to express operations and computations as clearly as possible.


    How to write clearly:


    *   Choose variable names carefully. You can use a desired variable name but if
    you can, go for a basic and meaningful term, instead of a clash of random words.
    For instance, it’s better to opt for “function change” or “change_in_function”,
    than “fcaodksl”


    *   Make use of spaces or underscores to separate words


    *   Write a concise program name


    *   Write a program that you can still understand come a year from its creation


    ## 2.5 - Splitting Expressions


    You can also split express in FORTRAN. Not only does it improve readability, it
    allows the program to be executed smoothly. Should there be arithmetic errors,
    a programmer can modify faster, compared to having to modify an entire program.
    For example, to get the square root of a complex expression, the program would
    be written as follows:


    t1 = ( d *f + t )


    t2 = log ( f * g)


    t3 = ( 1.2 * 8m )


    result = t1 + (t2 / t3)


    result = sqrt


    If the expression isn’t split, the code would be read as follows:


    sqrt { [ (d * f ) + t ] + [ log (f * g)  / (1.2 + 8m)] }


    ## 2.6 – Identifiers


    In FORTRAN, identifiers are words or a set of words that highlight a unique object.
    They can be in the form of alphabets, numbers, alphanumeric characters, or underscores;
    they can be chosen for a purpose or they can be arbitrary.


    Identifiers are known to introduce, data, arguments, or even entire programs.
    They are integral parts of a program even if they may sometimes just a fraction
    of the length of an entire program. In some programming languages, their use is
    quite strict; they must adhere to a certain format. In FORTRAN, however, all that’s
    required is to have them declared.


    What to remember about identifiers:


    *   In FORTRAN, they can take the form of keywords since the programming language
    does not have a list of reserved words


    *   In FORTRAN, they are not case-sensitive; for instance, the identifier “program”
    is acknowledged the same way with the identifiers “PROGram”, “pRoGrAm” and “program”


    *   In FORTRAN, they are not supposed to go over 31 characters in length


    *   They can be presented in a combination of alphanumeric characters and underscores
    but their 1st character should be a letter


    *   They cannot contain spaces or any other symbol, except for an underscore


    Examples of correct identifiers:


    *   programming


    *   program_64


    *   program_function


    *   the_program


    Examples of incorrect identifiers:


    *   _programming


    *   64th_program


    *   program # 64


    *   Program-function


    *   The program should not be written today; nor tomorrow


    # Chapter 3: Strings, Arrays & Dynamic Arrays


    Because of strings, arrays, and dynamic arrays, all sorts of programs written
    with the use of FORTRAN are organized. Especially if the job was passed on over
    to you from another programmer [i.e. you are required to analyze previous progress
    to produce (at least) a workable output], you may find the take-over rather challenging.


    Whether the nature of the desired result is quite fundamental or there’s an association
    with a lineup of complexities, FORTRAN functions can be executed as expected.
    As the rule follows, a certain sequence needs to be followed for a program to
    pull through. Due to the programming language’s approach of sorting out elements,
    instead of merely processing them as they are, order is employed, which results
    in the best possible outcome.


    ## 3.1 - What Are Strings?


    In FORTRAN, all characters are perceived as two elements namely: (1) single characters
    and (2) contiguous strings.


    What makes contiguous strings differ from single characters?


    *   Their length (for syntax declaration) is passed


    *   They allow substring notation


    *   They do not allow array notation


    *   They may contain descriptors


    *   They may contain hidden arguments


    ## 3.2 - String Declaration


    In FORTRAN, the rules for string declaration are similar to the rules applied
    to the declaration of other variables. As it follows, for the declaration of the
    string with an assigned length of 10:


    specifier :: variable_name


    character (len = 10) :: name


