    # Chapter 6: Procedures – Sub-Routines & External Functions


    Previously covered were `intrinsic functions` and `statement functions` – both
    of which are types of procedures. So far, you learned that with the use of the
    programming language, there are boundaries that you need to keep in mind; however,
    if you are willing to explore and try various possibilities, you can yield unfamiliar
    yet substantial results.


    In this chapter, `subroutines` and `external functions` will be discussed; collectively,
    they are called procedures. Just like `intrinsic functions` and `statement functions`,
    they grant you the chance to peek at the more interesting side of programming.


    ## 6.1 - What Are Procedures?


    Procedures are a bundle of statements that can execute a task. You simply need
    to define data systematically and it will perform functions in a specified order.
    They can be presented in the form of a basic statement or be expressed in a multitude
    of arguments.


    The process of writing procedures is a lengthy one; you need to be cautious since
    it’s usually a program that you are unable to modify. If a problematic line was
    submitted, the entire program may be affected.


    What to remember about procedures:

    - Assign the value `in` to input values in a procedure

    - Assign the value `inout` to used and/or arguments in a procedure

    - Assign the value `out` to output values in a procedure


    2 other types:

    1. `Subroutines` – procedures that are defined in `sub-routine sub-programs`

    2. `External functions` – procedures that are defined in `external functions sub-programs`


    ## 6.2 - Understanding Sub-Routines


    `Subroutines` are procedures that are usually defined in `sub-routine sub-programs`.
    However, they can also defined by other means. Due to this, they are among the
    areas of a procedure that can be sent for modification. To introduce them to a
    program, the `call` statement needs to be in order.


    Sample program (declaration):


    ```fortran

    program call_subroutine

    implicit none

    real :: s, t

    s = 4.0

    t = 5.0

    print *, ‘Call before swap’

    print *, ‘s = ‘, s

    print *, ‘t = ‘, t

    call swap (s, t)

    print *, ‘s = ‘, s

    print *, ‘t = ‘, t

    end program call_subroutine

    ```


    Sample program (execution):

    `Call before swap`

    `s = 4.0`

    `t = 5.0`

    `After swap`

    `s = 5.0`

    `t = 4.0`


    ## 6.3 - Understanding External Procedures


    External procedures are procedures that contained outside the program. It follows
    that although they hold a task that either (1) cannot be found within structures
    or (2) are out of bounds, they can assign values to a program.


    The declaration for the procedures merely requires you to specify that within
    the structure, there are no. For example, when declaring external procedures,
    a program would be written as follows:


    ```fortran

    program external_procedures

    implicit none

    ! type declaration

    ! no executable statements

    external procedures

    end program external_procedures

    ```


    Sample program:


    ```fortran

    program external_main

    implicit none

    real :: s, t

    s = 4.0

    t = 5.0

    print *, ‘Call before swap’

    print *, ‘s = ‘, s

    print *, ‘t = ‘, t

    call swap (s, t)

    print *, ‘After swap’

    print *, ‘s = ‘, s

    print *, ‘t = ‘, t

    contains

    external swap (s, t)

    real :: s, t, temp

    temp = s

    s = t

    t = temp

    end external swap

    end program external_main

    ```


    Sample program (execution):

    `Call before swap`

    `s = 4.0`

    `t = 5.0`

    `After swap`

    `s = 5.0`

    `t = 4.0`


    ## 6.4 – Understanding Recursive Procedures


    Recursive procedures are procedures that call themselves – be it directly or indirectly.
    They tend to repeat processes over to perform a specified task. Although they
    may be written repeatedly, each included element is integral to the entire program.

