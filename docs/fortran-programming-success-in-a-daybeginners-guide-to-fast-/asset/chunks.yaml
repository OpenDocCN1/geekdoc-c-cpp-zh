    \ kind 属性来增强精度。\n\n## 5.1 - 什么是 Kind 属性？\n\n如所述，kind 属性负责提供更好的精度控制。它们被设计用于根据类别设置顺序并排列数据。由于各种类型的元素（例如实数数据和整数）可能存储在程序中，如果没有函数的帮助进行正确分类，它们最终会变得杂乱。\n\
