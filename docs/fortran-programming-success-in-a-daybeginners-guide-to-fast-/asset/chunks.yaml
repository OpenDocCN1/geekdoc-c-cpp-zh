    \ (7) :: x, z\n    call swap (x, z)\n    subroutine swap (x, y)\n        real,\
    \ dimension (7) :: x, temp\n        temp = x\n        x = z\n        z = temp\n\
    end program arg_routine\n```\n\n# 第 5 章：Kind 属性与流 (Streams)\n\n在 FORTRAN 的早期版本中，`real`\
