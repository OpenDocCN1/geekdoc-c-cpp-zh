  trans: "\n\n递归过程的声明要求在执行所需的操作之前调用 `recursive` 关键字。而且通常情况下，如果递归使用了过程，`result` 选项也需要出现在方程中。\n\
    \n示例程序（声明）：\n\n```fortran\nprogram call_recursive\nimplicit none\n           \
    \   integer :: m, n\n              m = 10\n              print *, ‘ it is defined\
    \ that the factorial 10 has the value’\n              n = myfactorial (10)\n \
    \             print *, n\nend program call_recursive\n\n! 阶乘计算\nrecursive function\
    \ factorial result (fac)\n! 结果函数\nimplicit none\n```\n\n## 6.5 – 理解内部过程\n\n内部过程的工作方式与外部过程类似。然而，它们的区别在于内部过程包含了内部函数。\n\
    \n与外部对应项不同，过程的声明只需要你指定在该结构内部存在可执行的语句。例如，在声明内部过程时，程序的编写方式如下：\n\n```fortran\nprogram\
    \ internal_procedures\nimplicit none\n! 类型声明\n! 可执行语句\n. . .\ncontains\n! 内部过程\n\
    . . .\nend program internal_procedures\n```\n\n示例程序：\n\n```fortran\nprogram internal_main\n\
    implicit none\nreal :: s, t\n              s = 4.0\n              t = 5.0\n  \
    \            print *, ‘Call before swap’\n              print *, ‘s = ‘, s\n \
    \             print *, ‘t = ‘, t\n              call swap (s, t)\n           \
    \   print *, ‘Call after swap’\n              print *, ‘s = ‘, s\n           \
    \   print *, ‘t = ‘, t\ncontains\ninternal swap (s, t)\nreal :: s, t, temp\ntemp\
    \ = s\ns = t\nt = temp\nend internal swap\nend program internal_main\n```\n\n\
    示例程序（执行）：\n\nCall before swap\ns = 4.0\nt = 5.0\nCall after swap\ns = 5.0\nt =\
    \ 4.0\n\n## 6.6 - 过程与参数\n\n关于过程和参数已经出现了不同的讨论；其中最常见的是阐明了过程是否可以作为参数编写和使用的问题。在假设语句中定义了函数且存在实际参数的情况下，答案是肯定的，**过程可以创建创建参数**。\n\
    \n示例程序：\n\n```fortran\nprogram proc_arg\nimplicit none\n              interface\n\
    \                               real function function (t)\n                 \
    \               real intent :: t\n                             end real function\
    \ function\n              end interface\n              call sub ( r, s, func (2)\
    \ )\nend program proc_arg\n```\n\n## 6.7 - 模块与过程\n\n虽然模块对于 FORTRAN 来说比较新，但它们对这种编程语言是非常重要的。引入模块是为了包含大量的元素，如数据、过程和定义。有了了模块，使用另一种编程语言的程序员也可以访问使用语言编写的大部分内容。\n\
    \n示例代码：\n\n```fortran\nprogram module_1\nimplicit none\n              module module_1\n\
    \                            definitions\n                            ! 包含模块和过程\n\
    \              end module module_1\nend program module_1\n```\n\n## 6.8 - 公有与私有模块\n\
    \n只要声明了正确的 `use` 语句，模块对所有用户可见。然而，由于开放可用可能会带来给程序带来潜在风险的问题，建议限制访问并将其限制在变量声明、过程和语句上。\n\
    \n# 第 7 章：操作变量数量\n\n现在我们将学习如何在 FORTRAN 中操作变量数量。这包括学习算术运算符以及如何在表达式中使用它们。我们还将探索如何使用括号来控制操作顺序。\n\
    \n在本章中，我们将学习如何执行基础算术运算，如加、减、乘、除。我们还将学习幂运算。在本章结束时，你应该能够能够在 FORTRAN 中编写复杂的数学表达式。\n\
    \n## 7.1 - 算术运算符\n\nFORTRAN 提供了几种用于数学计算的算术运算符。这些运算符用于表达式中计算变量的值。表达式的结果可以赋值给变量。\n\
    \n以下是 FORTRAN 中常用的一些算术运算符：\n\n### 加法\n\n要两个两个值，我们使用 `+` 运算符。例如：\n\n```fortran\n\
    a = 5\nb = 3\nc = a + b\n```\n\n在这种情况下，`c` 的值将是 `a` 和 `b` 之和。\n\n### 减法\n\n要从一个值减去另一个值，我们使用\
    \ `-` 运算符。例如：\n\n```fortran\na = 5\nb = 3\nc = a - b\n```\n\n在这种情况下，`c` 的值将是 `a`\
    \ 和 `b` 之差。\n\n### 乘法\n\n要两个两个值，我们使用 `*` 运算符。例如：\n\n```fortran\na = 5\nb = 3\n\
    c = a * b\n```\n\n在这种情况下，`c` 的值将是 `a` 和 `b` 之积。\n\n### 除法\n\n要将一个值除以另一个值，我们使用\
    \ `/` 运算符。例如：\n\n```fortran\na = 10\nb = 2\nc = a / b\n```\n\n在这种情况下，`c` 的值将是\
    \ `a` 除以 `b` 的商。\n\n### 幂运算\n\n要将一个值提升为幂，我们使用 `**` 运算符。例如：\n\n```fortran\na =\
    \ 2\nb = 3\nc = a ** b\n```\n\n在这种情况下，`c` 的值将是 `a` 的 `b` 次方。\n\n## 顺序\n\n在 FORTRAN\
    \ 中，表达式求求顺序是由运算符优先级决定的。默认优先级如下：\n\n1. 括号 `()`\n2. 幂运算 `**`\n3. 乘法 `*` 和 除法 `/`\n\
    4. 加法 `+` 和 减法 `-`\n\n如果两个运算符具有相同的优先级，它们将从左到右求值。\n\n例如：\n\n```fortran\nc = 2 +\
    \ 3 * 4\n```\n\n在这种情况下，先执行乘法 `3 * 4`，然后将结果加上 `2`。因此，`c` 的值将是 14。\n\n为了改变操作顺序，我们使用括号\
    \ `()`。例如：\n\n```fortran\nc = (2 + 3) * 4\n```\n\n在这种情况下，括号内的加法 `(2 + 3)` 先执行，然后将结果乘以\
    \ `4`。因此，`c` 的值将是 20。\n\n## 使用括号\n\n括号用于将表达式的部分组合。括号内的表达式先求值。当你想要改变默认的操作顺序时，这是一个很有工具。\n\
    \n例如：\n\n```fortran\nc = 10 / 2 * 5\n```\n\n在这种情况下，除法和乘法具有相同的优先级，因此它们从左到右求值。所以先执行\
    \ `10 / 2`，得到 `5`，然后将 `5` 乘以 `5`，得到 `25`。这就是 `c` 的值。\n\n如果我们想先执行乘法，就使用括号：\n\n\
    ```fortran\nc = 10 / (2 * 5)\n```\n\n在这种情况下，括号内的乘法 `(2 * 5)` 先执行，得到 `10`，然后将 `10`\
    \ 除以 `10`，得到 `1`。这就是 `c` 的值。\n\n"
