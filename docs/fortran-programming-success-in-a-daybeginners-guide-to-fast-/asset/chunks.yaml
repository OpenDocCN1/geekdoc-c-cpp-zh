    # Chapter 9: Conditional Statements


    So far you have been introduced to mathematical operators as well as the intrinsic
    mathematical functions in FORTRAN. In this chapter you will be introduced to a
    different kind of operator – a logical operator. This is another reason why programming
    is such fun for many people. The codes that you have been exposed so far make
    your computer act like a calculator. However, it actually has a lot more computing
    power than that. Based on different conditions, your computer can also make decisions.
    This is where logical operators come into play. Note that all computer programming
    languages have conditional statements or conditional operators.


    Consider the syntax of the sample statement below:


    if  (x == 1) then 


    print *,''turn left''


    end if


    The logical operator “==” in this example are used in conjunction with the statements
    “if… then… end if” statements. Note the expression following the “if” statement.
    It provides a test, which is necessary when you are trying to imply a condition.
    In this case we can assume that the variable named “x” is an integer. One of its
    values can be equal to 1.


    Interpreting this logical operation, the program is testing if the value of the
    variable is 1\. The program will then check if this is true or not. If it is true
    then the statements in between the statements “then” and “end if” will be executed.
    In case the value of the variable “x” is not equal to 1 then the statement print
    *,''turn left'' will not be executed.


    Note that in the syntax of the statement if (<value> == <value>), there is no
    space in between the two equal signs in this logical operator. Putting a space
    in between these two equal signs will make any compiler return an error in the
    statement’s syntax. The “end if” statement terminates the condition initiated
    by the “if” statement preceding it.


