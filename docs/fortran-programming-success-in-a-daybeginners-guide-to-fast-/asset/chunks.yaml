    ## 3.6 - String Adjustments


    With the “adjust” function, strings can be adjusted. Just like with the aforementioned
    “trim” function, programs need modification for compilers to operate faster and
    more efficiently. Instead of writing a program from scratch, this function allows
    you to make quick corrections without risking its integrity. Especially if a program
    is rather lengthy, the feature, which eliminates complex analysis, comes in handy.


    There are two types of adjust functions:


    1.  adjustr – adjusts strings on the right and modifies them as trailing blanks


    2.  adjustl – adjusts strings on the left and modifies them as trailing blanks


    Sample code:


    program adjust


