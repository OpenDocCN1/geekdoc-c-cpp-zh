    本书专为初学者设计，特别是那些刚开始编写代码的人。FORTRAN 是世界上最老的编程语言之一。它是一门高级语言，让初学者很容易理解。该语言的结构和语法也非常容易掌握。书中还有专门的章节向你展示如何准确利用所学知识编写出可以处理你输入的变量的代码。


    然而，请记住，这本书仅包含最基础的内容。在你掌握了这些内容之后，你需要参考更详细的说明手册来探索这门编程语言的全部潜力。


