  trans: "\n\n子字符串（Sub-strings）顾其名，是字符串的一部分。它们是执行程序中的任何部分，如果程序员需要，就可以对它们进行提取。在示例中，子字符串可以是程序的任何部分，例如单个单词\
    \ This、is、Dana 和 Caulfield，也可以是整行字符串“This is Dana Caulfield.”和“I would like to\
    \ give you a warm welcome.”。\n\n示例程序（执行）：\n```\nThis is Dana Caulfield.\nI would\
    \ like to give you a warm welcome.\n```\n\n### 如何提取子字符串：\n\n```fortran\nprogram\
    \ substring\ncharacter (len=9) :: substring\n  substring = ‘Hi There’\n  print\
    \ *, Hi (4 : 9)\nend program substring\n```\n\n## 3.4 - 拼接\n\n在 FORTRAN 等其他语言中，有一个称为“拼接”（concatenation）的术语，它由运算符\
    \ `//` 标记。它是描述程序之间被授予相互链接的属性。由于已建立的连接，主要目标是 (1) 关注更复杂的 FORTRAN 程序的另一个分支，或者 (2)\
    \ 构建一个更稳固的框架。在某些情况下，这些链接涉及两个独立的程序；通常，主体是单个元素。\n\n示例代码（声明）：\n```fortran\nprogram\
    \ string_concatenation\nimplicit none\n  character (len = 5) :: name\n  character\
    \ (len = 50) :: announcement\n  character (len = 50) :: message\n  name = ‘Dana\
    \ Caulfield’\n  announcement = ‘This is’\n  message = ‘I would like to give you\
    \ a warm welcome to Prescott Academy!’\n  print *, announcement, name\n  print\
    \ *, message\nend program string_concatenation\n```\n\n示例程序（执行）：\n```\nThis is\
    \ Dana Caulfield.\nI would like to give you a warm welcome to Prescott Academy!\n\
    ```\n\n## 3.5 – 修剪\n\n使用 `trim` 函数可以对字符串进行修剪。它切掉不必要的行并继续执行所需的结果。由于程序中存在被称为末尾空格（trailing\
    \ blanks）的无实质元素，修剪旨在消除杂并只留下核心部分。它允许编译器更快地读取命令。\n\n示例程序：\n```fortran\nprogram trim\n\
    implicit none\ncharacter (len = 30), parameter, :: name1 = “Dana”,22= “Caulfield”\n\
    \  character (len = 30) :: name1, name2\n  full = name1//” “//name2 ! trim\n \
    \ print *, full, “welcomes students to Prescott Academy!”\n  print *, trim (full),\
    \ “ welcomes students to Prescott Academy!”\nend program trim\n```\n\n示例程序（执行）：\n\
    ```\nDana Caulfield welcomes students to Prescott Academy!\n```\n\n## 3.6 - 字符串调整\n\
    \n使用 `adjust` 函数可以对字符串进行调整。与上述 `trim` 函数一样，程序需要修改以使编译器运行得更快、更高效。与其从头开始编写程序，此函数允许你进行快速修正而不冒及其完整性的风险。特别是当程序相当长时，这种消除复杂分析的功能将非常有用。\n\
    \n调整函数有两种类型：\n1. `adjustr` – 调整字符串右侧的，并将其修改为末尾空格。\n2. `adjustl` – 调整字符串左侧的，并将其修改为末尾空格。\n\
    \n示例代码：\n```fortran\nprogram adjust\nimplicit none\n  character (len = 20) ::\
    \ name2, name1\n  character (len = 20) :: announcement\n  character (len = 20)\
    \ :: message\n  name2 = ‘Caulfield’\n  name1 = ‘Dana’\n  announcement = ‘Hi! I’m’\n\
    \  message = ‘Welcome to Prescott!’\n  name = adjustr (announcement) // adjustr\
    \ (name1) // adjustr (message)\n  print *, announcement, name1, message\n  name\
    \ = adjustl (announcement) // adjustl (name1) // adjustl (message)\n  print *,\
    \ announcement, name1, message\n  name = trim (announcement) // trim (name1) //\
    \ trim (message)\n  print *, announcement, name1, message\nend program adjust\n\
    ```\n\n示例程序（执行）：\n```\nHi! I’m Dana Caulfield.\nWelcome to Prescott!\nHi! I’m\
    \ Dana Caulfield.\nWelcome to Prescott!\nHi! I’m Dana Caulfield.\nWelcome to Prescott!\n\
    ```\n\n## 3.7 - 子字符串搜索\n\n在 FORTRAN 中，你允许在一系列字符串中搜索子字符串。你可以取（至少）两个字符串，并检查字符串 #1\
    \ 是否为字符串 #2 的子字符串。相反，你也可以检查字符串 #2 是否为字符串 #1 的子字符串。因此，当字符串 #1 的参数是字符串 #2 参数的子字符串时，编译器将返回零或一个整数。\n\
    \n示例代码：\n```fortran\nprogram search\nimplicit none\n  character (len = 40) ::\
    \ substring1\n  character (len = 20) :: substring2\n  substring1 = ‘This is a\
    \ search’\n  substring2 = ‘search’\n  if (index (substring1, substring2) = 0)\n\
    \    print *, ‘search is not found’\n  else\n    print *, ‘search is found at\
    \ index’, index (substring1, substring2)\n  end if\nend program search\n```\n\n\
    示例程序（执行）：\n```\nSearch is found: index 13\n```\n\n## 3.8 - 什么是数组？\n\n你知道为什么你可以存储数据或数据集合吗？原因在于数组的存在；它们负责存储一组类似的元素（例如字符、变量）。如果数据没有妥善存储，计算机几乎无法解释它们。\n\
    \n关于数组的记忆：\n* 指定单个元素通过下标完成\n* `extent` 术语描述维度\n* `rank` 术语描述维度\n* `size` 术语描述元素\n\
    * 它们具有 `dimension` 属性\n* 它们链接到连续的内存位置\n\n数组有两种类型：\n1. 一维数组 – 作为向量的数组\n2. 二维数组\
    \ – 作为矩阵的数组\n\n## 3.9 - 数组声明\n\n数组声明非常简单。规则是指定所需的维度；相应的，编译器可以确定涉及元素是 `real` 还是\
    \ `integer`。\n\n例如，声明名为 `Caulfield Lair` 的包含 7 个元素的一维数组，代码如下：\n```fortran\nreal,\
    \ dimension (7) :: Caulfield Lair\n```\n\n例如，声明一个名为 `Caulfield Lair` 的包含 7 x 7\
    \ 个元素的二维数组，程序如下：\n```fortran\ninteger, dimension (7, 7) :: Caulfield Lair\n```\n\
    \n## 3.10 - 数组的值赋值\n\n涉及数组的值赋值几乎轻而易举；你只需要输入数值。可以通过处理整个数组完成，或者按照建议，处理单个元素。\n\n\
    例如，将值 `3.0` 赋值给名为 `Caulfield Lair` 的数组中的所有 7 个元素，程序如下：\n```fortran\ndo i = 1,\
    \ 7\n  Caulfield Lair = i * 3.0\nend program do\n```\n\n例如，将值 `3.0` 赋值给 `Caulfield\
    \ Lair` 数组的第一个元素，程序如下：\n```fortran\nCaulfield Lair (1) = 3\n```\n\n"
