    \ is also composed of such components and they are the lines of codes within it.\n\
    \nAlso, take note that in order to make your coding life easier, you will need\
    \ to include some prebuilt headers or functions from your compiler.\n\nTo give\
    \ you an idea on what C code looks like, check the sample below:\n\n```\n#include\
    \ <stdio.h>\n\nint main()\n{\nprintf( \"Hello World!\\n\" );\ngetchar();\nreturn\
    \ 0;\n}\n```\n\nAs you can see in the first line, the code used the `#include`\
    \ directive to include the `stdio.h` in the program. In this case, the `stdio.h`\
    \ will provide you with access to functions such as `printf` and `getchar`.\n\n\
    ### Main Declaration\n\nAfter that, the second line contains `int main()`. This\
    \ line tells the compiler that there exist a function named `main`. The `int`\
    \ in the line indicates that the function `main` will return an integer or number.\n\
    \n### Curly Braces\n\nThe next line contains a curly brace. In C programming,\
    \ curly braces indicate the start and end of a code block or a function. A code\
    \ block is a series of codes joined together in a series. When a function is called\
