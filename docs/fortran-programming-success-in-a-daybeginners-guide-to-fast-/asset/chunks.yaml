    \ 8\n             7\n             8\n             9\n```\n数组中的元素可以根据需要进行编号，但最好是将每个元素与一个下界值关联起来。这让你有机会确定哪些进程比其他进程更紧急。如果数字不是连续排列的，它们将在程序执行时自动进行重新编号。\n\
    \n## 3.12 - 什么是动态数组？\n\n动态数组与普通数组相似。区别在于，它们在编译过程中几乎是不可读的；只有在执行时才能被解释。因此，如果尚未介绍数组的概念，学习动态数组可能会成为一项挑战。\n\
    \n动态数组使用 `allocatable` 属性进行声明。在声明期间，必须使用 `allocate` 属性指定维度。完成后，需要 `deallocate`\
    \ 属性来释放创建的内存。例如，声明一个名为 `dynamic_array` 维度为 7 x 7 的动态数组，程序写法如下：\n\n```fortran\n\
    program darray\nimplicit none\ndynamic_array, dimension (:, :) :: allocatable\
    \ :: darray\nallocate ( darray (7, 7) )\ndeallocate dynamic_array\nend program\
    \ darray\n```\n\n### 动态数组的使用语句\n\n动态数组可以结合语句使用。这消除了混淆，特别是当需要处理多个数组时。通过定义参数定义，可以实现程序的无错误执行。\n\
    \n语句类型：\n* `Where` 语句 – 允许使用数组内部的元素\n* `Data` 语句 – 侧重于多个数组的处理\n\n示例代码（`where`\
    \ 语句）：\n\n```fortran\nprogram sample_where\nimplicit none\n          integer ::\
    \ c (7, 7), i, m\n          do i = 1, 7\n            do m = 1, 7\n           \
    \   c (i, m) = m – i\n            end do\n          end do\n          print *,\
    \ ‘The Array:’\n          do i =bound (c, 1), unbound (c, 1)\n            write\
    \ *, (i, m), m = 1 (c, 2), unbound (c, 2)\n          do\n          where ( c <\
    \ o )\n            c = 1\n          else\n            c = 7\n          where\n\
    \          print *, ‘The Array:’\n          do i =bound (c, 1), unbound (c, 1)\n\
    \            write *, (i, m), m = 1 (c, 2), unbound (c, 2)\n          do\nend\
    \ program sample_where\n```\n\n示例程序（`where` 语句执行结果）：\n```\nThe Array:\n7 8 9 10\
    \ 11 12 13\n1 2 3 4 5 6 7\n6 7 8 9 10 11 12\n-3 -2 -1 0 1 2 3\n2 3 4 5 6 7 8\n\
    4 5 6 7 8 9 10\n0 1 2 3 4 5 6\nThe C Array:\n7 7 7 7 7 7 7\n1 7 7 7 7 7 7\n1 7\
    \ 7 7 7 7 7\n1 7 7 7 7 7 7\n1 7 7 7 7 7 7\n1 7 7 7 7 7 7\n1 7 7 7 7 7 7\n```\n\
    \n示例代码（`data` 语句）：\n\n```fortran\nprogram sample_data\nimplicit none\n       \
    \   integer :: d (2), e (7, 7), f (5), i, m\n          data d /3, 4/\n       \
    \   data e (7, :) /7, 7, 7, 7, 7/\n          data e (8, :) /8, 8, 8, 8, 8/\n \
    \         data e (9, :) /9, 9, 9, 9, 9/\n          data f (d) i = 1, 5 /10, 1/\n\
    \          data f (d) i = 2, 5 / * 5/\n          print *, ‘The D Array:’\n   \
    \       do m = 1, 2\n            print *, d (m)\n          end do\n          print\
    \ *, ‘The B Array:’\n          do i =bound (e, 1), unbound (e, 1)\n          \
    \  write *, (i, m), m = 1 (e, 2), unbound (e, 2) )\n          do\n          print\
    \ *, ‘The C Array:’\n          do m = 1, 5\n            print *, f (m)\n     \
    \     end do\nend program sample_data\n```\n\n示例程序（`data` 执行结果）：\n```\nThe D Array:\n\
    1\n2\nThe E Array:\n1 2 3 4 5 6 7\n2 3 4 5 6 7 8\n3 4 5 6 7 8 9\n4 5 6 7 8 9 10\n\
    5 6 7 8 9 10 11\n6 7 8 9 10 11 12\n7 8 9 10 11 12 13\n```\n\n"
- fmt: "\nStructure components are individual elements of a structure such as the\
    \ three things that were previously defined: data type, data, and end type. With\
    \ the requirements in place, you can begin assigning values to each by using a\
    \ `%`. So you can access portions of a structure, in case of questionable results,\
    \ you can simply look for these members, instead of having to go through the entire\
    \ program. For example, the structure components in the `Math Class` structure\
    \ below are `column 1`, `column 2`, `column 3`, and `column 4`.\n\n`type (Math\
    \ Class) :: column 1`\n`type (Math Class) :: column 2`\n`type (Math Class) ::\
    \ column 3`\n`type (Math Class) :: column 4`\n\n### Value assignment:\n\n`column\
    \ 1%name = Dana Caulfield`\n`column 2%name = Rachel Price`\n`column 3%name = Warren\
    \ Amber`\n`column 4%name = Kate Victoria`\n\n### Sample program:\n\n```fortran\n\
    program structure_sample\nimplicit none\n\n    ! type declaration\n    type Math\
    \ Class\n        character (len = 40) :: name\n        character (len = 40) ::\
    \ name\n        character (len = 40) :: name\n        character (len = 40) ::\
    \ name\n    end type Math Class\n\n    ! declaring variables\n    type (Math Class)\
    \ :: column 1\n    type (Math Class) :: column 2\n    type (Math Class) :: column\
    \ 3\n    type (Math Class) :: column 4\n\n    ! accessing structure components\n\
    \    column 1%name = Dana Caulfield\n    column 2%name = Rachel Price\n    column\
    \ 3%name = Warren Amber\n    column 4%name = Kate Victoria\n\n    ! display Math\
    \ Class components\n    print *, Dana Caulfield\n    print *, Rachel Price\n \
    \   print *, Warren Amber\n    print *, Kate Victoria\nend program structure_sample\n\
    ```\n\n### Sample program (execution):\n\n```\nDana Caulfield\n            column\
    \ 1\nRachel Price\n            column 2\nWarren Amber\n            column 3\n\
    Kate Victoria\n            column 4\n```\n\n## 4.3 - Structures with Array-Creation\n\
    \nWhen writing a program’s structure, you have the option to create arrays. The\
    \ results are similar but with such approach, you won’t have to specify a value\
    \ at the later portion of the program.\n\nWhile a structure sorts data, an array\
    \ does the same in a different way. With the combination of the two, you can have\
    \ a similar product, but it’s actually one with a more solid foundation. Moreover,\
    \ rather than simply have a record, what you have are organized records.\n\n###\
    \ Sample code (array creation):\n\n```fortran\nprogram array_and_structure\nimplicit\
    \ none\n\n    ! type declaration\n    type Math Class\n        character (len\
    \ = 40) :: name\n        character (len = 40) :: name\n        character (len\
    \ = 40) :: name\n        character (len = 40) :: name\n    end type Math Class\n\
    \n    ! declaring variables\n    type (Math Class) :: column 1\n    type (Math\
    \ Class) :: column 2\n    type (Math Class) :: column 3\n    type (Math Class)\
    \ :: column 4\n\n    ! accessing structure into array\n    list (1)%name = Dana\
    \ Caulfield\n    list (2)%name = Rachel Price\n    list (3)%name = Warren Amber\n\
    \    list (4)%name = Kate Victoria\n\n    ! display Math Class components\n  \
    \  print *, list (1)%name\n    print *, list (2)%name\n    print *, list (3)%name\n\
    end program array_and_structure\n```\n\n### Sample program (execution):\n\n```\n\
    Dana Caulfield\n            column 1\nRachel Price\n            column 2\nWarren\
    \ Amber\n            column 3\nKate Victoria\n            column 4\n```\n\n##\
    \ 4.4 – Structures & Arguments\n\nContained within structures are arguments. Usually,\
    \ they are in the form of expressions or variables. In a reference, they are called\
    \ `actual arguments` but in corresponding procedures, they are acknowledged as\
    \ `dummy arguments`.\n\nArguments, both actual arguments and dummy arguments,\
    \ are linked to their order in a list. It follows that for a program to read through\
    \ the statements, the pre-defined values are in order. For instance, the 1st actual\
    \ argument is associated to the 1st dummy argument, the 2nd actual argument is\
    \ associated to the 2nd dummy argument, and the 3rd actual argument is associated\
    \ to the 3rd dummy argument.\n\nThere are 2 approaches to argument declaration:\n\
    \n1. **With the use of a function** – it allows the elements to be defined, according\
    \ to its argument.\n\n**Sample code:**\n\n```fortran\nprogram arg_function\nimplicit\
    \ none\n\n    real :: a, b, c\n    a = line (1, b, c)\n    function line (1, b,\
    \ const)\n        real :: line\n        real :: b, const\n        line = 1 * b\n\
    \    end function\nend program arg_function\n```\n\n2. **With the use of a subroutine**\
    \ – it swaps the elements of arrays that are contained within structures\n\n**Sample\
    \ program:**\n\n```fortran\nprogram arg_routine\nimplicit none\n\n    real, dimension\
    \ (7) :: x, z\n    call swap (x, z)\n    subroutine swap (x, y)\n        real,\
    \ dimension (7) :: x, temp\n        temp = x\n        x = z\n        z = temp\n\
    end program arg_routine\n```\n\n# Chapter 5: The Kind Attribute & Streams\n\n\
    In initial versions of FORTRAN, instead of just one, there were 2 types of `real`\
    \ numbers: (1) the default `real` and (2) the double precision `real`. With there\
    \ being both types, sometimes, the presentation of data can cause a breakdown.\
    \ Other than that, it can test a program’s integrity. As the solution, the approach\
    \ that a programmer would usually turn for enhanced numeric precision is to use\
    \ the kind attribute.\n\n## 5.1 - What Are Kind Attributes?\n\nAs mentioned, kind\
    \ attributes are responsible for the opportunity to have better precision control.\
    \ They were designed to set order and arrange data, according to their class.\
    \ Since various kinds of elements (e.g. real numbers, real data, and integers)\
    \ may be stored inside a program, they may eventually turn into a disheveled group\
    \ if they are not properly categorized with the help of the function.\n\n**Sample\
    \ code (declaration):**\n\n```fortran\nprogram kind_attribute\nimplicit none\n\
    \n    real (kind = 6) :: j, k, l\n    real (kind = 7) :: m, n, o\n    integer\
    \ (kind = 4) :: b, c, d\n    integer (kind = 9) :: f, g, h\n    integer :: kind_j,\
    \ kind_b, kind_m, kind_f\n\n    kind_j = kind (j)\n    kind_b = kind (b)\n   \
    \ kind_m = kind (m)\n    kind_f = kind (f)\n\n    print *, ‘the default kind attribute\
    \ for real is’, kind_j\n    print *, ‘the default kind attribute for int is’,\
    \ kind_b\n    print *, ‘the default kind attribute for real is’, kind_m\n    print\
    \ *, ‘the default kind attribute for int is’, kind_f\nend program kind_attribute\n\
    ```\n\n**Sample program (execution):**\n\n```\nthe default kind attribute for\
    \ real is 6\nthe default kind attribute for int is 4\n``` (Wait, the text ends\
    \ here)\n\n## 5.2 - Determining the Size of the Kind Attribute\n\nDetermining\
    \ the size of the kind attribute is useful especially when focusing on single\
    \ elements. If you intend to know more about the nature of your program, an option\
    \ is to inquire using functions. Among the list of tasks you can do includes:\
    \ determine the value of decimals, identify the numbers of bits that are required,\
    \ and find out a number’s exponential range.\n\n**Sample code (declaration):**\n\
    \n```fortran\nprogram size_kind\nimplicit none\n\n    real (kind = 6) :: j\n \
    \   real (kind = 7) :: m\n    integer (kind = 4) :: b\n    integer (kind = 9)\
    \ :: f\n\n    print *, ‘the precision of real (6) =’, precision (j)\n```\n"
