    ## 3.8 - What Are Arrays?


    Do you know why you can store data or a collection of data?


    The reason is the existence of arrays; they are responsible for storing a cluster
    of similar elements (e.g. characters, variables). If piles of data are not stored
    accordingly, it’s almost impossible for computers to interpret them. However,
    granted they are properly designated, a compiler can run a program smoothly and
    deliver an intended function. 


    What to remember about arrays:


    *   Specifying their individual elements is done by addressing subscripts; their
    first element comes with a subscript of 1


    *   The term “extent” describes the elements (in numerical value) along a dimension


    *   The term “rank” describes the dimensions (in numerical value) that they have


    *   The term “size” describes the elements (in numerical value) that they contain


    *   Their shape consists of elements


    *   They are declared with the attribute “dimension”


    *   They are linked to contiguous memory locations


    There are two types of arrays:


    1.  One-dimensional arrays – arrays that serve as vectors


    2.  Two dimensional arrays – arrays that serve as matrices


    ## 3.9 - Array Declaration


    Array declaration is simple. The rule is to specify a desired dimension; granted,
    the compiler can determine whether the involved elements are either “real” or
    “integer”.


    For example, when declaring a one-dimensional array called ‘Caulfield Lair’, which
    contains 7 elements, the code would be written as follows:


    real, dimension (7) :: Caulfield Lair


    For example, when declaring a two-dimensional array called ‘Caulfield Lair’, which
    contains 7 x 7 elements, the program would be written as follows:


    integer, dimension (7, 7) :: Caulfield Lair


    ## 3.10 - Value Assignment in Arrays


    Value assignment involving arrays is almost effortless; you simply have to enter
    an amount. It can be done by addressing an entire array, or as recommended, an
    individual element.


    For example, when assigning the value ‘3.0’ to all 7 elements in the array called
    ‘Caulfield Lair’, the program would be written as follows:


    do i  = 1, 7


                  Caulfield Lair = i * 3.0


    end program do


    For example, when assigning the value ‘3.0’ to the first element of the array
    called ‘Caulfield Lair’, the program would be written as follows:


    Caulfield Lair (1) = 3


    Sample code (for array declaration and value assignment):


    program array


    implicit none


                  real :: Caulfield Lair (7) ! one-dimensional array


                  integer :: Caulfield Lair (7, 7) ! two-dimensional array


                  ! value assignment to one-dimensional array


