  md: '# # A Touch To C


    Imagination is more powerful than knowledge.


    ![](img/192d581e3a01f0e6c194cfc2ff02d9f1_17_0.png)


    # ## Historical Perspective


    C was developed from 1969 to 1973 by Dennis Ritchie at Bell Laboratories. The
    American National Standards Institute (ANSI) signed the ANSI C standard in 1989.
    Kernighan and Ritchie describe ANSI C in their book, which is known affectionately
    as "K&R".


    C and Unix: C was developed from the beginning as the system programming language
    for the operating system Unix. Almost all the components and libraries of the
    Unix kernel were implemented in C. It could be easily portable to new machines
    (having different architecture), just a compilation of a few C files require to
    run the Unix in a new machine.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'C is a simple language: C is a high-level programming language that allows
    a programmer to write programs that are independent of a particular type of machine.
    C totally follows write once, compile anywhere. Such languages are considered
    as high level languages because they are closer to human languages and a far from
    machine languages. Whereas the assembly languages are considered low-level languages
    because they are very close to machine languages. The foremost advantage of high-level
    languages is that they are easily understandable to programmers. But for running
    a program in a computer system, the program must be translated into machine language
    (low-level language). The compiler or interpreter performs this translation.


    # Structure


    In this chapter, we will cover the following topics:


    +   - Objective

    - Introduction to the C Program

    - Execution of the C Program

    - Memory management and Organization of the C Program

    - Types of Error in C

    - Assumptions

    - Other C Programming Important Aspects

    - Conclusion

    - Key terms

    - Try Yourself


    # Objective


    The intention of this chapter is to get an understanding about the anatomy of
    the C program which will help in unhiding the abstraction (hidden details) about
    the C program. It will help the readers visualize the running of C program, which
    is called Process in terms'
  merge: -1
  img_proc: true
