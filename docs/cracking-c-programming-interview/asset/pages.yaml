    to any function call gets free after the execution of a function and the space
    is reusable for other function calls.


    An example of the memory organization of a real C program is shown in figure 1.4.


    | Text Area | machine code ............ | |

    | --- | --- |

    | | India 1000 |

    | Data Area Initialized fragment | i 10 100 b (fun) 10 200 |

    | Uninitialized fragment | j a (from fun()) |

    | Heap Area | 99 5000 |

    | Stack Area | x 10 400 z 5000 300 y 10 500 fun() p 5000 5000 a 10 b 10 s 1000
    2000 3000 4000 main() |


    Notation:


    | variable name | value address |

    | --- | --- |


    Figure 1.4: An example- Memory organization of a C program


    # # Types of Error in C


    Generally, four types of error occur in a program which is as follows:

    **Logical error:** While writing a program, there are some logical mistakes in
    a program. It causes improper output. It could not be'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'checked by the compiler, thus programmers need to check by scanning the code
    manually.


    **Compile Time error**: When any programmer does not follow the rules of a particular
    programming language. Hence, the compiler throws an error. There can be a variety
    of compile-time errors like syntactic error, semantic error. The syntactic error
    occurs when a programmer is not following the syntax of writing a code of a particular
    language. The semantic error occurs when the compiler is not able to understand
    the meaning of some statement.


    **Link Time error**: It occurs at the linking stage, which means there is no problem
    with our code, it compiles fine but some function or library module to be linked
    is missing. Linker does not allow to generate a final executable file. Many compilers
    do compilation and linking together. Like in the GCC compiler, the link-time error
    occurs during the compilation phase only.


    **Run Time error**: These errors occur during the execution of a program. Suppose
    in a program, we are dividing by zero, it is a run time error. Suppose our program
    is trying to access a memory address, that is not allowed to access or that does
    not exist causing segmentation fault.


    # Assumptions


    Machine Configuration:


    The size of a pointer depends on the number of address lines available in a system.
    For a 32-bit machine, the size of the pointer is 4 bytes. The type of pointer
    does not affect its size. An integer pointer, character pointer, float pointer,
    struct pointer, void pointer, all have the same size that is 4B in our consideration.


    **Processor**: Intel


    **Word length**: 32-bit


    **Mode**: Little Endian (we will discuss in explanation of G-2, Question-25)'
  merge: -1
  img_proc: true
