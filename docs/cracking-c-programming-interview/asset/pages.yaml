    17. c


    Explanation: "Lvalue required" means that it is not possible to assign a value
    to something that has no place in memory. A variable on the left-hand side is
    needed to assign a value. Few l-value occurring operations are 3 = a; 2 = 2; In
    a given program, at line 3, the operation is ++y = 3; can be expanded into *y=y+1
    = 3;. The assignment operator is right to left-associative and we are trying to
    store 3 in (*y+1) that is not a variable. Hence, the compiler throws an l-value
    required error.


