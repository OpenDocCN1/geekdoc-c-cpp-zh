  md: 'standard C compiler, the 2D array gets stored in row-major order (1st row,
    2nd row, and so on). The a[1][2] can also be written as *( (a+1)+2). Here, 1 signifies
    skipping of one row, and 2 signifies skipping of two columns. First * (with a+1)
    means selecting a particular row and second * selecting a particular column. The
    address of a+1 is 1012 (skipping one row), the address of a+2 is 1024 (skipping
    two rows), and so on.


    e.g. Retrieve a[1][2] or * (a+1)+2?


    *a+1) means we are skipping the first row and selecting the second row with address
    1012. *(a+1)+2 means that we are skipping 2 elements in the selected row. The
    address of (*(a+1)+2) is 1020. **(a+1)+2 is selecting an element after skipping
    the one row and two elements from a column. It gives a particular of a[1][2] that
    is 9.


