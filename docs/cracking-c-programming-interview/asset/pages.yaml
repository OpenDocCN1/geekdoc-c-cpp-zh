  md: '(int, float, char etc. ) data types, and (ii) user-defined (struct, enum etc.)
    data types. Here the "return 0" statement in the main function() returns the 0
    to the shell/compiler (who is executing this C program).

    We will trace the lifetime of the simple hello program, from the time it is being
    created by a programmer, until it executes on a system, prints "hello India",
    and terminates.


    +   i. Programmer writes a program in an editor (e.g gedit) and saves a text file
    called hello.c, also called source program.


    +   ii. The source program is a sequence of bits in some meaningful (semantic)
    order and organized in 8-bit chunks called bytes octets or cells.


    +   iii. Modern computers represent each character uniquely using ASCII notation.
    Each character has a unique 8-bit sized integer value. The ASCII representation
    of text characters is given in tabular form at the end of this chapter (Table
    1.4).


    The hello.c program is stored in a file as a sequence of bytes. The ASCII representation
    of the hello.c program is shown in the following figure 1.1.


    ```

    # i n c l o u d e <sp> < s t d i o

    35 105 110 99 108 117 100 101 32 60 115 116 100 105 111

    h d \ n i n t <sp> m a i n ( ) \n

    46 104 62 110 105 110 116 32 109 97 115 110 40 11

    { <sp> <sp> <sp> p r i n t f ( "

    123 32 32 32 32 112 114 112 105 110 116 102 40 34

    h e l l i n d a " ) ; return 0

    104 101 108 108 111 73 110 100 105 97 34 41 59 10 125

    ```


    > Figure 1.1: The ASCII representation of hello.c.


    Each and every character has its corresponding integer value. For example, the
    first character ''# '' has a value of 35, the second character ''i'' has a value
    of 105, and so on.


    # Execution of the C program'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Execution refers to using system resources like CPU, memory, I/O devices in
    order to complete a particular task. For the execution of hello.c program, it
    needs to use all these resources like CPU for processing, I/O device- monitor
    for displaying the result "hello India" and so on.


    The issue is that the source program we have written, hello.c is not understandable
    to the machine. It needs some effort. The given program is written in human-readable
    form (high level) and the machine could not understand this. So, hello.c needs
    translation from high-level form to low-level form (machine understandable). This
    translation can be done using a compiler or interpreter.


    The process of compilation depends on the compiler we are using, some of the compilers
    are Turbo C, Dev-C, GCC, etc. Their translation process is entirely different.
    The compiled file is referred to as executable object files. On a Unix system,
    the execution of a C program can be done using GCC compiler as follows:


    ```

    unix> gcc -o hello.c

    ```


    The source file hello.c is read by GCC compiler driver which translates it into
    an executable object file.


    ```

    unix> ./hello

    ```


    The loader loads this executable file into the main memory, and the CPU will start
    processing.


    The translation using GCC is not a single phase thing. The GCC passes the source
    program to its four components: (i) preprocessor, (ii) compiler, (iii) assembler,
    and (iv) linker. They are altogether referred to as a compilation system. Figure
    1.2 will give a better idea of the compilation system as follows:'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/192d581e3a01f0e6c194cfc2ff02d9f1_22_0.png)


    Figure 1.2: The compilation system


    **Preprocessor:** The preprocessor (cpp) substitute the macros and the directives
    that start from # character directly in the program text of the original C program.
    It obtains another C program suffixed with ".i".


    **Compiler:** It involves lots of sub-phases like lexical analysis, syntactic
    analysis, and so on. It obtains a program in assembly language that describes
    the machine instruction in the form of text (also called mnemonics). The output
    file of the compilation phase is suffixed with ".s".


    **Assembler:** It translates the text file "hello.s" into machine-level instructions
    and packed it in the form of a relocatable object program and stores the output
    in file hello.o.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "Linker: As we can look into the program that we are calling printf() function,\
    \ there is no printf() function in our source program. The printf() function is\
    \ the part of the standard C library provided by every C compiler. The printf\
    \ function is already present in the form of compiled file and resides in the\
    \ C library as printf.o file. The linker manages the merging of these newly compiled\
    \ (source program) and pre-compiled (printf.o) files. After merging, the linker\
    \ obtains the executable file, which is loaded by a loader into memory, and executed\
    \ by the CPU.\n\nIt was just an overview of all the phases. We can look into the\
    \ content of all these intermediate files (hello.i, hello.s, hello.o) bypassing\
    \ different parameters to the gcc command. More detail on this will take us beyond\
    \ the topic discussion.\n\nThe most important issue with any programming language\
    \ is managing memory. We will see the memory management and memory organization\
    \ of the C program in the next section.\n\n# Memory management and organization\
    \ of the C program\n\nThe memory organization of the C program depends on how\
    \ variables are organized within a relocatable object file (hello.o). This memory\
    \ representation of the object file can be categorized into more than 10 areas.\
    \ But for our better understanding we will focus on four areas (figure 1.3) which\
    \ are as follows:\n\n+   * Text Area\n* Data Area\n    * Initialized data fragment\n\
    \    * Uninitialized data fragment (bss)\n* Heap Area\n* Stack Area"
  merge: -1
  img_proc: true
