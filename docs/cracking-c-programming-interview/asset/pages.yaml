  md: 'Explanation: The *void* pointer is a generic pointer type. It can hold addresses
    of all data types. It is used when the actual data type of a pointer is not known
    for the time, and later it may be known. In the given code we are using a void
    pointer that is holding addresses of an integer and character type.


