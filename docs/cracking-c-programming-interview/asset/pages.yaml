    # 10. d


    **Explanation:** Any storage class (static, auto, extern) except register storage
    class is not allowed to be used as a functional argument. There is no need of
    making the function argument static because arguments are just a source of communication
    between functions. There is only one instance of a static variable associated
    with a function. If we make argument static, we need to create a separate instance
    of a static variable in each function call, so we get multiple instances of a
    static variable, that is not allowed.


