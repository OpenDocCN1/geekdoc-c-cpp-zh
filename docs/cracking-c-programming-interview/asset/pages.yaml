- pgno: 25
  md: '# Figure 1.3: Memory organization of a C program


    1. **Text Area:** It contains the machine code of the compiled program. It is
    also called code area. It is only readable, preventing machine instructions from
    getting modified accidentally. The text area is sharable among all the functions
    in a program. The existence of this area is till the exit of main().


    2. **Data Area:** The memory for global C variables and static variables are maintained
    in this area. This area is readable and writable both. It is also sharable among
    all the functions in a program. Its lifetime is also till the termination of the
    program. It is further classified into two fragments:


    +   i. **Initialized data fragment:** All the global and static variables that
    are initialized with some value get allocated memory in this area.


    +   ii. **Uninitialized data fragment:** All the global and static variables that
    are not initialized lie in this area get allocated memory in this area. This area
    is also called block start by symbol (bss).


    3. **Heap Area:** The dynamic memory allocation takes place in this area. The
    size for this area is not fixed, it grows till the largest available address is
    present. In C, it is managed by malloc, calloc, realloc and free, library function
    which uses the brk and sbrk system calls to regulate the size. This area is also
    shared by all the functions in a program. Its existence is till the termination
    of the program.


    4. **Stack Area:** It is next to the heap area, the memory addresses for stack
    area and heap area are not fixed while data and text area are fixed. The heap
    and stack area grow towards each other. All the local variables (automatic) get
    stored in the stack area. When a program start execution, the first main(main)
    get pushed into the stack and then other functions get pushed when they get called.
    There are lots of changes that occur in the machine state when any function is
    called. The program counter'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'gets updated with a new address; CPU executes instruction of a new function.
    The return address of the caller''s, machine register, etc. gets saved onto the
