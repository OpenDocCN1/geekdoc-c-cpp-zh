    +   43. c


    Explanation: This is following the concept of structure padding. Considering a
    machine of 32 bit. All members of a structure are stored on memory locations such
    that a minimum number of memory access is required. 32 bit machine, the bus transfers
    4 bytes at a time. Considering struct student1, character variable ''a'' is stored
    at the first byte of student1, if we place integer variable ''b'' on bytes 2,
    3, 4 and 5 then to read variable ''b'' machine required two memory access, first
    access to read bytes from 2 to 4 and second access to read byte 5, it is not feasible
    that is why memory from byte 2 to 4 will be padded by NULL and variable ''b''
    will be stored from 5 bytes to 8 bytes. Variable 10, 11,12th bytes will be padded
    with NULL. Variable ''d'' will be stored from the 13th to the 20th byte. Hence,
    the size of object ''s1'' becomes 20B.


