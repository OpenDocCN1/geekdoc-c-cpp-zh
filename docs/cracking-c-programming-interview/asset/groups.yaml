    +   4. c


    Explanation: The *void* data type is not allowed because the size of the *void*
    data type is not known. It cannot be used as a generic data type.


    +   5. b


    Explanation: The memory for malloc is allocated dynamically in heap area using
    ''brk'' (keyword) system call. As we can see in figure (i) brk is pointing to
    the free (unallocated) pool of memory. When we call ''p'' the malloc() function,
    the brk pointer allocates memory of 4B to ''p'' and itself get shifted, and (ii)
    also assigns a value 10 to the allocated space.


    Now we are doing free(p), (iii) the memory allocated by malloc get free and its
    content becomes zero or NULL, and brk return to its previous location. We can
    notice that ''p'' is still pointing to the same address (figure iii). We again
    did malloc() to allocate memory for ''q'' (figure iv). If we try to access the
    content of pointer ''q'', it returns 15 as expected. Suppose if we access the
    content of pointer ''p'', it was not expected from ''p'' as we have already freed
    the ''p'', but what actually happened is that we freed the memory from the heap
    area, but p still points to a memory location/address, as p is just a pointer
    variable, this ''p'' is called dangling pointer.


    The dangling pointer in the program can be avoided by making p = NULL just after
    the free(p) statement.'
