  mdcn: "\n链接器：正如我们查看正在调用的 `printf()` 函数时所看到的，我们的源程序并没有 `printf()` 函数。`printf()` 函数是每个\
    \ C 编译器提供的标准 C 库的一部分。`printf` 函数已经以编译后文件的形式存在，并作为 `printf.o` 文件存储在 C 库中。链接器负责管理这些新编译（源程序）和预编译（`printf.o`）文件的合并。合并后，链接器获得可执行文件，该文件由加载器加载到内存中，并由\
    \ CPU 执行。\n\n这只是所有阶段的概述。我们可以通过向 `gcc` 命令传递不同的参数来查看所有中间文件（`hello.i`、`hello.s`、`hello.o`）的内容。关于此的细节将超出讨论的主题。\n\
    \n任何编程语言最重要的问题就是内存管理。我们将在下一节中介绍 C 程序的内存管理和内存组织。\n\n## C 程序的内存管理与组织\n\nC 程序的内存组织取决于变量在可重定位对象文件（`hello.o`）中的组织方式。对象文件的内存表示可以分为\
    \ 10 多个区域。但为了方便理解，我们将重点关注以下四个区域（图 1.3）：\n\n- 文本区域 (Text Area)\n- 数据区域 (Data Area)\n\
    \    - 初始化数据段\n    - 未初始化数据段 (bss)\n- 堆区域 (Heap Area)\n- 栈区域 (Stack Area)\n\n\
    ![](img/192d581e3a01f0e6c194cfc2ff02d9f1_24_0.png)\n\n1. **文本区域：** 它包含编译程序的机器码。它也被称为代码区域。它是只读的，防止机器指令被意外修改。文本区域在程序的所有函数之间是共享。该区域的存在持续到\
    \ `main()` 退出。\n\n2. **数据区域：** 全局 C 变量和静态变量的内在此区域维护。该区域既可读又可写。它在程序的所有函数之间也是共享。它的生命周期也持续到程序结束。它进一步被分为两个部分：\n\
    \n    - i. **初始化数据段：** 所有初始化了某些值的全局和静态变量都会在该区域被分配内存。\n\n    - ii. **未初始化数据段：**\
    \ 所有未初始化的全局和静态变量位于该区域并被分配内存。该区域也被称为符号起始块 (bss)。\n\n3. **堆区域：** 动态内存分配发生在该区域。该区域的大小是不固定的，它会增长到最大的可用地址。在\
    \ C 中，它由 `malloc`、`calloc`、`realloc` 和 `free` 库函数管理，这些函数使用 `brk` 和 `sbrk` 系统调用来调节大小。该区域也被程序的所有函数共享。它的存在直到程序结束。\n\
    \n4. **栈区域：** 它位于堆区域旁边，栈区域和堆区域的内存地址是不固定的，而数据区域和文本区域是固定的。堆和栈区域相互增长。所有的局部变量（自动）都存储在栈区域。当程序开始执行时，第一个\
    \ main 被入栈，然后其他函数在被调用时被入栈。当调用任何函数时，机器状态会发生很多变化。程序计数器更新新地址；CPU 执行新函数的指令。调用者的返回地址、机器寄存器等被保存到栈中。栈区域的概念是\
    \ C 语言递归的基础。分配给任何函数调用的空间在函数执行后会被释放，该空间可以重用于其他函数调用。\n\n真实 C 程序的内存组织示例如图 1.4 所示。\n\
    \n| 文本区域 | 机器码 ............ |\n| --- | --- |\n| | India 1000 |\n| 数据区域 初始化数据段\
    \ | i 10 100 b (fun) 10 200 |\n| 未初始化段 | j a (from fun()) |\n| 堆区域 | 99 5000 |\n\
    | 栈区域 | x 10 400 z 5000 300 y 10 500 fun() p 5000 5000 a 10 b 10 s 1000 2000 3000\
    \ 4000 main() |\n\n符号说明：\n\n| 变量名 | 值地址 |\n| --- | --- |\n\n图 1.4：一个示例 - C 程序的内存组织\n\
    \n## C 语言中的错误类型\n\n通常程序中会发生四种类型的错误，如下：\n\n**逻辑错误：** 在编写程序时，程序中存在一些逻辑错误。它会导致输出不正确。编译器无法检查它，因此程序员需要通过手动扫描代码来检查。\n\
    \n**编译错误：** 当任何程序员没有遵循特定编程语言的规则时。因此，编译器抛出错误。存在各种编译时错误，如语法错误、语义错误。语法错误发生在程序员没有遵循特定语言的代码编写语法时。语义错误发生在编译器无法理解某些语句含义时。\n\
    \n**链接错误：** 发生在链接阶段，这意味着我们的代码没有问题，它编译正常，但缺少某些需要链接的函数或库模块。链接器不允许生成最终的可执行文件。许多编译器将编译和链接合并在一起。\n\
    \n**链接错误：** 发生在链接阶段，这意味着我们的代码没有问题，它编译正常，但某些需要链接的函数或库模块缺失了。链接器不允许生成最终的可执行文件。许多编译器将编译和链接合并在一起。\n\
    \n**运行时错误：** 这些错误在程序执行期间发生。例如除以零。\n\n## 假设\n\n**处理器**：Intel\n\n**字长**：32-bit\n\
    \n**模式**：小端 (Little Endian)\n\n**数据类型的大小**：\n\nchar - 1B\nshort - 2B\nint - 4B\n\
    long - 4B\nlong int - 4B\nfloat - 4B\ndouble - 8B\n\n## 其他 C 编程方面\n\n关键字：C89 有\
    \ 32 个关键字，关键字是具有特殊含义的保留字。\n\n| auto | double | struct |\n| break | else | switch\
    \ |\n| case | enum | typedef |\n| char | extern | union |\n| const | float | unsigned\
    \ |\n| continue | for | void |\n| default | goto | volatile |\n| do | if | sizeof\
    \ |\n|  | static | while |\n\n表 1.2：C 中的关键字\n\n字符集：C 包含以下字符：\n\n* 小写字母和大写字母：a–Z\n\
    * 十进制数字：0–9\n* 图形字符：! \" # % & ' ( ) * +, -, . /; <= > ? [ ] ^ { } ~\n* 空格字符：空格、水平制表符、垂直制表符、分页符、换行\n\
    \n## C 语言中的运算符\n\n大量的运算符如下：\n\n- 算术运算符：+, -, *, /, %\n- 赋值运算符：=\n- 复合赋值运算符：+=,\
    \ -=, *=, /=, &=, |=, ^=, <<, >>=\n- 位逻辑运算符：~ |, ^\n- 位移运算符：<<, >>\n- 布尔逻辑：!,\
    \ &&, ||\n- 条件求值：? =\n- 等值测试：==, !=\n- 函数调用：()\n- 增/减运算符：++, --\n- 成员选择：., ->\n\
    - 对象大小：sizeof\n- 关系运算符：<, <=, >, =\n- 引用和解引用：&, *, []\n- 序列：,\n- 类型转换：(typename)\n\
    \n优先级表：表 1.3 比较了 C 中各种运算符的优先级和结合性。表格中的上行优先级比下行高。同一行的运算符表示相同的优先级。如果两个运算符的优先级相同，则根据运算符的结合性对表达式进行求值。\n"
