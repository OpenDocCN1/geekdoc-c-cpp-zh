    We will trace the lifetime of the simple hello program, from the time it is being
    created by a programmer, until it executes on a system, prints "hello India",
    and terminates.


    +   i. Programmer writes a program in an editor (e.g gedit) and saves a text file
    called hello.c, also called source program.


    +   ii. The source program is a sequence of bits in some meaningful (semantic)
    order and organized in 8-bit chunks called bytes octets or cells.


    +   iii. Modern computers represent each character uniquely using ASCII notation.
    Each character has a unique 8-bit sized integer value. The ASCII representation
    of text characters is given in tabular form at the end of this chapter (Table
    1.4).


    The hello.c program is stored in a file as a sequence of bytes. The ASCII representation
    of the hello.c program is shown in the following figure 1.1.


    ```

    # i n c l o u d e <sp> < s t d i o

    35 105 110 99 108 117 100 101 32 60 115 116 100 105 111

    h d \ n i n t <sp> m a i n ( ) \n

    46 104 62 110 105 110 116 32 109 97 115 110 40 11

    { <sp> <sp> <sp> p r i n t f ( "

    123 32 32 32 32 112 114 112 105 110 116 102 40 34

    h e l l i n d a " ) ; return 0

    104 101 108 108 111 73 110 100 105 97 34 41 59 10 125

    ```


    > Figure 1.1: The ASCII representation of hello.c.


    Each and every character has its corresponding integer value. For example, the
