    # 献给


    致所有计算机工程师


    # 关于作者


    Tanuj Kumar Jhamb 拥有在世界顶级 IT 公司工作的经验。他目前在 Arista Networks 担任软件工程师。在此之前，他曾在亚马逊担任软件开发工程师-II，在华为担任系统架构师，在
    Oracle 公司担任高级软件开发人员。他擅长解决具有挑战性的现实世界数据结构问题和系统设计模式。他于2015年毕业于卡里卡理工学院获得计算机科学硕士学位。他在第一次尝试中在
    Gate-2013 考试中获得了全国排名 416，百分比 99.81%。最后但同样重要的是，自 2014 年以来，他一直在声誉卓著的培训机构向 Gate 考生教授数据结构和算法。


    # 关于审稿人


    R Rajkumar 博士在学术界和工业界拥有超过21多年的经验，目前在班加罗尔的 RNS 技术学院担任副教授。他在教学和指导本科及研究生方面拥有丰富经验，涵盖计算机组织、UNIX
    和C语言编程、数据库管理系统、数字通信、物联网、Java 编程等学科。他在深度学习技术领域的同行期刊上发表了多篇论文。他目前的兴趣领域是数据和智能系统的算法优化。


    # 致谢


    我想向 Mahipal Singh Parmar 表示特别感谢和深切敬意，感谢他分享软件专业知识和丰富的概念知识。如果没有他的宝贵建议，我无法完成这本书。


    我想感谢以下几个人：Lalit Kumar、Madhu、Kuldeep Kumar、Ridhi、Jyotsna、Pratap Singh、Basanti、Harsh
    Kumar、Smriti 和 Chandan Kumar，感谢他们在本书编写期间提供的持续和进行的支持。


    我还要感谢 BPB 出版团队，他们提供了足够的时间让我完成本书并允许其出版。感谢 R Rajkumar Pedappu 对书的评审。


    # 前言


    学习新事物的最好方法是实践。书中有很多在互联网或教科书中容易找到的概念。每个问题背后都有一个概念。这些概念对于计划从事任何跨国 IT 工作的、逻辑良好的程序员来说至关重要。这本书对于真正的程序员和严肃的求职者来说是证明。书中包含了500
    多道 C 语言问题。阅读本书的指南如下。我们建议你遵循这些指南，并在截止日期前完成本书。在每个小组的末尾，还有其他重要的面试题。如果你缺乏时间和良好的编程技巧，请至少编写算法或伪代码。


    所有 C 代码均使用 gcc 4.8.2 编译器进行编译并运行在 Linux 3.13.0-generic ubuntu-14.04 操作系统上。我们还建议你在系统中运行给定的代码以获得更好的理解，如有任何错误请告知我们。


    # 本书结构


    第一章“C语言简介”描述了关于 C 的概念理解。强烈建议读者在继续之前阅读本章。在本章之后，本书分为七组，每组包含约60 道 C 语言编程问题及解析。在完成所有小组后，5
    份模拟题中提供了 100 多道问题供你练习。本书总共包含600 多道面试题。


    # 先决条件


    阅读本书需要对 C 概念有非常基本的理解。


    # 阅读指南


    - 尝试在2 小时内完成第一章“C语言简介”。

    - 书包含 7 组问题，每组约 60 道。你每天可以解决 20 道，因此每组需要 3 天。你只需要 21 天即可解决所有的 C 语言概念编程。

    - 给模拟题留出 4 天。总共需要 25 天完成本书。

    - 下页提供了完成表。


    下方提供了一个完成表。你可以写下解决每个小组花费的日期和小时。


