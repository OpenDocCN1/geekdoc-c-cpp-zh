    # About the Author


    Tanuj Kumar Jhamb is holding experience of working with world top IT companies.
    He is currently working as a Software Engineer with Arista Networks. Prior to
    that he has worked as a Software Developer Engineer-II at Amazon, System Architect
    at Huawei, and Senior Software Developer at Oracle Incorporation. He is well versed
    in solving challenging real world data structure problems, and system design patterns.
    He completed Master’s in Computer Science in 2015 from NIT Calicut. He got AIR
    416, Percentile 99.81 in Gate-2013 exam in first attempt. Last but not least he
    has been teaching data structure and algorithms to gate aspirants in prestigious
    coaching institutes since 2014.


    # About the Reviewer


    With more than 21 years of experience in academia and industry, Dr. R Rajkumar
    is currently working at RNS Institute of Technology, Bengaluru as Associate Professor.
    He has a vast experience in teaching and mentoring both undergraduate and postgraduate
    students with subjects like Computer Organization, UNIX and C Programming, Database
    Management Systems, Digital Communication, Internet of Things, Java Programming,
    etc. He has several publications in refereed journals on Deep Learning techniques.
    His current area of interest is Optimization of Algorithms for Data and Intelligent
    Systems.


    # Acknowledgement


    I would like to express my special thanks of gratitude and deep regards to Mr.
    Mahipal Singh Parmar for sharing his software technical expertise, and vast conceptual
    knowledge of coding. I could have never completed this book without Mahipal''s
    valuable and constructive suggestions.


    I would like to thank a few more people Mr. Lalit Kumar, Mrs. Madhu, Mr. Kuldeep
    Kumar, Mrs. Ridhi, Mrs Jyotsna, Mr Pratap Singh, Mrs Basanti, Mr Harsh Kumar,
    Mrs. Smriti, and Mr Chandan Kumar for their continued and ongoing support they
    have given me during the writing of this book.


    My gratitude also goes to the team at BPB Publications for being supportive enough
    to provide me enough time to finish the book and allow me to publish the book.
    I want to thank Dr. R Rajkumar, Mr. Ravi Kumar Pedappu for reviewing the book.


    # Preface


    The best way to learn new things is to do things. There are lots of concepts in
    C programming that are not easily available either on the internet or in textbooks.
    We tried our best to deliver concepts through explanations of C questions. Each
    and every question has a concept behind it. These concepts are damn important
    for students who are planning to appear for any multinational IT job. Every company
    needs programmers/coders who are good with logic and sound in fundamentals. This
    book is proved a diamond for genuine C programmers and for serious job seekers.
    The book contains more than 500 C programming questions. You only need a maximum
    of 25 days to complete the book. The guidelines for reading this book are given
    below. We recommend you to follow these guidelines and try to finish the book
    before the deadline. At the end of each group, some other important interview
    questions are present. To write programs and execute. If you are having a lack
    of time and good programming skills then you to write at least an algorithm or
    pseudocode for them.


    All C codes are compiled and executed with gcc 4.8.2 compiler driver running on
    a Linux system with kernel 3.13.0-32-generic ubuntu-14.04 32-bit Operating system.
    We also recommend you to execute the given codes in your system for better understanding
    and let us know if there is any correction.


    # Organization of the Book


    The chapter-1 "A touch to C" describes conceptual understanding about C programs.
    It is highly recommend to the readers to go through this chapter before proceeding.
    After this chapter, the book is divided into 7 groups, each group contains around
    60 C programming questions with explanations and other important interview questions.
    After completing all the groups, there are more than 100 questions given in 5
    sample papers with solutions for your practice. The book overall contains more
    than 600 interview questions.


    # Prerequisite


    A very basic understanding of theoretical C concepts is required for reading this
    book.


    # Guidelines For Reading the Book


    - Try to finish chapter-1 "A Touch to C" in 2 hours.

    - The book contains 7 groups of questions, each group has around 60 questions.
    You can solve 20 questions per day. So, each group takes 3 days to solve. You
    can solve all the conceptual C programming in 21 days only.

    - Give 4 days to sample papers. Overall you need 25 days to solve this book.

    - A book solving chart is given on next page.


    A book solving chart is given below. You can write date and hours that you spent
