    # 58. d


    Explanation: The dynamic memory allocator malloc() and free(), we discussed in
    the explanation of question 5, group 1.


    +   The function malloc() allocates memory in the form of blocks, the block size
    is the number of bytes required to store a single element of that type. For example,
    an integer, its block size is 4. Similarly, for character and float, their block
    sizes are 4 and 4 respectively.


    +   If we are allocating memory dynamically for 10 integers at line 4 in a given
    program, the memory that gets allocated is in a contiguous form inside the heap
    area. The first block contains the header, which has information about the remaining
    blocks and the'
  - '[PAGE 245]


    memory allocation scheme. The ''p'' contains the address of 1st block only. It
    can be assumed as a base address, we can access other blocks by adding an index.
    It works like an array. The difference between this array and the actual array
    is that its address is not constant while with the actual array, whose base address
    is always constant.


    ► If we do free(p), p contains the address of the first block. The first block
    contains the header, which has information about the other blocks also. free(p)
    will make free memory for all the 10 integers.


    ► Suppose we do p++, , now ''p'' is pointing to the 2nd block. Suppose we are
    freeing the memory, free(p), it throws run time error because the second block
    doesn''t have any information about the remaining blocks. We tried to free blocks
    of memory without knowing the number of blocks. Hence, it is not possible.


    Here, in a given program, At line 2, the ''i'' is updated, indirectly ''p'' is
    updated. Now, ''p'' started pointing to the 2nd block (element) of an array. In
    line 7, we are trying to free the dynamic memory. The pointer ''p'' is not knowing
    the memory allocation scheme because it is not pointing to the first block which
    has information about the memory allocation scheme. Hence, a run time error gets
    thrown.


