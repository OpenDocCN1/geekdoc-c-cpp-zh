  md: "\nLinker: As we can look into the program that we are calling printf() function,\
    \ there is no printf() function in our source program. The printf() function is\
    \ the part of the standard C library provided by every C compiler. The printf\
    \ function is already present in the form of compiled file and resides in the\
    \ C library as printf.o file. The linker manages the merging of these newly compiled\
    \ (source program) and pre-compiled (printf.o) files. After merging, the linker\
    \ obtains the executable file, which is loaded by a loader into memory, and executed\
    \ by the CPU.\n\nIt was just an overview of all the phases. We can look into the\
    \ content of all these intermediate files (hello.i, hello.s, hello.o) bypassing\
    \ different parameters to the gcc command. More detail on this will take us beyond\
    \ the topic discussion.\n\nThe most important issue with any programming language\
    \ is managing memory. We will see the memory management and memory organization\
    \ of the C program in the next section.\n\n## Memory management and organization\
    \ of the C program\n\nThe memory organization of the C program depends on how\
    \ variables are organized within a relocatable object file (hello.o). This memory\
    \ representation of the object file can be categorized into more than 10 areas.\
    \ But for our better understanding we will focus on four areas (figure 1.3) which\
    \ are as follows:\n\n- Text Area\n- Data Area\n    - Initialized data fragment\n\
    \    - Uninitialized data fragment (bss)\n- Heap Area\n- Stack Area\n\n![](img/192d581e3a01f0e6c194cfc2ff02d9f1_24_0.png)\n\
    \n## Figure 1.3: Memory organization of a C program\n\n1. **Text Area:** It contains\
    \ the machine code of the compiled program. It is also called code area. It is\
    \ only readable, preventing machine instructions from getting modified accidentally.\
    \ The text area is sharable among all the functions in a program. The existence\
    \ of this area is till the exit of main().\n\n2. **Data Area:** The memory for\
    \ global C variables and static variables are maintained in this area. This area\
    \ is readable and writable both. It is also sharable among all the functions in\
    \ a program. Its lifetime is also till the termination of the program. It is further\
    \ classified into two fragments:\n\n    - i. **Initialized data fragment:** All\
    \ the global and static variables that are initialized with some value get allocated\
    \ memory in this area.\n\n    - ii. **Uninitialized data fragment:** All the global\
    \ and static variables that are not initialized lie in this area get allocated\
    \ memory in this area. This area is also called block start by symbol (bss).\n\
    \n3. **Heap Area:** The dynamic memory allocation takes place in this area. The\
    \ size for this area is not fixed, it grows till the largest available address\
    \ is present. In C, it is managed by malloc, calloc, realloc and free, library\
    \ function which uses the brk and sbrk system calls to regulate the size. This\
    \ area is also shared by all the functions in a program. Its existence is till\
    \ the termination of the program.\n\n4. **Stack Area:** It is next to the heap\
    \ area, the memory addresses for stack area and heap area are not fixed while\
    \ data and text area are fixed. The heap and stack area grow towards each other.\
    \ All the local variables (automatic) get stored in the stack area. When a program\
    \ start execution, the first main(main) get pushed into the stack and then other\
    \ functions get pushed when they get called. There are lots of changes that occur\
    \ in the machine state when any function is called. The program counter gets updated\
    \ with a new address; CPU executes instruction of a new function. The return address\
    \ of the caller's, machine register, etc. gets saved onto the stack. The concept\
    \ stack area is the foundation of recursion in C. The space allocated to any function\
    \ call gets free after the execution of a function and the space is reusable for\
    \ other function calls.\n\nAn example of the memory organization of a real C program\
    \ is shown in figure 1.4.\n\n| Text Area | machine code ............ |\n| ---\
    \ | --- |\n| | India 1000 |\n| Data Area Initialized fragment | i 10 100 b (fun)\
    \ 10 200 |\n| Uninitialized fragment | j a (from fun()) |\n| Heap Area | 99 5000\
    \ |\n| Stack Area | x 10 400 z 5000 300 y 10 500 fun() p 5000 5000 a 10 b 10 s\
    \ 1000 2000 3000 4000 main() |\n\nNotation:\n\n| variable name | value address\
    \ |\n| --- | --- |\n\nFigure 1.4: An example- Memory organization of a C program\n\
    \n## Types of Error in C\n\nGenerally, four types of error occur in a program\
    \ which is as follows:\n\n**Logical error:** While writing a program, there are\
    \ some logical mistakes in a program. It causes improper output. It could not\
    \ be checked by the compiler, thus programmers need to check by scanning the code\
    \ manually.\n\n**Compile Time error**: When any programmer does not follow the\
    \ rules of a particular programming language. Hence, the compiler throws an error.\
    \ There can be a variety of compile-time errors like syntactic error, semantic\
    \ error. The syntactic error occurs when a programmer is not following the syntax\
    \ of writing a code of a particular language. The semantic error occurs when the\
    \ compiler is not able to understand the meaning of some statement.\n\n**Link\
    \ Time error**: It occurs at the linking stage, which means there is no problem\
    \ with our code, it compiles fine but some function or library module to be linked\
    \ is missing. Linker does not allow to generate a final executable file. Many\
    \ compilers do compilation and linking together. Like in the GCC compiler, the\
    \ link-time error occurs during the compilation phase only.\n\n**Run Time error**:\
    \ These errors occur during the execution of a program. Suppose in a program,\
    \ we are dividing by zero, it is a run time error. Suppose our program is trying\
    \ to access a memory address, that is not allowed to access or that does not exist\
    \ causing segmentation fault.\n\n## Assumptions\n\nMachine Configuration:\n\n\
    The size of a pointer depends on the number of address lines available in a system.\
    \ For a 32-bit machine, the size of the pointer is 4 bytes. The type of pointer\
    \ does not affect its size. An integer pointer, character pointer, float pointer,\
    \ struct pointer, void pointer, all have the same size that is 4B in our consideration.\n\
    \n**Processor**: Intel\n\n**Word length**: 32-bit\n\n**Mode**: Little Endian (we\
    \ will discuss in explanation of G-2, Question-25)\n\n## Size of Data Types:\n\
    \nchar - 1B\nshort - 2B\nint - 4B\nlong - 4B\nlong int - 4B\nfloat - 4B\ndouble\
    \ - 8B\n\n## Other C Programming Aspects\n\nKeywords: C89 has 32 keywords, keywords\
    \ are reserved words with special meanings.\n\n| auto | double | struct |\n| break\
    \ | else | switch |\n| case | enum | typedef |\n| char | extern | union |\n| const\
    \ | float | unsigned |\n| continue | for | void |\n| default | goto | volatile\
    \ |\n| do | if | sizeof |\n|  | static | while |\n\nTable 1.2: Keywords in C\n\
    \nCharacter set: C includes the following characters:\n\n* Lowercase and uppercase\
    \ letters: a–Z\n* Decimal digits: 0–9\n* Graphic characters: ! \" # % & ' ( )\
    \ * +, -, ., /; <= > ? [ ] ^ _ { } ~\n* Whitespace characters: space, horizontal\
    \ tab, vertical tab, form feed, newline\n\n## Operator in C:\n\nThe large set\
    \ of operators are as follows:\n\n- arithmetic: +, -, *, /, %\n- assignment: =\n\
    - augmented assignment: +=, -=, *=, /=, &=, |=, ^=, <<, >>=\n- bitwise logic:\
    \ ~, |, ^\n- bitwise shifts: <<, >>\n- boolean logic: !, &&, ||\n- conditional\
    \ evaluation: ? =\n- equality testing: ==, !=\n- calling functions: ()\n- increment\
    \ and decrement: ++, --\n- member selection: ., ->\n- object size: sizeof\n- order\
    \ relations: <, <=, >, =\n- reference and dereference: &, *, []\n- sequencing:\
    \ ,\n- type conversion: (typename)\n\nOperator precedence Table: Table 1.3 is\
    \ comparing the precedence and associativity among various types of operators\
    \ in C. The upper rows in a table have higher precedence than the lower one and\
