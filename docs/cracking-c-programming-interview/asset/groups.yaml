    \ compiled (source program) and pre-compiled (printf.o) files. After merging,\
    \ the linker obtains the executable file, which is loaded by a loader into memory,\
    \ and executed by the CPU.\n\nIt was just an overview of all the phases. We can\
    \ look into the content of all these intermediate files (hello.i, hello.s, hello.o)\
    \ bypassing different parameters to the gcc command. More detail on this will\
    \ take us beyond the topic discussion.\n\nThe most important issue with any programming\
    \ language is managing memory. We will see the memory management and memory organization\
    \ of the C program in the next section.\n\n# Memory management and organization\
    \ of the C program\n\nThe memory organization of the C program depends on how\
    \ variables are organized within a relocatable object file (hello.o). This memory\
    \ representation of the object file can be categorized into more than 10 areas.\
    \ But for our better understanding we will focus on four areas (figure 1.3) which\
    \ are as follows:\n\n+   * Text Area\n* Data Area\n    * Initialized data fragment\n\
    \    * Uninitialized data fragment (bss)\n* Heap Area\n* Stack Area"
