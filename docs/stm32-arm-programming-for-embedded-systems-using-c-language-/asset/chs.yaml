  \ Arm 架构过程调用标准 (`AAPCS`)，因此中断处理程序可以写成普通的 C 函数，而无需任何特殊规定。\n\n### 中断优先级\n\n本节下一个主题是异常和\
  \ IRQ 的优先级概念。如果两个中断同时请求 CPU 注意会发生什么？哪一个优先级更高？在 Arm Cortex-M 中`Reset`、`NMI` 和 `HardFault`\
  \ 异常具有固定优先级，由 Arm 设置且不可更改。在 `Reset`、`NMI` 和 `HardFault` 中，`Reset` 的优先级最高。如表 6-2\
  \ 所示，如果这三个同时激活，将先执行 `Reset`。如果 `NMI` 和 `IRQ` 同时激活，`NMI` 先响应，因为其优先级比 `IRQ` 高。其余异常和\
  \ IRQ 优先级较低且可配置，这意味着它们的优先级级别由程序员设置。可配置的优先级值为 0 到 3 之间的值，3 的优先级最低。\n\n| INT # |\n\
  | :--- | :--- |\n| 0 | *栈指针初始值* |\n| 1 | Reset |\n| 2 | NMI |\n| 3 | Hard Fault\
  \ |\n| 4 | Memory Management Fault |\n| 5 | Bus Fault |\n| 6 | Usage Fault |\n|\
  \ 7 | Reserved |\n| 8 | Reserved |\n| 9 | Reserved |\n| 10 | Reserved |\n\n| 优先级级别\
  \ |\n| :--- | :--- |\n| -3 | 最高 |\n| -2 | |\n| -1 | |\n| Reserved | Reserved Reserved\
