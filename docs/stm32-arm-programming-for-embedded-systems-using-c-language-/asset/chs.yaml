  \n\na. **通用输入输出 (GPIO):** `GPIO` 端口用于与 LED、开关、LCD、键盘等设备接口。\n\n\n我们专门用了许多章节介绍这些特殊用途\
  \ I/O 端口。在本章中，我们将检查 `GPIO` 及其与 LED、开关和七段码 LED 的接口，并展示如何使用 `C` 程序访问它们。\n\n#### Nucleo\
  \ 板上的 I/O 引脚\n在 `STM Arm` 芯片中，通用输入输出端口用字母 `A`、`B`、`C`、`D`、`E`、`F`、`G` 和 `H` 命名。每个端口最多有\
  \ 16 个引脚，并指定为 `PA0-PA15`、`PB0-PB15` 等。注意的是，并不是每个芯片都实现了每个端口的所有引脚。`STM NucleoF446RE`\
  \ 板使用的 `Arm` 芯片来自 `STM32F446` 系列。见图 2-9 和 2-10。\n\n![](img/image00209.jpeg)**图 2\
  \ - 9: STM32F4xx**\n\n\n#### GPIO 寄存器\n\n\n![](img/image00211.jpeg)**表 2 - 3: STM32\
  \ Arm**\n\n`AHB` 允许直接访问外设，而 `APB` 较慢。许多外设通过桥接连接到 `APB` 总线。\n`STM Arm` 中的输出寄存称为 GPIO\
  \ 端口输出数据寄存器 (`GPIOx_ODR`)，其中 `x` 根据给定芯片实现的端口数量可以是 `A`、`B`、`C` 等。它们位于该端口基地址偏移 `0x14`\
  \ 处。\n\n\n\n在 STM Arm 中，方向寄存器是 `GPIOx_MODER` 的一部分，代表 GPIO 模式寄存器。对于每个 GPIO 引脚，`MODER`\
  \ 寄存器中有两个对应的位。这两个位需要置为 `00` 以将端口引脚配置为输入，置为 `01` 为输出。该寄存器还用于设置每个引脚的复用功能模式，并决定它是用于模拟还是数字\
  \ I/O。\n\n![](img/image00216.jpeg)\n位 2y:2y+1 `MODERy[1:0]`: 端口 x 配置位（y = 0..15）\n\
  \n这些位由软件写入，以配置 I/O 方向模式。\n\n- `01`: 通用输出模式\n- `10`: 复用功能模式\n- `11`: 模拟模式（复位状态）\n\
  \n\n参见示例 2-1。\n\n\n在一个给定的电路板上，一个 LED 连接到 `PA5`。找到我们需要写入方向寄存器的值。\n\n\n由于 LED 是输出设备，我们需要向模式寄存器写入\
  \ `0x0400`。注意引脚被指定为 `PA15-PA0`。二进制和十六进制数如下：\n\n`0000 0100 0000 0000 = 0x0400`。\n\
  ### 外设寄存器的时钟使能\n\n在访问外设寄存器之前，我们需要检查时钟使能寄存器。如今大多数数字电子电路都是使用 CMOS 技术构建的，因为在静止状态，CMOS\
  \ 电路几乎不消耗功率。为了节电，Arm 微控制器有方法减慢外设电路时钟或完全停止时钟。\n默认情况下，STM32 Arm 微控制器的 GPIO 模块在上电复位后时钟是禁用的。因此，程序员必须在使用指定的\
  \ I/O 端口或外设之前启用其时钟。这是通过一组属于 `RCC`（复位和时钟控制）的寄存器实现的。对于 STM32F446 芯片，GPIO 时钟使能由 `RCC_AHB1ENR`（AHB1\
  \ 使能寄存器）的低位控制，如图 2 - 15 所示。注意这并不是所有 STM Arm 家族的通用标准。\n\n![](img/image00217.jpeg)\n\
  \n- 位 6 `GPIOGEN`: IO 端口 G 时钟使能。此位由软件设置和清除。0: IO 端口 G 时钟禁用，1: IO 端口 G 时钟开启\n- 位\
  \ 5 `GPIOFEN`: IO 端口 F 时钟使能。此位由软件设置和清除。0: IO 端口 F 时钟禁用，1: IO 端口 F 时钟开启\n- 位 4 `GPIOEEN`:\
  \ IO 端口 E 时钟使能。此位由软件设置和清除。0: IO 端口 E 时钟禁用，1: IO 端口 E 时钟开启\n- 位 2 `GPIOCEN`: IO 端口\
  \ C 时钟使能。此位由软件设置和清除。0: IO 端口 C 时钟禁用，1: IO 端口 C 时钟开启\n- 位 1 `GPIOBEN`: IO 端口 B 时钟使能。此位由软件设置和清除。0:\
  \ IO 端口 B 时钟禁用，1: IO 端口 B 时钟开启\n- 位 0 `GPIOAEN`: IO 端口 A 时钟使能。此位由软件设置和清除。0: IO 端口\
  \ A 时钟禁用，1: IO 端口 A 时钟开启\n\n\n必须注意的是，串口通信模块、定时器和其他外设的时钟在复位时不会开启。根据你使用的 STM32 家族，有几个属于\
  \ `RCC_AHBxENR` 寄存器组的寄存器，例如 `RCC_AHB1ENR` 和 `RCC_AHB2ENR`。还有 `RCC_APBxENR` 组用于开启各种外设的时钟。它们的速度比\
  \ `RCC_AHBx` 选项慢。我们将在相应的章节中讨论它们的时钟配置。\n\n\n许多 STM32 Nucleo 和 Discovery 开发板都有单个或多个用户\
  \ LED。我们所说的用户 LED 是连接到 GPIO 引脚并可以直接编程的 LED。在 STM32F4 Nucleo 板上，用户 LED 是高电平有效的，这意味着当\
  \ I/O 为高电平时，LED 亮起；当 I/O 为低电平时，LED 灭。板上还有其他 LED，如串口链路 LED 和电源 LED。请检查你的开发板用户手册。在\
  \ STM32F446RE Nucleo 板上，有一个用户 LED，指定为 `LD2`。用户 LED 连接到 A 口的 `PA5`，如图 2-16 所示。![](img/image0218.jpeg)\
  \ **图 16：LED 连接**\n\n\n要翻转 STM32 的 LED，必须执行以下步骤：\n1. 将 PA5 设置为输出。\n2. 向 `PA5` 数据寄存器写入高电平。\n\
  4. 向 `PA5` 数据寄存器写入低电平。\n5. 调用延迟函数。\n6. 重复步骤 2-5。\n### 程序 2-1：C 语言翻转 LED\n\n```c\n\
