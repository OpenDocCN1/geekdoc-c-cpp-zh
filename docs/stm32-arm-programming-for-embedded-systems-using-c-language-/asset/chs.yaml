  \n## Arm Cortex 中的特殊功能寄存器\n\n除了传统的 `R0`–`R15` 通用寄存器外，`Arm Cortex-M`核心还有几个新的特殊功能寄存器。这些寄存器用于基于\
  \ `Cortex-M` 的嵌入式系统的程序中。见图 6-7。\n\n![](img/image00304.jpeg)\n**图 6-7：Arm Cortex-M\
  \ 寄存器**\n\n可以使用 `MOV`、`LDR` 和 `STR` 指令访问 `R0`–`R15` 通用寄存器，但这些新的特殊功能寄存器只能通过两个新指令\
  \ `MSR` 和 `MRS` 访问。要操作（清除或设置）特殊功能寄存器的位，我们首先使用 `MSR` 将它们移动到通用寄存器，在更改值后，使用 `MRS` 指令将其移回。表\
  \ 6-6 显示了特殊功能寄存器。\n\n| 寄存器名称 | 特权用途 |\n| :--- | :--- |\n| `MSP` (主栈指针) | 特权 |\n\
  | `PSP` (处理器栈指针) | 特权或非特权 |\n| `PSR` (处理器状态寄存器) | 特权 |\n| `APSR` (应用处理器状态寄存器) |\
  \ 特权或非特权 |\n| `ISPR` (中断处理器状态寄存器) | 特权 |\n| `EPSR` (执行处理器状态寄存器) | 特权 |\n| `PRIMASK`\
  \ (优先级掩码寄存器) | 特权 |\n| `FAULTMASK` (故障掩码寄存器) | 特权 |\n| `BASEPRI` (基础优先级寄存器) | 特权\
  \ |\n| `CONTROL` (控制寄存器) | 特权 |\n\n*注：我们必须使用 `MSR` 和 `MRS` 指令访问上述寄存器*\n\n## 表 6-6：Arm\
  \ Cortex-M 的特殊功能寄存器\n\n### 复习题\n\n1. 判断对错。在 `Reset` 引脚被激活后，`Arm CPU` 在 `Thread mode`\
  \ 下唤醒。\n2. `Arm Cortex-M` 中有多少种处理器模式？给出它们的名称。\n3. 当 `Arm Cortex-M` 复位（Reset）时，从中断向量表中\
  \ `CPU` 取多少字节的数据？它们是什么？\n4. `ISR` 的另一个名称是 __________。\n5. 判断对错。当中断来自异常或 `IRQ` 时，`Arm\
  \ CPU` 会自动切换到 `Handler mode`。\n\n### 第 6.3 节：STM32 Arm I/O 口中断编程\n\n在第 2 章中，我们展示了如何使用\
  \ `GPIO` 端口进行简单的 I/O。我们还展示了一个简单的程序，轮询开关状态并用它来开启或关闭 LED。在本节中，我们将演示如何对 `STM32F4xx`\
  \ 芯片 I/O 口的中断功能进行编程。\n\n让我们先查看 `STM32F4xx` 微控制器的中断向量表。表 6-7 显示了外设中断分配。I/O 口中断通过外部中断\
