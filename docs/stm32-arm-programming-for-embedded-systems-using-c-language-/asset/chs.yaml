  \ 的中断分配。并非所有的 Cortex-M4 芯片都具有前 15 个中断。对于通过 `NVIC` 进入的硬件 IRQ，`NVIC` 会根据 `NVIC` 的编程方式解析优先级。此外，并不是所有的\
  \ IRQ 在所有芯片中都会使用。STM32F466 使用 `IRQ0` 到 `IRQ96`（`INT16-INT112`）。\n\n## 中断延迟\n\n从事件触发中断信号的时刻到\
  \ CPU 开始执行 ISR 代码的时刻称为中断延迟。中断延迟的持续时间还受到中断发生时 CPU 正在执行的指令类型的影响。如果正在执行的指令持续许多指令周期，那么与仅持续一个指令周期的指令相比，所需的时间会更长。在\
  \ Arm Cortex-M 中，由于需要在栈上保存寄存器 `CPSR`、`PC`、`LR`、`R12` 和 `R0-R3` 的内容，延迟增加了额外的时钟周期。\n\
  \n中断延迟的另一个来源是中断优先级。如前所述，当多个中断同时发生时，优先级最高的中断会被优先响应所有其他中断都必须等待。但当低优先级中断正在处理时，高优先级中断可以抢占它，我们将在下一步讨论。\n\
  \n## 中断处理程序中的中断（嵌套中断）\n\n当 Arm 正在执行某个中断的 ISR 时，另一个中断被激活会发生什么？在许多旧 CPU 中，当中断服务程序启动时，所有其他中断会被掩蔽。此时发生的所有中断都必须等待。如果中断服务程序运行时间过长，存在某些中断丢失的风险。中断服务程序可以取消中断屏蔽。但这样做它将允许所有中断抢占它自己。在\
  \ Arm Cortex-M 中，高优先级中断将停止低优先级中断处理程序并启动高优先级中断处理程序。在 Arm Cortex-M 系统中，由软件工程师配置每个异常和\
  \ `IRQ`（`NMI` 和 `HardFault` 除外）的优先级级别，并设置支持嵌套中断的策略。\n\nArm Cortex-M 只允许高优先级中断抢占低优先级中断服务程序。程序员负责为每个\
  \ `IRQ` 分配适当的优先级，以决定中断是否可以抢占另一个的中断处理程序。Arm Cortex-M 中的 `NVIC` 具有捕获等待中断的能力，并跟踪每个中断直到所有中断都被处理完毕。\n\
