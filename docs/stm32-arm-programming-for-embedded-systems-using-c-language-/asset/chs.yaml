  \ 的结果是什么？\n6. 在示例 1-5 中，如果 `var1` 的值为 `0x03`，那么 `var2` 中存储了什么？\n\n### 使用复合运算符进行位运算\n\
  \n\n要设置寄存器中的某位：\n\n```c\n```\n\n其中 `MASK` 是一个在要设置位上为‘1’的数字。\n```c\nregister |= 0x08;\n\
  ```\n\n```c\nregister |= 0x42;\n数字 `0x42` 在第 6 位和第 1 位为‘1’，因此该语句设置了寄存器的第 6 位和第 1\
  \ 位。\n\n要清除寄存器中的某位：\n\nregister &= ~MASK;\n```\n\n\n```c\nregister &= ~0x20;\n```\n\
  \n```c\nregister &= ~0x12;\n数字 `0x12` 在第 4 位和第 1 位为‘1’，因此该语句清除了寄存器的第 4 位和第 1 位。注意，清除位的掩码与设置位的掩码相同，其中要修改的位为‘1’，其余位均为‘0’，区别在于清除位时在语句中对掩码进行了取反处理。\n\
  \n要翻转寄存器中的某位：\n\nregister ^= MASK;\n```\n\n这些示例与设置位类似，因此我们在此跳过。\n### 使用移运算符生成掩码\n\
