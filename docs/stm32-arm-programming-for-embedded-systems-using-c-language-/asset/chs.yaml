  \        }\n    }\n}\n/* 16 MHz SYSCLK */\nvoid delayUs(int n) {\n    int i;\n \
  \   for (; n > 0; n--)\n        for (i = 0; i < 3; i++) ;\n}\n```\n\n参见第 8 章关于使用\
  \ SPI 总线进行 LTC1661 DAC 的 Arm 连接和编程。\n\n### 复习题\n\n1. 在 DAC 中，输入是 ______，输出是 _____。\n\
  2. DAC0808 是一个 ____ 位数模转换器。\n3. DAC808 的输出是 ______。\n4. STM32F4xx 的片内 DAC 具有 ______\
  \ 位分辨率。\n5. 对错：STM32F446RE 芯片的片内 DAC 有两个通道 DAC1 和 DAC2。\n\n### 复习题答案\n\n**第 7.1\
  \ **\n1. 阶数（分辨率）和 `V[ref]` 电压\n2. 8\n3. 正确\n4. 1.28 V / 256 = 5 mV\n5. (a) 0.7 V\
  \ / 5 mV = 140 (十进制)，二进制为 10001100 (b) 1 V/ 5 mV = 200 (十进制)，二进制为 11001000\n\n\n\
  \n\n\nSPI 总线最初由摩托罗（Motorola，后变为 Freescale，后被 NXP 收购）发起，但近年来已被许多芯片公司广泛使用。SPI 设备仅使用\
  \ 2 根引脚进行数据传输，称为 `SDI`（数据输入）和 `SDO`（数据输出），而不是传统总线使用的 8 个或更多引脚。这种数据引脚的减少大幅降低了封装尺寸和功耗，使其成为对空间或引脚数量有主要要求的应用的理想选择。SPI\
  \ 总线具有 `SCLK`（串行时钟）引脚，用于同步两个芯片之间的数据传输。SPI 总线的最后一个引脚是 `CE`（片选），用于启动和终止数据传输。这四根引脚\
  \ `SDI`、`SDO`、`SCLK` 和 `CE` 使 SPI 成为 4 线接口。参见使 SPI 成为 4 线接口。\n\n![](img/image00355.jpeg)**图\
  \ 8-1：SPI 总线与传统并行总线连接微控制器**\n\n在许多芯片中，`SDI`、`SDO`、`SCLK` 和 `CE` 信号也被替命名为 `MOSI`、`MISO`、`SCK`、接口总线。在\
  \ 3 线接口总线，我们拥有 `SCLK` 和 `CE`，且只有一根数据传输引脚。当 `SDI` 和 `SDO` 数据引脚连接在一起时，SPI 4 线总线变为\
  \ 3 线接口。然而，SPI 和 3 线设备在数据传输线上存在一些主要差异。许多设备同时支持 SPI 和 3 线协议。\n\n## SPI 如何工作\n\nSPI\
  \ 由两个移位寄存器组成，一个在主站，另一个在从站中。此外，主站有一个时钟发生器，为移位寄存器产生时钟。\n\n![](img/image00356.jpeg)**图\
  \ 8-2：SPI 架构**\n\n![](img/image00357.jpeg)**图 8-3：主 SPI 并行连接到多个从机 SPI**\n\n![](img/image00358.jpeg)**图\
  \ 8-4：主 SPI 串行连接到多个从机 SPI**\n\n图 8-2、8-3 和 8-4 显示了 SPI 主站和从站的连接。如图 8-2 所示，主移位寄存器的串出引脚通过\
  \ `MOSI`（主出从入）连接到从站移位寄存器的串入引脚，主站移位寄存器的串入引脚通过 `MISO`（主入从出）连接到从站移位寄存器的串出引脚。主站时钟发生器为主、从站移位寄存器提供时钟。移位寄存器的时钟输入可以是下降沿或上升沿触发。这稍后将讨论。\n\
  \n在 SPI 中，移位寄存器的长度为 8 位。这意味着在 8 个时钟脉冲后，两个移位寄存器的内容将交换。当主站想要发送一个字节的数据时，它将该字节放入其移位寄存器并产生\
  \ 8 个时钟脉冲。8 个时钟脉冲后，该字节被传输到从站移位寄存器。当主站想要接收一个字节的数据时，从站侧应将字节放入其移位寄存器，8 个时钟脉冲后，数据将被主站移位寄存器接收。必须注意的是，SPI\
  \ 是全双工的，这意味着它可以同时发送和接收数据。\n\n## SPI 设备的时钟极性和相位\n\n正如我们之前在 UART 通信中提到的，发送器和接收器必须同意时钟频率（波特率）。在\
  \ SPI 通信中，主站和从站使用相同的时钟，但主从站必须就数据同意时钟极性和相位。时钟极性意味着时钟空闲时的时钟信号电平。每个时钟脉冲有两个边缘，前沿和尾沿。时钟相位决定了使用前沿还是尾沿来采样数据。\n\
  \n当时钟极性为 0 时，时钟空闲值为零；而当时钟极性为 1 时，时钟空闲值为一。当时钟相位为 0 时，数据在前沿（第一个）时钟边缘采样；而当时钟相位为 1 时，数据在尾沿（第二个）时钟边缘采样。注意，如果时钟空闲值为零，前沿（第一个）时钟边缘是上升沿，但如果时钟空闲值为一，前沿（第一个）时钟边缘就是下降沿。见表\
  \ 8-1 以及图 8-4 和 8-5。\n\n![](img/image00359.jpeg)****图 8-5：SPI 时钟极性和相位模式 0 (CPOL\
  \ = 0, CPHA = 0) 和模式 2 (CPOL = 1, CPHA = 0)**\n\n![](img/image00360.jpeg)****图 8-6：SPI\
  \ 时钟极性和相位模式 1 (CPOL = 0, CPHA = 1) 和模式 3 (CPOL = 1, CPHA = 1)**\n\n### 表 8-1：SPI\
  \ 时钟极性和相位复习题\n\n| 时钟 | 相位 | 数据读取和改变时间 | 模式 |\n| :--- | :--- | :--- | :--- |\n| 0\
  \ | 0 | 在上升沿读取，在下降沿改变 | 0 |\n| 0 | 1 | 在下降沿读取，在上升沿改变 | 1 |\n| 1 | 0 | 在下降沿读取，在上升沿改变\
  \ | 2 |\n| 1 | 1 | 在上升沿读取，在下降沿改变 | 3 |\n\n1. 对或错。SPI 是异步的。\n2. 对或错。在 SPI 协议中，时钟是由主站产生的。\n\
  3. 对或错。SPI 共享时钟。\n4. 对或错。为了连接设备我们使用片选。\n\n## 8.2 节：STM32 中的 SPI 编程\n\nSTM32F4xx\
  \ 芯片带有多个 SPI 模块。SPI 模块也支持 I2S 协议。在本节中，我们将检查 SPI 模块基地址如下：\n\n**SPI 模块基地址**\n- SPI1：`0x40013000\
  \ - 0x40013FFF`\n- SPI2：`0x40013800 - 0x40013BFF`\n- SPI3：`0x40013C00``（此处范围不全）\n\
  \n为了编程 SPI，我们需要检查与其相关的寄存器。表 8-3 显示了部分寄存器。正如第 4 章所示，UART 没有这样的时钟。\n\n| 寄存器名称 | 功能\
  \ | 偏移量 |\n| :--- | :--- | :--- |\n| SPI_CR1 | 控制 1 | 0x00 |\n| SPI_CR2 | 控制 2 |\
  \ 0x04 |\n| SPI_SR | 状态 | 0x08 |\n| SPI_DR | 数据 | 0x0C |\n\n**表 8-3：STM32xx SPI\
  \ 寄存器**\n\n### 配置 SPI 模块启用时钟\n\n在访问 SPI 寄存器之前必须启用 SPI 时钟。SPI 连接到 APBx 外设时钟。STM32F4xx\
  \ 芯片带有四个 SPI 模块，分别是 SPI1、SPI2、SPI3 和 SPI4。根据我们要使用的哪个 SPIx，我们使用 RCC_APB1R 或 RCC_APB2R\
  \ 来启用所需 SPI 模块的时钟。SPI2 和 SPI3 由 RCC_APB1R 寄存器控制，SPI1 和 SPI4 由 RCC_APB2R 寄存器控制。见下方图形。\n\
  \n![](img/image258.jpeg)\n\n位 15 **SPI3EN**：SPI3 时钟启用\n该位由软件设置和清除。\n0：SPI3 时钟禁用\n\
  1：SPI3 时钟启用\n位 14 **SPI2EN**：SPI2 时钟启用\n该位由软件设置和清除。\n0：SPI2 时钟禁用\n1：SPI2 时钟启用 1：SPI3\
  \ 时钟启用\n\n**图 8-7：RCC APB1 外设时钟启用寄存器 (RCC_APB1R)**\n\n![](img/image00326.jpeg)\n\
  \n位 13 **SPI4EN**：SPI4 时钟启用\n该位由软件设置和清除。\n0：SPI4 时钟禁用\n1：SPI4 时钟启用\n位 12 **SPI1EN**：SPI1\
  \ 时钟启用\n该位由软件设置和清除。\n0：SPI1 时钟禁用\n1：SPI1 时钟启用\n\n**图 8-8：RCC APB2 外设时钟启用寄存器 (RCC_APB2R)**\n\
  \n***SPI 控制寄存器***\n\n\n\n\n`SPI_CR1`（控制 1）和 `CR2`（控制 2）寄存器设置了 SPI 配置。参见图 8-9 和 8-10。它们描述了这些寄存器中每个位的功能。虽然传统的\
  \ SPI 仅使用 8 位数据，但 SPI 模块也允许传输 16 位数据，如 `DFF`（数据帧格式）`CR1` 寄存器所示。STM32F4xx 中的 SPI\
  \ 模块同时支持 Motorola 和 TI 协议。默认为 Motorola，我们将将其保持不变，因为它是最常用的协议。\n\n![](img/image00361.jpeg)\n\
  \n位 13 `CRCEN`: 硬件 CRC 计算使能位\n\n0: 禁用 CRC 计算\n\n1: 启用 CRC 计算\n\n位 12 `CRCNEXT`:\
  \ 传输下一次 CRC\n\n0: 数据阶段（无 CRC 阶段）\n\n1: 下一次传输为 CRC（CRC 阶段）。参见 `STM32F4xx Ref. Manual`\n\
  \n位 11 `DFF`: 数据帧格式\n\n0: 选用 8 位数据帧格式进行发送/接收\n\n1: 选用 16 位数据帧格式进行发送/接收\n\n位 6 `SPE`:\
  \ SPI 使能位\n\n0: 外设禁用\n\n1: 外设使能\n\n位 5:3 `BR[2:0]`: 波特率控制\n\n000: fPCLK/2 100: fPCLK/32\n\
  \n001: fPCLK/4 101: fPCLK/64\n\n010: fPCLK/8 110: fPCLK/128\n\n011: fPCLK/16 111:\
  \ fPCLK/256 位 2 `MSTR`: 主机选择位\n\n0: 从机配置\n\n1: 主机配置\n\n位 1 `CPOL`: 时钟极性\n\n0: 空闲时\
  \ CK 为 0\n\n1: 空闲时 CK 为 1\n\n位 0 `CPHA`: 时钟相位\n\n0: 第一次时钟跳变为第一个数据采样边沿\n\n1: 第二次时钟跳变为第一个数据采样边沿\n\
  \n\n\n**图 8-9: STM32F4xx 中的 SPI 控制 1 (SPI_CR1) 寄存器**\n\n![](img/image00362.jpeg)\n\
  \n位 7 `TXEIE`: 发送缓冲区空中断使能\n\n0: TXE 中断被屏蔽\n\n1: TXE 中断未被屏蔽。当 TXE 标志位置位时产生中断请求。位\
  \ 6 `RXNEIE`: 接收缓冲区非空中断使能\n\n0: RXNE 中断被屏蔽\n\n1: RXNE 中断未被屏蔽。当 RXNE 标志位置位时产生中断请求。位\
  \ 5 `ERRIE`: 错误中断使能\n\n此位控制发生错误条件（SPI 模式下的 OVR, CRCERR, MODF, FRE，以及 I²S 模式下的 UDR,\
  \ OVR, FRE）时产生中断。\n\n0: 错误中断被屏蔽\n\n1: 启用错误中断\n\n位 4 `FRF`: 帧格式\n\n0: SPI Motorola\
  \ 模式\n\n1: SPI TI 模式\n\n**图 8-10: STM32F4xx 中的 SPI_CR2 (控制 2) 寄存器**\n\n当 `SPE` 设置时（`SPE=1`），SPI\
  \ 模块被使能。\n\n### 时钟极性和时钟相位\n\n正如第 8.1 节所述，我们需要选择与连接到 SPI 的设备一致的时钟极性和相位相位。在 STM32F4xx\
  \ 中，时钟极性由 `SPI_CR1` 寄存器中的 `CPOL` 位决定，时钟相位由 `CPHA` 位决定。\n\n### 主机或从机\n\n11B. 主机是产生时钟并驱动\
  \ SCLK 引脚的设备。从机使用 SCK 引脚作为 SPI 时钟的设备。我们使用 SPI 控制寄存器 1（`SPI_CR1`）中的 `MSTR`（主机选择）位将\
  \ STM32F4xx 芯片中的 SPI 模块指定为 SPI 主机或 SPI 从机。每个模块都是相互独立的。其中某些模块可以配置为主机，另一些则配置为从机。\n\
  \n![](img/image00363.jpeg)**图 8-11A: 使用 STM32F4xx SPI 模块作为主机**\n\n![](img/image00364.jpeg)**图\
  \ 8-11B: 使用 STM32F4xx SPI 模块作为主机**\n\n### 设置波特率\n\n与其他外设一样，SPI 时钟源自 APBx 时钟，该时钟通过\
  \ AHB 和 APBx 分频器来自 SYSCLK。在 SPI 模块中，`SPI_CR1` 寄存器中的 `BR` 位用于设置时钟速率。参见示例 8-1 和 8-2。\n\
  \n**示例 8-1**\n\n假设 16MHz 的 SYSCLK 时钟频率输入 SPI 模块。为波率 (a) 1M、(b) 500K 和 (c) 62,500\
  \ 寻找 `SPI_CR1` 寄存器 `BR`（波特率）位的值。\n\n**解**\n\n(a) 16 MHz / 1MHz = 16，因此在 `SPI_CR1`\
  \ 寄存器的 `BR` 位上使用 `011`（二进制）。(b) 16 MHz / 500KHz = 32，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用\
  \ `100`。\n\n(c) 16 MHz / 62,500 = 256，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `111`。\n\n**示例\
  \ 8-2**\n\n假设 16MHz 的 SYSCLK 时钟频率输入 SPI 模块。为波特率 (a) 1M、(b) 500K 和 (c) 62,500 寻找\
  \ `SPI_CR1` 寄存器的 `BR`（波特率）位的值。\n\n**解**\n\n(a) 16 MHz / 1MHz = 16，因此在 `SPI_CR1`\
  \ 寄存器的 `BR` 位上使用 `011`（二进制）。(b) 16 MHz / 500KHz = 32，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用\
  \ `100`。\n\n(c) 16 MHz / 62,500 = 256，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `111`。\n\n###\
  \ 数据寄存器\n\n与其他外设一样，SPI 时钟源自 APBx 时钟，该时钟通过 AHB 和 APBx 分频器来自 SYSCLK。在 SPI 模块中，`SPI_CR1`\
  \ 寄存器中的 `BR` 位用于设置时钟速率。参见示例 8-1 和 8-2。\n\n**示例 8-1**\n\n假设 16MHz 的 SYSCLK 时钟频率输入\
  \ SPI 模块。为波特率 (a) 1M、(b) 500K 和 (c) 62,500 寻找 `SPI_CR1` 寄存器的 `BR`（波特率）位的值。\n\n**解**\n\
  \n(a) 16 MHz / 1MHz = 16，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `011`（二进制）。(b) 16 MHz / 500KHz\
  \ = 32，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `100`。\n\n(c) 16 MHz / 62,500 = 256，因此在 `SPI_CR1`\
  \ 寄存器的 `BR` 位上使用 `111`。\n\n**示例 8-2**\n\n假设 16MHz 的 SYSCLK 时钟频率输入 SPI 模块。为波特率 (a)\
  \ 1M、(b) 500K 和 (c) 62,500 寻找 `SPI_CR1` 寄存器的 `BR`（波特率）位的值。\n\n**解**\n\n(a) 16 MHz\
  \ / 1MHz = 16，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `011`（二进制）。(b) 16 MHz / 500KHz = 32，因此在\
  \ `SPI_CR1` 寄存器的 `BR` 位上使用 `100`。\n\n(c) 16 MHz / 62,500 = 256，因此在 `SPI_CR1` 寄存器的\
  \ `BR` 位上使用 `111`。\n\n### 数据寄存器\n\n与其他外设一样，SPI 时钟源自 APBx 时钟，该时钟通过 AHB 和 APBx 分频器来自\
  \ SYSCLK。在 SPI 模块中，`SPI_CR1` 寄存器中的 `BR` 位用于设置时钟速率。参见示例 8-1 和 8-2。\n\n**示例 8-1**\n\
  \n假设 16MHz 的 SYSCLK 时钟频率输入 SPI 模块。为波特率 (a) 1M、(b) 500K 和 (c) 62,500 寻找 `SPI_CR1`\
  \ 寄存器的 `BR`（波特率）位的值。\n\n**解**\n\n(a) 16 MHz / 1MHz = 16，因此在 `SPI_CR1` 寄存器的 `BR`\
  \ 位上使用 `011`（二进制）。(b) 16 MHz / 500KHz = 32，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `100`。\n\
  \n(c) 16 MHz / 62,500 = 256，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `111`。\n\n**示例 8-2**\n\n\
  假设 16MHz 的 SYSCLK 时钟频率输入 SPI 模块。为波特率 (a) 1M、(b) 500K 和 (c) 62,500 寻找 `SPI_CR1` 寄存器的\
  \ `BR`（波特率）位的值。\n\n**解**\n\n(a) 16 MHz / 1MHz = 16，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用\
  \ `011`（二进制）。(b) 16 MHz / 500KHz = 32，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `100`。\n\n(c)\
  \ 16 MHz / 62,500 = 256，因此在 `SPI_CR1` 寄存器的 `BR` 位上使用 `111`。\n\n数据寄存器\n\n（注：由于原文中存在大量重复段落，翻译时已根据“不要重复输出原文”的原则进行了去重处理，保留了所有核心逻辑和示例说明。）\n\
  \n\n\n并不是所有的引脚都需要配置。例如，如果程序只向从设备写入数据而从不读取，则 `MISO` 引脚将不使用。从选引脚（Slave Select）专门用于硬件从选。如果使用软件从选，则可以使用任何可用的\
  \ GPIO 输出引脚作为从选。由于 STM32F 设备的硬件从选功能应用非常有限，我们将仅使用软件从选。\n\n对于引脚选择，我们首先必须使用 `GPIOx_MODER`\
  \ 选择复用功能。之后，根据使用的引脚，使用 `GPIOx_AFRL` 从表 8-5 中选择 `AF4` 或 `AF5`。\n\n![](img/image00367.jpeg)\
  \ **表 8-5：STM32F446RE 的替代引脚功能复用（完整列表见附录 B）**\n\n![](img/image00216.jpeg)\n\n位 `2y:2y+1`\
  \ `MODERy[1:0]`：端口 x 配置位（y = 0..15）\n\n这些位由软件写入以配置 I/O 方向模式。00：输入（复位状态）\n\n01：通用输出模式\n\
  \n10：复用功能模式\n\n11：模拟模式\n\n**图 8-14A：GPIOx_MODER**\n\n![](img/image00227.jpeg)\n\n\
  位 `31:0` `AFRLy`：端口 x 位 y 的替代功能选择（y = 0..7）\n\n这些位由软件写入以配置复用功能 I/O `AFRLy` 选择：\n\
  \n0000: AF0 1000: AF8\n0001: AF1 1001: AF9\n0010: AF2 1010: AF10\n0011: AF3 1011:\
  \ AF11\n0100: AF4 1100: AF12\n0101: AF5 1101: AF13\n0110: AF6 1110: AF14\n0111:\
  \ AF7 1111: AF15\n\n**图 8-14B：GPIOx_AFRL 寄存器**\n\n### 使用软件控制从选传输数据\n\nSTM32F 设备的硬件从选信号在\
  \ SPI 模块启用时有效，在 SPI 模块禁用时撤销。这对于许多外设从设备不起作用，因为这些设备需要从选信号的下降沿来使数据传输生效。外设传输从选仅在 STM32F7\
  \ 系列设备可用。因此我们在这里只讨论软件控制从选。此外，使用软件控制从选有几个优点。\n\n使用软件控制从选允许我们用一个 SPI 模块并行共享多个从设备。每个从设备都有独立的从选信号。只有当其从选启用时，时钟和数据才会影响该从设备。软件控制从选的另一个优势可以在一次事务中传输多个字节的数据，正如我们在下一节看到的，这对于某些从设备可能是必要的。\n\
  \n对于软件控制从选，程序需要在向 `Data` 寄存器写入数据之前先使从选信号有效以启动传输。在写入传输的所有字节后，程序需要等待 `SPI_SR`（状态寄存器）中的\
  \ `BSY` 标志（第 7 位）置位，然后再撤销从选。从选信号通常是低电平有效，但不总是如此。\n\n以下是使用软件从选为 STM32F4xx 配置 SPI\
  \ 传输字节数据的步骤：\n\n1. 在 `RCC_APBxENR` 寄存器中开启 SPI 时钟。\n2. 在 `RCC_AHB1ENR` 寄存器中开启 `GPIOx`\
  \ 时钟。\n3. 通过 `GPIOx_MODER` 和 `GPIOx_AFRy` 寄存器配置 SPI 的端口引脚。\n4. 通过 `GPIOx_MODER`\
  \ 寄存器配置从选引脚。\n5. 配置 `SPI_CR1` 寄存器以选择位顺序、时钟极性、时钟相位、波特率、SPI 主模式、数据帧大小等。\n6. 清空或保持\
  \ `SPI_CR2` 默认值。\n7. 通过设置 `SPI_CR1` 寄存器的 `SPE`（SPI 启用）位开启 SPI。\n8. 监控 `SPI_SR`（状态）寄存器的\
  \ `TXE`（传输缓冲区空）标志位，直到发送数据寄存器为空。\n9. 使从选引脚有效。\n10. 将要传输的数据写入 `SPI_DR`（数据）寄存器。\n11.\
  \ 等待 `SPI_SR` 中的 `BSY` 标志清除，然后撤销从选。\n12. 若要传输另一个字符，返回步骤 8。\n\n信号连接见下图。\n\n![](img/image00368.jpeg)\
  \ **程序 8-1：通过 SPI 端口发送从 A 到 Z 的字符**\n\n```c\n /* p8_1.c: 使用 SPI1 发送 A 到 Z 字符\n*\n\
  * SPI1 配置为主机模式并使用软件从选。 \n* 时钟频率设置为 1 MHz。极性/相位为 0, 0\n*\n* PA7 MOSI\n* PA5 SCK\n\
  * PA4 SS\n*\n* 此程序已在 Keil uVision v5.24a 和 DFP v2.11.0 经过测试 */\n#include \"stm32f4xx.h\"\
  \n\nvoid delayMs(int n);\n\nvoid SPI1_init(void);\n\nvoid SPI1_write(unsigned char\
  \ data);\n\nint main(void) { \n    char c;\n    SPI1_init();\n    while(1) {\n \
  \       for (c = 'A'; c <= 'Z'; c++) {\n            SPI1_write(c);\n        }\n\
  \    }\n}\n\nvoid delayMs(int n) {\n    while (n--) {\n        for (int i=0; i<1000;\
  \ i++);\n    }\n}\n\nvoid SPI1_init(void) {\n    RCC_APB2ENR |= RCC_APB2ENR_SPI1;\
  \ // 开启 SPI\n    RCC_AHB1ENR |= RCC_AHB1ENR_GPIOA; // 开启 GPIO 时钟\n    GPIOA->MODER\
  \ &= ~(GPIO_MODER_7 | GPIO_MODER_5 | GPIO_MODER_4);\n    GPIOA->MODER |= (2 << 14)\
  \ | (2 << 10) | (2 << 8); // PA7, PA5, PA4 复用功能\n    GPIOA->AFRL &= ~(0xF << 28)\
  \ | (0xF << 20) | (0xF << 16);\n    GPIOA->AFRL |= (5 << 28) | (5 << 20) | (5 <<\
  \ 16); // PA7, PA5, PA4 AF5\n    SPI1->CR1 |= (SPI_CR1_M0 | SPI_CR1_CSK | SPI_CR1_CPHA\
  \ | SPI_CR1_BR1 | SPI_CR1_BR0);\n    SPI1->CR2 = 0;\n    SPI1->CR1 |= SPI_CR1_SPE;\
  \ // 开启 SPI\n}\n\nvoid SPI1_write(unsigned char data) {\n    while (!(SPI1->SR &\
  \ SPI_SR_TXE));\n    SPI1->DR = data;\n    while (SPI1->SR & SPI_SR_BSY);\n}\n```\n\
  \n\n\n将输入 Reg 的现有内容加载到两个 DAC Reg 中。输出更新。部分唤醒。\n\n加载输入 Reg A。将输入 Reg A 的新内容和 Reg\
  \ B 的现有内容加载到 DAC Reg。输出更新。加载输入 Reg B。将输入 Reg A 的现有内容和 Reg B 的新内容加载到 DAC Reg。输出更新。\n\
