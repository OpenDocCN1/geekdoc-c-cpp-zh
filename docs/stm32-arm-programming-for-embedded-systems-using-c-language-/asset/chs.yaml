  011: 3/4 ≤ fifo_level < full（满）\n100: FIFO 为空\n101: FIFO 满\nothers：无意义\n\n这些位在直接模式（DMD）下无意义。\n\
  \nBit 0 `FEIE`：FIFO 错误中断允许\n\n此位由软件设置和清除。\n\n0：禁用 FE 中断\n1：启用 FE 中断\n\n## DMA 流道中断寄存器\
  \ (DMA_SxR)\n\n通过设置 `EN` 位启用 DMA 流道。在配置 DMA 流道之前，应向 `EN` 位写入 `0` 并禁用流道，直到读回的 `EN`\
  \ 位为 `0`。参见 `DMA_SxCR` 寄存器。\n\n## DMA 流道数据计数寄存器 (DMA_SxNDTR)\n\n数据计数寄存器应写入所需的传输次数。在每次数据传输后，该数值会递减。当数值变为零时，传输完成。要传输的数据项数量可以从\
  \ 0 到 65535。见下图。\n\n![](img/image0444.jpeg)\n\nBits 31:16 预留，必须保持复位值。\n\nBits 15:0\
  \ `NDT[15:0]`：要传输的数据项（0 到 65535）\n\n此寄存器仅在流道被禁用时可写入。当流道启用时，此寄存器为只读，表示待传输的数据项。此寄存器在每次\
  \ DMA 传输后递减。\n\n一旦传输完成，此寄存器可以保持为零（当流道处于普通模式时），或者在以下情况下自动重新加载之前编程的值：\n\n– 当流道被配置为循环模式时。\n\
  – 当将 `EN` 位设置为 '1' 重新启用流道时。\n\n如果此寄存器的值为零，即使流道启用也无法进行任何事务。**图 13-7：DMA 流道 x 数据计数寄存器\
  \ (DMA_SxNDTR, x = 0..7)**\n\n## DMA 流道外设地址寄存器 (DMA_SxPAR)\n\n此寄存器保存外设地址。在内存到外设的传输期间，数据被写入此寄存器指定的位置；在外设到内存的传输期间，从该位置读取数据。见下方的\
  \ `(DMA_SxPAR)` 寄存器。\n\n![](img/image0445.jpeg)\n\nBits 31:0 `PAR[31:0]`：外设地址\n\n\
  读/写数据的外设寄存器基地址。这些位受写保护，且仅当 `DMA_SxCR` 寄存器中的 `EN` 位为 '0' 时才能写入。\n\n**图 13-8：DMA 流道\
  \ x 外设地址寄存器 (DMA_SxPAR, x = 0..7) DMA 流道内存 0 地址寄存器 (DMA_SxM0AR)**\n\n此寄存器保存内存中数据缓冲区的地址。在外设到内存的传输期间，数据被写入此寄存器指定的位置；在内存到外设的传输期间，从该位置读取数据。见下方的\
  \ `DMA_SxM0AR` 寄存器。\n\n![](img/image0446.jpeg)\n\nBits 31:0 `M0A[31:0]`：内存 0 地址\n\
  \n读/写数据的内存区域 0 基地址。\n\n这些位受写保护。仅在满足以下条件时才能写入：\n\n– 流道被禁用（`DMA_SxCR` 寄存器中的 `EN` 位为\
  \ '0'）或\n– 流道启用（`DMA_SxCR` 寄存器中 `EN='1'`）且 `DMA_SxCR` 寄存器中的 `CT` 位为 '1'（在双缓冲模式下）。\n\
  \n**图 13-9：DMA 流道 x 内存 0 地址寄存器 (DMA_SxM0AR, x = 0..7)**\n\n## DMA 流道内存 1 地址寄存器 (DMA_SxM1AR)\n\
  \n此寄存器仅在启用双缓冲模式时使用。当当前使用缓冲区 1 时，其用法与上一个寄存器相同。见下方的 `DMA_SxM1AR` 寄存器。\n\n![](img/image0447.jpeg)\n\
  \nBits 31:0 `M1A[31:0]`：内存 1 地址（用于双缓冲模式）\n\n读/写数据的内存区域 1 基地址。\n\n此寄存器仅用于双缓冲模式。\n\
  \n这些位受写保护。仅在满足以下条件时才能写入：\n\n– 流道被禁用（`DMA_SxCR` 寄存器中的 `EN` 位为 '0'）或\n– 流道启用（`DMA_SxCR`\
  \ 寄存器中 `EN='1'`）且 `DMA_SxCR` 寄存器中的 `CT` 位为 '0'。\n\n**图 13-10：DMA 流道 x 内存 1 地址寄存器\
  \ (DMA_SxM1AR, x = 0..7)**\n\n## DMA 流道 FIFO 寄存器 (DMA_SxFCR)\n\n每个 DMA 流道都关联一个 FIFO（先进先出缓冲区）以提高性能。此寄存器用于配置\
  \ FIFO。见下方的 `DMA_SxFCR` 寄存器。\n\n![](img/image0448.jpeg)Bits 31:8 预留，必须保持复位值。\n\n\
  Bit 7 `FEIE`：FIFO 错误中断允许\n\n此位由软件设置和清除。\n\n0：禁用 FE 中断\n1：启用 FE 中断\n\nBit 6 预留，必须保持复位值。\n\
  \nBits 5:3 `FS[2:0]`：FIFO 状态 \n\n这些位为只读。\n\n000: 0 < fifo_level < 1/4\n001: 1/4\
  \ ≤ fifo_level < 1/2\n010: 1/2 ≤ fifo_level < 3/4\n011: 3/4 ≤ fifo_level < full（满）\n\
  100: FIFO 为空\n101: FIFO 满\nothers：无意义\n\n这些位在直接模式（DMD）下无意义。\n\nBit 2 `DMD`：直接禁用\n\
  \n此位由软件设置和清除。\n\n0：禁用直接模式\n1：启用直接模式\n\nBit 1 `TH[1:0]`：FIFO 阈值\n\n这些位为只读。\n\n00:\
  \ 0 < fifo_level < 1/4\n001: 1/4 ≤ fifo_level < 1/2\n010: 1/2 ≤ fifo_level < 3/4\n\
  011: 3/4 ≤ fifo_level < full（满）\n100: FIFO 为空\n101: FIFO 满\nothers：无意义\n\n这些位在直接模式（DMD）下无意义。\n\
  \nBit 0 `FEIE`：FIFO 错误中断允许\n\n此位由软件设置和清除。\n\n0：禁用 FE 中断\n1：启用 FE 中断\n\n\n\n\n# 图\
  \ 13-13: DMA 高中断标志清除寄存器 (DMA_HIFCR)\n\n## UART 的 DMA 使用\n在我们目前完成的所有 UART2 示例中，我们没有使用任何\
  \ DMA 选项。UART 的 DMA 选项通过 `USART_CR3` 寄存器中的 `DMAT`（DMA 发送器）和 `DMAR`（DMA 接收器）位来选择。见下图。\n\
  \n![](img/image00451.jpeg)\n\n位 7 `DMAT`: DMA 启用发送器 位 6 `DMAR`: DMA 启用接收器 此位由软件设置/清除\
  \ 此位由软件设置/清除 1: 启用传输 DMA 模式。 1: 启用接收 DMA 模式。 0: 禁用传输 DMA 模式。 0: 禁用接收 DMA 模式。\n\n\
  # 图 13-14: USART 控制寄存器 3 (USART_CR3)\n\n## DMA 内存到 USART2 发送器的示例\n在此示例中，我们将配置 DMA\
  \ 控制器将数据从内存传输到 USART2 发送器。选择 USART2 是因为它连接到 NucleoF446 板上 ST-Link USB 连接的虚拟 COM\
  \ 口。不需要额外的硬件即可获得传输输出。\n\n从本章表 13-1 中，可以看到 USART2_TX 连接到 DMA1 流 6 的通道 4。\n\nUSART2\
  \ 的初始化方式与第 4 章相同。此外，启用了传输完成中断。通过在 `RCC_AHB1ENR` 中启用时钟初始化 DMA1 控制器，并在 NVIC 中启用中断。中断章节（第\
  \ 6 章）表 6-7 显示 IRQ 17 被分配给 DMA1 Stream6 全局中断。\n\n### 配置 DMA 流的步骤\n1. 在修改配置之前必须禁用\
  \ DMA 流。通过向流控制寄存器的 `EN` 位写入 `0` 来禁用它，然后等待 `EN` 位读取返回为 `0`。\n2. 应清除中断标志。\n3. 在外设地址寄存器（Peripheral\
  \ Address Register）中加载 USART2 发送数据寄存器的地址。 4. 在内存 0 地址寄存器（Memory 0 Address Register）中加载数据缓冲区的起始地址。5.\
  \ 在数据数量寄存器（Number of Data Register）中加载数据缓冲区的字节计数。6. 将通道选择字段设置为所需的通道（在本例中为通道 4）。7.\
  \ 设置数据大小（在本例中为 8 位）、内存地址递增、外设地址不递增以及方向（内存到外设）。8. 启用传输完成中断和错误中断。9. 禁用 FIFO。10. 启用\
  \ DMA 流。11. 通过向传输完成中断标志写入 `0` 来清除 UART 传输完成中断标志。12. 通过设置控制寄存器 3 的 `DMAT` 位启用 USART2\
  \ DMA 发送。\n\n一旦设置了 USART2 `DMAT` 位，数据传输将立即开始。当数据传输完成后，将同时发生 DMA 中断和 USART2 中断。在实践中，你可能只需要处理一个中断。在这种情况下，DMA\
  \ 中断可能是更理想的选择，因为它涵盖了 DMA 数据传输错误中断。在下方的示例程序中，我们在 DMA 中断处理程序中留了一个错误处理的占位符。USART2 中断处理程序设置一个标志，让主函数知道数据传输已完成。\n\
  \n### 程序 13-1：通过 DMA 向 USART2 发送字符串\n```c /* p13_1.c 通过 DMA 向 USART2 发送字符串\n*\n\
