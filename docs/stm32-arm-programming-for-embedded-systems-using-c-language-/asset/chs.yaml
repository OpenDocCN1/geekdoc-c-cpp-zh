- "# STM32 Arm 嵌入式系统编程：C 语言与 STM32 Nucleo 使用指南\n\n\n\n![](img/cover00466.jpeg)\n\n\
  \n\n\n\n## “视人如富含无价宝石的金矿。唯有教育能使其揭示宝藏，并使人类从中受益。” Baha'u'llah\n\n### 献辞\n*致 BIHE 大学的教职员工和学生，感谢他们的奉献与坚持。*\n\
  \n\n自 21 世纪初初以来，已有数百家公司许可了 `Arm` CPU，且许可数量正在飞速增长。虽然许可方必须遵循 `Arm` CPU 架构和指令集，但他们可以随心所欲实现外设，如\
  \ I/O 端口、`ADCs`、定时器（Timers）、`DACs`、`SPIs`、`I2Cs` 和 `UARTs`。换句话说，虽然可以为 `Arm` 芯片编写汇编程序并在任何\
  \ `Arm` 芯片上运行，但为公司 *A* 的 `Arm` 芯片 I/O 端口编写的程序将无法在公司 *B* 的 `Arm` 芯片上运行。这是因为特殊功能寄存器及其访问\
  \ I/O 端口的物理地址位置并未标准化，每个许可方的实现方式都不同。我们将该系列的第一卷专门用于 `Arm` 汇编语言编程和架构，因为汇编语言是标准的，无论由谁制造，都能在任何\
  \ `Arm` 芯片上运行。我们的 `Arm` 汇编书籍名为《*Arm 汇编语言编程与架构》，可在 Amazon 购买。参见以下链接：\n\nhttp://www.microdigitaled.com/ARM/ARM_ASM_books.htm\n\
  \n对于 `Arm` 的外设编程，我们别无选择只能为每个厂商专门编写卷。本书介绍了 `STM32 Arm` 芯片的外设编程。在全书中，我们使用 `C` 语言访问特殊功能寄存器并为\
  \ `STM32F4xx` 外设编程。我们在第 2 章中为那些想尝试用汇编语言访问 I/O 端口及其特殊功能寄存器的读者提供了 I/O 端口的汇编程序。汇编程序也有助于对比\
  \ `Arm` 中同一程序的 `C` 版本和汇编版本。\n\n当你为 `Arm` 芯片编程时，你有两个选择：\n\n1. 使用厂商编写的函数来访问外设。大多数制造\
  \ `Arm` 芯片的厂商/公司提供专用的设备库函数，允许访问其外设。这些设备库函数受版权保护，不能在另一个厂商的 `Arm` 芯片上使用。对于学生和开发者来说，这种方法的问题在于你对函数没有控制权，而且很难为你的项目进行定制。\n\
  \n2. 第二种方法是使用 `C` 语言直接访问外设的特殊功能寄存器并创建自己的自定义库，因为你对每个函数都有完全的控制权。如果你决定更换 `Arm` 芯片厂商，这些函数中的大部分可以修改并用于另一个厂商。在书中，我们采用了第二种方法，因为我们的主要目标是教如何为\
  \ `Arm` 芯片的外设编程。我们知道这种方法困难又枯燥，但回报是丰厚的。\n\n对于 `Arm` 芯片编程，你可以使用来自 `Keil` (www.keil.com)、`IAR`\
  \ (www.IAR.COM) 或任何其他常用的编译器。对于本书，我们使用了 `Keil Arm` 编译器 IDE 来编写和测试程序。请访问我们的网站查看教程。\n\
  \n`STM` 有许多针对 `Arm STM32F4xx` 系列的廉价训练板。其中包含 `STM32F446 Nucleo` 板。虽然我们使用 `STM32F446`\
  \ 板测试程序，但这些程序可以在少量或不修改的情况下在其他 `STM32F4xx` 芯片上运行。\n\n在第 1 章中，我们研究了 32 位系统的 `C` 语言数据类型。我们还探索了新的\
  \ `ISO C99` 数据类型，因为它们被广泛用于嵌入式系统的 IDE 编译器。\n\n\n第 3 章展示了 `Arm` 芯片与现实世界设备的接口：`LCD`\
  \ 和键盘。它为这些设备提供了示例程序。\n第 4 章研究了串口 `UART` 端口的接口和编程。\n\n第 5 章专门介绍 `Arm` 中的定时器。它还展示了如何将定时器作为事件计数器。\n\
  \n\n第 7 章研究了 `ADC` 和 `DAC` 概念，并展示了如何用 `Arm` 芯片对其编程。它还研究了传感器接口和信号处理。\n第 8 章涵盖了 `SPI`\
  \ 协议以及 `Arm` 中的示例程序。\n\n\n第 10 章探索了继电器和 `Arm` 电机接口。\n第 11 章研究了直流电机和 `PWM`。\n\n\n\
