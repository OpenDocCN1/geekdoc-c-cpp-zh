  6. 中断向量表中的哪些内存位置持有 `INT16` ISR 的地址？\n7. Arm Cortex-M 已将 `INT2` 分配给 `NMI`。这可以更改吗？\n\
  \n## 6.2 节：Arm Cortex-M 处理器模式\n\n在本节中，我们将检查 Arm Cortex-M 的各种运行模式。\n\n### Arm Cortex\
  \ Thread（应用）和 Handler（异常）模式\n\nArm Cortex-M 在任何给定时间都可以以两种模式之一运行。它们是：(1) Thread（应用）模式和\
  \ (2) Handler（异常）模式。区别可以总结如下：\n\n1. 当 Arm Cortex-M 上电并退出复位时，它会自动进入 Thread 模式。Thread\
  \ 模式是绝大多数应用程序运行的模式。CPU 大部分时间在 Thread 模式下运行，只有在执行异常或外设 `IRQs` 的 ISR 时才会被中断。\n2. 只有当异常（当然是非\
  \ `Reset`）或来自外设的 `IRQ` 中断激活以引起 CPU 注意执行 ISR（中断处理程序）时，Arm Cortex-M 才会切换到 Handler\
  \ 模式。从 ISR 返回后，CPU 自动从 Handler 模式切换回 Thread 模式。必须注意的是，表 6-1 中的所有异常和 `IRQs` 中，只有\
  \ `Reset` 强制 CPU 进入 Thread 模式，其余中断处理程序都在 Handler 模式下执行。\n\n拥有 Handler 模式的一个巨大优势是，从\
  \ Handler 模式返回时，CPU 将弹出栈并恢复在进入 Handler 模式期间保存的寄存器。借此，中断处理程序的写法就像任何其他函数一样，我们很快将在示例中看到。\n\
  \n### Arm Cortex 中有两个栈\n\n经典的 Arm 有一个单栈指针（`R13`）用于指向 RAM 区域作为栈。对于多线程操作系统，每个线程都应该有自己的栈，操作系统本身也是如此。为系统和线程设置独立的栈指针要高效得多。Arm\
  \ Cortex-M 有两个栈指针寄存器。它们分别称为 `PSP`（处理器栈指针）和 `MSP`（主栈指针）。在 Thread 模式下运行的线程应该使用进程栈，而内核和异常处理程序应该使用主栈。\n\
  \n特殊功能寄存器 `CONTROL` 寄存器的位 1 `ASP`（活动栈指针）提供了选择 `MSP` 或 `PSP` 作为栈指针的选项。复位时 `ASP=0`，意味着\
  \ `R13` 是主栈指针（`MSP`），其值来自复位。在中断向量表 `0x00000000` 地址处，如果 `ASP=1`，`R13` 等于 `PSP`（处理器栈指针）。接下来，我们检查\
  \ Arm Cortex-M 的权限级别。\n\n![](img/image303.jpeg)\n\n**PRIV（权限）：** 定义 Thread 模式的权限\n\
  \n0: 特权\n\n1: 非特权\n\n**ASP（活动栈指针）：** 定义当前栈指针（`ASP = SPSEL`）\n\n0: `MSP` 是当前栈指针。\n\
  \n1: `PSP` 是当前栈指针。浮点激活状态（FPCA）\n\n0: 浮点上下文未激活。\n\n1: 浮点上下文已激活。\n\n图 6-6：Arm Cortex-M\
