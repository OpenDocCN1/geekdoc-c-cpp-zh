  \ 控制器 */ \n    LCD_init();\n\n    while(1) {\n        /* 在 LCD 上写入 \"HELLO\" */\
  \ \n        LCD_data('H');\n        LCD_data('E');\n        LCD_data('L');\n   \
  \     LCD_data('L');\n        LCD_data('O');\n        delayMs(1000);\n\n       \
  \ /* 清除 LCD 显示 */ \n        LCD_command(1);\n        delayMs(1000);\n    }\n}\n\n\
  /* 初始化 GPIOB/C 然后初始化 LCD 控制器 */ \nvoid LCD_init(void) {\n    PORTS_init();\n   \
  \ delayMs(20); /* LCD 控制器复位序列 */ \n    LCD_nibble_write(0x30, 0);\n    delayMs(5);\n\
  \    LCD_nibble_write(0x30, 0);\n    delayMs(1);\n    LCD_nibble_write(0x30, 0);\n\
  \    delayMs(1);\n}\n\nvoid PORTS_init(void) {\n    LCD_nibble_write(0x20, 0); /*\
