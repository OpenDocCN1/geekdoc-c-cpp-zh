  \ RAM 地址置为 0 作为地址计数器。同时也回到原始位置。DD RAM 内容保持不变。 | 1.64 ms |\n| 入口模式设置 | 0 | 0 | 0\
  \ 0 0 0 1 I | 设置光标移动方向并指定显示移动。 | 40µs |\n| 显示开启/关闭控制 | 0 | 0 | 0 0 0 0 1 D C B |\
  \ 设置整个显示 (D)、光标开启/关闭 (C) 和光标位置闪烁 (B)。 | 40µs |\n| 光标或显示移动 | 0 | 0 | 0 0 0 0 0 1\
  \ S | 移动光标并移动显示而不改变 DD RAM 内容。 | 40µs |\n| 功能设置 | 0 | 0 | 0 0 0 0 1 D L N F | 设置接口数据长度\
