  }\n```\n\n### LCD 4 位选项\n\n为了节省 LCD 接口使用的微控制器引脚，我们可以使用 4 位数据模式代替 8 位模式。在 4 位数据模式下，我们只需要将\
  \ D7-D4 连接到微控制器。结合三个控制线，微控制器与 LCD 模块之间的接口将适合单个 8 位端口。见图 3-3。\n\n使用 4 位数据模式时，微控制器需要在初始化期间发送命令将\
  \ LCD 控制器设置为 4 位模式。这是通过程序 3-3 中的命令 0x20 完成的。之后，每个命令或数据都需要拆分为两次 4 位操作，先处理高位字节。在程序\
  \ 3-3 中，使用 `command & 0xF0` 提取高位字节，并通过 `command << 4` 将低位字节移位。\n\n![](img/image0235.jpeg)**图\
  \ 3-3：4 位数据的 LCD 连接\n\n**程序 3-3：此程序使用 4 位数据选项在 LCD 上显示消息。**\n\n```c\n/* p3_3.c:\
  \ 使用 4 位数据模式在 LCD 上初始化并显示 \"HELLO\"。\n* 由于 4 位数据模式，每个字节命令或数据都会传输两次，一次针对高位字节，一次针对低位字节。\
  \ 此程序不轮询 LCD 状态。\n* 使用延迟来等待 LCD 控制器忙碌的时间。\n为了简单起见，所有低于 1 ms 的延迟都使用 1 ms。您可能\n* 需要调整\
  \ LCD 控制器的延迟量以提高性能。\n*\n* LCD 控制器连接到 Nucleo-F446RE\n* 板的情况如下：\n* PC4-PC7 分别对应 LCD\
  \ D0-D7。\n* PB5 用于 LCD R/S */\n```\n\n\n\n\n\n* `LCD R/W` 接地\n* `PB7` 用于 `LCD EN`\n\
  * 该程序已使用 `Keil uVision v5.24a` 和 `DFP v2.11.0` 通过测试\n\n```c\n#include \"stm32f4xx.h\"\
  \n\n#define RS 0x20 /* 寄存器选择 `PB5` 掩码 */ \n#define EN 0x80 /* 使 `PB7` 掩码 */\n\n\
  void delayMs(int n);\n\nvoid LCD_nibble_write(char data, unsigned char control);\
  \ \nvoid LCD_command(unsigned char command);\n\nvoid LCD_data(char data);\n\nvoid\
