  \ 分别对应 LCD D0-D7 */\n    GPIOC->MODER &= ~0x0000FFFF; /* 清空引脚模式 */\n    GPIOC->MODER\
  \ |= 0x00005555; /* 设置引脚输出模式 */\n\n}\n\n```\n\n         /* /*  \n\n */\nvoid LCD_command(unsigned\
