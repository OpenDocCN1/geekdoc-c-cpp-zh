  ```\n\n**LCD 光标位置**\n\n在 LCD 中，人们可以通过发送地址命令将光标移动到显示器的任何位置。下一个发送的字符将出现在光标位置。对于双行\
  \ LCD，第 1 行第一个位置的地址命令为 `0x80`，第 2 行为 `0xC0`。下显示了地址位置以及访问方式：\n\n![](img/image00236.jpeg)其中\
  \ `A[6]A[5]A[4]A[3]A[2]A[1]A[0]` 对于第 1 行为 `000000` 到 `0100111`，对于第 2 行，`A[6]A[5]A[4]A[3]A[2]A[1]A[0]`\
  \ 为 `100000` 到 `1100111`。见表 3-3。\n\n**表 3-3：LCD 命令 DB7 DB6 DB5 DB4 DB2 DB1 DB0**\n\
  \n第 1 行（最小）：`0 0 0 0 0 0`\n第 1 行（最大）：`0 1 0 0 1 1`\n第 2 行（最小）：`1 0 0 0 0 0`\n第 2\
  \ 行（最大）：`1 1 0 1 1`\n\n地址范围对于 40 字符宽 LCD 可以达到 `0100111`；对于 20 字符宽 LCD，可见位置到 `0100111`（二进制）=\
  \ 39（十进制），对应 0 到 39 的位置。图 3-4 显示了各种尺寸 LCD 光标地址。\n\n![](img/image00237.jpeg)图 3-4：某些\
  \ LCD 光标地址\n\n第 1 行第四个位置设置光标的示例为 `LCD_command(0x83);`，第 2 行第六个位置为 `LCD_command(0xC5);`。注意光标地址为十六进制且从\
  \ 0 开始。\n\n**LCD 时序和数据**\n\n图 3-5 和 3-6 分别显示 LCD 写入和读取的时序图。\n\n![](img/image00238.jpeg)图\
  \ 3-5：LCD 写入时序\n\n![](img/image00239.jpeg)图 3-6：LCD 读取时序\n\n注意写入操作发生在 `E` 引脚下降时。为了满足建立时间，微控制器必须在下降沿在数据线上准备好并稳定数据。读取操作由\
  \ `E` 引脚的高电脉冲激活。延迟时间后，如果 `R/W` 线为高，LCD 控制器将在数据总线上提供可用数据。微控制器应在降低 `E` 脉冲之前从数据线上读取数据。\n\
  \n表 3-4 提供了更详细的指令列表。\n\n| 指令 | [RS] | R/W | DB7 DB6 DB5 DB4 DB2 DB1 DB0 | 说明 | 执行（最大）\
