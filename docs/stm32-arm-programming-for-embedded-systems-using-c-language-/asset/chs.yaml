  \ 时钟 */\n    /* PORTB 5 用于 LCD R/S */\n    /* PORTB 7 用于 LCD EN */\n    GPIOB->MODER\
  \ &= ~0x0000CC00; /* 清除引脚模式 */ \n    GPIOB->MODER |= 0x00004400; /* 设置引脚输出模式 */\
  \ \n    GPIOB->BSRR = 0x00800000; /* 关闭 EN */\n    /* PC4-PC7 分别 LCD D4-D7 */\n\
  \    GPIOC->MODER &= ~0x0000FF00; /* 清除引脚模式 */ \n    GPIOC->MODER |= 0x00005500;\
  \ /* 设置引脚输出模式 */\n}\n\nvoid LCD_nibble_write(char data, unsigned char control) {\
