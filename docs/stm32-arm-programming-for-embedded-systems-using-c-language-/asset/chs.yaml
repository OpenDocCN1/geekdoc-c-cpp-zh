  \ `MODERy[1:0]`:端口 x 配置位 (y = 0..15)\n\n这些位由软件写入，用于配置 I/O 方向模式。\n\n00: 输入（复位状态）\n\
  01: 通用输出模式\n10: 复用功能模式\n11: 模拟模式\n\n**图 B - 2: 用于方向寄存器的 GPIOx_MODER (GPIO 模式) (x=A,\
  \ B, C,..)**\n\n![](img/image00227.jpeg)\n\nBits `31:0` `AFRLy`:端口 x 位 y 的复用功能选择\
  \ (y = 0..7)\n\n这些位由软件写入，用于配置复用功能 I/O `AFRLy` 选择：\n\n0000: AF0 1000: AF8\n0001:\
  \ AF1 1001: AF9\n0010: AF2 1010: AF10\n0011: AF3 1011: AF11\n0100: AF4 1100: AF12\n\
  0101: AF5 1101: AF13\n0110: AF6 1110: AF14\n0111: AF7 1111: AF15\n\n**图 B - 3: 用于选择复用引脚功能的\
  \ GPIOx_AFRL (GPIOx 低复用功能)寄存器**\n\n![](img/image00228.jpeg)\n\nBits `31:0` `AFRHy`:端口\
  \ x 位 y 的复用功能选择 (y = 8..15)\n\n这些位由软件写入，用于配置复用功能 I/O `AFRHy` 选择：\n\n0000: AF0 1000:\
  \ AF8\n0001: AF1 1001: AF9\n0010: AF2 1010: AF10\n0011: AF3 1011: AF11\n0100: AF4\
  \ 1100: AF12\n0101: AF5 1101: AF13\n0110: AF6 1110: AF14\n0111: AF7 1111: AF15\n\
  \n**图 B - 4: 选择复用引脚功能的 GPIOx_AFRH (GPIOx 高复用功能)寄存器 269 -8.4.10**\n\n## 附录 C: STM32F4xx\
  \ 时钟和 SYSCLK\n\n尽管 STM32F4xx 系列器件的时钟电路非常相似，但每个时钟的最大频率都不同。在本附录中，所有时钟频率均基于 STM32F466\
  \ 器。其他器件请参阅数据表和参考手册。\n\nSTM32F4xx 器的系统时钟有两种可能的时源。一个是片上 RC 电路振荡器。另一个来自外部晶振或陶瓷谐振器。RC\
  \ 振荡器随器件自带，不需要额外组件，但它并不准确也不稳定。使用晶振时，我们可以获得非常精确的时钟源，但它需要晶体或谐振器等额外组件。\n\n在 STM32F4xx\
  \ Arm 中，`SYSCLK`（系统时钟）运行 CPU 以及大多数外设（如 ADC、定时器、USART 等）的时钟。`SYSCLK` 直接来自内部时源或外部时源，或者通过锁相环\
  \ (PLL)。它们是：\n\n1. `HSI`（高速内部）RC 振荡器时钟。\n2. `HSE`（高速外部）使用 4 MHz 到 26 MHz 值的振荡器时钟。\n\
  3. `PLL` 电路的输出之一。\n\n还有两个低速时钟源 `LSI`（低速内部）和 `LSE`（低速外部）。![](img/image00456.jpeg)**图\
  \ C-1: STM32F4xx 时源**\n\n*(注：原文中存在大量重复内容，此处已按要求仅保留核心翻译)*\n\n\n\n\n从图 C-2 可以看到，复位值为\
  \ `0x83`。低 2 位为 `11`（`HSION=1`，`HSIRDY=1`），意味着在上电复位后，RC 16MHz HSI 是系统的时钟源。`HSIRDY`\
  \ 位表示 HSI 振荡器已稳定并准备好使用。正如后文所示，我们可以将 HSI 的默认时钟源切换到外部时钟源 `HSE` 或 `PLL`。\n\n### SYSCLK\
  \ 和外设时钟\n\nCPU 和外设总线时钟由系统时钟（`SYSCLK`）派生。图 C-3 显示了几个分频器，用于配置 AHB 时钟、高速 APB (`APB2`)\
  \ 域和低速 APB (`APB1`) 域。每个外设时钟都可以独立启用。从图 C-3 可以看出，`SYSCLK` 经经过 AHB 分频器。AHB 分频器的最小分频系数为\
  \ `1`，最大系数为 `512`。`RCC_CFGR` 寄存器的 `HPRE` 位（第 7 位至第 4 位）决定了 AHB 分频器的值。AHB 分频器的输出是进入\
  \ CPU 核心、内存和 `DMA` 的 `HCLK`。在 STM32F466 中，`HCLK` 的最高运行频率为 `180 MHz`。\n\n`APB1` 外设时钟是\
  \ `HCLK` 除以 `APB1` 分频器。`APB1` 分频器由 `RCC_CFGR` 的 `PPRE1` 位（第 12 位至第 10 位）决定。它可以将\
  \ `HCLK` 分频 `1`、`2`、`4`、`8` 或 `16`。`APB1` 外设的最高频率为 `45 MHz`，但 `APB1` 总线上的定时器运行频率是其他\
  \ `APB1` 外设的两倍，最高频率为 `90 MHz`。\n\n`APB2` 外设时钟是 `HCLK` 除以 `APB2` 分频器。`APB2` 分频器由\
  \ `RCC_CFGR` 的 `PPRE2` 位（第 15 位至第 13 位）决定。它可以将 `HCLK` 分频 `1`、`2`、`4`、`8` 或 `16`。`APB2`\
  \ 外设的最高频率为 `90 MHz`，但 `APB2` 总线上的定时器运行频率是其他 `APB2` 外设的两倍，最高频率为 `180 MHz`。\n\n所有这些分频器在上电复位后的默认值都不分频。\n\
  \n![](img/image00458.jpeg) **图 C-3: 外设到 CPU 及外设的时钟生成** \n\n位 31:30 `MCO2[1:0]`：微控制器时钟输出\
  \ 2，由软件设置和清除。时钟源选择可能会在 `MCO2` 上产生毛刺。强烈建议仅在复位后、启用外部振荡器和 `PLLs` 之前配置这些位。\n\n- `00`：选择系统时钟\
  \ (`SYSCLK`)\n- `01`：选择 `PLLI2S` 时钟\n- `10`：选择 `HSE` 振荡器时钟\n- `11`：选择 `PLL` 时钟\n\
  \n位 27:29 `MCO2PRE`：MCO2 分频器\n\n由软件设置和清除以配置 `MCO2` 的分频。修改此分频器可能会在 `MCO2` 上产生毛刺。强烈建议仅在复位后、启用外部振荡器和\
  \ `PLLs` 之前更改此分频器。\n\n- `0xx`：不分频\n- `100`：分频 2\n- `101`：分频 3\n- `110`：分频 4\n- `111`：分频\
  \ 5\n\n位 24:26 `MCO1PRE`：MCO1 分频器\n\n由软件设置和清除以配置 `MCO1` 的分频。修改此分频器可能会在 `MCO1` 上产生毛刺。强烈建议仅在复位后、启用外部振荡器和\
  \ `PLL` 之前更改此分频器。\n\n- `0xx`：不分频\n- `100`：分频 2\n- `101`：分频 3\n- `110`：分频 4\n- `111`：分频\
  \ 5\n\n位 23：保留位，必须保持复位值。\n\n位 22:21 `MCO1`：微控制器时钟输出 1，由软件设置和清除。时钟源选择可能会在 `MCO1`\
  \ 上产生毛刺。强烈建议仅在复位后、启用外部振荡器和 `PLL` 之前配置这些位。\n\n- `00`：选择 `HSI` 时钟\n- `01`：选择 `LSE`\
  \ 振荡器时钟\n- `10`：选择 `HSE` 振荡器时钟\n- `11`：选择 `PLL` 时钟\n\n由软件设置和清除以控制 `B` 高速时钟分频系数。\n\
  \n**注意：**软件必须正确设置这些位，以确保该域频率不超过超过 `90 MHz`。\n\n在写入 `PPRE2` 后，时钟将根据新的分频系数在 `1` 到\
