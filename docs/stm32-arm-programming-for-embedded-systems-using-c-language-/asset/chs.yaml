  \ 特权 和非特权 始终特权\n\n*在 Thread 模式下，使用 CONTROL 寄存器的位 0 选择特权或非特权*\n\n表 6-3：Arm Cortex-M\
  \ 中的特权执行和处理器模式\n\n## Arm Cortex-M 中的特权和非特权级\n\nArm Cortex-M 有两个权限级别。它们被称为特权和非特权。Arm\
  \ Cortex-M 中的特权级用于限制 CPU 对特殊寄存器和受保护内存区域的访问，以防止代码错误或恶意用户导致系统损坏。以下是特权软件的总结：\n\n1.\
  \ 特权软件可以访问所有寄存器，包括中断的特殊功能寄存器。\n2. 特权软件可以访问内存的每个区域。\n3. 特权软件可以访问系统定时器、`NVIC` 和系统资源。\n\
  4. 特权软件可以执行所有的 Arm Cortex-M 指令，包括 `MRS`、`MSR` 和 `CPS`。\n5. 故障异常和 `IRQ` 的 Handler\
  \ 只能在特权级下执行。\n6. 只有特权软件可以访问 `CONTROL` 寄存器以查看执行处于特权还是非特权模式。在非特权模式下，可以使用 `SVC` 指令从非特权级切换到特权级。\n\
  \n模式 软件 Thread 应用 Handler 异常和 IRQs 的 ISR\n\n栈使用 MSP 或 PSP MSP PSP\n\n\n\n\n\n*注：在线程模式（Thread\
  \ mode）下，使用 `Control` 寄存器的第 1 位来选择 `MSP` 或 `PSP` 作为栈指针。*\n\n## 表 6-4：Arm Cortex-M\
  \ 中的处理器模式和栈使用\n\n以下是非特权软件的概述：\n\n1. 非特权软件无法访问某些寄存器，例如用于中断的特殊功能寄存器。\n2. 非特权软件对内存区域的访问有限。\n\
  3. 非特权软件被禁止访问系统定时器、`NVIC` 以及系统控制块和资源。\n4. 非特权软件无法执行某些 Arm 指令，如 `CPS`。它对 `MRS` 和\
  \ `MSR` 指令的访问有限。\n5. 虽然处理模式（Handler mode）始终在特权（Privileged）级下执行，但线程模式（Thread mode）软件可以在特权或非特权级执行。名为\
  \ `CONTROL` 的特殊功能寄存器的第 0 位提供了在特权或非特权模式下运行软件的选项。\n6. 在非特权模式下，可以使用 `SVC` 指令进行监视调用，从而从非特权级切换到特权级。\n\
