  \ | 1 0 0 0 0 0 | 将数据写入 DD 或 CG RAM。 | 40µs |\n| 读取数据 CG 或 DD | | 1 | 1 0 0 0 0\
  \ 0 | 从 DD 或 CG RAM 读取数据。 | 40µs |\n\n**缩写：**\n* `DD RAM`: 显示数据 RAM\n* `CG RAM`:\
  \ 字符生成器 RAM\n* `AGC`: CG RAM 地址\n* `ADD`: DD RAM 地址，对应光标地址\n* `AC`: 用于 DD 和 CG RAM\
  \ 地址的地址计数器\n* `I/D`: 1 递增，0 递减\n* `S=1`: 随显示移动\n* `S/C`: 1 = 显示移动，0 = 光标移动\n* `R/L`:\
  \ 1 向右移，0 向左移\n* `DL`: 1 = 8 位，0 = 4 位\n* `N`: 1 = 2 行，0 = 1 行\n* `F`: 1 = 5 x 10\
  \ 点，0 = 5 x 7 点\n* `BF`: 1 = 内部操作，0 = 可接受指令\n\n**表 3-4：LCD 指令列表**\n\n**复习题**\n\n\
  1. `RS` 引脚是 LCD 的（输入，输出）引脚。\n2. `E` 引脚是 LCD 的（输入，输出）引脚。\n3. `E` 引脚需要（高到低，低到高）转换来锁存\
  \ LCD 数据线上的信息。\n4. 为了让 LCD 识别数据线上的信息为数据，RS 必须设置为（高，低）。\n5. 给出设置第 1 行第一个字符和第 2 行第一个字符的命令代码。\n\
  \n### **第 3.2 节：将键盘连接到 CPU**\n\n\n\n\n\n为了减少微控制器 I/O 引脚的使用，键盘被组织成行和列的矩阵结构。CPU 通过端口访问行和列；因此，通过两个\
  \ 8 位端口，就可以将一个 8 × 8 包含 64 个按键的矩阵连接到微处理器。当按键被按下时，一行和一列会发生接触；否则，行和列之间将没有连接。在 PC 键盘中，键盘内部嵌入的微控制器负责键盘的硬件和软件接口。在这些系统中，存储在微控制器\
  \ ROM 中的程序功能是持续扫描按键，识别哪一个按键被激活，并将其呈现给主板上的主 CPU。在本节中，我们将查看微处理器扫描和识别按键的机制。为了清晰起见，提供了一些示例。\n\
  \n### 扫描和识别按键\n\n图 3-7 显示了连接到两个端口的 4 × 4 矩阵。行连接到输出端口，列连接到输入端口。所有引脚都连接了上拉电阻。如果没有按键被按下，读取输入端口将得到所有列均为\
  \ 1s。如果所有行都被驱动为低电平且某个按键被按下，该按键的列将读回 0，因为按下的按键将该列与驱动为低电平的行短路了。微处理器的功能是持续扫描键盘以检测并识别按下的按键。接下来将解释实现方法。\n\
  \n![](img/image00240.jpeg) **图 3-7：矩阵键盘连接到端口**\n\n#### 按键检测\n\n为了检测按下，微处理器驱动所有行为低电平，然后读取列。如果从列读取的数据为\
  \ `D7–D4 = 1111`，则没有按键被按下，过程持续直到检测到按键按下。然而，如果其中一个列位为 0，则意味着有一个按键被按下。例如，如果 `D7–D4=\
  \ 1101`，这意味着 `D5` 列中的按键被按下了。\n\n以下程序检测是否有任何按键被按下。\n\n**程序 3-4：此程序在按键被按下时开启蓝色 LED。**\n\
  \n```c\n /* p3_4.c: 矩阵键盘检测\n*\n* 此程序检查 4x4 矩阵键盘以查看是否有按键被按下。\n* 当按下按键时，它会开启 LD2（绿色\
  \ LED）。\n*\n* PC0-3 连接到列，PC4-7 连接到\n* 键盘的行。\n*\n* 此程序使用 Keil uVision v5.24a 和 DFP\
  \ v2.11.0 进行了测试 */\n#include \"stm32f4xx.h\"\n\nvoid delay(void);\n\nvoid keypad_init(void);\
  \ char keypad_kbhit(void);\n\nint main(void) { \n    keypad_init();\n    // 为绿色\
  \ LED 开启 PA5\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */ \n    GPIOA->MODER &= ~0xC0000C00;\
  \ /* 清除引脚模式 */ \n    GPIOA->MODER |= 0x00000400; /* 设置引脚输出模式 */\n\n    while(1)\
  \ {\n        if (keypad_kbhit() != 0) /* 如果按键被按下 */\n            GPIOA->BSRR = 0x00000020;\
  \ /* 开启绿色 LED */ \n        else\n            GPIOA->BSRR = 0x00200000; /* 关闭绿色 LED\
  \ */ \n}\n}\n\n/* 此函数初始化 PC0-3（列）和 PC4-7（行）。\n* 列引脚需要上拉电阻。 */\nvoid keypad_init(void)\
  \ {\n    RCC->AHB1ENR |= 0x14; /* 开启 GPIOC 时钟 */\n    GPIOC->MODER &= ~0x0000FFFF;\
  \ /* 清除引脚模式为输入 */\n    GPIOC->PUPDR = 0x00000055; /* 为列开启上拉电阻 */\n}\n\n/* 这是一个非阻塞函数。\n\
  * 如果按下按键，它返回 1。否则，返回 0。 */\nchar keypad_kbhit(void) {\n    int col;\n    GPIOC->MODER\
  \ = 0x00005500; /* 将所有行引脚设为输出 */\n    GPIOC->BSRR = 0x00F00000; /* 所有行驱动低电平 */\n\
  \    delay(); /* 等待信号稳定 */\n    col = GPIOC->IDR & 0x000F; /* 读取所有列引脚 */\n    GPIOC->MODER\
  \ &= ~0x0000FF00; /* 关闭所有行引脚 */\n    if (col == 0x000F) /* 如果所有列均为高位 */\n      \
  \  return 0; /* 无按键按下 */\n    else\n        return 1; /* 按键按下 */\n}\n\n/* 产生短延迟\
  \ */\nvoid delay(void) {\n    int i;\n    for (i = 0; i < 20; i++); \n```\n\n####\
  \ 按键识别\n\n检测到按键按下后，微处理器将通过识别按键的过程。从顶行开始，微处理器每次驱动一行为低电平；然后读取列。如果读取的数据全为 1，则说明该行没有按键被按下，过程移动到下一行。它驱动下一行为低电平，读取列，并检查是否有任何\
  \ 0。这个过程持续持续，直到某行的某一列中识别出一个 0。下一个任务是找到按下的按键属于哪一列。这应该很容易，因为每一列都连接到一个独立的输入引脚。查看示例\
  \ 3-1。\n\n**示例 3-1**\n\n根据图 3-7，识别以下各项中按下按键的行和列。(a) 行 `D3–D0 = 1110`，列 `D7–D4=1011`；(b)\
  \ 行 `D3–D0 = 1101`，列 `D7–D4=0111`。\n\n**解答：**\n\n根据图 3-7，可以使用行和列来识别按键。(a) 行属于 `D0`，列属于\
  \ `D6`；因此，按下了按键 2。(b) 行属于 `D1`，列属于 `D7`；因此，按下了按键 4。\n\n![](img/image0241.jpeg) **图\
  \ 3-8：按键检测与识别的流程图**\n\n\n\n\n\n```c\nGPIOC->PUPDR = 0x00000055; /* 为列引脚启用上拉电阻 */\n\
  \n}\n```\n\n/*\n* 仅驱动一个行，这样即使按了多个按键导致行引脚短路，微控制器也不会被损坏。当行被禁用时，首先将其驱动为高电平，否则散电容可能会使非活动行保持低电平一段时间。\n\
  */\n\n/*\n* 这是一个读取键盘的非阻塞函数。\n* 如果按下按键，它将返回该按键的唯一代码。\n* 否则，返回 0。\n* PC6-9 用作输入并连接到列。启用上拉电阻，因此当按键未按下时，这些引脚会被拉高电平。PC4-7\
  \ 用作输出，驱动键盘行。\n\n* 首先，将所有行驱动为低电平并读取输入引脚。如果没有按下按键，由于上拉电阻的作用，读取结果将为全高。如果它们不全高，说明有按键被按下。\n\
  \n* 如果有按键被按下，程序将继续一次只驱动一行为低电平，并让其余行处于非活动状态（浮空），然后读取输入引脚。通过确定哪行和一列处于活动状态，程序可以判断按下的是哪个按键。\n\
  */\n```\n\n```c\nchar keypad_getkey(void) {\n    int row, col;\n    const int row_mode[]\
  \ = {0x00000100, 0x00000400, 0x00001000, 0x00004000}; /* 一行输出输出 */\n    const int\
  \ row_low[] = {0x00100000, 0x00200000, 0x00400000, 0x00800000}; /* 一行为低电平 */\n \
  \   const int row_high[] = {0x00000010, 0x00000020, 0x00000040, 0x00000080}; /*\
  \ 一行为高电平 */\n\n    /* 检查是否有按键按下 */\n    GPIOC->MODER = 0x00005500; /* 将所有行引脚设置为输出\
  \ */\n    GPIOC->BSRR = 0x00F00000; /* 将所有行引脚驱动为低电平 */\n    delay(); /* 等待信号稳定 */\n\
  \    col = GPIOC->IDR & 0x000F; /* 读取所有列引脚 */\n    GPIOC->MODER &= ~0x0000FF00;\
  \ /* 禁用所有行引脚驱动 */\n    if (col == 0x000F) /* 如果所有列均为高 */\n        return 0; /* 无按键按下\
  \ */\n\n    /* 如果有按下，进入此处查找是哪个按键。\n     * 它一次激活一行并读取输入以查看\n     * 哪列处于活动状态。 */\n\
  \    for (row = 0; row < 4; row++) {\n        GPIOC->MODER &= ~0x0000FF00; /* 禁用所有行引脚驱动\
  \ */\n        GPIOC->MODER |= row_mode[row]; /* 一次启用一行 */\n        GPIOC->BSRR =\
  \ row_low[row]; /* 将活动行驱动为低电平 */\n        delay(); /* 等待信号稳定 */\n        col = GPIOC->IDR\
  \ & 0x000F; /* 读取所有列 */\n        GPIOC->BSRR = row_high[row]; /* 将活动行驱动为高电平 */\n\
  \        if (col != 0x000F) break; /* 如果其中一个输入为低，说明有按键被按下。 */\n    }\n\n    GPIOC->BSRR\
  \ = 0x000000F0; /* 在禁用前将所有行驱动为高电平 */\n    GPIOC->MODER &= ~0x0000FF00; /* 禁用所有行\
  \ */\n\n    if (row == 4)\n        return 0; /* 如果到达此处，无按键按下 */\n\n     /* 当某一行有按键按下时进入此处，检查是哪一列\
  \ */\n    if (col == 0x000E) return row * 4 + 1; /* 第 0 列的按键 */\n    if (col ==\
  \ 0x000D) return row * 4 + 2; /* 第 1 列的按键 */\n    if (col == 0x000B) return row\
  \ * 4 + 3; /* 第 2 列的按键 */\n    if (col == 0x0007) return row * 4 + 4; /* 第 3 列的按键\
  \ */\n\n    return 0; /* 安全起见 */\n}\n```\n\n```c\nvoid LED_init(void) { // 启用 PA5\
  \ 用于绿色 LED\n    RCC->AHB1ENR |= 1; /* 启用 GPIOA 时钟 */\n    GPIOA->MODER &= ~0xC0000C00;\
  \ /* 清除引脚模式 */\n    GPIOA->MODER |= 0x00000400; /* 设置引脚为输出模式 */\n}\n/* 根据值开启关闭 LED\
  \ */\nvoid LED_blink(int value) {\n    value %= 17; /* 将最大计数限制为 16 */\n    for (;\
  \ value > 0; value--) {\n        GPIOA->BSRR = 0x00000020; /* 开启 LED */\n      \
  \  delayMs(200);\n        GPIOA->BSRR = 0x00200000; /* 关闭 LED */\n        delayMs(200);\n\
  \    }\n}\n```\n\n```c\nvoid delay(void) {\n    int i;\n    for (i = 0; i < 100000;\
  \ i++);\n}\n\nvoid delayMs(int ms) {\n    int i;\n    for (i = 0; i < ms * 1000;\
  \ i++);\n}\n```\n\n\n\n\n为了使串行数据通信工作，必须从微处理器的 8 位数据总线上获取数据字节，并使用并行入串出的移位寄存器转换为串行位；然后就可以通过单条数据线进行传输。这意味着在接收端必须有一个串入并出的移位寄存器来接收串行数据，将其封装成字节，并呈现给接收端的系统。请见图\
  \ 4-2 和图 4-3。\n\n![](img/image00244.jpeg)**图 4-2：并行入串出**\n\n![](img/image00245.jpeg)**图\
  \ 4-3：串入并行出**\n\n当距离较短时，数字信号可以原样在简单的导线上传输，不需要调制。这就是 PC 键盘在键盘和主板之间传输数据的方式。然而，对于使用电话等通信线路的长距离数据传输，串行数据通信需要调制解调器在将数据放入传输介质之前调制（将\
  \ 0 和 1 转换为音频调），并在接收端解调（将音频调转换为 0 和 1）。\n\n串行数据通信使用两种方法：异步和同步。在同步通信中，时钟与数据一同传输。在异步通信中，不传输时钟。发送端和接收端约定一个数据传输的时钟速度。它们的速度可能存在微差异，因此接收端会尝试为每个接收到的字符同步时钟。我们稍后会看到它是如何运行的。同步方法通常一次传输一组数据（字符），而异步传输一次传输一个字节。\n\
  \n可以编写软件来使用这些方法中的任意一种，但程序可能会繁琐且效率低下。因此，许多制造商为串行数据通信制造了特殊的 IC 芯片。这些芯片通常被称为 `UART`（通用异步收发传输器）和\
  \ `USART`（通用同步异步收发传输器）。PC 中的 `COM` 端口使用 `UART`。当此功能集成到微控制器中时，通常被称为 `SCI`（串口通信接口）。\n\
  \n### 半双工与全双工传输\n\n在数据传输中，双工传输是指数据可以发送也可以接收。这与单工传输（如打印机）不同，电脑只发送数据。双工传输可以是半双工或全双工。如果数据一次向一个方向传输，则称为`半双工`。如果数据可以同时双向传输，则为`全双工`。当然，全双工需要数据线有两个导线（除地线外），一条用于发送，一条用于接收，以便同时传输和接收数据。见图\
  \ 4-4。\n\n![](img/image00246.jpeg)**图 4-4：单工、半双工和全双工传输**\n\n### 异步串行通信与数据帧\n\n在串行数据传输中，进入数据线接收端的数据全是\
  \ 0 和 1；除非发送端和接收端约定一套规则（即`协议`）来规定数据如何封装、一个字符由多少位组成以及数据何时开始和结束，否则很难理解这些数据。\n\n###\
  \ 起始位和停止位\n\n异步串行数据通信广泛用于面向的传输。在异步方法中，每个字符（如 `ASCII` 字符）都被封装在起始位和停止位之间。这被称为`成帧`。起始位始终一位，但停止位可以是一位或两位。起始位始终是\
  \ 0（低电平），停止位是 1（高电平）。例如，看图 4-5，其中 `ASCII` 字符 \"A”（二进制为 0100 0001）被封装在起始位和 2 个停止位之间。注意\
  \ `LSB` 先发送。\n\n![](img/image00247.jpeg)**图 4-5：ASCII \"A\" (0x41) 成帧**\n\n在图 4-5\
  \ 中，当没有数据传输时，信号保持为 1（高电平），这被称为`mark`（标记）。0（低电平）被称为`space`（空）。注意传输起始起始位，随后是 `D0`（即\
  \ `LSB`），然后是其余位直到 `MSB`（`D7`），最后发送表示字符 \"A\" 结束的 2 个停止位。\n\n在异步串行通信中，外围芯片可以编程为处理\
  \ 5、6、7 或 8 位宽的数据。虽然在旧系统中 `ASCII` 字符是 7 位，但现代系统通常发送非 `ASCII` 的 8 位数据。旧的 `Baud` 代码使用\
  \ 5 位或 6 位字符，尽管现在某些硬件仍支持它们，但今天已很少见到。在某些旧系统中，由于接收机械设备的速度较慢，使用 2 个停止位是为了给设备在传输下一个字节之前留出足够的时间。然而，在现代\
  \ PC 中，使用 1 个停止位很常见。假设我们正在使用 1 个停止位传输一个 `ASCII` 字符文本文件，每个字符总共有 10 位，因为 8 位用于 `ASCII`\
  \ 码，1 位和 2 位分别用于起始位和停止位。因此，对于每个 8 位字符，有两个额外的位，即有 25% 的开销。（2/8 x100=25%）。\n\n###\
  \ 校验位\n\n在某些系统中，为了保持数据的完整性，字符字节的校验位包含在数据帧中。\n\n## 数据传输率\n\n串行数据通信的数据传输率以 `bps`（每秒比特数）规定。`bps`\
  \ 的另一个常用术是 `Baud rate`（波特率）。然而，波特率和 bps 并不相等。这是因为波特率被定义为每秒信号变化的次数。在调制调器中，每个信号可能传输多个位的数据。\n\
  \n\n\n\n\n# 为了允许不同制造商制造的数据通信设备之间相互兼容，电子工业协会（`EIA`）于 1960 年提出了一种名为`RS232`的接口标准，其中`RS`代表推荐标准（recommended\
  \ standard）。多年来它经过多次修订，末尾使用字母来表示修订号，例如`RS232C`。它最终被采用为 EIA 标准并命名为`EIA232`，后来`TIA232`，但大多数人仍将其称为`RS232`。\n\
  \n今天，`RS232`仍用于简单的串行 I/O 接口。然而，由于该标准在`TTL`逻辑族出现很久就已经制定，因此其输入输出电压电平与`TTL`不兼容。在`RS232`接收端，`1`用`-3V`到\
  \ `-25 V`表示，而`0`位为`+3V`到`+25 V`，使得`-3V`到`+3V`之间的电压为未定义。因此，为了将任何`RS232`连接到`TTL`电平芯片（微处理器或`UART`），我们必须使用如`MAX232`或`MAX233`之类的电压转换器将`TTL`逻辑电平转换为`RS232`电压电平，反之亦然。`MAX232`和`MAX233`\
  \ IC 芯片通常被称为线路驱动器/接收器。如图 4-6 和 4-7 所示。`MAX232`具有两组用于传输和接收数据的线路驱动器，如图 4-6 所示。用于`TxD`的线路驱动器称为`T1`和`T2`，而用于`RxD`的线路接收器指定为`R1`和`R2`。在许多应用中，每个只用一个。注意`MAX232`中的`T1`线路驱动器在引脚\
  \ 11 和 14 上分别标记为`T1in`和`T1out`。`T1in`引脚是`TTL`侧，连接到`USART`的`TxD`，而`T1out`是`RS232`侧，连接到`RS232`\
  \ DB 连接器的`RxD`引脚。`R1`线路驱动器在引脚 13 和 12 上分别标记为`R1in`和`R1out`。`R1in`（引脚 13）是`RS232`侧，连接到`RS232`\
  \ DB 连接器的`TxD`引脚，而`R1out`（引脚 12）是`TTL`侧，连接到`USART`的`RxD`引脚。\n\n![](img/image00248.jpeg)**图\
  \ 4-6: MAX232**\n\n![](img/image00249.jpeg)**图 4-7: MAX233**\n\n`MAX232`需要四个`1 µF`的电容。为了节省板空间，一些设计师使用了\
  \ Maxim 的`MAX233`芯片。`MAX233`的功能与`MAX232`相同，但消除了对电容的需求。然而，`MAX233`芯片比`MAX232`更大更贵。见图\
  \ 4-7 所示未使用电容的`MAX233`。\n\n## RS232 引脚\n\n表 4-1 提供了`RS232`电缆（通常称为`DB9`连接器）的引脚及其标签。图\
  \ 4-8 显示了 x86 PC 的 9 针串口。\n\n### 引脚描述\n\n- **1** 数据载波检测 (`DCD`)\n- **2** 接收数据 (`RxD`)\n\
  - **3** 发送数据 (`TxD`)\n- **4** 数据终端就绪 (`DTR`)\n- **5** 信号地 (`GND`)\n- **6** 数据集就绪\
  \ (`DSR`)\n- **7** 请求发送 (`RTS`)\n- **8** 发送许可 (`CTS`)\n- **9** 铃号指示 (`RI`)\n\n**表\
  \ 4-1: RS232 引脚**\n\n![](img/image00250.jpeg)**图 4-8: 9 针公头**\n\n## 数据通信分类\n\n目前的术语将数据通信设备分类为`DTE`（数据终端设备）或`DCE`（数据通信设备）。`DTE`指发送接收数据的终端和电脑，而`DCE`指负责传输数据的通信设备，如调制解调器。注意表\
  \ 4-1 中所有`RS232`引脚功能定义都是从`DTE`的角度出发。\n\n两台 PC（`DTE`和`DTE`）之间简单的连接至少需要三个引脚：`TxD`、`RxD`和地，如图\
  \ 4-9 所示。注意两个`DTE`设备（如两台 PC）之间的连接需要交换引脚 2 和 3，如图 4-9 所示。在查看图 4-9 时，请记住`RS232`信号定义是从`DTE`的角度定义的。\n\
  \n![](img/image00251.jpeg)**图 4-9: DTE-DCE 和 DTE-DTE 连接**\n\n## 检查 RS232 握手信号\n\n\
  为了确保设备之间快速且可靠的传输，必须协调数据传输。`RS232`的某些引脚用于握手信号，描述如下。由于在串口通信中接收设备可能没有空间，这些信号用于流量控制：\n\
  \n1. **数据终端就绪 (DTR)**：当终端开启时，通过自测试，输出信号`DTR`以表示已就绪。如果没有空间，调制解调器将撤销`DTR`。\n2. **数据集就绪\
  \ (DSR)**：当调制解调器开启时，通过自测试，输出信号`DSR`以表示已就绪。如果没有空间，PC 将撤销`DSR`。\n3. **请求发送 (RTS)**：当\
  \ PC 想要发送数据时，它断开`RTS`告知调制解调器可以接收。\n4. **发送许可 (CTS)**：作为对`RTS`的响应，如果调制解调器有空间接收，则返回`CTS`。如果没有空间，调制解调器不会激活`CTS`。\n\
  5. **载波检测 (DCD)**：调制解调器接入`DCD`通知 PC 检测到了有效载波。\n6. **铃号指示 (RI)**：调制解调器的输出，通知 PC 正在响铃。\n\
  \n根据上述描述，PC 和调制解调器的通信可以总结为：`DTR`和`DSR`分别由 PC 和调制解调器用于表示它们运行正常，而实际控制流量的是`RTS`和`CTS`。当\
  \ PC 想要发送数据时，它断开`RTS`，作为响应，如果调制解调器准备好（有空间）接收数据，则返回`CTS`。如果没有空间，调制解调器不会激活`CTS`，PC\
  \ 将撤销`DTR`并重试。`RTS`和`CTS`也被称为*硬件信号*。见图 4-10。\n\n![](img/image00252.jpeg)**图 4-10:\
  \ 带控制信号的交叉调制连接**\n\n到此结束 RS232 握手信号以及`TxD`、`RxD`和地的描述。地也称为`SG`（信号地）。在下一节中，我们将学习微控制器的串行通信编程。\n\
  \n### 复习题\n\n1. 使用并行线传输数据是 ________________（更贵，更便宜）。\n2. 在纽约和德拉斯的两台 PC 之间的通信中，我们使用相同（串行，并行）数据通信。\n\
  3. 在串行数据通信中，哪种方法适用于块数据？\n4. 错误。发送数据到打印机是双工的。\n5. 错误。在双工中我们必须有两条数据线。\n6. 起始位和停止位用于相同（同步，异步）方法。\n\
  \n\n\n\n\n7. 假设我们正在传输字母 \"D\"，二进制为 `100 0100`，使用奇偶校验位和 2 个停止位，请显示传输的比特序列。\n\n8.\
  \ 在问题 7 中，计算由于成帧（framing）产生的开销。\n\n9. 如果我们使用 `1200 bps`，计算如问题 7 所示传输 400 个字符所需。由于开销浪费的时间百分比是多少？\n\
  \n10. 判断对或错。`RS232` 不兼容 TTL。\n\n## 第 4.2 节：UART 端口编程\n\n在本节中，我们将检查 STM Arm 的 `USART`\
  \ 串口端口寄存器，并展示如何编写它们以串行传输和接收数据。STM Arm 芯片带有许多内置 `USART`（通用同步/异步收发传输器），并被命名为 `USARTx`，`x=1,\
  \ 2, 3` 等。STM Arm 芯片还带有内置的 `LPUART`（低功耗通用异步收发传输器），并被命名为 `LPUARTx`，`x=1, 2` 等。正如我们在后续章节中看到的，STM\
  \ Arm 支持 `SPI` 和 `I2C` 协议。在 Nucleo 等 STM Arm 开发板上，`USART2` 端口连接到 `ST-Link` 编程调试工具，该工具连接到\
  \ `USB` 接口。见图 4-11。`ST-LINK/V2` 是用于 `STM32` 微控制器的在位调试器和编程器。单线接口模块 (`SWIM`) 和 `JTAG`//串线调试\
  \ (`SWD`) 接口用于与位于应用板上的任何 `STM32` 微控制器通信。`ST-LINK/V2` 连接除了其他功能外还执行三个不同的功能：\n\na)\
  \ 目标设备的编程（下载）。\nb) 使用串线调试 (`SWD`) 进行调试。`SWD` 是 `JTAG` 标准的替代方案。\nc) 作为虚拟 COM 口使用。\n\
  \n![](img/image00205.jpeg) **图 4-11：Nucleo ST Arm 板上的 ST-Link-V2-1**\n\n![](img/image00206.jpeg)\
  \ **图 4-12：Nucleo ST Arm 板上的 ST-Link-V2-1**\n\n当 `USB` 线将 PC 连接到 STM Arm 开发板时，主机\
  \ PC 上的设备驱动程序会在 PC 与目标 STM Arm  `UART` 之间建立虚拟连接，中间通过 `ST-LINK`。在 Nucleo 板上，该连接显示为\
  \ `UART`。在主机 PC 上，它显示为 `COM/USB` 端口，并可以与 PC 上的通信软件（如终端仿真器）配合。它被称为虚拟连接，是因为不需要额外的电缆来建立这种连接。\n\
  \n检查 Nucleo 板的数据表，我们看到 `UART2` 使用 `PA2` (`USART2_TX`) 和 `PA3` (`USART2_RX`) 分别作为\
  \ `TxD` 和 `RxD`。见图 4-13。\n\n![](img/image00253.jpeg) **图 4-13：St-Link/V2 USART2-USB\
  \ 端口连接**\n\n正如我们之前提到的，STM Arm 有许多内置的串口。它们被命名为 `USARTx`。以下是 `STM32F446RE` 芯片内存映射中基地址的部分列表：\n\
  \n### `USART1` 基地址：`0x4001 1000`\n### `USART2` 基地址：`0x4000 4400`\n### `USART3` 基地址：`0x4000\
  \ 4800`\n\n其他 `UART` 地址请参见第 2 章中的表 2-3。请检查你设备数据表的内存映射表。某些 `USART` 寄存器的地址偏移量所示。这些寄存器的实际物理地址是基地址加上偏移地址的地址。\n\
  \n| 寄存器名称 | 寄存器功能 |\n| :--- | :--- |\n| `USART_SR` | 状态寄存器 |\n| `USART_DR` | 数据寄存器\
  \ |\n| `USART_BRR` | 波特率寄存器 |\n| `USART_CR1` | 控制寄存器 1 |\n| `USART_CR2` | 控制寄存器\
  \ 2 |\n| `USART_CR3` | 控制寄存器 3 |\n\n| 寄存器地址偏移量（十六进制） |\n| :--- |\n| `0000` |\n|\
  \ `0004` |\n| `0008` |\n| `000C` |\n| `0010` |\n| `0014` |\n\n**表 4-2：USART 寄存器及其地址的部分列表**\
  \ 图 4-14 显示了 `USART` 单元的简化框图。\n\n![](img/image00254.jpeg) **图 4-14：USART 的简化框图**\n\
  \n在所有微控制器中，`UART` 外设中都有 3 组寄存器：\n\n1. **配置寄存器**：在使用 `USART` 外设之前，必须初始化配置寄存器。这设置了通信的一些参数，包括波特率、字长、停止位、中断（如果需要）。在\
  \ STM Arm 微控制器中，某些配置寄存器是：`BAUD`、`Control 1` 和 `Control 2`。\n2. **发送和接收寄存器**：要发送数据，我们只需写入发送数据寄存器\
  \ (`USART_TDR`)。\n3. **中断和状态寄存器**：中断和状态寄存器包含发送和接收状态标志。\n\n### HSI 时钟和 SYSCLK\n\n\
  在 STM32F446 中有三种时钟源可以驱动系统内核：\n1. `HSI`（高速内部）晶振器时钟。\n2. `HSE`（高速外部）晶振器时钟，值为 `4MHz`\
  \ 到 `26MHz`。\n3. `PLL` 时钟。\n\n\n\n\n\n正如附录 C 所示，外设总线时源自 `SYSCLK` 系统时钟。为了优化功耗，每个时钟在未使用时可以独立地开启或关闭。图\
  \ 4-16 和 4-17 显示了几个用于配置 AHB 频率、高速 APB (`APB2`) 和低速 APB (`APB1`) 域频率的分频器。正如我们很快将看到的，可以通过\
  \ `RCC_AHBxENR` 和 `RCC_APBxENRy` 寄存器的 xxxxEN 位来启用每个外设时钟。\n\n注意图 4-16 和 4-17，`SYSCLK`\
  \ 经过 AHB 分频器。AHB 分频器可以分频的最小值为 1，最大值为 512，之后进入 APBx 分频器。RCC 时钟配置寄存器 (`RCC_CFGR`)\
  \ 的位 `D7-D4` 决定了这一点。在经过 APBx 分频器后，它被馈送到 `USART2` 以及其他外设，如 `Timer`、`I2C` 等。\n\n`RCC_CFGR`\
  \ 的位 `D12:D10` 提供了在变为 `PCLK1` 之前将 `HCLK` 分频为 1、2、4、8 或 16 的选项。这意味着如果我们使用默认的 16MHz\
  \ `SYSCLK` 时钟，只要这些寄存器保持默认不变，我们所有外设最多可以获得 16MHz 的时源。对于 `USART`，正如我们很快看到的，我们使用 16MHz\
  \ 进行波特率发生。注意图 4-16 中的 `RCC_CFGR`（时钟配置寄存器），还有用于 `PPRE2` 的位 `D15:D13`，用于 APB 高速分频器\
  \ (`APB2`) 时钟分频。在上述所有分频器中，默认均为 `SYSCLK` 分频 1。\n\n![](img/（此处省略图片占位符）\n\n### 位 15:13\
  \ `PPRE2`: APB 高速分频器 (APB2)\n\n由软件设置和清除，以控制 APB 高速时钟的分频系数。\n\n**注意：**软件必须正确设置这些位，以确保该域的频率不超过\
  \ 90 MHz。在写入 `PPRE2` 之后，时钟将根据 1 到 16 个 AHB 周期的新分频系数进行分频。\n\n- `0xx`: AHB 时钟不分频\n\
  - `100`: AHB 时钟分频 2\n- `101`: AHB 时钟分频 4\n- `110`: AHB 时钟分频 8\n- `111`: AHB 时钟分频\
  \ 16\n\n### 位 12:10 `PPRE1`: APB 低速分频器 (APB1)\n\n由软件设置和清除，以控制 APB 低速时钟的分频系数。\n\n\
  **注意：**软件必须正确设置这些位，以确保该域的频率不超过 45 MHz。在写入 `PPRE1` 之后，时钟将根据 1 到 16 个 AHB 周期的新分频系数进行分频。\n\
  \n- `0xx`: AHB 时钟不分频\n- `100`: AHB 时钟分频 2\n- `101`: AHB 时钟分频 4\n- `110`: AHB 时钟分频\
  \ 8\n- `111`: AHB 时钟分频 16\n\n### 位 9:8 留，必须保持复位值。位 7:4 `HPRE`: AHB 分频器\n\n由软件设置和清除，以控制\
  \ AHB 时钟的分频系数。\n\n**注意：**在写入 `HPRE` 之后，时钟将根据 1 到 16 个 AHB 周期的新分频系数进行分频。\n\n**注意：**在使用以太网时，AHB\
  \ 时钟频率至少为 25 MHz。\n\n- `0xxx`: 系统时钟不分频\n- `1000`: 系统时钟分频 2\n- `1001`: 系统时钟分频 4\n\
  - `1010`: 系统时钟分频 8\n- `1011`: 系统时钟分频 16\n- `1100`: 系统时钟分频 64\n- `1101`: 系统时钟分频 128\n\
  - `1110`: 系统时钟分频 256\n- `1111`: 系统时钟分频 512\n\n**图 4-16: RCC_CFGR (时钟配置寄存器) 时钟选择寄存器位分配**\n\
  \n![](img/（此处省略图片占位符）\n\n**图 4-17: USART2 的时钟产生**\n\n#### 注意\n\nSTM Arm 的时钟产生将在附录\
  \ C 中进行详细讨论。\n\n*启用 USART2 时钟*\n\n必须注意的是，当外设时钟未激活时，不支持对外设寄存器进行读写访问。第 2 和第 3 章讨论的\
  \ GPIO 口连接到 AHB2，正如我们在第 2 和第 3 章看到的，可以通过 `RCC_AHB2_ENR`（AHB2 启用寄存器）位启用。某些 `USARTx`\
  \ 模块与 APB1 总线时钟相关，包括本章使用的 `USART2`。必须强调，`AHBx` 和 `APBx` 总线上的所有外设在复位后时钟都是禁用的。在访问该模块的寄存器之前，必须启用其总线时钟。图\
  \ 4-18 显示了 `RCC_APB1ENR` 寄存器中各种外设的一些时钟启用位。该寄存器的 `D17` 位用于启用本章使用的 `USART2` 时钟。我们在检查\
  \ STM Arm 时将查看其他位。\n\n![](（此处省略图片占位符）\n\n- 位 20 `UART5EN`: UART5 时钟启用，由软件设置和清除。\n\
  \  - `0`: UART5 时钟禁用\n  - `1`: UART5 时钟启用\n- 位 19 `UART4EN`: UART4 时钟启用，由软件设置和清除。\n\
  \  - `0`: UART4 时钟禁用\n  - `1`: UART4 时钟启用\n- 位 18 `USART3EN`: USART3 时钟启用，由软件设置和清除。\n\
  \  - `0`: USART3 时钟禁用\n  - `1`: USART3 时钟启用\n- 位 17 `USART2EN`: USART2 时钟启用，由软件设置和清除。\n\
  \  - `0`: USART2 时钟禁用\n\n**图 4-18: RCC_APB1ENR (外设启用寄存器) 位分配**\n\n**（注：原文后续部分存在大量重复段落，已根据要求“不要重复输出原文”进行处理）**\n\
  \n\n\n\n标准的波特率包括 9,600、19,200、57,600 和 115,200。表 4-3 显示了在 16 MHz 时钟频率下，使用 16 倍过采样时，不同波特率对应的\
  \ `USART_BRR` 寄存器值。\n\n| 波特率 | BRR（十进制） | BRR（十六进制） |\n| :--- | :--- | :--- |\n\
  | 9,600 | 104.166 | 0x0683 |\n| 19,200 | 52.06 | 0x0341 |\n| 57,600 | 17.36 | 0x0116\
  \ |\n| 115,200 | 8.68 | 0x008B |\n\n**表 4-3：使用 OVER=16 和 16MHz 时钟时，某些波特率的波特率寄存器\
  \ (BRR) 值。*8 倍过采样与波特率寄存器***\n\n在 8 倍过采样（`OVER8` = 1）的情况下，公式为：\n\n```\nTx / Rx baud\
  \ = Fck / 8 x (2 - OVER8) x USARTDIV\n= Fck / 8 x (2 - 1) x USARTDIV\n= Fck / 8\
  \ x USARTDIV\nUSARTDIV = Fck / 8 x Baud\n```\n\n在 8 倍过采样（`OVER8`=1）的情况下，小数部分由 3\
  \ 位编码，并通过 `USART_BRR` 寄存器中的 `DIV_fraction[2:0]` 位进行编程，且位 `DIV_fraction[3]` 必须保持清零。\n\
  \n### 示例 4-5\n\n假设 16 MHz 的时钟源输入 USART 波特率发生器，过采样率为 8。求出波特率为 (a) 9,600、(b) 19,200、(c)\
  \ 57,600 和 (d) 115,200 时的 `USART_BRR` 寄存器值。\n\n**解答：**\n\n根据 STM32F446 参考手册：“当 `OVER8=1`\
  \ 时，小数部分由 3 位编码，并通过 `USART_BRR` 寄存器中的 `DIV_fraction[2:0]` 位进行编程，且位 `DIV_fraction[3]`\
  \ 必须保持清零。”\n\n`USARTDIV = Fck / 8 x Baud`\n\n(a) 16MHz / 8 x 9,600 = 280.33。现在，我们使用\
  \ 280 = `0x118` 作为高 12 位。对于小数部分，0.33 x 8 = 2.64，我们使用 3 作为低 3 位。因此 `BRR = 0x1183`。注意在\
  \ 8 倍过采样时，第 4 位必须为 0。\n\n(b) 16MHz / 8 x 19,200 = 104.166。现在，我们使用 104 = `0x068`\
  \ 作为高 12 位。对于小数部分，0.166 x 8 = 1.328，我们使用 1 作为低 3 位。因此 `BRR = 0x0681`\n\n(c) 16MHz\
  \ / 8 x 57,600 = 34.72。我们使用 35 = `0x023` 作为高 12 位。对于小数部分，0.72 x 8 = 5.77，我们使用 6\
  \ 作为低 3 位。因此 `BRR = 0x0236`\n\n(d) 16MHz / 8 x 115,200 = 17.36。我们使用 17 = `0x011`\
  \ 作为高 12 位。对于小数部分，0.36 x 8 = 2.88，我们使用 3 作为低 3 位。因此 `BRR = 0x0113`\n\n表 4-4 显示了在\
  \ 16 MHz 时钟频率下，使用 8 倍过采样时，不同波特率对应的 `USART_BRR` 寄存器值。\n\n| 波特率 | BRR（十进制） | BRR（十六进制）\
  \ |\n| :--- | :--- | :--- |\n| 9,600 | 280.33 | 0x1183 |\n| 19,200 | 104.166 | 0x0681\
  \ |\n| 57,600 | 34.72 | 0x0236 |\n| 115,200 | 17.36 | 0x0113 |\n\n**表 4-4：使用 OVER=8\
  \ 和 16MHz 时钟时，某些波特率的波特率寄存器 (BRR) 值。**16 倍或 8 倍过采样的选择通过 `CR1` 控制寄存器完成。我们将讨论 `CR1`\
  \ 控制寄存器。\n\n### USART 控制 1 (USART_CR1) 寄存器\n\nUSART 中下一个重要的寄存器是控制寄存器。我们有多个 USART\
  \ 控制寄存器。其中最重要的是 USART 控制 1 (`USART_CR1`) 寄存器和 USART 控制 2 (`USART_CR2`) 寄存器。它们都是\
  \ 32 位寄存器。`USART_CR1` 寄存器用于设置帧中的每个字符位数（数据长度）等。注意 `USART_CR1` 寄存器中的 `M1` 位通过指定每个字符的位数来确定数据的帧。字符长度（字长）的默认值为\
  \ 8 位。\n\n\n\n包含接收或发送的数据字符，取决于是从读取还是写入它。`Data` 寄存器具有双重功能（读和写），因为它由两个寄存器组成：一个用于发送（`TDR`），另一个用于接收（`RDR`）。`TDR`\
  \ 寄存器提供了内部总线与输出移位器之间的并行接口。`RDR` 寄存器提供了输入移位器与内部总线之间的并行接口。在启用校验位发送时（`USART_CR1` 寄存器中的\
  \ `PCE` 位置 `1`），写入最高位（MSB，取决于数据长度为第 7 位或第 8 位）的值没有影响，因为它会被校验位取代。在启用校验位接收时，读取到的 MSB\
  \ 位的值即为接收到的校验位。\n\n图 4-22：USART_DR，USART 数据寄存器（未显示 D31-D8）\n\n### 关于 USART DATA\
  \ 寄存器的说明\n\n`Data` 寄存器具有双重功能（读和写），因为它由两个寄存器组成：一个用于发送（`TDR`），另一个用于接收（`RDR`）。`TDR`\
  \ 寄存器提供了内部总线与输出移位器之间的并行接口。`RDR` 寄存器提供了输入移位器与内部总线之间的并行接口。\n\n![](img/image00263.jpeg)\n\
  \n### USART 状态寄存器 (USART_SR)\n\n`USART_SR`（状态寄存器）是一个重要寄存器。它包含了错误标志，如帧错误 (`FE`）、校验错误\
  \ (`PE`）和溢出错误 (`ORE`）。只有当错误标志置位时，程序才需要查询 `USART_SR` 寄存器以获取有关错误源的更多信息。我们在这里不会详细介绍错误。感兴趣的读者可以参考参考手册获取更多信息。`USART_SR`\
  \ 中的标志位也可以被编程以产生中断。我们将在第 6 章讨论中断。`USART_SR` 寄存器还包含其他一些重要标志，它们是 `TXE`（发送数据寄存器空）、`TC`（发送完成）和\
  \ `RXNE`（数据寄存器非空）。见图 4-23。\n\n图 4-23 描述了 `USART_SR` 的各个位。`USART_SR` 寄存器中有三个位被 USART\
  \ 广泛使用。`TXE`（发送数据寄存器空）标志表示发送数据寄存器为空，可以接收新的字节数据以进行发送。`RXNE`（数据寄存器非空）标志表示数据寄存器已接收到新字节的数据，需要在其丢失之前将其取走。`TC`（发送完成）标志表示发送已完成，USART\
  \ 没有更多数据需要发送。这意味着它已准备好接收新的数据以供待发送。\n\n![](img/image00264.jpeg)\n\n#### 第 7 位 TXE：发送数据寄存器空\n\
  \n当 `TDR` 寄存器的内容传输到移位器时，硬件会设置此位。如果 `USART_CR1` 寄存器中的 `TXEIE` 位 = `1`，则会产生中断。它通过写入\
  \ `USART_DR` 寄存器来清除。\n\n* 0：数据未传输到移位器\n* 1：数据已传输到移位器\n\n#### 第 6 位 TC：发送完成\n\n如果包含数据的帧传输完成且\
  \ `TXE` 置位，则硬件会设置此位。如果 `USART_CR1` 寄存器中的 `TCIE`= `1`，则会产生中断。它通过软件序列（先读取 `USART_SR`\
  \ 寄存器，后写入 `USART_DR` 寄存器）来清除。`TC` 位也可以通过对其写入 `'0'` 来清除。此清除序列仅建议用于多缓冲区通信。\n\n* 0：传输未完成\n\
  * 1：传输完成\n\n#### 第 5 位 RXNE：数据寄存器非空\n\n当 `RDR` 移位器的内容传输到 `USART_DR` 寄存器时，硬件会设置此位。如果\
  \ `USART_CR1` 寄存器中的 `RXNEIE`= `1`，则会产生中断。它通过读取 `USART_DR` 寄存器来清除。`RXNE` 标志也可以通过对其写入零来清除。此清除序列仅建议用于多缓冲区通信。\n\
  \n* 0：未接收到数据\n* 1：接收到的数据已就绪可读。\n\n#### 第 3 位 ORE：溢出错误\n\n当移位器中当前接收的字准备传输到 `RDR`\
  \ 寄存器而此时 `RXNE`= `1` 时，硬件会设置此位。如果 `USART_CR1` 寄存器中的 `RXNEIE`= `1`，则会产生中断。它通过软件序列（先读取\
  \ `USART_SR` 寄存器，后读取 `USART_DR` 寄存器）来清除。\n\n* 0：无溢出错误\n* 1：检测到溢出错误\n\n#### 第 1 位\
  \ FE：帧错误\n\n当检测到同步丢失、过度噪声或空隙字符（break character）时，硬件设置此位。它通过软件序列（先读取 `USART_SR` 寄存器，后读取\
  \ `USART_DR` 寄存器）来清除。\n\n* 0：未检测到帧错误\n* 1：检测到帧错误或空隙字符\n\n#### 第 0 位 PE：校验错误\n\n\
  当接收模式下发生校验错误时，硬件设置此位。它通过软件序列（先读取状态寄存器，后读取 `USART_DR` 寄存器）来清除。如果 `USART_CR1` 寄存器中的\
  \ `PEIE` = `1`，则会产生中断。\n\n* 0：无校验错误\n* 1：检测到校验错误\n\n图 4-23：状态寄存器 (USART_SR) *TXE（发送数据寄存器空）标志***\n\
  \n### 数据发送过程\n\n为了通过 TxD 串行输出字节数据，我们必须将数据写入 USART 数据寄存器 (`USART_DR`)。发送移位器是一个并行入串出的移位器，其工作是从\
  \ `DR` 获取数据，将其加上起始位和停止位，并通过 TXD 逐位发送。发送移位器对程序员不可见。发送器是双缓冲的，这意味着除了移位器外，还有一个数据寄存器。当移位器正在移出最后一个字节时，程序可以将另一个字节数据写入寄存器，以等待移位器就绪。寄存器与移位器之间的数据传输是自动的，程序员无需担心。我们只能写入\
  \ `USART_DR` 寄存器。每当移位器为空时，它都会从 `USART_DR` 获取新数据并立即清除 `USART_DR` 寄存器，以防重复发送相同的数据。当移位器从\
  \ `USART_DR` 获取数据时，它会清除 `TXE` 标志，表示其为空且 `USART_DR` 寄存器已准备好接收下一个字符。我们在向 `USART_DR`\
  \ 寄存器写入另一个字节之前监控 `TXE` 标志。\n\n#### TC（发送完成）标志\n\n必须强调的是，`TC`（发送完成）标志表示发送数据寄存器和移位器均为空，发送器没有更多数据需要发送。该位用于程序在开始下一个任务之前确认所有数据已发送。当\
  \ `TXE` 标志置位时，发送数据寄存器为空，但最后一个字节数据可能仍在移位器中。如果程序要关闭发送器，最后一个字节数据将丢失且数据可能只传输了一半，这可能会导致接收端产生混乱或错误。`TC`\
  \ 标志主要用于错误处理和调试，以便程序在停止操作或重新初始化 USART 之前等待传输完成。\n\n#### RXNE（接收非空）标志\n\n\n\n\n内部串入并出移位寄存器通过\
  \ `RXD` 引脚接收数据。它会移除起始位和停止位，并将接收到的字节写入 USART 数据寄存器（`USART_DR`）。该接收器还具有双缓冲功能。当接收到的数据被写入\
  \ `DR` 寄存器后，移位寄存器就可以接收另一个字节的数据了。这使得接收器能够连续接收数据。程序有时间在下一个字节完全移入之前读取上一个字节的数据。程序应该频繁检查\
  \ `RXNE` 标志位，以查看数据是否准备就绪可以读取。从 `USART_DR` 寄存器读取数据后，`RXNE` 标志位将自动清除。根据 ST Arm 参考手册：““`RXNE`\
  \ 位被置为 1，表示移位寄存器的内容已传输到 `USART_DR`。换句话说，数据已经接收并可以读取（以及其相关的错误标志）。”\n\n如果程序未在下一个字节移入之前未从\
  \ `USART_DR` 寄存器中读取数据，则会发生缓冲区溢出错误。一个字节的数据将丢失，并且 `USART_SR` 寄存器中的溢出错误（`ORE`）标志位会被设置。\n\
  \n### 重置并启用 USART\n\n正如我们之前提到的，为了节电，许多片上外设在从复位后都是禁用的。在启用 USART 之前，首先应该启用到 USART\
  \ 的总线时钟。这些时钟的启用在本节前面的部分描述过。\n\n在启用 USART 之前，应对其进行正确配置，因为大多数控制寄存器受启用保护，这意味着它们在模块启用时无法进行修改。在配置之前禁用\
  \ USART 的一种良好方法是使用软件重置。通过向 `CR1`（控制寄存器 1）的 `UE` 位（`UE`，USART Enable）写入 `1`，所有寄存器将恢复为默认值，且模块将被禁用。当配置完成后，向\
  \ `CR1` 寄存器的 `USART Enable` 位写入 `1` 即可启用 USART 模块。\n\n### 用于 USART TxD 和 RxD 的 GPIO\
  \ 引脚\n\n除了 USART 寄存器的设置外，我们还必须配置 USART 的 I/O 引脚（`TxD` 和 `RxD`）使用它们的复用功能。在最后两个章节中，我们将\
  \ I/O 引脚用作通用 I/O（`GPIO`）。当 I/O 引脚用于 USART、定时器和 ADC 等其他外设功能时，我们需要使用 `AFRx`（复用功能寄存器）将它们配置为复用外设功能。\n\
  \n在 STM Arm 中，每个端口最多有 16 个引脚。每个端口有两个 `GPIO_AFRx` 寄存器，即 `GPIO_AFRL` 和 `GPIO_AFRH`。每个\
  \ `GPIO_AFRx` 寄存器长 32 位，用于持有 8 个引脚的复用功能选择。由于我们有 `AF15-AF0`（共 16 个）选项，每个条目需要 4 位（`16\
  \ AFx4=64bits`）。这意味着我们需要两个 32 位的寄存器（`32x2=64bits`）来处理所有的复用功能。这解释了为什么我们有 `GPIO_AFRH`\
  \ 和 `GPIO_AFRL` 寄存器。\n\n为了使 `GPIO_AFRx` 寄存器的复用功能选择生效，必须首先配置每个引脚的 `GPIO_MODER` 位。见图\
  \ 4-24。复位时，`GPIO_MODER` 被设置为模拟功能。这意味着，我们首先选择 `GPIO_MODER=10` 作为 AF ，然后使用 `GPIO_AFRx`\
  \ 寄存器选择八个复用外设引脚功能之一。见图 4-25。可用功能取决于引脚，并如表 4-5 所示。在示例程序 P4-1 中，`PA2` 和 `PA3` 引脚将用于\
  \ `USART2_TxD` 和 `USART2_RxD`。\n\n\n\n\n```c\n/*---------------------------------------------------------------------------主函数\n\
  *----------------------------------------------------------------------------*/\n\
  int main (void) {\n  USART2_init(); /* 初始化 USART2 */\n\n  while(1) { /* 无限循环 */\n\
  \    USART2_write('Y');\n    USART2_write('e');\n    USART2_write('s');\n    delayMs(10);\
  \ /* 在消息之间留出间隔 */\n  }\n}\n```\n\n```c\n/*---------------------------------------------------------------------------初始化\
  \ UART 引脚、波特率\n*----------------------------------------------------------------------------*/\n\
  void USART2_init (void) {\n  RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n  RCC->APB1ENR\
  \ |= 0x20000; /* 开启 USART2 时钟 */\n  /* 配置 PA2 用于 USART2_TX */\n  GPIOA->AFR[0] &=\
  \ ~0x0F00;\n  GPIOA->AFR[0] |= 0x0700; /* USART2 使用复用功能 7 */\n  GPIOA->MODER &=\
  \ ~0x0030;\n  GPIOA->MODER |= 0x0020; /* 开启 PA2 的复用功能 */\n  USART2->BRR = 0x0683;\
  \ /* 16 MHz @ 9600 波特率 */\n  USART2->CR1 = 0x0008; /* 开启发送，8 位数据 */\n  USART2->CR2\
  \ = 0x0000; /* 1 位停止位 */\n  USART2->CR3 = 0x0000; /* 无流控 */\n  USART2->CR1 |= 0x2000;\
  \ /* 开启 USART2 */\n}\n```\n\n```c\nvoid delayMs(int n) {\n  int i;\n  for (; n >\
  \ 0; n--)\n    /* 向 USART2 写入一个字符 */\n    void USART2_write (int ch) {\n      while\
  \ (!(USART2->SR & 0x0080)) {} // 等待发送寄存器为空\n      USART2->DR = (ch & 0xFF);\n  \
  \  }\n  for (i = 0; i < 2000; i++) ;\n}\n```\n\n### TXE（发送数据寄存器空）标志位的重要性\n\n为了理解\
  \ `TXE` 作用的重要性，请查看 STM Arm 通过 `DR` 寄存器传输字符时所经历的以下步骤：\n\n1. 将要传输的字符写入 `DR`（数据寄存器）中。\n\
  2. `TXE` 标志位自动置为 0，表示 `DR` 寄存器已有字符，在当前字符被移空之前将不会接收另一个字符。\n3. 发送移位寄存器从 `DR` 寄存器读取字符并开始传输该字符。\n\
  4. 一旦字符移动到移位寄存器，`TXE` 标志位立即置为 1，表示 `DR` 寄存器已准备接收另一个字符。\n5. 在上一个字符仍在移出的，程序可以将另一个字符加载到\
  \ `DR` 寄存器中。\n6. 当上一个字符移出后，`DR` 寄存器中的新字符被移动到移位寄存器并立即开始传输。\n\n通过监控 `TXE` 标志位，程序可以保持\
  \ `DR` 寄存器始终满位，字符传输可以连续进行，以实现全额吞吐量。\n\n### 配置 USART 接收数据的步骤\n\n以下是配置 `USART2` 并向\
  \ STM Nucleo 板接收一个字节数据的步骤：\n\n1. 开启 `GPIOA` 的时钟。\n2. 开启 `USART2` 的时钟。\n3. 使用 `GPIO_MODER`\
  \ 和 `GPIO_AFRL` 寄存器为 `PA3` (`USART2_RxD`) 引脚选择外设功能 `AF7`。\n4. 使用 `USART2_BRR` 寄存器设置\
  \ `USART2` 的波特率。\n5. 配置 `CR1`（控制 1）寄存器的过采样率、字符大小（8 位或 9 位）并开启接收 (`RE`)。\n6. 配置 `CR2`（控制\
  \ 2）寄存器的停止位个数等。\n7. 配置 `CR3`（控制 3）寄存器以设置无硬件流控等。\n8. 配置完成后开启 `USART2`。\n9. 等待 `USART_SR`\
  \ 寄存器的 `RXNE`（接收非空）位被置位。\n10. 从 `USART2_DR` 寄存器读取接收到的字节。\n11. 如需接收下一个字符，返回第 9 步。\n\
  \n程序 4-2 通过 `USART2` 接收数据字节并显示在 LED 上。\n\n### 程序 4-2：USART2 接收\n\n```c\n /* p4_2.c\
  \ 115200 波特率下 USART2 接收 UART\n*\n* 从 * 主机 PC 的终端模拟器 (TeraTerm) 接收按键，到 Nucleo-F446RE\
  \ 板的 USART2。\n* USART2 连接到 ST-Link 虚拟串口 口。\n* 在 PC 上启动 Tera Term 并按下任意键。\n* 使用第\
  \ 3 章 P3_5 节的 LED 程序根据接收到的按键闪烁绿色 LED *。\n* 在按下下一个按键之前，需要等待闪烁停止。* 接收到的按键不会回显到终端，因此你看不到\
  \ * 显示字符。\n*\n* 默认情况下，时钟运行频率为 16 MHz。\n* UART2 配置为 AF7\n```\n\n```c\n#include \"\
  stm32f4xx.h\"\n\nvoid USART2_init(void);\nvoid USART2_write(int ch);\nvoid delayMs(int\
  \ n);\n\nint main (void) {\n  USART2_init();\n  while(1) {\n    USART2_write('Y');\n\
  \    USART2_write('e');\n    USART2_write('s');\n    delayMs(10);\n  }\n}\n\nvoid\
  \ USART2_init (void) {\n  RCC->AHB1ENR |= 1;\n  RCC->APB1ENR |= 0x20000;\n  GPIOA->AFR[0]\
  \ &= ~0x0F00;\n  GPIOA->AFR[0] |= 0x0700;\n  GPIOA->MODER &= ~0x0030;\n  GPIOA->MODER\
  \ |= 0x0020;\n  USART2->BRR = 0x0683;\n  USART2->CR1 = 0x0008;\n  USART2->CR2 =\
  \ 0x0000;\n  USART2->CR3 = 0x0000;\n  USART2->CR1 |= 0x2000;\n}\n\nvoid USART2_write\
  \ (int ch) {\n  while (!(USART2->SR & 0x0080)) {}\n  USART2->DR = (ch & 0xFF);\n\
  }\n\nvoid delayMs(int n) {\n  int i;\n  for (; n > 0; n--) ;\n  for (i = 0; i <\
  \ 2000; i++) ;\n}\n```\n\n### RXNE（接收非空）标志位的重要性\n\n为了理解 `RXNE` 作用的重要性，请查看 STM Arm\
  \ 通过 `DR` 寄存器接收字符时所经历的以下步骤：\n\n1. 接收到的字符被写入 `DR`（数据寄存器）。\n2. `RXNE` 标志位被被置为 1，表示\
  \ `DR` 寄存器已有字符，在当前字符被读取之前将不会接收另一个字符。\n3. 接收移位寄存器从 `DR` 寄存器读取字符并开始传输该字符。\n4. 一旦字符移动到移位寄存器，`RXNE`\
  \ 标志位立即置为 0，表示 `DR` 寄存器已准备接收另一个字符。\n5. 在上一个字符仍在移出的，程序可以将另一个字符加载到 `DR` 寄存器中。\n6.\
  \ 当上一个字符移出后，`DR` 寄存器中的新字符被移动到移位寄存器并立即开始传输。\n\n通过监控 `RXNE` 标志位，程序可以保持 `DR` 寄存器始终满位，字符传输可以连续进行，以实现全额吞吐量。\n\
  \n### 配置 USART 接收数据的步骤\n\n以下是配置 `USART2` 并向 STM Nucleo 板接收一个字节数据的步骤：\n\n1. 开启 `GPIOA`\
  \ 的时钟。\n2. 开启 `USART2` 的时钟。\n3. 使用 `GPIO_MODER` 和 `GPIO_AFRL` 寄存器为 `PA3` (`USART2_RxD`)\
  \ 引脚选择外设功能 `AF7`。\n4. 使用 `USART2_BRR` 寄存器设置 `USART2` 的波特率。\n5. 配置 `CR1`（控制 1）寄存器的过采样率、字符大小（8\
  \ 位或 9 位）并开启接收 (`RE`)。\n6. 配置 `CR2`（控制 2）寄存器的停止位个数等。\n7. 配置 `CR3`（控制 3）寄存器以设置无硬件流控等。\n\
  8. 配置完成后开启 `USART2`。\n9. 等待 `USART_SR` 寄存器的 `RXNE`（接收非空）位被置位。\n10. 从 `USART2_DR`\
  \ 寄存器读取接收到的字节。\n11. 如需接收下一个字符，返回第 9 步。\n\n程序 4-2 通过 `USART2` 接收数据字节并显示在 LED 上。\n\
  \n```c\n /* p4_2.c 115200 波特率下 USART2 接收 UART\n*\n* 从 * 主机 PC 的终端模拟器 (TeraTerm)\
  \ 接收按键，到 Nucleo-F446RE 板的 USART2。\n* USART2 连接到 ST-Link 虚拟串口 口。\n* 在 PC 上启动 Tera\
  \ Term 并按下任意键。\n* 使用第 3 章 P3_5 节的 LED 程序根据接收到的按键闪烁绿色 LED *。\n* 在按下下一个按键之前，需要等待闪烁停止。*\
  \ 接收到的按键不会回显到终端，因此你看不到 * 显示字符。\n*\n* 默认情况下，时钟运行频率为 16 MHz。\n* UART2 配置为 AF7\n```\n\
  \n```c\n#include \"stm32f4xx.h\"\n\nvoid USART2_init(void);\nvoid USART2_write(int\
  \ ch);\nvoid delayMs(int n);\nvoid LED_blink(int value);\n\nint main (void) {\n\
  \  USART2_init();\n  while(1) {\n    char c;\n    while (!(USART2->SR & 0x0004))\
  \ {}\n    c = (char)USART2->DR;\n    LED_blink(c);\n  }\n}\n\nvoid USART2_init (void)\
  \ {\n  RCC->AHB1ENR |= 1;\n  RCC->APB1ENR |= 0x20000;\n  GPIOA->AFR[0] &= ~0x0F00;\n\
  \  GPIOA->AFR[0] |= 0x0700;\n  GPIOA->MODER &= ~0x0030;\n  GPIOA->MODER |= 0x0020;\n\
  \  USART2->BRR = 0x0683;\n  USART2->CR1 = 0x0008;\n  USART2->CR2 = 0x0000;\n  USART2->CR3\
  \ = 0x0000;\n  USART2->CR1 |= 0x2000;\n}\n\nvoid delayMs(int n) {\n  int i;\n  for\
  \ (; n > 0; n--) ;\n  for (i = 0; i < 2000; i++) ;\n}\n\nvoid LED_blink(int value)\
  \ {\n  // 简化版的 LED 逻辑，根据按键值闪烁\n  for (int i = 0; i < (value % 5); i++) {\n    GPIOA->ODR\
  \ |= (1 << 13);\n    delayMs(100);\n    GPIOA->ODR &= ~(1 << 13);\n    delayMs(100);\n\
  \  }\n}\n```\n\n\n\n\n请确保你正在使用 `3.3V` 逻辑电平转换器，或将转换器配置为使用 `3.3V`。许多 TTL 电平串口转 USB\
  \ 转换器的输出电压高于 `3.6V`。它们在短期内可能看起来正常，但会损坏 Arm 输入引脚。\n\n程序 4-3 根据程序 4-1 修改而成，使用了 `UART4`。（`UART`\
  \ 模块类似于 `USART` 模块，但不支持同步通信。）通过对比，你会发现相关端口的初始化发生了变化。程序 4-3 还演示了如何初始化字符数组并将消息字符串发送到\
  \ `UART`。\n\n#### **程序 4-3：通过 UART4 向 Tera Term 发送 \"Hello\"**\n\n```c\n /* p4_3.c\
  \ 向 UART4 发字符串 \"YES\"\n*\n* UART4 Tx 信号连接到引脚 PA0。若要在 PC 上查看 UART4 的输出，\n* 你需要使用\
  \ USB 转串口模块。将该模块的 Rx 引脚连接到\n* STM32F446 Nucleo 开发板的 PA0 引脚。确保你使用的\n* USB 转串口模块具有\
  \ 3.3V 接口。\n*\n* 默认情况下，时钟以 16 MHz 运行。\n* UART 配置为 9600 波特。\n* PA0 - UART4 TX (AF8)\n\
  *\n* 此程序使用 Keil uVision v5.24a 和 DFP v2.11.0 测试通过。 */\n\n#include \"stm32F4xx.h\"\
  \n\nvoid UART4_init(void); \nvoid UART4_write(int c); \nvoid delayMs(int);\n\n/*---------------------------------------------------------------------------MAIN\
  \ 函数\n*----------------------------------------------------------------------------*/\
  \ \nint main (void) {\n    char message[] = \"Hello\\r\\n\";\n    int i;\n    UART4_init();\
  \ \n    while (1) { \n        for (i = 0; i < 7; i++) { \n            UART4_write(message[i]);\
  \ /* 发送一个字符 */ \n        } \n        delayMs(10); /* 在消息之间留出间隔 */ \n    } \n}\n\n\
  /*---------------------------------------------------------------------------初始化\
  \ UART 引脚，波特率\n*----------------------------------------------------------------------------*/\
  \ \nvoid UART4_init (void) {\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n    RCC->APB1ENR\
  \ |= 0x80000; /* 开启 UART4 时钟 */\n    /* 配置 PA0 为 UART4 TX */\n    GPIOA->AFR[0]\
  \ &= ~0x000F;\n    GPIOA->AFR[0] |= 0x0008; /* UART4 使用复用 8 */\n    GPIOA->MODER\
  \ &= ~0x0003;\n    GPIOA->MODER |= 0x0002; /* 开启 PA0 复用功能 */\n    UART4->BRR = 0x0683;\
  \ /* 16 MHz @ 9600 波特 */ \n    UART4->CR1 = 0x0008; /* 开启 Tx，8 位数据 */ \n    UART4->CR2\
  \ = 0x0000; /* 1 停止位 */ \n    UART4->CR3 = 0x0000; /* 无流控 */ \n    UART4->CR1 |=\
  \ 0x2000; /* 开启 UART4 */\n}\n\n/* 向 UART4 写入字符 */\nvoid UART4_write (int ch) {\n\
  \    while (!(UART4->SR & 0x0080)) {} // 等待 Tx 缓冲区空\n    UART4->DR = (ch & 0xFF);\n\
  }\n\nvoid delayMs(int n) {\n    int i;\n    for (; n > 0; n--) \n        for (i\
  \ = 0; i < 2000; i++) ; \n}\n```\n\n程序 4-4 结合了 `UART` 发送与 `UART` 接收。当使用终端模拟程序按下\
  \ PC 上的按键时，按键字符会被发送到 STM Nucleo 板。接收到的字符将通过 `UART` 回显到 PC 上的终端模拟器。\n\n#### **程序\
  \ 4-4：从 UART4 回显接收的数据**\n\n```c\n /* p4_4.c UART4 在 9600 波特下回显\n*\n* 此程序从 UART4\
  \ 接收器接收一个字符\n* 然后通过 UART4 发送器发送。\n* UART4 连接到 PA0-Tx 和 PA1-Rx。\n* 使用带有 3.3V 信号平的\
  \ USB 线将 PA0/PA1\n* 连接到主机 PC 的 COM 口。\n* PA0 - UART4 TX (AF8)\n* PA1 - UART4 RX\
  \ (AF8)\n* 在主机 PC 上使用 Tera Term 发送按键并观察\n* 回显字符的显示。\n*\n* 默认情况下，时钟以 16 MHz 运行。\n\
  *\n* 此程序使用 Keil uVision v5.24a 和 DFP v2.11.0 测试通过。 */ \n\n#include \"stm32F4xx.h\"\
  \n\nvoid UART4_init(void); \nvoid UART4_write(int c); \nvoid delayMs(int);\nchar\
  \ UART4_read(void);\n\nint main (void) { \n    char c;\n    UART4_init();\n    while\
  \ (1) {\n        c = UART4_read(); \n        UART4_write(c);\n    }\n}\n\n/* 初始化\
  \ UART 以 9600 波特传输 */ \nvoid UART4_init (void) {\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA\
  \ 时钟 */\n    RCC->APB1ENR |= 0x80000; /* 开启 UART4 时钟 */\n    /* 配置 PA0, PA1 为 UART4\
  \ TX, RX */\n    GPIOA->AFR[0] &= ~0x000F;\n    GPIOA->AFR[0] |= 0x0008; /* UART4\
  \ 使用复用 8 */\n    GPIOA->MODER &= ~0x0003;\n    GPIOA->MODER |= 0x0002; /* 开启 PA0\
  \ 复用功能 */\n    UART4->BRR = 0x0683; /* 16 MHz @ 9600 波特 */ \n    UART4->CR1 = 0x0008;\
  \ /* 开启 Tx，8 位数据 */ \n    UART4->CR2 = 0x0000; /* 1 停止位 */ \n    UART4->CR3 = 0x0000;\
  \ /* 无流控 */ \n    UART4->CR1 |= 0x2000; /* 开启 UART4 */\n}\n```\n\n\n\nC 库提供了一些方便使用的标准控制台\
  \ I/O 函数，例如 `getchar()`、`putchar()`、`gets()`、`puts()`、`printf()` 和 `scanf()`。这些函数依赖硬件来提供输入和输出。在\
  \ Keil MDK-Arm 中，硬件接口由两个函数处理：`fgetc()` 和 `fputc()`。嵌入式程序员人员需要实现这两个函数以进行 I/O 操作。这些函数的实现通常位于名为板级支持包（BSP）的软件部分。在下方的示例程序\
  \ P4-5 中，我们使用 `USART2` 作为控制台，并将 `fgetc()` 和 `fputc()` 直接定向到 `USART2_read()` 和 `USART2_write()`，因此所有的控制台\
  \ I/O 都将使用 `USART2`，该设备通过 Nucleo 板上的 `ST-Link` 通过虚拟控制台连接到主机 PC。使用如 `Tera Term` 等终端模拟器将允许用户访问嵌入式程序控制台\
  \ I/O 的用户界面。`USART2_write()` 和 `USART2_read()` 的返回值已根据 P4-1 和 P4-2 进行了修改，以匹配 C 库的函数原型。\n\
  \n#### 程序 4-5：在 Keil 中使用 USART2 的 C 库控制台 I/O\n\n```c\n /* p4_5.c 9600 波特率下使用 USART2\
  \ 的 C 库控制台 I/O\n*\n* 此程序演示了 C 库控制台 I/O 的使用。putc() 和 fgetc() 使用\n* USART2_write()\
  \ 和 USART2_read() 实现用于字符 I/O。\n* 在 fgetc() 中，接收到的字符会被回显，如果收到 '\\r' * 则会回显一对 '\\\
  r', '\\n'。\n* 在 fputc() 和 fgetc() 中，未检查文件描述符。所有 * 文件 I/O 均定向到控制台。\n*\n* 默认情况下，时钟运行频率为\
  \ 16 MHz。\n* USART 配置为 9600 波特。\n* PA2 - USART2 TX (AF7)\n* PA3 - USART2 RX (AF7)\n\
  * 在主机 PC 上使用 Tera Term 发送按键并观察回显字符的显示 *\n*\n* 此程序已使用 Keil uVision v5.24a 和 DFP v2.11.0\
  \ 通过测试 * */\n#include \"stm32F4xx.h\"\n\n#include <stdio.h>\n\nvoid USART2_init(void);\
  \ void delayMs(int);\n\nint USART2_write(int c); int USART2_read(void);\n\nint main(void)\
  \ { int n;\n\nchar str[80];\n\nUSART2_init();\nprintf(\"Test stdio library console\
  \ I/O functions\\r\\n\"); fprintf(stdout, \" test for stdout\\r\\n\");\n\nfprintf(stderr,\
  \ \" test for stderr\\r\\n\");\n\nwhile (1) {\n\nprintf(\"please enter a number:\
  \ \"); scanf(\"%d\", &n);\nprintf(\"the number entered is: %d\\r\\n\", n); printf(\"\
  please type a character string: \"); gets(str);\nprintf(\"the character string entered\
  \ is: \"); puts(str);\nprintf(\"\\r\\n\");\n}\n}\n\n/* 初始化 USART2 以 9600 波特率传输 */\
  \ void USART2_init (void) {\n\nRCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\nRCC->APB1ENR\
  \ |= 0x20000; /* 开启 USART2 时钟 */\n/* 配置 PA2, PA3 为 USART2 TX, RX */ GPIOA->AFR[0]\
  \ &= ~0xFF00;\nGPIOA->AFR[0] |= 0x7700; /* USART2 使用 alt7 */\nGPIOA->MODER &= ~0x00F0;\n\
  GPIOA->MODER |= 0x00A0; /* 开启 PA2, PA3 的复用功能 */\nUSART2->BRR = 0x0683; /* 16 MHz\
  \ 下 9600 波 */ USART2->CR1 = 0x000C; /* 开启 Tx, Rx, 8 位数据 */ USART2->CR2 = 0x0000;\
  \ /* 1 停止位 */\nUSART2->CR3 = 0x0000; /* 无流控 */ USART2->CR1 |= 0x2000; /* 开启 USART2\
  \ */\n}\n\n/* 向 USART2 写一个字符 */\nint USART2_write (int ch) {\n\nwhile (!(USART2->SR\
  \ & 0x0080)) {} // 等待 Tx 缓冲区空\nUSART2->DR = (ch & 0xFF);\nreturn ch;\n}\n\n/* 从\
  \ USART2 读取一个字符 */\nint USART2_read(void) {\n\nwhile (!(USART2->SR & 0x0020)) {}\
  \ // 等待字符到达\nreturn USART2->DR;\n}\n\n/* 下面代码是 C 标准 I/O 库的接口。 * 所有 I/O 均定向到控制台，即\
  \ UART3。 */\nstruct __FILE { int handle; };\nFILE __stdin = {0};\nFILE __stdout\
  \ = {1};\nFILE __stderr = {2};\n\n/* C 库控制台/文件输入调用\n* 此函数回显接收到的字符。 * 如果字符是 '\\r'，则被替换为\
  \ '\\n' */\nint fgetc(FILE *f) {\n\nint c;\nc = USART2_read(); /* 从控制台读取字符 */\n\
  if (c == '\\r') { /* 如果字符是 '\\r' */\nUSART2_write('\\r');\nUSART2_write('\\n');\n\
  }\nUSART2_write(c);\nreturn c;\n}\n\n/* C 库控制台/文件输出调用 */\nint fputc(int c, FILE\
  \ *f) {\n\nif (f == __stdout) { /* 如果是 stdout */\nUSART2_write(c);\n}\nreturn c;\n\
  }\n```\n\n#### 4-2\n\nC 库提供了一些方便使用的标准控制台 I/O 函数，例如 `getchar()`、`putchar()`、`gets()`、`puts()`、`printf()`\
  \ 和 `scanf()`。这些函数依赖硬件提供输入输出。在 Keil MDK-Arm 中，硬件接口由两个函数处理：`fgetc()` 和 `fputc()`。嵌入式程序员人员需要实现这两个函数以进行\
  \ I/O 操作。这些函数的实现通常位于名为板级支持包（BSP）的软件部分。在下方的示例程序 P4-5 中，我们使用 `USART2` 作为控制台，并将 `fgetc()`\
  \ 和 `fputc()` 直接定向到 `USART2_read()` 和 `USART2_write()`，因此所有的控制台 I/O 都将使用 `USART2`，该设备通过\
  \ Nucleo 板上的 `ST-Link` 通过虚拟控制台连接到主机 PC。使用如 `Tera Term` 等终端模拟器将允许用户访问嵌入式程序控制台 I/O\
  \ 的用户界面。`USART2_write()` 和 `USART2_read()` 的返回值已根据 P4-1 和 P4-2 进行了修改，以匹配 C 库的函数原型。\n\
  \n#### 5.1：计数器和定时器简介\n\n在数字设计中，通过将许多触发器（FF）连接在一起来创建加/减计数器。例如，连接 3 个触发器可以计数到 7（000-111）。这被称为\
  \ *3 位计数器*。对于 4 位计数器，我们需要 4 个触发器（0000-1111）。对于 16 位计数器，我们需要 16 个触发器，且它可以计数到 $2^{16}$。\n\
  \n#### 计数器的用途\n\n计数器有不同的用途。其中包括：\n\n1. 计数事件\n2. 延迟（使用计数器作为定时器）\n3. 测量两个事件之间的时间\n\
  \n***1. 计数事件***\n\n你可能需要计算通过街道的车辆数量，或者工厂生产的意大利面包装数量。为了这样做，你可以将传感器的输出连接到计数器，如下所示。\n\
  \n\n\n\n在控制设备时，一种常见的做法是在指定的时间过去后启动或终止任务。例如，洗衣机或烤箱会对每个任务执行预定的时间长度的操作。要进行定时，我们可以将时钟发生器连接到计数器，并等待指定的时间过去。例如，在下图所示，时钟发生器产生一个\
  \ `1 Hz` 的信号，计数器每秒增加一次。计数器在 60 秒后达到 60。\n\n![](img/image00270.jpeg) **图 5-5：使用计数器作为定时器\n\
  \n### 3. 测量两个事件之间的时间\n\n你可能需要测量两个事件之间的时间。例如，马拉松运动员从起点到终点所需的时间。在这种情况下，我们可以使用类似于图所示的电路：\n\
  \n![](img/image00271.jpeg) **图 5-6：捕获**\n\n计数器在开始时清零。然后，它在每个时钟脉冲上增加。当运动员通过终点线时，计数器的值被加载到另一个寄存器。\n\
  \n### 微控制器中的计数器和定时器\n\n如今，所有的微控制器都带有片上定时器/计数器。如果到 `Timer` 的时钟来自内部源（如 `PLL`、`XTAL`\
  \ 和 `RC`），则它被称为 `Timer`（定时器）。如果时钟源来自外部源（例如输入 CPU 引脚的脉冲），则它被称为 `Counter`（计数器）。这里的\
  \ `Counter` 指事件计数器，因为它计算的是 CPU 外部发生的事件。在许多微控制器中，`Timers` 可以用作定时器或计数器。\n\n### 复习题\n\
  \n1. 使用 `5 个 FFs`，我们可以得到的最大计数值为 ________。\n2. 使用 `5 个 FFs`，我们可以将频率除以最大 ________。\n\
  3. 当脉冲从外部馈到定时器时，它被称为 ________。\n4. 当时钟脉冲从内部馈到定时器时，它被称为 ________。\n5. 如果我们需要将频率除以\
  \ `500`，我们需要 ______ 个触发器。\n\n### 第 5.2 节：系统滴答定时器 (System Tick Timer)\n\n每个 Arm Cortex-M\
  \ 均带有一个系统滴答定时器（System tick timer）。系统滴答定时器允许系统周期性地启动操作。该操作在内部以固定速率执行，无需外部信号。例如，在特定的应用中，我们可以使用\
  \ `SysTick` 每隔 `200 msec` 读取一次传感器。`SysTick` 被操作系统广泛使用，以便系统软件可以周期性地中断应用程序软件（通常间隔为\
  \ `10 ms`），以监控和控制系统运行。`SysTick` 是一个 24 位的递减计数器，由处理器时钟（`AHB clock`，馈送给 CPU 的时钟）驱动。它从初始值开始递减到\
  \ `0`。当它达到 `0` 时，在下一个时钟周期它会发生下溢（underflow），并产生一个名为 `COUNT` 的标志，然后重新加载初始值并重新开始。我们可以将初始值设置为\
  \ `0x000000` 到 `0xFFFFFF` 之间的值。见下图。\n\n![](img/image00272.jpeg) **图 5-7：系统滴答定时器的内部结构**\n\
  \n在 Arm Cortex-M 设备中，递减计数器命名为 `STCVR`（SysTick 当前值寄存器 `SysTick Current Value Register`）。计数器接收系统时钟或外部时钟的时钟。时钟源通过\
  \ `STCSR`（SysTick 控制与状态寄存器）寄存器的 `CLKSOURCE` 位选择。在 `STM32F4` 中，外部时钟连接到一个分频器，该分频器将\
  \ `AHB clock` 分频 8。时钟与 STCSR 寄存器的 `ENABLE` 位进行与运算，因此当 `ENABLE` 位被置位时它就开始递减。`STCSR`\
  \ 寄存器如图 5-.\n\n### SysTick 寄存器\n\n接下来，我们将描述 `SysTick` 寄存器。`SysTick` 模块中有三个寄存器：SysTick\
  \ 控制与状态寄存器、SysTick 重载值寄存器和 SysTick 当前值寄存器。\n\n`STCTRL`（SysTick 控制与状态）寄存器位于 `0xE000E010`。我们用它来启动\
  \ `SysTick` 计数器等。\n\n![](img/image00273.jpeg) **图 5-8：STCTRL（系统滴答控制）**\n\n`ENABLE\
  \ (D0)`：启用或禁用计数器。当 `ENABLE` 位被置位时，计数器用 `STRVR`（SysTick 重载值寄存器）的值初始化 `STCVR`（SysTick\
  \ 当前值寄存器），并递减直到达到零。然后，在下一个时钟周期，它发生下溢，将 `COUNTFLAG` 标志置高，计数器用 `STRVR` 寄存器的值重新加载 `STCVR`，然后重复该过程。见下图。\n\
  \n![](img/image00274.jpeg) **图 5-9：系统滴答计数\n\n`TICKINT (Tick 中断)`：如果 `TICKINT=1`，当\
  \ `COUNTFLAG` 标志置位时会发生中断。见第 6 章。\n\n`CLKSOURCE (时钟源)`：Arm 核提供来自系统时钟或外部时钟的选择。如果 `CLKSOURCE=0`，则时钟来自外部源。如果\
  \ `CLKSOURCE=1`，则处理器时钟为 `SysTick` 递减计数器提供时钟。当 `CLKSOURCE` 位清除时，`SysTick` 以处理器时钟频率的\
  \ `1/8` 运行。\n\n`COUNTFLAG`：计数器从初始值递减，当达到 `0` 时，计数器重载 `STRVR` 中的值且 `COUNTFLAG` 置高。见图\
  \ 5-9。该标志保持高位直到被软件清除。\n\n`ENABLE (D0)`：启用或禁用计数器。当 `ENABLE` 位被置位时，计数器用 `STRVR`（SysTick\
  \ 重载值寄存器）的值初始化 `STCVR`（SysTick 当前值寄存器），并递减直到达到零。然后，在下一个时钟周期，它发生下溢，将 `COUNTFLAG`\
  \ 标志置高，计数器用 `STRVR` 寄存器的值重新加载 `STCVR`，然后重复该过程。见下文（此处省略重复的寄存器描述，以符合要求不重复输出原文）\n\n\
  **第 5.2 节：系统滴答定时器**\n\n...\n它从初始值递减到 `0`。当它达到 `0` 时，在下一个时钟周期，它发生下溢，并产生一个名为 `COUNT`\
  \ 的标志，然后重新加载初始值并重新开始。我们可以将初始值设置为 `0x000000` 到 `0xFFFFFF` 之间的值。见下图。\n\n![](img/image00272.jpeg)\
  \ **图 5-7：系统滴答定时器的内部结构**\n\n在 Arm Cortex-M 设备中，递减计数器命名为 `STCVR`（SysTick 当前值寄存器）。计数器接收系统时钟或外部时钟的时钟。时钟源通过\
  \ `STCSR`（SysTick 控制与状态寄存器）寄存器的 `CLKSOURCE` 位选择。在 `STM32F4` 中，外部时钟连接到一个分频器，该分频器将\
  \ `AHB clock` 分频 8。时钟与 STCSR 寄存器的 `ENABLE` 位进行与运算，因此当 `ENABLE` 位被置位时它就开始递减。`STCSR`\
  \ 寄存器如图 5-.\n\n**示例 5-2**\n\n在 Arm 微控制器系统时钟为 `8MHz` 的情况下，计算由以下函数产生的延迟。\n\n```c\n\
  void delay(){\n```\n\n\n\n\n\n```c\nSysTick->LOAD = 9; SysTick->VAL = 0; SysTick->CTRL\
  \ = 5; /* 清空当前值寄存器 */\n\n/* 启用定时器 */\n\nwhile((SysTick->CTRL & 0x10000) == 0) /*\
  \ 等待 COUNTFLAG 设置 */ { }\n\nSysTick->CTRL = 0; /* 停止定时器 (Enable = 0) */\n```\n\n\
  ### 解决方案：\n\n定时器初始化为 `9`。因此，它经过了以下 10 个阶段：\n\n![](img/image00276.jpeg)由于选择了系统时钟作为时钟源，每个时钟周期持续为\
  \ `1 / 8 = 0.125µs`。[������������ 8������]\n\n因此，程序产生了 `9 × 0.125µs = 1.125µs` 的延迟。\n\
  \n**注意：** 函数调用和指令执行也会消耗几个时钟周期。如果你想计算精确的延迟时间，还应该将这些开销考虑在内。示例中选择的 `SysTick->VAL` 值较小，是为了方便说明。在实际应用中，你会希望选择一个较大的延迟，使得开销与延迟相比可以忽略不计。\n\
  \n**注意：** 当计数器达到零时会设置 `COUNTFLAG`，所以设置 `COUNTFLAG` 需要 9 个周期。如果使用周期性（重复性）操作，周期将等于\
  \ 10 个周期，因为计数器在重新加载之前会在 0 停留一个时钟周期。\n\n### 示例 5-3\n\n在 Arm 微控制器中，选择 `SYSCLK` 时钟作为系统滴答定时器的时钟源。如果\
  \ `STRVR` 寄存器加载 `N`，计算定时器产生的延迟。\n\n### 解决方案：\n\n定时器初始化为 `N`。因此，它经过了 `N` 个周期。\n\n\
  由于选择了系统时钟作为时钟源，每个时钟周期持续为 `1 / SYSCLK`。因此，程序产生了 `N × (1/ SYSCLK) = N / SYSCLK` 的延迟。\n\
  \n### 示例 5-4\n\n使用 `SysTick` 定时器编写一个产生 `1ms` 延迟的函数。假设 `SYSCLK = 16MHz`。\n\n### 解决方案：\n\
  \n根据示例 5-2 中得出的方程 `delay = N / SYSCLK`\n\n`N = delay × SYSCLK = 0.001 sec × 16 MHz\
  \ = 16,000` `N = 16,000`\n\n```c\nvoid delay1ms(void){\n    SysTick->LOAD = 16000;\n\
  \    SysTick->VAL = 0; /* 清空当前值寄存器 */\n    SysTick->CTRL = 0x5; /* 启用定时器 */\n  \
  \  while((SysTick->CTRL & 0x10000) == 0) /* 等待 COUNTFLAG 设置 */ { }\n    SysTick->CTRL\
  \ = 0; /* 停止定时器 (Enable = 0) */\n}\n```\n\n程序 5-2 使用 `SysTick` 每秒翻转 `PA5` 引脚 5 次。我们需要\
  \ `STRVR`（重装载）的值为 `3,200,000 – 1`，因为 `16MHz / 5 = 3,200,000`。我们假设系统时钟为 `16 MHz`。注意，每经过\
  \ `3,200,000` 个时钟，向下计数器达到 0，置位 `COUNTFLAG`。然后 `STRVR` 寄存器会自动加载 `3,200,000 – 1`。当读取\
  \ `STCTRL` (`SysTick->CTRL`) 寄存器时，`COUNTFLAG` 会清零。\n\n**程序 5-2：使用 SysTick 计数器以 5\
  \ Hz 翻转用户 LED**\n\n```c\n /* p2_2.c 使用 SysTick 在 STM32F446RE Nucleo64 上翻转绿色 LED\
  \ (LD2) *\n* 此程序使用 SysTick 生成 500 ms 延迟来\n* 翻转 LED。系统时钟以 16 MHz 运行。\n* SysTick 配置为从\
  \ 3199999 减到零\n* 以产生 500 ms 的延迟。\n* 此程序已使用 Keil uVision v5.24a 配合 DFP v2.11.0 通过测试\
  \ */\n#include \"stm32f4xx.h\"\n\nint main(void) {\n    RCC->AHB1ENR |= 1; /* 开启\
  \ GPIOA 时钟 */\n    GPIOA->MODER &= ~0x00000C00; /* 清空引脚模式 */\n    GPIOA->MODER |=\
  \ 0x00000400; /* 设置引脚为输出模式 */ /* 配置 SysTick */\n    SysTick->LOAD = 3200000 - 1;\
  \ /* 重载每秒时钟周期数 */\n    SysTick->VAL = 0;\n    SysTick->CTRL = 5; /* 启用，无中断，使用系统时钟\
  \ */\n    while (1) {\n        if (SysTick->CTRL & 0x10000) { /* 如果 COUNT 标志位被设置\
  \ */\n            GPIOA->ODR ^= 0x00000020; /* 翻转绿色 LED */ \n        }\n    }\n\
  }\n```\n\n在程序 5-3 中，`SysTick` 用于产生 1 毫秒倍数的延迟。使用了 `16,000` 的 `STRVR` 值，因为 `0.001\
  \ sec × 16 MHz`。\n\n**程序 5-3：使用 SysTick 产生 p2_2.c 使用 SysTick 在 STM32F446RE Nucleo64\
  \ 上翻转绿色 LED (LD2) *\n* 此程序使用 SysTick 生成 500 ms 延迟来\n* 翻转 LED。系统时钟以 16 MHz 运行。\n\
  * SysTick 配置为从 3199999 减到零\n* 以产生 500 ms 的延迟。\n* 此程序已使用 Keil uVision v5.24a 配合 DFP\
  \ v2.11.0 通过测试 */\n#include \"stm32f4xx.h\"\n\nint main(void) {\n    RCC->AHB1ENR\
  \ |= 1; /* 开启 GPIOA 时钟 */\n    GPIOA->MODER &= ~0x00000C00; /* 清空引脚模式 */\n    GPIOA->MODER\
  \ |= 0x00000400; /* 设置引脚为输出模式 */ /* 配置 SysTick */\n    SysTick->LOAD = 3200000 -\
  \ 1; /* 重载每秒时钟周期数 */\n    SysTick->VAL = 0;\n    SysTick->CTRL = 5; /* 启用，无中断，使用系统时钟\
  \ */\n    while (1) {\n        if (SysTick->CTRL & 0x10000) { /* 如果 COUNT 标志位被设置\
  \ */\n            GPIOA->ODR ^= 0x00000020; /* 翻转绿色 LED */ \n        }\n    }\n\
  }\n```\n\n在程序 5-3 中，`SysTick` 用于产生 1 毫秒倍数的延迟。使用了 `16,000` 的 `STRVR` 值，因为 `0.001\
  \ sec × 16 MHz`。\n\n程序 5-3：使用 SysTick 产生 p2_2.c 使用 SysTick 在 STM32F446RE Nucleo64\
  \ 上翻转绿色 LED (LD2)\n（注：由于原文中存在部分重复和乱码，翻译时已根据上下文逻辑进行了对齐处理）\n\n### 复习题\n\n1. `STRVR`\
  \ 最大可以达到 ________。\n2. 假设 `CPU` 频率为 16MHz。找到 `STRVR`。\n3. `SysTick` 是 ________ 位宽。\n\
  4. `STCSR` 的哪一位用于启用 `SysTick`？\n5. `SysTick` 是（ ）计数器。\n\n### 第 5.3 节：STM32xx 中的定时器和延迟生成\n\
  \n除了 `SysTick` 定时器，STM32 还带有大量的定时器。它们分为三类：\na) 高级控制定时器\nb) 通用定时器\nc) 基本定时器\n\n虽然大多数定时器是\
  \ 16 位的，但有两个 32 位定时器。这些 32 位定时器属于通用组，通常标记为 `TIM2` 和 `TIM5`。本节将对其进行讨论。\n\n`TIMx`\
  \ 具有与 `SysTick` 类似的计数器，但带有额外功能：\n- 为了减慢计数速度，它有一个分频器。\n- 它可以产生可编程频率和脉宽的输出。\n- 它可以捕获输入信号的频率和脉宽。\n\
  - 它可以作为一个事件计数器。\n- 在溢出、比较或捕获时，它可以产生中断或事件。\n\n我们将在后面的章节详细讨论这些功能。见下表。\n\n#### 定时时钟\n\
  \n正如我们在附录 C 中提到的，`SYSCLK` 通过 `AHB` 和 `APB` 分频器后传输到定时器等外设。`AHB` 分频器可以将 `SYSCLK` 最大缩小\
  \ `512`。`SYSCLK` 经过 `AHB` 分频器后，可以再次通过与 `APB` 相关的分频器进行分频。`APB` 分频器的分频值为 `1, 2, 4,\
  \ 8` 和 `16`。这适用于所有外设。然而，在 Arm 定时器的情况下，我们还有一个阶段。如果 `APB` 分频器为 `1`（不分频），则定时器频率与 `APB`\
  \ 相同。如果 `APB` 分频器为 `2, 4, 8, 16`，则定时器频率被设置为 `APB` 频率的两倍。\n\n\n\n\n在 `STM32F4xx`\
  \ 中，所有的定时器都连接到 `APB` 总线。`RCC_APB1ENR` 和 `APB2ENR` 寄存器用于启用或禁用各个 `TIMx` 定器的时钟。`RCC_APB1ENR`\
  \ 寄存器的位 `8-0` 用于某些 `TIMx` 定器的时钟。这些位在复位后会被清零。如果没有启用时钟，CPU 将无法与定时器通信。因此程序需要先启用这些时钟。图\
  \ 5-12 和 5-13 显示了 `RCC_APB1ENR` 和 `RCC_APB2ENR` 寄存器的部分。该寄存器宽 32 位，但图中仅显示与 `TIMx`\
  \ 定器相关的位。\n\n![](img/image00258.jpeg)\n\n- 位 8 `TIM14EN`: `TIM14` 时钟启用。此位由软件设置和清零。0：`TIM14`\
  \ 时钟禁用，1：`TIM14` 时钟启用。\n- 位 7 `TIM13EN`: `TIM13` 时钟启用。此位由软件设置和清零。0：`TIM13` 时钟禁用，1：`TIM13`\
  \ 时钟启用。\n- 位 6 `TIM12EN`: `TIM12` 时钟启用。此位由软件设置和清零。0：`TIM12` 时钟禁用，1：`TIM12` 时钟启用。\n\
  - 位 5 `TIM7EN`: `TIM7` 时钟启用。此位由软件设置和清零。0：`TIM7` 时钟禁用，1：`TIM7` 时钟启用。\n- 位 4 `TIM6EN`:\
  \ `TIM6` 时钟启用。此位由软件设置和清零。0：`TIM6` 时钟禁用，1：`TIM6` 时钟启用。\n- 位 3 `TIM5EN`: `TIM5` 时钟启用。此位由软件设置和清零。0：`TIM5`\
  \ 时钟禁用，1：`TIM5` 时钟启用。\n- 位 2 `TIM4EN`: `TIM4` 时钟启用。此位由软件设置和清零。0：`TIM4` 时钟禁用，1：`TIM4`\
  \ 时钟启用。\n- 位 1 `TIM3EN`: `TIM3` 时钟启用。此位由软件设置和清零。0：`TIM3` 时钟禁用，1：`TIM3` 时钟启用。\n-\
  \ 位 0 `TIM2EN`: `TIM2` 时钟启用。此位由软件设置和清零。0：`TIM2` 时钟禁用，1：`TIM2` 时钟启用。\n\n**图 5-12：RCC_APB1ENR\
  \ 寄存器用于启用定时器时钟**\n\n![](img/image00279.jpeg)\n\n- 位 18 `TIM11EN`: `TIM11` 时钟启用。此位由软件设置和清零。0：`TIM11`\
  \ 时钟禁用，1：`TIM11` 时钟启用。\n- 位 17 `TIM10EN`: `TIM10` 时钟启用。此位由软件设置和清零。0：`TIM10` 时钟禁用，1：`TIM10`\
  \ 时钟启用。\n- 位 16 `TIM9EN`: `TIM9` 时钟启用。此位由软件设置和清零。0：`TIM9` 时钟禁用，1：`TIM9` 时钟启用。\n\
  - 位 1 `TIM8EN`: `TIM8` 时钟启用。此位由软件设置和清零。0：`TIM8` 时钟禁用，1：`TIM8` 时钟启用。\n- 位 0 `TIM1EN`:\
  \ `TIM1` 时钟启用。此位由软件设置和清零。0：`TIM1` 时钟禁用，1：`TIM1` 时钟启用。\n\n**图 5-13：RCC_APB2ENR 寄存器用于启用定时器时钟**\n\
  \n例如，我们可以使用以下代码启用 `TIM2` 的时钟：\n\n```c\nRCC->APB1ENR |= 1; /* enable TIM2 clock */\n\
  ```\n\n## 定时器计数\n\n每个定时器的核心是一个计数器。驱动计数器的时钟 (`CK_CNT`) 可能来自外部源，或者通过分频器来自内部时钟 (`CK_INT`)。在此之前，我们将讨论来自\
  \ `CK_INT`。\n\n`STM32F4xx` 时钟系统非常灵活且复杂。附录 C 进行了详细说明。为了简化讨论和编程示例，这里使用 `16MHz` 作为\
  \ `SYSCLK`。这在复位时会自动完成。\n\n### 32 位定时器\n\n虽然 `STM32 Arm` 中的大多数定时器是 16 位的，但至少有一个 32\
  \ 位定时器。该 32 位定时器名为 `TIM2`，在所有 `STM32 Arm` 系列成员中名称相同。某些 `STM32F4` 芯片（如 `STM32F46`）有两个\
  \ 32 位定时器。它们被称为 `TIM2` 和 `TIM5`。我们也可以通过组合两个 16 位定时器创建 32 位定时器。\n\n表 5-2 显示了部分 `TIMx`\
  \ 寄存器。寄存器的大小各异。\n\n| 偏移量 (Offset) | 寄存器名称 (Register Name) |\n| :--- | :--- |\n|\
  \ 0x00 | `TIMx_CR1 (Control 1)` |\n| 0x04 | `TIMx_CR2 (Control 2)` |\n| 0x10 | `TIMx_SR\
  \ (Status)` |\n| 0x18 | `TIMx_CCMR1` |\n| 0x1C | `TIMx_CCMR2` |\n| 0x20 | `TIMx_CCER`\
  \ |\n| 0x24 | `TIMx_CNT (Count)` |\n| 0x28 | `TIMx_PSC(Presacler)` |\n| 0x2C | `TIM_ARR\
  \ (Auto Reload)` |\n| 0x34 | `TIMx_CCR1` |\n| 0x38 | `TIMx_CCR2` |\n| 0x3C | `TIMx_CCR3`\
  \ |\n| 0x40 | `TIMx_CCR4` |\n\n(注：原文包含大量重复描述，译文已对核心技术内容进行整合与规范翻译)\n\n\n\n\n# TIMx_PSC:\n\
  \n分频器通过分频定时器的输入时钟来减慢计数速度。如前所述如图 5-20 所示，`CK_INT` 时钟被分频器分频变为 `CK_INC`，进而驱动 `TIMx`\
  \ 计数器。分频器 `TIMx_PSC` 可以编程以进一步分频时钟。`TIM_PSC` 可以进行 1 到 `0xFFFF` (65,535) 的分频。\n\n\
  ![](img/image00285.jpeg) **图 5-19: TIMx 分频器 (TIMx_PSC)**\n\n![](img/image00286.jpeg)\
  \ **图 5-20: TIMx 分频器选项\n\n#### 示例 5-6\n\n在 `SYSCLK = 16MHz` 的 STM32F4xx 微控制器中，计算以下代码产生的延迟。假设计数器时钟来自\
  \ 16 MHz 的 `SYSCLK` 时钟。\n\n```c\nRCC->APB1ENR |= 1; TIM2->PSC = 1600 - 1; TIM2->ARR\
  \ = 6;\nTIM2->CNT = 0;\nTIM2->CR1 = 1;\n/* enable TIM2 clock */ /* divided by 1600\
  \ */\n/* divided by 6 */\n/* enable timer2 */\n```\n\n**解答：**\n\n由于选择了系统时钟作为时源，每个时钟周期持续\
  \ `1/16 = 62.5ns`。\n\n分频器 (`PSC`) 设置为分频 1,600，因此定时器的延迟为 `1,600 × 62.5ns × 6 = 600,000ns`。\n\
  \n#### 示例 5-7\n\n在 STM32F4xx 微控制器中，选择 `SYSCLK` 作为定时器/计数器的时源。如果 `TIMx_CNT` 寄存器载入\
  \ `N` 且分频器 (`PSC`) 分频 `M`，请推导出定时器产生的延迟公式。\n\n**解答：**\n\n定时器用 `N` 初始化。因此它经过 `(N +\
  \ 1)` 个阶段。\n\n由于选择了 `SYSCLK` 时钟作为时源，每个输入时钟周期持续 `(1 / SYSCLK)`。`PSC` 分频器将输入时钟分频 `M`，因此计数器时钟周期为\
  \ `(M / SYSCLK)`。所以程序产生的延迟为 `CNT × M / SYSCLK`。\n\n#### 示例 5-8\n\n使用 `TIM2` 显示产生\
  \ 20 ms 延迟的代码。假设 `SYSCLK = 16 MHz`。\n\n**解答：**\n\n根据示例 5-7 中推导出的方程：\n\n`delay =\
  \ N × M / SYSCLK`\n\n`N = delay × SYSCLK / M = 0.020 sec × 16 MHz / M = 320,000\
  \ / M` 如果我们选择分频器分频 64，\n\n`N = 320,000 / 64 = 5,000`\n\n```c\nRCC->APB1ENR |= 1;\
  \ /* enable TIM2 clock */ TIM2->PSC = 64 - 1; /* divided by 64 */ TIM2->ARR = 5000\
  \ - 1; /* divided by 5000 */ TIM2->CNT = 0;\nTIM2->CR1 = 1; /* enable timer2 */\n\
  ```\n\n程序 5-4 使用 `TIM2` 以 1 Hz 的频率翻转 LED。16MHz 的 `SYSCLK` 被 `PSC` 分频器分频 1600。`TIM2_ARR`\
  \ 值设置为 `(10,000 – 1)`，使得 `16 MHz / 1600 / 10,000 = 1 Hz`。\n\n32 位的 `TIM2` 配置为加计数器。每当计数器溢出时，`TIM2_SR`\
  \ 寄存器中的 `UIF` 标志会被设置。程序轮询 `UIF` 标志。当标志设置时，程序清除它并翻转 LED。\n\n**程序 5-4：使用 TIM2 以 1\
  \ Hz 翻转 LED**\n\n```c\n/* p5_4.c Toggle Green LED (LD2) on STM32F446RE Nucleo64\
  \ using TIM2 *\n* 此程序配置 TIM2，使分频器分频 1600\n* 且计数器在 10000 处回绕。因此 16 MHz 系统时钟\n* 被分\
  \ 1600 后再分 10000 变为 1 Hz。 *\n* 每当计数器回绕时，它会设置 UIF 标志\n* (TIM2_SR 寄存器的第 0 位)。程序等待\n\
  * UIF 设置后翻转 LED (PA5)。\n*\n* 此程序在 Keil uVision v5.24a 和 DFP v2.11.0 下经过测试。 */\n\
  #include \"stm32f4xx.h\"\n\nint main(void) {\n    // 配置 PA5 为输出以驱动 LED\n    RCC->AHB1ENR\
  \ |= 1; /* enable GPIOA clock */ GPIOA->MODER &= ~0x00000C00; /* clear pin mode\
  \ */ GPIOA->MODER |= 0x00000400; /* set pin to output mode */\n\n    // 配置 TIM2\
  \ 在 1 Hz 处回绕\n    RCC->APB1ENR |= 1; /* enable TIM2 clock */ TIM2->PSC = 1600 -\
  \ 1; /* divided by 1600 */ TIM2->ARR = 10000 - 1; /* divided by 10000 */ TIM2->CNT\
  \ = 0; TIM2->CR1 = 1; /* enable TIM2 */\n    while (1) {\n        while(!(TIM2->SR\
  \ & 1)) {} /* wait until UIF set */\n        TIM2->SR &= ~1; /* clear UIF */\n \
  \       GPIOA->ODR ^= 0x000020; /* toggle LED */\n    }\n}\n```\n\n### 使用 32 位定时器产生长时间\n\
  \n一种延长延迟的方法是多次重复短延迟。这种方法适用于计数器为 8 位或 16 位的情况。在 STM32F4xx 中，如果所有分频器都设置为最大值，32 位定时器即使在系统时钟运行在\
  \ 180 MHz 时，回绕也需要超过 100 年。因此，处理这种大范围定时时需要其他方法。\n\n**示例 5-9**\n\n(a) 在 16 位模式下，时钟\
  \ = 16 MHz，不使用分频器计算最大延迟。(b) 在 32 位模式下，时钟 = 16 MHz，不使用分频器计算最大延迟。(c) 时钟 = 16 MHz，找到产生\
  \ 2 分钟延迟的 `TIMx_CNT` 值。使用最小分频。\n\n**解答：**\n\n(a) `1/16 MHz = 62.5ns`。16 位模式下最大的\
  \ `TIMx_ARR` 计数为 `65536`。不使用分频器，`65536 × 62.5ns = 4096ms`。使用分频器，最大除数为 `65536`；`65536\
  \ × 62.5ns = 4s`。\n\n(b) 32 位模式下的最大计数为 `2³²`。不使用分频器，`2³² × 62.5ns = 28s`。使用分频器，最大除数为\
  \ `65535`；`2³² × 65535 × 62.5ns = 1758994s (这是 20 天!)`。\n\n(c) 分频器设置为 1 时，我们得到：`2\
  \ minutes = 120 sec / 62.5ns = 1,920,000`。能够持有此数值的是 32 位模式。由于我们需要设置的 `ARR` 寄存器值小于\
  \ 16 位，这两个程序是相同的。\n\n**程序 5-5：在 16 位模式下使用 TIM3 翻转 LED**\n\n```c\n/* p5_5.c Toggle\
  \ Green LED (LD2) on STM32F446RE Nucleo64 using TIM3 *\n* 此程序配置 TIM3，使分频器分 1600\n\
  * 且计数器在 10000 处回绕。因此 16 MHz 系统时钟\n* 被分 1600 后再分 10000 变为 1 Hz。\n* 每当计数器回绕时，它会设置\
  \ UIF 标志\n* (TIM3_SR 寄存器的第 0 位)。程序等待\n* UIF 设置后翻转 LED (PA5)。\n*\n* 此程序在 Keil uVision\
  \ v5.24a 和 DFP v2.11.0 下经过测试。 */\n#include \"stm32f4xx.h\"\n\nint main(void) {\n\
  \    // 配置 PA5 为输出以驱动 LED\n    RCC->AHB1ENR |= 1; /* enable GPIOA clock */ GPIOA->MODER\
  \ &= ~0x00000C00; /* clear pin mode */ GPIOA->MODER |= 0x00000400; /* set pin to\
  \ output mode */\n\n    // 配置 TIM3 在 1 Hz 处回绕\n    RCC->APB1ENR |= 2; /* enable\
  \ TIM3 clock */ TIM3->PSC = 1600 - 1; /* divided by 1600 */ TIM3->ARR = 10000 -\
  \ 1; /* divided by 10000 */ TIM3->CNT = 0; /* clear timer counter */ TIM3->CR1 =\
  \ 1; /* enable TIM3 */\n    while (1) {\n        while(!(TIM3->SR & 1)) {} /* wait\
  \ until UIF set */\n        TIM3->SR &= ~1; /* clear UIF */\n        GPIOA->ODR\
  \ ^= 0x000020; /* toggle green LED */\n    }\n}\n```\n\n**复习题**\n\n1. 对或错。STM32F4xx\
  \ Arm 定时器同时支持加计数和减计数。\n2. 对或错。STM32F4xx 中的定时器最多支持 16 位。\n3. 对或错。定时器 `PSC` 分频器可以将时钟最大分频\
  \ 256。\n4. 在加计数模式下，当计数器达到 ____ 时，计数溢出。\n5. 哪个寄存器持有 UIF 溢出标志？\n\n## 第 5.4 节：比较寄存器与波形输出\n\
  \n到为止，我们一直通过监控溢出标志并在每次 UIF 设置时在软件中翻转输出引脚来产生波形。轮询溢出标志或任何状态是非常低效的。在下一章中，我们将看到如何使用中断在硬件状态改变时通知程序。但对于定时器，一旦配置完成，我们可以在没有软件干预的情况下产生波形。波形输出是通过比较功能完成的。\n\
  \n\n\n\n\n`Compare` 函数使用名为 `CCRx`（比较/捕获）的寄存器。寄存器的大小与 `CNT` 和 `ARR` 相同。对于 16 位定时器，宽度为\
  \ 16 位；对于 32 位定时器，宽度为 32 位。`CCRx` 寄存器的内容与计数器（`CNT`）的值进行连续比较。当 `CNT` 寄存器与 `CCRx`\
  \ 寄存器的值相等时，与该 `CCRx` 相关的引脚可以根据配置设置为（set）、清除（clear）或翻转（toggle）。见图 5-21。与之前的情况，`ARR`\
  \ 寄存器保持值。比较功能用于生成脉宽调制（PWM），我们将在第 11 章详细讨论。在本节中，我们将讨论限制在输出操作。\n\n![](img/image0287.jpeg)\n\
  **图 5-21：CNT、ARR 和比较寄存器 (CCR) 与波形输出**\n\n位定时器（`TIM2`）或 16 位定时器（`TIM3`）。输出引脚被称为 `TIMx_CHy`，其中\
  \ `x` 是 `TIMx`，`y` 可以是 1、 2、 3、 4、5、6 等，取决于该 STM 芯片有多少个定时器。`CHy` 可以是 `CH1`、`CH2`、`CH3`\
  \ 和 `CH4`，正如我们很快看到的，一个定时器的四个通道可以独立工作。如下所示。\n\n![](img/image0288.jpeg)Images/image0289.jpeg)Images/image0290.jpeg)Images/image0291.jpeg\n\
  **图 5-22：TIMx 捕获/比较寄存器 (TIMxCCCCR)**\n\n`OCxM` 位用于决定输出操作。输出引脚的选项有：\n\n- 000：冻结（Frozen）\n\
  - 001：当 `TIMx_CNT=TIMx_CCRy` 时将输出设置为有效高波平\n- 010：当 `TIMx_CNT=TIMx_CCRy` 时将输出设置为无效低波平\n\
  - 011：当 `TIMx_CNT=TIMx_CCRy` 时进行翻转（Toggle）\n- 100：强制低（Forced LOW）\n- 101：强制高（Forced\
  \ HIGH）\n- 110：PWM 模式 1（见第 11 章）\n- 111：PWM 模式 2（见第 11 章）\n\n注意每个定时器有两个 `TIMx_CCMR1`\
  \ 和 `TIM_CCMR2`。`TIMx_CCMR1` 负责 `CH1` 和 `CH2`，`TIMx_CCMR2` 留给每个定时器的 `CH3` 和 `CH4`。\n\
  \n![](img/image0292.jpeg)\n\n### OCxCE：输出比较清除允许；OCxM：输出比较模式\n\n当 `TIMx_CNT=TIMx_CCRy`\
  \ 时：\n\n- 010：当 `TIMx_CNT=TIMx_CCRy` 时将输出设置为无效低波平\n- 011：当 `TIMx_CNT=TIMx_CCRy`\
  \ 时进行翻转（Toggle）\n- 100：强制低（Forced LOW）\n- 101：强制高（Forced HIGH）\n- 110：PWM 模式 1（见第\
  \ 11 章）\n- 111：PWM 模式 2（见第 11 章）\n\n### OCxPE：输出比较预装允许；CCxS：捕获/比较选择\n\n此位域定义了通道的方向（输入/输出）以及使用的输入。\n\
  \n- 00：`CCx` 通道配置为输出\n\n**图 5-23：输出选项的 TIMx_CCMR1**\n\n![](img/image0293.jpeg)\n\
  \n### OCxCE：输出比较清除允许；OCxM：输出比较模式\n\n`TIMx_CCMRy` 寄存器中的 `OCxM` 位用于决定输出操作。输出引脚的选项有：\n\
  \n- 000：冻结（Frozen）\n- 001：当 `TIMx_CNT=TIMx_CCRy` 时将输出设置为有效高波平\n- 010：当 `TIMx_CNT=TIMx_CCRy`\
  \ 时将输出设置为无效低波平\n- 011：当 `TIMx_CNT=TIMx_CCRy` 时进行翻转（Toggle）\n- 100：强制低（Forced LOW）\n\
  - 101：强制高（Forced HIGH）\n- 110：PWM 模式 1（见第 11 章）\n- 111：PWM 模式 2（见第 11 章）\n\n###\
  \ OCxPE：输出比较预装允许；CCxS：捕获/比较选择\n\n此位域定义了通道的方向（输入/输出）以及使用的输入。\n\n- 00：`CCx` 通道配置为输出\n\
  \n**图 5-24：输出选项的 TIMx_CCMR2**\n\n### 通道启用\n\n`TIMx_CCER`（TIMx 捕获/比较启用寄存器）是一个 16\
  \ 位寄存器。它允许我们把 4 个通道中的任何一个启用为输入捕获或输出比较。注意每 4 位负责其中一个通道。还要注意这与 `TIMx` 启用不同。见下。\n\n\
  ![](img/image0294.jpeg)\n\n- 位 15：`CC4NP` 极性。参考 `CC1NP` 描述。\n- 位 14：保留。\n- 位 13：`CC4P`\
  \ 输出。\n- 位 12：`CC4E` 输出。\n- 位 11：`CC3NP` 极性。\n- 位 10：保留。\n- 位 9：`CC3P` 极性。\n- 位\
  \ 8：`CC3E` 输出。\n- 位 7：`CC2NP` 极性。\n- 位 6：保留。\n- 位 5：`CC2P` 输出。\n- 位 4：`CC2E` 输出。\n\
  - 位 3：`CC1NP` 极性。\n- 位 2：保留。\n- 位 1：`CC1P` 极性。\n- 位 0：`CC1E` 输出。\n\n**图 5-25：TIMx_CCER（TIMx\
  \ 捕获/比较寄存器）**\n\n### 波形输出的引脚选择\n\nSTMF4xx 有许多定时器，每个可以有四个比较通道。现在，表 5-5 显示了与端口 A 和\
  \ B 相关的输出引脚。正如我们在第 4 章看到的，为了将端口引脚用于切换功能，需要启用 `MODER` 中的复用功能。所有定时器的 `CH1-CH4` 使用见附录\
  \ B。\n\n- 位 2y:2y+1 `MODERy[1:0]`：端口 x 配置位（y = 0..15）。这些位用于配置 I/O 方向模式。\n- 00：输入（初始状态）\n\
  - 01：通用输出模式\n- 10：复用功能模式\n- 11：模拟模式\n\n**图 5-26：MODER 寄存器用于选择复用功能**\n\n![](img/image0227.jpeg)\n\
  \n- 位 31:0 `AFRLy`：端口 x 位 y 的复用功能选择（y = 0..7）。这些位由软件配置复用 I/O `AFRLy` 选择：\n- 0000：AF0,\
  \ 1000：AF8\n- 0001：AF1, 1001：AF9\n- 0010：AF2, 1010：AF10\n- 0011：AF3, 1011：AF11\n\
  - 0100：AF4, 1100：AF12\n- 0101：AF5, 1101：AF13\n- 0110：AF6, 1110：AF14\n- 0111：AF7,\
  \ 1111：AF15\n\n**图 5-27：GPIOx_AFRL 寄存器**\n\n**表 5-5：端口 A 和 B 的 STMF466RE 复用功能表（其他端口见附录\
  \ B）**\n\n\n\n\n下面的程序 5-6 展示了如何使用 `TIM2 Channel 1` 的比较功能生成波形输出。计数时钟使用 `16 MHz` 系统时钟。预分频器和\
  \ `AAR` 寄存器设置为与上一个程序一样，每秒在 0 和 `AAR` 值之间循环回绕计数一次。`CH1` 被配置为比较模式，因此当计数器 `CNT` 值匹配\
  \ `CCR1` 的值时，相应的输出引脚将执行 `CCMR` 寄存器规定的功能。在 `CCMR` 中，`CH1` 设置为在匹配时翻转（toggle）输出引脚。如果在\
  \ `CCR1` 寄存器中程序了 0 到 `AAR` 值之间的任何值，则在计数过程中，计数器值将每周期匹配一次。\n\n在程序 5-6 中，你会发现一旦配置了\
  \ `TIM2_CCR1`，波形输出的生成就不再需要软件参与。\n\n### 程序 5-6：使用比较模式生成波形输出\n\n```c\n /* p5_6.c 使用\
  \ TIM2 比较模式翻转绿色 LED\n\n*\n* 此程序配置 TIM2，预分频器除值为 1600，计数器在 10000 处回绕。\n* 因此，16 MHz\
  \ 系统时钟被除以 1600 再除以 10000，变为 1 Hz。\n * 通道 1 配置为比较模式，以便在定时器计数器匹配 CCR1 寄存器时\n* 翻转输出引脚。TIM2\
  \ CH1 的输出引脚为 PA5，PA5 的复用功能\n* 应设置为 AF1。\n\n*\n* 此程序在 Keil uVision v5.24a DFP v2.11.0\
  \ 下通过测试 */\n#include \"stm32f4xx.h\"\n\nint main(void) {\n\n// 将 PA5 配置为输出以驱动 LED\n\
  \  RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n  GPIOA->MODER &= ~0x00000C00; /* 清除引脚模式\
  \ */\n  GPIOA->MODER |= 0x00000800; /* 设置引脚为复用功能 */\n  GPIOA->AFR[0] &= 0x00F00000;\
  \ /* 清除引脚 AF 位 */\n  GPIOA->AFR[0] |= 0x00100000; /* 设置引脚为 AF1 用于 TIM2 CH1 */\n\n\
  // 配置 TIM2 在 1 Hz 处回绕\n// 当计数值为 0 时翻转 CH1 输出\n  RCC->APB1ENR |= 1; /* 开启 TIM2 时钟\
  \ */\n  TIM2->PSC = 1600 - 1; /* 除以 1600 */\n  TIM2->ARR = 10000 - 1; /* 除以 10000\
  \ */\n  TIM2->CCMR1 = 0x30; /* 设置匹配时翻转输出 */\n  TIM2->CCR1 = 0; /* 设置匹配值 */\n  TIM2->CCER\
  \ |= 1; /* 开启 CH1 比较模式 */\n  TIM2->CNT = 0; /* 清零计数器 */\n  TIM2->CR1 = 1; /* 开启\
  \ TIM2 */\n\n  while (1) { }\n\n}\n```\n\n### 复习题\n\n1. 判断对错。定时器也具有波形输出功能。\n2. 在\
  \ `STMF4xx Timer` 中，哪一个引脚用于 `TIM2_CCR1` 波形输出？\n3. 使用哪个寄存器来配置波形输出选项？\n4. 判断对错。`TIM2_CCR1`\
  \ 比较/捕捉寄存器是 32 位的。\n\n## 第 5.5 节：使用定时器/计数器进行输入捕捉\n\nSTM4xx 定器可用于输出比较和输入捕捉。我们在上一节检查了输出比较功能。本节检查输入捕捉功能。对于大多数微控制器，在输入捕捉模式下，定时器/计数器用于捕获\
  \ I/O 引脚的信号变化并记录每次变化的时间戳。在本节中，我们将描述如何捕获 I/O 引脚的信号变化。我们将使用许多与上一节中输出比较相同的寄存器。\n\n\
  要使用 STF4xx 的输入捕捉选项，使用了 `TIMx_CCMRx` 寄存器的 `CCxS`（捕获/比较选择）位。四个通道中的每个通道都有自己的输入引脚（`TIx`）和输入通道（`IC`）。输入被指定为\
  \ `TI1`、`TI2`、`TI3` 和 `TI4`。`TIx` 代表定时器输入。通道被指定为 `ICx`（输入通道）。检查 `TIMx_CCMR1` 的 `CCxS`\
  \ 位，我们可以看到以下输入捕捉选项：\n\n- 01：`CC1` 通道配置为输入，`IC1` 映射到 `TI1` 上。\n- 10：`CC2` 通道配置为输入，`IC2`\
  \ 映射到 `TI2` 上。\n\n以下显示 `TIMxCCMR2` 寄存器的选项：\n\n- 01：`CC3` 通道配置为输入，`IC3` 映射到 `TI3`\
  \ 上。\n- 10：`CC4` 通道配置为输入，`IC4` 映射到 `TI4` 上。\n\n注意在上一节中，我们使用了 `TIMx_CCMRx` 中 `CCxS`\
  \ 位的默认选项 (00) 来选择输出比较。现在，为了使用定时器进行输入捕捉，我们需要选择 I/O 引脚的信号变化。\n\n\n\n\n在程序 5-7 中，`TIM3`\
  \ 被配置用于输入捕获。引脚 `PA6` 被配置为 `TIM3 CH1` 的输入引脚。`TIM3` 的分频器设置为除以 `16,000` 以减慢时钟速度，以便在调试器中更容易看到捕获结果。通过分频器，计数器的时钟运行频率为\
  \ `1 kHz`。在 `TIM3_CCMR1` 中，定时器被配置为捕获模式且不进行捕获预分频。`CCMRx` 寄存器允许设置输入信号的噪声滤波，但由于使用了短跳线，噪声不应该是一个问题。`TIM3_CCER`\
  \ 用于启用捕获模式（`CC1E` 位），并设置捕获的极性和边缘（`CC1P`、`CC1NP` 位）为非反相上升沿。每当输入信号从低电平变为高电平时，就会发生一次捕获。\n\
  \n`TIM2` 的配置与程序 5-6 相同，用于翻转 `PA5` 的输出作为测试信号。应在输出引脚 `PA5` 和输入引脚 `PA6` 之间安装一条跳线。由于\
  \ `TIM2` 以 `1 Hz` 的频率翻转输出，因此每两秒会出现一个上升沿。\n\n在程序中，无限循环等待 `TIM3` 状态寄存器中的捕获标志设置。当捕获发生时，程序读取捕获的计数器值（`TIM3_CCR1`）并将其存储在全局变量中。你可以在调试器的中的无限循环中设置一个断点。右键点击全局变量\
  \ `timestamp` 并将其添加到监视窗口。每当命中断点时，监视窗口就会更新。命中断点后，点击运行按钮或键盘上的 `F5` 键即可继续程序执行。你将看到\
  \ `timestamp` 的值每次增加 `2000`。`TIM3` 计数器由 `1 kHz` 时钟驱动。每当输入信号出现上升沿，计数器每两秒增加 `2000`。\n\
  \n`ST-Link` 调试器不支持对变量进行实时监视。必须停止程序执行，监视窗口才会更新显示。当 CPU 执行停止时，`TIM2` 的输出比较和 `TIM3`\
  \ 的输入捕获不会停止。如果你等待太久才恢复程序执行，可能会错过一个或多个捕获的计数器值。在这种情况下，你将看到 `timestamp` 的值增加了 `2000`\
  \ 的倍数。`TIM3` 的状态寄存器的溢出位（`CC1OF`）将被设置，以提醒你丢失捕获值。\n\n可以使用外部周期信号对程序进行测试。要这样做，你需要移除\
  \ `PA5` 和 `PA6` 之间的跳线，并用信号发生器驱动捕获输入 `PA6`。`STMF4xx` 工作在 `3.3V` 逻辑电平。输入测试信号应在 `3.3V`\
  \ 和 `0V` 之间。驱动超出该电压范围可能会损坏引脚或设备。\n\n## 程序 5-7：使用定时器输入捕获上升沿事件\n\n```c\n/* p5_7.c\
  \ TIM3 输入捕获\n\n * 本程序配置 TIM2 CH1 翻转 PA5，如 p5_6 所示。* TIM3 CH1 设置为从 PA6 进行输入捕获。程序等待\n\
  \ * 捕获标志 (CC1IF) 设置，然后将捕获的值存储在\n * 全局变量中，供调试器监视。该标志通过\n * 读取 CCR1 清除。\n\n* 应使用跳线连接\
  \ PA5 到 PA6。\n\n*\n* 此程序在 Keil uVision v5.24a 和 DFP v2.11.0 下通过测试。 */\n#include\
  \ \"stm32f4xx.h\"\n\nint timestamp = 0; int hold = 1;\n\nint main(void) {\n\n  \
  \  // 配置 PA5 为 TIM2 CH1 的输出\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */ GPIOA->MODER\
  \ &= ~0x00000C00; /* 清除引脚模式 */\n    GPIOA->MODER |= 0x00000800; /* 将引脚设置为复用功能 */\
  \ GPIOA->AFR[0] &= ~0x00F00000; /* 清除引脚 AF 位 */\n    GPIOA->AFR[0] |= 0x00100000;\
  \ /* 将引脚设置为 AF1 以对应 TIM2 CH1 */\n\n    // 配置 TIM2 在 1 Hz 处溢出\n    // 当计数器值为 0 时翻转\
  \ CH1 输出\n    RCC->APB1ENR |= 1; /* 开启 TIM2 时钟 */\n    TIM2->PSC = 1600 - 1; /*\
  \ 除以 1600 */\n    TIM2->ARR = 10000 - 1; /* 除以 10000 */\n    TIM2->CCMR1 = 0x30;\
  \ /* 设置匹配时翻转输出 */\n    TIM2->CCR1 = 0; /* 设置匹配值 */\n    TIM2->CCER |= 1; /* 开启通道\
  \ 1 比较模式 */\n    TIM2->CNT = 0; /* 清除计数器 */\n    TIM2->CR1 = 1; /* 开启 TIM2 */\n\n\
  \    // 配置 PA6 为 TIM3 CH1 的输入\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */ GPIOA->MODER\
  \ &= ~0x00003000; /* 清除引脚模式 */\n    GPIOA->MODER |= 0x00002000; /* 将引脚设置为复用功能 */\
  \ GPIOA->AFR[0] &= ~0x0F000000; /* 清除引脚 AF 位 */ GPIOA->AFR[0] |= 0x02000000; /*\
  \ 将引脚设置为 AF2 以对应 TIM3 CH1 */\n\n    // 配置 TIM3 使用分频器进行输入捕获\n    RCC->APB1ENR |=\
  \ 2; /* 开启 TIM3 时钟 */\n    TIM3->PSC = 16000 - 1; /* 除以 16000 */\n    TIM3->CCMR1\
  \ = 0x41; /* 设置 CH1 在每个边缘捕获 */ TIM3->CCER = 1; /* 开启 CH1 上升捕获 */ TIM3->CR1 = 1;\
  \ /* 开启 TIM3 */\n\n    while (1) {\n        while (!(TIM3->SR & 2)) {} /* 等待输入边缘被捕获\
  \ */\n        timestamp = TIM3->CCR1; /* 读取捕获的计数器值 */\n    }\n}\n```\n\n### 输入捕获的应用\n\
  \n通过计算两个连续上升沿或两个连续下降沿之间的时间差，可以得到输入信号的周期，如程序 5-8 所示。通过周期可以计算频率。如果我们捕获轮轴编码器的脉冲，就可以推导出速度。\n\
  \n如果我们捕获轮轴编码器的脉冲，就可以计算相位。如果我们捕获轮轴编码器的脉冲，就可以计算占空比。如果我们捕获轮轴编码器的脉冲，就可以测量误差。\n\n\n\n\
  \n```c\nGPIOA->MODER |= 0x00002000; /* 设置引脚为复用功能 */ \nGPIOA->AFR[0] &= ~0x0F000000;\
  \ /* 清空引脚 AF 位 */ \nGPIOA->AFR[0] |= 0x02000000; /* 设置引脚为 TIM3 CH1 的 AF2 */\n\n\
  // 配置 TIM3 进行输入捕获并分频 ...\n\nRCC->APB1ENR |= 2; /* 开启 TIM3 时钟 */\n\nTIM3->PSC = 16000\
  \ - 1; /* 分以 16000 */\n\nTIM3->CCMR1 = 0x41; /* 设置 CH1 在每个边沿捕获 */ \nTIM3->CCER =\
  \ 0x0B; /* 开启 CH 1 双边沿捕获 */ \nTIM3->CR1 = 1; /* 开启 TIM3 */\n\nwhile (1) {\n    while\
  \ (!(TIM3->SR & 2)) {} /* 等待输入边沿被捕获 */ \n    current = TIM3->CCR1; /* 读取捕获的计数值 */\
  \ \n    period = current - last; /* 计算周期 */ \n    last = current;\n    frequency\
  \ = 1000.0f / period;\n    last = current; \n}\n```\n\n### 复习题\n\n1. 正确或错误。要测量信号的频率，需要下降沿和上升沿之间的时间间隔。\n\
  \n2. 正确或错误。如果测量两个连续下降沿之间的时间间隔，就可以计算出周期性信号的频率。\n\n3. 正确或错误。STMF4xx 支持上升沿和下降沿检测。\n\
  \n## 第 5.6 节：脉冲计数器编程\n\n定时器的另一个应用是统计外部输入脉冲的数量。换句话说，外部输入信号变成了计数器的时钟。\n\n在内部，定时器计数器始终在信号的上升沿计数，但外部输入信号在输入计数器之前可以进行反相，使得计数器可以在信号的下降沿进行计数。提供了一个外部信号的分频器，可以将外部信号分频为\
  \ 1、2、4 或 8。定时器计数器分频器对外部信号没有影响。所有外部脉冲计数的配置位都在从模式控制寄存器 (`TIMx_SMCR`) 中。并不是所有的定时器都支持外部输入时钟。你需要咨询参考手册来确定哪些定时器支持。\n\
  \n当值在向上计数匹配 `AAR` 时溢出，并在向下计数到 0 时设置为 `AAR` 的值。计数溢出时设置 `UIF`。当值匹配 `CCRx` 寄存器时设置 `CCxIF`。\n\
  \n外部脉冲计数模式可以与旋转编码器配合使用，用于计算发动机或轮子的每分钟转（RPM）。结合轮周，可以使用 RPM 计算车辆的速度。\n\n下面的程序 5-9\
  \ 使用 `PB8` 作为 TIM2 的外部输入时钟。计数器的最低位（LSB）用于开启或关闭 LED。当计数器在计数时，计数器的 LSB 每时钟翻转一次。你可以使用外部脉冲发生器驱动时钟输入，或者在\
  \ `PC13` 和 `PB8` 之间使用跳线，并使用用户按键开关为计数器产生脉冲。\n\n**图 5-32：脉冲计数**\n\n程序 5-9：使用定时器作为事件计数器\n\
  \n```c\n/* p5_9.c TIM2 外部事件计数\n * 此程序配置 TIM2 使用外部输入 PB8 作为\n * 计数时钟源。输入信号的每个上升沿\n\
  \ * 使 TIM2 计数器加 1。\n* 使用外部信号驱动 PB8 进行测试，或在 PC13 和 PB8\n * 之间使用跳线。PC13 连接到用户开关。\n\
  *\n* 此程序在 Keil uVision v5.24a 和 DFP v2.11.0 下通过测试 */ \n#include \"stm32f4xx.h\"\n\
  \nint main(void) {\n    // 配置 PA5 输出用于 LED\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟\
  \ */\n    GPIOA->MODER &= ~0x00000C00; /* 清空引脚模式 */\n    GPIOA->MODER |= 0x00000400;\
  \ /* 设置引脚为输出模式 */\n\n    // 配置 PB8 为 TIM2 ETR 的输入\n    RCC->AHB1ENR |= 2; /* 开启\
  \ GPIOB 时钟 */\n    GPIOB->MODER &= ~0x00030000; /* 清空引脚模式 */\n    GPIOB->MODER |=\
  \ 0x00020000; /* 设置引脚为复用功能 */\n    GPIOB->AFR[1] &= ~0x0000000F; /* 清空引脚 AF 位 */\n\
  \    GPIOB->AFR[1] |= 0x00000001; /* 设置引脚为 TIM2 ETR 的 AF1 */\n\n    // 配置 TIM2 使用外部输入作为计数时钟源\n\
  \    RCC->APB1ENR |= 1; /* 开启 TIM2 时钟 */\n    TIM2->SMCR = 0x4377; /* 使用 ETR 输入作为时钟，不分频\
  \ */\n    TIM2->CNT = 0; /* 清零计数器 */\n    TIM2->CR1 = 1; /* 开启 TIM2 */\n\n    while\
  \ (1) {\n        // 使用第 0 位控制 LED 的开启/关闭\n        if (TIM2->CNT & 1)\n         \
  \   GPIOA->ODR |= 0x20; /* 开启 LED */ \n        else\n            GPIOA->ODR &= ~0x20;\
  \ /* 关闭 LED */ \n    }\n}\n```\n\n\n\n\n# 中断服务程序 (ISR)\n\n对于每一个中断，都必须有一个关联的程序。当中断发生时，就会执行该程序以为中断提供特定的服务。该程序通常被称为\
  \ `interrupt service routine`（`ISR`）或 `interrupt handler`（中断处理器）。当中断发生时，CPU 会运行中断服务程序。现在问题是，`ISR`\
  \ 是如何被执行的？\n\n如图 6-2 所示，在 Arm CPU 中有与硬件中断相关的引脚。它们是进入 CPU 的输入信号。当信号被触发时，CPU 将 `PC`\
  \ 寄存器推入栈中，并将中断服务程序的地址加载到 `PC` 寄存器中。这导致了 `ISR` 的执行。\n\n![](img/image00299.jpeg) **图\
  \ 6-2：Arm Cortex-M 中的 NVIC**\n\n## 中断向量表\n\n由于每个中断都关联有一个程序（`ISR`），且该程序位于内存（RAM 或\
  \ ROM）中，因此必须有一个查找表来存储这些 `ISRs` 的地址。这个查找表被称为 `interrupt vector table`（中断向量表）。在 Arm\
  \ Cortex-M4 中，默认将内存空间的低 1024 字节（`256 × 4 = 1024`）留给中断向量表，且不能用于任何其他功能。表 6-1 提供了 Arm\
  \ Cortex-M4 产品定义的中断列表及其指定功能。在 47 个中断中，某些用于软件中断，另一些用于硬件 IRQ 中断。\n\n## Arm Cortex-M\
  \ 中的 NVIC (嵌套向量中断控制器)\n\nCortex-M 具有一个名为 `NVIC`（Nested Vector Interrupt Controller）的片内中断控制器。见图\
  \ 6-2。这使得 Arm Cortex-M 家族成员（`M0`、`M0+`、`M1`、`M3`、`M4` 和 `M7`）之间实现了某种程度的标准。经典的 Arm\
  \ 以及 Cortex-A 和 Cortex-R 系列没有这种 `NVIC` 中断控制器，因此 Arm 厂商的中断处理实现各不相同。本章重点关注 Arm Cortex-M\
  \ 系列的中断。必须注意的是，在中断处理方面，Arm Cortex-M 系列与经典 Arm 版本之间存在显著差异。经典 Arm 以及 Arm Cortex A\
  \ 和 R 系列的中断研究留给读者自行完成，因为它们用于使用复杂操作系统和实时系统的性能系统。\n\n## Arm Cortex-M 中的中断和异常分配\n\n\
  Arm Cortex-M4 的 `NVIC` 总共可以容纳 255 个中断和异常。中断号也被称为 `INT` 类型（或 `INT#`），其类型范围从 1 到 255，或\
  \ `0x01` 到 `0xFF`。即 `INT1` 到 `INT255`。Arm Cortex-M4 中的 `NVIC` 分配前 15 个中断供内部使用。内存位置\
  \ `0-3` 用于存储设备从复位退出时要加载到栈指针中的值。见表 6-1。尽管 Arm Cortex-M4 内核分配了 255 个中断号，但并不是所有中断都被\
  \ STMF4 设备使用。我们将在表 6-7 中看到使用的中断。\n\n| INT # | 中断内存位置 | 栈指针初始值 |\n| :--- | :--- |\
  \ :--- |\n| **0** | | 0x00000000 |\n| **1** | Reset (复位) | 0x00000004 |\n| **2**\
  \ | NMI (不可屏蔽中断) | 0x00000008 |\n| **3** | Hard Fault (硬故障) | 0x0000000C |\n| **4**\
  \ | Reserved (预留) | 0x00000010 |\n| **5** | Reserved (预留) | 0x00000014 |\n| **6**\
  \ | Reserved (预留) | 0x00000018 |\n| **7** | Reserved (预留) | 0x0000001C |\n| **8**\
  \ | Reserved (预留) | 0x00000020 |\n| **9** | Reserved (预留) | 0x00000024 |\n| **10**\
  \ | Reserved (预留) | 0x00000028 |\n| **11** | SVCall | 0x0000002C |\n| **12** | Reserved\
  \ (预留) | 0x00000030 |\n| **13** | Reserved (预留) | 0x00000034 |\n| **14** | PendSV\
  \ | 0x00000038 |\n| **15** | SysTick | 0x0000003C |\n| **16** | 外设的 IRQ0 | 0x00000040\
  \ |\n| **17** | 外设的 IRQ1 | 0x00000044 |\n| **…** | ... | ... |\n| **255** | 外设的\
  \ IRQ239 | 0x000003FC |\n\n**表 6-1：Arm Cortex-M4 中断向量表**\n\n### 预定义中断 (INT0 到 INT15)\n\
  \n以下是 Arm Cortex-M 中的前 15 个中断：\n\n### Reset (复位)\n\n![](img/image00300.jpeg) **图\
  \ 6-3：从复位到启动程序**\n\nArm 设备具有一个复位引脚。它通常连接到一个电路上，在通电时保持该引脚低电平一段时间。这就是上电复位或电源开启时复位\
  \ (POR)。在 Arm 训练板上，通常有一个按钮开关来降低信号。在通电后，复位信号通常为高电平；当在通电期间激活复位或按下复位按钮时，信号会变为低电平，CPU\
  \ 进入一个已知状态，所有寄存器都加载了预定义的值。当设备从复位中退出时，Arm Cortex-M 从 `0x00000004` 加载程序。注意表 6-1，`0x00000000-0x00000003`\
  \ 被预留给栈使用。\n\n### 不可屏蔽中断 (Non-maskable interrupt)\n\n如图 6-2 所示，有与硬件中断相关的引脚。它们是进入\
  \ CPU 的输入信号。NMI（不可屏蔽中断）也是 CPU 的一个输入信号，它不能被屏蔽，正由于这个原因，它被称为 `nonmaskable interrupt`。每当\
  \ NMI 被激活时，CPU 都会跳转到内存位置 `0x0000008` 获取与 NMI 关联的 `ISR` 地址。\n\n### 异常 (Exception)\n\
  \n有一组中断属于 `fault`（故障）或异常 `interrupts` 类别。内部，当处理器无法处理某些条件（异常）时，就会调用它们。\n\n### 硬故障\
  \ (Hard Fault)\n\n其中一种情况是尝试执行此 CPU 未实现的指令。由于结果是未定义的，且 CPU 没有任何处理方法，它会自动调用 HardFault。Arm\
  \ Cortex-M 处理器不区分这些故障的来源。\n\n### SVCall\n\n中断可以在执行 `SVC`（内核调用）指令的结果被调用。由于它是从软件调用的，而不是来自异常或任何外设\
  \ IRQ 中断，因此被称为 `software interrupt`（软件中断）。每当执行 `SVC` 指令时，CPU 都会跳转到内存位置 `0x0000002C`\
  \ 获取与 `SVC` 关联的 `ISR` 地址。`SVC` 被操作系统广泛用于调用只有特权访问模式才能提供的内核函数和服务。\n\n### PendSV\n\n\
  `PendSV`（挂起服务调用）可以用于与 `SVC` 相同的功能来获取操作系统服务。然而，`SVC` 是一条指令，像所有 Arm 指令一样立即执行。`PendSV`\
  \ 是一个中断，它会等待 `NVIC` 在处理完其他紧急的高优先级中断后有时间处理它。\n\n### SysTick\n\n在多任务操作系统中，我们需要一个实时中断时钟来通知\
  \ CPU 需要处理其他任务。时钟滴答按间隔发生，主要供操作系统使用。\n\n\n\n\n\nArm Cortex 中的 `SysTick` 正是为此目的设计的。\n\
  \n### IRQ 外设中断\n\n由于外设设备发生事件（例如定时器超时或模拟数字转换器 (`ADC`) 转换完成），可以触发 `ISR`（中断服务程序）。Arm\
  \ Cortex-M 中，数量最多的中断属于这一类。从表 6-1 可以看出，Arm Cortex-M 的 `NVIC` 预留了前 15 个中断（`INT1` 到\
  \ `INT15`）供内部使用，芯片设计者无法使用。`Reset`、`NMI`、`HardFault` 等都是这组异常的一部分。其余的中断用于外设设备。`INT16`\
  \ 到 `INT47`（`IRQ0` 到 `IRQ31`）由芯片制造商分配给各种外设设备，如定时器、`ADC`、串口（Serial COM）、外部硬件中断等。将\
  \ `INT16` 到 `INT47` 分配给外设设备并没有标准。不同的制造商为不同的外设设备分配不同的中断。并不是所有的中断都被分配了。你需要查阅你的 Arm\
  \ Cortex-M 芯片的数据手册。每个外设模块都有组特殊功能寄存器，必须使用它们来配置外设模块的功能。要使特定的外设中断生效，必须启用该外设的中断。该设备的特殊功能寄存器提供了启用中断的方法。\n\
  \n#### 任务切换中的快速上下文保存\n\n大多数中断是异步的，这意味着它们可能发生在程序执行的任何时候。当响应中断并启动中断服务程序时，程序需要一些 CPU\
  \ 资源（主要是 CPU 寄存器）来执行代码。为了不破坏中断发生前运行程序的寄存器内容，需要保护这些 CPU 寄存器。这种在切换到中断处理程序之前保存 CPU\
  \ 内容被称为被称为切换（或上下文保存）。使用栈作为保存 CPU 内容的地方既繁琐又耗时。保存所有寄存器需要时间。在执行中断服务程序时，每个任务通常需要一些关键寄存器，如\
  \ `PC` (`R15`)、`LR` (`R14`) 和 `CPSR`（标志寄存器），此外还需要一些工作寄存器。正因如此，Arm Cortex-M 在中断被响应时，会自动在栈上保存\
  \ `CPSR`、`PC`、`LR`、`R12`、`R3`、`R2`、`R1` 和 `R0` 的寄存器。见图 6-4 保存寄存器后的栈情况。如果中断服务程序需要比这些保存的更多的寄存器，程序必须在在使用其他寄存器之前保存内容。自动保存的寄存器的选择遵循\
  \ Arm 架构过程调用标准 (`AAPCS`)，因此中断处理程序可以写成普通的 C 函数，而无需任何特殊规定。\n\n![](img/image00301.jpeg)\
  \ **图 6-4：中断时的 Arm Cortex-M 栈帧**\n\n#### 在 Arm Cortex-M 中处理中断\n\n当 Arm Cortex-M\
  \ 处理任何中断（无论是故障异常还是外设 IRQ）时，会通过以下步骤：\n\n1. 将当前处理器状态寄存器 (`CPSR`) 推入栈中，由于 `CPSR` 是一个\
  \ 4 字节寄存器，`SP` 减去 4。\n2. 将当前的 `PC` (`R15`) 推入栈中，`SP` 减去 4。\n3. 将当前的 `LR` (`R14`)\
  \ 推入栈中，`SP` 减去 4。\n4. 将当前的 `R12` 推入栈中，`SP` 减去 4。\n5. 将当前的 `R3` 推入栈中，`SP` 减去 4。\n\
  6. 将当前的 `R2` 推入栈中，`SP` 减去 4。\n7. 将当前的 `R1` 推入栈中，`SP` 减去 4。\n8. 将当前的 `R0` 推入栈中，`SP`\
  \ 减去 4。\n9. CPU 进入 `Handler Mode`（处理模式，详情稍后描述）。`LR` 加载一个位 31-5 全为 1 的数字。\n10. 将\
  \ `INT` 数字（类型）乘以 4，得到向量表中位置的偏移量，用于获取中断服务程序（中断处理程序）的程序计数器。\n11. 从此新 `PC` 指向的内存位置，CPU\
  \ 开始提取并执行属于 `ISR` 程序的指令。\n12. 当中断服务程序执行其中一个返回指令时，CPU 根据 `LR` 的值识别出其处于 `Handler Mode`（当进入\
  \ `ISR` 时，`LR` 加载了一个位 31-5 全为 1 的数字）。然后它从栈中恢复进入 `ISR` 时保存的寄存器（包括程序计数器），并让 CPU 从中断发生的地方继续运行。见图\
  \ 6-5。\n\n![](img/image00302.jpeg) **图 6-5：主程序被中断**\n\n中断与子程序调的区别\n\n如果中断的执行保存了后续指令的程序计数器并间接跳转到与中断相关的子程序，那么这与\
  \ `BL` 指令有什么区别？后者也会保存程序计数器并跳转到目标子程序（过程）。这些区别可以总结如下：\n\n1. `BL` 指令可以接受参数并跳转到 Arm\
  \ CPU 4GB 地址范围内的任何位置。\n2. `INT` 数字（类型）乘以 4，得到向量表中位置的偏移量，用于获取中断服务程序（中断处理程序）的程序计数器。\n\
  3. 并不是所有的中断都被分配了。你需要查阅你的 Arm Cortex-M 芯片的数据手册。\n4. `BL` 指令可以接受参数并跳转到目标子程序（过程）。\n\
  5. 在执行中断服务程序时，当执行其中一个返回指令时，CPU 根据 `LR` 的值识别出其处于 `Handler Mode`（当进入 `ISR` 时，`LR`\
  \ 加载了一个位 31-5 全为 1 的数字）。然后它从栈中恢复进入 `ISR` 时保存的寄存器（包括程序计数器），并让 CPU 从中断发生的地方继续运行。\n\
  6. 自动保存的寄存器的选择遵循 Arm 架构过程调用标准 (`AAPCS`)，因此中断处理程序可以写成普通的 C 函数，而无需任何特殊规定。\n7. 并不是所有的中断都被分配了。你需要查阅你的\
