  \  for (i = 0; i < 3195; i++) ; \n} \n\n### CPU 时钟频率和时间延迟\n\n许多微控制器至少有三个可以驱动 CPU\
  \ 的时源。\n1) 片内振荡器电路。这是 CPU 最不精确的时钟源。但它不需要额外的外部设备，并且无论系统电路设计如何始终可用。\n2) 外部连接晶体（XTAL）振荡器。它提供了最精确的时钟，但在高频率下（例如超过\
  \ 100MHz），晶振非常昂贵。此外，其频率是固定的。\n3) 锁相环 (PLL)。在精度、灵活性和成本之间的折中。\n\n\n\n### 1: 开漏输出\n\
