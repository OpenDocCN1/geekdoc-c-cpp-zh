  \ 寄存器\n\n\n\n\n\n程序 7-4 使用片内 DAC 生成锯齿波。循环计数器 `i` 每次迭代都会递增，并写入 `DAC_DHR` 寄存器以产生斜坡。若要查看生成的波形，请将输出连接到示波器。图\
  \ 7-31 显示了输出。检查 `STM32F446RE` 数据手册，可以看到模拟输出引脚 `PA4` 和 `PA5` 分别对应 `DAC1_output` 和\
  \ `DAC2_output`。请使用数据表检查您的 STM32F 设备的模拟输出引脚，它可能与 `STM32F446RE` 芯片不同。\n\n#### 程序\
  \ 7-4：生成锯齿波\n\n```c /* p7_4.c: 使用 DAC 生成锯齿波\n\n* DAC 初始化时没有缓冲区或触发器，因此每次\n* 写入 DAC\
  \ 数据寄存器的操作都会改变模拟输出。\n* 数据在循环中增加并写入 DAC。\n* DAC 的输出在 PA4 引脚上。\n*\n* 此程序使用 Keil uVision\
  \ v5.24a 和 DFP v2.11.0 进行测试。\n*/\n\n#include \"stm32f4xx.h\"\n\nint main(void) {\n\
  \    int data;\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n    GPIOA->MODER |= 0x0000300;\
  \ /* PA4 模拟模式 */\n    /* 设置 DAC */\n    RCC->APB1ENR |= 1 << 29; /* 开启 DAC 时钟 */\n\
  \    DAC->CR |= 1; /* 开启 DAC */ \n    while(1) {\n        DAC->DHR12R1 = data++\
  \ & 0x0FFF;\n    }\n}\n```\n\n![](img/image00353.jpeg) 图 7-31：锯齿波\n\n#### 生成正弦波\n\
  \n要生成正弦波，我们首先需要一个表示 0 到 360 度之间角度的正弦值的表。对于 0 到 360 度角，正弦函数的值从 -1.0 到 +1.0 不等。因此，表值是代表角度正弦值幅的整数。这种方法确保了处理器仅将整数输出到\
  \ DAC。表 7-11 显示了以 30 度为间隔的每个角度对应的正弦值、电压幅以及代表电压幅的整数值。\n\n角度Ɵ V[OUT] = 1.65V + (1.65V\
  \ × sinƟ) (幅度 × 310)\n\n| 角度 (度) | SinƟ | V[OUT] (电压幅) | 发送到 DAC 的值 (十进制) |\n| :---\
  \ | :--- | :--- | :--- |\n| 0 | 0 | 1.65 | 2048 |\n| 30 | 0.5 | 2.475 | 3071 |\n\
  | 60 | 0.866 | 3.0789 | 3821 |\n| 90 | 1.0 | 3.3 | 4095 |\n| 120 | 0.866 | 3.0789\
  \ | 3821 |\n| 150 | 0.5 | 2.475 | 3071 |\n| 180 | 0 | 1.65 | 2048 |\n| 210 | -0.5\
  \ | 0.825 | 1024 |\n| 240 | -0.866 | 0.2211 | 274 |\n| 270 | -1.0 | 0 | 0 |\n| 300\
  \ | -0.866 | 0.2211 | 274 |\n| 330 | -0.5 | 0.825 | 1024 |\n| 360 | 0 | 1.65 | 2048\
  \ |\n\n**表 7-11：正弦波的角度与电压幅关系**\n\n为了生成表 7-11，我们假设 DAC 输出的满量程电压为 3.3V。当 DAC 的所有数据输入位均为高电平时，即可实现满量程输出。因此，为了实现\
  \ 3.3V 的满量程输出，我们使用以下方程：`V[OUT] = 1.65V + (1.65V × sinƟ)`\n\n要找到各种角度发送到 DAC 的值，我们只需将\
  \ `V[OUT]` 电压乘以 1241，因为数字输入范围是 0-4095（12 位），且满量程 `V[OUT]` 为 3.3 特。因此，每伏有 `4095/3.3=1241`\
  \ 阶。为了进一步说明，请查看示例 7-5。\n\n**示例 7-5** 验证以下角度在表 7-11 中的值：(a) 30 (b) 60。\n\n**解答：**\n\
  (a) `V[OUT] = 1.65 V + (1.65 V ×sinƟ) = 1.65 V + 1.65 × sin 30 = 1.65 V + 1.65 ×\
  \ 0.5 = 2.475 V`\nDAC 输入值为 `2.475 V × 1241 = 3071 (十进制)`\n(b) `V[OUT] = 1.65 V +\
  \ (1.65 V ×sinƟ) = 1.65 V + 1.65 × sin 60 = 1.65 V + 1.65 × 0.866 = 3.079 V`\nDAC\
  \ 输入值为 `3.079 V × 1241 = 3821 (十进制)`\n\n以下程序将表 7-11 的值发送到 DAC。\n\n#### 程序 7-5：生成正弦波\n\
  \n```c /* p7_5.c: 使用 DAC 生成正弦波\n\n* 此程序使用预计算查找表通过 DAC 生成\n* 正弦输出。DAC 初始化时没有缓冲区或触发器，因此每次\n\
  * 写入 DAC 数据寄存器的操作都会改变模拟输出。\n* 查找表索引在循环中增加，并将数据写入 DAC。\n* DAC 的输出在 PA4 引脚上。\n* 此程序已使用\
  \ Keil uVision v5.24a 和 DFP v2.11.0 进行测试。\n*/\n#include \"stm32f4xx.h\"\nvoid delayUs(int\
  \ n);\n\nint main(void) {\n    int i;\n    const int sineWave[] = {2048,3071,3821,4095,3821,3071,2048,1024,274,0,274,1024};\n\
  \    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n    GPIOA->MODER |= 0x0000300; /* PA4\
  \ 模拟模式 */\n    /* 设置 DAC */\n    RCC->APB1ENR |= 1 << 29; /* 开启 DAC 时钟 */\n    DAC->CR\
  \ |= 1; /* 开启 DAC */\n    while(1) {\n        for (i = 0; i < sizeof(sineWave)/sizeof(int);\
  \ i++) {\n            DAC->DHR12R1 = sineWave[i]; /* 将 sineWave 写入 DAC */\n    \
  \        delayUs(10);\n        }\n    }\n}\n/* 16 MHz SYSCLK */\nvoid delayUs(int\
  \ n) {\n    int i;\n    for (; n > 0; n--)\n        for (i = 0; i < 3; i++) ;\n\
  }\n```\n\n![](img/image354.jpeg) 图 7-32：正弦波的角度与电压幅 (3V)\n\n程序 7-6 在初始化时使用数学函数生成查找表。\n\
  \n#### 程序 7-6：使用数学函数生成正弦波\n\n```c /* p7_6.c: 使用 DAC 生成波形\n\n* 此程序在初始化时计算查找表，通过 DAC\
  \ 生成\n* 正弦输出。DAC 初始化时没有缓冲区或触发器，因此每次\n* 写入 DAC 数据寄存器都会改变模拟输出。\n* 查找表索引在循环中增加并写入 DAC。\n\
  * DAC 的输出在 PA4 引脚上。\n* 此程序已使用 Keil uVision v5.24a 和 DFP v2.11.0 进行测试。\n*/\n#include\
