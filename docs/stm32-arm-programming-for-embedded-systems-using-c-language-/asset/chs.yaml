  \ CPU 内容被称为上下文切换（或上下文保存）。使用栈作为保存 CPU 内容的地方既繁琐又耗时。保存所有寄存器需要时间。\n13. 在执行中断服务程序时，每个任务通常需要一些关键寄存器，如\
