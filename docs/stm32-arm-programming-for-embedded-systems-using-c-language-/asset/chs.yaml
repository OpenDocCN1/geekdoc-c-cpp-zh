  \ D0-D7。\n* PB5 用于 LCD R/S\n* PB6 用于 LCD/W\n* PB7 用于 EN\n* 此程序已在 Keil uVision v5.24\
  \ 配合 DFP v2.11.0 通过过测试 */\n#include \"stm32f4xx.h\"\n\nvoid delayMs(int n);\nvoid\
  \ LCD_command(unsigned char command);\nvoid LCD_command_noPoll(unsigned char command);\n\
  void LCD_data(char data);\nvoid LCD_init(void);\nvoid LCD_ready(void);\nvoid PORTS_init(void);\n\
  \n#define RS 0x20 /* 选择的 PB5 掩码 */\n#define RW 0x40 /* 读写的 PB6 掩码 */\n#define EN\
  \ 0x80 /* 使能的 PB7 掩码 */\n\nint main(void) {\n    /* 初始化 LCD 控制器 */\n    LCD_init();\n\
  \    while(1) {\n        /* 在 LCD 上写入 \"Hello\" */\n        LCD_data('H');\n   \
  \     LCD_data('e');\n        LCD_data('l');\n        LCD_data('o');\n        delayMs(500);\n\
  \        /* 清除 LCD 显示 */\n        LCD_command(1);\n        delayMs(500);\n    }\n\
  }\n\n/* 初始化引脚脚初始化 LCD 控制器 */\nvoid LCD_init(void) {\n    PORTS_init();\n    delayMs(30);\
  \ /* 初始化序列 */\n    LCD_command_noPoll(0x30); /* LCD 尚未响应轮询 */\n    delayMs(10);\n\
  \    LCD_command_noPoll(0x30);\n    delayMs(1);\n    LCD_command_noPoll(0x30); /*\
