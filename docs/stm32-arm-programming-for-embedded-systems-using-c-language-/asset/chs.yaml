  \ ADCs `A`、`B`。更新输出。\n\n唤醒部分唤醒。输入 Reg 和 DAC Reg 保持不变。DAC 输出反映 DAC Reg 的现有内容。\n\n\
  休眠部分进入睡眠。输入 Reg 和 DAC Reg 保持不变。DAC 输出置于高阻态。\n\n唤醒部分。加载两个输入 Reg。将输入 Reg 的新内容加载到两个\
  \ DAC Reg 中。输出更新。部分唤醒。\n\n### 表 8-6: LTC1661 DAC 控制功能\n参见示例 8-4 和 8-5。\n\n#### 示例\
  \ 8-4\n假设 `V[REF]= 3.3 V`，找到向 `LTC1661` 发送以下数据包的结果：\n\na) `0001 0001 0000 0000`\
  \ 二进制 (`0x1100`)\nb) `1010 1000 1111 1100` 二进制 (`0xA8FC`)\n\n**解：**\n\na) 在 `0001\
  \ 0001 0000 0000` 中，控制代码为 `0001`。结果是将 `data = 0001 0000 00`（十进制 64）加载通道 `A` 的输入缓冲区寄存器。注意此控制代码不会更新输出。输出将在发送控制代码\
  \ `1000` 后更新。因此 `V[OUTA] = V[REF] * D[IN] / 1024 = 3.3 * 64 / 1024 = 0.206V`。\n\n\
  b) 在 `1010 1000 1111 1100` 中，控制代码为 `1010`。结果是将 `data 1000 1111 11`（十进制 575）加载到通道\
  \ `B` 的输入缓冲区寄存器并更新输出。因此 `V[OUTB] = V[REF] * D[IN] / 1024 = 3.3 * 575 / 1024 = 1.853V`。\n\
  \n#### 示例 8-5\n假设 `V[REF]= 3.3 V`，找到应发送到 `LTC1661` 的数据包以：\n\na) 从通道 `A` 发出 `0.5V`\n\
  b) 从通道 `B` 发出 `1.0V`\nc) 同时从通道 `A` 和 `B` 发出 `0.5V` 和 `1.0V`\n\n**解：**\n\na) `V[OUTA]\
  \ = V[REF] × D[IN] / 1024`\n`0.5V = 3.3 × D[IN] / 1024`\n`D[IN] = 155`（二进制 `0010\
  \ 0110 11`）。我们发送 `1001 0010 0110 1100` 二进制 (`0x926C`)，因为控制代码 `9` 加载通道 `A` 的输入缓冲区寄存器并更新通道输出。\n\
  \nb) `V[OUTB] = V[REF] × D[IN] / 1024`\n`1.0V = 3.3 × D[IN] / 1024`\n`D[IN] = 310`（二进制\
  \ `0100 1101 10`）\n我们发送 `1010 0100 1101 1000` 二进制 (`0xA4D8`)，因为控制代码 `1010` 加载通道\
  \ `B` 的输入缓冲区寄存器并更新通道输出。\n\nc) 为了同时更改输出，我们需要先在不更新输出的情况下加载通道 `A` 的输入缓冲区寄存器，然后加载通道\
  \ `B` 的输入缓冲区寄存器并更新输出。\n\n首先，我们使用控制代码 `0001 0010 0110 1100` 二进制 (`0x126C`) 加载通道 `A`\
  \ 输入缓冲区寄存器。注意这与*部分 a* 中的代码相同，只是没有设置最高位。然后，我们加载通道 `B` 输入缓冲区寄存器，并使用控制代码 `1010 0100\
  \ 1101 1000` 二进制更新输出。\n\n![](img/image0371.jpeg) **图 8-17: LTC1661 连接到 STM32F4**\n\
  \n在下面的程序中演示了通过 `LTC1661` 生成锯齿波的方法。`LTC1661` 要求在整个 16 位传输期间片选保持低电平，因此使用软件控制片选并将 GPIO\
  \ 引脚 `PA4` 作为片选。从时序图中可以看出，时钟在空闲时为低电平，从低到高的跳变（前沿）锁存数据，因此时钟极性设为 `0`，且时钟相位设置为 `0`。`for`\
  \ 循环 `i` 从 `0` 计数到 `1023`并将值发送到 `LTC1661`。每次传输片选均有效，命令 `9` 写入寄存器 `A` 并发送高位，然后发送填充了两个\
  \ `0` 的低位 `(i << 2) & xFF`。程序在移除片选之前等待传输完成。\n\n#### 程序 8-2：通过 SPI 以 8 位模式在 LTC1661\
  \ 生成锯齿波\n```c\n/* p8_2.c: 使用 SPI1 在 LTC1661 上生成锯齿波\n* SPI1 配置为主模式，软件片选。\n* 时钟设置为\
  \ 1 MHz。极性/相位为 0, 0。\n* PA7 MOSI\n* PA5 SCK\n* PA4 SS\n* 该程序已在 Keil uVision v5.24a\
  \ DFP v2.11.0 上通过测试 */\n#include \"stm32f4xx.h\"\nvoid SPI1_init(void);\nvoid DAC_write(short\
  \ data);\n\nint main(void) {\n    short i;\n    SPI1_init();\n    while(1) {\n \
  \       for (i = 0; i < 1024; i++) {\n            DAC_write(i); /* 通过 SPI1 写入 */\n\
  \        }\n    }\n}\n\n/* 启用 SPI1 和相关的 GPIO 引脚 */\nvoid SPI1_init(void) {\n   \
  \ RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n    RCC->APB2ENR |= 0x1000; /* 开启 SPI1 时钟\
  \ */\n    /* PORTA 5, 7 用于 SPI1 MOSI 和 SCLK */\n    GPIOA->MODER &= ~0x0000CC00;\
  \ /* 清除引脚模式 */\n    GPIOA->MODER |= 0x00008800; /* 设置为复用模式 */\n    GPIOA->AFR[0]\
  \ &= ~0xF0F0000; /* 清除复用模式 */\n    GPIOA->AFR[0] |= 0x50500000; /* 设置为 SPI1 复用模式\
  \ */\n    /* PORTA4 作为 GPIO 输出片选 */\n    GPIOA->MODER &= ~0x0000300; /* 清除引脚模式 */\n\
  \    GPIOA->MODER |= 0x00000100; /* 设置为输出模式 */\n    SPI1->CR1 = 0x3C; /* 设置波特率，8\
  \ 位数据帧 */\n    SPI1->CR2 = 0;\n    SPI1->CR1 |= 0x40; /* 启用 SPI1 模块 */\n    SPI1->DR\
  \ = 0x90 | (data >> 6); /* 写入命令和高 4 位 */\n    while (!(SPI1->SR & 2)) {} /* 等待缓冲区空\
  \ */\n    SPI1->DR = (data << 2) & 0xFF;\n    while (SPI1->SR & 0x80) {} /* 等待传输完成\
  \ */\n    GPIOA->BSRR = 0x0000010; /* 片选有效 */\n}\n\n/* 此函数启用片选，向 SPI1 写入字节，等待完成并取消片选。\
  \ */\nvoid DAC_write(short data) {\n    data &= 0x03FF; /* 确保为 8 位 */\n    while\
  \ (!(SPI1->SR & 2)) {} /* 等待缓冲区空 */\n    GPIOA->BSRR = 0x0010000; /* 取消片选 */\n}\n\
  ```\n![](img/image0353.jpeg) **图 8-18: 生成的锯齿波**\n\n### 以 16 位模式向 LTC1661 发送控制/数据\n\
  在讨论中，我们提到 `SPI_CR1` 寄存器中的 `DSFF` 位可选择 8 位或 16 位数据帧。由于 `LTC1661` 需要 16 位传输，因此使用 16\
  \ 位数据帧是自然的。下面的程序使用 16 位数据帧执行与程序 8-2 的任务。你会发现通过 `SPI` 发送代码更简单、更高效。\n\n#### 程序 8-3：通过\
  \ SPI 以 16 位模式在 LTC1661 生成锯齿波\n```c\n/* p8_3.c: 使用 SPI1 在 LTC1661 上生成锯齿波\n* SPI1\
  \ 配置为主模式，软件片选。\n* 时钟设置为 1 MHz。极性/相位为 0, 0。\n* 该程序与 p8_2 相似，但数据帧大小\n 设置为 16 位。\n\
  * PA7 MOSI\n* PA5 SCK\n* PA4 SS\n* 该程序已在 Keil uVision v5.24a DFP v2.11.0 上通过测试 */\n\
  #include \"stm32f4xx.h\"\nvoid SPI1_init(void);\nvoid DAC_write(short data);\n\n\
  int main(void) {\n    short i;\n    SPI1_init();\n    while(1) {\n        for (i\
  \ = 0; i < 1024; i++) {\n            DAC_write(i); /* 通过 SPI1 写入 */ \n        }\n\
  \    }\n}\n\n/* 启用 SPI1 和相关的 GPIO 引脚 */\nvoid SPI1_init(void) {\n    RCC->AHB1ENR\
  \ |= 1; /* 开启 GPIOA 时钟 */\n    RCC->APB2ENR |= 0x1000; /* 开启 SPI1 时钟 */\n    /*\
  \ PORTA 5, 7 用于 SPI1 MOSI 和 SCLK */\n    GPIOA->MODER &= ~0x0000CC00; /* 清除引脚模式\
  \ */\n    GPIOA->MODER |= 0x00008800; /* 设置为复用模式 */\n    GPIOA->AFR[0] &= ~0xF0F0000;\
  \ /* 清除复用模式 */\n    GPIOA->AFR[0] |= 0x50500000; /* 设置为 SPI1 复用模式 */\n    /* PORTA4\
  \ 作为 GPIO 输出片选 */\n    GPIOA->MODER &= ~0x0000300; /* 清除引脚模式 */\n    GPIOA->MODER\
  \ |= 0x00000100; /* 设置为输出模式 */\n    SPI1->CR1 = 0xB1C; /* 设置波特率，16 位数据帧 */\n   \
  \ SPI1->CR2 = 0;\n    SPI1->CR1 |= 0x40; /* 启用 SPI1 模块 */\n    SPI1->DR = 0x90 |\
  \ (data >> 6); /* 写入命令和高 4 位 */\n    while (!(SPI1->SR & 2)) {} /* 等待缓冲区空 */\n \
  \   SPI1->DR = (data << 2) & 0xFF;\n    while (SPI1->SR & 0x80) {} /* 等待传输完成 */\n\
  \    GPIOA->BSRR = 0x0000010; /* 片选有效 */\n}\n```\n\n\n\n\n```c\nwhile (!(SPI1->SR\
  \ & 2)) {} /* wait until Transfer buffer Empty */ GPIOA->BSRR = 0x00100000; /* deassert\
  \ slave select */ SPI1->DR = 0x9000 | ((data << 2) & 0x0FFF); /* write command and\
  \ data */ while (SPI1->SR & 0x80) {} /* wait for transmission done */ GPIOA->BSRR\
  \ = 0x00000010; /* assert slave select */\n```\n\n现在你可能在想，既然 16 位数据帧格式更简单且更高效，我们为什么还要使用\
  \ 8 位格式呢？答案在于可移植性。因为 8 位 SPI 是所有制造商设备中都通用的，因此为 8 位格式编写的代码可以很容易移植到不同的设备。如果你想在不支持\
  \ 16 位格式的设备中重用 16 位程序，对程序的修改量将会大得多。\n\n**复习题`**\n\n1. 正或错。`LTC1661` 是一个 ADC。\n2.\
  \ 正或错。`LTC1661` 是一个 10 位 DAC。\n3. 正或错。`LTC1661` 有 4 个输出通道。\n\n### 复习题答案`\n\n***第\
  \ 8.1 节***\n\n1. 错误\n2.正确\n\n***第 8.2 节***\n\n1. 正确\n2. 错误\n3. 片选选择 (SS)\n4. `SPIx_CR1`\n\
  5. `SPIx_CR1`\n\n***第 8.3 节***\n\n1. 错误\n2.正确\n3. 错误，它只有两个模拟输出通道\n\n## 第 9 章：I2C\
  \ 协议与 RTC 接口`\n\n本章涵盖了 I2C 总线接口和编程。第 9.1 节研究 I2C 总线协议。第 9.2 节展示了 `STM32F4xx` Arm\
  \ 设备内部 I2C 模块的工作原理。第 9.3 节涵盖了 `DS1337` RTC 及其 I2C 接口和编程。\n\n## 第 9.1 节：I2C 总线协议`\n\
  \nIIC（集成电路）是一种集成在传感器、RTC 和 EEPROM 等许多设备中的总线接口连接。在许多技术文献中，IIC 也称为 `I2C`、`I²C` 或 `I\
  \ square C`。在本节中，我们将检查 I2C 总线的信号，并关注 I2C 术语和协议。\n\n### I2C 总线`\n\nI2C 总线最初由飞利浦（Philips）发起，但多年来已成为许多半导体公司采用的广泛使用的标准。I2C\
  \ 是将低速外围设备连接到主板、嵌入式系统或任何需要短距离可靠通信的地方的理想选择。正如我们在本章中看到的，I2C 提供了一种带有确认机制的面向连接的通信。I2C\
  \ 设备仅使用 2 个引脚进行数据传输，而不是传统并行总线使用的 8 个或更多引脚。这两个信号被称为 `SCL`（串行时钟），它用于同步两个芯片之间的数据传输，以及\
  \ `SDA`（串行数据）。引脚的减少大幅降低了封装尺寸和功耗，使其成为许多对空间要求严格的应用的理想选择。这两个引脚 `SDA` 和 `SCK` 使 I2C\
  \ 成为一个 2 线接口。在某些应用说明中，I2C 被称为两线串行接口（TWI）。\n\n### I2C 线电学特性`\n\nI2C 设备仅使用 2 个双向开漏极引脚进行数据通信。为了实现\
  \ I2C，每条总线都需要一个 4.7k 欧姆的上拉电阻（见图 9-1）。这实现了实现 I2C 协议所需的线线与（wired-AND）逻辑。这意味着如果一个或多个设备将线路拉到低电平（零电平），则线路状态为\
  \ 0。只有当没有设备将线路拉到低电平时，线路电平才为 1。\n\n![](img/image00372.jpeg) **图 9-1：I2C 总线特性**\n\n\
  ### I2C 节点`\n\n在 I2C 协议中，超过 100 个设备可以共享一条 I2C 总线。这些设备中的每一个都称为一个 `节点`（节点）。\n\n在 I2C\
  \ 术语中，每个 `节点` 既可以作为主机也可以作为从机。主机为系统产生时钟的设备，它还启动和终止传输。从机是接收时钟并被主机寻址的节点。在 I2C 中，主从都可以接收或传输数据。因此，每个\
  \ `节点` 有 4 种工作模式。它们是：主发送器、主接收器、从发送器和从接收器。请注意，每个 `节点` 在不同时间可以有多种工作模式，但在任何给定时刻只有一种工作模式。参见示例\
  \ 9-1。\n\n**示例 9-1**\n\n举例说明一个设备（`节点`）如何使用多一种工作模式。**解答：**\n\n如果你用 I2C 将微控制器连接到 EEPROM，微控制器将执行主发送操作以写入\
  \ EEPROM，并执行主接收操作以从 EEPROM 读取数据。\n\n在接下来的章节中，你将看到 `节点` 可以在不同时间执行主和从机的操作。\n\n###\
