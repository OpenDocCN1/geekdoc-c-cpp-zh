  }\n```\n\n\n在上述程序中，使用 `|=` 算符修改寄存器位以设置位，并使用 `&=` 清除位。这些读-修改-写（RMW）操作意味着将端口寄存器的值读入\
  \ CPU 寄存器，对选定的位设置或清除，然后将值写回端口寄存器。RMW 操作存在一些潜在问题。其中一个是更改选定的位（位）需要三个步骤。在多线程环境中，一个\
  \ RMW 操作可能会被另一个 RMW 操作中断。在第一次操作完成后，第二次写入将覆盖第一次操作所做的修改。\n\nSTM32 系列 GPIO 端口具有额外的寄存器，可以更容易地开启或关闭引脚（或多个引脚）。该寄存器允许通过单条写入指令设置或重置寄存器的某个位。参见\
  \ `GPIOx_BSRR`（GPIO 位设置/复位寄存器）。写入该寄存器仅影响写入值对应位为“1”的引脚。这使得在不影响其他引脚的情况下，开启或关闭单个或几个引脚变得更容易。`GPIOx_BSRR`\
  \ 寄存器的低 16 位（D15-D0）开启（设置）位，高 16 位（D31-D16）关闭（复位）位。例如，向 `GPIOA_BSRR` 写入值 `0x00000020`\
  \ 将开启该端口的 `PA5` 位而不修改任何其他引脚。这些寄存器使程序更具可读性、运行更快，而且写入这些寄存器是单条指令执行，不会被中断。参见图 2-17。\n\
