  \n\n\n\n\nHSE 相比于 HSI 的主要优势是我们可以为 `SYSCLK` 时钟和外设时钟产生非常精确的时钟频率。在 USB 等某些应用中，串口通信时钟需要比\
  \ HSI 提供的更精确。另一个优势是它的频率可以超过 HSI 的 16MHz。\n\n在 Nucleo-446RE 板上，`STLINK` 处理器使用外部 8\
  \ MHz 晶振器作为 HSE 时钟源。它产生 `MCO`（微控制器时钟输出，稍后将讨论），作为 HSE 上的外部活动时钟馈给目标 MCU。在这一设计中，两个处理器只需要一个晶振器。\n\
  \n## PLL 时钟与 SYSCLK\n\n锁相环（PLL）是一种可以根据单个输入频率产生宽范围频率的电路。STM32F4xx 设备具有一个用于生成 `SYSCLK`\
  \ 的 PLL 电路。该 PLL 电路接收来自 HSI 或 HSE 的输入信号。它有四个与 `SYSCLK` 相关的分频器/乘法器 `M`、`N`、`P` 和\
  \ `R`。`M`、`N`、`P` 和 `R` 的值在 `RCC_PLLCFGR` 寄存器中设置。`SYSCLK` 取 PLL 电路的两个输出 `PLLCLK`\
  \ 和 `PLLR` 之一。\n\n对于 `PLLCLK`，输出频率是输入频率除以 `M`，乘以 `N`，然后除以 `P`。`M` 的范围是 2 到 63。`N`\
  \ 的范围是 50 到 432。`P` 的范围是 2 到 8。它们共同可以产生多种 `SYSCLK` 频率选择。\n\n例如，在 Nucleo-446RE 板上，外部\
  \ 8 MHz 时钟可以被设置为旁路模式作为 HSE 使用。PLL 设置的一种组合是 `M = 4`、`N = 180` 且 `P = 2`。这产生了 `8 /\
  \ 4 × 180 / 2 = 180 MHz` 的输出 `PLLCLK`。还有其他组合在数学上可以产生相同的输出频率，但并非所有组合在 PLL 电路上可操作。`MCO`\
  \ 是验证 `PLLCLK` 频率的有效工具，我们稍后会讨论。\n\n`PLLR` 输出与 `PLLCLK` 类似，但它使用 `M`、`N` 和 `R` 来确定频率。\n\
  \n与 HSI 和 HSE 一样，PLL 输出在启用后需要时间才能稳定。软件必须等待 `PLLRDY` 位置位后再切换到使用 `PLLCLK`。\n\n尽管使用\
  \ PLL 后 `SYSCLK` 可能高达 180 MHz，但如果不在较高时钟频率下为闪存访问插入等待状态，片上闪存内存将无法跟上。等待状态通过配置 `FLASH_ACR`\
  \ 寄存器来插入。所需的等待状态数取决于 `SYSCLK` 速率和设备运行电压。该值可以在设备的参考手册中找到。如果高频 CPU 一直等待闪存访问，则不会提高设备性能。因此，在插入等待状态时应启用缓存和预取。这些也可以通过\
  \ `FLASH_ACR` 寄存器完成。\n\n## LSI 和 LSE 时钟\n\n在 STM32F4xx Arm 中，除了 HSI、HSE 和 PLL 之外，我们还有\
  \ LSI（低速内部）和 LSE（低速外部）时钟源。\n\n`LSI` 是一个基于 RC 的低功耗时钟源，时钟约为 32 kHz。这允许系统在停止（Stop）和待机（Standby）模式下运行以节省功率，且不会丢失任何信息。\n\
  \n`LSE` 时钟用于从 32.768 kHz 外部晶体或陶瓷谐振器产生时钟。它用于为实时时钟外设（RTC）提供低功耗但高精度的钟源，用于日历或其他定时功能。\n\
  \n需要注意的是，有单独的引脚连接晶振以产生 LSE 频率。它们被称为 `OSC32_in` 和 `OSC32_out`。在 Nucleo-446RE 板上，`OSC32_in`\
  \ 和 `OSC32_out` 引脚连接到一个 32.768 kHz 的晶振。要进一步探索 LSI 和 LSE ，请参见 STM32F4xx 参考手册和您的开发板用户手册。\n\
  \n![](img/image00461.jpeg)\n**图 C-6：LSI 和 LSE 时钟源**\n\n## 时钟输出引脚\n\nSTM32F4xx 为我们提供了将时钟电路的一些钟信号连接到两个引脚之一的选择。这被称为微控制器时钟输出（MCO）。有两个微控制器时钟输出（MCO）引脚，`MCO1`\
  \ 和 `MCO2`。\n\n## MCO1 (微控制器时钟输出 1)\n\n我们可以通过以下选项为 `MCO1` 引脚 (`PA8`) 选择四种时钟信号之一：\n\
  \n- HSI 时钟\n- LSE 时钟\n- HSE 时钟\n- PLLCLK 时钟\n\n![](img/image00462.jpeg)\n**图 C-7：MCO1\
  \ 时钟输出引脚**\n\n使用 RCC 时钟配置寄存器 (`RCC_CFGR`) 中的 `MCO1`（微控制器时钟输出 1）位选择所需的钟源。同一寄存器的 `MCO1PRE`\
  \ 位允许 1、2 的分频。\n\n所需的时钟源通过 RCC 时钟配置寄存器 (`RCC_CFGR`) 中的 `MCO1` 位进行选择。同一寄存器的 `MCO1PRE`\
  \ 位允许 1、2 的分频。\n\n输出引脚需要配置以显示所选信号。`PA8` 必须配置为复用功能。\n\n## MCO2 (微控制器时钟输出 2)\n\n我们可以通过以下选项为\
  \ `MCO2` 引脚 (`PA9`) 选择四种时钟信号之一：\n\n- HSI 时钟\n- LSE 时钟\n- HSE 时钟\n- PLLCLK 时钟\n\n\
  所需的钟源通过 RCC 时钟配置寄存器 (`RCC_CFGR`) 中的 `MCO2` 位进行选择。同一寄存器的 `MCO2PRE` 位允许 1、2 的分频。输出引脚需要配置以显示所选信号。`PA9`\
  \ 必须配置为复用功能。\n\n## 180 MHz 示例代码\n\n```c\n#include \"stm32f4xx.h\"\n\nint main(void)\
  \ {\n    /* 启用 HSI 时钟 */\n    RCC->AH12ENR |= RCC_AH12EN_HSI;\n    /* 等待 HSI 就绪\
  \ */\n    while(!(RCC->CR & RCC_CR_HSIRDY));\n\n    /* 启用 HSE 时钟 */\n    RCC->AH12ENR\
  \ |= RCC_AH12EN_HSE;\n    /* 等待 HSE 就绪 */\n    while(!(RCC->CR & RCC_CR_HSERDY));\n\
  \n    /* 配置 PLL: M=4, N=180, P=2 */\n    RCC->PLLCFGR = (RCC_PLLCFGR_M_6) | (180\
  \ << 16) | (2 << 24);\n    /* 开启 PLL */\n    RCC->CR |= RCC_CR_PLON;\n    /* 等待\
  \ PLL 就绪 */\n    while(!(RCC->CR & RCC_CR_PLLRDY));\n\n    /* 切换 SYSCLK 源到 PLL */\n\
  \    RCC->CFGR &= (RCC_CFGR_SW_MASK);\n    RCC->CFGR |= RCC_CFGR_SW_PLL;\n    /*\
  \ 等待 SYSCLK 切换完成 */\n    while((RCC->CFGR & RCC_CFGR_SWF) != RCC_CFGR_SW_PLL);\n\
  \n    /* 配置 Flash 等待状态和缓存 */\n    FLASH->ACR |= FLASH_ACR_LATENCY_2;\n\n    /* 将\
  \ PA8 配置为 MCO1 的复用功能 */\n    GPIOA->MODER &= ~(3 << 16);\n    GPIOA->MODER |= (2\
  \ << 16);\n    GPIOA->AFRH &= ~(0xF << 0);\n    GPIOA->AFRH |= (0 << 0);\n\n   \
  \ /* 选择 MCO1 为 PLLCLK */\n    RCC->CFGR &= ~RCC_CFGR_MCO1_MASK;\n    RCC->CFGR |=\
  \ RCC_CFGR_MCO1_PLL;\n\n    while (1) {\n    }\n}\n```\n\n\n\n\n## RCC AHB1 外设时钟启用寄存器\n\
