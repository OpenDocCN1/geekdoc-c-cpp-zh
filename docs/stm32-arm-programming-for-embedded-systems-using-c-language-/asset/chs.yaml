  \n上述程序在发送下一个数据或命令之前使用了时间延迟。这允许 LCD 有足够的时间准备好以接收下一个数据。然而，LCD 有一个忙标志。我们可以监控该忙标志并在其准备绪时发送数据。这将加快处理过程。要检查忙标志，必须读取命令寄存器（`R/W\
  \ = 1`，`RS = 0`）。忙标志是该寄存器的 `D7` 位。因此，当 `R/W = 1` 且 `RS = 0` 时，如果 `D7 = 1`（忙标志 =\
  \ 1），则 LCD 正在忙于内部操作，不会接受任何新信息。当 `D7 = 0` 时，LCD 准备好接收新信息。\n\n这样做需要在轮询状态寄存器时，将连接到数据线的端口方向切换为输入模式，然后将端口方向切换回输出模式以发送下一个命令。如果端口方向错误，可能会损坏微控制器或\
  \ LCD 模块。接下来的程序示例使用了对状态寄存器中忙位的轮询。\n\n### 程序 3-2：此程序使用 8 位模式和轮询状态寄存器在 LCD 上显示消息\n\
