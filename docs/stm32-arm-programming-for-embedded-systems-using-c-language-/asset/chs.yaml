  \n在本章中，我们将学习 `char`、`short`、`int`、`long`、`float` 和 `double` 数据类型。在一般的 C 编程中，我们会看到\
  \ `char`、`short`、`int`、`long`、`float` 和 `double` 的大小。`char`、`short`、`int`、`long`、`float`\
  \ 和 `double` 的大小通常取决于编译器。\n\n## 第 1.1 节：数据类型\n\n### 第 1.2 节：标准数据类型\n\n如果你觉得这很困惑，有三种方法可以帮助你找到数据类型的确切大小：\n\
  \n1. 阅读编译器的手册。由于数据大小没有统一标准，编译器手册通常会对它们进行说明。\n3. 使用 C99 数据类型。为了解决数据大小缺乏标准的困惑，C 标准委员会开发了一套新的定义良好的数据类型。我们将在本章稍后的部分介绍它们。\n\
  \n`char` 数据类型是一种字节大小的数据，其位被指定为 D7-D0。它可以是有符号的（signed`）或无符号的（unsigned`）。在 `signed`\
  \ 格式下，D7 位用于正负符号，取值范围在 -128 到 +127 之间。在 `unsigned char` 中，值为十六进制的 0x00 到 0xFF 或十进制的\
  \ 0 到 255，因为没有符号位，整个 8 位都用于表示数值。\n\n`short int`（通常称为 `short`）是一种 2 字节大小的数据，其位被指定为\
  \ D15-D0。它可以是有符号的（signed`）或无符号的（unsigned`）。在 `signed` 格式下，D15 位用于正负符号，取值范围在 -32,768\
  \ 到 +32,767 之间。在 `unsigned short int` 中，值为十六进制的 0x0000 到 0xFFFF 或十进制的 0 到 65,535，因为没有符号位，整个\
  \ 16 位都用于表示数值。（参参见第一卷的第 5 章。）\n\n\n\n\n具有 32 位数据线的 Arm 架构等 32 位处理器在 4 字节边界上（地址以十六进制的\
  \ 0, 4, 8 和 C 结尾）上至少读取 32 位内存。如果分配的 `short int` 变量跨越了 4 字节边界，则对该变量的访问被称为 `unaligned\
  \ access`（非对齐访问）。并非所有的 Arm 处理器都支持非对齐访问。支持非对齐访问设备（包括 `MSP432 LaunchPad` 中使用的 `MSP432`）由于需要读写两次内存才能访问一个变量会导致性能损失（参见示例\
  \ 1-1）。可以通过使用未使用字节填充变量（`Keil`）或在分配时重新排列变量顺序（`CCS`）来避免非对齐访问。编译器通常会生成对齐变量分配。\n\n展示对齐分配和非对齐分配如何为以下分配内存。从内存位置\
  \ `0x20000000` 开始。\n\n```c\nunsigned char a;\nunsigned short int c;\n```\n\n\n变量\
  \ `c` 的非对齐分配\n`a b b c` 20000000 20000001 20000002 20000003\n`c` 20000004 20000005\
  \ 20000006 20000007\n在变量 `a` 和 `b` 之间填充一个字节的对齐分配\n`a b b` 20000000 20000001 20000002\
  \ 20000003\n`c c` 20000004 20000005\n\n`b b c c` 20000000 20000001 20000002 20000003\n\
  `a` 20000004 20000005 20000006 20000007\n\n`int` 数据类型通常代表处理器的原生数据大小。例如，对于 16 位处理器，它是\
  \ 2 字节数据；对于 32 位处理器，它是 4 字节数据。这可能会导致混淆和移植性问题。C99 标准通过创建一组新的整数变量类型解决了这个问题，稍后讨论。目前，我们将坚持传统的数据类型。\n\
  \nArm 处理器的 `int` 数据类型为 4 字节，与下述的 `long int` 数据类型相同。\n\n`long int`（或 `long`）数据类型是\
  \ 4 字节数据，其位指定为 `D31-D0`。它可以是有符号或无符号的。在符号格式中，`D31` 位用于 `+` 或 `-` 符号，值范围在 `-2³¹` 到\
  \ `+2³¹–1` 之间。在 `unsigned long` 中，十六进制值在 `0x00000000` 到 `0xFFFFFFFF` 之间。参见第 1 第\
  \ 5 章。在 32 位微控制器中，当我们声明 `long` 变量时，编译器会在 SRAM 中留出 4 字节存储。但它也会确保它们是对齐的，这意味着它将数据放在地址以十六进制\
  \ 0, 4, 8 和 C 结尾的位置。这避免了第 1 中提到的非对齐数据访问性能惩罚。`unsigned long` 在 Arm 中广泛用于定义地址，因为 Arm\
  \ 地址大小是 32 位的。\n\n### 示例 1-2\n\n```c\nunsigned char a;\nunsigned short int c;\n\
  unsigned int d;\n\n**解决方案：**\n\n`a b b c` 20000000 20000001 20000002 20000003\n\
  `c d d d` 20000004 20000005 20000006 20000007\n`d` 20000008 20000009 2000000A 2000000B\n\
  在变量 `a` 和 `b` 之间填充字节的对齐分配\n`a b b` 20000000 20000001 20000002 20000003\n`c c` 20000004\
  \ 20000005 20000006 20000007\n\n通过重新排列变量顺序的对齐分配\n`d d d d` 20000000 20000001 20000002\
  \ 20000003\n`a` 20000008 20000009 2000000A 2000000B\n\n### long long\n\n### 为什么我应该关心使用什么数据类型？\n\
  程序员应该关注数据类型有三个主要原因：性能、溢出和强制转换。\n\n必须注意的是，虽然在 8 位微控制器我们需要使用适当的数据类型来提高性能，但在 Arm 等\
  \ 32 位 CPU 中，这个问题变得不那么严重。例如，对于一个月的天数（或一天中的小时数），我们使用 `unsigned char`，因为它小于 255。在\
  \ 8 位微控制器中使用 `unsigned char` 是重要的，因为它节省了 RAM 空间、内存访问时间和计算周期。如果我们改用 `int`，编译器会在 RAM\
  \ 中分配 2 字节，那是对 RAM 资源的浪费。CPU 将不得不访问额外的字节并对其执行额外的指令，即使该字节内容为 0 且对结果没有影响。这是我们应该避免的问题，因为\
  \ 8 位微控制器的通常 RAM 字节较少，且总线时钟较慢。`unsigned long` 在 Arm 中广泛用于定义地址，因为 Arm 地址大小是 32 位的。\n\
  \n\n| 数据类型 | 大小 | 范围 |\n| :--- | :--- | :--- |\n| char | 1 字节 | -128 到 127 |\n|\
  \ short int | 2 字节 | -32,768 到 32,767 |\n| unsigned short int | 2 字节 | 0 到 65,535\
  \ |\n| int | 4 字节 | -2,147,483,648 到 2,147,483,647 |\n| long | 4 字节 | -2,147,483,648\
  \ 到 2,147,483,647 |\n| unsigned long | 4 字节 | 0 到 4,294,967,295 |\n| unsigned long\
  \ long | 8 字节 | 0 到 18,446,744,073,709,551,615 |\n\n#### 注意事项\n2. 在某些编译器（包括 `Keil`\
  \ 和 `IAR`）中，`int` 类型被视为 `long int`，而在另一些编译器（包括 `AVR` 和 `PIC` 编译器）中，它被视为 `short int`。换句话之，`int`\
  \ 类型的通常定义以便处理器轻松处理。正如我们接下来将看到的，我们可以使用 `int16_t` 和 `int32_t` 代替 `short` 和 `long`，以防止任何歧义并使代码在不同的处理器和编译器之间通用。\n\
  \n#### 溢出\n与汇编编程不同，高级程序语言在发生溢出时不提供指示，程序只会静默失败。例如，如果你使用 `short int` 来存储一天的秒数，在当天的第\
  \ 9 小时 6 分 7 秒时，秒数将从 32,767 溢出到 -32,768。即使你的程序可以处理负秒数，时间也会跳回前一天。\n\n\n\n`bit int`\
  \ 可以存储一个高达 2,147,483,647 的数字，但它并没有消除潜在的问题。其中一个即将发生的关键溢出问题就是“Unix 千禧年漏洞”（Unix Millennium\
  \ Bug）。Unix 使用一个 `32-bit int` 来记录自 1970 年 1 月 1 日以来的秒数。该变量将在 2038 年 1 月发生溢出。由于 Unix\
  \ 的普及，不仅 Unix 系统被广泛使用，许多其他系统也使用相同或相似的格式来跟踪时间。到目前为止，还没有通用的解决方案来解决这个问题。`Coercion`（强制转换）\n\
  \n在 C 语言中，二元操作（带有两个操作数的运算符，如 `A + B`）的操作数数据类型必须相同。如果你在二元操作语句中使用了不同数据类型的操作数，编译器会将较小的数据类型转换为较大的数据类型。如果是赋值运算符（`A\
  \ = B`），则在赋值之前，右侧的操作数会被转换为左侧的数据类型。这种隐式的数据类型转换被称为 `coercion`。当发生强制转换时，编译器可能会也可能不会向你发出警告。\n\
  \n\n另一个问题是当你将一个较大的数据类型赋值给较小的数据类型变量时，高位会被截断。例如，在语句 `A = B;` 中，如果 `A` 是 8 位的而 `B`\
  \ 是 16 位的，`B` 的高 8 位在赋值前会被丢弃。\n\n数据类型大小的问题没有简单的解决方案。作为程序员，你必须时刻意识到这些问题。\n### ISO\
  \ C99 标准中的数据类型\n\n虽然每个 C 程序员都使用过 ANSI C (ISO C89) 数据类型，但许多 C 程序员并不熟悉 ISO C99 标准。在\
  \ C 标准中，整数数据类型的大小并没有定义，而是由编译器来决定。\n在 ISO C99 标准中，定义了一组数据类型，并在数据类型名称中明确定义了位数和符号。见表\
  \ 1-2。C99 标准被嵌入式系统程序员广泛用于 RTOS（实时操作系统）和系统设计。它也被大多数 C 编译器支持。请注意，其范围与 ANSI C 标准相同，只是使用了更显式的描述性语法。\n\
  \n这些整数数据类型定义在一个名为 `stdint.h` 的头文件中。你需要包含此头文件才能使用这些数据类型。\n\n\n- `int8_t`: 1 字节 -128\
  \ 到 127\n- `uint8_t`: 1 字节 0 到 255\n- `uint16_t`: 2 字节 0 到 65,535\n- `int32_t`:\
  \ 4 字节 -2,147,483,648 到 2,147,483,647\n- `uint32_t`: 4 字节 0 到 4,294,967,295\n- `int64_t`:\
  \ 8 字节 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\n\n**表 1-2: ISO C99\
  \ 整数数据类型及其范围**\n\n\n1. 在 8 位系统中，我们使用 `(char, unsigned char)` 来表示一年的月份数。\n2. 对于具有\
  \ 16 位地址总线的系统，我们使用 `(int, unsigned int)` 进行地址定义。\n3. 对于 Arm 系统，地址宽度为 _____ 位，我们使用\
  \ ______ 数据类型来表示。\n\n## 第 1.2 节：C 中的位运算\n\nC 语言最重要且强大的功能之一是执行位操作的能力。由于许多关于 C 语言的书中没有涵盖这个重要主题，因此在本节中讨论它是合理的。本节描述了位逻辑运算符的作用，并提供了它们如何使用的的一些示例。\n\
  ### C 中的位运算符\n\n虽然每个 C 程序员都熟悉逻辑运算符 AND (`&&`)、OR (`||`) 和 NOT (`!`)，但许多 C 程序员对位运算符\
  \ AND (`&`)、OR (`|`)、异或 (`^`)、取反 (`~`)、右移 (`>>`) 和左移 (`<<`) 不熟悉。这些位运算符在嵌入式系统和控制的软件工程中被广泛；因此，理解并掌握它们对于基于微处理器的系统设计和接口至关重要。见表\
  \ 1-3。\n| A | B | AND | OR | EX-OR | Invert |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| `(A & B)` | | `(A | B)` | | | |\n| `0b10010010` | | | | | `0b1111111110010010`\
  \ |\n**表 1-3: 位运算符**（注：表格的原文是碎片化的，为了清晰起见已逻辑重建）。\n\n（正包含各种位运算示例，如 `A & B`、`A | B`、`A\
  \ ^ B`、`~A`、`>>`、`<<`）。\n\n\n\n在 C 语言中，每当赋值运算符（`=`）的左侧与右侧第一个操作数相同时，我们就可以使用复合运算符来避免重复操作数。如表\
  \ 1-5 所示，在复合运算符中，一个操作数写在等号的左侧。\n### 指令\n\n```c\na = a – 23;\ny = y * z;\nz = z /\
  \ 25;\nw = w | 0x20; v = v & mask; m = m ^ togBits;\n\n使用复合运算符的等写法：\n\na += 6;\n\
  a –= 23;\ny *= z;\nz /= 25;\nv &= mask;\nm ^= togBits;\n```\n**表 1-5: 一些复合运算符示例**\n\
