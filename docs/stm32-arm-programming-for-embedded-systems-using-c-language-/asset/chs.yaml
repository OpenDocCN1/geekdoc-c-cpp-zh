  # 图 13-13: DMA 高中断标志清除寄存器 (DMA_HIFCR)\n\n## UART 的 DMA 使用\n在我们目前完成的所有 UART2 示例中，我们没有使用任何\
  \ DMA 选项。UART 的 DMA 选项通过 `USART_CR3` 寄存器中的 `DMAT`（DMA 发送器）和 `DMAR`（DMA 接收器）位来选择。见下图。\n\
  \n![](img/image00451.jpeg)\n\n位 7 `DMAT`: DMA 启用发送器 位 6 `DMAR`: DMA 启用接收器 此位由软件设置/清除\
  \ 此位由软件设置/清除 1: 启用传输 DMA 模式。 1: 启用接收 DMA 模式。 0: 禁用传输 DMA 模式。 0: 禁用接收 DMA 模式。\n\n\
  # 图 13-14: USART 控制寄存器 3 (USART_CR3)\n\n## DMA 内存到 USART2 发送器的示例\n在此示例中，我们将配置 DMA\
  \ 控制器将数据从内存传输到 USART2 发送器。选择 USART2 是因为它连接到 NucleoF446 板上 ST-Link USB 连接的虚拟 COM\
  \ 口。不需要额外的硬件即可获得传输输出。\n\n从本章表 13-1 中，可以看到 USART2_TX 连接到 DMA1 流 6 的通道 4。\n\nUSART2\
  \ 的初始化方式与第 4 章相同。此外，启用了传输完成中断。通过在 `RCC_AHB1ENR` 中启用时钟初始化 DMA1 控制器，并在 NVIC 中启用中断。中断章节（第\
  \ 6 章）表 6-7 显示 IRQ 17 被分配给 DMA1 Stream6 全局中断。\n\n### 配置 DMA 流的步骤\n1. 在修改配置之前必须禁用\
  \ DMA 流。通过向流控制寄存器的 `EN` 位写入 `0` 来禁用它，然后等待 `EN` 位读取返回为 `0`。\n2. 应清除中断标志。\n3. 在外设地址寄存器中加载\
  \ USART2 发送数据寄存器的地址。 4. 在内存 0 地址寄存器中加载数据缓冲区的起始地址。5. 在数据数量寄存器中加载数据缓冲区的字节计数。6. 将通道选择字段设置为所需的通道（在本例中为通道\
  \ 4）。7. 设置数据大小（在本例中为 8 位）、内存地址递增、外设地址不递增以及方向（内存到外设）。8. 启用传输完成中断和错误中断。9. 禁用 FIFO。10.\
  \ 启用 DMA 流。11. 通过向传输完成中断标志写入 `0` 来清除 UART 传输完成中断标志。12. 通过设置控制寄存器 3 的 `DMAT` 位启用\
  \ USART2 DMA 发送。\n\n一旦设置了 USART2 `DMAT` 位，数据传输将立即开始。当数据传输完成后，将同时发生 DMA 中断和 USART2\
  \ 中断。在实践中，你可能只需要处理一个中断。在这种情况下，DMA 中断可能是更理想的选择，因为它涵盖了 DMA 数据传输错误中断。在下方的示例程序中，我们在\
  \ DMA 中断处理程序中留了一个错误处理的占位符。USART2 中断处理程序设置一个标志，让主函数知道数据传输已完成。\n\n### 程序 13-1：通过 DMA\
  \ 向 USART2 发送字符串\n```c /* p13_1.c 通过 DMA 向 USART2 发送字符串\n*\n* USART2 传输在 DMA1 Stream6\
  \ Channel 4 上。\n* 请参考手册表 28 RM0390 2017 年 7 月。\n*\n* USART2 Tx 信号连接到引脚 PA0。要在 PC\
  \ 上查看 USART2 的输出\n* 需要使用 USB 转串口模块。将模块的 Rx 引连接到\n* STM32F446 Nucleo 板的 PA0 引。确保\n\
  * 你使用的 USB 转串口模块具有 3.3V 接口。\n*\n* 默认情况下，系统时钟运行在 16 MHz。\n* UART 配置为 9600 波特。\n*\
  \ PA0 - USART2 TX (AF8)\n*\n* 此程序已使用 Keil uVision v5.24a 配合 DFP v2.11.0 进行过测试 */\n\
  #include \"stm32F4xx.h\"\n\nvoid USART2_init(void);\n\nvoid DMA1_init(void);\n\n\
  void DMA1_Stream6_setup(unsigned int src, unsigned int dst, int len);\n\nint done\
  \ = 1;\n\nint main (void) {\n    char alphabets[] = \"abcdefghijklmnopqrstuvwxyz\"\
  ;\n    char message[80];\n    int i;\n    int size = sizeof(alphabets);\n    USART2_init();\n\
  \     DMA1_init();\n\n    while (1) {\n        /* 准备用于传输的消息 */\n        for (i =\
  \ 0; i < size; i++)\n            message[i] = alphabets[i]; /* 配置 PA2 用于 USART2_TX\
  \ */\n        GPIOA->AFR[0] &= ~0x0F00;\n        GPIOA->AFR[0] |= 0x0700; /* USART2\
  \ 使用 alt7 */\n        GPIOA->MODER &= ~0x0030;\n        GPIOA->MODER |= 0x0020;\
  \ /* 启用 PA2 的备用功能 */\n        /* 使用 DMA 通过 USART2 发送消息 */\n        while (done ==\
  \ 0) {} /* 等待 DMA 数据传输完成 */\n        done = 0; /* 按原文逻辑 */\n        /* ... 后续函数定义\
  \ ... */\n    }\n}\n```\n*(由于原文文本包含大量重复的段落，此处已提取核心内容并确保格式完整性。)*\n\n\n\n\n在此示例中，`ADC`\
  \ 由定时器（`TIM2 Ch2`）周期性触发。转换结果通过 `DMA` 存储在内存缓冲区中。当缓冲区满时，`DMA` 控制器会产生一个传输完成中断来通知程序。一旦设置完成，在中断确认之前，所有这些活动都在不涉及\
  \ `CPU` 的情况下完成。\n\n这对于数据采集非常有用。通常会使用双缓冲模式，以便在 `ADC` 数据被传输到其中一个缓冲区时，`CPU` 可以处理另一个缓冲区中的旧数据。但为了简单起见，我们只使用了单缓冲区。当缓冲区满时，`TIM2`、`ADC`\
  \ 和 `DMA` 将停止，此时 `CPU` 正在处理数据并通过 `USART2` 将其发送。\n\n## 程序 13-2：通过 DMA 从 ADC 获取数据\n\
  \n```c\n /* p13_2.c 通过 DMA 从 ADC 获取数据\n\n*\n* 程序设置了定时器 TIM2 通道 2 以触发 ADC1 来 * 转换模拟输入通道\
  \ 0。ADC1 的输出通过 DMA 传输 * 到内存中的缓冲区。一旦缓冲区满，DMA 将 * 停止。数据被转换为十进制 ASCII 数字并发送 * 到 USART2\
  \ 以显示在控制台上。\n*\n* 全局变量 done 被 DMA 传输完成中断 * 处理程序使用，用于向程序的其他部分信号满缓冲区 * 数据转换已完成。\n\
  *\n* 此程序已使用 Keil uVision v5.24a 配合 DFP v2.11.0 进行过测试 */\n\n#include \"stm32f4xx.h\"\
  \n#include \"stdio.h\"\n\n#define ADCBUFSIZE 64 \nvoid USART2_init (void); /* 初始化\
  \ UART 引脚、波特率 */\n\nvoid DMA2_init(void); /* 初始化 DMA2 控制器 */\n\nvoid DMA2_Stream0_setup(unsigned\
  \ int src, unsigned int dst, int len); /* 为 ADC1 设置 DMA 传输 */\n\nvoid TIM2_init(void);\
  \ /* 初始化 TIM2 */\n\nvoid ADC1_init(void); /* 设置 ADC */\n\nint done = 1;\nchar adcbuf[ADCBUFSIZE];\
  \ /* 用于接收来自 ADC 转换 DMA 传输的缓冲区 */\nchar uartbuf[ADCBUFSIZE * 5]; /* 用于存放显示 ASCII\
  \ 数字的缓冲区 */\n\nint main(void) {\n    int i;\n    char* p;\n    USART2_init();\n\
  \    DMA2_init();\n    TIM2_init();\n    ADC1_init();\n    while(1) {\n        done\
  \ = 0; /* 清除 done 标志 */\n        /* 启动 DMA 数据传输 */\n        DMA2_Stream0_setup((uint32_t)adcbuf,\
  \ (uint32_t)&ADC1->DR, ADCBUFSIZE); \n        while (done == 0) {} /* 等待 DMA 传输\
  \ */\n        /* 将 ADC 数据转换为 ASCII 数字用于显示 */\n        p = uartbuf;\n        for\
  \ (i = 0; i < ADCBUFSIZE; i++) {\n            sprintf(p, \"%d \", adcbuf[i]);\n\
  \            p += 4;\n        }\n        /* 通过 USART2 将 ADC 数字发送到控制台 */\n      \
  \  for (i = 0; i < p - uartbuf; i++) {\n            while (!(USART2->SR & 0x40))\
  \ {}\n            USART2->DR = uartbuf[i];\n        }\n    }\n}\n\n/* TIM2 通道 2\
  \ 配置为产生 1 kHz 的 PWM。定时器信号的输出用于触发 ADC。ADC1 配置为 8 位转换，并由 TIM2 通道 2 的上升沿触发。 */\nvoid\
  \ ADC1_init(void) {\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n    GPIOA->MODER\
  \ |= 3; /* PA0 模拟模式 */\n    RCC->APB2ENR |= 0x0100; /* 开启 ADC1 时钟 */\n    ADC1->CR1\
  \ = 0x2000000; /* 8 位转换 */\n    ADC1->CR2 = 0x1300000; /* 上升沿，extsel 3 = tim2.2\
  \ */\n    ADC1->CR2 |= 0x400; /* 每次转换后开启 EOC 位标志 */\n    ADC1->CR2 |= 1; /* 开启 ADC1\
  \ */\n}\n\nvoid TIM2_init(void) {\n    RCC->AHB1ENR |= 2; /* 开启 GPIOB 时钟 */\n  \
  \  GPIOB->MODER |= 0x80; /* PB3 timer2.2 输出 */\n    GPIOB->AFR[0] |= 0x1000; /*\
  \ 设置定时输出引脚 */\n    RCC->APB1ENR |= 1; /* 开启 TIM2 时钟 */\n    TIM2->PSC = 160 - 1;\
  \ /* 分频 160 */\n    TIM2->ARR = 100 - 1; /* 分频 100，采样频率 1 kHz */\n    TIM2->CNT\
  \ = 0;\n    TIM2->CCMR1 = 0x6800; /* pwm1 模式，开启预装器 */\n    TIM2->CCER = 0x10; /*\
  \ 开启通道 2 */\n    TIM2->CCR2 = 50 - 1;\n}\n\n/* 开启 DMA2 控制器的时钟，并在 NVIC 中也开启 DMA 中断。\
  \ */\nvoid DMA2_init(void) {\n    RCC->AHB1ENR |= 0x04; /* 开启 DMA2 时钟 */\n    DMA2->HIFCR\
  \ = 0x3F; /* 清除 DMA 中断标志 */\n    NVIC_EnableIRQ(DMA2_Stream0_IRQn); /* 开启 DMA2 Stream0\
  \ 中断 */\n}\n\n/* 为 ADC1 设置 DMA 传输。该函数设置源地址、目的地址和传输长度。 */\nvoid DMA2_Stream0_setup(unsigned\
  \ int src, unsigned int dst, int len) {\n    DMA2->Stream0->CR &= ~1; /* 关闭 DMA\
  \ 传输 */\n    while (DMA2->Stream0->CR & 1) {} /* 等待 DMA 禁用 */\n    DMA2->HIFCR =\
  \ 0x3F; /* 清除 DMA 中断标志 */\n    DMA2->Stream0->PAR = dst;\n    DMA2->Stream0->MAR\
  \ = src;\n    DMA2->Stream0->NDTR = len;\n    DMA2->Stream0->CR = 0x0000000; /*\
  \ 重配置 CR 寄存器 */\n    DMA2->Stream0->CR |= 0x0000400; /* 开启内存递增 */\n    DMA2->Stream0->CR\
  \ |= 0x0000004; /* 设置为外设模式 */\n    DMA2->Stream0->CR |= 0x0000004; /* 开启传输完成中断 */\n\
  \    DMA2->Stream0->CR |= 0x0000020; /* 开启传输半完成中断 */\n    DMA2->Stream0->CR |= 0x0000008;\
  \ /* 开启传输错误中断 */\n    DMA2->Stream0->CR |= 1; /* 开启 DMA 传输 */\n}\n\n/* DMA2 Stream0\
  \ 中断处理程序处理来自 DMA2 控制器的中断。错误有处理代码占位符。如果是 DMA 传输中断，DMA 控制器已开启，ADC 转换完成后触发 DMA，定时器用于触发\
  \ ADC。 */\nvoid DMA2_Stream0_IRQHandler(void) {\n    if (DMA2->HISR & 0x0C) { /*\
  \ 如果发生错误 */\n        // 错误处理代码\n    }\n    if (DMA2->HISR & 0x40) { /* 如果 DMA 传输完成\
  \ */\n        DMA2->HIFCR = 0x3F; /* 清除 DMA 中断标志 */\n        ADC1->CR2 &= ~0x0100;\
  \ /* 关闭 ADC 转换完成中断 */\n        TIM2->CR1 &= ~1; /* 关闭定时器 */\n        done = 1; /*\
  \ 设置 done 标志 */\n    }\n}\n```\n\n\n\n\n![](img/image00209.jpeg)**图 B – 1: Nucleo-F446RE\
  \ 板上使用的 STM32F4xx LQFP 64 引脚图** ![](img/image00452.jpeg)![](img/image00453.jpeg)![](img/image00454.jpeg)![](img/image00455.jpeg)**表\
