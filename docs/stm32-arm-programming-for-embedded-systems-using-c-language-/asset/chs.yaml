  \ – 完整列表见 STM32F4 参考手册）**\n\n## STM32F4xx 内存映射\n\nArm 厂商可以根据意愿实现 Arm 内存和 I/O 映射，只要他们遵循\
  \ Arm 公司的某些指南。我们经常看到外设的 I/O 映射地址位置之间差异巨大。然而，对于内存映射位置，它们大多遵循 Arm 公司设置的指南。在 Flash\
  \ 内存映射的情况下，大多数厂商在上电复位后使用 0000 位置作为默认起始位置，正如我们在本节早期所示。对于 STM32F4xx Arm 芯片，Flash 内存地址与我们在\
  \ 6.1 节看到的不同。查看下面的内存位置：\n\n0x2000 0000 - 0x2001 BFFF SRAM\n\n0x0800 0000 - 0x081F\
  \ FFFF Flash 内存\n\n注意 Flash 内存起始地址是 0x0800 0000 而不是 0x0000 0000。\n\n在 Keil MDK-Arm\
  \ IDE 中启动项目时，内存地址将在创建项目时由项目向导处理，链接器会相应分配内存地址。作为 C 语言程序员，你不需要做任何操作来正确构建项目，但在调试程序时需要了解最终的内存位置。\n\
  \n\n\n\n\n`STM32F4xx` 的内存地址要复杂得多。这些设备具有多种不同的启动模式，内存分配在不同的启动模式下也是不同的。虽然闪存的默认位置始于\
  \ `0x0800 0000`，但它也有一个从 `0` 开始的别名地址。最后，中断向量表的起始地址是可以重定位的。这些主题都超出了本书的范围，因此我们在这里不再进行详细阐述。\n\
  \n如前所述，外设中断是由外设模块生成的。这些中断信号通过“嵌套向量中断控制器”（`NVIC`）进入 CPU。当同时发生多个中断时，`NVIC` 会根据分配给每个中断的优先级决定将哪个中断传递给\
  \ CPU。最后，有一个全局掩码可以屏蔽所有中断。在复位时，所有外设模块的中断都是禁用的。要激活任何中断，我们需要启用特定外设模块的中断生成，然后在 `NVIC`\
  \ 模块中启用中断。本节将逐一介绍中断处理的这些组件。\n\n### 外部中断控制器\n\n`STM32F4xx` 的所有 I/O 引脚都可以产生外部中断。要使用外部中断线，端口引脚必须配置为输入模式。正如我们在\
  \ `Chap2` 中看到的，我们使用 `GPIOx_MODER` 将引脚配置为输入引脚。\n\n`EXTI0`（外部中断 0）到 `EXTI15`（外部中断\
  \ 15）每一个中断都分配给一组 I/O 引脚。在 `STM32F4xx` Arm 芯片中，所有的 `Px0`（`PA0`、`PB0`、`PC0`……等）引脚分在一起并输入\
  \ `EXTI0`（外部中断 0）。这意味着没有为每个端口的每个 I/O 引脚分配单独的中断。表 6-7 显示 `IRQ6` 分配给 `EXTI0`（外部中断\
  \ 0），`IRQ7` 分配给 `EXTI1`（外部中断 1），以此此类推。这意味着如果任何端口的脚 (`Px0`) 用于外部中断，它将被定向到 `EXTI0`。表\
  \ 6-8 显示 I/O 引脚到 `EXTIx` 信号的外部中断线映射。每个端口最多有 16 个引脚，因此有 16 条外部中断线（`EXTIx`）。在 `STM32F446`\
  \ Arm 芯片中，我们有 23 个外部中断。其中 16 个 (`EXTI0-EXIT15`) 专门用于端口 I/O 引脚，其他 7 个用于 `RTC0` 唤醒等功能。\n\
  \n虽然多个引脚映射到单个 `EXTIx` 信号，但同一时间只能响应其中一个。被响应的端口引脚由多路复用器通过 `SYSCFG_EXTICRx` 寄存器的位进行选择。四个\
  \ `EXTICRx` 寄存器（`EXTICR1` – `EXTICR4`）。每个寄存器处理四 `EXTI` 线，每个 `EXTI` 线有四位可从最多八个可能的端口中选择。例如，`SYSCFG_EXTICR1`\
  \ 的位 3-0 选择 `EXTI0` 线的端口，`SYSCFG_EXTICR1` 的位 7-4 选择 `EXTI1` 线的端口，以此此类推。\n\n####\
  \ EXTI[3:0] 端口\n\n*   **0000** `PAx` 引脚\n*   **0001** `PBx` 引脚\n*   **0010** `PCx`\
  \ 引脚\n*   **0011** `PDx` 引脚\n*   **0100** `PEx` 引脚\n*   **0101** `PFx` 引脚\n*   **0110**\
  \ `PGx` 引脚\n*   **0111** `PHx` 引脚\n\n**表 6-8：外部中断到各种端口的分配**\n\n为了配置 `PC13` 生成中断，我们需要将\
  \ `SYSCFG_EXTICR4` 的位 7-4 设置为 `0010`。我们通过以下两条语句来实现，第一条语句清除所有四位，第二条语句将位设置为 `0010`。注意\
  \ C 语句中 `SYSCFG_EXTICR4` 的寄存器名称为 `SYSCFG->EXTICR[3]`。\n\n```c\nSYSCFG->EXTICR[3]\
  \ &= ~0x00F0;\nSYSCFG->EXTICR[3] |= 0x0020;\n```\n\n要配置 `Px.y` 引脚生成中断，该引脚需要配置为输入。这是通过使用\
  \ `PORTx` 的 `GPIOx_MODER` 寄存实现的。下面的语句将 `PC13`（连接到 Nucleo 板上的用户按键开关）配置为输入引脚。\n\n\
  ```c\nGPIOC->MODER &= ~0x0C000000; /* 将引脚模式为输入模式 */\n```\n\n![](img/image00305.jpeg)\
  \ **图 6-8：外部中断/事件 GPIO 映射**\n\n| I/O 引脚 EXTIx | I/O 引脚 EXTIx | I/O 引脚 EXTIx | I/O\
  \ 引脚 EXTIx |\n| :--- | :--- | :--- | :--- |\n| **PA0** | EXTI0 | **PA1** | EXTI1\
  \ | **PA2** | EXTI2 | **PA3** | EXTI3 |\n| **PB0** | EXTI0 | **PB1** | EXTI1 | **PB2**\
  \ | EXTI2 | **PB3** | EXTI3 |\n| **PC0** | EXTI0 | **PC1** | EXTI1 | **PC2** | EXTI2\
  \ | **PC3** | EXTI3 |\n| **PD0** | EXTI0 | **PD1** | EXTI1 | **PD2** | EXTI2 | **PD3**\
  \ | EXTI3 |\n| **PE0** | EXTI0 | **PE1** | EXTI1 | **PE2** | EXTI2 | **PE3** | EXTI3\
  \ |\n| **PF0** | EXTI0 | **PF1** | EXTI1 | **PF2** | EXTI2 | **PF3** | EXTI3 |\n\
  | **PG0** | EXTI0 | **PG1** | EXTI1 | **PG2** | EXTI2 | **PG3** | EXTI3 |\n| **PH0**\
  \ | EXTI0 | **PH1** | EXTI1 | **PH2** | EXTI2 | **PH3** | EXTI3 |\n\n*(注：原文后续存在大量重复内容，译文已根据要求去重并保留核心逻辑结构)*\n\
  \n\n\n\n\n```c\nEXTI->IMR |= 0x2000; /* unmask EXTI13 */\nEXTI->FTSR |= 0x2000;\
  \ /* select falling edge trigger */\n```\n\n# 嵌套向量中断控制器 (Nested Vector Interrupt\
  \ Controller)\n\n在 Arm Cortex 中，所有外设中断都会进入 `NVIC`，在那里它们被启用或禁用，并进行优先级排序。每个 `IRQ`\
  \ 都有一个使能位。这些使能位由 `NVIC` 中的寄存器控制。有一个寄存器用于设置使能位（中断设置启用寄存器 `ISER[x]`），另一个寄存器用于清除使能位（中断清除启用寄存器\
  \ `ICER[x]`）。每个寄存器覆盖 32 个 `IRQ` 中断。详见图 6-11。通过向 `ISER` 寄存器中相应的位写入 1 可以启用相应的中断。向\
  \ `ISER` 寄存器写入 0 对其值没有影响。\n\n![](img/image00311.jpeg) **图 6-11：针对 IRQ 32–63 的设置启用寄存器\
  \ (ISER[1])**\n\n在 Cortex-M4 设备中，有八个 `ISER` 寄存器。稍后讨论的中断清除启用寄存器 (`ICER`) 也是如此。\n\n\
  正如表 6-3 中的中断向量表所示，`EXTI13` 与 `EXTI15_10` 组为 `IRQ40`。因此，为了启用与 `PC13` 相关的中断，我们需要以下语句：\n\
  \n```c\nNVIC->ISER[1] = 0x00000100; /* enable IRQ40 (bit 8 of ISER[1]) */\n```\n\
  \n或者，也可以使用以下函数启用中断：\n\n```c\nvoid NVIC_EnableIRQ(IRQn_Type IRQn);\n```\n\n该函数定义在\
  \ `core_cm4.h` 文件中，该文件被包含在 `stm32f446xx.h` 头文件中。要使用此函数启用中断，应将中断的 `IRQ` 作为参数传递给函数。例如，以下语句启用了\
  \ `EXTI15_10` 中断：\n\n```c\nNVIC_EnableIRQ(40);\n```\n\n由于所有中断的 `IRQ` 编号定义在 `stm32f446xx.h`\
  \ 中，我们可以使用名称代替数字，使代码更具意义。例如，要启用 `EXTI15_10` 中断，也可以以下语句：\n\n```c\nNVIC_EnableIRQ(EXTI15_10_IRQn);\n\
  ```\n\n要禁用同一个中断，另一个寄存器 `ICER1`。见图 6-12。\n\n![](img/image00312.jpeg) **图 6-12：针对\
  \ IRQ 32–63 的清除启用寄存器 (ICER[1])**\n\n通过向 `ICER` 寄存器中相应的位写入 1 可以禁用相应的中断。向 `ICER` 寄存器写入\
  \ 0 对其值没有影响。例如，以下指令禁用了 `EXTI15_10` 中断，同时保持其他中断不变：\n\n```c\nNVIC->ICER[1] = 0x00000100;\
  \ /* enable IRQ40 (bit 8 of ISER[1]) */\n```\n\n例如，以下语句禁用了 `EXTI15_10` 中断：\n\n```c\n\
  NVIC_DisableIRQ(EXTI15_10_IRQn);\n```\n\n事实上，`ISER` 寄存器的每一位与其在 `ICER` 寄存器中相应的位连接到一个\
  \ J-K 触发器，如下所示：\n\n![](img/image00313.jpeg) **图 6-13：启用和禁用中断**\n\n# 全局中断使能 (Global\
  \ Interrupt Enable)\n\n全局中断启用/禁用允许我们通过单条指令在执行某些关键任务（例如操作多个线程共享的公共指针）期间屏蔽中断。在 Arm\
  \ Cortex-M 设备中，全局中断掩码位于 CPU 中的 `PRIMASK` 寄存器。使用两个特殊指令来修改 `PRIMASK` 寄存器中的掩码位：`CPSID\
  \ I`（处理器状态禁用中断）和 `CPSIE I`（处理器状态启用中断）。为了避免在程序中编写汇编指令，Keil MDK 工具链在 C 语言中增加了两个伪函数，编译器会将它们替换为\
  \ `CPSIE I` 或 `CPSID I` 指令：\n\n```c\n__enable_irq(); /* Enable interrupt Globally\
  \ */\n```\n\n以及\n\n```c\n__disable_irq(); /* Disable interrupt Globally */\n```\n\
  \n这并不总是必要的，但在初始化期间禁用所有中断，并在所有初始化完成后再启用中断是一个好主意，特别是当某些其他资源在中断处理程序正常运行之前需要初始化时。\n\n\
  以下代码行在三个级别上启用 `PA15` 引脚的中断：\n\n```c\nEXTI->IMR |= 0x2000; /* unmask EXTI13 */\n\
  NVIC_EnableIRQ(EXTI15_10_IRQn); /* enable interrupt in NVIC */\n__enable_irq();\
  \ /* global enable IRQs */\n```\n\n# IRQ 优先级 (IRQ Priority)\n\n如前所述，Arm Cortex-M\
  \ 支持嵌套中断处理，高优先级中断可能会抢占低优先级的中断处理程序。在启用中断之前，为每个中断分配适当的优先级是非常重要的。`IRQ` 中断优先级由 `NVIC\
  \ IPR` 寄存器控制。对于每个 `IRQ` 编号，有一个字节对应该 `IRQ` 用于分配其优先级。在 STM32F4 Arm 设备中，优先级级别从 0 到\
  \ 7，它们由该字节中的三个左对齐位定义。有 60 个 `IPR` 寄存器用于存储 240 个 `IRQ` 的优先级。需要识别字节和寄存器来设置 `IRQ` 优先级。我们将在\
  \ 6.7 节中详细描述。如果不予处理，这些[向量]包含零。\n\n# 中断处理程序和中断向量 (Interrupt Handler and Interrupt\
  \ Vector)\n\n正如表 6-3 中的中断向量表所示，`EXTI13` 与 `EXTI15_10` 组为 `IRQ40`。因此，为了启用与 `PC13`\
  \ 相关的中断，我们需要以下语句：\n\n```c\nNVIC->ISER[1] = 0x00000100; /* enable IRQ40 (bit 8 of\
  \ ISER[1]) */\n```\n\n或者，也可以使用以下函数启用中断：\n\n```c\nvoid NVIC_EnableIRQ(IRQn_Type IRQn);\n\
  ```\n该函数定义在 `core_cm4.h` 文件中，该文件被包含在 `stm32f446xx.h` 头文件中。要使用此函数启用中断，应将中断的 `IRQ`\
  \ 作为参数传递给函数。例如，以下语句启用了 `EXTI15_10` 中断：\n\n```c\nNVIC_EnableIRQ(40);\n```\n\n由于所有中断的\
  \ `IRQ` 编号定义在 `stm32f446xx.h` 中，我们可以使用名称代替数字，使代码更具意义。例如，要启用 `EXTI15_10` 中断，也可以以下语句：\n\
  \n```c\nNVIC_EnableIRQ(EXTI15_10_IRQn);\n```\n\n要禁用同一个中断，另一个寄存器 `ICER1`。见图 6-12。\n\
  \n![](img/image00312.jpeg) **图 6-12：针对 IRQ 32–63 的清除启用寄存器 (ICER[1])**\n\n通过向 `ICER`\
  \ 寄存器中相应的位写入 1 可以禁用相应的中断。向 `ICER` 寄存器写入 0 对其值没有影响。例如，以下指令禁用了 `EXTI15_10` 中断，同时保持其他中断不变：\n\
  \n```c\nNVIC->ICER[1] = 0x00000100; /* enable IRQ40 (bit 8 of ISER[1]) */\n```\n\
  \n例如，以下语句禁用了 `EXTI15_10` 中断：\n\n```c\nNVIC_DisableIRQ(EXTI15_10_IRQn);\n```\n\n\
  事实上，`ISER` 寄存器的每一位与其在 `ICER` 寄存器中相应的位连接到一个 J-K 触发器，如下所示：\n\n![](img/image00313.jpeg)\
  \ **图 6-13：启用和禁用中断**\n\n全局中断使能 (Global Interrupt Enable)\n\n全局中断启用/禁用允许我们通过单条指令在执行某些关键任务（例如操作多个线程共享的公共指针）期间屏蔽中断。在\
  \ Arm Cortex-M 设备中，全局中断掩码位于 CPU 中的 `PRIMASK` 寄存器。使用两个特殊指令来修改 `PRIMASK` 寄存器中的掩码位：`CPSID\
  \ I`（处理器状态禁用中断）和 `CPSIE I`（处理器状态启用中断）。为了避免在程序中编写汇编指令，Keil MDK 工具链在 C 语言中增加了两个伪函数，编译器会将它们替换为\
  \ `CPSIE I` 或 `CPSID I` 指令：\n\n```c\n__enable_irq(); /* Enable interrupt Globally\
  \ */\n```\n\n以及\n\n```c\n__disable_irq(); /* Disable interrupt Globally */\n```\n\
  \n这并不总是必要的，但在初始化期间禁用所有中断，并在所有初始化完成后再启用中断是一个好主意，特别是当某些其他资源在中断处理程序正常运行之前需要初始化时。\n\n\
  以下代码行在三个级别上启用 `PA15` 引脚的中断：\n\n```c\nEXTI->IMR |= 0x2000; /* unmask EXTI13 */\n\
  NVIC_EnableIRQ(EXTI15_10_IRQn); /* enable interrupt in NVIC */\n__enable_irq();\
  \ /* global enable IRQs */\n```\n\nIRQ 优先级 (IRQ Priority)\n\n如前所述，Arm Cortex-M 支持嵌套中断处理，高优先级中断可能会抢占低优先级的中断处理程序。在启用中断之前，为每个中断分配适当的优先级是非常重要的。`IRQ`\
  \ 中断优先级由 `NVIC IPR` 寄存器控制。对于每个 `IRQ` 编号，有一个字节对应该 `IRQ` 用于分配其优先级。在 STM32F4 Arm 设备中，优先级级别从\
  \ 0 到 7，它们由该字节中的三个左对齐位定义。有 60 个 `IPR` 寄存器用于存储 240 个 `IRQ` 的优先级。需要识别字节和寄存器来设置 `IRQ`\
  \ 优先级。我们将在 6.7 节中详细描述。如果不予处理，这些[向量]包含零。\n\n中断处理程序和中断向量 (Interrupt Handler and Interrupt\
  \ Vector)\n\n正如表 6-3 中的中断向量表所示，`EXTI13` 与 `EXTI15_10` 组为 `IRQ40`。因此，为了启用与 `PC13`\
  \ 相关的中断，我们需要以下语句：\n\n```c\nNVIC->ISER[1] = 0x00000100; /* enable IRQ40 (bit 8 of\
  \ ISER[1]) */\n```\n\n或者，也可以使用以下函数启用中断：\n\n```c\nvoid NVIC_EnableIRQ(IRQn_Type IRQn);\n\
  ```\n该函数定义在 `core_cm4.h` 文件中，该文件被包含在 `stm32f446xx.h` 头文件中。要使用此函数启用中断，应将中断的 `IRQ`\
  \ 编号作为参数传递给函数。例如，以下语句启用了 `EXTI15_10` 中断：\n\n```c\nNVIC_EnableIRQ(40);\n```\n\n由于所有中断的\
  \ `IRQ` 编号定义在 `stm32f446xx.h` 中，我们可以使用名称代替数字，使代码更具意义。例如，要启用 `EXTI15_10` 中断，也可以以下语句：\n\
  \n```c\nNVIC_EnableIRQ(EXTI15_10_IRQn);\n```\n\n要禁用同一个中断，另一个寄存器 `ICER1`。见图 6-12。\n\
  \n![](img/image00312.jpeg) **图 6-12：针对 IRQ 32–63 的清除启用寄存器 (ICER[1])**\n\n通过向 `ICER`\
  \ 寄存器中相应的位写入 1 可以禁用相应的中断。向 `ICER` 寄存器写入 0 对其值没有影响。例如，以下指令禁用了 `EXTI15_10` 中断，同时保持其他中断不变：\n\
  \n```c\nNVIC->ICER[1] = 0x00000100; /* enable IRQ40 (bit 8 of ISER[1]) */\n```\n\
  \n例如，以下语句禁用了 `EXTI15_10` 中断：\n\n```c\nNVIC_DisableIRQ(EXTI15_10_IRQn);\n```\n\n\
  事实上，`ISER` 寄存器的每一位与其在 `ICER` 寄存器中相应的位连接到一个 J-K 触发器，如下所示：\n\n![](img/image00313.jpeg)\
  \ **图 6-13：启用和禁用中断**\n\n中断向量表中 EXTI 的中断向量需要持有处理程序的起始地址。安装向量的任务在 Keil MDK-Arm 中被证明非常简单。如前所述，中断处理程序是用\
  \ C 语言编写的函数。C 语言函数的名称代表函数执行的起始地址。需要做的是将此地址放入中断向量表中。在 Keil MDK-Arm 中，创建新项目时会添加启动汇编文件\
  \ `startup_stm32f446xx.s`。在该文件中，所有中断向量都初始化为虚拟中断处理程序。这些虚拟处理程序被声明为“WEAK”，意味着它们可以被其他中断处理程序覆盖。如果编写了与虚拟程序同名的中断处理程序，链接器将更改中断向量指向新的处理程序而不是虚拟程序。因此，程序员只需要在\
  \ `startup_stm32f446xx.s` 文件中查找中断处理程序的名称，并重用该名称用于用于中断处理程序的函数。在这种情况下，中断处理程序的名称为 `EXTI15_10_IRQHandler`。\n\
  \n程序 6-1：使用 SW0 中断的板\n\n /* 用户开关 B1 通过 PC13 生成中断。 * 用户按钮连接到 PC13。它有一个上拉电阻 * 所以当按钮未按下时\
  \ PC13 保持高电平。\n\n\n\n\n\n* 当按下按钮时，`PC13` 变为低电平。\n* `PC13` 的下降沿（当按下开关时）会触发来自`外部中断控制器\
  \ (EXTI)` 的`中断`。\n* 在中断处理程序中，用户 LED `LD2` 会闪烁两次。这作为一种粗略的开关去抖方法。\n* 绿色 LED (`LD2`)\
  \ 连接到 `PA5`。\n* 该程序已使用 `Keil uVision v5.24a` 和 `DFP v2.11.0` 进行了测试。\n\n```c\n#include\
  \ \"stm32f4xx.h\"\n\nvoid delayMs(int n);\n\nint main(void) {\n    __disable_irq();\
  \ /* global disable IRQs */\n    RCC->AHB1ENR |= 4; /* enable GPIOC clock */ \n\
  \    RCC->AHB1ENR |= 1; /* enable GPIOA clock */ \n    RCC->APB2ENR |= 0x4000; /*\
  \ enable SYSCFG clock */\n    /* configure PA5 for LED */\n    GPIOA->MODER &= ~0x00000C00;\
  \ /* clear pin mode */ \n    GPIOA->MODER |= 0x00000400; /* set pin to output mode\
  \ */\n    /* configure PC13 for push button interrupt */\n    GPIOC->MODER &= ~0x0C000000;\
  \ /* clear pin mode to input mode */\n    SYSCFG->EXTICR[3] &= ~0x00F0; /* clear\
  \ port selection for EXTI13 */ \n    SYSCFG->EXTICR[3] |= 0x0020; /* select port\
  \ C for EXTI13 */\n    EXTI->IMR |= 0x2000; /* unmask EXTI13 */\n    EXTI->FTSR\
  \ |= 0x2000; /* select falling edge trigger */\n    // NVIC->ISER[1] = 0x00000100;\
  \ /* enable IRQ40 (bit 8 of ISER[1]) */ \n    NVIC_EnableIRQ(EXTI15_10_IRQn);\n\
  \    __enable_irq(); /* global enable IRQs */\n    while(1) { }\n}\n\nvoid EXTI15_10_IRQHandler(void)\
  \ {\n    GPIOA->BSRR = 0x00000020; /* turn on green LED */ \n    delayMs(250);\n\
  \    GPIOA->BSRR = 0x00200000; /* turn off green LED */ \n    delayMs(250);\n  \
  \  GPIOA->BSRR = 0x00000020; /* turn on green LED */ \n    delayMs(250);\n    GPIOA->BSRR\
  \ = 0x00200000; /* turn off green LED */ \n    delayMs(250);\n    EXTI->PR = 0x2000;\
  \ /* clear interrupt pending flag */ \n} \n\n/* 16 MHz SYSCLK */\nvoid delayMs(int\
  \ n) {\n    int i;\n    for (; n > 0; n--)\n        for (i = 0; i < 3195; i++) ;\n\
  } \n```\n\n当已配置的 I/O 引脚信号满足触发条件时，它会发送一个 `EXTIX` 信号来设置挂起寄存器 (`EXTI_PR`) 中相应的位。如果\
  \ `EXTI_IMR` 中的相关位被置位，则会产生中断。如果该组中有多个开启了中断的引脚，中断处理程序应该查询 `EXTI_PR` 寄存器以找到是哪个 `EXTIX`\
  \ 信号在触发中断。中断处理程序轮询 `EXTI_PR` 位的顺序决定了 I/O 引脚被服务的优先级。程序 6-2 使用两个引脚（`PC13` 和 `PB10`）产生中断。`PC13`\
  \ 连接到 Nucleo 板上的用户按键开关。`PB10` 启用了上拉电阻。将 `PB10` 连接到地将产生中断。在中断处理程序中，`PC13` 中断会让 LED\
  \ 闪烁两次，而 `PB10` 中断会让 LED 闪烁三次。\n\n### 程序 6-2：重写程序 6-1 中的中断处理程序以区分中断引脚\n\n```c\n\
  \ /* p6_2.c 来自两个输入引脚的中断\n*\n* 用户开关 PB10 用于通过 PC13 产生中断。 \n* PB10 配置为产生中断。它启用了\n\
  * 上拉电阻。使用跳线将将引脚接地\n* 以产生中断。\n* 在中断处理程序中，会检查\n* 中断挂起位。如果中断来自 PC13，LED 闪烁两次。 \n* 如果中断来自\
  \ PB10，LED 闪烁三次。 \n* 绿色 LED (LD2) 连接到 PA5。\n*\n* 此程序已使用 Keil uVision v5.24a 和 DFP\
  \ v2.11.0 进行了测试。 */\n\n#include \"stm32f4xx.h\"\n\nvoid delayMs(int n);\n\nint main(void)\
  \ {\n    __disable_irq(); /* global disable IRQs */\n    RCC->AHB1ENR |= 4; /* enable\
  \ GPIOC clock */ \n    RCC->AHB1ENR |= 2; /* enable GPIOB clock */ \n    RCC->AHB1ENR\
  \ |= 1; /* enable GPIOA clock */\n    RCC->APB2ENR |= 0x4000; /* enable SYSCFG clock\
  \ */\n    /* configure PA5 for LED */\n    GPIOA->MODER &= ~0x00000C00; /* clear\
  \ pin mode */ \n    GPIOA->MODER |= 0x00000400; /* set pin to output mode */\n \
  \   /* configure PC13 for push button interrupt */\n    GPIOC->MODER &= ~0x0C000000;\
  \ /* clear pin mode to input mode */\n    SYSCFG->EXTICR[3] &= ~0x00F0; /* clear\
  \ port selection for EXTI13 */ \n    SYSCFG->EXTICR[3] |= 0x0020; /* select port\
  \ C for EXTI13 */\n    EXTI->IMR |= 0x2000; /* unmask EXTI13 */\n    EXTI->FTSR\
  \ |= 0x2000; /* select falling edge trigger */\n    /* configure PB10 for interrupt\
  \ */\n    GPIOB->MODER &= ~0x0C000000; /* clear pin mode to input mode */\n    //\
  \ (省略：EXTICR[2] 配置逻辑，PB10 逻辑此处简化基于代码代码逻辑)\n    GPIOB->PUPDR &= ~0x000000C0; /* clear\
  \ pull-up */\n    GPIOB->PUPDR |= 0x00000040; /* enable pull-up resistor */\n  \
  \  EXTI->IMR |= 0x0400; /* unmask EXTI10 */\n    EXTI->FTSR |= 0x0400; /* select\
  \ falling edge trigger */\n    NVIC_EnableIRQ(EXTI15_10_IRQn);\n    __enable_irq();\
  \ /* global enable IRQs */\n    while(1) { }\n}\n\nvoid EXTI15_10_IRQHandler(void)\
  \ {\n    if (EXTI->PR == 0x2000) { /* interrupt from PC13 */\n        GPIOA->BSRR\
  \ = 0x00000020; /* turn on green LED */ \n        delayMs(250);\n        GPIOA->BSRR\
  \ = 0x00200000; /* turn off green LED */ \n        delayMs(250);\n        GPIOA->BSRR\
  \ = 0x00000020; /* turn on green LED */ \n        delayMs(250);\n        GPIOA->BSRR\
  \ = 0x00200000; /* turn off green LED */ \n        delayMs(250);\n        EXTI->PR\
  \ = 0x2000; /* clear interrupt pending flag */ \n    } else if (EXTI->PR == 0x0400)\
  \ { /* interrupt from PB10 */\n        GPIOA->BSRR = 0x00000020; /* turn on green\
  \ LED */ \n        delayMs(250);\n        GPIOA->BSRR = 0x00200000; /* turn off\
  \ green LED */ \n        delayMs(250);\n        GPIOA->BSRR = 0x00000020; /* turn\
  \ on green LED */ \n        delayMs(250);\n        GPIOA->BSRR = 0x00200000; /*\
  \ turn off green LED */ \n        delayMs(250);\n        EXTI->PR = 0x0400; /* clear\
  \ interrupt pending flag */ \n    }\n}\n\n/* 16 MHz SYSCLK */\nvoid delayMs(int\
  \ n) {\n    int i;\n    for (; n > 0; n--)\n        for (i = 0; i < 3195; i++) ;\n\
  } \n```\n\n### 复习题\n1. `IRQ6` 分配给哪个设备的中断？\n2. 正确或错误。每个 I/O 引脚都分配了一个中断。\n3. 正确或错误。`STM32F4xx`\
  \ 中的 I/O 端口支持电平和和边触发中断。\n4. 我们在 C 语言中使用 `___________` 来全局启用中断。\n5. 展示在启动中断之前必须经过的\
  \ 3 级中断开启。\n\n### 6.4 节：USART 串口中断编程\n在第 4 章中，我们展示了如何使用轮询在 `STM32F446 Arm` 中对 `USART2`\
  \ 进行编程。本章展示了如何使用中断来实现相同的功能。使用中断可以将 CPU 从轮询 `USART` 状态释放出来。从表 6-7 中断向量表可以看到 `IRQ38`\
  \ 分配给了 `USART2`。`USART2` 全局中断位于向量位置地址 `0x000000D8`。接下来我们将使用它。\n\n#### USART2 接收中断编程\n\
  第 4 章中的程序 4-2 展示了 `USART2` 如何通过轮询接收完成 (`RXNE`) 标志来接收数据。该程序的缺点是在轮询标志位时会占用 CPU。我们可以修改它使其成为中断驱动的程序。通过检查\
  \ `USARTx_CR1`（控制 1）寄存器，我们看到 `RXNEIE`（接收非空中断允许）位允许我们启用接收中断。如果启用了 `RXNEI` 中断并接收到一个字节，接收器\
  \ `RXNEI` 标志将变为高电平，从而向 `NVIC` 生成中断并导致与 `USART2` 关联的中断处理程序执行。在 `USART2` 中断处理程序中，我们读取接收到的字符。从\
  \ `DR`（数据寄存器）读取接收到的字符会清除 `RXNE` 标志。\n\n![](img/image00314.jpeg)\n\n图 6-14：USARTx_CR1\
  \ 启用寄存器启用接收中断\n\n位 5 `RXNEIE`: RXNE 中断允许\n\n此位由软件设置和清除。\n0：中断被禁止\n1：每当 `USART_SR`\
  \ 寄存器中的 `ORE=1` 或 `RXNE=1` 时，都会产生 USART 中断\n\n\n\n\n程序 6-4 中 `USART2` 的初始化与程序 4-2\
  \ 相同，不同之处在于最后启用了 `RXNEIE` 中断。从无限循环中删除了对 `RXNE` 标志位的轮询。增加了 `USART2` 中断处理函数。在中断处理函数中，读取数据并将其用于闪烁\
  \ LED。读取数据会自动清除中断标志。在这个简单的示例中，只启用了 `RXNE` 中断，因此不需要检查其他标志位。在实际应用中，可能需要检查错误标记并处理错误情况。\n\
  \n通过程序 6-3，在终端模拟器上按下按键会使 PC 将该按键的 ASCII 码发送到 `STM32F4xx` 板上。当 `USART2` 接收到字符时，中断处理函数会闪烁\
  \ LED。\n\n### 程序 6-3：使用 `USART2` 中断\n\n```c\n /* p6_3.c UART on USART2 Receive at\
  \ 115200 Baud\n*\n* 接收来自主机 PC 终端模拟器 (Tera Term) 的按键\n*  true Nucleo-F446RE 板上的 USART2\
  \ UART, \n * 并使用按键值闪烁 LED。\n* 与 p4_2 程序相同，但由中断驱动。\n*\n* 默认情况下下，时钟运行频率为 16 MHz。\n\
  * UART 配置为 115200 波特率。\n* PA3 - USART2 RX (AF7)\n*\n* 此程序已使用 Keil uVision v5.24a\
  \ 和 DFP v2.11.0 通过测试。 */\n\n#include \"stm32F4xx.h\"\n\nvoid USART2_init(void);\
  \ \nvoid LED_blink(int value); \nvoid delayMs(int);\n\n/*---------------------------------------------------------------------------MAIN\
  \ function\n*----------------------------------------------------------------------------*/\n\
  int main (void) {\n    __disable_irq(); /* 全局禁用中断 */\n    RCC->AHB1ENR |= 1; /*\
  \ 开启 GPIOA 时钟 */ \n    GPIOA->MODER &= ~0x00000C00; /* 清除引脚模式 */ \n    GPIOA->MODER\
  \ |= 0x00000400; /* 设置引脚为输出模式 */\n    USART2_init(); /* 初始化 USART2 */\n    USART2->CR1\
  \ |= 0x0020; /* 开启 Rx 中断 */ \n    NVIC_EnableIRQ(USART2_IRQn); /* 在 NVIC 中启用中断 */\
  \ \n    __enable_irq(); /* 全局启用中断 */\n    while(1) { /* 无限循环 */ }\n}\n\n/*---------------------------------------------------------------------------Initialize\
  \ UART pins, Baudrate\n*----------------------------------------------------------------------------*/\n\
  void USART2_init (void) {\n    RCC->AHB1ENR |= 1; /* 开启 GPIOA 时钟 */\n    RCC->APB1ENR\
  \ |= 0x20000; /* 开启 USART2 时钟 */\n    GPIOA->MODER |= 0x0080; /* 为 PA3 复用功能 */\n\
  \    /* 配置 PA2 为 USART2 TX */\n    GPIOA->AFR[0] &= ~0xF000;\n    GPIOA->AFR[0]\
  \ |= 0x7000; /* USART2 使用 alt7 */ \n    GPIOA->MODER &= ~0x00C0;\n    USART2->BRR\
  \ = 0x008B; /* 16 MHz @ 115200 波特率 */ \n    USART2->CR1 = 0x0004; /* 开启 Rx, 8 位数据\
  \ */ \n    USART2->CR2 = 0x0000; /* 1 个停止位 */ \n    USART2->CR3 = 0x0000; /* 无流控\
  \ */ \n    USART2->CR1 |= 0x2000; /* 开启 USART2 */\n}\n\nvoid USART2_IRQHandler(void)\
  \ {\n    char c;\n    if (USART2->SR & 0x0020) {\n        c = USART2->DR; /* 从 USART2\
  \ 读取一个字符 */ \n        LED_blink(c); /* 闪烁 LED */\n    }\n}\n\n/* 根据值开启或关闭 LED */\n\
  void LED_blink(int value) {\n    value %= 16; /* 将最大计数限制在 15 */\n    for (; value\
  \ > 0; value--) {\n        GPIOA->BSRR = 0x00000020; /* 开启 LED */ \n        delayMs(200);\n\
  \        GPIOA->BSRR = 0x00200000; /* 关闭 LED */ \n        delayMs(200);\n    }\n\
  \    delayMs(800);\n}\n\nvoid delayMs(int n) {\n    int i;\n    for (; n > 0; n--)\
  \ \n        for (i = 0; i < 2000; i++) ; \n}\n```\n\n### 用于发送数据的 USART2 中断编程\n\n\
  此外，注意在程序 6-3 中，接收器和发送器只有一个中断。如果我们想实现发送器和接收器中断，还必须在 `USARTx_CR1` 寄存器中开启 `TXEIE`（TXE\
  \ 中断允许）位。这样，每当 `USART_SR` 寄存器中的 `TXE=1` 时，就会产生一个 USART 中断。我们还可以在 `USARTx_CR1` 寄存器中使用\
  \ `TCIE`（传输完成中断允许），然后每当 `USART_SR` 寄存器中的 `TC=1` 时，就会产生一个 USART 中断。在中断处理函数中，我们必须轮询检查中断源。\n\
  \n使用中断发送数据比接收数据更复杂。程序需要创建一个先进先出的缓冲区来存储要发送的字符。字符发送后，`TXE` 或 `TC` 标志位会被设置并触发中断。在中断处理函数中，处理\
  \ USART2 中的数据。\n\n**复习题**\n\n1. 程序 6-3 中接收器和发送器只有一个中断吗？\n2. 如果我们要实现发送器和接收器中断，是否也必须在\
  \ `USARTx_CR1` 寄存器中开启 `TXEIE` 位？\n3. 这种方式，每当 `USART_SR` 寄存器中的 `TXE=1` 时，就会产生一个 USART\
  \ 中断吗？\n\n\n\n\n2. 使用 `Systick` 的哪个寄存器来启用与 SysTick 相关的中断。\n\n3. 对或错。我们在 `NVIC` 寄存器中使用\
  \ `ISER` 来启用 SysTick 中断。\n\n## 第 6.6 节：定时器中断编程\n\n在第 5 章中，我们展示了如何编写定时器。在那些编程示例中，我们使用轮询来检查定时器计数器是否发生了更新。在本节中，我们将给出该程序的基于中断的版本。\n\
  \n#### 定时器计数更新中断\n\n检查第 5 章第 5.3 节的程序。在这些程序中，无限循环内部不断轮询中断标志位，直到标志位被置。与此同时，程序没有做任何有用的工作。在本节中，我们将使用定时器中断来通知程序定时器计数器的更新发生。与此同时，程序可以执行其他有用任务。为了实现这一点，我们使用\
  \ `TIMx` DMA/中断允许寄存器 (`TIMx_DIER`）。在中断允许寄存器中，将 `UIE`（更新中断允许）设置为 1，以便在定时器计数器更新时触发中断。从表\
  \ 6-7 可以看到 `IRQ28` 被分配给 `TIM2` 中断。`IRQ28` (`TIM2` 全局中断）位于地址为 `0x0000 00B0` 的向量表。\n\
  \n![](img/image00317.jpeg)\n\nBit 0 `UIE`: 更新中断允许\n\n0: 更新中断禁用\n\n1: 更新中断允许\n\n\
  图 6-17：`TIMx` DMA/中断允许寄存器 (`TIMx_DIER`) 用于启用定时器中断。程序 6-5 由轮询程序 5-4 修改而来。定时器中断已启用，且\
  \ LED 在中断处理程序中闪烁。\n\n程序 6-5：使用定时器 2 重载中断翻转 LED\n\n```c\n /* p6_5.c Timer TIM2 中断\n\
  \n*\n* 定时器 TIM2 配置为向上计数器。默认情况下，系统时钟\n* 以 16 MHz 运行。分频器设置为除以 16000，给计数器提供\n * 1 kHz\
  \ 的时钟。计数器自动重载值设置为 999。当\n * 计数器计数到 999 时，它会将计数器更新为零并设置\n * 更新中断标志 (UIF)。TIM2->DIER\
  \ 的 UIE 位被设置，以便\n * UIF 触发定时器中断。中断频率为 1 Hz。\n * 在定时器中断处理程序中，绿色 LED (PA5) 被翻转\n*\
  \ 并清空了 UIF。\n*\n* 此程序在 Keil uVision v5.24a 配合 DFP v2.11.0 通过了测试 */\n\n#include \"\
  stm32f4xx.h\"\n\nvoid delayMs(int n);\n\nint main(void) {\n    __disable_irq();\
  \ /* 全局禁用中断 */ RCC->AHB1ENR |= 1; /* 启用 GPIOA 时钟 */\n    GPIOA->MODER &= ~0x00000C00;\
  \ GPIOA->MODER |= 0x00000400;\n    /* 设置 TIM2 */\n    RCC->APB1ENR |= 1; /* 启用 TIM2\
  \ 时钟 */ TIM2->PSC = 16000 - 1; /* 除以 16000 */ TIM2->ARR = 1000 - 1; /* 除以 1000 */\
  \ TIM2->CR1 = 1; /* 启用计数器 */\n    TIM2->DIER |= 1; /* 启用 UIE */\n    NVIC_EnableIRQ(TIM2_IRQn);\
  \ /* 在 NVIC 中启用中断 */\n    __enable_irq(); /* 全局启用中断 */\n    while(1) { }\n}\n\n\
  void TIM2_IRQHandler(void) {\n    TIM2->SR = 0; /* 清空 UIF */ GPIOA->ODR ^= 0x20;\
  \ /* 翻转 LED */\n}\n```\n\n#### 定时器输出比较中断\n\n回顾第 5 章，在输出比较操作运行时，当计数器值匹配 `CCRx` 寄存器的内容时，关联引脚的输出可以配置多种不同的方式。在这里，除了输出变化外，我们将触发中断。在中断处理程序中，向\
  \ `CCRx` 寄存器增加一个值，这样输出比较匹配将在所加值决定的时钟周期后发生。\n\n例如，当 `CCR1` 寄存器包含 750 时，当计数器计数到 750\
  \ 时发生通道 1 的输出比较匹配。如果向 `CCR1` 增加 345，`CCR1` 将变为 1095。下一次输出比较匹配发生在计数器达到 1095 时，恰好是上次输出比较匹配后的\
  \ 345 个时钟周期。在下面的程序 6-6 中，输出比较被设置为翻转输出，且输出连接到 LED。在中断处理程序中，向 `CCR1` 增加 1000。时间时钟配置为以\
  \ 1 kHz 运行（带有 16 MHz 系统时钟和分频器除以 16,000）。输出比较每秒发生一次。\n\n我们向 `CCR1` 加上了常量 1000 以产生方波输出。在其他应用程序中，您可能会添加一系列不同的时间间隔以产生不同的波形输出。\n\
  \n程序 6-6：使用两个定时器中断翻转黄色 LED\n\n```c\n /* p6_6.c Timer TIM2 中断\n\n*\n* 定时器 TIM2 配置为向上计数器。默认情况下，系统时钟\n\
  * 以 16 MHz 运行。分频器设置为除以 16000，给计数器提供\n * 1 kHz 的时钟。计数器自动重载值设置为 999。当\n* 计数器计数到 999\
  \ 时，它会将计数器更新为零并设置\n* 更新中断标志 (UIF)。TIM2->DIER 的 UIE 位被设置，以便\n* UIF 触发定时器中断。中断频率为\
  \ 1 Hz。\n* 在定时器中断处理程序中，绿色 LED (PA5) 被翻转\n* 并清空了 UIF。\n*\n* 此程序在 Keil uVision v5.24a\
  \ 配合 DFP v2.11.0 通过了测试 */\n```\n\n复习题\n\n1. 对于 STM32Fxx 芯片，哪个 IRQ 被分配给 TIM2？\n2.\
  \ 对或错。TIM2 和 TIM3 只有一个中断。\n3. 我们使用 TIM2 中的 寄存器来启用与 TIM2 相关的中断。\n4. 对或错。复位后，TIM2\
  \ 中断已启用并就绪。\n\n### 第 6.7 节：STM32 中的中断优先级编程\n\n中断的实现因厂商而异。虽然 Arm 标准化了前 15 个中断（INT1\
  \ 到 INT15），Arm 许可方可以自由实现 INT16 到 INT255 的外设中断（IRQ）。前三个中断是复位、NMI 和硬错误。对于这三个中断，复位具有最高优先级（优先级数字为\
  \ -3），其次是 NMI（优先级为 -2），最后是硬错误（优先级为 -1）。在 Arm 中，数值越小优先级越高。中断 11、14 和 15 的优先级由系统控制器中的系统句处理器优先级寄存器\
  \ 2 和 3 控制。我们在第 6.5 节中讨论过 SysTick（INT15）的优先级设置。在本节中，我们处理 INT16 (IRQ0) 到 INT56 (IRQ40)\
  \ 外设中断的优先级。我们必须注意 IRQ#，因为它用于索引 NVIC 中的寄存器以更改中断优先级。\n\n当多个中断挂起时，优先级最高的中断会被优先。当一个中断处理程序运行时，另一个更高优先级的中断将中断当前的中断处理程序并启动自己的中断处理程序（嵌套中断）。\n\
  \n**IPR 寄存器与中断优先级**\n\n\n\n\nIRQ 的优先级在 NVIC 的一个中断优先级寄存器（`IPRx`）中分配。如果不为 IRQ 分配优先级，默认情况下，它的优先级为\
  \ 0，这是 IRQ 的最高优先级。每个 IRQ 使用一个中断优先级寄存器中的一个字节。因此，每个中断优先级寄存器持有四个 IRQ 的优先级。例如，`IPR0`（IPR\
  \ 零）寄存器持有 `IRQ3`、`IRQ2`、`IRQ1` 和 `IRQ0` 的优先级。同样，`IRQ7`、`IRQ6`、`IRQ5` 和 `IRQ4` 的优先级分配在\
  \ `IPR1` 寄存器中。对于 240 个 IRQ，共使用了 60 个中断优先级寄存器。STM32F4 Arm 设备仅使用中断优先级寄存器字节中的四个最高位。使用四位可以有\
  \ 16 种不同的优先级，从 0 到 15。数字越小，优先级越高。\n\n![](img/image00318.jpeg) **图 6-18：IPRn 寄存器**\n\
  \n请注意，`IPRn` 和 `IRQ#` 的分配存在规律。它遵循以下公式：\n\n`IPR`n `IRQ(4n+3)`, `IRQ(4n+2)`, `IRQ(4n+1)`,\
  \ 和 `IRQ(4n)`\n\n要找到 `IPR` 数字，只需将 `IRQ` 编号除以 4，余数将决定它位于寄存器中的哪个字节。因为只有最高四位被用于优先级，因此在加载到相应的字节之前，需要将优先级数字乘以\
  \ 16（或左移 4 位）。例如，对于优先级 2，应该加载值 32。为了方便计算并找到正确寄存器中的正确位（bits）以为优先级设置正确的优先级值，`NVIC_IPRx`\
  \ 寄存器在 `core_cm4.h` 中被定义为 8 位寄存器数组 `IP[x]`。这样，`IRQx` 的优先级就由 `IP[x]` 控制。\n\n例如，如果我们想将\
  \ `TIM2` 中断优先级设置为 3，首先需要找到 `TIM2` 中断的 IRQ 编号，即 `IRQ28`。然后 C 语句简单为：\n\n```\nNVIC->IP[28]\
  \ = 3 << 4;\n```\n\n`core_cm4.h` 中还定义了一个函数 `NVIC_SetPriority(IRQ#)` 用于设置 NVIC 中\
  \ IRQ 的优先级。将 `TIM2` 的优先级设置为 3：\n\n```c\nNVIC_SetPriority(TIM2_IRQn, 3);\n```\n\n\
  `TIM2_IRQn` 定义在 `stm32f446xx.h` 中。\n\n程序 6-7 展示了两个具有不同优先级的中断。在这个例中，在中断处理程序中调用了 `delay`\
  \ 函数，以演示高优先级中断的抢占。（在现实世界，在中断处理程序中调用 `delay` 函数是一个坏习惯。）`TIM3` 设置为大约每 1 秒中断一次。在中断处理程序中，引脚\
  \ `PB3` 开启 500 ms。`TIM4` 设置为大约每 100 ms 间隔中断一次，在它的中断处理程序中，引脚 `PB4` 和 LED 开启 25 ms。两个中断的频率故意稍微偏离\
  \ 10 的倍数，这样两个中断的相位关系就会发生变化，可以使用示波器观察它们的交互。由于 `TIM3` 具有更高的优先级，你会观察到当 `TIM3` 中断处理程序运行时，LED\
  \ 不闪烁（每秒一次，持续半秒）。现在，通过更改以下行将 `TIM4` 的优先级设置为比 `TIM3` 高：\n\n```c\n#define PRIO_TIM3\
  \ 3\n#define PRIO_TIM4 4\n```\n\n改为\n\n```c\n#define PRIO_TIM3 4\n#define PRIO_TIM4\
  \ 3\n```\n\n你会发现即使在 `TIM3` 中断处理程序运行时，LED 一直在闪烁。\n\n`TIM3` 中断处理程序被 `TIM4` 中断抢占。如果你有示波器，连接\
  \ `PB3` 和 `PB4` 将给你更清晰的视图。\n\n程序 6-7：中断优先级演示\n\n```c\n/* p6_7.c 演示嵌套中断\n*\n* TIM3\
  \ 设置为大约 1 Hz 中断。在中断处理程序中，\n* PB3 被开启并调用了 500 ms 的延迟函数。* PB3 在延迟结束后关闭。\n*\n* TIM4\
  \ 设置为大约 10 Hz 中断。在中断处理程序中，\n* PB4 和 LED0 被开启并调用了 25 ms 的延迟函数。* PB4 和 LED0 在延迟结束后关闭。\n\
  *\n* 当 TIM3 具有较高优先级（如此代码所示），TIM4\n* 中断被 TIM3 中断处理程序阻塞，LED 停止\n* 周期性闪烁。你可以通过 PB3\
  \ 和 PB4 上的示波器\n* 更好地看到它们的相互作用。\n*\n* 当 TIM4 具有较高优先级（你需要在 #define 语句处切换\n* 两个定时器的优先级），TIM3\
  \ 中断处理程序会被\n* TIM4 中断抢占，LED 一直在闪烁。*\n** 此程序已使用 Keil uVision v5.24a 配合 DFP v2.11.0\
  \ 经过测试 */\n\n#include \"stm32f4xx.h\"\n\nvoid delayMs(int n);\n\n/* TIM3 和 TTIM4\
  \ 的优先级应该在 0 到 15 之间 */\n#define PRIO_TIM3 3\n#define PRIO_TIM4 4\n\nint main (void)\
  \ {\n    // ... code content ...\n}\n```\n\n\n\n\n世界上大多数事物都是模拟的，但计算机是数字的。为了让计算机与周围世界交互，需要一个模拟数字转换器（`ADC`）和一个数字模拟转换器（`DAC`）。本章将探索\
  \ `ADC`、`DAC` 以及传感器，以及如何将 `STM Arm` 连接到这些设备。在 7.1 节中，我们将描述模拟数字转换器。在 7.2 节中，我们将为\
  \ `STM32 Arm` 芯片的 `ADC` 模块。在 7.3 节中，我们将展示传感器的接口并讨论信号调理的问题。7.4 节将讨论 `DAC` 芯片特性和编程。\n\
  \n## 7.1 节：ADC 特性\n\n本节将泛介绍 `ADC`。首先，我们描述 `ADC` 本身的一些通用方面，然后关注 `ADC` 中一些重要信号的功能。\n\
  \n### ADC 设备\n\n模拟数字转换器对于数据采集至关重要。数字计算机使用二进制（离散）值，但在物理世界中，一切都是模拟的（连续的）。温度、压力、湿度和速度是我们每天处理的物理量的几个例子。物理量通过称为\
  \ `transducer`（换能器）的设备转换为电信号（电压、电流）。用于产生电输出的换能器也被称为 `sensors`（传感器）。温度、速度、压力、光等许多其他物理量的传感器输出电压（或电流）。因此，我们需要一个模拟数字转换器将模拟信号转换为数字，以便微控制器可以读取和处理这些数字。参见图\
  \ 7-1 和图 7-2。\n\n![](img/image00319.jpeg)**图 7-1：通过 ADC 连接微控制器到传感器**\n\n![](img/image00320.jpeg)**图\
  \ 7-2：8 位 ADC 框图\n\n### ADC 的一些主要特性\n\n#### 分辨率\n\n`ADC` 具有 `n` 位分辨率，其中 `n` 可以是\
  \ 8、10、12、16 甚至 24 位。高分辨率的 `ADCs` 提供更小的步长，`step size` 是 `ADC` 能够识别的最小变化。表 7-1 显示了一些常用的\
  \ `ADC` 分辨率及其步长。虽然 `ADC` 的分辨率在设计时就已经决定了且无法更改，但我们可以借助所谓的 `V[ref]` 来控制步长。这将在下文中讨论。\n\
  \n| n 位 | 阶梯数 | 步长 |\n| :--- | :--- | :--- |\n| 8 | 256 | 5V /256 = 19.53 mV |\n\
  | 10 | 1,024 | 5V /1,024 = 4.88 mV |\n| 12 | 4,096 | 5V /4,096 = 1.22 mV |\n| 16\
  \ | 65,536 | 5V /65,536 = 0.0763 mV |\n\n***注：V[ref]= 5V***\n\n表 7-1：ADC 分辨率与步长的关系\
  \ (Vref = 5V)**\n\n#### Vref\n\n`Vref` 是用于转换器参考输入的电压。连接到此引脚的电压结合 `ADC` 芯片的分辨率决定了步长。对于\
  \ 8 位 `ADC`，步长为 `Vref / 256`，因为它是 8 位 `ADC`，2 的 8 次方得到 256 。参见表 7-1。例如，如果模拟输入范围需要为\
  \ 0 到 4 伏，则 `Vref` 连接到 4 伏。这使得 8 位 `ADC` 的步长为 4 V / 256 = 15.62 mV。另一种情况下，如果我们需要\
  \ 8 位 `ADC` 的 10 mV 步长，那么 `V[ref] = 2.56 V`，因为 `2.56 V / 256 = 10 mV`。对于 10 位 `ADC`，如果\
  \ `V[ref] = 5V`，则步长如表 7-1 所示为 4.88 mV。表 7-2 和 7-3 分别显示了 8 位和 10 位 `ADC` `V[ref]`\
  \ 与步长之间的关系。在某些应用中，我们需要差分参考电压，其中 `V[ref] = V[ref(+)]– V[ref(–)]`。如果不需要差分参考，则 `V[ref(–)]`\
  \ 引脚接地，`V[ref(+)]` 引脚用作 `V[ref]`。通常可以使用常用的电压参考设备。\n\n| Vref (V) | V[in] 范围 (V) |\
  \ 步长 (mV) |\n| :--- | :--- | :--- |\n| 5.00 | 0 to 5 | 5 / 256 = 19.53 |\n| 4.00\
  \ | 0 to 4 | 4 / 256 = 15.62 |\n| 3.00 | 0 to 3 | 3 / 256 = 11.71 |\n| 2.56 | 0\
  \ to 3 | 2.56 / 256 = 10 |\n| 2.00 | 0 to 2 | 2 / 256 = 7.81 |\n| 1.28 | 0 to 1\
  \ | 1.28 / 256 = 5 |\n| 1.00 | 0 to 1 | 1 / 256 = 3 |\n\n***注：8 位 ADC 的 Vref/256]***\n\
  \n| Vref (V) | V[in] 范围 (V) | 步长 (mV) |\n| :--- | :--- | :--- |\n| 5.00 | 0 to 5\
  \ | 5 / 256 = 19.53 |\n| 4.00 | 0 to 4 | 4 / 256 = 15.62 |\n| 3.00 | 0 to 3 | 3\
  \ / 256 = 11.71 |\n| 2.56 | 0 to 3 | 2.56 / 256 = 10 |\n| 2.00 | 0 to 2 | 2 / 256\
  \ = 7.81 |\n| 1.28 | 0 to 1 | 1.28 / 256 = 5 |\n| 1.00 | 0 to 1 | 1 / 256 = 3 |\n\
  \n表 7-2：8 位 ADC 的 Vref 范围**\n\n#### 转换时间\n\n除了分辨率，转换时间是 `ADC` 的另一个因素。*转换时间*定义为 `ADC`\
  \ 将模拟输入转换为数字的时间。通常，分辨率越高，转换时间越长。\n\n#### 数字输出\n\n在 8 位 `ADC` 中，数字输出为 D0–D7，而在 10\
  \ 位 `ADC` 中输出为 D0–D9。为了计算输出，我们使用公式：\n\n`D[out] = V[in] / StepSize`\n\n其中 `D[out]`\
  \ 是数字输出，`V[in]` 是模拟输入。图 7-3 显示了一个简单的 2 位 `ADC`。在电路中，步长为 `(Vref(+)] - Vref(-)]) /\
  \ 4`，因为电阻具有相同的值。![](img/image00321.jpeg)**图 7-3：同步 2 位 ADC**\n\n如果 `V[in]` 低于步长，所有比较器都输出零。当\
  \ `V[in]` 在一个步长和步长 × 2 之间时，最低的比较器输出 1，编码器给出 01。当 `V[in]` 在步长 × 2 和步长 × 3 之间时，第二个比较器和第一个比较器输出\
  \ 1。由于编码器是优先级编码器，当多个输入为高时，它输出最大值。因此，将输出 2（二进制为 10）。当 `V[in]` 大于步长 × 3 时，第三个比较器变为高并输出\
  \ 3。\n\n参见示例 7-1。这些数据通过逐位（串行）或一次一组（使用并行输出线）从 `ADC` 芯片输出。下一步讨论。\n\n**示例 7-1**\n\n\
  对于给定的 8 位 `ADC`（例如 ADC0848），我们有 `V[ref] = 2.56 V`。如果模拟输入为（a）1.7 V 和（b）2.1 V，请计算\
  \ D0–D7 输出。\n\n**解答：**\n\n由于步长为 2.56/256 = 10 mV，我们得到：\n\n(a)D[out] = 1.7V/10 mV\
  \ = 170（十进制），对应的 D7–D0 二进制为 10101011。(b)D[out] = 2.1V/10 mV = 210（十进制），对应的 D7–D0\
  \ 二进制为 11010010。\n\n***并行与串行 ADC***\n\n\n\n\nADC 芯片分为并行和串行两种类型。在并行 ADC 中，我们有 8 个或更多专用引脚用于输出二进制数据，但在串行\
  \ ADC 中，我们只有一个引脚用于数据输出。8 位 ADC 的 `D0–D7` 数据引脚在 ADC 芯片和 CPU 之间提供了一个 8 位的并行数据路径。对于\
  \ 16 位并行 ADC 芯片，我们需要 16 个引脚用于数据路径。为了节省引脚，许多 12 位和 16 位 ADC 使用 `D0–D7` 引脚来发送二进制数据的高位字节和低位字节。近年来，对于许多对空间要求关键的场合，使用如此大量的引脚来传输数据是不可行的。因此，像串行\
  \ ADC 这样的串行设备非常常见。虽然串行 ADC 使用的引脚较少且其较小的封装占据电路板空间更小，但需要更多的 CPU 时间从 ADC 获取转换后的数据，因为\
  \ CPU 必须一次一个位地获取数据，而不是像并行 ADC 那样通过单次读取操作完成。串行外接口 (`SPI`) 模块设计用于时钟输入数据，这样 CPU 就不需要花费时间直接用于数据数据。我们将在第\
  \ 8 章介绍 SPI。`ADC0848` 是一个具有 8 个数据输出引脚的并行 ADC 示例，而 `MAX1112` 是具有单引脚 `D[out]` 的串行\
  \ ADC 示例。图 7-4 和 7-5 分别显示 `ADC0848` 和 `MAX1112` 的框图。\n\n![](img/image00322.jpeg)\
  \ **图 7-4：ADC0848 并行 ADC 框图**\n\n![](img/image00323.jpeg) **图 7-5：MAX1112 串行 ADC\
  \ 框图**\n\n### 模拟输入通道\n\n许多数据采集应用需要多个模拟输入。因此，我们在单个芯片上可以看到具有 2、4、8 甚至 16 通道的的 ADC\
  \ 芯片。与其使用多个 ADC，通常使用模拟输入复用，如 `ADC848` 和 `MAX1112` 所示。在这些芯片中，我们有 8 通道模拟输入，允许我们监控温度、压力、流量等多个量。`SAMD2x`\
  \ 设备为片上 ADC 提供多达 20 个单端输入模拟通道。\n\n### 转换开始和转换结束信号\n\n为了由 CPU 控制转换，需要转换开始 (`SC`)\
  \ 和转换结束 (`EOC`) 信号。当 `SC` 被激活时，ADC 开始将模拟输入值 `V[in]` 转换为数字量。转换所需的时间取决于转换方法、时钟频率和分辨率。当数据转换完成时，转换结束信号通知\
  \ CPU 转换后的数据已就绪，可以读取。\n\n### 逐逼近 ADC\n\n逐逼近是一种广泛使用的将模拟输入转换为数字输出的方法。它包含三个主要部分：(a)\
  \ 逐逼近寄存器 (`SAR`)、(b) 比较器和 (c) 控制单元。见下图。\n\n![](img/image00324.jpeg) **图 7-6：逐逼近\
  \ ADC**\n\n逐逼近寄存器在开始时仅加载最高位。内部的数模拟转换器将 `SAR` 的值转换为模拟电压，并将其与输入电压进行比较。如果输入电压较高，则保留该位；如果电压较低，则清除该位。尝试下一位，并执行\
  \ `DAC` 和比较。此过程对 `SAR` 的所有位重复进行。假设步长为 10 mV，8 位逐逼近 ADC 将通过以下步骤转换 1 伏特的输入：\n\n(1)\
  \ 它从二进制数 `10000000` 开始。由于 `128 × 10 mV = 1.28 V` 大于 1 V 输入，因此位 7 被清除（丢弃）。\n\n(2)\
  \ `01000000` 为我们得到 `64 × 10 mV = 640 mV`，由于位 6 小于 1 V 输入，因此保留位 6。(3) `01100000`\
  \ 为我们得到 `96 × 10 mV = 960 mV`，由于位 5 小于 1 V 输入，因此保留位 5，(4) `01110000` 为我们得到 `112\
  \ × 10 mV = 1120 mV`，由于位 4 大于 1 V 输入，因此丢弃位 4。(5) `01101000` 为我们得到 `108 × 10 mV =\
  \ 1080 mV`，由于位 3 大于 1 V 输入，因此丢弃位 3。(6) `01100100` 为我们得到 `100× 10 mV = 1000 mV =\
  \ 1 V`，由于位 2 等于输入，因此保留位 2。即使找到了答案，它也不会停止。\n\n(7) `011000110`（注：此处原文可能为笔误）为我们得到 `102\
  \ × 10 mV = 1020 mV`，由于位 1 大于 1 V 输入，因此丢弃位 1。(8) `01100101` 为我们得到 `101 × 10 mV =\
  \ 1010 mV`（注：原文计算略有误，此处按原文翻译），由于位 0 小于 1 V 输入，因此保留位 0。通过 `01100100` 得到 `1 V`。\n\n\
  ### 复习题\n\n1. 影响 ADC 的两个因素是。\n2. `ADC048` 是 ( ) 位 ADC。\n3. 对或错：MAX1112` 具有 ( ) 个引脚用于数据输出。\n\
  4. 当 `Vref = 1V` 时，计算。\n5. 逐逼近是一种 ( ) 方法。\n\n\n\n`ADC` 的转换时间分为两部分：采样输入信号的时间和转换的时间。当输入信号在转换过程中变化时，大多数\
  \ `ADC` 无法正常工作。因此，在输入信号和转换器之间增加采样保持电路。输入信号被采样并保持在电容中。在转换期间，输入端与保持电容断开，这样输入信号的波动就不会影响转换器的输入。在采样阶段，输入信号正在为保持电容充电。采样时间越长，保持电压就越接近输入信号。但采样时间越长也会降低转换率。如果输入来自单通道且采样率很高，连续样本的电压非常接近，较短的采样时间即可。另一方面，如果交替采样两个或多个不同的输入信号，则需要延长采样时间以减少输入通道之间的串扰。\n\
  \n采样时间的周期数可以通过 `ADC_SMPRx`（采样时间寄存器）进行编程。我们有两个 `ADC_SMPRx` 寄存器覆盖所有的 18 个 `ADC` 通道。`ADC_SMPR2`\
  \ 用于通道 0 到 9，`ADC_SMPR1` 用于通道 10 到 18。采样时间长度可以从 3 个时钟（重位后默认）到 480 个时钟。见图 7-9A 和\
  \ 7-9B。\n\n![](img/image00327.jpeg)\n\n000: 3 cycles 100: 84 cycles\n\n001: 15 cycles\
  \ 101: 112 cycles\n\n010: 28 cycles 110: 144 cycles\n\n011: 56 cycles 111: 480 cycles\n\
  \n**图 7-9A: 用于设置采样时间的 采样时间寄存器 (ADC_SMPR1)**\n\n![](img/image00328.jpeg)\n\n000:\
  \ 3 cycles 100: 84 cycles\n\n001: 15 cycles 101: 112 cycles\n\n010: 28 cycles 110:\
  \ 144 cycles\n\n011: 56 cycles 111: 480 cycles\n\n**图 7-9B: 用于设置采样时间的 采样时间寄存器 (ADC_SMPR2)**\
  \ 在转换阶段，模拟输入被转换为二进制数。在此阶段，所需的时钟数取决于 `ADC` 分辨率，即二进制输出的位数（6、8、10 或 12 位）。对于 `STM32F4xx`\
  \ 芯片中的逐次逼近转换器，时间与位数成正比。例如，如果我们使用 8 位 `ADC` 分辨率且采样时间默认为 3 个时钟，那么 `ADC` 转换所需的总时钟数为\
  \ 11 个时钟。\n\n### 选择位分辨率\n\n我们使用 `ADC_CR1` 寄存器的 `RES` 位（`D25-D24`）来选择 6、8、10 或 12\
  \ 位 `ADC` 分辨率。默认 12 位。见图 7-10 和表 7-5。\n\n![](img/image00329.jpeg)\n\n位 26 **OVRIE:**\
  \ 溢出中断允许\n\n此位由软件设置和清除，以启用/禁用溢出中断。0: 禁用溢出中断\n\n1: 启用溢出中断。当 `OVR` 位置位时，将产生中断。位 25:24\
  \ **RES[1:0]:** 分辨率\n\n这些位由软件写入以选择转换的分率。00: 12 位（至少 15 个 `ADCCLK` 周期）\n\n01: 10\
  \ 位（至少 13 个 `ADCCLK` 周期）\n\n10: 8 位（至少 11 个 `ADCCLK` 周期）\n\n11: 6 位（至少 9 个 `ADCCLK`\
  \ 周期）\n\n位 23 **AWDEN:** 通用通道模拟监控狗允许\n\n此位由软件设置和清除。\n\n0: 通用通道禁用模拟监控狗\n\n1: 通用通道启用模拟监控狗\n\
  \n位 5 **EOCIE:** EOC 中断允许\n\n此位由软件设置和清除，以启用/禁用转换完成中断。0: 禁用 EOC 中断\n\n1: 启用 EOC 中断。当\
  \ `EOC` 位置位时，将产生中断。位 4:0 **AWDCH[4:0]:** 模拟监控狗通道选择位\n\n这些位由软件设置和清除。它们选择受模拟监控狗保护的输入通道。\n\
  \n注意：00000: ADC 模拟输入通道 0\n\n00001: ADC 模拟输入通道 1\n\n...\n\n01111: ADC 模拟输入通道 15\n\
  \n10000: ADC 模拟输入通道 16\n\n10001: ADC 模拟输入通道 17\n\n10010: ADC 模拟输入通道 18\n\n其他值预留\n\
  \n**图 7-10: 控制 1 (ADC_CR1) 寄存器（未显示所有位）**\n\nRES (位 25-24) 描述\n\n0x0 12 位结果\n\n0x1\
  \ 10 位结果\n\n0x2 8 位结果\n\n0x3 6 位结果\n\n**表 7-5: ADC_CR1 寄存器中的 ADC 位分辨率选择**\n\n###\
  \ 选择输入通道\n\n`STM32F4xx` Arm 芯片支持最多 18 个 `ADC` 通道。可以通过 `ADC_CR1` 寄存器中的 `AWDCH` 位配置通道，以选择受模拟监控狗保护的输入通道。\n\
  \n\n\n\nADC 在复位时处于“关闭”状态。`ADC_CR2` 寄存器的 `D0` 位用于开启 ADC 模块。参见图 7-14。\n\n![](img/image00332.jpeg)\n\
  \n### 位 11 `ALIGN`: 数据对齐\n\n此位由软件设置和清除。请参考 `Figure 75` 和 `Figure 76`。\n0: 右对齐\n\n\
  1: 左对齐\n\n### 位 10 `EOCS`: 转换结束选择\n\n此位由软件设置和清除。\n0: 在每组常规转换结束时，设置 `EOC` 位。仅当 `DMA=1`\
  \ 时，才开启溢出检测。\n1: 在每次常规转换结束时，都设置 `EOC` 位。开启溢出检测。\n\n### 位 1 `CONT`: 连续转换\n\n此位由软件设置和清除。如果该位被设置，转换将持续进行，直到其被清除。\n\
  0: 单次转换模式\n1: 连续转换模式\n\n### 位 0 `ADON`: A/D 转换器开启 / 关闭\n\n此位由软件设置和清除。\n注意：0: 禁用\
  \ ADC 转换并进入掉电模式\n1: 启用 ADC\n\n**图 7-14: `ADC_CR2` (ADC 控制 2) 寄存器启动转换触发选项**\n\nSTM32F4xx\
  \ 有两种启动 A/D 转换的方法：手动触发和自动触发。手动触发通过向 `ADC_CR1` 寄存器中的 `SWSTART`（常规通道启动转换）写入 `1` 来完成。ADC\
  \ 也可以由事件自动触发。使用定时器事件来触发转换可以获得更精确的采样间隔。\n\n通过设置 `ADC_CR1` 寄存器中的 `CONT`（连续转换）位可以使用自由运行模式。此位由软件设置和清除。如果该位被设置，则输入通道将进行连续转换。不需要触发器启动转换，它将在上一次转换结束时自动开始。\n\
  \n#### 转换完成（转换结束，EOC）\n\n转换结束（`EOC`）由 `ADC_SR`（ADC 状态寄存器）中的 `EOC` 标志位指示。此位由 ADC\
  \ 自身在每个通道转换结束时设置。它由软件清除或通过读取 `ADC_DR`（ADC 数据寄存器）清除。参见 `Figure 7-15` 和 `Table 7-8`。\n\
  \n![](img/image00333.jpeg)**图 7-15: 用于转换结束的 `ADC_SR` (ADC 状态)寄存器（见下表）**\n\n#####\
  \ 位域描述\n\n5 `OVR` 溢出：当数据丢失时，硬件会设置此位。如果我们没有从数据寄存器（`ADC_DR`）读取上一次转换的结果，就会发生这种情况。它由软件清除。\n\
  0: 无溢出\n1: 已发生溢出\n\n1 `EOC` 转换结束：\n0: 转换未完成\n1: 转换完成\n\n向此位写入零或通过读取 `ADC_DR` 寄存器将其清除。**表\
  \ 7-8: `ADC_SR`（状态）寄存器位**\n\n转换完成后，`EOC`标志位变为高电，表示转换数据结果寄存器加载了新值。通过轮询此标志位，我们可以知道转换是否完成，并读取\
  \ `DATA` 寄存器中的值。当读取 `ADC_DR`（ADC 数据寄存器）中的结果时，该标志位会被清除（变为低）。在本节中，我们使用轮询查看转换结果是否就绪。我们也可以使用中断来通知转换已完成。可以使用\
  \ `ADC_CR1` 寄存器中的 `EOCIE`（EOC 中断允许）位来启用中断选项。默认未启用中断选项，因为在启用中断之前需要一个中断处理程序。\n\n为了避免在启用多次转换时丢失数据，必须在转换结果可用时立即读取（`ADC_SR`\
  \ 寄存器中设置 `EOC`）。否则将导致溢出错误状态，由 `ADC_SR` 状态寄存器中的 `OVR`（溢出）标志位指示。\n\n#### STM32F4xx\
  \ 中的 `V[ref]`\n\n在 STM32F4xx Arm 型中，ADC 的参考电压引称为 `VREF+` 和 `VREF-`。外部参考 `VREF+`\
  \ 可以连接到外部参考电压（如 `VDD`），而 `VREF-` 连接到地。注意 ADC 输入（`Vin`）范围不能超过 `VREF–` ≤ `VIN`≤ `VREF+`。还有内部参考电压，可以进行编程。参见\
  \ STM32F4xx 参考手册。\n\n如果 `VREF(+)` 连接到芯片 `V[DD]` 以外的外部电压，它不能超过 `V[DD]` 电压。ADC 的正参考电压（`VREF+`）必须在\
  \ `1.8 V` ≤ `VREF+` ≤ `VDDA` 范围内，而 ADC 的负参考电压为 `VREF–` = `VSSA`。当 `VREF+=3.3V` 时，`VDDA`\
  \ 对应的负参考电压为 `VREF–` = `VSSA`。参见示例 7-2。\n\n**示例 7-2**\n\n当 ADC 输入通道电压为 1.2V 时，对于\
  \ `VREF+ = 3.3V` 的 STM32F4xx，给出数字转换输出。\n\n**解：**\n\n由于步长为 `3.3V / 4096 = 0.8 mV`，因此\
  \ `1.2V / 0.80 mV = 1489 = 0x5D1` 为 ADC 输出。\n\n\n\n\n\n0: 温度传感器和 `VREFINT` 通道禁用。\n\
  \n1: 温度传感器和 `VREFINT` 通道启用。\n\n**23**\n\n**VBATE: `VBAT` 启用**\n\n**VBAT** 0: `VBAT`\
  \ 通道禁用。\n\n**enable** 1: `VBAT` 通道启用。\n\n**17:16 ADCPRE:`:** ADC 分频器\n\n由软件设置和清除，以选择\
  \ ADC 时钟频率。\n\n该时钟为所有 ADC 通用。\n\n00: `PCLK2` 除以 2\n\n01: `PCLK2` 除以 4\n\n10: `PCLK2`\
  \ 除以 6\n\n11: `PCLK2` 除以 8\n\n**表 7-9: ADC 通用控制寄存器 (`ADC_CCR`)**\n\n要使用该传感器：\n\n\
  1. 选择 `ADC1_18` 输入通道。\n2. 选择大于数据手册中指定的最小采样时间的时间。\n3. 设置 `ADC_CCR` 寄存器中的 `TSVREFE`\
  \ 位，以使温度传感器从功耗模式唤醒。\n4. 通过设置 `SWSTART` 位（或通过外部触发）启动 ADC 转换。\n5. 在 ADC 数据寄存器中读取得到的\
  \ `VSENSE` 数据。\n6. 使用以下公式计算温度：\n\n温度 (°C) = `{(VSENSE – V25) / Avg_Slope} + 25`\n\
  \n其中：\n\n– `V25` = 25° C 时的 `VSENSE` 值\n– `Avg_Slope` = 温度与 `VSENSE` 曲线的平均斜率（单位为\
  \ mV/°C 或 μV/°C）\n\n下一个程序展示了如何转换内部温度传感输出。转换结果存储在全局变量 `result` 中，以便调试器观察。\n\n程序 7-2：使用定时器触发转换片上温度传感器\n\
  \n```c\n /* p7_2.c: 内部温度传感器\n* 此程序转换内部温度传感器输出 \n * 并在控制台上以摄氏度显示温度。 \n * 定时器 TIM2\
  \ 配置为产生 1 Hz 输出，用于\n * 触发 A/D 转换。内部温度 \n * 传感器连接到 ADC1 主机的通道 18。传感器 \n * 通过 ADC_CCR\
  \ 寄存器的第 23 位开启。\n*\n* 转换结果使用数据手册中的公式和参数\n * 以摄氏度格式显示在控制台上。 \n * 控制台 UART 驱动程序来自程序\
  \ 4-5。\n*\n* 此程序已使用 Keil uVision v5.24a 和 DFP v2.11.0 通过测试。 */\n\n#include \"stm32f4xx.h\"\
  \ \n#include <stdio.h>\n\nvoid USART2_init(void); \nint USART2_write(int c);\n\n\
  int main(void) {\n    int data;\n    double volt, temp;\n\n    RCC->AHB1ENR |= 1;\
  \ /* 启用 GPIOA 时钟 */ \n    TIM2->CCER = 0x0010; /* 通道 2 */ \n    TIM2->CCR2 = 50\
  \ - 1;\n    TIM2->CR1 = 1; /* 启用定时器 2 */\n\n    /* 设置 TIM2 */\n    RCC->APB1ENR\
  \ |= 1; /* 启用 TIM2 时钟 */ \n    TIM2->PSC = 1600 - 1; /* 除以 1600 */ \n    TIM2->ARR\
  \ = 10000 - 1; /* 除以 10000，采样率为 1 Hz */ \n    TIM2->CNT = 0;\n    TIM2->CCMR1 =\
  \ 0x00006800; /* pwm1 模式，预装启用 */\n\n    /* 设置 ADC1 */\n    RCC->APB2ENR |= 0x00000100;\
  \ /* 启用 ADC1 时钟 */\n\n    /* 开启温度传感器 */\n    ADC->CCR |= 0x800000;\n    ADC->CCR\
  \ &= ~0x400000; /* 温度传感器必须禁用 VBATE */ \n    /* 配置模数转换器 */\n    ADC1->SMPR1 = 0x4000000;\
  \ /* 采样时间最小 10 us */ \n    ADC1->SQR3 = 18; /* ch18 - 内部温度传感器，单通道 */ \n    ADC1->CR2\
  \ = 0x13000000; /* 触发：EXTEN 上升沿，EXTSEL 3 = tim2.2 */\n    ADC1->CR2 |= 1; /* 启用\
  \ ADC1 */\n\n    /* 初始化 USART2 输出 */\n    USART2_init();\n    printf(\"ADC internal\
  \ temperature sensor \\r\\n\");\n\n    while(1) {\n        while(!(ADC1->SR & 2))\
  \ {}\n        data = ADC1->DR;\n        /* 温度 (in °C) = {(VSENSE – V25) / Avg_Slope}\
  \ + 25 */ \n        /* V25 = 0.76V, 斜率 = 2.5 mV/C */\n        volt = (double)data\
  \ / 4095 * 3.3; /* 将 ADC 输出转换为电压 */ \n        temp = (volt - 0.76) / 0.0025 + 25;\
  \ /* 将电压转换为摄氏度温度 */ \n        printf(\"%d, %.2f\\370C\\r\\n\", data, temp); /* 进制\
  \ 370 是扩展 ASCII 中的度数 */\n    }\n}\n\n/* 初始化 USART2 以以 9600 波特率传输 */ \nvoid USART2_init\
  \ (void) {\n    RCC->AHB1ENR |= 1; /* 启用 GPIOA 时钟 */ \n    RCC->APB1ENR |= 0x20000;\
  \ /* 启用 USART2 时钟 */\n    /* ... 其他实现 ... */\n}\n```\n\n\n\n\n\n本节将介绍如何将外部传感器接口到微控制器。我们将检查一些常用的温度传感器，然后讨论信号调理的问题。尽管我们专注于温度传感器，但本节讨论的原理对于其他类型的传感器（如光传感器或压力传感器）也是相同的。\n\
  \n## 温度传感器\n\n传感器将温度、光强、流量和速度等物理参数转换为电信号。根据传感器的不同，输出可以是电压、电流、电阻或电容。例如，可以使用名为`thermistor`（热敏电阻）的传感器将温度转换为电信号。热敏电阻通过改变其电阻来响应温度变化，但正如表\
  \ 7-10 和图 7-18 所示，它的响应是非线性的。\n\n| 温度 ('C) | Tf (K ohms) |\n| :--- | :--- |\n| **0**\
  \ | 29.490 |\n| **25** | 10.000 |\n| **50** | 3.893 |\n| **75** | 1.700 |\n| **100**\
  \ | 0.817 |\n\n**表 7-10：热敏电阻电阻与温度**\n\n![](img/image00336.jpeg) **图 18：热敏电阻 (复制自\
  \ http://www.maximintegrated.com)**\n\n热敏电阻的电阻通常由 SteinhartHart 方程建模，并需要对数放大器来产生线性输出。此类设备的复杂性导致一些制造商推出了线性传感器。简单且广泛使用的线性传感器包括德州的`LM34`和`LM35`。它们将在后面讨论。\n\
  \n## LM34 和 LM35\n\n`LM34`传感器是一种精密集成温度传感器，其输出电压与华氏温度成正比。见图 19。`LM34`不需要外部校准，因为它在内部已校准。每华氏度输出`10\
  \ mV`。\n\n![](img/image00337.jpeg) **图 19：LM355`传感器与`LM34`类似，但其输出电压与摄氏度温度成正比。每摄氏度输出`10\
  \ mV`。\n\n## 信号调理\n\n常见的传感器以电压、电流、电荷或电阻的形式产生输出。为了对这些信号进行 A/D 转换，除非传感器输出已经是电压，否则它们需要转换为电压。除了转换外，信号还需要增益和偏移调整以获得最佳动态范围。低通滤波器通常也需要增益和偏移调整。20\
  \ 显示了数据采集系统的输入框图。\n\n![](img/image00338.jpeg) **图 20：获取模拟数据**\n\n### 将 LM34 接口到\
  \ STM32F4xx Arm 微控制器\n\n`STM32F4xx Arm 微控制器`的 A/D 具有 12 位分辨率，最大`4096`步，`LM34`每度变化产生`10\
  \ mV`。`LM34`的最大工作温度为`300`华氏度，因此最高输出将为`3000 mV`（`3.00 V`），低于`V[ref+]`的`3.3V`。如图 21\
  \ 所示连接到微控制器。\n\n![](img/image0339.jpeg) **图 21：LM34/35 连接到 Arm 及其引脚配置**\n\n要将 ADC\
  \ 结果转换为温度度，请使用以下公式：\n\n```\nTemperature = (ADC * 330) / 4096\n```\n\n## 读取和显示温度\n\
  \n程序 3 显示了使用`LM34`读取和显示华氏温度的代码。注意图 21 中，`LM34`（或`LM35`）必须连接到`PC0`（通道 10）。使用了 12\
  \ 位转换。\n\n程序 3：读取 LM34 温度传感器\n\n```c\n/* p7_3.c: LM34 华氏温度传感器\n *\n * LM34 是一个输出为\
  \ 10 mV/华氏度的温度传感器。\n * 程序假设 LM34 连接到引脚 PC0（通道 10）。\n * 转换结果以华氏度显示在控制台上。\n * 控制台\
  \ UART 驱动程序来自程序 4-5。\n * 此程序在 Keil uVision v5.24a 配合 DFP v2.11.0 进行了测试。 */\n\n#include\
  \ \"stm32f4xx.h\"\n#include <stdio.h>\n\nvoid USART2_init(void);\nint USART2_write(int\
  \ c);\nvoid delayMs(int n);\n\nint main (void) {\n    int result; \n    double temp;\n\
  \n    /* 设置引脚 PC0 用于模拟输入 */\n    RCC->AHB1ENR |= 4; /* 开启 GPIOC 时钟 */\n    GPIOC->MODER\
  \ |= 3; /* PC0 模拟 */\n\n    /* 设置 ADC1 */\n    RCC->APB2ENR |= 0x00000100; /* 开启\
  \ ADC1 时钟 */\n    ADC1->CR2 = 0; /* SW 触发 */\n    ADC1->SQR3 = 10; /* 单转换通道 10 */\n\
  \    ADC1->SQR1 = 0; /* 转换长度 1 */\n    ADC1->CR2 |= 1; /* 开启 ADC1 */\n\n    // ...\
  \ (其余实现)\n}\n```\n\n## 第 7.4 节：接口 DAC\n\n本节将讨论数模转换器的基础。然后我们将演示如何使用 DAC 生成锯齿波和正弦波。\n\
  \n**数模转换（DAC）转换器**\n\n数模转换器（DAC）是一种用于将数字信号转换为模拟信号的设备。\n\n在本节中，我们将讨论 DAC 的基础。\n\n\
  回想数字电子学中制作 DAC 的两种方法：二进制加权和 R/2R 阶梯。绝大多数集成电路 DAC（包括本节中的`DAC0808`）都使用 R/2R 方法，因为它可以获得更高的精度。选择\
  \ DAC 的第一标准是它的分辨率，它是数字输入位数的函数。常见的有 8 位、10 位和 12 位。数字输入位数决定了 DAC 的分辨率，因为模拟输出水平的数量等于\
  \ 2 的次方，其中 n 是数字输入位数。因此，如`DAC0808`之类的 8 位 DAC 提供 256 个离散电压（或电流）电平。见图 22。\n\n## 习题\n\
  \n1. 对或错。在将信号发送到 ADC 之前，必须连接到信号调理电路。\n2. `LM35`每度（摄氏度/华氏度）输出`____ mV`。\n3. `LM34`每度（华氏度/摄氏度）输出`____\
  \ mV`。\n4. 如果 ADC 输出为 0000 0011 1110，温度是多少？\n\n\n\n\n\n在 `DAC0808` 中，数字输入被转换为电流（`I[OUT]`）。通过在\
  \ `I[OUT]` 引脚上连接电阻，我们将转换结果电流转换为电压。`I[OUT]` 提供的总电流是 `DAC0808` `D0`–`D7` 输入端二进制数与参考电流（`I[ref]`）的函数，如下：\n\
  \n$I[OUT] = I[ref] \\times \\frac{(D7\\times128 + D6\\times64 + D5\\times32 + D4\\\
  times16 + D3\\times8 + D2\\times4 + D1\\times2 + D0\\times1)}{256}$\n\n其中 `D0` 是最低有效位（LSB），`D7`\
  \ 是最高有效位（MSB），`I[ref]` 是必须施加到 14 引脚的参考输入电流。`I[ref]` 电流通常设置为 2.0 mA。图 7-23 显示了使用标准\
  \ 5V 电源和 5K 欧姆电阻产生参考电流（设置 `I[ref] = 2 mA`）的方法。\n\n![](img/image00341.jpeg)\n**图\
  \ 7-23：控制器连接到 DAC0808**\n\n有些人也使用稳二管参考电压器件（`LM336`），这可以克服电源电压波动的影响。现在假设 `I[ref]\
  \ = 2 mA`，如果 DAC 的所有输入位均为高电平，最大输出电流为 1.99 mA（请自行验证）。\n\n### 在 DAC0808 中将 `I[out]`\
  \ 转换为电压\n\n我们将输出引脚 `I[OUT]` 连接到电阻，将此电流转换为电压并在示波器上监控输出。然而，在现实生活中，这会导致不准确，因为负载的输入电阻也会影响输出电压。因此，`I[ref]`\
  \ 电流通过连接到使用反馈电阻 `R[f] = 5K  ohms`的运算放大器进行缓冲。假设 `R = 5K  ohms`，通过改变二进制输入，输出电压的变化如示例\
  \ 7-4 所示。\n\n#### 示例 7-4\n\n假设 `R = 5K` 且 `I[ref] = 2 mA`，为以下二进制输入计算 `V[out]`：(a)\
  \ 二进制 10011001 (0x99) (b) 11001000 (0xC8)\n\n**解：**\n\n(a) `I[out] = 2 mA (153/255)\
  \ = 1.195 mA`，`V[out] = 1.195 mA × 5K = 5.975 V` (b) `I[out] = 2 mA (200/256) =\
  \ 1.562 mA`，`V[out] = 1.562 mA × 5K = 7.8125 V`\n\n### STM32 Arm 内置 DAC\n\n许多 `STM32F4xx`\
  \ Arm 芯片都内置了数字模拟转换器（DAC）。`STM32F446RE` 带有两个内置 DAC。它们可以配置为独立转换或同步转换。它们被命名为 `DAC1`\
  \ 和 `DAC2`。每个 DAC 都有自己的模拟输出引脚。在 `STM32F446RE` 中，模拟输出引脚分别为 `chan1` 和 `chan2` 的 `PA4`\
  \ 和 `PA5`。内置 DAC 具有 12 位分辨率，也可以配置为 8 位 DAC。这意味着加载到 `DAC` 寄存器的数字可以是 8 位或 12 位。数字数据可以右对齐或左对齐。内置\
  \ DAC 使用与 ADC 相同的 `Vref+` 电源。见下图。\n\n![](img/image00342.jpeg)\n**图 7-24：STM32F4xx\
