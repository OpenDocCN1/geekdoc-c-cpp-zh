  \ pr1`\n\n# 5.3 C – 函数指针\n\n带示例的 C – 函数指针\n\n在 C 语言中，我们可以有一个指向函数的指针的概念，这在 C 中被称为函数指针。在本教程中，我们将学习如何声明一个函数指针以及如何使用此指针调用函数。为了理解这个概念，你应该具备关于函数和\
  \ C 中的指针的基础基础知识。\n\n### 如何声明函数指针？\n\n`function_return_type(*Pointer_name)(function\
  \ argument list)`\n\n例如：\n`double (*p2f)(double, char)`\n\n在这里，`double` 是函数的返回值，`p2f`\
  \ 是函数指针的名字，`(double, char)` 是该函数的参数列表。这意味着该函数的第一个参数是 `double` 类型，第二个参数是 `char` 类型。\n\
  \n让我们通过一个示例来理解这一点：这里我们有一个函数 `sum`，它计算两个数字之和并返回结果。我们创建了一个指向该函数的指针 `f2p`，我们正在使用这个函数指针\
  \ `f2p` 调用该函数。\n\n```c\nint sum (int num1, int num2)\n{\n    return num1+num2;\n\
  }\n\nint main()\n{\n    /* 下面两行也可以写成一条语句，\n       如下所示：void (*fun_ptr)(int) = &fun;\n\
  \    */\n    int (*f2p) (int, int);\n    f2p = sum;\n\n    // 使用函数指针调用函数\n    int\
  \ op1 = f2p(10, 13);\n    // 使用函数名的普通方式调用函数\n    int op2 = sum(10, 13);\n\n    printf(\"\
  Output1: Call using function pointer: %d\",op1);\n    printf(\"\\nOutput2: Call\
  \ using function name: %d\", op2);\n    return  0;\n}\n```\n\n**输出：**\nOutput1:\
  \ Call  using  function pointer: 23\nOutput2: Call  using  function name: 23\n\n\
  **关于函数指针的几点：**\n\n1. 如注释所示，你可以在一条语句中声明函数指针并向其赋值一个函数，例如：`void (*fun_ptr)(int) = &fun;`\n\
  2. 你甚至可以去掉此语句中的取地址符，因为函数名本身就代表了函数的地址。这意味着上面的语句也可以写成：`void (*fun_ptr)(int) = fun;`\n\
  \n# 5.4 向函数传递指针\n\n带示例的 C 语言向函数传递指针\n\n在本教程中，你将学习如何将指针作为参数传递给函数。为了理解这个概念，你必须对指针和\
  \ C 语言编程中的函数有一个基本的认识。\n\n与其他任何参数一样，指针也可以作为参数传递给函数。让我们来看例子。\n\n**示例：向函数传递指针**\n在这个示例中，我们向函数传递一个指针。当我们向函数传递指针时，我们可以改变调用函数中变量的值。\n\
  \n```c\n#include <stdio.h>\nvoid salaryike(int *var, int b)\n{\n    *var = *var\
  \ + b;\n}\n\nint main()\n{\n    int salary=0, bonus=0;\n    printf(\"Enter current\
  \ salary:\");\n    scanf(\"%d\", &salary);\n    printf(\"Enter bonus:\");\n    scanf(\"\
  %d\", &bonus);\n    salaryike(&salary, bonus);\n    printf(\"Final salary: %d\"\
  , salary);\n    return 0;\n}\n```\n**输出：**\nEnter current salary:10000\nEnter bonus:2000\n\
  Final salary:12000\n\n# 5.5 C 中的文件 I/O\n\nC 语言编程中的文件 I/O\n\n在本指南中，我们将学习如何使用 C 语言对文件进行输入/输出(I/O)\
  \ 操作。\n\n**C 文件 I/O – 目录**\n1. 打开文件\n2. 读取文件\n3. 写入文件\n4. 关闭文件\n5. 向文件中读取和写入字符串\n\
  6. 读取和写入二进制文件\n\n在详细讨论每个操作之前，让我们来看一个简单的 C 程序：\n**一个打开、读取和关闭文件的简单 C 程序**\n\n```c\n\
  #include <stdio.h>\nint main()\n{\n    /* 指文件的指针 */\n    FILE *fp1;\n    /* 用于读取文件内容的字符变量\
