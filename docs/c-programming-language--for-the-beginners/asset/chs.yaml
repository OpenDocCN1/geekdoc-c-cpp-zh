  \ `r` & `w`。\n\n# 库函数 C 教程\n\n## C strcat() 函数\n\n`strcat()` 函数用于字符串拼接。它将指定的字符串连接到另一个指定字符串的末尾。在本教程中，我们将通过示例查看\
  \ `strcat()` 函数。\n\n### C strcat() 声明\n\n`char *strcat(char *str1, const char *str2)`\n\
  \n该函数接受两个指针作为参数，并返回拼接后目标字符串的指针。\n\n- `str1` – 目标字符串的指针。\n- `str2` – 源字符串的指针，将被附加到目标字符串末尾。\n\
  \n### 示例：C strcat() 函数\n\n```c\n#include <stdio.h>\n#include <string.h>\n\nint main\
  \ () {\n    char str1[50], str2[50];\n    //目标字符串\n    strcpy(str1, \"This is my\
  \ initial string\");\n    //源字符串\n    strcpy(str2, \", add this\");\n    //将字符串\
  \ str2 拼接到字符串 str1\n    strcat(str1, str2);\n    // 显示目标字符串\n    printf(\"String\
  \ after concatenation: %s\", str1);\n    return(0);\n}\n```\n\n**输出：**\nString after\
  \ concatenation: This is my initial string, add this\n\n你可以看到我们已经将字符串 `str2` 到了字符串\
  \ `str1` 的末尾。向函数 `strcpy` 传递参数的顺序很重要，第一个参数指定输出字符串，而第二个参数指定附加在输出字符串末尾的另一个字符串。\n\n\
  正如文章开头讨论的，该函数返回指向目标字符串的指针。这意味着如果我们显示该函数的返回值，它应该显示目标字符串（在我们的示例中为字符串 `str1`）。让我们稍微修改一下代码来验证这一点。\n\
  \n```c\n#include <stdio.h>\n#include <string.h>\n\nint main () {\n    char str1[50],\
  \ str2[50];\n    //目标字符串\n    strcpy(str1, \"This is my initial string\");\n   \
  \ //源字符串\n    strcpy(str2, \", add this\");\n    // 显示目标字符串\n    printf(\"String\
  \ after concatenation: %s\", strcat(str1, str2));\n    return(0);\n}\n```\n\n**输出：**\n\
  String after concatenation: This is my initial string, add this\n\n## C strncat()\
  \ 函数及示例\n\n在上一个教程中，我们讨论了 `strcat()` 函数，它用于将一个字符串拼接到另一个字符串。在本指南中，我们将看到一个类似的函数 `strncat()`，它与\
  \ `strcat()` 相同，不同之处在于 `strncat()` 只向目标字符串附加指定数量的字符。\n\n### C strncat() 函数声明\n\n\
  `char *strncat(char *str1, const char *str2, size_t n)`\n\n- `str1` – 目标字符串。\n-\
  \ `str2` – 附加到目标字符串 `str1` 末尾的源字符串。\n- `n` – 源字符串 `str2` 需要附加的字符数。例如，如果该值为 5，则源字符串\
  \ `str2` 的前 5 个字符会被附加到目标字符串 `str1` 的末尾。\n\n**返回值：**\n该函数返回指向目标字符串 `str1` 的指针。\n\n\
  ### 示例：C 中的 strncat() 函数\n\n```c\n#include <stdio.h>\n#include <string.h>\n\nint\
  \ main () {\n    char str1[50], str2[50];\n    //目标字符串\n    strcpy(str1, \"This\
  \ is my initial string\");\n    //源字符串\n    strcpy(str2, \", add this\");\n    //\
  \ 显示目标字符串\n    printf(\"String after concatenation: %s\\n\", strncat(str1, str2,\
  \ 5));\n    // 这应该与 strncat() 的返回值相同\n    printf(\"Destination String str1: %s\"\
  , str1);\n    return 0;\n}\n```\n\n**输出：**\nString after concatenation: This is\
  \ my initial string, add this\nDestination String str1: This is my initial string\n\
  \n你可以看到我们已经将字符串 `str2` 到了字符串 `str1` 的末尾。向函数 `strcpy` 传递参数的顺序很重要，第一个参数指定输出字符串，而第二个参数指定附加在输出字符串末尾的另一个字符串。\n\
  \n## C strchr() 函数\n\n`strchr()` 函数在字符串中搜索字符第一次出现的位置。\n\n### C strchr() 声明\n\n`char\
  \ *strchr(const char *str, int ch)`\n\n- `str` – 字符串\n- `ch` – 要查找的字符\n\n**strchr()\
  \ 的返回值：**\n返回 `ch` 在 `str` 中第一次出现处的指针，或者返回 `NULL`。\n\n### 示例：strchr() 函数\n\n```c\n\
  #include <stdio.h>\n#include <string.h>\n\nint main () {\n    const char str[] =\
  \ \"This is a String\";\n    const char ch = 'u';\n    char *p;\n    p = strchr(str,\
  \ ch);\n    printf(\"String from %c is: %s\", ch, p);\n    return 0;\n}\n```\n\n\
  **输出：**\nString from u is: String\n\n## C strcmp() 函数\n\n`strcmp()` 函数比较两个字符串并返回一个整数。\n\
  \n### C strcmp() 函数声明\n\n`int strcmp(const char *str1, const char *str2)`\n\n- `str1`\
  \ – 第一个字符串\n- `str2` – 第二个字符串\n\n**strcmp() 的返回值：**\n该函数根据比较结果返回如下：\n- `0` 如果两个字符串相等\n\
  - `>0` 如果 `str1` 中第一个不匹配字符的 ASCII 值大于 `str2` 中的字符\n- `<0` 如果 `str1` 中第一个不匹配字符的 ASCII\
  \ 值小于 `str2` 中的字符\n\n### 示例：C 中的 strcmp() 函数\n\n```c\n#include <stdio.h>\n#include\
  \ <string.h>\n\nint main () {\n    char str1[20];\n    char str2[20];\n    int result;\n\
  \    // 赋值给字符串 str1\n    strcpy(str1, \"hello\");\n    // 赋值给字符串 str2\n    strcpy(str2,\
  \ \"hEllo\");\n    result = strcmp(str1, str2);\n    if(result > 0) {\n        printf(\"\
  ASCII value of first unmatched character of str1 is greater than str2\");\n    }\
  \ else if(result < 0) {\n        printf(\"ASCII value of first unmatched character\
  \ of str1 is less than str2\");\n    } else {\n        printf(\"Both the strings\
  \ str1 and str2 are equal\");\n    }\n    return 0;\n}\n```\n\n**输出：**\nASCII value\
  \ of first unmatched character of str1 is greater than str2\n\n\n\n\n\n# 带示例的 C\
  \ 语言`strncmp()`函数\n\n在本指南中，我们将讨论 `strncmp()` 函数。该函数与 `strcmp()` 相同，区别在于 `strncmp()`的比较被限定为仅在**调用时指定数量的字符范围内进行**。例如，`strncmp(str1,\
  \ str2,4)`将仅比较字符串` str1`和`s tr2``的前四个字符。\n\n## C 语言的 *无宽首行*   ? --重新表达符合原文语义»\n\n\
