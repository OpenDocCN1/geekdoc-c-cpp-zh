  \ fgetc(fp1);\n        if(c==EOF)\n            break;\n        else\n          \
  \  printf(\"%c\", c);\n    }\n    fclose(fp1);\n    return 0;\n}\n```\n在上面的程序中，我们以\
  \ `r` 模式打开文件 `newfile.txt`，读取文件内容并显示在控制台上。\n\n### 5.5.1 打开文件\n\n`fopen()` 函数用于打开文件。\n\
  \n**语法：**\n`FILE pointer_name = fopen (\"file_name\", \"Mode\");`\n\n`pointer_name`\
  \ 可以是你选择的任何名称。\n`file_name` 是你想打开的文件名。在此处指定完整路径。\n在打开文件时，你需要指定模式。我们读取文件使用的模式是 `r`，它是`只读模式`。\n\
  \n**示例：**\n`FILE *fp;`\n`fp = fopen(\"C:\\\\myfiles\\\\newfile.txt\", \"r\");`\n\
  \n第一个字符的地址存储在 `pointer fp` 中。\n\n**如何检查文件是否成功打开？**\n如果文件没有成功打开，指针将被赋予 `NULL` 值，因此你可以这样写逻辑：\n\
