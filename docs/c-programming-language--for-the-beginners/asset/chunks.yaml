  raw: "void increment(int  *var)\n\n{\n\n /* Although we are performing the increment\
    \ on variable\n\n     * var, however the var is a pointer that holds the address\n\
    \n     * of variable num, which means the increment is actually done\n\n     *\
    \ on the address where value of num is stored.\n\n     */\n\n    *var = *var+1;\n\
    \n}\n\nint main()\n\n{\n\n int num=20;\n\n /* This way of calling the function\
    \ is known as call by\n\n      * reference. Instead of passing the variable num,\
    \ we are\n\n      * passing the address of variable num\n\n      */\n\n     increment(&num);\n\
    \n     printf(\"Value of num is: %d\", num);\n\n return  0;\n\n}\n\nOutput:\n\n\
    Value of num is: 21\n\nExample 2: Function Call by Reference – Swapping numbers\n\
    \nHere we are swapping the numbers using call by reference. As you can see the\
    \ values of the variables have been changed after calling the swapnum() function\
    \ because the swap happened on the addresses of the variables num1 and num2.\n\
    \n#include\n\nvoid swapnum ( int *var1, int *var2 )\n\n{\n\n int tempnum ;\n\n\
       tempnum = *var1 ;\n\n   *var1 = *var2 ;\n\n   *var2 = tempnum ;\n\n}\n\nint\
    \ main( )\n\n{\n\n int num1 = 35, num2 = 45 ;\n\n   printf(\"Before swapping:\"\
    );\n\n   printf(\"\\nnum1 value is %d\", num1);\n\n   printf(\"\\nnum2 value is\
    \ %d\", num2);\n\n /*calling swap function*/\n\n   swapnum( &num1, &num2 );\n\n\
       printf(\"\\nAfter swapping:\");\n\n   printf(\"\\nnum1 value is %d\", num1);\n\
    \n   printf(\"\\nnum2 value is %d\", num2);\n\n return  0;\n\n}\n\nOutput:\n\n\
    Before swapping:\n\nnum1 value is  35\n\nnum2 value is  45\n\nAfter swapping:\n\
    \nnum1 value is  45\n\nnum2 value is  35\n\nNote:’\n\nGo back from here:\n\n[Passing\
    \ array to function in C programming](#part0000.xhtml_passingarrat2fun)\n\n# 4.4\
    \ Structure in C programming\n\nStructure is a group of variables of different\
    \ data types represented by a single name. Lets take an example to understand\
    \ the need of a structure in C programming.\n\nLets say we need to store the data\
    \ of students like student name, age, address, id etc. One way of doing this would\
    \ be creating a different variable for each attribute, however when you need to\
    \ store the data of multiple students then in that case, you would need to create\
    \ these several variables again for each student. This is such a big headache\
    \ to store data in this way.\n\nWe can solve this problem easily by using structure.\
    \ We can create a structure that has members for name, id, address and age and\
    \ then we can create the variables of this structure for each student. This may\
    \ sound confusing, do not worry we will understand this with the help of example.\n\
    \n# 4.5 How to create a structure in C Programming\n\nWe use struct keyword to\
    \ create a structure in C. The struct keyword is a short form of structured data\
    \ type.\n\nstruct struct_name {\n\n DataType member1_name;\n\n DataType member2_name;\n\
    \n DataType member3_name;\n\n   …\n\n};\n\nHere struct_name can be anything of\
    \ your choice. Members data type can be same or different. Once we have declared\
    \ the structure we can use the struct name as a data type like int, float etc.\n\
    \nNote:First we will see the syntax of creating struct variable, accessing struct\
    \ members etc and then we will see a complete example.\n\nHow to declare variable\
    \ of a structure?\n\nstruct  struct_name  var_name;\n\nor\n\nstruct struct_name\
    \ {\n\n DataType member1_name;\n\n DataType member2_name;\n\n DataType member3_name;\n\
    \n   …\n\n} var_name;\n\nHow to access data members of a structure using a struct\
    \ variable?\n\nvar_name.member1_name;\n\nvar_name.member2_name;\n\n…\n\nHow to\
    \ assign values to structure members?\n\nThere are three ways to do this.\n\n\
    1) Using Dot(.) operator\n\nvar_name.memeber_name = value;\n\n2) All members assigned\
    \ in one statement\n\nstruct struct_name var_name =\n\n{value for memeber1, value\
    \ for memeber2 …so on for all the members}\n\n3) Designated initializers – We\
    \ will discuss this later at the end of this post.\n\nExample of Structure in\
    \ C\n\n#include  <stdio.h>\n\n/* Created a structure here. The name of the structure\
    \ is\n\n* StudentData.\n\n*/\n\nstruct  StudentData{\n\n char *stu_name;\n\n int\
    \ stu_id;\n\n int stu_age;\n\n};\n\nint main()\n\n{\n\n /* student is the variable\
    \ of structure StudentData*/\n\n struct  StudentData student;\n\n /*Assigning\
    \ the values of each struct member here*/\n\nstudent.stu_name = \"Steve\";\n\n\
    student.stu_id = 1234;\n\nstudent.stu_age = 30;\n\n /* Displaying the values of\
    \ struct members */\n\n     printf(\"Student Name is: %s\", student.stu_name);\n\
    \n     printf(\"\\nStudent Id is: %d\", student.stu_id);\n\n     printf(\"\\nStudent\
    \ Age is: %d\", student.stu_age);\n\n return  0;\n\n}\n\nOutput:\n\nStudent  Name\
    \  is: Steve\n\nStudent  Id  is: 1234\n\nStudent  Age  is: 30\n\n# 4.6 Nested\
    \ Structure in C: Struct inside another struct\n\nYou can use a structure inside\
    \ another structure, which is fairly possible. As I explained above that once\
    \ you declared a structure, the struct struct_name acts as a new data type so\
    \ you can include it in another struct just like the data type of other data members.\
    \ Sounds confusing? Don’t worry. The following example will clear your doubt.\n\
    \nExample of Nested Structure in C Programming\n\nLets say we have two structure\
    \ like this:\n\nStructure 1: stu_address\n\nstruct stu_address\n\n{\n\n int street;\n\
    \n char *state;\n\n char *city;\n\n char *country;\n\n}\n\nStructure 2: stu_data\n\
    \nstruct stu_data\n\n{\n\n int stu_id;\n\n int stu_age;\n\n char *stu_name;\n\n\
    \ struct stu_address stuAddress;\n\n}\n\nAs you can see here that I have nested\
    \ a structure inside another structure.\n\nAssignment for struct inside struct\
    \ (Nested struct)\n\nLets take the example of the two structure that we seen above\
    \ to understand the logic\n\nstruct  stu_data  mydata;\n\nmydata.stu_id = 1001;\n\
    \nmydata.stu_age = 30;\n\nmydata.stuAddress.state = \"UP\"; //Nested struct assignment\n\
    \n..\n\nHow to access nested structure members?\n\nUsing chain of “.” operator.\n\
    \nSuppose you want to display the city alone from nested struct –\n\nprintf(\"\
    %s\",  mydata.stuAddress.city);\n\nUse of typedef in Structure\n\ntypedef makes\
    \ the code short and improves readability. In the above discussion we have seen\
    \ that while using structs every time we have to use the lengthy syntax, which\
    \ makes the code confusing, lengthy, complex and less readable. The simple solution\
    \ to this issue is use of typedef. It is like an alias of struct.\n\nCode without\
    \ typedef\n\nstruct home_address {\n\n int local_street;\n\n char *town;\n\n char\
    \ *my_city;\n\n char *my_country;\n\n};\n\n...\n\nstruct home_address var;\n\n\
    var.town = \"Agra\";\n\nCode using tyepdef\n\ntypedef  struct home_address{\n\n\
    \ int local_street;\n\n char *town;\n\n char *my_city;\n\n char *my_country;\n\
    \n}addr;\n\n..\n\n..\n\naddr var1;\n\nvar.town = \"Agra\";\n\nInstead of using\
    \ the struct home_address every time you need to declare struct variable, you\
    \ can simply use addr, the typedef that we have defined.\n\nDesignated initializers\
    \ to set values of Structure members\n\nWe have already learned two ways to set\
    \ the values of a struct member, there is another way to do the same using designated\
    \ initializers. This is useful when we are doing assignment of only few members\
    \ of the structure. In the following example the structure variable s2 has only\
    \ one member assignment.\n\n#include  <stdio.h>\n\nstruct numbers\n\n{\n\n int\
    \ num1, num2;\n\n};\n\nint main()\n\n{\n\n // Assignment using using designated\
    \ initialization\n\n struct numbers s1 = {.num2 = 22, .num1 = 11};\n\n struct\
    \ numbers s2 = {.num2 = 30};\n\n   printf (\"num1: %d, num2: %d\\n\", s1.num1,\
    \ s1.num2);\n\n   printf (\"num1: %d\", s2.num2);\n\n return  0;\n\n}\n\nOutput:\n\
    \nnum1: 11, num2: 22\n\nnum1: 30\n\n### CHAPTER 5 - POINTERS AND FILE I/O IN C\
    \ PROGRAMMING\n\n# 5.1 Pointers in C Programming\n\nA pointer is a variable that\
    \ stores the address of another variable. Unlike other variables that hold values\
    \ of a certain type, pointer holds the address of a variable. For example, an\
    \ integer variable holds (or you can say stores) an integer value, however an\
    \ integer pointer holds the address of a integer variable. \n\nBefore we discuss\
    \ about pointers in C, lets take a simple example to understand what do we mean\
    \ by the address of a variable.\n\nA simple example to understand how to access\
    \ the address of a variable without pointers?"
