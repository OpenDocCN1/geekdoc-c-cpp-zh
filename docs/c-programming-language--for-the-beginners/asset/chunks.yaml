    \n## 1\\. Hello World Program in C\n\nHere we will write two C programs to display\
    \ Hello World on the screen. In the first program we are displaying the message\
    \ using printf function and in the second program we are calling a user defined\
    \ function and that function displays the Hello World message on the screen.\n\
    \nExample 1: Displaying Hello World\n\n#include  <stdio.h>\n\nint main()\n\n{\n\
