    \ *pr1`\n`&pr2 == pr1`\n\n# 5.3 C – Function Pointer\n\nC – Function Pointer with\
    \ examples\n\nIn C programming language, we can have a concept of Pointer to a\
    \ function known as function pointer in C. In this tutorial, we will learn how\
    \ to declare a function pointer and how to call a function using this pointer.\
    \ To understand this concept, you should have the basic knowledge of [Functions](#part0000.xhtml_functionsinC)\
    \ and [Pointers in C](#part0000.xhtml_pointerinC).\n\n### How to declare a function\
    \ pointer?\n\n`function_return_type(*Pointer_name)(function argument list)`\n\n\
    For example:\n`double (*p2f)(double, char)`\n\nHere `double` is a return type\
    \ of function, `p2f` is name of the function pointer and `(double, char)` is an\
    \ argument list of this function. Which means the first argument of this function\
    \ is of `double` type and the second argument is `char` type.\n\nLets understand\
    \ this with the help of an example: Here we have a function `sum` that calculates\
    \ the sum of two numbers and returns the sum. We have created a pointer `f2p`\
    \ that points to this function, we are invoking the function using this function\
    \ pointer `f2p`.\n\n```c\nint sum (int num1, int num2)\n{\n    return num1+num2;\n\
    }\n\nint main()\n{\n    /* The following two lines can also be written in a single\n\
    \       statement like this: void (*fun_ptr)(int) = &fun;\n    */\n    int (*f2p)\
    \ (int, int);\n    f2p = sum;\n\n    //Calling function using function pointer\n\
    \    int op1 = f2p(10, 13);\n    //Calling function in normal way using function\
    \ name\n    int op2 = sum(10, 13);\n\n    printf(\"Output1: Call using function\
    \ pointer: %d\",op1);\n    printf(\"\\nOutput2: Call using function name: %d\"\
    , op2);\n    return  0;\n}\n```\n\n**Output:**\nOutput1: Call  using  function\
    \ pointer: 23\nOutput2: Call  using  function name: 23\n\n**Some points regarding\
    \ function pointer:**\n\n1. As mentioned in the comments, you can declare a function\
    \ pointer and assign a function to it in a single statement like this: `void (*fun_ptr)(int)\
    \ = &fun;`\n2. You can even remove the ampersand from this statement because a\
    \ function name alone represents the function address. This means the above statement\
    \ can also be written like this: `void (*fun_ptr)(int) = fun;`\n\n# 5.4 Passing\
    \ pointer to a function\n\nPassing pointer to a function in C with example\n\n\
    In this tutorial, you will learn how to pass a pointer to a function as an argument.\
    \ To understand this concept you must have a basic idea of Pointers and [functions\
    \ in C programming.](#part0000.xhtml_functionsinC)\n\nJust like any other argument,\
    \ pointers can also be passed to a function as an argument. Lets take an example.\n\
    \n**Example: Passing Pointer to a Function**\nIn this example, we pass a pointer\
    \ to a function. When we pass a pointer to a function, we can change the value\
    \ of the variable in the calling function.\n\n```c\n#include <stdio.h>\nvoid salaryike(int\
    \ *var, int b)\n{\n    *var = *var + b;\n}\n\nint main()\n{\n    int salary=0,\
    \ bonus=0;\n    printf(\"Enter current salary:\");\n    scanf(\"%d\", &salary);\n\
    \    printf(\"Enter bonus:\");\n    scanf(\"%d\", &bonus);\n    salaryike(&salary,\
    \ bonus);\n    printf(\"Final salary: %d\", salary);\n    return 0;\n}\n```\n\
    **Output:**\nEnter current salary:10000\nEnter bonus:2000\nFinal salary:12000\n\
    \n# 5.5 File I/O in C\n\nFile I/O in C programming\n\nIn this guide, we will learn\
