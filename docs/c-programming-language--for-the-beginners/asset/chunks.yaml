    \n你也可以通过这些简单的等式理解程序的逻辑：\n`num == *pr2 == **pr1`\n`&num == pr2 == *pr1`\n`&pr2\
    \ == pr1`\n\n# 5.3 C – 函数指针\n\n带示例的 C – 函数指针\n\n在 C 语言中，我们可以有一个指向函数的指针的概念，这在 C\
    \ 中被称为函数指针。在本教程中，我们将学习如何声明一个函数指针以及如何使用此指针调用函数。为了理解这个概念，你应该具备关于函数和 C 中的指针的基础基础知识。\n\
    \n### 如何声明函数指针？\n\n`function_return_type(*Pointer_name)(function argument list)`\n\
    \n例如：\n`double (*p2f)(double, char)`\n\n在这里，`double` 是函数的返回值，`p2f` 是函数指针的名字，`(double,\
    \ char)` 是该函数的参数列表。这意味着该函数的第一个参数是 `double` 类型，第二个参数是 `char` 类型。\n\n让我们通过一个示例来理解这一点：这里我们有一个函数\
    \ `sum`，它计算两个数字之和并返回结果。我们创建了一个指向该函数的指针 `f2p`，我们正在使用这个函数指针 `f2p` 调用该函数。\n\n```c\n\
    int sum (int num1, int num2)\n{\n    return num1+num2;\n}\n\nint main()\n{\n \
    \   /* 下面两行也可以写成一条语句，\n       如下所示：void (*fun_ptr)(int) = &fun;\n    */\n    int\
    \ (*f2p) (int, int);\n    f2p = sum;\n\n    // 使用函数指针调用函数\n    int op1 = f2p(10,\
    \ 13);\n    // 使用函数名的普通方式调用函数\n    int op2 = sum(10, 13);\n\n    printf(\"Output1:\
    \ Call using function pointer: %d\",op1);\n    printf(\"\\nOutput2: Call using\
    \ function name: %d\", op2);\n    return  0;\n}\n```\n\n**输出：**\nOutput1: Call\
    \  using  function pointer: 23\nOutput2: Call  using  function name: 23\n\n**关于函数指针的几点：**\n\
    \n1. 如注释所示，你可以在一条语句中声明函数指针并向其赋值一个函数，例如：`void (*fun_ptr)(int) = &fun;`\n2. 你甚至可以去掉此语句中的取地址符，因为函数名本身就代表了函数的地址。这意味着上面的语句也可以写成：`void\
    \ (*fun_ptr)(int) = fun;`\n\n# 5.4 向函数传递指针\n\n带示例的 C 语言向函数传递指针\n\n在本教程中，你将学习如何将指针作为参数传递给函数。为了理解这个概念，你必须对指针和\
