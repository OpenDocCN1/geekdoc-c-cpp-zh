  raw: "Nesting of loop is also possible. Lets take an example to understand this:\n\
    \n#include  <stdio.h>\n\nint main()\n\n{\n\n for (int i=0; i<2; i++)\n\n   {\n\
    \nfor (int j=0; j<4; j++)\n\n{\n\n   printf(\"%d, %d\\n\",i ,j);\n\n}\n\n   }\n\
    \n return  0;\n\n}\n\nOutput:\n\n0, 0\n\n0, 1\n\n0, 2\n\n0, 3\n\n1, 0\n\n1, 1\n\
    \n1, 2\n\n1, 3\n\nIn the above example we have a for loop inside another for loop,\
    \ this is called nesting of loops. One of the example where we use nested for\
    \ loop is  [Two dimensional array.](#part0000.xhtml_array2D)\n\nMultiple initialization\
    \ inside for Loop in C\n\nWe can have multiple initialization in the for loop\
    \ as shown below.\n\nfor (i=1,j=1;i<10 && j<10; i++, j++)\n\nWhat’s the difference\
    \ between above for loop and a simple for loop?\n\n1\\. It is initializing two\
    \ variables. Note: both are separated by comma (,).\n\n2\\. It has two test conditions\
    \ joined together using AND (&&) logical operator. Note: You cannot use multiple\
    \ test conditions separated by comma, you must use logical operator such as &&\
    \ or || to join conditions.\n\n3\\. It has two variables in increment part.\n\n\
     Note: Should be separated by comma.\n\nExample of for loop with multiple test\
    \ conditions\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int i,j;\n\n for (i=1,j=1\
    \ ; i<3 || j<5; i++,j++)\n\n   {\n\nprintf(\"%d, %d\\n\",i ,j);\n\n   }\n\n return\
    \  0;\n\n}\n\nNote:\n\nGo back from here:\n\n[Passing array to function in C programming](#part0000.xhtml_passingarrat2fun)\n\
    \n[C Program to find the Sum of First n Natural numbers](#part0000.xhtml_naturalnum)\n\
    \n# 2.2 C – while loop in C programming\n\nA loop is used for executing a block\
    \ of statements repeatedly until a given condition returns false. \n\nC – while\
    \ loop\n\nSyntax:\n\nwhile (condition test)\n\n{\n\n //Statements to be executed\
    \ repeatedly\n\n // Increment (++) or Decrement (--) Operation\n\n}\n\nFlow Diagram\
    \ of while loop\n\n![](Images/image00432.jpeg)\n\nExample of while loop\n\n#include\
    \  <stdio.h>\n\nint main()\n\n{\n\n int count=1;\n\n while (count <= 4)\n\n  \
    \ {\n\nprintf(\"%d \", count);\n\ncount++;\n\n   }\n\n return  0;\n\n}\n\nOutput:\n\
    \n1  2  3  4\n\nstep1: The variable count is initialized with value 1 and then\
    \ it has been tested for the condition.\n\nstep2: If the condition returns true\
    \ then the statements inside the body of while loop are executed else control\
    \ comes out of the loop.\n\nstep3: The value of count is incremented using ++\
    \ operator then it has been tested again for the loop condition.\n\nGuess the\
    \ output of this while loop\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \  var=1;\n\n while (var <=2)\n\n     {\n\n        printf(\"%d \", var);\n\n    \
    \ }\n\n}\n\nThe program is an example of infinite while loop. Since the value\
    \ of the variable var is same (there is no ++ or – operator used on this variable,\
    \ inside the body of loop) the condition var<=2 will be true forever and the loop\
    \ would never terminate.\n\nExamples of infinite while loop\n\nExample 1:\n\n\
    #include  <stdio.h>\n\nint main()\n\n{\n\n int  var = 6;\n\n while (var >=5)\n\
    \n     {\n\n        printf(\"%d\", var);\n\n var++;\n\n     }\n\n return  0;\n\
    \n}\n\nInfinite loop: var will always have value >=5 so the loop would never end.\n\
    \nExample 2:\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int  var =5;\n\n while\
    \ (var <=10)\n\n    {\n\n       printf(\"%d\", var);\n\n var--;\n\n    }\n\n return\
    \  0;\n\n}\n\nInfinite loop: var value will keep decreasing because of –- operator,\
    \ hence it will always be <= 10.\n\nUse of Logical operators in while loop\n\n\
    Just like relational operators (<, >, >=, <=,! =, ==), we can also use logical\
    \ operators in while loop. The following scenarios are valid:\n\nwhile(num1<=10\
    \ && num2<=10)\n\n-using AND(&&) operator, which means both the conditions should\
    \ be true.\n\nwhile(num1<=10||num2<=10)\n\n– OR(||) operator, this loop will run\
    \ until both conditions return false.\n\nwhile(num1!=num2 &&num1 <=num2)\n\n–\
    \ Here we are using two logical operators NOT (!) and AND(&&).\n\nwhile(num1!=10\
    \ ||num2>=num1)\n\nExample of while loop using logical operator\n\nIn this example\
    \ we are testing multiple conditions using logical operator inside while loop.\n\
    \n#include  <stdio.h>\n\nint main()\n\n{\n\n int i=1, j=1;\n\n while (i <= 4 ||\
    \ j <= 3)\n\n   {\n\nprintf(\"%d %d\\n\",i, j);\n\ni++;\n\nj++;\n\n   }\n\n return\
    \  0;\n\n}\n\nOutput:\n\n1  1\n\n2  2\n\n3  3\n\n4  4\n\nNote:\n\nGo back from\
    \ here:\n\n[C Program to find the Sum of First n Natural numbers](#part0000.xhtml_naturalnum)\n\
    \n[Program to Convert Binary Number to Decimal Number](#part0000.xhtml_binarynum)\n\
    \n[Program to Convert Decimal Number to Binary Number](#part0000.xhtml_decimal)\n\
    \n[Program to Convert Decimal to Octal Number](#part0000.xhtml_octa)\n\n# 2.3\
    \ C – do while loop in C programming\n\nA do while loop is similar to while loop\
    \ with one exception that it executes the statements inside the body of do-while\
    \ before checking the condition. On the other hand in the while loop, first the\
    \ condition is checked and then the statements in while loop are executed. So\
    \ you can say that if a condition is false at the first place then the do while\
    \ would run once, however the while loop would not run at all.\n\nC – do..while\
    \ loop\n\nSyntax:\n\ndo\n\n{\n\n //Statements\n\n}while(condition test);\n\nFlow\
    \ diagram of do while loop\n\n![](Images/image00433.jpeg)\n\nExample of do while\
    \ loop\n\n#include  <stdio.h>\n\nint main()\n\n{\n\nint j=0;\n\ndo\n\n{\n\nprintf(\"\
    Value of variable j is: %d\\n\", j);\n\nj++;\n\n}while (j<=3);\n\nreturn  0;\n\
    \n}\n\nOutput:\n\nValue of variable j is: 0\n\nValue of variable j is: 1\n\nValue\
    \ of variable j is: 2\n\nValue of variable j is: 3\n\nWhile vs do..while loop\
    \ in C\n\nUsing while loop:\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \ i=0;\n\n while(i==1)\n\n    {\n\nprintf(\"while vs do-while\");\n\n    }\n\n\
        printf(\"Out of loop\");\n\n}\n\nOutput:\n\nOut of loop\n\nSame example using\
    \ do-while loop\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int i=0;\n\n do\n\
    \n   {\n\nprintf(\"while vs do-while\\n\");\n\n   }while(i==1);\n\n   printf(\"\
    Out of loop\");\n\n}\n\nOutput:\n\nwhile vs do-while\n\nOut of loop\n\nExplanation: As\
    \ I mentioned in the beginning of this guide that do-while runs at least once\
    \ even if the condition is false because the condition is evaluated, after the\
    \ execution of the body of loop.\n\n# 2.4 C – break statement in C programming\n\
    \nThe break statement is used inside loops and [switch case.](#part0000.xhtml_switchcase)\n\
    \nC – break statement\n\n1\\. It is used to come out of the loop instantly. When\
    \ a break statement is encountered inside a loop, the control directly comes out\
    \ of loop and the loop gets terminated. It is used with if statement, whenever\
    \ used inside loop.\n\n2\\. This can also be used in switch case control structure.\
    \ Whenever it is encountered in switch-case block, the control comes out of the\
    \ switch-case(see the example below).\n\nFlow diagram of break statement\n\n![](Images/image00434.jpeg)\n\
    \nSyntax:\n\nbreak;\n\nExample – Use of break in a while loop\n\n#include  <stdio.h>\n\
    \nint main()\n\n{\n\n int num =0;\n\n while(num<=100)\n\n     {\n\n        printf(\"\
    value of variable num is: %d\\n\", num);\n\n if (num==2)\n\n        {\n\n break;\n\
    \n        }\n\n        num++;\n\n     }\n\n     printf(\"Out of while-loop\");\n\
    \n return  0;\n\n}\n\nOutput:\n\nvalue of variable num is: 0\n\nvalue of variable\
    \ num is: 1\n\nvalue of variable num is: 2\n\nOut of while-loop\n\nExample – Use\
    \ of break in a for loop\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int  var;\n\
    \n for (var =100; var>=10; var --)\n\n      {\n\n           printf(\"var: %d\\\
    n\", var);\n\n if (var==99)\n\n           {\n\n break;\n\n           }\n\n     \
    \ }\n\n     printf(\"Out of for-loop\");\n\n return  0;\n\n}\n\nOutput:\n\nvar:\
    \ 100\n\nvar: 99\n\nOut of for-loop\n\nExample – Use of break statement in switch-case\n\
    \n#include  <stdio.h>\n\nint main()\n\n{\n\n int num;\n\n      printf(\"Enter\
    \ value of num:\");\n\n      scanf(\"%d\",&num);\n\n switch (num)\n\n      {\n\
    \n case  1:\n\n             printf(\"You have entered value 1\\n\");\n\n break;\n\
    \n case  2:\n\n             printf(\"You have entered value 2\\n\");\n\n break;\n\
    \n case  3:\n\n             printf(\"You have entered value 3\\n\");\n\n break;\n\
    \n default:\n\n             printf(\"Input value is other than 1,2 & 3 \");\n\n\
         }\n\n return  0;\n\n}\n\nOutput:\n\nEnter value of num:2\n\nYou have entered\
    \ value 2"
