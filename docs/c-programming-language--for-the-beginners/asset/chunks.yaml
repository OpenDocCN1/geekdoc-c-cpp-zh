    \n    printf(\"Enter a Decimal Number: \");\n\n    scanf(\"%d\", &decimalnum);\n\
    \n    printf(\"Equivalent Binary Number is: %ld\", decimalToBinary(decimalnum));\n\
    \n return  0;\n\n}\n\nOutput:\n\nEnter a Decimal  Number: 234\n\nEquivalent  Binary\
    \  Number  is: 11101010\n\n## 3\\. C Program to Convert Decimal to Octal Number\n\
    \nThis program converts the input decimal number to an octal number.\n\nExample:\
    \ Program to convert decimal to octal\n\nIn this program, we have created a user\
    \ defined function decimalToOctal() for decimal to octal conversion. The program\
    \ takes the decimal number(entered by user) as input and converts it into an octal\
    \ number using the function. To understand this program, you should be familiar\
    \ with the following C programming concepts:[](#part0000.xhtml_functionsinC)\n\
    \n[C Programming User defined functions](#part0000.xhtml_functionsinC)\n\n[while\
    \ loop in C programming](#part0000.xhtml_whileloop)\n\n#include  <stdio.h>\n\n\
    #include  <math.h>\n\n/* This function converts the decimal number \"decimalnum\"\
    \n\n* to the equivalent octal number\n\n*/\n\nint decimalToOctal(int decimalnum)\n\
    \n{\n\n int octalnum = 0, temp = 1;\n\n while (decimalnum != 0)\n\n    {\n\n octalnum\
    \ = octalnum + (decimalnum % 8) * temp;\n\n decimalnum = decimalnum / 8;\n\ntemp\
    \ = temp * 10;\n\n    }\n\n return octalnum;\n\n}\n\nint main()\n\n{\n\n int decimalnum;\n\
    \n    printf(\"Enter a Decimal Number: \");\n\n    scanf(\"%d\", &decimalnum);\n\
    \n    printf(\"Equivalent Octal Number: %d\", decimalToOctal(decimalnum));\n\n\
    \ return  0;\n\n}\n\nOutput:\n\nEnter a Decimal  Number: 436\n\nEquivalent  Octal\
    \  Number: 664\n\n## 4\\. C Program to Convert Octal Number to Decimal Number\n\
    \nThis program converts an octal number to an equivalent decimal number.\n\nExample:\
    \ Program to Convert Octal to Decimal\n\nIn this program, we have created a user\
    \ defined function for octal to decimal conversion. The program takes the octal\
    \ number (entered by user) as input and converts it into a decimal number using\
    \ function. To understand this program, you should have the knowledge of following\
    \ C programming topics:\n\n1.  C – User defined functions\n\n2.  while loop in\
    \ C\n\n#include  <stdio.h>\n\n#include  <math.h>\n\n/* This function converts\
    \ the octal number \"octalnum\" to the\n\n* decimal number and returns it.\n\n\
    */\n\nlong octalToDecimal(int octalnum)\n\n{\n\n int decimalnum = 0, temp = 0;\n\
    \n while(octalnum != 0)\n\n    {\n\n        decimalnum = decimalnum + (octalnum%10)\
    \ * pow(8,temp);\n\n        temp++;\n\noctalnum = octalnum / 10;\n\n    }\n\n\
    \ return decimalnum;\n\n}\n\nint main()\n\n{\n\n int octalnum;\n\n    printf(\"\
    Enter an octal number: \");\n\n    scanf(\"%d\", &octalnum);\n\n    printf(\"\
    Equivalent decimal number is: %ld\", octalToDecimal(octalnum));\n\n return  0;\n\
    \n}\n\nOutput:\n\nEnter an octal number: 754\n\nEquivalent  decimal number is:\
    \ 492\n\n## 5\\. C Program to Convert Binary to Octal Number System\n\nThis C\
    \ Program converts a binary number to an equivalent octal number.\n\nExample:\
    \ Program to convert Binary to Octal\n\nIn this program, user is asked to enter\
    \ the binary number and the program then converts that binary number to the octal\
    \ number by calling a user defined function. To understand this program, you should\
    \ be familiar with the following C programming concepts:\n\n1.  C – while loop\n\
    \n2.  C – Functions\n\n#include  <stdio.h>\n\n#include  <math.h>\n\n//This function\
    \ converts binary number to octal number\n\nint binaryToOctal(long binarynum)\n\
    \n{\n\n int octalnum = 0, decimalnum = 0, i = 0;\n\n /* This while loop converts\
    \ binary number \"binarynum\" to the\n\n     * decimal number \"decimalnum\"\n\
    \n     */\n\n while(binarynum != 0)\n\n    {\n\n        decimalnum = decimalnum\
    \ + (binarynum%10) * pow(2,i);\n\n        i++;\n\nbinarynum = binarynum / 10;\n\
    \n    }\n\n //i is re-initialized\n\ni = 1;\n\n /* This loop converts the decimal\
    \ number \"decimalnum\" to the octal\n\n     * number \"octalnum\"\n\n     */\n\
    \n while (decimalnum != 0)\n\n    {\n\noctalnum = octalnum + (decimalnum % 8)\
    \ * i;\n\ndecimalnum = decimalnum / 8;\n\ni = i * 10;\n\n    }\n\n //Returning\
    \ the octal number that we got from binary number\n\n return octalnum;\n\n}\n\n\
    int main()\n\n{\n\n long binarynum;\n\n    printf(\"Enter a binary number: \"\
    );\n\n    scanf(\"%ld\", &binarynum);\n\n // calling the function here\n\n   \
    \ printf(\"Equivalent octal value: %d\", binaryToOctal(binarynum));\n\n return\
    \  0;\n\n}\n\nOutput:\n\nEnter a binary number: 111001\n\nEquivalent octal value:\
    \ 71\n\nIn this program, we are converting the entered binary number to decimal\
    \ number first and then we are converting that decimal number to the octal number.\n\
    \n## 6\\. C Program to Convert Octal Number to Binary Number\n\nThis program converts\
    \ an octal number to a binary number using a user defined function.\n\nExample:\
    \ Program to convert octal to binary\n\nIn this program we have created a user\
    \ defined function octalToBinary(). This function converts the octal number (entered\
    \ by user) to decimal number first and then converts that decimal number to binary\
    \ number. To understand the working of this program, you should have the basic\
    \ knowledge of following C Programming topics:\n\n1.  C Programming while loop\n\
    \n2.  C Programming functions(functions in C)\n\n#include  <stdio.h>\n\n#include\
    \  <math.h>\n\n//This function converts octal number to binary number\n\nlong\
    \ octalToBinary(int octalnum)\n\n{\n\n int decimalnum = 0, i = 0;\n\n long binarynum\
    \ = 0;\n\n /* This loop converts octal number \"octalnum\" to the\n\n     * decimal\
    \ number \"decimalnum\"\n\n     */\n\n while(octalnum != 0)\n\n    {\n\ndecimalnum\
    \ = decimalnum + (octalnum%10) * pow(8,i);\n\ni++;\n\noctalnum = octalnum / 10;\n\
    \n    }\n\n //i is re-initialized\n\ni = 1;\n\n /* This loop converts the decimal\
    \ number \"decimalnum\" to the binary\n\n     * number \"binarynum\"\n\n     */\n\
    \n while (decimalnum != 0)\n\n    {\n\nbinarynum = binarynum + (decimalnum % 2)\
    \ * i;\n\ndecimalnum = decimalnum / 2;\n\ni = i * 10;\n\n    }\n\n //Returning\
    \ the binary number that we got from octal number\n\n return binarynum;\n\n}\n\
    \nint main()\n\n{\n\n int octalnum;\n\n    printf(\"Enter an octal number: \"\
    );\n\n    scanf(\"%d\", &octalnum);\n\n //Calling the function octaltoBinary\n\
    \n    printf(\"Equivalent binary number is: %ld\", octalToBinary(octalnum));\n\
    \n return  0;\n\n}\n\nOutput:\n\nEnter an octal number: 71\n\nEquivalent binary\
    \ number is: 111001\n\n### 12\\. PROGRAMS TO FIND OUT AREAS OF GEOMETRIC FIGURES\n\
    \n## 1\\. C Program to calculate Area and Circumference of Circle\n\nHere we are\
    \ writing a simple C program that calculates the area and circumference of circle\
    \ based on the radius value provided by user.\n\nFormula:\n\nArea = 3.14 * radius\
    \ * radius\n\nCircumference = 2 * 3.14 * radius\n\nProgram to calculate Area and\
    \ Circumference based on user input\n\nTo calculate area and circumference we\
    \ must know the radius of circle. The program will prompt user to enter the radius\
    \ and based on the input it would calculate the values. To make it simpler we\
    \ have taken standard PI value as 3.14 (constant) in the program. Other details\
    \ are mentioned as comments in the below example program.\n\n#include  <stdio.h>\n\
    \nint main()\n\n{\n\n int circle_radius;\n\n float PI_VALUE=3.14, circle_area,\
    \ circle_circumf;\n\n //Ask user to enter the radius of circle\n\n   printf(\"\
    \\nEnter radius of circle: \");\n\n //Storing the user input into variable circle_radius\n\
    \n   scanf(\"%d\",&circle_radius);\n\n //Calculate and display Area\n\n   circle_area\
    \ = PI_VALUE * circle_radius * circle_radius;\n\n   printf(\"\\nArea of circle\
    \ is: %f\",circle_area);\n\n //Caluclate and display Circumference\n\ncircle_circumf\
    \ = 2 * PI_VALUE * circle_radius;\n\n   printf(\"\\nCircumference of circle is:\
    \ %f\",circle_circumf);\n\n return(0);\n\n}\n\nOutput:\n\nEnter radius of circle:\
    \ 2\n\nArea of circle is: 12.560000\n\nCircumference of circle is: 12.560000\n\
    \nIf you want more accurate results then take PI value as 22/7 instead of 3.14,\
    \ it would give you the exact values of area and circumference.\n\n## 2\\. C Program\
    \ to calculate Area of Equilatral triangle"
