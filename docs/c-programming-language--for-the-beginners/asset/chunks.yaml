    \ of nCr. nCr can also be represented as C(n,r)\n\nThe formula is:\n\nC(n,r) =\
    \ n! / ( r!(n – r)! ). For 0 <= r <= n. Here ! represents factorial. For example:\
    \ C(6, 2) = 6! / (2! * (6-2)!) => 720/(2 * 24) => 15\n\nThe same calculation we\
    \ have done in the following program.\n\n#include  <stdio.h>\n\nint fact(int num);\n\
    \nvoid main()\n\n{\n\n int n, r, ncr_var;\n\n    printf(\"Enter the value of n:\"\
    );\n\n    scanf(\"%d\", &n);\n\n    printf(\"\\nEnter the value of r:\");\n\n\
        scanf(\"%d\", &r);\n\n /* ncr is also represented as C(n,r), the formula is:\n\
    \n     * C(n,r) = n! / ( r!(n - r)! ). For 0 <= r <= n.\n\n     */"
