    \ the value of this string is copied to the destination string. This is the second\
    \ argument of the function.\n\nReturn value of strcpy()\n\nThis function returns\
    \ the pointer to the destination string or you can say that it returns the destination\
    \ string str1.\n\nExample: strcpy() function\n\n#include  <stdio.h>\n\n#include\
    \  <string.h>\n\nint main () {\n\n char str1[20];\n\n char str2[20];\n\n //copying\
