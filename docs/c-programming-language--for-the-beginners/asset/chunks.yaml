  raw: "In this program, we have a variable num of int type. The value of num is 10\
    \ and this value must be stored somewhere in the memory, right? A memory space\
    \ is allocated for each variable that holds the value of that variable, this memory\
    \ space has an address. For example we live in a house and our house has an address,\
    \ which helps other people to find our house. The same way the value of the variable\
    \ is stored in a memory address, which helps the C program to find that value\
    \ when it is needed.\n\nSo let’s say the address assigned to variable num is 0x7fff5694dc58,\
    \ which means whatever value we would be assigning to num should be stored at\
    \ the location: 0x7fff5694dc58. See the diagram below.\n\n#include  <stdio.h>\n\
    \nint main()\n\n{\n\n int num = 10;\n\n   printf(\"Value of variable num is: %d\"\
    , num);\n\n /* To print the address of a variable we use %p\n\n    * format specifier\
    \ and ampersand (&) sign just\n\n    * before the variable name like &num.\n\n\
        */\n\n   printf(\"\\nAddress of variable num is: %p\", &num);\n\n return \
    \ 0;\n\n}\n\nOutput:\n\nValue of variable num is: 10\n\nAddress of variable num\
    \ is: 0x7fff5694dc58\n\n![](Images/image00444.jpeg)\n\nA Simple Example of Pointers\
    \ in C\n\nThis program shows how a pointer is declared and used. There are several\
    \ other things that we can do with pointers, we have discussed them later in this\
    \ guide. For now, we just need to know how to link a pointer to the address of\
    \ a variable.\n\nImportant point to note is: The data type of pointer and the\
    \ variable must match, an int pointer can hold the address of int variable, similarly\
    \ a pointer declared with float data type can hold the address of a float variable.\
    \ In the example below, the pointer and the variable both are of int type.\n\n\
    #include  <stdio.h>\n\nint main()\n\n{\n\n //Variable declaration\n\n int num\
    \ = 10;\n\n //Pointer declaration\n\n int *p;\n\n //Assigning address of num to\
    \ the pointer p\n\np = #\n\n   printf(\"Address of variable num is: %p\", p);\n\
    \n return  0;\n\n}\n\nOutput:\n\nAddress of variable num is: 0x7fff5694dc58\n\n\
    C Pointers – Operators that are used with Pointers\n\nLets discuss the operators\
    \ & and * that are used with Pointers in C.\n\n“Address of”(&) Operator\n\nWe\
    \ have already seen in the first example that we can display the address of a\
    \ variable using ampersand sign. I have used &num to access the address of variable\
    \ num. The & operator is also known as “Address of” Operator.\n\nprintf(\"Address\
    \ of var is: %p\", &num);\n\nPoint to note: %p is a format specifier which is\
    \ used for displaying the address in hex format.\n\nNow that you know how to get\
    \ the address of a variable but how to store that address in some other variable? That’s\
    \ where pointers comes into picture. As mentioned in the beginning of this guide,\
    \ pointers in C programming are used for holding the address of another variables.\n\
    \nPointer is just like another variable, the main difference is that it stores\
    \ address of another variable rather than a value.\n\n“Value at Address”(*) Operator\n\
    \nThe * Operator is also known as Value at address operator.\n\nHow to declare\
    \ a pointer?\n\nint *p1 /*Pointer to an integer variable*/\n\ndouble *p2 /*Pointer\
    \ to a variable of data type double*/\n\nchar *p3 /*Pointer to a character variable*/\n\
    \nfloat *p4 /*pointer to a float variable*/\n\nThe above are the few examples\
    \ of pointer declarations. If you need a pointer to store the address of integer\
    \ variable then the data type of the pointer should be int. Same case is with\
    \ the other data types.\n\nBy using * operator we can access the value of a variable\
    \ through a pointer.\n\nFor example:\n\ndouble a = 10;\n\ndouble *p;\n\np = &a;\n\
    \n*p would give us the value of the variable a. The following statement would\
    \ display 10 as output.\n\nprintf(\"%d\", *p);\n\nSimilarly if we assign a value\
    \ to *pointer like this:\n\n*p = 200;\n\nIt would change the value of variable\
    \ a. The statement above will change the value of a from 10 to 200.\n\nExample\
    \ of Pointer demonstrating the use of & and *\n\n#include  <stdio.h>\n\nint main()\n\
    \n{\n\n /* Pointer of integer type, this can hold the\n\n    * address of a integer\
    \ type variable.\n\n    */\n\n int *p;\n\n int  var = 10;\n\n /* Assigning the\
    \ address of variable var to the pointer\n\n    * p. The p can hold the address\
    \ of var because var is\n\n    * an integer type variable.\n\n    */\n\n   p=\
    \ &var;\n\n   printf(\"Value of variable var is: %d\", var);\n\n   printf(\"\\\
    nValue of variable var is: %d\", *p);\n\n   printf(\"\\nAddress of variable var\
    \ is: %p\", &var);\n\n   printf(\"\\nAddress of variable var is: %p\", p);\n\n\
       printf(\"\\nAddress of pointer p is: %p\", &p);\n\n return  0;\n\n}\n\nOutput:\n\
    \nValue of variable var  is: 10\n\nValue of variable var  is: 10\n\nAddress of\
    \ variable var  is: 0x7fff5ed98c4c\n\nAddress of variable var  is: 0x7fff5ed98c4c\n\
    \nAddress of pointer p is: 0x7fff5ed98c50\n\n![](Images/image00445.jpeg)\n\nLets\
    \ take few more examples to understand it better –\n\nLets say we have a char\
    \ variable ch and a pointer ptr that holds the address of ch.\n\nchar ch='a';\n\
    \nchar *ptr;\n\nRead the value of ch\n\nprintf(\"Value of ch: %c\", ch);\n\nor\n\
    \nprintf(\"Value of ch: %c\", *ptr);\n\nChange the value of ch\n\nch = 'b';\n\n\
    or\n\n*ptr = 'b';\n\nThe above code would replace the value ‘a’ with ‘b’.\n\n\
    Can you guess the output of following C program?\n\n#include  <stdio.h>\n\nint\
    \ main()\n\n{\n\n int  var =10;\n\n int *p;\n\n    p= &var;\n\nprintf ( \"Address\
    \ of var is: %p\", &var);\n\nprintf ( \"\\nAddress of var is: %p\", p);\n\nprintf\
    \ ( \"\\nValue of var is: %d\", var);\n\nprintf ( \"\\nValue of var is: %d\",\
    \ *p);\n\nprintf ( \"\\nValue of var is: %d\", *( &var));\n\n /* Note I have used\
    \ %p for p's value as it represents an address*/\n\nprintf( \"\\nValue of pointer\
    \ p is: %p\", p);\n\nprintf ( \"\\nAddress of pointer p is: %p\", &p);\n\n return\
    \  0;\n\n}\n\nOutput:\n\nAddress of var  is: 0x7fff5d027c58\n\nAddress of var\
    \  is: 0x7fff5d027c58\n\nValue of var  is: 10\n\nValue of var  is: 10\n\nValue\
    \ of var  is: 10\n\nValue of pointer p is: 0x7fff5d027c58\n\nAddress of pointer\
    \ p is: 0x7fff5d027c50\n\nNote:\n\nGo back from here:\n\n[Pointer and Array in\
    \ C programming](#part0000.xhtml_pointerandarray)\n\n[Passing array to function\
    \ in C programming](#part0000.xhtml_passingarrat2fun)\n\n[C – Function Pointer](#part0000.xhtml_Cfunctionpointer)\n\
    \n# 5.2 C – Pointer to Pointer\n\nC – Pointer to Pointer (Double Pointer) with\
    \ example\n\nWe already know that a pointer holds the address of another variable\
    \ of same type. When a pointer holds the address of another pointer then such\
    \ type of pointer is known as pointer-to-pointer or double pointer. In this guide,\
    \ we will learn what is a double pointer, how to declare them and how to use them\
    \ in C programming. To understand this concept, you should know the basics of\
    \ pointers (pointer in c-programming).\n\nHow to declare a Pointer to Pointer\
    \ (Double Pointer) in C?\n\nint **pr;\n\nHere pr is a double pointer. There must\
    \ be two *’s in the declaration of double pointer.\n\nLet’s understand the concept\
    \ of double pointers with the help of a diagram:\n\n![](Images/image00446.jpeg)\n\
    \nAs per the diagram, pr2 is a normal pointer that holds the address of an integer\
    \ variable num. There is another pointer pr1 in the diagram that holds the address\
    \ of another pointer pr2, the pointer pr1 here is a pointer-to-pointer (or double\
    \ pointer).\n\nValues from above diagram:\n\nVariable num has address: XX771230\n\
    \nAddress of Pointer pr1 is: XX661111\n\nAddress of Pointer pr2 is: 66X123X1\n\
    \nExample of double Pointer\n\nLets write a C program based on the diagram that\
    \ we have seen above.\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int num=123;\n\
    \n //A normal pointer pr2\n\n int *pr2;\n\n //This pointer pr2 is a double pointer\n\
    \n int **pr1;\n\n /* Assigning the address of variable num to the\n\n      * pointer\
