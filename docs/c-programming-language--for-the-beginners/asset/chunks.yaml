    \ you can see we have entered two strings and in the output of the program both\
    \ the strings got concatenated.\n\n## 6\\. C program to Reverse a String using\
    \ recursion\n\nHere we have defined a function reverse_string, this function calls\
    \ itself recursively.\n\n#include  <stdio.h>\n\n#include  <string.h>\n\nvoid reverse_string(char*,\
    \ int, int);\n\nint main()\n\n{\n\n //This array would hold the string upto 150\
    \ char\n\n char string_array[150];\n\n    printf(\"Enter any string:\");\n\n   \
    \ scanf(\"%s\", &string_array);\n\n //Calling our user defined function\n\nreverse_string(string_array,\
    \ 0, strlen(string_array)-1);\n\n    printf(\"\\nReversed String is: %s\",string_array);\n\
    \n return  0;\n\n}\n\nvoid reverse_string(char *x, int start, int  end)\n\n{\n\
    \n char ch;\n\n if (start >= end)\n\n return;\n\n    ch = *(x+start);\n\n    *(x+start)\
    \ = *(x+end);\n\n    *(x+end) = ch;\n\n //Function calling itself: Recursion\n\
    \n    reverse_string(x, ++start, --end);\n\n}\n\nOutput:\n\nEnter any string:\
    \ chaitanya\n\nReversed  String  is: aynatiahc\n\n### 8\\. ARRAY PROGRAMS\n\n\
    ## 1\\. C Program to arrange numbers in ascending order\n\nThe following program\
    \ prompts user for the n numbers, once the user is done entering those numbers,\
    \ this program sorts and displays them in ascending order. Here we have created\
    \ a user defined function sort_numbers_ascending() for the sorting purpose.\n\n\
    /*\n\n* C program to accept numbers as an input from user\n\n* and to sort them\
    \ in ascending order.\n\n*/\n\n#include  <stdio.h>\n\nvoid sort_numbers_ascending(int\
    \ number[], int count)\n\n{\n\n int temp, i, j, k;\n\n for (j = 0; j < count;\
    \ ++j)\n\n   {\n\n for (k = j + 1; k < count; ++k)\n\n      {\n\n if (number[j]\
    \ > number[k])\n\n         {\n\n            temp = number[j];\n\n            number[j]\
    \ = number[k];\n\n            number[k] = temp;\n\n         }\n\n      }\n\n  \
    \ }\n\n   printf(\"Numbers in ascending order:\\n\");\n\n for (i = 0; i < count;\
    \ ++i)\n\n      printf(\"%d\\n\", number[i]);\n\n}\n\nvoid main()\n\n{\n\n int\
