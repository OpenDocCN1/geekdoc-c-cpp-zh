  raw: "You would always want to use break statement in a switch case block, otherwise\
    \ once a case block is executed, the rest of the subsequent case blocks will execute.\
    \ For example, if we don’t use the break statement after every case block then\
    \ the output of this program would be:\n\nEnter value of num:2\n\nYou have entered\
    \ value 2\n\nYou have entered value 3\n\nInput value is other than 1,2 & 3\n\n\
    Note:\n\nGo back here\n\n[Switch Case Statement](#part0000.xhtml_switchcase)\n\
    \n# 2.5 C – continue statement with example\n\nThe continue statement is used\
    \ inside loops. When a continue statement is encountered inside a loop, control\
    \ jumps to the beginning of the loop for next iteration, skipping the execution\
    \ of statements inside the body of loop for the current iteration.\n\nSyntax:\n\
    \ncontinue;\n\nFlow diagram of continue statement\n\n![](Images/image00435.jpeg)\n\
    \nExample: continue statement inside for loop\n\n#include  <stdio.h>\n\nint main()\n\
    \n{\n\n for (int j=0; j<=8; j++)\n\n   {\n\n if (j==4)\n\n      {\n\n /* The continue\
    \ statement is encountered when\n\n     * the value of j is equal to 4.\n\n    \
    \ */\n\n continue;\n\n       }\n\n /* This print statement would not execute for\
    \ the\n\n* loop iteration where j ==4  because in that case\n\n* this statement\
    \ would be skipped.\n\n*/\n\n       printf(\"%d \", j);\n\n   }\n\n return  0;\n\
    \n}\n\nOutput:\n\n0  1  2  3  5  6  7  8\n\nValue 4 is missing in the output,\
    \ why? When the value of variable j is 4, the program encountered a continue statement,\
    \ which makes the control to jump at the beginning of the for loop for next iteration,\
    \ skipping the statements for current iteration (that’s the reason printf didn’t\
    \ execute when j is equal to 4).\n\nExample: Use of continue in While loop\n\n\
    In this example we are using continue inside while loop. When using while or do-while\
    \ loop you need to place an increment or decrement statement just above the continue so\
    \ that the counter value is changed for the next iteration. For example, if we\
    \ do not place counter– statement in the body of “if” then the value of counter\
    \ would remain 7 indefinitely.\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \ counter=10;\n\n while (counter >=0)\n\n    {\n\nif (counter==7)\n\n{\n\n     \
    \ counter--;\n\n continue;\n\n}\n\nprintf(\"%d  \", counter);\n\ncounter--;\n\n\
        }\n\n return  0;\n\n}\n\nOutput:\n\n10  9  8  6  5  4  3  2  1  0\n\nThe print\
    \ statement is skipped when counter value was 7.\n\nAnother Example of continue\
    \ in do-While loop\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int j=0;\n\n\
    \ do\n\n   {\n\n if (j==7)\n\n      {\n\n         j++;\n\n continue;\n\n     \
    \ }\n\n      printf(\"%d \", j);\n\n      j++;\n\n   }while(j<10);\n\n return\
    \  0;\n\n}\n\nOutput:\n\n0  1  2  3  4  5  6  8  9\n\nC – goto statement with\
    \ example\n\nThe goto statement is rarely used because it makes program confusing,\
    \ less readable and complex. Also, when this is used, the control of the program\
    \ won’t be easy to trace, hence it makes testing and debugging difficult.\n\n\
    # 2.6 C – goto statement\n\nWhen a goto statement is encountered in a C program,\
    \ the control jumps directly to the label mentioned in the goto statement.\n\n\
    Syntax of goto statement in C\n\ngoto label_name;\n\n..\n\n..\n\nlabel_name: C-statements\n\
    \nFlow Diagram of goto\n\n![Image result for Flow Diagram of goto](Images/image00436.jpeg)\n\
    \nExample of goto statement\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \ sum=0;\n\n for(int i = 0; i<=10; i++){\n\nsum = sum+i;\n\nif(i==5){\n\n goto\
    \ addition;\n\n}\n\n   }\n\n   addition:\n\n   printf(\"%d\", sum);\n\n return\
    \  0;\n\n}\n\nOutput:\n\n15\n\nExplanation: In this example, we have a label addition and\
    \ when the value of i (inside loop) is equal to 5 then we are jumping to this\
    \ label using goto. This is reason the sum is displaying the sum of numbers till\
    \ 5 even though the loop is set to run from 0 to 10.\n\n### CHAPTER 3 - ARRAY\
    \ TUTORIALS IN C\n\n# 3.1 Arrays in C programming\n\nAn array is a group (or collection)\
    \ of same data types. For example an int array holds the elements of int types\
    \ while a float array holds the elements of float types.\n\nWhy we need Array\
    \ in C Programming?\n\nConsider a scenario where you need to find out the average\
    \ of 100 integer numbers entered by user. In C, you have two ways to do this:\
    \ 1) Define 100 variables with int data type and then perform 100 scanf() operations\
    \ to store the entered values in the variables and then at last calculate the\
    \ average of them. 2) Have a single integer array to store all the values, loop\
    \ the array to store all the entered values in array and later calculate the average.\n\
    \nWhich solution is better according to you? Obviously the second solution, it\
    \ is convenient to store same data types in one single variable and later access\
    \ them using array index (we will discuss that later in this tutorial).\n\nHow\
    \ to declare Array in C\n\nint num[35]; /* An integer array of 35 elements */\n\
    \nchar ch[10]; /* An array of characters for 10 elements */\n\nSimilarly an array\
    \ can be of any data type such as double, float, short etc.\n\nHow to access element\
    \ of an array in C\n\nYou can use array subscript (or index) to access any element\
    \ stored in array. Subscript starts with 0, which means arr[0] represents the\
    \ first element in the array arr.\n\nIn general arr[n-1] can be used to access\
    \ nth element of an array. where n is any integer number.\n\nFor example:\n\n\
    int mydata[20];\n\nmydata[0] /* first element of array mydata*/\n\nmydata[19]\
    \ /* last (20th) element of array mydata*/\n\nExample of Array In C programming\
    \ to find out the average of 4 integers\n\n#include  <stdio.h>\n\nint main()\n\
    \n{\n\n int avg = 0;\n\n int sum =0;\n\n int x=0;\n\n /* Array- declaration –\
    \ length 4*/\n\n int num[4];\n\n /* We are using a for loop to traverse through\
    \ the array\n\n     * while storing the entered values in the array\n\n     */\n\
    \n for (x=0; x<4;x++)\n\n    {\n\n        printf(\"Enter number %d \\n\", (x+1));\n\
    \n        scanf(\"%d\", &num[x]);\n\n    }\n\n for (x=0; x<4;x++)\n\n    {\n\n\
            sum = sum+num[x];\n\n    }\n\n    avg = sum/4;\n\n    printf(\"Average\
    \ of entered number is: %d\", avg);\n\n return  0;\n\n}\n\nOutput:\n\nEnter number\
    \ 1\n\n10\n\nEnter number 2\n\n10\n\nEnter number 3\n\n20\n\nEnter number 4\n\n\
    40\n\nAverage of entered number is: 20\n\nLets discuss the important parts of\
    \ the above program:\n\nInput data into the array\n\nHere we are iterating the\
    \ array from 0 to 3 because the size of the array is 4\\. Inside the loop we are\
    \ displaying a message to the user to enter the values. All the input values are\
    \ stored in the corresponding array elements using scanf function.\n\nfor (x=0;\
    \ x<4;x++)\n\n{\n\n    printf(\"Enter number %d \\n\", (x+1));\n\n    scanf(\"\
    %d\", &num[x]);\n\n}\n\nReading out data from an array\n\nSuppose, if we want\
    \ to display the elements of the array then we can use the for loop in C like\
    \ this.\n\nfor (x=0; x<4;x++)\n\n{\n\n    printf(\"num[%d]\\n\", num[x]);\n\n\
    }\n\nVarious ways to initialize an array\n\nIn the above example, we have just\
    \ declared the array and later we initialized it with the values input by user.\
    \ However you can also initialize the array during declaration like this:\n\n\
    int arr[5] = {1, 2, 3, 4 ,5};\n\nOR (both are same)\n\nint arr[] = {1, 2, 3, 4,\
    \ 5};\n\nUn-initialized array always contain garbage values.\n\nC Array – Memory\
    \ representation\n\n![](Images/image00437.jpeg)\n\nNote:\n\nGet back from here:\n\
    \n[Pointer and Array in C programming](#part0000.xhtml_pointerandarray)\n\n[Passing\
    \ array to function in C programming](#part0000.xhtml_passingarrat2fun)\n\n# 3.2\
    \ Two dimensional (2D) arrays\n\nTwo dimensional (2D) arrays in C programming\n\
    \nAn array of arrays is known as 2D array. The two dimensional (2D) array in C\
    \ programming is also known as matrix. A matrix can be represented as a table\
    \ of rows and columns. Before we discuss more about two Dimensional array lets\
    \ have a look at the following C program.\n\nSimple Two dimensional(2D) Array\
    \ Example\n\nFor now don’t worry how to initialize a two dimensional array, we\
    \ will discuss that part later. This program demonstrates how to store the elements\
    \ entered by user in a 2d array and how to display the elements of a two dimensional\
    \ array.\n\n#include<stdio.h>\n\nint main(){\n\n /* 2D array declaration*/\n\n\
    \ int disp[2][3];\n\n /*Counter variables for the loop*/\n\n int i, j;\n\n for(i=0;\
    \ i<2; i++) {"
