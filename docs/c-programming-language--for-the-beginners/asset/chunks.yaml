  trans: "\n该程序检查输入的年份是否为闰年。\n\n## 示例：检查闰年的程序\n\n你可以通过以下数学逻辑来检查某一年份是否是闰年：\n\n**闰年：**\n\
    \n-   如果年份能被 4、100 和 400 整除，那么它就是闰年。\n-   如果年份能被 4 整除但不能被 100 整除，那么它也是闰年。\n\n\
    **非闰年：**\n\n-   如果年份不能被 4 整除，则不是（注：“not be divided”表述不完整）。我们需在 C 语言中正确编写此逻辑。 //\
