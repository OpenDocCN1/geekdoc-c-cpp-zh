    \n return(0);\n\n}\n\nOutput:\n\nEnter a number: 370\n\n370  is an Armstrong \
    \ Number\n\nYou can verify the result like this:\n\n370 = 3*3*3 + 7*7*7 + 0*0*0\n\
    \n= 27 + 343 + 0\n\n= 370\n\nAs you can see that sum of digits of number 370 is\
    \ equal to the number itself.\n\n## 12\\. C Program to check if a number is palindrome\
    \ or not\n\nIf a number remains same, even if we reverse its digits then the number\
    \ is known as palindrome number. For example 12321 is a palindrome number because\
    \ it remains same if we reverse its digits. In this article we have shared two\
    \ C programs to check if the input number is palindrome or not. 1) using while\
    \ loop 2) using recursion.\n\nProgram 1: check palindrome using while loop\n\n\
    /* Program to check if a number is palindrome or not\n\n* using while loop\n\n\
    */\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int num, reverse_num=0, remainder,temp;\n\
    \n   printf(\"Enter an integer: \");\n\n   scanf(\"%d\", &num);\n\n /* Here we\
    \ are generating a new number (reverse_num)\n\n    * by reversing the digits of\
    \ original input number\n\n    */\n\n   temp=num;\n\n while(temp!=0)\n\n   {\n\
    \n      remainder=temp%10;\n\n      reverse_num=reverse_num*10+remainder;\n\n\
          temp/=10;\n\n   }\n\n /* If the original input number (num) is equal to\n\
    \n    * to its reverse (reverse_num) then its palindrome\n\n    * else it is not.\n\
    \n    */\n\n if(reverse_num==num)\n\n      printf(\"%d is a palindrome number\"\
    ,num);\n\n else\n\n      printf(\"%d is not a palindrome number\",num);\n\n return\
    \  0;\n\n}\n\nOutput:\n\n![checking_palindrome_number_output](Images/image00447.jpeg)\n\
    \nProgram 2: check palindrome using recursion\n\n#include<stdio.h>\n\nint check_palindrome(int\
    \ num){\n\n static  int reverse_num=0,rem;\n\n if(num!=0){\n\n      rem=num%10;\n\
    \n      reverse_num=reverse_num*10+rem;\n\n      check_palindrome(num/10);\n\n\
       }\n\n return reverse_num;\n\n}\n\nint main(){\n\n int num, reverse_num;\n\n\
       printf(\"Enter a number: \");\n\n   scanf(\"%d\",&num);\n\n   reverse_num =\
    \ check_palindrome(num);\n\n if(num==reverse_num)\n\n      printf(\"%d is a palindrome\
    \ number\",num);\n\n else\n\n      printf(\"%d is not a palindrome number\",num);\n\
    \n return  0;\n\n}\n\nOutput:\n\n![palindrome_using_recursion](Images/image00448.jpeg) \n\
    \n## 13\\. C Program to find Palindrome numbers in a given range\n\nIn this tutorial\
    \ we will learn how to find palindrome numbers in a given range.\n\nC Program\
    \ – Generating palindrome numbers in a given range\n\n#include<stdio.h>\n\nint\
    \ main(){\n\n int num, rem, reverse_num, temp, start, end;\n\n   printf(\"Enter\
    \ the lower limit: \");\n\n   scanf(\"%d\",&start);\n\n   printf(\"Enter the upper\
    \ limit: \");\n\n   scanf(\"%d\",&end);\n\n   printf(\"Palindrome numbers between\
    \ %d and %d are: \",start,end);\n\n for(num=start;num<=end;num++){\n\n      temp=num;\n\
    \n      reverse_num=0;\n\n while(temp){\n\n         rem=temp%10;\n\n         temp=temp/10;\n\
    \n         reverse_num=reverse_num*10+rem;\n\n      }\n\n if(num==reverse_num)\n\
    \n         printf(\"%d \",num);\n\n   }\n\n return  0;\n\n}\n\nOutput:\n\n![generating_palindrome_numbers_in_a_range](Images/image00449.jpeg)\n\
    \n## 14\\. C Program to check if number is even or odd\n\nIf a number is exactly\
    \ divisible by 2 then its an even number else it is an odd number. In this article\
    \ we have shared two ways(Two C programs) to check whether the input number is\
    \ even or odd. 1) Using Modulus operator(%) 2) Using Bitwise operator.\n\nProgram\
    \ 1: Using Modulus operator\n\n/* Program to check whether the input integer number\n\
    \n* is even or odd using the modulus operator (%)\n\n*/\n\n#include<stdio.h>\n\
    \nint main()\n\n{\n\n // This variable is to store the input number\n\n int num;\n\
    \n   printf(\"Enter an integer: \");\n\n   scanf(\"%d\",&num);\n\n // Modulus\
    \ (%) returns remainder\n\n if ( num%2 == 0 )\n\n      printf(\"%d is an even\
    \ number\", num);\n\n else\n\n      printf(\"%d is an odd number\", num);\n\n\
    \ return  0;\n\n}\n\nOutput:\n\n![checking_even_odd_modulus_cmd](Images/image00450.jpeg) \n\
    \n## 15\\. C Program to Find ASCII value of a Character\n\nASCII value represents\
    \ the English characters as numbers, each letter is assigned a number from 0 to\
    \ 127. For example, the ASCII value for uppercase Q is 81.\n\nExample 1: Program\
    \ to display ASCII value of a character entered by user\n\nThis program takes\
    \ the character entered by user and displays the ASCII value of it.\n\n#include\
    \  <stdio.h>\n\nint main()\n\n{\n\n char ch;\n\n    printf(\"Enter any character:\"\
    );\n\n /* Reads the entered character and stores it\n\n     * into the char variable\
    \ ch\n\n     */\n\n    scanf(\"%c\", &ch);\n\n /* Using the format specifiers\
    \ we can get the ASCII code\n\n     * of a character. When we use %d format specifier\
    \ for a\n\n     * char variable then it displays the ASCII value of a char\n\n\
         */\n\n    printf(\"ASCII value of character %c is: %d\", ch, ch);\n\n return\
    \  0;\n\n}\n\nOutput:\n\nEnter any character:Q\n\nASCII value of character Q is:\
    \ 81\n\n## 16\\. C Program to find the Size of int, float, double and char\n\n\
    This program finds the size of data types such as char, int, float, double.\n\n\
    Example: Program to find the size of data types in C\n\nIn this program, we are\
    \ using the sizeof() operator to find the size of data types. When the sizeof\
    \ is used with the primitive data types such as int, float, double and char then\
    \ it returns the amount of the memory allocated to them.\n\n#include<stdio.h>\n\
    \nint main()\n\n{\n\n    printf(\"Size of char: %ld byte\\n\",sizeof(char));\n\
    \n    printf(\"Size of int: %ld bytes\\n\",sizeof(int));\n\n    printf(\"Size\
    \ of float: %ld bytes\\n\",sizeof(float));\n\n    printf(\"Size of double: %ld\
    \ bytes\", sizeof(double));\n\n return  0;\n\n}\n\nOutput:\n\nSize of char: 1\
    \  byte\n\nSize of int: 4 bytes\n\nSize of float: 4 bytes\n\nSize of double: 8\
    \ bytes\n\n## 17\\. C Program to Check whether an Alphabet is Vowel or Consonant\n\
    \nThis program checks whether the input character is vowel or consonant.\n\nExample:\
    \ Program to check Vowel or Consonant\n\nThis program takes the character value(entered\
    \ by user) as input and checks whether that character is a vowel or consonant\
    \ using if-else statement. Since a user is allowed to enter an alphabet in lowercase\
    \ and uppercase, the program checks for both uppercase and lowercase vowels and\
    \ consonants. To understand this program, you should be familiar with the following\
    \ C Programming concepts:\n\n[C Programming if statement](#part0000.xhtml_ifstate)\n\
    \n[C Programming if..else statement](#part0000.xhtml_ifelse)\n\n#include  <stdio.h>\n\
    \nint main()\n\n{\n\n char ch;\n\n bool isVowel = false;\n\n    printf(\"Enter\
    \ an alphabet: \");\n\n    scanf(\"%c\",&ch);\n\n if(ch=='a'||ch=='A'||ch=='e'||ch=='E'||ch=='i'||ch=='I'\n\
    \n ||ch=='o'||ch=='O'||ch=='u'||ch=='U')\n\n    {\n\n isVowel = true;\n\n    }\n\
    \n if (isVowel == true)\n\n        printf(\"%c is a Vowel\", ch);\n\n else\n\n\
            printf(\"%c is a Consonant\", ch);\n\n return  0;\n\n}\n\nOutput:\n\n\
    Enter an alphabet: E\n\nE is a Vowel\n\n## 18. C Program to check Leap Year"
