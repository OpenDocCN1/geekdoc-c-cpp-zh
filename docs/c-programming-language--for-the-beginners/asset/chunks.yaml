  raw: "int main()\n\n{\n\n char s1[20] = \"BeginnersBook\";\n\n char s2[20] = \"\
    BeginnersBook.COM\";\n\n if (strcmp(s1, s2) ==0)\n\n     {\n\n        printf(\"\
    string 1 and string 2 are equal\");\n\n     }else\n\n      {\n\n         printf(\"\
    string 1 and 2 are different\");\n\n      }\n\n return  0;\n\n}\n\nOutput:\n\n\
    string  1  and  2 are different\n\n## 3.6.4 C String function – strncmp\n\nint\
    \ strncmp(const  char *str1, const  char *str2, size_t n)\n\nsize_t is for unassigned\
    \ short.It compares both the string till n characters or in other words it compares\
    \ first n characters of both the strings.\n\nExample of strncmp:\n\n#include \
    \ <stdio.h>\n\n#include  <string.h>\n\nint main()\n\n{\n\n char s1[20] = \"BeginnersBook\"\
    ;\n\n char s2[20] = \"BeginnersBook.COM\";\n\n /* below it is comparing first\
    \ 8 characters of s1 and s2*/\n\n if (strncmp(s1, s2, 8) ==0)\n\n     {\n\n        \
    \ printf(\"string 1 and string 2 are equal\");\n\n     }else\n\n     {\n\n        \
    \ printf(\"string 1 and 2 are different\");\n\n     }\n\n return  0;\n\n}\n\n\
    Output:\n\nstring1 and  string  2 are equal\n\n## 3.6.5 C String function – strcat\n\
    \nchar *strcat(char *str1, char *str2)\n\nIt concatenates two strings and returns\
    \ the concatenated string.\n\nExample of strcat:\n\n#include  <stdio.h>\n\n#include\
    \  <string.h>\n\nint main()\n\n{\n\n char s1[10] = \"Hello\";\n\n char s2[10]\
    \ = \"World\";\n\n     strcat(s1,s2);\n\n     printf(\"Output string after concatenation:\
    \ %s\", s1);\n\n return  0;\n\n}\n\nOutput:\n\nOutput  string after concatenation:\
    \ HelloWorld\n\n## 3.6.6 C String function – strncat\n\nchar *strncat(char *str1,\
    \ char *str2, int n)\n\nIt concatenates n characters of str2 to string str1\\\
    . A terminator char (‘\\0’) will always be appended at the end of the concatenated\
    \ string.\n\nExample of strncat:\n\n#include  <stdio.h>\n\n#include  <string.h>\n\
    \nint main()\n\n{\n\n char s1[10] = \"Hello\";\n\n char s2[10] = \"World\";\n\n\
    strncat(s1,s2, 3);\n\n     printf(\"Concatenation using strncat: %s\", s1);\n\n\
    \ return  0;\n\n}\n\nOutput:\n\nConcatenation  using strncat: HelloWor\n\nC String\
    \ function – strcpy\n\nchar *strcpy( char *str1, char *str2)\n\nIt copies the\
    \ string str2 into string str1, including the end character (terminator char ‘\\\
    0’).\n\nExample of strcpy:\n\n#include  <stdio.h>\n\n#include  <string.h>\n\n\
    int main()\n\n{\n\n char s1[30] = \"string 1\";\n\n char s2[30] = \"string 2 :\
    \ I’m gonna copied into s1\";\n\n /* this function has copied s2 into s1*/\n\n\
         strcpy(s1,s2);\n\n     printf(\"String s1 is: %s\", s1);\n\n return  0;\n\
    \n}\n\nOutput:\n\nString s1 is: string  2: I’m gonna copied into s1\n\n## 3.6.7\
    \ C String function – strncpy\n\nchar *strncpy( char *str1, char *str2, size_t\
    \ n) size_t is unassigned short and n is a number.\n\nCase1: If length of str2\
    \ > n then it just copies first n characters of str2 into str1.\n\nCase2: If length\
    \ of str2 < n then it copies all the characters of str2 into str1 and appends\
    \ several terminator chars(‘\\0’) to accumulate the length of str1 to make it\
    \ n.\n\nExample of strncpy:\n\n#include  <stdio.h>\n\n#include  <string.h>\n\n\
    int main()\n\n{\n\n char first[30] = \"string 1\";\n\n char second[30] = \"string\
    \ 2: I’m using strncpy now\";\n\n /* this function has copied first 10 chars of\
    \ s2 into s1*/\n\nstrncpy(s1,s2, 12);\n\n     printf(\"String s1 is: %s\", s1);\n\
    \n return  0;\n\n}\n\nOutput:\n\nString s1 is: string  2: I’m\n\n## 3.6.8 C String\
    \ function – strchr\n\nchar *strchr(char *str, int ch)\n\nIt searches string str\
    \ for character ch (you may be wondering that in above definition I have given\
    \ data type of ch as int, don’t worry I didn’t make any mistake it should be int\
    \ only. The thing is when we give any character while using strchr then it internally\
    \ gets converted into integer for better searching.\n\nExample of strchr:\n\n\
    #include  <stdio.h>\n\n#include  <string.h>\n\nint main()\n\n{\n\n char mystr[30]\
    \ = \"I’m an example of function strchr\";\n\n     printf (\"%s\", strchr(mystr,\
    \ 'f'));\n\n return  0;\n\n}\n\nOutput:\n\nf function strchr\n\n## 3.6.9 C String\
    \ function – Strrchr\n\nchar *strrchr(char *str, int ch)\n\nIt is similar to the\
    \ function strchr, the only difference is that it searches the string in reverse\
    \ order, now you would have understood why we have extra r in strrchr, yes you\
    \ guessed it correct, it is for reverse only.\n\nNow let’s take the same above\
    \ example:\n\n#include  <stdio.h>\n\n#include  <string.h>\n\nint main()\n\n{\n\
    \n char mystr[30] = \"I’m an example of function strchr\";\n\n     printf (\"\
    %s\", strrchr(mystr, 'f'));\n\n return  0;\n\n}\n\nOutput:\n\nfunction strchr\n\
    \nWhy output is different than strchr? It is because it started searching from\
    \ the end of the string and found the first ‘f’ in function instead of ‘of’.\n\
    \n## 3.6.10 C String function – strstr\n\nchar *strstr(char *str, char *srch_term)\n\
    \nIt is similar to strchr, except that it searches for string srch_term instead\
    \ of a single char.\n\nExample of strstr:\n\n#include  <stdio.h>\n\n#include \
    \ <string.h>\n\nint main()\n\n{\n\n char inputstr[70] = \"String Function in C\
    \ at BeginnersBook.COM\";\n\n     printf (\"Output string is: %s\", strstr(inputstr,\
    \ 'Begi'));\n\n return  0;\n\n}\n\nOutput:\n\nOutput  string  is: BeginnersBook.COM\n\
    \nYou can also use this function in place of strchr as you are allowed to give\
    \ single char also in place of search_term string.\n\n### CHAPTER 4 -  FUNCTIONS\
    \ AND STRUCTURES IN C\n\n# 4.1 Functions in C Programming\n\nA function is a block\
    \ of statements that performs a specific task. Suppose you are building an application\
    \ in C language and in one of your program, you need to perform a same task more\
    \ than once. In such case you have two options –\n\na) Use the same set of statements\
    \ every time you want to perform the task\n\nb) Create a function to perform that\
    \ task, and just call it every time you need to perform that task.\n\nUsing option\
    \ (b) is a good practice and a good programmer always uses functions while writing\
    \ codes in C.\n\nTypes of functions\n\n1) Predefined standard library functions –\
    \ such as puts(), gets(), printf(), scanf() etc – These are the functions which\
    \ already have a definition in header files (.h files like stdio.h), so we just\
    \ call them whenever there is a need to use them.\n\n2) User Defined functions\
    \ – The functions that we create in a program are known as user defined functions.\n\
    \nIn this guide, we will learn how to create user defined functions and how to\
    \ use them in C Programming\n\nWhy we need functions in C\n\nFunctions are used\
    \ because of following reasons –\n\na) To improve the readability of code.\n\n\
    b) Improves the reusability of the code, same function can be used in any program\
    \ rather than writing the same code from scratch.\n\nc) Debugging of the code\
    \ would be easier if you use functions, as errors are easy to be traced.\n\nd) Reduces\
    \ the size of the code, duplicate set of statements are replaced by function calls.\n\
    \nSyntax of a function\n\nreturn_type function_name (argument list)\n\n{\n\n Set\
    \ of statements – Block of code\n\n}\n\nreturn_type: Return type can be of any\
    \ data type such as int, double, char, void, short etc. Don’t worry you will understand\
    \ these terms better once you go through the examples below.\n\nfunction_name: It\
    \ can be anything, however it is advised to have a meaningful name for the functions\
    \ so that it would be easy to understand the purpose of function just by seeing\
    \ it’s name.\n\nargument list: Argument list contains variables names along with\
    \ their data types. These arguments are kind of inputs for the function. For example\
    \ – A function which is used to add two integer variables, will be having two\
    \ integer argument.\n\nBlock of code: Set of C statements, which will be executed\
    \ whenever a call will be made to the function.\n\nDo you find above terms confusing?\
    \ – Do not worry I’m not gonna end this guide until you learn all of them :)\n\
    \nLet us take an example – Suppose you want to create a function to add two integer\
    \ variables.\n\nLet us split the problem so that it would be easy to understand\
    \ –\n\nFunction will add the two numbers so it should have some meaningful name\
    \ like sum, addition, etc. For example lets take the name addition for this function.\n\
    \nreturn_type addition(argument list)"
