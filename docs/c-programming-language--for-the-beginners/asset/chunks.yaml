  raw: "This program checks whether the input year is leap year or not.\n\nExample:\
    \ Program to check Leap Year\n\nYou can check whether a year is leap or not by\
    \ using this mathematical logic:\n\nLeap Year:\n\nIf a year is divisible by 4,\
    \ 100 and 400 then it is a leap year.\n\nIf a year is divisible by 4 but not divisible\
    \ by 100 then it is a leap year\n\nNot a Leap Year:\n\nIf a year is not divisible\
    \ by 4 then it is not a leap year\n\nIf a year is divisible by 4 and 100 but not\
    \ divisible by 400 then it is not a leap year\n\nLets write this logic in a C\
    \ Program. To understand this program you should have the knowledge of following\
    \ C Programming topic:\n\n[C Programming If..else, Nested if..else](#part0000.xhtml_ifelse)\n\
    \n#include  <stdio.h>\n\nint main()\n\n{\n\n int y;\n\n    printf(\"Enter year:\
    \ \");\n\n    scanf(\"%d\",&y);\n\n if(y % 4 == 0)\n\n    {\n\n //Nested if else\n\
    \n if( y % 100 == 0)\n\n        {\n\n if ( y % 400 == 0)\n\n                printf(\"\
    %d is a Leap Year\", y);\n\n else\n\n                printf(\"%d is not a Leap\
    \ Year\", y);\n\n        }\n\n else\n\n            printf(\"%d is a Leap Year\"\
    , y );\n\n    }\n\n else\n\n        printf(\"%d is not a Leap Year\", y);\n\n\
    \ return  0;\n\n}\n\nOutput:\n\nEnter year: 1991\n\n1991  is  not a Leap  Year\n\
    \n## 19. C Program to find the Sum of First n Natural numbers\n\nProgram to find\
    \ the sum of first n natural numbers. We will see two C programs to calculate\
    \ the sum of natural numbers. In the first C program we are using for loop for\
    \ find the sum and in the second program we are doing the same using while loop.\n\
    \nTo understand these programs, you should be familiar with the following C  Programming\
    \ Concepts:\n\n[C Programming for loop](#part0000.xhtml_cforloop)\n\n[C Programming\
    \ while loop](#part0000.xhtml_whileloop)\n\nExample 1: Program to find sum of\
    \ natural numbers using for loop\n\nThe user enters the value of n and the program\
    \ calculate the sum of first n natural numbers using for loop.\n\n#include  <stdio.h>\n\
    \nint main()\n\n{\n\n int n, count, sum = 0;\n\n    printf(\"Enter the value of\
    \ n(positive integer): \");\n\n    scanf(\"%d\",&n);\n\n for(count=1; count <=\
    \ n; count++)\n\n    {\n\n        sum = sum + count;\n\n    }\n\n    printf(\"\
    Sum of first %d natural numbers is: %d\",n, sum);\n\n return  0;\n\n}\n\nOutput:\n\
    \nEnter the value of n(positive integer): 6\n\nSum of first 6 natural numbers\
    \ is: 21\n\nExample 2: Find the sum of natural numbers using while loop\n\n#include\
    \  <stdio.h>\n\nint main()\n\n{\n\n int n, count, sum = 0;\n\n    printf(\"Enter\
    \ the value of n(positive integer): \");\n\n    scanf(\"%d\",&n);\n\n /* When\
    \ you use while loop, you have to initialize the\n\n     * loop counter variable\
    \ before the loop and increment\n\n     * or decrement it inside the body of loop\
    \ like we did\n\n     * for the variable \"count\"\n\n     */\n\n    count=1;\n\
    \n while(count <= n){\n\n sum = sum + count;\n\n count++;\n\n    }\n\n    printf(\"\
    Sum of first %d natural numbers is: %d\",n, sum);\n\n return  0;\n\n}\n\nOutput:\n\
    \nEnter the value of n(positive integer): 7\n\nSum of first 7 natural numbers\
    \ is: 28\n\n### 7\\. STRING PROGRAMS\n\n## 1\\. C Program to convert uppercase\
    \ string to lowercase string\n\nIn the following C program, user would be asked\
    \ to enter a String (it can be in complete uppercase or partial uppercase) and\
    \ then the program would convert it into a complete(all characters in lower case)\
    \ lower case string. The logic we have used in the following program is: All the\
    \ upper case characters (A-Z) have ASCII value ranging from 65 to 90 and their\
    \ corresponding lower case characters (a-z) have ASCII value 32 greater than them.\
    \ For example ‘A‘ has a ASCII value 65 and ‘a‘ has a ASCII value 97 (65+32). Same\
    \ applies for other characters.\n\n/* C program to convert uppercase string to\n\
    \n* lower case\n\n* written by: Chaitanya\n\n*/\n\n#include<stdio.h>\n\n#include<string.h>\n\
    \nint main(){\n\n /* This array can hold a string of upto 25\n\n    * chars, if\
    \ you are going to enter larger string\n\n    * then increase the array size accordingly\n\
    \n    */\n\n char str[25];\n\n int i;\n\n   printf(\"Enter the string: \");\n\n\
       scanf(\"%s\",str);\n\n for(i=0;i<=strlen(str);i++){\n\n if(str[i]>=65&&str[i]<=90)\n\
    \n         str[i]=str[i]+32;\n\n   }\n\n   printf(\"\\nLower Case String is: %s\"\
    ,str);\n\n return  0;\n\n}\n\nOutput:\n\n![uppercase_to_lowercase_string_output](Images/image00451.jpeg)\n\
    \nAs you can see in the output that we have entered a partial (only few chars\
    \ were in upper case) upper case string and the program output was a complete\
    \ lower case string.\n\n## 2\\. C Program to convert lowercase string to uppercase\
    \ string\n\nIn the following program, user would be asked to enter a lower case\
    \ String and the program would convert it into a Upper case String. Logic followed\
    \ in the program: All lower case characters (a to z) have ASCII values ranging\
    \ from 97 to 122 and their corresponding upper case characters (A to Z) have ASCII\
    \ values 32 less than them. For example ‘a’ has a ASCII value 97 and ‘A’ has a\
    \ ASCII value 65 (97-32). Same applies for other alphabets. Based on this logic\
    \ we have written the below C program for conversion.\n\nC program – Conversion\
    \ of a String from lowercase to uppercase\n\n/* C Program to convert Lower case\n\
    \n* String to Upper case.\n\n* Written by: Chaitanya\n\n*/\n\n#include<stdio.h>\n\
    \n#include<string.h>\n\nint main(){\n\n char str[25];\n\n int i;\n\n   printf(\"\
    Enter the string:\");\n\n   scanf(\"%s\",str);\n\n for(i=0;i<=strlen(str);i++){\n\
    \n if(str[i]>=97&&str[i]<=122)\n\n         str[i]=str[i]-32;\n\n   }\n\n   printf(\"\
    \\nUpper Case String is: %s\",str);\n\n return  0;\n\n}\n\nOutput:\n\n![lowercase_to_uppercase_output](Images/image00452.jpeg)\n\
    \nAs you can observe in the above screenshot, we have entered a lower case string(beginnersbook.com)\
    \ and the program converted into a Upper case string (BEGINNERSBOOK.COM)\n\n##\
    \ 3\\. C Program to Sort set of strings in alphabetical order\n\nIn the following\
    \ program user would be asked to enter a set of Strings and the program would\
    \ sort and display them in ascending alphabetical order.\n\nC Program – Sorting\
    \ of a Set of Strings in Ascending alphabetical order\n\n/* This program would\
    \ sort the input strings in\n\n* an ascending order and would display the same\n\
    \n*/\n\n#include<stdio.h>\n\n#include<string.h>\n\nint main(){\n\n int i,j,count;\n\
    \n char str[25][25],temp[25];\n\n   puts(\"How many strings u are going to enter?:\
    \ \");\n\n   scanf(\"%d\",&count);\n\n   puts(\"Enter Strings one by one: \");\n\
    \n for(i=0;i<=count;i++)\n\n      gets(str[i]);\n\n for(i=0;i<=count;i++)\n\n\
    \ for(j=i+1;j<=count;j++){\n\n if(strcmp(str[i],str[j])>0){\n\n            strcpy(temp,str[i]);\n\
    \n            strcpy(str[i],str[j]);\n\n            strcpy(str[j],temp);\n\n        \
    \ }\n\n      }\n\n   printf(\"Order of Sorted Strings:\");\n\n for(i=0;i<=count;i++)\n\
    \n      puts(str[i]);\n\n return  0;\n\n}\n\nOutput:\n\n![sorted_strings_ascending](Images/image00453.jpeg)\n\
    \nAs you can observe in the above screenshot of output that we have entered 5\
    \ strings and the program then sorted them in ascending order. We got a sorted\
    \ set of strings as output.\n\n## 4\\. C program to find the length of a String\
    \ without using function strlen()\n\nIn the following C program we are counting\
    \ the number of characters in a given String to find out and display its length\
    \ on console. Upon execution of this program, the user would be asked to enter\
    \ a string, then the program would count the chars and would display the length\
    \ of input string as output.\n\nC Program – finding length of a String without\
    \ using standard library function strlen\n\n/* C Program to find the length of\
    \ a String without\n\n*  using any standard library function\n\n*/\n\n#include\
    \  <stdio.h>\n\nint main()\n\n{\n\n /* Here we are taking a char array of size\n\
    \n     * 100 which means this array can hold a string\n\n     * of 100 chars.\
    \ You can change this as per requirement\n\n     */\n\n char str[100],i;\n\n   \
    \ printf(\"Enter a string: \\n\");\n\n    scanf(\"%s\",str);\n\n // '\\0' represents\
    \ end of String\n\n for(i=0; str[i]!='\\0'; ++i);\n\n       printf(\"\\nLength\
    \ of input string: %d\",i);\n\n return  0;\n\n}\n\nOutput:\n\n![string_length_output](Images/image00454.jpeg)\n\
    \n## 5\\. C Program to concatenate two strings without using strcat"
