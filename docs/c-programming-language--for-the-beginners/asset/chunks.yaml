    Note: File opening modes are `rb` and `wb` instead of `r` & `w`..\n\n# C TUTORIALS\
    \ ON LIBRARY FUNCTIONS\n\n## C strcat() Function\n\nThe `strcat()` function is\
    \ used for string concatenation. It concatenates the specified string at the end\
    \ of the another specified string. In this tutorial, we will see the `strcat()`\
    \ function with example.\n\n### C strcat() Declaration\n\n`char *strcat(char *str1,\
    \ const char *str2)`\n\nThis function takes two pointer as arguments and returns\
    \ the pointer to the destination string after concatenation.\n\n- `str1` – pointer\
    \ to the destination string.\n- `str2` – pointer to the source string which is\
    \ appended to the destination string.\n\n### Example: C strcat() function\n\n\
    ```c\n#include <stdio.h>\n#include <string.h>\n\nint main () {\n    char str1[50],\
    \ str2[50];\n    //destination string\n    strcpy(str1, \"This is my initial string\"\
    );\n    //source string\n    strcpy(str2, \", add this\");\n    //concatenating\
    \ the string str2 to the string str1\n    strcat(str1, str2);\n    //displaying\
    \ destination string\n    printf(\"String after concatenation: %s\", str1);\n\
    \    return(0);\n}\n```\n\n**Output:**\nString after concatenation: This is my\
    \ initial string, add this\n\nAs you can see that we have appended the string\
    \ `str2` at the end of the string `str1`. The order in which we pass the arguments\
    \ to the function `strcpy` matters, the first argument specifies the output string\
    \ while the seconds argument specifies the other string which is appended at the\
    \ end of the output string.\n\nAs discussed in the beginning of the post that\
    \ this function returns the pointer to the destination string. This means that\
    \ if we display the returned value of this function then it should display the\
    \ destination string(the string `str1` in our example). Lets modify our code little\
    \ bit to verify this.\n\n```c\n#include <stdio.h>\n#include <string.h>\n\nint\
    \ main () {\n    char str1[50], str2[50];\n    //destination string\n    strcpy(str1,\
    \ \"This is my initial string\");\n    //source string\n    strcpy(str2, \", add\
    \ this\");\n    //displaying destination string\n    printf(\"String after concatenation:\
    \ %s\", strcat(str1, str2));\n    return(0);\n}\n```\n\n**Output:**\nString after\
    \ concatenation: This is my initial string, add this\n\n## C strncat() Function\
    \ with example\n\nIn the last tutorial we discussed `strcat()` function, which\
    \ is used for concatenation of one string to another string. In this guide, we\
    \ will see a similar function `strncat()`, which is same as `strcat()` except\
    \ that `strncat()` appends only the specified number of characters to the destination\
    \ string.\n\n### C strncat() Function Declaration\n\n`char *strncat(char *str1,\
    \ const char *str2, size_t n)`\n\n- `str1` – Destination string.\n- `str2` – Source\
    \ string which is appended at the end of destination string `str1`.\n- `n` – number\
    \ of characters of source string `str2` that needs to be appended. For e.g. if\
    \ this is 5 then only the first 5 characters of source string `str2` would be\
    \ appended at the end of destination string `str1`.\n\n**Return value:**\nThis\
    \ function returns the pointer to the destination string `str1`.\n\n### Example:\
    \ strncat() Function in C\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n\
    int main () {\n    char str1[50], str2[50];\n    //destination string\n    strcpy(str1,\
    \ \"This is my initial string\");\n    //source string\n    strcpy(str2, \", add\
    \ this\");\n    //displaying destination string\n    printf(\"String after concatenation:\
    \ %s\\n\", strncat(str1, str2, 5));\n    // this should be same as return value\
    \ of strncat()\n    printf(\"Destination String str1: %s\", str1);\n    return\
    \ 0;\n}\n```\n\n**Output:**\nString after concatenation: This is my initial string,\
    \ add this\nDestination String str1: This is my initial string\n\nAs you can see\
    \ that we have appended the string `str2` at the end of the string `str1`. The\
    \ order in which we pass the arguments to the function `strcpy` matters, the first\
    \ argument specifies the output string while the seconds argument specifies the\
    \ other string which is appended at the end of the output string.\n\n## C strchr()\
    \ Function\n\nThe `strchr()` function searches the first occurrence of a character\
    \ in a string.\n\n### C strchr() Declaration\n\n`char *strchr(const char *str,\
    \ int ch)`\n\n- `str` – The string\n- `ch` – The character searched\n\n**Return\
    \ value of strchr():**\nIt returns the pointer to the first occurrence of `ch`\
    \ in `str`, or `NULL`.\n\n### Example: strchr() Function \n\n```c\n#include <stdio.h>\n\
    #include <string.h>\n\nint main () {\n    const char str[] = \"This is a String\"\
    ;\n    const char ch = 'u';\n    char *p;\n    p = strchr(str, ch);\n    printf(\"\
    String from %c is: %s\", ch, p);\n    return 0;\n}\n```\n\n**Output:**\nString\
    \ from u is: a String\n\n## C strcmp() Function\n\nThe `strcmp()` function compares\
    \ two strings and returns an integer value.\n\n### C strcmp() function declaration\n\
    \n`int strcmp(const char *str1, const char *str2)`\n\n- `str1` – The first string\n\
    - `str2` – The second string\n\n**Return value of strcmp():**\nThis function returns\
