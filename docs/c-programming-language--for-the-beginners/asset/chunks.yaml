  raw: "{\n\n //These statements would execute if all the conditions return false.\n\
    \n}\n\nExample of else..if statement\n\nLets take the same example that we have\
    \ seen above while discussing nested if..else. We will rewrite the same program\
    \ using else..if statements.\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \ var1, var2;\n\n   printf(\"Input the value of var1:\");\n\n   scanf(\"%d\",\
    \ &var1);\n\n   printf(\"Input the value of var2:\");\n\n   scanf(\"%d\",&var2);\n\
    \n if (var1 !=var2)\n\n   {\n\nprintf(\"var1 is not equal to var2\\n\");\n\n  \
    \ }\n\n else  if (var1 > var2)\n\n   {\n\nprintf(\"var1 is greater than var2\\\
    n\");\n\n   }\n\n else  if (var2 > var1)\n\n   {\n\nprintf(\"var2 is greater than\
    \ var1\\n\");\n\n   }\n\n else\n\n   {\n\nprintf(\"var1 is equal to var2\\n\"\
    );\n\n   }\n\n return  0;\n\n}\n\nOutput:\n\nInput the value of var1:12\n\nInput\
    \ the value of var2:21\n\nvar1 is  not equal to var2\n\nNote:As you can see that\
    \ only the statements inside the body of “if” are executed. This is because in\
    \ this statement as soon as a condition is satisfied, the statements inside that\
    \ block are executed and rest of the blocks are ignored.\n\nImportant Points:\n\
    \n1\\. else and else..if are optional statements, a program having only “if” statement\
    \ would run fine.\n\n2\\. else and else..if cannot be used without the “if”.\n\
    \n3\\. There can be any number of else..if statement in a if else..if block.\n\
    \n4\\. If none of the conditions are met then the statements in else block gets\
    \ executed.\n\n5\\. Just like relational operators, we can also use logical operators\
    \ such as AND (&&), OR(||) and NOT(!).\n\n#  1.8 Switch Case Statement\n\nC –\
    \ switch case statement in C Programming with example\n\nThe switch case statement is\
    \ used when we have multiple options and we need to perform a different task for\
    \ each option.\n\nC – Switch Case Statement\n\nSyntax:\n\nswitch (variable or\
    \ an integer expression)\n\n{\n\n case constant:\n\n //C Statements\n\n     ;\n\
    \n case constant:\n\n //C Statements\n\n     ;\n\n default:\n\n //C Statements\n\
    \n     ;\n\n}\n\nFlow Diagram of Switch Case\n\n![](Images/image00430.jpeg)\n\n\
    Example of Switch Case in C\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \ num=2;\n\n switch(num+2)\n\n     {\n\n case  1:\n\n           printf(\"Case1:\
    \ Value is: %d\", num);\n\n case  2:\n\n           printf(\"Case1: Value is: %d\"\
    , num);\n\n case  3:\n\n           printf(\"Case1: Value is: %d\", num);\n\n default:\n\
    \n           printf(\"Default: Value is: %d\", num);\n\n    }\n\n return  0;\n\
    \n}\n\nOutput:\n\nDefault: value is: 2\n\nExplanation: In switch I gave an expression,\
    \ you can give variable also. I gave num+2, where num value is 2 and after addition\
    \ the expression resulted 4\\. Since there is no case defined with value 4 the\
    \ default case is executed.\n\nTwist in a story – Introducing Break statement\n\
    \nBefore we discuss more about [break statement](#part0000.xhtml_breakstarmnt),\
    \ guess the output of this C program.\n\n#include  <stdio.h>\n\nint main()\n\n\
    {\n\n int i=2;\n\n switch (i)\n\n     {\n\n case  1:\n\n           printf(\"Case1\
    \ \");\n\n case  2:\n\n           printf(\"Case2 \");\n\n case  3:\n\n          \
    \ printf(\"Case3 \");\n\n case  4:\n\n           printf(\"Case4 \");\n\n default:\n\
    \n           printf(\"Default \");\n\n     }\n\n return  0;\n\n}\n\nOutput:\n\n\
    Case2  Case3  Case4  Default\n\nI passed a variable to switch, the value of the\
    \ variable is 2 so the control jumped to the case 2, However there are no such\
    \ statements in the above program which could break the flow after the execution\
    \ of case 2\\. That’s the reason after case 2, all the subsequent cases and default\
    \ statements got executed.\n\nHow to avoid this situation?\n\nWe can use break\
    \ statement to break the flow of control after every case block.\n\nBreak statement\
    \ in Switch Case\n\nBreak statements are useful when you want your program-flow\
    \ to come out of the switch body. Whenever a break statement is encountered in\
    \ the switch body, the control comes out of the switch case statement.\n\nExample\
    \ of Switch Case with break\n\nI’m taking the same above that we have seen above\
    \ but this time we are using break.\n\n#include  <stdio.h>\n\nint main()\n\n{\n\
    \n int i=2;\n\n switch (i)\n\n     {\n\n case  1:\n\n             printf(\"Case1\
    \ \");\n\n break;\n\n case  2:\n\n             printf(\"Case2 \");\n\n break;\n\
    \n case  3:\n\n             printf(\"Case3 \");\n\n break;\n\n case  4:\n\n            \
    \ printf(\"Case4 \");\n\n break;\n\n default:\n\n             printf(\"Default\
    \ \");\n\n     }\n\n return  0;\n\n}\n\nOutput:\n\nCase  2\n\nWhy didn’t I use\
    \ break statement after default?\n\nThe control would itself come out of the switch\
    \ after default so I didn’t use it, however if you want to use the break after\
    \ default then you can use it, there is no harm in doing that.\n\nFew Important\
    \ points regarding Switch Case\n\n1) Case doesn’t always need to have order 1,\
    \ 2, 3 and so on. They can have any integer value after case keyword. Also, case\
    \ doesn’t need to be in an ascending order always, you can specify them in any\
    \ order as per the need of the program.\n\n2) You can also use characters in switch\
    \ case. for example –\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n char ch='b';\n\
    \n switch (ch)\n\n     {\n\n case  'd':\n\n            printf(\"CaseD \");\n\n\
    \ break;\n\n case  'b':\n\n            printf(\"CaseB\");\n\n break;\n\n case\
    \  'c':\n\n            printf(\"CaseC\");\n\n break;\n\n case  'z':\n\n           \
    \ printf(\"CaseZ \");\n\n break;\n\n default:\n\n            printf(\"Default\
    \ \");\n\n    }\n\n return  0;\n\n}\n\nOutput:\n\nCaseB\n\n3) The expression provided\
    \ in the switch should result in a constant value otherwise it would not be valid.\n\
    \nFor example:\n\nValid expressions for switch –\n\nswitch(1+2+23)\n\nswitch(1*2+3%4)\n\
    \nInvalid switch expressions –\n\nswitch(ab+cd)\n\nswitch(a+b+c)\n\n4) Nesting\
    \ of switch statements are allowed, which means you can have switch statements\
    \ inside another switch. However nested switch statements should be avoided as\
    \ it makes program more complex and less readable.\n\n### CHAPTER 2 - LOOPS IN\
    \ C\n\n# 2.1 C – for loop in C programming \n\nA loop is used for executing a\
    \ block of statements repeatedly until a given condition returns false.\n\nC For\
    \ loop\n\nThis is one of the most frequently used loops in C programming.\n\n\
    Syntax of for loop:\n\nfor (initialization; condition test; increment or decrement)\n\
    \n{\n\n //Statements to be executed repeatedly\n\n}\n\nFlow Diagram of For loop\n\
    \n![](Images/image00431.jpeg)\n\nStep 1: First initialization happens and the\
    \ counter variable gets initialized.\n\nStep 2: In the second step the condition\
    \ is checked, where the counter variable is tested for the given condition, if\
    \ the condition returns true then the C statements inside the body of for loop\
    \ gets executed, if the condition returns false then the for loop gets terminated\
    \ and the control comes out of the loop.\n\nStep 3: After successful execution\
    \ of statements inside the body of loop, the counter variable is incremented or\
    \ decremented, depending on the operation (++ or –).\n\nExample of For loop\n\n\
    #include  <stdio.h>\n\nint main()\n\n{\n\n int i;\n\n for (i=1; i<=3; i++)\n\n\
       {\n\n       printf(\"%d\\n\", i);\n\n   }\n\n return  0;\n\n}\n\nOutput:\n\n\
    1\n\n2\n\n3\n\nVarious forms of for loop in C\n\nI am using variable num as the\
    \ counter in all the following examples –\n\n1) Here instead of num++, I’m using\
    \ num=num+1 which is same as num++.\n\nfor (num=10; num<20; num=num+1)\n\n2) Initialization\
    \ part can be skipped from loop as shown below, the counter variable is declared\
    \ before the loop.\n\nint num=10;\n\nfor (;num<20;num++)\n\nNote: Even though\
    \ we can skip initialization part but semicolon (;) before condition is must,\
    \ without which you will get compilation error.\n\n3) Like initialization, you\
    \ can also skip the increment part as we did below. In this case semicolon (;)\
    \ is must after condition logic. In this case the increment or decrement part\
    \ is done inside the loop.\n\nfor (num=10; num<20; )\n\n{\n\n //Statements\n\n\
          num++;\n\n}\n\n4) This is also possible. The counter variable is initialized\
    \ before the loop and incremented inside the loop.\n\nint num=10;\n\nfor (;num<20;)\n\
    \n{\n\n //Statements\n\n      num++;\n\n}\n\n5) As mentioned above, the counter\
    \ variable can be decremented as well. In the below example the variable gets\
    \ decremented each time the loop runs until the condition num>10 returns false.\n\
    \nfor(num=20; num>10; num--)\n\nNested For Loop in C"
