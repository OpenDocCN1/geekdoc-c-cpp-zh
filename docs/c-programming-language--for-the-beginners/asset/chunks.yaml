  raw: "3) In the loop the increment operation(p++) is performed on the pointer variable\
    \ to get the next location (next element’s location), this arithmetic is same\
    \ for all types of arrays (for all data types double, char, int etc.) even though\
    \ the bytes consumed by each data type is different.\n\nPointer logic\n\nYou must\
    \ have understood the logic in above code so now its time to play with few pointer\
    \ arithmetic and expressions.\n\nif p = &val[0] which means\n\n*p ==val[0]\n\n\
    (p+1) == &val[2]  & *(p+1) == val[2]\n\n(p+2) == &val[3]  & *(p+2) == val[3]\n\
    \n(p+n) == &val[n+1) & *(p+n) == val[n+1]\n\nUsing this logic we can rewrite our\
    \ code in a better way like this:\n\n#include  <stdio.h>\n\nint main( )\n\n{\n\
    \n int *p;\n\n int val[7] = { 11, 22, 33, 44, 55, 66, 77 } ;\n\n   p = val;\n\n\
    \ for ( int i = 0 ; i<7 ; i++ )\n\n   {\n\n      printf(\"val[%d]: value is %d\
    \ and address is %p\\n\", i, *(p+i), (p+i));\n\n   }\n\n return  0;\n\n}\n\nWe\
    \ don’t need the p++ statement in this program.\n\n# 3.4 Passing array to function\
    \ in C programming\n\nJust like variables, array can also be passed to a function\
    \ as an argument . In this guide, we will learn how to pass the array to a function\
    \ using call by value and call by reference methods.\n\nTo understand this guide,\
    \ you should have the knowledge of following C Programming topics:\n\n[C – Array](#part0000.xhtml_arrayincpro)\n\
    \n[Function call by value in C](#part0000.xhtml_callbyvalue)\n\n[Function call\
    \ by reference in C](#part0000.xhtml_callbyreference)\n\n## 3.4.1 Passing array\
    \ to function using call by value method\n\nAs we already know in this type of\
    \ function call, the actual parameter is copied to the formal parameters.\n\n\
    #include  <stdio.h>\n\nvoid disp( char ch)\n\n{\n\n   printf(\"%c \", ch);\n\n\
    }\n\nint main()\n\n{\n\n char arr[] = {'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h',\
    \ 'i', 'j'};\n\n for (int x=0; x<10; x++)\n\n   {\n\n /* I’m passing each element\
    \ one by one using subscript*/\n\n       disp (arr[x]);\n\n   }\n\n return  0;\n\
    \n}\n\nOutput:\n\na b c d e f g h i j\n\n## 3.4.2 Passing array to function using\
    \ call by reference\n\nWhen we pass the address of an array while calling a function\
    \ then this is called function call by reference. When we pass an address as an\
    \ argument, the function declaration should have a [pointer](#part0000.xhtml_pointerinC)\
    \  as a parameter to receive the passed address.\n\n#include  <stdio.h>\n\nvoid\
    \ disp( int *num)\n\n{\n\n    printf(\"%d \", *num);\n\n}\n\nint main()\n\n{\n\
    \n int arr[] = {1, 2, 3, 4, 5, 6, 7, 8, 9, 0};\n\n for (int i=0; i<10; i++)\n\n\
         {\n\n /* Passing addresses of array elements*/\n\n         disp (&arr[i]);\n\
    \n     }\n\n return  0;\n\n}\n\nOutput:\n\n1  2  3  4  5  6  7  8  9  0\n\nHow\
    \ to pass an entire array to a function as an argument?\n\nIn the above example,\
    \ we have passed the address of each array element one by one using a  [for loop](#part0000.xhtml_cforloop)\
    \ in C. However you can also pass an entire array to a function like this:\n\n\
    Note: The array name itself is the address of first element of that array. For\
    \ example if array name is arr then you can say thatarr is equivalent to the &arr[0].\n\
    \n#include  <stdio.h>\n\nvoid myfuncn( int *var1, int var2)\n\n{\n\n/* The pointer\
    \ var1 is pointing to the first element of\n\n* the array and the var2 is the\
    \ size of the array. In the\n\n* loop we are incrementing pointer so that it points\
    \ to\n\n* the next element of the array on each increment.\n\n*\n\n*/\n\n for(int\
    \ x=0; x<var2; x++)\n\n    {\n\n        printf(\"Value of var_arr[%d] is: %d \\\
    n\", x, *var1);\n\n /*increment pointer for next element fetch*/\n\n        var1++;\n\
    \n    }\n\n}\n\nint main()\n\n{\n\n int var_arr[] = {11, 22, 33, 44, 55, 66, 77};\n\
    \nmyfuncn(var_arr, 7);\n\n return  0;\n\n}\n\nOutput:\n\nValue of var_arr[0] is:\
    \ 11\n\nValue of var_arr[1] is: 22\n\nValue of var_arr[2] is: 33\n\nValue of var_arr[3]\
    \ is: 44\n\nValue of var_arr[4] is: 55\n\nValue of var_arr[5] is: 66\n\nValue\
    \ of var_arr[6] is: 77\n\n# 3.5 C – Strings and String functions with examples\n\
    \nString is an array of characters. In this guide, we learn how to declare strings,\
    \ how to work with strings in C programming and how to use the pre-defined string\
    \ handling functions.\n\nWe will see how to compare two strings, concatenate strings,\
    \ copy one string to another & perform various string manipulation operations.\
    \ We can perform such operations using the pre-defined functions of “string.h”\
    \ header file. In order to use these string functions you must include string.h\
    \ file in your C program.\n\nString Declaration\n\n![](Images/image00441.jpeg)\n\
    \nMethod 1:\n\nchar address[]={'T', 'E', 'X', 'A', 'S', '\\0'};\n\nMethod 2: The\
    \ above string can also be defined as –\n\nchar address[]=\"TEXAS\";\n\nIn the\
    \ above declaration NULL character (\\0) will automatically be inserted at the\
    \ end of the string.\n\nWhat is NULL Char “\\0”?\n\n'\\0' represents the end of\
    \ the string. It is also referred as String terminator & Null Character.\n\nString\
    \ I/O in C programming\n\n![](Images/image00442.jpeg)\n\nRead & write Strings\
    \ in C using Printf() and Scanf() functions\n\n#include  <stdio.h>\n\n#include\
    \  <string.h>\n\nint main()\n\n{\n\n /* String Declaration*/\n\n char nickname[20];\n\
    \n    printf(\"Enter your Nick name:\");\n\n /* I am reading the input string\
    \ and storing it in nickname\n\n     * Array name alone works as a base address\
    \ of array so\n\n     * we can use nickname instead of &nickname here\n\n    \
    \ */\n\n    scanf(\"%s\", nickname);\n\n /*Displaying String*/\n\n    printf(\"\
    %s\",nickname);\n\n return  0;\n\n}\n\nOutput:\n\nEnter your Nick name:Negan\n\
    \nNegan\n\nNote: %s format specifier is used for strings input/output\n\nRead\
    \ & Write Strings in C using gets() and puts() functions\n\n#include  <stdio.h>\n\
    \n#include  <string.h>\n\nint main()\n\n{\n\n /* String Declaration*/\n\n char\
    \ nickname[20];\n\n /* Console display using puts */\n\n    puts(\"Enter your\
    \ Nick name:\");\n\n /*Input using gets*/\n\n    gets(nickname);\n\n    puts(nickname);\n\
    \n return  0;\n\n}\n\n# 3.6 C – String functions\n\n![](Images/image00443.jpeg)\n\
    \n## 3.6.1 C String function – strlen\n\nSyntax:\n\nsize_t strlen(const  char\
    \ *str)\n\nsize_t  represents unsigned short.It returns the length of the string\
    \ without including end character (terminating char ‘\\0’).\n\nExample of strlen:\n\
    \n#include  <stdio.h>\n\n#include  <string.h>\n\nint main()\n\n{\n\n char str1[20]\
    \ = \"BeginnersBook\";\n\n     printf(\"Length of string str1: %d\", strlen(str1));\n\
    \n return  0;\n\n}\n\nOutput:\n\nLength of string str1: 13\n\nstrlen vs sizeof\n\
    \nstrlen returns you the length of the string stored in array, however sizeof\
    \ returns the total allocated size assigned to the array. So if I consider the\
    \ above example again then the following statements would return the below values.\n\
    \nstrlen(str1) returned value 13.\n\nsizeof(str1) would return value 20 as the\
    \ array size is 20 (see the first statement in main function).\n\n## 3.6.2 C String\
    \ function – strnlen\n\nSyntax:\n\nsize_t strnlen(const  char *str, size_t maxlen)\n\
    \nsize_t represents unsigned short.It returns length of the string if it is less\
    \ than the value specified for maxlen (maximum length) otherwise it returns maxlen\
    \ value.\n\nExample of strnlen:\n\n#include  <stdio.h>\n\n#include  <string.h>\n\
    \nint main()\n\n{\n\n char str1[20] = \"BeginnersBook\";\n\n     printf(\"Length\
    \ of string str1 when maxlen is 30: %d\", strnlen(str1, 30));\n\n     printf(\"\
    Length of string str1 when maxlen is 10: %d\", strnlen(str1, 10));\n\n return\
    \  0;\n\n}\n\nOutput:\n\nLength of string str1 when maxlen is 30: 13\n\nLength\
    \ of string str1 when maxlen is 10: 10\n\nHave you noticed the output of second\
    \ printf statement, even though the string length was 13 it returned only 10 because\
    \ the maxlen was 10.\n\n## 3.6.3 C String function – strcmp\n\nint strcmp(const\
    \  char *str1, const  char *str2)\n\nIt compares the two strings and returns an\
    \ integer value. If both the strings are same (equal) then this function would\
    \ return 0 otherwise it may return a negative or positive value based on the comparison.\n\
    \nIf string1 < string2 OR string1 is a substring of string2 then it would result\
    \ in a negative value. If string1 > string2 then it would return positive value.\n\
    \nIf string1 == string2 then you would get 0(zero) when you use this function\
    \ for compare strings.\n\nExample of strcmp:\n\n#include  <stdio.h>\n\n#include\
    \  <string.h>"
