    \ tutorial, we have shared a C program, which takes triangle side as input and\
    \ calculates & displays the area as output.\n\nProgram to calculate Area\n\nIn\
    \ order to calculate the area of equilateral triangle, we must know the side of\
    \ the triangle. This program would prompt user to enter the side of the equilateral\
    \ triangle and based on the value, it would calculate the area.\n\nFormula used\
    \ in the program:\n\nArea = sqrt(3)/4 * side * side\n\nHere sqrt refers the “square\
    \ root”, this is a predefined function of “math.h” header file. In order to use\
    \ this function, we have included the “math.h” header file in the program.\n\n\
    #include<stdio.h>\n\n#include<math.h>\n\nint main()\n\n{\n\n int triangle_side;\n\
    \n float triangle_area, temp_variable;\n\n //Ask user to input the length of the\
    \ side\n\n   printf(\"\\nEnter the Side of the triangle:\");\n\n   scanf(\"%d\"\
    ,&triangle_side);\n\n //Caluclate and display area of Equilateral Triangle\n\n\
       temp_variable = sqrt(3) / 4 ;\n\n   triangle_area = temp_variable * triangle_side\
    \ * triangle_side ;\n\n   printf(\"\\nArea of Equilateral Triangle is: %f\",triangle_area);\n\
    \n return(0);\n\n}\n\nOutput:\n\nEnter the Side of the triangle: 2\n\nArea of\
    \ Equilateral  Triangle  is: 1.732051"
