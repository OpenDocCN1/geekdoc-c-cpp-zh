    41\n\n43\n\n47\n\n## 11\\. C Program to check Armstrong number\n\nA number is\
    \ called as Armstrong number if sum of cubes of digits of number is equal to the\
    \ number itself. In the below C program, we are checking whether the input number\
    \ is Armstrong or not.\n\n#include<stdio.h>\n\nint main()\n\n{\n\n int num,copy_of_num,sum=0,rem;\n\
    \n //Store input number in variable num\n\n   printf(\"\\nEnter a number:\");\n\
    \n   scanf(\"%d\",&num);\n\n /* Value of variable num would change in the\n\n\
          below while loop so we are storing it in\n\n      another variable to compare\
    \ the results\n\n      at the end of program\n\n   */\n\n   copy_of_num = num;\n\
    \n /* We are adding cubes of every digit\n\n    * and storing the sum in variable\
