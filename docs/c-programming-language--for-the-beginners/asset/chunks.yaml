    \n### CHAPTER 1- BASICS AND DECISION CONTROL STATEMENT IN C\n\nNote:\n\nThe hyperlink\
    \ is given below at the some of the topics to go back to their linked headings\
    \ because some topics are linked to each other to get better scope of reading\
    \ and understanding to their related topics.so don’t get confused during reading.\n\
    \n# 1.1 Turbo C++ installation\n\nHow to install Turbo C++: Compile and Run a\
    \ C Program\n\nFirst thing you need to understand is that computer (Machine) can\
    \ only understand Machine language (Stream of 0s and 1s). In order to convert\
    \ your C program source code to Machine code, you need to compile it. Compiler\
    \ is the one, which converts source code to Machine code. In simple words you\
    \ can say that a compiler converts human readable code to a machine readable format.\n\
    \nInstall Turbo C++: Step by Step Guide\n\nDownload link:  [Download Turbo C++\
    \ for Windows](http://download.cnet.com/TurboC-for-Windows/3000-2212_4-75786077.html)\n\
    \nStep 1: Locate the TC.exe file and open it. You will find it at location C:\\\
    TC\\BIN\\.\n\nStep 2: File > New (as shown in above picture) and then write your\
    \ C program\n\n#include<stdio.h>\n\nint main()\n\n{\n\n       printf(\"hello World!\"\
    );\n\n return  0;\n\n}\n\n![](Images/image00422.jpeg)\n\nStep 3: Save the program\
    \ using F2 (OR file > Save), remember the extension should be “.c”. In the below\
    \ screenshot I have given the name as helloworld.c.\n\n![](Images/image00423.jpeg)\n\
    \nStep 4: Compile the program using Alt + F9 OR Compile > Compile (as shown in\
    \ the below screenshot).\n\n![](Images/image00424.jpeg)\n\nStep 5: Press Ctrl\
    \ + F9 to Run (or select Run > Run in menu bar ) the  C program.\n\n![](Images/image00425.jpeg)\n\
    \nStep 6: Alt+F5 to view the output of the program at the output screen.\n\n![](Images/image00426.jpeg)\n\
    \nCompile and Run C program using gcc compiler\n\nWe have seen the steps to compile\
    \ and execute a C program using Turbo C++. We can also do the same using gcc compiler.\
    \ The steps are as follows:\n\nSource code Helloworld.c (file should always be\
    \ saved with .c extension)\n\n# include<stdio.h>\n\nint main()\n\n{\n\n        \
    \ puts (\"hello World\");\n\n return  0;\n\n}\n\nCompile it (it is basically converting\
    \ a helloworld.c file to a helloworld file)\n\n>gcc  helloworld.c  –o  helloworld\n\
    \n>\n\nThe generated file would be helloworld.exe if you are compiling on windows.\n\
    \nRun the compiled program\n\nOnce you give the above command, a .exe file would\
    \ have been created if you are on windows then type the following command to run\
    \ the source code.\n\nFor Windows\n\n>helloworld\n\nFor Mac and Linux OS\n\n>./helloworld\n\
    \ngcc compiler took the human readable format (helloworld.c file) and converted\
    \ into a machine code for Windows, Linux and Mac OS X.\n\n# 1.2 C Program Structure\n\
    \nC Program Structure – First C Program\n\nWhat all basic components work together\
    \ to make a complete program. Learn little basics of C building blocks.\n\nA C\
    \ program source code can be written in any text editor; however the file should\
    \ be saved with .c extension. Let us write the First C program.\n\nFirst C Program\n\
    \n/* Demo Program written by Chandru on JavaBook.com*/\n\n#include<stdio.h>\n\n\
    int main()\n\n{\n\n int num;\n\n      printf(\"Enter your age: \");\n\n      scanf(\"\
    %d\", &num);\n\n if (num <18)\n\n      {\n\n             printf(\"you are not\
    \ eligible for voting\");\n\n      }\n\n else\n\n      {\n\n             printf(\"\
    You can vote!!\");\n\n      }\n\n return  0;\n\n}\n\nOutput:\n\nEnter your age:25\n\
    \nYou can vote!!\n\nLet us understand this Program:\n\nComment: Comment start\
    \ with’ /*’ and end with ‘*/’. Comments are not mandatory but still it’s a good\
    \ practice if you use them, it improves the readability of the code. A program\
    \ can have any number of comments.\n\nInclude section: While writing program we\
    \ use several keywords & statements and functions such as printf(), scanf() etc.\
    \ The file that has definitions of these functions needs to be included in the\
    \ program. In the above program we have used stdio.h.There are several libraries\
    \ and “stdio.h” is one of them, which is used for reading the data from terminal\
    \ and to display the data on terminal.\n\nDisplay statements: printf function\
    \ is used in couple of places in the above code. Whatever you gives inside double\
    \ quotes, it prints as it is at the console. You can also use format specifiers\
    \ such as %d, %c, %p to display the values of the variables and pointers using\
    \ printf.\n\nTake input from the user: scanf function is used to take the input\
    \ from the user. When you run this program, it waits for a user input (age) and\
    \ once user enters the age, it does the processing of rest of the statements based\
    \ on the age input by user.\n\nMain() function: It is the starting point of all\
    \ the C programs. The execution of C source code begins with this function.\n\n\
    More about main () Function in C program\n\nThe main () function should be present\
    \ in all C programs as your program won’t begin without this function.\n\nReturn\
    \ type of main () function: The return type for main () function should always\
    \ be int.\n\nWhy it has a return type and what’s the need of it? The compiler\
    \ should know whether your program compiled successfully or it has failed. In\
    \ order to know this it checks the return value of function main (). If return\
    \ value is 0 then it means that the program is successful otherwise it assumes\
    \ that there is a problem, this is why we have a return 0 statement at the end\
    \ of the main function.\n\nStructure of main function:Function name is followed\
    \ by return type. There should be close parenthesis after function name. If there\
    \ are parameters or arguments then it must be within this parenthesis. The block\
    \ of code inside braces is function body. We will discuss more about functions\
    \ in the separate tutorial Functions in C Programming.\n\n# 1.3 C Keywords – Reserved\
    \ Words\n\nIn C, we have 32 keywords, which have their predefined meaning and\
    \ cannot be used as a variable name. These words are also known as “reserved words”.\
    \ It is good practice to avoid using these keywords as variable name. These are\
    \ –\n\n![](Images/image00427.jpeg)\n\nBasics usage of these keywords –\n\nif,\
    \ else, switch, case, default – Used for decision control programming structure.\n\
    \nbreak – Used with any loop OR switch case.\n\nint, float, char, double, long\
    \ – These are the data types and used during variable declaration.\n\nfor, while,\
    \ do – types of loop structures in C.\n\nvoid – One of the return type.\n\ngoto\
    \ – Used for redirecting the flow of execution.\n\nauto, signed, const, extern,\
    \ register, unsigned – defines a variable.\n\nreturn – This keyword is used for\
    \ returning a value."
