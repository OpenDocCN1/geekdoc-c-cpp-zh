  raw: "continue – It is generally used with for, while and dowhile loops, when compiler\
    \ encounters this statement it performs the next iteration of the loop, skipping\
    \ rest of the statements of current iteration.\n\nenum – Set of constants.\n\n\
    sizeof – It is used to know the size.\n\nstruct, typedef  – Both of these keywords\
    \ used in structures (Grouping of data types in a single record).\n\nunion – It\
    \ is a collection of variables, which shares the same memory location and memory\
    \ storage.\n\nVolatile-keyword is a qualifier that is applied to a variable when\
    \ it is declared.\n\nOperator precedence and Associativity in C programming language\n\
    \nOperator Precedence in C\n\nOperator precedence determines which operator is\
    \ evaluated first when an expression has more than one operators. For example\
    \ 100-2*30 would yield 40, because it is evaluated as 100 – (2*30) and not (100-2)*30\\\
    . The reason is that multiplication * has higher precedence than subtraction(-).\n\
    \nAssociativity in C\n\nAssociativity is used when there are two or more operators\
    \ of same precedence is present in an expression. For example multiplication and\
    \ division arithmetic operators have same precedence, lets say we have an expression\
    \ 5*2/10, this expression would be evaluated as (5*2)/10 because the associativity\
    \ is left to right for these operators. Similarly 20/2*5 would be calculated as\
    \ (20*2)/5.\n\nOperator precedence and Associativity Table in C Programming\n\n\
    | Description | Operator | Associativity |\n\n| Function expressionArray ExpressionStructure\
    \ operatorsUnary minusIncrement & DecrementOne’s complimentPointer OperatorsType\
    \ castsize of operatorLeft and Right Shift | ( )[]->–—  ++~& *(data type)Sizeof>> \
    \ << | Left to RightLeft to RightLeft to RightRight to LeftRight to LeftRight\
    \ to LeftRight to LeftRight to LeftRight to Left |\n\nArithmetic Operators\n\n\
    | Multiplication operator, Divide by, ModulusAdd, Substract | *,  /,  %+,  – |\
    \ Left to RightLeft to Right |\n\nRelational Operators\n\n| Less ThanGreater thanLess\
    \ than equal toGreater than equal toEqual toNot equal | <><=>===!= | Left to RightLeft\
    \ to RightLeft to RightLeft to RightLeft to RightLeft to Right |\n\nLogical Operators\n\
    \n| ANDORNOT | &&&#124;&#124;! | Left to RightLeft to RightRight to Left |\n\n\
    Bitwise Operators\n\n| ANDExclusive ORInclusive OR | &^&#124; | Left to RightLeft\
    \ to RightLeft to Right |\n\nAssignment Operators\n\n|  | =*=/=%=+=-=&=^=&#124;=<<=>>=\
    \ | Right to LeftRight to LeftRight to LeftRight to LeftRight to LeftRight to\
    \ LeftRight to LeftRight to LeftRight to LeftRight to LeftRight to Left |\n\n\
    Other Operators\n\n| CommaConditional Operator | ,?: | Right to LeftRight to Left\
    \ |\n\nDECISION CONTROL STATEMENT\n\n# 1.4 If statement\n\nIf statement in C programming \n\
    \nWhen we need to execute a block of statements only when a given condition is\
    \ true then we use if statement. In the next tutorial, we will learn C if..else,\
    \ nested if..else and else..if.\n\nC – If statement\n\nSyntax of if statement:\n\
    \nThe statements inside the body of “if” only execute if the given condition returns\
    \ true. If the condition returns false then the statements inside “if” are skipped.\n\
    \nif (condition)\n\n{\n\n //Block of C statements here\n\n //These statements\
    \ will only execute if the condition is true\n\n}\n\nFlow Diagram of if statement\n\
    \n![](Images/image00428.jpeg)\n\nExample of if statement\n\n#include  <stdio.h>\n\
    \nint main()\n\n{\n\n int x = 20;\n\n int y = 22;\n\n if (x<y)\n\n    {\n\n       \
    \ printf(\"Variable x is less than y\");\n\n    }\n\n return  0;\n\n}\n\nOutput:\n\
    \nVariable x is less than y\n\nExplanation: The condition (x<y) specified in the\
    \ “if” returns true for the value of x and y, so the statement inside the body\
    \ of if is executed.\n\nExample of multiple if statements\n\nWe can use multiple\
    \ if statements to check more than one conditions.\n\n#include  <stdio.h>\n\n\
    int main()\n\n{\n\n int x, y;\n\n    printf(\"enter the value of x:\");\n\n   \
    \ scanf(\"%d\", &x);\n\n    printf(\"enter the value of y:\");\n\n    scanf(\"\
    %d\", &y);\n\n if (x>y)\n\n    {\n\nprintf(\"x is greater than y\\n\");\n\n   \
    \ }\n\n if (x<y)\n\n    {\n\nprintf(\"x is less than y\\n\");\n\n    }\n\n if\
    \ (x==y)\n\n    {\n\nprintf(\"x is equal to y\\n\");\n\n    }\n\n    printf(\"\
    End of Program\");\n\n return  0;\n\n}\n\nIn the above example the output depends\
    \ on the user input.\n\nOutput:\n\nenter the value of x:20\n\nenter the value\
    \ of y:20\n\nx is equal to y\n\nEnd of Program\n\nNote:\n\nGo back from here\n\
    \n[C Program to Check whether an Alphabet is Vowel or Consonant](#part0000.xhtml__17._C_Program)\n\
    \n# 1.5 If-else statement\n\nC – If..else, Nested If..else and else..if Statement\
    \ with example\n\nC If else statement\n\nSyntax of if else statement:\n\nIf condition\
    \ returns true then the statements inside the body of “if” are executed and the\
    \ statements inside body of “else” are skipped.If condition returns false then\
    \ the statements inside the body of “if” are skipped and the statements in “else”\
    \ are executed.\n\nif(condition) {\n\n // Statements inside body of if\n\n}\n\n\
    else {\n\n //Statements inside body of else\n\n}\n\nFlow diagram of if else statement\n\
    \n![](Images/image00429.jpeg)\n\nExample of if else statement\n\nIn this program\
    \ user is asked to enter the age and based on the input, the if...else statement\
    \ checks whether the entered age is greater than or equal to 18\\. If this condition\
    \ meet then display message “You are eligible for voting”, however if the condition\
    \ does not meet then display a different message “You are not eligible for voting”.\n\
    \n#include  <stdio.h>\n\nint main()\n\n{\n\n int age;\n\n   printf(\"Enter your\
    \ age:\");\n\n   scanf(\"%d\",&age);\n\n if(age >=18)\n\n   {\n\n/* This statement\
    \ will only execute if the\n\n* above condition (age>=18) returns true\n\n*/\n\
    \nprintf(\"You are eligible for voting\");\n\n   }\n\n else\n\n   {\n\n/* This\
    \ statement will only execute if the\n\n* condition specified in the \"if\" returns\
    \ false.\n\n*/\n\nprintf(\"You are not eligible for voting\");\n\n   }\n\n return\
    \  0;\n\n}\n\nOutput:\n\nEnter your age:14\n\nYou are not eligible for voting\n\
    \nNote: If there is only one statement is present in the “if” or “else” body then\
    \ you do not need to use the braces (parenthesis). For example the above program\
    \ can be rewritten like this:\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n int\
    \ age;\n\n   printf(\"Enter your age:\");\n\n   scanf(\"%d\",&age);\n\n if(age\
    \ >=18)\n\nprintf(\"You are eligible for voting\");\n\n else\n\nprintf(\"You are\
    \ not eligible for voting\");\n\n return  0;\n\n}\n\nNote:\n\nGo back from here:\n\
    \n[C Program to Check whether an Alphabet is Vowel or Consonant](#part0000.xhtml__17._C_Program)\n\
    \n[C Program to check Leap Year](#part0000.xhtml__18._C_Program)\n\n[](#part0000.xhtml__18._C_Program)\n\
    \n# 1.6 C Nested If..else statement\n\nWhen an if else statement is present inside\
    \ the body of another “if” or “else” then this is called nested if else.\n\nSyntax\
    \ of Nested if else statement:\n\nif(condition) {\n\n //Nested if else inside\
    \ the body of \"if\"\n\n if(condition2) {\n\n //Statements inside the body of\
    \ nested \"if\"\n\n    }\n\n else {\n\n //Statements inside the body of nested\
    \ \"else\"\n\n    }\n\n}\n\nelse {\n\n //Statements inside the body of \"else\"\
    \n\n}\n\nExample of nested if..else\n\n#include  <stdio.h>\n\nint main()\n\n{\n\
    \n int var1, var2;\n\n   printf(\"Input the value of var1:\");\n\n   scanf(\"\
    %d\", &var1);\n\n   printf(\"Input the value of var2:\");\n\n   scanf(\"%d\",&var2);\n\
    \n if (var1 != var2)\n\n   {\n\nprintf(\"var1 is not equal to var2\\n\");\n\n\
    //Nested if else\n\nif (var1 > var2)\n\n{\n\nprintf(\"var1 is greater than var2\\\
    n\");\n\n}\n\nelse\n\n{\n\nprintf(\"var2 is greater than var1\\n\");\n\n}\n\n\
       }\n\n else\n\n   {\n\nprintf(\"var1 is equal to var2\\n\");\n\n   }\n\n return\
    \  0;\n\n}\n\nOutput:\n\nInput the value of var1:12\n\nInput the value of var2:21\n\
    \nvar1 is  not equal to var2\n\nvar2 is greater than var1\n\n# 1.7 C – else..if\
    \ statement\n\nThe else..if statement is useful when you need to check multiple\
    \ conditions within the program, nesting of if-else blocks can be avoided using\
    \ else..if statement.\n\nSyntax of else..if statement:\n\nif (condition1)\n\n\
    {\n\n //These statements would execute if the condition1 is true\n\n}\n\nelse\
    \  if(condition2)\n\n{\n\n //These statements would execute if the condition2\
    \ is true\n\n}\n\nelse  if (condition3)\n\n{\n\n //These statements would execute\
    \ if the condition3 is true\n\n}\n\n.\n\n.\n\nelse"
