    \ \"HELLO\");\n\nstrcpy(str2, \"hello world!\");\n\n   result = strcoll(str1,\
    \ str2);\n\n if(result > 0) {\n\n      printf(\"ASCII value of first unmatched\
    \ character of str1 is greater than str2\");\n\n} else  if(result < 0) {\n\n     \
    \ printf(\"ASCII value of first unmatched character of str1 is less than str2\"\
    );\n\n} else {\n\n      printf(\"Both the strings str1 and str2 are equal\");\n\
    \n   }\n\n return  0;\n\n}\n\nOutput:\n\nASCII value of first unmatched character\
    \ of str1 is less than str2\n\nIn this example we are comparing two strings that\
    \ are different. The strcoll() function is case sensitive. The ASCII value of\
    \ ‘H’ is less than ‘h’ which is why this function returns negative value.\n\n\
    If we reverse the arguments in the strcoll() function, lets say strcoll(str2,\
    \ str1) then the function would return a positive value.\n\nC strcpy() Function\
    \ – C tutorial\n\nThe strcpy() function copies one string to another string.\n\
