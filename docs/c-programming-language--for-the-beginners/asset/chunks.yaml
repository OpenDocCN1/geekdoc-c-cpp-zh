  raw: "This function addition adds two integer variables, which means I need two\
    \ integer variable as input, lets provide two integer parameters in the function\
    \ signature. The function signature would be –\n\nreturn_type addition(int num1,\
    \ int num2)\n\nThe result of the sum of two integers would be integer only. Hence\
    \ function should return an integer value – I got my return type – It would be\
    \ integer –\n\nint addition(int num1, int num2);\n\nSo you got your function prototype\
    \ or signature. Now you can implement the logic in C program like this:\n\nHow\
    \ to call a function in C?\n\nConsider the following C program\n\nExample1: Creating\
    \ a user defined function addition()\n\n#include  <stdio.h>\n\nint addition(int\
    \ num1, int num2)\n\n{\n\n int sum;\n\n /* Arguments are used here*/\n\n     sum\
    \ = num1+num2;\n\n /* Function return type is integer so we are returning\n\n\
          * an integer value, the sum of the passed numbers.\n\n      */\n\n return\
    \ sum;\n\n}\n\nint main()\n\n{\n\n int var1, var2;\n\n     printf(\"Enter number\
    \ 1: \");\n\n     scanf(\"%d\",&var1);\n\n     printf(\"Enter number 2: \");\n\
    \n     scanf(\"%d\",&var2);\n\n /* Calling the function here, the function return\
    \ type\n\n      * is integer so we need an integer variable to hold the\n\n     \
    \ * returned value of this function.\n\n      */\n\n int res = addition(var1,\
    \ var2);\n\n     printf (\"Output: %d\", res);\n\n return  0;\n\n}\n\nOutput:\n\
    \nEnter number 1: 100\n\nEnter number 2: 120\n\nOutput: 220\n\nExample2: Creating\
    \ a void user defined function that doesn’t return anything\n\n#include  <stdio.h>\n\
    \n/* function return type is void and it doesn't have parameters*/\n\nvoid introduction()\n\
    \n{\n\n    printf(\"Hi\\n\");\n\n    printf(\"My name is Chaitanya\\n\");\n\n\
        printf(\"How are you?\");\n\n /* There is no return statement inside this\
    \ function, since its\n\n     * return type is void\n\n     */\n\n}\n\nint main()\n\
    \n{\n\n /*calling function*/\n\n     introduction();\n\n return  0;\n\n}\n\nOutput:\n\
    \nHi\n\nMy name is  Chaitanya\n\nHow are you?\n\nFew Points to Note regarding\
    \ functions in C:\n\n1) main() in C program is also a function.\n\n2) Each C program\
    \ must have at least one function, which is main().\n\n3) There is no limit on\
    \ number of functions; A C program can have any number of functions.\n\n4) A function\
    \ can call itself and it is known as “Recursion“. I have written a separate guide\
    \ for it.\n\nC Functions Terminologies that you must remember\n\nreturn type: Data\
    \ type of returned value. It can be void also, in such case function doesn’t return\
    \ any value.\n\nNote: for example, if function return type ischar, then function\
    \ should return a value of char type and while calling this function the main()\
    \ function should have a variable of char data type to store the returned value.\n\
    \nStructure would look like –\n\nchar abc(char ch1, char ch2)\n\n{\n\n char ch3;\n\
    \n   …\n\n   …\n\n return ch3;\n\n}\n\nint main()\n\n{\n\n   …\n\n char c1 = abc('a',\
    \ 'x');\n\n   …\n\n}\n\nNote:\n\nGo back from here:\n\n[C – Function Pointer](#part0000.xhtml_Cfunctionpointer)\n\
    \n[Passing pointer to a function](#part0000.xhtml_passingpointer)\n\n[Hello World\
    \ Program using Functions](#part0000.xhtml_helloworld)\n\n[](#part0000.xhtml_helloworld)[ Program\
    \ to multiply two numbers using function](#part0000.xhtml_twonumberfun)\n\n[Program\
    \ to find Quotient and Remainder using function](#part0000.xhtml_remainder)\n\n\
    [Program to Convert Binary Number to Decimal Number](#part0000.xhtml_binarynum)\n\
    \n[Program to Convert Decimal Number to Binary Number](#part0000.xhtml_decimal)\n\
    \n[Program to Convert Decimal to Octal Number](#part0000.xhtml_octa)\n\n# 4.2\
    \ Function call by value\n\nFunction call by value in C programming\n\nIn the\
    \ call by value method the actual arguments are copied to the formal arguments,\
    \ hence any operation performed by function on arguments doesn’t affect actual\
    \ parameters.\n\nFunction call by value is the default way of calling a function\
    \ in C programming. Before we discuss function call by value, lets understand\
    \ the terminologies that we will use while explaining this:\n\nActual parameters: The\
    \ parameters that appear in function calls.\n\nFormal parameters: The parameters\
    \ that appear in function declarations.\n\nFor example:\n\n#include  <stdio.h>\n\
    \nint sum(int a, int b)\n\n{\n\n int c=a+b;\n\n return c;\n\n}\n\nint main(\n\n\
    {\n\n int var1 =10;\n\n int var2 = 20;\n\n int var3 = sum(var1, var2);\n\n   \
    \ printf(\"%d\", var3);\n\n return  0;\n\n}\n\nIn the above example variable a\
    \ and b are the formal parameters (or formal arguments). Variable var1 and var2\
    \ are the actual arguments (or actual parameters). The actual parameters can also\
    \ be the values. Like sum(10, 20), here 10 and 20 are actual parameters.\n\nLets\
    \ get back to the point.\n\nWhat is Function Call By value?\n\nWhen we pass the\
    \ actual parameters while calling a function then this is known as function call\
    \ by value. In this case the values of actual parameters are copied to the formal\
    \ parameters. Thus operations performed on the formal parameters don’t reflect\
    \ in the actual parameters.\n\nExample of Function call by Value\n\nAs mentioned\
    \ above, in the call by value the actual arguments are copied to the formal arguments,\
    \ hence any operation performed by function on arguments doesn’t affect actual\
    \ parameters. Lets take an example to understand this:\n\n#include  <stdio.h>\n\
    \nint increment(int  var)\n\n{\n\n var = var+1;\n\n return  var;\n\n}\n\nint main()\n\
    \n{\n\n int num1=20;\n\n int num2 = increment(num1);\n\n   printf(\"num1 value\
    \ is: %d\", num1);\n\n   printf(\"\\nnum2 value is: %d\", num2);\n\n return  0;\n\
    \n}\n\nOutput:\n\nnum1 value is: 20\n\nnum2 value is: 21\n\nExplanation:\n\nWe\
    \ passed the variable num1 while calling the method, but since we are calling\
    \ the function using call by value method, only the value of num1 is copied to\
    \ the formal parameter var. Thus change made to the var doesn’t reflect in the\
    \ num1.\n\nExample 2: Swapping numbers using Function Call by Value\n\n#include\
    \  <stdio.h>\n\nvoid swapnum( int var1, int var2 )\n\n{\n\n int tempnum ;\n\n\
    \ /*Copying var1 value into temporary variable */\n\n   tempnum = var1 ;\n\n /*\
    \ Copying var2 value into var1*/\n\n   var1 = var2 ;\n\n /*Copying temporary variable\
    \ value into var2 */\n\n   var2 = tempnum ;\n\n}\n\nint main( )\n\n{\n\n int num1\
    \ = 35, num2 = 45 ;\n\n    printf(\"Before swapping: %d, %d\", num1, num2);\n\n\
    \ /*calling swap function*/\n\n    swapnum(num1, num2);\n\n    printf(\"\\nAfter\
    \ swapping: %d, %d\", num1, num2);\n\n}\n\nOutput:\n\nBefore swapping: 35, 45\n\
    \nAfter swapping: 35, 45\n\nWhy variables remain unchanged even after the swap?\n\
    \nThe reason is same – function is called by value for num1 & num2\\. So actually\
    \ var1 and var2 gets swapped (not num1 & num2). As in call by value actual parameters\
    \ are just copied into the formal parameters.\n\nNote:\n\nGo back from here:\n\
    \n[Passing array to function in C programming](#part0000.xhtml_passingarrat2fun)\n\
    \n[Program to multiply two numbers using function](#part0000.xhtml_twonumberfun)\n\
    \n[Program to find Quotient and Remainder using function](#part0000.xhtml_remainder)\n\
    \n# 4.3 Function call by reference\n\nFunction call by reference in C Programming\n\
    \nBefore we discuss function call by reference, lets understand the terminologies\
    \ that we will use while explaining this:\n\nActual parameters: The parameters\
    \ that appear in function calls.\n\nFormal parameters: The parameters that appear\
    \ in function declarations.\n\nFor example: We have a function declaration like\
    \ this:\n\nint sum(int a, int b);\n\nThe a and b parameters are formal parameters.\n\
    \nWe are calling the function like this:\n\nint s = sum(10, 20); //Here 10 and\
    \ 20 are actual parameters\n\nor\n\nint s = sum(n1, n2); //Here n1 and n2 are\
    \ actual parameters\n\nWhat is Function Call By Reference?\n\nWhen we call a function\
    \ by passing the addresses of actual parameters then this way of calling the function\
    \ is known as call by reference. In call by reference, the operation performed\
    \ on formal parameters, affects the value of actual parameters because all the\
    \ operations performed on the value stored in the address of actual parameters.\
    \ It may sound confusing first but the following example would clear your doubts.\n\
    \nExample of Function call by Reference\n\nLets take a simple example. Read the\
    \ comments in the following program.\n\n#include  <stdio.h>"
