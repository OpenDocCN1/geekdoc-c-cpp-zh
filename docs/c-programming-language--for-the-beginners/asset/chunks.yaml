    ## 2\\. C Program to find largest element of an Array\n\nIn the following program\
    \ we are initializing a variable (max_element) with the first element of given\
    \ array and then we are comparing that variable with all the other elements of\
    \ the array using loop, whenever we are getting an element with the value greater\
    \ than max_element, we are moving that element to max_element and moving further\
    \ with the same approach to get the largest element in the max_element variable.\n\
    \n#include  <stdio.h>\n\n/*  This is our function to find the largest\n\n* element\
    \ in the array arr[]\n\n*/\n\nint largest_element(int arr[], int num)\n\n{\n\n\
    \ int i, max_element;\n\n // Initialization to the first array element\n\n   \
    \ max_element = arr[0];\n\n /* Here we are comparing max_element with\n\n    \
    \ * all other elements of array to store the\n\n     * largest element in the\
    \ max_element variable\n\n     */\n\n for (i = 1; i < num; i++)        \n\n if\
    \ (arr[i] > max_element)\n\n            max_element = arr[i];\n\n return max_element;\n\
    \n}\n\nint main()\n\n{\n\n int arr[] = {1, 24, 145, 20, 8, -101, 300};\n\n int\
    \ n = sizeof(arr)/sizeof(arr[0]);\n\n    printf(\"Largest element of array is\
    \ %d\", largest_element(arr, n));\n\n return  0;\n\n}\n\nOutput:\n\nLargest element\
    \ of array is  300\n\n## 3\\. C Program to find sum of array elements using pointers,\
    \ recursion & functions\n\nIn this tutorial, we will learn following two ways\
    \ to find out the sum of array elements:\n\n1) Using Recursion\n\n2) Using Pointers\n\
    \nMethod 1: Sum of array elements using Recursion: Function calling itself\n\n\
    This program calls the user defined function sum_array_elements() and the function\
    \ calls itself recursively. Here we have hardcoded the array elements but if you\
    \ want user to input the values, you can use a for loop and scanf function, same\
    \ way as I did in the next section (Method 2: Using pointers) of this post.\n\n\
    #include<stdio.h>\n\nint main()\n\n{\n\n int array[] = {1,2,3,4,5,6,7};\n\n int\
    \ sum;\n\n   sum = sum_array_elements(array,6);\n\n   printf(\"\\nSum of array\
    \ elements is:%d\",sum);\n\n return  0;\n\n}\n\nint sum_array_elements( int arr[],\
    \ int n ) {\n\n if (n < 0) {\n\n //base case:\n\n return  0;\n\n} else{\n\n //Recursion:\
    \ calling itself\n\n return arr[n] + sum_array_elements(arr, n-1);\n\n    }\n\n\
    }\n\nOutput:\n\nSum of array elements is:28\n\nMethod 2: Sum of array elements\
    \ using pointers\n\nHere we are setting up the pointer to the base address of\
    \ array and then we are incrementing pointer and using * operator to get & sum-up\
    \ the values of all the array elements.\n\n#include<stdio.h>\n\nint main()\n\n\
    {\n\n int array[5];\n\n int i,sum=0;\n\n int *ptr;\n\n   printf(\"\\nEnter array\
    \ elements (5 integer values):\");\n\n for(i=0;i<5;i++)\n\n      scanf(\"%d\"\
    ,&array[i]);\n\n /* array is equal to base address\n\n    * array = &array[0]\
    \ */\n\n   ptr = array;\n\n for(i=0;i<5;i++)\n\n   {\n\n //*ptr refers to the\
    \ value at address\n\n      sum = sum + *ptr;\n\n      ptr++;\n\n   }\n\n   printf(\"\
    \\nThe sum is: %d\",sum);\n\n}\n\nOutput:\n\nEnter array elements (5 integer values):\
    \ 1  2  3  4  5\n\nThe sum is: 15\n\n## 4\\. C Program to Find the Number of Elements\
    \ in an Array\n\nHere we will write a C program to find the number of elements\
