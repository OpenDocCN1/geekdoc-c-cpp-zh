    \ you need to specify the mode. The mode that we use to read a file is `r` which\
    \ is `read only mode`.\n\n**Example:**\n`FILE *fp;`\n`fp = fopen(\"C:\\\\myfiles\\\
    \\newfile.txt\", \"r\");`\n\nThe address of the first character is stored in `pointer\
    \ fp`.\n\n**How to check whether the file has opened successfully?**\nIf file\
    \ does not open successfully then the pointer will be assigned a `NULL` value,\
    \ so you can write the logic like this:\n"
