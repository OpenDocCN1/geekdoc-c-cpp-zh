    \  break;\n        else\n            printf(\"%c\", c);\n    }\n    fclose(fp1);\n\
    \    return 0;\n}\n```\nIn the above program, we are opening a file `newfile.txt`\
    \ in `r` mode, reading the content of the file and displaying it on the console.\
    \ \n\n### 5.5.1 Opening a file\n\nThe `fopen()` function is used for opening a\
    \ file.\n\n**Syntax:**\n`FILE pointer_name = fopen (\"file_name\", \"Mode\");`\n\
    \n`pointer_name` can be anything of your choice.\n`file_name` is the name of the\
