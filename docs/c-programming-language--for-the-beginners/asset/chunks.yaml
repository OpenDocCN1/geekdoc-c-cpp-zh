    ## 2\\. Insertion Sort Program in C\n\nInsertion sort algorithm picks elements\
    \ one by one and places it to the right position where it belongs in the sorted\
    \ list of elements. In the following C program we have implemented the same logic.\n\
    \nBefore going through the program, lets see the steps of insertion sort with\
    \ the help of an example.\n\nInput elements: 89  17  8  12  0\n\nStep 1: 89  17\
    \  8  12  0 (the bold elements are sorted list and non-bold unsorted list)\n\n\
    Step 2: 17  89  8  12  0 (each element will be removed from unsorted list and\
    \ placed at the right position in the sorted list)\n\nStep 3: 8  17  89  12  0\n\
    \nStep 4: 8  12  17  89  0\n\nStep 5: 0  8  12  17  89\n\nC Program – Insertion\
    \ Sort implementation\n\n#include<stdio.h>\n\nint main(){\n\n /* Here i & j for\
    \ loop counters, temp for swapping,\n\n    * count for total number of elements,\
    \ number[] to\n\n    * store the input numbers in array. You can increase\n\n\
        * or decrease the size of number array as per requirement\n\n    */\n\n int\
    \ i, j, count, temp, number[25];\n\n   printf(\"How many numbers u are going to\
    \ enter?: \");\n\n   scanf(\"%d\",&count);\n\n   printf(\"Enter %d elements: \"\
    , count);\n\n // This loop would store the input numbers in array\n\n for(i=0;i<count;i++)\n\
    \n      scanf(\"%d\",&number[i]);\n\n // Implementation of insertion sort algorithm\n\
    \n for(i=1;i<count;i++){\n\n      temp=number[i];\n\n      j=i-1;\n\n while((temp<number[j])&&(j>=0)){\n\
    \n         number[j+1]=number[j];\n\n         j=j-1;\n\n      }\n\n      number[j+1]=temp;\n\
    \n   }\n\n   printf(\"Order of Sorted elements: \");\n\n for(i=0;i<count;i++)\n\
    \n      printf(\" %d\",number[i]);\n\n return  0;\n\n}\n\nOutput:\n\n![insertion_sort_output_cmd](Images/image00458.jpeg)\n\
    \nAs you can observe in the output that we have entered 6 integer numbers in a\
    \ random order and the above C program sorted them in ascending order by using\
    \ the logic of insertion sort algorithm.\n\n## 3\\. Selection Sort Program in\
    \ C\n\nIn Selection sort, the smallest element is exchanged with the first element\
    \ of the unsorted list of elements (the exchanged element takes the place where\
    \ smallest element is initially placed). Then the second smallest element is exchanged\
    \ with the second element of the unsorted list of elements and so on until all\
    \ the elements are sorted. In the following C program we have implemented the\
    \ same logic.\n\nBefore going through the program, lets see the steps of selection\
    \ sort with the help of an example:\n\nEntered elements: 22 0 -90 89 17\n\nStep\
    \ 1: -90 0 22 89 17 (22 and -90 exchanged position)\n\nStep 2: -90 0 22 89 17\
    \ (0 is at right place, no exchange needed)\n\nStep 3: -90 0 17 89 22 (22 and\
    \ 17 exchanged position)\n\nStep 4: -90 0 17 22 89 (89 and 22 exchanged position)\n\
    \nC Program – Selection sort\n\n#include<stdio.h>\n\nint main(){\n\n /* Here i\
    \ & j for loop counters, temp for swapping,\n\n    * count for total number of\
    \ elements, number[] to\n\n    * store the input numbers in array. You can increase\n\
    \n    * or decrease the size of number array as per requirement\n\n    */\n\n\
    \ int i, j, count, temp, number[25];\n\n   printf(\"How many numbers u are going\
    \ to enter?: \");\n\n   scanf(\"%d\",&count);\n\n   printf(\"Enter %d elements:\
    \ \", count);\n\n // Loop to get the elements stored in array\n\n for(i=0;i<count;i++)\n\
    \n      scanf(\"%d\",&number[i]);\n\n // Logic of selection sort algorithm\n\n\
    \ for(i=0;i<count;i++){\n\n for(j=i+1;j<count;j++){\n\n if(number[i]>number[j]){\n\
    \n            temp=number[i];\n\n            number[i]=number[j];\n\n           \
    \ number[j]=temp;\n\n         }\n\n      }\n\n   }\n\n   printf(\"Sorted elements:\
    \ \");\n\n for(i=0;i<count;i++)\n\n      printf(\" %d\",number[i]);\n\n return\
    \  0;\n\n}\n\nOutput:\n\n![selection_sort_output_cmd](Images/image00459.jpeg)\n\
    \nAs you can see that we have entered 6 elements in random order and the program\
    \ sorted them in ascending order by using selection sort algorithm which we have\
    \ implemented in the program. You can also modify this same program to sort the\
    \ elements in descending order as well.\n\nQuicksort program in C\n\nQuicksort\
    \ is a divide and conquer algorithm. The steps are: 1) Pick an element from the\
    \ array, this element is called as pivot element. 2) Divide the unsorted array\
    \ of elements in two arrays with values less than the pivot come in the first\
    \ sub array, while all elements with values greater than the pivot come in the\
    \ second sub-array (equal values can go either way). This step is called the partition\
    \ operation. 3) Recursively repeat the step 2(until the sub-arrays are sorted)\
    \ to the sub-array of elements with smaller values and separately to the sub-array\
    \ of elements with greater values. The same logic we have implemented in the following\
    \ C program.\n\nC Program – Quicksort algorithm implementation\n\n#include<stdio.h>\n\
    \nvoid quicksort(int number[25],int first,int  last){\n\n int i, j, pivot, temp;\n\
    \n if(first<last){\n\n      pivot=first;\n\n      i=first;\n\n      j=last;\n\n\
    \ while(i<j){\n\n while(number[i]<=number[pivot]&&i<last)\n\n            i++;\n\
    \n while(number[j]>number[pivot])\n\n            j--;\n\n if(i<j){\n\n           \
    \ temp=number[i];\n\n            number[i]=number[j];\n\n            number[j]=temp;\n\
    \n         }\n\n      }\n\n      temp=number[pivot];\n\n      number[pivot]=number[j];\n\
    \n      number[j]=temp;\n\n      quicksort(number,first,j-1);\n\n      quicksort(number,j+1,last);\n\
    \n   }\n\n}\n\nint main(){\n\n int i, count, number[25];\n\n   printf(\"How many\
    \ elements are u going to enter?: \");\n\n   scanf(\"%d\",&count);\n\n   printf(\"\
    Enter %d elements: \", count);\n\n for(i=0;i<count;i++)\n\n      scanf(\"%d\"\
    ,&number[i]);\n\n   quicksort(number,0,count-1);\n\n   printf(\"Order of Sorted\
    \ elements: \");\n\n for(i=0;i<count;i++)\n\n      printf(\" %d\",number[i]);\n\
    \n return  0;\n\n}\n\nOutput:\n\n![quick_sort_output_cmd](Images/image00460.jpeg)\n\
    \n### 10\\. PROGRAMS ON CALCULATION\n\n## 1\\. C program to calculate and print\
    \ the value of nPr\n\nIn the following program we are calculating the value of\
    \ nPr based on the given values of n and r. nPr can also be represented as P(n,r). The\
    \ formula of P(n, r) is: n! / (n – r)!. For example P(6, 2) = 6! / (6-2)! => 720\
    \ / 24 = 30\\. We have implemented the same logic in the below C program.\n\n\
    #include  <stdio.h>\n\nvoid main()\n\n{\n\n int n, r, npr_var;\n\n    printf(\"\
    Enter the value of n:\");\n\n    scanf(\"%d\", &n);\n\n    printf(\"\\nEnter the\
    \ value of r:\");\n\n    scanf(\"%d\", &r);\n\n /* nPr is also known as P(n,r),\
    \ the formula is:\n\n     * P(n,r) = n! / (n - r)! For 0 <= r <= n.\n\n     */\n\
    \n    npr_var = fact(n) / fact(n - r);\n\n    printf(\"\\nThe value of P(%d,%d)\
    \ is: %d\",n,r,npr_var);\n\n}\n\n// Function for calculating factorial\n\nint\
    \ fact(int num)\n\n{\n\n int k = 1, i;\n\n // factorial of 0 is 1\n\n if (num\
    \ == 0)\n\n    {\n\n return(k);\n\n    }\n\n else\n\n    {\n\n for (i = 1; i <=\
    \ num; i++)\n\n    {\n\n            k = k * i;\n\n}\n\n    }\n\n return(k);\n\n\
    }\n\nOutput:\n\nEnter the value of n:\n\n5\n\nEnter the value of r:\n\n2\n\nThe\
    \ value of P(6,2) is: 30\n\n## 2\\. C program to calculate and print the value\
