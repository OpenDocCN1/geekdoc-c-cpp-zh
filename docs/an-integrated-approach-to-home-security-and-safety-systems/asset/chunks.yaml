    # 前言


    一种基于人脸和语音识别的高效准确家庭安全及门禁安全系统对于广泛的安全应用非常重要。安全是智能家居应用中的一个重要方面或特征。大多数国家正在逐渐采用智能门安全系统。任何门安全系统最重要的主要部分就是准确识别通过门进入的个人。人脸加语音识别可能是人与之间进行认证最自然的方式。此外，在指纹技术之后，这些特征是最流行的生物识别认证特征。生物识别（或简单称为生物识别学）是根据物理或行为特征建立个人身份的科学。这是一个快速发展的领域，应用范围从安全访问个人计算机到进入一个国家。虽然在商业和政府应用中大规模生物识别系统的部署增加了公众对该技术的认知，但*An
    Integrated Approach to Home Security and Safety Systems*是一本介绍生物识别基础的教材，它结合了人脸和语音识别的集成算法，旨在为独居人员提供安全保障。书中详细介绍了生物识别领域中常用的两种模态，即人脸和语音。还简要讨论了其他几种模态，如手形几何、耳部和步态，以及高级主题，如用于心率检测的指尖应用。


    《An Integrated Approach to Home Security and Safety Systems》为计算机科学和电气专业的本科及研究生设计，也适用于研究人员以及生物识别和计算机安全专业人士。


