    ## 1. Context awareness

    One should always be context aware so that they can know about user’s state and
    surroundings and also have the ability to modify their behavior [[7]](#ref-list.xhtml_refchapter_7).
    A user’s context encompasses both human factors as well as physical environments.
    Human factors have factors such as heart state, temperature and emotional state,
    while physical environment has factors such as noise and location. Context free
    is well defined by five W’s. The ‘five W’s’ include the following:


    * **Who**: the ability of devices to identify not only their owner but also other
    people and devices in its vicinity within the environment.

    * **What**: the ability to interpret user activity and behavior using that information
    to infer what the user wants to do and provide the necessary information and help.

    * **Where**: the ability to interpret the location of the user and use that to
    tailor functionality. This one is the most explored aspects of context.

    * **When**: the ability to understand the passage of time, use it to understand
    the activities around and to make inferences.

    * **Why**: the ability to understand the reasons behind certain user actions.
    This might involve sensing the user’s affective state, such as body temperature
    and heart rate.


    ## 2. Social impact

    Pervasive computing will have a more critical social impact contrasted with regular
    processing innovation inside any climate, changing our associations with gadgets
    as well as others also. The implanting of computational antiquities and increase
    of basic ancient rarities with no computational abilities except for exist inside
    the climate, will bring about better approaches for acting and communicating among
    individuals in that climate. This will affect individuals'' current social conduct,
    most likely bringing about new social structures. The ramifications of this will
    be that we are not just keen on relational connections among co-found individuals
    (without the innovation) or connections among individuals and gadgets just (within
    the sight of the innovation), however in the framework intervened human–human
    connections that arise within the sight of the innovation.


    ## 3. Privacy and trust

    Privacy is one of the most social issues for users and security of information.
    It results in continuous monitoring of user’s activities. The main factor to depend
    on pervasive computing infrastructure is to trust it. Conversely, infrastructure
    needs to be confident of user’s identity.


    As client turns out to be more reliant on a pervasive figuring framework, thusly,
    it turns out to be more educated about that client’s inclinations, personal conduct
    standards, developments and propensities. Basic models incorporate user identity,
    which may be shown up through the validation of his own cell phone, the area of
    places he has been in a day and so forth. This brings up issues of who can approach
    such data and what they could utilize it for. Clients who have a decent comprehension
    of such frameworks and like the conceivable potential for the deficiency of protection
    may pick not to utilize them, since in corrupt hands; this data may be transformed
    into a weapon against them. To get clients to depend on pervasive figuring framework,
    we should get them to confide in it. On the other hand, the foundation should
    be sure of a client’s personality and approval level to react properly to their
    solicitations. The test at that point, is to build up this common trust in a way
    that is negligibly meddling and consequently, safeguards imperceptibility. Examination
    issues, here, include: different strategies that could be utilized for client
    verification in this worldview, deciding if we could repeat techniques that were
    created for the work area climate or rather centred on more up to date and apparently
    more precise biometric techniques. We should adjust the necessity for consistent
    conduct and the need to caution clients about like.


    ## 4. Device heterogeneity and resource constraints

    Ubiquitous computing will have to support multiple devices with varying hardware
    capabilities in order to be everywhere. These capabilities result in trade-offs
    that inevitably influence the development of applications and their capabilities.
    With multiple devices at each user’s disposal, there will be a need for mechanisms
    that help determine which tasks are appropriate for each device. As users move
    from one device to the next, applications with the ability to move from one device
    to the next will need to readjust to the uniqueness of each device, optimizing
    their effectiveness according to the device capabilities. As the devices get more
    versatile, more imperatives emerge. They have to be more modest in nature to allow
    users to conveniently move around with them; this size constraint limits other
    resources like screen size, processing power, battery life and so forth, which
    in turn influences other factors like connectivity and the development of services
    and applications.


    ## 5. Power management

    Power consumption consists of three parts: storage, communication and processing.
    To control power, a technique named ‘turning a knob’ is used. It is easy to lower
    the power of wireless transmitter by reducing output power, effectively reducing
    its range. Another method is switching between heterogeneous subsystems, e.g.,
    switching between `Wi-Fi` and `Bluetooth` networks. But support to deal with heterogeneous
    interfaces, more software support is required. Processing is a part whose requirements
    varied from little to extremely high. If the issue is of single processor, it
    is possible to control power consumption by either selectively deactivating individual
    block. Power consumption can also be controlled by using multiple processors.
    Storage is the system that can consume power in pervasive system. There are number
    of storage media that are available for such systems: physical disk, `DRAM`, `SRAM`
    integrated with processor. Similar to processor and wireless subsystem, each kind
    of storage presents a different power profile to the system.


    ## 6. Wireless discovery

    Management is also a big issue for the given system itself. In the previous time,
    there were number of people using single computer. Then, with the PC revolution,
    a stage is reached when single computer is used by a single person, now the time
    has come with the introduction of cell phones and other portable devices; a stage
    is reached now where multiple computing devices are associated with a single person.
    As per person system usage increased, the conceptual, physical and virtual management
    of these devices becomes an issue. Embedded processing in everyday objects such
    as a coffee cup or chair exasperates this problem: number of computing devices
    that are growing exponentially, they must somehow be managed. Major problem that
    is faced for large collection of devices is just a basic knowledge of what exists:
    if I know something exists, how do I find it or if I have a collection of devices,
    how do I know what they are? The solution to this problem is to release objects
    from a specific designation and treat a coffee cup as just a coffee cup instead
    of a specific coffee cup. This shift makes our life easier. Computer systems are
    having a particular unique name, i.e., `IP address`, which is a convenience that
    may not exist in a deeply embedded environment.

