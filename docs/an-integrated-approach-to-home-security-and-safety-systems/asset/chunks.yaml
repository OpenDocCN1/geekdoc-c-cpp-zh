    这种设备被称为示波动法血压计，如图 4.12 所示。它使用电子压力传感器来测量血压，并以数字形式显示在显示器上。该设备像水银血压计一样有一个充气气囊，气囊连接在电子单元上。与其他类型的区别在于所采用的技巧。它的报告基于动脉内血液流动产生的声音。它利用压力传感器评估并测量动脉的振动。当气囊充气和放气时，会产生振动。这些振动通过算法处理产生收缩压和舒张压值，并数字显示在屏幕上。


    ![](img/fig4_12.jpg)


    图 4.12 自动数字血压计。


    它们由电池供电。使用这种设备的优点是紧凑且便携。该设备操作简单，误差机会降最低，但缺点是它很脆弱，在处理设备时应妥善维护。


    ### 4.2.4 心电图](#contents.xhtml_toc3_74)


    心脏是一个四腔肌肉，其功能是向全身泵血。心脏实际上是两个“半心”，即左右两部分同步跳动，如图 4.13 所示。这两个部分中的每一个都有两个部分或腔：上腔称为心房，下腔称为心室。


    ![](img/fig4_13.jpg)


    图 4.13 人体心脏解剖。


    这个术语由 Willem Einthoven 于 1893 年引入。心肌的收缩和舒张导致血液流出心脏。在每个心周期期间，心脏中的一组组织会产生电形式的脉冲并将其扩散到整个心脏，导致心肌收缩，如图
    4.14 所示。在人体的特定部位放置电极以检测脉冲。然后，心电图获取这些变化的脉冲并显示心脏的整体工作情况。典型的心电图受到以下因素干扰：周围设备的电磁干扰、测量噪声和仪器噪声。心电图是通过附着在身上的电极接触来监测心脏功能的传统方法。


    ![](img/fig4_14.jpg)


    图 4.14 心电图 (ECG)。


    计算每分钟心率的公式如下：


    ```

    heartbeatrate/min = 1/[pulseperiod/(3 * 512 * 60)] + 92160/pulseperiod

    ```


    ### 4.2.5 基于加速度计的应用](#contents.xhtml_toc3_75)


    该应用可以计算由心脏运动引起的胸部震动。这种方法很容易受到噪声影响，且大多数时候结果不准确。它基于心搏图（BCG）原理，在不接触身体的情况下检测心率。它的优点是非接触式测量，能够在不打扰患者的情况下进行持续监测，如图
    4.15 所示。它非常容易使用。


    ![](img/fig4_15.jpg)


    图 4.15 基于加速度计的应用。


    ## 4.3 提出的技术：指尖应用](#contents.xhtml_toc2_76)


    所提出的技术基于利用传感智能手机进行健康监测。每个人在任何地方任何时间都带着智能手机，这种随身携带的属性使其成为监测健康参数并在紧急情况下向家属发送短信的完美工具。所提研究工作的目的是使用红外传感器实现一种低成本便携健康监测设备，为了实现这一目标使用了两个模块：采集（Acquire）和处理（Process）。在采集过程中，使用智能手机中的传感器通过指尖采集
    5–6 秒的波形。波形由许多帧组成，通过采样概念和快速傅里叶变换（FFT）算法提取采样率值。在处理过程中，使用峰值检测和平滑处理来获得清晰的波形结果。


    第一步是按住手机摄像头镜头 5–6 秒，以便获得读数，如图 4.16 所示。当用指尖覆盖摄像头时，手机屏幕并不是黑色的，而是红色的，闪光灯会开启，这样就有足够的光线到达手指进行准确测量。


    ![](img/fig4_16.jpg)


    图 4.16 指尖放在摄像头镜头上。


    在这项工作中，使用 iPhone 6s 录制视频并 `.mov` 格式复制到笔记本电脑，因为该格式与 MATLAB 工具兼容。然后，使用 MATLAB 工具对该视频进行处理。


    #### 所提工作的步骤：


    所提应用的完整步骤列在框图中，如图 4.17 所示。


    ![](img/fig4_17.jpg)


    图 4.17 指尖应用的步骤。


    #### 视频信号采集：


    采样信号时首先需要的是带宽。人体心率在 60 到 200（每分钟跳数）之间，但会根据年龄、健身状况和体力活动而变化。在所提工作中，假设正常范围在 40 到
    230 bpm 之间。使用 iPhone 6s 视频以 87 帧的速率录制，如图 4.18 所示。


    ![](img/fig4_18.jpg)


    图 4.18 红色平面信号采集。


    #### 亮度信号计算：


    处理的是随时间变化的亮度，但亮度变化并不包含所有像素，因此通过使用红色平面获取所有像素的平均值。红色平面消耗了大部分能量，因此它提供了相似的结果且成本更低。


    #### 带通滤波：


    信号采集后，使用滤波器：带通滤波器，它通过禁用感兴趣带外的频率来工作。使用这种滤波器的优点是减少后续处理步骤中的噪声因素，并有助于使结果平滑。在所提工作中使用了巴特沃斯滤波器（Butterworth），因为它是一种
    IIR 类型滤波器，在给定带宽下，所需的阶数远小于 FIR 滤波器。


    #### 快速傅里叶变换：


    主要使用两种变换：离散傅里叶变换（DFT）用于将信号从时域转换到频域，而快速傅里叶变换（FFT）算法用于提高处理时间。当从计算复杂度的角度对 DFT 和 FFT
    进行比较时，DFT 提供 `O(N²)` 值，而 FFT 提供具有 `O(N log(N))` 值的相似结果。


    #### 滑动窗口：


    持续心率估计通过三种方法完成：1. FFT，2. 峰值检测和 3. 每 0.5 秒进行一次平滑。计算在包含最后 6 秒信号样本的窗口内持续执行。基本上，窗口在信号上移动，因此被称为滑动窗口。窗口每
    0.5 秒移动一次，因为在此时刻进行计算不会提高输出的时间准确性，但在读数时可以提高时间分辨率。


