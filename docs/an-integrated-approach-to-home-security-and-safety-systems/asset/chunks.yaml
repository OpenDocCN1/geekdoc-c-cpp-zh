  raw: 'Bark Filter Bank consists of integration of three factors into one filter
    bank: frequency warping, smoothing and sampling. An equal loudness pre-emphasis
    weights the filter bank outputs to simulate the sensitivity of hearing. Equalized
    values are transformed according to a power Law of Stevens by raising each to
    the power of 0.33\. Resulting auditory warped line spectrum is further processed
    by linear prediction. Applying linear prediction to auditory warped line spectrum
    means to compute predictor coefficients of a signal. Finally, cepstral coefficients
    are obtained from predictor coefficients by a recursion that is equal to log of
    the model spectrum followed by inverse Fourier transform.


    Advantages:


    *   It reduces the discrepancy between voiced and unvoiced speech.


    *   Its resultant feature vector is low dimensional.


    *   It is based on the short-term spectrum of speech signals [[63]](#ref-list.xhtml_refchapter_63).


    *   The coefficients of PLP are mainly used as they provide correct value of high-energy
    regions of the voice spectrum.


    *   LPC approximates the voice spectrum in equal manner for all frequencies, and
    this presentation is required to known principles of human hearing.


    Disadvantages:


    *   Its resultant feature vector is dependent on whole spectral balance of formant
    amplitudes.


    *   Its spectral balance is easily altered by the communication channel, noise
    and equipment used.


