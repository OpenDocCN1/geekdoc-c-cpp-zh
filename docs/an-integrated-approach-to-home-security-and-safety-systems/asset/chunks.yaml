- fmt: "\nFace recognition has taken proper form by using a wide range of areas. There\
    \ are two types of face recognition methods that have been described named as:\
    \ feature based and holistic based. In feature based, features are extracted on\
    \ the basis of properties and geometrical relationship is calculated on the basis\
    \ of facial features including eye, chin, mouth and nose [[81]](#ref-list.xhtml_refchapter_81).\
    \ This approach is not suitable for practical applications. In holistic or appearance-based\
    \ approach, full image representation is used, and it is based on high-dimensional\
    \ vector representation. \n\nThe face recognition system consists mainly of two\
    \ steps: extraction of features with recognition of face. In extraction process,\
    \ feature is extracted from face and in recognition; these features are matched\
    \ with all the features stored in the database. Then, similarity score will be\
    \ checked that is based on Euclidean distance and then used in taking the final\
    \ decision. A variety of algorithms are used for extraction of features in a face\
    \ recognition system named as: `PCA`, `ICA`, `LDA`, etc. but most commonly used\
    \ method is a `PCA` (principle component analysis) with `ICA` (independent component\
    \ analysis). They provides help in dimensionality reduction, they allow data compression\
    \ while preserving the whole information; it converts all the images into vector\
    \ form and store them in a single matrix [[82]](#ref-list.xhtml_refchapter_82),\
    \ [[83]](#ref-list.xhtml_refchapter_83). Sometimes, the performance of the system\
    \ degrades when there is more variation in pose, illumination conditions, etc.\
    \ So, this problem has been addressed in this proposed work. \n\nThe hybrid `PICA`\
    \ algorithm has been proposed in this research work to increase the recognition\
    \ rate of the face recognition systems. Integrated `PCA` and `ICA` have been used\
    \ for extraction of features and for classification: back propagation neural network\
    \ is used. The performance for proposed algorithm in face recognition has been\
    \ tested using 41 images in the training database. Hybrid `PICA` algorithm outperforms\
    \ the previous methods.\n\nVoice recognition has also been performed that includes\
    \ three main steps, i.e. processing of data, extraction of features and recognition\
    \ of the voice [[84]](#ref-list.xhtml_refchapter_84). Feature extraction is a\
    \ process used to extract take out the features and convert them into feature\
    \ vectors. Redundancy is removed from the features of a user. In every voice recognition\
    \ system, there are two models: extraction and recognition phase. In the extraction\
    \ phase, every model is trained by using features of voice and in recognition\
    \ phase these features are matched with all the features placed in the database.\
    \ By using this concept, similarity score will be calculated and this score is\
    \ used to make the final decision. \n\nVoice recognition system can be classified\
    \ in such a way that how many spoken words are recognized: isolated word needs\
    \ each word is having silence on both the sides of the window. It operates on\
    \ an individual word taken at a time with required pause between the words. It\
    \ is the most simplified form of voice recognition as the endpoints are simpler\
    \ to find. Connected words works in a similar way as isolated words, but it requires\
    \ a minimum gap between the words separated to each other [[85]](#ref-list.xhtml_refchapter_85),\
    \ [[86]](#ref-list.xhtml_refchapter_86). Continuous speech is not separated by\
    \ pauses; it works on speech in which all words are associated to each other.\
    \ In this, a user speaks in a natural way, and it is difficult to recognize because\
    \ it needs methods to define boundaries of words. There are a number of methods\
    \ [[87]](#ref-list.xhtml_refchapter_87) that can be used for extraction of features\
