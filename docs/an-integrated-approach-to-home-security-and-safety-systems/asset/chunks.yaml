    medical technology, etc., as shown in [Figure 1.8](#ch01.xhtml_fig1_8).


    ![](images/fig1_8.jpg)


    Figure 1.8 Pervasive computing applications.


    ### [1.4.2 Pervasive healthcare system](#contents.xhtml_toc3_9)


    In traditional healthcare system, critical patients mostly don''t get treatment
    in time that results in high death rate and the patients who are treated by one
    doctor are not entertained by other doctors due to privatization of hospitals
    [[6]](#ref-list.xhtml_refchapter_6). Many times the ambulance carrying patients
    gets stuck in the traffic resulting in delayed treatment and hence death of the
    patients. Moreover, on the way to hospital, only limited resources are available
    in the ambulance for the immediate treatment of the patient which can worsen the
    health condition of the critical patient. In pervasive healthcare system, these
    all issues are well dealt with, and security and safety of the patient is the
    major concern that is taken into consideration utmost.


    The complete scenario of real-world pervasive healthcare system is shown in [Figure
    1.9](#ch01.xhtml_fig1_9). It examines the vision of new field pervasive healthcare
    and identifies new research thrusts: convenient communication and access to PHR
    (Patient Health Record), helping experts, patients and others to navigate and
    locate nearest health care, convenient traffic management for health experts.
    This system consists of multiple levels, each of which serves a different yet
    unique purpose. Each module works in an independent way, yet they are interconnected
    by the centralized network and server. The system is divided into three parts:
    centralized network and server, the smart ambulance and the user application/interface.
    Each of them consists of various modules, functioning in an autonomous way and
    serving a different purpose, all interconnected. The smart ambulance has a traffic
    monitoring module, which has been implemented using smart IoT (Internet of Things)
    technologies. What this module does is, it takes the real-time location data and
    gives a shortest distance from ambulance to the patient and further to the nearest
    hospital. The smart ambulance has some embedded health sensors in it, which help
    to monitor the patient’s condition on the go. There are various sensors that will
    be giving live reading of the patient’s health to be sent directly to the concerned
    doctor. The medical team connected to the centralized network and the general
    physician who stays next to the patient in the ambulance, they keep on monitoring
    the patient’s health condition continuously in real time through sensors embedded
    in the ambulance and wearables worn by patient until he/she reaches safely to
    the nearest hospital. This helps the associated doctors, present at the hospital,
    to make necessary arrangements before the patient arrives the hospital. Also,
    the general physician and the medical team take care of patient, if his/her health
    worsens in the journey before arrival to the hospital.


    ![](images/fig1_9.jpg)


    Figure 1.9 Pervasive computing healthcare system-example.


    ### [1.4.3 Challenges of pervasive computing](#contents.xhtml_toc3_10)'
