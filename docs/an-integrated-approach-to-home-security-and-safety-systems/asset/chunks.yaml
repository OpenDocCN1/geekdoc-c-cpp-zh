    ## 1. 人脸识别与语音识别


    2. 人脸识别测试通过但语音识别测试失败。

    3. 人脸识别测试失败但语音识别测试通过。

    4. 当人脸识别和语音识别均未成功时。


    在第一种情况下，门口人员的类别将作为输出显示在屏幕上，这些类别从预定义的类别中产生：家人、朋友、邻居或未知。在第二和第三种情况下引入了相似性索引技术。当上述两种技术（人脸识别技术或语音识别技术）中的任何一种无法正确或准确识别人员时，就会考虑这种技术。这是一种独立于内容的语音识别技术，根据音调、语速、语音调制和频率等语音特征来识别语音，而不考虑门口人员所说话的文本或内容。将门口人员的语音特征与属于所有四个类别的人员语音特征进行比较。如果门口人员语音信号特征与任何已存储语音特征之间的差异小于或等于`0.014`，则匹配成功，否则该人员被识别为未知类别。该值被视为相似性索引，即
    `0.014` 被视为语音识别的阈值。如果相似性索引大于或等于`75%`，则门口人员将被宣布为已知人员，并在屏幕上显示其所属类别，并根据其所属的类别，向属于家人、朋友和邻居类别的相关人员发送文本消息；如果相似性索引小于`75%`，则
    `MATLAB` 窗口底部不会出现消息，因为门口人员属于未知类别。在第四种情况下，屏幕上输出显示门口人员属于“未知”类别。


