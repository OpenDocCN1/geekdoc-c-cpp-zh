  trans: "\n\n# 图 1.18 基于虹膜的识别。\n\n- **行为生物识别**：它由从用户的动作中获取的测量值组成，其中一些是从人体间接测得的。\n\
    \n### 1.5.2.5 击键动力学\n\n这是一种借助键盘检查人员击键习惯的自动化方法。通过这种方法，可以检查人员击键的动力学特征，例如用户按下或释放按键时的速度和压力。该技术的目标是提高鲁棒性和唯一性。该应用的一个示例是计算机访问，其中这种生物识别技术可以持续识别计算机操作人员的身份。人员通过输入登录\
    \ ID 和密码在系统上进行身份验证。使用这种技术的优点是，除了全球通用的键盘外，它不需要任何额外设备。\n\n### 1.5.2.6 动态签名验证\n\n\
    这种方法是文档认证和金融交易等许多应用中需求最大的用户验证形式之一。该方法用于检查如图 1.19 所示的书的速度、方向、准确性和压力。在离线模式或之前使用的方法中，用户在普通纸上书写签名，然后使用扫描仪将该纸张数字化，最后由系统验证签名；但在目前使用的在线模式下，用户通过\
    \ PDA 在 iPad 或数字写板上保存签名，然后进行识别。\n\n![](img/fig1_19.jpg)\n\n图 1.19 基于签名的识别。\n\n\
    该系统使用成本不高，验证用户所需的时间非常短，但这种技术存在存在的问题是其错误率较高。\n\n### 1.5.2.7 语音/声纹识别\n\n这种技术用于根据语音信号识别用户，因为它将语音转换为文本。对于语音识别，可以使用多种策略：支持向量机、隐藏马尔可夫模型、动态时间规整、矢量量化等。通过麦克风录制音频文件[[20]](#ref-list.xhtml_refchapter_20)。但噪声因素是这种生物识别技术的主要关注问题。用户身份验证所需较短，但其准确性较低。图\
    \ 1.20 显示了由人说出的单词所产生的信号。\n\n![](img/fig1_20.jpg)\n\n图 1.20 由人说出的单词产生的语音信号。\n\n\
    #### 1.5.2.7.1 语音识别系统\n\n语音是带有语言内容的声音的名称。语音识别项基于语音中包含的波形对人员进行验证的任务。识别人的声音以验证身份，并用于语音拨号、语音邮件和数据库访问服务等许多应用中。当人对着麦克风说话时，计算机会将单词的声音转换为另一种形式，即计算机系统上可用的文本。计算机或笔记本电脑会重复该人所说的单词，或者为下一次提供提示。在早些时候，语音识别程序要求人以断断续的方式的方式；这种方式要求人在两个单词之间留空隙，但现在语音识别系统非常易用。人可以在单词之间不进行任何停顿的情况下说话。唯一的条件是人必须以清晰的方式说话。在该系统中，包含两个会话：\n\
    \n- 注册阶段（Enrolment session）\n- 操作阶段（Operation session）\n\n在注册阶段，已注册的用户将提供语音样本，用以训练该用户模型。\n\
    \n在操作阶段，通过摄取存储在数据库中所有用户的语音样本来完成匹配。最后，做出决定以接受或拒绝该用户的身份。\n\n语音识别过程的所有步骤如图 1.21 所示。\n\
    \n- **表示（Representation）**\n    **预处理：**这是识别系统的第一步，使用麦克风录制语音，然后在 5000 Hz 的采样频率捕捉信号。在此步中，使用高通滤波器移除\
    \ 100 Hz 以下的频率（这些频率包含噪声因素）。预处理执行的重要因素是分段或端点检测。语音分段从信号能量超过阈值开始，当信号能量低于阈值时结束。\n\n\
    - **模型（Model）**\n    **特征提取：**信号处理后，下一步是提取或取出特征，为了计算，根据时间帧提取观测值。假设语音信号在这些长度为 25\
    \ ms 的帧内是恒定的。时间帧是重叠的，并且通常偏移 10 ms。在时间窗口上进行快速傅里叶变换，进入频谱。人类耳朵对所有频段的感知并不平等的。这种效应可以用非均匀频率带宽的带通滤波器来模拟。在\
    \ 500 Hz 之前，滤波器的宽度为 100 Hz，之后按对数增加。滤波器中心频率定义在所谓的 Mel 标度中。通过离散余弦变换使频谱去相关化。在生成的系数中，前几个系数具有最重要的意义。因此，仅选择前几个（例如十个）系数作为特征向量。生成的特征称为梅尔倒谱（Mel\
    \ Cepstra），通常缩写 MFCC。\n\n- **搜索（Search）**\n    1. **解码（Decoding）：**这是一种计算单词序列与特征向量生成的信号匹配率的方法。在解码过程中，有三种信息可用：a)\
    \ 声学模型，b) 字典和 c) 语言模型。解码的条件是知道已知单词的概率。\n    2. **后处理（Postprocessing）：**这是识别过程的最后一步，对已处理的信号进行接受或拒绝的分类。\n\
    \n![](img/fig1_21.jpg)\n\n图 1.21 语音识别过程。\n\n#### 1.5.2.7.2 语音识别技术\n\n- **梅尔频率倒谱系数（MFCC）：**这是用于识别的最常用的倒谱分析技术。在此处，频段使用了对数表示，因此比其他系统提供了更清晰的响应。在此处，MFCC\
    \ 的特征向量通过信号分析中的每一帧计算得出[[21]](#ref-list.xhtml_refchapter_21)。首先通过输入的信号提取系数；这些信号被划分为帧。在这些帧上应用汉明窗时，信号的不连续性降至最低，如图\
    \ 1.22 所示。\n\n优点：\n- 用于语音处理任务。\n- 识别准确性和性能率高。\n- 复杂度低。\n\n缺点：\n- 噪声鲁棒性较差。\n\n\
    ![](img/fig1_22.jpg)\n\n图 1.22 MFCC 技术。\n\n- **感知线性预测（PLP）：**它的工作方式与线性预测编码相似；这意味着它也如图\
    \ 1.23 所示基于语音的短期频谱。它消除了语音信号中不需要的信息，有助于提高语音信号的识别率。\n\n- **线性预测编码（LPC）：**\n\n"
