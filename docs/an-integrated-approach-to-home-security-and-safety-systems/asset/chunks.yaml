    这项技术具有许多优势：许多许多公司通过使用移动设备提高了生产力，从而减少了客户的成本和时间。另一个优势是它可以用于娱乐目的（可以使用移动计算随地播放视频和音频录制）、便携性（用户无需处于固定位置即可工作，只要建立了连接，就可以在任何地方工作）以及云计算（如果连接了互联网，就可以随时随地访问数据，然后可以在许多移动设备上访问这些文件），如图
    1.4 所示。现在，云计算服务涵盖了广泛的选项，从基础的存储、网络连接和处理能力，到自然语言处理、人工智能以及标准的办公应用程序。


    ![](img/fig1_4.jpg)


    图 1.4 云计算概览。


    ## 1.4 泛在计算


    泛在计算是当今世界发展非常迅速的领域。在这项技术中，小型设备被以无处不在的方式使用，并以无形的方式嵌入，以提供无处不在的环境。根据 Weiser 的观点，一种被称为泛在计算的系统创建了一个与普通环境集成且与其无法区分的全连接介质。泛在计算设备是尺寸从几毫米到几米不等的小型设备，这些设备通过有线或无线链接相互连接[[5]](#ref-list.xhtml_refchapter_5)。这种计算的目的是通过使用工具让每个人的生活变得更简单，从而能够成功且轻松地管理信息。泛在计算技术超越了个人电脑的概念。它基于这样一种观点：从衣服到任何类型的设备，它们都与芯片集成，以便与其他设备的网络连接。这些设备具有许多特点，如：它们具有内存有限的小型、廉价处理器；这些设备在没有任何用户交互的情况下与其他设备连接，并且将通过有线或无线链接进行连接。泛在计算的原理图如图图
    1.5 所示。


    ![](img/fig1_5.jpg)


    图 1.5 泛在计算系列原理图。


    ### 1.4.1 泛在计算示例


    泛在计算有很多名称，如“无处不在计算”、“增强现实”、“虚拟现实”、“可穿戴计算”、“环境计算”、“会思考的物体”和“智能空间计算”。在日常生活中，如果一个人发现一个箱子太重无法抬起，就会吹哨或叫一个超重力的助手来帮助。但在泛在计算中，如果一个人去搬那块物体，隐形的计算机代理检测到该人力量不够，它会自动帮助该人，甚至无需询问。


    在下一个场景中，有一个房间可以根据用户的配置文件自动管理加热、冷却和照明效果。另一个是“智能”或“智能冰箱”，如图 1.6 所示，用于在食品过期或失效时提醒主人。这台冰箱应该意识到冰箱内部的内容，并且在供应不足时具有订购新食物的能力，但这种智能冰箱尚未上市市场上。


    ![](img/fig1_6.jpg)


    图 1.6 智能冰箱。


    这种智能且所有人使用的技术是“智能手机”。智能手机是一种包含通话和发送短信之外高级功能的移动电话。大多数智能手机都有显示照片、播放视频、检查和发送电子邮件以及浏览网页的能力。如今的移动设备配备了近
    14 个传感器，产生关于运动、位置和我们周围环境的原始数据，如图 1.7 所示。


    ![](img/fig1_7.jpg)


    图 1.7 智能手机使用的传感器。


    在移动计算中，拥有通话和信息功能的手机的人在保持连接时处于连接状态。但在泛在计算中，人即使在移动时也保持连接状态，如图 1.8 所示。


    ![](img/fig1_8.jpg)


    图 1.8 泛在计算应用。


    ### 1.4.2 泛在医疗系统


    在传统的医疗系统中，患者往往被堵在交通中导致治疗延误和高死亡率。在泛在计算中，患者与医生实时连接，允许获得立即关注和保障。现实世界泛在医疗系统的完整场景如图图
    1.9 所示。


    ![](img/fig1_9.jpg)


    图 1.9 泛在计算医疗系统示例。


    ### 1.4.3 泛在计算的挑战


