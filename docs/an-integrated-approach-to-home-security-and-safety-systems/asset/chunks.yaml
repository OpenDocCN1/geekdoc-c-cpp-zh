  trans: "\n\n- 对内存容量的要求\n- 特征向量的维度很高\n\n结合 `ICA` 算法的 PCA 在较少或较多的姿态、光照变化情况下效果良好，在计算面部特征之间的距离时，它们使用了\
    \ `Euclidean distance` 概念；降维方法由 `PCA` 算法使用，这对于保留有用信息的同时压缩数据是必要的。独立特征的提取由 `ICA`\
    \ 算法完成，但其他算法在较少或较多的姿态变化、光照变化情况下效果良好。`LDA` 算法没有考虑多图像，并基于马哈拉诺斯距离进行计算 [[57]](#ref-list.xhtml_refchapter_57)。`DCT`\
    \ 仅在变化较小时效果良好，而 `Wavelet` 仅在姿态和光照因素大幅变化时效果良好。\n\n## 2.3 提出的混合 PICA 算法\n\n自动人脸识别已成为一个非常活跃的研究领域，而自动对独立在家生活的人进行健康监测是一种用于向其家庭成员提供个人健康信息的方法。图\
    \ 2.10 提供了一个用于人脸识别的集成模型。\n\n![](img/fig2_10.jpg)\n\n图 2.10 用于人脸识别的集成 PICA 模型。\n\
    \n我们的工作使用了 `PCA` + `ICA` 的结合方法进行特征提取，因为与单独的特征提取技术相比，这种方法有助于以较高的识别率实现我们的目标；并在此组合中，使用名为\
    \ `back propagation` 的神经网络作为分类器。`PCA` 的演变 [[58]](#ref-list.xhtml_refchapter_58)\
    \ 是通过使用 `Eigenvectors` 完成的，通过这些 `Eigenvectors` 对给定输入考虑特征，称为主成分。它的优势是一个包含数据压缩的降维过程，但没有信息丢失。\n\
    \n`ICA` 是一种非常有用的技术 [[58]](#ref-list.xhtml_refchapter_58)。馈向神经网络是由三层组成的简单网络：a)\
    \ 输入层，b) 隐藏层和 c) 输出层。\n\n以前人脸识别系统的大部分工作由单一特征提取技术加分类器组成，但在提出的工作中使用了四步程序。\n\n1.\
    \ 选取训练集并对其进行预处理，其中使用 `PCA` 和 `DCT` 等不同方法对图像进行归一化。\n2. 使用人脸识别算法 `PCA` + `ICA` 的组合提取独立特征。\n\
    3. 选择馈向神经网络进行分类，对给定的输入图像进行分类。\n4. 结合每个神经网络的输出对输入图像进行分类，定义该输入图像的类别。\n\n### 提出的混合\
    \ PICA 算法：\n\n1. 首先建立训练集。\n2. 然后，在训练集上应用 `mark features` 函数来标记输入图像的眼睛和嘴部位置。\n\
    3. 应用 `align faces` 函数，将 `JPG` 格式的人脸图像转换为 `pgm` 格式，因为 `MATLAB` 工具支持 `pgm` 格式。\n\
    4. 使用名为 `C` 的矩阵存储所有图像。\n5. 应用 `PCA` 函数：\n    * 数据中心化：通过从均值图像中减去每幅训练图像，对每幅训练图像进行中心化，并存储在名为\
    \ `A` 的矩阵中。\n    * 计算协方差矩阵：将矩阵 `A` 中的中心化图像乘以其转置，形成协方差矩阵 `L`。如果每张图像的大小为 $N*N$，则该矩阵的大小为\
    \ $N²*N²$。\n      `L = A * A'`\n    * 计算 `Eigenvectors`：寻找 $N²*N²$ 矩阵的 `Eigenvectors`\
    \ 是不可行的。因此，使用矩阵 `A'*A` 容易计算 `Eigenvectors`。\n      $C = 1/(M)\\sum\\limits_{i\
    \ = 1}^{M}{Ki \\ast Ki^{T} = B \\ast B^{T}(N^{2} \\ast N^{2}matrix)}$\n6. 应用 `ICA`\
    \ 算法：从之前计算的 `Eigenvectors` 开始，在中心化和学习的帮助分析 `ICA`。\n    * 中心化：意味着对 `x` 进行球化或去除\
    \ `x` 中的一、二阶统计量。\n    * 学习：计算持有原始数据的 `Xx`。\n      `Xx = inv(wz) * x`\n    * 计算输出协方差：通过提取的均值和原始数据计算。\n\
    \      `Cov(xx')`\n      其中 `uu = w * wz * xx`\n    * 设置阈值并显示结果。\n7. 使用 `MATLAB`\
    \ 工具和 3G 狗接器向类别成员发送短信。\n\n## 2.4 实现\n\n为了衡量 `PCA` 和 `ICA` 的性能，使用 `MATLAB` 工具生成了混合\
    \ PICA 算法的代码。与 `C` 或 `Java` 语言实现相比，优先选择此工具是为了提高识别率。主成分分析 (`PCA`) 与独立成分分析人脸识别算法的结合\
    \ [[58]](#ref-list.xhtml_refchapter_58) 用于面部特征提取，并作为分类器或识别人脸的馈向神经网络 [[57]](#ref-list.xhtml_refchapter_57),\
    \ [[58]](#ref-list.xhtml_refchapter_58)。\n\n**PCA 实现**：`PCA` 算法由两个函数组成：`PcaFn.m`\
    \ 和 `Test.m`。`PcaFn.m` 负责算法初始化、数据训练以及图像投影到降维空间。\n\n在此，输入包含预处理后的图像集。输出包含矩阵形式的数据、图像均值、特征值和降维空间。\n\
    \n`PCA` 实现步骤：\n* 从路径读取人脸图像，将其重塑为向量形式并创建矩阵 `C`。\n* 创建训练列表，包含数据集。\n* 计算图像均值。\n*\
    \ 从所有图像中减去均值并保存结果。\n* 计算 `Eigenvectors` 和 `Eigenvalues`。\n* 计算 `Eigenfaces`。\n\
    * 人脸图像投影到降维空间。\n\n`Test.m` 负责图像识别。它读取图像与数据库中所有其他图像之间的差异。距离最短的图像被认为是识别出的图像。\n\n\
    在此函数中，输入包含图像路径、均值、降维空间，输出提供匹配分数和关联图像。\n\n**ICA 实现**：`ICA` 算法由五个函数组成：`PcabigFn.m`、`spherex`、`zeromn`、`runica`\
    \ 和 `sep96`。`PcabigFn.m` 负责通过通过计算协方差矩阵并重建特征向量来计算 `PCA`。\n\n在此算法中，输入包含列为人脸图像的矩阵\
    \ `C`，输出包含 `V`、`R`、`E`。`V` 意味着列中包含 `Eigenvectors` 的矩阵，`R` 意味着行中的 PCA 系数，`E` 意味着与特征向量关联的特征值矩阵。\n\
    \n`runica` 用于运行名为信息极大化的算法以寻找 $n$ 个独立成分，其中 $n$ 代表提供给算法的人脸图像数量。在此，输入包含一个行图像灰度值的矩阵\
    \ `x` 类，输出包含 `w` 和 `uu`，其中 `w` 意味着包含独立成分的矩阵，`uu` 意味着分离的输出信号。\n\n`spherex` 被 `runica`\
    \ 函数调用。它通过白化矩阵 `w[z]` 对训练向量 `x` 进行球化。在此，输入包含一个要求预定义 `x` 的函数，输出包含 `w[z]` 和 `x`，其中\
    \ `w[z]` 是白化矩阵的。\n\n"
- fmt: '

    `Sep96` is run by `runica` function. This implements the learning rule of info
    max algorithm. It spheres the training vector `x` by passing it through whitening
    matrix `w[z]`. In this function, `input` contains `x`, `w`, `count`, `sweep`,
    where `x` defines the gray values of the images in its rows, `w` defines a matrix
    that hold the weights from learning rule initialized to identity matrix, `count`
    explains a counter increase during iterations and `sweep` holds a counter for
    number of sweeps and `output` holds the value of `w` which contains a matrix containing
    training weights calculated by an algorithm.


    Complete steps that how a face can be recognized and when the face is recognized
    as known or unknown, a procedure of sending messages on the cell phone of family
    members using MATLAB [[59]](#ref-list.xhtml_refchapter_59) tool and the dongle
    are:


    `[Figure 2.11](#ch02.xhtml_fig2_11)` shows the basic GUI of the face recognition
    system. It includes all the steps of recognizing a face like mark features, align
    features, load faces, testing and training.


    ![](images/fig2_11.jpg)


    Figure 2.11 Interface of face recognition process.


    ### Mark facial features

    This is the first step in recognizing a face. It is included in preprocessing
    function which after applying takes images of size 512*512 pixels in JPG format.
    In this, double features of right eye, left eye and mouth are marked manually
    as shown in `[Figures 2.12](#ch02.xhtml_fig2_12)` and `[2.13](#ch02.xhtml_fig2_13)`
    and get a matrix `Labels.mat` of size 1*6 which is showing value of six features
    for single face in `[Figure 2.14](#ch02.xhtml_fig2_14)`. This figure shows a matrix
    form having 6 columns used for extraction of features by using `ICA` algorithm
    and the features that are left are then extracted using the `PCA` algorithm. In
    the proposed work, total 30 features are extracted for face recognition.


    ![](images/fig2_12.jpg)


    Figure 2.12 To mark facial features.


    ![](images/fig2_13.jpg)


    Figure 2.13 Step 1: marking facial features (left eye, right eye and mouth).


    ![](images/fig2_14.jpg)


    Figure 2.14 Step 2: Matrix form of marked facial features.


    ### Align Faces

    This is the second step after mark features. In this module, mouth and eye positions
    are aligned into a `pgm` format from JPG format as shown in `[Figures 2.15](#ch02.xhtml_fig2_15)`
    and `[2.16](#ch02.xhtml_fig2_16)`. When JPG format is used in mark features and
    loaded into `MATLAB` tool, it shows that this format is not compatible and that
    is why conversion is required in this step.


    ![](images/fig2_15.jpg)


    Figure 2.15 To align the faces.


    ![](images/fig2_16.jpg)


    Figure 2.16 Step 3: Format conversion from JPG to pgm for alignment of faces.


    ### Load Faces

    This step loads all the aligned faces into a matrix named as `C` in which there
    are 41 rows and 70613 columns. The aim of this function is reshaping, it means
    to load all faces in the form of a matrix which is shown in `[Figure 2.17](#ch02.xhtml_fig2_17)`.


    ![](images/fig2_17.jpg)


    Figure 2.17 Step 4: Matrix formation for all the images.


    ### Main Function

    This is the main step which gives output as how many images are matched with training
    database means in terms of percentage it is shown that if 41 images are taken
    for mark features, then from 41 images that is called as training database how
    many images are there in a matrix created by `load faces`. Its benefit is to check
    whether the training database is complete or not before going to next step, i.e.,
    testing of an image. This `[Figures 2.18](#ch02.xhtml_fig2_18)`, `[2.19](#ch02.xhtml_fig2_19)`
    and `[2.20](#ch02.xhtml_fig2_20)` show, respectively, the output of the main function
    which gives `pc` variable. If the value of `pc` is 100%, it shows that training
    database is complete means accuracy of this model is 100%.


    ![](images/fig2_18.jpg)


    Figure 2.18 To run the main function for verification.


    ![](images/fig2_19.jpg)


    Figure 2.19 Output in form of `pc` and `Rankmat`.


    ![](images/fig2_20.jpg)


    Figure 2.20 Step 5: Database formation verification.


    ### Train

    Next step is training of the network by taking a feedforward neural network in
    order to check the performance for the proposed system in `MATLAB` tool. This
    step extracts `ICA` with `PCA` features from the matrix `C` of the `load faces`
    module as depicts in `[Figures 2.21](#ch02.xhtml_fig2_21)`, `[2.22](#ch02.xhtml_fig2_22)`
    and `[2.23](#ch02.xhtml_fig2_23)`. In training, input values are stored as `input.mat`
    file, output values are stored as `targets.mat` file, network type is feedforward
    distributed time delay as it is providing maximum performance when compared to
    others such as `back propagation network` and `hopfield network` and training
    function is `trainlm` which is a by default function.


    ![](images/fig2_21.jpg)


    Figure 2.21 To create neural network by `nntool` in `MATLAB`.


