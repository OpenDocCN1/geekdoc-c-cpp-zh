    ### **Leakage reduction**: DFT works excellently when time signals are infinite.
    A time limited signal having length `N` is correlative to multiplying its counterpart
    with a length `N` rectangular signal. This outcome in evolving the time signal
    spectrum of infinite length from which leakage is produced and to reduce this
    leakage, a function is used with boundaries zero. When input signal is multiplied
    by this function, the resulting boundary values will be zero. For that, Hann window
    is used as it offers good resolution and leakage rejection.


    ### **Peak detection**: Once FFT is measured from the contents of current sliding
    window, the value of peaks in interest band is calculated by using a function
    named as `find peaks` in MATLAB tool.


    ### **Smoothing**: In order to smooth out the signals of heart beat readings more
    continuous, sliding window is coordinated with a number of phases having a series
    of tones in phase and finally smooth heart rate is taken by collecting frequency
    correlates to highest magnitude.


