  raw: 'Face recognition has taken proper form by using a wide range of areas. There
    are two types of face recognition methods that have been described named as: feature
    based and holistic based. In feature based, features are extracted on the basis
    of properties and geometrical relationship is calculated on the basis of facial
    features including eye, chin, mouth and nose [[81]](#ref-list.xhtml_refchapter_81).
    This approach is not suitable for practical applications. In holistic or appearance-based
    approach, full image representation is used, and it is based on high-dimensional
    vector representation. The face recognition system consists mainly of two steps:
    extraction of features with recognition of face. In extraction process, feature
    is extracted from face and in recognition; these features are matched with all
    the features stored in the database. Then, similarity score will be checked that
    is based on Euclidean distance and then used in taking the final decision. A variety
    of algorithms are used for extraction of features in a face recognition system
    named as: PCA, ICA, LDA, etc. but most commonly used method is a PCA (principle
    component analysis) with ICA (independent component analysis). They provides help
    in dimensionality reduction, they allow data compression while preserving the
    whole information; it converts all the images into vector form and store them
    in a single matrix [[82]](#ref-list.xhtml_refchapter_82), [[83]](#ref-list.xhtml_refchapter_83).
    Sometimes, the performance of the system degrades when there is more variation
    in pose, illumination conditions, etc. So, this problem has been addressed in
    this proposed work. The hybrid PICA algorithm has been proposed in this research
    work to increase the recognition rate of the face recognition systems. Integrated
    PCA and ICA have been used for extraction of features and for classification:
    back propagation neural network is used. The performance for proposed algorithm
    in face recognition has been tested using 41 images in the training database.
    Hybrid PICA algorithm outperforms the previous methods. Voice recognition has
    also been performed that includes three main steps, i.e. processing of data, extraction
    of features and recognition of the voice [[84]](#ref-list.xhtml_refchapter_84).
    Feature extraction is a process used to extract take out the features and convert
    them into feature vectors. Redundancy is removed from the features of a user.
    In every voice recognition system, there are two models: extraction and recognition
    phase. In the extraction phase, every model is trained by using features of voice
    and in recognition phase these features are matched with all the features placed
    in the database. By using this concept, similarity score will be calculated and
    this score is used to make the final decision. Voice recognition system can be
    classified in such a way that how many spoken words are recognized: isolated word
    needs each word is having silence on both the sides of the window. It operates
    on an individual word taken at a time with required pause between the words. It
    is the most simplified form of voice recognition as the endpoints are simpler
    to find. Connected words works in a similar way as isolated words, but it requires
    a minimum gap between the words separated to each other [[85]](#ref-list.xhtml_refchapter_85),
    [[86]](#ref-list.xhtml_refchapter_86). Continuous speech is not separated by pauses;
    it works on speech in which all words are associated to each other. In this, a
    user speaks in a natural way, and it is difficult to recognize because it needs
    methods to define boundaries of words. There are a number of methods [[87]](#ref-list.xhtml_refchapter_87)
    that can be used for extraction of features such as MFCC, LPC, PLP and RASTA-PLP,
    but most commonly used methods are MFCC and PLP [[88]](#ref-list.xhtml_refchapter_88),
    [[89]](#ref-list.xhtml_refchapter_89). They both carry speaker dependent as well
    as speaker independent information. But sometimes, the performance of voice recognition
    system degrades especially in noisy environments. So, this issue is addressed
    in the proposed work and the hybrid MFRASTA algorithm has been proposed with a
    way to increase the recognition rate of the voice recognition system. Algorithm
    comprises with four steps: first step is to collect data and apply pre-processing
    process in which audio files are recorded by number of methods in.wav format;
    feature extraction step extracts the features that provide specific information
    from the voice signals. Features have been extracted by using two voice recognition
    algorithms MFCC and RASTA-PLP, combine all the outputs and classify input voice
    that it is known or unknown and last is to send the message to define the category
    of each input voice. The hybrid MFRASTA gives improved results even in the utiquity
    of noise. The capability of proposed hybrid MFRASTA has been tested on a database
    consists of 41 audio files in.wav format. Another one is Similarity Index, which
    will run when one (face and voice) of the recognition technologies is not recognizing
    the user properly. It is text independent system in which a user is recognized
    on the basis of voice parameters such as pitch, tone and pronunciation, irrespective
    of the content of the words spoken by a user. Finally, health service providers
    [[90]](#ref-list.xhtml_refchapter_90) always face a challenge that how to provide
    comfortable health facilities for patients with low cost as the rapidly changing
    style of living in the present day world with the problem of a growing aging population
    requires a demanding need to update all facilities. So, the main objective is
    to establish a low cost and quickest way to provide health care to old age people.
    This research work presents all time available monitoring systems which will help
    in the monitoring of patients. There are a number of devices [[91]](#ref-list.xhtml_refchapter_91)
    that have been described for health monitoring such as phonocardiograph application,
    mercury sphygmomanometer and automatic digital sphygmomanometer, but the challenges
    with these devices have been addressed in the form of noise factor and bulkiness
    to be kept in a proper manner. Wearable sensors are the devices [[92]](#ref-list.xhtml_refchapter_92)
    that can be worn on the body as a part of accessories and can be used easily for
    health monitoring as every time it is not possible to go to hospital and in that
    case, it’s quite hard to handle that situation. Numbers of methods are there to
    measure these parameters like PTT (pulse transit time) for BP estimation, but
    these methods require high complexity devices which are not convenient for users
    to wear. So, to address this issue, the main objective is to develop a low lost
    portable heart beat monitor device. A sensor-based fingertip application has been
    proposed in this proposed work by using an iPhone 6s camera sensor. With the help
    of this application, heart beat has been monitored in an accurate manner and results
    have been obtained by using MATLAB® tools for implementation and report has been
    sent to the family members in case of an emergency.


    ## [6.2 Summary and Scope](#contents.xhtml_toc2_85)'
