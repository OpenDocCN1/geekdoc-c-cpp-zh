    # [Chapter 1](#ch01.xhtml_chapter1) introduces the basic concepts of pervasive
    computing with their challenges and issues. A number of biometric techniques are
    defined with face and voice recognition technology in detail, and different types
    of sensors are described in this chapter along with the objectives of this research
    work. A hybrid PICA algorithm is proposed to provide security to an individual
    at home is presented in [Chapter 2](#ch02.xhtml_chapter2). A hybrid MFRASTA algorithm
    is proposed for providing flexible trust-based security for the individual living
    independently is described in [Chapter 3](#ch03.xhtml_chapter3). In [Chapter 4](#ch04.xhtml_chapter4),
    a fingertip application has been proposed that works on camera lens of iPhone
    for health monitoring of users. [Chapter 5](#ch05.xhtml_chapter5) shows a GUI
    for complete implemented system and shows a comparison between proposed techniques
    with number of previously used techniques in terms of recognition rate. The conclusion
    of the proposed work has been presented in [Chapter 6](#ch06.xhtml_chapter6).
    Some points have also mentioned for future research to make this system more useful.


    # [Chapter 2](#contents.xhtml_toc1_40)


    ## [Hybrid face recognition PICA algorithm for individual''s security at home](#contents.xhtml_toc1_40)


    DOI: [10.1201/9781003120933-2](https://doi.org/10.1201/9781003120933-2)


    ## 2.1 Inroduction to Face Recognition](#contents.xhtml_toc2_41)


    The security framework assumes a crucial part in today’s world. Thus, security
    occupations are made, and workers are recruited for this framework that runs effectively
    over some time. In any case, later on the world has been improved step by step
    investigating the new advances. Countless sorts of a robotized-based security
    framework start to be executed to diminish labor and cost [[38]](#ref-list.xhtml_refchapter_38).
    The face is one of the most promising techniques of biometric technology, and
    it is the most common method of recognition. The human face conveys data about
    age, identity, gender, race and facial demeanors mirroring the feelings and mental
    states. Facial acknowledgment as opposed to a few other biometric qualities doesn’t
    really require the collaboration of individual and can be acted in a subtle manner,
    making it especially reasonable for observation applications [[39]](#ref-list.xhtml_refchapter_39).
    A problem with other biometric techniques based on fingerprint, iris, signature
    recognition, etc., are for collection of data, e.g., in case of fingerprint recognition
    [[44]](#ref-list.xhtml_refchapter_44), the user has to put finger in proper manner
    and direction. But in face recognition, collection of face images is not difficult
    and thus it can be used as a biometric technique. Each face has special features
    that define a particular user. Emotions can also be recognized by using pixel
    intensity, which corresponds features used for detection of emotions [[45]](#ref-list.xhtml_refchapter_45).
    Face recognition is a biometric technique that is most frequently used in a number
    of applications such as banking, security information and virtual reality [[45]](#ref-list.xhtml_refchapter_45).
    Image processing is a method used in face recognition to convert an image into
    digital form and perform some operations on that image so that we can extract
    useful information from it. It consists of three steps: take image using a scanner
    or camera, apply data compression or enhancements in order to analyze the data
    and take output in the form of altered image. The face recognition system involves
    three main steps: data acquisition, feature extraction and recognition [[46]](#ref-list.xhtml_refchapter_46)
    as shows in [Figure 2.1](#ch02.xhtml_fig2_1).


    ```

    !images/fig2_1.jpg

    ```


    Figure 2.1 Steps of face recognition system.


    Acquisition of data is the main step of the face recognition system, which includes
    the collection of facial images through a number of sources. The number of collecting
    images may have different pose variations, illumination variations, etc. So, we
    can easily verify the performance of our recognition system with a number of conditions.
    Sometimes, the input image at the door is classified and different modification
    methods are applied to an input image. In this way, some undesirable parameters
    such as noise, lighting, blurred effects are removed and then it is used for next
    process [[46]](#ref-list.xhtml_refchapter_46). Feature extraction is the next
    step of a face recognition system, which is used to take out the information from
    given images and after extraction, features are used in recognition step. In this
    step, dimensionality reduction is used with noise cleaning [[47]](#ref-list.xhtml_refchapter_47).


    Recognition is the last step of face recognition systems used after feature selection
    and extraction, now the image is classified by using a number of classifiers.
    In this step, a number of images are taken and feature extraction is applied to
    them and stored in the database. When a new image comes for face recognition,
    it first performs face acquisition, feature extraction and then compares all the
    images in the database with this new image. Image is correlated with all the images
    stored in the database to identify an individual as shown in [Figure 2.2](#ch02.xhtml_fig2_2)
    [[47]](#ref-list.xhtml_refchapter_47).


    ```

    !images/fig2_2.jpg

    ```


    Figure 2.2 Face recognition model.


    Every face recognition system consists mainly of two tasks:


    - Verification

    - Identification


    In verification, one to one matching is applicable; as the system helps to match
    a particular individual with a specific biometric existing on file. As this system
    only compares the biometric files, that’s why it is faster and efficient technique
    than identification, e.g., it seeks to provide the answers of specific questions
    like ‘Is this person who is actually saying they are?’ In identification, one
    too many matching is applicable, it means the image is identified in gallery database.
    It seeks to identify an unknown user, e.g., it tries to answer the question ‘Who
    is this person?’ The basic diagram of face recognition is shown in [Figure 2.3](#ch02.xhtml_fig2_3).


    ```

    !images/fig2_3.jpg

    ```


    Figure 2.3 Basic steps of face recognition.


    There exist two types of face recognition methods: feature-based and holistic-based
    [[48]](#ref-list.xhtml_refchapter_48). In feature-based method, features are extracted
    from the face such as eyes, lips and nose and geometric relationship between these
    features is calculated and finally reduced to a vector form. The method that is
    used to compute the distance between various facial features is a Euclidean distance
    method. Elastic bunch graph method is an example of this technique that is based
    on dynamic link structure. With this method, for every individual, a graph is
    generated which is used for recognition purpose by generating graphs for each
    new image in bunch graph method. After then, comparison will be performed by analyzing
    the new face image graph with all the graphs of face images stored in the database,
    and finally, similarity index is calculated.

    '
