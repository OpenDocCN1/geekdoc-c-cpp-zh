    **Matrix formation**: A matrix is a collection of numbers. To form a matrix in
    MATLAB, start with-


    > Square bracket `[`

    > Elements are separated by space or comma (`,`)

    > Semicolon (`;`) is used to separate rows

    > Matrix ends with another bracket `]`


    > For example, to form a matrix as shown in [Figure 1.50](#ch01.xhtml_fig1_50).


    ```mat

    A = [2 4 6; 8 10 12; 14 16 18]

    ```


    ![](images/fig1_50.jpg)


    Figure 1.50 Representation of matrix.


    Result will be `3*3` matrix as shown in [Figure 1.50](#ch01.xhtml_fig1_50).


    **Programming in MATLAB**: As commands are executed in command window, the problem
    is these commands are not saved and executed again number of times. So, a different
    concept is used for executing repeated commands, it is-


    * File creation with commands list

    * Save the file

    * Run the file


    There are two concepts defined in this part: M-file scripts and M-file functions.


    **M-file script**: When MATLAB statements are contained in a sequence, that file
    is named as M-file scripts. It is having an extension `.m`, so it is called as
    M-files. User creates this file to store the code they write for a particular
    application. The representation of an M-file is shown in [Figure 1.51](#ch01.xhtml_fig1_51).
    Consider three equations:


    $X + 2y + 3z = 1$

    $2X + 2y + 4z = 1$

    $2X + 2y = 3z = 2$


    ![](images/fig1_51.jpg)


    Figure 1.51 Representation of M-file.


    Find $x$?


    Use MATLAB editor for file creation.


    `File -> New -> M-File`


    Then enter the statements-


    ```

    \begin{array}{l} \begin{array}{l} {A = \left\lbrack {1 2 3; 2 2 4; 2 2 3} \right\rbrack}
    \\ {B = \left\lbrack {1; 1; 2} \right\rbrack;} \end{array} \\ {X = A\backslash
    B} \end{array}

    ```


    Then save this file, e.g., `test.m` by `File -> save as -> location` that suits.
    And run the file by select run or press run button or by `F5`.


    Run by typing


    ```mat

    >>test

    ```


    **M-file functions**: Functions are the programs that accept the input arguments
    and return output arguments. Each M-file function is written as M-file or function
    in short.


    E.g. `function f = factorial (n)`


    ```matlab

    % Factorial (N) returns the factorial of N

    % Compute a factorial value

    F = prod (1:n);

    ```


    In this, first line starts with keyword `function`. It gives function a name and
    number of arguments.


    ### [1.8.2 Image processing in MATLAB](#contents.xhtml_toc3_36)


    MATLAB uses a toolbox for image processing. Images are composed of of two- or
    three-dimensional matrix of pixels. Individual pixels contain a number or numbers
    that represent gray scale or color which is assigned to it. Color pictures are
    heavier in size as compared to gray scale pictures, so more power is required
    to process color pictures. In image processing, first step is to convert color
    pictures to gray scale pictures and then processing will be done on gray scale
    images. Before this, image is loaded to begin the processing. If image is colored,
    then first image is converted into gray scale for making processing simpler.


    For conversion, a function is used, i.e., `rgb2gray` to change the color. There
    are two functions that are used in image processing: `imread` and `imshow`. `imread`
    is used to read an image file with a particular format, and `imshow` function
    is used to show an image. Last is to write an image using `imwrite` function,
    it allows to save an image as any file supported by MATLAB, which are same as
    supported by `imread`.


    ### [1.8.3 Properties of image](#contents.xhtml_toc3_37)


    * **Histogram**: It is a bar graph that shows data distribution. In image processing,
    it shows the number of pixel values present in an image. Image can be manipulated
    to meet the specifications. For creating a histogram from an image, use `imhist`
    function, `histeq` function is used to for contrast enhancement `graythresh` is
    performed for thresholding.

    * **Negative**: It means the reversal of the input image. For 8-bit image, the
    new image appears as the original. This operation is performed by `imadjust`.

    * **Fourier transform**: The role of frequency is important to understand how
    image processing filters work. An image consists of signals so signals are associated
    with frequencies. There are two ways to know frequency content that is low or
    high. If there is less change in gray scale values when image is scanned, it means
    there is low-frequency content contained within the image. If there is more change
    in gray values when image is scanned, it means there is high-frequency content
    contained within the image. Fourier transform is described as the transformation
    of a signal into its sinusoids. For digital systems, if Fourier transform is designed
    in a way that discrete input values are entered by specifying sampling rate, this
    is called Discrete Fourier Transform. MATLAB uses a fast algorithm for DFT computations,
    which is called `fft`.

    * **Convolution**: In image processing, a linear filtering method is used named
    as convolution. It is the algebraic process of multiplying two polynomials. An
    image is an array of polynomials whose pixel values represent the coefficients
    of the polynomials. So, two images can be multiplied together to produce a new
    image with the help of convolution. In MATLAB `conv2` is used to perform 2D convolution
    of two matrices.

    * **Filters**: Filtering is used to modify an image, and it is used in image processing.
    There are mainly two filters used a) low-pass filters are those which blur high-frequency
    areas of images. This filter is used when unwanted noise is to be removed from
    an image. b) Median filters are those that can be helpful for noise removal from
    images. It is like an average filter, it examines the pixel and its neighbor’s
    pixel values and return the mean of these pixel values.


    ### [1.8.4 Signal processing in MATLAB](#contents.xhtml_toc3_38)


    The signal processing on MATLAB consists of number of tools for the computation.
    From generation of waveform to design of filters, all the operations are fully
    supported by signal processing toolboxes. The functions of signal processing are
    expressed in M-files to implement the tasks. Two built-in functions that are most
    commonly used in MATLAB are-filter` and `fft`. `filter` function is used on a
    sequence of data for filtering purpose, and `fft` is used to calculate the transform
    of sequence of data.


