    This technology has a number of benefits: Productivity is increased by using mobile
    devices in a number of companies and thereby cost and time of the clients is reduced.
    Another benefit is that it can be used for entertainment purpose (video and audio
    recordings can be streamed on-the-go using mobile computing), portability (a user
    can work without being in a fixed position and work from anywhere as long as there
    is a connection established) and cloud computing (it is the ability to access
    data anytime, anywhere if Internet is connected and then files can be accessed
    on number of mobile devices) as shown in [Figure 1.4](#ch01.xhtml_fig1_4). Cloud
    computing services cover a vast range of options now, from the basics of storage,
    networking and processing power through to natural language processing and artificial
    intelligence as well as standard office applications.


    ![](images/fig1_4.jpg)


    Figure 1.4 Overview of cloud computing.


    ## [1.4 Pervasive Computing](#contents.xhtml_toc2_7)


    Pervasive computing is the area that is growing very rapidly in today’s world.
    In this technology, small devices are allowed to be used in omnipresent way and
    embedded in an invisible manner in order to provide a ubiquitous environment.
    By Weiser, a system called as pervasive computing creates a fully connected medium
    that is integrated with normal environment and that is not distinguishable from
    that. Pervasive computing devices are very small devices in a range of a few millimeters
    to small meters, and these devices are connected to each other via wired or wireless
    links [[5]](#ref-list.xhtml_refchapter_5). The aim of this computing is to make
    life simpler for every individual by using a number of tools, so that, information
    can be managed successfully and easily. Pervasive computing technique is beyond
    the concept of personal computers. It is based on the concept that from clothing
    to any type of devices, they are integrated with chips in a way to connect with
    the network of other devices. These devices consist of a number of characteristics
    like: they have small, inexpensive processors with limited memory, these devices
    are connecting with other devices without any user interaction and they will be
    connected by wired or wireless links. Schematic series of pervasive computing
    is depicted in [Figure 1.5](#ch01.xhtml_fig1_5).


    ![](images/fig1_5.jpg)


    Figure 1.5 Schematic series of pervasive computing.


    ### [1.4.1 Pervasive computing examples](#contents.xhtml_toc3_8)


    Pervasive computing comes with number of names like ‘Ubiquitous Computing’, ‘Augmented
    Reality’, ‘Virtual Reality’, ‘Wearable Computing’, ‘Ambient Computing’, ‘Things
    That Think’ and ‘Smart Space Computing’. In routine life, if a person realizes
    that a box is too heavy to lift, person whistles or calls for a super-heavy helper
    to assist that person. But in pervasive computing, if a person goes to lift the
    block and invisible computer agent detects that person is not strong enough to
    do so, it automatically assists that person without even asking for it.


    In the next scenario, there is a room that automatically manages the heating,
    cooling, and lighting effects based on a user’s profile. The other is ‘smart’
    or ‘intelligent refrigerator’ as shown in [Figure 1.6](#ch01.xhtml_fig1_6), which
    is used to warn the owner when eatables are expired or out of date. This refrigerator
    should be aware of the contents within the refrigerator, and it must have the
    ability to order new food when supplies are low, but this smart refrigerator is
    not available in the market yet.


    ![](images/fig1_6.jpg)


    Figure 1.6 Smart refrigerator.


    The technology that is smart and used by everyone is ‘smart phone’. A smart phone
    is a mobile phone that includes advanced functionality beyond making phone calls
    and sending text messages. Most smart phones have the capability to display photos,
    play videos, check and send e-mail and surf the Web. Today’s mobile devices are
    packed with nearly 14 sensors that produce raw data on motion, location and the
    environment around us as shown in [Figure 1.7](#ch01.xhtml_fig1_7).


    ![](images/fig1_7.jpg)


    Figure 1.7 Sensors used in a smart phone.


    In mobile computing, a person having cell phone with call facility and message
    facility remains connected while he/she remains connected. But in pervasive computing,
    the person remains connected even when moving, as shown in [Figure 1.8](#ch01.xhtml_fig1_8).


    ![](images/fig1_8.jpg)


    Figure 1.8 Pervasive computing applications.


    ### [1.4.2 Pervasive healthcare system](#contents.xhtml_toc3_9)


    In traditional healthcare systems, patients often get stuck in traffic leading
    to delayed treatment and high death rates. In pervasive computing, the patient
    is connected to the doctor in real-time, allowing for immediate attention and
    safety. The complete scenario of real-world pervasive healthcare system is shown
    in [Figure 1.9](#ch01.xhtml_fig1_9).


    ![](images/fig1_9.jpg)


    Figure 1.9 Pervasive computing healthcare system-example.


    ### [1.4.3 Challenges of pervasive computing](#contents.xhtml_toc3_10)

