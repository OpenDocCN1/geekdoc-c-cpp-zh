  trans: '


    Bark 滤波器组将三个因素整合进一个滤波器组中：频率翘曲、平滑和平采样。等响度预强调对滤波器组输出进行加权，以模拟听觉灵敏度。等化后的值根据斯蒂文斯幂律通过将每个值提升
    `0.33\.` 次方进行转换。生成的听觉扭曲线谱进一步通过线性预测进行处理。对听觉扭曲线谱应用线性预测意味着计算信号的预测系数。最后，通过等于模型频谱对数的递归以及逆傅里叶变换，从预测系数中获得倒谱系数。


    ### 优点


    * 它减少了清浊音和送浊音之间的差异。

    * 它产生的特征向量是低维的。

    * 它基于语音信号的短时频谱 [[63]](#ref-list.xhtml_refchapter_63)。

    * `PLP` 的系数主要被使用，因为它们提供了语音频谱高能量区域的正确值。

    * `LPC` 以相同的方式近似所有频率的语音频谱，而这种表示需要了解人类听觉的原理。


    ### 缺点


    * 它产生的特征向量依赖于共振峰幅的整个频谱平衡。

    * 它的频谱很容易被通信信道、噪声和所用设备改变。


    ### 3.3.3 线性预测代码 (LPC) [[63]](#ref-list.xhtml_refchapter_63)


    `LPC` 是语音信号处理最重要的特征，它提取提取音高、共振峰和频谱等语音参数。该技术用于设计用户的语音产生。它根据之前的特征预测未来的特征。为了高效传输和存储，最好对信号进行压缩。数字信号在传输前被压缩，以有效利用无线媒体中的信道。它在中低比特率编码中被广泛使用。当我们通过语音分析滤波器通过信号以消除信号中的冗余时，会产生残差误差。与原始信号相比，可以使用较少的比特进行量化。因此，现在不再传输整个信号，而是传输此残差误差和语音参数来生成原始信号。基于最小
    MSE 理论计算参数模型，这种技术被称为线性预测。图 3.8 和 3.9 表示了 `LPC` 技术包含的框图和步骤。


    1. **预强调**：第一步是语音分析，通过滤波帮助进行，其目标是在频谱形式上平滑信号并减少精度效应的影响。滤波器系数的值必须在 `0.9` 和 `1\.`
    之间 [[64]](#ref-list.xhtml_refchapter_64)。

    2. **分帧创建**：第一步之后，开发的语音被分为若干个包含 `N` 个样本的帧，每个样本的范围为 20 到 40 秒。一个必要要求是两个相邻帧之间有 10
    ms 的标准重叠，以确保帧之间的平稳期。

    3. **应用窗函数**：这一步获取生成的帧并将其与 `hamming window` 相乘。主要目的是最小化边缘效应。

    4. **LPC 计算**：这是最后一步，在经过加窗处理的语音样本帧上应用自相关技术。


    ![](img/fig3_8.jpg)


    图 3.8 LPC 技术框图。


    ![](img/fig3_9.jpg)


    图 3.9 LPC 技术框图。


    它通过估计共振峰来分析语音信号，从语音信号中消除它们的影响，并估计剩余 buzz 的强度和频率。消除共振峰的过程称为逆滤波，剩余的原始称为残差。


    ### `LPC` 的类型 [[64]](#ref-list.xhtml_refchapter_64):


    有多种 `LPC` 技术命名如下：


    * 码激励 LPC (CELP)

    * 基音激励 LPC

    * 残差激励 LPC

    * 语音激励 LPC

    * 多重激励 LPC (MPLPC)


    ### 优点


    * 它是一种静态技术。

    * 它是提供语音参数的可靠、准确且稳健的技术。

    * 计算速度快，并能提供准确的语音参数。

    * 它用于低比特率语音编码。

    * 它是信号分析的强大方法之一。

    * 它最小化了给定时间内真实语音信号与计算信号之间的平方差和。


    ### 缺点


    * 它无法区分具有相似元音声音的单词。

    * 它产生残差误差作为输出，导致语音质量较差。


    ### 3.3.4 相对频谱感知线性预测 (RASTA-PLP)


    该方法用于在噪声环境中录制语音时增强语音。在这里，RASTA 技术与 `PLP` 技术合并，形成名为 `RASTA-PLP` 的组合，这种组合增加了单个 `PLP`
    方法包含的鲁棒性。该方法利用的事实是周围环境的临时属性与语音信号的属性不同 [[65]](#ref-list.xhtml_refchapter_65)。与
    `PLP` 结合时，它提供了更好的性能。`RASTA-PLP` 由 Hynek Hermansky 提出，是一种封装频谱以最小化说话者之间差异的方法，从而保留有用信息。`RASTA`
    是一种应用于频率每个子带的带带滤波器技术。图 3.10 显示了该技术中的有用过程。


    ```

    H(z))=(0.1)(2+z^(-1)-z^(-3)-z^(-4))/(1-.98z^(-1)))

    ```


    ### 优点


    * 它具有鲁棒性。


    ### 缺点


    * 在清洁环境下性能差。


    ![](img/fig3_10.jpg)


    图 3.10 RASTA-PLP 技术框图。


    ### 3.3.5 零交叉峰值 (ZCPA)


    该技术由 Chok-ki Chan 开发。它基于说话者依赖系统人类声音系统 [[65]](#ref-list.xhtml_refchapter_65)。ZCPA
    使用过零区间来表示信号信息，并提供幅值来表示强度信息。通过这种技术，频率和幅值结合形成特征向量的完整输出。该技术将一组单词分为两类，使识别过程变得更容易，如图
    3.11 所示。


    ![](img/fig3_11.jpg)


    图 3.11 ZCPA 技术详细图。


    ### 3.3.6 动态时间规整 (DTW) [[66]](#ref-list.xhtml_refchapter_66)


    这是时间排列分析中估计随时间变化的序列之间相似性的计算。例如，通过使用该算法，可以轻松检测步行模式的相似性，无论一个人是否比另一个走得快，或者在第二种情况下整个观察过程中速度增加或减少。该技术已应用于视频、声音和图形数据的瞬态序列——事实上，任何可以转换为线性序列的信息都可以使用动态时间规整进行分析，如图
    3.12 所示。


    ### 优点


    * 识别速度快。


