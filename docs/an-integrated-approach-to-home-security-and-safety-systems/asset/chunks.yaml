    ## 1. Face Recognition and Voice Recognition


    2. Face recognition test passes but voice recognition test fail.

    3. The face recognition test fails but voice recognition test passes.

    4. When face recognition and voice recognition both are unsuccessful.


    In the first scenario, category of the person at the door is displayed as output
    on the screen out of any proposed categories: family, friend, neighbor or unknown.
    In the second and third scenario, similarity index technique comes into existence.
    This technique is taken into consideration when any one of two above mentioned
    and used techniques that is face recognition or voice recognition technique fails
    to recognize the person correctly or accurately. It is a text-independent voice
    recognition technique used to recognize voice based upon voice features such as
    pitch, speaking rate, voice modulation and frequency, irrespective of the text
    or content spoken by the person at the door. The voice features of the person
    at the door are compared with voice features of persons belonging to all four
    categories. If the difference between the features of voice signals of the person
    at the door with the voice features of any of the stored voices is less than or
    equal to `0.014`, voice is matched else that person is identified as belonging
    to unknown category. This value considered for Similarity index, i.e., `0.014`
    is considered as the threshold value for voice recognition. If Similarity index
    is greater than or equal to `75%`, then only the person at door will be declared
    as known person and the category to which he/she belongs will be displayed on
    the screen and depending upon the category he/she belongs, a text message will
    be sent to the concerned persons belonging to family, friend and neighbor categories
    and if the value of similarity index is less than `75%`, no message would appear
    at the bottom of the window in `MATLAB` since the person at door belongs to unknown
    category. In fourth scenario, output displayed on the screen shows the person
    at door belonging to “unknown” category.


    [Figure 5.2](#ch05.xhtml_fig5_2) shows the GUI of overall proposed architecture
    that includes Face Recognition, Voice Recognition, Similarity Index and Vital
    Sign Monitoring. These are the same steps as explained earlier as there are total
    four cases in this technique as shown in [Table 5.1](#ch05.xhtml_table5_1). If
    face and voice recognition is done properly, then the message will be sent to
    all category members.


    ![](images/fig5_2.jpg)


    Figure 5.2 GUI of overall proposed model.


    Table 5.1 Cases of overall proposed work


    | S. No | Face recognition | Voice recognition | Similarity index | Message |

    | --- | --- | --- | --- | --- |

    | 1 | Yes | Yes | – | Category members |

    | 2 | Yes | No | `SI>=75%` | Category members |

    | 3 | No | Yes | `SI>=75%` | Category members |

    | 4 | No | No | `SI>=75%` | Unknown |


    The face recognition process starts by selecting any image from the database as
    a number of images are stored there which belong to different categories (friend,
    family and neighbor). This process is implemented using `MATLAB` tool as shown
    in [Figure 5.3](#ch05.xhtml_fig5_3). An image to be identified is matched with
    all the images that are stored in the database and when this identified image
    matches any of the stored images, the screen will stop for a few seconds and then
    it will display the category to which the image belongs as shown in [Figure 5.4](#ch05.xhtml_fig5_4).


    ![](images/fig5_3.jpg)


    Figure 5.3 Face recognition process.


    ![](images/fig5_4.jpg)


    Figure 5.4 Comparison of an image with stored images in case of face recognition.


    When face recognition process is done, the percentage will be displayed on the
    screen along with the category to which the person at door belongs as shown in
    [Figure 5.5](#ch05.xhtml_fig5_5).


    ![](images/fig5_5.jpg)


    Figure 5.5 Output of face recognition with category display (family, friend, neighbor
    and unknown).


    After face recognition, the voice recognition process will take place as shown
    in [Figure 5.6](#ch05.xhtml_fig5_6).


    ![](images/fig5_6.jpg)


    Figure 5.6 Voice recognition process.


    As shown by [Figure 5.7](#ch05.xhtml_fig5_7), output given by both face recognition
    technique and voice recognition technique is family category. So, that means image
    to be identified belongs to family category. Hence, a message will be sent to
    all family members and neighbors already registered in the database by using a
    `MATLAB` tool and 3G dongle.


    ![](images/fig5_7.jpg)


    Figure 5.7 Output of voice recognition with category display (family, friend,
    neighbor and unknown).


    The snapshots for similarity index are shown in [Figures 5.8](#ch05.xhtml_fig5_8)
    and [5.9](#ch05.xhtml_fig5_9).


    ![](images/fig5_8.jpg)


    Figure 5.8 Similarity index calculation.


    ![](images/fig5_9.jpg)


    Figure 5.9 Output of similarity index in the form of percentage.


    ## 5.2 Vital Sign Monitoring](#contents.xhtml_toc2_81)


    Next step is to monitor the health parameters of the individual living alone at
    home. In this step, the video in `in.mov` format containing finger tip impression
    is browsed as shown in [Figure 5.10](#ch05.xhtml_fig5_10). This video is recorded
    by iPhone 6s and then copied to laptop for further processing using `MATLAB` tool.


