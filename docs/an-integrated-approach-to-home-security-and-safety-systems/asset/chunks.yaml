    ## 5.3 结论与未来工作


    由于人脸识别技术是免手的，它为用户提供了持续认证。该技术通过摄像头捕捉图像并提取不随时间变化的面部特征。类似的，语音识别在认证中起着至关重要的作用，通过麦克风捕捉音频文件。所提模型使用人脸和语音识别技术为独居者提供家庭安全。在该实施模型之外，还考虑了房屋主的健康监测方面。开发了一种成本效益且易于使用的模型，帮助用户继续在舒适的家中生活。该模型将允许医疗人员实时检查患者的重要体征，并从远程设施提供反馈。未来，可以使用软计算概念用于自动人脸识别系统。将模糊逻辑与神经网络相结合，可以提高人脸识别的性能。可以结合多个分类器以获得更好的结果。


