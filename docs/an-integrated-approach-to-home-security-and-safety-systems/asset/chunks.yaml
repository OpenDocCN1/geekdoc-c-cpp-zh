    # 第 1 章介绍了泛在计算的基本概念及其面临的挑战和问题。详细定义了基于人脸识别和语音识别技术的多种生物识别技术，本章描述了不同类型的传感器以及本研究工作的目标。第
    2 章提出了一种用于为个人提供家庭保障的混合 PICA 算法。第 3 章描述了一种用于为独立生活的人员提供灵活基于信任的安全性的混合 MFRASTA 算法。第
    4 章提出了一种可以在 iPhone 摄像头镜头上运行的、用于用户健康监测的指尖应用。第 5 章展示了完整实现系统的图形用户界面（GUI），并展示了所提技术与之前使用的技术在识别率方面的对比。第
    6 章给出了所提工作的结论。文中还为未来的研究提到了一些点，以使该系统更加实用。


    # 第 2 章


    ## 用于个人家庭安全的混合人脸识别 PICA 算法


    DOI: [10.1201/9781003120933-2](https://doi.org/10.1201/9781003120933-2)


    ## 2.1 人脸识别简介](#contents.xhtml_toc2_41)


    安全框架在当今世界处于至关重要的部分。因此，设立了安全岗位，并招聘了人员使该框架在一段时间内有效运行。在任何情况下，随着对新进展的调查，世界都在不断改进。各种机器人安全框架开始执行，以减少劳动和成本
    [[38]](#ref-list.xhtml_refchapter_38)。人脸是生物识别技术中最具前景的技术之一，也是最识别方法。人脸传达了关于年龄、身份、性别、种族和面部表情的信息，反映了情感和心理状态。与其它一些生物特征不同，人脸识别并不真的需要个人的配合，可以以微妙的方式进行，这使其特别适用于观察类应用
    [[39]](#ref-list.xhtml_refchapter_39)。其他基于指纹、虹膜、签名识别等的生物识别技术的问题在于数据采集，例如在指纹识别中
    [[44]](#ref-list.xhtml_refchapter_44)，用户必须以正确的方式和方向放置手指。但在人脸识别中，采集脸部图像并不困难，因此可以作为一种生物识别技术。每张脸都有定义特定用户的特殊特征。还可以通过使用像素强度来识别情绪，这对应于用于检测情绪的特征
    [[45]](#ref-list.xhtml_refchapter_45)。人脸识别是一种经常应用于银行、安全信息和虚拟现实等领域的生物识别技术 [[45]](#ref-list.xhtml_refchapter_45)。图像处理是人脸识别中的一种方法，用于将图像转换为数字形式并对图像进行某些操作，以便我们从中提取有用信息。它包含三个步骤：使用扫描仪或摄像头拍摄图像，应用数据压缩或增强以分析数据，并以修改后的图像形式输出。人脸识别系统涉及三个主要步骤：数据采集、特征提取和识别
    [[46]](#ref-list.xhtml_refchapter_46)，如图 2.1 所示。


    ```

    !images/fig2_1.jpg

    ```


    图 2.1 人脸识别系统的步骤。


    数据采集是人脸识别系统的主要步骤，包括通过多种来源采集脸部图像。采集的图像数量可能具有不同的姿势变化、光照变化等。因此，我们可以在多种条件下轻松验证我们识别系统的性能。有时，门处的输入图像会被分类，并对输入图像应用不同的修改方法。通过这种方式，除了噪声、光照、模糊效果等不理想参数，然后将其用于后续处理
    [[46]](#ref-list.xhtml_refchapter_46)。特征提取是人脸识别系统的下一步，用于从给定的图像中提取信息，提取后，特征将用于识别步骤。在这一步中，使用了降维和噪声清洗技术
    [[47]](#ref-list.xhtml_refchapter_47)。


    识别是特征选择和提取后用于人脸识别系统的最后一步，现在使用多个分类器对图像进行分类。在这一步中，获取若干张图像并对其进行特征提取，存储在数据库中。当一张新图像用于人脸识别时，它首先执行人脸采集、特征提取，然后将数据库中的所有图像与此新图像进行比较。图像与数据库中存储的所有图像相关联，以识别个人，如图
    2.2 所示 [[47]](#ref-list.xhtml_refchapter_47)。


    ```

    !images/fig2_2.jpg

    ```


    图 2.2 人脸识别模型。


    每个人脸识别系统主要包含两个任务：


    -   验证 (Verification)

    -   识别 (Identification)


    在验证中，适用一对一匹配；因为系统帮助将特定个人与文件中存在的特定生物特征进行匹配。由于该系统只比较生物特征文件，因此它是一种比识别更快更高效的技术，例如，它试图提供特定问题的答案，如“这个人真的是他所称的自己吗？”。在识别中，适用一对多匹配，这意味着在图库数据库中识别该图像。它试图识别一个未知用户，例如，它尝试回答“这个人是谁？”。人脸识别的基本框如图图
    2.3 所示。


    ```

    !images/fig2_3.jpg

    ```


    图 2.3 人脸识别的基本步骤。


    存在两类人脸识别方法：基于特征的和基于整体的 [[48]](#ref-list.xhtml_refchapter_48)。在基于特征的方法中，从脸部提取特征如眼睛、嘴唇和鼻子，并计算这些特征之间的几何关系，最后还原为向量形式。用于计算不同面部特征之间距离的方法是欧几里距离法。弹性束图法（Elastic
    bunch graph method）是这种基于动态链接技术的示例。通过这种方法，对于每个人都会生成一个图，通过在束图方法中为每张新图像生成图，用于识别目的。之后，通过分析新脸部图像图与数据库中存储的所有脸部图像图进行比较，最后计算相似性指数。


