- fmt: '

    - **Healthcare:** Biometrics technologies, such as fingerprint scanners, palm
    vein readers, facial recognition tech, iris scanners and others, have long held
    promise to tighten up identification of patients and employees. This would help
    dependably confirm that patients are who they state they are, ensure guardians
    are working with the correct clinical and segment data and guarantee just the
    best possible representatives approach the correct data. Be that as it may, biometrics
    innovations have been delayed to get on in medical services. Without a doubt,
    numerous emergency clinics and centers have executed some fundamental tech; however,
    biometrics is not yet completely in the standard of medical care rehearses. What’s
    more, it will even now require some investment and exertion with respect to medical
    care CISOs and biometrics innovation merchants to get the tech swimming in the
    standard.


    ## 1.6 Sensor-Based Technology


    This technology consists of a sensing chip used to sense vital parameters from
    a person’s body. It converts one form of energy into another form and converts
    physical parameter into electrically measureable signal [[26](#ref-list.xhtml_refchapter_26).
    A sensor is used to convert the physical parameters such as temperature, heartbeat,
    sweat rate and blood pressure into another form of signals that are measured electrically.
    Example of temperature is taken to explain this technology. When liquid is expanded
    and contracted by the use of mercury in glass thermometer, at that time reading
    is measured by the person. There are a number of sensors used electromagnetic,
    thermal, optical, etc. In previous time, the size of sensors was very large so
    it can’t be used in the form of wearable technology. But nowadays, microcontroller
    circuits, amplifiers and functions make wearable sensors to be used for health
    monitoring. Sensors and wearables are attached into number of accessories such
    as cups, garments, belt, wrist band, eyeglasses and shoes. Wearable sensors are
    found to be useful because of advantage such as use of sensors for data collection
    which when attached to human body continuously monitor patient’s health thereby
    reducing interference of humans which makes it low cost.


    Wearable sensors are smart devices that can be worn on body as a part of accessories
    [[27](#ref-list.xhtml_refchapter_27). They can be used in number of areas like
    security, entertainment, business, etc. It is helpful in providing security at
    home by providing reliable and accurate information. These devices are very tiny
    and lightweight so that it will be comfortable to wear 24/7. They are used for
    health monitoring such as blood pressure, temperature and heartbeat. BP can be
    easily measured by using these sensors rather than previous pressure cuff technique.
    For simple wearable wireless sensing device, representation is shown in [Figure
    1.29](#ch01.xhtml_fig1_29). Researchers have recently developed an artificial
    intelligence (AI) classifier that can detect a specific cardiovascular disease
    using a wearable wrist biosensor.


    ```

    images/fig1_29.jpg

    ```


    Figure 1.29 Wearable wrist biosensor to detect heart disease.


    There are a number of sensors that can be used for health monitoring. Active sensor
    is the one that requires the external supply of power, e.g., photoconductive cell,
    while the passive sensor is that which does not require any external supply of
    power, e.g., electromechanical sensor.


    ### Accelerometer

    It is a device used to measure the acceleration along both axis as shown in [Figure
    1.30](#ch01.xhtml_fig1_30). Accelerometers are small in size and inexpensive devices
    that make it better to implement in real-life applications [[28](#ref-list.xhtml_refchapter_28).
    There exist a number of different types of accelerometers: a) piezo-resistive,
    b) piezoelectric and c) magneto-resistive, which measures the acceleration by
    using key concepts of technologies.


    ```

    images/fig1_30.jpg

    ```


    Figure 1.30 a) SE120 piezo-resistive accelerometer, b) CA134 piezoelectric accelerometer,
    c) MAG3110 three-axis magneto-resistive.


    Fall detection, activity monitoring and immobility detection are the some examples
    of this sensor, which can be easily implemented in smart home devices. Bio-sensors
    are those that are based on electrochemical technology. Image sensor is based
    on CMOS technology. This sensor is used in biometrics.


    ### Motion detector

    It is based on infrared, ultrasonic and microwave technology. When a person comes
    into the house and if he/she is not an authorized person, at that time this sensor
    detects the unusual activity. For smart home, the aim of this detector is to sense
    an unauthorized person and immediately send a text message to family members [[29](#ref-list.xhtml_refchapter_29).
    The aim of motion sensor is to detect the movement of a person and for this purpose,
    three techniques are used: a) passive infrared, b) ultrasonic and c) microwave.
    In this, passive infrared is used that detects body heat and used in smart homes
    for security purpose. Infrared radiation is generated if heat is generated by
    any type of object. This is the most common form used in homes, e.g., if a person
    enters into a room, this sensor automatically switch on the lights of the room.
    The other two technologies named as ultrasonic and microwave is a part of active
    motion sensors. They both emit sound signals and then reflection is measured for
    movement detection.


    ### Telemedicine

    It is a technology used for the transfer of important information, collected data
    for the treatment of medical situations or to provide health care facility at
    long sites by using audio and video techniques. Previously, the use of video channels
    was there for the proper interaction based on consultation services [[30](#ref-list.xhtml_refchapter_30).
    But now this technology has been expanded in a broader way. Now it can be used
    in number of areas such as artificial intelligence and patient education.


    ### Radio frequency identification

    It is a way of enhancing the process of handling the data as well as it is used
    for the storage and accessing the data by using radio frequency signals [[31](#ref-list.xhtml_refchapter_31).
    This technology can be used in various areas such as industries, security systems,
    manufacturing and retail.


    There are three types of RFID tags: a) passive tags, b) semi-passive tags and
    c) active tags as shown in [Figure 1.31](#ch01.xhtml_fig1_31). In this, tag means
    storage of that data that can be easily modified or accessed using radio frequency
    signals. The passive RFID tag does not require any power, and it uses external
    source for transmission of signals. Semi-passive tags also require an external
    source of power, but an active RFID tag requires an external battery.


    ```

    images/fig1_31.jpg

    ```


    Figure 1.31 Types of RFID tags.


