    \ necessary to eliminate redundant information from voice, left with only relevant\
    \ features. In the proposed work, audio files of known and unknown persons are\
    \ recorded in `.wav` format. Two functions named as: `voicecompare` and `voicecompareH`\
    \ are used. The main function used for this work is `voicecompareH`. In all the\
    \ previous works, function named as `voicecompare` is used in which two audio\
    \ files are compared by using single feature extraction technique, i.e., `MFCC`\
    \ but in the proposed work, `voicecompareH` module is used which is a hybrid combination\
    \ of `MFCC+RASTA-PLP` technique. The technique used for comparison of audio files\
    \ is shown in [Figure 3.13](#ch03.xhtml_fig3_13) based upon which a decision is\
    \ taken. This process starts with a person; person will speak a specific password\
    \ question with its answer. If that question and answer are similar to the stored\
    \ value of the database, then only a person is recognized. Finally, the category\
    \ to which he/she belongs from four categories proposed in a database known as\
    \ family, friend, neighbor and unknown is identified.\n\nTraditionally, voice\
    \ recognition system consists of a single technique of feature extraction with\
    \ classifier, but in this proposed work, there are four steps to be followed:\n\
    \n* Take training set and perform preprocessing by which audio files are recorded\
    \ using different methods in `.wav` format.\n* Feature extraction step extracts\
    \ the features that provide specific information from the voice signals. Features\
    \ have been extracted by using two voice recognition algorithms `MFCC` and `RASTA-PLP`.\n\
    * Combine all the outputs and classifies input voice that it is known or unknown.\n\
    * Send the message to define the category of each input voice. The steps of this\
    \ hybrid algorithm are represented in the form of a flowchart that is shown in\
    \ [Figure 3.14](#ch03.xhtml_fig3_14).\n\n#### Integration of Mel Cepstral Coefficient\
    \ and Perceptual Linear Prediction:\n`Fourier transform` is used for frequency\
    \ analysis. For nonstationary signal, `Fourier transform` isn’t suitable for analysis\
    \ purpose, and the result is it only provides the frequency data for a signal,\
    \ but it doesn’t give the data about time that at what time which frequency is\
    \ present. So, the windowed short-time fourier transform is used that provides\
    \ the temporal data related to the frequency content of the signal.\n\n#### Processing\
    \ steps:\n* `Voice_Rec`: In this step, audio files are recorded.\n* `voicecompare`:\
    \ Used to compare audio files.\n* `voicecompareH`: Main function for hybrid comparison.\n\
    \n#### Text or content-based recognition:\nThe voice of the person at the door\
    \ is captured and compared with all the stored voices to find out the category\
    \ to which the person belongs as shown in [Figure 3.16](#ch03.xhtml_fig3_16).\n\
    \n#### Table 3.1 Categories with their corresponding receiving parties\n| S.No.\
    \ | Category | Message parties |\n| --- | --- | --- |\n| 1 | Family | Family +\
    \ neighbors |\n| 2 | Friend | Family + friend |\n| 3 | Neighbor | Family + neighbors\
    \ |\n| 4 | Unknown | Family + neighbors |\n\n![](images/fig3_13.jpg)\n\nFigure\
    \ 3.13 Hybrid MFRASTA method for voice recognition.\n\n![](images/fig3_14.jpg)\n\
    \nFigure 3.14 Flowchart of hybrid algorithm.\n\n![](images/fig3_15.jpg)\n\nFigure\
    \ 3.15 Sample of audio files stored in database.\n\n![](images/fig3_16.jpg)\n\n\
    Figure 3.16 Testing of voice being done on the basis of samples stored in the\
    \ database.\n\n![](images/fig3_17.jpg)\n\nFigure 3.17 Result in voice testing\
    \ based upon content matching.\n"
  raw: "*   Less space is required for the reference template.\n\n*   Optimal path\
    \ finder with constraints\n\n*   High recognition rate.\n\n*   In the case of\
    \ error, threshold is used.\n\nDisadvantages:\n\n*   Difficult task for choosing\
    \ a appropriate reference.\n\n![](images/fig3_12.jpg)\n\nFigure 3.12 Basic diagram\
    \ of DWT technique.\n\n### [3.3.7 Wavelet](#contents.xhtml_toc3_62)\n\nIt is already\
    \ known that the signal in a speech is nonstationary [[66]](#ref-list.xhtml_refchapter_66).\
    \ For nonstationary signal, Fourier transform isn’t suitable for analysis purpose,\
    \ and the result is it only provides the frequency data for a signal, but it doesn’t\
    \ give the data about time that at what time which frequency is present. So, the\
    \ windowed short-time fourier transform is used that provides the temporal data\
    \ related to the frequency content of the signal.\n\nApplications:\n\n*   Signal\
    \ processing.\n\n*   Data compression.\n\n*   Speech recognition.\n\n*   Computer\
    \ graphics and multifractal analysis.\n\n## [3.4 Proposed Hybrid MFRASTA Technique](#contents.xhtml_toc2_63)\n\
    \nVoice signal does not only give information about words or sentences being uttered\
    \ but also gives the status of the speaker. Voice recognition is an effective\
    \ way to provide useful information. Feature extraction implements an important\
    \ role in calculating the effectiveness of the voice recognition system. It is\
    \ necessary to eliminate redundant information from voice, left with only relevant\
    \ features. In the proposed work, audio files of known and unknown persons are\
    \ recorded in.wav format. Two functions named as: voicecompare and voicecompareH\
    \ are used. The main function used for this work is voicecompareH. In all the\
    \ previous works, function named as voicecompare is used in which two audio files\
    \ are compared by using single feature extraction technique, i.e., MFCC but in\
    \ the proposed work, voicecompareH module is used which is a hybrid combination\
    \ of MFCC+RASTA-PLP technique. The technique used for comparison of audio files\
    \ is shown in [Figure 3.13](#ch03.xhtml_fig3_13) based upon which a decision is\
    \ taken. This process starts with a person; person will speak a specific password\
    \ question with its answer. If that question and answer are similar to the stored\
    \ value of the database, then only a person is recognized. Finally, the category\
    \ to which he/she belongs from four categories proposed in a database known as\
    \ family, friend, neighbor and unknown is identified.\n\n![](images/fig3_13.jpg)\n\
    \nFigure 3.13 Hybrid MFRASTA method for voice recognition.\n\nTraditionally, voice\
    \ recognition system consists of a single technique of feature extraction with\
    \ classifier, but in this proposed work, there are four steps to be followed:\n\
    \n*   Take training set and perform preprocessing by which audio files are recorded\
    \ using different methods in.wav format.\n\n*   Feature extraction step extracts\
    \ the features that provide specific information from the voice signals. Features\
    \ have been extracted by using two voice recognition algorithms MFCC and RASTA-PLP.\n\
    \n*   Combine all the outputs and classifies input voice that it is known or unknown.\n\
    \n*   Send the message to define the category of each input voice. The steps of\
    \ this hybrid algorithm are represented in the form of a flowchart that is shown\
    \ in [Figure 3.14](#ch03.xhtml_fig3_14).\n\n![](images/fig3_14.jpg)\n\nFigure\
    \ 3.14 Flowchart of Hybrid MFRASTA technique.\n\n## [3.5 Similarity Index](#contents.xhtml_toc2_64)\n\
    \nThis step will run only in that condition if one of the two biometric technologies\
    \ (face or voice) fails in recognizing a user who is at the door. In this step,\
    \ the person’s audio file is matched with all the audio files of persons, which\
    \ are stored in a database on the basis of text-independent voice recognition\
    \ technique. Text independent means to recognize the voice of a person based on\
    \ the number of voice functions such as frequency, pitch, speaking rate, etc.\
    \ irrespective of the content spoken by the person. It means from three modules:\
    \ face, voice and similarity index, two modules must be satisfied and then only\
    \ access will be granted to the person. For calculating the similarity index,\
    \ the value of the threshold is taken and when this step is run, it calculates\
    \ the value of similarity index. If the value is larger or equal to 75%, it is\
    \ declared that the person belongs to a known category. But in another case, if\
    \ the value of similarity index is less than 75%, then a person is supposed to\
    \ belong to unknown category and in every case, message will be shown on the cell\
    \ phone of the person who is living alone at home. Decision of opening the door\
    \ depends upon the individual now.\n\n## [3.6 Implementation](#contents.xhtml_toc2_65)\n\
    \nIntegration of Mel Frequency Cepstral Coefficient and Relative Spectra: Perceptual\
    \ Linear Prediction technique [[67]](#ref-list.xhtml_refchapter_67) is used for\
    \ extraction of features and recognition purpose. The steps required to recognize\
    \ voice and to send messages on the cell phone using a MATLAB tool and a 3G Dongle\
    \ are as follows:-\n\n1.  Voice Recognition: In MATLAB, two processes are used\
    \ for voice recognition.\n\n    *   Voice_Rec_Pre: Its purpose is to record audio\
    \ files at a frequency of 5000 in.wav format. In this step, preprocessing is performed\
    \ using two functions: silence detection and amplification from which final file\
    \ is obtained.\n\n    *   VoiceCompare: It is used to compare two wav files. The.wav\
    \ file to be checked for recognition is correlated with all the audio files saved\
    \ in the database on the basis of parameters such as frequency range, cepstral\
    \ coefficients value, etc. If the parameter values are matched with values of\
    \ any stored wav file, category to which the person belongs out of four considered\
    \ categories will be displayed as shown in [Table 3.1](#ch03.xhtml_table3_1):\
    \ friend, family, neighbors and unknown. Finally, a message is sent to one or\
    \ more concerned categories by using MATLAB tools and the Dongle.\n\n2.  In this\
    \ step, a database consisting of any number of audio files containing voice details\
    \ of all the persons from all defined categories can be maintained. In the present\
    \ scenario, 41 audio files belonging to 41 persons considered under three categories,\
    \ i.e., family, friend and neighbor, and 15 audio files containing voice details\
    \ of persons belonging to unknown category have been taken into consideration.\
    \ A sample of audio files is shown in [Figure 3.15](#ch03.xhtml_fig3_15).\n\n\
    3.  **Text or content-based recognition:** The voice of the person at the door\
    \ is captured and compared with all the stored voices to find out the category\
    \ to which the person belongs as the database consists of a number of audio files\
    \ belonging to different categories named as friend, family, neighbors and unknown,\
    \ as shown in [Figure 3.16](#ch03.xhtml_fig3_16).\n\nTable 3.1 Categories with\
    \ their corresponding receiving parties\n\n| S.No. | Category | Message parties\
    \ |\n\n| --- | --- | --- |\n\n| 1 | Family | Family + neighbors |\n\n| 2 | Friend\
    \ | Family + friend |\n\n| 3 | Neighbor | Family + neighbors |\n\n| 4 | Unknown\
    \ | Family + neighbors |\n\n![](images/fig3_15.jpg)\n\nFigure 3.15 Sample of audio\
    \ files stored in database.\n\n![](images/fig3_16.jpg)\n\nFigure 3.16 Testing\
    \ of voice being done on the basis of samples stored in the database.\n\nIn [Figure\
    \ 3.17](#ch03.xhtml_fig3_17), a person at the door belonging to family category\
    \ shown as f = 1 is obtained as the output. When both techniques face recognition\
    \ as well as voice recognition will identify a person correctly, a message will\
    \ be sent to all the family members along with all neighbours who are already\
    \ registered in the database. In this step, voice is tested on the basis of content\
    \ which is spoken by the person that means this step is based on text-dependant\
    \ voice recognition technology.\n\n![](images/fig3_17.jpg)\n\nFigure 3.17 Result\
    \ in voice testing based upon content matching."
