    语音识别技术的研发过程始于 20 世纪 70 年代初，在 IBM 公司和卡内基·梅隆大学研究人员的帮助下，首次自动语音识别应用于 1952 年。人类也可以通过语音与机器通信，但这是一个非常缓慢的过程。因此，自动语音识别应运而生，可以通过人类命令或指令进行操作。通过使用这项技术，可以验证人的声音以确定其身份，并将其用于访问数据库服务、语音邮箱、电信（意味着在手机中，人们只需说出拨打对象的姓名即可拨号）等应用程序。语音识别问题通过理解其复杂性得到了解决。自动语音识别的应用领域很多：医疗保健、个人计算、工业等。这一概念被用于自动电话系统，该系统帮助将呼叫者引导至正确的部门。例如，如果有一个命令是“按键
    3 获取支持”，某人说出 3，就意味着在这里使用了语音识别概念。另一个例子是 Google 语音，它允许人们从笔记本电脑、iPad 或平板电脑提问并搜索问题，数字助手也是语音识别的一部分，帮助用户与
    Siri、Amazon Echo 等数字助手交互，并帮助回答问题。


    为了语音识别的正常工作，需要一台带有声卡、耳机或麦克风的计算机。语音识别系统的运行考虑四个参数：它必须具有编码形式和它将要识别的话语数量；在识别时，必须有一种模式匹配算法，将输入话语的表示与词汇表中的所有话语进行比较；使用任何算法比较输入话语与词汇表；最后是操作识别系统的接口。存在许多其他生物识别认证技术，如人脸、签名、虹膜识别等。但语音识别技术是根据某些标准选择的：可访问性、区分性、稳健性等。区分性用于衡量个体间模式的差异，稳健性是指模式不可重复且不能发生巨大变化，可访问性定义了向传感器设备呈现数据的简易程度
    [[ [60]](#ref-list.xhtml_refchapter_60)。通过声音进行识别非常经济，因为采集语音样本的设备廉价且容易获得。图 3.1
    显示了语音识别系统的示意图，输入语音进入声模型模块，在其中发生了从语音到向量统计表示的转换。然后，通过数据库中存储的许多单词进行单词搜索，并提供识别话语的输出。


    ![](img/fig3_1.jpg)


    图 3.1 语音识别系统示意图。


    该语音识别系统主要由两个步骤组成：


    * 特征提取

    * 特征匹配


    特征提取是作为前端的主要步骤。它像系统的核心。它从单词中提取少量数据，然后随后用于表示每个人。与原始数据表示相比，特征是高级表示。它压缩了单词的幅度，而不对语音信号功率造成任何损害。下面是
    图 3.2 中的特征提取图，显示了提取特征所需的 Basic 步骤：


    ![](img/fig3_2.jpg)


    图 3.2 特征提取步骤。


    特征匹配用于通过将提取的特征与完整的输入样本集比较来确定未知身份。这意味着该系统分两个阶段：训练阶段和测试阶段。


    在训练阶段，它对应于从标记数据中学习的过程，每个人都将以某种方式提供自己的声音样本，以训练系统进行后续处理，如 图 3.3 所示。


    ![](img/fig3_3.jpg)


    图 3.3 提取语音特征的训练阶段。


    在测试阶段，当某人的声音被测试时，输入语音与所有存储的样本进行匹配，并在此基础上决策。这一过程在 图 3.4 中所示。


    ![](img/fig3_4.jpg)


    图 3.4 特征匹配的测试阶段。


    该系统中使用的基本术语是：


    * **话语 (Utterance)：** 定义为计算机系统具有某些意义信息的所说单词。它可以是一个单独的单词一组单词，也可以是一个句子。它们随后被发送到语音引擎进行进一步处理。

    * **词汇表 (Vocabulary)：** 语音识别系统识别的一组单词。显而易见，小词汇容易识别，而大词汇难以识别。

    * **准确率 (Accuracy)：** 定义为识别器正确识别单词的程度。它用于识别话语。


    语音识别系统可以根据识别的语音单词数量进行分类：


    * **孤立词 (Isolated word)：** 需要每个单词在窗口的相邻部分都有静音。它一次只处理一个单词：这意味着单词之间需要停顿。这是最简单的语音识别形式，因为结束点更容易找到。

    * **连读词 (Connected words)：** 与孤立词相同，但它允许单独的单词以最小的时间间隔隙运行在一起。

    * **连续语音 (Continuous speech)：** 不由停顿分隔；它是基于单词组合在一起的语音。在这种情况下，人以自然的方式说话，很难识别，因为需要定义单词边界的方法。它可以用于语音拨号器，在其中可以实现解放眼、解放手的拨号。


    有许多技术用于分析语音波形：


    * **波形 (Waveform)：** 语音信号是听话者和声源之间压力变化的序列。在图中图中，水平轴是从左到右的时间参数轴，曲线表示信号中压力参数的变化。

    * **音高 (Pitch)：** 语音是一个由两部分组成的过程：声源和滤波。在分析最终语音话语时，它指向获取声音的基础频率。

    * **频谱 (Spectrum)：** 它给出了某一时刻频率分布的表示。

    * **倒谱谱 (Cepstrum)：** 这种技术用于语音分析，它是基于信号的光谱视图。


    语音识别技术取得了许多进展。以前的方法在所有条件下都有良好的定义，但如果在语音识别中使用单一的特征提取技术，它们并不能提供良好的识别率结果，因此需要改进。所提研究工作的基本目标是生成一个能够提供高识别率、高准确性和高效率的系统，为独自居住在家的人提供安全。为了实现这一目标，实现了一种用于特征提取的混合
    `MFRASTA` 算法，它比现有算法提供了更有用的结果。该混合算法使用 `MATLAB` 工具实现。


    '
- fmt: '

    The voice recognition system is classified by speaker-dependent and speaker-independent
    systems: speaker-dependant system recognizes the words spoken by a preregistered
    user by comparing them with stored samples of his/her voice in database, and speaker-independent
    system recognizes the words without prior experience with that particular person.
    There are two major factors that make a challenging situation for voice recognition
    system: loud environment and reach factor. There exist a number of parameters
    that affect the reliability and performance of voice recognition system:


    * A speaker voice variation according to emotions, gender, speeds of speaking,
    accent or pronunciation

    * Environment variation according to noise

    * Transmission channel variation

    * Accuracy

    * User responsiveness

    * Performance

    * Reliability

    * Fault tolerance


    ## # 3.3 Voice Recognition Algorithms


    Voice recognition is a technique of automatically verifying the speaker by taking
    information of an individual present in voice waveform. Two types of voice frames
    are obtained: spectral and prosodic. Spectral features can be determined by cepstral
    analysis in which `FFT` is calculated from input samples. Then, power spectrum
    is calculated and log value is applied to it. Prosodic features are not having
    any direct correspondence to write characters of a sentence. There are a number
    of algorithms used for recognition of the voice. Below is the explanation of all
    the algorithms with their features and drawbacks.


    ### ### 3.3.1 Mel frequency cepstral coefficient (MFCC)


    It is a popular technique developed by Davis and Mermelstein in 1980s. As we know,
    the important step in automatic recognition of voice is to obtain the features,
    i.e., to identify the elements of the audio signal which is good for identifying
    the linguistic content and discarding other stuff which carries information such
    as background noise and emotions [[61]](#ref-list.xhtml_refchapter_61). `MFCC`
    is based on domain of frequency using Mel scale, which is further based on human
    ear scale. It is an audio-based feature extraction technique used for extracting
    the parameters from voice similar to the ones that are used by humans for hearing
    speech and at the same time, deemphasizes all other information [[62]](#ref-list.xhtml_refchapter_62).
    The block diagram of `MFCC` is depicted in [Figure 3.5](#ch03.xhtml_fig3_5).


    ![](images/fig3_5.jpg)


    Figure 3.5 Block diagram of `MFCC` technique.


    **Preprocessing:** First, voice signal is provided as an input, then it will preemphasized,
    in which high frequencies are artificially amplified as shown in [Figure 3.6](#ch03.xhtml_fig3_6).
    In this, framing means to multiply the signal with a number of rectangular windows
    in sliding state, but the difficulty with rectangular window is of high power
    involved in side lobes that’s why it may give originate to spectral leakage. In
    order to prevent this problem, the concept of hamming window is used. Filter coefficients
    of hamming window having length `n` are computed as:


    `W*(n) = .54 − .46*Cos*(2∏*n*/*N* − 1)`


    `N` = Total number of samples

    `n` = Current sample


    ![](images/fig3_6.jpg)


    Figure 3.6 MFCC preprocessing phase.


    **Mel frequency cepstral coefficient:** They are calculated using triangular-shaped
    bank filters with central frequency of filter spaced less than 1000 Hz linearly
    and above 1000 Hz logarithmically. Each filter is computed by its bandwidth using
    central frequency of two filters adjacent to each other, and it is dependent on
    the frequency band of filter bank along with a number of filters that are chosen
    for the design.


    **Silence detection:** An important step that is necessary in front-end voice
    recognition system. When a word is spoken by a person, at that time the system
    had no control, that’s why this step is must to determine at what time the person
    has actually started spoken the word and immediately converts the frame of that
    word for an instant.


    **Windowing:** This is an important step in which each individual frame is windowed
    in order to minimize the discontinuities of the signal at the beginning of the
    frame and at the end of the frame. In this, the criteria used to minimize the
    discontinuity or spectral distortion is using the window in order to tape the
    signal by a zero value at the beginning and end of the frame. Window in `MFCC`
    is described as:


    `W*(n), 0 <  = n < = N − 1`


    where `N` = number of samples in each frame


    `Y1*(n) = x1*(n)*w*(n)`


    where `0 < = x < = N− 1`


    **FFT:** It converts each frame of a number of samples represented by `N` from
    time domain to another domain named as frequency domain. It is a fast algorithm
    used to implement Discrete Fourier Transform, which is defined on set of `N` samples
    `{X[n]}` as follows:


    ```

    X_{n} = \sum\limits_{k = 0}^{N - 1}{X_{k}e^{- 2\prod jkn/N}}

    ```


    where `n` = 0, 1, 2, 3 … N−1

    `j` denotes the imaginary part


    **Mel frequency warping:** Linear scale is not followed by voice signals containing
    frequency of sounds. So, for each tone having actual frequency f is measured in
    Hertz, another pitch is measured on better scale called Mel scale. It is a part
    of frequency spacing below 1000 Hz linearly and above 1000 Hz logarithmically.
    A formula is used to compute the Mel coefficients (Mels) for a given frequency
    represented as:


    `Mel*(f) = 2595 − log[10](1 + f*/700)`


    **Cepstrum:** This parameter converts log Mel spectrum back into time and the
    output is called as `MFCC`. Cepstral representation of speech spectrum provides
    a good representation of local spectral properties of signal for giving frame
    analysis. To calculate `MFCC`s `C[n]` as:


    ```

    C_{n} = \sum_{k = 1}^{k}{(\log S_{k})Cos[n - 1/2]}

    ```


    where `n` = 1, 2 ... k


    Advantages:

    * It is used for speech processing tasks.

    * Its recognition accuracy and performance rate are high. own* It has low complexity.


    Disadvantages:

    * This technique includes little noise robustness.

    * As it takes into account only the power spectrum and ignores the phase spectrum,
    hence it provides limited representation.

    * It fails to recognize same word uttered with different energy.


    ### ### 3.3.2 Perceptual linear prediction (PLP)


    PLP is similar to linear prediction code that is based on the short-term spectrum
    of speech, but this technique is included with some better methods using several
    psychophysically based transformations [[63]](#ref-list.xhtml_refchapter_63).
    In this technique, three concepts are used to derive an estimate of the auditory
    spectrum:


    * Critical Band Spectral Resolution

    * Equal Loudness Curve

    * Intensity Loudness Power Law


    It rejects the irrelevant information of speech and thus improves the voice recognition
    rate.


    A frequency warping [[63]](#ref-list.xhtml_refchapter_63) is applied to Bark Scale
    filter bank. In this technique, first step is to convert frequency into Bark Scale
    which is a better representation of human hearing resolution in frequency bark
    and this representation, as shown in [Figure 3.7](#ch03.xhtml_fig3_7). The frequency
    corresponding to an audio frequency is:


    `Ω*(w) = 6ln [*w*/(1200∏) + [(*w*/(1200∏))² + 1]^(0.5)]`


    ![](images/fig3_7.jpg)


    Figure 3.7 Block diagram of PLP technique.

    '
