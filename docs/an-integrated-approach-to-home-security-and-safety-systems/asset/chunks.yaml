  trans: '


    语音识别系统分为领域相关系统和领域无关系统：领域相关系统通过将预注册用户的语音与数据库中存储的语音样本进行比较，来识别其所说的词汇；而领域无关系统则在没有该特定个人先验经验的情况下识别词汇。有两个主要因素使语音识别系统处于挑战性局面：嘈杂环境和距离因素。存在许多影响语音识别系统可靠性和性能的参数：


    * 说话者根据情绪、性别、语速、口音或发音的声音变化

    * 随噪声变化的环境

    * 传输通道的变化

    * 准确性

    * 用户响应性

    * 性能

    * 可靠性

    * 容错性


    ## # 3.3 语音识别算法


    语音识别是一种通过获取语音波形中的个体信息来自动验证说话者的技术。可以获得两种类型的语音帧：频谱特征和韵律特征。频谱特征可以通过倒谱分析确定，其中从输入样本中计算
    `FFT`。然后计算功率谱并对其应用对数值。韵律特征与句子的书字符没有直接对应关系。有许多算法用于语音识别。以下是所有算法及其优缺点的解释。


    ### ### 3.3.1 梅尔频率倒谱系数 (MFCC)


    这是由 Davis 和 Mermelstein 在 20 世纪 80 年代开发的一种流行技术。众所周知，语音自动识别中的重要步骤是获取特征，即识别音频信号中利于识别语言内容的元素，并丢弃携带背景噪声和情绪等信息的其他内容
    [[61]](#ref-list.xhtml_refchapter_61)。`MFCC` 基于使用梅尔尺度的频域，该尺度又进一步基于人耳尺度。它是一种基于音频的特征提取技术，用于从语音中提取与人类听语音时相似的参数，同时弱化了所有其他信息
    [[62]](#ref-list.xhtml_refchapter_62)。`MFCC` 的框图如图图 3.5 所示。


    ![](img/fig3_5.jpg)


    图 3.5 `MFCC` 技术框图。


    **预处理：** 首先，将语音信号作为输入，然后对其进行预加，其中高频被人为放大，如图图 3.6 所示。在此过程中，分帧意味着信号与滑动状态下的若干矩形窗相乘，但矩形窗的困难在于旁瓣涉及的高功率，因此它可能导致频谱泄漏。为了防止这个问题，使用了汉明窗（Hamming
    window）。长度为 `n` 的汉明窗滤波器系数计算如下：


    `W*(n) = .54 − .46*Cos*(2∏*n*/*N* − 1)`


    `N` = 总数

    `n` = 当前样本


    ![](img/fig3_6.jpg)


    图 3.6 MFCC 预处理阶段。


    **梅尔频率倒谱系数：** 它们使用三角形形状组滤波器计算，滤波器的中心频率在 1000 Hz 以下线性间隔，在 1000 Hz 以上按对数间隔。每个滤波器通过其两个相邻滤波器的中心频率来计算其带宽，它取决于滤波器组的频带以及为设计而选择的滤波器数量。


    **静音检测：** 前端语音识别系统中必要的一个重要步骤。当人说话时，系统无法控制，因此这一步骤必须确定人何时实际开始说话，并立即将该词的帧转换为瞬态。


    **加窗：** 这是一个重要步骤，对每个单独的帧进行加窗，以最小化减少信号在帧开头和结尾的不连续性。在此处，用于减少不连续性或频谱失真的标准是使用窗在帧的开始和结束处用零值来贴合信号。`MFCC`
    中的窗描述为：


    `W*(n), 0 <  = n < = N − 1`


    其中 `N` = 每帧的样本数


    `Y1*(n) = x1*(n)*w*(n)`


    其中 `0 < = x < = N− 1`


    **FFT：** 它将由 `N` 表示的样本帧从时域转换为名为频域的另一个域。这是一个用于实现离散傅里叶变换的快速算法，其定义在 `N` 个样本集 `{X[n]}`
    上如下：


    ```

    X_{n} = \sum\limits_{k = 0}^{N - 1}{X_{k}e^{- 2\prod jkn/N}}

    ```


    其中 `n` = 0, 1, 2, 3 … N−1

    `j` 表示虚部


    **梅尔频率翘曲：** 语音信号包含的声音频率并不遵循线性尺度。因此，对于每个实际频率为 f（赫兹测量）的音调，另一个音高则在一个称为梅尔尺度的更好尺度上测量。它是
    1000 Hz 以下线性间距和 1000 Hz 以上对数间距的一部分。使用以下公式计算给定频率的梅尔系数：


    `Mel*(f) = 2595 − log10`


    **倒谱：** 该参数将对数梅尔谱转换回时间，输出称为 `MFCC`。频谱的倒谱表示提供了局部频谱的良好表示。通过以下公式计算 `MFCC`s：


    ```

    C_{n} = \sum\limits_{k = 1}^{k}{(\log S_{k})Cos[n - 1/2]}

    ```


    其中 `n` = 1, 2 ... k


    优点：

    * 它用于语音处理任务。

    * 识别准确性和性能很高。

    * 复杂度较低。


    缺点：

    * 该技术的噪声鲁棒性较差。

    * 它只考虑功率谱而忽略了相位谱，因此提供的表示有限。

    * 它无法识别能量不同的相同词。


    ### ### 3.3.2 感觉线性预测 (PLP)


    PLP 类似于基于语音短期频谱的线性预测，但这种技术包含了几种基于心理物理学的更好方法 [[63]](#ref-list.xhtml_refchapter_63)。在此技术中，使用了三个概念来推导出听频谱估计：


    * 关键频分辨率

    * 等响度曲线

    * 强度响度律


    它排除了语音无关信息，从而提高了语音识别率。


    对巴克尺度滤波器组应用了频率翘曲。在此技术中，第一步是将频率转换为巴克尺度（Bark Scale），该尺度是人耳频率分辨率更好的表示，这种表示如图图 3.7
    所示。对应于音频频率的频率为：


    `Ω*(w) = 6ln [*w*/(1200∏) + [(*w*/(1200∏))² + 1]^(0.5)]`


    '
- fmt: '

    Bark Filter Bank consists of integration of three factors into one filter bank:
    frequency warping, smoothing and sampling. An equal loudness pre-emphasis weights
    the filter bank outputs to simulate the sensitivity of hearing. Equalized values
    are transformed according to a power Law of Stevens by raising each to the power
    of `0.33\.`. Resulting auditory warped line spectrum is further processed by linear
    prediction. Applying linear prediction to auditory warped line spectrum means
    to compute predictor coefficients of a signal. Finally, cepstral coefficients
    are obtained from predictor coefficients by a recursion that is equal to log of
    the model spectrum followed by inverse Fourier transform.


    ### Advantages


    * It reduces the discrepancy between voiced and unvoiced speech.

    * Its resultant feature vector is low dimensional.

    * It is based on the short-term spectrum of speech signals [[63]](#ref-list.xhtml_refchapter_63).

    * The coefficients of `PLP` are mainly used as they provide correct value of high-energy
    regions of the voice spectrum.

    * `LPC` approximates the voice spectrum in equal manner for all frequencies, and
    this presentation is required to known principles of human hearing.


    ### Disadvantages


    * Its resultant feature vector is dependent on whole spectral balance of formant
    amplitudes.

    * Its spectral balance is easily altered by the communication channel, noise and
    equipment used.


    ### [3.3.3 Linear prediction code (LPC)](#contents.xhtml_toc3_58) [[63]](#ref-list.xhtml_refchapter_63)


    `LPC` is the most important feature for processing of voice signals that takes
    out the voice parameters such as pitch formants and spectra. This technique is
    used for designing user’s voice production. It predicts the future features based
    on previous features. It is desirable to compress the signal for efficient transmission
    and storage. The digital signal is compressed before transmission for efficient
    utilization of channels in wireless media. For medium or low bit rate coder, it
    is widely used. While we pass the voice signal from the voice analysis filter
    in order to remove the redundancy in signal, residual error is generated as an
    output. It can be quantized by a smaller number of bits as compared to the original
    signal. So now, instead of transferring the entire signal, transfer this residual
    error and speech parameters to generate original signal. A parametric model is
    computed that is based on least MSE theory, this technique is known as linear
    prediction. [Figures 3.8](#ch03.xhtml_fig3_8) and [3.9](#ch03.xhtml_fig3_9) represent
    the block diagram and steps included in `LPC` technique.


    1. **Preemphasis**: First step is speech analysis that is performed by passing
    it with the help of a filter, and the goal is to flat the signal in spectral form
    with less precision effect. The value of filter coefficient must be within `0.9`
    and `1\.`. [[64]](#ref-list.xhtml_refchapter_64).

    2. **Framing creation**: After first step, the developed voice is divided into
    a number of frames that consist of `N` samples, and the range of each sample is
    20 to 40 seconds. A must requirement is a standard overlap of 10 ms within two
    nearby frames in order to ensure the stationary period between frames.

    3. **Apply windowing**: This step takes resulting frames, and they are multiplied
    with a `hamming window`. The main purpose is to minimize the edge effect.

    4. **LPC computation**: This is the last and final step in which the technique
    of autocorrelation is applied on the frames of windowing speech sample.


    ![](images/fig3_8.jpg)


    Figure 3.8 Block diagram of LPC technique.


    ![](images/fig3_9.jpg)


    Figure 3.9 Block diagram of LPC technique.


    It analyzes the speech signals by estimating the formants, removing their effects
    from the speech signal and estimating the intensity and frequency of remaining
    buzz. The process of removing the formants called inverse filtering and remaining
    original is called residue.


    ### Types of `LPC` [[64]](#ref-list.xhtml_refchapter_64):


    There are a number of `LPC` techniques which are named as follows:


    * Coded-Excited LPC (CELP)

    * Pitch Excitation LPC

    * Residual Excitation LPC

    * Voice Excitation LPC

    * Multiple Excitation LPC (MPLPC)


    ### Advantages


    * It is a static technique.

    * It is reliable, accurate and robust technique for providing parameters of speech.

    * Computation speed is good and provides with accurate parameters of speech.

    * It is used for encoding of speech at low bit rate.

    * It is one of the powerful ways of signal analysis.

    * It minimizes the sum of squared differences between the real speech signal and
    calculated signal for a given time period.


    ### Disadvantages


    * It is not able to distinguish the words with similar vowel sound.

    * It generates residual error as output, resulting in poor speech quality.


    ### [3.3.4 RelAtive SpecTrA-Perceptual Linear Prediction (RASTA-PLP)](#contents.xhtml_toc3_59)


    This method is used to enhance the speech when recorded in a noisy environment.
    In this, RASTA technique is merged to the `PLP` technique and forms a combination
    named as: `RASTA-PLP`, this combination increases the robustness includes in individual
    `PLP` method. The fact used in this method is that the temporary properties of
    environment surrounded by persons are not same with the properties of signals
    of voices [[65]](#ref-list.xhtml_refchapter_65). When combined with `PLP`, it
    gives better performance. Proposed by Hynek Hermansky, `RASTA-PLP` is a method
    of encapsulating the spectra for difference minimization between speakers so that
    useful information is preserved. `RASTA` is a useful technique applied to each
    sub band of frequency by band pass filter and finally got smooth irrespective
    of noise factor. [Figure 3.10](#ch03.xhtml_fig3_10) displays the most useful processes
    that are defined in this technique.


    ```

    H(z))=(0.1)(2+z^(-1)-z^(-3)-z^(-4)/(1-.98z^(-1)))

    ```


    ### Advantages


    * It is robust.


    ### Disadvantages


    * It gives poor performance in the clean speech environment.


    ![](images/fig3_10.jpg)


    Figure 3.10 Block diagram of RASTA-PLP technique.


    ### [3.3.5 Zero crossing peak amplitudes (ZCPA)](#contents.xhtml_toc3_60)


    This technique was developed by Chok-ki Chan. It is based upon a speaker-dependant
    system and human sound system [[65]](#ref-list.xhtml_refchapter_65). ZCPA uses
    intervals with crossing zero to express the information about signals and provides
    value of amplitude to express intensity information. With this technique, value
    of frequency and amplitude is combined to form the complete output of feature
    vectors. This technique classifies a set of words into two groups and makes the
    process of recognition easier as presented in [Figure 3.11](#ch03.xhtml_fig3_11).


    ![](images/fig3_11.jpg)


    Figure 3.11 Detailed diagram of ZCPA technique.


    ### [3.3.6 Dynamic time warping (DTW)](#contents.xhtml_toc3_61) [[66]](#ref-list.xhtml_refchapter_66)


    In time arrangement analysis, this is a calculation for estimating similarity
    between two temporal successions which may change in speed as well as in time.
    For example, by using this algorithm, walking pattern’ similarity could be easily
    detected, regardless of whether one individual was walking quicker than the other
    and in second case, if there were increasing and decreasing of speeds throughout
    an observation. This technique has been applied to transient sequences of video,
    sound and graphics data — in reality, any information that can be transformed
    into a linear sequence can be easily analyzed with dynamic time arping, as shown
    in [Figure 3.12](#ch03.xhtml_fig3_12).


    ### Advantages


    * High recognition speed.

