    As the face recognition technique is hands free, it provides continuous authentication
    to the users. This technology captures the images through the camera and those
    features of the face are extracted which do not change with time. Similar to this,
    voice recognition plays a vital role in the authentication in which audio files
    are captured with the help of a microphone. The proposed model is implemented
    using face and voice recognition techniques to provide home based security to
    the individual living alone. The face recognition technique is used at the front
    door of the home in real time, even when no one is in the home and voice recognition
    technique is used to provide communication between the door and hardware device
    such as mobile or laptop. This system is very easy to handle and user friendly.
    This model incorporates a number of factors to provide safety and security in
