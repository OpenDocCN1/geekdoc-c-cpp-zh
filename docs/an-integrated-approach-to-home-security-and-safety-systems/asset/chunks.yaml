    ### 独立于语音识别（相似性）


    当上述两种技术（人脸识别和语音识别技术）中的任何一种无法正确或准确地识别人员时，就会考虑这种技术。这是一种独立于的语音识别技术，根据语音特征（如音高、语速、语音调制和频率）识别语音，而不取决于门外人员所说的文本或内容。将门外人员的语音特征与所有四个类别人员的语音特征进行比较。如果门外人员语音特征与存储的任何语音特征之间的差值小于或等于
    0.014，则语音匹配成功，否则该人员被识别为属于未知类别，如图 3.20 所示。该值被视为相似性指数，即 0.014 被视为识别的阈值。如果相似性指数大于或等于
    75%，则门外人员将被宣布为已知人员，并在屏幕上显示其所属的类别，并根据其所属的类别，将文本消息发送给家庭、朋友和邻居类别的相关人员；如果相似性指数值小于
    75%，则 MATLAB 窗口底部不会出现消息，因为门外人员属于未知类别。


    图 3.21 和 3.22 显示了基于相似性指数值的输出。图 3.22 描绘了一个属于“未知”类别的人，图 3.23 分别描绘了一个属于“家庭”类别的人。


