    # 第一章


    ## 泛在计算概述


    DOI: [10.1201/9781003120933-1](https://doi.org/10.1201/9781003120933-1)


    ## 1.1 泛在计算概述


    泛在计算（Pervasive computing）是指任何人可以在任何时间、任何地点使用软件信息部分应用程序的能力。如果将这种计算与桌面型计算进行比较，泛在计算可能通过任何类型的设备、在任何类型的地点以任何格式访问数据
    [[1]](#ref-list.xhtml_refchapter_1)。桌面计算主要面临两个问题：


    **可访问性限制：** 在这种情况下，组织的网络无法被该组织的所有用户访问。大多数用户无法负担得起桌面电脑，组织为每位成员提供计算机也是不可能的。


    **隔离访问：** 隔离属性意味着桌面电脑是供特定地点的单用户使用的。用户试图与多个群体进行交互。因此，泛在计算作为解决这些挑战的一种方式应生。


    **泛在计算的定义：** 这种计算由 Mark Weiser 定义，他在移动计算、上下文感知计算和无线通信等不同应用中进行了开发。它是一种始终“消失”的深层技术
    [[2]](#ref-list.xhtml_refchapter_2)。它基本上是一种与集成到现实物体中的小型设备集合一起的技术，并为计算提供无处不在的访问。无处计算（Ubiquitous
    computing）的目标是布局计算基础设施，使其能够与环境无缝结合并变得不可见。Mark Weiser 将计算分为三类：板板（pads）、显示板（boards）和标签板（tabs）。由于用于记录的
    tabs 尺寸非常小，屏幕非常敏感，而且位置感知也是一个问题。因此，pads 应运而出。的功能与 tabs 类似，但 pads 的尺寸更大，像是一个笔记本。最后是
    boards，其尺寸比 tabs 和 pads 都大。用于 pads、tabs 和 boards 的基本属性包括移动设备、上下文感知、无线通信等。它们融入日常生活的织中，直到设备等同于它们。它也被称为无处不在计算（omnipresent
    computing）。这种计算的目标是无处不在。为了无处不在，这种计算必须支持具有不断硬件能力的多种设备。为了获得更大的覆盖范围，这种计算必须与多种网络兼容。网络包括用于手机服务的
    GSM（全球移动通信系统）、CDMA（码分多址）网络、无线网络技术、蓝牙等。这些设备支持不同距离范围的连接。蓝牙网络提供 10–100 米内的连接。无线技术通过接入点支持远距离。手机网络支持高达
    35 公里的距离。一种名为网络间切换的属性将需要会话管理。泛在计算技术的概述见于图 1.1。


    ![](img/fig1_1.jpg)


    图 1.1 泛在计算概述。


    泛在计算可以以多种形式存在，从笔记本电脑到家用电器不等。使其成为可能的技术包括微处理器、移动代码、传感器和互联网。简之，每当人们使用数字设备连接到技术平台时，泛在计算就会发生。泛在计算的主要目标是将计算嵌入到环境中，允许用户通过信息处理享受日常物品带来的处。泛在系统预计将在具有不同能力和资源的广泛环境中运行。应用需求可能会动态变化，从而需要灵活的适应。传感器故障在它们的寿命期间会出现，而且由于不期望用户具备技术技能，系统需要进行自我管理。


    ## 1.2 分布式计算


    分布式系统是位于不同机器上的独立组件的集合，它们通过相互共享消息来共同实现目标。从 20 世纪 70 年代到 90 年代，一直有一项研究旨在创建一个通过网络连接两台计算机并运行的框架。网络可以是静态或动态的、有线或无线的，也可以是泛在的。它是一种用于协调在多台计算机上同时执行的过程系统
    [[3]](#ref-list.xhtml_refchapter_3)。计算机之间的通信介质是通过图 1.2 所示的消息。这种计算用于解决在特定时间内单台计算机上无法解决的复杂问题。分布式计算需要软件来协调任务，这是一个巨大的挑战，因为主任务是划分可以单独运行的元素。在分布式计算中，需要特殊的软件来管理多台计算机的资源。这种软件由一个称为“主计算机”（master
    computer）的主单元运行，其他计算机被称为“从机”（slaves）。主计算机负责将任务分配给从机，并在处理完成后合并结果。


    ![](img/fig1_2.jpg)


    图 1.2 分布式计算概述。


    使用主从系统的一个缺点是存在单点故障的可能性，即服务器。因为它是唯一一个为所有从机提供必要资源的计算机，如果服务器宕机，系统将无法正常工作；另一个缺点是，如果从机数量极高，情况下资源将变得稀缺。


    ## 1.3 移动计算


    在 20 世纪 90 年代，构建分布式系统出现问题时，当时另一项关于无线局域网和笔记本电脑的研究也完成了，即移动计算因此诞生了。分布式计算的各种标准或元素、原则或功能在日常生活中不断应用。然而，由于某些要求开发了新技术，这些技术受限于低值、网络质量波动、元件稳健性、尺寸问题、电池限制和重量限制
    [[4]](#ref-list.xhtml_refchapter_4)。移动计算是在我们在移动状态下使用的计算类型。它是一种允许通过计算机或任何其他无线设备传输数据、语音和视频的技术，而无需连接到固定物理链路，如图
    1.3 所示。它需要无线通信来方便设备在通信模式下的移动性。


    ![](img/fig1_3.jpg)


    图 1.3 移动计算概述。


