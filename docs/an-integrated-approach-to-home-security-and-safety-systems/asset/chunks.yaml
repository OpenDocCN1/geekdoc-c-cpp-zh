- fmt: '

    - In case of voice recognition, text-dependant system is improved by 99% with
    implementation of hybrid `MFRASTA` techniques and text-dependant system is improved
    by 87% for known persons and 75% for unknown persons. Overall, this combination
    provides high recognition rate as compared to individual `MFCC`. The results indicate
    that in a noisy environment, this proposed `MFRASTA` is much better to use under
    robust conditions.


    - The sensor-based fingertip application provides high accuracy for heart beat
    monitoring by using an `iPhone 6s` camera and in an emergency, send text messages
    to their family members. This proposed application is compared with a number of
    previously used techniques and finally it is observed that this method outperforms
    the previous methods.


    - A real-time recognition system of face and voice is designed, and it gives better
    performance in terms of recognition rate. This complete system is implemented
    in `MATLAB` by creating a `GUI` and using a `3G dongle` for sending the messages
    to the cell phone of the users.


    ## 6.3 Future Work


    - When a specific category is displayed to which the person at door belongs after
    Face and Voice recognition, it will be displayed with the name of the person who
    appears at the door.


    - The acceptable images are of `512*512` dimensions, they may be of any dimension
    and of any resolution.


    - In case of health monitoring, some other parameters may be included such as
    stress rate, sweat rate and temperature.


    - To ensure the exactness of the proposed heart rate monitoring device, number
    of experiments can be implemented by taking group of persons having different
    weights and with different age groups.


    - To develop better algorithms and appropriate sensors to reduce acquisition rate
    failure.


