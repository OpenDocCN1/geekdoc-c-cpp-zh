    \ matrix of pixels. Individual pixels contain a number or numbers that represent\
    \ gray scale or color which is assigned to it. Color pictures are heavier in size\
    \ as compared to gray scale pictures, so more power is required to process color\
    \ pictures. In image processing, first step is to convert color pictures to gray\
    \ scale pictures and then processing will be done on gray scale images. Before\
    \ this, image is loaded to begin the processing. If image is colored, then first\
    \ image is converted into gray scale for making processing simpler.\n\nFor conversion,\
    \ a function is used, i.e., rgb2gray to change the color. There are two functions\
    \ that are used in image processing: imread and imshow. Imread is used to read\
    \ an image file with a particular format, and imshow function is used to show\
    \ an image. Last is to write an image using imwrite function, it allows to save\
    \ an image as any file supported by MATLAB, which are same as supported by imread.\n\
    \n### [1.8.3 Properties of image](#contents.xhtml_toc3_37)\n\n*   **Histogram:**\
    \ It is a bar graph that shows data distribution. In image processing, it shows\
    \ the number of pixel values present in an image. Image can be manipulated to\
    \ meet the specifications. For creating a histogram from an image, use ‘imhist’\
    \ function, ‘histeq’ function is used to for contrast enhancement ‘graythresh’\
    \ is performed for thresholding.\n\n*   **Negative:** It means the output image\
    \ is the reversal of the input image. For 8-bit image, the pixels with a value\
    \ of zero take on a new value of 255, while the pixels with a value of 255 take\
    \ on a new value of 0\\. All pixels values in between take on similarly reversed\
    \ new values. The new image appears as the output of the original image. This\
    \ operation is performed by imadjust function.\n\n*   **Fourier transform:** The\
    \ role of frequency is important to understand how image processing filters work.\
    \ An image consists of collection of discrete signals so signals are associated\
    \ with frequencies. There are two ways to know frequency content that it is low\
    \ or high. If there is less change in gray scale values when image is scanned,\
    \ it means there is low-frequency content contained within the image. If there\
    \ is more change in the gray values when image is scanned, it means there is high\
    \ frequency content contained within the image. Fourier transform is described\
    \ as the transformation of a signal into its constituent sinusoids. For digital\
    \ systems, if Fourier transform is designed in a way that discrete input values\
    \ are entered by specifying sampling rate and computer generated discrete outputs,\
    \ this is called as Discrete Fourier Transform. MATLAB uses a fast algorithm for\
    \ DFT computations, which is called as FFT, whose command is fft.\n\n*   **Convolution:**\
    \ In image processing, a linear filtering method is used named as convolution.\
    \ It is the algebraic process of multiplying two polynomials. An image is an array\
    \ of polynomials whose pixel values represent the coefficients of the polynomials.\
    \ So, two images can be multiplied together to produce a new image with the help\
    \ of convolution. In MATLAB, conv2 is used to perform a 2D convolution of two\
    \ matrices.\n\n*   **Filters:** Filtering is used to modify an image, and it is\
    \ used in image processing. There are mainly two filters used a) low-pass filters\
    \ are those which blur high-frequency areas of images. This filter is used when\
    \ unwanted noise is to be removed from an image. b) Median filters are those that\
    \ can be helpful for noise removal from images. It is like an average filter,\
    \ it examines the pixel and its neighbor’s pixel values and return the mean of\
    \ these pixel values. By this, noise can be removed but edges are not blurred\
    \ as much.\n\n### [1.8.4 Signal processing in MATLAB](#contents.xhtml_toc3_38)\n\
    \nThe signal processing on MATLAB consists of number of tools for the computation.\
    \ From generation of waveform to design of filters, all the operations are fully\
    \ supported by signal processing toolboxes. The functions of signal processing\
    \ are expressed in M-files to implement the tasks. Two built-in functions that\
    \ are most commonly used in MATLAB are- filter and fft. Filter function is used\
    \ on a sequence of data for filtering purpose, and fft is used to calculate the\
    \ transform of sequence of data.\n\n## [1.9 Book Organization](#contents.xhtml_toc2_39)\n\
    \nThe main objective of this research is to provide security to an individual\
    \ who is living alone at home. The work has been organized in following chapters:"
