    ## 1.5.2 Commonly used biometrics methods


    There are number of biometric methods in use as shown in [Figure 1.11](#ch01.xhtml_fig1_11).
    Biometric has been for long the target of future authentication that expected
    that biometric authentication will largely displace other means of our current
    authentication and access control. Biometric authentication techniques are classified
    by the type of characteristics evaluated: physiological attributes or behavioral
    singularities.


    ![](images/fig1_11.jpg)


    Figure 1.11 Classification of biometric features.


    - **Physiological biometrics**: These are based on classifying a person according
    to data obtained as part of the human body such as his/her fingerprints, face
    or eye iris.


    ### 1.5.2.1 Fingerprint


    It is one of the biometric technologies used in number of applications. It is
    used to identify a user uniquely using patterns found on fingertip [[12]](#ref-list.xhtml_refchapter_12).
    A fingerprint consists of a pattern of valleys followed by ridges placed on each
    person’s fingertip.


    An uneven surface with ridges and valleys on fingertip makes a pattern unique
    as depicted in [Figure 1.12a](#ch01.xhtml_fig1_12) and [b](#ch01.xhtml_fig1_12).
    Fingerprints were used for authentication of a user and the matching accuracy
    was very high. Previously, method used was old ink and paper based but now an
    automatic version is generated for identification purpose. In this, the user has
    to place his finger for the print to be electronically read. If user operates
    in a controlled environment, then this technique is best. Arrangement of ridge
    makes unique fingerprints for every user, and it requires less memory for data
    storage but in case of dryness, skin infection and dirty skin sometimes it makes
    wrong identification and it is a noisy sensor.


    ![](images/fig1_12.jpg)


    Figure 1.12 a) Image of ridges and valleys in a finger, b) real image of ridges
    and valleys in a finger.


    ### 1.5.2.2 Face recognition system


    Face recognition includes several landmark points that make facial features. User’s
    face can be captured by a camera for authentication purpose. It is an application
    for automatically recognizing a user from camera [[13]](#ref-list.xhtml_refchapter_13).
    Its main advantage is that it can be used to recognize a user from a particular
    distance. This system is secure and easily implemented but variation in pose and
    lighting affects the image. As there are number of features included with face
    recognition technique, it can be used in various areas such as banks, criminal’s
    identification and identification of terrorists.


    It is a biometric approach used to distinguish one person from other on the basis
    of their faces. It involves three main steps as shown in [Figure 1.13](#ch01.xhtml_fig1_13).


    ![](images/fig1_13.jpg)


    Figure 1.13 Face recognition steps.


    - **Data acquisition**: Acquisition of data items is the main step for recognition
    of face in which facial images are collected by using number of sources. Number
    of images when collected will be having different pose variation, illumination
    variation, etc. So we can easily verify the performance of our recognition system
    with the number of conditions. Sometimes, input image is normalized and different
    transformation methods for image can be applied on input image. In this, unwanted
    parameters such as noise, lighting and blurred effects are removed and then it
    will be used for next process.


    - **Feature extraction**: Feature extraction is the next step of this system,
    which is used to take out the information by using given images and then extracted
    features are used for recognition step. In this step, dimensionality reduction
    is used with noise cleaning.


    - **Recognition**: Recognition is the next step of face recognition system after
    features selection and extraction, now image is classified by using number of
    classifiers. In this step, number of images is taken and feature extraction is
    applied on them and stored in database. When new image comes for face recognition,
    it first performs face acquisition, feature extraction then compare all the images
    in database. An image to be tested is compared with all the images in database
    in order to identify an individual.


    Automatic face recognition comprises mainly of two tasks:


    - **Verification**: In verification part, the system correlates the given person
    with who that individual says they are and gives the output in the form of yes
    or no.


    - **Identification**: In identification part, the system matches the given person
    with all the other persons stored in a database and provides a list of matched
    persons.


    #### 1.5.2.2.1 Challenges of face recognition


    There exist a number of challenges correlated with recognition of facial features
    and they can be defined by the following entities:


    - **Pose**: Variation in pose is a matter of concern in recognition of face, pose
    changes nearby camera when the person is at the door, at that time, some features
    may visible partially or fully closed as shown in [Figure 1.14](#ch01.xhtml_fig1_14)
    and it results in wrong identification [[13]](#ref-list.xhtml_refchapter_13).


    - **Structural components**: Some features are there like moustaches, scarf, beards
    and glasses, which may or may not be always present ([Figure 1.15](#ch01.xhtml_fig1_15)),
    and this problem will affect the classification process.


    - **Image rotation**: Face images fluctuate or differ by various rotations.


    - **Poor quality**: Certain images that may contain noise or are blurred or distorted
    may result in a poor quality of face recognition.


    - **Facial expression**: Face expressions may change from person to person as
    shown in [Figure 1.16](#ch01.xhtml_fig1_16).


    - **Unnatural intensity**: Faces from three-dimensional models such as rendered
    faces, animated movies and cartoon faces have unnatural intensity.


    ![](images/fig1_14.jpg)


    Figure 1.14 Variation in pose.


    ![](images/fig1_15.jpg)


    Figure 1.15 Variation in structural components.

