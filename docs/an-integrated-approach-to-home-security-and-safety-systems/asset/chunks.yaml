- fmt: '

    ## 6.1 Introduction


    As the old age states that the facial expressions are the one that completely
    describes about a person like his/her nature, emotional feeling, etc. That’s why
    the face is termed as the complete index of the mind. So, the uniqueness of a
    particular person is recognized by considering the features of face of that particular
    person.


    To identify a person in a public area is not an easy task, and this is the reason
    that it is required to evolve efficient authentication techniques as hair style
    change, with spectacles, with hat, surgery of face can modify the natural look
    of face [[79]](#ref-list.xhtml_refchapter_79). Sometimes, face recognition becomes
    a difficult step if the features of face change frequently. So, models must be
    developed to identify a person and recognize the face of that particular person
    for validation purpose.


    This model performs an important role in a number of applications such as security
    systems, banking and hotels. Face recognition system starts by locating a face
    in an image even in the changing situations such as change in pose, illumination
    and orientation. Face recognition methods consist of number of categories:


    a) **knowledge-based**: which is used for face localization. This method tries
    to automate user’s knowledge of face recognition in the form of rules by using
    the concept of capturing the relationships between facial features;


    b) **feature invariant**: in which those structures of the facial features are
    captured that exist in case of change in pose, viewpoint, etc., and then these
    structures are used for face recognition process;


    c) **template matching**: in which complete face is used to take standard patterns
    and features of face are taken separately to compare an input image with number
    of images stored in a database;


    d) **appearance-based**: which also tries to acquire the variying features of
    all the stored images and then use these features of the stored set to recognize
    an input face;


    e) **knowledge-based**: number of rules are established that are based on the
    extraction process of information with help of research’s knowledge [[80]](#ref-list.xhtml_refchapter_80).

