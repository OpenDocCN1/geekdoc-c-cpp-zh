  raw: '2.  Face recognition test passes but voice recognition test fail.


    3.  The face recognition test fails but voice recognition test passes.


    4.  When face recognition and voice recognition both are unsuccessful.


    In the first scenario, category of the person at the door is displayed as output
    on the screen out of any proposed categories: family, friend, neighbor or unknown.
    In the second and third scenario, similarity index technique comes into existence.
    This technique is taken into consideration when any one of two above mentioned
    and used techniques that is face recognition or voice recognition technique fails
    to recognize the person correctly or accurately. It is a text-independent voice
    recognition technique used to recognize voice based upon voice features such as
    pitch, speaking rate, voice modulation and frequency, irrespective of the text
    or content spoken by the person at the door. The voice features of the person
    at the door are compared with voice features of persons belonging to all four
    categories. If the difference between the features of voice signals of the person
    at the door with the voice features of any of the stored voices is less than or
    equal to 0.014, voice is matched else that person is identified as belonging to
    unknown category. This value considered for Similarity index, i.e., 0.014 is considered
    as the threshold value for voice recognition. If Similarity index is greater than
    or equal to 75%, then only the person at door will be declared as known person
    and the category to which he/she belongs will be displayed on the screen and depending
    upon the category he/she belongs, a text message will be sent to the concerned
    persons belonging to family, friend and neighbor categories and if the value of
    similarity index is less than 75%, no message would appear at the bottom of the
    window in MATLAB since the person at door belongs to unknown category. In fourth
    scenario, output displayed on the screen shows the person at door belonging to
    “unknown” category.


