    # 血压测量


    血压是人体重要的指标之一。在 19 世纪初，人类首次使用简单设备进行血压测量 [[71]](#ref-list.xhtml_refchapter_71)。之后，血压测量设备有了许多进展。这些图描绘了用于测量血压的传统设备：图
    4.7 显示了手动血压计，它使用听诊器测量心率；在图 4.8](#ch04.xhtml_fig4_8)中有一个 Boso-medicus 设备，是一个无线蓝牙设备；图
    4.9](#ch04.xhtml_fig4_9)显示了一个具有大记录内存的自动手腕心率监测设备。


    ![](img/fig4_7.jpg)


    图 4.7 手动测量血压的方法。


    ![](img/fig4_8.jpg)


    图 4.8 Boso-medicus 血压监测设备。


    ![](img/fig4_9.jpg)


    图 4.9 自动手腕血压监测设备。


    血压的测量以 `mmHg` 为单位。血压有两种类型：收缩压和舒张压。收缩压是指心脏泵出的最大压力，舒张压是指心脏放松时的最小压力。血压过高或过低都可能对健康产生危险。


    上述表 4.1](#ch04.xhtml_table4_1) 显示了血压的不同分类。在目前，出现了两种新的护理表示形式，即：基于家庭服务的自我护理。传感器技术与网络技术的进步使得这项任务成为可能
    [128]。传感器单元由一个红外发射二极管组成，它将红外光传输到指尖，以及一个感应反射光的光二极管。健康成年人在静止状态的心率约为 72 bpm，婴儿约为
    120 bpm，而大儿童约为 90 bpm。随着预期寿命的延长，老年人口的增加给人类生活的许多方面带来了许多挑战，特别是在健康监测、安全舒适舒适方面。可以通过健康监测系统、传感器技术和通信系统增强老年护理。老人/残障人士或独居女性可以从这种监测系统和应急系统中获益，以维持健康安全的生活
    [[71]](#ref-list.xhtml_refchapter_71)。


    表 4.1 血压分类


    | 分类 | 收缩压 | 舒张压 |

    | --- | --- | --- |

    | 低血压 | <90 | <60 |

    | 正常 | 90–120 | 60–80 |

    | 前高 | 121–139 | 81–89 |

    | 一级高血压 | 140–159 | 90–99 |

    | 二级高血压 | >=160 | =100 |


    在过去，人们去医院进行心率监测，由心脏病学家或医生检查患者是否有任何心脏疾病。心电图机通常在大医院发现，需要专家来操作机器。开发一种使用红外传感器的低成本心率监测设备将是基础。


    架构的设计必须能够：收集数据、分析这些数据，然后通过与医生的交互提供检查的重要体征和数值，使医生获取最新信息，最后启动紧急报警。非常重要的是，所使用的技术必须对用户来说简单且透明。因此，必须有一个可靠的应急系统来监测老年人的状况，并在发生紧急情况时立即通知家属事故并呼打救护车和医生
    [[72]](#ref-list.xhtml_refchapter_72)。因此，目标是尽可能地克服任何人生活中的问题，以便患者能够以更好的方式过独立的生活。主要目标是使用红外传感器设计并开发一种低成本便携式心率监测设备。生成的原型是一种低成本设备，可以通过红外传感器计数产生的脉冲来轻松检测并显示心率。在当今世界，医生、家属、朋友和邻居可以使用
    `MATLAB®` 工具和 3G 网狗在手机上轻松接收其患者的健康相关信息。监测患者对于做出决策起着重要作用。该系统现在正通过其先进的功能和将数据转换为有用信息的能力不断扩展。注意到，理想的监测系统应该能够使用传感器设备收集高质量数据，利用专家知识进行决策支持并最终做出适当决策。


    ## 旧技术 (contents.xhtml_toc2_70)


    ### 心音图应用 (contents.xhtml_toc3_71)


    心音图通过图 4.10](#ch04.xhtml_fig4_10)所示的机器记录心脏发出的声音。这种医疗设备使用滤波器、麦克风和放大器等多种技术来收集心声。集成麦克风用于记录心声，然后使用软件应用程序提取脉率。但使用这种设备，测量结果并不准确，且对噪声非常敏感。心脏瓣膜在收缩和舒张期间开启和关闭产生声音可以通过听诊器听到。这些声音与心跳有节奏，可以通过麦克风进行感知。正常心声用于确定心率。


    ![](img/fig4_10.jpg)


    图 4.10 心音图设备。


    ### 汞柱血压计 (contents.xhtml_toc3_72)


    这是一种在每个医生桌子上常见的经典设备，由斯蒂芬·哈尔斯开发。这个词是两个词的组合：sphygmos 指脉搏，manometer 指压力计。这种设备用于计算血压，因为它带有一个充气袖带可以塌陷，然后以控制的方式释放袖带下的动脉，并使用压力计测量压力。该设备需要袖带、气囊、软管和橡胶球，如图
    4.11](#ch04.xhtml_fig4_11) 所示。所有部件都需要保持良好状态并根据制造商说明在适当的时间进行维护。这是一个简单的基于重力的装置。当该设备维护良好时，它可以提供血压的绝对测量值。


    这种设备非常脆弱，在操作、存储或运输该装置时应特别小心。使用这种设备的优点是它非常耐用，不需要重新调整，但这种设备的问题是它体积大，必须小心处理以防损坏。如果不保持垂直可能会产生误差。


    ### 自动数字血压计 (contents.xhtml_toc3_73)


