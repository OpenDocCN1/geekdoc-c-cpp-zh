- fmt: '

    This device is known as oscillometric device, as shown in [Figure 4.12](#ch04.xhtml_fig4_12).
    It uses an electronic pressure sensor for measuring the blood pressure, and readings
    are given out digitally on the display. This device has inflatable cuff like mercury
    sphygmomanometer and cuff is attached to the electronic unit. Difference with
    other types is the technique used. Its report is based on the sounds produced
    by blood, flowing inside the arteries. It evaluates and measures the oscillations
    of the arteries using pressure sensors. As the cuff is inflated and deflated,
    oscillation occurs. These oscillations are processed using an algorithm to produce
    systolic and diastolic values that are digitally displayed on display screen.


    ![](images/fig4_12.jpg)


    Figure 4.12 Automatic digital sphygmomanometer.


    They are battery operated. The advantage of using this device is that it is compact
    and portable. Operating the device is easy and chances of error are minimized,
    but drawback is it is delicate and proper care should be taken while handling
    the device.


    ### 4.2.4 Electrocardiographs](#contents.xhtml_toc3_74)


    As the heart is four-chambered muscle whose function is to pump blood throughout
    the body. The heart is really two ‘half hearts’ left and right which beat simultaneously
    as shown in [Figure 4.13](#ch04.xhtml_fig4_13). Each of these two sides has two
    parts or chambers: upper chamber known as an atrium and lower chamber known as
    ventricles.


    ![](images/fig4_13.jpg)


    Figure 4.13 Anatomy of human heart.


    This term was introduced by Willem Einthoven in 1893. The contraction and relaxation
    of cardiac muscles cause blood to flow in and out of heart. During each cardiac
    cycle, a set of tissues in the heart develops impulses in electrical form and
    then spread them all through the heart, which causes shrinkage of the heart muscles
    as shown in [Figure 4.14](#ch04.xhtml_fig4_14). At specific points in the human
    body, electrodes are placed to detect the impulses. Then, ECG acquires this varying
    impulse and shows the overall working of heart. Typical ECG is corrupted by: electrical
    interference from surrounding equipments, measurement of noise and instrumentation
    noise. The ECG is a traditional method for heart function monitoring by using
    electrode contracts attached to the body.


    ![](images/fig4_14.jpg)


    Figure 4.14 Electrocardiographs (ECG).


    Formula for calculating heart rate per minute is as follows:


    ```

    heartbeatrate/min = 1/[pulseperiod/(3 * 512 * 60)] + 92160/pulseperiod

    ```


    ### 4.2.5 Accelerometer-based application](#contents.xhtml_toc3_75)


    This application can be used to calculate vibrations of the chest caused by the
    movement of the heart. This method is easily affected by noise and gives inaccurate
    results most of the time. It detects heart rate without touching the body, based
    on Ballistocardiography (BCG) principle. Its benefit is a contactless measurement
    that enables continuous monitoring without disturbing the patient as shown in
    [Figure 4.15](#ch04.xhtml_fig4_15). It is very easy to use.


    ![](images/fig4_15.jpg)


    Figure 4.15 Accelerometer-based application.


    ## 4.3 Proposed Technique: Fingertip Application](#contents.xhtml_toc2_76)


    The proposed technique is based on a smart phone for health monitoring by using
    the concept of sensors. Smart phones are carried by everyone in every place and
    at all the time, this all time available property of having the smart phone makes
    it perfect to monitor health parameters and in an emergency, send text message
    to the family members. As the purpose of the proposed research work is to implement
    a low-cost portable device for health monitoring using infrared sensors and in
    order to achieve this objective two modules are used: Acquire and Process. In
    an acquisition, sensor in smart phone is used to acquire the waveform using fingertip
    for 5–6 seconds. This waveform consists of a number of frames and by using the
    concept of sampling and Fast Fourier Transform algorithm, extracts the value of
    sampling rate. In the process, peak detection and smoothing are used to get clear
    results of waveform.


    The first step is pressing the smart phone camera lens for 5–6 seconds, so that
    a reading is obtained as shown in [Figure 4.16](#ch04.xhtml_fig4_16). When fingertip
    is used to cover the camera, the screen of a cell phone is not black, it is actually
    red and the flash is turned ON as proper amount of light can reach the finger
    for accurate measurement.


    ![](images/fig4_16.jpg)


    Figure 4.16 Fingertip placed on the camera lens.


    In this work, videos are recorded with an iPhone 6s and copied into the laptop
    in `.mov` format as this format is compatible with MATLAB tool. Then, this video
    is processed by using a MATLAB tool.


    #### Steps of proposed work:


    The complete steps for proposed application are mentioned in a block diagram as
    shown in [Figure 4.17](#ch04.xhtml_fig4_17).


    ![](images/fig4_17.jpg)


    Figure 4.17 Steps of fingertip application.


    #### Video signal acquisition:


    Bandwidth is the first thing that is required when sampling the signal. Heartbeat
    of a human being between 60 and 200 (beats per minute), but it varies according
    to age, fitness and physical activities. In the proposed work, it is assumed that
    normal can be found between 40 and 230 bpm. With iPhone 6s, videos are recorded
    at 87 frames as shown in [Figure 4.18](#ch04.xhtml_fig4_18).


    ![](images/fig4_18.jpg)


    Figure 4.18 Acquisition of signal in red plane.


    #### Brightness signal computation:


    Signal that is to be processed is brightness over time, but the brightness variation
    is not included in all the pixels the average of all the pixels is taken by using
    single red plane. Red plane consumes all the energy so it provides similar results
    and it is cheaper too.


    #### Band-pass filtering:


    When the signal is acquired, after that a filter is used as: band-pass filter
    that works by disable the frequencies which are exterior to the interest band.
    The benefit of using this filter is that noise factor is reduced in later steps
    of processing and helps in making the results smoother. In the proposed work,
    butter worth filter is used as it is an IIR type filter and with a given bandwidth,
    the order required is much less than compared to FIR filter.


    #### Fast fourier transform:


    There are two types of transforms that are mainly used: Discrete fourier transform
    (DFT) is required to convert the signals from time domain to frequency domain,
    while FFT (Fast Fourier Transform) algorithm is required for recovery of processing
    time. When a comparison between DFT and FFT is done in terms of computational
    complexity of N points, DFT provides a value `O(N²)` and FFT gives the similar
    results having value of `O(N log(N))`.


    #### Sliding window:


    Continuous heart rate estimation is done by using three methods: 1. FFT, 2. peak
    detection and 3. smoothing after each and every 0.5 seconds. The calculation is
    constantly implemented over a window implemented with last 6 seconds of signal
    samples. Basically, in this the window moves over the signal that is why it is
    known as sliding window. This window is moved at every 0.5 seconds because computing
    an estimate at this time does not rise the output’s accuracy of time but time
    resolution is increased in case of reading.

