    它为语音处理提供了准确的信号估计。通过这种方法，可以高效地对语音进行建模 [[24]](#ref-list.xhtml_refchapter_24)。该技术假设所有语音信号都是通过过去信号的组合而成的。在此过程中，最初将信号分割成若干帧，然后每帧将与一个窗相乘，最后输出通过一个自相关参数，如图
    1.24 所示。


    #### 优点

    - 它是一项静态技术 [[22]](#ref-list.xhtml_refchapter_22)。

    - 对于提供语音参数来说，它是一种可靠、准确且稳健的技术。


    #### 缺点

    - 它无法区分具有相似元音相似的单词。

    - 它会产生残差误差作为输出，导致语音质量差。

    - 它的噪声鲁棒性较低 [[23]](#ref-list.xhtml_refchapter_23)。


    ![](img/fig1_24.jpg)


    图 1.24 LPC 技术的步骤。


    #### `RelAtive SpecTrA- Perceptual Linear Prediction` (`RASTA-PLP`)

    该方法用于增强在噪声环境中录制的语音。当与 PLP 结合时，它具有更好的性能。它由 Hynek Hermansky 提出，是一种主要用于信号中嵌入噪声因素，且需要从语音信号中去除缓慢和快速变化信息的技术
    [[25]](#ref-list.xhtml_refchapter_25)。它以稳健的方式工作，这意味着硬件设备记录音频文件的距离没有限制，如图 1.25
    所示。


    #### 优点

    - 它是稳健的。


    #### 缺点

    - 它在纯净语音环境下性能较差。


    ![](img/fig1_25.jpg)


    图 1.25 RASTA-PLP 技术的步骤。


    #### 1.5.2.8 面部热图

    热图是皮肤上发出的热量模式。这些模式由血管的分支形成。使用红外传感器采集图像，以指示从身体不同部位辐射出的热量，如图 1.26 所示。这些图像的集合被称为热图。身体的任何部分都可以识别。该技术利用红外线，在黑暗中高效工作，但它受环境温度的影响。


    ![](img/fig1_26.jpg)


    图 1.26 基于面部热图的检测。


    #### 1.5.2.9 耳朵

    人耳被生物识别技术用于身份验证。特征向量提取是这种识别的主要步骤。已知区别性特征是耳朵的形状和结构，如图 1.27 所示。但预计耳朵的特征对于每个人来说并不是唯一的。特征向量表达基于几何结构、耳朵内部结构以及如
    `PCA`、`ICA` 等代数方法。


    ![](img/fig1_27.jpg)


    图 1.27 基于耳朵的识别。


    #### 1.5.2.10 DNA

    DNA（脱氧核糖核酸）用于用户认证。通过这种方法，为每个个体提供一个唯一的代码，如图 1.28 所示。事实是同卵双胞胎之间存在相同的 DNA 模式。它提供了大数据的安全传输，失败率为
    0%。它的优点是无错误且准确性高，但该技术存在的问题是它的成本极其昂贵。


    ![](img/fig1_28.jpg)


    图 1.28 DNA 的结构。


    人脸和语音识别技术是用于用户识别的最可靠、最准确的技术。该系统基于获取个体的数据，提取这些数据的特征，最后将提取的特征与数据库中存储的实际特征进行比较。这些系统用于增加用户的安全性和便利性。例如，在机场，用户通过在闸机处插入卡并面对摄像头进行注册，然后摄像头将获取其眼睛图像，处理该图像并计算出该图像的代码。最后一步是比较两个代码，一个是实际代码，另一个是计算代码，以验证用户的身份。这意味着每种生物识别技术都有四个参数：


    - 传感器或数据采集

    - 特征提取

    - 匹配

    - 决策控制系统


    在数据采集阶段，从多个来源收集个体的数据。在特征提取阶段，对获取的信息进行处理以提取特征。在匹配参数阶段，提取的特征与数据库中存储的特征进行比较，在最后一步，做出决策以接受或拒绝个体的身份。


    如果我们使用不同的识别方法，则它们的摘要见表 1.2。


    表 1.2 连同准确率的各种生物识别方法


    | 技术 | 准确率 | 应用程序 |

    | --- | --- | --- |

    | 指纹 | 高 | 法律执法 |

    | 人脸 | 高 | 护照 |

    | 虹膜 | 高 | ATM 机 |

    | 签名 | 中 | 金融 |

    | 语音 | 中 | 访问控制 |

    | 击键轨迹 | 低 | 计算机安全 |


    由于计算机的发展，现在已经使用了自动生物识别系统。对任何个体的自动验证都是基于该人的特征。


    #### 1.5.3 优点

    - **通用性**：生物识别技术的主要特征是通用的。大多数人都有手指，细胞中含有 DNA。存在某些例外，没有手指的人无法使用基于指纹的系统等。然而，我们都有
    DNA。这个问题可以通过多重生物识别系统解决。

    - **唯一性**：生物识别系统非常可靠，因为它们在认证过程中是唯一的。特征提取自身体的多个部位，如 DNA、指纹等。但唯一性是最重要的部分。它并非在所有情况下都适用，但在大多数情况下如此。

    - **低绕过性**：生物识别系统非常安全可靠。大多数生物特征必须由授权人员获取，其在授权设备面前是必要的。在某些情况下，人也可以误导安全系统，例如人可以切断手指并尝试让系统接受。但现在的扫描仪能够测量手指血管中的血流。因此，系统无法被欺骗。这就是它非常安全可靠的原因。

    - **可扩展性**：生物识别技术可以构建为多级认证系统。这种多级系统可以包括标准登录、语音登录、指纹登录等许多种。将多种技术整合到单元中可以增加整个系统的安全性。如果整个系统的某层被破解，其他层可以减少突破的可能性。

    - **永久性**：它是从 DNA 获取的一组特征，它是永久的且不会改变。同样的情况适用于指纹。但在指纹的情况下，人可以切断手指，这会改变指纹结构。下一个考虑的永久生物特征是视网膜扫描。


    #### 1.5.4 缺点

    **精确性**：某些生物特征的获取可能非常精确且独特，例如 DNA。尽管 DNA 对我们所有人（同卵双胞胎外）都是唯一的，但频繁提取和分析它非常困难。DNA
    分析的价格并不低。这使得 DNA 被排除在实时应用之外；它所带来的优势并不值得如此。

