    # Blood Pressure Measurement


    Blood pressure is one of the important indicators of body of human being. In early
    19th century, first time BP was measured by using a simple device [[71]](#ref-list.xhtml_refchapter_71).
    After then, there has been a number of advancements in BP measuring devices. These
    figures depict the traditional devices used for measuring blood pressure: [Figure
    4.7](#ch04.xhtml_fig4_7) shows manual sphygmomanometer, which uses a stethoscope
    to measure the heart rate, in [Figure 4.8](#ch04.xhtml_fig4_8), Boso-medicus device
    was there which was a wireless Bluetooth device and in [Figure 4.9](#ch04.xhtml_fig4_9),
    automatic wrist heart beat monitor device is shown that was having large memory
    for the recordings.


    ![](images/fig4_7.jpg)


    Figure 4.7 Manual way to measure the blood pressure.


    ![](images/fig4_8.jpg)


    Figure 4.8 Boso-medicus BP monitor device.


    ![](images/fig4_9.jpg)


    Figure 4.9 Automatic wrist BP monitor device.


    Measurement of BP is measured in `mmHg` units. There are two types of blood pressures:
    systolic and diastolic. Systolic means to measure the maximum pressure pumped
    out by the heart and diastolic means minimum pressure where the heart relaxes.
    Too high or low BP may be dangerous to health.


    [Table 4.1](#ch04.xhtml_table4_1) given above shows the different categories of
    blood pressure. In the present scenario, two new representations of care are emerged
    named as: self-care with home-based services. Advancement in sensor technology
    with network technology has made this task available [128]. The sensor unit is
    made up of an infrared light-emitting diode that transfers an infrared light into
    fingertip and a photodiode which senses the portion of light that is reflected
    back. Heart rate of healthy adult at rest position is around 72 bpm and babies
    is around 120 bpm while older children have around 90 bpm. As the elderly population
    is growing with increasing life expectancy, the number of challenges has been
    brought too many aspects of human life, especially in health monitoring, security
    and comfort level. The care of the elderly could be enhanced through health-monitoring
    system, sensor technologies and communication systems. Elderly/disabled persons
    or women who are living alone can take the benefits of this monitoring system
    and emergency system in order to maintain healthy and safety living [[71]](#ref-list.xhtml_refchapter_71).


    Table 4.1 Categories of blood pressure


    | Category | Systolic | Diastolic |

    | --- | --- | --- |

    | Hypotension | <90 | <60 |

    | Normal | 90–120 | 60–80 |

    | Prehypertension | 121–139 | 81–89 |

    | Stage 1 hypertension | 140–159 | 90–99 |

    | Stage 2 hypertension | >=160 | =100 |


    In previous time, persons are going to the hospital for heart monitoring where
    a cardiologist or officer will examine the patient for any heart diseases. ECG
    machine generally found in big hospitals and requires a specialist to handle the
    machine. Development of a device for heart beat monitoring with low cost using
    infrared sensor will be the foundation.


    Architecture must be developed in a way to collect the data, analyze that data
    and then make it accessible by keeping the physician up to date using important
    signs and values which are checked by the interaction with physician and finally
    emergency call is initiated. This is very important that the technology used must
    be easy and transparent to the user. Thus, a reliable emergency system must be
    there to monitor the condition of the elder and in case of emergency, immediately
    inform the family members about the incident and call the ambulance as well as
    doctor [[72]](#ref-list.xhtml_refchapter_72). So, the aim is to overcome the problems
    of any one’s life as long as possible, so that patients can live an independent
    life in a better way. The main objective is to design and develop a low-cost portable
    heart beat monitor device using infrared sensor. The prototype that is generated
    is a device of low cost which can easily detect and shows the heart rate by counting
    the pulse generated using infrared sensors. In today’s world, doctors, family
    members, friends and neighbors can easily receive health-related messages of their
    patients on their cell phone by using a `MATLAB®` tool and a 3G dongle. Monitoring
    of patients is playing an important role in taking the decision. This system is
    expanding now days by using its advanced features and capability to convert data
    into useful information. It is noticed that an ideal monitoring system should
    be able to gather quality data using sensor based devices, present that data in
    a meaningful way, perform decision support actions using expert knowledge and
    finally take appropriate decision.


    ## Previous Techniques (contents.xhtml_toc2_70)


    ### Phonocardiograph application (contents.xhtml_toc3_71)


    Phonocardiogram records the sound made by heart with a machine named as Phonocardiograph
    as shown in [Figure 4.10](#ch04.xhtml_fig4_10). This is a medical device that
    uses number of techniques such as filters, microphones and amplifiers in order
    to collect heart sound. Integrated microphone is used to record the heart sound
    and then software applications are used to extract the pulse rate. But with this
    device, measurements are not accurate and it is very sensitive to noise. Opening
    and closing of valves in the heart produce sound during contraction and dilation,
    which is normally audible through a stethoscope. These sounds are rhythmic to
    heartbeat and can be sensed using microphones. Normal heart sound is used to determine
    the heart rate.


    ![](images/fig4_10.jpg)


    Figure 4.10 Phonocardiograph device.


    ### Mercury sphygmomanometer (contents.xhtml_toc3_72)


    It is a more iconic device found on every doctor’s table, developed by Stephen
    Hales. This word is a combination of two words: sphygmos which means pulse and
    manometer means pressure meter. This device is used to calculate blood pressure
    as it is possessed of an inflatable cuff to collapse and then releases the artery
    under cuff in a controlled way and a manometer is used to measure the pressure.
    This device requires a cuff, bladder, tubing and rubber bulb as shown in [Figure
    4.11](#ch04.xhtml_fig4_11). All are required in a maintained condition and serviced
    at proper time according to the instruction of the manufacturer. It is a simple
    gravity based unit. When this device is well maintained, it provides absolute
    measurements of blood pressure.


    This device is very delicate and special care should be taken while operating,
    storing or transporting the unit. The advantage of using this device is it is
    very durable, it does not require readjustments but problems with this device
    is it is a bulky device that should be handled carefully to prevent damage. Errors
    may develop when it is not kept vertical.


    ### Automatic digital sphygmomanometer (contents.xhtml_toc3_73)

