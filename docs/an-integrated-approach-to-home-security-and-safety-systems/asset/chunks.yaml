    ## 4.5 Summary


    Everyone knows that the best way to deal with a critical situation is by taking
    a fast response. By using this current application in a way to get rapid alarms
    about critical situations that put the life of an infant at risk. In this proposed
    work, a number of approaches are studied to extract heart beat measurements but
    it is assumed that the suitable way to choose a monitoring device is without touching
    that device. A method of Fingertip application for smart phone users is successfully
    used in this work by comparing the results with previous methods. This method
    gives correct results even with low quality video cameras. This proposed method
    uses built in hardware, i.e., camera, integrated sensors and simple ways of communication
    with each other, e.g., sms, phone, email, etc. It is also examined that red plane
    is sufficient to obtain desired results irrespective of RGB planes and filter
    used is very lightweight, which is suited for devices with less resources. This
    method gives correct results for heart beat measurement. Persons can efficiently
    run this application when they rest at home, outside home e.g. in the park or
    during any activity. This application is suitable for all the users when they
    want to record their heartbeat on a daily basis. In future, some other health
    parameters may be considered like temperature, blood pressure, sweat rate, etc.
    This collected data can be used for simulating in a controlled environment and
    possibility of false alarm can be studied under nonoptimal conditions.


