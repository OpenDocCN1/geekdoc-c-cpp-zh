    `File -> New -> M-File`


    然后输入语句-


    ```

    \begin{array}{l} \begin{array}{l} {A = \left\lbrack {1 2 3; 2 2 4; 2 2 3} \right\rbrack}
    \\ {B = \left\lbrack {1; 1; 2} \right\rbrack;} \end{array} \\ {X = A\backslash
    B} \end{array}

    ```


    然后保存此文件，例如 `test.m`，通过 `File -> save as -> location` 选择合适的位置。通过选择 run 或按下 run
    按钮或按 `F5` 运行文件。


    通过输入运行


    ```mat

    >>test

    ```


    **M-file 函数**：函数是接受输入参数并返回输出参数的程序。每个 M-file 函数都写为 M-file 或简称为 function。


    例如 `function f = factorial (n)`


    ```matlab

    % Factorial (N) 返回 N 的阶乘

    % 计算阶乘值

    F = prod (1:n);

    ```


    在此处，第一行以关键字 `function` 开始。它赋予了函数一个名称和参数数量。


    ### 1.8.2 MATLAB 中的图像处理


    MATLAB 使用工具箱进行图像处理。图像是由二维或三维的像素矩阵组成的。单个像素包含一个或多个数字，代表分配给它的灰度或颜色。彩色图片的尺寸比灰度图片大，因此处理彩色图像需要更多的功率。在图像处理中，第一步是将彩色图像转换为灰度图像，然后对灰度图像进行处理。在此之前，加载图像以开始处理。如果图像是彩色的，则首先将其转换为灰度图像以简化处理。


    对于转换，使用了函数 `rgb2gray` 来更改颜色。图像处理中使用两个函数：`imread` 和 `imshow`。`imread` 用于读取特定格式的图像文件，`imshow`
    函数用于显示图像。最后使用 `imwrite` 函数写入图像，它允许将图像保存为 MATLAB 支持的任何文件，这些文件与 `imread` 支持的文件相同。


    ### 1.8.3 图像的属性


    * **直方图**：显示数据分布的条形图。在图像处理中，它显示图像中存在的像素值数量。可以处理图像以满足规范。从图像创建直方图，使用 `imhist` 函数，`histeq`
    函数用于对比增强，`graythresh` 用于阈值化。

    * **负片**：意味着输入图像的反转。对于 8 位图像，新图像看起来与原始相同。此操作通过 `imadjust` 完成。

    * **傅里叶变换**：频率的作用对于理解图像处理滤波的工作原理非常重要。图像由信号组成，因此信号与频率相关。有两种方法可以了解频率内容的高低。如果图像扫描时灰度值变化较小，说明图像包含低频内容。如果图像扫描时灰度值变化很大，说明图像包含高频内容。傅里叶变换被描述为信号转换为正弦波。对于数字系统，通过指定采样率设计傅里叶变换，这被称为离散傅里叶变换。MATLAB
    使用快速算法进行 DFT 计算，称为 `fft`。

    * **卷积**：图像处理中使用名为卷积的线性滤波方法。它是两个多项式的代数乘。图像是多项式的数组，像素值代表多项式的系数。因此，可以通过卷积将两个图像相乘产生新图像。在
    MATLAB 中 `conv2` 用于两个矩阵的二维卷积。

    * **滤波器**：滤波用于修改图像并用于图像处理。主要有两种滤波器：a) 低通滤波器用于模糊图像的高频区域。这种滤波器用于从图像中去除不需要的噪声。b)
    中值滤波器对去除图像中的噪声很有帮助。它类似于平均滤波器，检查像素及其相邻的像素值并返回这些像素值的平均值。


