    hybrid PICA algorithm is proposed and in voice recognition, the hybrid MFRASTA
    technique is proposed for obtaining the desired results. The combination of face
    + voice recognition technology overcomes the drawbacks of individual techniques.
    Each system will deliver the output in the form of the known or unknown user [[74]](#ref-list.xhtml_refchapter_74).
    The objective of the proposed research work is to implement a highly secure system,
    which can be used in homes, offices, banks, etc.


    [Figure 5.1](#ch05.xhtml_fig5_1) depicts the architecture of the proposed model.
    In this model, an image will be acquired by a camera at first and a face recognition
    process will be applied using image toolbox available in MATLAB. In the current
    scenario, images taken into consideration are `512*512`. In the proposed model,
    four-step procedures for face recognition have been used.


    1. A training set is taken and its preprocessing is done in which images are normalized
    using different methods such as PCA and DCT.

    2. Independent features are extracted by using two face recognition algorithms
    `PCA + ICA` [[75]](#ref-list.xhtml_refchapter_75), [76]](#ref-list.xhtml_refchapter_76).

    3. Feed forward neural network is preferred for classification which classifies
    a given image.

    4. The output of each neural network is combined to classify input image that
    defines the category of that input image to which the person at the door belongs.


    ![](images/fig5_1.jpg)


    Figure 5.1 Proposed model architecture.


    This is a unimodal technique of biometric. If work is done on single authentication
    technique, it does not fulfill our requirements regarding to performance, noise
    problem, etc. So to overcome these issues, multimodal technique of biometric has
    been taken into consideration in the proposed model. After face recognition, steps
    are taken for voice recognition which is as followed:


    * First step is to taken data in training set and apply preprocessing in which
    audio files are recorded by number of methods in `.wav` format.

    * Feature extraction step extracts the features that provide specific information
    from the voice signals. Features have been extracted by using two voice recognition
