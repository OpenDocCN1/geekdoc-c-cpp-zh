    ### 7. 用户界面适配

    泛在计算系统的特点是它们将一组具有微型传感器的设备与掌上设备、笔记本电脑和计算机融合，每种设备的尺寸各异。应用程序需要在系统组织者的角度在异构环境中有效工作，且用户必须对每个设备或组件拥有完全控制权，尽管尺寸有限
    [[8]](#ref-list.xhtml_refchapter_8)。例如，微型设备的屏幕非常小，需要用户导航一系列此类菜单。PDA 的问题在于：它们功能繁多，但由于复杂性高而从未被使用。


    ### 8. 定位感知计算

    与传统计算相比，无处计算的特点是位置的使用。当考虑互联网时，服务器并不知道客户端的位置，但当将嵌入计算引入本地环境中时，交互可以得到增强以改进结果。例如，对附近设备的查询可以通过当前位置自动完成。此外，如果存在相同的查询，在某个特定时间在特定位置访问的信息可以提供给其他人。在此情况下，以会议室为例，白板上将自动提供之前的小组曾使用过的链接
    [[9]](#ref-list.xhtml_refchapter_9)。同样，如果旁边正在进行会议，则不允许低优先级消息传递到笔记本电脑。在大学中，上下文系统是由工具包设计的。


    ### 1.4.4 泛在计算中的问题

    各种问题、它们在各自领域的影响以及相应领域的其他可能性已在此考虑，并以表 1.1 所示的形式列出。


    **表 1.1 不同领域的问题、其影响和可能性**


    | *问题* | *影响* | *其他可能性* |

    | :--- | :--- | :--- |

    | 突然生病、失去意识、从沙发上跌落 | 1. 通过碰撞传感器检测<br>2. 通知医生。 | 高血压、心率、温度 |

    | 如果超过阈值的一段时间内未处于移动状态 | 1. 通过可穿戴传感器检测<br>2. 传感器应发出警报 | 可能会检查人的朝向和移动 |

    | 人周围存在体液 | 1. 检查出血概率 | 可能存在尿液或呕吐物 |

    | 检测到人在一个时间范围内保持不变不变的休息或固定姿态 | 1. 通过姿态传感器检测 | |

    | 心率异常 | 1. 通过可穿戴传感器检测<br>2. 通知医生 | 血压异常 |

    | 药物量已减少 | 1. 使用计数器值<br>2. 在药店订购药物 | 当药物剩余 2 天时，应向医生和患者发送消息 |

    | 如果他几天没有出门 | 1. 通过运动传感器检测<br>2. 发送警报 | 橱柜在几天内是否打开过 |

    | 如果居民在床上时间超过 12 小时 | 1. 通过床垫中的压力传感器检测<br>2. 发送警报 | |

    | 房间温度应在指定范围内（12–30）内，如果超出此范围超过特定时段 | 1. 通过温度传感器检测<br>2. 居民将收到警报 | 窗户的概念（如果在低温下永久性开启，则应发送警报）
    |


    ### 1.4.5 泛在计算的优点

    *   消除了新技术的复杂性。

    *   可以方便地访问信息。

    *   信息的管理既容易、高效又毫不费力。

    *   无形性（智能环境将与用户不可见的网络技术集成）。

    *   决策（通过使用智能环境可以对日常事宜做出更好的选择）。

    *   融合（互联连接的网络技术包含在环境中，因此通过共享可以消除许多问题）。


    ### 1.4.6 泛在计算的缺点

    *   在这种计算情况下，网络连接缓慢。

    *   运营成本非常昂贵。

    *   它不是一种安全的方法，因此需要基于信任的模型来实现更高的安全性。


    ### 1.5 生物识别

    IT 时代的最新进展不断向前。在 ATM 交易、执法、银行业、护照入境和办公室等现实应用中，需要身份验证和安全这两个因素。以前，用于身份验证的方法是登录 ID/密码、智能卡、PIN
    等。但它们存在一些缺点，如 PIN 盗窃、卡片被盗、忘记密码。因此，为了克服这些传统方法的问题，生物识别技术进入了视野。


    生物识别是人类的生理或社会属性，可用于仔细区分个人以允许其访问系统。“。“生物识别”一词由两个单词组成：Bio+metrics，意思是生命测量。许多系统需要身份验证来确定个人的身份。这些方案的主要作用是允许数据传递给有效用户而非伪造者。


    生物识别是通过生理或行为特征识别用户的自动化系统。生理方法是指通过考虑身体形状来识别身份。从 100 多年前开始，最老的特征是一直用于识别目的的指纹。其他例子包括人脸识别、耳朵识别和虹膜识别。行为方法与为了识别目的人的行为有关（图
    1.10）。


    ```

    图 1.10 生物识别架构。

    ```


    ### 1.5.1 生物识别架构

    生物识别系统架构具有以下主要组件 [[11]](#ref-list.xhtml_refchapter_11)：


    1.  `传感器`

    2.  `传感器数据的预处理`

    3.  `特征提取与归一化`

    4.  `模板生成器`

    5.  `模板比较器`

    6.  `识别系统`


    上述生物识别框架部分及其工作原理如下所示：


