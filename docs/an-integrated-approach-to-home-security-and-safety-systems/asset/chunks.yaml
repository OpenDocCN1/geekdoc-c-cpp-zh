    # Chapter 1


    ## Overview of pervasive computing


    DOI: [10.1201/9781003120933-1](https://doi.org/10.1201/9781003120933-1)


    ## 1.1 Overview of Pervasive Computing


    Pervasive computing is the ability to use information part and applications of
    software anytime, at any place by any person. If comparison is done between this
    computing and desktop-type computing, pervasive computing may access data by preferring
    any type of device, in any type of location with any format [[1]](#ref-list.xhtml_refchapter_1).
    Desktop computing suffers mainly with two problems:


    **Limited accessibility:** In this, the network of an organization can’t be accessed
    by all the users of an organization. Maximum number of users can’t afford a desktop
    computer, and it is also not possible for organizations to provide a computer
    to every member.


    **Isolation access:** Isolation property means desktop computer is meant for single
    user use in a particular location. Users try to interact with a number of groups.
    So pervasive computing comes in a role in the way to address these challenges.


    **Definition of pervasive computing**: This computing was defined by Mark Weiser
    developed at research and development in different applications such as mobile
    computing, context-aware computing, and wireless communication. It is the profound
    technology that always disappears [[2]](#ref-list.xhtml_refchapter_2). It is basically
    a technology that works with the collection of small devices integrated into real-life
    objects and provides an omnipresent access for the computations. The aim of ubiquitous
    computing is to layout infrastructure of computing in a way that they combine
    in a seamless manner with the surroundings and become invisible. Mark Weiser defines
    three categories for computations: pads, boards and tabs. As the size of tabs
    was very small for writing notes, screen was very sensitive and awareness of location
    was also an issue. So, the pads came into the role. Their functionality was similar
    to tabs but size was larger in case of pads and it was a notebook. Last is boards,
    size of the board was larger as compared to tabs and pads. Basic property used
    with pads, tabs and boards includes mobile devices, context awareness, wireless
    communication, etc. They incorporate themselves into everyday’s life fabric until
    the devices are equivalent to them. It is also termed as omnipresent computing.
    The aim of this computing is to be everywhere at all the time. To be everywhere,
    this computing will have to support number of devices with changing hardware capabilities.
    For more coverage area, this computing must be compatible with number of types
    of networks. Networks include the GSM (Global System for Mobile communication),
    CDMA (Code Division Multiple Access) network for mobile phone services, wireless
    network technology, Bluetooth, etc. These devices support connections for different
    distance ranges. Bluetooth network provides connection in 10–100 m. Wireless technology
    supports large distances with the help of access points. Mobile phone network
    supports distance up to 35 km. A property called switching between networks will
    need session management. The overview of pervasive computing technique is given
    in [Figure 1.1](#ch01.xhtml_fig1_1).


    ![](images/fig1_1.jpg)


    Figure 1.1 Overview of pervasive computing.


    Pervasive computing can exist in several forms, stemming from the use of laptops
    to household appliances. Some of the technologies that make it possible are microprocessors,
    mobile codes, sensors and the Internet. In short, pervasive computing happens
    every time when people use digital devices to connect to technological platforms.
    The main goal of pervasive computing is to embed computation into an environment
    that allows users to enjoy every day objects’ benefits through information processing.
    Pervasive systems are expected to perform in a broad set of environments with
    different capabilities and resources. Application requirements may change dynamically
    requiring flexible adaptation. Sensing faults appear during their lifetime and
    as users are not expected to have technical skills, the system needs to be self-managing.


    ## 1.2 Distributed Computing


    A distributed system is a collection of independent components located on different
    machines that share messages with each other in order to achieve common goals.
    From 1970s to 1990s, a research has been followed to create a framework that will
    work with interconnection of two computers by a network. Network can be static
    or dynamic, wired or wireless or it can be pervasive. It is a system used to coordinate
    the processes that are performed upon number of computers simultaneously [[3]](#ref-list.xhtml_refchapter_3).
    Medium of communication between the computers is through the messages as shown
    in [Figure 1.2](#ch01.xhtml_fig1_2). This computing is used to solve complex problems
    that can’t be solved on a single computer within a particular time. Software is
    required to coordinate the task in distributed computing, which is a big challenge
    because main task is to divide the elements that can run individually. In distributed
    computing, special software is required to manage the resources of a number of
    computers. This software is run by a main computer unit called as ‘master computer’,
    and other computers are known as ‘slaves’. Master computer is responsible to allocate
    the tasks to slave computers and to combine the results when processing is complete.


    ![](images/fig1_2.jpg)


    Figure 1.2 Overview of distributed computing.


    One drawback of using a master-slave system is the possibility of failure at a
    single point, i.e., server. As it is the only computer that provides necessary
    resources to all the slave computers, if the server goes down, the system will
    not work properly, and another drawback is that if the number of slave computers
    are extremely high, in that case, the resources will be scarce.


    ## 1.3 Mobile Computing


    In the 1990s, when issues emerged in building a distributed system, around then,
    another exploration has been finished with wireless local area networks and laptop
    computers, i.e., mobile computing came into existence. Various standards or elements
    of principles or functions of distributed computing are applied ceaselessly in
    day-to-day life. Yet, a few imperatives are there because of which new technology
    is developed, constraints are trusted with low value, network quality variation,
    robustness of elements, size problems, battery constraints and weight limitations
    [[4]](#ref-list.xhtml_refchapter_4). Mobile computing is a type of computing that
    is used while we are in a moving state. It is a technology that allows transmission
    of data, voice and video via a computer or any other wireless- enabled device
    without having to be connected to a fixed physical link as shown in [Figure 1.3](#ch01.xhtml_fig1_3).
    It requires wireless communication to facilitate mobility of devices in communication
    mode.


    ![](images/fig1_3.jpg)


    Figure 1.3 Overview of mobile computing.

