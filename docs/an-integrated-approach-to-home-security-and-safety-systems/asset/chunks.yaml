    ### 1.8.1 矩阵概念


    MATLAB 环境的基本元素是矩阵。矩阵是由 n 行 m 列组成的二维数组。对矩阵应用了许多操作。第一个例子是输入向量，它是矩阵的一种基本情况。其目标是在
    MATLAB 中创建向量和矩阵。行向量由 1*n 维数组表示，列向量由 m*1 维数组表示，如图图 1.47 所示。


    ![](img/fig1_47.jpg)


    图 1.47 行向量的表示。


    例如，要输入行向量 v，输入


    ```

    >> v = [1481114]

    ```


    同样，列向量创建方式如下：


    ```

    >> u = [1; 4; 8; 11; 14]

    ```


