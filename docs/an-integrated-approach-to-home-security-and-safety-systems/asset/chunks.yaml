    **在 MATLAB 中编程**：由于命令是在命令行窗口中执行的，问题在于这些命令不会被保存且无法多次执行。因此，执行重复命令时使用了不同的概念，即-


    * 创建带有命令列表的文件

    * 保存文件

    * 运行文件


    此部分中定义了两个概念：M-file 脚本和 M-file 函数。


    **M-file 脚本**：当 MATLAB 语句包含在一个序列中，该文件被命名为 M-file 脚本。它的扩展名为 `.m`，因此被称为 M-file。用户创建此文件来存储他们为特定应用程序编写的代码。M-file
    的表示如图图 1.51 所示。考虑三个方程：


    $X + 2y + 3z = 1$

    $2X + 2y + 4z = 1$

    $2X + 2y = 3z = 2$


    ![](img/fig1_51.jpg)


    图 1.51 M-file 的表示。


    求解 $x$？


