    ### 1.4.5 Advantages of pervasive computing

    *   Complexity of new technologies is removed.

    *   Information can be accessed conveniently.

    *   Information is managed easily, efficiently and effortlessly.

    *   Invisibility (smart environment will be integrated with network technologies
    that are invisible to the user).

    *   Decision making (better choices can be made about everyday things by using
    smart environment).

    *   Convergence (interconnected network technology is included in the environment
    so due to sharing number of problems can be eliminated).


    ### 1.4.6 Disadvantages of pervasive computing

    *   Network connection is slow in case of this computing.

    *   Operating cost is highly expensive.

    *   It is not a secure method so trust-based models are required for higher security.


