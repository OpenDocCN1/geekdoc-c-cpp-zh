    **强化训练：** 这是第三种训练方法，其中网络仅接收关于目标答案正确或错误的指示报警。如果可用足够的信息，这种学习可以很好地处理特定问题。


    ![](img/fig1_36.jpg)


    图 1.36 神经网络（ANN）流程图。


    ### 1.7.1.1 网络架构


    在网络架构中，神经元被排列若干层，并在层之间与层内部生成连接。如果存在两个相互连接的权重层，则发现具有隐藏层。神经网络有多种类型，包括矢量量化网络、混合网络、循环网络、RBF
    网络等。


    #### **前馈神经网络**


    这是一种所有数据仅沿单方向传输的网络。在这种情况下有两种选择：输入直接连接到输出，这意味着会有单层权重；或者通过隐藏层将输入连接到输出层。它由单层网络和多层网络组成，如图图
    1.37 [[35]](#ref-list.xhtml_refchapter_35)所示。


    ![](img/fig1_37.jpg)


    图 1.37 前馈神经网络。


    所有神经元的群体行为描述了网络的强大能力，并在此基础上假设这些信息将是否提供所需的输出。反馈不需要循环。它被用于模式识别。


    #### **单层网络模型**


    这意味着在单层形式中，每个输入层都直接连接到输出层，但反之不然。它也被称为无环网络。在这种情况下，输入可能全连接连接到输出单元，如图图 1.38 所示。


    ![](img/fig1_38.jpg)


    图 1.38 单层前馈神经网络。


    #### **多层网络模型**


    在这种模型中，隐藏单元的数量多于一个，也可以是一个（其中节点被视为隐藏节点）。这种处理方式是首先将信息从源节点发送到第一个隐藏节点，第二层的输出将作为第三层的输入，依此类推。接下来的图
    1.39 显示了多层网络（图 1.39）：


    ![](img/fig1_39.jpg)


    图 1.39 多层前馈神经网络。


    #### **循环网络**


    这是神经网络中最简单的一种架构形式。在这种情况下，输入层的所有单元都连接到输出层的所有其他单元，每个单元都可以同时作为输入和输出。它是那种隐藏层数量大于或等于一个且带有反馈循环的网络。在这种情况下，反馈意味着神经元的输出将返回到其输入，如图图
    1.40 所示。


    ![](img/fig1_40.jpg)


    图 1.40 循环神经网络。


    #### **霍普菲德神经网络**


    这种网络主要用于模式识别，为此使用特殊算法对网络进行训练。它基于循环网络的概念。由一组神经元组成，每个神经元代表差异图像的一个像素。它还与邻域的所有神经元连接，如图图
    1.41 所示。


    ![](img/fig1_41.jpg)


    图 1.41 霍普菲德神经网络。


    #### **径基函数网络**


    正如前馈神经网络的定义，它由输入层、输出层和隐藏层组成，因此如果隐藏层依赖于径向函数的概念，则被称为 RBF 网络，如图图 1.42 所示。其中使用了高斯点，但其激活函数比前馈神经网络（FFNN）复杂。它也被用于模式识别
    [[36]](#ref-list.xhtml_refchapter_36)。


    ![](img/fig1_42.jpg)


    图 1.42 RBF 神经网络。


    ## 1.8 MATLAB 2012a


    MATLAB 代表矩阵实验室有两个项目 LINPACK 和 EISPACK 用于为矩阵软件提供简单的处理。LINPACK 意味着线性系统包，EISPACK
    意味着特征系统包。


