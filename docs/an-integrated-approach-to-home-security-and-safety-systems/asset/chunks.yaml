    ## 2.6 总结


    提出了一种名为 `PICA` 的新技术，通过融合两种现有的脸部识别算法 `PICA` 进行人体身份识别，与单一识别算法相比，它可以显著提高识别率。所提系统使用了
    `PCA` 与独立成分分析 (`ICA`) 的混合组合来提取面部特征，并使用反向传播馈神经网络来识别人脸。实验结果显示，混合方法在特征提取中采用了 `PCA`
    和 `ICA` 的特征，并为人脸识别提供了卓越的性能。在数据集上进行了大量实验以计算各种特征的性能。未来，在采集和存储个人图像时可能需要考虑安全措施，人脸识别可以应用于
    iPhone 以解锁手机。面部解锁是一个允许使用脸纹解锁手机的功能，所提混合模型中也可以嵌入集成传感器，以提供安全方便的环境。


    # 第 3 章


    ## 用于个人家庭安全的混合 MFRASTA 语音识别技术


    DOI: [10.1201/9781003120933-3](https://doi.org/10.1201/9781003120933-3)


    ### 3.1 语音识别引言


    '
- fmt: '

    The research and development process of voice recognition technology started in
    the early 1970s with the help of researchers at IBM Corporation and Carnegie Mellon
    University and first automatic speech recognition was used in 1952. Humans can
    also communicate with machines through voice but that is a very slow process.
    So, automatic voice recognition comes there that can be operated by human commands
    or instructions. By using this technique, the person’s voice can be verified in
    order to find his identity which will be used in providing access to applications
    like database services, voice mail, telecommunications (it means in cell phones
    where a person can dial a number by just speaking the name of the person he wants
    to call), etc. Voice recognition problem is solved by understanding its complexity.
    There are number of areas where automatic voice recognition has been applied:
    healthcare, personal computing, industries, etc. This concept is used in automated
    phone systems, which provide assistance for directing the call to the caller with
    the correct department. For example, if a command is there that “press number
    3 for support” and a person says 3, it means concept of voice recognition is used
    here. Another example is of Google voice that allows a person to ask and search
    questions from laptop, ipad or tablet and digital assistant is also a part of
    voice recognition, which helps the users to interact with digital assistants that
    help in answering the questions by Siri, Amazon Echo, etc. For proper working
    of voice recognition, a computer is required with a soundcard, headset or microphone.
    There are four parameters that are considered for the operation of the voice recognition
    system: it must have encoding form and number of utterances that it will recognize,
    at the time of recognition there must be a type of a pattern matching algorithm
    which compares the representation of the input utterance with all the utterances
    in the vocabulary, compares input utterance with vocabulary by using any algorithm
    and last is an interface which operates the recognition system. There exist a
    number of other techniques for biometric authentication named as face, signature,
    iris recognition, etc. But voice recognition technique is selected on the basis
    of a criterion: accessibility, distinctiveness, robustness, etc. Distinctiveness
    is used to measure the differences in the patterns among the individuals, robustness
    is no repeatable pattern and cannot be subjected to large changes and accessibility
    defines the easiness for presentation of data to sensor device [[60]](#ref-list.xhtml_refchapter_60).
    Recognition through a voice is very economical as the equipments for collecting
    speech samples are cheaply and easily available. [Figure 3.1](#ch03.xhtml_fig3_1)
    shows the general diagram of speech recognition system where input speech goes
    to acoustic model block in which a transformation takes place from speech to statistical
    representation of vectors. Then, a word is searched with number of words stored
    in the database and provides output of recognized utterance.


    ![](images/fig3_1.jpg)


    Figure 3.1 General diagram of speech recognition system.


    This voice recognition system mainly consists of two steps:


    * Feature extraction

    * Feature matching


    Extraction of features is the main step used as a front end. It acts like a heart
    of the system. It extracts little quantity of data from the words which is then
    used later to express each person. Features are high level representations as
    compared to raw data representations. It compresses the magnitude of words without
    causing any type of harm to the speech signal power. Below is the feature extraction
    diagram in [Figure 3.2](#ch03.xhtml_fig3_2), which shows the basic steps require
    for extracting the features:


    ![](images/fig3_2.jpg)


    Figure 3.2 Steps for feature extraction.


    Matching of features is used to determine unknown identity by comparing the features
    that have been extracted with a complete set of input samples. It means this system
    works on two phases: training phase and testing phase.


    In training phase, it corresponds to the procedure of learning from labeled data
    and each individual will provide samples of their own voice in a way to train
    the system for another processing as mentioned in [Figure 3.3](#ch03.xhtml_fig3_3).


    ![](images/fig3_3.jpg)


    Figure 3.3 Training phase for extraction of voice features.


    In the testing phase, when a person’s voice is tested, input voice is matched
    with all stored samples and on the basis of that, a decision is taken. This process
    is shown in [Figure 3.4](#ch03.xhtml_fig3_4).


    ![](images/fig3_4.jpg)


    Figure 3.4 Testing phase for feature matching.


    Basic terms used in this system are:


    * **Utterance:** It is defined as the word spoken that represents some meaningful
    information to the computer system. It may be an individual word or set of words
    and it can be a sentence. They are then sent to the speech engine for further
    processing.

    * **Vocabulary:** It is a group of words that are recognized by voice recognition
    system. It is obvious that small vocabularies are easy to recognize while large
    vocabularies are difficult to recognize.

    * **Accuracy:** It is defined as the ability of a recognizer that how correctly
    it recognizes the words. It is used to identify an utterance.


    Voice recognition system can be classified in a way as how many spoken words are
    recognized:


    * **Isolated word:** It needs each and every word to have silence on adjacent
    parts of the window. At a time, it works on an individual word: it means a pause
    is required between the words. It is the simplest form of voice recognition as
    the end the points are easier to find.

    * **Connected words:** It is same as isolated word, but it allows separate words
    to run together with a minimum time gap.

    * **Continuous speech:** It is not separated by pauses; it is based on the voice
    where words are combined together. In this, the person speaks in a natural way,
    and it is difficult to recognize because it needs methods to define boundaries
    of words. It can be used in voice repertory dialler where eyes free, hand-free
    dialling is possible.


    There are a number of techniques that are used to analyze a voice waveform:


    * **Waveform:** Voice signal is a sequence of pressure variations in the part
    between listener and the sound source. In this graph, the horizontal axis is the
    axis for time parameter from left to right, and the curve indicates the variation
    of pressure parameter in the signal.

    * **Pitch:** Voice is a process consisting of two parts: sound source and filtering.
    It directs to take the fundamental frequency of the sound when the ultimate voice
    utterance is analyzed.

    * **Spectrum:** It gives a representation of a frequency distribution with the
    amplitude of a moment in time.

    * **Cepstrum:** This technique is used for speech analysis, it is based on the
    spectral view of the signal.


    There are a lot of advancements in voice recognition technology. Previous methods
    were well defined under all conditions, but they were not providing good recognition
    rate results if the single feature extraction technique was used in voice recognition,
    so there is a need for improvement. The basic aim of the proposed research work
    is to generate a system that will provide high recognition rate with high accuracy
    and efficiency in order to provide security for an individual who is living alone
    at home. To achieve this objective, a hybrid `MFRASTA` algorithm for feature extraction
    is implemented that gives useful results than existing ones. The hybrid algorithm
    is implemented using `MATLAB` tool.


    ## [3.2 Challenges of Voice Recognition System](#contents.xhtml_toc2_54)

