  trans: '

    在第 1 章中，讨论并探讨了泛在计算的含义、挑战、泛在计算的应用、泛在计算涉及的问题（如用户突然生病、心率异常、从沙发上跌落、血压异常等）及其影响 [[93]](#ref-list.xhtml_refchapter_93)。本章进一步定义了生物识别技术概念、生物识别技术数量、人脸识别系统中基本类型及其优缺点、其应用、语音识别系统的基本结构、其应用以及两个阶段：与人相关系统和与人无关系统。随后，定义了基于传感器的技术、不同类型的传感器、用于健康监测的不同技术类型以及为个人提供安全的传感器用途
    [[94]](#ref-list.xhtml_refchapter_94)， [[95]](#ref-list.xhtml_refchapter_95)。还阐述了神经网络的一些基本概念、类型、应用、用途次数以及如何将其用于人脸和语音识别。最后，解释了
    `MATLAB` 的含义、所有类型的版本以及用于人脸和语音技术的工具数量。针对了人脸识别和语音识别的问题与挑战，以得出本论文的动机。本章定义了本研究工作的目标。


    显然，在人脸识别方面，定义了用于特征提取的不同算法，并讨论了用于识别的神经网络技术数量。定义了人脸识别任务中使用的不同类型的人脸识别方法 [[96]](#ref-list.xhtml_refchapter_96)，
    [[97]](#ref-list.xhtml_refchapter_97)。最后，讨论了提供高性能的降维技术。为了识别未知用户，需要进行大量的计算 [[98]](#ref-list.xhtml_refchapter_98)，
    [[99]](#ref-list.xhtml_refchapter_99)。接下来是语音识别系统，它描述了所有类型的识别技术、开发快速有效算法的方法以及如何处理噪声环境进行了深入的探索和实现
    [[100]](#ref-list.xhtml_refchapter_100)， [[101]](#ref-list.xhtml_refchapter_101)。利用不同的神经网络技术讨论了语音的不同类型特征
    [[102]](#ref-list.xhtml_refchapter_102)， [[103]](#ref-list.xhtml_refchapter_103)。在这种基于传感器的应用中，讨论了以往使用的各种方法，并为用户的健康监测定义了若干传感器，以及用于向用户发送消息的技术
    [[104]](#ref-list.xhtml_refchapter_104)， [[105]](#ref-list.xhtml_refchapter_105)。还介绍了各种研究人员在传统传感器系统中定义的之前使用的所有健康监测方法的简述。在这项研究工作中，重点在于通过多模态生物识别技术和基于传感器的应用为独居人员提供安全保障。


    在第 2 章中，使用混合 `PICA` 算法定义了脸识别过程。对于特征提取，描述了 `PCA + ICA` 的组合。`PCA` 的降维特征有助于消除冗余，从而提高人脸识别系统的性能
    [[106]](#ref-list.xhtml_refchapter_106)。与单一 `PCA` 和单一 `ICA` 技术相比，混合 `PICA` 算法有助于获得更高的识别率。单一方法在姿态、光照条件变化时有时会做出错误决策，但提出的算法在所有条件下都能提供高准确度。反向传播神经网络是使用该混合算法进行识别的最优网络。完整实现使用
    `MATLAB` 中的图像处理工具箱完成。最后，通过带有 `MATLAB` 工具的 `3G` 狗器向家庭成员的手机发送消息的过程。在所提出的工作中，共提取了
    30 个特征，并从训练数据库中提取了 41 张维度为 `512*512` 的图像。


    在第 3 章中，描述了语音识别过程。特征提取使用了 `MFCC` 和 `RASTA-PLP` 技术`RASTA-PLP` 即使在噪声环境中也能增强识别系统的性能
    [[107]](#ref-list.xhtml_refchapter_107)。提出了一种名为 `MFRASTA` 的混合算法，该算法显示出识别率的显著提高。此前，语音识别系统使用了多种语音技术组合
    [[108]](#ref-list.xhtml_refchapter_108)，并在语音识别技术中使用了多种神经网络技术，但有时它们会做出错误决策并给出不准确的结果，而提出的方法优于它们，以以准确的结果实现最高的识别率。该混合技术针对说话风格、频率和音调定义了文本相关和文本非相关的方法
    [[109]](#ref-list.xhtml_refchapter_109)， [[110]](#ref-list.xhtml_refchapter_110)。数据库包含约
    41 个音频文件（`.wav` 格式），用于在不同条件下评估语音识别系统的熟练度。实验结果地表明，混合工作的性能大于单一的特征提取技术。整个系统在 `MATLAB`
    工具中带有图形用户界面实现，最后这项工作经过多次测试，被证明非常可靠。


    第 4 章描述了一种基于指尖传感器的心率监测应用。通过光学传感器通过指尖检测血流，然后计算通过传感器获取的信号亮度。在所有以往使用的技术中，心率是通过通过将拇指置在动脉脉动上，计时并计算
    30 秒内的脉搏考虑的 [[111]](#ref-list.xhtml_refchapter_111)。获取的心率然后乘以 2，这种方法看起来非常简单，但在高率上存在误差。因此，为了克服这些问题，提出并实现了一种新的应用，通过指尖测量心率。本研究工作的基本目标是实现一种任何人随地随地使用的低成本便携设备。它还旨在通过识别现有技术的缺点来提高所提应用的准确性。所提出的应用在
    `MATLAB` 中实现。其主要优势是非专业人士可以在家里以安全方便的方式使用该应用进行心率测量。该方法即使使用集成在移动设备中的低端摄像头也能提供准确的结果。


    在第 5 章中，准备了最终的 GUI，包括人脸识别、语音识别、相似性指数和体征监测。所有步骤均用于识别门口人员并对家庭个人进行健康监测。整个步骤在 `MATLAB`
    中实现。人脸识别通过 `PICA` 算法完成，语音识别通过 `MFRASTA` 算法完成。体征监测通过指尖应用进行验证。最后，根据需要向所有不同类别的成员发送消息。


    这项工作的成果汇总如下：


    *   与人脸识别系统中单一 `PCA` 和单一 `ICA` 相比，由于实施了混合 `PICA` 算法，识别率提高了 99.5%。


