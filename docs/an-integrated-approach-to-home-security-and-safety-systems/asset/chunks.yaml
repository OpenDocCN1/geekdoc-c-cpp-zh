    ### **泄漏减少**：当时间信号是无限时，DFT 的表现卓越。长度为 `N` 的有限时间信号与其对应的长度为 `N` 的矩形信号相乘是相关的。这种结果会导致无限长度的时间信号频谱演变，从而产生泄漏；为了减少这种泄漏，使用了一个边界为零的函数。当输入信号乘以此函数时，所得边界值将为零。为此，使用了汉宁窗（Hann
    window），因为它提供了良好的分辨率和泄露抑制能力。


    ### **峰值检测**：从当前滑动窗口的内容中测量出 FFT 后，使用 MATLAB 工具中名为 `find peaks` 的函数计算感兴趣带内的峰值值。


    ### **平滑**：为了使心跳读数的信号更加平滑，滑动窗口与多个具有一系列同相色调的相位进行协调，最后通过收集与最大幅值相关的频率相关性来获取平滑的心率。


    ## 4.4 结果


    所提系统的行为通过基本参数进行评估，这些参数是使用 iPhone 6s 摄像头进行测量，并在个人身上进行了实验。此步骤用于监测用户的健康参数。此处，浏览包含指尖印象的视频以计算采样率，如图
    4.19 和图 4.20 所示。


    ![](img/fig4_19.jpg)


    图 4.19 通过指尖印象进行健康监测。


    ![](img/fig4_20.jpg)


    图 4.20 采样率的计算。


    图 4.21 提供了心跳计算的图表。它显示数值等于 58 bpm。这意味着心跳在正常范围内。如果数值偏离指定值，则将向所有家庭成员发送消息。


    ![](img/fig4_21.jpg)


    图 4.21 心跳监测图表。


    然后，消息将通过注册在加密狗上的号码发送给家庭成员。如果心率值高于或低于阈值，在那种情况下，将发送紧急消息 [[73]](#ref-list.xhtml_refchapter_73)。图
    4.22 显示了使用 MATLAB 工具和 iPhone 6s 接收到的手机消息截图。当将所提工作与之前使用家庭护理设备的工作相比时，结果在误接受率和准确性方面表现更好。使用这种所提方法的优势是，即使使用捕获率降低的低因素视频摄像头也能获得准确的结果，它耗电少，可以定期使用，并且计算成本低。它具有抗噪能力，即使在不确定的条件下也能给出理想的结果。


    ![](img/fig4_22.jpg)


    图 4.22 手机上显示的短信截图。


    ## 4.5 总结


    人人都知道处理紧急情况的最佳方法是采取快速响应。通过使用当前的应用程序，可以对可能危及婴儿生命的紧急情况获得快速警报。在所提工作中，研究了多种提取心跳测量值的方法，但假设选择合适监测设备的方法是不接触该设备。通过将结果与之前的方法进行比较，这项工作成功地使用了一种适用于智能手机用户的指尖应用方法。这种方法即使使用低质量视频摄像头也能给出正确的结果。所提方法使用内置硬件（即摄像头）、集成传感器以及简单的相互通信方式（例如短信、电话、电子邮件等）。经检查，红色平面对于无论
    RGB 平面如何都能获得所需的结果，且使用的滤波器非常轻量，适用于资源较少的设备。该方法为心跳测量提供了正确的结果。人员可以在在家休息、外出（例如在公园）或进行任何活动期间高效地运行此应用程序。该应用程序适用于所有想要每天记录心率的用户。未来，可能还会考虑温度、血压、出汗率等其他健康参数。这些收集的数据可以用于受控环境中的模拟，并研究在非理想条件下发生误报的可能性。


    # 第 5 章


    ## 结合基于传感器的指尖应用用于个人家庭安全的混合 PICA 和 MFRASTA 技术


    DOI: [10.1201/9781003120933-5](https://doi.org/10.1201/9781003120933-5)


    ## 5.1 人脸和语音识别流程


    当运行此应用程序时，首先开始人脸识别过程。在人脸识别中，提出了混合 PICA 算法；在语音识别中，提出了混合 MFRASTA 技术以获得所需的结果。人脸+语音识别技术的结合克服了单一技术的缺点。每个系统将以已知或未知用户的形式交付输出
    [[74]](#ref-list.xhtml_refchapter_74)。所提研究工作的目标是实现一个高度安全的系统，该系统可用于家庭、办公室、银行等。


    图 5.1 描绘了所提模型的架构。在该模型中，首先通过摄像头获取图像，然后使用 MATLAB 中提供的图像工具箱应用人脸识别过程。在当前场景下，考虑的图像尺寸为
    `512*512`。在所提模型中，使用了四步人脸识别程序。


    1. 采用训练集并进行预处理，其中使用 PCA 等方法对图像进行归一化。

    2. 使用两种人脸识别算法 `PCA + ICA` 提取独立特征 [[75]](#ref-list.xhtml_refchapter_75), [76]](#ref-list.xhtml_refchapter_76)。

    3. 优先使用馈神经网络进行分类，对给定的图像进行分类。

    4. 结合每个神经网络的输出以对输入图像进行分类，从而确定门口人员所属的图像类别。


    ![](img/fig5_1.jpg)


    图 5.1 所提模型架构。


    这是一种单模态生物识别技术。如果对单一认证技术进行工作，无法满足我们在性能、噪声问题等方面的要求。因此，为了解决这些问题，所提模型采用了多模态生物识别技术。在人脸识别之后，采取的语音识别步骤如下：


    * 第一步是采用训练集数据并应用预处理，其中以 `.wav` 格式录制音频文件。

    * 特征提取步骤从语音信号中提取提供特定信息的特征。提取使用了两种语音识别算法 `MFCC 和 RASTA-PLP` [[77]](#ref-list.xhtml_refchapter_77),
    [78]](#ref-list.xhtml_refchapter_78)。

    * 结合所有输出并对输入语音进行分类为已知或未知。

    * 发送消息以定义每个输入语音的类别。


    为了个人的高度安全，这里考虑了四种场景。


    1. 当人脸识别和语音识别均成功时


