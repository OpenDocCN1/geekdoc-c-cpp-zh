  trans: '


    为了让家庭网络变得更加智能化，使用了具有高处理能力和网络能力的智能设备。网络能力意味着传感器的集合，它们可以收集数据并传输感应数据，如温度、湿度、光照等。在这里，“光照”意味着根据家中的光线自动移动窗帘，“温度”则意味着提供智能空调系统。房屋主希望推广他们的家居以支持这些新技术。这是当前人类计算生活方式的自然延伸。打造智能家居是一种利用新的自动化技术设计的方法，通过使用智能厨房、照明系统等提供设施，以方式增强个人的安全性、保障等，并维持独立生活。开发智能家居的基本且重要的功能是了解人的作息，并根据该作息进行适应。该技术可以使用许多传感器，如`RFID`、`温度传感器`、`压力传感器`、`门传感器`等。用于无线通信的技术有`红外`、`射频`、`ZigBee`、`蓝牙`等。`温度传感器`用于厨房控制烤箱的热量。为了维持人的站立、行走等活动以及跌倒等异常活动，可以通过`冲击传感器`、`加速度计`等许多传感器检测血流。`光传感器`允许家中的灯光自动开关。`光电传感器`允许系统在黑暗环境中运行。`紧急报警器`可用于智能家居，应对用户需要立即帮助的紧急情况。通过使用此设备，信息会自动发送给护理人员。个人护理对于为独居在家的个人提供安全保障是一个重要因素。因此，为了实现这一目标，首先通过三个模块对人进行识别：`脸识别`、`语音识别`和`相似性索引`。最初，当人来并敲门时，需要识别该人的脸部，如果人脸识别正确，则进入下一个模块，即`语音识别`。如果该人的声音也被识别，那么家中独居者将为门门口的个人提供访问权限。但是，如果任何一个模块未被识别：情况下只使用第三个模块，即`相似性索引`。它将检查门口人员声音与数据库中存储声音相匹配的百分比。如果相似性大于或等于`75%`，则认为用户已被识别，否则声明为未知用户。最后一个模块是持续监测家中人员的健康参数。个人用户在得知自己可以联系他们认识的人，并在紧急情况下使用`MATLAB®`工具和`智能手机`发送信息后，会感到更加安全。在当今世界，用户没有时间反复看医生，因此患者需要现场监测并通知他们的护理人员。人体健康监测正成为传感器网络的一个重要应用。此前，将许多无线传感器放置在个人人体上，监测温度、血压和心率等健康参数。这些传感器设备非常微小、轻便且易于携带。


    智能家居技术被证明对于大中独居的老人或职场女性以及在家独立生活的残障人士非常有用。为了以更健康、安全的方式在家里生活，老年/残障人士或女性可以利用智能家居技术中的最新功能，如图
    1.32 所示的监控系统、跌倒检测或紧急系统等。


    ![](img/fig1_32.jpg)


    图 1.32 活动监控系统。


    必须有一个如图 1.33 所示的可靠紧急系统，用于监测人的状况，并在紧急情况下立即联系医生和救护车，并通知家庭成员 [[32]](#ref-list.xhtml_refchapter_32)。因此，目标是为所有在家里独立生活的人提供舒适的环境。


    ![](img/fig1_33.jpg)


    图 1.33 可靠的紧急系统。


    ### 1.7.1 神经网络


    人工神经网络（ANNs）的结构类似于人类大脑。成年人脑的重量约为 1.5 公斤，体积为 1260 立方厘米。大脑由 2000 亿神经元组成，通过 25 万亿突触、胶质细胞和血管连接。神经元可以分为三部分：细胞体（soma）、树突和轴突，如图
    1.34 所示。


    ![](img/fig1_34.jpg)


    图 1.34 生物神经元的结构。


    每个树突都包含细线，它们会接收来自周围神经元的信号。树突的每个分支在突触的帮助下连接到单个神经元上 [[33]](#ref-list.xhtml_refchapter_33)。神经网络用于发现数据中具有特定关系的模式。


    图 1.35 显示了输入神经元和输出神经元，它们之间有相互连接的权重。此图的第一步借助输入节点以数值表达式的形式获取数据或信息。神经网络是一种从生物神经系统中汲取灵感并处理信息的范式。


    ![](img/fig1_35.jpg)


    图 1.35 ANN 的结构。


    模式识别情况下的 ANN 流程图如图 1.36](#ch01.xhtml_fig1_36)所示。


    #### 神经网络基础


    - **处理单元**：神经网络系统由许多代表大脑神经元的处理单元组成。这些单元被分为不同的组，如接收数据的输入单元、处理和转换输入数据的隐藏单元以及表示最终决策的输出单元
    [[34]](#ref-list.xhtml_refchapter_34)。

    - **权重**：神经网络中所有的处理单元都以某种方式连接。每个连接都有一个权重值。来自神经元的输入乘以发送数据的连接权重，然后将输出值发送到网络的激活函数。如果计算值超过激活函数的阈值，则神经元被激活，否则处于非激活状态。

    - **计算方法**：该方法用于通过激活函数来确定正确的输出。在此情况下，神经网络使用阈值逻辑单元执行计算。它获取神经元的输入值并求和，最后使用激活函数进行计算。

    - **监督训练**：这是第一种训练方法，为网络提供一系列输入，然后将目标与预期响应进行比较，或者给出针对给定输入的预期输出指令。这种方法的主要问题在于误差产生。理想情况是生成的输出与预期输出之间的差异越小，例如`Hebb
    网`、`模式关联记忆`、`反向传播网络`和`反传播网络`。

    - **无监督训练或自适应训练**：另一种训练方法称为无监督训练，其中为网络提供输入，但未知预期的目标。输入数据项的分组由系统维护。这也被称为自组织或自适应方法，例如`自组织映射`、`自适应共振理论`等。


    '
- fmt: '

    **Reinforcement training:** This is the third type of training method in which
    a network is only presented with an alarm of indication of whether the target
    answer is right or wrong. If sufficient information is available, this learning
    readily handles a specific problem.


    ![](images/fig1_36.jpg)


    Figure 1.36 Flowchart of ANN.


    ### 1.7.1.1 Network architectures


    In the architecture of network, the neurons are arranged into number of layers
    and connections are generated between and within the layers. If two layers of
    interconnected weights are present, then it is found to have hidden layers, there
    are number of types of neural networks including vector quantization, hybrid networks,
    recurrent network, RBF networks, etc.


    #### **Feedforward neural network**


    It is a network in which all the data will travel only in single direction. In
    this, there are two options: inputs are directly connected to outputs, it means
    there will be a single layer of weights or inputs are connected to the output
    layers using hidden layers. It consists of single-layer network as well as multilayer
    network as shown in [Figure 1.37](#ch01.xhtml_fig1_37) [[35]](#ref-list.xhtml_refchapter_35).


    ![](images/fig1_37.jpg)


    Figure 1.37 Feed forward neural networks.


    Group behavior of all the neurons will describe the power of a network and on
    the basis of that it is assumed that this information will provide required output
    or not. There is no looping required for feedback. It is used for recognition
    of patterns.


    #### **Single-layer network model**


    It means in single form where every input layer is directly joined to output layer
    but not in opposite form. It is also called as acyclic network. In this, input
    may be connected fully to the output units as shown in [Figure 1.38](#ch01.xhtml_fig1_38).


    ![](images/fig1_38.jpg)


    Figure 1.38 Single-layer feed forward NN.


    #### **Multilayer network model**


    In this, the number of hidden units is more than one or it can be one where nodes
    are considered as hidden nodes. In this processing is done by first send the information
    from source node to first hidden node and second layer output will be used as
    a input to third layer and so on. The following picture 1.39 shows a multilayer
    network ([Figure 1.39](#ch01.xhtml_fig1_39)):


    ![](images/fig1_39.jpg)


    Figure 1.39 Multilayer feed forward NN.


    #### **Recurrent network**


    It is the simplest form of architecture in neural network. In this, all units
    of input layer are connected to all other units of output layer and every unit
    can act as both input as well as an output. It is that type of network in which
    number of hidden layers is greater than or equal to one with a feedback loop.
    In this, feedback means neurons output will be back to its input as shown in [Figure
    1.40](#ch01.xhtml_fig1_40).


    ![](images/fig1_40.jpg)


    Figure 1.40 Recurrent neural network.


    #### **Hopfield neural network**


    This network is mainly used to recognize patterns and for that the network is
    trained with special algorithms. It is based on the concept of recurrent network.
    It consists of a set of neurons where each neuron represents a pixel of the difference
    image. It is also connected to all the neurons in the neighborhood as shown in
    [Figure 1.41](#ch01.xhtml_fig1_41).


    ![](images/fig1_41.jpg)


    Figure 1.41 Hopfield neural network.


    #### **Radial basis function network**


    As feedforward neural network is defined that it consists of input, output and
    hidden layer so in that if hidden layer depends on the concept of radial function
    it is called as RBF network, as shown in [Figure 1.42](#ch01.xhtml_fig1_42). Gaussian
    point is used in this but its activation function is more complex than FFNN. It
    is also used for recognition of patterns [[36]](#ref-list.xhtml_refchapter_36).


    ![](images/fig1_42.jpg)


    Figure 1.42 RBF neural network.


    ## 1.8 MATLAB 2012a


    MATLAB stands for Matrix Laboratory. There are two projects LINPACK and EISPACK
    used to provide simple process to matrix software. LINPACK means linear system
    package, and EISPACK means Eigen system package.


    MATLAB has a number of built in routines that enables a wide variety of calculations
    and number of commands used for graphics that makes the availability of visualization
    results. A term is named as toolbox; it means number of applications collected
    in packages. There are different types of toolboxes used for simulation, signal
    processing and control theory with some fields engineering technology.


    When a person logs in account, he/she enters in MATLAB tool by double clicking
    on shortcut icon of MATLAB on desktop. A window named as MATLAB desktop shows
    when MATLAB is started and this window includes other windows like command window,
    start button, workspace, command history, current directory and help button. When
    MATLAB started, the screen is like as shown in [Figure 1.43](#ch01.xhtml_fig1_43).
    The tools and documents can be customized according to the needs of the users.
    Command Prompt (`>>`) is available in the command window [[37]](#ref-list.xhtml_refchapter_37).


    ![](images/fig1_43.jpg)


    Figure 1.43 Initial screen of MATLAB.


    For example, MATLAB is used as a calculator: A simple expression can be evaluated,
    e.g.,


    ```

    >>

    ```


    If output is not specified, the result is store in variable.


    ```

    >>

    ```


    Then the result is in variable.


    ```

    >>

    ```


    MATLAB also helps in adding axis labels. If x and y labels are added in above
    plot, it is by using these commands:


    ```

    xlabel(''0.2\pi'')

    ```


    ```

    ylabel(''Sine of x'')

    ```


    ```

    title(''Plot of Sine Function'')

    ```


    And graph is shown as in [Figure 1.45](#ch01.xhtml_fig1_45). The graph of Sine
    Function with Titles is shown in [Figure 1.46](#ch01.xhtml_fig1_46).


    ![](images/fig1_45.jpg)


    Figure 1.45 Plot for sine function.


    ![](images/fig1_46.jpg)


    Figure 1.46 Plot for sine function with titles.


    ### 1.8.1 Matrix concept


    The basic element of the MATLAB environment is matrices. A matrix is a two-dimensional
    array consisting of n rows and m columns. A number of operations are applied on
    matrices. First example is to enter a vector that is a basic case of a matrix.
    Its aim is to create a vector and matrices in MATLAB. Row vector is represented
    by 1*n dimension array, and column vector is represented by m*1 dimension array,
    as shown in [Figure 1.47](#ch01.xhtml_fig1_47).


    ![](images/fig1_47.jpg)


    Figure 1.47 Representation of row vector.


    For example, to enter a row vector v, type


    ```

    >> v = [1481114]

    ```


    Same as, column vectors are created in a way like, as shown in:


    ```

    >> u = [1; 4; 8; 11; 14]

    ```

