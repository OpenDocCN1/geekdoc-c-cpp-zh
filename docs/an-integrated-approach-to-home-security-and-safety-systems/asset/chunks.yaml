  trans: "\n\n基于整体的方法除了局部或某些面部特征外，还使用了整个图像的全局表示。这种方法再次分为两个部分：统计学和人工智能。在统计学方法中，图像被表示为二维数组，其使用的主要概念是计算输入图像与数据库中其他存储图像之间的相关性参数。这种方法非常昂贵，因为它无法处理姿态和光照等可变条件，而另一个缺点是它总是在高维空间中进行分类。为了克服这些问题，可以使用其他方法来获得更准确、更有意义的结果，例如\
    \ `PCA`（主成分分析）算法，它将每个脸部表示为 `Eigen faces`（特征脸）的融合，且任何重构都是通过使用这些 `Eigen faces` 来完成的。\n\
    \n在人工智能方法中 [[48]](#ref-list.xhtml_refchapter_48)，使用了许多工具来识别脸，例如神经网络和机器学习技术。这意味着当从\
    \ `PCA` 算法中提取出主成分时，使用神经网络作为分类器以减少低维空间中的分量。`SVM`（支持向量机）是模式分类中最常用的算法。`HMM`（隐马尔可夫模型）也被用于人脸识别任务。人脸识别的困难在于它在姿态、光照条件等高变异性无法工作。针对变化的姿态和光照条件下的人脸识别问题已经解决，因此需要通过使用脸部几何来应对姿态和光照条件。[48]](#ref-list.xhtml_refchapter_48)\
    \ 因此，在所提工作中定义了 `PCA+ICA` 算法组合用于人脸识别。\n\n## 2.2 人脸识别算法](#contents.xhtml_toc2_42)\n\
    \n脸是生活中最重要的视觉对象，可用于传递身份。有许多算法用于人脸识别。\n\n### 2.2.1 主成分分析 (PCA)](#contents.xhtml_toc3_43)\n\
    \n`PCA` 是一种可衡量的策略，利用正交变换将一组可能相关的变量的感知转换为一组线性不相关因素的估计，这些因素被称为主成分。主成分的数量并不完全或等同于原始变量的数量。这种变换的特征是：第一主成分具有最大的方差（即代表了预期的信息中尽可能多的变化），随后的每个部分在与前几个成分正交（即与前几个成分不相关）的限制下，具有尽可能高的差异\
    \ [[40]](#ref-list.xhtml_refchapter_40)。如果信息集呈联合正态分布，则主成分将是独立的。`PCA` 对原始变量的整体缩放敏感。这里研究了许多关于\
    \ `PCA` 的论文，并发现没有论文将 `PCA` 策略与显著模型结合起来。这就是编写这类论文的原因，将所有这些内容结合在一起，对于初学者来说直观且易于理解。`PCA`\
    \ 是一种通用于高维数据分析的数学工具。`PCA` 已用于人脸识别、运动分析与合成、聚类和降维。它是 Turk 和 Pentland 在 1991 年开发的一种非常流行的算法\
    \ [[49],](#ref-list.xhtml_refchapter_49)，主要用于压缩类型问题中的降维。`PCA` 源于 `Eigenvector`（特征向量）概念\
    \ [[49]](#ref-list.xhtml_refchapter_49)。它是用于带有模式识别的数据分析中最重要的工具，可用于图像处理。该算法使用线性变换方法，将完整数据从高维空间映射到低维空间。在此类算法中，如果我们把真实数据集转换到不同的空间，真实数据集的形状和位置将发生改变，它被用于在组不知道的情况下计算更好的判别分量。这是一种在统计上用于数据分析和降维的技术。该算法的目标是将数据取为若干成分的组合\
    \ [[49]](#ref-list.xhtml_refchapter_49)。第一主成分是原始维的线性组合，在该维度上方差最大。第二主成分是原始维的另一个维度，在该维度上方差最大且与第一主成分正交。第\
    \ n 个主成分是在与前 n-1 个主成分正交的前提下具有最高方差的线性组合。为了减少识别脸部所需的变量数量，使用了统计方法。训练集中的每张图像都将由加权\
    \ `Eigen feature vectors`（特征特征向量）的线性组合来表示，这些向量被称为 `Eigen faces`（特征脸） [[50]](#ref-list.xhtml_refchapter_50)。使用一个称为\
    \ `bias function`（偏置函数）的术，它表示由给定训练集的协方差矩阵生成的所有 `Eigen vectors`。在识别阶段，将新图像投影到子空间，并使用\
    \ `Euclidean method`（欧几里得方法）计算各种脸部特征之间的距离以便分类。`PCA` 也称为 `Karhunen Loeve transformation`\
    \ [[50]](#ref-list.xhtml_refchapter_50)。它用于消除维度和相关性问题，并通过表达相似性和差异来分析数据模式 [[50]](#ref-list.xhtml_refchapter_50)。\n\
    \n实施 `PCA` 算法的步骤如下：\n\n所有拍摄的脸部图像都是二维的，即 `N*N`。目标是提取可以表示训练集中存储的全脸的主成分（`Eigen faces`）\
    \ [[51]](#ref-list.xhtml_refchapter_51)。假设训练集中的图像数量为 `M`，训练集中每张图像的线性形式表示为 `I[n]`。\n\
    \n*   将训练集的图像转换为向量，将 `N*N` 映射为 `1*N²` 向量\n*   归一化脸向量，意味着从脸中移除所有特征，留下独特特征。\n* \
    \  计算所有脸向量的平均值\n    $Mean = 1/(M)\\sum_{i = 1}^{M}I_{i}.$\n*   从脸向量 `I[i]` 中减去平均值，留下归一化的脸。\n\
    \    `K[i] = I[i]-mean`\n*   从协方差矩阵计算特征向量\n    $C = 1/(M)\\sum_{i = 1}^{M}{Ki\
    \ \\ast Ki^{T}} = B \\ast B^{T}(N^{2} \\ast N^{2})}$\n    其中 `B = [K[1] K[2]…K[M]]^T`\
    \ (N²M 矩阵)\n*   从还原的协方差矩阵 `C` 或 `B*B^T` 计算特征向量，令其为 `u[i]`，但 `B*B^T` 很大，无法对其计算特征向量。因此改为找出矩阵\
    \ `B^T*B` 的特征向量。令 `v[i]` 为特征向量\n`v[i]` 和 `u[i]` 之间的关系\n$\\begin{array}{l} {B^{T}\
    \ \\ast Bv_{i} = I_{i} \\ast v_{i}} \\\\ {B^{T} \\ast B \\ast Bv_{i} = I_{i} \\\
    ast Av_{i}} \\\\ {C \\ast Bv_{i} = I_{i} \\ast Bv_{i}} \\\\ {Cu_{i} = I_{i}u_{i}}\
    \ \\end{array}$\n    其中 `u[i] = Bv[i]`\n*   选择能够表示整个训练集的最佳特征脸\n*   将低维特征向量转换为原始维度\n\
    *   将每个脸图像表示为所有特征向量的线性组合。这意味着训练集中的每个脸都可以表示为特征脸和平均脸的加权和。\n*   识别未知脸。识别脸图像遵循的步骤有：\n\
    \    1. 首先将脸图像转换为向量形式 `I`。\n    2. 通过减去平均值对其进行归一化。\n        `K = I-mean`\n\n"
- fmt: "\n3. Project normalized face vector (`K`) onto Eigen space in order to obtain\
    \ a vector `W`.\n\n`W = [w[1]w[2]…..w[N]]^(T)`\n\nwhere `w[i] = u[i]^T * K`\n\n\
    4. Find `e[r,]` it gives minimum distance the given face has from another face\
    \ belongs to training set and the given face belongs to that person to whom the\
    \ face in the training set belongs.\n\n`E[r] = min ||w - w^T||`\n\n5. If `E[r]\
    \ > threshold`, the user is unknown else user is known.\n\n[Figure 2.4](#ch02.xhtml_fig2_4)\
    \ describes the steps taken in PCA algorithm to take out the principal components\
    \ of the face image [[51]](#ref-list.xhtml_refchapter_51). In the PCA algorithm,\
    \ all the images must be of equal size. The normalization process is applied to\
    \ normalize the data for all images. Every image is considered as a single vector,\
    \ it means all the face images are kept in a single matrix and every row of the\
    \ matrix shows an image. Next step is to calculate Eigenvectors for these images,\
    \ these Eigenvectors are also called as Eigenfaces. Every image is a linear combination\
    \ of weighted sum of these Eigenfaces. Whenever a new image is registered for\
    \ recognition, Eigenvectors for that image is first created and then the distance\
    \ between new face image which is at the door and all the stored images in the\
    \ database is computed. The main goal of using PCA is to get important features\
    \ of data by using a method called matrix method. PCA Eigenfaces method does not\
    \ work on images directly, so the matrix method is used which converts all the\
    \ images into vector form and stored them in a single matrix. [Figure 2.5](#ch02.xhtml_fig2_5)\
    \ shows a schematic diagram of a PCA and neural network-based face recognizer.\n\
    \n![](images/fig2_4.jpg)\n\nFigure 2.4 Schematic diagram of a face recognizer\
    \ by PCA.\n\n![](images/fig2_5.jpg)\n\nFigure 2.5 Schematic diagram of a PCA and\
    \ neural network-based face recognizer.\n\n### [2.2.2 Independent component analysis\
    \ (ICA)](#contents.xhtml_toc3_44)\n\nIt is a statically and computational strategy\
    \ for finding basic factors or parts from multidimensional statistical information.\
    \ ICA is different from other methods in a way that it searches for components,\
    \ which are having both characteristics: statistically independent and non-Gaussian.\
    \ ICA characterizes a generative model for the noticed multivariate information,\
    \ which is ordinarily given as an enormous collection of samples. In the model,\
    \ the data variables are assumed to be linear mixtures of some unknown latent\
    \ variables, and the mixing system is also unknown. The latent variables are assumed\
    \ non-Gaussian and mutually independent, and they are called the independent components\
    \ of the observed data. These independent components, also called sources or factors,\
    \ can be found by ICA. The data analyzed by ICA could originate from many different\
    \ kinds of application fields, including digital images, document databases, economic\
    \ indicators and psychometric measurements [[41]](#ref-list.xhtml_refchapter_41).\
    \ ICA is used to analyze larger order data or we can say multivariable data [[52]](#ref-list.xhtml_refchapter_52).\
    \ The main technology used in this algorithm is conversion of higher dimensional\
    \ space into low-dimensional space in such a way that new space which is contained\
    \ converted variables will define the essential features of the data. Cluster\
    \ analysis is a technique that is used in this algorithm [[53]](#ref-list.xhtml_refchapter_53).\
    \ A cluster is represented as a group of a number of data elements and cluster\
    \ analysis is defined as a technique used for allocating space in a region to\
    \ data where large concentration is present and that region is called as cluster\
    \ [[53]](#ref-list.xhtml_refchapter_53). This technique is basically used for\
    \ blind source separation problem that is also called cocktail party problem.\
    \ This problem is defined as if there are three people speaking simultaneously\
    \ in a room by using three microphones that are placed at different locations\
    \ in order to pick sound produced by the microphone and each microphone records\
    \ a mixture of all the voices in the room. The objective is to separate the voices\
    \ of the individual users using only the recorded mixtures of their voices. Independent\
    \ Component Analysis (ICA) is a method of addressing this problem of blind source\
    \ separation [[54]](#ref-list.xhtml_refchapter_54). It is a generalization of\
    \ the PCA algorithm which distinguishes between higher order and second order\
    \ moments of input. Its main work is to divide a signal in a number of combinations\
    \ of independent signals.\n\nIn this, an algorithm that is used is info max [[55]](#ref-list.xhtml_refchapter_55)\
    \ proposed by Bell and Sejmouski for separating the analytical independent components\
    \ of a data set.\n\nSteps of ICA Algorithm are:\n\nEvery face image is a unique\
    \ linear combination of these independent components.\n\n`R = A * U`\n\nwhere\
    \ `R` represents images of faces, `A` defines the unknown mixing matrix and `U`\
    \ represents statistically independent components.\n\n- Perform sphering on the\
    \ training set. It includes centering and whitening process applied on the data\
    \ set.\n    1. Centering: In this, row means are subtracted from the data set\
    \ and then data set is passed through a whitening filter.\n    2. Whitening: It\
    \ is calculated by a formula:\n\n        `W[z] = U * E^(-1/2)`\n\n        where\
    \ `U` and `E` are Eigen vectors and Eigen values, respectively. This step removes\
    \ the stats of data, both covariance and mean are set to zero and variances are\
    \ equalized.\n\n- Calculate `W = W * W[z,]`\n\n- Calculate basis image.\n\n  \
    \  `B = R * W[i]^(-1)`\n\n- Project test image into Eigenfaces.\n\n- Compute coefficient\n\
    \n    `B[test] = R[test] * W[i]^(-1)`\n\nBoth PCA and ICA algorithms are used\
    \ to reduce measured components into a smaller set of components. PCA is adequate\
    \ if the data are Gaussian, linear and stationary. If not, then ICA comes into\
    \ the role. In simple words, PCA helps to compress the data, and ICA helps to\
    \ separate the data [[42]](#ref-list.xhtml_refchapter_42). [Figure 2.6](#ch02.xhtml_fig2_6)\
    \ shows a system that needs an input image. By inputting the image, it will find\
    \ out the Eigen values for all training images. After then, a test image is selected\
    \ and apply ICA algorithm onto the considered test image. Finally, from the considered\
    \ test image, mean image is calculated. If it is matching with the training image,\
    \ in that case, person is known else no result found. [Figure 2.6](#ch02.xhtml_fig2_6)\
    \ shows a block diagram of ICA based face recognizer.\n\n![](images/fig2_6.jpg)\n\
    \nFigure 2.6 Block diagram of ICA-based face recognizer.\n\n### [2.2.3 Linear\
    \ discriminant analysis (LDA)](#contents.xhtml_toc3_45)\n"
