    of face into number of uncorrelated components which are known as Eigenfaces.
    Every stored image will be combined by a linear sum of weighted Eigen feature
    vectors which are known as Eigen faces. At the time of recognition, new image
    is projected onto subspace and Euclidean method is used for calculating distance
    for classification purpose [[15]](#ref-list.xhtml_refchapter_15). The aim of using
    PCA is to collect important features of data by using a matrix method [[16]](#ref-list.xhtml_refchapter_16).
    In AI, quantities of instruments are utilized to perceive face like neural organization
    and machine procedures. It implies when guideline segments are removed from PCA
    calculation, at that point, neural organization is utilized as a classifier to
    lessen parts into low measurement space. SVM is a calculation utilized for issues
    of example grouping. Gee is additionally utilized for this. Its disadvantage is
    it doesn’t work under high inconstancy in posture, light condition and so on.


    Advantages:


    *   It is simplest, easy and efficient way of face recognition.


    *   It works well in less or more pose or illumination variation.


    *   It uses the concept of Euclidean distance, and it is based on the dimensionality
    reduction process, which reduces the dimensions of original recognition while
    retaining the most of information.


    *   It reduces the noise factor as the maximum variation basis is chosen and so
    the small variation in background ignored automatically.


    *   It is based on multiple images taken as input concept.


    *   It takes less computational time.


    Disadvantages:


    *   It is expensive for high-dimensional data.


    *   It does not implement in proper way when there is large variation in pose,
    orientation, illumination, etc.


    *   **Independent Component Analysis (ICA)**


    This algorithm is used to analyze large order data or we can say multivariable
    data. The main technology that is used in this algorithm is conversion of high-dimensional
    space into low-dimensional space in such a way that new space which is containing
    converted variables will define the essential features of data [[17]](#ref-list.xhtml_refchapter_17).
    Cluster analysis is a technique that is used in this algorithm. A group of number
    of data elements is considered as a cluster and cluster analysis is defined as
    a technique used for allocating space in a region to data where large concentration
    is present and that region is called as cluster.


    *   **Linear Discriminant Analysis (LDA)**


    LDA is a technique used for separation of data items. It is an approach used for
    classification of samples in the case of unknown classes that is based on samples
    of training using classes of known users. The aim of using LDA is to maximize
    variance across the users and minimize variance within the users. It basically
    makes clusters of the images of classes that are similar and partitioned the images
    of classes which are dissimilar to each other. This technique is used only for
    classification, but it can’t be used for regression. In order to recognize an
    input image, input image is compared to each and every image that has been stored
    in the database then closest distance is calculated and on the basis of distance
    input image is identified. It can be used in pattern recognition, statistics and
    machine learning. It is also known as Fisher-face- based algorithm that depends
    on dimensionality reduction concept.


    Advantages:


    *   It maximizes the class distance but distance is minimized within the class.


    *   It is robust.


    Disadvantages:


    *   It does not consider multiple images as input.


    *   **Discrete Cosine Transform (DCT)**


    It is used to express a sequence of points for data items working at different
    frequencies in terms of sum of cosine functions. This transform is used mainly
    for compression standard in which system receives face as an input image, then
    normalized or crop that face then to calculate distance between faces and finally
    comparison is done.


    Advantages:


    *   It works well when there is less variation.


    Disadvantages:


    *   It works well under same orientation, pose, illumination, etc.


    *   It is not having high success rate.


    *   **Gabor Wavelet**


    It characterizes the image as localized orientation selective and frequency selective
    features [[18]](#ref-list.xhtml_refchapter_18). This technique is basically a
    filter used for face detection and it is named after Dennis Gabor [[19]](#ref-list.xhtml_refchapter_19).


    Advantages:


    *   It works well in large variation in pose and illumination conditions.


    #### [1.5.2.3 Hand geometry](#contents.xhtml_toc4_19)


    This method is very popular these days as it works well in most situations for
    user recognition. This method automatically measures the number of dimensions
    of the hand and fingers then compares those measurements to a template [[12]](#ref-list.xhtml_refchapter_12).
    When a person places his hand on the surface embedded with sensors and uses poles
    in between the fingers for proper placement of the hand, a reading is started,
    and this procedure comes under a term called as spatial geometry. Finger or hand
    geometry generally measures two or three fingers as shown in [Figure 1.17](#ch01.xhtml_fig1_17).
    This method has an advantage that it does not require any cooperation from the
    user for identification but problem is its size which is very large.


    ![](images/fig1_17.jpg)


    Figure 1.17 Recognition based on hand geometry.


    #### [1.5.2.4 Iris scan](#contents.xhtml_toc4_20)


    This method is used to identify user by using different patterns of human iris.
    Iris is a muscle inside the eye that is used to control the light which is entered
    into the eye; it will regulate the size of pupil as shown in [Figure 1.18](#ch01.xhtml_fig1_18).
    It is an accurate method among other biometric systems as it gives high reliability
    and high recognition rate. It does not require any close contact between user
    and machine. Irises of identical twins are different which an advantage of this
    system is.


    ![](images/fig1_18.jpg)'
