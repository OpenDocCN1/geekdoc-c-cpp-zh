    # [Preface](#contents.xhtml_toc1_1)


    An efficient and accurate home security and access control to the doors security
    system, which is based on face and voice recognition, is very important for a
    wide range of security applications. Security is an important aspect or feature
    in smart home applications. Most countries are gradually adopting smart door security
    systems. The most important major part of any door security system is accurately
    identifying the individuals who enter through the door. Face with voice recognition
    is probably the most natural way to perform authentication between human beings.
    Additionally, these are the most popular biometric authentication traits, after
    fingerprint technology. Biometric recognition, or simply biometrics, is the science
    of establishing the identity of a person based on physical or behavioral attributes.
    It is a rapidly evolving field with applications ranging from securely accessing
    one’s computer to gaining entry into a country. While the deployment of large-scale
    biometric systems in both commercial and government applications has increased
    the public awareness of this technology, *An Integrated Approach to Home Security
    and Safety Systems* is the textbook to introduce the fundamentals of biometrics
    with integrated algorithms of face and voice recognition in order to provide security
    to an individual who is living alone at home. The two commonly used modalities
    in the biometrics field, namely face and voice, are covered in detail in this
    book. A few other modalities, such as hand geometry, ear and gait, are also discussed
    briefly along with advanced topics, such as fingertip application for heartbeat
    detection.


    Designed for undergraduate and graduate students in computer science and electrical
    engineering, “*An Integrated Approach to Home Security and Safety Systems*” is
    also suitable for researchers and biometric and computer security professionals.


