    ### 7. User interface adaptation

    A feature of pervasive computing systems is that they merge a collection of devices
    with very tiny sensors to palm, notebook and computers, each with different size.
    Applications require working effectively in a heterogeneous environment by the
    system’s organizer point of view and the users must have full control of each
    device or component with a limitation of their sizes [[8]](#ref-list.xhtml_refchapter_8).
    For example, tiny devices have tiny displays and requires the user to navigate
    a series of these menus. The problem is with PDAs; they are heavily loaded with
    features but never used because of their complexities.


    ### 8. Location aware computing

    The feature of ubiquitous computing when compared to conventional computing is
    the use of location. When Internet is considered, a server is not aware of the
    client location but when computing embedded is used into the local environment,
    interaction can be advanced to improve the result. For example, a query about
    the nearby equipment can be automatically fulfilled by the current location. Also
    the information accessed at a given location on one occasion can be offered to
    other people, if same query exists. In this, if an example of conference room
    is taken, then links are provided on the whiteboard automatically that have been
    used by previous groups [[9]](#ref-list.xhtml_refchapter_9). In the same way,
    low-priority messages are not allowed to be delivered to a laptop, if a meeting
    is going on side by side. In universities, context systems are designed by the
    tool kits.


