    ## 2.6 Summary


    A new technique named `PICA` has been proposed for human identification using
    fusion of two existing face recognition algorithms named as `PICA`, which can
    substantially improve the rate of recognition as compared to the single recognition
    algorithm. The proposed system uses a hybrid combination of `PCA` with Independent
    Component Analysis (`ICA`) for extraction of facial features and Back Propagation
    Feedforward Neural Network is used for recognizing a face. The experimental results
    show that the hybrid method takes the features of `PCA` and `ICA` in feature extraction
    and gives an excellent performance for person’s face recognition. Extensive experiments
    on data sets are carried out to calculate the performance of various features.
    In the future, security measures may be taken into consideration while taking
    and storing the images of the person, face recognition can be applied to iPhone
    to unlock the phone. Face unlock is a feature that allows unlocking the phone
    using the face print and integrated sensors may also be embedded in the proposed
    hybrid model for providing safe and convenient environment.


