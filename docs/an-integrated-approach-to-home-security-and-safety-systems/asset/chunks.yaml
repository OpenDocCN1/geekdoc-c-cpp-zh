    # LDA is a dimensionality reduction technique that is used like a preprocessing
    step for face recognition. Its aim is to project the features from high-dimensional
    to low-dimensional space for avoiding the dimensionality curse and most importantly
    reduce cost as well as resources. LDA technique was introduced by Ronald A. Fisher
    with name Linear Discriminant or FDA (Fisher Discriminant Analysis) in 1936. This
    is one of the classical techniques for recognition of patterns, where this technique
    is used for finding the features of linear combination which separates object
    classes. The combination of results can be used like a linear classifier. Fisher
    Discriminant analysis is also a part of the linear discriminant analysis technique.
    In this analysis, a variety of pixel values can be used to represent each face.
    LDA is used to create a more manageable form by reducing number of features before
    classification happens. It is used to search for linear type of transformation
    in such a way that clusters of features will be very separable, which can be achieved
    by analysis of scatter matrix. This method is basically used to handle that case
    in which intra class frequencies will not be equal and we can calculate their
    performance by using any random data set. It maximizes the ratio of inter class
    variance with intra class variance for any data set by giving guaranteed separability
    [[55]](#ref-list.xhtml_refchapter_55). This algorithm maximizes the between class
    scatter matrix, while minimizing the within-class scatter matrix by using a transformation
    as shown in [Figure 2.7](#ch02.xhtml_fig2_7) [[43]](#ref-list.xhtml_refchapter_43)


    ![](images/fig2_7.jpg)


    Figure 2.7 Class separations in LDA.


    The aim of using LDA is an improvement over PCA using the class membership function
    of training images taken into account when finding for a subspace. It is based
    on the concept that single face image is taken as input and uses score function
    with the Mahalanobis distance method concept [[55]](#ref-list.xhtml_refchapter_55).
    Its advantage is that it maximizes the distance between clusters but minimize
    the within cluster distance, but it does not consider multiple images as input.


    ## Algorithm:


    It is very similar with the algorithm of Eigenface, in this first; training images
    are projected onto a subspace. After then, a similarity measure is calculated
    by projecting a test image onto the same subspace. The measurement of subspace
    is measured with steps defined as:


    1. Calculate variation within class by a measurement of the amount of variation
    between items belongs to same class.

    2. Calculate variations between classes.

    3. To compute Eigen vectors and Eigenvalues for both the categories: variations
    within class and between classes.

    4. Then, sort the Eigenvectors by their attached Eigenvalues from high to low
    and keep the highest value Eigenvectors. These Eigenvectors are the Fisher basis
    vector.

    5. Calculate the dot product of images with the fisher basis vector. This calculation
    projects images onto a subspace. Once trained images are projected onto a subspace,
    they must be collected and categorized as how close they are to one another. Computing
    the distance between images can establish their similarity. For example, images
    with the smallest distance between them can be considered close and similar, whereas
    images whose distances are farther apart would be considered dissimilar.


    LDA technique tries for the discrimination of data set by using dimensionality
    reduction method, and the block diagram of testing phase of LDA is shown in [Figure
    2.8](#ch02.xhtml_fig2_8) [[43]](#ref-list.xhtml_refchapter_43)


    ![](images/fig2_8.jpg)


    Figure 2.8 Block diagram of testing phase of LDA.


    ## 2.2.4 Discrete cosine transform (DCT)](#contents.xhtml_toc3_46)


    This is one of the exact and robust recognition systems and by using different
    normalization methods; its robustness to varieties in geometry of face and illumination
    can be increased. Property of energy compaction enables DCT to be used in image
    processing and analysis of the signal. DCT easily compresses most of the signal
    information in number of coefficients and this is the reason that it is used for
    feature extraction of facial features. When Discrete Cosine Transform is applied
    on face image, it will provide a matrix containing low- and high-frequency coefficients
    [[56]](#ref-list.xhtml_refchapter_56). Performance of DCT is largely affected
    by altering the coefficient magnitude at the top left corner of the matrix. In
    this, before applying feature extraction, illumination normalization is applied
    in order to compensate these coefficient variances and set the blocks to more
    equalized intensity. DCT is a very efficient technique used in image coding. In
    order to compensate with image quality, some coefficients that are having high
    frequency can be ignored. In case of variation in facial expression, illumination
    conditions, etc., two-dimensional DCT methods are used for feature extraction
    in order to increase the performance of the recognition system. The challenge
    of DCT technique is uncontrolled illumination conditions for extraction of features
    in real world applications. Illumination normalization (IN) is a preprocessing
    technique that compensates for different lighting conditions. It consists of a
    number of data points waving at different frequencies are represented in terms
    of addition of cosine functions [[56]](#ref-list.xhtml_refchapter_56). A transform
    is defined as an operation that is used in signal conversion, i.e., to convert
    one domain into another domain by use of inverse transform. This transform is
    used in compression standard in which system receives face as an input image,
    then normalizes or crop that face, calculates distance between faces and finally
    comparison is done. DCT also attempts to decorrelate the image data as other transforms.
    After decorrelation, each transform coefficient can be encoded independently without
    losing compression efficiency. It works well when there is less variation. It
    works well under same orientation, pose, illumination, etc., but its success rate
    is not high.


    ## 2.2.5 Gabor wavelet](#contents.xhtml_toc3_47)


    It characterizes the image as localized orientation and frequency selective features.
    A filter is used in this technique to extract the local features, which are actually
    applied on number of images for feature extraction aligned at a particular angle
    or orientation. [[43]](#ref-list.xhtml_refchapter_44) This technique is named
    after Dennis Gabor [[57]](#ref-list.xhtml_refchapter_57). It is a band pass linear
    filter that works well in large variation in pose and illumination conditions.
    It achieves an optimal resolution in both spatial and frequency domains. Wavelets
    are functions that satisfy certain mathematical requirements and are used in representing
    data or other functions. Wavelet technique is used to process data at different
    scales or resolutions. If a signal is having a large window, then gross features
    are calculated and if a signal is having a small window, in that case small features
    are calculated. Wavelets are well suited for approximating data with sharp discontinuities.
    This technique can be used in a number of areas: astronomy, acoustics, nuclear
    engineering, signal and image processing, music, magnetic resonance imaging, speech
    discrimination, optics, fractals, turbulence, earthquake prediction, radar and
    human vision. [Figure 2.9](#ch02.xhtml_fig2_9) shows a block diagram of Gabor
    Wavelet technique.


    ![](images/fig2_9.jpg)


    Figure 2.9 Block diagram of gabor wavelet techniques.


    There are number of features which make this technique attractive for use in number
    of applications:


    * Illumination variation insensitivity

    * Change in facial expression insensitivity

    * Shift and rotation invariance


    With these benefits, there are also some drawbacks in this technique:


    * High computation complexity

