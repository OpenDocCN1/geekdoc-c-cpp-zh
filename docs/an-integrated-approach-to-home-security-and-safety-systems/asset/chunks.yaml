    为了给用户提供安全保障，家庭、办公室、银行等场所都需要全面的安全性。因此，为了给独居家中的个人提供安全保障，使用了上一章介绍的带有相似性指数（Similarity
    Index）的语音识别技术以及脸识别技术语音识别系统涉及三个主要任务：预处理、特征提取和特征识别。提取特征的目的是从语音信号中提取特征，然后将其转换为特征向量。每个语音识别系统由两个阶段组成：注册阶段（enrollment
    phase）和匹配阶段（matching phase）。首先，在注册阶段，通过使用属于三类（即家人、朋友或邻居）之一的特征模块来维护语音模型。在匹配阶段，从未知人员语音样本中分离出的特征向量与数据库中存储的所有样本进行比较。这将得出一个相似性得分值。最后的决策模块使用该相似性得分值进行最终判断。所提的系统采用了`MFCC`（梅尔频率倒谱系数）与`RASTAA-PLP`（相对光谱感知线性预测）的混合组合用于特征提取和数据分类。这项所提研究工作的动机是实现一种语音识别系统，该系统将同时适用于文本依赖和文本无关的识别技术。在本提工作中实现了混合的`MFRASTA`技术，以在识别率方面获得改进的结果。该系统具有成本效益、高可靠性并提供准确的响应。未来，在采集和存储人员音频文件时可以考虑安全措施，并在所提模型中集成嵌入传感器以提供安全舒适的环境。可以开发一个具有更大词汇量的系统，并通过使用语音增强技术来提高准确性。所提工作中进行的实验是基于无噪声环境下采集的语音样本。但在现实情况下，人也可能在嘈环境中说话。因此，通过考虑这一因素，所提工作的有效性可以进一步扩展。


    # 第 4 章


    ## 基于传感器的健康监测系统使用指端应用


    DOI: [10.1201/9781003120933-4](https://doi.org/10.1201/9781003120933-4)


    ## 4.1 基于传感器的服务简介


    生命体征是人体可以测量的重要功能。每个生命体征都通过多种设备进行测量。在当今社会，许多疾病的发病率非常高。由于护理成本高、生活质量低和早死，心力衰竭和中风给社会带来了巨大负担[[68]](#ref-list.xhtml_refchapter_68)。因此，需要通过高效益的设备监测`BP`、温度和心跳等基本参数以便进一步治疗。在当今世界，使用了许多通用设备，如笔记本电脑、PDA、平板电脑、智能手机等。智能手机除了通话和发送短信外，还具有一些先进功能。用户只需触摸或滑动屏幕即可简单地使用带有所有电脑功能的智能手机。通信技术和信息与工程及医学概念相结合，使医疗保健人员能够增加对家庭、公园、公共场所、医院等的患者监测。在医院里，他们有监测患者的规定，但并非每次都能去医院，在这种情况下，处理那种情况非常困难。儿童、成年人和老年人可以通过定制的监测从健康技术中受益。测量健康参数有多种方法，例如通过`PTT`（脉搏传导时间）估算`BP`，但这些方法需要复杂的设备，不便于用户佩戴[[69]](#ref-list.xhtml_refchapter_69)。心率和该心率的变异性是提供疾病相关信息的两个重要因素。心率变异性也反映了压力和焦虑。以前的技术如心率传感器、指脉脉冲幅度和心电图（`ECG`）现在不再适用[[69]](#ref-list.xhtml_refchapter_69)。心率代表心脏每分钟跳动的次数（`bpm`）。以前使用心音图设备配合麦克风、放大器和滤波器等设备来记录心声。


    测量心率的方法有很多，但大多数方法都是不舒服的。图 4.1、4.2 和 4.3 显示了用于脉搏量的传统设备：a) 手动测脉法，b) 手持式血氧仪和 c) 指夹蓝牙血氧仪心率监测设备。


    ![](img/fig4_1.jpg)

    图 4.1 手动测量脉搏的方法。


    ![](img/fig4_2.jpg)

    图 4.2 手持式血氧仪。


    ![](img/fig4_3.jpg)

    图 4.3 指夹蓝牙血氧仪。


    软件应用程序从麦克风记录的心声中提取振动率。需要加速度计来检查心脏运动产生的胸震动。加速度计具有通过`MEMS`（微机电系统）检测加速度的能力。传统方法包括`GPS`（全球定位系统）设施，以跟踪患者的位置[[70]](#ref-list.xhtml_refchapter_70)，但它能耗极高且室内无法使用。`GPS`是一个卫星系统，为`GPS`接收机提供与时间和、位置相关的信息。另一种方法是可穿戴的传感器设备，如腕带、胸带和带有多个传感器的腰带，传感器在设备上显得不舒服且非常困扰。


    当心脏跳动时，它实际上在向全身泵血，这导致手指指动脉内的血量发生变化。这种血液波动可以通过放置在指端的光学传感机制进行检测。使用压力传感器、光传感器和声音传感器也可以测量心率。首先是压力传感器，它用于检测心脏产生的震动附近的压力变化。研究人员主要使用这种方法观察静息心率。该传感器放置在被子下，然后检测心率的变化。这是最流行的心率测量方法，主要在用户处于躺卧状态时使用靠近心脏的传感器进行测量。但这种类型的缺点是对噪声因素敏感。声音传感器被用于测量心脏附近的声音变化，其中空气传导麦克风在不直接接触皮肤的情况下测量心跳参数，光传感器用于寻找血液光学属性的变化。这种方法使用红外区域的`LED`和光二极管，有助于检测血量的变化。

