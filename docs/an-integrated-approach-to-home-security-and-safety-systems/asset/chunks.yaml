  trans: '

    人脸识别通过利用广泛的领域已形成规模。目前描述了两类人脸识别方法，分别为：基于特征的方法和基于整体的方法。在基于特征的方法中，根据属性提取特征，并基于眼睛、下巴、嘴巴和鼻子等人脸部特征计算几何关系
    [[81]](#ref-list.xhtml_refchapter_81) 。这种方法不适用于实际应用。在整体或基于外观的方法中，使用了全图像表示，它是基于高维向量表示的。


    人脸识别系统主要由两个步骤组成：特征提取和人脸识别。在提取过程中，从人脸中提取特征；在识别过程中，这些特征与数据库中存储的所有特征进行匹配。然后将检查基于欧几得距离的相似性得分，并用于做出最终决策。人脸识别系统中使用了多种算法进行特征提取，如
    `PCA`、`ICA`、`LDA` 等，但最常用的方法是结合了 `ICA`（独立成分分析）的 `PCA`（主成分分析）。它们有助于降维，能够在保留完整信息的同时进行数据压缩；它们将所有图像转换为向量形式并存储在单个矩阵中
    [[82]](#ref-list.xhtml_refchapter_82)， [[83]](#ref-list.xhtml_refchapter_83) 。有时，当姿态、光照条件等变化较大时，系统性能会下降。因此，本提出的工作中解决了这个问题。


    本研究工作提出了一种混合 `PICA` 算法以提高人脸识别系统的识别率。集成的 `PCA` 和 `ICA` 用于特征提取，并使用反传播神经网络进行分类。该算法在人脸识别中的性能通过训练数据库中的
    41 张图像进行了测试。混合 `PICA` 算法优于以往的方法。


    语音识别也已实现，包括三个主要步骤，即数据处理、特征提取和语音识别 [[84]](#ref-list.xhtml_refchapter_84) 。特征提取是一个用于提取特征并将其转换为特征向量的过程。从用户的特征中去除了冗余性。在每个语音识别系统中，都有两个模型：提取阶段和识别阶段。在提取阶段，使用语音特征训练每个模型；在识别阶段，这些特征与数据库中存放的所有特征进行匹配。通过使用这种概念将计算相似性得分，并用该得分做出最终决策。


    语音识别系统可以根据识别的单词语数量进行如下分类：孤立词需要每个单词在窗口的两侧都有静音。它一次处理一个单独的单词，词与词之间有要求的停顿。这是语音识别最简化的形式，因为端点更容易找到。连续词的工作方式与孤立词类似，但它要求相互分离的单词之间有最小的间隙
    [[85]](#ref-list.xhtml_refchapter_85)， [[86]](#ref-list.xhtml_refchapter_86) 。连续语音不被停顿隔开；它在所有单词都相互关联的语音上运行。在这种情况下，用户以自然的方式说话，很难识别，因为需要方法来定义单词的边界。有许多方法
    [[87]](#ref-list.xhtml_refchapter_87) 可用于特征提取，如 `MFCC`、`LPC`、`PLP` 和 `RASTA-PLP`，但最常用的方法是
    `MFCC` 和 `PLP` [[88]](#ref-list.xhtml_refchapter_88)， [[89]](#ref-list.xhtml_refchapter_89)
    。它们都带有说话人相关和说话人无关的信息。但有时，语音识别系统的性能会下降，特别是在嘈杂环境中。因此，在提出的工作中解决了这一问题，并提出了一种混合 `MFRASTA`
    算法以提高语音识别系统的识别率。该算法包含四个步骤：第一步是收集数据并应用预处理过程，其中通过多种方法以`.wav` 格式记录音频文件；特征提取步骤提取从语音信号中提供特定信息的特征。使用两种语音识别算法
    `MFCC` 和 `RASTA-PLP` 提取特征，合并所有输出并对输入语音进行分类，确定是已知还是未知，最后发送消息以定义每个输入语音的类别。混合 `MFRASTA`
    即使在存在噪声的情况下也能给出改进的结果。所提出的混合 `MFRASTA` 的能力已在一个包含 41 个`.wav` 格式音频文件的数据库上进行了测试。


    另一个是 `Similarity Index`（相似性指数），当识别技术中的一种（人脸或语音）无法妥善识别用户时，它将运行。这是一个文本无关的系统，根据音高、语调和发音等语音参数识别用户，而不考虑用户所说单词的内容。


    最后，医疗服务提供者 [[90]](#ref-list.xhtml_refchapter_90) 始终面临着挑战，即如何低成本为患者提供舒适的医疗设施，因为当今世界生活方式的快速变化加上老龄化问题迫切需要更新所有设施。因此，主要目标是建立一种低成本且快速的方法为老年人提供医疗保健。这项研究展示了所有可用的监控系统，有助于监测患者。已经描述了许多用于健康监测的设备
    [[91]](#ref-list.xhtml_refchapter_91)，例如心音图应用、水银计和自动数字血压计，但这些设备面临的挑战已通过噪声因素和便于携带性方面得到解决。可穿戴传感器是设备
    [[92]](#ref-list.xhtml_refchapter_92)，可以作为配件的一部分佩戴在身上，并能轻松用于健康监测，因为并不是每次都能去医院，在那种情况下处理这种局面非常困难。有许多方法可以测量这些参数，例如用于血压估计的
    `PTT`（脉搏传输时间），但这些方法需要高复杂的设备，用户不方便佩戴。


    6.2 总结与范围

    '
- fmt: '

    In [Chapter 1](#ch01.xhtml_chapter1), the meaning of pervasive computing, its
    challenges, uses of pervasive computing, issues involved in pervasive computing
    like a user is suddenly ill, abnormal heart rate, fall from sofa, abnormal BP,
    etc., and their effects have been discussed and explored [[93]](#ref-list.xhtml_refchapter_93).
    This chapter further defines the concept of biometric technology, number of biometric
    techniques, basic types with their advantages and disadvantages in face recognition
    systems, its applications, basic structure of voice recognition system, its applications
    and two phases: speaker dependent and speaker independent system. Then, introduction
    to sensor-based technology, different types of sensors, different types of techniques
    used for health monitoring and uses of sensors for providing security to an individual
    is defined [[94]](#ref-list.xhtml_refchapter_94), [[95]](#ref-list.xhtml_refchapter_95).
    Some basic concepts of neural network, its types, applications, number of uses
    and how it can be used for face and voice recognition is also stated. Finally,
    the meaning of `MATLAB`, all types of version and number of tools used for face
    and voice technology is explained. The issues and challenges of face recognition
    as well as voice recognition have been addressed to get the motivation for this
    thesis. The objective of this research work has been defined in this chapter.


    It is clear that in the case of face recognition, different algorithms are defined
    for the extraction of features and number of neural network techniques is discussed
    for the recognition. Different types of face recognition methods that are used
    in face recognition tasks have been defined [[96]](#ref-list.xhtml_refchapter_96),
    [[97]](#ref-list.xhtml_refchapter_97). Finally, dimensionality reduction technique
    has been discussed for providing high performance. In order to identify an unknown
    user, a large number of calculations are required to be done [[98]](#ref-list.xhtml_refchapter_98),
    [[99]](#ref-list.xhtml_refchapter_99). Next is the voice recognition system, which
    describes all types of recognition techniques, the way to develop fast and effective
    algorithms and how to deal with noisy environment has been thoroughly explored
    and implemented [[100]](#ref-list.xhtml_refchapter_100), [[101]](#ref-list.xhtml_refchapter_101).
    Different types of features of speech have been discussed [[102]](#ref-list.xhtml_refchapter_102),
    [[103]](#ref-list.xhtml_refchapter_103) with the use of different neural network
    techniques. In this sensor-based application, various previously used methods
    are discussed and a number of sensors have been defined for the health monitoring
    of users with a number of techniques used for sending messages to the users [[104]](#ref-list.xhtml_refchapter_104),
    [[105]](#ref-list.xhtml_refchapter_105). A brief description of all the previously
    used methods for health monitoring as defined by various researchers in the conventional
    sensor-based system has also been presented. In this research work, the main focus
    has been on providing the security for an individual who is living alone at home
    by using multimodal biometric technology and sensor-based application.


    In [Chapter 2](#ch02.xhtml_chapter2), process of face recognition has been defined
    by using hybrid `PICA` algorithm. For feature extraction, a combination of `PCA
    + ICA` has been described. Dimensionality reduction feature of `PCA` helps in
    removing the redundancy and then improves the performance of face recognition
    system [[106]](#ref-list.xhtml_refchapter_106). The hybrid `PICA` algorithm helps
    in obtaining higher recognition rate as compared to individual `PCA` and individual
    `ICA` technique. Individual methods sometimes make wrong decisions in case of
    change in pose, illumination conditions, but the proposed algorithm provides high
    accuracy with all conditions. Back Propagation Neural Network is the most preferable
    network used for recognition with this hybrid algorithm. The complete implementation
    is done using image processing toolbox in `MATLAB`. Finally, a process of sending
    messages on the cell phone of family members using a `3G` dongle with `MATLAB`
    tool is performed. In the proposed work, total 30 features have been extracted,
    and 41 images are taken from the training database in dimension of `512*512`.


    In [Chapter 3](#ch03.xhtml_chapter3), process of voice recognition is described.
    For feature extraction, `MFCC` and `RASTA-PLP` techniques have been used. `RASTA-PLP`
    helps in enhancing the performance of the recognition system even in noisy environment
    [[107]](#ref-list.xhtml_refchapter_107). A hybrid algorithm named as `MFRASTA`
    has been proposed that shows the significant improvement in recognition rate.
    Previously, a number of combinations of voice recognition techniques have been
    used [[108]](#ref-list.xhtml_refchapter_108) for voice recognition system and
    a number of neural network techniques have been used with voice recognition techniques,
    but sometimes it makes the wrong decision and gives inaccurate results, but the
    proposed method outperforms them to achieve highest recognition rate with accurate
    results. This hybrid technique has been defined using text dependant as well as
    text independent method for speaking style, frequency and pitch [[109]](#ref-list.xhtml_refchapter_109),
    [[110]](#ref-list.xhtml_refchapter_110). The database consists of about 41 audio
    files (in `.wav` format) to evaluate the proficiency of voice recognition system
    with different conditions. Experimental results clearly indicate that the performance
    of the hybrid work is greater than individual feature extraction techniques. The
    complete system is implemented in `MATLAB` tool with Graphical User Interface
    and finally this work is tested a number of times and found to be very reliable.


    [Chapter 4](#ch04.xhtml_chapter4) describes a fingertip sensor-based application
    for heartbeat monitoring. Heart rate is measured through a finger tip using optical
    sensors in a way to detect the blood flow from the finger and then the brightness
    of the acquired signals through the sensors is computed. In all previously used
    techniques, heart rate was considered by placing the thumb over arterial pulsation,
    timing and then count the pulses in 30 seconds [[111]](#ref-list.xhtml_refchapter_111).
    Heart rate acquired is then multiplied by 2, this method seems to be very simple,
    but it provides errors in high rate. So, to overcome these problems, a new application
    has been proposed and implemented which measures heartbeat through a fingertip.
    The basic objective of this research work is to implement a low-cost portable
    device that can be used anywhere, anytime and by any person. It also aims to improve
    the accuracy of current proposed application by identifying the drawbacks of existing
    techniques. This proposed application is implemented in `MATLAB`. It has a major
    advantage that non professional people can use this application at home for heartbeat
    measurement in a safe and easy way. This method provides accurate results even
    with a low-end video camera which is integrated in mobile devices.


    In [Chapter 5](#ch05.xhtml_chapter5), final GUI is prepared which includes face
    recognition, voice recognition, similarity index and vital signs monitoring. All
    the steps are performed in a way to recognize a person at door and health monitoring
    of the individual at home is also performed. The complete steps are implemented
    in `MATLAB`. Face recognition is done by `PICA` algorithm and Voice recognition
    is done by `MFRASTA` algorithm. Vital signs monitoring is verified by fingertip
    application. Finally, messages will be sent to all category members belonging
    to different categories as per the requirement.


    The outcomes of this work are compiled as-


    *   Recognition rate is improved by 99.5% due to the implementation of the hybrid
    `PICA` algorithm as compared to individual `PCA` and individual `ICA` in face
    recognition system.

    '
