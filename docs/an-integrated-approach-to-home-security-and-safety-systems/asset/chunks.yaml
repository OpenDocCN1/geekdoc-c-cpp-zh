    ## 5.3 Conclusion and Future Work


    As the face recognition technique is hands free, it provides continuous authentication
    to the users. This technology captures the images through the camera and those
    features of the face are extracted which do not change with time. Similar to this,
    voice recognition plays a vital role in the authentication in which audio files
    are captured with the help of a microphone. The proposed model is implemented
    using face and voice recognition techniques to provide home based security to
    the individual living alone. Along with this implemented model, health monitoring
    aspect of owner of the home is also taken into consideration. A cost effective,
    easy to use model is developed which helps the users to continue to live in their
    comfortable environment at home. This model will allow healthcare personnel to
    check important body signs of their patients in real time provide feedback from
    distant facilities. In future, concept of soft computing can be used for the automatic
    face recognition system. Using the concept of fuzzy logic with neural networks,
    the performance of face recognition can be enhanced. Two or more classifiers can
    be combined to achieve better results.

