    A new technique named PICA has been proposed for human identification using fusion
    of two existing face recognition algorithms named as PICA, which can substantially
    improve the rate of recognition as compared to the single recognition algorithm.
    The proposed system uses a hybrid combination of PCA with Independent Component
    Analysis (ICA) for extraction of facial features and Back Propagation Feedforward
    Neural Network is used for recognizing a face. The experimental results show that
    the hybrid method takes the features of PCA and ICA in feature extraction and
    gives an excellent performance for person’s face recognition. Extensive experiments
    on data sets are carried out to calculate the performance of various features.
    In the future, security measures may be taken into consideration while taking
    and storing the images of the person, face recognition can be applied to iPhone
    security to unlock the phone. Face unlock is a feature that allows unlocking the
    phone using the face print and integrated sensors may also be embedded in the
    proposed hybrid model for providing safe and convenient environment.


    <hgroup>


    # [Chapter 3](#contents.xhtml_toc1_52)


    ## [Hybrid MFRASTA voice recognition technology for individual''s security at
    home](#contents.xhtml_toc1_52)


    </hgroup>


    DOI: [10.1201/9781003120933-3](https://doi.org/10.1201/9781003120933-3)


    ## [3.1 Introduction to Voice Recognition](#contents.xhtml_toc2_53)


    Voice is a name given to the sound that carries the contents of language. People
    learn a number of skills during childhood, and this process continues throughout
    the life. It seems very natural to us as voice phenomena’s complexity is not realized.
    There are two biological organs named as: human vocal tract and articulators having
    properties that are affected by gender to emotional state and vocalizations are
    varied in terms of volume, speed, accent, pitch, pronunciation, etc. The total
    data amount that is generated during the voice production is very large and not
    all of them contain useful information. So, less data are required to represent
    characteristics of voice and the person who has spoken it. Voice recognition is
    a method used to recognize a word automatically which is spoken by any speaker.
    Voice recognition is also identified as speech recognition. It is a software program
    that has the ability to decode a person’s voice. The attractive feature of voice
    recognition is without using any mouse, keyboard or any type of button, it operated
    devices and can perform any type of commands. The concept of voice recognition
    was originated by the way human communicate to each other. No two individuals
    have similar voice and the difference lies in the construction of articulator
    organs. Length of vocal tract, shape of mouth, features of vocal cord make voice
    of every user unique.'
