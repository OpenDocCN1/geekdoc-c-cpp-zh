- fmt: "\nHolistic-based method uses global representations for full image apart from\
    \ local or some facial features. This method is again separated into two parts:\
    \ statistical and artificial intelligence. In statistical approach, images are\
    \ represented as two-dimensional arrays, and the main concept used is to calculate\
    \ correlation parameter between the input image and the other stored database\
    \ images. This method is very expensive as it does not work on variable conditions\
    \ such as pose and lighting, and the second drawback is that it performs classification\
    \ always in high-dimensional space. To overcome these problems, other methods\
    \ can be used in order to gain more accurate and meaningful results, for example,\
    \ `PCA` (Principle Component Analysis) algorithm which represents each face as\
    \ a fusion of `Eigen faces` and any reconstruction is also done by using these\
    \ `Eigen faces`.\n\nIn artificial intelligence approach [[48]](#ref-list.xhtml_refchapter_48),\
    \ a number of tools are used to recognize faces like neural network and machine\
    \ techniques. It means when principle components are extracted from `PCA` algorithm,\
    \ then neural network is used as a classifier in order to reduce components in\
    \ low dimensional space. `SVM` (Support Vector Machine) is the most commonly used\
    \ algorithm in pattern classification. `HMM` (Hidden Markov Model) is also taken\
    \ for face recognition task. The difficulty in using face recognition is it does\
    \ not work under high variability in pose, illumination condition, etc. Problem\
    \ with face recognition under varying pose and illumination condition was addressed\
    \ that’s why robustness is needed by using face geometry to cope with pose and\
    \ illumination conditions. [[48]](#ref-list.xhtml_refchapter_48) So, a combination\
    \ of `PCA+ICA` algorithm is defined in the proposed work for face recognition.\n\
    \n## 2.2 Face Recognition Algorithms](#contents.xhtml_toc2_42)\n\nFace is life’s\
    \ most important visual object that can be used for conveying identification.\
    \ There are a number of algorithms used for face recognition.\n\n### 2.2.1 Principle\
    \ component analysis (PCA)](#contents.xhtml_toc3_43)\n\n`PCA` is a measurable\
    \ strategy that utilizes orthogonal change to change over a set of perceptions\
    \ of possibly connected variables into a bunch of estimations of straightly uncorrelated\
    \ factors are called principal components. The quantity of principal components\
    \ is not exactly or equivalent to the quantity of original variables. This change\
    \ is characterized so that the primary principal component has the biggest possible\
    \ variance (i.e. represents, however, much of the changeability in the information\
    \ as could be expected), and each succeeding part thusly has the most elevated\
    \ difference possible under the limitation that it be orthogonal to (i.e. uncorrelated\
    \ with) the former components [[40]](#ref-list.xhtml_refchapter_40). Principal\
    \ components are destined to be autonomous if the informational collection is\
    \ jointly regularly distributed. `PCA` is touchy to the overall scaling of the\
    \ original variables. Numerous papers of `PCA` are study here and find that, no\
    \ papers are joined with the strategies of `PCA` and the significant model. That\
    \ is the reason this sort of paper is composed where all these things are joined\
    \ together which is straightforward and easy to understand for the beginner. `PCA`\
    \ is a generally utilized mathematical tool for high-dimension data analysis.\
    \ `PCA` has been utilized for face recognition, movement analysis and synthesis,\
    \ bunching and for dimension reduction. It is a very popular algorithm developed\
    \ in 1991 by Turk and Pentland [[49],](#ref-list.xhtml_refchapter_49) which is\
    \ mainly used for reduction of dimensionality in compression-type problems. `PCA`\
    \ originates from `Eigenvector` concept [[49]](#ref-list.xhtml_refchapter_49).\
    \ It is the most important tool used for analysis of data with pattern recognition\
    \ that can be used in image processing. The linear transformation method is used\
    \ by this algorithm in a way to map complete data from higher dimensional space\
    \ into low-dimensional space. In this type of algorithm, real data set’s shape\
    \ and location will be changed if we transform it into different spaces, and it\
    \ is used to calculate better discriminating components without the group’s knowledge.\
    \ It is a technique used statistically for analysis of data and for dimensionality\
    \ reduction. The objective of this algorithm is to take data as a combination\
    \ of a number of components [[49]](#ref-list.xhtml_refchapter_49). A first principle\
    \ component is a linear combination of original dimension along which the variance\
    \ is maximized. A second principle component of original dimension along which\
    \ variance is maximum and which is orthogonal to the first principle component.\
    \ Nth principle component is a linear combination with highest variance subject\
    \ to being orthogonal to n-1 principle components. To decrease the number of variables\
    \ required for recognition of face, a statistical approach is used. Each and every\
    \ image that is present in training set will be represented by a linear combination\
    \ of weighted `Eigen feature vectors`, which are known as `Eigen faces` [[50]](#ref-list.xhtml_refchapter_50).\
    \ A term called as `bias function` is used that represents all the `Eigen vectors`,\
    \ which are generated by a covariance matrix of the given training set. In the\
    \ recognition phase, a new image is projected onto subspace and `Euclidean method`\
    \ is used to calculate distances amongst various facial features for classification\
    \ purpose. `PCA` is also called as `Karhunen Loeve transformation` [[50]](#ref-list.xhtml_refchapter_50).\
    \ It is used to remove dimension and correlation problem and analyzes the data\
    \ patterns by expressing the similarities and differences [[50]](#ref-list.xhtml_refchapter_50).\n\
    \nThe steps taken to implement `PCA` algorithm are as follows:\n\nAll the facial\
    \ images that have been taken are in two dimension says `N*N`. The objective is\
    \ to extract the principal components (`Eigen faces`) that can represent the whole\
    \ faces stored in a training set [[51]](#ref-list.xhtml_refchapter_51). Assume\
    \ the number of images in training set represented by `M` and linear form of every\
    \ image in training sets are represented by `I[n]`.\n\n*   Convert images of the\
    \ training set to image vectors so we map `N*N` into `1*N²` vector.\n*   Normalize\
    \ face vectors, it means to remove all common features from each face so can be\
    \ left with its unique features.\n*   Calculate mean of all face vectors\n   \
    \ $Mean = 1/(M)\\sum_{i = 1}^{M}I_{i}.$\n*   Subtract mean from face vector `I[i]`\
    \ so that normalized face is left.\n    `K[i] = I[i]-mean`\n*   Calculate Eigenvectors\
    \ from the covariance matrix.\n    $C = 1/(M)\\sum_{i = 1}^{M}{Ki \\ast Ki^{T}}\
    \ = B \\ast B^{T}(N^{2} \\ast N^{2})}$\n    where `B = [K[1] K[2]…K[M]]^T` (N²M\
    \ matrix)\n*   Calculate Eigenvectors from reduced covariance matrix `C` or `B*B^T`,\
    \ let it be `u[i]` but `B*B^T` has a very large size and computation of Eigenvectors\
    \ for it is not possible. So, instead find out the Eigenvectors for matrix `B^T*B`.\
    \ Let `v[i]` be the Eigen vectors.\n    Relationship between `v[i]` and `u[i]`\n\
    \    $\\begin{array}{l} {B^{T} \\ast Bv_{i} = I_{i} \\ast v_{i}} \\\\ {B^{T} \\\
    ast B \\ast Bv_{i} = I_{i} \\ast Av_{i}} \\\\ {C \\ast Bv_{i} = I_{i} \\ast Bv_{i}}\
    \ \\\\ {Cu_{i} = I_{i}u_{i}} \\end{array}$\n    where `u[i] = Bv[i]`\n*   Select\
    \ best Eigenfaces that can represent the whole training set.\n*   Convert low-dimensional\
    \ Eigenvectors to original dimensionality.\n*   Represent each face image a linear\
    \ combination of all Eigenvectors. It means each face in training set can be represented\
    \ as a weighted sum of Eigenfaces and mean face.\n*   Recognizing an unknown face.\
    \ To recognize a face image, steps which are followed:\n    1.  First convert\
    \ face image into vector form `I`.\n    2.  Normalize it by subtracting the mean\
    \ from it.\n        `K = I-mean`\n"
