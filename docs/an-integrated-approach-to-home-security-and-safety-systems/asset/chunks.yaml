    图 1.16 面部表情变化。


    ### 1.5.2.2.2 人脸识别算法


    面部是生命中最重要的视觉对象，可用于传达身份。人类基本上利用面部来识别个体。用于人脸识别的方法包括整体法、结构法和混合法。在整体方法中，整个面部区域被作为输入数据引入人脸匹配系统。整体方法的最佳示例之一是特征脸（Eigenfaces，最广泛使用的人脸识别方法）、主成分分析（`PCA`）、线性判别分析（`LCA`）和独立成分分析（`ICA`）等。它使用全局表示，或者说是整个脸部的描述，而不考虑面部的某些局部特征。这种方法进一步分为两部分：统计学和人工智能。在统计学中，图像被表示为二维数组，使用的主要概念是计算输入图像与数据库中其他图像之间的相关参数。这种方法非常昂贵，因为它无法处理姿态、光照等可变条件，第二个缺点是它始终在维维空间中进行分类。为了克服这些问题，可以使用其他方法来获得更准确、更有意义的结果。


    #### 主成分分析 (PCA) 算法


    这是由 Turk 和 Pentland 在 1991 年提出的、非常流行的算法。`PCA` 算法依赖于特征向量概念 [[14]](#ref-list.xhtml_refchapter_14)。使用该算法对图像进行分析，且这些图像必须具有相同的大小。首先应用归一化技术来标记面部眼睛和嘴巴的特征。`PCA`
    算法用于压缩图像，因此说它依赖于降维概念。通过降维，移除不需要的信息，然后将面部结构分解为若干个不相关的组件，这些组件被称为特征脸（Eigenfaces）。每个存储的图像将通过加权特征脸向量的线性求和组合，这些向量被称为特征脸。在识别时，新图像被投影到子空间上，并使用欧几里得方法计算距离以用于分类
    [[15]](#ref-list.xhtml_refchapter_15)。使用 `PCA` 的目的是通过矩阵方法收集数据的重要特征 [[16]](#ref-list.xhtml_refchapter_16)。在人工智能中，利用诸如神经组织和机器程序等工具来感知面部。这意味着当从
    `PCA` 计算中移除引导段时，神经组织被用作分类器将部分减少到低测量空间。`SVM` 是一种用于样本分组问题的计算方法。Gee 也额外用于此。它的缺点是无法在姿态、光照条件等高不确定性情况下工作。


    **优点：**


    * 它是最简单、容易且高效的人脸识别方法。

    * 它在较小或较大的姿态或照明变化下运行良好。

    * 它使用了欧几里得距离概念，并基于降维过程，在保留大部分信息的同时减少了原始识别的维度。

    * 它减少了噪声因素，因为选择了最大变异基，因此会自动忽略背景的微小变化。

    * 它是基于多幅图像作为输入的概念。

    * 它的计算时间较短。


    **缺点：**


    * 对于高维数据数据，它的成本很高。

    * 当姿态、方向、光照等发生巨大变化时，无法以正确的方式实现。


    #### 独立成分分析 (ICA)


    该算法用于分析高阶数据，或者说是多变量数据。该算法使用的主要技术是将高维空间转换为低维空间，使得包含转换变量的新空间能够定义数据的本质特征 [[17]](#ref-list.xhtml_refchapter_17)。聚类分析是该算法中的一种技术。一组数据元素被视为簇，聚类分析被定义为在存在大量集中区域为数据分配空间的技术，该区域被称为簇。


    #### 线性判别分析 (LDA)


    `LDA` 是一种用于分离数据项的技术。在未知类别的情况下，它是一种基于已知用户类别的训练样本进行样本分类的方法。使用 `LDA` 的目的是最大化用户之间的方差，并最小化用户内部的方差。它基本上对相似类别的图像进行聚类，并划分彼此不相似的类别图像。这种技术仅用于分类，但不能用于回归。为了识别输入图像，会将输入图像与数据库中存储的每张图像进行比较，然后计算最近距离，并根据距离识别输入图像。它可以用于模式识别、统计和机器学习。它也被称为基于降维概念的
    Fisher 脸算法。


    **优点：**


    * 它最大化了类间距离，同时最小了类内距离。

    * 它具有鲁棒性。


    **缺点：**


    * 它不将多幅图像作为输入。


    #### 离散余弦变换 (DCT)


    它用于用余弦函数之和表示在不同频率工作的数据项的点序列。这种变换主要用于压缩标准，其中系统接收脸作为输入图像，然后对该脸部进行归一化或裁剪，然后计算脸之间的距离，最后进行比较。


    **优点：**


    * 它在变化较小时运行良好。


    **缺点：**


    * 它在相同方向、姿态、光照等情况下运行良好。

    * 它的成功率并不高。


    #### Gabor 波


    它将图像表征为局部方向选择性和频率选择性特征 [[18]](#ref-list.xhtml_refchapter_18)。这种技术基本上是用于人脸检测的滤波器，以丹尼斯·盖
    abor 的名字命名 [[19]](#ref-list.xhtml_refchapter_19)。


    **优点：**


    * 它在姿态和照明的大变化下运行良好。


    ### 1.5.2.3 手几何结构


    这种方法现在非常流行，因为它在大多数用户识别情景下运行良好。该方法自动测量手和手指的维度，然后将这些测量值与模板进行比较 [[12]](#ref-list.xhtml_refchapter_12)。当人把手放在嵌入传感器的表面上，并使用手指之间的杆子来正确放置手时，就会开始读取，该过程属于空间几何术语。手指或手几何通常测量两个或三个手指，如图图
    1.17


    图 1.17 基于手几何结构的识别。


    ### 1.5.2.4 虹膜扫描


    这种方法通过使用人类虹膜的不同模式来识别用户。虹膜是眼睛内部的一种肌肉，用于控制进入眼睛的光线；它会调节瞳孔的大小，如图图 1.18


