- fmt: '

    Complete security is needed at homes, offices, banks, etc., for providing the
    safety to the users. So, in order to provide security for an individual who is
    living alone at home, voice recognition technique with Similarity Index along
    with the face recognition technique explained in the previous chapter has been
    used. There are three main tasks involved in a voice recognition system named
    as preprocessing, extraction of features and recognition of features. The purpose
    of taking out the features is to extract the features from voice signal and then
    transform them into feature vectors. Each voice recognition system comprises with
    two phases known as: enrollment phase and matching phase. First, in the enrollment
    phase, a voice model is maintained by using the feature modules of the person
    belonging to one of the three categories, i.e., family, friend or neighbor. In
    the matching phase, the feature vectors separated from the unknown person’s sample
    of speech are compared with all samples stored in a database. This gives a value
    of similarity score. The last decision module uses this value of similarity score
    to take the final judgment. The proposed system uses a hybrid combination of `MFCC`
    (Mel Frequency Cepstral Coefficient) with `RASTAA-PLP` (Relative Spectral-Perceptual
    Linear Prediction) for the extraction of features and for classification of data.
    The motive of this proposed research work is to implement a voice recognition
    system, which will work for both text dependant as well as text independent recognition
    technology. The hybrid `MFRASTA` Technique has been implemented in this proposed
    work to obtain improved results in terms of recognition rate. This system is cost
    effective, highly reliable and provides accurate response. In future, security
    measures may be taken into consideration while taking and storing the audio files
    of the person and embedded sensors can be integrated in the proposed model to
    providing safe and comfortable environment. A system can be developed for more
    vocabulary size and accuracy can be enhanced by using speech enhancement technologies.
    The experiments carried out in this proposed work are based on speech samples
    taken in a noise-free environment. But in real-time conditions, a person may speak
    in noisy environment also. So, the effectiveness of the proposed work can further
    further extended by taking this factor into consideration.


    # Chapter 4


    ## Sensor-based health monitoring system uses fingertip application


    DOI: [10.1201/9781003120933-4](https://doi.org/10.1201/9781003120933-4)


    ## 4.1 Introduction to Sensors-Based Services


    Vital signs are the important functions that can be measured for a person. Each
    vital sign is measured by using a number of equipments. In today’s society, there
    are a number of diseases rising very high. Heart failure and heart stroke origin
    a big burden on society due to the high cost of care, lower life quality and premature
    death [[68]](#ref-list.xhtml_refchapter_68). So, there is a need to monitor some
    essential parameters such as `BP`, temperature and heartbeat by cost-effective
    devices for further treatment. In today’s world, a number of ubiquitous devices
    are used named as laptop, PDA, tablets, smart phones, etc. A smart phone is one
    having some advance features except making calls and sending text messages. Users
    can simply use a smart phone having all the computer features on it by simply
    touching or swiping the screen. The use of communication technology and information
    when combined with engineering and medical concepts enables researchers in healthcare
    to increase patient monitoring at home, park, public places, hospitals, etc. In
    hospitals, they are provisions for monitoring the patients, but every time it
    is not possible to go to hospital and in that case, it’s quite hard to handle
    that situation. Children, Adults and old age persons can take the benefits of
    healthcare technology by using customized monitoring. A number of methods are
    there to measure health parameters, for example, `PTT` (pulse transit time) for
    `BP` estimation, but these methods require high complexity devices that are not
    convenient for users to wear [[69]](#ref-list.xhtml_refchapter_69). Heart rate
    and variability in that rate are two important factors which provide information
    related to diseases. Heart rate variability also indicates about strain and anxiety.
    Previous technologies such as heart rate sensor, finger pulse amplitude and electrocardiograms
    (`ECG`) are not applicable now [[69]](#ref-list.xhtml_refchapter_69). Heart rate
    represents how many times a heart beats per minute (`bpm`). Previously, phonocardiograph’s
    devices were used with equipments as microphone, amplifier and filter to record
    sound of the heart.


    There are a number of methods to measure heart rate, but most of the methods are
    uncomfortable. [Figures 4.1](#ch04.xhtml_fig4_1), [4.2](#ch04.xhtml_fig4_2) and
    [4.3](#ch04.xhtml_fig4_3) show the traditional devices used for pulse measurement:
    a) manual way of pulse measurement, b) hand-held pulse oximeter and c) finger
    clip bluetooth oximeter heart beat monitor device.


    ![](images/fig4_1.jpg)

    Figure 4.1 Manual way to measure the pulse.


    ![](images/fig4_2.jpg)

    Figure 4.2 Hand-held pulse oximeter.


    ![](images/fig4_3.jpg)

    Figure 4.3 Finger clip bluetooth oximeter.


    Software applications extract vibration rate from sound of heart documented with
    microphone. The accelerometer is needed to check chest vibration produced by heart’s
    movement. The accelerometer is having the ability to detect acceleration through
    `MEMS` (Micro Electro Mechanical System). Traditional methods include `GPS` (Global
    Positioning System) facility in order to track a patient’s position [[70]](#ref-list.xhtml_refchapter_70),
    but it is highly energy consuming and indoor unavailability device. `GPS` is a
    satellite system that gives time and location related information to the receivers
    of `GPS`. Another method is wearable sensor-based devices such as a wristband,
    chest band and belt with several sensors on the device seems uncomfortable and
    highly irritating.


    When the heart is beating, it is actually pumping blood all over the body and
    that makes the blood volume inside the finger artery to change too. This fluctuation
    of blood can be detected through an optical sensing mechanism placed around the
    fingertip. Heart rate measurement is also possible by using pressure sensors,
    light sensors and sound sensors. First is the pressure sensor that is used to
    detect the changes in pressure near the vibrations produced by the heart. Mainly
    researchers use this method to observe resting heart rate. This sensor is placed
    under the quilt and then changes are detected in the heart rate. It is a most
    popular way of heart rate measurement, which is mainly used when the user is in
    lying state by using sensor closest to the heart. But the drawback with this type
    is the sensitivity of the noise factor. The sound sensors are used to measure
    the sound changes near the heart in which air conductive microphone is used to
    measure the heartbeat parameters without direct contact with the skin and light
    sensors are used to find the changes in optical property of the blood. This method
    uses `LED` in infrared region and `photodiode`, which helps to detect changes
    in volume of blood.

