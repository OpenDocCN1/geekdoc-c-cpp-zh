  trans: '


    - **医疗保健：** 生物识别技术（如指纹扫描器、掌脉读取器、人脸识别技术、虹膜扫描器等）一直在加强患者和员工身份识别方面具有巨大潜力。这有助于可靠地确认患者的身份真实性，确保监护人使用的是正确的临床和分段数据，并保证最合适的代表能够接触正确的数据。尽管如此，生物识别创新在医疗服务中的应用一直有所推迟。无疑，许多急诊诊和中心已经执行了一些基础技术；然而，生物识别尚未完全成为医疗实践的标准。此外，现在仍需要医疗首席安全官（CISO）和生物识别技术供应商投入一些资金和精力，才能使该技术融入标准。


    ## 1.6 基于传感器的技术


    这种技术由一个用于感知人体生命参数的传感芯片组成。它将一种形式的能量转换为另一种形式，并将物理参数转换为电电测量的信号 [26]。传感器用于将温度、心率、汗率和血压等物理参数转换为另一种形式的电学测量信号。以温度为例来解释这项技术：当玻璃温度计中的汞受热膨胀或收缩时，读数由人工测量。使用了多种传感器，如电磁、热学、光学等。过去，传感器的尺寸很大，因此无法以可穿戴技术的形式使用。但现在，微控制器电路、放大器和功能使得可穿戴传感器能够健康监测。传感器和可穿戴设备被杯子、衣服、腰带、手环、眼镜和鞋等许多配件中。可穿戴传感器被证明是有用的，具有优势，例如使用传感器进行数据采集，附在人体上持续监测患者健康，从而减少人为干扰并降低了成本。


    可穿戴传感器是作为配件佩戴在身上的智能设备 [27]。它们可以用于安全、娱乐、商业等多个领域。通过提供可靠准确的信息，它们有助于提供家庭安全。这些设备非常小且轻便，因此
    24/7 全天佩戴也非常舒适。它们用于健康监测，如血压、温度和心率。使用这些传感器可以轻松测量血压，而不是之前的压力袖技术。对于简单的可穿戴无线传感设备，其表示如图
    1.29 所示。人员最近开发出了一种人工智能（AI）分类器，可以使用可穿戴手腕生物传感器检测特定的心血管疾病。


    ```

    images/fig1_29.jpg

    ```


    图 1.29 用于检测心脏病的可穿戴手腕生物传感器。


    有许多传感器可以用于健康监测。主动传感器是需要外部电源供应的传感器，例如光电导电池；而被动传感器是不需要任何外部电源供应的传感器，例如电机械传感器。


    ### 加速度计

    它是一种用于测量沿两个轴加速度的设备，如图 1.30 所示。加速度计尺寸小且价格廉，更易于在现实应用中实施 [28]。存在多种类型的加速度计：a) 压阻式，b)
    压电和 c) 磁电阻，它们通过关键技术概念测量加速度。


    ```

    images/fig1_30.jpg

    ```


    图 1.30 a) SE120 压阻式加速度计，b) CA134 压电式加速度计，c) MAG3110 三轴磁电阻式。


    跌倒检测、活动监测和静止检测是这种传感器的示例，可以轻松实现在智能家居设备中。生物传感器是基于电化学技术的传感器。图像传感器基于 CMOS 技术。这种传感器用于生物识别。


    ### 运动检测器

    它基于红外、超声波和微波技术。当人进入房屋且如果他/她不是授权的人员，此时传感器会检测到异常活动。对于智能家居，这种探测器的目的是感应未经授权的人并立即向家庭成员发送短信
    [29]。运动传感器的目的是检测人的移动，为了这一目的，使用了三种技术：a) 被动红外，b) 超声波和 c) 微波。其中，使用了被动红外技术，它检测人体热量并用于智能家居的安全目的。如果任何类型的物体产生热量，就会产生红外辐射。这是家庭中最常用的形式，例如，如果有人进入房间，传感器会自动打开房间的灯。另外两种技术即超声波和微波属于主动运动传感器。它们都发射声音信号，然后通过测量反射来检测移动。


    ### 远程医疗

    这是一种利用音频和视频技术传输重要信息、收集数据以治疗医疗状况，或在偏远地区提供医疗保健的技术。此前，视频通道的使用已用于基于咨询服务的适当交互 [30]。但现在这项技术已以更广泛的方式扩展。现在它可以用于人工智能和患者教育等许多领域。


    ### 无线频率识别

    这是一种增强数据处理过程的方法，同时也用于通过无线频率信号存储和访问数据 [31]。这种技术可以用于工业、安全系统、制造业和零售等各个领域。


    有三种 RFID 标签：a) 被动标签，b) 半被动标签和 c) 主动标签，如图 1.31 所示。在这里，标签意味着可以使用无线频率信号轻松修改或访问的数据存储。被动
    RFID 标签不需要电源，它使用外部源传输信号。半被动标签也需要外部电源，但主动 RFID 标签需要外部电池。


    ```

    images/fig1_31.jpg

    ```


    图 1.31 RFID 标签类型。


    ## 1.7 泛在环境中的个人护理


    '
- fmt: '

    In a way to make home network more intelligent, smart devices are used with high
    processing and networking abilities. Networking ability means collection of sensors
    that can gather data and transmit that sensed data like temperature, humidity,
    light, etc. Here light means according to light in the home, curtains are moved
    automatically, temperature means to provide smart air conditioning system. An
    owner of the home wants to promote their homes to support these new technologies.
    It is a natural extension of present human computing lifestyle. To make home smart
    is a way designed with new automatic technologies that provides facilities in
    a way to enhance safety, security, etc., of an individual in a way to maintain
    living independently by using smart kitchen, lighting system, etc. The basic and
    important function of developing a smart home is to know about the routine of
    persons and accordingly adapt with that routine. Number of sensors can be used
    for this technology like `RFID`, `temperature sensor`, `pressure sensor`, `door
    sensor`, etc. Technique that is used for wireless communication is `infrared`,
    `radio frequency`, `ZigBee`, `Bluetooth`, etc. `Temperature sensor` is used in
    kitchen to control the oven heat. In order to maintain activities of a person
    like standing, walking and unusual activities like fall detection, blood flow
    can be detected by number of sensors like `impact sensor`, `accelerometer`, etc.
    `Light sensor` allows light to be automatically on and off within a home. `Photocell
    sensor` allows the system to operate in dark environment. `Emergency alarm` can
    be used in smart home for emergency situation when a user wants immediate help.
    By using this device, message is sent automatically to caregivers. Individual
    care is an important factor to provide security and safety to an individual who
    is residing alone at home. So, to obtain this objective, first recognition of
    a person is done by using three modules: `face recognition`, `voice recognition`
    and `similarity index`. Initially, when a person comes and knock at the door,
    face of that person is to be recognized, if face is recognized properly, then
    go to next module, i.e., `voice recognition`. If voice of that person is also
    recognized, then access will be provided to that person who is at door by an individual
    who is alone at home. But, in case, if any one module is not recognized: in that
    case only third module is used, i.e., `similarity index`. It will check the percentage
    that how much percent voice of individual who is at door is matched with stored
    voices in the database. If similarity is greater than equal to `75%`, then it
    is considered that user is recognized else declares unknown user. Last module
    is continuous monitoring the health parameters of that individual who is at home.
    Individual users can feel safer after knowing that they can contact with the people
    they know and can send message in case of emergency by using `MATLAB®` tool and
    `smart phone`. As in today’s world, users have no time to visit doctor again and
    again, so patient requires on the spot monitoring and inform to their caregivers.
    Human health monitoring is emerging as a prominent application of sensor networks.
    Previously, the number of wireless sensors was placed on body of an individual
    and monitors the health parameters such as temperature, blood pressure and heart
    rate. These sensor devices are very tiny, lightweight and easy to carry.


    The technology of smart home proves to be useful for elder persons or working
    women living alone in metros and for disabled persons living individually at home.
    In order to live individually at home in a healthier and safer way, elderly/disabled
    people or women can make use of latest features involved in smart home technology
    like monitoring system as shown in [Figure 1.32](#ch01.xhtml_fig1_32), for fall
    detection or emergency system, etc.


    ![](images/fig1_32.jpg)


    Figure 1.32 Activity monitoring system.


    A reliable emergency system as shown in [Figure 1.33](#ch01.xhtml_fig1_33) must
    be there to monitor the condition of the elder and immediately call the doctor
    and the ambulance in case of emergency and notify the family members [[32]](#ref-list.xhtml_refchapter_32).
    So, the objective is to provide a comfortable environment for all the persons
    living independently at home.


    ![](images/fig1_33.jpg)


    Figure 1.33 Reliable emergency system.


    ### 1.7.1 Neural networks


    Artificial Neural Networks (ANNs) have been constructed with a structure similar
    to the human brain. The weight of an adult human brain weighs approximately 1.5
    kg with a volume of 1260 cubic centimetres. The brain is composed of 200 billion
    neurons connected by 25 trillion synapses, glial cells and blood vessels. The
    neuron can be separated into three parts: cell body (soma), the dendrites and
    the axon as shown in [Figure 1.34](#ch01.xhtml_fig1_34).


    ![](images/fig1_34.jpg)


    Figure 1.34 Structure of biological neurons.


    Every dendrite is contained with thin lines, which will receive signals from neurons
    surrounded by it. Each branch of the dendrite is connected to a single neuron
    with the help of a synapse [[33]](#ref-list.xhtml_refchapter_33). NN is used to
    find patterns with their relationships in the data.


    [Figure 1.35](#ch01.xhtml_fig1_35) shows input neurons and output neurons with
    interconnected weights between them. The first step in this diagram is to take
    data or information with the help of input nodes in numeric expression form. ANN
    is a paradigm used to process the information by taking inspiration from a biological
    nervous system.


    ![](images/fig1_35.jpg)


    Figure 1.35 Structure of ANN.


    Flowchart of ANN in case of pattern recognition is shown in [Figure 1.36](#ch01.xhtml_fig1_36).


    #### Fundamentals of Neural Network


    - **Processing units:** NN system is made up of number of processing units that
    represent neurons in a human brain. The units are divided into different groups
    like input units that receive the data, hidden units to manipulate and transform
    the inputted data and output unit to represent the final decision of NN [[34]](#ref-list.xhtml_refchapter_34).

    - **Weights:** All the units of processing are connected in some way in NN. Every
    connection is having a value of weight on it. The input from a neuron is multiplied
    by the weight of connection which is sending the data, and output value is then
    send into the activation function of the network. If calculated value exceeds
    the threshold value of activation function, then the neuron will be activated
    else it will be inactive.

    - **Computation method:** This method is used to determine a correct output by
    using the activation function. In this, neural network uses threshold logic unit
    to perform the computations. It takes input values from neurons then sum them
    and finally use activation function for the computation.

    - **Supervised training:** This is the first method of training in which a network
    is provided with a series of number of inputs and then compares the targets with
    expected response or proper instruction is given out that will be desired output
    for a given input. The main issue in this is of error generation. It is desirable
    that generated output and desired output must be with minimum difference, e.g.,
    `Hebb net`, `Pattern Association memory`, `Back Propagation network` and `Counter
    propagation network`.

    - **Unsupervised or adaptive training:** The other method of training is called
    unsupervised training in which a network is provided with number of inputs but
    desired targets are not known. The grouping of input data items is maintained
    by the system. This is also called as self-organization or adaption method, e.g.,
    `self-organizing map`, `adaptive resonance theory`, etc.

