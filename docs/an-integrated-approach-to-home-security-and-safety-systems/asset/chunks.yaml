  trans: '


    1. **传感器**：传感器是生物识别框架的主方框，负责收集生物识别所需的所有重要信息。它是框架与现实世界之间的接口。通常，它是一个图像采集框架；但它依赖于它需要替换或保留的亮点或属性。


    2. **传感器数据预处理**：这是第二个方框，执行所有预备工作。它的功能是改进信息并消除来自传感器、基础故障等的干扰。它起到了某种标准化的作用。


    3. **特征提取器和归一化器**：这是生物识别框架中第三个也是主要的步骤。需要进行特征提取以便在后续阶段进行识别。特征提取器的目标是通过估计来描述待感知的对象。


    4. **模板生成器**：模板生成器根据提取出的特征产生用于验证的格式。模板是一个数字向量或具有特定构图的图像。从源数据获得的属性组合成一个模板。模板被存储在数据库中以供分析，并作为匹配器的输入。


    5. **模板比较器**：通过匹配器执行协调阶段。在这一部分，将获取的格式交给匹配器，由匹配器利用不同的算法（例如汉明距离等）将其与存储的模板进行对比。在数据源协调之后，将产生结果。


    6. **识别系统**：这是利用生物识别框架结果的设备。虹膜识别框架和面部识别框架是一些应用设备的简单实例。


    ## 1.5.2 常用生物识别方法


    如图 1.11 所示，目前有多种生物识别方法。生物识别长期以来未来认证的目标，预计生物识别认证将很大程度上取代我们目前的认证和访问控制手段。生物识别技术按所评估的特征类型分类：生理属性或行为特征。


    ![](img/fig1_11.jpg)


    图 1.11 生物特征分类。


    - **生理生物识别**：这些基于根据人体获取的数据对人进行分类，例如其指纹、脸部或眼虹膜。


    ### 1.5.2.1 指纹


    它是用于许多应用程序的生物识别技术之一。它通过指尖上发现的模式来唯一地识别用户 [[12]](#ref-list.xhtml_refchapter_12)。指纹由每个人指尖上的沟谷模式和随后的脊线组成。


    ### 指尖上带有脊线和沟谷的不平表面使得模式具有独特性，如图 1.12a 和 b 所示。指纹被用于用户认证，匹配精度非常高。以前使用的方法是基于旧墨和纸的，但现在生成了自动版本用于识别。在此，用户必须放置手指以便电子读取指纹。如果用户在受控环境中操作，这种技术是最好的。脊线的排列为每个用户形成了独特的指纹，而且数据存储所需的内存较少，但在干燥、皮肤感染和皮肤脏的情况下，有时会导致误识别，它是一个噪声传感器。


    ![](img/fig1_12.jpg)


    图 1.12 a) 手指脊线和谷的图像，b) 手指脊线和谷的真实图像。


    ### 1.5.2.2 人脸识别系统


    面部识别包括几个构成面部特征的特征点。可以通过摄像头捕捉用户的脸部用于验证目的。这是一种通过摄像头自动识别用户的应用 [[13]](#ref-list.xhtml_refchapter_13)。它的主要优势是它可以从特定距离识别用户。该系统安全且易于实现，但姿态和光照的变化会影响图像。由于脸识别技术包含许多特征，它可以用于银行、罪犯识别和恐怖分子识别等各个领域。


    这是一种根据脸部区分他人与其他人的生物识别方法。它涉及如图 1.13 所示的三个主要步骤。


    ![](img/fig1_13.jpg)


    图 1.13 面部识别步骤。


    - **数据采集**：数据采集是人脸识别的主要步骤，通过多种来源收集面部图像。采集的图像会有不同的姿态变化、光照变化等。因此，我们可以很容易根据多种条件验证我们识别系统的性能。有时，会对输入图像进行归一化，并对输入图像应用不同的图像转换方法。在此，去除了不需要的参数（如噪声、照明和模糊效果），然后将其用于后续处理。


    - **特征提取**：特征提取是该系统的下一步，用于通过给定图像提取信息，然后提取出的特征用于识别步骤。在这一步中，使用了降维和噪声清洗。


    - **识别**：识别是特征选择和提取之后的人脸识别系统的下一步，现在使用多个分类器对图像进行分类。在这一步中，获取大量图像并对其应用特征提取，存储在数据库中。当新图像来脸人脸识别时，它首先执行人脸采集、特征提取，然后比较数据库中的所有图像。待测试图像将与数据库中的所有图像进行比较，以识别个人。


    自动人脸识别主要包含两个任务：


    - **验证**：在验证部分，系统将给定用户与其其声称的身份进行关联，并以是或否的形式输出。


    - **识别**：在识别部分，系统将给定用户与数据库中所有其他人进行匹配，并提供匹配列表。


    #### 1.5.2.2.1 面部识别的挑战


    面部识别存在许多挑战，可以通过以下实体定义：


    - **姿态**：姿态变化是面部识别的一个问题，如图 1.14 所示，当人在靠近摄像头时，此时某些特征可能只部分可见或完全关闭，导致误识别 [[13]](#ref-list.xhtml_refchapter_13)。


    - **结构组件**：某些特征如胡须、围巾、络子和眼镜，这些特征可能并不总是存在（如图 1.15 所示），这个问题会影响分类过程。


    - **图像旋转**：面部图像随各种旋转产生波动。


    - **质量**：某些包含噪声或模糊或失真的图像可能会导致人脸识别质量差。


    - **面部表情**：面部表情随人而变化，如图 1.16 所示。


    - **不自然的光照**：来自三维模型（如渲染脸、动画电影和卡通脸）的脸具有不自然的光照。


    '
- fmt: '

    ![](images/fig1_16.jpg)


    Figure 1.16 Facial expression variation.


    ### 1.5.2.2.2 Face recognition algorithms


    Face is life’s most important visual object that can be used for conveying identity.
    Humans basically use faces to detect individuals. The methods used for face recognition
    are holistic, structural and hybrid methods. In holistic approach, the complete
    face region is taken into account as input data into face matching system. One
    of the best examples of holistic methods are Eigenfaces (most widely used method
    for face recognition), principal component analysis (`PCA`), linear discriminant
    analysis (`LCA`) and independent component analysis (`ICA`), etc. It uses global
    representations or we can say descriptions for full face irrespective of some
    local features of face. This method is further divided into two parts: Statistical
    and AI. In statistical, images are represented as two-dimensional arrays and the
    main concept used is to calculate correlation parameter between input image and
    other stored database images. This method is very expensive as it does not work
    on variable conditions like pose, lighting, etc. and second drawback is it performs
    classification always in high dimension space. To overcome these problems, other
    methods can be used in order to gain more accurate and meaningful results.


    #### Principle Component Analysis (PCA) Algorithm


    It is very popular algorithm developed in 1991 presented by Turk and Pentland.
    `PCA` algorithm depends on Eigenvector concept [[14]](#ref-list.xhtml_refchapter_14).
    By using this algorithm, images are taken for the analysis, and these images must
    be of same size. First, a normalization technique is applied to mark the features
    of eyes and mouth from a face. `PCA` algorithm is used to compress the image that’s
    why it is said that it depends on dimensionality reduction concept. From reduction,
    the information that is not required is removed and then decomposes the structure
    of face into number of uncorrelated components which are known as Eigenfaces.
    Every stored image will be combined by a linear sum of weighted Eigen feature
    vectors which are known as Eigen faces. At the time of recognition, new image
    is projected onto subspace and Euclidean method is used for calculating distance
    for classification purpose [[15]](#ref-list.xhtml_refchapter_15). The aim of using
    `PCA` is to collect important features of data by using a matrix method [[16]](#ref-list.xhtml_refchapter_16).
    In AI, quantities of instruments are utilized to perceive face like neural organization
    and machine procedures. It implies when guideline segments are removed from `PCA`
    calculation, at that point, neural organization is utilized as a classifier to
    lessen parts into low measurement space. `SVM` is a calculation utilized for issues
    of example grouping. Gee is additionally utilized for this. Its disadvantage is
    it doesn’t work under high inconstancy in posture, light condition and so on.


    **Advantages:**


    * It is simplest, easy and efficient way of face recognition.

    * It works well in less or more pose or illumination variation.

    * It uses the concept of Euclidean distance, and it is based on the dimensionality
    reduction process, which reduces the dimensions of original recognition while
    retaining the most of information.

    * It reduces the noise factor as the maximum variation basis is chosen and so
    the small variation in background ignored automatically.

    * It is based on multiple images taken as input concept.

    * It takes less computational time.


    **Disadvantages:**


    * It is expensive for high-dimensional data.

    * It does not implement in proper way when there is large variation in pose, orientation,
    illumination, etc.


    #### Independent Component Analysis (ICA)


    This algorithm is used to analyze large order data or we can say multivariable
    data. The main technology that is used in this algorithm is conversion of high-dimensional
    space into low-dimensional space in such a way that new space which is containing
    converted variables will define the essential features of data [[17]](#ref-list.xhtml_refchapter_17).
    Cluster analysis is a technique that is used in this algorithm. A group of number
    of data elements is considered as a cluster and cluster analysis is defined as
    a technique used for allocating space in a region to data where large concentration
    is present and that region is called as cluster.


    #### Linear Discriminant Analysis (LDA)


    `LDA` is a technique used for separation of data items. It is an approach used
    for classification of samples in the case of unknown classes that is based on
    samples of training using classes of known users. The aim of using `LDA` is to
    maximize variance across the users and minimize variance within the users. It
    basically makes clusters of the images of classes that are similar and partitioned
    the images of classes which are dissimilar to each other. This technique is used
    only for classification, but it can’t be used for regression. In order to recognize
    an input image, input image is compared to each and every image that has been
    stored in the database then closest distance is calculated and on the basis of
    distance input image is identified. It can be used in pattern recognition, statistics
    and machine learning. It is also known as Fisher-face- based algorithm that depends
    on dimensionality reduction concept.


    **Advantages:**


    * It maximizes the class distance but distance is minimized within the class.

    * It is robust.


    **Disadvantages:**


    * It does not consider multiple images as input.


    #### Discrete Cosine Transform (DCT)


    It is used to express a sequence of points for data items working at different
    frequencies in terms of sum of cosine functions. This transform is used mainly
    for compression standard in which system receives face as an input image, then
    normalized or crop that face then to calculate distance between faces and finally
    comparison is done.


    **Advantages:**


    * It works well when there is less variation.


    **Disadvantages:**


    * It works well under same orientation, pose, illumination, etc.

    * It is not having high success rate.


    #### Gabor Wavelet


    It characterizes the image as localized orientation selective and frequency selective
    features [[18]](#ref-list.xhtml_refchapter_18). This technique is basically a
    filter used for face detection and it is named after Dennis Gabor [[19]](#ref-list.xhtml_refchapter_19).


    **Advantages:**


    * It works well in large variation in pose and illumination.


    ### 1.5.2.3 Hand geometry


    This method is very popular these days as it works well in most situations for
    user recognition. This method automatically measures the number of dimensions
    of the hand and fingers then compares those measurements to a template [[12]](#ref-list.xhtml_refchapter_12).
    When a person places his hand on the surface embedded with sensors and uses poles
    in between the fingers for proper placement of the hand, a reading is started,
    and this procedure comes under a term called as spatial geometry. Finger or hand
    geometry generally measures two or three fingers as shown in [Figure 1.17](#ch01.xhtml_fig1_17).
    This method has an advantage that it does not require any cooperation from the
    user for identification but problem is its size which is very large.


    ![](images/fig1_17.jpg)


    Figure 1.17 Recognition based on hand geometry.


    ### 1.5.2.4 Iris scan


    This method is used to identify user by using different patterns of human iris.
    Iris is a muscle inside the eye that is used to control the light which is entered
    into the eye; it will regulate the size of pupil as shown in [Figure 1.18](#ch01.xhtml_fig1_18).
    It is an accurate method among other biometric systems as it gives high reliability
    and high recognition rate. It does not require any close contact between user
    and machine. Irises of identical twins are different which an advantage of this
    system is.


    ![](images/fig1_18.jpg)

    '
