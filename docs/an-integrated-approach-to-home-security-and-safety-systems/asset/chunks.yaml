  trans: '


    - 在语音识别方面，通过实施混合 `MFRASTA` 算法，文本依赖型系统提升了 99%，对于已知人员提升了 87%，对于未知人员提升了 75%。与单一的
    `MFCC` 相比，这种组合提供了更高的识别率。结果表明，在噪声环境中，所提的 `MFRASTA` 在鲁棒性条件下使用效果更好。


    - 基于传感器的指端应用通过 `iPhone 6s` 摄像头为心率监测提供了高准确性，并在紧急情况下向其家庭成员发送短信。将该所提应用与许多以前使用的技术进行了比较，最终观察到该方法性能优于以前的方法。


    - 设计了一种人脸和语音实时识别系统，其在识别率方面具有更好的性能。该完整系统在 `MATLAB` 中实现，通过创建 `GUI` 并使用 `3G dongle`
    向用户的手机发送消息来完成。


    ## 6.3 未来工作


    - 当在人脸和语音识别后显示门口人员所属的特定类别时，将同时显示门口人员的姓名。


    - 可接受的图像尺寸为 `512*512`，它们也可以是任何尺寸和任何分辨率。


    - 在健康监测方面，可能会包含其他参数，如压力率、出汗率和温度。


    - 为了确保所提心率监测设备的准确性，可以对具有不同体重和不同年龄组的人群实施实验。


    - 开发更好的算法和合适的传感器，以降低采集失败的率。


