    # LDA 是一种降维技术，用作人脸识别的预处理步骤。其目标是将特征从高维空间投影到低维空间，以避免维度灾难，最重要的是降低成本和资源消耗。LDA 技术由
    Ronald A. Fisher 于 1936 年引入，名称为线性判别分析或 FDA（费舍尔判别分析）。它是模式识别的经典技术之一，该技术用于寻找能够区分物体类别的线性组合特征。结果的组合可以像线性分类器一样使用。费舍尔判别分析也是线性判别分析技术的一部分。在这种分析中，可以使用多种像素值来表示每张脸。LDA
    用于在分类之前通过减少特征数量来创建一个更易于管理的形式。它用于寻找线性变换，使得特征簇具有很高的分离性，这可以通过散度矩阵的分析来实现。该方法基本上用于处理类内频率不相等的情况，我们可以使用任何随机数据集来计算其性能。它通过给定变换，最大化了任何数据集类间方差与类内方差的比值，从而保证了可分性
    [[55]](#ref-list.xhtml_refchapter_55)。该算法通过使用如 图 2.7 所示的变换，在最小化类内散度矩阵的同时最大化类间散度矩阵
    [[43]](#ref-list.xhtml_refchapter_43)。


    ![](img/fig2_7.jpg)


    图 2.7 LDA 中的类别分离。


    使用 LDA 的目的是在寻找子空间时考虑到训练图像的类别成员函数，从而对 PCA 进行改进。它基于这样一个概念：将单幅脸部作为输入，并使用基于马氏距离方法的评分函数
    [[55]](#ref-list.xhtml_refchapter_55)。它的优点是能够最大化簇之间的距离同时最小化簇内距离，但它没有将多图像作为输入。


    ## 算法：


    它与特征脸（Eigenface）算法非常相似，首先；将训练图像投影到子空间。然后，通过将测试图像投影到同一个子空间来计算相似性度量。子空间的测量通过以下定义的步骤进行：


    1. 通过测量属于同一类的项目之间的差异程度来计算类内差异。

    2. 计算类与类之间的差异。

    3. 为两个类别（类内差异和类间差异）计算特征向量和特征值。

    4. 然后，根据其对应的特征值对特征向量从高到低排序，并保留值最高的特征向量。这些特征向量就是费舍尔基向量。

    5. 计算图像与费舍尔基向量的点积。此计算将图像投影到子空间上。一旦训练图像被投影到子空间，就必须收集它们并根据它们之间的远近程度进行分类。计算图像之间的距离可以建立它们的相似性。例如，彼此距离最近的图像可以被认为是接近且相似的，而距离较远的图像则被认为不相似。


    LDA 技术试图通过降维方法对数据集进行判别，LDA 测试阶段的框图如图图 2.8 所示 [[43]](#ref-list.xhtml_refchapter_43)。


    ![](img/fig2_8.jpg)


    图 2.8 LDA 测试阶段的框图。


    ## 2.2.4 离散余弦变换 (DCT)](#contents.xhtml_toc3_46)


    这是精确且稳健的识别系统之一，通过使用不同的归一化方法，可以增加其对脸部几何和光照变化的鲁棒性。能量聚集特性使得 DCT 可用于图像处理和信号分析。DCT
    能够将大部分信号信息压缩到少量的系数中，这就是它被用于面部特征提取的原因。当离散余弦变换应用于脸部图像时，它将提供一个包含低、高频系数的矩阵 [[56]](#ref-list.xhtml_refchapter_56)。DCT
    的性能很大程度上受到矩阵左上角系数幅度变化的影响。在此，在应用特征提取之前，会应用光照归一化以补偿这些系数差异，并将块设置为更更均匀的强度。DCT 是一种用于图像编码的高效技术。为了补偿图像质量，可以忽略某些高频系数。在脸部表情、光照条件等发生变化的情况下，使用二维
    DCT 方法进行特征提取，以提高识别系统的性能。DCT 技术的挑战是现实应用中用于特征提取的光控光照条件。光照归一化（IN）是一种预处理技术，用于补偿不同的光照条件。它由通过余弦函数叠加表示的以不同频率波动的数据点组成
    [[56]](#ref-list.xhtml_refchapter_56)。变换被定义为用于信号转换的操作，即通过逆变换将一个领域转换为另一个领域。该变换用于压缩标准，其中系统接收脸部作为输入图像，然后对脸部进行归一化或裁剪，计算脸部之间的距离，最后进行比较。DCT
    还像其他变换一样尝试使图像数据去相关。在去相关后，每个变换系数都可以独立编码，而不会丢失压缩效率。它在变化较小时工作良好。它在相同朝向、姿态、光照等情况下工作良好，但其成功率并不高。


    ## 2.2.5 Gabor 小波](#contents.xhtml_toc3_47)


    它将图像表征为局部的方向选择性和频率选择性特征。该技术使用滤波器来提取局部特征，这些特征实际上应用于许多图像，并以特定的角度或方向对齐进行提取 [[43]](#ref-list.xhtml_refchapter_44)。该技术以
    Dennis Gabor 命名 [[57]](#ref-list.xhtml_refchapter_57)。它是一种带通线性滤波器，在姿态和光照条件大变化的情况下表现良好。它在空间和频率域上都实现了优的分辨。小波是满足某些数学要求的函数，用于表示数据或其他函数。小波技术用于在不同尺度或分辨率处理数据。如果信号具有较大的窗口，则计算粗略特征；如果信号具有较小的窗口，在这种情况下计算精细特征。小波非常适合近似具有尖锐断层的数据。该技术可以应用于许多领域：天文学、声学、核工程、信号和图像处理、音乐、磁共振成像、语音识别、光学、分形、湍流、地震预测、雷达和人类视觉。图
    2.9 显示了 Gabor 小波技术的框图。


    ![](img/fig2_9.jpg)


    图 2.9 Gabor 小波技术的框图。


    该技术具有许多特性使其在许多应用中具有吸引力：


    * 对光照变化不敏感

    * 对脸部表情变化不敏感

    * 平移和旋转不变性


    尽管有优点，该技术也有一些缺点：


    * 计算复杂度高


    '
- fmt: "\n- Requirement of memory capacity\n- Dimensions of feature vectors are very\
    \ high\n\nPCA with `ICA` algorithms work well in less or more pose, illumination\
    \ variation, etc., and for calculating the distance between facial features, they\
    \ use `Euclidean distance` concept, dimensionality reduction method is used by\
    \ `PCA` algorithm which is necessary for compressing the data while retaining\
    \ useful information. Extraction of independent features is done by `ICA` algorithm,\
    \ but other algorithms do not work well in less or more pose variation, illumination\
    \ variation, etc. `LDA` algorithm does not consider multiple images at a time\
    \ and based on Mahalanobis method for the distance calculation [[57]](#ref-list.xhtml_refchapter_57).\
    \ `DCT` works well only in when there is less variation and `Wavelet` works well\
    \ only in the large variation of pose and illumination factors.\n\n## 2.3 Proposed\
    \ Hybrid PICA Algorithm\n\nAutomatic face recognition has been taken a highly\
    \ active area of research and health monitoring of a person living independently\
    \ at the home in an automatic way is a method which is used to give health-related\
    \ information of individual persons to their family members. [Figure 2.10](#ch02.xhtml_fig2_10)\
    \ provides an integrated model for face recognition.\n\n![](images/fig2_10.jpg)\n\
    \nFigure 2.10 Integrated PICA model for face recognition.\n\nA combined approach\
    \ of `PCA` + `ICA` is used for feature extraction in our work as this approach\
    \ helps in obtaining our objective with high recognition rate as compared to individual\
    \ feature extraction techniques and with this combination; a neural network named\
    \ as `back propagation` is used as a classifier. The evolution of `PCA` [[58]](#ref-list.xhtml_refchapter_58)\
    \ is done by using `Eigenvectors` and with the help of these `Eigenvectors`, features\
    \ are considered for a given input, which is called as principle components. Its\
    \ advantage is a dimensionality reduction process that includes the data compression,\
    \ but there is no loss of information.\n\n`ICA` is a technique that is very useful\
    \ [[58]](#ref-list.xhtml_refchapter_58). A feedforward neural network is a simple\
    \ network consists of three layers: a) the input layer, b) hidden layer and c)\
    \ output layer.\n\nMost of the work done in the face recognition system previously\
    \ consists of single feature extraction technique with classifier, but in the\
    \ proposed work four step procedure has been used.\n\n1. A training set is taken\
    \ and its preprocessing is done in which images are normalized using different\
    \ methods such as `PCA` and `DCT`.\n2. Independent features are extracted by using\
    \ two face recognition algorithms `PCA` + `ICA` in combination.\n3. Feedforward\
    \ neural network is chosen for classification that classifies a given input image.\n\
    4. The output of each neural network is combined to classify input image that\
    \ defines the category of that input image.\n\n### Proposed Hybrid PICA Algorithm:\n\
    \n1. First a training set is established.\n2. Then, `mark features` function on\
    \ training set is applied to mark eye and mouth position of the input image.\n\
    3. Apply `align faces` function to convert the face images in `pgm` format from\
    \ `JPG` format as `pgm` format is supported by `MATLAB` tool.\n4. A matrix named\
    \ as `C` is used to store all the images.\n5. To apply the `PCA` function:\n \
    \   * To center the data: Every trained image is centered by taking each of the\
    \ training images subtracted from the mean image and stored in a matrix named\
    \ as `A`.\n    * To calculate covariance matrix: Centered images in the matrix\
    \ `A` are multiplied by its transpose to form a `Covariance matrix` `L`. The size\
    \ of this matrix is $N^2*N^2$, if each image is of size $N*N$.\n      `L = A *\
    \ A'`\n    * To calculate `Eigenvectors`: Finding `Eigenvectors` of $N^2*N^2$\
    \ matrix are intractable. So, use of matrix `A'*A` is easy to calculate `Eigenvectors`.\n\
    \      $C = 1/(M)\\sum\\limits_{i = 1}^{M}{Ki \\ast Ki^{T} = B \\ast B^{T}(N^{2}\
    \ \\ast N^{2}matrix)}$\n6. To apply `ICA` algorithm: From previously calculated\
    \ `Eigenvectors`, `ICA` is analyzed with the help of centering and learning.\n\
    \    * Centering: It means sphering of `x` or description as to remove first-\
    \ and second- order stats from `x`.\n    * Learning: To calculate `Xx` that holds\
    \ original data.\n      `Xx = inv(wz) * x`\n    * To calculate output covariance:\
    \ It is calculated by using the mean extracted and original data.\n      `Cov(xx')`\n\
    \      where `uu = w * wz * xx`\n    * The threshold value is set and results\
    \ are shown.\n7. Send text message to category members using `MATLAB` tools and\
    \ a 3G dongle.\n\n## 2.4 Implementation\n\nTo measure the performance of `PCA`\
    \ and `ICA`, a code for the hybrid PICA algorithm is generated using a `MATLAB`\
    \ tool. This tool is preferred in order to increase the recognition rate as compared\
    \ to implementation in `C` or `Java` language. A combination of principal component\
    \ analysis (`PCA`) with independent component analysis face recognition algorithms\
    \ [[58]](#ref-list.xhtml_refchapter_58) is used for facial feature extraction\
    \ and as a classifier or to recognize a face, feedforward neural network [[57]](#ref-list.xhtml_refchapter_57),\
    \ [[58]](#ref-list.xhtml_refchapter_58).\n\n**PCA implementation**: `PCA` algorithm\
    \ consists of two functions: `PcaFn.m` and `Test.m`. `PcaFn.m` is responsible\
    \ for initialization of algorithm, training of data and projection of images on\
    \ low-dimensional subspace.\n\nIn this, input contains the data set of preprocessed\
    \ images. The output contains data in a matrix form, mean of images, Eigenvalues\
    \ and low-dimensional subspace.\n\nSteps of `PCA` implementation:\n* Read face\
    \ images from a path, reshape them into vector form and creates a matrix `C`.\n\
    * Create a training data list, which contains images from the data set.\n* Calculate\
    \ mean of images.\n* Subtract mean from all the images and save the results.\n\
    * Calculate `Eigenvectors` and `Eigenvalues`.\n* Calculate `Eigenfaces`.\n* Projection\
    \ of face images onto low-dimensional subspace.\n\n`Test.m` is responsible for\
    \ image recognition. It reads the image and calculates the difference between\
    \ image to be tested and all the other images in the database. Image with shortest\
    \ distance is considered as a recognized image.\n\nIn this function, input contains\
    \ the path of the image, mean of image, low-dimensional subspace and output provides\
    \ a matching score and associated image from database.\n\n**ICA implementation**:\
    \ `ICA` algorithm consists of five functions: `PcabigFn.m`, `spherex`, `zeromn`,\
    \ `runica` and `sep96`. `PcabigFn.m` is responsible to compute `PCA` by calculating\
    \ covariance matrix and reconstructing `Eigen vectors` of the smaller covariance\
    \ matrix.\n\nIn this algorithm, input contains a matrix `C` with faces images\
    \ presented in columns of the matrix and output contains `V`, `R`, `E`. `V` means\
    \ a matrix containing `Eigenvectors` in the columns, `R` means PCA coefficients\
    \ in its row and `E` means a matrix that contains Eigenvalues associated with\
    \ Eigenvectors.\n\n`runica` is used to run an algorithm named as info max in order\
    \ to find n independent components, where n represents the number of input face\
    \ images provided to the algorithm. In this, input contains a class having a matrix\
    \ `x` containing gray values of images in rows and output contains `w` & uu`,\
    \ where `w` means a matrix containing independent components and `uu` means separated\
    \ output signals.\n\n`spherex` is used by `runica` function. It spheres the training\
    \ vector `x` by passing it through a whitening matrix `w[z]`. In this, input contains\
    \ a function required `x` to be predefined and output contains `w[z]` & `x`, where\
    \ `w[z]` is a whitening matrix of.\n"
  raw: "*   Requirement of memory capacity\n\n*   Dimensions of feature vectors are\
    \ very high\n\nPCA with ICA algorithms work well in less or more pose, illumination\
    \ variation, etc., and for calculating the distance between facial features, they\
    \ use Euclidean distance concept, dimensionality reduction method is used by PCA\
    \ algorithm which is necessary for compressing the data while retaining useful\
    \ information. Extraction of independent features is done by ICA algorithm, but\
    \ other algorithms do not work well in less or more pose variation, illumination\
    \ variation, etc. LDA algorithm does not consider multiple images at a time and\
    \ based on Mahalanobis method for the distance calculation [[57]](#ref-list.xhtml_refchapter_57).\
    \ DCT works well only in when there is less variation and Wavelet works well only\
    \ in the large variation of pose and illumination factors.\n\n## [2.3 Proposed\
    \ Hybrid PICA Algorithm](#contents.xhtml_toc2_48)\n\nAutomatic face recognition\
    \ has been taken a highly active area of research and health monitoring of a person\
    \ living independently at the home in an automatic way is a method which is used\
    \ to give health-related information of individual persons to their family members.\
    \ [Figure 2.10](#ch02.xhtml_fig2_10) provides an integrated model for face recognition.\n\
    \n![](images/fig2_10.jpg)\n\nFigure 2.10 Integrated PICA model for face recognition.\n\
    \nA combined approach of PCA + ICA is used for feature extraction in our work\
    \ as this approach helps in obtaining our objective with high recognition rate\
    \ as compared to individual feature extraction techniques and with this combination;\
    \ a neural network named as back propagation is used as a classifier. The evolution\
    \ of PCA [[58]](#ref-list.xhtml_refchapter_58) is done by using Eigenvectors and\
    \ with the help of these Eigenvectors, features are considered for a given input,\
    \ which is called as principle components. Its advantage is a dimensionality reduction\
    \ process that includes the data compression, but there is no loss of information.\n\
    \nICA is a technique that is very useful [[58]](#ref-list.xhtml_refchapter_58).\
    \ A feedforward neural network is a simple network consists of three layers: a)\
    \ the input layer, b) hidden layer and c) output layer.\n\nMost of the work done\
    \ in the face recognition system previously consists of single feature extraction\
    \ technique with classifier, but in the proposed work four step procedure has\
    \ been used.\n\n1.  A training set is taken and its preprocessing is done in which\
    \ images are normalized using different methods such as PCA and DCT.\n\n2.  Independent\
    \ features are extracted by using two face recognition algorithms PCA + ICA in\
    \ combination.\n\n3.  Feedforward neural network is chosen for classification\
    \ that classifies a given input image.\n\n4.  The output of each neural network\
    \ is combined to classify input image that defines the category of that input\
    \ image.\n\nProposed Hybrid PICA Algorithm:\n\n1.  First a training set is established.\n\
    \n2.  Then, mark features function on training set is applied to mark eye and\
    \ mouth position of the input image.\n\n3.  Apply align faces function to convert\
    \ the face images in pgm format from JPG format as pgm format is supported by\
    \ MATLAB® tool.\n\n4.  A matrix named as C is used to store all the images.\n\n\
    5.  To apply the PCA function:\n\n    *   To center the data: Every trained image\
    \ is centered by taking each of the training images subtracted from the mean image\
    \ and stored in a matrix named as A.\n\n    *   To calculate covariance matrix:\
    \ Centered images in the matrix ‘A’ are multiplied by its transpose to form a\
    \ Covariance matrix L. The size of this matrix is N²*N², if each image is of size\
    \ N*N.\n\n        *L* = *A* * *A*^′\n\n    *   To calculate Eigenvectors: Finding\
    \ Eigenvectors of N²*N² matrix are intractable. So, use of matrix A’*A is easy\
    \ to calculate Eigenvectors.\n\n        $C = 1/(M)\\sum\\limits_{i = 1}^{M}{Ki\
    \ \\ast Ki^{T} = B \\ast B^{T}(N^{2} \\ast N^{2}matrix)}$\n\n6.  To apply ICA\
    \ algorithm: From previously calculated Eigenvectors, ICA is analyzed with the\
    \ help of centering and learning.\n\n    *   Centering: It means sphering of x\
    \ or description as to remove first- and second- order stats from x.\n\n    *\
    \   Learning: To calculate Xx that holds original data.\n\n        *X**x* = *i**n**v*(*w**z*) * *x*\n\
    \n    *   To calculate output covariance: It is calculated by using the mean extracted\
    \ and original data.\n\n        *C**o**v*(*x**x*^′)\n\n        where *u**u* = *w* * *w**z* * *x**x*\n\
    \n    *   The threshold value is set and results are shown.\n\n7.  Send text message\
    \ to category members using MATLAB tools and a 3G dongle.\n\n## [2.4 Implementation](#contents.xhtml_toc2_49)\n\
    \nTo measure the performance of PCA and ICA, a code for the hybrid PICA algorithm\
    \ is generated using a MATLAB tool. This tool is preferred in order to increase\
    \ the recognition rate as compared to implementation in C or Java language. A\
    \ combination of principal component analysis (PCA) with independent component\
    \ analysis face recognition algorithms [[58]](#ref-list.xhtml_refchapter_58) is\
    \ used for facial feature extraction and as a classifier or to recognize a face,\
    \ feedforward neural network [[57]](#ref-list.xhtml_refchapter_57), [[58]](#ref-list.xhtml_refchapter_58)\
    \ is used.\n\n**PCA implementation**: PCA algorithm consists of two functions:\
    \ PcaFn.m and Test.m. PcaFn.m is responsible for initialization of algorithm,\
    \ training of data and projection of images on low-dimensional subspace.\n\nIn\
    \ this, input contains the path of data set of all preprocessed images and path\
    \ of images in training list. The output contains data in a matrix form, mean\
    \ of images, Eigenvalues and low-dimensional subspace.\n\nSteps of PCA implementation:\n\
    \n*   Read face images from a path, reshape them into vector form and creates\
    \ a matrix C.\n\n*   Create a training data list, which contains images from the\
    \ data set.\n\n*   Calculate mean of images.\n\n*   Subtract mean from all the\
    \ images and save the results.\n\n*   Calculate Eigenvectors and Eigenvalues.\n\
    \n*   Calculate Eigenfaces.\n\n*   Projection of face images onto low-dimensional\
    \ subspace.\n\nTest.m is responsible for image recognition. It reads the image\
    \ and calculates the difference between image to be tested and all the other images\
    \ stored in the database. Image with shortest distance is considered as a recognized\
    \ image.\n\nIn this function, input contains the path of the image, mean of image,\
    \ low-dimensional subspace and output provides a matching score and associated\
    \ image from database.\n\nICA implementation–ICA algorithm consists of five functions:\
    \ PcabigFn.m, spherex, zeromn, runica and sep96. PcabigFn.m is responsible to\
    \ compute PCA by calculating covariance matrix and reconstructing Eigen vectors\
    \ of the smaller covariance matrix.\n\nIn this algorithm, input contains a matrix\
    \ C with faces images presented in columns of the matrix and output contains V,\
    \ R, E. V means a matrix containing Eigenvectors in the columns, R means PCA coefficients\
    \ in its row and E means a matrix that contains Eigenvalues associated with Eigenvectors.\n\
    \nRunica is used to run an algorithm named as info max in order to find n independent\
    \ components, where n represents the number of input face images provided to the\
    \ algorithm. In this, input contains a class having a matrix x containing gray\
    \ values of images in rows and output contains w & uu, where w means a matrix\
    \ containing independent components and uu means separated output signals.\n\n\
    Spherex is used by runica function. It spheres the training vector x by passing\
    \ it through a whitening matrix w[z]. In this, input contains a function required\
    \ x to be predefined and output contains w[z] & x, where w[z] is a whitening matrix\
    \ of."
