    ## Challenges in Biometrics


    - **Difficult implementation**: It is not an easy task to implement a reliable
    biometric system. The teams of researcher’s work regularly for a safe and reliable
    implementation of the biometric system. Some of the parts of the system have already
    been done as finger print recognition, face recognition and specially the case
    of voice recognition. The security till date is not high.


    - **Cooperation unwillingness**: Some persons are not willing with acquiring their
    biometrical features. Most of the people dislike scanning their retinas, scanning
    their fingerprints and faces and the least of them dislike recording of their
    voices. It is clear then that it would be very useful to develop a reliable technology
    based upon the voice processing.


    - **Inconstancy**: Some of the biometric features are permanent but some are not
    as well. As the human voice is not fixed during the whole life. This can be the
    greatest problem. Some other features may also have instability like height.


