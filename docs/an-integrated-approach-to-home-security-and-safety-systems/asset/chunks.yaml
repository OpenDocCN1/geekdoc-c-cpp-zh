  raw: 'The voice of the person at the door is captured and stored in an audio file
    and the features extracted from this audio file are stored in a matrix form in
    the database. Features of audio files are calculated by using the cepstral coefficients
    formula, i.e., ceps1-ceps2\. The difference between cepstral coefficients of recently
    obtained audio file and each audio file already stored in the database is obtained.
    After subtraction, the mfcc value is calculated that decides the category to which
    the person at door belongs and stored in a variable t.


    [Figure 3.18](#ch03.xhtml_fig3_18) shows the matrix created to calculate the recently
    obtained audio file cepstral coefficients named as ceps1, and [Figure 3.19](#ch03.xhtml_fig3_19)
    shows the matrix form of the each prestored audio file cepstral coefficients named
    as ceps 2\. These values are stored in a matrix in the form of rows and columns.


    ![](images/fig3_18.jpg)


    Figure 3.18 Matrix form of cepstal coefficients.


    ![](images/fig3_19.jpg)


    Figure 3.19 Matrix form of second cepstral coefficients.


    After subtraction, variable t will provide the results in another matrix as shown
    in [Figure 3.20](#ch03.xhtml_fig3_20), and finally the category to which the person
    belongs is displayed on the screen as previously shown in [Figure 3.17](#ch03.xhtml_fig3_17).


    ![](images/fig3_20.jpg)


    Figure 3.20 Result in a matrix form.


    **Text Independent Voice Recognition (Similarity Index):** This technique is taken
    into consideration when any one of two above mentioned and used techniques that
    are face recognition and voice recognition technique fails to recognize the person
    correctly or accurately. It is a text-independent voice recognition technique
    used to recognize voice based upon voice features such as pitch, speaking rate,
    voice modulation and frequency, irrespective of the text or content spoken by
    the person at the door. The voice features of person at door are compared with
    voice features of persons belonging to all four categories. If the difference
    between the features of voice of the person at the door and the features of voice
    of any of the stored voices is less than or equal to 0.014, voice is matched else
    that person is identified as belonging to unknown category as shown in [Figure
    3.20](#ch03.xhtml_fig3_20). This value considered for Similarity index, i.e.,
    0.014 is considered as threshold value for recognition. If similarity index is
    greater than or equal to 75%, then only the person at door will be declared as
    known person and the category to which he/she belongs will be displayed on the
    screen and depending upon the category he/she belongs, a text message will be
    sent to the concerned persons belonging to family, friend and neighbor categories
    and if the value of similarity index is less than 75%, no message would appear
    at the bottom of the window in MATLAB since the person at door belongs to unknown
    category.


    [Figures 3.21](#ch03.xhtml_fig3_21) and [3.22](#ch03.xhtml_fig3_22) show the output
    based upon values of similarity index. [Figure 3.22](#ch03.xhtml_fig3_22) depicts
    a person as belonging to the category ‘Unknown,’ and [Figure 3.23](#ch03.xhtml_fig3_23)
    depicts a person as belonging to category ‘Family,’ respectively.


    ![](images/fig3_21.jpg)


    Figure 3.21 Similarity index testing based on voice frequency patterns.


    ![](images/fig3_22.jpg)


    Figure 3.22 Result of similarity index for person belonging to “unknown” category.


    ![](images/fig3_23.jpg)


    Figure 3.23 Result of similarity index for person belonging to “family” category.


