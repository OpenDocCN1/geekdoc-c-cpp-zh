  trans: "\n\n*   参考模板所需的空间较小。\n*   带约束的最优路径查找。\n*   高识别率。\n*   在出错的情况下，使用阈值。\n\n\
    ### 缺点：\n*   选择合适的参考具有挑战性。\n\n![](img/fig3_12.jpg)\n\n图 3.12 DWT 技术基本图。\n\n###\
    \ 3.3.7 小波](#contents.xhtml_toc3_62)\n\n众所周知，语音中的信号是非平稳的 [[66]](#ref-list.xhtml_refchapter_66)。对于非平稳信号，`Fourier\
    \ transform` 不适用于分析目的，其结果仅为信号提供频率数据，而没有提供关于时间方面的数据（即在什么时间出现了什么频率）。因此，使用了窗窗短时傅里叶变换，它提供了与信号频率内容相关的时间数据。\n\
    \n#### 应用：\n*   信号处理。\n*   数据压缩。\n*   语音识别。\n*   计算机图形和多分形分析。\n\n## 3.4 提提出的混合\
    \ MFRASTA 技术](#contents.xhtml_toc2_63)\n\n语音信号不仅提供了关于所说单词或句子的信息，还提供了说话者的状态。语音识别是提供有用信息的一种有效方法。特征提取在计算语音识别系统的有效性方面发挥着重要作用。必须从语音中消除冗余信息，只留下相关特征。在提出的工作中，已知和未知人员的音频文件被记录为\
    \ `.wav` 格式。使用了两个名为 `voicecompare` 和 `voicecompareH` 的函数。这项工作的主函数是 `voicecompareH`。在所有之前的工作中，名为\
    \ `voicecompare` 的函数，通过单一特征提取技术（即 `MFCC`）比较两个音频文件，但在提出的工作中，使用了 `voicecompareH`\
    \ 模块，它是 `MFCC+RASTA-PLP` 技术的混合组合。用于比较音频文件的技术如图 3.13 所示，并据此做出决策。该过程从一个人开始；此人将说出一个特定的密码问题及其答案。如果该问题和答案与数据库中的存储值相似，则识别出该人员。最后，识别他属于数据库中提出的四个类别（即家人、朋友、邻居和未知）中的哪一类。\n\
    \n![](img/fig3_13.jpg)\n\n图 3.13 用于语音识别的混合 MFRASTA 方法。\n\n传统上，语音识别系统由单一特征提取技术和分类器组成，但在本提出的工作中，需要遵循以下四个步骤：\n\
    \n*   获取训练集并进行预处理，通过使用不同的方法以 `.wav` 格式记录音频文件。\n*   特征提取步骤提取从语音信号中提供特定信息的特征。通过两种语音识别算法\
    \ `MFCC` 和 `RASTA-PLP` 提取了特征。\n*   合并所有输出并对输入语音进行分类，判断其已知未知。\n*   发送消息以定义每个输入语音的类别。该混合算法的步骤以流程的形式表示，如图\
    \ 3.14 所示。\n\n![](img/fig3_14.jpg)\n\n图 3.14 混合算法流程图。\n\n## 3.5 相似性指数](#contents.xhtml_toc2_64)\n\
    \n传统上，语音识别系统由单一特征提取技术和分类器组成，但在本提出的工作中，需要遵循以下四个步骤：\n\n1.  获取训练集并进行预处理，通过使用不同的方法以\
    \ `.wav` 格式记录音频文件。\n    *   `Voice_Rec`: 在这一步中记录音频文件。\n    *   `voicecompare`:\
    \ 用于比较音频文件。\n    *   `voicecompareH`: 用于混合比较的主函数。\n2.  特征提取步骤提取从语音信号中提供特定信息的特征。通过两种语音识别算法\
    \ `MFCC` 和 `RASTA-PLP` 提取了特征。\n3.  合并所有输出并对输入语音进行分类，判断其已知未知。\n4.  发送消息以定义每个输入语音的类别。\n\
    \n## 3.6 实现](#contents.xhtml_toc2_65)\n\n语音信号不仅提供了关于所说单词或句子的信息，还提供了说话者的状态。语音识别是提供有用信息的一种有效方法。特征提取在计算语音识别系统的有效性方面发挥着重要作用。必须从语音中消除冗余信息，只留下相关特征。在提出的工作中，已知和未知人员的音频文件被记录为\
    \ `.wav` 格式。使用了两个名为 `voicecompare` 和 `voicecompareH` 的函数。这项工作的主函数是 `voicecompareH`。在所有之前的工作中，名为\
    \ `voicecompare` 的函数，通过单一特征提取技术（即 `MFCC`）比较两个音频文件，但在提出的工作中，使用了 `voicecompareH`\
    \ 模块，它是 `MFCC+RASTA-PLP` 技术的混合组合。用于比较音频文件的技术如图 3.13 所示，并据此做出决策。该过程从一个人开始；此人将说出一个特定的密码问题及其答案。如果该问题和答案与数据库中的存储值相似，则识别出该人员。最后，识别他属于数据库中提出的四个类别（即家人、朋友、邻居和未知）中的哪一类。\n\
    \n传统上，语音识别系统由单一特征提取技术和分类器组成，但在本提出的工作中，需要遵循以下四个步骤：\n\n*   获取训练集并进行预处理，通过使用不同的方法以\
    \ `.wav` 格式记录音频文件。\n*   特征提取步骤提取从语音信号中提供特定信息的特征。通过两种语音识别算法 `MFCC` 和 `RASTA-PLP`\
    \ 提取了特征。\n*   合并所有输出并对输入语音进行分类，判断其已知未知。\n*   发送消息以定义每个输入语音的类别。该混合算法的步骤以流程的形式表示，如图\
    \ 3.14 所示。\n\n#### 梅尔频率系数与感知线性预测：\n`Fourier transform` 用于频率分析。对于非平稳信号，`Fourier\
    \ transform` 不适用于分析目的，其结果仅为信号提供频率数据，而没有提供关于时间方面的数据（即在什么时间出现了什么频率）。因此，使用了窗窗短时傅里叶变换，它提供了与信号频率内容相关的时间数据。\n\
    \n#### 处理步骤：\n*   `Voice_Rec`: 在这一步中记录音频文件。\n*   `voicecompare`: 用于比较音频文件。\n*\
    \   `voicecompareH`: 用于混合比较的主函数。\n\n#### 基于内容的识别：\n门口门口的语音被捕获并与所有存储的语音进行比较，以找出该人员所属的类别，如图\
    \ 3.16 所示。\n\n#### 表 3.1 类别及其对应的接收方\n| 序号 | 类别 | 消息接收方 |\n| --- | --- | --- |\n\
    | 1 | 家人 | 家人 + 邻居 |\n| 2 | 朋友 | 家人 + 朋友 |\n| 3 | 邻居 | 家人 + 邻居 |\n| 4 | 未知 | 家人\
    \ + 邻居 |\n\n"
- fmt: '

    The voice of the person at the door is captured and stored in an audio file and
    the features extracted from this audio file are stored in a matrix form in the
    database. Features of audio files are calculated by using the cepstral coefficients
    formula, i.e., `ceps1-ceps2`. The difference between cepstral coefficients of
    recently obtained audio file and each audio file already stored in the database
    is obtained. After subtraction, the `mfcc` value is calculated that decides the
    category to which the person at door belongs and stored in a variable `t`.


    [Figure 3.18](#ch03.xhtml_fig3_18) shows the matrix created to calculate the recently
    obtained audio file cepstral coefficients named as `ceps1`, and [Figure 3.19](#ch03.xhtml_fig3_19)
    shows the matrix form of the each prestored audio file cepstral coefficients named
    as `ceps 2`. These values are stored in a matrix in the form of rows and columns.


    ![](images/fig3_18.jpg)


    Figure 3.18 Matrix form of cepstal coefficients.


    ![](images/fig3_19.jpg)


    Figure 3.19 Matrix form of second cepstral coefficients.


    After subtraction, variable `t` will provide the results in another matrix as
    shown in [Figure 3.20](#ch03.xhtml_fig3_20), and finally the category to which
    the person belongs is displayed on the screen as previously shown in [Figure 3.17](#ch03.xhtml_fig3_17).


    ![](images/fig3_20.jpg)


    Figure 3.20 Result in a matrix form.


    ### Text Independent Voice Recognition (Similarity Index)


    This technique is taken into consideration when any one of two above mentioned
    and used techniques that are face recognition and voice recognition technique
    fails to recognize the person correctly or accurately. It is a text-independent
    voice recognition technique used to recognize voice based upon voice features
    such as pitch, speaking rate, voice modulation and frequency, irrespective of
    the text or content spoken by the person at the door. The voice features of person
    at door are compared with voice features of persons belonging to all four categories.
    If the difference between the features of voice of the person at the door and
    the features of voice of any of the stored voices is less than or equal to 0.014,
    voice is matched else that person is identified as belonging to unknown category
    as shown in [Figure 3.20](#ch03.xhtml_fig3_20). This value considered for Similarity
    index, i.e., 0.014 is considered as threshold value for recognition. If similarity
    index is greater than or equal to 75%, then only the person at door will be declared
    as known person and the category to which he/she belongs will be displayed on
    the screen and depending upon the category he/she belongs, a text message will
    be sent to the concerned persons belonging to family, friend and neighbor categories
    and if the value of similarity index is less than 75%, no message would appear
    at the bottom of the window in MATLAB since the person at door belongs to unknown
    category.


    [Figures 3.21](#ch03.xhtml_fig3_21) and [3.22](#ch03.xhtml_fig3_22) show the output
    based upon values of similarity index. [Figure 3.22](#ch03.xhtml_fig3_22) depicts
    a person as belonging to the category ‘Unknown,’ and [Figure 3.23](#ch03.xhtml_fig3_23)
    depicts a person as belonging to category ‘Family,’ respectively.


    ![](images/fig3_21.jpg)


    Figure 3.21 Similarity index testing based on voice frequency patterns.


    ![](images/fig3_22.jpg)


    Figure 3.22 Result of similarity index for person belonging to “unknown” category.


    ![](images/fig3_23.jpg)


    Figure 3.23 Result of similarity index for person belonging to “family” category.


    ## 3.7 Results and Discussion](#contents.xhtml_toc2_66)


    In this section, the proposed hybrid MFRASTA technique has been compared with
    the individual MFCC method and the comparison of MFRASTA technique with the individual
    MFCC method in terms of recognition rate by taking 30–50 audio files into consideration
    has been done as depicts in [Table 3.2](#ch03.xhtml_table3_2). [Table 3.3](#ch03.xhtml_table3_3)
    represents the percentage of accuracy obtained in case of the similarity index
    by taking a set of 15 known and 15 unknown persons. It is summarized that the
    proposed hybrid technique surpasses the previously used individual algorithms
    or techniques.


    Table 3.2 Comparison of proposed hybrid MFRASTA with individual MFCC in terms
    of recognition rate


    | No. of samples | MFCC | MFRASTA |

    | --- | --- | --- |

    | I(30) | 90 | 99 |

    | II(40) | 90 | 99 |

    | III(50) | 92 | 99 |


    Table 3.3 Accuracy table for similarity index of known and unknown persons


    | Samples of persons | No. of samples | Correct answer | Incorrect answer | Accuracy
    |

    | --- | --- | --- | --- | --- |

    | Known | 15 | 11 | 04 | 73 |

    | Unknown | 15 | 14 | 01 | 93 |


    [Figure 3.24](#ch03.xhtml_fig3_24) shows the performance graph of individual MFCC
    in terms of recognition rate.


    ![](images/fig3_24.jpg)


    Figure 3.24 Voice testing based upon content.


    [Figure 3.25](#ch03.xhtml_fig3_25) shows the performance graph for the proposed
    hybrid MFRASTA technique along with individual MFCC by taking a parameter of recognition
    rate.


    ![](images/fig3_25.jpg)


    Figure 3.25 Performance graph for proposed hybrid MFRASTA technique and individual
    MFCC in terms of recognition rate.


    [Figure 3.26](#ch03.xhtml_fig3_26) shows the performance graph of the similarity
    index for individual MFCC in terms of recognition rate.


    ![](images/fig3_26.jpg)


    Figure 3.26 Recognition rate graph for similarity index using individual MFCC.


    [Figure 3.27](#ch03.xhtml_fig3_27) shows the correlation of the proposed hybrid
    MFRASTA technology with individual MFCC for similarity index in terms of percentage
    of accuracy which shows 73% recognition rate for known persons and the 93% recognition
    rate for unknown persons.


    ![](images/fig3_27.jpg)


    Figure 3.27 Comparison of recognition rate between individual MFCC and hybrid
    MFRASTA technique in terms of recognition rate.


    Finally, messages are sent to the concerned persons belonging to concerned categories
    through a dongle preregistered number as shown in [Figure 3.28](#ch03.xhtml_fig3_28).
    A number of persons belonging to different categories can receive the message
    at the same time.


    ![](images/fig3_28.jpg)


    Figure 3.28 Screen shot of text message being displayed on cell phone.

