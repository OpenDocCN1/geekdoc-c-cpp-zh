  trans: "\n\n3. 将归一化后的脸部向量 (`K`) 投影到特征值空间，以获得向量 `W`。\n\n`W = [w[1]w[2]…..w[N]]^(T)`\n\
    \n其中 `w[i] = u[i]^T * K`\n\n4. 寻找 `e[r,]`，它表示给定脸部与训练集中另一个脸部之间的最小距离，且给定脸部与训练集中该脸部所属的人之间的距离。\n\
    \n`E[r] = min ||w - w^T||`\n\n5. 如果 `E[r] > threshold`，则用户未知，否则用户已知。\n\n图 2.4\
    \ 描述了 PCA 算法中为了提取面部图像主成分而采取步骤 [[51]](#ref-list.xhtml_refchapter_51)。在 PCA 算法中，所有图像必须具有相同的大小。通过归一化处理对所有图像数据进行归一化。每张图像被视为单个向量，这意味着所有脸部图像都存储在单个矩阵中，矩阵的每一行显示一张图像。下一步是为这些图像计算特征向量，这些特征向量也被称为特征脸（Eigenfaces）。每张图像都是这些特征脸加权和的线性组合。每当注册一张新图像进行识别时，首先会创建该图像的特征向量，然后计算门处的新脸部图像与数据库中所有存储图像之间的距离。使用\
    \ PCA 的主要目标是通过一种称为矩阵的方法获取数据的重要特征。PCA 特征脸法不直接于图像，因此使用了矩阵方法，将所有图像转换为向量形式并存储在单个矩阵中。图\
    \ 2.5 显示了基于 PCA 和神经网络的脸部识别器的示意图。\n\n![](img/fig2_4.jpg)\n\n图 2.4 基于 PCA 的脸部识别器示意图。\n\
    \n![](img/fig2_5.jpg)\n\n图 2.5 基于 PCA 和神经网络的脸部识别器示意图。\n\n### 2.2.2 独立分量分析 (ICA)\n\
    \n这是一种静态且计算策略，用于从多维统计信息中寻找基本因子或部分。ICA 与其他方法的不同在于，它搜索同时具有两个特征的分量：统计独立性和非高斯性。ICA\
    \ 为观测到的多变量信息刻画了一个生成模型，该模型通常被给出一个巨大的样本集合。在模型中，数据变量被假设是一些未知潜变量的线性混合，且混合系统也是未知的。潜变量被假设是非高斯且相互独立的，它们被称为观测数据的独立分量。这些独立分量（也称为源或因子）可以通过\
    \ ICA 找到。通过 ICA 分析的数据可能源自于许多不同的应用领域，包括数字图像、文档数据库、经济指标和心理测量值 [[41]](#ref-list.xhtml_refchapter_41)。ICA\
    \ 用于分析高阶数据，或者说是多变量数据 [[52]](#ref-list.xhtml_refchapter_52)。该算法中使用的主要技术是将高维空间转换为低维空间，使得包含转换变量的新空间将定义数据的本质特征。聚类分析是该算法中用的一种技术\
    \ [[53]](#ref-list.xhtml_refchapter_53)。一个聚类表示为一组数据元素，聚类分析被定义为一种在存在大量浓度的区域为数据分配空间的技术，该区域被称为聚类\
    \ [[53]](#ref-list.xhtml_refchapter_53)。这种技术基本上用于盲源分离问题，也称为鸡尾酒会问题。该问题定义为：如果房间里三个人同时说话，使用放置在不同位置的三个麦克风来采集麦克风产生的声音，每个麦克风记录房间内所有声音的混合。目标是仅使用录制的语音混合来分离单个用户的声音。独立分量分析\
    \ (ICA) 是解决这种盲源分离问题的方法 [[54]](#ref-list.xhtml_refchapter_54)。它是 PCA 算法的推广，能够区分输入的高阶矩和二阶矩。它的主要工作是将信号分解为若干独立信号的组合。\n\
    \n在这里，使用的一种算法是 Bell 和 Sejmouski 提出的 info max [[55]](#ref-list.xhtml_refchapter_55)，用于分离数据集的分析独立分量。\n\
    \nICA 算法的步骤为：\n\n每张脸部图像都是这些独立分量的唯一线性组合。\n\n`R = A * U`\n\n其中 `R` 代表脸部图像，`A` 定义了未知混合矩阵，`U`\
    \ 代表统计独立分量。\n\n- 对训练集进行球化处理（sphering）。这包括应用于数据集的中心化和白化过程。\n    1. 中心化：在此，从数据集中减去行平均值，然后数据集通过白化滤波器。\n\
    \    2. 白化：通过公式计算：\n\n        `W[z] = U * E^(-1/2)`\n\n        其中 `U` 和 `E` 分别是特征向量特征值。此步骤消除了数据的统计特性，协方差和均值均置零，且方差相等。\n\
    \n- 计算 `W = W * W[z,]`\n\n- 计算基础图像。\n\n    `B = R * W[i]^(-1)`\n\n- 将测试图像投影到特征脸。\n\
    \n- 计算系数\n\n    `B[test] = R[test] * W[i]^(-1)`\n\nPCA 和 ICA 算法用于将测量组件减少为较小的集合。如果数据是高斯、线性和平稳的，PCA\
    \ 就足够。如果不是，则引入 ICA。简单来说，PCA 帮助压缩数据，而 ICA 帮助分离数据 [[42]](#ref-list.xhtml_refchapter_42)。图\
    \ 2.6 显示了一个需要输入图像的系统。通过输入图像，将找到所有训练图像的特征值。之后，选择一张测试图像并对考虑的测试图像应用 ICA 算法。最后，从考虑的测试图像中计算平均图像。如果它与训练图像匹配，则人员已知，否则未找到结果。图\
    \ 2.6 显示了基于 ICA 的脸部识别器的框图。\n\n![](img/fig2_6.jpg)\n\n图 2.6 基于 ICA 的脸部识别器框图。\n\n\
    ### 2.2.3 线性判别分析 (LDA)\n\n"
