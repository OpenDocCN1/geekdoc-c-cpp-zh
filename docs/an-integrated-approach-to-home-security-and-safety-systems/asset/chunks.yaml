    \ joined to output layer but not in opposite form. It is also called as acyclic\
    \ network. In this, input may be connected fully to the output units as shown\
    \ in [Figure 1.38](#ch01.xhtml_fig1_38).\n\n![](images/fig1_38.jpg)\n\nFigure\
    \ 1.38 Single-layer feed forward NN.\n\n*   **Multilayer network model**\n\nIn\
    \ this, the number of hidden units is more than one or it can be one where nodes\
    \ are considered as hidden nodes. In this processing is done by first send the\
    \ information from source node to first hidden node and second layer output will\
    \ be used as a input to third layer and so on. The following picture 1.39 shows\
    \ a multilayer network ([Figure 1.39](#ch01.xhtml_fig1_39)):\n\n![](images/fig1_39.jpg)\n\
    \nFigure 1.39 Multilayer feed forward NN.\n\n*   **Recurrent network**\n\nIt is\
    \ the simplest form of architecture in neural network. In this, all units of input\
    \ layer are connected to all other units of output layer and every unit can act\
    \ as both input as well as an output. It is that type of network in which number\
    \ of hidden layers is greater than or equal to one with a feedback loop. In this,\
    \ feedback means neurons output will be back to its input as shown in [Figure\
    \ 1.40](#ch01.xhtml_fig1_40).\n\n![](images/fig1_40.jpg)\n\nFigure 1.40 Recurrent\
    \ neural network.\n\n*   **Hopfield neural network**\n\nThis network is mainly\
    \ used to recognize patterns and for that the network is trained with special\
    \ algorithms. It is based on the concept of recurrent network. It consists of\
    \ a set of neurons where each neuron represents a pixel of the difference image.\
    \ It is also connected to all the neurons in the neighborhood as shown in [Figure\
    \ 1.41](#ch01.xhtml_fig1_41).\n\n![](images/fig1_41.jpg)\n\nFigure 1.41 Hopfield\
    \ neural network.\n\n*   **Radial basis function network**\n\nAs feedforward neural\
    \ network is defined that it consists of input, output and hidden layer so in\
