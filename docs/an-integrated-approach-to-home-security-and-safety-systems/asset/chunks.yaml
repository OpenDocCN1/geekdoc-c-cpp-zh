    It provides an accurate estimate of signals for speech processing. Speech is modeled
    in an efficient way by using this method [[24]](#ref-list.xhtml_refchapter_24).
    It is assumed in this technique that all the speech signals are combined by the
    combination of past signals of speech. In this, initially, signals are segmented
    into number of frames then each frame will be multiplied by a window and finally
    the output will be passed through an auto correlation parameter as shown in [Figure
    1.24](#ch01.xhtml_fig1_24).


    #### Advantages

    - It is a static technique [[22]](#ref-list.xhtml_refchapter_22).

    - It is reliable, accurate and robust technique for providing parameters of speech.


    #### Disadvantages

    - It is not able to distinguish the words with similar vowel sound.

    - It generates residual error as output, resulting in poor speech quality.

    - It includes little noise robustness [[23]](#ref-list.xhtml_refchapter_23).


    ![](images/fig1_24.jpg)


    Figure 1.24 Steps of LPC technique.


    #### `RelAtive SpecTrA- Perceptual Linear Prediction` (`RASTA-PLP`)

    This method is used to enhance the speech when recorded in a noisy environment.
    When combined with PLP, it gives better performance. It was proposed by Hynek
    Hermansky, it is a technique which is mainly used when signals are embedded with
    noise factor and when slow as well as fast varying information is to be removed
    from the speech signals [[25]](#ref-list.xhtml_refchapter_25). It works in a robust
    way means there is no restriction on the distance taken for hardware devices to
    record the audio files as shown in [Figure 1.25](#ch01.xhtml_fig1_25).


    #### Advantages

    - It is robust.


    #### Disadvantages

    - It gives poor performance in clean speech environment.


    ![](images/fig1_25.jpg)


    Figure 1.25 Steps of RASTA-PLP technique.


    #### 1.5.2.8 Facial thermograms](#contents.xhtml_toc4_24)

    Thermograms are the heat patterns emitted on skin. These patterns are formed by
    branching of blood vessels. An image is gathered that indicates the heat radiated
    from the different parts of the body using infrared sensor as shown in [Figure
    1.26](#ch01.xhtml_fig1_26). The collection of these images is called as thermograms.
    Any part of the body could be used for identification. This technique uses infrared
    and efficiently works in darkness, but it is affected by ambient temperature.


    ![](images/fig1_26.jpg)


    Figure 1.26 Detection based on facial thermograms.


    #### 1.5.2.9 Ear](#contents.xhtml_toc4_25)

    Human ear is used in biometric technology for authentication. Feature vector extraction
    is the main step of this recognition. It is known that the distinctive features
    are the shape of the ear and the structure of the ear as shown in [Figure 1.27](#ch01.xhtml_fig1_27).
    But it is expected that features of an ear are not unique for every individual.
    Feature vector expression is based on geometry, internal structure of ear and
    on algebra such as `PCA`, `ICA`, etc.


    ![](images/fig1_27.jpg)


    Figure 1.27 Ear-based recognition.


    #### 1.5.2.10 DNA](#contents.xhtml_toc4_26)

    DNA (deoxyribonucleic acid) is used for user authentication. By this method, a
    unique code is provided for every individual as depicts in [Figure 1.28](#ch01.xhtml_fig1_28).
    The fact is identical DNA pattern exists for the identical twins. It provides
    secure transmission of large data with failure rate 0%. Its benefit is that it
    is error free and its accuracy is high but problem with this technique is it is
    highly expensive.


    ![](images/fig1_28.jpg)


    Figure 1.28 Structure of DNA.


    Face and voice recognition techniques are the most reliable and accurate techniques
    used for user’s recognition. This system is based on acquisition of data by an
    individual, extracting features of that data and then finally compares the extracted
    features with actual features stored in a database. These systems are used to
    increase user’s security and convenience. For example, on airport, a user enrolled
    by inserting card at gate and see into camera then that camera will acquire his
    image of eye, process that image and compute the code for that image. Final step
    is to compare both codes, one is actual code and other is computed code in order
    to verify the user’s identity. It means every biometric technique has four parameters:


    - Sensor or acquisition of data

    - Feature extraction

    - Matching

    - Decision control system


    In data acquisition, data is collected of an individual from number of sources.
    In feature extraction, acquired information is processed in order to extract the
    features. In matching parameter, extracted features are compared with features
    stored in the database and in last step, decision is taken in order to accept
    or reject the identity of an individual.


    If we use different recognition methods then their summary is available in [Table
    1.2](#ch01.xhtml_table1_2).


    Table 1.2 Different biometric methods followed with accuracy rate


    | Technology | Accuracy | Application |

    | --- | --- | --- |

    | Fingerprint | High | Law enforcement |

    | Face | High | Passport |

    | Iris | High | ATM |

    | Signature | Medium | Financial |

    | Voice | Medium | Access control |

    | Keystroke | Low | Computer security |


    Automatic biometric system is used now due to advancement in computer. Automatic
    verification of any individual is based on characteristics of that person.


    #### 1.5.3 Advantages](#contents.xhtml_toc3_27)

    - **Universality:** The main feature of biometric technique is to be universal.
    Most people have fingers, they cells contain the DNA. There exists some exceptions.
    Some people who don’t have finger they cannot use fingerprint-based systems, etc.
    However, all of us have the DNA. This problem can be solved by a multi-biometric
    system.

    - **Uniqueness:** The biometric systems are very reliable as they are unique with
    the authentication process. The features are extracted from number of parts of
    body like the DNA, a fingerprint, etc. But the uniqueness is the most important
    part. It is not possible in every case but it holds mostly true.

    - **Low circumvention:** The biometric systems are very safe and secure. Most
    of the biometric features are possible to take by the authorized person so that
    his presence with the authorization device placed is must. In some cases, a person
    could also misguide the security system, i.e., a person can cut off a finger and
    tries to be accepted by the system. But now days a scanner is able to measure
    blood flow in the veins in the scanned finger. So, the system can’t make fool
    by the person. This is how it is very safe and secure.

    - **Scalability:** The biometric technologies can be built as a multilevel authentication
    system. This multilevel system can include a standard login, a voice login, a
    fingerprint login and many others. Combining number of technologies in single
    unit increases the security of the complete system. If any one level of the whole
    system is broken, the others could decrease a break-through possibility.

    - **Permanence:** It is a set of features acquired from the DNA as it is permanent
    and does not change. This same thing could be said of the fingerprints. But in
    case of fingerprints, a man could cut his finger, which would change the fingerprint
    structure. Next considered permanent biometric feature is a retina scan.


    #### 1.5.4 Disadvantages](#contents.xhtml_toc3_28)

    **Exactingness:** Some of the biometric features can be very exacting and unique
    to acquire, e.g., the DNA. Though the DNA is unique for all of us (apart from
    the twins), but it is very difficult to extract and to analyze it frequently.
    The price of the DNA analysis is not low. This excludes the DNA from the real-time
    applications; it is not worth the advantages it can bring these days.

