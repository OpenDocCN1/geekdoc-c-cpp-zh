- fmt: "\n# Figure 1.18 Recognition based on iris.\n\n- **Behavioural biometrics**:\
    \ It consists of measurements taken from the user’s actions, some of them indirectly\
    \ measured from the human body.\n\n### 1.5.2.5 Keystroke dynamics\n\nIt is an\
    \ automated method used with the help of keyboard for examining the keystrokes\
    \ of a person. By this method, dynamics of a person’s keystrokes are examined\
    \ like speed and pressure, when a user pressed or released a key. The aim of this\
    \ technology is to improve robustness and uniqueness. An example of using this\
    \ application is the use of computer access, in which this biometric technology\
    \ can be used to recognize the computer person’s identity continuously. Persons\
    \ are there to authenticate themselves on system by entering their login id and\
    \ password. The advantage of using this technique is it does not require any additional\
    \ device except keyboard which is globally available.\n\n### 1.5.2.6 Dynamic signature\
    \ verification\n\nThis method is one of the most demandable form of user’s verification\
    \ in number of applications such as document authentication and financial transactions.\
    \ This method is used to examine the speed, direction, accuracy and pressure of\
    \ writing as shown in [Figure 1.19](#ch01.xhtml_fig1_19). In offline mode or previously\
    \ used method, users use to write their signature on normal paper, then digitize\
    \ that paper using a scanner and finally, system use to verify the signature but\
    \ in online mode as used now a days, users save their signature in iPad or digitizing\
    \ tablet by using PDA’s and then recognition is done.\n\n![](images/fig1_19.jpg)\n\
    \nFigure 1.19 Recognition based on signature.\n\nThis system is not expensive\
    \ to use, and it requires very less time to verify the user but problem with this\
    \ technique is that its error rate is high.\n\n### 1.5.2.7 Speech/voice recognition\n\
    \nThis technique is used to recognize a user on the basis of voice signals as\
    \ it transforms voice into text. For voice recognition, a number of strategies\
    \ can be used: support vector machine, Hidden Markov Model, dynamic time warping,\
    \ vector quantization, etc. By using microphone, audio files are recorded [[20]](#ref-list.xhtml_refchapter_20).\
    \ But noise factor is the major concern in this biometric technique. It takes\
    \ less time for user authentication, but its accuracy is low. [Figure 1.20](#ch01.xhtml_fig1_20)\
    \ shows a signal generated by a word spoken by a person.\n\n![](images/fig1_20.jpg)\n\
    \nFigure 1.20 Voice signal generated by a word spoken by a person.\n\n#### 1.5.2.7.1\
    \ Voice recognition system\n\nVoice is a name given to sound that carries the\
    \ content of language. Voice recognition is a task of verifying a person on the\
    \ basis of waves included in the voice. Voice of a person is identified in order\
    \ to verify the identity and used in the number of applications such as voice\
    \ dialing, voice mail and database access services. When a person speaks into\
    \ microphone, at that time, computer converts the sound of words into another\
    \ form, i.e., text that is available on computer system. The computer or laptop\
    \ either repeats the words spoken by the person or it will provide a prompt for\
    \ next turn. In earlier times, voice recognition programs use to make a person\
    \ to speak in staccato fashion; this fashion insists a person to leave a gap between\
    \ two words but now voice recognition systems are very easy to use. A person can\
    \ speak without any pause between the words. The only condition is person must\
    \ speak in a clear way. In this system, two sessions are included:\n\n- Enrolment\
    \ session\n- Operation session\n\nIn enrolment session, the users who are already\
    \ registered will provide voice samples in a way to train the model for that user.\n\
    \nIn operation session, matching is done by taking voice sample of all the users\
    \ stored in a database. Finally, decision is taken in order to accept or reject\
    \ the identity of that user.\n\nAll the steps of voice recognition process are\
    \ shown in [Figure 1.21](#ch01.xhtml_fig1_21).\n\n- **Representation**\n    **Preprocessing:**\
    \ It is the first step in recognition system in which voice is recorded by using\
    \ a microphone, then signal is captured at a sampling frequency of 5000 Hz. In\
    \ this step, frequencies that are below 100 Hz are removed by using high-pass\
    \ filters (these frequencies were containing noise factor). Important factor performed\
    \ in preprocessing is segmentation or end point detection. Speech segmentation\
    \ starts when the energy of signals exceeds the threshold value and ends when\
    \ the energy of signals drops below the threshold value.\n\n- **Model**\n    **Feature\
    \ extraction:** After processing of signals, next step is extraction or taking\
    \ out the features, and for calculation purpose, observations are taken out with\
    \ time frames. It is to be assumed that speech signal will be constant within\
    \ these frames with a length of 25 m. The time frames are overlapping and shifted\
    \ by typically 10 m. On the time window, a fast Fourier transformation is performed,\
    \ moving into the spectral domain. Human ears do not perceive all frequency bands\
    \ equally. This effect can be simulated with bandpass filters of nonuniform frequency\
    \ band widths. Until 500 Hz, the width of the filters is 100 Hz, after that it\
    \ increases logarithmically. The filter centre frequencies are defined in the\
    \ so-called Mel scale. The spectrum is decorrelated with a discrete cosine transformation.\
    \ Of the resulting coefficients, the first coefficients carry the most significance.\
    \ Therefore, only the first, e.g., ten coefficients are selected as feature vector.\
    \ The resulting features are called Mel Cepstra, commonly abbreviated as MFCC.\n\
    \n- **Search**\n    1. **Decoding:** It is a way to calculate the matching rate\
    \ of sequence of words with signals generated by the feature vectors. In the process\
    \ of decoding, there are three sources of information which are available: a)\
    \ acoustic model, b) dictionary and c) language model. The condition for decoding\
    \ is to know the probability of words that can be spoken.\n    2. **Postprocessing:**\
    \ It is the last step of speech recognition process in which signals that are\
    \ processed already are now classified in acceptance or rejection decision.\n\n\
    ![](images/fig1_21.jpg)\n\nFigure 1.21 Voice recognition process.\n\n#### 1.5.2.7.2\
    \ Voice recognition techniques\n\n- **Mel Frequency Cepstral Coefficient (MFCC)**\
    \ It is the most commonly used cepstral analysis technology used for recognition\
    \ purpose. In this, logarithmic representation is used for the frequency bands\
    \ so it provides clearer response than other systems. In this, feature vectors\
    \ of MFCC are computed by each frame present in the analysis of signals [[21]](#ref-list.xhtml_refchapter_21).\
    \ First, coefficients are extracted by the signals taken as an input; these signals\
    \ are divided into frames. On these frames, when hamming window is applied, discontinuities\
    \ of the signals are minimized at that time as shown in [Figure 1.22](#ch01.xhtml_fig1_22).\n\
    \nAdvantages:\n- It is used for speech processing tasks.\n- Its recognition accuracy\
    \ and performance rate is high.\n- It has low complexity.\n\nDisadvantages:\n\
    - It includes little noise robustness.\n\n![](images/fig1_22.jpg)\n\nFigure 1.22\
    \ Steps of MFCC technique.\n\n- **Perceptual Linear Prediction (PLP)** It works\
    \ in a similar way as linear prediction coding; it means it is also based on short-term\
    \ spectrum of speech as shown in [Figure 1.23](#ch01.xhtml_fig1_23). It eliminates\
    \ unwanted information of signals of speech and helps in improving the recognition\
    \ rate of speech signals.\n\n![](images/fig1_23.jpg)\n\nFigure 1.23 Steps of PLP\
    \ technique.\n\n- **Linear Prediction Code (LPC)**\n"
