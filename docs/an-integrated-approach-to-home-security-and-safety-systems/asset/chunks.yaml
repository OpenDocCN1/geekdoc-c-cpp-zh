    \ in acceptance or rejection decision.\n\n![](images/fig1_21.jpg)\n\nFigure 1.21\
    \ Voice recognition process.\n\n##### 1.5.2.7.2 Voice recognition techniques\n\
    \n*   **Mel Frequency Cepstral Coefficient (MFCC)**\n\nIt is the most commonly\
    \ used cepstral analysis technology used for recognition purpose. In this, logarithmic\
    \ representation is used for the frequency bands so it provides clearer response\
    \ than other systems. In this, feature vectors of MFCC are computed by each frame\
    \ present in the analysis of signals [[21]](#ref-list.xhtml_refchapter_21). First,\
    \ coefficients are extracted by the signals taken as an input; these signals are\
    \ divided into frames. On these frames, when hamming window is applied, discontinuities\
    \ of the signals are minimized at that time as shown in [Figure 1.22](#ch01.xhtml_fig1_22).\n\
    \nAdvantages:\n\n*   It is used for speech processing tasks.\n\n*   Its recognition\
    \ accuracy and performance rate is high.\n\n*   It has low complexity.\n\nDisadvantages:\n\
    \n*   It includes little noise robustness.\n\n![](images/fig1_22.jpg)\n\nFigure\
    \ 1.22 Steps of MFCC technique.\n\n*   **Perceptual Linear Prediction (PLP)**\n\
    \nIt works in a similar way as linear prediction coding; it means it is also based\
    \ on short-term spectrum of speech as shown in [Figure 1.23](#ch01.xhtml_fig1_23).\
    \ It eliminates unwanted information of signals of speech and helps in improving\
    \ the recognition rate of speech signals.\n\n![](images/fig1_23.jpg)\n\nFigure\
    \ 1.23 Steps of PLP technique.\n\n*   **Linear Prediction Code (LPC)**"
