  \ passing the array in the function.\n#include<stdio.h>\nint large(int arr[]);\n\
  int main()\n{\n    int arr[10],i,largest;\n    for(i=0;i<10;i++)\n    {\n      \
  \  printf(\"Enter the %d value in the array: \",i+1);\n        scanf(\"%d\",&arr[i]);\n\
  \    }\n    largest=large(arr);\n    printf(\"The largest number in the array is:\
  \ %d\",largest);\n}\nint large(int arr[])\n{\n    int i, j, temp;\n    for(i=0;i<10-1;i++)\n\
