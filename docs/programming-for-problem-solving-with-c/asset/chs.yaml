  在 A 中输入字符串：\n\nHELLO\n\n小写字符串是：\n\nhello\n\n### strncat()\n\n它将一个字符串的 `n` 个字符附加到另一个字符串的末尾。`n`\
  \ 是一个整数。当拼接了 `n` 个字符时拼接停止。\n\n它可以写成 `strncat(A,B,n)`。\n\n它分别接受三个参数（`A`、`B`、`n`），分别为目标字符串、源字符串和要附加的字符数，如程序\
  \ 11.12 所示：\n\n```c\n// Program 11.12 concatenates two strings\n\n#include<stdio.h>\n\
  #include<string.h>\n\nvoid main()\n{\n    char A[20];\n    char B[10];\n    int\
  \ i;\n    printf(\"Enter the 1st string:\\n\");\n    gets(A);\n    printf(\"Enter\
  \ the 2nd string:\\n\");\n    gets(B);\n    strncat(A,B,3); //Concatenate 3 characters\
  \ of B at the end of A\n    printf(\"The concatenated string is :\\n\");\n    puts(A);\n\
  }\n```\n\n输出：\n\n输入第 1 个字符串：\n\nHello\n\n输入第 2 个字符串：\n\nFriends!\n\n拼接后的字符串是：\n\n\
  HelloFri\n\n### strncpy()\n\n它将一个字符串的 `n` 个字符复制到另一个字符串。它也接受三个参数。例如，`strncpy(B,A,3)`\
  \ 将将 `A` 的前三个字符复制到 `B` 中。程序 11.13 详细说明了 `strncpy()` 函数的工作：\n\n```c\n// Program 11.13\
  \ copies three characters of one string into another string\n\n#include<stdio.h>\n\
  #include<string.h>\n\nvoid main()\n{\n    char A[10];\n    char B[10];\n    int\
  \ i;\n    printf(\"Enter the 1st string:\\n\");\n    gets(A);\n    strncpy(B,A,3);\
  \ // Copy first 3 characters of A in B\n    printf(\"The first three characters\
  \ of B are:\\n\");\n    puts(B);\n}\n```\n\n输出：\n\n输入第 1 个字符串：\n\nHELLO\n\nB 的前三个字符是：\n\
  \nHEL\n\n### strncmp()\n\n它比较一个字符串与另一个字符串的前 `n` 个字符。如果它们相同，则返回 0。它接受三个参数。程序 11.14\
  \ 显示了 `strncmp` 函数的工作：\n\n```c\n// Program 11.14 compares the first two characters\
  \ of two strings\n#include<stdio.h>\n#include<string.h>\n\nvoid main()\n{\n    char\
  \ A[10];\n    char B[10];\n    int i;\n    printf(\"Enter the 1st string:\\n\");\n\
  \    gets(A);\n    printf(\"Enter the 2nd string:\\n\");\n    gets(B);\n    i=strncmp(A,B,2);\n\
  \    printf(\"The difference is: %d\\n\", i);\n}\n```\n\n输出：\n\n输入第 1 个字符串：\n\n\
  HELLO\n\n输入第 2 个字符串：\n\nHELLO\n\n差异是: 0\n\n\n\n\n\n以下是基于字符串的练习题解析：\n\n## 程序 11.19\
