  \ }\n}\n```\n\n**输出:**\n```\nBefore incrementing: 1 2 3 4 5 \nAfter incrementing:\
  \ 2 3 4 5 6 \n```\n\n## 结论\n本章讨论了函数的编写方法。在代码复用和程序模块化方面，函数起着至关重要的作用。用户和程序可以定义自己的函数，这些函数通常是内置或预定义的。值传递和引用传递是函数传递参数的两种方法。调用约定了参数传递的顺序和方向。在\
  \ C 语言中，数组可以作为函数的参数。变量的作用域生命周期由 C 中的存储类决定，这可以优化程序的效率。\n\n下一章将讨论函数的更高级概念——递归。许多问题将通过递归来解决。\n\
  \n## 知识点\n* 程序可以分为不同的独立程序或模块，称为函数。\n*   函数也称为方法（methods）、子程序（sub-routines）或过程（procedures）。\n\
  *   函数提供了模块化、复用性和易用性。\n*   内置函数定义在 C 头文件中。它们可以直接在程序中调用。\n*   用户根据需要创建自定义函数。用户根据方便决定其名称。\n\
  *   函数原型语句提前告诉编译器程序将使用该函数。\n*   函数定义提供了函数的实现。它包含了函数运行的实际代码。\n*   函数原型以分号结束，而函数（头部）则没有；这是两者之间唯一的区别。\n\
  *   函数可以返回给调用者的值的类型称为其返回类型。\n*   参数是从调用函数传递到被调用函数的信息。\n*   实际参数在函数调用中传递。它们也被称为参数。\n\
  *   形式参数在函数定义中传递。\n*   通过值传递方法，实际参数的值将拷贝到形式参数的值中。\n*   指针是一个持有变量地址的特殊变量。\n*   在引用传递中，变量的地址作为实际参数传递。\n\
  *   存储类决定了变量存储在何处、在内存中存在多久、在程序何处可用以及它的初始值。\n* 自动存储在变量声明中使用`auto`关键字。默认情况下，C 中的局部变量都是自动的。\n\
  * 静态存储类使用`static`关键字。静态变量默认初始化为零。\n* 寄存器存储类使用`register`关键字。寄存器变量存储在 CPU 寄存器中。\n\
  * 外部存储使用`extern`关键字。其值在范围内可见。\n\n## 重点问题\n1. 什么是函数？解释不同类型。\n2. 解释为什么需要函数？\n3. 内置函数和自定义函数有什么区别？\n\
