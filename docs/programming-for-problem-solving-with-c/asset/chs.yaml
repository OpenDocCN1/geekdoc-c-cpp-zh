  12. 解释在文件处理操作中使用缓冲区（buffers）的好处。\n\n# 第 20 章 时间空间复杂度\n\n## 引言\n\n本章深入探讨了算法分析和渐近表示法的基本概念。在计算机科学领域，理解算法在时间和空间方面的表现至关重要。我们将探索\
  \ Big-Oh、Omega 和 Theta 等基本表示法，并强调它们的重要性。在本章结束时，你将能够衡量算法的时间空间复杂度，并理解这些渐近表示法之间的相互作用，为高效算法的设计和评估铺平道路。\n\
  \n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   算法分析\n*   渐近表示法\n    *   Big-Oh\n    *   Omega\n\
  \    *   Theta\n*   为什么用 Big-Oh？\n*   衡量时间复杂度\n*   衡量空间复杂度\n*   Big-Oh 渐近表示法之间的关系\n\
  *   时间复杂度\n*   空间复杂度\n\n## 目标\n\n本章旨在提供算法分析和渐近表示法的全面理解。读者将学习如何使用 Big-Oh、Omega 和\
  \ Theta 表示法评估算法效率，以及这些表示法的重要性。本章还涵盖了时间和空间复杂度、渐近表示法之间的关系以及如何分析算法性能。这些知识为读者提供了设计和评估高效算法的必备技能。\n\
  \n## 算法\n\n算法是完成特定任务或解决特定问题的系列步骤。算法用于许多领域，包括计算机科学、数学、工程和日常问题解决。在计算机科学中，算法对于编写计算机程序尤为重要。\n\
  \n它是一种解决问题的系统方法，提供了一个清晰且无歧的操作序列，遵循该序列即可获得预期的结果。\n\n更好的算法具有以下特征：\n\n*   **定义良好的步骤**：算法必须具有精确定义且无歧的步骤，这些步骤是清晰易懂的。\n\
  *   **有限性**：算法必须在有限时间内结束。\n*   **输入**：算法接收输入。\n*   **输出**：算法产生输出。\n*   **确定性**：在每次执行时，对于相同的输入应该产生相同的输出。\n\
  *   **有效性**：它应该解决问题。每一步都应该具有某些目的。\n*   **可行性**：使用可用资源（如时间、内存和计算能力）实现算法应该是可能的。\n\
  *   **正确性**：它应该对所有有效输入产生正确的输出。\n*   **最优性**：在时间和内存使用方面，它应该实现可能的解决方案。优化的算法比未优化的更高效。因此，优化的算法总是优于未优化的。\n\
  \n### 算法分析\n\n这是一项关于算法效率的研究。效率是根据算法解决特定问题所花费的时间空间计算的。分析算法所占时间和空间的技术术语分别是时间和空间复杂度。\n\
  \n### 为什么进行算法分析？\n\n让我们分析以下两个程序，它们计算 n 个数字数的和。问题是：哪一个更好？\n\n```c\n//Program 20.1\
  \ 使用循环计算两个数字数的和\n#include<stdio.h>\n\nvoid main() {\n    double sum, n,i;\n    printf(\"\
  Enter the value of n:\");\n    scanf(\"%lf\",&n);\n    sum=0;\n    for(i=0;i<n;i++)\
  \ {\n        sum=sum+i;\n    }\n    printf(\"The sum is:%lf\",sum);\n}\n```\nOutput：\n\
  Enter the value of n:10000000000\nThe sum is:49999999995.000000\n\n```c\n//Program\
  \ 20.2 使用公式计算两个数字数的和\n#include<stdio.h>\n\nvoid main() {\n    double sum, n,i;\n\
  \    printf(\"Enter the value of n:\");\n    scanf(\"%lf\",&n);\n    sum=0;\n  \
  \  sum=(n*(n-1))/2;\n    printf(\"The sum is:%lf\",sum);\n}\n```\nOutput：\nEnter\
  \ the value of n:10000000000\nThe sum is:49999999995.000000\n\n当我们执行这些程序时，第一个程序花费的时间比第二个程序长。因此，第二个程序更高效。应该有某种机制来衡量程序的效率并选择更好的一个。\n\
  \n以下是说明为什么需要算法分析的关键点：\n\n*   算法选择：算法分析有助于在实现程序之前为问题选择最合适的算法。\n*   性能预测：通过算法分析，我们可以在实际实现之前估算算法的运行时间和内存占用。\n\
  *   效率评估：算法分析以时间和空间复杂度的形式告知不同算法的有效性。\n*   设计改进：算法分析使我们能够识别算法设计实现中的改进区域。\n*   扩展性：算法分析有助于理解算法随输入增大而变化的性能。这对于高效处理大规模问题至关重要。\n\
  *   研究与创新：算法分析是计算机科学研究和新的基础。它为开发新算法、改进现有算法以及推进算法效率的理论理解提供了支持。\n\n表示算法时间和空间复杂度的方法被称为渐近表示法。\n\
  \n### 渐近表示法\n\n它是一种表示法，告诉我们在不执行程序的情况下，性能如何随输入的增大而变化。使用渐近表示法，我们可以衡量算法的最佳情况、平均情况和最坏情况，描述如下：\n\
  \n\n\n\n\n*   **最好情况（Best-case scenario）**描述算法在给定输入规模下执行所需的最短时间。它也被称为下界。\n*   **最坏情况（Worst-case\
  \ scenario）**代表算法在给定输入规模下执行可能花费的最长时间。它也被称为上界。\n*   **平均情况（Average case）**描述算法在给定输入规模下运行所需的精确时间。它也被称为紧界（tight\
  \ bound）。\n\n通常，渐近分析中使用了三种符号法：`Big-Oh`、`Omega` 和 `Theta`。\n\n## Big-Oh\n\n它代表算法在给定输入规模下执行可能花费的最长时间。它用于表示最坏情况。用\
  \ `O` 表示，读作 Big-Oh。`O(n)` 的时间复杂度意味着算法的运行时间随输入规模呈线性增长，但不会快于此速度。\n\n设 `n` 是算法的输入。`T`\
  \ 是解决问题所需的时间。如果 `f(n)` 是一个输入函数，`C` 是一个常数，那么 `g(n)` 与 `f(n)` 通过方程 (1) 联系起来：算法所花费的时间总是正的，所以\
  \ `f(n)` 和 `g(n)` 都是正的。常数 `C` 的值受 CPU 速度、内存大小、编程语言等变量的影响。参考 图 20.1：\n\n![](img/Figure_20.1)\n\
  \n图 20.1：`f(n)` 和 `g(n)` 之间的关系\n\n图 20.1 描述了在某个值 `k` 之后，`g(n)` 将始终大于 `f(n)`。\n\n\
  ```\nf(n) = O(n)\n```\n方程 (1) 也可以读作 `f` 的 `n` 是 Big-oh。可以通过方程 (2) 写成：\n\n```\nf(n)<=C.g(n)\n\
  ```\n\n方程 (2) 对于每一个 `n`（其中 `n>=k`）都成立，使得：\n\n```\nC > 0\nn >= k\n```\n\n这里，`C` 和\
  \ `k` 是两个正常数，`C` 的值可能不大于 0，即 `C >= 0`。\n\n**示例 1：为函数 `f(n) = n+10` 找到 `k` 和 `C`。**\n\
  \n由于 `f(n) = O(n)` 和 `g(n) = n`：\n\n```\nf(n) <= C.g(n)\n```\n\n为了满足这个方程，让我们选择 `C\
  \ = 1` 和 `n = k = 0`，并将这些值代入前面的方程 (1)，则：\n\n```\n0+10 <=1*0\n```\n条件不成立。所以考虑 `C\
  \ = 2`，`n = k = 10`，则方程 (1) 变为：\n\n```\n20<=20\n```\n\n所以对于 `C = 2` 和 `k >= 10`，函数\
  \ `g(n)` 将始终大于 `f(n)`，如 图 20.1 所示。在 Big-oh 中表示 `f(n)` 如下：\n\n```\n(n+10) = O(n)\n\
  ```\n\n**示例 2：在 big-oh 中表示 `f(n) = 3n² + n + 10` 和 `g(n) = n²`。**\n\n我们知道 `f(n)\
  \ <= C.g(n)`，方程 (1)：\n\n```\n(3n² + n + 10) <= C.(n²)\n```\n\n现在为了满足前面的方程，考虑 `C\
  \ = 5`，`n = k = 2`，并代入前面的方程 (1)：\n\n```\n12+2+10 <= 5*4\n24<=20\n```\n成立。所以考虑 `C\
  \ = 5`，现在取 `n = 3 = k`。通过将值代入方程 (1)，我们得到：\n\n```\n40<=45\n```\n\n所以对于 `C = 5` 和\
  \ `n >= 3`：\n\n```\n(3n² + n + 10) <= C.(n²)\n```\n\n或者说：\n\n```\n(3n² + n + 10)\
  \ = O(n²)\n```\n\n## 如何选择 `C` 和 `k` 的值？\n\n将表达式中的所有项替换为最高阶项（主导项）；表达式 `3n² + n +\
  \ 10` 可以写成 `3n² + n² + n²`。将所有项相加得到 `5n²`。该项的系数是 `5`。因此，取 `C` 的值为 `5`。现在根据 Big-Oh\
  \ 的定义，表达式 `(3n² + n + 10) = O(n²)` 可以写成 `(3n² + n + 10) <= 5.(n²)`。\n\n对于 `n=1`，表达式如下：\n\
  \n```\n(3.1² + 1 + 10) <= 5.(1²)\n14 <= 5，这不成立\n```\n\n对于 `n=2`：\n\n```\n(3.2² +\
  \ 1 + 10) <= 5.(2²)\n23 <= 20，这不成立\n```\n\n对于 `n=3`：\n\n```\n(3.3² + 1 + 10) <=\
  \ 5.(3²)\n38 <= 45,\n```\n\n从 `n=3` 开始，`f(n)` 的值将始终小于或等于 `C`，因此选择该值 `k=5`。\n\n##\
  \ Omega\n\n`Omega` 代表算法解决问题所需的下界（最小或至少）。它代表最好情况。它描述算法在给定输入规模下执行所需的最短时间。用 `Ω` 表示。参考\
  \ 图 20.2：\n\n![](img/Figure_20.2)\n\n图 20.2：`f(n)` 和 `g(n)` 之间的关系\n\n图 20.2 描述了在某个值\
  \ `k` 之后，`g(n)` 将始终小于 `f(n)`。可以通过方程 (1) 和 (2) 表示：\n\n```\nf(n) = Ω(g(n))\nf(n) >=\
  \ C.g(n)\n```\n\n方程 (2) 对于每一个 `n`（其中 `n>=k`）都成立，使得：\n\n```\nC > 0\nn >= k\nk >=\
  \ 0\n```\n\n**示例 3：在 omega 中表示函数 `f(n) = 3n² + n`。**\n\n我们需要找到 `g(n)`。选择 `g(n) =\
  \ n²` 是 `f(n) = 3n² + n` 中的主导项。根据 omega 的定义：\n\n```\nf(n) >= C.(n²)\n```\n\n代入 `C=3`：\n\
  \n```\n3n² + n >= 3n²\n```\n\n通过代入 `n=2` 检查：\n\n```\n3.2² + 2 >= 3.2²\n14 >= 12\n\
  ```\n\n所以对于所有 `n >= 0` 和 `C = 3`，`3n² + n >= 3n²` 成立，我们可以选择 `k` 等于 `n`。在 omega 中表示如下：\n\
  \n```\nf(n) = Ω(n²)\n```\n\n## Theta\n\n`Theta` 代表解决问题的精确时间。它用于表示平均情况。用 `Θ` 表示。参考\
  \ 图 20.3：\n\n![](img/Figure_20.3)\n\n图 20.3：`f(n)` 和 `g(n)` 之间的关系\n\n图 20.3 描述了在某个值\
  \ `k` 之后，`f(n)` 将始终位于 `C2.g(n)` 和 `C1.g(n)` 之间。通过方程 (1) 表示：\n\n```\nΘ.g(n) <= f(n)\
  \ <= Θ.g(n)\n```\n\n对于 `C1` 和 `C2`，也可以写成：\n\n```\nC1.g(n) <= f(n) <= C2.g(n)\n```\n\
  \n对于所有 `n >= k`。\n\n**示例 4：在 theta 中表示 `f(n) = 3n² + n`。**\n\n在表示法中表示 `f(n) = 3n²\
  \ + n`，我们需要找到两个常数 `C1`、`C2` 和 `k`，使得：\n\n```\nC1 * g(n) <= f(n) <= C2 * g(n)\n```\n\
  \n对于所有 `n >= k`，其中 `g(n)` 代表一个更简单的函数。让我们分析函数 `f(n) = 3n², n`。\n\n**下界：**\n\n我们需要找到一个函数\
  \ `g(n)`，使得对于 `n >= k` 有 `C1 * g(n) <= f(n)`。选择 `g(n) = n²` 是有效的。我们得到：\n\n```\n\
  C1 * n² <= 3n² + n\n```\n\n简化，我们得到：\n\n```\nC1 <= 3 + 1/n\n```\n\n随着 `n` 趋向无穷大，`1/n`\
  \ 趋于 0（零），我们可以忽略它。因此我们可以选择 `C1 = 3`。\n\n**上界：**\n\n我们需要找到一个函数 `g(n)`，使得对于 `n >=\
  \ k` 有 `f(n) <= C2 * g(n)`。选择 `g(n) = n²` 是有效的。我们得到：\n\n```\n3n² + n <= C2 * n²\n\
  ```\n\n简化，我们得到：\n\n```\n3 + 1/n <= C2\n```\n\n随着 `n` 趋向无穷大，`1/n` 趋于 0，我们可以忽略它。因此我们可以选择\
  \ `C2 = 4`。\n\n因此，我们找到了 `C1 = 3` 和 `C2 = 4`，并且可以选择 `k = 1`。因此，用 `Θ`（theta）符号法表示\
  \ `f(n) = 3n² + n` 如下：\n\n```\nf(n) = Θ(n²)\n```\n\n让我们通过将 `n=2` 代入 `C1 * g(n) <=\
  \ f(n) <= C2 * g(n)` 来检查：\n\n```\n3.2² <= 3.2²+2 <= 4.2²\n12 <= 14 <= 16\n```\n\n\
  这是一个真条件。\n\n## 为什么用 Big-oh?\n\n与其他渐渐近符号相比，Big-Oh 符号更受欢迎，原因如下：\n\n*   **简单性**：Big-Oh\
  \ 符号提供了一种描述算法上界或最坏情况的简单方法。它解释了算法性能如何随输入规模扩展，便于进行比较和分析。\n*   **强调上界**：它强调了上界。它确保了算法的性能不会超过某个速率，允许我们对其可扩展性和资源需求做出明智决策。\n\
  *   **标准化**：计算机科学已采用 Big-Oh 符号作为标准符号法。它被广泛使用和理解，使得研究人员、开发者和学生更容易比较不同算法的效率。\n\n\n\
  \n\n\n## 时间复杂度\n\n时间复杂度衡量算法随输入规模变化引起的时间增长率。例如，在大 O（Big-oh）时间复杂度中，`O(n)` 表示算法的执行时间随输入规模\
  \ `n` 线性变化。当输入规模翻倍时，执行时间也会接近翻倍。常见的时间复杂度分类如下：\n\n*   `O(1)`：常数时间复杂度：无论输入大小如何，算法都能在一致的时间内完成。通过索引访问数组元素就是一个例子。\n\
  *   `O(log n)`：对数时间复杂度。输入规模对时间具有对数级的影响，例如二二分查找。\n*   `O(n)`：线性时间复杂度。运行时间随输入规模线性增长。例如，遍历数组以寻找特定元素。\n\
  *   `O(n log n)`：对数线性时间复杂度。运行时间随输入规模乘以对数增长。例如，高效的排序算法如 `merge sort`（归并排序）和 `quicksort`（快速排序）。\n\
  *   `O(n²)`：二次时间复杂度。运行时间随输入规模呈平方级增长。例如，嵌套循环遍历二维数组。\n*   `O(2^n)`：指数级时间复杂度。运行时间随输入规模呈指数级增长。例如，生成集合的所有子集。\n\
  \n需要注意的是，时间复杂度分析估计的是算法性能随输入规模的扩展情况，并不提供关于实际秒运行时间的信息。\n\n## 空间复杂度\n\n与复杂度类似，空间复杂度也使用大\
  \ O 表示法。它有助于理解算法内存占用随输入规模增加的增长。常见的空间复杂度分类如下：\n\n*   `O(1)`：常数空间复杂度：无论输入大小如何，算法都使用固定内存。例如，交换变量。\n\
  *   `O(n)`：线性空间复杂度：内存占用随输入规模线性增长。例如，创建一个数组来存储输入元素。\n*   `O(n²)`：二次空间复杂度：内存占用随输入规模呈平方级增长。例如，创建一个二维矩阵。\n\
  *   `O(2^n)`：指数级空间复杂度：内存占用随输入规模呈指数级增长。例如，生成集合的所有子集。\n\n在处理大型输入或内存限制的环境（如嵌入式系统或移动设备）时，空间复杂度分析尤为重要。\n\
  \n## 大 O 渐进符号之间的关系\n\n如果一个算法需要常数时间，则它不依赖于输入的长度 `n`，而线性时间线性依赖于输入。例如，如果我们增加 `n` 的数量，时间将相应地增加。渐进符号之间的关系如下：\n\
  \n`O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(n³)`\n\n参考表 20.1：\n\n| n | `O(1)`\
  \ | `O(log n)` | `O(n)` | `O(n log n)` | `O(n²)` | `O(n³)` |\n| :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 1 | 1 | 0 | 1 | 0 | 1 | 1 |\n| 2 | 1 | 1 | 2\
  \ | 2 | 4 | 8 |\n| 3 | 1 | 1.58 | 3 | 4.78 | 9 | 27 |\n| 4 | 1 | 2 | 4 | 8 | 16\
  \ | 64 |\n| 5 | 1 | 2.32 | 5 | 11.6 | 25 | 125 |\n| 6 | 1 | 2.58 | 6 | 15.48 | 36\
  \ | 216 |\n\n有关上表的图形化表示，请参考图 20.4：\n\n![](img/Figure_20.4.png)\n\n图 20.4：代码空间与输入规模之间的关系\n\
  \n### 示例 5：计算以下函数 `f(n) = n(n-1)/2` 的大 复杂度\n\n```\n= (n² – n)/2\n= ½(n²) – ½(n)\
  \ (由于 ½ 是常数系数，可以忽略)。\n= (n² – n)\n```\n\n在此表达式中，与 `n` 相比，`n²` 是主导项。因此，去掉 `n`，前面的表达式在大\
  \ O 形式表示如下：\n\n```\n= O(n²)\n```\n\n### 示例 6：计算以下函数大 复杂度。同时找到 `C` 和 `k`\n\n```\n\
  f(n) = 4 n³ + 6n² + 3\n```\n\n在此表达式中，与 `6n²+3` 相比，`4n³` 是主导项。因此去掉项 `6n²+3`，前面的表达式可以表示如下：\n\
  \n```\n= 4n³\n```\n\n由于 `4` 是常数系数，可以忽略，大 O 形式的表达式可以表示如下：\n\n```\n= O(n³)\n4n³ +\
  \ 6n² + 3 = O(n³)\n```\n\n将左侧的所有项替换为主导项 `(n³)`，我们得到：\n\n```\n4n³ + 6n³ + n³ = O(n³)\n\
  11n³ = O(n³)\n```\n\n左侧的系数为 `11n³ = O(n³)`。\n\n\n\n\n\n## 示例 10: 确定以下语句的时间复杂度：\n\
  \n```c\nfor(j=n; j>1; j = j/10)\n    printf(\"Hello\");\n```\n\n参考 表 20.5：\n\n|\
  \ 循环变量 (j) 的值 | 内部语句执行时间 |\n| :--- | :--- |\n| j = n | C |\n| j = n/10 | C |\n|\
  \ j = n/10² | C |\n| . | . |\n| . | . |\n| j > 1 | C |\n\n**表 20.5:** 示例 10 中每次迭代的\
  \ `j` 的值及其执行时间\n\n该循环对 `j = n`、`n/10`、`n/10²`、`n/10³`…… 执行，并在 `n/10^p = 1` 时停止，从而在\
  \ `n = 10^p` 中得到 `p` 的值\n\n对等式两边进行以 10 为底的对数运算，因为 `log[10]10 = 1`。因此，前面的表达式变为：\n\
  \n`log[10]n = p.log[10]10`，\n`log[10]n = p`，\n\n简而言，前面的程序循环执行了 `log[10] n` 次，在大\
  \ O 表示法中，时间复杂度可以表示为：\n\n`= O(log n)`\n\n在表示为大 O 形时，可以丢弃对数底。\n\n## 示例 11: 确定以下语句的时间复杂度：\n\
  \n```c\nfor(x=1; x<n; x = x++)\n    for(y=1; y<n; y=j+2)\n        printf(\"Hello\"\
  );\n```\n\n参考 表 20.6：\n\n| 外层循环变量 (x) 的值 | 每个 x 值对应 y 执行的次数 | 内部循环语句执行时间 |\n| :---\
  \ | :--- | :--- |\n| x = 1 | n / 2 | n / 2 * C |\n| x = 2 | n / 2 | n / 2 * C |\n\
  | . | . | . |\n| . | . | . |\n| x < n | n / 2 | n / 2 * C |\n\n**表 20.6:** 示例 11\
  \ 中 `x` 的值和执行时间\n\n因此，对于 `x` 的每次迭代，内部语句执行了多达 `n/2` 次，每个语句花费的时间为 `C`。因此，总花费的时间如下：\n\
  \n`n/2*C + n/2*C + ………… + n/2*C`，共 `n` 次。\n\n时间复杂度 = `n * n/2 * C`\n`= ½ *C (n²)`，丢弃常数项，用\
  \ `½ *C` 表示大 O\n`= O(n²)`\n\n## 示例 12: 确定以下语句的时间复杂度\n\n```c\nfor(x=1; x<n; x = x*2)\n\
  \    for(y=1; y<n; y = y*2)\n        printf(\"Hello\");\n```\n\n参考 表 20.7：\n\n|\
  \ 外层循环变量 x 值 | 每个 x 值对应 y 执行的次数 | 内部循环语句执行时间 |\n| :--- | :--- | :--- |\n| x = 1\
  \ | log n | log n * C |\n| x = 2 | log n | log n * C |\n| x = 4 | log n | log n\
  \ * C |\n| . | . | . |\n| . | . | . |\n| x < n | log n | log n * C |\n\n**表 20.7:**\
  \ 示例 12 中 `x` 的值和执行时间\n\n因此，`x` 的每次迭代内部语句执行了多达 `log n` 次，每个语句的时间为 `C`。因此，总花费的时间如下：\n\
  \n`log n *C + log n *C ……………………………+ log n *C`，共 `log n` 次。\n\n时间复杂度 = `log n * (log\
  \ n *C)`\n`= log n.log n`，丢弃常数 `C` 和对数底以表示大 O\n`= O (log n.log n)`\n\n给定语句的空间复杂度是常数，或\
  \ `O(1)`，因为它不需要任何随输入规模 (`n`) 缩的额外空间。唯一空间用于循环变量（`x` 和 `y`），无论输入规模如何，它们都需要常数内存。`printf`\
  \ 语句也不贡献于空间复杂度，因为它只打印固定字符串（`\"Hello\"`）而不需要额外的内存分配。\n\n## 示例 13: 确定以下语句的时间复杂度：\n\
  \n```c\nx = 1;\nwhile(x<=n)\n{\n    printf(\"Hello\");\n    x = x+10;\n    x = x-15;\n\
  \    x = x+10;\n}\n```\n\n在这里，循环变量 `x` 的总体值为 `5`。因此，此循环将执行多达 `n/5` 次。因此，执行此循环的总时间为：\n\
  \n时间复杂度 = `C * n/5`\n`= C/5 * (n)`，丢弃常数项，用 `C/5` 表示大 O\n`= O(n)`\n\n## 示例 14: 确定以下语句的时间复杂度：\n\
  \n```c\nfor(x=1; x<n; x++)\n    for(y=1; y<n; y = y2)\n        printf(\"Hello\"\
  );\n```\n\n参考 表 20.8：\n\n| 外层循环变量 (x) 的值 | 每个 x 值对应 y 执行的次数 | 内部循环语句执行时间 |\n| :---\
  \ | :--- | :--- |\n| x = 1 | log n | log n * C |\n| x = 2 | log n | log n * C |\n\
  | . | . | . |\n| . | . | . |\n| x < n | log n | log n * C |\n\n**表 20.8:** `x` 的值和执行时间\n\
  \n因此，`x` 的每次迭代内部语句执行了多达 `log n` 次，每个语句花费的时间为 `C`。因此，总花费的时间如下：\n\n`log n *C + log\
  \ n *C ……………………………+ log n *C`，共 `log n` 次。\n\n时间复杂度 = `log n * (log n *C)`\n`= log\
  \ n.log n`，丢弃常数 `C` 和对数底以表示大 O\n`= O (log n.log n)`\n\n给定语句的空间复杂度是常数，或 `O(1)`，因为它不需要任何随输入规模\
  \ (`n`) 缩的额外空间。唯一空间用于循环变量（`x` 和 `y`），无论输入规模如何，它们都需要常数内存。`printf` 语句也不贡献于空间复杂度，因为它只打印固定字符串（`\"\
  Hello\"`）而不需要额外的内存分配。\n\n## 示例 15: 确定以下语句的时间复杂度：\n\n```c\nfor(x=1; x<n; x++)\n \
  \   for(y=1; y<n; y = j+2)\n        printf(\"Hello\");\n```\n\n参考 表 20.9：\n\n| 外层循环变量\
