  \n[OceanofPDF.com](https://oceanofpdf.com)\n\n# 前言\n\n欢迎阅读《解决问题的编程》，这是一本全面的指南，旨在让你掌握在计算机编程领域脱颖所需的所需的技能和知识。本书是一场对计算机科学和解决问题基础概念的精心策划的之旅，并特别关注\
  \ C 语言语言。从探索计算机硬件和软件组件开始，我们进入解决问题的技巧、C 语言基础、运算符、判断语句、循环、数组、字符串、函数、递归、结构体、联合、搜索、排序、指针以及控制台输入输出函数的章节。当我们深入研究预处理、文件处理以及空间复杂性的关键理解等高级课题时，每一章都建立在前章的基础上，提供了一种结构化且全面的编程方法。无论你是寻求坚实基础的新手还是旨在完善解决问题技能的资深编程人员，本书都提供了清晰的解释、实用的示例和实践练习来增强你的编程能力。编码愉快！\n\
  \n第一章：计算机 – 涵盖了计算机的基本构建单元。还包括计算机分类、计算机特性、计算机优点、计算机局限性以及计算机应用。最后提供了章节总结、要点回顾和重要问题\n\
  \n\n\n\n\n# 第 2 章：CPU 与内存\n描述了 CPU 及其组件、内存及其类型。它还重点介绍了指令如何从内存中提取并由 CPU 执行。书中还讨论了内存层次结构和内存衡量标准。\n\
  \n# 第 3 章：计算机软件\n介绍了计算机软件以及根据各种参数对其进行分类。它还对操作系统进行了基础介绍，并根据程序执行、用户数量和界面等不同参数对其分类。此外，还介绍了恶意程序的的基础知识。\n\
  \n# 第 4 章：数制\n提供了关于不同数制（如十进制、二进制、八进制和十六进制）的信息。它重点关注了数制之间的转换。给出了二进制数的各种操作，如加、减、乘、除、反码、补码和取反。还讨论了其他常用的二进制编码，如\
  \ ASCII、BCD、EBCDIC、余 3 码和格雷码。\n\n# 第 5 章：问题解决技术\n重点关注解决问题的方法以及不同的解决技术，如伪代码、算法和流程图。它还介绍了不同的计算机语言，如高级语言、低级语言和汇编语言，以及它们的语言翻译工具如编译器、解释器和汇编器。它介绍了将算法转换为程序的步骤。\n\
  \n# 第 6 章：C 语言基础\n介绍了 C 语言的介绍和历史。它重点关注 C 语言的构建模块，如字符集和标记符（即关键字、变量、常量等）。它还介绍了 C 程序的组成组件及其执行方法。这里还讨论了基本数据类型和类型转换。\n\
  \n# 第 7 章：运算符与表达式\n讨论了 C 语言中使用的运算符和表达式。这些运算符根据操作码的数量分类，即一元运算符、二元运算符和三元运算符。本章还讨论了算术、递增、递减、关系、逻辑、位、移、赋值、逗号、`sizeof()`、条件和地址运算符。\n\
  \n# 第 8 章：决策语句\n户能够在程序中编写决策语句。它还讨论了这些语句的类型，即条件语句和无条件语句。条件语句包括 `if`、`if else`、`else\
  \ if` 和 `switch`。无条件语句则包含了 `goto`、`break` 和 `continue` 等语句。\n\n# 第 9 章：循环\n提供了循环及其类型的细节，包括\
  \ `for`、`while` 和 `do while`。\n\n# 第 10 章：数组\n提供了数组的细节、其类型、属性和应用。\n\n# 第 11 章：字符串\n\
  展示了字符串的操作以及在字符串处理中使用的内置字符串函数，如 `strlen()`、`strcat()`、`strcmp()`、`strcpy()`、`strrev()`、`strupr()`、`strlwr()`、`strncmp()`、`strncat()`\
  \ 和 `strncpy()`。它还讨论了处理字符的内置函数。\n\n# 第 12 章：函数\n讲解了函数的编写方法、必要性、函数类型以及值传递和引用传递的方法。它还介绍了存储类的概念。\n\
  \n# 第 13 章：递归\n讨论了递归以及通过递归解决的各种示例，如求阶乘、斐波那契数列、阿曼函数等。这里还给出了通过递归排序，如快速排序和合并排序。\n\n\
  # 第 14 章：结构体与联合体\n本章提供了两种特殊的用户定义数据类型，即结构体和联合体。它还阐明了如何使用指针来访问结构体的内容。\n\n# 第 15 章：搜索与排序\n\
  本章提供了搜索和排序的基本概念。讨论了两种常用技术，即线性查找和区间查找。还给出了冒泡排序、插入排序和选择排序等排序技术。\n\n# 第 16 章：指针\n本章介绍了指针及其在编程各个领域的应用，例如创建自引用结构（如链表）。\n\
  \n# 第 17 章：控制台输入输出函数\n本章展示了控制台的内置输入输出函数。输入输出函数分为两种：格式化和非格式化。格式化函数主要包括 `printf()`\
  \ 和 `scanf()` 函数，非格式化函数则包括 `getch()`、`putch()`、`getchar()`、`putchar()` 和 `getche()`\
  \ 等。\n\n# 第 18 章：预处理器\n本章详细解释了预处理器指令。它包含了各种类型的预处理指令，如文件包含指令、宏展开指令、条件指令和杂指令。\n\n\
  # 第 19 章：C 语言中的文件处理\n本章使读者能够处理文件，通过 C 语言提供的内置文件函数对文件进行各种操作，从创建文件、读取文件内容到更新内容等。它还通过\
  \ `malloc()`、`calloc()`、`realloc()` 和 `free()` 等函数阐明了动态内存分配的概念。\n\n# 第 20 章：时间复杂度与空间复杂度\n\
  本章介绍了时间复杂和空间复杂度。\n\n\n\n\n\n本章将探索计算机的基础方面面。在数字时代，理解计算机的核心组件和概念至关重要。本章将探讨计算机的构建基石、不同类型计算机之间的区别，以及使计算机在我们的生活中不可或缺的关键特征。我们将深入探讨这些电子奇迹在多样化应用中的优势与局限性，并总结本章的关键点和供进一步探索的重要问题。让我们开启这段进入计算机世界的启迪之旅。\n\
  \n## 结构\n\nStructure\n\n在本章中，我们将讨论以下主题：\n\n* 计算机功能单元/组件的框图\n* 数据与信息\n* 计算机的分类\n\
  \    * 基于时间代际或历史发展的分类\n    * 基于用途的分类\n    * 基于所用技术的分类\n    * 基于用户数量的分类\n* 计算机特性\n\
  \    * 自动性\n    * 速度\n    * 准确性\n    * 多功能性\n    * 勤奋性\n    * 零 IQ\n    * 记忆\n \
  \   * 经济性\n* 计算机的优点\n* 计算机的局限性\n* 计算机的应用\n* 结论\n* 记忆点\n* 重要问题\n\n## 目标\n\nObjectives\n\
  \n本章旨在对计算机及其组成部分提供全面的理解。我们将探索数据、计算机分类和基本特性，以及这些机器的优缺点。此外，我们将研究它们的多样应用，最后以结论作结，并提供核心要点和重要问题，以深入理解该主题。\n\
  \n## 计算机\n\nThe computer\n\n“Computer”一词源于 compute（计算）。计算机是一种电子设备，它接受用户的数据和一组指令作为输入，处理数据并产生信息作为输出。这个完整的循环被称为输入-处理-输出循环，如图图\
  \ 1.1\n\n图 1.1：输入-处理-输出循环\n\n指令是用户给计算机以执行任务的命令。指令集被称为**程序**。程序的集合被称为**软件**。电子设备被称为**硬件**。因此，计算机是硬件和软件的集合。图\
  \ 1.2 显示了计算机组件：\n\n![](img/Figure_1.2.png)\n\n图 1.2：计算机组件\n\n## 计算机功能单元/组件的框图\n\n\
  Block diagram of functional units/components of the computer\n\n通常，计算机由四个功能单元组成，这些单元相互连接形成计算机。这些单元如下：\n\
  \n* 输入单元\n* 输出单元\n* 处理单元\n* 存储/内存单元\n\n所有上述单元通过系统总线（电线）相互连接。主要有三种总线：数据总线、控制总线指令总线。数据总线负责将数据从一个单元传输到另一个单元；控制总线传输由\
  \ `CU` 生成控制信号；指令总线传输指令（命令）。带有功能单元的计算机框图见图 1.3\n\n图 1.3：带有功能单元的计算机框图\n\n### 输入单元\n\
  \nInput unit\n\n输入单元从用户或其他媒介（设备）获取数据或程序。输入单元负责读取输入。输入单元的功能由各种输入设备的设备完成，例如：\n\n*\
  \ 键盘\n* 鼠标\n* 摇杆\n* 触摸屏\n* 扫描仪\n\n输入单元通常执行三个主要功能，如下：\n\n* 它接受用户以英文形式的人类可读格式输入。\n\
  * 它将人类可读的形式转换为计算机可读的格式（二进制语言）。\n* 它将转换后的数据提供计算机系统进行进一步处理。\n\n### 输出单元\n\nOutput\
  \ unit\n\n输出单元接受来自计算机的处理结果并供终端用户使用。输出单元的功能由某些设备完成，这些设备被称为输出设备，例如：\n\n* 显示器\n* 打印机\n\
  * 扬声器\n* 绘仪等\n\n输出单元通常执行三个主要功能，如下：\n\n* 它接受来自计算机的计算机可读形式的处理结果（二进制数据是信号的一种）。\n* 它将计算机可读的形式转换为人类可读的形式（英语、印地语、音频、视频等）。\n\
  * 它将转换后的结果提供给终端用户。\n\n输出设备大致分为两类，见图 1.4：\n\n![](img/Image24924.png)\n\n图 1.4：输出设备分类\n\
  \n* 生成**软拷贝**作为输出：这些设备生成输出的电子版本。例如，显示器在屏幕上生成图像，扬声器产生声音信号，文件存储在硬盘上等。\n* 生成**硬拷贝**作为输出：这些设备生成输出的物理版本。例如，打印机在页面上生成文件内容（打印件），绘仪在纸张上绘制高分辨率绘图，等。\n\
  \n### 处理单元\n\nProcessing unit\n\n根据用户提供的命令对数据执行操作的过程称为处理。中央处理器（`CPU`）在计算机中作为处理单元工作。它对输入设备输入的数据进行计算和数据处理。它也被称为计算机的“大脑”。`CPU`\
  \ 的主要组件如下：\n\n* 算术逻辑单元 (`ALU`)\n* 控制单元 (`CU`)\n* 寄存器组\n\n算术逻辑单元负责执行算术和逻辑功能。算术功能包括加、减、乘、除等。逻辑功能包括\
  \ AND、OR、NOT 等。\n\n`CU` 充当计算机的中枢神经系统。它生成管理和控制所有计算机组件的控制信号。\n\n寄存器是内部快速访问内存。它由少量快速内存组成。寄存器的大小由其能保存的比特数衡量，例如\
  \ 8 位寄存器、16 位寄存器、32 位寄存器、64 位寄存器等。它可以被定义为 `CPU` 内部的小型内存。\n\n### 存储单元\n\nMemory unit\n\
  \n存储单元的功能是存储数据和指令/程序。`CPU` 从内存访问数据和程序并对其进行处理。如果产生任何中间结果，它将存储在内存中，最终结果也存储在内存中。\n\n\
  内存被分为单元。每个单元都有地址。`CPU` 通过生成单元地址来访问内存。内存与 `CPU` 的工作见图 1.5：\n\n![](img/Figure_1.5.png)\n\
  \n图 1.5：内存与处理器之间的连接\n\n计算机内存分为两种，如下：\n\n* 主存/主内存\n* 辅存/辅助内存/外部内存\n\n主存是临时存储，也被称为工作内存。`CPU`\
  \ 直接访问这种内存。它存储计算机运行时所有当前的临时数据/指令。主存的例子是随机存存储器（`RAM`）和只读存储器（`ROM`）。\n\n\n\n\n\n辅助存储并不直接连接到\
  \ `CPU`。首先，由 `CPU` 访问主内存；这就是它被称为主内存的原因。其次，访问辅助存储。辅助存储是非易失性的。非易失性意味着当电源关闭时，内存会保留数据。它能够永久地存储数据。通常，它被用于数据的备份（永久存储），以便将来使用。辅助存储的速度于主内存；存储在主内存中的数据访问时间为纳秒级，而来自辅助存储的数据访问需要毫秒级。辅助存储的示例包括硬盘（HDD）、优盘盘、光盘（CD）、数字通用光盘（DVD）和固态硬盘（SSD）。图\
  \ 1.6 显示了主内存、辅助存储与 `CPU` 的连接关系：\n\n![](img/Figure_1.6.png)\n\n图 1.6：主内存、辅助存储与 CPU\
  \ 的连接\n\n## 数据与信息\n\nData（数据）一词源于单数形式 datum。数据由作为输入给计算机的原始事实和数字组成。计算机处理这些数据并将其转换为信息。因此，信息被定义为处理过的数据。例如，学生的成绩是数据；当它们被处理后，就变成了结果，即信息。另一个例子是班级学生的名字在处理并按字母顺序排序时被视为数据；它们就变成了信息。参考下图\
  \ 1.7 数据与信息的关系：\n\n![](img/Figure_1.7.png)\n\n图 1.7：数据与信息的关系\n\n数据由数字、字母和符号组成。例如，以下是制作数据使用的符号。\n\
  \n`1, 2, 3..................`\n\n`A, B, C...............`\n\n`a, b, c .................`\n\
  \n`+, -, @ .................`\n\n将数据转换为信息的目的是获取用于决策的有用信息。仅根据数据做决策是非常的。我们可以像表 1.1\
  \ 所示区分数据和信息：\n\n| 数据 (Data) | 信息 (Information) |\n| :--- | :--- |\n| 数据是由数字和字母等符号组成的原始事实和数字。\
  \ | 它是从数据处理而来的。 |\n| 它是无组织的。 | 它在本质上是有组织性的。 |\n| 它不能直接用于决策。必须先以信息的形式进行处理。 | 它可以直接用于决策。\
  \ |\n| 它需要一些处理来做决策。 | 它做决策不需要任何处理。 |\n| 它是计算机的输入。 | 它是计算机的输出。 |\n| 例如，每个学生的考试分数是数据。\
  \ | 例如，一个班的平均分是信息。 |\n\n表 1.1：数据与信息的区别\n\n## 计算机的分类\n\n计算机可以根据不同的参数进行分类，如时间、目的、用户数量、使用的技术、尺寸和容量。计算机分类如下：\n\
  \n*   基于时间、代际或历史发展的分类\n*   基于目的的分类\n*   基于使用技术的分类\n*   基于用户数量的分类\n*   基于尺寸和容量的分类\n\
  \n### 基于时间或历史发展的分类\n\n计算机的代际是基于时间线期间的。它从计算机开发或创建时期开始。每一代都有 10–20 年的时间线，并且有用于计算机开发的不同技术（零代除外）。共存在六代。计算机代际分类如下：\n\
  \n*   `0^(th)` 代计算机（黑黑时代或机械计算机）\n*   `1^(st)` 代计算机（数字计算机的开始）\n*   `2^(nd)` 代计算机\n\
  *   `3^(rd)` 代计算机\n*   `4^(th)` 代计算机\n*   `5^(th)` 代计算机\n\n参考下图图 1.8：\n\n![](img/Figure_1.8.png)\n\
  \n图 1.8：时间线上的计算机代际\n\n### 零代计算机（至 1945 年）\n\n它们是机械计算机。当时所有用于计算的计算机或其他仪器属于这一类。`0`\
  \ 代计算机的示例有算盘、纳彼骨、刻度尺、Masculine、差分机、分析机等。\n\n**优点：**\n*   它们是那个时代最快的计算机器。\n\n**缺点：**\n\
  *   它们的应用有限，用于特定目的。\n*   它们难以操作。\n*   它们是纯机械设备。\n*   今天，它们已经过时/无或用途有限。\n\n### 第一代计算机（1946–1956）#contents.xhtml_sc4_14a)\n\
  \n**真空管：** 这一代是数字计算机时代的开始。它们使用许多真空管进行计算。它们通常需要很大的空间进行安装，通常是一个房间或更多。它们使用打孔卡输入，使用磁鼓存储数据，并用低级语言（即二进制）编程，二进制由\
  \ `0` 和 `1` 组成。\n\n示例：电子积分计算器 (`ENIAC`)、通用计算机 (`UNIVAC`)、电子变阻计算机 (`EDVAC`)。\n\n\
  **优点：**\n*   它们是最快的机器。\n*   比零代快。\n\n**缺点：**\n*   它们体积庞大、难以操作、可靠性差。\n*   它们产生大量热量。\n\
  \n### 第二代计算机（1956–1963）#contents.xhtml_sc4_15a)\n\n它们使用晶体管进行计算。与前代相比，它们更快且尺寸更小。它们使用磁带和磁盘作为辅助存储。它们使用打孔卡输入。它们用符号语言或汇编语言编程，由\
  \ `SUM`、`MUL`、`LOAD` 等特殊符号组成。示例：HONEYWELL、IBM-7030、CDC160 和 UNIVAC LARC。\n\n**优点：**\n\
  *   它们是那个时代最快的机器。\n*   比第一代小。\n*   速度和容错能力高。\n*   比第一代耗电少、发热少。\n*   使用汇编语言。\n\n\
  **缺点：**\n*   它们使用晶体管，必须手动制造，因此制造成本巨大且昂贵。\n\n### 第三代计算机（1964–1971）#contents.xhtml_sc4_16a)\n\
  \n它们使用集成电路 (`IC`) 进行计算。一个 `IC` 能够执行许多晶体管和真空管的任务。它们是芯片，极大提高了计算机的速度和效率。`IC` 比晶体管更小、更便宜、更快、更可靠。它们使用了小规模集成\
  \ (`SSI`)、中规模集成 (`MSI`) 和大规模集成 (`LSI`) 的 `IC`。`LSI`、`MSI` 和 `SSI` 芯片可能分别包含数十、数百和数千电子元件。\n\
  \n它们使用磁芯作为主内存，使用磁磁盘作为辅助内存。它们使用键盘和鼠标作为输入，使用显示器产生输出。示例：IBM 360/370、PDP-8 和 PDP-11\
  \ CDC 6600。\n\n**优点：**\n*   它们是那个时代最快的机器。\n*   尺寸更小、更可靠、更便宜、功耗更低。\n*   拥有较大的主内存和辅助内存。\n\
  \n**缺点：**\n*   它们升温非常快，所以需要空调 (`AC`) 来维持温度。\n\n\n\n\n\n*   制造 IC（集成电路）需要非常先进的技术。\n\
  \n### 第四代计算机（1971–1989）\n\n1971 年，英特尔（Intel）开发了第一个微处理器，即 `4004`，它将 CPU 的所有组件（即 `ALU`、`CU`、寄存器）集成在单个芯片上。微处理器是第四代计算机的起始组件。微处理器使用\
  \ `VLSI` 或 `ULSI` 技术。`VLSI` 芯片上可能包含多达万个晶体管等电子元件。\n\n那时，内存非常快。半导体内存和硬盘被用于主存和辅存。开发了许多新的操作系统，如\
  \ `WINDOWS`、`UNIX` 和 `MS-DOS`。它们使用 `C`、`C++` 等高级语言进行编程。它们使用键盘和鼠标输入，并使用显示器输出结果。例如：`IBM\
  \ PC`、`CRAY-1`、`CRAY-2` 等都是第四代计算机。\n\n**优点：**\n*   当时最快的机器。\n*   比前几代计算机，体积更小、更便宜、更可靠、成本低且易于使用。\n\
  *   功耗更低，发热更少。\n*   主存和辅存容量。\n\n**缺点：**\n*   它们不是智能计算机。\n\n### 第五代计算机（1989 年至今）\n\
  \n随着超大规模集成（`ULSI`）技术的应用，人类试图开发智能计算机。这项工作仍在进行，这一概念被称为 `AI`。`AI` 的一些示例包括语音识别、人脸识别、机器学习等。超级计算机等高速计算机将\
  \ `AI` 概念变为现实。这些计算机使用超高速芯片 `ULSI`。`ULSI` 芯片可能包含数万到百万个电子元件。\n\n`AI` 试图制造出一种能够像人类一样思考或比人类思考得更好的计算机。但目前不存在能够完全模仿人类的计算机。\n\
  \n**优点：**\n*   它们再次是最快的机器。\n*   它们使用了 `AI` 概念。\n*   比前几代计算机更小、更便宜、可重复使用、成本低且易于使用。\n\
  *   主存和辅存容量。\n\n**缺点：**\n*   它们并非完全智能。\n\n### 根据用途分类\n\n根据用途，计算机可以分为两类，如下：\n*  \
  \ 通用计算机\n*   专用计算机\n\n#### 通用计算机\n\n这些计算机可以满足用户的各种需求。它们是能够处理多样化任务的多功能计算机。个人电脑（`PCs`）就属于这一类。一些通用任务包括玩游戏、听音乐、上网、打字、设计文档等。\n\
  \n#### 专用计算机\n\n它们也被称为专用计算机。这些计算机用于处理用户的某些特殊任务。它们设计用于执行某些特殊任务而不能执行其他任务。它们在本质上不通用。例如，`ATMs`、交通灯控制系统和天气预报模拟器都是执行特定任务的专用计算机。\n\
  \n### 根据使用的技术分类\n\n根据所使用的技术，计算机分为三类，如下：\n*   模拟计算机\n*   数字计算机\n*   混合计算机\n\n基于技术的分类见图[图\
  \ 1.9]:\n\n![](img/Figure_1.9.png)\n\n图 1.9：基于技术的计算机分类\n\n#### 模拟计算机\n\n这些是专用计算机。这些计算机用于测量模拟信号。[图\
  \ 1.10] 显示了模拟信号与时间的关系。模拟信号随时间变化，例如电流、电压、速度等。\n\n![](img/Figure_1.10.png)\n\n图 1.10：模拟信号\n\
  \n因此，测量这些信号的计算机被称为模拟计算机。例如，速度由名为 `Speedometer` 的计算机测量；`Ammeter` 测量电流；`Voltmeter`\
  \ 测量电压；压力由 `Barometer` 测量等。\n\n#### 数字计算机\n\n这些是通用计算机。数字计算机用于处理数字（离散）信号，即 `0` 和\
  \ `1`。尽管用户输入的是十进制、字符或符号，但它们会被转换为数字形式。数字计算机的示例有 `PCs`、`Laptops` 等。数字信号请参考[图 1.11]:\n\
  \n![](img/Figure_1.11.png)\n\n图 1.11：数字信号\n\n#### 混合计算机\n\n它们是数字计算机和模拟计算机的结合。它们同时处理模拟信号和数字信号。混合计算机的示例有\
  \ `ATM` 机、数钞机、超声波机、加油站的汽油柴油计量等。\n\n此外，数字计算机分为以下四类：\n*   微型计算机：它们使用微处理器（一种包含 `CPU`\
  \ 所有组件的芯片）作为其 `CPU`。这些计算机是单用户的，体积小，内存低，执行简单任务。示例有 `PCs` 和 `laptops`。\n*   小型计算机：`Mini-computers`\
  \ 比微型计算机更快、更强大。这些计算机设计用于处理单用户以及多用户。然而，用户数量受到限制。这些计算机是中型计算机，比微型计算机昂贵。这些计算机比微型计算机内存更多，执行复杂任务。示例：`PC`\
  \ 和 `laptops`。\n*   大型机：`Mainframes` 比小型计算机更强大。通常用作服务器。这些多用户计算机比小型计算机具有更多的处理能力和内存。它们用于大学、银行、航空公司等频繁访问数据库的大机构。示例：`Servers`、`IBM\
  \ S/390`、`Amdahl 58` 等。\n*   超级计算机：这些计算机是计算机中最快、最强大且最贵的。超级计算机处理海量数据，用于解决需要快速计算的科学问题。示例：`Irtysh`\
  \ 和 `Mihir` 是印度最快的超级计算机。它们用于气候监测和天气预报领域。其他超级计算机示例包括 `Frontera`、`Tanhe-2` 和 `Summit`\
  \ 等。\n\n### 根据用户数量分类\n\n根据同时与计算机交互的用户数量，计算机分为两类，如下：\n*   单用户机：这些计算机中，一次只有一个用户与计算机交互并完成任务。示例有\
  \ `laptops`、`desktops`、`palmtops`、`smartphones` 等。\n*   多用户计算机：它们能够同时执行处理多个用户的任务。示例有\
  \ `servers`、`mainframes` 和 `supercomputers`。\n\n### 计算机特征\n\n现代计算机具有以下特征：\n*   自动性：计算机在本质上是自动的，这意味着可以在没有用户干预的情况下完成任务。用户只需将任务分配给计算机，计算机就会根据存储的程序指令自动完成任务并产生最终结果。\n\
  \n\n\n\n\n- **速度**：计算机是一台速度非常快的机器。它每秒可以执行数百万次操作。计算机的速度可以用每秒百万指令数（MIPS）、每秒浮点运算数（FLOPS）、每条指令周期数（CPI）、每秒指令数（IPS）等来衡量。\n\
  - **准确性**：只要输入正确的数据和程序，计算机就能提供 100% 正确的结果。它的工作遵循“垃圾进，垃圾出”（GIGO）的原则，这意味着如果你向计算机提供垃圾（错误的数据或程序），你就会收到垃圾（错误的结果）。从\
  \ GIGO 原则可以看出，计算机产生的输出完全取决于输入的数据和程序。\n- **多功能性**：在当今，计算机的作用是多维度的（多功能的）。它可以执行多种任务，例如，在计算、娱乐、商业务、游戏、训练和仿真方面。因此，它是一台多功能的机器。\n\
  - **勤快性**：它可以重复地执行相同的任务而不会感到疲劳，并且保持与第一次执行时相同的准确性和可靠性。因此，与人类不同，它永远不会疲劳，不会缺乏注意力，而且不受情绪影响。\n\
  - **零智商**：计算机的智商为零，因为它不能独立完成任何任务，也不具备决策能力。然而，人类正试图通过人工智能概念来使计算机变得智能。\n- **记忆**：计算机可以在辅助存储器中保存数据而不丢失多年。存储的数据可以在需要时随时进行检索和使用。除非被要求这样做，否则它不会丢失数据。多年后访问相同的数据，其准确性与输入到内存的那天一样。\n\
  - **经济性**：如果从节省时间、金钱和能源方面使用得当，计算机带来的收益将超过其成本。例如，如果我们想通过普通邮件发送邮件或文档，花费的时间将比立即发送的电子邮件要长得多。\n\
  \n图 1.12 显示了计算机的特性：\n\n![](img/Figure_1.12.png)\n\n图 1.12：计算机的特性\n\n### 计算机的优点\n\
  \n让我们来讨论计算机的一些优点：\n\n- 它可以非常快速地执行复杂的计算。\n- 它可以长期存储有用信息。\n- 它通过提供数据和程序来自动执行任务，即自动化。\n\
  - 它可以向用户提供信息。\n- 它可以快速地执行重复性工作。\n- 它有助于对大量信息进行排序、组织和搜索。\n- 与人类相比，快速完成任务节省大量时间。\n\
  - 它增加了连接性，即通过互联网、电话、手机等。\n\n### 计算机的局限性\n\n以下是计算机的局限性：\n\n- 计算机没有常识，因为它智商为零。它不能自己做决定。\n\
  - 计算机无法修正错误的程序。\n- 计算机依赖人类的程序。\n- 数据和信息安全是与计算机相关的重大问题。为了某些非法目的非法访问信息。\n- 病毒和黑攻击可能会在您不知情的情况下窃取或破坏信息。\n\
  - 长期坐在电脑前可能会导致健康问题，如视力、背痛等。\n- 它增加了网络犯罪。\n\n### 计算机的应用\n\n计算机是一种多功能设备。它可以执行多维度的任务。在现代，计算机是每个人的必需品。最初，计算机是为了特定目的而开发的，即用于大型和复杂的计算。但现在，它已变成了一种通用机器。计算机的一些应用显示在图\
  \ 1.13 中：\n\n![](img/Figure_1.13.png)\n\n图 1.13：计算机的应用\n\n- **文字处理**：计算机的主要之一是文字处理。它可以创建、组织、读取和编写\
  \ Word 文档。一些文字处理软件是 MS Office、PDF 阅读器等。\n- **通信**：在今天的世界上，利用互联网计算机用于快速传输我们的数据。一些通信模式包括电子邮件、社交网络、视频通话等。\n\
  - **娱乐**：今天，计算机不仅限于计算。它还用于娱乐目的。例子包括电脑游戏、看电影和听音乐等。\n- **教育**：今天，计算机对于老师和学生来说都是必需品。计算机帮助学生在教室（智能课堂）和教室外高效掌握概念。计算机在教育中的应用包括在线图书馆、电子书、教育网站、在线学习、视频课程、视频演示等。\n\
  - **科学与技术**：计算机对于快速准确地进行科学计算非常有帮助。它被用于科学实验、收集和分析数据等。计算机还用于训练和测试的仿真。\n- **银行业**：随着世界向无现金社会发展，计算机是银行系统的支柱。人们可以通过电子银行随时随地进行各种交易，而无需亲自去银行。您的钱全天候一直伴在您身边。\n\
  - **电子商务**：电子商务也被称为电子商业。通过互联网买卖产品的过程。买家可以在线购买产品而无需去市场，卖家可以在不开商店的情况下销售产品。资金通过网上银行、信用卡/借记卡等进行转移。\n\
  - **在线预订**：今天，我们可以在线预订巴士、铁路和飞机的票务。例如，IRCTC 是购买铁路电子票的平台。\n- **天气预报**：从卫星接收的海量预报数据（如图像、温度、压力等）由计算机处理，并给出准确的结果，用于天气预报。\n\
  - **研究**：对于研究，计算机是强制性设备。它被用于所有研究活动，如问题识别、文献综述、样本收集、研究设计、数据分析和实验进行。\n- **工业自动化**：机器人是一种计算机控制的机器，用于在极端条件下（如高温高压环境）下自动执行任务，无需人为干预。\n\
  \n## 结论\n\n本章阐明了计算机的基本组件，包括计算机的基础部分，如输入单元、输出单元、内存单元和 CPU。它还关注了计算机的工作及其单元、计算机应用和局限性。它还关注了基于时间、历史发展、目的、采用技术和人数的计算机详细分类。还讨论了计算机的各种特性，如速度、多功能、自动和勤快。\n\
  \n下一章将描述 CPU 及其组件、内存及其类型。它还关注如何从内存中提取指令并由 CPU 执行。还讨论了衡量内存的层次结构。\n\n\n\n\n\n- 计算机遵循“输入–处理–输出”循环。\n\
  - 计算机单元通过系统总线（线路）连接。主要有三种总线：数据总线、控制总线和指令总线。\n- CPU 被称为计算机的大脑。\n- 控制单元相当于计算机的中枢神经。\n\
  - 寄存器是 CPU 内部可快速访问的存储。\n- 主存储器在计算机运行时存储所有当前的临时数据/指令。\n- 辅助存储器用于数据的备份（永久存储），以便将来使用。\n\
  - 数据是由数字和字母表等符号组成的原始事实和图表。它在本质上是无组织的。\n- 信息是从数据中处理而来的。\n- 零代计算机是机械计算机。\n- 第一代计算机使用大量真空管进行计算。\n\
  - 第二代计算机使用晶体管进行计算。\n- 第三代计算机使用集成电路（IC）进行计算。\n- 模拟计算机用于测量模拟信号。\n- 数字计算机用于处理数字信号，即\
  \ 0 和 1。\n- 混合计算机是数字计算机和模拟计算机的结合。\n- 微型计算机使用微处理器（包含 CPU 所有组件的芯片）作为其 CPU。\n- 小型计算机比微型计算机速度更快、更强大。\n\
  - 主机比小型计算机更强大。\n- 超级是所有计算机中最快、最强大且最昂贵的。\n- 在单用户计算机中，一次只有一个用户与计算机交互。\n- 多用户计算机能够同时执行/处理多个用户的任务。\n\
  - 计算机的速度可以用 MIPS、FLOPS、CPI、IPS 等单位来衡量。\n- 只要输入正确的数据和程序，计算机就能提供 100%正确的结果。\n- 计算机是多功能的。这就是为什么它们可以执行多维任务。\n\
  - 计算机的 IQ 为零。\n- 计算机遵循 GIGO（垃圾进垃圾出）原则。\n\n## 重要问题\n\n1. 什么是计算机？解释它的组成部分。列举其在全球的应用。\n\
  2. 区分数据和信息。哪一个更有用？\n3. 区分主内存和辅助存储器。\n4. 什么是总线？解释它的类型。\n5. 不同代计算机使用了哪些计算设备？请解释。\n\
  6. 什么是 IC？给出它的不同类型。\n7. 解释计算机的演代。比较各代之间的区别。哪一代更好？为什么？\n8. 根据历史发展、用途、使用的技术、用户数量和尺寸对计算机进行分类。\n\
  9. 讨论微型计算机和小型计算机之间的区别。\n10. 比较超级计算机和主机。写出它们的应用领域。\n11. 写出计算机的各种特性。\n12. 什么是 GIGO\
  \ 概念？请解释它。\n\n[OceanofPDF.com]\n\n# 第 2 章：CPU 与内存\n\n## 引言\n本章将深入探讨计算机的核心——中央处理器（`CPU`）及其在执行指令中的关键作用。我们将揭示`CPU`的复杂工作机制、它执行单条指令的步骤，以及`CPU`速度的重要性。此外，我们将探索内存单元，从快速的主内存到容量巨大的辅助存储器，以及它们如何构成计算机内存层次结构的基础。\n\
  \n## 结构\n在本章中，我们将讨论以下主题：\n- 中央处理器\n- CPU 上的指令：CPU 的工作原理\n- 执行单条指令所执行的步骤\n- `CPU`速度\n\
  - 内存单元\n    - 主内存\n    - 辅助存储器\n- 内存层次结构\n- 内存的测量\n\n## 目标\n本章的目标是提供对基础计算机硬件组件及其相互作用的全面理解。读者将深入了解中央处理器（`CPU`）及其指令执行过程，掌握`CPU`速度的重要性，探索各种内存单元，理解内存层次结构，并学习如何有效地衡量和管理计算机内存。\n\
  \n## CPU\n根据用户给出的指令对数据进行的操作称为处理。中央处理器（`CPU`）在计算机中作为处理单元。它对输入设备输入的数据进行计算和数据处理操作。它也被称为计算机的大脑。\n\
  \n### CPU 的组成\n`CPU`的主要组件如下：\n- 算术逻辑单元 (`ALU`)\n- 控制单元 (`CU`)\n- 寄存器组\n\n### ALU\n\
  算术逻辑单元负责算术和逻辑功能。算术功能包括加法、减法、乘法、除法等，逻辑操作包括`AND`、`OR`、`NOT`等。\n\n### CU\n控制单元作为计算机的神经系统。它产生控制信号来管理和控制所有计算机组件。例如，为了两个数字相加，它执行以下操作：\n\
  - 从内存中提取（检索）要相加的数字。\n- 从内存中提取指令（在这种情况下，指令是加法）。\n- 解码指令。\n- 要求`ALU`按照指令操作。\n- 将最终结果存储在内存中。\n\
  \n### 寄存器\n寄存器是`CPU`内部可快速访问的存储。它包含小部分快速内存。寄存器的大小由它能容纳的位数衡量，例如 8 位寄存器、16 位寄存器、32\
  \ 位寄存器、64 位寄存器等。具有大寄存器的计算机可以处理更多信息，反之亦然。寄存器可以分为两组，如下：\n\n- **通用寄存器 (`GPR`)**：`GPR`可以存储数据和地址。数据寄存器可以存储数据，地址寄存器可以存储地址。`GPR`是可以存储两者的寄存器。\n\
  - **专用寄存器 (`SPR`)**：`SPR`是用于特殊目的的寄存器。通常它们持有程序的状态。某些`SPR`如下：\n    - 程序计数器 (`PC`)：要执行的指令指令地址存储在`PC`中。\n\
  \    - 内存地址寄存器 (`MAR`)：该寄存器存储从内存检索或存储数据的区域地址。\n    - 内存数据寄存器 (`MDR`)：在内存和`CPU`之间作为缓冲区。\n\
  \    - 累加器 (`AC`)：与`ALU`交互并存储输入输出结果。\n    - 指令寄存器 (`IR`)：它持有当前执行的指令。\n\n### CPU\
  \ 上的指令：CPU 的工作原理\n计算机的主要功能是运行程序（指令集）。指令的格式如图 2.1 所示。根据冯·诺依曼计算机体系或存储程序概念，数据和指令（程序）保存在内存中。`CPU`必须执行以下两个步骤：\n\
  - 在取周期内，`CPU`从内存中读取（取指）指令。\n- 指令在执行周期内由处理器执行。\n\n指令由两部分组成，如下：\n- `Opcode`：操作码\n\
  - `Operands`：操作数\n\n![](img/Figure_2.1.png)\n\n图 2.1: 指令格式\n\n\n\n\n\n`Opcode`（操作码）规定了要执行的操作，例如加法、乘法、除法等。它代表\
  \ Operation Code（操作码）。操作数指定了 `Opcode` 应用的数据/地址。考虑以下算术表达式：\n\n```\na = b + c\n```\n\
  \n在这里，`a`、`b` 和 `c` 是操作数，而 `+` 和 `=` 是 `Opcodes`。指令在指令周期或机器周期的帮助下由处理器执行。一个机器周期由以下两个周期组成。它如图\
  \ 2.2 所示所示：\n\n- 取指周期\n- 执行周期\n\n`机器周期 = 取指周期 + 执行周期`\n\n![](img/Figure_2.2.png)\n\
  \n图 2.2：一个机器周期\n\n首先，CPU 从内存中取回指令和数据；其次，它对其进行执行并产生结果。指令/机器周期的基本模型如图图 2.3 所示：\n\n\
  ![](img/Figure_2.3.png)\n\n图 2.3：基本指令周期\n\n### 取指周期\n从内存中取指（读取）指令需要以下步骤。图 2.4 表示取指周期：\n\
  \n1. 将下一条指令的地址（`address`）从 `PC` 加载到 `MAR`。\n2. `MAR` 将地址放在地址总线上传。\n3. 控制单元向内存发送读信号。\n\
  4. 内存将数据放入内存数据寄存器（`MDR`）中。\n5. 程序计数器（`PC`）加 1。\n6. 将指令传输到 `IR`。\n\n![](img/Figure_2.4.png)\n\
  \n图 2.4：指令取指周期\n\n### 执行周期\n执行周期负责由 `ALU`（算运算单元）执行指令。包含以下步骤：\n\n1. 将 `IR` 中的操作数传输到\
  \ `MAR`。\n2. 数据从 `MAR` 指向的内存位置被取到 `ALU` 中。\n3. 在 `ALU` 中的数据上执行由解码器指定的操作。\n\nCPU\
  \ 重复执行“取指-解码-执行”周期，直到执行程序的停止指令。执行周期如图 2.5 所示：\n\n![](img/Figure_2.5.png)\n\n图 2.5：执行周期\n\
  \n### 单条指令执行时执行的步骤](#contents.xhtml_sc3_43a)\n当 CPU 执行指令时，它必须遵循一系列步骤，如图 2.6 所示。让我们以两个数相加指令为例。在这里，指令是\
  \ `ADD`，数据为 `50` 和 `60`。CPU 每个时钟周期都会取指并执行一条指令。如果 CPU 在一秒内完成一个机器周期，则称为一赫兹。执行一条指令执行以下步骤：\n\
  \n1. 从主内存中取指指令和数据。\n2. 解码指令。\n3. 执行指令，即 `ADD`。\n4. 将结果存储在主内存中。\n\n![](img/Figure_2.6.png)\n\
  \n图 2.6：机器周期\n\n### CPU 速度](#contents.xhtml_sc2_44a)\nCPU 的速度用 `IPS` 衡量，代表“instructions\
  \ per second”（每秒指令数）。这表示每秒内完成了多少条指令。影响 CPU 完成执行执行快慢的因素主要三个：时钟频率、采用的核心数量以及缓存内存。\n\
  \n### 时钟频率](#contents.xhtml_sc3_45a)\n时钟频率是指 CPU 执行指令的速率。以 `Hz`（赫兹）为单位。时钟控制 CPU\
  \ 的运行。CPU 每个时钟滴答都会检索并执行一条指令。每秒周期是时钟频率的测量单位，一赫兹等于每秒一个周期。当 CPU 具有更高的频率时，它可以以更快的速度处理指令。运行在\
  \ `3.6 GHz` 的处理器每秒执行 `3.6 亿` 次周期。旧处理器的速度以兆赫（每秒百万次周期）衡量。\n\n### 处理器核心总数](#contents.xhtml_sc3_46a)\n\
  CPU 由一种称为 `core`（核心）的元素组成。CPU 通常由单核处理器组成。大多数现代中央处理器具有两个、四个甚至更多核心。例如，双核 CPU 包含两个核心，而四核\
  \ CPU 包含四个核心。单核处理器一次只能取指并执行一条指令，而双核处理器可以一次取指并执行两条指令。具有四个核心的 CPU 在相同时间内可以执行比仅有两个核心的处理器更多的指令。\n\
  \n### 缓存内存](#contents.xhtml_sc3_47a)\n缓存是一种位于 CPU 上的运行速度极快的短容量内存。它包含了被反复使用的数据和指令。缓存越大，频繁使用的指令和数据传输到处理器并利用的速度就越快。这是因为在缓存中分配了更多空间来存储它们。\n\
  \n### 内存单元](#contents.xhtml_sc2_48a)\n内存单元不仅负责存储数据，还负责指令或程序。CPU 从内存中检索数据和程序，并对其进行操作。中间结果保存在内存中。生成的最终结果保存在内存中。图\
  \ 2.7 展示了内存与处理器之间的关系。\n\n![](img/Figure_2.7.png)\n\n图 2.7：内存与处理器之间的关系\n\n计算机内存有两种类型：\n\
  \n- 主内存/工作内存\n- 辅助内存/外部内存\n\n### 主内存](#contents.xhtml_sc3_49a)\n主内存是临时存储，也被称为工作内存或主内存。这种内存由\
  \ CPU 直接（主要）访问，因此被称为主内存。它在计算机运行时存储所有数据。主内存进一步分为三部分：\n\n- RAM\n- ROM\n- 缓存内存\n\n\
  通常 RAM 被认为是主内存。它是易失性的（关机时数据会被删除）。辅助内存不直接连接到 CPU。它也被辅助内存或三级内存。\n\n### RAM](#contents.xhtml_sc4_50a)\n\
  RAM 是随机存取存储器的缩写。它在 CPU 执行前存储数据和指令，并在执行后存储结果。它被称为随机访问是因为可以随机或按任何顺序直接访问存储的内容。CPU 当前使用的数据被放置在其中。由于它是易失性的（掉电或关闭时会被删除），它需要持续供电以保持数据。为了在计算机中运行数据或程序，必须先加载到\
  \ `RAM` 中。如果内存 (`RAM`) 太小，可能无法存放 CPU 需要的所有数据或程序。当这种情况发生时，CPU 必须从辅助内存中访问所需数据，这非常慢会导致计算机变慢。因此，要解决这个问题，你只需要增加计算机中\
  \ `RAM` 的容量。RAM 有以下两种类型：\n\n- 静态内存 (`SRAM`)：`SRAM` 中存储数据的主要组件是晶体管。`SRAM` 芯片被用作计算机缓存。`SRAM`\
  \ 比 `DRAM` 快。`SRAM` 比 `DRAM` 贵。`SRAM` 占据的空间比 `DRAM` 大。因此，与 `DRAM` 相比，`SRAM` 的数据密度较低。产生的热量也更多。`SRAM`\
  \ 不会电荷泄漏，因此不像 `DRAM` 那样需要刷新。\n\n\n\n\n\n- 动态随机存储器 (DRAM)：DRAM 用于存储数据的主要组件是电容。由于电容会随时间漏电，因此需要反复充电；这一概念被称为刷新。因此，DRAM\
  \ 需要刷新。刷新使得 DRAM 比 SRAM 慢。DRAM 用作计算机中的 RAM。DRAM 比 SRAM 便宜。数据存储密度高于 SRAM。因此，它占据的空间更小。通常情况下，与\
  \ SRAM 相比，产生的热量较少。\n\n## ROM\n\nROM 代表只读存储器，属于主存。它是一种非易失性存储器，因为它在断电或关闭时能够保留数据。它不需要持续电源供应来保持数据。它是一种永久存储器。ROM\
  \ 存储用于启动过程的固定启动指令（在通电时启动计算机）。ROM 仅可读，计算机用户无法对其写入或擦除。它只写一次。计算机制造商将启动指令存储在 ROM 中。计算机包含少量的\
  \ ROM，存储诸如基本输入输出系统（BIOS）等程序，用于在开机时启动计算机。在启动过程中，操作系统从从级内存拷贝到主存。\n\n最初，ROM 是只读存储器。因此，为了更新存储在其中的程序，必须移除\
  \ ROM 芯片并更换为包含新程序的其他更新后的 ROM。但今天，ROM 芯片不再仅仅是只读的。由于可擦除 ROM 的出现，它们可以被擦除或更新。ROM 芯片有以下几种类型。\n\
  \n### 可编程只读存储器 (PROM)\n它也被称为一次性可编程 ROM。PROM 使用名为 PROM 编程器的特殊设备进行写入/程序化。在 PROM 中，数据是一次性编程的，无法进行更新或删除。PROM\
  \ 的原理类似于 CD-ROM，数据通过 CD 刻录机写入 CD-ROM 中。录制的数据可以被多次读取，但只能写入一次。因此，编程 PROM 也称为“刻录”，就像刻录\
  \ CD-R 一样。它通常用于 PC 中以启动程序和 BIOS 设置。这些程序被称为固件。\n\n### 可擦除程序只读存储器 (EPROM)\n它可以被擦除并重新编程。EPROM\
  \ 芯片可以通过将其置于紫外线下（通常为十分钟或更长时间）来擦除，然后可以使用需要高电压的过程再次写入。EPROM 比 PROM 更有用。它可以与可重复使用的存储器\
  \ CD-RW 比较。EPROM 广泛用于个人计算机。EPROM 也用于存储科学仪器中的数据。它也被称为紫外 EPROM (UVEPROM)。\n\n### 电学擦除程序只读存储器\
  \ (EEPROM)\n它可以在电的帮助下擦除和重写。写入 EEPROM 的过程被称为闪存。EEPROM 代表这种过程。它也是非易失性存储器的一种形式。\n\n\
  ### 闪存\n闪存是 EEPROM 的一种，在软件控制下可以轻松地擦除和写入数据。它用于内存卡、优存盘、MP3 播放器、智能手机内部内存、数字相机等。\n\n\
  ## 从级内存\n\n从级内存是一种永久性存储器，持有当前未使用的数据和程序。它提供了长期存储。它持有未来可能使用的数据或程序。它用于备份目的。即使在计算机关闭时它也能保存数据，因此是非易失性的。\n\
  \n从级内存不直接连接到 CPU。首先，CPU 访问主存；这就是为什么它被称为主存。其次，如果在主存中没有找到数据，则会访问从级内存。从级内存比主存慢，也就是说，存储在内存中的数据访问速度是纳秒级，而从级内存的数据访问速度是毫秒级。从级内存可以分为两类：\n\
  \n- 顺序访问内存——磁带。\n- 半随机内存——硬盘、光盘和磁盘。\n\n某些从级内存设备是离线设备——即那些在设备上记录数据并从计算机上物理上移除的设备，例如\
  \ `CD`、`DVD`、`磁带` 等。在线内存无法在物理上从计算机中移除或断开，例如 `RAM` 等。计算机内存的宽泛分类如图 2.8 所示：\n\n```\n\
  images/Figure_2.8.png\n```\n内存分类\n\n图 2.9 显示了不同内存与处理器之间的连接：\n\n```\nimages/Figure_2.9.png\n\
  ```\n不同内存与处理器之间的连接\n\n### 顺序访问内存：磁带\n\n它提供对内存中数据的顺序访问；例如，如果我们需要访问第 `N` 个数据位置，那么我们必须先遍历所有的\
  \ `N–1` 个位置。磁带是顺序访问内存的一个良好示例。磁带由塑料卷轴（`tape`）覆盖磁性材料层（`magnetic oxide`）制成。磁带以磁带盒、卷轴和盒的形式存在。\n\
  \n**磁带存储容量**\n在特定长度的带上可以存储的数据量称为数据记录密度。它以 `bpi`（每英寸比特）表示。磁带驱动器在磁带上读写数据。它由一个读写头和一个擦除头组成。预录的数据由擦除头擦除，并由读写头记录/写入。图\
  \ 2.10 显示了磁带的框图：\n\n```\nimages/Figure_2.10.png\n```\n磁带\n\n### 半随机访问内存\n\n它同时遵循顺序访问和随机访问方法来访问数据。磁性的（`硬盘`、`软盘`）和光学的（`CD`、`DVD`）是半随机访问内存。磁盘被分为道和扇区。同心圆称为道。由线分隔的饼形区域称为扇区。数据存储在表面的道和扇区。图\
  \ 2.11 显示了磁盘上的道和扇区：\n\n```\nimages/Figure_2.11.png\n```\n磁盘道和扇区\n\n### 磁盘\n磁盘由涂有磁性材料（氧化铁）的塑料/铝圆形盘片（`plate`）组成。它使用磁化过程来写入、重写和访问数据。磁盘被分为道和扇区。读写头用于磁盘的读写过程。读写头的移动用于访问不同的扇区。因此，这是一个半随机访问过程。磁盘沿轴（`spindle`）旋转进行读写过程。图\
  \ 2.12 显示了带有读写头的磁盘：\n\n```\nimages/Figure_2.12.png\n```\n带有读写头的磁盘\n\n硬盘和软盘是磁盘的示例，其工作机制几乎相似。\n\
  \n### 硬盘\n硬盘是组在旋转主轴上的一组磁盘/盘片。磁盘覆盖有磁性材料。双层磁盘在两侧都涂有层，需要两个读写头来在两个表面上读取和写入数据。磁盘被分为道和扇区。道是同心圆，如图\
  \ 2.12 所示。这些同心圆被划分为若干扇区（磁盘上的饼形区域）。\n\n\n\n\n硬盘由安装在主轴上的许多磁性磁盘组成。磁盘的每个表面都需要读/写头。所有读写头都固在一个寻道臂上，因此它们不能独立移动。硬盘的各个部分如图\
  \ 2.13](#ch02.xhtml_fig2-13)所示：\n\n![](img/Figure_2.13.png)\n\n图 2.13：硬盘内部结构\n\n\
  每个盘片（磁盘）都具有相同数量的磁道；所有磁道距离主轴的距离相同，从而形成一个圆柱。圆柱简单地由每个表面的一条磁道组成，不同盘片的磁道由不同的读写头同时访问。\n\
  \n*   **光盘**：光盘使用激光束在涂有特殊材料（通常是铝）的平坦圆形磁盘上读取和写入数据。在磁盘上写入数据被称为“刻录”，因为激光光在向磁盘上写入数据时会烧蚀涂层在磁盘上的材料。\n\
  \n数据以激光束在磁盘表面形成的“陆地”（二进制 1 或开启（由于反射））和“凹坑”（二进制 0 或关闭（缺乏反射））的形式存储。图 2.14 展示了带有陆地和凹坑的光盘表面。\n\
  \n![](img/Figure_2.14.png)\n\n图 2.14：CD（光盘表面）\n\n此外，光盘被分为磁道和扇区。CD 和 DVD 是最常用的光盘形式。\n\
  \n## 内存层次结构](#contents.xhtml_sc2_55a)\n\n在现代计算机中，内存与 CPU 的排列被称为内存层次结构。这些内存围绕 CPU\
  \ 组织成层次，以提高性能并降低计算机成本。因此，在内存层次结构中，内存被放置在计算机的不同级别。高级（靠近 CPU）内存快速且昂贵，存储容量较低。而在低级（远离\
  \ CPU），内存速度慢且廉价，存储容量很高。高级级内存包括 CPU 寄存器、缓存内存、主内存等，而低级内存包括辅助内存，即磁磁盘、光盘、磁带等。\n\n内存层次结构如图\
  \ 2.15](#ch02.xhtml_fig2-15)所示。当我们从内存金字塔从上往下看时，内存的速度和成本会降低；也就是说，1 GB 的主内存比 1 GB\
  \ 的辅助内存贵。缓存的访问时间短于主内存，而尺寸更小；也就是说，缓存的大小小于主内存的大小。\n\n![](img/Figure_2.15.png)\n\n\
  图 2.15：内存金字塔：内存层次结构\n\n触发器或锁存器负责持有 1 位数据，即 1 或 0。触发器是制造 CPU 寄存器的关键组件。CPU 寄存器位于 CPU\
  \ 内部，因此可被 CPU 直接访问。CPU 寄存器存储一个字字长的数据（8、16、32、64 位等）。\n\n缓存内存位于超快速寄存器和主内存之间。它存储了被\
  \ CPU 反复使用的频繁数据。它由 SRAM 芯片组成。持有反复需要的数据可以避免 CPU 访问速度较慢的内存（DRAM——主内存），这增强了计算机的性能，因为\
  \ SRAM 芯片比 DRAM 芯片快。缓存内存通常分为几级：\n\n*   **L1 缓存**：位于 CPU 芯片上（内部缓存）。\n*   **L2 缓存**：构建在\
  \ CPU 外部，主板上，尺寸大于 L1。\n*   **L3 缓存**：额外的缓存，通常不使用，构建在 CPU 外部的主板上。L3 比 L1 和 L2 缓存大，但比主内存快。\n\
  \n缓存内存的大小通常以 KB 和 MB 计算。内存与 CPU 的连接如图 2.16](#ch02.xhtml_fig2-16)所示（地址、数据和控制总线）。\n\
  \n![](img/Figure_2.16.png)\n\n图 2.16：内存与 CPU 的连接\n\n*   **主内存**：它可以以 GB（千字节）为单位存储数据。现代计算机有\
  \ 4GB、8 GB 和 16 GB 的 RAM。主内存（RAM）位于计算机内部，无法与其分离。它存在于主板上。\n*   **辅助内存**：它可以以 TB（太字节）为单位存储数据。现代编译器具有\
  \ 1TB、2 TB 和 4 TB 的存储。它可以是内部的（在线）或外部的（离线）。被视为无限内存，因为需要时可以添加到计算机中。\n\n## 测量内存](#contents.xhtml_sc2_56a)\n\
  \n测量内存的最小单位是位（bit）。一个位意味着 0 或 1。四个字的组合称为半字节（nibble），八个字的组合称为字节（byte）。下面的表 2.1 |\
  \ 0 或 1 | 0 或 1 | – | Bit |\n| 1 半字节 | 4 位 | 2² 位 | – | Nibble |\n| 1 字节 | 8 位 |\
  \ 2³ 位 | – | Byte |\n| 1 千字节 | 1024 字节 | 2¹⁰ 位 | – | KB |\n| 1 兆字节 | 1024 千字节 |\
  \ 2²⁰ 位 | – | MB |\n| 1 吉字节 | 1024 兆字节 | 2³⁰ 位 | – | GB |\n| 1 太字节 | 1024 吉字节 |\
  \ 2⁴⁰ 位 | – | TB |\n| 1 拍字节 | 1024 太字节 | 2⁵⁰ 位 | – | PB |\n| 1 艾字节 | 1024 拍字节 |\
  \ 2⁶⁰ 位 | – | EB |\n| 1 泽字节 | 1024 艾字节 | 2⁷⁰ 位 | – | ZB |\n| 1 量字节 | 1024 泽字节 |\
  \ 2⁸⁰ 位 | – | YB |\n| 1 念字节 | 1024 量字节 | 2⁹⁰ 位 | – | NB |\n| 1 兆字节 | 1024 念字节 |\
  \ 2¹⁰⁰ 位 | – | RB |\n\n\n\n\n\n答案：1TB > 10 亿字节 > 512M 字节 > 8K 字节\n\n解释：全部转换为相同的单位，即字节（bytes）：\n\
  \n1. `512M bytes= 2⁹*2²⁰ bytes= 2²⁹ bytes`\n2. `8 K bytes= 2³*2¹⁰= 2¹³ bytes`\n\
  3. `One billion bytes=2³⁰ bytes`\n4. `1TB=2⁴⁰ bytes`\n\n## 结论](#contents.xhtml_sc2_58a)\n\
  \n本章全面了计算机系统的 CPU 和内存单元。我们探索了 `CPU` 的内部机制，包括它的指令以及单条指令的逐步执行过程。理解 `CPU` 如何运行对于理解计算机系统的整体功能至关重要。我们还讨论了\
  \ `CPU 速度` 的概念，强调了它在决定计算机效率和性能方面的重要性。我们检查了主存和辅存，它们在存储和检索数据方面发挥着至关重要的作用。\n\n此外，我们还探索了存储层次的概念，这涉及根据速度、大小和容量对内存进行分层组织。最后，我们探索了内存的方法，使我们能够量化和分析计算机系统的存储容量。本章为理解计算机系统的核心组件及其相互作用奠定了基础的基础，为后续章节铺平了道路。\n\
  \n接下来的章节将讨论计算机软件及其分类。它将简单介绍操作系统及其参数，如执行、用户数量和界面。\n\n## 记忆要点](#contents.xhtml_sc2_59a)\n\
  \n* `CPU` 处理输入数据。它是计算机的大脑。\n* `ALU` 执行算术和逻辑运算。\n* `CU` 充当计算机神经系统，产生控制信号以管理所有组件。\n\
  * `Registers`（寄存器）是 `CPU` 内部快速且可访问的内存，存储以位数衡量的小量数据。\n* `PC` 存储下一条指令的地址。\n* `MAR`\
  \ 存储需要从主存访问或写入主存的数据或指令地址。\n* `MDR` 作为内存与 `CPU` 之间的缓冲区。\n* `accumulator`（累加器）与 `ALU`\
  \ 交互并存储其输出。\n* 当前正在执行的指令存储在 `IR` 中。\n* `机器周期 = 取指周期 + 执行周期`。\n* `clock speed`（时钟频率）指\
  \ `CPU` 的执行率，以 `Hz` 。双核处理器包含两个核心。\n* `cache`（缓存）速度快，位于 `CPU` 和主存之间。`L1` 放置在 `CPU`\
  \ 上。`L2` 和 `L3` 放在 `CPU` 之外。\n* 主存是快速且易失的内存，`CPU` 直接访问。\n* `SRAM` 中存储数据的主要组件是晶体管。\n\
  * `DRAM` 中存储数据的主要组件是电容器。\n* `ROM` 是只读存储器的缩写。\n* `PROM` 是可编程只读存储器的缩写写。\n* `EPROM`\
  \ 是可擦除只读存储器的缩写。\n* `EEPROM` 代表电可擦除 `PROM`，通常用于闪存、内存卡、优盘盘、数字相机等。\n* 辅存是永久性的。\n* `magnetic\
  \ disk`（磁磁盘）由涂有磁性材料的圆形盘片（plate）组成。\n* `hard disk`（硬盘）是一组分组在旋转主轴上的磁磁盘。\n* `Optical\
  \ disks`（光盘）使用激光束在涂有光敏材料（通常是铝）的平坦圆形盘片上读写数据。\n* 内存与 `CPU` 配合以增强性能并降低成本的排列被称为存储层次结构。\n\
  * `flip flops`（触发器）或锁存器负责 1 位数据（1 或 0）。\n* 测量内存的最小单位是位（bit）。\n\n## 思考题](#contents.xhtml_sc2_60a)\n\
  \n1. 什么是 `microprocessor`（微处理器）？写出它的组件。\n2. 在 `CPU` 中提供 `registers`（寄存器）的什么？讨论微处理器中通常提供的各种寄存器。\n\
  3. 什么是 `clock speed`（时钟频率）？它的测量单位是什么？\n4. 什么是单核、双核和四核处理器？\n5. 描述指令周期。重点关注取指和执行周期。\n\
