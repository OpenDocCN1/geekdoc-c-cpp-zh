  图 13.10 在逻辑上分为两半，如图 13.11 所示：\n\n![](img/Figure_13.11.png)\n\n图 13.11: 基准值到其所在位置\n\
  \n### 快速排序算法\n\n1. 开始。\n2. 声明数组 `A[]` 和 `last`，其中 `last` 是数组 `A` 的最后一个元素。\n3. `Quicksort(A,0,last)`\n\
  4. {\n5. 将 `pivot` 移动到其位置，使得基准左侧小于基准，右侧大于基准。\n6. 对左部分进行快速排序，即 `Quicksort(A,0,j-1)`。\n\
  7. 对右部分进行快速排序，即 `Quicksort(A,j+1,last)`。\n8. }\n\n// 程序 13.6 显示了快速排序的工作原理\n\n```c\n\
  #include <stdio.h>\n\nvoid Quicksort(int A[50],int first,int last)\n{\n  int i,j,pivot,temp;\n\
  \  if(first<last)\n  {\n    pivot=first;\n    i=first;\n    j=last;\n    while(i<j)\n\
  \    {\n      while(A[i]<=A[pivot]&& i<last)\n        i++;\n      while(A[j]>A[pivot])\n\
  \        j--;\n      if(i<j)\n      { // 交换第 i 和第 j 个元素\n        temp=A[i];\n  \
  \      A[i]=A[j];\n        A[j]=temp;\n      }\n    }\n    temp=A[pivot]; // 交换第\
  \ j 个元素与基准值\n    A[pivot]=A[j];\n    A[j]=temp;\n    Quicksort(A,0,j-1); // 递归排序左较小的子数组\n\
  \    Quicksort(A,j+1,last); // 递归排序右较小的子数组\n  }\n}\n\nvoid main()\n{\n  int A[50],n,first,last,i;\n\
  \  printf(\"输入元素个数: \");\n  scanf(\"%d\", &n);\n  first=0;\n  last=n-1;\n  printf(\"\
  输入元素: \");\n  for(i=0; i<n; i++)\n  {\n    scanf(\"%d\", &A[i]);\n  }\n  Quicksort(A,first,last);\n\
  \  printf(\"排序后的数组为:\\n\");\n  for(i=0; i<n; i++)\n  {\n    printf(\"%d \", A[i]);\n\
  \  }\n  printf(\"\\n\");\n}\n```\n\n\n\n\n本章将教我们如何定义结构、访问其元素以及初始化它们。我们还将探索结构体数组、结构指针、联合体、嵌套结构以及将结构作为函数参数传递的概念。这些知识将使你能够有效地处理程序中的复杂数据结构。\n\
  \n## 目录\n* 定义结构\n* 访问结构元素\n* 初始化\n* 结构体数组\n* 带有指针的结构\n* 联合体\n* 嵌套结构\n* 在函数中传递结构\n\
  \n## 目标\n本章旨在让读者对编程中的结构化数据有全面的的理解。读者将学习如何定义和操作结构、访问和初始化其元素，并探索结构体数组、结构指针、联合体和嵌套结构等高级概念。此外，我们将涵盖如何将结构作为函数参数传递，使读者具备在程序中有效管理和操作复杂数据结构的能力。\n\
  \n## 定义结构\n结构是不同类型或异构数据类型的集合，例如整数、字符、浮点数等。例如，一个学生的记录可能包含学生的姓名、学号、班级、系别等。在这里，学生的记录充当了一个结构。\n\
  \n定义结构时使用 `struct` 关键字。每个结构都应该有一个名称，用于标识该结构。结构块包含不同数据类型的实体，称为成员。在结构块的末尾放置结构体变量。这些变量被称为对象。内存中为每个对象都预留了独立的空间。结构占用的总空间等于所有对象所占据空间之和。用分号（`;`）结束结构。定义结构的语法所示：\n\
  \n```c\nstruct structure_name // 结构声明\n\n{\ndatatype member_name_1;\ndatatype member_name_2;\n\
  ....................\ndatatype member_name_N;\n} List of objects; // 结构定义或对象声明\n\
  ```\n\n结构的声明告知了结构名称及其成员名称，但没有为它们分配任何内存空间。一旦声明了结构，就会创建了该结构的对象，从而为其成员分配内存。对于上述语法，拥有两个对象\
  \ `Object_1` 和 `Object_2` 的结构内存视图如图 14.1 所示：\n\n![](img/FIGURE_14.1.png)\n图 14.1：内存中的结构表示\n\
  \n让我们为两个学生 `S1` 和 `S2` 创建一个结构，包含以下信息：\n* 学生姓名\n* 学生班级\n* 学生系别\n* 学生学号\n\n以下代码存储了学生\
  \ `S1` 和 `S2` 的信息：\n\n```c\nstruct student // 结构声明\n\n{\nchar Name[10];\nchar Class[10];\n\
  char Section[10];\nint Roll;\n} S1, S2; // 结构定义或对象声明\n```\n\n图 14.2 显示了上述代码创建的场景：\n\
  \n![](img/FIGURE_14.2.png)\n图 14.2：内存中两个学生的详情\n\n也可以通过以下方法创建对象 `S1` 和 `S2`：\n\n\
  ```c\nstruct student\n{\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint\
  \ Roll;\n};\n\nstruct student S1,S2; // 对象声明\n```\n\n## 访问结构元素\n通过对象名后接点运算符 `.`\
  \ 和成员名来访问结构成员变量。访问结构成员的语法所示：\n\n```c\nobject_name.member_name;\n```\n\n例如，考虑以下示例来访问之前创建的结构的成员：\n\
  \n```c\nS1.Name // 访问学生 S1 的姓名\nS1.Class\nS2.Section // 访问学生 S2 的系别\nS2.Roll\n```\n\
  \n## 初始化结构\n可以通过给其成员赋值来初始化结构。值的是通过通过结构化对象进行赋值的。如果结构未初始化，整数和浮点成员将默认初始化为零，字符将默认初始化为\
  \ `\\0`。可以使用以下方法初始化结构。\n\n### 方法 1：在对象声明时，如下代码所示：\n\n```c\nstruct structure_name\n\
  {\ndatatype member_name_1;\ndatatype member_name_2;\n....................\ndatatype\
  \ member_name_N;\n} obj1={val_1, val_2,……val_N}; // 声明时的初始化\n```\n\n### 方法 2：结构声明后的初始化，如下代码所示：\n\
  \n```c\nstruct structure_name\n{\ndatatype member_name_1;\ndatatype member_name_2;\n\
  ....................\ndatatype member_name_N;\n};\n\nstruct structure_name obj={val_1,\
  \ val_2,……val_N}; // 结构声明后的初始化\n```\n\n以下代码通过方法 1 初始化对象 `S1` 和 `S2`：\n\n```c\nstruct\
  \ student\n{\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n} S1={\"\
  KAMAL\",\"B.Tech\",\"Mechanical\",1},\nS2={\"Ajay\",\"B.Tech\",\"Mechanical\",2};\n\
  ```\n\n程序 14.1 显示了使用方法 1 初始化结构：\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
  \nstruct student\n{\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n\
  } S1={\"KAMAL\",\"B.Tech\",\"Mechanical\",1},\nS2={\"Ajay\",\"B.Tech\",\"Mechanical\"\
  ,2};\n\nint main()\n{\n    // 输出学生 1 信息\n    printf(\"%s\\n\", S1.Name);\n    printf(\"\
  %s\\n\", S1.Class);\n    printf(\"%s\\n\", S1.Section);\n    printf(\"%d\\n\", S1.Roll);\n\
  \n    // 输出学生 2 信息\n    printf(\"%s\\n\", S2.Name);\n    printf(\"%s\\n\", S2.Class);\n\
  \    printf(\"%s\\n\", S2.Section);\n    printf(\"%d\\n\", S2.Roll);\n\n    return\
  \ 0;\n}\n```\n**输出：**\n```\nKAMAL\nB.Tech\nMechanical\n1\nAjay\nB.Tech\nMechanical\n\
  2\n```\n\n程序 14.2 显示了使用方法 2 初始化结构变量：\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
  \nstruct student\n{\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n\
  };\n\nstruct student S1,S2;\n\nint main()\n{\n    strcpy(S1.Name, \"KAMAL\");\n\
  \    strcpy(S1.Class, \"B.Tech\");\n    strcpy(S1.Section, \"Mechanical\");\n  \
  \  S1.Roll = 1;\n\n    strcpy(S2.Name, \"Ajay\");\n    strcpy(S2.Class, \"B.Tech\"\
  );\n    strcpy(S2.Section, \"Mechanical\");\n    S2.Roll = 2;\n\n    // 输出学生 1 信息\n\
  \    printf(\"%s\\n\", S1.Name);\n    printf(\"%s\\n\", S1.Class);\n    printf(\"\
  %s\\n\", S1.Section);\n    printf(\"%d\\n\", S1.Roll);\n\n    // 输出学生 2 信息\n   \
  \ printf(\"%s\\n\", S2.Name);\n    printf(\"%s\\n\", S2.Class);\n    printf(\"%s\\\
  n\", S2.Section);\n    printf(\"%d\\n\", S2.Roll);\n\n    return 0;\n}\n```\n\n\
  程序 14.3 显示了使用 `strcpy` 函数进行初始化：\n（此处省略重复的 14.3 代码翻译，逻辑已在上方体现）\n\n\n\n\n```c\nstrcpy(\
  \ S2.Name, \"Ajay\");\nstrcpy( S2.Class, \"B.Tech\");\nstrcpy( S2.Section, \"Computer\"\
  );\nS2.Roll = 2;\n\n/* 输出学生 1 信息 */\nprintf( \"Student Name: %s\\n\", S1.Name);\n\
  printf( \"Student Class: %s\\n\", S1.Class);\nprintf( \"Student Section: %s\\n\"\
  , S1.Section);\nprintf( \"Student Roll Number : %d\\n\", S1.Roll);\n\n/* 输出学生 2\
  \ 信息 */\nprintf( \"Student Name: %s\\n\", S2.Name);\nprintf( \"Student Class: %s\\\
  n\", S2.Class);\nprintf( \"Student Section: %s\\n\", S2.Section);\nprintf( \"Student\
  \ Roll Number: %d\\n\", S2.Roll);\nreturn 0;\n}\n```\n\n**输出:**\n```\nStudent Name:\
  \ KAMAL\nStudent Class: B.Tech\nStudent Section: Mechanical\nStudent Roll Number:\
  \ 1\nStudent Name: Ajay\nStudent Class: B.Tech\nStudent Section: Computer\nStudent\
  \ Roll Number: 2\n```\n\n## 结构体数组\n\n如果我们需要输入例如 100 个学生的详细信息，那么就需要创建 100 个对象。另一种选项是使用一个包含\
  \ 100 个元素的对象数组。因此，结构体数组简单来说就是结构体对象的集合。声明结构体数组的通用语法如下：\n\n```c\nstruct structure_name\n\
  {\n    Datatype member_name 1;\n    Datatype member_name 2;\n    ......................\n\
  \    Datatype member_name n;\n} obj[size]; // 结构体数组\n```\n\n以下语法等等于前面的代码：\n\n```c\n\
  struct structure_name\n{\n    Datatype member_name 1;\n    Datatype member_name\
  \ 2;\n    ......................\n    Datatype member_name n;\n};\nstruct structure_name\
  \ obj[size]; // 结构体数组\n```\n\n以下程序通过输入学生详情展示了结构体数组：\n\n```c\n//程序 14.4 通过输入学生详情展示了结构体数组。\n\
  #include<stdio.h>\n\nstruct student\n{\n    int roll;\n    char name[10];\n}s[10];\
  \ // 对象数组\n\nvoid main()\n{\n    int i;\n    printf(\"Enter the records of 10 students\"\
  );\n    for(i=0;i<10;i++)\n    {\n        printf(\"\\nEnter Roll Number:\");\n \
  \       scanf(\"%d\",&s[i].roll);\n        printf(\"Enter Name:\");\n        scanf(\"\
  %s\",&s[i].name);\n    }\n    printf(\"\\nStudent Information List:\");\n    for(i=0;i<10;i++)\n\
  \    {\n        printf(\"\\nRoll Number:%d, Name: %s\",s[i].roll,s[i].name);\n \
  \   }\n}\n```\n\n**输出:**\n```\nEnter the records of 10 students\nEnter Roll Number:1\n\
  Enter Name: Kamal\n```\n同样地，询问其余九条记录并打印它们。\n\n## 指针结构体\n\n与包含另一个变量地址的指针类似，结构体指针指向存储结构体的内存块地址。结构体指针允许访问和操作结构体的成员。\n\
  \n### 结构体指针的声明\n\n在指针名称之前的指针声明中使用星号 `*` 符号。结构体指针声明中使用以下语法：\n\n```c\nstruct structure_name\n\
  {\n    //结构体成员\n}object1;\n\nstruct structure_name *ptr; // 声明结构体指针\n```\n在这里，`ptr`\
  \ 是结构体指针。\n\n### 结构体指针的初始化\n\n在声明结构体指针后，我们需要对其进行初始化。使用 `&` 运算符提供对象的地址，例如：\n\n```c\n\
  ptr = &object1;\n```\n```c\nptr 存储了对象的地址\n```\n\n### 使用指针访问结构体\n\n结构体指针可以通过两种方式访问结构体成员：\n\
  * 使用 `->` 运算符。\n* 使用 `*` 运算符和 `.` 运算符。以下程序展示了使用 `->` 运算符处理结构体：\n\n```c\n//程序 14.5\
  \ 使用 -> 运算符处理结构体\n#include <stdio.h>\n\nstruct Student\n{\n    char name[30];\n\
  \    int age;\n    char gender[30];\n}std1,std2;\n\n// 指针结构体\nstruct Student *ptr1,\
  \ *ptr2;\n\nint main()\n{\n    ptr1 = &std1;\n    ptr2 = &std2;\n\n    ptr1->name\
  \ = \"Rahul\";\n    ptr1->age = 20;\n    ptr1->gender = \"Male\";\n\n    ptr2->name\
  \ = \"Anita\";\n    ptr2->age = 22;\n    ptr2->gender = \"Female\";\n\n    printf(\"\
  Student 1 Name: %s\\n\", ptr1->name);\n    printf(\"Student 1 Age: %d\\n\", ptr1->age);\n\
  \    printf(\"Student 1 Gender: %s\\n\", ptr1->gender);\n\n    printf(\"Student\
  \ 2 Name: %s\\n\", ptr2->name);\n    printf(\"Student 2 Age: %d\\n\", ptr2->age);\n\
  \    printf(\"Student 2 Gender: %s\\n\", ptr2->gender);\n\n    return 0;\n}\n```\n\
  \n**输出:**\n```\nStudent 1 Name: Rahul\nStudent 1 Age: 20\nStudent 1 Gender: Male\n\
  Student 2 Name: Anita\nStudent 2 Age: 22\nStudent 2 Gender: Female\n```\n\n## 联合体\n\
  \n它与结构体一样，也是不同或异构数据类型的集合。它可以持有整数、字符、浮点等不同的数据类型。\n\n联合体的大部分特征与结构体相同，但占据内存的空间比结构体更少。结构体为它的每个成员单独分配空间，而联合体成员共用其最大数据成员占据的空间。因此，联合体的大小等于其最大数据类型的大小，而结构体占据的总空间是所有数据成员大小之和。联合体使用\
  \ `union` 关键字。查看以下代码了解联合体的声明和定义。\n\n\n\n\n```c\nunion student //联合体声明\n{\n    char\
  \ Name[10];\n    char Class[10];\n    char Section[10];\n    int Roll;\n} S1, S2;\
  \ //联合体定义\n```\n\n在这里，`S1` 和 `S2` 是联合体 `student` 的对象，而 `name`、`class`、`section`\
  \ 和 `Roll` 是联合体的成员。\n\n需要注意的是，结构体（structure）占据的空间并不总是等于其成员大小之和。这是因为编译器会添加填充（padding）以避免对齐问题。填充是编译器添加的额外字节。\n\
  \n// 程序 14.7 显示了联合体占据的空间\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    union\
  \ A\n    {\n        int x; // sizeof(int) = 4\n        double z; // sizeof(double)\
  \ = 8\n        short int y;// sizeof(short int) = 2\n    };\n    printf(\"Size of\
  \ union: %ld\", sizeof(union A));\n    return 0;\n}\n```\n\n输出：\n`Size of union:\
  \ 8`\n\n联合体成员依次使用其最大的数据成员占据的空间。在程序 14.7 中，最大的数据成员是 `double`。因此，它在内存中占据了 8 字节的空间。图\
  \ 14.3 显示了程序 14.7 中联合体占据的空间：\n\n![](img/FIGURE_14.3.png)\n\n图 14.3：联合体占据的空间\n\n\
  // 程序 14.8 显示结构体在内存中占据的字节数\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    struct\
  \ A\n    {\n        int x; // size of int is = 4\n        double z; // size of double\
  \ = 8\n        short int y; // size of short int = 2\n    };\n    printf(\"Size\
  \ of struct: %ld\", sizeof(struct A));\n    return 0;\n}\n```\n\n输出：\n`Size of struct:\
  \ 24`\n\nC 语言中结构体的大小由其各个成员的大小之和决定，并考虑了编译器为了对齐而添加的任何填充。在这种情况下，结构体 `A` 包含一个整数 `x`（大小为\
  \ 4）、一个双精度浮点数 `z`（大小为 8）和一个短整数 `y`（大小为 2）。\n\n编译器可能会在成员之间添加填充以确保正确的对齐。在大多数架构中，`double`\
  \ 值需要对齐在 8 字节边界上。因此，在整数 `x`（4 字节）之后，会有 4 字节的填充来正确对齐双精度 `z`。然后是双精度 `z`（8 字节），紧接着是短整数\
  \ `y`（2 字节）。\n\n所以结构体 `A` 的总大小为 `4 + 4 (padding) + 8 + 2 = 18` 字节。然而，由于内存对齐的要求，结构体的实际大小向上舍整为最大成员大小的最近倍数，即\
  \ 8 字节（`double` 的大小）。因此，结构体的大小将 24 字节，如图 14.4\n\n图 14.4：程序 14.8 占据的内存空间\n\n// 程序\
  \ 14.9 显示结构体中的填充概念\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    struct A\n\
  \    {\n        double z; // sizeof(double) = 8\n        int x; // sizeof(int) =\
  \ 4\n        short int y; // sizeof(short int) = 2\n    };\n    printf(\"Size of\
  \ struct: %ld\", sizeof(struct A));\n    return 0;\n}\n```\n\n输出：\n`Size of struct:\
  \ 16`\n\n程序 14.9 占据的内存如图 14.5\n\n图 14.5：程序 14.9 占据的内存空间\n\n### 嵌套结构体\n\n嵌套结构是指在另一个结构内部定义结构体的概念。它允许创建层次级或嵌套结构，其中一个结构是另一个结构的成员。参见以下程序，该程序接受个人的出生日期。出生日期进一步包含日、月、年：\n\
  \n// 程序 14.10 使用嵌套结构接受出生日期\n\n```c\n#include <stdio.h>\n\nstruct Date {\n    int\
  \ day;\n    int month;\n    int year;\n};\n\nstruct Person\n{\n    char name[50];\n\
  \    struct Date dob; // 嵌套结构\n};\n\nint main()\n{\n    struct Person person;\n\
  \    printf(\"Enter name: \");\n    scanf(\"%s\", person.name);\n    printf(\"Enter\
  \ the date of birth (DD MM YYYY):\");\n    scanf(\"%d%d%d\",&person.dob.day,&person.dob.month,\
  \ &person.dob.year);\n    printf(\"\\nPersonal Details:\\n\");\n    printf(\"Name:\
  \ %s\\n\", person.name);\n    printf(\"Date of Birth: %02d-%02d-%04d\\n\", person.dob.day,\
  \ person.dob.month, person.dob.year);\n    return 0;\n}\n```\n\n输出：\n`Enter name:\
  \ KAMALEP`\n`Enter the date of birth (DD MM YYYY):05 07 1987`\n`Personal Details:`\n\
  `Name: KAMALEP`\n`Date of Birth: 05-07-1987`\n\n在前面的程序中，我们有两个结构：`Date` 和 `Person`。`Date`\
  \ 结构包含三个整数成员：`day`、`month` 和 `year`。`Person` 结构包含一个字符数组 `name` 和一个用于出生日期的嵌套结构 `dob`。\n\
  \n在 `main()` 函数中，我们创建了一个 `Person` 对象。第一个 `scanf()` 接受姓名并存储在 `person.name`。第二个 `scanf()`\
  \ 要求输入出生日期并存储在 `person.dob.day`、`person.dob.month` 和 `person.dob.year`。最后，`printf()`\
  \ 显示输入的信息。\n\n### 在函数中传递结构体\n\n要将结构体作为函数参数传递，可以使用值传递或引用传递。程序 14.11 显示了这两种方法：\n\n\
  \n\n\n* 结构体（structure）是一种用户定义的数据类型，包含不同数据类型的变量，这些变量被称为成员。\n* 在结构体中，每个成员都有自己分配的内存空间。\n\
  * 使用点运算符（`.`）访问结构体的成员。\n* 结构体通常用于表示复杂的数据结构，如记录、对象或数据包。\n* 联合体（union）也是用户定义的数据类型，可以包含不同数据类型的变量，但所有成员共享相同的内存空间。\n\
  * 与结构体不同（结构体的每个成员都有独立空间），联合体一次只允许一个成员处于状态。\n* 修改联合体中某个成员的值将覆盖其他成员的值。\n* 当需要在同一位置存储不同类型的数据时，联合体可以节省内存。\n\
  * 联合体通常用于低级编程，以及对内存效率至关重要的场景。\n* 联合体的大小由其包含的最大成员决定。\n* 结构体可以嵌套在其他结构体或联合体内，创建复杂的层次级数据结构。\n\
  * 结构体和联合体可以数组、指针和其他高级语言特性配合。\n* 结构体可以为成员分配默认值，而联合体不能。\n* 结构体通常用于组织相关数据，而联合体用于多个数据类型共享相同内存空间的场景。\n\
  * 结构体的成员可以大小不同，而联合体的成员必须能够放入联合体的大小范围内。\n* 结构体和联合体为编程语言中的数据组织、操作和内存管理提供了强大的工具。\n\n\
