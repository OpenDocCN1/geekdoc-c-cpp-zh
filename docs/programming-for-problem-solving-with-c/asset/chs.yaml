  \    printf(\"The file is deleted successfully\");\n    else\n    printf(\"The file\
  \ is not deleted\");\n}\n```\n\n## 内存分配\n\n内存分配是为程序保留内存以存储变量、常量、结构体等的过程。\n\nC 语言中内存分配的两种方法如下：\n\
  \n- **静态内存分配**指在编译时或程序启动时为变量分配内存。一旦分配内存，就无法增加。例如，数组使用了静态内存分配技术。我们必须提前告诉编译器内存的需求。以下语句在数组\
  \ `a` 中静态分配了十个连续的整数类型空间。\n  ```c\n  int a[10];\n  ```\n- **动态内存分配**指在运行时为变量分配内存。动态内存分配通常使用存在\
  \ `stdlib.h` 中的四个内置函数。它们是 `malloc()`、`calloc()`、`realloc()` 和 `free()`。\n\n### malloc()\n\
  \n`malloc` 是 memory allocation（内存分配）的缩写。它在运行时（动态地）分配内存。`malloc()` 分配的内存包含垃圾值。因此，初始化它是程序员的职责。如果\
  \ `malloc()` 无法分配内存，它将返回 `NULL`。通常，它的写法如下：\n\n```c\ncast_type* ptr;\nptr = (cast_type*)\
  \ malloc(n * sizeof(data_type));\n```\n\n其中：\n- `ptr` 是 `cast_type` 类型数据的指针。\n-\
  \ `malloc()` 是一个函数名。\n- `n` 是 `data_type` 类型的内存块数量。\n- `sizeof()` 是计算 `data_type`\
  \ 大小的运算符，并以字节为单位返回大小。\n- 它接受一个形式为 `n * sizeof(data_type)` 的参数，即为要分配的总空间。用户在运行时给出\
  \ `n` 的值。`n` 的值乘以数据类型的大小相。\n\n例如：\n\n```c\nint* ptr;\nptr = (int*) malloc(10 * sizeof(int));\n\
  ```\n\n该语句动态分配了等于 10 个整数大小的空间。在该语句成功执行后，第一个位置的地址被赋值给 `ptr` 指针。如果无法分配内存，`ptr` 将赋值为\
  \ `NULL` 指针。\n\n// 程序 19.8 使用 `malloc` 函数计算用户输入的 n 个数字之和\n\n```c\n#include <stdio.h>\n\
  #include <stdlib.h>\n\nint main()\n{\n    int *ptr;\n    int n, i, sum = 0;\n  \
  \  printf(\"Enter the number of elements: \");\n    scanf(\"%d\", &n);\n    ptr\
  \ = (int*) malloc(n * sizeof(int));\n    if(ptr == NULL) // 如果无法分配内存\n    {\n  \
  \      printf(\"Error! Memory not allocated.\");\n        exit(0);\n    }\n    printf(\"\
  Enter elements: \");\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &ptr[i]);\n\
  \        sum = sum + *(ptr + i);\n    }\n    printf(\"Sum = %d\", sum);\n    free(ptr);\
  \ // 释放由 malloc() 分配的空间\n    return 0;\n}\n```\n\n**Output:**\nEnter the number\
  \ of elements: 5\nEnter elements: 1\n3\n5\n7\n9\nSum = 25\n\n### calloc()\n\n`calloc`\
  \ 是 contiguous allocation（连续分配）的缩写。它也在运行时（动态地）分配内存。默认情况下，它将分配的内存初始化为零。如果无法分配内存，它将返回\
  \ `NULL`。通常，它的写法如下：\n\n```c\ncast_type* ptr;\nptr = (cast_type*) calloc(n, sizeof(data_type));\n\
  ```\n\n其中：\n- `ptr` 是 `cast_type` 类型数据的指针。\n- `calloc()` 是一个函数名。\n- `n` 是 `data_type`\
  \ 类型的内存块数量。\n- `sizeof()` 是计算 `data_type` 大小的运算符，并以字节为单位返回大小。\n- 它接受两个参数：`n` 和 `sizeof(data_type)`。\n\
  \n例如：\n\n```c\nint* ptr;\nptr = (int*) calloc(10, sizeof(int));\n```\n\n该语句动态分配了等于\
  \ 10 个整数大小的空间。在该语句成功执行后，第一个位置的地址被赋值给 `ptr` 指针。如果无法分配内存，`ptr` 将赋值为 `NULL` 指针。\n\n\
  // 程序 19.9 使用 `calloc` 函数计算用户输入的 n 个数字之和\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
  \nint main()\n{\n    int *ptr;\n    int n, i, sum = 0;\n    printf(\"Enter the number\
  \ of elements: \");\n    scanf(\"%d\", &n);\n    ptr = (int*) calloc(n, sizeof(int));\n\
  \    if(ptr == NULL) // 如果无法分配内存\n    {\n        printf(\"Error! Memory not allocated.\"\
  );\n        exit(0);\n    }\n    printf(\"Enter elements: \");\n    for(i = 0; i\
  \ < n; i++)\n    {\n        scanf(\"%d\", &ptr[i]);\n        sum = sum + *(ptr +\
  \ i);\n    }\n    printf(\"Sum = %d\", sum);\n    free(ptr); // 释放由 calloc() 分配的空间\n\
  \    return 0;\n}\n```（此处对应示例逻辑翻译）\n\n### realloc()\n\n`realloc` 是 re-allocation（重新分配）的缩写。它调整之前分配的内存。它允许增加或减少之前分配的空间。其通用语法如下：\n\
  \n```c\ncast_type* ptr;\nptr = realloc(ptr, n * sizeof(data_type));\n```\n\n其中：\n\
  - `ptr` 是 `cast_type` 类型数据的指针。\n- `realloc()` 是一个函数名。\n- `n` 是 `data_type` 类型的内存块数量。\n\
  - `sizeof()` 是计算 `data_type` 大小的运算符，并以字节为单位返回大小。\n\n例如：\n\n```c\nint* ptr;\nptr\
  \ = realloc(ptr, 10 * sizeof(int));\n```\n\n该语句动态调整之前分配内存的大小。如果无法分配内存，它将返回 `NULL`\
  \ 指针。\n\n// 程序 19.10 使用 `realloc` 函数计算用户 n 个数字之和\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n\nint main()\n{\n    int *ptr;\n    int n, n1, sum = 0;\n    printf(\"\
  Enter the number of elements: \");\n    scanf(\"%d\", &n);\n    ptr = (int*) malloc(n\
  \ * sizeof(int));\n    if(ptr == NULL) // 如果无法分配内存\n    {\n        printf(\"Error!\
  \ Memory not allocated.\");\n        exit(0);\n    }\n    printf(\"Enter elements:\
  \ \");\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &ptr[i]);\n   \
  \     sum = sum + *(ptr + i);\n    }\n    printf(\"Sum = %d\", sum);\n    printf(\"\
  \\nEnter the new size: \");\n    scanf(\"%d\", &n1);\n    //重新分配内存\n    ptr = realloc(ptr,\
  \ n1 * sizeof(int));\n    printf(\"Enter some more elements: \");\n    for(i = 0;\
  \ i < n1; i++)\n    {\n        scanf(\"%d\", &ptr[i]);\n        sum = sum +ptr[i];\n\
  \    }\n    printf(\"Sum=%d\",sum);\n    free(ptr); // 释放\n    return 0;\n}\n```\n\
  \n**Output:**\nEnter the number of elements: 4\nEnter elements: 1\n2\n3\n4\nSum\
  \ = 10\nEnter the new size: 5\nEnter some more elements: 1\n2\n3\n4\n5\nSum=25\n\
  \n\n\n\n下一章将引入空间和时间复杂度的概念来衡量算法的性能。它还讨论了渐近表示法，如 Big-Oh、Big Omega 和 Theta。\n\n## 需要记忆的点\n\
  \n*   存储在次级存储设备（如硬盘）中的相关数据集合称为文件。\n*   文本文件包含人类可读的文本数据，而二进制文件以二进制格式存储数据。\n*   静态内存分配在编译时分配空间。\n\
  *   动态内存分配在运行时分配空间。\n*   `malloc()` 用于动态分配空间。默认情况下，它将分配的内存初始化为垃圾值。如果分配内存失败，它返回 `NULL`。\n\
  *   `calloc()` 用于动态分配空间。默认情况下，它将分配的内存初始化为零。如果分配内存失败，它返回 `NULL`。\n*   `malloc` 代表内存分配（memory\
  \ allocation），`calloc` 代表连续分配（contiguous allocation），而 `realloc` 代表重新分配（re-allocation）。\n\
  *   `free()` 函数用于释放动态占据的空间。\n*   `realloc()` 函数通过增加或减少分配内存块的大小，动态地调整或重新分配分配内存块。\n\
