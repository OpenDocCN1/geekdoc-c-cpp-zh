  \ 6 的数字是 7\n位置 7 的数字是 8\n位置 8 的数字是 9\n位置 9 的数字是 10\n\n// 程序 10.8 用于输入并显示二维数组。\n\n\
  ```c\n#include<stdio.h>\n\nint main()\n{\n    int a[2][2];\n    for(int i=0; i<2;i++)\n\
