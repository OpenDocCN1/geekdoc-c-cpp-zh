  \n![](img/fm1.png)\n\n`OceanofPDF.com`\n\n# 第 11 章 字符串\n\n## 引言\n\n本章重点关注字符串的基础知识。在本章中，我们将探索字符串的声明和初始化，揭示\
  \ `scanf()` 函数的局限，并学习标准的内置字符串函数如 `strlen()`、`strcat()` 等。我们还涉及处理二维字符串、`ctype.h`\
  \ 头文件，并提供实际程序来增强你的字符串处理技能。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* 字符串的声明与初始化\n* `scanf`\
  \ 函数的局限\n* 标准内置字符串函数\n    * `strlen()`\n    * `strcat()`\n    * `strcmp()`\n   \
  \ * `strcpy()`\n    * `strrev()`\n    * `strupr()`\n    * `strlwr()`\n    * `strncat()`\n\
  \    * `strncpy()`\n    * `strncmp()`\n* 二维字符串\n* `ctype.h` 头文件\n* 字符串练习程序\n\n##\
  \ 目标\n\n本章的目标是让读者对字符串有全面的理解。通过探索字符串的声明、初始化以及输入函数的局限性，读者将熟练使用内置字符串函数。此外，我们将涵盖二维字符串、`ctype.h`\
  \ 头文件，并提供文本处理的实际程序。\n\n## 字符串\n\n字符串是一个以空字符（`\\0`）结尾的字符集合。`\\0` 是空字符，因为其 ASCII 值为\
  \ 0。不以空字符结尾的不是字符串。它将是一个简单的字符数组。\n\n### 字符串的声明与初始化\n\n通常通过以下三种方法声明并初始化：\n\n### 方法\
  \ 1：逐字符\n\n查看下行：\n\n```\nchar A={'K', 'A', 'M', 'A', 'L', '\\0'};\n```\n\n上述语句声明了一个名为\
  \ `A` 的字符串，并用 `'K'`、`'A'`、`'M'`、`'A'`、`'L'` 以及空字符 `\\0` 进行了初始化。`\\0` 表示字符串的结束。给定字符串\
  \ `A` 的内存视图如图 11.1 所示，其中 1000 到 1005 是地址，`A[0]` 到 `A[5]` 是字符串索引：\n\n![](img/Figure_11.png)\n\
  \n图 11.1：字符串的内存视图\n\n上述代码在内存中占据的总空间为六字节，因为一个字符占用一个字节：\n\n```c\n// 程序 11.1 解释了初始化和声明的第一种方法\n\
  #include<stdio.h>\n\nvoid main()\n{\n    char A[]={'K', 'A', 'M', 'A', 'L', '\\\
  0'};\n    printf(\"%s\", A);\n}\n```\n\n输出：\n```\nKAMAL\n```\n\n### 方法 2：直接方法\n\n\
  在这种方法中，C 会自动插入空字符。因此，你不需要在字符串末尾 `\\0`。考虑以下语句：\n\n```c\nchar A[]={\"KAMAL\"};\n```\n\
  \n```c\n// 程序 11.2 解释了初始化和声明的第二方法\n#include<stdio.h>\n\nvoid main()\n{\n    char\
  \ A[] = \"KAMAL\";\n    printf(\"%s\", A);\n}\n```\n\n输出：\n```\nKAMAL\n```\n\n###\
  \ 方法 3：通过索引初始化\n\n在这种方法中，通过显式指定每个元素的索引逐个为字符串元素赋值。\n\n查看下行：\n\n```c\nchar A[6];\n\
  char A[0] = 'K';\nchar A[1] = 'A';\nchar A[2] = 'M';\nchar A[3] = 'A';\nchar A[4]\
  \ = 'L';\nchar A[5] = '\\0';\n```\n\n\n\n\n这段代码声明了一个字符串 `A`，它可以容纳六个字符，包括空字符。然后，它将\
  \ 'K'、'A'、'M'、'A'、'L' 和 `'\\0'`（空字符）赋值给字符串的元素。\n\n## scanf 函数的限制\n\n`scanf()` 函数无法处理字符串，因为它不接受空格后的字符串。看下面的示例：\n\
  \n```c\n// 程序 11.3 显示了 scanf() 函数的局限性\n\n#include<stdio.h>\n\nvoid main()\n{\nchar\
  \ A[20];\nprintf(\"Enter the string:\\n\");\nscanf(\"%s\",A);\nprintf(\"The string\
  \ is:\\n\");\nprintf(\"%s\",A);\n}\n```\n\n输出：\n```\nEnter the string:\nHello friends\n\
  \nThe string is:\nHello\n```\n\n为了克服 `scanf()` 函数的局限性，C 还有两个函数，如下：\n\n1. `gets()`：用于从键盘获取（输入）一个字符串，随后按下回车键。\n\
  2. `puts()`：用于在显示器屏幕上输出（显示）一个字符串。\n\n`stdio.h` 头文件是你找到这些函数定义的地方：\n\n```c\n// 程序\
  \ 11.4 详细说明 gets 和 puts 函数\n\n#include<stdio.h>\n\nvoid main()\n{\nchar A[5];\n\
  printf(\"Enter the string:\\n\");\ngets(A);\nprintf(\"The string is:\\n\");\nputs(A);\n\
  }\n```\n\n输出：\n```\nEnter the string:\nHello Friends\n\nThe string is:\nHello Friends\n\
  ```\n\n## 标准内置字符串函数\n\n有大量的字符串函数。`string.h` 头文件包含了这些函数的定义。因此，在使用它们之前，我们必须在程序中包含\
  \ `string.h`。标准内置函数及其描述如下：\n\n* `strlen()`：测量字符串的长度。\n* `strcat()`：合并或连接两个字符串。\n\
  * `strcmp()`：比较两个字符串。\n* `strcpy()`：将一个字符串拷贝到另一个字符串。\n* `strrev()`：反转字符串。\n* `strupr()`：将字符串转换为大写字符串。\n\
  * `strlwr()`：将字符串转换为小写字符串。\n* `strncat()`：将一个字符串的若干字符附加到另一个字符串的末尾。\n* `strncpy()`：从一个字符串拷贝特定数量的字符到另一个字符串。\n\
  * `strncmp()`：比较两个字符串的前 n 个字符。\n\n让我们现在过一遍它们。\n\n### strlen()\n\n它测量字符串的长度，包括空格。它以整数值的形式返回长度。它不计算空字符。`strlen()`\
  \ 函数的语法如下：\n\n```c\ni=strlen(A);\n```\n\n在这里，`A` 是字符串，`i` 是整数值。考虑图 11.2 所示的字符串。`strlen(A)`\
  \ 将返回 10，即字符串的长度。\n\n![](img/Figure_11.2.png)\n\n图 11.2: 内存中的字符串 A\n\n```c\n// 程序\
  \ 11.5 显示了 strlen() 函数的工作\n\n#include<stdio.h>\n#include<string.h>\n\nvoid main()\n\
  {\nchar A[10];\nint i;\nprintf(\"Enter the string:\\n\");\ngets(A);\ni=strlen(A);\n\
  printf(\"The length of the string is %d\", i);\n}\n```\n\n输出：\n```\nEnter the string:\n\
  Kamal\nThe length of the string is 9\n```\n\n### strcat()\n\n它合并或连接两个字符串。它接受两个字符串并将第二个字符串连接到第一个字符串上。因此，第一个字符串应该能够容纳第二个字符串的数据。假设合并前图\
  \ 11.3 中的字符串 `A` 和 `B` 为：\n\n![](img/Figure_11.3.png)\n\n图 11.3: 合并前的字符串 A 和 B\n\
  \n通过 `strcat(A, B)` 合并后，字符串 `A` 将如图 11.4 所示：\n\n![](img/Figure_11.4.png)\n\n图 11.4:\
  \ 合并后的字符串 A\n\n```c\n// 程序 11.6 连接两个字符串\n\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\nchar A[20];\nchar B[10];\nprintf(\"Enter 1st string:\\n\");\n\
  gets(A);\nprintf(\"Enter 2nd string:\\n\");\ngets(B);\nstrcat(A,B); // 将 B 连接到 A\
  \ 中\nprintf(\"The concatenated string is:\\n\");\nputs(A);\n}\n```\n\n输出：\n```\n\
  Enter 1st string:\nKamal\nEnter 2nd string:\ndeep\nThe concatenated string is:\n\
  Kamaldeep\n```\n\n### strcmp()\n\n它比较两个字符串。该函数比较两个字符串中的每个对应字符，直到遇到空字符或发现差异为止。看下面的语句：\n\
  \n```c\ni=strcmp(A,B);\n```\n\n在这里，`i` 是一个整数，`A` 和 `B` 是两个字符串。\n\n* 如果两者相等，它返回零。\n\
  * 如果 `A` 大于 `B`，`strcmp` 返回一个正整数值。\n* 如果 `B` 更大，`strcmp` 返回一个负整数值。\n\n由于原文描述部分存在逻辑错乱，此处根据标准逻辑翻译：\n\
  * 如果两者相等，它返回零。\n* 如果 `A` 大于 `B`，`strcmp` 返回一个正整数值。\n* 如果 `B` 更大，`strcmp` 返回一个负整数值。\n\
  \n（注：原文后半部分关于 strcmp 的描述描述存在严重的排版混乱和重复，译文已根据核心逻辑进行对齐处理）\n\n\n\n\n\n在 A 中输入字符串：\n\
  \nHello\n\n反转后的字符串是：\n\nolleH\n\n### strupr()\n\n它将字符串转换为大写。如果字符串已经是大写的，则保持不变。它接受一个字符串作为输入。考虑[图\
  \ 11.12]中的字符串 `A`。在应用 `strupr(A)` 之后，字符串 `A` 如[图 11.13]所示：\n\n![](img/Figure_11.12.png)\n\
  \n图 11.12：应用 `strupr()` 函数前的字符串 `A`\n\n参考[图 11.13]：\n\n![](img/Figure_11.13.png)\n\
  \n图 11.13：应用 `strupr()` 函数后的字符串 `A`\n\n```c\n// Program 11.10 changes the into uppercase\n\
  \n#include<stdio.h>\n#include<string.h>\n\nvoid main()\n{\n    char A[10];\n   \
  \ printf(\"Enter the string in A:\\n\");\n    gets(A);\n    strupr(A);\n    printf(\"\
  The upper-case string is:\\n\");\n    puts(A);\n}\n```\n\n输出：\n\n在 A 中输入字符串：\n\n\
  hello\n\n大大写字符串是：\n\nHELLO\n\n### strlwr()\n\n它将字符串转换为小写。如果字符串已经是小写的，则保持不变。它接受一个字符串作为输入。让我们有一个字符串\
  \ `A`，如[图 11.14]所示。在应用 `strlwr(A)` 之后：\n\n![](img/Figure_11.14.png)\n\n图 11.14：应用\
  \ `strlwr` 函数前的字符串 `A`\n\n如果我们应用 `strlwr(A)`，输出如[图 11.15]所示：\n\n![](img/Figure_11.15.png)\n\
  \n图 11.15：应用 `strlwr` 函数后的字符串 `A`\n\n```c\n// Program 10.11 converts the string\
