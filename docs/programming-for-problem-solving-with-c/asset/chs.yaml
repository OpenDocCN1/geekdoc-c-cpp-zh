  \ is: hello\n```\n\n## 总结\n\n本章讨论了字符串，它是一种以空字符结尾的字符序列，可以使用 `char` 数据类型声明并并通过括号进行初始化。\n\
  \n\n\n\n本章专门介绍编程的基础构建模块——函数。在代码世界中，函数是增强组织性、可重用性和效率的本质工具。在整个章节中，我们将探索函数的意义、各种类型的函数、参数以及调用约定。我们还将深入探讨将数组传递给函数的艺术，以及\
  \ C 语言中存储类的作用。\n\n## 目录结构\n\n在本章中，我们将讨论以下主题：\n\n* 函数的必要性\n* 函数的类型\n* 参数的类型\n* 基于函数参数划分的函数类型\n\
  * 调用约定\n* 向函数传递数组\n* C 语言中的存储类\n\n## 目标\n\n本章的目标是让读者对编程中的函数有全面的理解。读者将探索函数的重要性、类型、不同的参数类别以及调用约定。本章还深入探讨了向函数传递数组以及\
  \ C 语言中存储类的重要性，为读者提供有效软件开发所需的必备技能。\n\n## 函数\n\n程序可以被分为不同的独立子程序或模块，这些被称为函数。函数执行特定的任务，其工作过程与其他函数完全隔离。它也被称为方法、子例程或过程。\n\
  \n[图 12.1] 显示了 `main()` 函数如何调用另一个函数 `fun()`。在这里，`main()` 函数是调用函数，而 `fun()` 是被调用函数。\n\
  \n![](img/Figure_12.1.png)\n\n图 12.1：`main()` 调用 `fun()`\n\n当一个函数调用另一个函数时，程序的控制权将移交给被调用的函数。被调用函数负责执行特定任务，一旦到达闭合括号，它就会控制权传回给调用函数。\n\
  \n## 函数的必要性\n\n任何程序对函数的需要可以分为以下几点：\n\n* 模块化（Modularity）：函数将大问题分解为较小的子问题。这些小的子问题可以使用函数轻松地解决。\n\
  * 可重用性（Reusability）：一旦写好了函数，就可以在程序中通过简单的调用来重复使用。因此，函数增加了可重用性。\n* 易用性（Easiness）：用户可以使用内置函数，而无需操心这些函数的内部代码。\n\
  \n## 函数的类型\n\n用户可以创建自己的函数，也可以使用现有的函数。以下是两种类型的函数。\n\n* 内置或预定义函数：C 语言的头文件提供了许多内置函数，可以根据需求在程序中调用。例如，`printf()`、`scanf()`、`strcat()`\
  \ 等。在程序中调用它们之前，我们必须包含定义该函数的头文件。\n* 用户定义函数：由用户根据其需求创建。用户根据自己的方便决定函数的名称。创建这些函数需要以下部分：\n\
  \n    * 函数声明或原型（Function declaration or prototyping）：在不实际提供函数实现的情况下，它告诉编译器关于函数的返回类型、函数名和参数列表。它写在程序顶部，头文件之后。声明末尾必须强制加分号。如果被调用的函数定义在调用函数之前给出，则可以避免函数原型。函数原型的通用形式如下：\n\
  \n      `return_type function_name(parameter list);`\n\n    * 函数定义（Function definition）：它由函数头和函数体组成。函数头包含返回类型、名称以及列在括号内的形式参数（如果有的话）。函数原型以分号结束，但函数定义头则没有；这是两者之间唯一的区别。以下是函数定义各部分的描述。\n\
  \n        * 返回类型（Return type）：函数可以向调用函数发送一个值，这被称为返回类型。不返回任何内容的函数在名称前使用 `void`。\n\
  \        * 函数名（Function name）：它是函数的名称。\n        * 参数（Parameters）：它是从调用函数传递到被调用函数的信息。它作为函数的输入。如果函数没有参数，可以在括号中使用\
  \ `void`，或者留空括号。\n        * 函数体（Function body）：这些是括号内的语句，告诉我们函数的功能。\n\n      函数定义为函数在内存中分配空间。其语法如下：\n\
  \n      ```\n      return_type function_name(parameter list) // 函数头\n      {\n \
  \     // 函数体\n      }\n      ```\n\n    * 函数调用（Function calling）：每当主程序中需要函数时，就可以调用它。在程序中调用函数需要函数名和参数。当函数被调用时，控制权从调用函数转移到被调用函数。用分号结束函数调用。其语法如下：\n\
  \n      ```\n      function_name(parameter list);\n      ```\n\n      上述语法在实际代码中可以写如下：\n\
  \n      ```\n      sum(x, y);\n      ```\n\n      `sum` 是函数名，`x` 和 `y` 是括号中的整数参数。\n\
  \n// 程序 12.1 使用函数打印 HELLO\n\n```\n#include<stdio.h>\n\nvoid print (void); // 函数声明或原型\n\
  \nvoid main()\n{\nprint( ); // 函数调用\n}\n\nvoid print() //函数定义\n{\nprintf(\"HELLO\"\
  );\n}\n```\n\n输出：\nHELLO\n\n// 程序 12.2 使用函数加两个数，无参数传递\n```\n#include<stdio.h>\n\n\
  void sum(void); // 函数声明或原型\n\nvoid main()\n{\nsum(); // 函数调用\n}\n\nvoid sum() //函数定义\n\
  {\nint a,b,c;\na=10;\nb=20;\nc=a+b;\nprintf(\"%d\",c);\n}\n```\n输出：\n30\n\n// 程序\
  \ 12.3 使用参数传递函数加两个数\n```\n#include<stdio.h>\n\nvoid sum(int, int); // 函数声明\n\nvoid\
  \ main()\n{\nint a,b;\na=10;\nb=20;\nsum(a,b); // 函数调用\n}\n\nvoid sum(int x, int\
  \ y) //函数定义\n{\nint c;\nc = x+y;\nprintf(\"%d\",c);\n}\n```\n输出：\n30\n\n// 程序 12.4\
  \ 使用参数传递函数加两个数并返回结果给 main\n```\n#include<stdio.h>\n\nint sum(int, int); // 函数声明\n\
  \nvoid main()\n{\nint a,b,d;\na=10;\nb=20;\nd = sum(a,b); // 函数调用\nprintf(\"%d\"\
  ,d);\n}\n\nint sum(int x, int y) //函数定义\n{\nint c;\nc = x+y;\nreturn c;\n}\n```\n\
  输出：\n30\n\n## 参数的类型\n\n参数有两种类型。\n\n* 实际参数（Actual parameters）：这些参数在函数调用中传递。实际参数中不需要指定数据类型。它们也被称为参数（argument）。看下面的函数调用：\n\
  \n  `Sum = add(3,5);`\n\n  在这里，3 和 5 是实际参数。\n* 形式参数（Formal parameters）：这些在函数定义中传递。我们必须为每个形式参数使用数据类型。\n\
  \n  `int Sum(int a, int b)` // 函数头\n\n  在这个函数定义中，int a 和 b 是形式参数。\n\n## 基于函数参数划分的函数类型\n\
  \n基于参数调用函数有两种不同的方法。让我们逐一介绍。\n\n### 按值传递（Call by value）\n\n这种技术将实际参数的值复制到形式参数中。在形式参数内进行的任何更改都不会影响实际参数。之前所有的示例都使用了按值传递的概念。参考[图\
  \ 12.2]：\n\n![](img/Figure_12.2.png)\n\n图 12.2：a 和 b 的拷贝传递给 x 和 y\n\n程序 12.5 显示了使用按值传递交换两个数的代码：\n\
  \n\n\n\n\n```c\n// 程序 12.5 使用传值调用交换两个数字。\n\n#include<stdio.h>\n\nvoid swap(int x,\
  \ int y);\n\nvoid main()\n{\n    int a = 10, b = 20;\n    swap(a, b); // 实际参数\n\
  \    printf(\"main 函数中的值为 a = %d b = %d\\n\", a, b);\n}\n\nvoid swap(int x, int\
  \ y) // x 和 y 是 a 和 b 的拷贝\n{\n    int t;\n    t = x;\n    x = y;\n    y = t;\n \
  \   printf (\"交换后的值为 x = %d y = %d\\n\", x, y);\n}\n```\n\n**输出：**\n```\n交换后的 x\
  \ = 20 y = 10\nmain 函数中的值为 a = 10 b = 20\n```\n\n**注意：** 被调用函数中 `x` 和 `y` 的任何修改都不会改变调用函数中\
  \ `a` 和 `b` 的值。\n\n## 指针简介\n\n指针是一种特殊的变量类型，用于保存另一个变量的地址。对于整数变量 `a`，指针 `p` 的声明如下：\n\
  \n```c\nint a=10;\nint *p; // 声明指针 p\np = &a; // 将 a 的地址赋值给指针 p\n```\n\n上述代码行在内存中创建了一个场景，如图\
  \ 12.3 所示：\n\n![](img/Figure_12.3.png)\n\n图 12.3: 指针 `*p` 存储着变量 `a` 的地址\n\n程序 12.6\
  \ 显示了使用指针打印变量及其地址的代码：\n\n```c\n// 程序 12.6 使用指针打印变量及其地址\n\n#include <stdio.h>\n\n\
  void main()\n{\n    int a=10;\n    int *p;\n    p = &a;\n    printf(\"value at a\
  \ = %d\\n\", *p); // 指针 p 访问 a 的值\n    printf(\"Address of a = %d\\n\", &a);\n \
  \   printf(\"Value of a = %d\\n\", a);\n}\n```\n\n**输出：**\n```\nvalue at a = 10\n\
  Address of a = 6422036\nValue of a = 10\n```\n\n## 引用传递\n\n在这种方法中，变量的地址作为实际参数传递。在形式参数中使用指针来保存实际参数的地址。这些地址被用于在函数定义内部访问实际参数。这意味着对形式参数所做的修改会影响实际参数。因此，在形式参数上执行的操作将体现在实际参数上。引用传递的概念如图\
  \ 12.4 所示：\n\n![](img/Figure_12.4.png)\n\n图 12.4: `a` 和 `b` 的地址通过 `*x` 和 `*y` 传递\n\
  \n程序 12.7 显示了使用引用传递交换两个数字的代码：\n\n```c\n// 程序 12.7 使用引用传递交换两个数字\n\n#include<stdio.h>\n\
  \nvoid swap(int*, int*);\n\nvoid main()\n{\n    int a = 10, b = 20;\n    swap(&a,\
  \ &b); // 传递了地址\n    printf(\"main 函数中 a 和 b 的值为: %d, %d\\n\", a, b);\n}\n\nvoid\
  \ swap(int *x, int *y)\n{\n    int t;\n    t = *x;\n    *x = *y;\n    *y = t;\n\
  \    printf(\"交换后的值:%d, %d\\n\",*x,*y);\n}\n```\n\n**输出：**\n```\n交换后的值:20. 10\n\
  main 函数中 a 和 b 的值为: 20, 10\n```\n\n## 调用约定\n\n调用约定告诉我们参数传递给函数的顺序以及函数考虑这些参数的顺序。C\
  \ 语言中的函数允许从右向左的调用约定。考虑以下语句：\n\n```c\nint a=10;\nprintf(\"%d %d %d %d\",a,--a,a++,--a);\n\
  ```\n\n上一行似乎会生成输出 `10 9 9 9`；令人惊讶的是它产生了 `9 9 9 9`。\n\n众所周知，在函数中，值是从右到左的顺序求解的，这意味着表达式\
  \ `--a`（前自减）首先求解，产生值 `9`。\n\n同样，按照相同的顺序，表达式 `a++` 打印值 `9`。由于它是后自增运算符，该值会加 1。现在，内存中“a”的值为\
  \ `10`。通过 `--a` 将 `10` 减为 `9`，然后打印 `9`。最后，原样打印 `9`。因此，输出为 `9 9 9 9`。\n\n## 将数组传递给函数\n\
  \n（注：由于提供的文本后续部分存在大量重复且逻辑混乱，此处仅翻译标题及开头描述）\n\n\n\n\n\n- **生命周期/生存期 (Lifetime/existence)**：它告诉该变量在内存中存在多久。\n\
  - **作用域/可见性 (Scope/visibility)**：它指定了在程序的哪个部分可以访问变量的值。例如，定义的块内部、整个程序等。\n\n存储类的类型如下：\n\
  \n### 自动存储 (Automatic)\n- 在变量声明中使用 `auto` 关键字。在 C 语言中，每个局部变量默认都是自动。可以这样声明：\n\n```c\n\
  auto int a;\n```\n\n上一行与 `int a` 相同。自动变量具有以下特征：\n- **内存**：它存储在 RAM 中。\n- **默认值**：变量由随机值初始化，即垃圾值。\n\
  - **生命周期**：当你离开创建该自动变量的块时，分配给它的内存会被释放。\n- **作用域**：作用域限制在定义它的块内。\n\n程序 12.12 显示了一个自动变量的代码：\n\
  \n```c\n// Program 12.12 shows an auto variable\n#include <stdio.h>\n\nvoid main()\n\
  {\n    auto int a;\n    printf(\"%d\",a);\n}\n```\n\n输出：\n任意垃圾值\n\n### 静态存储 (Static)\n\
  - 使用 `static` 关键字。声明如下：\n\n```c\nstatic int a;\n```\n\n静态变量具有以下特征：\n- **内存**：它存储在\
  \ RAM 中。\n- **默认值**：它自己初始化为零。\n- **生命周期**：它保持值直到主程序结束，并且在多次函数调用之间保持其值。\n- **作用域**：只有定义这些变量的函数或块可以查看这些变量的值。\n\
  \n程序 12.13 显示了一个静态变量的代码：\n\n```c\n// Program 12.13 shows a static variable\n#include\
  \ <stdio.h>\n\nvoid main()\n{\n    static int a;\n    printf(\"%d\",a);\n}\n```\n\
  \n输出：\n0\n\n### 寄存器 (Register)\n- 使用 `register` 关键字。它将内存在 CPU 寄存器中。因此，访问速度比自动变量更快。由于\
  \ CPU 寄存器空间较小，我们可以声明非常少的寄存器变量。例如，声明如下：\n\n```c\nregister int a;\n```\n\n寄存器变量具有以下特征：\n\
  - **内存**：它存储在 CPU 寄存器中。\n- **默认值**：任意随机值。\n- **生命周期**：离开块后，分配给寄存器变量的内存将被程序其他部分使用。\n\
  - **作用域**：作用域限制在定义它的块内。\n\n程序 12.14 显示了一个寄存器变量的代码：\n\n```c\n// Program 12.14 shows\
  \ a register variable\n#include <stdio.h>\n\nvoid main()\n{\n    register int a;\n\
  \    printf(\"%d\",a);\n}\n```\n\n输出：\n任意垃圾值\n\n### 外部或全局 (External or global)\n\
  - 使用 `extern` 关键字。这些变量定义在函数外部。例如：\n\n```c\nextern int a;\n```\n\n这是 `extern` 变量\
  \ `a` 的声明。这意味着 `a` 在另一个文件的某个地方已经定义。外部变量具有以下特征：\n- **内存**：它存储在 RAM 中。\n- **默认值**：默认初始化为零。\n\
  - **生命周期**：在程序的执行过程中一直存在。\n- **作用域**：在程序的每个部分都可用，使其具有全局性。\n\n程序 12.15 显示了一个 extern\
  \ 变量的代码：\n\n```c\n// Program 12.15 shows an extern variable\n//FILE1.C\n#include\
  \ <stdio.h>\n#include\"FILE2.c\"\nextern int a;\nint main()\n{\n    printf(\"Value\
  \ of a in first file = %d\",a);\n    return 0;\n}\n```\n\n输出：\nValue of a in first\
  \ file = 1020\n\n//FILE2.C\nint a = 1020;\n```\n\n在前面的代码中，创建了两个 C 文件，分别是 `FILE1.C`\
  \ 和 `FILE2.C`。`FILE1.C` 通过 `extern int a` 声明了一个外部变量并打印它。`a` 的值在另一个文件 `FILE2.C` 中给出。\n\
