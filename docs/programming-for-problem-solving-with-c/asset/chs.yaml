  \ 显示了宏与函数区别：\n\n| 宏 | 函数 |\n| :--- | :--- |\n| 它的展开发生在预处理阶段。是一个预处理器指令实体。 | 函数是编译实体。\
  \ |\n| 编译错误不会被检测，因为它们在传递给编译器之前就被处理了。 | 它检查编译错误。 |\n| 宏可能会导致代码重复，因为宏名称在每次出现时都会替换，可能会增加编译代码的大小。\
  \ | 函数提高了重用性。它们可以定义一次并在程序的不同多次调用。这减少了代码重复。 |\n| 宏不进行类型检查，因为它们是纯文本替换；也就是说，宏中的参数不评估类型。\
  \ | 函数进行类型检查。传递给函数的参数类型会函数的参数类型进行检查。 |\n| 在某些情况下，执行时间比函数短。 | 函数的执行时间更多。 |\n| 宏名称在编译前被替换。\
  \ | 发生了从调用者到被调用函数的控制转移。 |\n| 当小代码被多次使用时非常有用。 | 当大代码需要使用几次时有用。 |\n| 宏没有返回值。 | 函数可以有返回类型。\
  \ |\n\n## 条件指令](#contents.xhtml_sc3_402a)\n\n条件指令根据预处理阶段定义的特定条件包含或排除某些代码段。两个主要的条件指令如下：\n\
  \n* `#ifdef` 和 `#endif`\n* `#if` 和 `#elif`\n\n## #ifdef 和 #endif](#contents.xhtml_sc4_403a)\n\
  \n`#ifdef` 和 `#endif` 是预处理器指令，用于根据程序中是否存在特定的预处理器宏或符号有条件地包含或排除代码段。其语法如下：\n\n```c\n\
  #define macro_name\n\nvoid main()\n{\n\n#ifdef macro_name\n```\n\n\n```\nStatement\
  \ 1;\n\nStatement 2;\n\n…………………………….\n\nStatement N;\n\n#endif\n\n}\n```\n\n如果 `macro_name`\
  \ 在程序中有定义，则将执行该代码块；否则，将被跳过。`#endif` 标记代码块的结束。请看下面的程序。\n\n```c\n// Program 18.3 implements\
  \ the #ifdef and #endif\n\n#include<stdio.h>\n\n#define macro1\n\nvoid main()\n\n\
  {\n\n#ifdef macro1\n\nprintf( \"HEY!\\n\" );\n\n#endif\n\n#ifdef macro2\n\nprintf(\
  \ \"Hello!\\n\" );\n\n#endif\n}\n```\n\n输出：\n\nHEY!\n\n注意：程序中未定义 `macro2`，因此它被跳过了。\n\
  \n## #if and #endif\n\n`#if` 和 `#endif` 指令在编译过程中根据特定条件包含或排除某些代码段。\n\n`#if` 提供了一个由编译器评估的条件。如果条件为真（非零），则包含\
  \ `#if` 之后的代码进行编译。如果条件为假，则跳过该代码。`#endif` 指令标记条件块的结束。它的工作方式与 `else if` 链结构相同。查看下面的程序以获得进一步说明：\n\
  \n```c\n// Program 18.4 illustrates the use of #if and #endif\n\n#include<stdio.h>\n\
  \n#define NUM 1\n\nvoid main()\n{\n\n#if NUM < 1\n\nprintf( \"Hello 1!\\n\" );\n\
  \n#elif NUM < 2\n\nprintf( \"Hello 2!\\n\" );\n\n#else\n\nprintf( \"Hello 3!\\n\"\
  \ );\n\n#endif\n}\n```\n\n输出：\n\nHello 2!\n\n## Undefined directives\n\n它用于移除之前定义的宏定义。例如，`#undef`\
  \ 就是一个未定义指令。\n\n### #undef\n\n`#undef` 指令用于取消定义或移除之前定义的宏定义。请阅读以下代码：\n\n```c\n#define\
  \ PI 3.14159\n\n//code that uses PI\n\n#undef PI\n\n// PI macro is now undefined\n\
  \n//code that no longer uses PI\n```\n\n`#define` 指令定义了宏 `PI` 并将其赋值为 `3.14159`。紧随\
  \ `#define PI 3.14159` 的代码将使用它。`#undef` 指令用于移除 `PI` 宏。这意味着 `#undef PI` 指令之后的任何代码都不能再使用\
  \ `PI` 宏：\n\n```c\n// Program 18.5 illustrates the use of #undef directive\n\n#include\
  \ <stdio.h>\n\n#define PI 3.14159\n\nint main()\n{\n\n//code that uses PI\n\ndouble\
  \ radius = 5.0;\n\ndouble circumference= 2*PI*radius;\n\nprintf(\"The circumference\
  \ of a circle=%f\\n\",circumference);\n\n#undef PI\n\n// PI macro is now undefined\n\
  \n//code that no longer uses PI\n\n//double area = PI*radius*radius; the statement\
  \ will not work here\n\n//printf(\"The area of a square=%.2f.\\n\",area);\n\nreturn\
  \ 0;\n}\n```\n\n输出：\n\nThe circumference of a circle=31.42\n\n在前面的程序中，使用 `#undef`\
  \ 指令移除了 `PI` 宏。`#undef PI` 指令之后的任何代码不能再使用 `PI` 宏。\n\n## Conclusion\n\n本章介绍了预处理的细节。预处理器提供了允许文件包含、宏展开、条件编译和宏取消定义的指令。`#include`\
  \ 指令包含文件，实现了模块化的代码组织。使用 `#define` 定义宏提供了文本替换，而 `#undef` 则移除宏定义。如 `#ifdef`、`#endif`、`#if`\
  \ 和 `#elif` 等条件指令根据条件控制代码的包含。\n\n接下来的章节将使读者处理文件，包括对文件的各种操作。此外，它还将通过 `malloc()`、`calloc()`、`realloc()`\
  \ 和 `free()` 等各种函数阐述动态内存分配的概念。\n\n## Points to remember\n\n*   C 语言中的预处理器是一个在编译前对源代码进行各种操作的工具。\n\
  *   预处理器指令是给预处理器的指令，通过行首的 `#` 符号指定。\n*   文件包含指令（`#include`）用于将其他文件的内容包含到当前源文件中。\n\
  *   宏展开指令（如 `#define`）允许定义用于文本替换的宏。\n*   宏展开可以使用对象类宏（`#define`）或函数类宏（带参数的 `#define`）完成。\n\
  \n## Important questions\n\n1.  什么是 C 语言中的预处理器？\n2.  什么是预处理器指令？\n3.  文件包含指令（`#include`）的目的是什么？\n\
  4.  像 `#define` 这样的宏展开指令是如何工作的？\n5.  对象类宏和函数类宏之间有什么区别？\n6.  `#ifdef` 和 `#endif`\
  \ 等条件指令是如何工作的？\n7.  解释 `#if` 和 `#endif` 指令。\n8.  当 `#if` 中的条件为真（非零）时会发生什么？\n9. \
  \ `#undef` 指令的功能是什么？\n10. 如何使用 `#undef` 移除宏定义？\n11. `#define` 指令的作用是什么？\n12. 预处理器如何处理宏定义的代码？\n\
  13. 预处理器提供了哪些主要功能？\n14. `#include` 如何帮助代码组织？\n15. 有哪些类型的条件指令？\n\n\n\n\n本章旨在对编程中的文件处理和内存分配提供全面的理解。读者将学习文件的重要性、不同类型的文件，以及如何使用内置函数对文件进行操作。。此外，本章还涵盖了使用\
  \ `malloc()`、`calloc()`、`free()` 和 `realloc()` 等函数进行内存分配的技术，为读者在程序中进行有效的数据管理和内存优化提供了必要的技能。\n\
  \n## 文件\n\n存储在次级存储设备（如硬盘）中的一组相关数据称为 `file`（文件）。文件处理是一个基本概念，用于从外部存储中存储和检索信息。\n\n\
  C 语言中的文件处理涉及创建、打开、读取、写入和关闭文件。C 中的文件处理操作通过文件指针和标准库提供的一系列函数来实现。\n\n## 文件的必要性\n\n程序的输出通常接收在显示器屏幕上。有时，在显示器屏幕上显示数据是不够的。显示的数据可能很大，而屏幕尺寸有限。由于内存（`RAM`）是易失性的，因此不适合永久存储数据。文件克服了这些局限性。文件可以用于存储未来可能使用的数据。文件存储在非易失性硬盘等次级内存中。我们可以根据需要随时访问存储的文件。\n\
  \n## 文件的类型\n\n通常，C 进程处理以下两种类型的文件：\n\n* **文本文件**：文本文件包含人类可读的文本数据。文件中的字符使用 ASCII 编码表示。文本文件通常使用文本编辑器创建和编辑。使用\
  \ `fopen()`、`fprintf()`、`fscanf()`、`fgets()` 和 `fputs()` 等函数处理文本文件。\n* **二进制文件**：二进制文件以二进制格式存储数据，这意味着它可以包含任何类型的数据，包括非文本数据，如图像、音频、视频等。当数据的确切表示极其重要时会使用二进制文件。使用\
  \ `fread()`、`fwrite()` 和 `fseek()` 等函数处理二进制文件。\n\n## 通过内置函数对文件进行操作\n\n通过 `stdio.h`\
  \ 头文件中的内置函数，我们可以对文件执行以下操作：\n\n* **创建文件**：要对文件进行操作，必须先创建它。文件通过 `fopen()` 函数创建。\n\
  * **打开文件**：也可以使用 `fopen()` 函数打开文件，与创建文件类似。打开文件允许人们读取或修改其内容。\n* **读取文件**：可以使用 `fscanf()`\
  \ 或 `fgets()` 等函数读取文件数据。这些函数从文件中检索数据并将其存储在变量中以便后续处理。\n* **写入文件**：可以使用 `fprintf()`\
  \ 或 `fputs()` 函数将数据写入文件。\n* **关闭文件**：完成对文件的操作后，必须使用 `fclose()` 将其关闭。此步骤确保文件占用的所有系统资源都被释放。\n\
  * **删除文件**：使用 `remove()` 删除文件。\n\n### 打开文件\n\n文件通过 `fopen()` 创建。它接受两个参数：一个是要创建的文件名（包括路径），另一个是打开文件时的模式（例如：`w`\
  \ 用于写模式，`r` 用于读取，`a` 用于追加，`w+` 用于写、读和修改，`r+` 用于读、写和修改现有文件，`a+` 用于读取并在末尾添加新内容等）。\n\
  \n参见以下示例：\n\n```\nFILE *fp;\nfp=fopen(\"sum.c\", \"r\");\n```\n\n`sum.c` 文件将以读取模式（`r`）打开，并设置一个指向文件第一个字符的指针\
  \ `fp`。它由 `FILE *fp` 声明。指针 `fp` 的类型是指向 `FILE` 的指针。如果由于由于原因（如文件损坏、磁盘不可用等）无法打开，`fp`\
  \ 将返回 `NULL`。\n\n`fopen()` 的工作原理如下：\n\n1. 它查找你想要打开的文件。\n2. 它从磁盘检索文件并将其放入 `RAM` 中名为\
  \ `buffer` 的临时内存中。\n3. 它将第一个字符的地址分配给文件指针，如[图 19.1] 所示。\n4. 如果无法打开文件，指针将返回 `NULL`。\n\
  \n### 读取文件\n\n`fgetc()` 用于使用 `fopen()` 中的指针从当前位置读取一个字符。参见以下示例：\n\n```\nch = fgetc(fp);\n\
  ```\n\n它读取变量 `ch` 中的字符，并且指针 `fp` 加 1。如果指针返回 `EOF`，则意味着没有更多字符可以读取了。`EOF` 是一个宏，定义在\
  \ `stdio.h` 头文件中。`EOF` 字符放置在文件末尾，表示结束。\n\n查看[图 19.1]，它包含一个带有两个文件的硬盘：`Abc.txt` 和\
  \ `sum.c`。`RAM` 中的 `buffer` 存放 `Abc.txt` 的所有字符并以 `EOF` 字符结束。一个字符指针 `fp` 指向第一个字符。\n\
  \n参考[图 19.1]：\n\n![](img/Figure_19.1)\n\n### 关闭文件\n\n完成文件工作后，使用 `fclose()` 将其关闭是有关重要的。此步骤确保了文件占用的所有系统资源被释放。\n\
  \n## 删除文件\n\n`remove()` 用于删除文件。\n\n```c\nremove(\"abc.c\");\n```\n\n`abc.c` 是要删除的文件。如果删除成功，它返回零；否则返回非零。\n\
  \n## 程序 19.1：读取字符并显示它\n\n```c\n#include<stdio.h>\nvoid main() {\n    FILE *fp;\n\
  \    char ch;\n    fp=fopen(\"sum.c\",\"r\");\n    while(1) {\n        ch=fgetc(fp);\n\
  \        if(ch==EOF)\n            break;\n        printf(\"%c\",ch);\n    }\n  \
  \  fclose(fp);\n}\n```\n\n## 程序 19.2：将一个文件的内容复制到另一个文件\n\n```c\n#include <stdio.h>\n\
