  \n![](img/fm1.png)\n\n[OceanofPDF.com](https://oceanofpdf.com)\n\n# 第 5 章 解决问题的技巧\n\
  \n## 引言\n\n在本章中，我们将学习计算机编程背景下解决问题的的基本方面。我们将探索各种解决问题的技巧，并理解编程语言在表达我们的解决方案方面的作用。此外，我们将学习语言转译器或处理器，它们有助于将人类可读的代码转换为机器可执行的指令。另外，我们将探索程序的编译和执行过程，并对在编译期间处理语法错误和逻辑错误获得见解。在本章结束时，你将拥有开启编程之旅的坚实基础，并自信地应对各种挑战。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   解决问题的方法\n*   解决问题的技巧\n*   编程语言\n*   语言转译器或处理器\n\
  *   编译和执行过程\n*   编译中的语法错误和逻辑错误\n*   在编写、编译和执行 C 程序时生成的不同文件\n\n## 目标\n\n本章的目标是让读者理解解决问题和编程的概念。它涵盖了解决问题的方法和技巧、编程语言、语言转译器、编译和执行过程、语法和逻辑错误的处理，以及在编写、编译和执行\
  \ C 程序时生成的文件。其目的是让读者具备技能，能够自信地面对编程挑战，并编写高效、无错的 C 程序。\n\n## 解决问题\n\n解决问题是弄清楚为了解决问题需要做什么的过程。它从描述问题开始，以找到修复它的最佳方法结束。在找到解决方案之前，必须正确识别问题，然后将其转换为每个人都能理解的清晰、可执行的步骤。这些步骤中使用了不同的运算符来获得所需的解决方案。\n\
  \n## 逻辑和数值解决问题的步骤\n\n逻辑和数值解决问题涉及解决任何问题的以下主要步骤：\n\n1.  **分析问题**：这是理解问题的过程。为了更好地理解问题，你应该知道输入是什么，以及可能的输出是什么。这简单来说意味着知道解决问题所需的步骤及其可能的解决方案。此外，还会检查问题的可行性，以查看是否可以使用现有技术解决问题。\n\
  2.  **将复杂问题拆分为较小、简单的任务**：如果一个问题复杂且庞大，首先将其拆分为不同的模块。解决单个模块并将它们组合起来获得最终解决方案。（这是一个可选步骤。）\n\
  3.  **制定解决问题的计划**：在这一步中，将制定一个解决问题的计划。它包括将问题写成伪代码、流程图或算法的形式。伪代码、流程图和算法代表了你解决该问题的逐步执行策略。这一步为解决问题提供了逻辑。\n\
  4.  **执行计划**：通过使用 `C`、`C++`、`Python` 等合适的编程语言将算法或伪代码转换为程序（实际代码）。将程序输入计算机。计算机根据程序和数据生成结果作为输出。此输出可用于做出决策。\n\
  5.  **回溯**：一旦得到结果作为输出，可以根据程序和数据做出良好的决策。这种输出可以检查是否正确解决了问题。\n\n## 逻辑问题解决方法\n\n让我们解决一个逻辑问题：假设我们要通过以下步骤来测量\
  \ 4 升水：\n\n1.  **分析问题**：首先，使用 5 升桶和 3 升桶。\n2.  **将复杂问题拆分为较小、简单的任务**：这已经是简单的问题，因此不需要将其拆分为模块。（这是一个可选步骤。）\n\
  3.  **制定解决问题的计划**：伪代码代表了简单语言的计划。解决该逻辑问题的伪代码如下：\n    1.  装满 5 升桶。\n    2.  将水倒入 3\
  \ 升桶。\n    3.  清空 3 升桶。\n    4.  将水倒入 3 升桶中的水。\n    5.  再次装满 5 升桶。\n    6.  将 5\
  \ 升桶中的水倒入 3 升桶，直到 3 升桶满。\n    7.  清空 3 升桶。\n    8.  将 5 升桶中的剩余水倒入 3 升桶。\n    9.\
  \  再次装满 5 升桶。\n    10. 将 5 升桶中的水倒入 3 升桶，直到 3 升桶满。\n    11. 此时 5 升桶中剩下 2 升水。\n4.\
  \  **执行计划**：使用合适的编程语言（如 `C`、`C++`、`Python` 等）将算法转换为程序（实际代码）。\n5.  **回溯**：一旦得到结果，你可以回溯到你有其他选择的步骤。\n\
  \n## 数值问题解决方法\n\n让我们以两个数字相加的数值，遵循先前的步骤来解决，以便于理解概念：\n\n1.  **分析问题**：在这里，我们需要三个变量：两个输入，一个输出。让数字\
  \ `A` 和 `B` 为输入，`C` 为输出。所以，我们可以写成：\n    *   输入数字：整数 `A` 和 `B`\n    *   输出数字：整数 `C`\n\
  2.  **将复杂问题拆分为较小、简单的任务**：这已经是简单的问题。\n3.  **制定解决问题的计划**：伪代码代表了简单语言的计划。将数字 `A` 和 `B`\
  \ 加到第三个数字 `C` 的伪代码如下：\n    1.  开始\n    2.  输入：整数 `A` 和 `B`\n    3.  输出：整数 `C`\n\
  \    4.  `C=A+B`\n    5.  打印 `C`\n    6.  结束\n4.  **执行计划**：现在，可以将此伪代码转换为编程语言。以下代码在\
  \ `C` 语言中表示：\n\n```c\n#include<stdio.h>\n\nint main()\n{\n    int A, B, Sum = 0;\n\
  \    printf(\"Enter two numbers A and B : \\n\");\n    scanf(\"%d%d\", &A, &B);\n\
  \    Sum = A + B;\n    printf(\"Sum of A and B is: %d\", Sum);\n    return 0;\n\
  }\n```\n\n5.  **回溯**：一旦得到结果作为输出，你可以尝试另一种方法来解决它。如果输出不正确，重新检查计划和代码，寻找任何错误或其他修改以获得正确的输出。\n\
  \n## 解决问题的技巧\n\n\n\n\n\n算法、伪代码和流程图是使用计算机解决问题的关键技术或工具。此外，这些内容使用 `C`、`C++` 等编程语言转换为实际的计算机程序。\n\
  \n## 算法\n\n在不使用计算机硬件和软件的情况下，分步解决问题的计划被称为算法。然后，使用 `C`、`C++` 等编程语言将这些步骤以程序的形式写下来。这就是程序的制作方法。换句话说，算法是计算机程序的一种计划方案。\n\
  \n## 算法的特征\n\n*   **有限性**：在执行若干步后，算法必须能够结束。\n*   **无歧性或清晰性**：它的每个步骤及其输入和输出都应该是易于理解的，并且只能产生一种含义。\n\
  *   **输入**：它必须有清晰的方式来提供输入。\n*   **输出**：算法必须明确结果将是什么。\n*   **有效性**：每一步都必须是不可少的。\n\
  *   **语言无关性**：它可以用任何编程语言编写。\n\n以下是一些简单的算法示例：\n\n*   将两个数字 `A` 和 `B` 相加到第三个数字 `C`\
  \ 的算法：\n    1.  `START`\n    2.  声明三个整数 `A`、`B` 和 `C`\n    3.  输入 `A` 和 `B` 的值\n\
  \    4.  将 `A` 和 `B` 的值相加\n    5.  将第 4 步的输出存储到 `C`\n    6.  打印 `C`\n    7.  `STOP`\n\
  *   寻找两个数字中较大者的算法：\n    1.  `START`\n    2.  声明两个整数 `A`、`B`\n    3.  输入 `A` 和 `B`\
  \ 的值\n    4.  如果 `A > B`，则打印“A 较大”\n    5.  否则如果打印“B 较大”\n    6.  否则打印“两个数字相等”\n\
  \    7.  `STOP`\n*   判断一个数字是偶数还是奇数的算法：\n    1.  `START`\n    2.  声明一个整数 `A`\n  \
  \  3.  输入 `A` 的值\n    4.  如果 `A % 2 == 0`，则“打印该数字是偶数”\n    5.  否则“打印该数字是奇数”\n  \
  \  6.  `STOP`\n*   交换两个数字的算法：\n    1.  `START`\n    2.  声明三个整数 `A`、`B` 和 `T`\n \
  \   3.  输入 `A` 和 `B` 的值\n    4.  设置 `T = A`\n    5.  设置 `A = B`\n    6.  设置 `B =\
  \ T`\n    7.  打印 `A`、`B`\n    8.  `STOP`\n\n## 流程图\n\n流程图是一种显示类似于算法解决问题步骤的图表。它用于展示算法的工作原理。它就像算法的图形化表示。换句话说，它是另一种问题的表示技术，类似于算法，但以图表或图片的形式存在。它使用不同的连接符号来显示信息和控制流。以下是流程图中使用的一些基本符号：\n\
  \n*   **开始 (Start)**：这是起始符号，用椭圆形状表示。\n*   **结束 (End)**：这是结束符号，用椭圆形状表示。\n*   **箭头\
  \ (Arrows)**：箭头连接流程图中的符号，并显示程序的控制流。\n*   **处理 (Processing)**：用矩形表示。用于显示处理步骤。\n*\
  \   **输入 (Input)**：用于接收输入，用平行四边形符号表示。\n*   **输出 (Output)**：用于显示输出，用平行四边形符号表示。\n\
  *   **决策/条件 (Decision-making/conditional)**：菱形符号用于决策语句。它总是由两个箭头连接，箭头标记为“是 (Yes)”和“否\
  \ (No)”。根据菱形的条件，一次时间仅有一个箭头产生输出。\n*   **连接器 (Connectors)**：用圆形表示。它用于占据多页的复杂且大型流程图。该符号用于连接跨页流程图。它还包含一个带有标记的圆。表\
  \ 5.1 显示了流程图中使用的符号：\n\n| 符号 | 描述 | 称为 |\n| :--- | :--- | :--- |\n| ![](img/Table_5._A.jpg)\
  \ | 控制流 | 箭头 |\n| ![](img/Table_5._B.jpg) | 处理 | 矩形 |\n| ![](img/Table_5._C.jpg)\
  \ | 开始和结束 | 椭圆 |\n| ![](img/Table_5._D.jpg) | 输入和输出 | 矩形 |\n| ![](img/Table_5._E.jpg)\
  \ | 决策或条件 | 菱形 |\n| ![](img/Table_5._F.jpg) | 连接器 | 圆 |\n\n表 5.1：流程图中使用的符号\n\n将两个数字\
  \ `A` 和 `B` 相加到第三个数字 `C` 的流程图如图 5.1 所示，以便对前述符号进行适当的插说明：\n\n![](img/Figure_5.1.png)\n\
  \n图 5.1：两个数字相加的流程图\n\n另一个寻找两个数字中较大者的流程图如图 5.2 所示：\n\n![](img/Figure_5.2.png)\n\n\
  图 5.2：数字较大值的流程图\n\n判断一个数字是偶数还是奇数的流程图如图 5.3 所示：\n\n![](img/Figure_5.3.png)\n\n图 5.3：数字奇偶性的流程图\n\
  \n交换两个数字的流程图如图 5.4 所示：\n\n![](img/Figure_5.4.png)\n\n图 5.4：交换两个数字的流程图\n\n## 伪代码\n\
  \n算法、伪代码和流程图是使用计算机解决问题的关键技术或工具。此外，这些内容使用 `C`、`C++` 等编程语言转换为实际的计算机程序。\n\n伪代码是编写程序的的一种非正式方式。它关注算法的逻辑，而不涉及语言语法。它通常被用于教科书和研究论文。以下是伪代码的一些示例：\n\
  \n*   将两个数字 `A` 和 `B` 相加到第三个数字 `C` 的伪代码：\n    1.  `START`\n    2.  `INPUT A`, `INPUT\
  \ B`\n    3.  `C = A + B`\n    4.  `PRINT C`\n    5.  `END`\n*   寻找两个数字中较大者的伪代码：\n\
  \    1.  `START`\n    2.  `INPUT A`, `INPUT B`\n    3.  `IF A > B THEN PRINT \"\
  A 较大\"`\n    4.  `ELSE IF B > A THEN PRINT \"B 较大\"`\n    5.  `ELSE PRINT \"两个数字相等\"\
  `\n    6.  `END`\n*   判断一个数字是偶数还是奇数的伪代码：\n    1.  `START`\n    2.  `INPUT A`\n \
  \   3.  `IF A % 2 == 0 THEN PRINT \"该数字是偶数\"`\n    4.  `ELSE PRINT \"该数字是奇数\"`\n\
  \    5.  `END`\n*   交换两个数字的伪代码：\n    1.  `START`\n    2.  `INPUT A`, `INPUT B`\n\
  \    3.  `T = A`\n    4.  `A = B`\n    5.  `B = T`\n    6.  `PRINT A`, `B`\n   \
  \ 7.  `END`\n\n算法、流程图和伪代码之间的区别见表 5.2：\n\n| 算法 | 流程图 | 伪代码 |\n| :--- | :--- | :---\
  \ |\n| 它是分步解决问题的计划。 | 流程图是算法或解决问题步骤的图示表示。 | 它是编写程序的一种非正式方式。 |\n| 它理解起来很复杂。 | 它是易于理解的。\
  \ | 相比算法，它很难理解。 |\n| 使用文本编写算法。 | 使用不同的形状来绘制流程图。 | 使用文本和数学符号来编写算法。 |\n| 易于调试。 | 难以调试。\
  \ | 相比算法，它很难调试。 |\n\n表 5.2：算法、流程图和伪代码之间的区别\n\n## 编程语言\n\n为了指示计算机执行任务，需要一种被称为编程语言的语言。它通过编写计算机程序（一组指令/命令/语句）来与计算机进行通信。有三种编程语言，所示：\n\
  \n\n\n\n\n### 1. 机器级或低级语言 (LLL)\n这种语言只有两个符号，`0` 和 `1`（二进制数）。所有的数据和指令（程序）都应该用二进制代码编写。计算机可以直接理解用这种语言编写的代码，因为计算机只能理解二进制语言。它也被称为机器语言。它不需要翻译器（编译器、解释器）将其转换为其他形式，因为计算机可以直接理解它。它与计算机非常接近，因为计算机只理解\
  \ `0` 或 `1`。每台计算机都有特定的机器语言，因此它是依赖于机器的且不具有可移植性。用这种语言编写程序非常困难，在其中寻找错误（消除错误）更为困难。\n\
  \n1. 一个用于在二进制法下相两个数字的假设程序。以下程序仅由三个用二进制编写的命令组成：\n```\n01010111 11010101\n11010101\
  \ 10101011\n10101010 10101011\n```\n2. 通常情况下，机器级程序是用八进制或十六进制表示编写的。\n\n### 2. 高级语言\
  \ (HLL)\n它通过使用英语等自然语言来编写程序，简化了编程。因为它使用了自然语言，所以很容易学习。计算机不能直接理解用这种语言编写的代码，因为计算机只能理解二进制语言。因此，需要翻译器将\
  \ HLL 转换为 LLL，例如编译器、解释器等。它与人类非常接近，因为人类可以很容易理解它。它是机器无关且具有可移植性的，所以它的程序可以在任何计算机上执行。用这种语言编写程序非常简单，调试（消除错误）也非常容易。高级语言的示例有\
  \ `C`、`C++`、`JAVA`、`FORTRAN`、`PYTHON`、`PROLOG` 等。以下程序显示了一个用 C 语言编写的高级语言程序。示例：一个用\
  \ C 语言相两个数字的程序如下：\n\n```c\n#include<stdio.h>\n\nint main()\n{\n    int A, B, Sum\
  \ = 0;\n    printf(\"Enter two numbers A and B : \\n\");\n    scanf(\"%d%d\", &A,\
  \ &B);\n    Sum = A + B;\n    printf(\"Sum of A and B is: %d\", Sum);\n    return\
  \ 0;\n}\n```\n\n### 3. 汇编语言\n它使用符号来编写程序。这些符号被称为助记符，很容易记忆，例如 `ADD`、`SUB`、`MUL` 和\
  \ `DIV`。这些助记符是用英语编写的。它也被称为中间语言，因为它同时使用了自然语言和符号。它具有 HLL 和 LLL 的特点。计算机不能直接理解它们。用汇编语言编写的程序需要一个翻译器，即汇编器将其从汇编语言转换为\
  \ LLL。汇编语言中编写的所有指令随机器而异，因此它们是依赖机器的也就是说，在某台计算机上编写的程序不会在另一台计算机上执行。因为它依赖机器，所以与计算机非常接近。与\
  \ LLL 相比，用这种语言编写程序很容易，调试（消除错误）也很容易；与 HLL 相比则困难。\n\n示例：一个用汇编语言相两个数字的程序。以下程序由三个语句组成：\n\
  ```\nLOAD A\nADD B\nSTORE C\n```\n\n在 C 语言中，可以写成：\n```c\nC=A+B;\n```\n\n## 语言翻译器\n\
  语言翻译器或处理器将用一种语言编写的程序翻译或转换为另一种语言，例如从 HLL 到 LLL。用编程语言编写的程序被称为源代码；当它被翻译成机器语言时，就变成了目标代码。语言处理器的简单机制如图\
  \ 5.5 所示：\n\n![](img/Figure_5.5.png)\n\n图 5.5：语言翻译器\n\n通常三种语言翻译器，在以下小节中给出：\n\n##\
  \ 编译器\n是一个将 HLL 转换为 LLL 的程序。它接受一个完整的 HLL 程序作为输入并将其转换为 LLL。源代码是用 HLL 编写的程序。当它被转换为\
  \ LLL 时，就变成了目标代码。因此，编译器将源代码转换为所谓的目标代码。一旦找到了目标代码，就可以运行它以获得结果。这种翻译被称为编译。编译器的工作如图 5.6\
  \ 所示：\n\n![](img/Figure_5.6.png)\n\n图 5.6：编译器\n\n### 编译器的功能\n- 主要任务是将 HLL 转换为 LLL。\n\
  - 根据语言的语法（语法规则）寻找源代码中的错误。\n- 显示错误以便程序员可以将其删除。\n- 在主内存中为程序分配空间。\n- 产生目标代码。\n\n##\
  \ 解释器\n它逐行将 HLL 程序转换为 LLL 程序；也就是说，一次翻译并立即执行一条语句。程序语句直接逐行翻译成机器语言，而不产生任何目标代码。与编译器相比，解释器是一个占用内存空间较小的简单程序。与编译相比，解释程序是耗费时间的，因为在解释器中，每条语句都必须翻译。解释器的工作如图\
  \ 5.7 所示：\n\n![](img/Figure_5.7.png)\n\n图 5.7：解释器\n\n## 汇编器\n将汇编程序转换为机器或低级语言的软件称为汇编器。用汇编语言编写的程序被称为源代码，汇编器的输出目标代码。得到目标代码后，执行它以获得结果。见图\
  \ 5.8：\n\n![](img/Figure_5.8.png)\n\n图 5.8：汇编器\n\n### 汇编器的功能\n- 主要任务是将汇编转换为 LLL。\n\
  - 根据语言的语法（语法规则）寻找源代码中的错误。\n- 显示错误以便程序员可以将其删除。\n- 在主内存中为程序分配空间。\n- 产生目标代码。\n\n除了上述程序外，以下程序也支持编写和执行：\n\
  \n- 编辑器：编辑器是一个提供编写、修改和编辑源代码或文本平台的程序。这种文本编辑器自带用于编写、修改和编辑源代码或文本的命令。\n- 链接器：它通过组合编译器或汇编器生成的目标文件和其他代码片段创建一个可执行文件。链接器搜索并附加使文件可执行的所有库。它将两个或多个文件合并为一个文件，例如将程序的目标代码和库函数的目标代码合并为一个可执行文件。\n\
  - 加载器：它是将链接器的可执行代码加载到主内存并为计算机执行做好准备的程序。它在主内存中为程序分配内存。\n\n现在，所有的工具都组合在一个软件包中，被称为集成开发环境（IDE）软件。IDE\
  \ 的示例有 `Turbo C`、`CodeBlocks`、`Visual Studio`、`Microsoft Visual C++`、`Eclipse` 等。\n\
  \n## 编译执行过程\n将 C 程序（源代码）翻译成可执行文件涉及许多步骤，讨论如下：\n\n1. 在编辑器中编写程序，这是一个扩展名为 `.c` 的源代码。\n\
  2. 将源代码输入给编译器，编译器生成扩展名为 `.o` 的目标代码。如果发生某些错误（语法错误），程序员再次在编辑器中打开源代码，找到错误，删除它们并重新编译。\n\
  \n\n\n\n3. 通过链接器（linker），目标代码与某些额外文件（如库文件以及程序执行所需的其他代码段）链接。链接器生成带有 `.exe` 扩展名的二进制可执行文件。如果在链接过程中出现任何错误，例如链接器无法将文件链接到目标代码，则被称为链接错误（linking\
  \ error）。\n\n4. 该可执行文件由加载器（loader）加载到主内存中。\n\n5. 之后，程序开始执行，并以结果的形式生成输出。如果发生某些错误（运行时错误），程序员将再次在编辑器中打开源代码，找到错误并将其删除。\n\
  \n图 5.9 显示了完整的编译过程：\n\n![](img/Figure_5.9.png)\n\n图 5.9：编译与执行过程\n\n## 编译中的语法错误和逻辑错误\n\
  \n每种语言都有一套编写语句的规则，这些规则被称为语言语法。C 语言也有编写程序的语法。它包含以下两种类型：\n\n1. **语法错误 (Syntax error)**：如果程序员在编写语句时违反了语法规则，就会发生语法错误。它与语句的语法（编写语句语法的规则）有关。例如，语句末尾缺少分号、在程序中使用未声明的变量、写错关键词等。编译器在编译时识别出它。请检查以下程序：\n\
  \n```c\n#include<stdio.h>\n\nvoid main()\n{\nint a=2,b=3,c;\nc = a + b // 缺少分号：语法错误\n\
  printf(\"Sum is %d\",c);\ngetch();\n}\n```\n\n2. **逻辑或语义（意义）错误 (Logical or semantic\
  \ (meaning) error)**：当程序逻辑错误时发生这种错误。它与语句的含义有关。例如，如果程序员在加号的位置放置减号。这种错误在编译时不会被识别，而是在程序产生错误结果的运行时被识别。\n\
  \n一些逻辑错误所示所示：\n\n```\nA + B = C;\nA = B / 0;\n```\n\n检查以下程序：\n\n```c\n#include<stdio.h>\n\
  \nvoid main()\n{\nint a = 6, b = 3, c;\nc = a + b / 2; // 逻辑错误缺少括号：语义错误\nprintf(\"\
  Average of two number is = %d\", c);\ngetch();\n}\n```\n\n## C 程序生命周期中生成的文件\n\n\
  在编写、编译和执行 C 程序时，会生成不同的文件。一些重要的文件列如下：\n\n* **源代码 (Source code)**：当我们编写程序时，必须使用 `.c`\
  \ 扩展名保存。保存程序的过程会生成一个文件。例如，创建并保存一个名为 `sum.c` 扩展的文件。该文件被称为源代码。\n* **目标代码 (Object code)**：将源代码输入编译器，编译器生成另一个文件被称为目标代码。它具有\
  \ `.o` 扩展名，例如 `sum.o`。编译器的输入是源代码，编译器的输出是目标代码。\n* **可执行代码 (Executable code)**：通过链接器将目标代码与某些额外文件（如库文件以及程序执行所需的其他代码段）链接。链接器生成一个带有\
  \ `.exe` 扩展名的二进制可执行文件，被称为可执行代码。例如，目标代码 `sum.o` 被转换为 `sum.exe`。\n\n成功执行后，所有三个文件都存储在\
  \ C 工作目录中。完整过程见图 5.9。\n\n## 结论\n\n本章重点关注解决问题的方法以及在解决问题时使用的许多方法，如流程图、算法和伪代码。此外，还讨论了计算机语言的几个层次，如高级、低级和汇编级，以及用于这些层次之间转换的工具，如编译器、解释器和汇编器。它还解释了将算法转换为程序的流程。\n\
  \n因此，下一章将讨论 C 编程语言的介绍和历史。这是因为所有的程序解决方案都需要转换为计算机程序。此外，我们将讨论 C 程序的内核组件和执行程序的方法。\n\n\
  ## 要点回顾\n\n* 解决问题是找出解决问题需要做什么的过程。\n* 解决逻辑和数值问题的步骤步骤是：分析问题、将复杂问题拆分为较小的、简单的任务、制定解决问题的计划、执行计划以及回溯。\n\
  * 解决问题的三个主要工具是算法、流程图和伪代码。\n* 算法是在没有计算机硬件和软件的情况下，分步解决问题的计划。\n* 流程图是一种显示解决问题步骤的图表，类似于算法。\n\
  * 伪代码是一种用结构化英语编写程序的非正式方法。它关注算法的逻辑，而不深入到语言语法的细节。\n* 为了指示计算机执行任务，需要一种被称为编程语言的语言。\n\
  * LLL（低级语言）只有两个符号：0 和 1。\n* HLL（高级语言）使用类似英语语言编写程序。\n* 汇编语言使用符号编写程序。这些符号被称为助记符，如\
  \ ADD、SUB、MUL 和 DIV。\n* 语言翻译器将用一种语言编写的程序转换为另一种，例如 HLL 到 LLL。\n* 编辑器提供了编写、修改和编辑的平台。\n\
  * 链接器搜索并附加执行文件所需的库。\n* 加载器是一个从链接器加载可执行代码、将其放入主内存并准备执行的程序。\n\n## 思考题\n\n1. 什么是解决问题？写出解决问题的不同技术及其优缺点。\n\
  2. 写出解决逻辑和数值问题的不同步骤。\n3. 写出解决现实问题的不同步骤。通过一个合适的示例进行说明。\n4. 为三个数中的最大值问题编写算法、流程图和伪代码。\n\
  5. 为求二次方程根的问题编写算法、流程图和伪代码。\n6. 什么是计算机编程语言？解释其不同类型及其优缺点和局限性。\n7. 什么是语言翻译器或处理器？解释其不同类型。\n\
  8. 写出并讨论编译与执行过程\n9. 区分语法错误和逻辑错误\n10. 区分编译器和解释器。\n\n加入我们书籍的 Discord 空间\n\n\n\n\n\n\
