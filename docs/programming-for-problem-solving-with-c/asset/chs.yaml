  \ element in the array is: 85\nThe smallest element in the array is: 20\nThe second\
  \ smallest element in the array is: 54\n```\n\n\n\n\n本章详细介绍了数组，它用于在单个变量名下存储和管理多个相同数据类型的值。可以使用特定的数据类型、名称和大小来声明并初始化数组。可以通过内存地址操作符访问其元素。数组分为一维数组和多维数组，它们具有随机访问和连续内存分配等特性。数组允许高效地存储和检索数据、简单的操作以及快速的数据处理。\n\
  \n接下来的章节将讨论一种特殊的数组类型——字符串，以及对其进行的不同类型的操作。\n\n## 注意事项\n\n* 数组是存储在连续内存位置的相同数据类型的组合。\n\
  * 整数数据类型的数组称为整数数组；使用 `float` 数据类型时则变为浮点数组。\n* 数组声明中方括号中的数字被称为索引（indexes/indices）或下标（subscripts）。\n\
  * C 语言数组索引从 0 开始。因此，对于一个拥有 `N` 个元素的数组，最后一个元素的索引为 `N-1`。\n* 在一个具有 `N` 个元素的数组中，第一个索引是\
  \ 0，最后一个是 `N-1`。\n* 数组的第一个索引是下界，最后一个元素是上界。\n* 数组分配的总空间等于数组的大小乘以数组中的元素个数。\n* 数组第\
  \ `k^(th)` 个元素的地址可以通过以下公式确定：\n  `第 k^(th) 个元素的地址 = 基地址 + 元素大小 * (第 k^(th) 个元素的索引)`\n\
  * 一维数组以线性形式存储一组值，类似于列表。一维数组只使用一个索引值。\n* 多维数组包含多个维度，例如二维、三维等。它使用多个索引。\n* 二维数组用于创建数学矩阵。它有两个索引：一个用于表示行，另一个用于表示列。\n\
  * 三维（3D）数组是数组的数组。它有三个索引。\n* 每个数组元素都具有相同的数据类型，并占用内存中相同大小的空间。\n* 数组项存储在内存中连续的地址处。\n\
  * C 语言数组是零索引的，这意味着数组的基地址索引为 0。\n* 连续内存分配允许快速且高效的内存访问。\n* 数组元素可以随机访问，这意味着可以通过提供任何元素的地址或索引来访问该元素。\n\
  * 由于数组元素存储在连续内存区域，因此只需要几行代码即可读取和存储数据到数组中。\n\n## 重要问题\n\n1. “数组”这一术语是什么意思？\n2. 如何声明数组？写出其语法的解释。\n\
