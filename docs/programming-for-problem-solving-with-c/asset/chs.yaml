  \ / 2 | n / 2 * C |\n| x = 2 | n / 2 | n / 2 * C |\n| . | . | . |\n| . | . | . |\n\
  | x < n | n / 2 | n / 2 * C |\n\n**表 20.9:** 示例 15 中 `x` 的值和执行时间\n\n因此，对于 `x` 的每次迭代，内部语句执行了多达\
  \ `n/2` 次，每个语句花费的时间为 `C`。因此，总花费的时间如下：\n\n`n/2*C + n/2*C + ………… + n/2*C`，共 `n` 次。\n\
  \n时间复杂度 = `n * n/2 * C`\n`= ½ *C (n²)`，丢弃常数项，用 `½ *C` 表示大 O\n`= O(n²)`\n\n## 示例\
  \ 16: 确定以下语句的时间复杂度：\n\n```c\nx = 1;\nwhile(x<=n)\n{\n    printf(\"Hello\");\n  \
  \  x = x+10;\n    x = x-15;\n    x = x+10;\n}\n```\n\n在这里，循环变量 `x` 的总体值为 `5`。因此，此循环将执行多达\
  \ `n/5` 次。因此，执行此循环的总时间为：\n\n时间复杂度 = `C * n/5`\n`= C/5 * (n)`，丢弃常数项，用 `C/5` 表示大 O\n\
  `= O(n)`\n\n## 示例 17: 确定以下语句的时间复杂度：\n\n```c\nfor(x=1; x<n; x++)\n    for(y=1; y<n;\
  \ y = y*2)\n        printf(\"Hello\");\n```\n\n参考 表 20.7：\n\n| 外层循环变量 x 值 | 每个 x\
  \ 值对应 y 执行的次数 | 内部循环语句执行时间 |\n| :--- | :--- | :--- |\n| x = 1 | log n | log n *\
  \ C |\n| x = 2 | log n | log n * C |\n| x = 4 | log n | log n * C |\n| . | . | .\
  \ |\n| . | . | . |\n| x < n | log n | log n * C |\n\n**表 20.7:** 示例 12 中 `x` 的值和执行时间\n\
  \n因此，`x` 的每次迭代内部语句执行了多达 `log n` 次，每个语句的时间为 `C`。因此，总花费的时间如下：\n\n`log n *C + log n\
  \ *C ……………………………+ log n *C`，共 `log n` 次。\n\n时间复杂度 = `log n * (log n *C)`\n`= log\
  \ n.log n`，丢弃常数 `C` 和对数底以表示大 O\n`= O (log n.log n)`\n\n## 示例 18: 确定以下语句的时间复杂度：\n\
