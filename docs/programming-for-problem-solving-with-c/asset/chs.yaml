  \n## 引言](#contents.xhtml_sc2_394a)\n\n本章将深入探讨预处理器指令在 C 编程中的关键作用。接下来的章节将探索各种预处理器指令，包括文件包含、宏展开、条件和未定义指令。\n\
  \n## 结构](#contents.xhtml_sc2_395a)\n\n在本章中，我们将讨论以下主题：\n\n* 预处理器指令\n    * 文件包含指令\n\
  \    * 宏展开指令\n    * 条件指令\n    * 未定义指令\n\n## 目标](#contents.xhtml_sc2_396a)\n\n本章的目标是提供对\
  \ C 编程中预处理器指令的全面理解。读者将学习如何使用文件包含、宏展开、条件编译和未定义指令。\n\n## 预处理器](#contents.xhtml_sc2_397a)\n\
  \n如名所示，预处理器是一个在编译之前处理我们源代码的程序。它以哈希（#）符号开头。\n\n## 预处理器指令](#contents.xhtml_sc2_398a)\n\
  \n预处理器指令是预处理器命令。它们以哈希（#）符号开头。预处理器声明末尾不加分号。\n\n`图 18.1`](#ch18.xhtml_fig18-1) 显示了预处理器的工作原理。编辑器编写源代码。在源代码传递给编译器之前，预处理器首先检查任何指令。如果程序中存在指令，它将通过处理，结果以展开后的源文件的形式传递给编译器。这段展开后的源代码传递给编译器，编译器生成目标代码：\n\
  \n![](img/Figure_18.1.png)\n\n图 18.1：预处理器的工作\n\n有以下类型的指令：\n\n* 文件包含指令\n* 宏展开指令\n\
  * 条件指令\n* 未定义指令\n\n## 文件包含指令](#contents.xhtml_sc3_399a)\n\n该指令包含一个文件，例如源代码中的头文件。它在要包含的文件名之前使用\
  \ `#include`。语法如下：\n\n```c\n#include<filename>\n```\n\n例如，\n\n```c\n#include<stdio.h>\n\
  ```\n\n它在程序中包含了一个 `stdio.h` 头文件。它在系统目录列表中搜索文件名。文件名必须写在尖括号中。\n\n## 宏展开指令](#contents.xhtml_sc3_400a)\n\
  \n`#define` 用于在程序中编写宏。宏名称必须用大写字母。在理解宏的概念之前，先分析以下程序。\n\n```c\n//Program 18.1 使用宏计算圆的面积\n\
  #include<stdio.h>\n\n#define PI 3.141592\n\nvoid main()\n{\n    float area, r;\n\
  \    printf(\"Enter the value of radius:\");\n    scanf(\"%f\",&r);\n    area=PI*r*r;\n\
  \    printf(\"The area of a circle is:%f\",area);\n}\n```\n\n输出：\n```\nEnter the\
  \ value of radius: 3\nThe area of a circle is 28.274328\n```\n\n在前面的程序中，`PI` 是宏名称（宏模板），而值\
  \ `3.141592` 是宏展开。当预处理器在程序中遇到 `#define` 时，它会搜索所有的宏模板。\n\n在前面的程序中，`PI` 是宏名称（宏模板），而值\
