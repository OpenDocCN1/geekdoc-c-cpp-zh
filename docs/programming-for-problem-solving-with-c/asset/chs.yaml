  read_arr2(arr2,m);\n\nmerged_arr3(arr3,n,m,arr1,arr2);\n\nreturn 0;\n\n}\n\nvoid\
  \ read_arr1(int arr1[],int n)\n{\n    int i;\n    for(i=0;i<n;i++)\n    {\n    \
