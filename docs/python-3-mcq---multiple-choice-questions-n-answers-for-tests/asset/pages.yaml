  md: '# Multiple Choice Questions for Python 3


    # 600 Plus MCQ''s for Python Jobs, Tests & Quizzes


    If you are learning Python programming on your own (whether you are learning from
    Python books, videos or online tutorials and lesson plans) this book is for you.
    These questions and answers can be used to test your knowledge of Python3. If
    you already know Python, you can still use it to check how many questions you
    can answer on your own without any help. You may want to go through these questions
    before you appear for a job interview. If you are a teacher or tutor who is teaching
    Python, you''ll find these MCQ useful as a tool to understand how much your students
    have learned what you have taught.


    All these questions are based on Python 3 and the target level of questions is
    Beginner Level - someone who is just starting to learn Python or someone who has
    recently learnt Python. Answer Key for these questions is provided at the end.


    S.C. Lewis'
  merge: -1
  pgno: 3
- img_proc: true
  md: '# FAQ


    Q 1. These questions are based on which version of Python?

    Ans: All the MCQ for this book are based on Python 3.


    Q 2. The questions have been tested on which platforms?

    Ans: These questions have been tested with Python 3.4.0 on Linux and Windows operating
    systems.

    You might want to download/update the newest Python version from www.Python.org
    for your own system before attempting these questions.


    Q 3. I have just started to learn Python. Will I be able to answer these questions?

    Ans: The questions for this book are written for beginners level and are intended
    for someone who has recently learned Python. Someone who has just started to learn
    Python is likely to find these questions too. You might not be able to answer
    all the questions in first attempt but would be able to answer all if you keep
    coming back to these questions as you start fluent in Python.


    Q 4. When I run the statements given in the question, I am not able to get any
    of the 4 options as output?

    Ans: It is recommended that you run the statements for which some output is expected
    by saving them as a program in the IDLE File Editor (unless noted otherwise) and
    if it works as expected then only try it in IDLE shell (one statement at a time).
    Some statements work only in the File Editor while some work exclusively on the
    IDLE shell. In rare cases, it might be because of the version of Python you are
    using and your operating system as some questions might give platform specific
    output.


    Q 5. When I run the statements given in the question, the output is not in the
    same order or exactly as the given answer?

    Ans: This is because some statements and functions give a random output or an
    unsorted order of items. In such cases, you may select the answer which is most
    likely to be the possible answer based on your understanding of Python.


    Q 6. What is the recommended approach to solve these questions?

    Ans: The best approach to solve these questions is to take a pen(or pencil) &
    paper and try attempting these one by one.


    S.C. Lewis'
