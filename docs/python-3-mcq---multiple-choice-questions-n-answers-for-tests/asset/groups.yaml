    # S. C. Lewis


    # Python 3


    ## MCQ


    Multiple Choice Questions Answers for Tests, Quizzes - Python Students & Teachers


    # Python 3 MCQ - Multiple Choice Questions n Answers for Tests, Quizzes - Python
    Students & Teachers


    By S. C. Lewis


    Copyright 2016. All Rights Reserved


    Version: 0.09


    # Multiple Choice Questions for Python 3


    # 600 Plus MCQs for Python Jobs, Tests & Quizzes


    If you are learning Python programming on your own (whether you are learning from
    Python books, videos or online tutorials and lesson plans) this book is for you.
    These questions and answers can be used to test your knowledge of Python 3. If
    you already know Python, you can still use it to check how many questions you
    can answer on your own without any help. You may want to go through these questions
    before you appear for a job interview. If you are a teacher or tutor who is teaching
    Python, you''ll find these MCQ useful as a tool to understand how much your students
    have learned what you have taught.


    All these questions are based on Python 3 and the target level of questions is
    Beginner Level - someone who is just starting to learn Python or someone who has
    recently learnt Python. Answer Key for these questions is provided at the end.


    S.C. Lewis


    # FAQ


    Q 1. These questions are based on which version of Python?

    Ans: All the MCQ for this book are based on Python 3.


    Q 2. The questions have been tested on which platforms?

    Ans: These questions have been tested with Python 3.4.0 on Linux and Windows operating
    systems.

    You might want to download/update the newest Python version from www.Python.org
    for your own system before attempting these questions.


    Q 3. I have just started to learn Python. Will I be able to answer these questions?

    Ans: The questions for this book are written for beginners level and are intended
    for someone who has recently learned Python. Someone who has just started to learn
    Python is likely to find these questions too. You might not be able to answer
    all the questions in first attempt but would be able to answer all if you keep
    coming back to these questions as you start fluent in Python.


    Q 4. When I run the statements given in the question, I am not able to get any
    of the 4 options as output?

    Ans: It is recommended that you run the statements for which some output is expected
    by saving them as a program in the IDLE File Editor (unless noted otherwise) and
    if it works as expected then only try it in IDLE shell (one statement at a time).
    Some statements work only in the File Editor while some work exclusively on the
    IDLE shell. In rare cases, it might be because of the version of Python you are
    using and your operating system as some questions might give platform specific
    output.


    Q 5. When I run the statements given in the question, the output is not in the
    same order or exactly as the given answer?

    Ans: This is because some statements and functions give a random output or an
    unsorted order of items. In such cases, you may select the answer which is most
    likely to be the possible answer based on your understanding of Python.


    Q 6. What is the recommended approach to solve these questions?

    Ans: The best approach to solve these questions is to take a pen(or pencil) &
    paper and try attempting these one by one.


    S.C. Lewis


    1. If you do not know the answer to a particular question blank (may you not have
    learnt the topic yet), you may leave the answer for that question, skip that question
    for the moment and come back to attempt it after you have learnt that topic.

    2. If you attempted a question and your answer was wrong, go through your Python
    notes (or books) again and re-attempt that question later when you have thoroughly
    grasped concept.

    3. If you get all the answers right in your first attempt, Congratulations! You
    are doing something right. You can still come back to these questions after a
    while for revision and to keep those topics and the related concepts in your memory
    refreshed.


    Q 7. Does the answer key contains the explanations to these questions too?

    Ans: The answer key contains only the answers and does not contain the explanation
    to the answers. This is because most of the answers are self-explanatory or very
    simple to understand if you have understood the basic concepts well. If you still
    face some difficulty, try thinking for a while and you''ll know why. Or else,
    you might Google that statement or expression and you are likely to find your
    explanation but might not need to go far. If you still face any problems, let
    me know.


    # Python MCQ


    The topics on which these questions are based include:

    - Python basics

    - IDLE

    - user inputs

    - operations

    - arithmetic

    - assigning values

    - comparisons

    - lists

    - manipulation

    - tuple

    - set

    - dictionary

    - branching

    - if

    - while loop

    - for loop

    - functions

    - importing modules

    - built-in functions

    - built-in modules

    - working with strings

    - comprehensions

    - file handling

    - reading and writing files

    - objects and classes


    # Python MCQ


    1. Which of the following version of Python was released in December, 2015 by
    Python.org?

    a. 3.3

    b. 3.5

    c. 2.4

    d. 2.6


    2. Python files are saved with the extension ...

    a. .python

    b. .pe

    c. .py

    d. .pi


    3. What is the name of the GUI that comes built-in as an interactive shell with
    Python?

    a. IDLE

    ...

    4. IDLE stands for ...

    a. Indigenous Development

    b. Integrated Environment

    c. Integrated Local Environment

    d. Indie Environment


    5. The function to display a specified message on the screen is ...

    a. print

    b. display

    c. run

    d. output


    6. Which of the following is an assignment operator in Python?

    a. ==

    b. ===

    c. >>>

    d. =


    7. Which of the following is used to initialize multiple variables with a common
    value?

    a. x = y = z = 33

    b. x = y; z = 33

    c. x = z; y = 33;


    8. Comments in Python begin with ...

    a. user

    b. enter

    c. input

    d. value


    9. A user-specified value can be assigned to a variable with this function

    a. Floating

    b. Text String

    c. Boolean Value

    d. Integer


    10. Output displayed by the print function will add this character at the end
    of the line by default

    a. \t

    b. \n

    c. \s

    d. r


    11. Multiple values specified in parentheses to print function will display each
    value separated by this default

    a. Single Space

    b. Double Space

    c. A new Line

    d. Double Line


    12. Which of the following will provide a character as alternative separator for
    the print function?

    a. sep

    b. separate =

    c. sep >> ''!''

    d. sep = ''!''


    13. Which of the following will provide a character as alternative line ending
    for the print function?

    a. end to *

    b. end as *

    c. end = ''*''

    d. ending = ''*''


    14. For which type of error does the interpreter halt and report the error but
    not execute the program?

    a. Semantic error

    b. Syntax error

    c. Runtime error

    d. All type of errors


    15. For which type of error does the interpreter run the program but halt at error
    and report the error as an "Exception"?

    a. Semantic error

    b. Syntax error

    c. Runtime error

    d. All type of errors


    16. For which type of error does the interpreter run the program and not report
    an error?

    a. Semantic error

    b. Syntax error

    c. Runtime error

    d. All type of errors


    17. What will be the output after the following statements?

    x = 6

    y = 3

    print(x / y)

    a. 2.0

    b. 2

    c. 18

    d. 18.0


    18. What will be the output after the following statements?

    x = 8

    y = 2

    print(x // y)

    a. 4.0

    b. 4

    c. 16

    d. 16.0


    19. What will be the output after the following statements?

    x = 5

    y = 4

    print(x % y)

    a. 0

    b. 20

    c. 1.0

    d. 1


    20. What will be the output after the following statements?

    x = 3

    y = 2

    x += y

    print(x)

    a. 3

    b. 2

    c. 5

    d. 1


    21. What will be the output after the following statements?

    x = 5

    y = 7

    x *= y

    print(x)

    a. 7

    b. 12

    c. 5

    d. 35


    22. What will be the output after the following statements?

    x = 25

    y = 15

    x -= y

    print(x)

    a. 10

    b. 25

    c. 15

    d. -15


    23. What will be the output after the following statements?

    x = 30

    '
