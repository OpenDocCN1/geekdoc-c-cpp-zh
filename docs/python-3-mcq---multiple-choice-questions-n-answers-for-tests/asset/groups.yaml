    # S. C. Lewis


    # Python 3


    ## MCQ


    用于测试、测验的多选题答案 - Python 学生与教师


    # Python 3 MCQ - 用于测试、测验的多选题与答案 - Python 学生与教师


    作者：S. C. Lewis


    版权所有 2016. 保留所有权利


    版本：0.09


    # Python 3 的多选题


    # 适用于 Python 求职、测试与测验的 600 多道多选题


    如果你正在自学 Python 编程（无论是通过 Python 书籍、视频还是在线教程和课程计划学习），这本书都适合你。这些问题和答案可以用来测试你对 Python
    3 的掌握程度。如果你已经熟悉 Python，你仍然可以使用它来检查自己在没有任何帮助的情况下能独立回答多少道题。你可能想在参加工作面试之前过这些题。如果你是一名教授
    Python 的老师或导师，你会发现这些多选题是一个的工具，可以帮助你了解学生掌握了你所教的内容。


    所有这些问题都基于 Python 3，目标水平是初级——即刚开始学习 Python 或最近才学习 Python 的人。这些问题的答案附在文末。


    S.C. Lewis


    # FAQ 常见问题解答


    Q 1. 这些问题基于哪个版本的 Python？

    答：本书中的所有多选题都基于 Python 3。


    Q 2. 这些问题在哪些平台上测试过？

    答：这些问题已经在 Linux 和 Windows 操作系统上通过 Python 3.4.0 进行过测试。

    在尝试这些问题之前，你可能想从 www.Python.org 下载/更新最新的 Python 版本。


    Q 3. 我刚开始学习 Python。我回答这些问题吗？

    答：书中的问题是为初学者编写的，旨在针对最近学习 Python 的人。刚开始学习 Python 的人可能会觉得这些问题太难。你可能无法第一次尝试就回答所有问题，但随着你开始熟练使用
    Python 并反复练习这些问题，你就能回答全部。


    Q 4. 当我运行题目给出的语句时，无法得到 4 个选项中的任何一个作为输出？

    答：建议你将预期输出的语句在 IDLE File Editor 中保存为程序（除非另有说明），只有当它运行符合预期时，再在 IDLE shell 中尝试（一次执行一条语句）。某些语句仅在
    File Editor 中有效，而某些语句仅在 IDLE shell 中有效。在少数情况下，可能是因为你使用的 Python 版本和操作系统的原因，因为某些问题可能会产生特定平台的输出。


    Q 5. 当我运行题目给出的语句时，输出顺序不同，或与给定的答案不完全一致？

    答：这是因为某些语句和函数会产生随机输出或无序的项目列表。在这种情况下，你可以根据你对 Python 的理解，选择最可能的答案。


    Q 6. 解决这些问题的推荐方法是什么？

    答：解决这些问题的最佳方法是准备笔（或铅笔）和纸，逐一尝试。


    S.C. Lewis


    1. 如果你不知道某个问题的答案（可能你还没有学习该主题），你可以留空该题的答案，暂时跳过该题，并在学习该主题后再回来尝试。

    2. 如果你尝试了一道题但答案错误，请重新查看你的 Python 笔记（或书籍），并在彻底掌握概念后稍后重新尝试该题。

    3. 如果你第一次尝试就答对了所有题目，恭喜你！你的方法是正确的。你可以在一段时间后再次回来这些题目进行复习，以保持这些主题及相关概念的记忆新鲜。


    Q 7. 答案密钥中包含这些问题的解释吗？

    答：答案密钥仅包含答案，不包含答案的解释。这是因为大多数答案都是自成意义的，或者如果你很好地理解了基本概念，理解非常简单。如果你仍然遇到困难，请尝试思考一会儿，你就会知道为什么。否则，你也可以
    Google 那个语句或表达式，你可能会找到解释，但可能不需要找远。如果你仍然遇到任何问题，请告诉我。


    # Python 多选题


    这些问题基于的主题包括：

    - Python 基础

    - IDLE

    - 用户输入

    - 运算

    - 算术

    - 赋值

    - 比较

    - 列表

    - 操作

    - 元组

    - 集合

    - 字典

    - 分支

    - if

    - while 循环

    - for 循环

    - 函数

    - 导入模块

    - 内置函数

    - 内置模块

    - 字符串处理

    - 推导式

    - 文件处理

    - 读写文件

    - 对象与类


    # Python 多选题


    1. 下列哪个 Python 版本是由 Python.org 在 2015 年 12 月发布的？

    a. 3.3

    b. 3.5

    c. 2.4

    d. 2.6


    2. Python 文件以扩展名 ... 保存

    a. .python

    b. .pe

    c. .py

    d. .pi


    3. 与 Python 内置的作为交互式 shell 的 GUI 叫什么名字？

    a. IDLE

    ...

    4. IDLE 代表 ...

    a. Indigenous Development（本土开发）

    b. Integrated Environment（集成环境）

    c. Integrated Local Environment（集成本地环境）

    d. Indie Environment（独立环境）


    5. 在屏幕上显示指定消息的函数是 ...

    a. print

    b. display

    c. run

    d. output


    6. 下列哪个是 Python 中的运算符？

    a. ==

    b. ===

    c. >>>

    d. =


    7. 下列哪个用于用共同的值初始化多个变量？

    a. x = y = z = 33

    b. x = y; z = 33

    c. x = z; y = 33;


    8. Python 中的注释以 ... 开始

    a. user

    b. enter

    c. input

    d. value


    9. 用户指定的值可以通过此函数赋值给变量

    a. Floating（浮点型）

    b. Text String（字符串）

    c. Boolean Value（布尔值）

    d. Integer（整数）


    10. print 函数显示的输出默认会在行末尾添加此字符

    a. \t

    b. \n

    c. \s

    d. r


    11. print 函数括号中指定的多个值将默认用此分隔符显示

    a. Single Space（单空格）

    b. Double Space（双空格）

    c. A new Line（换行）

    d. Double Line（双行）


    12. 下列哪个为 print 函数提供字符作为替代分隔符？

    a. sep

    b. separate =

    c. sep >> ''!''

    d. sep = ''!''


    13. 下列哪个为 print 函数提供字符作为替代行结束符？

    a. end to *

    b. end as *

    c. end = ''*''

    d. ending = ''*''


    14. 哪种类型的会导致解释器停止并报告错误但不执行程序？

    a. 语义错误 (Semantic error)

    b. 语法错误 (Syntax error)

    c. 运行时错误 (Runtime error)

    d. 所有类型的错误


    15. 哪种类型的会导致解释器运行程序但在错误处停止并作为“异常 (Exception)”报告错误？

    a. 语义错误 (Semantic error)

    b. 语法错误 (Syntax error)

    c. 运行时错误 (Runtime error)

    d. 所有类型的错误


    16. 哪种类型的会导致解释器运行程序但不报告错误？

    a. 语义错误 (Semantic error)

    b. 语法错误 (Syntax error)

    c. 运行时错误 (Runtime error)

    d. 所有类型的错误


    17. 执行以下语句后输出将什么？

    x = 6

    y = 3

    print(x / y)

    a. 2.0

    b. 2

    c. 18

    d. 18.0


    18. 执行以下语句后输出将什么？

    x = 8

    y = 2

    print(x // y)

    a. 4.0

    b. 4

    c: 16

    d. 16.0


    19. 执行以下语句后输出将什么？

    x = 5

    y = 4

    print(x % y)

    a. 0

    b. 20

    c. 1.0

    d. 1


    20. 执行以下语句后输出将什么？

    x = 3

    y = 2

    x += y

    print(x)

    a. 3

    b. 2

    c. 5

    d. 1


    21. 执行以下语句后输出将什么？

    x = 5

    y = 7

    x *= y

    print(x)

    a. 7

    b. 12

    c. 5

    d. 35


    22. 执行以下语句后输出将什么？

    x = 25

    y = 15

    x -= y

    print(x)

    a. 10

    b. 25

    c. 15

    d. -15


    23. 执行以下语句后输出将什么？

    x = 30


    '
