  md: '# HOUR 14

    Introducing Reusable User Interface Components


    What You''ll Learn in This Hour:


    +   - What tag helpers and view components are

    - Tag helpers that ship with ASP.NET Core

    - Other reusable components

    - How to write your own tag helpers

    - How to write your own view components


    This hour gets you back to building a user interface for your application. In
    this hour, you''re going to learn how to build reusable components that you can
    use throughout your application. With ASP.NET Core, there are several ways to
    build HTML user interface components that can be used again and again throughout
    your application. The most interesting and exciting of these is to use tag helpers.


    # Introducing Tag Helpers


    When you look around the landscape of modern user interface construction in other
    web frameworks, a myriad of technologies—such as directives, controls, and widgets—are
    available. With ASP.NET Core, Microsoft wanted to correct the troubles of its
    previous control capabilities by introducing a very focused and tag-like mechanism.
    A tag helper is involved in server-side rendering technique, using .NET code to
    interact with only the content that appears between the start'
