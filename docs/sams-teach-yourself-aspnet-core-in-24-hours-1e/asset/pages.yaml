  md: '# Introducing the CoreCLR


    One of the biggest changes that was made to accommodate a number of the pillars
    listed earlier in this chapter is the new CoreCLR. This new cross-platform-capable
    common language runtime delivery of binary components as packages and modular
    delivery to servers. It is not a requirement to develop with this framework, and
    you can still write your software on Windows with the full ''desktop-capable''
    CLR if you like. However, if you develop with the full CLR, those applications
    can only be deployed to Windows servers.


    The CoreCLR is a rewrite of the CLR based on work that was started by the Silverlight
    runtime. The CoreCLR combined with an operating system-specific loader and runtime
    makes cross-platform development possible.


    # Assumptions and Definitions in this Book


