  md: 'your application. However, the ASP.NET team has not yet certified it for open-Internet
    use. It has not been hardened against hacking attempts, and the team is actively
    working toward improving it.


    To circumvent any problems that may crop up before Kestrel is fully hardened,
    the ASP.NET Core team recommends hosting the Kestrel service behind another server:
    IIS or Apache or nginx on Linux. This is a common configuration for Rails and
    Node.js, which are often configured to run on these servers with a reverse proxy
    into the process that handles the server-side executable part of the application.


    If you''ve used older versions of ASP.NET, you may remember the W3SVC process
    for managing ASP.NET applications. This process ran in isolation from the IIS
    web server on Windows and had traffic requests routed to it for processing by
    the application. This is a similar configuration to what you are using with ASP.NET
    Core, which instead of W3SVC managing the requests, the executable you have built
    hosts the Kestrel server.


    # Preparing Production Web Space


    When you consider a location to deploy your application, you need to take into
    consideration the access levels granted to the users who will be running your
    web application. The following are several best practices about the service account
    that you should use for your web application:


    +   - The service account should not be able to log in to the server directly.

    - The service account should not be able to write to disk. If your application
    needs to write to a location on disk, that location should be isolated and the
    only place the service account is allowed to write.

    - The service account should not have access to sensitive areas on disk.

    - The service account is only allowed to execute the executable files that are
    delivered with your application.


    When deploying to a Windows server, the IUSR_MACHINENAME account is automatically
    created for Internet Information Server (the Windows web server) to use for running
    processes. I recommend that you add an additional service account for each application
    that you run and restrict that service account to running only the individual
    application service is assigned to.


    On a Linux server, I recommend a similar approach: Create a service account with
    a name similar to your application (perhaps asptravlerz_worker)'
