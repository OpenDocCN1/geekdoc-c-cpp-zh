- img_proc: true
  md: '+   CacheTagHelper—custom cache tag stores items in memory in the local web
    server and is not reexecuted until the cache expires.


    +   DistributedCacheTagHelper—This custom distributed cache tag performs similarly
    to CacheTagHelper but instead stores cache entries in a service defined by the
    IDistributedCacheTagHelper interface and registered with the dependency injection
    container. This makes the content of the cache available in a multi-web server
    scenario.


    +   EnvironmentTagHelper—The environment tag allows you to define which system
    names (Development, Staging, Production) the tag''s content should be delivered
    on.


    +   FormTagHelper—This enhances the standard form with attributes to enable the
    form''s action attribute to be defined by a route.


    +   ImageTagHelper—This enhances the img tag to allow you to manage dynamically
    generated images. It includes features like appending the version number of the
    application as a cache-buster token on the URL of the image source.


    +   InputTagHelper—This enhances the input tag with capabilities to verify content
    and connect to model properties. It supports HTML 5 input text boxes.


    +   LabelTagHelper—This enhances the label tag with the ability to set label content
    based on the name of an attribute on a model.


    +   LinkTagHelper—This enhances the link tag to allow version number cache-buster
    tokens to be added, as well as the ability to specify a CDN (Content Delivery
    Network) location with fallback capabilities.


    +   ScriptTagHelper—This enhances the script tag in the same ways as LinkTagHelper.


    +   SelectTagHelper—This enhances the select tag to map to model properties and
    handle a .NET collection of options.


    +   TextAreaTagHelper—This tag enhances the textarea tag to map to a model property.


    +   ValidationMessageTagHelper—This enhances the span tag with an asp-validation-for
    attribute that inserts into the span an error message for a given model property
    that has a failed validation in ModelState.'
