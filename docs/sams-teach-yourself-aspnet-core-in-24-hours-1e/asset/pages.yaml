    How can you detect this environment name and pivot on it?

    IHostingEnvironment parameter passed to the Startup constructor has several extension
    methods that allow you to inspect the type of environment:


    +   - **IsDevelopment**—Returns true if the environment is named development and
    is not case sensitive.

    - **IsStaging**—Returns true if the environment is named staging and is not case
    sensitive.

    - **IsProduction**—Returns true if the environment is named production and is
    not case sensitive.

    - **IsEnvironment**—Compares an environment name passed against the current environment
    name and returns true if they match in a case-insensitive comparison.


