  md: '# HOUR 5

    Configuring the Service with the Startup Class


    What You''ll Learn in This Hour:


    +   - What is the Startup class?

    - What is dependency injection, and how do you use it?

    - Configuring an application to host ASP.NET MVC


    When your web application starts for the first time, there are a number of tasks
    you should execute in order to apply your preferred configuration to the web service.
    In the ASP.NET Core framework, you can apply this server configuration through
    the Startup class. This hour walks through creating the Startup class for the
    ASPSqlServer sample application, describes the dependency injection pattern, and
    shows how to configure ASP.NET MVC.


    # Introducing the Startup Class


    In Hour 4, "Defining ASP.NET Core Configuration," you used the dotnet command-line
    tool to construct an initial template project for your application. You also learned
    how to build your application, but you have not yet run it. This hour, you''ll
    learn about the Startup and Program classes for a web application and how your
    web service will be configured.


    The ASP.NET team has defined a standard operation in which a managed web application
    assembly provides a static void Main in a Program.cs file, just like a console
    application project, and then launches the web server as'
  merge: -1
