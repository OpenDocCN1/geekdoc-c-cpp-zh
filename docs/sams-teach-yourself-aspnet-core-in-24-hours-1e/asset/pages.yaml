  md: '# Defining and Configuring Application Environments


    An interesting problem that all web developers face is that they typically do
    not work on the machines that are serving the requests to their application. Most,
    if not all, developers work on an environment removed from this production space
    that they refer to as their “development” environment. This is the developer’s
    playground, where things can break, and the business does not have a significant
    customer service issue. The “production” environment is where those customers
    and live requests are coming into the web application, and they need to be serviced
    with high performance, low latency, and amazing uptime. For developers and the
    operators of those production environments, it’s important to keep configuration
    of the application in each of these environments different so that customers don''t
    end up looking at something that a developer is actively working on and a developer
    does not end changing something that a customer is actively working on.


    In ASP.NET Core, the environment is a “first-class citizen” in the configuration
    framework. There is an explicit setting that is made available in the IApplicationEnvironment
    interface indicates the name of the environment. In Visual Studio, you can investigate
    the web project’s properties (by selecting Project > <Project Name> Properties),
    and the debugging panel reports that an environment variable called ASPNETCORE_ENVIRONMENT
    is set to Development (see Figure 6.1). This configuration forces any interactions
    with the application from Visual Studio to trigger Development environment settings.'
  merge: -1
