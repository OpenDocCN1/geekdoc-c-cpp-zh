    \ concerns that you will available in all of them. How can you deliver this similar\
    \ functionality to all your controllers without hard-coding all of them with the\
    \ same techniques?\n\nThe way around this is to write your own abstract controller\
    \ class that uses the same base controller class and make all your controllers\
