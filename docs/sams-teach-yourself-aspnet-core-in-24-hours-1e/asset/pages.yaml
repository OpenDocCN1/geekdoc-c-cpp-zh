  md: '# Add a View for the Faq Method


    At the end of Hour 9, "Building Your First Controller," you created an Faq method
    in HomeController and had it return a simple question-and-answer object to a view.
    Follow these steps to create that view now:


    +   1. Add a new file to the Views/Home folder called Faq.cshtml and open it for
    editing.

    2. Inside this view, start with the statement @model Tuple<string, string>, which
    indicates that you expect a model to be passed in type Tuple<string, string>.

    3. Add an HTML H2 tag with the content "Frequently Questions".

    4. Below the header, write the following code:


    ```

    <p><b>Q:</b>@Model.Item1</p>

    <p><b>A:</b>@Model.Item2</p>

    ```


    +   5. Save your view, start the application, navigate to http://localhost:5000/home/faq,
    and observe how your view formats and presents the simple faq model that was passed
    to it.


    This is a simple demonstration of formatting data—in this case a question with
    an answer. You can extend this sample further with additional questions in an
    array as your model and loop over that content to write your questions into your
    HTML.


    # Summary


    This hour you built your first Razor view for your web application’s search page,
    and you learned how to use the Razor template syntax. In addition, you started
    a simple layout for use in your web application. You hand-authored these segments
    of your application, and it took some time to write them. In Hour 11, “Scaffolding
    User Interfaces,” you will learn how Visual Studio and the dotnet tools can help
    you generate an initial snapshot of the view you need in your application.


    # Q&A'
