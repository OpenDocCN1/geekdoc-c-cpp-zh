    # Managing and Referencing NuGet Packages


    We quickly jumped through the topic of managing and referencing NuGet packages
    during the construction of the .csproj file (earlier this hour), and it needs
    to be covered more completely before we move on to further developing the application.
    Dependencies in ASP.NET Core are delivered the same way they are in many other
    modern development languages and frameworks: through packages of related content.
    Typically, in older versions of .NET, references to other parts of the framework
    or third-party libraries are made through DLL (dynamic link library) files. Make
    no mistake, this binary delivery of software is still being used, but it has been
    bundled into a NuGet package.


    NuGet packages allow you to deliver more than just a single library for an application
    to reference, as you can bundle multiple libraries that are targeted for various
    runtimes and framework versions. In addition, you can bundle PowerShell scripts
    and other content for use in your application. This package concept is very compelling
    for a framework that wants to deliver binary references and ensure that those
    references work across platforms.'
