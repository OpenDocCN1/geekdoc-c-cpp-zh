    # What You''ll Learn in This Hour:


    +   - What containers are

    - Why you should consider using containers to deploy an application

    - How to install and run both Linux and Windows containers on Windows 10

    - How to put your application in a container

    - How to deploy a containerized application to Microsoft Azure


    Containers are a very hot topic in DevOps circles these days. Teams that are building
    new applications are making a shift away from using "bare metal" servers—that
    is, deploying to servers hosted directly on hardware—to virtual machines and containers.
    What is the appeal of this strategy? What concessions must you as an application
    developer make? How can you take advantage of this trend to deploy your ASPTraveler
    application? In this hour, you''ll learn about containers and how to deploy your
    application in a container to Microsoft Azure.


    # What Is a Container?


    A container is a lightweight stand-alone executable unit of software that includes
    everything needed to run it, from system tools, to application configuration,
    to code. Containers, which can be built on Linux and Windows operating systems,
    isolate the unit from the host operating system. Unlike a virtual machine, which
    is a complete operating system installed and running on a host machine, a container
    is defined using a software configuration file and hosted'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'directly on the operating system. Figure 23.1 illustrates the architectural
    differences between virtual machines and containers.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_381_0.png)


    FIGURE 23.1

    Architectural difference between virtual machines and containers.


    You can stand up a container much more quickly than you can a virtual machine,
    as containers don''t require a guest operating system to be started on the hypervisor.
    This means you can start multiple containers very quickly—within seconds—without
    impacting the overall performance of the host operating system.


    # Why Use Containers?


    Perhaps you''ve had the terrible experience of writing code and deploying it to
    another machine and finding that it just didn''t work. The “it works on my machine”
    feeling certainly settled. Every developer has had this problem, and containers
    give you a unit of deployment that is standard for every machine you deploy them
    to. You can build a container on your developer workstation or a continuous integration
    system and run that application anywhere that the container hosting services are
    installed.


    In the case of ASP.NET Core, the application framework has a docker container
    image available that you can build on. This image contains everything you need'
