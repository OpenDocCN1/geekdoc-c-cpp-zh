  md: '# HOUR 6

    Configuring Your Application


    What You’ll Learn in This Hour:


    +   * Options for configuration file use

    * The new appsettings.json file and its capabilities

    * Changing configuration per environment

    * Using environment variables for configuration

    * Secret configuration options


    Every application has configuration options that need to be changed and delivered
    in an external set of configuration files. These options have historically been
    delivered in text files, XML files, INI files, properties files, and even the
    YAML (Yet Another Markup Language) configuration format. With ASP.NET Core, applications
    can be configured with a number of different options to meet your application’s
    particular needs. This hour you will explore these options and place some reasonable
    configuration information into your ASPTravlerz sample application.


    # Writing Configuration Files


    In previous versions of ASP.NET and .NET applications, the preferred way to structure
    and manage custom application configuration was to use .config files with a prescribed
    XML format and read those files with a series of classes in the System.Configuration
    namespace. With ASP.NET Core, there are a number of file format options available
    for custom configurations, and they all deliver the same functionality from the
    same namespace to your configuration'
