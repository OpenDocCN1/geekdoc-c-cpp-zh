    Next, you see a number of configuration files on the root of the application that
    end with a .json file extension. These files configure various services used in
    the compilation and delivery of the application:


    +   - angular-cli.json—Configuration of how the Angular CLI should maintain the
    application


    +   - package.json—npm configuration of packages to install and maintain in the
    application


    +   - tsconfig.json—Configuration of the TypeScript compiler for this application


    +   - tslint.json—Configuration of the TypeScript code-style checker, or “linter,”
    that will run against the application


    As mentioned earlier, the preferred language for writing and interacting with
    Angular applications is TypeScript. TypeScript is an interpreted language that
    is a superset of JavaScript and compiles to JavaScript. All valid JavaScript that
    you know how to write is also valid TypeScript. There are additional keywords
    that you can use in TypeScript to drive functionality and build large applications
    in a very object-oriented way. TypeScript also gives you type checking when you
    work with variables and parameters.


    The Angular team recommends that you use TypeScript to develop Angular applications
    due to the number of files and references that you will need to make from an to
    Angular resources. By using TypeScript for these programming tasks, you will be
    assured that you are making accurate references, and your developer tools can
    show you the features you are interacting with.


    When you build and run your application, all of the .ts (TypeScript) files in
    your application are converted to JavaScript and formatted as directed in the
    tsconfig.json file. This should result in a smaller, more easily transportable
    application that you can download and use.


    The remaining two conf.js files in the project folder, karma.conf.js and protractor.conf.js,
