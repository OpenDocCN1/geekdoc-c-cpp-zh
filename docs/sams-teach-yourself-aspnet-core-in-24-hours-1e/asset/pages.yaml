  md: 'Congratulations! You just compiled and visited your first ASP.NET Core web
    application.


    What actually happened here? What is the `command` you executed actually doing?
    In Hour 2, you configured the `dotnet` command-line tool for environments that
    don''t have Visual Studio 2017, and you can use this tool in ASP.NET to compile
    and run applications.


    The first command, `restore`, inspects the project and identifies all the references
    that need to be in place for the application. It downloads any missing references
    from NuGet.org and writes a lock file into the obj child folder with package information.


    In the second command you executed, `run`, the `dotnet` tool is called and instructed
    to begin compiling and executing the contents of the current folder. `dotnet`
    compiles the project contents of the current folder and starts the default web
    server, kestrel, hosting the results of the folder compilation.


    What if there is an error in starting the `dotnet` process? Several things could
    be wrong. You need to determine whether there is a `dotnet` executable in the
    path. Try running `dotnet --version` to report the version of `dotnet`. If nothing
    is returned, you might not have the command-line tool installed properly.


    # Moving Beyond Hello World


    You’ve got a simple website that answers “Hello World.” Let’s look at what makes
    this little website run.


    ASP.NET Core builds on the concept of a `request pipeline`. Every request to the
    web application enters the pipeline and gets evaluated for fitness of some code
    to execute that request, and transmits an appropriate response. The pipeline is
    constructed in the `Startup` class''s `Configure` method, which takes an `IApplicationBuilder`
    input parameter. Initially in your simple application, this method contains only
    the code in [Listing 3.1].


    # LISTING 3.1 The Initial `Configure` Method


    Click here to view code image


    ```

    public void Configure(IApplicationBuilder app, IHostingEnvironment env,\ILoggerFactory
    loggerFactory)

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: "```\n{\n  loggerFactory.AddConsole();\n\n  if (env.IsDevelopment()) {\n   \
    \ app.UseDeveloperExceptionPage();\n  }\n\n  app.Run(async (context) => {\n  \
    \  await context.Response.WriteAsync(\"Hello World!\");\n  });\n}\n```\n\nNote\
    \ the following about this code:\n\n+   - The application configures the pipeline\
    \ asynchronously. This is a good thing for performance of the application as the\
    \ configuration will not block the running thread while the pipeline is configured.\n\
    \n+   - There is a logger created at the beginning, and the AddConsole method\
    \ is called. This enables the application to write log messages to the console.\n\
    \n+   - The if-block tests whether this is the development environment. In the\
    \ case that the application is running in the development environment, the UseDeveloperExceptionHandler()\
    \ method is called. (We'll look at this in a minute.)\n\n+   - The Run method\
    \ receives a context object—the Microsoft.AspNet.Http.HttpContext object, a collection\
    \ of dictionaries with data about the information submitted to the server with\
    \ each request. In addition, it holds a Response object that can be used to populate\
    \ the content to be delivered to requesting clients.\n\n+   - Content is written\
    \ asynchronously to the Response object, allowing this operation to run in a nonblocking\
    \ fashion. For the purpose of writing a simple block of text, this has little\
    \ impact. If you were fetching data from another service, however, you could prevent\
    \ the web server thread from blocking while awaiting the delivery of that data.\n\
    \n+   - The pipeline takes any context and sends the same response to all requests.\
    \ This means there is no inspection of what HTTP action was received or of the\
    \ path submitted with the request. All requests are served the same response text."
