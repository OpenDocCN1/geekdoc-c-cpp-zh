    # Adding ASP.NET Core Capabilities to Your Favorite Text Editor


    What if you''re already happy with a text editor, and you don''t want to waste
    your time loading some Visual Studio version? Maybe you don''t like all that integrated
    development nonsense that Microsoft adds to its tools, and you just want to focus
    on editing text. A group of .NET developers who don''t work for Microsoft put
    together an add-on called Omnisharp for some of the most popular editors available.


    Omnisharp runs a service in the background that compiles and analyzes the code
    you are writing in your text editor and provides IntelliSense code suggestions
    for you as you type. These suggestions are delivered from a compiler, so they
    are based on what your project looks like and what available references look like.
    You can find Omnisharp at www.omnisharp.net and install it to work with editors
    like Atom, Brackets, Emacs, Sublime Text, and even Vim. Figure 2.3 shows Omnisharp
    running inside Sublime Text.'
