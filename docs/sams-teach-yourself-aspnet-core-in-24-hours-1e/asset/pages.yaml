  md: '# What Is ASP.NET?


    ASP.NET is the Microsoft.NET implementation of the Active Server Pages architecture
    and concepts for web developers by Microsoft. Originally deployed as part of Windows
    servers with web hosting capabilities for enterprises, the framework grew over
    12 years and through six versions to the most recent release, ASP.NET Core. The
    Microsoft.NET versions over time are displayed in Figure 1.1.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_29_0.png)


    FIGURE 1.1 ASP.NET versions over time.


    # Development Frameworks


    Throughout the history of ASP.NET, a series of child frameworks evolved from Microsoft
    to better support developers’ needs. These frameworks supplemented the initial
    Web Forms style of programming to introduce new web programming paradigms that
    developers needed as web technologies evolved. The frameworks supported by all
    versions of ASP.NET are described in Table 1.1


    # TABLE 1.1 ASP.NET Development Frameworks


    | Framework Name | First Version | Description |

    | --- | --- | --- |

    | | | A framework that allowed page-centric design with stateful concepts like
    postback and viewstate. The |'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Web Forms 1.0 user interface was delivered as a set of controls that generate
    HTML.


    AJAX 3.5 A framework that introduced JavaScript extensions for controls to provide
    immediate interactions with a browser.


    MVC 3.5sp1 The Model-View-Controller paradigm, which no longer used postback,
    viewstate, or controls.


    Dynamic Data 3.5sp1 A data-driven framework that generated content and layouts
    based on data presented from databases.


    Web API 4.5 A RESTful service endpoint that was delivered using HTTP standard
    verbs and a controller architecture.


    SignalR 4.5.1 A real-time push-enabled communications framework that allowed clients
    to subscribe to notifications from a hosted web service.


    These frameworks have delivered significant value to developers and have enabled
    them to build customized solutions quickly and productively with very little ceremony.
    With the initial release of the latest version of ASP.NET, only a chosen few of
    these frameworks are available, and if history gives us a hint about the future,
    then it''s safe to assume that there will be many development frameworks to come.


    # Why Should You Program in ASP.NET?


    Many developers new to the ASP.NET ecosystem wonder why they should program in
    ASP.NET. The answers are many and vary, depending on your project team''s specific
    needs:


    +   If you''re a Microsoft Windows developer, and you are expecting to deliver
    an application that needs to run from a Windows environment, you''ll find that
    ASP.NET is a great solution that continues the support you are already receiving
    from Microsoft.


    +   If you need a productive web application environment so that you can get'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'started quickly build simple applications with little development knowledge
    and want to be productive quickly, you will find that ASP.NET and Visual Studio
    tools help get you started developing your first web application quickly.


    +   - If you are a developer who needs modern web capabilities and a set of prescribed
    tools that augment those capabilities to enable team collaboration, source control,
    and agile methodologies, you will find that ASP.NET with Visual Studio is an excellent
    choice.


    +   - If you are tired of the drama with community-owned open source web frameworks
    and need tools with a top software vendor supporting them and also an open source
    pedigree that means you can make modifications and submit changes, ASP.NET is
    an excellent choice for you.


    # Significant Changes in ASP.NET Core


    The new version of ASP.NET has diverged from the ordinal numbers of previous releases.
    Typically, the major version number of software changes when there are significant
    breaking changes in the software. In the case of ASP.NET, Microsoft could have
    named it ASP.NET 10, as there have been many significant changes over previous
    versions, but the team wanted to make it clear that version is a significant break
    from previous ASP.NETs. Thus, Core 1.0 was announced and landed as a complete
    rewrite of previous releases with the following strategic pillars in mind:


    +   - Lean and composable—The framework should not be a 250 MB install that is
    required on every machine that develops and hosts applications.


    +   - Modular—You should be able to choose just the parts of the framework you
    want to install and run with your application.


    +   - Open source—All development of ASP.NET by Microsoft is publicly visible,
    and ASP.NET accepts submissions from the community.


    +   - Fast development cycle—Previous framework versions were only released with
    a new Visual Studio version, but now new versions will be available as updates
    to NuGet packages on NuGet.org.


    +   - Choose your own editor—ASP.NET is no longer tied to Visual Studio, and its
    tools allow you to code with your favorite text editor and deliver the same web
    application experience to your customers.


    +   - Cross-platform—No longer is ASP.NET tied to development and deployment on
    Windows only. Support is provided for development and'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'deployment on Windows, Mac, and Linux.


    The following sections dig into each of these pillars and discuss how they are
    implemented in ASP.NET Core.


    # Lean and Composable


    The web application framework has broken away from the rest of the Microsoft.NET
    Common Language Runtime (CLR). The CLR is the base collection of libraries provided
    by Microsoft that you can use to build web applications.


    In previous versions of ASP.NET, the CLR contained everything to build desktop,
    phone, and web applications. These are very different formats, and each of formats
    needs different tools and software. Splitting off the ASP.NET implementation from
    the CLR means that developers can leave behind components that are normally used
    to write phone or desktop applications when they are writing server-side web applications.


    # Modular


    With the .NET Framework and CLR of old, you needed to install a complete version
    of the CLR on a computer. With ASP.NET Core, the framework is delivered as a NuGet
    package, which is a bundle of software that you can retrieve from a central repository
    and make available for application development on a workstation. These packages
    can be chosen and assembled as needed, and they are completely isolated from each
    project or application that is running on a computer.


    Previously, you needed to install the .NET Framework on a machine, and all applications
    would use the same framework. With ASP.NET Core, you can deploy your own version
    of the framework that is custom tailored to your application without fear of it
    interfering with other applications running on the same machine.


    # Open Source


    Since 2012, open source has almost become a requirement of any software vendor.
    With security issues introduced by governments and nefarious organizations, it
    has become imperative that development of software development technologies exists
    in the open so that everyone can review and easily inspect what is going on “under
    the covers.” This level of transparency'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'provides the ultimate security for the framework that your application is running
    on because you can easily inspect how the framework operates.

    The framework source code is licensed under the Apache v2 license, and the copy
    the ASP.NET team is distributing can be found at https://raw.githubusercontent.com/aspnet/Home/dev/LICENSE.txt.
    This license grants you the ability to distribute copies of the source code, access
    Microsoft’s patents used as part of the source code, and modify the source code
    for public and private use. There are no requirements to return to the public
    any modifications that you make to the source code.


    # TIP


    # Source Code Has Always Been Available


    The source code for the .NET Framework has always been available. It was originally
    published in 2002 as the Rotor project, and you could download and use the .NET
    Framework source code for free, but you could not repubish it or submit changes
    to it. It''s still available today at http://sourceof.net.


    ASP.NET was written primarily by Microsoft but is supported by a nonprofit organization
    called the .NET Foundation, which supports open source projects in the .NET community
    and fosters collaboration between developers and communities. Some of the .NET
    Foundation’s projects are listed in the word cloud shown in Figure 1.2. More details
    about the .NET Foundation can be found on their web site, at www.dotnetfoundation.org'
