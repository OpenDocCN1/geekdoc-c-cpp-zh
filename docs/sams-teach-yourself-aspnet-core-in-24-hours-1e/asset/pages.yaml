    that you can use to integrate and automate the use of npm and bower in your projects.


    # ### Extending Your Project with Scripts


    There are several extension points in the project file that you can use to automate
    the execution of command-line applications. You learned a bit about these in Hour
    4, "Defining ASP.NET Core Configuration," and this here recaps those techniques.


    You can add scripts to execute in your project file by adding a new Target'
