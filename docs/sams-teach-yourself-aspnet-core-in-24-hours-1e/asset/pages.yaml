    # What Are npm and bower?


    Up to this point, you''ve made use of a number of packages from the NuGet package
    manager system. NuGet delivers features and frameworks for .NET applications,
    and it previously used to provide web frameworks and widgets for use in ASP.NET
    applications. The problem with this approach is that web framework maintainers
    do not want to distribute their product for just the .NET ecosystem, so instead
    they use different package managers that are built specifically for delivering
    projects for formatting and building web pages.

    pm (which stands for Node Package Manager) is a command-line tool that is'
  merge: -1
