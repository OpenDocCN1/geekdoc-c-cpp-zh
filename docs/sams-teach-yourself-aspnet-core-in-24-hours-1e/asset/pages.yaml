  md: "This code makes the MVC framework and its default implementations available\
    \ to the entire ASP.NET application. Now you can configure ASP.NET to use MVC\
    \ if no matching static files are available. You do this by adding the following\
    \ code after the `UseStaticFiles` command in `Configure:`\n\n[Click here to view\
    \ code image](#)\n\n```\napp.UseMvc(routes => {\n\n  routes.MapRoute(\n    name:\
    \ \"default\",\n    template: \"Controller=Home}/{action=Index}/{id ?}\");\n \
    \ });\n\n}\n```\n\nThere are a number of things going on, but we need to wait\
    \ until Hour 8 to talk about them, when we explore the MVC architecture. For now,\
    \ focus on the `app.UseMvc` statement on line 1. This tells the server that the\
    \ MVC framework should be used in this application. Because it appears after the\
    \ `UseStaticFiles` statement, the static files have a higher priority than the\
    \ MVC framework. If, a static file and an MVC endpoint have the same name, the\
    \ static file will be first chosen and served to the requesting client. This means\
    \ that the order of the pipeline in the `Configure` method is very important,\
    \ as requests to the server are resolved from the top to the bottom of the method.\
