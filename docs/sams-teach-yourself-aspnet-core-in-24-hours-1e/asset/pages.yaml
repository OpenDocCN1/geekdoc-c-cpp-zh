  md: 'In addition, tag helpers to enhance the capabilities of an existing HTML tag
    (such as the anchor tag helper) allow you to continue to use standard HTML attributes.
    Feel free to decorate a tag with a CLASS or STYLE attribute, and those attribute(s)
    will be preserved in the output transmitted to the browser.


    You can trigger interaction from .NET code on your HTML inside the view with either
    a unique name or the presence of special attributes on a normal HTML tag. How
    do you configure the Razor engine so that you know there are helpers that you
    can trigger and use? This configuration is defined through the use of a page directive
    that as follows:


    Click here to view code image


    ```

    @addTagHelper <NAME>, <ASSEMBLY>

    ```


    # Caution: Don''t Forget to add @addTagHelper


    Forgetting to place an @TagHelper directive on a Razor page results in the tag
    helper syntax being copied directly into the output of the view without being
    interpreted by the TagHelper class.


    Additionally, you can surround the name and amass with quotes. You can also use
    an asterisk wildcard with the name parameter to instruct the interpreter to include
    all tag helpers in an assembly with a matching name segment. This directive line
    can appear at the top of any page to activate tag helpers on pages, or you can
    add it to the _Views/_ViewImports.cshtml page to include the tag helpers on all
    pages. If you look in _ViewImports.cshtml file, you should see the contents shown
    in Listing 14.3.


    # LISTING 14.3 The Default Contents of _ViewImports.cshtml


    Click here to view code image


    ```

    @using <MY APPLICATION''S NAMESPACE>

    @addTagHelper *, Microsoft.AspNetCore.Mvc.TagTagHelper

    ```


    Including the tag helpers on the _Views/_ViewImports.cshtml page causes all the
    default tag helpers that Microsoft ships to be available inside your application.
    What if there are some that you don''t want to use? How do you deactivate helpers?
    You can use the removeTagHelper directive at the top of a page or in _ViewImports
    with the same syntax used with addTagHelper. If you wanted to disable the environment
    tag helper on every page, you could add'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'the following to view contents of _ViewImports.cshtml:


    Click here to view code image


    ```

    @removeTagHelper

    Microsoft.AspNetCore.Mvc.TagHelpers.EnvironmentTagHelper

    Microsoft.AspNetCore.Mvc.TagHelpers

    ```


    You can also disable the use of a tag helper in specific instance by prefixing
    the opening tag name with an exclamation point:


    Click here to view code image


    ```

    <!a asp-action="Contact">Contact</!>

    ```


    A final configuration for tag helpers is to specify a prefix for all elements
    in your views in order to be considered tag helpers. Simply add the following
    directive to _ViewImports.cshtml or to any other page to force a prefix before
    any tag name:


    @tagHelperPrefix "tag:"


    For any tag that you would like to behave as a tag helper, you need to use this
    prefix. Note that it does not force any character to separate your prefix from
    the tag name. With this tag: prefix configured, the earlier environment and anchor
    examples need be called with this configuration in order to trigger the server-side
    behavior:


    Click here to view code image


    ```

    <tag:environment names="Development"></tag:environment>

    <tag:asp-area="" asp-controller="Home" asp-action="Index">Home</tag:>

    ```


    This explicit mapping of the tag helper is completely optional. Some developers
    find that it helps to reduce confusion between server-side interpreted tags and
    directives that may be interpreted client side as well web components or by a
    framework like Angular.


    # Tag Helpers That Ship with ASP.NET Core


    The ASP.NET team put together a group of tag helpers to showcase the capabilities
    of this feature in the framework and to enable some interesting scenarios that
    developers may run into. The collection that is available when you install ASP.NET
    Core includes the following:


    +   AnchorTagHelper—The tag can be configured with information about a server-side
    route, and this tag helper formats the link appropriately.'
