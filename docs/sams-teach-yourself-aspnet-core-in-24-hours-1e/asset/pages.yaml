    # Conventions Used in This Book


    This book uses several conventions to make it easier for you to understand what
    is being explained.


    # Try It Yourself


    The Try It Yourself activities provide hands-on-opportunities to actively experience
    and engage in the topics covered. These hands-on activities provide an opportunity
    to learn by doing, which is the best way to learn ASP.NET Core.


    # Notes


    Notes provide extra tidbits of information. The contain supplemental content or
    expand the information given in the nearby text.


    # Tips


    Tips provide extra information that can be useful when you are coding. This information
    can range from tips on how to better use a program to certain things you might
    want to change in the code. Tips identify handy tricks or expert advice that will
    help you along the way.


    # Cautions


    Cautions warn you when an action you might take could dire consequences. This
    cautionary text warns you of potential hazards and provides advance warning of
    outcomes you want to avoid.


    # Code Listings


    Code listings provide sample snippets of code that relate to the topic at hand.
    You''ll be able to examine the sample code to get a feel for how your code should
    be written.


    In this book, formal code listings are always surrounded by two lines to show
    where the code starts and it ends. The text surrounding the listing explains where
    this code should be placed if that isn''t clear from the code itself.


    # Downloading the Code and Resources'
