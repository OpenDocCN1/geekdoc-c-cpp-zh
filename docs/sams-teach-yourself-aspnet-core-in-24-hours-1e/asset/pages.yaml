  md: '# Visual Studio default package.json content.


    It''s not very exciting content. At this point, it''s only being used to add the
    bower functionality and define some baseline version information. The devDependencies
    element declares that the bower reference should only be included as a developer
    tool and should not be included in any deployment capacity. You can also define
    packages in Dependencies section which indicates the contents of these packages
    should be made available for production compilation and deployment of your application.


    npm packages are defined on the https://npmjs.org registry. You can browse and
    search this website for packages that will help you build your next application.
    Visual Studio 2015 and Visual Studio Code provide type-ahead assistance, so if
    you know packages you''re looking for, they will help you in keying in the names
    of the packages and in choosing the appropriate notation to get the version of
    the package you use. When referencing a package version from package.json, there
    are several distinct version markers that deliver different behaviors:


    +   - A version number with no additional markup attempts to fetch exactly the
    package version defined.


    +   - A version number preceded with a tilde (~) matches the major and minor versions
    requested and installs the latest patch version available. For example, ~1.2.3
    installs 1.2.3 and automatically updates to 1.2.4 when it becomes available and
    you instruct npm to install updates.


    +   - A version number preceded by a caret (^) matches the major version and installs
    the latest minor and patch versions as they become available. For example, ^1.2.3
    installs 1.2.4 and 1.3.0 as they become available, with a preference for 1.3.0
    since it is the highest'
