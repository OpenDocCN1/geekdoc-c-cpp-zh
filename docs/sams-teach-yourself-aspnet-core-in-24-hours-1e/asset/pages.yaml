    # Keeping Configuration Data Secret


    In the sample appsettings.json file, you included a reference to a database connection
    string. This isn''t a terrible practice in this case where a SQLite file is included,
    but when you might be connecting to a database or hosted service with a password
    or an access key, it could be a problem if you commit that data to source control.
    Even worse, it could be a real problem if you commit that data to a public source
    code repository like GitHub or Bitbucket. You''ve likely done it at some point:
    checked in source code with these “secret” pieces of data embedded in your code
    or configuration and exposed that information to other people. To prevent this
    type of accidental disclosure of configuration information while developing your
    application, the SecretManager tool was created.


    SecretManager is installed by default with Visual Studio 2017, and you can easily
    integrate it with your project by adding this dependency in AspTravelz.csproj


    Click here to view code image


    ```

    <PackageReference

    Include="Microsoft.Extensions.Configuration.UserSecrets"

    Version="1.1.1" />

    ```


    Also, you need to add an entry for the command-line tool to manage your secrets:


    Click here to view code image


    ```

    <DotNetCliToolReference

    Include="Microsoft.Extensions.SecretManager.Tools" Version="1.0.1" />

    ```


    When this command is executed, you should see a bunch of NuGet packages installed
    and configured in your workspace. The tool can then be executed with the user-secrets
    command. Figure 6.2 shows the help text that appears for this command.'
