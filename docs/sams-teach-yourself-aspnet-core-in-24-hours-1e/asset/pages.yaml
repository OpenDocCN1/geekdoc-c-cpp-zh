  md: '# HOUR 1

    Introducing ASP.NET Core


    What You''ll Learn in This Hour:


    +   - What is ASP.NET?

    - Why should you program with ASP.NET Core?

    - The significant changes in ASP.NET Core from previous versions, why they are
    important

    - Assumptions in this book

    - Introduction to the sample project


    In this hour you''re going to learn what ASP.NET is, what makes it the preferred
    web programming environment for many developers, and what major changes have been
    made in the new ASP.NET Core framework. This lesson reviews the assumptions that
    are made in this book and wraps up with an introduction to the sample project
