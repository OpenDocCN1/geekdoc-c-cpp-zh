    Next, you need to construct a file that contains instructions for Docker to

    package the application. By default, this file is called Dockerfile, and it

    ttypically stored in the root folder of the application you are bundling. Add
    to

    y application the Dockerfile shown in Listing 23.1. This file uses some of

    standard Dockerfile commands to reference your base image and add your

    application to it. You can find a complete reference for the Dockerfile syntax

