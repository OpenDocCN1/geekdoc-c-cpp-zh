  md: "environments where systems operations teams can configure environments through\
    \ a web portal. In these cases, the operations teams cannot directly access configuration\
    \ files on disk, and the environment variable option is easily accessible.\n\n\
    A similar syntax for fetching configuration options is supported for setting configuration\
    \ from an environment variable. In this case, the configuration elements are separated\
    \ with underscores (_) because separation with colons is not supported on all\
    \ operating systems.\n\nReading the environment variables into the project configuration\
    \ is as simple as adding a new line to the Startup constructor, as demonstrated\
    \ in Listing 6.3.\n\n# LISTING 6.3 Modified Startup Constructor to Read Environment\
    \ Variables\n\nClick here to view code image\n\n```\npublic Startup(IHostingEnvironment\
    \ env, IApplicationEnvironment appEnv)\n{\n    // Setup configuration sources.\n\
    \n    var builder = new ConfigurationBuilder(appEnv.ApplicationBasePath)\n   \
    \     .AddJsonFile(\"appsettings.json\\n\n    builder.AddEnvironmentVariables();\n\
    \n    Configuration = builder.Build();\n}\n\npublic IConfiguration Configuration\
    \ { get; set; }\n```\n\nThis is an easy addition to make, and the position of\
    \ the Startup constructor in the order of operations is very important. With the\
    \ ConfigurationBuilder object, the builder operates in a \"last in wins\" model,\
    \ with configuration sources overwriting any previously set value. If the call\
    \ to AddEnvironmentVariables() is prior to the AddJsonFile execution, then the\
    \ values configured in any environment variables are overwritten by those in the\
    \ configuration files on disk. By ordering configuration sources with the environment\
    \ variables added last, these settings can override any development settings written\
    \ in appsettings.json."
