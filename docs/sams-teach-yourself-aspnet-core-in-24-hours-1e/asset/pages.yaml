  md: '# HOUR 10

    Beginning MVC: Writing Your First View


    What You''ll Learn in This Hour:


    +   - How to use Razor templates

    - How to write a view

    - How to interact with a layout template and reusable templates

    - How to use HTML helpers


    The Trip controller output currently looks like a collection of error messages
    about not being able to locate a View file. It''s time to make the Trip controller
    output look like it actually belongs in a web browser. In this hour you will build
    your first views and start shaping the user experience of your application.


    NOTE


    # Views Delivering HTML Content


    Even though you will be using the Razor template language to craft your views
    this hour, the output of those templates is HTML. Everything you know about HTML
    is valid and should be considered appropriate output from the Razor files.


    # Introducing Razor Templates


    The templating engine that is used by ASP.NET MVC is called Razor, and the'
