  md: 'This code block can appear anywhere as a child of the Project element in your
    .csproj file. The Target element takes a required name attribute, and in this
    case it is given the very descriptive InstallNpm name. The next attribute, BeforeTargets,
    indicates that the content of this target should be executed before the application
    is built. If you choose to use the AfterTargets attribute with the Build element,
    the contents are executed after the project is built. Finally, you can also replace
    the Build target with Publish and trigger the actions Before or After with the
    Publish action as well. Both Build and Publish targets are triggered in Visual
    Studio as well as the command line, so you can get the same automation behavior
    when compiling your application by hand.


    The Exec element inside the Target declares the command-line executable and options
    that should be executed when this Target is triggered. In this example, the simple
    npm install command will be triggered before the Build operation takes place.


