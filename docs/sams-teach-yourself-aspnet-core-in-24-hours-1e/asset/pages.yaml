  md: 'for desired functionality that you’d like your visitor to access.


    # Configuring ASP.NET Core Routing


    Listing 18.1 shows an entry in the Startup.Configure method that adds a very simple
    routing table entry to your application.


    LISTING 18.1 Adding MVC and Configuring the Default Route


    Click here to view code image


    ```

    app.UseMvc(routes =>

    {

    routes.MapRoute("default", "{controller=Home}/{action=Index}/{id?}");

    });

    ```


    This initial route in the ASP.NET Core template is called the default route, and
    it is the pattern typically used for URLs in ASP.NET MVC applications. The “default”
    parameter is the name of the route and can be used later in your C# code to reference
    this route. The second parameter is the template URL to match. Let’s look at this
    route by piece:


    +   {controller=Home} is a token that should be captured and used as the controller
    route parameter. You know this because this element is surrounded by curly braces.
    This token captures the controller class that ASP.NET Core should use to serve
    the request. The =Home segment indicates that if the initial segment of the URL
    is missing, it should default to HomeController


    +   The forward slash indicates that there should be a slash in a URL if there
    is more content present. This makes the URL look like a folder and file requested
    from disk.


    +   The next token, {action=Index}, captures the action parameter. This parameter
    defines which method within the controller class should be triggered for this
    request. If there is no action element captured in this URL, the Index action
    will be used by default.


    +   Another forward slash does the same thing as the first one. (See a pattern
    here?)


    +   The last element attempts to capture a final token called id that will be
    passed to the route parameters. This is helpful when you want to navigate'
