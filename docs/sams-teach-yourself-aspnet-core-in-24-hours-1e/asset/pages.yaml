  md: 'ModelBinding is a feature by which the user input from the browser is directly
    mapped back to a model (or ViewModel) object for processing. In ASP.NET, the framework
    has capabilities to automatically transform input with field names similar to
    property names of a model. This makes handling input and validating a submitted
    model''s information very easy to do without requiring hand-coding to load a model
    from every field submitted from a browser.


