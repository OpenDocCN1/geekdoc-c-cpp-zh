  md: 'With this piece in place, a guest can now register, login, navigate around
    your application easily as an authenticated user. In the next hour, you’ll start
    to add constraints on who is allowed access to various features of the application.


    # Summary


    In this hour you have added authentication capabilities to your website. Users
    can register, log in, and log out from the application.


    # Q&A


    +   Q. Is it possible to use social authentication providers like Twitter or Facebook
    or Twitter to have users log in to my application?


    +   A. Yes, there are templates and links with up-to-date instructions on how
    to connect to these ever-changing services in the .NET templates.


    +   Q. How do I get the ID of the currently logged user so that I can mark that
    person''s data as belonging to him or her?


    +   A. You can inject UserManager<ApplicationUser> as shown in Listing 20.10 and
    get the user ID with UserManager.GetUserId().


    +   Q. The AllowAnonymous and Authorize attributes are too simple for my needs,
    and I need fine-grained control over who has access to different functions. What
    should I use?


    +   A. This is the subject of the next hour. Read on!


    +   Q. Do I need to build login, register, and logout pages if I use Windows Authentication
    or Azure Directory?


    +   A. No. Those services have their own registration and authentication pages.
    In the case of Azure Directory, your ASP.NET Core application will show the login
    page for your directory to users who are not logged in. When users log out of
    Active Directory, they are logged out of your application as well.


    # Workshop


    The workshop contains quiz questions and exercises to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    that follow.'
