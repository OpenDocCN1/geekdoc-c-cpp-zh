  md: '# # HOUR 24

    Looking to the Future and .NET Standard


    # ## What You''ll Learn in This Hour:


    +   * What .NET Standard is

    * How to write code that works with .NET Framework and .NET Core

    * Future updates for ASP.NET Core

    * How to stay connected to the ASP.NET Core community and learn about planned
    features


    As an open source project, ASP.NET Core receives hundreds of lines of code committed
    to the various libraries, templates, and projects every day. With more than 450
    contributors registered on the ASP.NET GitHub organization, the framework is evolving
    quickly, and new features are published every three to six months. In this hour,
    you will learn about the .NET Standard concept and how this feature allows your
    existing code to keep up with the changes in the .NET community.


    # ## What Is .NET Standard?


    Way back in Hour 3, "Exploring the New Project Templates," you learned that there
    are two different frameworks on which you can build ASP.NET Core: .NET Framework
    and .NET Core. .NET Framework has been actively maintained since 2002 and runs
    on Windows. .NET Core was released with ASP.NET Core and provides support for
    running applications on Windows, Mac,'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'and Linux. How can you write shared libraries that can be used regardless of
    the .NET framework type you are using?


    In 2013, Microsoft''s .NET team faced this problem, with the rising challenges
    of a Windows Phone distribution of .NET Framework that was distinctly different
    from the Windows desktop version of the framework. In addition, Silverlight''s
    Flash-like experience used yet another version of the .NET Framework. To solve
    this problem, the team invented the Portable Class Library (PCL). The goal of
    the PCL was to deliver a development experience that could be compiled and run
    on any of the frameworks it targeted and allowed use of all the features that
    were common to those frameworks.


    The problem with this approach was that you had to select specific frameworks
    and versions at project creation time, and you were constrained to using only
    features common to those frameworks. Consequently, as you added more target frameworks
    to your library, you reduced the APIs that were available to you. Figure 24.1
    shows a Venn diagram illustrating this situation with frameworks and features.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_397_0.png)


    # FIGURE 24.1


    Targeting multiple frameworks with PCLs meant you could code targeting the intersection
    of their common features.


    To project maintainers of existing code this was a stumbling block rather than
    a gateway to code reuse. The reduced footprint of available APIs to code against'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'was a significant barrier, and with the entry of .NET Core in the mix, as many
    10 different .NET Frameworks could be utilized. This growth of .NET could not
    be sustained, and the team took steps to rein in the issues with PCLs.

    .NET Standard is the answer to those issues with PCLs and provides a way out of
    the mire of managing interactions and APIs exposed by different frameworks.

    NET Standard accomplishes this by providing the following:


    +   - A set of immutable versioned framework contracts that define the common
    APIs exposed by each version of the .NET Standard contract.


    +   - Compiler and packaging rules that allow you to code against a .NET Standard
    set of APIs that will be swapped out at build time for a project in a supported
    framework. For example, when a .NET Standard library is referenced by a .NET Core
    project, the references in the .NET Standard library are redirected to the .NET
    Core implementations. When that same library is referenced by a .NET Framework
    project, the .NET Framework implementations are swapped in build time.


    +   - A clear set of APIs that you are familiar with. In addition, each version
    of .NET Standard includes additional APIs and does not modify previous contract
    versions.


    .NET Standard defines the common APIs that all framework versions need to implement
    in order to be called “NET.” In addition, as new .NET Frameworks are invented
    and implemented, they will declare which version of the .NET Standard APIs they
    support, and which code supports the same .NET Standard version or lower will
    just work when included in a project for that platform.


    # The .NET Standard Versions


    There are several versions of .NET Standard that define the various sets of APIs
    and versions that implement those APIs. When you write code targeting of the .NET
    Standard versions, you develop with confidence that it will work on the framework
    versions associated with it. Table 24.1 provides a helpful grid of .NET Standard
    versions and it .NET framework versions.


    # TABLE 24.1 .NET Standard Versions and Supported Frameworks


    | .NET Standard Version |'
