  md: '# # HOUR 18

    Routing Angular Requests Around ASP.NET Core


    **What You''ll Learn in This Hour:**


    +   - How to configure and use the server-side ASP.NET Core router

    - How to use the Angular client-side router

    - How to use multiple Angular components in an application

    - How to mix and match the use of both router technologies


    Way back in Hour 5, “Configuring the Service with the Startup Class,” you saw
    a snippet of configuring the Startup class in your application with a statement
    that contained the MapRoute function call. This hour, you will learn about the
    server-side routing configuration options in ASP.NET Core, the client-side routing
    options with Angular, and how you can mix and match these features to deliver
    a cohesive application to your visitors.


    **What Is Routing?**


    Basically, routing is a technique for mapping URLs requested from your application
    to functionality that should be delivered to the browser. The application maintains
    a routing table that contains a list of templated URLs and the destination functionality
    to provide. The routing functionality of the ASP.NET Core or Angular framework
    uses this table to determine which functionality to serve based on how the templated
    URLs match the URL requested of the application. In addition, routing can be used
    to generate a URL'
