  md: "# FIGURE 10.2\n\nOutput of the initial search template.\n\nThis is a nice start,\
    \ but say that you would really like to wrap the contents of the search page with\
    \ a nice header bar and a footer. To do that and to ensure that this layout is\
    \ available to all pages in the application, you can use a Layout template, as\
    \ described in the following section.\n\n# Creating Razor Layout Templates\n\n\
    To create and enforce a shared layout template on all pages in the application,\
    \ you only need to create two templates with some code in them that directs the\
    \ Razor engine to appropriately include child templates. The first of the two\
    \ templates is called _ViewStart.cshtml, and it resides at the root of the Views\
    \ folder.\n\nThe\\_ViewStart.cshtml template is typically a single line of code,\
    \ a directive telling the engine where to find the layout to apply to any Razor\
    \ template that is requested.\\ViewStart.cshtml is a \"magic filename\" for the\
    \ Razor template engine that it will discover and execute. Listing 10.6 shows\
    \ the contents of the\\_ViewStart.cshtml file for the ASPNETorizr site.\n\n# LISTING\
    \ 10.6 _ViewStart.cshtml Content That Specifies a Common Layout File\n\nClick\
    \ here to view code image\n\n```\n@{\n  Layout = \"Layout\";\n}\n```\n\nIn Listing\
    \ 10.6, the definition of Layout as a file called _Layout takes advantage of the\
    \ file locator into the Razor engine, and it looks in several places for this\
    \ file. You have already seen reports of the Razor engine looks, way back in Hour\
    \ 5, \"Configuring the Service with the Startup Class,\" when you first started\
    \ running a method in a controller without having a view present. You probably\
    \ saw error output that looked similar to the contents of Figure 10.3."
