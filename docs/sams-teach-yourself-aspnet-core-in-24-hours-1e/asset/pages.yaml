    # LISTING 14.1 The environment Tag Helper in Use in _Layout.cshtml


    Click here to view code image


    ```

    <environment names="Development">

    <link rel="stylesheet" href="/lib/bootstrap/dist/bootstrap.css" />

    <link rel="stylesheet" href="~/css/site.css" />

    </environment>

    ```


    This markup is not standard HTML, and environment is an HTML tag that was invented
    by the ASP.NET. When you look at this code in Visual Studio with the default light
    theme (see Figure 14.1), the environment text is highlighted in bold.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_225_0.png)


    # FIGURE 14.1


