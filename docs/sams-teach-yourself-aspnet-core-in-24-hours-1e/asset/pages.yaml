  md: 'developers can easily decide whether they want to accept minor fixes to a component
    or install major changes.


    # Choose Your Own Editor


    No longer Microsoft tied tied selling you a Visual Studio version to build with
    its web framework. ASP.NET Core comes with a collection of command-line tools
    that you can use with your favorite text editor to compile and deploy a real working
    web application. In addition, Microsoft is supporting developer community members
    who are building add-ons to help give text editors source code editing capabilities.


    The command-line tools Microsoft provides are not half-baked tools that only developers
    on Mac and Linux use. Every ASP.NET application is built with the same tools,
    and even Visual Studio uses those same tools. The difference with Visual Studio
    is that Microsoft put a nice graphical user interface in front of the command-line
    experience. For many developers who prefer the command-line, this has been a very
    welcome one.


    # Cross-Platform Capable


    When cross-platform capability was announced, some technologists'' minds melted.
    Microsoft is making a development technology for full development on Mac and Linux.
    No longer are you required to buy Windows or a Windows Server license to run your
    web applications. Web operators who enjoy running server daemons on Linux can
    manage and support ASP.NET applications running on their favorite flavor of Linux
    with same fidelity and support from Microsoft that they would receive if they
    were on Windows.


    This is not your parents'' Microsoft.


    # MVC and WebAPI


    Previous versions of ASP.NET provided access to the Web Forms framework. Starting
    with ASP.NET Core, the preferred development framework is a combination of the
    ASP.NET MVC and WebAPI frameworks. This is not a direct upgrade but a "concept
    compatible" update that adds the same features you are already familiar with.
    This rewrite of MVC and WebAPI provides simpler syntax and use. You''ll learn
    more about how to start programming in this model during [Hours 8](),[Introducing
    the MVC Architecture]() through 13,[Writing Web API Methods]().'
