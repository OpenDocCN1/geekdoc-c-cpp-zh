    > > Note: Introducing the CORS Standard


    Web server operators use CORS, which stands for Cross-Origin Resource Sharing,
    to grant or block access to the contents of the server when requested by an application.
    Web browsers and ASP.NET Core have a default policy called Same-Origin Policy
    that prevents JavaScript (such as your Angular application) from being executed
    against the server from a different host and port combination.


    To work around this issue, you need to tell Angular to configure a proxy for requests
    to the ASP.NET Core server and route them appropriately. Your final configuration
