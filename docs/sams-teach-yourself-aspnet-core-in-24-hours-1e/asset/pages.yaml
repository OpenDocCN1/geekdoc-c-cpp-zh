  md: '# Getting Started with bower


    bower is a simpler package manager than npm that acts as a management layer on
    top of the git protocol. git is a source control system that is very popular in
    the open source community and has gained a lot of traction in the enterprise development
    market as well. bower maintains a registry of packages at https://bower.io, where
    you can search for packages to use in your application. Packages managed by bower
    in an application are configured in bower.json file with a bower command-line
    tool that can assist in maintaining entries in this file. These packages also
    use the bower.json file to add, update or remove packages from your project. Like
    npm, bower is part of the default configuration with the default ASP.NET Core
    templates, as shown in Figure 15.2.


