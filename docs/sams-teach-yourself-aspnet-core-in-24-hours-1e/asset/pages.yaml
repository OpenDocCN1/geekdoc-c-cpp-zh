  md: 'With this dialog, you can configure a number of options for the code to be
    generated. This template generates a controller and prepopulates all the database
    interaction methods based on the Entity Framework objects you specify in the first
    two combo boxes in this dialog. It is important that the model chosen can be managed
    with the class specified in the Data Context combo box. The button with the plus
    symbol on it allows you to specify the name of a new data context class if you
    have not written one for your model class.


    The Generate Views box is intuitive: Do you want views generated for the controller
    actions? The Reference Script Libraries check box allows you to specify whether
    the template should use a view residing in /Views/Shared/_ValidationScriptsPartial.cshtml
    to help JavaScript validate the contents of your browser. The Use a Layout Page
    check box allows you to specify the location of an alternate layout if you are
    not using the standard /Shared/_Layout.cshtml page that comes with the defaults
    templates. Finally, the Controller Name text box allows you to name your new controller
    class and file.


    The contents of the controller class have the same method names and signatures
    as the first two template, with a few notable exceptions:


    +   - There is now a public constructor that accepts an instance of the data context
    shown in the dialog. This context is assigned to a read-only controller-scoped
    field.


    +   - All methods now run asynchronously and return Task objects. This is accomplished
    by adding the async keyword to the method signature and returning a Task object
    of type IActionResult. IActionResult is the typical action object you would return
    from a controller when you return a view or JSON result.


    +   - The methods that previously accepted IFormCollection now accept a Trip object,
    as demonstrated in the Create method signature in Listing 11.3.


