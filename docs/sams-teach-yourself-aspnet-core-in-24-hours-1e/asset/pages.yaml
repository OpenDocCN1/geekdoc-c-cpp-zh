    You have a choice of three subcommands:


    +   - database—Allows you to manage the database the project is working with

    - dbcontext—Allows you to manage the context and classes in the project

    - migrations—Allows you to configure changes from the code model to the database


    You can start defining the structure of the database by creating a “migration”
    for the initial trip design. A migration is a code-based definition of the changes
    needed to update the database configuration, and it also includes the code to
    remove the configuration changes that would be made. In this way, you can both
    upgrade and downgrade the database with the model changes that are present in
    the .NET code. To generate this block of code for the Trip object, running the
    following command at the command prompt:


    Click here to view code image


    ```

    dotnet ef migrations add "Initial Trip"

    ```


    You should see a simple Done output by this command, with some information about
    how to to undo the command if needed. The code that was generated for you resides
    in the new Migrations folder in your project. You should find two files in that
    folder:


    +   - TripDbContextModelSnapshot.cs—This file contains a snapshot of what the
    database looks like.

    - __InitialTrip.cs—This is prefixed with numbers that constitute the date and
    time that you generated with the previous command. Inside this file are series
    of .NET method calls that generate the appropriate database commands to Construct
    the Trip table in the database.


    You can apply this migration and build your database file by executing the following
    command at the command prompt:


    ```

    dotnet ef database update

    ```


    You should see a statement from the dotnet command indicating that it is recompiling
    your project. This is because you just added two C# files as part of the migration
    created earlier. Once the compilation completes, the .NET tool applies those changes,
    and you should see the nondescriptive Done message,'
