    and endpoints that you can connect with other APIs besides Entity Framework Core.
    It is for this reason that I like to create a Repository class that hides Entity
    Framework Core so that interactions with the data store can change between Entity
    Framework and the data storage''s specific API.


    +   Q. Can Entity Framework Core be configured to operate on the database asynchronously?

