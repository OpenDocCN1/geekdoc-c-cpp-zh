  md: 'IConfiguration object that you can traverse and on which you can call an appropriate
    Get method to fetch a specific value from the appsettings.json file:


    Click here to view code image


    ```

    var title = Configuration.GetConfigurationSection("AppSettings").Get("SiteTitle")

    ```


    This is very expressive code, and you could use it to traverse the file, but there
    is an easier way to navigate directly to the settings you need. The configuration
    system provides the ability to join configuration elements with the colon (:)
    symbol. You can grab the SiteTitle value directly from your appsettings.json file
    with the following command:


    Click here to view code image


    ```

    var title = Configuration.Get("AppSettings:SiteTitle");

    ```


    You can use the more terse index syntax to call the Get method as well:


    Click here to view code image


    ```

    var title = Configuration["AppSettings:SiteTitle"];

    ```


    This saves you a bunch of keystrokes, and you can now easily grab values from
    the application configuration.


    If you are not sure whether the configuration contains the values that you are
    looking for, you can use the TryGet method on IConfiguration to verify if a value
    is available without an error being thrown:


    Click here to view code image


    ```

    string title = ""

    bool foundTitle = Configuration.TryGet("AppSettings:Title", out

    title);

    ```


    In this case, the foundTitle value can be set to false as there is no Title configuration
    option written in the AppSettings of your configuration.


    # Configuring the Application Using Environment Variables


    Besides injecting configuration information through a configuration file, the
    other option easily accessible to developers is to inject configuration through
    environment variables. This has two very nice benefits:


    +   - Environment variables are available on all operating systems and easily
    accessible from memory, with no disk I/O operations required.

    - Environment variables enable easy migration to cloud-based hosting'
