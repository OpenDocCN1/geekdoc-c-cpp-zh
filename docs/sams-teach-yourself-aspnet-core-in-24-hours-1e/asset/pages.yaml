  md: 'available version.


    +   - You can alternatively provide an asterisk (*) for the version to indicate
    that you want absolutely the highest version available to be installed in your
    project. This is an aggressive approach, as major version number changes on a
    package indicate significant changes in API that could have effects on your project.


    In addition to editing and maintaining the package.json file by hand, you can
    use the npm command-line tool to manage the contents of this file by using following
    commands:


    +   - npm init—Initializes a new package.json file to begin using with a project


    +   - npm install—Installs any packages to their latest published versions that
    match version specs in the package.json file


    +   - npm install "package name" --save—Installs the latest version of "package
    name" and saves a reference to it in package.json''s Dependencies section


    +   - npm install "package name" --save-dev—Installs the latest version of "package
    name" and saves a reference to it in package.json''s devDependencies section


    +   - npm uninstall—Removes a package from this project


    With each of the install commands, npm places the contents of the package in the
    local node_modules folder. New command-line tools that are added will have their
    scripts placed into a .bin folder that can be used to execute those commands.


    If you want to add a command-line tool with npm so that it can be executed anywhere
    on your workstation or server, you can execute the npm install command with a
    global flag, as follows:


    ```

