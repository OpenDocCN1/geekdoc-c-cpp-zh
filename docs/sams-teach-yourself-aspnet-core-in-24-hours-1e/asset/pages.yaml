    - How to create a new database and structures for storing, managing, retrieving
    data

    - How to use the SQLite database provider

    - How to swap out and use other database providers

    - Creating and populating with initial data


    You have created the base configuration for your web project and defined some
    of the initial settings for the application, and now you need to define how and
    where you will store information that is created from the web. For the sample
    application ASPTTravelz, you will be storing information about trips, segments
    of trips, modes of transportation, and schedule information so that you can find
    them later.


