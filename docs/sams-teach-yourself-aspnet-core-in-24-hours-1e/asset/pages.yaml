    # Q&A


    +   Q. Do I need to use the Angular CLI to use the Angular framework, or can I
    reference packages and features directly from npm or downloaded from the Angular
    website?


    +   A. You can download and maintain the Angular tools yourself. The Angular CLI
    makes this maintenance a breeze and can be customized to meet your needs.


    +   Q. *ngFor does not look like a valid HTML attribute. Doesn''t that create
    a problem?


    +   A. The attribute is parsed in the HTML template before your browser sees it
    as part of the page to display. Remember that the template is interpreted by Angular
    first.


    +   Q. Are there other attribute directives that I should know about?


    +   A. There are lots of attribute directives out there, and you can read the
    documentation about the current in-the-box directives on the Angular documentation
    site, at angular.io/api?type=directive. In particular, take a look at ngIf and
    ngModel, which you will learn about and use over the next few hours.


    +   Q. Can I trust that Angular 4 will be supported for a long time?


    +   A. Angular is an open source project, and you can therefore find the source
    code available for the libraries. Very large teams of contributors writing features
    and fixes that you can download and add to your project at'
