    # What You''ll Learn in This Hour:


    +   - How to configure ASP.NET Core authentication

    - How to configure an application to register new users

    - How to require a user to be logged in to access features of your application


    Authentication is typically confused with authorization in discussing security
    configuration of an application. Authentication is the process of verifying that
    the person requesting access is who he or claims to be, and it is typically achieved
    through a username and password exchange. Authorization is the process of verifying
    that you are allowed access to the feature you are requesting. In this hour, you
    will learn how to configure authentication for your application using a local
    datastore and third-party services like Azure Active Directory. You''ll then use
    your new configuration to prevent anonymous, or non-logged-in users, from accessing
    segments of the application.


