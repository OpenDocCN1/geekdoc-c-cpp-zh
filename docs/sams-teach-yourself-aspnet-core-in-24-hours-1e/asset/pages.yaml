  md: 'Q. Can I have multiple layouts in my application and choose an appropriate
    one at the top of my Razor template?


    A. You certainly can do this, but you will end up with a bit of code duplication.


    Q. Do I have to use Razor markup with ASP.NET Core? Is there another type of markup
    that I can use?


    A. Razor is the only templating engine delivered with the initial release of ASP.NET
    Core. The community is welcome to make Spark, Web Forms, or any other templating
    toolkit available.


    # Workshop


    The workshop contains quiz questions and exercises to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    that follow.


    # Quiz


    +   1. What is the file extension for Razor syntax?


    +   2. What is the special name of the Razor template that is loaded first if
    it is present on disk?


    +   3. What is the command for a layout page to call to indicate where contents
    of a child template should be placed within the page?


    +   4. What is the character that indicates the start of C# code in a Razor template?


    # Answers


    +   1. .cshtml


    +   2. _ViewStart.cshtml


    +   3. RenderBody()


    +   4. @


