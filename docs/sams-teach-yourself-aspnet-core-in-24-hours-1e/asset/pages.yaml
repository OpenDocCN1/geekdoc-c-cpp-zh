    # Getting Started with Data


    Object-relational mapping (ORM) is a development technique that was introduced
    with the push for object-oriented programming. Basically, ORM allows you to work
    with a database as a series of objects in C# (or whatever programming language
    you are using), and interactions with the database are translated to you database''s
    native query language. Entity Framework Core 1.0 is the latest version of Microsoft''s
    ORM framework for .NET developers, there are many other ORM frameworks available,
    including Hibernate, Dapper, and Massive.


    Entity Framework Core can be used in two modes: code first or data first. These
    two modes define which one first—the .NET code or the database structures—and
    allows you to write applications from that forward. In this hour, you will learn
    about both techniques for working with your application. The ASPTravelz application
    is a brand-new application for you, and the following section demonstrates how
    code-first interactions are constructed. Later this hour, you will see how to
    work with your database in a data-first model.


    # Adding Entity Framework Core to Your Project


    To begin working with Entity Framework Core in your project, you will need to
    add dependencies to your project.json file to direct the dotnet tool to restore
    packages and make their functionality available to you in the project. Add the
    following package references to your AspTravelz.csproj:


    Click here to view code image


    ```

    <PackageReference Include="Microsoft.EntityFrameworkCore.Sqlite" Version="1.1.1"
    />

    <PackageReference Include="Microsoft.EntityFrameworkCore.Tools" Version="1.1.1"
    />

    PrivateAssets="All" />

    ```


    These two packages add the SQLite database provider and all the Entity Framework
    Core references it depends on, as well as the tools you need to configure and
    connect to the database as a developer. The tools package is marked with the attribute
    of PrivateAssets="All" to indicate that it will not be deployed with the project
    and is only in use while you are writing your application. In addition, you need
    to add the DotNet Tools package as part of the DotNetCliToolReference segment
    of AspTravelz.csproj:'
