    # Fast Development Cycle


    The fast development cycle goes hand-in-hand with the modular nature of the framework.
    With the deployment of framework resources as NuGet packages, new versions can
    be deployed more quickly, and they can be consumed by developers who monitor the
    NuGet.org service for package updates. Using semantic versioning capabilities
    in the references of an ASP.NET project,'
