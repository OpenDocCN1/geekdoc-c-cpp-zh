  md: '# FIGURE 15.7


    Visual Studio external tool configuration locations.


    Visual Studio searches in these locations from top to bottom, and it stops at
    the first folder that contains the executable it is looking for. When you want
    to restore your bower packages, it first looks in the node_modules folder of the
    current project and then the default Visual Studio installation directory''s web/external
    folder. Next it searches on your system''s path, and finally it looks in the git
    folder for Visual Studio.


    When you install Node.js, the global installation folder for npm (%appdata%\npm)
    is added to your path. You can force that location to take a higher priority in
    Visual Studio by adding that folder to the top of this list or simply moving the
    ($PATH) option to the top of the list.


