    and all Windows versions have the base framework required to run ASP.NET installed
    in the global assembly cache of the Machine. ASP.NET Core, those adaption are
    not necessarily in the global assembly cache. There are two approaches to deploying
    your application: shared mode and self-contained mode.


    If the destination server is configured with the full .NET Core Windows Server
    hosting option, as described above, then it is available for “shared hosting”
    because there is a common .NET Core or .NET Framework available on the machine
    that can be shared across all applications. With the currently configured project
    file as you write it in Hour 4, "Defining ASP.NET Core Configuration," you can
    easily copy the output of a dotnet publish command and place it in a folder on
    the destination server. The shared components will be consumed by your application,
    and it will run behind the IIS web server.


