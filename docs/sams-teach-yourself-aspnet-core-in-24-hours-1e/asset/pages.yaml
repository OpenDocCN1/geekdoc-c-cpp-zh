    +   * DataType—Verifies that the value submitted matches the data type specified


    +   * EmailAddress—Verifies that the value submitted matches an email address
    format


    +   * MaxLength—Verifies that the value submitted does not exceed the length specified


    +   * Phone—Verifies that the value is a well-formed phone number


    +   * Range—Verifies that the number submitted falls within a range of values


    +   * RegularExpression—Verifies that the value submitted passes a test of the
    specified regular expression


    +   * StringLength—Verifies that the string submitted satisfies a minimum maximum
    length requirement


    +   * Url—Verifies that the value submitted is formatted as a URL (that is, a
    web address)'
