  md: '# FIGURE 20.2


    Authentication configuration options.


    There are four options on this screen, each serving a unique purpose:


    +   - No Authentication—Adds no security to your application and is a good choice
    if you do not need to restrict access.


    +   - Individual User Accounts—Creates a local datastore for you to maintain users
    and their credentials using Entity Framework.


    +   - Work or School Accounts—Connects to a cloud authentication service such
    as Azure Active Directory to delegate maintenance of user accounts and credentials
    to that service.


    +   - Windows Authentication—Delegates access control to Windows user management
    when running on a Windows machine. You may have also heard this referred to Active
    Directory or integrated authentication. In order to use this effectively, you
    must host your service on a Windows server.


    If you are not using Visual Studio, you can also choose to use one of these configuration
    options when you build a new application from the command line. You can execute
    the following command to get a list of valid options that you can use:


    ```

    dotnet new mvc --help

    ```


