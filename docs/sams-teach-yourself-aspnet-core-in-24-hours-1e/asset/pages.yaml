    # LISTING 5.5 Configure Method with Method Calls to add Static File Handling\n\
    \nClick here to view code image\n\n```\npublic void Configure(IApplicationBuilder\
    \ app) {\n    app.UseDefaultFiles();\n    app.UseStaticFiles();\n}\n```\n\nThe\
    \ two new lines, UseDefaultFiles and UseStaticFiles, provide the web service with\
    \ the configuration to be able to serve files saved to disk. The"
