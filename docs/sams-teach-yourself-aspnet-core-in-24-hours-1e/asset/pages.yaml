  md: '# # HOUR 16

    Introducing Angular


    What You’ll Learn in This Hour:


    +   - The Angular framework is


    +   - Why Angular is so powerful


    +   - How to get started with the Angular command-line tool


    +   - The simple component architecture of an Angular application


    2010, there has been a dramatic revolution in JavaScript development. Frameworks,
    technologies, runtimes, tools, terms, and architectures have been invented using
    open source technologies. These inventions have been shared, extended, built up,
    and reshared. The momentum of this JavaScript movement has been nothing short
    of spectacular to observe and participate in.


    As a technology leader, Google organized the development framework for its applications
    and shared it for the community to learn and build on. That framework was AngularJS.
    After a few years of public consumption, Google released a second version of the
    framework and decided to drop the JS from the name to indicate that it was more
    than just a user interface framework. Google also began using TypeScript as a
    first-class programming language to work with Angular.


    Many developers have struggled with web page design and interactivity. Earlier
    versions of ASP.NET attempted to solve this problem with a rich server-side control
    ecosystem. You could easily drop a control into a web page, and at request time,
    ASP.NET would transform that control into some HTML, JavaScript, and style markup.
    Building user interfaces on the server can deliver a'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'slow experience and fails to take into account any information about the client
    visiting your application. Is it a mobile device? Are you delivering content for
    a screen reader because your visitor is vision impaired? JavaScript user interface
    attempt to solve such issues by pushing more of these user interface decisions
    to the browser.


    The Angular 4 version that you will learn about this and the next few hours was
    published in March 2017 and provides a comprehensive framework for building applications
    with JavaScript and TypeScript. This lesson takes a break from ASP.NET Core to
    focus on how to use Angular to build user interfaces. Hour 17, “Connecting Angular
    to ASP.NET Core,” returns to ASP.NET Core and using Angular with your application.


    # Getting Started with Angular


    Many JavaScript frameworks have a series of configuration steps, tools to install,
    and rules that you need to follow in order to get started and write your first
    line of code. An open source team outside the main Angular team that wanted to
    make the experience simpler and easier for developers wrote command-line tool
    that downloads and positions everything on your workstation so that you can get
    your first application running in minutes—or maybe even seconds.


    NOTE


    # CLI Prerequisites


    You should have Node.js 6.9.0 or later or npm version 3 or later installed on
    your system in order to use the Angular command-line interface (CLI).


    You install the Angular CLI by executing this command at a prompt:


    ```

    npm install -g @angular/cli

    ```


    Remember that npm is the Node Package Manager that you learned about in Hour 15,
    "npm and bower: Client-Side Package Managers." In this case, you are instructing
    it to install a package. The -g switch indicates that this package should be installed
    globally so it can be used without being in the context of a project. The package
    to be installed is in the @angular organization and is called cli. All of the
    official packages and libraries built for and supported by the Angular team are
    prefixed with the @angular organization indicator.'
