    # Summary


    This hour covers the various options for configuring how your web application
    will compile and interact with the web server. You have learned how to build a
    .csproj file and have seen some of the most important configuration options for
    a project. You have learned how to get started with the NuGet package manager,
    where to find NuGet packages, and how to reference them in your application. Finally,
    you have learned how to customize the commands that interact with your project
    using a Program class.


    # Q&A


    +   Q. The SDK attribute for an ASP.NET Core project should be set to what value?

    A. The SDK attribute should be set to Microsoft.NET.Sdk.Web.

    Q. In the semantic version number 1.2.3.4, what type of version does the 2 represent?

    A. The 2 is the version number.

    Q. NuGet packages are referenced in a .csproj project definition file as part
    of what element?

    A. The PackageReference element defines references to packages.

    Q. What TargetFramework should I specify in a project file to allow the project
    to be executable on Mac or Linux?

    A. You should specify netcoreapp1.0 or netcoreapp1.1.

    Q. How do I extend a project to add additional command-line tools to the dotnet
    tool?

    A. You should add DotNetCliToolReference elements to your project'
