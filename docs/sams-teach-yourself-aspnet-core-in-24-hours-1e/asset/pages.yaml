    +   * On Windows, the NuGet.config file is kept in %AppData%NuGet.

    * On Mac and Linux, the NuGet.config file is kept in ~/.nuget.


    If you know what packages you should install, what packages are available, and
    what those packages do? In Visual Studio 2017, there is a Package Manager user
