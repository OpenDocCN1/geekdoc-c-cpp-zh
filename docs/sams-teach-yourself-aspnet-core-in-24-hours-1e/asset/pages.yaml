    \n# Building Other Reusable Components\n\nBesides tag helpers, you can also use\
    \ two other mechanisms to build reusable components: view components and partial\
    \ views. Views components are more closely related to the user control model of\
    \ older ASP.NET, where markup component and a server-side component work together\
    \ to execute and deliver a block of user interface code to the browser. Both view\
    \ components and partial views are referenced from a view and can be called asynchronously.\n\
    \nListing 14.4 shows the code for a simple view component to get the upcoming\
    \ trips and render them as a list.\n\n# LISTING 14.4 A View Component for the\
    \ Next Three Trips\n\nClick here to view code image\n\n```\n[Component(Name=\"\
    Upcoming\")\npublic class UpcomingTripsViewComponent : ViewComponent\n{\n    public\
