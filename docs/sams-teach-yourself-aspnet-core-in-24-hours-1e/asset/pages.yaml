    # NOTE


    # Using IFormCollection Is Not the Only Way to Access Your Data


    Form collection from fields submitted is not the only way to access the submitted
    data. You could add individual fields as parameters to your methods and capture
    each field as a separate parameter. That would also be a lot of maintenance work
    each time you wanted to change your application’s fields. With the next template,
    you''ll see how to do this a bit more easily with ModelBinding.


