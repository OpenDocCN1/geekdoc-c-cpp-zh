    can also right-click the project in the Solution Explorer and select Manage Packages
    from the context menu. This user interface allows you to search NuGet repositories,
    both public and private, and see the descriptions of the packages and features
    you have searched for. In addition, Visual Studio 2017 provides type-ahead IntelliSense
    for the name and version number of NuGet packages if you edit the project file.


    If you do not have Visual Studio, you can search the public NuGet.org repository
