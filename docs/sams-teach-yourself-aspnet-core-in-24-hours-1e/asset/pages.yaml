    jQuery, and jQuery validation are referenced by bower and listed in the Dependencies-Bower
    segment in the Solution Explorer of Visual Studio, much like the npm packages.


    Unlike with the npm packages, with bower you have a little more control over where
    the bower packages are placed on disk. There is a .bowerrc file hidden under bower.json
    in the Solution Explorer that contains an override directive for the location
    to place the bower packages. Listing 15.1 shows this file.'
