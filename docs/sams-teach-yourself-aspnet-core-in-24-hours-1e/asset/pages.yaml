  md: '# Summary


    In this hour, you have learned how to configure the ASP.NET Core service to respond
    to requests, log information about those requests, and handle errors. You have
    also learned about dependency injection and how to configure the dependency injection
    container provided by ASP.NET.


    # Q&A


    +   Q. Do I have to use the Kestrel web server when I publish my application to
    a production environment?


    +   A. With the initial version of ASP.NET, you should use Kestrel combined with
    an enterprise-grade web server in front of it. That web server can be nginx, Apache,
    or Microsoft Information Server. They can all be configured to proxy requests
    to the Kestrel server while providing hardened security and reliability for your
    application. You’ll learn about this in Hour 22, “Deploying to Production.”


    +   Q. Do I have to use MVC in my application, or is there another server-side
    framework that I can use?


    +   A. With the initial release of ASP.NET Core, the only server-side framework
    that is available from Microsoft is MVC. However, you did learn about middleware
    in this hour, and you could write your own framework to handle requests instead
    of using MVC.


    # Workshop


    The workshop contains quiz questions and exercises to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    that follow.


    # Quiz


    +   1. What does dependency injection do for an application?


    +   2. After you make changes to project.json to include a new dependency, to
    review your changes, you should stop the web server, and run `dotnet restore`.
    What command do you run to relaunch the web server?'
