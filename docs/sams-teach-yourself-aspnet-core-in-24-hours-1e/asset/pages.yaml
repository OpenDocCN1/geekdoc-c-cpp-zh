  md: '# Introduction


    The World Wide Web has been around for more than 20 years, and it''s safe to say
    that it''s here to stay. During this time, Microsoft has produced one of the most
    effective and productive frameworks for building and deploying websites: the Active
    Server (ASP) framework. Through the evolution of ASP into ASP.NET, this framework
    has grown and changed to meet the needs of the ever-evolving web. ASP.NET Core,
    addresses many of the needs of modern web developers who want to build portable
    high-performance applications that can run on any operating system. This book
    teaches you how to build your first web application with ASP.NET Core and run
    it from Microsoft Azure.


    A very productive development team can build custom easy-to-maintain web applications
    with ASP.NET Core. In this book, you''ll learn how to get your first application
    running in minutes with the ASP.NET Core framework. With the open source licensing
    for ASP.NET Core, you can even enhance the framework in any way that your project
    needs, and you can contribute changes to the team that everyone can benefit.


    By the end of this 24-hour book, you will have created your own travel management
    application and deployed it to Azure using Azure App Service. You will learn how
    to use JavaScript frameworks like Angular 4 with ASP.NET Core in order to create
    more compelling and interactive applications. Along the way, you will learn many
    tips and tricks to help improve your development experience, whether you are working
    on a Mac, Linux, or Windows machine.


    # Who Should Read This Book


    This book is written for anyone who wants to build websites and applications easily,
    without having to reinvent the basic components of a website each time'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'we write a new application.


    If you know a little bit of C# and HTML, then this book will get you on your way
    with ASP.NET Core. Even if you don''t know much of the C# language, this book
    will make it easy for you to pick it up and be productive.


    The HTML, CSS, and JavaScript demonstrated in this book is elementary. It is intended
    to be approachable, not to show a beautiful user interface. The focus is on delivering
    value without making intimidating use of browser or web technologies that are
    not central to the ASP.NET Core development experience.


    # How This Book Is Organized


    ASP.NET Core is a framework with significant depth, and 24 hours is not enough
    time to learn every nuance of the technology. This book covers the basics as well
    as some intermediate topics to get you writing applications as quickly as possible.
    The framework features and knowledge you will learn in a 24-hour day with this
    book will be invaluable for your future development projects. The following breakdown
    contains the details of what you will learn in each of the hours:


    +   * In Hour 1, “Introducing ASP.NET Core,”you’ll learn about the history of
    this web framework and what makes it a significant player in the technical community.
    You’ll also learn about the sample project you will build throughout the book.


    +   * In Hour 2, “Setting Up Your Work Environment for ASP.NET Core,”you’ll start
    configuring your machine to be able to write ASP.NET Core code. You will learn
    how to choose between the various versions of Visual Studio and how you can use
    your text editor if you don''t want to use Visual Studio at all. You''ll also
    be introduced to the dotnet command-line tool.


    +   * In Hour 3, “Exploring the New Project Templates,”you will build your first
    website, using the templates that come with Visual Studio and the dotnet command-line
    tool. You will learn the file structure of an ASP.NET Core project and how to
    work with the templates.


    +   * In Hour 4, “Defining ASP.NET Core Configuration,”you will learn about the
    various project configuration options and how to automate tasks for an application’s
    build process. You’ll also be introduced to NuGet and how you can add features
    to your application from the free repository at NuGet.org.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '+   In Hour 5, “Configuring the Service with the Startup Class,” you’ll learn
    about the Startup class and how it controls the flow of requests from browsers
    into an application.


    +   In Hour 6, “Configuring Your Application,” your application will grow to start
    reading project configuration information from disk, environment variables, and
    secret data locations. You will also learn how ASP.NET Core manages the environment
    and how you can take advantage of keeping developer-facing features out of a production
    environment.


    +   In Hour 7, “Accessing Your Data with Entity Framework Core,” you’ll start
    to connect your application to the SQLite database. You’ll learn how to build
    a database using .NET code and manage the data in your database using Entity Framework
    Core.


    +   In Hour 8, “Introducing the MVC Architecture,” you will learn about the basic
    MVC concepts and structures that you will use throughout your application. This
    concept-focused hour will have you thinking about how to structure your code when
    writing.


    +   In Hour 9, “Building Your First Controller,” builds on the concepts in the
    previous hour and will help you start constructing code to present information
    to your users.


    +   In Hour 10, “Beginning MVC: Writing Your First View,” you’ll learn how to
    start formatting information in your application as HTML, the formatting language
    of the web.


    +   In Hour 11, “Scaffolding User Interfaces,” you’ll take a slight step back
    from Hour 10 to try out tools in Visual Studio that generate simple HTML formatting
    for you. You’ll learn how to take advantage of these starting points and build
    your application quickly.


    +   In Hour 12, “Writing Data from a Controller,” you’ll start putting together
    the pieces from Hour 7 together with the previous three hours and code that allows
    a browser to work with the content of your database.


    +   In Hour 13, “Writing Web API Methods,” you’ll write APIs for machines and
    other software to be able to interact with your application.


    +   In Hour 14, “Introducing Reusable User Interface Components,” you’ll look
    into simplifying some of the code that you have written to format the application
    using tag helpers and view components. You will learn how easy it is to reuse
    code that you have written throughout your application.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '+   In Hour 15, “npm and bower: Client-Side Package Managers,” you’ll step
    outside the ASP.NET Core ecosystem and learn how these community projects are
    enabled by ASP.NET Core and how you can consume the web components shared by their
    communities.


    +   In Hour 16, “Introducing Angular,” you’ll learn the Angular JavaScript framework
    and why it is so popular. You will work for the next few hours on Angular and
    experience what makes it so efficient and productive for developers.


    +   In Hour 17, “Connecting Angular to ASP.NET Core,” you’ll start using Angular
    to fetch and present data from your Travelz application. by the end of the hour,
    you will have a full Angular application that is able to read and write data using
    the API features in Hour 13.


    +   In Hour 18, “Routing Angular Requests Around ASP.NET Core,” you’ll start using
    the routing features of Angular and ASP.NET Core to control the web page addresses
    and navigation formats of the links in your application.


    +   In Hour 19, “Running Angular on the Server,” you’ll take what you learned
    about Angular in Hours 16, 17, and 18 and integrate it tightly with the ASP.NET
    Core project using the SpaServices of ASP.NET Core.


    +   In Hour 20, “Authenticating Your Users,” you’ll learn how to enable visitors
    to log in to your application and the various configurations you can apply to
    your store and manage user credentials.


    +   In Hour 21, “Granting Access to Users,” you’ll learn about protecting features
    and components of your application from unwanted user access. You’ll create security
    roles and policies that allow you to control who can access components of the
    application.


    +   In Hour 22, “Deploying to Production,” you’ll learn about using the dotnet
    publish command to deploy your application to Windows and Linux servers. You will
    also spend some time learning how easy it is to deploy to the Azure cloud service.


    +   In Hour 23, “Working with Docker Containers,” introduces the virtual container
    concept and how you can use this unit of delivery to make building and deploying
    your application simple.


    +   In Hour 24, “Looking to the Future and .NET Standard,” you’ll learn about
    the planned features of ASP.NET Core, where to keep up to date'
