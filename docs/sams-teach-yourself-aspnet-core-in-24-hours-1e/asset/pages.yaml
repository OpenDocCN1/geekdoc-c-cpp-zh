    # Q&A


    +   - Can I use async techniques similar to those demonstrated this hour with
    a database when writing to file storage?

    - Yes. Any I/O operation or call to a service outside the web process should be
    triggered and managed asynchronously.


    +   - Do I really need anti-forgery tokens on my web methods?

    - The anti-forgery tokens protect against cross-site scripting attacks and guarantee
    that a request originated from your server. That''s a pretty good reason to use
    them.


    +   - Does redirect after submit processing prevent "double-postback" to a page
    in my application? Can someone double-click a Submit button and cause the same
    action to occur twice?

    - No. Redirect after submit does not prevent double-postback interaction, but
    it does help prevent users from bookmarking a page that they shouldn''t be directly
    navigating to that contains the result of a save operation.


    +   - Do I need to use data annotations on my models?

    - No. You don''t need to use data annotations. You can write simple-then checks
    in your models to validate the contents of your models that are posted to your
    server. You could just use the IValidObject interface and implement all of your
    business logic checks there.


    +   - Does the CreditCard attribute really check for a valid credit card number?

    - There is an algorithm for a credit card number, and this attribute simply tests
    against that algorithm to ensure that it could be a valid number. You'
