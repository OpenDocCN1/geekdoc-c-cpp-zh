- img_proc: true
  md: 'available across platforms for use in fetching and managing packages of content
    to be consumed—typically by Node.js projects. The packages delivered by npm can
    deliver user interface frameworks, other command-line tools, or modules needed
    for building a Node.js application. When using npm with ASP.NET Core, you will
    make use of the first two areas of functionality.


    bower is a package manager that was originally written by some folks at Twitter
    as a way to deliver interface components easily from their GitHub repositories.
    It has since expanded and taken on life of its own as a way to deliver and manage
    user interface frameworks from Git repositories. Unlike npm, with bower there
    is no utility model and there are no scripting capabilities that allow you to
    enhance the behavior of the bower command-line tool.


    # Doesn''t Microsoft Provide a Client-Side Framework and Tools?


    Alas, unlike previous versions of ASP.NET, where Microsoft managed a library of
    controls to give some initial and limited enhanced features for web development,
    Microsoft has opted out of creating and maintaining client-side tools for this
    edition of ASP.NET. In addition, Microsoft is no longer promoting the use of the
    NuGet for delivering these packages for use with ASP.NET Core projects. There
    are three primary reasons for this decision:


    +   * JavaScript and CSS libraries in NuGet were never maintained by the open
    source projects that owned them. Instead, packages like jQuery in NuGet were maintained
    by Microsoft employees and were guaranteed to receive updates at exactly the same
    time that the owners of the project would publish updates.


    +   * There are thousands of libraries and packages available that the web development
    ecosystem outside .NET already uses and loves. If you really like using jQuery
    UI with your project, Microsoft thought it would be best to enable you to use
    the libraries with the library maintainers want you to use with their product.


    +   * By integrating npm and bower, Microsoft brings ASP.NET Core into parity
    with other server-side frameworks, like Ruby on Rails, Node.js, and PHP, that
    already integrate nicely with these tools to allow developers to work easily with
    their output.


    # Do I Really Need to Use npm and bower with My Project?


    No, you don''t need to use these tools with your ASP.NET Core project.'
