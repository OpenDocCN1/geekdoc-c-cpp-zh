  md: "defined in the project to apply custom configurations of the service in a Startup\
    \ class. Your application begins with a static void Main method that by default\
    \ contains the code shown in Listing 5.1\n\n# LISTING 5.1 Main Method that Starts\
    \ the Application\n\nClick here to view code image\n\n```\npublic static void\
    \ Main(string[] args)\n{\n    var host = new WebHostBuilder()\n    UseKestrel()\n\
    \    UseContentRoot(Directory.GetCurrentDirectory())\n    UseIISIntegration()\n\
    \    UseStartup<Startup>()\n    Build();\n\n    host.Run();\n}\n```\n\nThis method\
    \ creates a web host and adds the Kestrel web server to it on line 4. It directs\
    \ the web host to use the current directory as the root of the content to deliver.\
    \ On line 6, it instructs the application to use the Windows Internet Information\
    \ Server (IIS) web server if it is available. On systems IIS is not available,\
    \ this method does nothing and fails silently. The next line instructs ASP.NET\
    \ to configure the application with the contents of the Startup class.\n\nThe\
    \ Startup class has a specific signature that the ASP.NET host processes are looking\
