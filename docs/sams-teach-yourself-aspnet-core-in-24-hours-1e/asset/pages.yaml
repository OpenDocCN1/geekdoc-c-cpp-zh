    # Getting Started with Server-Side Configuration


    With prior versions of ASP.NET, the content that was delivered to a web application
    visitor was mixed in the project source code. There was no clear place to point
    to and see the separation between the code that would execute on the server and
    the code that would be delivered to the web browser for execution there. Developers
    would go to lengths to create scripts folders or classes modules that would contain
    more server-side logic as possible. Since the release of ASP.NET Core, the line
    between server-executed and client-side code has been very clear.


    The epicenter of a server-side project is your project file, ending with a .csproj
    extension. This file contains all the information necessary to direct the .NET
    compiler (code-named Roslyn) to build the binary executable files from C# that
    will run on a web server and deliver content to your web visitors. The ASP.NET
    team has enhanced the MSBuild tool to allow a dramatic simplification in the project
    file format while still supporting the entire .NET ecosystem of projects.


    # TIP


    # The Roslyn Compiler


    The Roslyn compiler is Microsoft''s next-generation set of compilers for the .NET
    platform. This compiler allows for new versions of the programming languages and
    ultra-fast in-memory operations against code. A number of extensions and updates
    have been made for and to this version of Visual Studio with this compiler. The
    source code of the Roslyn compiler was made open source and published to GitHub
    at the Microsoft Build conference in 2014; it can be found at https://github.com/dotnet/roslyn.
    New features that depend on Roslyn include the lightbulb analyzers that appear
    on the left side of the code window using Visual Studio 2015 and the dotnet build
    command.


    If you started with a template, as demonstrated in Hour 3, “Exploring the New
    Project Templates,” a sample project file is generated for you. For your sample
    project, you can start writing an empty project from scratch so that you have
    the same contents no matter which you are starting an ASP.NET Core application,
    and we can discuss each element of the project as it is constructed. This book
    walks through setting up the sample project with Visual Studio,'
