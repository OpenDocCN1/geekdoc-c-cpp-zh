    # Q&A


    +   Q. Do I have to use npm and bower with my project?


    +   A. You are not required to use these tools. Visual Studio and ASP.NET simply
    make it easier to operate with them. You are welcome to use whatever method you
    would like to add UI frameworks and tools to your application.


    +   Q. Can I use NuGet to get jQuery, Bootstrap, and other frameworks into my
    ASP.NET application?


    +   A. In older versions of ASP.NET, using NuGet was the preferred method to load
    these frameworks. It was more difficult to use npm and bower with older versions
    of ASP.NET. NuGet does not install these user interface frameworks for ASP.NET
    projects.


    +   Q. There is a new JavaScript tool called <foo> that I want to use with Visual
    Studio instead of npm and bower. Is there a way I can use it?


    +   A. Visual Studio and the JavaScript communities are very active in developing
    new tools and techniques to make web development easier. Check the Visual Studio
    Marketplace at https://marketplace.visualstudio.com to see if someone has written
    an extension that supports the tool you want to use. There is a high likelihood
