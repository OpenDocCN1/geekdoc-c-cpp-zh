    The environment tag helper does check on a name of the current development environment
    (Development, Staging, or Production), and if the current environment matches
    one of the values in the names attribute, then the content is written into the
    resultant page; the environment tag never appears in the HTML transmitted to the
    browser. The names attribute can contain one environment or several attributes,
    separated by commas.


    Listing 14.2 shows another tag helper: the anchor helper.


