    You can now use this configuration to instruct Docker to build an image of your
    application hosted inside it. When that container runs, it will start the server
    and listen on port 80 for incoming requests. You can build the image with the
    following command from the root folder of your application:


    Click here to view code image


    ```

    docker build -t astravlerz:i -t astravlerz:latest

    ```


    This command builds a new image based on the configuration in the current folder.
    It assigns two tags or names to the image: astravlerz:i and astravlerz:latest.
    The text after the colon (:) is a version number that you can use when running
    your application. latest is a convenience indicator that allows you to run that
    version of the container if you do not specify a version number when referencing
    the container.


    You can start a new instance of your web application container with the following
    command:


    Click here to view code image


    ```

    docker run -d -p 80:80 --name web astravlerz

    ```


    -d argument indicates that the container should run in the background and not
    stop unless it is explicitly halted. The -p 80:80 argument instructs Docker to
    route requests for the host machine''s network port 80 to the container''s port
    80. The format of the port mapping is the host port followed by the container
    port. You could map port 5000 on your workstation to port 80 of the container
    by using -p 5000:80 argument.


    --name web argument names this container web. Finally, astravlerz is the name
