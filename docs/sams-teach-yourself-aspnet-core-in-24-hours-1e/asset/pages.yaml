  md: '# HOUR 8

    Introducing the MVC Architecture


    What You''ll Learn in This Hour:


    +   - Concepts of the MVC architecture

    - Advantages and disadvantages of MVC

    - Where do ViewModel and ModelBinding fit in?


    We''re going to go back to some theory in this hour and explore the MVC architecture
    provided in ASP.NET. It''s more than just three letters; the Model-View-Controller
    architecture provides significant flexibility and design capabilities—but at a
    bit of cost. We''ll explore these topics in this hour and even cover some of the
    MVC-related buzzwords you may have heard, like ViewModel and ModelBinding.


    > NOTE

    MVC Isn''t Just MVC


    The ASP.NET MVC framework doesn''t just support the MVC architecture. It now has
    the capability to serve the same Web API architecture as well. We''ll explore
    more about how Web API fits into the MVC framework in Hour 13, "Writing Web API
    Methods."


    # Defining the MVC Architecture


    Like many things in technology today, the MVC architecture is defined with a TLA—a
    three-letter acronym. MVC stands for Model-View-Controller, the three'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'primary components of the architecture that are used to build applications.
    This architecture is widely used and praised for providing a clear separation
    of various concerns and capabilities of applications. These three parts can be
    further defined as follows:


    +   * Model—This is the long-term memory of the application. Your business objects
    and their state are represented as models in the framework. These reference other
    models only if they are anything more than primitive types.


    +   * View—The views are the dumbest part of the application. They know nothing
    about your business logic, but they know how to make your models look good and
    how to present them to the user. They are the user interface for your models and
    know very little about server-side programming.


    +   * Controller—This is the mad scientist of your application, with the knowledge
    to use models and views together. The controller knows how to receive user input,
    how to apply that input to a model, and how to deliver an appropriate view to
    represent the impact of that input.


    Figure 8.1 puts these three components together so that you can see their interactions.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_142_0.png)


    FIGURE 8.1

    Interactions of the model, the view, and the controller on a web server.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'The controller is activated by the web application to handle input from browsers
    and then translates that request into an interaction with a model and applies
    a view to that model. The result of the view applied to the model is then transmitted
    back to the web browser. In other words, models are the bytes stored in a data
    repository, and the view translates those bytes into (in case) HTML representing
    that model for a web browser to be display.


    With ASP.Net Core, the concepts of model, view, and controller are physically
    separated into folders with names appropriate for each architecture object. Figure
    8.2 shows what a basic ASP.Net Core project file structure looks like.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_143_0.png)


    # Figure 8.2


    A basic ASP.Net Core application file layout with Models, Views, and Controllers
    folders.


    The following sections dig a little deeper into each of these three components
    to help you understand their purpose.


    # Defining a Model


    The model objects in an application typically have no business logic built into
    them and are sometimes referred to as POCOs, or “plain old class objects.” The
    objects defined in Hour 7, “Accessing Your Data with Entity Framework Core,” with
    Entity Framework—the Trip and TripSegment objects—are all models'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'with very simple properties that provide for the storage of related data. The
    relationships between these objects are important because those relationships
    are part of how the data is stored and later presented to the web browser.


    The model does not refer to a controller or a view in any way. You can have multiple
    controllers work with the same model objects, and you can have multiple views
    that present models for different user experiences.


    A model stores and handles some validation capabilities for itself so that it
    can alert the controller and consequently the view when the model is in an invalid
    state. In the Entity Framework samples in Hour 7, you added attributes to the
    classes that dictated the size of the properties, the restrictions on the data
    that could be accepted into those properties, and error messages to display if
    the properties are in invalid states.


    The classes in your application (in the .NET implementation of MVC) don’t represent
    any information about how to interact with the repository that contains them.
    How do you retrieve information about trips? Where do you process methods to update
    and add new trip information into your application? These tasks are typically
    handled in the controller but access a fourth component of this architecture is
    very important to the model objects—the repository.


    A repository is typically written to do the simple CRUD (create, read, update,
    and delete) working with the backing datastore. In the case of Entity Framework,
    the repository is the own object, and you can use it from any controller to get
    the model objects you need and interact with their representation in the datastore.


    # Defining Views


    The views are the Derrick Zoolander of this operation: They look amazing but know
    only one thing: how to make your application look good. They do not change the
    model in any way, nor do they provide any extra value to the browser that was
    not delivered to them from the controller. The views know what the model object
    is but no reference to a controller.


    Business logic, data access capabilities, and decision-making code should not
    be written into the source of the view objects. The most processing that you want
    to do in a view is if-then or for-loop statements. If you need more logic than
    this, you have misplaced capabilities between your view and your controller. This
    is a bit counterintuitive to long-time ASP.NET developers who used the ASP.NET
    Web Forms framework to build user interfaces.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'In the Web Forms framework, you could use blocks of logic called web controls
    that could be placed directly into the HTML that you wanted to deliver to the
    browser. These controls could have data access logic in them or data presentation
    code or pretty any code that you wanted executed on the server. This had the side
    effect of making these controls very hard to test and making it very difficult
    to optimize in them.


    The views of MVC should be "skimmable." That is, you should be able to see another
    view with the same knowledge of the model to get a similar output for the browser.
    The location of user-interface components in the resultant HTML and the logic
    in the view should have no effect on the model being presented.


    # Defining Controllers


    The controller is where the model and the view are put together. The controller
    handles user interactions and determines how to get the model the user is requesting.
    In addition, it decides which view the user needs and applies that view to the
    model that was requested.


    In ASP.NET, controllers are a single class that represents a series of related
    actions around an area of functionality. The ASP.NET framework provides the initial
    handling of user input, such as the URL navigated to in your application, and
    routes input to an appropriate controller to further inspect that input for processing.
    This routing capability could be considered a super-controller because it controls
    the controllers and how they interact with the browser.


    You''ll write your first controller in Hour 9, "Building Your First Controller,"
    where you will start presenting a home page that shows the list of trips known
    to the application.


    # Advantages and Disadvantages of MVC


    There are a significant number of advantages to using the MVC architecture that
    you should be aware of before you start to write in Hour 9:


    +   - The MVC pattern has been long established and practiced in other environments.
    .NET and the web are not the first to use this pattern, and it has a proven track
    record of success in major projects.


    +   - There is a clear separation of concerns. The user interface is clearly defined
    and handled in view objects that can be changed without impacting the source code
    that defines the model or the controller. In addition, the logic to retrieve models
    and handle user input can be changed without'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'impacting the views. This also means that you could separate developers who
    are responsible for each of these objects: user interface designers to manage
    the views, database developers to manage the models, and server-side developers
    responsible for the controllers.


    +   Because each of the three components of MVC can be isolated, it is easy to
    write unit tests to verify that a controller handles user input properly or processes
    business logic accurately. You can easily test a view by using a static model
    to it and verifying that it does not violate any user interface concerns.


    The disadvantages are heavily outnumbered by the advantages, but you should know
    about them as well:


    +   Knowledge of multiple frameworks and technologies is required. You need to
    know how to write and work with view presentation technologies as well as the
    database if you are on a small team.


    +   Code can be spread across many objects to present a single screen. Some developers
    decay this as spaghetti code, or untidy code that is very difficult to navigate
    and maintain.


    +   Data access strategies are inefficient. Modern user interfaces have a very
    data-heavy presentation and interaction with datastores frequently with strategies
    like AJAX to get the perception of high performance. This interaction is difficult
    to do, and you will see how you can accomplish this in Hour 17, “Connecting Angular
    to ASP.NET Core."


    # What Is a ViewModel?


    A lot of buzzwords float around software architecture, and MVC has its share.
    There are variants of MVC in use, and there are implementation details in use
    that sound like a new form of architecture that works with MVC.


    A ViewModel in the MVC architecture is a simplified version of a model that has
    been reduced to the items that the view needs to present. Because a model has
    no knowledge of what a view can do, a ViewModel object is established. Some developers
    add validation logic to a ViewModel so that this processing can occur outside
    of the POCO objects. This also means that you can grab just those parts that you
    need from several models and deliver a unified data object that pulls together
    a simple concept.


    # What Is ModelBinding?'
