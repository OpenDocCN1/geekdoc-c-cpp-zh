    # Speeding Up Data Access with Asynchronous Techniques


    C# 5 introduced the ability to mark methods as asynchronous and gave developers
    the ability to avoid managing threads, parallel executions, and other multithreaded
    concerns by hand. The async and await keywords that were introduced in C# 5, these
    concerns were shifted to the just-in-time compiler, which now emits the proper
    handling to manage the multithreaded concerns in an application.


    If you look back at the code generated for the Create method, as shown in Listing
    12.4, you will notice the method signature:


    Click here to view code image


    ```

    public async Task<IActionResult> Create(Bind[...] Trip trip

    ```


    The use of the async keyword here indicates that this can run asynchronously,
    and parts of it may later operate outside the thread that executes it. The Task
    object is a generic object that manages the state of the asynchronous operation.
    The IActionResult generic parameter (inside the angle brackets) defines the output
    type that will be returned when the operation completed.


    However, the introduction of the Task return type and async keyword also raises
    few concerns for the content of the method:


    +   You should return an object of the type generically referred to in the task—in
    this case, IActionResult. The Task return type will automatically be created for
    you and wrap the object that you are returning.


    +   Other methods marked with async may be called with await keyword. The use
    of this keyword forces the method to release the current thread while the method
    used with the await method is executing. This could occur on a different thread,
    but it will never block the current thread.'
