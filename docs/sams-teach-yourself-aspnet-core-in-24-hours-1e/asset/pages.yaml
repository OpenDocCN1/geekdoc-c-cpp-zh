    # ### Introducing the hot new .NET Command-Line Tool


    Throughout the history of .NET development, there has been only one way to develop
    applications: Use Visual Studio on Windows. What if you don''t want to use Visual
    Studio or Visual Studio for Mac? Never fear, Microsoft has you covered; in environments
    without Visual Studio, you can use the dotnet commandline tool to create, configure,
    and update NuGet packages and run your project. If you are a developer in Mac
    and Linux environments, you probably already know and love other command-line
    compilers, like gcc, javac, ruby, rake, npm, and node. You can now add dotnet
    to that list.

    The dotnet command-line tool is present and runs on all three platforms, even
    on Windows with Visual Studio. This is the really cool part: Visual Studio 2015
    (and later Visual Studio versions), Visual Studio for Mac, and Visual Studio Code
    simply automate calls into the dotnet command-line tool. There is no “backdoor
    functionality” with Visual Studio that the developers on Linux and Mac will not
    have. Parity between the development environments is a valuable addition that
    Microsoft has delivered as it has given up having a dominating position on Windows
    only.


    The following sections take a closer look at the functionality of the commands
    supports by the dotnet tool.'
