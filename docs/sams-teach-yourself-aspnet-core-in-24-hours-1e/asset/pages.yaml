  md: '# Summary


    This hour you have configured routing—the ability to define what functionality
    is triggered on each request to your application—for both your Angular application
    and your ASP.NET Core application. You have completed the final integration of
    those two applications into one mega-application that looks nice, feels very responsive,
    is easy to maintain, and was fun to develop.


    # Q&A


    +   Q. Do I need to configure routes for static content?

    A. No. Routing is configured for functionality that should be executed by the
    server (ASP.NET Core) or on the client (Angular).


    +   Q. Can I use ASP.NET Core routing to validate URL parameters?

    A. No. You should add some middleware at the top of the ASP.NET Core pipeline
    to inspect whether the 404 error is being returned for something that is not static
    content and determine which method to execute and perform validation inside that
    method.


    +   Q. Can I have ASP.NET Core instead of Angular handle the HTTP 404 Page Not
    Found errors?

    A Yes. It''s possible to add some middleware at the top of the ASP.NET Core HTTP
    pipeline to inspect whether the 404 error is being returned for something that
    is not static content and determine whether it should be routed to Angular or
    use the server-side error handler.


    +   Q. Can I still use the Angular CLI server to run my Angular application while
    developing?

    A. Yes. You can continue to run in this manner by publishing to index.html as
    you did previously, but you will lose the frame of the ASP.NET Core application.


    +   Q. I''ve heard of a concept called Angular Universal that executes JavaScript
    code on the server. Can that be used here?

    A. Spoiler alert: You''re going to learn about this in Hour 19, “Running Angular
    on the Server."


