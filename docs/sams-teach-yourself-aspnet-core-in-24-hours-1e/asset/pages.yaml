  md: '# # HOUR 21

    Granting Access to Users


    What You''ll Learn in This Hour:


    +   - How to configure authorization for your application

    - How to construct authorization policies

    - How to write more complex custom authorization requirements


    Once you have authenticated users to your application, you know who they are.
    To complete the picture of securing your application from unauthorized users,
    you need to write some code to verify that your users have been granted access.
    In ASP.NET Core, you can configure authorization policies to enforce requirements
    that users must pass in order to use your application''s features. ASP.NET Core
    gives you a very flexible authorization system utilizing users, roles, claims,
    and policies. In this hour, let''s learn about how to use these features together
    to secure our application.


    # Defining Roles, Claims, and Policies


    When it comes to qualifying users for access to features, there are three security
    capabilities that you need to understand before proceeding to writing code: roles,
    policies, and claims. You can use these three capabilities to group and qualify
    users to be able to access features. In this hour you''ll look at each of these
    capabilities to ensure that you understand the purpose of each one.


    You may be familiar with the concept of a role or a user role—a collection of
    users that all have the same access capabilities to features in the system. In
    some applications or operating systems, users can be assigned to more than one
    role.'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'In the case of ASP.NET Core, users are allowed to be assigned to multiple roles.

    A security claim is a property of the user that can be used to help judge whether
    that user is allowed access to a feature. On a web application for a liquor manufacturer,
    for example, the age of the visitor is an important security claim as the site
    is required to restrict access based on age (21 in the United States).

    You as a system designer can determine what information about a user is qualified
    as a claim.


    A security policy is a collection of information used to qualify access to a feature.
    In the example of a liquor manufacturer, the policy might be called “Americans
    21 and Older,” and it might verify the residence and age of the visitor. Simpler
    policies are possible, too, like “Administrators Only” to check the roles assigned
    to a user and verify that the user is assigned the Administrator role. In addition
    to a policy verifying roles and claims for a user, they can also execute arbitrary
    code that is defined as part of a requirement class. We’ll look at more complex
    requirements later in this hour.


    The relationship between users, roles, claims, and requirements is illustrated
    in figure 21.1.


    | Policy | |

    |---|---|---|

    | Claims | Roles | Requirements |

    | Users | |

    | Claims | Roles |


    FIGURE 21.1 Relationship between users, roles, claims, and requirements.


