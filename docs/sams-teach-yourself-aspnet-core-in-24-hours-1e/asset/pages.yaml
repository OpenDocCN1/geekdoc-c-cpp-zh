    # Summary


    In this hour, you have learned how to add authorization requirements to components
    of your ASP.NET Core application. You have created policies, defined claims, checked
    for the presence of security roles, and even written your own custom security
    requirements.


    # Q&A


    +   Q. This hour shows how to use the RequiresAssertion policy allows to logically
    OR together several checks. Is there an easy way to logically AND these requirements?


    +   A. Yes. You can simply chain your checks together like this:

    policy.RequiresRole("Role1").RequiresRole("Role2").RequiresClaim(


    +   Q. I''m using Azure Active Directory to manage users. Will it check the claims
    I''ve added to these users?


    +   A. Yes! If you are sharing claims with Azure Active Directory, you can write
    authorization policies against those claims.


    +   Q. Is there any administrative interface I can use to manage my users?


    +   A. No such interface comes as part of ASP.NET Core, but you can use a third-party
    solution like IdentityServer to manage users.


    +   Q. If I create a Requirement class, can I use constructor dependency injection
    to inject other services?


    +   A. The policy is created as part of the ConfigureServices method and is not
    created using the dependency injection container. You should be able to pass in
    concrete references to anything you need as the services would be configured as
    part of that method.


