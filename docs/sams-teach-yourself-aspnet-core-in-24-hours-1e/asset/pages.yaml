  md: '# HOUR 19

    Running Angular on the Server


    # What You’ll Learn in This Hour:


    +   - What is Angular Universal?

    - How to add more templates to the .NET SDK

    - How SpaServices works


    JavaScript-rendered web pages are amazing. Interactive and very responsive, these
    sites are just as good as applications written for native platforms. However,
    not all browsers see them the same way. In fact, search engines and embedded references
    from sites like Twitter and Facebook don’t see rendered JavaScript content at
    all. How do you address that? You render JavaScript as HTML on the server.


    # Introducing Angular Universal


    JavaScript is typically executed in the browser after it has been delivered from
    a server. To Node.js, you can now consider running JavaScript code in lots of
    other places: the command line, in desktop applications, and on the server. The
    trick is always the same: Use JavaScript to access some APIs exposed by the environment
    through a platform-specific framework and interact with them using standard JavaScript
    constructs. But what if you could use JavaScript on the server to render code
    that is standard HTML and JavaScript that the browser could pick up and start
    presenting immediately, without having to interpret and execute any initial code?


    That is exactly what Angular Universal does. It is a server-side architecture'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'specification for working with Angular code. It has three distinct advantages:


    +   Better perceived performance—Because the output of Angular on the server is
    rendered HTML and JavaScript, there is no waiting for a server to paint the first
    Angular component.


    +   Optimization for search engines—Rendered HTML can be consumed easily by every
    search engine, whereas JavaScript execution and interpretation are not handled
    well by search engines other than Google or Bing.


    +   Working site previews—Social media services like Twitter and Facebook include
    a default screenshot of your site when someone references it in a tweet or post.
    The rendered HTML delivered by an Angular Universal application guarantees that
    there is content for these services to take a screenshot without executing code
    in the browser.


    Many different server-side programming languages and frameworks deliver the Angular
    Universal architecture and promise, but this hour focuses on the ASP.NET Core
    SpaServices templates.


    # Acquiring SpaServices


    For ASP.NET Core, the general feature of server-side JavaScript frameworks are
    included in SpaServices. These services support the Angular, Aurelia, and React
    JavaScript frameworks so that you can get the same sort of server-side interaction
    with your JavaScript code and also write C# and ASP.NET Core features to run on
    the server.


    You can add the SpaServices templates to your ASP.NET Core development environment
    by executing the following code at the command line:


    Click here to view code image


    ```

    dotnet new --install Microsoft.AspNetCore.SpaTemplates::*

    ```


    This command downloads the latest version of SpaTemplates from NuGet.org, the
    public repository for .NET software. SpaTemplates installs quickly on your workstation,
    and you can find the new templates available when you execute dotnet new without
    specifying a template name. Figure 19.1 shows the results you should see after
    installing these templates.'
