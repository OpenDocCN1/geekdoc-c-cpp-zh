  md: "templates that go along with it are denoted with the extension .cshtml. This\
    \ extension suggests how you will write your templates: by using C# mixed with\
    \ HTML. Unlike other template frameworks, the Razor markup only denotes the start\
    \ of inline C#, and the engine knows when it reached the end of a C# statement.\
    \ All C# code starts with an @ symbol and may optionally be wrapped in curly braces\
    \ {}. It's really simple, and the Visual Studio 2017 and Visual Studio Code editors\
    \ provide a lot of context in their highlighting of code to what is HTML and what\
    \ is C#. Let's take a look at a few examples, starting with some inline C# in\
    \ Listing 10.1.\n\n# LISTING 10.1 Inline C Mixed with HTML in a Razor Template\n\
    \n![](img/0cfea9d2834042a1ec21b82c3a153628_164_0.png)\n\n```\n<footer>&copy; @DateTime.Now.Year\
    \ - All rights reserved</footer>\n```\n\nThis very simple example shows an HTML\
    \ tag: the footer with a copyright notice embedded. The copyright entity is embedded\
    \ with the &copy; code, and then the C# code starts. DateTime.Now.Year is a C#\
    \ statement to calculate the year of the current date. Notice that there is no\
    \ command to write into the flow of the HTML, nor is there a semicolon at the\
    \ end of the value. The code just stands alone, and the value that it evaluates\
    \ to is merged into the HTML at that point. The HTML that would be delivered to\
    \ the browser in the year 2018 would look as follows:\n\n![](img/0cfea9d2834042a1ec21b82c3a153628_164_1.png)\n\
    \n```\n<footer>&copy; 2018 - All rights reserved</footer>\n```\n\nThis is easy\
    \ to understand, but now look at the more complex example in Listing 10.2.\n\n\
    # LISTING 10.2 A for Loop Mixing C# with HTML in a Razor Template\n\n![](img/0cfea9d2834042a1ec21b82c3a153628_164_2.png)\n\
    \n```\n<table>\n@for (var i=0; i<5; i++) {\n  <tr><td>@i</td></tr>\n}\n</table>\n\
    ```"
