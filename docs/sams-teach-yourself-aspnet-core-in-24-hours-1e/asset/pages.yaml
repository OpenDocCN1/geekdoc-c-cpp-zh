    # Fundamentals of .NET Application Structure


    Before we get to configuring the application, let''s take a quick look at the
    fundamentals of how a .NET application is structured. A .NET application''s architecture
    is separated into four discrete layers, as shown in Figure 4.1.


    ![](img/0cfea9d2834042a1ec21b82c3a153628_74_0.png)


    FIGURE 4.1

    ASP.NET Core application architecture.


    At the lowest level, a .NET application has a runtime that is specific to the
    operating system it runs on. In previous versions of .NET, the runtime was installed
    with Windows or from Windows Update, and .NET developers were able to rely on
    a runtime that is already available on a Windows machine they were targeting.
    Starting with .NET Core, you can deploy a version of the runtime with your application
    or use the runtime that is already installed on a server. The runtime includes
    low-level things like the just-in-time (JIT) compiler, native interop instructions
    for various operating systems, and the garbage collector. Building on top of the
    runtime are the .NET frameworks. These frameworks'
