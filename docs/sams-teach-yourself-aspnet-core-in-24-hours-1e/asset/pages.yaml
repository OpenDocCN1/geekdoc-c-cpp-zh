    1.1.2\" />\n  <PackageReference Include=\"Microsoft.AspNetCore.Mvc\" Version=\"\
    1.1.3\" />\n  <PackageReference Include=\"Microsoft.AspNetCore.Mvc.Formatters.Xml\"\
    \ Version=\"1.1.3\" />\n</ItemGroup>\n```\n\nNext, you need to configure the MVC\
    \ application to use the XML formatting. You can modify the call to UseMvc in\
    \ the Startup class's ConfigureServices method to add this feature, as shown in\
    \ [Listing 13.7](#).\n\n# LISTING 13.7 Configuring XML Formatters in Startup.cs\n\
    \n[Click here to view code image](#)\n\n```\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    services.AddMvc().AddXmlSerializerFormatters();\n}\n```\n\n\
    As you can see, this is a simple change: You just add the AddXmlSerializerFormatters()\
    \ method call, which configures the API endpoint to understand the Accept: text/xml\
    \ header and transform your output content to be in XML format. It also handles\
    \ the Accept: application/xml header and behaves identically. Using PostMan to\
    \ get"
