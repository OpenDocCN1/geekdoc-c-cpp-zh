    # Installing Docker


    The dominant container platform in the industry today is the open source and free
    Docker platform. On Windows 7 and later, you can install Docker Community Edition
    easily from www.docker.com. If you are using Windows 10, you have the option of
    hosting either Windows or Linux containers. All other Windows installs support
    only Linux containers. By default, after you install Docker for Windows, it hosts
    Linux containers. Docker for Windows is limited in that it hosts only Windows
    or Linux containers—not both at the same time. If you need to use both Windows
    and Linux containers, you need to use the Docker for Windows application to change
    back and forth between the operating systems.


    You can install Docker on a Mac by navigating to the Docker Store at store.docker.com
    and installing the Docker Community Edition for Mac. Once it is installed, you
    will be able to run and manage Linux-based containers.


    On Linux machines, you can install Docker a number of different ways. The Docker
    Store hosts installs for the most common Linux distributions, but it''s even easier
    to install from the command line on Ubuntu. You can download, install, and run
    the Docker engine with the following simple commands:


    Click here to view code image


    ```

    sudo apt-get update

    sudo apt-get install docker-engine

    sudo service docker start

    ```


