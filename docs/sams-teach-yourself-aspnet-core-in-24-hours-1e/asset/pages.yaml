    \ and has provided a dependency injection container framework.\n\nThe dependency\
    \ injection container is a service class within an application that knows how\
    \ to construct and provide instances of classes to objects that may be requesting\
    \ access to other objects through constructor parameters or properties. In the\
    \ case of ASP.NET, the container service is used with every object throughout\
    \ the ASP.NET framework, and you simply need to expose a constructor parameter\
    \ of the type that you desire. ASP.NET provides an appropriate matching instance\
    \ as your object is being created. This brings us back to the sample code for\
    \ the Configure method.\n\nIn the template project in Hour 3, the Configure method\
    \ accepts an IApplicationBuilder parameter. This is an interface that the ASP.NET\
    \ Framework creates and makes available for other classes to work through the\
    \ dependency injection container. When you add this input parameter to the Configure\
    \ method, the ASP.NET container will inject an appropriate IApplicationBuilder\
    \ object, and the Configure method can work on building out the configuration\
    \ for the application with that object.\n\nYou can start using the StaticFiles\
    \ dependencies from Hour 4. You can use the contents of this package to configure\
