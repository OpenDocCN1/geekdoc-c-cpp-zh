  md: '# Future Updates for ASP.NET Core


    The future is very bright for ASP.NET Core, as more features are constantly being
    developed for the World Wide Web as a whole and the Microsoft team is engaged
    to deliver framework features to support development to accommodate those new
    features. You can always find the ASP.NET Core team''s current roadmap on its
    GitHub repository, https://github.com/aspnet/home/wiki/roadmap. The following
    are some of the upcoming features built:


    +   - Simplified start and reduced configuration for the common scenarios with
    a DefaultWebBuilder construct that eliminates most of the configuration in Program.cs

    - Simplified reference of all ASP.NET Core packages, allowing you to reference
    a Single package to get all the Microsoft-supported packages

    - Simplified use of ViewComponents that you can be referenced as though they were
    helpers

    - A new UI paradigm called Razor Pages that allows you to write Razor templates
    without the need for entire MVC architecture

    - An improved publish process that excludes from the publish destination packages
    that are not used in your application

    - Tight integration with Azure Application Insights so that you can monitor your
    application''s processor use, memory usage, and logs easily when you are running
    on Azure

    - Support for the SignalR framework so that you can push content to visitors of
    your application using WebSocket protocols


    # Staying Connected with the ASP.NET Core Community


    The ASP.NET Core community is a living community that is constantly growing and
    changing. You can observe the speed and growth of projects by visiting https://github.com/aspnet/home.
    From this repository, you can jump off to any of the child ASP.NET Core projects
    on GitHub. The team also provides links to preview versions of the framework that
    you can download and test on your workstation if you are interested in trying
    the “bleeding edge” features. You can also find the source and discussion for
    .NET Core on GitHub, at https://github.com/dotnet.'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'Microsoft provides a vast collection of documents for ASP.NET Core and other
    development technologies at https://docs.microsoft.com. The documentation is live
    as well, meaning that you can submit changes to those documents if you think they
    could be improved. If you submit updates and the team accepts them, you will have
    your name and profile picture listed as a contributor to the official documentation.


    As the frameworks grow and change, the .NET Framework makes announcements about
    Visual Studio, and ASP.NET on these blogs:


    +   - **Visual Studio blog:** https://blogs.msdn.microsoft.com/visualstudio

    - **NET blog:** https://blogs.msdn.microsoft.com/dotnet

    - **ASP.NET blog:** https://blogs.msdn.microsoft.com/webdev


    Finally, the ASP.NET Core program managers are running their project using Agile
    techniques. This means developers are using the framework as stakeholders, and
    stakeholders are entitled to participate in startup meetings. The ASP.NET Core
    team hosts a weekly startup as a streaming video, typically on Tuesdays, at https://live.asp.net.
    You can find a complete history of every video startup on that site.


    # Summary


    You have many options for enhancing your applications further by building libraries
    with .NET Standard that will then be “future-proofed” and can be used by any.
    .NET Framework, .NET Core, or Xamarin project in the future. ASP.NET Core continues
    to evolve, and there are lots of ways for you to engage the ASP.NET Core team
    to learn more about the present state as well as the future of the product. The
    team welcomes feedback on its blogs and during its startup.


    # Q&A


    +   - **Do I need to build class libraries with .NET Standard, or can I still
    use.NET Framework 4.6+ or .NET Core to build libraries?**


    +   - NET Standard is another option for building reusable libraries. You are
    welcome to use any framework you wish to build your project, but by using .NET
    Standard, you get reuse across multiple .NET Framework types.'
  merge: -1
  pgno: 405
- img_proc: true
  md: 'Q. I have an existing library written for .NET Framework 2.0. Can I use that
    in .NET Standard?


    A. The upcoming .NET Core 2.0 framework and .NET Standard 2.0 specification provide
    for a compatibility feature that will allow all .NET Framework-managed code to
    work under the .NET Standard 2.0 capabilities. The compatibility feature will
    do its best to match your library to the appropriate APIs of .NET Core 2.0.


    Q. Can I package and deploy my .NET Standard project as a NuGet package?


    A. Yes! Using NuGet packages is the preferred way to deliver this functionality,
    and you can easily generate a package by using the dotnet pack command.


    Q. I think I found a bug in .NET Standard/.NET Core/ASP.NET Core works. How do
    I report that to Microsoft?


    A. For these open source frameworks and tools, you should identify the appropriate
    repository on GitHub under either aspnet or dotnet and use the Issues tab to report
    your problem. The engineers working on the project will review and respond to
    your issue.


    Q. I have an idea for a future ASP.NET Core feature. How do I suggest it and start
    building it?


    A. It''s great that you have a new feature idea. Open an issue in the appropriate
    repository on GitHub under either aspnet or dotnet and use the Issues tab to make
    clear that you are suggesting a new feature. After you suggest the feature, the
    team will triage your proposal, and you can then start working on it by cloning
    the source code and making changes. You should submit a pull-request that the
    Microsoft team will review whether to accept your change.


    # Workshop


    The workshop contains quiz questions and exercises to help you solidify your understanding
    of the material covered. Try to answer all questions before looking at the “Answers”
    that follow.


    # Quiz'
  merge: -1
  pgno: 406
- img_proc: true
  md: '+   1. What type of projects can you build that target .NET Standard?


    +   2. What is the minimum .NET Standard version of a project that you can build
    and consume in a .NET Framework 4.6 project?


    +   3. HttpClient is an API that first appeared in which version of .NET Standard?


    +   4. What tag is used in a csproj file to reference the output of another project?


    +   5. How frequently does the ASP.NET Core team host standup video meetings for
    the public to attend?


    # Answers


    +   1. .NET Standard supports only the Class Library project type.


    +   2. .NET Framework 4.6 is supported starting with .NET Standard 1.3.


    +   3. .NET Standard 1.1 is the first version to support the HttpClient API.


    +   4. The ProjectReference tag is used to reference the output of other projects.


    +   5. The ASP.NET Core team hosts standup meetings once a week, usually on Tuesdays,
    at https://live.asp.net.


    # Exercise


    Now that you have a .NET Standard client that can fetch weather information for
    a given destination, extend the Trip object to include a Primary Destination field.
    With this additional field populated, add a Current Weather Conditions column
    to the list of upcoming trips using WeatherTagHelper and the Primary Destination
    value for each trip.'
