    # dotnet build


    dotnet build is the entry point for the .NET compiler. Execute this command to
    request that the compiler act on a project and deliver runnable output to a bin
    folder with appropriate framework folders underneath. You can specify the framework,
    a configuration, and the target output folder that you want the compiler to deliver
    to. Here is an example of a call to dotnet build and specifying some additional
    instructions for how the project should be built:


    Click here to view code image


    ```

    dotnet build c:\dev\MyProject\src\MyProject --output c:\dist\MyProject --framework
    netcoreappll --configuration debug

    ```


    The new project resides in the c:\dev\MyProject\src\MyProject folder and delivers
    the output of the compiler to the c:\dist\MyProject folder. The compiler uses
    netcoreappll framework and uses the debug configuration to the project.


    You can run the dotnet build without any parameters, as they are all optional.
    If you do, the command executes against the project in the current folder and
    delivers output to a bin folder in the current folder as well as the default framework
    and configuration specified in the project''s configuration files.


