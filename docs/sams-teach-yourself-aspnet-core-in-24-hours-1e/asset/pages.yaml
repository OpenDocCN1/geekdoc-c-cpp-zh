  md: "# Quiz\n\n+   1. What is the difference between authentication and authorization?\n\
    2. What are the four types of authentication that can be configured from Visual\
    \ Studio?\n3. What deployment requirement must be met to use integrated Active\
    \ Directory authentication in an application?\n4. What is the name of the authentication\
    \ services in ASP.NET Core?\n\n# Answers\n\n+   1. Authentication validates what\
    \ the user is; authorization validates if the user is allowed to access a resource.\n\
    2. No Authentication, Individual User Accounts, Work or School Accounts, Windows\
    \ Authentication\n3. Integrated Active Directory authentication or Windows Authentication\
    \ must be deployed to a Windows web server.\n4. ASP.NET Core Identity\n\n# Exercise\n\
