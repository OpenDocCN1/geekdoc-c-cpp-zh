    # Installing Newer Versions of npm and bower


    Visual Studio installs set versions of bower and npm as of the date that you install
    Visual Studio, and it does not readily expose these tools to you. What happens
    when newer versions of these tools are released and you want to update your toolkit?


    Let’s look at Visual Studio and see where it installs these. By default, Visual
    Studio installs Node.js, npm, bower, git, and several other tools in the C:\Program
    Files (x86)\Microsoft Visual Studio 14.0\Web\External folder. You will find CMD
    files in this folder to route the appropriate locations on disk to launch each
    of these tools. They are a nice default and are on the path when you launch the
    Visual Studio command prompt on your Windows-based workstation.


    If you want to install and manage your own versions of these tools, you can download
    and install the latest Node.js from http://nodejs.org. With Node.js installed,
    when you install global copies of these tools by using the -g switch as shown
    here, npm places a copy of the executable at %appdata%

    pm on your Windows workstation:


    ```

    npm install -g

    ```


    This is nice, but it’s not in the path where Visual Studio will be looking to
    running your tools. Where is Visual Studio looking for these tools, and how can
    you control it? You can expose this configuration by selecting Tools > Options
    > Projects and Solutions > External Web Tools, as shown in Figure 15.7.'
