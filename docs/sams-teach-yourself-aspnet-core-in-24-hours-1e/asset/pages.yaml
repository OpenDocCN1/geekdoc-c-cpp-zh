    # LISTING 23.1 A Dockerfile for Packaging the ASPTravlerz Application


    Click here to view code image


    ```

    FROM microsoft/aspnet:1.1

    WORKDIR /app

    EXPOSE 80

    COPY obj/Docker/publish .

    ENTRYPOINT ["dotnet", "AspTravlerz.dll"]

    ```


    Here''s what each line of this file does:


    +   - The FROM statement indicates the base image to which you are adding

    y application. In this case, you are referencing and building on top of

    t standard Microsoft aspnetcore image for ASP.NET Core 1.1.


    +   - The WORKDIR command indicates that Docker should create a directory

    called app off the root of the hosted Linux filesystem. It makes the

    app folder the current working directory.


    +   - The EXPOSE command declares that your application is listening on port

    80, and the host machine can use this to communicate with the container.


    +   - The COPY starts the action of taking the published source of your application

    in your obj/Docker/publish folder and inserting it into the container''s

    current working directory, /app.'
