  md: 'The workshop contains quiz questions and exercises to help you solidify your
    understanding of the material covered. Try to answer all questions before looking
    at the “Answers” that follow.


    # Quiz


    +   1. What purpose does routing serve in an application?

    2. Where do you configure routing in an ASP.NET Core application?

    3. What Angular module do you use to configure Angular routing?

    4. What syntax can you use in an Angular route to capture any nonmatching URL?

    5. What is the purpose of the ClientApp/src/index.html?


    # Answers


    +   1. Routing defines the functionality that should be triggered for a given
    URL. In ASP.NET Core, it can also be used in reverse to generate URLs for requested
    functionality.

    2. You configure ASP.NET Core routing in the Startup.Configure method and, by
    default, inside the UseMvc statement.

    3. The Angular routing functionality is in @angular/routing.

    4. You can use a double asterisk (**) for a wildcard to capture a path that did
    not match another route.

    5. The index.html file receives the compiled Angular scripts that should be injected
    into Razor views by using the @Html.Partial statement.


