    # Q&A


    +   Q. Can I run my ASP.NET Core application on Azure, AWS, and Google Compute?


    +   A. ASP.NET Core support is terrific with all these cloud environments. In
    fact, you can run an ASP.NET Core application on almost any hosting provider by
    delivering a self-contained deployment appropriate for the hosting platform.


    +   Q. Why would I want to use a shared framework deployment?


    +   A. On a server that hosts several ASP.NET Core applications, you should want
    to deploy several copies of the .NET Core framework and tools. A shared framework
    installation delivers a centrally managed copy of the most common features of
    the framework so that you only need to deploy the third-party libraries and your
    application. It also means that the shared framework can be precompiled for your
    platform, and you can deploy your'
