    Deploying to Production


    What You’ll Learn in This Hour:


    +   - “production” means with ASP.NET Core

    - How to configure a production web space securely

    - Deploying to a production Windows server

    - Deploying to a production Linux server


    You’ve finished writing your application, and you’re ready to welcome the world
    to it. What are the next steps? This hour takes a look at what you need to do
    make your application available for production use. What does production mean
    to you? ASP.NET Core has a very clear definition of production, and you should
    know what it is prior to deploying your application.


    What Is This “Production” You Speak Of?


    Production is typically a term you hear in enterprise environments to refer to
    a “live” site where an application will run. Typically, this location is an isolated
    web server that an operations team manages to ensure the uptime and stability
    of the application. When I refer to an isolated location, I mean a data center.
    In some organizations, that facility could be on-site, or it could be at a co-location
    vendor that has high-speed access to the Internet, or it could even be a cloud
    vendor like Azure, Amazon, or Google Compute.


    Within your ASP.NET Core application, you may recall from Hour 6, “Configuring
    Your Application,” that there is an Environment setting. By default, it is set
    to Production, but Visual Studio overrides it to the setting'
