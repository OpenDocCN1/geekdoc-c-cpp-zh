    Q. Do I really need to inherit from the controller class? I would rather inherit
    from another class that gives me features I am looking for.


    A. You can construct controllers however you please, and yes, you don''t need
    to explicitly inherit from the controller class. If your controller class''s name
    ends with Controller and contains methods with the action method signature, ASP.NET
    will treat it as a Controller object, complete with dependency injection capabilities.


