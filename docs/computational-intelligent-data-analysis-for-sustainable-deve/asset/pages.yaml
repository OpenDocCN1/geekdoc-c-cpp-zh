- pgno: 153
  md: '# 5.1.3.1 Overview of Research Areas: 1. Extremes Characterization


    Extremes may be characterized based on their relevance to impacts (e.g., heat
    waves based on nighttime minima, which relate to human discomfort and possible
    loss of lives: Meehl and Tebaldi, 2004) or through statistical distributions (e.g.,
    extreme value theory for precipitation extremes: Kharin et al., 2007). Thus, our
    analysis (Ganguly et al., 2009b) of model simulations and surrogate observations
    (reanalysis data generated by assimilating weather data from disparate sensors
    into a numerical weather prediction model) pointed to higher trends but larger
    uncertainty in heat waves in this century based on a plausible but high emissions
    scenario, which in turn implies greater urgency but caution in adaptation or mitigation
    decisions. On the other hand, our analysis (Kodra et al., 2011a; see report by
    Tollefson, 2011) of multiple model simulations and reanalysis data revealed that
    while extreme cold events may grow less frequent, the intensity and duration of
    the ones that do occur may often persist at current levels. Our analysis of intense
    precipitation events (Kao and Ganguly, 2011) suggested an amplification of extremes,
    especially over the extratropics and in an aggregate sense at continental to global
    scales. Major community-wide efforts are necessary to comprehensively characterize
    the statistical attributes of gradual or sudden changes in extremes over space
    and time, including less well-defined or predictable climate extremes such as
    droughts. A combination of state-of-the-art methods, new methodological adaptations,
    and novel approaches in spatial or spatiotemporal statistics and data mining are
    motivated.


    # 5.1.3.2 Overview of Research Areas: 2. Uncertainty Assessments


    Uncertainty assessments for extremes (Wehner, 2010) need to consider knowledge-gaps
    in model physics (e.g., based on statistical methods to balance model skill in
    the past and multimodel convergence in the future through extensions of approaches
    such as Smith et al., 2009), and the applicability and statistical validity of
    the definitions or distributions of extremes, as well as uncertainties in parameter
    estimation processes (e.g., through the bootstrap as in Kharin et al., 2007 or
    Kao and Ganguly, 2011). The potential differences in the nature of the insights
    and uncertainties based on definitions of extremes become obvious by comparing
    our recent work (Ghosh et al., 2011) with a previous approach (Goswami et al.,
    2006). Current methods for attribution of extremes, e.g., for intense precipitation
    events, include statistical techniques (Min et al., 2011) or'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'numerical simulations (Pall et al., 2011); these methods can benefit from rigorous
    uncertainty quantification approaches. New mathematical methods for uncertainty
    are critically needed in these areas.


    # ### 5.1.3.3 Overview of Research Areas: 3. Enhanced Predictions


    Large gaps continue to exist in our scientific understanding and projections of
    certain crucial variables, often related to climate extremes, and fine-scale or
    aggregate processes that drive the extremes. There have been claims that *the
    sad truth of climate science is that the most crucial information is the least
    reliable* (Schierneier, 2010). One question relevant for enhanced projections
    of climate extremes is the extent to which the variables that are relatively better
    predicted (e.g., sea surface temperature or ocean meteorology in general, atmospheric
    temperature or humidity profiles over land) may have information content about
    the variables that may be more crucial (e.g., precipitation extremes or intensity
    and frequency of hurricanes), and whether such information can be utilized for
    developing predictive models. There is evidence of information content; for example,
    Liu et al. (2009) and others have reported on temperature dependence of precipitation
    extremes. And there is literature attempting to develop physics-based relations;
    for example, O’Gorman and Schneider (2009), Sugiyama et al. (2010), as well as
    Muller and O’Gorman (2011), have sought to develop a better understanding of precipitation
    processes related to extremes based on atmospheric covariates, while Emanuel et
    al. (2008) have attempted to produce projections of the statistical attributes
    of hurricanes based on climate model-simulated oceanic variables. While data-driven
    methods should be explored to develop novel and actionable predictive insights,
    the methods have to be able to handle nonlinear processes as well as complex dependence
    patterns, yet remain physically interpretable and able to generalize to nonstationary
    conditions. This area may represent a steep challenge for computational data sciences,
    and perhaps motivate truly interdisciplinary approaches conceived from traditionally
    disparate methods ranging from computational statistics, signal processing, and
    econometrics, to nonlinear dynamics, graph-based methods, data mining, and machine
    learning. Our recent efforts (Steinhaeuser et al., 2011a, b and Chatterjee et
    al., 2012) for improved regional predictions over land based on ocean meteorological
    variables or Kawale et al., 2011 for understanding climate dipoles) are only initial
    steps in an area that may well represent a grand challenge for data-intensive
    sciences.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 5.2 EXTREMES CHARACTERIZATION


    There are several challenges in characterizing and analyzing data related to climate
    extremes. One of the first challenges is the nature of the data: observational
    data are of relatively short duration and typically do not allow for many important
    extreme conditions to be manifest, they are unevenly spread spatially, and data
    quality is also uneven. Climate model outputs and reanalysis data do not have
    several of these problems, but Mannshardt-Shamseldin et al. (2011) demonstrate
    that the nature of extremes from gridded data differ considerably from observed
    data. Moreover, as Wehner (2010) observes:


    > ...to the extent that climate models can be tuned to reproduce the recent past,
    model developers focus on the mean values of climatic observations, not the tails
    of their distributions.


    Several other studies (O''Gorman and Schneider, 2009; Sugiyama et al., 2010; Wehner,
    2010; Min et al., 2011) have pointed out that our current understanding of precipitation
