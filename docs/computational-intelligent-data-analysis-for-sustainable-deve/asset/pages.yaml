    dimensions (triple bottom line). Clearly, any thoughtful decision requires the
    analysis of all three dimensions, and balances their influence to maximize the
    benefit. This kind of subtle decision-making process demands efficient data collection
    and analysis methods to provide sufficient evidence to support the rational decision-making
    process. In the meantime, the characteristics of economic, environmental, and
    social data provide many unique challenges to the data analysis research community.
    This has led to the development and consequent application of new methodologies
