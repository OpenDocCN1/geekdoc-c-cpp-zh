- pgno: 189
  md: 'Bradford County uses a more traditional ranking method. Project proposals are
    solicited once a year, and funding decisions are based on an environmental ranking
    that is adjusted based on in-kind contributions received. The county requires
    a minimum in-kind contribution of 10% to consider a project for funding. For every
    percentage of in-kind offered above 10%, 0.5 is added to the environmental benefit
    score. Also, no township can receive more than one project unless all townships
    that submit projects get funding for at least one project. This modified ranking
    system can be easily adapted to a binary program and compared for potential gains
    in efficiency.


    # 6.2 THEORETICAL MODELS AND RESULTS


    The basic template used for this case is BLP. In its most general form, it can
    be expressed as


    $$\text{Max: } Z = c^T x$$


    $$\text{Subject to: } Ax \leq b$$


    $$x_i \in \{0, 1\}$$


    where $Z$ is the total amount of environmental benefit obtainable from the county’s
    funds and is the sum of the individual project’s environmental scores, $c$ is
    a vector of the environmental scores for the projects, $x$ is a vector of binary
    variables indicating whether a given project is chosen (1 if selected; 0 if not
    selected), $A$ is a matrix of constraining factors such as project costs, and
    $b$ is a vector of the total endowment for each constraining factor, such as total
    budget. The basic model maximizes environmental scores subject only to budget
    constraints. However, there are several additional factors that must be considered
    in this case. Specifically, any conditions on funding of multiple projects for
    the same applicant and consideration of in-kind contributions must be part of
    the model. To capture funding restrictions, we can include a constraint that is
    the sum of all the


    Projects are occasionally specially designated as “Trout Unlimited” based on being
    located in sensitive watersheds. Those projects always get first priority for
    all funds. Recall that the Trout Unlimited organization originally helped organize
    the DGRP. However, Trout Unlimited projects are sufficiently rare (there was only
    one for 2002 through 2008) so they are left out of this analysis.'
