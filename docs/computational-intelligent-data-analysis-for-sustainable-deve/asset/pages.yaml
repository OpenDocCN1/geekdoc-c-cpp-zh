    captured as edges between them. Climate networks are a rich representation for
    the complex processes underlying the global climate system, and can be used to
    understand and explain observed phenomena [95, 108].


    A key challenge in the context of climate networks is to construct such networks
    from observed climate variables. From a statistical machine learning perspective,
    the climate network should reflect suitable dependencies captured by the joint
    distribution of the variables involved. Existing methods usually focus on a suitable
    measure derived from the joint distribution, such as the covariance or the mutual
    information. From a sample-based estimate of the pairwise covariance or mutual
    information matrix, one obtains the climate network by suitably thresholding the
    estimated matrix. Such approaches have already shown great promise, often identifying
    some key dependencies in the global climate system [43] (Figure 4.2).


