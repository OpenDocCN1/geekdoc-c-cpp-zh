  md: 'Now the energy portfolio variance minimization problem (EPVM) becomes


    $\min x^T Vx$


    subject to


    $\sum_{j=1}^{n} E_j x_j \geq L$  (EPVM)


    $\sum_{j=1}^{n} x_j = 1$


    $x_j \geq 0,\ \forall j$


    Finally, extensions of this approach to multi-period planning horizons are also
    possible under appropriate assumptions about interactions between successive periods.


    Performance criteria other than variance minimization must be considered. The
    latter include other risk measures such as CVaR (conditional value at risk) and
    target-percentile criteria [24]. Vithayasrichareon and MacGill [39] have applied
    VaR techniques to generation investment, and there are obvious extensions that
    would strengthen the value of the tool. In addition, the stochastic and robust
    programming versions of the associated optimization problems [6] must be utilized.


    # 8.5 CONCLUSION


    In this chapter we canvassed a number of the tools that are needed for proper
    analysis of increasing the proportion of renewable energy for delivery of electricity
    supply. This is only for a macro-level study, as we have not investigated the
    power engineering aspects of the problem, nor indeed the financial questions.


    The benefits of strong, early action considerably outweigh the costs. From the
    Stern Review [37], we have the following from the Executive Summary:


    +   - Unabated climate change could cost the world at least 5% of GDP each year;
    if more dramatic predictions come to pass, the cost could be more than 20% of
    GDP.'
