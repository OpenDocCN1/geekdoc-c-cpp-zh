  md: '# 7.4.5 Disaggregation


    For achieving energy efficiency, deep knowledge concerning the distribution of
    the consumed power among the devices within a facility is important (see Scenarios
    7.1 and 7.6). In practice, this is often achieved by installing metering devices
    directly on single devices, which is expensive, time-consuming, and usually not
    exhaustive. It would be easier to derive the power distribution from the metered
    data at the interface to the grid (see also Section 7.4.3.3).


    Smart metering, that is, high-resolution metering and remote transmission of metered
    data, promises to provide that deep look into the infrastructure at all metering
    points. Techniques for achieving this are commonly called *nonintrusive (appliance)
    load monitoring* (*NILM*, sometimes also *NALM*) or *disaggregation* of power
    data. This has potential applications in achieving better energy efficiency (see
    Scenarios 7.1 and 7.6) and in facilitating demand response (see Scenarios 7.2
    and 7.3) and load management (e.g., in a *smart home*, see Scenario 7.4). Thus,
    the topic has recently sparked increased interest [31, 53, 55, 78, 82, 91, 142]
    after further research (including, e.g., [49, 87]) has been done since the first
    paper was published in 1992 [63].


    Common smart meters in residential and industrial environments are placed at the
    interface to the distribution grid. They measure the active and reactive energy
    used by all the devices connected to the electric circuit that originates at the
    meter. Additional values can be measured, such as peak loads. Multiple meters
    can be installed at a single facility, which is usually the case if separated
    billing of the consumed energy is required. For billing purposes, such meters
    pick up the consumed energy typically in intervals of fifteen minutes. However,
    an interface with a higher temporal resolution is usually provided at the meter
    itself, which can be accessed locally.


    As these meters are increasingly available, it is tempting to also use the metered
    data for analytical purposes. In a residential setting, transparency of energy
    consumption may lead to energy conservation (see Scenario 7.1). NILM has also
    been proposed as a tool for verifying the effectiveness of demand-response measures.
    In industrial or commercial settings, an energy audit is a valuable tool for identifying
    potentials for energy efficiency (see Scenario 7.6). Such audits can be executed
    more thoroughly the more detailed information is available. The (temporary) installation
    of sub-meters is therefore commonly practiced and could be, at least partially,
    substituted by NILM.'
