  md: '![](img/644775a10ad87164013616d709050cee_280_0.png)


    FIGURE 8.11  Five minute output and model.


    Ten-second data ($X_t$) can be satisfactorily modeled using an AR(3) process (see
    Figure 8.12):


    $$X_t = \alpha_1 X_{t-1} + \alpha_2 X_{t-2} + \alpha_3 X_{t-3} + Z_t$$


    or equivalently,


    $$\phi(B) X_t = Z_t$$


    where $\phi(B) = 1 - \alpha_1 B - \alpha_2 B^2 - \alpha_3 B^3$, and $B$ denotes
    the backshift operator, that is, $BX_t = X_{t-1}$.


    As $\phi(B)$ is invertible, the process is equivalent to an infinite moving average
    process.


    $$X_t = \psi(B) Z_t$$


    where $\psi(B) = \psi_0 + \psi_1 B + \psi_2 B^2 + \psi_3 B^3 + \cdots$.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '![](img/644775a10ad87164013616d709050cee_281_0.png)


    FIGURE 8.12 *(See color insert.)* AR(3): fit of 10-second data.


    Thus, in simple terms,


    $$X_t = \psi_0 Z_t + \psi_1 Z_{t-1} + \psi_2 Z_{t-2} + \psi_3 Z_{t-3} + \cdots,
    \tag{8.3}$$


    It can be shown that


    $$\psi_j = \alpha_1\psi_{j-1} + \alpha_2\psi_{j-2} + \alpha_3\psi_{j-3} \tag{8.4}$$


    with $\psi_0 = 1$ and $\psi_j = 0$ for $j < 0$.


    # 8.3.4.1  Using Results from Modeling High-Frequency Wind Data to Formulate a
    Model at Lower Frequency


    The total wind energy on a 5-minute timescale is the sum of the thirty 10-second
    energy totals within that 5-minute period, and so we can sum the variables on
    the 10-second timescale that follow an AR(3) process to get a 5-minute variable.
    Let $\{X_t\}$ denote the time series of wind energy output at intervals of 10
    seconds, and let $\{Y_t\}$ denote the time series of aggregated energy output
    at every 5 minutes. The 5-minute process as a sum of thirty “10-second observations”
    can be expressed as


    $$Y_t = X_t + X_{t-\frac{1}{30}} + X_{t-\frac{2}{30}} + \cdots + X_{t-\frac{29}{30}}
    \tag{8.5}$$'
