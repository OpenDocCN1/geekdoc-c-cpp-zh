    # 6.2.3  Issue 3: Sensitivity of Results to State Fund Distribution Rules


    Officials from Cambria and Carbon Counties have been frustrated in their efforts
    to develop the DGRP program in their counties because they receive such small
    grants, which sometimes do not even entirely cover the costs associated with one
    project. This raises an interesting question: What effect would different fund
    distribution rules have on the overall environmental benefit to the state and
    on county programs? To optimize the overall program, decisions on projects to
    fund during a given year could be made at the state level. This system, however,
    would reduce local involvement, which is a stated goal of the DGRP. As an alternative,
    we considered a state distribution mechanism that could redistribute funds from
    one county to another to see how the overall environmental benefit changed.


    We used Bradford County’s 2002 project submissions and the projects completed
    to date for Cambria County, which amounts to essentially one year’s worth of project
    submissions. Under a parameter analysis, optimal fund distributions were determined
    by starting with each county’s average DGRP budget as a baseline and varying the
    amount budgeted to each county symmetrically by unit changes of $10,000. With
    each county receiving its traditional budget allotment of approximately $300,000
    for Bradford and $15,000 for Cambria, the total environmental benefit score for
    the two counties was 1,923. Figure 6.4 represents the total level of benefit achieved
    by redistributing some of the Bradford County budget to Cambria County. The x-axis
    represents the total annual amount shifted'
