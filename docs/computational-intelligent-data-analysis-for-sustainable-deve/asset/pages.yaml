    Among the various LCA methods, the Economic Input-Output Life-Cycle Assessment
    (EIO-LCA) method uses information about industry transactions—purchases of materials
    by one industry from other industry, and the information about direct environmental
    emissions of industries—to estimate the total emissions throughout the supply
    chain [25]. In the EIO-LCA method, the input-output table acts as the key engine.
    The input-output table simply uses a matrix representing the intra-industry flows
