    inverse relationships for certain types of crimes reveals the need to carefully
    choose the amount of aggregation applied to analysis. It remains unclear, however,
    if these relationships exist because of some fundamental differences in those
    committing drug offenses versus violent offenses, or if they are some artifact
    of police strategy or organization.


    We also note that environmental factors have small, but statistically significant
    impacts on crime rates. Using daily weather records in 1999 as kept by the National
    Oceanic and Atmospheric Administration (NOAA), we regress crime rates on environmental
    factors. While these effects are not overwhelmingly strong, they are statistically
    significant. We find that temperature increases can be associated with an increase
    in crime and that precipitation leads to a decrease. Comparing the coefficients
    of these effects for different crime types, we find interesting differences.


    To compare coefficients between crimes that occur with differing frequency, we
    regress the log of occurrences on both temperature and precipitation. The coefficient
    then represents the percentage change in crime rates due to an increase of 1°F
    or 1 inch of precipitation, respectively. Table 11.4 shows the results of this
    regression. We find that drug-related crimes, which may be driven by psychological
    or physiological needs, are not affected by weather, while violent crimes, which
    are more likely to be driven by passion and environment, respond significantly
    to increases in temperature or precipitation.


    Although these basic statistics provide insight into the types of relationships
    that exist within the data, they remind us that complex relationships exist on
    multiple scales in both space and time. We continue with more advanced methods,
    capable of teasing out these relationships despite noisy data.


