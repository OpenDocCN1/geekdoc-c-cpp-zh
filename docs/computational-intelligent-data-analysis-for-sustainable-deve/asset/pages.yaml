- pgno: 267
  md: 'energy for the grid. In addition, wind farms distributed north-south along
    a longitude can take advantage of weather systems moving cohesively at different
    latitudes. This concept of using meteorological and astronomical attributes to
    enhance the diversity of sources requires significant augmentation of the grid,
    including provision of high-voltage, direct-current transmission systems to minimize
    distance-related losses. In this configuration, even augmented by other renewable
    sources, there is a necessity for some energy storage for backup and load balancing—Denmark
    stores excess wind power in Norway’s hydroelectric dams through pumping.


    An alternative approach is to develop a protocol for combining a renewable supply
    of diverse sources (both in technologies and locations) with sophisticated demand
    management (load follows the supply rather than the reverse) and energy storage
    to maximize the penetration of renewables. This entails a variety of supply options,
    more directly embedded in the transmission and distribution networks than the
    supergrid option, as well as a variety of storage options. The task arising from
    this more subtle approach is deciding on the quantities of each supply option,
    as well as a storage option, where they are positioned in the system, as well
    as how to best use the demand-side management. This results in a portfolio optimization
    problem.


    In summary, in this chapter we present the mathematical modeling tools we argue
    are necessary to perform a rational, sophisticated analysis of the problem of
    moving to a high penetration of renewable sources in the provision of the electricity
    supply.


    # 8.2 APPROACH


    # 8.2.1 Renewable Generation


    There are many renewable energy technologies that can generate electricity without
    consuming finite resources and without producing CO₂ emissions, including concentrating
    solar thermal plants, solar photovoltaic panels, wind turbines, tidal generators,
    and biofuel generators.


    Zero Carbon Australia [41] describes an ambitious plan to meet Australia’s electricity
    needs using a combination of 60% concentrating solar thermal power (with molten
    salt storage), 40% wind, and backup power from hydroelectricity and biofuels.
    Elliston et al. [13] have shown that it is technically feasible to supply electricity
    from renewables with the same reliability as the present system.'
