- pgno: 165
  md: 'model parameter $\chi$ can be written as a PC expansion (PCE) in terms of an
    $n$-dimensional basis:


    $$\chi = \sum_{k=0}^{P} \alpha_k \Psi_k(\xi_1, \xi_2, \ldots, \xi_n) \tag{5.6}$$


    The key task is then the propagation of uncertainty from parameter $\chi$ to climate
    model output $Z$, where $Z = \mathcal{H}(\chi)$ (Najm, 2009). Generally, PC methods
    come in two variants (Najm, 2009): (1) intrusive methods, where the governing
    equations are transformed employing Galerkin projection, arriving at a new set
    of equations for the PC mode coefficients; and (2) nonintrusive methods, where
    the original model is employed as a black box in a sampling context. The former
    approach requires changing the source code/forward solvers of the underlying physical
    model. The latter is the more practical, given established legacy codes. In this
    approach, the mode coefficients in the PCE for a model output of interest $Z$
    are evaluated employing a chosen set of $N$ samples of the basis $\{\xi_i\}_{i=1}^{N}$
    and associated model output values $Z^i$. Adaptive anisotropic deterministic sampling
    methods, employing sparse-quadrature evaluations of projection integrals for the
    PC coefficients, are highly effective in this regard (Noble et al., 2008).


    The outcome of the PC forward UQ problem is a PCE for the uncertain model outputs
    of interest, which can be employed to generate corresponding probability density
    functions, or moments of interest. Note that the PCE, being a functional representation
    of model outputs over the range of uncertainty in input parameters, is also useful
    simply as a surrogate for the dependence of model outputs on the parameters. PC
    surrogates have been used, very much like GP surrogates, for accelerating Bayesian
    inference (Marzouk and Najm, 2009).


    The use of PC UQ methods in the global scale climate-modeling context is feasible
    in principle employing a nonintrusive formalism, although it is severely challenged
    by the high dimensionality of the stochastic input space, particularly given the
    computational expense of a single model run. Presuming known uncertainties of
    model parameters, targeted studies exploring small subsets of parameters are quite
    feasible. Sparsification via sensitivity analysis or CS methods, as well as utilization
    of known parameter correlations, and the hierarchical structure of climate models,
    is useful to reduce the effective dimensionality of the uncertain input space,
    thereby rendering the overall problem more feasible.'
