  md: 'can impart a bias or skewness to the observation relative to what the real
    world may nominally be doing. Examples in satellite remote sensing are common—for
    example, a low cloud record from a satellite will only be able to see low clouds
    when there are no high clouds. Similarly, a satellite record of “mid-tropospheric”
    temperatures might actually be a weighted integral of temperatures from the surface
    to the stratosphere. A paleoclimate record may be of a quantity that while related
    to temperature or precipitation, may be a complex function of both, weighted towards
    a specific season. In all these cases, it is often advisable to create a ‘forward
    model’ of the observational process itself to post-process the raw simulation
    output to create more commensurate diagnostics.


    # 4.11.2 Climate System Complexity


    A further issue arises in creating statistical models of the climate system because
    both the real world and dynamical models have a large number of different physical
    variables.


    Even simplified models can have hundreds of variables, and while not all of them
    are essential to determining the state of the system, one variable is frequently
    not sufficient. Land, atmosphere, and ocean processes all have different dominant
    timescales, and thus different components are essential at different scales. Some
    physical understanding is thus necessary to make the proper variable/data choices,
    even with analysis schemes that extract structure from large datasets. Furthermore,
    these systems are chaotic, that is, initial conditions that are practically indistinguishable
    from each other in any given observing system will diverge greatly from each other
    on some short timescale. Thus, extracting useful predictions requires more than
    creating more accurate models—one needs to determine which aspects are predictable
    and which are not.


    # 4.11.3 Challenge: Cloud-Computing-Based Reproducible Climate Data Analysis


    The study of science requires reproducible results: science is a body of work
    where the community strives to ensure that results are not from the unique abilities
    and circumstances of one particular person or group. Traditionally, this has been
    done in large part by publishing papers, but the scale of modern climate modeling
    and data analysis efforts has far outstripped the ability of a journal article
    to convey enough information to allow reproducibility. This is an issue both of
    size and of complexity: model results are much larger than can be conveyed in
    a few pages, and'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'both models and analysis procedures are too complex to be adequately described
    in a few pages.


    The sheer size of GCMs and satellite datasets is also outstripping our traditional
    data storage and distribution methods: frequently, only a few variables from a
    model’s output are saved and distributed at high resolution, and the remaining
    model output is heavily averaged to generate datasets that are sufficiently small.


    One promising approach to addressing these problems is cloud-computing-based reproducible
    climate data analysis. Having both the data and the analyses resident in the computational
    cloud allows the details of the computation to be hidden from the user; so, for
    example, data-intensive portions of the computation could be executed close to
    where the data resides. But these analyses must be reproducible, which brings
    not only technical challenges of archiving and finding, describing, and publishing
    analysis procedures, but also institutional challenges of ensuring that the large
    datasets that form the basis of these analyses remain accessible.


    # 4.11.3.1 Data Scale


    The size of datasets is rapidly outstripping the ability to store and serve the
    data. We have difficulty storing even a single copy of the complete archive of
    the CMIP3 model results, and making complete copies of those results and distributing
    them for analysis becomes both a large undertaking and limits the analysis to
    the few places that have data storage facilities of that scale. Analysis done
    by the host prior to distribution, such as averaging, reduces the size to something
    more manageable, but currently those reductions are chosen far in advance, and
    there are many other useful analyses that are not currently being done.


    A cloud-based analysis framework would allow such reductions to be chosen and
    still executed on machine with fast access to the data.


    # 4.11.3.2 Reproducibility and Provenance Graphs


    A cloud-based analysis framework would have to generate reproducible documented
    results; that is, we would not only need the ability to rerun a calculation and
    know that it would generate the same results, but also know precisely what analysis
    had been done. This could be achieved, in part, by having standardized analysis
    schemes, so that one could be sure precisely what was calculated in a given data
    filter, and also important is systematically tracking the full provenance of the
    calculation. This provenance graph, showing the full network of data filters and
    initial, intermediate,'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'and final results, would provide the basis of both reproducibility and communication
    of results. Provenance graphs provide the information necessary to rerun a calculation
    and get the same results; they also provide the basis of the full documentation
    of the results. This full network would need to have layers of abstraction so
    that the user could start with an overall picture and then proceed to more detailed
    versions as needed.


    # ## 4.12 CONCLUSION


    The goal of this chapter is to inspire future work in the nascent field of climate
    informatics. We hope to encourage work not only on some of the challenge problems
    proposed here, but also on new problems. A profuse amount of climate data of various
    types is available, providing a rich and fertile playground for future machine
    learning and data mining research. Even exploratory data analysis could prove
    useful for accelerating discovery. To that end, we have prepared a climate informatics
    wiki as a result of the *First International Workshop on Climate Informatics*,
    which includes climate data links with descriptions, challenge problems, and tutorials
    on machine learning techniques [4]. We are confident that there are myriad collaborations
    possible at the intersection of climate science and machine learning, data mining,
    and statistics. We hope our work will encourage progress on a range of emerging
    problems in climate informatics.


