  md: '# 3.1 INTRODUCTION


    IN PRACTICE, ENVIRONMENTAL IMPACT ASSESSMENT and emissions accounting are generally
    conducted at the firm level, project level, or product level, where the firsthand
    data is available. Since the early 1990s, input-output analysis (IOA) has been
    widely used for environmental accounting, such as carbon footprint assessment
    and the calculations of embodied emissions and virtual water at the sectoral level
    for a nation, a region, or multiple regions, depending on the purpose of the research.
    One of the advantages of using IOA is that not only direct emissions, but also
    indirect emissions from various upstream processes in a supply chain can be taken
    into account systematically. Every empirical input-output (IO) table rests on
    the definition of industries, which is usually given by aggregating similar products
    into one sector. For each defined industry, firm-level data is collected and the
    input coefficients in an IO table can represent an average of the production functions
    of many different sample firms. Therefore, the usefulness of published IO tables
    for practical environmental assessment is challenged by the robustness of the
    results, which can be influenced by different classifications of firms, products,
    or processes into sectors (Gibbons et al., 1982; Wiedmann, 2009a).


    The aggregation problem is not new to the society of IOA, which has intensively
    discussed the issue since the 1950s. Fisher (1958, 1962, and 1966) provided rich
    theoretical thinking on the optimization of aggregation. Ara (1959) provided theoretical
    proof of the necessary and sufficient condition for sector aggregation that is
    acceptable for IOA. Unlike conventional methods aiming to reduce the size of an
    IO model, Leontief (1967) alternatively presented a systematic procedure to eliminate
    certain goods and processes from an existing IO table. Doeksen and Little (1968)
    tested the aggregation with both hypothetical models and actual regional IO models.
    They concluded that the model size (level of aggregation) has little impact on
    the multipliers of unaggregated sectors when the remaining sectors were highly
    aggregated. A useful implication is that even with a small regional model, it
    could be possible to determine the impacts of a new plant on local employment
    and income. By using the survey data and other information for Philadelphia, Karaska
    (1968) tested the variations of Leontief coefficients in a regional IO table.
    He found that variation increases with the level of aggregation from the detailed
    four-digit level to the two-digit level defined in the Standard Industrial Classification
    (SIC) system, and the variations of the local coefficients are greater than the'
