    The advantage of Van der Ploeg’s approach is that the reliability information
    of the right-hand side vector **c** has shifted to the iterate, which is now called
    **p**. The disadvantage is that the iterate (formerly **a** now **p**) grows by
    as many variables as there are soft constraints and, hence, the problem becomes
    significantly bigger. However, the number of constraints remains the same. The
    solution of this problem is the Final MRIO and the vector of disturbances of the
    soft constraints. The Final MRIO adheres to all constraints and considers the
    reliability of the raw data and the constraints during the calculation process.


    Often, certain values of the MRIO must stay within certain boundaries. Transaction
    values of the basic price table, for example, must be positive values. Values
    in the subsidies sheet can only be negative values. Hence, each element $p_i$
    can be subject to an upper or lower bound, that is, $l_i \leq p_i \leq u_i$. By
    allowing positive or negative infinity as a feasible value for the upper or lower
    bound, a bound equation can be formulated for each element $p_i$. The upper bound
    and lower bound values can be summarized in vectors of equal size to the size
