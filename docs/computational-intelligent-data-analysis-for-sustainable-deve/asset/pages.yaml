    # ### 4.9 APPLICATIONS TO PROBLEMS IN POLAR REGIONS


    Another potential application of machine learning concerns the impact of climate
    change at the poles and the interaction between the poles and climate in general.
    Because of the difficulty in collecting data from polar regions, the relatively
    expensive costs, and logistics, it is important to maximize the potential benefit
    deriving from the data. The paucity of surface-measured data is complemented by
    the richness and increasing volume of either satellite/airborne data and model
    outputs. In this regard, powerful tools are needed—not only to analyze, manipulate,
    and visualize large datasets, but also to search and discover new information
    from different sources—in order to exploit relationships between data and processes
    that are not evident or captured by physical models.


    The number of applications of machine learning to study polar regions is not high
    although it has been increasing over the past decade. This is especially true
    in those cases when data collected from spaceborne sensors are considered. For
    example, Tedesco and colleagues [98, 99] use artificial neural networks (ANNs)
    or genetic algorithms to estimate snow parameters from spaceborne microwave observations.
    Soh and Tsatsoulis [91] use an Automated Sea Ice Segmentation (ASIS) system that
    automatically segments Synthetic Aperture Radar (SAR) sea ice imagery by integrating
    image processing, data mining, and machine learning methodologies. The system
    is further developed by Soh et al. [92], where an intelligent system for satellite
    sea ice image analysis called Advanced Reasoning using Knowledge for Typing Of
    Sea ice (ARKTOS) “mimicking the reasoning process of sea ice experts” is presented.
    Lu and Leen [54] use semi-supervised learning to separate snow and non-snow areas
    over Greenland using a multispectral approach. Reusch [71] applies tools from
    the field of ANNs to reconstruct centennial-scale records of West Antarctic sea-ice
    variability using ice-core datasets from 18 West Antarctic sites and satellite-based
    records of sea ice. ANNs are used as a nonlinear tool to ice-core predictors to
    sea-ice targets such as sea salt chemistry to sea ice edge. One of the results
    from this study is that, in general, reconstructions'
