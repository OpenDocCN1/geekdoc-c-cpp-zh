    # 4.5.3 Predictive Modeling: Mean Processes and Extremes


    Predictive modeling of observed climatic phenomena can help in understanding key
    factors affecting a certain observed behavior. While the usual goal of predictive
    modeling is to achieve high accuracy for the response variable, for example, the
    temperature or precipitation at a given location, in the context of climate data
    analysis, identifying the covariates having the most significant influence on
    the response is often more important. Thus, in addition to getting high predictive
    accuracy, feature selection will be a key focus of predictive modeling. Further,
    one needs to differentiate between mean processes and extremes, which are rather
    different regimes for the response variable. In practice, different covariates
    may be influencing the response variable under different regimes and timescales.


    In recent literature, important advances have been made in doing feature selection
    in the context of high-dimensional regression [66, 101]. For concreteness, consider
    the problem of predicting the mean temperature in Brazil based on multiple ocean
    variables over all ocean locations. While the number of covariates $p$ runs into
    tens of thousands, the number of samples $n$ based on monthly means over a few
    decades are a few hundred to a few thousand. Standard regression theory does not
    extend to this $n \ll p$ scenario. Because the ocean variables at a particular
    location are naturally grouped, only a few such locations are relevant for the
    prediction, and only a few variables in each such location are relevant, one can
    pose the regression problem as a sparse group lasso problem [24, 25]:


