    # 6.3 CONCLUSIONS


    This chapter has applied optimization through mathematical programming techniques
    to the problem of water quality conservation in the state of Pennsylvania. It
    demonstrated how Binary Linear Programming can be extended to deal with a variety
    of challenges encountered in an on-the-ground conservation situation. The Pennsylvania
    Dirt and Gravel Roads'
