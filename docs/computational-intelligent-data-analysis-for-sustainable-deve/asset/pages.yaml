  md: 'Rearranging gives


    $$\sigma^2(Y_t)=\left(\sum_{n=0}^{29}\left(\sum_{i=0}^{n}\psi_i\right)^2\right)\sigma^2(Z_t)+\left(\sum_{n=30}^{59}\left(\sum_{i=0}^{n}\psi_i-\sum_{i=0}^{n-30}\psi_i\right)^2\right)\sigma^2(Z_{t-1})+\left(\sum_{n=60}^{89}\left(\sum_{i=0}^{n}\psi_i-\sum_{i=0}^{n-30}\psi_i\right)^2\right)\sigma^2(Z_{t-2})+\cdots
    \tag{8.8}$$


    The basic components in the expression for $\sigma^2(Y_t)$ are


    $$\sum_{i=0}^{n}\psi_i$$


    We are able to prove that


    $$\sum_{i=0}^{n}\psi_i=\sum_{k=0}^{n}\sum_{(n_1,n_2,n_3)\in A}\frac{(n_1+n_2+n_3)!}{n_1!\,n_2!\,n_3!}\alpha_1^{n_1}\alpha_2^{n_2}\alpha_3^{n_3}$$


    where the triplets $(n_1,n_2,n_3)$ come from the set $A=\{(n_1,n_2,n_3)\mid n_1+n_2+n_3\leq
    k\ \&\ n_1+2n_2+3n_3=k\}$. Using Equation 8.8 we obtain the estimated standard
    deviation for five minute data shown in Figure 8.13.


    # 8.3.4.2 Summary for Single Sources


    The steps needed to reliably forecast solar and wind outputs include the following:


    +   1. Validate the mixture of autoregressive and resonating model (ARR) to representative
    solar datasets for climates throughout Australia.

    +   2. Extend ARR to wind farm output series.

    +   3. Determine what type of volatility modeling is needed for solar energy series.'
