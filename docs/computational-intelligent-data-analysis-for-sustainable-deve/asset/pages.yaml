- pgno: 158
  md: 'UQ to understand the scope and limitations of multimodel ensembles for climate
    UQ: to date, no statistical multimodel ensemble UQ methodology explicitly incorporates
    uncertainty within climate models (e.g., to understand the uncertainties contributed
    by parameterizations of climate processes and the propagation of these uncertainties
    along the rest of the model components). The ensemble methods discussed here,
    however, provide a basis for exploring inter-model (i.e., structural) uncertainty.


    While the use of multimodel ensembles for prediction has been studied extensively
    in data science disciplines (Seni and Elder, 2010), an important distinction must
    be made for the climate science domain. In many typical time series and classification
    applications, for example, a forecast horizon of interest is often one or two
    (or a few) periods ahead, or the binary classification is for the next observation
    (Seni and Elder, 2010). In such cases, there is the potential for a predictive
    model to learn from an ensemble of predictions and recalibrate its next prediction
    upon validation (Fern and Givan, 2003). Several key challenges, however, distinguish
    climate forecasting from more typical problem settings: long prediction lead times
    (multidecadal to centennial scales), potential nonstationarity (where the validity
    of processes embedded within a GCM may change), the difficulty in selecting metrics
    that are meaningful for model training (Knutti, 2010), and finally the impossibility
    of true validation for the prediction horizons of interest. Many of the methods
    developed in data sciences, while valuable on their own and across applications,
    do not directly translate well to climate prediction. For example, even in the
    case where past data are segmented into multiple training samples in order to
    rigorously develop a multimodel ensemble prediction formula founded on well-chosen,
    physically meaningful error metrics, there is no guarantee that nonstationarity
    will not invalidate the prediction formula in the future, given the lead time.
    Thus, while mature data science ensemble methodologies may be valuable as foundational
    approaches, novel and creative methods are needed to solve the problem of UQ in
    climate with multimodel ensembles.


    One persisting notion in the climate literature is that the multimodel average
    (MMA), or the average of spatial, temporal, or spatiotemporal fields of climate
    outputs from multiple GCMs, is a robust approach for making “most likely” projections;
    this robustness is largely based on alleged bias (noise) cancellation and orthogonal
    skills of GCMs (Knutti et al., 2010). The concept of its potential utility in
    climate may have followed from success in weather forecasting (Krishnamurti et
    al., 1999; Hagedorn et al.,'
  merge: -1
