- pgno: 135
  md: 'genomics and medical diagnoses. It is likely worthwhile to apply conformal
    prediction to other complex problems in computational science.


    Statistical Relational Learning [26] offers a natural framework for inference
    in climate. Included within this set of methods are graphical models [47], a flexible
    and powerful formalism with which to carry out inference for large, highly complex
    systems (some of which were discussed in Sections 4.5 and 4.6). At one extreme,
    graphical models can be derived solely from data. At the other extreme, graphical
    models provide a generalization of Kalman filters or smoothers, where data are
    integrated with a model. This general approach is quite powerful but requires
    efficient computation of conditional probabilities. As a result, one might explore
    how to adapt or extend the current suite of belief propagation methods to climate-specific
    problems.


    Finally, for all of the above methods, it would be helpful if the learning algorithm
    could automatically determine which information or data it would be useful to
    get next. The “optimal learning” formalism addresses this question [69]. This
    gradient learning approach can be applied to a whole host of problems for learning
    where one has limited resources to allocate for information gathering. Optimal
    learning has been applied successfully to experiment design, in particular in
    the pharmaceutical industry, where it has the potential to reduce the cost (financial,
    time, etc.) of the drug discovery process. Optimal learning might be applied to
    climate science in order to guide the next set of observations and/or the next
    simulations.


    To conclude, there is a suite of recently developed machine learning methods whose
    applicability and usefulness in climate science should be explored. At this point,
    we have only begun to scratch the surface. If these methods prove successful in
    climate studies, we would expect them to apply elsewhere—where one has a model
    of the physical system and can access data.


    # 4.11 DATA CHALLENGES AND OPPORTUNITIES

    IN CLIMATE INFORMATICS


    Here we discuss additional challenges and important issues in analyzing climate
    data.


    # 4.11.1 Issues with Cross-Class Comparisons


    There is often a need to compare across different classes of data, whether to
    provide ground truth for a satellite retrieval or to evaluate a climate model
    prediction or to calibrate a proxy measurement. But because of the different characteristics
    of the data, comparing “apples to apples” can be difficult.'
