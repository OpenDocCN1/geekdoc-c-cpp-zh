    +   4. *Liberalization.* In addition to the aim for sustainability and technological
    developments, the energy system is also challenged by legislation [104]. While
    traditionally electricity generation, transition, distribution, and retail have
    been done by regional monopolies, the electricity market is now liberalized in
    many countries. Since the end of the 1990s, the mentioned tasks are separated
    and competition is introduced for generation and retail of electrical energy.
    In addition to generation and retail companies, liberalization leads to a number
    of other actors, such as transition and distribution-network operators, balance-responsible
    parties, metering operators, value-added-service providers, etc. In particular,
    actors related to the operation of the grid are typically regulated by governmental
    authorities. From a more technical perspective, a larger number of actors are
    involved in the electricity system. They all generate data, and this distributed
    data must be exchanged with other partners in order to fulfill their respective
    tasks. This opens up new and interesting possibilities for data analyses as well
    as the need for ways of treating data in a privacy-preserving way.


    To wrap up the challenges, sustainable energy systems will undergo major changes
    in the future. Generation and production will be more volatile and the landscape
    becomes more fragmented, both from a technical (distributed generation, volatile
    generation, and consumption) and an organizational perspective (new and more specialized
    actors). Most important is the paradigm shift from *demand-driven generation*
    in the past to *generation-driven demand* in the future, triggered by renewable
    energy generation and new loads. Generation-driven management of energy consumption
    in the smart grid is a complex optimization problem [138]. It involves the operation
    of certain distributed energy sources and the control of energy consumption, for
    example, via market-based mechanisms. In the liberalized electricity market, different
    actors will probably contribute to the solution of the optimization problem in
    a distributed manner. Further, the solution will likely be hierarchical: Certain
    optimizations will be done on the transition grid, further optimizations at the
    distribution grids, the next ones might be more fine-grained consumption and generation
    shifting between neighbor consumers and small energy generators. At these different
    levels, consumption,'
