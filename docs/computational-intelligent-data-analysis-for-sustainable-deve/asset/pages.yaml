  md: '$\forall i\in A^P\quad G_{i,0}\leq U_i$


    Finally, the region priorities should be compliant with European guidelines, such
    as the 20-20-20 initiative that aims at achieving three ambitious targets by 2020:
    reducing by 20% greenhouse gas emissions, having a 20% share of the final energy
    consumption produced by renewable sources, and improving by 20% its energy efficiency.
    For this reason, we can impose constraints on the minimum amount of energy $L_{ren}$
    produced by renewable energy sources whose set of activities is referred to as
    $A^P_{ren}$. The constraint that we can impose is


    $\sum_{i\in A^P_{ren}} G_{i,0}\geq L_{ren}$


    # 12.4 THE REGIONAL ENERGY PLAN 2011–2013


    The constraint-based model described in previous sections has been used in the
    planning of the regional energy plan for 2011–2013. The system is implemented
    in the Constraint Logic Programming language ECL$^\mathrm{PS}$e [1], and in particular
    uses its Eplex library [15], which interfaces ECL$^\mathrm{PS}$e with a (mixed-integer)
    linear programming solver. The computation time is not an issue in this application,
    and it was hardly measurable on a modern computer.


    The regional energy plan had the objective of paving the way to reach the ambitious
    goal of the 20-20-20 directive, in particular having 20% of energy in 2020 produced
    by renewable sources. This amount considers not only electric power, but the entire
    energy balance in the region, including thermal energy and transports.


    Transports can use renewable energy by using renewable fuels, such as biogas (methane
    produced from the fermentation of vegetable or animal wastes) or oil produced
    from various types of crops. Currently, we do not consider this issue.


    Thermal energy can be used, for example, for home heating; renewable sources in
    this case are thermal solar panels (that produce hot water for domestic use),
    geothermal pumps (that are used to heat or to refresh houses), and biomass plants
    (that produce hot water used to heat neighboring houses during winter).


    The considered electric power plants that produce energy from renewable sources
    are hydroelectric plants, photovoltaic plants, thermodynamic solar plants, wind
    generators and, again, biomass power plants.'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'For each energy source, the plan should provide the following:


    +   - The installed power, in megawatts

    +   - The total energy produced in a year, in kTOE

    +   - The total cost, in M€.


    The ratio between installed power and total produced energy is mainly influenced
    by the availability of the source: while a biomass plant can (at least in theory)
    produce energy 24/7, the sun is available only during the day, and the wind only
    occasionally. For unreliable sources an average for the whole year is taken.


    The cost of the plant, instead, depends mainly on the installed power: a solar
    plant has an installation cost that depends on the square meters of installed
    panels, which on their turn can provide some maximum power (peak power).


    It is worth noting that the considered cost is the total cost of the plant for
    the regional system, which is not the same as the cost for the taxpayers of the
    Emilia-Romagna region. In fact, the region can enforce policies in many ways,
    convincing private stakeholders to invest in power production. This can be done
    with financial leverage, or by giving favorable conditions (either economic or
    other) to investors. Some power sources are economically profitable, so there
    is no need for the region to give subsidies. For example, currently in Italy,
    biomass is economically advantageous for investors, so private entities are proposing
    projects to build biomass plants. On the other hand, biomass also produces pollutants;
    they are not always sustainable (see [4] for a discussion) so local committees
    are rather likely to spawn against the construction of new plants. For these reasons,
    there is a limit on the number of licenses the region gives to private stakeholders
    for building biomass-based plants.


    Technicians in the region estimated (considering current energy requirements,
    growth trends, foreseen energy savings) the total energy requirements for 2020;
    out of this, 20% should be provided by renewable sources. They also proposed for
    this amount a percentage to be provided during the plan 2011 to 2013: about 177
    kTOE of electrical energy and 296 kTOE of thermal energy.


    Starting from these data, they developed a plan for electrical energy and one
    for thermal energy.'
