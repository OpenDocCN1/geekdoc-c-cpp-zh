  md: '![](img/644775a10ad87164013616d709050cee_284_0.png)


    FIGURE 8.13  (See color insert.) Output and estimated standard deviation.


    # 8.3.4.3 Multiple Sources


    Increasing the spatial diversity of the renewable sources will help smooth the
    volatility of the overall input, subject to there being enough interconnectivity
    in the grid. One can easily compute pairwise correlation between two time series,
    but how does one evaluate a group connectivity? Getz [20] developed the concept
    of correlative coherence to analyze the overall connectedness of movements of
    individual elephants in a herd. A similar method can be used to determine an overall
    correlation between the outputs of multiple wind farms [7]. First, take the correlation
    matrix R containing the pairwise correlations between the n sources. Its eigenvalues
    λᵢ, i = 1, …, n have the properties that 0 ≤ λᵢ/n ≤ 1, and


    $\sum_{i=1}^{n} \lambda_i/n = 1$


    Getz [20] presents a Shannon-Weaver measure of the diversity of eigenvalues, which
    gives us an idea of the degree to which the sources vary in concert with each
    other:


    $C(X^n)=1-\frac{1}{\ln(1/n)}\sum_{i=1}^{n}\left(\frac{\lambda_i}{n}\right)\ln\left(\frac{\lambda_i}{n}\right)$
    (8.9)'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'If all the off-diagonal elements have the same value r ∈ [0,1] and the diagonal
    elements are all unity, then the eigenvalues of the correlation matrix R(r) are
    λ_1 = 1 + (n−1)r and λ_i = 1 − r for i = 2,...,n. In this case, we have


    $$C_n(r) = \frac{(1+(n-1)r)\ln(1+(n-1)r)+(n-1)(1-r)\ln(1-r)}{n\ln n} \qquad (8.10)$$


    and so r is the solution of


    $$r = C_n^{-1}\left(C(X_n)\right) \qquad (8.11)$$


    The other option comes from Hoff and Perez [23], who provide a measure for the
    short-term power output variability resulting from an ensemble of equally spaced,
    identical photovoltaic systems. They construct the Relative Output Variability
    measure, defined as the ratio of the Output Variability for the ensemble to the
    Output Variability of the same PV fleet concentrated in a single location. The
    output variability is


    $$\sigma_{\Delta t}^N = \frac{1}{C}\sqrt{\operatorname{Var}\left[\sum_{n=1}^{N}\Delta
    P_{\Delta t}^{n}\right]} \qquad (8.12)$$


    where C is the total installed peak power of the ensemble and ΔP_{Δt}^n is a random
    variable that represents the time series of changes in power in the nth installation
    using a sampling time interval of Δt.


    # ### 8.4 PORTFOLIO ANALYSIS


    Delucchi and Jacobson [10] note that


    > > No...optimization analysis has been done for a 100% [wind, water, sun] system
    in a major region of the world (let alone for all regions of the world), so this
    clearly is a critical area for new research.


    The problem of choosing an optimal mix of electricity generation, storage, and
    efficiency policies is not very different from a portfolio optimization problem.
    Each decision alternative results in more or less electricity yield, and carries
    more or less cost, and more or less variability.


    A particular challenge is that the electricity industry requires very high levels
    of coordination between supply and demand at all times and at all'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'locations within the network. Traditional approaches to generation investment
    have modeled demand as an exogenous time series that needs to be met by some mix
    of conventional, controllable generation technologies. High renewable energy penetrations
    are not amenable to such approaches as they are not dispatchable in the conventional
    sense and, as noted earlier, they have highly complex, uncertain and correlated
    primary energy fluxes. Because of this, high penetrations will not only impose
    greater requirements on dispatchable generation (both renewable and non-renewable),
    but are also likely to require far greater demand participation to assist in managing
    supply shortfalls and excess supply. Portfolio tools for these challenges are
    far less advanced. There has been work on incorporating renewables into optimal
    generation mix tools [12, 39]. However, there is considerable progress required
    in this area, particularly in the context of optimizing the different possible
    mixes and locations of renewable energy resources. There are also interesting
    and challenging research needs on how energy storage and controllable loads can
    be appropriately integrated into these investment tools.


    The problem of choosing an optimal mix of electricity generation technologies
    will be modeled in a manner analogous to the problem of finding an optimal portfolio
    of investments. However, instead of a monetary yield and its variability, one
    must consider the energy output and its variability. The constraints of the problem
    will, of course, include the requirement that the energy yield equals or exceeds
    the demand, in addition to many other practical requirements.


    Suppose that, during a given, fixed time interval, the demand for electricity
    is $D$ megawatt-hours (MW-h) and we decide to supply a certain proportion of the
    demanded electricity from $n = 4$ different sources of energy: $(\varepsilon_1)$
    conventional, $(\varepsilon_2)$ solar, $(\varepsilon_3)$ wind and $(\varepsilon_4)$
    storage. Let


    $x_r =$ the proportion of $D$ allocated to source $\varepsilon_r$, $r = 1, \ldots,
    4$


    We require


    $$x_1 + x_2 + x_3 + x_4 = 1$$


    $$x_1, x_2, x_3, x_4 \geq 0$$


    Without loss of generality, we can interpret the demanded proportion $x_r$ as
    corresponding to the amount $a_r = x_rD$, in megawatt-hours, of electricity'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'to be obtained from source $ε_r$, for each $r = 1, ..., R$. However, each $ε_r$
    is a random variable whose probability distribution is not known precisely.


    Suppose, however, that we have historical data for $p$ earlier periods showing
    that when an amount $a_r := x_r D$ was allocated to the energy source $ε_r$, it
    yielded $x_{rk}D$ MW-h in period $k = 1, 2, ..., p$ in the past. We interpret
    this as a probability distribution.


    $ε_r$: $x_{r1}D$    $x_{r2}D$    $⋯$    $x_{rp}D$

    $P(ε_r = x_{rk}D)$:    $1/p$    $1/p$    $⋯$    $1/p$


    A weighted distribution could also be used. In the case of uniform weights, we
    can estimate the expected output from source $ε_r$ by


    $E_r := E(ε_r) = (D/p) Σ_{k=1}^{p} x_{rk}$    $r = 1, 2, 3, 4$


    Thus, if our “allocation portfolio strategy” is $x^T = (x_1, x_2, x_3, x_4)$,
    that means that the total energy supplied during this period is the random variable


    $ε := Σ_{r=1}^{4} ε_r x_r$    (8.13)


    whose expectation can be estimated by


    $E := E(ε) = Σ_{r=1}^{4} E(ε_r)x_r$    (8.14)


    Of course, the variability in $ε$ is a problem and hence, by analogy to Markowitz''s
    famous portfolio optimization problem, we may attempt to find $x^* = (x_1^*, x_2^*,
    x_3^*, x_4^*)$ that solves


    (EPVM) = energy portfolio variance minimization problem:


    $minVar(ε)$'
