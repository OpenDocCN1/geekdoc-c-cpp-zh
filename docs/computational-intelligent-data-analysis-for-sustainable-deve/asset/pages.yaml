    # ## 9.4 CLASSIFICATION OF POWER GRID FREQUENCY DATA STREAMS USING k-MEDIANS APPROACH


    This section describes a k-Medians approach for clustering and identifying disruptive
    events in spatially distributed data streams.


    # ### 9.4.1 k-Medians Approach Detecting Disruptive Events


    The frequency of the power system provides a great deal of information about the
    health of the system and the prevailing operating conditions. The frequency trend
    indicates the power balance of the system. When the amount of power generated
    is equivalent to the amount of power consumed, the system is in steady state and
    the frequency remains constant. If there is an imbalance in generation/consumption,
    the system responds by converting some of its kinetic energy to electrical energy
    to make up for the power imbalance, causing acceleration toward a new operating
    point. This acceleration can be seen as a change in frequency. An excess of generation
    causes the system to accelerate, resulting in an increase in frequency. An excess
    of load causes the system to decelerate, depressing the frequency. This change
    in frequency is proportional to the magnitude of power imbalance. This concept
    is demonstrated in Figure 9.5(a), which'
