  img_proc: true
- pgno: 89
  md: 'to environmental analysis, sector reclassification and aggregation are needed
    again to match environmental data and economic data. Therefore, sector aggregation
    is a practical and important task for environmentally extended analysis using
    MRIO models. By examining the magnitude of aggregation bias in carbon footprint
    accounting using an empirical MRIO model for Asian-Pacific economies, we have
    several conclusions.


    +   1. On average, aggregation of the AIO 2000 had moderate effects on carbon
    footprint accounting (with the absolute value of the mean error rates less than
    20%). However, the aggregation of some sectors can cause considerable bias (with
    extremely high absolute value of error rates, e.g., 479).


    +   2. Aggregation exerted more impacts on aggregated sectors than on unaggregated
    sectors. There is a tendency for the AIO 2000 that aggregation will cause overestimation
    of CFs for aggregated sectors and underestimation for unaggregated sectors.


    +   3. Different from other empirical literature to which concluded that aggregation
    bias increases with the level of aggregation (e.g., as suggested by Karaska (1968)
    and Hewings (1974)), we found that for the AIO 2000, the level of aggregation
    is not the key factor, but some specific sectors in specific regions do play a
    key role in affecting aggregation bias. The range of error rates can be narrowed
    sharply by excluding limited top-errors, for example, decreased from (−479, 166)
    to (−4, 4) when the top 300 results are excluded. For those who will excise the
    aggregation of the AIO 2000 for environmental analysis, the exclusion of specific
    sectors in their aggregation schemes can greatly improve the certainty of the
    accounting results.


    +   4. Although we identified some sectors that, if aggregated, generate a large
    aggregation error, identifying them by a priori approach is still lacking. Because
    sectoral carbon intensity, Leontief multiplier, and the level of final demand
    influence the aggregation errors simultaneously and nonlinearly based on Equations
    (3.12) through (3.14), it is difficult to provide a simple method to check, a
    priori, which sectors will have potential impacts. It is not included in the scope
    of this work but can form an important agenda for future research.'
  merge: -1
  img_proc: true
