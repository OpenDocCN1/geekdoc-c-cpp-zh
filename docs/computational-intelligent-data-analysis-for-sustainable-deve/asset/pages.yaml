    # 4.1 INTRODUCTION


    THE IMPACTS OF PRESENT and potential future climate change will be one of the
    most important scientific and societal challenges in the 21st century. Given observed
    changes in temperature, sea ice, and sea level, improving our understanding of
    the climate system is an international priority. This system is characterized
    by complex phenomena that are imperfectly observed and even more imperfectly simulated.
    But with an ever-growing supply of climate data from satellites and environmental'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'sensors, the magnitude of data and climate model output is beginning to overwhelm
    the relatively simple tools currently used to analyze them. A computational approach
    will therefore be indispensable for these analysis challenges. This chapter introduces
    the fledgling research discipline *climate informatics*: collaborations between
    climate scientists and machine learning researchers in order to bridge this gap
    between data and understanding. We hope that the study of climate informatics
    will accelerate discovery in answering pressing questions in climate science.


    Machine learning is an active research area at the interface of computer science
    and statistics, concerned with developing automated techniques, or algorithms,
    to detect patterns in data. Machine learning (and data mining) algorithms are
    critical to a range of technologies, including Web search, recommendation systems,
    personalized Internet advertising, computer vision, and natural language processing.
    Machine learning has also made significant impacts on the natural sciences, for
    example, in biology; the interdisciplinary field of bioinformatics has facilitated
    many discoveries in genomics and proteomics. The impact of machine learning on
    climate science promises to be similarly profound.


    The goal of this chapter is to define *climate informatics* and to propose some
    grand challenges for this nascent field. Recent progress on climate informatics,
    by the authors as well as by other groups, reveals that collaborations with climate
    scientists also open up interesting new problems for machine learning. There are
    a myriad of collaborations possible at the intersection of these two fields. This
    chapter uses both top-down and bottom-up approaches to stimulate research progress
    on a range of problems in climate informatics, some of which have yet to be proposed.
    For the former, we present challenge problems posed by climate scientists, and
    discussed with machine learning, data mining, and statistics researchers at *Climate
    Informatics 2011, the First International Workshop on Climate Informatics*, the
    inaugural event of a new annual workshop in which all co-authors participated.
    To spur innovation from the bottom-up, we also describe and discuss some of the
    types of data available. In addition to summarizing some of the key challenges
    for climate informatics, this chapter also draws on some of the recent climate
    informatics research of the co-authors.


    The chapter is organized as follows. First, we discuss the types of climate data
    available and outline some challenges for climate informatics, including problems
    in analyzing climate data. Then we go into further detail on several key climate
    informatics problems: seasonal climate'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'forecasting, predicting climate extremes, reconstructing past climate, and
    some problems in polar regions. We then discuss some machine learning and statistical
    approaches that might prove promising (and that were not mentioned in previous
    sections). Finally, we discuss some challenges and opportunities for climate science
    data and data management. Due to the broad coverage of the chapter, related work
    discussions are interspersed throughout the sections.


    # ## 4.2 MACHINE LEARNING


    Over the past few decades, the field of machine learning has matured significantly,
    drawing on ideas from several disciplines, including optimization, statistics,
    and artificial intelligence [4, 34]. Application of machine learning has led to
    important advances in a wide variety of domains ranging from Internet applications
    to scientific problems. Machine learning methods have been developed for a wide
    variety of predictive modeling as well as exploratory data analysis problems.
    In the context of predictive modeling, important advances have been made in linear
    classification and regression, hierarchical linear models, nonlinear models based
    on kernels, as well as ensemble methods that combine outputs from different predictors.
    In the context of exploratory data analysis, advances have been made in clustering
    and dimensionality reduction, including nonlinear methods to detect low-dimensional
    manifold structures in the data. Some of the important themes driving research
    in modern machine learning are motivated by properties of modern datasets from
    scientific, societal, and commercial applications. In particular, the datasets
    are extremely large scale, running into millions or billions of data points; are
    high-dimensional, going up to tens of thousands or more dimensions; and have intricate
    statistical dependencies that violate the “independent and identically distributed”
    assumption made in traditional approaches. Such properties are readily observed
    in climate datasets, including observations, reanalysis, as well as climate model
    outputs. These aspects have led to increased emphasis on scalable optimization
    methods [94], online learning methods [11], and graphical models [47], which can
    handle large-scale data in high dimensions with statistical dependencies.


    # ## 4.3 UNDERSTANDING AND USING CLIMATE DATA


    Profuse amounts of climate data of various types are available, providing a rich
    and fertile playground for future data mining and machine learning research. Here
    we discuss some of the varieties of data available, and'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'provide some suggestions on how they can be used. The discussion opens up some
    interesting problems. There are multiple sources of climate data, ranging from
    single-site observations scattered in an unstructured way across the globe to
    climate model output that is global and uniformly gridded. Each class of data
    has particular characteristics that should be appreciated before it can be successfully
    used or compared. We provide here a brief introduction to each, with a few examples
    and references for further information. Common issues that arise in cross-class
    syntheses are also addressed.


    # 4.3.1 *In-Situ Observations*


    *In-situ* measurements refer to raw (or only minimally processed) measurements
    of diverse climate system properties that can include temperatures, rainfall,
    winds, column ozone, cloud cover, radiation, etc., taken from specific locations.
    These locations are often at the surface (e.g., from weather stations), but can
    also include atmospheric measurements from radiosonde balloons, subsurface ocean
    data from floats, data from ships, aircraft, and special intensive observing platforms.


    Much of this data is routinely collected and made available in collated form from
    National Weather Services or special projects such as AEROCOM (for aerosol data),
    International Comprehensive Ocean-Atmosphere Data Set (ICOADS) (ocean temperature
    and salinity from ships), Argo (ocean floats), etc. Multivariate data related
    to single experiments (e.g., the Atmospheric Radiation Measurement (ARM) program
    or the Surface Heat Budget of the Arctic (SHEBA)), are a little less well organized,
    although usually available at specialized websites.


    This kind of data is useful for looking at coherent multivariate comparisons,
    although usually on limited time and space domains, as input to weather model
    analyses or as the raw material for processed gridded data (see next subsection).
    The principal problem with this data is their sparseness spatially and, in time,
    inhomogeneities due to differing measurement practices or instruments and overall
    incompleteness (not all variables are measured at the same time or place) [45,
    62].


    # 4.3.2 Gridded/Processed Observations


    Given a network of raw *in-situ* data, the next step is synthesizing those networks
    into quality-controlled regularly gridded datasets. These have a number of advantages
    over the raw data in that they are easier to work with, are more comparable to
    model output (discussed below), and have'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'fewer nonclimatic artifacts. Gridded products are usually available on 5° latitude
    by 5° longitude grids or even higher resolution. However, these products use interpolation,
    gap-filling in space and time, and corrections for known biases, all of which
    affect the structural uncertainty in the product. The resulting error estimates
    are often dependent upon space and time. Different products targeting the same
    basic quantity can give some idea of the structural uncertainty in these products,
    and we strongly recommend using multiple versions. For example, for different
    estimates of the global mean surface temperature, anomalies can be found from
    the National Climatic Data Center (NCDC), the Hadley Centre, and NASA [6, 33,
    90] that differ in processing and details but show a large amount of agreement
    at the large scale.


    # ### 4.3.3 Satellite Retrievals


    Since 1979, global and near-global observations of the Earth’s climate have been
    made from low-earth orbit and geostationary satellites. These observations are
    based either on passive radiances (either emitted directly from the Earth, or
    via reflected solar radiation) or by active scanning via lasers or radars. These
    satellites, mainly operated by U.S. agencies (NOAA, NASA), the European Space
    Agency, and the Japanese program (JAXA), and data are generally available in near-real-time.
    There are a number of levels of data, ranging from raw radiances (Level 1), processed
    data as a function of time (Level 2), and gridded averaged data at the global
    scale (Level 3).


    Satellite products do have specific and particular views of the climate system,
    which requires that knowledge of the “satellite-eye” view be incorporated into
    any comparison of satellite data with other products. Many satellite products
    are available for specific instruments on specific platforms; synthesis products
    across multiple instruments and multiple platforms are possible, but remain rare.


    # ### 4.3.4 Paleoclimate Proxies


