- pgno: 79
  md: 'as the size of the aggregate model. The intermediate demand after aggregation,
    $\bar{T}$, is an $m \times m$ square matrix. Each block on the diagonal, $\bar{T}^{rr}$,
    is an $n(r) \times n(r)$ square matrix. Off-diagonal matrices are basically rectangular,
    depending on the size of the supply region $r$ and the size of the demand region
    $s$ after aggregation. For example, the size of $\bar{T}^{rs}$ is $n(r) \times
    n(s)$.


    We define the aggregation matrix as follows:


    $$Z = \begin{bmatrix} z(1) & 0 & 0 & 0 \\ 0 & z(2) & 0 & 0 \\ 0 & 0 & \ddots &
    0 \\ 0 & 0 & 0 & z(k) \end{bmatrix}$$


    Each $z(r)$ on the diagonal is an $n(r) \times n$ block aggregation matrix. Each
    column of $z(r)$ must have one and only one “1,” with other entries being “0”;
    and each row must have at least one “1” (can be more than one “1”), with other
    entries being “0.” The placement of “1”s in a row indicate which sectors in the
    unaggregated model will be combined into a new sector in the aggregate model.
    If a matrix is pre-multiplied by $z(r)$, then the rows—but not the columns—of
    the original matrix are grouped into $n(r)$ sectors. A prime represents the transpose
    of a matrix or vector. Post-multiplying a matrix by $z(r)''$ will therefore aggregate
    the columns into $n(r)$ sectors.


    The relationships for intermediate demand, final demand, total output, and carbon
    intensity before and after aggregation are presented as follows:


    $$ZTZ'' = \bar{T} \qquad (3.4)$$


    $$Zx = \bar{x} \qquad (3.5)$$


    $$ZF = \bar{F} \qquad (3.6)$$


    $$[Z(c \otimes x)] \otimes (Zx)^{-1} = \bar{c} \qquad (3.7)$$


    $\otimes$ is the multiplication of corresponding elements. $c$ is a diagonal matrix
    of carbon intensity for the detailed model with $c^1$, $c^2$, … and $c^k$ on the
    diagonal. $\bar{c}$ is the corresponding diagonal matrix of carbon intensity after
    aggregation.'
