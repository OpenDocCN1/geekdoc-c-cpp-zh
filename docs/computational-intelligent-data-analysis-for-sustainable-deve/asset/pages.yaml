    # 7.4.6 Exploration and Comparison of Energy Datasets


    In previous sections, the focus was on automatic learning: (1) for models in prediction
    tasks (Section 7.4.3), (2) extraction of unexpected and novel patterns (Section
    7.4.4), and (3) disaggregation of devices by metadata extraction (Section 7.4.5).
    In contrast to these automatic techniques, many energy scenarios, such as Scenarios
    7.1 and 7.6, require manual exploration of data. Users want to understand the
    underlying data and use data management and analysis techniques to get an overview
    of their data. In many cases, they try to derive knowledge from the data by comparing
    two or more different datasets. Assisting these manual or semiautomated exploration
    tasks will be the main focus of the following discussion.


    Let us give some brief examples of semiautomated and manual tasks on energy data
    related to exploration and comparison:


    +   - *Exploration of energy trades.* For the energy market, it is crucial to
    know about the amount of trades with specific conditions. All market participants
    are interested in such manual selections to understand the market. They explore
    the trades with respect to some manually defined condition. For example, how many
    trades have been made with solar energy, in the last month, overall in Germany.
    Others might be interested in the overall volume of energy produced in wind parks
    in offshore regions located around the coast of Denmark. A third example might
    be the average capacity of energy storage facilities in Europe and how it evolved
    from 2010 to 2011. All these examples are user-driven queries on aggregated subparts
    of the data. Human experts design these queries and data management techniques
    must be designed for efficient processing.


    +   - *Comparison of different customer behaviors.* Many case studies [57] have
    looked at the difference in energy consumption for two or more given databases
    describing the energy behavior of different customers. One is interested in the
    characteristic behavior of one group of people (or devices, facilities, etc.)
    compared to a second group. These characteristic differences are used to understand
    the customer population. In other cases, the two contrasting data states are “before”
    and “after” an energy-saving campaign. Thus, comparison'
