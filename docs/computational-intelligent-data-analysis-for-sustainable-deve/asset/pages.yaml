    # 11.4 SUMMARY AND CONCLUSION


    In this chapter we presented a novel application of quantitative tools from fields
    such as mathematics, physics, and signal processing that can be used to analyze
    spatial and temporal patterns behavioral datasets. Basic analytic and statistical
    techniques revealed periodicities and cycles within the data that were then explored
    further by higher-resolution techniques. Due to a low signal-to-noise ratio, we
    adopted results from Random Matrix Theory as a suitable null model to construct
    significance tests. These tests revealed definite structure in the eigenvalue
    spectra of our correlation matrices.


    Given the large portion of daily crime rates that can be explained by regressing
    data onto the day of the week, it is possible that these results reflect police
    procedures such as scheduling more officers on Mondays than Sundays. Differences
    in high crime days across types of crime, however, may suggest that different
    types of crime may represent unique aggregate behaviors. Another interesting result
    from our analysis is the lack of correlation between these different crime types.
    Broken windows and social disorganization theories postulate that an influx of
    minor offenses such as graffiti and vandalism might lead to an increase in more
    serious crimes such as assaults or gun violence. We find no evidence of this for
    short time scales. This is not to say, however, that no relationship exists. Due
    to data constraints, we have only looked for interaction on time scales of up
    to 30 days. It may be that these types of flows happen on the monthly or yearly
    time scale.


    With 10 years of theft crime data, we are able to look for correlations on a weekly
    scale. Examining the eigenvalue and eigenvectors of correlation matrices, we perform
    a type of Principle Component Analysis where significance is determined by comparison
    to results from Random Matrix Theory. We find that the largest eigenvalue and
    corresponding eigenvector can be interpreted as a citywide force that acts on
    all locations equally. Removing the influence of this dominating factor, we found
    a number of significant eigenvalues and vectors. Examining the component structure
    of these eigenvectors, we showed that they correspond to neighborhoods'
