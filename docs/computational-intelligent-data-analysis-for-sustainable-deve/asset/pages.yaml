    sectors. The range of confidence intervals were between −0.102 and 0.746 for aggregated
    sectors, and between −0.506 and 0.14 for unaggregated sectors.


    Comparing results for the two groups, and except for a few cases, the range of
    error rates was larger and the mean levels were higher for the aggregated sectors
    than for the unaggregated sectors. This indicates that aggregation has more impact
    on aggregated sectors than on unaggregated sectors. In addition, positive mean
    values for aggregated sectors indicate that, on average, aggregation of the AIO
    2000 led to overestimation of CFs for aggregated sectors. Negative mean values
    indicate that there is a tendency of underestimation of the CFs for the nonaggregated
    sectors when other sectors are aggregated.


    For individual economies, aggregation of sectors, on average, may influence CF
    accounting of China, Indonesia, and the USA more than other economies. From the
    range of error rates and the standard deviation of aggregated sectors, we can
    find that the aggregation of some sectors in China, Thailand, and the Philippines
    will have considerable impacts. For Indonesia, the aggregation of sectors within
    the country will have large effects on some specific unaggregated sectors (Table
    3.3).


