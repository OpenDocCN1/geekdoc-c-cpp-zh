  md: 'To build Eora, the problem of generating a table that adheres to all specified
    constraints (balancing, conflicting data and/or others) was taken in one step.
    Reconciling the data in order to fulfill any given external condition was achieved
    by interpreting this problem as a mathematically constrained optimization problem.


    We begin the process of building Eora by constructing an initial version of the
    table using raw data from a number of different sources. Let’s call this version
    of MRIO the Raw Data Table. If all these different data sources coincided, the
    MRIO would be finished. But most likely, the challenges described in the previous
    section will hold: the MRIO will violate our specified constraints.


    # ### 2.4.1 Reliability Information


    In order to approach the problem, we first have to introduce reliability data.
    The Maximum Entropy Principle introduced by Jaynes (1957) asserts that an IO-transaction
    is a random variable with a best guess and an associated reliability. IO tables
    are assembled carefully by statistical bureaus but still the individual inter-sectoral
    transaction values are not 100% certain. Hence, both elements of the MRIO and
    external conditions are subject to a certain, individual reliability. Additionally,
    the elements of an MRIO can be assumed to be normally distributed and statistically
    independent from one another. Therefore, each transaction can be interpreted as
    the best guess of the corresponding variable, and the reliability is expressed
    in the standard deviation of this random variable. A transaction value with large
    reliability corresponds to a very small standard deviation; a less reliable transaction
    value corresponds to a larger standard deviation. Usually, reliability information
    is not provided for every transaction of an MRIO. In this case, the standard deviation
    values can be estimated. In general, it can be assumed that larger values are
    far more reliable than smaller values. A good approximation is to define the standard
    deviation of the largest value in an MRIO to be 3% of its own absolute value,
    and 200% for the smallest value of the MRIO. The standard deviation of the remaining
    values can then be calculated by a logarithmic function whose coefficients must
    be calculated by the user. Lenzen et al. (2010) give a detailed motivation and
    explanation of this strategy. Additionally the reliability of some constraints
    might be known. For example, the balancing condition must be exact; otherwise
    an MRIO cannot represent an economy appropriately (see Leonteif, 1986). This means
    that the corresponding standard deviation of the balancing constraints is 0. Constraints
    with a standard deviation of'
