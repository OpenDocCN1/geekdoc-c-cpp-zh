  md: '# 11.3.2 Auto- and Cross-Correlation


    In order to perform higher-resolution analysis, we make use of the scalable lattice
    and census tracts as described in previous sections. Regardless of the spatial
    unit used, we create a time series for each point. The time series are then normalized
    to have zero mean and unit variance so that we may compare locations across the
    city regardless of the absolute number of crimes. We select two time series, y₁
    and y₂, from the conditioned data and look for correlations between them.


    The cross-correlation, r₁,₂, is a measure of similarity between a pair of time
    series. Mathematically, this quantity is defined as the expectation of the inner
    product between the two time series:


    $$r_{1,2} = E[\langle y_1,y_2\rangle] = \sum_{t=1}^{n} y_1(t)y_2(t)$$


    Similarly, it is possible to determine lagged correlation by shifting one series
    by a number of lags, m. The lagged cross-correlation, r₁,₂(m), is given by modification
    of the previous formula,


    $$r_{1,2}(m) = \sum_{t=1}^{n} y_1(t+m)y_2(t)$$


    The cross-correlation values are then normalized to lie between −1 and 1, where
    r₁,₂ = 1 corresponds to exact correlation between two time series. A cross-correlation
    sequence is defined as the sequence of cross-correlation values over a range of
    lags. Examining the cross-correlation sequence for two time series, we can identify
    the existence of a significant relationship as well as quantify its power over
    a number of lags. Not only can these measures detect the flow of crime from one
    area to another, but they can also quantify its speed and direction.


    We must also define a plausible test for significant correlations to differentiate
    between real and random connections. To achieve this, we create a null model for
    each pair of time series. Each series is randomly permuted, preserving the mean
    and distribution of counts, but scrambling the order and removing any correlations
    in time. The new cross-correlation value is then computed. Repeating this process
    a large number of times, we construct a distribution of random cross-correlation
    values from which'
