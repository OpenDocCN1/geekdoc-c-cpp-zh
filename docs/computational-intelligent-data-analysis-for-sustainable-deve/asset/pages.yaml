    # 2.4.5 Formulating the Constrained Optimization Problem


    Let us call the Raw Data Table T^0 and the Final MRIO (that is yet to be calculated)
    T. Let a^0 be the vectorization of T^0 and let a be the vectorization of T.


    Recall the concept of the optimization problem that was stated before:


    > > Find a Final MRIO that fulfills all external conditions while minimally disturbing
    the Raw Data Table.


    With the concepts that were developed so far, the mathematical expression of the
    statement “MRIO that fulfills all external conditions” is simply given by


    **Ga = c**


    This system of equation is usually underdetermined, which means that there are
    more unknowns (in this case, the number of elements in the MRIO) than constraints.
    Hence, there is usually more than one solution that adheres to the constraints
    (i.e., the Final MRIO is not uniquely defined by the constraints).


    What remains to be interpreted mathematically is what it actually means to “consider
    the Raw Data Table as well as possible.”


    As a^0 and a are vectorized representations of the Raw Data Table and the Final
    Table, the change applied to the Raw Data Table a^0 in order to adhere to the
    given constraints can be “measured” by a so-called objective function f(a^0, a).
    Because the system of constraints equation allows more than one solution, the
    optimizer is designed to find that solution which'
