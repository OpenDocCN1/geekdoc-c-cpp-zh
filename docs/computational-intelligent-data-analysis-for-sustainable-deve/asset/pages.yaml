  md: 'illustration of the effort that is necessary to ensure good and accurate data
    so that effective answers can be obtained in data analysis. However, no matter
    what analysis tool is being used, the principle is the same: garbage in, garbage
    out. In many cases, a large dataset is one that has many cases or records. Sometimes,
    however, the word “large” can refer to the number of variables describing each
    record. The latter introduces the curse of dimensionality [16]. Artificial neural
    network and kernel methods map input data into a high-dimensional feature space
    to convert the nonlinear problem to a linear approximation. The price of doing
    such mapping is the curse of dimensionality. Dimension reduction is a set of techniques
    to combine or transform the input data to eliminate less important features.


    In scientific communities, the word “experiment” describes an investigation in
    which (some of) the potentially influential variables can be controlled. Typically,
    it is not possible to control all the potentially influential variables. To overcome
    this, subjects (or objects) are randomly assigned to the classes defined by those
    variables that one wishes to control.


    As a summary, there are two main players in the computational intelligent data
    analysis: (1) computational intelligent data analysis techniques and (2) human
    analysts. The technique must be efficient enough to process a large amount of
    data, accurate enough to find the best solution, and reliable enough to resist
    noise. Human analysts need to understand the problems, define the criteria, and
    choose the right techniques and analyze the outcomes.


