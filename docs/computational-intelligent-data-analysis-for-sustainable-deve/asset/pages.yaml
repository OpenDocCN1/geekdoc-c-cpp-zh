- pgno: 87
  md: 'certainty of CE accounting using the AIO 2000. By ranking the absolute value
    of error rates for aggregated sectors, we identified those sectors whose aggregation
    may cause large bias (an example of top 30 results are shown in Appendix 3B).


    Among the top 300 samples, with the absolute value of error rates ranging from
    479 down to 1.85, 140 occurred in Mainland China (accounting for 46.7% of top
    300 aggregation results), 105 in the Philippines (35%), 22 in Indonesia (7.3%),
    14 in Malaysia (4.7%), 13 in Korea (4.3%), and 3 (1%) in Japan and Singapore,
    respectively. Among 140 top aggregation errors in Mainland China, 87 aggregation
    schemes included the sector of “iron and steel” and 25 aggregation schemes included
    the sector of “chemical fertilizers and pesticides.” For the Philippines, 104
    results out of 105 top-error aggregation schemes included the sector of “crude
    petroleum and natural gas.” For Indonesia, 20 out of 22 top-error aggregation
    schemes included the sector of “iron and steel.” For Malaysia, 13 out of 14 top-error
    aggregation schemes included the sector of “non-metallic ore and quarrying.” Korea
    did not show such high concentrations over particular sectors. Among 13 top-error
    aggregation schemes, sector “timber” appeared 5 times. For Japan, sector “cement
    and cement products” appeared twice out of 3 top-error aggregation schemes. For
    Singapore, sector “electricity and gas” and sector “building construction” occurred
    twice (nonexclusively) among 3 top-error aggregation schemes.


    For unaggregated sectors, we conducted similar experiments by ranking the absolute
    value of error rates. Among the top 300 results, with the range from 16.585 down
    to 4.16, sector “milled grain and flour” in Indonesia (occurred 282 times) was
    influenced the most by different aggregations of other sectors in the region.


    We compared the minimum value, maximum value, mean, and standard deviation for
    all the simulations with and without the 300 top-error results (see Table 3.4
    and Table 3.5). It can be found that the absolute levels of the minimum value
    and the maximum value decreased sharply, in particular for China, Thailand, the
    Philippines, Indonesia, Malaysia, and Japan, which have high occurrence in 300
    top-error results. Because of the large number of samples, the mean levels did
    not have obvious changes. Standard deviations, also because of the large number
    of samples, did not change for most of the regions, except for China and Thailand,
    for which levels decreased considerably.'
