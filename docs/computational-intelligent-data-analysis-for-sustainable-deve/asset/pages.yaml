  md: 'renewable energy is available, this amount of energy can be considered a virtual
    production, energy storage, or buffer. Respective load-shifting programs and implementations
    are frequently referred to as *demand response*.


    In future scenarios, however, the situation can be even more severe. When large
    shares of electricity production come from renewable fluctuating sources, it might
    happen that the total production becomes larger than the total demand. If the
    demand (including energy storage facilities) cannot be shifted to such periods
    anymore, even the production of renewable energy must be stopped, which makes
    its generation less efficient. This furthermore brings in the potential to substantially
    damage the energy generation and grid infrastructure.


    +   2. *Distributed generation.* Future energy generation will be more distributed.
    Today, it builds on a comparatively small number of large, central power plants.
    These power plants feed in energy from a higher voltage level to a lower voltage
    level, resulting in a unidirectional power flow. In the future, in particular
    due to the rise of renewable energies, the number of power-generating units is
    likely to rise dramatically and to be a lot more distributed. On the one side,
    this is due to the increasing number of photovoltaic systems installed on private
    and industrial buildings and also to wind turbines that are not always part of
    larger wind parks. On the other side, small biogas-based power plants and *co-generation
    units (combined heat and power units (CHP units))* are becoming more and more
    popular. CHP units can contribute to a more sustainable energy generation too.
    This is because they are more efficient compared to pure fossil-based generation
    of electricity, which does not make use of the waste heat. In addition, they potentially
    can be used to generate energy when production is low. In particular, so-called
    *micro-CHP units* are increasingly installed in private houses, partly triggered
    by incentives from government programs. These developments turn many *consumers*
    into so-called *prosumers*. Prosumers are consumers owning, for example, photovoltaic
    systems or micro-CHP units generating energy that is fed into the electricity
    grid if it exceeds their own demand.


    *Demand response* is considered an element of the broader field of *demand-side
    management*, which also includes energy efficiency measures [110].'
