    # 11.2.1 Conditioning the Data


    Behavioral information must be transformed into variables that can be manipulated
    numerically. While time and place readily lend themselves to such analysis, the
    type of crime being reported must be inferred from its police description. While
    the first part of the dataset contains theft-related crimes only, for richer 1999
    data, crimes are aggregated into six broader categories by parsing police descriptions
    for keywords as described in Table 11.2. Aggregation ensures that there are sufficient
    numbers of events to populate time series, while still making use of nearly 75%
    of the data available in that year.


    We measure crime densities with two different methods of spatial aggregation.
    In the first, a lattice is laid over a map of the city, and crimes are aggregated
    to the nearest grid point. In general, any mesh size can be used, but our analysis
    suggests that a grid producing 50 to 100 locations across the city provides good
    noise reduction without obscuring patterns.'
