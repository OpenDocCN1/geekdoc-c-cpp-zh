- pgno: 392
  md: '# 12.1 THE PROBLEM


    PUBLIC POLICY ISSUES ARE extremely complex, occur in rapidly changing environments
    characterized by uncertainty, and involve conflicts among different interests.
    Our society is ever-more complex due to globalization, enlargement, and the changing
    geopolitical situation. This means that political activity and intervention become
    more widespread, and so the effects of its interventions become more difficult
    to assess, while at the same time it is becoming ever-more important to ensure
    that actions are effectively tackling the real challenges that this increasing
    complexity entails. Thus, those responsible for creating, implementing, and enforcing
    policies must be able to reach decisions about ill-defined problem situations
    that are not well understood, have no single correct answer, involve many competing
    interests, and interact with other policies at multiple levels. It is therefore
    increasingly important to ensure coherence across these complex issues.


    In this chapter, we consider, in particular, policy issues related to regional
    planning, the science of the efficient placement of activities and infrastructures
    for the sustainable growth of a region. Regional plans are classified into types,
    such as Agriculture, Forest, Fishing, Energy, Industry, Transport, Waste, Water,
    Telecommunication, Tourism, Urban Development, and Environment, to name a few.
    Each plan defines activities that should be carried out during the plan implementation.
    On the regional plan, the policy maker must take into account impacts on the environment,
    the economy, and the society. The procedure aimed to assess the impacts of a regional
    plan is called Strategic Environmental Assessment (SEA) [14] and relates activities
    defined in the plan to environmental and economic impacts. This assessment procedure
    is now manually implemented by environmental experts, but it is never applied
    during the plan/program construction. In addition, this procedure is applied on
    a given, already instantiated plan. Taking into account impacts a posteriori enables
    only corrective interventions that can, at most, reduce the negative effect of
    wrong planning decisions.


    One important aspect to consider when supporting policy makers with Computational
    Intelligence approaches is the definition of formal policy models. In the literature,
    the majority of policy models rely on agent-based simulation [9, 12, 17], where
    agents represent the parties involved in the decision-making and implementation
    process. The idea is that agent-based'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Modeling and simulation is suitable for modeling complex systems. In particular,
    agent-based models permit carrying out computer experiments to support a better
    understanding of the complexity of economic, environmental, and social systems,
    structural changes, and endogenous adjustment reactions in response to a policy
    change.


    In addition to agent-based simulation models, which provide “individual-level
    models,” we claim that the policy planning activity needs a global perspective:
    in the case of regional planning, we need “a regional perspective” that faces
    the problem at a global level while tightly interacting with the individual-level
    model. Thus, rather than proposing an alternative approach with respect to simulation,
    we claim that the two approaches should be properly combined as they represent
    two different perspectives of the same problem: the individual and the global
    perspective. This integration is the subject of our current research activity.
    In this setting, regional planning activities can be cast into complex combinatorial
    optimization problems. The policy maker must take decisions satisfying a set of
    constraints while at the same time achieving a set of (possibly conflicting) objectives
    such as reducing negative impacts and enhancing positive impacts on the environment,
    the society, and the economy. For this reason, impact assessment should be integrated
    into the policy model so as to improve the current procedure performed *a posteriori*.


    In previous work [7] we experimented with two different technologies to address
    the Strategic Environmental Assessment of a regional plan, that is, assessing
    the effects on the environment of a given plan. The technologies we applied were
    Constraint Logic Programming (CLP) [11] and Causal Probabilistic Logic Programming
    [18]. Gavanelli et al. [8] proposed a fuzzy model for the SEA. While being far
    more expressive than a traditional CLP approach, it is less usable within a regional
    planning decision support system. We evaluated a previous regional plan with the
    two models, and proposed the outputs to an environmental expert. The expert compared
    the two outputs and chose the CLP model as closest to a human-made assessment.


    In this work we extend the CLP model used for the assessment and apply it to the
    planning problem—that is, deciding which actions should be taken in a plan. In
    the model, decision variables represent political decisions (e.g., the magnitude
    of a given activity in the regional plan), potential outcomes are associated with
    each decision, constraints limit possible combinations of assignments of decision
    variables, and objectives'
  merge: -1
  img_proc: true
- pgno: 394
  md: '(also referred to as criteria) can be used either to evaluate alternative solutions,
    or be translated into additional constraints. The model has been solved with Constraint
    Logic Programming [11] techniques, and tested on the Emilia-Romagna regional energy
    plan. The results have been validated by experts in policy making and impact assessment
    to evaluate the accuracy of the results.


    Further constraint-based approaches have been proposed for narrower problems in
    the field of energy, such as locating biomass power plants in positions that are
    economically affordable [2, 5, 6] and environmentally sustainable [4]. Other approaches
    have been applied to wind turbine placement [10]. The problem faced in this chapter
    is much broader, as the region should decide which strategic investments to perform
    in the next 2 to 3 years (with a longer vision to 2020) in the energy field. All
    specific details are left to the implementation of the plan, but are not considered
    at the Regional Planning stage. To the best of our knowledge, this is the first
    time that constraint-based reasoning has been applied to such a wide and strategic
    perspective.


    # 12.1.1 Regional Planning and Impact Assessment


    Regional Planning is the result of the main policy-making activity of European
    regions. Each region has a budget distributed by the Operational Programme (OP);
    an OP sets out each region’s priorities for delivering the funds. On the basis
    of these funds, the region has to define its priorities: in the field of energy,
    one example of priority is increasing the use of renewable energy sources. Then,
    a region should decide which activities to insert in the plan. Activities may
    be roughly divided into six types:


    +   1. Infrastructures and plants

    +   2. Buildings and land use transformations

    +   3. Resource extraction

    +   4. Modifications of hydraulic regime

    +   5. Industrial transformations

    +   6. Environmental management


    Also, a magnitude for each activity should be decided, describing how much of
    a given activity is performed.'
