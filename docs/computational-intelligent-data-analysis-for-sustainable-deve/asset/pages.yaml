  md: '# 9.5 IDENTIFYING GRID DISRUPTIONS USING TIME-SERIES CHANGE DETECTION


    A challenge associated with the identification of grid disruptions is to detect
    the events as early as possible. The *k*-Medians approach discussed in Section
    9.3 requires data before and after the actual event to reliably identify an event.
    This constraint might render the approach undesirable for real-time decision-making
    applications. This section describes a faster method to identify grid disruptions
    in individual data streams that applies a time-series change detection algorithm
    to identify significant changes.


    Time-series change detection has been a much researched area in statistics, especially
    in the context of *statistical quality control* [19, 20]. Recently, several data
    mining approaches have been proposed to identify changes in time series [21, 22].
    But many of these approaches are either not online or are not scalable to the
    high throughput data as encountered in this domain.


    An approach based on the widely used quality control method called cumulative
    sum control chart (CUSUM) [23] for time-series change detection is discussed here.
    Change detection has been extensively studied in the context of time-series analysis
    and forecasting. The standard approaches include various smoothing techniques,
    the Box-Jenkins autoregressive integrated moving average (ARIMA) modeling, innovation
    and outlier analysis, and more recently, wavelet-based methods.


    # 9.5.1 A CUSUM-Based Fast Time-Series Anomaly Detection Method


    In this subsection a CUSUM-based methodology to identify anomalies in a univariate
    time series is discussed. The exact problem can be defined as:


    Given a regularly sampled time series $T$, such that, each value $T_p$ is the
    measurement at time $t$, for a given sensor, identify spans of the form $[t_1,t_2]$,
    such that the underlying system is in an anomalous state from time $t_1$ to $t_2$.


    While traditionally CUSUM is used to identify changes in a time series, it can
    be adapted for anomaly detection in time series. The core idea behind CUSUM is
    that one can use it to identify the start and the end of an anomalous regime in
    a given time series by identifying a change point.


    The CUSUM approach is a sequential method that involves calculation of a cumulative
    sum. For a given time series, at a given time $t (> 1)$, the following two quantities
    are computed:'
  merge: -1
  img_proc: true
- pgno: 316
  md: '$$S_t^+ = \max(0, S_{t-1}^+ + (T_t - \omega_t))$$


    $$S_t^- = \max(0, S_{t-1}^- + (\omega_t - T_t))$$


    The quantity $\omega_t$ is the weight assigned at each time instance. While this
    can be dependent on $t$, it is set to


    $$\omega_t = \mu_0 + k|\mu_0 - \mu|$$


    where $\mu_0$ denotes the expected mean of the in-control distribution of $T$,
    while $\mu$ denotes the minimum shift that needs to be detected. The method has
    one parameter, the *allowance value* $k$, which is typically set to 0.5 or 1.
    The allowance value $k$ governs how much deviation from the expected mean is allowed.
    If a process is naturally noisy, $k$ is typically set higher, while for a relatively
    stable process $k$ is set to a low value.


    The process is initialized with


    $$S_1^+ = \max(0, T_1 - \omega_1)$$


    $$S_1^- = \max(0, \omega_1 - T_1)$$


    The $S^+$ statistic monitors the changes in the positive direction (also sometimes
    referred to as “high-side” CUSUM), and the $S^-$ statistic monitors the changes
    in the negative direction (also sometimes referred to as “low-side” CUSUM). For
    monitoring grid disruptions, the low-side CUSUM is relevant because one is interested
    in detecting events in which the frequency of the power falls down.


    Figure 9.6 denotes a simple example that illustrates the CUSUM-based anomaly detection
    on a synthetically generated time-series dataset. The first 100 and last 100 points
    in the time series are generated from a normal distribution with mean 0 and standard
    deviation 1. The points from time 101 to 200 are generated from a normal distribution
    with mean −0.25 and standard deviation 1. It can be seen that although the anomalous
    region is indistinguishable to the naked eye, the CUSUM-based approach can still
    identify the anomalous region. During the anomalous state, the CUSUM score increases
    and starts falling down once the time series is in the normal state.


    Computationally, this approach is fast because it requires a constant time operation
    at every time second, and it is also memory efficient, as we'
  merge: -1
  img_proc: true
- pgno: 317
  md: '![](img/644775a10ad87164013616d709050cee_317_0.png)


    FIGURE 9.6 A random time series with anomalous region and CUSUM scores.


    only need to maintain the value of the CUSUM statistic of the previous time instance.


    The key issue with this approach is that the output of CUSUM requires a threshold
    to declare when the system is in an anomalous state. If the threshold is set very
    low, the false positive rate is high; and when the threshold is set high, it might
    result in a delay in identifying an event. To alleviate this problem, the quality
    control literature provides a way to set the threshold based on the *Average Run
    Length* (ARL) metric. Typically, the threshold is set based on the number of expected
    events in an in-control process.


    # ### 9.5.2 Results on Grid Data


    This section summarizes the performance of the CUSUM-based anomaly detector, as
    described in the previous section, on frequency data collected from the FDR sensors
    described in Section 9.3 of this chapter. The objectives of these experiments
    are as follows:


    +   1. Can the CUSUM based approach identify useful events?

    +   2. What is the typical false alarm rate?


    # #### 9.5.2.1 Data Description and Algorithm Parameters


    For the results shown in this section, data came from 21 FDRs located within the
    Eastern Interconnect (EI) of the United States. Data for 2 months (May 2008 and
    June 2008, total 61 days) are used. The time'
