  md: 'New computing and data storage technologies not only enhance traditional data
    analysis tools, but also change the landscape of data analysis by raising new
    challenges. Because computer techniques are able to store and process the latest
    data and information with milliseconds delay, computational intelligent data analysis
    addresses a new problem: how do we efficiently and correctly include the latest
    data, update models, adapt to the new circumstance, and eventually provide sufficient
    evidence to make timely and correct decisions?


    Another motivation for computational intelligent data analysis has been the inability
    of conventional analytical tools to handle, within reasonable time limits, the
    quantities of data that are now being stored. Computational intelligent data analysis
    is thus being seen as a useful method of providing some measure of automated insight
    into the data being collected. However, it has become apparent that while some
    useful patterns can be discovered and the discipline has had a number of notable
    successes, the potential for either logical or statistical error is extremely
    high. As a result, much of the computational intelligent data analysis is, at
    best, a set of suggested topics for further investigation [12]. The high unreliability
    of the results is a major concern to many applications—for example, financial
    investment. In these fields, the decision must be made prudently and transparently
    to avoid any catastrophe. Trial and error is unacceptable.


    Computational intelligent data analysis has its origins in statistics and machine
    learning. As a study, it is not a haphazard application of statistical and machine
    learning tools, and not a random walk through the space of analytics technique,
    but rather a carefully planned and considered process of deciding what will be
    most useful and revealing. The process of data analysis can be considered as having
    two distinct forms: (1) the analytical (or modeling) approach in which the real
    world is modeled in a mathematical manner, from which predictions can be computed
    in some way, and (2) pattern matching, or the inductive approach in which prediction
    is made based on experience [12].


    Whereas statistics induction starts with the latter and aims to translate the
    process into one that is predominately the former, machine learning largely takes
    place in the latter. Given a set of observations, machine-learning algorithms
    form the null hypothesis space and search this large hypothesis space to find
    the optimal hypothesis. This is as close as one can get to achieving the underlying
    true hypothesis, which may or may not be in the hypothesis space. The fallacy
    of induction comes into play when the hypothesis developed from the observations
    resides in a different part of'
