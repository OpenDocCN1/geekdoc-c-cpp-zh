    # 11.1 INTRODUCTION


    An enormous amount of behavioral data is now being generated and stored by billions
    of individuals across countries and cultures. The ubiquity of mobile sensors from
    laptops to cellular phones has ushered in a new age of digital data storage and
    management. It is now possible to measure social systems on a massive scale. Mobility
    patterns of city dwellers can be inferred from mobile phone use [4], epidemics
    can be'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'modeled across distances of many orders of magnitude [20], and the diffusion
    of information can be measured for large populations [10]. Armed with this flood
    of data, there are very real and important opportunities to study and ultimately
    facilitate sustainability in human-built systems. Insight into these systems can
    help inform the social sciences from economics to sociology as well as provide
    policy makers with critical answers that may be used to better allocate scarce
    resources or implement beneficial social programs.


    In order to generate these new and hopefully better solutions, however, it has
    become necessary to use broader combinations of tools to analyze the immense and
    rich stream of information. The goal is to use this data to gain a better understanding
    of the systems that generate it. In this chapter we present a novel application
    of tools and analytical techniques developed from a variety of disciplines that
    identify patterns and signals that capture fundamental dynamics of a social system.
    To explore relationships in both space and time, cross- and auto-correlation measures
    are combined with autoregressive models and results from random matrix theory
    to analyze patterns in behavioral data. Similar techniques have been applied recently
    to partition space based on patterns observed in mobile phone data or Wi-Fi activity
    [2, 14]. We show that these techniques can also be applied to criminal activity.


    The dataset used for this study consists of criminal events within the city of
    Philadelphia from the year 1991 through 1999. It contains nearly 1 million individual
    criminal offense reports detailing the time, place, and police response to theft,
    robbery, and burglary-related crimes. In addition to these minor offenses, for
    the year 1999, the dataset includes major offenses as well, covering crimes from
    petty theft through homicide. With these reported crimes, we examine spatial,
    temporal, and incident information. The goal of our analysis is to explore the
    spatio-temporal dynamics of criminal events with the hope of identifying patterns
    that may be useful in predicting and preventing future criminal activity. Beyond
    applications to criminology, however, we feel that these techniques can be applied
    to a wide range of systems that exhibit complex correlations in many dimensions
    and on multiple scales.


    Early work in criminology, sociology, psychology, and economics explored relationships
    between criminal activity and socioeconomic variables such as education, community
    disorder, ethnicity, etc. [8, 21]. Constraints on the availability of data limited
    these studies to aggregate statistics for large populations and vast geographic
    regions. Wilson and'
