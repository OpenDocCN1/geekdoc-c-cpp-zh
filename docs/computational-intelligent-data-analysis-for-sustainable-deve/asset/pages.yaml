- pgno: 188
  md: '![](img/644775a10ad87164013616d709050cee_188_0.png)


    FIGURE 6.2 Map of Bradford County projects.


    the course of the program, while Cambria County has received $17,000 annually.
    These three counties were recommended by state program personnel for analysis
    because the local officials were most willing to cooperate by sharing their data,
    and these counties were the most representative of the range of counties participating
    in the program. Data on the completed projects and fund distributions were provided
    by the Center for Dirt and Gravel Road Studies (CDRGS, 2009). Data on the submitted
    projects and procedures for Bradford County by year were obtained from the Bradford
    County Conservation District (BCCD) (M. Lovegreen, BCCD Director, personal communication,
    November 2, 2009). A map of potential and funded projects is displayed in Figure
    6.2.


    Because Cambria and Carbon Counties receive limited funds each year (less than
    $30,000, while many projects cost more than $50,000), their project choices are
    limited and they use less-complex decision criteria. Cambria County issued a call
    for projects when the program was first initiated and has since worked its way
    through the initial applicants and funded all of the projects that met the state’s
    criteria. Carbon County does not officially advertise the program, and it funds
    any appropriate project that the conservation district manager comes across during
    the course of his duties. These processes are difficult to approach with a binary
    program as the counties have maintained no data on projects that were not funded.
    That is not to say that the selection processes they use are in any way optimal;
    but because there is little data on alternative projects, it is impossible to
    say how much opportunity was missed by not soliciting new projects on a regular
    basis.'
