  md: 'attribute combinations as descriptions. Based on this general idea of subspace
    mining in arbitrary projections of the data, several preprocessing techniques
    for the selection of subspaces have been proposed [33, 74]. They try to measure
    the contrast between outliers and the clustered regions of a database. A first
    approach proposes a selection based on the entropy measure [33]. A subspace is
    selected if it has low entropy, that is, if it shows a large variation in the
    densities. More recent approaches have focused on statistical selection of high-contrast
    regions [74]. They compare the deviation of densities and utilize only the most
    significant subspaces. Such subspaces can be seen as the reasons for high deviation.
    In our example, high-contrast subspaces might be “energy consumption of heating
    devices” and “age of the refrigerator.” This combination might be characteristic
    for the distinction of modern versus old households and might reveal some unexpected
    cases with old refrigerators (that should be exchanged) in an energy-efficient
    house. This example shows that it is important to detect these cases. However,
    it is even more important to provide good explanations of why these cases show
    high deviation.


    Looking at the future uses of such outlier-mining techniques in, for example,
    smart homes, we observe that most of them will be people with no background in
    data analysis. This will raise new visualization and explanation requirements
    for result presentation. It requires novel data-mining techniques that are able
    to highlight the differences between patterns. For instance, such techniques could
    reveal the reason for the high deviation of a single object or the difference
    between two groups of customers. First techniques in this direction have been
    proposed [22]. Given two different datasets, they try to measure the difference
    and output characteristic properties to distinguish between these sets. Very promising
    instantiations have been applied to emerging pattern detection or novelty detection
    in the context of stream data [44].


    As outlier mining is an established technique in data mining, it has been used
    in several works in the field of energy data. To name some examples, Li et al.
    [90] uses outlier mining to detect abnormal energy use. Chen et al. [32] defines
    so-called load cleansing problems for energy data and develops techniques similar
    to outlier mining. Jakkula and Cook [67] presents specialized outlier detection
    algorithms dedicated to power datasets collected in smart homes. All these approaches
    can be seen as first instantiations of simple outlier models. The further potential
    of energy data must be exploited by more enhanced outlier detection techniques.'
