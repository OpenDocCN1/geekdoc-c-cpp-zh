- pgno: 57
  md: 'We face two challenges. The first is that the source data we want to use exists
    in a variety of formats and aggregation levels. We have to aggregate, disaggregate,
    and reclassify these input datasets so that each nation and its trading partner
    use the same classification scheme. The second challenge is more substantial:
    the raw data inputs often conflict.


    The first challenge to building an MRIO is harmonizing all the input data so they
    may be combined in one table. A primary goal of the Eora project is to incorporate
    as many available economic and environmental data as possible. These data cover
    a wide range of aggregation levels, formats, and classification schemes. Some
    examples of how the input data must be translated are:


    +   - Reclassification: for example, translate a set of trade data from Central
    Product Classification (CPC) to Harmonized System (HS) production classification.

    +   - Aggregation: for example, aggregate data in a 400-sector classification
    down to a 60-sector classification.

    +   - Disaggregation: for example, allocate a single total value to sectors according
    to each sector''s contribution to gross domestic product (GDP).


    We created a data processing language to help with this task. This language assists
    with aggregation and disaggregation and facilitates addressing and populating
    areas of the tensor. A disaggregation command in the processing language could
    specify a total value of steel sector sales that should be allocated proportionally,
    or equally, among a number of metal manufacturing industries.


    Tightly integrated with the language is a large library of correspondence matrices.
    Correspondence matrices contain a weighted mapping that reallocates values in
    a source vector into a different destination vector. A correspondence matrix maps
    a source vector of length N to a destination vector of length M using an N × M
    matrix. Each row contains a set of weights that sum to 1. The first element of
    the source vector is allocated to the destination vector using the weights specified
    in the first row, the second element added to the destination vector using the
    weights of the second row, and so on. Correspondence matrices are an especially
    convenient tool for aggregating and disaggregating data and projecting data in
    one classification scheme into another scheme.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'For each data source (each table from all the agencies supplying data, e.g.,
    UN, national agencies, environmental agencies, and so on), we wrote a processing
    language script to populate the tensor with the contents of that source. The scripts
    specify which concordance matrix/matrices to use to translate the data into the
    classification used in the Eora table. The scripts also specify the destination
    address in the Eora tensor where the reclassified data should be placed.


    The data processing language interpreter is called AISHA (*An Automated System
    for Harmonised Accounts*). AISHA is essentially a database server. It reads data
    processing scripts in batch and populates the tensor. Our implementation uses
    a distributed architecture. A number of workers process these scripts autonomously,
    and then the master process aggregates the results.


    This would be the end of the story if data sources did not overlap and conflict.
    AISHA does not actually populate a tensor but rather populates an initial estimate
    and constraint matrix, which are run through an optimization package to produce
    the final tensor.


    # 2.4 RECONCILING CONFLICTING CONSTRAINTS: EORA AS A SOLUTION OF A CONSTRAINED
    OPTIMIZATION PROBLEM


    The MRIO should satisfy several constraints. One basic constraint is a balancing
    constraint: the total outputs of a sector must equal the total inputs of a sector.
    Published data provided by statistical agencies adhere to this condition. But
    when constructing a large MRIO like Eora, data from a number of different sources
    have to be combined into one table. This newly combined table will most likely
    not fulfill this balancing constraint. Some elements of the table must be slightly
    adjusted in order to ensure that the balancing condition is fulfilled.


    Another common problem during the construction of an MRIO is that of conflicting
    data. Consider the following situation: We have an IO table from the U.S. government,
    detailing the sector-wise composition of GDP. We also have a figure for total
    U.S. GDP, provided from the UN. The two total GDP figures are not equal. These
    two figures define lower and upper bounds to the final value, and the realized
    final value must lie in between. To reconcile these conflicting constraints, we
    determine the reliability of each datum and ask the optimizer to find a solution
    value that maximally satisfies these two reliability-weighted constraints.'
