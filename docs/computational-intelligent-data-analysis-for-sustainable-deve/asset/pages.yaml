    # 7.1 INTRODUCTION


    THE ENERGY SYSTEM CURRENTLY undergoes major changes, primarily triggered by the
    need for a more sustainable and secure energy supply. The traditional system relying
    on the combustion of fossil sources such as oil, gas, and coal on the one side
    and nuclear technologies on the other side is not sustainable, for three main
    reasons:


    +   1. Fossil and nuclear resources are limited, and their exploitation will become
    more expensive (not economically sustainable).

    +   2. The combustion of fossil sources leads to CO₂ emissions, which drive the
    greenhouse effect (not environmentally sustainable).

    +   3. Nuclear power plants bear certain risks in their operation and produce
    nuclear waste, which needs to be protected from unauthorized access.


    Furthermore, up to now, no permanent disposal sites for nuclear waste exist, and
    coming generations—who will not have profited from this kind of energy source—will
    have to deal with it (not socially sustainable and probably not economically sustainable
    if all disposal costs are considered). The best way to achieve sustainability
    is clearly energy efficiency, that is, all forms of saving energy. A further way
    is renewable energy. Luckily, renewable energies are evolving rapidly, most remarkably
    in the form of wind energy, photovoltaic systems, water power, and biogas. In
    Germany, as one example, the share of renewable energies in electricity supply
    crossed the 20% mark in 2011 [7]. This share is forecast to quadruple by 2050
    [3].'
