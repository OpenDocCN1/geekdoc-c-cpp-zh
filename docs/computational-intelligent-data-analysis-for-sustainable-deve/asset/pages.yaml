  md: '# Acknowledgments


    This book was inspired by a series of conferences and workshops, including the
    IEEE International Conference on Data Mining (ICDM) Workshops on Knowledge Discovery
    from Climate Data (ClimKD), NASA Conference on Intelligent Data Understanding
    (CIDU), and the Workshop on Machine Learning and Data Mining for Sustainable Development
    in conjunction with the Tenth SIAM (Society for Industrial and Applied Mathematics)
    International Conference on Data Mining (SDM 2010). The organizing committee for
    the ClimKD included Nitesh Chawla, Auroop Ganguly, Vipin Kumar, Michael Steinbach,
    and Karsten Steinhaeuser. The general chairs for CIDU were Nitesh Chawla and Ashok
    Srivastava. The program committee of the Workshop on Machine Learning and Data
    Mining for Sustainable Development included Manfred Lenzen, Carla P. Gomes, Toby
    Walsh, Xin Zhou, Jin Fan, Zico Kolter, Zhen Wu, and Ghazi Al-Naymat. Professor
    Vipin Kumar at the University of Minnesota and Randi Cohen (Taylor & Francis Group)
    invited us to summarize recent research work on this topic.


    No book of this length covering so much ground could ever be the unaided work
    of just three people. The advisory board includes Professor Manfred Lenzen, Dr.
    Joy Murray, and Dr. Chris Dey at the University of Sydney, Australia; Dr. Julien
    Ugon at the University of Ballarat, Australia; Dr. Pohsiang Tsai at the National
    Formosa University, R.O. China; Professor Volker Wohlgemuth, Industrial Environmental
    Informatics, HTW Berlin, Germany; and Professor Aditya Ghose at the University
    of Wollongong, Australia. Other reviewers include Dr. Bin Shen at the Zhejiang
    University, P.R. China, and Dr. Boda Kang at the University of Technology, Sydney,
    Australia.


