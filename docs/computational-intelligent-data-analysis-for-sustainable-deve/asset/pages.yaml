  md: '# 8.1 INTRODUCTION


    Australians need to reduce their per-capita greenhouse gas emissions to 5% of
    2000 levels by 2050 if the international community is to stabilize the concentration
    of atmospheric CO₂ at 450 parts per million (ppm) [18]. Since the Garnaut report
    was published, it has become apparent that 350 ppm is a more realistic target
    if global warming is to be limited to 2°C. Either target is a huge challenge and
    will require unprecedented changes to the way we generate and use energy. See
    Figure 8.1 to get a better idea of the challenge.


    Some 38% of Australia’s greenhouse gas emissions are due to electricity use [11].
    This proportion is high by international standards because our use of electricity
    is high, and because 93% of our electricity is generated from fossil fuels.


    Our use of fossil fuels is unsustainable. We need to imagine, design, and transition
    to a future where all electricity is generated from renewable energy sources.
    The solution will require a mix of generation technologies, including solar thermal,
    solar photovoltaic, and wind. The variability of renewable energy sources will
    be overcome using a combination of reserve capacity, spatially diverse generator
    locations, energy storage, and management of demand to match supply. This chapter
    describes the mathematical models and methods required to design and optimize
    a system that can provide Australia with affordable, reliable, clean electricity.


    On November 8, 2011, the Australian Senate passed the Clean Energy Futures bills,
    enacting legislation that will put a price on CO₂ emissions beginning July 1,
    2012. Finance Minister and former Climate Change Minister


    ![](img/644775a10ad87164013616d709050cee_265_0.png)


    FIGURE 8.1 Per-capita CO₂ entitlements [18].'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'Penny Wong stated that, “We accept the science and the advice that putting
    a price on carbon is the best way to reduce emissions.” This action sets up the
    environment for a transformation of the electricity supply sector in Australia.
    According to an article in *Climate Spectator* online on December 7, 2011:


    > The government’s clean energy policy is currently centred around two basic principles—the
    20 per cent [large-scale] renewable energy target (LRET) is designed to deploy
    the cheapest available renewable technologies, while the Clean Energy Finance
    Corporation will support the commercialization and deployment of those technologies
    that are likely to be the cheapest and the most useful in the future.


    The LRET requires that by 2020, 20% of electricity will be supplied from renewable
    sources. This can be done in an ad hoc fashion, as is the present situation, with
    wind farms dominating large-scale installations and an intensification of photovoltaic
    installations on domestic houses (so much so that in NSW, for example, there is
    300 megawatts (MW) installed). This is widely purported to be driving up the costs
    of electricity for the remainder of the population. However, this conjecture is
    disputed by the Australian Energy Market Commission, who estimate that the combined
    costs of feed-in tariffs and renewable energy schemes will make up about 14% of
    future price increases, whereas the cost of reinforcing transmission and distribution
    systems to cope with growth in peak demand will make up 49% of electricity price
    rises over the next 3 years’ [3]. To maximize greenhouse gas reduction, a more
    coordinated approach is necessary.


    Maximizing the penetration of renewable energy sources for supplying electricity
    can be achieved through two disparate techniques: (1) building a supergrid, or
    (2) mixing the renewable sources with demand management and storage. In Europe,
    for example, there are proposals such as the Desertec initiative to create a supergrid
    interconnecting installations of renewable generation across Europe, North Africa,
    and the Middle East [21]. The underlying principle is that if you have solar farms
    distributed east-west along a latitude, there is an elongation of the solar day
    for providing


    Another challenge for today’s grid is the growth in air-conditioning penetration.
    In Western Sydney, more than 80% of homes now have air conditioning. This growth
    is driving energy supplies such as Ingleburn to spend approximately $3 billion
    over the next 5 years on grid infrastructure to meet the increased peak loads.
    But this extra infrastructure will only be needed for a few days a year; it’s
    like building a twenty-seven-lane freeway so that we never have peak-hour traffic
    jams.—*The Climate Spectator*, 14 July 2010.'
