    the value-added section and the industrial section. As the economy constantly
    evolves, the input-output table must be updated at least annually to reflect the
    new circumstance. A typical input-output table for the Australian economy is represented
    in the format of seven 2800-by-2800 matrices.


    More than 100 countries worldwide regularly publish input-output tables according
