    2009. Katharina Morik, Kanishka Bhaduri, and Hillol Kargupta [41] presented a
    brief listing of ten projects and groups who are performing active research pertaining
    to the field of sustainable systems.


    Modern sensor networks, mobile devices, and society networks deliver an explosive
    amount of environmental, economic, and social data. Indeed, history has never
    had such a large amount of data to analyze and process. In the meantime, a changing
    human society urgently needs comprehensive, systematic, and immediate action to
    address various kinds of sustainable development issues, such as global warming,
    overpopulation, poverty, and pollution. None of these issues are independently
    or easily solved. Very often, we have to balance individual interests with the
    common good [6]. Invisible hands are not the ultimate solution to these problems.
    Intelligent data analysis cannot solve these problems by itself, but it provides
    powerful tools to get insight into these problems to support rational decision
    making. In the meantime, the data provided by sustainable development problems
    creates opportunities and challenges to data analysis researchers in that they
    can create and apply powerful technologies to real-life problems. It presents
    the need for a new approach to study such challenging problems, one in which computational
    problems are viewed as “natural” phenomena, amenable to a scientific methodology
    in which principled experimentation, to explore problem parameter spaces and hidden
    problem structure, plays as prominent a role as formal analysis. It is therefore
    important to develop new approaches to identify and exploit this real-world structure,
    combining principled experimentation with mathematical modeling, which will lead
    to scalable and practical effective solutions [42]. This book is one of the early
    attempts to explore this new topic. We hope this book will attract more researchers
    to contribute to developing new methods and applications in this young but promising
    field.


