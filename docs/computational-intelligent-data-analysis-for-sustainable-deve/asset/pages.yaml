    # 4.3.5 Reanalysis Products


    Weather forecast models use “as much observational data (in-situ, remote sensing,
    etc.) as can be assimilated in order to predict weather forecasts (the “analyses”),
    which are excellent estimates of the state of the climate at any one time. However,
    as models have improved over time, the time series of weather forecasts can contain
    trends related only to the change in model rather than changes in the real world.
    Thus, many of the weather forecasting groups have undertaken “reanalyses” that
    use a fixed model to reprocess data from the past in order to have a consistent
    view of the real world (see reanalyses.org for more details). This is somewhat
    equivalent to a physics-based interpolation of existing datasets and often provides
    the best estimate of the climate state over the instrumental period (e.g., ERA-Interim
    [16]).


    However, not all variables in the reanalyses are equally constrained by observational
    data. Thus, sea-level pressure and winds are well characterized, but precipitation,
    cloud fields, and surface fluxes are far more model dependent and thus are not
    as reliable. Additionally, there remain unphysical trends in the output as a function
    of changes in the observing network over time. In particular, the onset of large-scale
    remote sensing in 1979 imparts jumps in many fields that can be confused with
    real climate trends [105].


    # 4.3.6 Global Climate Model (GCM) Output


    Global climate models are physics-based simulations of the climate system, incorporating
    (optionally) components for the atmosphere, ocean, sea ice, land surface, vegetation,
    ice sheets, atmospheric aerosols and chemistry, and carbon cycles. Simulations
    can either be transient in response to changing boundary conditions (such as hindcasts
    of the 20th century), or time slices for periods thought to be relatively stable
    (such as the mid-Holocene 6,000 years ago). Variations in output can depend on
    initial conditions (because of the chaotic nature of the weather), the model used,
    or variations in the forcing fields (due to uncertainties in the time history,
