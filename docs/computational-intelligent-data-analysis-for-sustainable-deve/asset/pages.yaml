- pgno: 367
  md: '# ### 11.3 METHODS


    Using the conditioned data, we develop analytical tools to achieve the following:


    +   1. Identify both spatial and temporal relationships.

    +   2. Select an appropriate scale on which to examine these relationships.

    +   3. Interpret the sources of any correlation structure.


    To address these goals, we combine time-series analysis with results from random
    matrix theory to quantify the magnitude and significance of correlation in the
    data. In the process, we draw upon knowledge of similar problems found in neuroscience
    (correlating spike-train data) and financial economics (finding signal in noisy
    time-series data) [5, 9, 12, 13, 18].


    Although many methods for detecting correlation in space and time exist, the nature
    of criminal acts and the type of data being used lent itself to the particular
    tools used in this chapter. For example, while we are looking for correlations
    in space, it is important that techniques are able to detect nonlocal correlations,
    whereas two neighborhoods, on opposite sides of the city, have similar crime profiles
    because of socioeconomic reasons. With this in mind, we rule out models that can
    capture only local diffusion. Multivariate auto-regressive (MVAR) models that
    regress time series of a particular location onto other locations and across many
    lag periods can detect such a structure, but given the extremely large number
    of spatial locations and the length of time series, these models quickly become
    large and intractable [11, 23].


    We also would like our analysis to speak of specific details of the correlation
    structure rather than just the distribution of crimes in space or time. While
    models concerned with speciation in heterogeneous landscapes may provide insight
    into properties of the distribution of phenomena or events in nonlinear environments
    (population density, socioeconomic factors, etc.), they have more difficulty telling
    stories of particular realizations of these distributions in the real geographic
    space of a city.


    Finally, there is also the problem of noise. Our dataset, while large, is very
    noisy, and any tools and methods used must be able to find and separate signal
    with confidence. The methodology that follows has the advantage of providing both
    analytic and computational null models. Random matrix theory presents analytic
    results for the limiting distributions and statistics of covariance matrices,
    while artificial crime data can reliably'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'be simulated using a Poisson process in order to achieve a computational null
    model. With these considerations in mind, the following algorithms and methodology
    were combined to satisfy our modeling and statistical requirements.


    # 11.3.1 Basic Analysis and Statistics


    We begin by using basic data analysis techniques and statistics to better understand
    the data. In general, crime is not distributed uniformly across the city. Instead,
    the spatial structure is consistent with descriptions of crime “hotspots.” These
    hotspots are small regions within the city that regularly experience high levels
    of crime. Characterizing the nonuniform spatial distribution of crime is important
    when attempting to find relationships between types of crime. For example, Figure
    11.4 shows the center of drug-related crimes occupies northwestern Philadelphia,
    while theft is more prevalent in downtown Philadelphia. We wish to use quantitative
    tools to measure interactions between these locations.


    ![](img/644775a10ad87164013616d709050cee_368_0.png)


