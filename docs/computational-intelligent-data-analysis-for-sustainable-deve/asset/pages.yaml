  md: '# Chapman & Hall/CRC


    # Data Mining and Knowledge Discovery Series


    **SERIES EDITOR**


    Vipin Kumar


    University of Minnesota


    Department of Computer Science and Engineering


    Minneapolis, Minnesota, U.S.A.


    # AIMS AND SCOPE


    This series aims to capture new developments and applications in data mining and
    knowledge discovery, while summarizing the computational tools and techniques
    useful in data analysis. This series encourages the integration of mathematical,
    statistical, and computational methods and techniques through the publication
    of a broad range of textbooks, reference works, and handbooks. The inclusion of
    concrete examples and applications is highly encouraged. The scope of the series
    includes, but is not limited to, titles in the areas of data mining and knowledge
    discovery methods and applications, modeling, algorithms, theory and foundations,
    data and knowledge visualization, data mining systems and tools, and privacy and
    security issues.


