    # 3.4 CONCLUSIONS


    The construction of MRIO tables is both time-consuming and expensive. There are
    still very few MRIO tables available for practical applications. MRIO tables are
    generally constructed based on national IO tables and bilateral trade data. Different
    countries have different key sectors and national priorities that can influence
    sector classification and the level of aggregation in their national IO tables.
    In constructing MRIO tables, reclassification and aggregation are usually necessary
    to adjust the differences among national IO tables. In the application of MRIO
    models'
