    # ### 1.2.1 Process of Computational Intelligent Data Analysis


    Traditionally, data analysts have been taught to “familiarize themselves with
    their data” before beginning to model it or test it against algorithms. This step
    is basically a descriptive analysis to understand basic characteristics of the
    data by summarizing and applying simple analysis tools. However, with the large
    size of modern datasets, this is less feasible (or even entirely impossible in
    many cases). Here one must rely on computer programs to check data, and also to
    visualize the data at various aggregated levels.


    The first formal step in data analysis is data cleaning and reconciliation. In
    many cases, a significant proportion of the data used for analysis is collected
    for other purposes. This results in heterogeneous data sources, and requires that
    data must be reconciled for the given data analysis tool. The cleaning and reconciliation
    process aims to handle the missing values and distortions—for example, outliers.
    These flaws can be caused by misrecordings in the data collection process and
    inadequate sampling. Missing values can be detected easily, but the distortions
    are much more difficult to identify. Extreme data does not necessarily mean an
    outlier. Many extreme events have been observed within the past few years, such
    as a Japan tsunami, which happens once every hundred years.


    The subdisciplines of experimental and survey design have developed over the years
    and are now very sophisticated [8]. They provide a good'
