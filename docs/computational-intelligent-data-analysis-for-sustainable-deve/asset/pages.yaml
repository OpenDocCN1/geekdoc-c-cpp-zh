  md: 'below the original quote, with an average of 129% above. From a planning perspective,
    the potential for budget overruns is great.


    Traditional sensitivity analysis is not helpful in this case because binary programming
    is used. Ideally, costs and in-kind contributions could be systematically varied
    independently over a range of percentages of over- and under-achievement and the
    results compared. This is not feasible, however, because 30 projects with only
    three such distortions would require more than 4 × 10⁴ separate optimizations.


    As an alternative sensitivity analysis, we analyzed this situation using a bootstrap
    type of approach that evaluates the persistence of projects in optimal solutions
    over a series of random variations in price and in-kind contributions. All costs
    and in-kind contributions were independently varied by a factor within the 10th
    to 90th percentile range: −28% to +140% for costs and −57% to +307% for in-kind
    funding. The optimal solution was recorded for several random samples, and the
    “persistence” or percentage of times a particular project was recommended was
    calculated. This persistence score can be used to identify projects for which
    the expense is a “sure thing” versus those that are particularly sensitive to
    cost. This analysis was performed for 2002 using 55 observations. Table 6.2 offers
    a selection of results for projects that were actually funded. Projects that have
    persistence scores at or near 1.0 are very likely to be efficient in granting
    environmental benefits even under a fair degree of cost uncertainty. Projects
