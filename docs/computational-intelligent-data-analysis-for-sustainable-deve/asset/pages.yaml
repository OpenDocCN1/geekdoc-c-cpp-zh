  md: 'projects in a township. When set to greater than or equal to 1, this constraint
    ensures that all townships receive at least one funded project. Setting this constraint
    to less than 1, it prevents funding of more than one project for each township.
    One of these conditions must be true for the constraint to hold. This can be achieved
    using a logical condition or a binary switch variable; however, those techniques
    would make the program nonlinear, which complicates solving it. As an alternative,
    because there generally is insufficient funding for townships to obtain multiple
    projects, the first condition can be omitted with the caveat that the model must
    be altered slightly if there were ever sufficient funding for at least one project
    for each township. In-kind contributions are considered in depth in the following
    subsection. Thus, for an initial base model, we use the following:


    \[\begin{aligned}

    \text{Max: } Z &= \sum_{i=1}^{n} x_i e_i \\

    \text{Subject to: } &\sum_{i=1}^{n} x_i p_i \leq B \\

    &\sum_{i=1}^{n} x_i \leq 1 \\

    &x_i \in \{0,1\}

    \end{aligned}\]


    where \(x_i\) is a binary variable indicating whether project \(i\) is chosen,
    \(x_i\) is \(x_i\) for projects submitted by township \(j\), \(e_i\) is the environmental
    score for project \(i\), \(p_i\) is the requested grant amount for project \(i\),
    and \(B\) is the total budget for the year.


    Table 6.1 outlines the results from the model in terms of the total benefit to
    Bradford County offered by the two methods for 2002 through 2008. The key observation
    here is that BIP offers a significant improvement. Specifically, BIP selects a
    set of projects that would deliver a 57% increase in environmental benefit, a
    57% increase in in-kind contributions, and a 102% increase in the number of projects
    funded. Those results may not be realistic, however, due to uncertainty regarding
    project costs. This is discussed further in Issue 2 (see Section 6.2.2).'
