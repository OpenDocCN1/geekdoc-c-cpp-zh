  md: '# ## 10.1 INTRODUCTION


    A WIND RESOURCE ASSESSMENT is initiated as part of the decision process leading
    to selecting a wind farm site. There are multiple factors that influence site
    selection. Among them are legal considerations, community opinion, ease of construction,
    maintenance, and cabling cost. Arguably, most crucial is whether there is enough
    wind in the ideal speed range that will endure over a long span of time, such
    as a generation or longer. Prediction of wind at high frequency, such as hours
    to days to weeks, is fraught with technical and sensing challenges—plus intrinsic
    uncertainty. Wind resource assessment for site selection contrasts with high frequency
    prediction. Its goal is to provide a general estimate that guides selection without
    being a precise prediction. The annual, actual wind resource of a farm would be
    expected to deviate from the assessment with reasonable variance. However, when
    the actual annual resource is averaged over a long time span, the goal is that
    assessment and actuality should match up. In this way, wind resource assessment
    helps inform the question of the production capacity of the site over its extended
    lifetime (which potentially includes successive upgrades of turbines and related
    facilities).


    A wind resource assessment is presented as a set of probability distributions
    of wind speed for directional intervals that span 360°. An example of three distributions,
    for the intervals 0° to 15°, 15° to 30°, and 30° to 45° is shown on the left of
    Figure 10.1. Each plotted probability function is modeled with a Weibull distribution
    that is parameterized by shape and scale. Integrating this function (mathematically)
    allows one to derive the probability that the wind speed from a given direction
    range will be within a specific range.


    ![](img/644775a10ad87164013616d709050cee_333_0.png)


    FIGURE 10.1 (See color insert.) A wind resource assessment is expressed as a bivariate
    (speed and direction) statistical distribution (left) or a “wind rose” (right).'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'The assessment can also be visualized via a wind rose; see Figure 10.1 (right).
    The span of the entire 360° is oriented in the north-south compass direction to
    inform its alignment to the site. Figure 10.1 (left) shows 16 direction intervals,
    each as a discrete “slice” with coloring that depicts wind speed. The length and
    width of the slice conveys probability.


    There are multiple methodologies that derive a wind resource assessment. All are
    subject to great uncertainty. When a wind resource assessment is based upon wind
    maps and publicly available datasets from the closest locations, it tends to overestimate
    the wind speed because the maps are so macroscopic. Even when the resource estimated
    by the wind map for a geographical location is improved upon by utilizing a model
    that accounts for surface roughness and other factors, significant inaccuracies
    persist because specific details of the site remain neglected. Alternatively,
    a computational fluid dynamics (CFD) model can be used to achieve a better resource
    assessment. However, CFD also has limitations. It is very difficult to incorporate
    all the local attributes and factors related to turbulence into the simulation.
    While the wind industry has started to combine CFD and wind map approaches, the
    current methods are ad-hoc, not robust, and more expensive than desired.


    In this chapter we provide new techniques for the only assessment methodology
    that takes into account as many years of historical data as possible (although
    those data are remote from the site itself), while also integrating site-specific
    information, albeit short term and relatively noisy. We consider the Measure-Correlate-Predict
    assessment methodology, abbreviated as MCP, which exploits anemometers, and/or
    other sensing equipment that provide site-specific data [1–4]. The Measure step
    involves measuring wind speed and direction at the site for a certain duration
    of time. In the Correlate step, these data are then associated with simultaneous
    data from nearby meteorological stations, so-called historical sites that also
    have long-term historical data. A correlation model is built between the time-synchronized
    datasets. In the Predict step, the model is then used along with the historical
    data from the meteorological stations to predict the wind resource at the site.
    The Prediction is expressed as a bivariate (speed and direction) statistical distribution
    or a “wind rose” as shown in Figure 10.1.


    While MCP does incorporate site-specific data, these data are based upon very
    inexpensive sensors, that is, anemometers, which are consequently very noisy.
    Additionally, anemometers are frequently moved on the site and not deployed for
    any significant length of time. Thus, the key'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Challenge of MCP is to accurately predict with cheap, noisy, short-term sensor
    measurements. We aim to address how techniques match up with data availability.
    Usually 8 to 10 months is considered the standard in the wind industry. However,
    we seek very simple modeling techniques that can reduce the amount of data required
    to get an accurate estimation of the long-term wind speed.


    Another challenge is integrating historical site data. The best historical site
    (e.g., airport) to correlate wind speed with a site might be somewhat intuitive
    if only wind direction is considered: for example, when the wind blows from the
    north at the site, its speed might be best correlated with speeds from a particular
    airport meteorological tower immediately to the north. However, site conditions
    such as local terrain height variation or terrain features such as forests and
    large buildings make identifying the best correlation sources much more complicated.
    The sites’ conditions cannot be observed directly in the data but influence the
    correlative relationships. Also, the strength of correlations may be sensitive
    to how the wind direction is segmented into aggregative bins and intervals. To
    date, the selection is done with trial-and-error modeling and ad hoc understanding
    of the similarity between the proposed and historical sites. Almost always, a
    single historical site, closest to the test site, is used to build the predictive
    model. Yet, for any given location, better accuracy is obtainable when multiple
    historical sites in different directions with respect to the site are candidates
    for integration into the estimation. In this chapter we address how to integrate
    the wind information from multiple historical sites and weigh each historical
    site according to its correlative strength.


    It is not uncommon for wind farms to fall short of their expected energy output.
    A study performed in the United Kingdom monitored small and micro wind turbine
    performance and found that the wind resource was over-predicted by a factor of
    15 [5]. In another example, data analysis of 19 small turbines installed in Massachusetts
    [6] showed, on average, turbines under-performing by a factor of 4. The capacity
    factor was found to be as low as 3% to −4%. Inadequate wind resource assessment
    was determined to be one of the major factors (20%) influencing the underperformance.


    In this chapter we describe a set of computational intelligence techniques based
    on statistical inference. Each technique relies on estimating the joint distribution
    of wind speeds at the site and the publicly available neighboring sources. The
    accuracy of any one of these techniques is sensitive to choices in the modeling
    setup and/or parameterizations. We aim to assess which technique and choices are
    best. Our assessment will utilize anemometer'
  merge: -1
