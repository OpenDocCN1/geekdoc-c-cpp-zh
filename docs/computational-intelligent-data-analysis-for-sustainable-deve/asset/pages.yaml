    formalism). Matrix factorizations such as Singular Value Decomposition [29] of
    the temperature and proxy matrices are common first steps. If the squared singular
    values decrease quickly, as is often the case in climatological data where leading
    climate patterns dominate over many more weakly expressed local patterns or noise,
    reduced-rank representations of the temperature and proxy matrices are typically
    good approximations of the full-rank versions of the matrices. These reduced-rank
    temperature and proxy matrices therefore are used to estimate a linear regression
