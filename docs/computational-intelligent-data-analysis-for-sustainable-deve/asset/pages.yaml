  md: 'pollution; and so on. Examples of positive impacts are reduction in water/air
    pollution, reduction in greenhouse gas emission, reduction in noise, natural resources
    saving, creation of new ecosystems, and so on.


    The second matrix ℵ defines the dependencies between the impacts and environmental
    receptors. Each element nᵢʲ of the matrix ℵ defines a qualitative dependency between
    the impact i and an environmental receptor j. Again, the dependency can be high,
    medium, low, or null. Examples of environmental receptors are the quality of surface
    water and groundwater, the quality of landscapes, energy availability, wildlife
    wellness, and so on.


    The matrices currently used in Emilia-Romagna contain 93 activities, 29 negative
    impacts, 19 positive impacts and 23 receptors, and assess 11 types of plans.


    # 12.2 WHY CONSTRAINT-BASED APPROACHES?


    The regional planning activity is now performed by human experts who build a single
    plan, considering strategic regional objectives that follow national and EU guidelines.
    After devising the plan, the agency for environmental protection is asked to assess
    the plan from an environmental point of view. Typically, there is no feedback:
    the assessment can state that the devised plan is environmentally friendly or
    not, but it cannot change the plan. In rare cases, it can propose corrective countermeasures,
    which can only mitigate the negative impact of wrong planning decisions. Moreover,
    although regulations state that a significant environmental assessment should
    compare two or more options (different plans), this is rarely done in Europe because
    the assessment is typically manual and requires a long effort. Even in the few
    cases in which two options are considered, usually one is the plan and the other
    is the absence of a plan (i.e., do nothing).


    Constraint-based modeling overcomes the limitation of a handmade process for a
    number of reasons:


    +   - First, it provides a tool that automatically performs planning decisions,
    considering both the budget allocated to the plan by the Regional Operative Plan
    as well as national/EU guidelines.

    +   - Second, it takes into consideration environmental aspects during plan construction,
    thus avoiding trial-and-error schemes.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '+   - Third, constraint reasoning provides a powerful tool in the hand of a
    policy decision maker as the generation of alternative scenarios is extremely
    easy and their comparison and evaluation come with no cost. Adjustments can be
    performed on-the-fly in case the results do not satisfy policy makers or environmental
    experts. For example, in the field of energy regional planning, by changing the
    bounds on the amount of energy each source can provide, we can adjust the plan
    by considering market trends and also the potential receptivity of the region.


    # ### 12.2.1 A CLP Model


    To design a constraint-based model for the regional planning activity, we have
    to define variables, constraints, and objectives. Variables represent decisions
    that must be taken. Given a vector of activities $A = (a_1, ..., a_{N_A})$, we
    associate to each activity a variable $G_i$ that defines its magnitude. The magnitude
    can be represented either in an absolute way, as the amount of a given activity,
    or in a relative way, as a percentage with respect to the existing quantity of
    the same activity. In this chapter we use the absolute representation.


    As stated above, we distinguish primary from secondary activities: let $A^P$ be
    the set of indexes of primary activities and $A^S$ the set of indexes of secondary
    activities. The distinction is motivated by the fact that some activities are
    of primary importance in a given plan. Secondary activities are those that support
    the primary activities by providing the needed infrastructures. The dependencies
    between primary and secondary activities are considered by the following constraint:


    $$\forall j \in A^S \quad G_j = \sum_{i \in A^P} a_{ij} G_i$$


    Given a budget $B_{Plan}$ available for a given plan, we have a constraint limiting
    the overall plan cost as follows:


    $$\sum_{i=1}^{N_A} G_i c_i \le B_{Plan} \qquad (12.1)$$


    Such a constraint can be imposed either on the overall plan or on parts of it.
    For example, if the budget is partitioned into chapters, we can impose Equation
    (12.1) on the activities of a given chapter.'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'Moreover, given an expected outcome $o_{plan}$ of the plan, we have a constraint
    ensuring to reach the outcome:


    $$ \sum_{i=1}^{N_i} G_i o_i \ge o_{plan} $$


    For example, in an energy plan, the outcome can be to have more energy available
    in the region, so $o_{plan}$ could be the increased availability of electrical
    power (e.g., in kilo-TOE, Tonnes of Oil Equivalent). In such a case, $o_i$ will
    be the production in kTOE for each unit of activity $a_i$.


    Concerning the impacts of the regional plan, we sum up the contributions of all
    the activities and obtain an estimate of the impact on each environmental pressure:


    $$ \forall j \in \{1,...,N_p\} \quad p_j = \sum_{i=1}^{N_i} m_j^i G_i \qquad (12.2)
    $$


    In the same way, given the vector of environmental pressures $\mathbf{P} = (p_1,
    ..., p_{N_p})$, one can estimate their influence on the environmental receptor
    $r_j$ by means of the matrix $\mathcal{N}$ that relates pressures with receptors:


    $$ \forall j \in \{1,...,N_r\} \quad r_j = \sum_{i=1}^{N_i} n_j^i p_i \qquad (12.3)
    $$


    Moreover, we can have constraints on receptors and pressures. For example, "greenhouse
    gas emission" (that is, a negative pressure) should not exceed a given threshold.


    Concerning objectives, there are a number of possibilities suggested by planning
    experts. From an economic perspective, one can decide to minimize the overall
    cost of the plan (that is, in any way subject to budget constraints). Clearly,
    in this case the most economic energy sources are preferred, despite their potentially
    negative environmental effects (which could be anyway constrained). On the other
    hand, one could maintain a fixed budget and maximize the produced energy. In this
    case, the most efficient energy sources will be pushed forward. Or the planner
    might prefer a *green* plan and optimize environmental receptors. For example,
    one'
