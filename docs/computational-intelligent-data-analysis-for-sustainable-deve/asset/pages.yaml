  md: '# # 4.7 CLIMATE EXTREMES, UNCERTAINTY, AND IMPACTS


    # ### 4.7.1 The Climate Change Challenge


    The Fourth Assessment Report of the Intergovernmental Panel on Climate Change
    (IPCC, AR4) has resulted in wider acceptance of global climate change caused by
    anthropogenic drivers of emission scenarios. However, earth system modelers struggle
    to develop precise predictions of extreme events (e.g., heat waves, cold spells,
    extreme rainfall events, droughts, hurricanes, and tropical storms) or extreme
    stresses (e.g., tropical climate in temperate regions or shifting rainfall patterns)
    at regional and decadal scales. In addition, the most significant knowledge gap
    relevant for policy makers and stakeholders remains the inability to produce credible
    estimates of local-to-regional scale climate extremes and change impacts. Uncertainties
    in process studies, climate models, and associated spatiotemporal downscaling
    strategies may be assessed and reduced by statistical evaluations. But a similar
    treatment for extreme hydrological and meteorological events may require novel
    statistical approaches and improved downscaling. Scenario uncertainty for climate
    change impacts is fundamentally intractable, but other sources of uncertainty
    may be amenable to reduction. Regional impacts need to account for additional
    uncertainties in the estimates of anticipatory risks and damages, whether on the
    environment, infrastructures, economy, or society. The cascading uncertainties
    from scenarios, to models, to downscaling, and finally to impacts, make costly
    decisions difficult to assess. This problem grows acute if credible attributions
    must be made to causal drivers or policy impacts.


    # ### 4.7.2 The Science of Climate Extremes


    One goal is to develop quantifiable insights on the impacts of global climate
    change on weather or hydrological extreme stresses and extreme events at regional
    to decadal scales. Precise and local predictions, for example, the likelihood
    of an extreme event on a given day of any given year a decade later, will never
    be achievable, owing to the chaotic nature of the climate system as well as the
    limits to precision of measurements and our inability to model all aspects of
    the process physics. However, probability density functions of the weather and
    hydrology, for example, likelihoods of intensity-duration-frequency (IDF) of extreme
    events or of mean change leading to extreme stress, may be achievable targets.
    The tools of choice range from the two traditional pillars of science: theory
    (e.g., advances in physical understanding and high-resolution process'
