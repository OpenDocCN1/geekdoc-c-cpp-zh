    # ## 9.1 INTRODUCTION


    THE U.S. POWER GRID system comprises multiple distinct interconnections of generations,
    high-voltage transmission systems, and local distribution systems that maintain
    a continuous balance between generation and load with impressive levels of efficiency
    and reliability. This critical infrastructure is likely to see more changes over
    the next decade as a result of the proposed modernization of the grid system than
    it has seen over the past century. In particular, the widespread deployment of
    renewable generation (centralized and distributed), smart meters, synchrophasors,
    smart-grid controls, energy storage, and new conducting materials will require
    fundamental changes in grid planning and the way we run the power grid.


    This modernization will lead to an explosive growth in the amount of data collected
    at each level of the power grid system: generation, transmission, distribution,
    and consumption. The data collected at these levels can be summarized into three
    classes: (1) field data (collected by the various devices distributed throughout
    the system, such as digital recorders); (2) centralized data archives (from monitoring,
    control, and operation systems, such as supervisory control and data acquisition
    (SCADA) systems); and (3) data from simulation (carried out in planning or operation
    environments). At the center of this data collection activity is the ability to
    process the information from the massive stock of data to support future decision
    making. It should be noted that the data cannot be left in the hands of field
    experts alone because of the high latency (for example, as high as sixty data
    points per second in case of phasor measurement units (PMU)) and the high dimensionality
    of the datasets. Hence, there is a need to develop algorithms capable of synthesizing
    structures from data.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Developing such algorithms, implementing them, and applying them to real problems
    are the purposes of the so-called data mining field.


    Data mining is the term for a general approach that is supported to varying degrees
    by a set of technologies: statistics, visualization, machine learning, and neural
    networks. Classification, regression, clustering, summarization, dependency modeling,
    deviation detection, and temporal problems are expected to be solved by data mining
    tools. Data mining tools will be useful in a power grid system because of the
    characteristics of the collected data: large-scale character of the power grid
    (thousands of state variables), temporal (from milliseconds, seconds, minutes,
    hours, weeks, year) and statistical nature of the data, existence of a discrete
    (e.g., events such as generator trip or phase changes) and continuous (analog
    state variables) information mixture, necessity of communication with experts
    through means of visualization, online operation time restriction for fast decision
    making, and existence of uncertainty (noise, outliers, missing information).


    This chapter presents applications of data mining tools to some of the problems
    in power grid systems using some of the data described earlier in this section.
    Section 9.2 discusses some of the identified research problems in the power grid
    system. Section 9.3 describes a methodology for classifying and visualizing frequency
    data collected using synchrophasors at the distribution level. Section 9.4 discusses
    a methodology for detecting and visualizing inter-area oscillatory modes from
    frequency data. Section 9.5 describes a spatio-temporal anomaly detection method
    for fast detection of grid events using a statistically principled change detection
    technique.


    # 9.2 SOME RESEARCH PROBLEMS

    IN THE POWER GRID SYSTEM


    As mentioned earlier, the modernization in the data collection capabilities within
    the power grid is resulting in an explosive growth in the amount of data collected
    at each level of the grid system—generation, transmission, distribution, and consumption.
