  md: 'states, cities, or companies. This obviously depends highly on data availability.
    It is also possible to use additional data to further disaggregate the table and
    thus gain higher resolution. For example, additional sales and purchasing data
    might allow the Japanese Steel sector to be split into Traditional Steel and Engineered
    Steel sectors. Highly detailed tables are desirable for almost all applications,
    but disaggregation is data intensive and often makes the table more difficult
    to balance.


    Resting below an IO table may be an additional block of rows for non-monetary
    inputs such as labor hours or water usage. The rows of this so-called satellite
    indicator block Q are treated as additional inputs into production. In IO analysis,
    pollution, too, is regarded not as a consequence of production but as a necessary
    input, and thus added as an indicator row. The Eora model has nearly 2,000 indicator
    rows covering nonmonetary inputs such as energy use, water use, land use (ecological
    footprint), greenhouse gas (GHG) emissions, and air pollutants.


    Figure 2.3 illustrates one path through an environmentally extended MRIO. The
    blocks on the diagonal are domestic IO tables, the off-diagonal blocks are trade
    blocks, and the shaded bottom row contains satellite indicator blocks. The data
    point at (1) records how many species are threatened by Brazilian coffee growers.
    Satellite accounts can contain any type of metric; this could just as easily be
    tons of CO₂ emitted by Brazilian coffee growers or cubic liters of water used.
    Data point (2) records the degree to which this indicator is implicated in Brazilian
    coffee growing; point (3) records the threat-weighted coffee exports to the United
    States, and points (4) and (5) connect those imports to final consumers. These
    five points make up a supply chain connecting U.S. coffee consumers with species
    threats due to coffee plantations in Brazil. The structure of


