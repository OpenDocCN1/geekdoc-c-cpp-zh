    # 10.3.4 Graphical Model with Structure Learning


    In the model of Section 10.3.3, we assume a naïve structure. By contrast, in this
    technique we learn the variable dependency structure (i.e., Bayesian network)
    given the site data. Many structure learning algorithms are available in literature
    and can be readily employed [11–13].


    **Estimation:** Our estimation has two steps. First, we learn the network structure
    𝒢 and then estimate parameters for the conditional probability distribution at
    each node in 𝒢. In our experiments, we employ a heuristic called K2 [13]. The
    algorithm takes the order of the variables and attempts to learn a dependence
