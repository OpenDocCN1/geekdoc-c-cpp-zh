  md: '$f_{X,Y}(x,y)=\prod_{i=1}^{m} f_{X_i}(x_i\mid y)f_Y(y)$ (10.9)


    A Bayesian network $\mathcal{B}=\langle\mathcal{G},\theta\rangle$ is a probabilistic
    graphical model that represents a joint probability distribution over a set of
    random variables $X_1,\ldots,X_n$. The Bayesian network representation has two
    components. A directed acyclic graph (DAG) $\mathcal{G}$ encodes independence
    relations between variables. Each variable is a node in this graph. A set of local
    probability models $\theta$ defines the conditional probability distribution of
    each node given its parents in the graph. Let $\mathrm{Pa}_X$ denote the parents
    of node $X$ in $\mathcal{G}$. Then the network $\mathcal{B}$ encodes the following
    probability distribution:


    $P(X_1,\ldots,X_n)=\prod_{i=1}^{n}P(X_i\mid\mathrm{Pa}_{X_i})$


    In comparison, the multivariate model previously introduced assumes the same naive
    Bayes structure but uses kernel density estimators for each individual variable.


