- pgno: 197
  md: 'Program is the result of a partnership between Trout Unlimited, the state of
    Pennsylvania, and Pennsylvania county conservation districts. They employ an innovative
    approach to nonpoint solution abatement by funding the stabilization of dirt roads
    around sensitive waterways. They currently select projects using a Benefit Targeting
    algorithm that ranks and selects the highest-quality projects until the budget
    is exhausted. Their efforts could be improved using a Binary Linear Programming
    approach. This platform offers several natural extensions that have the potential
    to address several challenges faced by the program, including the handling of
    in-kind cost share, uncertainty of project costs, and the distribution of funds
    across county conservation districts.


    A minor challenge in this analysis was the availability of data. A significant
    amount of investigation was possible with the data from Bradford County; however,
    with additional data, several other interesting analyses can be done, including
    a statewide analysis of fund distribution and potentially a data envelopment analysis
    to compare differences in decision approaches across counties. There were several
    questions raised that could be interesting to consider further, including an optimal
    weighting scheme for in-kind contributions in the MOLP model, and continued study
    of the effect of cost sensitivity as well as environmental score sensitivity on
    the resulting benefits achieved.


    Despite these data challenges, optimization still shows considerable promise for
    gains in this program. First, there is the potential for considerable efficiency
    gains in larger counties from using BLP in their decision process, although this
    is tempered somewhat by cost uncertainties. Second, MOLP could be useful in taking
    in-kind contributions into account to encourage higher contribution rates by townships.
    Also, due to the uncertainty in project costs, it could be useful to consider
    the persistence of a solution under random disturbances of project costs to help
    identify projects most likely to be efficient regardless of actual cost. Finally,
    statewide efficiency could be increased by a minor redistribution of funds to
    counties currently receiving only limited funding, but states with larger road
    systems should continue to receive the bulk of the funds.


