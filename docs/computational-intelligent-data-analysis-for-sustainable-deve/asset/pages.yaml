- pgno: 24
  md: 'has made it difficult or impossible for these countries to refinance their
    government debt without the assistance of third parties.


    *Environmental protection* has become more important to government and businesses
    over the past 20 years, leading to greater improvements in the number of people
    willing to invest in green technologies. Bloomberg New Energy Finance estimates
    that a record US$243 billion was invested in 2010, well ahead of traditional energy
    and up more than 30% from the year before. In Australia, more than $5.2 billion
    was invested in renewable energy during the 2010–2011 financial year, including
    approximately $4 billion on household solar power alone. This is more than 60%
    higher than during 2009–2010 [3].


    Until recently, the “sustainability debate” was largely confined to environmental
    circles, and the social dimensions of sustainability were relatively neglected.
    *Social sustainability* occurs when the formal and informal processes, systems,
    structures, and relationships actively support the capacity of current and future
    generations to create healthy and livable communities. Socially sustainable communities
    are equitable, diverse, connected, and democratic—and provide a good quality of
    life [4].


    In Figure 1.1, the environment supports human society by providing natural resources
    and absorbing human wastes. Human society contains not only economic activities,
    but also includes education, health systems, and communities. A strong economy
    does not necessarily lead to a high standard of living. In many developing countries,
    high economic growth is built upon the poor standard of living, poor working conditions,
    and sacrifice of the natural environment. Clearly, a sustainable economic growth
    must be based on a sustainable society and a sustainable environment. Key issues
    in the development of policies for sustainable development will entail complex
    decisions about the management of natural resources and more generally about balancing
    environmental, economic, and societal needs [5]. With the ratification of the
    United Nations and ICLEI Triple Bottom Line (TBL) standard for urban and community
    accounting in early 2007, the triple bottom line captures an expanded spectrum
    of values and criteria for measuring organizational (and societal) success: economic,
    ecological, and social. The triple bottom line approach to organizational reporting
    (also known as “sustainability reporting”) coincides with the three pillars of
    sustainable development.


    Technological evolution is a slow process as compared to population growth. It
    takes a long time to discover new affordable energy sources and new forms of natural
    resources. Population growth happens more quickly'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'than the evolution of technology. To maintain the health of an ecosystem and
    human society, a key issue in environmental and economic policy is balancing individual
    interests and the common good [5, 6].


    Here we use “blood tantalum” to illustrate what sustainable development is on
    a global scale.


    A typical Nokia mobile phone contains about 40 milligrams of Tantalum. Tantalum
    is a rare metal with a melting point of 2,996°C, and it is a superlative thermal
    conductor. Almost two-thirds of the world’s tantalum production ends up in high-quality
    capacitors that are used in devices such as mobile phones and other electronic
    gadgets.


    However, as the mining company supplying more than 50% of the world’s tantalum
    demand, Australia’s Talison Minerals has instead spent the past three years scaling
    down its operations. The roots of Talison’s problems lie in a conflict that is
    being fought 10,000 kilometers away on the other side of the Indian Ocean.


    For much of the past decade, cheap supplies of tantalum derived from mines under
    the control of various rebel groups based in the northeastern regions of the Democratic
    Republic of Congo (DRC) have flowed into a long and complex supply chain. Among
    those groups profiting from this trade are Hutu militia associated with the 1994
    Rwandan genocide. Coltan (columbite-tantalite) is found in alluvial deposits or
    mined in primitive open-cut pits by workers, some of whom are children, enslaved
    or indentured, using the most basic of tools.


    The International Rescue Committee refugee action group says the conflict in the
    DRC has resulted in the death of over 5.4 million Congolese over the past decade.
    The investigation was part of an online project called Making a Killing: The Business
    of War, which explored the world of arms traffickers, resource exploiters, and
    corrupt politicians who profited from wars and also developed an interest in perpetuating
    them.


    There is pressure being exerted by manufacturers in the electronic industry supply
    chain to keep prices low, which encourages buyers to seek the cheapest possible
    sources. If new compliance is created to prohibit the use of “blood tantalum,”
    that type of compliance is going to make life tougher for the likes of Apple®,
    Sony®, Dell, and Nokia [7].'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'An ordinary consumer who simply purchases a mobile phone with the lowest price
    may not only indirectly have sponsored a civil war in Congo and Hutu militia associated
    with the 1994 Rwandan genocide, but also accelerated the falling of Talisman Minerals.
    However, without this direct information, an ordinary consumer is unable to distinguish
    a mobile phone with or without “blood tantalum.” It is also impossible for an
    ordinary consumer to track the upper stream of the supply chain to find out where
    the rare materials of a mobile phone come from. Therefore, ordinary consumers
    should not be blamed for their actions. The invisible hand of the market seems
    to lose its magical power because the global supply chain is too complex to indicate
    where the raw materials come from. Government intervention is necessary to force
    producers to provide adequate, clear, and accurate information to support ordinary
    consumers to make ethically correct decisions without any extra costs. This kind
    of intervention requires adequate analysis tools and practice to take account
    of all three pillars of sustainable development to give consumers and producers
    a complete picture. In the meantime, the cost of the extra sustainability analysis
    should be minimized to avoid disadvantaging producers.


    # 1.2 INTRODUCTION TO COMPUTATIONAL INTELLIGENT DATA ANALYSIS


    Over the past 50 years, we have witnessed the creation of high-capacity digital
    data storage and powerful CPUs (central processing units) to store and process
    millions and millions of bytes of data. Pens and paper have been replaced by computers;
    days of mindless calculation have been replaced by a command to the machine, which
    then effortlessly, accurately, effectively, and instantaneously carries out the
    calculation. The popularization of computers has enabled modern data analysts
    to type in a few symbols to complete tasks that have previously taken days to
    perform.


    A possible definition of data analysis is the process of computing various summaries
    and derived values from the given collection of data [8]. No one sets out simply
    to analyze data. One always has some objective in mind: one wants to answer certain
    questions. These questions might be high-level general questions, perhaps exploratory;
    or the questions might be more specifically confirmatory. Orthogonal to the exploratory/confirmatory
    distinction, we can also distinguish between descriptive and inferential analysis.
    A descriptive (or summarizing) analysis is aimed at making a statement about the
    dataset at hand. In contrast, an inferential analysis is aimed at trying to draw
    conclusions that have more general validity.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/644775a10ad87164013616d709050cee_27_0.png)


    FIGURE 1.2 Iterative process of data analysis.


    Often, inferential studies are based on samples from a population, the aim of
    which is to try to make some general statements about some broader aspect of that
    population, most (or some) of which has not been observed.


    In practice, data analysis is an iterative process (Figure 1.2). After a goal
    (or a question) is defined to indicate the success of the data analysis, the relevant
    data is collected. One studies the data, examining it using some analytic techniques.
    One might decide to look at it another way, perhaps modifying it in the process
    by transformation or partitioning, and then go back to the beginning and apply
    another data analytics tool. This can go round and round many times.


    Computational intelligent data analysis does computerize the iterative data analysis
    process by removing tedious and mindless calculations. Computational intelligent
    data analysis goes beyond this scope. It aims to design algorithms to solve increasingly
    complex data analysis problems in changing environments. It is the study of adaptive
    mechanisms to enable or facilitate the data analysis process in complex and changing
    environments. These mechanisms include paradigms that exhibit an ability to learn
    or adapt to new situations, to generalize, abstract, discover, and associate [9].
