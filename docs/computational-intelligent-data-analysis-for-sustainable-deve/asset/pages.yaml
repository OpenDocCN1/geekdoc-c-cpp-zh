- pgno: 65
  md: 'minimizes the objective function subject to the constraints. The optimization
    problem is therefore given by


    $$\min f(\mathbf{a}^0,\mathbf{a}) \quad \text{subject to} \quad \mathbf{G}\mathbf{a}=\mathbf{c}$$


    For the Eora model, the objective function was based on Byron''s (1978) approach,
    which uses a quadratic Lagrange function of the form


    $$f=(\mathbf{a}^0-\mathbf{a})\Sigma_a^{-1}(\mathbf{a}^0-\mathbf{a})+\lambda''(\mathbf{G}\mathbf{a}-\mathbf{c})$$


    where $\Sigma_a$ denotes a diagonal matrix with the $\sigma_a$ values of the vector
    as the main diagonal. First-order conditions then must be applied in order to
    find the Lagrange multiplier and then the Final MRIO.


    To calculate the Lagrange multiplier, a matrix inversion must be calculated, which
    would have proven to be calculation intensive and possibly numerically unstable
    for a very large problem like the Eora problem. To avoid the explicit calculation
    of the Lagrange multipliers and matrix inversion, Van der Ploeg (1982) elegantly
    reformulates Byron''s approach using the following ideas:


    +   1. Reorder the rows of matrix $G$ and the right-hand side vector $c$ such
    that all rows for hard constraints are at the top, followed by the rows belonging
    to soft constraints. Let $G_{hard}$ and $G_{soft}$ denote the block of constraint
    lines that belongs to the hard constraints and the soft constraints, respectively.
    Then $G$ and $c$ can take the form


    $$G=\begin{pmatrix}G_{hard}\\G_{soft}\end{pmatrix} \quad \text{and} \quad c=\begin{pmatrix}c_{hard}\\c_{soft}\end{pmatrix}$$


    Because soft constraints are not completely reliable, they may be violated to
    some extent. These violations are taken care of by introducing a disturbance $\varepsilon_i$
    for each soft constraint (note that there are no disturbances introduced for hard
    constraints, as they must be adhered to exactly). Let $\varepsilon$ be the vector
    of all disturbances; then the system of soft constraints becomes


    $$G_{soft}a=c_{soft}+\varepsilon \Leftrightarrow G_{soft}a-\varepsilon=c_{soft}$$'
