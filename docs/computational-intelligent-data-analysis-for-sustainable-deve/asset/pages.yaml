    # 4.8.2 Pseudoproxy Experiments


    The literature is replete with discussions of the variously applied CFR methods
    and their performance (see [29] for a cogent summary of many employed methods).
    Given this large number of proposed approaches, it has become important to establish
    means of comparing methods using common datasets. An emerging tool for such comparisons
    is millennium-length, forced transient simulations from Coupled General Circulation
    Models (CGCMs) [1, 30]. These model simulations have been used as synthetic climates
    in which to evaluate the performance of reconstruction methods in tests that have
    been termed pseudoproxy experiments (see [85] for a review). The motivation for
    pseudoproxy experiments is to adopt a common framework that can be systematically
    altered and evaluated. They also provide a much longer, albeit synthetic, validation
    period than can be achieved with real-world data, and thus methodological evaluations
    can extend to lower frequencies and longer timescales. Although one must always
    be mindful of how the results translate into real-world implications, these design
    attributes allow researchers to test reconstruction techniques beyond what was
    previously possible and to compare multiple methods on common datasets.


    The basic approach of a pseudoproxy experiment is to extract a portion of a spatiotemporally
    complete CGCM field in a way that mimics the available proxy and instrumental
    data used in real-world reconstructions. The principal experimental steps proceed
    as follows: (1) pseudoinstrumental and pseudoproxy data are subsampled from the
    complete CGCM field from locations and over temporal periods that approximate
    their real-world data availability; (2) the time series that represent proxy information
    are added to noise series to simulate the temporal (and in some cases spatial)
    noise characteristics that are present in real-world proxy networks; and (3) reconstruction
    algorithms are applied to the model-sampled pseudo-instrumental data and pseudoproxy
    network to produce a reconstruction of the climate simulated by the CGCM. The
    culminating fourth step is to compare the derived reconstruction to the known
    model'
