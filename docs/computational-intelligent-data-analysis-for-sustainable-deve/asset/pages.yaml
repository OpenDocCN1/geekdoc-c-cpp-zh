    # 9.3 DETECTION AND VISUALIZATION OF INTER-AREA OSCILLATORY MODES


    Inter-area mode oscillations in power systems are global small-signal stability
    problems based on the architecture of the system. Given a specific system topology,
    these oscillatory modes result. Each system will have its own characteristic modes
    that can be excited under a various number of stress conditions. When excited,
    these modes create oscillations in power, generating unnecessary power flows,
    which serve to introduce added stress to the system. If under-damped or left unchecked,
    these oscillations have the potential to incite cascading blackouts.


    Due to these hazards, several different control schemes have been implemented
    that specifically target modes of known oscillation frequencies. A major pitfall
    of these methods is that they rely on knowing the specific inter-area modal frequencies
    in advance to design the control scheme. These mode frequencies can be calculated
    from the system topology but in many cases the system models may be inaccurate,
    incomplete, or unavailable. Additionally, as the system topology changes over
    time, the mode frequencies will change with it. These factors can contribute to
    an improperly tuned control system.


    With the proliferation of high time resolution power system measurement devices,
    it becomes possible to observe these inter-area modes as they occur. As more devices
    are installed across the system, a more complete picture of the different regions
    is achieved. The increased number of measurement vectors allows for identification
    of coherent generator groups and their associated geographic regions.


    The work presented in this section outlines the procedures in developing a solution
    to extract an inter-area mode and determine its amplitude, phase, and damping
    at each measurement point, and it is based on the paper by Bank, Omitaomu, Fernandez,
    and Liu [8].


    # 9.3.1 Signal Preprocessing


    In order to provide a better fit of the oscillatory content, the measurement data
    needs to be properly conditioned first. An example of measured frequency data
    is given in Figure 9.1(a). It is desired to extract the properties of this oscillation.'
