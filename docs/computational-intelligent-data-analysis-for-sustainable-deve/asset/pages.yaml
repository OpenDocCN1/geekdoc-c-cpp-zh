  md: '# 4.6.2 Data Challenges


    Here we introduce some challenges posed by the available data. Data challenges
    are further discussed in Section 4.11. Serious constraints come from the dimensions
    of the available data. Reliable climate observations often do not extend more
    than 40 or 50 years into the past. This means that, for example, there may be
    only 40 or 50 available observations of January–March average precipitation. Moreover,
    the quality and completeness of that data may vary in time and space. Climate
    forecasts from GCMs often do not even cover this limited period. Many seasonal
    climate forecast systems started hindcasts in the early 1980s when satellite observations,
    particularly of SST, became available. In contrast to the sample size, the dimension
    of the GCM state-space may be of the order 10⁶, depending on spatial grid resolution.
    Dimension reduction (principal component analysis [PCA] is commonly used) is necessary
    before applying classical methods like canonical correlation analysis to find
    associated features in predictions and observations [5]. There has been some use
    of more sophisticated dimensionality reduction methods in seasonal climate prediction
    problems [53]. Methods that can handle large state-spaces and small sample size
    are needed. An intriguing recent approach that avoids the problem of small sample
    size is to estimate statistical models using long climate simulations unconstrained
    by observations and test the resulting model on observations [18, 115]. This approach
    has the challenge of selecting GCMs whose climate variability is “realistic,”
    which is a remarkably difficult problem given the observational record.


    # 4.6.3 Identifying Predictable Quantities


    The initial success of climate forecasting has been in the prediction of seasonal
    averages of quantities such as precipitation and near-surface temperature. In
    this case, time averaging serves as a filter with which to find predictable signals.
    A spatial average of SST in a region of the equatorial Pacific is used to define
    the NINO3.4 index, which is used in ENSO forecasts and observational analysis.
    This spatial average serves to enhance the large-scale predictable ENSO signal
    by reducing noise. The Madden-Julian Oscillation (MJO) is a sub-seasonal component
    of climate variability that is detected using time and space filtering. There
    has been some work on constructing spatial filters that were designed to optimize
