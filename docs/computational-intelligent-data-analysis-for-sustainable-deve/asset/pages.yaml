- pgno: 244
  md: 'course, the complex load profiles of devices are superimposed on each other,
    which makes an accurate, nonambiguous disaggregation difficult to achieve.


    Because basic features, which are also referred to as *macroscopic features*,
    such as consumption or real and reactive power, have their limitations, features
    on the *microscopic* level have been studied in order to obtain more accurate
    results [142]. Microscopic features refer to characteristics of the underlying
    electrical signal, which can be measured at frequencies of at least in the kilohertz
    range. This allows for identification of waveform patterns and the harmonics of
    the signal. Using these features yields better results than disaggregation based
    on basic features alone. However, such measurements require dedicated hardware
    and additional processing capacities, which limits their practical use.


    The *optimization* step (which is a common task in data analysis; see Section
    7.4.7) tries to find an assignment to the state matrix that best matches the observed
    values. This answers the question of which device was active during which period
    and at which power level.


    A common approach to finding the state matrix is to create a *hidden Markov model
    (HMM)* of the system [31, 78, 82]. Each device is represented by an HMM, which
    is a flexible structure that can capture complex behavior. Roughly, a sharp change
    in power consumption corresponds to a state change within a device HMM. The challenge
    is to extract the HMM parameters from the observed meter data. This is often supported
    by a supervised training phase where known features are being used.


    # 7.4.5.2 *Practical Applications*


    Accurate load disaggregation could replace sub-metering, at least for some applications.
    But even with the currently available level of accuracy, useful applications seem
    feasible. For example, Chen et al. [31] is using meter data from water consumption
    to identify activities such as showering or washing. This work improves results
    by evaluating the specific context in which load disaggregation is being used.
    Usage patterns depending on the time of day, household size, and demographics
    help to derive statistical information about appliance use, such as the distribution
    of washing machine usage. Reportedly, it also helped people make decisions about
    more efficient resource usage, for example, by replacing appliances with more
    efficient ones.


    It remains a challenge to improve the accuracy of NILM for practical applications.
    Many studies assume that the features of the involved devices are known in advance.
    In such *supervised* settings, it is necessary'
