    for electrical power, one has to keep in mind some key parameters of such systems.
    The first is the efficiency and refers to the percentage of stored energy that
    can be regained. It is always below 100%. Other parameters are the capacity and
    the peak power of a storage system, which refer to the performance of such systems.


    Today, the only storage systems with the ability to store a relevant amount of
    energy for a reasonable price are pumped-storage water-power plants. They store
    energy by pumping water from a low reservoir up into high storage and regain this
    potential energy by letting the water run down through generators, just like in
    water-power plants. While this type of storage could store energy for an almost
    unlimited time, its land use is quite high and it requires a natural height difference,
    which makes it difficult to realize such storage in densely inhabited regions.


