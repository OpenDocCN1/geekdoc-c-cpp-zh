    # 11.3.4 The Eigenvalue Spectrum and Comparison to Random Matrices


    To quantify the varying degrees of correlation in the above matrices, we enlist
    solutions to similar problems found in fields such as financial economics (markets,
    stocks, equities, etc.) and climate forecasting [9, 18].


    Work in these areas suggests that the correlation structure of systems can be
    characterized by examining the eigenvalue spectra of correlation matrices. Much
    success has been found in testing the significance of these metrics using results
    from random matrix theory (RMT).


    To test for nonrandom structure in our correlation matrices, we consider two related
    groups of matrices: Gaussian and Wishart. Entries of a Gaussian matrix, *G*, are
    drawn from a standard normal, and a Wishart matrix, *W*, is formed by matrix multiplication
    of a Gaussian matrix and its transpose, *W* = *GG*ᵀ [3]. The key observation is
    the direct analogy between formulation of the Wishart matrix and cross-correlation
    matrix. We use these random Wishart matrices as null models to our cross-correlation
    measures.'
