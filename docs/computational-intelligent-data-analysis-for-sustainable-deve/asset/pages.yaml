    # 5.3 UNCERTAINTY ASSESSMENTS


    # 5.3.1 Statistical Modeling of Uncertainty in Multimodel Ensembles


    Here we discuss the state-of-the-art in uncertainty quantification (UQ) for situations
    where ensembles of global climate models or Earth system models (GCMs/ESMs) are
    used to assess regional climate change. While statistical and dynamical (regional
    climate models) downscalings are often used for regional assessments, they are
    in turn driven by ESMs, and hence UQ in ESMs remains an important challenge. UQ
    is often inundated with a sense of urgency, and ensembles of ESMs are tools from
    which practical and timely uncertainty assessments can be readily formed.


    Structural uncertainty, or that which arises from variations in the mathematical
    mechanics of climate models, is the principal focus of UQ in approaches discussed
    in this section; it has been studied in several forms with multimodel ensembles
    where weights are assigned to individual models as a measure of their reliability.
    We distinguish the ensemble approaches discussed here from other UQ methodologies—for
    example, physics perturbed ensembles—that have been used to explore parameter
    uncertainty within single climate models (Stainforth et al., 2005), and approaches
    based on or similar to polynomial chaos expansion (see Section 5.3.2). It is important
    to be aware of all approaches for'
