    # 11.3.3 Correlation Matrices


    Having established a measure of correlation and corresponding null model to assess
    significance, we seek to couple this analysis with spatial dimensions. We would
    like to detect correlations not only in time, but also in space.


    To do this, we form a $K \times T$ matrix, $\mathbf{Y}$, where $K$ is the number
    of locations across the city and $T$ is the length of each time series. Keeping
    track of which location each time series corresponds to, we can associate real
    city locations with correlations. The delayed correlation matrix for a specific
    lag $m$, $\mathbf{C}(m)$, is then constructed by matrix multiplication


    $$\mathbf{C}(m)=\frac{1}{T}\mathbf{Y}\mathbf{Y}^{T}(m)$$


    where $T$ is a regular matrix transposition. The elements of $\mathbf{C}$ are
    given by


    $$C_{ij}(m)=\sum_{t=1}^{T} y_i(t)y_j(t+m)$$


    Note that $m=0$ corresponds to zero lag.


    To illustrate this procedure, we test for correlations in drug-related offenses
    between different neighborhoods across time over the year 1999. Conditioning the
    data as described above, time series are constructed for 35 lattice points. These
    points are neighborhoods with enough crime to sufficiently populate daily time
    series. The zero-lag cross-correlation, measuring real-time correlation is displayed
    in Figure 11.7(a).


    Entry $C_{ij}$ of this matrix represents the cross-correlation between the time
    series of drug-related crimes from locations $i$ and $j$. In examining this matrix,
    no strong patterns or regions of high correlation are immediately visible. It
    should be noted that the numbers $i$ and $j$ correspond to time series labels
    and not actual location coordinates, but the labeling'
