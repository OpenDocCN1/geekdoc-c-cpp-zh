  md: 'results in financial economics, we adopt the use of the inverse participation
    ratio (IPR) to examine the component structure of the significant eigenvectors.
    The IPR of a vector is given by


    \[

    IPR(\vec{v}_i) = \sum_{j=1}^K |u_{ij}|^4

    \]


    [1]. A large IPR implies that only a few components contribute to the eigenvector,
    while a small IPR indicates participation of many components. It is possible to
    determine clustering structure from such analysis. For example, in financial data,
    the eigenvector corresponding to the large “market” eigenvalue has a low IPR,
    identifying itself as a force that affects all stocks equally. Other eigenvectors,
    with larger IPRs, have components that are concentrated in various sectors of
    the market [1]. For crime data, these components correspond to locations across
    the city so a cluster of eigenvector components would correspond to a cluster
    of neighborhoods.


    Examining the IPRs for significant eigenvectors in lagged correlation matrices,
    our results show that the eigenvector corresponding to the largest eigenvalue
    has a low IPR and can thus be interpreted as a “market” force. For the remaining
    significant eigenvectors, we find that they too have low IPRs, suggesting there
    is little clustering or community structure (Figure 11.9).


