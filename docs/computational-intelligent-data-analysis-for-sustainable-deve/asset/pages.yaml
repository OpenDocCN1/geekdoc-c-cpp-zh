    Electric mobility can only be sustainable if the consumed energy is also sustainable.
    As electric mobility will lead to an increased consumption of energy, even more
    renewable sources are needed to satisfy this new demand. Furthermore, the demand
    for charging electric vehicles is highly volatile, and peak demands can hardly
    be supplied if they are not aligned with the production and distribution of energy.
    In addition, charging too many electric vehicles at the same time in the same
    segment of the electricity grid might lead to overloads and, in the worst case,
    to power outages. At the same time, the typical average load of the electricity
    grid leaves, by far, enough capacity to charge electric vehicles. Again, tackling
    such peak demands with increased grid capacities is expensive, and it does not
    solve the issue of insufficient production of renewable electricity at certain
    points in time. Therefore, an intelligent control of charging is necessary to
    integrate electric vehicles with the smart grid.


    Electric mobility should not only be seen as a challenge, but rather as a chance
    to realize the smart grid. For example, intelligent techniques could schedule
    the charging processes of electric vehicles in order to avoid electricity network
    issues, to realize demand response (e.g., charge when renewable production is
    high and further demand is low), and to fulfill user needs (e.g., have the vehicle
    charged to a certain level when the user needs it). In addition to smart charging,
    the batteries of electric vehicles might also be used as a buffer in the electricity
    grid. That is, energy from the vehicle might be fed into the electricity network
