    improve when moving to less expensive solutions (like *quality of sensitive landscapes,
    wellness of wildlife, soil quality*). This is due to several reasons, depending
    both on the type of power plants installed and on the secondary activities.


    For example, wind turbines have a good effect on the air quality, but they are
    also considered aesthetically unpleasant, so they cannot be installed in sensitive
    zones, such as on hilltops, without having protests from the residents (receptor
    *quality of sensitive landscapes*). Unluckily, the hills are also the most windy
    zones in Emilia-Romagna.'
