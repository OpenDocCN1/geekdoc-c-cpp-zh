- pgno: 60
  md: '0 are called *hard constraints*. Other hard constraints include upper and lower
    bounds, specifying that transactions may never be negative, or the constraint
    that subsidies (recorded as negative values) may never be positive. Therefore,
    these constraints also have standard deviations of 0. Other constraints like the
    previous example of the U.S. GDP might be less reliable and have positive standard
    deviation values. These are *soft constraints*. Clearly, if the same piece of
    information from two different sources states different facts, at least one of
    the two must be incorrect. In reality, this will most likely hold for both. But
    one of the data sources might be more reliable than the other one. In this case,
    for example, the data for the total U.S. GDP provided by a national statistical
    agency could be far more reliable than what the UN reported. Hence, an external
    condition that is not 100% reliable does not have to be 100% fulfilled by the
    MRIO.


    This concept holds for the elements in the MRIO. Each transaction value in the
    MRIO is subject to a certain reliability. That means that every element in the
    Raw Data Table can be adjusted (within a certain range determined by its reliability)
    and still represent the real transaction value reasonably well.


    Reliability data is usually not published by statistical agencies. In these cases,
    the reliability information can be estimated. We use a variety of heuristics to
    estimate the reliability of various datasets. Large transaction values are typically
    well-measured and thus more reliable than small values (Lenzen et al., 2010).
    We assign a higher reliability to national statistical agency data than to UN
    data, and higher reliability to UN economic data than to trade data. The published
    Eora results include the information about our reliability estimates of every
    dataset. Because the final MRIO table is a composite of these data, we also provide
    reliability figures for the final table showing how reliable each value in the
    table is, based on the combined reliability of the various input data forming
    that result.


    # 2.4.2 The Concept of Constrained Optimization


    The basic idea of constrained optimization is the following:


    Obtain the Final MRIO by reconciling the elements of Raw Data Table according
    to their reliability in such a way that


    +   1. All hard external conditions are fulfilled exactly.

    +   2. All soft external conditions are well satisfied, the degree of fulfillment
    being determined by their reliability.

    +   3. The original Raw Data Table is minimally disturbed.'
