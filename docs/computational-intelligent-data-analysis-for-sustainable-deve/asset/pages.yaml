    generation about linkages in the climate system, as test-beds for evaluating proposed
    real-world analyses [24], and, of course, future predictions [61]. Quantifying
    the structural uncertainty in model parameterizations or the model framework,
    the impact of known imperfections in the realizations of key processes, and the
    necessity of compromises at small spatial or temporal scales are all important
    challenges.


    # ### 4.3.7 Regional Climate Model (RCM) Output


    Global models necessarily need to compromise on horizontal resolution. In order
    to incorporate more details at the local level (particularly regional topography),
    output from the global models or the global reanalyses can be used to drive a
    higher-resolution, regional climate model. The large-scale fields can then be
    transformed to higher resolution using physical principles embedded in the RCM
    code. In particular, rainfall patterns that are very sensitive to the detailed
    topography are often far better modeled within the RCM than in the global-scale
    driving model. However, there are many variables to consider in RCMs—from variations
    in how the boundary field forcing is implemented and in the physics packages—and
    the utility of using RCMs to improve predictions of change is not yet clear. A
    coordinated experiment to test these issues is the North American Regional Climate
    Change Assessment Program (NARCCAP) [60].


    # ### 4.4 SCIENTIFIC PROBLEMS IN CLIMATE INFORMATICS


    There are a number of different kinds of problems that climate scientists are
    working on where machine learning and computer science techniques may make a big
    impact. This is a brief description of a few examples (with discussion of related
    work in the literature) that typify these ideas, although any specific implementation
    mentioned should not be considered the last word. This section provides short
    descriptions of several challenging problems in climate informatics broadly defined.
    In Section 4.5 we present problems in climate data analysis. In subsequent sections
    we delve into more detail on some specific problems in climate informatics.'
