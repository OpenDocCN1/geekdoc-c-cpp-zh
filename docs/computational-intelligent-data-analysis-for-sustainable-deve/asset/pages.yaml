- pgno: 182
  md: 'Programming (BLP). CEA ranks and selects in a manner similar to BT, but project
    rankings are based on the ratio of the benefit score per dollar of cost. Consequently,
    CEA can achieve a greater value per dollar spent. It typically performs much better
    than BT and has the added advantage of being intuitive, easy to explain, and relatively
    easy to sell to program managers. On the other hand, it achieves suboptimal results
    under many conditions (Messer, 2006) and is difficult to extend to problems with
    complex constraint structures or nonlinear benefit functions.


    BLP (sometimes referred to as Binary Integer Programming (BIP)) is an extension
    of linear programming in which the decision variables take binary values that
    represent the decision to fund (given a value of zero) or not fund a project (given
    a value of one). An advantage of the binary formation of this problem is that
    the objective function can be represented as a vector of benefit scores multiplied
    by the binary decision variables. This objective function is maximized subject
    to a budget constraint and potentially under additional program-specific constraints.
    A BLP model typically is solved with a branch-and-bound algorithm and is a reliable
    algorithm as it will always identify the true optimum when feasible. Its performance
    vis-à-vis CEA ranges from a marginal improvement to, at most, twice the level
    of benefit achieved by CEA (Dantzig, 1957).


    Conservation programs generally have been slow to adopt either of these methods.
    Despite the promise of a substantial increase in environmental benefit offered
    by either CEA or BLP, the only conservation organization known to be using either
    one is the Baltimore County Division of Environmental Protection and Resource
    Management (DEPRM), which has used CEA for its agricultural protection program
    since 2007. During the first 3 years that DEPRM used CEA, it protected 680 more
    acres of land worth $5.4 million than its previous BT process would have under
    the same budgets (Kaiser and Messer, 2011).


    Researchers have studied this lack of adoption (e.g., Prendergast et al., 1999;
    Messer, Allen, and Chen, 2011; Pressey and Cowling, 2001) and identified several
    barriers in the conservation decision process. For example, Prendergast et al.
    (1999), through an informal interview process involving a sampling of ecologists
    and land managers, identified three main barriers to adoption: (1) lack of knowledge
    of the alternative methods, (2) lack of resources, and (3) real and perceived
    shortcomings in the methods. A recent survey of Maryland’s county-level conservation
    program administrators suggested not only that managers were not familiar with
    either'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'BLP or CEA, but also that these managers did not consider that being cost-effective
    was a major priority, and also reported lacking incentives to adopt alternative
    selection approaches (Messer, Allan, and Chen, 2011).


    A common concern identified in these studies was a “black-box” perception of BLP.
    Program managers’ duties can include more than merely maximizing benefit scores.
    They also must defend the “value” achieved from donor, funding agency, and taxpayer
    money; ensure that participants get a fair deal from a transparent decision mechanism;
    and distribute funds in a manner that is perceived as equitable. BLP, as classically
    implemented, has been seen as lacking transparency and the flexibility necessary
    to address many of these duties, which can be thought of as secondary or operational
    objectives. These objectives may not immediately impact the primary goal of protecting
    high-quality land but still may be important factors in the decision-making process
    and thus significant barriers to the adoption of new approaches. Operational objectives
    can be incorporated as constraints, as was done by Önal et al. (1998), who used
    an optimization model to address both environmental and equity concerns in a watershed
    management scenario. Their model maximized total profit across a watershed with
    a chance constraint on chemical runoff levels to account for the stochastic nature
    of rainfall and a constraint on the equity of the program’s impact that was measured
    by an index of deviation from a uniform loss-sharing level. The study varied these
    constraints to examine trade-offs among income, pollution, and equity losses.
    This approach, however, still offered little ability to consider the sensitivity
    of the single solution provided or alternatives to it.


    A second option is to format the process as a Multiple-Objective Linear Programming
    (MOLP) problem (also referred to as Goal Programming) with the secondary objectives
    included as weighted goals. MOLP has been applied to several conservation programs:
    a balancing of economic and biological objectives over short-term and long-term
    time frames in fishery management (Dynan and Sandiford, 1985; Mardle and Pascoe,
    1999; Mardle et al., 2000), an optimization of environmental, social, and economic
    goals in energy production (Silva and Nakata, 2009); and management of public
    water resources (Neely et al., 1977; Ballestero et al., 2002). Önal (1997) considered
    an approach similar to MOLP in a forest management setting; he employed a model
    that, instead of minimizing deviations from a goal as is done in MOLP, used constrained
    deviations from a goal to maximize the discounted future harvest value while maintaining
    a minimum value for a species diversity index.'
