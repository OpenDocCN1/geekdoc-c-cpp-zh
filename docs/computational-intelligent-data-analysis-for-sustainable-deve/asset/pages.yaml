    # 7.4.6.1 Extending Data Management Techniques


    We observe the efficient aggregation of energy data as one of the main tasks for
    manual exploration. Abstracting from our toy example based on energy trades, the
    users are interested in various aggregations of the raw production, consumption,
    distribution, and sales data. In general, such processing is well known in the
    database community as *online analytical processing (OLAP).* Based on a user-specified
    hypothesis, the system must provide aggregated information with respect to a specific
    set of conditions. The conditions are described by the attributes (e.g., location,
    time, production type, etc.) and are structured based on a given hierarchy of
    granularities (e.g., weeks, months, years, etc.). Such OLAP systems have been
    proposed for sales analysis in retail companies. They provide the essential means
    for decision making but do not address the specific scenario of decisions based
    on energy data (see Scenario 7.6).


    Essential properties of energy production, distribution, and consumption are missed
    by these techniques. Modern data management techniques (see Section 7.4.1) try
    to overcome these challenges. In particular, large data volumes must be aggregated
    in main memory. This processing'
