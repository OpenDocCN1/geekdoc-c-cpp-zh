- pgno: 80
  md: 'Based on Equation (3.3), we have the following relations for the unaggregated
    model:


    $x=(I-A)^{-1}F=Lf$ (3.8)


    The calculation of CFs using MRIO is as follows:


    $C\otimes x=C\otimes Lf$ (3.9)


    For a particular region $s$, the carbon footprints, $w=\{w_j^s\}$, are calculated
    as follows:


    $w_j^s=\sum_q\left[\left(\sum_i\sum_l c_{lj}^{i}r_{ij}^{q}\right)f_j^{qs}\right]$
    (3.10)


    For the aggregate model, there are two alternative ways for the calculation of
    CFs:


    # Procedure 1:


    $\bar{w}=Zw$ (3.11)


    where $w$ is the CFs calculated from the unaggregated model. Because all the information
    of the unaggregated system is known and Procedure 1 is only a summation of relevant
    sectoral CFs in the original model, there is no aggregation bias. We define $\bar{w}$
    as the “true” value.


    # Procedure 2:


    In another procedure, we first aggregate the MRIO model based on Equations (3.4)
    through (3.7). From the aggregated model, we then calculate the CFs:


    $\bar{x}=(I-\bar{A})^{-1}\bar{f}=\bar{L}\bar{f}$ (3.12)


    $\bar{C}\otimes\bar{x}=\bar{C}\otimes\bar{L}\bar{f}$ (3.13)


    $\hat{w}_j^s=\sum_q\left[\left(\sum_i\sum_l\bar{c}_{lj}^{i}\bar{r}_{ij}^{q}\right)\bar{f}_j^{qs}\right]$
    (3.14)


    where $\hat{w}$ is the CFs calculated from the aggregate model. Procedure 2 is
    the question at issue in which aggregation bias will occur in the calculations'
