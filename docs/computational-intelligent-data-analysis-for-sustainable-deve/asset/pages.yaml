- pgno: 168
  md: 'An alternative promising approach for regression of unreliable variables, especially
    extremes, can be based on correlated but more reliable variables, or those that
    are currently better predicted. For example, although rainfall extremes may be
    difficult to characterize directly in terms of a set of covariates, given that
    rainfall extremes may be correlated with temperature in some way (O’Gorman and
    Schneider, 2009; Sugiyama et al., 2010), and temperature can be effectively characterized
    using suitable (sparse) regression models, one then obtains an indirect but reliable
    way to model rainfall extremes. The above idea is a prominent theme in multivariate
    or multiple output regression, especially in the context of spatial and geostatistics,
    where such models are studied as Linear Models of Coregionalization (LMC) (Wackernagel,
    2003; Gelfand and Banerjee, 2010) and related spatiotemporal models (Higdon, 2002;
    Mardia and Goodall, 1993). In recent years, correlated multiple-output, nonlinear,
    nonparametric regression models have been studied in statistical machine learning
    using Gaussian Processes (Agovic et al., 2011; Álvarez and Lawrence, 2011). In
    particular, our recent work on Probabilistic Matrix Addition (Agovic et al., 2011)
    has two additional capabilities that may be useful in this context: (1) the ability
    to utilize a nonlinear covariance function (kernel) K_x among the covariates,
    as well as a nonlinear covariance function K_y among the multivariate output (e.g.,
    precipitation and temperature); and (2) the ability to handle data matrices with
    missing entries. Recent literature has shown evidence that reliable auxiliary
    variables may contain valuable information on crucial variables that are currently
    difficult to physically model (e.g., O’Gorman and Schneider, 2009; Sugiyama et
    al., 2010), and the ideas outlined above may lead to a systematic way to leverage
    such signals. Such an accomplishment might not only enhance predictability of
    such key variables, but also augment physical understanding, which could inform
    future efforts in the climate modeling community.


    # ## 5.5 CONCLUSIONS AND FUTURE RESEARCH


    Computational data sciences may offer a path forward to one of the key science
    challenges relevant for stakeholders, resources managers, and policy makers—specifically,
    the consequences on statistical attributes of extreme events as a consequence
    of climate change. This chapter presented several critical challenges in the science
    of climate extremes that are not handled by the current generation of climate
    models, represent long-standing challenges in scientific understanding, may not
    be solved in the near future by'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'improvements in physics-based modeling, and where data-driven computational
    methods may offer novel solutions. The chapter presented specific details on three
    interrelated problem areas—*extremes characterization, uncertainty quantification,*
    and *enhanced prediction*—as well as several potential conceptual and methodological
    directions for the interdisciplinary computational and data sciences communities
    to advance the science in these areas.


    The close integration between physical understanding, or physics-based modeling,
    and data-driven insights is emphasized from three interrelated perspectives.


    +   1. Data-driven insights from observations inform model diagnostics and uncertainty
    quantification.

    +   2. Enhanced projections rely on data-guided functional mappings (e.g., between
    precipitation extremes and temperature), which in turn may be derived from both
    observations and model-simulations but remain conditioned on physics-based, model-simulated
    results in the future (e.g., future data-driven insights on precipitation extremes
    may be conditioned on projected temperatures in the future from models).

    +   3. New insights from massive data on multivariate associations derived from
    observed or model-simulated data not only improve our understanding of relevant
    processes but also may inform the physical formulation and parameter choices within
    global or regional climate models.


    This chapter made no attempt to comprehensively address two important research
    directions. The first area, on attribution of climate extremes, has been primarily
    motivated by prior and ongoing work led by the climate science community but has
    witnessed recent progress by the computer science community. The second area,
    on graphical models and complex networks in climate, has been motivated by nonlinear
    dynamics communities within the geosciences as well as more recently by the interdisciplinary
    data science communities. Attribution of climate extremes to global warming and
    anthropogenic emissions, regional changes in urbanization and land use, as well
    as other plausible causal factors, is a key concern for policy makers. The corresponding
    methods include data-driven approaches such as Granger causality and optimal fingerprinting,
    that, for example, may be used for attribution of global and regional changes
    in rainfall extremes (Min et al., 2011). Numerical modeling techniques'
