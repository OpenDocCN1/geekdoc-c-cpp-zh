  md: '# ### 4.4.1 Parameterization Development


    Climate models need to deal with the physics that occurs at scales smaller than
    any finite model can resolve. This can involve cloud formation, turbulence in
    the ocean, land surface heterogeneity, ice floe interactions, chemistry on dust
    particle surfaces, etc. This is dealt with by using parameterizations that attempt
    to capture the phenomenology of a specific process and its sensitivity in terms
    of the (resolved) large scales. This is an ongoing task, and is currently driven
    mainly by scientists’ physical intuition and relatively limited calibration data.
    As observational data become more available, and direct numerical simulation of
    key processes becomes more tractable, there is an increase in the potential for
    machine learning and data mining techniques to help define new parameterizations
    and frameworks. For example, neural network frameworks have been used to develop
    radiation models [50].


    # ### 4.4.2 Using Multimodel Ensembles of Climate Projections


    There are multiple climate models that have been developed and are actively being
    improved at approximately 25 centers across the globe. Each model shares some
    basic features with at least some other models, but each has generally been designed
    and implemented independently and has many unique aspects. In coordinated Model
    Intercomparison Projects (MIPs) (most usefully, the Coupled MIP (CMIP3, CMIP5),
    the Atmospheric Chemistry and Climate MIP (ACCMIP), the PaleoClimate MIP (PMIP3),
    etc.), modeling groups have attempted to perform analogous simulations with similar
    boundary conditions but with multiple models. These “ensembles” offer the possibility
    of assessing what is robust across models, what are the roles of internal variability,
    structural uncertainty, and scenario uncertainty in assessing the different projections
    at different time and space scales, and multiple opportunities for model-observation
    comparisons. Do there exist skill metrics for model simulations of the present
    and past that are informative for future projections? Are there weighting strategies
    that maximize predictive skill? How would one explore this? These are questions
    that also come up in weather forecasts, or seasonal forecasts, but are made more
    difficult for the climate problem because of the long timescales involved [40,
    97]. Some recent work has applied machine learning to this problem with encouraging
    results [63].'
