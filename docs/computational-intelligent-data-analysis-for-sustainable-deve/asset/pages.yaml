- pgno: 301
  md: '# 9.3.1.1 Signal Decomposition


    Empirical Mode Decomposition is a data-driven method that decomposes a signal
    into a set of Intrinsic Mode Functions (IMFs). Each IMF is an oscillatory signal
    that consists of a subset of frequency components from the original signal. As
    opposed to Fourier, wavelet, and similar methods, EMD constructs these component
    signals directly from the data by identifying local extrema and setting envelopes
    around the signal in an iterative process. A fit is then performed on the local
    extrema to create an IMF. After the creation of an IMF, it is subtracted from
    the original signal and the process repeats to identify the next IMF. This identification
    and removal process continues until the original signal has been completely described
    by a set of IMFs. The output of the EMD process is the set of IMFs; generally,
    this set is a small number of signals (usually less than ten for the data considered
    here) that, when summed together, completely match the original signal. The EMD
    algorithm does not explicitly compute oscillation frequencies, amplitudes, or
    phase angles as with other signal decomposition techniques; instead, the IMFs
    are derived directly from the input signal based on its local extrema. A complete
    mathematical description of the EMD algorithm is beyond the scope of this chapter
    but can be found in [9–12]. The EMD and associated Hilbert-Huang Transform have
    also been recently proposed as methods for isolating inter-area modes in power
    systems [16, 17].


    Performing an EMD on the Bangor trace of Figure 9.1(b) extracts the seven IMFs
    given in Figure 9.1(c). The first and second IMFs extracted in this process are
    given by the blue and green traces in Figure 9.1(c); these capture the high-frequency
    components and noise of the input signal. The next three IMFs given by the red,
    cyan, and violet traces capture the middle frequencies present in the signal.
    Finally, the last two IMFs extracted, those represented by the mustard and black
    lines, define the low-frequency components of the input, representing the event
    drop itself in this case.


    The Fourier transform of the IMF signals in Figure 9.1(c) is given in Figure 9.1(d).
    The frequency variable is plotted on a log scale to better demonstrate the frequencies
    in the lower range. The Fast Fourier Transforms (FFTs) have been scaled by their
    maximum values so that the low-frequency components do not dominate the plot.
    Inspection of IMF signals confirms that each IMF is capturing one specific band
    of the original signal. The first IMF extracted, which is plotted in blue, is
    centered around 3 to 4 Hz, and each subsequent one picks up successively lower-frequency
    components.


    Because the inter-area band is 0.1 Hz to 0.8 Hz, we would like to preserve only
    those IMFs that have a significant portion of their power in'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'this band, and discard the others. The final implementation of this filter
    computes the IMFs and then performs a Fourier transform of each one. Using the
    Fourier transform results, the percentage of power within the inter-area band
    is computed for each IMF. If this percentage exceeds a given threshold, the IMF
    is retained; otherwise, it is discarded. The final filter output is the summation
    of the retained IMFs. Through testing on several datasets, it was determined that
    cut-off frequencies of 0.1 Hz and 0.8 Hz with a power percentage threshold of
    0.75 provided the best response. These settings gave the best preservation of
    the inter-area band while removing most of the other frequency components.


    The total input filtering process for this modal identification application consists
    of three stages: first, the median detrending stage; followed by a moving median
    filter; and finally the EMD-based filter. This process serves to isolate only
    the frequency components within the inter-area band so that further processing
    can extract specified modes within this region. Applying this multistage filtering
    process to the set of example data results in the signals presented in Figure
    9.1(e). Comparing this plot with that of Figure 9.1(a), it is seen that the low-frequency
    trend is completely removed, leaving a zero-centered signal. Additionally, the
    higher frequency components and noise have also been removed from the raw data
    vectors. The oscillation in the inter-area band observed during the event drop
    is now the most prominent feature of the data, making it easier to extract from
    a computational viewpoint.


    This filtering procedure was found to function well for several types of data.
    It is demonstrated here on frequency measurement derived from the FDR system but
    it performs similarly for angle measurements from FDR and Phasor Measurement Unit
    (PMU) datasets. Given any of these different types of data, the filtering process
    returns a zero-centered signal with the isolated inter-area modes similar to that
    of Figure 9.1(e). The ability of this filtering process to work for various different
    types of datasets makes the final modal extraction procedure compatible with all
    these forms of input data. The remainder of the modal extraction procedure is
    tuned to handle data vectors similar to those of Figure 9.1(e); thus, any dataset
    that the input filter can reduce to that form can be processed.


