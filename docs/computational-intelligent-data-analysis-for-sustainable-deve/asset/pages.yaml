    The REA was admittedly ad hoc; however, its two notions of GCM skill and consensus
    (Giorgi and Mearns, 2002) have formed the foundation for a prominent line of work,
    beginning with Tebaldi et al., (2004), that formalized them in a Bayesian model.
    One of the most recent versions of this statistical model can be found in Smith
    et al. (2009), which also allows for the joint consideration of multiple regions.
    Specifically, using this model, a posterior distribution for past or current temperature
    μ and future temperature υ can be simulated from a Markov Chain Monte Carlo (MCMC)
    sampler using a weight λ_j for each GCM j. Next, each λ_j can be simulated from
    a posterior by considering the bias and consensus of GCM j. The weights λ_j then
    inform a new estimate of μ and υ, which informs a new estimate of each λ_j, and
    so on. Specifically, λ_j follows a Gamma posterior distribution with the following
    expectation:


    $$\mathbb{E}[\lambda_j\mid\cdot]=\frac{a+1}{b+0.5(X_j-\mu)^2+0.5(\vartheta_j-\upsilon-\beta(X_j-\mu))^2}\tag{5.5}$$


    where *a* and *b* are prior parameters (usually uninformative), β is an unknown
    quantity representing the correlation between historical and future model outputs,
    and θ is a random quantity that allows future climate variance to differ from
    that of the past. The conditionality serves to illustrate the fact that the expectation
    of λ_j is contingent upon the values of all other random parameters and data.
    Thus, the true value of λ_j is a function of the random quantities μ, υ, θ, and
    β, which in turn have their own posterior conditional distributions. In general,
    it is notable that under this formulation all of these random quantities are conditionally
    independent and cannot be readily analyzed marginally.


