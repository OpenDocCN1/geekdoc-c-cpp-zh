  md: 'For example, if we look at the energy production in each month, one could detect
    a high peak in August, which deviates from the residual months due to some unexpected
    high-energy production. The same statistics can be applied for all August months
    over several years and highlight a specific year. This leads to a very promising
    selection of attribute combinations, each with a high deviation in energy production.
    Overall, these unexpected measures can be seen as candidates for manual exploration.
    One can provide some of these attribute combinations to the user, and he or she
    will be able to refine these selections.


    Further techniques have been proposed for guided OLAP [121, 123]; they focus more
    on the interaction with the users and provide additional means for step-by-step
    processing through the OLAP cube and additional descriptions on the deviation
    of data. However, all these techniques are expensive in terms of computation.
    Similar to other automatic data-analysis techniques, they do not scale to energy
    databases with many attributes and millions of measurements on the very fine-grained
    level. Applications of such techniques are always limited by efficiency, and energy
    data pose one of the most problematic application areas with respect to scalability
    issues.


    # 7.4.6.3 Contrast Analysis and Emerging Patterns


    Another automated approach for pattern exploration is contrast analysis. This
    technique focuses on the extraction of descriptive, distinguishing, emerging,
    and contrasting patterns for two or more given classes in a database [22, 44,
    79]. Contrast analysis techniques provide subsets of attributes (and attribute
    values) as contrasting patterns. For example, given a database with more than
    two persons living in the same household and another database of energy profiles
    for single households, one might be interested in comparing these two groups of
    customers. Such automatic comparison can provide the characteristic differences
    in the behavior of people. On the one side, these differences can be used as input
    to any learning task. On the other side, they provide the essential means for
    human exploration. We focus here on the latter one and highlight the technical
    challenges in contrast analysis.


    For human exploration it is always essential to have outputs that are easy to
    understand. In contrast analysis, one research direction is based on so-called
    contrast sets [22]. They form characteristic attribute combinations that show
    high deviation in the two databases. For example, the energy consumption with
    respect to washing machines could be one of'
