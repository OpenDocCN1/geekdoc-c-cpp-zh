- pgno: 77
  md: 'Hertwich, 2008; Hertwich and Peters, 2009; Zhou et al., 2010). For reviews
    in this area, see Wiedmann (2009b) and Minx et al. (2012).


    The MRIO model used is Asian Input-Output (AIO) Table 2000 (AIO, 2000), which
    is published by the Institute of Developing Economies (2006). The AIO 2000 is
    a Chenery-Moses type of model (Chenery, 1953; Moses, 1955), including 76 sectors
    for ten Asian-Pacific economies (Indonesia, Malaysia, the Philippines, Singapore,
    Thailand, Mainland China, Taiwan, the Republic of Korea, Japan, and the United
    States). By aggregating sectors randomly, we tested the magnitude of aggregation
    errors and analyzed them as random variables.


    # 3.2 TEST OF AGGREGATION EFFECT


    A typical MRIO model for the supply-and-demand equilibrium among sectors and regions
    can be expressed as follows:


    $$x_i^r = \sum_s \sum_j t_{ij}^{rs} + \sum_s f_i^{rs} \tag{3.1}$$


    where $r$ and $s$ are regions, $i$ and $j$ are sectors, $x_i^r$ is sector $i$’s
    outputs in region $r$, $t_{ij}^{rs}$ is sector $i$’s outputs in region $r$ that
    are used as inputs to sector $j$ in region $s$ (intermediate demand), and $f_i^{rs}$
    is final demand of product $i$ in region $s$ that is supplied by region $r$.


    By defining the input coefficients $a_{ij}^{rs}=t_{ij}^{rs}/x_j^s$, Equation (3.1)
    for a $k$-region model can be expressed in a matrix format as follows:


    $$\begin{pmatrix}x^1\\x^2\\\vdots\\x^k\end{pmatrix}=\begin{pmatrix}A^{11}&A^{12}&\cdots&A^{1k}\\A^{21}&A^{22}&\cdots&A^{2k}\\\vdots&\vdots&\ddots&\vdots\\A^{k1}&A^{k2}&\cdots&A^{kk}\end{pmatrix}\begin{pmatrix}x^1\\x^2\\\vdots\\x^k\end{pmatrix}+\begin{pmatrix}\sum_s
    f^{1s}\\\sum_s f^{2s}\\\vdots\\\sum_s f^{ks}\end{pmatrix}\tag{3.2}$$


    Introduced by Wassily Leontief in the early 1940s (Leontief, 1941), IOA has been
    widely used to predict a change in sectoral output that is driven by a change
    in final demand (Equation (3.3)). At regional levels, IOA can help predict the
    impacts of the establishment of a new factory on regional economy. At multi-region
    levels, IOA can analyze the trade relations among different regions.'
