    et al., 2009; Santer et al., 2009); in fact, the latter studies implicitly suggest
    that the MMA of a random selection of an adequate number of GCMs will form a reliable
    projection, at least for anthropogenic attribution. Equal-weighted MMAs may represent
    a more conservative approach, as optimum model weighting may hold less potential
    benefit than risk compared to equal weighting (Weigel et al., 2010). The MMA has
    been a default in some climate stakeholder assessment reports (Karl et al., 2009),
    where they are sometimes displayed visually without clear reference to uncertainty.
    This may be a questionable practice, as averaging of dynamically consistent spatial
    fields or time series may lead to physically meaningless signals, and the exclusion
    of individual model results may serve to obscure plausible lower and upper bounds
    of climate change (Knutti et al., 2010). A recent case study (Perkins et al.,
    2009) has also implicitly questioned the notion of *a priori* use of MMAs and
    inclusion of demonstrably poor GCMs. Work with historical (20th century) observations
    and simulations of Indian monsoon climatology (Kodra et al., 2012) may suggest
    that the MMA should not be a default choice, and that all models within an ensemble
    should be evaluated carefully.


    Given this debate surrounding MMAs, the display of worst and best cases as derived
    from archived GCM outputs may be advisable as the bare minimum requirement for
    communicating uncertainty. However, because multimodel ensembles are not true
    random samples of independent GCMs from a larger population, they should not be
    considered formal probability distributions (Tebaldi and Knutti, 2007). More rigorous
    and statistically grounded approaches may be desired; recently, several notable
    probabilistic approaches have been developed: Giorgi and Mearns (2002) proposed
    the Reliability Ensemble Average (REA) method for assigning reliability to simulations
