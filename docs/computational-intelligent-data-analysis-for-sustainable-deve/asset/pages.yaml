- pgno: 408
  md: 'Finally, the choice of Constraint Programming greatly enables model flexibility.
    In discussions with experts, it is often the case that they change their minds
    on some model constraints or on objectives. Therefore, flexibility in dealing
    with side constraints and in dealing with nonlinear constraints facilitates knowledge
    acquisition making Constraint Programming the technique of choice for the problem
    and its future extensions.


    # 12.6 CONCLUSION AND FUTURE OPEN ISSUES


    Global public policy making is a complex process that is influenced by many factors.
    We believe that the use of constraint reasoning techniques could greatly increase
    the effectiveness of the process by enabling the policy maker to analyze various
    aspects and to play with parameters so as to obtain alternative solutions along
    with their environmental assessment. Given the amount of financial, human, and
    environmental resources that are involved in regional plans, even a small improvement
    can have a huge effect.


    Important features of the system are its efficiency, as a plan is returned in
    a few milliseconds; and its wide applicability to many regional plans, to provincial
    and urban plans, and also to private and public projects. The system was used
    for the environmental assessment of the regional energy plan of the Emilia-Romagna
    region of Italy. In addition to performing automatically the assessment (that
    was performed manually in previous years), the assessment for the first time includes
    the evaluation of alternative plans: this is a requirement of EU regulations that
    is largely disregarded in practice. Moreover, the alternative plans were produced
    by optimizing the quality of the environmental receptors, together with the cost
    for the community of the plan itself.


    This work is a first step toward a system that fully supports the decision maker
    in designing public policies. To achieve this objective, the method must be extended
    to take into account the individual level, by investigating the effect of a policy
    over the parties affected by it. This can be achieved by integrating constraint
    reasoning with simulation models that reproduce the interactions among the parties.
    In our current research, we are studying how the region can choose the form of
    incentives and calibrate them in order to push the energy market to invest in
    the directions foreseen by the Regional Energy Plan [13].


    In turn, these models can be enriched by adopting e-Participation tools that allow
    citizens and stakeholders to voice their concerns regarding'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'policy decisions. To fully leverage e-Participation tools, the system must
    also be able to extract information from all the available data, including natural
    language. Thus, opinion mining techniques will be useful in this context.


    At the moment, the system can be used only by IT expert people. In order to turn
    it into a practical tool that is routinely used by decision makers, we must equip
    it with a user-friendly interface. In particular, we are in the process of developing
    a Web interface to the constraint solver in order to make it easy to use and widely
    accessible.


    Finally, economic indicators will be used to assess the economic aspect of the
    plan. Up to now, only budget and a few economic pressures and receptors are considered.
    We believe that a comprehensive system should fully incorporate this aspect. We
    will integrate a well-established approach (UN and Eurostat Guidelines) and robust
    data from official statistics into the system to combine economic accounts (measured
    in monetary terms) and environmental accounts (measured in physical units) into
    a single framework useful for the evaluation of the integrated economic, environmental-social
    performance of regions.


