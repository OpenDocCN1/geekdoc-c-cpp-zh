    # 7.2 THE ENERGY MARKET TODAY


    In this section we provide a short overview of the current market for electric
    energy, with Europe as an example. This section is not only a basis for understanding
    future energy scenarios described in Section 7.3, but also bears some data-analysis
    challenges. In particular, the prediction of consumption and generation already
    plays an important role in today’s energy market. In this section, we first introduce
    the different roles in the energy market (Section 7.2.1). Then we describe energy
    trading (Section 7.2.2) and energy balancing in the electricity grid (Section
    7.2.3).


    # 7.2.1 Actors in the Energy Market


    As discussed in the introduction, liberalization leads to a number of new actors
    and roles in the energy market. Caused by regulation, this can vary in different
    countries, and some of the roles might be taken on by the'
