  md: '+   - Short-term storage in electric vehicles

    +   - Seasonal heat storage.


    Many of these technologies have been demonstrated in medium- to large-scale installations.
    The problem is to develop methods that can determine which combination of storage
    technologies and locations will be most effective for a given electricity system.


    # 8.2.3 Demand Management


    The current electricity system is designed to supply whatever power is demanded,
    with little or no coordination of loads. As a result, the system is sized for
    peak demands that occur for only a few hours each year. The mean demand for power
    in the Australian National Electricity Market is 70% of the peak demand; in South
    Australia, the mean demand is just 50% of the peak demand. Figure 8.2 shows hourly
    demand for power in the National Electricity Market for each day of 2010.


    Appliances are becoming more efficient, but we are using more of them. Increases
    in peak demand require upgrades to the transmission and distribution infrastructure,
    which adds significantly to the cost of electricity. Furthermore, fixed retail
    prices isolate residential and commercial consumers from supply constraints and
    the associated variations in generation costs. This problem can be partly addressed
    by time-of-use pricing, where electricity is cheaper during periods when demand
    is usually low; or by critical peak pricing, where the price to consumers varies
    with the cost of supply. An energy price that increases with power use would


    ![](img/644775a10ad87164013616d709050cee_269_0.png)


    FIGURE 8.2 (See color insert.) Hourly demand profile in the NEM for 2010 (data
    from Australian Energy Market Operator [5]).'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'also encourage load leveling. Ultimately, however, we need appliances to respond
    to changing grid conditions to prevent overload. Demand management can defer the
    need for grid reinforcement, reduce the need for expensive generation used only
    during periods of high demand, and improve the quality and reliability of supply.


    There is another important reason for demand management. As more energy is supplied
    from variable renewable energy sources, we will need to move from a system where
    supply follows demand to a system where demand also responds to variations in
    the available supply.


    Over half of Australia’s electricity is used in the domestic and commercial sectors.
    Many domestic and commercial loads—air conditioning, water heaters, clothes and
    dishwashers, clothes dryers, refrigerators, freezers, pool pumps, and electric
    vehicle chargers—could be automatically rescheduled, to varying extents, without
    causing inconvenience. Australian Standard AS 4755 is defining a simple interface
    that will allow appliances to be controlled. Home Area Networks, Building Management
    Systems, and Smart Grids will also allow appliances and buildings to change their
    power demand in response to signals, including the price of electricity and the
    availability of renewable power. Still needed, however, are mechanisms that will
    encourage participation and allow smart appliances to fairly share the power available
    at any instant.


    # 8.2.4 Mechanism Design for Demand Management


    Mechanism design is a branch of mathematical game theory that seeks to design
    the rules of a game, for self-interested players with private information, to
    achieve an overall desirable outcome. One must design mechanisms that allocate
    available power to appliances in such a way that, when feasible, each appliance
    will complete its task on time. Allocation mechanisms should be “incentive compatible”
    so that players cannot gain by misreporting their requirements. When it is not
    possible to complete all tasks on time, mechanisms should allocate power as fairly
    as possible.


    The 2007 Nobel Prize for Economic Sciences was awarded to Hurwicz, Maskin, and
    Myerson for their work on mechanism design theory. A report from the Royal Swedish
    Academy of Sciences [35] gives a good overview of the topic, as does Nisan et
    al. [28].


    A group at the University of Southampton is currently investigating the use of
    mechanism design for demand-side management, demand aggregation, and for pricing
    electric vehicle charging [19, 32, 33]. Gerding'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'et al. [19] describe a system for allocating charging to electric vehicles
    so that capacity constraints in a local area are not exceeded. Each vehicle owner
    specifies the value they place on their first hour of charging, second hour of
    charging, and so on, as well as the time interval during which the vehicle will
    be available for charging. An online mechanism allocates charging capacity each
    hour to the vehicles with the greatest value. The pricing mechanism is designed
    so that there is no incentive for owners to misreport their values or their charging
    interval. Further work is required to extend the method to work with a mix of
    different appliances, and to compare it to other online mechanisms [29–31].


    Fahrioglu and Alvarado [15] describe the use of mechanism design when designing
    electricity supply contracts to encourage participation in demand management programs,
    but do not consider how smart appliances might react to real-time demand management
    signals.


    Closer to the supply side of the electricity system, Zou [42] discusses the two
    schemes commonly used to buy and sell electricity on the wholesale market: (1)
    uniform pricing, where every generator is paid the marginal market price; or (2)
    pay-as-bid, where each generator is paid what they bid. It is not clear which
    of these schemes is better, as the bidding behavior of generators is different
    for each scheme. Zou proposes a new mechanism based on the Vickrey-Clarke-Groves
    mechanism, which can enhance the social welfare of the electricity market by only
    selecting bidders whose contribution to social welfare is positive. However, it
    remains to be seen whether these ideas could be applied in the retail electricity
    market.


    Finally, Rothkopf [34] gives 13 reasons why the Vickrey-Clarke-Groves mechanism,
    which underpins much of mechanism design theory, may not work in practice. It
    will be important to consider these issues when designing practical systems for
    demand-side management.


    # ### 8.3 FORECASTING WIND AND SOLAR POWER


    A key area of research, and a precursor to portfolio optimization, is the forecasting
    of supply from variable renewable energy sources. Recent results [1, 40] present
    a dramatic improvement in methods for the estimation of both the level and volatility
    of wind and solar farms. This is especially the case with forecasting the conditional
    variance of output. Renewable energy generation does not exhibit homogeneous variability,
    and we have devised methods of estimating this changing variability rather than
    using ensemble methods [1].'
