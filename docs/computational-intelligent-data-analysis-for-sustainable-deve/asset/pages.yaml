- pgno: 407
  md: 'Migratory birds follow wind streams to reduce fatigue in their travel over
    long distances; on the other hand, wind turbines should be installed in windy
    zones to be effective. So, during migration, birds would have a high likelihood
    to unexpectedly meet large rotating wind blades, possibly impacting with them;
    this effect cannot be ignored—in particular for endangered species (receptor wellness
    of wildlife).


    # ## 12.5 ADDED VALUE OF CLP


    The application (including both the assessment and the planning) was developed
    in a few person-months by a CLP expert. It does not have a graphical user interface
    yet and is currently usable only by CLP experts; however, it produces spreadsheet
    files with tables having the same structure as those used for years by the region''s
    experts, so the output is easily understandable by the end user. We are currently
    developing a Web-based application to let users input the relevant data and try
    themselves producing plans on-the-fly.


    The assessment module [7] was first tested on a previously developed plan and
    then used during the planning of the 2011-2013 regional energy plan. The various
    alternatives have been submitted to the regional council, which will have the
    ability to choose one of them, instead of accepting/rejecting the only proposal,
    as in previous years.


    One of the results is the ability to generate easily alternative plans with their
    assessment; this is required by the EU regulations, but it is widely disregarded.


    Another result is the possibility to provide plans that are optimal; the optimization
    criteria can include the cost, or one of the various environmental receptors.
    The user can select two objectives, and in this case the application generates
    a Pareto front. This helps the experts or the regional council in making choices
    that are more grounded.


    We still do not know which plan the regional council will choose; neither do we
    know if and how the directives given in the regional plan will be implemented.
    More refined plans (at the province or municipality level) should follow the guidelines
    in the regional plan, but it is also possible to introduce modifications during
    the plan execution. However, in a perfect world in which everything is implemented
    as expected, the added value of CLP in monetary terms could be the difference
    of the *investment* columns in the plans in Tables 12.2 and 12.3: 191 M€ saved
    (by the various actors, public and private, in the whole region) in 3 years.'
