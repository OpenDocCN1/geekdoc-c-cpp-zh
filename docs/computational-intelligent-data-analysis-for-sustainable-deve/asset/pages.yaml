- pgno: 166
  md: 'Finally, given that the most damaging consequences of climate change are associated
    with climate extremes, it is worthwhile to discuss the prediction of extreme behavior
    under uncertainty in model parameters. This is a more challenging pursuit than
    that of estimating means/moments of uncertain climate predictions when extreme
    events of interest are also rare. Capturing the tails of probability distributions
    accurately in a computational setting is challenging when there is small probability
    of sampling the tail region, and hence implies the need for a very large number
    of samples overall. While PC methods can avoid random sampling, the accuracy of
    the PC representation for modeling the tail-behavior of the underlying random
    variable requires particular attention. In principle, using high-order expansions
    may help; however, that renders the problem even more computationally challenging,
    requiring, for example, a large number of samples in a nonintrusive setting. It
    is also feasible to use a PC basis that is tailored to achieve higher accuracy
    in the tail region than conventional constructions. This can be done, for example,
    by choosing a basis that has a density with fat-tail behavior. This approach,
    however, still requires further development to be implemented practically with
    climate models.


    # 5.4 ENHANCED PREDICTIONS


    The key desiderata from predictive models in the context of extremes include accurate
    and uncertainty-quantified projections of crucial variables related to extremes
    as well as succinct characterizations of covariates and climate processes collectively
    influencing extremes. Such characterizations must be cognizant of complex and
    possibly nonlinear dependency patterns while staying physically interpretable,
    thereby yielding scientific understanding of extremes and the processes driving
    them. While uncertainty quantification methods were discussed in Section 5.3,
    we now briefly introduce some methodology that could be useful in enhancing predictions
    and perhaps reducing uncertainty in crucial climate variables that are not captured
    well by current-generation physical models.


    Standard predictive models, such as least squares or logistic linear regression,
    fall short of such desiderata in multiple ways. The number p of covariates and
    fine-scale climate processes potentially influencing key variables such as extreme
    precipitation far surpass the number of examples n of such extreme events. In
    the n ≪ p regime for regression, consistency guarantees from standard theory break
    down, implying that the model inferred is not even statistically meaningful (Girka,
    1995; Candès and Tao, 2007). Moreover, such standard models will assign nonzero
    regression'
