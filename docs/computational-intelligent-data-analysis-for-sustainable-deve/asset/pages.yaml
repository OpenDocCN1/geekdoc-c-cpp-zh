  md: '$$\begin{aligned}t_{12}+y_1-t_{21}-v_1&=0\\t_{21}+y_2-t_{12}-v_2&=0\end{aligned}\tag{2.1}$$


    All variables and values of these two equations have a corresponding reliability.
    We know from the definition of IO that the balancing constraints must be fulfilled.
    Hence, the 0-values on the right-hand side of the equations cannot be violated.
    That means that the 0-values have standard deviations of $\sigma=0$. Balancing
    constraints are hard constraints and hard constraints have a standard deviation
    of $\sigma=0$. An example of a soft constraint could be the following. Consider
    a data source is available that provides information that the total final demand
    of the MRIO M is equal to a value $a$. The corresponding equation for this information
    is


    $$y_1+y_2=a$$


    In this case, we can be almost certain that the value $a$ is not totally reliable.
    Hence, the standard deviation for the value $a$ would not be equal to zero, that
    is, $\sigma>0$. This equation can be violated by the Final MRIO that is to be
    computed. The acceptable amount of violation is determined by the standard deviation
    $\sigma$ of the value $a$.


    # 2.4.4 Summarizing the Balancing Constraints in a Single Matrix Equation


    Now that the constraints are already available as equations, the first step to
    a mathematical interpretation has been taken. In order to more easily work with
    the MRIO as an optimization problem, we vectorize the transactions matrix $\mathbf{T}$
    and call the resulting vector $\mathbf{a}$


    $$\mathbf{T}=\begin{pmatrix}t_{11}&t_{12}&y_1\\t_{21}&t_{22}&y_2\\v_1&v_2&\end{pmatrix}\quad\text{becomes}\quad\mathbf{a}=\begin{pmatrix}t_{11}\\t_{12}\\y_1\\t_{21}\\t_{22}\\y_2\\v_1\\v_2\end{pmatrix}$$'
