    # 9.6 CONCLUSIONS


    Data mining has immense significance in terms of addressing several key power
    grid problems, specifically in the arena of rapid event detection, as discussed
    in this chapter, which have the potential of going a long way in terms of realizing
    the promised benefits of the smart grid. The key challenges associated with this
    domain, in terms of data analysis, are the massive nature of the data and the
    short reaction time allowed (on the order of a few seconds) for allowing adequate
    response. The analytic solutions proposed in this chapter focus primarily on simple
    analyses that can be scaled to the data sizes and the high sampling rate of the
    incoming power signal. In the future, as the synchrophasors become more and more
    advanced (both in terms of sampling rate as well as the number of deployed sensors
    across the country), more research will be required to make the data analysis
    solutions scalable.'
