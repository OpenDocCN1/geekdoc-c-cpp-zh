  md: '(Stainforth et al., 2005). Climate models employ a wide range of parameterizations
    in land, ocean, atmosphere, and ice sub-model components. These parameters are
    typically calibrated based on data. Bayesian methods are useful for parameter
    estimation with quantified uncertainty, as they provide estimation of the joint
    posterior density of the parameters. While Bayesian methods have been used for
    parameter estimation in climate model components (Jackson et al., 2003, 2004,
    2008; Annan and Hargreaves, 2006; Govaerts and Lattanzio, 2007; Villagran et al.,
    2008), much more remains to be done in general for estimating the wide variety
    of climate model parameters. One key challenge is the construction of effective
    climate model surrogates for facilitating the Bayesian/inverse problem solution.
    Gaussian processes, as well as other surrogate models, have been used for representing
    climate data (Jackson et al., 2004; Banerjee et al., 2008; Cressie and Johannesson,
    2008; Sanso et al., 2008; Villagran et al., 2008; Drignei et al., 2009; Furrer
    and Sain, 2009). High dimensionality, in the present context largely embodied
    in the large number of uncertain parameters, is a significant challenge for surrogate
    construction and for uncertainty quantification in general. Global sensitivity
    analysis methods (Morris, 1991; Saltelli et al., 2000) have been used to identify
    a small subset of parameters that are critical to the climate system outputs of
    interest. Alternatively, compressed sensing (CS) methods have been developed to
    provide means of constructing sparse representations of high-dimensional information
    (Donoho, 2006; Candès and Wakin, 2008). Bayesian CS methods have been used for
    discovering sparsity in land models (S. Babacan et al. 2010).


    With parameters calibrated using Bayesian methods, and described using a posterior
    density, one can estimate the forward propagation of uncertainty in model observables
    resulting from the input parametric uncertainty. While this can be done via random
    sampling, employing the parameter posterior density, model complexity, and computational
    cost render this an infeasible task due to the large number of random samples
    needed for convergence of Monte Carlo methods (Caflisch, 1998). In recent years,
    Polynomial Chaos (PC) UQ methods have been developed and used to great advantage
    in representing uncertain/random variables, and in accelerating forward uncertainty
    propagation in computational models (Ghanem and Spanos, 1991; Xiu and Karniadakis,
    2002; Debusschere et al., 2004; Le Maître et al., 2004; Soize and Ghanem, 2004).
    PC methods rely on a representation of random variables as truncated expansions
    in terms of orthogonal functions of a given random basis. Thus, an uncertain'
