  md: '# ### 4.4.3 Paleoreconstructions


    Understanding how climate varied in the past before the onset of wide-spread instrumentation
    is of great interest—not least because the climate changes seen in the paleo-record
    dwarf those seen in the 20th century and hence may provide much insight into the
    significant changes expected this century. Paleo-data is, however, even sparser
    than instrumental data and, moreover, is not usually directly commensurate with
    the instrumental record. As mentioned in Section 4.3, paleo-proxies (such as water
    isotopes, tree rings, pollen counts, etc.) are indicators of climate change but
    often have nonclimatic influences on their behavior, or whose relation to what
    would be considered more standard variables (such as temperature or precipitation)
    is perhaps nonstationary or convolved. There is an enormous challenge in bringing
    together disparate, multi-proxy evidence to produce large-scale patterns of climate
    change [59], or from the other direction build enough “forward modeling” capability
    into the models to use the proxies directly as modeling targets [76]. This topic
    is discussed in further detail in Section 4.8.


    # ### 4.4.4 Data Assimilation and Initialized Decadal Predictions


    The primary way in which sparse observational data are used to construct complete
    fields is through data assimilation. This is a staple of weather forecasts and
    various reanalyses in the atmosphere and ocean. In many ways, this is the most
    sophisticated use of the combination of models and observations, but its use in
    improving climate predictions is still in its infancy. For weather timescales,
    this works well; but for longer term forecasts (seasons to decades), the key variables
    are in the ocean, not the atmosphere, and initializing a climate model so that
    the evolution of ocean variability models the real world in useful ways is very
    much a work in progress [44, 90]. First results have been intriguing, if not convincing,
    and many more examples are slated to come online in the new CMIP5 archive [61].


    # ### 4.4.5 Developing and Understanding Perturbed Physics Ensembles (PPEs)


    One measure of structural uncertainty in models is the spread among the different
    models from different modeling groups. But these models cannot be considered a
    random sample from the space of all possible models. Another approach is to take
    a single model and, within the code, vary multiple (uncertain) parameters in order
    to generate a family of similar models'
