- pgno: 133
  md: '# 4.10 TOWARD A CLIMATE INFORMATICS TOOLBOX


    Recent additions to the toolbox of modern machine learning have considerable potential
    to contribute to and greatly improve the prediction and inference capability for
    climate science. Climate prediction has significant challenges, including high
    dimensionality, multiscale behavior, uncertainty, and strong nonlinearity, and
    also benefits from having historical data and physics-based models. It is imperative
    that we bring all available, relevant tools to bear on the climate arena. In addition
    to the methods cited in Section 4.2 and in subsequent sections, here we briefly
    describe several other methods (some proposed recently) that one might consider
    to apply to problems in climate science.


    We begin with CalTech and Los Alamos National Laboratory’s recently developed
    Optimal Uncertainty Quantification (OUQ) formalism [67, 79]. OUQ is a rigorous,
    yet practical, approach to uncertainty quantification that provides optimal bounds
    on uncertainties for a given, stated set of assumptions. For example, OUQ can
    provide a guarantee that the probability that a physical variable exceeds a cutoff
    is less than some value ε. This method has been successfully applied to assess
    the safety of truss structures to seismic activity. In particular, OUQ can provide
    the maximum and minimum values of the probability of failure of a structure as
    a function of earthquake magnitude. These probabilities are calculated by solving
    an optimization problem that is determined by the assumptions in the problem.
    As input, OUQ requires a detailed specification of assumptions. One form of assumption
    may be (historical) data. The method’s potential for practical use resides in
    a reduction from an infinite-dimensional, nonconvex optimization problem to a
    finite- (typically low) dimensional one. For a given set of assumptions, the OUQ
    method returns one of three answers: (1) Yes, the structure will withstand the
    earthquake with probability greater than p; (2) No, it will not withstand it with
    probability p; or (3) Given the input, one cannot conclude either (i.e., undetermined).
    In the undetermined case, more/different data/assumptions are then required to
    say something definite. Climate models are typically infinite-dimensional dynamical
    systems, and a given set of assumptions will reduce this to a finite-dimensional
    problem. The OUQ approach could address such questions as whether (given a potential
    scenario) the global mean temperature increase will exceed some threshold T, with
    some probability ε.


    To improve the performance (e.g., reduce the generalization error) in statistical
    learning problems, it sometimes helps to incorporate domain'
