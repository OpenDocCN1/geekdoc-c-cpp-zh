  md: 'the space from the true solution and yet it is not contradicted by the available
    data. For example, we could build a regression model to relate one variable to
    several potential explanatory variables, and perhaps obtain a very accurate predictive
    model without having any claim or belief that the model in any way represented
    the causal mechanism.


    In most cases of machine-learning algorithms, the null hypothesis space is infinity.
    Therefore, machine learning is essentially computationally efficient enough to
    search the space to find the part of space not only to best fit the observations,
    but also to make correct predictions for the new observations. The latter is critical
    in addressing the problem of achieving the balance of bias and variance. In terms
    of mathematical optimization, it is important to find the global optimal instead
    of the local optimal. However, the design of the search criteria is more important
    than the optimization process. The criteria directly determine which final optimal
    solution will achieve the balance of bias and variance to avoid overfitting. The
    application of machine-learning methods to large databases is called data mining
    or knowledge discovery [13].


    In the computational intelligent data analysis community, the analyst works via
    more complex and sophisticated, even semiautomatic, data analysis tools. Given
    a clearly defined criterion (e.g., sum of squared errors), one can let the computer
    conduct a much larger search than could have been conducted manually. The program
    has become a key part of the analysis and has moved the analyst''s capabilities
    into realms that would be impossible unaided. However, one challenge is to find
    the clearly defined criteria—sometimes not one but a set—to represent the aim
    of the analysis. The perspective from which the analyst instructs a program to
    go and do the work is essentially a machine-learning perspective.


    Machine-learning algorithms are critical to a range of technologies, including
    Web search, recommendation systems, personalized Internet advertising, computer
    vision, and natural language processing. Machine learning has also made significant
    impacts on the natural sciences, for example, biology; the interdisciplinary field
    of bioinformatics has facilitated many discoveries in genomics and proteomics
