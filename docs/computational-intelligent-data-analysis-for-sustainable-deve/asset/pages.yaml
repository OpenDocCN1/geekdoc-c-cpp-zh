  md: '2008), Bayesian model averaging as a technique for model weighting (Min and
    Hense, 2007), and methodology for quantifying GCM biases (Buser et al., 2009).


    Monteleoni et al. (2010) proposed an online learning approach where weights for
    GCMs can change with new data. More specifically, α-experts predict annual global
    mean temperature; the experts learn from the mistakes (i.e., squared errors) of
    GCMs and can actually predict one-year-ahead temperature better than the best
    prediction of all GCMs or the multimodel mean. While this is an intriguing approach
    for combining GCMs and it seems to handle one-step-ahead nonstationarity quite
    well, in its present form it does not allow for long lead time prediction, which
    is the primary goal of climate models in general. Additionally, uncertainty bounds
    have not yet been developed within the algorithm.


    The regional climate UQ research area is still relatively nascent and may benefit
    from new approaches (Knutti et al., 2010). Methods must be developed that simultaneously
    accommodate long lead times as well as potential nonstationarity, where conditions
    (e.g., relationships between variables) could change. In addition, there may be
    value in considering physical relationships between multiple variables to encourage
    robustness and interpretation in the GCM weighting process, as is discussed in
    Section 5.4. Recent UQ work (Tebaldi and Sanso, 2009), along the same line as
    Smith et al. (2009), developed a hierarchical Bayesian model for joint projections
    of mean temperature and precipitation; this model attempted to statistically utilize
    correlation between the two variables. Extending this type of statistical model
    to one that considers climate extremes would be valuable to the climate community.
    For instance, O’Gorman and Schneider (2009) developed a relatively simple conceptual
    physical model for an increase in precipitation extremes under anthropogenic climate
    change, while Kao and Ganguly (2011) explored conceptual physical bases in their
    characterization of 21st century precipitation extremes. Careful statistical utilization
    of such insights could lead to novel multimodel ensemble UQ methodology for extremes,
    which could be useful for informing various impact sectors.


