- pgno: 49
  md: 'THIS CHAPTER IS REPRODUCED FROM *Ecological Footprints and International Trade*
    (D. Moran, University of Sydney, 2012) with the author''s permission. The section
    titled “Reconciling Conflicting Constraints: Eora as a Solution of a Constrained
    Optimization Problem” is excerpted from *AISHA: A Tool to Construct Large-Scale
    Contingency Matrices* (A. Gschke, University of Sydney, 2012) with the author''s
    permission.


    # ## 2.1 SUMMARY


    Input-output (IO) tables document all the flows between sectors of an economy.
    IO tables are useful in sustainability applications for tracing connections between
    consumers and upstream environmental or social harms in secondary and primary
    industries. IO tables have historically been difficult to construct because they
    are so data intensive. The Eora multi-region IO (MRIO) table is a new high-resolution
    table that records the bilateral flows between 15,000 sectors in 187 countries.
    Such a comprehensive, high-resolution model is advantageous for analysis and implementation
    of sustainability policy. This chapter provides an overview of how the Eora IO
    table was built. A custom data processing language was developed to read, aggregate,
    disaggregate, and translate raw data from a number of government sources into
    a harmonized tensor. These raw data often conflict and do not result in a balanced
    matrix. A custom optimization algorithm was created to reconcile conflicting data
    and balance the table. Building and balancing the Eora MRIO is computationally
    intensive: it requires approximately 20 hours of compute time per data year on
    a cluster with 66 cores, 600 GB of RAM, and 15Tb of storage. We conclude by summarizing
    some sustainability applications of high-resolution MRIO tables, such as calculating
    carbon footprints.


    Globalization combined with an increasing human population and increased consumption
    means that our ecological footprint is now falling more widely and more heavily
    across the planet. Our environmental impact is increasing. And lengthening supply
    chains mean that consumers are often far removed from the impacts they drive.
    In order to manage and reduce our footprint we must first be able to measure it.
    This is the aim of environmentally extended input-output analysis.


    We want to identify which countries and sectors are directly causing, and which
    are ultimately benefiting from, environmental harms. We want to link individuals,
    households, and companies to the upstream environmental harms they ultimately
    drive. This principle is called consumer responsibility: the idea that consumers,
    not producers, should be'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'responsible for pollution. Successful sustainability policies will consider
    both producer and consumer responsibilities, and will need to address different
    challenges at the production, trade, and consumption points along the supply chain.


    There are two approaches to measuring footprints: bottom-up and top-down. Bottom-up
    approaches add up the various components of the footprint. For example, the CO₂
    footprint of a paper shopping bag might be the sum of CO₂ emitted by logging vehicles,
    the pulp mill, the transport from the factory to the shop, and the decomposition
    of the bag after it has been used. Top-down approaches consider the total footprint
    first and then allocate to different products; for example, of total CO₂ emissions,
    how much is from paper products, and what fraction of paper products are paper
    shopping bags.


    Life-cycle analysis (LCA) is the main methodology for bottom-up analysis. LCA
    traces inputs, processes, and outputs at all points along a production-use-disposal
    chain. LCA studies are complex, data hungry, and often involve difficult boundary
    issues where it is hard to extract a single flow without undercounting (missing
    some input or output flows) or double-counting (when two stocks or flows overlap
    so the sum of the parts exceeds the sum of the whole).


    Input-output analysis takes a top-down approach. Generally, the problem with top-down
    approaches is that they are low resolution. A top-down analysis may be able to
    tell you the CO₂ footprint of the average passenger vehicle, but cannot differentiate
    between an SUV and a hybrid sedan.


    The Eora project uses sophisticated data processing to keep original data in its
    native form, resulting in an IO table that has substantially higher resolution
    than any other produced to date. Most multi-region IO tables to date have settled
    on a common low-resolution sector classification and harmonized all input tables
    to that classification. The Eora MRIO employs many correspondence matrices to
    link together data in different classifications. The Eora high-resolution table
    enables better top-down analysis, and makes it easier to combine with bottom-up
    approaches in a so-called hybrid LCA. IO analysis is comprehensive, does not suffer
    boundary issues, and is increasingly accurate.


    Input-output tables were originally conceived by Wasily Leontief as an economic
    tool to analyze the flows between sectors of the American economy. Using IO tables,
    Leontief could estimate how shocks to one sector might affect others. A variety
    of modern economic models, including widely used Computable General Equilibrium
    (CGE) models, are built'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'upon IO tables. Most national statistical bureaus produce IO tables and use
    them as the basis of their national accounts, following the UN standard System
    of National Accounts. A multi-region IO table brings together many national IO
    tables into one large, whole-world IO table. MRIOs are not built by national governments
    but instead by a small number of academic research teams. They are a powerful
    tool for international policy analysis, and environmentally extended IO tables
    are extremely useful for sustainability analysis. IO-based analysis has become
    increasingly popular in recent years as greater data availability and computational
    power enable the creation of higher resolution, more accurate tables. The Eora
    multi-region IO table is the largest and most detailed IO table yet assembled.
    It has been made feasible by using sophisticated data processing automation, modern
    computer hardware, and mathematical rather than manual procedure to balance and
    resolve data conflict.


    # 2.2 STRUCTURE OF IO TABLES


    This section provides a brief overview of the structure of IO tables for readers
    unfamiliar with input-output analysis. To learn more, the authoritative text by
    Miller and Blair (2009) is recommended.


    The elements of an IO matrix are the sum of sales from one sector to another.
    Each row in the matrix represents the goods and services produced by one sector,
    that is, that sector’s output. The columns along that row are the various sectors
    that consume those products. Each element in the matrix thus represents the total
    value of transactions between sector A and sector B. In a single-country IO table,
    the rows and columns represent sectors within that economy.


    Figure 2.1 shows the layout of a single-country IO table and illustrates the element
    of the transaction matrix recording the total value of Steel sector inputs to
    the Vehicles Production sector. This transaction’s price is the main block of
    an IO table. Appended to it on the right is another block of columns Y representing
    final consumption by households, government, inventories, and so on. Also added
    below is a block of rows V for so-called “primary inputs.” The most important
    of these is value added. By treating value added as an input to production, a
    sector can sell its output for more than the sum of its other inputs.


    In a multi-region IO table, the sectors represent each country’s sectors. For
    example, instead of one sector, Japanese Steel and Australian Steel are two separate
    rows and two columns. This is illustrated in Figure 2.2. It is possible to construct
    an MRIO where the regions are not countries but'
