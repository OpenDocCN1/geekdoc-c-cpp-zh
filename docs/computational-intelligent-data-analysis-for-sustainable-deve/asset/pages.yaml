- pgno: 210
  md: 'same entity (e.g., a generator might also act as a retailer who sells energy
    to consumers). The number of (new) actors in the energy market is also interesting
    from a data-analysis point of view: Most of these actors have access to potentially
    interesting data or could profit from data provided by different actors. Investigating
    the actors and their data leads to interesting opportunities for data analysis
    and maybe even to new roles, such as ana-lytic service providers. In the following,
    we introduce the most common actors and roles that are relevant for the remainder
    of this chapter [2]:


    +   - *Generator.* A company that produces electrical energy and feeds it into
    the transportation or distribution grid. Generators might use conventional power
    plants or generate renewable energy.

    +   - *Consumer.* An industrial or private entity or a person who consumes electrical
    energy.

    +   - *Prosumer.* A consumer who also produces electrical energy. A difference
    from the generator is that the prosumer might entirely consume its own generation.
    The generation is typically done by renewable sources or micro-CHP (combined heat
    and power) units.

    +   - *Distribution system operator (DSO).* Operates regional electricity distribution
    grids (low and medium voltage) that provide grid access to consumers, prosumers,
    and small generators. Historically, such grids were intended to distribute centrally
    produced energy to the consumers. Today, it can also happen that temporarily more
    energy is fed into a grid than energy is taken from the grid. The DSO also plans,
    builds, and maintains the grid infrastructure.

    +   - *Transmission system operator (TSO).* Operates a transmission grid (high
    voltage) and transmits electrical energy in large quantities over large distances.
    This includes providing grid access to large generators and consumers and to the
    DSOs. The TSO is responsible for the overall stability of its parts of the transmission
    grid and for providing balancing power (see Section 7.2.3). The TSO also plans,
    builds, and maintains the grid infrastructure.

    +   - *Balance-responsible party (BRP).* The BRP responsible for ensuring that
    the scheduled supply of energy corresponds to the expected consumption of energy
    in its balance area. To achieve this, the BRP eliminates upcoming imbalances using
    balancing power with the'
