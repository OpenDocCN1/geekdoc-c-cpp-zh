    # 2.5 THE LEONTIEF INVERSE


    Now we have a complete balanced, harmonized MRIO table. Nearly all environmental
    applications will proceed by calculating the Leontief inverse of the MRIO. The
    Leontief inverse answers the question: How much total input, both directly in
    the product and indirectly required for its production, is in a given unit of
    output? This calculation is the foundation for determining consumer-responsibility
    footprints, as it makes it possible to calculate the total environmental impact,
    including all impacts upstream in the supply chain, required to produce one unit
    of output.


    The Leontief inverse is calculated as follows. Normalizing the transactions matrix
    T by gross output converts each element into a coefficient such that each column
    sums to one; that is, each coefficient represents the relative contribution of
    each input per unit of output. This matrix is called A, the technical coefficients
    matrix, or direct requirements matrix. A car, for example, contains steel directly
    (chassis, engine, etc.), but it also requires steel indirectly as an input to
    its production. The factory, car carrier, and showroom all use some steel as well,
    some fraction of which is needed for the provision of that car. This total requirement
    matrix L'
