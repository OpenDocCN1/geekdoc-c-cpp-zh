    $$\mathbf{l} \leq \mathbf{p} \leq \mathbf{u}$$


    Adding these boundary conditions to the optimization problem, we obtain


    $$\min (\mathbf{p}^{0}-\mathbf{p})\sum_{p}(\mathbf{p}^{0}-\mathbf{p}) \quad \text{subject
    to } G\mathbf{p}=\mathbf{c},\; \mathbf{l}\leq\mathbf{p}\leq\mathbf{u} \qquad (2.4)$$


    The Eora model was generated based on the optimization problem given by Equation
    (2.4).


