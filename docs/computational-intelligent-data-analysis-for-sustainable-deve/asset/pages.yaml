- pgno: 251
  md: '+   - On the *demand side*, intelligent devices (e.g., in a smart home, see
    Scenario 7.4) need to *react to dynamic prices* (see Scenario 7.2) and optimize
    their demand planning accordingly. If consumers own micro-CHP units, they have
    to find optimized schedules for their operation. A further challenge is *charging
    of EVs and possibly V2G scenarios* (see Scenario 7.5). This is not only of importance
    in consumer premises, but also in so-called *smart car parks* [115]. They have
    a particularly high impact on the energy systems as they display high power consumption.
    *Disaggregation* is a further technique that makes use of optimization (see Section
    7.4.5).

    +   - On the *supply side*, probably the most prominent optimization problem is
    *finding dynamic prices* [70]. In scenarios with *control signals*, optimization
    is needed to select offers from demand-side managers (see Scenario 7.3). Another
    field where optimization is of relevance is the *management of energy storages*
    (see Scenario 7.5) where it needs to be decided when to charge and when to discharge
    a storage.


    Many of the mentioned optimization problems can become quite complex. This, in
    particular, is due frequently to the many parameters to be considered:


    +   - Planning of *micro-CHP units* has constraints concerning their profitability.
    This includes minimum runtime, uptime, and cycle costs. Similar constraints apply
    to *central storages* such as pumped-storage water-power plants.

    +   - *Smart charging of EVs and V2G* requires one to consider user preferences
    (when does the car need to be charged to which level?) and economic interests
    of the owner or car-park operator. Furthermore, the current situation of the grid
    and possibly dynamic prices are also of importance [115].

    +   - *Finding dynamic prices* aims at achieving the desired profits and realizing
    demand response to prevent grid issues with a low economical risk. Furthermore,
    the predicted generation and demand needs to be taken into account (see Section
    7.4.3.1), together with the predicted willingness and ability of customers to
    react accordingly (see Section 7.4.3.2). Obviously, the current market prices
    and possibly existing long-term contracts are further parameters.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   - In *control-signal scenarios*, available demand-shifting offers must
    be selected, taking into account that they are cost-efficient, reliable, and located
    in the correct grid segments.

    +   - In *energy storages*, the operator must consider the (predicted) future
    generation, demand, and prices, as well as the storage-system parameters capacity
    and peak power.


    The result of the above-mentioned conditions and constraints are often high-dimensional,
    multivariate optimization problems. In addition to classical solving methods [51],
    heuristic methods [42, 75, 88, 97] have been an important field of research in
    recent years. For smart-charging scenarios, for instance, multi-objective evolutionary
    optimization algorithms have been investigated [115].


    # 7.4.8 Privacy-Preserving Data Mining


    As discussed in this chapter, an increasing number of actors in the liberalized
    electricity markets (see Section 7.2.1) collect more and more data (see Section
    7.4) when realizing the current and future energy scenarios (see Section 7.3).
    Many types of data can be mapped to real persons and bear potential privacy risks.
    Smart-meter data (see Scenario 7.1) is probably the most common example, but other
    types of data, such as participation in demand-response measures (see Scenario
    7.3), user behavior in a smart home (see Scenario 7.4) or from an electric vehicle
    might disclose private data as well.


    As privacy is a wide field, we concentrate on illustrating the possibilities of
    analyzing smart-meter data in the following discussion. Depending on the temporal
    resolution of such data, different user behaviors can be derived. Having smart-meter
    data at 1-minute granularity, for example, enables identifying most electric devices
    in a typical household [113]. Having data at half-second granularity might reveal
    whether a cutting machine was used to cut bread or salami [21]. Needless to say,
    disclosing such data would be a severe privacy risk as one could derive precisely
    what a person does at which moment. Furthermore, recent research suggests that
    it is even possible to identify which TV program (out of a number of known programs)
    someone is watching using a standard smart meter at the temporal granularity of
    half-second [58]. Interestingly—and maybe frighteningly—even data at the 15-minute
    granularity frequently used for billing scenarios can be a privacy threat. Such
    data is sufficient to identify'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'which persons are at home and at what times, if they prepare cold or warm breakfast,
    when they are cooking, and when they watch TV or go to bed [96]. Jawurek et al.
    [69] furthermore show that consumption curves of a household are typically unique
    and can be used to identify a household.


    There is a myriad of work that identifies the different scenarios of privacy risks
    and attacks in the field of energy; an overview can be found, for example, by
    Khurana et al. [77]. A smaller number of studies propose particular solutions,
    mostly for specific problems such as billing in the presence of smart meters [68].
    However, this field is still quite young, and effective methods to provide privacy
    protection are still needed, ones that can easily be applied in the field. In
    addition to the privacy of consumers, such methods need to ensure that all actors
    in the energy market can obtain the data they need in order to efficiently fulfill
    their respective role in the current and future energy scenarios. This calls for
    further developments and new techniques in the fields of *security research* and
    *privacy-preserving data mining* [13, 131, 133], for which future energy systems
    and markets are an important field of application.


    # 7.5 CONCLUSIONS


    The traditional energy system relying on fossil and nuclear sources is not sustainable.
    The ongoing transformation to a more sustainable energy system relying on renewable
    sources leads to major challenges and to a paradigm shift from *demand-driven*
    generation to *generation-driven demand*. Further influential factors in the ongoing
    development are liberalization and the effects of new loads, such as electric
    vehicles. These developments in the future energy domain will be facilitated by
    a number of techniques that are frequently referred to as the *smart grid*. Most
    of these techniques and scenarios lead to new sources of data and to the challenge
    to manage and analyze them in appropriate ways.


    In this chapter we highlighted the current developments toward a sustainable energy
    system. We provided an overview of the current energy markets and described a
    number of future energy scenarios. Based on these elaborations, we derived the
    data-analysis challenges in detail. In a nutshell, the conclusion is that there
    has been a lot of research but that there are still many unsolved problems and
    there is a need for more data-analysis research. Existing techniques can be applied
    or need to be further developed for use in the smart grid. Thus, the future energy
    domain is an important field for applied data-analysis research and has the potential
    to contribute to sustainable development.'
