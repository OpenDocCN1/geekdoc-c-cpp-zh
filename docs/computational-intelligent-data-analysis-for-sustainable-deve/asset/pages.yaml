  md: '![](img/644775a10ad87164013616d709050cee_150_0.png)


    **FIGURE 5.1** Uncertainty quantification for climate extremes, which are broadly
    construed in this context, represents one of the largest knowledge gaps in terms
    of translating the physical science basis of climate to information relevant for
    impacts assessments and adaptation decisions, and eventually to mitigation policy.
    However, the cascade of uncertainties is difficult to quantify. The societal costs
    of action and inaction are both potentially large for climate adaptation and mitigation
    policies; hence, uncertainties in climate are important to effectively characterize
    and communicate. Climate extremes may broadly include large shifts in regional
    climate patterns or severe weather or hydrological events caused or exacerbated
    by natural climate variability or climate change. This chapter primarily focuses
    on the statistical attributes of severe events, or, changes in tail behavior.


    management of natural and engineered infrastructures, as well as policy makers
    dealing with urbanization, population growth, or migration, land use or energy
    and water sustainability, and energy or emissions control, require actionable
    insights about climate extremes at local to regional scales. The costs of action
    and inaction can both be large, as adaptation and mitigation strategies designed
    for climate extremes may be costly for the current generation and potentially
    even more costly for future generations. Specific examples of prior work that
    demonstrated the importance of climate extremes to the stakeholder community include
    the following: an international climate change policy related to global emissions'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'negotiations (Engelhaupt, 2008; Tollefson, 2008a, b); national security decisions
    related to regional threat assessments and preparedness, for example, the 2010
    Quadrennial Defense Review report of the United States Department of Defense (Ganguly
    et al., 2009a); and a war game related to the Arctic sea ice (cited in NRC, 2011).


    # 5.1.3 Computational Data Sciences: Challenges and Opportunities


    Computer science, informatics, and computational (or cyber) infrastructures have
    played a major role in our current understanding, projections, and attributions
    of climate extremes, primarily through physics-based models. The climate system
    is nonlinear, dynamical (and often chaotic, or very sensitive to initial conditions),
    subject to multiple feedback mechanisms (e.g., among ocean, atmosphere, and land
    processes), thresholds and intermittence (e.g., for precipitation and cloud physics),
    exhibits low-frequency (and even “1/f”) variability and complex dependence structures
    (e.g., long-memory processes over time and long-range spatial dependence or “teleconnections”
    in space), as well as nonstationary (e.g., the relative dominance of processes
    generating extremes may change in a warmer world). Thus, purely data-driven extrapolation
    may not be adequate or even appropriate, especially for long lead time projections
    (e.g., decadal to centennial scales), where data assimilation methods may also
    have limited value. State-of-the-art physical climate models are based on fundamental
    physical laws (e.g., laws of motion and conservation of mass and momentum). Physical
    approximations and mathematical discretization techniques (e.g., strategically
    chosen finite difference equation system formulations) are applied to these laws,
    resulting in complex systems encapsulated in hundreds of thousands or millions
    of lines of low-level source code (Christensen et al., 2005). Current global climate
    models are composed of multiple interacting components, including atmospheric,
    oceanic, and often land and sea ice models (IPCC, 2007). Such physics-based models,
    whether global climate or Earth system models or regional climate models used
    to downscale the outputs of global models, are more credible for variables such
    as mean temperature at continental to global scales. The same models are less
    reliable for climate extremes; for example, they are inadequate for precipitation
    extremes and tropical cyclones, especially at the precision required for making
    informed decisions.


    The research opportunities for computational data sciences are three-fold: (1)
    improved characterization, projections, and attribution of climate'
  merge: -1
  img_proc: true
