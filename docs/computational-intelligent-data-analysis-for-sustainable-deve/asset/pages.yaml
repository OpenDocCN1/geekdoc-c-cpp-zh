    Another technical development that affects current and future energy systems is
    *smart metering*. Smart electricity meters facilitate fine-grained measurements
    of energy consumption, production and quality, and the communication of the respective
    measurements. They are one of the technological foundations of many future energy
    scenarios described in this chapter. Also, from a legislative point of view, their
    introduction is promoted, and many countries have respective programs. As one
    example, the European Union wants to achieve an 80% share of smart meters by 2020
    [1].


    This chapter reviews, in detail, selected scenarios in the field of smart grids.
    Most of them contribute to the realization of the paradigm shift from demand-driven
    generation to generation-driven demand, or to achieving energy efficiency. These
    elaborations reveal a number of data-analysis challenges that must be tackled
    to implement the scenarios. These challenges are discussed in more detail, along
    with possible solutions.


    The remainder of this chapter is organized as follows: Section 7.2 describes the
    current status of the electricity market; Section 7.3 reviews selected future
    energy scenarios that are building blocks of the smart grid; based on Sections
    7.2 and 7.3; Section 7.4 then describes the resulting data-analysis challenges
