  md: '# 10.3.1 Multivariate Normal Model


    Here, a multivariate normal model $N(\mu,\Sigma)$ is assumed for the joint density
    $f_{X,Y}(x,y)$ given by


    $$f_Z(z) = (2\pi)^{-(n+1)/2} \det(\Sigma)^{-1/2} \exp\left(-\frac{1}{2}(z-\mu)^T\Sigma^{-1}(z-\mu)\right)
    \quad (10.3)$$


    where $z = \{x,y\}$ and $det$ represents determinant of a matrix. The multivariate
    Gaussian density function has two parameters $\{\mu,\Sigma\}$. We estimate these
    parameters by maximizing the likelihood function given a set of $L$ i.i.d observations.
    The greatest advantage of this model is the ease with which the model can be built
    as the maximum likelihood estimates (MLEs) simply are given by closed-form analytic
    forms. The MLE for the mean vector $\mu$ for the variates $z$ is simply the sample
    mean. The MLE of the covariance matrix $\Sigma$ is given by


    $$\hat{\Sigma} = \frac{1}{n} \sum_{i=1}^{n} (z_i - \bar{z})(z_i - \bar{z})^T \quad
    (10.4)$$


    Once we estimate the parameters for the joint density given the training data,
    using closed-form expressions, we use the joint density function to derive the
    conditional density for $y$ given $x_k$ samples in the testing data. This density
    is also Gaussian and has a mean $\mu_{y|x_k}$ and variance $\sigma_{y|x_k}$. The
    value $\mu_{y|x_k}$ is used as the point prediction for $\hat{y}_k$ for the given
    $x_k$. The variance $\sigma_{y|x_k}$ provides the uncertainty around the prediction.
    If $\sigma_{y|x_k}$ is high, the uncertainty is high.


