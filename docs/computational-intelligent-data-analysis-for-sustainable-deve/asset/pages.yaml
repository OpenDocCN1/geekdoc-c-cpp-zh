  md: 'for such approaches [52, 103], while paleoclimatic assimilation techniques
    have also shown promise [112].


    In the context of machine learning, the problem of reconstructing parts of a missing
    data matrix has been widely studied as the matrix completion problem (see Figure
    4.4). A popular example of the problem is encountered in movie recommendation
    systems, in which each user of a given system rates a few movies out of tens of
    thousands of available titles. The system subsequently predicts a tentative user
    rating for all possible movies, and ultimately displays the ones that the user
    might like. Unlike traditional missing value imputation problems where a few entries
    in a given data matrix are missing, in the context of matrix completion, one works
    with mostly missing entries (e.g., in movie recommendation systems, 99% or more
    of the matrix is typically missing). Low-rank matrix factorization methods have
    been shown to be quite successful in such matrix completion problems [48, 73].
    Further explorations of matrix completion methods for the paleoclimate reconstruction
    problem therefore are fully warranted. This includes investigations into the applicability
    of existing methods, such as probabilistic matrix factorization [73] or low-rank
    and sparse decompositions [114], as well as explorations of new methods that take
    into account aspects specific to the paleoclimate reconstruction. Methods that
    can perform completions along with a confidence score are more desirable because
    uncertainty quantification is an important desideratum for paleoclimate.


    Finally, it is important to return to the fact that extensive methodological work
    in the field of CE paleoclimatology is aimed, in part, at better constraining
    natural climate variability on decadal-to-centennial timescales. This timescale
    of variability, in addition to expected forced changes, will be the other key
    contribution to observed climate during the 21st century. Whether we are seeking
    improved decadal predictions [93] or refined projections of 20th century regional
    climate impacts [28], these estimates must incorporate estimates of both forced
    and natural variability. It therefore is imperative that we fully understand how
    the climate naturally varies across a range of relevant timescales, how it changes
    when forced, and how these two components of change may couple together. This
    understanding cannot be achieved from the modern instrumental record alone, and
    the CE is a strategic paleoclimate target because it provides both reconstructions
    with high temporal and spatial resolution and an interval over which CGCM simulations
    are also feasible. Combining'
