- pgno: 119
  md: 'of a numerical weather forecast quickly amplify until the forecast has no value.
    This sensitive dependence on initial conditions provides an explanation for the
    limited time horizon (a few days to a week) for which useful weather forecasts
    can be issued, and the belief until the early 1980s that seasonal forecasting
    was impossible [81]. This also explains why effort is needed to “find the needle
    of predictability in the haystack of chaos.” Given the limited predictability
    of weather, how is it that quantities such as precipitation and near-surface temperature
    are skillfully forecast seasons (3 to 6 months) in advance?


    First, it should be noted that the format of climate predictions is different
    from that of weather forecasts. Weather forecasts target the meteorological conditions
    of a particular day or hour. Climate predictions are made in terms of weather
    statistics over some time range. For instance, the most common quantities in current
    climate forecasts are 3-month (seasonal) averages of precipitation and near-surface
    temperature. Two fundamental facts about the Earth system make climate forecasts
    possible. First, the oceans evolve on timescales that are generally slower than
    those of the atmosphere, and some ocean structures are predictable several months
    in advance. The outstanding predictable ocean structure is associated with the
    El Niño–Southern Oscillation (ENSO) and is manifest in the form of widespread,
    persistent departures (anomalies) of equatorial Pacific sea surface temperature
    (SST) from its seasonally adjusted long-term value. The first ENSO forecasts were
    made in the late 1980s [10]. The second fact is that some components of the atmosphere
    respond to persistent SST anomalies. The atmospheric response to SST on any given
    day tends to be small relative to the usual weather variability. However, because
    the SST forcing and the associated atmospheric response may persist for months
    or seasons, the response of a seasonal average to SST forcing may be significant
    [82]. For instance, ENSO has impacts on temperature, precipitation, tropical cyclones,
    human health, and perhaps even conflict [31, 38, 49, 72]. Early seasonal forecasts
    constructed using canonical correlation analysis (CCA) between antecedent SST
    and climate responses [3] took advantage of this persistence of SST. Such statistical
    (or empirical, in the sense of not including explicit fundamental physical laws)
    forecasts remain attractive because of their generally low dimensional and cost
    relative to physical process-based models (typically general circulation models;
    GCMs) with many millions of degrees of freedom.'
