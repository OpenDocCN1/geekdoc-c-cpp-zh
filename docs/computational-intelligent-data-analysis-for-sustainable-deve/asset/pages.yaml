- pgno: 16
  md: '# # About the Editors


    Ting Yu, PhD, is an honorary research fellow at the Integrated Sustainability
    Analysis Group, University of Sydney, Australia. His research interests include
    machine learning, data mining, parallel computing, applied economics, and sustainability
    analysis. He has worked on research in machine learning, data mining from environmental
    data, financial data and transport data, and has published more than 20 journal
    and conference articles. He is also working as a transport modeler at the Transport
    for NSW, Australia. Prior to that, he was a quantitative financial analyst at
    a hedge fund, BCS Capital. He was awarded a PhD in computing science from the
    University of Technology, Sydney, and received the MSc in distributed multimedia
    systems from the University of Leeds, United Kingdom, and a BEng from the Zhejiang
    University, P.R. China.


    Nitesh V. Chawla, PhD, is an associate professor in the Department of Computer
    Science and Engineering, director of the Interdisciplinary Center for Network
    Science and Applications (iCeNSA), and director of the Data Inference Analysis
    and Learning Lab (DIAL) at the University of Notre Dame. He started his tenure-track
    position at Notre Dame in 2007, and was promoted and tenured in 2011. Prior to
    Notre Dame, he was a senior risk modeling manager at CIBC. His research is focused
    on machine learning, data mining, and network science. He is at the frontier of
    interdisciplinary applications with innovative work in healthcare informatics,
    social networks, analytics, and climate/environmental sciences. He is the recipient
    of multiple awards for research and teaching innovation, including multiple outstanding
    teacher awards, a National Academy of Engineers New Faculty Fellowship, and a
    number of best paper awards and nominations. He is the chair of the IEEE CIS (Computational
    Intelligence Society) Data Mining Technical Committee. He is associate editor
    for *IEEE Transactions on Systems, Man and Cybernetics (Part B)* and *Pattern
    Recognition Letters*.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '**Simeon J. Simoff, PhD**, is currently the dean of the School of Computing,
    Engineering and Mathematics at the University of Western Sydney. Simeon was previously
    a professor of information technology at the University of Technology (UTS), Sydney.
    Prior to UTS, he held academic positions at the University of Sydney, the Middle
    East Technical University, Ecole Polytechnique–University of Nantes, and Istanbul
    Technical University. In 2006, he was a BIT Professor at the Free University of
    Bolzano-Bozen and the University of Trento. He is a founding director and a fellow
    of the Institute of Analytics Professionals of Australia. Currently, Dr. Simoff
    is an editor of the Australian Computer Society’s (ACS) Conferences in Research
    and Practice in Information Technology (CRPIT) series in computer science and
    ICT. Prior to that, he was the associate editor (Australia) of the American Society
    of Civil Engineering (ASCE) *Journal of Computing in Civil Engineering*. Currently,
    he serves on the ASCE technical committees on data and information management,
    and on intelligent computing.'
