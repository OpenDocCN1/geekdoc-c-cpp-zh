- pgno: 243
  md: '$L(t)=\sum_{i=0}^{N}(r_i(t),q_i(t))+(r_0,q_0)$


    Given only the resulting sum value over time, we are looking for a state matrix
    that contains the state of each device at any discrete point in time. The state
    spaces of the devices are independent of each other. For most practical devices,
    there exist several constraints on the possible states and the state transitions
    that are caused by their internal electrical structure and their usage modes.
    For example, all practical devices are operating between a minimum load and a
    maximum load, and they have finitely many operating states.


    There are two fundamental steps to be made for load disaggregation. The first
    step is *feature recognition*, which extracts features from the observed meter
    data. The second step is the application of an *optimization* algorithm that assigns
    values to the state matrix.


    Pattern recognition is being applied to the observed values (see Section 7.4.3.3),
    in its simplest form to a change in the real power load. The objective of this
    step is to identify a set of devices that may exhibit the observed pattern. A
    naïve algorithm could map a load change to the device that exhibits the closest
    step size of the observed change. An ideal algorithm would perfectly identify
    the cause of an observed event as either a fluctuation not caused by a state change,
    or the very device and its state change that caused the change. However, no such
    perfect algorithm exists today and false positive matches and false negatives
    are unavoidable.


    There are a variety of features that can be used to find a valid disaggregation.
    The most basic feature of a device is its load variance, which was used by Hart
    [63]. Based on this feature, four classes of devices can be identified: *permanent,
    on-off, multi-state,* and *variable*. Permanent devices are single-state and are
    consuming the same load at all times (e.g., alarm systems that are never switched
    off). On-off devices have an additional off-state, where consumption is (near-)zero.
    Multi-state devices have multiple operating modes that are usually executed in
    certain patterns; for example, a washing machine has certain modes, such as heating
    water, pumping, or spinning. Variable load devices expose arbitrary, irregular
    load patterns that may depend on their actual usage mode. It is important to note
    that most practical devices cannot be fully characterized by one of these classes
    alone. Usually, a device exhibits behavior that is a complex mixture of these
    classes. The challenge of disaggregating such loads is complicated by the fact
    that, of'
  merge: -1
