  md: 'effect of uncertainty about the actual cost of each project and in-kind contributions
    on the optimal solution, and investigate how the distribution of funds among counties
    influences the overall statewide benefit.


    Several characteristics of the DGRP are important. First, the program focuses
    on local administration, with all allocation and auditing administration done
    at the county level. The state is involved only in training county program managers,
    reporting overall program results, and establishing basic project standards. The
    state also sets environmentally sustainable method (ESM) standards that dictate
    the methods and materials that may be used to ensure that each project represents
    an environmentally sustainable fix over the long term. All grant recipients must
    have an employee who has received ESM training within the previous 5 years to
    be eligible. Sites are ranked in terms of potential environmental impact based
    on a set of 12 criteria relating to road topology, proximity to a stream, stability
    of the drainage infrastructure, and the amount of canopy cover, among other considerations.
    The individual scores from each criterion are totaled to generate an overall environmental
    rank that ranges from 0 to 100, and the ranking is used to assign funding priorities.
    Additionally, in-kind contributions from grant applicants play a significant role
    in the program. Those contributions, typically in the form of in-kind equipment
    and labor, are not required by the state, but counties may enact minimum contribution
    levels or use the level of these in-kind contributions to adjust the ranking scores.
    Over the past several years, in-kind support for the program has been in the range
    of 40% to 50% of program money spent. Also, counties often enact regulations that
    limit the total number of contracts or projects that can be awarded to a township
    simultaneously, or stipulate that all applicants must have received at least one
    funded project before any applicant can be considered for multiple projects. Further
    details on state-level administration of the program are available from Penn State
    University Center for Dirt and Gravel Road Studies (CDGRS), which was created
    to provide technical services for the program (CDGRS, 2009).


    The inclusion of in-kind cost sharing and matching funds is a common practice
    in conservation programs and is designed to leverage additional resources from
    partner agencies and individuals to achieve their conservation objectives (Kotani,
    Messer, and Schulze, 2010). Implementation schemes vary, but most require the
    participating organization to cover some percentage of the project’s cost. The
    numerous other federal, state,'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'and private conservation funding programs that require some sort of cost sharing
    include the USDA Conservation Reserve Program (USDA, 2010), the U.S. Forest Service''s
    Forest Legacy Program (Fooks and Messer, 2012), and the U.S. Fish and Wildlife
    Service National Wetlands Conservation Grant Program.


    In the literature, in-kind cost sharing has been considered a type of matching
    grant program where the agency requesting a grant agrees to pay some percentage
    of the total project cost. Theoretically, matching grants are seen as a mechanism
    that corrects for externalities and “spill-overs” in federalized agency structures.
    Oates (1999) pointed out that the local benefits from a project under consideration
    might not justify funding it for the local agency. However, a project may offer
    additional nonlocal benefits, and those spillover benefits could make it attractive
    to society as a whole. The matching grant offered by an outside body would represent
    a sort of “Pigouvian subsidy” to pay the local agency for the external benefits
    obtained in other jurisdictions. On the other hand, Bucovetsky et al. (1998) have
    offered an informational argument for matching grants, starting with the assumption
    that a government should distribute funds to the regions that value public services
    the most, then justifying a matching grant mechanism as revealing the level of
    commitment of the potential grant recipients—in other words, requiring to demonstrate
    the true benefits of the program by having them “put their money where their mouth
    is.” Thus, the matching grant serves as a mechanism by which the funder can reveal
    the private value of funding to the participants.


    The evidence thus far offered on the effect of matching grants and cost sharing
    has been mixed.^1 Baker et al. (1999) found that instituting a matching grant
    system in the Canada Assistance Plan lowered expenditure growth by eight to nine
    percentage points as provinces became responsible for a portion of program costs.
    Using simulations, Borge and Rattso (2008) found that matching grants decreased
    expenses more than block grants but led to unstable service provision over time.
    Chernick (1995) found that conversions from matching grants to fixed block grants
    by U.S. federal welfare programs varied substantially across states but generally
    led to a reduction in benefits.


    ^1 For an in-depth discussion of matching grants and their implementation, see
    Boadway and Shah (2007).'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The project selection literature generally does not address issues associated
    with the incorporation of in-kind requirements into the selection process. In-kind
    contributions are implicitly accounted for by the reduction in the project cost
    to the government, but that measure fails to take full advantage of the additional
    information potentially provided by the size of the in-kind cost share, such as
    the degree of commitment of the partner organization, and the political benefits
    of using program funds to leverage resources from other organizations, agencies,
    and individuals. In this chapter, we incorporate that additional information into
    an optimization approach by developing a MOP model that seeks to optimize both
    conservation outcomes and partner in-kind cost sharing contributions. Results
    from the models show that MOP offers results that are superior to approaches currently
    used by the DGRP while yielding cost-effective outcomes that are likely to be
    more practical than solutions generated by the standard BLP approach.


    For the DGRP case study, datasets were available for three Pennsylvania counties:
    Bradford, Cambria, and Carbon (displayed in Figure 6.1). Bradford County is the
    largest and most rural of the three. It has the second largest dirt road network
    in the state and has been granted an average of $246,000 per year in funding over
    the course of the program. Carbon and Cambria Counties both have a smaller area
    and are more densely populated. Carbon County has received, on average, $24,000
    per year over


    ![](img/644775a10ad87164013616d709050cee_187_0.png)


    FIGURE 6.1  Map of Pennsylvania counties.'
