- pgno: 212
  md: '# ### 7.2.2.1 Long-Term Trading


    While electric energy has traditionally been traded by means of bilateral *over-the-counter*
    (OTC) contracts, an increasing amount of energy is nowadays traded at power exchanges.
    Such exchanges trade standardized products, which makes trading easier and increases
    the comparability of prices. While there are different ways of trading energy,
    double auctions as known from game theory [54] are the dominant means for finding
    the price [137].


    As one example, the *European Energy Exchange AG (EEX)* in Leipzig, Germany, trades
    different kinds of standardized energy futures and options. These products describe
    the potential delivery of a certain amount of energy at certain times in the future.
    The delivery must be within one of the transportation grids. In addition to the
    traded products, they also provide clearinghouse services for OTC contracts. The
    volume traded at the EEX derivative market for Germany amounted to 313 terawatt-hours
    (TWh) in 2010, 1,208 TWh including OTC transactions [6]. The latter number roughly
    corresponds to two times the energy consumed in Germany in the same time frame.


    # ### 7.2.2.2 Short-Term Trading


    Short-term trading becomes necessary as both consumption and production cannot
    be predicted with 100% accuracy. Therefore, not all needs for energy can be covered
    by long-term trading. In particular, fluctuating renewable energies make correct
    long-term predictions of production virtually impossible. As one example, wind
    energy production can only be predicted with sufficient accuracy for a few hours
    in advance. Therefore, energy exchanges are used for short-term trading, again
    making use of different kinds of auctions. At such exchanges, retailers can buy
    electrical energy for physical delivery in case their demand is not covered by
    futures. Again, the delivery must be within one of the transportation grids.


    The *EPEX Spot SE (European Power Exchange)* in Paris, France, trades energy for
    several European markets. There, trading is divided as follows:


    +   - In *day-ahead auctions*, electrical energy is traded for delivery on the
    following day in 1-hour intervals [6]. These auctions take place at noon on every
    single day. Bids can be done for individual hours or blocks of several hours,
    and the price can be positive or negative. Negative prices may occur, for instance,
    when the predicted regenerative production is very high and the demand is low,
    possibly on a public holiday.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   - In *intraday trading*, electrical energy is traded for delivery on the
    same or following day, again in 1-hour intervals [6]. Each hour can be traded
    until 45 minutes before delivery; starting at 3:00 p.m., all hours of the following
    day can be traded. Bids can also be done for individual hours or blocks of hours,
    and prices can again be positive or negative.


    At the EPEX, 267 TWh were traded in 2010 by means of day-ahead auctions and 11
    TWh during intraday trading (German, French, and Austrian market) [6]. The sum
    of these trades roughly corresponds to half of the electrical energy consumed
    in Germany in the same time frame (most of this energy is traded for the German
    market).


    # 7.2.3 Energy Balancing


    To ensure a reliable and secure provision of electrical energy without any power
    outages, the energy grids must be stable at any point in time. In particular,
    there must be assurance that the production always equals the consumption of energy.
    In practice, avoiding imbalances between generation and demand is challenging
    due to stochastic consumption behavior, unpredictable power-plant outages, and
    fluctuating renewable production [137].


    On a very coarse temporal granularity, a balance is achieved by means of energy
    trading (see Section 7.2.2) and data-analysis mechanisms, in particular prediction
    and forecast: Retailers buy the predicted demand of their customers, and generators
    sell their predicted generation. As mentioned in Section 7.2.1, the BRPs make
    sure that the scheduled supply of energy corresponds to the expected consumption
    of energy. This expected consumption is also derived using data-analysis techniques.
    The TSOs are responsible for the stability of the grids. In the following, we
    describe how they do so.


    From a technical point of view, a decrease in demand leads to an increase in frequency,
    while a decrease in production leads to a decrease in frequency (and vice versa
    for increases). Deviations from the fixed frequency of 50 Hz in electricity grids
    should be avoided in real time, as this might lead to damage to the devices attached
    to the grid.


    Typically, frequency control is realized in a three-stage process: primary, secondary,
    and tertiary control. The primary control is responsible for very short deviations
    (15 to 30 seconds), the secondary control for short deviations (max. 5 minutes),
    and the tertiary control for longer deviations (max. 15 minutes) [137]. The control
    process can be realized by various means,'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'for example, standby generators, load variation of power plants, or load shifting.
    Different measures involving different types of power plants have different reaction
    times and are therefore used for different control levels.


    The capacities needed for balancing the grids are again frequently traded by means
    of auctions: Primary and secondary capacities are traded biannually, while tertiary
    capacity is traded on a daily basis [137]. Usually, only prequalified actors are
    allowed in such balancing markets, as it must be ensured that the requirements
    at the respective level can be fulfilled technically. Primary-control bids consist
    of the offered capacity and the price for actual delivery of balancing power.
    In contrast, bids for secondary and tertiary control consist of one price for
    making available a certain capacity and another price for consumed energy [137].
    Thus, capacities play an important role in the balancing market, and actors are
    partly paid for a *potential supply*, which hinders a generator from selling this
    energy on the regular market.


    For costs that arise from the actual energy delivered for secondary and tertiary
    control, the generators who caused deviations or retailers who did not procure
    the correct amount of energy for their customers are charged [81, 137]. Costs
    for primary control and for the capacities of secondary and tertiary control are
    paid by the corresponding grid operators [137], who earn grid-usage fees. Because
    costs at the balancing market are typically higher than on the normal energy market,
    generators and retailers are stimulated to make best-possible predictions of energy
    production and consumption [81].


    # 7.3 FUTURE ENERGY SCENARIOS


    In this section we describe a number of visionary energy scenarios for the future.
    They represent building blocks of a possible *smart grid*. We describe the scenarios
    from a researcher’s point of view—they assume certain technical developments and
    may require legislative changes. We have selected scenarios that are commonly
    discussed in the scientific and industrial communities, either in the described
    form or in some variation.


    # Scenario 7.1: Access to Smart-Meter Data


    Smart metering is a key building block of the smart grid, as many further scenarios
    rely on the availability of fine-grained information of energy consumption and
    production. For instance, smart metering can enhance load forecasting and enable
    demand response, dynamic pricing, etc. Some of these scenarios are described in
    the following. However, smart'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'metering is not only an enabler for other scenarios. Giving users access to
    their energy consumption profiles can make them more aware of their consumption
    and improve energy efficiency. This is important as many consumers have little
    knowledge about their energy consumption.


    For purposes of billing, smart-meter data is typically generated in 15-minute
    intervals. That is, the meter transfers the accumulated consumption of the consumer
    every 15 minutes to the metering operator. Technically, smart meters can increase
    the temporal resolution of consumption data, for example, measure the consumption
    within every second or minute. This allows one to obtain a detailed picture of
    the energy consumption—down to the identification of individual devices (e.g.,
    coffee machines), as each device has its typical load curve. Such fine-grained
    data could also be transferred to a metering operator. In addition, metering data
    at any granularity can be made available within a home network, for example to
    be accessed via visualization tools on a tablet computer.


    Access to consumption profiles for energy consumers can be more than pure numbers
    or simple plots. Respective visualization tools can easily show comparisons to
    previous days, weeks, etc. In the case of service providers, they can also provide
    comparisons to peer groups of consumers having similar households (in terms of
    size and appliances used). Furthermore, devices can be identified by their load
    profile [113], which can be visualized additionally. This leads to an increased
    awareness of the energy consumption of each single device.


    A number of studies have investigated the effects of giving users access to smart-metering
    data. Schleich et al. [126] have carried out controlled field experiments with
    2,000 consumers and came to the conclusion that giving access to detailed consumption
    data may lower the total energy consumption moderately, by about 4%. Other (meta)
    studies suggest that savings can be even a little higher [39, 45, 94].


    # Scenario 7.2: Demand Response with Dynamic Prices


    Energy retailers procure parts of their energy needs at the spot market, where
    the prices reflect the actual availability of (renewable) energy (see Section
    7.2.2.2). At the same time, energy consumers typically procure energy for a fixed
    price per kilowatt-hour, additionally to a consumption-independent monthly fee.
    Although this is comfortable for the consumers and the sum of the monthly or annual
    bill can be easily calculated if the consumption is known, there are no incentives
    to consume energy'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'when large amounts are available (e.g., when wind-energy production is high)
    or to save energy when production is low. As discussed in the introduction, such
    a paradigm shift from demand-driven generation to generation-driven demand is
    necessary to facilitate the integration of renewable energies. One approach to
    realize this is dynamic pricing. In a nutshell, the retailer communicates the
    actual or future prices of energy per kilowatt-hour to their consumers, and they
    can decide if they react to such incentives or if they prefer to consume energy
    when they want it while tolerating possibly higher prices.


    The predecessors of dynamic prices are tariff schemes where electricity is cheaper
    during the night, reflecting a lower average demand at that time. However, this
    does not consider the fluctuating production of renewable energy. Dynamic price
    mechanisms can take into account these fluctuations and incorporate them in the
    prediction of renewable generation and demand of the consumers. Dynamic price
    schemes mainly differ in the range of possible prices, in the resolution of time
    ranges in which prices are valid, and in the time spans in which the prices are
    communicated in advance. Very short time spans enable highly dynamic demand response,
    but also make it difficult to plan energy consumption. Furthermore, legislation
    may demand certain minimum time spans. A more detailed review of dynamic prices
    can be found by Jokic et al. [70].


    The German research project MeRegio investigates user acceptance of so-called
    “energy traffic lights” (see [4] for more information). These are small devices
    receiving the energy tariffs for the forthcoming 24 hours via radio. The granularity
    of prices comprises three discrete levels: “low,” “normal,” and “high.” Consumers
    can see these levels and plan accordingly. In addition, the device visualizes
    the three levels in different colors (e.g., red stands for “high”), which makes
    the consumers more aware of the current price of electricity. Of course, dynamic
    prices are not merely intended for human interpretation. Intelligent devices can
    receive such price signals and decide when a certain process should be started
    (e.g., a dishwasher can be started automatically when the lowest tariff starts).
    This automation is done to a greater extent in so-called smart homes, which are
    described in Scenario 7.4.


    In addition to the promising approach to realize demand response, dynamic prices
    also bear risks. As one example, it might happen that many devices start operation
    when a low-price time span starts. This may challenge the distribution grid as
    sudden significant increases in demand can hardly be handled by energy-balancing
    mechanisms and should therefore'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'be avoided. This might be realized by using individual dynamic prices for the
    different consumers (slight differences in order to smoothen demand curves), or
    by having a much finer granularity of prices. If granularity is fine enough, different
