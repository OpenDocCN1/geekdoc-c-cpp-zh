    # 8.3.2 Box-Jenkins or ARMA Modeling


    Once the seasonal component has been determined, we subtract its contribution
    from the data and work with the residual series r_t. The general form of an ARMA
    (p,q) model is


    X_t - φ_1 X_{t-1} - φ_2 X_{t-2} - ... - φ_p X_{t-p} = Z_t + θ_1 Z_{t-1} - θ_2
    Z_{t-2} + ... + θ_q Z_{t-q}


    where {X_t} are random variables with X_t ~ (0,σ_X^2) and {Z_t} is white noise,
    independent and identically distributed with Z_t ~ (0,σ_Z^2). Figure 8.6 shows
    results from an AR(2) model.


    # 8.3.3 A Resonating Model


    Figure 8.6 shows that this AR(2) model works particularly well when solar radiation
    residuals are decreasing. However, the AR(2) model has underestimated all the
    high peaks of the data. So, it is important to find another model to help capture
    these peaks. Lucheroni [26] presented a resonating model for the power market
    that exploits the simultaneous'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/644775a10ad87164013616d709050cee_276_0.png)


    FIGURE 8.6  An AR(2) model fitted to 3 days of residuals.


    presence of a Hopf critical point, periodic forcing, and noise in a two-dimensional,
    first-order nonautonomous stochastic differential equation system for the logarithm
    of the power price and the derivative of logprice. The model that originates from
    biophysics (known in the literature as the FitzHugh-Nagumo system, [17, 25]) performs
    very well for power market modeling; see Lucheroni [26].


    This model (written here in its discretized form) was developed by Lucheroni [26]:


    $$f_{i+1}=f_i+z_i\Delta t \tag{8.1}$$


    $$z_{i+1}=z_i+\left[\kappa(z_i+f_i)-\lambda(3f_i^2z_i+f_i^3)-\varepsilon z_i-\gamma
    f_i-b\right]\frac{\Delta t}{\varepsilon} \tag{8.2}$$


    Here, $\omega_t$, and $a_t$ are noise terms, and $\Delta t$ is the time step.
    Equation (8.2) aims to exploit the fact that the current value of $z_t$ is useful
    to predict the future value $R_{t+1}$. The parameters $\kappa$, $\lambda$, $\varepsilon$,
    $\gamma$, and $b$ can be estimated using the method of ordinary least squares
    (OLS). For our deseasoned data, estimated values for the parameters are $\kappa=-2.1$,
    $\lambda=-6\times10^{-8}$, $\varepsilon=0.09$, $\gamma=0.5$, and $b=2$. $\lambda$
    is virtually zero, which indicates that the deseasoned residuals $R_t$ behave
    linearly. Further to this, a negative value of $\kappa$ assures the stability
    of the inherent damped oscillator in Equation (8.2).'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/644775a10ad87164013616d709050cee_277_0.png)


    FIGURE 8.7  Lucheroni model for the 3 sample days.


    The Lucheroni model (Figure 8.7) is good at picking up the peak, and the AR(2)
    model (Figure 8.6) is good at forecasting in the main regions of the series, because
    when the AR(2) model reaches the peak, it is converging to the mean faster than
    the Lucheroni model. Is there evidence for this other than eyeballing the graphs?
    Combining the AR(2) model with the Lucheroni model could solve those problems.
    We can also add a second derivative component (a proxy for curvature) that adds
    even more to the predictability (Figure 8.8).


    # 8.3.4  Estimating Volatility


    Traditional methods for forecasting volatility are indirect by necessity because
    the volatility is unobservable in a time series. These indirect methods include
    generalized autoregressive conditional heteroscedastic (GARCH) [9] and Hidden
    Markov Models (HMMs) [40]. We have developed a method for estimating the volatility
    using high-frequency data [1], and then use the resonating model [26] for forecasting
    the volatility at the 5-minute and 30-minute timescales required by the electricity
    market. These forecasting methods can also be used to delineate the level and
    variability of output. We are thus able to make these estimations for any proposed
    individual wind or solar installation.'
