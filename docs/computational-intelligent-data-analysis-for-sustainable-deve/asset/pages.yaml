  md: 'distribution from training data. It is then possible to proceed with inference
    from the copula function.


    Because copula estimation is less well known, we now briefly review copula theory.
    We will then describe how we construct the individual parametric distributions
    that are components of a copula, and then how we couple them to form a multivariate
    density function. Finally, we present our approach to predict the value of y given
    x₁...xₘ.


    A copula function C(u₁,...,u_{m+1};θ) with parameter θ represents a joint distribution
    function for multiple uniform random variables U₁...U_{m+1} such that


    C(u₁,...,u_{m+1};θ)=F(U₁≤u₁,...,U_{m+1}≤u_{m+1})    (10.12)


    Let U₁...Uₘ represent the cumulative distribution functions (CDFs) for variables
    x₁,...,xₘ and U_{m+1} represent the CDF for y. Hence, the copula represents the
    joint distribution function of C(F(x₁),...,F(xₘ),F(y)), where Uᵢ=F(xᵢ). According
    to Sklar''s theorem, any copula function taking marginal distributions F(xᵢ) as
    its arguments defines a valid joint distribution with marginals F(xᵢ). Thus, we
    are able to construct the joint distribution function for x₁...xₘ,y given by


    F(x₁,...,xₘ,y)=C(F(x₁),...,F(xₘ),F(y);θ)    (10.13)


    The joint probability density function (PDF) is obtained by taking the m + 1th
    order derivative of the Equation (10.13):


    f(x₁,...,xₘ,y)= ∂^{m+1}/∂x₁...∂xₘ∂y C(F(x₁),...,F(xₘ),F(y);θ)    (10.14)


    = ∏_{i=1}^{m} f(x_i) f(y) c(F(x₁),...,F(xₘ),F(y))    (10.15)


    where c(.,.) is the copula density. Thus, the joint density function is a weighted
    version of independent density functions, where the weight is derived via copula
    density. Multiple copulas exist in the literature. In this chapter we consider
    a multivariate Gaussian copula to form a statistical model for our variables given
    by'
