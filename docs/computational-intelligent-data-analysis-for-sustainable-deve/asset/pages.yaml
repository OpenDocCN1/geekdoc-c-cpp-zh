  md: '+   - *Pattern detection for enhanced demand response.* In demand response
    (e.g., for dynamic prices in Scenario 7.2), one tries to match energy production
    with energy consumption, which requires a deep understanding of both sides. For
    the generation side, one has proposed prediction techniques that are used to forecast
    wind or solar energy production (see Section 7.4.3.1). For the consumption side,
    in addition to forecasts, one is interested in customer profiles that provide
    insights about their daily behavior (see Section 7.4.3.2). As behaviors change
    dramatically over time, one cannot always rely on historical data and learning
    algorithms. Thus, unsupervised methods (e.g., clustering or outlier mining) are
    means for this kind of data analysis. Clustering algorithms detect groups of customers
    showing highly similar behavior, without any prior knowledge about these groups.
    In particular, for demand-side management, these clusters can be used for specific
    strategies in each customer group. While some customers will not be able or willing
    to participate in some management actions, others will show high potential for
    shifting parts of their energy consumption. It is essential to be aware of such
    groupings to utilize the overall potential of demand-side management.

    +   - *Automatic smart-home surveillance.* As one part of smart homes (see Scenario
    7.4), we discussed demand response in the previous example. However, smart homes
    have further potential for data-analysis tasks. Having all the energy consumption
    data of smart homes available, one can design automated surveillance mechanisms
    assisting, for example, elderly people in their daily living. Energetic profiles
    are very detailed and reveal a lot of information about our daily behavior and
