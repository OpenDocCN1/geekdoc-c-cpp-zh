    joint density via likelihood parameter estimation.


    **Prediction:** Given a new test point, multiple inference techniques are available
    to predict the value of y_k|x_k [11].


    We refer the reader to Koller and Friedman [11] for a thorough introduction to
    Bayesian networks and a well-known, publicly available MATLAB-based tool for K2,
