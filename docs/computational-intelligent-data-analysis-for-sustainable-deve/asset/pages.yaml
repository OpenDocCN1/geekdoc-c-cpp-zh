  md: 'highlights the need for multiple clustering solutions on a single database
    [102]. In particular, with the large number of attributes given, it is unclear
    which of them are relevant. It is an additional challenge for data analysis to
    select these attributes.


    Dimensionality-reduction techniques have been proposed to select a set of attributes.
    They tackle the “curse of dimensionality,” which hinders meaningful clustering
    [25]. Irrelevant attributes obscure the cluster patterns in the data. Global dimensionality
    techniques, such as *principle component analysis (PCA)*, reduce the number of
    attributes [71]. However, the reduction may obtain only a single clustering in
    the reduced space. For locally varying attribute relevance, this means that some
    clusters will be missed that do not show up in the reduced space. Moreover, dimensionality
    reduction techniques are unable to identify clusterings in different reduced spaces.
    Objects may be part of distinct clusters in different data projections. *Our customer
    segmentation example highlights this property.* Each cluster requires an individual
    set of relevant dimensions.


    Recent years have witnessed increasing research in clustering in high-dimensional
    spaces. Projected clustering or subspace clustering aims at identifying the locally
    relevant reduction of attributes for each cluster. In particular, subspace clustering
    allows identifying several possible subspaces for any object. Thus, an object
    may be part of more than one cluster in different subspaces [101, 128].


    For customer segmentation based on energy profiles, several open challenges arise
    in the detection of object groups and the detection of relevant attributes for
    each of these groups. Many private and public organizations collect large amounts
    of energy measurements; however, their relevance for individual patterns is still
    unclear. Neither is clustering on the full set of attributes a solution, nor is
    preselection of relevant attributes by dimensionality reduction techniques. Costly
    search in all possible projections of the data must be performed to identify multiple
    clustering solutions with respect to different attribute combinations. Thus, the
    scalability of such data-mining techniques will be a major challenge, as highlighted
    by a recent study [101]. As described in Section 7.4.1, smart-meter readings will
    provide huge databases. Only a few publications have focused recently on such
    scalability issues [34, 98, 99]. However, most subspace clustering models are
    still based on inefficient processing schemes [15, 72, 100]. Further challenges
    arise in the stream processing of such data [11]. It raises questions on the detection
    of clusters, but also on their tracking over time [59, 129]. Tracking the change
    of customer profiles will be an essential'
