    # 1.3.2 Integrated Sustainability Analysis


    There are a multitude of tools that can be used to describe and/or quantify the
    structure of a technical society and its interactions with the environment [24].
    Ness et al. divide them in three main groups: (1) regional or national sustainability
    indicators and indices, (2) product-related tools, and (3) integrated assessment
    tools [17]. The first group represents measurements of the economic, social, or
    environmental state of a region or nation. The indicators and indices are continuously
    measured and calculated and therefore allow for describing long-term sustainability
    trends from a retrospective point of view. The second group is more specific,
    as it focuses on the flows related to the production and consumption of goods
    and services. The goal of these tools is to evaluate the consumption of natural
    resources and emission of environmental loads along the production or consumption
    chains or throughout the life cycle of a product or service. Examples from this
    group include the Life-Cycle Assessment (LCA). The third group, integrated assessment
    tools, includes in the analysis the three pillars of sustainability and allows
    analyses at the regional level. Integrated sustainability analysis captures the
    complexities and interdependencies of our social, economic, and environmental
    support systems.


