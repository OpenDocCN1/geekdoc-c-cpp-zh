- pgno: 377
  md: 'Various analytical results for the distribution of eigenvalues of a random
    Wishart matrix can be found by Edelman [3], Sengupta and Mitra [16], and Utsugi
    et al. [19]. The eigenvalue density, ρ(λ), is defined as the fraction of eigenvalues
    below some value, λ. Given a random correlation matrix whose entries are drawn
    from the standard normal distribution, the eigenvalue density as K and T go to
    infinity is given by the Marcenko-Pastur law:


    $$\rho(\lambda)=\frac{Q}{2\pi}\frac{\sqrt{(\lambda_{max}-\lambda)(\lambda-\lambda_{min})}}{\lambda}\tag{11.1}$$


    where $Q = T/K \ge 1$ and $\lambda_{max/min} = 1+1/Q \pm 2\sqrt{1/Q}$ [9].


    That is, we can establish significant correlation structure by comparing eigenvalue
    spectra from the data to those of a random null model. If we find eigenvalues
    significantly outside theoretical thresholds, we conclude there is signal buried
    in the noise. The eigenvectors associated with these significant eigenvalues are
    then interpreted as individual factors contributing to the correlation structure
    of the system. For example, the largest eigenvalue (and corresponding eigenvector)
    in the case of financial data is identified as the “market” factor, having equally
    weighted components. Mayya et al. have obtained similar analytical results for
    lagged cross-correlation matrices [12].


    # 11.3.5 Daily Drug-Related Crime Rates in 1999


    Examining the eigenvalue spectrum of our daily drug data from 1999, we find a
    weak signal. The spectra corresponding to the correlation matrix of drug-related
    crimes are shown in Figure 11.8(a). While the majority of eigenvalues cannot be
    distinguished from noise, there does exist a large significant eigenvalue.


    Next, we examine the spectra for a series of lagged correlation matrices. Plotting
    the magnitude of the largest eigenvalue for each lagged correlation matrix and
    comparing this to the largest value expected from random data, we see a strong
    cyclic signal with a period of 7 days (Figure 11.8). This analysis suggests that
    significant correlation structure is present on a weekly cycle. We also note that
    this signal does not decrease in intensity over time. This suggests we are detecting
    some persistent periodic element that is not the result of some one-time event.


    In addition to the magnitude of eigenvalues, we also examine the distribution
    of components within each eigenvector. Again borrowing from'
