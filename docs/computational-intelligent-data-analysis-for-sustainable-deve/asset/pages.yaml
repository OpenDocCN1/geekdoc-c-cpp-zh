  md: 'are quite sensitive to predictor used, and not all predictors appear to be
    useful. Finally, Gifford [27] shows a detailed study of team learning, collaboration,
    and decision applied to ice-penetrating radar data collected in Greenland in May
    1999 and September 2007 as part of a model-creation effort for subglacial water
    presence classification.


    The above-mentioned examples represent a few cases where machine learning tools
    have been applied to problems focusing on studying the polar regions. Although
    the number of studies appears to be increasing, likely because of both the increased
    research focusing on climate change and the poles and the increased computational
    power allowing machine learning tools to expand in their usage, they are still
    relatively rare compared to simpler but often less efficient techniques.


    Machine learning and data mining can be used to enhance the value of the data
    by exposing information that would not be apparent from single-dataset analyses.
    For example, identifying the link between diminishing sea ice extent and increasing
    melting in Greenland can be done through physical models attempting to model the
    connections between the two through the exchange of atmospheric fluxes. However,
    large-scale connections (or others at different temporal and spatial scales) might
    be revealed through the use of data-driven models or, in a more sophisticated
    fashion, through the combination of both physical and data-driven models. Such
    an approach would, among other things, overcome the limitation of the physical
    models that, even if they represent the state-of-the-art in the corresponding
    fields, are limited by our knowledge and understanding of the physical processes.
    ANNs can also be used in understanding not only the connections among multiple
    parameters (through the analysis of the neurons connections), but also to understand
    potential temporal shifts in the importance of parameters on the overall process
    (e.g., increased importance of albedo due to the exposure of bare ice and reduced
    solid precipitation in Greenland over the past few years). Applications are not
    limited to a pure scientific analysis but also include the management of information,
    error analysis, missing linkages between databases, and improving data acquisition
    procedures.


    In synthesis, there are many areas in which machine learning can support studies
    of the poles within the context of climate change. These include climate model
    parameterizations and multimodel ensembles of projections for variables such as
    sea ice extent, melting in Greenland, and sea-level rise contribution, in addition
    to those discussed in previous sections.'
