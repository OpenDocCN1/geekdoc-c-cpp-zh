    2 的 `acc` 相加时，我们再次回绕到 0。


    接下来，我们将 -3 加到 `acc`。-3 被转换为 `size_type` 并回绕为 `std::numeric_limits<size_type>::max()-2`。当它与值为
    0 的 `acc` 相加时，结果为 `std::numeric_limits<size_type>::max()-2`，该值作为最终结果存储在 `acc`
    中。在具有 32 位 `int` 和 64 位 `size_type` 的典型系统上，结果将是 184467403709。


