  - '[PAGE 119]


    using parentheses (1,2) and the other using curly braces {1,2}. Which constructor
    is called in each case?


    For Container container1{1,2}, overload resolution unsurprisingly chooses the
    constructor taking two ints.


    For Container2{1,2}, overload resolution chooses the constructor taking a std::initializer_list<float>;
    even though we passed two ints! Does this mean {1,2} is a std::initializer_list<int>?
    No, {1,2} isn''t a std::initializer_list<int> but an expression called a braced-init-list.
    A braced-init-list is a pair of curly braces containing zero or more elements.
    These can occur in several contexts; the most common is for initialization. Here
    are some examples of braced-init-lists used for initialization:


    examples/braced-init-list/braced-init-list.cpp


    ```

    std::array<int, 3> a{1, 2, 3};

    int i{2};

    int j{};nf{{1, 2}};

    std::map<int, std::string>{{1, "one"}, {2, "two"}};

    return {1, 2};

    ```


    As we can see from the initialization of i and j, even if there’s zero or one
    element and not a “list” of items between the curly-braces, the expression is
    still called braced-init-list.'
  - '[PAGE 120]


    Initialization from a braced-init-list is called list-initialization, and the
    braced-init-list is unfortunately called an initializer list in these contexts.
    An initializer list is not the same as the class template std::initializer_list<T>.
    The names are rather confusing.


    So if {1,2} isn''t a std::initializer_list, why does it pick the std::initializer_list
    constructor? Overload resolution has a special case for list-initialization where
    it happens in two phases:


    +   - First, it does overload resolution for all constructors taking a std::initializer_list,
    treating the braced-init-list as one single argument.

    - Then, and only if the first phase didn''t succeed, it does overload resolution
    for the other constructors, treating the elements of the braced-init-list as separate
    arguments.


    In the case of Container container{1,2}, overload resolution first tries the std::initializer_list<float>
    constructor. An int can be implicitly converted to a float, similarly an initializer
    of int can be used to create a std::initializer_list<float>. The std::initializer_list<float>
    constructor is chosen, and the other constructor is never considered.


    Now to the bonus question: what happens if we remove std::initializer_list<float>
    constructor? For Container container1(1,2), there''s no change since this is not
    list-initialization. For Container container2{1,2}, overload resolution doesn''t
    find any constructors taking a std::initializer_list in the first phase and moves
    on to the other constructor. The constructor taking two ints is used in both cases,
    and the program still compiles.'
