    \ took a const reference, like this?\n\nexamples/template-vs-function/template-vs-function.cpp\n\
    \n```cpp\ntemplate<typename T>\nvoid serialize(const T&) { std::cout << \"template\\\
    n\" } // 1\n```\n\nNow, the synthesized declaration will have the signature void\
    \ serialize(const std::string&), exactly like the non-template function, and overload\
    \ resolution needs to pick between these:\n\n```\nvoid serialize(const std::string&);\
    \ // Synthesized from the template (1)\nvoid serialize(const std::string&); //\
    \ The non-template function (3)\n```\n\nIf overload resolution finds two viable\
    \ candidates that are equally good, normally get a compilation error. So will\
