    The most important part of learning anything programming related is to play around
    with it yourself. The code from this book can be found on the book’s home page
    at The Pragmatic Bookshelf.[4] You can build it locally by opening CMakeLists.txt
    in your favorite IDE or on the command line:


    ```

    mkdir build

    cd build

    cmake ..

    cmake --build

    ```


    The project contains one .cpp file per puzzle, each resulting in one binary, both
    named the same as the corresponding puzzle in the book.


    You can also try the code directly in your browser by pasting it into an online
    compiler. I highly recommend Compiler Explorer,[5] where you can choose from and
    compare different compiler versions and architectures, try out different optimization
    levels, and add other compiler flags, sanitizer options, and so forth.


    Let’s get started! Oh, and beware of the demons.


    FOOTNOTES


    [3] http://catb.org/jargon/html/N/nasal-demons.html'
