    \ 的值是 `objectWithConstMember` 对象。它有名称，在内存中有固定位置，而且其他人可能仍在使用它，因此类型系统不允许我们对其进行移动。传统上，左值倾向于出现在赋值语句的左侧，因此名为左值（left-value）。\n\
    \n另一方面，右值（rvalue）是一个求值为可以从中移动之物的表达式，例如一个反正没有人使用的临时变量。右值倾向于出现在赋值语句的右侧，因此名为右值（right-value）。\n\
    \n`std::move` 将左值转换为右值，是我们告诉类型系统“没关系，你可以直接从这个左值中移动；我不再使用它了”的方式。随着 `std::move`\
