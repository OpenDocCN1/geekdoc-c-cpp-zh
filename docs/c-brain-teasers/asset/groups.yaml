    # Discussion


    A moved-from object should no longer be used, as resources will have been moved
    out of it, pointers might point to destroyed objects, and so on.


    How a particular moved-from object behaves is up to the implementer of that class.
    The implementer has a lot of freedom here, but at a minimum, the object should
    be safe to destroy so nothing breaks when, for instance, a moved-from local variable
    goes out of scope. Unless explicitly documented, you as a user should not assume
    that a class makes any further guarantees.


    The C++ standard provides an additional guarantee for the classes in the standard
    library, though:


    > Objects of types defined in the C++ standard library may be moved. (...) Unless
    otherwise specified, such moved-from objects shall be placed in a valid but unspecified
    state.


    std::string does not specify otherwise, so a moved-from string is placed in a
    “valid but unspecified state.” What does that mean, though?


    The C++ standard provides the following definition:'
  - '[PAGE 128]


    (a) value of an object that is not specified except that the object''s invariants
