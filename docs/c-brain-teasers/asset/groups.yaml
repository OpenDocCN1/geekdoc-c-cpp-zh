    Good bye, world!\"});\n}\n```\n\n# Guess the Output\n\n> Try to guess what the\
    \ output is before moving to the next page.\n\nThe program displays the following\
    \ output:\n\n```\ntemplate\nnormal function\n```\n\n# Discussion\n\nYou might\
    \ remember our serialization library from Puzzle 2, Puzzle 2, String Theory. In\
    \ the meantime, a C++ expert has come along and decided that everything is better\
    \ with templates. Whether or not that's true is another discussion, but it certainly\
    \ makes overload more interesting!\n\nWe find three definitions of serialize in\
    \ this puzzle. The first (the one marked “1”) is the primary template for serialize.\
    \ The next (marked “2”) is an explicit specialization of this template for std::string.\
    \ You can recognize it as a specialization by the empty template<> tag. Finally,\
    \ we see a plain old non-template serialize function (marked “3”).\n\nSince the\
    \ name serialize is overloaded, when we write a call to that name, overload resolution\
    \ needs to work out which one to call. As we learned in Puzzle 2, Puzzle 2, String\
    \ Theory, it does by creating a set of all candidate functions of that name and\
    \ then selecting the best function from that set. It’s clear that the normal,\
    \ non-template serialize function (3) is a candidate, but what happens with the\
    \ function template? And how is the compiler to disambiguate between the function\
    \ template specialization and the normal function, both of which have the same\
    \ signature?\n\nWhen a function template is involved in overload resolution, the\
    \ compiler looks at all the primary templates of that name. It doesn’t consider\
