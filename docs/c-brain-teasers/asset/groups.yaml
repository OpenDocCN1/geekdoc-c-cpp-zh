    Since std::string{"Good bye, world!"} is a prvalue, the non-const reference in
    the function template can''t bind to it. The const reference in the normal function
    can, and this function is picked by overload resolution. Since the template was
    not picked, no instantiation takes place, and normal function is printed.


    Bonus question: what would happen if the function template also took a const reference,
    like this?


    examples/template-vs-function/template-vs-function.cpp


    ```

    template<typename T>

    void serialize(const T&) { std::cout << "template\n" } // 1

    ```


    Now, the synthesized declaration will have the signature void serialize(const
    std::string&), exactly like the non-template function, and overload resolution
    needs to pick between these:


    ```

    void serialize(const std::string&); // Synthesized from the template (1)

    void serialize(const std::string&); // The non-template function (3)

    ```


    If overload resolution finds two viable candidates that are equally good, normally
    get a compilation error. So will this even compile?'
  - '[PAGE 173]


    This is in fact fine. A special clause exists for overload resolution when templates
    are involved that says a function F1 is not a function template specialization
    and F2 is a function template specialization, F1 is a better function than F2.
    The non-template function is picked for both calls, and the program outputs the
    following:


    ```

    normal function

    normal function

    ```


    Notice that in neither of the preceding cases was the explicit function template
    specialization even involved in overload resolution—it never is. This can be non-intuitive,
    so in general it''s better to use non-template overloads than explicit specializations.
    See the first two links under Further Reading for details and some even worse
    examples of these kinds of confusions.


    | Recommendations |

    | Prefer non-template overloads over explicit specializations.


    # Further Reading


    Why Not Specialize Function Templates?'
