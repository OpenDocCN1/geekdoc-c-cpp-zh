  mdcn: "\n\n# Monster 被复制\nJormungandr 已移动\n\n# 讨论\n\n当我们用一个已移动过的对象初始化第二个 Jormungandr\
    \ 时，调用了 Jormungandr 的移动构造函数，但 Monster 的拷贝构造函数。这是为什么呢？\n\n正如我们在谜题 8，谜题 8，“会移动吗？”中所学到的，当我们将表达式封装在\
    \ `std::move` 中时，它会变成一个右值（rvalue）。但这里有一个重要的细节：值类别是针对表达式的，而不是对象的。因此，`jormungandr1`\
    \ 对象本身没有发生任何变化；只是表达式 `jormungandr1` 是左值（lvalue），而表达式 `std::move(jormungandr1)`\
    \ 是一个右值。如果你问我的话，如果被称为“左-表达式”和“右-表达式”而不是“左值”和“右值”，会更简单。\n\n当我们使用表达式 `Jormungandr\
    \ jormungandr2(std::move(jormungandr1))` 拷贝初始化 `jormungandr2` 时，重载解析倾向于选择 Jormungandr\
    \ 的移动构造函数而非拷贝构造函数，因为表达式 `std::move(jormungandr1)` 是一个可以被移动的右值。是的，你没读错，即使调用了移动构造函数，这种形式始终被称为拷贝初始化（copy-initialization）。并没有所谓的移动初始化。\n\
    \n让我们把注意力转向 Jormungandr 移动构造函数的实现上。你可能已经发现了这个 bug：我们忘记了像这样用 `std::move` 封装 `other`\
    \ 了：\n\nexamples/which-constructors/which-constructors.cpp\n\n```\nJormungandr(Jormungandr\
    \ &&other) :\nMonster(std::move(other))\n```\n\n参数 `other` 是一个值引用（value reference）。但我们传递给\
    \ Monster 构造函数的表达式 `other` 是一个左值！由于表达式 `other` 是左值，我们无法使用移动构造函数，重载解析选择了拷贝构造函数。然而，在将其封装在\
