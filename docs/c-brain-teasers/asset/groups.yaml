    \ here, but what if it did? What if, for instance, initializing the logger sets\
    \ some global logger instance that we use while reading the configuration? We\
    \ can rely on the two functions being called in the order listed in the program?\
    \ Unfortunately, we can’t since the evaluation order of function argument expressions\
    \ is unspecified. This is not only theoretical; when I tested this on Linux, GCC\
    \ went right-to-left and Clang left-to-right. You can see an online demo at Compiler\
    \ Explorer.[16]\n\nAll is not chaos, however; we do have a few guarantees:\n\n\
    - 1. Initialization of parameters, including all associated side effects, is guaranteed\
    \ to have finished before the function starts executing. This guarantees that\
    \ initializeLogger and readConfiguration have finished executing before startProgram\
    \ executing, and we don’t, for instance, risk the output Initializing logger being\
    \ interleaved with Starting program. It sounds obvious, but hey, this is C++,\
    \ so it's good to check.\n\n- 2. Initialization of one parameter, including all\
    \ associated side effects, is guaranteed to have finished the initialization of\
    \ another parameter starts. This guarantees that either initializeLogger happens\
    \ entirely readConfiguration or vice versa.\n\n- 3. There is no undefined behavior\
    \ here; it's just that the argument expressions can be evaluated in either order.\n\
    \nWe know that initializeLogger and readConfiguration happen before startProgram,\
    \ just not in order. Furthermore, we're not even guaranteed that they happen in\
    \ the same order each time we run the program, even using the same compiler and\
    \ the same computer! It's unlikely that a compiler would generate code where this\
    \ is non-deterministic, but it would be okay according to the standard. It's also\
    \ possible for a compiler to change the ordering in a new version of the compiler\
    \ if the implementer decides, for instance, right-to-left is now more efficient\
    \ than left-to-right.\n\nWhat can we do about this then? If the ordering is actually\
