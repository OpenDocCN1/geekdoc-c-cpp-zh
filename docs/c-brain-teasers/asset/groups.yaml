    \ Linux 上测试这一点时，GCC 是从右到左执行的，而 Clang 是从左到右的。你可以在 Compiler Explorer 上查看在线演示。[16]\n\
    \n然而，一切并不是混乱的；我们确实拥有一些保障：\n\n- 1. 参数的初始化（包括所有相关的副作用）被保证在函数开始执行之前已经完成。这保证了 `initializeLogger`\
