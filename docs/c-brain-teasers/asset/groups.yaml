    rvalues are expressions you can move from, bind rvalue references to, and so on.
    In fact, there are two types of rvalues—xvalues and prvalues:


    +   - An xvalue (or "Expiring lvalue") is what you get when you call std::move
    on an lvalue. For instance, in Puzzle 8, Will It Move?, the expression objectWithConstMember
    is an lvalue. It evaluates to an actual object somewhere, where we can take the
    address of, and so on. When we do std::move(objectWithConstMember), we now have
    an xvalue. This expression still evaluates to an actual object, but we''re also
    allowed to treat it as an rvalue and move from it.

    - A prvalue, on the other hand, is a "pure" rvalue. It''s an expression that initializes
    a new object, as opposed to just turning an existing object into an rvalue.


    In C++11, prvalues were unnamed temporary objects, and the compiler was allowed
    to elide, or omit, copies of them. The form of copy elision where the unnamed
    temporary was the operand of a return statement, like in this puzzle, was called
    unnamed return value optimization (URVO)—unnamed because it applied when the function
    returned an unnamed temporary. In C++11, avoiding copies in these situations became
    mandatory. But than making URVO mandatory, the language was changed in such a
    way that there''s never even an object to optimize away the copy of in the first
    place! Prvalues no longer unnamed temporaries; they merely represent the idea
    of an object, which will only materialize later.'
