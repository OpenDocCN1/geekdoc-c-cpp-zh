    The two function templates byValue and byReference take their parameters by value
    and by reference, respectively. We then call these two function templates with
    a non-const and a const int as arguments. In which cases is T deduced as const?


    Before we start digging into the deduction rules, let''s clarify two concepts
    that can be easily mixed up. The T in template <typename T> is called the template
    parameter. The goal of template argument deduction is to find T. On the other
    hand, the T and T& in the function signatures byValue(T t) and byReference(T &)
    are called the template parameter types. These are the actual parameter types
    to the function templates and are what we use for deduction.


    Let''s refer to these template parameter types as P to distinguish them from the
    template parameters T. Here are three examples:


    | Template parameter | Template parameter type P |

    |---|---||

    | template <typename T> | | |

    | void byValue(T t) | T | T |

    | template <typename T> | | |

    | void byReference(T & t) | T | T & |'
