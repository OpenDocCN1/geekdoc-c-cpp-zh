    | 局部自动 (Local automatic) | 每次进入块时 | 定义它所在的块 |\n\n控制具有静态存储生存期的非局部变量的使用比较困难，而且初始化它们是非常廉价的，因此\
    \ C++ 会自动为你完成。\n\n然而，这到底有多廉价呢？让我们以 x86 架构为例。我说你只需要支付一次初始化的代价，但实际上你根本不需要支付这个代价！当你的程序启动时，它为我们的全局数据分配内存。在\
    \ Linux 和 Windows 等系统上，当我们从操作系统获取新的物理内存时，它会被填充为零，以防止你读取上一个使用过相同内存页的程序的内存。编译器/链接器可以将未初始化的全局变量分组在一个名为\
    \ `.bss` 的节中。当程序启动并为 `.bss` 节分配内存时，它已经被填充为零。因此，这些变量是以零成本进行零初始化的！\n\n# 注意\n\n`static`\
    \ 关键字在 C++ 中有很多种用法。`id` 是否具有 `static` 饰符并不影响它的静态存储生存期。对于全局变量，写 `static int id;`\
    \ 而不是简单的 `int id;` 只是赋予了它内部链接；也就是说，它无法从其他编译单元（其他 .cpp 文件）链接。但无论如何，它都具有静态存储生存期。\n\
    \n![](img/6a77d9759ca887223ee3bd2eee1e4419_44_0.png)\n\n# 进阅读\n\n零初始化 (Zero-Initialization)\n\
