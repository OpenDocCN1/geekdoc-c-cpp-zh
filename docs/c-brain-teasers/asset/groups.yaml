    \ Programming、Pragmatic Bookshelf 以及链接设备均为 The Pragmatic Programmers, LLC 的商标。\n\
    \n在编写本书时已采取了所有预防措施。然而，出版商对错误或遗漏，或因使用其中包含的信息（包括程序列表）可能导致的损害不承担责任。\n\n# 关于 Pragmatic\
    \ Bookshelf\n\nPragmatic Bookshelf 是一家出版公司。我们在这里是因为我们想要改善开发者的生活。我们通过创建由程序员编写的及时、实用的书籍来实现这一点。\n\
    \n我们的实践、工作坊和其他产品可以帮助你和你的团队创建更好的软件并增加乐趣。欲了解更多信息以及最新的 Pragmatic 实践，请访问我们的网站 http://prprog.com。\n\
    \n我们的电子书不包含任何数字限制（DRM），并且始终是无 DRM 的。我们开创了 Beta Concept，即你可以在书籍编写期间进行购买并阅读，并向作者提供反馈以制作更好的电子书。为所有购买者的免费资源包括源代码下载（如适用）、错表和讨论论坛，所有内容可在书籍主页\
    \ prprog.com 获取。我们在这里是为了让你的生活变得更轻松。\n\n# 新书公告\n\n想要跟进我们的最新书籍和公告以及偶尔的特别优惠吗？只需在\
    \ prprog.com 创建账户（只需一个电子邮件地址和密码）并勾选选择框接收新闻邮件。你还可以在 Twitter 上关注我们 @prprog。\n\n\
    # 关于电子书格式\n\n如果你直接从 prprog.com 购买，你将获得所有格式的电子书。你可以通过 Dropbox 在所有设备（包括 iPhone/iPad、Android、笔记本电脑等）之间同步你的电子书。在版本的有效期内，你可以获得免费更新。当然，你可以在需要时取出并重新下载书籍。从\
    \ Amazon Kindle 购买的电子书受 Amazon 政策限制。Amazon 文件格式的限制会导致电子书在不同设备上的显示不同。更多信息，请参见我们在\
    \ pr..com/#about-ebooks 的 FAQ。欲了解更多关于本书的信息并访问免费资源，请前往书籍首页 https://prprog.com/book/akrain。\n\
    \n感谢你的持续支持，\n\nThe Pragmatic Bookshelf\n\n本书的团队包括：Dave Thomas（出版）、Janet Furlow（COO）、Susannah\
    \ Davidson（执行编辑）、Sandra Williams（开发编辑）、L. Sakhi MacMillan（校对）、Potomac Indexing,\
    \ LLC（索引）、Gilson Graphics（排版）\n\n如客户支持，请联系 support@pragmatic.com。\n\n如国际版权，请联系\
    \ rights@pragmatic.com。\n\n# 目录\n\n1. Olive Maudal 序言\n2. 致谢\n3. 前言\n   1. 如何使用本书\n\
    \   2. 未定义行为\n   3. 未指定和实现定义的行为\n4. 玩转代码\n\n## 第一部分 C++ 脑筋急转弯\n\n谜题 1 多少度？\n\n\
    谜题 2 字符串理论\n\n谜题 3 攻入地球！\n\n谜题 4 全球化\n\n谜题 5 破坏性关系\n\n谜题 6 谁先来？\n\n谜题 7 好事终有终结\n\
    \n谜题 8 它会移动吗？\n\n9. 计数拷贝\n\n10. 一个奇怪的赋值\n\n11. 死亡时间是什么时候？\n\n12. 一个错误的开始\n\n13.\
    \ 一场永恒的斗争\n\n14. 亚里士多德的部分之和\n\n15. 从未来回来\n\n16. 一个重载容器\n\n17. 一个强项\n\n18. 搬迁\n\
    \n19. 一小笔总和\n\n20. 移动中的怪物\n\n21. 评估一些角色的大小\n\n22. 幽灵飞船\n\n23. 有了良好的开始\n\n24. 一种特殊的字符串理论\n\
    \n25. 弱类型，强力困惑\n\n# 《C++ 脑筋急转弯》的早期好评\n\n如果你是 C++ 爱好者或专业 C++ 开发者——最好两者兼顾——这本书是为你准备的。二十五个谜题用易懂的\
    \ C++ 解释了这种语言有时令人惊讶的行为，以及你可能想要清楚了解的以避开潜在陷阱和失望的知识。\n\n- Daniela Engert\nISO C++\
    \ 委员会成员兼主旨演讲者\n\n缺乏经验的程序员将以轻松的方式，学习 C++ 编程语言中的许多陷阱以及如何避免它们。对于要规避的事物已有直觉的老手，将非常详细地学习该语言是如何以及运行的，以及为什么是这样运行。\n\
    \n- Björn Fahller\n国际 C++ 会议演讲者\n\n经验丰富的程序员将以轻松的方式学习 C++ 编程语言中的许多陷阱以及如何避免它们。对于要规避的事物已有直觉的老手，将非常详细地学习该语言是如何以及运行的，以及为什么是这样运行。\n\
    \n- Tina Ulrich\n这是一个对于想要测试自己 C++ 知识的人来说有趣且引入胜的书。谜题很有趣，解释也易于理解。\n\n# Olive Maudal\
    \ 序言\n\n我第一次在奥斯洛的 C++ 聚会上遇到 Anders Schau Knatten。从那时起，我们就一直是朋友了，当我们在各种会议上见面时。Anders\
    \ 曾在 ACCU、TechTown、CppCon、C++ on Sea 等 C++ 会议演讲。当我参加他的演讲时，我总能学到新东西。Anders 可以花几个小时讲解整数是如何行为的，或者在\
    \ main() 调用之前发生的所有事情，或者如何有效地使用调试器。他拥有一种迷人的能力去观察、适应、重塑，然后将其推向新的水平。这正是他在参加了我那些著名的\
    \ C++ Quiz 会话后所做的。Anders 很快创建了非常棒 cppquiz.org（去试试吧！）。现在，他在会议上运行自己的改进版 C++ Quiz。通过这本书，Anders\
    \ 将他自己的概念推得更远。\n\n我热爱书，我热爱 C++，我热爱谜题。《C++ 脑筋急转弯》将这三者结合在了一起。我已经使用和学习 C++ 30 年了，但我确定每次读这本书仍能学到新东西。如果你深投入\
    \ C++，你也会想读这本书。这本书是深入理解这种强大且迷人的语言的快速通道。书中包含了精心挑选的二十五个谜题，将挑战你对语言的现有理解。当你自己尝试解决一个谜题后，Anders\
    \ 将给你深入且坚实的解释，说明为什么这个谜题很有趣，以及你如何学习这些知识。\n\n"
