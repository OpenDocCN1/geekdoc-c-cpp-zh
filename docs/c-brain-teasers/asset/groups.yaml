    \n# 扩展阅读\n\n- 构造函数与成员初始化列表 (Constructors and Member Initializer Lists)\n- https://en.cppreference.com/w/cpp/language/constructor\n\
    \n# 谜题 2\n字符串理论\n\nstring-theory.cpp\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\n\nvoid serialize(const void*) { std::cout << \"const void*\"; }\n\n\
    void serialize(const std::string&) { std::cout << \"const string&\"; }\n\nint\
    \ main()\n{\n    serialize(\"hello world\");\n}\n```\n\n猜测输出\n\n> 在移动到下一页之前，尝试猜猜输出是什么。\n\
    \n程序显示如下输出：\n\n```\nconst void*\n```\n\n# 讨论\n\n为什么向 `serialize` 传递字符串会导致调用接收\
    \ `void` 指针的重载，而不是接收 `string` 的重载？\n\n当我们调用带有多个重载的函数时，编译器会使用称为“重载解析”（overload\
    \ resolution）的过程来确定哪一个最匹配。编译器通过尝试将每个函数参数转换为每个重载对应的参数类型来实现此点。某些转换优于其他转换，而如果参数已经是正确类型，则是最佳转换。\n\
    \n所有所有参数都能成功转换的重载都会被添加到可行函数集中。然后，编译器需要从集合集中选择哪一个重载。如果某个重载对至少一个参数有更好的转换，且对其他任何参数都没有更差的转换，则该重载被视为最佳可行函数，并被重载解析选中。如果没有哪个重载优于所有其他重载，则该调用是错误的并会导致编译失败。\n\
    \n看看这个例子：\n\n```cpp\nserialize(int, int); // 1\n```\n\n```cpp\nserialize(float,\
    \ int); // 2\n```\n\n给定这些重载，假设你如下调用 `serialize`：\n\n```cpp\nserialize(1, 2);\n\
    ```\n\n`serialize` 的两个重载都是可行的。但第一个重载对第一个参数有更好的转换（`int -> int` 优于 `int -> float`），并且在第二个参数上没有更差的转换（两个重载的\
    \ `int -> int` 是一样的），因此它被重载解析选取为最佳可行函数。\n\n这个谜题比上面的例子简单一点，因为 `serialize` 的两个重载都只有一个参数。第一个接收\
    \ `const void *`，第二个接收 `const std::string;`。对于每个重载，转换情况是怎样的？\n\n`std::string`\
    \ 是标准库中的一个类。它通常会在堆上分配内存（除非字符串非常小），并允许字符串在运行时增长或被修改。\n\n然而，字符串 `\"hello world\"\
    ` 并不是 `std::string`，而是简单的字符串字面量。字符串字面量是普通的 C 风格字符数组，由链接器固化到二进制文件中，且在运行时无法修改。字符串字面量的类型为“n\
    \ 个 const char 的数组”。\"hello world\" 有 11 个字符加上一个终止符 `\\0`，所以它的类型是“12 个 const char\
    \ 的数组”。\n\n由于 `\"hello world\"` 既不是 `std::string` 也不是 `void*`，而是 12 个 const char\
    \ 的数组，对于每个重载的转换如何？\n\n如果存在从参数的隐式转换，则加入可行函数集。否则，该重载将被忽略。\n\n让我们查看第一个重载，看看“12 个\
    \ const char 的数组”是否可以隐式转换为 `void*`。首先发生的是数组转换为指针。`Array of T` 可以将我们的“12 个 const\
    \ char 的数组”转换为 `const char*`。\n\n接下来，任何 `pointer to T`（其中 cv 指 `const` 或 `volatile`）都可以转换为\
    \ `pointer to void`。所以我们的 `const char*` 变成了 `const void*`，这正是第一个重载所预期的。\n\n注意，在这个转换过程中没有涉及构造函数或转换函数。这意味着它是标准转换序列而不是用户定义的转换序列。这很重要。\n\
    \n让我们现在查看第二个重载，看看“12 个 const char 的数组”是否可以转换为 `const std::string` 引用。`std::string`\
    \ 有一个构造函数 `std::string(const char*)`，我们可以使用。首先，我们将“12 个 const char 的数组”转换为 `const\
    \ char*`，如上面所示。然后将其传递给 `std::string` 构造函数并返回一个包含字符串字面量拷贝的 `std::string`。`const\
    \ std::string&` 参数可以直接绑定到 `std::string` 参数。\n\n注意我们使用了构造函数。这意味着这是一个用户定义的转换序列而不是标准转换序列。无论\
    \ `std::string` 是标准库类型，它仍然被视为用户定义的。规则对于你和标准库都是相同的。\n\n现在，编译器找到了从我们的“12 个 const\
    \ char 的数组”到每个重载参数类型的有效转换，并必须确定哪种序列是最好的：\n\n`serialize(const void*)` 的转换序列：\n\
    `const char[12] ⟶ const char * ⟶ const void *` 标准转换，未创建新对象\n\n`serialize(const\
    \ std::string&)` 的转换序列：\n`const char[12] ⟶ const char * ⟶ std::string` 用户定义，创建了新的\
    \ std::string 对象！\n\n我们只需要标准转换序列（顶部）即可调用 `const void*` 重载。要调用 `std::string` 重载，我们需要用户定义的序列（底部），这涉及到创建一个新的\
    \ `std::string` 对象。标准转换序列始终优于用户定义的转换序列，因此第一个重载被调用，并打印 `const void*`。\n\n"
