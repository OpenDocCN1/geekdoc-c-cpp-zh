    \ (including program listings) contained.\n\n# About the Pragmatic Bookshelf\n\
    \nThe Pragmatic Bookshelf is an publishing company. We're here because we want\
    \ to improve the lives of developers. We do this by creating timely, practical\
    \ titles, written by programmers.\n\nOur practices, workshops, and other products\
    \ can help you and your team create better software and have more fun. For more\
    \ information, as well as the latest Pragmatic practices, please visit us at http://prprog.com.\n\
    \nOur ebooks do not contain any Digital Restrictions, and have always been DRM-free.\
    \ We pioneered the beta concept, where you can purchase and read a book while\
    \ it is still written, and provide feedback to the author to make a better ebook.\
    \ Free resources for all purchasers include source code downloads (if applicable),\
    \ errata and discussion forums, all available on the book's home page prprog.com.\
    \ We're here to make your life easier.\n\n# New Book Announcements\n\nWant to\
    \ keep up with our latest titles and announcements, and occasional special offers?\
    \ Just create an account at prprog.com (an email address and password is all it\
    \ takes) and select the checkbox to receive newsletters. You can also follow us\
    \ on twitter at @prprog.\n\n# About Ebook Formats\n\nIf you buy directly from\
    \ prprog.com, you get ebooks in all formats for one price. You can sync your ebooks\
    \ amongst all devices (including iPhone/iPad, Android, laptops, etc.) via Dropbox.\
    \ You get free updates for the life of the edition. And, of course, you can take\
    \ back and re-download your books when needed. Ebooks bought from the Amazon Kindle\
    \ are subject to Amazon's policies. Limitations in Amazon's file format may cause\
    \ ebooks to display differently on different devices. For more information, please\
    \ see our FAQ at prprog.com/#about-ebooks. To learn more about this book and access\
    \ the free resources, go to https://prprog.com/book/akrain, the book's homepage.\n\
    \nThanks for your continued support,\n\nThe Pragmatic Bookshelf\n\nThe team that\
    \ produced this book includes: Dave Thomas (Publisher), Janet Furlow (COO), Susannah\
    \ Davidson (Executive Editor), Sandra Williams (Development Editor), L. Sakhi\
    \ MacMillan (Copy Editor), Potomac Indexing, LLC (Indexing), Gilson Graphics (Layout)\n\
    \nFor customer support, please contact support@pragmatic.com.\n\nFor international\
    \ rights, please contact rights@pragmatic.com.\n\n# Table of Contents\n\n1. Foreword\
    \ by Olive Maudal\n2. Acknowledgments\n3. Preface\n   1. How to Use This Book\n\
    \   2. Undefined Behavior\n   3. Unspecified and Implementation-Defined Behavior\n\
    4. Playing Around with the Code\n\n## Part I. C++ Brain Teasers\n\nPuzzle 1. How\
    \ Many Degrees?\n\nPuzzle 2. String Theory\n\nPuzzle 3. Hack the Planet!\n\nPuzzle\
    \ 4. Going Global\n\nPuzzle 5. A Destructive Relationship\n\nPuzzle 6. Who’s Up\
    \ First?\n\nPuzzle 7. All Good Things Must Come to an End\n\nPuzzle 8. Will It\
    \ Move?\n\n9. Counting Copies\n\n10. A Strange Assignment\n\n11. What’s the Time\
    \ of Death?\n\n12. A False Start\n\n13. A Constant Struggle\n\n14. Aristotle’s\
    \ Sum of Parts\n\n15. Back from the Future\n\n16. An Overloaded Container\n\n\
    17. A Strong Point\n\n18. Moving Out\n\n19. A Little Sum Thing\n\n20. Monsters\
    \ on the Move\n\n21. Sizing Up Some Characters\n\n22. The Phantom Spaceship\n\n\
    23. Off to a Good Start\n\n24. A Specialized String Theory\n\n25. Weakly Typed,\
    \ Strongly Puzzling\n\n# Early Praise for C++ Brain Teasers\n\nIf you are either\
    \ a C++ enthusiast or a professional C++ developer—hopefully both—this book is\
    \ for you. Twenty-five puzzles explain in easy C++ the sometimes-surprising behavior\
    \ of the language and what you might want to know clear of potential pitfalls\
    \ and disappointments.\n\n- Daniela Engert\nISO C++ Committee Member and Keynote\
    \ Speaker\n\nThe inexperienced programmer will learn, in a lighthearted way, of\
    \ many pitfalls in the C++ programming language and how to avoid them. The seasoned\
    \ veteran, who has developed an intuition for what to avoid, will learn in great\
    \ detail how and why the language works the way it does.\n\n- Björn Fahller\n\
    International C++ Conference Speaker\n\nThis is a fun and engaging puzzle book\
    \ for everyone who wants to test their C++ knowledge. The puzzles are fun to solve,\
    \ and the explanations are easy to follow.\n\n- Tina Ulrich\n\n# Foreword by Olive\
    \ Maudal\n\nI first met Anders Schau Knatten at local C++ meetups here in Oslo\
    \ way back. Since then, we have been friends hanging out when we meet at conferences.\
    \ Anders has given presentations at C++ focused conferences such as ACCU, NDC\
    \ TechTown, CppCon, C++ on Sea, and Meeting C++, to mention a few. When I attend\
    \ one of his talks, I always learn something new. Anders can speak for hours how\
    \ integers really behave, or about all the stuff that happens before main() is\
    \ invoked, or how to use debuggers effectively. He also has the fascinating ability\
    \ to observe something, adapt it, reshape it, and then take it to the next level.\
    \ This was exactly what he did after attending a couple of my infamous C++ Pub\
    \ Quiz sessions. Anders soon went off to create the wonderful site cppquiz.org\
    \ (try it!). And now he is running his own much-improved version of C++ Pub Quiz\
    \ sessions at conferences. With this book, Anders is taking his own concept even\
    \ further.\n\nI love books, I love C++, and I love puzzles. C++ Brain Teasers\
    \ brings three together. I have been using and studying C++ for more 30 years\
    \ now, but I'm sure I will read this book again and still learn something new\
    \ each time. If you are deeply invested in C++, you'll want to read it too. The\
    \ book serves as a fast-track into a deeper understanding of this powerful and\
    \ fascinating language. The book contains 25 carefully selected puzzles that will\
    \ challenge your current understanding of the language. Once you have attempted\
    \ to solve a puzzle yourself, Anders will give you a deep and solid explanation\
    \ as to why the puzzle is interesting and how you can learn about these things.\n\
    \nYou can write beautiful programs in C++, but it is of course possible to mess\
    \ it up completely. It is important to understand that C++ is what it is because\
    \ it evolved from BCPL, C, Simula 67, and Algol 68. C++ is what it is because\
    \ the language was adopted fast and already had millions of active users during\
    \ the early formation years. C++ is what it is because it trusts the programmer\
    \ and focuses on solving real problems. Yes, C++ is complex, perhaps too complex,\
    \ but it is indeed the go-to language (pun intended!) for many domains, such as\
    \ operating systems, embedded systems, high-performance computing, performance-critical\
    \ applications, video games, and space probes. Indeed, here is a very insightful\
    \ quote by Bjarne Stroustrup (the creator of C++):\n\n> There are only two kinds\
    \ of languages: the ones people complain about and the ones nobody uses.\n\nWishing\
    \ you all the best on your journey toward a deeper understanding of C++. Anders\
    \ will be your guide this time. Enjoy the ride!\n\nOlive Maudal\n\nInternational\
    \ C and C++ Speaker, Trainer, and Conference Organizer\n\nJune, 2024\n"
