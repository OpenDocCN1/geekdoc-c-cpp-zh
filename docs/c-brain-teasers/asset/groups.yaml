    # Foreword by Olve Maudal


    I first met Anders Schau Knatten at local C++ meetups here in Oslo way back. Since
    then, we have been friends hanging out when we meet at conferences. Anders has
    given presentations at C++ focused conferences such as ACCU, NDC TechTown, CppCon,
    C++ on Sea, and Meeting C++, to mention a few. When I attend one of his talks,
    I always learn something new. Anders can speak for hours how integers really behave,
    or about all the stuff that happens before main() is invoked, or how to use debuggers
    effectively. He also has the fascinating ability to observe something, adapt it,
    reshape it, and then take it to the next level. This was exactly what he did after
    attending a couple of my infamous C++ Pub Quiz sessions. Anders soon went off
    to create the wonderful site cppquiz.org (try it!). And now he is running his
    own much-improved version of C++ Pub Quiz sessions at conferences. With this book,
    Anders is taking his own concept even further.


    I love books, I love C++, and I love puzzles. C++ Brain Teasers brings three together.
    I have been using and studying C++ for more than 30 years now, but I''m sure I
    will read this book again and still learn something new each time. If you are
    deeply invested in C++, you''ll want to read it too. The book serves as a fast-track
    into a deeper understanding of this extremely powerful and fascinating programming
    language. The book'
  - '[PAGE 12]


    contains 25 carefully selected C++ puzzles that will challenge your current understanding
    of the language. Once you have attempted to solve a puzzle yourself, Anders will
    give you a deep and solid explanation as to why the puzzle is interesting and
    how you can learn about these things.


    You can write beautiful programs in C++, but it is of course possible to mess
    it up completely. It is important to understand that C++ is what it is because
    it evolved from BCPL, C, Simula 67, and Algol 68. C++ is what it is because the
    language was adopted fast and already had millions of active users during the
    early formation years. C++ is what it is because it trusts the programmer and
    focuses on solving real problems. Yes, C++ is complex, perhaps too complex, but
    it is indeed the go-to language (pun intended!) for many domains, such as operating
    systems, embedded systems, high-performance computing, performance-critical applications,
    video games, and space probes. Indeed, here is a very insightful quote by Bjarne
    Stroustrup (the creator of C++):


    > There are only two kinds of languages: the ones people complain about and the
    ones nobody uses.


    Wishing you all the best on your journey toward a deeper understanding of C++.
    Anders will be your guide this time. Enjoy the ride!


    Olve Maudal


    International C and C++ Speaker, Trainer, and Conference Organizer


