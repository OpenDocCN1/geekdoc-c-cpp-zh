  - '[PAGE 123]


    3


    ![](img/6a77d9759ca887223ee3bd2eee1e4419_123_0.png)


    # # Discussion


    The Player struct has a member points_ to keep track of the player''s points.
    Instead of using a fundamental type like int for this, we use a custom type Points.
    This technique is often called "strong typing" and can make the code easier to
    read and avoid bugs. For instance, given a function do_something(int player_id,
    int points, int lives), it can be easy to slip up and pass player_id, points instead,
    causing the number of lives to be used for points and vice versa. When you use
    separate types for these values, a mistake like this would cause the program to
    fail to compile than create a bug.


    The question in the puzzle is whether we''re allowed to construct a Player object
    directly from an int, like we do in the expression Player(3), or whether we need
    to manually create an object of the strong type Points to pass to the Player constructor.


    For Player player(3) to work, we need an implicit conversion from int. And only
    constructors not marked explicit, known as converting constructors, can participate
    in implicit conversions. Player''s constructor is marked explicit and is thus
    not a converting constructor, so how does this conversion work?


    The form Player player(3) is an example of direct-initialization(so is Player{3}
    but not, for example, Player = 3). I like to think that we''re directly calling
    Player''s constructor. In direct-initialization, overload resolution is used to
    pick the best constructor. When we''re de-initializing a Player from an int, overload
    resolution tries to find an implicit conversion sequence from each of Player''s
    constructors. Player has only one constructor, taking a Points, so we need an
    implicit conversion from int to Points. Points'' constructor isn''t explicit,
    so it''s a converting constructor and can be used in the implicit conversion sequence.
    3 is implicitly converted to Points, and this Points object is passed to Player''s
    constructor.'
  - '[PAGE 124]


    Player’s constructor itself is not involved in the implicit conversion; we’re
    calling it directly, remember. So it makes no difference whether or not it’s explicit.


    On the other hand, if it was Points’ constructor that was explicit, it would no
    longer be a converting constructor and would not be usable in the implicit conversion
    sequence. We’d no longer be able to implicitly convert the int 3 to Points, and
    the program would not compile.


    Giving your strong types explicit constructors makes the code slightly more verbose
    but also robust. Returning to the do_something example, you would now have to
    write do_something(PlayerId{42}, Points{3}, Lives{1}) for the program to compile,
    whereas with converting constructors, you could still slip up and do_something(42,
    1, 3) and the program would still compile. I also find the former more readable.


    # Copy-Initialization vs. Direct-Initialization


    What would happen if we instead wrote this:


    Player player = 3


    This form is called copy-initialization and differs a bit from direct-initialization.
    Now we’re no longer calling the Player constructor directly; we’re instead trying
    to implicitly convert an int to Player. An implicit conversion sequence can only
    involve one user-defined conversion, but we would need one from int to Player
    and then a second from Player to Points. So Player player = 3 would never compile,
    regardless of whether any of the constructors are explicit.'
  - '[PAGE 125]


    # Recommendations


    +   * Mark single argument constructors explicit to avoid surprising implicit
    conversions.


    +   * Use strong types instead of fundamental types to avoid bugs.


    +   * Consider using a strong type library, such as Björn Fhell''s strong_type.[13]
    to reduce boilerplate code when creating strong types.


    # Further Reading


    Direct-Initialization


    https://en.cppreference.com/w/cpp/language/direct_initialization


    Copy-Initialization


    https://en.cppreference.com/w/cpp/language/copy_initialization


