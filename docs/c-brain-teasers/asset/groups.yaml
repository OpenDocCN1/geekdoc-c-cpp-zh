    \ `bool`。当指针转换为 `bool` 时，如果是空指针则转换为 `false`，否则转换为 `true`。由于此例中的指针非空（指向我们的字符串字面量），它转换为\
    \ `true`。最后，`!` 运算符取反了它，所以我们得到了 `false`。有人可能会认为整个转换序列实际上并不合理，我对此同意，但至少我们可以理解每一步是如何工作的，以及它们是如何组合得到这个结果的。\n\
    \n接下来是另一个 `!`，它直接取反了我们的 `bool false`，给我们 `bool true`。\n\n最后，是元运算符 `+`。元运算符 `+`\
    \ 的操作数经过整数提升，对于 `bool` 来说会将 `false` 转换为 0，将 `true` 转换为 1。该运算符本身什么都没做；结果与其操作数（提升后）相同。因此，我们的\
