    # Discussion


    The class Job has two members, consumer_ and resource_, declared in that order.
    However, {}, the constructor''s member initializer list (the : resource_{resource_}
    part), are initialized in the opposite order. In which order are they actually
    initialized?


    C++ always initializes members in the order they are declared in the constructor''s
    member initializer list. This ensures that members are always initialized in a
    deterministic order, even if different constructors happen to list them in different
    orders in their member initializer lists. So if even resource seems to be initialized
    first in the constructor, consumer_ is actually initialized first.


    Having members initialized in a deterministic order is essential if one member
    depends on the other. For instance, in this example the consumer depends on the
    resource in its constructor. But since consumer_ is actually initialized before
    resource_, the Consumer constructor gets passed a Resource that hasn''t been constructed
    yet. If we tried to use it for anything, we would have undefined behavior.'
  - '[PAGE 54]


    The reverse is also true. Members are destroyed in the opposite order of their
    declarations joins the class. Destruction order can be as important as construction
    order since one member can depend on another in its destructor, or there can be
    other lifetime dependencies. Imagine, for instance, the Consumer in this puzzle
    runs a thread that uses Resource, and that Consumer joins the thread in its destructor.
    In the current version of the code, resource_ would be destroyed while the thread
    is still running, and we would risk using a destroyed resource_, resulting in
    undefined behavior. If consumer_ had been declared after resource_, however, the
    thread in consumer_ would have stopped before resource_ was destroyed.


    Listing the members in the wrong order in the member initializer list can be confusing
    to the reader, so I recommend always using the same order in the member initializer
    list and the class declaration. GCC, Clang, and MSVC have all warnings (-Wreorder,
    -Wrector, and C5038, respectively) that warn you if you don''t use a consistent
    order. These warnings are enabled if you compile with -Wall /Wall, which I always
    recommend. Different compilers often have different warnings, so compiling with
    several can be a good idea. That can help you avoid accidentally using non-standard,
    platform-specific variations of C++, which would make it harder to port your project
    to other platforms later.


