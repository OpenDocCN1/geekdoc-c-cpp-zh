    \ `std::initializer_list`，为什么它选择了 `std::initializer_list` 构造函数呢？重载解析对于列表初始化有一个特殊情况，分为两个阶段进行：\n\
    \n- 首先，它对所有接收 `std::initializer_list` 的构造函数进行重载解析，将大括号初始化列表视为单个参数。\n- 只有在第一阶段失败时，会对其他构造函数进行重载解析，将大括号初始化列表的元素视为独立的参数。\n\
    \n在 `Container container{1,2}` 的情况下，重载解析首先尝试 `std::initializer_list<float>` 构造函数。`int`\
    \ 可以隐式转换为 `float`，同样，`int` 的初始化器可以用于创建 `std::initializer_list<float>`。选择了 `std::initializer_list<float>`\
    \ 构造函数，另一个构造函数从未被考虑过。\n\n现在来看加分题：如果我们移除 `std::initializer_list<float>` 构造函数会发生什么？对于\
    \ `Container container1(1,2)`，没有变化，因为这不是列表初始化。对于 `Container container2{1,2}`，重载解析在第一阶段没有找到任何接收\
    \ `std::initializer_list` 的构造函数，并转向其他构造函数。两种情况下都使用了接收两个 `int` 的构造函数，程序仍然编译。\n\n\
    # std::vector\n\n![](img/6a77d9759ca887223ee3bd2eee1e4419_121_0.png)\n\n如果你曾经疑惑为什么\
    \ `std::vector<int> v(1,2)` 给你一个包含单个元素 `2` 的 vector，而 `std::vector<int> v{1,2}`\
    \ 给你一个包含两个元素 `1` 和 `2` 的 vector，现在你知道为什么了。\n\n- 第一种情况不是列表初始化，它选择了接收 `size_type\
    \ count` 和 `T value` 的构造函数。\n- 第二种情况是列表初始化，它选择了接收 `std::initializer_list<T>` 的构造函数。\n\
    \n# 进一步阅读\n\n列表初始化\nhttps://en.cppreference.com/w/cpp/language/list_initialization\n\
    \nstd::initializer_list\nhttps://en.cppreference.com/w/cpp/utility/initializer_list\n\
    \nstd::vector Constructors\nhttps://en.cppreference.com/w/cpp/container/vector/vector\n\
