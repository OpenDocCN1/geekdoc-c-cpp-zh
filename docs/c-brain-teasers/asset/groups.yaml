    # Are You Still There?


    I omitted many details above, especially the exact rules resulting in these particular
    conversion sequences, and still, the explanation got quite long. If you followed
    to the end, you got the point. If you dropped off at some point though, no worries,
    as you still got the point! The point being that reasoning about implicit conversions
    between integers is complicated and best avoided in production code.


    # What Can We Do?


    Unfortunately, none of the major compilers warn about this, even with -Wall -Wextra
    for GCC and Clang, and /Wall for MSVC. Some compilers, such as GCC and Clang,
    have additional options like -Wsign-conversion, which are not included in -Wall
    or -Wextra and must be enabled individually. Unfortunately, even after enabling
    them, you get no warnings for this particular puzzle. (You would if the accumulate
    function template was defined in your own code rather than in the standard library,
    though.)


    Clang-tidy is also unable to warn about this, and undefined behavior sanitizer
    would only trigger if undefined behavior actually happened during the execution
    of the program, which is not the case.'
