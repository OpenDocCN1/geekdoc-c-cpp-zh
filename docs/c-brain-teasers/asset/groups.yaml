    \ virtual getType function to fill in the details of the specific derived type.\n\
    \nThis works perfectly for the render function, but something goes wrong in the\
    \ constructor; it prints Created a GameObject both when creating a GameObject\
    \ and when creating a Spaceship. What exactly is going on, and could this be undefined\
    \ behavior?\n\nIn main, when initializing an object of type Spaceship, the GameObject\
    \ base class part of the object is initialized first, and then the Spaceship part\
    \ of the object is initialized. During initialization of the GameObject part,\
    \ there's no Spaceship part yet. As far as C++ is concerned, this is a GameObject\
    \ being created.\n\nWhat happens when we call the virtual getType() member function\
    \ in the Spaceship constructor, which would normally call down to a Spaceship\
    \ which doesn't even exist yet? Undefined behavior? Luckily, this behavior is\
    \ well defined. When a virtual function is called from a constructor or destructor,\
    \ the function called is the one in that particular class and not one overriding\
    \ it a more-derived class. So in the GameObject constructor, GameObject::getType()\
    \ is called both when creating a GameObject and when creating a Spaceship. Created\
    \ a GameObject is displayed in both cases.\n\nIn render, however, we're dealing\
    \ with fully initialized objects, and the virtual function works as intended.\
    \ When we render the GameObject, Rendered GameObject is printed, and when we render\
    \ the Spaceship, Rendered a Spaceship is printed.\n\nSo how do we fix this? Before\
    \ we look into ways of making the actual type being instantiated available to\
    \ the GameObject constructor, it's worth asking whether it should even be possible\
    \ to instantiate GameObject objects on their own. Does it make sense in the game\
    \ to be able to instantiate \"abstract\" game object? Or does it only make sense\
    \ to instantiate concrete things like, a spaceship, an asteroid, or an astronaut?\
    \ If we make GameObject::getType() a pure virtual function rather than giving\
    \ a definition, GameObject is now an abstract class, which cannot be instantiated\
