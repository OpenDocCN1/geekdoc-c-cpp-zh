    \ |\n\n程序显示了以下输出：\n\n```\ncopy\n```\n\n## 讨论\n\n在这个程序中，似乎进行了三次拷贝。一个用于初始化 `getResource()`\
    \ 的返回对象，一个用于用 `resource1` 初始化它，一个用于初始化 `resource2`。然而，在 `getResource()` 返回并初始化\
    \ `resource1` 时并没有发生拷贝。这如何可能？\n\n让我们先看看返回语句，它似乎初始化了临时对象 `Resource()`。返回语句中的 `Resource()`\
