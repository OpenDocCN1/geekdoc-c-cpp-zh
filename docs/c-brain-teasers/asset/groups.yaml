    接下来，我们将 -3 加到 `acc`。-3 被转换为 `unsigned int`，由于它是负数，它会回绕为 `std::numeric_limits<unsigned
    int>::max() - 2`。当它与值为 0 的 `acc` 相加时，结果为 `std::numeric_limits<unsigned int>::max()
    - 2`，该值作为最终结果存储在 `acc` 中。在具有 32 位 `int` 的典型系统上，结果将是 4294967293。这产生了多次回绕和错误的结果，但没有未定义行为。


    这里是该过程中涉及的类型和转换的图。`acc` 被提升为 `unsigned int`，第一个值被转换为 `unsigned int`，两者相加，结果转换回
    `size_type` 并存储在 `acc` 中。


    然后我们对第二个值再次执行操作。


    ![](img/6a77d9759ca887223ee3bd2eee1e4419_138_0.png)


    从 `size_type` 到 `unsigned int` 的提升是有问题的，因为 `size_type` 和 `unsigned int` 都是无符号的且宽度相同。从
    `int` 到 `unsigned int` 的转换如果值为负数（根据本题输入，这种情况发生了），则可能发生回绕。无符号加法如果结果过大，则可能发生回绕（本题中未发生）。`unsigned
    int` 到 `size_type` 的转换没有问题，因为 `unsigned int` 和 `size_type` 都是无符号的且宽度相同。


    # 如果 size_type 既无法放入 int 也无法放入 unsigned int


    如果例如 `int` 是 32 位而 `size_type` 是 64 位无符号 `int`，这是最常见的情况。在这种情况下，不对 `size_type`
    执行整型提升（integral promotion）；我们只需要担心剩余的常规算术转换。由于 `size_type` 比 `int` 宽，`size_type`
    具有更高的秩，这意味着 `int` 被转换为无符号类型 `size_type`，且加法在 `size_type` 类型下进行。


