  mdcn: "\n\n# 谜题 18 移动 (Moving Out)\n\nmoving-out.cpp\n\n```cpp\n#include <iostream>\n\
    #include <string>\n\nint main()\n{\n    std::string hello{\"Hello, World!\"};\n\
    \    std::string other(std::move(hello));\n    std::cout << \"\\\"\" << hello\
    \ << \"\\\"\";\n}\n```\n\n# 猜猜输出\n\n在进入下一页之前，尝试猜猜输出是什么。\n\n该程序具有未定义行为（unspecified\
    \ behavior）！但它可能输出如下：\n\n# 讨论\n\n一个被移动过的对象（moved-from object）不应再次被使用，因为资源已经从那里移出，指针可能会指向已销毁的对象等。\n\
    \n特定的被移动过的对象的行为取决于该类的实现者。实现者在这里有很大的自由度，但至少该对象在销毁时应该是安全的，这样当例如一个被移动过的局部变量超出作用域时就不会发生任何错误。除非有明确文档说明，否则作为用户，你不应该假设该类会提供任何额外的保证。\n\
    \nC++ 标准为标准库中的类提供了额外的保证：\n\n> C++ 标准库中定义的类型对象是可以移动的。（……）除非另有规定，此类被移动过的对象应处于有效但未指定的状态。\n\
    \n`std::string` 没有另有规定，因此被移动过的字符串被放置在“有效但未指定的状态”。但是，这意味着什么呢？\n\nC++ 标准提供了以下定义：\n\
    \n(a) 对象的的值未知，除非对象的不变性（invariants）得到满足，且对对象的操作按照其类型指定的执行。\n\n因此，虽然我们不知道被移动过的字符串包含什么，但我们至少知道\
    \ `.size()` 返回的是剩余字符串的大小，当且仅当 `.size() == 0` 时 `.empty()` 为 `true`，依此类推。但尽管如此，对象的实际状态是未指定的，我们无法确定输出将是什么，因此最好完全避免使用被移动过的对象。\n\
    \n# std::string 移动构造函数的实现\n\n![](img/6a77d9759ca887223ee3bd2eee1e4419_128_0.png)\n\
    \n实现 `std::string` 移动构造的一种典型方法是从旧字符串中“窃取”内存以避免拷贝。重要的是，不能再通过旧字符串对象访问这些内存，否则对一个字符串的修改也会影响另一个字符串。同样重要的是，旧字符串不要在析构函数中尝试释放这些内存。如果\
    \ `std::string` 是通过指向堆上字符串缓冲区的指针实现的，可以想象移动构造函数将旧字符串的缓冲区指针设置为 `null`。你可以使用类似的技术为你自己的类实现移动操作。\n\
    \n某些实现会通过将字符串存储在 `std::string` 对象内部本身而不是在堆上分配缓冲区来优化短字符串，这种技术被称为“短字符串优化”（Short\
    \ String Optimization）。在这些情况下，移动构造函数无法窃取旧字符串的内存，因此需要拷贝。对于这种被移动过的字符串，一个合理的有效状态是仍然包含原始字符串。\n\
