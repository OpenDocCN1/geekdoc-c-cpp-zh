    \ instead of Widget::draw, and Button draw is printed. However, for the destructor,\
    \ the behavior is different; we can see that the first Button destructor and then\
    \ also prints Widget destructor. What's going on?\n\nWhen an object is destroyed,\
    \ all parts of it have to be destroyed. In this case, Button inherits from Widget,\
    \ so each Button object consists of a Widget object in addition to any members\
    \ from Button (none, in this case). We say that Button has a Widget subobject.\
    \ If Button had a member of type Widget instead of inheriting from it, it would\
    \ also have a Widget subobject. in either case, the subobjects must also be destroyed\
    \ when the complete object is destroyed to avoid resource leaks. Luckily, C++\
    \ handles this for us; we don't need to manually call the Widget destructor from\
    \ the Button destructor.\n\nNote also that the destructor’s body executes first,\
    \ and only then are the subobject destructors called. This ensures that you can\
    \ still use members and base classes in your class’s destructor. So the program\
    \ first prints Button destructor and then Widget destructor.\n\n> Bonus Question\n\
    \nWhat would happen if Widget did not declare its destructor as virtual, and in\
    \ which scenarios would that be a problem?\n\nAccording to the C++ standard, if\
    \ the static type of the object to be deleted is different from its dynamic type,\
    \ the static type must be a base class of the dynamic type of the object to be\
    \ deleted, and the static type must have a virtual destructor. Otherwise, the\
    \ behavior is undefined.\n\nSo if Widget doesn’t declare its virtual, and you\
    \ delete a Button object through a pointer to Widget, the behavior is undefined.\
    \ In practice, you’ll typically see Widget destructor being called instead of\
    \ the Button destructor and have issues like these:\n\n- Any members of the derived\
    \ class are not destroyed, potentially causing memory leaks or other resource\
    \ leaks.\n- If the derived class has a user-defined destructor, the correctness\
    \ of the program typically relies on this logic being executed when the object\
    \ is destroyed.\n\nBut in any case, even if none of those are a problem for your\
    \ program in particular and everything seems fine during testing, you should still\
    \ declare the destructor virtual to avoid undefined behavior.\n\n# Recommendation\n\
    \nThanks to the automatic destruction of subobjects, a good technique to handle\
    \ resources in C++ is to have Resource Acquisition Initialization (RAII) types\
    \ (for instance, unique_ptrs) as members. This technique also works if you derive\
    \ from such a class.\n\n# Further Reading\n\nCppReference on Destructors\n\nhttps://en.cppreference.com/w/cpp/language/destructor\n\
    \nThe C++ Standard on Destructors and Subobjects\n\nhttps://timsong-cpp.github.io/cppwp/std20/class.dtor#14\n\
