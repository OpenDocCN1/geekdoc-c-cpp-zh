    \n该程序具有未定义行为！此重要的是，答案不是“0 或 1”。\n\n## 讨论 (Discussion)\n\n当未同步的线程访问同一个内存位置，且这些访问中至少有一个是修改操作时，我们就遇到了数据竞态（data\
