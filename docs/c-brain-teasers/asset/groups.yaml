    \n- When we exit main, local goes out of scope and is destroyed.\n- localStatic\
    \ was the last object with static storage duration to be initialized, so it’s\
    \ destroyed first.\n- global was initialized first and is destroyed.\n\nUsing\
    \ a static local instead of a global is a good way to get better control over\
    \ the lifetime of a \"global\" variable. Instead of referring to a global object\
    \ each time you need it, you call a function to get a reference to it, and now\
