- md: "\n# FOOTNOTES\n\n[1] https://cppquiz.org\n\n## Acknowledgments\n\nFirst, I\
    \ want to thank Olve Maudal and the ACCU, who inspired me to create CppQuiz.org\
    \ [2] at the ACCU 2013 conference. I would also like to thank everyone who has\
    \ contributed to CppQuiz.org with content, implementation, and bug reports over\
    \ the years.\n\nBig thanks to my editor, Sandra Williams, for vital help along\
    \ the way. Without your guidance, support, and advice, this book would have been\
    \ much poorer. Also, thanks to Margaret Eldridge for reaching out on behalf of\
    \ the publisher and Frances Buontempo for introducing us.\n\nI am fortunate to\
    \ have had help from some of the best C++ people I know. Thank you Daniela Engert,\
    \ Björn Fahller, Olve Maudal, Karthik Nishanth, Tom Schultz, Tina Ulbrich, Sergei\
    \ Vasilchenko, and Piotr Wierciński for your help with technical review!\n\nFinally,\
    \ I want to thank my wife, Charlotte, whose support has allowed me to dedicate\
    \ the time and effort needed to write this book, and Kristiane and Sebastian for\
    \ their encouragement.\n\n[2] https://cppquiz.org\n\n## Preface\n\nC++ is one\
    \ of the largest and oldest programming languages in common use. It's famous for\
    \ getting all the default behaviors wrong and for, as is the famous example in\
    \ the C++ community, making demons fly out of your nose [3]. You couldn't have\
    \ picked a better language for a programming brain teasers book!\n\nThrough 25\
    \ puzzles we'll explore how C++ works under the hood, including some of its important\
    \ quirks. To get the most out of the book, you should have some experience writing\
    \ C++ and be familiar with the basics of the language, including simple object-oriented\
    \ programming and templates.\n\nAfter finishing the book, you'll have a deeper\
    \ understanding of topics like initialization, lifetimes, overload resolution,\
    \ implicit conversions, inheritance, undefined behavior, and more. More importantly,\
    \ I hope you'll have gained a sense of curiosity about how C++ really works, even\
    \ if only a few of those answers fit in a single book.\n\n## How to Use This Book\n\
    \nThe book contains 25 C++ puzzles with answers and explanations. Most will be\
    \ well-formed programs, which the C++ standard guarantees the output. Some might,\
    \ however, have a compilation error, and some might have undefined or unspecified\
    \ behavior. Your task is to figure out what happens when you compile and run the\
    \ program in each puzzle on a conforming C++ implementation.\n\nTake this imaginary\
    \ puzzle as an example. It's a complete C++ program with a main function:\n\n\
    ```cpp\n#include <iostream>\n\nint main()\n{\n    std::cout << (1 < 2);\n}\n```\n\
    \nYour task will be to read through the code and try to guess what the output\
    \ will be when the program is compiled and run. Always make sure you give it a\
    \ proper go before turning the page to look at the answer!\n\nPlease note a few\
    \ technicalities:\n\n- For brevity, I declare main with no parameters (no argc\
    \ / argv) and don’t explicitly return a value. These are all optional, omitting\
    \ them makes puzzles slightly easier to read.\n- I use struct instead of class\
    \ for all the puzzles. There’s no semantic difference—structs just have public\
    \ rather than private as the default visibility for members, so we don't have\
    \ to put public: everywhere.\n- As always in C++, bools are printed as 1 and 0\
    \ by default, not true and false.\n\nThe answer to the puzzle is that 1 is less\
    \ than 2, so the program prints 1 (representing true).\n\nGetting the answers\
    \ right is only half the fun, though. The other half is understanding why it works\
    \ the way it does. The puzzles are excuses to learn more about how C++ works under\
    \ the hood. I encourage you to read the explanations thoroughly enough to understand\
    \ them.\n\n## Undefined Behavior\n\nSome puzzles might have undefined behavior.\
    \ Undefined behavior is the term used when something bad happens during the execution\
    \ of a program, which the compiler is unable to (or, more specifically, not required\
    \ to) detect. For instance, we might access an element past the end of an array,\
    \ or an arithmetic expression with signed integers might overflow. In these cases,\
    \ the C++ standard imposes no restrictions on the implementation, and anything\
    \ can happen, including nasal demons. If a puzzle has undefined behavior, your\
    \ task is to identify the undefined behavior but also to guess what happens in\
    \ practice on a typical system. Does it actually make demons fly out of your nose,\
    \ or does something happen?\n\nAgain, let's look at an example:\n\n```cpp\n#include\
    \ <iostream>\n#include <limits>\n\nint main()\n{\n    std::cout << std::numeric_limits<int>::max()\
    \ + 1;\n}\n```\n\nSigned integer overflow in arithmetic is undefined behavior,\
    \ so if you identified that, you're halfway there!\n\nMaking assumptions about\
    \ what will happen in the case of undefined behavior is a bad idea. So let's do\
    \ that next! For any puzzles with undefined behavior, the other half of the puzzle\
    \ is to figure out what would happen if you run the program on your computer.\
    \ My computer uses two's complement for signed integers (as do conforming implementations\
    \ since C++20), and my CPU doesn't generate an exception when I overflow. When\
    \ I add 1 to the largest positive integer, the value simply wraps around the smallest\
    \ negative integer. Since my system uses 32-bit ints, the program prints -2147483648.\
    \ You don't need to know that exact value, but if you guessed it would print the\
    \ smallest negative integer, you solved it!\n\n## Don’t Do This at Home\n\nGuessing\
    \ or testing what happens in the case of undefined behavior is an interesting\
    \ exercise that can teach you more about how C++ works on your platform. It might\
    \ also enable you to recognize certain error patterns when you see them happening\
    \ in real programs. But do not make any assumptions about your programs based\
    \ on what you find! Your assumptions might be untrue on other computers, after\
    \ upgrading your compiler, or when you compile with different optimization settings.\
    \ The compiler is even allowed to remove error checking from your code if it can\
    \ prove that there’s undefined behavior!\n\n![](img/6a77d9759ca887223ee3bd2eee1e4419_20_0.png)\n\
    \n## Unspecified and Implementation-Defined Behavior\n\nThe C++ standard doesn’t\
    \ specify everything strictly; it leaves some freedom to the implementation. These\
    \ are some examples:\n\n- The specific sizes of integer types\n- The order of\
    \ evaluation of function arguments\n- The order of initialization of global variables\n\
    \nThis allows each implementation to make choices that make the most sense on\
    \ that particular system. Most programs have some unspecified or implementation-defined\
    \ behavior; this is not a bug. And contrary to undefined behavior, demons will\
    \ not fly out of your nose. It’s just that different implementations might behave\
    \ a bit differently within a set of allowed behaviors. If a puzzle has unspecified\
    \ or implementation-defined behavior, try to also guess what a typical behavior\
    \ would be.\n\n## Playing Around with the Code\n\nThe most important part of learning\
    \ anything programming related is to play around with it yourself. The code from\
    \ this book can be found on the book’s home page at The Pragmatic Bookshelf.[4]\
    \ You can build it locally by opening CMakeLists.txt in your favorite IDE or on\
    \ the command line:\n\n```\nmkdir build\ncd build\ncmake ..\ncmake --build\n```\n\
    \nThe project contains one .cpp file per puzzle, each resulting in one binary,\
    \ both named the same as the corresponding puzzle in the book.\n\nYou can also\
    \ try the code directly in your browser by pasting it into an online compiler.\
    \ I highly recommend Compiler Explorer,[5] where you can choose from and compare\
    \ different compiler versions and architectures, try out different optimization\
    \ levels, and add other compiler flags, sanitizer options, and so forth.\n\nLet’s\
    \ get started! Oh, and beware of the demons.\n\nFOOTNOTES\n\n[3] http://catb.org/jargon/html/N/nasal-demons.html\n\
    [4] https://pragprog.com/titles/akbrain\n[5] https://godbolt.org\n\n# Part 1\n\
    \n# C++ Brain Teasers\n"
  mdcn: "\n\n# 脚注\n\n[1] https://cppquiz.org\n\n## 致谢\n\n首先，我要感谢 Olve Maudal 和 ACCU，是他们启发了我在\
    \ 2013 年的 ACCU 大会上创建了 CppQuiz.org [2]。我还要感谢多年年来在内容、实现和错误报告方面为 CppQuiz.org 做出贡献的每一个人。\n\
    \n特别感谢我的编辑 Sandra Williams，她在在此过程中提供了至关重要的帮助。没有了你的指导、支持和建议，这本书将会单薄得许多。还要感谢 Margaret\
    \ Eldridge 代表出版商与我联系，并感谢 Frances Buontempo 为我们介绍这些同仁。\n\n我很幸运，能够得到我所认识的一些最顶尖 C++\
    \  way的帮助。感谢 Daniela Engert、Björn Fahller、Olve Maudal、Karthik Nishanth、Tom Schultz、Tina\
    \ Ulbrich、Sergei Vasilchenko 和 Piotr Wierciński 你们在技术审查方面的帮助！\n\n最后，我要感谢我的妻子 Charlotte，她的支持让我能够投入编写这本书所需的时间和精力，并感谢\
    \ Kristiane 和 Sebastian 的鼓励。\n\n[2] https://cppquiz.org\n\n## 前言\n\nC++ 是常用范围内最大、最古老的编程语言之一。它以所有的默认行为都是错误的而闻名，而且正如\
    \ C++ 社区中著名的例子那样，它能让恶魔从鼻子里飞出来 [3]。对于一本编程脑筋急转弯的书，你找不到更好的语言了！\n\n通过 25 道谜题，我们将探索\
    \ C++ 在底层是如何工作的，包括它一些重要的特性。为了从书中获得最大的收益，你应该具有编写 C++ 的经验，并熟悉该语言的基础，包括简单的面向对象编程和模板。\n\
    \n读完这本书后，你将对初始化、生命周期、重载解析、隐式转换、继承、未定义行为等主题有更深入的。更重要的是，我希望你对 C++ 的真实工作原理产生好奇心，即使这些答案中只有少数几个能包含在一本书里。\n\
    \n## 如何使用本书\n\n本书包含了 25 个带有答案和解释的 C++ 谜题。大多数将是格式良好的程序，C++ 标准保证了它们的输出。然而，某些可能存在编译错误，另一些可能存在未定义或未指定的行为。你的任务是弄清楚在符合标准的\
    \ C++ 实现上编译并运行每个谜题程序时会发生什么。\n\n以这个虚拟的谜题为例。它是一个带有 `main` 函数的完整 C++ 程序：\n\n```cpp\n\
    #include <iostream>\n\nint main()\n{\n    std::cout << (1 < 2);\n}\n```\n\n你的任务是阅读代码并尝试猜测程序在编译和运行时输出会是什么。在翻页查看答案之前，务必确保你已经尝试运行过了！\n\
    \n请注意以下几个技术细节：\n\n- 为了简洁，我声明的 `main` 没有参数（没有 `argc / argv`）且没有显式返回数值。这些都是可选的，省略它们会让谜题更容易读。\n\
    - 我在所有谜题中都使用 `struct` 而不是 `class`。这在语义上没有区别——`struct` 成员的默认可见性是公有的而不是私有的，所以我们不需要到处写上\
    \ `public:`。\n- 像 C++ 中通常一样，`bool` 默认打印为 1 和 0，而不是 `true` 和 `false`。\n\n该谜题的答案是\
    \ 1 小于 2，因此程序打印 1（代表 true）。\n\n然而，答对答案只有一半的乐趣。另一半是理解它为什么那样运行。谜题是学习更多 C++ 底层工作原理的借口。我鼓励你充分阅读解释以理解它们。\n\
    \n## 未定义行为\n\n某些谜题可能包含未定义行为。未定义行为是在程序执行期间发生某些坏情况，而编译器无法（更具体地说，是不要求）检测到时的术语。例如，我们可能会访问数组范围外的元素，或者有符号整数的算术表达式可能会溢出。在这种情况下，C++\
    \ 标准对实现没有任何限制，任何事情都可能发生，包括鼻恶魔。如果一个谜题具有未定义行为，你的任务是识别出未定义行为，还要猜测在典型系统上实际上会发生什么。它真的会让恶魔从鼻子里飞出来吗，还是发生了什么？\n\
    \n再次让我们来看一个例子：\n\n```cpp\n#include <iostream>\n#include <limits>\n\nint main()\n\
    {\n    std::cout << std::numeric_limits<int>::max() + 1;\n}\n```\n\n算术中的有符号整数溢出是未定义行为，如果你识别出了这一点，你就成功了一半！\n\
    \n对未定义行为发生时的情况做假设是个坏主意。所以让我们接着做这件事吧！对于任何具有未定义行为的谜题，谜题的另一半是弄清楚在你的计算机上运行程序会发生什么。我的计算机使用补码表示有符号整数（自\
    \ C++20 以起标准的实现也是如此），当发生溢出时 CPU 不会产生异常。当我最大正整数加 1 时，该值直接绕回最小负整数。由于我的系统使用 32 位\
    \ `int`，程序打印 -2147483648。你不需要知道那个精确的值，但如果你猜到它会打印最小负整数，你就解决了它！\n\n## 不要要在家里这样做\n\
    \n猜测或测试未定义行为发生时的情况是一个有趣的练习，可以让你学习更多关于 C++ 在你的平台上是如何工作的。它还可能让你在实际程序中识别出某些错误模式。但不要根据你的发现对程序做任何假设！你的假设在其他计算机上、升级编译器后或使用不同的优化设置编译时可能是错误的。如果编译器能证明存在未定义行为，它甚至允许移除代码中的错误检查！\n\
    \n![](img/6a77d9759ca87223ee3bd2eee1e4419_20_0)\n\n## 未指定的和实现定义的行为\n\nC++ 标准并没有严格规定一切；它为实现留了一些空间。这些是一些例子：\n\
    \n- 整数类型的具体大小\n- 函数参数的求值顺序\n- 全局变量的初始化顺序\n\n这允许实现在特定系统上做出最合理的选择。大多数程序都有一些未指定的或实现定义的行为；这不是错误。与未定义行为相反，恶魔不会从你的鼻子里飞出来。只是不同的实现在允许的行为范围内可能略有不同。如果一个谜题具有未指定的或实现定义的行为，尝试猜一下典型的行为是什么。\n\
    \n## 尝试代码\n\n学习任何编程相关内容最重要的部分就是自己尝试。这本书的代码可以在 Pragmatic Bookshelf 的主页找到。[4]。你可以通过在喜爱的\
    \ IDE 或命令行中打开 `CMakeLists.txt` 在本地构建它：\n\n```\nmkdir build\ncd build\ncmake ..\n\
    cmake --build\n```\n\n项目每个谜题包含一个 .cpp 文件，每个文件生成一个二进制文件，命名与书中对应的谜题相同。\n\n你也可以通过将代码粘贴到在线编译器中并在浏览器中直接尝试代码。我强烈推荐\
    \ Compiler Explorer，5]，你可以在那里选择并比较不同的编译器版本和架构，尝试不同的优化级别，并添加其他编译器标志、消毒器选项等等。\n\n\
    让我们开始吧！噢，小心恶魔。\n\n脚注\n\n[3] http://catb.org/jargon/html/N/nasal-demons.html\n\
    [4] https://pragprog.com/titles/akbrain\n[5] https://godbolt.org\n\n"
