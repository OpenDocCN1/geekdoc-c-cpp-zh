    \ `std::string` 的显式特化。你可以通过空的模板标签 `<>` 将其识别为特特化版本。最后，我们看到了一个普通的非模板 `serialize`\
    \ 函数（标记为“3”）。\n\n由于 `serialize` 名称被重载了，当我们写对该名称的调用时，重载解析需要确定调用哪一个。正如我们在[谜题 2，字符串理论](https://example.org)\
