    \ 在它的栈帧中为 `resource1` 留出空间，就像处理任何其他变量一样。然后 `main` 将指向此内存区域的指针作为一个“秘密”额外参数传递给 `getResource()`，就像它的签名是\
    \ `getResource(Resource* ptr)` 一样。现在 `getResource()` 就可以直接在这个内存位置上构造对象。\n\n为了这项工作，调用者和被调用者约定了这一规范，因此它是系统应用二进制接口（ABI）的一部分。一个流行的\
    \ ABI 是 Itanium C++ ABI[101]，例如它被用于 Linux。GCC 和 Clang 都符合这一 ABI，因此你可以自由地从由其中一个编译的函数调用由另一个编译的函数。Itanium\
    \ C++ ABI 规定：\n\n> 如果返回类型对于调用目的而言是非平凡的类类型，调用者将传递一个地址作为隐式参数。被调用者随后在该地址上构造返回值。\n\
    \n如果我们在 Compiler Explorer 上尝试这样做，选择 x86_64 架构，我们发现 GCC 和 Clang 的当前版本都在 `main`\
    \ 中生成了这段代码：\n\n```\nlea rax, [rbp-4]\nmov rdi, rax\ncall getResource()\n```\n\n\
    `main` 栈帧中 `resource1` 的地址。该地址被加载到 `rdi`（这是用于向函数传递第一个整数/指针参数的寄存器），然后调用了 `getResource()`。\n\
