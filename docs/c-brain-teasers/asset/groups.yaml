    \ << \"Widget destructor\\n\"; }\n};\n\nstruct Button : public Widget\n{\n   \
    \ void draw() override { std::cout << \"Button draw\\n\"; }\n    ~Button() override\
    \ { std::cout << \"Button destructor\\n\"; }\n};\n\nint main()\n{\n    std::unique_ptr<Widget>\
    \ widget = std::make_unique<Button>();\n    widget->draw();\n}\n```\n\n猜测输出。在移动到页之前，尝试猜猜输出。\n\
    \n程序显示以下输出：\n\nButton draw\nButton destructor\nWidget destructor\n\n# 讨论\n\n当我们调用\
    \ `draw` 时，程序只打印了 `Button draw`。但当 `unique_ptr` 超出范围并调用析构函数时，程序打印了 `Button destructor`\
    \ 和 `Widget destructor`。这是为什么？\n\n动态多态的一种常用技术是使用虚函数。你声明一个带有一个或标记为 `virtual` 的类的，允许其他类覆盖这些函数。当你对指向派生类对象的基指针调用虚函数时，将使用对象的动态类型，并调用被覆盖的函数。\n\
    \n在这个例子中，假设有一个 UI 框架，其中包含具有通用行为的 `Widget` 类，以及具体的 UI 元素如 `Button`、`Text` 和 `Image`，它们覆盖了虚函数\
    \ `draw` 中的绘图行为。\n\n当我们对指向 `Widget` 的基指针调用 `draw` 时（该指针实际上指向派生类 `Button`），调用的是\
    \ `Button::draw` 而不是 `Widget::draw`，并打印 `Button draw`。然而，对于析构函数，行为是不同的；我们可以看到先打印\
    \ `Button` 析构函数，然后打印 `Widget` 析构函数。发生了什么？\n\n当一个对象被毁时，它的所有部分都必须被毁。在这种情况下，`Button`\
    \ 继承自 `Widget`，因此每个 `Button` 对象除了 `Button` 的任何成员（在本情况下没有）之外还包含一个 `Widget` 对象。我们说\
    \ `Button` 拥有一个 `Widget` 子对象。如果 `Button` 是拥有一个 `Widget` 成员而不是继承它，它也会拥有一个 `Widget`\
    \ 子对象。无论哪种情况，当完整对象被毁时，子对象也必须被毁以避免内存泄漏。幸运的是，C++ 为我们处理了这一切；我们不需要在 `Button` 析构函数中手动调用\
    \ `Widget` 析构函数。\n\n同样注意，析构函数体先执行，然后才调用子对象的析构函数。这确保了你仍然可以在类的析构函数中使用成员和基类。因此，程序首先打印\
    \ `Button destructor`，然后打印 `Widget destructor`。\n\n> 附加问题\n\n如果 `Widget` 没有将它的析构函数声明为虚函数会发生什么？在哪些情况下会成为问题？\n\
    \n根据 C++ 标准，如果要删除对象的静态类型与其动态类型不同，则静态类型必须是被删除对象动态类型的基类，且静态类型必须具有虚析构函数。否则，行为是未定义的。\n\
    \n因此，如果 `Widget` 没有声明虚函数，而你通过 `Widget` 指针删除一个 `Button` 对象，行为将是未定义的。在实践中，你通常会看到调用\
    \ `Widget` 析构函数而不是 `Button` 析构函数，并遇到此类问题：\n\n- 派生类的任何成员都没有被毁，可能导致内存泄漏或其他资源泄漏。\n\
    - 如果派生类有用户定义的析构函数，程序的正确性通常依赖于该逻辑在对象被毁时执行。\n\n但无论如何，即使这些问题对你的特定程序来说都不是问题，并且在测试期间一切看起来都正常，你仍然应该将析构函数声明为虚以避免未定义行为。\n\
    \n# 建议\n\n得益于子对象的自动析构，C++ 处理资源的一种良好技术是资源获取初始化 (RAII) 类型（例如 `unique_ptr`）作为成员。这种技术在你派生类时同样有效。\n\
    \n# 进阶阅读\n\nCppReference 关于析构函数\n\nhttps://en.cppreference.com/w/cpp/language/destructor\n\
    \nC++ 标准 关于析构函数和子对象\n\nhttps://cppstandards.github.io/cppguid/\n\n# 谜题 6 谁先？\n\
    \nwhos-up-first.cpp\n\n```cpp\n#include <iostream>\n\nstruct Resource\n{\n   \
    \ Resource()\n    {\n        std::cout << \"Resource constructed\\n\";\n    }\n\
    };\n\nstruct Consumer\n{\n    Consumer(const Resource &resource)\n    {\n    \
    \    std::cout << \"Consumer constructed\\n\";\n    }\n};\n\nstruct Job\n{\n \
    \   Job() : resource_{}, consumer_{} {}\n    Consumer consumer_;\n    Resource\
    \ resource_;\n};\n\nint main() {\n    Job job;\n}\n```\n\n猜测输出。在移动到页之前，尝试猜猜输出。\n\
    \n程序显示以下输出：\n\nConsumer constructed\nResource constructed\n\n# 讨论\n\n`Job` 类有两个成员\
    \ `consumer_` 和 `resource_`，按该顺序声明。然而，构造函数的成员初始化列表（即 `resource_{}, consumer_{}`\
    \ 部分）顺序是反的。它们实际上按什么顺序初始化？\n\nC++ 总是按照它们在类声明中的顺序进行初始化。这确保了即使构造函数中列出的顺序不同，初始化顺序也是确定的。因此，即使\
    \ `resource` 在构造函数中看起来是先初始化的，`consumer_` 实际上是先初始化的。\n\n如果一个成员依赖于另一个成员，具有确定的初始化顺序是至关重要的。例如，在这个例子中，`Consumer`\
    \ 在构造函数中依赖 `resource`。但由于 `consumer_` 实际上在 `resource_` 之前初始化，`Consumer` 构造函数接收了一个尚未构造的\
    \ `Resource`。如果我们尝试用它进行任何操作，将产生未定义行为。\n\n反之亦如此。成员的析构顺序与声明顺序相反。析构顺序可能与构造顺序同样重要，因为一个成员可以在其析构函数中依赖另一个成员。想象一下，谜题中的\
    \ `Consumer` 运行一个使用 `Resource` 的线程，而 `Consumer` 在其析构函数中加入该线程。在当前代码中，`resource_`\
    \ 在线程仍在运行时就会被毁，我们将面临使用已毁 `resource_` 的风险。\n\n在成员初始化列表中错误的顺序出成员会让读者感到困惑，因此我建议在成员初始化列表和类声明中使用始终相同的顺序。GCC、Clang\
    \ 和 MSVC 都有相应的警告（分别为 `-Wreorder`、`-Wctor` 和 `C5038`），在你不使用一致顺序时警告你。这些警告在用 `-Wall\
