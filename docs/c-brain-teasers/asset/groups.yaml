    # Discussion


    I know, I know. This is supposed to be a fun book. But sometimes we need to talk
    about sad topics like this.


    As you''ve figured out by now, the type of char + char is unfortunately not char.
    So what is it, then?


    For many binary operations, such as +, *, /, ==, ^, and more, the operands must
    be of the same type. You don''t have to ensure that yourself yourself, though;
    C++ will take care of it. C++ is in fact very eager to implicitly convert types
    when you''re not looking, and this is one of the more confusing cases. Meet the
    usual arithmetic conversions.


    The usual arithmetic conversions are performed on the operands to these operators
    to ensure both operands are of the same type. This common type is also the type
    of the result. For instance, if you add a float and an int, the int is first converted
    to a float, and the result is a float. And if you add a float and a double, the
    float is first converted to a double, and the result is a double. Makes sense
    so far.'
  - '[PAGE 105]


    The confusion starts when both operands are of integer types, especially if they
    are of the same type. For instance, if you add a char and an int, the char is
    first converted to an int and an int. It still makes sense. But what if you add
    a char and short? Rather than converting a char to a short, both operands are
    converted to an int (usually—see the following). And it gets worse: if you add
    two chars, which are already of the same type, they’re still converted to a different
    type!


    Let’s see what the usual conversions do to our expression char1 + char2. Since
    both operands are integer types, a process known as integral promotions is performed
    on both of them. The idea is to convert smaller integer types to int or unsigned
    int before performing the arithmetic expression. After converting both operands,
    we can now add them using regular int or unsigned int addition and get an int
    or unsigned int as a result.


    The rule for promoting a smaller integer type is that it can be converted to an
    int if int can represent all the values of the smaller type; otherwise, it can
    be converted to an unsigned int. Does a a char fit in an int? Usually it does,
    but that depends on the implementation. (I told you this is a sad story.)


    A complicating factor here is that the sizes of fundamental types in C++ are not
    fixed. An implementation can decide that int is 16 bits or 64 bits, and even that
    char and long are of the same size. The only rules are these:


    +   Each of signed char, short, int, and long long is at least large as the preceding
    type in the list.'
