    # Discussion


    When we initialize the second Jormungandr with a moved-from object, the move constructor
    gets called for Jormungandr but the copy constructor for Monster. Why is that?


    As we learned in Puzzle 8, Puzzle 8, Will It Move?, when we wrap an expression
    in std::move, it turns into an rvalue. An important detail here, though, is that
    value categories are about expressions, not objects. So nothing happens to the
    object jormungandr1 itself; it''s just that the expression jormungandr1 is an
    lvalue, but the expression std::move(jormungandr1) is an rvalue. If you ask me,
    it would be simpler if it was called “l-expression” and “r-expression” instead
    of “lvalue” and “rvalue.”


    When we copy-initialize jormungandr2 with the expression Jormungandr jormungandr2(std::move(jormungandr1)),
    overload resolution prefers Jormungandr’s move constructor over its copy constructor
    since the expression std::move(jormungandr1) is an rvalue, which can be moved
    from. And yes, you read that right, this form is always called copy-initialization
    even if the move constructor happens to be called. There’s no such thing as move-initialization.'
