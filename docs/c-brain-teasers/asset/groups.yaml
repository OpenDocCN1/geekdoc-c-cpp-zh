    # Discussion


    Wait, what? Is this legal C++? What does it even mean, and why does it print 1?


    While C++ is a statically typed language, it''s not particularly strongly typed.
    As we''ve seen throughout the book, C++ is, in fact, very eager to implicitly
    convert types without you explicitly telling it to. For instance, in Puzzle 14,
    Puzzle 14, Aristotle''s Sum of Parts, we saw how the sum of two chars is not a
    char; in Puzzle 17, A Strong Point, we saw how you should declare your constructors
    explicit to avoid them taking part in implicit conversions; and in Puzzle 19,
    Puzzle 19, A Little Sum Thing, we saw how implicit conversions between arithmetic
    types can lead to unexpected results.


    This eagerness is something we inherited back in the day when C++ was designed
    as an extension of C. If we did it today, this abundance of implicit conversions
    would be high on the list of things we''d want to change.


    So which implicit conversions are in play here, what is the final type of this
    expression, and why is the result 1?


    Let''s start to the right, with the expression "". This is a string literal, and
    as we discussed in Puzzle 2, Puzzle 2, String Theory, the type of a string literal
    is “array of n const char,” with n being 1 in this case (for the implicit \0 terminator).


    Next is the ! operator, which negates its operand. But how do you negate an array
    of characters? That doesn''t make sense, does it? Indeed it doesn''t, but the'
  - '[PAGE 177]


    operand to the ! operator is contextually converted to bool before being negated.
    Converting an array to bool doesn''t make sense either, but as we saw in Puzzle
    2, Puzzle 2, String Theory, arrays can be implicitly converted to pointers, and
    pointers can be converted to bool. When a pointer is converted to bool, it converts
    to false if it''s a null-pointer and to true otherwise. Since the pointer in this
    case is non-null (points to our string literal), it converts to true. Finally,
    the ! operator negates this, so we arrive at false. One could argue that this
    entire conversion sequence doesn''t really make sense, and I''d agree, but at
    least we can understand how each step works and how they combine to arrive at
    this result.


    Next up is another !, which this simply negates our bool false, giving us the
    bool true.


    Finally, there''s the unary +. The operand to unary + goes through integral promotions,
    which for bool converting false to 0 and true to 1. The operator itself doesn''t
    do anything; the result is the same as its operand (after promotion). So our bool
    true turns into the int 1, which gets printed.


    Whether or not the compiler will warn about any of this is another discussion,
    but none of the major ones, even with -Wall-Wextra for GCC and Clang, and /Wall
    for MSVC. Your compiler might be able to provide some warnings, though, if you
    turn those warnings explicitly. For instance, Clang will warn about the -Wstring-conversion
    option (which is not included in -Wall or -Wextra). Check your compiler''s documentation
    for the list of warnings it supports.'
