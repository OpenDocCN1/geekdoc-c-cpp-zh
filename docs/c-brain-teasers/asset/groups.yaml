  mdcn: "\n因此，对于 `getMemory` 的三次调用，都会产生一个临时对象（temporary）。但它们会存活多久呢？\n\n通常情况下，临时对象会在创建它们的完全表达式（full-expression）结束时被销毁。在这个谜题中，这意味着它们会在行结束时销毁。然而，在某些情况下，临时对象的生命周期会被延长。这在某种程度上是过去的遗留，已经不再非常好用。例如，对于\
    \ `const auto &reference1 = getMemory(1);`，我们不如直接写 `const auto object1 = getMemory(1);`。得益于\
