    \ a decent CI setup, you’re likely to discover the problem and fix it.\n\nHow\
    \ do we fix this properly, then? Since there's no way for the GameObject constructor\
    \ to know which derived type is actually being constructed, we have to somehow\
    \ provide it with that information. The easiest solution is to pass the information\
