    to one string would also affect the other. It''s also important that the old string
    doesn''t attempt to free this memory in its destructor. If std::string is implemented
    with a pointer to a string buffer on the heap, one can, imagine that the move
    constructor sets the old string''s buffer pointer to null. You can use similar
    techniques to implement move operations for your own classes.

    Some implementations will optimize short strings by storing the string inside
    the std::string object itself instead of allocating'
