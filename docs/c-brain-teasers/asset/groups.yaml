    # Discussion


    The program defines an array characters with three elements. We then print the
    size of this array in various ways. What does the sizeof operator do in each case?
    Which of them are defined by the standard, and which are implementation-defined?
    And what do they print on your computer?


    First, the program defines an array char characters[] = {''a'', ''b'', ''c''}.
    We then print the size of this array, using the sizeof operator. The sizeof operator
    yields the number'
  - '[PAGE 150]


    of bytes occupied by its operand, which in this case is 3, since each char is
    one byte, and there are three of them.


    But wait, in Puzzle 14, Puzzle 14, Aristotle’s Sum of Parts, we learned that the
    sizes of the fundamental types are not defined by the standard, so how can we
    be sure that the answer is 3? A char could, after all, be 16 wide for all we know.
    As it turns out, sizeof(char) is defined to always return 1. So the “byte” that
    the C++ standard talks about isn’t necessarily bits wide but whatever width char
    is.


    Next, we print sizeof(characters) / sizeof(characters[0]). This is the age-old
    idiom used to count the number of elements in an array in C or C++ and is guaranteed
    to print 3 in this puzzle. This is because sizeof(characters) returns 3 (as we
    saw), and sizeof(characters[0]) is equivalent to sizeof(char), which always returns
    1. (As of C++17, we can also count the elements in an array with the new std::size
    function template, which makes the code a bit simpler: std::cout << std::size(characters).


    Finally, we want to serialize our characters, so we pass them to void serialize(char
    characters[]). The serialization function wants to know how large the array is
    for purposes of serialization and does sizeof(characters), just like we do in
    main. But why does this print 8 (on my computer in particular) and not 3? It''s
    because the type of the char characters[] parameter is actually not “array of
    char” but rather “pointer to char”! The standard says the following about the
    types of function parameters:'
  - '[PAGE 151]


    After determining the type of each parameter, any parameter of type “array of
    T” or of function type T is adjusted to be “pointer to T”.


    So the sizeof(characters) in the serialize function prints the size of a pointer
    rather than the size of an array since the type of characters is actually “pointer
    to char” at this point. This is the implementation-defined part of the puzzle
    since the standard doesn’t define the size of a pointer. On most modern computers
    the pointer is 64 bits, which equals 8 bytes, so on your computer you probably
    see 8 printed.


    Now, could we use the seemingly more powerful std::size function template here,
    too, to get the actual number of elements in the array? We can’t, since characters
    is a pointer and not an array. std::size is only defined for collections and views
    with a .size() member function, and for arrays. std::size(characters) would fail
    to compile rather giving the wrong result, which is nice.


