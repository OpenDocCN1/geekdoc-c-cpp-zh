    \nhttps://www.youtube.com/watch?v=fGnbX88z3Y\n\n# 谜题 5A 破坏性关系\n\na-destructive-relationship.cpp\n\
    \n```cpp\n#include <iostream>\n#include <memory>\n\nstruct Widget\n{\n    virtual\
