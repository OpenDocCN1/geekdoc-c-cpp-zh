    non-template serialize function (3) is a candidate, but what happens with the
    function template? And how is the compiler to disambiguate between the function
    template specialization and the normal function, both of which have the same signature?


    When a function template is involved in overload resolution, the compiler looks
    at all the primary templates of that name. It doesn’t consider specializations
    at this point, so only the primary template (1) is considered, and the specialization
    (2). If we had other primary template overloads, these would also be considered,
    but we only have one in this puzzle. An example of another primary template could,
