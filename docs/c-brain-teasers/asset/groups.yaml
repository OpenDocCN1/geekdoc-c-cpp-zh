    \    Resource resource_;\n};\n\nint main() {\n    Job job;\n}\n```\n\n# Guess\
    \ the Output Try to guess what the output is before moving to the next page.\n\
    \nThe program displays the following output:\n\nConsumer constructed\nResource\
    \ constructed\n\n# Discussion\n\nThe class Job has two members, consumer_ and\
    \ resource_, declared in that order. However, the constructor's member initializer\
    \ list (the resource_{} part), are initialized in the opposite order. In which\
    \ order are they actually initialized?\n\nC++ always initializes members in the\
    \ order they are declared in the class declaration. This ensures that members\
    \ are always initialized in a deterministic order, even if different constructors\
    \ happen to list them in different orders. So if even resource seems to be initialized\
    \ first in the constructor, consumer_ is actually initialized first.\n\nHaving\
    \ members initialized in a deterministic order is essential if one member depends\
    \ on the other. For instance, in this example the consumer depends on resource\
    \ in its constructor. But since consumer_ is actually initialized before resource_,\
    \ the Consumer constructor gets passed a Resource that hasn't been constructed\
    \ yet. If we tried to use it for anything, we would have undefined behavior.\n\
    \nThe reverse is also true. Members are destroyed in the opposite order of their\
