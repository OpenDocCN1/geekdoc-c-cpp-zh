    \ and the program outputs the following:\n\n```\nnormal function\nnormal function\n\
    ```\n\nNotice that in neither of the preceding cases was the explicit function\
    \ template specialization even involved in overload resolution—it never is. This\
    \ can be non-intuitive, so in general it's better to use non-template overloads\
    \ than explicit specializations. See the first two links under Further Reading\
    \ for details and some even worse examples of these kinds of confusions.\n\n|\
    \ Recommendations |\n| :--- |\n| Prefer non-template overloads over explicit specializations.\
    \ |\n\n# Further Reading\n\nWhy Not Specialize Function Templates?\n\nhttp://www.gotw.ca/publications/mill17.htm\n\
    \nFull Specialization of Function Templates\n\nhttps://www.modernescpp.com/index.php/full-specialization-of-function-templates/\n\
    \nC++ Core Guideline T.144: Don't Specialize Function Templates\n\nhttps://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#t144-dont-specialize-function-templates\n\
    \n# Puzzle 25: Weakly Typed, Strongly Puzzling\n\nweakly-typed-strongly-puzzling.cpp\n\
