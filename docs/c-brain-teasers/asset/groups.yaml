    \ <iostream>\nstruct Degrees\n{\n    Degrees() : degrees_(0)\n    {\n        std::cout\
    \ << \"Default constructed\\n\";\n    }\n    Degrees(double degrees) : degrees_(degrees)\n\
    \    {\n        std::cout << \"Constructed with \" << degrees_ << \"\\n\";\n \
    \   }\n    double degrees_;\n};\nstruct Position\n{\n    Position() : latitude_{1}\
    \ { longitude_ = Degrees{2}; }\n    Degrees latitude_;\n\n    Degrees longitude_;\n\
    };\nint main()\n{\n    Position position;\n}\n```\n\n![](img/6a77d9759ca887223ee3bd2eee1e4419_26_0.png)\n\
    \nThe program displays the following output:\n\nConstructed with 1\nDefault constructed\n\
    Constructed with 2\n\n# Discussion\n\nThe struct Position has two members of type\
    \ Degrees. One is initialized in the member initializer list, and one in the constructor\
    \ body. So why do we see three Degrees objects being constructed?\n\nAll class\
    \ members are initialized before we get to the constructor body. If you explicitly\
    \ initialize the member, as we do for latitude_, that's the initialization that'll\
    \ be used. If you don't, as is the case for longitude_, the member will instead\
    \ be default-initialized, which is why we see the line Default constructed being\
    \ printed. After all members have been initialized, we finally enter the constructor\
    \ body, initialize a temporary Degrees[2], and then copy-assign it to the previously\
    \ default-initialized longitude_.\n\nNote that instead of explicitly initializing\
    \ the member in the member initializer list, you can use a default member initializer\
    \ directly in the member declaration, like so:\n\nexamples/default-member-initializer/default-member-initializer.cpp\n\
    \n```cpp\nstruct Position\n{\n    Position() { longitude = Degrees{2}; }\n   \
    \ Degrees latitude{1}; // Default member initializer\n\n    Degrees longitude;\n\
    };\n```\n\nUsing a default member initializer can be a good idea if you have several\
    \ constructors. Then you don't have to remember to include that member in every\
    \ member initializer list.\n\n# Further Reading\n\n- Constructors and Member Initializer\
    \ Lists\n- https://en.cppreference.com/w/cpp/language/constructor\n\n# Puzzle\
    \ 2\nString Theory\n\nstring-theory.cpp\n\n```cpp\n#include <iostream>\n#include\
    \ <string>\n\nvoid serialize(const void*) { std::cout << \"const void*\"; }\n\n\
    void serialize(const std::string&) { std::cout << \"const string&\"; }\n\nint\
    \ main()\n{\n    serialize(\"hello world\");\n}\n```\n\nGuess the Output\n\n>\
    \ Try to guess what the output is before moving to the next page.\n\nThe program\
    \ displays the following output:\n\n```\nconst void*\n```\n\n# Discussion\n\n\
    Why does passing a string to serialize cause the overload taking a void pointer\
    \ to be called rather than the overload taking a string?\n\nWhen we’re calling\
    \ a function with multiple overloads, the compiler uses a process called overload\
    \ resolution to figure out which one is the best fit. The compiler does this by\
    \ attempting to convert each function argument to the corresponding parameter\
    \ type for each overload. Some conversions are better than others, and the best\
    \ conversion is if the argument is already of the correct type.\n\nAll the overloads\
    \ where all arguments can be successfully converted are added to a set of viable\
    \ functions. Then the compiler needs to figure out which overload to select from\
    \ this set. If an overload has a better conversion for at least one argument and\
    \ not a worse one for any of the other arguments, this overload is deemed to be\
    \ the best viable function and is selected by overload resolution. If no overload\
    \ better than all the others, the call is ill-formed and fails to compile.\n\n\
    Have a look at this example:\n\n```cpp\nserialize(int, int); // 1\n```\n\n```cpp\n\
    serialize(float, int); // 2\n```\n\nGiven these overloads, suppose you call serialize\
    \ like this:\n\n```cpp\nserialize(1, 2);\n```\n\nBoth overloads of serialize are\
    \ viable. But the first overload has a better conversion for the first argument\
    \ (int -> int is better than int -> float) and not a worse conversion for the\
    \ second argument (int -> int for both overloads), so it is selected by overload\
    \ resolution as the best viable function.\n\nThe puzzle is a bit simpler than\
    \ this example since both overloads of serialize only have one parameter. The\
    \ first takes a const void * and the second takes a const std::string;. What does\
    \ the conversion look like for each of the overloads?\n\nstd::string is a class\
    \ in the standard library. It'll typically allocate memory on the heap (unless\
    \ the string is very small) and allows the string to grow or be otherwise modified\
    \ at runtime.\n\nHowever, the string \"hello world\" is not a std::string but\
    \ a simple string literal. String literals are plain C-style arrays of chars which\
    \ get baked into your binary by the linker and cannot be modified at runtime.\
    \ A string literal has the type “array of n const char.” \"hello world\" has 11\
    \ characters plus a terminating \\0, so its type is “array of 12 const char.”\n\
    \nSince the argument \"hello world\" is neither a const void* nor a std::string\
    \ but an array of 12 const char, a conversion is needed for both operands. If\
    \ an implicit conversion exists from the argument to the parameter type, then\
    \ overload is added to the set of viable functions. Otherwise, the overload is\
    \ ignored.\n\nLet's examine the first overload and if “array of 12 const char”\
    \ can be implicitly converted to const void*. The first thing that happens is\
    \ the array gets converted to a pointer. “Array of n T” can be converted to a\
    \ “pointer to T” pointing to the first element. So our “array of 12 const char”\
    \ has turned into a “pointer to const char.”\n\nNext, any “pointer to cv T” (where\
    \ cv means const, volatile, const volatile, or none of these) can be converted\
    \ to “pointer to cv void.” So now our “pointer to const char” has turned into\
    \ a pointer to const void,” which is exactly what the first overload expects.\n\
    \nNotice that no constructors or conversion functions were involved in this conversion\
    \ sequence. It means it’s a standard conversion sequence and not a user-defined\
    \ conversion sequence. That gets important later.\n\nLet's now examine the second\
    \ overload, and see if “array of 12 const char” can be converted to a “reference\
    \ to const std::string.” std::string has a constructor std::string(const char*\
    \ s), which we can use. First, we convert the “array of 12 const char to a “pointer\
    \ to const char” as we did above. Then we pass this to the std::string constructor\
    \ and get a std::string back, containing a copy of the string literal. The const\
    \ std::string& parameter can bind directly to the std::string argument.\n\nNotice\
    \ that we had to use a constructor for this. This means it’s a user-defined conversion\
    \ sequence and not a standard conversion sequence. It doesn’t matter that std::string\
    \ is a standard library type; it still counts as user-defined. The rules are the\
    \ same for you and the standard library.\n\nNow the compiler has found a valid\
    \ conversion sequence from our “array of 12 const char” to the parameter type\
    \ of each overload and has to figure out which sequence is best:\n\nConversion\
    \ sequence for void serialize(const void*)\nconst char[12]  longrightarrow const\
    \ char *  longrightarrow const void *  Standard conversion, no new objects created\n\
    \nConversion sequence for void serialize(const std::string&)\nconst char[12] \
    \ longrightarrow const char *  longrightarrow std::string  User defined conversion,\
    \ new std::string object created!\n\nWe only require a standard conversion sequence\
    \ (top), to call the const void* overload. To call the std::string overload, we\
    \ need a user defined conversion sequence (bottom), which involves creating a\
    \ new temporary std::string object. A standard conversion sequence is always better\
    \ than a user-defined conversion sequence, so the first overload gets called,\
    \ and const void* is printed.\n\n# Further Reading\n\nOverload Resolution\nhttps://en.cppreference.com/w/cpp/language/overload_resolution\n\
    \nstd::string\nhttps://en.cppreference.com/w/cpp/string/basic_string\n\nString\
    \ Literal\nhttps://en.cppreference.com/w/cpp/language/string_literal\n"
