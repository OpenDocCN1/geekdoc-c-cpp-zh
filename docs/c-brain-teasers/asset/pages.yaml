    A moved-from object should no longer be used, as resources will have been moved
    out of it, pointers might point to destroyed objects, and so on.


    How a particular moved-from object behaves is up to the implementer of that class.
    The implementer has a lot of freedom here, but at a minimum, the object should
    be safe to destroy so nothing breaks when, for instance, a moved-from local variable
    goes out of scope. Unless explicitly documented, you as a user should not assume
    that a class makes any further guarantees.


