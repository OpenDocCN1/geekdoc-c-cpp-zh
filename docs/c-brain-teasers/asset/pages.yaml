- img_proc: true
  md: '# Unspecified and Implementation-Defined Behavior


    The C++ standard doesn’t specify everything strictly; it leaves some freedom to
    the implementation. These are some examples:


    +   - The specific sizes of integer types

    - The order of evaluation of function arguments

    - The order of initialization of global variables


    This allows each implementation to make choices that make the most sense on that
    particular system.


    Most programs have some unspecified or implementation-defined behavior; this is
    not a bug. And contrary to undefined behavior, demons will not fly out of your
    nose. It’s just that different implementations might behave a bit differently
    within a set of allowed behaviors.


    If a puzzle has unspecified or implementation-defined behavior, try to also guess
    what a typical behavior would be.'
  merge: -1
