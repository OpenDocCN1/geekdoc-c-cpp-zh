  md: 'by the linker and cannot be modified at runtime. A string literal has the type

    “array of n const char.” "hello world" has 11 characters plus a terminating \0,
    so its

    type is “array of 12 const char.”


    Since the argument "hello world" is neither a const void* nor a std::string but
    an

    array of 12 const char, a conversion is needed for both operands. If an implicit

    conversion exists from the argument to the parameter type, then overload is

    added to the set of viable functions. Otherwise, the overload is ignored.


    Let''s examine the first overload and if “array of 12 const char” can be

    implicitly converted to const void*. The first thing that happens is the array

    gets converted to a pointer. “Array of n T” can be converted to a “pointer to

    T” pointing to the first element. So our “array of 12 const char” has turned

    into a “pointer to const char.”


    Next, any “pointer to cv T” (where cv means const, volatile, const volatile, or
    none

    of these) can be converted to “pointer to cv void.” So now our “pointer to const

    char” has turned into a pointer to const void,” which is exactly what the first

    overload expects.


    Notice that no constructors or conversion functions were involved in this

    conversion sequence. It means it’s a standard conversion sequence and not a

    user-defined conversion sequence. That gets important later.


    Let''s now examine the second overload, and see if “array of 12 const char”

    can be converted to a “reference to const std::string.” std::string has a constructor

    std::string(const char* s), which we can use. First, we convert the “array of
    12 const'
