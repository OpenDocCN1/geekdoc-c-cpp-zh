  md: '# Undefined Behavior


    Some puzzles might have undefined behavior. Undefined behavior is the term used
    when something bad happens during the execution of a program, which the compiler
    is unable to (or, more specifically, not required to) detect. For instance, we
    might access an element past the end of an array, or an arithmetic expression
    with signed integers might overflow. In these cases, the C++ standard imposes
    no restrictions on the implementation, and anything can happen, including nasal
    demons. If a puzzle has undefined behavior, your task is to identify the undefined
    behavior but also to guess what happens in practice on a typical system. Does
    it actually make demons fly out of your nose, or does something happen?


    Again, let''s look at an example:


    ```

    #include <iostream>

    #include <limits>


    int main()

    {

    std::cout << std::numeric_limits<int>::max() + 1;

    }

    ```


    Signed integer overflow in arithmetic is undefined behavior, so if you identified
    that, you''re halfway there!


    Making assumptions about what will happen in the case of undefined behavior is
    a bad idea. So let''s do that next! For any puzzles with undefined behavior, the
    other half of the puzzle is to figure out what would happen if you run the program
    on your computer. My computer uses two''s complement for signed integers (as do
    conforming implementations since C++20), and my CPU doesn''t generate an exception
    when I overflow. When I add 1 to the largest positive integer, the value simply
    wraps around the smallest negative integer. Since my system uses 32-bit ints,
    the program prints -2147483648. You don''t need to know that exact value,'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'but if you guessed it would print the smallest negative integer, you solved
    it!


    # Don’t Do This at Home


    Guessing or testing what happens in the case of undefined behavior is an interesting
    exercise that can teach you more about how C++ works on your platform. It might
    also enable you to recognize certain error patterns when you see them happening
    in real programs. But do not make any assumptions about your programs based on
    what you find! Your assumptions might be untrue on other computers, after upgrading
    your compiler, or when you compile with different optimization settings. The compiler
    is even allowed to remove error checking from your code if it can prove that there’s
    undefined behavior!


    ![](img/6a77d9759ca887223ee3bd2eee1e4419_20_0.png)'
  merge: -1
