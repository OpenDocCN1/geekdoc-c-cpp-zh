    is first converted to an int and an int. It still makes sense. But what if you
    add a char and short? Rather than converting a char to a short, both operands
    are converted to an int (usually—see the following). And it gets worse: if you
    add two chars, which are already of the same type, they’re still converted to
    a different type!


    Let’s see what the usual conversions do to our expression char1 + char2. Since
    both operands are integer types, a process known as integral promotions is performed
    on both of them. The idea is to convert smaller integer types to int or unsigned
    int before performing the arithmetic expression. After converting both operands,
    we can now add them using regular int or unsigned int addition and get an int
    or unsigned int as a result.


    The rule for promoting a smaller integer type is that it can be converted to an
    int if int can represent all the values of the smaller type; otherwise, it can
    be converted to an unsigned int. Does a a char fit in an int? Usually it does,
    but that depends on the implementation. (I told you this is a sad story.)


    A complicating factor here is that the sizes of fundamental types in C++ are not
    fixed. An implementation can decide that int is 16 bits or 64 bits, and even that
    char and long are of the same size. The only rules are these:


