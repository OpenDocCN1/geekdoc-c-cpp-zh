  md: "The struct Position has two members of type Degrees. One is initialized in\
    \ the member initializer list, and one in the constructor body. So why do we see\
    \ three Degrees objects being constructed?\n\nAll class members are initialized\
    \ before we get to the constructor body. If you explicitly initialize the member,\
    \ as we do for latitude_, that's the initialization that'll be used. If you don't,\
    \ as is the case for longitude_, the member will instead be default-initialized,\
    \ which is why we see the line Default constructed being printed. After all members\
