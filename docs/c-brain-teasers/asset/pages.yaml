  md: '# Preface


    C++ is one of the largest and oldest programming languages in common use. It''s
    famous for getting all the default behaviors wrong and for, as is the famous example
    in the C++ community, making demons fly out of your nose [31] You couldn''t have
    picked a better language for a programming brain teasers book!


    Through 25 puzzles we''ll explore how C++ works under the hood, including some
    of its important quirks. To get the most out of the book, you should have some
    experience writing C++ and be familiar with the basics of the language, including
    simple object-oriented programming and templates.


    After finishing the book, you''ll have a deeper understanding of topics like initialization,
    lifetimes, overload resolution, implicit conversions, inheritance, undefined behavior,
    and more. More importantly, I hope you''ll have gained a sense of curiosity about
    how C++ really works, even if only a few of those answers fit in a single book.'
