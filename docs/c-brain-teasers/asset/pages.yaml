  md: 'This is very useful since you don''t have to think about cleaning up half-initialized
    objects. Any initialized member like engine_ gets destroyed automatically; the
    rest don''t be since they were never constructed in the first place. You do have
    to be careful, though, if you manually acquire some resource in the constructor.
    In that case, you can''t rely on the destructor to clean it up. For instance,
    if you call new and assign the pointer to a member, you cannot rely on delete
    in your destructor to clean it up. The same goes for calls to function pairs like
    open/close.


