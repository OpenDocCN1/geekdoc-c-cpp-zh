    # Discussion


    Why does passing a string to serialize cause the overload taking a void pointer
    to be called rather than the overload taking a string?


    When we’re calling a function with multiple overloads, the compiler uses a process
    called overload resolution to figure out which one is the best fit. The compiler
    does this by attempting to convert each function argument to the corresponding
    parameter type for each overload. Some conversions are better than others, and
    the best conversion is if the argument is already of the correct type.


    All the overloads where all arguments can be successfully converted are added
    to a set of viable functions. Then the compiler needs to figure out which overload
    to select from this set. If an overload has a better conversion for at least one
    argument and not a worse one for any of the other arguments, this overload is
    deemed to be the best viable function and is selected by overload resolution.
    If no overload better than all the others, the call is ill-formed and fails to
    compile.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Have a look at this example:


    ```

    serialize(int, int); // 1

    ```


    ```

    serialize(float, int); // 2

    ```


    Given these overloads, suppose you call serialize like this:


    ```

    serialize(1, 2);

    ```


    Both overloads of serialize are viable. But the first overload has a better conversion
    for the first argument (int -> int is better than int -> float) and not a worse
    conversion for the second argument (int -> int for both overloads), so it is selected
    by overload resolution as the best viable function.


    The puzzle is a bit simpler than this example since both overloads of serialize
    only have one parameter. The first takes a const void * and the second takes a
    const std::string;. What does the conversion look like for each of the overloads?


    std::string is a class in the standard library. It''ll typically allocate memory
    on the heap (unless the string is very small) and allows the string to grow or
    be otherwise modified at runtime.


    However, the string "hello world" is not a std::string but a simple string literal.
    String literals are plain C-style arrays of chars which get baked into your binary'
