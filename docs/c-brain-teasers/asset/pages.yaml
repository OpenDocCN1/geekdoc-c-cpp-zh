- img_proc: true
  md: 'char to a “pointer to const char” as we did above. Then we pass this to the
    std::string constructor and get a std::string back, containing a copy of the string
    literal. The const std::string& parameter can bind directly to the std::string
    argument.


    Notice that we had to use a constructor for this. This means it’s a user-defined
    conversion sequence and not a standard conversion sequence. It doesn’t matter
    that std::string is a standard library type; it still counts as user-defined.
    The rules are the same for you and the standard library.


    Now the compiler has found a valid conversion sequence from our “array of 12 const
    char” to the parameter type of each overload and has to figure out which sequence
    is best:


    Conversion sequence for void serialize(const void*)


    const char[12]  longrightarrow const char *  longrightarrow const void *  Standard
    conversion,

    no new objects created


    Conversion sequence for void serialize(const std::string&)


    const char[12]  longrightarrow const char *  longrightarrow std::string  User
    defined conversion,

    new std::string object created!


    We only require a standard conversion sequence (top), to call the const void*
    overload. To call the std::string overload, we need a user defined conversion
    sequence (bottom), which involves creating a new temporary std::string object.
    A standard conversion sequence is always better than a user-defined conversion
    sequence, so the first overload gets called, and const void* is printed.'
