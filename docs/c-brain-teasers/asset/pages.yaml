  md: 'Initialization from a braced-init-list is called list-initialization, and the
    braced-init-list is unfortunately called an initializer list in these contexts.
    An initializer list is not the same as the class template std::initializer_list<T>.
    The names are rather confusing.


    So if {1,2} isn''t a std::initializer_list, why does it pick the std::initializer_list
    constructor? Overload resolution has a special case for list-initialization where
    it happens in two phases:


    +   - First, it does overload resolution for all constructors taking a std::initializer_list,
    treating the braced-init-list as one single argument.

