  md: "# How to Use This Book\n\nThe book contains 25 C++ puzzles with answers and\
    \ explanations. Most will be well-formed programs, which the C++ standard guarantees\
    \ the output. Some might, however, have a compilation error, and some might have\
    \ undefined or unspecified behavior. Your task is to figure out what happens when\
    \ you compile and run the program in each puzzle on a conforming C++ implementation.\n\
    \nTake this imaginary puzzle as an example. It's a complete C++ program with a\
    \ main function:\n\n```\n#include <iostream>\n\nint main()\n{\n    std::cout <<\
    \ (1 < 2);\n}\n```\n\nYour task will be to read through the code and try to guess\
    \ what the output will be when the program is compiled and run. Always make sure\
    \ you give it a proper go before turning the page to look at the answer!\n\nPlease\
    \ note a few technicalities:"
