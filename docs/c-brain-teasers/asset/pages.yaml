  md: '+   - For brevity, I declare main with no parameters (no argc / argv) and don’t

    explicitly return a value. These are all optional, omitting them makes

    puzzles slightly easier to read.


    +   - I use struct instead of class for all the puzzles. There’s no semantic difference

    —structs just have public rather than private as the default visibility for

    members, so we don''t have to put public: everywhere.


    +   - As always in C++, bools are printed as 1 and 0 by default, not true and
    false.


    The answer to the puzzle is that 1 is less than 2, so the program prints 1

    (representing true).


    Getting the answers right is only half the fun, though. The other half is

    understanding why it works the way it does. The puzzles are excuses to learn

    more about how C++ works under the hood. I encourage you to read the

    explanations thoroughly enough to understand them.'
