    You can also try the code directly in your browser by pasting it into an online
    compiler. I highly recommend Compiler Explorer,[5] where you can choose from and
    compare different compiler versions and architectures, try out different optimization
    levels, and add other compiler flags, sanitizer options, and so forth.


    Let’s get started! Oh, and beware of the demons.


