    One of the great things about C++ is that constructed objects get destroyed automatically
    and deterministically (unless you manually call new, which these days should be
    left to library authors). You''ll find no need for Python''s with C#''s using,
    and rarely a need for something like finally.


    But only constructed objects get destroyed, so what does it mean to be constructed?
    And what happens in the case of "half-constructed" objects like the Machine instance
    here, which throws during construction?


    An object is only deemed to be constructed when initialization has completed.
    The initialization of a class object goes in this order:


    +   * Virtual base classes

    * Direct base members

    * Non-static data members (like Machine::engine_)

    * The constructor body


    So when we''re constructing the Machine object, we first initialize the Engine
    member. As soon as this is done, engine_ is deemed constructed and will eventually
    have to be destroyed. Then we get to the Machine constructor body, which throws
    an exception. The initialization of Machine did not complete, and it''s not deemed
    constructed. Only the Engine destructor gets called, not the Machine destructor.'
