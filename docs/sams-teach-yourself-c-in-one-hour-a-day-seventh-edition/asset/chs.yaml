  ]\n]\n]\n]\n]\n]\n]\n]\n]\n[/\n]\n[/content]\n[/content]\n## C 风格字符串\n\nC 风格字符串是字符数组的一种特例。你已经看到一些以字符串字面量形式编写的\
  \ C 风格字符串示例，你一直在将它们写到代码中：\n\n[content]\n点击此处查看代码图像\n```cpp\nstd::cout << \"Hello\
  \ World\";\n```\n[/content]\n\n这等同于使用数组声明：\n\n[content]\n点击此处查看代码图像\n```cpp\nchar\
  \ SayHello[] = {'H', 'e', 'l', 'l', 'o', ' ', 'W', 'o', 'l', 'd', '\\0'};\nstd::cout\
  \ << SayHello << std::endl;\n```\n[/content]\n\n注意数组中的最后一个字符是空字符 `\\0`。这也被称为字符串终止字符，因为它告诉编译器字符串已结束。此类\
  \ C 风格字符串是字符数组的特例，因为最后一个字符总是紧邻空终止符 `\\0` 之前。当你代码中嵌入字符串字面量时，编译器会这样做。此类 C 风格字符串是字符数组的特例，最后一个字符总是紧邻空终止符\
  \ `\\0` 之前。当你代码中嵌入字符串字面量时，编译器会这样做。此类 C 风格字符串是字符数组的特例，最后一个字符总是紧邻空终止符 `\\0` 之前。当你代码中嵌入字符串字面量时，编译器会这样做。此类\
  \ C 风格字符串是字符数组的特例，最后一个字符总是紧。空终止符 `\\0` 。\n\n[content]\n### 输出\n\n点击此处查看代码图像\nNumber\
  \ of integers in array: 3\nEnter another number for the array\n2011\nNumber of integers\
  \ in array: 4\nLast element in array: 2011\n[/content]\n\n### 分析\n\n不要担心列表 4.4 中的语法，因为\
  \ `vector` 和模板尚未解释。尝试观察输出并将其与代码联系起来。根据输出，数组的初始大小为 3，这与第 7 行中 `vector` 的声明一致。得知这一点后，你仍然在第\
  \ 15 行要求用户输入第四个数字，有趣的是，你能够在第 18 行使用 `push_back()` 将此数字推入 `vector` 中。`vector` 会动态调整自己的的大小以适应更多数据。这可以通过数组大小增加到\
  \ 4 看到。注意使用熟悉的静态数组语法来访问 `vector` 中的数据。第 22 行使用从 0 开始的索引访问最后一个元素（考虑到是在运行时计算的位置，无论它在哪里），其中最后一个元素位于索引“size\
  \ – 1”处，而 `size()` 返回 `vector` 中元素（整数）的总数。\n\n### 注意\n\n要使用动态数组类 `std::vector`，你需要包含头文件\
  \ `vector`，这在列表 4.4 的第 1 行中所示。\n\n```cpp\n#include <vector>\n```\n\n`Vectors` 将课程\
  \ 17 中更详细地解释，“STL 动态数组类](#ch17.html_ch17)。”\n\n[/content]\n[/content]\n[/content]\n\
