  \ 行所示如何填充变量。\n\n#### 使用 std::cin::get 输入到 C 缓冲区\n就像 `cin` 允许你直接写入 `int` 一样，对 C 风格的\
  \ `char` 数组也可以这样做：\n\n点击此处查看代码图像\n\n```cpp\ncout << \"Enter a line: \" << endl;\n\
  char CStyleStr [10] = {}; // 可以包含 10 个字符\ncin >> CStyleStr; // 危险：用户可能输入超过 10 个字符\n\
  ```\n\n写入 C 风格字符串时，不要超出缓冲区边界以避免崩溃或安全漏洞。因此，读取 C 风格 `char` 缓冲区的更好方法是：\n\n点击此处查看代码图像\n\
  \n```cpp\ncout << \"Enter a line: \" << endl;\nchar CStyleStr[10] = {};\ncin.get(CStyleStr,\
  \ 9); // 在第 9 个字符处停止插入\n```\n\n这种更安全的向 C 缓冲区插入文本的方法由列表 27.5 演示。\n\n**列表 27.5. 在不超出边界的情况下插入\
  \ C 缓冲区**\n\n点击此处查看代码图像\n\n```cpp\n0: #include<iostream>\n1: #include<string>\n\
  2: using namespace std;\n3:\n4: int main()\n5: {\n6:     cout << \"Enter a line:\
  \ \" << endl;\n7:     char CStyleStr[10] = {0};\n8:     cin.get(CStyleStr, 9);\n\
  9:     cout << \"CStyleStr: \" << CStyleStr << endl;\n10:\n11:    return 0;\n12:\
  \ }\n```\n\n### 输出\n点击此处查看代码图像\n\nEnter a line:\nTesting if I can cross the bounds\n\
  CStyleStr: Testing\n\n### 分析\n如输出所示，由于使用了第 8 行的 `cin::get`，你将用户输入的前九字符读入了 C 缓冲区。这是处理\
  \ C 风格字符串的安全方法。\n\n### 提示\n尽可能不要使用 C 风格字符串和 `char` 数组。尽可能使用 `std::string` 代替 `char*`。\n\
  \n#### 使用 std::cin 输入到 std::string\n`cin` 是一个多功能的工具，你甚至可以用它直接从用户处扫描字符串到 `std::string`：\n\
  \n点击此处查看代码图像\n\n```cpp\nstring Input;\ncin >> Input; // 在第一个空格处停止插入\n```\n\n列表 27.6\
  \ 演示了使用 `cin` 输入到 `std::string`。\n\n**列表 27.6. 使用 cin 插入文本到 std::string**\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include<iostream>\n1: #include<string>\n2: using namespace std;\n\
  3:\n4: int main()\n5: {\n6:     cout << \"Enter your name: \";\n7:     string Name;\n\
  8:     cin >> Name;\n9:     cout << \"Hi \" << Name << endl;\n10:\n11:    return\
  \ 0;\n12: }\n```\n\n### 输出\n点击此处查看代码图像\n\nEnter your name: Siddhartha Rao\nHi Siddhartha\n\
  \n### 分析\n输出没有仅显示我的名字，是因为程序是这样设计的。我原以为第 8 行使用 `cin` 填充的 `Name` 应该包含我的全名输入，而不仅仅是名字。那么发生了什么？显然，`cin`\
  \ 在遇到第一个空白字符时停止插入。\n\n为了允许用户输入整行（包括空格），你需要使用 `getline()`：\n\n```cpp\nstring Name;\n\
  getline(cin, Name);\n```\n\n这种结合 `cin` 使用 `getline()` 的用法在列表 27.7 中演示。\n\n\n\n\n\
  \n# 列表 27.7. 使用 `getline()` 和 `cin` 读取用户的整行输入\n\n点击此处查看代码图像\n\n```cpp\n0: #include<iostream>\n\
  1: #include<string>\n2: using namespace std;\n3:\n4: int main()\n5: {\n6:     cout\
  \ << \"Enter your name: \";\n7:     string Name;\n8:     getline(cin, Name);\n9:\
  \     cout << \"Hi \" << Name << endl;\n10:\n11:     return 0;\n12: }\n```\n\n###\
  \ 输出\n点击此处查看代码图像\n```\nEnter your name: Siddhartha Rao\nHi Siddhartha Rao\n```\n\
  \n### 分析\n如第 8 行所示，`getline()` 起到了确保空白字符不被跳过的作用。现在的输出包含了用户输入的完整行行。\n\n## 使用 std::fstream\
  \ 进行文件处理\n\n`std::fstream` 是 C++ 提供的一个类，用于（相对）平台无关的文件访问。`std::fstream` 继承自 `std::ofstream`\
  \ 用于写入文件，继承自 `std::ifstream` 用于读取文件。\n\n换句话说，`std::fstream` 为你提供了同时读和写的功能。\n\n**提示**\n\
  要使用类 `std::fstream` 或其基类，请包含头文件：\n```cpp\n#include <fstream>\n```\n\n### 使用 open()\
  \ 和 close() 打开和关闭文件\n\n要使用 `fstream`、`ofstream` 或 `ifstream` 类，你需要使用 `open()` 方法打开文件：\n\
  \n点击此处查看代码图像\n\n```cpp\nfstream myFile;\nmyFile.open(\"HelloFile.txt\",ios_base::in|ios_base::out|ios_base::trunc);\n\
  if (myFile.is_open())\n{\n   // 在此处执行读取或写入\n   myFile.close();\n}\n```\n\n`open()`\
  \ 取两个参数：第一个是正在打开的文件的路径和名称（如果不提供路径，它将假设应用程序使用当前目录设置），第二个是打开文件的模式。所选模式允许在文件存在时也创建它（`ios_base::trunc`），并允许你对文件进行读写（`in\
  \ | out`）。\n\n注意使用 `is_open()` 来测试 `open()` 是否成功。\n\n**注意**\n记住关闭文件流对于保存其内容至关重要。\n\
  \n打开文件流的另一种替代方法是直接通过构造函数：\n\n点击此处查看代码图像\n\n```cpp\nfstream myFile(\"HelloFile.txt\"\
  ,ios_base::in|ios_base::out|ios_base::trunc);\n```\n\n或者，如果你只想以写入模式打开文件，请使用：\n```cpp\n\
  ofstream myFile(\"HelloFile.txt\", ios_base::out);\n```\n\n如果你想以读取模式打开文件，请使用这个：\n\
  ```cpp\nifstream myFile(\"HelloFile.txt\", ios_base::in);\n```\n\n**提示**\n无论你使用构造函数还是成员方法\
  \ `open()`，建议在继续使用相应的文件流对象之前，通过 `is_open()` 检查文件是否成功打开。\n\n文件流可以打开的各种模式如下：\n- `ios_base::app`——追加到现有文件的末尾而不是截断它们\n\
  - `ios_base::ate`——将你置于文件末尾，但你可以在文件的任何位置写入数据\n- `ios_base::trunc`——导致现有文件被截断（默认值）\n\
  - `ios_base::binary`——创建二进制文件（默认是文本）\n- `ios_base::in`——仅用于读取操作打开文件\n- `ios_base::out`——仅用于写入操作打开文件\n\
  \n### 使用 open() 和 operator<< 创建并写入文本文件\n\n在打开文件流后，你可以使用 `operator <<` 向其写入，如列表 27.8\
  \ 所示。\n\n列表 27.8. 使用 ofstream 创建新文本文件并向其中写入文本\n\n点击此处查看代码图像\n\n```cpp\n0: #include<fstream>\n\
  1: #include<iostream>\n2: using namespace std;\n3:\n4: int main()\n5: {\n6:    \
  \ ofstream myFile;\n7:     myFile.open(\"HelloFile.txt\", ios_base::out);\n8:\n\
  9:     if (myFile.is_open())\n10:    {\n11:        cout << \"File open successful\"\
  \ << endl;\n12:\n13:        myFile << \"My text file!\" << endl;\n14:        myFile\
  \ << \"Hello file!\";\n15:\n16:        cout << \"Finished writing to file, will\
  \ close now\" << endl;\n17:        myFile.close();\n18:    }\n19:\n20:     return\
