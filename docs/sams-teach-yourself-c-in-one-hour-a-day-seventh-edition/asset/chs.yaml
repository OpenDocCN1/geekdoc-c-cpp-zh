  \n### 将容器中的元素初始化为特定值\n\n`fill()` 和 `fill_n()` 是 STL 算法，用于帮助将给定范围的内容设置为指定值。`fill()`\
  \ 用于在给定的范围边界和要插入的值的限制下，重写该范围内的元素：\n\n点击此处查看代码图像\n\n```\nvector <int> vecIntegers\
  \ (3);\n\n// 将容器中的所有元素填充为值 9\n\nfill (vecIntegers.begin (), vecIntegers.end (),\
  \ 9);\n```\n\n如名所示，`fill_n()` 重置指定的 `n` 个值。它需要一个起始位置、一个计数和一个填充值：\n\n点击此处查看代码图像\n\
  \n```cpp\nfill_n (vecIntegers.begin () + 3, /*count*/ 3, /*fill value*/ -9);\n```\n\
  \n列表 23.4 演示了这些算法如何让初始化 `vector<int>` 中的元素变得简单。\n\n列表 23.4. 使用 fill() 和 fill_n()\
  \ 设置容器中的初始值\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <vector>\n\
  2: #include <iostream>\n3:\n4: int main ()\n5: {\n6:      using namespace std;\n\
