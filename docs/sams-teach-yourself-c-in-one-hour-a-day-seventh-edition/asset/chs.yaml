  \ `find()` 操作的结果。\n\n## 在 STL multimap 中查找元素\n\n如果 代码列表 20.3 是一个 `multimap`（这意味着容器可能包含多个具有相同键的键值对），你需要找到与重复键对应的值。因此，在\
  \ `multiset` 的情况下，你将使用 `multiset::count()` 来查找与键对应的值的数量，并递增迭代器以访问随后的放置的值。\n\n点击此处查看代码图像\n\
  \n```cpp\nauto iPairFound = mmapIntToString.find(Key);\n\n// 检查 \"find\" 是否成功\n\
