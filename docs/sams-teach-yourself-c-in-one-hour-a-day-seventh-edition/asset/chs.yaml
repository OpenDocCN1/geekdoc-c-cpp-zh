  \ 该程序源自 Listing 2.4，演示了减法和乘法：\n\n点击此处查看代码图片\n\n```cpp\n#include <iostream>\n#using\
  \ namespace std;\n\n// 函数声明\nint DemoConsoleOutput();\n\nint main()\n{\n    // 调用函数，i.e.\
