  \n1. 编写一个乘以两个数字的宏。\n\n2. 编写一个 `swap` 的模板版本。\n\n3. 实现一个交换两个变量的模板函数`。\n\n4. 错误修复：你如何改进计算输入值四分之一的宏？\n\
  \n```cpp\n#define QUARTER(x) (x / 4)\n```\n\n5. 编写一个持有通过类定义的数组的模板类。\n\n# 第三部分：学习标准模板库\
  \ (STL)\n\n## 第 15 节 标准模板库简介\n\n简单来说，标准模板库（STL）是一组模板类和函数，为程序员提供\n\n- 用于存储信息的容器\n\
  - 用于访问信息的迭代器\n- 用于操作内容的算法\n\n在本节中，你将概述这三块支柱。\n\n### STL 容器\n\n容器是用于存储数据的 STL 类。STL\
  \ 提供了两种容器类型：\n\n- 顺序容器\n- 关联容器\n\n除了这些，STL 还提供了称为容器适配器的类，它们是特定特定变体。\n\n#### 顺序容器\n\
  \n正如名称所示，是以顺序方式存放数据的容器，例如数组和列表。顺序容器的特点是插入速度快，但 `find` 操作相对慢。\n\nSTL 顺序容器有\n\n- `std::vector`\
  \ 类似于动态数组并在末端增长。将 vector 想象成书架，你可以在一端添加或移除书籍。\n- `std::deque` 类似于 `std::vector`，但在开头也可以插入或删除元素。\n\
  - `std::list` 类似于双链表。将其想象成链条，每个对象是一个链接。你可以在任何位置添加或删除链接——即对象。\n- `std::forward_list`\
  \ 类似于 `std::list`，但它是单链表，允许你只向一个方向迭代。\n\n\n\n\n\n你可以将 STL `list` 视为 STL 对普通链表的实现。尽管\
  \ `list` 中的元素不能像 STL `vector` 那样进行随机访问，但 `list` 可以将元素组织在非连续的内存区域中。因此，`std::list`\
  \ 不存在 `vector` 在需要重新分配内部数组时会遇到的性能问题。STL list 类在第 18 节“STL `list` 与 `forward_list`”中进行了详细讨论。\n\
  \n## 关联容器\n\n`关联容器`是那些以排序方式存储数据的容器——类似于字典。这导致了较慢的插入时间，但在搜索方面具有显著优势。\n\nSTL 提供的关联容器包括：\n\
  \n- `std::set`——在具有对数时间复杂度的容器中，在插入时对唯一值进行排序存储。\n- `std::unordered_set`——在具有近常数时间复杂度的容器中，在插入时对唯一值进行排序存储。从\
  \ C++11 开始可用。\n- `std::map`——在具有对数时间复杂度的容器中，根据其唯一键对键值对进行排序。\n- `std::unordered_map`——在具有近常数时间复杂度的容器中，根据其唯一键对键值对进行排序。从\
  \ C++11 开始可用。\n- `std::multiset`——类似于 `set`。此外，支持存储多个具有相同值的项；也就是说，值不需要是唯一的。\n- `std::unordered_multiset`——类似于\
  \ `unordered_set`。此外，支持存储多个具有相同值的项；也就是说，值不需要是唯一的。从 C++11 开始可用。\n- `std::multimap`——类似于\
  \ `map`。此外，支持存储键不需要唯一的键值对。\n- `std::unordered_multimap`——类似于 `unordered_map`。此外，支持存储键不需要唯一的键值对。从\
  \ C++11 开始可用。\n\nSTL 容器的排序可以通过编程谓词函数进行自定义。\n\n**提示**\n\n某些 STL 的实现还提供了关联容器，如 `hash_set`、`hash_multiset`、`hash_map`\
  \ 和 `hash_multimap`。这些与标准支持的 `unordered_*` 容器类似。在某些场景下，`hash_*` 变体可能更适合搜索元素，因为它们提供了常数时间操作（独立于容器中元素的数量）。通常，这些容器还提供了与其标准对应部分相同的公共方法，因此同样易于使用。\n\
  \n使用符合标准的变体将使得代码在不同平台和编译器之间更容易迁移，因此应被优先考虑。此外，符合标准的容器在性能上的对数级下降可能不会显著影响你的应用程序。\n\n\
  ## 选择合适的容器\n\n显然，你的应用程序可能有多个 STL 容器可以满足的要求。这需要进行选择，而且这种选择很重要，因为错误的选择可能会导致功能性应用程序性能不佳。\n\
  \n因此，在选择容器之前，评估它们的优缺点至关重要。更多信息请参见表 15.1。\n\n表 15.1 STL 容器类的属性\n\n![Image](img/15tab01a.jpg)![Image](img/15tab01b.jpg)![Image](img/15tab01c.jpg)![Image](img/15tab01d.jpg)\n\
  \n## 容器适配器\n\n`容器适配器`是顺序和关联容器的变体，其功能有限，旨在实现特定的目的。主要的适配器类有：\n\n- `std::stack`——以后进先出（LIFO）的方式存储元素，允许在栈顶插入（推送）和移除（弹出）元素。\n\
  - `std::queue`——以先进后出（FIFO）的方式存储元素，允许按照插入顺序移除第一个元素。\n- `std::priority_queue`——以排序顺序存储元素，使得值评估为最高的元素始终位于队列最前。\n\
  \n这些容器在第 24 节“自适应容器：栈与队列”中 string 了详细讨论。\n\n## STL 迭代器\n\n迭代器最简单的例子是指针。给定一个指向数组第一个元素的指针，你可以递增它以指向下一个元素，或者在很多情况下操作该位置的元素。\n\
  \nSTL 中的迭代器是模板类，它们在某些方面是指针的泛化。这些模板类为程序员提供了一个句柄，通过该句柄可以处理和操作 STL 容器并对其执行操作。注意，这些操作也可以是模板函数的\
  \ STL 算法，迭代器是允许这些模板函数与容器（即模板类）以一致且无缝的方式工作的桥梁。\n\nSTL 提供的迭代器大致分类为以下类：\n\n- `输入迭代器（Input\
  \ iterator）`——可以被解引用以引用对象。例如，对象可以在集合中。最纯的输入迭代器保证只读访问。\n- `输出迭代器（Output iterator）`——允许程序员写入集合。最严格类型的输出迭代器保证只写访问。\n\
  \n上述列表中提到的基本迭代器类型进一步细分为：\n\n- `前向迭代器（Forward iterator）`——输入和输出迭代器的细化，同时允许输入和输出。前向迭代器可以是常量的，允许对所指向的对象进行只读访问，否则允许进行读和写操作，使其变为可变。前向迭代器通常用于单链表。\n\
  - `双向迭代器（Bidirectional iterator）`——前向迭代器的细化，区别在于它也可以递减以向后移动。双向迭代器通常用于双链表。\n- `随机访问迭代器（Random\
  \ access iterators）`——通来说，它是对双向迭代器概念的细化，允许偏移量的加减，或者允许一个迭代器减去另一个迭代器以找到集合中两个对象之间的相对间隔或距离。随机迭代器通常用于数组。\n\
  \n**注意**\n\n在实现层面，`细化（refinement）`可以被视为`继承（inheritance）`或`特化（specialization）`。\n\
  \n## STL 算法\n\n查找、排序、反转等是标准的编程需求，不需要程序员重新编写实现来实现支持。这正是为什么 STL 以 STL 算法的形式提供了这些函数，它们通过迭代器与容器良好配合，帮助程序员处理一些常见的需求。\n\
  \n常用的 STL 算法包括：\n\n- `std::find`——帮助在集合中查找值。\n- `std::find_if`——帮助根据特定的用户定义谓词在集合中查找值。\n\
  - `std::reverse`——反转集合。\n- `std::remove_if`——帮助根据自定义谓词从集合中移除项。\n- `std::transform`——帮助对容器中的元素应用自定义转换函数。\n\
  \n这些算法是 `std` 命名空间中的模板函数，并且需要标准头文件 `<algorithm>`。\n\n### 容器与算法通过迭代器进行的交互\n\n\n\n\
  \n\n让我们通过示例来研究迭代器是如何无缝连接容器和 STL 算法的。列表 15.1 所示的程序使用了 STL 顺序容器 `std::vector`（类似于动态数组）来存储整数，然后使用\
  \ `std::find` 算法在集合中查找一个。注意迭代器是如何形成连接这两者的桥梁的。不必担心语法或功能的复杂性。`std::vector` 等容器和 `std::find`\
  \ 等算法已在第 17 节“STL 动态数组类”和第 23 节“STL 算法”中进行了详细讨论。如果你觉得这部分复杂，可以暂时跳过本节。\n\n#### 列表\
  \ 15.1. 在 Vector 中查找元素及其位置\n\n点击此处查看代码图片\n\n```\n1: #include <iostream>\n2: #include\
  \ <vector>\n3: #include <algorithm>\n4: using namespace std;\n5:\n6: int main ()\n\
  7: {\n8:     // 一个整数型动态数组\n9:     vector <int> vecIntegerArray;\n10:\n11:     //\
  \ 将样本整数插入数组\n12:     vecIntegerArray.push_back (50);\n13:     vecIntegerArray.push_back\
  \ (2991);\n14:     vecIntegerArray.push_back (23);\n15:     vecIntegerArray.push_back\
  \ (9999);\n16:\n17:     cout << \"The contents of the vector are: \" << endl;\n\
  18:\n19:     // 使用迭代器遍历 vector 并读取值\n20:     vector <int>::iterator iArrayWalker\
  \ = vecIntegerArray.begin ();\n21:\n22:     while (iArrayWalker != vecIntegerArray.end\
  \ ())\n23:     {\n24:         // 将值写入屏幕\n25:         cout << *iArrayWalker << endl;\n\
  26:\n27:         // 增迭代器以访问下一个元素\n28:         ++ iArrayWalker;\n29:     }\n30:\n\
  31:     // 使用 'find' 算法在数组中查找元素（例如 2991）...\n32:     vector <int>::iterator iElement\
  \ = find (vecIntegerArray.begin ()\n33:                               ,vecIntegerArray.end\
  \ (), 2991);\n34:\n35:     // 是否找到了值\n36:     if (iElement != vecIntegerArray.end\
  \ ())\n37:     {\n38:         // 找到了值... 确定在数组中的位置：\n39:         int Position =\
  \ distance (vecIntegerArray.begin (), iElement);\n40:         cout << \"Value \"\
  << *iElement;\n41:         cout << \" found in the vector at position: \" << Position\
  \ << endl;\n42:     }\n43:\n44:     return 0;\n45: }\n```\n\n### 输出\n\n点击此处查看代码图片\n\
  \nThe contents of the vector are:\n50\n2991\n23\n9999\nValue 2991 found in the vector\
  \ at position: 1\n\n### 分析\n\n列表 15.1 展示了迭代器在遍历 `vector` 中的用法，以及作为接口帮助连接 `find`\
  \ 等算法与 `vector` 等容器（该容器包含了算法旨在要操作的数据）。迭代器对象 `iArrayWalker` 在第 20 行声明并初始化为开头。\n\n\
  #### C++11: 使用 auto 定义类型\n\n列表 15.1 展示了迭代器在遍历 `vector` 中的用法，以及作为接口帮助连接 `find` 等算法与\
  \ `vector` 等容器（该容器包含了算法旨在要操作的数据）。迭代器对象 `iArrayWalker` 在第 20 行声明并初始化为开头。\n\n####\
  \ STL 字符串类\n\nSTL 提供了一个为字符串设计的模板类：\n- `std::string`——基于 `char` 的 `basic_string`\
  \ 特化版本\n- `std::wstring`——基于 `wchar_t` 的 `basic_string` 特化版本\n\n### 总结\n\n在本节中，你学习了容器、迭代器和算法的基础概念。你接触了\
  \ `basic_string`，后续会有更详细的讨论。第 17 节到第 25 节解释了这些概念的实现。\n\n### 问答\n\n**问:** 我需要使用数组。我不知道需要包含多少个元素。我应该使用哪种\
  \ STL 容器？\n**答:** `std::vector` 或 `std::deque` 非常适合这种需求。它们都能管理内存并根据应用程序的需求进行动态扩展。\n\
  \n**问:** 我的应用程序涉及频繁搜索。我应该选择哪种容器？\n**答:** 像 `std::map` 或 `std::set` 等关联容器或其无序变最适合频繁搜索的需求。\n\
  \n**问:** 我需要存储键值对以便快速查找。然而，用例可能会产生多个不唯一的键。我应该选择哪种容器？\n**答:** 类型为 `std::multimap`\
  \ 的关联容器适合这种需求。`multimap` 可以持有非唯一的键值对，并提供关联容器特有的快速查找功能。\n\n**问:** 一个应用程序需要在不同的平台和编译器之间移植。需要一个可以根据键进行快速查找的容器。我应该使用\
  \ `std::map` 还是 `std::hash_map`？\n**答:** 可可移植性是一个重要的限制，使用符合标准的容器是必要的。如果你在所有相关平台上都使用符合\
  \ C++1 标准的编译器，你也可以使用 `std::unordered_map`。\n\n\n\n\n\n本练习包含测验题，旨在帮助巩固你对涵盖内容的理解。在查看附录\
  \ D 中的答案之前，请尝试回答这些问题，并在进入下一节之前确保你已经理解了答案。\n\n#### 测验\n\n1. **1.** 对于一个必须包含对象数组且可以在顶部和底部进行插入的容器，你会选择哪种？\n\
  2. **2.** 你需要存储元素以便进行快速查找。你会选择哪种容器？\n3. **3.** 你需要在 `std::set` 中存储元素，但仍需根据不一定是元素值的条件来更改存储和查找准则。这可能吗？\n\
  4. **4.** STL 的哪个部分帮助连接算法与容器，以便算法能够对这些元素进行操作？\n5. **5.** 在需要迁移到不同平台并使用不同 C++ 编译器构建的应用程序中，你会选择使用容器\
  \ `hash_set` 吗？\n\n## 第 16 节 STL String 类\n\n标准模板库 (STL) 为程序员提供了一个辅助字符串操作和处理的容器类。`string`\
  \ 类不仅能够动态调整其自身的大小以适应应用程序的需求，还提供了实用的辅助函数或方法，帮助处理和使用字符串。因此，它能帮助程序员在应用程序中使用标准的、可移植的且经过测试的功能，并将精力集中在开发对程序至关重要的特性上。\n\
  \n在本节中，你将学习到：\n\n- 为什么字符串处理类是必要的\n- 如何使用 STL 的 `string` 类\n- STL 如何帮助你轻松地进行连接、追加、查找并执行其他字符串操作\n\
  - 如何使用基于模板实现的 STL `string`\n\n### 字符串处理类的必要性\n\n在 C++ 中，`string` 是一个字符数组。正如你在第 4\
  \ 节中“管理数组和字符串”中所所示，最简单的字符数组可以如下定义：\n\n```\nchar staticName [20];\n```\n\n`staticName`\
  \ 是一个固定（因此是静态的）长度为 20 个元素的字符数组（也称为字符串）的声明。如你所示，这个缓冲区可以存放有限长度的字符串，如果你尝试在其中存储更多的字符，它很快就会溢出。调整这个静态分配数组的大小是不可能的。为了克服这一限制，C++\
  \ 提供了数据的动态分配。因此，`string` 数组的一种更具动态性的表示方式是：\n\n```\nchar* dynamicName = new char\
  \ [ArrayLength];\n```\n\n`dynamicName` 是一个动态分配的字符数组，它可以实例化为存储在值 `ArrayLength` 中的长度，该长度可以在运行时确定，因此可以分配来存储变长的数据。然而，如果你想在运行时更改数组的长度，必须先释放已分配的内存，然后重新分配以存储所需的数据。\n\
  \n如果这些 `char*` 字符串被用作类的属性，情况就会变得复杂。在将该类的对象赋值给另一个对象的情况下，如果没有正确编写拷贝构造函数和赋值运算符，这两个对象将包含指针的拷贝，本质上指向同一个\
  \ `char` 缓冲区。结果是在两个对象中有两个字符串指针，每个都持有相同的地址，因此指向内存中的相同位置。第一个对象的析毁会导致另一个对象中的指针失效，崩溃的危险迫在眉睫。\n\
  \n字符串类为你解决了这些问题。STL 字符串类——建模字符字符串的 `std::string` 和建模宽字符字符串的 `std::wstring`——通过以下方式帮助你：\n\
  \n- 减少创建和处理字符串的工作量\n- 通过在内部管理内存分配细节，增加所编写程序的的稳定性\n- 提供拷贝构造函数和赋值运算符，自动确保成员字符串被正确拷贝\n\
  - 提供实用的实用函数，例如帮助进行拷贝、截断、查找和删除等\n- 提供帮助进行比较的运算符\n- 将精力集中在应用程序的主要需求上，而不是字符串处理细节上\n\
  \n***\n\n注意：`std::string` 和 `std::wstring` 实际上是同一个类的模板特化，分别是针对类型 `char` 和 `wchar_t`\
  \ 的 `std::basic_string<T>`。当你学会了使用其中一个后，你就可以在另一个上使用相同的方法和运算符。\n\n***\n\n你很快就会学习\
  \ STL 字符串类提供的某些有用辅助函数，并以 `std::string` 为例。\n\n### 使用 STL String 类\n\n最常用的字符串函数有：\n\
  \n- 拷贝\n- 连接\n- 查找字符和子字符串\n- 截断\n- 字符串反转和大小写转换，这些通过标准库提供的算法实现\n\n要使用 STL 字符串类，必须包含头文件\
  \ `<string>`。\n\n### 实例化 STL String 并进行拷贝\n\n`string` 类具有许多重载的构造函数，因此可以用许多不同的方式进行实例化和初始化。例如，你可以简单地将常量字符字符串字面量初始化或赋值给普通的\
  \ STL `std::string` 对象：\n\n点击此处查看代码图片\n\n```\nconst char* constCStyleString = \"\
  Hello String!\";\nstd::string strFromConst (constCStyleString);\n```\n\n或者\n\n```\n\
  std::string strFromConst = constCStyleString;\n```\n\n上述代码类似于：\n\n点击此处查看代码图片\n\n\
  ```\nstd::string str2 (\"Hello String!\");\n```\n\n显而易见，实例化 `string` 对象并对其赋值一个值不需要提供字符串的长度或内存分配细节——`string`\
  \ 类的构造函数会自动完成。同样，可以使用一个 `string` 对象来初始化另一个：\n\n点击此处查看代码图片\n\n```\nstd::string str2Copy\
  \ (str2);\n```\n\n你也可以指示 `string` 构造函数仅接受输入字符串的前 *n* 个字符：\n\n点击此处查看代码图片\n\n```\n\
  // 初始化另一个字符串的前 5 个字符\nstd::string strPartialCopy (constCStyleString, 5);\n```\n\n\
  你还可以初始化 `string` 以包含特定数量的字符：\n\n点击此处查看代码图片\n\n```\n// 初始化一个包含 10 个 'a' 的字符串\nstd::string\
  \ strRepeatChars (10, 'a');\n```\n\n列表 16.1 分析了常用的 `std::string` 实例化和拷贝技术。\n\n列表\
  \ 16.1 STL 实例化与拷贝技术\n\n点击此处查看代码图片\n\n***\n\n```cpp\n#include <string>\n#include\
