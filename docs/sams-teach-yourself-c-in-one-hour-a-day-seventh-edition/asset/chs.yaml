  \ `ifstream::read` 功能无法正确读取使用旧版本创建的二进制。\n\n### 使用 std::stringstream 进行字符串转换\n\n\
  你有一个字符串，其中包含一个值为 `45` 的字符串。你如何将这个字符串值转换为值为 `45` 的整数？反之亦然？C++ 提供的最实用的工具之一是 `class\
  \ stringstream`，它允许你执行各种转换。\n\n### 提示\n\n要使用 `std::stringstream` 类，请包含头文件：\n\n```cpp\n\
  #include <sstream>\n```\n\n列表 27.11 显示了一些简单的 `stringstream` 操作。\n\n列表 27.11 使用 std::stringstream\
  \ 将整数转换为字符串表示并反之\n\n点击此处查看代码图像\n\n```cpp\n0: #include<fstream>\n1: #include<sstream>\n\
  2: #include<iostream>\n3: using namespace std;\n4:\n5: int main()\n6: {\n7:    \
  \ cout << \"Enter an integer: \";\n8:     int Input = 0;\n9:     cin >> Input;\n\
  10:\n11:    stringstream converterStream;\n12:    converterStream << Input;\n13:\
  \    string strInput;\n14:    converterStream >> strInput;\n15:\n16:    cout <<\
  \ \"Integer Input = \" << Input << endl;\n17:    cout << \"String gained from integer,\
  \ \" << strInput << endl;\n18:\n19:    stringstream anotherStream;\n20:    anotherStream\
  \ << strInput;\n21:    int Copy = 0;\n22:    anotherStream >> Copy;\n23:\n24:  \
  \  cout << \"Integer gained from string, \" << Copy << endl;\n25:\n26:    return\
  \ 0;\n27: }\n```\n\n### 输出\n\n点击此处查看代码图像\n\n输入整数：45\n整数输入 = 45\n从整数得到的字符串，strInput\
  \ = 45\n从字符串得到的整数，Copy = 45\n\n### 分析\n\n你要求用户输入一个整数。你首先如第 12 行所示，使用 `operator<<`\
  \ 将此整数插入到 `stringstream` 对象中。然后，你使用第 14 行的提取运算符 `operator>>` 将此整数转换为 `string`。之后，你使用该字符串作为起点，获取字符串\
  \ `strInput` 中持有的数值的整数表示 `Copy`。\n\n![图像](img/t0640.jpg)\n\n### 总结\n\n本节教会了 C++\
