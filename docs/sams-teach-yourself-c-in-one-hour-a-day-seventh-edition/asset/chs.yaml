  \n### 问答 (Q&A)\n\nQ. 如何声明一个整数类型的 map，使其按降序大小进行排序或存储？\n\nA. `map<int>` 定义了一个整数类型的\
  \ `map`。它使用默认的排序谓词 `std::less<T>` 按升序对项进行排序，也可以表示为 `map<int, less<int>>`。若要按降序排序，请将\
  \ `map` 定义为 `map<int, greater<int>>`。\n\nQ. 如果在字符串类型的 map 中插入两次字符串 \"Jack\"，会发生什么？\n\
  \nA. `map` 设计不用于插入非唯一的值。因此，`std::map` 类的实现不允许插入第二个值。\n\nQ. 在上一个示例中，如果我想有两个 \"Jack\"\
  \ 实例，我应该修改什么？\n\nA. 根据设计，`map` 只持有唯一值。你需要将所选的容器改为 `multimap`。\n\nQ. 哪个 multimap\
  \ 成员函数可以返回容器中特定值的项计数？\n\nA. `count(value)` 是我们关注的函数。\n\nQ. 我使用 `find()` 函数在 map\
  \ 中找到了一个元素，并获得了一个指向它的迭代器。我会使用这个迭代器来更改所指向的值吗？\n\nA. 不。某些 STL 实现可能允许用户通过 `find()`\
  \ 返回的迭代器更改 `map` 内部元素的值。但这并不是正确的做法。指向 `map` 中元素的迭代器应该被用作 `const` 迭代器——即使你的 STL 实现没有强制要求这一点。\n\
  \nQ. 我正在使用一个不支持 `auto` 的旧版编译器。我应该如何声明一个持有 `map::find()` 返回值的变量？\n\nA. 迭代器始终使用以下语法定义：\n\
  \n```cpp\ncontainer<Type>::iterator variableName;\nstd::map<int>::iterator iPairFound\
  \ = mapIntegers.find(1000);\nif (iPairFound != mapIntegers.end())\n    // 执行某些操作\n\
  ```\n\n### 工作坊 (Workshop)\n\n工作坊包含测验题，帮助你巩固对材料的理解，并提供练习让你获得所学知识的经验。在检查附录 D 中的答案之前，尝试回答测验，并在进入下一节之前确保你理解了答案。\n\
