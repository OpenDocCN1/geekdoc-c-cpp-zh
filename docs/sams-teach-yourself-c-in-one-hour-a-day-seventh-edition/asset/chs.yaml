  \    cout << \"Sorry, pair with key \" << Key << \" not in map\" << endl;\n```\n\
  \n### 提示\n\n如果你使用 C++11 编译器，可以通过 `auto` 关键字简化声明：\n\n```cpp\nauto iPairFound = mapIntToString.find(Key);\n\
  ```\n\n编译器会通过推断出 `find()` 返回值的类型。\n\n\n\n\n\n输入您想要查找的键：45\n\n键 45 指向的值：Forty Five\n\
