  \ Month (InputMonth), Year (InputYear) {};\n13:\n14:     // 二元加运算符\n15:     Date\
  \ operator + (int DaysToAdd)\n16:     {\n17:         Date newDate (Day + DaysToAdd,\
  \ Month, Year);\n18:         return newDate;\n19:     }\n20:\n21:     // 二元减运算符\n\
  22:     Date operator - (int DaysToSub)\n23:     {\n24:         return Date(Day\
