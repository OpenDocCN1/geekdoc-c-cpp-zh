  '` 中有多少个字符？\n\n## 4. 你忘记在 C 风格字符串结尾加上空终止符。使用它时会发生什么？\n\n## 5. 查看列表 4.4 中 `vector`\
  \ 的声明，并尝试编写一个包含 `char` 类型的动态数组。\n\n#### 练习\n\n#### 1. 定义一个表示棋盘上棋格的数组；数组的类型可以是 `enum`，用于定义棋子的性质。\n\
  \n## 2. 错误：这段代码片段有什么问题？\n\n点击此处查看代码图像\n\n```cpp\nint MyNumbers[5] = {0};\n\nMyNumbers[5]\
  \ = 45; // 将第 5 个元素设置为 45\n```\n\n#### 3. 错误：这段代码片段有什么问题？\n\n点击此处查看代码图像\n\n```cpp\n\
  int MyNumbers[5];\n\ncout << MyNumbers[3];\n```\n\n##表达式、语句与运算符\n\n程序的核心是一组按顺序执行的命令。这些命令被编写为表达式和语句，并使用运算符执行特定的计算或操作。\n\
  \n在本节中，你将学习：\n\n- 什么是语句\n- 什么是块或复合语句\n- 什么是运算符\n- 如何执行简单的算术逻辑操作\n\n### 语句\n\n语言——无论是口语还是编程——由一个一个执行的语句组成。让我们分析你学到的第一个重要语句：\n\
  \n```cpp\ncout << \"Hello World\" << endl;\n```\n\n使用 `cout` 的语句在屏幕上显示文本。C++ 中的所有语句都以分号（`;`）结束，这定义了语句的边界。这类似于你在英语句子结尾添加的句号（`.`）。下一个语句可以紧接分号开始，但为了方便和可读性，通常会在连续行上编写语句。换句话说，这实际上是同一行的两个语句：\n\
  \n点击此处查看代码图像\n\n```cpp\ncout << \"Hello World\" << endl; cout << \"Another hello\"\
  \ << endl; // 一行两个语句\n```\n\n> 注意：空白字符对编译器通常是不可见的。这包括空格、制表符、换行符、回车等。然而，字符串字量内部的空白会影响输出。\n\
  \n以下内容无效：\n\n点击此处查看代码图像\n\n```cpp\n    cout << \"Hello\n\n        World\" << endl;\
  \ // 不允许字符串字量内换行\n```\n\n此类代码通常会导致错误，指示编译器在第一行缺少结束引号（`\"`）和终止语句的分号（`;`）。如果你由于某些原因需要将语句跨越两行，可以通过末尾插入反斜杠（`\\\
  `）来实现：\n\n点击此处查看代码图像\n\n```cpp\n    cout << \"Hello \\\n\n        World\" << endl;\
  \ // 分成两行是可以的\n```\n\n用两行编写上述语句的另一种方法是写两个字符串字量而不是一个：\n\n点击此处查看代码图像\n\n```cpp\n \
  \   cout << \"Hello \"\n      \"World\" << endl; // 两个字符串字量也可以的\n```\n\n在前面的示例中，编译器注意到两个相邻的字符串字量并为它们合并它们。\n\
  \n> 注意：将一个语句拆分成多行是可以的。\n\n### 复合语句\n\n在大括号 `{}` 内部包含一组被按顺序执行的语句。\n\n点击此处查看代码图像\n\
  \n```cpp\n{\n    int Number = 365;\n    cout << \"This\" << endl;\n}\n```\n\n###\
  \ 运算符\n\n运算符是 C++ 提供的用于处理、转换和对数据数据的工具。\n\n#### 赋值运算符 (=)\n\n赋值运算符将右侧的值替换左侧。\n\n\
  ```cpp\nMyInteger = 10;\n```\n\n#### l 值和 r 值\n\nl 值通常指的是内存位置。相反地，前面的示例中的 `MyInteger`\
  \ 是 r 值。\n\n#### 加法 (+)、减法 (-)、乘法 (*)、除法 (/) 和取模 (%) 运算符\n\n可以在两个数字之间进行算术运算，`+`\
  \ 用于加法，`-` 用于减法，`*` 用于乘法，`/` 用于除法，`%` 用于取模。注意除法运算符（`/`）返回除法的结果。在整数情况下，结果不能包含小数。取模运算符（`%`）返回除法的余数，它仅适用于整数值。\n\
  \n\n\n有时，你需要以 1 为增量进行计数。这在控制循环的变量中尤为需要，因为每次循环执行时，变量的值都需要增加或减少。\n\nC++ 包含了 `++`（递增）和\
  \ `--`（递减）运算符来帮助完成这项任务。\n\n使用这些运算符的语法如下：\n\n点击此处查看代码图片\n\n```cpp\nint Num1 = 101;\n\
  int Num2 = Num1++; // 后置递增运算符\nint Num2 = ++Num1; // 前缀递增运算符\nint Num2 = Num1--;\
  \ // 后置递减运算符\nint Num2 = --Num1; // 前缀递减运算符\n```\n\n如代码示例所示，使用增减运算符有两种不同的方法：在操作数之前或之后。放在操作数之前的运算符称为前缀递增或递减运算符，放在操作数之后的称为后置递增或递减运算符。\n\
  \n### 后置还是前置？\n\n首先理解前缀和后置之间的区别很重要，然后选择适合你的方式。后置运算符的执行结果是：先将右值赋值给左值，赋值后再对右值进行递增（递减）。这意味着在所有使用后置运算符的情况下，`Num2`\
  \ 的值都是 `Num1` 的旧值（递增或递减操作之前的值）。\n\n前缀运算符的行为完全相反。右值先递增，然后赋值给左值。在这种情况下，`Num2` 和 `Num1`\
  \ 具有相同的值。列表 5.2 展示了前缀和后置递增、递减运算符对示例整数的影响。\n\n#### 列表 5.2. 后置运算符与前缀运算符的区别\n\n点击此处查看代码图片\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4:\
  \ {\n5:     int MyInt = 101;\n6:     cout << \"Start value of integer being operated:\
  \ \" << MyInt << endl;\n7:\n8:     int PostFixInc = MyInt++;\n9:     cout << \"\
  Result of Postfix Increment = \" << PostFixInc << endl;\n10:     cout << \"After\
  \ Postfix Increment, MyInt = \" << MyInt << endl;\n11:\n12:     MyInt = 101; //\
  \ 重置\n13:     int PreFixInc = ++MyInt;\n14:     cout << \"Result of Prefix Increment\
  \ = \" << PreFixInc << endl;\n15:     cout << \"After Prefix Increment, MyInt =\
  \ \" << MyInt << endl;\n16:\n17:     MyInt = 101;\n18:     int PostFixDec = MyInt--;\n\
  19:     cout << \"Result of Postfix Decrement = \" << PostFixDec << endl;\n20: \
  \    cout << \"After Postfix Decrement, MyInt = \" << MyInt << endl;\n21:\n22: \
  \    MyInt = 101;\n23:     int PreFixDec = --MyInt;\n24:     cout << \"Result of\
  \ Prefix Decrement = \" << PreFixDec << endl;\n25:     cout << \"After Prefix Decrement,\
