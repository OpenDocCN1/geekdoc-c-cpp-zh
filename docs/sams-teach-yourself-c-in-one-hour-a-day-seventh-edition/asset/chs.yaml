  \n### 编写二元加法 (a+b) 和减法 (a–b) 运算符\n与递增/递减运算符类似，二元加减号在定义时允许你从实现这些运算符的类对象加或减去支持的数据类型的值。再次查看你的日历类\
  \ `Date`。虽然你已经实现了递增 `Date` 的功能以便让日历向前移动一天，但你仍然不支持让它（例如）向前移动五天。要实现这一点，你需要如 Listing\
  \ 12.5 中的代码所示实现二元运算符(`+`)。\n\nListing 12.5. 具有二元加运算符的日历类\n点击此处查看代码\n\n```cpp\n0:\
