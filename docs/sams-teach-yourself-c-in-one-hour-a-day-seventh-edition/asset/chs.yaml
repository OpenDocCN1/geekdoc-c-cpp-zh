  Next holiday on: 31 / 12 / 2011\n\n### 分析\n第 14 到 25 行包含了二元运算符(`+`)和运算符(`-`)的实现，允许使用\
  \ `main()` 中第 41 行和第 45 行所示的简单加减语法。\n\n如果你正在编写一个字符串类，二元加运算符也将非常有用。在 Lesson 9 “类与对象”中，你分析了一个封装了内存管理、拷贝等\
