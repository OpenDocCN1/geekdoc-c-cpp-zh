  \n    cout << \"Holiday -= 19 gives: \";\n    Holiday -= 19;\n    Holiday.DisplayDate();\n\
  \n    cout << \"Holiday += 25 gives: \";\n    Holiday += 25;\n    Holiday.DisplayDate\
  \ ();\n\n    return 0;\n}\n```\n\n### 输出\n\n点击此处查看代码图像\n\nHoliday is on: 25 / 12\
