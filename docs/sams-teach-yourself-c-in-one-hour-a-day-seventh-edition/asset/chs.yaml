  \ 10 行和第 11 行使用的。在第 14 行，你使用 `setflags()` 以大写字母显示十六进制，导致 `cout` 将 253 显示为 `0FD`。第\
  \ 18 行使用的 `unsetflags()` 的效果通过 `cout` 再次使用十进制显示来证明。另一种更改显示整数为十进制的方法如下：\n\n还可以格式化\
