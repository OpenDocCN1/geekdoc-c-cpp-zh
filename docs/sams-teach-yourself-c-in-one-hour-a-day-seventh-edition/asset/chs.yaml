  }\n```\n\n### 注意\n\n乘法赋值 `*=`、除法赋值 `/=`、取模赋值 %=`、减法赋值 `-=`、左移赋值 `<<=`、右移赋值 `>>=`、异或赋值\
  \ `^=`、按位或赋值 `|=` 以及按位与赋值 `&=` 运算符的语法与列表 12.6 所示的加法赋值运算符相似。\n\n尽管重载运算符的最终目标是让类的使用变得简单且直观，但在许多情况下，实现某个运算符可能并没有意义。例如，我们的日历类\
