  \ 的应用。\n\n### 问答\n[问] 如何声明一个按降序排序的整数 `set`？\n[答] 使用 `set<int, greater<int>>`。要按升序排序，将\
  \ `set` 定义为 `set<int, less<int>>`。\n\n[问] 如果在字符串 `set` 中插入两次 \"Jack\"，会发生什么？\n[答]\
  \ 根据设计，`set` 只存储唯一值。因此，`set` 的实现不允许插入第二个值。\n\n[问] 在前述示例中，如果我想有两个 \"Jack\"，我应该修改什么？\n\
  [答] 你需要将对容器的选择改为 `multiset`。\n\n[问] `multiset` 的哪个成员函数返回容器中特定值的计数？\n[答] `count(value)`\
  \ 是感兴趣的函数。\n\n[问] 我通过 `find` 函数在 `set` 中找到了一个元素，并获得了一个指向它的迭代器。我会使用这个迭代器来更改所指向的值吗？\n\
  [答] 不。某些 STL 实现可能允许用户通过例如 `find` 返回的迭代器更改 `set` 内部的值。但这并不是正确的做法。`set` 中元素的迭代器应该被视为\
  \ `const` 迭代器——即使 STL 实现没有强制要求这样做。\n\n#### 练习\n工作坊包含测验题，以帮助巩固你对所涵盖内容的理解，并练习题以提供使用所学知识的经验。在查看附录\
