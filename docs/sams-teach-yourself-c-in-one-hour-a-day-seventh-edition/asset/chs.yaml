  \ `std::set` 情况下，排序是在插入时发生的。如输出所示，你不需要调用任何函数来确保 `set` 中的元素是有序的，因为它们在插入时就已经完成了排序。你允许用户选择删除一个条目，第\
  \ 64 行演示了调用 `find()` 来定位在第 68 行中使用 `erase()` 删除的条目。\n\n## 提示\n\n此电话簿的实现基于 STL `set`，因此不允许包含相同值的多个条目。如果你需要你的电话簿实现允许存储两个同姓名的人（例如，Tom），你应该选择\
  \ `multiset`。如果 `setContacts` 是一个 `multiset`，那么前面的代码仍然可以正常工作。为了进一步利用 `multiset`\
  \ 存储多个相同值的能力，你可以使用 `count()` 成员函数来获取特定值的元素数量。这在之前的代码示例中已经有所演示。\n\n\n\n\n\nSTL `std::set`\
  \ 和 STL `std::multiset` 根据 `std::less<T>` 或提供的谓词对元素（同时也是键）进行排序。在已排序容器中进行搜索比在像 `vector`\
  \ 等未排序容器中进行搜索更快，且 `std::sort` 提供了对数级复杂度。这意味着在 `set` 中查找元素所花费的时间与 `set` 中的元素数量并不成直接正比，而是与其数量的对数（LOG）。因此，平均而言，在一个包含\
  \ 10,000 个元素的 `set` 中搜索的时间是包含 100 个元素的 `set` 的两倍（因为 $100² = 10000$，或 $log(10000)\
  \ = 2 \\times log(100)$）。\n\n然而，这种相对于未排序容器（搜索时间与元素数量成正比）的性能剧烈提升在有时是不够的。程序员和数学家都在寻求常数时间的插入和排序可能性，其中一种方法使用了基于哈希的实现，通过哈希函数来确定排序索引。插入哈希集合的元素首先通过哈希函数进行评估，生成一个唯一的索引，该索引就是它们所在桶（bucket）的索引。\n\
  \nSTL 哈希集合变体是容器类 `std::unordered_set`。\n\n***\n\n### 提示\n要使用 STL 容器 `std::unordered_set`\
  \ 或 `std::unordered_multiset`，请包含\n\n```cpp\n#include<unordered_set>\n```\n\n***\n\
  \n该类的用法与 `std::set` 相比没有太大变化：\n\n点击此处查看代码图像\n\n```cpp\n// instantiation:\nunordered_set<int>\
  \ usetInt;\n\n// insertion of an element\nusetInt.insert(1000);\n\n// find():\n\
  auto iPairThousand = usetInt.find(1000);\n\nif (iPairThousand != usetInt.end())\n\
  \    cout << *iPairThousand << endl;\n```\n\n然而，`unordered_map` 的一个非常重要的特征是可以提供哈希函数来负责决定排序顺序：\n\
  \n```cpp\nunordered_set<int>::hasher HFn = usetInt.hash_function();\n```\n\n列表 19.6\
