  \ Fish::Swim\n25:     InputFish.Swim();\n26: }\n27:\n28: int main()\n29: {\n30:\
  \     Tuna myDinner;\n31:\n32:     // calling Tuna::Swim\n33:     myDinner.Swim();\n\
  34:\n35:     // sending Tuna as Fish\n36:     MakeFishSwim(myDinner);\n37:\n38:\
  \     return 0;\n39: }\n```\n\n* * *\n* * *\n\n### 输出\n\nTuna swims!\n\nFish swims!\n\
  \n* * *\n* * *\n\n### 分析\n\n如第 12 行所示，`class Tuna` 通过公有继承特化了 `class Fish`。它还重写了\
  \ `Fish::Swim()`。`main()` 在第 33 行直接调用了 `Tuna::Swim()`，并将 `myDinner`（类型为 `Tuna`）作为参数传递给\
  \ `MakeFishSwim()`，该函数根据第 22 行的声明将其解释为引用 `Fish&`。换句话说，`MakeFishSwim(Fish&)` 并不关心发送的对象是否为\
  \ `Tuna`，它将其视为 `Fish` 处理并调用 `Fish::Swim`。因此，输出的第二行表明同一个对象 `Tuna` 产生了 `Fish` 的输出，而不是表明其有任何特化（这也可以是\
  \ `Carp`）。\n\n用户理想情况下期望的是，即使调用的方法是 `Fish::Swim()`，类型为 `Tuna` 的对象也应该像金枪鱼一样。换句话说，当第\
  \ 25 行调用 `InputFish.Swim()` 时，他期望执行的是 `Tuna::Swim()`。这种多态行为——即已知类型 `class Fish`\
  \ 的对象可以表现得其实际类型（即派生类 `class Tuna`）——可以通过将 `Fish::Swim()` 声明为虚函数来实现。\n\n* * *\n\n\
  ### 使用虚函数实现的多态行为\n\n你可以通过指针 `Fish*` 或引用 `Fish&` 访问类型为 `Fish` 的对象。该对象可能仅作为 `Fish`\
  \ 实例化，也可能是继承自 `Fish` 的 `Tuna` 或 `Carp` 的一部分。你不知道（也不在乎）。你使用此指针或引用调用 `Swim()` 方法，如下：\n\
  \n```cpp\npFish->Swim();\nmyFish.Swim();\n```\n\n你期望的是，如果对象 `Fish` 是 `Tuna` 的一部分，它就应该像金枪鱼一样游泳；如果它是\
  \ `Carp` 的一部分，它就像鲤鱼一样游泳；如果它不是作为 `Tuna` 或 `Carp` 等特化类的一部分实例化的，它就是一个匿名 `Fish`。你可以通过在基类\
  \ `Fish` 中将函数 `Swim()` 声明为虚函数来确保：\n\n点击此处查看代码图像\n\n```cpp\nclass Base\n{\n   virtual\
  \ ReturnType FunctionName (Parameter List);\n};\n\nclass Derived\n{\n   ReturnType\
  \ FunctionName (Parameter List);\n};\n```\n\n使用关键字 `virtual` 意味着编译器将确保调用请求的基类方法的任何重写变体。因此，如果\
  \ `Swim()` 被声明为 `virtual`，调用 `myFish.Swim()`（`myFish` 类型为 `Fish&`）将导致执行 `Tuna::Swim()`，如\
  \ 列表 11.2 所示。\n\n列表 11.2 将 Fish::Swim() 声明为虚方法的效果\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n\
  6:     virtual void Swim()\n7:     {\n8:         cout << \"Fish swims!\" << endl;\n\
  9:     }\n10: };\n11:\n12: class Tuna:public Fish\n13: {\n14: public:\n15:     //\
  \ override Fish::Swim\n16:     void Swim()\n17:     {\n18:         cout << \"Tuna\
  \ swims!\" << endl;\n19:     }\n20: };\n21:\n22: class Carp:public Fish\n23: {\n\
  24: public:\n25:     // override Fish::Swim\n26:     void Swim()\n27:     {\n28:\
  \         cout << \"Carp swims!\" << endl;\n29:     }\n30: };\n31:\n32: void MakeFishSwim(Fish&\
  \ InputFish)\n33: {\n34:     // calling virtual method Swim()\n35:     InputFish.Swim();\n\
  36: }\n37:\n38: int main()\n39: {\n40:     Tuna myDinner;\n41:     Carp myLunch;\n\
  42:\n43:     // sending Tuna as Fish\n44:     MakeFishSwim(myDinner);\n45:\n46:\
  \     // sending Carp as Fish\n47:     MakeFishSwim(myLunch);\n48:\n49:     return\
  \ 0;\n50: }\n```\n\n* * *\n* * *\n\n### 输出\n\nTuna swims!\n\nFish swims!\n\n* *\
  \ *\n* * *\n\n### 分析\n\n`MakeFishSwim(Fish&)` 的实现自 11.1 节以来没有变化。然而，它产生的输出却截然不同。首先，由于虚函数的存在，`Fish::Swim()`\
  \ 没有被调用。这是一个非常重要的进展。这意味着在不知道 `Fish` 确切类型的情况下，根据基类实例，`MakeFishSwim()` 可以产生不同的 `Swim()`\
  \ 实现。这就是多态：将不同的鱼处理为共同类型，确保使用派生类型提供的 `Swim()`。\n\n\n\n\n\n这一缺陷意味着，如果使用 `new` 在空闲存储实例化了一个派生类，但使用\
  \ `Base*` 类型的指针调用 `delete`，则派生类析构函数中的代码将不会被调用。这可能导致资源未释放、内存泄漏等，是一个不容忽视的问题。\n\n为了避免这个问题，你可以像列表\
  \ 11.4 所示那样使用虚析构函数。\n\n***\n\n### 列表 11.4. 使用虚析构函数确保在删除类型为 Base 的指针时调用派生类中的析构函数\n\
  \n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: class Fish\n4: {\n5: public:\n6:     Fish()\n7:     {\n8:         cout <<\
  \ \"Constructed Fish\" << endl;\n9:     }\n10:     virtual ~Fish()   // 虚析构函数!\n\
  11:     {\n12:         cout << \"Destroyed Fish\" << endl;\n13:     }\n14: };\n\
  15:\n16: class Tuna:public Fish\n17: {\n18: public:\n19:     Tuna()\n20:     {\n\
  21:         cout << \"Constructed Tuna\" << endl;\n22:     }\n23:     ~Tuna()\n\
  24:     {\n25:         cout << \"Destroyed Tuna\" << endl;\n26:     }\n27: };\n\
  28:\n29: void DeleteFishMemory(Fish* pFish)\n30: {\n31:     delete pFish;\n32: }\n\
  33:\n34: int main()\n35: {\n36:     cout << \"Allocating a Tuna on the free store:\"\
  \ << endl;\n37:     Tuna* pTuna = new Tuna;\n38:     cout << \"Deleting the Tuna:\
  \ \" << endl;\n39:     DeleteFishMemory(pTuna);\n40:\n41:     cout << \"Instantiating\
  \ a Tuna on the stack:\" << endl;\n42:     Tuna myDinner;\n43:     cout << \"Automatic\
  \ destruction as it goes out of scope: \" << endl;\n44:\n45:     return 0;\n46:\
  \ }\n```\n\n***\n\n***\n\n### 输出\n\n点击此处查看代码图像\n\nAllocating a Tuna on the free\
  \ store:\nConstructed Fish\nConstructed Tuna\nDeleting the Tuna:\nDestroyed Tuna\n\
  Destroyed Fish\nInstantiating a Tuna on the stack:\nConstructed Fish\nConstructed\
  \ Tuna\nAutomatic destruction as it goes out of scope:\nDestroyed Tuna\nDestroyed\
  \ Fish\n\n***\n\n***\n\n### 分析\n\n列表 11.4 和 11.3 之间的唯一区别是第 10 行在声明基类 `class Fish`\
  \ 析构函数的地方添加了 `virtual` 关键字。注意，当对实际上指向 `Tuna` 的 `Fish*` 指针调用 `delete` 算符时（如第 31 行所示），此更改导致编译器在执行\
  \ `Fish::~Fish()` 的之外还额外执行了 `Tuna::~Tuna()`。现在，此输出还证明了无论 `Tuna` 类型的对象是通过使用 `new`\
  \ 在空闲存储中实例化（如第 37 行所示），还是作为栈上的局部变量（如第 42 行所示），构造函数和析构函数的调用顺序和调用方式都是相同的。\n\n***\n\
  \n***\n\n### 注意\n\n始终将基类析构函数声明为 `virtual`：\n\n点击此处查看代码图像\n\n```cpp\nclass Base\n\
  {\npublic:\n   virtual ~Base() {};  // 虚析构函数\n};\n```\n\n这确保了拥有 `Base*` 指针的人无法以一种导致派生类析构函数不被调的方式调用\
  \ `delete`。\n\n***\n\n### 虚函数是如何工作的？理解虚函数表\n\n***\n\n### 注意\n\n这一部分对于学习使用多态是可选的。你可以随意跳过，或者阅读它以满足你的好奇心。\n\
  \n列表 11.2 中的函数 `MakeFishSwim(Fish&)` 尽管程序员调用了 `Fish::Swim()`，但最终调用了 `Carp::Swim()`\
  \ 或 `Tuna::Swim()` 方法。显然，在编译时，编译器对于该函数将遇到的对象的性质一无所知，无法确保同一个函数在不同点执行不同的 `Swim()`\
  \ 方法。需要调用的 `Swim()` 方法显然是在运行时使用实现多态的不可见逻辑做出的决定，该逻辑由编译器在编译时提供。\n\n考虑一个声明了 `N` 个虚函数的\
  \ `class Base`：\n\n点击此处查看代码图像\n\n```cpp\nclass Base\n{\npublic:\n   virtual void\
  \ Func1()\n   {\n       // Func1 实现\n   }\n   virtual void Func2()\n   {\n     \
  \  // Func2 实现\n   }\n   // .. 以此类推\n   virtual void FuncN()\n   {\n       // FuncN\
  \ 实现\n   }\n};\n```\n\n继承自 `Base` 的 `class Derived` 重写了 `Base::Func2()`，暴露了 `class\
  \ Base` 中的其他虚函数：\n\n点击此处查看代码图像\n\n```cpp\nclass Derived: public Base\n{\npublic:\n\
  \   void Func1() override\n   {\n       // Func1 实现\n   }\n   void Func2() override\n\
  \   {\n       // Func2 实现\n   }\n   // .. 以此类推\n   void FuncN() override\n   {\n\
  \       // FuncN 实现\n   }\n};\n```\n\n\n\n\n\n这是一个被精简到极致的示例。你看到两个类，`SimpleClass`\
  \ 和 `Base`，它们在类型和成员数量上是相同的，但 `Base` 将函数 `FuncDoSomething()` 声明为虚函数（在 `SimpleClass`\
  \ 中为非虚）。添加此 `virtual` 关键字的区别在于，编译器为类 `Base` 生成了虚函数表，并在 `Base` 中预留了一个指向该表的指针作为隐藏成员（即\
  \ vptr）。该指针在我的 32 位系统中消耗了额外的 4 个字节，这证明了问题的存在。\n\n* * *\n\n* * *\n\n### Note\n\n\
  C++ 还允许你使用类型转换操作符 `dynamic_cast` 来查询指针 `Base*` 是否为 `Derived*` 类型，然后根据查询结果执行条件分支代码。\n\
  \n这被称为运行时类型识别 (RTTI)，尽管大多数 C++ 编译器都支持它，但理想情况下应该避免使用。因为需要知道基类指针背后的派生类类型通常被认为是一种糟糕的编程实践。\n\
  \nRTTI 和 `dynamic_cast` 在第 13 节，“类型转换操作符](#ch13.html_ch13)”中进行了讨论。\n\n* * *\n\n\
  * * *\n\n## 抽象基类与纯虚函数\n\n不能实例化的基类被称为抽象基类。这种基类只实现一个目的，即被派生。C++ 允许你使用纯虚函数来创建一个抽象基类。\n\
  \n当一个虚方法的声明如下所示时，它被称为纯虚方法：\n\n点击此处查看代码图像\n\n```cpp\nclass AbstractBase\n{\npublic:\n\
  \   virtual void DoSomething() = 0;  // 纯虚方法\n};\n```\n\n此声明本质上告诉编译器 `DoSomething()`\
  \ 需要被实现，并且必须由派生自 `AbstractBase` 的类来实现：\n\n点击此处查看代码图像\n\n```cpp\nclass Derived: public\
  \ AbstractBase\n{\npublic:\n   void DoSomething()   // 纯虚方法\n   {\n      cout <<\
  \ \"Implemented virtual function\" << endl;\n   }\n};\n```\n\n因此，`AbstractBase`\
  \ 类所做的是强制 `Derived` 类为虚方法 `DoSomething()` 提供实现。这种一个基类可以强制派生自它的类支持具有指定名称和签名的方法，这就是接口的功能。再次以\
  \ `Fish`（鱼）为例。想象有一条 `Tuna`（金枪鱼）游得慢，因为 `Tuna` 没有重写 `Fish::Swim()`。这是一个失败的实现也是一个缺陷。将\
  \ `class Fish` 设计为抽象基类并将 `Swim` 设置为纯虚函数，可以确保派生自 `Fish` 的 `Tuna` 实现 `Tuna::Swim()`，并像真正的金枪鱼一样游泳，而不是普通的鱼。参见列表\
  \ 11.6。\n\n列表 11.6. 将 Fish 作为金枪鱼和鲤类的抽象基类\n\n点击此处查看代码图像\n\n* * *\n\n* * *\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n\
  6:     // 定义一个纯虚函数 Swim\n7:     virtual void Swim() = 0;\n8: };\n9:\n10: class Tuna:public\
  \ Fish\n11: {\n12: public:\n13:     void Swim()\n14:     {\n15:         cout <<\
  \ \"Tuna swims fast in the sea!\" << endl;\n16:     }\n17: };\n18:\n19: class Carp:public\
  \ Fish\n20: {\n21:     void Swim()\n22:     {\n23:         cout << \"Carp swims\
  \ slow in the lake!\" << endl;\n24:     }\n25: };\n26:\n27: void MakeFishSwim(Fish&\
  \ inputFish)\n28: {\n29:     inputFish.Swim();\n30: }\n31:\n32: int main()\n33:\
  \ {\n34:     // Fish myFish;    // 失败，不能实例化抽象基类\n35:     Carp myLunch;\n36:    \
  \ Tuna myDinner;\n37:\n38:     MakeFishSwim(myLunch);\n39:     MakeFishSwim(myDinner);\n\
  40:\n41:     return 0;\n42: }\n```\n\n* * *\n\n* * *\n\n### 输出\n\n点击此处查看代码图像\n\n\
  ```\nCarp swims slow in the lake!\nTuna swims fast in the sea!\n```\n\n* * *\n\n\
  * * *\n\n### 分析\n\n`main()` 中第 34 行（被注释掉的）具有重要意义。它证明了编译器不允许你创建 `Fish` 的实例。它期望一个具体的对象，例如\
  \ `Fish` 的特化版本——例如 `Tuna`——这在现实世界的安排中是有意义的。得益于第 7 行声明的纯虚函数 `Fish::Swim()`，`Tuna`\
  \ 和 `Carp` 都被强制实现了 `Tuna::Swim()` 和 `Carp::Swim()`。第 27–30 行实现的 `MakeFishSwim(Fish&)`\
  \ 说明，由于基类可以强制派生类支持具有指定名称和签名的方法，这种功能就是接口。由于基类可以强制派生类支持具有指定名称和签名的方法，这种功能就是接口。再次以 `Fish`\
  \ 为例。想象有一条 `Tuna` 游得慢，因为 `Tuna` 没有重写 `Fish::Swim()`。这是一个失败的实现也是一个缺陷。将 `class Fish`\
  \ 设计为抽象基类并将 `Swim` 设置为纯虚函数，可以确保派生自 `Fish` 的 `Tuna` 实现 `Tuna::Swim()`，并像真正的金枪鱼一样游泳，而不是普通的鱼。参见列表\
  \ 11.6。\n\n（注：此处原文中部分内容重复，已按要求在翻译逻辑中确保不重复输出）\n\n`main()` 中第 34 行（被注释掉的）具有重要意义。它证明了编译器不允许你创建\
  \ `Fish` 的实例。它期望一个具体的对象，例如 `Fish` 的特化版本——例如 `Tuna`——这在现实世界的物体安排中是符合逻辑的。得益于第 7 行声明的纯虚函数\
  \ `Fish::Swim()`，`Tuna` 和 `Carp` 都被强制实现了 `Tuna::Swim()` 和 `Carp::Swim()`。第 27–30\
  \ 行实现的 `MakeFishSwim(Fish&)` 说明，由于基类可以强制派生类支持具有指定名称和签名的方法，这种功能就是接口。\n\n（注：由于提供的原文中存在多处段落重复，翻译时已根据“不要重复输出原文”的原则进行了去重处理，保持核心逻辑的完整性。）\n\
  \n---\n\n*(注：以下为后续剩余文本的逻辑翻译)*\n\n抽象基类通常被称为 ABCs。\n\n* * *\n\n* * *\n\n### 使用虚继承解决菱形问题\n\
  \nABC 有助于设计约束。在第 10 节中，你看到了一个部分金枪鱼、部分鸟、部分爬虫的奇案例。然而，这每一个都继承自 `Animal`，如图 11.2 所示。那么，当你实例化\
  \ `Tuna` 时会产生多少个 `Animal` 实例？列表 11.7 回答了这个问题。\n\n点击此处查看代码图像\n\n\n\n\n\n显然，一只鸭嘴兽应该只有一个\
  \ `Age`。然而，你希望 `Platypus` 类既是 `Mammal`，又是 `Bird`，且还是 `Reptile`。解决方案在于虚拟继承。如果你期望一个派生类被用作基类使用，那么使用\
  \ `virtual` 关键字来定义它与基类的关系可能是一个好主意：\n\n点击此处查看代码图片\n\n```cpp\nclass Derived1: public\
  \ virtual Base\n{\n   // ... members and functions\n};\n\nclass Derived2: public\
  \ virtual Base\n{\n   // ... members and functions\n};\n```\n\n更好的 `Platypus` 类（实际上是更好的\
  \ `Mammal` 类、`Bird` 类和 `Reptile` 类）位于列表 11.8 中。\n\n列表 11.8. 展示在继承层次结构中使用 `virtual`\
  \ 关键字如何将基类 `Animal` 的实例数量限制为一个。\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Animal\n4: {\n5: public:\n6:     Animal()\n\
  7:     {\n8:         cout << \"Animal constructor\" << endl;\n9:     }\n10:\n11:\
  \     // sample method\n12:     int Age;\n13: };\n14:\n15: class Mammal:public virtual\
  \ Animal\n16: {\n17: };\n18:\n19: class Bird:public virtual Animal\n20: {\n21: };\n\
  22:\n23: class Reptile:public virtual Animal\n24: {\n25: };\n26:\n27: class Platypus:public\
  \ Mammal, public Bird, public Reptile\n28: {\n29: public:\n30:     Platypus()\n\
  31:     {\n32:         cout << \"Platypus constructor\" << endl;\n33:     }\n34:\
  \ };\n35:\n36: int main()\n37: {\n38:     Platypus duckBilledP;\n39:\n40:     //\
  \ no compile error as there is only one Animal::Age\n41:     duckBilledP.Age = 25;\n\
  42:\n43:     return 0;\n44: }\n```\n\n输出\nAnimal constructor\nPlatypus constructor\n\
  \n分析\n与之前的列表 11.7 的输出进行快速对比，你会发现构造的 `class Animal` 实例数量减少到了一个，这最终反映了只构造了一个 `Platypus`\
  \ 的事实。这是因为在 `Mammal`、`Bird` 和 `Reptile` 类之间使用了 `virtual` 关键字，它确保了当这些类在 `Platypus`\
  \ 下组合在一起时，公共基类 `Animal` 仅以单个实例存在。这解决了许多问题；其中之一就是第 41 行，它现在如列表 11.7 所示，无需进行歧义消除即可通过编译。\n\
  \n注意\n在包含两个或多个继承自共同基类的类的继承层次结构中产生的问题（即在没有虚拟继承的情况下需要进行歧义消除）被称为“菱问题”（Diamond Problem）。\n\
  \n“菱”这个名字可能受到了类图形状的灵感（视觉化图 11.2，通过直线和斜线将 `Platypus` 通过 `Mammal`、`Bird` 和 `Reptile`\
  \ 连接到 `Animal`可以看到一个菱形）。\n\n注意\nC++ 中的 `virtual` 关键字经常在不同的语境下用于不同的目的。（我最好的猜测是，有人想在发明恰当的关键字上节省时间。）这里是总结：\n\
  \n声明为 `virtual` 的函数意味着派生类中现有的覆盖函数被调用。\n\n在类 `Derived1` 和 `Derived2` 之间使用关键字 `virtual`\
  \ 声明继承关系（它们都继承自类 `Base`），意味着另一个继承自 `Derived1` 和 `Derived2` 的类 `Derived3` 在实例化类型\
  \ `Derived3` 时，仍然只有一个 `Base` 实例。\n\n因此，同一个 `virtual` 关键字被用于实现两个不同的概念。\n\n### 虚拟拷贝构造函数？\n\
  \n嗯，标题末尾的问号是合理的。在 C++ 中，拥有虚拟拷贝构造函数在技术上是不可能的。然而，这种功能可以帮你创建一个 `Base*` 类型的集合（例如，静态数组），每个元素都是该类型的特化版本：\n\
  \n点击此处查看代码图片\n\n```cpp\n// Tuna, Carp and Trout are classes that inherit public\
  \ base class\nFish* pFishes[3];\nFishes[0] = new Tuna();\nFishes[1] = new Carp();\n\
  Fishes[2] = new Trout();\n```\n\n然后将其赋值到另一个相同类型的数组，其中虚拟拷贝构造函数确保了派生类的深拷贝，从而确保 `tuna`、`Carp`\
  \ 和 `rout` 被拷贝为 `tuna`、`Carp` 和 `rout`，即使拷贝构造函数是在对 `Fish*` 进行操作。\n\n嗯，这是一个很美好的梦想。虚拟拷贝构造函数是不可能的，因为\
  \ `virtual` 关键字在派生类覆盖基类方法的上下文中是关于运行时多态的，而构造函数本质上不是多态的，因为它们只能构造固定类型，因此 C++ 不允许虚拟构造函数。\n\
  \n如此，可以通过定义自己的 `clone` 函数来提供一种很好的变通方法：\n\n点击此处查看代码图片\n\n```cpp\nclass Fish\n{\n\
  public:\n    virtual Fish* Clone() const = 0;\n};\n\nclass Tuna:public Fish\n//\
  \ ... members\npublic:\n    Tuna* Clone() const\n```\n\n因此，虚拟函数 `Clone` 模拟拷贝构造函数需要显式调用，如列表\
  \ 11.9 所示。\n\n列表 11.9. Tuna 和 Carp 支持 Clone 函数作为拷贝构造函数\n\n点击此处查看代码图片\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n\
  6:     virtual Fish* Clone() = 0;\n7:     virtual void Swim() = 0;\n8: };\n9:\n\
  10: class Tuna: public Fish\n11: {\n12: public:\n13:     Fish* Clone()\n14:    \
  \ {\n15:         return new Tuna (*this);\n16:     }\n17:\n18:     void Swim()\n\
  19:     {\n20:         cout << \"Tuna swims fast in the sea\" << endl;\n21:    \
  \ }\n22: };\n23:\n24: class Carp: public Fish\n25: {\n26:     Fish* Clone()\n27:\
  \     {\n28:         return new Carp(*this);\n29:     }\n30:     void Swim()\n31:\
  \     {\n32:         cout << \"Carp swims slow in the lake\" << endl;\n33:     }\n\
  34: };\n35:\n36: int main()\n37: {\n38:     const int ARRAY_SIZE = 4;\n39:\n40:\
  \     Fish* myFishes[ARRAY_SIZE] = {NULL};\n41:     myFishes[0] = new Tuna();\n\
  42:     myFishes[1] = new Carp();\n43:     myFishes[2] = new Tuna();\n44:     myFishes[3]\
  \ = new Carp();\n45:\n46:     Fish* myNewFishes[ARRAY_SIZE];\n47:     for (int Index\
  \ = 0; Index < ARRAY_SIZE; ++Index)\n48:         myNewFishes[Index] = myFishes[Index]->Clone();\n\
  49:\n50:     // invoke a virtual method to check\n51:     for (int Index = 0; Index\
  \ < ARRAY_SIZE; ++Index)\n52:         myNewFishes[Index]->Swim();\n53:\n54:    \
  \ // memory cleanup\n55:     for (int Index = 0; Index < ARRAY_SIZE; ++Index)\n\
  56:     {\n57:         delete myFishes[Index];\n58:         delete myNewFishes[Index];\n\
  59:     }\n60:\n61:     return 0;\n62: }\n```\n\n\n\n\n\n`main()` 函数中的第 40–44 行演示了如何声明指向基类\
  \ `Fish*` 的静态指针数组，并将各个元素分别赋值给新创建的 `Tuna`、`Carp`、`Tuna` 和 `Carp` 类型的对象。请注意此数组 `myFishes`\
  \ 如何能够收集看似不同的类型，而这些类型都通过共同的基类 `Fish` 关联。与书中之前大多数为简单单调的 `int` 类型的数组相比，这已经很酷了。如果这还不够酷，你还可以在循环中使用虚函数\
  \ `Fish::Clone` 将对象拷贝到一个名为 `myNewFishes` 的类型为 `Fish*` 的新数组中，正如第 48 行所示。注意，你的数组非常小，只有四个元素。它可以长得多，但对拷贝逻辑不会产生多大影响，因为拷贝逻辑只需要调整循环结束条件参数即可。第\
  \ 52 行是实际的检查处，你对新数组中的每个存储元素调用了虚函数 `Fish::Swim()`，以验证 `Clone()` 是否将 `Tuna` 拷贝为了 `Tuna`\
  \ 而不仅仅是一个 `Fish()`。输出结果表明它确实如预期那样拷贝了 `Tuna` 和 `Carp`。\n\n![图像](img/t0307_01.jpg)\n\
  \n### 总结\n\n在本节中，你学习了如何通过多态在 C++ 代码中利用创建继承层次结构的威力。你学习了如何声明和编写虚函数——以及它们如何确保即使使用基类实例来调用虚方法，派生类的实现也能覆盖基类中的实现。你看到了纯虚函数是虚函数的一种特殊类型，它们确保了基类本身不能被实例化，使其成为定义派生类必须实现的接口的完美位置。最后，你看到了由多重继承引起的菱问题，以及\
  \ `virtual` 继承如何帮助你解决它。\n\n### 问答\n\nQ.](#ch11.html_ch11an01) 当代码在不使用它也能编译时，为什么要在基类函数中使用\
  \ `virtual` 关键字？\n\nA.](#ch11.html_ch11qu01) 没有了 `virtual` 关键字，你无法确保调用 `objBase.Function()`\
  \ 的者会被重定向到 `Derived::Function()`。此外，代码的编译并不是衡量其质量的标准。\n\nQ.](#ch11.html_ch11an02)\
  \ 编译器为什么要创建虚函数表？\n\nA.](#ch11.html_ch11qu02) 为了存储函数指针，以确保调用虚函数的正确版本。\n\nQ.](#ch11.html_ch11an03)\
  \ 基类应该始终有一个虚析构函数吗？\n\nA.](#ch11.html_ch11qu03) 理想情况下是的。只有这样才能确保当有人执行\n\n```\nBase*\
  \ pBase = new Derived();\ndelete pBase;\n```\n\n对类型为 `Base*` 的指针执行 `delete`，只有在析构函数\
  \ `~Base()` 为虚的情况下，才会调用析构函数 `~Derived()`。\n\nQ.](#ch11.html_ch11an04) 当我甚至无法单独实例化时，抽象基类（ABC）有什么用？\n\
  \nA.](#ch11.html_ch11qu04) ABC 并不是为了作为独立对象实例化；相反，它总是为了被派生的。它包含了纯虚函数，这些函数定义了派生类需要实现的函数最小蓝图，从而充当了接口的角色。\n\
  \nQ.](#ch11.html_ch11an05) 给定继承层次结构，我需要在所有虚函数的声明中都使用 `virtual` 关键字，还是只需要在基类中使用？\n\
  \nA.](#ch11.html_ch11qu05) 只需要一个 `virtual` 函数声明即可，且该声明必须在基类中。\n\nQ.](#ch11.html_ch11an06)\
  \ 我可以在 ABC 中定义成员函数并拥有成员属性吗？\n\nA.](#ch11.html_ch11qu06) 当然可以。请记住，你仍然无法实例化 ABC，因为它至少有一个需要由派生类实现的纯虚函数。\n\
