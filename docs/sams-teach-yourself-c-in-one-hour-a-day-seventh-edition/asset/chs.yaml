  \ 指定的那样。\n\n### 使用 std::cin 进行输入\n`std::cin` 是多功能的，允许你将输入读取到简单的旧数据类型中，例如 `int`、`double`\
  \ 和 `char*` C 风格字符串，你还可以使用 `getline()` 等方法从屏幕读取行或字符。\n\n#### 使用 std::cin 输入到简单的旧数据类型中\n\
  你可以通过 `cin` 直接从标准输入提供整数、double 和字符。列表 27.4 演示了使用 `cin` 从用户处读取简单数据类型。\n\n**列表 27.4.\
  \ 使用 cin 读入 int、使用科学计数法将浮点数读入 double 以及将三个字母读入 char**\n\n点击此处查看代码图像\n\n```cpp\n\
