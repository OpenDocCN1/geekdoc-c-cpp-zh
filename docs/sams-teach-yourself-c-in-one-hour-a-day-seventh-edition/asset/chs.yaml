  在本节中，你学习了什么是 C++ 语句、表达式和运算符。你学习了如何在 C++ 中执行基础算术运算，如加法、减法、乘法和除法。你还概述了逻辑操作，如非（NOT）、与（AND）、或（OR）和\
  \ `XOR`（异或）。你学习了 C++ 逻辑运算符 `!`、`&&` 和 `||`，它们可以帮助你处理条件语句；以及位运算符 `~`、`&`、`|` 和 `^`，它们可以帮助你一次按位操作数据。\n\
  \n你学习了运算符优先级，以及使用括号编写让其他程序员也能理解的代码是多么重要。你还了解了整数溢出的概述，以及避免溢出实际上有多么重要。\n\n### 问答\n\
  \n问. 为什么在 `unsigned short` 占用内存更少且也能编译的情况下，有些程序仍然使用 `unsigned int`？\n\n答. `unsigned\
  \ short` 的限制通常是 65535，如果递加，它会溢出为零。为了避免这种行为，编写良好的应用程序在不确定数值是否会远低于此限制时，会选择 `unsigned\
  \ int`。\n\n问. 我需要计算一个数字除以 3 后的两倍。你看我的代码里有什么问题吗：\n\n```cpp\nint result = Number /\
  \ 3 << 1;\n```\n\n答. 有！你为什么不简单地使用括号让这行代码对其他程序员更易读？增加一两个注释也没有坏处。\n\n问. 我的应用程序除了两个整数值\
  \ 5 和 2：\n\n点击此处代码图片\n\n```cpp\nint Num1 = 5, Num2 = 2;\nint result = Num1 / Num2;\n\
  ```\n\n**执行时，结果的值为 2。这不错的吗？**\n\n答. 完全不是。整数并不是设计用来包含小数数据的。因此，该操作的结果是 2 而不是 2.5。如果你期望的结果是\
  \ 2.5，请将所有数据类型更改为 `float` 或 `double`。这些是用于处理浮点（小数）运算的。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查\
  \ 附录 D 中的答案之前，尝试回答测验和练习题，并确保在继续下一节之前已经理解了答案。\n\n#### 测验\n\n1. 我正在编写一个除法程序。哪种数据类型更合适：`int`\
  \ 还是 `float`？\n\n2. 32 / 7 的值是多少？\n\n3. 32.0/7 的值是多少？\n\n4. `sizeof(...)` 是一个函数吗？\n\
  \n5. 我需要计算一个数字的二倍，将其加上 5，然后再再次翻倍。这正确吗？\n\n```cpp\nint Result = number << 1 + 5 <<\
  \ 1;\n```\n\n6. 当 `XOR` 操作数都结果为 `true` 时，`XOR` 操作的结果是什么？\n\n#### 练习\n\n1. 改进测验题\
  \ 4 中的代码，使用括号提高清晰度。\n\n2. 该表达式存储的 `result` 值是多少：\n\n```cpp\nint Result = number\
  \ << 1 + 5 << 1;\n```\n\n3. 编写一个程序，要求用户输入两个布尔值，并演示各种位运算符在它们上的结果。\n\n## 第 6 ：控制程序流\n\
  \n大多数应用程序需要在不同情况或用户输入下执行执行。为了让你的应用程序做出不同的反应，你需要能够编写执行不同代码段的条件语句。\n\n在本节中你将发现：\n\
  - 如何让程序表现出不同的行为\n- 如何重复执行一段代码\n- 如何更好地控制执行流\n\n### 使用 if else 执行\n\n到目前为止你看到的程序都是顺序的——从上到下。每一行都会被执行。但在大多数应用程序中很少出现顺序执行。假设你想让程序在用户按下\
  \ *m* 时相乘，在输入其他内容时相加。\n\n#### 使用 if else\n\nC++ 使用 `if ... else` 结构来实现条件执行，如下所示：\n\
  \n点击此处代码图片\n\n```cpp\nif (condition)\n    // 为真时执行\nelse\n    // 为假时执行\n```\n\n\
  注意，在 C++ 中评估表达式为 `true` 意味着该表达式不为 `false`，`false` 为零。因此，任何非零数字（正数或负数）被视为 `true`。\n\
  \n让我们分析列表 6.1 中的结构，它允许用户决定相乘还是除以数字，从而使用条件处理生成所需的输出。\n\n```cpp\n#include <iostream>\n\
  \ namespace std;\n\nint main()\n{\n    cout << \"Enter integers: \" << endl;\n \
  \   int Num1 = 0, Num2 = 0;\n    cin >> Num1;\n    cin >> Num2;\n\n    cout << \"\
  Enter 'm' to multiply, anything else to add: \";\n    char UserSelection = '\\0';\n\
  \    cin >> UserSelection;\n\n    int Result = 0;\n    if (UserSelection == 'm')\n\
  \        Result = Num1 * Num2;\n    else\n        Result = Num1 + Num2;\n\n    cout\
  \ << \"Result is: \" << Result << endl;\n\n    return 0;\n}\n```\n\n列表 6.1. 根据用户输入对整数进行乘法或加法\n\
  \n输出\nEnter integers:\n25\n56\nEnter 'm' to multiply, anything else to add: m\n\
  Result is: 1400\n\n下次运行：\nEnter integers:\n25\n56\nEnter 'm' to multiply, anything\
  \ else to add: a\nResult is: 81\n\n\n\n注意第 15 行中的 `if` 和第 17 行中的 `else`。我们指示编译器执行的操作是：如果\
  \ `if` 后的表达式 `(UserSelection == 'm')` 评估结果为 `true`，则执行第 15 行的乘法；如果表达式评估结果为 `false`，则执行加法。`(UserSelection\
  \ == 'm')` 是一个表达式，当用户输入字符 `m`（区分大小写）时它评估为 `true`，否则评估为 `false`。因此，这个简单的程序模拟了图 6.1\
  \ 中的流程图，并演示了你的应用程序在不同情况下如何产生不同的行为。\n\n### Note\n`if ... else` 结构中的 `else` 部分是可选的，在发生失败且没有需要执行的操作的情况下，不需要使用它。\n\
  \n### 警告\n如果在列表 6.1 中，第 15 行是：\n\n```\n15:    if (UserSelection == 'm');\n```\n\n\
  那么 `if` 结构就是意义的，因为它在同一行内通过一个空语句（分号）被终止了。请小心并避免这种情况，因为如果没有伴随 `if` 对应的 `else`，你将不会得到编译错误。一些优秀的编译器会在这种情况下警告你存在“空控制语句”。\n\
  \n### 条件地执行多个语句\n如果你想在条件成功或失败时执行多个语句，你需要将它们封装在语句块中。这些块本质上是用花括号 `{...}` 包围的多个待执行语句，并作为一个块来执行。例如：\n\
  \n点击此处查看代码图像\n\n```\nif (condition)\n{\n    // condition 成功块\n    Statement 1;\n\
  \    Statement 2;\n}\nelse\n{\n    // condition 失败块\n    Statement 3;\n    Statement\
  \ 4;\n}\n```\n\n此类块也被复合语句。第 4 节“管理数组和字符串”解释了使用静态数组和越界的危险性。这个问题通常出现在字符数组中。在将字符串写入字符数组或复制到数组中时，检查数组是否足够容纳这些字符非常重要。列表\
  \ 6.2 向你展示了如何进行这一非常重要的检查以避免缓冲区溢出。\n\n列表 6.2. 将字符串复制到 char 数组之前检查容量\n\n点击此处查看代码图像\n\
  \n```\n0: #include <iostream>\n1: #include <string>\n2: using namespace std;\n3:\n\
  4: int main()\n5: {\n6:     char Buffer[20] = {'\\0'};\n7:\n8:     cout << \"Enter\
  \ a line of text: \" << endl;\n9:     string LineEntered;\n10:    getline (cin,\
  \ LineEntered);\n11:\n12:    if (LineEntered.length() < 20)\n13:    {\n14:     \
  \   strcpy(Buffer, LineEntered.c_str());\n15:        cout << \"Buffer contains:\
  \ \" << Buffer << endl;\n16:    }\n17:\n18:    return 0;\n19: }\n```\n\n### 输出\n\
  点击此处查看代码图像\n\n```\nEnter a line of text:\nThis fits buffer!\nBuffer contains: This\
  \ fits buffer!\n```\n\n### 分析\n注意在第 12 行在复制之前，如何将字符串长度与缓冲区长度进行比较。此 `if` 检查的特殊之处在于，第\
  \ 13 行到 16 行存在一个语句块（也称为复合语句），在检查评估结果为 `true` 时执行。\n\n### 警告\n注意 `if(condition)`\
  \ 行后面没有分号。这是刻意为之，它确保了 `if` 之后的语句在成功时被执行。以下代码段\n\n点击此处查看代码图像\n\n```\nif(condition);\n\
  \    statement;\n```\n\n这段代码可以编译，但你不会得到预期的结果，因为 `if` 子句被随后的分号终止了，导致没有进行条件处理，并且随后的语句始终会被执行。\n\
  \n### 嵌套 if 语句\n通常你会遇到需要针对一组不同条件进行验证的情况，其中许多条件依赖于前一个条件的评估结果。C++ 允许你嵌套 `if` 语句来处理此类需求。嵌套\
  \ `if` 语句如下：\n\n点击此处查看代码图像\n\n```\nif (expression1)\n{\n    DoSomething1;\n    if(expression2)\n\
  \        DoSomething2;\n    else\n        DoSomethingElse2;\n}\nelse\n    DoSomethingElse1;\n\
  ```\n\n考虑一个类似于列表 6.1 的应用程序，用户可以通过按下命令 `d` 或 `m` 指示应用程序进行除法或乘。现在，只有在除数不为零时才允许除法。因此，在检查用户输入的预定命令之外，当用户指示程序进行除法时，检查除数是否为零也非常重要。列表\
  \ 6.3 使用了嵌套 `if` 结构。\n\n列表 6.3. 在乘法或除法中使用嵌套 if 语句\n\n点击此处查看代码图像\n\n```\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:     float Num1\
  \ = 0, Num2 = 0;\n6:     char UserSelection = '\\0';\n7:\n8:     cout << \"Enter\
  \ two numbers: \" << endl;\n9:     cin >> Num1 >> Num2;\n10:\n11:    cout << \"\
  Enter 'd' to divide, anything else to multiply: \";\n12:    cin >> UserSelection;\n\
  13:\n14:    if (UserSelection == 'd')\n15:    {\n16:        cout << \"You want division!\"\
  \ << endl;\n17:        if (Num2 != 0)\n18:        {\n19:            cout << \"No\
  \ div-by-zero, to calculate\" << endl;\n20:            cout << Num1 << \" / \" <<\
  \ Num2 << \" = \" << Num1 / Num2 << endl;\n21:        }\n22:        else\n23:  \
  \          cout << \"Division by zero is not allowed\" << endl;\n24:    }\n25: \
  \   else\n26:    {\n27:        cout << \"You want multiplication!\" << endl;\n28:\
  \        cout << Num1 << \" x \" << Num2 << \" = \" << Num1 * Num2 << endl;\n29:\
  \    }\n30:\n31:    return 0;\n32: }\n```\n\n### 输出\n点击此处查看代码图像\n\n```\nEnter two\
  \ numbers:\n45\n9\nEnter 'd' to divide, anything else to multiply: m\nYou want multiplication!\n\
  45 x 9 = 405\n```\n\n下一次运行：\n点击此处查看代码图像\n\n```\nEnter two numbers:\n22\n7\nEnter\
  \ 'd' to divide, anything else to multiply: d\nYou want division!\nNo div-by-zero,\
  \ to calculate\n22 / 7 = 3.14286\n```\n\n最后一次运行：\n点击此处查看代码图像\n\n```\nEnter two numbers:\n\
  365\n0\nEnter 'd' to divide, anything else to multiply: d\nYou want division!\n\
  Division by zero is not allowed\n```\n\n### 分析\n输出是使用三组不同的输入运行程序的结果，正如你看到的，程序在三次运行中执行了不同的代码路径。此程序相对于列表\
  \ 6.1 有几处变化：\n\n- 数字被接收为浮点变量，以便更好地处理小数，这在除法数字时非常重要。\n- `if` 条件与列表 6.1 不同。你不再检查用户是否按了\
  \ `m`；相反，第 14 行包含一个表达式 `(UserSelection == 'd')`，它在用户输入 `d` 时评估为 `true`。如果是这样，就进行除法。\n\
  - 鉴于该程序除两个数字且除数是用户输入的，检查除数是否为零非常重要。这是通过第 17 行的嵌套 `if` 实现的。\n\n因此，这个程序演示了嵌套 `if`\
  \ 结构在根据多个参数的评估结果执行不同任务时是非常有用。\n\n### Tip\n你在代码中插入的嵌套缩进表是可选的，但它们对提高嵌套 `if` 结构的可读性做出了巨大贡献。\n\
  \n\n\n\n\n注意，`if...else` 结构也可以被分组。列表 6.4 是一个程序，它会询问用户星期几，然后使用分组的 `if...else` 结构告诉用户该星期几的由来。\n\
  \n### 列表 6.4. 告知星期几的由来\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     enum DaysOfWeek\n6:   \
  \  {\n7:         Sunday = 0,\n8:         Monday,\n9:         Tuesday,\n10:     \
  \    Wednesday,\n11:         Thursday,\n12:         Friday,\n13:         Saturday\n\
  14:     };\n15:\n16:     cout << \"Find what days of the week are named after!\"\
  \ << endl;\n17:     cout << \"Enter a number for a day (Sunday = 0): \";\n18:\n\
  19:     int Day = Sunday;   // Initialize to Sunday\n20:     cin >> Day;\n21:\n\
  22:     if (Day == Sunday)\n23:         cout << \"Sunday was named after the Sun\"\
  \ << endl;\n24:     else if (Day == Monday)\n25:         cout << \"Monday was named\
  \ after the Moon\" << endl;\n26:     else if (Day == Tuesday)\n27:         cout\
  \ << \"Tuesday was named after Mars\" << endl;\n28:     else if (Day == Wednesday)\n\
  29:         cout << \"Wednesday was named after Mercury\" << endl;\n30:     else\
  \ if (Day == Thursday)\n31:         cout << \"Thursday was named after Jupiter\"\
  \ << endl;\n32:     else if (Day == Friday)\n33:         cout << \"Friday was named\
  \ after Venus\" << endl;\n34:     else if (Day == Saturday)\n35:         cout <<\
  \ \"Saturday was named after Saturn\" << endl;\n36:     else\n37:         cout <<\
  \ \"Wrong input, execute again\" << endl;\n38:\n39:     return 0;\n40: }\n```\n\n\
  * * *\n\n* * *\n\n### 输出\n\n点击此处查看代码图像\n\nFind what days of the week are named after!\n\
  \nEnter a number for a day (Sunday = 0): 5\n\nFriday was named after Venus\n\nNext\
  \ run:\n\n点击此处查看代码图像\n\nFind what days of the week are named after!\n\nEnter a number\
  \ for a day (Sunday = 0): 9\n\nWrong input, execute again\n\n* * *\n\n* * *\n\n\
  ### 分析\n\n注意在第 22 到 37 行中使用的 `if-else-if` 结构，它用于检查用户输入并产生相应的输出。第二次运行的输出表明，当用户输入\
  \ 0–6 范围以外的数字时，程序能够告知该数字不对应于任何星期几。这种结构的优势是它非常适合验证互斥条件，例如，`Monday` 永远不可能是 `Tuesday`，且无效输入不可能是任何星期几。该程序中另一个值得注意的有趣点是使用了在第\
  \ 5 行声明的名为 `DaysOfWeek` 的枚举常量并在整个 `if` 语句中使用它。你可以简单地将用户输入与整数值（如代表 `Sunday` 的 `0`\
  \ 等）进行比较，但使用枚举常量 `Sunday` 使代码更易读。\n\n### 使用 switch-case 进行条件处理\n\n`switch-case`\
  \ 的目标是让你对一个特定的表达式与一系列可能的常量进行比较，并可能对这些不同的值执行不同的操作。你在此类结构中经常会遇到的 C++ 新关键字有 `switch`、`case`、`default`\
  \ 和 `break`。\n\n以下是 `switch-case` 结构的语法：\n\n```cpp\nswitch(expression)\n{\ncase\
  \ LabelA:\n    DoSomething;\n    break;\ncase LabelB:\n    DoSomethingElse;\n  \
  \  break;\n// 等此类类推...\ndefault:\n    DoWhenExpressionIsNotHandled;\n    break;\n\
  }\n```\n\n执行过程是：生成的代码评估 `expression`，并与每个 `case` 标签进行相等性检查。每个 `case` 标签必须是一个常量。然后它执行该标签后面的代码。当\
  \ `expression` 的结果不等于 `LabelA` 时，它会检查 `LabelB`。如果检查结果为 `true`，则执行 `DoSomethingElse`。这种检查会持续进行直到遇到\
  \ `break`。这是你第一次看到 `break`。`break` 会导致执行退出块。`break` 不是强制性的；但是，如果没有 `break`，执行将将继续检查下一个标签，依此类推，而这正是你想要避免的情况。`default`\
  \ 也是可选的，当表达式不等于 `switch-case` 结构中的任何标签时，就会执行该分支。\n\n> `switch-case` 结构非常适合与枚举常量配合使用。关键字\
  \ `enum` 已在第 3 课 (ch03.html_ch03)“使用变量、声明常量”中向你介绍过。\n\n列表 6.5 是该程序的 `switch-case`\
  \ 等效实现，它告知星期几的由来并使用了枚举常量。\n\n### 列表 6.5. 使用 switch-case, break 和 default 告知星期几的由来\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4:\
  \ {\n5:     enum DaysOfWeek\n6:     {\n7:         Sunday = 0,\n8:         Monday,\n\
  9:         Tuesday,\n10:         Wednesday,\n11:         Thursday,\n12:        \
  \ Friday,\n13:         Saturday\n14:     };\n15:\n16:     cout << \"Find what days\
  \ of the week are named after!\" << endl;\n17:     cout << \"Enter a number for\
  \ a day (Sunday = 0): \";\n18:\n19:     int Day = Sunday;   // Initialize to Sunday\n\
  20:     cin >> Day;\n21:\n22:     switch(Day)\n23:     {\n24:     case Sunday:\n\
  25:         cout << \"Sunday was named after the Sun\" << endl;\n26:         break;\n\
  27:\n28:     case Monday:\n29:         cout << \"Monday was named after the Moon\"\
  \ << endl;\n30:         break;\n31:\n32:     case Tuesday:\n33:         cout <<\
  \ \"Tuesday was named after Mars\" << endl;\n34:         break;\n35:\n36:     case\
  \ Wednesday:\n37:         cout << \"Wednesday was named after Mercury\" << endl;\n\
  38:         break;\n39:\n40:     case Thursday:\n41:         cout << \"Thursday\
  \ was named after Jupiter\" << endl;\n42:         break;\n43:\n44:     case Friday:\n\
  45:         cout << \"Friday was named after Venus\" << endl;\n46:         break;\n\
  47:\n48:     case Saturday:\n49:         cout << \"Saturday was named after Saturn\"\
  \ << endl;\n50:         break;\n51:\n52:     default:\n53:         cout << \"Wrong\
  \ input, execute again\" << endl;\n54:         break;\n55:     }\n56:\n57:     return\
  \ 0;\n58: }\n```\n\n\n\n\n\n# 使用运算符 (?:) 进行条件执行\n\nC++ 有一个有趣且强大的运算符称为条件运算符，它类似于紧凑的\
  \ `if-else` 结构。\n\n条件运算符也称为三元运算符，因为它接受三个操作数：\n\n点击此处查看代码图像\n\n`(求值为布尔值的条件表达式) ?\
  \ 如果真执行表达式 1 : 如果假执行表达式 2;`\n\n这种运算符可以用于紧凑地评估两个数字中的较大值，如下所示：\n\n点击此处查看代码图像\n\n```cpp\n\
  int Max = (Num1 > Num2)? Num1 : Num2; // Max 包含 Num1 和 Num2 中的较大值\n```\n\n列表 6.6\
  \ 是使用运算符 (`?:`) 进行条件处理的演示。\n\n列表 6.6. 使用条件运算符 (?:) 寻找两个数的最大值\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  cout << \"Enter two numbers\" << endl;\n6:     int Num1 = 0, Num2 = 0;\n7:  \
  \   cin >> Num1;\n8:     cin >> Num2;\n9:\n10:     int Max = (Num1 > Num2)? Num1\
  \ : Num2;\n11:     cout << \"The greater of \" << Num1 << \" and \" \\\n12:    \
  \     << Num2 << \" is: \" << Max << endl;\n13:\n14:     return 0;\n15: }\n```\n\
  \n输出\n\n点击此处查看代码图像\n\nEnter two numbers\n365\n-1\nThe greater of 365 and -1 is:\
  \ 365\n\n分析\n\n第 10 行是关注的代码。它包含了一句非常紧凑的语句，用于判断输入的两个数字中哪一个更大。这一行是使用 `if-else` 实现以下逻辑的另一种方式：\n\
  \n点击此处查看代码图像\n\n```cpp\nint Max = 0;\nif (Num1 > Num2)\n    Max = Num1;\nelse\n\
  \    Max = Num2;\n```\n\n因此，条件运算符节省了几行代码！然而，节省代码行数不应该是首要任务。有些程序员倾向于使用条件运算符，而有些不是。以易于理解的方式编写条件运算符至关重要。\n\
  \n![图像](img/t0119_01.jpg)\n\n## 在循环中执行代码\n\n到为止，你已经看到如何让程序在变量包含不同值时产生不同的行为——例如，在列表\
  \ 6.2 中，当用户按下 `m` 时执行乘法；否则执行加法。但是，如果用户不想程序直接结束怎么办？如果他想执行另一个加法或乘法操作，或者再执行五次呢？这时你需要重复执行已存在的代码。\n\
  \n这就是你需要编写循环的时候。\n\n## 使用 goto 的原始循环\n\n如名所示，`goto` 告诉指令指针从代码中的特定点继续执行。你可以用它向后跳转并重新执行某些语句。\n\
  \n`goto` 语句的语法为：\n\n点击此处查看代码图像\n\n```cpp\nSomeFunction()\n{\nJumpToPoint: // 标签\n\
  \    CodeThatRepeats;\n    goto JumpToPoint;\n}\n```\n\n你声明了一个名为 `JumpToPoint` 的“标签”，并使用\
  \ `goto` 从该点开始重复执行，如列表 6.7 所示。除非你在调用 `goto` 时提供的条件在某些情况下可以求值为 `false`，或者除非重复的代码包含一个在特定条件下执行的\
  \ `return` 语句，否则 `goto` 命令和标签之间的代码将无限重复并阻止程序结束。\n\n列表 6.7. 使用 goto 询问用户是否想要重复计算\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5: JumpToPoint:\n6:     int Num1 = 0, Num2 = 0;\n7:\n8:    \
  \ cout << \"Enter two integers: \" << endl;\n9:     cin >> Num1;\n10:     cin >>\
  \ Num2;\n11:\n12:     cout << Num1 << \" x \" << Num2 << \" = \" << Num1 * Num2\
  \ << endl;\n13:     cout << Num1 << \" + \" << Num2 << \" = \" << Num1 + Num2 <<\
  \ endl;\n14:\n15:     cout << \"Do you wish to perform another operation (y/n)?\"\
  \ << endl;\n16:     char Repeat = 'y';\n17:     cin >> Repeat;\n18:\n19:     if\
  \ (Repeat == 'y')\n20:         goto JumpToPoint;\n21:\n22:     cout << \"Goodbye!\"\
  \ << endl;\n23:\n24:     return 0;\n25: }\n```\n\n输出\n\n点击此处查看代码图像\n\nEnter two\
  \ integers:\n56\n25\n56 x 25 = 1400\n56 + 25 = 81\nDo you wish to perform another\
  \ operation (y/n)?\ny\nEnter two integers:\n95\n47\n95 x 47 = 4465\n95 + 47 = 142\n\
  Do you wish to perform another operation (y/n)?\nn\nGoodbye!\n\n### 分析\n\n注意列表 6.7\
  \ 和[列表 6.1]之间的主要区别在于，6.1 需要执行两次才能让用户输入新一组数字并看到结果。而 6.7 通过询问用户的意愿，在一个周期内完成了这一点。\n\
  \n注意\n\n`goto` 不是推荐的编程形式，因为 `goto` 的使用可以从某一行跳转到另一行，导致变量处于不可预测的状态。你可以通过 `while`、`do...\
  \ while` 和 `for` 循环来避免 `goto`。\n\n### while 循环\n\n`while` 可以以改进的方式实现 `goto` 的功能。它的语法是：\n\
  \n点击此处查看代码图像\n\n```cpp\nwhile(expression)\n{\n    Statement;\n}\n```\n\n只要 `expression`\
  \ 求值为 `true`，语句就会执行。因此，以在情况下情况下求值为 `false` 的方式编写代码非常重要，否则 `while` 循环永远不会结束。列表 6.8\
  \ 是列表 6.7 的等效实现，但使用了 `while` 允许用户重复计算。\n\n```cpp\n0: #include <iostream>\n1: using\
  \ namespace std;\n2:\n3: int main()\n4: {\n5:     char UserSelection = 'm'; // 初始值\n\
  6:\n7:     while (UserSelection != 'x')\n8:     {\n9:         cout << \"Enter two\
  \ integers: \" << endl;\n10:        int Num1 = 0, Num2 = 0;\n11:        cin >> Num1;\n\
  12:        cin >> Num2;\n13:\n14:        cout << Num1 << \" x \" << Num2 << \" =\
  \ \" << Num1 * Num2 << endl;\n15:        cout << Num1 << \" + \" << Num2 << \" =\
  \ \" << Num1 + Num2 << endl;\n16:\n17:        cout << \"Press x to exit(x) or any\
  \ other key to recalculate\" << endl;\n18:        cin >> UserSelection;\n19:   \
  \ }\n20:\n21:    cout << \"Goodbye!\" << endl;\n22:\n23:    return 0;\n24: }\n```\n\
  \n\n\n\n第 7–19 行中的 `while` 循环包含了程序的大部分逻辑。注意 `while` 检查表达式 `(UserSelection != 'x')`，只有当该表达式求值为\
  \ `true` 时才会继续执行。为了启用首次运行，你在第 5 行将字符型变量 `UserSelection` 初始化为 `'m'`。这个值需要是任何不是 `'x'`\
  \ 的值（否则条件在第一次循环时就会失败，应用程序将在未让用户进行任何建设性操作的情况下直接退出）。第一次运行非常简单，但在第 17 行会询问用户是否希望再次执行一组计算。第\
  \ 18 行包含用户的输入，你在此处修改 `while` 评估的表达式，从而让程序有机会继续或终止。当第一次循环完成后，执行将返回到评估第 7 行 `while`\
  \ 语句中的 `expression`，如果用户没有按下 `x`，则重复执行。当用户在循环末尾按下 `x` 时，第 7 行对表达式的下一次评估结果将为 `false`，执行将退出\
  \ `while` 循环，并最终在显示告别语句后结束应用程序。\n\n### Note\n循环也被称为迭代（iteration）。涉及 `while`、`do...while`\
  \ 和 `for` 的语句也被称为迭代语句。\n\n### do...while 循环\n在某些情况下（如 列表 6.8 所示），你需要确保某段代码在循环中重复，并且至少执行一次。这就是\
  \ `do...while` 循环大显身手。\n\n`do...while` 循环的语法如下\n\n点击此处查看代码图像\n\n```cpp\ndo\n{\n\
  \    StatementBlock; // 至少执行一次\n} while(condition); // 如果条件求值为 false 则结束循环\n```\n\
  \n注意包含 `while(expression)` 的那行是以分号结尾的。这与之前的 `while` 循环不同，在之前的中，分号将实际上在所在行就终止了循环，导致一个空语句。\n\
  \n列表 6.9 展示了如何通过至少执行一次执行语句来实现 `do...while` 循环。\n\n列表 6.9. 使用 do...while 重复执行代码块\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ int main()\n4: {\n5:     char UserSelection = 'x';   // 初始值\n6:     do\n7:   \
  \  {\n8:         cout << \"Enter the two integers: \" << endl;\n9:         int Num1\
  \ = 0, Num2 = 0;\n10:        cin >> Num1;\n11:        cin >> Num2;\n12:\n13:   \
  \     cout << Num1 << \" x \" << Num2 << \" = \" << Num1 * Num2 << endl;\n14:  \
  \      cout << Num1 << \" + \" << Num2 << \" = \" << Num1 + Num2 << endl;\n15:\n\
  16:        cout << \"Press x to exit(x) or any other key to recalculate\" << endl;\n\
  17:        cin >> UserSelection;\n18:     } while (UserSelection != 'x');\n19:\n\
  20:     cout << \"Goodbye!\" << endl;\n21:\n22:     return 0;\n23: }\n```\n\n###\
  \ 输出\n点击此处查看代码图像\n```\nEnter the two integers:\n654\n-25\n654 x -25 = -16350\n654\
  \ + -25 = 629\nPress x to exit(x) or any other key to recalculate\nm\nEnter the\
  \ two integers:\n909\n101\n909 x 101 = 91809\n909 + 101 = 1010\nPress x to exit(x)\
  \ or any other key to recalculate\nx\nGoodbye!\n```\n\n### 分析\n该程序在行为和输出上与上一个相似。事实上，唯一的区别在于第\
  \ 6 行的 `do` 关键字和后面第 18 行的 `while` 使用。代码的执行是顺序的，逐行一行执行，直到遇到第 18 行的 `while`。在此处，`while`\
  \ 评估表达式 `(UserSelection != 'x')`。当表达式求值为 `true`（即用户没有按 `x` 退出）时，循环执行重复执行。当表达式求值为\
  \ `false`（即用户按 `x`）时，执行退出循环并继续执行告别和结束应用程序。\n\n### for 循环\n`for` 语句是一种更复杂的循环，因为它允许执行一次初始化（通常用于初始化计数器）、检查一个退出条件（通常使用此计数器），并并在每次循环的末尾执行一个操作（通常是增加此计数器）。\n\
  \n`for` 循环的语法如下\n\n点击此处查看代码图像\n```\nfor (执行一次的初始化表达式;\n     在每次循环开始时执行的退出条件;\n \
  \    在每次循环末尾执行的循环)\n{\n    SomeActivities;\n}\n```\n\n`for` 循环是一个特性，它允许程序员定义一个带有初始值的计数器，在每次循环开始时检查其退出条件，并在每次循环末尾更新该值。列表\
  \ 6.10 展示了如何使用 `for` 循环访问数组中的元素。\n\n列表 6.10. 使用 for 循环访问数组元素\n\n点击此处查看代码图像\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  const int ARRAY_LENGTH = 5;\n6:     int MyInts[ARRAY_LENGTH] = {0};\n7:\n8: \
  \    cout << \"Populate array of \" << ARRAY_LENGTH << \" integers\" << endl;\n\
  9:     for (int i = 0; i < ARRAY_LENGTH; ++i)\n10:    {\n11:        cout << \"Enter\
  \ integer for element \" << i << \": \";\n12:        cin >> MyInts[i];\n13:    }\n\
  14:\n15:    cout << \"Displaying contents of the array:\" << endl;\n16:    for (int\
  \ i = 0; i < ARRAY_LENGTH; ++i)\n17:        cout << \"Element \" << i << \" = \"\
  \ << MyInts[i] << endl;\n18:\n19:    return 0;\n20: }\n```\n\n### 输出\n点击此处查看代码图像\n\
  ```\nPopulate array of 5 integers\nEnter integer for element 0: 365\nEnter integer\
  \ for element 1: 31\nEnter integer for element 2: 24\nEnter integer for element\
  \ 3: 59\nEnter integer for element 4: 656\nDisplaying contents of the array:\nElement\
  \ 0 = 365\nElement 1 = 31\nElement 2 = 24\nElement 3 = 59\nElement 4 = 656\n```\n\
  \n### 分析\n在 列表 6.10 中有两个 `for` 循环——位于第 10 行和第 18 行。第一个用于输入整数数组，另一个用于显示。两个 `for`\
  \ 循环在语法上是相同的。它们都声明了一个访问数组的索引变量 `ArrayIndex`。该变量在每次循环末尾都会递增，因此有助于访问下次循环的下一个元素。`for`\
  \ 循环中间的表达式是退出条件。它通过与 `ARRAY_LENGTH` 比较来检查 `ArrayIndex` 是否仍然在数组边界内。通过这种方式，确保了 `for`\
  \ 循环不会超出数组长度。\n\n### Note\n像 列表 6.10 中帮助访问集合（如数组）的 `ArrayIndex` 也称为迭代器（iterator）。在\
  \ `for` 结构内部声明的该迭代器的作用范围限于 `for` 循环。因此，在 列表 6.10 的第二个 `for` 循环中，重新声明的变量实际上是一个新变量。\n\
  \n然而，初始化、条件表达式以及在循环末尾评估的表达式的使用是可选的。可以拥有没有部分或全部这些内容的 `for` 循环，如 列表 6.11 所示。\n\n列表\
  \ 6.11. 使用 for 循环并省略循环表达式以根据用户请求重复计算\n\n点击此处查看代码图像\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     // 没有循环表达式（缺少第三个表达式）\n\
  6:     for(char UserSelection = 'm'; (UserSelection != 'x'); )\n```\n\n\n\n\n```cpp\n\
  {\n    cout << \"Enter the two integers: \" << endl;\n    int Num1 = 0, Num2 = 0;\n\
  \    cin >> Num1;\n    cin >> Num2;\n\n    cout << Num1 << \" x \" << Num2 << \"\
  \ = \" << Num1 * Num2 << endl;\n    cout << Num1 << \" + \" << Num2 << \" = \" <<\
  \ Num1 + Num2 << endl;\n\n    cout << \"Press x to exit or any other key to recalculate\"\
  \ << endl;\n    cin >> UserSelection;\n}\n\ncout << \"Goodbye!\" << endl;\n\nreturn\
  \ 0;\n}\n```\n\n* * *\n\n* * *\n\n### Output\n\n点击此处查看代码图片\n\n输入两个整数：\n56\n25\n\
  56 x 25 = 1400\n56 + 25 = 81\n按 x 退出或按其他其他键重新计算\nm\n\n输入两个整数：\n789\n-36\n789 x -36\
  \ = -28404\n789 + -36 = 753\n按 x 退出或按其他其他键重新计算\nx\nGoodbye!\n\n* * *\n\n* * *\n\n\
  ### Analysis\n\n这与 Listing 6.8 相同，该列表使用了 `while` 循环；唯一的区别是这个在第 8 行使用了 `for`。这个 `for`\
  \ 循环有趣的地方在于，它只包含初始化表达式和条件表达式，忽略了在每个循环结束时更改变量的选项。\n\n* * *\n\n* * *\n\n### Note\n\
  \n你可以在 `for` 循环的第一个执行的初始化表达式中初始化多个变量。Listing 6.11 中带有多个初始化的 `for` 循环如下：\n\n点击此处查看代码图片\n\
  \n```cpp\nfor (int Index = 0, AnotherInt = 5; Index < ARRAY_LENGTH; ++Index, --AnotherInt)\n\
  ```\n\n注意新添加的名为 `AnotherInt` 的变量，它被初始化为 5。\n\n有趣的是，我们还可以在循环表达式中递减它，每次循环一次。\n\n*\
  \ * *\n\n* * *\n\n### 使用 continue 和 break 修改循环行为\n\n在某些情况下——特别是在处理具有大量参数和许多许多的复杂循环中——你无法高效地通过编写程序来控制循环条件，并且即使在循环内部也需要修改程序的行为。这时\
  \ `continue` 和 `break` 就可以帮助你。\n\n`continue` 让你从循环的顶部继续执行。它只是简单地跳过了循环块中其之后的代码。因此，`continue`\
  \ 在 `while`、`do...while` 或 `for` 循环中的效果是导致重新评估循环条件，如果条件求值为 `true`，则重新进入循环块。\n\n\
  * * *\n\n* * *\n\n### Note\n\n在 `for` 循环中使用 `continue` 的情况下，循环表达式（`for` 语句中通常用于增加计数器的第三个表达式）在重新评估条件之前会被求值。\n\
  \n* * *\n\n* * *\n\n`break` 退出循环块，有效地结束其被调用的循环。\n\n* * *\n\n* * *\n\n## Caution\n\
  \n通常，程序员期望当循环条件满足时，循环中的所有代码都会执行。`continue` 和 `break` 修改了这种行为，并可能导致非直观的代码。\n\n所以，你应该谨慎使用\
  \ `continue` 和 `break`，只有在没有没有它们的情况下无法正确且高效地编写循环时才使用它们。\n\n* * *\n\n* * *\n\nListing\
  \ 6.12 展示了如何使用 `continue` 让用户在计算它们之前重新输入数字，并使用 `break` 退出循环。\n\n#### 不结束的循环，即无限循环\n\
  \n记住 `while`、`do...while` 和 `for` 循环都有一个条件表达式，当条件求值为 `false` 时，循环终止。如果你编写了一个始终求值为\
  \ `true` 的条件，循环将永远不会结束。\n\n一个无限的 `while` 循环看起来如下：\n\n点击此处查看代码图片\n\n```cpp\nwhile(true)\
  \   // while 表达式固定为 true\n{\n    DoSomethingRepeatedly;\n}\n```\n\n一个无限的 `do...while`\
  \ 循环将：\n\n点击此处查看代码图片\n\n```cpp\ndo\n{\n    DoSomethingRepeatedly;\n} while(true);\
  \ // do...while 表达式永远不会求值为 false\n```\n\n一个无限的 `for` 循环可以以此方式编写：\n\n点击此处查看代码图片\n\
  \n```cpp\nfor (;;) // 未提供条件 = 无休止\n{\n    DoSomethingRepeatedly;\n}\n```\n\n尽管这看起来很奇怪，但这种循环是有目的的。想象操作系统需要不断检查你是否已将\
  \ USB 闪盘之类的设备连接到端口。只要操作系统运行，这种活动就不应该停止很长时间。这种情况需要使用永不结束的循环。这种循环也被称为无限循环，因为它们会永远执行，直到永恒。\n\
  \n#### 控制无限循环\n\n如果你想结束一个无限循环（例如在 `while` 循环中），可以通过插入 `break` 来实现。以下是使用 `break`\
  \ 退出 `while` 循环的示例：\n\n点击此处查看代码图片\n\n```cpp\nwhile(true) // while 固定为 true\n{\n\
  \    DoSomethingRepeatedly;\n    if (condition)\n        break; // 条件求值为 false 时退出循环\n\
  }\n```\n\n在 `do...while` 中使用 `break`：\n\n点击此处查看代码图片\n\n```cpp\ndo\n{\n    DoSomethingRepeatedly;\n\
  \    if (condition)\n        break; // 条件求值为 false 时退出循环\n} while(true); // do...while\
  \ 表达式永远不会求值为 false\n```\n\n在无限 `for` 循环中使用 `break`：\n\n点击此处查看代码图片\n\n```cpp\nfor\
  \ (;;) // 无休止\n{\n    DoSomethingRepeatedly;\n    if (condition)\n        break;\
  \ // 条件求值为 false 时退出循环\n}\n```\n\nListing 6.12 展示了如何使用 `continue` 和 `break` 来控制无限循环的退出标准。\n\
  \n\n\n\n第 5 行中的 `for` 循环与列表 6.11 中的循环不同，区别在于这是一个无限 `for` 循环，不包含在每次循环迭代时都进行求值的条件表达式。换句话说，如果不执行\
  \ `break` 语句，此循环（以及此程序）将永远不会退出。请注意输出，它与你之前看到的其他输出不同，在于它允许用户在程序继续计算和和乘法之前对其输入的整数进行修正。此逻辑通过在第\
  \ 16 行和第 17 行对特定条件的评估并使用 `continue` 实现。当用户在被询问是否要修正数字时按下 `y`，第 16 行的条件求值为 `true`，从而执行接下来的\
  \ `continue`。当遇到 `continue` 时，执行跳转到循环顶部，再次询问用户是否想输入两个整数。同样，在循环结束时，当用户被询问是否要退出时，其输入会在第\
  \ 26 行与 `'x'` 进行比较，如果是，则执行接下来的 `break`，从而结束循环。\n\n### 注意事项\n列表 6.12 使用空的 `for(;;)`\
  \ 语句来创建一个无限循环。你可以将其替换为 `while(true)` 或 `do... while(true);`，以便使用不同的循环类型生成相同的输出。\n\
  \n![图像](img/t0132_01.jpg)\n\n### 编写嵌套循环\n正如你在本节开头看到的嵌套 `if` 语句一样，你通常确实需要将一个循环嵌套在另一个循环之下。想象有两个整数数组。如果你想找到\
  \ `Array1` 中每个数相对于 `Array2` 中每个数的倍数，你可以使用嵌套循环来让这种编程变得简单。第一个循环遍历 `Array1`，而第二个循环在第一个循环内部遍历\
  \ `Array2`。\n\n列表 6.13 演示了你可以将任何类型的循环嵌套在任何类型的循环之下。\n\n列表 6.13. 使用嵌套循环将数组中的每个元素与另一个数组中的每个元素相乘\n\
  \n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
  {\n    const int ARRAY1_LEN = 3;\n    const int ARRAY2_LEN = 2;\n\n    int MyInts1[ARRAY1_LEN]\
  \ = {35, -3, 0};\n    int MyInts2[ARRAY2_LEN] = {20, -1};\n\n    cout << \"Multiplying\
  \ each int in MyInts1 by each in MyInts2:\" << endl;\n\n    for(int Array1Index\
  \ = 0; Array1Index < ARRAY1_LEN; ++Array1Index)\n        for(int Array2Index = 0;\
  \ Array2Index < ARRAY2_LEN; ++Array2Index)\n            cout << MyInts1[Array1Index]\
  \ << \" x \" << MyInts2[Array2Index] \\\n            << \" = \" << MyInts1[Array1Index]\
  \ * MyInts2[Array2Index] << endl;\n\n    return 0;\n}\n```\n\n### 输出\n点击此处查看代码图像\n\
  Multiplying each int in MyInts1 by each in MyInts2:\n35 x 20 = 700\n35 x -1 = -35\n\
  -3 x 20 = -60\n-3 x -1 = 3\n0 x 20 = 0\n0 x -1 = 0\n\n### 输出\n涉及的两个嵌套 `for` 循环位于第\
  \ 13 行和第 14 行。第一个 `for` 循环遍历数组 `MyInts1`，而第二个 `for` 循环遍历另一个数组 `MyInts2`。第一个 `for`\
  \ 循环在每次迭代中执行第二个 `for` 循环。第二个 `for` 循环遍历 `MyInts2` 中的所有元素，并在每次迭代中，将该元素与上方循环中通过 `Array1Index`\
  \ 索引的元素相乘。因此，对于 `MyInts1` 中的每一个元素，第二个循环都会遍历 `MyInts2` 中的所有元素，导致 `MyInts1` 中偏移量为\
  \ 0 的第一个元素与 `MyInts2` 中的所有元素相乘。然后，`MyInts1` 中的第二个元素与 `MyInts2` 中的所有元素相乘。最后，`MyInts1`\
  \ 中的第三个元素与 `MyInts2` 中的所有元素相乘。\n\n### 注意事项\n为了方便并将重点放在循环上，列表 6.13 中的数组内容已经过初始化。你可以自由地从之前的示例（例如列表\
  \ 6.10）中推导，让用户将数字输入到整数数组中。\n\n### 使用嵌套循环遍历多维数组\n在第 4 Lesson 中，你学习了多维数组。实际上在列表 4.3\
  \ 中，你访问了一个三行三列的二维数组中的元素。你那里所做的是访问数组中的每个元素，每行一个。那里并没有自动化，而且，如果数组更大，你需要像列表 6.14 所示的那样通过改变循环来访问元素。然而，使用循环可以改变这一点。\n\
  \n列表 6.14. 使用嵌套循环遍历二维数组元素\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nint main()\n{\n    const int MAX_ROWS = 3;\n    const int MAX_COLS = 4;\n\
  \n    // 二维数组\n    int MyInts[MAX_ROWS][MAX_COLS] = {{34, -1, 79, 22}, {24, 365,\
  \ 101, -1}, {20, 40, 97}};\n\n    // 遍历行\n    for (int Row = 0; Row < MAX_ROWS;\
  \ ++Row)\n    {\n        // 遍历列\n        for (int Column = 0; Column < MAX_COLS;\
  \ ++Column)\n        {\n            cout << \"Integer[\" << Row << \"][\" << Column\
  \ << \"] = \" << MyInts[Row][Column] << endl;\n        }\n    }\n\n    return 0;\n\
  }\n```\n\n\n\n\n```cpp\n24:        cout << endl << \"Do you want more numbers (y/n)?\
  \ \";\n25:        cin >> WantMore;\n26:     }while (WantMore == 'y');\n27:\n28:\
  \     cout << \"Goodbye!\" << endl;\n29:\n30:     return 0;\n31: }\n```\n\n### 输出\n\
  \n查看代码图像\n\n该程序一次计算 5 个斐波那契数字\n\n0 1 1 2 3 5 8\n\n想要更多数字吗 (y/n)? y\n\n13 21 34 55\
  \ 89\n\n想要更多数字吗 (y/n)? y\n\n144 233 377 610 987\n\n想要更多数字吗 (y/n)? y\n\n1597 2584\
  \ 4181 6765 10946\n\n想要更多数字吗 (y/n)? n\n\n再见！\n\n### 分析\n\n第 13 行的外部 `do...while`\
  \ 基本上是一个查询循环，如果用户想看更多数字，循环就会重复。第 15 行的内部 `for` 循环负责计算下一个斐波那契数字并一次显示五个数字。在第 19 行，你将\
  \ `Num2` 赋值给一个临时值，以便在第 21 行进行赋值。注意，如果你没有存储这个临时值，你将把第 20 行修改后的值赋值给 `Num1`，这并不是你想要的。得益于这几行，如果用户按下\
  \ `y` 重复，循环将带有 `Num1` 和 `Num2` 的新值继续。\n\n### 总结\n\n本节的核心在于确保你编写的代码不仅仅是从上到下执行；它向你展示了如何编写条件语句来创建备路径并让代码块在循环中重复。你学习了\
  \ `if...else` 结构，以及使用 `switch-case` 语句来处理变量包含不同值时的各种情况。在循环中，你被教授了 `goto`——但同时也被警告不要使用它，因为它可能会创建无法理解的代码。你学习了在\
  \ C++ 中使用 `while`、`do...while` 和 `for` 结构编写编程循环。你学习了如何让循环无限迭代以创建无限循环，并使用 `continue`\
  \ 和 `break` 来更好地控制它们。\n\n### 问答\n\n**如果我在 `switch-case` 语句中省略 `break` 会发生什么？**\n\
  `break` 语句允许程序执行退出 `switch` 结构。如果没有它，执行将继续评估后续的 `case` 语句。\n\n**我如何退出无限循环？**\n使用\
  \ `break` 退出循环。使用 `return` 也会退出函数。\n\n**我的循环看起来像 `while(Integer)`。当 `Integer` 求值为\
  \ -1 时，循环会执行吗？**\n\n理想情况下，`while` 表达式应该求值为布尔值 `true` 或 `false`，否则会被解释为如下：`false`\
  \ 为零。因为 -1 不是零，所以 `while` 条件求值为 `true`，循环将会执行。如果你希望循环只对正数执行，请编写表达式 `while(Integer>0)`。这一规则适用于所有条件语句和循环。\n\
  \n**我如何退出无限循环？**\n使用 `break` 退出循环。使用 `return` 代替 `break` 也会退出函数。\n\n**是否存在等于 `for(;;)`\
  \ 的空 `while` 循环？**\n没有，`while` 总是需要一个配套的条件表达式。\n\n**我通过复制粘贴将 `do...while(exp);`\
  \ 改成了 `while(exp);`。我应该预料任何问题吗？**\n是的，问题很大！由于 `while` 后面跟着空语句（分号），`while(exp);`\
  \ 已经是一个有效的空 `while` 循环，即使它后面跟着一个语句块。该语句块会被执行一次，但在循环之外。你在复制粘贴时应该小心。\n\n### 工作坊\n\n\
  工作坊提供了测试题，帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学内容的经验。在检查 附录 D 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保理解了答案。\n\
  \n#### 测验\n\n1. 既然即使没有缩进也能编译，为什么还要费心在语句块、嵌套 `if` 和嵌套循环中对代码进行缩进？\n2. 你可以使用 `goto`\
  \ 实现快速修复。为什么你仍然要避免它？\n3. 是否可以写一个计数器递减的 `for` 循环？它看起来什么样？\n4. 下列循环有什么问题？\n\n```cpp\n\
  for (int Counter=0; Counter==10; ++Counter)\n    cout << Counter << \" \";\n```\n\
  \n#### 练习\n\n1. 编写一个 `for` 循环来反序访问数组中的元素。\n2. 编写一个嵌套循环，等同于 列表 6.13，将两个数组中的元素相加，但采用反序顺序。\n\
  3. 编写一个程序，显示斐波那契数字，类似于 列表 6.15，但它会询问用户她想要多少个数字。\n4. 编写一个 `switch-case` 语句来判断颜色是否为主色。\n\
  5. 编写一个 `do...while` 循环，询问用户直到他们输入一个有效的数字为止。\n6. 编写一个 `while` 循环，打印从 1 到 10 的数字。\n\
  7. 编写一个 `for` 循环，打印从 10 递减到 1 的数字。\n\n\n\n\n\n```cpp\n6: double Area(double InputRadius);\n\
  \n7: double Circumference(double InputRadius);\n\n8:\n\n9: int main()\n{\n    cout\
  \ << \"Enter radius: \";\n    double Radius = 0;\n    cin >> Radius;\n\n    // Call\
  \ function \"Area\"\n    cout << \"Area is: \" << Area(Radius) << endl;\n\n    //\
  \ Call function \"Circumference\"\n    cout << \"Circumference is: \" << Circumference(Radius)\
  \ << endl;\n\n    return 0;\n}\n\n// Function definitions (implementations)\ndouble\
  \ Area(double InputRadius)\n{\n    return Pi * InputRadius * InputRadius;\n}\n\n\
  double Circumference(double InputRadius)\n{\n    return 2 * Pi * InputRadius;\n\
  }\n```\n\n***\n\n***\n\n### 输出\n\n点击此处查看代码图像\n\nEnter radius: 6.5\nArea is: 132.732\n\
  Circumference is: 40.8407\n\n***\n\n***\n\n### 分析\n\n乍一看，这看起来像是使用了不同包的相同内容。你会发现，将面积和周长的计算划分到不同的函数中可能有助于代码的复用，因为函数可以根据需要反复被调用。`main()`\
  \ 也是一个函数，它非常紧凑，并将活动委托给 `Area` 和 `Circumference` 等函数，这些函数分别在第 16 行和第 19 行被调用。\n\n\
  该程序演示了使用函数编程时涉及的以下要素：\n\n- 函数原型声明在第 6 行和第 7 行，因此编译器知道在 `main()` 中 `Area` 和 `Circumference`\
  \ 术的含义。\n- 函数 `Area()` 和 `Circumference()` 在 `main()` 的第 16 行和第 19 行被调用。\n- 函数 `Area()`\
  \ 定义在第 25–38 行，`Circumference()` 定义在第 30–33 行。\n\n***\n\n#### 什么是函数原型？\n\n再次查看列表\
  \ 7.1——特别是第 6 行和第 7 行：\n\n点击此处查看代码图像\n\n```cpp\ndouble Area(double InputRadius);\n\
  double Circumference(double InputRadius);\n```\n\n图 7.1 显示了函数原型由什么组成。\n\n![Image](img/07fig01.jpg)\n\
  \n图 7.1. 函数原型的部分。\n\n函数原型基本上告诉我们函数是如何被调用的（名称，`Area`）、函数接受的参数列表（一个名为 `InputRadius`\
  \ 的 `double` 参数）以及函数的返回类型（`double`）。\n\n如果没有函数原型，在到达 `main()` 的第 16 行和第 19 行时，编译器将不知道\
  \ `Area` 和 `Circumference` 术语是什么。函数原型告诉编译器 `Area` 和 `Circumference` 是函数；它们接受一个 `double`\
  \ 类型的参数并返回一个 `double` 类型的值。编译器随后识别出这些语句是有效的，而将函数调用链接到其实现并确保程序执行实际触发这些函数的工作则是由链接器完成的。\n\
  \n***\n\n**注意**\n\n函数可以有多个用逗号分隔的参数，但它只能有一个返回类型。\n\n当编写一个不需要返回任何值的函数时，请将返回类型指定为 `void`。\n\
  \n***\n\n#### 什么是函数定义？\n\n真正的实质——函数的实现——被称为定义。分析函数 `Area` 的定义：\n\n点击此处查看代码图像\n\n\
  ```cpp\n25: double Area(double InputRadius)\n26: {\n27:     return Pi * InputRadius\
  \ * InputRadius;\n28: }\n```\n\n函数定义始终由一个语句块组成。除非函数声明时的返回类型为 `void`，否则 `return`\
  \ 语句是必要的。在这种情况下，`Area` 需要返回一个值，因为函数的返回类型没有被声明为 `void`。语句块包含在左括号和右括号（`{...}`）之间的语句，这些语句在函数被调用时执行。`Area()`\
  \ 使用输入参数 `InputRadius` 作为调用者发送的参数来计算圆的面积。\n\n#### 什么是函数调用，什么是参数？\n\n调用函数也称为进行一次函数调用。当函数被声明为带有参数的函数时，函数调用需要发送参数，这些参数是函数在其参数列表内请求的值。让我们分析列表\
  \ 7.1 中对 `Area` 的调用：\n\n点击此处查看代码图像\n\n```cpp\n16: cout << \"Area is: \" << Area(Radius)\
  \ << endl;\n```\n\n在这里，`Area(Radius)` 是函数调用，其中 `Radius` 是发送给函数的参数。调用时，执行跳转到 `Area`，它使用半径计算面积。当\
  \ `Area()` 完成时，它返回一个 `double`。该返回值随后通过 `cout` 语句显示在屏幕上。\n\n#### 编写带有参数的函数\n\n假设你正在编写一个计算圆柱面积的程序，如图\
  \ 7.2 所示。\n\n![Image](img/07fig02.jpg)\n\n图 7.2. 圆柱。\n\n你使用的公式将：\n\n点击此处查看代码图像\n\
  \n```text\nArea = 2 * Pi * Radius + 2 * Pi * Height\n```\n\n因此，你需要处理两个变量，半径和高度。你通过用逗号分隔参数来实现，如列表\
  \ 7.2 所示。\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: const\
  \ double Pi = 3.14159;\n4:\n5: // Declaration parameters\n6: double SurfaceArea(double\
  \ Radius, double Height);\n7:\n8: int main()\n9: {\n10:    cout << \"Enter the radius\
  \ of the cylinder: \";\n11:    double InRadius = 0;\n12:    cin >> InRadius;\n13:\
  \    cout << \"Enter the height of the cylinder: \";\n14:    double InHeight = 0;\n\
  15:    cin >> InHeight;\n16:\n17:    cout << \"Surface Area: \" << SurfaceArea(InRadius,\
  \ InHeight) << endl;\n18:\n19:    return 0;\n20: }\n21:\n22: double SurfaceArea(double\
  \ Radius, double Height)\n23: {\n24:    double Area = 2 * Pi * Radius * Radius +\
  \ 2 * Pi * Height;\n25:    return Area;\n26: }\n```\n\n***\n\n***\n\n### 输出\n\n\
  点击此处查看代码图像\n\nEnter the radius of the cylinder: 3\nEnter the height of the cylinder:\
  \ 6.5\nSurface Area: 179.071\n\n***\n\n***\n\n### 分析\n\n第 6 行包含了函数 `SurfaceArea`\
  \ 的声明，带有两个参数：`Radius` 和 `Height`，均为 `double` 类型，用逗号分隔。第 22–26 行显示了定义——即 `SurfaceArea`\
  \ 的实现。你可以看到输入参数 `Radius` 和 `Height` 用于计算存储在 `Area` 中的值，该值随后返回给调用者。\n\n***\n\n***\n\
  \n**注意**\n\n函数参数类似于局部变量。它们仅在函数范围内有效。因此，在列表 7.2 中，函数 `SurfaceArea` 的参数 `Radius` 和\
  \ `Height` 仅在函数 `SurfaceArea` 内部有效，在外部则无效。\n\n#### 编写没有参数或没有返回值的函数\n\n如果你将打印“你好世界”的任务委托给一个只做这件事不做其他事情的函数，你可以创建一个不需要任何参数的函数（因为它除了说“你好”不需要做任何事情），可能还有一个不需要返回任何值的函数（因为你不期望这种函数返回任何在其他地方有用的东西）。列表\
  \ 7.3 演示了这样一个函数。\n\n\n\n\n\n# 列表 7.3. 无参数无返回值的函数\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: void SayHello();\n4:\n5: int main()\n\
  6: {\n7:     SayHello();\n8:     return 0;\n9: }\n10:\n11: void SayHello()\n12:\
  \ {\n13:     cout << \"Hello World\" << endl;\n14: }\n```\n\n### 输出\n```\nHello\
  \ World\n```\n\n### 分析\n请注意第 3 行中的函数原型声明函数 `SayHello` 为一个返回类型为 `void` 的函数——这意味着\
  \ `SayHello` 不返回任何值。因此，在第 11-14 行的函数定义中，没有 `return` 语句。即使第 7 行 `main()` 函数中的函数调用也没有将函数的返回值赋值给任何变量或在任何表达式中使用，因为该函数是不返回任何内容的。\n\
  \n## 带有默认值的函数参数\n\n在在此之前的示例中，你假设了 Pi 的值，将其固定为常量，并且从未给用户更改它的机会。然而，用户可能对更小或更精确的数值感兴趣。如何编写一个函数，使得除非提供另一个值，否则它将假设你选择的\
  \ Pi 值呢？\n\n解决这个问题的一种方法是在函数 `Area()` 中提供一个额外的参数用于 Pi，并提供一个由你选择的值作为默认值。这种对 列表 7.1\
  \ 中函数 `Area()` 的适配将如下所示：\n\n点击此处查看代码图像\n\n```cpp\ndouble Area(double InputRadius,\
  \ double Pi = 3.14);\n```\n\n注意第二个参数 `Pi` 及其关联的默认值 `3.14`。这个第二个参数现在对于调用者来说是一个可选参数。因此，调用函数仍然可以使用这种语法调用\
  \ `Area`：\n\n`Area(Radius);`\n\n在这种情况下，第二个参数被忽略了，它默认为值 `3.14`。但是，如果用户提供了不同的 `Pi`，则你可以在调用\
  \ `Area` 时指定它，如下：\n\n点击此处查看代码图像\n\n```cpp\nArea(Radius, Pi); // 用户定义的 Pi\n```\n\n\
  列表 7.4 展示了你如何编写包含参数默认值的函数，如果存在且用户需要，这些默认值可以被用户提供的值所覆盖。\n\n### 列表 7.4. 计算圆面积的函数，使用\
  \ Pi 作为第二个参数且默认值为 3.14\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using\
  \ namespace std;\n2:\n3: // 函数声明（原型）\n4: double Area(double InputRadius, double\
  \ Pi = 3.14);  // 带有默认值的 Pi\n5:\n6: int main()\n7: {\n8:     cout << \"Enter radius:\
  \ \";\n9:     double Radius = 0;\n10:     cin >> Radius;\n11:\n12:     cout << \"\
  Pi is 3.14, do you wish to change this (y / n)? \";\n13:     char ChangePi = 'n';\n\
  14:     cin >> ChangePi;\n15:\n16:     double CircleArea = 0;\n17:     if (ChangePi\
  \ == 'y')\n18:     {\n19:         cout << \"Enter new Pi: \";\n20:         double\
  \ NewPi = 3.14;\n21:         cin >> NewPi;\n22:         CircleArea = Area (Radius,\
  \ NewPi);\n23:     }\n24:     else\n25:         CircleArea = Area(Radius); // 忽略第二个\
  \ 2 参数，使用默认值\n26:\n27:     // 调用函数 \"Area\"\n28:     cout << \"Area is: \" << CircleArea\
  \ << endl;\n29:\n30:     return 0;\n31: }\n32:\n33: // 函数定义不再指定默认值\n34: double Area(double\
  \ InputRadius, double Pi)\n35: {\n36:     return Pi * InputRadius;\n37: }\n```\n\
  \n### 输出\n```\nEnter radius: 1\nPi is 3.14, do you wish to change this (y / n)?\
  \ n\nArea is: 3.14\nNext run:\nEnter radius: 1\nPi is 3.14, do you wish to change\
  \ this (y / n)? y\nEnter new Pi: 3.16\nArea is: 3.16\n```\n\n### 分析\n在前面的输出中显示的两次运行中，用户输入的半径是相同的——1。然而，在第二次运行中，用户选择了更改\
  \ `Pi` 的精度，因此计算出的面积略有不同。请注意，在两种情况下，如第 22 行和第 25 行所示，调用的同一个函数。第 25 行包含了在没有第二个参数的情况下调用的\
  \ `Area`，它默认为第 4 行中定义的值 `3.14`。\n\n## 递归——调用自身的函数\n\n在某些情况下，函数会调用自身。这种函数被称为递归函数。\n\
  \n注意：如果没有终止条件，程序将无限循环，导致栈溢出。\n\n递归函数在 列表 7.5 中用于确定斐波那契数列中的数值。递归函数是可以通过递归调用自身来工作的，直到达到某个终止条件，递归停止。\n\
  \n### 列表 7.5. 使用递归函数计算斐波那契数列中的数值\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int GetNumber(int FibIndex)\n4: {\n5:     if (FibIndex\
  \ < 2)\n6:         return FibIndex;\n7:     else\n8:         return GetNumber(FibIndex\
  \ - 1) + GetNumber(FibIndex - 2);\n9: }\n10:\n11: int main()\n12: {\n13:     cout\
  \ << \"Enter 0-based index of Fibonacci Number: \";\n14:     int Index = 0;\n15:\
  \     cin >> Index;\n16:\n17:     cout << \"Fibonacci number is: \" << GetNumber(Index)\
  \ << endl;\n18:\n19:     return 0;\n20: }\n```\n\n### 输出\n```\nEnter 0-based index\
  \ of Fibonacci Number: 6\nFibonacci number is: 8\n```\n\n### 分析\n第 3-9 行定义的函数 `GetNumber`\
  \ 是递归的，因为它在第 8 行调用了自己。注意第 5-6 行的终止条件；如果索引小于 2，函数将返回索引。由于函数以递减的 `FibIndex` 值连续调用，最终会进入终止条件并停止。\n\
  \n## 带有多个返回语句的函数\n\n你不限制在函数定义中只能有一个返回语句。你可以从函数的任何点返回，根据需要多次返回，如 列表 7.6 所示。取决于逻辑的需求，这可能是也可能不是坏的编程习惯。\n\
  \n### 列表 7.6. 在一个函数中使用多个返回语句\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1:\
  \ using namespace std;\n2: const double Pi = 3.14159;\n3:\n4: void QueryAndCalculate()\n\
  5: {\n6:     cout << \"Enter radius: \";\n7:     double Radius = 0;\n8:     cin\
  \ >> Radius;\n9:\n10:     cout << \"Area: \" << Pi * Radius * Radius << endl;\n\
  11:\n12:     cout << \"Do you wish to calculate circumference (y/n)? \";\n13:  \
  \   char CalcCircum = 'n';\n14:     cin >> CalcCircum;\n15:\n16:     if (CalcCircum\
  \ == 'n')\n17:         return;\n18:\n19:     cout << \"Circumference: \" << 2 *\
  \ Pi * Radius << endl;\n20:     return;\n21: }\n22:\n23: int main()\n24: {\n25:\n\
  26: }\n```\n\n\n\n\n\n```cpp\n25:    QueryAndCalculate ();\n26:\n27:    return 0;\n\
  28: }\n```\n\n### 输出\n\n点击此处查看代码图片\n\n输入半径：1\n面积：3.14159\n你想计算周长吗 (y/n)？y\n周长：6.28319\n\
  \n下次运行：\n\n点击此处查看代码图片\n输入半径：1\n面积：3.14159\n你想计算周长吗 (y/n)？n\n\n### 分析\n\n函数 `QueryAndCalculate`\
  \ 包含 `return` 语句：一个在第 17 行，另一个在第 20 行。该函数询问用户她是否也想计算周长。如果她按下 `n` 表示否，程序将使用 `return`\
  \ 语句退出。对于所有其他值，程序将继续计算周长然后返回。\n\n### 注意事项\n\n在函数中使用多个 `return` 时要谨慎。与一个从顶部开始并在底部返回的函数相比，一个在中间多个点返回的函数要难理解理解和遵循得多。\n\
  \n在 列表 7.6 中，只需通过将 `if` 条件更改为测试是否为 `'y'` 或 yes，就可以避免多次返回：\n\n点击此处查看代码图片\n\n```cpp\n\
  if (CalcCircum == 'y')\n    cout << \"Circumference: \" << 2 * Pi * Radius << endl;\n\
  ```\n\n## 使用函数处理不同形式的数据\n\n函数并不限制你一次只传递一个值；你可以向函数传递值数组。你可以创建两个具有相同名称和返回值但参数不同的函数。你可以编写一个函数，使其参数不会在函数调用期间被创建和销毁；相反，你可以使用在函数退出后仍然有效的引用，以便在函数调用中操纵更多数据或参数。在本节中你将学习向函数传递数组、函数重载以及通过引用向函数传递参数。\n\
  \n### 重载函数\n\n具有相同名称和返回类型但具有不同参数或参数集的函数被称为重载函数。在某些应用程序中，重载函数非常有用，即产生特定类型输出的特定名称函数可能需要使用不同的参数集调用。假设你需要编写一个计算圆面积和圆柱体面积的应用。计算圆面积的函数需要一个参数——半径。另一个计算圆柱体面积的函数除了半径外还需要圆柱的高度。两个函数都需要返回相同类型的数据（包含面积）。因此，C++\
  \ 允许你定义两个重载函数，都称为 `Area`，都返回 `double`，但一个只接受半径作为输入，另一个接受高度和半径作为输入参数，如 列表 7.7 所示。\n\
  \n列表 7.7. 使用重载函数计算圆或圆柱体的面积\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: using\
  \ namespace std;\n2:\n3: const double Pi = 3.14159;\n4:\n5: double Area(double Radius);\
  \   // 用于圆\n6: double Area(double Radius, double Height); // 用于圆柱体的重载\n7:\n8: int\
  \ main()\n9: {\n10:     cout << \"Enter z for Cylinder, c for Circle: \";\n11: \
  \    char Choice = 'z';\n12:     cin >> Choice;\n13:\n14:     cout << \"Enter radius:\
  \ \";\n15:     double Radius = 0;\n16:     cin >> Radius;\n17:\n18:     if (Choice\
  \ == 'z')\n19:     {\n20:         cout << \"Enter height: \";\n21:         double\
  \ Height = 0;\n22:         cin >> Height;\n23:\n24:         // 为圆柱体调用 Area 的重载版本\n\
  25:         cout << \"Area of cylinder is: \" << Area (Radius, Height) << endl;\n\
  26:     }\n27:     else\n28:         cout << \"Area of cylinder is: \" << Area (Radius)\
  \ << endl;\n29:\n30:     return 0;\n31: }\n32:\n33: // 用于圆\n34: double Area(double\
  \ Radius)\n35: {\n36:     return Pi * Radius * Radius;\n37: }\n38:\n39: // 用于圆柱体的重载\n\
  40: double Area(double Radius, double Height)\n41: {\n42:     // 复用圆的面积\n43:   \
  \  return 2 * Area (Radius) + 2 * Pi * Radius * Height;\n44: }\n```\n\n### 输出\n\n\
  点击此处查看代码图片\n输入 z 代表圆柱体，c 代表圆：z\n输入半径：2\n输入高度：5\n圆柱体面积为：87.9646\n\n下次运行：\n\n点击此处查看代码图片\n\
  输入 z 代表圆柱体，c 代表圆：z\n输入半径：1\n面积：3.14159\n\n\n\n\n\n```cpp\n27: return Pi * InputRadius\
  \ * InputRadius;\n28: }\n```\n\n在这里，参数 `InputRadius` 包含一个在 `main()` 中调用函数时被拷贝到它的值：\n\
  \n点击此处查看代码图片\n\n```cpp\n15:    // 调用函数 \"Area\"\n16:    cout << \"Area is: \" <<\
  \ Area(Radius) << endl;\n```\n\n这意味着 `main` 中的变量 `Radius` 不受函数调用的影响，因为 `Area()`\
  \ 作用于 `Radius` 所包含的值的副本，而该副本被存储在 `InputRadius` 中。在某些情况下，你可能需要函数作用于一个可以修改函数外部可用值的变量，例如调用函数中的变量。这时，你需要声明一个*按引用*（by\
  \ reference）接收参数的参数。按引用形式计算并返回面积的 `Area()` 函数形式如下：\n\n点击此处查看代码图片\n\n```cpp\n// 通过引用作为输出参数\
  \ Result\nvoid Area(double Radius, double& Result)\n{\n    Result = Pi * Radius\
  \ * Radius;\n}\n```\n\n注意这种形式的 `Area()` 带有两个参数。不要漏掉第二个参数 `Result` 旁的连接符号（`&`）。该符号告诉编译器第二个参数**不应**被拷贝到函数中；相反，它是所传递变量的引用。返回类型已改为\
  \ `void`，因为函数不再将计算出的面积作为返回值提供，而是作为一个按引用的输出参数。通过引用返回返回值在列表 7.9 中演示，该列表计算了圆的面积。\n\n\
  列表 7.9. 以引用参数而非返回值获取圆面积\n\n点击此处查看代码图片\n\n* * *\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: const double Pi = 3.1416;\n4:\n5: // 通过引用作为输出参数\
  \ Result\n6: void Area(double Radius, double& Result)\n7: {\n8:     Result = Pi\
  \ * Radius * Radius;\n9: }\n10:\n11: int main()\n12: {\n13:     cout << \"Enter\
  \ radius: \";\n14:     double Radius = 0;\n15:     cin >> Radius;\n16:\n17:    \
  \ double AreaFetched = 0;\n18:     Area(Radius, AreaFetched);\n19:\n20:     cout\
  \ << \"The area is: \" << AreaFetched << endl;\n21:     return 0;\n22: }\n```\n\n\
  * * *\n\n* * *\n\n### 输出\n\n点击此处查看代码图片\n\nEnter radius: 2\nThe area is: 12.5664\n\
  \n* * *\n\n* * *\n\n### 分析\n\n注意第 17 行和第 18 行，函数 `Area` 使用两个参数被调用；第二个参数应该是包含结果的变量。由于\
  \ `Area` 按引用接收第二个参数，`Area` 内部第 8 行使用的变量 `Result` 指向与调用者 `main()` 中第 17 行定义的 `double\
  \ AreaFetched` 相同的内存位置。因此，在函数 `Area` 第 8 行中计算的结果在 `main` 中可用，并在第 20 行显示在屏幕上。\n\n\
  * * *\n\n* * *\n\n### 注意事项\n\n函数只能使用 `return` 语句返回一个值。因此，如果你的函数需要执行影响调用者处所需的许多值的操作，那么按引用传递参数是让函数将这些许多修改传回调用模块的一种方法。\n\
  \n* * *\n\n### 微处理器如何处理函数调用\n\n虽然确切知道函数调用在微处理器层级是如何实现的并不极端重要，但你可能会觉得这很有趣。理解这有助于你理解为什么\
  \ C++ 提供了编程内联函数（inline functions）的选项，这些将在本节的稍后部分进行解释。\n\n函数调用本质上意味着微处理器跳转到非连续内存位置处执行属于被调用函数的下一条指令。在执行完函数中的指令后，它返回到之前停止的地方。为了实现这一逻辑，编译器会将你的函数调用转换为微处理器的\
  \ `CALL` 指令，指定下一条指令需要跳转的地址——该地址属于你的函数例程。在编译函数本身时，编译器会将返回指令转换为微处理器的 `RET` 指令。\n\n\
  当微处理器遇到 `CALL` 时，它会将函数调用后要执行指令的位置保存在栈上，并跳转到 `CALL` 指令包含的内存位置。\n\n* * *\n\n### 理解栈\n\
  \n栈是一个后进先出（Last-In-First-Out）的内存结构，就像一叠盘子，你拿起顶部的盘子，它是最后被放在栈上的一个。将数据放入栈中称为“推”（*push*）操作。从栈中取出数据称为“弹出”（*pop*）操作。随着栈的增长，栈指针递增并指向栈顶。参见图\
  \ 7.3。\n\n![图 7.3](img/073.jpg)\n\n栈的性质使其成为处理函数调用的理想选择。当函数被调用时，栈存储返回地址。当函数结束时，`RET`\
  \ 指令从栈中弹出该地址。\n\n#### 内联函数\n\n普通的函数调用被转换为 `CALL` 指令，这会导致栈操作等。这听起来在底层有很多操作，但在大多数情况下它执行得很快。然而，如果你的函数非常简单，如下：\n\
  \n```cpp\ndouble GetPi()\n{\n    return 3.14159;\n}\n```\n\n对于这种函数，执行实际函数调用的开销可能相当大。这就是为什么\
  \ C++ 编译器允许程序员将此类函数声明为内联。`inline` 是程序员请求在调用处展开这些函数。\n\n```cpp\ninline double GetPi()\n\
  {\n    return 3.14159;\n}\n```\n\n同样，只需翻倍数字并执行此类简单操作的函数也是内联的候选对象。列表 7.10\n\n* *\
  \ *\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: 定义一个翻倍的内联函数\n\
  4: inline long DoubleNum (int InputNum)\n5: {\n6:     return InputNum * 2;\n7: }\n\
  8:\n9: int main()\n10: {\n11:     cout << \"Enter an integer: \";\n12:     int InputNum\
  \ = 0;\n13:     cin >> InputNum;\n14:\n15:     // 调用内联函数\n16:     cout << \"Double\
  \ is: \" << DoubleNum(InputNum) << endl;\n17:\n18:     return 0;\n19: }\n```\n\n\
  * * *\n\n### 分析\n\n所涉及的关键字是第 4 行使用的 `inline`。编译器通常将此关键字视为请求在调用处直接展开 `DoubleNum`\
  \ 函数的内，从而提高代码的执行速度。\n\n\n\n\n\n将函数分类为内联（inline）也会导致大量的代码膨胀，特别是当内联函数执行了许多复杂的处理时。`inline`\
  \ 关键字的使用应保持在最低，并仅保留给那些执行操作极少且需要以最小开销完成的函数，如前文所示。\n\n### Note\n\n大多数现代 C++ 编译器提供各种性能优化选项。某些编译器，例如\
  \ `Microsoft C++ Compiler`，允许你针对大小或速度进行优化。在为内存可能紧张的设备和外围设备开发软件时，前者非常重要。当针对大小进行优化时，编译器可能会拒绝许多\
  \ `inline` 请求，因为这可能会导致代码膨胀。\n\n当针对速度进行优化时，编译器通常会识别并利用内联代码的机会，并为你完成它——有时在你不没有显式请求的情况下它也会这样做。\n\
  \n## C++11: Lambda Functions\n\n本节仅对一个初学者来说并不容易理解的概念进行介绍。因此，请快速浏览，并尝试学习该概念，如果未能完全掌握也不要感到失望。Lambda\
  \ 函数将在第 22 节 中的“C++11 Lambda 表达式”中进行讨论。\n\n如果你经常使用 STL 算法来排序或处理数据（例如包含在 STL 容器如\
  \ `std::vector`（动态数组）中的数据），那么 Lambda 函数将非常有用。通常，排序需要你提供一个二元谓词，该谓词是在类中作为运算符实现的，这导致了相当繁琐的代码。符合\
  \ C++11 标准的编译器允许你编写 Lambda 函数并大量精简代码，如列表 7.11 所示。\n\n### 列表 7.11. 使用 Lambda 函数显示数组中的元素并对其排序\n\
  \n点击此处查看代码图像\n\n```\n0: #include <iostream>\n1: #include <algorithm>\n2: #include\
  \ <vector>\n3: using namespace std;\n4:\n5: void DisplayNums(vector<int>& DynArray)\n\
  6: {\n7:     for_each (DynArray.begin(), DynArray.end(), \\\n8                 [](int\
  \ Element) {cout << Element << \" \";} }); lambda\n9:\n10:    cout << endl;\n11:\
  \ }\n12:\n13: int main()\n14: {\n15:     vector<int> MyNumbers;\n16:     MyNumbers.push_back(501);\n\
  17:     MyNumbers.push_back(-1);\n18:     MyNumbers.push_back(25);\n19:     MyNumbers.push_back(-35);\n\
  20:\n21:     DisplayNums(MyNumbers);\n22:\n23:     cout << \"Sorting them in descending\
  \ order\" << endl;\n24:\n25:     sort (MyNumbers.begin(), MyNumbers.end(), \\\n\
  26:             [](int Num1, int Num2) {return (Num2 < Num1); } );\n27:\n28:   \
  \  DisplayNums(MyNumbers);\n29:\n30:     return 0;\n31: }\n```\n\n### Output\n\n\
  点击此处查看代码图像\n\n501 -1 25 -35\nSorting them in descending order\n501 25 -1 -35\n\n\
  ### Analysis\n\n程序在第 15–19 行包含了推入由 C++ 标准库提供的以 `std::vector` 形式表示的动态数组中的整型。`DisplayNums`\
  \ 函数使用 STL 算法遍历数组中的每个元素并显示其值。在此过程中，它在第 8 行使用了一个 Lambda 函数，而不是本应该是长一元函数谓词。第 25 行使用的\
  \ `std::sort` 同样以 Lambda 函数的形式使用了一个二元谓词（第 26 行），如果第二个数字小于第一个数字，则返回 `true`，从而有效地对集合进行升序排序。\n\
  \nLambda 函数的语法如下：\n\n点击此处查看代码图像\n\n```\n可选参数{ 语句; }\n```\n\n## Summary\n\n在本节中，你学习了模块化编程的基础知识。你学习了函数如何帮助你更好地组织代码，并帮助你重用编写的算法。你学习了函数可以接受参数并返回值，参数可以具有调用者可以覆盖的默认值，参数还可以包含通过引用传递的参数。你学习了如何传递数组，还学习了如何编写具有相同名称和返回类型但不同参数列表的重载函数。\n\
  \n最后，你初步了解了什么是 Lambda 函数。作为 C++11 的全新特性，它们具有改变应用程序工作方式的潜力。\n\n## Q&A\n\n**Q:** 如果我编写了一个不会结束的递归函数会怎样？\n\
  **A:** 它会消耗更多的栈空间，最终导致空间耗尽，引起应用程序崩溃。\n\n**Q:** 为什么不将每个函数都内联化？\n**A:** 这取决于编译器。\n\
  \n**Q:** 我可以为所有参数提供默认值吗？\n**A:** 是的，这是可能的且推荐的。\n\n**Q:** 我有两个同名但返回类型不同的函数。这能行吗？\n\
  **A:** 函数重载需要不同的参数列表。\n\n## Workshop\n\n工作坊提供了测试题帮助你巩固材料，并提供了练习让你获得使用所学内容的经验。在检查\
