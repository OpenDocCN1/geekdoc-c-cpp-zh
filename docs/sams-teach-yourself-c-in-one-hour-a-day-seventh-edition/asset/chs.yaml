  \ 的区别是什么？\n\n#### 练习\n\n1. 编写一个二元谓词，接受字符串作为输入参数并根据不区分大小写的比较返回结果。\n\n2. 演示 STL 算法（如\
  \ `copy`）如何通过在两个不同容器的两个序列之间拷贝，使用迭代器执行功能，而无需知道目标容器的性质。\n\n3. 你正在编写一个应用程序，按照恒星升起的顺序记录出现在地平线上的星星特征。在天文中，星星的大小以及它们相对升落顺序的信息是非常重要的。如果你正在根据大小对这些星星集合进行排序，你会使用\
  \ `std::sort` 还是 `std::stable_sort`？\n\n## 第 24 own：适配容器：栈与队列\n\n标准模板库（STL）具有通过适配其他容器来模拟栈和队列行为的容器。这些内部使用另一个容器并呈现独特行为的容器被称为适配容器。\n\
  \n在本节中，你将学习：\n\n- 栈和队列的行为特征\n- 使用 STL `stack`\n- 使用 STL `queue`\n- 使用 STL `priority_queue`\n\
  \n### 栈和队列的行为特征\n\n栈和队列非常像数组或列表，但对元素的插入、访问和删除方式有限制。它们的行为特征完全取决于元素插入时的位置或可以从容器中删除的元素的位置。\n\
  \n#### 栈\n\n栈是 LIFO（后进先出）系统。元素从顶部插入和移除。最后添加的元素是第一个被移除的。\n\n行为特征完全取决于元素插入时的位置或可以从容器中删除的元素的位置。\n\
  \n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n#### 队列\n\n队列是 FIFO（先进先出）系统。元素从尾插入并从头移除。第一个添加的元素是第一个被移除的。\n\
  \n### 使用 STL 栈\n\nSTL `stack` 是一个需要包含头文件 `<stack>` 的模板类。它是一个泛类，允许在顶部进行插入和移除，并且不允许对中间元素进行任何访问或检查。在某种方面，`std::stack`\
  \ 的行为与一叠盘非常相似。\n\n\n\n\n\n```cpp\n// 一个整数栈\nstack<int> stackInts;\n\n// 一个双精度浮栈\n\
  stack<double> stackDoubles;\n\n// 一个包含在 vector 中的双精度浮栈\nstack<double, vector<double>>\
  \ stackDoublesInVector;\n\n// 将一个栈初始化为另一个的拷贝\nstack<int> stackIntsCopy(stackInts);\n\
  \nreturn 0;\n}\n```\n\n### Analysis\n\n该示例没有产生输出，但演示了 STL `stack` 的模板实例化。第 8 行和第\
  \ 11 行实例化了两个 `stack` 对象，分别存储 `int` 和 `double` 类型的元素。第 14 行也实例化了一个 `double` 类型的 `stack`，但指定了第二个模板参数——即\
  \ `stack` 内部使用的容器类类型，这里 `vector`。如果不提供此第二个模板参数，`stack` 将自动默认使用 `std::deque`。最后，第\
  \ 17 行演示了一个 `stack` 对象可以作为另一个对象的拷贝进行构造。\n\n### Member Functions（成员函数）\n\n`stack`\
  \ 适配了另一个容器（如 `deque`、`list` 或 `vector`），它通过限制元素插入或删除的方式来实现功能，从而提供严格符合栈式机制的预期的行为。表\
  \ 24.1 解释了 `stack` 类的公共成员函数，并演示了它们在整数栈中的用法。\n\n表 24.1. `std::stack` 的成员函数\n\n![Image](img/24tab01.jpg)\n\
  \n如表所示，栈的公共成员函数仅暴露了允许在符合栈行为的位置进行插入和删除的方法。也就是说，尽管底层的容器可能可能是 `deque`、`vector` 或 `list`，但该容器的功能并未暴露，以强制执行栈的行为特质。\n\
  \n### Insertion and Removal at Top Using push() and pop()（在栈顶插入和删除：使用 push() 和 pop()\
  \ 在栈顶进行插入和删除）\n\n元素的插入使用成员方法 `stack<T>::push()` 完成：\n\n点击此处查看代码图像\n\n```cpp\nstackInts.push\
  \ (25); // 25 位于栈顶\n```\n\n根据定义，栈允许通过成员 `top()` 访问通常位于顶部的元素：\n\n点击此处查看代码图像\n\n```cpp\n\
  cout << stackInts.top() << endl;\n```\n\n如果你想移除顶部的元素，可以使用函数 `pop()` 来帮助你：\n\n点击此处查看代码图像\n\
  \n```cpp\nstackInts.pop (); // pop: 移除栈顶元素\n```\n\n列表 24.2 演示了使用 `push()` 在 `stack`\
  \ 中插入元素并使用 `pop()` 移除元素。\n\n列表 24.2. 整数栈的操作\n\n点击此处查看代码图像\n\n```cpp\n#include <stack>\n\
  #include <iostream>\n\nint main ()\n{\n    using namespace std;\n    stack <int>\
  \ stackInts;\n\n    // push: 在栈顶插入值\n    cout << \"Pushing {25, 10, -1, 5} on stack\
  \ in that order:\" << endl;\n    stackInts.push (25);\n    stackInts.push (10);\n\
  \    stackInts.push (-1);\n    stackInts.push (5);\n\n    cout << \"Stack contains\
  \ \" << stackInts.size () << \" elements\" << endl;\n    while (stackInts.size ()\
  \ != 0)\n    {\n        cout << \"Popping topmost element: \" << stackInts.top()\
  \ << endl;\n        stackInts.pop (); // pop: 移除栈顶元素\n    }\n\n    if (stackInts.empty\
  \ ())  // true: 由于之前的 pop() 操作导致\n        cout << \"Popping all elements empties!\"\
  \ << endl;\n    return 0;\n}\n```\n\n#### Output（输出）\n\n点击此处查看代码图像\n```\nPushing\
  \ {25, 10, -1, 5} on stack in that order:\nStack contains 4 elements\nPopping topmost\
  \ element: 5\nPopping topmost element: -1\nPopping topmost element: 10\nPopping\
  \ topmost element: 25\nPopping all elements empties!\n```\n\n### Analysis\n\n该示例首先使用\
  \ `stack::push()`（如第 9-13 行所示）向整数栈 `stackInts` 中插入数字。接着使用 `stack::pop()` 删除元素。由于\
  \ `stack` 仅允许访问顶部的元素，因此如第 18 行所示，可以使用成员 `stack::top()` 访问顶部的元素。如第 19 行所示，可以使用 `stack::pop()`\
  \ 逐个从 `stack` 中删除元素。其周围的 `while` 循环确保了 `pop()` 操作重复执行，直到栈为空。从弹出的元素顺序可以看出，最后插入的元素最弹出，这演示了\
  \ `stack` 典型的后进先出（LIFO）行为。\n\n列表 24.2 演示了栈的所有成员函数。注意，`push_back` 和 `insert` 是可用的（指容器，此处\
  \ `stack` 不可用）。\n\n\n\n\n## 队列（queue）的成员函数\n\n`std::queue` 像 `std::stack` 一样，其实现也基于\
  \ STL 容器，如 `vector`、`list` 或 `deque`。`queue` 仅暴露了实现队列行为特征的成员函数。表 24.2 使用 `qIntegers`\
  \ 解释了这些成员函数，而列表 24.3 展示了这是一个整数队列 `queue`。\n\n表 24.2. `std::queue` 的成员函数\n\n![Image](img/24tab02.jpg)\n\
  \nSTL `queue` 并不具备 `begin()` 和 `end()` 等函数，这些函数是由大多数 STL 容器提供的，包括 `queue` 类所使用的底层\
  \ `deque`、`vector` 或 `list`。这样做是有意的，以确保对 `queue` 的唯一允许操作是符合 `queue` 行为特征的操作。\n\n\
  ## 通过 push() 和 pop() 在队列的末尾插入和从头部删除\n\n在队列中插入元素发生在末尾，并使用成员方法 `push()` 完成：\n\n点击此处查看代码图片\n\
  \n```cpp\nqIntegers.push (5);  // 插入的元素被放置在末尾\n```\n\n相反，删除发生在头部，并通过 `pop()` 完成：\n\
  \n点击此处查看代码图片\n\n```cpp\nqIntegers.pop ();  // 移除头部元素\n```\n\n与 `stack` 不同，`queue`\
  \ 允许对容器的两端（即容器的 `front` 和 `back`）进行检查：\n\n点击此处查看代码图片\n\n```cpp\ncout << \"Element\
  \ at front: \" << qIntegers.front() << endl;\ncout << \"Element at back: \" << qIntegers.back\
  \ () << endl;\n```\n\n插入、删除和检查在列表 24.4 中演示。\n\n列表 24.4. 在整数队列中插入、删除和检查元素\n\n点击此处查看代码图片\n\
  \n```cpp\n0: #include <queue>\n1: #include <iostream>\n2:\n3: int main ()\n4: {\n\
  5:     using namespace std;\n6:     queue <int> qIntegers;\n7:\n8:     cout << \"\
  Inserting {10, 5, -1, 20} into queue\" << endl;\n9:     qIntegers.push (10);\n10:\
  \     qIntegers.push (5);  // 插入的元素被放置在末尾\n11:     qIntegers.push (-1);\n12:   \
  \  qIntegers.push (20);\n13:\n14:     cout << \"Queue contains \" << qIntegers.size\
  \ () << \" elements\" << endl;\n15:     cout << \"Element at front: \" << qIntegers.front()\
  \ << endl;\n16:     cout << \"Element at back: \" << qIntegers.back () << endl;\n\
  17:\n18:     while (qIntegers.size () != 0)\n19:     {\n20:         cout << \"Deleting\
  \ element: \" << qIntegers.front () << endl;\n21:         qIntegers.pop ();  //\
  \ 移除头部元素\n22:     }\n23:\n24:     if (qIntegers.empty ())  // 因为所有元素都被 pop() 掉了，所以为\
  \ true\n25:         cout << \"The queue is now empty!\" << endl;\n26:\n27:     return\
  \ 0;\n28: }\n```\n\n### 输出\n\n点击此处查看代码图片\n\n```text\nInserting {10, 5, -1, 20} into\
  \ queue\nQueue contains 4 elements\nElement at front: 10\nElement at back: 20\n\
  Deleting element: 10\nDeleting element: 5\nDeleting element: -1\nDeleting element:\
  \ 20\n```\n\n### 析\n\n第 9-12 行使用 `push()` 将元素添加到 `qIntegers` 中，这会将它们插入到队列的末尾（或后面）。第\
  \ 15 行和第 16 行使用 `front()` 和 `back()` 方法引用队列头部和尾位置的元素。第 18-22 行的 `while 循环` 显示了队列头部的元素，然后在第\
  \ 21 行使用 `pop()` 操作将其移除。它会继续这样做，直到队列为空。输出表明，元素从队列中删除的顺序与它们插入的顺序相同，因为元素是被插入到队列的。\n\
  \n## 使用 STL 优先级队列（Priority Queue）\n\nSTL `priority_queue` 是一个模板类，也需要包含头文件 `<queue>`。`priority_queue`\
  \ 与 `queue` 的不同在于，高值元素（或被二元词认为最高的值）位于队列的头部，且队列操作被限于头部。\n\n### 实例化 priority_queue\
  \ 类\n\n`std::priority_queue` 类定义如下：\n\n```cpp\ntemplate <\n    class elementType,\n\
  \    class Container=vector<\n    class Compare=less<typename Container::value_type>\n\
  >\nclass priority_queue\n```\n\n在这里，`elementType` 是模板参数，用于传递优先级队列中收集的元素类型。第二个模板参数告诉集合类在\
  \ `priority_queue` 内部用于存储数据，而第三个参数允许程序员指定一个二元谓词，帮助队列确定哪个元素位于顶部。在没有指定二元谓词的情况下，`priority_queue`\
  \ 类使用默认的 `std::less`，它使用 `operator<` 比较两个对象。\n\n整数类型 `priority_queue` 最简单的实例化是：\n\
  \n```cpp\nstd::priority_queue<int> pqIntegers;\n```\n\n如果你想在 `std::deque` 内部创建一个包含\
  \ `double` 类型元素的优先级队列：\n\n```cpp\npriority_queue<int, deque<int>, greater<int>>\
  \ pqIntegers_Inverse;\n```\n\n就像 `stack` 一样，队列也可以实例化为另一个队列的拷贝：\n\n```cpp\nstd::priority_queue<int>\
  \ pqCopy(pqIntegers);\n```\n\n`priority_queue` 对象的实例化在列表 24.5 中演示。\n\n列表 24.5. 实例化优先级队列\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <queue>\n1:\n2: int main ()\n3: {\n4:     using\
  \ namespace std;\n5:\n6:     // 使用默认 less 的整数优先级队列\n7:     priority_queue<int> pqIntegers;\n\
  8:\n9:     // double 类型优先级队列\n10:     priority_queue<double> pqDoubles;\n11:\n12:\
  \     // 使用 greater<> 的整数优先级队列\n13:     priority_queue<int, deque<int>, greater<int>>\
  \ pqIntegers_Inverse;\n14:\n15:     // 作为另一个队列拷贝的优先级队列\n16:     priority_queue<int>\
  \ pqCopy(pqIntegers);\n17:\n18:     return 0;\n19: }\n```\n\n### 分析\n\n第 7 行和第 10\
  \ 行演示了 `int` 和 `double` 类型的优先级队列。没有其他模板参数会导致使用 `std::vector` 作为内部容器，且比较标准由 `std::less`\
  \ 提供。因此，这些队列的优先级排序使得高值整数位于队列的头部。然而，`pqIntegers_Inverse` 为第二个参数提供了 `deque` 作为内部容器，并使用\
  \ `greater` 作为谓词。该谓词使得最小数值位于头部。\n\n使用谓词 `std::greater<T>` 的影响将在列表 24.7 中解释。\n\n\
  ## 优先级队列的成员函数\n\n`queue` 中的成员函数 `front()` 和 `back()` 在 `priority_queue` 中并不。表 24.3\
  \ 介绍了 `priority_queue` 的成员函数。\n\n如表所示，`queue` 成员只能通过 `top()` 访问，它返回高值元素，该元素通过用户定义的\
  \ `predicate` 或在没有谓词的情况下通过 `std::less` 进行评估。\n\n## 通过 push() 和 pop() 在优先级队列的末尾插入和从头部删除\n\
  \n在 `priority_queue` 中插入元素使用成员方法 `push()` 完成：\n\n点击此处查看代码图片\n\n\n\n\n\n`pqIntegers.push(5);`\
  \ //元素按排序顺序放置\n\n相反，删除操作通过 `pop()` 在开头发生：\n\n点击此处查看代码图片\n\n`pqIntegers.pop();` //\
  \ 删除队元素\n\n`priority_queue` 成员的使用在列表 24.6 中所示。\n\n### 列表 24.6. 使用 `push()`、`top()`\
  \ 和 `pop()` 操作 priority_queue\n\n点击此处查看代码图片\n\n```cpp\n0: #include <queue>\n1: #include\
  \ <iostream>\n2:\n3: int main ()\n4: {\n5:     using namespace std;\n6:\n7:    \
  \ priority_queue <int> pqIntegers;\n8:     cout << \"Inserting {10, 5, -1, 20} into\
  \ the priority_queue\" << endl;\n9:     pqIntegers.push (10);\n10:     pqIntegers.push\
  \ (5);  // 按排序顺序放置\n11:     pqIntegers.push (-1);\n12:     pqIntegers.push (20);\n\
  13:\n14:     cout << \"Deleting the \" << pqIntegers.size () << \" elements\" <<\
  \ endl;\n15:     while (!pqIntegers.empty ())\n16:     {\n17:         cout << \"\
  Deleting topmost element: \" << pqIntegers.top () << endl;\n18:         pqIntegers.pop\
  \ ();\n19:     }\n20:\n21:     return 0;\n22: }\n```\n\n### 输出\n\n点击此处查看代码图片\nInserting\
  \ {10, 5, -1, 20} into the priority_queue\nDeleting the 4 elements\nDeleting topmost\
  \ element: 20\nDeleting topmost element: 10\nDeleting topmost element: 5\nDeleting\
  \ topmost element: -1\n\n### 分析\n\n列表 24.6 将示例整数插入 `priority_queue` 中，如第 9–12 行所示，然后使用第\
  \ 18 行所示的 `pop()` 删除顶端/前面的元素。输出表明，值最大的元素位于队列顶部。因此，`priority_queue::pop()` 的使用实际上删除了容器中所有元素中评估为具有最大值的元素，该值也通过第\
  \ 17 行所示的 `top()` 方法暴露。鉴于你没有提供优先级谓词，队列自动转为按降序对元素进行排序（最大值位于顶部）。\n\n下一个示例在列表 24.7\
  \ 中展示了使用 `std::greater<int>` 作为谓词的 `priority_queue` 实例化。该谓词导致 `queue` 将最小的数字评估为值最大的元素，该元素随后便位于优先级队列的头部（`front`）。\n\
  \n### 列表 24.7. 实例化一个将最小值置在顶部的优先级队列\n\n点击此处查看代码图片\n\n```cpp\n0: #include <queue>\n\
  1: #include <iostream>\n2:\n3: int main ()\n4: {\n5:     using namespace std;\n\
  6:\n7:     // 定义一个以 greater <int> 为谓词的 priority_queue 对象\n8:     priority_queue\
  \ <int, vector <int>, greater <int> > pqIntegers;\n9:\n10:     cout << \"Inserting\
  \ {10, 5, -1, 20} into the priority queue\" << endl;\n11:     pqIntegers.push (10);\n\
  12:     pqIntegers.push (5);\n13:     pqIntegers.push (-1);\n14:     pqIntegers.push\
  \ (20);\n15:\n16:     cout << \"Deleting \" << pqIntegers.size () << \" elements\"\
  \ << endl;\n17:     while (!pqIntegers.empty ())\n18:     {\n19:         cout <<\
  \ \"Deleting topmost element \" << pqIntegers.top () << endl;\n20:         pqIntegers.pop\
  \ ();\n21:     }\n22:\n23:     return 0;\n24: }\n```\n\n### 输出\n\n点击此处查看代码图片\nInserting\
  \ {10, 5, -1, 20} into the priority queue\nDeleting 4 elements\nDeleting topmost\
  \ element -1\nDeleting topmost element 5\nDeleting topmost element 10\nDeleting\
  \ topmost element 20\n\n### 分析\n\n此示例中的大部分代码以及提供给 `priority_queue` 的所有值都与上一个示例列表\
  \ 24.6 相同。然而，输出显示了两个队列行为的不同。此 `priority_queue` 在第 8 行使用 `greater<int>` 作为谓词。结果是幅度最小的整数被放置在顶部，并通过第\
  \ 19 行的 `top()` 显示，并在第 20 行通过 `pop()` 删除。\n\n## 25. 使用 STL 处理位标志\n\n位可以是存储设置和标志的一种非常高效的方法。标准模板库（STL）提供了帮助组织和操作位信息的类。本节介绍你：\n\
  \n• `bitset` 类\n\n• `vector<bool>`\n\n### bitset 类\n\n`std::bitset` 是为处理位信息和位标志设计的\
  \ STL 类。`std::bitset` 不是 STL 容器类，因为它无法调整大小。这是一个专门用于处理长度在编译时知的位序列的工具类。\n\n### 提示\n\
  \n要使用 `bitset` 类，请包含头文件：\n\n```\n#include <bitset>\n```\n\n#### 实例化 std::bitset\n\
  \n此模板类要求你提供一个模板参数，包含该类实例管理的位数数量：\n\n点击此处查看代码图片\n\n```cpp\nbitset <4> fourBits; //\
  \ 4 位初始化为 0000\n```\n\n\n你也可以将 `bitset` 初始化为`char*` 字符串字面量表示的位序列：\n\n点击此处查看代码图像\n\
  \n```cpp\nbitset <5> fiveBits (\"10101\"); // 5 位 10101\n```\n\n在实例化另一个 bitset 的同时从一个\
  \ bitset 拷贝是非常非常简单：\n\n点击此处查看代码图像\n\n```cpp\nbitset <8> eightBitsCopy(eightbits);\n\
  ```\n\n列表 25.1 展示了 `bitset` 类的一些实例化技术。\n\n### 列表 25.1. 实例化一个 std::bitset\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <bitset>\n1: #include <iostream>\n2: #include <string>\n3:\n\
  4: int main ()\n5: {\n6:     using namespace std;\n7:\n8:     // 实例化一个 bitset 对象\n\
  9:     bitset <4> fourBits;  // 4 位初始化为 0000\n10:     cout << \"Initial contents\
  \ of fourBits: \" << fourBits << endl;\n11:\n12:     bitset <5> fiveBits (\"10101\"\
  ); // 5 位 10101\n13:     cout << \"Initial contents of fiveBits: \" << fiveBits\
  \ << endl;\n14:\n15:     bitset <8> eightbits (255); // 8 位初始化为长整数 255\n16:    \
  \ cout << \"Initial contents of eightBits: \" << eightbits << endl;\n17:\n18:  \
  \   // 将一个 bitset 实例化为另一个的拷贝\n19:     bitset <8> eightBitsCopy(eightbits);\n20:\n\
  21:     return 0;\n22: }\n```\n\n### 输出\n\n点击此处查看代码图像\n```\nInitial contents of\
  \ fourBits: 0000\nInitial contents of fiveBits: 10101\nInitial contents of eightBits:\
  \ 11111111\n```\n\n### 分析\n\n该示例演示了构造 `bitset` 对象的四种不同方法。默认构造函数将位序列初始化为 0，如第 9 行所示。第\
  \ 12 行使用了包含所需位序列字符串表示的 C 风格字符串。第 15 行使用了一个持有二进制序列十进制值的 `unsigned long`，第 19 行使用了拷贝构造函数。注意，在这些实例中，你都必须作为模板参数提供\
  \ `bitset` 预期包含的位数。这个数字在编译时是固定的；它不是动态的。你不能像在 `vector` 中插入比编译时规划的 `size()` 更多的元素那样，向\
  \ `bitset` 中插入比你在代码中指定的更多的位。\n\n### 使用 std::bitset 及其成员函数\n\n`bitset` 类提供了成员函数，可以帮助向\
  \ `bitset` 插入内容、设置或重置内容、读取位或将它们写入流中。它还提供了运算符，帮助显示 `bitset` 的内容并执行按位逻辑操作等。\n\n####\
  \ std::bitset 中介绍的实用运算符\n\n你已经在第 12 节 节“运算符类型和运算符重载”中学习了运算符，你还学到了运算符最重要的作用是增加类的易用性。`std::bitset`\
  \ 提供了一些非常有用的运算符，如表 25.1 所示，这使得使用它变得非常容易。这些运算符通过你在列表 25.1 中学习的 `bitset` 示例 `fourBits`\
  \ 进行解释。\n\n表 25.1. `std::bitset` 支持的运算符\n\n![Image](img/25tab01.jpg)\n\n除了这些，`std::bitset`\
  \ 还具有如 `|=`、`&=`、`^=` 和 `~=` 等运算符，有助于对 `bitset` 对象执行按位操作。\n\n#### std::bitset 成员方法\n\
  \n位可以持有两种状态——它们要么被设置（1），要么被重置（0）。为了帮助操作 `bitset` 的内容，你可以使用表 25.2 中列出的成员函数，这些函数可以帮助你处理单个\
  \ `bit` 或 `bitset` 中的所有 `bits`。\n\n表 25.2. `std::bitset` 的成员方法\n\n![Image](img/25tab02.jpg)\n\
  \n这些成员方法和运算符用法在列表 25.2 中演示。\n\n#### 列表 25.2. 使用 Bitset 执行逻辑操作\n\n点击此处查看代码图像\n\n\
  ```cpp\n0: #include <bitset>\n1: #include <string>\n2: #include <iostream>\n3:\n\
  4: int main ()\n5: {\n6:     using namespace std;\n7:     bitset <8> inputBits;\n\
  8:     cout << \"Enter a 8-bit sequence: \";\n9:     cin >> inputBits;\n10:    \
  \ cout << \"Number of 1s: \" << inputBits.count() << endl;\n11:     cout << \"Number\
  \ of 0s: \" << 8 - inputBits.count() << endl;\n12:     bitset <8> inputFlipped(inputBits);\n\
  13:     inputFlipped.flip();\n14:     cout << \"Flipped version: \" << inputFlipped\
  \ << endl;\n15:     cout << \"Result of AND between the two bitsets:\" << endl;\n\
  16:     cout << (inputBits & inputFlipped) << endl;\n17:     cout << \"Result of\
  \ OR between the two bitsets:\" << endl;\n18:     cout << (inputBits | inputFlipped)\
  \ << endl;\n19:     cout << \"Result of XOR between the two bitsets:\" << endl;\n\
  20:     cout << (inputBits ^ inputFlipped) << endl;\n21:     return 0;\n22: }\n\
  ```\n*(注：由于提供的原文文本中列表 25.2 的代码块似乎存在严重的乱码/重复错误，此处翻译基于逻辑上下文进行了对齐处理，以确保语义一致。)*\n\n\
  **注：由于您提供的原文中 `Listing 25.2` 的代码部分存在大量的文本重复和乱码，上述译文根据代码逻辑进行了修复性翻译。**\n\n\n\n\n\n\
  ```cpp\n// 使用默认构造函数实例化对象\nvector <bool> vecBool1;\n\n// 初始化一个包含 10 个元素且值为 true 的\
  \ vector\nvector <bool> vecBool2 (10, true);\n\n// 实例化一个对象作为另一个对象的拷贝\nvector <bool>\
  \ vecBool2Copy (vecBool2);\n\nreturn 0;\n}\n```\n\n***\n\n### 分析\n\n此示例展示了 `vector<bool>`\
  \ 对象的几种构造方法。第 7 行使用了默认构造函数。第 10 行演示了创建一个包含 10 个 `boolean` 标志位的对象，每个标志位的值均为 `true`。第\
  \ 13 行演示了如何将一个 `vector<bool>` 构造为另一个对象的拷贝。\n\n***\n\n## vector<bool> 函数和运算符\n\n\
  `vector<bool>` 具有 `flip()` 函数，它可以翻转序列中布尔值的状态，类似于 `bitset<>::flip()` 函数的功能。\n\n此外，该类在某些方面与\
  \ `std::vector` 非常相似，例如，你甚至可以向序列中 `push_back` 标志位。列表 25.4 中的示例进一步详细介绍了该类的用法。\n\n\
  列表 25.4. 使用 vector<bool>\n\n点击此处查看代码图像\n\n***\n\n```cpp\n#include <vector>\n#include\
  \ <iostream>\nusing namespace std;\n\nint main ()\n{\n    vector <bool> vecBoolFlags\
  \ (3);  // 实例化以持有 3 个 bool 标志位\n    vecBoolFlags [0] = true;\n    vecBoolFlags [1]\
  \ = true;\n    vecBoolFlags [2] = false;\n\n    vecBoolFlags.push_back (true); //\
  \ 在末尾插入第四个 bool 标志\n\n    cout << \"The contents of the vector are: \" << endl;\n\
  \    for (size_t nIndex = 0; nIndex < vecBoolFlags.size (); ++ nIndex)\n       \
  \ cout << vecBoolFlags [nIndex] << ' ';\n\n    cout << endl;\n    vecBoolFlags.flip\
  \ ();\n\n    cout << \"The contents of the vector are: \" << endl;\n    for (size_t\
  \ nIndex = 0; nIndex < vecBoolFlags.size (); ++ nIndex)\n        cout << vecBoolFlags\
  \ [nIndex] << ' ';\n\n    cout << endl;\n\n    return 0;\n}\n```\n\n***\n\n### 输出\n\
  \n点击此处查看代码图像\n\nThe vector contents are:\n1 1 0 1\n\nThe vector contents are:\n\
  0 0 1 0\n\n***\n\n### 分析\n\n在此示例中，vector 中的布尔标志位是通过 `operator[]` 访问的，正如第 7–9 行所示，就像访问普通\
  \ vector 一样。第 18 行使用的 `flip()` 函数翻转单个标志位，本质上是将所有的 0 转换为 1，反之亦然。注意第 11 行中 `push_back()`\
  \ 的用法。尽管你在第 6 行初始化 `vecBoolFlags` 包含三个标志，但你可以在第 11 行动态地添加更多。`std::bitset` 无法添加多于编译时指定数量的标志位。\n\
  \n***\n\n### 总结\n\n在本节中，你学习了处理位序列和位标志的最有效工具：`std::bitset` 类。你还学习了 `vector<bool>`\
  \ 类，它允许你存储布尔标志——而标志的数量不需要在编译时已知。\n\n### 问答\n\nQ. 在 `std::bitset` 和 `vector<bool>`\
