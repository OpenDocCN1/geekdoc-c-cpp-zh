  \ 已充分利用了其容量，而下一个元素的插入将导致 `vector` 重新分配其内部缓冲区，在插入新值之前复制现有的值。\n\n### 注意事项\n当内部缓冲区重新分配时，预先增加\
  \ `vector` 容量的行为不受标准库中任何条款的规定。这取决于所使用的 STL 变体。\n\n### The STL deque 类\n`deque`（读音与\
  \ deck 同韵）是一种 STL 动态数组类，其属性与 `vector` 非常相似，不同在于它允许在数组的前部和尾部插入和删除元素。你可以像这样实例化一个整数\
  \ `deque`：\n\n点击此处查看代码图像\n\n```cpp\n// 定义一个整数 deque\ndeque <int> dqIntegers;\n```\n\
  \n### 提示\n要使用 `std::deque`，请包含头文件 `<deque>`：\n```cpp\n#include<deque>\n```\n\n`deque`\
  \ 的可视化如图 17.2 所示。\n\n![图像](img/17fig02.jpg)\n图 17.2。deque 的内部结构。\n\n`deque` 与 `vector`\
  \ 非常相似，都通过 `push_back()` 和 `pop_back()` 方法在尾部支持元素的插入和删除。就像 `vector` 一样，`deque` 也允许你通过运算符（`[]`）使用数组语义访问它。`deque`\
  \ 与 `vector` 的之处在于，它还允许你使用 `push_front()` 在头部插入元素，并使用 `pop_front()` 从头部删除，如列表 17.8\
  \ 所示。\n\n列表 17.8。实例化 STL deque 并使用 push_front() 和 pop_front() 方法在头部插入和删除元素\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <deque>\n1: #include <iostream>\n2: #include <algorithm>\n\
  3:\n4: int main ()\n5: {\n6:     using namespace std;\n7:\n8:     // 定义一个整数 deque\n\
  9:     deque <int> dqIntegers;\n10:\n11:     // 在数组底部插入整数\n12:     dqIntegers.push_back\
  \ (3);\n13:     dqIntegers.push_back (4);\n14:     dqIntegers.push_back (5);\n15:\n\
  16:     // 在数组顶部插入整数\n17:     dqIntegers.push_front (2);\n18:     dqIntegers.push_front\
  \ (1);\n19:     dqIntegers.push_front (0);\n20:\n21:     cout << \"The contents\
  \ of the deque after inserting elements \";\n22:     cout << \"at the top and bottom\
  \ are:\" << endl;\n23:\n24:     // 在屏幕上显示内容\n25:     for ( size_t nCount = 0\n26:\
  \     ; < dqIntegers.size ()\n27:     ; ++ nCount )\n28:     {\n29:         cout\
  \ << \"Element [\" << nCount << \"] = \";\n30:         cout << dqIntegers [nCount]\
  \ << endl;\n31:     }\n32:\n33:     cout << endl;\n34:\n35:     // 删除顶部的一个元素\n36:\
  \     dqIntegers.pop_front ();\n37:\n38:     // 删除底部的一个元素\n39:     dqIntegers.pop_back\
  \ ();\n```\n\n\n\n\n# Q. 使用 reserve 成员函数的用处是什么？\n\n**A.** `reserve(...)` 会在 `vector`\
  \ 的内部缓冲区中分配空间，这样插入元素就不需要 `vector` 重新分配缓冲区并复制现有内容。根据存储在 `vector` 中的对象的特殊性，在 `vector`\
  \ 中预留空间可以提高性能。\n\n# Q. 在插入元素方面，`deque` 的属性与 `vector` 有何不同？\n\n**A.** 不，在插入方面，`deque`\
  \ 的属性与 `vector` 相似，对于添加到序列末尾的元素是常数时间操作，而对于插入在中间的元素是线性时间操作。然而，`vector` 只允许在末端（底部）插入，而\
  \ `deque` 允许在两端（顶部和底部）插入。\n\n### 工作坊\n\n工作坊包含测验题以帮助你巩固对所涵盖内容的理解，并提供练习提供使用所学知识的机会。在查看\
  \ 附录 D 中的答案之前，请尝试回答测验和练习题，并在进入下一节之前确保你已经理解了答案。\n\n#### 测验\n\n1. 元素可以在常数时间内插入到 `vector`\
  \ 的中间或开头吗？\n2. 我的 `vector` 返回的 `size()` 为 `10`，`capacity()` 为 `20`。我还可以向其中插入多少元素而不需要触发\
  \ `vector` 类的缓冲区重新分配？\n3. `pop_back` 函数的作用是什么？\n4. 如果 `vector<int>` 是整数的动态数组，那么\
  \ `vector<CMammal>` 是什么类型的动态数组？\n5. `vector` 中的元素可以被随机访问吗？如果是，如何操作？\n6. 什么类型的迭代器类型允许对\
  \ `vector` 中的元素进行随机访问？\n\n#### 练习\n\n1. 编写一个交互式程序，接受用户的整数输入并将其保存到 `vector` 中。用户应该能够根据索引随时查询存储在\
  \ `vector` 中的某个值。\n2. 扩展来自 练习 1 的程序，能够告诉用户其查询的值已存在于 `vector` 中。\n3. Jack 在 eBay\
  \ 上出售罐子。为了帮助他包装和发货，编写一个程序，让他可以输入这些物品的每个尺寸，将它们存储在 `vector` 中并在屏幕上打印。\n\n## 第 18 节\
  \ STL list 和 forward_list\n\n标准模板库（STL）以模板类 `std::list` 的形式为程序员提供了双向链表。链表的主要优势在于可以快速且常数时间内插入和删除元素。从\
  \ C++11 开始，你还可以使用 `std::forward_list` 形式的单向链表，它只能向一个方向遍历。\n\n在本节中，你将学习：\n\n* 如何实例化\
  \ `list` 和 `forward_list`\n* 使用 STL list 类，包括插入和删除\n* 如何反转和排序元素\n\n### std::list\
  \ 的特征\n\n`linked list`（链表）是节点的集合，其中每个节点除了包含感兴趣的值或对象外，还指向下一个节点；也就是说，每个节点与下一个和上一个节点链接，如图\
  \ 18.1 所示。\n\n![Image](img/18fig01.jpg)\n\n图 18.1。双向链表的视觉化表示。\n\nSTL 对 `list` 类的实现允许在列表的顶部、底部或中间进行常数时间的插入。\n\
  \n***\n\n提示\n\n要使用类 `std::list`，请包含头文件：\n\n```cpp\n#include <list>\n```\n\n***\n\
  \n### 基本 list 操作\n\n要使用 STL 的 `list` 类，请包含头文件 `<list>`。存在于 `std` 命名空间中的模板类 `list`\
  \ 是一个通用实现，在使用它的任何有用的成员函数之前，需要对其进行模板实例化。\n\n### 实例化 std::list 对象\n\n`list` 的模板实例化需要指定你想在列表中收集的对象的类型。因此，列表的初始化看起来如下所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::list<int> listIntegers;  // 包含整数的列表\nstd::list<float>\
  \ listFloats;  // 包含浮点数的列表\nstd::list<Tuna> listTuna;      // 包含 Tuna 的列表\n```\n\
  \n要声明一个指向列表中元素的迭代器，你将使用点击此处查看代码图像：\n\n```cpp\nstd::list<int>::const_iterator iElementSet;\n\
  ```\n\n如果你需要一个可以修改元素的迭代器，请使用 `iterator` 而不是 `const_iterator`。\n\n由于 `list` 的实现为你提供了一组构造函数，你甚至可以创建初始化为数量元素的列表，如代码列表\
  \ 18.1](#ch18.html_ch18list01) 所示。\n\n代码列表 18.1。实例化 std::list 的不同形式\n\n```cpp\n\
  #include <list>\n#include <vector>\n\nint main() {\n    using std;\n    // 实例化空列表\n\
  \    list<int> listIntegers;\n\n    // 实例化包含 10 个整数的列表\n    list<int> listWith10Integers(10);\n\
  \n    // 创建另一个列表的精确拷贝\n    list<int> listAnother(listWith10Integers);\n\n    //\
  \ 带有 4 个整数、每个初始化为 99 的列表\n    list<int> listWithInteger99(4, 99);\n\n    // 带有 10\
  \ 个整数、每个为 2011 的向量\n    vector<int> vecIntegers(10, 2011);\n\n    // 使用另一个中的值实例化列表\n\
  \    list<int> listContainsAnother(vecIntegers.cbegin(), vecIntegers.cend());\n\n\
  \    return 0;\n}\n```\n\n***\n\n分析\n\n该程序没有输出，展示了创建列表时各种构造函数的应用。在第 8 行你创建一个空列表，而在第\
  \ 11 行你创建一个包含 10 个整数的列表。第 14 行是一个名为 `listWithInteger99` 的列表，它包含 4 个每个初始化为 99 的整数。第\
  \ 17 行演示了创建另一个列表的精确拷贝。第 20-24 行令人惊讶且好奇！你实例化了一个包含 10 个整数 2011 的向量，然后在第 23 行实例化了一个从向量拷贝元素的列表，使用了\
  \ `vector::cbegin()` 和 `vector::cend()` 返回的 `const` 迭代器（这些是 C++11 中的新功能）。代码列表 18.1\
  \ 也是演示了迭代器如何帮助一个容器的实现与另一个解耦，允许你使用它们的通用功能根据从向量取的值来实例化列表。\n\n\n\n\n通过对比列表 18.1 与第\
  \ 17 节中的 STL 动态数组类 1，你会注意到不同类型容器的实例化方式具有一种显著的模式和相似性。你使用 STL 容器编程得越多，看到的可重用模式就越多，操作也越容易。\n\
  \n### 在列表头或尾插入元素\n\n与 `deque` 类似，在头部（或顶部，取决于你的视角）插入是通过 `list` 成员方法 `push_front()`\
  \ 实现的。在末尾插入使用成员方法 `push_back()`。这两个方法都接受一个输入参数，即要插入的值：\n\n点击此处查看代码图像\n\n```cpp\n\
  listIntegers.push_back (-1);\nlistIntegers.push_front (2001);\n```\n\n列表 18.2 展示了在整数\
  \ `list` 上使用这两种方法的效果。\n\n列表 18.2. 使用 `push_front()` 和 `push_back()` 在列表中插入元素\n\n\
  点击此处查看代码图像\n\n```cpp\n0: #include <list>\n1: #include <iostream>\n2: using namespace\
  \ std;\n3:\n4: template <typename T>\n5: void DisplayContents (const T& Input)\n\
  6: {\n7:     for (auto iElement = Input.cbegin() // auto and cbegin: C++11\n8: \
  \         ; iElement != Input.cend()\n9:         ; ++ iElement )\n10:         cout\
  \ << *iElement << ' ';\n11:\n12:     cout << endl;\n13: }\n14:\n15: int main ()\n\
  16: {\n17:     std::list <int> listIntegers;\n18:\n19:     listIntegers.push_front\
  \ (10);\n20:     listIntegers.push_front (2011);\n21:     listIntegers.push_back\
  \ (-1);\n22:     listIntegers.push_back (9999);\n23:\n24:     DisplayContents(listIntegers);\n\
  25:\n26:     return 0;\n27: }\n```\n\n输出\n2011 10 -1 9999\n\n分析\n第 19–22 行演示了 `push_front()`\
  \ 和 `push_back()` 的用法。作为 `push_front()` 参数提供的值将占据列表的第一个位置，而通过 `push_back()` 发送的值占据最后一个位置。输出通过泛型模板函数\
  \ `DisplayContents()` 显示了列表的内容，展示了插入元素的顺序（并证明它们并不是按照插入顺序存储的）。\n\n### 注意事项：你是否在编译关键字\
  \ `auto` 时遇到错误？\n\n列表 18.2 中的函数 `DisplayContents()` 使用了 C++11 关键字 `auto` 在第 7 行定义迭代器的类型。此外，它还使用了\
  \ C++11 新引入的 `cbegin()` 和 `cend()`，返回一个 `const_iterator`。\n\n在本例以及后续示例中，为了使用不符合\
  \ C++11 的编译器进行编译，你需要将 `auto` 替换为显式类型。\n\n因此，旧版编译器的 `DisplayContents()` 需要修改为：\n\n\
  点击此处查看代码图像\n\n```cpp\ntemplate <typename T>\nvoid DisplayContents (const T& Input)\n\
  {\n    for (T::const_iterator iElement = Input.begin ()\n        ; iElement != Input.end\
  \ ()\n        ; ++ iElement )\n        cout << *iElement << ' ';\n    cout << endl;\n\
  }\n```\n\n### 注意\n列表 18.2 中第 4–13 行的 `DisplayContents()` 是列表 17.6 方法 `DisplayVector()`\
  \ 的更通用版本（注意参数列表发生了变化）。虽然后者仅适用于 `vector`，但此版本通过泛化存储的元素类型，在所有容器类型上都是真正通用的。\n\n你可以使用\
  \ `vector` 或 `list` 作为参数调用列表 18.2 中的 `DisplayContents()` 版本，它可以正常工作。\n\n### 在列表中间插入\n\
  `std::list` 的特点是能够在常数时间内在集合中间插入元素。这是通过成员函数 `insert` 实现的。`list insert` 成员函数有三种形式：\n\
  \n- **形式 1**：`iterator insert(iterator pos, const T& x)` 这里 `insert` 函数接受插入位置作为第一个参数，接受要插入的值作为第二个参数。该函数返回一个指向\
  \ `list` 中新插入元素的迭代器。\n- **形式 2**：`void insert(iterator pos, size_type n, const T&\
  \ x)` 此函数接受插入位置作为第一个参数，要插入的值作为第二个参数，以及数量 `n`。\n- **形式 3**：`template <class InputIterator>\
  \ void insert(iterator pos, InputIterator l)` 此重载版本接受位置，以及标记要插入集合边界的两个迭代器。注意 `InputIterator`\
  \ 是一个模板类型，可以指向任何数组、vector 或另一个 `list`。\n\n列表 18.3 展示了这些 `list::insert` 重载版本的用法。\n\
  \n列表 18.3. 在列表中插入元素的各种方法\n\n点击此处查看代码图像\n\n```cpp\n0: #include <list>\n1: #include\
  \ <iostream>\n2: using namespace std;\n3:\n4: template <typename T>\n5: void DisplayContents\
  \ (const T& Input)\n6: {\n7:     for (auto iElement = Input.cbegin() // auto and\
  \ cbegin: C++11\n8:          ; iElement != Input.cend()\n9:          ; ++ iElement\
  \ )\n10:         cout << *iElement << ' ';\n11:\n12:     cout << endl;\n13: }\n\
  14:\n15: int main ()\n16: {\n17:     std::list <int> listIntegers;\n18:\n19:   \
  \  listIntegers.push_front (10);\n20:     listIntegers.push_front (2011);\n21: \
  \    listIntegers.push_back (-1);\n22:     listIntegers.push_back (9999);\n23:\n\
  24:     DisplayContents(listIntegers);\n25:\n26:     return 0;\n27: }\n```\n\n\n\
  \n\n`begin()` 和 `end()` 是成员函数，分别返回指向 `list` 开头和结尾的迭代器。这对于所有 STL 容器（包括 `std::list`）通常如此。`list\
  \ insert` 函数接受一个迭代器，该迭代器标记了要插入元素的位置之前。如第 24 行所示，由 `end()` 函数返回的迭代器指向 `list` 中最后一个元素之后。因此，该行在末尾之前将整数值\
  \ 3 作为最后一个值进行插入。第 32 行显示了初始化一个包含四个元素的 `list`，这些元素放置于开头（即前端），且每个元素的值都为 0。第 41 行和第\
  \ 42 行演示了如何使用 `list::insert()` 函数将一个 `list` 的元素插入到另一个 `list` 的末尾。虽然这个示例是将一个整数 `list`\
  \ 插入另一个 `list` 中，但插入的范围也可以是 `vector` 的边界（由 `begin()` 和 `end()` 提供，如 列表 18.1 所示），或者是一个普通的静态数组。\n\
  \n### 从列表中擦除元素\n\n`list` 成员函数 `erase` 有两种重载形式：一种是根据一个指向该元素的迭代器来删除该元素，另一种是接受一个范围，从而从\
  \ `list` 中删除该范围内的元素。你可以在 列表 18.4 中看到 `list::erase` 函数的用法，它演示了如何从列表中删除一个元素或一个范围的元素。\n\
  \n列表 18.4. 从列表中擦除元素\n\n点击此处查看代码图像\n\n```\n0: #include <list>\n1: #include <iostream>\n\
  2: using namespace std;\n3:\n4: template <typename T>\n5: void DisplayContents(const\
  \ T& Input)\n6: {\n7:     for(auto iElement = Input.cbegin() // auto and cbegin:\
  \ C++11\n8:         ; iElement != Input.cend()\n9:         ; ++ iElement )\n10:\
  \      cout << *iElement << ' ';\n11:\n12:     cout << endl;\n13: }\n14:\n15: int\
  \ main()\n16: {\n17:     std::list <int> listIntegers;\n18:\n19:     // 在开头和末尾插入元素...\n\
  20:     listIntegers.push_back(4);\n21:     listIntegers.push_front(3);\n22:   \
  \  listIntegers.push_back(5);\n23:\n24:     // 存储使用 'insert' 函数获取的迭代器\n25:     auto\
  \ iValue2 = listIntegers.insert(listIntegers.begin(), 2);\n26:\n27:     cout <<\
  \ \"Initial contents of the list:\" << endl;\n28:     DisplayContents(listIntegers);\n\
  29:\n30:     listIntegers.erase(listIntegers.begin(), iValue2);\n31:     cout <<\
  \ \"Contents after erasing a range of elements:\" << endl;\n32:     DisplayContents(listIntegers);\n\
  33:\n34:     cout << \"After erasing element '\" << *iValue2 << \"':\" << endl;\n\
  35:     listIntegers.erase(iValue2);\n36:     DisplayContents(listIntegers);\n37:\n\
  38:     listIntegers.erase(listIntegers.begin(), listIntegers.end());\n39:     cout\
  \ << \"Number of elements after erasing range: \";\n40:     cout << listIntegers.size()\
  \ << endl;\n41:\n42:     return 0;\n43: }\n```\n\n### 输出\n\n点击此处查看代码图像\nInitial\
  \ contents of the list:\n2 3 4 5\nContents after erasing a range of elements:\n\
  2 3 4 5\nAfter erasing element '2':\n3 4 5\nNumber of elements after erasing range:\
  \ 0\n\n### 分析\n\n`main()` 函数中的第 20–25 行使用了各种方法将整数插入 `list` 中。当使用 `insert()` 插入一个值时，它返回一个指向新插入元素的迭代器。这个指向值为\
  \ 2 的元素的迭代器存储在第 25 行的变量 `iValue2` 中，稍后在第 35 行用于 `erase()` 以从列表中删除该元素。第 30 行和第 38\
  \ 行演示了如何使用 `erase()` 删除一个范围的元素。在前者，你删除了从 `begin()` 到包含 2 的元素的范围（但不包括该元素）。而在后者，你清空了从\
  \ `begin()` 到 `end()` 的范围，即删除了整个列表。\n\n#### 备注\n\n列表 18.4 在第 40 行演示了可以使用 `size()`\
  \ 确定 `std::list` 中的元素数量，这与 `vector` 的用法非常相似。这种模式适用于所有 STL 类。\n\n### 反转和排序列表中的元素\n\
  \n`list` 有一个特殊属性：指向 `list` 中元素的迭代器在元素发生重排或插入新元素的情况下保持有效。为了保持这一特性的完整，`list` 函数提供了\
  \ `sort` 和 `reverse` 作为成员函数，尽管 STL 也提供了这些算法。这些成员函数版本作用于 `list` 类，确保了当元素位置发生变化时，程序员保留的迭代器有效。\n\
  \n#### 使用 reverse() 反转元素\n\n`list` 有一个不接受参数的成员函数 `reverse()`，它可以反转 `list` 中的内容。`reverse()`\
  \ 的用法参见 列表 18.5。\n\n列表 18.5. 反转列表中的元素\n\n点击此处查看代码图像\n```\n0: #include <list>\n1:\
  \ #include <iostream>\n2: using namespace std;\n3:\n4: template <typename T>\n5:\
  \ void DisplayContents(const T& Input)\n6: {\n7:     for(auto iElement = Input.cbegin()\
  \ // auto and cbegin: C++11\n8:         ; iElement != Input.cend()\n9:         ;\
  \ ++ iElement )\n10:      cout << *iElement << ' ';\n11:\n12:     cout << endl;\n\
  13: }\n14:\n15: int main()\n16: {\n17:     std::list <int> listIntegers;\n18:\n\
  19:     // 在开头和末尾插入元素...\n20:     listIntegers.push_back(4);\n21:     listIntegers.push_front(3);\n\
  22:     listIntegers.push_back(5);\n23:\n24:     // 存储使用 'insert' 函数获取的迭代器\n25:\
  \     auto iValue2 = listIntegers.insert(listIntegers.begin(), 2);\n26:\n27:   \
  \  cout << \"Initial contents of the list:\" << endl;\n28:     DisplayContents(listIntegers);\n\
  29:\n30:     listIntegers.erase(listIntegers.begin(), iValue2);\n31:     cout <<\
  \ \"Contents after erasing a range of elements:\" << endl;\n32:     DisplayContents(listIntegers);\n\
  33:\n34:     cout << \"After erasing element '\" << *iValue2 << \"':\" << endl;\n\
  35:     listIntegers.erase(iValue2);\n36:     DisplayContents(listIntegers);\n37:\n\
  38:     listIntegers.erase(listIntegers.begin(), listIntegers.end());\n39:     cout\
  \ << \"Number of elements after erasing range: \";\n40:     cout << listIntegers.size()\
  \ << endl;\n41:\n42:     return 0;\n43: }\n```\n\n### 输出\n\n点击此处查看代码图像\nInitial\
  \ contents of the list:\n0 1 2 4 5\nContents of the list using reverse():\n5 4 2\
  \ 1 0\n\n### 分析\n\n如第 30 行所示，`reverse()` 仅反转 `list` 中元素的顺序。这是一个不接受参数的简单调用，确保程序员保留的迭代器在反转后仍然有效。\n\
  \n#### 排序元素\n\n`list` 成员函数 `sort()` 有一个不接受参数的版本：\n\n点击此处查看代码图像\n```\nlistIntegers.sort();\
  \ // 升序排序\n```\n另一个版本允许通过二谓词函数定义自定义排序优先级：\n\n点击此处查看代码图像\n```\nbool SortPredicate_Descending\
  \ (const int& lsh, const int& rsh)\n{\n    // 为 list::sort 定义标准：需要排序时返回 true\n \
  \   return (lsh > rsh);\n}\n\n// 使用谓词排序列表：\nlistIntegers.sort (SortPredicate_Descending);\n\
  ```\n这两个变体在 列表 18.6 中演示。\n\n列表 18.6. 使用 list::sort() 升序和降序排序整数列表\n\n点击此处查看代码图像\n\
  \n```\n0: #include <list>\n1: #include <iostream>\n2: using namespace std;\n3:\n\
  4: bool SortPredicate_Descending (const int& lsh, const int& rsh)\n5: {\n6:    //\
  \ 为 list::sort 定义标准：需要排序时返回 true\n7:    return (lsh > rsh);\n8: }\n9:\n10: template\
  \ <typename T>\n11: void DisplayContents (const T& Input)\n12: {\n13:    for (auto\
  \ iElement = Input.cbegin() // auto and cbegin: C++11\n```\n\n\n\n\n\n此示例展示了整数 `list`\
  \ 的排序功能。前几行代码创建了 `list` 对象并向其中插入了示例值。第 35 行显示了不带参数的 `sort()` 函数用法，该函数默认按升序对元素进行排序，并使用\
  \ `operator <` 比较整数（对于整数来说，这由编译器实现）。然而，如果程序员想要覆盖此默认行为，则必须为排序函数提供一个二元谓词。在第 4–8 行中定义的函数\
  \ `SortPredicate_Descending()` 是二元谓词，它帮助 `list` 的 `sort` 函数判断一个元素是否小于另一个元素。如果不是，则交换它们的位置。换句话说，你告诉列表什么应该被解释为“小于（`less`）”（在这种情况下，即第一个参数大于第二个参数）。这个“谓词”作为参数传递给\
  \ `sort()` 函数的变体，如第 40 行所示。只有当第一个值大于第二个值时，该谓词才返回 `true`。也就是说，使用该谓词的 `sort` 只有在前者的数值（`lsh`）大于后者（`rsh`）时，才会将第一个值（`lsh`）逻辑上解释小于第二个值（`rsh`）。基于这种解释，它会交换位置以满足谓词指定的标准。\n\
  \n* * *\n\n#### 从包含类对象的列表中排序和删除元素\n\n如果你有一个类类型的 `list`，而不是像 `int` 这样的简单内置类型怎么办？假设有一个地址簿条目的列表，其中每个条目都是包含名称、地址等信息的类。你将如何确保此列表按名称排序？\n\
  \n答案是以下之一：\n\n-   在 `list` 包含的类类型内部实现 `operator <`。\n-   提供一个排序二元谓词——一个接受两个值作为输入并返回布尔值的函数，指示第一个值是否小于第二个值。\n\
  \n涉及 STL 容器的大实际应用很少收集整数；相反，它们收集用户定义的类型，如 `classes` 或 `structs`。列表 18.7 使用联系人 `list`\
