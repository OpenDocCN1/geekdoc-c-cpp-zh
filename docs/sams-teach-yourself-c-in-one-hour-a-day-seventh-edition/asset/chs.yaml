  \ C++ 流操作\n\n### 流的概念\n\n你正在开发一个程序，该程序从磁盘读取数据、将数据写入显示器、从键盘读取用户输入并将数据保存到磁盘。如果无论数据来自或去往哪个设备或位置，都可以类似的模式来处理所有的读取和写入活动，难道不是很有用吗？这正是\
  \ C++ 流为你提供的！\n\nC++ 流是读写（换句话说，输入和输出）逻辑的通用实现，它允许你使用某些一致的模式来读取或写入数据。无论你是从磁盘还是键盘读取数据，无论是写入显示器还是写回磁盘，这些模式都是的。你只需要使用正确的流类，类内部的实现会处理特定于设备和操作系统的细节。\n\
  \n让我们再次参考你第一个 C++ 程序中的一行相关代码，即第 1 节中的列表 1.1：\n\n点击此处查看代码图片\n\n```cpp\nstd::cout\
  \ << \"Hello World!\" << std::endl;\n```\n\n没错：`std::cout` 是 `class ostream` 类型中的一个流对象，用于控制台输出。为了使用\
  \ `std::cout`，你包含了头文件 `<iostream>`，它提供了该功能以及其他功能，如 `std::cin`（它允许你从流中读取数据）。\n\n\
  那么，当我说流允许一致且特定于设备的访问时，什么意思？如果你向一个文本文件写入“Hello World”，你会在文件流对象 `fsHW` 上使用这种语法：\n\n\
  点击此处查看代码图片\n\n```cpp\nfsHW << \"Hello World!\" << endl;  // 将 \"Hello World!\" 写入文件流\n\
  ```\n\n如你所见，在选择了正确的流类后，在 C++ 中向文件写入“Hello World”与将其写入显示器并没有太大区别。\n\n> **提示**\n>\
  \ 在写入流时使用的 `operator<<` 被称为流插入运算符。当你向显示器、文件等写入时使用它。\n> 在将流写入变量时使用的 `operator>>`\
  \ 被称为流提取运算符。当你从键盘、文件等读取输入时使用它。\n\n在接下来的内容，本节将从实用的角度研究流。\n\n### 重要的 C++ 流类和对象\n\n\
  C++ 为你提供了一系列标准类和头文件，帮助你执行一些重要且频繁的 I/O 操作。表 27.1 是你经常使用的类列表。\n\n表 27.1 `std` 命名空间中常用的\
  \ C++ 流类\n![Image](img/27tab01.jpg)\n\n> **注意**\n> `cout`、`cin` 和 `cerr` 分别是流类 `ostream`、`istream`\
  \ 和 `ostream` 的全局对象。作为全局对象，它们在 `main()` 启动之前就已经初始化了。\n\n使用流类时，你有权指定操纵符（manipulators）来为你执行特定的特定操作。`std::endl`\
  \ 就是你到目前为止用于插入换行符的操纵符之一：\n\n点击此处查看代码图片\n\n```cpp\nstd::cout << \"This lines ends\
