  \n### 使用 std::cout 对齐文本并设置字段宽度\n可以使用 `setw()` 等操纵符设置字符字段的宽度。插入到流中的任何内容都会在该指定的宽度内右对齐。同样，`setfill()`\
  \ 可用于确定在一种情况下填充空白区域的字符，如列表 27.3 所示。\n\n**列表 27.3. 通过 setw() 设置字段宽度并使用 setfill()\
