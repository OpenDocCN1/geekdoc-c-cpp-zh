  \n本节涵盖：\n\n- 如何 STL `map` 和 `multimap`、`unordered_map` 和 `unordered_multimap` 容器对你的帮助\n\
  - 元素的插入、删除和查找\n- 提供自定义的排序谓词\n- 哈希表的工作原理基础\n\n### STL Map 类简介\n\n`map` 和 `multimap`\
  \ 是键值对容器，允许基于键进行查找，如图图 20.1 所示。\n\n![Image](img/20fig01.jpg)\n\n图 20.1 键对容器的可视化说明，每个对包含一个键和一个值。\n\
  \n`map` 和 `multimap` 之间的区别在于，后者允许重复键，而前者只能存储唯一键。\n\n为了方便快速搜索，STL 中 `map` 和 `multimap`\
  \ 的实现在内部类似于二叉树。这意味着，插入到 `map` 或 `multimap` 中的元素在插入时就是排序的。这意味着，与 `vector`（其中位置上的元素可以被另一个元素替换）不同，`map`\
  \ 在给定位置上的元素不能被不同值的新元素替换。这是因为 `map` 理想情况下会根据其相对于内部树中其他元素的值，将其放置在可能不同的位置。\n\n> 提示：要使用类\
