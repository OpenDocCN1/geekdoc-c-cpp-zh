  \n### 注意事项：运算符的常量正确性（Const-Correctness）\n即使在编写运算符时，使用 `const` 关键字也是重要的。请注意 Listing\
  \ 12.10 如何将下标运算符 `[]` 的返回值限制为 `const char&`。即使没有 `const` 关键字，程序也可以运行和编译，但你之所以在那里放置它是为了避免以下代码：\n\
  \n```cpp\nMyString sayHello(\"Hello World\");\nsayHello[2] = 'k'; // 错误：operator[]\
  \ 是 const\n```\n\n通过使用 `const`，你保护了内部成员 `MyString::Buffer` 不受通过 `[]` 运算符的外部修改。在实现下标运算符时，你可以对\
  \ Listing 12.10 显示的版本进行改进。该版本适用于读取和写入数组中的槽位。然而，你也可以实现两个下标运算符——一个 `const` 函数，另一个是非\
  \ `const` 函数：\n\n点击此处查看代码\n\n```cpp\nchar& operator [] (int nIndex); // 用于写入/修改\
  \ Index 字符\nchar& operator [] (int nIndex) const; // 仅用于访问 Index 字符\n```\n\n编译器足够智能，读取操作调用\
  \ `const` 函数，写入 `MyString` 操作的操作非 `const` 版本。因此，你可以（如果你愿意）让两个下标函数具有不同的功能。例如，一个函数可以向容器写入，而另一个可以从中读取。\n\
  \n其他运算符（列在 Table 12.2 中）也可以重定义或重载，但在本节中不再进一步讨论。然而，它们的实现方式与已讨论的相似。\n\n### 函数运算符 ()\n\
  使对象像函数一样行为的 `()` 运算符被称为函数运算符。它们在标准模板库（STL）中被应用，并通常用于 STL 算法。它们的用法包括做出决策；此类函数对象根据它们操作的操作数，通常称为*一元谓词*（unary\
  \ predicate）或*二元谓词*（binary predicate）。Listing 12.11 分析了一个非常简单的函数对象，以便你首先理解为什么会有如此引人入目的名称。\n\
  \n\n\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n#include <string>\nusing namespace\
  \ std;\n\nclass CDisplay\n{\npublic:\n    void operator () (string Input) const\n\
  \    {\n        cout << Input << endl;\n    }\n};\n\nint main ()\n{\n    CDisplay\
  \ mDisplayFuncObject;\n\n    // equivalent to mDisplayFuncObject.operator () (\"\
  Display this string!\");\n    mDisplayFuncObject (\"Display this string!\");\n\n\
  \    return 0;\n}\n```\n\n### 输出\n点击此处查看代码图像\nDisplay this string!\n\n### 分析\n第\
  \ 8 到第 11 行实现了 `operator ()`，它在第 18 行的 `main()` 函数中被使用。注意编译器如何允许在第 18 行将 `object\
  \ mDisplayFuncObject` 作为 `function` 使用，这是通过隐式将看起来像函数调用的内容转换为对 `operator ()` 的调用。\n\
  \n因此，此运算符称为函数 `operator ()`，而 `CDisplay` 的对象也称为函数对象或*functor*。该主题在第 21  中的“理解函数对象”中有详细讨论。\n\
  \n### C++11：用于高性能编程的移动构造函数和移动赋值运算符\n\n移动构造函数和移动赋值运算符是 C++11 标准中的性能优化特性，确保临时值（语句之外不存在的右值）不一定被拷贝。这在处理管理动态分配资源的类（例如动态数组类或字符串类）时特别有用。\n\
  \n#### 无意义的拷贝步骤问题\n请看列表 12.5 中实现的加法运算符。注意它实际上创建了一个副本并返回了该副本。减法运算符也是如此。现在，当你使用以下语法创建\
  \ `MyString` 的新实例时，会发生什么：\n\n点击此处查看代码图像\n\n```cpp\nMyString Hello(\"Hello \");\n\
  MyString World(\"World\");\nMyString CPP(\" of C++\");\nMyString sayHello(Hello\
  \ + World + CPP);  // operator+,拷贝构造函数\nMyString sayHelloAgain (\"overwrite this\"\
  );\nsayHelloAgain = Hello + World + CPP;  // operator+,拷贝构造函数,拷贝赋值运算符=\n```\n\n\
  这种简单的结构是连接三个字符串的一种直观方法，并使用了二进制加法运算符（`+`），其程序实现如下：\n\n点击此处查看代码图像\n\n```cpp\nMyString\
  \ operator+ (const MyString& AddThis)\n{\n    MyString NewString;\n    if (AddThis.Buffer\
  \ != NULL)\n    {\n        // copy into NewString\n    }\n    return NewString;\
  \  // 按值返回副本，调用拷贝构造函数\n}\n```\n\n这种可以通过直观表达式方便拼接的加法运算符（`+`）也具有导致性能问题的可能性。`sayHello`\
  \ 的创建需要执行两次加法运算符，每次执行运算符（`+`）都会产生临时副本，因为 `MyString` 是按值返回的，从而导致了拷贝构造函数的执行。拷贝构造函数执行深拷贝——拷贝到一个在表达式后不存在的临时值。因此，该表达式产生了临时副本（对于纯主义者来说是右值），这些副本在语句后永远不需要，因此是\
  \ C++ 强制导致的性能瓶颈。好吧，至少最近以前是这样。\n\n这个问题在 C++11 中终于解决了，编译器现在专门识别临时变量并在如果你提供了它们的情况下使用移动构造函数和移动赋值运算符。\n\
  \n#### 声明移动构造函数和移动赋值运算符\n移动构造函数的语法如下：\n\n点击此处查看代码图像\n\n```cpp\nclass MyClass\n{\n\
  private:\n    Type* PtrResource;\npublic:\n    MyClass(); // 默认构造函数\n    MyClass(const\
  \ MyClass& CopySource); // 拷贝构造函数\n    MyClass& operator= (const MyClass& CopySource);\
  \ // 拷贝赋值运算符\n    MyClass(MyClass&& MoveSource) // 移动构造函数，注意 &&\n    {\n       \
  \ PtrResource = MoveSource.PtrResource; // 获取所有权，开始移动\n        MoveSource.PtrResource\
  \ = NULL;\n    }\n    MyClass& operator= (MyClass&& MoveSource)//移动赋值运算符，注意 &&\n\
  \    {\n        if(this != &MoveSource)\n        {\n            delete [] PtrResource;\
  \ // 释放资源\n            PtrResource = MoveSource.PtrResource; // 获取所有权，开始移动\n   \
  \         MoveSource.PtrResource = NULL; // 释放所有权\n        }\n    }\n};\n```\n\n\
  因此，移动构造函数和赋值运算符的声明与普通的拷贝构造函数和拷贝赋值运算符不同，其输入参数类型为 `MyClass&&`。由于输入参数是移动源，它不能是 `const`\
  \ 参数，因为它会被修改。返回值保持不变，因为这些是构造函数和赋值运算符的重载版本。符合 C++11 的编译器确保对于右值临时变量使用移动构造函数而非拷贝构造函数，并调用移动赋值运算符而非拷贝赋值运算符。在你对这两者的实现中，你确保了不是拷贝，而是简单地将资源从源移动到目标，列表\
  \ 12.12 展示了这两种在 `MyString` 中的有效性。\n\n##### 列表 12.12 带有移动构造函数和移动赋值运算符的 MyString 拷贝构造函数和赋值运算符\n\
  点击此处查看代码图像\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nclass MyString\
  \ {\nprivate:\n    char* Buffer;\n\n    // 私有默认构造函数\n    MyString(): Buffer(NULL)\n\
  \    {\n        cout << \"Default constructor called\" << endl;\n    }\n\npublic:\n\
  \    // 析构函数\n    ~MyString()\n    {\n        if (Buffer != NULL)\n            delete\
  \ [] Buffer;\n    }\n\n    int GetLength()\n    {\n        return strlen(Buffer);\n\
  \    }\n\n    operator const char*()\n    {\n        return Buffer;\n    }\n\n \
  \   MyString operator+ (const MyString& AddThis)\n    {\n        cout << \"operator+\
  \ called: \" << endl;\n        MyString NewString;\n\n        if (AddThis.Buffer\
  \ != NULL)\n        {\n            NewString.Buffer = new char[GetLength() + strlen(AddThis.Buffer)\
  \ + 1];\n            strcpy(NewString.Buffer, Buffer);\n            strcat(NewString.Buffer,\
  \ AddThis.Buffer);\n        }\n\n        return NewString;\n    }\n\n    // 构造函数\n\
  \    MyString(const char* InitialInput)\n    {\n        cout << \"Constructor called\
  \ for: \" << InitialInput << endl;\n        if(InitialInput != NULL)\n        {\n\
  \            Buffer = new char [strlen(InitialInput) + 1];\n            strcpy(Buffer,\
  \ InitialInput);\n        }\n        else\n            Buffer = NULL;\n    }\n\n\
  \    // 拷贝构造函数\n    MyString(const MyString& CopySource)\n    {\n        cout<<\"\
  Copy constructor to copy from: \"<<CopySource.Buffer<<endl;\n        if(CopySource.Buffer\
  \ != NULL)\n        {\n            // 通过先分配自己的缓冲区来确保深拷贝\n            Buffer = new\
  \ char [strlen(CopySource.Buffer) + 1];\n            // 从源拷贝到本地缓冲区\n           \
  \ strcpy(Buffer, CopySource.Buffer);\n        }\n        else\n            Buffer\
  \ = NULL;\n    }\n\n    // 拷贝赋值运算符\n    MyString& operator= (const MyString& CopySource)\n\
  \    {\n        cout<<\"Copy assignment operator to copy from: \"<<CopySource.Buffer<<\
  \ endl;\n        if ((this != &CopySource) && (CopySource.Buffer != NULL))\n   \
  \     {\n            if (Buffer != NULL)\n```\n\n\n\n\n```cpp\n83:            delete[]\
  \ Buffer;\n84:\n85:            // ensure deep copy by first allocating own buffer\n\
  86:            Buffer = new char [strlen(CopySource.Buffer) + 1];\n87:\n88:    \
  \        // copy from the source into local buffer\n89:            strcpy(Buffer,\
  \ CopySource.Buffer);\n90:         }\n91:\n92:     return *this;\n93:     }\n94:\n\
  95:     // move constructor\n96:     MyString(MyString&& MoveSource)\n97:     {\n\
  98:         cout << \"Move constructor to move from: \" << MoveSource.Buffer <<\
  \ endl;\n99:         if(MoveSource.Buffer != NULL)\n100:         {\n101:       \
  \      Buffer = MoveSource.Buffer; // take ownership i.e.  'move'\n102:        \
  \     MoveSource.Buffer = NULL;   // free move source\n103:         }\n104:    \
  \ }\n105:\n106:     // move assignment operator\n107:     MyString& operator= (MyString&&\
  \ MoveSource)\n108:     {\n109:         cout<<\"Move assignment operator to move\
  \ from: \"<<MoveSource.Buffer<<endl;\n110:         if((MoveSource.Buffer != NULL)\
  \ && (this != &MoveSource))\n111:         {\n112:             delete Buffer; //\
  \ release own buffer\n113:\n114:             Buffer = MoveSource.Buffer; // take\
  \ ownership i.e.  'move'\n115:             MoveSource.Buffer = NULL;   // free move\
  \ source\n116:         }\n117:\n118:         return *this;\n119:     }\n120: };\n\
  121:\n122: int main()\n123: {\n124:     MyString Hello(\"Hello \");\n125:     MyString\
  \ World(\"World\");\n126:     MyString CPP(\" of C++\");\n128:\n128:     MyString\
  \ sayHelloAgain (\"overwrite this\");\n129:     sayHelloAgain = Hello + World +\
  \ CPP;\n130:\n131:     return 0;\n132: }\n```\n\n***\n\n### 输出\n\n点击此处查看代码图片\n\n\
  未启用移动构造函数和移动赋值运算符的输出（通过注释掉第 95 至 119 行）：\n\n调用构造函数：Hello\n调用构造函数：World\n调用构造函数：\
  \  of C++\n调用构造函数：overwrite this\n`operator+` 被调用：\n调用默认构造函数\n**从 Hello World 拷贝的构造函数**\n\
  `operator+` 被调用：\n调用默认构造函数\n**从 Hello World of C++ 拷贝的构造函数**\n**从 Hello World of\
  \ C++ 拷贝的赋值运算符**\n\n启用移动构造函数和移动赋值运算符的输出：\n\n点击此处查看代码图片\n\n调用构造函数：Hello\n调用构造函数：World\n\
  调用构造函数：  of C++\n调用构造函数：overwrite this\n`operator+` 被调用：\n调用默认构造函数\n从 Hello World\
  \ 移动的构造函数\n`operator+` 被调用：\n调用默认构造函数\n从 Hello World of C++ 移动的构造函数\n从 Hello World\
  \ of C++ 移动的赋值运算符\n\n***\n\n### 分析\n\n这可能是一个很长的分析，但最重要的部分是第 95 至 119 行所示的移动构造函数和移动赋值运算符。注意移动语义如何从\
  \ `MoveSource` 接管 `Buffer` 的所有权，然后将 `MoveSource.Buffer` 设置为 `NULL` 以避免双释放内存。\n\n\
  在移动构造函数中，我们检查 `MoveSource.Buffer` 是否为 `NULL`。在移动赋值运算符中，我们还检查当前对象是否与 `MoveSource`\
  \ 不同（`this != &MoveSource`）以避免自赋值。在接管新内存的所有权之前，我们会删除当前的 `Buffer`。\n\n你学习了编程运算符如何对类被使用方式产生重大影响。例如，`.`、`.*`、`::`、`sizeof`\
  \ 等运算符是无法重定义的。\n\n### 不能重载的运算符\n\n点击此处查看代码图片\n\n未启用移动构造函数和移动赋值运算符的输出（通过注释掉第 95 至\
  \ 119 行）：\n（见上方输出）\n\n### 总结\n\n你学习了编程运算符如何对类被使用方式产生重大影响。例如，`.`、`.*`、`::`、`sizeof`\
  \ 等运算符是无法重定义的。\n\n### 问答\n\n**问：** 我的类封装了一个整数动态数组。最少需要实现哪些函数和运算符？\n\n**答：** 你通常需要实现拷贝构造函数、拷贝赋值运算符和析构函数。如果你想在某些情况下优化该类的性能，还需要实现移动构造函数和移动赋值运算符。\n\
  \n**问：** 我有一个类的类的实例对象。我想支持这种语法：`cout << object;`。我需要实现什么运算符？\n\n**答：** 你需要实现一个转换运算符，允许你的类被解释为\
  \ `std::cout` 可以处理的类型。一种方法是像你在列表 12.2 中那样定义 `operator char()`。\n\n**问：** 我想创建一个自己的智能指针类。最少需要实现哪些函数和运算符？\n\
  \n**答：** 智能指针需要提供像普通指针那样的用法，例如 `*pSmartPtr` 或 `pSmartPtr->Func()`。实现这一点需要 `operator\
  \ *` 和 `operator ->`。此外，为了它是智能的，你还需要通过相应编写析构函数来处理自动资源释放/返回，并通过实现拷贝构造函数和拷贝赋值运算符来明确定义拷贝或赋值，或者通过将这两个声明为\
  \ `private` 来禁止它们。\n\n### 工作坊\n\n工作坊包含问答，有助于巩固你对涵盖内容的理解，练习题提供了使用所学知识的机会。在查看附录 D\
