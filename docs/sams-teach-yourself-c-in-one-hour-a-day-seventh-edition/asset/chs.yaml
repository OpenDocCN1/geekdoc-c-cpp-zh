  \ n d   s t r i n g s !\n‘21’ characters were displayed\n\n### 分析\n该代码示例演示了 `for_each()`\
  \ 的用处，以及它的一个特性：返回一个函数对象 `Result`，该对象被用于存储诸如调用次数等信息。代码包含两个示例范围，一个包含在整数向量 `vecIntegers`\
  \ 中，另一个是一个 `std::string` 对象 `Sample`。示例分别在第 32 行和第 45 行对这些范围上调用了 `for_each()`。第一次使用\
  \ `DisplayElementKeepCount` 作为一元谓词，第二次使用 lambda 表达式。`for_each()` 会为提供范围内的每个元素调用\
  \ `operator()`，这反过来会将元素打印到屏幕上并增加内部计数器。当 `for_each()` 完成时会返回该函数对象，成员 `Count` 告诉我们对象被使用的次数。这种在算法返回的对象中存储信息（或状态）的功能在实际编程中非常有用。第\
  \ 45 行的 `for_each()` 与第 32 行针对 `std::string` 的操作完全相同，只是使用了 lambda 表达式而不是对象。\n\n\
  #### 使用 std::transform 对范围进行元素转换\n`std::for_each()` 和 `std::transform()` 在相似之处非常相似，它们都会为源范围内的每个元素调用函数对象。然而，`std::transform()`\
  \ 有两个版本。第一个版本接受一个一元函数，并常用于使用 `toupper()` 或 `tolower()` 将字符串转换为大写或小写：\n点击此处查看代码图像\n\
  ```cpp\nstring Sample (\"THIS is a TEst string!\");\ntransform ( Sample.begin ()\
  \   // 源范围开始\n          , Sample.end ()      // 源范围结束\n          , strLowerCaseCopy.begin\
  \ ()// 目标范围开始\n          , tolower ); // 一元函数\n```\n第二个版本接受一个二元函数，允许 `transform()`\
  \ 处理来自两个范围的元素对：\n点击此处查看代码图像\n```cpp\n// 将两个范围中的元素相加并存储在第三个范围内\ntransform ( vecIntegers.begin\
  \ () // 源范围 1 开始\n          , vecIntegers.end () // 源范围 1 结束\n          , vecIntegers.begin\
  \ () // 源范围 2 开始\n          , dqResult.begin () // 存储在 deque 中\n          , plus\
  \ <int> ); // 二元函数\n```\n`transform()` 的两个版本总是指定转换函数的结果赋值给提供的范围，这与 `for_each()`\
  \ 不同，后者作用于单一范围。`std::transform()` 的用法在列表 23.7 中所示。\n\n### 列表 23.7 使用一元和二元函数使用 std::transform()\n\
  点击此处查看代码图像\n```cpp\n#include <algorithm>\n#include <string>\n#include <vector>\n\
  #include <iostream>\n#include <functional>\n\nint main ()\n{\n    using namespace\
  \ std;\n\n    string Sample (\"THIS is a TEst string!\");\n    cout << \"The sample\
  \ string is: \" << Sample << endl;\n\n    string strLowerCaseCopy;\n    strLowerCaseCopy.resize\
  \ (Sample.size ());\n\n    transform ( Sample.begin ()   // 源范围开始\n            \
  \  , Sample.end ()      // 源范围结束\n              , strLowerCaseCopy.begin ()// 目标范围开始\n\
  \              , tolower ); // 一元函数\n\n    cout << \"Result of 'transform' on the\
  \ string with 'tolower':\" << endl;\n    cout << \"\\\"\" << strLowerCaseCopy <<\
  \ \"\\\"\" << endl << endl;\n\n    // 两个示例整数向量...\n    vector <int> vecIntegers1,\
  \ vecIntegers2;\n    for (int nNum = 0; nNum < 10; ++ nNum)\n    {\n        vecIntegers1.push_back\
  \ (nNum);\n        vecIntegers2.push_back (10 - nNum);\n    }\n    // 存储加法结果的目标范围\n\
  \    deque <int> dqAddition (vecIntegers1.size ());\n    transform ( vecIntegers1.begin\
  \ () // 源范围 1 开始\n              , vecIntegers1.end () // 源范围 1 结束\n            \
  \  , vecIntegers2.begin () // 源范围 2 开始\n              , dqAddition.begin () // 目标范围开始\n\
  \              , plus <int> ); // 二元函数\n\n    cout << \"Result of 'transform' using\
  \ binary 'plus':\" << endl;\n    cout << \"Index Vector1 + Vector2 (in Deque)\"\
  \ << endl;\n    for (size_t nIndex = 0; nIndex < vecIntegers1.size (); ++ nIndex)\n\
  \    {\n        cout << nIndex << \"\\t \" << vecIntegers1 [nIndex] << \"\\t+ \"\
  ;\n        cout << vecIntegers2 [nIndex] << \" \\t= \";\n        cout << dqAddition\
  \ [nIndex] << endl;\n    }\n\n    return 0;\n}\n```\n\n\n\n\n\n该示例演示了 `std::transform()`\
  \ 的两个版本：一种是使用一元函数 `tolower()` 作用于单个范围（如第 20 行所示），另一种是作用于两个范围并使用二元函数 `plus()`（如第\
  \ 40 行所示）。第一个版本逐个字符地将字符串的大小写更改为小写。如果你使用 `toupper()` 代替 `tolower()`，则执行向大写的大小写转换。`std::transform()`\
  \ 的另一个版本（如第 36–40 行所示）作用于从两个输入范围（在本例中为两个 `vector`）中取的元素，并使用以 STL 函数 `plus()` 形式存在的二元谓词（或二元函数，由\
  \ `<functional>` 头文件提供）将它们相加。`std::transform()` 一处理一对元素，将其提供给二元函数 `plus`，并将结果赋值目标范围中的一个元素——该元素恰好属于一个\
  \ `std::deque`。注意，用于存储结果的容器更改纯粹是为了演示目的。它仅展示了迭代器如何很好地抽象容器及其实现，相对于 STL 算法；`transform()`\
  \ 作为一种算法，处理的是范围，并且并不需要知道实现这些范围的容器细节。因此，输入范围恰好在 `vector` 中，输出范围恰好是 `deque`，只要定义范围的边界（作为输入参数提供给\
  \ `transform`）是有效的，一切就能正常运行。\n\n## 复制与删除操作\n\nSTL 提供了三个主要的复制函数：`copy()`、`copy_if()`\
  \ 和 `copy_backward()`。`copy()` 可以在正向方向将源范围的内容赋值到目标范围：\n\n```cpp\nauto iLastPos =\
  \ copy ( listIntegers.begin ()  // 源范围开始\n                      , listIntegers.end\
  \ ()   // 源范围结束\n                      , vecIntegers.begin () // 目标范围开始\n```\n\n\
  `copy_if()` 仅在由你提供的一元谓词返回 `true` 时才复制元素：\n\n点击此处查看代码图像\n\n```cpp\n// 将 list 中的奇数复制到\
  \ vector\ncopy_if ( listIntegers.begin(), listIntegers.end()\n      , iLastPos\n\
  \      , [](int element){return ((element % 2) == 1);});\n```\n\n### 注意\n\n从 C++11\
  \ 开始，`copy_if()` 是 `std` 命名空间中的一个算法。如果你使用的是旧的或不符合 C++11 标准的编译器，使用它可能会遇到问题。\n\n`copy_backward()`\
  \ 在反向方向将内容赋值到目标范围：\n\n点击此处查看代码图像\n\n```cpp\ncopy_backward ( listIntegers.begin ()\n\
  \              , listIntegers.end ()\n              , vecIntegers.end () );\n```\n\
  \n另一方面，`remove()` 会删除容器中匹配指定值的元素：\n\n点击此处查看代码图像\n\n```cpp\n// 使用 erase() 删除所有 '0'\
  \ 实例并调整 vector 大小\nauto iNewEnd = remove (vecIntegers.begin (), vecIntegers.end\
  \ (), 0);\nvecIntegers.erase (iNewEnd, vecIntegers.end ());\n```\n\n`remove_if()`\
  \ 使用一元谓词从容器中删除那些谓词求值为 `true` 的元素：\n\n点击此处查看代码图像\n\n```cpp\n// 使用 remove_if 从 vector\
  \ 中删除所有奇数\niNewEnd = remove_if (vecIntegers.begin (), vecIntegers.end (),\n    \
  \     [](int element) {return ((element % 2) == 1);} ); // 谓词\nvecIntegers.erase\
  \ (iNewEnd , vecIntegers.end ());  // 调整大小\n```\n\n列表 23.8 演示了复制和删除函数的用法。\n\n列表\
  \ 23.8. 一个演示如何使用 `copy()`、`copy_if()`、`remove()` 和 `remove_if()` 将 list 复制到 vector\
  \ 并删除 0 和偶数的示例。\n\n点击此处查看代码图像\n\n```cpp\n0: #include <algorithm>\n1: #include <vector>\n\
  2: #include <list>\n3: #include <iostream>\n4: using namespace std;\n5:\n6: template\
