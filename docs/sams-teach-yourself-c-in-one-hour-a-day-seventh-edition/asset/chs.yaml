  \ 访问，而 GCC 在 [`gcc.gnu.org/projects/cxx0x.html`](http://gcc.gnu.org/projects/cxx0x.html)\
  \ 有一个支持页面。\n\n\n\n\n\n## 获取指导与帮助的社区\n\nC++ 拥有丰富且活跃的在线社区。你可以加入 CodeGuru ([www.CodeGuru.com](http://www.CodeGuru.com))\
  \ 或 CodeProject ([www.CodeProject.com](http://www.CodeProject.com)) 等网站，让社区来检查并解答你的技术疑问。\n\
  \n当你感到有信心时，可以随时为这些社区做出贡献。你会发现自己在回答挑战性问题的过程中，也学到了很多东西。\n\n### 总结\n\n这节总结性课程实际上是你学习\
  \ C++ 之旅的开启之页！走到这里，你已经学习了该语言的基础知识和高级概念。在本节中，你学习了多线程编程的理论基础。你了解到充分发挥多核处理器性能的唯一方法是将是将逻辑组织在线程中并允许并行处理。你知道多线程应用中存在陷阱，以及规避它们的方法。最后，你还学习了一些基本的\
  \ C++ 编程最佳实践。你知道编写良好的 C++ 代码不仅关乎使用高级概念，还关乎提供他人理解的变量名、处理异常以应对意外情况，以及使用 `smart pointers`\
  \ 等工具类而不是原始指针。你现在准备好跃入专业 C++ 编程的世界了。\n\n### 问答\n\nQ. 我对程序的性能非常满意。我还需要实现多线程功能吗？\n\
  \nA. 完全不需要。并不是所有应用都需要多线程。只有那些需要并发执行任务或并行服务许多用户的应用才需要。\n\nQ. 主要编译器仍然完全支持 C++11。为什么不使用旧的编程风格呢？\n\
  \nA. 首先，两个主要的编译器（Microsoft Visual C++ 和 GNU 的 GCC）已经支持大多数主要的 C++11 特性，少数除外。此外，C++11\
  \ 让编程变得简单。`auto` 等关键字可以省去冗长且繁琐的迭代器声明，而 lambda 函数让你的 `for_each()` 构造变得紧凑，无需函数对象。因此，使用\
  \ C++11 带来的收益已经非常显著了。\n\n### 工作坊\n\n工作坊包含测验题，帮助巩固你对涵盖内容的理解。在查看 附录 D 中的答案之前，尝试回答这些问题。\n\
  \n### Quiz\n\n1. 我的图像处理应用在调整对比时不没有响应。我该怎么办？\n\n2. 我的多线程应用允许极速访问数据库。然而，有时我发现获取的数据是乱码。我哪里做错了？\n\
  \n# 附录\n\n## 附录 A. 数字处理：二进制与十六进制\n\n理解二进制和十六进制系统的原理对于编写更好的 C++ 程序并非关键，但它可以帮助你更好地理解底层发生了什么。\n\
  \n### 十进制\n\n我们每天使用的数字范围在 0–9 之间。这组数字被称为十进制。由于该系统由 10 个独特的数字组成，因此它是基数为 10 的系统。\n\
  \n因此，由于基数为 10，每个数字从 0 开始计数的位置表示该数字所乘以 10 的幂次。例如：\n\n957 = 9 x 10² + 5 x 10¹ + 7\
  \ x 10⁰ = 9 x 100 + 5 x 10 + 7\n\n在数字 957 中，7 的从 0 开始计数的位置是 0，5 是 1，9 是 2。这些位置索引变成了基数\
  \ 10 的幂，如示例所示。记住，任何数的 0 次幂都等于 1（所以，10⁰ 等于 1000⁰，因为它们的求值均为 1）。\n\n***\n\n注意\n\n十进制系统是一个\
  \ 10 的幂次最重要的系统。数字中的数通过乘以 10、100、1000 等来确定数字的大小。\n\n***\n\n### 二进制\n\n基数为 2 的系统被称为二进制系统。由于系统只允许两种状态，因此由数字\
  \ 0 和 1 表示。在 C++ 中，这些数字通常被求值为 `false` 和 `true`（`true` 为非零）。\n\n就像十进制中的数字被求值为基数 10\
  \ 的幂一样，二进制中的数字被求值为其基数 2 的幂：\n\n101 (二进制） = 1 x 2² + 0 x 2¹ + 1 x 2⁰ = 4 + 0 + 1\
  \ = 5 (十进制)\n\n所以，二进制 101 的十进制对应值为 5。\n\n***\n\n注意\n\n二进制数中的数字通过乘以 2 的幂（如 4, 8,\
  \ 16, 32 等）来确定数字的大小。幂次由该数字所在的从 0 开始计数的位置决定。\n\n***\n\n为了更好地理解二进制系统，让我们查看 表 1。\n\n\
  ### 为什么计算机使用二进制\n\n计算机基于二进制运行。计算机中每个内存单元的状态都是 0 或 1。然而，如果我们人类用 0 和 1 来与计算机或编程特定的信息进行交互，我们需要大量的空间来处理微小的信息片段。因此，与其用二进制写下\
  \ 1111，不如用十六进制写下 F 要高效得多。\n\n因此，十六进制表示可以非常高效地表示一个数字中 4 位的状态，最多只需要两个十六进制位即可表示一个字节（byte）的状态。\n\
  \n### 十六进制\n\n十六进制是基数为 16 的数字系统。十六进制系统中的数字范围可以在 0–9 和 A–F 之间。所以，十进制的 10 是十六进制的 A，十进制的\
  \ 15 是十六进制的 F。\n\n就像十进制中的数字被求值为基数 10 的幂，二进制被求值为基数 2 的幂，十六进制数字则被求值为基数 16 的幂。\n\n\
  ***\n\n注意\n\n惯例是将十六进制数用前缀 `0x` 表示。\n\n### 什么是位和字节？\n\n位（bit）是基本单位。位的集合是字节（byte）。一个字节中位的数量在理论上并不是固定的。\n\
  \n然而，大多数计算系统假设一个字节有 8 位，原因仅仅是 8 是 2 的幂。8 位足以表示字符集。\n\n### 多少字节字节组成一个千字节？\n\n1024\
  \ 字节（2¹⁰ 字节）组成一个千字节。同样，1024 千字节组成一个兆字节。1024 兆字节组成一个吉字节。1024 吉字节组成一个太字节。\n\n\n\n\n\
  \n一种较少使用的数字系统是八进制。这是一个以 8 为数的系统，由 `0` 到 `7` 的数字组成。\n\n***\n\n## 转换为不同的进制\n\n在处理数字时，你可能需要以不同的进制查看同一个数字——例如，二进制数字的十进制值，或者十进制数的十六进制值。\n\
  \n在之前的示例中，你已经看到了如何将二进制或十六进制转换为十进制。请看如何将二进制和十六进制转换为十进制。\n\n### 通用转换过程\n\n将一个系统中的数字转换为另一个系统时，从被转换的数字开始，连续除以基数。每个余数依次填充目标数字系统的位置，从最低位开始。下一次除法使用上一次除法得到的商以基数为除数。\n\
  \n此过程一直持续，直到余数在目标数字系统的范围内且商为 `0`。\n\n此过程也称为`拆解法`。\n\n### 将十进制转换为二进制\n\n**要将十进制 33\
  \ 转换为二进制，需要减去可能的 2 的最高幂 (32)：**\n\n点击此处查看代码图像\n\n第 1 位：`33 / 2` = 商 `16`，余 `1`\n\
  第 2 位：`16 / 2` = 商 `8`，余 `0`\n第 3 位：`8 / 2` = 商 `4`，余 `0`\n第 4 位：`4 / 2` = 商 `2`，余\
  \ `0`\n第 5 位：`2 / 2` = 商 `1`，余 `0`\n第 6 位：`1 / 2` = 商 `0`，余 `1`\n\n———————————————————————\n\
  33 的二进制等价值（倒读位）：100001\n———————————————————————\n\n**同样，156 的二进制等价值为：**\n\n点击此处查看代码图像\n\
  \n第 1 位：`156 / 2` = 商 `78`，余 `0`\n第 2 位：`78 / 2` = 商 `39`，余 `0`\n第 3 位：`39 / 2`\
  \ = 商 `19`，余 `1`\n第 4 位：`19 / 2` = 商 `9`，余 `1`\n第 5 位：`9 / 2` = 商 `4`，余 `1`\n第 6\
  \ 位：`4 / 2` = 商 `2`，余 `0`\n第 7 位：`2 / 2` = 商 `1`，余 `0`\n第 9 位：`1 / 0` = 商 `0`，余\
