  \ 是 C++11 保护你的代码免受意外实例的方法。\n\n### 在 C++ 中使用模板\n\n模板最重要且强大的应用是标准模板库（STL）。STL 由一组包含通用工具类和函数的模板类组成。这些\
  \ STL 类允许你实现动态数组、列表和键值对容器，而诸如 `sort` 等算法作用于这些容器并处理它们包含的数据。\n\n之前获得的模板语法有助于你使用后续章节中详细介绍的\
  \ STL 容器和函数。对 STL 容器和算法更好的理解反过来有助于你编写高效可靠的 C++ 应用，并帮助你避免在样板代码上花费时间。\n\n![图像](img/t038_01.jpg)\n\
  \n### 总结\n\n在本节中，你学习了更多关于预处理器的细节。每当你运行编译器时，预处理器首先运行并翻译如 `#define` 等指令。\n\n预处理器执行文本替换，尽管使用宏可能会有些复杂。宏函数根据编译时传递给宏的参数提供复杂的文本替换。在每个参数周围加上括号以确保正确的替换。\n\
  \n模板帮助你编写可重用的代码，为开发者提供适用于各种数据类型的模式。它们还实现了宏的类型替换。在本节获得的模板知识，你现在准备好学习 STL 了！\n\n###\
  \ 问答\n\nQ. 为什么要在头文件中使用包含保护？\n\nA. 使用 `#ifndef`、`#define` 和 `#endif` 的包含保护可以防止头文件出现多次包含或递归包含错误，在某些情况下它们甚至加快编译。\n\
  \nQ. 如果功能可以通过两者实现，我应该倾向于宏函数还是模板？\n\nA. 理想情况下，你应该始终倾向于模板，因为模板允许类型安全的通用实现。宏不支持类型安全的实现，最好被避免。\n\
  \nQ. 调用模板函数时需要指定模板参数吗？\n\nA. 通常不需要，因为编译器根据函数调用中使用的参数为你推断这一点。\n\nQ. 对于给定的模板类有多少个静态变量实例？\n\
  \nA. 这完全取决于模板类对应的类型数量。因此，如果你的类已为 `int`、`string` 和自定义类型 `X` 实例化，你可以预期三个静态变量实例——每个模板特化一个。\n\
