  \ `cout`。如第 20 行和第 53 行所示，`class Fish` 和 `class Tuna` 包含了这两个虚位类中的每一个成员。输出表明，当实例化\
  \ `class Tuna` 的对象时，实例化实际上是从层次结构的顶端开始的。因此，`class Tuna` 的基类 `class Fish` 部分首先实例化，在此过程中，`Fish`\
  \ 的成员——即 `Fish::dummy`——首先被实例化。接着是执行 `Fish` 的构造函数，这在如 `dummy` 等成员属性构造完成后才执行是理所当然的。在基类构造完成后，`Tuna`\
  \ 的实例化继续，首先是成员 `Tuna::dummy` 的实例化，最后是执行 `Tuna::Tuna()` 中的构造函数代码。输出证明了析构的顺序恰恰相反。\n\
  \n### 私有继承\n私有继承与公有继承（你到目前为止看到的）的区别在于，在派生类声明其继承自基类的代码行中，使用了 `private` 关键字：\n\n点击此处查看代码图像\n\
  ```cpp\nclass Base\n{\n    // ... 基类成员和方法\n};\n\nclass Derived: private Base   \
  \  // 私有继承\n{\n    // ... 派生类成员和方法\n};\n```\n对基类的私有继承意味着基类的所有成员和属性对于任何拥有派生类实例的人来说都是私有的（即不可访问的）。换句话说，即使是\
  \ `class Base` 的公有成员和方法只能被 `Derived` 使用，而不能被拥有 `Derived` 实例的其他人使用。\n\n这与你从 `Listing\
  \ 10.1` 开始一直的 `Tuna` 和 `Fish` 示例形成了鲜明对比。`Listing 10.1` 中的 `main()`可以在 `Tuna` 实例上调用\
  \ `Fish::Swim()`，因为 `Fish::Swim()` 是公有方法，且 `class Tuna` 使用 `public` 继承自 `class Fish`。尝试将第\
  \ 17 行的 `public` 改为 `private` 并查看编译结果。\n\n因此，对于继承之外的世界来说，私有继承并不意味着一种“是一个”（is-a）的关系（想象一条不会游泳的金金鱼！）。由于私有继承允许基类属性和方法仅供派生自它的子类使用，这种关系也被称为“包含一个”（has-a）关系。在日常生活中看到的一些事物中，有一些私有继承的例子（参见\
  \ `Table 10.2`）。\n\n#### 表 10.2. 日常生活私有继承示例\n![图像](img/10tab02.jpg)\n\n让我们直观地观察汽车与其引擎之间的私有继承。参见\
  \ `Listing 10.8`。\n\n#### Listing 10.8. 通过私有继承与 Motor 类相关的类\n点击此处查看代码图像\n```cpp\n\
  #include <iostream>\nusing namespace std;\n\nclass Motor\n{\npublic:\n    void SwitchIgnition()\n\
  \    {\n        cout << \"Ignition ON\" << endl;\n    }\n    void PumpFuel()\n \
  \   {\n        cout << \"Fuel in cylinders\" << endl;\n    }\n    void FireCylinders()\n\
  \    {\n        cout << \"Vroooom\" << endl;\n    }\n};\n\nclass Car:private Motor\n\
  {\npublic:\n    void Move()\n    {\n        SwitchIgnition();\n        PumpFuel();\n\
  \        FireCylinders();\n    }\n};\n\nint main()\n{\n    Car myDreamCar;\n   \
  \ myDreamCar.Move();\n    return 0;\n}\n```\n\n### 输出\n点击此处查看代码图像\n```text\nIgnition\
  \ ON\nFuel in cylinders\nVroooom\n```\n\n### 分析\n第 3–18 行定义的 `class Motor` 非常简单，包含三个用于点火、泵油和点火的成员函数。第\
  \ 20 行的 `class Car` 使用 `private` 继承。因此，公有函数 `Car::Move()` 调用了基类的成员。如果你在 `main()`\
  \ 中尝试以下内容：\n\n点击此处查看代码图像\n```cpp\nmyDreamCar.PumpFuel();\n```\n编译将失败，错误类似于 `error\
  \ C2247: 因为 'Car' 使用 'private' 继承 'Motor'。\n\n### 注意\n如果另一个 `class SuperCar` 继承自\
  \ `Car`，那么无论 `SuperCar` 和 `Car` 之间的继承性质如何，`SuperCar` 都无法访问 `Motor` 的任何成员或方法。这是因为\
  \ `Car` 与 `Motor` 之间的关系是私有继承，这意味着除了 `Car` 之外的所有实体对 `Base` 的公有成员都只有私有访问权限（即无访问权限）。\n\
  \n换句话说，当编译器计算一个类是否具有访问基类 `public` 或 `protected` 成员的权限时，限制性最大的访问限定符占据优先。\n\n### 保护继承\n\
  保护继承与公有继承的区别在于，在派生类声明其继承自基类的代码行中使用了 `protected` 关键字：\n\n点击此处查看代码图像\n```cpp\nclass\
  \ Base\n{\n    // ... 基类成员和方法\n};\n\nclass Derived: protected Base     // 保护继承\n\
  {\n    // ... 派生类成员和方法\n};\n```\n保护继承在以下方面与私有继承相似：\n• 它也表示“包含一个”（has-a）的关系。\n• 它也允许派生类访问\
  \ `Base` 的所有公有和保护成员。\n• 继承层次之外的 `Derived` 实例无法无法访问 `Base` 的公有成员。\n\n然而，在涉及被继承的派生类时，保护继承又不同：\n\
  \n点击此处查看代码图像\n```cpp\nclass Derived2: protected Derived\n{\n    // 可以访问 Base 的成员\n\
  };\n```\n\n\n\n\n\n保护性继承层次结构允许子类的子类（即 `Derived2`）访问 `Base` 的 `public` 成员，如列表 10.9\
  \ 所示。如果 `Derived` 和 `Base` 之间的继承是 `private`，则将无法实现。\n\n列表 10.9. `class SuperCar`\
  \ 继承自类 `Car`，该类又继承自类 `Motor`，使用保护性继承\n\n点击此处查看代码图片\n\n* * *\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: class Motor\n4: {\n5: public:\n6:\
  \     void SwitchIgnition()\n7:     {\n8:         cout << \"Ignition ON\" << endl;\n\
  9:     }\n10:     void PumpFuel()\n11:     {\n12:         cout << \"Fuel in cylinders\"\
  \ << endl;\n13:     }\n14:     void FireCylinders()\n15:     {\n16:         cout\
  \ << \"Vroooom\" << endl;\n17:     }\n18: };\n19:\n20: class Car:protected Motor\n\
  21: {\n22: public:\n23:     void Move()\n24:     {\n25:         SwitchIgnition();\n\
  26:         PumpFuel();\n27:         FireCylinders();\n28:     }\n29: };\n30:\n\
  31: class SuperCar:protected Car\n32: {\n33: public:\n34:     void Move()\n35: \
  \    {\n36:         SwitchIgnition();  // has access to base members\n37:      \
  \   PumpFuel();         // due to \"protected\" inheritance between Car and\n38:\
  \         Motor\n39:         FireCylinders();\n40:         FireCylinders();\n41:\
  \         FireCylinders();\n42:     }\n43: };\n44:\n45: int main()\n46: {\n47: \
  \    SuperCar myDreamCar;\n48:     myDreamCar.Move();\n49:\n50:     return 0;\n\
  51: }\n```\n\n* * *\n\n* * *\n\n输出\n\nIgnition ON\n\nFuel in cylinders\n\nVroooom\n\
  \nVroooom\n\nVroooom\n\n* * *\n\n* * *\n\n分析\n\n`class Car` 使用 `protected` 继承自 `Motor`，如第\
  \ 20 行所示。`class SuperCar` 使用 `protected` 继承自 `class Car`，如第 31 行所示。如你所见，`SuperCar::Move()`\
  \ 的实现使用了在基类 `class Motor` 中定义的公共方法。这种通过中间基类 `class Car` 访问最终基类 `class Motor` 的行为受\
  \ `Car` 和 `Motor` 之间关系的制。如果这里是 `private` 而不是 `protected`，那么 `SuperClass` 将无法访问 `Motor`\
  \ 的 `public` 成员，因为编译器会选择相关访问说明符中限制性最大的一个。注意，类 `Car` 和 `SuperCar` 之间的关系性质对于访问 `Base`\
  \ 没有影响。因此，即使你将第 31 行的 `protected` 改为 `public` 或 `private`，该程序的编译结果也将保持不变。\n\n* *\
  \ *\n\n* * *\n\n注意\n\n仅在必要时才使用 `private` 或 `protected` 继承。\n\n在大多数使用 `private` 继承的场景（例如\
  \ `Car` 和 `Motor` 的情况），基类完全可以作为 `class Car` 的成员属性，而不是超类。通过继承自 `class Motor`，你本质上限制了\
  \ `Car` 只能有一个电机，这与将 `class Motor` 的实例作为 `private` 成员相比并没有显著的收益。\n\n汽车一直在进化，例如混合动力汽车除了电动机外还有燃油发动机。我们为\
  \ `class Car` 设计的继承体系在兼容此类发展方面将成为瓶颈。\n\n* * *\n\n* * *\n\n注释\n\n将 `Motor` 的实例作为\
  \ `private` 成员而不是继承自它，被称为*组合*（composition）或*聚合*（aggregation）。这样的 `class Car` 看起来如下所示：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Car\n{\nprivate:\n    Motor heartOfCar;\npublic:\n\
  \    void Move()\n    {\n        heartOfCar.SwitchIgnition();\n        heartOfCar.PumpFuel();\n\
  \        heartOfCar.FireCylinders();\n    }\n};\n```\n\n这是一种良好的设计，因为它允许你轻松将更多的电机作为成员属性添加到现有的\
  \ `Car` 类中，而无需更改其继承层次或相对于客户端的设计。\n\n* * *\n\n### 切片问题（Slicing）\n\n当程序员执行以下操作时会发生什么？\n\
  \n点击此处查看代码图片\n\n```cpp\nDerived object;\nBase = object;\n```\n\n或者，如果程序员这样做又怎样？\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid FuncBase(Base);\nDerived;\n```\n\n在这两种情况下，`Derived`\
  \ 对象都被拷贝到了 `Base` 中。这些情况下发生的情况是编译器只拷贝了 `Derived` 的 `Base` 部分——而不是整个对象——这并不是程序员所预期的，这种将\
  \ `Derived` 意外还原为 `Base` 的非意愿行为被称为*切片*（slicing）。\n\n* * *\n\n注意\n\n为了避免切片，不要按值传递参数。\n\
  \n* * *\n\n### 多重继承\n\n在本章的前面的部分，我提到过多重继承可能是相关的，例如鸭嘴兽。对于此类情况，C++ 允许一个类派自多个基类。\n\n\
  鸭嘴兽的图（如图 10.3\n\n```cpp\nclass Platypus: public Mammal, public Bird, public Reptile\n\
  {\n    // ... members ...\n};\n```\n\n列表 10.10 展示了 `Platypus` 的实例化。\n\n\n\n\n\n\
  `class Platypus` 在第 30–37 行中的定义非常紧凑。它本质上什么都没做只是继承了 `Mammal`、`Reptile` 和 `Bird` 三个类。第\
  \ 41–44 行中的 `main()` 函数通过派生类 `class Platypus` 的对象（命名为恰当的 `realFreak`）能够调用这三个基类的这三个特征。除了调用继承自\
  \ `Mammal`、`Bird` 和 `Reptile` 类的函数外，第 45 行的 `main()` 还调用了 `Platypus::Swim()`。该程序演示了多继承的语法，并展示了派生类如何暴露其多个基类的所有公共属性（在本例中为公有成员方法）。\n\
  \n* * *\n\n* * *\n\n注意\n\n鸭嘴兽会游泳，但它不是鱼。因此，在列表 10.10 中，你并没有为了方便使用现有的 `Fish::Swim()`\
  \ 函数而让 `Platypus` 也继承自 `Fish`。在做出设计决策时，不要忘记公共继承也应该表示一种“是一种”（is-a）的关系，而不应无差别地为了满足某些与重用相关的目标。这些目标可以通过其他方式实现。\n\
  \n* * *\n\n![图像](img/t0280_01.jpg)\n\n### 总结\n\n在本节中，你学习了 C++ 继承的基础知识。你学习了公共继承是派生类与基类之间一种“是一种”（is-a）的关系，而\
  \ `private` 和 `protected` 继承则创建了“有一个”（has-a）的关系。你看到了访问修饰符 `protected` 的应用，它能仅向派生类暴露基类的属性，而对继承层次之外的类隐藏这些属性。你学习了\
  \ `protected` 继承与 `private` 继承的区别在于：`derived` 类的派生类可以访问基类的 `public` 和 `protected`\
  \ 成员，而这在 `private` 继承中是不可能的。你还学习了重写方法和隐藏方法的基础知识，以及如何通过 `using` 关键字避免无意的方法隐藏。\n\n\
  你现在准备好回答一些问题，然后继续学习面向对象编程的下一个主要支柱：多态。\n\n### 问答\n\nQ. 我被要求为 `Mammal` 类以及人类、狮子和鲸鱼等哺乳动物建模。我是否应该使用继承层次？如果是，应该用哪一个？\n\
  \nA. 由于 `Human`、`Lion` 和 `Whale` 都是哺乳动物，并且本质上符合“是一种”（is-a）的关系，你应该使用公共继承，以 `class\
  \ Mammal` 为基类，其他类如 `class Human`、`Lion` 和 `Whale` 继承自它。\n\nQ. 派生类（derived class）和子类（subclass）这两个术语之间有什么区别？\n\
  \nA. 本质上没有。这两个词都用于表示派生自——即特化——一个基类的类。\n\nQ. 派生类在与其基类的关系中使用公共继承。它能访问基类的私有成员吗？\n\n\
  A. 不能。编译器始终确保执行最严格的适用访问修饰符。无论继承的性质如何，类的 `private` 成员在类外部永远不会被泄露（即不可访问）。该规则的例外是那些被声明为\
  \ `friend`（友元）的类和函数。\n\n### 工作坊\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习题让你获得使用所学知识经验。在检查附录\
  \ D 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解答案。\n\n#### 测验\n\n1. 我希望某些基类成员可以被派生类访问，但在继承层次之外不可。我应该使用什么访问修饰符？\n\
