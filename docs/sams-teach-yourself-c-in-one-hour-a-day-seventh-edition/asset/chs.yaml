  输出\n点击此处查看代码图片\n```\nOverloaded constructor creates Adam of age 30\nOverloaded constructor\
  \ creates Eve of age 28\nI am Adam and am 30 years old\nI am Eve and am 28 years\
  \ old\n```\n\n### 分析\nAdam 是 `main()` 函数中第 34 行创建的；如果你取消注释了第 32 行，编译将报错 `error:\
  \ 'Human': no appropriate default constructor`。这是因为 `class Human` 只有一个接受 `string`\
  \ 和 `int` 参数的构造函数，没有默认构造函数。\n\n#### 带有默认值的构造函数参数\n就像函数可以带有默认参数一样，构造函数也可以。你在可以在列表\
  \ 9.5 中第 14 行构造函数的稍作修改版本，其中 `Age` 参数具有默认值 `25`：\n\n点击此处查看代码图片\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <string>\n2: using namespace std;\n3:\n4: class Human\n\
  5: {\n6: private:\n7:     // 私有成员数据:\n8:     string Name;\n9:     int Age;\n10:\n\
  11: public:\n12:\n13:     // 重载的构造函数（无默认构造函数）\n14:     Human(string HumansName,\
  \ int HumansAge = 25)\n15:     {\n16:         Name = HumansName;\n17:         Age\
  \ = HumansAge;\n18:         cout << \"Overloaded constructor creates \" << Name;\n\
  19:         cout << \" of age \" << Age << endl;\n20:     }\n21:\n22:     void IntroduceSelf()\n\
  23:     {\n24:         cout << \"I am \" << Name << \" and am \";\n25:         cout\
  \ << Age << \" years old\" << endl;\n26:     }\n27: };\n28:\n29: int main()\n30:\
  \ {\n31:     // 这种类可以使用以下语法实例化：\n32:     Human Adam(\"Adam\"); // Adam.Age 被赋予默认值\
  \ 25\n33:     Human Eve(\"Eve\", 18); // Eve.Age 被赋予指定的 18\n34:\n35:     Adam.IntroduceSelf();\n\
  36:     Eve.IntroduceSelf();\n37: }\n```\n\n输出\n点击此处查看代码图片\n```\nOverloaded constructor\
  \ creates Adam of age 25\nOverloaded constructor creates Eve of age 18\nI am Adam\
  \ and am 30 years old\nI am Eve and am 28 years old\n```\n\n### 注意\n注意，默认构造函数是指可以在不带参数的情况下实例化的构造函数，而不一定是不接受参数的构造函数。因此，这个带有带有默认值的参数构造函数就是一个默认构造函数：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Human\n{\nprivate:\n    // 私有成员数据:\n    string Name;\n\
  \    int Age;\n\npublic:\n    // 注意两个输入参数的默认值\n    Human(string HumansName = \"\"\
  , int HumansAge = 0);\n};\n```\n\n\n\n\n```cpp\nHuman(string HumansName = \"Adam\"\
  , int HumansAge = 25)\n{\n    Name = HumansName;\n    Age = HumansAge;\n    cout\
  \ << \"Overloaded constructor creates \" << Name;\n    cout << \" of age \" << Age\
  \ << endl;\n};\n```\n\n这是因为 `class Human` 仍然可以在无参数的情况下实例化：\n\n点击此处查看代码\n\n`Human\
  \ Adam;` // 具有默认 Name \"Adam\" 和 Age 25 的 Human 对象\n\n### 使用初始化列表的构造函数\n\n你已经看到构造函数对于初始化变量是很有用。另一种初始化成员的方法是使用初始化列表。列表\
  \ 9.5 中一个接收两个参数的构造函数，其初始化列表变体形式如下：\n\n点击此处查看代码\n\n```cpp\nclass Human\n{\nprivate:\n\
  \    string Name;\n    int Age;\npublic:\n    // 构造函数接收两个参数来初始化成员 Age 和 Name\n \
  \   Human(string InputName, int InputAge)\n        :Name(InputName), Age(InputAge)\n\
  \    {\n        cout << \"Constructed a Human called \" << Name;\n        cout <<\
  \ \", \" << Age << \" years old\" << endl;\n    }\n// ... 其他类成员\n};\n```\n\n因此，初始化列表的特征是在圆括号\
  \ `(...)` 包含参数声明后紧跟一个冒号（`:`），然后是单独的成员变量以及它被初始化的值。这个初始化值可以是如 `InputName` 这样的参数，甚至是一个固定值。初始化列表在调用带有特定参数的基类构造函数时也有用，并在第\
  \ 10 节 “实现继承”中被再次讨论。\n\n你可以在列表 9.6 中看到一个具有带有默认值的默认构造函数和初始化列表的 `class Human`。\n\n\
  列表 9.6. 使用初始化列表通过带有默认值的参数来设置成员的默认构造函数\n\n点击此处查看代码\n\n```cpp\n0: #include <iostream>\n\
  1: #include <string>\n2: using namespace std;\n3:\n4: class Human\n5: {\n6: private:\n\
  7:     int Age;\n8:     string Name;\n9:\n10: public:\n11:     Human(string InputName\
  \ = \"Adam\", int InputAge = 25)\n12:     :Name(InputName), Age(InputAge)\n13: \
  \    {\n14:         cout << \"Constructed a Human called \" << Name;\n15:      \
  \   cout << \", \" << Age << \" years old\" << endl;\n16:     }\n17: };\n18:\n19:\
  \ int main()\n20: {\n21:     Human FirstMan;\n22:     Human FirstWoman(\"Eve\",\
  \ 18);\n23:\n24:     return 0;\n25: }\n```\n\n输出\n\n点击此处查看代码\nConstructed a Human\
  \ called Adam, 25 years old\nConstructed a Human called Eve, 18 years old\n\n分析\n\
  \n在第 1–16 行可以看到带有初始化列表的构造函数，你也可以看到参数为 `Age` 赋予了默认值 `\"Adam\"` 和 `25`。因此，当第 21 行创建一个名为\
  \ `FirstMan` 的 `class Human` 实例时，它的成员被分配了默认值。相反，`FirstWoman` 如第 22 行所示提供了显式的 `Name`\
  \ 和 `Age`。\n\n### 析构函数\n\n析构函数像构造函数一样是特殊函数。与构造函数不同，析构函数在对象销毁时会自动调用。\n\n#### 声明和实现析构函数\n\
  \n析构函数像构造函数一样，是一个以类名的函数，但前面有一个波号（`~`）。因此，`class Human` 可以有一个如下声明的析构函数：\n\n点击此处查看代码\n\
  \n```cpp\nclass Human\n{\n    ~Human(); // 析构函数的声明\n};\n```\n\n此析构函数可以在类内内联，也可以在类声明外部实现。类内部的实现如下：\n\
  \n点击此处查看代码\n\n```cpp\nclass Human\n{\npublic:\n    ~Human()\n    {\n        // 析构函数在这里\n\
  \    }\n};\n```\n\n一种允许你在类声明外部定义析构函数的变体形式如下：\n\n点击此处查看代码\n\n```cpp\nclass Human\n\
  {\npublic:\n    ~Human(); // 析构函数声明\n};\n// 析构函数定义（实现）\nHuman::~Human()\n{\n   \
  \ // 析构函数在这里\n}\n```\n\n如你所示，析构函数的声明与构造函数略有不同，在于它包含一个波号（`~`）。然而，析构函数的作用与构造函数完全相反。\n\
  \n#### 何时以及如何使用析构函数\n\n当类对象离开范围或通过 `delete` 删除并销毁时，析构函数总是会被调用。这一属性使得析构函数成为重置变量和释放动态分配内存的理想位置。\n\
  \n本书一直建议使用 `std::string` 而不是 C 风格的 `char` 缓冲区，后者需要你自己管理内存分配。`std::string` 以及此类工具本身就是类，它们充分利用了构造函数和析构函数（在第\
  \ 12 节 “运算符类型和运算符重载”中将进一步讨论涉及的运算符）。请分析[列表 9.7 所示的示例类 `MyString`，在构造函数中分配内存并在析构函数中释放。\n\
  \n列表 9.7. 一个通过析构函数确保释放 C 风格缓冲区的简单类\n\n\n\n\n该类基本上在 `MyString::Buffer` 中封装了一个 C 风格的字符串，并让你免于分配内存的任务；每当你需要使用字符串时，它都会释放该内存。我们最感兴趣的几行是第\
  \ 10–19 行的构造函数 `MyString()` 以及第 21–26 行的析构函数 `~MyString()`。构造函数通过一个强制性的输入参数强制执行带有输入字符串的构造，然后在第\
  \ 14 行为其分配内存并将其拷贝到 C 风格的字符串 `Buffer` 中（使用 `strlen` 输入字符串的长度，并在第 15 行使用 `strcpy`\
  \ 拷贝到新分配的内存中）。如果类的用户提供的 `InitialInput` 为 NULL，则 `MyString::Buffer` 也会初始化为 `NULL`（以防止该指针包含随机值，这在用于访问内存位置时是危险的）。析构函数代码负责确保构造函数中分配的内存自动返回给系统。它检查\
  \ `MyString::Buffer` 是否为 `NULL`，如果是，则对它执行 `delete[]`，以对应构造函数中的 `new`。注意，在 `main()`\
  \ 函数中，程序员从未执行过 `new` 或 `delete`。这个类不仅从他那里抽象了这些实现，而且这样做确保了释放分配内存的逻辑正确性。析构函数 `~MyString()`\
  \ 在 `main` 返回时被自动调用，这在执行析构函数中的 `cout` 语句的输出中得到了证明。\n\n处理字符串得更好的类是析构函数的许多适用用途之一。第\
  \ 26 “理解智能指针”演示了析构函数在以更智能的方式处理指针时如何起着关键作用。\n\n### Note\n析构函数不能重载。一个类只能有一个析构函数。如果你忘记实现析构函数，编译器会创建并调用一个虚拟析构函数，即一个空析构函数（不对动态分配的内存进行任何清理）。\n\
  \n### 拷贝构造函数\n在第 7 “用函数组织代码”中，你学习了传递给如 `Area()` 函数的参数（在列表 7.1 中所示）是被拷贝的：\n\n```cpp\n\
  double Area(double InputRadius);\n```\n\n因此，当调用 `Area()` 时，作为参数 `InputRadius` 发送的会被拷贝。这条规则同样适用于对象或类的实例。\n\
  \n#### 浅拷贝及相关问题\n如列表 9.7 所示的 `MyString` 类包含一个指向动态分配内存的指针成员，该内是在构造函数中使用 `new` 分配，并在析构函数中使用\
  \ `delete[]` 释放。当该类的对象被拷贝时，指针成员被拷贝，但所指向的缓冲区并没有被拷贝，导致两个对象指向内存中同一个动态分配缓冲区。这被称为浅拷贝，如列表\
  \ 9.8 所示，它对程序的稳定性构成了威胁。\n\n列表 9.8. 按值传递如 MyString 等类对象的问题\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class MyString\n4: {\n5:\
  \ private:\n6:     char* Buffer;\n7:\n8: public:\n9:     //  Constructor\n10:  \
  \   MyString(const char* InitialInput)\n11:     {\n12:         if(InitialInput !=\
  \ NULL)\n13:         {\n14:             Buffer = new char [strlen(InitialInput)\
  \ + 1];\n15:             strcpy(Buffer, InitialInput);\n16:         }\n17:     \
  \    else\n18:             Buffer = NULL;\n19:     }\n20:\n21:     // 析 ructor\n\
  22:     ~MyString()\n23:     {\n24:         cout << \"Invoking destructor, clearing\
  \ up\" << endl;\n25:         if (Buffer != NULL)\n26:             delete [] Buffer;\n\
  27:     }\n28:\n29:     int GetLength()\n30:     {\n31:         return strlen(Buffer);\n\
  32:     }\n33:\n34:     const char* GetString()\n35:     {\n36:         return Buffer;\n\
  37:     }\n38: };\n39:\n40: void UseMyString(MyString Input)\n41: {\n42:     cout\
  \ << \"String buffer in MyString is \" << Input.GetLength();\n43:     cout << \"\
  \ characters long\" << endl;\n44:     cout << \"Buffer contains: \" << Input.GetString()\
  \ << endl;\n45: }\n46:\n47: int main()\n48: {\n49:     MyString SayHello(\"Hello\
  \ from Class\");\n50:     // 将 SayHello 作为参数传递给函数\n51:     UseMyString(SayHello);\n\
  52:     return 0;\n53: }\n```\n\n输出\n点击此处查看代码图像\nString buffer in MyString is 23\
  \ characters long\nBuffer contains: Hello from Class\nInvoking destructor, clearing\
  \ up\n\n\n\n\n```cpp\n// 拷贝构造函数实现代码\n\n}\n```\n\n因此，拷贝构造函数通过引用一个同类对象作为参数。该参数是源对象的别名，也是你在编写自定义拷贝代码时所拥有的句柄（在这些代码中，你需要确保对源中的所有缓冲区进行深拷贝），如列表\
  \ 9.9 所示。\n\n### 列表 9.9. 定义拷贝构造函数以确保对动态分配缓冲区进行深拷贝\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n\n3: class MyString\n{\nprivate:\n    char*\
  \ Buffer;\n\npublic:\n    // 构造函数\n    MyString(const char* InitialInput)\n    {\n\
  \        cout << \"Constructor: creating new MyString\" << endl;\n        if(InitialInput\
  \ != NULL)\n        {\n            Buffer = new char [strlen(InitialInput) + 1];\n\
  \            strcpy(Buffer, InitialInput);\n\n            // 显示本地缓冲区指向的内存地址\n  \
  \          cout << \"Buffer points to: 0x\" << hex;\n            cout << (unsigned\
  \ int*)Buffer << endl;\n        }\n        else\n            Buffer = NULL;\n  \
  \  }\n\n    // 拷贝构造函数\n    MyString(const MyString& CopySource)\n    {\n       \
  \ cout << \"Copy constructor: copying from MyString\" << endl;\n\n        if(CopySource.Buffer\
  \ != NULL)\n        {\n            // 通过通过分配自己的缓冲区来确保深拷贝\n            Buffer = new\
  \ char [strlen(CopySource.Buffer) + 1];\n\n            // 将源缓冲区拷贝到本地缓冲区\n      \
  \      strcpy(Buffer, CopySource.Buffer);\n\n            // 显示本地缓冲区指向的内存地址\n   \
  \         cout << \"Buffer points to: 0x\" << hex;\n            cout << (unsigned\
  \ int*)Buffer << endl;\n        }\n        else\n            Buffer = NULL;\n  \
  \  }\n\n    // 析析函数\n    ~MyString()\n    {\n        cout << \"Invoking destructor,\
  \ clearing up\" << endl;\n        if (Buffer != NULL)\n            delete [] Buffer;\n\
  \    }\n\n    int GetLength()\n    {\n        return strlen(Buffer);\n    }\n\n\
  \    const char* GetString()\n    {\n        return Buffer;\n    }\n};\n\nvoid UseMyString(MyString\
  \ Input)\n{\n    cout << \"String buffer in MyString is \" << Input.GetLength();\n\
  \    cout << \" characters long\" << endl;\n    cout << \"Buffer contains: \" <<\
  \ Input.GetString() << endl;\n    return;\n}\n\nint main()\n{\n    MyString SayHello(\"\
  Hello from String Class\");\n    // 按值传递 SayHello（将被拷贝）\n    UseMyString(SayHello);\n\
  \    return 0;\n}\n```\n\n### 输出\n\n点击此处查看代码图像\n\n```\nConstructor: creating new\
  \ MyString\nBuffer points to: 0x00DA68\nCopy constructor: copying from MyString\n\
  Buffer points to: 0x00DAF8\nString buffer in MyString is 17 characters long\nBuffer\
  \ contains: Hello from String Class\nInvoking destructor, clearing up\nInvoking\
  \ destructor, clearing up\n```\n\n### 分析\n\n大部分代码与列表 9.8 相似，仅在构造函数中增加了几行 `cout`，并在第\
  \ 27–45 行增加了一个新的拷贝构造函数。首先，让我们关注 `main()`，它（与之前一样）在第 77 行创建了对象 `SayHello`。创建 `SayHello`\
  \ 会导致第一行输出，该输出来自 `MyString` 的构造函数，位于第 12 行。为了方便起见，构造函数还显示了内存地址。\n\n\n\n正如注释所指出的，在实例化\
  \ `sayHelloAgain` 时，构造函数（copy constructor）被调用了两次，因此由于我们调用了返回 `MyString` 值的函数 `Copy(sayHello)`，执行了两次深拷贝（deep\
  \ copy）。然而，这个返回的值是临时的，在表达式表达式外部不可用。因此，C++ 编译器善意调用的拷贝构造函数实际上导致了性能下降，如果这是一个大型对象的动态数组，这种下降可能会变得显著。\n\
  \n为了避免这种性能瓶颈，除了拷贝构造函数外，再编写一个移动构造函数（move constructor）。移动构造函数的语法如下：\n\n点击此处查看代码图片\n\
  \n```cpp\n// move constructor\nMyString(MyString&& MoveSource)\n{\n   if(MoveSource.Buffer\
  \ != NULL)\n   {\n      Buffer = MoveSource.Buffer; // 获取所有权，即“移动”\n      MoveSource.Buffer\
  \ = NULL;   // 将移动源置为 NULL，即释放它\n   }\n}\n```\n\n在可用的情况下，C++11 编译器会自动选择移动构造函数来“移动”临时资源，从而避免深拷贝步骤。在实现移动构造函数后，注释应相应地更改如下：\n\
  \n点击此处查看代码图片\n\n```cpp\nMyString sayHelloAgain(Copy(sayHello)); // 调用 1 次拷贝构造函数，1\
  \ 次移动构造函数\n```\n\n 移动构造函数通常配合移动赋值运算符实现，该运算符将在第 12 节中详细讨论。列表 12.11 是 `class MyString`\
  \ 的改进版本，它实现了移动构造函数和移动赋值运算符。\n\n### 构造函数和析构函数的不同用途\n\n在这一节中，你学习了一些重要的基础概念，例如构造函数、析构函数，以及通过\
  \ `public` 和 `private` 等关键字对数据和方法进行抽象。这些概念使你能够创建控制其如何被创建、拷贝、销毁或暴露数据的类。\n\n让我们来看一些帮助你解决许多重要设计问题的有趣模式。\n\
  \n#### 不允许拷贝的类\n\n你被要求对国家的宪法进行建模。一个国家只有一个总统。你的 `class President` 存在着以下风险：\n\n点击此处查看代码图片\n\
  \n```cpp\nPresident OurPresident;\nDoSomething(OurPresident); // 按值传递时创建了副本\nPresident\
  \ clone;\nclone = OurPresident; // 通过赋值创建副本\n```\n\n显然，你需要避免这种情况。除了建模特定的宪法外，你可能正在编写一个操作系统，并需要建模一个本地局域网、一个处理器等。你需要避免资源可以被拷贝的情况。如果你不声明拷贝构造函数，C++\
  \ 编译器会为你插入一个默认的公有拷贝构造函数。这破坏了你的设计并威胁了你的实现。然而，语言为你提供了一个解决这种设计范式的方案。\n\n你可以通过声明一个 `private`\
  \ 拷贝构造函数来确保你的类不能被拷贝。这确保了函数调用 `DoSomething(OurPresident)` 将导致编译失败。为了避免赋值，你声明一个 `private`\
  \ 赋值运算符。\n\n因此，解决方案如下：\n\n点击此处查看代码图片\n\n```cpp\nclass President\n{\nprivate:\n \
  \  President(const President&); // 私有拷贝构造函数\n   President& operator= (const President&);\
  \ // 私有拷贝赋值运算符\n   // ... 其他属性\n};\n```\n\n不需要实现私有的拷贝构造函数或赋值运算符。只需将它们声明为私有，就足以并能够实现你确保\
  \ `class President` 的对象不可拷贝的目标。\n\n#### 允许单实例的单例类\n\n之前讨论的 `class President` 很好，但它有一个缺点：它无法帮助通过实例化多个对象来创建多个总统：\n\
  \n```cpp\nPresident One, Two, Three;\n```\n\n由于 `private` 拷贝构造函数，它们单独来说是不可拷贝的，但你理想上需要一个拥有一个且仅有一个真实世界体现的\
  \ `class President`——也就是说只有一个对象，并禁止创建额外的对象。欢迎来到单例（singleton）的概念，它使用私有构造函数、私有赋值运算符和\
  \ `static` 实例成员来创建这种（具有争议的）强大的模式。\n\n***\n\n**提示**\n\n- 当关键字 `static` 用于类数据成员时，它确保该成员在所有实例之间共享。\n\
  - 当 `static` 用于在函数作用范围内声明的局部变量时，它确保该变量在函数调用之间保留其值。\n- 当 `static` 用于成员函数（方法）时，该方法在类的所有实例之间共享。\n\
  \n***\n\n关键字 `static` 是创建单例类的必组成要素，如列表 9.10 所示。\n\n列表 9.10. 禁止拷贝、赋值和多次实例创建的单例类 President。\n\
  \n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include <iostream>\n1: #include <string>\n2:\
  \ using namespace std;\n3: \n4: class President\n5: {\n6: private:\n7:    // 默认构造函数（禁止创建）\n\
  8:    President() {};\n9: \n10:   // 拷贝构造函数（禁止拷贝）\n11:   President(const President&);\n\
  12: \n13:   // 赋值运算符（禁止赋值）\n14:   President& operator=(const President&);\n15: \n\
  16:   // 数据：名称\n17:   string Name;\n18: \n19: public:\n20:   // 受控实例化\n21:   static\
  \ President& GetInstance()\n22:   {\n23:      // 静态对象只构造一次\n24:      static President\
  \ OnlyInstance;\n25:      return OnlyInstance;\n26:   }\n27: \n28:   // 公有方法\n29:\
  \   string GetName()\n30:   {\n31:      return Name;\n32:   }\n33: \n34:   void\
  \ SetName(string InputName)\n35:   {\n36:      Name = InputName;\n37:   }\n38: };\n\
  39: \n40: int main()\n41: {\n42:    President& OnlyPresident = GetInstance();\n\
  43:    OnlyPresident.SetName(\"Abraham Lincoln\");\n44: \n45:    cout << \"The name\
  \ of the President is: \";\n46:    cout << GetInstance().GetName() << endl;\n47:\
  \ \n48:    return 0;\n49: }\n```\n\n***\n\n**输出**\n\nThe name of the President is:\
  \ Abraham Lincoln\n\n***\n\n**分析**\n\n快速查看 `main()`，它有几行代码和大量的注释掉的代码，显示了创建 `class\
  \ President` 新实例或副本的所有不可行组合。让我们逐一分析它们：\n\n点击此处查看代码图片\n\n47: // President Second;\
  \ // 无法访问构造函数\n48: // President* Third= new President(); // 无法访问构造函数\n\n行 47 和 48\
  \ 分别尝试在栈和堆上使用默认构造函数创建对象，由于它是私有的，因此不可用的，如第 8 行所示：\n\n点击此处查看代码图片\n\n49: // President\
  \ Fourth = OnlyPresident; // 无法访问拷贝构造函数\n\n行 49 尝试通过拷贝构造函数创建现有对象的副本（创建时时的赋值会调用拷贝构造函数），这在\
  \ `main()` 中是不可用的，因为它在第 11 行中声明为私有：\n\n点击此处查看代码图片\n\n50: // OnlyPresident = President::GetInstance();\
  \ // 无法访问赋值运算符\n\n\n\n\n第 50 行尝试通过赋值来创建副本，这是行不通，因为赋值运算符在第 14 行被声明为 `private`（私有）。因此，`main()`\
  \ 永远无法创建 `class President` 类的实例，唯一的选择是在第 43 行所示，即使用静态函数 `GetInstance()` 来获取 `class\
  \ President` 的实例。由于 `GetInstance()` 是一个静态成员，它非常像一个全局函数，可以在没有对象句柄的情况下被调用。`GetInstance()`\
  \ 实现在第 21–27 行，它使用静态变量 `OnlyInstance` 来确保只创建一个且仅存在 `President` 类的实例。为了更好地理解这一点，请想象第\
  \ 24 行只执行一次（静态初始化），因此 `GetInstance()` 返回唯一的可用用 `class President` 实例，无论该实例如何被使用，如\
  \ `main()` 中的第 43 行和 53 行所示。\n\n### 注意事项\n\n仅在绝对必要时才使用单例模式，并充分考虑应用程序及其功能的未来增长。请注意，这种限制多个实例创建的特性本身，当出现需要该类的多个实例的用例时，可能会成为架构瓶颈。\n\
  \n例如，如果我们的项目正从对国家建模增长为对联合国建模（而目前联合国由 192 个国家和 192 位总统代表），显然我们正面临着即将发生的架构问题。\n\n\
  ## 禁止在栈上实例化的类\n\n栈空间通常有限的。如果你正在编写一个内部结构可能包含数 GB 数据的数据库，你可能希望确保该类的客户端不能在栈上实例化；相反，它被强制只能在堆上创建实例。确保此点的关键是将析构函数声明为\
  \ `private`：\n\n```cpp\nclass MonsterDB\n{\nprivate:\n   // 私有析构函数\n   ~MonsterDB();\n\
  \   //... 预留大量数据的集合\n};\n```\n\n因此，当尝试使用 `class MonsterDB` 时，不允许这样创建实例：\n\n```cpp\n\
  int main()\n{\n   MonsterDB myDatabase; // 编译错误\n   // ... 更多代码\n   return 0;\n\
  }\n```\n\n这个实例如果成功构建，将位于栈上。然而，由于编译器知道 `myDatabase` 在离开作用域时需要销毁，它会自动尝试在 `main()`\
  \ 结束时调用析构函数，但由于析构函数是私有的，无法访问，导致编译失败。\n\n然而，`private` 析构函数并没有阻止你在堆上实例化：\n\n```cpp\n\
  int main()\n{\n   MonsterDB* myDatabase = new MonsterDB(); // 无错误\n   // ... 更多代码\n\
  \   return 0;\n}\n```\n\n如果你在那里看到了内存泄漏，你并没有错。由于无法从 `main` 访问析构函数，你无法执行 `delete`。`class\
  \ MonsterDB` 类需要的是一个 `static public`（静态公有）成员函数来销毁实例（作为成员，它有权访问析构函数）。参见 列表 9.11。\n\
  \n列表 9.11. 仅允许在自由存储（使用 new）上创建对象的数据库类 MonsterDB\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class MonsterDB\n4: {\n5: private:\n6:     ~MonsterDB()\
  \ {}; // 私有析构函数\n7:\n8: public:\n9:     static void DestroyInstance(MonsterDB* pInstance)\n\
  10:     {\n11:         // 静态成员可以访问私有析构函数\n12:         delete pInstance;\n13:   \
  \  }\n14:\n15:     // ... 假设还有其他方法\n16: };\n17:\n18: int main()\n19: {\n20:    \
  \ MonsterDB* pMyDatabase = new MonsterDB();\n21:\n22:     // pMyDatabase -> 成员方法\
  \ (....);\n23:\n24:     // 取消下一行的注释查看编译失败\n25:     // delete pMyDatabase; // 私有析构函数无法被调用\n\
  26:\n27:     // 使用静态成员进行释放内存\n28:     MonsterDB::DestroyInstance(pMyDatabase);\n\
  29:\n30:     return 0;\n31: }\n```\n\n该代码段没有输出。\n\n### 分析\n\n这段代码的目的是演示如何通过 `private`\
  \ 析构函数（如第 6 行所示）和静态函数 `DestroyInstance()`（如第 9–13 行所示）来编写一个禁止在栈上创建的类。\n\n## this\
  \ 指针\n\nC++ 中的一个重要概念，`this` 是一个保留关键字，适用于类作用范围内，它包含对象的地址。换句话说，`this` 的值是 `&object`。在类成员内部，当你调用另一个成员时，编译器会将\
  \ `this` 指针作为一个隐式的、不可见的参数传递过去：\n\n```cpp\nclass Human\n{\nprivate:\n// ... 私有声明\n\
  \   void Talk (string Statement)\n   {\n     cout << Statement;\n   }\npublic:\n\
  \   void Introduce()\n   {\n     Talk(\"Bla\");\n   }\n};\n```\n\n你在这里看到的是 `Introduce()`\
  \ 方法使用私有成员 `Talk()` 在屏幕上打印语句。实际上，编译器在调用 `Talk` 时嵌入了 `this` 指针，它的调用方式是 `Talk(this,\
  \ \"Bla\")`。\n\n从编程的角度来看，`this` 并没有很多应用，除非在那些通常是可选的场景。例如，在 `SetAge()` 中访问 `Age`\
  \ 可以有如下变体：\n\n```cpp\nvoid SetAge(int HumansAge)\n{\n   this->Age = HumansAge; //\
  \ 等于 Age\n```\n\n### 注意\n\n注意 `this` 指针不会传递给声明为 `static` 的类方法，因为静态函数不连接到实例。如果你想在静态函数中使用实例变量，必须显式声明一个让调用者传递\
  \ `this` 指针的参数。\n\n## sizeof 类\n\n你已经学习了使用 `class` 关键字定义自己的类型，这允许你封装数据属性和操作这些数据的方法。`sizeof()`\
  \ 运算符在第 3 节 中介绍，用于确定特定类型的内存需求（单位为字节）。该运算符也适用于类，它基本上报告类定义内部每个属性占用的字节数。取决于你使用的编译器，`sizeof()`\
  \ 可能会包含某些属性边界的填充。注意，成员函数及其局部变量对定义类的 `sizeof()` 不起作用。\n\n列表 9.12. 对类及其实例使用 sizeof\
  \ 的结果\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class MyString\n\
  4: {\n5: private:\n6:     char* Buffer;\n7:\n8: public:\n9:     // 构造函数\n10:   \
  \  MyString(const char* InitialInput)\n11:     {\n12:         if(InitialInput !=\
  \ NULL)\n13:         {\n14:             Buffer = new char [strlen(InitialInput)\
  \ + 1];\n15:             strcpy(Buffer, InitialInput);\n16:         }\n17:     \
  \    else\n18:             Buffer = NULL;\n19:     }\n20:\n21:     // 拷贝构造函数\n22:\
  \     MyString(const MyString& CopySource)\n23:     {\n24:         if(CopySource.Buffer\
  \ != NULL)\n25:         {\n26:             Buffer = new char [strlen(CopySource.Buffer)\
  \ + 1];\n27:             strcpy(Buffer, CopySource.Buffer);\n28:         }\n29:\
  \         else\n30:             Buffer = NULL;\n31:     }\n32:\n33:     ~MyString()\n\
  34:     {\n35:         if (Buffer != NULL)\n36:             delete [] Buffer;\n\
  37:     }\n38:\n```\n\n\n\n***\n\n***\n\n### 输出\n\n点击此处查看代码图像\n\n通过友类访问私有成员： 25\n\
  \n***\n\n***\n\n### 分析\n\n第 10 行将 `Utility` 类声明为 `Human` 类的友类。这意味着 `Utility` 类中的所有方法都可以访问\
  \ `Human` 的私有成员。与函数一样，外部类也可以被声明为友元。\n\n\n\n\n## **A.** 基本上没有。当你实例化一个类时，你会得到一个实例，它也可以称为对象。\n\
  \n## **Q.** 访问成员的更好方法是什么：使用点运算符（`.`）还是使用指针运算符（`->`）？\n\n## **A.** 如果你有一个对象的指针，那么指针运算符（`->`）最合适。如果你在栈上作为局部变量实例化了一个对象，那么点运算符（`.`）最合适。\n\
  \n## **Q.** 我应该总是编写拷贝构造函数吗？\n\n## **A.** 如果你类的数据成员是编写良好的智能指针、字符串类或诸如 `std::vector`\
  \ 等 STL 容器，那么编译器插入的默认拷贝构造函数会确保调用各自的拷贝构造函数。然而，如果你的类有原始指针成员（例如，用于动态数组的 `int*` 而不是\
  \ `std::vector<int>`），你需要提供一个编写正确的拷贝构造函数，以确保在按值传递该类对象并进行函数调用时，能够对数组进行深拷贝。\n\n##\
  \ **Q.** 我的类只定义了一个带有默认参数的构造函数。这仍然是默认构造函数吗？\n\n## **A.** 是的。如果一个类的实例可以在没有参数的情况下创建，那么该类被称为具有默认构造函数。一个类只能有一个默认构造函数。\n\
  \n## **Q.** 为什么本中的某些示例使用 `SetAge()` 等函数来设置整数 `Human::Age`？为什么不将 `Age` 设公共并根据需要赋值呢？\n\
  \n## **A.** 从技术角度来看，将 `Human::Age` 变为 `public` 成员同样可行。但从设计角度来看，保持成员数据为私有是一个好主意。诸如\
  \ `GetAge()` 或 `SetAge()` 等访问器函数是访问这些私有数据的更精细且可扩展的方法，允许你在设置或重置 `Human::Age` 的值之前对实例进行错误检查。\n\
  \n## **Q.** 为什么拷贝构造函数的参数是通过引用接收拷贝源的？\n\n## **A.** 首先，编译器期望拷贝构造函数是这样的。其背后的原因是，如果拷贝构造函数按值接收拷贝源，它将调用自己，导致无限的拷贝循环。\n\
  \n### 工作坊 (Workshop)\n\n工作坊提供了测验题来帮助你巩固对所涵盖内容的理解，并提供了练习来提供使用所学知识的经验。尝试在检查附录 D 中的答案之前回答测验和练习题，并在继续下一节之前确保你了答案。\n\
  \n#### 测验 (Quiz)\n\n**1.** 当我使用 `new` 创建类实例时，类是在哪里创建的？\n\n**2.** 我的类有一个原始指针 `int*`，其中包含一个动态分配的整数数组。`sizeof`\
  \ 会根据动态数组中整数的数量报告不同的大小吗？\n\n**3.** 我所有的类成员都是私有的，我的类没有包含任何声明的 `friend` 类或函数。谁可以访问这些成员？\n\
  \n**4.** 一个类方法可以调用另一个方法吗？\n\n**5.** 构造函数有什么用？\n\n**6.** 析构函数有什么用？\n\n#### 练习题 (Exercises)\n\
  \n**1.** **找错 (BUG BUSTERS):** 下面的 `class` 声明中有什么错误？\n\n```cpp\nclass Human\n{\n\
  \   int Age;\n   string Name;\npublic:\n   Human() {}\n}\n```\n\n**2.** 练习 1 中类的用户将如何访问成员\
  \ `Human::Age`？\n\n**3.** 写一个练习 1 中类的更好版本，在构造函数中使用初始化列表来初始化所有参数。\n\n**4.** 写一个 `class\
  \ Circle`，它根据实例化时作为参数传递给类的半径来计算面积和周长。Pi 应该包含在一个私有常量成员中，无法从圆的外部访问。\n\n## 第 10 节。实现继承\
  \ (Implementing Inheritance)\n\n面向对象编程基于四个重要方面：封装、抽象、继承、多态。继承是复用属性的强大方式，也是多态的基石。在本节中，你将了解到：\n\
  \n- 编程背景下的继承\n- C++ 的继承语法\n- `public`、`private` 和 `protected` 继承\n- 多重继承\n- 基类切割引起的问题\n\
  \n### 继承的基础 (Basics of Inheritance)\n\nSmith 从祖先那里继承的最主要是姓氏。此外，他还继承了父母共同教给他的使他成为\
  \ Smith 的价值观。在编程术语中，你经常面临管理组件具有相似属性但在细节或行为上存在细微差异的情况。解决此问题的方法是将每个组件制一个类，每个类都实现所有属性。另一种解决方案是使用继承，允许相似的类派生一个实现通用功能的基类，并通过覆盖该基功能来实现使每个类独特的行为。后者通常是首选方法如图\
  \ 10.1 所示。\n\n#### 继承与派生 (Inheritance and Derivation)\n\n图 10.1 显示了基类与其派生类之间的关系图。现在可能很难可视化基类或派生类是什么；尝试理解派生类继承自基类，并在这种意义上它也是基类。\n\
  \n> 派生类与其基类之间的“是一个”（is-a）关系仅适用于公共继承。本节从公共继承开始，以理解继承的概念和最常见的形式，然后转向 `private` 或 `protected`\
  \ 继承。\n\n表 10.1 展示了继承的更多示例。\n\n\n\n\n\n这些示例展示了，当你戴上面向对象编程的眼镜时，你会在周围的许多对象中看到继承的例子。`Fish`\
  \ 是 `Tuna` 的基类，因为 `Tuna` 像 `Carp` 一样都是 `Fish`，并具有所有鱼类的特征，例如冷血。然而，`Tuna` 在外表、游泳方式以及作为咸水鱼的特性上与\
  \ `Carp` 不同。因此，`Tuna` 和 `Carp` 从共同的基类 `Fish` 继承了共同特征，但又特化了基类属性来区分彼此。这在图 10.2 中所示。\n\
  \n![Image](img/10fig02.jpg)\n\n图 10.2 金枪鱼、鲤鱼和鱼之间的层级关系。\n\n鸭兽会游泳，但它是一种具有哺乳动物特征的特殊动物（如用奶喂养幼崽）、产卵（具有鸟类特征，以及由于有毒而具有爬行动物的特征。因此，可以想象一个\
  \ `class Platypus` 继承自两个基类 `class Mammal` 和 `class Bird`，以继承哺乳动物和鸟类的特征。这种继承形式被称为`多重继承`，将在本文稍后讨论。\n\
  \n### C++ 派生语法\n\n你如何从 `class Fish` 继承 `class Carp`，或者通地从 `class Base` 继承 `class\
  \ Derived`？实现此点的 C++ 语法如下：\n\n点击此处查看代码\n\n```cpp\n// 声明超类\nclass Base\n{\n   //\
  \ ... 基类成员\n};\n\n// 声明派生类\nclass Derived: access-specifier Base\n{\n   // ... 派生类成员\n\
  };\n```\n\n`access-specifier`（修饰符）可以是 `public`（最常用，用于“派生类是一个基类”的关系）、`private` 或\
  \ `protected`（用于“派生类拥有基类”的关系）。\n\n派生自 `class Fish` 的 `class Carp` 的继承层级表示如下：\n\n\
  点击此处查看代码\n\n```cpp\nclass Fish\n{\n  // ... Fish 的成员\n};\n\nclass Carp:public Fish\n\
  {\n// ... Carp 的成员\n};\n```\n\n派生自 `class Fish` 的 `class Carp` 和 `class Tuna` 的可编译声明如列表\
  \ 10.1 所示。\n\n***\n\n### 关于术语的说明\n\n在阅读继承的内容时，你会遇到诸如 `inherits from`（继承自）或 `derives\
  \ from`（派生自）等术语，它们的本质含义相同。\n\n同样，基类也称为`super class`超类。派生自基类的类也称为`derived class`派生类，也可以被称为`subclass`子类。\n\
  \n***\n\n### 列表 10.1 鱼类世界演示的简单继承层级\n\n点击此处查看代码\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Fish\n4: {\n5: public:\n6:     bool FreshWaterFish;\n\
  7:\n8:     void Swim()\n9:     {\n10:         if (FreshWaterFish)\n11:         \
  \    cout << \"Swims in lake\" << endl;\n12:         else\n13:             cout\
  \ << \"Swims in sea\" << endl;\n14:     }\n15: };\n16:\n17: class Tuna: public Fish\n\
  18: {\n19: public:\n20:     Tuna()\n21:     {\n22:         FreshWaterFish = false;\n\
  23:     }\n24: };\n25:\n26: class Carp: public Fish\n27: {\n28: public:\n29:   \
  \  Carp()\n30:     {\n31:         FreshWaterFish = true;\n32:     }\n33: };\n34:\n\
  35: int main()\n36: {\n37:     Carp myLunch;\n38:     Tuna myDinner;\n39:\n40: \
  \    cout << \"Getting my food to swim\" << endl;\n42:\n43:     cout << \"Lunch:\
  \ \";\n44:     myLunch.Swim();\n45:\n46:     cout << \"Dinner: \";\n47:     myDinner.Swim();\n\
  48:\n49:     return 0;\n50: }\n```\n\n***\n\n### 输出\n\n点击此处查看代码\nGetting my food\
  \ to swim\nLunch: Swims in lake\nDinner: Swims in sea\n\n***\n\n### 分析\n\n注意 `main()`\
  \ 中的第 37 行和 38 行分别创建了 `Carp` 和 `Tuna` 类的对象，分别为 `myLunch` 和 `myDinner`。第 43 行和 46\
  \ 行是我通过调用它们似乎支持的 `Swim()` 方法让午餐和晚餐游泳。现在，看第 17-24 行的 `Tuna` 类定义和第 26-33 行的 `Carp`\
  \ 类定义。如你所示，这些类非常紧凑，且其中任何类都没有定义你在 `main()` 中调用的 `Swim()` 方法。显然，`Swim()` 来自于它们继承的\
  \ `Fish`。由于 `Fish` 声明了公共方法 `Swim()`，继承自 `Fish`（通过第 17 行和 26 行所示的公共继承）的类 `Tuna` 和\
  \ `Carp` 自动暴露了类方法 `Swim()`。注意 `Carp` 和 `Tuna` 的构造函数是如何初始化基类 `FreshWaterFish` 的，这对决定\
  \ `Fish::Swim()` 的输出起到了作用。\n\n### 访问修饰符关键字\n\n列表 10.1 中，`class Fish` 有一个公共属性 `FreshWaterFish`，它由派生类\
  \ `Tuna` 和 `Carp` 设置，以自定义（也称为特化）`Fish` 的行为并使其分别适应咸水和淡水。然而，列表 10.1 显示了一个严重的缺陷：如果你愿意，甚至\
  \ `main()` 也可以通过简单的代码行来篡改这个标记为 `public` 的标记，从而在 `class Fish` 外部进行操作：\n\n点击此处查看代码\n\
  myDinner.FreshWaterFish = true; // 让金枪鱼变成淡水鱼这显然是需要避免的。你需要的是一种可能性，让基类的属性仅对派生类可见，而对\
  \ `main()` 不可见。这就是 `protected` 关键字的帮助。\n\n***\n\n`protected` 与 `public` 和 `private`\
  \ 一样也是访问修饰符。当你将一个属性声明为 `protected` 时，你实际上使该属性对派生类和朋友可见，但对包括 `main()` 在内的其他人不可见。\n\
  \n***\n\n如果你希望基类的某个属性对派生类可见，你应该使用 `protected` 修饰符，如列表 10.2 所示。\n\n### 列表 10.2 使用\
  \ protected 关键字向派生类暴露成员的 Fish 类\n\n点击此处查看代码\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Fish\n4: {\n5: protected:\n6:     bool FreshWaterFish;\
  \ // 对派生类可见\n7:\n8: public:\n9:     void Swim()\n10:     {\n11:         if (FreshWaterFish)\n\
  12:             cout << \"Swims in lake\" << endl;\n13:         else\n14:      \
  \       cout << \"Swims in sea\" << endl;\n15:     }\n16: };\n17:\n18: class Tuna:\
  \ public Fish\n19: {\n20: public:\n21:     Tuna()\n22:     {\n23:         FreshWaterFish\
  \ = false; // 设置基类保护成员\n24:     }\n25: };\n26:\n27: class Carp: public Fish\n28:\
  \ {\n29: public:\n30:     Carp()\n31:     {\n32:         FreshWaterFish = false;\n\
  33:     }\n34: };\n35:\n36: int main()\n37: {\n38:     Carp myLunch;\n39:     Tuna\
  \ myDinner;\n40:\n41:     cout << \"Getting my food to swim\" << endl;\n42:\n43:\
  \     cout << \"Lunch: \";\n44:     myLunch.Swim();\n45:\n46:     cout << \"Dinner:\
  \ \";\n47:     myDinner.Swim();\n48:\n49:     // 注销下面这一行以查看保护成员\n50:     // 在类层级外部不可访问\n\
  51:     // myLunch.FreshWaterFish = false;\n52:\n53:     return 0;\n54: }\n```\n\
  \n\n\n\n\n尽管列表 10.2 的输出与列表 10.1 相同，但第 3–19 行定义的 `class Fish` 发生了许多根本性的变化。第一个最明显的变化是布尔成员\
  \ `Fish::FreshWaterFish` 现在是一个 `protected` 属性，因此无法如第 51 行所示通过 `main()` 访问（取消注释以查看编译器错误）。尽管如此，带有访问修饰符\
  \ `protected` 的参数可以从派生类 `Tuna` 和 `Carp` 访问，如第 23 行和 32 行所示。这个小程序有效地演示了使用关键字 `protected`\
  \ 的作用，它可以确保需要继承的基类属性不会被类层次结构之外访问。\n\n这是面向对象编程中一个非常重要的方面，它结合了数据抽象和继承，确保了派生类可以安全地继承基类属性，而这些属性不会被该层次系统之外的任何人篡改。\n\
  \n***\n\n### 基类初始化——向基类传递参数\n\n如果基类包含一个重载构造函数，并在实例化时强制要求参数会怎样？当在构造派生类时，这种基类是如何实例化的呢？线索在于使用初始化列表，并通过派生类的构造函数调用适当的基类构造函数，如下所示：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Base\n{\npublic:\n   Base(int SomeNumber) // 重载构造函数\n\
  \   {\n      // 对 SomeNumber 做什么\n   }\n};\n\nClass Derived: public Base\n{\npublic:\n\
  \   Derived(): Base(25)  // 使用参数 25 实例化类 Base\n   {\n      // 派生类构造函数代码\n   }\n\
  };\n```\n\n这种机制在 `class Fish` 中非常有用，其中通过向 `Fish` 的构造函数提供一个布尔输入参数来初始化 `Fish::FreshWaterFish`，基类\
  \ `class Fish` 可以确保每个派生类都必须说明 `Fish` 是淡水鱼还是海水鱼，如列表 10.3 所示。\n\n列表 10.3. 使用初始化列表的派生类构造函数\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ class Fish\n4: {\n5: protected:\n6:     bool FreshWaterFish; // 仅对派生类可见\n7:\n\
  8: public:\n9:     // Fish 构造函数\n10:     Fish(bool IsFreshWater) : FreshWaterFish(IsFreshWater){}\n\
  11:\n12:     void Swim()\n13:     {\n14:         if (FreshWaterFish)\n15:      \
  \       cout << \"Swims in lake\" << endl;\n16:         else\n17:             cout\
  \ << \"Swims in sea\" << endl;\n18:     }\n19: };\n20:\n21: class Tuna: public Fish\n\
  22: {\n23: public:\n24:     Tuna(): Fish(false) {}\n25: };\n26:\n27: class Carp:\
  \ public Fish\n28: {\n29: public:\n30:     Carp(): Fish(true) {}\n31: };\n32:\n\
  33: int main()\n34: {\n35:     Carp myLunch;\n36:     Tuna myDinner;\n37:\n38: \
  \    cout << \"Getting my food to swim\" << endl;\n39:\n40:     cout << \"Lunch:\
  \ \";\n41:     myLunch.Swim();\n42:\n43:     cout << \"Dinner: \";\n44:     myDinner.Swim();\n\
  45:\n46:     // 取消注释第 48 行以查看保护成员\n47:     // 从类层次结构外部访问\n48:     // myLunch.FreshWaterFish\
  \ = false;\n49:\n50:     return 0;\n51: }\n```\n\n***\n\n### 输出\n点击此处查看代码图像\nGetting\
  \ my food to swim\nLunch: Swims in lake\nDinner: Swims in sea\n\n***\n\n### 分析\n\
  `Fish` 现在有了一个接收参数以初始化 `Fish::FreshWaterFish` 的构造函数。因此，创建 `Fish` 对象的唯一可能是通过提供参数来实现。通过这样，`class\
  \ Fish` 确保了如果派生类忘记设置它，保护成员就不会包含随机值。派生类 `Tuna` 和 `Carp` 现在被强制定义一个构造函数，用正确的参数（true\
  \ 或 false）来实例化基类 `Fish`，如第 24 行和 30 行所示。\n\n***\n\n### 注意事项\n在列表 10.3 中，你会看到尽管布尔变量\
  \ `Fish::FreshWaterFish` 是一个 `protected` 成员，但派生类从未访问过它，因为该变量是通过 `Fish` 的构造函数设置的。为了确保最大的安全性，如果派生类不需要访问基类属性，请记住将属性标记为\
  \ `private`。\n\n***\n\n#### 派生类重写基类方法\n如果 `class Derived` 实现与与其继承的 `class Base`\
  \ 相同的函数、相同的返回值和签名，它就有效地重写了 `class Base` 中的该方法，如下所示：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ Base\n{\npublic:\n   void DoSomething()\n   {\n      // 实现代码... something\n  \
  \ }\n};\n\nclass Derived:public Base\n{\npublic:\n   void DoSomething()\n   {\n\
  \      // 实现代码... something\n   }\n};\n```\n\n因此，如果使用 `Derived` 的实例调用方法 `DoSomething()`，它将不会调用\
  \ `class Base` 中的功能。如果 `Tuna` 和 `Carp` 实现它们自己的 `Swim()` 方法，而该方法也存在于基类 `Fish::Swim()`\
  \ 中，那么在下文列表 10.3 节选的 `main()` 函数中调用 `Swim`：\n\n```cpp\n36:   Tuna myDinner;\n//\
  \ ...其他行\n44:   myDinner.Swim();\n```\n将导致本地的 `Tuna::Swim()` 被调用，这本质上重写了基类的 `Fish::Swim()`\
  \ 方法。这由列表 10.4 所示。\n\n列表 10.4. 派生类 Tuna 和 Carp 重写基类中的 Swim()\n\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: class Fish\n4: {\n5: private:\n\
  6:     bool FreshWaterFish;\n7:\n8: public:\n9:     // Fish 构造函数\n10:     Fish(bool\
  \ IsFreshWater) : FreshWaterFish(IsFreshWater){}\n11:\n12:     void Swim()\n13:\
  \     {\n14:         if (FreshWaterFish)\n15:             cout << \"Swims in lake\"\
  \ << endl;\n16:         else\n17:             cout << \"Swims in sea\" << endl;\n\
  18:     }\n19: };\n20:\n21: class Tuna: public Fish\n22: {\n23: public:\n24:   \
  \  Tuna(): Fish(false) {}\n25:\n26:     void Swim()\n27:     {\n28:         cout\
  \ << \"Tuna swims real fast\" << endl;\n29:     }\n30: };\n31:\n32: class Carp:\
  \ public Fish\n33: {\n34: public:\n35:     Carp(): Fish(true) {}\n36:\n37:     void\
  \ Swim()\n38:     {\n39:         cout << \"Carp swims real slow\" << endl;\n40:\
  \     }\n41: };\n42:\n43: int main()\n44: {\n45:     Carp myLunch;\n46:     Tuna\
  \ myDinner;\n47:\n48:     cout << \"Getting my food to swim\" << endl;\n49:\n50:\
  \     cout << \"Lunch: \";\n51:     myLunch.Swim();\n52:\n53:     cout << \"Dinner:\
  \ \";\n54:     myDinner.Swim();\n55:\n56:     return 0;\n57: }\n```\n\n\n\n\n在列表\
  \ 10.4 中，你看到了一个派生类 `class Tuna` 通过实现相同版本的函数来重写 `Fish` 中 `Swim()` 函数的示例。本质上：\n\n\
  点击此处查看代码图像\n\n```cpp\nTuna myDinner;\n\nmyDinner.Swim(); // 将调用 Tuna::Swim()\n```\n\
  \n如果你想在 `main()` 中通过列表 10.4 调用 `Fish::Swim()`，你需要在以下语法中使用作用域解析运算符（`::`）：\n\n点击此处查看代码图像\n\
  \n```cpp\nmyDinner.Fish::Swim();  // 尽管是 Tuna，也会调用 Fish::Swim()\n```\n\n紧随其来的列表\
  \ 10.5 演示了如何使用派生类实例调用基类成员。\n\n### 在派生类中调用基类方法\n\n通常，`Fish::Swim()` 会包含一个通用的游泳实现，适用于所有鱼类，包括金枪鱼和鲤鱼。如果你在\
  \ `Tuna::Swim()` 和 `Carp::Swim()` 中的专门实现需要重用基类 `Fish::Swim()` 的通用实现，你可以像下面的代码所示使用作用域解析运算符（`::`）：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Carp: public Fish\n{\npublic:\n   Carp(): Fish(true)\
  \ {}\n   void Swim()\n   {\n      cout << \"Carp swims real slow\" << endl;\n  \
  \    Fish::Swim();  // 使用作用域解析运算符::\n   }\n};\n```\n\n这在列表 10.5 中得到了演示。\n\n列表 10.5.\
  \ 使用作用域解析运算符 (::) 从派生类方法和 main() 中调用基类方法\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: class Fish\n4: {\n5: private:\n6:     bool FreshWaterFish;\n\
  7:\n8: public:\n9:     // Fish 构造函数\n10:     Fish(bool IsFreshWater) : FreshWaterFish(IsFreshWater){}\n\
  11:\n12:     void Swim()\n13:     {\n14:         if (FreshWaterFish)\n15:      \
  \       cout << \"Swims in lake\" << endl;\n16:         else\n17:             cout\
  \ << \"Swims in sea\" << endl;\n18:     }\n19: };\n20:\n21: class Tuna: public Fish\n\
  22: {\n23: public:\n24:     Tuna(): Fish(false) {}\n25:\n26:     void Swim()\n27:\
  \     {\n28:         cout << \"Tuna swims real fast\" << endl;\n29:     }\n30: };\n\
  31:\n32: class Carp: public Fish\n33: {\n34: public:\n35:     Carp(): Fish(true)\
  \ {}\n36:\n37:     void Swim()\n38:     {\n39:         cout << \"Carp swims real\
  \ slow\" << endl;\n40:         Fish::Swim();\n41:     }\n42: };\n43:\n44: int main()\n\
  45: {\n46:     Carp myLunch;\n47:     Tuna myDinner;\n48:\n49:     cout << \"Getting\
  \ my food to swim\" << endl;\n50:\n51:     cout << \"Lunch: \";\n52:     myLunch.Swim();\n\
