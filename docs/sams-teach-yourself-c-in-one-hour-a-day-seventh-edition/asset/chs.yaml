  \n## 3. 为你的 `class Date` 定义移动构造函数和移动赋值运算符有意义吗？\n\n#### 练习\n\n#### 1. 为类 `Date` 编写一个转换运算符，将它持有的日期转换为一个唯一的整数。\n\
  \n#### 2. 为 `class DynIntegers` 编写一个移动构造函数和移动赋值运算符，该类以私有成员 `int*` 的形式封装了一个动态分配的数组。\n\
  \n## 第 13 节 强制转换运算符\n\n强制转换（Casting）是一种机制，程序员可以通过它临时或永久地改变编译器对对象的解释。注意，这并不意味着程序员改变了对象本身——他只是改变了对对象的解释。改变对象解释的运算符被称为\
  \ `强制转换运算符`。\n\n在本节中，你将学习：\n\n- 强制转换运算符的必要性\n- 为什么某些 C++ 程序员不喜欢 C 风格转换\n- 四种 C++\
  \ 强制转换运算符\n- 向上转换（upcasting）和向下转换（downcasting）的概念\n- 为什么 C++ 强制转换运算符并非一直受欢迎\n\n\
  ### 强制转换的必要性\n\n在一个由编写良好的 C++ 应用程序组成的完美类型安全且强类型的世界中，不需要强制转换和强制转换运算符。然而，我们生活在一个现实世界，由许多不同的人和供应商编写、经常使用不同环境的模块必须共同工作。为了实现这一点，编译器经常需要被指示以特定的方式解释数据，使其通过编译并让应用程序正常运行。\n\
  \n来看一个现实世界的例子：尽管某些 C++ 编译器可能支持 `bool` 作为原生类型，但仍在使用许多年前用 C 语言编写的库。这些为 C 编译器设计的库必须依赖使用整数类型来存储布尔数据。因此，在这些编译器上，`bool`类似于：\n\
  \n```cpp\ntypedef unsigned short BOOL;\n```\n\n返回布尔数据的函数声明如下：\n\n```cpp\nBOOL IsX\
  \ ();\n```\n\n现在，如果要在用最新版本 C++ 编译器编写的新应用程序中使用此类库，程序员必须找到一种方法，让 C++ 编译器理解的 `bool`\
  \ 数据类型与库理解的 `BOOL` 数据类型保持一致。实现这一目标的方法是使用强制转换：\n\n点击此处查看代码图像\n\n```cpp\nbool bCPPResult\
  \ = (bool)IsX ();     // C 风格转换\n```\n\nC++ 的演进看到了了新的 C++ 强制转换运算符的出现，这在 C++ 编程社区中引起了分裂：一组在\
  \ C++ 程序中继续使用 C 风格转换，另一组则虔诚地转换为 C++ 编译器引入的强制转换关键字。前一组的观点是，C++ 转换使用起来很繁琐，有时功能上的差异微乎其微，以至于仅具有理论价值。后一组（显然由\
  \ C++ 语法纯主义者组成）通过指出 C 风格转换的缺陷来支持自己的论点。\n\n由于现实世界中同时存在这两种代码，最好简单阅读一下本节，了解每种风格的优缺点，并形成你自己的观点。\n\
  \n### 为什么 C 风格转换不受某些 C++ 程序员的欢迎\n\n类型安全是 C++ 程序员在赞美这种编程语言特性时信奉的格言之一。事实上，大多数 C++\
  \ 编译器甚至不会让你逃过这种错误：\n\n点击此处查看代码图像\n\n```cpp\nchar* pszString = \"Hello World!\";\n\
  int* pBuf = pszString;   // error：无法将 char* 转换为 int*\n```\n\n而且这完全合理！\n\n现在，C++\
  \ 编译器仍然认为需要向下兼容以保持旧代码和遗留代码的编译，因此允许如下语法：\n\n点击此处查看代码图像\n\n```cpp\nint* pBuf = (int*)pszString;\
  \ // 解决了一个问题，又制造了另一个\n```\n\n然而，C 风格转换实际上强迫编译器将目标解释为程序员方便选择的类型——在这种情况下，该程序员根本没有去想编译器最初报告错误是有缘故的，而是简单地堵嘴了编译器并强迫它服从。这显然不被那些看到自己的类型安全因这种强行通过任何内容的转换而受到损害的\
  \ C++ 程序员所接受。\n\n### C++ 强制转换运算符\n\n尽管强制转换有缺点，强制转换本身的概念无法丢弃。在许多情况下，强制转换是解决重要兼容性问题的合法需求。C++\
  \ 额外提供了一种专门用于继承场景的强制转换运算符，这在 C 语言中是不存在的。\n\n四种 C++ 强制转换运算符是：\n\n- `static_cast`\n\
  - `dynamic_cast`\n- `reinterpret_cast`\n- `const_cast`\n\n强制转换运算符的使用语法是一致的：\n\n\
  点击此处查看代码图像\n\n```cpp\ndestination_type result = cast_type <destination_type> (object_to_be_casted);\n\
  ```\n\n#### 使用 static_cast\n\n`static_cast` 是一种用于在相关类型之间转换指针的机制，并执行显式类型转换。在许多情况下，`static_cast`\
  \ 可用于原本会自动发生的类型。对于指针来说，`static_cast` 实现了基本的编译时检查，确保指针是相关的。使用 `static_cast` 可以指针向上转换为基类类型，也可以向下转换到派生类型，如下代码示例所示。\n\
  \n点击此处查看代码图像\n\n```cpp\nBase* pBase = new Derived (); //构造 Derived 对象\nDerived*\
  \ pDerived = static_cast<Derived*>(pBase); // 允许！\n\n// CUnrelated 与 Base 没有继承关系\n\
  CUnrelated* pUnrelated = static_cast<CUnrelated*>(pBase); // 上述转换不允许\n```\n\n###\
  \ 注意\n\n将 `Derived*` 转换为 `Base*` 是向上转换，无需任何显式运算符即可：\n\n点击此处查看代码图像\n\n```cpp\nDerived\
  \ objDerived;\nBase* pBase = &objDerived; // 允许！\n```\n\n将 `Base*` 转换为 `Derived*`\
  \ 是向下转换，在不使用显式运算符的情况下无法完成：\n\n点击此处查看代码图像\n\n```cpp\nDerived objDerived;\nBase* pBase\
  \ = &objDerived; // 向上转换 -> 允许！\nDerived* pDerived = pBase; // 错误：向下转换需要显式转换\n```\n\
  \n#### 重要注意\n\n然而，注意 `static_cast` 仅验证指针类型是相关的。它不执行任何 `运行时检查`。因此，通过 `static_cast`，程序员仍然可能犯下错误：\n\
  \n点击此处查看代码图像\n\n```cpp\nBase* pBase = new Base ();\nDerived* pDerived = static_cast<Derived*>(pBase);\
  \ // 仍然报错！\n```\n\n在这里，`pDerived` 实际上指向一个部分的 `Derived` 对象，因为所指向的对象实际上是 `Base()`\
  \ 类型。由于 `static_cast` 只执行验证问题类型是否相关的编译时检查，而不执行运行时检查，调用 `pDerived->SomeDerivedClassFunction()`\
  \ 可以编译，但在运行时可能会导致意料之外的行为。\n\n除了帮助向上转换或向下转换外，`static_cast` 在许多情况下可以帮助将隐式转换变为显式，并引起程序员或读者的注意：\n\
  \n点击此处查看代码图像\n\n```cpp\ndouble dPi = 3.14159265;\nint Num = static_cast<int>(dPi);\
  \ // 将原本隐式的转换变为显式\n```\n\n\n\n\n在之前的代码中，`Num = dPi` 同样同样有效，且效果相同。然而，使用 `static_cast`\
  \ 可以让读者注意这种转换的本质，并指示（对于了解 `static_cast` 的人）编译器已经根据编译时可用的信息执行了必要的调整，以完成所需的类型转换。\n\
  \n### 使用 dynamic_cast 和运行时类型识别\n\n动态转换（Dynamic casting）正如其名所示，是静态转换的对面，它实际上在运行时执行转换——即在应用程序执行时进行转换。可以通过检查\
  \ `dynamic_cast` 操作的结果来判断转换尝试是否成功。`dynamic_cast` 运算符的典型用法语法如下：\n\n点击此处查看代码图像\n\n\
  ```cpp\ndestination_type* pDest = dynamic_cast <class_type*> (pSource);\n\nif (pDest)\
  \    // 在使用指针之前检查转换操作是否成功\n    pDest->CallFunc ();\n```\n\n例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\nBase* pBase = new Derived();\n\n// 执行下投（downcast）\n\nDerived* pDerived =\
  \ dynamic_cast <Derived*> (pBase);\n\nif (pDerived)    // 检查转换是否成功\n    pDerived->CallDerivedClassFunction\
  \ ();\n```\n\n如前面的简短示例所示，给定一个指向基类对象的指针，程序员可以使用 `dynamic_cast` 在继续使用该指针之前，验证所指向的目标对象的类型。注意，在代码段中，明显看出目标对象是\
  \ `Derived` 类型。因此，该示例仅具有演示价值。然而，并非总是如此——例如，当将 `Derived*` 类型的指针传递给一个接受 `Base*` 类型的函数时。在给定基类指针类型的情况下，函数可以使用\
  \ `dynamic_cast` 来检测类型，然后执行特定于检测出的类型的操作。因此，`dynamic_cast` 有助于在运行时确定类型，并在安全时使用转换后的指针。参见列表\
  \ 13.1，该列表使用了与基类 `class Fish` 相关的熟悉的 `class Tuna` 和 `class Carp` 层次结构，其中函数 `DetectFishType()`\
  \ 动态检测 `Fish*` 是 `Tuna*` 还是 `Carp*`。\n\n***\n\n### 注意\n\n因此，这种在运行时识别对象类型的机制被称为运行时类型识别（runtime\
  \ type identification）或 `RTTI`。\n\n***\n\n列表 13.1. 使用动态转换判断鱼类对象是金枪还是鲤鱼\n\n点击此处查看代码图像\n\
  \n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class Fish\n\
  4: {\n5: public:\n6:     virtual void Swim()\n7:     {\n8:         cout << \"Fish\
  \ swims in water\" << endl;\n9:     }\n10:\n11:     // 基类应该始终有虚析构函数\n12:     virtual\
  \ ~Fish() {}\n13: };\n14:\n15: class Tuna: public Fish\n16: {\n17: public:\n18:\
  \     void Swim()\n19:     {\n20:         cout << \"Tuna swims real fast in the\
  \ sea\" << endl;\n21:     }\n22:\n23:     void BecomeDinner()\n24:     {\n25:  \
  \       cout << \"Tuna became dinner in Sushi\" << endl;\n26:     }\n27: };\n28:\n\
  29: class Carp: public Fish\n30: {\n31: public:\n32:     void Swim()\n33:     {\n\
  34:         cout << \"Carp swims real slow in the lake\" << endl;\n35:     }\n36:\n\
  37:     void Talk()\n38:     {\n39:         cout << \"Carp talked crap\" << endl;\n\
  40:     }\n41: };\n42:\n43: void DetectFishType(Fish* InputFish)\n44: {\n45:   \
  \  Tuna* pIsTuna = dynamic_cast <Tuna*>(InputFish);\n46:     if (pIsTuna)\n47: \
  \    {\n48:         cout << \"Detected Tuna. Making dinner: \" << endl;\n49:   \
  \      pIsTuna->BecomeDinner(); // 调用 Tuna::BecomeDinner\n50:     }\n51:\n52:  \
  \   Carp* pIsCarp = dynamic_cast <Carp*>(InputFish);\n53:     if(pIsCarp)\n54: \
  \    {\n55:         cout << \"Detected Carp. Making talk: \" << endl;\n56:     \
  \    pIsCarp->Talk(); // 调用 Carp::Talk\n57:     }\n58:\n59:     cout << \"Verifying\
  \ type using Fish::Swim: \" << endl;\n60:     InputFish->Swim(); // 调用虚函数\n61: }\n\
  62: int main()\n63: {\n64:     Carp myLunch;\n65:     Tuna myDinner;\n66:\n67: \
  \    DetectFishType(&myDinner);\n68:     cout << endl;\n69:     DetectFishType(&myLunch);\n\
  70:\n71:     return 0;\n72: }\n```\n\n***\n\n 输出\n\n点击此处查看代码图像\n\n```\nDetected\
  \ Tuna. Making dinner:\nTuna became dinner in Sushi\nVerifying type using Fish::Swim:\n\
  Tuna swims real fast in the sea\nDetected Carp. Making talk:\nCarp talked crap\n\
  Verifying type using Fish::Swim:\nCarp swims real slow in the lake\n```\n\n***\n\
  \n### 分析\n\n这是关于 `Tuna` 和 `Carp` 的层次结构，正如第 10 节 中你所熟悉的 `Fish`。为了方便解释，不仅这两个派生类实现了虚函数\
  \ `Swim()`，而且它们还包含特定于类型的函数，即 `Tuna::BecomeDinner()` 和 `Carp::Talk()`。此示例的特殊之处在于，给定基类\
  \ `Fish*`，你能够动态检测它指向 `Tuna` 还是 `Carp`。由于没有其他 C++ 转换运算符允许这种转换，`dynamic_cast` 显式警告程序员正在发生潜在的不安全且不可移植的转换。\n\
  \n***\n\n### 注意\n\n`dynamic_cast` 操作的结果应该检查有效性。转换失败时它为 `NULL`。\n\n***\n\n### 使用\
  \ reinterpret_cast\n\n`reinterpret_cast` 是 C++ 转换运算符中最接近 C 风格转换的。它实际上允许将一种类型转换为另一种不相关的类型，无论它们是否相关；也就是说，它通过如下语法强制重新解释类型：\n\
  \n点击此处查看代码图像\n\n```cpp\nBase * pBase = new Base ();\nCUnrelated * pUnrelated = reinterpret_cast<CUnrelated*>(pBase);\n\
  // 上述代码并不是良好的编程，即使它可以通过编译！\n```\n\n这种转换实际上强制编译器接受了 `static_cast` 通常不允许的情况。它出现在某些底层应用程序中（例如驱动程序），在这些情况下，数据需要转换为\
  \ API 可以接受的简单类型（例如，某些 API 仅处理 `BYTE` 流；即 `unsigned char*`）：\n\n点击此处查看代码图像\n\n```cpp\n\
  SomeClass* pObject = new SomeClass ();\n// 需要作为字节流发送对象...\nunsigned char* pBytes\
  \ = reinterpret_cast <unsigned char*>(pObject);\n```\n\n前面的代码使用的转换并没有改变源对象的二进制表示，并且实际上欺骗了编译器，允许程序员查看\
  \ `SomeClass` 类型对象内部包含的单个字节。由于没有其他 C++ 转换运算符允许这种转换，`reinterpret_cast` 显式警告程序员正在发生潜在的不安全且不可移植的转换。\n\
  \n***\n\n### 注意\n\n尽可能，你应该在应用程序中避免使用 `reinterpret_cast`，因为它允许你指示编译器将类型 X 视为不相关的类型\
  \ Y，这看起来不像良好的设计或实现。\n\n***\n\n#### 使用 const_cast\n\n\n\n\n`const_cast` 允许你关闭对对象的\
  \ `const` 访问修符。如果你在疑惑为什么需要这种类型转换，那么你的想法可能是正确的。在程序员能够正确编写类的理想情况下，他们会记住在正确的地方频繁地使用\
  \ `const` 关键字。遗憾的是，现实世界的情况与此大相径庭，像下面这样的代码其实非常盛行：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ SomeClass\n{\npublic:\n    // ...\n    void DisplayMembers ();    // 一个显示函数本应是\
  \ const 的\n};\n```\n\n因此，当你编写一个如下所示的函数时：\n\n点击此处查看代码图像\n\n```cpp\nvoid DisplayAllData\
  \ (const SomeClass& mData)\n{\n    mData.DisplayMembers ();  // 编译失败\n    // 失败原因：使用\
  \ const 引用调用非 const 成员函数\n}\n```\n\n你将 `mData` 对象作为 `const` 引用传递显然是正确的。毕竟，显示函数应该是只读的，不应该允许调用非\
  \ `const` 成员函数——也就是说，不应该允许调用可以改变对象状态的函数。然而，`DisplayMembers()` 的实现本也应该是 `const` 的，遗憾的是它并不是。现在，只要\
  \ `SomeClass` 你且源代码由你控制，你就可以对 `DisplayMembers()` 进行修正性更改。但在许多情况下，它可能属于第三方库，无法对其进行更改。在这些情况下，`const_cast`\
  \ 就是你的救星。\n\n在何种场景下，调用 `DisplayMembers()` 的语法是：\n\n点击此处查看代码图像\n\n```cpp\nvoid DisplayAllData\
  \ (const SomeClass& mData)\n{\n    SomeClass& refData = const_cast <SomeClass&>(mData);\n\
  \    refData.DisplayMembers();    // 允许！\n}\n```\n\n注意，使用 `const_cast` 调用非 `const`\
  \ 函数应该是最后的手段。通常情况下，请记住使用 `const_cast` 修改 `const` 对象可能会导致未定义行为。\n\n同样注意，`const_cast`\
  \ 也可以用于指针：\n\n点击此处查看代码图像\n\n```cpp\nvoid DisplayAllData (const SomeClass* pData)\n\
  {\n    // pData->DisplayMembers(); 错误：尝试调用非 const 函数！\n    SomeClass* pCastedData\
  \ = const_cast <SomeClass*>(pData);\n    pCastedData->DisplayMembers();    // 允许！\n\
  }\n```\n\n### C++ 转换符的问题\n\n并不是所有人对所有的 C++ 转换符都感到满意——即使是那些深信 C++ 的人也是如此。他们的理由从语法繁琐、不直观到冗余不等。\n\
  \n让我们简单对比一下这段代码：\n\n点击此处查看代码图像\n\n```cpp\ndouble dPi = 3.14159265;\n// C++ 风格转换：static_cast\n\
  int Num = static_cast <int>(dPi);    // 结果：Num 是 3\n// C 风格转换\nint Num2 = (int)dPi;\
  \                // 结果：Num2 是 3\n// 将转换交给编译器\nint Num3 = dPi;                  \
  \    // 结果：Num3 是 3. 无错误！\n```\n\n在所有三种情况下，程序员都实现了相同的结果。在实际场景中，第二种方案可能是常见的，其次是第三种。很少有人会使用第一种。无论如何，编译器都足够智能可以正确转换此类类型。这使得转换语法给人一种让代码变得更难读的印象。\n\
  \n同样，`static_cast` 的其他用法通过 C 风格转换也能很好地处理，诚然 C 风格转换看起来更简单：\n\n点击此处查看代码图像\n\n```cpp\n\
  // 使用 static_cast\nDerived* pDerived = static_cast <Derived*>(pBase);\n// 但，这种效果同样好...\n\
  Derived* pDerivedSimple = (Derived*)pBase;\n```\n\n因此，使用 `static_cast` 的优势往往被其语法的笨拙所掩盖。Bjarne\
  \ Stroustrup 本人的话准确地描述了这种局面：“也许是因为 `static_cast` 是如此丑陋且输入起来相对困难，导致你在使用它之前可能多考虑两次？那是很好的，因为在现代\
  \ C++ 中，转换大部分情况下是可以避免的。”（参见 Bjarne Stroustrup 的 C++ 风格与技术 FAQ，见 [`www.research.att.com/~bs/bs_faq2.html`](http://www.research.att.com/~bs/bs_faq2.html)）\n\
  \n查看其他运算符，`reinterpret_cast` 用于在 `static_cast` 不起作用时强制通过；const_cast` 在修改 `const`\
  \ 访问修符方面也是如此。因此，除了 `dynamic_cast` 之外的 C++ 转换符在现代 C++ 应用中是可以避免的。只有在处理遗留应用程序的需求时，其他转换符才变得相关。在这些情况下，偏好\
  \ C 风格转换而非 C++ 转换符通常是一个品味问题。重要的是，尽可能避免转换，并且当你确实使用它时，你知道背后发生了什么。\n\n![图像](img/t036_01)\n\
  \n### 总结\n\n在本节中，你学习了不同的 C++ 转换符，以及使用它们的正反理由。\n\n### 问答\n\n问：使用 `const_cast` 修改\
  \ `const` 对象可以吗？\n答：通常会导致未定义行为。\n\n问：`const_cast` 可以用于指针吗？\n答：可以。\n\n问：使用 `const_cast`\
  \ 调用非 `const` 函数应该这样做吗？\n答：应该是最后的手段。\n\n问：我有一个 `const` 引用并尝试调用它的非 `const` 成员函数，编译失败了。这是为什么？\n\
  答：使用 const 引用调用非 const 成员函数。\n\n问：`DisplayMembers()` 本也应该是 `const` 的，但并不是。只要 `SomeClass`\
  \ 属于你且源代码由你控制，你就可以对 `DisplayMembers()` 进行修正性更改吗？\n答：在许多情况下，它可能属于第三方库，无法进行更改。在这些情况下，`const_cast`\
  \ 就是你的救星。\n\n问：在上述场景下，调用 `DisplayMembers()` 的语法是？\n答：见上文代码。\n\n问：我确定 `pBase` 指向的是\
  \ `Derived` 类型，我真的需要 `dynamic_cast` 吗？\n答：因为你确定指向的对象是 `Derived` 类型，你可以使用 `static_cast`\
  \ 来节省性能。\n\n问：为什么 C++ 提供了转换符，但却被建议尽可能少使用它们？\n答：就像你家里有止痛药，但不会因为有它就把它当作主食，对吧？只有在需要时才转换。\n\
  \n### 工作坊\n\n工作坊包含测试题以巩固你对涵盖内容的理解，并提供应用所学内容的练习。在查看附录 D 中的答案之前，请尝试回答测试和练习题，并在进入下一节之前确保理解答案。\n\
  \n#### 测试\n\n1. 你有一个基类对象指针 `pBase`。你会用什么转换符来确定它是 `Derived1` 类型还是 `Derived2` 类型？\n\
  2. 你有一个 `const` 引用并尝试调用它的非 `const` 成员函数，这是你编写的。编译器不允许这样做，因为涉及的函数不是 `const` 成员。你会修正该函数还是使用\
  \ `const_cast`？\n3. `reinterpret_cast` 只有在 `static_cast` 不起作用且转换已知是需要且安全的时才使用。对还是错？\n\
  4. 许多 `static_cast` 类型的转换（尤其是简单数据类型之间的转换）会被良好的 C++ 编译器自动完成，对吗？\n\n#### 练习\n\n1.\
  \ **找虫排除法：** 以下代码有什么问题？\n\n\n\n\n\n点击此处查看代码图片\n\n```cpp\nvoid DoSomething(Base*\
  \ pBase)\n{\n   Derived* pDerived = dynamic_cast <Derived*>(pBase);\n   pDerived->DerivedClassMethod();\n\
  }\n```\n\n2. 你有一个指针 `pFish*` 指向 `class Tuna` 的对象。\n\n点击此处查看代码图片\n\n```cpp\nFish*\
  \ pFish = new Tuna;\nTuna* pTuna = <what cast?>pFish;\n```\n\n你会使用哪种类型转换来获取指向该 `Tuna`\
  \ 类型对象的指针 `Tuna*`？请用代码演示。\n\n# 第 14 ：宏与模板简介\n\n到此时，你应该对基础 C++ 语法有了扎实的理解。用 C++ 编写的程序应该是易于理解的，并且已经准备好学习帮助你高效编写应用程序的语言特性。\n\
  \n在本节中，你将学习：\n\n- 预处理器简介\n- `#define` 关键字和宏\n- 模板简介\n- 如何编写模板函数和类\n- 宏与模板的区别\n-\
  \ C++11 如何使用 `static_assert` 帮助编译时检查\n\n### 预处理器与编译器\n\n在第 2  的“C++ 程序的结构”中，我们首先学习了预处理器。正如名称所示，预处理器是在编译器启动之前运行的。换句话说，预处理器实际上根据你提供的指令来决定哪些内容被编译。预处理器指令的特点是它们都以\
  \ `#` 号开头。例如：\n\n点击此处查看代码图片\n\n```cpp\n// 告诉预处理器在这里插入头文件 iostream 的内容\n#include\
  \ <iostream>\n\n// 定义一个宏常量\n#define ARRAY_LENGTH 25\nint MyNumbers[ARRAY_LENGTH];\
  \ // 25 个整数的数组\n\n// 定义一个宏函数\n#define SQUARE(x) ((x) * (x))\n\nint TwentyFive =\
  \ SQUARE(5);\n```\n\n本节重点关注上述代码段中看到的两种类型的预处理器指令；一个使用 `#define` 定义常量，另一个使用 `#define`\
  \ 定义宏函数。这两个指令无论扮演什么角色，实际上都告诉预处理器将宏的每个实例（`ARRAY_LENGTH` 或 `SQUARE`）替换为它们定义的值。\n\n\
  ***\n\n**注意**\n\n宏本质上也是文本替换。预处理器除了就位将标识符替换为另一个文本之外，没有执行任何智能操作。\n\n***\n\n### 使用\
  \ #define 宏定义常量\n\n使用 `#define` 组合常量的语法非常简单：\n\n点击此处查看代码图片\n\n```cpp\n#define identifier\
  \ value\n```\n\n例如，被替换为 25 的常量 `ARRAY_LENGTH` 将如下：\n\n点击此处查看代码图片\n\n```cpp\n#define\
  \ ARRAY_LENGTH 25\n```\n\n现在，每当预处理器遇到文本 `ARRAY_LENGTH` 时，该标识符就会被替换为 25：\n\n点击此处查看代码图片\n\
  \n```cpp\nint MyNumbers [ARRAY_LENGTH] = {0};\ndouble Radiuses [ARRAY_LENGTH] =\
  \ {0.0};\nstd::string Names [ARRAY_LENGTH];\n```\n\n预处理器运行后，这三者在编译器可见的形式如下：\n\n\
  点击此处查看代码图片\n\n```cpp\nint MyNumbers [25] = {0};  // 一个有 25 个整数的数组\ndouble Radiuses\
  \ [25] = {0.0};  // 一个有 25 个 double 的数组\nstd::string Names [25];  // 一个有 25 个 std::string\
  \ 的数组\n```\n\n这种替换适用于代码的每一个部分，包括像这样的 `for` 循环：\n\n点击此处查看代码图片\n\n```cpp\nfor(int\
  \ Index = 0; Index < ARRAY_LENGTH; ++Index)\n    MyNumbers[Index] = Index;\n```\n\
  \n这个 `for` 循环在编译器可见的形式为：\n\n点击此处查看代码图片\n\n```cpp\nfor(int Index = 0; Index < 25;\
  \ ++Index)\n    MyNumbers[Index] = Index;\n```\n\n要确切看到这种宏是如何工作的，请查看列表 14.1。\n\n\
  列表 14.1. 定义并使用常量的宏\n\n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include <iostream>\n1: #include<string>\n\
  2: using namespace std;\n3:\n4: #define ARRAY_LENGTH 25\n5: #define PI 3.1416\n\
  6: #define MY_DOUBLE double\n7: #define FAV_WHISKY \"Jack Daniels\"\n8:\n9: int\
  \ main()\n10: {\n11: int MyNumbers [ARRAY_LENGTH] = {0};\n12: double Radiuses[ARRAY_LENGTH]\
  \ = {0.0};\n13: string Names[ARRAY_LENGTH];\n14: for(int Index = 0; Index < ARRAY_LENGTH;\
  \ ++Index)\n15:     MyNumbers[Index] = Index;\n16: cout << \"Array size: \" << sizeof(MyNumbers)\
  \ << endl;\n17: cout << \"Radius size: \" << sizeof(Radiuses) << endl;\n18: cout\
  \ << \"Name size: \" << sizeof(Names) << endl;\n19: cout << \"PI: \" << PI << endl;\n\
  20: cout << \"Whisky: \" << FAV_WHISKY << endl;\n21: return 0;\n22: }\n```\n\n***\n\
  \n**输出**\n\n```text\nArray size: 100\nRadius size: 100\nName size: 320\nPI: 3.1416\n\
  Whisky: Jack Daniels\n```\n\n***\n\n**分析**\n\n输出显示 `sizeof` 是由编译器评估的。宏 `ARRAY_LENGTH`\
  \ 在编译器看到代码之前已经被替换为 `25`。预处理器并不知道 `sizeof` 是什么，它只是执行文本替换。\n\n***\n\n**提示**\n\n预处理器是一个简单的文本处理器。如果你定义了一个类似\
  \ `#define SQUARE(x) (x) * (x)` 的宏并调用 `SQUARE(1 + 2)`，它会展开为 `(1 + 2) * (1 + 2)`，结果是\
  \ `9` 而不是 `3`。这就是为什么括号在宏中至关重要。\n\n\n\n\n`header2.h` 看起来类似，但使用了不同的宏定义并包含了 `<header1.h>`：\n\
  \n点击此处查看代码图片\n\n```cpp\n#ifndef HEADER2_H_//多次包含保护\n\n#define HEADER2_H_\n\n#include\
  \ <header1.h>\n\nclass Class2\n{\n   // class members\n};\n\n#endif // end of header2.h\n\
  ```\n\n***\n\n### Note\n\n`#ifndef` 可以读作“如果未定义”（if-not-defined）。这是一个条件处理命令，指示预处理器仅在标识符未被定义时继续执行。\n\
  \n`#endif` 标记了预处理器该条件处理指令的结束。\n\n***\n\n因此，当预处理器在第一次运行时进入 `header1.h` 并遇到 `#ifndef`\
  \ 语句时，它注意到宏 `HEADER1_H_` 未被定义并继续执行。`#ifndef` 之后的第一行定义了宏 `HEADER1_H_`，确保了该文件的第二次预处理器运行会在包含\
  \ `#ifndef` 的第一行终止，因为该条件现在的评估结果为 `false`。`header2.h` 也是如此。这种简单的机制可以说是 C++ 编程世界中最频繁使用的基于宏的功能之一。\n\
  \n### 使用 #define 编写宏函数\n\n预处理器简单替换由宏识别的文本元素的能力，通常导致它被用于编写简单函数，例如：\n\n点击此处查看代码图片\n\
  \n```cpp\n#define SQUARE(x) ((x) * (x))\n```\n\n这有助于确定一个数字的平方。同样，一个计算圆面积的宏看起来如下：\n\
  \n点击此处查看代码图片\n\n```cpp\n#define PI 3.1416\n\n#define AREA_CIRCLE(r) (PI*(r)*(r))\n\
  ```\n\n宏函数通常用于此类非常简单的计算。它们在编译前进行内联展开，因此提供了类似于普通函数调用的优势，即这些内容在编译之前是内联展开的，因此在某些情况下有助于提高代码性能。列表\
  \ 14.2 展示了这些宏函数的使用。\n\n列表 14.2. 使用计算数字平方、圆面积以及两个数字最大最小值的宏函数\n\n点击此处查看代码图片\n\n***\n\
  \n```cpp\n0: #include <iostream>\n1: #include<string>\n2: using namespace std;\n\
  3:\n4: #define SQUARE(x) ((x) * (x))\n5: #define PI 3.1416\n6: #define AREA_CIRCLE(r)\
  \ (PI*(r)*(r))\n7: #define MAX(a, b) (((a) > (b)) ? (a) : (b))\n8: #define MIN(a,\
  \ b) (((a) < (b)) ? (a) : (b))\n9:\n10: int main()\n11: {\n12:     cout << \"Enter\
  \ an integer: \";\n13:     int Input1 = 0;\n14:     cin >> Input1;\n15:\n16:   \
  \  cout << \"SQUARE(\" << Input1 << \") = \" << SQUARE(Input1) << endl;\n17:   \
  \  cout << \"Area of a circle with radius \" << Input1 << \" is: \";\n18:     cout\
  \ << AREA_CIRCLE(Input1) << endl;\n19:\n20:     cout << \"Enter another integer:\
  \ \";\n21:     int Input2 = 0;\n22:     cin >> Input2;\n23:\n24:     cout << \"\
  MIN(\" << Input1 << \", \" << Input2 << \") = \";\n25:     cout << MIN (Input1,\
  \ Input2) << endl;\n26:\n27:     cout << \"MAX(\" << Input1 << \", \" << Input2\
  \ << \") = \";\n28:     cout << MAX (Input1, Input2) << endl;\n29:\n30:     return\
  \ 0;\n31: }\n```\n\n***\n\n***\n\n### 输出\n\n点击此处查看代码图片\n\n```text\nEnter an integer:\
  \ 36\nSQUARE(36) = 1296\nArea of a circle with radius 36 is: 4071.51\nEnter another\
  \ integer: -101\nMIN(36, -101) = -101\nMAX(36, -101) = 36\n```\n\n***\n\n***\n\n\
  ### 分析\n\n第 4 到 8 行包含了几个工具宏函数，用于返回数字的平方、圆面积以及两个数字的最大值最小值。注意第 6 行的 `AREA_CIRCLE`\
  \ 如何使用 `PI` 计算面积（等等，文中说是第 6 行，但在代码块中 `AREA_CIRCLE` 是第 6 行，`PI` 是第 5 行）。\n\n因此，当预处理器在第一次运行时进入\
  \ `header1.h` 并遇到 `#ifndef` 语句时，它注意到宏 `HEADER1_H_` 未被定义并继续执行。`#ifndef` 之后的第一行定义了宏\
  \ `HEADER1_H_`，确保了该文件的第二次预处理器运行会在包含 `#ifndef` 的第一行终止，因为该条件现在的评估结果为 `false`。`header2.h`\
  \ 也是如此。这种简单的机制可以说是 C++ 编程世界中最频繁使用的基于宏的功能之一。\n\n（注：由于提供的原文文本存在大量重复和碎片化内容，上述翻译已根据核心逻辑进行了整合，并确保格式清晰。）\n\
  \n\n\n因此，在 Microsoft Visual Studio 中实现的 `assert()` 允许你点击“重试”（Retry）按钮返回你的应用程序，并且调用栈会指示是哪一行通过了断言测试。这使得\
  \ `assert()` 成为一个非常实用的调试特性；例如，你可以使用 `assert` 来验证函数的输入参数。这是非常推荐的做法，并帮助你从长远上提高代码质量。\n\
  \n### 注意\n`assert()` 通常在发布（release）模式下被禁用，仅在大多数开发环境的调试构建中才会为你提供错误消息或信息。\n\n此外，某些环境将其实现为函数而不是宏。\n\
  \n### 警告\n由于 `assert` 不会包含在发布构建中，因此确保某些对应用程序运行至关重要的检查（例如 `dynamic_cast` 操作的返回值）仍然使用\
  \ `if` 语句进行是非常关重要的。`assert` 帮助你检测问题；它并不能替代代码中必要的指针检查。\n\n### 使用宏函数的优缺点\n宏允许你无论处理的变量类型是什么，都能复用某些实用函数。请再次考虑来自\
  \ Listing 14.2 的以下行：\n\n点击此处查看代码图像\n\n```cpp\n#define MIN(a, b) (((a) < (b)) ? (a)\
  \ : (b))\n```\n\n你可以在 `integers` 上使用这个宏函数 `MIN`：\n\n点击此处查看代码图像\n\n```cpp\ncout <<\
  \ MIN(25, 101) << endl;\n```\n\n但你也可以在 `double` 上复用同一个宏：\n\n点击此处查看代码图像\n\n```cpp\n\
  cout << MIN(0.1, 0.2) << endl;\n```\n\n请注意，如果 `MIN()` 是一个普通函数，你将需要编写它的两个变体：接受 `int`\
  \ 参数并返回 `int` 的 `MIN_INT()`，以及对 `double` 类型执行相同操作的 `MIN_DOUBLE()`。这种减少代码行数的优化是一个微小的优势，并诱使一些程序员使用宏来定义简单的实用函数。这些宏函数在编译前会被内联展开，因此简单宏的性能优于执行相同任务的普通函数调用。这是因为函数调用需要创建调用栈、传递参数等——这些管理开销通常比\
  \ `MIN` 本身的计算要消耗更多的 CPU 时间。\n\n尽管有这些优势，宏也存在严重的问题，即不支持任何形式的类型安全。如果这还不够，调试一个复杂的宏也并不容易。\n\
  \n如果你需要能够编写与类型无关但又类型安全的泛型函数，编写模板函数而不是宏函数。如果你需要提高性能，可以将该函数声明为 `inline`。\n\n你已经已经在\
  \ Listing 7.10 以及 Lesson 7 中的“使用函数组织代码”中学习了如何使用 `inline` 关键字编写内联函数。\n\n![图像](img/t0377_01.jpg)\n\
  \n现在是学习使用模板的泛型编程实践了！\n\n### 模板简介\n模板可能是 C++ 语言中最强大的特性之一，但往往是最少被接触或最不被理解的。在我们处理这个问题之前，让我们先看看韦伯词典中对模板的定义：\n\
  \n读音：\\’tem-plét\\\n\n词性：名词\n\n词源：可能源自法语 *templet*，*temple* 的指小形式，织布机的一部分，可能源自拉丁语\
  \ *templum*\n\n日期：1677\n\n1: 水平放置在梁下墙壁内的短段或块，用于分配其重量或压力（如门上方）\n2: (1): 刻度、图案或模具（如薄板或木板），用作制作部件形状的指南\
  \ (2): 分子（如 DNA），作为生成另一个大分子的（如信使 RNA）的模式 b: 覆盖层\n3: 建立或用作模式的事物\n\n最后一种定义可能接近 C++\
  \ 术语中 *template*（模板）一词解释。C++ 中的模板允许你定义一种可以应用于不同类型对象的行为。这听起来与宏允许你做的非常相似（参考用于确定两个数中较大值的简单宏\
  \ `MAX`），区别仅在于宏是不类型安全的，而模板是类型安全的。\n\n#### 模板声明语法\n你使用 `template` 关键字后跟类型参数列表来开始模板声明。此声明的格式为：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate <parameter list>\n\ntemplate function / class declaration..\n\
  ```\n\n关键字 `template` 标记模板声明的开始，后面跟着模板参数列表。该参数列表包含关键字 `typename`，它定义了模板参数 `objectType`，使其成为模板实例化时目标对象\
  \ `type` 的占位符。\n\n点击此处查看代码图像\n\n```cpp\ntemplate <typename T1, typename T2 = T1>\n\
  \nbool TemplateFunction(const T1& param1, const T2& param2);\n\n// 一个模板类\n\ntemplate\
  \ <typename T1, typename T2 = T1>\nclass Template\n{\n    private:\n    T1 m_Obj1;\n\
  \    T2 m_Obj2;\npublic:\n    T1 GetObj1() {\n    // ...\n};\n```\n\n你看到的是一个模板函数和一个模板类，它们带有模板参数\
  \ `T1` 和 `T2`，其中 `T2` 的默认类型为 `T1`。\n\n#### 模板的不同类型\n模板声明可以是：\n- 模板函数\n- 模板类声明\n\
  - 模板成员函数声明\n- 模板静态成员声明\n- 模板类的静态成员声明\n- 模板类的成员函数声明\n\n#### 模板函数\n想象一个能够适应不同类型的函数。使用模板可以实现这种函数！让我们分析一个类似于之前讨论过的\
  \ `MAX` 的模板声明：\n\n点击此处查看代码图像\n\n```cpp\ntemplate <typename objectType>\n\nconst\
  \ objectType& GetMax (const objectType& value1, const objectType& value2)\n{\n \
  \   if (value1 > value2)\n        return value1;\n    else\n        return value2;\n\
  }\n```\n\n示例用法：\n\n点击此处查看代码图像\n\n```cpp\nint Integer1 = 25;\nint Integer2 = 40;\n\
  int MaxValue = GetMax <int> (Integer1, Integer2);\n\ndouble Double1 = 1.1;\ndouble\
  \ Double2 = 1.001;\ndouble MaxValue = GetMax <double> (Double1, Double2);\n```\n\
  \n注意调用 `GetMax` 时使用的 `<int>` 细节。它实际上将模板参数 `objectType` 定义为 `int`。前面的代码会导致编译器生成 `GetMax`\
  \ 的两个版本，可以可视化为：\n\n点击此处查看代码图像\n\n```cpp\nconst int& GetMax (const int& value1, const\
  \ int& value2)\n{\n    //...\n}\n\nconst double & GetMax (const double& value1,\
  \ const double& value2)\n{\n    // ...\n}\n```\n\n然而在实际上，模板函数并不一定需要随的类型指定符。因此，以下函数调用完全有效：\n\
  \n```cpp\nint MaxValue = GetMax(Integer1, Integer2);\n```\n\n\n\n\n点击此处查看代码图像\n\n\
  ```cpp\n0: #include<iostream>\n1: #include<string>\n2: using namespace std;\n3:\n\
  4: template <typename Type>\n5: const Type& GetMax (const Type& value1, const Type&\
  \ value2)\n6: {\n7:     if (value1 > value2)\n8:          return value1;\n9:   \
  \  else\n10:          return value2;\n11: }\n12:\n13: template <typename Type>\n\
  14: void DisplayComparison(const Type& value1, const Type& value2)\n15: {\n16: \
  \    cout << \"GetMax(\" << value1 << \", \" << value2 << \") = \";\n17:     cout\
  \ << GetMax(value1, value2) << endl;\n18: }\n19:\n20: int main()\n21: {\n22:   \
  \  int Int1 = -101, Int2 = 2011;\n23:     DisplayComparison(Int1, Int2);\n24:\n\
  25:     double d1 = 3.14, d2 = 3.1416;\n26:     DisplayComparison(d1, d2);\n27:\n\
  28:     string Name1(\"Jack\"), Name2(\"John\");\n29:     DisplayComparison(Name1,\
  \ Name2);\n30:\n31:     return 0;\n32: }\n```\n\n### 输出\n点击此处查看代码图像\n```\nGetMax(-101,\
  \ 2011) = 2011\nGetMax(3.14, 3.1416) = 3.1416\nGetMax(Jack, John) = John\n```\n\n\
  ### 分析\n此示例包含两个模板函数：第 4 到 11 行的 `GetMax()`，它被第 13 到 18 行的 `DisplayComparison()`\
  \ 调用。`main()` 函数在第 23、26 和 29 行演示了如何将同一个模板函数重用于非常不同的数据类型：`integer`、`double` 和 `std::string`。这些模板函数不仅可以重用（就像它们的宏对应项一样），而且更容易编程和维护，并且是类型安全的！\n\
  \n注意，你也可以使用显式类型调用 `DisplayComparison`：\n\n```cpp\n23:    DisplayComparison<int>(Int1,\
  \ Int2);\n```\n\n然而，在调用模板函数时这是没有必要的。你不需要指定模板参数类型，因为编译器能够自动推断它。但在编写模板类时，你需要这样做这样做。\n\
  \n#### 模板与类型安全\n列表 14.3 所示的模板函数 `DisplayComparison()` 和 `GetMax()` 是类型安全的。这意味着它们不允许像这样无意义的调用：\n\
  \n点击此处查看代码图像\n\n```\nDisplayComparison(Integer, \"Some string\");\n```\n\n这将立即导致编译失败。\n\
  \n#### 模板类\n第 9 课，“类与对象”已经教过你，类是编程单元，它封装了某些属性以及操作这些属性的方法。属性通常是私有成员，例如 `class Human`\
  \ 中的 `int Age`。类是设计蓝图，而类在现实世界中的表示是该类的对象。例如，“Tom”可以被认为 `class Human` 的一个对象，其属性 `Age`\
  \ 包含值 15。如果你想为某些预期会极其长寿的人用 `long long` 存储 `Age`，而为其他预期寿命较短的人用 `short` 存储 `Age` 呢？这正是模板类大有用场的地方。模板类是\
