  \n### 分析\n\n前面的代码示例展示了你如何实例化一个 STL `string` 对象并将其初始化为另一个字符串，创建部分拷贝，或者将你的 STL `string`\
  \ 对象初始化为一组重复字符。`constCStyleString` 是一个 C 风格的字符字符串，包含一个示例值，在第 6 行中初始化。第 9 行显示了 `std::string`\
  \ 如何通过构造函数方便地创建副本。第 12 行将另一个常量字符串拷贝到 `std::string` 对象 `str2` 中，第 13 行演示了 `std::string`\
  \ 具有另一个重载构造函数，允许你拷贝一个 `std::string` 对象以获取 `str2Copy`。第 17 行演示了如何实现部分拷贝，第 21 行演示了如何实例化并初始化\
  \ `std::string` 以包含相同字符的重复出现。这个代码示例只是简单演示了 `std::string` 及其众多拷贝构造函数如何让程序员轻松地创建、拷贝和显示字符串。\n\
  \n### 注意\n\n如果你使用 C 风格字符串来拷贝另一个相同类型的字符串，那么列表 16.1 中第 9 行的等效代码如下：\n\n点击此处查看代码\n\n\
  ```cpp\nconst char* constCStyleString = \"Hello World!\";\n\n// 为了创建一个副本，首先为它分配内存...\n\
  \nchar * pszCopy = new char [strlen (constCStyleString) + 1];\n\nstrcpy (pszCopy,\
  \ constCStyleString); // 拷贝步骤\n\n// 使用 pszCopy 后释放内存\n\ndelete [] pszCopy;\n```\n\
  \n如你所见，结果是多出了很多行代码并且引入错误的概率更高，而且你需要担心内存管理和释放。STL `string` 为你处理了这一切，甚至更多！\n\n## 访问\
  \ std::string 的字符内容\n\nSTL `string` 的字符内容可以通过迭代器或通过提供偏移量的类数组语法（使用下标运算符 `[]`）来访问。可以通过成员函数\
  \ `c_str()` 获取 `string` 的 C 风格表示。参见列表 16.2。\n\n列表 16.2. 访问 STL 字符串字符元素的两种方式：Operator[]\
  \ 和迭代器\n\n点击此处查看代码\n\n```cpp\n0: #include <string>\n1: #include <iostream>\n2:\n\
  3: int main ()\n4: {\n5:     using namespace std;\n6:\n7:     // 示例字符串\n8:     string\
  \ strSTLString (\"Hello String\");\n9:\n10:     // 使用数组语法访问字符串的内容\n11:     cout<<\"\
  Displaying the elements in the string using array-syntax: \"<<endl;\n12:     for\
  \ ( size_t nCharCounter = 0\n13:          ; nCharCounter < strSTLString.length ()\n\
  14:          ; ++ nCharCounter )\n15:     {\n16:         cout << \"Character [\"\
  \ << nCharCounter << \"] is: \";\n17:         cout << strSTLString [nCharCounter]\
  \ << endl;\n18:     }\n19:     cout << endl;\n20:\n21:     // 使用迭代器访问字符串的内容\n22:\
  \     cout << \"Displaying the contents of the string using iterators: \" <<\n23:\
  \         endl;\n24:     int charOffset = 0;\n25:     string::const_iterator iCharacterLocator;\n\
  26:     for ( iCharacterLocator = strSTLString.begin ()\n27:          ; iCharacterLocator\
  \ != strSTLString.end ()\n28:          ; ++ iCharacterLocator )\n29:     {\n30:\
  \         cout << \"Character [\" << charOffset ++ << \"] is: \";\n31:         cout\
  \ << *iCharacterLocator << endl;\n32:     }\n33:     cout << endl;\n34:\n35:   \
  \  // 作为 C 风格字符串访问字符串的内容\n36:     cout << \"The char* representation of the string\
  \ is: \";\n37:     cout << strSTLString.c_str () << endl;\n38:\n39:     return 0;\n\
  40: }\n```\n\n### 输出\n\n点击此处查看代码\n\n```\nDisplaying the elements in the string using\
  \ array-syntax:\nCharacter [0] is: H\nCharacter [1] is: e\nCharacter [2] is: l\n\
  Character [3] is: l\nCharacter [4] is: o\nCharacter [5] is:\nCharacter [6] is: S\n\
  Character [7] is: t\nCharacter [8] is: r\nCharacter [9] is: i\nCharacter [10] is:\
  \ n\nCharacter [11] is: g\nDisplaying the contents of the string using iterators:\n\
  Character [0] is: H\nCharacter [1] is: e\nCharacter [2] is: l\nCharacter [3] is:\
  \ l\nCharacter [4] is: o\nCharacter [5] is:\nCharacter [6] is: S\nCharacter [7]\
  \ is: t\nCharacter [8] is: r\nCharacter [9] is: i\nCharacter [10] is: n\nCharacter\
  \ [11] is: g\nThe char* representation of the string is: Hello String\n```\n\n###\
  \ 分析\n\nSTL `string` 的字符内容可以通过迭代器或通过提供偏移量的类数组语法（使用下标运算符 `[]`）来访问。可以通过成员函数 `c_str()`\
  \ 获取 `string` 的 C 风格表示。\n\n## 将一个字符串拼接到另一个字符串\n\n可以通过 `+=` 运算符或 `append` 函数实现拼接：\n\
  \n点击此处查看代码\n\n```cpp\nstring strSample1 (\"Hello\");\nstring strSample2 (\" String!\"\
  );\nstrSample1 += strSample2; // 使用 +=\nstrSample1.append(strSample2); // 使用 append\n\
  const char* constCStyleString = \" You however!\";\nstrSample1.append(constCStyleString);\n\
  ```\n\n### 输出\n\n```\nHello String!\nHello String! You however can!\n```\n\n###\
  \ 分析\n\n第 11 行、第 15 行和第 19 行显示了拼接 STL `string` 的不同方法。注意 `+=` 运算符的使用以及 `append` 函数（它有多个重载）接受另一个\
  \ `string` 对象（如第 11 行所示）以及接受 C 风格字符串的能力。\n\n## 在字符串中查找字符或子串\n\nSTL `string` 提供了\
  \ `find` 成员函数，有几个重载版本，帮助在给定的 `string` 对象中查找字符或子串。\n\n点击此处查看代码\n\n```cpp\n// 在字符串\
  \ strSample 中从位置 0 开始查找子串 \"day\"\nsize_t charPos = strSample.find(\"day\", 0);\n\
  // 检查是否找到了子串，与 string::npos 进行比较\nif (charPos != string::npos)\n    cout << \"First\
  \ instance of \\\"day\\\" was found at position \" << charPos;\nelse\n    cout <<\
  \ \"Substring not found.\" << endl;\n```\n\n列表 16.4 演示了 `std::string::find` 的用途。\n\
  \n\n\n\n\n```cpp\nusing namespace std;\n\nstring strSample (\"Good day String! Today\
  \ is beautiful!\");\n    cout << \"The sample string is: \" << endl;\n    cout <<\
  \ strSample << endl << endl;\n\n    // Find substring \"day\" in it...\n    size_t\
  \ charPos = strSample.find (\"day\", 0);\n\n    // Check if the substring was found...\n\
  \    if (charPos != string::npos)\n        cout << \"First instance of \\\"day\\\
  \" was found at position \" << charPos;\n    else\n        cout << \"Substring not\
  \ found.\" << endl;\n\n    cout << endl << endl;\n\n    cout << \"Locating all instances\
  \ of substring \\\"day\\\"\" << endl;\n    size_t SubstringPos = strSample.find\
  \ (\"day\", 0);\n\n    while (SubstringPos != string::npos)\n    {\n        cout\
  \ << \"\\\"day\\\" found at position \" << SubstringPos << endl;\n\n        // Make\
  \ find search forward from the next character\n        size_t nSearchPosition =\
  \ SubstringPos + 1;\n\n        SubstringPos = strSample.find (\"day\", nSearchPosition);\n\
  \    }\n\n    cout << endl;\n\n    cout << \"Locating all instances of character\
  \ 'a'\" << endl;\n    const char charToSearch = 'a';\n    charPos = strSample.find\
  \ (charToSearch, 0);\n\n    while (charPos != string::npos)\n    {\n        cout\
  \ << \"'\" << charToSearch << \"' found\";\n        cout << \" at position: \" <<\
  \ charPos << endl;\n\n        // Make find search forward from the next character\n\
  \        size_t charSearchPos = charPos + 1;\n\n        charPos = strSample.find\
  \ (charToSearch, charSearchPos);\n    }\n\n    return 0;\n}\n```\n\n### 输出\n\n```\n\
  The sample string is:\nGood day String! Today is beautiful!\nFirst instance of \"\
  day\" was found at position 5\nLocating all instances of substring \"day\"\n\"day\"\
  \ found at position 5\n\"day\" found at position 19\nLocating all instances of character\
  \ 'a'\n'a' found at position: 6\n'a' found at position: 20\n'a' found at position:\
  \ 28\n```\n\n### 分析\n\n第 12–18 行展示了 `find` 函数的最简单用法，它用于确定在 `string` 中是否找到了某个特定的子字符串。这是通过将\
  \ `find` 操作的结果与 `std::string::npos`（实际上是 -1）进行比较来实现的，这表示搜索的元素未找到。当 `find` 函数不返回\
  \ `npos` 时，它会返回一个偏移量，该偏移量指示了子字符串或字符在 `string` 中的位置。\n\n随后的代码展示了如何在 `while` 循环中使用\
  \ `find` 来定位 STL `string` 中某个字符或子字符串的所有实例。这里使用的 `find` 函数重载版本接受两个参数：要查找的子字符串或字符，以及指示\
  \ `find` 从何一个点开始搜索的搜索偏移量。\n\n### 注意事项\n\nSTL `string` 还具有与 `find()` 相似的函数，例如 `find_first_of()`、`find_first_not_of()`、`find_last_of()`\
  \ 和 `find_last_not_of()`，这些函数可以进一步帮助程序员满足其编程需求。\n\n### 截断 STL 字符串\n\nSTL `string`\
  \ 有一个名为 `erase` 的函数，可以删除：\n\n- 当给定偏移位置和计数时删除指定数量的字符\n```cpp\nstring strSample (\"\
  Hello String! Wake up to a beautiful day!\");\nstrSample.erase (13, 28);  // Hello\
  \ String!\n```\n\n- 当提供指向该字符的迭代器时删除该字符\n```cpp\nstrSample.erase (iCharS); // 迭代器指向特定字符\n\
  ```\n\n- 根据两个相同迭代器提供的范围删除指定数量的字符\n```cpp\nstrSample.erase (strSample.begin (), strSample.end\
  \ ()); // 从开始到结束删除\n```\n\n列表 16.5 中的后续示例演示了 `string::erase()` 函数重载版本的不同应用。\n\n\
  #### 列表 16.5：使用 string::erase 从偏移量开始或给定迭代器截断字符串\n\n```cpp\n#include <string>\n#include\
  \ <algorithm>\n#include <iostream>\n\nint main ()\n{\n    using namespace std;\n\
  \n    string strSample (\"Hello String! Wake up to a beautiful day!\");\n    cout\
  \ << \"The original string is: \" << endl;\n    cout << strSample << endl << endl;\n\
  \n    // 根据给定的位置和计数删除字符串中的字符\n    cout << \"Truncating the second sentence: \" <<\
  \ endl;\n    strSample.erase (13, 28);\n    cout << strSample << endl << endl;\n\
  \n    // 使用 STL find 在字符串中查找字符 'S'\n    string::iterator iCharS = find ( strSample.begin\
  \ (), strSample.end (), 'S');\n\n    // 如果找到字符，则使用 'erase' 删除该字符\n    cout << \"\
  Erasing character 'S' from the sample string:\" << endl;\n    if (iCharS != strSample.end\
  \ ())\n        strSample.erase (iCharS);\n    cout << strSample << endl << endl;\n\
  \n    // 使用 erase() 的重载版本删除范围\n    cout << \"Erasing a range between begin() and\
  \ end(): \" << endl;\n    strSample.erase (strSample.begin (), strSample.end ());\n\
  \n    // 验证 erase() 操作后的长度\n    if (strSample.length() == 0)\n        cout << \"\
  The string is empty\" << endl;\n\n    return 0;\n}\n```\n\n### 输出\n\n```\nThe original\
  \ string is:\nHello String! Wake up to a beautiful day!\nTruncating the second sentence:\n\
  Hello String!\nErasing character 'S' from the sample string:\nHello string!\nErasing\
  \ a range between begin() and end():\nThe string is empty\n```\n\n### 分析\n\n列表指示了\
  \ `erase` 的三个版本。一个版本在提供偏移和计数时删除一组字符，如第 14 行所示。另一个版本根据指向字符的迭代器删除字符，如第 24 行所示。最后一个版本根据提供范围边界的迭代器删除范围范围，如第\
  \ 30 行所示。由于该范围是由 `string` 的 `begin()` 和 `end()` 成员函数提供的，调用它会清空字符串对象的内容。注意 `string`\
  \ 类还提供了一个 `clear()` 函数，它可以有效地清空内部缓冲区并重置 `string` 对象。\n\n#### C++11：使用 auto 简化冗长的迭代器声明\n\
  \nC++11 有助于简化冗长的迭代器声明，如列表 16.5 所示：\n\n```cpp\nstring::iterator iCharS = find ( strSample.begin\
  \ (), strSample.end (), 'S');\n```\n\n为了减少这种写法，可以使用在第 3 “使用变量、声明常量”中介绍的 `auto` 关键字：\n\
  \n```cpp\nauto iCharS = find ( strSample.begin (), strSample.end (), 'S');\n```\n\
  \n编译器根据 `std::find` 的返回值类型信息自动推导出变量 `iCharS` 的类型。\n\n### 字符串反转\n\n有时反转字符串的内容是非常重要的。假设你想确定用户输入的字符串是否是回文。一种方法是反转它的副本，然后比较这两个字符串。STL\
  \ 字符串可以使用通用算法 `std::reverse` 算法轻松地反转：\n\n```cpp\nstring strSample (\"Hello String!\
  \ We will reverse you!\");\nreverse (strSample.begin (), strSample.end ());\n```\n\
  \n\n\n\nListing 16.6 展示了算法 `std::reverse` 在 `std::string` 上的应用。\n\nListing 16.6.\
  \ 使用 `std::reverse` 反转 STL 字符串\n\n点击此处查看代码图像\n\n***\n\n```\n0: #include <string>\n\
  1: #include <iostream>\n2: #include <algorithm>\n3:\n4: int main ()\n5: {\n6:  \
  \   using namespace std;\n7:\n8:     string strSample (\"Hello String! We will reverse\
  \ you!\");\n9:     cout << \"The original sample string is: \" << endl;\n10:   \
  \  cout << strSample << endl << endl;\n11:\n12:     reverse (strSample.begin (),\
  \ strSample.end ());\n13:\n14:     cout << \"After applying the std::reverse algorithm:\
  \ \" << endl;\n15:     cout << strSample << endl;\n16:\n17:     return 0;\n18: }\n\
  ```\n\n***\n\n### 输出\n\n点击此处查看代码图像\nThe original sample string is:\nHello String!\
  \ We will reverse you!\nAfter applying the std::reverse algorithm:\n!uoy esrever\
  \ lliw eW !gnirtS olleH\n\n***\n\n### 分析\n\n第 12 行使用的 `std::reverse` 算法通过两个输入参数作用于所提供的容器边界。在这种情况下，这些边界是\
  \ `string` 对象的起始和结束边界，反转了整个字符串的内容。也可以通过提供适当的边界来部分反转字符串。注意，边界永远不应超过 `end()`。\n\n\
  ***\n\n### 字符串大小写转换\n\n字符串的大小写转换可以使用算法 `std::transform` 实现，该算法会将用户指定的函数应用于集合中的每个元素。在例中，该集合是\
  \ `string` 对象本身。Listing 16.7 中的示例展示了如何切换 `string` 中字符的大小写。\n\nListing 16.7. 使用 `std::transform`\
  \ 将 STL 字符串转换为大写\n\n点击此处查看代码图像\n\n```\n0: #include <string>\n1: #include <iostream>\n\
  2: #include <algorithm>\n3:\n4: int main ()\n5: {\n6:     using namespace std;\n\
  7:\n8:     cout << \"Please enter a string for case-convertion:\" << endl;\n9: \
  \    cout << \"> \";\n10:\n11:     string strInput;\n12:     getline (cin, strInput);\n\
  13:     cout << endl;\n14:\n15:     transform(strInput.begin(),strInput.end(),strInput.begin(),toupper);\n\
  16:     cout << \"The string converted to upper case is: \" << endl;\n17:     cout\
  \ << strInput << endl << endl;\n18:\n19:     transform(strInput.begin(),strInput.end(),strInput.begin(),tolower);\n\
  20:     cout << \"The string converted to lower case is: \" << endl;\n21:     cout\
  \ << strInput << endl << endl;\n22:\n23:     return 0;\n24: }\n```\n\n### 输出\n\n\
  点击此处查看代码图像\nPlease enter a string for case-convertion:\n> ConverT thIS StrINg!\n\
  The string converted to upper case is:\nCONVERT THIS STRING!\nThe string converted\
  \ to lower case is:\nconvert this string!\n\n***\n\n### 分析\n\n第 15 行和第 19 行演示了如何高效地使用\
  \ `std::transform` 来更改 STL 字符串内容的大小写。\n\n### STL 字符串的模板实现\n\n正如你所学的，`std::string`\
  \ 类实际上是 STL 模板类 `std::basic_string <T>` 的特化。容器类 `basic_string` 的模板声明如下：\n\n```cpp\n\
  template<class _Elem,\n    class _Traits,\n    class _Ax>\n    class basic_string\n\
  ```在这个模板定义中，最重要的参数是第一个：`_Elem`。（注：提供的源文本包含重复内容，已进行清理以保持专业文档标准）。\n\n\n\n\n-   以常数时间向数组末尾添加元素；也就是说，在末尾插入所需的时间不取决于数组的大小。删除末尾元素也是如此。\n\
  -   在中间插入或删除元素所需的时间与被删除元素后面的元素数量正比。\n-   元素的数量是动态的，`vector` 类管理内存使用。\n\n`vector`\
  \ 是一种动态数组，可以像图 17.1 所示可视化。\n\n![Image](img/17fig01.jpg)\n\n图 17.1。vector 的内部结构。\n\
  \n* *\n\n### 提示\n\n要使用类 `std::vector`，请包含头头文件：\n\n```cpp\n#include <vector>\n```\n\
  \n* *\n\n### 典型的 Vector 操作\n\n`std::vector` 类的行为规范和公共成员由 C++ 标准定义。因此，你在本节中将学习的对\
  \ `vector` 的操作受到多种符合标准的 C++ 编程平台的支持。\n\n#### 实例化 Vector\n\n`vector` 是一个模板类，需要根据第\
  \ 14 节“宏和模板介绍”中涵盖的模板实例化技术进行实例化。`vector` 的模板实例化需要指定你想在这个动态数组中收集的对象的类型。\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::vector<int> vecDynamicIntegerArray;  // 包含整数的 vector\nstd::vector<float>\
  \ vecDynamicFloatArray;  // 包含浮点数的 vector\nstd::vector<Tuna> vecDynamicTunaArray;\
  \  // 包含金枪鱼的 vector\n```\n\n要声明一个指向列表中元素的迭代器，你会使用：\n\n点击此处查看代码图像\n\n```cpp\nstd::list<int>::const_iterator\
  \ iElementInSet;\n```\n\n如果你需要一个可以用于修改值或调用非 `const` 函数的迭代器，请使用 `iterator` 代替 `const_iterator`。\n\
  \n由于 `std::vector` 有几个重载的构造函数，你还有一种选择在实例化 vector 时告诉它应该开始的元素数量及其初始值，或者你可以在实例化另一个\
  \ vector 时使用一个 vector 的部分。\n\n列表 17.1 展示了几种 vector 实例化\n\n列表 17.1。实例化 std::vector\
  \ 的不同形式：指定大小、初始值以及从另一个拷贝拷贝值\n\n点击此处查看代码图像\n\n* *\n\n```cpp\n0: #include <vector>\n\
  1:\n2: int main ()\n3: {\n4:     std::vector <int> vecIntegers;\n5:\n6:     // 实例化包含\
  \ 10 个元素的 vector（它可以变得更大）\n7:     std::vector <int> vecWithTenElements (10);\n8:\n\
  9:     // 实例化包含 10 个元素的 vector，每个初始化为 90\n10:     std::vector <int> vecWithTenInitializedElements\
  \ (10, 90);\n11:\n12:     // 实例化一个 vector 并将其初始化为另一个的内容\n13:     std::vector <int>\
  \ vecArrayCopy (vecWithTenInitializedElements);\n14:\n15:     // 使用迭代器从另一个处实例化为\
  \ 5 个元素的 vector\n16:     std::vector <int> vecSomeElementsCopied ( vecWithTenElements.cbegin\
  \ ()\n17:                               , vecWithTenElements.cbegin () + 5 );\n\
  18:\n19:     return 0;\n20: }\n```\n\n* *\n\n* *\n\n### 分析\n\n前面的代码具有针对类型 `integer`\
  \ 的 `vector` 类的模板特化；换句话说，它实例化了一个整数 `vector`。这个名为 `vecIntegers` 的 `vector` 使用了默认构造函数，当你不知道容器的最小大小需求时，这非常有用——即当你不知道想在其中存储多少整数时。第\
  \ 10 行和第 13 行所示的 `vector` 实例第二第二第三形式是程序员知道需要一个至少包含 10 个元素的 `vector`。请注意，这并没有限制容器的最终\
  \ `size`，只是设置了初始化的 `size`。第 16 行和第 17 行的第四种形式是可以使用 `vector` 来实例化另一个的内容——也就是说，创建一个另一个\
  \ vector 的副本或其部分的 `vector` 对象。这也是适用于所有 STL 容器的结构。最后一种形式是使用迭代器的形式。`vecSomeElementsCopied`\
  \ 包含了 `vecWithTenElements` 中的前五个元素。\n\n* *\n\n* *\n\n### 注意\n\n第四种构造仅对同种类型的对象有效。因此，你可以使用另一个整数对象的\
  \ `vector` 来实例化一个 `vecArrayCopy`——一个包含整数对象的 `vector`。如果其中一个是（例如）`float` 类型的 `vector`，代码将无法编译。\n\
  \n* *\n\n* *\n\n### 提示：你在编译 `cbegin()` 和 `cend()` 时遇到错误了吗？\n\n如果你正尝试使用非 C++11 标准的编译器编译此程序，请使用\
  \ `begin()` 和 `end()` 代替 `cbegin()` 和 `cend()`。\n\n* *\n\n#### 在末尾插入元素使用 `push_back()`\n\
  \n实例化一个整数 `vector` 后，下一个任务是向其插入元素。点击此处查看代码图像\n\n```cpp\nstd::vector<int> vecIntegers;\
  \ // 整数的 vector\n```\n\n列表 17.2 展示了在 vector 中使用 `push_back()`：\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <vector>\n2: using namespace std;\n3:\n4: int main ()\n\
  5: {\n6:     vector <int> vecIntegers;\n7:\n8:     // 向 vector 插入整数：\n9:     vecIntegers.push_back\
  \ (50);\n10:    vecIntegers.push_back (1);\n11:    vecIntegers.push_back (987);\n\
  12:    vecIntegers.push_back (1001);\n13:\n14:     cout << \"The vector contains\
  \ \";\n15:     cout << vecIntegers.size () << \" Elements\" << endl;\n16:\n17: \
  \    return 0;\n18: }\n```\n\n* *\n\n* *\n\n### 输出\n\n点击此处查看代码图像\n\nThe vector contains\
  \ 4 Elements\n\n* *\n\n* *\n\n### 分析\n\n第 9-12 行所示的 `push_back()` 是 `vector` 类在末尾插入对象的成员方法。注意函数\
  \ `size()` 的用法，它返回 vector 中持有的元素数量。\n\n* *\n\n#### C++11：初始化列表\n\nC++11 通过 `std::initialize_list<>`\
  \ 类提供了初始化列表，在支持的情况下，它允许你像静态数组一样实例化并初始化 vector 中的元素：\n\n点击此处查看代码图像\n\n```cpp\nvector<int>\
  \ vecIntegers = {50, 1, 987, 1001};\n// 或者：\nvector<int> vecIntegers {50, 1, 987,\
  \ 1001};\n```\n\n这种语法减少了列表 17.2 中的三行代码。然而，我们没有使用它是因为在编写此书时，Microsoft Visual C++\
  \ 2010 编译器的 `std::vector` 实现还不初始化列表。\n\n#### 在给定位置使用 `insert()` 元素\n\n你使用 `push_back`\
  \ 在 vector 的末尾插入元素。如果你想在中间插入呢？许多其他 STL 容器（包括 `std::vector`）都具有许多重载的 `insert()` 函数。\n\
  \n其中一种形式可以指定元素可以插入到序列的位置：\n\n点击此处查看代码图像\n\n```cpp\n// 在开头插入一个元素\nvecIntegers.insert\
  \ (vecIntegers.begin (), 25);\n```\n\n在另一种形式中，你可以指定位置以及需要插入的元素数量及其值：\n\n\n\n\n\n\
  ```cpp\n// 在末尾插入 2 个值为 45 的数字\nvecIntegers.insert (vecIntegers.end (), 2, 45);\n\
  ```\n\n你也可以将一个 vector 的内容插入另一个 vector 的指定位置：\n\n点击此处查看代码图像\n\n```cpp\n// 另一个包含 2\
  \ 个值为 30 元素的 vector\nvector <int> vecAnother (2, 30);\n\n// 在位置 [1] 处插入来自另一个容器的两个元素\n\
  vecIntegers.insert (vecIntegers.begin () + 1,\n                   vecAnother.begin\
  \ (), vecAnother.end ());\n```\n\n你使用迭代器（通常由 `begin()` 或 `end()` 返回）来告诉 `insert()`\
  \ 函数你想要放置新元素的位置。\n\n***\n\n### 提示\n\n注意，该迭代器也可以是 STL 算法的返回值，例如 `std::find()` 函数，它可以用于找到一个元素，然后在该位置插入另一个元素（插入会移动找到找到的元素）。\n\
  \n***\n\n这些 `vector::insert()` 的形式在 Listing 17.3 中演示。\n\nListing 17.3. 使用 vector::insert\
  \ 函数在指定位置插入元素\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <vector>\n1: #include\
  \ <iostream>\n2: using namespace std;\n3:\n4: void DisplayVector(const vector<int>&\
  \ vecInput)\n5: {\n6:     for (auto iElement = vecInput.cbegin() // auto 和 cbegin():\
  \ C++11\n7:         ; iElement != vecInput.cend()  // cend() 是 C++11 新的\n8:    \
  \     ; ++ iElement )\n9:         cout << *iElement << ' ';\n10:\n11:     cout <<\
  \ endl;\n12: }\n13:\n14: int main ()\n15: {\n16:     // 实例化包含 4 个元素的 vector，每个元素初始化为\
  \ 90\n17:     vector <int> vecIntegers (4, 90);\n18:\n19:     cout << \"The initial\
  \ contents of the vector: \";\n20:     DisplayVector(vecIntegers);\n21:\n22:   \
  \  // 在开头插入 25\n23:     vecIntegers.insert (vecIntegers.begin (), 25);\n24:\n25:\
  \     // 在末尾插入 2 个值为 45 的数字\n26:     vecIntegers.insert (vecIntegers.end (), 2,\
  \ 45);\n27:\n28:     cout << \"Vector after inserting elements at beginning and\
  \ end: \";\n29:     DisplayVector(vecIntegers);\n30:\n31:     // 另一个包含 2 个值为 30\
  \ 元素的 vector\n32:     vector <int> vecAnother (2, 30);\n33:\n34:     // 在位置 [1]\
  \ 处插入来自另一个容器的两个元素\n35:     vecIntegers.insert (vecIntegers.begin () + 1,\n36:  \
  \       vecAnother.begin (), vecAnother.end ());\n37:\n38:     cout << \"Vector\
  \ after inserting contents from another vector: \";\n39:     cout << \"in the middle:\"\
  \ << endl;\n40:     DisplayVector(vecIntegers);\n41:\n42:     return 0;\n43: }\n\
  ```\n\n***\n\n### 输出\n\n点击此处查看代码图像\n\nThe initial contents of the vector: 90 90\
  \ 90 90\nVector after inserting elements at beginning and end: 25 90 90 90 90 45\
  \ 45\nVector after inserting contents from another vector: in the middle:\n25 30\
  \ 30 90 90 90 90 45 45\n\n***\n\n### 分析\n\n这段代码有效地演示了 `insert` 函数的强大之处，它允许你将值放在容器的中间。第\
  \ 17 行的 `vector` 包含四个元素，全部初始化为 90。以这个 vector 为起点，我们使用了 `vector::insert` 成员函数的各种重载版本。在第\
  \ 23 行，你在开头添加了一个元素。第 26 行使用重载版本在末尾添加了两个值为 45 的元素。第 35 行演示了如何将元素从一个 vector 插入到中间（在本例中，是偏移量为\
  \ 1 的第二个位置）。\n\n尽管 `vector::insert` 是一个非常多功能的函数，但 `push_back()` 应该是你向 vector 添加元素的首选方式。注意，`insert()`\
  \ 是一种向 `vector` 添加元素的低效方式（当在非末尾位置添加时），因为在开头或中间添加元素会导致 `vector` 类将所有元素向后移动（在为末尾元素留空间之后）。因此，取决于序列中包含的对象类型，该操作在拷贝构造函数或拷贝赋值运算符方面的开销可能是巨大的。在我们的小示例中，`vector`\
  \ 包含 `int` 类型的对象，移动成本很低。这在 `vector` 类的许多其他用法中可能并非如此。\n\n***\n\n### 提示\n\n如果你的容器需要在中间频繁地进行插入，理想情况下你应该选择\
  \ 第 18 节 中解释的“STL list and forward_list”——`std::list`。\n\n***\n\n### 注意事项：你正在使用旧版本的\
  \ C++ 编译器吗？\n\nListing 17.3 中的 `DisplayVector()` 函数使用了 C++11 关键字 `auto` 在第 6 行定义迭代器的类型。在本示例及后续示例中，为了使用不符合\
  \ C++11 的编译器进行编译，你需要将 `auto` 替换为显式类型，在此情况下为 `vector<int>::const_iterator`。\n\n因此，针对旧编译器的\
  \ `DisplayVector()` 需要修改为如下：\n\n点击此处查看代码图像\n\n```cpp\n// 用于旧版 C++ 编译器\nvoid DisplayVector(const\
  \ vector<int>& vecInput)\n{\n    for (vector<int>::const_iterator iElement = vecInput.begin();\
  \ iElement != vecInput.end(); ++ iElement )\n        cout << *iElement << ' ';\n\
  \    cout << endl;\n}\n```\n\n***\n\n#### 使用数组语义访问 vector\n\n`vector` 中的元素可以通过以下方式访问：通过下标运算符\
  \ `[]`、使用成员函数 `at()` 或使用迭代器。\n\nListing 17.1 展示了如何创建一个初始化了 10 个元素的 `vector` 实例：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::vector<int> vecArrayElements (10);\n```\n\n你可以使用数组语法访问和设置单个元素：\n\
  \n点击此处查看代码图像\n\n```cpp\nvecArrayElements[3] = 2011; // 设置第 4 个元素\n```\n\nListing\
  \ 17.4 演示了如何使用下标运算符 `[]` 访问 `vector` 元素。\n\nListing 17.4. 使用数组语义访问 vector 元素\n\n\
  \n\n\n\n更安全的替代方案是使用 `at()` 成员函数：\n\n点击此处查看代码图片\n\n```cpp\n// gets element at position\
  \ 2\ncout << vecIntegerArray.at (2);\n\n// 上述代码在 Listing\n// 17.4 第 17 行的 vector::at()\
  \ 版本为：\ncout << vecIntegerArray.at(Index);\n```\n\n`at()` 会对容器的大小进行运行时检查，如果越界则会抛出异常（尽管无论如何你都不应该这样做）。\n\
  \n下标运算符 `[]` 在以确保边界完整性的方式使用时是安全的，正如在早早的示例中所示。\n\n### 使用指针语义访问 Vector 中的元素\n\n你也可以通过使用迭代器以类似指针的语义来访问\
  \ `vector` 中的元素，如 Listing 17.5 所示。\n\nListing 17.5. 使用指针语义访问 Vector 中的元素（迭代器）\n\n\
  点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: #include <vector>\n2:\n3: int main\
  \ ()\n4: {\n5:     using namespace std;\n6:     vector <int> vecIntegers;\n7:\n\
  8:     // 将示例整数插入 vector:\n9:     vecIntegers.push_back (50);\n10:     vecIntegers.push_back\
  \ (1);\n11:     vecIntegers.push_back (987);\n12:     vecIntegers.push_back (1001);\n\
  13:\n14:     // 使用迭代器访问 vector 中的对象:\n15:     vector <int>::iterator iElementLocator\
  \ = vecIntegers.begin ();\n16:     // 使用 C++11 关键字 auto 声明迭代器（取消下行注释）\n17:     //\
  \ auto iElementLocator = vecIntegers.begin ();\n18:\n19:     while (iElementLocator\
  \ != vecIntegers.end ())\n20:     {\n21:         size_t Index = distance (vecIntegers.begin\
  \ (),\n22:                             iElementLocator);\n23:\n24:         cout\
  \ << \"Element at position \";\n25:         cout << Index << \" is: \" << *iElementLocator\
  \ << endl;\n26:\n27:         // 移动到下一个元素\n28:         ++ iElementLocator;\n29: \
  \    }\n30:\n31:     return 0;\n32: }\n```\n\n### 输出\n\n点击此处查看代码图片\n\n位置 0 的元素是:\
  \ 50\n位置 1 的元素是: 1\n位置 2 的元素是: 987\n位置 3 的元素是: 1001\n\n### 分析\n\n此示例中的迭代器行为在很大程度上类似于指针，且其在上述应用中的用法性质非常类似于指针算术，正如第\
  \ 25 行所示，使用解引用运算符 `*` 访问存储在 vector 中的值；正如第 29 行所示，当使用运算符 `++` 增加迭代器时，它指向下一个元素。注意第\
  \ 21 行如何使用 `std::distance()`，在给定 `begin()` 和指向该元素的迭代器的情况下，计算元素在 vector 中从零开始的偏移位置（即相对于起始位置的位置）。\n\
  \n### 从 Vector 中删除元素\n\n与 `vector` 特性通过 `push_back` 方法在末尾插入一样，它也通过 `pop_back` 函数删除末尾元素。使用\
  \ `pop_back` 从 `vector` 中删除元素需要常数时间——这意味着所需的时间与 `vector` 中存储的元素数量无关。Listing 17.6\
  \ 中的后续代码演示了如何使用函数 `pop_back` 从 vector 末尾删除元素。\n\nListing 17.6. 使用 pop_back 删除最后一个元素\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: #include <vector>\n2: using namespace\
  \ std;\n3:\n4: template <typename T>\n5: void DisplayVector(const vector<T>& vecInput)\n\
  6: {\n7:     for (auto iElement = vecInput.cbegin() // auto 和 cbegin(): C++11\n\
  8:           ; iElement != Input.cend()  // cend() 是 C++11 新的新特性\n9:           ;\
  \ ++ iElement )\n10:         cout << *iElement << ' ';\n11:\n12:         cout <<\
  \ endl;\n13: }\n14:\n15: int main ()\n16: {\n17:     vector <int> vecIntegers;\n\
  18:\n19:     // 将示例整数插入 vector:\n20:     vecIntegers.push_back (50);\n21:     vecIntegers.push_back\
  \ (1);\n22:     vecIntegers.push_back (987);\n23:     vecIntegers.push_back (1001);\n\
  24:\n25:     // 使用迭代器访问 vector 中的对象:\n26:     vector <int>::iterator iElementLocator\
  \ = vecIntegers.begin ();\n27:\n28:     while (iElementLocator != vecIntegers.end\
  \ ())\n29:     {\n30:         size_t Index = distance (vecIntegers.begin (),\n31:\
  \                             iElementLocator);\n32:\n33:         cout << \"Element\
  \ at position \";\n34:         cout << Index << \" is: \" << *iElementLocator <<\
  \ endl;\n35:\n36:         // 移动到下一个元素\n37:         ++ iElementLocator;\n38:    \
  \ }\n39:\n40:     return 0;\n41: }\n```\n\n\n\n\n\n```cpp\n25:    cout << \"Size:\
  \ \" << vecIntegers.size ();\n26:    cout << \", Capacity: \" << vecIntegers.capacity\
  \ () << endl;\n28:    return 0;\n29: }\n```\n\n### 输出\n点击此处查看代码图像\n\n整数向量实例化结果如下：\n\
  Size: 5, Capacity: 5\n插入一个额外元素后...\nSize: 6, Capacity: 7\n再次插入一个元素后...\nSize: 7,\
  \ Capacity: 7\n\n### 分析\n第 8 行显示了包含五个默认值（0）整数的 `vector` 实例化。第 11 行和第 12 行分别打印了 `vector`\
  \ 的大小（size）和容量（capacity），显示在实例化时这两个值是相等的。第 9 行在 `vector` 中插入了第六个元素。鉴于插入之前 `vector`\
  \ 的容量为 5，`vector` 的内部缓冲区没有足够的内存来支持这个新的第六个元素。换句话说，为了让 `vector` 类能够扩展并存储六个元素，它需要重新分配内部缓冲区。重新分配逻辑的实现是非常智能的——为了避免在插入另一个元素时再次重新分配，它预先分配了大于当前场景需求的容量。\n\
  \n输出显示，当在一个容量为 5 的 `vector` 中插入第六个元素时，涉及的重新分配将容量增加到了七个元素。`size()` 始终反映 `vector`\
  \ 中的元素数量，在此阶段其值为 6。第 22 行添加的第七个元素导致容量没有增加——现有的分配内存已足够满足需求。在此阶段大小和容量显示相同的值，这表明 `vector`\
  \ 已充分利用了其容量，而下一个元素的插入将导致 `vector` 重新分配其内部缓冲区，在插入新值之前复制现有的值。\n\n### 注意事项\n当内部缓冲区重新分配时，预先增加\
  \ `vector` 容量的行为不受标准库中任何条款的规定。这取决于所使用的 STL 变体。\n\n### The STL deque 类\n`deque`（读音与\
  \ deck 同韵）是一种 STL 动态数组类，其属性与 `vector` 非常相似，不同在于它允许在数组的前部和尾部插入和删除元素。你可以像这样实例化一个整数\
  \ `deque`：\n\n点击此处查看代码图像\n\n```cpp\n// 定义一个整数 deque\ndeque <int> dqIntegers;\n```\n\
  \n### 提示\n要使用 `std::deque`，请包含头文件 `<deque>`：\n```cpp\n#include<deque>\n```\n\n`deque`\
  \ 的可视化如图 17.2 所示。\n\n![图像](img/17fig02.jpg)\n图 17.2。deque 的内部结构。\n\n`deque` 与 `vector`\
  \ 非常相似，都通过 `push_back()` 和 `pop_back()` 方法在尾部支持元素的插入和删除。就像 `vector` 一样，`deque` 也允许你通过运算符（`[]`）使用数组语义访问它。`deque`\
  \ 与 `vector` 的之处在于，它还允许你使用 `push_front()` 在头部插入元素，并使用 `pop_front()` 从头部删除，如列表 17.8\
  \ 所示。\n\n列表 17.8。实例化 STL deque 并使用 push_front() 和 pop_front() 方法在头部插入和删除元素\n\n点击此处查看代码图像\n\
  \n```cpp\n0: #include <deque>\n1: #include <iostream>\n2: #include <algorithm>\n\
  3:\n4: int main ()\n5: {\n6:     using namespace std;\n7:\n8:     // 定义一个整数 deque\n\
  9:     deque <int> dqIntegers;\n10:\n11:     // 在数组底部插入整数\n12:     dqIntegers.push_back\
  \ (3);\n13:     dqIntegers.push_back (4);\n14:     dqIntegers.push_back (5);\n15:\n\
  16:     // 在数组顶部插入整数\n17:     dqIntegers.push_front (2);\n18:     dqIntegers.push_front\
  \ (1);\n19:     dqIntegers.push_front (0);\n20:\n21:     cout << \"The contents\
  \ of the deque after inserting elements \";\n22:     cout << \"at the top and bottom\
  \ are:\" << endl;\n23:\n24:     // 在屏幕上显示内容\n25:     for ( size_t nCount = 0\n26:\
  \     ; < dqIntegers.size ()\n27:     ; ++ nCount )\n28:     {\n29:         cout\
  \ << \"Element [\" << nCount << \"] = \";\n30:         cout << dqIntegers [nCount]\
