  \ (=)\n有时你想要将一个类实例的内容赋值给另一个实例，例如：\n```cpp\nDate Holiday(25, 12, 2011);\nDate AnotherHoliday(1,\
  \ 1, 2010);\nAnotherHoliday = Holiday; // 使用拷贝赋值\n```\n这会调用编译器在你的类中内置的默认赋值运算符，除非你提供了一个。根据你的类的性质，默认的拷贝构造函数可能是不够的，特别是当你的类管理着不可被拷贝的资源时。为了确保深拷贝（与拷贝构造函数一样），你需要指定一个拷贝赋值运算符：\n\
  ```cpp\nClassType& operator= (const ClassType& CopySource)\n{\n    if(this != &CopySource)\
  \ // 防止拷贝到自身\n    {\n        // 赋值运算符的实现\n    }\n    return *this;\n}\n```\n如果你的类封装了指针（如列表\
  \ 9.9 所示的 `MyString`），深拷贝是非常重要的。在缺少赋值运算符的情况下，编译器提供的默认赋值运算符会将 `char* Buffer` 中包含的地址从源拷贝到目标，而不会对所指向的内存执行深拷贝。这与缺少拷贝构造函数的情况相同。为了确保赋值过程中的深拷贝，请如列表\
  \ 12.9 所示定义拷贝赋值运算符。\n\n带有拷贝赋值运算符的来自列表 9.9 的改进版 MyString\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nclass MyString\n{\nprivate:\n    char* Buffer;\n\npublic:\n\
  \    // 构造函数\n    MyString(const char* InitialInput)\n    {\n        if(InitialInput\
  \ != NULL)\n        {\n            Buffer = new char [strlen(InitialInput) + 1];\n\
  \            strcpy(Buffer, InitialInput);\n        }\n        else\n          \
  \  Buffer = NULL;\n    }\n\n    // 插入列表 9.9 中的拷贝构造函数\n    MyString(const MyString&\
  \ CopySource);\n\n    // 拷贝赋值运算符\n    MyString& operator= (const MyString& CopySource)\n\
  \    {\n        if ((this != &CopySource) && (CopySource.Buffer != NULL))\n    \
  \    {\n            if (Buffer != NULL)\n                delete[] Buffer;\n\n  \
  \          // 通过首先分配自己的缓冲区来确保深拷贝\n             = new char [strlen(CopySource.Buffer)\
  \ + 1];\n\n            // 将从源拷贝到本地缓冲区\n            strcpy(Buffer, CopySource.Buffer);\n\
  \        }\n        return *this;\n    }\n\n    // 析析函数\n    ~MyString()\n    {\n\
  \        if (Buffer != NULL)\n            delete[] Buffer;\n    }\n\n    int GetLength()\n\
  \    {\n        return strlen(Buffer);\n    }\n\n    operator const char()\n   \
  \ {\n        return Buffer;\n    }\n};\n\nint main()\n{\n    MyString String1(\"\
  Hello \");\n    MyString String2(\" World\");\n\n    cout << \"Before assignment:\
  \ \" << endl;\n    cout << String1 << String2 << endl;\n\n    String2 = String1;\n\
  \    cout << \"After assignment String2 = String1: \" << endl;\n    cout << String1\
  \ << String2 << endl;\n\n    return 0;\n}\n```\n\n\n\n\n在实现一个管理动态分配资源（如 `char*`\
  \ C 风格字符串、动态数组等）的类时，请务必确保除了构造函数和析构函数外，还实现了（或考虑过实现）拷贝构造函数和拷贝赋值运算符。\n\n除非当类对象被复制时，你能清晰地评估资源所有权问题，否则你的类是不完全的，并且在使用时甚至是危险的。\n\
  \n### 提示\n要创建一个不可复制的类，可以将拷贝构造函数和拷贝赋值运算符声明为 `private`。仅进行声明（甚至不需要实现）就足以让编译器在所有通过传值给函数或将一个实例赋值给另一个实例来复制此类的尝试中抛出错误。\n\
  \n### 下标运算符 ([])\n\n允许通过数组风格的 `[]` 访问类的运算符被称为`下标运算符`（subscript operator）。下标运算符的典型语法如下：\n\
  \n点击此处查看代码\n\n```cpp\nreturn_type& operator [] (subscript_type& subscript);\n```\n\
  \n因此，在创建一个像 `MyString` 这样在 `char* Buffer` 中封装了字符动态数组类的类时，下标运算符使得随机访问缓冲区中的单个字符变得非常容易：\n\
  \n点击此处查看代码\n\n```cpp\nclass MyString\n{\n    // ... 其他类成员\n\npublic:\n    /*const*/\
  \ char& operator [] (int Index) /*const*/\n    {\n        // 返回 Buffer 中位置为 Index\
  \ 的字符\n    }\n};\n```\n\nListing 12.10 中的示例演示了下标运算符（`[]`）如何帮助用户使用普通的数组语义遍历 `MyString`\
  \ 实例中包含的字符。\n\nListing 12.10. 在类 MyString 中实现下标运算符 [] 以允许对 MyString::Buffer 包含的字符进行随机访问\n\
