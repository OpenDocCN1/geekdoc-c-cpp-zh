  3. 编写并演示程序，通过一个简单的程序证明：`set` 不能接受重复的条目，而 `multiset` 可以接受。\n\n## 第 20 节：STL Map 类\n\
  \n标准模板库（STL）为程序员提供了容器类，这些类有助于需要频繁和快速搜索的应用程序。\n\n本节涵盖：\n\n- 如何使用 STL `map`、`multimap`、`unordered_map`\
  \ 和 `unordered_multimap` 容器对你的帮助\n- 元素的插入、删除和查找\n- 提供自定义的排序谓词\n- 哈希表的工作原理基础\n\n\
  ### STL Map 类简介\n\n`map` 和 `multimap` 是键值对容器，允许基于键进行查找，如图图 20.1 所示。\n\n![Image](img/20fig01.jpg)\n\
  \n图 20.1 键对容器的可视化说明，每个对包含一个键和一个值。\n\n`map` 和 `multimap` 之间的区别在于，后者允许重复键，而前者只能存储唯一键。\n\
  \n为了方便快速搜索，STL 中 `map` 和 `multimap` 的实现在内部类似于二叉树。这意味着，插入到 `map` 或 `multimap` 中的元素在插入时就是排序的。这也意味着，与\
  \ `vector`（其中位置上的元素可以被另一个元素替换）不同，`map` 在给定位置上的元素不能被不同值的新元素替换。这是因为 `map` 理想情况下会根据其相对于内部树中其他元素的值，将其放置在可能不同的位置。\n\
  \n> 提示：要使用类 `std::map` 或 `std::multimap`，请包含头文件：\n\n```cpp\n#include<map>\n```\n\
  \n####  std::map 和 std::multimap 操作\n\nSTL `map` 和 `multimap` 是模板类，在使用它们的任何成员函数之前需要对其进行实例化。\n\
  \n#### 实例化 std::map 或 std::multimap\n\n实例化一个键为整数、值为字符串的 `map` 或 `multimap` 需要对模板类\
  \ `std::map` 或 `std::multimap` 进行特化。`map` 类的模板实例化需要程序员指定键类型、值类型，以及可选的用于帮助 `map`\
  \ 类在插入时对排序的谓词。因此，典型的 `map` 实例化语法如下：\n\n点击此处查看代码图像\n\n```cpp\n#include <map>\nusing\
  \ namespace std;\n...\nmap <keyType, valueType, Predicate=std::less <keyType> >\
  \ mapObject;\nmultimap <keyType, valueType, Predicate=std::less <keyType> > mmapObject;\n\
  ```\n\n因此，第三个模板参数是可选的。当你只提供键类型和值类型而忽略第三个模板参数时，`std::map` 和 `multimap` 使用 `class\
  \ std::less<>` 来定义排序标准。因此，将整数映射到字符串的 `map` 或 `multimap` 如下：\n\n点击此处查看代码图像\n\n```cpp\n\
  std::map<int, string> mapIntToString;\nstd::multimap<int, string> mmapIntToString;\n\
  ```\n\n列表 20.1 详细详细说明了实例化技术。\n\n列表 20.1 实例化将 int 键映射到字符串值的 map 和 multimap 对象\n\n\
  点击此处查看代码图像\n\n```cpp\n0: #include<map>\n1: #include<string>\n2:\n3: template<typename\
  \ KeyType>\n4: struct ReverseSort\n5: {\n6:     bool operator()(const KeyType& key1,\
  \ const KeyType& key2)\n7:     {\n8:         return (key1 > key2);\n9:     }\n10:\
  \ };\n11:\n12: int main ()\n13: {\n14:     using namespace std;\n15:\n16:     //\
  \ 类型为 int 到 string 的 map 和 multimap\n17:     map<int, string> mapIntToString;\n\
  18:     multimap<int, string> mmapIntToString;\n19:\n20:     // 作为另一个的拷贝构造的 map\
  \ 和 multimap\n21:     map<int, string> mapIntToString(mapIntToString);\n22:    \
  \ multimap<int, string> mmapIntToString(mapIntToString);\n23:\n24:     // 另一个构造的\
  \ map 和 multimap\n25:     map<int, string> mapIntToString(mapIntToString);\n26:\
  \     multimap<int, string> mmapIntToString(mapIntToString);\n27:\n28:     // 使用自定义谓词的\
  \ map 和 multimap\n29:     map<int, string, ReverseSort<int>> mapIntToString;\n30:\
  \     multimap<int, string, ReverseSort<int>> mmapIntToString;\n31:\n32:     //\
  \ 使用迭代器范围的 map 和 multimap\n33:     map<int, string, ReverseSort<int>> mapIntToString(mapIntToString.begin(),\
  \ mapIntToString.end());\n34:     multimap<int, string, ReverseSort<int>> mmapIntToString(mapIntToString.begin(),\
  \ mapIntToString.end());\n35:\n36:     // 使用反序排序的 map 和 multimap\n37:     map<int,\
  \ string, ReverseSort<int>> mmapIntToString;\n38:     return 0;\n39: }\n```\n\n\
  分析：在第 12-39 行的 `main()` 函数中，第 16-18 行定义了从 int 到 string 的 map 和 multimap。第 21-22\
  \ 行展示了通过另一个拷贝构造的 map 和 multimap。第 25-26 行展示了通过另一个构造的 map 和 multimap。第 29-30 行展示了使用自定义谓词的\
  \ map 和 multimap。第 33-34 行展示了使用迭代器范围的 map 和 multimap。第 37-38 行展示了使用反序排序的 map 和 multimap。\n\
