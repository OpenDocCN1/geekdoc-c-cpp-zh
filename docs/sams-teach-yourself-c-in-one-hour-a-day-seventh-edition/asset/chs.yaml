  \ 是 C++11 新的\n11:  ++ iElement)\n12:   cout << *iElement << ' ';\n13:\n14:  cout\
  \ << \"| Number of elements: \" << Input.size() << endl;\n15: }\n16: int main ()\n\
  17: {\n18:  list <int> listIntegers;\n19:  for (int nCount = 0; nCount < 10; ++\
  \ nCount)\n20:  listIntegers.push_back (nCount);\n21:\n22:  cout << \"Source (list)\
  \ contains:\" << endl;\n23:  DisplayContents(listIntegers);\n24:\n25:  // 初始化 vector\
