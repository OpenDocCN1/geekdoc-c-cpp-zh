  \ [5] = -9\n```\n\n分析\n\n列表 23.4 使用 `fill()` 和 `fill_n()` 函数将容器的内容初始化为两组不同的值，如第\
  \ 12 行和第 18 行所示。注意在向范围填充值之前使用了 `resize()` 函数，这本质上是创建了随后被填充了值的元素。`fill()` 算法作用于完整范围，而\
  \ `fill_n()` 则有潜力作用于部分范围。\n\n### 使用 std::generate() 将元素初始化为运行时生成的值\n\n正如同 `fill()`\
  \ 和 `fill_n()` 函数使用特定值填充集合一样，STL 算法（如 `generate()` 和 `generate_n()`）被用于使用一元函数返回的值初始化集合。你可以使用\
