  \ 行声明的用于存储用户输入的字符缓冲区具有固定（静态）的长度，即 21 个字符。由于字符串的最后一个字符需要必须是空终止符 `'\\0'`，因此缓冲区存储的最大文本长度限制为\
  \ 20。请注意第 10 行中使用 `strlen` 来计算字符串的长度。`strlen` 会遍历字符缓冲区并计算通过的字符数，直到遇到指示字符串结束的空终止符。这个空终止符是由\
  \ `cin` 在用户输入内容的末尾插入的。`strlen` 的这种行为使其变得危险，因为如果用户提供的文本超过了上述限制，它很容易越过字符数组的边界。参见第\
  \ 6 节中的列表 6.2 来学习如何实现检查以确保数组不会被写入边界之外。\n\n***\n\n## C++ 字符串：使用 `std::string`\n\n\
  C++ 标准字符串是处理文本输入——以及执行拼接等字符串操作——最高效的方法。\n\n***\n\n### 注意事项\n\n用 C 语言编写的程序（或具有深厚\
  \ C 背景的程序员用 C++ 编写）经常使用字符串拷贝函数如 `strcpy`、拼接函数如 `strcat` 以及 `strlen` 来确定字符串长度，以及其他此类函数。\n\
  \n这些函数接受 C 风格字符串作为输入，是非常危险的，因为它们会寻找空终止符，如果程序员没有确保终止空字符的存在，它们可能会超出所用字符数组的边界。\n\n\
  ***\n\nC++ 为你提供了使用 `std::string` 操控字符串的真正强大且安全的选项，如列表 4.7 所示。`std::string` 的大小不像普通\
  \ `char` 数组实现的 C 风格字符串那样是静态的，当需要在其中存储更多数据时，它可以自动扩展。\n\n列表 4.7. 使用 `std::string`\
  \ 初始化、存储用户输入、拷贝、拼接以及确定字符串长度\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: #include <string>\n2:\n3: using namespace std;\n4:\n5: int main()\n6: {\n7: \
  \    string Greetings (\"Hello std::string!\");\n8:     cout << Greetings << endl;\n\
  9:\n10:     cout << \"Enter a line of text: \" << endl;\n11:     string FirstLine;\n\
  12:     getline(cin, FirstLine);\n13:\n14:     cout << \"Enter another: \" << endl;\n\
  15:     string SecLine;\n16:     getline(cin, SecLine);\n17:\n18:     cout << \"\
  Result of concatenation: \" << endl;\n19:     string Concat = FirstLine + \" \"\
  \ + SecLine;\n20:     cout << Concat << endl;\n21:\n22:     cout << \"Copy of concatenated\
  \ string: \" << endl;\n23:     string Copy;\n24:     Copy = Concat;\n25:     cout\
  \ << Copy << endl;\n26:\n27:     cout << \"Length of concat string: \" << Concat.length()\
  \ << endl;\n28:\n29:     return 0;\n30: }\n```\n\n***\n\n***\n\n### 输出\n\n点击此处查看代码图像\n\
  ```\nHello std::string!\nEnter a line of text:\nI love\nEnter another:\nC++ strings\n\
  Result of concatenation:\nI love C++ strings\nCopy of concatenated string:\nI love\
  \ C++ strings\nLength of concat string: 18\n```\n\n***\n\n***\n\n### 分析\n\n尝试理解输出内容并将其与代码中的各种元素联系起来。在现阶段不要让新的语法特性困扰你。程序开始显示一个在第\
  \ 7 行初始化为“Hello `std::string`”的字符串。然后要求用户输入两行文本，并在第 12 行和第 16 行存储在变量 `FirstLine`\
  \ 和 `SecLine` 中。实际拼接非常简单，看起来就像第 19 行的算术加法，其中在第一行还添加了一个空格。拷贝操作是第 24 行中简单的赋值操作。确定字符串长度是通过在第\
  \ 27 行对其它的 `length()` 方法完成的。\n\n***\n\n***\n\n### Note\n\n要使用 C++ 字符串，你需要包含头文件 `string`：\n\
  ```cpp\n#include <string>\n```\n这在列表 4.7 的第 1 行也可见。\n\n***\n\n要详细学习 `std::string`\
  \ 的各种函数，请快速查看第 16 节，“STL `string` 类”。由于你还没有学习过类和模板，请忽略该节看似陌生的部分，专注于理解示例的要点。\n\n\
  ### 总结\n\n本节你学习了数组的基础知识、它们是什么以及它们可以使用哪里。你学习了如何声明数组、初始化数组、访问元素以及向元素写入值。你学习了不超出数组边界的重要性，这被称为*缓冲区溢出*。\n\
  \n动态数组是那些程序员不需要在编译时固定最大长度的数组，它们在使用时允许进行更好的内存管理。\n\n你还学习了 C 风格字符串是 `char` 数组的一种特殊情况，其结尾由空字符标记。更重要的是，你学习了\
  \ C++ 提供了更好的选项 `std::string`，它提供了方便的方法来确定长度和拼接。\n\n### 问答\n\nQ：为什么要费力初始化静态数组？\n\
  A：除非初始化，否则数组不像任何类型的变量，包含垃圾值和不可预测的值。初始化数组可以确保其中的信息具有明确且可预测的状态。\n\nQ：动态数组的元素是否需要根据第一个问题提到的原因进行初始化？\n\
  A：实际上不需要。动态数组非常智能。除非有特定的应用程序，否则元素不需要为默认值。\n\nQ：如果有选择，你会使用需要空终止符的 C 风格字符串吗？\nA：是的，除非有人拿着你的脑袋。C++\
  \ `std::string` 安全得多，并且提供的功能应该让任何优秀的程序员远离 C 风格字符串。\n\nQ：字符串的长度包含结尾的空终止符吗？\nA：不包含。字符串“Hello\
  \ World”的长度为 11，包含空格但不包含末尾的空字符。\n\nQ：我用于 C 风格字符串的数组应该是应该是？\nA：数组的大小应该比它将包含的最大字符串大一。这对于容纳最大字符串末尾的空字符至关重要。如果“Hello\
  \ World”是你的 `char` 数组将包含的最大字符串，那么数组的长度需要为 11 + 1 = 12 个字符。\n\n#### 练习\n\n工作坊提供了测验题帮助你巩固对所涵盖内容的理解，并提供了练习来提供所学内容的经验。在查看附录\
  \ D 中的答案之前，尝试回答测验和练习题，并在继续下一节之前确保你理解了答案。\n\n#### 测验\n\n\n\n\n## 1. 检查列表 4 中的 `MyNumbers`\
