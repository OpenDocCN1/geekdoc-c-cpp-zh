  \n### 分析\n\n感兴趣的加法和减法赋值运算符位于第 14 到 24 行。这些运算符允许对天数进行整数值的加减，例如在 `main()` 中所示：\n\n\
  `41: Holiday -= 19;`\n`45: Holiday += 25;`\n\n你的 `class Date` 现在允许用户像处理整数一样，对其进行添加或删除天数的操作，使用以\
  \ `int` 为参数的加法或减法赋值运算符。你甚至可以提供加法赋值运算符（`+=`）的重载版本，使其接收一个虚构类 `CDays` 的实例：\n\n点击此处查看代码图像\n\
