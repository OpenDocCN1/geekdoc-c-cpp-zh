  5. 栈指针指向顶部、中间还是底部？\n\n### Exercises\n\n1. 编写重载函数来计算球和圆柱的体积。公式如下：\n球体积：`(4 * Pi *\
  \ Radius * Radius) / 3`\n圆柱体积：`Pi * Radius * Height`\n2. 编写一个接受 `double` 数组作为输入的函数。\n\
  3. **BUG BUSTERS:** 下面代码有什么问题？\n\n```cpp\n#include <iostream>\n\nusing namespace\
  \ std;\n\nconst double Pi = 3.1416;\n\nvoid Area(double Radius, double Result)\n\
  {\n    Result = Pi * Radius * Radius;\n}\n\nint main()\n{\n    cout << \"Enter radius:\
  \ \";\n    double Radius = 0;\n    cin >> Radius;\n    double AreaFetched = 0;\n\
  \    Area(Radius, AreaFetched);\n    cout << \"The area is: \" << AreaFetched <<\
  \ endl;\n    return 0;\n}\n```\n\n\n\n\n### 4. **漏洞排查：** 下面的函数声明哪里错了？\n\n点击此处查看代码图片\n\
  \n```cpp\ndouble Area(double Pi = 3.14, double Radius);\n```\n\n### 5. 编写一个返回类型为\
  \ `void` 的函数，该函数在提供半径时仍帮助调用者计算圆的面积和周长。\n\n## 第 8 节：指针与引用的详解\n\nC++ 的最大优势之一是它允许你编写出既能抽象机器的高层应用程序，又能编写出接近硬件的程序。事实上，C++\
  \ 允许你在字节和位级别上微调应用程序的性能。\n\n理解指针和引用的工作原理，是编写能够高效利用系统资源的程序一步。\n\n在本节中，你将了解到：\n\n*\
  \ 什么是指针\n* 什么是自由存储（free store）\n* 如何使用运算符 `new` 和 `delete` 来分配和释放内存\n* 如何使用指针和动态内存分配编写稳定的应用程序\n\
  * 什么是引用\n* 指针和引用之间的区别\n* 何时使用指针以及何时使用引用\n\n### 什么是指针？\n\n简单来说，`pointer`（指针）是一个存储内存地址的变量。正如\
  \ `int` 类型的变量用于存储整数值一样，指针变量被用于存储内存地址，如图 8.1 所示。\n\n![Image](img/08fig01.jpg)\n\n\
  图 8.1. 指针可视化。\n\n因此，指针是一个变量，和所有所有变量一样，指针在内存中占据空间（在图 8.1 中，地址为 `0x101`）。指针的特殊之处在于，指针中所包含的值（在本例中为\
  \ `0x558`）被解释为内存地址。因此，指针是一个*指向*内存中某个位置的特殊变量。\n\n#### 声明指针\n\n指针作为一个变量，也需要被声明。你通常声明一个指向特定值类型的指针（例如\
  \ `int`）。这意味着指针中包含的地址指向内存中持有整数的位置。你也可以指定一个指向内存块的指针（也称为空指针）。\n\n指针作为一个变量，需要像所有变量一样被声明：\n\
  \n```cpp\nPointedType * PointerVariableName;\n```\n\n和大多数变量一样，除非你初始化指针，否则它将包含一个随机值。你不希望访问随机内存地址，因此你将指针初始化为\
  \ `NULL`。`NULL` 是一个可以进行检查的值，并且它不是一个内存地址：\n\n点击此处查看代码图片\n\n```cpp\nPointedType *\
  \ PointerVariableName = NULL; // 初始化值\n```\n\n因此，声明一个指向整数的指针将是：\n\n```cpp\nint *pInteger\
  \ = NULL; //\n```\n\n***\n\n**注意**\n\n指针和你学过的所有数据类型一样，除非经过初始化，否则它包含一个垃圾值。对于指针来说，这种垃圾值是特别危险的，因为指针的值预期包含一个地址。未初始化的指针可能导致程序访问无效的内存位置，从而导致崩溃。\n\
  \n***\n\n#### 使用引用运算符 (&) 确定变量的地址\n\n变量是语言提供的、用于处理内存中数据的工具。这一概念在第 3 节“使用变量、声明常量](#ch03.html_ch03)”中详细解释。指针也是变量，但它们是专门用于包含内存地址的特殊类型。\n\
  \n如果 `VarName` 是一个变量，`&VarName` 就会给出其值所在的内存地址。\n\n所以，如果你声明了一个整数，使用你已经非常熟悉的语法，例如：\n\
  \n```cpp\nint Age = 30;\n```\n\n`&Age` 就是该值（`30`）所在的内存地址。列表 8.1 演示了持有其值的整数变量的内存地址的概念。\n\
  \n列表 8.1. int 和 double 的地址\n\n点击此处查看代码图片\n\n***\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int Age = 30;\n6:     const\
  \ double Pi = 3.1416;\n7:\n8:     // 使用 & 找到内存地址\n9:     cout << \"Integer Age is\
  \ at: 0x\" << hex << &Age << endl;\n10:     cout << \"Double Pi is located at: 0x\"\
  \ << hex << &Pi << endl;\n11:\n12:     return 0;\n13: }\n```\n\n***\n\n**输出**\n\n\
  ```\nInteger Age is at: 0x...\nDouble Pi is located at: 0x...\n```\n\n***\n\n\n\n\
  \n你的输出地址可能与这些示例中看到的不同。事实上，在同一台计算机上每次运行应用程序时，变量的地址都可能发生变化。\n\n现在你已经学会了如何在指针变量中存储地址，很容易想象到，同一个指针变量可以被重新赋予不同的内存地址，并指向不同的值，如列表\
  \ 8.3 所示。\n\n### 列表 8.3. 将指针重新赋值给另一个变量\n\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     int Age = 30;\n6:\n7: \
  \    int* pInteger = &Age;\n8:     cout << \"pInteger points to Age now\" << endl;\n\
  9:\n10:     // 显示指针的值\n11:     cout << \"pInteger = 0x\" << hex << pInteger << endl;\n\
  12:\n13:     int DogsAge = 9;\n14:     pInteger = &DogsAge;\n15:     cout << \"\
  pInteger points to DogsAge now\" << endl;\n16:\n17:     cout << \"pInteger = 0x\"\
  \ << hex << pInteger << endl;\n18:\n19:     return 0;\n20: }\n```\n\n### 输出\n点击此处查看代码图像\n\
  ```\npInteger points to Age now\npInteger = 0x002EFB34\npInteger points to DogsAge\
  \ now\npInteger = 0x002EFB1C\n```\n\n### 分析\n该程序表明，一个整数指针 `pInteger` 可以指向任何整数。在第\
  \ 7 行，它被初始化为 `&Age`，因此包含了变量 `Age` 的地址。在第 14 行，同一个指针被赋值为 `&DogsAge`，指向内存中包含 `DogsAge`\
  \ 的另一个位置。相应地，输出表明指针的值（即所指向的地址）发生了变化，因为两个整数 `Age` 和 `DogsAge` 显然存储在内存中的不同位置，分别为 `0x002EFB34`\
  \ 和 `0x002EFB1C`。\n\n#### 使用解引用运算符 (*) 访问所指向的数据\n你有一个指向数据的指针，其中包含一个有效地址。你如何访问该位置——即如何在该位置获取或设置数据呢？答案在于使用解引用运算符（`*`）。从本质讲，如果你有一个有效指针\
  \ `pData`，使用 `*pData` 来访问指针所包含地址存储的值。运算符（`*`）在列表 8.4 访问整数值\n点击此处查看代码图像\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n5:   \
  \  int Age = 30;\n6:     int DogsAge = 9;\n7:\n8:     cout << \"Integer Age = \"\
  \ << Age << endl;\n9:     cout << \"Integer DogsAge = \" << DogsAge << endl;\n10:\n\
  11:     int* pInteger = &Age;\n12:     cout << \"pInteger points to Age\" << endl;\n\
  13:\n14:     // 显示指针的值\n15:     cout << \"pInteger = 0x\" << hex << pInteger <<\
  \ endl;\n16:\n17:     // 显示指向位置的值\n18:     cout << \"*pInteger = \" << dec << *pInteger\
  \ << endl;\n19:\n20:     pInteger = &DogsAge;\n21:     cout << \"pInteger points\
  \ to DogsAge now\" << endl;\n22:\n23:     cout << \"pInteger = 0x\" << hex << pInteger\
  \ << endl;\n24:     cout << \"*pInteger = \" << dec << *pInteger << endl;\n25:\n\
  26:     return 0;\n27: }\n```\n\n### 输出\n点击此处查看代码图像\n```\nInteger Age = 30\nInteger\
  \ DogsAge = 9\npInteger points to Age\npInteger = 0x002EFB88\n*pInteger = 30\npInteger\
  \ points to DogsAge\npInteger = 0x002EFB7C\n*pInteger = 9\n```\n\n### 分析\n除了像之前的示例\
  \ 8.3 中更改指针中的地址外，还使用解引用运算符（`*`）通过同一个指针 `pInteger` 打印这些地址的值。在第 18 行和第 24 行，`pInteger`\
  \ 所指向的整数通过解引用运算符进行访问。由于第 20 行更改了 `pInteger` 包含的地址，赋值后的指针访问了变量 `DogsAge`。\n\n当使用解引用运算符（`*`）时，应用程序本质上使用指针存储的地址作为起点，从属于整数的内存中提取\
  \ 4 个字节（因为这是一个整数指针，且 `sizeof(int)` 为 4）。因此，指针所包含地址的有效性至关重要。通过在第 11 行将指针初始化为 `&Age`，你确保了指针包含一个有效地址。当你不初始化指针时，它可以包含任何随机值（指针变量所在的内存位置的值），并且对该指针进行解引用会导致访问冲突——即访问了应用程序未授权的内存位置。\n\
  \n注意\n解引用运算符（`*`）也称为间接运算符。你在前面的示例中使用指针来读取（获取）指向位置的值。列表 8.5 操作数据\n点击此处查看代码图像\n\n\
  ```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n\
  5:     int DogsAge = 30;\n6:     cout << \"Initialized DogsAge = \" << DogsAge <<\
  \ endl;\n7:\n8:     int* pAge = &DogsAge;\n9:     cout << \"pAge points to DogsAge\"\
  \ << endl;\n10:\n11:     cout << \"Enter an age for your dog: \";\n12:\n13:    \
  \ // 将输入存储在 pAge 指向的内存\n14:     cin >> *pAge;\n15:\n16:     // 显示存储年龄的地址\n17:  \
  \   cout << \"Input stored using pAge at 0x\" << hex << pAge << endl;\n18:\n19:\
  \     cout << \"Integer DogsAge = \" << dec << DogsAge << endl;\n20:\n21:     return\
  \ 0;\n22: }\n```\n\n### 输出\n点击此处查看代码图像\n```\nInitialized DogsAge = 30\npAge points\
  \ to DogsAge\nEnter an age for your dog: 10\nInput stored using pAge at 0x0025FA18\n\
  Integer DogsAge = 10\n```\n\n### 分析\n这里的关键步骤是第 14 行，用户输入的整数保存在指针 `pAge` 存储的位置。注意，尽管你使用指针\
  \ `pAge` 存储了数字，但第 19 行显示的是变量 `DogsAge`，却显示了你使用指针存储的值。这是因为 `pAge` 指向 `DogsAge`（如第\
  \ 8 行初始化的那样）。对 `DogsAge` 存储位置以及 `pAge` 指向的内存位置进行的任何更改，都会反映在另一个上。\n\n#### 指针的 `sizeof()`\
  \ 是多少？\n你已经了解到指针只是另一个包含内存地址的变量。因此，无论指向的类型是什么，指针的内容都是地址——一个数字。地址的长度（即存储地址所需的字节数）对于给定系统是一个常量。因此，指针的\
  \ `sizeof()` 取决于编译程序的编译器和操作系统，而*不*依赖于所指向数据的性质，如列表 8.6 所示。\n\n### 列表 8.6. 证明不同类型的指针具有相同的大小\n\
  点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int\
  \ main()\n4: {\n5:     int Age = 30;\n6:     double Pi = 3.1416;\n7:     char SayYes\
  \ = 'y';\n8:\n9:     // 初始化指针为变量的地址\n10:     int* pInt = &Age;\n11:     double*\
  \ pDouble = &Pi;\n12:     char* pChar = &SayYes;\n13:\n14:     cout << \"sizeof\
  \ fundamental types -\" << endl;\n15:     cout << \"sizeof(int) = \" << sizeof(int)\
  \ << endl;\n16:     cout << \"sizeof(double) = \" << sizeof(double) << endl;\n17:\
  \     cout << \"sizeof(char) = \" << sizeof(char) << endl;\n18: }\n```\n\n\n\n```cpp\n\
  19:    cout << \"sizeof pointers to fundamental types -\" << endl;\n20:    cout\
  \ << \"sizeof(pInt) = \" << sizeof(pInt) << endl;\n21:    cout << \"sizeof(pDouble)\
  \ = \" << sizeof(pDouble) << endl;\n22:    cout << \"sizeof(pChar) = \" << sizeof(pChar)\
  \ << endl;\n23:\n24:    return 0;\n25: }\n```\n\n* *\n\n* *\n\n### Output\n\n点击此处查看代码图像\n\
  \n基础类型大小 -\n\nsizeof(int) = 4\nsizeof(double) = 8\nsizeof(char) = 1\n基础类型指针大小 -\n\
  sizeof(pInt) = 4\nsizeof(pDouble) = 4\nsizeof(pChar) = 4\n\n* *\n\n* *\n\n### Analysis\n\
  \n输出清楚地显示，尽管 `sizeof(char)` 是 1 字节而 `sizeof(double)` 是 8 字节，但 `sizeof(pointer)`\
  \ 始终恒定为 4 字节。这是因为存储地址所需的内存量是相同的，无论该地址指向的是 1 字节还是 8 字节。\n\n* *\n\n* *\n\n### Note\n\
  \n列表 8.6 显示指针的 `sizeof` 为 4 字节的输出可能与你在系统上看到的不同。该输出是在使用 32 位编译器编译代码时生成的。如果你使用 64\
  \ 位编译器并在 64 位系统上运行程序，你可能会发现你的指针变量的 `sizeof` 是 64 位——即 8 字节。\n\n* *\n\n* *\n\n##\
  \ 动态内存分配\n\n当你编写一个包含如下数组声明的程序时：\n\n点击此处查看代码图像\n\n```cpp\nint Numbers[100]; // 一个静态数组，包含\
  \ 100 个整数\n``` \n```\n\n你的程序存在两个问题：\n\n1. 你实际上限制了程序的容量，因为它无法存储超过 100 个数字。\n2. 在只需要存储\
  \ 1 个数字的情况下，你却为 100 个数字保留了空间，这降低了系统的性能。\n\n这些问题的存在是因为早先声明的数组中的内存分配是静态的，并由编译器固定的。\n\
  \n为了编写一个能够根据用户需求优化消耗内存资源的应用程序，你需要使用动态内存分配。这允许你在需要更多内存时分配更多内存，并释放多余的内存。C++ 提供了两个运算符\
  \ `new` 和 `delete` 来帮助你更好地管理应用程序的内存消耗。指针作为用于包含内存地址的变量，在高效的动态内存分配中起着至关重要的作用。\n\n\
  ### 使用运算符 new 和 delete 动态分配和释放内存\n\n你使用 `new` 来分辟新的内存块。`new` 最常用的形式在成功时返回一个指向所请求内存的指针，否则将抛出异常。使用\
  \ `new` 时，你需要指定为要分配内存的数据类型：\n\n点击此处查看代码图像\n\n```cpp\nType* Pointer = new Type; //\
  \ 为一个元素请求内存\n```\n\n你还可以指定你想要为该内存分配的元素数量（当你需要为多个一个元素分配内存时）：\n\n点击此处查看代码图像\n\n```cpp\n\
  Type* Pointer = new Type[NumElements]; // 为 NumElements 请求内存\n```\n\n因此，如果你需要分配整数，请使用以下语法：\n\
  \n点击此处查看代码图像\n\n```cpp\nint* pNumber = new int;  // 获取一个整数的指针\nint* pNumbers = new\
  \ int[10];  // 获取一个包含 10 个整数内存块的指针\n```\n\n* *\n\n* *\n\n### Note\n\n注意，`new` 表示对内存的请求。不能保证分配调用总是成功，因为这取决于系统的状态和内存资源的可用性。\n\
  \n* *\n\n* *\n\n每一个使用 `new` 进行的分配最终都需要通过 `delete` 进行等效且反向的释放操作来释放：\n\n点击此处查看代码图像\n\
  \n```cpp\nType* Pointer = new Type;\ndelete Pointer;  // 释放上方为一个 Type 实例分配的内存\n\
  ```\n\n此规则也适用于你为多个元素请求内存时：\n\n点击此处查看代码图像\n\n```cpp\nType* Pointer = new Type[NumElements];\n\
  delete[] Pointer; // 释放上方分配的块\n```\n\n* *\n\n* *\n\n### Note\n\n注意在使用 `new[...]`\
  \ 分配内存块时使用 `delete[]`，以及在使用 `new` 分配单个元素时使用 `delete`。\n\n* *\n\n* *\n\n如果你在停止使用分配的内存后不释放它，这些内存将继续保留并供你的程序使用。这减少了其他应用程序可用的系统内存，甚至可能导致你的程序运行变慢。这被称为*泄漏*（leak），应该不惜一切避免。\n\
  \n列表 8.7 展示了内存的分配和释放。\n\n### 使用 new 访问内存并释放它\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint main()\n{\n    // 分配一个整数\n    int* pAge = new int;\n\
  \n    // 使用分配的内存存储\n    cout << \"Enter dog's age: \";\n    cin >> *pAge;\n\n  \
  \  // 显示值\n    cout << \"Age \" << *pAge << \" is stored at 0x\" << hex << pAge\
  \ << endl;\n\n    // 完成后释放\n    delete pAge;\n\n    return;\n}\n```\n\n* *\n\n*\
  \ *\n\n### Output\n\n点击此处查看代码图像\n\nEnter dog's age: 9\nAge 9 is stored at 0x33\n\
  \n* *\n\n* *\n\n### Analysis\n\n第 6 行演示了使用 `new` 存储用户输入的数字。注意 `new` 返回的是指针，因此它被赋值给了。第\
  \ 13 行使用解引用运算符 `*` 显示了这个值。\n\n* *\n\n* *\n\n## Caution\n\n`delete` 不能作用于任何指针，只能作用于\
  \ `new` 返回的指针。因此，列表 8.6 中看到的指针包含有效地址，但由于它们不是通过调用 `new` 返回的，不应使用 `delete` 释放。\n\n\
  * *\n\n* *\n\n### Note\n\n注意当你使用 `new...[]` 分配元素范围时，应使用 `delete[]` 进行释放，如列表 8.8\
  \ 所示。\n\n### 使用 new[] 分配并使用 delete[] 释放\n\n点击此处查看代码图像\n\n```cpp\n#include <iostream>\n\
  #include <string>\nusing namespace std;\n\nint main()\n{\n    cout << \"Enter your\
  \ name: \";\n    string Name;\n    cin >> Name;\n\n    // 为终止空符预留 1 字节的空间\n    int\
  \ CharsToAllocate = Name.length() + 1;\n\n    // 为复制输入请求内存\n    char* CopyOfName\
  \ = new char [CharsToAllocate];\n\n    // strcpy 从空终止字符串中拷贝\n    strcpy(CopyOfName,\
  \ Name.c_str());\n\n    // 显示复制的字符串\n    cout << \"Dynamically allocated buffer\
  \ contains: \" << CopyOfName << endl;\n\n    // 完成后释放\n    delete[] CopyOfName;\n\
  \n    return 0;\n}\n```\n\n* *\n\n* *\n\n### Output\n\n点击此处查看代码图像\n\nEnter your\
  \ name: Siddhartha\nDynamically allocated buffer contains: Siddhartha\n\n\n\n\n\
  问题中最重要的行是分别用于第 11 行和第 23 行的 `new` 和 `delete[]` 运算符。此示例与其他不同之处在于，它分配了一个包含多个元素存储空间的内存块，而列表\
  \ 8.7 仅为一个元素分配了空间。对于元素数组的此类分配，完成后需要使用 `delete[]` 进行释放，以释放内存。要分配的字符数在第 11 行中计算，它比用户输入的字符数多\
  \ 1，以便容纳 C 风格字符串中至关重要的终止 NULL 字符。对这种终止 NULL 的需求在第 4 节 的“管理数组和字符串”中也得到了解释。实际的复制操作在第\
  \ 17 行通过 `strcpy` 完成，它使用 `std::string Name` 提供的 `c_str()` 函数作为输入复制到名为 `CopyOfName`\
  \ 的 `char` 缓冲区中。\n\n### 注意\n\n`new` 和 `delete` 运算符从自由存储（free store）中分配内存。自由存储是以内存池形式存在的一种内存抽象，你的应用程序可以在其中分配（即预留）内存并从中释放（即回收）内存。\n\
  \n### 增量和减运算符（++ 和 --）对指针的影响\n\n指针包含一个内存地址。例如，列表 8.3 中指向整数的指针包含 `0x002EFB34`——这是整数存放的地址。整数本身长度为\
  \ 4 字节，因此在内存中从 `0x002EFB34` 到 `0x002EFB37` 占据了四个位置。使用运算符（`++`）递增此指针不会导致指针指向 `0x002EFB35`，因为指向整数的中间在字面\
  \ supposed 是毫无意义的。\n\n对指针进行递增或递减操作被编译器解释为：你需要指向内存块中的下一个连续值（假设其类型相同），而不是指向下一个字节（除非值类型大小为\
  \ 1 字节，例如 `char`）。\n\n因此，在列表 8.3 中看到的对指针 `pInteger` 的递增会导致其增加 4 字节，即 `int` 的 `sizeof`。在此指针上使用\
  \ `++` 是告诉编译器你想让它指向下一个连续的整数。因此，递增后，指针将指向 `0x002EFB38`。同样，给此指针加上 2 将使其向前移动 2 个整数，即向前移动\
  \ 8 字节。随后你会看到指针这种行为与数组中使用的索引之间的相关性。使用运算符（`--`）递减指针展示了相同的效果——指针包含的地址值减少了所指向数据的 `sizeof`。\n\
  \n### 当你递增或递减指针时发生了什么？\n\n指针中包含的地址按所指向类型的 `sizeof` 进行递增或递减（而不一定是一个字节）。通过这种方式，编译器确保指针永远不会指向内存中放置数据的中间或结尾；它只指向开头。\n\
  \n如果指针被声明为 `Type* pType = Address;`，则 `++pType` 意味着 `pType` 包含（并指向）`Address + sizeof(Type)`。\n\
  \n参见列表 8.9，该列表解释了递增指针或对其添加偏移量的影响。\n\n列表 8.9 根据需要动态分配，检查带有偏移值的递增指针和运算符点击此处查看代码图像\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2: \n3: int main()\n\
  4: {\n5:   cout << \"How many integers you wish to enter? \";\n6:   int InputNums\
  \ = 0;\n7:   cin >> InputNums;\n8: \n9:   int* pNumbers = new int [InputNums]; //\
  \ 分请求的整数\n10:  int* pCopy = pNumbers;\n11: \n12:  cout<<\"Successfully allocated\
  \ for \"<<InputNums<< \" integers\"<<endl;\n13:  for(int Index = 0; Index < InputNums;\
  \ ++Index)\n14:  {\n15:    cout << \"Enter number \"<< Index << \": \";\n16:   \
  \ cin >> *(pNumbers + Index);\n17:  }\n18: \n19:  cout << \"Displaying all numbers\
  \ input: \" << endl;\n20:  for(int Index = 0, int* pCopy = pNumbers; Index < InputNums;\
  \ ++Index)\n21:    cout << *(pCopy++) << \" \";\n22: \n23:  cout << endl;\n24: \n\
  25:  // 使用指针完成后释放内存\n26:  delete[] pNumbers;\n27: \n28:  return 0;\n29: }\n```\n\
  \n### 输出 点击此处查看代码图像\n\n你想输入多少整数？2\n成功为 2 个整数分配了内存\n输入数字 0: 789\n输入数字 1: 575\n显示所有输入的数字：\n\
  789 575\n\n再次运行：\n你想输入多少整数？2\n成功为 2 个整数分配了内存\n输入数字 0: 789\n输入数字 1: 12\n显示所有输入的数字：\n\
  789 12\n\n### 分析\n\n在第 3 节中，你学习了将变量声明为 `const` 如何有效地确保变量的值在整个生命周期内固定为初始化值。此类变量的值无法更改，且不能作为左值。\n\
  \n指针也是变量，因此适用于变量的 `const` 关键字也适用于指针。然而，指针是一种特殊的变量，它包含内存地址，并被用于修改内存中的数据块。因此，当涉及到指针和常量时，你有以下组合：\n\
  \n所指向的数据是常量且不可更改，但指针中包含的地址可以更改——也就是说，指针也可以指向其他地方：\n\n点击此处查看代码图像\n\n```cpp\nint HoursInDay\
  \ = 24;\n```\n\n\n\n\n```cpp\nconst int* pInteger = &HoursInDay; // 不能使用 pInteger\
  \ 更改\n\nHoursInDay\n\nint MonthsInYear = 12;\n\npInteger = &MonthsInYear; // OK!\n\
  \n*pInteger = 13; // 编译失败：无法更改数据\n\nint* pAnotherPointerToInt = pInteger; // 编译失败：不能将\
  \ const 赋值给非 const\n\n```to const\n```\n\n- 指针中包含的地址是常量，无法更改，但它所指向的数据可以更改：\n\n点击此处查看代码图片\n\
  \n```cpp\nint DaysInMonth = 30;\n\n// pInteger 不能指向任何其他地方\n\nint* const pDaysInMonth\
  \ = &DaysInMonth;\n\n*pDaysInMonth = 31; // OK! 值可以更改\n\nint DaysInLunarMonth =\
  \ 28;\n\npDaysInMonth = &DaysInLunarMonth; // 编译失败：无法更改地址！\n```\n\n- 指针中包含的地址和所指向的值都是常量，无法更改（最严格的变体）：\n\
  \n点击此处查看代码图片\n\n```cpp\nint HoursInDay = 24;\n\n// 指针只能指向 HoursInDay\n\nconst int*\
  \ const pHoursInDay = &HoursInDay;\n\n*pHoursInDay = 25; // 编译失败：无法更改指向的值\n\nint\
  \ DaysInMonth = 30;\n\npHoursInDay = &DaysInMonth; // 编译失败：无法更改指针值\n```\n\n这些不同的\
  \ `const` 形式在将指针传递给函数时特别有用。函数参数需要声明为支持最高（最严格）的 `const` 级别，以确保函数在不应该修改时不会修改所指向的值。这有助于提高函数的可维护性，特别是考虑到编写代码的程序员的时间流逝和变动时。\n\
  \n### 将指针传递给函数\n\n指针是传递包含值的内存空间的有效方式，并且可以包含结果传递给函数。在与函数配合指针时，确保被调用函数只允许修改你想要修改的参数，而不允许其他参数，变得非常重要。例如，一个通过指针接收半径并计算圆面积的函数不应该被允许修改半径。这正是你有效使用\
  \ `const` 指针来控制函数允许修改和不允许修改内容的地方，如列表 8.10 所示。\n\n列表 8.10. 在半径和 Pi 以指针提供时计算圆面积使用\
  \ const 关键字\n\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: void CalcArea(const double* const pPi, // 指向 const 数据的 const 指\n\
  4:                const double* const pRadius, // 即什么都不能更改\n5:                double*\
  \ const pArea) // 修改指向的值，不修改地址\n6: {\n7:     // 在使用前检查指针！\n8:     if (pPi && pRadius\
  \ && pArea)\n9:         *pArea = (*pPi) * (*pRadius) * (*pRadius);\n10: }\n11:\n\
  12: int main()\n13: {\n14:     const double Pi = 3.1416;\n15:\n16:     cout << \"\
  Enter radius of circle: \";\n17:     double Radius = 0;\n18:     cin >> Radius;\n\
  19:\n20:     double Area = 0;\n21:     CalcArea (&Pi, &Radius, &Area);\n22:\n23:\
  \     cout << \"Area is = \" << Area << endl;\n24:\n25:     return 0;\n26: }\n```\n\
  \n### 输出\n\n点击此处查看代码图片\nEnter radius of circle: 10.5\nArea is = 346.361\n\n### 分析\n\
  \n第 3–5 行演示了 `const` 的两种形式，其中 `pRadius` 和 `pPi` 都是作为“指向 const 数据的 const 指针”提供的，因此指针地址或所指向的数据都无法被修改。`pArea`\
  \ 显然是用于存储输出的参数，因为指针的值（地址）不能修改，但所指向的数据可以修改。第 7 行展示了在使用函数指针参数之前如何对其有效性进行检查。你不希望调用者无意中将\
  \ NULL 指针作为三个参数中的任何一个发送给函数的情况，因为这会导致应用程序崩溃。\n\n### 数组与指针之间的相似性\n\n你不认为在列表 8.9 示例中，使用零基索引递增指针来访问下一个整数，这与数组索引的方式有太多相似之处吗？当你声明一个整数数组\
  \ `int MyNumbers[5];` 时，编译器为你做的是分配固定数量的内存，给你一个指向由数组变量名标识的数组第一个元素的指针。换句话说，`MyNumbers`\
  \ 是指向第一个元素 `MyNumbers[0]` 的指针。列表 8.11 强调了这一点。\n\n#### 列表 8.11 演示数组变量是一个指针\n\n点击此处查看代码图片\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4:\
  \ {\n5:     // 5 个整数数组\n6:     int MyNumbers[5];\n7:\n8:     // 赋值给指针\n9:     int*\
  \ pNumbers = MyNumbers;\n10:\n11:     // 指针包含的地址\n12:     cout << \"pNumbers = \"\
  \ << hex << pNumbers << endl;\n13:\n14:     // 数组的第一个元素\n15:     cout << \"&MyNumbers[0]\
  \ = \" << hex << MyNumbers[0] << endl;\n16:\n17:     return 0;\n18: }```\n\n###\
  \ 输出\n\n点击此处查看代码图片\npNumbers = 0x7ffee...\n&MyNumbers[0] = 0x7ffee...\n\n### 分析\n\
  \n这个简的程序演示了数组变量可以赋值给指针，正如在第 9 行所示，指针指向数组的第一个元素。\n\n如果你需要通过 `MyNumbers[1]` 访问第二个元素，你也可以通过\
  \ `*(pNumbers + 1)` 语法使用指针 `pNumbers` 来访问。第 12 行和第 15 行展示了指针的地址与数组的第一个元素是相同的。\n\n\
  由于数组变量本质上是指针，因此在函数参数中有效使用 `const` 指针来控制函数允许修改和不允许修改的内容是非常有用的。\n\n\n该应用程序包含一个五个整数的静态数组，在第\
  \ 8 行初始化了五个初始值。该程序通过两种备用方案显示此数组的内容：一种是在第 15 行使用带有间接运算符（`*`）的数组变量，另一种是在第 19 行使用带有数组操作符（`[]`）的指针变量。\n\
  \n因此，这个程序演示了数组 `MyNumbers` 和指针 `pNumbers` 实际上都表现出指针行为。换句话说，数组声明类似于创建一个指针，该指针将在一个固定的内存范围内进行操作。请注意，可以像第\
  \ 11 行那样将数组赋值给指针，但不能将指针赋值给数组，因为数组的本质是静态的，因此数组不能作为左值（l-value）。\n\n* * *\n\n* *\n\n\
  ### 注意事项\n\n务必记住，使用运算符 `new` 动态分配内存的指针，仍然需要需要使用 `delete` 运算符进行释放，即使你使用了类似于静态数组的语法。\n\
  \n如果你忘记了这一点，你的应用程序就会内存泄漏，这是糟糕的。\n\n* * *\n\n* *\n\n### 使用指针时的常见编程错误\n\nC++ 允许你动态分配内存，以便你的应用程序的内存消耗达到最优。与\
  \ C# 和 Java 等基于运行时环境的新兴语言不同，C++ 并不具备自动垃圾回收机制来清理程序已分配但无法使用的内存。由于指针可能会变得有些复杂，程序员有很多机会犯错。\n\
  \n#### 内存泄漏\n\n这可能是是 C++ 应用程序中最常见的问题之一：程序运行得越久，消耗的内存越多，系统运行得越慢。这通常发生在程序员没有确保在内存块不再需要时，通过匹配的\
  \ `delete` 调用来释放使用 `new` 动态分配的内存。\n\n这是你——程序员——的责任，要确保所有分配的内存都由你的应用程序释放。这种情况绝不应该发生：\n\
  \n点击此处查看代码图像\n\n```\nint* pNumbers = new int [5]; // 初始分配\n\n// 使用指针 pNumbers\n\n\
  ...\n\n// 忘记使用 delete[] pNumbers 释放\n\n...\n\n// 再次分配并覆盖指针\n\npNumbers = new int[10];\
  \ // 导致了之前分配的内存\n```\n\n#### 当指针未指向有效内存位置时\n\n当你使用运算符（`*`）对指针进行解引用以访问所指向的值时，你需要百分之百确定该指针包含一个有效的内存位置，否则你的程序将导致崩溃或运行异常。尽管这听起来很有逻辑，但无效指针是应用程序崩溃的常见原因。指针可能由于多种原因失效，这些原因都归于内存管理不当。指针可能无效的一个典型用例见列表\
  \ 8.13。\n\n列表 8.13. 使用无效指针的糟糕编程演示\n\n点击此处查看代码图像\n\n* * *\n\n```\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     // 未初始化的指针（错误）\n6:    \
  \ int* pTemperature;\n7:\n8:     cout << \"Is it sunny (y/n)?\" << endl;\n9:   \
  \  char UserInput = 'y';\n10:     cin >> UserInput;\n11:\n12:     if (UserInput\
  \ == 'y')\n13:     {\n14:         pTemperature = new int;\n15:         *pTemperature\
  \ = 30;\n16:     }\n17:\n18:     // 如果用户输入 'n'，pTemperature 包含无效值\n19:     cout\
  \ << \"Temperature is: \" << *pTemperature;\n20:\n21:     // 在未执行 new 的情况下也调用了 delete\n\
  22:     delete pTemperature;\n23:\n24:     return 0;\n25: }\n```\n\n* * *\n\n* *\n\
  \n### 输出\n\n点击此处查看代码图像\n\nIs it sunny (y/n)? y\n\nTemperature is: 30\n\n第二次运行：\n\
  \n点击此处查看代码图像\n\nIs it sunny (y/n)? n\n\n<CRASH!>\n\n* * *\n\n* *\n\n### 分析\n\n程序中存在许多问题，某些已经在代码中进行了注释。注意在第\
  \ 14 行中是如何分配内存并赋值给指针的，这在用户按下 `y` 表示是时按条件执行。对于用户的其他所有输入，此 `if` 块都不会执行，指针 `pTemperature`\
  \ 保持无效。因此，当用户在第二次运行时按下 `n` 时，程序崩溃了。\n\n#### 悬指针（也称为野指针）\n\n注意，任何指针在被删除后都是无效的。因此，为了避免这个问题，许多程序员在删除指针后将其赋值为\
  \ `NULL`。\n\n### 指针最佳实践\n\n关于指针，有一些基本规则会让与它们共相处变得更容易。\n\n![Image](img/t018001)\n\
  \n在学习了一些编程实践后，是时候修正列表 8.13.ch08.html_.0_list13) 和 [第 11.\n\n```\n0: #include <iostream>\n\
  1: using namespace std;\n2:\n3: int main()\n4: {\n5:     // 未初始化的指针（错误）\n6:    \
  \ int* pTemperature;\n7:\n8:     cout << \"Is it sunny (y/n)?\" << endl;\n9:   \
  \  char UserInput = 'y';\n10:     cin >> UserInput;\n11:\n12:     if (UserInput\
  \ == 'y')\n13:     {\n14:         pTemperature = new int;\n15:         *pTemperature\
  \ = 30;\n16:     }\n17:\n18:     // 如果用户输入 'n'，pTemperature 包含无效值\n19:     cout\
  \ << \"Temperature is: \" << *pTemperature;\n20:\n21:     // 在未执行 new 的情况下也调用了 delete\n\
  22:     delete pTemperature;\n23:\n24:     return 0;\n25: }\n```\n\n* * *\n\n* *\n\
  \n### 输出\n\n点击此处查看代码图像\n\nIs it sunny (y/n)? y\n\nTemperature is: 30\n\n下一次运行：\n\
  \n点击此处查看代码图像\n\nIs it sunny (y/n)? n\n\n（未崩溃）\n\n* * *\n\n* *\n\n### 分析\n\n主要的区别在于，指针在需要时才被创建——即用户按下\
  \ `y` 时——并且在创建时就进行了初始化。内存的释放也在同一个块中进行，因此不存在在未分配有效内存位置的情况下使用指针（解引用或调用 `delete`）。\n\
  \n#### 检查 new 分配请求是否成功\n\n\n\n\n\n`new` 除非请求异常巨大的内存量，或者系统处于可用内存极少的关键状态，否则都会执行成功。某些应用程序需要请求大块内存（例如数据库应用程序），通常情况下，不应假设内存分配一定会成功是非常重要的。C++\
  \ 为你提供了两种可能的方法来确保你的指针是有效的。默认方法使用异常，其中分配失败将导致抛出形式为 `std::bad_alloc` 的异常。这将导致你的应用程序执行被中断，除非你编写了`exception\
  \ handler`（异常处理程序），否则你的应用程序将带有类似于“未处理的异常”的错误信息并崩溃。\n\n第 28 ，“异常处理”详细讨论了如何解决这一问题。列表\
  \ 8.15 让你预预览一下如何使用异常处理来检查失败的分配请求。\n\n### 列表 8.15. 当 `new` 失败时处理异常并优雅退出\n\n点击此处查看代码图像\n\
  \n```\n0: #include <iostream>\n1: using namespace std;\n2:\n3: int main()\n4: {\n\
  5:     try\n6:     {\n7:         // 请求大量的内存空间\n8:         int* pAge = new int [536870911];\n\
  9:\n10:         // 使用分配的内存\n11:\n12:         delete[] pAge;\n13:     }\n14:    \
  \ catch (bad_alloc)\n15:     {\n16:         cout << \"Memory allocation failed.\
  \ Ending program\" << endl;\n17:     }\n18:     return 0;\n19: }\n```\n\n### 输出\n\
  点击此处查看代码图像\n\nMemory allocation failed. Ending program\n\n### 分析\n该程序在你的计算机上执行情况可能不同。我的环境无法成功为\
  \ 536870911 个整数分配请求的空间。我没有编写异常处理程序（第 14-17 行中的 `catch` 块），程序将结束得非常狼狈。当使用使用 Microsoft\
  \ Visual Studio 构建的调试模式二进制文件时，程序执行将产生如图 8.2\n\n图 8.2. 在列表 8.15 中缺少异常处理时的程序崩溃（使用\
  \ MSVC 编译器的调试版本）。\n\n调试模式二进制文件由开发环境插入了异常处理程序，这些程序使用上述消息进行干预。在发布模式下，操作系统（在此情况下为 Windows）会非常粗鲁地终止应用程序，如图\
  \ 8.3\n\n图 8.3. 在列表 8.15 中缺少异常处理时的程序崩溃（发布版本）。\n\n当你的应用程序如上所示崩溃时，它会被操作系统终止，在没有异常处理程序的情况下，你甚至没有机会说“再见”。\n\
  \n异常处理程序的存在使得应用程序在告知用户已遇到问题后能够进行体面的退出，而不是让操作系统显示崩溃消息。\n\n`new` 有一种变体称为 `new(nothrow)`，它不会抛出异常，而是让运算符\
  \ `new` 向指针返回 `NULL`，在使用之前可以对其有效性进行检查。参见列表 8.16。\n\n### 列表 8.16. 使用 `new(nothrow)`\
  \ 在分配失败时返回 `NULL`\n\n点击此处查看代码图像\n\n```\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     // 请求大量的内存空间，使用 nothrow 版本\n6:     int*\
  \ pAge = new(nothrow) int [0x1fffffff];\n7:\n8:     if (pAge) // 检查 pAge != NULL\n\
  9:     {\n10:         // 使用分配的内存\n11:     }\n12:     else\n13:     {\n14:      \
  \   cout << \"Memory allocation failed. Ending program\" << endl;\n15:     }\n16:\
  \     return 0;\n17: }\n```\n\n### 输出\n点击此处查看代码图像\n\nMemory allocation failed. Ending\
  \ program\n\n### 分析\n前面的代码使用了 `new(nothrow)`，它返回 `NULL` 而不是抛出 `std::bad_alloc`。`if\
  \ (pAge)` 检查确保在继续执行之前分配成功。\n\n### 什么是引用？\n引用是变量的别名。当你声明一个引用时，你正在为现有变量创建另一个名称。在引用上执行任何操作都是在原始变量上执行。\n\
  \n```cpp\nint x = 10;\nint& ref = x; // ref 是 x 的别名\nref = 20;     // x 现在是 20\n\
  ```\n\n异常处理程序的存在使得应用程序在告知用户已遇到问题后能够进行体面的退出，而不是让操作系统显示崩溃消息。\n\n#### 证明引用是别名\n输出证明了引用无论是初始化为第\
  \ 9 行所示的原始变量，还是第 12 行所示的引用，都指向同一个位置。\n\n```\n0: #include <iostream>\n1: using namespace\
  \ std;\n2:\n3: int main()\n4: {\n5:     int x =10;\n6:     int& ref = x;\n7:\n8:\
  \     ref = 20;\n9:\n10:    cout << \"x: \" << x << endl;\n11:    cout << \"ref:\
  \ \" << ref << endl;\n12:\n13:    return 0;\n14: }\n```\n\n输出:\nx: 20\nref: 20\n\
  \n### 引用有什么用？\n引用允许你操作它们所初始化的内存位置。这使得引用在编写函数时特别有用。正如你在第 7 中中学到的“使用函数组织代码”，典型的函数声明如下：\n\
  \n```\nReturnType DoSomething(Type Parameter);\n```\n\n函数 `DoSomething()` 的调用方式如下：\n\
  \n```cpp\nReturnType Result = DoSomething(argument);\n```\n\n前面的代码会导致 `argument`\
  \ 被复制到 `Parameter` 中，然后由函数 `DoSomething()` 使用。如果涉及的 `argument` 消耗大量内存，这个复制步骤可能会产生巨大的开销。如果我们能够避免或消除复制步骤，让函数直接处理调用者栈上的数据，将是理想的。引用允许你这样做。\n\
  \n没有复制步骤的函数版本如下：\n\n```\nReturnType DoSomething(Type& Parameter); // 注意引用&\n```\n\
  \n该函数将按如下方式调用：\n\n```cpp\nReturnType Result = DoSomething(argument); // 函数调用\n```\n\
  \n\n\n\n由于参数是通过引用传递的，`Parameter` 并不是 `argument` 的拷贝，而是后者的别名，类似于列表 8.17 中的 `Ref`。此外，接受引用参数的函数可以可选地使用引用参数返回结果。参见列表\
  \ 8.18 以了解函数如何使用引用代替返回值。\n\n### 列表 8.18. 通过引用参数返回平方结果的函数\n\n点击此处查看代码图片\n\n```cpp\n\
  0: #include <iostream>\n1: using namespace std;\n2:\n3: void ReturnSquare(int& Number)\n\
  4: {\n5:     Number *= Number;\n6: }\n7:\n8:\n9: int main()\n10: {\n11:     cout\
  \ << \"Enter a number you wish to square: \";\n12:     int Number = 0;\n13:    \
  \ cin >> Number;\n14:\n15:     ReturnSquare(Number);\n16:     cout << \"Square is:\
  \ \" << Number << endl;\n17:\n18:     return 0;\n19: }\n```\n\n### 输出\n\n点击此处查看代码图片\n\
  Enter a number you wish to square: 5\nSquare is: 25\n\n### 分析\n\n执行平方运算的函数位于第 3–6\
  \ 行。请注意它是如何将待平方的数字作为引用参数接收并在同一处返回结果的。如果你忘记将参数 `Number` 标记为引用（`&`），结果将无法到达调用函数 `main()`，因为\
  \ `ReturnSquare()` 将会在 `Number` 的局部拷贝上执行操作，该拷贝在函数退出时会被销毁。使用引用，你可以确保 `ReturnSquare()`\
  \ 在 `main()` 中定义 `Number` 的相同地址空间内操作。因此，即使在函数 `ReturnSquare()` 后，运算结果在 `main()`\
  \ 中也是可用的。\n\n在此示例中，包含用户发送数字的输入参数被修改了。如果你需要两个值（原始值和平方值），可以让函数接受两个参数：一个包含输入值，另一个提供平方值。\n\
  \n### 在引用上使用 const 关键字\n\n你可能需要某些不允许更改所别名原始变量值的引用。在声明此类引用时使用 `const` 是实现这一点的方法：\n\
  \n点击此处查看代码图片\n\n```cpp\nint Original = 30;\nconst int& ConstRef = Original;\nConstRef\
  \ = 40; // 不允许：ConstRef 不能改变 Original 的值\nint& Ref2 = ConstRef; // 不允许：Ref2 不是 const\n\
  const int& ConstRef2 = ConstRef; // OK\n```\n\n### 将引用引用传递给函数\n\n引用的主要优势之一是它们允许被调用函数处理未从调用函数拷贝而来的参数，从而显著提高性能。然而，由于被调用函数直接在调用函数的栈上使用参数工作，因此确保被调用函数无法更改调用端变量的值通常非常重要。定义为\
  \ `const` 的引用可以帮助你做到，正如列表 8.19 所示。`const` 引用参数不能作为左值（l-value），因此任何对其赋值的尝试都会导致编译失败。\n\
  \n### 列表 8.19. 使用 const 引用确保调用函数无法修改通过引用发送的值\n\n点击此处查看代码图片\n\n```cpp\n0: #include\
  \ <iostream>\n1: using namespace std;\n2:\n3: void CalculateSquare(const int& Number,\
  \ int& Result) // 注意 \"const\"\n4: {\n5:     Result = Number*Number;\n6: }\n7:\n\
  8: int main()\n9: {\n10:     cout << \"Enter a number you wish to square: \";\n\
  11:     int Number = 0;\n12:     cin >> Number;\n13:\n14:     int Square = 0;\n\
  15:     CalculateSquare(Number, Square);\n16:     cout << Number << \"² = \" <<\
  \ Square << endl;\n17:\n18:     return 0;\n19: }\n```\n\n### 输出\n\n点击此处查看代码图片\n\
  Enter a number you wish to square: 5\n5² = 25\n\n### 分析\n\n执行平方运算的函数位于第 3–6 行。请注意它是如何将待平方的数字作为引用参数接收并在同一处返回结果的。如果你忘记将参数\
  \ `Number` 标记为引用（`&`），结果将无法到达调用函数 `main()`，因为 `ReturnSquare()` 将会在 `Number` 的局部拷贝上执行操作，该拷贝在函数退出时会被销毁。使用引用，你可以确保\
  \ `ReturnSquare()` 在 `main()` 中定义 `Number` 的相同地址空间内操作。因此，即使在函数 `ReturnSquare()`\
  \ 后，运算结果在 `main()` 中也是可用的。\n\n在此示例中，包含用户发送数字的输入参数被修改了。如果你需要两个值（原始值和平方值），可以让函数接受两个参数：一个包含输入值，另一个提供平方值。\n\
  \n### 在引用上使用 const\n\n你可能需要某些不允许更改所别名原始变量值的引用。在声明此类引用时使用 `const` 是实现这一点的方法：\n\n\
  ```cpp\nint Original = 30;\nconst int& ConstRef = Original;\nConstRef = 40; // 不允许：ConstRef\
  \ 不能改变 Original 的值\nint& Ref2 = ConstRef; // 不允许：Ref2 不是 const\nconst int& ConstRef2\
  \ = ConstRef; // OK\n```\n\n### 将引用传递给函数\n\n引用的主要优势之一是它们允许被调用函数处理未从调用函数拷贝而来的参数，从而显著提高性能。然而，由于被调用函数直接在调用函数的栈上使用参数工作，因此确保被调用函数无法更改调用端变量的值通常非常重要。定义为\
  \ `const` 的引用可以帮助你做到，正如列表 8.19 所示。`const` 引用参数不能作为左值（l-value），因此任何对其赋值的尝试都会导致编译失败。\n\
  \n*(注：此处翻译合并了原文中重复的 Analysis 部分，已根据要求对原文中重复的文本逻辑进行了处理)*\n\n\n\n\n点击此处查看代码图像\n\n\
  ```cpp\nint Number = 30;\n\nconst int* pNumber = &Number;\n```\n\n我理解由于 `const`\
  \ 声明，我无法通过指针 `pNumber` 改变 `Number` 的值。我可以将 `pNumber` 赋值给一个非 `const` 指针，然后用它来操作整数\
  \ `Number` 中的值吗？\n\n### A. 不，你不能改变指针的 `const` 属性（const-correctness）：\n\n```cpp\n\
  int* pAnother = pNumber; // 不能将 const 指针赋值给非 const 指针\n```\n\nQ. 为什么我应该费心通过引用传递值给函数？\n\
  \n### A. 只要对你没有太大影响，你不需要这样做。但是，如果你的函数参数接收的对象非常大（字节数多），那么按值传递将是一个非常昂贵的操作。使用引用会让你的函数调用效率高得多。记住要大量使用\
  \ `const`，除非函数需要将结果存储在变量中。\n\nQ. 这两个声明之间有什么区别：\n\n点击此处查看代码图像\n\n```cpp\nint MyNumbers[100];\n\
  \nint* MyArrays[100];\n```\n\n### A. `MyNumbers` 是一个整数数组——也就是说，`MyNumbers` 是一个指向包含\
  \ 100 个整数的内存位置的指针，指向索引为 0 的第一个。它是以下代码的静态替代：\n\n```cpp\nint* MyNumbers = new int\
  \ [100]; // 动态分配数组\n\n// 使用 MyNumbers\n\ndelete MyNumbers;\n```\n\n相反，`MyArrays`\
  \ 是一个包含 100 个指针的数组，每个指针都可以指向一个整数或一个整数数组。\n\n## 工作坊 (Workshop)\n\n工作坊提供了练习题来帮助你巩固对所涵盖内容的理解，并提供了练习让你获得使用所学知识的经验。在检查\
