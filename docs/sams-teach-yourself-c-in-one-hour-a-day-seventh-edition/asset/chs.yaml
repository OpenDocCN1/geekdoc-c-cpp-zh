  \ creates Rose of 1 years\nI am Adam and am 30 years old\nI am Eve and am 28 years\
  \ old\nI am Rose and am 1 years old\n```\n\n### 分析\nAdam 是使用默认构造创建的；Eve 是使用接受 `string`\
  \ 作为参数的重载构造创建的，该参数被赋值给 `Human::Name`；而 Rose 是使用第三个重载构造创建的，它接收一个 `string` 和一个 `int`\
  \ 作为参数，其中 `int` 被赋值给 `Human::Age`。此程序演示了重载构造函数非常有用，可以帮助初始化变量。\n\n### 提示\n你可以选择不实现默认构造函数，以强制使用特定参数进行对象实例化。\n\
  \n#### 没有默认构造函数的类\n在列表 9.5 中，查看没有默认构造函数的 `class Human` 如何强制创建者提供 `Name` 和 `Age`。\n\
  \n列表 9.5. 带有重载构造函数且没有默认构造函数的类\n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1:\
  \ #include <string>\n2: using namespace std;\n3:\n4: class Human\n5: {\n6: private:\n\
  7:     // 私有成员数据:\n8:     string Name;\n9:     int Age;\n10:\n11: public:\n12:\n\
  13:     // 重载的构造函数（无默认构造函数）\n14:     Human(string HumansName, int HumansAge)\n15:\
  \     {\n16:         Name = HumansName;\n17:         Age = HumansAge;\n18:     \
