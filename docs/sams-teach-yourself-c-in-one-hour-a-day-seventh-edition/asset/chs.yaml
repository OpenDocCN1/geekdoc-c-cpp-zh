  \ 1000）。第 56 行演示了使用 `multimap::count()` 获取以 1000 为键的对的数量。\n\n### 提示：编译 `auto` 遇到错误了吗？\n\
  \nListing 20.2 中的 `DisplayContents()` 使用 C++11 关键字 `auto`。对于非 C++11 编译器，你需要将 `auto`\
  \ 替换为具体类型：\n\n```cpp\ntemplate <typename T>\nvoid DisplayContents (const T& Input)\n\
  {\n    for(typename T::const_iterator iElement = Input.cbegin()\n        ; iElement\
  \ != Input.cend()\n        ; ++ iElement )\n        cout << iElement->first << \"\
  \ -> \" << iElement->second << endl;\n}\n```\n\n关联型容器如 `map` 和 `multimap` 具有 `find`\
  \ 成员函数，允许你根据键查找值。`find` 操作的结果始终是一个迭代器：\n\n```cpp\nmultimap<int, string>::const_iterator\
  \ iPairFound = mapIntToString.find(Key);\n```\n\n你需要首先检查此迭代器以判断 `find` 是否成功并访问找到的值：\n\
  \n```cpp\nif (iPairFound != mapIntToString.end())\n{\n    cout << \"Key \" << iPairFound->first\
