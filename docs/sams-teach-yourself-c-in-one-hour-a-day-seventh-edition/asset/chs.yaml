  \ = new Car;\ndelete pRacer;\n```\n\n##12 节 运算符类型与运算符重载\n\n`class` 使你不仅能够封装数据和方法，还能对对象进行操作，正如第\
  \ 5 节](#ch05）所示。就像函数一样，运算符也可以被重载。\n\n在本节中，你将学习：\n\n• 使用 `operator` 关键字\n• 一元运算符和二元运算符\n\
  • 转换运算符\n• 无法重定义的运算符\n\n### 什么是 C++ 中的运算符？\n\n在语法层，运算符与函数没有太大区别，在于使用了 `operator`\
  \ 关键字。运算符的声明看起来非常像函数：\n\n查看代码图像\n\n```cpp\nreturn_type operator_symbol (...parameter\
  \ list);\n```\n\n在这种情况下，`operator_symbol` 可以是程序员定义的任何运算符类型。它可以是 `+`（加法）或 `&&`（逻辑与）等等。操作数有助于编译器区分不同的运算符。那么，既然支持函数，为什么\
  \ C++ 还提供运算符呢？\n\n考虑一个封装了日、月、年的 `Date` 工具类：\n\n查看代码图像\n\n```cpp\nDate Holiday (25,\
  \ 12, 2011); // 初始化为 2011 年 12 月 25 日\n```\n\n现在，如果你想让日期指向第二天——在这种情况下是 2011 年 12\
  \ 月 26 日——以下哪种方式更方便且更直观？\n\n• 选项 1（使用运算符）：\n\n```cpp\n++ Holiday;\n```\n\n• 选项 2（使用假设的\
  \ `Date::Increment()`）：\n\n查看代码图像\n\n```cpp\nHoliday.Increment(); // 2011 年 12 月\
  \ 26 日\n```\n\n显然，选项 1 优于 `Increment()` 方法。运算符机制通过提供易用性和直观性促进了消费。在 `Date` 类中实现运算符（`<`）可以帮助你比较两个日期：\n\
  \n查看代码图像\n\n```cpp\nif(Date1 < Date2)\n{\n   // 执行某些操作\n}\nelse\n{\n   // 执行其他操作\n\
  }\n```\n\n运算符的应用不仅限于管理日期的类。想象有一个加法运算符（`+`），它允许在如 `MyString` 的字符串工具类中轻松地连接字符串，如列表\
  \ 9.9 所示：\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\nMyString sayHello (\"Hello \");\n```\n\
  \n```cpp\nMyString sayWorld (\"world\");\n```\n\n`MyString sumThem (sayHello + sayWorld);`\
  \ // 使用 operator+（在列表 9.9 中不可用）\n\n***\n\n**注意**\n实现相关运算符时所付出的额外努力将在你的类被使用时的便利性上获得回报。\n\
  \n***\n\n在非常广泛的层面上，C++ 中的运算符可以分为两类：一元运算符和二元运算符。\n\n### 一元运算符\n\n顾顾名，作用于单个操作数的运算符被称为`一元运算符`。以全局函数或静态成员函数实现的一元运算符的典型定义如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nreturn_type operator operator_type (parameter_type)\n{\n\
  \    // ... （实现）\n}\n```\n\n作为类成员的一元运算符定义为：\n\n点击此处查看代码图像\n\n```cpp\nreturn_type\
  \ operator operator_type ()\n{\n    // ...（实现）\n}\n```\n\n#### 一元运算符的类型\n\n可以重载（或重定义）的一元运算符如表\
  \ 12.1 所示。\n\n表 12.1. 一元运算符\n![Image](img/12tab01.jpg)\n\n#### 编写一元增/减运算符\n\n一元前置增运算符（`++`）可以在类声明中使用以下语法进行编程：//\
  \ 一元增运算符（前置）\n\n点击此处查看代码图像\n\n```cpp\nDate& operator ++ ()\n{\n    // 运算符实现代码\n\
  \    return *this;\n}\n```\n\n另一方面，后置增运算符（`++`）具有不同的返回值和一个输入参数（该参数并不总是被使用）：\n\n\
  点击此处查看代码图像\n\n```cpp\nDate operator ++ (int)\n{\n    // 在增加日期之前，存储对象当前状态的副本\n  \
  \  Date Copy (*this);\n    // 运算符实现代码（增加此对象）\n    // 返回执行增之前的状态\n    return Copy;\n\
  }\n```\n\n前置和后置减运算符与增运算符具有相似的语法，只是在看到 `++` 的地方声明包含一个 `—`。列表 12.1 显示了一个简单的 `class\
  \ Date`，它允许使用运算符（`++`）增加日期。\n\n列表 12.1. 一个处理日、月、年并允许增减日的日历类\n\n点击此处查看代码图像\n\n***\n\
  \n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3: class Date\n4:\
  \ {\n5: private:\n6:     int Day;  // 范围: 1 - 30（假设所有月份都有 30 天！）\n7:     int Month;\n\
  8:     int Year;\n9:\n10: public:\n11:     // 初始化对象为日、月、年的构造函数\n12:     Date (int\
  \ InputDay, int InputMonth, int InputYear)\n13:         : Day (InputDay), Month\
  \ (InputMonth), Year (InputYear) {};\n14:\n15:     // 一元增运算符（前置）\n16:     Date&\
  \ operator ++ ()\n17:     {\n18:         ++Day;\n19:         return *this;\n20:\
  \     }\n21:\n22:     // 一元减运算符（前置）\n23:     Date& operator — ()\n24:     {\n25:\
  \         —Day;\n26:         return *this;\n27:     }\n28:\n29:     void DisplayDate\
  \ ()\n30:     {\n31:         cout << Day << \" / \" << Month << \" / \" << Year\
  \ << endl;\n32:     }\n33: };\n34:\n35: int main ()\n36: {\n37:     // 实例化并初始化日期对象为\
  \ 25 12 2011\n38:     Date Holiday (25, 12, 2011);\n39:\n40:     cout << \"The date\
  \ object is initialized to: \";\n41:     Holiday.DisplayDate ();\n42:\n43:     //\
  \ 应用前置增运算符\n44:     ++ Holiday;\n45:\n46:     cout << \"Date after prefix-increment\
  \ is: \";\n47:\n48:     // 显示增加后的日期\n49:     Holiday.DisplayDate ();\n50:\n51: \
  \    — Holiday;\n52:     — Holiday;\n53:\n54:     cout << \"Date after prefix-decrements\
  \ is: \";\n55:     Holiday.DisplayDate ();\n56:\n57:     return 0;\n58: }\n```\n\
