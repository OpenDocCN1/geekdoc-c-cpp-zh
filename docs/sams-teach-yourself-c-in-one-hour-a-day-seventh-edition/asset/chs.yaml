  \ to file, will close now\nContent of HelloFile.txt:\n点击此处查看代码图像\nMy text file!\n\
  Hello file!\n```\n\n**分析**\n第 7 行以 `ios_base::out` 模式打开文件——即专门用于写入。在第 9 行中测试 `open()`\
  \ 是否成功，并按照第 13 行和第 14 行所示使用插入运算符 `operator <<` 向文件写入。最后，在第 17 行关闭并返回。\n\n**注意**\n\
  列表 27.8 展示了你如何以类似于使用 `cout` 输出标准输出（控制台）的方式向文件写入内容。这表明 C++ 中的流（streams）允许以类似的方式处理设备，通过\
  \ `cout` 向显示器写入文本，就像通过 `ofstream` 向文件写入一样。\n\n### 使用 open() 和 operator>> 读取文本文件\n\
  \n要读取文件，可以使用 `fstream` 并使用标志 `ios_base::in` 打开它，或者使用 `ifstream`。列表 27.9 展示了读取由列表\
  \ 27.8 创建的 `HelloFile.txt`。\n\n列表 27.9. 从列表 27.8 创建的 FileFile.txt 读取文本\n\n点击此处查看代码图像\n\
