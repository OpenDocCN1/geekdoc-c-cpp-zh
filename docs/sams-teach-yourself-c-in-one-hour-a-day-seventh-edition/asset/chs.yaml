  \n**A.** 在 `std::bitset` 和 `vector<bool>` 都可以使用的情况下，你更倾向于使用哪种类来持有二进制标志位？\n\n***\n\
  \n# 第 V 部分：高级 C++ 概念\n\n## 第 26 节：理解智能指针\n\nC++ 程序员在管理堆（空存储）上的内存时并不一定需要使用指针类型；他们可以使用智能指针。\n\
  \n在本节中，你将学习：\n\n- 什么是智能指针以及为什么你需要它们\n- 智能指针是如何实现的\n- 不同的智能指针类型\n- 为什么你不应该使用已弃用的\
  \ `std::auto_ptr`\n- C++11 标准库智能指针 `std::unique_ptr`\n- 流行的智能库\n\n### 什么是智能指针？\n\
  \n简单来说，C++ 中的智能指针是一个重载了运算符的类，它的行为类似于传统指针。然而，它通过确保动态分配的数据得到正确且及时的销提供了额外的价值。\n\n####\
  \ 传统（原始）指针的问题\n\n与其他现代语言不同，C++ 在内存分配、释放和管理方面为程序员提供了完全的灵活性。遗憾的是，这种灵活性是一把双刃剑。一方面它让\
  \ C++ 成为一种强大的语言，另一方面允许程序员在动态分配的对象未被正确释放时创建内存相关问题，例如内存泄漏。\n\n例如：\n\n点击此处查看代码图像\n\n\
  ```cpp\nCData *pData = mObject.GetData ();\n\n/*\n问题：pData 指向的对象是使用 new 动态分配的吗？\n\
  谁将执行 delete：调用者还是被调用者？\n答案：不知道！\n*/\n\npData->Display ();\n```\n\n在前面的代码行中，没有明显的方法可以判断\
  \ `pData` 指向的内存：\n\n- 是否在 `heap` 上分配，因此需要 `deallocated`（释放）\n- 是否是调用者的 `deallocate`\
  \ 责任\n- 是否由对象的 `destructor` 自动破坏\n\n### 智能指针有什么帮助？\n\n鉴于使用传统指针和传统内存管理技术存在的问题，需要注意的是，C++\
  \ 程序员在管理堆/空存储上的数据时，并不被强制使用它们。程序员可以通过在程序中使用智能指针，选择一种更智能的方式来分配和管理动态数据。\n\n\n\n\n\n\
  点击此处查看代码图像\n\n```cpp\nsmart_pointer<CData> spData = mObject.GetData ();\n```\n\n\
  // 像常规指针一样使用智能指针！\n\n```cpp\nspData->Display ();\n\n(*spData).Display ();\n```\n\
  \n// 无需担心释放（智能指针的析构函数会为你完成工作）\n\n因此，智能指针的行为类似于常规指针（我们现在称之为 `raw pointers`，原始指针），但通过它们的`重载运算符`和`析构函数`提供了实用的功能，以确保动态分配的数据被及时销毁。\n\
  \n### 智能指针是如何实现的？\n\n这个问题目前可以简化为：“智能指针 `spData` 是如何像常规指针一样工作的？”答案是：智能指针类重载了解引用运算符\
  \ (`*` ) 和成员选择运算符 (`->` )，以便程序员像使用常规指针一样使用它们。运算符重载在第 12 节 的“运算符类型与运算符重载”中讨论过。\n\n\
  此外，为了允许你在堆上管理你任选择的类型，几乎所有良好的智能指针类都是模板类，包含其功能的通用实现。作为模板，它们是多用途的，并且可以特化以管理你任选择的类型的对象。\n\
  \n列表 26.1 是一个简单智能指针类的示例实现。\n\n列表 26.1 智能指针类的最基本组件\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\n\
  0: template <typename T>\n1: class smart_pointer\n2: {\n3: private:\n4:     T* m_pRawPointer;\n\
  5: public:\n6:     smart_pointer (T* pData) : m_pRawPointer (pData) {}    // 构造函数\n\
  7:     ~smart_pointer () {delete pData;};               // 析构函数\n8:\n9:     // 拷贝构造函数\n\
  10:    smart_pointer (const smart_pointer & anotherSP);\n11:     // 拷贝赋值运算符\n12:\
  \    smart_pointer& operator= (const smart_pointer& anotherSP);\n13:\n14:    T&\
  \ operator* () const        // 解引用运算符\n15:    {\n16:        return *(m_pRawPointer);\n\
  17:    }\n18:\n19:    T* operator-> () const    // 成员选择运算符\n20:    {\n21:      \
  \  return m_pRawPointer;\n22:    }\n23: };\n```\n\n* * *\n\n* * *\n\n分析\n\n前面的智能指针类展示了第\
  \ 14–17 行和 19–22 行中定义的两个运算符 `*` 和 `->` 的实现，这些运算符有助于该类在常规意义上充当“指针”。例如，要对 `class Tuna`\
  \ 类型的对象使用智能指针，你可以这样实例化：\n\n点击此处查看代码图像\n\n```cpp\nsmart_pointer <Tuna> pSmartTuna\
  \ (new Tuna);\n\npSmartTuna->Swim();\n\n// 或者：\n\n(*pSmartDog).Swim ();\n```\n\n\
  * * *\n\n该类 `smart_pointer` 还没有显示或实现任何使此指针类变得非常“智能”并使其使用它优于使用常规指针的功能。如第 7 行所示，构造函数接受一个指针，并将其保存为智能指针类中的内部指针对象。析构函数释放此指针，允许自动释放内存。\n\
  \n* * *\n\n注意\n\n使智能指针真正变得“智能”的实现是拷贝构造函数、赋值运算符和析构函数的实现。它们决定了智能指针对象在跨函数传递、赋值或离开作用域（即被析构）时的行为。因此，在查看一个完整的智能指针实现之前，你应该了解一些智能指针类型。\n\
  \n* * *\n\n### 智能指针的类型\n\n内存资源管理（即实现的所有权模型）是智能指针类与众不同的之处。智能指针决定了在拷贝和赋值时对资源进行的操作。最简单的实现通常会导致性能问题，而最快的实现可能不适用于所有应用程序。归根底，需要程序员理解内存管理策略。这些策略包括：\n\
  \n- 深度拷贝 (Deep copy)\n- 写时拷贝 (COW)\n- 引用计数 (Reference counted)\n- 破坏性拷贝 (Destructive\
  \ copy)\n\n#### 深度拷贝\n\n在实现深度拷贝的智能指针中，每个智能指针都持有对象的完整拷贝。当智能指针被拷贝时，对象也会被拷贝。当智能指针离开作用域时，它会释放内存。在学习\
  \ C++ 库提供的智能指针——`std::unique_ptr` 之前，让我们简要查看这些策略。\n\n当程序员选择深度拷贝智能指针时，会发生“切片”（Slicing），所示：\n\
  \n```cpp\n// 按值传递多态对象的切片示例\n// Fish 是基类，Swim() 是虚函数\nvoid FishSwim (Fish aFish)\
  \ {\n    aFish.Swim();\n} // 切片：只有 Carp 的 Fish 部分被发送给 Fish\nCarp tuna;\nFishSwim(carp);\
  \ // Carp 将被切片\n```\n\n当程序员选择深度拷贝智能指针时，切片问题将得到，所示：\n\n```cpp\n// 按类型传递多态对象的切片示例\n\
  // Fish 是基类，Swim() 是虚函数\nvoid FishSwim (Fish aFish) {\n    aFish.Swim();\n} // 切片：只有\
  \ Carp 的 Fish 部分被发送给 Fish\nCarp tuna;\nFishSwim(carp); // Carp 将被切片\n```\n\n列表 26.2\
  \ 使用深度拷贝智能指针按类型传递多态对象\n\n```cpp\n0: template <typename T>\n1: class deepcopy_smart_pointer\n\
  2: {\n3: private:\n4:     T* m_pObject;\n5: public:\n6:     //... 其他函数\n7:\n8: \
  \    // 深度拷贝的拷贝构造函数\n9:     deepcopy_smart_pointer (const deepcopy_smart_pointer&\
  \ source)\n10:    {\n11:        // Clone() 是虚函数：确保派生类的深度拷贝\n12:        m_pObject\
  \ = source->Clone();\n13:    }\n14:\n15:    // 拷贝赋值运算符\n16:    deepcopy_smart_pointer&\
  \ operator= (const deepcopy_smart_pointer& source)\n17:    {\n18:        if (m_pObject)\n\
  19:            delete m_pObject;\n20:\n21:        m_pObject = source->Clone();\n\
  22:    }\n23: };\n```\n\n分析\n\n如你所见，`deepcopy_smart_pointer` 在第 9–13 行中实现了一个拷贝构造函数，通过对象需要实现的\
  \ `Clone()` 函数来实现多态对象的深度拷贝。同样，它在第 16–22 行中实现了一个拷贝赋值运算符。为了简单起见，假设基类 `Fish` 实现的虚函数名为\
  \ `Clone`。通常，实现深度拷贝模型的智能指针会将此函数作为模板参数或函数对象提供。\n\n\n\n\n\n基于深拷贝的机制的缺点是性能。对于某些应用程序来说这可能不是因素，但对于许多其他应用程序，它可能会阻碍程序员在程序中使用智能指针。相反，他可能会简单地将基类型指针（常规指针，`Fish*`）传递给\
  \ `MakeFishSwim()` 等函数。其他指针类型尝试通过各种方式解决这个性能问题。\n\n### 写时复制机制\n\n写时复制（简称 `COW`）通过在对对象进行第一次写入尝试之前共享指针来优化深拷贝智能指针的性能。在第一次尝试调用非\
  \ `const` 函数时，COW 指针通常会对调用该非 `const` 函数的对象创建一个副本，而指针的其他实例则继续共享源对象。\n\nCOW 有其众多的一批忠实者。对于那些深信\
  \ COW 的人来说，在 `const` 和非 `const` 版本中实现运算符 (`*`) 和 (`->`) 是 COW 指针功能的关键。后者会创建一个副本。\n\
  \n问题的点在于，当您选择了一个遵循 COW 哲学的指针实现时，务必在在使用此类实现之前理解其实现细节。否则，你可能会陷入拷贝太少或拷贝过多的境地。\n\n###\
  \ 引用计数智能指针\n\n引用计数通来说是一种保持对象用户数量计数的机制。当计数减少到零时，对象会被释放。因此，引用计数是一种共享对象而无需复制它们的极佳机制。如果你曾经工作过一种名为\
  \ `COM` 的微软技术，那么引用计数的概念至少会与你相遇一次。\n\n此类智能指针在被复制时，需要增加所涉及对象的引用计数。维护这种计数的至少有两种流行方法：\n\
  \n* 引用计数维护在所指向的对象中\n* 引用计数由指针类维护在共享对象中\n\n在对象中维护引用计数的第一个变体被称为 `侵入式引用计数`（intrusive\
  \ reference counting），因为该对象需要被修改。在这种情况下，对象负责维护、增加并向任何管理它的智能指针类提供引用计数。顺便提一下，这是 `COM`\
  \ 选择的方法。第二种在共享对象中维护引用计数的变体，智能指针类可以将引用计数保留在自由存储上（例如一个动态分配的整数），并在复制时，拷贝构造函数会增加此值。\n\
  \n因此，引用计数机制使得程序员仅在在使用对象时才与智能指针操作变得很有意义。一个管理对象的智能指针和一个指向它的原始指针是一个坏主意，因为智能指针在它维护的计数降为零时（智能地）释放对象，但原始指针会继续指向不再属于你的应用程序的内存部分。同样，引用计数可能会导致其特有的问题：两个互相持有指针的对象永远不会被释放，因为它们的循环依赖将它们的引用计数保持在至少\
  \ 1。\n\n### 引用链接智能指针\n\n`引用链接`智能指针不会主动计算使用该对象的引用次数；相反，它们只需要知道数量何时变为零，以便释放对象。\n\n\
  它们被称为 `引用链接`是因为它们的实现是基于双向链链的。当通过复制现有的智能指针创建一个新的智能指针时，它会被添加到列表中。当智能指针超出作用范围或被销毁时，析构函数会从列表中取消该指针的索引。引用链接也会受到与引用计数指针类似的循环依赖问题的影响。\n\
  \n### 破坏性拷贝\n\n`破坏性拷贝`（destructive copy）是一种机制，智能指针在复制时，会将处理的对象的完整所有权转移到目标，并重置自己：\n\
  \n点击此处查看代码图像\n\n```cpp\ndestructive_copy_smartptr <SampleClass> pSmartPtr (new SampleClass\
  \ ());\n\nSomeFunc (pSmartPtr); // 所有权转移给 SomeFunc\n\n// 不要再在调用者中使用 pSmartPtr 了！\n\
  ```\n\n尽管这种机制在用起来显然不那么直观，但 `破坏性拷贝` 智能指针提供的优势是，它们确保了在任何时候，只有一个活动指针指向一个对象。因此，它们是是从函数返回指针的良好机制，并且在你可以利用其“破坏性”属性的场景中很有用。\n\
  \n`破坏性拷贝`指针的实现偏离了标准的推荐 C++ 编程技术，如 列表 26.3 所示。\n\n*** 注意\n\n`std::auto_ptr` 是目前最流行的（取决于你怎么看，可能是臭名）遵循破坏性拷贝原则的指针。这种智能指针在传递给函数或复制到另一个中之后就是没用的。\n\
  \n`std::auto_ptr` 在 C++11 中已被弃用。相反，你应该使用 `std::unique_ptr`，由于其私有的拷贝构造函数和拷贝赋值运算符，它不能按值传递。它只能作为引用参数传递。\n\
  \n***\n\n### 列表 26.3 示例破坏性拷贝智能指针\n\n点击此处查看代码图像\n\n```cpp\n0: template <typename\
  \ T>\n1: class destructivecopy_pointer\n2: {\n3: private:\n4:     T* pObject;\n\
  5: public:\n6:     destructivecopy_pointer(T* pInput):pObject(pInput) {}\n7:   \
  \  ~destructivecopy_pointer() { delete pObject; }\n8: \n9:     // 拷贝构造函数\n10:  \
  \  destructivecopy_pointer(destructivecopy_pointer& source)\n11:    {\n12:     \
  \   // 拷贝获取所有权\n13:        pObject = source.pObject;\n14: \n15:        // 销毁源\n\
  16:        source.pObject = 0;\n17:    }\n18: \n19:    // 赋值运算符\n20:    destructivecopy_pointer&\
  \ operator= (destructivecopy_pointer& rhs)\n21:    {\n22:        if (pObject !=\
  \ source.pObject)\n23:        {\n24:            delete pObject;\n25:           \
  \ pObject = source.pObject;\n26:            source.pObject = 0;\n27:        }\n\
  28:    }\n29: };\n30: \n31: int main()\n32: {\n33:     destructivecopy_pointer<int>\
  \ pNumber (new int);\n34:     destructivecopy_pointer<int> pCopy = pNumber;\n35:\
  \ \n36:     // pNumber 现在失效了\n37:     return 0;\n38: }\n```\n\n***\n\n### 分析\n\n\
  列表 26.3 描述了基于破坏拷贝的智能指针实现最重要的部分。第 10-17 行和第 20-28 行分别包含了拷贝构造函数和拷贝赋值运算符。这些函数在拷贝时会使源失效；也就是说，拷贝构造函数在拷贝后将源包含的指针设置为\
  \ NULL，因此证明了 `破坏性拷贝` 的命名。赋值运算符执行了相同的操作。因此，`pNumber` 在第 34 行赋值给另一个指针时实际上失效了。这种行为与赋值的操作是不符合直觉的。\n\
  \n\n\n\n\n拷贝构造函数和拷贝赋值运算符对于实现 Listing 26.3 所示的破坏性拷贝智能指针至关重要，引起了最多的批评。与大多数 C++ 类不同，这种智能指针类不允许其拷贝构造函数和赋值运算符接受\
  \ `const` 引用，因为它在拷贝后需要使源对象失效。这不仅偏离了传统的拷贝构造函数和赋值运算符语义，还使得该智能指针类的使用变得不符合直觉。很少有人期望在拷贝或赋值步骤后拷贝源或赋值源会被破坏。这种智能指针会破坏源对象的特性也使得它们不适用于\
  \ STL `containers`（例如 `std::vector`）或任何你可能使用的其他动态集合类。这些容器需要在内部拷贝你的内容，并最终导致指针失效。\n\
  \n因此，出于多种原因，许多程序员像躲避瘟疫一样避免`破坏性拷贝`智能指针。\n\n***\n\n***\n\n### Tip\n\n`auto_ptr` 直到现在都是\
  \ C++ 标准支持的基于破坏性拷贝的智能指针。它在 C++11 中最终被标记为弃用，你应该使用 `std::unique_ptr` 代替。\n\n***\n\n\
  ***\n\n### C++11: 使用 std::unique_ptr\n\n`std::unique_ptr` 是从 C++11 开始引入的新特性，它与 `auto_ptr`\
  \ 的微有不同在于它不允许拷贝或赋值。\n\n***\n\n***\n\n### Tip\n\n要使用类 `std::unique_ptr`，请包含头文件：\n\
  \n```cpp\n#include <memory>\n```\n\n***\n\n`unique_ptr` 是一种简单的智能指针，类似于 Listing 26.1\
  \ 中所示的类型，但它具有私有的拷贝构造函数和赋值运算符，以禁止通过按值传递其作为函数参数或通过赋值进行拷贝。Listing 26.4 演示了如何使用。\n\n\
  #### Listing 26.4 使用 std::unique_ptr\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include\
  \ <iostream>\n1: #include <memory>  // 包含此头文件以使用 std::unique_ptr\n2: using namespace\
  \ std;\n3:\n4: class Fish\n5: {\n6: public:\n7:     Fish() {cout << \"Fish: Constructed!\"\
  \ << endl;}\n8:     ~Fish() {cout << \"Fish: Destructed!\" << endl;}\n9:\n10:  \
  \   void Swim() const {cout << \"Fish swims in water\" << endl;}\n11: };\n12:\n\
  13: void MakeFishSwim(const unique_ptr<Fish>& inFish)\n14: {\n15:     inFish->Swim();\n\
  16: }\n17:\n18: int main()\n19: {\n20:     unique_ptr<Fish> smartFish (new Fish);\n\
  21:\n22:     smartFish->Swim();\n23:     MakeFishSwim(smartFish); // OK，因为 MakeFishSwim\
  \ 接受引用\n24:\n25:     unique_ptr<Fish> copySmartFish;\n26:     // copySmartFish =\
  \ smartFish; // error：operator= 是私有的\n27:\n28:     return 0;\n29: }\n```\n\n***\n\
  \n***\n\n### Output\n\n点击此处查看代码图像\n\nFish: Constructed!\nFish swims in water\nFish\
  \ swims in water\nFish: Destructed!\n\n***\n\n***\n\n### Analysis\n\n遵循输出中可见的构造和析构顺序。注意，尽管\
  \ `smartFish` 指向的对象在 `main()` 中构造（正如预期的那样），但即使你没有调用运算符 `delete`，它也被析构了（并且是自动的）。这是\
  \ `unique_ptr` 的行为，指针超出作用范围时通过析构函数释放它所拥有的对象。注意你在第 23 行如何将 `smartFish` 作为参数传递给 `MakeFishSwim()`。这并不是拷贝步骤，因为如第\
  \ 13 行所示，`MakeFishSwim()` 通过引用接收参数。如果你从第 13 行删除引用符号 `&`，将立即遇到由私有拷贝构造函数引起的编译错误。同样，如第\
  \ 26 行所示，将一个 `unique_ptr` 对象赋值给另一个由于私有的拷贝赋值运算符也是不允许的。\n\n简而言之，`unique_ptr` 比 `auto_ptr`（已在\
  \ C++11 中被弃用）更安全，因为它在拷贝或赋值期间不会使源智能指针对象失效。然而，它通过在析构时释放对象来实现简单的内存管理。\n\n***\n\n###\
  \ 常见的智能指针库\n\n很明显，C++ 标准库附带的智能指针版本无法满足每个程序员的需求。这正是为什么存在许多智能指针库的原因。你可以找到一些实用的类，例如\
  \ Boost。\n\n### 总结\n\n在本节中，你学习了如何使用智能指针来减少分配和所有权问题。你还学习了从 C++11 开始的最新的智能指针 `std::unique_ptr`。你现在知道你不应该使用\
  \ `auto_ptr`，因为它在拷贝或赋值期间会使源对象失效。\n\n### 问与答\n\n**Q:** 我需要一个指针向量。我应该选择 `auto_ptr`\
  \ 作为存储的类型吗？\n\n**A:** 可能不会，因为 `auto_ptr` 在拷贝或赋值时会使源失效。\n\n**Q:** 一个类至少需要哪些运算符才能被称为智能指针？\n\
  **A:** 以下运算符：`operator*` 和 `operator->`。\n\n**Q:** 我有一个应用程序，其中 Class1 和 Class2 持有指向对方类型的成员属性。在这种情况下我应该使用引用计数指针吗？\n\
  \n**A:** 因为循环依赖会导致引用计数无法降为零，从而使两个类的对象永久地留留在堆中。\n\n**Q:** 世界上有多少智能指针？\n**A:** 有数千个，甚至百万个。你应该只使用文档齐全且来自可靠来源的智能指针，例如\
  \ Boost。\n\n**Q:** 字符串类也动态管理自由存储上的字符数组。那么字符串类也是智能指针吗？\n**A:** 不是。这些类通常不同时实现 `operator*`\
  \ 和 `operator->`，因此不被归类为智能。\n\n### 工作坊\n\n工作坊包含练习题，有助于巩固你对所涵盖内容的理解，并提供使用所学知识的体验。在查看附录\
