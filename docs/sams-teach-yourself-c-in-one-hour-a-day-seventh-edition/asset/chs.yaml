  \ 关键字在继承层次中如何帮助我？\n\n5. `class Derived` 以 `private` 继承自 `class Base`。另一个 `class\
  \ SubDerived` 以 `public` 继承 `class Derived`。`SubDerived` 能访问 `class Base` 的公共成员吗？\n\
