  ![Image](img/27tab02.jpg)\n\n### 使用 std\n\n`std::cout` 用于写入标准输出，可能是书中最常用的流。然而，现在是时候重新审视\
  \ `cout` 并使用一些操纵符来格式化数据了。\n\n#### 使用 std 更改格式\n\n让 `cout` 以十六进制或八进制显示整数是可能的。列表 27.1\
