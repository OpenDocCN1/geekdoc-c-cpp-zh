  \n**修正后的完整译文：**\n\n[content]\n第 8 行中的数组声明语法使用了之前初始化为五的 `const integer ARRAY_LENGTH`。由于这是一个静态数组，数组的长度在编译时是固定的。因此，编译器将\
  \ `ARRAY_LENGTH` 替换为 `5`，并在编译时将 `MyArray` 视为包含五个元素的整数数组。在第 10 行到第 12 行中，用户被询问想要设置数组中的哪个元素，并且该从\
  \ 0 开始的索引被存储在整数 `ElementIndex` 中。该整数在第 14 行中用于修改数组的内容。输出显示修改索引 2 处的元素实际上修改了数组中的第三个元素，因为索引是从\
  \ 0 开始的实体。你必须习惯这一点。\n\n### 注意\n\n许多初学者 C++ 程序员会在一个包含五个整数的数组的索引 5 处分配第五个值。请注意，这超出了数组的边界，因为编译后的代码尝试访问数组中的六个元素，而该元素已超出其定义的范围。\n\
  \n这种错误被称为“栅栏错误”（fence-post error）。它的命名源于建造栅栏所需的柱子数量总是比栅栏间隔的数量多一个。\n\n### 警告\n\n\
  在 列表 4.2 中缺少了非常基础的内容：它没有检查用户输入的索引是否在数组范围内。之前的程序实际上应该验证 `ElementIndex` 是否在 `0` 到\
  \ `4` 之间，并拒绝所有其他输入。这种缺失的检查允许用户可能分配超出数组边界的值。这可能会导致应用程序——在最坏的情况下导致系统——崩溃。\n\n执行检查请参见\
  \ 第 6 节，“控制程序流](#ch06.html_ch06)”。\n\n## 使用循环访问数组元素\n\n当按顺序处理数组及其元素时，你应该使用循环来访问它们（换句话说，就是迭代）。请特别查看\
  \ 第 6 节 和 列表 6.10，以快速学习如何使用 `for` 循环高效地插入或访问数组中的元素。\n\n![图像](img/t0065_01.jpg)\n\
  \n### 多维数组\n\n我们到目前看到的数组类似于书架上的书。较长的书架可以放更多的书，较短的书架书较少。也就是说，书架的长度是定义书架容量的唯一维度，因此它是一维的。现在，如果我们使用数组来模拟如图\
  \ 4.3 所示的太阳能板数组呢？太阳能板与书架不同，它们在两个维度上扩展：长度和宽度。\n\n![图像](img/04fig03.jpg)\n\n图 4.3.\
  \ 屋顶上的太阳能板数组。\n\n正如你在图 4.3 所示，六块太阳能板被放置在一个两行三列组成的二维布局中。从一个角度来看，你可以将这种布局看作包含两个元素的数组，每个元素本身是一个包含三个面板的数组——换句话说，是数组的数组。在\
  \ C++ 中，你可以建模二维数组，但你不限于两个维度。根据你的需求和应用程序的性质，你也可以在内存中建模多维数组。\n\n### 和初始化多维数组\n\nC++\
  \ 允许你通过指定要在每个维度中保留的元素数量来声明多维数组。因此，表示图 4.3 中太阳能板的二维整数数组为：\n\n```\nint SolarPanelIDs\
  \ [2][3];\n```\n\n注意，在图 4.3 中，你还为太阳能板数组中的六块面板中的每个面板分配了从 `0` 到 `5` 的 ID。如果你按照相同的顺序初始化整数数组，它看起来像如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nint SolarPanelIDs [2][3] = {{0, 1, 2}, {3, 4, 5}};\n```\n\
  \n如你所见，你使用的初始化语法实际上与初始化两个一维数组的语法相似。注意，这不是两个，因为这是一个二维数组，我们有两个数组是因为有两行。如果这是一个由三行三列组成的数组，它看起来像这样：\n\
  \n点击此处查看代码图像\n\n```cpp\nint ThreeRowsThreeColumns [3][3] = {{-501, -502, -503},\
  \ {-504, -505, -506}, {-507, -508, -509}};\n```\n\n### 访问数组中的元素\n\n*(注：原文标题为 Accessing\
  \ Array Elements，此处翻译为“访问数组中的元素”)*\n\n*(由于提供的原始文本结尾存在大量重复和乱码，以上翻译已根据核心逻辑完成，并确保了文档的完整性)*\n\
  \n\n\n[content]\n你可以在课程 6 中的列表 6.14 中看到一种更高效的访问多维数组元素的方法，其中你使用嵌套的 `for` 循环来访问此类数组中的所有元素。使用\
  \ `for` 循环实际上更短且更不容易出错，而且程序的长度不受数组中元素数量变化的影响。\n\n## 动态数组\n\n考虑一个存储医院医疗记录的应用程序。对于程序员来说，没有好的方法可以知道他的应用程序可能需要处理的记录数量上限。他可以做出一个远大于小型医院合理限制的假设，以防万无一失。在这些情况下，他无缘故地预留了大量的内存，并降低了系统的性能。\n\
  \n关键在于不要使用我们目前看到的那些静态数组，而是选择动态数组，它可以优化内存消耗，并根据执行时的资源和内存需求进行扩展。C++ 以 `std::vector`\
  \ 的形式为你提供了非常方便且易于使用的动态数组，如列表 4.4 所示。\n\n列表 4.4. 创建整数动态数组并动态添加值\n\n点击此处查看代码图像\n\n\
  ```cpp\n0: #include <iostream>\n1: #include <vector>\n2:\n3: using namespace std;\n\
  4:\n5: int main()\n6: {\n7:     vector<int> DynArrNums (3);\n8:\n9:     DynArrNums[0]\
  \ = 365;\n10:     DynArrNums[1] = -421;\n11:     DynArrNums[2]= 789;\n12:\n13: \
  \    cout << \"Number of integers in array: \" << DynArrNums.size() << endl;\n14:\n\
  15:     cout << \"Enter another number for the array\" << endl;\n16:     int AnotherNum\
  \ = 0;\n17:     cin >> AnotherNum;\n18:     DynArrNums.push_back(AnotherNum);\n\
  19:\n20:     cout << \"Number of integers in array: \" << DynArrNums.size() << endl;\n\
  21:     cout << \"Last element in array: \";\n22:     cout << DynArrNums[DynArrNums.size()\
  \ - 1] << endl;\n23:\n24:     return 0;\n25: }\n```\n\n### 输出\n\n点击此处查看代码图像\nNumber\
  \ of integers in array: 3\nEnter another number for the array\n2011\nNumber of integers\
  \ in array: 4\nLast element in array: 2011\n\n### 分析\n\n不要担心列表 4.4 中的语法，因为 `vector`\
  \ 和模板尚未解释。尝试观察输出并将其与代码联系起来。根据输出，数组的初始大小为 3，这与第 7 行中 `vector` 的声明一致。得知这一点后，你仍然在第\
  \ 15 行要求用户输入第四个数字，有趣的是，你能够在第 18 行使用 `push_back()` 将此数字推入 `vector` 中。`vector` 会动态调整自己的的大小以适应更多数据。这可以通过数组大小增加到\
  \ 4 看到。注意使用熟悉的静态数组语法来访问 `vector` 中的数据。第 22 行使用从 0 开始的索引访问最后一个元素（考虑到是在运行时计算的位置，无论它在哪里），其中最后一个元素位于索引“size\
  \ – 1”处，而 `size()` 返回 `vector` 中元素（整数）的总数。\n\n### 注意\n\n要使用动态数组类 `std::vector`，你需要包含头文件\
  \ `vector`，这在列表 4.4 的第 1 行中所示。\n\n```cpp\n#include <vector>\n```\n\n`Vectors` 将课程\
  \ 17 中更详细地解释，“STL 动态数组类](#ch17.html_ch17)。”\n\n## C 风格字符串\n\nC 风格字符串是字符数组的一种特例。你已经看到一些以字符串字面量形式编写的\
