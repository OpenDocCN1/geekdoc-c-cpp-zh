  \n\n\n\n\n```cpp\ncout << \"Exception encountered: \" << exp.what() << endl;\n\n\
  }\n\n}\n```\n\n### 继承自 std::exception 的自定义异常类\n\n你可以抛出任何你想要的异常类型。然而，继承 `std::exception`\
  \ 有一个好处——所有现有的、通过 `catch(const std::exception&)` 能够处理 `bad_alloc`、`bad_cast` 等异常的处理器都将自动扩展以捕获你的新异常类，因为它们与异常具有共同的基类。这在列表\
  \ 28.5 中有所演示。\n\n列表 28.5. 继承自 `std::exception` 的类 `CustomException`\n\n点击此处查看代码图像\n\
  \n```cpp\n#include <exception>\n#include <iostream>\n#include <string>\nusing namespace\
  \ std;\n\nclass CustomException: public std::exception\n{\n    string Reason;\n\
  public:\n    // 构造函数，需要原因\n    CustomException(const char* why):Reason(why) {}\n\
  \n    // 重写虚函数以返回 'Reason'\n    virtual const char* what() const throw()\n    {\n\
  \        return Reason.c_str();\n    }\n};\n\ndouble Divide(double Dividend, double\
  \ Divisor)\n{\n    if(Divisor == 0)\n        throw CustomException(\"CustomException:\
  \ Dividing by 0 is a crime\");\n\n    return (Dividend / Divisor);\n}\n\nint main()\n\
  {\n    cout << \"Enter dividend: \";\n    double Dividend = 0;\n    cin >> Dividend;\n\
  \    cout << \"Enter divisor: \";\n    double Divisor = 0;\n    cin >> Divisor;\n\
  \    try\n    {\n        cout << \"Result of division is: \" << Divide(Dividend,\
  \ Divisor);\n    }\n    catch(exception& exp)// 捕获 CustomException, bad_alloc 等\n\
  \    {\n        cout << exp.what() << endl;\n        cout << \"Sorry, can't continue!\"\
  \ << endl;\n    }\n\n    return 0;\n}\n```\n\n### 输出\n\n点击此处查看代码图像\n\n```\nEnter\
  \ dividend: 2011\nEnter divisor: 0\nCustomException: Dividing by 0 is a crime\n\
  Sorry, can't continue!\n```\n\n### 分析\n\n这是列表 28.3 的版本，它在除以零时抛出一个简单的 `char*` 异常。然而，这个版本实例化了第\
  \ 5–17 行定义的 `class CustomException` 对象，它继承自 `std::exception`。注意我们的自定义异常类如何在第 13–16\
  \ 行中实现虚函数 `what()`，本质上返回了抛出异常的原因。main()` 中第 39–43 行的 `catch(exception&)` 逻辑不仅处理\
  \ `class CustomException`，还处理具有相同基类 `exception` 的其他 `bad_alloc` 类型异常。\n\n### 注意事项\n\
  \n注意列表 28.5 中第 13 行虚方法 `CustomException::what()` 的声明：\n\n```cpp\nvirtual const char*\
  \ what() const throw()\n```\n\n它以 `throw()` 结尾，这意味着该函数本身预计不会抛出异常——对于用作异常对象的类来说，这是一个非常重要且相关的限制。如果你仍然在该函数内部插入\
  \ `throw`，你可能会遇到编译器警告。\n\n如果一个函数以 `throw(int)` 结尾，意味着该函数预计会抛出 `int` 类型的异常。\n\n![图像](img/t0655_01.jpg)\n\
  \n### 总结\n\n在本节中，你学习了实用 C++ 编程中非常重要的一部分。让你的应用程序在你自己的开发环境之外保持稳定对于客户满意度和直观的用户体验至关重要，这正是异常帮助你实现的事情。你发现分配资源或内存的代码可能会失败，因此需要使其具有异常安全性。你学习了\
  \ C++ 异常类 `std::exception`，并且如果你需要编写自定义异常类，理想情况下应该继承这个类。\n\n### 问答\n\nQ. 为什么要抛出异常而不是返回错误？\n\
  \nA. 你并不总是拥有返回错误的权限。如果对 `new` 的调用失败，你需要处理由 `new` 抛出的异常以防止你的应用程序崩溃。此外，如果错误非常严重并导致你的应用程序未来的功能无法实现，你应该考虑抛出异常。\n\
  \nQ. 为什么我的异常类应该继承自 `std::exception`？\n\nA. 这当然不是强制性的，但它可以帮助你重用所有的 `catch(exception)`\
  \ 语句。\n\nQ. 它需要被捕获吗？\n\nA. 完全不需要。只需确保类型正确。\n\nQ. 构造函数可以抛出异常吗？\n\nA. 构造函数实际上没有返回值。\n\
  \nQ. 析构函数可以抛出异常吗？\n\nA. 技术上可以。但是这是一种不良好的习惯。\n\n### 工作坊\n\n工作坊包含有助于理解的测验题以及提供所学经验的练习题。\n\
  \n#### 测验\n\n1. 什么是 `std::exception`？\n2. 当 `new` 失败时抛出什么类型的异常？\n3. 在异常处理器（`catch`\
  \ 块）中分配百万个整数可以吗？\n4. 你如何捕获继承自 `std::exception` 的 `CustomException` 类型对象？\n\n####\
  \ 练习题\n\n1. **BUG BUSTER:** 下面代码有什么问题？\n2. **BUG BUSTER:** 下面代码有什么问题？\n3. **BUG\
  \ BUSTER:** 下面代码有什么问题？\n\n\n\n\n你已经学习了 C++ 编程的基础。事实上，你在理解上已经超越了理论边界，掌握了使用标准模板库（`STL`）、模板和标准库如何帮助你编写高效且紧凑的代码。现在是时候关注性能并获得编程最佳实践的视角了。\n\
  \n在本节中，你将学习：\n\n- 今天的处理器与过去有何不同\n- 你的 C++ 应用如何能够充分利用处理器的能力\n- 线程与多线程\n- C++ 编程中的最佳实践\n\
  - 在本书之外提升你的 C++ 技能\n\n## 今天的处理器有什么不同？\n\n直到最近，计算机变快是通过使用具有更快处理速度的处理器实现的，速度以赫兹（`Hz`）、兆赫兹（`Mhz`）或吉赫兹（`GHz`）衡量。例如，`Intel\
  \ 8086`（见图 29.1\n\n图 29.1。Intel 8086 微处理器。\n\n在那个处理器显著变快的时代，你的 C++ 应用也随之变快。那时很容易通过“等待游戏”来利用改进的硬件性能，并借此提高软件的响应速度。虽然今天的处理器正在变得更快，但真正的创新在于它们部署的核心数量。在编写本书时，`Intel`\
  \ 已经在销售具有六个嵌入式核心、频率为 `3.2GHz` 的 64 位微处理器，而且从核心数量来看，这种趋势是增加的，如图 29.2 所示。事实上，甚至智能手机已经拥有多核处理器。\n\
  \n![Image](img/29fig02.jpg)\n\n图 29.2。Intel 多核微处理器。\n\n你可以将多核处理器想象为一个在一个内部并行运行多个处理器的单个芯片。每个处理器都有自己的\
  \ `L1` 缓存，并且可以独立于其他处理器工作。\n\n更快的处理器提高应用程序运行速度是符合逻辑的。处理器中的多个核心是如何帮助的呢？每个核心显然都能够并行运行应用程序，但这并不会让你的应用程序运行得更快。你目前为止看到的单线程\
  \ C++ 在利用多核处理能力方面可能错过了良机。这些应用程序运行在一个线程中，因此只运行在一个核心上，如图 29.3 所示。\n\n![Image](img/29fig03.jpg)\n\
  \n图 29.3。多核处理器中的单线程应用程序。\n\n如果你的应用程序按串行执行所有用例，操作系统（`OS`）可能只会给它分配与队列中其他应用程序相同的时间，而且它将只占用处理器上的一个核心。换句话说，你的应用程序在多核处理器上的运行方式与它在过去那些年里运行的方式并无区别。\n\
  \n## 如何更好地使用多核心\n\n关键在于创建多线程应用程序。每个线程并行运行，允许 `OS` 让线程在多个核心上运行。虽然在书中中详尽（detail）讨论线程和多线程超出了本书的范围，但我可以简要介绍这个主题，为你迈向高性能计算打下基础。\n\
  \n### 什么是线程？\n\n你的应用程序代码始终运行在线程中。线程是一个同步执行实体，线程中的语句一个接一个运行。`main()` 内部的代码被认为是在执行应用程序的主线程。在这个主线程中，你可以创建可以并行运行的新线程。这种由主线程以及一个或多个并行运行线程组成的应用程序被称为多线程应用程序。\n\
  \n`OS` 规定了如何创建线程，你可以通过直接调用 `OS` 提供的 API 来创建线程。\n\n> **提示**\n> C++11 规定了线程函数，它们会替你调用\
  \ `OS` API，使你的多线程应用程序更具可移植性。\n> 如果你计划仅为一个 `OS` 编写应用程序，请检查你的 `OS` 关于创建多线程应用程序的 API。\n\
  \n> **注意**\n> 创建线程的实际行为是特定于操作系统的功能。C++11 试图通过头文件 `<thread>` 中的 `std::thread` 形式提供一种与平台无关抽象。\n\
  > 在编写本书时，大多数主流编译器对该功能的支持并不很好。此外，如果你是为一个平台编写代码，直接使用特定操作系统的线程函数更好。\n> 如果你在 C++ 应用程序中需要可移植的线程，请访问\
  \ [www.boost.org](http://www.boost.org) 查询 Boost 线程库。\n\n### 为什么要编写多线程应用程序？\n\n\
  多线程用于需要并行执行某项活动多次的应用程序。假设你是 10,000 名用户之一，正尝试在 Amazon 上购物。Amazon 的 Web 服务器显然无法同时让\
  \ 9,999 个用户等待。服务器的做法是创建多个线程同时服务用户。如果 Web 服务器运行在多核处理器上（我打赌它是这样的），线程能够充分利用可用核心，并为用户提供最优的性能。\n\
  \n多线程的另一个常见示例是在与用户交互的同时还执行某些工作的应用程序，例如通过进度条。此类应用程序通常被分为：显示和更新用户界面并接收用户输入的**用户界面线程**，以及执行工作的**工作线程**（Worker\
  \ Thread）。一个磁盘整理工具就是此类应用程序。当你按下开始按钮后，会创建一个工作线程开始扫描和整理活动。与此同时，用户界面线程显示进度并提供取消选项。注意，为了让用户界面线程显示进度，执行整理的工作线程需要定期进行通信。同样，为了在你取消时让工作线程停止，用户界面线程需要进行通信。\n\
  \n> **注意**\n> 多线程应用程序通常需要线程之间进行“对话”，以便应用程序作为一个整体运行（而不是一组互不干扰、各自为政的线程）。\n> 顺序同样重要。你不希望用户界面线程在整理工作线程结束之前结束。在某些情况下，一个线程需要等待另一个线程。例如，从数据库读取的线程应该等待写入线程完成。\n\
  > 这种让线程等待另一个的行为被称为 `thread synchronization`（线程同步）。\n\n### 线程如何交换数据？\n\n线程可以共享变量。线程可以访问全局数据。创建线程时可以传递指向共享数据的对象（`struct`\
  \ 或 `class`）的指针，如图 29.4 所示。\n\n![Image](img/29fig04.jpg)\n\n图 29.4。共享数据的工作线程和用户界面线程。\n\
  \n不同的线程可以通过访问或写入存储在内存位置中的数据进行通信，该位置所有线程都可以访问，因此是共享。在整理示例中，工作线程知道进度而用户界面线程需要被通知，工作线程可以将进度百分比存储在一个整数中，用户界面线程使用该整数显示进度。\n\
  \n这是一个非常简单的案例——一个线程创建信息，另一个线程消耗信息。但如果多个线程对同一个位置进行读写操作会发生什么呢？某些线程可能在其他线程尚未完成写入时就开始读取数据。这些数据的完整性将会受到破坏。\n\
  \n这就是为什么线程需要同步的原因。\n\n\n\n\n# 使用互斥锁和信号量同步线程\n\n线程是操作系统层面的实体，你用于同步线程的实例也是由操作系统提供的。大多数操作系统都提供了信号量（semaphores）和互斥锁（mutexes）来执行线程同步活动。\n\
  \n使用互斥锁，你通常确保一次只有一个线程访问某段代码。换句话说，互斥锁用于括起一段代码，线程必须等待，直到正在执行该代码的另一个线程完成并释放互斥锁。下一个线程获取互斥锁，完成工作并释放同一个互斥锁。\n\
  \n使用信号量，你可以控制执行某段代码的线程数量。允许一次只有一个线程访问的信号量也称为二进制信号量。\n\n***\n\n### 注意\n\n取决于你正在使用的操作系统，你可能拥有这些或更多的同步对象。例如，Windows\
  \ 提供了关键区域（critical sections），它用于括起一次只能由一个线程执行的代码。\n\n***\n\n# 多线程引起的问题\n\n多线程由于需要线程间进行良好的同步，当这种同步无效时（读：有\
  \ Bug），也可能导致许多个彻夜难眠。多线程应用程序面临的最两个常见问题是以下两个点：\n\n- **竞态条件（Race conditions）**——两个或多个线程尝试写入同一数据。谁赢了？该对象的状态是什么？\n\
  - **死锁（Deadlock）**——两个线程互相等待对方完成，导致两者都处于“等待”状态。你的应用程序挂起了。\n\n你可以通过良好的同步来避免竞态条件。通常情况下，当允许线程写入共享对象时，你必须额外小心以确保：\n\
  \n- 一次只有一个线程在写入。\n- 在写入线程完成之前，不允许任何线程读取该对象。\n\n通过确保在任何情况下都没有两个线程互相等待，你可以避免死锁。你可以设置一个主线程来同步工作线程，或者编写程序使得任务在线程之间分布并产生清晰的负载分布。线程\
  \ `A` 可以等待 `B`，但 `B` 永远不应该等待 `A`。\n\n编写多线程应用程序本身就是一门专业。因此，详细向你解释这个有趣且令人兴奋的话题超出了本书的范围。你应该参考关于该主题的大量在线文档，或者通过实践编程来学习多线程。一旦你掌握了它，对于未来发布的多核处理器，你将自动让你的\
  \ C++ 应用处于最优位置。\n\n# 编写出色的 C++ 代码\n\nC++ 自从最初构想以来不仅发生了显著演变，主要编译器制造商的标准化努力以及工具和函数的可用性帮助你编写紧凑整洁的\
  \ C++ 代码。编写可读且可靠的 C++ 应用程序确实容易的。\n\n以下是帮助你创建良好的 C++ 应用程序的最佳实践短列表：\n\n- 给你的变量起有意义的名字（对他人也对你如此）。多花几秒给变量起更好的名字是值得的。\n\
  - 始终初始化如 `int`、`float` 等变量。\n- 始终将指针值初始化为 `NULL` 或有效地址——例如由运算符 `new` 返回的地址。\n- 使用数组时，永远不要超过数组缓冲区的边界。这被称为缓冲区溢出，可以被用作安全漏洞。\n\
  - 不要使用 C 风格的 `char*` 字符串缓冲区或如 `strlen()` 和 `strcpy()` 等函数。`std::string` 更安全并提供了许多实用的实用方法，包括帮助你查找长度、复制和追加的方法。\n\
  - 仅在你确定它将包含的元素数量时才使用静态数组。如果你不确定，请选择动态数组如 `std::vector`。\n- 在声明和定义以非 POD（普通旧数据）类型作为输入的函数时，考虑将参数声明为引用参数，以避免在调用函数时出现不必要的拷贝步骤。\n\
  - 如果你的类包含原始指针成员（或多个成员），考虑在拷贝或赋值发生时如何管理内存资源所有权。也就是说，考虑拷贝构造函数和拷贝赋值运算符。\n- 在编写管理动态数组或类似的工具类时，记住编写移动构造函数和移动赋值运算符以获得更好的性能。\n\
  - 记住让你的代码是 `const` 正确的。一个 `get()` 函数理想情况下不应该能够修改类成员，因此它应该是 `const` 的。同样，函数参数应该是\
  \ `const` 引用，除非你想改变它们包含的值。\n- 避免使用原始指针。尽可能选择合适的智能指针。\n- 在编写工具类时，花精力支持所有那些让消费和使用该类变得容易的运算符。\n\
  - 在有选项的情况下，选择模板版本而不是宏。模板是类型安全且通用的。\n- 在编写一个将被容器（如 vector 或 list）收集，或用作 map 中的键元素使用的类时，记住支持\
  \ `operator<`，这将有助于定义默认排序标准。\n- 如果你的 lambda 函数变得太大，你可能应该考虑将其转换为函数对象——即一个以 `operator()`\
  \ 作为仿函数的类，这样是可重用且具有单一维护点的。\n- 永远不要认为运算符 `new` 的成功理所当然。执行资源分配的代码应该始终是异常安全的——在 `try`\
  \ 中括起并有相应的 `catch()` 块。\n- 永远不要在类的析构函数中 `throw`。\n\n这不是一个完整的列表，但它涵盖了某些帮助你编写良好且可维护的\
  \ C++ 代码的重要点。\n\n# 学习 C++ 并不于此！\n\n恭喜你，你在学习 C++ 方面取得了巨大进展。继续下去最好的方法是编程！\n\nC++ 是一种复杂的语言。你编写得越多，对背后工作原理的理解就越高。具有智能提示功能的开发环境如\
  \ Visual Studio 将满足你的好奇心——例如向你展示尚未看到的类的成员。是时候实践！\n\n## 在线文档\n\n如果你需要更多关于 STL 容器签名、方法和算法细节的信息，访问\
  \ MSDN ([`msdn.microsoft.com/`](http://msdn.microsoft.com/))，它对标准模板库有很好的覆盖。\n\n\
  ***\n\n## 提示\n\n在 MSDN 上阅读 STL 文档时，记住选择正确的 Visual Studio 版本，因为 C++11 支持从 Visual\
