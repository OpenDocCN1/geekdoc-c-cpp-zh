  \ = new int;  // 在自由存储（free store）上动态分配的整数\n\ndelete pNumber;  // 释放内存\n\nHuman*\
  \ pAnotherHuman = new Human(); // 动态分配的 Human\n\ndelete pAnotherHuman;  // 释放为 Human\
  \ 分配的内存\n```\n\n## 使用点运算符 . 访问成员\n\n人类的一个例子可以是 `Tom`，男性，1970 年出生于阿拉拉马州。实例 `Tom`\
  \ 是 `class Human` 的一个对象，它是类在现实中（即运行时）的化身：\n\n```cpp\nHuman Tom;  // 一个 Human 实例\n\
  ```\n\n正如类声明所示，`Tom` 拥有如 `DateOfBirth` 等属性，可以使用点运算符（`.`）访问：\n\n```cpp\nTom.DateOfBirth\
  \ = \"1970\";\n```\n\n这是因为属性 `DateOfBirth` 属于 `class Human`，是类声明中其蓝图的一部分。该属性只有在对象实例化后，在现实中——即在运行时——才存在。点运算符（`.`）可以帮助你访问对象的属性。\n\
  \n对于 `IntroduceSelf()` 等方法也是如此：\n\n```cpp\nTom.IntroduceSelf();\n```\n\n如果你有一个指向\
  \ `Human` 类实例的指针 `pTom`，你可以使用指针运算符（`->`）访问成员（如下一节所示），或者使用间接运算符（`*`）在点运算符后引用对象。\n\
  \n点击此处查看代码图像\n\n```cpp\nHuman* pTom = new Human();\n\n(*pTom).IntroduceSelf();\n\
  ```\n\n## 使用指针运算符 (->) 访问成员\n\n如果对象已经使用 `new` 在自由存储上实例化，或者你有一个指向对象的指针，那么你可以使用指针运算符（`->`）访问成员属性和函数：\n\
  \n点击此处查看代码图像\n\n```cpp\nHuman* pTom = new Human();\n\npTom->DateOfBirth = \"1970\"\
  ;\n\npTom->IntroduceSelf();\n\ndelete pTom;\n```\n\n// 或者，当你有一个指针时：\n\n```cpp\n\
  Human Tom;\n\nHuman* pTom = &Tom; // 使用引用运算符& 赋值地址\n\npTom->DateOfBirth = \"1970\"\
  ; // 等同于 Tom.DateOfBirth = \"1970\";\n\npTom->IntroduceSelf(); // 等同于 Tom.IntroduceSelf();\n\
  ```\n\n包含 `private` 和 `public` 等关键字的可编译的 `class Human` 形式由列表 9.1 所示。\n\n列表 9.1.\
  \ 一个可编译的类 Human\n\n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <string>\n2: using namespace std;\n3:\n4: class Human\n5: {\n6: private:\n7: \
  \    string Name;\n8:     int Age;\n9:\n10: public:\n11:     void SetName (string\
  \ HumansName)\n12:     {\n13:         Name = HumansName;\n14:     }\n15:\n16:  \
  \   void SetAge(int HumansAge)\n17:     {\n18:         Age = HumansAge;\n19:   \
  \  }\n20:\n21:     void IntroduceSelf()\n22:     {\n23:         cout << \"I am \"\
  \ + Name << \" and am \";\n24:         cout << Age << \" years old\" << endl;\n\
  25:     }\n26: };\n27:\n28: int main()\n29: {\n30:     // 一个属性 Name 为 \"Adam\" 的\
  \ Human 类对象\n31:     Human FirstMan;\n32:     FirstMan.SetName(\"Adam\");\n33: \
  \    FirstMan.SetAge(30);\n34:\n35:     // 一个属性 Name 为 \"Eve\" 的 Human 类对象\n36:\
  \     Human FirstWoman;\n37:     FirstWoman.SetName(\"Eve\");\n38:     FirstWoman.SetAge\
  \ (28);\n39:\n40:     FirstMan.IntroduceSelf();\n41:     FirstWoman.IntroduceSelf();\n\
  42: }\n```\n\n***\n\n输出\n\n点击此处查看代码图像\n\n```\nI am Adam and am 30 years old\nI am\
  \ Eve and am 28 years old\n```\n\n***\n\n### 分析\n\n第 0–26 行显示了 `Human` 的定义。类有两个\
  \ `private` 属性：`Name` 和 `Age`。它有三个 `public` 方法：`SetName`、`SetAge` 和 `IntroduceSelf`。\n\
  \n在 `main()` 函数中，创建了两个 `Human` 实例：`FirstMan` 和 `FirstWoman`。使用点运算符设置它们的属性，并分别调用了\
  \ `IntroduceSelf()`。\n\n第 30–42 行显示了如何使用指针运算符（`->`）。使用引用运算符 `&` 将 `FirstMan` 的地址赋值给\
  \ `pTom`。然后调用 `pTom->DateOfBirth` 和 `pTom->IntroduceSelf()`，这等同于对对象本身使用点运算符。\n\n\
  `private` 和 `public` 关键字用于控制类的成员。`private` 成员只能由类内部的方法访问，而 `public` 成员可以从类外部访问。这是面向对象编程中的一个基本概念，被称为封装。\n\
  \n该示例演示了如何保护类的内部状态，同时提供用于交互的公共接口。这防止了对数据的意外或未经授权的修改，并确保对象处于有效状态。\n\n在 C++ 中，类的默认访问修饰符是\
  \ `private`。\n\n\n\n\n```cpp\nint Age;\n\npublic:\n\n    void SetAge(int InputAge)\n\
  \    {\n        if (InputAge > 0)\n            Age = InputAge;\n    }\n};\n```\n\
  \n因此，C++ 允许类的设计者控制如何访问和操作类的数据属性。\n\n## 通过关键字 `private` 实现数据抽象\n\n虽然 C++ 允许你将类设计为一个容器，封装数据以及操作这些数据的方法，但它同时也赋予了你权力，通过\
  \ `private` 关键字来决定哪些信息是外部世界无法触及的（即在类外部不可用）。同时，你也有可能通过你声明为 `public` 的方法，允许对声明为 `private`\
  \ 的信息进行受控的访问。因此，你对类的实现可以抽象出你认为外部世界——其他类和如 `main()` 等函数——不需要知道的内容。\n\n回到关于 `Human::Age`\
  \ 为私有成员的示例，你知道即使在现实中，许多人也不愿意透露真实年龄。如果要求 `class Human` 出一个比当前年龄小两岁的年龄，它可以通过使用 `Human::Age`\
  \ 参数的公共函数 `GetAge()` 轻松做到：将其减去二并提供结果，如 列表 9.2 所示。\n\n列表 9.2. 类 Human 模型：从用户处抽象真实年龄并报告一个较小的年龄\n\
  \n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n2:\n3:\
  \ class Human\n4: {\n5: private:\n6:     // 私有成员数据:\n7:     int Age;\n8:\n9: public:\n\
  10:     void SetAge(int InputAge)\n11:     {\n12:         Age = InputAge;\n13: \
  \    }\n14:\n15:     // Human 谎报了他的年龄（如果超过 30 岁）\n16:     int GetAge()\n17:    \
  \ {\n18:         if (Age > 30)\n19:             return (Age - 2);\n20:         else\n\
  21:             return Age;\n22:     }\n23: };\n24:\n25: int main()\n26: {\n27:\
  \     Human FirstMan;\n28:     FirstMan.SetAge(35);\n29:\n30:     Human FirstWoman;\n\
  31:     FirstWoman.SetAge(22);\n32:\n33:     cout << \"Age of FirstMan \" << FirstMan.GetAge()\
  \ << endl;\n34:     cout << \"Age of FirstWoman \" << FirstWoman.GetAge() << endl;\n\
  35:\n36:     return 0;\n37: }\n```\n\n输出\n点击此处查看代码图像\nAge of FirstMan 33\nAge of\
  \ FirstWoman 22\n\n### 分析\n\n请注意第 16 行的公共方法 `Human::GetAge()`。由于私有整数成员 `Human::Age`\
  \ 中包含的实际年龄无法直接访问，该类的外部用户查询 `class Human` 对象的 `Age` 属性的唯一途径就是通过 `GetAge()` 方法。因此，存储在\
  \ `Human::Age` 中的实际年龄已从外部世界抽象化。\n\n抽象是面向对象编程语言中一个非常重要的概念。它赋予了程序员决定类的哪些属性需要保持仅对类及其成员可见，而类外部的任何人（声明为其“朋友”的除外）无法访问的权力。\n\
  \n## 构造函数\n\n构造函数是在对象创建时被调用的特殊函数（或方法）。与函数一样，构造函数也可以重载。\n\n### 声明和实现构造函数\n\n构造函数是一个与类同且没有没有值的特殊函数。因此，`class\
  \ Human` 有一个如下声明的构造函数：\n\n```cpp\nclass Human\n{\npublic:\n    Human(); // 构造函数的声明\n\
  };\n```\n\n此构造函数可以在类内内联实现，也可以在类外部实现。类内部的实现或定义如下：\n\n```cpp\nclass Human\n{\npublic:\n\
  \    Human()\n    {\n        // 构造函数写在这里\n    }\n};\n```\n\n允许你在类外定义构造函数的变体形式如下：\n\
  \n```cpp\nclass Human\n{\npublic:\n    Human(); // 构造函数声明\n};\n\n// 构造函数定义（实现）\n\
  Human::Human()\n{\n    // 构造函数写在这里\n}\n```\n\n`::` 被称为作用域解析运算符。例如，`Human::Age` 指的是\
  \ `Human` 范围内的 `Age`。另一方面，`Human::Age` 指的是全局范围内的另一个 `Age`。\n\n### 何时以及如何使用构造函数\n\
  \n构造函数在对象创建时总是被调用的。这使得构造函数成为你将整数、指针等类变量初始化为已知值的完美位置。再次查看 列表 9.2。注意，如果你忘记了 `SetAge()`，整数变量\
  \ `Human::Age` 将包含一个未知的垃圾值，因为变量尚未初始化（尝试注释掉第 28 行和第 31 行进行测试）。列表 9.3 使用构造函数初始化变量\n\
  \n列表 9.3. 使用构造函数初始化变量\n点击此处查看代码图像\n\n```cpp\n0: #include <iostream>\n1: #include\
  \ <string>\n2: using namespace std;\n3:\n4: class Human\n5: {\n6: private:\n7: \
  \    // 私有成员数据:\n8:     string Name;\n9:     int Age;\n10:\n11: public:\n12:   \
  \  // 构造函数\n13:     Human()\n14:         Age = 0; // 初始化为 0\n15:         cout <<\
  \ \"Constructed an instance of class Human\" << endl;\n16:     }\n17:\n18:     void\
  \ SetName(string HumansName)\n19:     {\n20:         Name = HumansName;\n21:   \
  \  }\n22:\n23:     void SetAge(int HumansAge)\n24:     {\n25:         Age = HumansAge;\n\
  26:     }\n27:\n28:     void IntroduceSelf()\n29:     {\n30:         cout << \"\
  I am \" << Name << \" am \";\n31:         cout << Age << \" years old\" << endl;\n\
  32:     }\n33: };\n34:\n35: int main()\n36: {\n37:     Human FirstMan;\n38:    \
  \ FirstMan.SetName(\"Adam\");\n39:     FirstMan.SetAge(30);\n40:\n41:     Human\
  \ FirstWoman;\n42:     FirstWoman.SetName(\"Eve\");\n43:     FirstWoman.SetAge(28);\n\
  44:\n45:     FirstMan.IntroduceSelf();\n46:     FirstWoman.IntroduceSelf();\n47:\
  \ }\n```\n\n输出\n点击此处查看代码图像\nConstructed an instance of class Human\nConstructed\
  \ an instance of class Human\nI am Adam and am 30 years old\nI am Eve and am 28\
  \ years old\n\n\n\n\n由于构造函数可以像函数一样被重载，我们可以创建一个构造函数，要求在创建 `Human` 对象时传入一个名称作为参数，例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Human\n{\npublic:\n   Human()\n   {\n        // 默认构造函数代码\n\
  \   }\n   Human(string HumansName)\n   {\n        // 重载的构造函数代码\n   }\n};\n```\n\n\
  列表 9.4 演示了重载构造函数的应用，即在构造时提供名称来创建 `class Human` 的对象。\n\n列表 9.4. 带有多个构造函数的 Human 类\n\
  \n点击此处查看代码图片\n\n```cpp\n0: #include <iostream>\n1: #include <string>\n2: using namespace\
  \ std;\n3:\n4: class Human\n5: {\n6: private:\n7:     // 私有成员数据:\n8:     string\
  \ Name;\n9:     int Age;\n10:\n11: public:\n12:     // 构造函数\n13:     Human()\n14:\
  \     {\n15:         Age = 0; // 初始化以确保没有垃圾值\n16:         cout << \"Default constructor\
  \ creates an instance of Human\" << endl;\n17:     }\n18:\n19:     // 接收 Name 的重载构造函数\n\
  20:     Human(string HumansName)\n21:     {\n22:         Name = HumansName;\n23:\
