  \ {\n31:     // 注销下面这一行尝试使用默认构造函数\n32:     // Human FirstMan;\n33:\n34:     Human\
  \ FirstMan(\"Adam\", 30);\n35:     Human FirstWoman(\"Eve\", 28);\n36:\n37:    \
