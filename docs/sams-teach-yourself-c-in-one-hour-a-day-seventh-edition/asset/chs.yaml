  \n### 实现加赋值 (+=) 和减法赋值 (-=) 运算符\n加赋值运算符允许如 `a += b;` 的语法，允许程序员通过数量 `b` 增加对象 `a`\
  \ 的值。在此过程中，加赋值运算符的用途是它可以重载以接受不同类型的参数 `b`。接下来的 Listing 12.6 允许你向 `CDate` 对象添加整数值。\n\
  \nListing 12.6. 给定整数输入定义运算符 (+=) 和运算符 (-=) 以在日历中加或减天数\n点击此处查看代码\n\n\n\n\n\n```cpp\n\
  // Constructor that initializes the object to a day, month and year\nDate (int InputDay,\
  \ int InputMonth, int InputYear)\n    : Day (InputDay), Month (InputMonth), Year\
  \ (InputYear) {};\n\n// Binary addition assignment\nvoid operator+= (int DaysToAdd)\n\
  {\n    Day += DaysToAdd;\n}\n\n// Binary subtraction assignment\nvoid operator-=\
  \ (int DaysToSub)\n{\n    Day -= DaysToSub;\n}\n\nvoid DisplayDate ()\n{\n    cout\
