  \n### 工作坊\n\n工作坊包含测验题以巩固你所学的内容，以及练习题以提供使用所学知识的经验。在查看 [附录 D] 中的答案之前，请尝试回答测验和练习题。\n\
  \n#### 测验\n\n1. 如果你只需要写入文件，你应该使用哪种流？\n2. 你如何使用 `cin` 从输入流中获取一整行？\n3. 如果你需要向文件写入\
  \ `std::string` 对象，你会选择 `ios_base::binary` 模式吗？\n4. 你使用 `open()` 打开了流，为什么还要使用 `is_open()`？\n\
  \n#### 练习题\n\n1. **错误查找：** 找出以下代码中的错误。\n2. **错误查找：** 找出以下代码中的错误。\n\n\n\n\n你的程序分配内存、读写数据、保存到文件——诸如此操作。所有这些操作在你出色的开发环境中运行得完美无缺，你甚至为应用程序没有泄露一个字节感到自豪，尽管它管理着\
  \ 1GB！你发布了应用程序，客户将其部署在他拥有数千台工作站的运行环境中。其中有些电脑已经有 10 年历史了。有些硬盘已经快要转不动了。没过多久，第一个投诉就会到达你的收件箱。有些投诉是关于“访问违规（Access\
  \ Violation）”，而另一些会引用“未处理的异常（Unhandled Exception）”。\n\n你看——“未处理”和“异常”。显然，你的应用程序在你的环境中运行良好，那么为什么要大惊小怪呢？\n\
  \n事实是，外部的世界是非常异构的。没有两台电脑是完全相同的，即使硬件配置相同。这是因为运行在每台电脑上的软件以及机器所处的状态决定了特定时间可用资源的数量。因此，在你的环境中完美工作的内存分配在另一个环境中可能会失败。\n\
  \n此类失败虽然罕见，但它们确实会发生。这些失败导致了“异常”。\n\n异常会破坏应用程序的正常流。毕竟，如果没有可用内存，你的应用程序可能无法实现它设定的目标。然而，你的应用程序可以处理该异常并向用户显示友好的错误信息，在需要时执行任何最小的救援操作，并优雅地退出。\n\
  \n处理异常可以帮你避免那些“访问违规”或“未处理的异常”的屏幕或邮件。让我们看看 C++ 提供了哪些工具来处理意外情况。\n\n## 什么导致了异常？\n\n\
  异常可能由外部因素引起，例如资源不足的系统，也可能由应用程序内部的因素引起，例如使用了包含无效值的指针，或者发生了除以零错误。某些模块的设计目的是通过向调用者抛出异常来通信错误。\n\
  \n***\n\n注意\n为了保护代码免受异常影响，你需要“处理”异常，从而使你的代码变得“异常安全”。\n\n***\n\n## 通过 try 和 catch\
  \ 实现异常安全\n\n在实现异常安全方面，`try` 和 `catch` 是 C++ 中最重要的关键字。要使语句具有异常安全性，你需要将其封装在 `try`\
  \ 块中，并在 `catch` 块中处理从 `try` 块中产生的异常：\n\n点击此处查看代码图像\n\n```cpp\nvoid SomeFunc()\n\
  {\n    try\n    {\n      int* pNumber = new int;\n      *pNumber = 999;\n      delete\
  \ pNumber;\n    }\n    catch(...)  // ... 捕获所有异常\n    {\n      cout << \"Exception\
  \ in SomeFunc(), quitting\" << endl;\n    }\n}\n```\n\n### 使用 catch(...) 处理所有异常\n\
  \n记得在第 8 节中的“指针和引用的详解”中，我提到过 `new` 的默认形式在成功时返回指向内存位置的有效指针，但在失败时抛出异常。列表 28.1 演示了你如何使用\
  \ `new` 使内存分配具有异常安全性，并处理计算机无法分配你请求的内存的情况。\n\n列表 28.1. 在内存分配中使用 try 和 catch 确保异常安全\n\
  \n点击此处查看代码图像\n\n***\n\n```cpp\n0: #include <iostream>\n1: using namespace std;\n\
  2:\n3: int main()\n4: {\n5:     cout << \"Enter number of integers you wish to reserve:\
  \ \";\n6:     try\n7:     {\n8:         int Input = 0;\n9:         cin >> Input;\n\
  10:\n11:         // 请求内存空间并返回它\n12:         int* pReservedInts = new int [Input];\n\
  13:         delete[] pReservedInts;\n14:     }\n15:     catch (...)\n16:     {\n\
  17:         cout << \"Exception encountered. Got to end, sorry!\" << endl;\n18:\
  \     }\n19:     return 0;\n20: }\n```\n\n***\n\n***\n\n### 输出\n\n点击此处查看代码图像\n\n\
  Enter number of integers you wish to reserve: -1\nException encountered. Got to\
  \ end, sorry!\n\n***\n\n***\n\n### 分析\n\n在这个示例中，我使用 `-1` 作为想要预留的整数数量。这个输入是很荒谬的，但用户总是会做荒谬的事情。在没有异常处理程序的情况下，程序将面临一个非常糟糕的结局。但多亏了异常处理程序，你可以看到输出显示了一条体面的信息：`Got\
  \ to end, sorry!`。\n\n***\n\n***\n\n注意\n如果你使用 Visual Studio 运行程序，可能还会遇到调试模式下的消息，如图\
  \ 28.1](#ch28.html_ch28fig01) 所示。\n\n![Image](img/28fig01.jpg)\n\n图 28.1. 由于无效分配大小导致的断言。\n\
  \n点击 Ignore 让异常处理程序生效。这是一个调试模式下的消息，但异常处理帮助你的程序即使在发布模式下也能整洁退出。\n\n***\n\n列表 28.1\
  \ 演示了 `try` 和 `catch` 块的使用。`catch()` 接收参数，就像函数一样，`...` 意味着该块接受所有类型的异常。\n\n\n\n\n\
  当你在列表 28.2 中捕获 `std::bad_alloc` 时，你实际上捕获了由 `new` 抛出的 `std::bad_alloc` 类的对象。你可以抛出自己选择的异常。你只需要使用\
  \ `throw` 关键字：\n\n点击此处查看代码图像\n\n```cpp\nvoid DoSomething()\n{\n    if(something_unwanted)\n\
  \        throw Value;\n}\n```\n\n让我们通过列表 28.3 所示的自定义异常来研究 `throw` 的用法，该示例演示了除法。\n\
  \n### 列表 28.3. 在尝试除以零时抛出自定义异常\n\n点击此处查看代码图像\n\n```cpp\n0: #include<iostream>\n1:\
  \ using namespace std;\n2:\n3: double Divide(double Dividend, double Divisor)\n\
  4: {\n5:     if(Divisor == 0)\n6:         throw \"Dividing by 0 is a crime\";\n\
  7:\n8:     return (Dividend / Divisor);\n9: }\n10:\n11: int main()\n12: {\n13: \
  \    cout << \"Enter dividend: \";\n14:     double Dividend = 0;\n15:     cin >>\
  \ Dividend;\n16:     cout << \"Enter divisor: \";\n17:     double Divisor = 0;\n\
  18:     cin >> Divisor;\n19:\n20:     try\n21:     {\n22:         cout << \"Result\
  \ of division is: \" << Divide(Dividend, Divisor);\n23:     }\n24:     catch(char*\
  \ exp)\n25:     {\n26:         cout << \"Exception: \" << exp << endl;\n27:    \
  \     cout << \"Sorry, can't continue!\" << endl;\n28:     }\n29:\n30:     return\
  \ 0;\n31: }\n```\n\n### 输出\n\n点击此处查看代码图像\n\n```\nEnter dividend: 2011\nEnter divisor:\
  \ 0\nException: Dividing by 0 is a crime\nSorry, can't continue!\n```\n\n### 分析\n\
  \n该代码不仅证明了你能够捕获 `char*` 类型的异常（如第 24 行所示），还证明了你捕获了在第 6 行调用的函数 `Divide()` 中抛出的异常。请注意，你没有将整个\
  \ `main()` 函数都包含在 `try {}` 内部；你只包含了你预期会发生 `throw` 的部分。这通常是一个良好的做法，因为异常处理也会降低代码的执行性能。\n\
  \n### 异常处理如何工作原理\n\n在列表 28.3 中，你在函数 `Divide()` 中抛出了一个 `char*` 类型的异常，该异常在调用函数 `main()`\
  \ 的 `catch(char*)` 处理程序中被捕获。\n\n当使用 `throw` 抛出异常时，编译器会插入一个兼容的 `catch(Type)` 动态查找，以处理该异常。异常处理逻辑首先检查抛出异常的行是否在\
  \ `try` 块内。如果是，它将寻找可以处理该 `Type` 异常的 `catch(Type)`。如果 `throw` 语句不在 `try` 块内，或者该异常类型没有兼容的\
  \ `catch()`，则异常处理逻辑将在调用中执行相同的操作。因此，异常处理逻辑会沿着栈一个接一个调用函数向上寻找可以处理该异常的合适的 `catch(Type)`。在栈回溯过程的每一步，该函数的局部变量都会按照它们构造的反向顺序被销毁。这在列表\
  \ 28.4 中所示。\n\n### 列表 28.4. 发生异常时局部对象的析构顺序\n\n点击此处查看代码图像\n\n```cpp\n0: #include\
