  \ 决定匹配的标准。\n\n这个示例不仅演示了如何使用 STL 模板版本的链表 `list` 创建任何对象类型的 `list`，还演示了运算符和谓词的重要性。\n\
  \n***\n\n### C++11: std::forward_list\n\n从 C++11 开始，你可以选择使用 `forward_list` 代替 `std::list`\
  \ 中的双向链表。`std::forward_list` 是单链表——也就是说，如图 18.2 所示，它允许向一个方向进行迭代。\n\n![Image](img/18fig02.jpg)\n\
  \n图 18.2。单链表的视觉化表示。\n\n***\n\n### Tip\n\n要使用 `std::forward_list`，你需要包含头文件 `<forward_list>`：\n\
  \n```cpp\n#include<forward_list>\n```\n\n***\n\n`forward_list` 的用法与 `list` 非常相似，区别在于你只能向一个方向移动迭代器，并且有一个\
  \ `push_front()` 函数来插入元素，但没有 `push_back()`。当然，你始终可以使用 `insert()` 及其重载函数在指定位置插入元素。\n\
  \nListing 18.8 演示了 `forward_list` 类的一些函数。\n\n列表 18.8。forward_list 的基本插入和删除操作\n\n\
  点击此处查看代码图像\n\n***\n\n```cpp\n0: #include<forward_list>\n1: #include<iostream>\n\
  2: using namespace std;\n3:\n4: template <typename T>\n5: void DisplayContents (const\
  \ T& Input)\n6: {\n7:     for (auto iElement = Input.cbegin() // auto and cbegin:\
  \ C++11\n8:         ; iElement != Input.cend ()\n9:         ; ++ iElement )\n10:\
  \         cout << *iElement << ' ';\n11:\n12:     cout << endl;\n13: }\n14:\n15:\
  \ int main()\n16: {\n17:     forward_list<int> flistIntegers;\n18:     flistIntegers.push_front(0);\n\
  19:     flistIntegers.push_front(2);\n20:     flistIntegers.push_front(2);\n21:\
  \     flistIntegers.push_front(4);\n22:     flistIntegers.push_front(3);\n23:  \
  \   flistIntegers.push_front(1);\n24:\n25:     cout << \"Contents of forward_list:\
  \ \" << endl;\n26:     DisplayContents(flistIntegers);\n27:\n28:     flistIntegers.remove(2);\n\
  29:     flistIntegers.sort();\n30:     cout << \"Contents after removing 2 and sorting:\
  \ \" << endl;\n31:     DisplayContents(flistIntegers);\n32:\n33:     return 0;\n\
  34: }\n```\n\n\n\n\n标准模板库 (`STL`) 为程序员提供了容器类，有助于那些需要频繁且快速搜索的应用程序。`std::set` 和 `std::multiset`\
  \ 用于包含一组排序的元素集合，并提供在对数级复杂度内查找元素的能力。它们的无序对应物提供了常数时间的插入和搜索能力。\n\n本节包括：\n\n- STL `set`、`multiset`、`unordered_set`\
  \ 和 `unordered_multiset` 容器如何对你有所用\n- 元素的插入、删除和搜索\n- 使用这些容器的优缺点\n\n## STL Set 类导论\n\
  \n`set` 和 `multiset` 是一种容器，可以便于在存储键的容器中快速查找键；即，键是存储在一维容器中的值。`set` 和 `multiset` 的区别在于，后者允许重复值，而前者只能存储唯一值。\n\
  \n图 19.1 仅用于说明，它表示一个名称的 `set` 包含唯一的名称，而 `multiset` 则允许重复。作为模板类，STL 容器是泛型的，可以像包含整数、结构体或类对象一样包含字符串。\n\
  \n![Image](img/19fig01.jpg)\n\n图 19.1. 名称的 set 和 multiset 的视觉表示。\n\n为了方便快速搜索，STL\
  \ 的 `set` 和 `multiset` 实现在内部看起来像二叉树。这意味着插入到 `set` 或 `multiset` 中的元素在插入时会进行排序，以便更快的查找。这意味着，与\
  \ `vector` 不同（在该位置的元素可以被另一个元素替换），`set` 中给定位置的元素不能被不同值的新元素替换。这是因为 `set` 理想情况下会根据其相对于内部树中其他元素的取值，将其放置在可能的不同位置。\n\
  \n> 提示\n> 使用类 `std::set` 或 `std::multiset`，请包含头文件：\n```cpp\n#include <set>\n```\n\
  \n## 基本 STL set 和 multiset 操作\n\nSTL `set` 和 `multiset` 是模板类，在使用它们的任何成员函数之前，需要对它们进行实例化。\n\
  \n### 实例化 std::set 对象\n\n实例化某个类型的 `set` 或 `multiset` 需要对该类型特化模板类 `std::set` 或 `std::multiset`：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::set <int> setIntegers;\nstd::multiset <int> msetIntegers;\n\
  ```\n\n要定义包含 `class Tuna` 对象的 set 或 multiset，你需要编写以下代码：\n\n点击此处查看代码图像\n\n```cpp\n\
  std::set <Tuna> setIntegers;\nstd::multiset <Tuna> msetIntegers;\n```\n\n要声明一个指向\
  \ `set` 或 `multiset` 中元素的迭代器，你需要使用以下内容：\n\n点击此处查看代码图像\n\n```cpp\nstd::set<int>::const_iterator\
  \ iElementInSet;\nstd::multiset<int>::const_iterator iElementInMultiset;\n```\n\n\
  如果你需要一个可以修改值或调用非 `const` 函数的迭代器，则应使用 `iterator` 而不是 `const_iterator`。\n\n由于 `set`\
  \ 和 `multiset` 都是在插入时对元素排序的容器，如果你提供排序标准，它们将使用默认谓词 `std::less`。这确保了你的 set 包含按升序排列的元素。\n\
  \n通过定义一个带有 `operator()` 的类来创建一个二进制排序谓词，该类接受两个 set 中包含类型的值作为输入，并根据你的标准返回真值。其中一种按降序排序的排序谓词如下：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 在 set / multiset 实例化中使用模板参数\ntemplate <typename T>\n\
  struct SortDescending\n{\n   bool operator()(const T& lhs, const T& rhs) const\n\
  \    {\n      return (lhs > rhs);\n    }\n};\n```\n\n然后你可以在实例化 `set` 或 `multiset`\
  \ 时按如下方式提供此谓词：\n\n点击此处查看代码图像\n\n```cpp\n// 整数的 set 和 multiset（使用排序谓词）\nset <int,\
  \ SortDescending<int> > setIntegers;\nmultiset <int, SortDescending<int> > msetIntegers;\n\
  ```\n\n除了这些变体外，你始终可以创建一个从另一个或通过提供的范围拷贝的 `set` 或 `multiset`，如 列表 19.1 所示。\n\n列表 19.1.\
  \ set 和 multiset 的不同实例化技术\n\n点击此处查看代码图像\n\n```cpp\n0: #include <set>\n1:\n2: //\
  \ 在 set / multiset 实例化中使用模板参数\n3: template <typename T>\n4: struct SortDescending\n\
  5: {\n6:     bool operator()(const T& lhs, const T& rhs) const\n7:    {\n8:    \
  \  return (lhs > rhs);\n9:    }\n10: }\n```\n\n### 分析\n\n该程序没有输出，但展示了 `set` 和 `multiset`\
  \ 的各种实例化方式，针对 `int`。在第 17 和 18 行，你看到了忽略了类型以外的参数，导致使用了默认排序，如 `struct`（或 `class`）所示。在第\
  \ 21 和 22 行，如果你想覆盖默认排序，需要指定如第 3-10 行定义的谓词。这确保了排序是降序的（默认是升序）。最后，第 25 和 26 行展示了从另一个集合拷贝的\
  \ set 以及通过范围实例化的 multiset。\n\n> 提示\n> 编译 `cbegin()` 和 `cend()` 时遇到错误？\n> 如果你正尝试使用不符合\
  \ C++11 的编译器编译此程序，请用 `begin()` 和 `end()` 代替 `cbegin()` 和 `cend()`。C++11 可用的 `cbegin()`\
  \ 和 `cend()` 有用在于它们返回无法修改元素的 `const` 迭代器。\n\n### 在 set 或 multiset 中插入元素\n\n`set`\
  \ 和 `multiset` 中的大多数函数工作方式相似。它们接受类似的参数并返回类似的值类型。例如，在类容器中插入元素都可以使用 `insert`，它接受要插入的值：\n\
  \n点击此处查看代码图像\n\n```cpp\nsetIntegers.insert (-1);\nmsetIntegers.insert (setIntegers.begin\
  \ (), setIntegers.end ());\n```\n\n列表 19.2 展示了在这些容器中插入元素。\n\n列表 19.2. 在 STL set\
  \ 和 multiset 中插入元素\n\n点击此处查看代码图像\n\n```cpp\n0: #include <set>\n1: #include <iostream>\n\
  2: using namespace std;\n3:\n4: template <typename T>\n5: void DisplayContents (const\
  \ T& Input)\n6: {\n7:     for(auto iElement = Input.cbegin () // auto, cbegin():\
  \ C++11\n8:          ; iElement != Input.cend () // cend() 是 C++11 新的\n9:      \
  \    ; ++ iElement )\n10:     cout << *iElement << ' ';\n11:\n12:     cout << endl;\n\
  13: }\n14:\n15: int main ()\n16: {\n17:     set <int> setIntegers;\n18:     multiset\
  \ <int> msetIntegers;\n19:\n20:     setIntegers.insert (60);\n21:     setIntegers.insert\
  \ (-1);\n22: }\n```\n\n\n\n\n\n```cpp\n22:    setIntegers.insert (3000);\n23:  \
  \  cout << \"Writing the contents of the set to the screen\" << endl;\n24:    DisplayContents\
  \ (setIntegers);\n26:    msetIntegers.insert (setIntegers.begin (), setIntegers.end\
  \ ());\n27:    msetIntegers.insert (3000);\n29:    cout << \"Writing the contents\
  \ of the multiset to the screen\" << endl;\n30:    DisplayContents (msetIntegers);\n\
  32:    cout << \"Number of instances of '3000' in the multiset are: '\";\n33:  \
  \  cout << msetIntegers.count (3000) << \"'\" << endl;\n35:    return 0;\n36: }\n\
  ```\n\n### 输出\n点击此处查看代码图片\n```\nWriting the contents of the set to the screen\n\
  -1 60 3000\nWriting the contents of the multiset to the screen\n-1 60 3000 3000\n\
  Number of instances of '3000' in the multiset are: '2'\n```\n\n\n\n\n\n### 输出\n\n\
  点击此处查看代码图片\n\nmultiset 包含 5 个元素。这些是：\n\n-1 43 78 78 124\n\n请输入一个要从集合中删除的数字\n\n78\n\
  \n正在删除 2 个值为 78 的实例\n\nmultiset 包含 3 个元素。这些是：\n\n-1 43 124\n\n## 析\n\n注意第 15 行中\
  \ `typedef` 的用法。第 38 行演示了 `count()` 的用法，用于获取具有特定值的元素数量。实际的删除发生在第 42 行，它会删除所有匹配特定数字的元素。\n\
  \n注意 `erase()` 是重载的。你可以在迭代器上调用 `erase()`，例如调用 `find` 操作返回的迭代器，以删除已找到的值的一个元素，如下：\n\
  \n```cpp\nMSETINT::iterator iElementFound = msetIntegers.find (nNumberToErase);\n\
  \nif (iElementFound != msetIntegers.end ())\n   msetIntegers.erase (iElementFound);\n\
  else\n   cout << \"Element not found!\" << endl;\n```\n\n同样，你可以使用 `erase()` 从 `multiset`\
  \ 中移除一段范围的值：\n\n```cpp\nMSETINT::iterator iElementFound = msetIntegers.find (nValue);\n\
  \nif (iElementFound != msetIntegers.end ())\n   msetIntegers.erase (msetIntegers.begin\
  \ (), iElementFound);\n```\n\n前面的代码段删除了从开始到值为 `nValue` 的元素的所有元素，但不包括后者。`set` 和 `multiset`\
  \ 都可以使用成员函数 `clear()` 清空其内容。\n\n既然你现在已经对基础的 `set` 和 `multiset` 函数有了整体了解，是时候回顾一个包含使用该容器类实现的实际应用示例了。列表\
