    be grand. The demigods, the digerati, live there. “I have a virtual company”—good,
    great, grand.In my heart, I know I’m not really in business until the day I have
    to meet a payroll. I often think of my father starting up his accounting practice
    during the Depression. He didn’t have a virtual company. He hired guys right out
    of school and kept them on into their dotage. (He complained about them, but he
    kept them on.) He gave young men part of the business, cut them into deals. His
    employees were like family; I called some of them “cousin.” There was something
    in this long-term commitment, this human putting up with one another, that I know
    has passed away, along with a whole generation of striving immigrant sons like
    my father.Then again, maybe my father’s practice was a little too much like a
    family. He had to be in control, and the young men had to grow up. In the end,
    the “cousins” went their own ways, the employees like sons rebelled, and, when
    my father reached his own dotage, they complained and they didn’t keep him on:
    they pitched him out of his own company. Maybe the new way is better, I think.
    Maybe Industry Captain is right. Just live by your wits and expect everyone else
    to do the same. Carry no dead wood. Live free or die. Yeah, surely, you can only
    rely on yourself.This idea of self-reliance doesn’t mean we’ve given up entirely.
    We’re human after all; we want our compatriots around us. But a contract or a
    start-up company doesn’t leave much room for the sentiments. Sometimes we just
    have a job to do.“We’re in the middle of firing my friend,” said Brian. We were
    on our way into a restaurant the second time I saw him. “Divorce,” Brian went
    on. “He’s really been messed up. And his work has gone to trash.”“He’s really
    messed up and so you’re going to fire him?” I asked.“Yeah. He’s all right with
    it. He agrees he’s screwing up.”“But how can he possibly be all right with it?”“Oh,
    he’s very smart. Smart enough to know when his work is bad.”“Even so. Won’t this
    hurt your friendship?”He shrugged. “No. Like I said, he’s all right with it.”This
    seemed impossible to me. Or else Brian and I had very different ideas about friendship.“I
    once had a bad time with a friend I hired,” I told him, “and things were never
    the same between us.”“Uh?”“I felt terrible, she felt terrible. In the end, the
    job wasn’t worth all these terrible feelings.”“Uh-huh,” Brian mumbled. Then he
    turned abruptly and walked off a ways, literally marching away from the subject
    of firing friends.So I didn’t tell him how my friend had sat stonily when I tried
    to tell her that I thought it was only a question of her motivation, only a problem
    of her time; that I was sure she could do the job if she wanted to. How I kept
    talking and talking, and I watched her turn my words into sharp, metallic things
    then withdraw into a closed, self-protective anger. “Talk to me,” I’d said, but
    she was far away and unreachable by then.I tried to imagine telling Brian, “She’s
    all right with it.”There seemed to be no point in mentioning that the day I’d
    fired my friend, our friendship was over, and it sent fractures through our entire
    circle. So that even now, nearly two years later, we are all left with the tense
    mess of deciding who to invite where with whom. And all this came from a talk
    that took maybe half an hour: fifteen years’ worth of friendship trashed over
    a contract.So I let the conversation go. Besides, Brian and I were only doing
    what we were supposed to do. We’re supposed to assemble a group of people to do
    a job, get it done, then disassemble. We’re not supposed to invest in any one
    person or set of skills—no sense in it anyway, as Industry Captain understood.
    The skill-set changes before the person possibly can, so it’s always simpler just
    to change the person. Take out a component, put in a zippier one. The postmodern
    company as PC—a shell, a plastic cabinet. Let the people come and go; plug them
    in, then pull them out.The day after I saw Brian, I had time to wonder why he
    had even brought up the subject of firing his friend. Why tell me about it only
    to drop it immediately? Then I reviewed the course of the conversation and regretted
    I had kept my thoughts to myself. I had missed an opportunity, I thought. Maybe
    if I’d said something, we could have talked about it: how we’re both uneasy with
    the way we’re supposed to live. And how we do it anyway.Living a virtual life
    is an art. Like all arts, virtuality is neither consistent nor reliable. It takes
    a certain firmness of will, and a measure of inspiration, to get up each and every
    day and make up your existence from scratch. As every artist knows, every writer
    and homebound mother, if you are not careful, your day—without boundaries as it
    is—can just leak away. Sundown can find all your efforts puddled around you, everything
    underway, nothing accomplished.But the virtual life of techno-business requires
    something even more than inspiration. What is mandatory is that you present to
    the world the appearance of actual existence. You must seem to be a company in
    the usual sense of the word, with an office full of humming enterprise. Nothing
    is stranger than sitting in dirty sweatpants and picking up the ringing phone
    to say “Ellen Ullman speaking” in a mature, efficient voice. It is as if I have
    projected myself into another universe, where I am dressed in a blazer and slacks
    and my hair is washed, some place completely discontinuous with the universe I
    inhabit in sweats. While I speak on the phone—to a client, a CEO—I am aware that
    I have thrown my voice correctly, that they have seen me as I wished to be seen:
    a clever, enterprising woman sitting at a fine desk. To hang up then is almost
    painful. Click. I return to myself: creature swimming alone in puddles of time.Beyond
    a certain tone of voice, the facade of constructed reality is entirely electronic—and
    therefore revir-tualized. Internet address with your company name as the domain;
    fax machine with your company’s name entered to appear on the receiving end; voice
    mail that answers in a receptionist-sounding voice, not your own; phone number
    that ends in zero-something, so that callers will believe they have reached you
    on your direct line, not your only line; letterheads produced on the LaserJet;
    invoices created by Excel or Quattro Pro or QuickBooks—all this and more create
    the necessary illusion of definitive, standard existence. It’s a little scary
    just how easy it is to do this.And, once your own electronic existence is established,
    you start to notice how many of the entities around you are similarly electronic
    and therefore as suspect in their reality as you are. Spotting the unreality of
    other home and small businesses becomes so easy it’s no sport. But what about
    the larger business world? Looked at in a certain way, you can ask, What is Charles
    Schwab but a giant computer connected to a telephone? All those buildings are
    there for reassurance, like the marble pillars of banks and the brick walls in
    my loft.And what is a corporation these days but an elaborate verisimilitude spun
    round with the gauzy skin of electrics? I call an 800 number to order equipment:
    Am I calling the real company? Who can tell? The person I’m talking to is most
    likely an employee of yet another company, one that has been subcontracted to
    perform telemarketing or distribution. Or, more likely yet, the individual is
    an independent contractor paid by the hour by the company working under contract
    to the company selling the equipment. And, in endless rounds of deconstruction,
    the company selling the equipment may itself simply be an entity with an 800 number,
    suppliers, and subcontractors. It orders bits of hardware from other companies
    (each with its own 800 numbers and subcontractors), assembles things in cases,
    puts them in boxes, advertises, and lets someone else answer the phone. Behold:
    the modern global corporation.And businesses that exist as Web sites: the perfect
    devolution. Maybe all enterprise will soon be like the NASDAQ—a network entity,
    wires and cables and satellites, everywhere available and nowhere present.But
    what difference does it make: Why should I care about a company’s physical coordinates?
    What does it matter if the person I’m talking to is sitting in the basement of
    corporate headquarters or at home thousands of miles away? The telephone, the
    fax, the computer network reach everywhere, don’t they?In the days before ubiquitous
    computers, I briefly worked for an insurance company. I was a temp. My job was
    to answer the phone in the claims department, find the claim file corresponding
    to the caller’s auto accident (it was a paper file), put the file in a special
    out basket, then buzz the adjuster. Done; next call: a real shit job. The only
    thing that made it tolerable was the fact that, about thirty percent of the time,
    the file I needed was missing. This great tragedy—the lost file, motive and justification
    for the very existence of the business computer—was my occasion to search the
    premises. I went up and down the elevators, from desk to desk, learning and following
    the route of information inside the company. By the fifth lost file, I knew what
    an adjuster was, had met them all, knew what account managers did, and had met
    them all. I knew the full range of actions performed by an insurance company,
    something I’d known absolutely nothing about when I’d started. If I had wanted
    a career in insurance (a very unlikely ambition for me but a perfectly reasonable
    one for a young person with no better prospects), I was ready to advance from
    temporary claims-phone-answerer-file-puller to something better. At minimum, I’d
    like to think that the poor sufferers of automobile accidents received better
    service for my knowing the adjuster handling their claim—knowing him in person,
    by name, by looks, and by sight; the names of his children and wife.Twenty-five
    years later, the young man taking my order on the telephone was very sorry: he
    could not tell me if the Insert key was right next to the Backspace. This detail
    about a laptop’s keyboard was important to me; I hate hitting Insert when I’m
    going for Backspace. “It’s not in my database,” he explained.His name was Marshall
    Schoen—my experience at the insurance company made me keep up this antique tradition
    of asking for someone’s full name. “Marshall,” I said, “Is there someone you can
    call and ask?”I heard him shuffling papers, hitting keys. “Sorry,” he said for
    the second time, “All I have is the information on the screen.”“Where are you,
    Marshall?” I asked.“Where? I’m … . What do you mean, where am I?”“I mean physically.
    In what state are you, what city?”He named a place on the prairies, fifteen thousand
    miles from Japan, where my prospective laptop, with its mysterious keyboard, had
    been designed and assembled. I felt sorry for Marshall Schoen. There he sat in
    his cubicle. He could not get up and hunt around for the missing information;
    he wasn’t allowed to get up at all. All he knew was on his screen, tiny porthole
    surrounded by darkness. He would never learn anything about the company in Japan,
    about laptop computers, about the local distributor, even about the process of
    telemarketing. There would be no better job at this company than the one he had
    right now: sitting at a computer monitor, wearing a headset, answering the phone.
    He could stay or leave. His computer was up or down. Between those poles was nothing:
    no lost files and no way to find them.“Sorry, Marshall, but I’m afraid I can’t
    buy the laptop without knowing about the keyboard,” I said, wishing I could give
    him the order.I think he heard the regret in my voice. “Yeah, I see that,” he
    said. He paused; the line went quiet, the whole global network lying between us
    in a vast, amazing silence. “I’m sorry, too,” he said.I used to have an idea of
    myself seated at a desk. I would see myself from the back, my head bent over some
    work, wholly absorbed in whatever I was doing. That absorption, a certain absence
    from one set of things and extreme presence to another, became an emblem for me,
    some ideal way of being, a self toward which I worked for most of my life.It wasn’t
    until I began to work at home, and one day during a period of anxiety mixed with
    boredom I projected myself across the room, so that I saw myself from the back,
    so to speak—it was on that day I understood that the person I had been imagining
    all those years was not me at all. It was instead my father, at home, at his desk,
    wholly absorbed in whatever he was doing.My father had an office at home as well
    as his business office, and he liked to sit at his desk in the family room while
    my mother, sister, and I idly watched television. His ears were always covered
    with the headphones, as he listened to his preferred radio station playing inoffensive
    music. The station sounded distantly on speakers in the living room, so that I
    had this idea of my father as existing not here, in the family room with us, but
    projected into the living room, where he lived in some exalted state of busy aloneness.It’s
    not surprising to me, then, that I now live alone and have my office in one corner
    of the one large space that makes up my loft; not surprising to me that I believe
    I should be working all the time; no surprise at all that I can’t relax except
    after a long bout of work. My father was presented to us as a model human being,
    and he was always working. But what I am surprised to learn is this: how much
    he wanted the isolation of work, and how much I don’t.My work hours have leaked
    into all parts of the day and week. Eight in the morning, ten at night, Saturday
    at noon, Sundays: I am never not working. Even when I’m not actually doing something
    that could be called work, I might get started any minute. So everything is an
    interruption—a call from a friend, an invitation to lunch—everything must be refused
    because it is possible that from one moment to the next I will get back to something.This
    state of boundarylessness I could only have learned from my father. He puttered
    at his desk in the morning then went to the office to work; he came home, had
    a nap and dinner, then went to his desk in the family room to work. So it was
    that he was there and not there, among us and not among us, all due to the perfect
    protection from other human beings called having your own business.I grew up helping
    my father balance his books. We did this once a month at the dining room table,
    with my father calling out the amounts and me totaling them on a huge, ancient
    adding machine. The table filled with curls of adding-machine paper. My mother
    brought us snacks and iced drinks on coasters. The household hushed around us.In
    the end, though, this hallowed cocoon of work did no good for either me or my
    father. When my father feuded with his partners, he had no one to turn to, no
    friends, no business associates, no one but the family. But, by that time, I was
    as resentful as I was flattered by his attentions. More than thirty years had
    passed since I had helped him balance his books, years my father and I had spent
    admiring each other, and testing wills against each other, from a great distance.
    By then, we were both too attached to our working selves and had quite forgotten
    the language of relation. He was sick with cancer and spent his days in stunned
    rage over the loss of his company. Even so, it took a great deal for me to say,
    “I love you, Dad,” and for him to answer, “The same from me.”I can see myself
    from the back now: at my two desks, surrounded by my four computers. I’ve turned
    on the television, a familiar noise to help me concentrate. Now and then, I’m
    aware that I’ve tuned into Ricki Lake, a program I watched for the first time
    when my father was dying in the hospital. What drifts back at me is the horrible
    boredom of death, which no one ever talks about, but which exists all the same:
    the hours spent sitting on a hard plastic chair in a tiny hospital room while
    the television, ignored by the dying, plays on for those attending. For a moment,
    the boredom of death and the dullness of work intersect. Am I earning a living,
    I wonder, or just trying to fill a very large, self-made solitude?I’m far from
    unique in my lonely virtuality, I realize. The building I live in—reconstructed
    lofts, a kind of yuppie dorm without dining room (too bad about the dining room;
    food service would have made this place close to perfect)—is full of little one-
    and two-person companies. I’m told we home-based businesses are the new engine
    of employment, the future of work. Delivery guys love us: We’re the new housewives.
    We’re always home.There is a comfort in living among one’s own kind. On my way
    in from the garage, I pass a small loft occupied by a single man who must be in
    his late thirties or early forties. From his outgoing nature, I assume he is in
    sales—acting as a small distribution office, maybe, or a local representative
    of some company far away. Anyone can look in and see his clothes strewn across
    the floor. The man himself sits at his dining room table working on a laptop.
    The TV is on, ignored, for company.In the afternoons, I see us virtuals emerge
    blinking into the sunlight. In the dead hours after 3 PM, we haunt cafés and local
    restaurants. We run into each other at the FedEx drop-box or the copy shop. They,
    like me, have a freshly laundered look, just come out of pajamas or sweat pants,
    just showered and dressed.I recognize my virtual colleagues by their overatten-tion
    to little interactions with waiters and cashiers, a supersensitivity that has
    come from too much time spent alone. We’ve been in a machine-mediated world—computers
    and e-mail, phones and faxes—and suddenly we’re in a world where people lumber
    up and down the steps of buses, walk in and out of stores, have actual in-person
    conversations. All this has been going on while I was in another universe: that’s
    what comes to us with a force like the too-bright sun or a stiff wind off the
    bay. We do our business, drop off the overnight packet, clip together the xeroxes,
    and hurry home.Sometimes I think about taking a real job, with a real company.
    So what if my virtual company is what everyone imagines is a perfect life? I’m
    no different from anyone else: I want the security, routine, and camaraderie of
    the office. At the AIDS project, I watched a year and a half pass in the comforting
    round of holidays. One day there were spiders hanging from the ceiling and witches
    on the wall; the next, Indian corn and leaves pinned to the windows, like a grade-school
    classroom in the coziness of fall; later, blinking lights on the reception desk,
    the tree, the holiday party. I think it would be relaxing to take a job, have
    the soothing circle of the seasons go ’round you, go someplace where they’ll understand
    if you get sick or just tired.Then I remember: I was once a devoted employee.
    I stayed at a software company for two years, left, went back. Contented in that
    real-company sort of way, I thought I would stay forever.But one day I arrived
    late to work from a dentist’s appointment to find my colleagues heading toward
    me with their belongings in cardboard boxes. The software company had been swallowed
    up by a much larger one. Only a small maintenance crew would be left. My project
    and all the others had been killed, and what remained of two years of my group’s
    work was backed up by someone in a hurry. Later it turned out that the back-up
    format was unreadable.Of the original project team—something grandly called “The
    Advanced Products Group”—only my boss and I were left. We were now to be in charge
    of “special projects.” That is, we’d been given the courtesy of time to look for
    new work.Soon a work crew came to take down the partitions. Until then, for the
    first day or two after the layoff, it hadn’t been clear how alone my boss and
    I were. Once the cubicles came down, though, we could see all the empty desks.
    We could see how packed in we all had been—a vast space that once had been filled
    with programmers. After the partitions, the next things to go were workstations
    and monitors. Then the freestanding furniture. Last were the phones. In the end,
    we were left with a whole office floor with nothing but carpeting and dangling
    cables. Falling from ceiling tiles, cascading from posts, dripping down walls—nothing
    but the sprung ends of dead computer networks.It was all the dangling cable that
    finally drove us out. My boss and I had been huddling near our former workspaces—what
    once had been “deluxe” cubicles, the double-wides of the modular office-furniture
    world. But there was something about all the open space and cabling. We strolled
    around and around the empty space for two days, wondering what we should do. To
    pass the time, we counted the number of dead connectors: how many RJ11s, serials,
    parallels, phone jacks. Once we had counted all the cables, we gave up. We withdrew
    to the last two solid offices: things with hard walls, metal windows, wooden doors.
    From there, we used the last remaining phone to start the search for new work.My
    boss and I never really spoke about it, but over the years, in odd indirect ways,
    we’ve signaled to each other how we went to opposite and extreme reactions against
    all that emptiness, all those sprung dead cables. No one who goes through a layoff
    is ever the same again. Some faith is gone, some comfort level is lost. You learn
    how delicate your place in the world is. Any day, you could be coming from the
    dentist to find that your social, laboring existence has literally been ripped
    away.For me, the layoff started a time of wandering. I went to a start-up company,
    then on to my virtual, consulting ways. My boss took a job with a computing research
    group at Pacific Bell—a big company, a solid company. The phone company, for heaven’s
    sake, bound to be around forever, right?Twelve years after my former boss took
    his job at the phone company, a major telecommunications deregulation bill became
    law. Layoffs are occurring everywhere in the telephone industry. AT&T has already
    shed tens of thousands of workers, and Pacific Bell is being acquired. I’ve begun
    to worry about my former boss: twelve years on the job, and what will happen to
    him now?And then here I am, rootless and wandering, my company wavering in and
    out of existence. I used to think that I was the infantile one, that I couldn’t
    accept reality like my former boss and just settle down. But now I feel he will
    be more fragile. Unprepared for chaos, he must go out into the hurly-burly I’ve
    been in all these years. In the end, which of us is better prepared for the world
    as it has turned out to be?I’m bad at letting go. Even after projects end and
    I should let associates fade out, I try to hold on, sometimes to a fault. I was
    not ready to let go of Joel, for example. We had shared minds that night before
    the AIDS-project release, and mind-share, for me, is the hardest bond of all to
    break.Joel and I met for dinners. It turned out we both had a passion for good
    wine and fancy restaurants. I liked that he would appear in a suit and tie, his
    good-biz-school self fitting right into the sort of places I like to go to.One
    night we met at a restaurant in my neighborhood. It was down a little alley, behind
    a gate. Our confirmed reservation, and Joel’s good suit and overcoat, got us past
    the crowd at the door and into the inner dining room, where we were seated at
    a table with softly upholstered chairs. The room was filled with flowers, huge
    vases with three-foot stems and blossoms inches in diameter.We chose the food
    and the wine—planning our orders as a single meal—and soon turned to the subject
    that occupied the largest part of our lives: work. That night, Joel had a complaint.
    In the face of new government regulations, the company where he had been a contractor
    for years was talking about forcing him to become something terrible: an employee.“Why
    does the government give a damn what I am?” said Joel. “If the company is happy
    and I’m happy, why should it be any of their business?”“Joel, it’s the government’s
    business because contracting is so often abused.”“What do you mean? What’s the
    difference? If you want to work for yourself, why should anybody stop you?”“You
    want to work for yourself. But what about someone who doesn’t want to?”Joel looked
    at me with utter incomprehension. “Why would someone not want to work for himself?”Joel
    wasn’t a proper libertarian; his individualism wasn’t studied and rationalized
    like Brian’s. But he was the same age as Brian, thirty-one, and I decided that
    their obliviousness toward the average working life had to be some by-product
    of their age and time. They didn’t want to make films or write novels, the way
    my friends did at thirty. They wanted to build companies, be in charge, on their
    own. Somehow, having your own business had become cool.“Benefits,” I said. “That’s
    why people want jobs. And companies don’t pay benefits to contractors.” He still
    didn’t quite get it. “Don’t they teach labor history in school anymore?”I had
    to explain that companies would make everyone a contractor if there weren’t laws
    against it; that they would jump at the chance to unload the cost of medical coverage,
    overtime, holidays, sick leave.“You think so?”“Jesus, Joel. Companies don’t give
    benefits because they like to. People had to die in the streets—literally—to get
    these benefits.”“Did they?” Suddenly he seemed suspicious of me. Maybe I was indeed
    a decently successful software developer. Maybe I did read The Economist. Maybe
    we did get along quite well in nice restaurants. But there I was talking dead
    people in the street, just like some sort of commie.We sat in the beautiful restaurant.
    Before us was a bottle of old, red wine. The vases of fresh cut flowers surrounded
    us. I lifted my glass. I talked labor history of the ’20s. For the five-day work
    week, people did indeed get shot by company thugs and die in the streets; and
    there we sat, two independent contractors who brag about working all the time.
    Virtual employer and virtual employee, sipping their wine.Finally Joel just gave
    up. “Whatever. I’m sure you’re right. I mean, I take your word for it.”I had a
    vision of my so-right self sitting behind the remains of my gigot en chevreuil.“Oh,
    please don’t take my word for it, Joel. These days I’m liable to say just about
    anything.”The dining room began to empty. The ghost scents of food, flowers, and
    coffee rose around us. We finished the bottle. We shared a dessert. When we left
    the table, I instinctively brushed my arm around him, and he circled my waist.
    Zing. Rush. How strange: that mind-moment we had shared on our long night of programming,
    that little thought-charge—it was still there.I decided that Joel could live without
    a real job because he had a fake one: he was an “independent” contractor who had
    a whole little society to live in. Every day for years, he went to an office and
    sat at the same desk in the same cubicle. The same people were there to say good
    morning and how are you and did you see a certain movie. There was someone to
    eat lunch with and chat with and help pass bored time. When things went wrong,
    he had a companionable ear for gossip and complaint.He had his home in the postmodern
    village: the workplace, the last place where your position in the order of things
    is still known, where people must put up with you on a regular basis, over a long
    period of time, and you with them. Families scatter, marriages end, yet the office
    and the factory have hung on a bit longer as staple human gathering places. Maybe
    this is why the decline of industrial work and the downsizing of corporations
    have produced such anxiety: the final village is dissolving, and those of us without
    real jobs or fakes—where will we meet each other now?On line, I suppose. As virtualized
    creatures swimming alone in private pools of time.In this sense, we virtual workers
    are everyone’s future. We wander from job to job, and now it’s hard for anyone
    to stay put anymore. Our job commitments are contractual, contingent, impermanent,
    and this model of insecure life is spreading outward from us. I may be wrong,
    but I have this idea that we programmers are the world’s canaries. We spend our
    time alone in front of monitors; now look up at any office building, look into
    living-room windows at night: so many people sitting alone in front of monitors.
    We lead machine-centered lives; now everyone’s life is full of automated tellers,
    portable phones, pagers, keyboards, mice. We live in a contest of the fittest,
    where the most knowledgeable and skillful win and the rest are discarded; and
    this is the working life that waits for everybody. Everyone agrees: be a knowledge
    worker or be left behind. Technical people, consultants, contract programmers:
    we are going first. We fly down and down, closer and closer to the virtualized
    life, and where we go the world is following.^([17](#e9781250024589_ftn01.html_ftn_fn17))While
    I was still on the AIDS project, I took my virtual company out to lunch. Danny
    the desktop programmer, Mark on the server, Bill the network specialist, the user
    support guy, me. (Joel hadn’t started working with us yet.) To celebrate making
    our first major project milestone, we drank some very nice Veuve Clicquot, ate
    an excellent meal at my expense, praised each other, teased one another, and generally
    had a fine time. But, even with two excellent bottles of wine after the champagne,
    we knew to hold back. We were careful not to say too much about ourselves, careful
    not to make assumptions about the future. We were all practiced virtuals. We knew
    better than to get involved.After the lunch, I went home to my office. The floor
    was covered with boxes, new hardware to be installed. As I snaked cables under
    desks, I thought about how I would eventually lose touch with the guys who’d been
    so funny that day over the pasta, and how the hardware I was cabling, soon to
    be wired and communicating, would stay.I had a rush of affection for the machines.
    They had a presence, a solidity, that made the empty office feel occupied. On
    the network, each one had a name. I called them Janeway and HomePlanet, Pride
    and Hubris. In the virtual company, these were my real companions. They’d be here
    for me when others moved on. When they got sick, though, I could junk them without
