    Not full-on communal Asperger’s syndrome, but just a bite, as Ullman describes
    it in a scene with the ultra-nerd Brian. She asks him if he’d like to listen to
    Palestrina or Beethoven. And Brian replies, “Classical music is not yet in my
    data banks.”The autistic spectrum is somewhat correlated with men, and in a way,
    the nerd world is a world made by men for men. The nerd flavor of masculinity
