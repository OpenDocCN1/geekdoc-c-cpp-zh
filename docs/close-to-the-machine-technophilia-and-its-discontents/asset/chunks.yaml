    # Close to the Machine


    ## 1. 革命与机器

    The global network is only the newest form of revolution, I think. Maybe it’s
    only revolution we’re addicted to. Maybe the form never matters—socialism, rock
    and roll, drugs, market capitalism, electronic commerce—who cares, as long as
    it’s the edgy thing that’s happening in one’s own time. Maybe every generation
    produces a certain number of people who want change—change in its most drastic
    form.


    And socialism, with its quaint decades of guerrilla war, its old-fashioned virtues
    of steadfastness, its generation-long construction of a “new man”—is all too hopelessly
    pokey for us now. Everything goes faster these days. Electronic product cycles
    are six months long; commerce thinks in quarters. Is patience still a virtue?
    Why wait? Why not make ten million in five years at a software company, then create
    your own personal, private world on a hill atop Seattle? Then everything you want,
    the entire world, will be just a click away.


    And maybe, when I think of it, it’s not such a great distance from communist cadre
    to software engineer. I may have joined the party to further social justice, but
    a deeper attraction could have been to a process, a system, a program. I’m inclined
    to think I always believed in the machine. For what was Marx’s “dialectic” of
    history in all its inevitability but a mechanism surely rolling toward the future?
    What were his “stages” of capitalism but the algorithm of a program that no one
    could ever quite get to run?


    And who was Karl Marx but the original technophile? Wasn’t he the great materialist—the
    man who believed that our thoughts are determined by our machinery? Work in a
    factory on machines that divide the work into pieces, and—voilà!—you are ready
    to see the social nature of labor, ready to be converted from wage slave to proletarian
    soldier. Consciousness is superstructure, we leftists used to say, and the machinery
    of economic life is the “base.” The machines decide where we are in history, and
    what we can be.


    ## 2. 程序员的思维

    During my days in the party, we used to say that Marxism-Leninism was a “science.”
    And the party was its “machine.” And when the world did not conform to our ideas
    of it—when we had to face the chaotic forces that made people believe something
    or want something or do something—we behaved just like programmers. We moved closer
    to the machine. Confronting the messiness of human life, we tried to simplify
    it. Encountering the dark corners of the mind, where all sorts of things lived
    in a jumble, we tightened the rules, controlled our behavior, watched what we
    said. We were supposed to want to be “cogs in a wheel.”


    When the Soviet Union began to crumble, and the newspapers wrote about the men
    who controlled the empire, I couldn’t help noticing how many of them had been
    trained as engineers. Our country is ruled by lawyers, I thought, theirs by engineers.
    Engineers. Of course. If socialism must be “constructed” (as we said in the party),
    if history is a force as irrefutable as gravity, if a “new man” must be built
    over generations, if the machine of state must be smashed and replaced with a
    better one, who better to do the job than an engineer?


    “I’m a software engineer,” I reassured myself when I met the vice president, “an
    engineer.” A week after seeing the vice president, I had lunch with the old friend
    who had recruited me into the party. We were talking about grown-up things—houses,
    relationships—when suddenly I couldn’t stand it anymore. I reached across the
    table and asked her, “Did we ever really believe in the dictatorship of the proletariat?”
    She looked at me like I was crazy.


    ## 3. 电子时代的脆弱性

    I drove home through a tunnel and over a bridge, thinking about San Francisco
    earthquakes. I went home and thought about the gas line in the old Victorian flat
    where I used to live. We can’t live without cash machines the way we can’t live
    without natural gas, I thought. There is no way back. This is the fragility of
    what passes for regular life in the electronic era. We may surround that gas line
    with fancy moldings, all decorated with curlicues, yet it remains what it is:
    a slim pipe full of explosives.


    What worried me, though, was that the failure of the global electronic system
    will not need anything so dramatic as an earthquake, as diabolical as a revolutionary.
    In fact, the failure will be built into the system in the normal course of things.
    A bug. Every system has a bug. The more complex the system, the more bugs. Transactions
    circling the earth, passing through the computer systems of tens or hundreds of
    corporate entities, thousands of network switches, millions of lines of code,
    trillions of integrated-circuit logic gates. Somewhere there is a fault. Sometime
    the fault will be activated. Now or next year, sooner or later, by design, by
    hack, or by onslaught of complexity. It doesn’t matter. One day someone will install
    ten new lines of assembler code, and it will all come down.


    Brian can bring it all down. At least he’d like you to think so. He hangs out
    with a group of cryptographers dedicated to knowing how to bring it all down.
    Cypherpunks: that’s what they call themselves. And if they have not yet brought
    the vice president’s network to its knees, it may only be because Brian has advised
    an odd sort of patience. He has counseled his fellow rebel cryptographers to practice
    their skills quietly, watch while global networks get huge, and let system managers
    get complacent.


    ## 4. Brian 与隐私

    “You actually said that to a reporter!” I told him, “You said everyone should
    wait until there was really something big worth stealing!” “Yeah,” he answered
    with a grin, “I did say that, didn’t I?”


    Brian looks like a skateboarder. Or maybe he’s what the devil would look like
    if the devil decided to move around among us disguised as a skateboarder. Brian
    has long dark hair, pale eyes covered by thick glasses, and a pointy little beard.
    He wears baggy jeans, a motorcycle jacket, and a black cowboy hat. At thirty-one,
    he has devoted what there is of his adult life to the absolute electronic privacy
    of money. His obsession about the privacy of wealth is like my generation’s obsession
    about the privacy of identity, or sexuality, or belief, or the self.


    In our industry, Brian is perfect. In appearing to be a genius on a skateboard,
    he couldn’t be playing his part better. He looks exactly the way today’s computing
    genius is supposed to look: boyish, brilliant, and scary. These traits alone almost
    recommend him for success, for Brian is in management in his second start-up company.


    ## 5. 系统的漏洞

    Every system has a bug. The more complex the system, the more bugs. Transactions
    circling the earth, passing through the computer systems of tens or hundreds of
    corporate entities, thousands of network switches, millions of lines of code,
    trillions of integrated-circuit logic gates. Somewhere there is a fault. Sometime
    the fault will be activated. Now or next year, sooner or later, by design, by
    hack, or by onslaught of complexity. It doesn’t matter. One day someone will install
    ten new lines of assembler code, and it will all come down.


