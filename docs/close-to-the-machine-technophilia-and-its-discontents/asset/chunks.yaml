    sports cars like mine pushing 80, delivery vans riding at the limit—a freeway
    the way God meant it to be. The car in front of me tailgates everyone out of the
    way, then zooms off. The carpool lane, defunct at this hour, has turned back into
    the fast lane, and its painted diamonds stretch out ahead for miles.“Can you edit
    this field?”“No.”“Then it should be a—”“Oh, yeah. A different control—”“A label.”“Yeah.”“And
