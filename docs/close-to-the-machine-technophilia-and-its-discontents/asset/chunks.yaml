    said one slouch-suited young man by way of beginning an answer to one of my questions).
    No, all this was common enough. I’d seen it before, everywhere, and I’d see it
    again in the next software engineer I’d meet. What bothered me was just that:
    the ordinariness of it. From the hostile scowl of my own programmer to the hard-driving
