    said the insurance agent whose employee of twenty-six years knew all his customers
    by name. “The people who own this system have a right to good data!” said the
    woman who had set out to do a favor for sick people.I’d like to think that computers
    are neutral, a tool like any other, a hammer that can build a house or smash a
    skull. But there is something in the system itself, in the formal logic of programs
    and data, that recreates the world in its own image. Like the rock-and-roll culture,
    it forms an irresistible horizontal country that obliterates the long, slow, old
    cultures of place and custom, law and social life. We think we are creating the
    system for our own purposes. We believe we are making it in our own image. We
    call the microprocessor the “brain”; we say the machine has “memory.” But the
    computer is not really like us. It is a projection of a very slim part of ourselves:
    that portion devoted to logic, order, rule, and clarity. It is as if we took the
    game of chess and declared it the highest order of human existence.We place this
    small projection of ourselves all around us, and we make ourselves reliant on
    it. To keep information, buy gas, save money, write a letter—we can’t live without
    it any longer. The only problem is this: the more we surround ourselves with a
    narrowed notion of existence, the more narrow existence becomes. We conform to
    the range of motion the system allows. We must be more orderly, more logical.
    Answer the question, Yes or No, OK or Cancel.Our accommodations begin simply,
