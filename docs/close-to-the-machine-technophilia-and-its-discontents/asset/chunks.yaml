    I wanted my arrogance back. I wanted to go back to the time when I thought that,
    if I tinkered a bit, I could make anything work. That I could learn anything,
    in no time, and be good at it. The arrogance is a job requirement. It is the confidence-builder
    that lets you keep walking toward the thin cutting edge. It’s what lets you forget
    that your knowledge will be old in a year, you’ve never seen this new technology
    before, you have only a dim understanding of what you’re doing, but—hey, this
