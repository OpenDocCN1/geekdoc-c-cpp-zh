    which—weathered and worn in the way only very expensive things can be—might have
    been carried off from some place called “Raffles.”I asked about his life, about
    which he was circumspect, and finally got to the questions that had brought me
    there.“These men you advise—what do you think drives them? It has to be more than
    money; they already have a lot of money. What is it—what is it inside them?”Mr.
    Charles seemed confused. “Do you want me to examine their psychologies?”“Yes.
    If you can. The best you can. What motivates them?”He thought a minute. “Well,
    I suppose it’s that they want to see their companies grow.”“But why keep growing?”
    I asked. “Can’t someone simply enjoy a good living, a nice life?”Mr. Charles looked
    away, moving his mouth in a gesture that could only have been distaste. “It’s
    boring,” he said finally. “It’s simply not interesting to do the same thing with
    your company year after year. I won’t work with someone who doesn’t want to grow.”“But
    many people find pleasure in other parts of life, don’t they? What do you think
    it is about these CEOs you work with? What kind of person looks for all his satisfactions
    in growing a company? Any why—why do that instead of, I don’t know, getting a
    Ph.D. or learning French?”Again Mr. Charles looked away.“It can’t just be the
    money,” I pressed.“Well, it might be that they have what they think is a good
    idea … .” He trailed off then sat looking at his hands, which were fine-boned
    and pale.But there are many ways to express a good idea, I thought. One could
    talk to people, give a speech, write an article, perhaps a book. But it was clear
    these were not the sort of good ideas he had in mind. No, his were the sorts of
    ideas whose goodness could be expressed only through the amount of revenue they
    generated, the size of the company that was grown, the grandeur of the CEO’s house,
    the price of the stock.“So it is the money,” I said finally.The whitest man I
    ever met looked into his lap then gazed out the window. On the other side of the
    French doors edged in bronze from Paris, the sky was the bright, deep blue of
    early autumn in San Francisco. The two bridges stood against a sparkling bay.
    The searchlight of Alcatraz blinked rhythmically against the water. Toward the
    northwest, a tanker was slowly sliding out the Gate, about to pass under the bridge
    on its long ride west to Japan.The networking-software company lingered on for
    a while. After a hiatus of two weeks, I was called back to work. The idea was
    that, if we finished the product, the company might be easier to sell. Maybe some
    other venture capitalists would be willing to invest in it for a while.The sales
    and finance people—the current office occupants—had a dejected and distracted
    air about them. They didn’t have much to do except sit around and worry. Not so
    for the programmers. The engineers continued working their endless days and long
    weeks. The lead engineer went on sitting in his charged way in his cubicle, his
    knees opening and closing, opening and closing.A merry kind of hysteria took over
    the programmers. The situation was impossible, the deadline was ridiculous, they
    should have been completely demoralized. But, somehow, the absurdity of it all
    simply released them from the reality that was so depressing the rest of the company.
    They played silly jokes on one another. They stayed up late to see who could finish
    their code first. The very impossibility of success seemed to make the process
    of building software only that much sweeter.The lead engineer wanted me to come
    in every day to see their progress. “Look,” he said, “you just select the device
    and drag it over to the location tree—”“—and boom!” said another programmer, “It
    updates. Just like in your specs.”“And the database is updated?” I asked.“Done!”
    said the lead.“And the multiple add,” said a third programmer, a young Chinese
    woman who looked exhausted but who was clearly having the time of her life, “look
    at this.” She typed in a few parameters and the screen filled with information
    as the program cranked away.“Does it crash?” I asked.“Only a little,” she said.“Twice
    yesterday,” said the second programmer.“No,” said the lead, “once. Only once!”They
    arranged a demonstration of their work for the entire company. They put out cake,
    ice cream, champagne. The worried sales and finance people did their best to be
    impressed.In the middle of the demo, I realized how fortunate we were to be engineers.
    How lucky for us to be people who built things and took our satisfactions from
    humming machines and running programs. We certainly wouldn’t mind if the company
    went public and we all got fabulously rich. But the important thing was right
    in front of us. We had started with some scratchings on a whiteboard and built
    this: this operational program, this functional thing.“And look,” said the lead,
    demonstrating his handiwork, “You just click here, drag here, and click here—”“And
    it works,” I said.“Yeah,” he said, exhaling the word in a long breath of contentment,
    then standing back, exultant. “Yeah, it works.”[[8] THE PASSIONATE ENGINEER](#e9781250024589_toc01.html_toctitle10)I
    SAW BRIAN AGAIN.It was my doing—I sought him out—though there wasn’t any good
    reason for me to do it. We hadn’t tried to contact each other. And I knew, through
    various intermediaries, that there was indeed a woman in his life. He and this
    woman had an odd, open relationship that had gone on for years, which I told myself
    was fine: I didn’t want that sort of thing with Brian.I sent him e-mail. Talks
    on the phone with Brian tended to be short and awkward, so e-mail was my preferred
    way of reaching him. But there was a network problem. My mail kept bouncing back
    at me, undelivered.I was reduced to calling him. It was strange, but the words
    that had seemed properly cool in e-mail seemed too forward, made me feel too exposed,
    once Brian was breathing on the other end of the line. So I stupidly read him
    the e-mail message, verbatim, envelope included. “To: brian@exnet.com, From: ullman@neo.com,
    Subject: Saturday? Data: I thought it might be nice to see each other sometime
    when we didn’t have to get up and go to work. How about Saturday? Quit.”Moment
    of dead air. Then: “Saturday? What’s today? Monday? Tuesday?”“Monday.”“I’m sure
    I’ll have some time in the week. But I don’t know about Saturday. I’ll call you.”“Well,
    let me know by—”“Yeah. I’ll call you.”And we hung up.But he didn’t call. Not Tuesday
    or Wednesday or the next day. Not until noon on Saturday.“I made other plans,”
    I told him.“I figured you would,” he said.It was impossible to know exactly what
    this statement meant. Was he more impressed with me for not having waited around?
    I think he saw me as fearlessly independent, not much caring whether I saw him
    or not. He probably would have been hugely disappointed if I had not gone off
    and made my own plans. This idea of me he had—of this free spirit, this mature
    woman who took what she wanted and dropped what she didn’t—was wrong, but it wasn’t
    his fault. He had seen me coming and going at the conference with my several elsewheres.
    I’d invited him out exactly this once. Otherwise, I hadn’t exactly chased him.
    So it shouldn’t have surprised me if he had a mistaken image of me: it was, after
    all, the exact image I’d wanted him to have.“You know, Brian, we don’t have to
    do this.”“No, no. Let’s go out.”“When?”Pause. “Saturday. Next Saturday.”“If you’re—”“Yeah.
    I won’t blow it this time.”We went to a movie. He held my hand all through the
    show. Afterwards he waited for me outside the ladies’ room. When I walked back
    out into the lobby, there was Brian leaning against a wall, with all the other
    boyfriends. I felt strangely pleased at the sight of him, at his high-schoolish,
    date-night good manners. It wasn’t nostalgia—I had been a sullen, rebellious girl
    who drove off any boy who tried to get within a foot of me. No, it wasn’t memory
    but the brief idea of some other life entirely. As he put his arm around me to
    make our way out, I had time to regret the morose young woman I’d been; to wish
    I had let a few more boys into my life to hold my hand at the movies and wait
    for me outside the ladies’.What happened next was a mistake. Instead of just taking
    him home, I suggested a wine bar, one of my haunts. The place was sleek, the clientele
    dressy, the wine expensive. And there sat Brian, cowboy hat in lap. “Do they have
    peppermint tea?” he asked.Maybe it was the stark reality of how mismatched we
    were. Maybe it was the political argument we stumbled into, where Brian showed
    off his cold, “moral-less” side. Maybe I had a subliminal understanding that if
    Brian and I reached each other again through whatever that physical thing was
    between us, I would only want more and more again, and that would be impossible.
    But when we finally did get back to my loft, and we were at last to get to the
    one thing that connected us, I drew back. Or my body did. One moment I was there
    with Brian, I was present in the all-there way that had drawn me back to him,
    and the next, I felt my body slide out from under me and disappear, like a fish
    swimming away into dark water.“I think you’re becoming real,” I said.“What does
    that mean?”“Not just someone to sleep with.”I heard him sigh in the uh-oh sort
    of way men do. “Well, there are complications in my life I need to tell you about,”
    he said. “But I’m too tired right now. I’ll tell you all about it in the morning.”Whereupon
    he fell asleep.I did not fall asleep. I knew instantly he’d misunderstood me.
    He probably thought the next thing I’d say would be a declaration of love, the
    desire for commitment, and so forth—all the messy business of relationship that
    usually brings on the uh-oh response. But I had explained myself badly. “Real”
    at that moment did not mean his realness so much as my own: I was suddenly tired
    of playing the sexual buccaneer.I had a long night to consider why this was true.
    The steeply pitched ceiling sent the reflections of headlights circling overhead,
    and I watched the lights fly around as I roamed through my past. I could no longer
    count the number of lovers I’d had. I could only remember the time when, with
    great surprise, I’d realized that the number of men and women had become about
    equal. After that, I’d let go of the ordinals, the list of names, in sequence,
    and what remained was a flickering serial memory of making love, and the constant
    amazement at how different it was with every single person.It seemed to me I had
    taken lovers rather freely, without a lot of assurances or negotiations. I’d had
    three long-term relationships, marriages in essence. But I didn’t need to marry
    everyone; not everyone had to fit into the whole of my life. I remembered one
    lover in particular, a man I would go off to visit whenever it occurred to me
    to see him. I never called first. I’d just show up and knock on his door. He could
    be there or not; he could be busy or not. If he was there and available, I’d stay.
    We would make love, go the movies, make love some more then sleep a little. In
    the morning, he’d make me strong coffee and rich scrambled eggs. We’d talk for
    a couple of hours. Then I’d leave. Between times, I never wondered what else he
    was doing. When we wanted to talk about our love interests, we did; when we didn’t
    want to mention it, we didn’t. This went on for years.The deep friendliness of
    that old relationship—and its unnegotiated intimacy, most especially—became something
    of an icon for me. I wondered if I would ever find anything like it again. So
    here was my chance, yes? Why not with Brian? The traffic noise seemed too loud
    for that hour of the morning. I watched the reflections of headlights run up the
    walls, circle the ceiling, collide. Why not with Brian?I conjured up the face
    of my old lover. I saw his body, his bed, the look of his kitchen, the way he
    brewed coffee by boiling the grounds. I remembered coming back from the movies
    then making popcorn and lazily watching another movie on the television while
    we talked. There it was: we talked to each other for hours. Our time together
    had a leisurely spaciousness in which he came to know me, and I him. All that
    knowing each other was what made possible our “open” relationship. Besides, we
    never called it that. We didn’t intend anything; it was simply the unexpected
    place we came to with each other.But Brian, I knew, started out with an idea:
    this will go only so far and no farther. We started out on a road that already
    had its dead end. What could be the point of such a relationship? It would be
    too much like a virtual reality, where things only seemed unpredictable and possible.
    Why bother with all the difficulty of another person if it could not go somewhere
    unexpected?It seemed to me that my life was already too full of unconnected bits.
    Contracts that came and went. Companies founded and dissolved. Programs downloaded
    from the Internet, tried out, discarded. Intense moments with colleagues who then
    disappeared. Calls to names at 800 numbers who were usually gone if you asked
    for them again. I had stopped expecting much, I saw. It was too easy to live in
    these discrete, free-roaming capsules, a life like particles from an atom smasher,
    exploding into spectacular existence—for an instant—then gone.I looked over at
    the sleeping Brian. And I felt sorry for both of us. We weren’t very brave. Surely
    we were missing something essential if our idea of other people was a program
    downloaded from the Internet.Before I finally fell asleep, I remembered a conversation
    I’d had with an old friend, the one who recruited me into the communist party.
    We had both been pretty wild in our youth. I used to kid her that she’d slept
    with everybody—and she practically had. “How did we do it?” I asked her. “How
    did have so many lovers? And how did we go so blithely from one to the next?”“You
    have it wrong,” she said. “We weren’t blithe. We suffered. We fell in love with
    all of them.”“Oh, right,” I said. “I remember now.”In the morning, while we were
    still in bed, Brian told me about the woman he called his “main girlfriend.” It
    all seemed reasonable enough. They had been together for four years. They didn’t
    live together. They took other lovers. “I need a lot of psychic distance from
    her,” he said.I’d known about the girlfriend. But where did I fit in?“And the
    others?” I asked. “Where are they?”He looked at his feet. “They’re more … casual,”
    he said.Casual. He might have said almost anything else—they’re all different,
    they’re important in particular ways, who knows what someone will be. But casual
    … . I felt myself float off and away from him. Whatever hold his sweet and unsweet
    sides had on me dissolved in that instant. It was like a sleeping foot coming
    back to life: first some pin sticks, then a little pain, then normal feeling again.“You
    know, Brian, this isn’t exactly my scene. I think we should stop sleeping with
    each other.”He seemed to be expecting this. “Okay. But I’d still like to see you.”How
    would we reach each other if we didn’t have sex? But saying yes seemed to be the
    thing to do. “Sure. If it will be all right with you that we don’t sleep together.”“Oh,
    yeah,” he said with little laugh, “I have years of experience being celibate.
    I learned to control myself.”Months later, I learned just how many years Brian
    had spent controlling himself. How little experience he’d had with women, casual
    or not. How all his “polyamory” stuff was underway but still more notion than
    history. It was just as I’d suspected the first night I spent with him: he’d been
    with himself too long. Even his working life was mostly fantasy. His company never
    did set up an offshore porn server. It did not control the secret paths of a Web
    click. There was no bank in the Caribbean. I have no doubt that one day some of
    Brian’s schemes will become awfully real. But, just then, they were still the
    amoral dreamings of a young man who was too smart and too isolated for his own
    good.Strangely, once it was clear that things between me and Brian were over,
    we relaxed. We lay in bed that morning and had our first friendly, truly personal
    conversation. All the pillow talk we did not have before—where we came from, our
    families, our past lovers, the ones we liked the best—now came freely. I saw that
    I had not been wrong to have those poignant moments over Brian. Because under
    all his determination to be a pornographer, to have his “polyamorous” relationships,
    to be a cool cypherpunk, he really was trying to make contact as best he could.
    He just wasn’t very good at making contact, which you really can’t hold against
    someone, much as you’d like to.Still, it took me a bit to get over the reasons
    I’d wanted to see Brian “sometime when we didn’t have to get up and go to work.”
    I’d had my delusions: I had visions of us lying on the sofa on Sunday morning
    reading the Times. I had this idea we would listen to Glenn Gould playing Bach’s
    G Minor piano concerto. I imagined I would show him the way into this music, the
    slow movement’s aching play of major against minor, the intense miracle of logic
    which, somehow, with all its precision and balance, still burst with passion.
    “Here is how I know God is a passionate engineer,” I thought I might tell him.But
    what could I have been thinking? Brian was a cryptographer, a specialist in hiding.
    He dreamed of creating a universe of anonymous transactions. Scrambled facts,
    anonymity—these are not the makings of someone who can attach to anyone. He wanted
    to hang out with his cypherpunks. He wanted to divide the world into the “main”
    and the “casual.” Even before he could get near the sweet terrors of the possible,
    he tried to cordon himself off. He had a girlfriend from whom he needed “a lot
    of psychic distance.”I drove him to the train. In the car, he looked at me intently.
    “You know, I really do like you,” he said.“Of course you do,” I said, patting
    his hand. “And I like you, too.”I let him off at his stop and got out to say goodbye.
    He hugged me, then held on for one last squeeze. “I’ll call you in a couple of
    days,” he said.I thought it was sweet that he knew to say he really liked me,
    sweet that he knew to hug me goodbye, sweetest of all that he knew to say he would
    call. But as I watched him walk away—funny backside-twitchy walk under long hair
    and cowboy hat—I knew it would be best if we didn’t call and we didn’t try to
    see each other again.And we didn’t.[[9] DRIVING](#e9781250024589_toc01.html_toctitle11)INEVITABLY,
    THERE IS ANOTHER CONTRACT. IT begins, like the others, with a phone call. Someone
    I worked with recommended me. Am I available to design a new product? “Windows
    front end,” murmurs the voice on the phone; “Internet,” he says. But he doesn’t
    really need to entice me. “Yes,” I say, “I’m available.” Yes.This time, instead
    of going south to Silicon Valley, I drive east across the Bay Bridge. 9 AM: the
    road is clear and fast, and I’m across the bridge in no time. The freeway then
    heads south, through cities I’ve always known are there but have forgotten all
    about, then east again, toward Stockton. Just after the freeway takes a big turn
    inland, a line of semis merges from the left. They’re like a wall moving toward
    me, fifty thousand pounds of roaring diesel momentum on a downhill ride to Central
    California. My car isn’t as high as their wheels. It’s not at all clear they see
    me. As I slip through them, moving left and left again as they move right, I remember
    why I bought this fast little car: when trouble comes, I have the choice of yielding
    or accelerating. I accelerate.The company is in an office park built in a former
    pasture. A low haze still rests on the land, and for a moment I can see that this
    was ranch and farm not so long ago. There’s still scrub; birds are busy in scraggly
    hedges. But in every direction are construction cranes and frames for new buildings
    just like the one in front of me. The birds won’t be here for long.I meet with
    the vice president of software development and the project manager. They tell
    me what they want from me: I’m to look at some software they’re modifying and
    make suggestions; if “things work out,” they want me to design some new software.
    I name a ridiculously high hourly rate. They agree. We all shake hands.They take
    me into a conference room, where a computer and monitor are set up. Eight other
    people are already there: vice presidents, managers, programming leads. They all
    sit behind me. They are all there to watch me look at their software. It’s an
    audition, I see. Twenty minutes ago, I didn’t even know what this company did,
    but now ten people I’ve never met before will see if I have anything intelligent
    to say about software for payroll processing, electronic paycheck direct-deposits,
    wire-transfer filing of payroll taxes with the IRS—subjects I don’t know much
    about.“So the payroll is transmitted raw,” I say.“Yeah,” says the lead, “Just
    a flat data stream—”“And you do the calculations, the deposits—”“—the deductions,
    taxes—”“Then you turn around and transmit—”“—the direct deposits, the taxes quarterly,
    the updated company files.”“Cool,” I say.“Yeah,” says the lead.Four hours go by.
    Somewhere in there, sandwiches appear and get eaten, cookies appear and disappear.
    Ten years ago, I would have been in a state of terror. But now the fear energizes
    me. I see down and down again toward the place where imagined money disappears
    into hardware and software. The world of money explodes. I feel like I’m taking
    off in a rocket.“What is the primary work-flow paradigm?” I ask.“We need you to
    help us define it,” says the product manager.“Are you committed to rewriting—?”“Everything.
    From scratch.”Diet Cokes, coffee, cakes: two more hours go by.“And do you have
    an idea for this Internet piece?”“We thought it could be the same as the new client
    software.”“Oh, no. It can’t be. There’s a completely different expectation on
    the Web.”“What are you doing for the next year and a half?” asks the product manager.Things
    have “worked out.” I have passed the audition. I leave the meeting wired with
    thought waves, shake hands in a daze, hit the parking lot buzzed. I’m in a mental
    methedrine high that feels like exaltation.But even as I drive home—T-bar roof
    open, wind that feels like the rushing going on in my brain—I see how this phase
    will pass into the next. Soon enough, the computer will take me back to its own
    place, where the system and its logic take over. I’ll start to worry about the
    payroll clerks using the software I design. I’ll wonder what I’m doing helping
    the IRS collect taxes. It will bother me that so many entities—employer, software
    company, bank, IRS—know so much about the simple act of someone getting paid for
    labor delivered. I’ll think about the strange path of a paycheck direct-deposit,
    how it goes from employer to bank, company to company, while the person being
    paid is just a blip, the recipient’s account a temporary way station, as the money
    flows through the bank’s hands into the hands of a borrower, then out again through
    the great engine of commerce.And I’ll have to muddle through without certainties.
    Without my father’s belief that the machinery of capital, if you worked hard and
    long, was benign in the long run, so benign you could even own a piece of it.
    Without my generation’s macho leftism, which made us think we could smash the
    machine and build a better one. Without Brian’s cocksureness that he was smart
    enough to know all the machine’s little secrets, and so control it.But all that
    can wait. For now, I’m just going to enjoy where I am: at the beginning of a new
    contract, the rocket-takeoff learning curve, the exquisite terror of it, the straight-up
    ride against gravity into a trajectory not yet calculated. The next time I drive
    down to the company, a fog hangs lead-gray over the bay. Then, where the freeway
    turns inland, the fog lifts and thins and reveals the sheer glare of the sky.
    I race past the trucks, toward hills shining green in the clear light. And for
    now, just this now, I feel I’m where I’m supposed to be: hurrying to a place I’ve
    never seen before. If only I could stay here, inside this moment, before it slips
    away, as it surely will: this delusion, this sweet delusion.Also by Ellen UllmanThe
    BugBy Blood![e9781250024589_i0002.jpg](e9781250024589_i0002.jpg)ELLEN ULLMAN is
    the author of the new novel By Blood, and The Bug, selected by The New York Times
    as a Notable Book of 2003, and runner-up for the PEN/Hemingway Award. She lives
    in San Francisco.[Notes](#e9781250024589_toc01.html_toctitle18)[1](#e9781250024589_c02.html_ref_ftn_fn1)Computers
    can be programmed to operate as if they were functioning under conditions of uncertainty.
    In particular, a branch of logic, called “fuzzy logic,” can be used to create
    programs that try to predict the probability of various outcomes when one or more
    pertinent conditions are not well known. However, at the level of the code itself,
    the logic is not fuzzy. Each programming statement must resolve into a set of
    executable machine instructions, each of which is logically determinant. If something
    unexpected happens at the level of the machine instruction, the chip has a bug
    or the computer is “broken.”[2](#e9781250024589_c02.html_ref_ftn_fn2)I quit the
    party after one year—I was expelled when I tried to leave. I then reviewed what
    I knew about computer programming and got my first job in the industry. My employer
    was amazed at my ability to work hundred-hour weeks without complaint, and I was
    promoted rapidly. He did not know that my endurance came from my year in the party.
    Being a cadre in an underground political party, as it turned out, was excellent
    training for the life of a computer programmer.[3](#e9781250024589_c02.html_ref_ftn_fn3)“Gimme
    Shelter,” by the Rolling Stones.[4](#e9781250024589_c02.html_ref_ftn_fn4)Advertisement
    for “The Gate,” an on-line service of the San Francisco Chronicle and Examiner.[5](#e9781250024589_c02.html_ref_ftn_fn5)Today’s
    techno-libertarians have a similar idea about the mechanistic basis of human existence,
    but for very different reasons. They see human thought and consciousness merely
    as the result of many small, local processes in the body and brain, rather than
    as evidence of some observing self. While we communists wanted to make good fighting
    machines of ourselves ostensibly to further social equality, techno-libertarians
    prefer to see human life as a collection of small, local mechanisms because such
    mechanisms “prove” that controlling superstructures, like governments, are not
    necessary.[6](#e9781250024589_c02.html_ref_ftn_fn6)On August 7, 1996, America
    Online became completely inopera-tional for nineteen hours, and its many subscribers
    had to face what life would be like without e-mail and access to the Internet.
    This one-day system failure was widely viewed as a harbinger of life in the electronic
    information age, the sort of occurrence that would become commonplace, given our
    reliance on computer-mediated communications. AOL’s managers, however, described
    it as “a coincidental series of sequential events that will most likely never
    occur again.” The problem was eventually traced to a software upgrade on a network
    router (“a bug in the operating system of the routers that was exercised by this
    particular routing”), the functional equivalent of installing ten new lines of
    assembler code. AOL’s managers were right in a way. That particular problem did
    not happen again. The next failure came from too many subscribers trying to connect
    to the service, a monumental system jam described by the Wall Street Journal as
    “the busy signal heard around the world.”[7](#e9781250024589_c02.html_ref_ftn_fn7)Computer
    cryptology is the study and practice of encoding information for the purposes
    of data privacy. This encoding is called encryption. Current encryption schemes
    involve the use of keys to scramble and unscramble the information. The longer
    the key—the more bits it has—the more difficult it is for an unauthorized person
    to decrypt the information. Encryption with longer keys is called “strong”; shorter
    keys result in “weaker” encryption. As of this writing, keys with 256 bits are
    considered uncrackable at the current state of the computing art. At the time
    of the conference discussed later in this section, the United States government,
    in an attempt to limit the dissemination of “uncrackable” information (and to
    make sure the FBI would be able to perform wiretaps), had made illegal the export
    of encryption software with keys longer than 40 bits. Currently the legal export
    limit is 56-bit keys and an encryption method called DES, but export of this relatively
    “weak” encryption is subject to obtaining a license from the Department of Commerce.
    In general, the U.S. government, through export controls, has hoped to control
    even the domestic use of encryption products, since such controls draw expertise
    and development energies toward weaker products.[8](#e9781250024589_c02.html_ref_ftn_fn8)Evidently
    they, or people just like them, can indeed crack encryption with keys of 40 bits.
    At a data security conference held in January 1997, the conference sponsor, RSA
    Data Security, a maker of encryption products, offered prizes of up to $10,000
    for breaking code encrypted with keys of various lengths. A Berkeley graduate
    student using 259 computers broke 40-bit encryption; it took him about three and
    a half hours.[9](#e9781250024589_c05.html_ref_ftn_fn9)Two months after I had my
    banking fantasy, I went to a conference at which a financial services company,
    Liberty Financial, demonstrated an Internet-based program for its customers. The
    program was “customizable,” said the company representative, to give customers
    what he called a “personalized, interactive experience.” Banking as electronic
    fantasy game is undoubtedly coming, but the company’s product needs work; my fantasy
    is better.[10](#e9781250024589_c05.html_ref_ftn_fn10)Smartphone apps have given
    us the most private experience of our money, even as we each walk separately through
    the space that was once understood to be “in public.”[11](#e9781250024589_c05.html_ref_ftn_fn11)On
    May 9, 1995, auditors from the federal Inspector General’s office entered the
    offices of a Boston AIDS-services provider and compiled a list of names, Social
    Security numbers, dates of birth and HIV status of 98 patients. The provider protested
    that the taking of the information constituted “an egregious breach of confidentiality.”
    The federal government maintained, however, that the service provider received
    federal funding and therefore the government had a right to audit patient data.
    According to a report in the New York Times (April 3, 1996, A13), the auditors
    said “there was evidence of fraudulent use of Social Security numbers and that
    they reported that [fact] to other federal officials responsible for investigating
    such fraud.” The federal government’s right to confiscate files was later upheld
    in court.[12](#e9781250024589_c05.html_ref_ftn_fn12)The same could be said of
    a library, except that libraries have something the Internet considers nearly
    anathema: librarians. The current reigning ideology of the Internet is strictly
    opposed to the idea of a librarian’s overriding sensibility, opting instead for
    the notion that anything, in and of itself, is worthy content. So it is entirely
    up to the end user to distinguish junk from literature. Hence the rapid proliferation
    of search engines. It is interesting to note that, over time, the search engines
    themselves are beginning to incorporate biases and strategies that could be characterized
    as ordering sensibilities. However, these strategies are not in the public domain,
    in a sense making each search engine a private card catalog, a personal collection.[13](#e9781250024589_c05.html_ref_ftn_fn13)For
    all too brief a moment, the ability to create Web pages and write blogs enormously
    enriched the user’s vocabulary on the Net. But a new wave of infantilization and
    loss of control seems to be taking hold. Web pages are being left behind in favor
    of the predetermined format of Facebook. Blogs are yielding to tweets. The purpose
    of most search engines and “apps”—of many Facebook pages and Web sites—is to deliver
    advertising. The user is bombarded, like it or not. Programs are migrating away
    from desktops and laptops, where users can keep whatever version they like, into
    some unknowable, software-vendor-controlled place “in the cloud.”[14](#e9781250024589_c06.html_ref_ftn_fn14)Given
    the political nature of the project, a certain degree of ambiguity in the identification
    of clients was considered an acceptable price and was designed into the system.
    However, the most technically capable consultants uniformly suggested ID cards
    and fingerprinting as “solutions” to this ambiguity of identity. It became a sad
    joke: if they suggest fingerprinting, we said, they probably can do the job.[15](#e9781250024589_c06.html_ref_ftn_fn15)The
    acronyms refer to evolving models for what are called software “objects” as promoted
    by Microsoft and Sun Microsystems. Software objects are designed to let one program,
    such as a charting tool, be embedded in another, such as a spreadsheet. They also
    permit small application programs, called “applets,” and even finer-grain collections
    of code, to be shared over a network, including the Internet. At the time of this
    writing, Sun and Microsoft were offering competing, incompatible object models.[16](#e9781250024589_c06.html_ref_ftn_fn16)The
    tools, languages, and hardware listed above date from the mid-1960s to approximately
    1983\. COBOL was the standard business-programming language during that period;
    it is still in use, though slowly dwindling. The Z-80 and 8080 were the standard
    chips on personal computers of the early 1980s. System 370 Job Control Language
    was used on mainframe computers that were state-of-the-art in the late 1970s.
    FORTRAN was one of the earliest programming languages, though it is still in use
    for some specialized technical applications. Pick was an operating system for
    minicomputers of the mid-1970s and early-1980s; it still runs on some mid-range
    computers but mainly as a way to keep old programs from having to be rewritten.
    The Kaypro computer, daisy-wheel printer, and 300-baud acoustic-coupler modem
    are all completely obsolete, though some survivors may still be operating somewhere.[17](#e9781250024589_c07.html_ref_ftn_fn17)Companies
    are shedding employees then regaining the use of their labor as “contingent workers”:
    as on-call workers, temporaries, workers provided by contract firms, and independent
    contractors. According to a labor department study cited in the New York Times
    (December 8, 1996), 17 percent of all contingent workers had a previous relationship
    with the company at which they were working. Over 22 percent of independent contractors
    had such a previous relationship. A temporary-help agency that supplies contract
    workers to Pacific Bell said that, on an average day, former employees represent
    80 percent of the people they place at the phone company.[18](#e9781250024589_c08.html_ref_ftn_fn18)A
    compiler is a computer program that translates “higher-level” languages, such
    as BASIC, C, or COBOL, into machine-readable code.Three short sections of this
    book, in a slightly different form, were first presented as the commentaries “On
    Becoming an Old Programmer,” “My Virtual Company,” and “In Their Fifties” on the
    National Public Radio program All Things Considered.This book describes real people
    and events. In many cases, however, names and identifying details have been changed,
    and events slightly arranged, to give a measure of privacy to the individuals
    involved.CLOSE TO THE MACHINE. Copyright © 1997 by Ellen Ullman. Introduction
