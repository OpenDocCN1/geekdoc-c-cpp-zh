    Pop: another olive. Then he laughed.[[4] SOFTWARE AND SUBURBIA](#e9781250024589_toc01.html_toctitle6)I’M
    UPSET, SO I’M TAKING APART MY COMPUTERS. If I were a poet, I’d get drunk and yell
