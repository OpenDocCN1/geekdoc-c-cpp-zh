    I took a nom de guerre. If I had been clever enough to write a bug fatal to world
    banking, I would have been promoted to party leadership, hailed as a heroine of
    the revolution. Nothing would have pleased me more than slipping in a well-placed
    bit of mislogic and—crash!—down comes Transnational Capitalism one Christmas Eve.Now
    the thought terrifies me. The wave of nausea I felt in the vice president’s office,
    the real fear of being responsible for her system, followed me around for days.
    And still, try as I might, I can’t envision a world where all the credit cards
    stop working. The life of normal people —buying groceries, paying bills—would
    unravel into confusion overnight. What has happened to me, and what has happened
    to the world? My old leftist beliefs now seem as anomalous and faintly ridiculous
    as a masked Sub-commandante Marcos, Zapatista rebel, son of a furniture-store
    owner, emerging from the Mexican jungles to post his demands on the Internet.We
    are all hooked on the global network now, I tell myself, hooked to it and hooked
    on it. The new drug: the instant, the now, the worldwide. A line from an old Rolling
    Stones’ song and an ad for an on-line newspaper keep running through my head:'
