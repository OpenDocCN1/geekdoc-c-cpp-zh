    culture.What is nerdism like? There is a tendency to reject outward appearances,
    which has its kindnesses. There is a purpose of life in the nerd world, which
    is treating reality as code, and optimizing it. Life becomes a problem-solving
    activity, and the problem is some sort of lack of optimization. Of course this
    imperative breaks down on close examination, but they all do.Back when Close to
    the Machine came out, one of my reactions was that it might portend the beginning
    of a consilience many of us expected. We expected the real world, the world of
    relationships, experience, and mortality, to overtake the abstract little nerdy
    bubble of Silicon Valley. Our little era of computer-modulated living would be
    remembered as one of those exceptional chapters in human affairs, kind of like
    lesbian warrior empires or gypsy migrations. Instead what happened was the opposite.
    The whole world bought in to our nerdy way of life. Everyone now uses UNIX-speak
    to socialize and spread news. We define ourselves as being in relationships, or
    not, on social-networking sites as if we are setting bits in a program. The nerds
    took over.So instead of this book serving as a memorial to a peculiar time, it
    has come to serve as a rarified glimpse into the source point of what has become
    too familiar to notice.I now find myself using the phrase “close to the machine”
    to mean “rich and powerful.” The closer you are to a big server on the Internet,
    the richer you are. The server might run high frequency trades, a search engine,
    a social network, a supply chain (Walmart, I’m looking at you), a botnet, or a
    traditional national spy agency. Unless you have an oil field, it is the means
    to wealth in modernity.The culture of computation has always been a cult of youth,
    which doesn’t prioritize remembering. Youthfulness is a natural enough fit, since
    young minds are better at the tedious side of dealing with computation. What is
    remembered tends to be seductive stories about kids who made good with computers:
    Steve Jobs, Bill Gates, Sergey Brin, and so on.Another reason for the neotenous
    quality of computation is that the trifecta of sex, drugs, and rock and roll had
    failed right around the time computers got plentiful, leaving a vacuum to be filled.
    Sex and drugs became authentically dangerous at that time of AIDS and underworlds,
    and rock and roll, while ever popular, could hardly be associated exclusively
    with youth anymore.Computer culture, while often fashioned to be anarchistic,
    populist, and anti-elitist, seems to unfortunately secure its memories around
    iconic heroes instead of the experiences of ordinary people. But it is only the
    history of the ordinary that can help us understand the present of the ordinary.
    To not seek out that history is to choose a form of blindness.It is imperative
    that we care about the past of computer culture. This is because computers, while
    they seem ever new, actually have a mechanistic way of limiting what we see and
    know, locking us into the present, all the while creating an illusion that we’re
    all-seeing.To illustrate with an example, let’s consider what computers do to
    words. When you (my reader being a person, I presume) want to understand a word
    well, it’s useful to look into its past. I find it helpful to remember the origins
    of the word “computer,” for instance.A modern, digital computer can be programmed
    to “understand” a word. “Then something different happens,” Ullman writes. “The
    irregularities of human thinking start to emerge … . The human mind, as it turns
    out, is messy.”Natural-language software mines the vast databases of existing
    translations and usage patterns found online, and from that automated research,
    statistical correlations are derived. Whether this constitutes something that
    should be called “understanding” at all is a matter of debate, but at any rate,
    the combination of big data and statistics yields useful effects like discernible,
    though imperfect, automatic translation between natural languages.As computers
    mediate human language more and more over time, will language itself start to
    change?Suppose it becomes commonplace to use Internet services to translate between
    Chinese and English. Is it not likely that native speakers of either language
    might, after a while, start to emphasize those turns of phrase that translate
    most reliably? Might the grooves of the translation software start to gradually
    alter the languages that are being translated?We don’t know the answer, since
    the experiment is only now beginning and its effects must take place on a massive
    scale to have meaning.Should it turn out that widespread use of computer translation
    transforms languages even when spoken privately between native speakers, then
    an odd, present-tense feedback loop will be instantiated.This is what I mean about
    how computers can lock us into the present. We create programs using the ideas
    we can feed into them, the ideas in circulation at the time of programming, but
    then we live through the program, so we can forget the arbitrariness of the moment.
    We accept the ideas imbedded in the program as facts of nature.This happens all
    the time with computers. People fashion their social identities around the particular
    multiple-choice database entries a programmer placed in a social networking service
    like Facebook. What could feel more natural than something that engulfs?Whether
    this is a bad thing or not is not my concern here, but I do want to promote the
    quest for truth, as best we can approximate it, and surely we ought to do our
    best to be aware of the ways we’ve chosen to be engulfed.The Internet can give
    you an illusion of omniscience, but you are in a mirror bubble. To get context,
    to see where you are, you must find a way out of the thing that sometimes seems
    to be everything.There are two ways to find your bearings. One way to approach
    the puzzle is to go back in time, as with understanding the origin of the word
    “computer.”There is another way, however, which is to go internal. Find the quiet
    to report honestly what you feel, to escape the iron force field of social expectation
    for just a moment. That’s amazingly hard to do. It can be helpful to read the
    words of someone else who has done it, and that’s one reason literature is so
    important. Rather than the mash-up of the social web, it’s the truth of the individual
    voice.Amazingly, this book takes both paths at once. Here is a personal voice,
    a true and articulate voice, and the story is about that dawn moment, just when
    computation engulfed us.This book provides a unique and beautiful way to set aside
    the power and status games of the moment in order to consider what it means to
    repattern your life within the strange logic Grace Hopper made up so long ago.—Jaron
    Lanier[[0] SPACE IS NUMERIC](#e9781250024589_toc01.html_toctitle2)I HAVE NO IDEA
    WHAT TIME IT IS. There are no windows in this office and no clock, only the blinking
    red LED display of a microwave, which flashes 12:00, 12:00, 12:00, 12:00\. Joel
    and I have been programming for days. We have a bug, a stubborn demon of a bug.
    So the red pulse no-time feels right, like a read-out of our brains, which have
    somehow synchronized themselves at the same blink rate.“But what if they select
    all the text and—”“—hit Delete.”“Damn! The NULL case!”“And if not we’re out of
    the text field and they hit space—”“—yeah, like for—”“—no parameter—”“Hell!”“So
    what if we space-pad?”“I don’t know … . Wait a minute!”“Yeah, we could space-pad—”“—and
    do space as numeric.”“Yes! We’ll call SendKey(space) to—?“—the numeric object.”“My
    God! That fixes it!”“Yeah! That’ll work if—”“—space is numeric!”“—if space is
    numeric!”We lock eyes. We barely breathe. For a slim moment, we are together in
    a universe where two human beings can simultaneously understand the statement
    “if space is numeric!”Joel and I started this round of debugging on Friday morning.
    Sometime later, maybe Friday night, another programmer, Danny, came to work. I
    suppose it must be Sunday by now because it’s been a while since we’ve seen my
    client’s employees around the office. Along the way, at odd times of day or night
    that have completely escaped us, we’ve ordered in three meals of Chinese food,
    eaten six large pizzas, consumed several beers, had innumerable bottles of fizzy
    water, and finished two entire bottles of wine. It has occurred to me that if
    people really knew how software got written, I’m not sure if they’d give their
    money to a bank or get on an airplane ever again.What are we working on? An artificial
    intelligence project to find “subversive” talk over international phone lines?
    Software for the second start-up of a Silicon Valley executive banished from his
    first company? A system to help AIDS patients get services across a city? The
    details escape me just now. We may be helping poor sick people or tuning a set
    of low-level routines to verify bits on a distributed database protocol—I don’t
    care. I should care; in another part of my being—later, perhaps when we emerge
    from this room full of computers—I will care very much why and for whom and for
    what purpose I am writing software. But just now: no. I have passed through a
    membrane where the real world and its uses no longer matter. I am a software engineer,
    an independent contractor working for a department of a city government. I’ve
    hired Joel and three other programmers to work with me. Down the hall is Danny,
    a slim guy in wire-rimmed glasses who comes to work with a big, wire-haired dog.
    Across the bay in his converted backyard shed is Mark, who works on the database.
    Somewhere, probably asleep by now, is Bill the network guy. Right now, there are
    only two things in the universe that matter to us. One, we have some bad bugs
    to fix. Two, we’re supposed to install the system on Monday, which I think is
    tomorrow.“Oh, no, no!” moans Joel, who is slumped over his keyboard. “No-o-o-o.”
    It comes out in a long wail. It has the sound of lost love, lifetime regret. We’ve
    both been programmers long enough to know that we are at that place. If we find
    one more serious problem we can’t solve right away, we will not make it. We won’t
    install. We’ll go the terrible, familiar way of all software: we’ll be late.“No,
    no, no, no. What if the members of the set start with spaces. Oh, God. It won’t
    work.”He is as near to naked despair as has ever been shown to me by anyone not
    in a film. Here, in that place, we have no shame. He has seen me sleeping on the
    floor, drooling. We have both seen Danny’s puffy white midsection—young as he
    is, it’s a pity—when he stripped to his underwear in the heat of the machine room.
    I have seen Joel’s dandruff, light coating of cat fur on his clothes, noticed
    things about his body I should not. And I’m sure he’s seen my sticky hair, noticed
    how dull I look without make-up, caught sight of other details too intimate to
    mention. Still, none of this matters anymore. Our bodies were abandoned long ago,
    reduced to hunger and sleeplessness and the ravages of sitting for hours at a
    keyboard and a mouse. Our physical selves have been battered away. Now we know
    each other in one way and one way only: the code.Besides, I know I can now give
    him pleasure of an order which is rare in any life: I am about to save him from
    despair.“No problem,” I say evenly. I put my hand on his shoulder, intending a
    gesture of reassurance. “The parameters never start with a space.”It is just as
    I hoped. His despair vanishes. He becomes electric, turns to the keyboard and
    begins to type at a rapid speed. Now he is gone from me. He is disappearing into
    the code—now that he knows it will work, now that I have reassured him that, in
    our universe, the one we created together, space can indeed be forever and reliably
    numeric.The connection, the shared thought-stream, is cut. It has all the frustration
    of being abandoned by a lover just before climax. I know this is not physical
    love. He is too young, he works for me; he’s a man and I’ve been tending toward
    women; in any case, he’s too prim and business-schooled for my tastes. I know
