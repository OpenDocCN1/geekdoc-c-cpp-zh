    Come use us, we say. In the end, we simply do what everyone else does on the Net:
    we advertise.I begin to wonder if there isn’t something in computer systems that
    is like a suburban development. Both take places—real, particular places—and turn
    them into anyplace.I once lived three blocks from an undeveloped hillside. The
