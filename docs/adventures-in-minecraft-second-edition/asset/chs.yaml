  另一种让计算机程序在每次运行时执行不同操作的有趣方法，是将输入数据存储在文本文件中，并在计算机启动时让读取该文件。你可以创建任意数量的文本文件，甚至设置一个菜单，根据你想要对程序进行的操作来选择打开哪个文件。这被称为“数据驱动程序”，因为定义程序行为的主要是外部文本文件中的数据。\n\
  \n如果你思考一下，你已经在计算机上使用的许多程序都使用了数据文件。你用来打字的文字处理器会将作业存储在数据文件中；当你用数字相机拍照时会存储在数据文件中；Minecraft\
