  \n# 找出你正站在哪里\n\n你已经在冒险 2 中了解到，通过读取 `getTilePos()` 的坐标，可以追踪玩家的位置。这些坐标代表了你的玩家 Steve\
  \ 此时位于 Minecraft 世界中的 x、y 和 z 坐标。你曾使用这些坐标来感知 Steve 是否站在魔法门垫上，或者使用地理围栏技术（geo-fencing）判断他是否站在田野里。\n\
  \n然而，除非你的程序维护了 Minecraft 世界中每个方块准确位置的详细地图，否则随着你的程序变得越来越复杂，仅通过位置进行感知对你来说将不够灵活。你可以自己保留一份详细地图——但既然\
  \ Minecraft 已经在计算机内存中拥有这些信息以便在屏幕上显示 3D 世界，为什么要费那些麻烦呢？\n\n幸运的是，Minecraft API 还包含一个\
  \ `getBlock()` 函数。该函数让你完全访问 Minecraft 内存中的世界地图，通过坐标，你可以用它告诉你每个方块的信息——不仅是 Steve 所在的方块，而是\
  \ Minecraft 世界中每个位置的每一个方块。\n\n你还在冒险 3 中看到通过方块类型可以改变 Minecraft 世界中的任何方块。幸运的是，`setBlock()`\
  \ 和 `getBlock()` 配对工作，所以如果你使用方块 ID 使用 `setBlock()`，然后立即使用 `getBlock()`，你就会得到相同的方块\
  \ ID。\n\n很快，你将在 Minecraft 中构建另一个激动人心的游戏，但你的程序将会很大。构建大型程序的最佳方法是先构建小程序，一旦确定它们可以工作，再将它们全部连接在一起。让我们从一个简单的程序开始让这个想法变为现实，它会告诉你玩家是否正站在安全的地方。\n\
