  \ 游戏获取玩家的位置：\n\n    ```python\n    pos = mc.player.getTilePos()\n    ```\n6.  告诉\
  \ Minecraft 游戏显示玩家位置的坐标。当程序运行时，`print()`会在 Python Shell 中显示这些坐标：\n\n    ```python\n\
  \    print(pos.x)\n    print(pos.y)\n    print(pos.z)\n    ```\n\n7.  通过 Editor\
  \ 菜单选择`File ⇒ Save` 保存此文件。\n8.  通过 Editor 菜单选择`Run ⇒ Run Module` 运行程序。\n\n你现在应该能看到\
