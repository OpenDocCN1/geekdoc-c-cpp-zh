  \ = alienTarget.clone()\n```\n\n13. 此时，程序返回到 `while` 循环的顶部。当模式设置为 `\"missionaccomplished\"\
  ` 且 `while` 循环结束时，程序的最后一行会让外星人太空船消失：\n\n```python\nalienShape.clear()\n```\n\n14.\
  \ 运行程序，注意从你正上方落下的外星人。\n\n你可以在 *Adventures in Minecraft* 网站下载外星人入侵的完整代码，网址为 [`www.wiley.com/go/adventuresinminecraft2e`](http://www.wiley.com/go/adventuresinminecraft2e)。\n\
  \n# 进一步的模拟冒险\n\n在这次冒险中，你使用了算法和规则来模拟朋友和外星人的入侵——那么更进一步去模拟其他事物怎么样呢？例如一群鸟（或方块）、Minecraft\
  \ 中的海洋波浪，或者一个由方块组成的完整细胞系统（如康威生命游戏）。\n\n欲需了解更多关于康威生命游戏的信息，请访问 [`en.wikipedia.org/wiki/Conway's_Game_of_Life`](https://en.wikipedia.org/wiki/Conway's_Game_of_Life)。\n\
  \n## 快速参考表\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `import random` | 导入 Python `random`\
  \ 模块 |\n| `random.randint(start, end)` | 在 start 和 end 数字之间之间创建一个随机数 |\n| `import\
  \ minecraftstuff` | 导入 `minecraftstuff` 扩展模块，该模块包含在入门套装中 |\n| `mc.getHeight(x,z)`\
  \ | 获取水平位置 (x,z) 陆的高度（y 坐标，即从天空向下第一个不是 `AIR` 的方块） |\n| `mcdrawing = minecraftstuff.↩MinecraftDrawing(mc)`\
  \ | 创建 `MinecraftDrawing` 对象 |\n| `copyOfPosition = position.clone()` | 创建 Minecraft\
  \ 位置的副本 |\n| `mcdrawing.getLine(x1, y1, z1, x2, y2, z2)` | 获取两点之间连线上所有的方块 |\n| `shape\
  \ = minecraftstuff.↩MinecraftShape(mc, pos)shape.setBlock(1,0,0,block.DIRT.id)shape.setBlock(0,0,1,block.DIRT.id)`\
  \ | 创建一个 `MinecraftShape` |\n| `shape.moveBy(x,y,z)` | 按 x,y,z 的值移动 `MinecraftShape`\
  \ |\n| `shape.move(x,y,z)` | 将 `MinecraftShape` 移动到位置 x,y,z |\n| `shape.clear()`\
  \ | 清除 `MinecraftShape` |\n| `shape.draw()` | 绘制 `MinecraftShape` |\n\n![image](img/9781119439585-7-badges-unlocked.png)\n\
  \n解锁成就：被你自己的人工智能智能绑架了！\n\n![image](img/9781119439585-ch08.png)\n\n当你在 Minecraft\
  \ 世界中玩时，即使使用了编程接口，它仍然是一个虚拟世界。你与游戏交互的唯一方式是使用键盘和鼠标引导工程师设计的控制。\n\n但还有另一种与 Minecraft\
  \ 交互的方法——打破沙盒游戏带来的限制，并将其与物理世界连接。在这里，你会很快发现虚拟与现实之间的界限变得模糊，你的游戏体验将变得更有创意和趣味。\n\n在这次冒险中，你将发现如何将\
  \ Minecraft 连接到名为 BBC micro:bit 的小型微型电脑。首先，你将通过感知 BBC micro:bit 的按键按下来测试一切运行正常，然后你创建一个程序，当你走进家里时，BBC\
  \ micro:bit 显示屏会显示房屋图标。你将显示屏作为倒计时器，并将真实的香蕉作为输入设备来触发爆炸倒计时（这样你就再也不会为 Minecraft 中的建筑冒险清理空间时遇到困难了）。最后，你建立了一个滚球游戏，通过倾斜\
  \ BBC micro:bit 来收集物体并避开虚拟游戏桌上的洞。你的朋友们会对你的新魔术感到惊叹，并要求你也为他们制作基于 BBC micro:bit 的游戏控制器！\n\
  \n# 本冒险所需的物品\n\n以下是构建本次冒险中描述的项目所需的所有物品：\n\n*   一个 BBC micro:bit\n*   用于 BBC micro:bit\
  \ 的 USB 线\n*   两个或更多鳄鱼夹线\n*   一个香蕉（可选；橙子也可以！）\n*   来自配套网站的入门套装，或 ‘bitio’ 包的副本\n\n\
  如果你手头没有备用香蕉，别担心——只需触摸 BBC micro:bit 上的引脚即可让本次冒险中的项目运行（但使用香蕉会有趣得多过！）\n\n# 什么是 BBC\
  \ micro:bit?\n\nBBC micro:bit 是一个可编程的小型电脑，由 BBC 和 29 多个行业合作伙伴设计。\n\n## 理解输入和输出\n\
  \n任何计算机系统都有一系列输入和输出，它们与板载处理器配合以构建有趣实用的功能。图 8-1 显示了你的 BBC micro:bit 的布局。\n\n![image](img/9781119439585-fg0801.png)\n\
  \n图 8-1 BBC micro:bit 的正面（左）和背面（右）。以下是内置在你的 BBC micro:bit 中的输入和输出，你将在本次冒险中使用它们：\n\
  \n*   **按钮 A 和 B**：正面的这两个按允许允许你通过按钮来触发动作。通过适当的额外代码，你还可以测量按键时长。\n*   **显示器**：显示器是一个\
  \ 5x5 **发光二极管 (LED)** 矩阵。LED 是一种在电流流过时发光的组件（在本例中为红色）。BBC micro:bit 上的 LED 可以单独编程以创建图标、动画甚至滚动文本。这些\
  \ LED 的强度也可以单独更改为 10 种不同的亮度级别之一。\n*   **引脚 0、1 和 2**：这些金色引脚可用于连接鳄鱼夹，并允许连接外部电路。你也可以用手指触摸引脚，你的\
  \ BBC micro:bit 会感知到你触摸了它们。这些引脚可用于各种输入输出目的。\n*   **3V 和 GND**：这两个金色引脚可用于为你构建的外部电路提供少量电量。GND（地）也用作触控电路的返回路径。\n\
  *   **电池接口**：BBC micro:bit 背面的白色电池接口允许你使用电池组（例如包含两个 AAA 电池的电池组）为其供电。\n*   **USB\
  \ 接口**：USB 接口主要用于将新的程序代码传输到 BBC micro:bit（覆盖存储在上面的任何之前的程序代码）。你还可以在程序运行时使用 USB 接口为\
  \ BBC micro:bit 提供少量电量，并向另一台计算机发送和接收数据。\n\n\n\n\n\n*   **加速度计**：加速度计用于测量加速度，BBC\
  \ micro:bit 可以利用它感知各种形式的运动，包括抖动和倾斜。它与手机内部使用的设备相同，用于感知屏幕的上下朝向。在随后的冒险中，你将使用加速度计来感知倾斜，从而让你\
  \ Minecraft 世界中的球移动。\n\n# 将你的 BBC micro:bit 作为游戏控制器\n\n在这次冒险中，你将把程序加载到 BBC micro:bit\
  \ 上，以便你可以将其作为 Minecraft 的游戏控制器。BBC micro:bit 被用作输入和输出设备，既可以控制也可以对你编写的 Minecraft\
  \ 游戏做出反应。\n\n# 设置你的电脑以连接到 BBC micro:bit\n\n在将 BBC micro:bit 作为你 Minecraft 游戏的控制器使用之前，需要进行一些设置。\n\
  \n## 接入你的 BBC micro:bit\n\n将你的 BBC micro:bit 插入 USB 线，并将 USB 线的另一端插入电脑的空闲 USB 端口。几秒钟后，你应该应该在资源资源管理器（PC）、文件管理器（树莓派）或\
  \ 访达（Apple Mac）中看到一个 `MICROBIT` 驱动器出现。请参考 图 8-2 查看你应该看到内容的示例。\n\n![image](img/9781119439585-fg0802.png)\n\
  \n图 8-2 `MICROBIT` 驱动器出现在资源管理器/文件管理器/访达中\n\n如果你使用的是 Microsoft Windows，可能会在屏幕右下角弹出消息，显示无法安装\
  \ `mbed` 串口驱动。别担心，你的 BBC micro:bit 运行正常，但你需要遵循一个额外的步骤。访问 [`support.microbit.org`](https://support.microbit.org)\
  \ 并搜索“windows serial driver”，然后按照页面上的说明为你的 Windows PC 安装 `mbed` Windows 串口驱动。\n\n\
  ## 将游戏控制器代码加载到你的 BBC micro:bit\n\n设置的最后一步是加载一些帮助 BBC micro:bit 作为游戏控制器工作的代码。我编写了一个名为\
  \ `bitio` 的包（读作 *bitty-o*），它可以将你的 BBC micro:bit 变成你 Minecraft Python 游戏的输入/输出设备。该包包含两个部分：加载到\
  \ BBC micro:bit 上的代码，以及你在主电脑上运行的代码。所有这些代码都包含在你作为 冒险 1 部分下载的入门包中。\n\n所有这些代码都包含在你作为\
  \ 冒险 1 部分下载的入门包中；你应该在 `MyAdventures` 文件夹中看到一个名为 `bitio.hex` 的文件。将此文件拖放到 `MICROBIT`\
  \ 驱动器上，即可将程序加载到 micro:bit 的内存中。背面的黄色系统 LED 会闪烁几秒。当 LED 闪烁完成后，你应该会在屏幕上看到 `bitio`\
  \ 标志，表示程序已正确加载。如果电脑在最后弹出了 `MICROBIT` 驱动器，不要担心；这是正常的，只是因为你的 micro:bit 正在重置并启动你下载到它的程序。\n\
  \n你的 BBC micro:bit 现在准备好接收来自主电脑上编写的 Python 代码的命令了。图 8-3 显示了你 micro:bit 屏幕的样子。\n\n\
  ![image](img/9781119439585-fg0803.png)\n\n图 8-3 micro:bit 上显示 `bitio` 标志。\n\n# 你好\
  \ BBC micro:bit\n\n在 冒险 1 中，你写了“Hello World”来测试一切是否运行正常。在这次冒险中，你将创建一个 Hello 程序来测试你的\
  \ micro:bit 游戏控制器是否正常。坦率说，我已经为你完成了大部分艰性工作，你只需要一个单行程序。执行以下操作：\n\n1. 选择 文件 ⇒ 新文件启动一个新程序，并将其保存为\
  \ `hello.py`。确保将其保存在 `MyAdventures` 文件夹中；否则你的程序将找不到 `microbit` 模块。\n2. 导入 `microbit`\
  \ 模块：\n   ```python\n   import microbit\n   ```\n就是这样。仅此而已！我在入门包中提供的 `microbit`\
  \ Python 模块为你完成了检测和连接 micro:bit 的所有繁琐工作。\n\n现在运行 `hello.py` 并按照屏幕上的指令找到你的 micro:bit。你的程序会自动记住你的\
  \ micro:bit，以便下次使用。你理应能一个类似于 图 8-4 的屏幕：\n\n![image](img/9781119439585-fg0804.png)\n\
  \n图 8-4 你好 BBC:bit \n\n## 感知按键\n\n现在你已经知道 micro:bit 可以与电脑通信，你将通过感知 micro:bit 的按键来实现输出。执行以下步骤：\n\
  \n1. 选择 文件 ⇒ 新文件启动一个新程序并将其保存为 `button.py`。\n2. 导入必要的模块：\n   ```python\n   import\
  \ time\n   import microbit\n   ```\n3. 在控制台中显示一条友好的消息：\n   ```python\n   print(\"\
  button A\")\n   ```\n4. 创建一个无限循环的游戏循环，这样你就可以随时按键：\n   ```python\n   while True:\n\
  \   ```\n5. 使用 `if` 语句检查 micro:bit 按钮是否被按下。如果是，则在控制台中显示消息：\n   ```python\n   if\
  \ microbit.button_a.was_pressed():\n       print(\"Button pressed\")\n       time.sleep(0.5)\n\
  \   ```\n运行 `button.py`。当你按下 micro:bit 上的按钮时，你应该在控制台中看到“Button pressed”，如 图 8-5\
  \ 所示：\n\n![image](img/9781119439585-fg0805.png)\n\n图 8-5 按下按钮时控制台显示消息。\n\n## 使用你的\
  \ BBC micro:bit 显示\n\n在将 micro:bit 与 Minecraft 连接之前，你应该先检查你是否也可以向 micro:bit 输出。你通过修改\
  \ `button.py` 程序在按下按钮时写入显示器来实现这一点。\n\n将你的 `button.py` 修改为如下（新行已加粗）：\n\n```python\n\
  if microbit.button_a.was_pressed():\n    print(\"Button pressed\")\n    microbit.display.show(\"\
  A\")\n    time.sleep(0.5)\n    microbit.display.clear()\n```\n再次运行程序，确保当你按下按钮时，micro:bit\
  \ 的屏幕上会显示字母 A。\n\n# 重温魔法门垫\n\n现在你已经证明了可以使用 micro:bit 作为输入设备和输出设备，是时候使用 Python 将\
  \ micro:bit 链接到你的 Minecraft 游戏世界了。为了实现这一点，你将重温 冒险 2 中的魔法门垫程序并对其添加一点新意。这一次，每当你站在门垫上时，你将在\
  \ micro:bit 显示屏上显示房屋图标。这是将 Minecraft 世界与物理世界链接的第一个示例。\n\n## 开发魔法门垫程序\n\n1. 选择 文件\
  \ ⇒ 新文件启动一个新程序并将其命名为 `house.py`。\n2. 导入必要的模块，包括 `microbit` 模块和 `minecraft` 模块。（这是你第一次将它们结合使用。）同时也建立与\
  \ Minecraft 游戏的连接：\n   ```python\n   import microbit\n   import mcpi.minecraft as\
  \ minecraft\n   import mcpi.block as block\n   import time\n\n   mc = minecraft.Minecraft.create()\n\
  \   ```\n\n\n\n\n### 3. 设置一些常量将作为你欢迎家门垫的坐标。你需要决定想让门垫出现在世界中的哪个位置，并据此选择这些常量。在树莓派上，你可以在\
  \ Minecraft 窗口的左上角看到坐标。在 PC 或 Mac 上，你可以按 `F3` 来查找玩家的坐标。\n\n`HOME_X = 0`\n\n`HOME_Y\
  \ = 0`\n\n`HOME_Z = 0`\n\n## 4. 在这些常量下方，在门垫所在的位置用羊毛创建一个方块。这就是你的门垫——就像你在冒险 2 中创建的那个门垫一样：\n\
  \n`mc.setBlock(HOME_X, HOME_Y, HOME_Z, block.WOOL.id, 15)`\n\n### 5. 编写一个类似于此处代码的游戏循环。请特别注意缩进。这段代码会反复读取玩家位置并对其进行地理围栏划分，以检查你是否在门垫上。如果是，你的\
  \ BBC micro:bit 上将显示房屋的图像。如果你没有站在门垫上，显示屏将显示 `?`：\n\n```\nwhile True:\ntime.sleep(1)\n\
  pos = mc.player.getTilePos()\nif pos.x == HOME_X and pos.z == HOME_Z:\n    microbit.display.show(microbit.Image.HOUSE)\n\
  else:\n    microbit.display.show(\"?\")\n```\n\n运行你的程序，并确保当你站在门垫上时，BBC micro:bit\
  \ 屏幕上显示出房屋图片。当你没有站在门垫上时，屏幕应该显示 `?`。\n\n这太棒了！你现在拥有了所需的所有元素来打破 Minecraft 沙盒世界的虚拟限制，并将游戏与现实世界的物体连接起来。你可以感知输入并控制输出，因此限制你的只有你的想象力和实验的意愿！\n\
  \n## 为显示器设计你自己的图标\n\nBBC micro:bit 许多许多内置图像。你可以通过创建并运行一个列出所有图像名称的短程序来找到它们的列表：\n\n\
  1.  选择文件（File）⇒ 新文件（New File）创建一个新程序，并保存为 `imagelist.py`。\n\n2.  导入 microbit 模块，以便你与你的\
  \ BBC micro:bit 通信：\n\n`import microbit`\n\n3.  打印 `STD_IMAGE_NAMES` 模块变量的值。该变量是一个列表，包含了所有加载到你的\
  \ BBC micro:bit 上的支持图像名称：\n\n`print(microbit.Image.STD_IMAGE_NAMES)`\n\n运行你的程序，你应该能看到一个巨大的图像名称列表，如图\
  \ 8-6 所示。\n\n![image](img/9781119439585-fg0806.png)\n\nFIGURE 8-6 加载到你的 BBC micro:bit\
  \ 上的标准图像列表\n\nmicro:bit 的图像以 5x5 数字网格的形式存储。每个数字可以是 0 到 9 之间的，代表亮度。图 8-7 显示了一个带有房屋图像设计的网格示例，在其下方是创建该图像的代码行。\n\
  \n![image](img/9781119439585-fg0807.png)\n\nFIGURE 8-7 房屋图标的网格设计\n\n这里是你为 BBC micro:bit\
  \ 显示器创建一个房屋所需的代码行：\n\n`MYHOUSE = microbit.Image(\"00900:09090:90009:99999:09990\"\
  )`\n\n注意每行都是由五个数字组成的，并用 `:` 字符分隔它们。因此在 `MYHOUSE` 示例中，有五行数据，每行五列。`0` 表示 LED 关闭，`9`\
  \ 表示 LED 处于全亮度状态。数字 `0` 到 `9` 创建不同的强度，你可以独立于其他像素设置显示器每个像素的强度。\n\n现在你已经知道如何设计自定义图像，你可以编写一个程序在你的\
  \ BBC micro:bit 显示器上显示该图像了：\n\n1.  在你的 `house.py` 程序的顶部、`import` 行之后添加此行代码：\n\n\
  \    `MYHOUSE = microbit.Image(\"00900:09090:90009:99999:09990\")`\n\n2.  修改代码使其看起来如下（更改的行已加粗）：\
  \ \n\n```\nif pos.x == HOME_X and pos.z == HOME_Z:\n    microbit.display.show(MYHOUSE)\n\
  else:\n    microbit.display.show(\"?\")\n```\n\n运行程序，并确保当你站在门垫上时，BBC micro:bit 屏幕上显示房屋图片。当你没有站在门垫上时，屏幕应该显示\
  \ `?`。\n\n## 爆炸器\n\n这太棒了！你现在拥有了所有所需的元素来打破 Minecraft 沙盒世界的虚拟限制并将游戏与现实世界的物体连接起来。你可以感知输入并控制输出，因此限制你的只有你的想象力和实验的意愿！\n\
  \n## 将香蕉连接到 micro:bit\n\n使用鳄鱼夹将一端线夹到 `P0`，另一端夹到 `GND`。图 8-8 显示了这种电路。\n\n![image](img/9781119439585-fg0808.png)\n\
  \n## 触摸输入\n\n现在连接好了香蕉，下一步是编写一个感知你触摸它的程序。\n\n1.  选择文件（File）⇒ 新文件（New File）创建一个新程序，并保存为\
  \ `banana.py`。\n\n2.  导入必要的模块：\n\n    `import microbit`\n\n    `import time`\n\n\
  3.  为显示器创建一个新的香蕉图像：\n\n    `BANANA = microbit.Image(\"00090:00090:00990:09999:99990\"\
  )`\n\n4.  创建一个带有短时间延迟的游戏循环。这个延迟是为了防止在你触摸不够精确时显示器频繁闪烁。\n\n5.  使用 `is_touched()` 感知\
  \ `P0` 引是否被触摸。如果被触摸，显示你的自定义香蕉图像；如果没有被触摸，显示 `?`：\n\n```\nwhile True:\n    time.sleep(0.25)\n\
  \    if microbit.pin0.is_touched():\n        microbit.display.show(BANANA)\n   \
  \ else:\n        microbit.display.show(\"?\")\n```\n\n运行你的代码，并确保当你触摸香蕉时显示你的自定义香蕉图像。\n\
  \n## 编写爆炸器程序\n\n现在你的香蕉输入工作正常，下一个程序将基于这些想法并将它们连接到你的 Minecraft 游戏世界。当你触摸香蕉时，你会看到 BBC\
  \ micro:bit 的显示器从五数到零，然后在 Minecraft 世界中炸出一个巨大的陨石！\n\n1.  选择文件（File）⇒ 新文件（New File）启动一个新程序，并保存为\
