  \n## 停止程序\n\nHello Minecraft World 程序运行、在屏幕上显示消息然后停止。然而，知道如何强制停止程序运行是非常重要的，因为在未来的冒险中，你创建的程序除非你它们停止，否则将不会停止！要停止程序，选择\
