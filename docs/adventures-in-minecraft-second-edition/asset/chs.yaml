  \ 3D 鸟瞰视图，如图图 5-3\n\n图 5-3 Minecraft 内部迷宫的鸟瞰视图\n\n# 构建 3D 方块打印机\n\n构建迷宫非常有趣，但既然你已经掌握了基础，现在你可以用数据文件做更多事情！为什么要停留在单层仅使用两种方块类型进行构建呢？你现在将把你的迷宫程序作为自己\
  \ 3D 打印机和 3D 扫描仪的基础，它可以复制树木、房屋——事实上，任何你在 Minecraft 中构建的物体——并只需按一下按钮在 Minecraft 世界到处“打印”它们！这本质上是一个方块构建器，但我喜欢称之为\
  \ 3D 打印机，因为你有时可以看到方块一行一行地建立，就像电脑打印机一行一行打印到纸上，或者 3D 打印机一层一层构建结构一样。\n\n你现在非常擅长构建程序，每个新程序都比上一个大。就像在之前的冒险中你用函数构建程序一样，你也将分步骤构建这个程序。\n\
  \n## 手工制作小型测试对象进行 3D 打印\n\n在你的迷宫程序中，数据存储在 CSV 文件中，每一行代表 Minecraft 世界内的一行方块。该行的每一列（用逗号分隔）对应该行方块中的一个方块。这是一个\
  \ 2D 结构，因为它存储了矩形区域每个 `x` 和 `z` 坐标的方块。你在这里构建的迷宫实际上只是 2D 迷宫，因为它们只有一层。它们只是通过 3D 方块构建在\
  \ 3D Minecraft 世界中。\n\n要构建 3D 形状，你需要在 `y` 维度上也进行构建。如果你将 3D 对象简单视为多个层或切片，那么你的 3D\
  \ 程序和迷宫程序并没有太大区别。对于一个大小为 5x5x5 方块的立方体，你只需要存储五层信息。\n\n这里有一个问题：你的 Python 程序在处理整个文件之前并不知道预期有多少行。它可以假设一个特定的大小，但如果能设计一种可以适用于任何大小对象的灵活\
  \ CSV 文件格式就更好了。\n\n为了解决这个问题，你的 Python 程序在处理整个文件之前并不知道预期有多少行……（此处后续为重复内容已略除）\n\n\n\
  \n\n\n```python\ncoords = lines[0].split(\",\")\nsizex = int(coords[0])\nsizey =\
  \ int(coords[1])\nsizez = int(coords[2])\n```\n\n8. 设置一个 `lineidx` 变量来记录你正在处理的 `lines[]`\
  \ 列表中的行索引。由于你的程序会扫描 `lines` 列表并读取 3D 对象不同层级的数据，因此你不能用它作为循环控制变量：\n\n```python\nlineidx\
  \ = 1\n```\n\n9. 第一个 `for` 循环扫描从文件中读取的数据的每一个垂直层。文件的前几行是用于构建在最低 y 层的层。你可以在这里放一个 `postToChat`，这样在\
  \ Minecraft 内部就能看到打印过程的进度了：\n\n```python\nfor y in range(sizey):\nmc.postToChat(str(y))\n\
  ```\n\n10. 通过给 `lineidx` 变量加 1，跳过文件中每层之间的空行。请记住，这些空行只存在于文件中以便方便人们阅读，但你的程序必须跳过它们。\n\
  \n```python\nlineidx = lineidx + 1\n```\n\n11. 开始一个嵌套的 `for` 循环，读取文件的下一行并在每遇到逗号时对其拆分。注意这里的缩进；`for`\
  \ 必须缩进两层（一级针对函数，二级针对 `for y` 循环），而这个 `for x` 循环内部的代码需要缩进三层。\n\n```python\nfor x\
  \ in range(sizex):\nline = lines[lineidx]\nlineidx = lineidx + 1\ndata = line.split(\"\
  ,\")\n```\n\n12. 现在启动第三个 `for` 循环，扫描刚刚读取的行中的每个区块并在 Minecraft 内部构建它们。`for z` 循环缩进三层，循环体缩进四层，所以务必特别注意缩进；否则你将得到一些形状非常奇怪的对象！\n\
  \n```python\nfor z in range(sizez):\nblockid = int(data[z])\nmc.setBlock(originx+x,\
  \ originy+y, originz+z, blockid)\n```\n\n13. 最后，输入主程序的代码行，这些行完全没有缩进。这些行读取玩家位置，然后要求\
  \ `print3D()` 函数在你站立的侧面打印你的 3D 对象：\n\n```python\npos = mc.player.getTilePos()\n\
  print3D(FILENAME, pos.x+1, pos.y, pos.z+1)\n```\n\n保存你的程序并运行它，看看会发生什么！在 Minecraft\
