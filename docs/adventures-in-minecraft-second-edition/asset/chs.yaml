  \   Python 还没有执行任何操作，因为它正在等待属于循环的程序语句（这些通常被称为循环体）。\n3. Python Shell 会自动为你将下一行缩进一级，这样\
  \ Python 就知道你的 `print()` 语句属于 `for` 循环。现在输入这个 `print()` 语句：\n   `print(a)`\n4. 按两次回车键。第一次按标记了\
  \ `print()` 语句的结束；第二次按告诉 Python Shell 你已经完成了循环。\n\n你现在应该能在 Python Shell 屏幕上看到打印从\
  \ 0 到 9 的数字。\n\n## 使用 for 循环构建巨大的塔\n\n你想在 Minecraft 世界中用方块建造一座巨大的塔吗？既然你已经了解了所有关于\
