  \n# 使用 Python 列表作为魔法内存\n\n在目前为止编写的所有程序中，你都使用了某种形式的变量来存储随程序运行而改变的信息。每个变量都有一个名字和一个值，如果你想让程序记住多一件事情，你就使用更多的变量。\n\
  \n然而，这些变量的大小是固定的，且每个只能存储一个东西（例如，一个数字或文本字符串）。在作为 Minecraft 程序员将编写的许多程序中，你需要存储不确定数量的项目。你并不总是知道想在程序中存储多少个项目。\n\
  \n幸运的是，像任何现代编程语言一样，Python 有一种名为**列表**（list）的特性，它可以随程序运行存储不同数量的数据。\n\n## 实验列表\n\n\
  理解列表的最佳方法是在 Python Shell 中对其进行实验。\n\n1.  点击 Python Shell 窗口将其置于顶层。点击最后一个 `>>>` 提示符右侧，那里是你开始输入交互式命令的地方。不要忘记你必须通过\
  \ Python Shell 菜单中选择 `Shell` `Restart Shell`（重启 Shell）或按下 `CTRL` 然后 `C` 来停止正在运行的程序。如果你之前的程序仍在运行，下一部分将不起作用！\n\
  \n2.  创建一个空列表，并显示列表中的内容：\n\n    ```python\n    a = [] # 一个空列表\n    print(a)\n  \
  \  ```\n\n3.  向列表添加一个新项目，并再次打印：\n\n    ```python\n    a.append(\"hello\")\n    print(a)\n\
  \    ```\n\n4.  向列表添加第二个项目，并再次打印：\n\n    ```python\n    a.append(\"minecraft\")\n\
  \    print(a)\n    ```\n\n5.  检查列表有多长：\n\n    ```python\n    print(len(a))\n   \
  \ ```\n\n6.  查看列表内特定位置的项。这些位置被称为**索引**（indexes）：\n\n    ```python\n    print(a[0])\
  \ # [0] 是第一个项目的索引\n    print(a[1]) # [1] 是第二个项目的索引\n    ```\n\n7.  从列表末尾删除一个单词，并显示该单词：\n\
  \n    ```python\n    word = a.pop()\n    print(word)\n    ```\n\n8.  检查列表的长度，检查单词的长度：\n\
  \n    ```python\n    print(len(a))\n    print(word)\n    ```\n\n9.  从列表中移除最后一个项，显示该项和列表：\n\
  \n    ```python\n    a.pop()\n    print(word)\n    print(a)\n    ```\n\n    图 4-3\
  \ 显示了在 Python Shell 中进行这些实验的输出。\n\n![image](img/9781119439585-fg0403)\n\n在 Python\
