  \ 显示玩家的位置\n\n理解坐标工作的最好方法是编写一个小型实验程序，这就是你现在要做的。这个程序将显示玩家的 3D 坐标，你可以看到坐标随着玩家的移动而变化。\n\
  \n1.  在 Python Shell 中，通过选择`File ⇒ New File` 创建一个新程序。打开一个新的无标题窗口，这就是输入新程序的地方。\n\
  2.  在开始输入程序之前，先保存文件是一个良好的习惯，这样如果你必须匆忙离开，就不需要在压力下临时为程序起名字了。你只需要选择保存即可。专业程序员经常这样做以确保他们的工作不丢失。从新无标题窗口的菜单中，选择`File ⇒ Save\
  \ As`，并输入名称 `whereAmI.py`。确保将程序保存在 `MyAdventures` 文件夹内。\n3.  你的程序通过 Minecraft API\
  \ 直接与 Minecraft 游戏通信。为了访问此 API，你需要导入 `minecraft` 模块，它让你的 Python 程序能够访问 Minecraft\
  \ 游戏的所有功能。使用以下代码导入模块：\n\n    ```python\n    import mcpi.minecraft as minecraft\n\
  \    ```\n4.  要与运行中的 Minecraft 游戏通信，你需要连接到该游戏。输入以下内容连接 Minecraft 游戏：\n\n    ```python\n\
