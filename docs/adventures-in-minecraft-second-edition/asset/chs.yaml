  FIGURE 4-4 当你的玩家安全地站在地上时，桥梁神奇地消失了。\n\n# 感知方块被击中\n\n你在这次冒险工具箱中需要的最后一个感知能力是感知玩家何时击中方块。方块击检测允许你创建一些非常有趣的游戏和程序，因为它允许玩家直接与\
