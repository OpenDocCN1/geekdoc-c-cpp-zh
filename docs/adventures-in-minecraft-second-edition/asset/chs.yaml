- "# Minecraft 探险（第二版）\n\n\n\n![](img/cover.jpg)\n\n# 前言\n\n我是一名老师，我的主要兴趣是学生的学习和参与度。当我使用\
  \ Minecraft 教授编程时（我的主要用途是在 Raspberry Jam 活动和课堂上，帮助学生学习 Python 编程），学生们的参与度比我使用其他技术要高得多。当教学计划转向理论领域或其他编程任务时，学生们经常会说：“老师，我们什么时候能再次用\
  \ Minecraft 写代码了？”简单来说，Minecraft 植根于孩子们的大脑中，而编程技术也扎得更深。\n\nMinecraft 拥有以我以前所未见的方式吸引学生的能力。Minecraft\
  \ 的简单性对所有孩子都具有普遍的吸引力，就像积木一样。当孩子们以 Minecraft 作为教学媒介接触新技能时——无论是在教室、图书馆还是创空间（makerspace）环境中——这种吸引力依然存在。由于学生能够保持投入并对学习新技能产生兴趣，在教室里使用\
  \ Minecraft 对老师和学生来说都是非常有意义的。\n\n我相信 Minecraft 作为教学工具之所以有效的原因之一是因为它提供了即时的视觉反馈，无论是以房屋、3D\
  \ 乌龟形状、整个小镇还是国际空间站追踪器的形式呈现。毕竟，Minecraft 是一个沙盒，这意味着你通过 Minecraft 可以实现的内容是没有限制的——即使在树莓派的精简版上也是如此。\n\
  \n学生在 Minecraft 中创作的记忆是极佳的参考材料——这有助于标记概念性学习，并成为他们极佳的复习辅助。例如，我经常通过提醒学生我们某次课创建 32\
  \ x 32 的随机方块墙，来介绍二维数组。\n\n在我位于英国诺西西格郡郡（North Warwickshire）的学校，我们有 10 份《Adventures\
  \ in Minecraft》，我们在介绍了简单的工作单类型活动后，使用它来帮助学生独立完成项目。例如，我们可能会完成一项任务，如在玩家行走时掉落彩虹，然后学生就可以独立地使用这本书来建造一个房子或制作一个小游戏。这本书的妙之处在于，书中的冒险可以分段进行，也可以通通读完。你可以对它们进行重新混合并向不同的方向发展。我发现，我自己创建的大多数资源都是源于\
  \ David 或 Martin 的最初想法或代码。这本书启发了所有年龄段的人参与计算机编程。从本质上说，它提供了一个平台让老师、父母以及最重要的孩子们可以在此进行构建。\n\
  \n如果认为学习局限于教室，那是天真的。诸如 CodeClub、Coderdojo 和 Raspberry Jams 等活动是全球范围内参与 Minecraft\
  \ 编程的活跃社区。家中的家庭或独自工作的学生也正在学习编程。这本书在这些每种场景中都具有意义。\n\n我曾听过 Martin 描述这本书为“潜移默化的学习”。我认为这就是核心所在：你用代码制作酷炫的东西，在这个过程中学习如何迭代、使用文件处理、使用条件判断以及更多内容。学生和孩子们在学习编程的同时，享受乐趣，并不断受到挑战并投入到解决问题的过程中。\n\
  \n在这本书的新版本中，Martin 和 David 增加了 BBC micro:bit 冒险章节，这引入了更多的物理计算。在过去的几年里，BBC micro:bit\
  \ 帮助将计算带到了世界各地儿童的手中。通过增加 BBC micro:bit 章节，Martin 和 David 再次帮助降低了儿童、老师和父母的障碍，让他们释放想象力。\n\
  \n祝你在 Minecraft 的冒险中好运连连！\n\n–Chris Penn，IT/CS 老师，英国沃西克斯郡 Nicholas Chamberlaine\
  \ 学校\n\n其他读者对《Adventures in Minecraft》也有极高的评价：\n\n“绝对的救命稻草！我每天都用，David 和 Martin\
  \ 是了不起的资源！”\n–Bob，教育工作者，美国\n\n“我们在 8 年级的计算机科学课程中使用了书中的章节，并在 Hull Raspberry Jam 经常使用它。”\n\
  –Jon，教育工作者及 Raspberry Jam 组织者，英国赫尔\n\n“这是一本超级棒的书，充满了介绍 Python 原理和 3D CAD 的惊艳方法。”\n\
  –Frank，英国 Raspberry Jam 组织者，伦敦\n\n“在我参加的每一个活动中都会向父母推荐它，甚至在中国也是如此。我编程之旅的起点！”\n–Gemma，参与性艺术家，英国曼彻斯特\n\
  \n“它对 Leeds Raspberry Jam 的个人和双人挑战非常有帮助，包括家庭活动。它提供的更多项目标记非常有启发性。”\n–Claire，教育工作者及\
  \ Raspberry Jam 组织者，英国利兹\n\n“无价资源。黑克普尔 Raspberry Jam 的孩子们喜欢它！”\n–Les，教育培训师及 Raspberry\
  \ Jam 组织者，英国黑克普尔”\n\n# 引言\n\n你是一个冒险家吗？你喜欢尝试新事物和学习新技能吗？你是 Minecraft 的忠实粉丝吗？你想不想通过学习编写与游戏交互的计算机程序（mods）来突破你在\
  \ Minecraft 中操作的边界，并用你的创造力和魔法让朋友们大惊眼镜？如果答案是肯定的“是！”，那么这本书就是为你准备的。\n\n# 什么是 Minecraft？\n\
  \nMinecraft 是一个沙盒独立游戏，在其中你建造结构、收集物品、采矿矿并战斗怪物以生存。它对你来说是一个由不同类型的方块组成的 3D 虚拟世界，每个方块在\
  \ 3D 虚拟世界的网格布局中都有自己的位置。图 1 展示了 Minecraft 世界的示例。\n\n![image](img/9781119439585-fgunin01.png)\n\
  \n图 1 Minecraft 世界\n\n## 虚拟世界\n\n在沙盒游戏中，你是一个虚拟世界（一个装满沙子的沙盒）中的玩家。你并不是按照预设顺序提供关卡，而是在虚拟世界中漫游，对你想实现的目标以及如何实现做出自己的选择。在\
  \ Minecraft 中，你的玩家或化身被称为 Steve。你引导 Steve 通过沙盒虚拟世界完成你决定的任何任务。如果你在第一个夜晚对抗怪物时生存下来，就可以遵循自己的迷人任务。\n\
  \n沙盒游戏允许玩家对游戏做出自己的决定，而不是被游戏设计者强制沿着特定路线。你可以在 [`http://en.wikipedia.org/wiki/Open_world`](http://en.wikipedia.org/wiki/Open_world)了解更多这种游戏设计。关于为什么玩家叫\
  \ Steve 有些神秘，你可以在 [`http://minecraft.gamepedia.com/The_Player`](http://minecraft.gamepedia.com/The_Player)了解更多。\n\
  \n## Minecraft 是产生的？\n\n\n\n\n独立游戏是“独立开发的视频游戏”，由个人或小团队创建。它们通常在没有游戏发行商任何资金或支持的情况下开发。由于其独立性，独立游戏通常比其他更主流的游戏更具创新性。根据维基百科，`Minecraft`\
  \ 是由瑞典计算机程序员 `Markus Persson` 创建的，他以游戏 ID“Notch”而闻名。他在 2009 年首次展示了 `Minecraft` 的早期版本，该游戏于\
  \ 2011 年首次正式发布。`Notch` 创立了一家名为 `Mojang AB` 的瑞典公司，该公司继续在许多计算机平台上开发 `Minecraft` 游戏，包括\
  \ PC、Mac、树莓派、Linux、iOS、Android、Xbox 360、Playstation 和 Wii。\n\n你可以通过一部名为《Minecraft:\
  \ The Story of Mojang》的纪录片了解更多关于这段迷人的 `Minecraft` 故事（[`http://en.wikipedia.org/wiki/Minecraft:_The_Story_of_Mojang`](http://en.wikipedia.org/wiki/Minecraft:_The_Story_of_Mojang)）。\n\
  \n# 什么是 Minecraft 编程？\n\n这是一本关于计算机编程的书——它利用 `Minecraft` 作为教你计算机编程的方法。如果你正在寻找一些关于如何建造结构和进行战斗的实用提示，市面上还有一些在\
  \ 附录 A 中列出的其他优秀书籍，它们将对你有所帮助。\n\n通过编程 `Minecraft`，你可以让游戏体验变得更加兴奋、富有创意且个性化。当你玩普通游戏时，你遵循游戏设计师设定的\
  \ `Minecraft` 游戏基本规则。通过编写与 `Minecraft` 游戏世界交互的程序，你可以让复杂且重复的任务——例如建造巨大的房屋街道和大型结构——自动完成。你可以让游戏及其内部的对象以新的方式运行，你还可以发明甚至游戏原始创作者都没有想过的新事物。但最重要的是，你将学习一项通用技能——如何使用\
  \ `Python` 编程语言进行编程。然后你就可以将其应用到 `Minecraft` 之外的所有其他事情上。图 2 显示了一个由短 `Python` 程序自动建造的巨大房屋街道。\n\
  \n![image](img/9781119439585-fgunin02.png)\n\nFIGURE 2 由一个 20 行 `Python` 程序建造的巨大房屋街道\n\
  \n在一个关于为什么所有孩子都应该学习编程的视频（[`www.youtube.com/watch?v=nKIu9yen5nc`](http://www.youtube.com/watch?v=nKIu9yen5nc)）中，`Will.i.am`\
  \ 被引用说大的程序员是今天的摇星”。你在跟随书中的冒险时学的新技能将让你的 `Minecraft` 体验更加个性化、更有创意、更有野心。你编程的新魔术会让你的朋友和\
  \ Fellow 游戏玩家感到惊叹，并激励他们询问你使用了什么魔法来实现如此惊人的成就。答案，当然，是计算机编程的魔法。\n\n# 谁应该读这本书？\n\n《Minecraft\
  \ 冒险》适合任何喜欢玩 `Minecraft` 并想要学习编程及其用它做更多事情的年轻人。《冒险》系列书籍针对 11 至 15 岁的读者，但一些更具挑战性的后期冒险可能也适合年长大的读者。早期的章节也经过了低至\
  \ 8 岁读者的测试。\n\n你可能已经是一个游戏专家，但发现自己因建造新结构所需的时间而感到沮丧。或者，你可能想寻找方法通过为世界添加额外的智能和自动化来扩展游戏。无论你的原因是什么，这本书都将成为你开启\
  \ `Minecraft` 编程之旅的指南；正如每位冒险者所知的，你的指南书是你背包中最重要的物品。你的旅程将带你从简单的起点开始，例如在 `Minecraft`\
  \ 聊天中发布消息，到学习使用 `Python` 编程语言为 `Minecraft` 编程，再到发现如何使用你新的计算机编程技能在 `Minecraft` 内部编写属于你自己的激动游戏。当你冒险结束时，你将已经学会了成为\
  \ `Minecraft` 编程先驱所需的技能！\n\n# 你将学到什么\n\n你将学习 `Minecraft` 游戏的许多方面，以及如何通过 `Python`\
  \ 编程语言与 `Minecraft` 功能交互。你将发现如何在 3D 世界中通过坐标对方块进行定位、如何感知玩家的位置、如何在 `Minecraft` 世界中创建和删除方块，以及如何感知方块被玩家击中。\n\
  \n你将学习如何用 `Python` 编程语言编写程序，从最初的 `Hello Minecraft World` 程序开始，到创建并与巨大的 3D 对象交互，得益于你新的\
  \ `Python` 编程技能，你可以为这些对象盖上自己的个性。如果你使用 PC 或 Mac，你还将学习如何设置和运行你自己的本地 `Minecraft` 服务器。\n\
  \n使用 `Python` 辅助代码的免费 `MinecraftStuff` 模块，你将能够增强利用块、线条、多边形和文本创建 2D 和 3D 对象的能力。\n\
  \n你的冒险将不仅限于 `Minecraft` 的虚拟世界！我们将介绍如何将 `Minecraft` 连接到其他设备，例如 BBC microbit，这让你的\
  \ `Minecraft` 世界能够感知并控制现实世界。因此，我们将为你开启一个宝贵的秘密：突破虚拟世界的边界！\n\n# 我们假设你已知\n\n由于这是一本关于编程\
  \ `Minecraft` 的书，我们希望专注于它的编程方面，因此我们对读者及已知知识做了一些假设：\n\n1. 你拥有一台计算机（运行 Raspbian 的树莓派、运行\
  \ Microsoft Windows 的 PC 或运行 macOS 的 Mac），它符合 `Minecraft` 的要求并已设置好运行。\n2. 你对如何使用计算机有基础，例如使用键盘和鼠标、使用菜单启动程序以及使用`文件`等菜单。\n\
  3. 你有互联网连接，并知道如何使用浏览器下载文件。\n4. 如果你使用 PC 或 Mac，你已经有了 `Minecraft` 账号并安装了可以运行的副本。\n\
  5. 你知道如何玩 `Minecraft` 游戏，例如如何启动它、如何移动、如何从物品选择物品以及如何在世界上创建和删除块。\n\n由于这是一本关于编程 `Minecraft`\
  \ 的书，我们不假设你有任何先验知识。随着你不断冒险，我们将引导你完成所需的步骤。\n\n# 项目所需的物品\n\n我们编写此书是为了适用于三种常见的计算机：运行\
  \ Raspbian 的树莓派、运行 Microsoft Windows 的 PC 以及运行 macOS 的 Mac。`Minecraft` 也支持其他平台，例如运行各种\
  \ Linux 发行版的 PC，但我们没有在书中介绍这些平台的设置。\n\n为了让各个部分的设置变得简单，我们准备了三个启动套件，每个支持的计算机平台一个。你可以下载适用于你计算机的正确套件，在你的第一个冒险中，我们将提供有关下载和安装这些内容并让其运行的逐步说明。这些启动套件包含了你需要的一切内容，除了\
  \ `Minecraft` 本身。你很快就能上手的！\n\n\n\n\n在冒险 8 和冒险 9 中，我们将向你展示如何将 Minecraft 虚拟世界与现实世界连接起来。为此，你需要购买一个\
  \ BBC micro:bit，这是一种小型手持式可编程计算机，具有多种输入输出功能，你可以将其用于你的 Minecraft 游戏。我们在附录 A 中提供了若干购买\
  \ BBC micro:bit 的链接。\n\n在这段旅程中，最重要的事情是你对 Minecraft 拥有的兴奋和热情，以及对自己的想法充满好奇心并愿意进行实验，不断突破你既有知识的边界！\n\
  \n# 给家长和老师的说明\n\n我们将本书分成了多个独立的自成体系的冒险，你可以将它们视为单个独立项目，每个项目都关注 Minecraft 编程的一项特定功能。`Python`\
  \ 语言在每个冒险中循序渐进地引入；早期的冒险主要面向初学者，后期的冒险更具挑战性，并引入了更多 `Python` 内容，对读者提出了更高的要求。\n\n每个冒险都呈现了一个实用的项目，并附有分步骤的说明（读者可以在完成时进行勾选），以描述性的风格呈现，非常像一份注释详尽的程序列表。详细的解释出现在“深入代码代码”（Digging\
  \ into the Code）侧边栏中，学生可以以后阅读，这意味着他们不会在输入和尝试运行程序的过程中被分心。\n\n每个冒险可能需要一个课时以上才能完成，但它们都被分成了几个章节，并在逻辑点设置了子标题，这些标题可以作为单节课的目标，或者作为跨越多个课时的活动。\n\
  \n`Python` 语言使用程序左侧的缩进来表示代码结构，并且它是一种大小写敏感的语言。对于非常幼的读者，成人的额外指导有时很有用，可以确保他们仔细地使用大小写和缩进，从而避免在程序中引入错误的可能。所有程序都可以从伙伴网站下载，因此如果你在缩进上遇到问题，可以检查我们的程序版本，看看可能哪里出了错。\n\
  \n## 第二版的改进\n\n此版本延续了第一版同样非常成功的风格和内容，并进行了一些细改进、错误修复并替换了一个冒险：\n\n*   可下载的启动包已略微简化。PC、Mac\
  \ 和树莓派上的所有坐标现在都统一作为绝对坐标报告给 `Python` 程序——即 Minecraft 内部的真实坐标（而不是像以前那样相对于生成点的相对坐标）。这使得孩子们更容易理解与在\
  \ Minecraft 中定位对象相关的数学问题，尽管代价是有时会报告一些很大的数字。现在屏幕上报告的坐标与你编写的 `Python` 程序报告的坐标相匹配。\n\
  \n*   为了使本书与时俱进并与学校常用的技术保持一致，所有程序现在均使用最新版本的 `Python 3` 编写，我们将在冒险 1 中建议读者下载该版本。你在我们程序中发现的唯一区别是使用了\
  \ `input()` 而不是 `raw_input()`（`Python 3` 在这方面与 `Python 2` 略有不同）。\n\n*   上一版本的冒险\
  \ 5 已被替换为一个全新的冒险，读者在其中使用 BBC micro:bit 作为可编程的 Minecraft 游戏控制器。新冒险被移动到了书的较后位置（冒险\
  \ 8），以便加入一些使用 BBC micro:bit 的 Minecraft 大型项目。BBC micro:bit 在全球范围内可以通过许多零售商购买，包括一些直接零售的商店。它为物理计算世界提供了一个可以与\
  \ Minecraft 配合使用的非常廉价的入口；它本身也是一台完全可编程的计算机，我们希望你也能探索它作为一个独立计算平台所提供的许多功能。\n\n*   Martin\
  \ 的免费 `MinecraftStuff` 模块已更新以简化某些功能，这减少了在冒险 6、冒险 7 和冒险 9 中输入程序所需的打字量，并包含了一个新功能：Minecraft\
  \ 乌龟（Turtle）！这是 Minecraft 内一个完全可的区块，可以在三维空间移动，并让读者能够快速地画出复杂的形状。它与教学大纲高度契合，课程通常使用可编程乌龟来引入编程概念。\n\
  \n## 本书的结构\n\n书的每一章都是一次独立的冒险，在通过编程和测试项目时教你新的技能和概念。本书的组织方式使得每个冒险都是一个独立项目，但你可能会发现按顺序完成它们会更容易，因为我们在整本书中逐渐加深你对编程概念的理解。\n\
  \n在做任何事情之前，先完成冒险 1 是至关重要的。因为这向你展示了如何下载和安装一切，并检查一切是否运行正常。在这个冒险中介绍了一些在其他冒险中需要的基础步骤，但在早期的冒险中会提供提醒。\n\
  \n前三个冒险是为几乎或没有编程知识的初学者编写的，我们在你学习的过程中解释所有的术语和概念。在冒险 2、冒险 3 和冒险 4 中，你涵盖了任何优秀游戏的关键部分。这些包括*感知*Minecraft\
  \ 世界中发生的事情、使用简单的数学进行*计算*，以及让你的程序*行为*不同（例如在聊天中显示消息或自动在世界中创建区块）。你将在整本书中使用这三个概念——*感知、计算*和*行为*来构建更大、更刺激的\
  \ Minecraft 程序！\n\n冒险 5 和冒险 6 通过引入分阶段开发和测试的较大程序，在你在早期冒险中学知识的基础上进行了扩展。冒险 5 探讨了如何从数据文件中引入大量数据，以便使用\
  \ 3D “复制机”保存和复制大型结构。\n\n冒险 6 和冒险 7 引入了免费的 `MinecraftStuff` 模块，它使得使用区块构建线条、圆形和其他\
  \ 2D 形状成为可能，以及一些奇特的 3D 球体和金字塔。这些可以构成难以手工构建的巨大结构的开头。冒险 7 展示了如何为移动物体添加个性，赋予它们自己的智能。通过这些技术，你可以编写一些令你的朋友惊叹的“游戏中的游戏”。\n\
  \n\n\n\n\n冒险 8 介绍了物理计算这一令人振兴奋的话题，如果你想进行这项可选的冒险，你需要购买一个 BBC micro:bit（附录 A 中提供了销售商的链接）。通过将\
  \ BBC micro:bit 连接到你的电脑，你可以使用 micro:bit 上的一系列输入和输出设备来控制并与你的 Minecraft 游戏交互；BBC micro:bit\
  \ 将成为一个用于 Minecraft 的可编程游戏手柄。\n\n冒险 9 利用了之前冒险中所有的编程概念和技能，创建一个终极的大型项目——一个带有评分功能、且包含你必须避开或随身携带移动物体的游戏。在这次冒险中，你还可以选择再次尝试\
  \ BBC micro:bit，允许你通过按下现实世界中的按钮来在游戏中执行操作。\n\n附录 A 提供了系列资源，你可以利用这些资源来扩展和增强你的冒险，学习更多\
  \ Python 编程，并根据你在整本书中学到的知识创建更多更酷的 Minecraft 程序。\n\n附录 B 我们包含了一份贯穿全书编程功能的全面参考指南，还包含了\
  \ Minecraft 特有的编程语句参考，以及一个你可以用来构建的方块类型表格。你会发现，这是一个无价之的参考章节，对你所有的自己的项目和发明都非常有帮助！\n\
  \n术语表为全书中介绍的所有术语和专业词汇提供了方便的快速参考，并且是每个冒险章节中所有定义的集合。\n\n# 伙伴网站\n\n在整书中，你会发现对《Minecraft\
  \ 冒险》伙伴网站的引用，网址为 [[`www.wiley.com/go/adventuresinminecraft2e`](http://www.wiley.com/go/adventuresinminecraft2e)]。在该网上，你可以找到开始\
  \ Minecraft 编程所需的入门工具包，以及我们整理的一系列视频教程，在你遇到困难时提供帮助。你还可以在网上找到一些大型项目的代码文件。\n\n附录 B\
  \ 包含了一份方便的参考。在完成这些 Minecraft 冒险时，请将其放在身边。你也可以在未来开启的任何编程项目中使用它。\n\n# 其他帮助来源\n\n计算机是复杂的设备，操作系统和软件一直在变化。我们尽力保护你和你的冒险免受未来变化的影响，在冒险\
  \ 1 中提供了一个可下载的入门工具包，它应该能提供你大部分所需。然而，如果你遇到问题或需要特定的帮助，这里是一些有用的地方：\n\n*   注册用户 ID 并下载安装\
  \ Minecraft：[`http://minecraft.net`](http://minecraft.net/ )\n*   游玩 Minecraft 游戏：[`http://minecraft.gamepedia.com/Minecraft_Wiki`](http://minecraft.gamepedia.com/Minecraft_Wiki/\
  \ )\n*   树莓派：[`www.raspberrypi.org`](http://www.raspberrypi.org/ )\n*   Microsoft\
  \ Windows：[`http://support.microsoft.com`](http://support.microsoft.com/ )\n*  \
  \ Apple Mac 和 macOS X：[`www.apple.com/support`](http://www.apple.com/support/ )\n\
  *   Python 语言：[`www.python.org`](https://www.python.org/ )\n*   IDLE 编程 IDE：[`https://docs.python.org/3/library/idle.html`](https://docs.python.org/3/library/idle.html/\
  \ )\n*   Minecraft Pi 版：[`http://pi.minecraft.net`](http://pi.minecraft.net/ )\n\
  *   Minecraft 服务器：[`www.spigotmc.org/`](https://www.spigotmc.org/ )\n*   RaspberryJuice\
  \ bukkit 插件：[`http://dev.bukkit.org/bukkit-plugins/raspberryjuice`](http://dev.bukkit.org/bukkit-plugins/raspberryjuice/\
  \ )\n\n# 规范\n\n你会注意到整书中到处都有特殊的框，用来引导和支持你。它们的外观是这样的：\n\n你会在书中发现两组侧边栏。“挑战”（Challenge）侧边栏提供了如果你想进一步推进项目可以接受的额外任务，也许通过做出更改或添加新功能。“深入代码”（Digging\
  \ into the Code）侧边栏会更详细地解释程序中的某些概念或功能，以便你更好地理解 Python 编程语言。这些侧边栏意味着你可以先专注于让程序运行起来，一旦运行成功，再详细详细阅读关于它们是如何运作的以及你可以进一步扩展它们的方法。\n\
  \n当你使用代码遵循我们的步骤或指令时，你应该完全按照我们在指令中描述的方式输入代码。Python 是一种语言，行首的空格数量（缩进）对程序的含义至关重要，因此请格外注意确保在每行的左侧留出足够的空格。我们为代码列表框涂了颜色，以便你更容易看到每行需要多少空格。\n\
  \n```\nprint(\"Welcome to Adventures in Minecraft by Martin O'Hanlon and David\"\
  )\n```\n\n这是一个你可能会使用的代码示例：\n\n```\nprint(\"Welcome to Adventures in Minecraft by\
  \ Martin O'Hanlon and David\")\n```\n\n\n\n\n\nPython 编程语言带有一个名为 `IDLE` 的代码编辑器，你将用它在这些冒险中创建、编辑和运行你编写的程序。\n\
  \n当程序员学习新的编程语言或新的处理问题的方法时，他们总是从编写一个“hello world”程序开始。这是一个非常简单的程序，它会在屏幕上显示“hello\
  \ world”，以确保所有内容都已安装并正常运行。\n\n在第一个冒险中，你将设置你的电脑，以便编写一个程序，在 Minecraft 聊天框中显示“Hello\
  \ Minecraft World”文本（参见图 1-1）。\n\n![image](img/9781119439585-fg0101.png)\n\nFIGURE\
  \ 1-1 Hello Minecraft World\n\n要在本书书中进行 Minecraft 编程，你需要以下三类型的电脑之一：运行 Microsoft\
  \ Windows 的 PC；运行 macOS X 的 Apple Mac；或者运行带有 Pixel 的 Raspbian 的树莓派。你设置电脑的方法取决于你拥有哪种电脑，但一旦设置好，你可以在所有电脑上以完全相同的方式为\
  \ Minecraft 编程。为了方便你设置电脑，你可以从 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)\
  \ 下载一个启动包。这些启动包经过了测试，可以确保书中的所有冒险都能正常运行。\n\n你会发现你的启动包中包含一个 `README` 文件，你应该查看一下它。它描述了该工具包包含的内容以及它是如何创建的；你可以使用这些信息从零开始设置自己的电脑，尽管不建议这样做。遵循本书中的指令将让你从中获得更多收获。\n\
  \n请确保你遵循适用于你类型电脑的说明，无论是“为 Minecraft 编程设置你的树莓派”还是“为 Minecraft 编程设置你的 PC 或 Apple Mac”。\n\
  \n# 设置树莓派以进行 Minecraft 编程\n\n如果你正在使用树莓派，Minecraft 已经安装好了；你只需要下载树莓派启动包即可。完成《Minecraft\
  \ 冒险》（Adventures in Minecraft）所需的所有内容都在名为 `MyAdventures` 的文件夹中。你也将将你的 Minecraft\
  \ 程序保在这个文件夹中。\n\n树莓派的图形用户界面（GUI）被称为 Pixel，贯穿于《Minecraft 冒险》始终。GUI 安装在 Raspbian 上，但取决于你如何设置树莓派，它在启动时可能不会加载\
  \ GUI。相反情况下，你可能会从登录和命令提示符开始。\n\n如果你的树莓派被设置为启动到命令提示符，你需要在命令提示符出现后登录，输入 `startx` 然后按回车来加载\
  \ GUI。\n\n## 下载启动包\n\n一旦你的树莓派启动且 GUI 已启动，你可以按照以下步骤下载树莓派启动包：\n\n1. 打开终端，点击菜单（左上角的树莓派图标） ⇒ 应用程序 ⇒ 终端。\n\
  \n2. 输入以下命令将目录更改到桌面（参见图 1-2）并按回车：\n\n```bash\ncd ~\ncd Desktop\n```\n\n3. 输入以下命令并按回车来下载启动包：\n\
  \n```bash\ngit clone https://github.com/AdventuresInMinecraft/AdventuresInMinecraft-Pi\n\
  ```\n\n![image](img/9781119439585-fg0102.png)\n\nFIGURE 1-2 下载树莓派启动包。\n\n访问 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)，因为未来可能会有更新和可用帮助。\n\
  \n## 在你的树莓派上启动 Minecraft\n\n下载启动包后，你可以运行游戏并尝试一下，然后再开始创建第一个程序。\n\n要启动 Minecraft，请遵循以下步骤：\n\
  \n1. 选择 菜单 ⇒ 游戏 ⇒ Minecraft Pi。\n\n2. 通过选择 开始游戏 ⇒ 新建来开启一个新世界。\n\n3. 好了！现在你可以开始玩\
  \ Minecraft 了。\n\n![image](img/9781119439585-fg0103.png)\n\nFIGURE 1-3 启动 Minecraft\
  \ 并创建一个新世界。\n\n主菜单有两个选项：开始游戏用于构建新的或进入现有的 Minecraft 世界，加入游戏用于加入另一个玩家的世界。（参见图 1-3）。\n\
  \n一旦你的树莓派设置好且运行了 Minecraft，你就可以跳过下一节（除非你想在树莓派之外也为 PC 或 Mac 上设置 Minecraft），并直接跳到此冒险后面的“创建程序”章节。\n\
  \n# 设置你的 PC 或 Apple Mac 以进行 Minecraft 编程\n\n无论你使用的是 Windows PC 还是 Mac，你都需要确保 Minecraft\
  \ 已安装并在你的电脑上正常运行。如果你没有 Minecraft 副本和用于游玩的用户 ID，请访问 [`www.minecraft.net`](http://www.minecraft.net/)购买游戏。如果你在安装、运行或玩\
  \ Minecraft 时遇到任何问题，可以寻求帮助；只需访问 [`https://help.mojang.com`](https://help.mojang.com/)。\n\
  \n要在 PC 和 Apple Mac 上为完整版 Minecraft 编程，你需要使用 Minecraft 服务器和 RaspberryJuice 插件，该插件包含在稍后部分下载的启动包中。\n\
  \n你需要下载 Python 编程语言并将其安装在电脑上。在整个《Minecraft 冒险》中，你使用的是 Python 3。《Minecraft 冒险》中的程序均经过测试，可以在\
  \ Python 3.6 上运行。建议这样做。\n\n设置你的 PC 或 Apple Mac 以创建第一个程序需要三个步骤：\n\n1. 下载并解压 PC 或\
  \ Mac 启动包，其中包含一个预配置了 RaspberryJuice 插件的 Minecraft 服务器和一个名为 `MyAdventures` 的文件夹（你将程序保存）。\n\
  \n2. 下载并安装 Python 编程语言。\n\n3. 配置 Minecraft 并将其连接到服务器。\n\n## 在 Windows PC 上安装启动包和\
  \ Python\n\n如果你正在使用 Windows PC，设置电脑的后续部分涉及两个步骤：\n\n1. 下载 Windows 启动包并将其解压到桌面\n\n\
  2. 下载并在 Windows PC 上安装 Python 编程语言\n\n 下载并解压启动包\n\n按照以下步骤下载 Windows 启动包并将内容复制到桌面。将它们放在桌面方便你需要时随时找到：\n\
  \n1. 打开你 PC 的浏览器（如 Internet Explorer 或 Chrome），访问 [`adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)\
  \ 并下载适用于 Windows 的启动包。\n\n2. 当启动包压缩文件下载完成后，打开它。你可以通过选择打开文件或打开下载文件夹并双击 `AIMStarterKit.zip`\
  \ 文件来实现。\n\n3. 压缩包仅包含一个文件夹，名为 `AdventuresInMinecraft-PC`。通过点击文件夹、按住鼠标按钮并将其拖到桌面来拷贝该文件夹（参见图\
  \ 1-4）。\n\n![image](img/9781119439585-fg0104.png)\n\nFIGURE 1-4 将 `AdventuresInMinecraft-PC`\
  \ 文件夹拷贝到桌面，以便你随时能找到它。\n\n 下载并安装 Python\n\n由于你将使用 Python 进行编码，你必须按照以下步骤安装 Python\
  \ 编程语言和 `IDLE` 代码编辑器：\n\n\n\n\n\n1. 打开电脑 上的网络浏览器（例如 Internet Explorer 或 Chrome）。访问\
  \ [`www.python.org/downloads/release/python-361/`](https://www.python.org/downloads/release/python-361/)\
  \ 下载并安装 Python 3.6.1。\n\n2. 向下滚动页面，并在文件列表中点击“Windows x86 Executable Installer”链接以下载\
  \ Python 安装程序。\n\n3. 当 `python-3.6.1.exe` 文件下载完成后，通过点击“打开 ⇒ 运行”菜单选项或打开下载文件夹并双击该文件来运行它。\n\
  \n4. 你可能会弹出一个安全警告框（询问“你是否要运行此文件？”）。点击“运行”（Run）。\n\n5. 点击“立即安装”（Install Now）开始安装。\n\
  \n6. 用户账户控制可能会请求许可运行设置程序。如果是，请点击“是”（Yes）。\n\n7. 等待设置程序完成安装并点击“关闭”（Close）。\n\n# 在你的\
  \ Apple Mac 上安装启动器包和 Python\n\n如果你正在使用 Apple Mac，设置电脑的接下来的部分涉及两个步骤：\n\n1. 下载 Apple\
  \ Mac 的启动器包并将其解压到桌面。\n\n2. 下载 Python 编程语言并将其安装在你的 Apple Mac 上。\n\n## 下载并解压启动器包\n\
  \n按照以下步骤下载 Apple Mac 启动器包并将内容复制到桌面（将它们放在桌面可以方便你以后需要时随时找到它们）：\n\n1. 打开 Apple Mac\
  \ 上的网络浏览器（例如 Safari、Chrome），访问 [`https://adventuresinminecraft.github.io`](https://adventuresinminecraft.github.io/)\
  \ 并下载适用于 Apple Mac 的启动器包。\n\n2. 当启动器包压缩文件下载完成后，进入你的下载文件夹。\n\n3. 压缩包仅包含一个名为 `AdventuresInMinecraft-Mac`\
  \ 的文件夹。通过点击文件夹、按住鼠标按钮并将文件夹拖到桌面将该文件夹复制到桌面（参见图 1-5）。\n\n![image](img/9781119439585-fg0105.png)\n\
  \n图 1-5 将 `AdventuresInMinecraft-Mac` 文件夹复制到 Mac 桌面。\n\n## 下载并安装 Python\n\n由于你将使用\
  \ Python 进行编码，你需要按照以下步骤安装 Python 编程语言和代码编辑器 IDLE：\n\n1. 打开 Apple Mac 上的网络浏览器。访问\
  \ [`www.python.org/downloads/release/python-361/`](https://www.python.org/downloads/release/python-361/)\
  \ 下载并安装 Python 3.6.1。\n\n2. 向下滚动页面，并在文件列表中点击“macOS X 64-bit/32-bit Installer”链接以下载\
  \ Python 安装程序。\n\n3. 当 `python-3.6.1-macosx10.6.pkg` 下载完成后，点击它或在 Finder 中打开下载文件夹并双击它来打开文件。\n\
  \n4. “介绍”（Introduction）屏幕显示有关 Python 安装程序的信息。点击“继续”（Continue）。\n\n5. “自述”（Read Me）屏幕显示关于\
  \ Python 的重要信息。点击“继续”（Continue）。\n\n6. “许可协议”（License）屏幕显示软件许可协议。点击“继续”（Continue）然后点击“同意”（Agree）。\n\
  \n7. “安装类型”（Installation Type）屏幕显示将使用多少磁盘空间；点击“安装”（Install）。如果你愿意，还有机会更改安装位置。\n\n\
  8. 输入你的 Apple 密码并点击“安装软件”（Install Software）；安装将开始并向你显示进度。等待 Python 完成安装。\n\n9. 当安装程序显示安装成功时，点击“关闭”（Close）。\n\
  \n# 在你的 Windows PC 或 Apple Mac 上启动 Minecraft\n\n你现在已经在 Windows PC 或 Apple Mac 上安装了所有需要的软件。但你还还没有完全准备好；首先，你需要按照以下步骤启动服务器并将\
  \ Minecraft 连接到服务器：\n\n1. 双击打开放置在桌面上的 `AdventuresInMinecraft` 文件夹。\n\n2. 双击运行 `StartServer`\
  \ 程序。服务器命令窗口将打开。\n\n3. 按任意键启动 Minecraft 服务器。当服务器加载时，你会在屏幕上看到消息，不断向你更新服务器的进度。\n\n\
  4. 当服务器加载完成后，你会看到一条“完成”（Done）消息（参见图 1-6）。\n\n![image](img/9781119439585-fg0106.png)\n\
  \n图 1-6 Minecraft 服务器命令窗口在服务器加载完毕并准备就绪后显示“Done”。\n\n启动器包使用的 Minecraft 版本是 1.12。这意味着你需要在\
  \ Minecraft 启动器中创建一个配置（profile）来运行 1.12 版本的游戏。使用该版本的游戏，而不是最新版本。\n\n（注：输入文本在末尾似乎有一些损坏/乱码的句子。我已经根据提供的指令清理了核心逻辑。）\n\
  \n\n\n\n\n*   在树莓派上：在目录下拉列表中选择 `/home/pi`，在文件夹浏览器中双击 `Desktop`、`AdventuresInMinecraft-Pi`\
  \ 和 `MyAdventures`。\n*   在 PC 上：点击左侧导航格上的 `Desktop`，在文件夹资源管理器中双击 `AdventuresInMinecraft-PC`\
  \ 和 `MyAdventures`。\n*   在 Mac 上：打开文件夹浏览器（使用保存按钮旁边的向下箭头），选择 `Desktop`、`AdventuresInMinecraft-Mac`，然后选择\
  \ `MyAdventures`。\n\n4. 给你的新文件命名。输入文件名 `HelloMinecraftWorld.py` 并点击保存。文件末尾添加的 `.py`\
