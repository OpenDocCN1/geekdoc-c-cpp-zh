  \ +\" z=\"+str(pos.z))\n    ```\n2.  通过 Editor 菜单选择`File ⇒ Save` 再次保存程序，然后点击`Run ⇒ Run\
  \ Module` 运行。\n\n## 使用聊天功能更改你的位置显示\n\n在继续操作并进行更多 Minecraft 程序开发之前，你可以改进玩家位置的输出，使其更易理解。每次显示位置时都有三行独立的输出会占用大量空间；如果玩家位置的三个部分都在同一行就很好，例如这样：\n\
  \n`x=10 y=2 z=20`\n\n要做到这一点，请遵循以下步骤：\n\n1.  修改你的 `whereAmI.py` 程序，删除三个 `print()`\
  \ 语句并将其替换为这一单行：\n\n    ```python\n    print(\"x=\"+str(pos.x) +\" y=\"+str(pos.y)\
  \ +\" z=\"+str(pos.z))\n    ```\n2.  通过 Editor 菜单选择`File ⇒ Save` 再次保存程序，然后点击`Run ⇒ Run\
  \ Module` 运行。\n\n## 引入游戏循环\n\n每次想知道玩家位置时都要运行 `whereAmI.py` 程序是非常不方便的。幸运的是，你可以通过修改程序添加一个游戏循环来解决这个问题。你玩的大多数游戏都会一直运行直到你关闭它们，这是一项实用的技术。在计算中，这被称为**无限循环**，因为它会永远循环。\n\
  \n\n\n\n是你时候将你的游戏循环投入实践并开发一个简单的应用程序了。“欢迎回家”（Welcome Home）游戏使用感知（追踪玩家的位置）来跟随你的玩家在\
  \ Minecraft 世界中移动。你还学习了如何使用 Python 中的 `if` 语句进行更复杂的感知。你将制作一个**魔法门垫**，当你站在门垫上时，Minecraft\
  \ 聊天窗口中会弹出“欢迎回家”的消息。\n\n## 使用 if 语句制作魔法门垫\n\n为了判断你的玩家是否站在门垫上，你使用一个 `if` 语句将玩家的位置与门垫的位置进行比较。当两者匹配时，就说明你的玩家已经回到家了。\n\
  \n首先，看看 `if` 语句是如何工作的；在 Python Shell 中亲自尝试一下将帮助你理解它：\n\n1. 点击 Python Shell。确保你仅点击\
  \ `>>>` 提示符的右侧，以确保你输入的内容进入正确的位置。\n\n2. 在 Python Shell 中输入以下行。当你一按下回车键时，Python 就会运行它。它还不会显示任何内容，因为这些操作只是将数字\
  \ 20 存储在名为 `a` 的变量中：\n\n```\na = 20\n```\n\n3. 在 Python Shell 中输入以下内容，检查变量 `a` 是否包含正确的值：\n\
  ```\nprint(a)\n```\n屏幕上应该显示数字 20。\n\n4. 尝试使用 `if` 语句来查看存储在变量 `a` 中的值是否大于 10。注意，你必须在\
  \ `if` 语句的末加上冒号。当你在第一行结束按回车时，Python 会自动为你下一行进行缩进：\n```\nif a>10:\n    print(\"big\"\
  )\n```\n\n5. 现在再次按回车，告诉 Python Shell 你已经输完了 `if` 语句。你应该能看到 Python Shell 上出现“big”这个词。要查看它的样子，请参见图\
  \ 2-3。\n\n![image](img/9781119439585-fg0203.png)\n\nFIGURE 2-3 在 Python Shell 中交互式地使用\
  \ `if` 语句\n\n## 检查玩家是否在特定位置\n\n为了让程序能够判断玩家是否站在魔法门垫上，它必须检查坐标的至少两个部分。如果你检查门垫的 x 和\
  \ z 坐标与玩家的位置相同，这是一种检测玩家站在门垫上的合理方法。你可以通过在 `if` 语句内部使用关键字 `and` 来检查一个条件和另一个条件。y 坐标在这里不那么重要，因为你在程序中没有检查\
  \ y 坐标，所以当玩家悬浮在门垫上方时，你仍然可以看到欢迎回家的消息。\n\n先在 Python Shell 中交互式地尝试一下，以确保它有效：\n\n1.\
  \ 在 Python Shell `>>>` 提示符处，输入以下内容设置变量：\n```\na = 8\n```\n\n2. 输入一个同样使用 `and` 的\
  \ `if` 语句。该语句检查变量 `a` 是否在两个数字之间。当你第一次输入这个内容时，你会看到 Python Shell 上出现“between”，因为 8\
  \ 大于 5 且小于 10。记住再次按回车以完成 `if` 的缩进区域：\n```\nif a>5 and a<10:\n    print(\"between\"\
  )\n```\n\n3. 现在将 `a` 改为小于 5，看看会发生什么（参见图 2-4）：\n```\na = 3\nif a>5 and a<10:\n  \
  \  print(\"between\")\n```\n\n![image](img/9781119439585-fg0204.png)\n\nFIGURE 2-4\
  \ 你使用带有 `and` 的 `if` 语句检查两个或多个条件。\n\n## 制作魔法门垫\n\n在编写游戏之前，你首先需要在 Minecraft 世界中建造一些东西，以便你的程序有东西可以交互。你真正只需要一个门垫。但首先，打开\
  \ Minecraft 并加载你已经在使用的世界。\n\n1. 要要在地板上放置门垫，从物品栏中选择一个物品并右键将其放置在你面前的地板上。羊毛可能是门垫的良好选择。\n\
  \n2. 要找到门垫在 Minecraft 世界中的坐标，再次运行你的 `whereAmI.py` 程序，然后站在门垫上。在某处记录下 x、y 和 z 坐标，因为你在编写新程序时需要它们，以便在\
  \ Minecraft 世界中定位门垫。\n\n## 编写欢迎回家游戏\n\n现在你已经理解了 `if` 语句，可以按照这些步骤编写“欢迎回家”游戏：\n\n\
  1. 从编辑器中选择文件（File）⇒ 新文件（New File）创建一个新程序。\n\n2. 从菜单选择文件（File）⇒ 另存为（Save As）保存你的程序，并将其命名为\
  \ `welcomeHome.py`。\n\n3. 导入所需的模块：\n```\nimport mcpi.minecraft as mc\nimport time\n\
  ```\n\n4. 连接到 Minecraft：\n```python\nmc = mc.create()\n```\n\n5. 放入感知玩家的主循环：\n```python\n\
  while True:\n    pos = mc.player.getPos()\n```\n\n6. 添加 `if` 语句检查玩家是否站在垫子上。为了让其生效，你之前记录的\
  \ x 和 z 坐标必须匹配门垫：\n```python\nif pos.x == 10 and pos.z == 12:\n    mc.postToChat(\"\
  welcome home\")\ntime.sleep(1)\n```\n\n7. 从菜单选择运行（Run），查看程序是否运行！当你站在门垫上时，程序应该显示“welcome\
  \ home”。\n\n![image](img/9781119439585-fg0205.png)\n\nFIGURE 2-5 站在门垫上显示“欢迎回家”消息\n\
  \n## 使用地理围栏收取租金\n\n现在你要编写一个名为 `rent.py` 的新游戏。这个游戏由一个带有围栏的区域组成。你的程序检测玩家何时进入该区域，并在玩家处于区域内一直收取租金。玩家的挑战是以尽可能快的时间移除该区域内的任何物体。\n\
  \n你的 `welcomeHome.py` 程序使用了 `if` 语句来检查玩家坐标是否与门垫相同。为了让其生效，玩家必须站在门垫上。你可以通过一种名为**地理围栏**（geo-fencing）的技术来改进这一点，你在新游戏中就使用了它。对玩家位置的检测得到了改进，因为它检查玩家是否位于世界的某个区域内，而不仅仅是特定的坐标。这允许你检测玩家是否位于世界中较大的范围内。\n\
  \n要让地理围栏生效，你需要两点：一个要追踪的对象或区域，以及该对象“围栏”的允许坐标。你现在将通过建立一个带有真实 Minecraft 围栏的区域并记录其角坐标来学习这样做。\n\
  \n当你建好区域和围栏后，它看起来应该像图 2-8。\n\n![image](img/9781119439585-fg0208.png)\n\nFIGURE 2-8\
  \ 一个带有围栏的区域。区域大小为 10 格子乘 10 格子。\n\n计算区域的角坐标\n\n\n\n为了用你的程序对场地进行地理围栏（geo-fence），你需要对场地角落的坐标有准确的记录，以便将这些数字输入到你的\
  \ Python 程序中。\n\n实现此最简单的方法是运行之前的 `whereAmI.py` 程序，然后让玩家运行到场地的每个角落，获取每个角的 `x`、`y`\
  \ 和 `z` 坐标。在纸上画出你正在构建内容的草图，并将坐标写在草图上。编写程序时你需要这些坐标。请记住，当玩家向南移动时 `z` 坐标会变大，向北移动时会变小，正如你在图\
  \ 2-1 中所示。\n\n在图 2-9 中，你可以看到我在写这本书时构建的场地坐标。我写下了四个角落的坐标，因为我需要它们来计算 `x` 和 `z` 方向上的最小值和最大值。注意最小坐标位于我场地的左上角，但如果你构建场地时玩家朝向相反，那么你的场地情况可能有所不同。\n\
  \n![image](img/9781119439585-fg0209.png)\n\nFIGURE 2-9 现在你已经有了场地角落的坐标，就可以准备地理围栏了。\n\
  \n你的地理围栏程序需要四个数字。首先，你需要知道最小和最大的 `x` 坐标，因此根据你的图算出它们。在上例中，最小的 `x` 是 10，最大的 `x` 是 20。我将最小的\
  \ `x` 坐标命名为 `X1`，最大的 `x` 坐标命名为 `X2`。\n\n你需要算出最小和最大的 `z` 坐标。在示例中，最小的 `z` 是 10，最大的\
  \ `z` 是 20。我将最小的 `z` 坐标命名为 `Z1`，最大的 `z` 坐标命名为 `Z2`：\n\n```\nX1 = 10\nZ1 = 10\nX2\
  \ = 20\nZ2 = 20\n```\n\n以相同的方式为你的最大和最小坐标编号，因为在下一步——编写程序时会用到它们。\n\n## 编写地理围栏程序\n\n\
  最后一步是编写程序，使地理围栏生效，并在玩家站在场地内时收取租金。这个程序的结构与 `whereAmI.py` 程序相似。\n\n你将在这个新游戏中使用**常量**，以便以后更容易移动你的场地。这样，当你移动场地时，就不需要翻遍整个程序去寻找需要修改的坐标值了。\n\
  \n要编写程序，请遵循以下步骤：\n\n1. 首先通过菜单选择 File ⇒ New File 在 IDLE 中打开一个新窗口。\n2. 从菜单选择 File\
  \ ⇒ Save As，并将文件命名为 `rent.py`。\n3. 导入此程序所需的模块：\n   ```\n   import mcpi.minecraft\
  \ as minecraft\n   import time\n   ```\n4. 连接到 Minecraft 游戏：\n   ```\n   mc = minecraft.Minecraft.create()\n\
  \   ```\n5. 为地理围栏的四个坐标定义一些常量。确保你使用的是之前算出的坐标。我使用了我在程序中的坐标，但你的可能不同：\n   ```\n   X1\
  \ = 10\n   Z1 = 10\n   X2 = 20\n   Z2 = 20\n   ```\n6. 创建一个变量来记录玩家被收取的租金总额。游戏开始时你还没有收取任何租金，因此创建一个名为\
  \ `rent` 的新变量并设置为零：\n   ```\n   rent = 0\n   ```\n7. 使用 `while` 语句创建主游戏循环。你的程序每秒循环一次，所以使用\
  \ `sleep` 语句让它每次循环延迟 1 秒。每次循环延迟短时间会稍微减慢程序运行速度，同时也为你提供了一个方便的方法来计时玩家在场地内的时间。稍后，你将在每次游戏循环时给\
  \ `rent` 变量加 1，由于你在此循环顶部添加了一秒延迟，这意味着租金每秒将增加 1。确保此处的缩进正确：\n   ```\n   while True:\n\
  \       time.sleep(1)\n   ```\n8. 要检查玩家是否在地理围栏区域，你需要知道他们的位置。就像在你之前的程序中一样，使用 `player.getTilePos()`：\n\
  \   ```\n   pos = mc.player.getTilePos()\n   ```\n9. 你现在到了程序最重要的部分。在这里，你引导程序使用之前算出的四个坐标，来判断玩家是否站在场地内；如果是，则向他收取租金并通过发布消息告知他。为此，请输入：\n\
  \   ```\n   if pos.x>X1 and pos.x<X2 and pos.z>Z1 and pos.z<Z2:\n       rent = rent+1\n\
  \       mc.postChat(\"You owe rent:\"+str(rent))\n   ```\n\n保存程序，并选择 Run 运行它。尝试让玩家进出场地。当他在场地内时，聊天框每秒都会出现一条消息，显示他欠多少租金。当他离开场地时，就不会被收取租金。你的程序还会记住收了多少租金，当你再次进入场地时，它不会忘记你欠了多少。\n\
  \n# 移动你的玩家\n\n有一种方法可以让你的游戏更有挑战性且更有趣，涉及到一个你在创作中非常有用的 Minecraft API 功能——将玩家移动到 Minecraft\
