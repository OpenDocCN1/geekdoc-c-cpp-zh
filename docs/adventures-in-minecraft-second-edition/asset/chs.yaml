  \n## 拆除复制房间\n\n当你运行多次复制程序时，可能会在世界到处建造很多旧的复制房间。只有你创建的最后一个才是有效的房间，随着时间的推移，你的世界会被填满直到你不知道哪一个才是正确的！为了解决这个问题，你正在程序中添加一个拆除复制房间的功能，这样你的\
