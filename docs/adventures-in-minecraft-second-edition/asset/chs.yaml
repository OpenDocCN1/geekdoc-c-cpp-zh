  \n## 为掉进洞添加时间惩罚\n\n掉进洞有一个微小的时间惩罚，但它只是很小。给游戏增加有趣惩罚的好方法是让用户做一些事情。在 `check_below()`\
  \ 函数中添加**加粗**的行，这样当球掉进洞时，用户必须再次让球跳出洞外。\n\n```python\nelif block_below == block.AIR.id:\n\
