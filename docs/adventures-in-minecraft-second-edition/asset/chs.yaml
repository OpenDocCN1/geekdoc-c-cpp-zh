  \n# 第三部分：游戏玩法\n\n你这场大冒险的下一部分是为你的程序添加游戏玩法。你的目标是将场场从一个障碍赛变成一个让玩家想要反复玩并进入下一关的游戏。\n\n\
  为了实现这一点，游戏需要是有趣且具有挑战性的，并且应该包含风险、奖励和目标。\n\n挑战是让玩家在规定的时间限制内收集随机分布在场场周围的所有钻石，同时尝试穿过障碍。玩家因收集钻石和到达关卡结束而获得积分。玩家完成关卡越快，获得的分就越多。目标是完成所有关卡并获得尽可能的分。\n\
  \n你的游戏将有三个关卡，你将通过增加钻石和缩短时间限制，让每一关都比上一关更难。\n\n## 开始游戏\n\n在这一节中，你设置游戏并创建常量，确定每个关卡中钻石的数量和可用时间。\n\
  \n程序有两个主循环：\n\n*   `game` 循环：该循环一直持续到游戏结束（`while not gameOver`）。这是设置和启动每一关的地方。在每个关卡的结束时计算积分。\n\
  *   `level` 循环：该循环持续到关卡结束——即关卡完成或游戏结束（`while not gameOver and not levelComplete`）。该循环还会在玩家掉入河流或空洞时将其返回起点，在玩家撞击钻石时清除钻石，并检查时间是否耗尽。\n\
  \n首先，按照以下步骤在程序末尾添加必要的代码，以构建游戏的结构并创建两个主循环：\n\n1. 创建三个常量，分别代表游戏中的关卡数、将创建的钻石数量以及玩家完成每个关卡被给予的时间（秒）：\n\
  \n```python\nLEVELS = 3\nDIAMONDS = [3,5,9]\nTIMEOUTS = [30,25,20]\n```\n\n`DIAMONDS`\
  \ 和 `TIMEOUTS` 常量是 Python 列表。它们都有三个项目，对应每个关卡的值；例如，在第一关中，玩家必须收集三颗钻石，并在 30 秒内完成任务并到达另一侧。\n\
  \n2. 创建两个变量来存储玩家得分和他们当前所在的关卡：\n\n```python\nlevel = 0\npoints = 0\n```\n\n3. 创建\
  \ `game` 循环。在它上方放置一个注释来提醒你它所在的位置，因为此冒险中的后续指令会提到在 `game` 循环下缩进代码：\n\n```python\n\
  #game loop\nwhile not gameOver:\n```\n\n变量 `gameOver` 在程序开始时被设置为 `False`；当玩家时间耗尽或完成游戏时，它将被设置为\
  \ `True`。该变量也用于障碍物函数，当它被设置为 `True` 时，所有障碍物都会停止。\n\n4. 在 `game` 循环下缩进，更改玩家的位置，使其处于场场的起点并准备好开始：\n\
  \n```python\nmc.player.setPos(arenaPos.x + 1,\narenaPos.y + 1,\narenaPos.z + 1)\n\
  ```\n\n5. 获取当前时间并将其放入变量中以启动关卡计时：\n\n```python\nstart = time.time()\n```\n\n6. 将关卡完成标记设置为\
  \ `False` 并创建关卡循环。像你处理 `game` 循环时做的那样，在这里创建一个注释来提醒你 `level` 循环所在的位置，因为后续指令会提到 `level`\
  \ 循环：\n\n```python\nlevelComplete = False\n#level loop\nwhile not gameOver and not\
  \ levelComplete:\n```\n\n7. 在 `level` 循环下缩进，放入一个小的延迟。正如你处理 `game` 循环时做的那样，你需要这样做是因为程序会在游戏运行时：\n\
  \n```python\ntime.sleep(0.1)\n```\n\n8. 运行程序。像之前一样，你应该看到玩家在场场的起点，你看到的唯一变化说明一切运行正常。\n\
  \n## 收集钻石\n\n游戏的主要目标是收集钻石。钻石出现在随机位置。\n\n![image](img/9781119439585-fg0910.png)\n\
  \n图 9-10 创建空洞的位置和宽度。\n\n在创建钻石后，你可以使用 `pollBlockHits` 函数（你在冒险 4 中学习过的）来监控撞击事件，当玩家撞击钻石时，将其变为\
  \ `AIR`。\n\n按照以下步骤更新 `createDiamonds()` 函数并在 `game` 循环中调用它：\n\n1. 你写的 `createDiamonds()`\
  \ 函数：\n\n```python\ndef createDiamonds(arenaPos, number):\n    pass\n```\n\n   \
  \ 删除函数下的 `pass` 语句。\n\n2. 在 `def createDiamonds(arenaPos, number):` 行下缩进创建与 Minecraft\
  \ 的连接：\n\n```python\nmc = minecraft.create()\n```\n\n3. 通过在场场寻找随机 x 和 z 位置创建所需的钻石：\n\
  \n```python\nfor diamond in range(0, number):\n    x = random.randint(arenaPos.x,\
  \ arenaPos.x + ARENAX)\n    z = random.randint(arenaPos.z, arenaPos.z + ARENAZ)\n\
  \    mc.setBlock(x, arenaPos.y + 1, z,\n    block.DIAMOND_BLOCK.id)\n```\n\n4. `createDiamonds()`\
  \ 函数现在需要在 `game` 循环开始时调用；每当新关卡开始时，都会创建一组钻石。在 `game` 循环下缩进，紧接 `while` 循环，添加以下代码：\n\
  \n```python\ncreateDiamonds(arenaPos, DIAMONDS[level])\ndiamondsLeft = DIAMONDS[level]\n\
  ```\n\n变量 `diamondsLeft` 也被创建了；它存储了玩家剩余钻石的数量。\n\n5. 运行程序。由于你处于第一关，你应该看到随机位置创建了三颗钻石。钻石一旦被击就会消失。\n\
  \n在 `level` 循环下添加以下代码，当玩家撞击时将 `DIAMOND_BLOCK` 变为 `AIR`：\n\n1.  在 `level` 循环下缩进，调用\
  \ `pollBlockHits` 函数获取任何方块撞击事件：\n```\n\n\n\n\n# 等级循环\n\n```python\nwhile not gameOver\
  \ and not levelComplete:\n    hits = mc.events.pollBlockHits()\n```\n\n2. 遍历区块击事件并获取被击中区块的类型：\n\
  \n```python\nfor hit in hits:\n    blockHitType = mc.getBlock(hit.pos.x, hit.pos.y,\
  \ hit.pos.z)\n```\n\n3. 检查击中的区块类型是否为 `DIAMOND_BLOCK`。如果是，将其变为 `AIR` 并将 `diamondsLeft`\
  \ 变量减 1：\n\n```python\nif blockHitType == block.DIAMOND_BLOCK.id:\n    mc.setBlock(hit.pos.x,\
  \ hit.pos.y, hit.pos.z, block.AIR.id)\n    diamondsLeft = diamondsLeft - 1\n```\n\
  \n`diamondsLeft` 变量用于在玩家到达竞技场尽头时检查钻石是否已收集。\n\n4. 运行程序；当你击中 `DIAMOND` 块时，它们应该变为 `AIR`\
  \ 并消失。\n\n## 时间到了\n\n如果给玩家无限的时间，游戏将变得非常简单（且无聊）。通过引入时间限制，你让游戏具有挑战性；通过让玩家在时间耗尽前收集所有钻石并到达对面，你给了他们一个目标。\n\
  \n如果时间耗尽，游戏结束。你的下一个任务是在等级循环中添加代码，检查时间是否已耗尽，如果是，则将 `gameOver` 标记设置为 `True`：\n\n1.\
  \ 在 `level` 循环下缩进，告诉程序计算此等级剩余的秒数：\n\n```python\n# level loop\nwhile not gameOver\
  \ and not levelComplete:\n    secondsLeft = TIMEOUTS[level] - (time.time() - start)\n\
  ```\n\n2. 如果剩余秒数小于零，将 `gameOver` 标记设置为 `True` 并向聊天框发送消息：\n\n```python\nif secondsLeft\
  \ < 0:\n    gameOver = True\n    mc.postToChat(\"Out of time…\")\n```\n\n3. 运行程序。30\
  \ 秒后（因为这是第 1 级），程序应该结束并出现“Out of time…”的消息（参见图 9-12).\n\n![image](img/9781119439585-fg0912.png)\n\
  \n图 9-12 在玩家时间不足时告知他们。\n\n## 跟踪玩家\n\n当玩家收集所有钻石并到达竞技场尽头时，他就完成了该等级。如果他掉进河或洞中，他将返回竞技场起点。为了实现这些点，你的程序需要知道玩家在哪里。\n\
  \n在检查玩家位置后，如果他收集了所有钻石，程序可以将 `levelComplete` 标记设置为 `True` 或者将其位置置回竞技场起点。\n\n你的下一个任务是在\
  \ `level` 循环中添加代码来跟踪玩家，将其送回起点或完成等级：\n\n1. 在 `level` 循环下缩进，获取玩家位置：\n\n```python\n\
  # level loop\nwhile not gameOver and not levelComplete:\n    pos = mc.player.getTilePos()\n\
  ```\n\n2. 检查玩家的高度 `y` 是否低于竞技场的高度。如果是，他一定掉进了河里或洞里，因此将他送回起点：\n\n```python\nif pos.y\
  \ < arenaPos.y:\n    mc.player.setPos(arenaPos.x + 1, arenaPos.y + 1, arenaPos.z\
  \ + 1)\n```\n\n3. 检查玩家是否已到达竞技场尽头并收集了所有钻石。你通过检查玩家的 z 轴位置是否与竞技场结束来实现这一点，如果是，将 `levelComplete`\
  \ 标记设置为 `True`：\n\n```python\nif pos.z == arenaPos.z + ARENAZ and diamondsLeft ==\
  \ 0:\n    levelComplete = True\n```\n\n当 `levelComplete` 标记设置为 `True` 时，`level`\
  \ 循环结束，钻石重新生成，游戏重新开始。\n\n4. 运行程序。当收集所有钻石且玩家到达竞技场尽头时，游戏应该重置；如果玩家掉进河里或洞里，他应该被返回竞技场起点。\n\
  \n## 设置等级完成并计算积分\n\n当玩家完成一个等级时，程序需要计算他得了多少分并将游戏进入下一个等级。如果玩家完成了等级，他就能得分。他每收集一颗钻石获得\
  \ 1 分，并乘以时钟上剩余的秒数。\n\n要做到这一点，你需要包含以下代码。新代码需要缩进在 `game` 循环下，但它必须位于：\n\n1. 在 `game`\
  \ 循环下缩进，但在 `level` 循环之后：\n\n```python\n# game loop\nwhile:\n    # level loop\n \
  \   while not gameOver and not levelComplete:\n        # ...\n```\n\n（注：由于原文包含大量重复和混乱的描述，已根据核心逻辑进行了整理翻译）\n\
  \n\n\n\n\n`microbit.display.scroll(\"A to start\")`\n\n`while not microbit.button_a.was_pressed():`\n\
  \n`time.sleep(0.1)`\n\n`#game loop`\n\n```python\nwhile not gameOver:\n```\n\n你还让\
  \ micro:bit 上显示了一条滚动的消息，告诉玩家按下“A 键开始”。\n\n3. 运行程序并测试新的开始按钮。\n\n## 倒计时时\n\n当时间用尽时，显示器将显示一个简单的时钟，从\
  \ 5 倒到 0，随后游戏结束，为玩家提供一个需要加速的视觉指示。\n\n要实现这一点，你需要修改 Crafty Crossing 程序，当游戏剩余秒数小于 6\
  \ 秒时，使用 `microbit.display.show` 函数更新显示器：\n\n1. 在游戏循环中计算完 `secondsLeft` 变量后，添加一个\
  \ `if` 语句来检查 `secondsLeft` 是否小于 6：\n\n`secondsLeft = TIMEOUTS[level] - (time.time()\
  \ - start)`\n\n```python\nif int(secondsLeft) < 6:\n```\n\n2. 在 `if` 语句缩进下方，添加代码在\
  \ BBC micro:bit 的显示器上显示时钟图像：\n\n```python\nmicrobit.display.show(\nmicrobit.Image.ALL_CLOCKS[int(secondsLeft)])\n\
  ```\n\n`ALL_CLOCKS` 图像与 [Adventure 8] 中使用的不同，因为它是一个 12 张图像的列表，每张图像对应表面上的一个小时位置。\n\
  \n3. 运行程序。当时间用尽时，你会看到 BBC micro:bit 上有一个倒计数的时钟。\n\n## 收集钻石\n\n你在这次冒险中的最后一个任务是更新显示器以显示剩余收集钻石的数量。\n\
  \n要实现这一点，你需要修改 Crafty Crossing 程序，当剩余运行时间大于 5 秒时更新显示器：\n\n1. 在显示倒计时时钟的 `if` 语句中添加一个\
  \ `else`。同时添加在显示器上显示 `diamondsLeft` 的代码：\n\n```python\nif int(secondsLeft) < 6:\n\
  \    microbit.display.show(\n    microbit.Image.ALL_CLOCKS[int(secondsLeft)])\n\
  else:\n    microbit.display.show(diamondsLeft)\n```\n\n2. 运行程序。钻石的数量应该显示出来，并且每当玩家击中一个时，数量就会减少，直到变为\
  \ 0，或者时间开始耗尽出现倒计时时钟。\n\n| 快速参考表 |\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `import threading`\
  \ | 导入 Python 线程模块 |\n| `t = threading.Thread(target = function,args = (variable1,\
  \ variable2))` | 在自己的线程中调用函数 |\n| `t.start()` | 启动线程并调用函数。 |\n| `t.join()` | 等待线程完成。\
  \ |\n| `import time` | 导入 Python 时间模块 |\n| `timeNow = time.time()` | 获取当前时间 |\n\n\
  # 在 Minecraft 持续之旅中的进一步冒险\n\nMinecraft 为你的创意和冒险提供了一个极佳的画布。此外，你还可以通过代码控制游戏，唯一的限制就是你的想象力。你接下来打算做什么？\n\
  \n这里是一些想法和资源，希望它们能带来灵感：\n\n* 创建游戏是扩展编程技能的绝佳方法。查看 [`www.classicgamesarcade.com`](http://www.classicgamesarcade.com/)\
  \ 获取一些灵感。\n\n* Minecraft 是一款多人游戏。为什么不利用这一点，创建许多人都可以可以使用并享受的程序呢？\n\n* 与电子设备交互将 Minecraft\
  \ 引入了现实世界。通过《Arduino 险之旅 Azureu.wiley.com/WileyCDA/WileyTitle/productCd-1118948475.html`](http://eu.wiley.com/WileyCDA/WileyTitle/productCd-1118948475.html)\
  \ 进一步提升你的技能。\n\n* 互联网上有许多开放数据源。将 Minecraft 与 Twitter ([[dev.twitter.com`](http://dev.twitter.com/))\
  \ 或英国气象局的天气预报 ([[www.metoffice.gov.uk/datapoint`](http://www.metoffice.gov.uk/datapoint))\
  \ 集成如何？\n\n![image](img/9781119439585-9-badges-unlocked.png)\n\n成就解锁：你的大型 Minecraft\
  \ 项目！\n\n![image](img/9781119439585-bapp01.png)\n\n我们希望书中的这些冒险带给你了一系列丰富的想法、代码段和技能，并启发你进一步开启你的\
