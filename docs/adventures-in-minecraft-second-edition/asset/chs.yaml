  \n![image](img/9781119439585-ch04.png)\n\n你可以让 Minecraft 游戏变得更有趣的一种方法是让它根据玩家周围发生的情况来改变自己的行为。当你在游戏世界中移动时，你面临的选择取决于你已经做过了什么，这使得游戏每次玩起来都略有不同。Minecraft\
