  \nFIGURE 8-9 在 Minecraft 世界中炸出的深坑\n\n## 添加按钮和倒计时\n目前，你的骨架程序并没有做什么，但它是一个真正的开始。现在添加一些输入和输出。你使用按钮按下启动游戏，在游戏开始之前，micro:bit\
