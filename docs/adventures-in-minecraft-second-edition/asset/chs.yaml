  \ pos.y+2, pos.z+4, block.STONE.id)`\n   `mc.setBlock(pos.x+3, pos.y+4, pos.z+4,\
  \ block.STONE.id)`\n7. 保存程序并运行。你应该会在玩家面前看到一个像骰子上六个点的简单结构！（参见图 3-2）。\n\n*(注：此处原文文本中第\
  \ 6 步的逻辑块似乎出现了格式错误，将多个 setBlock 语句写进了缩进的描述中，翻译时保留了逻辑顺序。)*\n\n# 清理空间\n\n有时，在 Minecraft\
  \ 世界中找到足够的空间可能会令人沮丧。玩家周围通常有树和山脉。\n\n## 使用 setBlocks 更快地构建\n\nMinecraft 编程接口有一个 `setBlocks()`\
  \ 语句，可以用它为矩形空间内的所有方块设置相同的 ID。因为这是一个针对 Minecraft 的请求，它可以优化执行方式。\n\n你现在将编写一个实用的工具程序，你可以随时用它清理前方一些空间来进行构建：\n\
  \n1. 从菜单中选择“文件 ⇒ 新文件”开始一个新程序。\n2. 使用“文件 ⇒ 另存为”保存程序并命名为 `clearSpace.py`。\n3. 导入你需要的模块：\n\
  \   `import mcpi.minecraft as minecraft`\n   `import mcpi.block as block`\n4. 连接到\
  \ Minecraft 游戏：\n   `mc = minecraft.Minecraft.create()`\n5. 你想清理玩家前面的空间，使用相对坐标来实现。首先获取玩家的位置：\n\
  \   `pos = mc.player.getTilePos()`\n6. 现在清理一个 50x50x50 个方块的空间。你空间的左下角是玩家的位置，右上角将在\
  \ x、y 和 z 维度上 50 块处：\n   ```\n   mc.setBlocks(pos.x, pos.y, pos.z, pos.x+50, pos.y+50,\
  \ pos.z+50, block.AIR.id)\n   ```\n7. 保存你的程序。\n\n\n\n\n\n你刚刚创建的程序最棒的地方在于，它允许你随时走到\
  \ Minecraft 世界中的任何位置，并清理一个 50x50x50 的区域；只需从菜单中选择“运行模块”（Run Module）并运行程序，附近的树木、山脉和一切物体会在你眼前奇迹般地消失！\n\
  \n在 Minecraft 世界中移动并重新运行你的程序，可以在你玩家前方腾出大量空间。\n\n## 从键盘读取输入\n\n你对 `clearSpace.py`\
  \ 程序可以做的另一个有用操作，是让它能够轻松更改清理区域的大小。这样，如果你只想建造一个小型结构，就可以清理一个较小的空间；但如果你知道自己要建造许多大型结构，就可以先清理出一个巨大的空间。\n\
  \n要做到这一点，你将使用一种名为 `input()` 的新 Python 语句来先从键盘读取一个数字。然后，你可以前往 Minecraft 世界的任何部分，运行程序，并只需输入一个代表你想清理的空间大小的数字；你的程序就会为你清理掉所有空间。这意味着你不需要每次想在\
  \ Minecraft 世界中清理不同大小的区域时都反复修改程序。\n\n现在你已经理解了 `input()` 的作用，是时候把它添加到程序中了。要做到这一点，你只需要对你的\
  \ `clearSpace.py` 程序进行两个微小的修改。按照以下步骤操作：\n\n1. 使用 `input()` 要求用户输入一个代表清理空间大小的数字并将并将数字存储在名为\
  \ `size` 的变量中。就像在 Adventure 2 中你使用 `str()` 将某些内容转换为字符串一样，在这里你使用 `int()` 将来自 `input()`\
  \ 的字符串转换为你可以进行计算的数字。尝试不带 `int()` 运行这一行看看会发生什么！只输入加粗标记的新行：\n\n   ```\n   pos = mc.player.getTilePos()\n\
  \   ```\n\n   ```\n   size = int(input(\"size of area to clear? \"))\n   ```\n\n\
  2. 修改 `setBlocks()` 这一行，使用你新定义的变量 `size` 代替数字 50：\n\n   ```\n   mc.setBlocks(pos.x,\
  \ pos.y, pos.z,\n   pos.x + size, pos.y + size, pos.z + size,\n   block.AIR.id)\n\
  \   ```\n\n3. 保存程序并从菜单中选择“运行模块”（Run Module）来运行它。\n\n现在移动到 Minecraft 世界中有很多树或山脉的地方。在提示时在\
  \ Python Shell 窗口中输入一个数字——也许选择 100 之类的——然后按下键盘上的回车键。你玩家附近所有的树和山脉都应该奇迹般地消失，正如图 3-4\
  \ 所示，你将拥有一个漂亮的空间来建造其他结构！\n\n![image](img/9781119439585-fg0304.png)\n\nFIGURE 3-4\
  \ 运行 `clearSpace.py` 后，你获得了一个巨大的空旷区域来建造更令人的结构！\n\n保留这个小实用程序，因为以后当你需要在 Minecraft\
  \ 世界中清理一点空间时，它会很有用。\n\n## 建造房屋\n\n在生存模式下玩 Minecraft 时，你需要做的第一件事之一就是为玩家建造一个避难所，保护他免受\
  \ Minecraft 夜晚潜伏的危险。如果你点一下按钮就能盖一栋房子呢？幸运的是，在为 Minecraft 编程时，你可以将复杂的任务变成仅仅是点一下按钮。\n\
  \n在 `clearSpace.py` 程序中，你学习了如何仅用一条编程语句将大量区块设置为相同的区块类型。现在，你将学习如何使用相同的技术快速建造一栋房子。\n\
  \n建造房屋的一种方法可能是使用独立的 `setBlocks()` 分别建造每面墙。为此，你需要使用四个独立的 `setBlocks()`，并进行大量的数学计算来算出每面墙每个角的所有坐标。幸运的是有一种建造空心矩形结构的更快方法：你只需要建造一个巨大的立方体空间，然后再次使用坐标略有不同的\
  \ `setBlocks()`，用 `AIR` 空气区块类型挖空内部。\n\n在继续下一步之前，你需要花些时间确保理解与你要建造的房屋设计相关的数学知识，因为你需要获得正确的坐标来编写程序。图\
  \ 3-5 显示了房屋设计的草图，标记了你建造时所需的所有重要坐标。当你建造复杂物体时，在纸上画草图并先算出所有重要坐标是非常重要的。这是一个非常特殊的房子，因为你的\
  \ Python 程序会自动计算门口和窗户的大小和位置。稍后你就会明白为什么这很重要。\n\n![image](img/9781119439585-fg0305.png)\n\
  \nFIGURE 3-5 在纸上画出房屋设计，算出所有重要坐标 既然你已经有了房屋设计，尝试按照以下步骤建造它：\n\n1. 从菜单选择“新建文件”（New File）开启新程序。\n\
  2. 使用菜单中的“另存为”（Save As）保存此程序，并命名为 `buildHouse.py`。\n3. 导入所需的模块：\n\n   ```python\n\
  \   import mcpi.minecraft as minecraft\n   import mcpi.block as block\n   ```\n\n\
  4. 连接到 Minecraft 游戏：\n\n   ```python\n   mc = minecraft.Minecraft.create()\n   ```\n\
  \n5. 使用常量定义房屋的大小。你在代码中多次使用这个 `SIZE` 常量，这让你更容易更改尺寸：\n\n   ```python\n   SIZE = 20\n\
  \   ```\n\n6. 获取玩家的位置以便附近建造房屋：\n\n   ```python\n   pos = mc.player.getTilePos()\n\
  \   ```\n\n7. 将玩家的 x、y、z 坐标存储在变量中。这使得接下来的几条语句更容易编写，并有助于你完成后续任务。\n\n   ```python\n\
  \   x = pos.x+2\n   y = pos.y\n   z = pos.z\n   ```\n\n8. 计算两个名为 `midx` 和 `midy`\
  \ 的变量，它们是房屋正面 x 和 y 方向的中点。这有助于你之后计算窗户和门口的坐标，这样当你更改房屋大小时，窗户和门口会改变位置并保持匹配。\n\n   ```python\n\
  \   midx = x + SIZE/2\n   midy = y + SIZE/2\n   ```\n\n9. 以一个巨大的矩形区域建造房屋的外壳。在这里你可以选择任何区块类型，但圆石是一个很好的起点，让它看起来像个老房子：\n\
  \n   ```python\n   mc.setBlocks(x, y, z,\n   x + SIZE, y + SIZE, z + SIZE,\n   block.COBBLESTONE.id)\n\
  \   ```\n\n10. 现在用空气挖空房屋内部。注意你如何利用设计中简单的数学计算算出房屋内部空气的坐标，这些是相对于圆石外角的相对坐标：\n\n   ```python\n\
  \   mc.setBlocks(x + 1, y, z + 1,\n   x + SIZE - 1, y + SIZE - 1, z + SIZE - 1,\n\
  \   block.AIR.id)\n   ```\n\n11. 为门口挖出一个空间，再次使用 `AIR` 区块类型。你在这里不会使用普通的 Minecraft\
  \ 门，因为这是一栋大房子。相反，你创建一个高三块、宽两块的大门口。你的门口需要位于房屋正面的中心，所以 `midx` 提供了那个中间的 x 坐标：\n\n \
  \  ```python\n   mc.setBlocks(midx - 1, y, z,\n   midx + 1, y + 3, z,\n   block.AIR.id)\n\
  \   ```\n\n\n\n\n12. 使用 `GLASS` 类型的块挖出两个窗户。由于这是一个大房子，你将窗户的位置设置在距离房屋边缘三个块、以及距离房屋正面中点三个块的地方。如果你更改了\
  \ `SIZE` 常量并重新运行程序，程序中的所有计算都会自动调整所有位置，门口和窗户将位于正确的位置，这样它看起来仍然是一栋房子。\n\n```python\n\
  mc.setBlocks(x + 3, y + SIZE - 3, z, midx - 3, midy + 3, z, block.GLASS.id)\nmc.setBlocks(midx\
  \ + 3, y + SIZE - 3, z, x + SIZE - 3, midy + 3, z, block.GLASS.id)\n```\n\n13. 添加一个木屋顶：\n\
  \n```python\nmc.setBlocks(x, y + SIZE - 1, z, x + SIZE, y + SIZE, z + SIZE, block.WOOD.id)\n\
  ```\n\n14. 现在，添加一块羊毛地毯：\n\n```python\nmc.setBlocks(x + 1, y - 1, z + 1, x + SIZE\
  \ - 2, y - 1, z + SIZE - 2, block.WOOL.id, 14)\n```\n\n你会发现 `setBlocks()` 的末尾多了一个数字。这个数字设置地毯的颜色；在这种情况下，它是数字\
  \ 14，代表红色。这将在接下来的深入代码（Digging into the Code 侧边栏中解释。\n\n保存你的程序，然后移动到 Minecraft 世界中一个空间较大的地方，通过菜单选择运行（Run）⇒ 运行模块（Run\
  \ Module）来运行你的程序。你应该看到你的房子在眼前奇迹般地！走进去探索一下。抬头看看屋顶，透过窗户向外看，惊叹从零开始如此快速地盖好这栋房子！（参见图\
  \ 3-6）。\n\n![image](img/9781119439585-fg0306.png)\n\n图 3-6 这栋房子是由 Python 程序自动建造的。\n\
  \n不要忘记 `buildHouse.py` 总是相对于你玩家的位置来建造房子的。在 Minecraft 世界中移动并再次运行 `buildHouse.py`\
  \ 来建造另一栋房子。你可以在整个 Minecraft 世界中到处盖房子——这难道不酷吗？\n\n# 建造多一栋房子\n\n盖一栋房子很有趣，但为什么要停于此呢？回想你之前在这次冒险中写的\
  \ `tower.py` 程序，写一个 `for` 循环来重复固定次数的程序语句是非常容易。因此，通过多次循环你的盖房子程序，完全可能建造一条街的房子，甚至整个城镇。\n\
  \n但在这样做之前，你将稍微改进你的盖房子程序，以确保它不会变得过于庞大难以管理。\n\n## 使用 Python 函数\n\n你以后可能想做的事情之一是建造一个具有许多不同设计房子的整个城镇。整个城镇的程序可能会变得非常大且复杂，但幸运的是，Python\
  \ 编程语言中有一个功能可以帮你将这些复杂性封装成小的、可重复的程序代码块。它被称为“函数（function）”。\n\n在你修改现有的 `buildHouse.py`\
  \ 程序以使用函数之前，尝试在 Python Shell 中尝试一些函数，以确保你理解这个概念：\n\n1.  点击 Python Shell 窗口将其置于前台。\n\
  2.  在 Shell 窗口中输入以下内容定义一个名为 `myname` 的新函数：\n\n    ```python\n    def myname():\n\
  \    ```\n\n    `def` 表示“定义一个新函数，这里是它的名字”。就像早之前的 `while`、`if` 和 `for` 语句一样，你必须在行尾加一个冒号（`:`），这样\
  \ Python 就知道预期你提供其他程序语句作为该函数体的一部分。\n3.  Python Shell 会自动为你下一行进行缩进，这样 Python 就知道它们是函数的一部分。输入几行\
  \ `print` 语句，打印你的名字和关于你的信息。当你输入每行时发现什么都没有发生，不要感到惊讶；这是正确的。要有耐心，一切很快就会变得清晰！\n\n  \
  \  ```python\n    print(\"my name is David\")\n    print(\"I am a computer programmer\"\
  )\n    print(\"I love Minecraft programming\")\n    ```\n\n4.  在键盘上按两次回车键，Python\
  \ Shell 会识别到你已经完成了缩进语句的输入。\n5.  通过输入函数名加上括号来要求 Python Shell 运行此函数：\n\n    ```python\n\
  \    myname()\n    ```\n\n6.  尝试多输入几次 `myname()` 看看发生了什么。\n\n起初，这可能看起来有点奇怪，你在 Python\
  \ Shell 中输入了指令但没有任何发生。通常当你在 Python Shell 中输入时，事情一输入就会发生。这一次你做了不同的事情：你“定义”了一个名为 `myname`\
  \ 的函数，并要求 Python 记住那些语句。现在，每当你输入 `myname()`，它就会运行那些语句。\n\n为了不破坏现有的 `buildHouse.py`\
  \ 程序，请使用菜单中的文件（File）⇒ 另存为（Save As）并保存一个名为 `buildHouse.py` 的新文件。\n\n1.  在程序顶部，`import`\
  \ 语句之后，定义一个名为 `house` 的函数：\n\n    ```python\n    def house():\n    ```\n\n2.  移动你的\
  \ `setBlocks()` 语句，使它们缩进到 `def house():` 行的下方。确保操作正确。\n\n3.  注意在程序的最后一条语句中，你只放了名字\
  \ `house()`。这一行运行了现在存储在内存中的代码，这些代码是由 `def house()` 语句设置的。\n\n4.  保存你的程序，移动到一个新位置并运行你的程序。你应该看到一栋房子在你面前被盖好。\n\
  \n## 使用 for 循环建造一街房子\n\n你现在已经准备好整合本章中学到的所有内容，并建造一条巨大的房子街。如果你通过从库存栏中选择物品来手动建造所有这些房子，可能需要花费你几个小时，而且你可能会在建造时出错，或者在无意中让某些房子稍微变小或变大。通过\
  \ Minecraft 编程来这些房屋和其他建筑的自动化建造，你可以加快速度并确保它们按照非常精确的尺寸完美建造！\n\n为了建造许多房子，你需要如下所示在程序中添加一个\
  \ `for` 循环：\n\n1.  为了不破坏现有的 `buildHouse2.py` 程序，请使用菜单中的文件（File）⇒ 另存为（Save As）并保存一个名为\
  \ `buildStreet.py` 的新文件。\n\n2.  在程序末尾，最后的 `house()` 上方添加一个 `for` 循环，以及一条更改房屋建造的\
  \ `x` 位置的语句。每栋房子都距离前一栋房子 `SIZE` 个块。\n\n```python\nfor h in range(5):\n    house()\n\
  \    x = x + SIZE\n```\n\n\n\n保存你的程序，然后移动到 Minecraft 世界中一个空间足够的地方，并运行程序。如图 3-7 所示，你应该能看到一条望远不到头的、由五座房屋组成的街道！控制你的玩家进入每座房屋，确保它们都已正确建造。\n\
  \n![image](img/9781119439585-fg0307.png)\n\n图 3-7 用 Python 程序自动建造的一条五座相同房屋的街道\n\n\
  # 添加随机地毯\n\n到此时，你的 Minecraft 世界中应该有了大量的房屋，而且看起来非常棒。仅仅通过几行 Python 代码，你已经建造了一些大型工程结构！\n\
  \n然而，你可能在想，有一条完全相同的街道开始显得有些单调了。你如何让这些房屋略有不同，从而为你的街道增添趣味呢？\n\n实现这一点的方法是编写几个不同的 `house()`\
  \ 函数，例如 `cottage()`、`townHouse()` 甚至 `maisonette()`，并修改你的程序，在不同位置使用这些不同的函数，为你的街道设计增加多样性。\n\
  \n另一种让你的结构更有趣的方法是稍微改变它们的部分（例如地毯），并让它们在每次运行程序时都不同。这样一来，即使是你，这个程序员，在探索所有房屋之前，也无法完全知道自己到底创造了什么！\n\
  \n## 生成随机数\n\n计算机是非常精确的机器。在日常生活的许多方面，我们都依赖计算机的可预测性，让它在每次运行程序时都执行相同的操作。当你向银行账户存入\
  \ 10 英镑时，你希望确保恰好 10 英镑进入存储你余额的计算机内存部分，且每次万无一失。因此，对于这样一个精确的系统，随机性的概念可能看起来非常奇常。\n\n\
  然而，随机性真正重要的一个领域是游戏设计。如果游戏每次执行的操作都完全相同，它们将变得太容易玩——完全没有趣味或挑战性。你所玩的几乎每一款电脑游戏都包含某种随机性，使每次的情况都略有不同并保持你的兴趣。\n\
  \n幸运的是对于你的 Python 编程，Python 语言内置了一个模块，可以为你生成随机数，所以你不需要自己编写这些代码；只需使用这个内置的随机数生成器即可。\n\
  \n为了确保你了解这些随机数是什么样的，请在 Python Shell 中尝试一下：\n\n1. 点击 Python Shell 窗口。\n2. 导入 `random`\
  \ 模块以便可以使用内置的随机函数：\n\n```\nimport random\n```\n\n3. 让程序生成一个 1 到 100 之间的随机数并将其打印到屏幕上：\n\
  \n```\nprint(random.randint(1,100))\n```\n\n你应该能在屏幕上看到一个 1 到 100 之间的数字。再次输入语句。这次得到了什么数字？\n\
  \n4. 现在使用 `for` 循环打印大量的随机数。确保对第二行进行缩进，以便 Python 知道 `print` 语句是 `for` 循环的一部分：\n\n\
  ```\nfor n in range(50):\n    print(random.randint(1,100))\n```\n\n`randint()` 函数括号内的两个数字告诉它你想生成的数字范围；1\
  \ 是你期望生成的最小值，100 是最大。\n\n## 铺设地毯\n\n在之前的冒险中，你使用了 `setBlocks()` 函数中的额外数据来将羊毛地毯设置为红色，使用了\
  \ `WOOL` 的额外数据。`WOOL`允许的额外数据范围在 0 到 15 之间——换句话说，有 16 种颜色可选。现在按照以下步骤修改你的建筑程序，生成一个随机数并将其作为房屋内\
  \ `WOOL` 地毯的颜色：\n\n1. 从菜单通过文件⇒另存为你的 `buildStreet.py`，并命名为 `buildStreet2.py`。\n2.\
  \ 在程序顶部添加此导入语句以获取随机数生成器的访问权限：\n\n```\nimport random\n```\n\n3. 修改你的 `house()` 函数，使其在每次调用时都生成随机的地毯颜色。由于\
  \ `WOOL` 的额外数据范围在 0 到 15 之间，这就是你需要生成的随机数范围。将随机数存储在变量 `c` 中，这样建造地毯的行就不会变得过长且难以阅读，并确保这两行代码都正确缩进，因为它们都是\
  \ `house()` 函数的一部分：\n\n```\nc = random.randint(0, 15)\nmc.setBlocks(x+1, y+1, z+1,\
  \ x+SIZE-1, y+1, z+SIZE-1, block.WOOL.id, c)\n```\n\n4. 保存你的程序。\n\n现在你需要在 Minecraft\
