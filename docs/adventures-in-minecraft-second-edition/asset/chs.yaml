  \ 函数来创建空洞。\n\n## 创建空洞\n\n玩家必须跨越河流。如果玩家掉入河流，他将被带回竞技场的起点。你将在第 3 部分编写将玩家带回起点的代码；现在，本节是关于构建河流和移动桥的。\n\
