  \ 模块提供了一种创建随机数的方法，这些随机数可以在游戏桌子大小兼容的范围内生成。方块是在桌子上创建的，这样以后收集方块时，它就会留下一个洞让球掉进去。修改 `place_treasure()`\
  \ 函数使其如下所示：\n\n```python\ndef place_treasure():\n    y = table_y\n    for i in range(TREASURE_COUNT):\n\
  \        x = random.randint(0, TABLE_WIDTH) + table_x\n        z = random.randint(0,\
  \ TABLE_DEPTH) + table_z\n        mc.setBlock(x, y, z, TREASURE)\n```\n\n2. 现在开发\
  \ `check_below()` 函数，它监控球正下方（y–1）的方块类型。如果是 `TREASURE` 块，则收集该方块。如果是 `AIR` 块，球就会掉进洞里，然后弹出并降落在在洞附近的随机位置。收集宝藏很容易；你只需要将\
  \ `TREASURE` 块设置为 `AIR`，它就会消失。修改 `check_below()` 函数使其如下所示：\n\n```python\ndef check_below():\n\
  \    global remaining\n    block_below = mc.getBlock(ball_x, ball_y-1, ball_z)\n\
  \    if block_below == TREASURE:\n        mc.setBlock(ball_x, ball_y-1, ball_z,\
  \ block.AIR.id)\n        remaining = remaining - 1\n    microbit.display.show(remaining)\n\
  \    elif block_below == block.AIR.id:\n        move_ball_to(ball_x, ball_y-1, ball_z)\n\
  \        time.sleep(0.5)\n        move_ball_to(table_x + random.randint(0, TABLE_WIDTH),\
  \ table_y+1, table_z + random.randint(0, TABLE_DEPTH))\n```\n\n保存你的程序并再次运行。\n\n\
  成功了吗？并不完全！一个常见的编程错误是编写了一个执行某些操作的新函数，但忘记修改程序的其余部分以使其工作。\n\n## 完成游戏\n\n还有另一个修改可以使其工作：在\
  \ `build_game()` 函数中添加**加粗**的行：\n\n```python\ndef build_game():\n    global remaining,\
  \ speed_x, speed_z\n    pos = mc.player.getTilePos()\n    build_table(pos.x, pos.y-2,\
  \ pos.z)\n    move_ball_to(table_x + random.randint(0, TABLE_WIDTH), table_y+1,\
  \ table_z + random.randint(0, TABLE_DEPTH))\n```\n\n现在你应该可以玩这个游戏了！倾斜 BBC micro:bit\
