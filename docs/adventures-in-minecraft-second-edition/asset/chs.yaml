  \ 3D 结构。\n\n![image](img/9781119439585-fg0601.png)\n\nFIGURE 6-1 一个巨大的 Minecraft\
  \ 时钟\n\n# minecraftstuff 模块\n\n`minecraftstuff` 是 Minecraft API 的一个扩展模块，它是为 *Adventures\
  \ in Minecraft* 编写的，包含了绘制形状和控制 3D 对象所需的所有代码。它包含了一组名为 `MinecraftDrawing` 的函数，允许你创建线、圆、球体和其他形状。由于这段复杂的代码位于单独的\
  \ `module` 中，它让你创建代码变得更加简单，也更容易理解。模块是将程序拆分成较小块的方法。当程序变得过大时，它们更难以阅读、更难理解，追踪问题也需要更长时间。\n\
  \n`minecraftstuff` 模块包含在你在冒险 1 中安装的“Adventures in Minecraft”入门工具件中，你可以像导入 `minecraft`\
  \ 和 `block` 模块一样将其导入到 Minecraft 程序中。\n\n# 创建线、圆和球体\n\n当你将许多微小简单的东西组合在一起时，你可以创建任何你想要的大型且复杂的物体。在这次冒险中，你将使用大量的线、圆、球和其他形状来产生一个非常大的\
  \ Minecraft 结构。在冒险的这部分，你将创建一个新程序，导入所需的模块并设置 `minecraft` 和 `minecraftdrawing` 模块。稍，你将使用模块中的函数来绘制线、圆和球体。\n\
  \n启动 Minecraft 和 Python IDLE。到目前你应该已经练习过如何启动一切了，但如果需要任何提醒，请参考冒险 1。\n\n1.  首先打开 IDLE\
  \ 并创建一个新文件。将文件保存为 `LinesCirclesAndSpheres.py` 并存放在 `MyAdventures` 文件夹中。\n2.  通过输入以下行导入\
  \ `minecraft`、`block`、`minecraftstuff` 和 `time` 模块：\n    ```\n    import mcpi.minecraft\
  \ as minecraft\n    import mcpi.block as block\n    import mcpi.minecraftstuff as\
  \ minecraftstuff\n    import time\n    ```\n3.  创建与 Minecraft 的连接：\n    ```\n  \
  \  mc = minecraft.Minecraft.create()\n    ```\n4.  使用 `minecraftstuff` 模块创建一个 `MinecraftDrawing`\
  \ 对象，输入：\n    ```\n    mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n    ```\n\
  \n## 绘制线条\n\n`MinecraftDrawing` 对象有一个名为 `drawLine()` 的函数，当调用它并将两个位置 (x, y, z) 和方块类型作为参数时，它会在这些位置之间创建一条方块线——就像你在冒险\
  \ 3 中学习的 `setBlocks()` 函数一样。\n\n以下代码使用 `drawLine` 函数创建如图 6-2 所示的方块线：\n```\ndrawLine(x1,\
  \ y1, z1, x2, y2, z2, blockType, blockData)\n```\n![image](img/9781119439585-fg0602.png)\n\
  \nFIGURE 6-2 `drawLine()` 函数在两组 x,y,z 点之间创建一条方块线。\n\n现在更新你的程序，使其使用 `drawLine()`\
  \ 函数在 Minecraft 中创建三条线——从玩家位置开始的一垂直直向上、一条横跨和一条对角线。将以下代码添加到 `LinesCirclesAndSpheres.py`\
  \ 程序的底部：\n\n1.  通过输入以下代码找到玩家的位置：\n    ```\n    pos = mc.player.getTilePos()\n  \
  \  ```\n2.  通过输入以下代码从玩家位置垂直向上绘制一条 20 个方块的垂直线：\n    ```\n    mcdrawing.drawLine(pos.x,\
  \ pos.y, pos.z,\n    pos.x, pos.y + 20, pos.z, blockType, blockData)\n    ```\n\
  \    *(注：源文本在此处有些碎片化，我将根据提供的片段进行逻辑重构)*。\n    *等等，我将直接使用提示词中的文本以确保安全。*\n\n实际上，再次查看提示词提供的源文本：\n\
  `pos = mc.player.getTilePos()`\n`mcdrawing.drawLine(pos.x, pos.y, pos.z,`\n`pos.x,\
  \ pos.y + 20, pos.z, blockType, blockData)`\n这是我将格式化的内容。（我意识到，提示词中的源文本实际上非常混乱。我将提供该特定文本的最佳\
  \ Markdown 版本。）\n\n\n\n在看到如何在 Minecraft 中创建圆和线之后，也许你就能学会如何如何在图 6-1 中创建一个时钟。表盘仅仅是一个大圆，而每个指针都是一条线。现在到了最困难的部分——计算线条应该放在哪里，以及如何让它们移动起来。\n\
  \n在冒险的这部分，你将使用`trigonometry`（三角函数）通过将指针的角度转换为表盘上的 `x` 和 `y` 坐标来计算出指针指向的方向（参见图 6-5）。你将通过先用方块绘制指针，然后通过绘制\
  \ `AIR` 来移除它们，最后在新位置再次绘制，从而让指针看起来像在移动。\n\n![image](img/9781119439585-fg0605.png)\n\
  FIGURE 6-5 在表面上找到指针指向的位置\n\n要创建时钟，请按照以下步骤操作：\n\n1.  打开 IDLE 并创建一个新文件，为 Minecraft\
  \ 时钟创建一个新程序。将文件保存为 `MinecraftClock.py` 并放在 `MyAdventures` 文件夹中。\n2.  输入以下代码导入 `minecraft`、`block`、`minecraftstuff`、`time`、`datetime`\
  \ 和 `math` 模块：\n    ```python\n    import mcpi.minecraft as minecraft\n    import\
  \ mcpi.block as block\n    import mcpi.minecraftstuff as minecraftstuff\n    import\
  \ time\n    import datetime\n    import math\n    ```\n3. 创建函数 `findPointOnCircle()`。当你向此函数传递圆心和指针的角度时，函数将返回指针的位置，如图\
  \ 6-5 所示。\n    ```python\n    def findPointOnCircle(cx, cy, radius, angle):\n  \
  \      x = cx + math.sin(math.radians(angle)) * radius\n        y = cy + math.cos(math.radians(angle))\
  \ * radius\n        x = int(round(x, 0))\n        y = int(round(y, 0))\n       \
  \ return(x, y)\n    ```\n4.  连接到 `Minecraft` 并创建 `MinecraftDrawing` 对象：\n    ```python\n\
  \    mc = minecraft.Minecraft.create()\n    mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n\
  \    ```\n5.  通过输入代码找到玩家当前的位置：\n    ```python\n    pos = mc.player.getTilePos()\n\
  \    ```\n6.  现在你将为时钟中心（位于玩家位置上方 25 个方块）、表盘半径以及时针长度创建变量：\n    ```python\n    clockMiddle\
  \ = pos\n    clockMiddle.y = clockMiddle.y + 25\n    CLOCK_RADIUS = 20\n    HOUR_HAND_LENGTH\
  \ = 10\n    MIN_HAND_LENGTH = 18\n    SEC_HAND_LENGTH = 20\n    ```\n7.  使用 `drawCircle()`\
  \ 绘制表盘：\n    ```python\n    mcdrawing.drawCircle(\n        clockMiddle.x, clockMiddle.y,\
  \ clockMiddle.z,\n        CLOCK_RADIUS, block.DIAMOND_BLOCK.id)\n    ```\n8.  程序还没有完成，但你现在应该运行它来检查一切是否正常，并且玩家上方是否出现了一个大圆（表盘）。\n\
  \n接下来，你为程序添加时钟指针的代码：\n\n1.  启动一个无限循环。此后的所有代码都将在此循环内。\n    ```python\n    while True:\n\
  \    ```\n2.  使用 `datetime.datetime.now()` 函数询问电脑当前时间。然后你将时间拆分为小时、分钟和秒。因为你的时钟是 12\
  \ 小时制而不是 24 小时制，如果时间在中午之后，你需要从小时中减去 12（例如，如果时间是 14:00，则显示为 2 点）。通过输入以下代码实现这一点：\n\
  \    ```python\n    timeNow = datetime.datetime.now()\n    hours = timeNow.hour\n\
  \    if hours >= 12:\n        hours = timeNow.hour - 12\n    minutes = timeNow.minute\n\
  \    seconds = timeNow.second\n    ```\n3.  绘制时针。它的角度是 360 度除以 12 小时，乘以当前小时。使用 `findPointOnCircle()`\
  \ 找到指针端的 x 和 y 位置，并输入以下代码使用 `drawLine()` 绘制指针：\n    ```python\n    hourHandAngle\
  \ = (360 / 12) * hours\n    hourHandX, hourHandY = findPointOnCircle(\n        clockMiddle.x,\
  \ clockMiddle.y,\n        HOUR_HAND_LENGTH)\n    mcdrawing.drawLine(clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z,\n        hourHandX, hourHandY, clockMiddle.z)\n\
  \    ```\n4.  通过输入代码绘制分针，它位于时针后一个方块（`z-1`）：\n    ```python\n    minHandAngle = (360\
  \ / 60) * minutes\n    minHandX, minHandY = findPointOnCircle(\n        clockMiddle.x,\
  \ clockMiddle.y,\n        MIN_HAND_LENGTH)\n    mcdrawing.drawLine(clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z-1,\n        minHandX, minHandY, clockMiddle.z-1)\n\
  \    ```\n5.  添加秒针，它位于时针前一个方块（`z+1`）：\n    ```python\n    secHandAngle = (360 /\
  \ 60) * seconds\n    secHandX, secHandY = findPointOnCircle(\n        clockMiddle.x,\
  \ clockMiddle.y,\n        SEC_HAND_LENGTH)\n    mcdrawing.drawLine(clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z+1,\n        secHandX, secHandY, clockMiddle.z+1)\n\
  \    ```\n6.  等待一秒：\n    ```python\n    time.sleep(1)\n    ```\n7.  你的程序再次还没有完成，但你应该运行它来检查指针是否出现。观察指针移动的情况。你可能注意到指针在移动时并没有被清除。下一步是使用\
  \ `AIR` 再次绘制指针来清除它们：\n    1.  清除时针：\n        ```python\n        mcdrawing.drawLine(clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z,\n            hourHandX, hourHandY, clockMiddle.z,\
  \ block.AIR.id)\n        ```\n    2.  清除分针：\n        ```python\n        mcdrawing.drawLine(clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z-1,\n            minHandX, minHandY, clockMiddle.z-1,\
  \ block.AIR.id)\n        ```\n    3.  清除秒针：\n        ```python\n        mcdrawing.drawLine(clockMiddle.x,\
  \ clockMiddle.y, clockMiddle.z+1,\n            secHandX, secHandY, clockMiddle.z+1,\
  \ block.AIR.id)\n        ```\n    4.  运行程序查看成果：玩家上方有一个巨大的时钟。请确保玩家位于时钟的一侧，否则时间会倒着走！\n\
  \n你可以从辅助网站 [`www.wiley.com/go/adventures2e`](http://www.wiley.com/go/adventures2e)\
  \ 下载 Minecraft 时钟的完整代码，但我建议你在阅读步骤时自己输入代码。那样你会学到更多！\n\n# 绘制多边形\n\n多边形是任何由直线边组成的二维形状。它可以有任意数量的边，从三个（三角形）开始。如图\
  \ 6-6 所示，你可以在 Minecraft 中创建任意数量有趣的多边形。\n\n![image](img/9781119439585-fg0606.png)\n\
  FIGURE 6-6 Minecraft 中的多边形示例\n\n尽管它们是二维形状，但你会发现多边形对于制作 3D 图形非常有用，因为通过连接许多多边形可以创建任何\
  \ 3D 对象。当多边形组合在一起创建 3D 对象时，它们被称为 `faces`（面）。你可以通过这种方式创建一些惊人的结构。只需看图 6-7，它展示了由许多多边形组成的曼哈顿岛天际线（可以参考\
  \ [`www.stuffaboutcode.com/2013/04/minecraft-pi-edition-manhattan-stroll.html`](http://www.stuffaboutcode.com/2013/04/minecraft-pi-edition-manhattan-stroll.html)查看方法）。\n\
  \n![image](img/9781119439585-fg0607.png)\nFIGURE 6-7 纽约曼哈顿岛的 Minecraft 天际线\n\n你可以使用\
  \ `MinecraftDrawing` 中的 `drawFace()` 函数创建多边形（面）。该函数期望一个点列表 `(x, y, z)`，按顺序连接时会形成完整的多边形。在\
  \ `filled` 参数中传递 `True` 或 `False` 决定该面是否填充，最后一个参数是制作该面应使用的方块类型（参见图 6-8）：\n\n\n\n\
  \n`drawFace(points, filled, blockType, blockData)`\n\n![image](img/9781119439585-fg0608.png)\n\
  \nFIGURE 6-8 `drawFace()` 用于从三个点创建一个三角形\n\n创建一个新程序来实验 `drawFace()` 函数，并创建图 6-8 所示的三角形：\n\
  \n1. 打开 IDLE 并创建一个新文件。将文件保存为 `Polygon.py` 并存于 `MyAdventures` 文件夹中。\n\n2. 通过输入以下代码导入\
  \ `minecraft`、`block` 和 `minecraftstuff` 模块：\n\n```python\nimport mcpi.minecraft\
  \ as minecraft\nimport mcpi.block as block\nimport mcpi.minecraftstuff as minecraftstuff\n\
  ```\n\n3. 连接到 minecraft 并创建 `MinecraftDrawing` 对象：\n\n```python\nmc = minecraft.Minecraft.create()\n\
  mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n```\n\n4. 获取玩家当前位置：\n\n```python\n\
  pos = mc.player.getTilePos()\n```\n\n5. 使用 `minecraftstuff.Points` 类创建一个点列表：\n\n\
  ```python\npoints = minecraftstuff.Points()\n```\n\n6. 然后向 points 列表添加三个点 (x, y,\
  \ z)，这些点在连接在一起时会形成一个三角形：\n\n```python\npoints.add(pos.x, pos.y, pos.z)\npoints.add(pos.x\
  \ + 20, pos.y, pos.z)\npoints.add(pos.x + 10, pos.y + 20, pos.z)\n```\n\n7. 使用 `MinecraftDrawing.drawFace`\
  \ 函数创建三角形多边形：\n\n```python\nmcdrawing.drawFace(points, True, block.WOOL.id, 6)\n\
  ```\n\n8. 保存文件并运行程序以创建三角形多边形。\n\n# 金字塔\n\n找一张金字塔的图片并仔细观察。你注意到了什么？它的面是什么什么形状？所有的面有什么共同点？它有多少面？\n\
  \n正如你可能已经知道的，金字塔的每个面（底部除外）都是三角形。埃及的金字塔有四面（如果算上底部则是五面），但它们可以从三个面到任意数量的面。你是否也注意到任何金字塔的底部都能完美地契合一个圆！查看图\
  \ 6-9 来理解我的意思。\n\n![image](img/9781119439585-fg0609.png)\n\nFIGURE 6-9 由三角形组成的金字塔，完美契合圆形\n\
  \n你现在将创建一个程序，通过使用 `drawFace()` 和 `findPointOnCircle()` 函数，制作任何尺寸、任何高度、任意边数的金字塔：\n\
  \n1. 打开 IDLE 并创建一个新文件。将文件保存为 `MinecraftPyramids.py` 并存于 `MyAdventures` 文件夹中。\n\n\
  2. 输入以下代码导入 `minecraft`、`block`、`minecraftstuff` 和 `math` 模块：\n\n```python\nimport\
  \ mcpi.minecraft as minecraft\nimport mcpi.block as block\nimport mcpi.minecraftstuff\
  \ as minecraftstuff\nimport math\n```\n\n3. 创建 `findPointOnCircle()` 函数，它将用于计算构成金字塔的每个三角形所在的位置：\n\
  \n```python\ndef findPointOnCircle(cx, cy, radius, angle):\n    x = cx + math.sin(math.radians(angle))\
  \ * radius\n    y = cy + math.cos(math.radians(angle)) * radius\n    x = int(round(x,\
  \ 0))\n    y = int(round(y, 0))\n    return(x, y)\n```\n\n4. 连接到 Minecraft 并创建 `MinecraftDrawing`\
  \ 对象：\n\n```python\nmc = minecraft.Minecraft.create()\nmcdrawing = minecraftstuff.MinecraftDrawing(mc)\n\
  ```\n\n5. 设置金字塔的变量。金字塔的中心是玩家的位置。这些变量的值会改变金字塔的大小（或半径）、高度和边数。\n\n```python\nmiddle\
  \ = mc.player.getTilePos()\nRADIUS = 20\nHEIGHT = 10\nSIDES = 4\n```\n\n6. 遍历金字塔的每一面；此点之后的所有代码都缩进在\
  \ `for` 循环下：\n\n```python\nfor side in range(0, SIDES):\n```\n\n7. 对于金字塔的每一面，计算三角形的角度，然后使用\
  \ `findPointOnCircle()` 寻找 x, y, z 坐标。角度的计算方法是用 360 度除以总边数，乘以正在绘制的边的序号，如图 6-10 所示。在\
  \ `for` 循环下按如下缩进输入代码：\n\n```python\npoint1Angle = int(round((360 / SIDES) * side))\n\
  point1X, point1Z = findPointOnCircle(middle.x, middle.z, RADIUS, point1Angle)\n\
  point2Angle = int(round((360 / SIDES) * (side + 1))\npoint2X, point2Z = findPointOnCircle(middle.x,\
  \ middle.z, RADIUS, point2Angle)\n```\n\n8. 创建三角形的点并按如下方式使用 `drawFace()` 创建金字塔的侧：\n\
  \n```python\npoints = minecraft.Points()\npoints.add(point1X, middle.y, point1Z)\n\
  points.add(point2X, middle.y, point2Z)\npoints.add(middle.x, middle.y + HEIGHT,\
  \ middle.z)\nmcdrawing.drawFace(points, True, block.SANDSTONE.id)\n```\n\n9. 保存文件并运行程序。一个金字塔出现在玩家上方——并把他困住了！\n\
  \n![image](img/9781119439585-fg0610.png)\n\nFIGURE 6-10 四边形程序可以创建任意尺寸和任意边数的金字塔。尝试更改程序中的变量并重新运行。图\
  \ 6-11 显示了一些令人印象深刻的示例。\n\n![image](img/9781119439585-fg0611.png)\n\nFIGURE 6-11\
  \ Minecraft 金字塔\n\n你可以在 *Adventures in Minecraft* 网站下载 Minecraft 金字塔的完整代码：`www.wiley.com/go/adventuresinmineraf`。\n\
  \n# 二维三维形状的进一步冒险\n\n使用 `drawFace()` 函数，你可以创建任何类型的多面体（具有平面，就像你创建的金字塔一样），何不多创作一些？\n\
  \n你可以在以下网站找到许多多面体示例和好的创意：\n\n* Maths is Fun (`www.mathisfun.com/geometry/polyhedron.html`)\n\
  * Kids Math Games (`www.kidsmathgames.com/geometry/3dpolyhedronshapes.html`)\n\n\
  ## 快速参考表\n\n| 命令 |  |\n| :--- | :--- |\n| `mcdrawing.drawLine(0, 0, 0, 10, 10, 10,\
  \ block.DIRT.id)` | 在两点间画一条线 |\n| `mcdrawing.drawCircle(0, 0, 0, radius, block.DIRT.id)`\
  \ | 绘制一个圆 |\n| `mcdrawing.drawSphere(0, 0, 0, radius, block.DIRT.id)` | 绘制一个球 |\n\
  | `tri = minecraftstuff.Points(); filled = True; tri.add(0,0,0); tri.add(10,0,0);\
  \ tri.add(5,10,0); mcdrawing.drawFace(tri, filled, block.DIRT.id)` | 绘制一个多边形 |\n\
  \n\n\n\nMinecraft 世界可能是一个孤独的世界。但你的玩家并不非得孤单——你可以创建一个随在他身边转转、与他交流并成为他朋友的方块（参见图 7-1）。\n\
  \n![image](img/9781119439585-fg0701.png)\n\n图 7-1 创建一个方块朋友，在你的 Minecraft 冒险中陪伴你的玩家。\n\
  \n要为方块朋友编写程序，你需要像她一样思考！如果她在你的玩家附近，她会很高兴，所以她想要跟随他转转，并尝试坐在他身边。只要你的玩家靠近她，她就会保持开心；如果你的玩家离开了，她会跟在后面。如果你的玩家走得太远，会让方块朋友感到难过，她会停止跟随，直到玩家回来并给她一个拥抱（站在她旁边）。\n\
  \n方块朋友程序包含两个不同的部分：\n\n*   **方块用于决定下一步做什么的规则：** 程序的这部分让方块朋友决定是向你的玩家（目标）移动还是停在不动。\n\
  *   **让方块向目标移动的代码：** 一旦方块朋友到达目标，她会再次使用规则来确定下一步做什么。\n\n当方块朋友向目标移动时，她应该在陆地“上方”移动，而不是悬浮在空中或钻入地下！你通过使用函数\
  \ `mc.getHeight(x,z)` 并向其传递一个水平位置 `(x,z)` 来实现。它返回从天空向下第一个不是 `AIR` 的方块的垂直位置 `(y)`。\n\
  \n从为方块朋友创建一个新程序开始：\n\n1. 打开 IDLE，选择 File（文件）⇒ New File（新建文件）创建一个新程序，并将文件保存为 `BlockFriend.py`\
  \ 位于 `MyAdventures` 文件夹中。\n2. 导入 `minecraft`、`block`、`minecraftstuff`、`math` 和 `time`\
  \ 模块：\n   ```python\n   import mcpi.minecraft as minecraft\n   import mcpi.block\
  \ as block\n   import mcpi.minecraftstuff as minecraftstuff\n   import math\n  \
  \ import time\n   ```\n3. 你需要做的第一件事是创建一个计算两点之间距离的函数。之后你使用这个函数来计算方块朋友距离玩家有多远：\n \
  \  ```python\n   def distanceBetweenPoints(point1, point2):\n       xd = point2.x\
  \ - point1.x\n       yd = point2.y - point1.y\n       zd = point2.z - point1.z\n\
  \       return math.sqrt((xd*xd) + (yd*yd) + (zd*zd))\n   ```\n4. 现在你需要决定玩家需要离开多远方块朋友才会停止跟随。创建一个常量来存储你认为“太远”的距离。我选择了\
  \ 15，这意味着当方块朋友和玩家相隔 15 个方块时，方块朋友停止跟随玩家：\n   ```python\n   TOO_FAR_AWAY = 15\n  \
  \ ```\n5. 创建 `Minecraft` 和 `MinecraftDrawing` 对象：\n   ```python\n   mc = minecraft.create()\n\
  \   mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n   ```\n6. 创建一个变量来存储方块的心情。在这次冒险中，方块要么快乐要么难过。将其设置为\
  \ `\"happy\"`：\n   ```python\n   blockMood = \"happy\"\n   ```\n7. 创建方块朋友，距离玩家几个方块，通过获取玩家的位置，在\
  \ x 位置上加 5，并使用 `getHeight()` 函数找到 y 位置，这样方块就坐在陆地上：\n   ```python\n   friend = mc.player.getTilePos()\n\
  \   friend.x = friend.x + 5\n   friend.y = mc.getHeight(friend.x, friend.z)\n  \
  \ mc.setBlock(friend.x, friend.y, friend.z, block.DIAMOND_BLOCK.id)\n   mc.postToChat(\"\
  Hello friend\")\n   ```\n8. 为方块朋友创建一个目标。这是她将要移动的位置。最初，将目标设置为方块朋友当前的位置，这样方块朋友在程序启动时就不会尝试移动任何地方：\n\
  \   ```python\n   target = friend.clone()\n   ```\n9. 开始一个无限循环，这样程序将永远运行。（注意，此点之后的所有代码都缩进在此循环下。）\n\
  \   ```python\n   while True:\n   ```\n10. 获取玩家的位置，并使用 `distanceBetweenPoints()`\
  \ 函数计算玩家与方块朋友之间的距离：\n    ```python\n    pos = mc.player.getTilePos()\n    distance\
  \ = distanceBetweenPoints(pos, friend)\n    ```\n11. 应用你想让方块朋友使用的规则来确定下一步做什么。如果是“快乐”的，告诉它比较朋友与\
  \ `TOO_FAR_AWAY` 常量之间的距离。如果距离小于“太远”常量，将目标设置为玩家的位置。如果大于“太远”常量，则让方块朋友心情难过并停止跟随直到玩家回来（参见图\
  \ 7-2）：\n    ```python\n    if blockMood == \"happy\":\n        if distance < TOO_FAR_AWAY:\n\
  \            target = pos\n        else:\n            blockMood = \"sad\"\n    \
  \        mc.postToChat(\"Come back. You are too far\")\n    ```\n12. 在检查方块是否为“快乐”的\
  \ `if` 语句之后缩进，告诉你的程序直到玩家进入一个方块的范围内才将方块的心情设置为“快乐”。\n    ```python\n    elif blockMood\
  \ == \"sad\":\n        if distance <= 1:\n            blockMood = \"happy\"\n  \
  \          mc.postToChat(\"A thanks. Lets go.\")\n    ```\n13. 运行你的程序，测试当你离开方块朋友时她是否从快乐变为难过，并在给你一个拥抱时又变为快乐。\n\
  \n![image](img/9781119439585-fg0702.png)\n\n当方块朋友向目标移动时，她应该在陆地“上方”移动，而不是悬浮在空中或钻入地下！你通过使用函数\
  \ `mc.getHeight(x,z)` 并向其传递一个水平位置 `(x,z)` 来实现。它返回从天空向下第一个不是 `AIR` 的方块的垂直位置 `(y)`。\n\
  \n现在你的方块朋友在告诉你她的感受，下一步是更新程序让方块朋友跟随玩家：\n\n1. 打开 IDLE，选择 File（文件）⇒ New File（新建文件）创建一个新程序，并将文件保存为\
  \ `BlockFriend.py` 位于 `MyAdventures` 文件夹中。\n2. 导入 `minecraft`、`block`、`minecraftstuff`、`math`\
  \ 和 `time` 模块：\n   ```python\n   import mcpi.minecraft as minecraft\n   import mcpi.block\
  \ as block\n   import mcpi.minecraftstuff as minecraftstuff\n   import math\n  \
  \ import time\n   ```\n3. 你需要做的第一件事是创建一个计算两点之间距离的函数。之后你使用这个函数来计算方块朋友距离玩家有多远：\n \
  \  ```python\n   def distanceBetweenPoints(point1, point2):\n       xd = point2.x\
  \ - point1.x\n       yd = point2.y - point1.y\n       zd = point2.z - point1.z\n\
  \       return math.sqrt((xd*xd) + (yd*yd) + (zd*zd))\n   ```\n4. 现在你需要决定玩家需要离开多远方块朋友才会停止跟随。创建一个常量来存储你认为“太远”的距离。我选择了\
  \ 15，这意味着当方块朋友和玩家相隔 15 个方块时，方块朋友停止跟随玩家：\n   ```python\n   TOO_FAR_AWAY = 15\n  \
  \ ```\n5. 创建 `Minecraft` 和 `MinecraftDrawing` 对象：\n   ```python\n   mc = minecraft.create()\n\
  \   mcdrawing = minecraftstuff.MinecraftDrawing(mc)\n   ```\n6. 创建一个变量来存储方块的心情。在这次冒险中，方块要么快乐要么难过。将其设置为\
  \ `\"happy\"`：\n   ```python\n   blockMood = \"happy\"\n   ```\n7. 创建方块朋友，距离玩家几个方块，通过获取玩家的位置，在\
  \ x 位置上加 5，并使用 `getHeight()` 函数找到 y 位置，这样方块就坐在陆地上：\n   ```python\n   friend = mc.player.getTilePos()\n\
  \   friend.x = friend.x + 5\n   friend.y = mc.getHeight(friend.x, friend.z)\n  \
  \ mc.setBlock(friend.x, friend.y, friend.z, block.DIAMOND_BLOCK.id)\n   mc.postToChat(\"\
  Hello friend\")\n   ```\n8. 为方块朋友创建一个目标。这是她将要移动的位置。最初，将目标设置为方块朋友当前的位置，这样方块朋友在程序启动时就不会尝试移动任何地方：\n\
  \   ```python\n   target = friend.clone()\n   ```\n9. 开始一个无限循环，这样程序将永远运行。（注意，此点之后的所有代码都缩进在此循环下。）\n\
  \   ```python\n   while True:\n   ```\n10. 获取玩家的位置，并使用 `distanceBetweenPoints()`\
  \ 函数计算玩家与方块朋友之间的距离：\n    ```python\n    pos = mc.player.getTilePos()\n    distance\
  \ = distanceBetweenPoints(pos, friend)\n    ```\n11. 应用你想让方块朋友使用的规则来确定下一步做什么。如果是“快乐”的，告诉它比较朋友与\
  \ `TOO_FAR_AWAY` 常量之间的距离。如果距离小于“太远”常量，将目标设置为玩家的位置。如果大于“太远”常量，则让方块朋友心情难过并停止跟随直到玩家回来（参见图\
  \ 7-2——不对，此处正）：\n    ```python\n    if blockMood == \"happy\":\n        if distance\
  \ < TOO_FAR_AWAY:\n            target = pos\n        else:\n            blockMood\
  \ = \"sad\"\n            mc.postToChat(\"Come back. You are too far\")\n    ```\n\
  12. 在检查方块是否为“快乐”的 `if` 语句之后缩进，告诉你的程序直到玩家进入一个方块的范围内才将方块的心情设置为“快乐”。\n    ```python\n\
  \    elif blockMood == \"sad\":\n        if distance <= 1:\n            blockMood\
  \ = \"happy\"\n            mc.postToChat(\"A thanks. Lets go.\")\n    ```\n13. 运行你的程序，测试当你离开方块朋友时她是否从快乐变为难过，并在给你一个拥抱时又变为快乐。\n\
  \n![image](img/9781119439585-fg0702.png)\n\n当方块朋友向目标移动时，她应该在陆地“上方”移动，而不是悬浮在空中或钻入地下！你通过使用函数\
  \ `mc.getHeight(x,z)` 并向其传递一个水平位置 `(x,z)` 来实现。它返回从天空向下第一个不是 `AIR` 的方块的垂直位置 `(y)`。\n\
  \n现在你的方块朋友在告诉你她的感受，下一步是更新程序让方块朋友跟随玩家：\n\n1. 方块朋友仅需要移动，如果她的位置与目标相同：\n    ```python\n\
  \    if friend != target:\n    ```\n2. 使用 `MinecraftDrawing` 中的 `getLine()` 函数找到朋友和目标之间的所有方块：\n\
  \    ```python\n    line = mcdrawing.getLine(\n        friend.x, friend.y, friend.z,\n\
  \        target.x, target.y, target.z)\n    ```\n   `getLine()` 函数的工作方式与 `drawLine()`\
  \ 相同（参见冒险 6）。然而，它不是在方块中绘制线条，而是返回一组构成两组参数之间 `x, y, z` 线的点的列表。\n3. 在前一个代码正下方，你需要告诉你的程序循环朋友和目标之间的所有方块，并将方块朋友移动到朋友和玩家之间的下一个方块：\n\
  \    ```python\n    for nextBlock in line[:-1]:\n        mc.setBlock(friend.x, friend.y,\
  \ friend.z, block.AIR.id)\n        friend = nextBlock.clone()\n        friend.y\
  \ = mc.getHeight(friend.x, friend.z)\n        mc.setBlock(friend.x, friend.y, friend.z,\
  \ block.DIAMOND_BLOCK.id)\n        time.sleep(0.25)\n    target = friend.clone()\n\
  \    ```\n   当 `for` 循环结束，方块朋友到达了目标，因此将目标设置为方块朋友当前的位置。这样她就不会再次尝试移动。\n4. 在无限循环的末尾添加一个小的延迟，让程序每\
  \ 0.25 秒请求一次玩家的位置：\n   ```python\n   time.sleep(0.25)\n   ```\n5. 运行程序。\n\n方块朋友现在跟随玩家，直到他们之间离得太远。当这种情况发生时，方块朋友会停下来，你的玩家必须回去并站在方块朋友旁边，她才会再次跟随。\n\
