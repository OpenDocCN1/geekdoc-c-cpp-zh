  \n图 3-2 玩家前的 Minecraft 骰子显示了六个石头点。\n\n## 使用 for 循环\n\n使用单个方块构建允许你构建任何喜欢的东西，但这就像在电脑屏幕上手工绘制一幅复杂的画，一次一个点地画。你需要一种重复方块的方法，这样就可以在不增加程序规模的情况下构建更大的结构。\n\
  \n幸运的是，和任何编程语言一样，Python 都有一个名为“循环”的功能。你已经在冒险 2 中通过 `while True:` 游戏循环遇到过循环。循环只是在\
  \ Python 这样的编程语言中多次重复某事的方法。你在这里使用的循环被称为 `for` 循环，有时被称为计数循环，因为它是计数固定的次数。\n\n## 使用\
