  md: "# ## 7.2 Assigning a Value to an Element of an Array\n\nArray initializer is\
    \ a simple way to assign values to the elements of an array when the array is\
    \ created. However, in applications where data is read from a source, like a file\
    \ or database, typically data is read from its source and assigned to the elements\
    \ of an array using a loop, as discussed later.\n\nTo help understand this concept,\
    \ first we look at how to assign a value to an individual element of an array\
    \ by specifying the index of the element. As an example, the statement\n\n```\n\
    ```csharp\ntestScore[2] = 99;\n```\n```\n\nwould assign the value 99 to the third\
    \ element of the array testScore to replace the value 87.\n\nYou also may use\
    \ a variable as the index, as in\n\n```\n```csharp\nint index = 2;\ntestScore[index]\
    \ = 99;  // you may use any valid variable name to represent the index.\n```\n\
    ```\n\nThis method of specifying the index using a variable is used within a loop\
    \ to assign values to every element of an array.\n\n**Step 1-9:** Add the code\
    \ from Figure 7-7 to the Click event handler to change the third test score to\
    \ 99, and the first test score to 89.\n\n# **Figure 7-7:** Changing the values\
    \ of array elements\n\n```\n```csharp\nprivate void btnDemo_Click(object sender,\
    \ EventArgs e)\n{\n    // Create array testScore with default values:\n    //\
    \ int[] testScore = new int[10];\n\n    // Create array testScore using array\
    \ initializer\n    int[] testScore = { 85, 92, 87, 67, 83, 91, 73, 98, 83, 84\
    \ };\n\n    // Change the first test score to 89, and the third test score to\
    \ 99:\n    testScore[0] = 89;\n    testScore[2] = 99;\n}\n```\n```\n\n**Step 1-10:**\
    \ Run the project, and Click the Demo button.\n\n**Step 1-11:** When the program\
    \ breaks, display the Locals window (Debug, Windows, Locals). Expand testScore\
    \ to display the values of the 10 elements of the array. The updated values of\
    \ the array are shown in Figure 7-8."
