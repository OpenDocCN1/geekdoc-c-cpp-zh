  md: '# 6.6 Working with ComboBoxes


    A ComboBox lets the user select an item from a group of items. Consider a modified
    version of the TheaterTicket form that includes a ComboBox to select the name
    of the show, as shown in Figure 6-10. In the modified form, the name of the show
    and the total cost are written to a ListBox. (Typically, in a real-world application,
    the data would be written to a file or database.) It is assumed that the price
    of a ticket depends only on the section, not on the show.


    Figure 6-10: TheaterTicket form with ComboBox


    ![](img/143bad48262566137acc9c41f668a88f_203_0.png)


    # A Set of RadioButtons versus a Single ComboBox


    A ComboBox, as opposed to a set of RadioButtons, is recommended when the list
    is large and/or the list is dynamic. The list is dynamic when the content of the
    list or the number of items in the list is likely to change. In the current example,
    we use a ComboBox because the list of shows is likely to change over time. Similarly,
    to let the user select a month from a list of the 12 months, for example, a ComboBox
    generally is recommended over a set of RadioButtons because the list is large.'
