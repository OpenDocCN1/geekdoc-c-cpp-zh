    # Creating Arrays with Initial Values Other Than Zero: Array Initializer


    An array may be created with initial values other than the default of zeros, using
    array initializer, which is a comma-separated list of values enclosed in braces,
    as in


    ```

    int[] testScore = { 85, 92, 87, 67, 83, 91, 73, 98, 83, 84 };

    ```


    This way of creating an array does not require the key word new, or the type and
    the array size specified on the right side of the = sign. The C# compiler infers
    the array size from the number of data items in the list and creates the array
    just like when the key word is used.


    Alternately, you may split it to two statements as follows:


    ```

    int[] testScore;

    testScore = { 85, 92, 87, 67, 83, 91, 73, 98, 83, 84 };

    ```


    Step 1-7: Comment out the statement int[] testScore = new int[10], and add the
    statement that creates the array using an array initializer instead of the key
    word new, as in Figure 7-5. Put a break at the closing brace of the event handler.


