  md: '12.12 Creating data access objects at runtime using code makes the code more
    flexible, efficient and reusable.


    12.13 Typed data tables contain fields that are of the same type as the fields
    in the database table, and they are created typically at design time. Untyped
    data tables do not contain information on its fields. They are created at runtime.


    12.14 Data bound controls are bound to specific fields in the data table through
    the binding source. So, data on the form is tightly linked to the fields in the
    data table. The current row is automatically displayed in the controls. Unbound
    controls are not directly bound to any field.


