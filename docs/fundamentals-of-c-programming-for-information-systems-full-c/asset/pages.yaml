  md: "# Finding an Item in the List Using the Index\n\nWhen both the ComboBox and\
    \ the List are not sorted (or when both are sorted), both have the product numbers\
    \ stored in the same order because they were added in the same order from the\
    \ Sales.txt file. That means the index of the selected product in the ComboBox\
    \ is the same as the index of the corresponding item in the List. So, the SelectedIndex\
    \ from the ComboBox can be used as the index for the List to find the item.\n\n\
    For example, if you select product number 1014 from the ComboBox, the SelectedIndex\
    \ would be 2, and sales[2] will give you the corresponding array of four quarterly\
    \ sales.\n\nFigure 9-8 shows the code to find the quarterly sales using the SelectedIndex\
    \ from the ComboBox, and find the sum of sales for the four quarters.\n\n# Figure\
    \ 9-8: Code to find an item using the index of the selected item\n\n```\nprivate\
    \ void cboProdNumber_SelectedIndexChanged(object sender, EventArgs e)\n{\n   \
    \ string fmtStr = \"{0,-20}{1,8}\";\n    lstDisplay.Items.Clear();\n    lstDisplay.Items.Add(string.Format(fmtStr,\
    \ \"Product#\", \"Total Sales\"));\n\n    // If both the List and ComboBox are\
    \ not sorted, or if both are sorted, then\n    // you can use the SelectedIndex\
    \ from the ComboBox to find the item from the List:\n    int selectedIndex = cboProdNumber.SelectedIndex;\n\
    \    string[] productSale = sales[selectedIndex];\n\n    // compute total sales\
