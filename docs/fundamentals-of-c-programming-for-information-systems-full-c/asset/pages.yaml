  md: '# 5.4 Passing Arguments by Reference


    Passing arguments by reference allows the called method to change the value of
    arguments in the calling program. This allows the results computed in a method
    to be made available (or returned) to the calling program.


    It should be noted that an alternative way to return values from the called method
    to the calling method is to use a value returning method that does not use reference
    parameters, as discussed in section 5.6. Using value returning methods has some
    advantages, like ease of maintenance, over using reference parameters. However,
    to return multiple values from a method, you cannot use simple variables as parameters;
    you need to use more advanced options like a class, strut, tuple, or array. Class
    and arrays are discussed in later chapters.


    When a variable is passed by reference, the memory location (address or reference)
    of the variable is passed to the parameter so that the argument and the parameter
    access data from the same memory location, as represented below:


    ![](img/143bad48262566137acc9c41f668a88f_172_0.png)


    So, if the value of a parameter is changed within a method, in effect, it is changing
    the value of the corresponding argument.


    Similarly, the value assigned to an argument before calling a method becomes the
    value of the parameter when the method is called. That is, in effect, data can
    be transferred from the calling program to the called method, and also from the
    called method to the calling program.


    Let’s use passing by reference to return the computed training rate from ComputeTrainingRate
    to the calling program, rather than display it in a MessageBox. The modified method
    is shown in Figure 5-15.


    It should be noted that a value returning method, discussed later in Section 5.6,
    is an alternative to passing an argument by reference.


    # Figure 5-15: Passing arguments by reference


    ```

    38

    39    private void ComputeTrainingRate(float restingRate, float age,

    40                                    ref float trainingRate)

    41    {

    42        float maximumRate;

    43        // Compute maximum heart rate:

    44        maximumRate = 220 - age;

    45        // Compute training heart rate

    46        trainingRate = 0.6F * (maximumRate - restingRate) + restingRate;

    47

    48        // Training rate is not displayed; it is returned to the calling method

    49    }

    ```


    In line 40, the key word ref specifies that trainingRate is a reference parameter.
    Note that because trainingRate is declared as a parameter, it is removed from
    the declaration statement within the method. Further, the statement that displays
    training rate in a MessageBox also is removed.'
