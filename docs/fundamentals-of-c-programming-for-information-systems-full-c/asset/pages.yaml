    # Alternate Methods to Get the Column Values


    You also may use the ordinal (the position) of the column, like an index, in place
    of the column name to get the value. Line 65 in Figure 12-69 uses the ordinal,
    2, of the Salary column. The ordinal would be 0 for the first column, 1 for the
    second column, and so on. Salary is the third column in the result set of the
    SQL, so its ordinal is 2. In general, it is more efficient to retrieve data using
    the ordinals. However, this is prone to errors due to using the wrong ordinals.


    Figure 12-69: Alternate methods to get column values


    ```

