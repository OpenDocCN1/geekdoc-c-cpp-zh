  md: '# Chapter 6


    # Graphical User Interface Controls


    This chapter introduces you to graphical user interface (GUI) controls that help
    minimize data entry errors and make it easier for users to interact with a program.


    # Topics


    | 6.1 | Working with ScrollBars | 6.5 | Getting User Input from Controls |

    | 6.2 | Working with CheckBoxes | 6.6 | Working with ComboBoxes |

    | 6.3 | Working with RadioButtons | 6.7 | Working with ListBoxes |

    | 6.4 | Validating Input |  |  |


    To understand the use of GUI controls, consider an application that lets you calculate
    the total price for tickets to a show in a theater. The user interface, shown
    in Figure 6-1, uses a ScrollBar to specify the number of tickets, a set of RadioButtons
    to select the section of the theater and a CheckBox to specify whether the customer
    is a member.


    Figure 6-1: User interface for ticket sales application


    ![](img/143bad48262566137acc9c41f668a88f_191_0.png)


    Next, we look at how to work with each of these controls.


    # 6.1 Working with ScrollBars


    The ScrollBar controls, HScrollBar and VScrollBar, let you select a number between
    two limits determined by the values of the Minimum and Maximum properties. The
    two ScrollBars are essentially the same, except that the VScrooBar lets you scroll
    horizontally, and the VScrollBar lets you scroll vertically. In this section,
    you will use the HScrollBar.


    To select a number, you may move the slider by clicking the arrows at either end
    by clicking the inside area or by dragging the slider. The number selected by
    the user is given by the Value property. However,'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'the selected number is not displayed by the control. Typically, a separate
    Label is used to display the selected value. Table 6-1 shows the important properties
    of HScrollBar.


    # Table 6-1: Properties of HScrollBar


    | Property name | Description |

    | Value | The integer value of the ScrollBar, selected by moving the slider. |

    | Minimum | Lower limit of the range of values. Default is zero. User may specify
    a different limit. |

    | Maximum | Upper limit of the range of values. Default is 100. User may specify
    a different limit. |

    | SmallChange | Amount by which the value changes when the user clicks on one
    of the two arrows. Default is 1. |

    | LargeChange | Amount by which the value changes when the user clicks the ScrollBar
    area on either side of the slider. Default is 1. If LargeChange is greater than
    1, you must increase the Maximum by adding (LargeChange - 1) to Maximum. For example,
    if you want a range of 0 to 20, and LargeChange is 4, then you must set the Maximum
    to 23 (20 + (4-1)). |


    # Tutorial 1: Theater Tickets Sale Application


    In this tutorial, you will create the TheaterTickets form, shown in Figure 6-1,
    to illustrate the use of GUI controls.


    Step 1-1: Create a new project named Ch6_GUIcontrols. Rename the form to TheaterTickets.


    Add an HScrollBar (found in the All Windows Forms group in the Toolbox) to the
    form, and name it hsbNumOfTickets.


    Set Maximum property to 10. It is assumed that purchases of more than 10 tickets
    are processed differently at group rates in a different form.


    Change the value of the Value property from 0, and observe how it affects the
    position of the slider. Make sure you change it back to 0.


    Step 1-2: Run the form. Move the slider to change the value of the ScrollBar by
    clicking the arrows, clicking the ScrollBar area, or dragging the slider. But
    you will not see the value.


    How do you view the value of the ScrollBar?


    # Events of ScrollBars


    There are two important events of the ScrollBar that can be used to display the
    value in a Label: the ValueChanged event and the Scroll event.


    # ValueChanged event


    This event is triggered when the value of a ScrollBar is changed by moving the
    slider manually, and also when the value is changed at runtime by executing code.
    The following code uses the ValueChanged event handler to display the value of
    the ScrollBar in a Label whenever the value changes at runtime:'
