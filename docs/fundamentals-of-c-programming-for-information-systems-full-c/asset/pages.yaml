  md: '# Tutorial 2: Sharing the LoadDictionary Method between Forms


    This tutorial develops the application shown in Figure 11-7, which shares a method
    between two forms.


    Step 2-1: Open the project, Ch11_MultiFormApps2, from the Tutorial_Starts folder.

    The Price.txt file shown in Figure 11-8 is stored in the Debug folder of the current
    project.


    # Figure 11-8: Price.txt file


    "1033", 89.95

    "1009", 21.50

    "1014", 159.00

    "1005", 2.50

    "1001", 55.70

    "1025", 33.45

    "1040", 130.50

    "1035", 109.00


    Step 2-2: Add a class named SharedMethods (select Project, Add Class).

    Add a new method named LoadDictionary that reads the product numbers and prices
    from the text file Price.txt, and load them into a Dictionary<string, float>,
    as shown in Figure 11-9. You may copy the code from Load event handler of DictionaryValueType
    form in Ch9_Collections project.

    Make sure you add the using directive using System.IO;, as shown in line 6, which
    specifies the namespace that contains the StreamReader class.


    # Figure 11-9: Code to add items to the Dictionary


    ```

    6  using System.IO;

    7  namespace Ch11_MultiFormApps2

    8  {

    9      class SharedMethods

    10     {

    11         public static void LoadDictionary(Dictionary<string, float> prices)

    12         {

    13             string currentLine;

    14             string[] fields = new string[2];

    15             //Create StreamReader

    16             StreamReader PriceReader = new StreamReader("Prices.txt");

    17

    18             //Read each line from the file, split and store in an array.

    19             while (PriceReader.EndOfStream == false)

    20             {

    21                 currentLine = PriceReader.ReadLine(); // Read a product# and
    price

    22                 fields = currentLine.Split('',''); // Store in an array

    23                 // Add the key (Prod#) and value (price) to the Dictionary:

    24                 prices.Add(fields[0], float.Parse(fields[1]));

    25             }

    26             PriceReader.Close();

    27         }

    28     }

    29 }

    ```'
