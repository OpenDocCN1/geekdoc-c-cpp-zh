  md: '# KeyValuePair Collection


    Each item in the Dictionary is of KeyValuePair type and is a member of the KeyValuePair
    collection. A KeyValuePair consists of a key and a value. Figure 9-17 shows the
    code to display every key and value using a foreach loop to loop through the collection
    of KeyValuePairs.


    Figure 9-17: Using a KeyValuePair to hold each item from the Dictionary


    ```

    53

    54    private void btnDisplayAll_Click(object sender, EventArgs e)

    55    {

    56        string fmtStr = "{0,-10}{1,8:C}";

    57        lstDisplay.Items.Add(string.Format(fmtStr, "Product#", "Price"));

    58

    59        foreach (KeyValuePair<string, float> kvp in prices)

    60        {

    61            lstDisplay.Items.Add(string.Format(fmtStr, kvp.Key, kvp.Value));

    62        }

    63    }

    ```


    # Line 59: foreach (KeyValuePair<string, float> kvp in prices)


    Each item in the Dictionary is of KeyValuePair type. Line 59 declares variable
    kvp to be of KeyValuePair type, with the key as string type and the value as float
    type. The foreach loop gets each KeyValuePair from prices and assigns it to the
    variable kvp, one at a time.


    # Line 61: lstDisplay.Items.Add(string.Format(fmtStr, kvp.Key, kvp.Value));


    The Key and Value properties of the KeyValuePair type variable, kvp, are used
    to display the key and value in the ListBox, as follows:


    | Product# | Price |

    | "1033" | $89.95 |

    | "1009" | $21.50 |

    | "1014" | $159.00 |

    | "1005" | $2.50 |

    | "1001" | $55.70 |

    | "1025" | $33.45 |


    Step 2-7: Add the code in lines 59–62 from Figure 9-17 to the Click event handler
    of btnDisplayAll. Run the form and test the code.


    # Keys Collection and Values Collection


    The Keys collection is a collection of keys from all items of the Dictionary.
    Similarly, there is a separate Values collection, which is a collection of values
    from all items. Figure 9-18 shows the first few items in the two collections of
    the Dictionary.'
