    # 12.2 Creating Database Objects


    To create the database object, first, you specify the data source—that is, the
    source of data, its type and location. The data source could be a database on
    the local computer or on a server, or a web service or other object.


    Next, you drag the data table to the form to create the controls that display
    the data and objects that bind the controls to the data table.


    # Specifying the Data Source


    You specify the data source using the Data Source Configuration Wizard, which
    in turn generates the data tables and other objects, like the binding source.


