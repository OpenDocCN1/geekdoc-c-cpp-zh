    # Filtering Rows Using the Binding Source


    Filtering involves using the Filter property of the binding source to select rows
    from the data table for display in controls on the form. Section 12.7 discussed
    filtering using data objects created at design time using the wizard. The process
    is the same for untyped data tables. To refresh your memory, the syntax of the
    statement to filter rows from the data table is


    ```

    bindingSource.Filter = "criterion";

    ```


    where bindingSource is the name of the binding source object, and criterion is
    any Boolean expression. Examples of the statement for string and numeric fields
    can be found in Section 12.7.


    In the Employee_Search form, the criterion is that the employee’s DeptNo should
    be equal to the value selected in the cboFilterByDept ComboBox. Figure 12-55 shows
    the code that specifies the criterion.


    Because we want the selected rows to be displayed whenever the user selects a
    DeptNo from the ComboBox, the code is placed in the SelectionChangeCommitted event
    handler of the ComboBox. The SelectionChangeCommitted event is fired when the
    user selects an item from the ComboBox.


    As discussed in Section 12.7, the SelectedIndexChanged event is less suitable
    because it is fired under other conditions, too.


    # Figure 12-55: Filtering using the binding source


    ```

