    # 6.2 Working with CheckBoxes


    A CheckBox is used to let the user select a true or false Boolean value. For example,
    we use a CheckBox in this application for the user to specify whether or not a
    customer is a member. Two commonly used properties of CheckBox are shown in Table
    6-2.


    Table 6-2: Properties of CheckBox


    | Property | Settings of the property | Description |

    | CheckState | Checked | Checking the CheckBox at runtime sets CheckState to Checked.
    |

    |  | UnChecked | Unchecking the CheckBox at runtime sets CheckState to UnChecked.
    This is the default state. |

    |  | Indeterminate | The CheckState can be set to Indeterminate in the design
    window, or by executing code at runtime. Setting this value checks the CheckBox.
    When the user checks (or unchecks) the CheckBox, the CheckState changes to Checked
    (or UnChecked). You may set the CheckBox to Indeterminate state initially, so
    that the code can check whether the user forgot to make a selection. |

    | Checked | True | Indicates that the CheckBox is in the Checked or Indeterminate
    state. |

    |  | False | Indicates that the CheckBox is in the UnChecked state. This is the
    default. |'
