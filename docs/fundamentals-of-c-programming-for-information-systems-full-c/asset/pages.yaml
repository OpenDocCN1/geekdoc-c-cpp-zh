- pgno: 28
  md: '# Figure 1-11: Solution Explorer with autohide on


    ![](img/143bad48262566137acc9c41f668a88f_28_0.png)


    To turn autohide off, click on the tab and click the pushpin.


    # Menu and toolbar items


    The menu and toolbar, shown in Figure 1-12, provide access to an extensive set
    of functions.


    # Figure 1-12: Menu and toolbar


    ![](img/143bad48262566137acc9c41f668a88f_28_1.png)


    The function of each toolbar item is displayed in a ToolTip box when you hover
    the mouse pointer over the item. For a general understanding of the functions,
    you may view the descriptions of the Toolbar items by displaying the Tooltips.
    You will become more familiar with them through the projects in this book.


    # Adding and deleting forms


    You may add a form to the project as follows:


    +   - Select: Project, Add Windows Form. You will see the Add New Item window.

    +   - Make sure Visual C# Items and Windows Forms are selected.

    +   - Type in a name for the form. Click Add.


    To delete a form,


    +   - Right click the name of the file (.cs) in the Solutions window, and select
    Delete.


    Deleting a file deletes the form and all files associated with the form permanently.


    # Excluding a form from the project


    You may exclude a form from the Solution Explorer but still keep the files associated
    with the form, in the project folder, as follows:


    +   - Right click the file name (.cs) in the Solution Explorer, and select Exclude
    from Project.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'To bring back a form that was excluded from the project,


    Select Project, Add Existing Item.


    Select the file (.cs) from the project folder.


    The form will be added to the Solution Explorer.


    # Changing the name and title of a form


    The Name field in the Properties window shows that the current name of the form
    is Form1.


    The Solution Explorer also displays a file named Form1.cs, which is the file that
    contains the code. Expanding this file, by clicking the triangle to its left,
    displays two other files,


    Form1.Designer.cs that contains the generated code representing the design of
    the form and Form1.res that contains additional resources associated with the
    form,


    as shown below:


    ![](img/143bad48262566137acc9c41f668a88f_29_0.png)


    # Guidelines to name a form


    Names of forms (and classes, in general) must start with a letter, and can contain
    only letters, numbers or the underscore character (_). However, the use of the
    underscore character is not recommended.


    The convention in C# is to use the Pascal Case to name forms: The first letter
    of the form name and the first letter of subsequent words, if any, are capitalized,
    as in IceCreamCost and FinancialPlanner.


    Use a meaningful name and avoid using abbreviations or acronyms that are not widely
    recognized. A noun or noun phrase is recommended for a form name, though you will
    find a few form names in this book that violate this guideline.


    Now that you are familiar with the environment, let’s develop the application
    using the default form, Form1, in the project that you created in Step 1-4.


    # Step 1-5: Change the form name and title:


    Right click Form1.cs, and rename it IceCreamCost.cs. Notice that the name of the
    form in the Properties window and the names of all three files under Form1.cs
    are changed.


    The title of the form still remains Form1. To change the title, select the Text
    property of the form in the Properties window and change it to Ice Cream Cost.'
  merge: -1
  img_proc: true
