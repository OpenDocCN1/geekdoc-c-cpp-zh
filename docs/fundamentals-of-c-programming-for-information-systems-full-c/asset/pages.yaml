  md: 'The Boolean variable adding is used to check whether the data in the controls
    is a new record.

    Saving new records into the data table involves the following steps:


    +   - Create a blank DataRow (line 108).

    +   - Copy data from the controls to the DataRow by calling the method, CopyToDataRow
    (line 109). Note that the data table is a collection of rows of the type, DataRow.

    +   - Add the DataRow to the data table (line 111).


    Saving changes to an existing record into the data table also involves three steps:


    +   - Create a variable of DataRowView type that references the current row of
    the binding source (line 121). The binding source rows are of DataRowView type.

    +   - Copy data from the controls to the DataRowView by calling CopyToDataRowView
    (line 123).

    +   - Apply the changes in the DataRowView to the data table using the EndEdit
    method of the binding source (line 124).


    # Figure 12-61: Saving data


    ```

    101    private void btnSave_Click(object sender, EventArgs e)

    102    {

    103        int noOfRecords = 0;

    104        // Save data to the data table:

    105        if (adding == true)    // if it is a new record

    106        {

    107            // Create a blank DataRow by calling the NewRow() method of data
    table.

    108            drEmployee = dtEmployee.NewRow();

    109            CopyToDataRow();    // copy all data, into DataRow

    110            // Add the new DataRow to the Rows collection of the data table

    111            dtEmployee.Rows.Add(drEmployee);

    112

    113            lblRecordNo.Text = (bsEmployee.Position + 1) + " of " + bsEmployee.Count;

    114            adding = false;

    115        }

    116        else // it''s an existing record

    117        {

    118            // Create a DataRowView that references the current row of

    119            // the binding source:

    120            int currentRow = bsEmployee.Position;

    121            drvEmployee = (DataRowView)bsEmployee[currentRow];

    122

    123            CopyToDataRowView();  // Copy data from controls the DataRowView:

    124            bsEmployee.EndEdit();  //Save the DataRowView into data table

    125        }

    126        // Update the database table

    127        noOfRecords = daEmployee.Update(dtEmployee); // Save to database table

    128        MessageBox.Show("Changes saved to database");

    129    }

    ```


    # The EndEdit Method of the Binding Source


    The EndEdit method (line 124) applies the changes in the binding source rows to
    the data table it is linked to. When a binding source row is updated using unbound
    controls, as in the current example, it is important to copy the data from the
    controls into the binding source row, and call the EndEdit method to save the
    changes in the binding source row to the data table.'
