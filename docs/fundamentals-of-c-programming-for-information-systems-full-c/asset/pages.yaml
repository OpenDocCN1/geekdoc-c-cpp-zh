  md: '# 12.12 Command Object and DataReader


    To understand the use of SqlCommand objects and DataReaders, you will create the
    form, Employee_Reader1, shown in Figure 12-65, that performs three different tasks:


    +   1. Find the phone number of an employee by specifying the EmpId. This involves
    using the SqlCommand object to execute an SQL to find a single value.

    +   2. Find the last name, first name and salary by specifying the EmpId. This
    involves using the SqlCommand object to execute an SQL, and using a DataReader
    to access the row retrieved by the SQL.

    +   3. Update the salary.


    # Figure 12-65: Use of SqlCommand and SqlDataReader


    ![](img/143bad48262566137acc9c41f668a88f_415_0.png)


    # Creating the SqlCommand Object


    The SqlCommand object, cmdEmployee, is created from the SqlCommand class, as follows:


    ```

    SqlCommand cmdEmployee = new SqlCommand()

    ```


    where cmdEmployee could be any valid variable name. Because the Command object
    is used in multiple methods on this form, it is created at the class level.


    You need to add the using directive, using System.Data.SqlClient, to specify the
    namespace that contains the class.


    After you create the Command object, you need to specify the connection string
    and the SQL. To specify the connection, you create the SqlConnection object and
    assign it to the Connection property, as shown in line 26 of Figure 12-66. The
    connection string then is stored in the ConnectionString property of the Connection
    object.


    # Figure 12-66: Specifying the connection information


    ```

    20   // Create a SqlCommand object

    21   SqlCommand cmdEmployee = new SqlCommand();

    22

    23   private void Employee_Reader1_Load(object sender, EventArgs e)

    24   {

    25       // Create a Connection object and assign it to the Connection property:

    26       cmdEmployee.Connection = new SqlConnection();

    27       // Specify the connection string for the Connection object

    28       cmdEmployee.Connection.ConnectionString = @"Data Source = (LocalDB)\MSSQLLocalDB;
