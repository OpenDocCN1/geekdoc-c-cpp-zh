  md: '# Appendix C


    # Answers to Review Questions


    # Chapter 1


    1.1 Input: key word(s) that you type in. Process: find web pages related to the
    key word(s) Output: information on related web sites


    1.2 Input: student Id, course number, section number Process: check availability
    of seats, prerequisites and conflicts with other classes; add student to class
    list. Output: student schedule, class list


    1.3 Define the purpose and identify the input, process and output of the program.
    Design and develop the Graphical User Interface (GUI). Identify the components
    and logic of the program. Design and develop files/databases, if any. Write and
    test the program.


    1.4 Syntax error


    1.5 Logic error


    1.6 False. There could be logic errors that produce wrong results


    1.7 Machine Language


    1.8 A complier is a special software that translates programs from a high level
    language to Machine Language or to an intermediate language to create an executable
    program.


    1.9 An interpreter converts each statement in a program to Machine Language and
    runs it without producing an executable program.


    1.10 Microsoft Intermediate Language Assembly is the executable program created
    by the compiler in Visual Studio.


