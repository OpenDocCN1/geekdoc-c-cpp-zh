- pgno: 25
  md: '# 1.3 Visual Studio Environment


    This section introduces the various windows and the environment within Visual
    Studio.


    Figure 1-7 shows the default form named Form1 in the Designer window, the Toolbox
    on the left, and the Solution Explorer window and the Properties window on the
    right.


    The appearance of the form will vary with the version of Visual Studio and Windows
    you use. For example, the title of the form is centered in Windows 8 and 10, whereas
    it is left justified in Windows 7.


    The Designer window allows you to create the user interface by adding controls
    to a form.


    The Toolbox contains the components to build the user interface. The items within
    the Toolbox (e.g., ComboBox, TextBox and Label) are called controls.


    The Solution Explorer window shows the name of the Solution, which is a container
    of projects; the name of the project (or projects, if there are multiple projects);
    and the names of the files within each project. If the name of the Solution is
    not displayed, select


    Tools, Options, Projects and Solutions, General and check Always Show Solution


    The Properties window displays and lets you set the properties of the currently
    selected object in the Designer window. For example, the Name field in the Properties
    window shows that the current name of the form is Form1.


    Select Visual C# from Templates, Other Languages. For the type of application,
    select Windows Forms Application, as shown in Figure 1-6.


    For Name, enter Ch1_IntroProgramming.


    Select the Location, if different from the default folder.


    Leave the CheckBox for Create directory for solution unchecked so that both the
    Project and the Solution will be created in the same folder. (If there are multiple
    Projects within a Solution, it would be better to have separate directories for
    the Solution and Projects.) Note that the default name for the Solution is the
    same as that of the Project.) Click OK.


    The Visual Studio development environment appears, as shown in Figure 1-7.'
  merge: -1
  img_proc: true
