- pgno: 245
  md: '# Sequential Files and Arrays


    Data stored in variables and arrays are lost when the program terminates. Sequential
    Access Files provide a relatively easy way to store data for longer terms in devices
    like hard disks, magnetic tapes and flash drives. This chapter discusses writing
    data into sequential files and reading from files. Further, we look at reading
    data from files into one-dimensional and two-dimensional arrays.


    # Topics


    | 8.1 | Introduction to Text Files | 8.5 | Writing to Text Files |

    | 8.2 | Splitting a Row: Split Method | 8.6 | SaveFileDialog Control |

    | 8.3 | Reading Data from Files into Arrays | 8.7 | Passing Arrays to Methods
    |

    | 8.4 | Additional Methods of Arrays | 8.8 | Two-Dimensional (2-D) Arrays |


    # 8.1 Introduction to Text Files


    In a sequential access file, data are accessed sequentially, starting with the
    first set of data items, followed by successive sets. To find a particular data
    item, you need to go over all data that precedes it, like playing a song on a
    cassette tape. By contrast, data may be accessed directly from a direct access
    (random access) file, similar to playing a song on a CD.


    Sequential files are of two types: text files and binary files. In a text file,
    all data, including numbers and dates, are stored as text. For example, the number
    9.95 is stored as a combination of four characters (three digits and a decimal)
    that forms a string. Hence, text files can be created and edited using a text
    editor like Notepad. Binary files, discussed in Appendix A, store data in its
    original form without converting it to text. The number 9.95 is stored as single
    number using the standard internal representation of numbers.


    # Reading Lines from Text Files


    Typically, text files store each record in a separate line, with the data items
    separated by delimiters like commas, tabs, or the pipe character (|). Because
    text files are sequential access files, data are read sequentially from the beginning
    to the end of the file.


    # Example 1: Reading and Displaying Exam Scores


    Here is an example of a text file that contains the name and two exam scores of
    students:


    +   - Mike Burns, 75, 92

    +   - Cathy Arnold, 86, 95

    +   - Wesley Mathews, 82, 90

    +   - Jerry Luke, 70, 89'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Gina Rodriguez, 77, 88


    You can create such a file in a text editor or using a program. In either case,
    an invisible new line character is inserted automatically at the end of each line.


    Let’s see how you read the above data from a text file, named Exams.txt. You use
    the .txt extension, which is used commonly to indicate that the file contains
    text data.


    A variety of classes are available in the System.IO namespace of Framework Class
    Library to work with files and directories. You use the StreamReader class to
    read data from files. The data in the text file is viewed as a stream of data—hence
    the name StreamReader.


    To read from a text file, you create a StreamReader object using the StreamReader
    class. The statement to create the StreamReader object has the following syntax:


    ```

    StreamReader VariableName = new StreamReader(@"Path and FileName");

    ```


    The new key word creates the StreamReader object to read the specified file, and
    returns a reference to the object. The reference (address) of the object is stored
    in the variable specified on the left side.


    # Specifying the Path for a File


    If no path is specified, the default path, ProjectDirectory\Bin\DeBug, is assumed.
    You do not need to use the prefix @ if no path is specified. If the file is not
    found, an exception is thrown.


    For example, a StreamReader object to read from E:\Csharp\Exams.txt is created
    as follows:


    ```

    StreamReader examsReader = new StreamReader(@"E:\Csharp\Exams.txt");

    ```


    If the file is in the default directory, Bin\Debug, you skip the path:


    ```

    StreamReader examsReader = new StreamReader("Exams.txt");

    ```


    If the file is stored in a folder above the default folder (Bin\Debug), you may
    use the code "..\" for each level. Here are examples:


    +   "..\Exams.txt"—the file Exams.txt is in the Bin folder that is one level above
    the default folder, Debug.


    +   "..\..\Exams.txt"—the file is in the project folder that is two levels above
    the default folder, Debug.


    # Using Directive for System.IO


    Because StreamReader class is in the System.IO namespace, you must add the following
    using directive to the form:


    ```

    using System.IO;

    ```'
