    # 11.4 Closing a Parent Form


    When you close a parent form (a form that creates an instance of another form),
    like ProductsMain, the instances of all other forms that were created in the main
    form also will be closed. This could be a problem in some situations. Let’s look
    at an example.


    # Login Form


    As in many applications, assume that the user needs to enter a valid password
    before accessing the form ProductsMain. We use a form named Login, as shown in
    Figure 11-12, to let the user enter a password.'
