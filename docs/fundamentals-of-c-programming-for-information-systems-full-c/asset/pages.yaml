- pgno: 53
  md: '# 1.10 Formatting and Displaying Output in a Label


    What you see in a Label is the value of its Text property. Earlier in Step 1-10,
    you displayed text in a Label in the Designer window using its Text property.
    Now we look at how to display a text in a Label using code at runtime. To do this,
    you assign the text to the Text property of the Label.


    The statement in line 36,


    ```

    lblCost.Text = cost.ToString("C");

    ```


    displays the value of cost in the Label, lblCost, by assigning it to the Text
    property of lblCost.


    The value of cost, which is a double type, is converted to a string using the
    ToString() method of the variable, described next.


    # Formatting Numbers Using the ToString() Method


    Each numeric data type has a method (program unit) called ToString() that converts
    and formats the number to a string. For example,


    ```

    cost.ToString()

    ```


    would convert the value of cost to a string so that it can be displayed in a Label.


    The ToString() method also allows a format code (string) to be specified, as in


    ```

    cost.ToString("C")

    ```


    where “C” specifies currency format.


    Examples of using additional ToString() format codes are presented in Table 1-7.


    # Table 1-7: ToString() format codes


    | Number | Format string | ToString() would format the number as |

    | 1145.857 | null | 1145.857 |

    | 1145.857 | "C" | $1,145.86 |

    | 1145.857 | "N" | 1,145.86 |

    | 1145.857 | "F" | 1145.86 |

    | 0.156 | "P" | 15.60% |

    | Optionally, you may specify the number of decimal places. Here are some examples:
    |

    | 1145.857 | "C0" | $1,146 |

    | -1145.857 | "C1" | ($1,145.9) |

    | -1145.857 | "N1" | -1,145.9 |

    | 1145 | "N3" | 1,145.000 |

    | Format code for integers only |

    | 157 | "D5" | 00157 |

    | 157 | "D" | 157 |

    | 157 | "D1" | 157 |'
