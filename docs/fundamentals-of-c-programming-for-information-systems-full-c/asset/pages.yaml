    # Finding an Item from the Dictionary


    Unlike a List, the value for an item in a Dictionary can be found by specifying
    the key. In this example, when the user selects a product number from the ComboBox,
    it is used as the key to find the corresponding price.


    Figure 9-16 shows the code to find the price for the selected product number by
    using the product number as the key.


    # Figure 9-16: Code to find the price for a product


    ```

