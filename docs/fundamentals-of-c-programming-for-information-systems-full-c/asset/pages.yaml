    # Adding Code to the Click Event Handlers of the Menu Items Look Up Price and
    Display Products


    Note that the menu item mnuLookUpPrice and the button btnLookUpPrice perform the
    same function of opening the form, LookUpPrice. So, rather than duplicating the
    code in the Click event handlers of both the button and the menu, we will create
    a method named LookUpPrice() and call it from both event handlers.


    # Calling Event Handlers


    You may wonder, why not call the the Click event handler btnLookUp_Click directly
    from the Click event handler mnuLookUpPrice_Click, instead of creating a new method
    and calling it from both event handlers? This is not desireable because if future
