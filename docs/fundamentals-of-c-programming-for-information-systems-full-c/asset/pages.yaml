  md: '# Today versus Now


    The property Today gives today’s date with the default time 12:00:00 AM, whereas
    Now gives today’s date with the current time.


    # Formatting DateTime


    Table 2-8 shows commonly used formatting options for DateTime.


    Table 2-8: Formatting options for DateTime


    | Format | 5/12/2017 will be displayed as |

    |---|---|

    | ToShortDateString | 5/12/2017 |

    | ToLongDateString | Friday, May 12, 2017 |

    | (No Format) | 5/12/2017 12:00:00 AM |

    | ToString | 5/12/2017 12:00:00 AM |


