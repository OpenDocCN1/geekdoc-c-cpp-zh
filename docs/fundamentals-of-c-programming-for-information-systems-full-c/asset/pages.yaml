    Develop a form, Icecream.cs, as shown below:


    ![](img/143bad48262566137acc9c41f668a88f_221_0.png)


    The form must let the user do the following:


    Specify the number of scoops (max three) using a ScrollBar, and display the specified
    number in a Label named lblScoops.


    Select the type of sundae from a list of sundaes (Ice Cream, Custard, Yogurt,
    etc.) displayed in a ComboBox sorted alphabetically. Because the items in this
