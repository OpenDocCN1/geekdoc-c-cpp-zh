  md: 'Note that the line numbers are not part of the code. They are inserted using
    a setting in Visual Studio for ease in reference to a statement (select Tools,
    Options, Text Editor: C# and check Line Numbers).


    Let’s look closely at the statements in this program.


    # Comments


    Line 22: //Compute the total cost for an order of ice cream:


    Lines starting with // are comments for the programmers and are ignored by the
    compiler.


    You may comment multiple lines by placing the lines between /* and */, as in Figure
    1-19.


    # Figure 1-19: Commenting multiple lines


    ```

    22    /*Compute the total cost for an order of icecream

    23      using the formula: cost = unitPrice * NumberOfScoops:

    24      Declare variables to hold input data and computed results*/

    ```


    You may comment out a set of lines by highlighting the lines (drag the mouse pointer
    over them) and then clicking the Toolbar button Comment out the selected lines,
    shown in the following image:


    ![](img/143bad48262566137acc9c41f668a88f_41_0.png)


    The button to the right would uncomment the selected lines.


    # 1.7 Data Types


    Lines 25 and 26 declare variables and specify what types they are:


    +   Line 25: int scoops;

    +   Line 26: double unitPrice, cost;


    In order to understand the above statements and the rest of the program, we will
    take a closer look at data types and variables.


    Data used in a program can be grouped broadly into the following types:


    +   **Integer:** An integer is a whole number (e.g., 255677, -54).

    +   **Nonintegers or reals:** A real number has one or more decimal places (e.g.,
    255677.75; -0.255).

    +   **Text:** Text data include **character** type that consists of an individual
    character (e.g., ''A''; ''B'') and **string** type that consists of a group of
    characters, including alphabetical characters, numeric digits and special characters
    (e.g., "John Smith"; "P410-2023-3180-05").

    +   Notice that a character is enclosed in single quotes, and a string is enclosed
    in double quotes.

    +   **Boolean:** A Boolean has the value true or false.

    +   **Date/Time:** Date and time are enclosed in a pair of pound signs, as in
    #05/25/2016 02:30:00 PM#.'
