  md: '# Adding DeptNo’s to ComboBoxes


    In Section 12.6, which used typed datasets to display values in a ComboBox from
    a data table column, you set the following two properties of the ComboBox at design
    time:


    +   - Set the DataSource property of the ComboBox to the binding source.

    +   - Set the DisplayMember property to the column name.


    In this form, you will set an additional property of the binding source:


    +   - Set the ValueMember property to the column name.


    If an application uses the SelectedValue of the ComboBox, the ValueMember must
    be set to a column name. The ValueMember could be set to a column different from
    the DisplayMember. For example, the Display Member could be the DeptName, and
    the ValueMember could be the DeptNo. That means the DeptNames are displayed in
    the ComboBox, but when the user selects a DeptName, the corresponding DeptNo is
    available through the SelectedValue property of the ComboBox.


    Figure 12-54 shows the code to fill the data table, dtDept, and to add the list
    of DeptNo’s from dtDept to the two ComboBoxes. Note that, as stated earlier, the
    Department table doesn’t need a binding source; so, the DataSouce for the ComboBox
    is set to the data table.


    # Figure 12-54: Code to display DeptNo’s in the ComboBoxes


    ```

    // Fill department data table, dtDept

    string DeptSQLStr = "SELECT DeptNo, DeptName FROM Department";

    daDept = new SqlDataAdapter(DeptSQLStr, connString);

    daDept.Fill(dtDept);


    //Display DeptNo''s from dtDept, in the ComboBox, cboFillByDept:

    cboFillByDept.DataSource = dtDept;

    cboFillByDept.DisplayMember = "DEPTNO";

    cboFillByDept.ValueMember = "DEPTNO";


    //Display DeptNo''s from dtDept, in the ComboBox, cboFilterByDep

    cboFilterByDept.DataSource = dtDept;

    cboFilterByDept.DisplayMember = "DEPTNO";

    cboFilterByDept.ValueMember = "DEPTNO";

    ```


