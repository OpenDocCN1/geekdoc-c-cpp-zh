  md: '# 12.11 Untyped Datasets: Add/Edit/Delete Records


    In this section, you will learn how to add, edit and delete Employee records using
    untyped dataset, data adapter and binding source that are created at runtime using
    code. Compared to using the Add, Save and Delete buttons on the navigation bar
    generated by the wizard, this method gives you more control on validating the
    data and controlling user actions.


    As discussed in the previous section, the SelectCommand property of the data adapter
    is generated when you create the data adapter, and the SQL to select records was
    assigned to the SelectCommand. To add, edit and delete records, you need to generate
    the InsertCommand, UpdateCommand and DeleteCommand properties for the data adapter
    using the SqlCommandBuilder. The following statement builds these commands for
    the data adapter, daEmployee:


    ```

    SqlCommandBuilder commandBuilder = new SqlCommandBuilder(daEmployee)

    ```


    where commandBuilder is any valid variable name.


    The generated commands will have the necessary SQL. For example, the UpdateCommand
    will have the SQL to update the database table.


    You will use the form shown in Figure 12-58 to learn how to develop the code to
    add, edit and delete records using untyped data tables.


    # Figure 12-58: The form to add, edit and delete Employee records


    ![](img/143bad48262566137acc9c41f668a88f_404_0.png)


    A difference in the user interface between the current version of the form and
    previous versions is the use of RadioButtons, rather than a TextBox, to make it
    easy to enter or change an employee’s job position. In addition, a ComboBox is
    used to let the user select a DeptNo from a ComboBox to make it easy to enter
    a DeptNo while adding a new record or changing an existing record.


    The Add button just clears the controls on the form so that you can enter the
    data for a new record and save the data.'
