  md: '# 6.3 Working with RadioButtons


    RadioButtons are used as a group to let the user make a single selection from
    a group of limited options, like selecting a student’s class in college or an
    employee’s title. In this example, we use a set of RadioButtons to let the user
    select a section of the theater for seating:


    ![](img/143bad48262566137acc9c41f668a88f_197_0.png)


    The Checked property of the RadioButton is set to True if it is checked and False
    if it is not checked. At any time, only one RadioButton in a group can be checked.


    You may create multiple groups by adding RadioButtons inside a GroupBox control
    on the form. If no GroupBox is used, all RadioButtons on a form are treated as
    part of a single group, even if they are physically in multiple groups. The GroupBox
    also lets the user move all RadioButtons that are within it, as a group.


    # RadioButtons versus CheckBoxes


    RadioButtons are used when the number of options to choose from is limited (typically
    under 10) and also static (i.e., the number of items in the list does not change).


    # When not to use RadioButtons


    When the selection is true/false or yes/no, the standard practice is to use a
    CheckBox, not two RadioButtons. For example, the following use of RadioButton
    is not recommended:


    ![](img/143bad48262566137acc9c41f668a88f_197_1.png)


    Step 1-9: Add a GroupBox to the form. Change its Text property to Section#.


    Add five RadioButtons inside the GroupBox, as shown:


    ![](img/143bad48262566137acc9c41f668a88f_197_2.png)


    Change the value of Text property of the first four RadioButtons to 1, 2, 3 and
    4, and that of the fifth button to zero.


    Name the first four RadioButtons, rdbSec1, rdbSec2, rdbSec3 and rdbSec4, respectively.
    Name the fifth, rdbDefault, and change its Visible property to False.


    The first four represent four sections of the theater. The fifth button will be
    hidden from the user and is used as the default. It serves two purposes:


    +   1. You can reset (uncheck) all four buttons by checking the fifth button using
    code.

    +   2. If the fifth button is checked, that indicates that the user did not make
    a selection.'
