- pgno: 22
  md: 'Running a program, as described earlier, consists of (1) the compiler translating
    the source code (the project) into Microsoft Intermediate Language Assembly and
    (2) the Common Language Runtime translating the assemblies from Intermediate Language
    to Machine Language and executing the program to produce the output.


    Next, we will look at how to work with Visual Studio to develop C# programs.


    # Review Questions


    +   1.7 What is the only programming language that the CPU can understand?

    +   1.8 What is a compiler?

    +   1.9 What is an interpreter?

    +   1.10 What is Microsoft Intermediate Language Assembly?

    +   1.11 What is the function of Common Language Runtime in Visual Studio?


    # Creating an Application in Visual Studio


    To become familiar with the Visual Studio environment, let’s create an application
    for an ice cream parlor, consisting of a simple Windows form to compute and display
    the cost for an order of ice cream. We will follow the five steps identified earlier
    to develop it:


    # 1. Define the purpose


    Purpose: Compute and display the total cost for an order of ice cream

    Input: Unit price, number of scoops

    Process: Compute total cost

    Total cost: unit price * number of scoops

    Output: Total cost


    # 2. Design and develop the Graphical User Interface (GUI)


    Figure 1-4 presents the design of the form that shows the user interface to let
    the user enter the number of scoops and unit price to display the cost. You will
    create the form in Tutorial 1.


    Figure 1-4: Windows form to compute ice cream cost


    ![](img/143bad48262566137acc9c41f668a88f_22_0.png)'
  merge: -1
  img_proc: true
