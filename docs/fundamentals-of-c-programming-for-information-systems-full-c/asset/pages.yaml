- pgno: 71
  md: '# Chapter 2


    # Data Types


    In Chapter 1, we looked at different types of integer, noninteger (real) and text
    data that are used in programs. There are certain rules you need to follow when
    you mix different types of numbers, like a decimal type and double type, in an
    expression or statement.


    In this chapter, first we look at the differences between different types of numeric
    data and the rules on mixing them. Next, we discuss string type, followed by DateTime
    type.


    # Topics


    | 2.1 Working with Different Numeric Data Types | 2.3 Working with Strings and
    Characters |

    | 2.2 Casting | 2.4 Working with Dates and Times |


    # 2.1 Working with Different Numeric Data Types


    To refresh your memory, Table 2-1 shows commonly used integer types of numbers,
    their sizes and range of values. You are already familiar with the int type that
    you used in Chapter 1.


    # Table 2-1: Integer types


    | C# key word | Size (memory used) | Range of values |

    | sbyte | 8 bits | -128 to 127 |

    | short | 16 bits | -32,768 to 32,767 |

    | int | 32 bits | -2,147,483,648 to 2,147,483,647 |

    | long | 64 bits | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |


    As stated in Chapter 1, there are additional “unsigned” data types, byte, ushort,
    uint and ulong, which can store only positive, but larger, integers with maximum
    size close to double that of signed integers. For example, uint type variables
    can hold values up to 4,294,967,295, whereas the maximum for int type is only
    2,147,483,647. There is also a special integer type, denoted by C# key word char,
    which can represent 65,535 characters from different languages.


    The size shows the memory needed to store the data, and the range shows the range
    of values that can be stored in each type. For integers, larger size also means
    larger range.


    One of the basic rules discussed in the next section is that you cannot store
    a data type with a larger range in a variable of data type with a smaller range
    without explicitly converting the larger type to the smaller type.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'For example, the second statement in the following code is invalid:


    ```

    int count = 150;      //valid; 150 is well within the range for int type

    short recordCount = count;    // Invalid; count is int type, which is larger than
    short type

    ```


    Note that the actual value of count is well within the range of short type, but
    the assignment is still invalid because count is of a larger type than recordCount.
    You will learn how to convert data item of one type to another type in the next
    section.


    Next, we will look at the noninteger types, shown in Table 2-2.


    # Table 2-2: Real types


    | C# key word | Size | Range of values | Precision | How the following number
    may be represented:

    123456789012.345678901234567890 |

    |---|---|---|---|---|

    | float | 32 bits | ±3.4 × 10³⁸ | 7 digits | 0.1234568 x 10¹² |

    | double | 64 bits | ±1.7 × 10³⁰⁸ | 15 digits | 0.123456789012346 x 10¹² |

    | decimal | 128 bits | ±7.9 × 10²⁸ | 28–29 digits | 123456789012345678901234567800
    |


    In addition to size and range, noninteger types have a precision property, with
    float type having only 7 digits of precision.


    It is important to note that although the decimal type uses more memory (i.e.,
    it has a larger size) than float and double, it has a smaller range (10²⁸). Decimals
    also are slower to work with. Hence, decimals are less suited than float and double
    for scientific applications involving extremely large numbers.


    Why does decimal type take more memory although its range is smaller? Decimal
    type uses a method of internal representation that allows exact representation
    of real numbers with higher precision than float and double.


    Although float and double have larger ranges and still take less memory, they
    cannot represent all noninteger numbers exactly (due to the method used by them
    to represent numbers), making them less suitable than decimals for financial calculations.
    For example, you would expect the following calculation to yield a value of 84.83
    for cost:


    ```

    float cost = (float) 4.99 * 17;

    ```


    However, the actual value would be 84.82999. The meaning of “(float)” on the right
    side will be explained later in this section.


    So, decimals are better suited for financial calculations than float and double
    when exact representation of numbers is important.


    The C# types, float and double, use a method of representation called the floating
    point method to approximate a wide range of values to fixed number of significant
    digits. Therefore, float and double also are referred to as floating point types.'
  merge: -1
  img_proc: true
