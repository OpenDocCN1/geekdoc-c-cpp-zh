  md: '# Chapter 11


    # Multi-form Applications and Menus


    So far, we have only looked at forms that work independently without interacting
    with other forms. However, it may be necessary for a form to interact with other
    forms in a variety of ways, including opening/closing another form, accessing
    a control on another form, or sharing data or methods between forms.


    In this chapter, you will learn how to code one form to show another form, access
    controls on another form and share methods between forms. Sharing data between
    forms is not covered here because proper sharing of data involves knowledge of
    additional object oriented programming concepts.


    # Topics


    | 11.1 | Introduction | 11.4 | Closing a Parent Form |

    | 11.2 | Accessing an Existing Form from Another | 11.5 | Menus |

    | 11.3 | Sharing a Method between Multiple Forms | 11.6 | Toolstrips |


    # 11.1 Introduction


    To help understand multi-form applications, consider an application that includes
    a form named FinancialPlanner, very similar to the FinancialPlanner form introduced
    in Chapter 4. Given yearly investments and growth rate, this form determines how
    long it takes for the investment value to reach the target amount. The investment
    value for every year until the value exceeds the target amount is displayed on
    a separate form named DisplayInvestments, as shown in Figure 11-1.


    Figure 11-1: The DisplayInvestment form


    ![](img/143bad48262566137acc9c41f668a88f_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: "# 11.2 Accessing an Existing Form from Another\n\nAccessing a form typically\
    \ involves getting data from controls on the form, or displaying data in controls.\
    \ Before you can access the controls, you need to open the form.\n\n# Opening\
    \ an Existing Form from Another\n\nOpening an existing form involves the following\
    \ steps:\n\n+   1. Declare a variable whose type is the form class you want to\
    \ open. Note that the form you want to open, like DisplayInvestment, is a class.\n\
    +   To declare a variable named displayInvestment of the type, DisplayInvestment\
    \ form, use the following code:\n+   ```\n+   DisplayInvestment displayInvestment;\n\
    +   ```\n+   Note that the variable starts with the lowercase letter “d,” and\
    \ the data type starts with the uppercase letter “D.”\n\n+   2. Create an instance\
    \ of the form (an object) and store the reference to the object in the variable.\n\
    +   For example,\n+   ```\n+   displayInvestment = new DisplayInvestment();\n\
    +   ```\n+   The right side of the equal sign creates the object, whose reference\
    \ is assigned to the variable displayInvestment.\n+   \n+   You may combine the\
    \ statements from steps 1 and 2 as follows:\n+   ```\n+   DisplayInvestment displayInvestment\
    \ = new DisplayInvestment();\n+   ```\n\n+   3. Use the Show() method of the object\
    \ to make it visible.\n+   ```\n+   displayInvestment.Show();\n+   ```\n\n# Accessing\
    \ a Control on Another Form\n\nTo access a control on a form from other forms,\
    \ you need to make the form public. To do this, open the Designer window for the\
    \ form by double clicking the file name in Solution Explorer, as shown in Figure\
    \ 11-2.\n\nFigure 11-2: Opening the Designer window of a form\n\n![](img/143bad48262566137acc9c41f668a88f_332_0.png)\n\
    \nNext, change the control from “Private” to “Public,” as shown in Figure 11-3."
  merge: -1
  img_proc: true
