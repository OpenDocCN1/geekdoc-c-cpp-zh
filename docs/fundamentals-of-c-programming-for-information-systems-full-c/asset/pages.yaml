- pgno: 344
  md: '# Figure 11-12: Login form


    ![](img/143bad48262566137acc9c41f668a88f_344_0.png)


    The user enters a password and clicks the OK button. If the password is valid,
    we want the form ProductsMain to be displayed and the Login form to be closed;
    if not, a message is to be displayed. Cancel should close the Login form.


    If you create and show an instance of the ProductsMain form from the Login form,
    you cannot close the Login form without also closing the ProductsMain form. Closing
    the Login form will automatically close the ProductsMain form.


    So, how do you close the Login form but keep ProductsMain open? You open both
    the Login form and the ProductsMain form from the Main method in Program class,
    as shown in Figure 11-13.


    # Figure 11-13: Main method in Program class


    ```

    9   static class Program

    10  {

    11      static void Main()

    12      {

    13          Application.EnableVisualStyles();

    14          Application.SetCompatibleTextRenderingDefault(false);

    15

    16          Login login = new Login();

    17          login.ShowDialog(); // Open Login form as a dialog box.

    18          // Processing of Main stops till Login form is closed

    19

    20          if (login.DialogResult == DialogResult.OK)

    21              Application.Run(new ProductsMain());

    22      }

    23  }

    ```


    The statements in Lines 16 and 17 create an instance of the Login form and open
    it as a dialog box. So, after the Login form is opened, processing of Main stops
    until the Login is closed. Let’s look at what happens on the Login form. Figure
    11-14 shows the code in the Login form.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Figure 11-14: Code to verify password on the Login form


    ```

    20    private void btnOK_Click(object sender, EventArgs e)

    21    {

    22        if (txtPassword.Text == "Csharp101")

    23        {

    24            this.DialogResult = DialogResult.OK;

    25            this.Close();

    26        }

    27        else

    28        {

    29            MessageBox.Show("Sorry, invalid passwd");

    30            txtPassword.Focus();

    31            txtPassword.SelectAll();

    32        }

    33    }

    34    private void btnCancel_Click(object sender, EventArgs e)

    35    {

    36        this.Close();

    37    }

    ```


    If the user enters the correct password and clicks the OK button on the Login
    form, the DialogResult property of the Login form is assigned the value DialogResult.OK,
    as shown in Line 24 in Figure 11-14, and the form is closed. Processing of Main
    method would continue at line 20, which checks the value of the DialogResult property
    of the Login form.


    If the password is invalid, the user is given the option to re-enter it. If the
    user closes the Login form without entering the correct password, the DialogResult
    property would have the default value DialogResult.Cancel.


    When the Login form is closed, processing of Main continues at line 20 of the
    Main method:

    if (login.DialogResult == DialogResult.OK)

    This statement checks whether the value of DialogResult property of the Login
    form is DialogResult.OK. If it is, the statement in line 21,

    Application.Run(new ProductsMain());

    opens the ProductsMain form.


    Note that the statement Application.Run(new ProductsMain()) may be replaced by
    the following pair of statements:

    ProductsMain ProductsMain = new ProductsMain();

    ProductsMain.ShowDialog();


    In summary, if the user enters a valid password, the ProductsMain form is opened
    by the method Main() rather than by the Login form. So, closing the Login form
    will not have any effect on the ProductsMain form.'
