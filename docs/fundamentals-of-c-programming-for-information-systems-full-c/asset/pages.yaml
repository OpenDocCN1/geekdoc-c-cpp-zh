- pgno: 12
  md: '# Preface


    # Mission of the Text


    Welcome to *Fundamentals of C# Programming for Information Systems*. This book
    teaches the fundamentals of programming in C# to provide a solid foundation to
    build business and other real-world applications. Programming concepts are discussed
    in the context of familiar practical applications that use graphical interfaces.


    # Target Audience


    This book is designed for introductory programming courses in IS/MIS, CIS and
    IT. This book also would fit into a computer science curriculum with an introductory
    course that uses a GUI-based application-oriented approach to teach programming
    concepts. The breadth and depth of coverage makes this book suitable for a two-course
    sequence in programming, particularly when students come to the first course with
    no programming background and a slower pace is desired. An approach in a two-course
    sequence would be to do in-depth coverage of topics like collections, databases,
    object oriented programming, and others presented in later chapters only in the
    second course.


    # Key Features


    A key feature of the book is that programming concepts are introduced in small
    chunks through examples and illustrations accompanied by hands-on tutorials. The
    tutorials, which are interspersed with the concepts, help students apply and explore
    what they learn immediately. Additionally, review questions and exercises within
    the chapters enhance student interest and learning.


    Although the book is written for beginners, it is thorough and concise. Graphical
    illustrations and screenshots are used throughout the book to enhance learning
    for both beginners and experienced students.


    Windows forms are used from the beginning to provide GUI-based as opposed to console-based
    interface.


    This book builds graphical user interfaces and code in the .Net environment using
    Visual Studio. You may use the current free version, Visual Studio Community 2015,
    or the earlier versions, including Visual Studio Express, Visual Studio 2013,
    Visual Studio 2012 and Visual Studio 2010.


    # Supplements


    For Students: Tutorial_Starts.zip file that contains


    +   - Partially completed projects for tutorials

    +   - Data files/databases used in projects


    You may download the Tutorial_Starts.zip file from http://www.prospectpressvt.com/titles/c-sharp-programming/student-resources/'
  merge: -1
  img_proc: true
- pgno: 13
  md: "+   **For Instructors:** Instructor resources include\n+   \n+   - Completed\
    \ tutorials\n+   - PowerPoint slides for all chapters\n+   - Test bank\n+   -\
    \ Partially completed projects for tutorials\n+   - Data files/databases used\
    \ in projects\n+   \n+   To access instructor resources, please complete the request\
    \ form at\n+   [http://www.prospectpressvt.com/faculty-resources/instructors-material/](http://www.prospectpressvt.com/faculty-resources/instructors-material/)\n\
    \n# Installing Visual Studio\n\nYou may download Visual Studio Community 2015\
    \ from the following website:\n\n[https://www.visualstudio.com/downloads/download-visual-studio-vs](https://www.visualstudio.com/downloads/download-visual-studio-vs)\n\
    \nTo install Visual Studio, open the downloaded .exe file and run it.\n\n# Overview\
    \ of the Content and Organization\n\nEvery possible sequence of topics seems to\
    \ put constraints on the quality of illustrative examples and applications that\
    \ can be used in a chapter. The organization of chapters in this book attempts\
    \ to minimize such problems and to enhance the ability to build on prior chapters.\
    \ However, except for the foundational Chapters 1–5, there is significant flexibility\
    \ in choosing specific topics and the depth of coverage. As suggested by the dependencies\
    \ summarized below, there is some flexibility in the sequencing too.\n\nChapters\
    \ 1–5 cover the Visual Studio environment and introductory programming concepts,\
    \ including methods. These chapters, which provide the foundational knowledge,\
    \ should be covered in sequence before other chapters, though certain topics like\
    \ working with dates and times (section 2.4) may be postponed or skipped.\n\n\
    Chapter 6 presents the application of the GUI controls ScrollBars, RadioButtons,\
    \ CheckBoxes, ComboBoxes and ListBoxes.\n\nChapter 7 provides a detailed presentation\
    \ of one-dimensional arrays, and Chapter 8 presents accessing sequential files\
    \ and using arrays in combination with files. Chapter 6 is not a prerequisite\
    \ for Chapters 7 or 8. GUI is presented early on in Chapter 6 to motivate students\
    \ with more interesting graphical interfaces. It should be noted that the comprehensive\
    \ assignment (Assignment 2) specified at the end of Chapter 8 requires the use\
    \ of several GUI controls.\n\nChapter 9 introduces collections, and discusses\
    \ the List and Dictionary collections in more detail. Chapter 8 (“Sequential Files\
    \ and Arrays”) is a prerequisite for this chapter. Because of the close relationship\
    \ between collections and arrays, collections are presented in this book immediately\
    \ following Chapter 8 on arrays.\n\nChapter 10 discusses the application of ListView\
    \ and TabControl. The dependency of this chapter on Chapter 9 (“Collections”)\
    \ is very low. The prerequisite for this chapter includes Chapters 6 and 8.\n\n\
    Chapter 11 presents multiform applications, Menus and ToolStrips. This chapter\
    \ has some dependency on previous chapters, except Chapter 10."
  merge: -1
