    of the following control(s) would you choose?


    +   - A CheckBox

    +   - Two CheckBoxes (one with a “Yes” label and the other with a “No” label)

    +   - A RadioButton

    +   - Two RadioButtons (one with a “Yes” label and the other with a “No” label)

    +   - A TextBox


    # 6.7 Working with ListBoxes


    An important difference between a ComboBox and a ListBox is that the ListBox allows
    the user to select more than one item from the list.


    Table 6-3 presented the commonly used properties and events of ComboBoxes and
    ListBoxes, which included the SelectionMode property that determines whether more
    than one item can be selected from a ListBox. Properties and methods of the Items
    collection, which is an important property of ListBoxes, are presented in Table
    6-4.'
