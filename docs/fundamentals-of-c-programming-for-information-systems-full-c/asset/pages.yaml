  md: '# Appendix A


    # Binary Files


    # A.1 Writing to Binary Files


    The key differences between text files and binary files are


    +   1. Text files store all data as text, whereas binary files store data in its
    original form without converting to text using the standard internal representation
    of numbers, dates, and so on. Therefore, the contents of text files can be viewed
    and edited in a text editor like Notepad, but binary files are not readable in
    a text editor.

    +   2. Data typically is written to text files by combining an entire record into
    a single string and writing it in a separate line using the WriteLine() method
    of StringWriter. Data is written to binary files individually using the Write()
    method of BinaryWriter. Data is not grouped into rows.

    +   3. The StreamWriter object to write data to text files can be created without
    explicitly creating a FileStream object. However, creating a BinaryWriter to write
    data to a binary file requires creating the FileStream object that is used by
    the BinaryWriter, as follows:


    ```

    FileStream variableName = new FileStream("FileName", FileMode);

    StreamWriter variableName = new BinaryWriter(FileStream object);

    ```


    # Example


    ```

    FileStream examsStream = new FileStream("Exams.bin", FileMode.Append);

    StreamWriter examsWriter = new BinaryWriter(examsStream);

    ```


    FileMode.Append: Append specifies that new data is added to existing data. If
    the file doesn’t exist, it will be created.


    FileMode.OpenOrCreate would overwrite existing data when new data is written.
    If the file doesn’t exist, it will be created.


    # Tutorial: Working with Binary Files


    Step A-1: Open the project, Ch8_FilesAndArrays. Open the WriteToBinaryFile form
    that has the same user interface as the WriteToTextFile form that you used in
    Chapter 8. Open the code window. Figure A-1 shows the complete code to write data
    from the TextBoxes to a specified file.


    Step A-2: Add the code in lines 19 and 20, and in lines 30 and 32 from Figure
    A-1. Run the project. Select a folder and enter Exams.bin for file name.


    Step A-3: Enter the name, score1 and score2, for five students as shown below,
    save them, and exit the form:


    |  |  |  |

    |---|---|---|

    | Mike Burns | 75 | 92 |

    | Cathy Arnold | 86 | 95 |

    | Wesley Mathews | 82 | 90 |

    | Jerry Luke | 70 | 89 |

    | Gina Rodriguez | 77 | 94 |'
