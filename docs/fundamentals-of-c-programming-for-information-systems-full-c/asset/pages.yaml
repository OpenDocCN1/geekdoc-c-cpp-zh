  md: "# ReadLine method\n\nThe StreamReader provides a method called ReadLine to\
    \ read the line at the current read position and then advance the position to\
    \ the next line. This method is used within a loop to sequentially read each line\
    \ of data. This is how you would use a loop to read each line and display the\
    \ line in a ListBox named lstDisplay:\n\n```\nstring currentLine;\nwhile (examsReader.EndOfStream\
    \ == false) // or. !examsReader.EndOfStream\n{\n    // Read current line and store\
    \ it in a string variable\n    currentLine = examsReader.ReadLine();\n    lstDisplay.Items.Add(currentLine);\
    \    // Display the line\n}\nexamsReader.Close();\n```\n\n# EndOfStream property\n\
    \nThe EndOfStream property of StreamReader has the value true when the current\
    \ read position is at the end of the file. The header of the while loop in the\
    \ above code, while (examsReader.EndOfStream == false), uses the EndOfStream property\
    \ to terminate the loop when EndOfStream is true. That is, the loop continues\
    \ while EndOfStream is false.\n\nThe statement\n    currentLine = examsReader.ReadLine();\n\
    reads the current line and stores the entire line as a single string in the string\
    \ variable, currentLine. At the end of the first iteration through the loop, the\
    \ string variable currentLine would have the following value: \"Mike Burns, 75,\
    \ 92\"\n\nThus, the loop reads each line, stores it in the string variable currentLine,\
    \ and then displays it to give the output shown in Figure 8-1.\n\n# Figure 8-1:\
    \ Data from the Exams.txt file\n\n```\nMike Burns, 75, 92\nCathy Arnold, 86, 95\n\
    Wesley Mathews, 82, 90\nJerry Luke, 70, 89\nGina Rodriguez, 77, 88\n```"
  merge: -1
  img_proc: true
