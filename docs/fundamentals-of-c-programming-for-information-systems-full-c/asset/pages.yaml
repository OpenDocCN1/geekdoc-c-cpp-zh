    # 12.8 Selecting Records Using the Table Adapter


    In the previous section, you selected records using the Filter property of the
    binding source that controls what is transferred between a data table and the
    form. Another way to select records is to use the table adapter to change the
    SQL language that it uses to transfer data from the database to the dataset. This
    is fundamentally different from using the binding source.


    # Binding Source versus Table Adapter to Select Records


    When you use binding source to filter records, typically the entire data from
    a table(s) is loaded from the database into a data table in memory. The binding
    source is used to help the user select different groups of data to work with.
    After the data are loaded into the data table, any change made to the database
    is not reflected in the data that the user sees. So, the user may not be seeing
    the latest data. Further, large tables consume a large amount of memory. A benefit
    of loading the entire table into memory and then filtering records using the binding
    source is that the database needs to be accessed only once in the beginning, thus
    reducing the network traffic.


    When you use the table adapter, every time the user wants a group of data, it
    is loaded from the database into a data table and displayed on a form. So, each
    time a group of data is loaded, it will include the latest changes. The memory
    usage is lower because only selected records are held in data tables. This also
    means that the database is accessed every time the user requests a group of records.


    Next, we look at the use of the table adapter to select records.'
