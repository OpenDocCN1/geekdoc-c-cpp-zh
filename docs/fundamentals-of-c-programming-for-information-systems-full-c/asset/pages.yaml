    56     unitPrice = float.Parse(showsLVI.SubItems[2].Text);\n57     // gets price\
    \ from SubItems[2].\n58     float totalPrice = numOfTickets * unitPrice;\n59 \
    \    lblAmtDue.Text = totalPrice.ToString(\"C2\");\n60 }\n```"
