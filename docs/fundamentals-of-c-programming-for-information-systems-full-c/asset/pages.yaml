  md: '# 12.7 Selecting a Group of Records Using the Binding Source


    When a table contains a large number of records, it is important to be able to
    look at a group of records, like employees from a department. To understand ways
    to limit the records displayed on a form, let’s take another look at the objects
    (components) that are used in moving data from the database to the form. As shown
    in Figure 12-31, the table adapter controls what is displayed in the data table
    in memory. Similarly, the binding source controls what is displayed on the form
    from the data table.


    Figure 12-31: Relationship between database components


    ![](img/143bad48262566137acc9c41f668a88f_375_0.png)


    Figure 12-31 suggests that there are two ways you can select the records to be
    displayed on a form:


    +   1. Use the binding source to control what is displayed in the controls on
    the form. For example, you may load the entire Employee database table into the
    Employee data table, but filter what is displayed in the controls on a form. You
    use the Filter property of the binding source to do it.

    +   2. Use the table adapter to select a group of records from the database and
    load it into the data table. To do this, you specify the criterion to select records
    using the SQL language.


    In this section, we look at selecting records using the binding source.


    To select records using the binding source, assign the criteria (for selecting
    records) to the Filter property of the binding source. The general syntax is


    ```

    BindingSource.Filter = "criterion";

    ```


    The criterion could be any Boolean expression like


    ```

    "LastName = ''Hope'' AND DeptNo = 2"

    ```


    Here are examples of complete statements:


    ```

    employeeBindingSource.Filter = "LastName = ''Hope''";

    employeeBindingSource.Filter = "Salary > 40000";

    employeeBindingSource.Filter = "DateOfBirth > #01-01-1990#";

    employeeBindingSource.Filter = "FullTime = True";

    ```


    Note that the string data are enclosed in a pair of apostrophes, and Date type
    is enclosed in # signs. If the field is of numeric or Binary type, then do not
    enclose the data in apostrophes.


    The whole criterion must be enclosed in quotes.'
