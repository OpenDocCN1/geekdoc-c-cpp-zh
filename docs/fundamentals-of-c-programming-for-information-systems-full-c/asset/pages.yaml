  md: '# Properties and Events of ComboBoxes


    Table 6-3 shows commonly used properties and events of the ComboBox and ListBox.


    Table 6-3: Commonly used properties and events of ComboBox and ListBox


    | Property | Description |

    |---|---|

    | DropDownStyle | Determines the style and whether user can type in an item that
    is not in the list |

    | Items | The collection of all items in the list |

    | SelectedIndex | The index of the selected item |

    | SelectedItem | The selected item (of object type) |

    | SelectedItems | The collection of selected items in a ListBox |

    | SelectionMode | Determines whether more than one item can be selected from a
    ListBox |

    | Sorted | If set to True, the items in the list are sorted |

    | Text | The text displayed in the ComboBox |

    | Events |  |

    | SelectedIndexChanged | Raised when the user selects an item from the list |


    # The Items collection


    The Items collection is an important property of the ComboBoxes and ListBoxes.
    It has several properties and methods, as shown in Table 6-4.


    Table 6-4: Properties and methods of the Items Collection


    | Property | Description |

    |---|---|

    | Count | Number of items in the list |

    | Item (index) | The item at the specified index |

    | Method |  |

    | Add (object) | Adds the specified item to the list |

    | Clear() | Removes all items from the list |

    | Insert (index, object) | Inserts the specified item at the specified index |

    | Remove (index) | Removes the item at the specified index |

    | Remove (object) | Removes the specified item |


    # Adding items to a ComboBox


    You may add items to the Items collection in Design view using the GUI interface,
    or at runtime using code. Adding items at runtime makes future maintenance of
    the list easier.


    To add items to the ComboBox in Design view, open the Items collection window
    by clicking on the ellipses on the right side of the Items property, as depicted
    in Figure 6-11.


    Figure 6-11: Items collection of ComboBox


    ![](img/143bad48262566137acc9c41f668a88f_204_0.png)'
