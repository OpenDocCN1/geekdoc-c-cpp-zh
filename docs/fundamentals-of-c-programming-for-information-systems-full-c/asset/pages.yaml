    69

    70     // Get Salary in its original type, double

    71     double salary = drEmployee.GetDouble(2);

    72     txtSalary.Text = salary.ToString();

    73

    74     drEmployee.Close();

    75     cmdEmployee.Connection.Close();

    76 }

    ```


    To use meaningful names for ordinals, you may get the ordinal using the column
    names, store it in a variable, and use the variable name in place of the literal
    values. The statement in line 67 uses the GetOrdinal method to get the ordinal,
    and stores it in a variable. Line 68 uses the variable name to get the salary.
    This method would help to minimize errors due to using literal values like 1 or
    2 for ordinals.


    Regardless of the type of fields in the database table, the column values retrieved
    using the above methods are object types. So, they need to be converted to appropriate
    types. For example, if Salary is to be used in calculations, it must be converted
    to a numeric type.


    An alternative is to get values in their original types using methods like GetDouble,
    GetDateTime and GetString, shown in Table 12-1. This approach minimizes the need
    to convert data after it is retrieved. For'
