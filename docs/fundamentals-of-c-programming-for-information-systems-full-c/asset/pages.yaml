  md: '# 8.5 Writing to Text Files


    You can write data to a text file using the StreamWriter class available in the
    System.IO namespace of Framework Class Library.


    # Tutorial 4: Writing Scores to Text File


    Let’s develop a form that writes data from Text Boxes into a text file. Figure
    8-18 shows the form named WriteToTextFile.


    Figure 8-18: The WriteToTextFile form


    ![](img/143bad48262566137acc9c41f668a88f_268_0.png)


    # The StreamWriter Object


    The StreamWriter class can be used to write data into a text file. The StreamWriter
    object is created using the following syntax:


    ```

    StreamWriter VariableName = new StreamWriter(@"Path and FileName", append flag);

    ```


    If append flag is true, data are appended to existing data, if any. If append
    flag is false, existing data, if any, are overwritten. In both cases, if the specified
    file does not exist, a new file is created.


    If no path is specified, it is assumed to be Bin\Debug folder of the project directory.
    The "@" prefix is not needed when the path is not specified. For example, to write
    data to Exams.txt with the append option, the StreamWriter object is created as
    follows:


    ```

    StreamWriter examsWriter = new StreamWriter("Exams.txt", true);

    ```


    # The WriteLine Method of StreamWriter


    The WriteLine method of StreamWriter writes a string as a separate line into a
    file. Use this method to write all three data items for each student into a separate
    line in Exams.txt file.


    # Declaring Variables at the Class Level


    Because data are to be written multiple times (each time when the user clicks
    the Save button) to Exams.txt, you create the StreamWriter once when the form
    is loaded, use it each time the Save button is clicked, and close the StreamWriter
    when the form is closed. That means the variable (ExmasWriter) that references
    StreamWriter is used in three different methods:


    +   - the Load event of the form,

    +   - the Click event of the Save button, and'
