    When the program breaks, you can view the values of all local variables (variables
    declared within a method) by displaying the Locals window (select Debug, windows,
    Locals). You also can move the pointer over each variable to see its value.


    Suppose you inadvertently declared tax rate as int type, which results in truncation
    of the number 5.5 to 5, and the wrong output. Let’s look at how to identify the
    problem.


    Step 1-5: Check the effect of casting a double to int by putting a break in the
    program:

    Change the statement in line 29 to


    ```

    const int TAX_RATE = (int) 5.5;

    ```


    and run the form with 1 scoop and a unit price of 10. The sales tax should be
    0.55 (10 x 0.055), but the output shows 0.50.


    To identify the problem, put a break point at the closing brace “}” on line 45
    by clicking on the margin to the left of the brace. C# inserts a red circle in
    the margin, as shown below:


    ```

    lstOutput.Items.Add(string.Format("{0,12}{1,10:C}", "Total Cost:", totalCost));

    ```


    Run the program. Program execution stops at the brace, indicated by a yellow arrow
    over the red circle.

    Display the Locals window by selecting Debug, Windows, Locals. The Locals window
    appears, as shown in Figure 2-3.


    # Figure 2-3: Locals window


    ![](img/143bad48262566137acc9c41f668a88f_77_0.png)


    Examining the values of variables helps identify that TAX_RATE has the wrong value
    of 5.

    You also may move the pointer over TAX_RATE or any variable to display its value,
    one at a time.


    Click the Continue button on the Toolbar to continue running.


    Close the form, and correct the problem by changing the statement in line 29 back
    to the original form: const decimal TAX_RATE = (decimal) 5.5;


    Next we will use the break to examine the effect of casting a double to float.'
