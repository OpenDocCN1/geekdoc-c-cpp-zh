  md: '# Jagged Arrays


    Jagged arrays are similar to two-dimensional arrays, except that the rows can
    have different lengths. It is a one-dimensional array where each element is an
    array that does not have a fixed size. Figure 8-37 shows an example of a jagged
    array with three rows.


    # Figure 8-37: Jagged array


    Rows

    0 0 1 2 3

    0 16 32 23 40

    1 144 182

    2 54 49 72


    This is how you would create a jagged int type array with three rows:


    ```

    int[][] jaggedSales = new int[3][];

    ```


    Note that the declaration of the variable includes two sets of square brackets,
    indicating that it is an array of arrays. Further, the number of columns is not
    specified.


    You specify the number of columns for each row and the initial values (optional)
    as follows:


    ```

    jaggedSales[0] = new int[4] {16, 32, 23, 40};

    jaggedSales[1] = new int[2] {144, 182};

    jaggedSales[2] = new int[3] {54, 49, 72};

    ```


    You access an element of the array by specifying the row and column index. For
    example, jaggedSales[2][1] has the value 49.


    # Review Question


    8-11 The following code creates a 2-dimensional array, and then displays one element
    of the array in a ListBox named lstDisplay.


    ```

    int[,] sales = {{ 16, 32, 23, 40 }, { 144, 182, 1679, 205 }, { 54, 49, 72, 63
    }};

    lstDisplay.Items.Add(sales[1, 3]);

    ```


    What would be the output displayed in the ListBox, lstDisplay?'
