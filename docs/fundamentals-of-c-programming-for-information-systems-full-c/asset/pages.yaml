  md: '# Figure 4-10: Code for the FinancialPlanner form


    ```

    20    private void btnHowLong_Click(object sender, EventArgs e)

    21    {

    22        // Get input data from Text Boxes:

    23        double yearlyInvestment = double.Parse(txtInvestment.Text);

    24        float YearlyGrowthPercent = float.Parse(txtGrowthRate.Text);

    25        double targetAmt = double.Parse(txtTargetAmt.Text);

    26

    27        // Print heading

    28        string formatCode = "{0,7}{1,20}";

    29        lstDisplay.Items.Add(string.Format(formatCode, "years", "Investment
    Value"));

    30

    31        lstDisplay.Items.Add("");

    32

    33        // Set year and investment value to zero

    34        int year = 0;

    35        double investmentValue = 0;

    36

    37        // Use while loop to compute investment value for each year

    38        while (investmentValue < targetAmt)

    39        {

    40            year = year + 1;    // Increment year by one

    41            investmentValue = (investmentValue + yearlyInvestment) *

    42                            (1+ YearlyGrowthPercent/100);

    43            lstDisplay.Items.Add(string.Format(formatCode, year,

    44                                investmentValue.ToString("C")));

    45        }

    ```


    Let’s focus on the fourth section of the code that uses the while loop.


    The while statement evaluates the Boolean expression (investmentValue < targetAmt).
    If it is true, the statements in the while clause are processed to increment the
    year and compute investment value; if not, control passes to the statement following
    the loop (the right bracket at the end of the method).


    The first time the while statement is processed, investmentValue is zero, and
    the Boolean expression (0 < 500000) is true. So, the statements in the while clause
    are processed to do the following:


    +   - increment year to 1,

    +   - compute the investment value for year 1, using the expression in line 41,
    which yields the value 10,700, and

    +   - display year and investment value.


    The formula that computes investment value is discussed later.


    As the flowchart in Figure 4-9 shows, after processing the last statement in the
    while clause, control automatically passes to the beginning of the loop, where
    the Boolean expression is evaluated using the investmentValue (10,700) computed
    in the first iteration, to start the second iteration.


    In the second iteration, the Boolean expression

    (10700 < 500000)

    is true. So, the statements in the while clause are processed the second time
    to increment year to 2, compute the new investment value (22,149) and display
    it.'
