  md: "# CauseValidation Property\n\nWhen you move focus from one control to another,\
    \ the Validating event for the first control is raised only if the CauseValidation\
    \ property of both controls are true, which is the default.\n\nStep 5-6: Set CauseValidation\
    \ for txtAttendance to False. Run the form, enter an invalid score into txtScore\
    \ and press the Tab key. No message is displayed, indicating that the Validating\
    \ event for txtScore was not raised.\n\nYou can use the CauseValidation property\
    \ to allow users to move away from a control without entering valid data. For\
    \ example, you can let the user close the form without entering valid data by\
    \ clicking the Exit button. To suppress the Validating event when the user moves\
    \ to the Exit button, set the CauseValidation property of the Exit button to false.\n\
    \nStep 5-7: Add a new button, btnExit, and set its CauseValidation property to\
    \ false. Enter the code shown in Figure 3-18 to the click event handler of btnExit.\
    \ Run the form. Enter an invalid score and click the Exit button. No error message\
    \ is displayed because setting CauseValidation of Exit button to false suppresses\
    \ the validating event of the TextBox.\n\nFigure 3-18: Click event handler of\
    \ Exit button\n\n```\nprivate void btnExit_Click(object sender, EventArgs e)\n\
    {\n    Environment.Exit(0); // 0 is an exit code passed to the O.S.\n    // Environment.Exit\
    \ closes all \"threads\"; but this.Close doesn't\n}\n```\n\n# Other Relevant Events\n\
    \nA variety of events are raised when you move from one control to another. These\
    \ include\n\n+   1. Enter\n+   2. GotFocus\n+   3. Leave\n+   4. Validating\n\
    +   5. Validated\n+   6. LostFocus\n\nThe complete code for computing grade in\
    \ GradeWithImmediateValidation form is shown in Figure 3-19."
