  md: '# Chapter 10


    # Graphical User Interface: Additional Controls


    Chapter 5 introduced several controls that make it easy for users to enter data
    and help minimize data entry errors: RadioButton, CheckBox, ScrollBar, ComboBox
    and ListBox. In this chapter, you learn how to use two additional controls that
    help enhance the user interface:


    +   1. The ListView control that allows you to display and work with multiple
    data items in a single row

    +   2. The Tab control that lets you create a form with multiple pages, each page
    with its own set of controls


    Three more user interface controls are introduced in Chapter 11: MenuStrip, ContextMenuStrip
    and ToolStrip controls.


    # Topics


    | 10.1 ListView: Features | 10.3 Accessing Data from ListView |

    | 10.2 Adding Items to ListView | 10.4 Forms with Tab Pages |


    # 10.1 ListView: Features


    A ListView, similar to the ComboBox and ListBox, lets you display multiple rows
    of data, and allows you to select the data from a row. A major difference is that
    ListView lets you add multiple data items to a row, as shown in Figure 10-1, which
    displays the id, name and unit price of each show in a theater using a ListView.
    By contrast, a row in a ComboBox and ListBox consists of only a single string.
    If you want to add multiple data items to a row, you must concatenate them together
    to form a single string, which makes it difficult to access individual data items
    from a row. A ListView lets you directly access an individual data item like the
    ticket price.


    Similar to a ListBox, the ListView lets you select one or more items from a List.
    ListViews also can display items in different formats, including images and CheckBoxes.


    To help understand the use of ListView, let’s look at an application where the
    user selects a show from a ListView named lvwShows by clicking on the corresponding
    row, as shown in Figure 10-1. The total price (extended price) is computed by
    multiplying the unit price from the selected row by the number of tickets from
    the ScrollBar.'
