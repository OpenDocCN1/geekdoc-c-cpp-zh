  md: '# Pretest Loops


    The while loop has a Boolean expression that is checked at the beginning of the
    loop. So, the while loop is called a pretest loop. Because it is a pretest loop,
    if the Boolean expression is false in the very first iteration, the statements
    in the loop will not be processed even once. For example, if investValue is initialized
    to a value greater than 500,000, the statements in the loop will not be processed.


    Step 2-5: Change the initial value of investmentValue (in line 35) to 501,000.
    Run the form. Note that no output is displayed in the ListBox, indicating that
    the statements in the loop were not executed.


    It''s time to practice! Do Exercises 4-1 and 4-2.'
