- pgno: 339
  md: '# Static Methods


    Note that the method LoadDictionary is declared as a static method. A static method
    is not associated with a specific instance (object) of the class. It is associated
    only with the class. So, it is invoked by the class name, followed by the member
    access operator (.) and the method name, as in


    ```

    SharedMethods.LoadDictionary

    ```


    To call a nonstatic method, you have to create an object of the class and use
    the object name in place of the class name.


    # Public Methods


    LoadDictionary is also a public method. Public methods can be called from other
    forms. The LoadDictionary method needs to be called from the forms LookUpPrice
    and DisplayProducts.


    # Passing Dictionary as a Parameter to a Method


    The header of the LoadDictionary method in line 11 declares a parameter (a reference
    variable) named prices that is of Dictionary type, so that prices can be shared
    with the calling program. The rest of the code to read data and load into the
    Dictionary is essentially same as the code in the form DictionaryValueType that
    we discussed in Chapter 9.


    Next, create the two forms that invoke this method.


    The coding for the LookUpPrice form has the following three steps:


    +   1. Declare a variable named prices that references a Dictionary at the class
    level. The variable needs to be declared at the class level so that it can be
    used in the Load event to add product numbers to the ComboBox from the Dictionary,
    and used in the SelectedIndexChanged event of the ComboBox to find the price for
    a selected product.

    +   2. Call the LoadDictionary method (from SharedMethods class) to load data
    into the Dictionary. This is done within the Load event handler of the form. In
    addition, add the product number to the ComboBox.

    +   3. When the user selects a product number from the ComboBox, find the corresponding
    item from the Dictionary. To do this, you use the SelectedIndexChanged event of
    the ComboBox.


    Step 2-3: Add the code from Figure 11-10 to the LookUpPrices form.


    Specify LookUpPrice as the startup form in the Program.cs file. Run the form and
    test the code.'
