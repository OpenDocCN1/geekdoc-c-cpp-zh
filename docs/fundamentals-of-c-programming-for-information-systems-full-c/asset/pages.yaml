- pgno: 182
  md: 'In this design, the main program (the Click event procedure, btnTrainingRate_Click)
    calls the method GetPersonalData as in the top-down design.


    However, the method GetPersonalData gets personal data, and instead of passing
    the data to the main program, it calls ComputeTrainingRate, passing restingRate
    and age to the method.


    ComputeTrainingRate computes the training rate and then calls DisplayResults passing
    restingRate, age and trainingRate to the method.


    DisplayResults displays the results as in the top-down design.


    The above design suffers from several problems:


    +   1. The methods GetPersonalData and ComputeTrainingRate are not cohesive. For
    example, ComputeTrainingRate doesn’t do a single well-defined task. It computes
    training rate and also displays results by calling DisplayResults. Similarly,
    GetPersonalData gets restingRate and age and also computes results by calling
    ComputeTrainingRate.

    +   2. The methods GetPersonalData and ComputeTrainingRate are less reusable.
    For example, ComputeTrainingRate does more than computing the results, and it
    doesn’t return the result to the calling program.

    +   3. It might be necessary to pass certain data to a method where it is not
    needed. For example, if the personal data includes the person’s name, the only
    way it can be passed to DisplayResults is by first passing it to ComputeTrainingRate,
    where it is not needed. Passing data to a method where is not needed makes maintenance
    of code difficult.


    # Review Questions


    5.17 What is top-down design?


    5.18 Describe two benefits of top-down design.'
