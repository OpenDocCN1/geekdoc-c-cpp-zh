- pgno: 16
  md: '# Chapter 1


    # Introduction to Visual Studio and Programming


    Welcome to programming in C# language. In this chapter, you will learn to develop
    simple programs in the Visual Studio development environment, and to work with
    different types of data.


    # Topics


    |  |  |  |  |

    |---|---|---|---|

    | 1.1 Introduction to Programming | 1.8 Working with Variables |  |  |

    | 1.2 Introduction to Visual Studio | 1.9 Doing Calculations |  |  |

    | 1.3 Visual Studio Environment | 1.10 Formatting and Displaying Output in a Label
    |  |  |

    | 1.4 Adding Controls to a Form | 1.11 Additional Concepts: Constants, Scope of
    Variables and ListBox |  |  |

    | 1.5 The Code Editor Window | 1.12 Exception Handling: Catching Errors |  |  |

    | 1.6 Introductory Programming Concepts |  |  |  |

    | 1.7 Data Types |  |  |  |


    # 1.1 Introduction to Programming


    Programming is the process of developing computer programs. If a computer program
    seems like a mystery to you, it is just a set of instructions telling the computer
    how to do a task, like looking up the price of an item or finding the Chinese
    restaurants in a city.


    Unfortunately, computers cannot understand normal English. So, programs have to
    be written using special commands and statements according to strict rules. A
    key aspect of programming is breaking down what you want the computer to do, into
    detailed instructions. Like the directions that a GPS gives you to get to a place,
    the instructions in a program need to be precise.


    Typically, a program uses one or more data items to produce some results. For
    example, a program that processes an order might use the item number and order
    quantity to compute the subtotal, sales tax and total cost, as represented in
    Figure 1-1.


    Figure 1-1: Inputs, process and outputs of a program


    ![](img/143bad48262566137acc9c41f668a88f_16_0.png)


    The program, represented by the block “Process Order,” may include multiple subtasks
    like look up the unit price, check inventory and compute results.'
  merge: -1
  img_proc: true
