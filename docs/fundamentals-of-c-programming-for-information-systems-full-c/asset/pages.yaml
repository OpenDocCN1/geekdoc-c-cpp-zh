  md: '# 12.9 Untyped Datasets: Displaying Records


    As discussed earlier in this chapter, the relationship between database tables
    and controls on a form can be represented by the illustration in Figure 12-43.


    Figure 12-43: Relationship between database tables and controls on a form


    ![](img/143bad48262566137acc9c41f668a88f_385_0.png)


    In the examples presented in previous sections, the data tables and other data
    access objects (data adapter and binding source), which are required to link database
    tables to controls on a form, are generated by the wizard at design time. The
    data types of the fields in the data table are determined at design time based
    on the data type of the corresponding fields in the database table. So, data tables
    created at design time contain fields that are of the same type as the fields
    in the database table; therefore, they are called typed data tables. The datasets
    that contain such tables are called typed datasets.


    Typed datasets make it easy to check mismatch of data types between fields in
    the database table and the data that the application tries to store in those fields.
    However, generating typed datasets and other objects, like the data adapter, at
    design time makes it difficult to reuse the code in other forms or projects because
    the code is tied to objects within a form.


    # Bound versus Unbound Controls


    Previous sections also used data bound controls that are easily generated by the
    wizard when you drag and drop the data table on the form. Data bound controls
    are bound to specific fields in the data table through the binding source. So,
    data on the form is linked tightly to the fields in the data table. The current
    row is displayed automatically in the controls. However, bound controls provide
    less flexibility in working with the data and validating it, compared to unbound
    controls, which are not directly bound to any field.


    Creating objects at runtime using code, rather than at design time using the wizard,
    and displaying data in unbound controls require more code. However, this approach
    makes the code more flexible, efficient and reusable.


    In this section, you learn how to develop applications that use code to create
    the dataset, table adapter and navigation bar at runtime, and display data in
    unbound controls. The datasets that are created at runtime using code are called
    untyped datasets because the data tables do not contain fields whose types are
    defined.'
  merge: -1
  img_proc: true
