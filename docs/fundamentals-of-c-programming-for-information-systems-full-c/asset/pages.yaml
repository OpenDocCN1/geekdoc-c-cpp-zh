- pgno: 78
  md: '# Step 1-6: Insert the following statement in line 39, which is currently blank:


    ```

    float testNumber = 123456789.45F;

    ```


    Run the form. Enter values for scoops and unit price, and click the Compute Total
    button. When the program breaks, hover the pointer over testNumber to view its
    value, 123456792.0, which is different from 123456789.45 due to the lower precision
    (7 digits) of floats compared to doubles. Close the form, and delete the newly
    inserted statement.


    # Rule for Assigning One Variable to Another Variable of a Different Type


    The rule for assigning a variable of one type to a variable of another type is
    essentially the same as the rule for assigning a literal to a variable: You cannot
    store a variable (or constant) of a data type that has a larger range in a variable
    of a data type that has a smaller range. Here are the data types sorted by increasing
    range of values:


    sbyte, short, int, long, decimal, float, double


    The second statement shown below is invalid because price is of double type, which
    has a large range (10^308) compared to decimal (10^28).


    ```

    double price = 25;      // valid; all integer types have ranges smaller than double

    decimal currentPrice = price;  // invalid; double has a larger range than decimal

    ```


    To correct the problem, you need to cast price to decimal as follows:


    ```

    decimal testNumber = (decimal) price;  // valid

    ```


    Except for decimals, data types of smaller range can be stored in data types of
    larger range. Decimal type cannot be stored in float or double (though they have
    large ranges) without explicitly converting it.


    The second statement shown below is invalid because price is of decimal type,
    which cannot be assigned to any other type.


    ```

    decimal price = 45500;      // valid!

    double currenPrice = price;  // invalid

    ```


    Again, to correct the problem, you need to cast price to double, as follows:


    ```

    double currentPrice = (double) price;  // valid

    ```


    Thus, both double and decimal cannot be assigned to any other type without explicit
    conversion.


    # Step 1-7: To observe the role of casting when a variable of larger type is assigned
    to another variable of smaller type, enter the following two statements into the
    click event handler of ComputeTotal button, and note the error in the second statement:


    ```

    decimal price = 2.95m;      // “m” represents decimal

    double testNumber = price;  // invalid

    ```


    To correct the error, cast price to double.


    ```

    double testNumber = (double) price;  // valid

    ```'
