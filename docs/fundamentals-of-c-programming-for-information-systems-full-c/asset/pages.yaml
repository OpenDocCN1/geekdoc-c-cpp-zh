  md: 'Figure 5-16 shows the updated calling program. The call statement now includes
    trainingHeartRate as an argument (line 58).


    # Figure 5-16: Updated calling program


    ```

    50

    51    private void btnTrainingRate_Click(object sender, EventArgs e)

    52    {

    53        float restingHeartRate, age;

    54        // Get resting rate and age from Textboxes:

    55        restingHeartRate = float.Parse(txtRestingRate.Text);

    56        age = float.Parse(txtAge.Text);

    57

    58        // Call ComputeTrainingRate

    59        float trainingHeartRate = 0;

    60        ComputeTrainingRate(restingHeartRate, age, ref trainingHeartRate);

    61        // Display training rate

    62        lstResults.Items.Add(string.Format("{0,20}{1,10}", "Training Heart Rate:",

    63                                    trainingHeartRate.ToString("N0")));

    64    }

    ```


    The key word “ref” in the calling statement in line 60 specifies that the parameter
    is reference type. Note that the name of the argument (trainingHeartRate) is different
    than the name of the parameter (trainingRate).


    An argument passed by reference must be declared in the calling program, and it
    must be set to a value. The argument trainingHeartRate is declared and it is set
    to zero.


    What happens when ComputeTrainingRate is called?


    First, the reference to trainingHeartRate is passed to the parameter trainingRate.
    That means trainingRate will take the value of the argument trainingHeartRate.


    Next, the method assigns the computed value to the parameter trainingRate. Because
    both the argument and the parameter share the same memory location, the computed
    value also is available to the argument trainingHeartRate.


    Thus, passing by reference makes sharing between the calling program and the called
    program like a two-way street, as shown, whereas passing by value is like a one-way
    street.


    ```

    ComputeTrainingRate(restingHeartRate, age, ref trainingHeartRate);


    private void ComputeTrainingRate(float restingRate, float age, ref float trainingRate)

    ```


