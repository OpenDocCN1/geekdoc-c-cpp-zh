    ```


    This doesn’t work when the data displayed on the form are filtered by the binding
    source because the first row of the binding source, for example, may not be the
    first row in the data table.


    # Copying Data from DataRowView to Controls on a Form


    You can access individual fields of the DataRowView using the field name or the
    index of the field. For example, you may get the employee id from the DataRowView,
    drvEmployee, using one of the following two options:


    ```

    drvEmployee["EmpId"].ToString();

    ```


    or


    ```

    drvEmployee[0].ToString();

    ```


    Because records are to be displayed repeatedly when you move from one row to another,
    you will create a separate method named DisplayCurrentRow to copy data from DataRowView
    to controls.


    Figure 12-46 shows the code within the method to store the current row in a DataRowView,
    drvEmployee, and to copy data from the DataRowView to controls on the form.


    Figure 12-46: Displaying data from a data table in controls on a form


    ```

    45  private void DisplayCurrentRow()

    46  {

    47      // store the current row of the data table in a DataRowView

    48      int currentRow = bsEmployee.Position;

    49      DataRowView drvEmployee = (DataRowView) bsEmployee[currentRow];

    50

    51      // copy data from the DataRowView to controls on the form:

    52      txtEmpId.Text = drvEmployee["EmpId"].ToString();

    53      // Or, use the index as in, drvEmployee[0].ToString();

    54      txtFirstName.Text = drvEmployee["FirstName"].ToString();

    55      txtLastName.Text = drvEmployee["LastName"].ToString();

