  md: '# Constants


    Line 29 declares a constant. The key word const in line 29,


    ```

    const double TAX_RATE = 5.5;

    ```


    specifies that TAX_RATE is a constant (not a variable).


    Constants are used to represent literal values that do not have to be changed
    at runtime. The use of a constant for tax rate assumes that the tax rate is a
    fixed value. However, if the tax rate is to be read from a file or a TextBox at
    runtime, a variable would be more appropriate.


    The constant has the following characteristics:


    +   1. The value of a constant cannot be changed at runtime.

    +   The following code that assigns a value to the constant, numberOfScoops, at
    runtime, is invalid:

    +   const int numberOfScoops = 0;

    +   numberOfScoops = 2; // Invalid


    +   2. A constant must be initialized as part of the declaration by assigning
    a literal value or a constant.

    +   For example, the statement,

    +   const int numberOfScoops = int.Parse(txtScoops.Text); // Invalid

    +   is invalid because the value assigned to the constant is not a constant or
    a literal value.

    +   Similarly, the following statement also is invalid because the constant is
    not initialized as part of the declaration:

    +   const int numberOfScoops; // Invalid


    +   3. A constant is replaced by its value at compile time.


    Step 3-3: Double click btnComputeTotal to create its click event handler, and
    add the comments and statements to declare the variables and a constant, as shown
    in Figure 1-26.


