- pgno: 295
  md: '# Table 9-1: Commonly used collections


    | Generic (typed) collections | Corresponding nongeneric (untyped) collections
    | Implementation and other features |

    |---|---|---|

    | List<T>

    T represents the type | ArrayList | Implemented as an array; allows accessing
    items by index. Performance could be slightly lower compared to arrays, but easier
    to use. |

    | Dictionary<TKey, TValue>

    TKey represents the key, and TValue represents the value | Hashtable | Implemented
    as a hash table. Values accessed by key. |

    | SortedList<TKey, TValue> | SortedList | Implemented as two arrays, one for the
    key and another for values; allows access by index, and by key. |

    | SortedDictionary<TKey, TValue> |  | Implemented as a tree. Generally, better
    than SortedList, when

    - adding and removing items into large sets

    - number of items unknown

    - populating from unsorted data |

    | LinkedList<T> |  | A group of nodes, each node consisting of a data item and
    a link to the next node. Efficient to insert items, but inefficient to search.
    |

    | Queue<T> | Queue | A FIFO (first in, first out) list |

    | Stack<T> | Stack | A LIFO (last in, first out) list |


    We will look at two popular unsorted generic collections that have overall good
    performance:


    +   1. List<T>, which does not require a unique key, and

    +   2. Dictionary<TKey, TValue>, which requires a unique key.


    # Review Questions


    9.1 List two features of C# collections that distinguish them from arrays.


    9.2 What is a generic collection?'
