  md: '# Chapter 3


    # Decision Structures and Validation


    The programs presented in Chapters 1 and 2 have simple structures, called **sequence
    structures**, where the statements are processed sequentially, starting with the
    first statement and ending with the last, processing each statement, exactly one
    time. In this chapter, we look at **decision (selection) structure**, which lets
    you execute a block of statements only under certain conditions.


    # Topics


    | 3.1 Flowchart for Decision Structure | 3.4 Nested if Statements |

    | 3.2 if else Statement | 3.5 The switch Statement |

    | 3.3 if else if Statement | 3.6 Data Validation |


    # 3.1 Flowchart for Decision Structure


    As an example of decision structure, consider an updated version of Tutorial 3
    from Chapter 1 to include a 20% discount for orders that are greater than or equal
    to 10 dollars, as shown in Figure 3-1.


    Figure 3-1: The IceCreamTotalDiscounted form


    ![](img/143bad48262566137acc9c41f668a88f_101_0.png)


    Because the discount applies only to orders greater than 10 dollars, the program
    has to check the value of subtotal and select alternate routes depending on the
    value. Such a structure that allows a program to execute one or more statements
    only if a certain condition is true is called a **decision (or selection) structure.**


    A popular graphical tool to represent program logic is a flowchart. The flowchart
    that represents the logic for computing the discount percentage is shown in Figure
    3-2.'
  merge: -1
  img_proc: true
