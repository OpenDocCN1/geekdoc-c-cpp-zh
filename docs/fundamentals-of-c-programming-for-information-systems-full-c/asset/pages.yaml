    |---|---|

    | "dd" | 12 |

    | "ddd" | Fri |

    | "dddd" | Friday |

    | "MM" | 5 |

    | "MMM" | May |

    | "MMMM" | May |

    | "yy" | 17 |

    | "yyyy" | 2017 |

    | "hh" | 02 |

    | "mm" | 30 |

    | "ss" | 00 |'
