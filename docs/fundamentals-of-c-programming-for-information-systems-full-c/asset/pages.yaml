  md: 'Delete both statements. Repeat the process by adding the following statements
    and observing the error:


    ```

    double price = 2.95;

    decimal testNumber = price;    // invalid!

    ```


    To correct the error, cast price to decimal.


    ```

    decimal testNumber = (decimal) price;  // valid

    ```


    # Casting: Narrowing and Widening Conversion


    # Explicit casting and narrowing conversions


    As discussed above, explicit casting is needed when you store a data type with
    a larger range in a data type with a smaller range, and also when you store a
    decimal in other types. Such a conversion is called a narrowing conversion.


    # Implicit casting and widening conversion


    Explicit casting is not needed when storing any data type, other than decimal,
    in another data type that has a larger range.


    Thus, literal or variable of any type other than decimal can be assigned to a
    double type variable without explicit casting. In such cases, C# performs an implicit
    cast to do a widening conversion.


    Consider the following code that assigns the literal 1234567890 of int type (determined
    by the value) to a float type variable, costPerUnit, and then assigns costPerUnit
    to another variable, price.


    ```

    float costPerUnit = 1234567890;      // valid

    double price = costPerUnit;          // valid

    ```


    In the first statement, C# performs an implicit cast from integer to float that
    has a larger range to do widening conversion. The second statement assigns the
    value of costPerUnit, which is float, to unitPrice, which is a double. Again,
    C# performs an implicit cast from float to the larger double.


    Caution! Float has only 7 digits of precision. Hence, the value of costPerUnit
    will have only 7 digits of precision.


    Step 1-8: Make sure that there is break at the closing brace. Add the following
    two statements to the click event handler of Compute Total button, run the program
    and note the value of costPerUnit and price.


    ```

    float costPerUnit = 1234567890;      // valid, but loses precision.

    double price = costPerUnit;          // valid

    ```


    Delete the statements.


    Note that the values of costPerUnit and price are different from 1234567890 due
    to lack of precision for float.'
