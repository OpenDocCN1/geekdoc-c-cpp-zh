  md: "# 3.5 The switch Statement\n\nThe switch statement provides a convenient way\
    \ to branch to one of many paths based on the value of a variable or an expression.\
    \ How does it differ from an if statement with else if clause? Let’s look at the\
    \ code to determine the discount percent for a hotel reservation based on the\
    \ discount type (“AAA,” “Best Rate,” “Government” or “Senior”) for a hotel guest.\n\
    \nHere is the if statement with else if clause to determine the discount:\n\n\
    ```\nfloat discountPercent;\nif (discountType == \"AAA\")\n    discountPercent\
    \ = 10;\nelse if (discountType == \"Best Rate\")\n    discountPercent = 5;\nelse\
    \ if (discountType == \"Government\")\n    discountPercent = 15;\nelse if (discountType\
    \ == \"Senior\")\n    discountPercent = 12.5F;\nelse\n    discountPercent = 0;\n\
    ```\n\nThe corresponding switch statement is\n\n```\nfloat discountPercent;\n\
    switch (discountType)\n{\n    case \"AAA\":\n        discountPercent = 10;\n \
    \       break;\n    case \"Best Rate\":\n        discountPercent = 5;\n      \
    \  break;\n    case \"Senior\":\n        discountPercent = 12.5F;\n        break;\n\
    \    case \"Government\":\n        discountPercent = 15;\n        break;\n   \
    \ default:\n        discountPercent = 0;\n        break;\n}\n```\n\nThe switch\
    \ statement checks the value of the test variable, discountType, and branches\
    \ to one of the first four paths based on its value (“AAA,” “Best Rate,” “Government”\
    \ or “Senior”). If the value does not match any one of the four values, the statement\
    \ under default is processed.\n\nNote that there is a break statement in each\
    \ path, which causes the program to skip the rest of the switch statement. For\
    \ example, if the discountType is “Best Rate,” then the program assigns the value\
    \ 5 to discountRate, and the break statement causes it to skip checking for the\
    \ values “Government” and “Senior” that are specified in the rest of the case\
    \ statements."
