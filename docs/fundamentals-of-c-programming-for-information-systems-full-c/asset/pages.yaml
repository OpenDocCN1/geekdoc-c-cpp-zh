    The complete code for ComputePercent method is shown in Figure 8-28. This method
    reads each student’s name and two exam scores, computes the percent score, stores
    the names in the array referenced by the parameter names and stores the percent
    scores in the array referenced by percentScores.


    # Figure 8-28: The ComputePercent method


    ```

