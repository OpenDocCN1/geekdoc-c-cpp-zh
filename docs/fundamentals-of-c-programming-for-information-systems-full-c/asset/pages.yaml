  md: "# A Set of CheckBoxes versus a Single ListBox\n\nWhen do you use a set of ListBoxes\
    \ rather than a ListBox to select multiple items from a list? Again, the guideline\
    \ is to use a ListBox if the list is large and/or dynamic. A list is dynamic when\
    \ the content of the list or the number of items in the list is likely to change.\
    \ Thus, a ListBox is preferable to select multiple ingredients for a pizza, if\
    \ the list of ingredients is dynamic.\n\n# SelectionMode Property\n\nTo enable\
    \ selection of multiple items, the SelectionMode property shown in Figure 6-21\
    \ needs to be set to MultiSimple or MultiExtended. The two settings are similar,\
    \ except that the MultiExtended setting makes it easier to select a set of consecutive\
    \ items using the shift key.\n\nFigure 6-21: SelectionMode property of ListBox\n\
    \n![](img/143bad48262566137acc9c41f668a88f_214_0.png)\n\nYou already used ListBoxes\
    \ to display output by adding text to the Items collection using the Add method,\
    \ as in\n\n```\nlstDisplay.Items.Add (\"Total Price: \" + lblAmtDue.Text);\n```\n\
    \nSimilar to the ComboBox, the Add method adds a new item to the ListBox.\n\n\
    You also may add a list of items to the ListBox by storing the items in an array\
    \ and then using a loop to add the items to the ListBox. For example, the following\
    \ code stores a list of pizza toppings in an array named toppings, and adds them\
    \ to a ListBox named lstToppings using a foreach loop.\n\n```\nstring[] toppings\
    \ = {\"Pepperoni\", \"Sausage\", \"Onion\", \"Green Pepper\", \"Mushrooms\", \"\
    Xtra Cheese\", \"Ham\", \"Anchovies\"};\nforeach (string topping in toppings)\
    \ // Add toppings to ListBox\n    lstToppings.Items.Add(topping);\n```\n\nTo better\
    \ understand the use of ListBoxes, let’s look at a pizza order form that lets\
    \ the user select the size of pizza and the toppings, compute the total price,\
    \ and display the total price and the toppings selected, as shown in Figure 6-22."
  merge: -1
  img_proc: true
