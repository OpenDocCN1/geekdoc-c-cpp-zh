  md: "# 10.3 Accessing Data from a ListView\n\nYou may access a specific data item\
    \ using the Items and SubItems collections by specifying the index of the item\
    \ (row) and the index of the sub item (column). For example, to access the ticket\
    \ price in the third column (index 2) for “Rock of Ages” in the second row (index\
    \ 1), use the Items and SubItems collections as follows:\n\n```\nlvwShows Items[1].SubItems[2].Text.\n\
    ```\n\n# SelectedItems Collection\n\nSimilar to the ListBox, the ListView has\
    \ the SelectedItems collection that includes all items (rows) selected by the\
    \ user. Each selected item can be accessed using its index:\n\nSelectedItems[0]\
    \ gives the first item (row) selected by the user\nSelectedItems[1] gives the\
    \ second item selected by the user, and so forth.\n\nFor example, the ticket price\
    \ from the single selected row (assuming only one show is selected) is given by\n\
    \n```\nlvwShows.SelectedItems[0].SubItems[2].Text;\n```\n\nIf multiple data items\
    \ from a row are to be accessed, you may copy the entire row to a variable of\
    \ ListViewItem type, and access individual data items from the variable, as follows:\n\
    \n```\nListViewItem showsLVI = lvwShows.SelectedItems[0];\nfloat unitPrice = float.Parse(showsLVI.SubItems[2].Text);\n\
    ```\n\nIn the above code, showsLVI is a variable of ListViewItem type.\n\n# Computing\
    \ the Extended Price for the Selected Show\n\nThe code to compute the extended\
    \ price (number of tickets x ticket price) is given in Figure 10-6.\n\nFigure\
    \ 10-6: Code to get ticket price from selected row and compute extended price\n\
    \n```\n46\n47 private void btnComputePrice_Click(object sender, EventArgs e)\n\
    48 {\n49     float unitPrice = float.Parse(lvwShows.SelectedItems[0].SubItems[2].Text);\n\
    50     // If the CheckBoxes property of the ListView is set to True,\n51     //\
