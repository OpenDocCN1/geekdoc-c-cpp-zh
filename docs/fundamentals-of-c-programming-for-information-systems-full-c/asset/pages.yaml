    # An Undesirable Design Using Noncohesive Methods


    In the top-down design shown in Figure 5-18, the task of computing the training
    heart rate is broken down to three subtasks represented by the methods GetPersonalData,
    ComputeTrainingRate and DisplayResults. These methods are called in sequence by
    a main program (the Click event procedure, btnTrainingRate_Click). Data is shared
    between the calling program and the called program through parameters. As discussed
    earlier in this chapter, such a design makes the methods cohesive and reusable.


    An alternate undesirable design that involves less reusable noncohesive methods
    is shown in Figure 5-23.


    Figure 5-23: Alternate undesirable design involving noncohesive methods


    ![](img/143bad48262566137acc9c41f668a88f_181_1.png)'
