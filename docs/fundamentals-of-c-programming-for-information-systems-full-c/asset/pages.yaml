- pgno: 42
  md: 'Let’s look at the different C# types for integers and reals.


    # Integer types


    Table 1-3 shows the different integer types in C#. Note that C# is case sensitive.
    That means the key words for data types, like short and int, are case sensitive.
    So, “Short” and “Int” are invalid key words.


    Table 1-3: Built-in C# data types for Integers


    | C# key word | Size (memory used) | Range of values |

    | sbyte | 8 bits | -128 to 127 |

    | short | 16 bits | -32,768 to 32,767 |

    | int | 32 bits | -2,147,483,648 to 2,147,483,647 |

    | long | 64 bits | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |

    | char | 16 bits | 0 to 65535 |


    There are additional “unsigned” data types, byte, ushort, uint and ulong, which
    can store only positive, but larger, integers with maximum size close to double
    that of signed integers. For example, uint type variables can hold values up to
    4,294,967,295, whereas the maximum for int type is only 2,147,483,647.


    The size shows the memory needed to store the data, and the range shows the range
    of values that can be stored in the variable. Larger data types take more memory,
    as reflected in the size.


    Note that character data (denoted by the C# key word char) is represented by integers
    using one of the popular standards called Unicode that allows representation of
    65,535 different characters from different languages.


    # C# versus .Net Types


    The names of basic data types in C# are different from those in .Net Framework.
    However, there is direct correspondence between them. For example, int type in
    C# is the same as System.Int32 in .Net, and long in C# is the same as System.Int64.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Noninteger (real) types


    Table 1-4 shows the data types for non-integers.


    # Table 1-4: C# noninteger types


    | C# keyword | Size | Range of values | Precision | How the number 123456789012.345678901234567890
    may be represented |

    |---|---|---|---|---|

    | float | 32 bits | ±1.5 × 10⁻⁴⁵ to ±3.4 × 10³⁸ | 7 digits | 0.1234568 x 10¹²
    |

    | double | 64 bits | ±5.0 × 10⁻³²⁴ to ±1.7 × 10³⁰⁸ | 15 digits | 0.123456789012346
    x 10¹² |

    | decimal | 128 bits | ±1.0 × 10⁻²⁸ to ±7.9 × 10²⁸ | 28-29 digits | 123456789012.345678901234567800
    |


    As indicated by the ranges, float and double can store larger numbers than decimal
    type. They also take less memory. But float and double cannot represent all noninteger
    numbers exactly (due to the method used by them to represent numbers), making
    them less suitable than decimals for financial calculations.


    Decimal type, in general, can represent real numbers exactly, and it has better
    precision than float and double. Hence, as stated earlier, decimal is better suited
    for financial calculations where exact representation is important. However, decimal
    type takes more memory and is slower to work with than float and doubles. Because
    decimal has a lower range, it may not be appropriate for some scientific calculations.


    The C# types, float and double, use a method of representation called floating
    point method to approximate a wide range of values to a fixed number of significant
    digits. Therefore, float and double also are referred to as floating point types.


    # string type


    The C# type string represents a combination of zero or more characters. “John
    Smith” and “P410-2023-3180-05” are examples of string type data. Note that string
    type data is enclosed in quotes.


    # bool type


    The C# type bool represents Boolean data that include the values true and false.


    # DateTime type


    C# doesn’t have a data type for dates and times. The .Net base type DateTime is
    used to represent dates and/or times.'
