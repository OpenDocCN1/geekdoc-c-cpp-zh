    # 1.8 Working with Variables


    Programs typically use variables to hold data. A simple variable holds one piece
    of data, and more complex types like an array can hold a set of data. In general,
    we will use the term “variable” to denote a simple variable.


    A variable is a location in computer memory where it holds data while the program
    is running. The program accesses the location using the name given to the variable.


    For variables, C# requires that you specify what type of data will be stored in
    each variable.


    # Creating (Declaring) Variables


    Variables are created by specifying the type and a name of the variable. The statement
    shown below from Line 25 in Figure 1-18 creates a variable named scoops that is
    of int type:


    ```

    int scoops;

    ```


    When the program is run, the above statement creates a variable named scoops in
    computer memory to hold an int type integer data. Because we haven’t assigned
    any value to scoops, by default, the value zero is stored in the variable, as
    represented below:


    ![](img/143bad48262566137acc9c41f668a88f_44_0.png)


    You may declare two or more variables of the same type in a statement, as in line
    26 in Figure 1-18:


    ```

    double unitPrice, cost;

    ```


    This statement creates two variables, unitPrice and cost, to hold double type
    floating point data.


    Note that a semicolon is required to denote the end of each C# statement.


    # Guidelines for naming variables


    Variable names must start with a letter, and can contain only letters, numbers
    or the underscore “_” character.


    The convention in C# is to use the Camel Case: The first letter of a variable
    is lowercase, and the first letter of subsequent words, if any, are capitalized,
    as in totalCost and averageRetailPrice.'
  merge: -1
