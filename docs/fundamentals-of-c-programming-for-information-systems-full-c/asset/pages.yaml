  md: 'An alternative to using a MessageBox to alert users of data errors is to use
    an **ErrorProvider** control.


    # ErrorProvider Control


    The ErrorProvider indicates an error by placing an error indicator image next
    to the control. Moving the mouse over the image displays the error message as
    a tooltip, as shown in Figure 3-15.


    Figure 3-15: ErrorProvider control with error message


    ![](img/143bad48262566137acc9c41f668a88f_128_0.png)


    Unlike the MessageBox, ErrorProvider can be used to indicate errors on multiple
    TextBoxes simultaneously.


    To use an ErrorProvider, add the ErrorProvider control from the Container group
    in the Toolbox. To indicate error next to a control, use the SetError method of
    the ErrorProvider object, which specifies the control and the error message, as
    in


    ```

    .SetError(controlName, errorMessage);

    ```


    See the code in Figure 3-16 for an example. To remove the image, set the error
    message to a null string.


