- pgno: 33
  md: 'Click the ellipsis (...) to the right of Font property to set the FontSize
    to 10 and the BorderStyle to Fixed3D.

    Change Name property of the TextBox to txtScoops.


    # Step 1-10: Add a Label to display the label, “# of Scoops”:


    Drag and drop a Label and position it to the left of the TextBox.

    Change its AutoSize and Text properties, as follows:


    AutoSize:    False

    Text:        # of Scoops


    # Step 1-11: Add the remaining seven controls and set their properties, as specified
    in Table 1-2:


    Unless specified otherwise, set the FontSize to 10 for all controls, and BorderStyle
    to None for Labels, and Fixed3D for TextBoxes. Note that the only Label that is
