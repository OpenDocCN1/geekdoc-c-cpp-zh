- pgno: 240
  md: '# 7.6 Looking Up Values in an Array


    One-dimensional arrays can be used conveniently to lookup values, like finding
    the price for a specified item or looking up the phone number of a person.


    Consider a string array of names of months and another int array that stores the
    units sold for a product in each month, created as shown in Figure 7-19. It should
    be noted that in real-world applications, such data often are read from a database
    table or file, rather than hard-coded.


    # Figure 7-19: Code to create arrays, months and unitsSold


    ```

    string[] months = { "January", "February", "March", "April", "May", "June", "July",
    "August", "September", "October", "November", "December" };


    int[] unitsSold = { 572, 645, 693, 564, 580, 756, 960, 756, 663, 678, 745, 960
    };

    ```


    To find the units sold in a specified month, first find the index of the month
    from the months array. Then, find the data item stored in unitSold array at that
    index position. This method works only if the months and units sold are stored
    in the same sequence (that is, the first element of unitsSold corresponds to the
    first month in months array, the second element in unitsSold corresponds to second
    element in months array, etc.).


    For example, to find the units sold in March, you find the index of March, which
    is 2, and then find the data item at the index position 2 in unitsSold array,
    which is 693. An easy way to find the index of a specific data item in an array
    is to use the Array.IndexOf method.


    # Array.IndexOf Method


    The Array.IndexOf method returns the index of a specified data item in a 1-D array.


    This method has the syntax


    ```

    Array.IndexOf(ArrayName, SearchValue)

    ```


    For example,


    ```

    Array.IndexOf(months, "March")

    ```


    ArrayName is the name of a 1-D array, and SearchValue is the value you are trying
    to find in an array. The method returns the index of the first element that matches
    the specified value. If no value is found, the method returns -1. Because months
    and units sold are stored in the same sequence, you can use the index of the month
    to find the unitsSold.'
  merge: -1
  img_proc: true
