    # 5.7 Enumerations: Limiting Parameter Values


    An enumeration is a set of named integer constants. For example, Figure 5-26 shows
    an enumeration named CheckState with three named constants, Checked, Indeterminate
    and Unchecked. The statement in Figure 5-26 assigns the selected value (0, 1 or
    2, represented by the three named constants) to the CheckState property of the
    CheckBox.


    # Figure 5-26: Enumeration example


    ```

    chkMember.CheckState = CheckState.

    ```


    ![](img/143bad48262566137acc9c41f668a88f_185_0.png)


    Each name represents an integer. By default, the first name (“Checked”) has the
    value 0; each of the following names has a value one greater than that of the
    previous name. So, in effect, the statement assigns a number (0, 1 or 2) to the
    CheckState property.


    An enumeration provides a convenient way to select from a limited set of numbers.
    In addition, an enumeration uses meaningful names in place of numbers, which helps
    minimize errors in making a selection.


    The syntax to create an enumeration is

    enum enumerationName [: optional integer type] {list of named constants separated
    by commas};


    For example,


    ```

    enum CheckState { Checked, Indeterminate, Unchecked };

    ```


    creates the enumeration CheckState, which is of enumerated type, where the named
    constants represent integer values 0, 1 and 2, respectively.


    An enumeration cannot be declared inside a method. It can be declared inside the
    class, inside the namespace or outside the namespace.


    Though the named constants represent integer values, you need to cast them to
    integer type before assigning to an integer variable, as in


    ```

    int checkState = (int) CheckState.UnChecked;

    ```'
