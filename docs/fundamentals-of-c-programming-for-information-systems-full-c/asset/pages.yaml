  md: 'You need to develop code to do each of the above subtasks.


    # Event-Driven Programs and Event Handlers


    In the .Net environment, code often is connected (“attached” or “wired”) to specific
    events, like clicking a button, loading a form or pressing a key. Therefore, programs
    developed in .Net are called event-driven programs. A method that runs in response
    to an event such as clicking a button is called an event handler.


    For example, to compute cost when the user clicks a button, we create a program
    unit (method) that is connected to the click event of the button. Because the
    method runs in response to the click event, it is called the click event handler
    of the button.


    # Creating event handlers


    Let’s look at how an event handler is created.


    # Step 1-13: Create click event handler method for btnComputeCost:


    Switch back to the Design view by clicking the designer tab, IceCreamCost.cs[Design].


    Double click on the Compute Cost button to reopen the Code window and to create
    the click event handler, shown below:


    ```

    private void btnComputeCost_Click(object sender, EventArgs e)

    {


    }

    ```


    The first line is the header of this method, which shows the method’s name, btnComputeCost_Click.
    The key word private indicates that this event handler method can be accessed
    only from this form, and void means that this method doesn’t return any value
    to the calling program. These terms and the concept of parameters within the parentheses
    are explained in later chapters.


    # Deleting event handlers


    Suppose you created an event handler that you don’t need. For example, you created
    the Click event handler of a button and decided to delete the button. Before you
    delete the button, you need to delete the event handler to avoid an error.


    If you manually delete the event handler method from the code window, you will
    get an error when you try to open the form in the Design window because of the
    reference to the event handler from the generated code. For example, if you create
    the click event handler for btnExit, and delete the code for the event handler,
    you will get the following error message when you try to display the form.'
