  md: '# Referring to an Element in a 2-D Array


    Each element in a 2-D array is referred to by the index of the row and the index
    of the column. Here are some examples:


    sales[0, 0]—the element at row 0 and column 0, with the value 16

    sales[0, 1]—the element at row 0 and column 1, with the value 32

    sales[0, 2]—the element at row 0 and column 2, with the value 23

    ...

    sales[1, 0]—the element at row 1 and column 0, with the value 144

    sales[1, 1]—the element at row 1 and column 1, with the value 182

    sales[1, 2]—the element at row 1 and column 2, with the value 169


    # Example: Using 2-D Arrays for Sales Data


    This example uses the following data that consist of the product number and quarterly
    sales for a set of products:


    1033, 16, 32, 23, 40

    1009, 144, 182, 169, 205

    1014, 54, 49, 72, 63

    1005, 38, 62, 55, 77

    1001, 7, 9, 8, 15

    1025, 98, 110, 105, 130


    The application that process these data use a form that allows the user to specify
    any product number and display the total sales for that product, as shown in Figure
    8-32.


    Figure 8-32: The TwoDimArrays Form


    ![](img/143bad48262566137acc9c41f668a88f_284_0.png)


    In this application, you need to store two types of data. Though the product number
    consists of only numeric digits, it is essentially text data because you do not
    do any numeric calculations with it. The sales data, however, are integers. An
    array has to be of a single type.


    One option would be to create one string type 1D array to store product numbers,
    and another int type 2-D array to store the sales.'
