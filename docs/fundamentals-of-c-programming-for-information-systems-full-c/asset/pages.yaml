    # Deleting Records


    Deleting a record from the database involves two steps:


    +   1. Remove it from the data table using the RemoveCurrent method of the binding
    source.

    +   2. Update the database table using the Update method of the data adapter.


    Figure 12-64 shows the code. The code uses a MessageBox to confirm deletion of
    the record. The MessageBox returns a value of DialogResult type, which is an enumeration.
    The value, which depends on the button selected by the user, is cast to short
    type, and stored in the variable, response. The record is deleted if the value
    of response is the number corresponding to the Yes button.


    Step 6-6: Add the code from Figure 12-64 to the Click event handler of btnDelete.
    Run the form.


    # Figure 12-64: Deleting a record


    ```

    173    private void btnDelete_Click(object sender, EventArgs e)

    174    {

    175        short response = 0;

    176        response = (short)MessageBox.Show("Delete Record? ", "Confirm ",

    177            MessageBoxButtons.YesNo, MessageBoxIcon.Question);

    178        if (response == (short)System.Windows.Forms.DialogResult.Yes)

    179        {

    180            //Remove current record from dataset table

    181            bsEmployee.RemoveCurrent();

    182

    183            //Update the database table with the dataset table

    184            this.daEmployee.Update(dtEmployee);

    185            MessageBox.Show("Record deleted from the database");

    186        }

    187    }

    ```'
