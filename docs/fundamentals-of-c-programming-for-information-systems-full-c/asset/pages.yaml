- pgno: 80
  md: '# Mixing data types in an expression


    When an operation involves two different data types, then the data type with the
    smaller range, except for decimal, is implicitly converted to the larger type,
    and the result would be of the same type as the larger type.


    So, mixing different integer types in an expression, as in the following code,
    is valid:


    ```

    short weight = 60;

    int score = 1000;

    int weightedScore = weight * score; // valid to mix different integer types

    ```


    The short type is implicitly converted to the larger int type.


    Similarly, mixing integer types with a real type like float, double or decimal
    is valid, as in the following code:


    ```

    float weight = 60;

    int score = 1000;

    float weightedScore = weight * score; // valid to mix integer types with any real
    type.

    ```


    Again, the int type is implicitly converted to the larger float type.


    Mixing float and double types also is valid. The float type will be implicitly
    converted to the larger double type.


    ```

    float weight = 60;

    double score = 950.50;

    double weightedScore = weight * score; // valid to mix float with double (and
    integer types)

    ```


    # Decimal type: Again, the troublemaker!


    While mixing float and double types is valid, mixing decimal with float or double
    is invalid. Decimal is not implicitly converted to float or double. Similarly,
    double and float are not implicitly converted to decimal.


    The expression in the following statement is invalid because subTotal is declared
    as decimal, but the literal 5.5 is double:


    ```

    salesTax = subTotal * 5.5 / 100;      // invalid!

    ```


    So, the literal 5.5 must be explicitly converted to decimal, as follows, so that
    the result will be decimal type:


    ```

    salesTax = subTotal * (decimal) 5.5 / 100;

    ```


    or


    ```

    salesTax = subTotal * 5.5m / 100;

    ```


    Caution! Division of an integer by another integer would be an integer, resulting
    in loss of the fractional part, if any. For example, the value of average in the
    following statement would be 2, though average is float type, because division
    of 25 by 10 is represented as an integer:


    ```

    float average = 25/10;  // yields the result 2

    ```'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Casting at least one of the two integers to float type would yield the correct
    result:


    ```

    float average = 25f/10;

    ```


    The result of 25f/10 would be float type, which is the larger of the two types,
    yielding the correct result. 2.5.


    So, when you divide an integer by another integer, at least one of the two must
    be cast to a real type to get the result with the fractional part, if any.


    Step 1-9: Add the following statement to the click event handler of Compute Total
    button, run the program and observe the value of average:


    ```

    float average = 25 / 10;    //yields 2

    ```


    Change the expression to 25f/10f, and see the difference in value (2.5).


    Change the expression to 25f/10, which yields 2.5.


    Delete the statement.


    # Multiplication with large integers


    Multiplication with large integers can result in unexpected consequences:


    ```

    int price = 3000;

    int quantity = 1000000;

    long cost = price * quantity;

    ```


    The product 3000 * 1000000 yields 3 billion. However, because the product of the
    two int types (price * quantity) is represented as int, whose limit is approximately
    2.15 billion, the result is outside the limit and yields incorrect results.


    Step 1-10: Add the following statements, run the program and note the value of
    cost.


    ```

    int price = 3000;

    int quantity = 1000000;

    long cost = price * quantity;

    ```


    Delete the statements.


    The value of cost is incorrect because the result is int type, whose limit is
    about 2.15 billion, which is too small for the result of 3000,000,000 (3 billion).


    # An oddity in C#


    When an operation involves short or sbyte types, these types are automatically
    converted to int type before performing the operation. So, the result will be
    int type.


    ```

    short exam1 = 80;

    sbyte exam2 = 90;

    short total = exam1 + exam2; // Error! The result is int type (odd!), whereas
    total is short type

    ```


    You may cast the result to short, as in


    ```

    short total = (short) (exam1 + exam2);

    ```'
