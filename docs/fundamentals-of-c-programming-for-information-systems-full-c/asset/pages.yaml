- pgno: 83
  md: '# 2.3 Working with Strings and Characters


    In this section, you will learn how to work with string type and character type
    data and variables. The C# type string represents a combination of zero or more
    characters. “John Adams” and “P410-2023-3180-05” are examples of string type data.
    Note that strings are enclosed in quotes.


    # Value and Reference Types


    The integer and real types we discussed in Chapter 1 are called value types because
    each variable of these types holds the actual value t in the memory location for
    that variable.


    By contrast, strings (and other objects like arrays) are called reference types
    because each variable of these types holds only a reference to the data—that is,
    the memory location or address of the data, not the actual data. Reference type
    is discussed later in Chapter 7.


    To understand working with strings, let’s look at an application that creates
    a user name by combining the following three pieces of string type data:


    +   1. First 5 characters of the last name

    +   2. First character of the first name

    +   3. Last two digits of the id


    Figure 2-4 shows the user interface form named UserNameString.


    # Figure 2-4: UserNameString form


    ![](img/143bad48262566137acc9c41f668a88f_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Tutorial 2: String Operations


    This tutorial creates the UserNameString form shown in Figure 2-4. The primary
    objective is to learn string operations.


    Step 2-1: Open the project, Ch2_DataTypes, from Tutorial_Starts folder. Open the
    form, UserNameString. To make it easy to understand the code, the names of controls
    that are used in the code are shown in Table 2-3.


    # Table 2-3: Controls on the form, UserNameString


    | Purpose | Type of control | Property | Setting |

    | Enter last name | TextBox | Name | txtLname |

    | Enter first name | TextBox | Name | txtFname |

    | Enter id | TextBox | Name | txtId |

    | Create user name | Button | Name | btnUserName |

    | Display user name | Label | Name | lblUserName |


    Figure 2-5 shows the code to create the user name.


    # Figure 2-5: Code to create the user name


    ```

    20  private void btnUserName_Click(object sender, EventArgs e)

    21  {

    22      string lName = txtLname.Text;  // Get input data

    23      string fName = txtFname.Text.Trim();

    24      string id = txtId.Text.Trim();

    25      string userName;

    26      // Combine three strings to get the user name

    27      userName = lName.Substring(0, 5).ToLower() + fName.Substring(0, 1).ToLower()
    +

    28                  id.Substring((id.Length - 2), 2);

    29      // Alternate way using the Concat method;

    30      userName = string.Concat(lName.Substring(0, 5).ToLower(), fName.Substring(0,
    1).ToLower(),

    31                  id.Substring((id.Length - 2), 2));

    32      lblUserName.Text = userName;

    33  }

    ```


    Let’s take a look at what the statements do.


    Lines 22-24 get the input data from TextBoxes and save the data in variables.


    Line 27 extracts the required substrings from the last name, first name and id;
    converts them to lowercase; and combines them to form the user name.


    The string type has a large number of methods and properties to help work with
    strings. We first look at the methods/properties used in the above program.'
