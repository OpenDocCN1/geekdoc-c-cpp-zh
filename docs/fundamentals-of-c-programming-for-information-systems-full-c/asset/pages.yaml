    \ called restingRate.\n\n# Passing by reference versus class level variables\n\
    \nThe GetPersonalData method illustrates how multiple values (restingHeartRate\
    \ and age) may be passed from the called method to the calling method using refrence\
    \ parameters. An alternate way to share data between the two methods is to declare\
    \ the variables restingHeartRate and age at the class level, and not specify any\
    \ parameters for GetPersonalData method. It should be noted that the values of\
    \ such class level variables can be inadvertently changed by any method like ComputeTrainingRate.\n\
    \n# out parameter instead of ref parameter\n\nBecause data is to be passed from\
    \ GetPersonalData to the calling program, and not from the calling program to\
    \ GetPersonalData, out arguments may be used in place of ref arguments, as shown\
    \ in the following statement:\n\n```\nprivate void GetPersonalData(out float restingRate,\
    \ out float age)\n```\n\nIn this case, the arguments in the calling program do\
    \ not have to be initialized, and the key word ref is replaced by out in the call\
    \ statement:\n\n```\nfloat restingHeartRate, age;\nGetPersonalData(out restingHeartRate,\
    \ out age);\n```\n\n# Method to Compute Training Rate\n\nYou already developed\
    \ the method to compute training rate in Tutorial 1. Figure 5-21 shows the method.\n\
    \n# Figure 5-21: ComputeTrainingRate method\n\n```\nprivate void ComputeTrainingRate(float\
