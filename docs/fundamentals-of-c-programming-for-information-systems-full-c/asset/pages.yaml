  md: "# Figure 7-14: Using foreach loop to compute the average\n\n```\nint totalScore\
    \ = 0;\nlstDisplay.Items.Add(\"Score\");\nforeach (int score in testScore)\n{\n\
    \    lstDisplay.Items.Add(score);\n    totalScore = totalScore + score;\n}\nfloat\
    \ averageScore = (float)totalScore / testScore.Length;\nlstDisplay.Items.Add(\"\
    Average: \" + averageScore.ToString(\"N\"));\n```\n\n# General syntax of foreach\
    \ loop\n\n```\nForeach (Type VariableName in ArrayName)\n{\n    Statements\n}\n\
    ```\n\n**Step 1-22:** Comment out the code that uses the for loop to compute the\
    \ average (lines 31–41 in Figure 7-12) and add the code from Figure 7-14, which\
    \ uses a foreach loop.\n\n**Step 1-23:** Run the project and test the code.\n\n\
    # Should Array Names Be Singular or Plural?\n\nShould the name of an array be\
    \ singular like testScore or plural like testScores? Because an array holds multiple\
    \ data items, the plural form might make more intuitive sense. When you use a\
    \ foreach loop to access each element of the array, as in the following code,\
    \ it is convenient to use the plural form (testScores) for the array and the singular\
    \ form (testScore) for the variable representing an individual score:\n\n```\n\
    foreach (int testScore in testScores)\n    lstDisplay.Items.Add(testScore);\n\
    ```\n\nHowever, when you refer to an individual score using the index, the singular\
    \ form of the noun makes more sense. For example, testScore[1] might be a clearer\
    \ representation of a single score than testScores[1]. In addition, the singular\
    \ form of the noun makes more sense in certain advanced uses of arrays. In this\
    \ book, we use both forms.\n\n# Review Question\n\n**7.10**  Use a **foreach**\
    \ loop to display all elements of the following array, to a ListBox named lstDisplay:\n\
    \n```\nstring[] weekDay = {\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\"\
    , \"Sat\"};\n```"
