  md: "# Figure 6-19: Code to write the name of the show and price\n\n```\n105 private\
    \ void btnWriteSales_Click(object sender, EventArgs e)\n106 {\n107     if (cboShow.SelectedIndex\
    \ == -1)\n108     {\n109         MessageBox.Show(\"Please select a show\");\n\
    110         return;\n111     }\n112     if (amtDue == 0)\n113     {\n114     \
    \    MessageBox.Show(\"Please compute amount\");\n115         return;\n116   \
    \  }\n117     string fmtStr = \"{0,-25}{1,12:C}\";\n118     lstDisplay.Items.Clear();\n\
    119     lstDisplay.Items.Add(String.Format(fmtStr, \"Show\", \"Total Price\"));\n\
    120     lstDisplay.Items.Add(String.Format(fmtStr, cboShow.SelectedItem, amtDue));\n\
    121 }\n```\n\nThe two key statements related to the ComboBox are lines 107 and\
    \ 120:\n\nLine 107 checks whether the value of SelectedIndex is -1—that is, the\
    \ user did not select a show.\n\nLine 120 displays the name of the show, given\
    \ by the SelectedItem property, and the price given by amtDue.\n\n# SelectedText\
    \ Property\n\nComboBox also has a property called SelectedText. Like the SelectedItem\
    \ property, the SelectedText property gives the name of the item selected by the\
    \ user. However, if you select an item in a ComboBox and move focus away from\
    \ the ComboBox by clicking a button, for example, the value of the SelectedText\
    \ property in the Click event handler of the button will be an empty string. This\
    \ is because the selection is cleared when the focus is moved away. Similarly,\
    \ the SelectedText will be an empty string also within the SelectedIndexChanged\
    \ and SelectedValueChanged event handlers (discussed later in this section) because\
    \ at the time of these events, the selected value has not yet been set. So, the\
    \ SelectedText property is not suitable to get the selected item from an event\
    \ handler.\n\n# Accessing Items from the Items Collection\n\nAny item in the collection\
    \ of items in a ComboBox may be accessed using its index number. For example,\n\
    \n+   cboShow.Items[0] gives the first item in the list, and\n+   cboShow.Items[1]\
    \ gives the second item in the list.\n\nTo access every item in a ComboBox, you\
    \ may use a loop to vary the index over the entire range, as shown below:\n\n\
    ```\nfor (int index=0; index < cboShow.Items.Count; index++)\n    lstDisplay.Items.Add\
    \ (cboShow.Items[index]);\n```\n\nIn the above code, cboShow.Items.Count property\
    \ gives the number of items in the Items collection. Because the index starts\
    \ at zero, the index of the last item is one less than the count of items."
