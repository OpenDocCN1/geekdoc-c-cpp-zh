- pgno: 234
  md: "# 7.4 Accessing Elements of an Array Using the foreach Loop\n\nAn alternative\
    \ to using the for loop to access each element of an array is to use the foreach\
    \ loop. In general, using the foreach loop is a convenient way to access individual\
    \ items from any collection of items. This is how you would use a foreach loop\
    \ to display each test score:\n\n```\nforeach (int score in testScore)\n    lstDisplay.Items.Add(score);\n\
    ```\n\nIn each iteration, the foreach loop would automatically copy the next element\
    \ of the array into the iteration variable score, starting with the first element.\
    \ Thus, the first time through the loop, score is assigned the first element (89)\
    \ and it is displayed in the ListBox; the second time, score is assigned the second\
    \ element (92); and the process continues until all scores are displayed.\n\n\
    Compare the foreach loop to the for loop introduced earlier:\n\n```\nfor (int\
    \ index = 0; index <= testScore.Length-1; index = index + 1)\n    lstDisplay.Items.Add(index\
    \ + \"    \" + testScore[index]);\n```\n\nNote that when using the foreach loop,\
    \ there is no need to initialize a loop variable, increment it and specify the\
    \ upper limit because it is not necessary to specify the index to access an element.\
    \ Because no loop variable is used in the foreach loop, the output from the foreach\
    \ loop, shown in Figure 7-13, does not include the value of the index.\n\nFigure\
    \ 7-13: Displaying each score using foreach loop\n\n![](img/143bad48262566137acc9c41f668a88f_234_0.png)\n\
    \n# for versus foreach\n\nCompared to the foreach loop, the for loop, in general,\
    \ provides more flexibility in working with the elements. Within a for loop, you\
    \ also may assign a value to an element of the array, and you can conveniently\
    \ work with multiple arrays of the same size.\n\nIf the application requires accessing\
    \ the elements of a single array sequentially without having to modify them, then\
    \ it is mostly a matter of personal preference.\n\nNow, let’s modify the foreach\
    \ loop, as shown in Figure 7-14, to compute the total score, and then compute\
    \ the average."
  merge: -1
  img_proc: true
