  md: '# 8.8 Two-Dimensional (2-D) Arrays


    A one-dimensional (1-D) array stores one set of data. A two-dimensional (2-D)
    array can store multiple sets of data, all of the same type. For example, the
    units sold in each quarter of a year for six different products could be stored
    in a 2-D array with 6 rows and 4 columns, where each cell represents an element
    of the array. Each row would represent a different product, and each column a
    different quarter, as shown in Figure 8-31.


    # Figure 8-31: A 2-D array


    Columns (Quarters)

    index 0 (qtr 1) 1(qtr 2) 2(qtr 3) 3(qtr 4)

    Rows (Products) 0

    1

    2

    3

    4

    5


    # Creating a 2-D Array


    The syntax for creating a 2-D array is


    ```

    type [,] arrayName = new type [rowCount, columnCount]

    ```


    where rowCount is the number of rows and columnCount is the number of columns.
    Note that the declaration of variables that represent a 2-D array requires a comma
    inside the pair of square brackets.


    The following statement creates an int type array, called sales, that has 6 rows
    and 4 columns:


    ```

    int[,] sales = new int[6, 4];

    ```


    # Creating a 2-D Array with Initial Values


    You may use the array initializer to create a 2-D array with initial values other
    than zero by specifying each set of values within curly braces, as shown below.


    ```

    int[,] sales = { {16, 32, 23, 40}, {144, 182, 169, 205}, {54, 49, 72, 63} }

    ```


    The previous statement creates the following 2-D array, named sales, with 3 rows
    and 4 columns.


    Columns

    0 1 2 3

    Rows 0 16 32 23 40

    1 144 182 169 205

    2 54 49 72 63'
