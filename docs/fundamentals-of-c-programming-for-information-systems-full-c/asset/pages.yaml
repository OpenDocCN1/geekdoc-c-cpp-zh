  md: '# 12.4 Accessing Data Items from a DataGridView


    In addition to viewing and editing database tables, you can access individual
    data items using the properties and events of the DataGridView. Figure 12-18 shows
    some of the major properties and events of the DataGridView.


    Figure 12-18: Properties and events of DataGridView


    | Property | Description |

    |---|---|

    | ColumnCount | The number of columns. |

    | Columns | Collection of all columns. |

    | CurrentRow | Row containing the current cell. Each row consists of a collection
    of cells represented by the Cells collection. |

    | CurrentCell | Current cell. The Value property gives the value of a cell. |

    | Enable Adding (Editing, Deleting) - This is an item in the task panel that is
    displayed when you click the arrow (smart tag) at the upper right corner. | When
    checked, user can add (edit, delete) columns. By default, it is checked. |

    | RowCount | The number of rows, including the row for new records. |

    | Rows | Collection of all rows.

    Access a cell using the column index or the column name (e.g., Rows[3].Cells[4];
    or Rows[3].Cells["Phone"]).

    Get the value (of object type) associated with a cell using Value property (e.g.,
    Rows[3].Cells["Phone"].Value). |

    | SelectedColumns | Collection of columns selected by the user. |

    | SelectedRows | Collection of rows selected by the user. |

    | Events | |

    | CellClick | When a cell is clicked. |

    | CurrentCellChanged | When the current cell changes. |


    Let’s look at some examples of how you would use these properties and events to
    work with the table.


    # Rows and Cells Collections


    You may access any cell using the Rows and Cells collections by specifying its
    column and row indices. For example, the data item in row 2 and column 8 is given
    by


    ```

    employeeDataGridView.Rows[1].Cells[7].Value.ToString()

    ```


    Note that the index of row 1 is 0, index of row 2 is 1, and so on.


    # Value Property


    The Value property gives the value associated with a cell. The ToString method
    converts the Value, which is of object type, to string.'
