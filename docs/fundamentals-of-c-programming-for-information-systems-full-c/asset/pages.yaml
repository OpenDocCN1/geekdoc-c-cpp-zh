- pgno: 75
  md: 'Thus, a data type cannot be assigned to any of the data types on its left.
    For example, double type cannot be assigned to any of the other types without
    explicit conversion. This is true even if the actual value of the data item is
    small; it is the range of the data type that matters.


    So, the following code will result in an error because 5.5 is double type, which
    has a larger range than decimal, although double uses less memory than decimal:


    ```

    const decimal TAX_RATE = 5.5;    // invalid

    ```


    Similarly, float cannot be assigned to decimal or integer types, but it can be
    assigned to double, which has a larger range.


    To correct the problem, the literal 5.5 needs to be explicitly converted to decimal
    type by specifying the data type enclosed in parentheses as follows:


    ```

    const decimal TAX_RATE = (decimal) 5.5;  // valid

    ```


    Another way to cast a literal to decimal type would be to add the letter “m” or
    “M” to the literal:


    ```

    const decimal TAX_RATE = 5.5m;      // valid

    ```


    Except for decimals, data types of smaller range can be stored in data types of
    larger range. So, the following assignment is valid because the literal 5 is an
    integer. All integer types have ranges smaller than that of decimal:


    ```

    const decimal TAX_RATE = 5;          // valid

    ```


    # decimal type: The exception


    The exception is that decimal type cannot be stored in float and double (though
    they have large ranges) without explicitly converting it. Remember, decimal needs
    more memory than float and double, though it has a smaller range. So, the following
    is invalid, because decimal type cannot be assigned to double type:


    ```

    const double TAX_RATE = (decimal) 5.5;      // invalid

    ```


    Step 1-3: Change the statement in line 29 to: const decimal TAX_RATE = 5.5;

    Hover the pointer over the number to view the error message, “Literal of double
    type cannot be implicitly converted to type ‘decimal’…”


    Step 1-4: Change the statement in line 29 to


    ```

    const decimal TAX_RATE = (decimal) 5.5;

    ```


    Note that the error disappears.

    Next, change the statement to


    ```

    const decimal TAX_RATE = 5;

    ```


    Still there is no error.

    Now, you may change it back to


    ```

    const decimal TAX_RATE = 5.5m;

    ```'
