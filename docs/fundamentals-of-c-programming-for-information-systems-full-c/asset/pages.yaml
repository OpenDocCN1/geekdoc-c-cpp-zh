  md: "# Constants as Arguments\n\nInstead of a literal, you may use a constant (or\
    \ a variable, as discussed next) as an argument to pass a value to a method. For\
    \ example, you may use a constant to represent the resting heart rate in the calling\
    \ program btnTrainingRate_Click(), as follows:\n\n```\nconst float restingRate\
    \ = 72;\nComputeTrainingRate(restingRate, 22);\n```\n\n# Variables as Arguments\n\
    \nRather than passing literals (72 and 22) or constants as arguments, variables\
    \ may be used to pass data to a method to make it easy to change the values passed.\
    \ Data are entered into two TextBoxes, txtRestingRate and txtAge, as shown in\
    \ Figure 5-9. The data from the TextBoxes is stored in variables and passed to\
    \ the method.\n\nFigure 5-9: Variables as arguments\n\n![](img/143bad48262566137acc9c41f668a88f_166_0.png)\n\
    \nStep 1-13: Modify the code in the Click event handler, as shown in Figure 5-10,\
