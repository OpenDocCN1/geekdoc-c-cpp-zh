  md: '# Figure 8-8: The ReadTextFiles form displaying above average students


    ![](img/143bad48262566137acc9c41f668a88f_254_0.png)


    To find above average students, first you need to read all student records and
    compute the class average. Then, you need to access the same records again to
    identify who got scores above the class average.


    Rather than reading the file twice, read the file once, compute the class average,
    and store student names in a one-dimensional array and the percent scores in another
    array. Then, use these arrays to identify those who got above average scores.


    What array size should you use to create these arrays? The array size limits the
    number of data items that can be stored in an array. If a program needs to read
    data from a file with an increasing number of records over time, then the array
    size should be as large as the maximum number of records the file is likely to
    have. Similarly, if the program needs to read from files of different sizes, then
    the array size should be as large as the size of the largest file. For ease of
    viewing the arrays, this example limits the sizes of the two arrays to 10, as
    specified in the following statements that create the arrays.


    ```

    string[] names      = new string[10];

    float[] percentScores = new float[10];

    ```


    Storing data in the arrays involves the following process:


    +   - Read the first record from Exams.txt and store the name in the first element
    of the names array, and store the percent score in the first element of the percentScores
    array, as shown in Figure 8-9.

    +   - Read the second record from Exams.txt and store the name in the second element
    of the names array, and store the percent score in the second element of the percentScores
    array.


    This process is repeated for each record in the file.


