  md: '# Collections


    A collection, like an array, can hold a group of elements (items). An element
    could be of any data type, like a simple number, a string, an array or an object.
    How do collections differ from arrays? This chapter describes the unique features
    of collections and presents their practical applications.


    # Topics


    | 9.1 Introduction to Collections | 9.3 Dictionary<TKey, TValue>Collection |

    | 9.2 List<T>Collection |  |


    # 9.1 Introduction to Collections


    You already used collections when you worked with GUI controls like ComboBox and
    ListBox. To create a list of items in these controls, you added items to the Items
    collection of these controls using the Items.Add() method, without having to specify
    the index of the element, as in a C# array. Collections provide several such methods
    that make it easy to work with them without having to know the underlying structure.
    Further, the size of a collection is increased automatically when you insert new
    items.


    The classes provided by the .Net Framework to create collections can be grouped
    broadly into generic (typed) and nongeneric (unt yped) collections. The generic
    collections are strongly typed—that is, they allow you to specify a single type
    that can be stored in the collection. Nongeneric collections allow elements of
    different types to be stored in a single collection. That means a nongeneric collection
    intended to be of a certain type like float may contain, for example, a string
    that was accidentally added to it. Therefore, use of nongenerics is generally
    not recommended, unless there is a special reason for using them. Both types of
    collections may include strings, arrays, objects and value types like int and
    float.


    Some generic types have corresponding nongenerics, and others do not. Table 9-1
    shows some commonly used generic collections and their corresponding nongeneric
    collections, if any.


    Additional features of the different collections listed in Table 9-1 include the
    following:


    +   - List does not require a unique key, but Dictionary, SortedList and SortedDictionary
    require a unique key.

    +   - SortedList and SortedDictionary maintain the data in sorted order, making
    insertion and deletion of items generally less efficient than unsorted collections.'
