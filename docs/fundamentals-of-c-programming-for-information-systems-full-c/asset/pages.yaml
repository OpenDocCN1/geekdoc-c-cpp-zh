  md: "# 5.5 Top-Down Design\n\nTop-down design involves breaking down a larger problem\
    \ to smaller subtasks, each performed by a separate method, to make software development\
    \ simpler and easier.\n\nThough the task of computing the training heart rate\
    \ is fairly simple, for the purpose of illustrating top-down design, let’s look\
    \ at the subtasks of this problem. Figure 5-17 shows the code that you developed\
    \ in Tutorial 1, with a couple of additional statements to display the resting\
    \ rate and age, along with the training rate. This event handler calls ComputeTrainingRate\
    \ method to compute the training heart rate.\n\n# Figure 5-17: Revised code to\
    \ compute training rate\n\n```\nprivate void btnTrainingRate_Click(object sender,\
    \ EventArgs e)\n{\n    float restingHeartRate, age;\n\n    // Get personal data\
    \ (resting rate and age) from Textboxes:\n    restingHeartRate = float.Parse(txtRestingRate.Text);\n\
    \    age = float.Parse(txtAge.Text);\n\n    // Call ComputeTrainingRate\n    float\
    \ trainingHeartRate = 0;\n    ComputeTrainingRate(restingHeartRate, age, ref trainingHeartRate);\n\
    \n    // Display training rate\n    lstResults.Items.Add(string.Format(\"{0,20}{1,10}\"\
    , \"Resting Heart Rate:\", restingHeartRate));\n    lstResults.Items.Add(string.Format(\"\
    {0,20}{1,10}\", \"Age:\", age));\n    lstResults.Items.Add(string.Format(\"{0,20}{1,10}\"\
    , \"Training Heart Rate:\", trainingHeartRate.ToString(\"N0\")));\n}\n```\n\n\
    The task performed in this program can be broken down to three subtasks:\n\n+\
    \   1. Get personal data.\n+   2. Compute training rate.\n+   3. Display results.\n\
    \nYou already developed a method for the second subtask (compute the training\
    \ rate). Now, you will develop two additional methods corresponding to the subtasks\
    \ (get personal data and display results) and call all three methods from btnTrainingRate_Click\
    \ event handler, as represented in Figure 5-18."
