- pgno: 45
  md: 'Use meaningful names for variables to make programs easy to read. You should
    avoid using abbreviations or acronyms that are not widely recognized. For example,
    use totalQuantitySold rather than tqs.


    # Variables to hold other types of data


    The example of code in Figure 1-18 that we are looking at does not include variables
    to hold other types of data, like character and string data. Every type of variable
    is declared using the same syntax. Here are examples of statements to create character
    and string variables:


    ```

    char middleInitial;

    string lastName;

    ```


    # Assigning Values to Variables


    After you create a variable, you can assign a value to it using a statement of
    the form


    ```

    variable name = value (or an expression that computes a value)

    ```


    For example, the variable scoops declared in the program as type int may be assigned
    the value 3, using the statement


    ```

    scoops = 3

    ```


    That is, the value 3 will be stored in a memory location called scoops, as represented
    below:


    ![](img/143bad48262566137acc9c41f668a88f_45_0.png)


    Similarly, the statement


    ```

    scoops = (10/5) + 1

    ```


    would assign the value 3 to scoops.


    # Lifetime of a variable


    You cannot use a variable that doesn’t exist! That means you cannot use a variable
    before it is declared, because the variable exits only after it is created using
    the declaration statement.


    Similarly, a variable ceases to exist after completion of execution of the method
    where it is declared. Thus, the lifetime of a variable that is declared within
    a method is the time period between its creation in memory during execution of
    the method and the time when the execution of the method is completed. In general,
    the lifetime represents the time period between the creation of a variable and
    the destruction of the variable from memory.


    A related term is scope of a variable, which is the section of a program where
    the variable can be accessed. The scope of a variable is the block of statements
    between the variable’s declaration and the next right curly brace. The scope of
    variables is discussed further in section 1.10.'
