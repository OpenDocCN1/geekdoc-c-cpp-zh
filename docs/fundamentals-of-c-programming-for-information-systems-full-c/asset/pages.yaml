  md: "# 5.6 Methods That Return a Value\n\nThe methods we discussed in this chapter\
    \ return values to the calling program only through parameters. Parameters allow\
    \ any number of values to be returned.\n\nThe method itself can return a single\
    \ value to the calling program, other than through parameters. An advantage of\
    \ such a method is that the method can be used as a part of an expression. Figure\
    \ 5-24 shows such a method, called TrainingRate, that computes training rate and\
    \ returns it to the calling program:\n\nFigure 5-24: Value returning method, TrainingRate\n\
    \n```\nprivate float TrainingRate(float restingRate, float age)\n{\n    float\
    \ maximumRate;\n    // Compute maximum heart rate:\n    maximumRate = 220 - age;\n\
    \    // Compute training heart rate and return it\n    return 0.6F * (maximumRate\
    \ - restingRate) + restingRate;\n}\n```\n\nHere are the key differences between\
    \ this method and the method ComputeTrainingRate that you developed earlier:\n\
    \nThe header,\n    private float TrainingRate(float restingRate, float age)\n\
    shows no parameter to return the trainingRate. Then how is the trainingRate returned?\n\
    \nThe method itself takes the place of a parameter and returns the value specified\
    \ in the return statement,\n    return 0.6F * (maximumRate - restingRate) + restingRate;\n\
    \nBecause the method returns a value, the type of value returned, called return\
    \ type, is specified in the header using the key word float instead of void. Further,\
    \ the name of the method indicates the value returned by the method, not what\
    \ the method does.\n\n# Calling a Value Returning Method\n\nThis is how you call\
    \ the method:\n\n```\nfloat trainingHeartRate = TrainingRate(restingHeartRate,\
    \ age);\n```\n\nThe value returned by TrainingRate is assigned to the float type\
    \ variable, trainingHeartRate.\n\nNext, we will develop a new form named HeartRateTopDownAlt,\
    \ with an alternate version of ComputeTrainingRate that does not use a parameter\
    \ to return training rate. This form has the same user interface as HeartRateTopDown,\
    \ as shown in the following figure:"
