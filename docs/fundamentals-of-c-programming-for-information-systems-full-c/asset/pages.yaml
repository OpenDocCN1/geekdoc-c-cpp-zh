- pgno: 20
  md: 'the program asks the computer to do something it is unable to do, like accessing
    a file with an invalid path or dividing a number by zero.


    The process of identifying errors (bugs) is called **debugging**. Testing programs
    to identify and eliminate errors is an extremely important part of developing
    software.


    # Review Questions


    +   1.1 Consider Google as a software system. What would be the input, process
    and output for Google?

    +   1.2 Consider a software system that enrolls students into classes. Identify
    some key inputs that the system needs every time a student enrolls in a class,
    and the subtasks (process) that need to be performed. What are some outputs the
    system should produce for students and instructors?

    +   1.3 List the major steps in developing a program.

    +   1.4 Incorrect punctuation in a program is an example of what type of error?

    +   1.5 A payroll program uses the wrong formula to compute overtime pay. What
    type of error is it?

    +   1.6 True or false: A program that doesn’t have any syntax errors should produce
    the correct results.


    # 1.2 Introduction to Visual Studio


    In this section, you will learn how to use Visual Studio (VS) to create the user
    interface and write C# programs. Visual Studio is an integrated development environment
    (IDE) for developing applications in a variety of languages, including C#, Visual
    Basic, C++, Python and HTML/JavaScript. VS supports development of desktop and
    web applications for Windows, Android and iOS. A major strength of Visual Studio
    is that it provides a user-friendly environment for developing applications.


    # Installing Visual Studio


    You may download Visual Studio Community 2015 from the following website:


    https://www.visualstudio.com/downloads/download-visual-studio-vs


    To install Visual Studio, *open* the downloaded **vs_community.exe** file. The
    installation software will guide you through the process. The first time you start
    Visual Studio, you will be asked to choose the *Development Settings* and a *Color
    Theme*. Choose *Visual C#* for settings. You may change these settings later,
    as described in Tutorial 1.


    # Components of Visual Studio


    Though you have the choice to write programs in a variety of languages, the CPU
    can understand only **Machine Language**, which is extremely difficult for humans
    to understand. Machine Language requires detailed instructions that consist of
    patterns of bits (0 and 1), like 10001010, and are dependent on the machine (the
    specific type of computer). Because of the need to write detailed machine-dependent
    instructions, Machine Language is called a **low-level language**.'
  merge: -1
  img_proc: true
