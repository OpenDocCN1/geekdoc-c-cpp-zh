  md: '# 10.2 Adding Items to ListView


    To create a ListViewItem object named showsLVI, you may store the subitems in
    a string array and pass the array as an argument to the ListViewItem class, as
    follows:


    ```

    String[] fieldsArray = {"101", "Mama Mia", "75"};

    ListViewItem showsLVI = new ListViewItem(fieldsArray);

    ```


    After you create the ListViewItem object, you add it to the Items collection of
    the ListView. The following statement adds the ListViewItem, showsLVI, to the
    ListView, lvwShows:


    ```

    lvwShows.Items.Add(showsLVI);

    ```


    You also may create a ListViewItem with just the first subitem, and then add the
    remaining subitems individually. But it is more convenient here to add all subitems
    together as a single array.


    # View Property


    To display subitems of a row in tabular format with column headings, as shown
    in Figure 10-1, you need to set the View property to Details, as shown in Figure
    10-3.


    Figure 10-3: The View property of ListView


    ![](img/143bad48262566137acc9c41f668a88f_319_0.png)


    # Column Collection


    To display column headings, click on Columns (Collection) property of the ListView
    to open the ColumnHeader Collection Editor window. Click Add to add the first
    header and change its Text property to the desired heading. You also may change
