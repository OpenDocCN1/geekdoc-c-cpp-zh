- pgno: 305
  md: '# Creating a Dictionary


    The syntax to create a Dictionary object, and assign it to a reference variable,
    is


    ```

    Dictionary<TKey, TValue> dictionaryName = new Dictionary<TKey, TValue>();

    ```


    where TKey and TValue specify the type of the key and of the value, respectively,
    and dictionaryName is the name of the variable that references the Dictionary.


    A value can be of any data type. But using reference types, like array, for keys
    may pose a problem because this may not generate unique hash keys for storing
    the values using the standard method of generating keys. Similarly, using objects
    for keys becomes more complex.


    # Examples


    ```

    Dictionary<string, float> prices = new Dictionary<string, float>();

    —Creates a Dictionary named prices with key of string type and value of float
    type

    ```


    ```

    Dictionary<int, Array> sales = new Dictionary<int, Array>();

    —Creates a Dictionary named sales with key of int type and value of Array type

    ```


    ```

    Dictionary<short, Customer> customers = new Dictionary<int, Customer>();

    —Creates a Dictionary named customers with key of short type and value of Customer
    type

    ```


    Names like prices and sales are the names of variables that reference the Dictionary
    object, although, for the sake of brevity, we describe them as the names of Dictionary.


    In general, the term “Dictionary” is used in place of “variable that references
    the Dictionary object.”


    # Adding Items to a Dictionary


    To add an item to a Dictionary, you add a key and a value, as in the following
    examples:


    ```

    prices.Add("Litebook 15", 399.95);

    —Adds an item with “Litebook 15” as the key and 399.95 as the value

    ```


    ```

    float[] prodSales = {55.5, 29.0, 109.5, 85.0};

    sales.Add(4, prodSales);

    —Adds an item with 4 as the key and prodSales array as the value

    ```


    # Accessing an Item


    An item in a Dictionary is accessed by specifying the key, as in the following
    examples:


    ```

    prices["Litebook 15"]

    —Returns the value 399.95

    ```


    ```

    sales[4]

    —Returns the array {55.5, 29.0, 109.5, 85.0};

    ```'
  merge: -1
  img_proc: true
