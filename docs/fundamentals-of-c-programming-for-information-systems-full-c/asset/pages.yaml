  md: '# Mixing Different Data Types in a Boolean Expression


    The rules you learned in Chapter 2 about mixing different data types in a formula
    (mathematical expression) involving numbers also apply to Boolean expressions—that
    is, you may mix different real and integer data types in a Boolean expression,
    but you cannot mix a decimal with a float or double without explicit conversion.
    For example, the expression in the following if statement is invalid:


    ```

    decimal price = 12.5m;

    if (price > 10.5) // invalid; cannot compare a decimal to double

    ```


    The expression should be changed to


    ```

    if (price > 10.5m)      // valid

    ```


    The following comparisons are valid:


    ```

    decimal price = 12.5m;

    if (price > 10)   // valid; decimal and integer types may be mixed

    ```


    ```

    float price = 12.5f;

    if (price > 10.5) // valid; float and double types may be mixed

    ```


    An if statement may use one or more of the following relational operators to compare
    data items in a Boolean expression:


    # if Statement with No else Clause


