  md: "# Creating the Data Table(s)\n\nA data table object is created from the DataTable\
    \ class using the standard syntax for creating objects:\n\n```\nDataTable variableName\
    \ = new DataTable()\n```\n\nwhere variableName is any valid variable name.\n\n\
    For example, the following statement creates a data table object for the Employee\
    \ table, and references it using the variable, dtEmployee.\n\n```\nDataTable dtEmployee\
    \ = new DataTable();\n```\n\n# Creating the Data Adapter\n\nA data adapter is\
    \ created from the DataAdapter class:\n\n```\nDataAdapter variableName = new DataAdapter(connectionString,\
    \ Sql)\n```\n\nThe first parameter, connectionString, provides the necessary information\
    \ to connect to the database. To connect to a local database, the syntax of the\
    \ connection string is\n\n```\n@\"Data Source = (LocalDB)\\MSSQLLocalDB; AttachDbFilename\
    \ = path\\fileName\";\n```\n\nHere is an example:\n\n```\n@\"Data Source = (LocalDB)\\\
    MSSQLLocalDB; AttachDbFilename = C:\\VC\\HR2.mdf\";\n```\n\nIf the database is\
    \ to be accessed from a server, the Data Source would provide the server address.\
    \ The structure of the connection string may vary with the version of SQL Server\
    \ you are using. The connection string may include additional information on security,\
    \ user id and password.\n\nThe second parameter, Sql, represents the SQL statement\
    \ to select data. The syntax to select data from a single table is\n\n```\nSELECT\
    \ fieldNames FROM tableName WHERE criterion\n```\n\nIn the above statement, fieldNames\
    \ represents the list of field names separated by commas, tableName represents\
    \ the table name, and criterion represents the criterion, if any, to select records.\
    \ If all fields are to be selected, you may replace field names by an asterisk.\
    \ For example, to select all fields from all records of the Employee table, use\
    \ the following SQL statement:\n\n```\nSELECT * FROM Employee\n```\n\nThe WHERE\
    \ clause is discussed briefly later in this section.\n\nThus, the following code\
    \ creates a data adapter to access all Employee records, and references it using\
    \ the variable, daEmployee.\n\n```\nstring connString = @\"Data Source = (LocalDB)\\\
    MSSQLLocalDB; AttachDbFilename =\n    C\\VC\\HR2.mdf\";\nstring empSQLStr = \"\
    SELECT * FROM Employee\";\nSqlDataAdapter daEmployee = new SqlDataAdapter(empSQLStr,\
    \ connString);\n```\n\n# Creating the Binding Source\n\nThe binding source is\
    \ created from the BindingSource class:\n\n```\nBindingSource variableName = new\
    \ BindingSource;\n```"
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Filling the Data Table


    Filling the data table consists of loading data from the database table (or from
    a view that might have data from multiple tables) to the corresponding data table.
    The following statement fills the data table, dtEmployee, using the table adapter
    daEmployee:


    ```

    daEmployee.Fill(dtEmployee);

    ```


    The data adapter knows what data should be loaded into the data table, because
    it contains the necessary SQL statement that was specified when the data adapter
    was created.


    # Linking the Binding Source to the Data Table


    To link a binding source to a data table, the DataSource property of the binding
    source is set to the data table, as in


    ```

    bsEmployee.DataSource = dtEmployee;

    ```


    The complete code to create the create the data access objects, fill the data
    table and link the data table to the binding source is shown in Figure 12-45.


    # Figure 12-45: Code to create the data access objects


    ```

    10  using System.Data.SqlClient;    // add this using directive

    11

    12 namespace Ch12_Databases_UntypedDatasets

    13 {

    14     public partial class Employee_Display : Form

    15     {

    16         public Employee_Display()

    17         {

    18             InitializeComponent();

    19         }

    20         DataTable dtEmployee = new DataTable(); // creates the data table

    21         SqlDataAdapter daEmployee;  // declares a reference variable for the
    data adapter;

    22         BindingSource bsEmployee = new BindingSource(); // creates the binding
    source

    23

    24         private void Employee_Display_Load(object sender, EventArgs e)

    25         {

    26             // Create the data adapter

    27             string connString = @"Data Source = (LocalDB)\MSSQLLocalDB; AttachDbFilename
    = C:\VC\HR2.mdf";

    28             string empSQLStr = "SELECT * FROM Employee";

    29             daEmployee = new SqlDataAdapter(empSQLStr, connString);

    30             // Fill the data table, dtEmployere

    31             daEmployee.Fill(dtEmployee);

    32             // Link binding source to the data table

    33             bsEmployee.DataSource = dtEmployee;

    ```


    Line 10: The using directive specifies the namespace, SqlClient, which contains
    the data access objects, like data table and data adapter.'
