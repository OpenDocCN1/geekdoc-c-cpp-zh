    there is a chess board and pieces in the scene.


    Vision and the visual system are the focus of much research in psychology, cognitive
    science, neuroscience and biology. A major problem in vision perception is that
    individuals ‘see’ is not just a simple translation of input stimuli (compare optical
    illusions). One important area of research to build robots that can understand
    their surroundings is the development of artificial vision. Computer Vision—sometimes
    referred to as Robot Vision when applied in a robotic system—generally describes
    the field of research dealing with acquiring, processing, analysing, and understanding
    images in order to produce decisions based on observation. The fields of computer
    vision and AI have, e.g. autonomous planning or decision making for robots requires
    information about the environment, which could be provided by a computer vision
    system. AI and computer vision share other topics such as pattern recognition
    and learning techniques.


    Even though clear definition of the areas of computer vision and image processing
    exists, the latter is commonly used to refer to a subsection of computer vision.
    Image processing techniques generally provide ways of extracting information from
    the image data, for example, noise reduction, feature extraction, segmentation,
    et.[21] Another important topic in computer vision is ‘image understanding’. With
    the aid of geometry, statistics, and learning the goal is to mimic the abilities
    of the human (visual) perception system.


