    # 8.4.1 Physical Context


    Physical context describes some signals that can be detected by any kinds of sensors,
    and some signals that are provided by virtual environments and multi-agent systems.
    In agent dialogue, physical context contains several attributes of dialogues,
    such as location, who is the speaker and who is the listener, volume of speeches,
    and observable activities in the virtual environment, and sentences in dialogues.


    # 8.4.2 Emotion Model


    The OCC model [16] proposed an emotion model for 22 types of emotions, according
    to their triggering conditions, in terms of an agent''s appraisal of objects,
    agents, and events, in respect to their utility. However, some difficulties are
    encountered when using the OCC model to logically describe the emotion context
    for speech acts. The major difficulty is we must discriminate the first positive
    and negative emotion contexts for agent.


    In speech act classification [2], 15 speech acts have been identified by expression
    layer, which are used to express an agent''s self emotion. In dialogue context,
    expressing self emotions can play a crucial role in agent communication, which
    can help an agent make others understand his/reactions to previous conversations
    or to release emotional pressure [7], [14]. We manually divided those Expression
    Layer speech acts [2] into 2 groups, one group contains the speech acts with positive
    emotion context, and the other with negative emotion context.


    # 8.4.3 Social Relation


    Social relations refer to friendship/enemy relations. We focus on those relations
    in two aspects that must be specified in the speech act: the given speech act
    is adopted, and the relations that can be affected by the speech act at different
    degrees of influence toward the emotions of the listener agent. For example, a
    friend pointing out your fault would probably provoke less anger from you than
    an enemy. It means if we monitor the long term context changes in the dialogue,
    we may infer agents'' friendship/enemy relations context.'
