  md: '# 38 ■ Cognitive Robotics


    the need for exchange as much as possible” writes Clastres (1977), and he is absolutely
    right.


    Among the Ngobo, who like many Amerindian groups, they practice subsistence economy,
    there are (irregular) food surpluses in the village that the household does not
    consume and are distributed to family and friends who request it. At some time
    or another, an agricultural field will yield a surplus, yield nothing, or yield
    the normal and sufficient floods. Timesomes the opposite occurs, as was the case
    with the 2010-2011 floods, which destroyed most of the finca crops in the entre
    Krikamo region. I had arrived for fieldwork shortly after, and the dismay from
    the luck of food was explicit in the people’s faces. Though during this period
    collaboration amongst household and kin groups was enhanced. Therefore inter-household
    food distribution occurs throughout the year. For example if a household has a
    bad harvest one year, or if its field is too small to constantly produce, its
    members will request to accompany another household when their members go to the
    field, with chores and gather food from it. They implicitly performed social etiquettes
    which occur between hamlets between households which have no name by them. And
    this is what makes gift exchange important and this is what makes giving away
    food also important to be “give” one that is self-sufficient and able to do in
    the first place. This effort toward self-sufficiency — who rests on the principles
    of ‘care’ and ‘trust’ between the peoples of the family — is the cornerstone for
    household autonomy and social stability and harmony to be maintained. Joanna Overing
    (2003) writes regarding the Piaro people “The stress the Piaro put upon the everyday
    and its activities is not trivial, but rather the product of a powerful and highly
    egalitarian social philosophy”.


    # 2.6 FORMATION OF A ROBOTIC COMMUNITY


    Samani et al, in their paper Cultural Robotics: The Culture of Robotics and in
    culture attempt to define a robot community culture which is “programmed by human,
    human-like, and human comprehensible” (Samani, 2013). They propose that such a
    culture would require the creation of values, customs, attitudes, artifacts, and
    other cultural dimensions among a robot community. The prerequisites for robots
    to evolve a culture based on the human definition — would be an independent, critical
    and self-reflective mind that develops in a way that leads to consciousness and,
    ideally, self-awareness of the robot. They continue by identifying two characteristics,
    which in their opinion are (a) repetition of social and individual learning and
    (b) Darwinian-inspired theory of selective reproduction. For a family robot to
    be custom-made by the family itself, would give it a sense of genealogy that is
    traced back to the family members, which gave it form.'
