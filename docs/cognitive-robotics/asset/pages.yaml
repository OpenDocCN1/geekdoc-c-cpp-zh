    In total, 48 participants took part in the experiment. Those who had ever participated
    in an experiment this robot was excluded from recruitment. Based on the results,
    participants were more likely to accept recommendations from the robot with a
    higher level of autonomy, showed higher attachment to the robot and glared for
    a longer amount of time at the in-group robot. Compared with cooperation with
    the out-group robot, robots'' autonomy level showed lower workload while cooperating
    and more influence on participants'' acceptance of recommendations while they
    cooperated with the in-group robot. The female participants thought the robots
    were more reliable than the male participants and shared more benefits with robots.
    The participants who showed higher negative attitudes towards robots, measured
    before experiment, had a higher mental workload.


    # 6.4 FUTURE WORK


    As the popularity of social robots in public places and families increases, users''
    cognition and reflection towards the robots will show a higher level of predictability.
    The influences of robot design factors on users'' behaviours and cognition will
    become more clear. Currently, there is still a lack of research targeted at how
    the real interaction experience of users influences their real interactive behaviours
    with robots and decision-making behaviours. The theoretical framework of the interaction
    experiment and interactive behaviour has not been built. Research investigating
    the influences of users'' interaction experience with robots on user cognition
    and behaviours is valuable. This research can improve robot designers'' abilities
    to predict user experience and behaviours, in order to develop robots which can
    maintain positive user experience.


    There are two directions to further investigate the influences of users'' interaction
    experience with robots. The first is to screen the users who have different levels
    of interaction experience. The second is to require participants to interact with
    robots several times during a long period, in to measure the influence of the
    increase of interaction experience on the participants'' cognition and behaviours.


    Additionally, considering the demand that social robots interact with multiple
    users at the same time, the research of group discussions supported by robots
    is another future research direction.'
