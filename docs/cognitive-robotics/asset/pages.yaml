    When we talk about considering culture when designing a robot, we mean a number
    of things. Firstly, a robot as an actor in a particular culture, which (as we
    would argue), all social robots are. Hooman Samani et al. ([53]) quotes Lucy Suchman
    who argues that users interact with technology using similar expectations in human-to-human
    communication, and in doing so, they share the properties of robots using their
    cultural and social values [56]. Such implies implies that robots are not only
    reflective of a particular culture, but are continually shaped and analysed through
    the lens of each person''s individual culture, as they see and interact with it.


    The second stage of cultural integration is a robot as a participant in, or producer
    of human material and noncultural culture. This is the level of integration where
    we would position most current social robots. By interacting with people, robots
    are exposed to and influenced by noncultural culture, but through social robots
    can now help cook a meal [58], improvise on a piece of music [63], or serve a
    drink [31]. As this stage progresses, we may see robots begin to independently
    produce cultural artifacts and as this grows, we see the potential for the advent
    of robotic community culture.


    Robotic community culture, as first outlined by Samani et al. in [53], is the
    emergence of artificial culture in robotic communities, and refers to the creation
    of artefacts, values, beliefs, customs and other cultural dimensions by robotic
    agents. This stage of robotic culture has not yet been actual, but is not beyond
    the foreseeable future. Samani et al. assert that stages such as embodied robotic
    interactions, norm modelling, self-replication and robotic co-operation and coherent
    behaviour, robotic cultural norms have the potential to emerge. However, as identified
    by Susan Blackmore, manifestations of machine culture may be completely inalienable
    or inscrutable to human beings [13]. The discussion of the emergence of autonomous
    robotic culture is beyond the scope of this paper, however, it is important to
    keep in mind the ‘bidirectional shaping’ of technology and culture.


    In considering culture, we must also acknowledge that not all cultures are receptive
    to robots in the same way, and in fact exhibit strict and particular preferences
    when it comes to the type of robot, and what function it will have in their lives.
    Some early research has done comparing the cultural variable preferences for robotic
    design [41, 10]. Different cultures of anthropomorphism intelligence, robotic
    form, interactivity and general attitudes towards robots. Both of these studies
    were conducted with static images of robots alone, and both studies involved less
    than 100 participants from any given country, who then went on to represent the
    preferences of their entire nation in the results. This generalization do not
    give consideration to the vast differences in community or specific culture, where
    the views of a Texan farmer may vary greatly from a New York city lawyer. The
    outcome of these studies may vary with the use of embodied robots, and the variations
    of cultural preferences within a country would make for an interesting study.'
