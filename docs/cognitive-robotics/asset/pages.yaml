    TPB is ''a social cognitive model of the influences on an individual''s decision
    to engage in a particular behavior, (and) has been identified as a promising framework
    [19] for detecting the known physical, psychological and social determinants ([26])
    most strongly impacting expectations. The TPB is designed to predict and explain
    human behavior in particular circumstances [3], on the premise that a person''s
    behavioral intentions are the most proximal and strongest determinant of human
    behavior [26].


    The TPB proposes three primary determinants of intention. The first is the attitude
    towards behavior, which refers to the degree to which a person has an overall
    positive or negative appraisal of the behaviour, in case, collaborating with a
    social robot, and how important this appraisal is (behavioral beliefs). The second
    is labeled the subjective norm, and refers to the perceived social pressure to
    perform or not perform the behavior. This is normative beliefs-an assessment of
    the overall importance of the opinions of significant others. The third is perceived
    behavioral control, which is the ease or difficulty of performing the behavior,
    based on an assessment of the self and all available resources, and the power
    of this belief to influence the individual''s behavior (control beliefs) [3].


    Many different models have emerged concerning the adoption of technology [48],
