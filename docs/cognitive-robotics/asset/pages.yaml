    # 10.4.1 Collision Avoidance and World Model: MoBeE


    An important issue is to ensure the safe operation of our humanoid. Modular Behavioral
    Environment (MoBeE) [19] is a software infrastructure to realise complex, adaptive
    and furthermore safe robotic behaviors. It acts as an intermediary between three
    loosely coupled teams of modules: the Sensor, the Agent and the Controller. These
    correspond to abstract solutions in Computer Vision, Motion Planning, and Feedback
    Control, respectively. An overview of the system is depicted in Figure 10.5. The
    framework is robot independent, and can deploy any device that controlled by YARP
    [41]. It supports multiple interacting robots, and behavioural components are
    portable and reusable thanks to their weak coupling. MoBeE controls the robot
    constantly, according to the following second order dynamical system:


    ```

    $Mq(t) + Cq(t) + K(q(t) - q'') = \sum f_i(t)$

    ```


    where $q(t) \in R^n$ is the vector function representing the robot’s configuration,
    M, C, K are matrices containing mass, damping and spring constants'
