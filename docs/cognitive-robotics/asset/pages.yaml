    The field of robotics is shifting from building industrial robots that can repeatedly
    perform tasks accurately and predictably in constrained settings, to allow more
    autonomous robots that should be able to perform a wider range of tasks, including
    everyday household activities. Build systems that can handle the uncertainty of
    the real world, it is important for roboticists to look how humans are able to
    perform in such a wide range of situations and contexts-a domain that traditionally
    the purview of cognitive psychology. Cognitive scientists have been successful
    in bringing computational systems closer to human performance. Examples include
    image and speech recognition and general knowledge representation using parallel
    distributed processing (e.g., modern deep learning models).


    Similarly, cognitive psychologists can use robotics to complement their research
    Robotic implementations of cognitive systems can act as a “computational proving
    ground”, allowing accurate and repeatable real-world testing of model predictions.
    All too often, theoretical predictions–and even carefully-conducted model simulations–do
    not scale up or even correspond to the complexity of the real world. Psychology
    will always seek to push out the next of the laboratory and see if it can take
    flight. Finally, cognitive psychologists have an opportunity to conduct experiments
    that will both inform roboticists as they seek to make more capable robots, and
    increase our knowledge of how humans perform adaptively in a complex, dynamic
    world. In this chapter, we will give a broad but brief overview of the fields
    of cognitive psychology and robotics, with an eye to how they have come together
    to inform us about how (artificial and natural) actions are constructed.


    # 9.1 EARLY HISTORY OF THE FIELDS


    # 9.1.1 History of Cognitive Psychology


    Before cognitive psychology and robotics blended into the approach known as cognitive
    robotics, both fields already had a rich history. Cognitive psychology as we now
    know it has had a rocky path (as has most psych-'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# On the Crossroads of Cognitive Psychology and Cognitive Robotics ■ 173


    ical disciplines, for that matter). Breaking away from philosophy, after briefly
    attempting to use introspection to observe the workings of the mind, the field
    of psychology found it more reliable to rely on empirical evidence. Although making
    rapid strides using this empirical evidence, in the form of Donders'' classic
    reaction time experiments which proposed stages of extending from perception to
    action, early cognitive psychology came to be dominated by a particular approach,
    behaviorism. This position, popularized by Watson [54] and pushed further by Skinner
    [46], held that the path for psychology to establish itself as a natural science
    on physics and chemistry would be to restrict itself to observing entities such
    as stimuli and responses. In this sense, behaviorists like Skinner were strongly
    anti-representational, i.e., against the assumption of internal knowledge and
    states in the explanation of behavioral observables. On the other hand, the focus
    on observable data brought rigor into the field, and many interesting effects
    were described and explained.


    The behaviorist approach dominated the field of psychology during the first half
    of the 20th century. In the 1950s, seeming limitations of behaviorism fueled what
    some scholars would call the neocognitive revolution. Starting with Chomsky''s
    scathing 1951 review of Skinner''s book to explain how infants learn language
    by simple association, many researchers found that behaviorism could not explain
    fundamental cognitive processes such as learning (especially memory) and the foundations
    of artificial intelligence were also nascent, and pursuing explanations of high-level,
    uniquely human aptitudes-g., analytical thought, reasoning, logic, strategic decision-making-grew
    in popularity.


    # 9.1.2 The Computer Analogy


    Another factor contributing to the neocognitive revolution was the emergence of
    a new way to describe human cognition as similar to computer systems. The basic
    mechanism operating computers (and is still, in a fundamental way) gathering input,
    processing it, and outputting the processed information, unlike the basic cognitive
    model of stimulus detection, storage and transformation of stimuli, and response
    production.


    Clearly, this processing of information requires some representational states
    which are unaccounted for (and dismissed as unnecessary) by behaviorists. This
    new way to look at human cognition as an information process not only excited
    psychologists as a way of understanding the brain, but also raised hopes for building
    intelligent machines. The idea was that if computer systems could use the same
    rules and mechanisms as the human brain, they could also act like humans. Perhaps
    the well-known proponent of this optimistic vision was Turing [51], who suggested
    that it wouldn''t be long before machine communication would be indistinguishable
    from human communication. Maybe the secret of cognition lies in the way the brain
    transforms and stores data, it was thought.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# 174 ■ Cognitive Robotics


    Alas, the optimists would be disappointed. It soon became clear that computers
    and humans have different strengths and weaknesses. Computers can calculate pi
    to twenty significant digits within mere milliseconds. Humans can read terrible
    handwriting. Clearly, humans are not so comparable to basic input-output systems
    after all. It would take 25 years for cognitive psychology and artificial intelligence
    to begin their romance again, in the form of the parallel distributed processing
    (PDP) approach [40].


    # 9.1.3 Early Cognitive Robots


    With this idea of smart computers systems in mind, it seemed almost-forward to
    add embodiment to build intelligent agents. The first cognitive robots were quite
    simple machines. The Machina Speculatus [53] consisted of a mobile platform, two
    sensors, actuators and ‘nerve cells’. Understandably, these robots were designed
    to mimic behavior of simple animals, and could move safely around a room and recharge
    themselves using relatively simple approach and avoidance rules.


    Due to their simplicity, it was questionable how cognitive robots—they were more
    related to cybernetics and control theory (e.g., [5])-but soon enough complexity
    might turn them into cognitive robotics.


    From the 1960s, robots would be able to represent knowledge and plan sequences
    of operations using algorithms as STRIPS [17], that would be considered essential
    knowledge for every AI student. The STRIPS planner, which represents goal states
    and preconditions and attempts to derive the action sequences that would achieve
    them before carrying them out, is quite slow to execute. Moreover, this type of
    planning suffers from its closed world assumption (i.e., the environment and all
    relevant states are known-programming-and will not change), and the massive complexity
    of the real world, leading to intractable computations. Yet the general approach
    taken by STRIPS—of modeling the environment, possible actions and state transformations,
    and goal states via predicate logic, sense-plan-act loop—has dominated cognitive
    robotics for some time, and is still a strong trend today.


    Various behavior-based robotics architectures and algorithms—taking inspiration
    from biological organisms—have been developed in the past decades. An influential
    example is Rodney Brooks’ subsumption architecture [9], which eschews planning
    entirely—“planning is just a way of avoiding to figure out what to do”, using
    a defined library of basic behaviors arranged hierarchically to generate behavior
    based on incoming. Although fast and often generating surprisingly complex behavior
    from simple rules (see also [8]), the subsumption architecture and many other
    behavior-based robotics algorithms do not yet incorporate much from the lessons
    to be learned from psychological studies in humans.'
