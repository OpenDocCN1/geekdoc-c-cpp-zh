    practical embodiment, i.e. each of the implementations in a real world robotic
    system refer to sundry different definitions of emotions, motivations and intentional
    states.


    It must be noted that the area of emotions, motivations and intentional states
    is a theoretical quagmire of different definitions and approaches. The background
    psychophysiological, neuroscientific and psychological knowledge itself is a quagmire.
    Actually is more human constructed and less natural than the robot itself. For
    example is widely debated if emotions are natural kinds [38, 18, 25].


    This simply means that it is widely discussed if we use words to describe natural
    phenomena and entities or if the words are more scientific or social construct.
    As a matter of fact there is no general agreement of how many emotions there are
    (simply consider how many words identify emotions); furthermore sometimes emotions
    are classified (or better the word we use to describe emotions) in primary (basic)
    and secondary. The science, i.e. the scientific investigation of emotions using
    objective measurements do not help much. Many different physiological variables
    can be measured (heart beat, galvanic skin reflex, respiratory rate, eye blink,
    EMG, EEG and MR scans) do not provide a unique standardised nor Further some of
    these variables are also considered indexes useful to measure cognitive loads.
    Additionally we have moods (long term affective states) and emotion appraisal,
    as well as valence (positive or negative) of emotions.


    Consequently each Robotics scientist that implemented and embodied emotions in
    an actual robot has been confronted with the need to choose one of the possible
    state about emotions, one possible group of basic emotion and one possible concept
    of how emotions are related to behaviour. Additionally experiences have been implemented
    on different robotic platforms and in the frame of different scenarios and applications.
    This of course makes it difficult to compare results and assess if the embodiment
    of emotion brought about an improvement in robot performances. Furthermore sundry
    robotic system and platforms have been used by different researchers. No benchmarking
    appears to be possible at present.


