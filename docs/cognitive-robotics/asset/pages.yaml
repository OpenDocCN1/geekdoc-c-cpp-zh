    # 8.8 EXPERIMENT


    To demonstrate our approach works in games, we use multi-agent system and agent
    technology to play virtual dramas. Our goal is to prove agents can have ability
    to aware context states in dialogue with our speech acts model and DBN computational
    method.


    JACK multi-agent platform [4] was chosen as our multi-agent system because it
    has integrated agent communication function, and we can design agent behaviors
    with simple scripts. We also obtained several scripts from famous movies, and
    made intelligent agents as non-player characters (NPCs) to play the scenario.
    Each agent has their own dialogue script which includes dialogue sentences, transferred
    speech acts and targets to speak. We also pre-defined personality, preference
    and other mind states to each NPC by referring the background setting in the original
    movie scenarios. Then we made NPCs to play these scenarios automatically with
    our speech act model and DBN. Meanwhile, we annotated dialogue context to each
    state in the scenarios by several people. Afterward, we compare human-annotated
    data and NPC-inferred results, and show the analysis in sections 8.8.1 and 8.8.2
    respectively.


    We obtained several dialogue sequences from the scripts of famous films "Doubt"
    [19], "The King''s Speech" [1], "Pride and Prejudice" [6] and "Meet Joe Black"
    [3]. There are two reasons for choosing these scripts. First, obvious emotion
    changes are present in these scripts, and it''s beneficial for us to verify NPC''s
    inference. Second, those emotion changes are for speech acts, not by behaviors
    during the dialogue, so physical action effects can be ignored in the scenarios.


