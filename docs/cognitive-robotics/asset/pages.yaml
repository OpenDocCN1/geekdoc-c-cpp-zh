    participants in our courses noting key characteristics of the movement supported
    and highlight the incidental effects that technical elements introduce (sound,
    smoothness, heat, etc). Additionally, we describe the design challenges from our
    experiences in dealing with these contingencies and leveraging them in the design
    choices. We briefly propose future research to continue the exploration in the
    field of shape-changing interfaces.


    # 5.2 SHAPE-CHANGING INTERFACES


    The term, "shape-changing interface" involves self-actuated change, which "must
    be controllable so that the object can return to its initial state and repeat
    the shape change" as defined in [40]. In paper, the authors note various titles
    used to describe interactive artifacts that shape change including terms as actuated
    interfaces [37], kinetic interaction [33], organic user interfaces [7], kinetic
    organic interfaces [32], pro-active architecture [29] and computational processes
    [46].


    +   There are many examples of shape-changing interfaces in recent research and
    with the continued advancements in materials and electronics, this is likely to
    continue. Many examples in the field are discussed in [40], and since then, a
    rich body of work in the field systems of various scales including head scale
    of mobile phones [35], aesthetic experience pieces that encourage interaction
    and play [3], shape-changing seating to influence atmospheres in public spaces
    [13], and experiments in the architectural scale with shape-changing rooms [45],
    among others.


    Shape change holds potential beyond the scope of playful objects, from small scale
    applications, as dynamic buttons [14], shape-changing mobile phones [15, 16],
    or wiggling attention seeking post it''s [38] to large dynamic architectural elements,
    kinetic facades [24], shape-changing architectural structures [29], or visions
    of permeable architecture [6]. These are just fragments of the abundance of examples,
    which have sprouted from the field within the last decade.


    Beyond the multitude of point designs, exploring the potential application areas,
    experiences and interaction that making the form dynamic elements, some papers
    have also pointed to the challenges, potential and limitations of the current
    technologies [9], providing toolkits [31], framing different aspects of kinetic
    vocabularies [33, 40], introducing new technologies [10] and pointing to future
    visions for the field [17].


    # 5.3 EXAMPLES FROM OUR COURSES


    In this chapter we examine projects that researchers and students taking part
    in our design classes have created. This allows us to, more closely,'
