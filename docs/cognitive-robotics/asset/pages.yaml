    # 9.2 ACTION CONTROL


    # 9.2.1 Introduction


    One of the other areas that shows considerable overlap between robots and humans
    is motor/action control. Two types of control systems govern motor action: feedforward
    and feedback control systems.


    A feedforward motor control system sends a signal from the (human or robotic)
    motor component to the relevant motor component using predetermined parameters,
    executing action. Information from the environment can be considered only before
    execution begins, which makes feedforward control suitable for predictable environments.


    In contrast, a feedback motor control system incorporates information from itself
    or the environment (feedback) more or less continuously to modulate the control
    signal. In this way, the system can dynamically alter its behavior in response
    to a changing environment.


    # 9.2.2 Feedforward and Feedback Control in Humans


    For years, psychology and related disciplines have approached action control from
    rather isolated perspectives. As the probably first systematic study on movement
    control by Woodward [55] provided strong evidence for the contribution of environmental
    information, many authors who have developed closed-loop models of action control
    that rely on a continuous feedback loop (e.g., [11]). At the same time, there
    was strong evidence from animal and lesion studies [31, 49] and theoretical considerations
    [34] that various movements can be considered in the absence of sensorimotor feedback
    loops, which has motivated the development of feedforward models (e.g., [22]).


    Schmidt [43] was one of the first who argued that human action control consists
    of both feedforward and feedback components. According to his reasoning, human
    agents prepare a movement schema that specifies the relevant attributes of the
    intended movement but leave open slots that are specified by using online environmental
    information. Neuroscientific evidence has provided strong support for a hybrid
    control model, suggesting that off-line action planning along a ventral cortical
    route is integrated with sensorimotor selection along a dorsal route [19, 18].


    In particular, feedforward mechanisms seem to determine the necessary action components
    of off- and pre- at least some of them before the action [22], and to selectively
    attend to stimuli and stimuli dimensions that are relevant for the task [24].
    Feedback processes, in turn, provide excellent accuracy—often at the cost of speed
    [44]. These strengths and weaknesses have motivated hybrid models claiming that
    feedforward mechanisms provide the skeleton of action plans which leave open slots
    for parameters provided by feedback processes [43, 18, 24].


    A particularly good example of this kind of interaction is provided by'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'the observations of Goodale and colleagues [20]. In a clever experiment, participants
    were asked to rest their hand on a platform and point to a visual target presented
    at a random location on an imaginary line in their right visual field. The participants
    were not told in half of the trials the target changed location during the first
    saccade. The authors found that participants would successfully point to the target
    on these trials without being aware of the location change, and without any delay.
    As feedforward programming is thought to take, a fast and online feedback mechanism
    of which participants are unaware to be responsible for this finding.


    On a higher level, interaction between feedforward and feedback systems must be
    carried out. Higher level, goal-directed action planning, such as planning to
    make pancakes would be impossible to plan in a completely feedforward fashion:
    it would require all motor parameters to be specified a priori, and would require
    exact knowledge of the position and properties of all necessary equipment and
    ingredients, etc.


    Instead, many of these parameters can be filled in online using information from
    the environment. It is not necessary to know the exact weight of a pan, you by
    picking it up: you increase the exerted force until the pan leaves the surface
    of the kitchen counter. Although, you likely also a distribution of probable pan
    weights (e.g., more than 50 g and less than 10 kg) from your experience of other
    pans-or even just similarly-sized objects.


    Interaction between feedforward and feedback becomes more apparent on a higher
    level when a planned action fails to execute. When a necessary ingredient is missing,
    replanning (or cancellation) of a preprogrammed action sequence may be necessary:
    if there is no buffer, can I use oil to grease the pan? Somehow, this information
    gathered by feedback processes must be communicated to the higher level action
    planner.


    # 9.2.3 Feedforward and Feedback Control in Robots


    The theorizing on action control in robotic systems might be considered rather
    ideological, sometimes driven by the specifics of particular robots and/tasks
    considered sometimes by broadly generalized anti-representalist attitudes. Many
    early robots only had a handful of sensors and responded in a fixed pattern of
    behavior a particular set of stimuli. Some robots were ever purely feedforward,
    performing the same action or action sequence, with no sensory input whatever
    [37]. Feedforward or simple reactive control architectures may for very brittle
    behavior: even complex, carefully-crafted sequences of actions and reactions will
    appear clumsy if the environment suddenly presents an even slightly novelty situation.


    More complex architectures have been proposed, with some analogy to biology or
    behavior, giving birth to the field of behavior-based robotics. The subsumption
    architecture [9] was a response to the traditional GOFAI,'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# On the Crossroads of Cognitive Psychology and Cognitive Robotics ■ 177


    posited that complex behavior need not necessarily require a complex control system.
    Different behaviors are represented as layers that can be inhibited by other layers.
    For example, a simple robot could be provided with the behaviors wandering, avoiding,
    pickup, and homing. These behaviors are hierarchically structured, with each inhibiting
    its preceding behavior [4].


    This hierarchy of inhibition between behavior is (although somewhat complex) also
    visible in humans. If, you are prone (accidentally) to set fire while doing the
    dishes, people would finish the dishes before stopping, dropping, and rolling.
    In other words, some behaviors take precedence over others. An approach similar
    to the subsumption architecture has been proposed by [3]. The motor schema approach
    also uses different, parallel layers of behavior, but does not have the hierarchical
    coordination as the subsumption approach does. Instead, each behavior contributes
    to the robot''s overall response.


    On a higher level, as noted in the previous section, other problems arise. When
    a planned action fails to succeed, for example a robot can''t find a pan to make
    pancakes replanning is necessary. The earliest AI planners would simply backtrack
    to the previous choice point and find an alternative subsum. However, this does
    not guarantee the successful completion of the action. Other planners, such as
    ABSTRACT [41], use a hierarchy of representation levels. When it fails to complete
    a subaction, it could return to a more abstract level.


    However, truly intelligent systems should be more flexible in handling unforeseen
    events. If a robot cannot make a pizza with ham, maybe it should make one with
    bacon? Generalizing and substituting appropriate remains an ability for robots,
    using vector space models of semantics (e.g., BEAGLE [28]) offer a step in the
    right direction. Like neural networks, these models represent items (e.g., words)
    in a distributed fashion, using many-featured vectors with initially low similarity
    between random items. The model learns-say, by reading documents, item representations
    are updated to make them more similar (on a continuous scale) to continually similar
    items. These continually-updated representations can be used to extract semantic
    (e.g., part-of-speech) relationships between items. Beyond text learning, vector
    space models may ultimately be used to learn generalizable representations for
    physical properties and manipulations of objects and environments.


    # 9.2.4 Robotic Action Planning


    It is understood that reaching movements in humans have an initial ballistic,
    feedforward component, followed by a slower, feedback-driven component that corrects
    for error in the initial movement. As people become adept at reaching to targets
    at particular distances, a greater portion of their movement is devoted to the
    initial feedforward component, and less time is spent in the feedback component,
    thus speeding'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'happens should enable roboticists to make more adaptive, human-like motor planning
    systems for robots.


    In this line of research, Kachergis et al. [29] studied sequence learning using
    mouse movements. Inspired by earlier work of Nissen and Bulmer [38], sequences
    of longer sequences were acquired by human participants during a learning phase.
    The participants seemed to implicitly extract the sequences from longer sequences
    by showing faster response times and context effects.


    These findings cast doubt on simple chaining theory of sequential action. Rosenbaum
    et al. [39] interpreted these findings as evidence that sensory feedback is not
    a necessary component for action sequencing, in keeping with the conclusion of
    Lashley [34]. They argued that “the state of the nervous system can predispose
    the actor to behave in particular ways in the future (p. 526), or there are action
    plans for some behaviors. And yet, studies on spontaneous speech repair (e.g.,
    [36]) also show that people are very fast in fixing errors early components of
    a word or sentence, much too fast to assume that action outcomes are evaluated
    only after entire sequences are completed. This means that action planning cannot
    be excluded as Lashley [34] seemed to, but must include several layers of processing,
    with lower levels continuously checking whether the current action proceeds as
    expected. In other words, action planning must be a temporally extended process
    in which abstract representations to provide abstract goal descriptions, which
    must be integrated with lower-level subsymbolic representations controlling sensorimotor
    loops. The existence of subsymbolic sensorimotor representations accounted for
    context and anticipation effects, as described above.


    The main lesson for robotic motor planning is that purely symbolic planning may
    be too crude and context-insensitive to allow for smooth and efficient multi-component
    actions. Introducing multiple levels of action planning and action control could
    complicate the engineering considerably, but it is also likely to make robot action
    more flexible and robust—and less “robotic” to the eye of the user.


    # 9.3 ACQUISITION OF ACTION CONTROL


    # 9.3.1 Introduction


    In order for humans or robots to be able to achieve their goals, it is necessary
    for them to know what effect an action would have on their environment. Or, reasoning
    back, what actions are required to produce a certain effect in the environment.
    Learning relevant action-effects as an infant is a fundamental part of development
    and likely bootstraps later acquisition of general knowledge.


    In humans, learned action-effects seem to be stored bidirectionally. Following
    Lotze [35] and Harless [21], James [27] noted that intentionally creating'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# On the Crossroads of Cognitive Psychology and Cognitive Robotics ■ 179


    a desired effect requires knowledge about, and thus the previous acquisition of
    action-effect contingencies. The Theory of Event Coding (TEC; [25]) is a comprehensive
    empirically well-supported (for recent reviews, sees [23, 45]) theoretical framework
    explaining the acquisition and use of such action-effect bindings for goal-directed
    action. TEC states that actions and their expected effects share a common neural
    representation. Therefore, performing an action activates the expectation of relevant
    effects and thinking of (i.e, intending or anticipating) an action''s effects
    activates motor neurons responsible for achieving those effects.


    # 9.3.2 Human Action–Effect Learning


    # 9.3.2.1 Traditional Action–Effect Learning Research


    In cognitive psychology experiments, action-effect bindings are acquired by having
    humans repeatedly performing an action (such as pressing a specific button on
    a keyboard), after which an effect (such as a sound or a visual stimulus) is presented.
    After a certain amount of exposure to this combination of action and effect, evidence
    suggests that a bidirectional binding has formed. When primed with a previously
    learned effect, people respond robust but sensitive to the associated action [15].
    This action-effect learning is quite robust sensitive to action-effect contingency
    and contiguity [16].


    # 9.3.2.2 Motor Babbling


    Of course, action-effect learning does not only happen in artificial environments
    such as psychology labs. In fact, action-effect learning in humans starts almost
    immediately after birth [52] and some argue even before. Young infants perform
    uncoordinated movements known as body or motor babbling. Most of these movements
    will turn out to be useless, however, some of them will have an effect that provides
    the infant with positive feedback. For example, a baby could accidentally push
    down with its right arm while lying on its belly, rolling on it back and seeing
    sorts of interesting things. Over time, the infant will build up action-effect
    associations for actions it deems useful, and can perform motor actions of their
    intended effects.


    Having mastered the intricacies of controlling one own body, higher level action-effects
    can be learned in a manner similar to motor babbling. Eenshuistra et al. [14]
    give the example of driving a spacecraft that you are trying to slow down. If
    nobody instructed you on how to do that, your best option would probably be pressing
    random buttons until the desired effect is reached (be careful with self-destruct
    button!). Once you have learned this action-effect binding, performance in a similar
    situation in the future will be much better.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# 9.3.3 Robotic Action–Effect Learning


    The possibility that cognition be grounded in sensorimotor experience and represented
    by automatically created action-effect bindings has attracted some interest of
    cognitive roboticists already. For instance, Kraft et al. [32] have suggested
    a three-level cognitive architecture that relies on object-action complexes, that
    is, sensorimotor units on which higher-level cognition is based. Indeed, action-effect
    learning might provide the cognitive machinery to generate action-guiding predictions
    and the off-line, feedforward component of action control. This component might
    specify the invariant aspects of an action, that is, those characteristics need
    to be given for an action to reach its goal, to create its intended effect while
    an online component might provide fresh environmental information to specify the
    less goal-relevant parameters, such as the speed of a movement when taking a sip
    of water from a bottle [24]. Arguably, a system would have the benefit of allowing
    for more interesting achievements than the purely online, feedback-driven systems
    that are motivated by the situated-cognition approach [10]. At the same time,
    it would be more flexible than systems that rely entirely on the use of internal
    forward models [13]. Thus, instead of programmers imagining possible scenarios
    and enumerable responses, it might be easier to create robots that can learn action-effect
    associations appropriate to their environment and combine them with online information.


    In robots as well as humans, knowledge about one''s own body is required to acquire
    knowledge about the external world. Learning how to control your limbs-first separately
    and then (e.g., walking)-clearly takes more than even the first years of life:
    learning to roll over, crawl, and walk, we become very proficient. Motor babbling
    helps develop tactile and proprioception-as well as visual and even auditory cues
    of what our body in motion feels. Knowing these basic actions and their effects
    on ourselves (e.g., what hurts) provides the foundation for learning how our actions
    can affect environment.


    In perhaps the first study of motor babbling in a (virtual) robot, Kubernetes
    [33] showed how movement execution can form associations between a perceived object-in-hand
    position and the corresponding arm position. This association is bidirectional,
    and as in line with ideomotor (or TEC) theory. We (and others, e.g., [11]) believe
    that such bidirectional bindings help robots overcome traditional problems, as
    inverse model learning from a forward model.


    More recent investigations in robotic motor babbling have extended and optimized
    the method to behavior that we would consider learning in humans. For example,
    Saegusa et al. [42] robotically implemented a sensorimotor learning algorithm
    that organized learning in two phases: exploration and learning. In the exploration
    stage, random movements are produced,'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# On the Crossroads of Cognitive Psychology and Cognitive Robotics ■ 181


    while in the learning stage the action-effect bindings (or, more specifically,
    mapping functions) are optimized. The robot can then decide to learn bindings
    that have not yet been learned.


    # 9.4 DIRECTIONS FOR THE FUTURE


    # 9.4.1 Introduction


    Many questions remain with respect to the acquisition and skillful performance
    of not only well-specified, simple actions (e.g., reaching to a target) but of
    complex actions consisting of various components and involving various effects.
    Indeed, how we create a learning algorithm that can go from basic motor babbling
    to both goal-directed reaching, grasping, and manipulations of objects? To accomplish
    this obviously difficult goal, it will be beneficial for psychologists to study
    infants'' development of these abilities and beneficial for cognitive roboticists
    to learn from more


    # 9.4.2 Affordance Learning


    Object perception and use is an indispensable activity for robots working in human
    environments. Perceiving object affordances-i.e., what a tool can do for you or
    how you can use object-seems to be a quick, effortless judgment for humans, in
    many cases. For example, when walking around and seeing a door, you automatically
    pull the handle to open it.


    One of the ways robots perform affordance learning is by motor babbling stage
    a robot applies randomly chosen behaviors to a tool and observes simple objects
    as manipulators (e.g., [47]). In a so-called behavioral babbling stage a robot
    observes observes their effects on an object in the environment. Over time, knowledge
    about the functionality of a tool is acquired, and can be used to manipulate a
    novel object with the tool.


    As impressive as this may sound, this approach does not allow for easy generalization,
    and the robot cannot use this knowledge to manipulate objects using similar, tool.
    More recent approaches, as demonstrated by Jain and Inamura [26] infer functional
    features from objects to generalize affordances to unknown objects. These functional
    features are supposed to be object invariant within a tool category.


    In humans, an approach that seems successful in explaining affordance is based
    on Biederman''s recognition-by-components theory [6]. This theory allows for object
    recognition by segmenting an encountered object in elementary geometric parts
    called geons. These are simple geometric shapes as cones, cylinders and blocks.
    By reducing objects to a combination of more elementary units invariance is increased,
    simplifying object classification. Biederman recognized 36 independent geons,
    having a (restricted) generative power of 154 million three-geon objects.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# 182 ■ Cognitive Robotics


    In addition to being useful for object classification, geons can also be used
    to infer afford. For example, a spoon is suitable for scooping because its truncated
    hollow sphere at the end of its long cylinder allows for containing things, and
    an elongated cylinder attached to an object can be used to pick it up.


    One promising example of the use of geons in afford inference is demonstrated
    by Tennor and Beetz [50]. This technique matches objects to three-dimensional
    CAD models from a public database such as Google Warehouse. These models are segmented
    into geons, which makes afford inference possible.


    However, the afford that geons give us to be learned in some way. Teaching robots
    to infer what a tool can be capable of remains difficult. Ultimately, we want
    afford to develop naturally during learning: by watching others, from verbal instruction,
    or from embodiment. Task context is also an important aspect of afford learning:
    depending on the situation, a hammer can be used as a lever, a,, a missile, or
    a hammer. To understand how context affects action planning, studying naturalistic
    scenes and human joints seems essential (cf. [2]).


    Learning geons can be generalized to object afford in robots, although it is early
    to say whether this or other recent approaches will be better. For example, deep
    neural networks use their multiple layers along techniques to avoid overfitting
    to learn high-level perceptual features for discriminating objects. The representations
    learned by such networks are somewhat more biologically-plausible geon decompositions,
    and thus may be more suitable for generalization (although cf. [48]) for generalization
    problems with deep neural networks.


    # 9.4.3 Everyday Action Planning


    A major obstacle in the way of robots performing everyday actions is the translation
    of high-level, symbolic task descriptions into sensorimotor action plans. In order
    to make such translations, one method would be to learn the other way: by observing
    sensorimotor actions, segment and classify the input.


    Everyday action is characterized by sequential, hierarchical action subsequences.
    Coffee- and tea-making tasks, for example, have shared subsequences such as adding
    milk or sugar. Moreover, the goal of adding sugar might be accomplished in one
    of several ways: e.g., tearing and opening from a packet, or spooning from a bowl
    or box. Also, these subsequences do not necessarily have to be performed in the
    same order every time (with some constraints, of course). It is this flexibility
    and ability to improvise that makes everyday action natural for humans, yet so
    hard for robots.


    Cogn models that represent hierarchical information have been pro-'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# On the Crossroads of Cognitive Psychology and Cognitive Robotics ■ 183


    posed (e.g. [12], [7]), but differ in the way they represent these hierarchies.
    One approach explicitly represents action hierarchies by hard-coding them into
    the model—hardly something we can do for a general autonomous robot—whereas the
    latter models hierarchy as an emergent property of the recurrent neural network.
    More recently, the model put forth by Kacheris et al. [30], uses a neural network
    with biologically plausible learning rules to extract hierarchies from observed
    sequences, needing far fewer exemplars than previous models.


    # 9.5 CONCLUSION


    In this chapter, we have discussed several concepts that are shared between cognitive
    robotics and cognitive psychology in order to argue that the creation of flexible,
    true autonomous robots depends on the implementation of algorithms that are designed
    to mimic human learning and planning. Thus, there are many relevant lessons from
    cognitive psychology for aspiring roboticists.


    Ideomotor theory and its implementations as TEC provide elegant solutions to action-effect
    learning. Robotic motor learning algorithms that use motor babbling to bootstrap
    higher-order learning seem to be promising, and require little a priori knowledge
    known by the programmer, ultimately leading to more flexible robots.


    Generalization of action plans is still a very difficult problem. Inferring hierarchical
    structure of observed or learned action sequences to be a promising approach,
    although the structure of everyday action seems to be as nuanced and intricate
    to untangle the structure of human natural language—and less well-studied, at
    this point. Again, we believe that biologically inspired learning models as LeabraTI
    can play a role in making robotic action more human-like.


    The overlapping interests of cognitive robotics and cognitive psychology has proven
    fruitful so far. Mechanisms like motor babbling and affordance inference, are
    extensively studied in humans, provide robots with techniques to make their behavior
    more flexible and human-like. We believe human inspiration for robots can be found
    at an even lower level by biologically-inspired models for learning in robots.


