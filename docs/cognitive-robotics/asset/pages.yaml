    # 1.7 SUMMARY AND CONCLUSIONS


    The expansion of the robot society will carry with it a massive increase in the
    number of robots every conceivable type, and a corresponding increase in the number
    of robot accidents. Entertainment robots will flourish as consumer products and
    therefore accidents in the home and places of entertainment will account for a
    significant proportion of all robot accidents.


    Since the mid-1980s almost all of the discussion on how society might react to
    robot accidents of the future has been based on the assumption that the remedy
    should lie with the law courts. A small but informative body of case law, both
    of which have convinced me that, if left unchecked, the litigation of robot accident
    cases will inevitably swamp the courts in all countries where robots are plentiful.
    One of the negative effects of all this litigation is that the growth of robots
    as a research field and as a branch of commerce will be stunted because commercial
    robot development, manufacture and marketing will become such risky businesses.


