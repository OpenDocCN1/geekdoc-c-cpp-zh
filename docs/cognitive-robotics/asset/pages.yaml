  md: '# Effects of Cultural Context and Social Role on HRI 119


    # 6.3 EFFECTS OF ROBOTS'' SOCIAL ROLE: AUTONOMY LEVEL AND GROUP ORIENTATION


    # 6.3.1 Social Robots


    The rapid development of robotics technologies leads to the continuous extension
    of applications of robotics. With the popularity of service robots, more and more
    robots appear in public service and home support contexts. There are generally
    two types of service robots: instrumental robots and social robots [33]. Instrumental
    robots have advantages over industrial robots and provide humans with a convenient
    life. For example, the Roomba vacuum-cleaning robot produced by iRobot can clean
    rooms [13]; the hospital robots produced by Panasonic can deliver food, medicine,
    documents, instruments and even patients [1]. According to the demands of functions,
    instrumental robots are usually designed in a machine-like manner. The interfaces
    of instrumental robots are designed with the most effective and direct methods
    to receive and transfer information. There will be no feedback from this type
    of robot.


    Social robots are a new application of robots. To interact at close range with
    users is one of the major purposes of this type of robot. Compared with robots
    and instrumental robots such as service robots, social robots are more autonomous
    and communicative and more often used in entertainment, education, health care,
    research and development, and public places [2].


    While communicating with others, users will display social behaviours naturally,
    such as talking in natural languages, transferring information body language,
    maintaining interpersonal distance and so on. Previous research indicates that
    communicating with artificial objects with enough intelligence and complexity
    others represent the real world, users will also display social behaviours. For
    example, observers will characters on TV or the virtual people generated by computers
    have social attributes, the observers perform social behaviours with them [30].
    When social robots have social attributes, they will encourage users to perform
    social behaviours with them in order to realise social interaction.


    # 6.3.2 Autonomy Level of Robots


    The autonomy of robots is a major design factor, which will influence users''
    engagement, mental workload, psychological cognition of the interactive objects,
    the performance level and so on. Among the various standards which evaluate robots''
    autonomy, autonomy level is a commonly used standard in used-centred design. Autonomy
    level describes which degree robots can act according to established procedures
    or patterns [23]. Sheridan and Verplank [32] developed a scale to explicitly compare
    different mixes of human and robot decision-making. This scale includes ten levels
    of autonomy'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Cognitive Robotics


    going from the lowest level wherein the human operator does everything to a level
    wherein the robot does everything. The ten levels are described in the following
    manner (we replaced “computer” in the original book with “robot”):


    +   1) human does everything up to the point of turning it over to the robot to
    implement;

    2) robot helps in determining the options;

    3) robot helps determine options and makes suggestions, which the human need not
    follow;

    4) robot selects action and human may or not do it;

    5) robot selects action and implements it if human approves;

    6) robot selects action but informs human with plenty of time to stop it;

    7) robot does whole job and necessarily tells human what it did;

    8) robot does whole job and tells human what it did if human explicitly/she asks;

    9) robot does whole job and tells human what it did if it decides he/she should
    be told;

    10) robot does whole job if it decides it should be done, and if so tells human
    if it decides he/she should be told.


    The research of Siegel [33] from MIT Lab provided some support for the effects
    of robots'' autonomy over their persuasion ability. In their experiment, participants
    were made to trust that the robots were cooperating with 1) a full autonomy level
    or 2) were operated by an experimenter remotely. During the experiment, robots
    tried to persuade participants to donate more money to them. According to the
    results, while cooperating with the robots, which were believed to have no autonomy
    (controlled by an experimenter remotely), participants thought the robots with
    a full autonomy level were more reliable, and at the same time they showed higher
    engagement, while the male participants rated the autonomous robots lower.


    Because of the current application of social robots, there are two major control
    methods of robots in experiments—controlled by operators or by pre-programmed
    methods. For both control methods, it is not common to expose participants fully
    to the control mechanism. In real-life applications, it is not easy to control
    how participants perceive the autonomy level of the robots. The perception of
    robots'' autonomy level varies largely with participants'' background, experience
    of robots and knowledge levels.


    # 6.3.3 Group Orientation


    Group orientation includes in-group orientation and out-group orientation. Triandus
    and his colleagues [36] defined a commonly referred conception of in-group relations
    - those relations people are to be maintained. More specifically, people care
    about the welfare of in-group members, people try to cooperate with in-group members
    and not ask for equal returns. Even'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Effects of Cultural Context and Social Role on HRI 121


    somebody in the group makes them feel uncomfortable, people won’t leave the group.
    On the other hand, out-group relations are defined as those relations people are
    not required to maintain - people do not care about the welfare of out-group members
    and people ask for equivalent returns while cooperating with out-group members
    [12].


    Research has indicated that the same group orientation could improve the cooperation
    of in-group members and this cooperation intention originated from in-group favourism
    and positive evaluation of in-group members [3, 5, 17]. The positive cooperation
    of in-group members would emerge through grouping by task-related factors. The
    research of Terry and Hogg [34] further indicated that the participants who had
    a stronger sense of belonging to groups were more easily influenced by other in-group
    members if they were grouped by random factors.


    To encourage humans and robots to form in-group relations, Ever, Mandel, Brodecki
    and Hinds [8] conducted a survey to find the most history of interaction with
    interactive objects and experience of successful cooperation. In the following
    experiment, the researchers developed two. In the following experiment, the researchers
    developed two treatment levels of this factor. In the experiment groups, participants
    and robots built up in-group relations, while in the control groups, participants
    and robots did not build up in-group relations. In the post-experiment questionnaire,
    there was no significant difference in cognition of relations towards in-group
    robots between participants in the experiment groups and those in the control
    groups.


    Another experiment of HRI also did not find any differences in the relations with
    in-group robots [39]. In this experiment, signs of different colours were used
    to distinguish in-group/out-group relations. There were no significant difference
    in different coloured settings while participants interacted with robots. However,
    while participants interacted with humans, significant differences were found
    among different settings.


    Another experiment indicated that when participants considered a robot as their
    in-group member, they would rate the robot as reliable and trustworthy, and they
    more easily accepted the robot’s recommendations [44]. The result of this experiment
    showed that in-group favouritism also existed in human-robot interactive groups.
    However, it should be noted that the methods of building human-robot interactive
    groups might be different from the methods of group building among humans.


