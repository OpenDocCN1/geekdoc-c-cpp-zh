    # 1.4.2 Robots and the Laws of Negligence


    Negligence in a legal sense occurs where there is a duty of care and someone suffers
    harm if that duty is not properly discharged. The level of care expected is that
    which “reasonable” person would apply in the circumstances under which the harm
    occurred. One of the complications in establishing such a breach is that different
    standards can reasonably be expected of different defendants, for example doctors
    are held to a higher standard of medical care than nurses.


    A further element necessary to establish negligence in a court case is something
    called “causation” — did the defendant cause the harm to the plaintiff? Peter
    Asaro gives a succinct explanation:


    > > “Legally culpable forms of negligence depend upon either failures to warn,
    or failures to take proper care. A failure to warn occurs when the manufacturer
    was knowingly aware of a risk or danger but failed to notify consumers of this
    risk. This is the reason why there are now so many labels warning on various products

    > .... A failure to take proper care or avoid foreseeable risk is more difficult
    to prove in court because it is more abstract, and involves cases where the manufacturer
    cannot be shown to have known about a risk or danger from the product. In these
    cases, it is argued that the given danger or risk was in some sense obvious or
    easily foreseeable, even if the manufacturer failed to recognize it. In order
    to prove this, lawyers often bring in experts to testify that those risks were
    obvious, and so forth.”


    While the concept of legal negligence is not very difficult to understand, it
    will be no easy task for the court to determine negligence in robot cases. Samir
    Chopra and Laurence White, in their book “A Legal Theory for Autonomous Agents,”
    provide us with examples of arguments, relating to robots, that could open the
    flood gates to lawsuits for negligence, including these:


    +   1 Robots can be handled carelessly or dangerously.


    +   2 An operator may not take proper care in programming or configuring a robot
    before making it available to users.


    +   3 If the operator makes a robot available to a user who is not adequately
    informed how to use the robot could theoretically give rise to liability.'
