  md: ALREADY mankind has begun to embrace the "robot society." In 2005 the government
    of South Korea announced its intention to have a robot in every household by 2020.
    And the Japanese Robot Association predicts that Next Generation Robots will generate
    up to $ 65 billion of economic
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 4 Cognitive Robotics


    activity by 2025. Also in Japan efforts have been under way for some time to ensure
    that, before long, elderly members of the population will routinely have robots
    to care of them. Meanwhile, at many universities and other research centres, robots
    of just about every flavour are a hot topic.


    # 1.1 INTRODUCTION


    Clearly robots will soon be assisting us in many different aspects of our lives,
    becoming our partners in various practical and companionable ways and entertaining
    us. An early example in the field of entertainment was a ballroom dancer robot
    that was unveiled in 2005 at the World Expo in Japan. It did not have usable legs
    but moved on wheels.


    Let us consider the following scenario, perhaps ten years from now, when dancing
    robots have movable legs and possess the skills for a variety of dance steps,
    such as waltz, foxtrot, rumba, ... One evening a young lady Laura is at a dance,
    partnering with a robot. The band strikes up with the music for a cha cha but
    performs so badly that the robot mistakes the music for a tango. So Laura and
    her robot partner are holding each other at dancing and very soon they fall over.
    The robot lands on top of Laura, and being quite heavy, breaks off her legs. Laura’s
    father is furious, and his lawyers, telling them to commence legal proceedings
    immediately and "throw the book at them."


    But who should show their lawyers the book? Should it be the dance hall, or the
    online store that sold the robot to the dance hall, or the manufacturer of the
    robot, the robot’s designers, should it be the independent software house that
    programmed the robot’s tune recognition software, or the band leader, or even
    the band of musicians for playing the cha cha so badly?


    Some months later the trial begins with all of these defendants. Expert witnesses
    are called - experts on everything from robot software to motion sensor engineers
    to the principals of dance music academies. What do you think would be the result
    of the trial? I''ll tell you - the lawyers do get very nicely thank you.


    As technology advances, the proliferation of robots and their applications will
    take place in parallel with their complexity. One of the disadvantages of these
    will be a corresponding increase in the number of robot accidents and wrongdoings.
    How will legal systems be able to cope with all the resulting court cases? In
    fact, will they be able to cope? The answer, is "No."


    In this chapter, I am going to address the questions: What should happen when
    something goes wrong? Who, or what, is responsible? And above all, how should
    society deal with an ever-increasing number of robot accidents. All developed
    countries will be faced with these problems, and all countries need to adopt legally
    and ethically sound approaches to finding solutions to them.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'When Robots Do Wrong ■ 5


    # 1.2 BLAME THE ROBOT?


    Even though a robot is a manmade object, one superbly reasonable way to apportion
    blame for a robot accident or wrongdoing would be to blame the robot itself. Many
    people support this idea because robots are autonomous. I shall discuss three
    possible approaches to this particular argument:


    +   a. A robot should be regarded as a quasi-person;

    b. A robot should be regarded as a quasi-animal; and

    c. A robot should be regarded as neither, but simply as a product, a manmade object,
    period.


    # 1.2.1 The Robot as a Quasi-Person


    As computer software, and therefore robots, gain in intelligence, many of us will
    come to accept that their mental capabilities have a childlike quality. Leon Wein
    argues that a robot’s capacity to make decisions and act on them enables them
    to:


    > “operate in a manner identical to that of humans ... society may have no choice
    to accept machines as “legal persons” with rights as well as duties.”


    These duties will include the obligation to act in a manner that would be considered
    reasonable if it were human behaviour. The same obligation applies to corporations,
    which, despite being human, have legal rights and responsibilities and can be
    punished for their transgressions and negligence. This possibility, punishing
    corporations, points the way to the concept of punishing robots, by finding them
    for example.


    # 1.2.2 The Robot as a Quasi-Animal


    Some researchers argue that robots, like animals, are autonomous, society can
    justify blaming robots for their accidents.

    For the purposes of attributing legal responsibility for accidents and wrongings,
    the analogy of robots as domesticated animals is a concept that has gained a fair
    measure of support in the recent literature. Richard Kelly and his colleagues
    at the University of Nevada draw an analogy between the different breeds of dogs
    and the different functions performed by robots. For example, a Roomba vacuum
    cleaner robot is analogous to a breed of dog that is largely harmless, but as
    an unmanned aircraft drone, especially if it is armed, is analogous to a dangerous
    breed. And for “dangerous” robots Kelly'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 6 Cognitive Robotics


    and his colleagues suggest bans or restrictions similar to those imposed on the
    owners of dangerous dogs. But for robots that are considered “safe,” such small
    toys or service robots, they do not advocate any such restrictions. Based on these
    analogies they propose having different laws pertaining to different types of
    robot, extending to serious criminal penalties in some cases for the owner of
    a “dangerous” robot that causes damage.


    In his classic 1981 paper “Frankenstein Unbound,” Sam Lehman-Wilzig suggests that
    the punishment of dangerous robots and their owners could be achieved by “rehabilitating”
    the robot, in other words reprogramming the culprit. He also proposes, for severe
    offences, putting a robot to work for the benefit of its human victim(s), in order
    to make restitution for the robot’s wrongdoing. Lehman-Wilzig has pointed out
    that, as they grow more intelligent, the level of damage that robots inflict becomes
    greater, perhaps the onus of responsibility for their accidents should shift to
    their owners or end-users. On this basis he argues that the principles applied
    to dangerous animals should also be applied to robots. However, I believe that
    no matter how intelligent an animal might appear, it should always be the owner
    (or handler) rather than the animal himself should be held culpable for any accident
    or mishap that the causes.


    # 1.2.3 The Robot as a Manmade Object


    Not everyone will come to accept the concept of robots as quasi-persons or quasi-animals,
    leaving us to regard robots as more than manmade objects.


    From a legal perspective the relationship between owner and robot is known as
    “agency”. — the owner acts by means of (or through) their robot, because the robot’s
    actions are generally commanded by the owner/operator. The legal principle of
    agency is that “he who acts through another is deemed in law to do it himself”,
    and therefore, under some circumstances, it is the owner/operator who, through
    their agent (the robot), is legally responsible for a robot accident or wrongdoing.


    # 1.2.4 Punishing the Robot


    Those who believe that it makes sense to blame the robot itself for its accidents
    and wrongs, need to consider how the robot might be punished. This is hardly a
    novel question. In 1985 Robert Freitas Jr. discussed some of the complications
    surrounding robot punishment in his seminal paper “The Legal Rights of Robots,”


    > Robots could be instantly reprogrammed'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# When Robots Do Wrong


    but is running mild-mannered “Personality M” when collared by the police. Is this
    a false arrest? Following conviction, are all existing copies of the criminal
    software package guilty too, and must suffer the same punishment? (Guilt by association?)
    If not, is it double jeopardy to take another copy to trial?


    And to Freitas’s comes Yorick Wilks added an even more drastic solution:


    > But what can we say of “machine punishment?” A machine can be turned off and
    smashed and the software will either go with it, or be burned separately, provided
    we know we have all the copies!


    If we forward a quarter of a century from Freitas’s paper, to the year 2010, we
    find Gabriel Halley’s more detailed examination of the context of punishment for
    an artificial intelligence, within the context of criminal law. Halley evaluates
    five different types of punishment typically imposed on the guilty in human criminal
    courts, and he considers the applicability of each type to AI entities. These
    punishments are: the death penalty, imprisonment, a suspended prison sentence,
    a fine, and community service.


    Clearly the death penalty is the most effective method of preventing an offender
    from reoffending, and the corresponding practical action for achieving an equivalent
    result with robots is the deletion of its software, thereby rendering the offending
    robot incapable of committing any further offences. This assumes of count that
    we accept, as a different robot, a new robot “brain”, i.e. its software, in a
    pre-existing robot body. Failing such society would need to rely on Wilks’s solution
    and destroy all copies.


    What of imprisonment? The practical action corresponds most closely to imprisonment,
    is to disable it for a specified period. Passing a prison sentence on a robot,
    or a suspended sentence, would only have an effect if the robot has been programmed
    to *dislike* the idea of being deactivated (imprisoned).


    If a robot is deemed to own money or some other form of property, imposing a fine
    on it has an analogy in fining a corporation, because neither is human. When robots
    are able to earn money through their “work” the idea of a robot being fined will
    not seem to be at outlandish, but just as reasonable as fining a corporation.


    Community service is another form of punishment which for humans requires the
    offender to contribute their labour to the community. As Halley points out, an
    AI entity will be able to take on “all sorts of jobs,” and therefore:'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Cognitive Robotics


    “The significance of community service is identical, whether imposed on humans
    or AI entities.”


    From Hallevy''s analysis can be argued that most of the types of punishment commonly
    applied in our courts to human offenders are also applicable, albeit sometimes
    in different forms, to robots, because the nature of these penalties remains the
    same relative to humans and to robots. Peter Asaro queries the whole concept of
    punishment for robots, asking the questions: Can punishing robots be viewed as
    a deterrent? Can it achieve justice? And in discussing the relevance of physical
    punishment for robots Asaro comments that:


    “The various forms of corporal punishment presuppose additional desires and fears
    of being human that may not readily apply to robots as pain, freedom of movement,
    mortality, etc. Torture, imprisonment and destruction are not likely to be effective
    in achieving justice, reform or deterrence in robots. There may be a policy to
    destroy any robots that do harm but, as is the case with animals that harm people,
    it would be a preventative measure to avoid future harms rather than a true punishment.


    In addition to Asaro''s arguments concerning the problematic nature of punishment
    for robots, I can see additional levels of complexity in the concept. One of these
    is the matter of deterrence. If a robot is to be deterred by a fear of some form
    of punishment it must be programmed to recognize that it is contemplating an action
    regarded by society as being contrary to civil or criminal law. And, it must also
    be programmed with some sort of artificial emotionally-driven impetus to “dislike”
    the corresponding punishment for that offence.


    The other level of complexity that I believe deserves serious consideration, concerns
    how to deal with robots that are identical to one that has committed an offense.
    If the err robot misbehaved because of faulty hardware or the corruption of part
    of its software, we can argue that all bug-free copies of the same type, model
    and version of the robot, should be immune from any punishment imposed for a specific
    case of an offence committed by the buggy robot. But if the fault lies in the
    hardware design or in the programming of the software, then it would seem logical
    to punish all copies of that robot, since society would be invoking sanctions
    against the design or programming itself rather than a particular copy of it.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# When Robots Do Wrong ■ 9


    # 1.2.5 Blaming the robot itself — Summary


    If blaming the robot itself is to be justified on the grounds that robots are
    quasi-persons or quasi-animals, it logically follows that the robot itself should
    be punished, but I find Asaro''s arguments against the merit of punishing robots
    and if robots are regarded as nothing than manmade objects, then the question
    of how to attribute blame for a wrong will take us into the realm of product liability.
    Is the product (robot) defective? And if so, is it fair to blame the robot at
    all? Human defenders are sometimes able to escape blame on the defence that they
    were of “unsound mind” at the moment of their offence, so for robots with design
    or manufacturing faults the answer must surely be “No”. It is not fair. Justice
    will not be served by blaming the robot.


    All things considered, I do not believe that blaming the robot is a sustainable
    approach to the problem of how society should react to a robot accident.


    # 1.3 BLAMING HOMO SAPIENS


    If robots are not to blame for causing their accidents, the blame must therefore
    fall on humans: sometimes just one person, sometimes few individuals, sometimes
    collectively as is the case with corporations, hospitals, factors, or whatever
    other body might be responsible in some way for the robot in question. And the
    blame will either be due to product defects — what the law refers to product liability
    - or to product misuse, otherwise known as negligence.


    # 1.3.1 A Question of Trust


    Before I discuss the liability and negligence laws as they may be applied to the
    use of robots, I want to ask the question — how should an owner/operator of a
    robot reasonably behave and perform? Knowing the answer to this will help a court
    to determine, for example, if a robot名叫 came because the robot was faulty, or
    because its operator incorrectly expected the robot to perform differently from
    the way in which it was designed to do, or because the operator misused or instructed
