    obtain the pragmatics or speech acts from the dialogue content semantics. Since
    the mind states are essentially unobservable, we cannot confirm whether the pragmatics
    in a dialogue sequence of inferred speaker acts are indeed the true intentions
    (or speech acts) of the speakers. Therefore, we distinguish between two different
    dialogue sequences:


    +   a coherent semantic sequence, in which all the dialogue semantics of speech
    acts in the dialogue sequence can be treated as pragmatics and no conflict in
    dialogue contexts of these speech acts can be found in the sequence; and


    +   an incoherent semantic sequence in which the dialogue semantics of speech
    acts are treated directly as pragmatics, and if so, the dialogue contexts of certain
    speech acts might be in conflict with their true pragmatics.


    Dialogues in the emergent narratives are generally incoherent semantic sequences,
    and therefore, we must find an explanation of the most likely pragmatic act sequence
    for a given dialogue sequence. To achieve this, we should make aware the dialogue
    contexts in the agent conversation.


    # 8.3 MODEL SPEECH ACTS AS DIALOGUE CONTEXT CHANGE


    All physical actions must obey physical laws to be executable. A physical action
    usually only be applied when preconditions in the action model are matched. In
    contrast, the speech act model is less rigid than the physical action model, because
    agents can carry out any speech act at arbitrary situations without restrictions.
    However, if dialogues are conducted in arbitrarily manner, they could become odd
    and not be easily understandable. Therefore, in order to make agents understandable
    each other in dialogue interaction, speech acts must be triggered or applied at
    proper contexts even they do not rigid constraints. We assume that a speech act
    can be triggered by a partial match with related dialogue contexts. For example,
    the proper dialogue contexts for a beg speech act to be selected are the emotion
    context: negative and the institutional relation: subordinate-to-superior. That
    is for a virtual agent to beg someone, he should feel a negative emotion and he
    is subordinated to the person whom he is begging. However, an agent might still
    beg someone by a private reason even they did not experience the negative emotion.


    In 8.2, we illustrate the flow how an agent uses a speech act to change participants''
    mind states. First, agents choose a speech act according to his/her mental states.
    When the speech is expressed, every participant can receive the speech act together
    with physical context information from the environment. In the ending phase, each
    participant''s mental states could be affected as the effects of the speech act.
    The next speaker starts to choose another speech act in the next phase of dialogical
    interaction.'
