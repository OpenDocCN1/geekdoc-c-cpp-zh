    # 5.3.3 Shape-Changing Surfaces


    In addition to the larger design choices, specialised study groups have focused
    on examining how users perceive the kinetic parameters of shape-changing interfaces.
    We will briefly describe an example of this work in which the students designed
    and built functional prototypes to support user evaluations of interactions involving
    pixel-based and homogeneous shape-changing surfaces.


    Two master students have researched into how users perceive the interaction, motion
    and utility of shape-changing interfaces and evaluated prototypes through simple
    evaluations²


    The study was conducted with functional prototypes surfaces that supported and
    actuated a mobile phone that was on it. System is pixel-based, with a control
    console composed of switches, sliders, and dials that enable the student participant
    to make adjustments to the sensitivity of the interaction, speed, and modes of
    actuation. The other prototype presented a homogeneous surface with a membrane
    covering that hides the actuation mechanics to facilitate a comparison for the
    participants.


    The pixel-based prototype consisted of 100 tiles, in which 32 were actuated, yet
    remained as visual cues to suggest a high resolution area. The 32 tiles were placed
    in an 8x4 grid, where each row of 4 tiles were interconnected. Each row could
    act 4 cm below the surface of the prototype and 5 cm above, a total of 9 cm linear
    actuation.


    The evaluations were conducted in a public setting, whereas passers-by were invited
    to participate in a pre-defined use case with the pixel-based prototype. This
    served as a way to test how users perceive and understood the shape-changing interface
    by interacting with a smartphone and the surface as an inductive charging platform
    as the setting for the experiment. The prototype served as a vision of how a smartphone
    could be placed on a surface for charging, whereas the shape-changing surface
    would actuate according to the battery level of the smartphone. If the smartphone
