    haps the most common constraints include actuator size, weight, mounting requirements,
    efficiency, power consumption, material composition, control characteristics,
    among others. There continues to advances in research showing improvements to
    the fluidity of movement and reducing actuator noise [47], however, for the purposes
    of this chapter, we draw on the movement and other aesthetic qualities involved
    with existing and commonly available actuators. Through observation and feedback
    from the designers in our courses, we gathered about some of these incidental
    effects involved typical actuators including considerations of sound, heat, and
    qualities of movement. This contribution is not comprehensive, but we hope that
    it fosters discussion about actuators to support design intentions and to consider
    the incidental effects as a resource to be embraced.


    discussed this in [28], however we provide not only their technical insights and
    invite designers to consider their choices for actuators, but to look for ways
    to design the use of the actuators exploiting the underlying potentials. For example,
    industrial designers focusing on psychoacoustics have examined the perception
    of sound associated with car doors, electric train motor noise and how this can
    elicit emotions and perceptions [8, 34].


    This table is very brief and distills some of the challenges faced by the designers
    in the work presented earlier in this chapter and from other projects in our classes.
    It can be useful for designers when selecting actuators, to identify what are
    likely challenges with a chosen technology, and when a desired effect is in-helping
    to find actuators that might support the needs through the inherent qualities.
    We briefly describe an example of the design issues related to a project which
    helped to build this table.


    The Kinetic Wave utilized stepper motors to raise and lower individual rings by
    winding and unwinding wire from spools. The designers chose the stepper motor
    for its ability to support smooth and precise movements that could be coordinated
    with the 12 rings, however, they took much care in dealing with the sound of the
    motor movements. At certain frequencies, and as the speed increases, there are
    ''bands'' in which resonant frequencies resulted in amplified noises that would
    cause a buzzing sound in the frame of the art piece. The designers used rubber
    bushings to mitigate the effects of the noise, however, they took care in crafting
    the control curve for the rings to minimize the noise. They did experiment with
    controlling the stepper motors to strike a balance between speed and resulting
    sound, thus actuating the light and movement with the sound characteristics. Other
    challenges that were faced in the project involved the linkages and joints that
    connected the stepper motors to the spools. The designers used laser cut parts
    that, in principle, should be very accurate, the cuts in different materials (wood,
    acrylic, MDF) resulted in different amounts of material consumed by the cut. Although
    the differences were small, these small differences introduced a noticeable wobble
    that would produce a secondary movement when rotating'
