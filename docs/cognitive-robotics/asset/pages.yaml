  md: 'imagine that the wheels is fixed to the body of the car and rotate around the
    axles. However, when we consider the Etch a Sketch, it involves only physical
    elements, yet the mechanics that connect the turning of the knobs to the drawing
    that appears on the screen is hidden. Through use, the operator develops a mental
    model for mapping the movement to the drawing that unfolds, the left know always
    moves the cursor vertically and the right know always moves the cursor horizontally.


    In the example ofIncreTables [22] system, there is a mix of physical and virtual
    objects that build the experience. In system, the table surface is augmented with
    sensing to connect the virtual and real world events. The table surface appears
    as a virtual landscape with virtual dominoes. On top of the table, physical dominoes
    are arranged in patterns that join up to the virtual dominoes. The system supports
    the crossing over the dominos following from the virtual and real world–thus a
    virtual domino can knock over a real domino in the game experience. In system,
    the designers choose to match the physics that govern movements seem to as consistent
    as possible in the virtual world and physical world. However, since the movements
    are intrinsically connected to introduce behaviors that challenge the expectations
    of the participant.


    The speed of the virtual objects could be adjusted, going beyond what is possible
    with physical objects, collisions could be randomized or behaviors of the dominos
    following could become volatile in various ways. It is possible that with virtual
    elements shape-changing interfaces involve designed elements that are unpredictable,
    and include behaviors that seem to change without causality and that would require
    imagination if not cause complete fusion.


    In taking a step back, it seems that the range of objects could be placed in a
    three dimensional design space as 5.8 with axes describing the material and interactive
    features physical/virtual, volatile/consistent, and hidden. Objects could involve
    physical or virtual elements or combination in IncreTables [22]. The rules of
    physics could be consistent and predictable or volatile (changing erratically).
    The third dimension deals with causality, the rules of physics can be shown to
    the user and make visible through form elements is as is the case with a bicycle
    chain and sprocket, and they can be hidden by “black box” technologies that hide
    the mechanics of physical behaviors.


    More depth analysis of interactive systems according to these diagrams will likely
    lead to refinements of the models – we hope this future will inform the design
    of inspiring shape-changing objects. For example, it may be difficult to consider
    an object that is mainly physical, with visible mechanics enabling the shape change
    yet that are volatile in their behaviors. The creat Splitsly, if made according
    to the designers’ vision of using programmable matter, could be such a system.


    The concept of imagined physics is interesting because it treads on HCI'
