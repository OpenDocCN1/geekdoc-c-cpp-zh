    In the following sections we will discuss the difference between speech acts against
    physical act and explain how dialogue contexts can be expressed in terms of agent
    mental states in section 8.2, and our proposal of modeling speech act as dialogue
    context change in section 8.3. In section 8.4, we elaborate the dialogue context
    as physical context, emotion model, social relation, role, personality, and preference
    and show in section 8.5 how a speech act can be expressed in terms of these dialogue
    contexts with probabilities attached to conditions. In section 8.6, we use the
    sequential effects of speech acts in dialogue sequence that will lead us to the
    computation model of Dynamic Bayesian Network (DBN) to conduct context awareness
    reasoning. Evaluation of our models and methods are explained in section 8.8 for
    many aspects. First, we show how emotion of a movie character can be inferred
    from dialogue sequence in subsection 8.8.2. Second, we show how sensitive a DBN
    model can cope with noise in speech act input in 8.8.3. Third, evaluate the feasibility
    of prediction pragmatic inference based on semantic act sequence with or without
    social contexts in subsections 8.8.4 and 8.8.5. In section 8.9, we make conclusion.


    # 8.2 SPEECH ACT AND DIALOGUE CONTEXT


    What is a speech act? Each utterance in a dialogue can be viewed as an action
    that is similar to a physical action that has preconditions as feasible conditions
    for the physical act to be carried out and effect conditions as possible outcome
    states that can be resulted after the action is completed. However, the speech
    act are mostly conditioned by the mental states of agents and possible influence
    the mental states of other agents. The advantages of modeling speech acts to social
    context awareness is due to the social context changes in the interactions of
    speech acts during dialogue can be inferred by the sequence of speech acts. On
    the other hand, social contexts be used to interpret why a speech act is properly
    chosen to cope with desired change of social context for a speaker agent.


    An action can be applied when all preconditions are matched in the action model.
    In the other hand, the speech act is less rigid than the action model. There is
    no physical restriction for agents to apply speech acts in a conversation, so
    agents can use any speech acts in any situations. However, dialogues could be
    unreasonable if agents choose speech acts randomly. In order to make agents understand
    each other in the conversation, speech acts must be triggered by corresponding
    dialogue contexts. Although there are many related dialogue contexts that can
    trigger a speech act, we assume that a speech act can be triggered by a partial
    match with related dialogue contexts. For example, the emotion context: negative
    and the institutional relation context: subordinate-to-superior are both related
    to the speech act'
