    As we discussed in an earlier section, there are currently robots employed in
    all kind of industries, including social, manufacturing, entertainment and military.
    In the beginning, as robots are currently made and optimized to perform specific
    repetitive but fundamental tasks, it will come as no surprise that they will use
    the exact same tasks in order to contribute to their own community. As they will
    not possess the four primary human emotions, anger, fear, sadness and happiness
    (Turner, 2011) will not have to deal with a surge of destructive thoughts and
    situations which they could lead to isolation. Turner identifies that in most
    human societies; the majority of primary emotions is negative and generally works
    against forming social ties and groups. People who are angry invite counter anger;
    those who are fearful are usually avoided. The same is true for most human mammals
    unless they have built-in programs to form packs, prides, pods, troops and hence
    not need to rely so much on emotions to create and sustain social structures (Ibid).
    Specialist robots will work together, forming groups and they will quickly build
    a living space and their infrastructure based on the most functional and efficient
    use of the space. They will create their own power generators which will be completely
    independent from the world’s natural resources and by using trial and error (adapted
    learning) they will quickly optimize their living environment to fit their needs.


    As the need for social robots increases and cultural acceptance is established,
    we will see the rise of the “polymathan” and “multi-morphic” robot, as families
    would prefer to have one robot suitable for more than one task. As these robots
    become part of the core family group, there will be a need for them to demonstrate
    feelings of affection in order to become more easily integrated and accepted as
    part of everyday life. These feelings will also be reflected in both a positive
    and a negative way in their particular cultural settings denoting the emergence
    of robotic individuality and creativity.


    In order to reflect their creative nature, robots will either “want” or be implemented
    to create an identity. Adhering to the second proposition from this chapter, each
    robot would be customized and personalized by the family that is part of, an perpetually
    evolving change of form and interactivity. The robots in turn, by learning and
    adapting, both from their “personal experience” with the human family as well
    as by each other (in conjunction with the networked information which will be
    available from the net), they would begin to customize their own living space,
