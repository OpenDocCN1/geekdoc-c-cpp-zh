    # 8.4 MULTIPLE DIALOGUE CONTEXTS


    In the work of speech act classification [2], approximately 4,800 speech acts
    and 600 categories were divided into four major layers: expression, appeal, interaction,
    and discourse. Each speech act can be defined by the changing or triggering of
    specific contexts. It is impossible to list all context conditions for a speech
    act since it falls into the problems [18], where all contingent conditions involved
    could not be specified. The ramification effects of a speech act on the mind states
    of other agents cannot be clearly framed, by the unobservable property of their
    mental states.


    In designing the dialogue context model, we only considered the conditions and
    effects an independent speech act can achieve in a dialogue. Some principles and
    commonly encountered contexts, while considered arbitrary, can be adopted in the
    dialogue context modeling to render the context awareness feasible. We often encounter
    the matter of the degree of effect in describing the relationship between the
    dialogue context and a speech act; to distinguish whether an agent is likely to
    choose a particular speech act over another under a certain context, or whether
    a particular speech act is more likely than others to affect a given context.
    Our solution is to divide the degree of effect into five levels. Each level maps
    a probability in the Bayesian network, as follows: Level 1: 0.15, Level 2: 0.35,'
