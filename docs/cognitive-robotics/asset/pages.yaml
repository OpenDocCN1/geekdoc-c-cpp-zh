    # 1.4.3 Robots and the Laws of Product Liability


    Product liability laws are designed to protect people from risks associated with
    defective products, those that can cause injury or other form of damage. In the
    USA product liability laws sometimes vary from one state to another, but in general
    a product''s manufacturer is subject to liability for any physical harm caused
    by the product''s use. But matters of product liability are not that straightforward.
    Robots are a special category of product because of their (artificial) intelligence
    which is, in many cases, will include an ability to learn.


    Although products should be designed and manufactured in such a way that they
    will not pose a risk to their users or to others, how could we ever be certain
    that there will be no risk when people are able to learn from their experience
    and improve their own decisions and actions? And if the software in a robot can
    learn or otherwise change through self-modification, it will often be extremely
    difficult, not impossible, to trace the origins of a defect back to the programmer
    or manufacturer responsible, because it could be argued that the original design
    of the robot had been altered by the robot itself. In a court it would be necessary
    to introduce evidence from technical experts as to whether harm arose of an error
    in design or manufacture, or whether it was the robot had been badly trained.


    As robots become more human-like in their capabilities, endowed not only with
    the ability to learn but also with artificial emotions, moods and personalities,
    it will become increasingly less clear that they should be treated as products
    in the normal sense of the word. And if conventional product liability laws are
    insufficient to deal with intelligent learning robots, what additional or alternative
    laws apply? This is very much an open question and in my opinion is likely to
    remain so for many years to come.'
