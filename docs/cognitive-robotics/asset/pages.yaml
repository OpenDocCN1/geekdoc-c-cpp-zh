  md: '# 90 Cognitive Robotics


    # 5.7 Acknowledgments 106


    # 5.8 Bibliography 107


    IN the field of cognitive robotics, much attention has focused on the technical
    challenges and approaches to building social robots and intelligent agents. However,
    few works explore how the aesthetic qualities of shape change how people perceive
    such agent. Our contribution to this book focuses on the human responses to objects
    that change shape in response to input from users, environment, or other circumstances.
    In this chapter we discuss the term *imagined physics*, meaning how actuated devices
    are in one sense tied to their physical form, yet through the use of actuators,
    sensors, and computer algorithms can behave in ways that are surprising, unpredictable
    and might even be perceived as magical. We also claim that shape change can reveal
    the state of a robot or object, providing cues for mentalizing, similar to how
    we read emotions and understand body posture and other non-verbal communication
    when interacting with people. We review examples of shape-changing interfaces
    including toys, lights, robots, etc, noting the intentions – claims about intent
    - made by the respective designers.


    # 5.1 INTRODUCTION


    Across examples of research in the field of cognitive robotics, researchers embrace
    goals of designing robotic systems that can perceive and react to humans and deal
    with complex situations. We turn around and propose that there is also important
    research needed in designing robots such that the robot''s intentions, goals,
    and even mental states [26] can be more effectively inferred or understood by
    humans. This is important for situations in which humans need to understand and
    cooperate with a robot toward a common goal. Few works explore how the aesthetic
    qualities of shape change how people perceive autonomous agents. This work examines
    some of the building blocks of robotics-objects that move and components that
    make shape-changing interfaces possible. We make a small step in that direction
    and in this chapter, we share and discuss the design of shape-changing interfaces
    and how experiential qualities can influence the interface [28].


    The rest of this chapter is organized as follows: first, we discuss shape-changing
    interfaces as a research topic, then we provide examples from our design courses
    focused on shape-changing interfaces, and then describe the concept of “imagined
    physics”, which designers can use to accentuate, exaggerate, or attempt to hide
    behaviors, current state, and intentions of complex autonomous robots. We provide
    a short analysis of electronic components that have been used in the various projects
    designed by


    > ¹This chapter is based in part on our paper [28].'
