  md: '# Integration of Vision and Actions To Create Cognitive Humanoids ■ 209


    MoBeE allows to trigger certain responses when collisions occur. In the case,
    when we want the robot to pick-up the object, we can activate a grasp subsystem
    whenever the hand is in the close vicinity of the object. We are using a prototypical
    grasp style hand-closing action, which has been used successfully in various demos
    and videos. Figure 10.6 shows the iCub successfully picking up (by adding an extra
    force) various objects using our grasping subsystem, executing the action.


    Our frameworks are able to track multiple objects at the same time, which is also
    visible in Figure 10.8, where it tracks both the cup and the tea box. By simply
    changing the type of the object within MoBeE the robot reaches for a certain object
    avoiding the other.


    # 10.7 CONCLUSIONS


    Here a cognitive robotics approach towards visual guided object a humanoid was
    presented. A tightly integrated sensorimotor system, based on two frameworks developed
    over the past years, enables the robot to perform a simple pick-and-place task.
    The robot reaches to detected objects, placed at random positions on a table.


    The implementation enables the robot to adapt to changes in the environment. Through
    this it safeguards the iCub from unwanted interactions – i.e. collisions. This
    is facilitated by a tight integration of the visual system with the motor side.
    Specifically an attractor dynamic based on the robot’s pose and a model of the
    world. This level of eye-hand coordination not previously seen on the iCub was
    achieved.


    In the future integration of machine learning to further improve the object manipulation
    skills of our robotic system is planned. Improving the predication and robot.
    Improving the predication and selection of actions will lead to a more adaptive,
    versatile robot. Furthermore it might be of interest to investigate an even tighter
    rumour coupling, e.g. avoiding translation into operational space by working in
    vision/configuration space.


