    # 4.2 TALKING CHINESE, MEANING AND RECENT THEORETICAL DEBATE


    One relevant problem in artificial agents and robots is that of the “meaning”.
    The “meaning” is the missing tile in an approach considering information processing
    (the traditional cognitive approach) as well as the later approach including “embodiment”.
    In the words of Di Paolo [16]: the body, not algorithm, is the originating locus
    of intentional, concernful activity (if we understand intentional, directed and
    flexible), and the world is not the sum total of all actual facts, but the world-as-it-for-this-body.
    The problem of the intentional states and related issues of “understanding” has
    been exemplified by the Chinese Room case by the philosopher J.R. Searle [39].


    The renowned experiment features a men closed in a room. He does not speak or
    understand Chinese. He receives two groups of Chinese characters. He also receives
    rules that connect characters from one group to characters of the other group.
    The men become proficient in using these rules so that the results mimicry the
    capacity of a native speaker. If he receives a third group of characters from
    outside the room the rules to connect them to the previous characters and then
    sends out the correlated characters, he will be providing answers. These will
    appear to Chinese speakers indistinguishable from those of another person proficient
    in Chinese. Nevertheless the person in the room does not understand Chinese.


    If the human speaks English is in the situation (answering questions about a story
    in English) he does not need the set of formal rules to correlate characters.
    The Chinese character correlation can be implemented as a computer program. So
    were the difference between the Chinese case and the English case? In the English
    man can understand that the story is about a man, a restaurant and eating hamburgers.
    Searle’s “understanding implies both the possession of mental (intentional) states
    and the truth (validity, success) of these states”.


    Searle argues: “In English it is not because I am able to understand English and
    have other forms of intentionality (I am, I suppose, the instantiation of any
    number of computer programs), but as far as we know it is because I am a certain
