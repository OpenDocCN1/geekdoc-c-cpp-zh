    The factor of whether or not robots appear during the experiment has a significant
    influence on human perception [16], including how humans judge robots'' altruism
    and their trust of robots. Previous researchers argued that when robots appeared
    on the scene, participants showed higher trust of robots and thought the robots
    were more altruistic. Compared with the animated characters created by computers,
    robots have more social attributes, are more real and can share spaces with humans.
    Some researchers argued that robots'' behaviours influence the interaction between
    human beings and robots. The eye contact between humans and tracking of robots
    [38] and the cooperative behaviours between human beings and robots would improve
    human evaluations of robots. The mental model of robots is said to be influenced
    by the sources and languages of robots [19].


    Based on the research of Lee, Park and Song, robots'' ability of self-development
    is to influence participants'' cognition, especially the de-tinguishing of robots''
    social attributes [18]. Although in the experiment, the learning process was simplified,
    it indeed proposed a new view about how to design robots'' abilities. Future robots
    have the ability to develop the self as time goes in order to adapt to the environment
    better.


    The factors related to include participants'' genders, ages, characteristics,
    the experience of interaction with robots and know-ledge of robots [24-26, 31,
    37]. Cultural differences will also influence human cognition and evaluation of
    robots as well as behaviours towards robots. Based on the results of an experiment
    conducted with six countries (e.g. Dutch, Chinese, German, Mexican, American and
    Japanese), the American participants were not least negative towards robots; the
    Mexican participants were most negative; and the Japanese participants did not
    have particularly positive attitudes towards robots [35]. Additionally, the exe-rience
    of interaction with robots was said to have a positive influence on participants''
    attitudes.


    # 6.2.2 Effects of Cultural Context on Decision Making


    In 2007, Rau and his team carried out a study to investigate the influences of
    participants'' cultural background (human-related factor), the appearance of robots
    (robot-related factor) and robots'' tasks (task-related factor) on the interaction
    between human beings and robots [20-21]. The independent variables of participants''
    cultural background and the appearance of robots in-cluded three levels (Chinese,
    Korean, and German); zoomorphic, humanoid and machine-like) and were between-subject
    variables. The independent variables of robots'' tasks included four levels (teaching,
    guiding, entertaining and security) and were within-subject variables. The influences
    include two as-pects – preference (likability) and interaction performance (active
    response, engagement, trust and satisfaction).'
