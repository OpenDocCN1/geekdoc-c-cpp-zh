    While choosing experimental tasks, three aspects should be taken into consideration:
    1) the tasks should be cooperative tasks which require participants and robots
    to make decisions together; 2) the tasks should represent the real world; 3) the
    experiment should be realised easily within the current experimental platform.
    The cooperation tasks ensure that the participants do not have absolute advantages
    in decision-making and action capacity, which would the abilities of robots, to
    conduct the tasks. Both participants and robots have independent decision-making
    and action capacity. In the reality social robots decision-making supporters can
    have roles as experts, advisors, service partners, and so on to provide users
    information and suggestions. This type of robot should not only have the same
    ability as general social robots to encourage users'' social behaviours, but also
    have the ability to build trust with users. In this experiment, robots acted as
    participants'' partners and provided decision-making support. When considering
    all tasks, the tasks of sea survival from the US Army Survival Manual [6] were
    chosen as the task prototype. The study framework is outlined in Figure 6.1.


    The task scenario can be described as follows. The participant and the robot are
    sailing a boat on the Atlantic Ocean. There happens to be a serious'
