    # 8.8.4 Pragmatic Prediction with Dialogue Contexts


    As discussed, if all agents conduct dialogues obeying Grice''s maxims, we could
    easily convert the dialogue context semantics directly into pragmatics (infer
    speech acts directly from their dialogue context semantics) [5]. However, in emergent
    narratives, we have not of Grice''s maxims for agent communication, and therefore,
    cannot directly obtain the pragmatics or speech acts from the dialogue context
    semantics. The agent''s mental states are unobservable, we cannot confirm whether
    the pragmatics in a dialogue sequence of inferred speaker agents are the true
    intentions (or speech acts) of the speakers. Therefore, we distinguish between
    two dialogue sequences: (1) a coherent sequence, in which all dialogue semantics
    of speech acts in the dialogue sequence-of-speech sequence can be treated as pragmatics
    and no conflict in dialogue contexts of those speech acts can be found in the
    sequence; and (2) an incoherent sequence in which dialogue speech acts are treated
    directly as pragmatics, and if so, the dialogue contexts of certain speech acts
    might be in conflict with their true sequences. Dialogues in the emergent narratives
    are generally incoherent semantic sequences, and therefore, we must find an explanation
    of the most likely speech act sequence for a given dialogue sequence. To achieve
    this, we should make agent aware the dialogue contexts in the agent conversation.
    In this experiment, we intend to show that a dialogue agent can predict the correct
    speech act to some extent from its speech act of a dialogue sequence in the agent
    conversation given the dialogue contexts of the speech act model. In Table 8.7,
    we demonstrated that 21 speech acts occurred in the conversation. Part (a) is
    semantic speech act sequence, and part (b) is pragmatic speech input sequence.


