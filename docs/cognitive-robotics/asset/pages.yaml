    # 5.6 FUTURE WORK


    We have briefly reviewed a number of examples of shape-changing interfaces noting
    aesthetic qualities that can impact the perception of the object and experience
    of the interaction. There are ever more complex and advanced materials being developed
    and computational power being embedded into the materials around us [17]. Designers
    are searching for ways that the formal characteristics of the objects they bring
    into the world connect with people emotionally and perceptually through explorations
    of analog materials [27] to interactions in smart environments


    It is important that we consider and explore metaphors that can be effective and
    desirable for people to share meaning with robots. An obvious next step is to
    conduct research into the user experience through actual use of shapchanging artifacts
    to help guide future refinements. There is much needed work, which we envision
    can include a mix of methods. There should be continued exploration following
    a research design approach [49, 11], identifying new contexts that might be helpful
    for shape change, framing the problems and opportunities to be addressed, exploring
    materials, and sharing the results of the process that others learn from the challenges
    and take inspiration from detailed accounts of the designers’ leaps of creativity.
    There are many recent examples of shape change research from mobile phones to
    objects of larger scale and environments, often with short-term evaluations or
    initial impressions. It is also important that design researchers embed these
    technologies in contexts of use so that we might learn people appropriate the


    In terms of cognitive robotics and interaction design, a recent paper draws attention
    to the rise of ever more complex objects, and environments in which there are
    not clearly demarcated regions on a surface or clearly defined buttons to push.
    Going beyond things and beings, they proposed ‘fields’ of interaction in which
    the human inhabits a space with interactive forces and possibilities [18]. How
    should these complex objects, a mix of entities and environments share information,
    build a memory, learn from the past? How can robots develop more meaningful experiences
    with shape change to support the human in such an environment?


