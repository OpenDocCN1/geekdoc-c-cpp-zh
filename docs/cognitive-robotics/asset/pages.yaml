    # 2.5 EGALITARIAN SOCIETIES


    As populations count and their AI capabilities increases to the level of independent
    thought and existence, it is important to ponder what kind of sub-societies robots
    will create amongst themselves. What kind of social values and what kind of character
    traits will they need in order to be self-sufficient? Would they resemble a western
    consumerism structure? Is it Amerindian structure better suited for them? The
    Yanyesha people of Peru for example, with whom the anthropologist Ferdinand Santos-Granero
    conducted extensive fieldwork, identifies that the ideals of love, friendliness
    and trust are social values that are taught to everyone from early age and need
    to be reinforced on a daily basis. And those individuals who deviate from these
    ideals are isolated and ignored rather than confronted. As which reinforced to
    prevent isolation from the whole is ‘controlled sociability’ sees households making
    regular visits from one to another, without being isolated from it (Santos-Granero
    2007). Distancing from the public sphere without being isolated is presented for
    example in the houses of the Yanyesha who has no walls, so that everyone can see
    what goes inside - a pattern observed amongst indigenous people throughout Latin
    America.


    For a household within the typical Amerindian village to oblige with responsibilities
    it must strive to be autonomous as possible (while retaining fully active its
    kinship membership). And for this occur a man or a woman have to be polymathians.
    What one observes in egalitarian non-hierarchical communities of “similars” are
    polymayan individuals who know similar traits and are also interested in learning
    more or expanding the already known; a sort of Amerindian polymathianism. “Similar”
    in turn does not mean “the same” as much as it means analogous and equivalent.
    “A social relation” writes Radcliffe Brown (1935:1936) amongst African tribal
    societies do not result from a similarity of interests, but rests either on the
    mutual interest of persons in one another, or on one or more than interests, or
    on a combination of both these. Personal responsibility and personal autonomy
    are notions the Ngobe highly value alongside harmony, friendship, and sister-brotherhood.
    Anthropologist Philip Young, who conducted decades of fieldwork amongst the Ngobe
    writes in regards to the matter of responsibility,'
