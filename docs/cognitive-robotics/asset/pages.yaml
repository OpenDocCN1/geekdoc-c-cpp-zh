    my friend Dr. Hooman Samani to write a chapter in his book on cognitive robotics.
    I was honored and flattered by this invitation, but most of all surprised. Though
    I have some ideas about this subject and it has remained the focus of my fascination
    for more than ten years, I have no claim to any achievements in this field. I
    certainly not professionally involved in robotics, artificial intelligence or
    machine learning. I am a development engineer at the Philips Healthcare division
    and a reliability expert engaged in the development of large medical X-ray devices
