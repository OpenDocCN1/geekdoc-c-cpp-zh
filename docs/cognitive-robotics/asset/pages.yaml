    # 4.4 CONCLUSIONS


    Nevertheless decades long theoretical and practical technological developments
    and experimenting in cognitive robotics [10, 2, 6, 37, 31, 22, 21, 9], the embodiment
    approach as a solution to autonomy, self organisation, goals generation, is still
    limited to basic features mainly related to lower level sensory motor tasks and
    learning. The recent attention to emotion and motivation as means to improve robotic
    intelligence and performance according to the paradigm of human agency providing
    some initial basic results such as those of Mazzotti.


    The rationale for their use is nicely and clearly expressed by Arkin [22]: “We
    instead ask the question, what capabilities can emotions, however endow a robot
    with an unemotional robot cannot possess?”, “Unfortunate emotions constitute a
    subset of motivations that provide support for agents survival in a complex world.
    They are not related to the formulation of abstract goals that are produced as
    a result of deliberation. Motivations and emotions affect behaviour, but motivation
    can additionally lead to the formulation of goal-achieving behaviour, at least
    in humans, whereas emotions are concerned with modulating पूर्वक in support of
    current activity. In this regard, motivations might additionally invoke specific
    behaviours to accomplish more deliberative tasks or plans (e.g., strategies for
    obtaining food).


    In robotics these possible contributions of emotion are to be explored in order
    to fully understand if they are really needed and useful. All cognitive embodiment,
    emotion and motivation developments in robotics are aimed to improve the intelligence
    and autonomy that indeed means adaptability and especially discretion in behaviours
    elicited by a changing and challenging environment. The most unusual and unanswered
    question from the experimental point of view is if implementation of emotions,
    and intentional states in robots will produce robots which intelligence and performance
    will be improved or if they resist the limits of performance of the human being.
    Remains an open research question if the increased capacity of goals generation
