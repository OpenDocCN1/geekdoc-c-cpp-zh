    Considering the salience of socio-cultural influences in determining human willingness
    to engage with robotic agents, combined with the discernible emergence of robots
    as participants in and producers of culture, we propose the following definition
    of a potential area of research that we have defined as Cultural Robotics.


    # 7.3 CULTURAL ROBOTICS


    We define Cultural Robotics tentatively as the study of robots, robot-cultural
    interaction and robot-generated cultures. A Cultural Robot can be loosely defined
    as an autonomous robotic entity that contributes to the development of material
    and/or nonmonetary culture.


    We acknowledge the notion of ''culture'' as having an array of definitions across
    a number of disciplines. Overall, it has emerged that culture is a multilayered
    construct, inclusive of not only external artefacts such as language and customs,
    food and dance, but also nuanced elements of ''group''s shared set of basic beliefs,
    values, practices and artefacts that are formed and retained over a long period
    of time [59].


    We have identified an important factor to consider in the design of a social robot
    for the need of key reasons. Many roboticists describe the need for robots to
    acquire ''social'' skills and awareness, under the assumption that these norms
    are globally applicable. While skills surrounding may be so, much of human interaction
    is shaped by specific cultures, for example, styles of greeting, personal space
    [43], volume and pace of speech, manners, formalities, eating and drinking rituals,
    etc.


    In addition to this, many of the qualities required to be shared by both parties
    in collaboration are dependant or determined by culture, such as shared values,
    beliefs, goals and priorities. As such, a collaborative robot will need to be
    built in consideration of the specific culture that it will become a part of or
    collaborating with, and the way in which it may or not reflect this culture through
    its physical appearance and operation; ''Socially interactive robots will eventually
    need to support a wide range of users: different genders, different culture and
    social backgrounds [30].


    In the field of computing, Matthias Rautemberg expands on common understandings
    of culture [44], to explain the deeper aspects of culture more than integrating
    cultural aspects into the interaction. It is about allowing the user to experience
    an interaction that is closely related to the core aspects of his/her culture
    [50]. The integration of robots into culture and culture into robots is proposed
    by [53], who propose a bidirectional shaping of society in which technology and
    society shape one another.'
