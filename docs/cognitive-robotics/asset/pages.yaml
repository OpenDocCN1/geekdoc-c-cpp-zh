    In our speech act model, a speech act affects not only the speaker''s mind, but
    also the listener''s mind. All mind contexts of the agents cannot be combined
    because the mind states of each agent are formulated by independent Dynamic Bayesian
    Network (DBN) models [15]. This is explained further in 8.7.


    In Figure 8.1, we illustrate the flow an agent uses a speech act to change participants''.
    First, agents choose a speech act as his/her mind states, such as Belief-desire-intention
    (BDI) model [17], emotion context [16]. When the speech act is expressed, every
    participant can receive the speech act and other physical context information
    from the environment. In the ending phase, each participant''s mind states could
    be changed by the effects of the speech act. Then the next speaker starts to choose
    a speech act in another cycle.


    As discussed above, if we assume all agents conduct dialogues by obeying Grice''s
    maxims, we could convert the dialogue semantics directly into pragmatics (infer
    speech acts directly from their dialogue content semantics). However, in emergent
    narratives, we forego the assumption of Grice''s maxims for agent communication,
    and therefore, could not directly'
