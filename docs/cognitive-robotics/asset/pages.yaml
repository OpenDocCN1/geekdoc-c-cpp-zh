    examine the challenges the designers faced and provides insights to the design
    process. Examples include the outcomes from two courses focused on designing shape-changing
    objects including tumbling objects in one course, light in another. We also include
    additional projects from an innovation course and independent student project
    relating to shape-changing surfaces.


    In the following subsections, we account for the examples, how they work, what
    purposes they fulfill and which qualities they provide. The examples have been
    realised through functional prototypes, in which users can experience these shape-changing
    interfaces first-hand.


    # 5.3.1 Shape-Changing Tumbling Objects: bObjs


    There are many examples of HCI research featuring the integration of sensors,
    actuators and computing into playful objects for children. From animated plush
    toys (e.g. [43]), to digital playgrounds (e.g. [41, 42]), animated play [21],
    shape-changing toys (e.g. [19, 39]), open-ended interactive play objects (e.g.
    [4, 44]) and many other inspiring playful objects and concepts. Topopo [39] and
    Kinematics [30] present playful toolkits allowing users to explore movement and
    physical change through passive and augmented building blocks. Ninja Track [19]
    presents a different approach to shape-changing toys, whereas the shape change
    is used to switch between two states of play. It can change from a flexible wip
    to a rigid sword with the push of a button. There are other examples of augmented
    objects that use shape to facilitate playful interactions, for example the kinetic
    surface of Kinetic Bricks [20] could be used as a construction toy for children,
    and SpeakCup [48], which functionality could be used as a toy for social interaction
    in public spaces inviting the user to speak and listen according to the shape
    they have formed with the object.


    Among various examples we conducted a design course with the support of the Danish
    design company bObjs explore how the various types of shape change could support
    playful interactions. bObjs designs tumbling objects for children, following a
    design philosophy that dictates simplicity in material and content, and to inspire
    imagination and movement with their products. The tumbling objects are made from
    solid EVA foam blocks and are quite versatile; they work equally well as furniture,
    building blocks and obstacles in a game of tag, or whatever a child might.


    The course participants were assigned the task of redesigning a bObjs tumbling
    object using one specific type of shape change. Additionally, the design should
    meet with bObjs design philosophy. The shape change framework [40] was used as
    a way to open the design space, and broaden the exploration of shape-changing
    interfaces. Each group received one of the eight types of shape change as a constraint
    and were told to involve that type'
