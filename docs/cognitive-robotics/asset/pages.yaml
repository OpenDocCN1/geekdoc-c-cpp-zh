    Finally, we would like to further establish and refine the definition of Cultural
    Robotics through engagement with and feedback from researchers and roboticists
    in a variety of fields.


    # 7.5 CONCLUSION


    In this chapter we discuss the determinants of human willingness to collaborate
    with robots. Based on the previous writings of researchers such as Fong, Breazal,
    Duffy and others, as well as analysis of contemporary robotic notions such as
    [58, 63, 31], we situate that a new type of robot is emerging on the fringe of
    social robotics that could be classified as ‘cultural’ robots. Furthermore, the
    meta-motivation for the development of these new types of robots is a collective
    desire roboticists for deeper interaction and greater collaboration between robot
    and human counterparts. Using these same robots as well as other examples, we
    outline how future robots will increasingly become enabled with cultural agency,
    and that a model for human willingness to collaborate with such robots indicates
    that cultural considerations are both expanding robotics, and necessary for forging
    meaningful interactions with them.


    The cognitive model presented in this chapter attempts to outline and understand
    these determinants and their relation to human-robot interaction. Based on the
    Theory of Planned Behaviour, we briefly discuss the Behaviour, Normative and Control
    Beliefs, focusing on the assessment as a human actor will make of a robotic collaborative
    partner, and the influence of aesthetics and culture.


    Considering the emergence of a new type of robot, combined with the evident influence
    of culture over willingness to engage with social robotic agents, we propose Cultural
    Robotics as a new area of research in robotic development.


