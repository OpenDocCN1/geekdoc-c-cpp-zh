    # 2.7 CONCLUSION


    As the nature of this topic is by default speculative, this book aims to provoke
    further discussion and offer some fresh perspectives approached by an anthropological
    perspective. The authors begin examining the current state that led to the evolution
    of robotics, concentrating more on philosophical thinking behind the western and
    the eastern cultures. In the background research it was evident that the west
    and the east have different thought processes. The western cultures influenced
    by the body/soul divide and the mythological ideologies that demonize the nonhuman
    seem much more reluctant to accept robots as part of their families. The eastern
    cultures, however, with their Shinto and Buddhist traditions are much more open
    to the idea. The authors, wanting to identify new knowledge and explore what other
    ideas can be learned from other communities with different religions and beliefs;
    they offer an investigation into the daily lives of Amerindian societies, focusing
    on their animist beliefs and their material culture. These communities have limited
    exposure to western and eastern influences in their way of thinking. Due to their
    animistic views, the members of these communities already view the entire ecosystem,
    its entities and its objects (organic and inorganic) as potentially possessing
    an interface or a personhood. Energies (as a form of data) and person (akin to
    an avatar) are embedded in the very definition of each object and entity they
    touch and interfere with.


    By investigating how they live their life, the authors have reached to specific
    examples which they can be directly applied to our thinking process of non-human
    technological embodiments. The first proposal, spawning from the importance these
    communities place in the making and crafting of the objects they own and in their
    everyday life and subsequently the personal'
