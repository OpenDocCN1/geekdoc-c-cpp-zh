    Following this first course we proposed a design space called physics[28], in
    which the design can be described by how a user would perceive the shape change.
    This model, which is described in more detail in this chapter, classifies shape-changing
    elements according to what is visible or hidden, what is virtual or physical,
    and how volatile or consistent the perceived laws of physics govern the movements.
    We designed the course for the subsequent year to explore this concept.


    # 5.3.2 Shape-Changing with Light


    The design course set out to explore light and shape-changing interfaces and to
    explore the concept of ‘imagined physics’, in order to create a shape-changing
    interface that could alter its shape according to some input or data. The students
    were given the freedom to choose any of the eight types of shape change in their
    design work and were encouraged to push the boundaries from a research perspective
    by considering the call for submissions to the TEI 2014 art gallery [1], which
    proposed submissions that question, "how can we incorporate the tangible, embodied
    and embedded technologies that bring awareness to ourselves as individuals and
    as communities?” Two of the groups submitted and were accepted to the TEI gallery
    of 2014 to display their work (including one other of this chapter).


    Kinetic Wave [36] is an interactive, shape-changing installation that explores
    how input from its surroundings can be used to create abstract reactions that
    communicates information through the use of spatial shape change. Kinetic Wave
    aims to visualize the invisible wireless communication caused by everyday, wireless
    devices such as smart-phones, routers and laptops - a dimension not perceivable
    by the human sensory system.'
