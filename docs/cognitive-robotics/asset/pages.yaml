  md: '# 128 Cognitive Robotics


    This chapter identifies the emergence of a desire amongst contemporary social
    roboticists for increased collaboration, deeper interaction and more meaningful
    and subtle relationships in human-robot interaction. There we contribute a cognitive
    model that has been developed to identify the determinants of human willingness
    to collaborate with a robotic counterpart, and specifically what factors influence
    our assessment of our own capacity and that of a robot be fast, automatic and
    based primarily upon an oculocentric judgement of aesthetics, and the culture
    of both the human participant and that which has shaped and is ultimately projected
    by, the robot. With this in mind we introduce the emergence of “Cultural Robotics”
    for consideration for the future development of collaborative robotic agents.


    # 7.1 INTRODUCTION


    In the last decade, the field of social robotics has seen rapid growth and the
    development of many variants of ‘sociable machines’ [16]. With functions ranging
    from museum tour guides [60] to bartenders [31], social robots have been developed
    to participate in an extraordinary range of roles, including domestic helpers
    [58], musical collaborators [63], and friends [62]. These ‘relational artefacts’
    no longer simplify things for us, they do things with us with [62].


    The increasing integration of robotics into human life requires adaptations to
    be made, not simply technical advances in machinery, but adjustments made to human
    acceptance and understanding of ourselves and of the place that robots will have
    in our lives. This chapter is centered with what shapes our assessment of a robotic
    counterpart in the context of collaboration, and how the future of robotics is
    affected by these determinants.


    The definition of a social robot has been examined in depth [14, 35, 25, 11],
    however the term has progressed from its original meaning inspired by the collective
    behavior of insects, to an association more closely with ‘anthropomorphic social
    behaviour’ [14]. Cynthia Breazal offers further classification of social robots
    in accordance with the complexity of the interaction supported, for the broader
    purposes of this paper we align ourselves with Fong’s definition of ‘socially
    interactive robots’ in which social interaction play a key role [30]. Fong’s definition
    refers to a specific type of social robots, who act as partners, peers or assistants,
    and he distinguishes these robots from others that involve ‘conventional’ human-robot
    interaction such as teleoperation scenarios. We adopt this definition because
    Fong’s ‘socially interactive robots’ specifically require considerations for the
    human in the loop, as an interactive partner [30].


    In looking at a variety of social robots presented in the last fifteen years,
    including [31, 58, 46, 22, 18, 37, 63, 49, 36, 57, 28, 45], we have identified
    that although these robots varied vastly in function and application, a'
  merge: -1
  pgno: 140
