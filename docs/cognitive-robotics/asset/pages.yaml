    cycle of computation for one speech act. This disadvantage is critical in real-time
    interactive virtual dramas and games. To overcome this problem, we combined two
    methods with our DBN model: Noisy-OR and Isolated contexts.


    # 8.7.1 Noisy-OR Model


    To combine the related conditional probability, we use a noisy-or model, under
    the assumption that all the contexts with conditional probabilities are independent.
    The idea behind Noisy-OR [8], [18] function that a speech act with n contexts
    $C_i$, each with a probability value $p_i$, where $p_i$ is the probability that
    SA = true on $C_i =$ true while $C_j =$ false $\forall j \neq i$ as in equation
    8.3.


    ```

    $p(SA = true|C_1, ..., C_n) = 1 - \prod_{i=true} (1 - p_i) \quad (8.3)$

    ```


    The limitation of using the noisy-or to calculate the CPT is that we can only
    design triggers for a speech act. We cannot describe the type of condition in
    which a context might reduce the probability of invoking a speech act with the
    noisy-or. To use the noisy-or model, the assumption that all dialogue contexts
    are independent can be substantial. However, using the noise-model, we could simplify
    the computation complexity of calculating the conditional probabilities table
    (CPT), by reducing all 2n combinations of true-false possible conditions to only
    n-item computation. The Noisy-OR method can reduce one cycle computation time
    into several seconds from hundreds of seconds.


    # 8.7.2 Isolated Contexts


    We can tolerate several seconds of delayed response in real-time games, but it''s
    not enough obviously. According to statistics, each speech act input will only
    change about 3 to 7 condition probabilities in dialogue contexts. In the previous
    model, we have total 47 dialogue contexts and all of them must cost at least one
    calculation in one DBN cycle. In other words, most of computation resources are
    taken by irrelevant dialogue contexts (according to the input speech). So we design
    an isolated context for each speech act to avoid unnecessary calculation. In order
    to use this isolated context correctly, two guiding rules must be followed before
    we skip the calculation for a dialogue context: 1. The probability of current
    dialogue context is under 1% to the dialogue context with highest probability.
    2. The skipped calculation will not raise the probability of the dialogue context.
    By using isolated contexts method, we save 61% time cost in the whole dialogue
    speech computation.'
