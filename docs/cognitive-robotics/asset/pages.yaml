    # # 8.4.4 Social Role


    Some speech acts can only be used by agents in certain roles. Conversely, when
    a speech act is issued by an agent, other agents might believe that the speaker
    agent actually plays the social role implied by the speech act. Institutional
    roles describe the authority and obligation from official roles in an organization.
    In the speech act classification, some speech acts can only be used by agents
    in certain institutional roles. Conversely, when a speech act is issued by an
    agent, other agents might believe that the speaker agent actually plays the institutional
    role implied by the speech act. For an example, order is the speech act that can
    only be applied by an agent with a superior role to an agent with a subordinate
    role.


    # # 8.4.5 Personality


    Personality defines the tendencies of the reactions of an agent toward certain
    emotions and the violation of certain social norms. Since Personality is relatively
    unchangeable, without affecting the performance evaluation of other contexts in
    this paper we assume it is fixed at some prior constant for all dialogue agents.


    # # 8.4.6 Preference


    In the preference, we record the frequencies of speech acts used by a particular
    agent toward other agents under certain dialogue situations so that the tendency
    of choosing a particular speech act for the agent can be analyzed for future prediction.
    Similar to Personality context, we could assume preferences are also fixed at
    some prior constants for all dialogue agents.


    # # 8.5 SPEECH ACT MODEL WITH MULTIPLE CONTEXTS


    Triggering contexts and effects describe dialogical context states in speech act
    model. Since dialogical context states are hidden in agent mind and can''t be
    observed by others, we adopt a probability model to indicate the possible state
    of each dialogical context. For example, anger(0.7) means the anger emotion has
    0.7 to be true. In this, we can define triggering and effects of each speech act
    with probabilistic dialogical context states. For instance, trigger(anger(0.7
    +)) means the anger emotion has probability 0.7 or more to be true, then agents
    would use speech act: threaten in dialogue.


