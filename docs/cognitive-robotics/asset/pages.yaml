    # 10.1 INTRODUCTION


    Object manipulation in real-world settings is a very hard problem in robotics,
    yet it is one of the most important skills for robots to possess [29]. Through
    manipulation they are able to interact with the world and therefore become useful
    and helpful to humans. To produce even the simplest human-like behaviours, a humanoid
    robot must be able to see, act, and continueously. Even so for object manipulation
    tasks, which require precise and coordinated movements of the arm and hand. The
    understanding of how humans and animals control these movements is a fundamental
    research topic in cognitive- [49] and neuro-sciences [27]. Despite the interest
    and importance of the topic, e.g. in rehabilitation and Medicine, the issues and
    theories behind how humans learn, adapt and reaching and grasping behaviours remain
    controversial. Although there are many experimental studies on how humans perform
    these actions, the development of reaching and grasping is not fully understood
    and very basic computational models exist [45]. Vision is seen as an important
    factor in the development of reaching and grasping skills in humans [5, 39]. For
    example, imitation of simple manipulation skills has been observed in 14-month-old
    infants [40]. Current robots in contrast are only able to perform (simple) object
    manipulation, more limited, specific settings. To enable more autonomous object
    manipulation, more specifically to enable some level of eye-hand coordination
    to perform actions more successfully, is of high interest to the robotics community
    (e.g. NASA’s Space Technology Roadmap calls for “Real-time self-calibrating hand-eye
    system” [1].


    # Artificial Intelligence, Machine Learning Robotics


    The research in the fields of Artificial Intelligence (AI) and robotics were strongly
    connected in the early days, but have diverged over the last decades. Although
    AI techniques were developed to play chess on a level good enough to win against
    (and/or tutor) the average human player [51], the robotic manipulation of a chess
    piece, in contrast, the creation of intelligent machines has lacked a bit behind
    the algorithmic side. It is still not feasible to control a robot on a similar
    level of precision, adaptation and success as a human — not even comparative to
    children level. To produce even the simplest autonomous, adaptive, human behaviours,
    a humanoid robot must be able to, at least:'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Integration of Vision and Actions To Create Cognitive Humanoids ■ 193


    +   - Identify and localize objects in the environment, e.g. the chess pieces
    and board


    +   - Execute purposeful motions for interaction, e.g. move a piece to a de-ssired
    position


    At the beginning of AI research a clear goal was to build complete, intelligent,
    autonomous robotic system [50]. As with the example of above chess, it has to
    be quite challenging. Not helping the case was the fractioning of the fields into
    many distinct facets of research. While there was progress in each of the sub-fields
    and the disciplines (AI and robotics) separately, it has now become clear that
    a closer integration is needed. There has been renewed interest, from both research
    communities, to work together again towards the goal of intelligent robotic systems.


    The field of robotics has matured over the last few years. Current humanoid robots
    are stunning feats of engineering as mentioned above. To embed this with some
    sense of ''intelligence'' and the full versatility of advanced robotic systems,
    a bigger collaboration with the research community in Artificial Intelligence
    and Machine Learning is required.


    The idea of the ''embodied mind'' stems from philosophy. It claims that the nature
    of the human mind is determined by the form of the human body. Philosophers, psychologists,
    cognitive scientists, and artificial intelligence researchers who study embodied
    cognition argue that all aspects of cognition are shaped by aspects of the body.
    Embodied cognition reflects that the motor system influences our cognition, just
    as the mind influences bodily actions. Roboticists have argued that to understand
    intelligence and build artificial system that both have sensory and motor skills.
    Furthermore they need intelligence can only be achieved by machines that they
    need to be interacting with the world through a body. This ''embodiment'' is seen
    as an important condition for the development of cognitive abilities both in humans
    and robots [9, 62, 48]. The insights of these robotics researchers have also influenced
    philosophers.


    Machine Learning algorithms, have been applied in experimental robotics to acquire
    new skills, however the need for carefully gathered training data, clear initialization
    conditions, and/or demonstrated example behaviours limits the autonomy with which
    behaviours can be learned. To build robots that can perform complex manipulation
    skills that help users in their activities of daily living is the aim of various
    research projects in Europe (e.g. [11, 60]).


    # Robot Learning


    As mentioned above the programming of these highly complex robot systems is a
    cumbersome, difficult and time-consuming process. Current approaches tend to describe
    each precise each precise movement in detail, allowing little to no flexibility
    or adaptation during execution. This obviously has issues'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# 194 Cognitive Robotics


    with scaling to highly complex settings. Therefore the robotics community has
    focused on methods to provide robots with the ability to act autonomously, adapt
    or ''learn'' how to behave without the need of hard-coding every possible outcome.


    Autonomous robots research is aimed at building systems that do not require the
    pre-programming of every possible situation encountered. Many kinds of robots
    have some degree of autonomy and different robots can be autonomous in different
    fields, such as space exploration, a high degree of autonomy is desirable. For
    an autonomous robot one generally assumes the following capabilities [14]:


    +   * Gain information about the environment (Rule #1)

    * Work for an extended period without human intervention (Rule #2)

    * Move either all or part of it throughout its operating environment without human
    assistance (Rule #3)

    * Avoid situations that are harmful to people, property, or unless those are part
    of its design specifications (Rule #4)

    * Maintain its only survival at the expense of the previous rules (Sentient Robot
    Mandate) (Rule #5)


    In the early 90s of the last century Behavioral Robotics (or behaviour-based robotics)
    was introduced as a way to deal with more and more complex robots and application
    areas [8]. This research area focuses on flexible switching mechanisms to change
    the robots main behaviours based only on a very simple internal model. The basic
    idea is that (close and possibly simply) sensor-motor connections can result in
    behaviours that appear complex and sophisticated. Due to the fact that these models
    used a simple approach, rather than a computational model and the relatively low
    cost of development, popularised this approach in the mid-90s. This paradigm has
    a wide range of application in multi-robot systems [4] yet the scaling to complex
    robots, such as humanoid, has not been successful so far.


    Robot Learning generally refers to research into ways for a robot to learn certain
    aspects by itself. Instead of providing all information to the robot priori, for
    example, possible motions to reach a certain target position, the agent will through
    some process ''learn'' which commands lead to what action. The research field
    is at the intersection of machine learning and studies how robots can acquire
    new skills through experimentation. The earlier mentioned ''embodiment'' plays
    an important role here. Example include the learning of sensorimotor skills (for
    example locomotion, grasping, object manipulation) as well as interactive skills
    such as manipulation of an object in collaboration with a human. In addition the'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Integration of Vision and Actions To Create Cognitive Humanoids ■ 195


    learning of linguistic skills, especially the grounding of words or phrases in
    the real world, is of interest to the research community. The field of ''robot
    learning'' is closely related to other disciplines, for example, adaptive control.
    Learning in realistic environments requires algorithms that can deal with high-dimensional
    states, e.g. to detect events in the stream of sensory inputs, change and uncertainty.
    Note that machine learning is nowadays often used for computer and robot vision
    tasks (like in this dissertation), this area of research is still not referred
    to as ''robot learning''. The fields of Cognitive Robotics, Developmental and
    Evolutionary Robotics emerged with the specific aim to investigate how robots
    can ''learn'' for themselves and thereby generate more autonomous and adaptive
    capabilities.


    In Cognitive Robotics [3] the aim is to provide robots with cognitive processes,
    similar to humans and animals. An integrated view of the body is taken, including
    the motor system, the perceptual system and the body''s interactions with the
    environment. The acquisition of knowledge, may it be through actions (e.g. motor
    babbling) or perception is a big part of cognitive robotics research. Another
    is the development of architectures for these tasks. A variety has been proposed
