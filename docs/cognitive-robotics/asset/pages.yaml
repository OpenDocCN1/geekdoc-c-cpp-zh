    common trajectory of motivation for the authors emerged. Deeper interaction, and
    more subtle, sustainable and meaningful human-robot relationships were cited as
    the driving motivation behind their work. The authors sought ‘increasing acceptance
    and integration into people’s lives’ [45], ‘longer and a much more rewarding interaction’
    [37], and ‘to combine human creativity, emotion, and aesthetic judgment with the
    algorithmic capabilities of computers, allowing human and artificial players to
    build on each other’s ideas’ [63]. We acknowledge the focused nature of our sample,
    although the sample was curated across fifteen years of robots shown at non-traditionally
    aligned robotics conferences such as ACMGRAPH and ACM CHL. These robots were specifically
    selected as breaking the traditional classifications of industrial, service and
    social machines, and functioned more like cultural agents that were performative
    or creators of material and noncultural culture, and therefore might be more aptly
    as ‘Cultural Robots’. This discussion is expanded in the following sections.


    The collective desire of these contemporary roboticists for interaction and greater
    collaboration extends beyond the mechanics of the robot to inherently involve
    working with others, namely, a human counterpart. For the purposes of this study,
    we will focus on the desire for collaboration, as its nature encompasses the aforementioned
    qualities. As outlined by Brezaal [17], collaboration demands an open channel
    of communication, maintenance of shared goals and beliefs amongst team members,
    mutual understanding and joint activity, and established roles and capabilities
    amongst team members [20]. We envisage human-robot collaborative tasks to take
    place in domestic, institutional and commercial settings, including but not limited
    to, household duties (cooking, cleaning etc.), cultural undertakings such as composing
    a piece of music, or painting a picture, as well as day-to-day operations such
    as caring for the elderly, or building a piece of furniture.


    While extensive research has been conducted the technical and cognitive demands
    on interactive and collaborative robots [2, 9, 15], as highlighted by Fog [30],
    little research has been to investigate human willingness to closely interact
    with a social robot. Brian Duffy confirms this ‘The sense of social acceptance
    is important in the greater debate regarding the context and degree of social
    integration of robots into people’s lives and physical space [24]. To that end,
    we have developed a cognitive model adapted from the Theory of Planned Behavior,
    to investigate the influences and determinants of human willingness to collaborate
    with a robot.


    # 7.2 A COGNITIVE MODEL FOR DETERMINING HUMAN WILLINGNESS TO ENGAGE WITH COLLABORATIVE
    ROBOTS


    The cognitive model developed (Figure 7.1) is an adaptation of the Theory of Planned
    Behavior (TPB) [4], appropriate from the field of psychology.'
