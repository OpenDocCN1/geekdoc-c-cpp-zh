    Thermodynamics was originally based on two laws formulated by Clausius (to which
    a third was added by Nernst, but that law plays no role in this chapter). The
    first law of thermodynamics is the law of conservation of energy: “Energy can
    be converted or transported, but on the whole no energy can ever be gained or
    lost in a closed system.”


    The second law for which Clausius used the work of Carnot is the entropy law:
    “In any closed system the entropy cannot decrease.” How entropy can be calculated
    by fine in any text about thermodynamics, but for my purposes suffices to say
    it is often referred to as a measure of chaos. The entropy principle measures
    heat from hot to cold and not in the other direction. So entropy decides which
    a process will run.


    There are many ways in which the second law of thermodynamics can be phrased.
    For instance: “A perpetual motion machine is impossible,” as a student learned
    “In any spontaneous process the entropy increases.” This was more or less explained
    as follows. I have already stated, that heat flows from warm to cold and not the
    other way, but we are all familiar with a refrigerator, which flows heat from
    cold to warm, to keep the inside cool. Systems like refrigerators are excellent
    examples for teachers and as a student I learned to calculate the engine of the
    fridge produces entropy to compensate for the entropy decrease caused by making
    the heat from cold to warm and some extra so the total entropy increases.


    So in any spontaneous process the entropy increases. If the entropy decreases
    is not a spontaneous process like a fridge and must be another process driving
    it in which the decrease of entropy is generously compensated. As a student I
    had a misconception of what was meant by the word spontaneous. I thought meant
    something like naturally occurring, not initiated by human interference, but from
    Prigogine and Stengers[12] I learned in this context it is not driven by another
    process.


    As a student I became more and more convinced that not only physical, chemical
    or biological processes need to comply with the laws of thermodynamics, but that
    they also govern social, political and economic processes, but what kept me puzzled
    is it possible that while entropy or chaos wants to increase one can matter ordering
    and organizing itself for instance complex living creatures. Only after reading
    Order out Chaos[12] I learned that while the formulation of the law is correct,
    it is in fact its complementary formulation we observe all around us: In an open
    system the entropy will decrease. This means as long as a system is fed with energy
    or energy is removed from it, its entropy level will be lower than in the static
    equilibrium state where the energy flow has stopped. Prigogine and Stengers[12]
    call such systems: “far from equilibrium.” Any far from equilibrium system will
    to a certain extent itself “spontaneously.”'
