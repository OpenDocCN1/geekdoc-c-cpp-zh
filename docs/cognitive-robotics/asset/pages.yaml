    fire the participant and the robot must abandon the boat. To return to land safely,
    the participant and the robot should make a series of decisions: 1) while abandoning
    the boat, select the six most important items for survival to take to the lifeboat
    from a total of twelve items and take the six items; 2) while operating the lifeboat,
