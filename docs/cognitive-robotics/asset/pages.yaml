  md: '# 6.1　INTRODUCTION


    RECENTLY the technologies of robotics have been extended from largely industrial
    fields to health care, social services, aerospace and so on. The role of robots,
    in particular, is moving from a traditional one of supervision labour shortage
    and solution of dangerous work to becoming an important part of users’ daily lives
    - social robots. Robots provide life service such as house cleaning and babysitting,
    as well as decision-making support. Previous findings indicating that participants
    performed social behaviours while interacting with humanoid robots [4]. Tms-developed
    shopping robots, in places of humans, making purchases based on information collected
    in markets [10]. iRobot - one of the most famous robotics companies - had sold
    more than 10 million robots by 2013.


    Recent studies of human-robot interaction (HRI) have revealed the influences of
    design factors of robots on human decision-making. These factors include physical
    characteristics of robots (i.e. appearance, size, humanoid or machine-like, etc.),
    methods of information interaction (i.e. gesture, vision, language, etc.), training
    strategies (i.e. showing and teaching, programming, etc.), structures of robot
    user teams (i.e. the users of cooperators, competitors, operators), task design
    and so on. There should be more on the influences of the interaction environments,
    interaction tasks, robots’ attributes and the background and experience of users
    [23]. This chapter reviews HRI studies in respect to the following aspects: cultural
    context, robots’ social role and their effects on human decision-making. The direction
    of future work in the field of cross-cultural HRI and decision-making is discussed.


    # 6.2　EFFECTS OF CULTURAL CONTEXT


    # 6.2.1　Factors Influencing Human–Robot Interaction


    There are four factors of robots which should be considered in the research of
    HRI, i.e. factors related to human beings, factors related to robotics, factors
    related to tasks and factors related to contexts.


    The factors related to robotics includes forms and appearance, behaviours, learning
    ability, characteristics, affection, communication methods, appearing during the
    experiment and purposes [9]. When the robots are shaped, the factors related to
    robotics also include gender, nationality and facial characteristics. The appearance
    of robots also influences human perception [7, 11, 14, 27], including how humans
    assume robots’ abilities, how humans behave with robots and their judgement on
    robots. Mashiro Mori proposed a famous model - uncanny valley [38]. Mori stated
    that when the appearance of a robot is made more humanoid, participants will respond
    towards the robot more positively. When the similarity increases and reaches a
    point, the response quickly becomes strong repulsion. However, as the robot’s
    appearance continues to become more humanoid, participants’ responses'
