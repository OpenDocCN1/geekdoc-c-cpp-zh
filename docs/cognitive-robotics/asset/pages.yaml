    For robots to understand the social context and generate the proper responses
    is deemed to be a challenging task. Most social interactions in particular dialogue
    among humans require substantial domain and context-specific knowledge to interpret
    the intents, emotions and social relations among the agents involved. Lack of
    the kind of knowledge and models, is hard for a robot or virtual agent to infer
    the social contexts and generate proper responses.


    We established the technologies using speech-acts that enable a virtual agent
    or robot to interpret the social contexts in a dialogue. We show how different
    speech acts can be modeled and used to assist virtual agents in inferring the
    social contexts. To deal with the sequential changes of social contexts in a dialogue,
    we adopt dynamic belief networks to compute the likelihood of the social context
    parameter values. We evaluate the feasibility of the social awareness model against
    human annotated dialogue corpus excerpted from segments of movie scripts.


    # 8.1 INTRODUCTION


    To make robots to behave properly in human society is the ultimate and challenging
    goal of robotics research. The major factor for hindering robots to co-inhibit
    with humans in human society is lack of social common sense which we call it social
    context awareness. Without social context awareness, robots cannot interpret human''s
    intentions and generate proper response accordingly. By social context awareness,
    we extend the concept of current state of the arts of context awareness is to
    infer the physical and environmental contexts from sensor data [1] to much higher
    level of social contexts in human interactions.


    In this chapter, we treat robots as autonomous agents who will be able to infer
    the belief, desire, goal and intention, emotion states, mood, personality of other
    agents in a social interactions. It also means agents will understand the social
    relations, roles, commitment of other agents in the social interactions. Therefore,
    the terms robots and agents can be used indistinguishable in this paper. To some
    extent, wider scope of social awareness also implies agents understand the social
    norms, social convention, morality'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Social Cognition of Robots during Interacting with Humans ■ 145


    of behaviors or culture of human society. However, without losing of generality,
    we limit our study on some lower level of social contexts. To interpret a given
    unknown social context, we might have to rely on other social contexts to interpret
    correctly. For example, we want to understand a person''s role or relation with
    other agents in the social context to assess if it obeys the social norm or not.
    Since social contexts might change during social interactions, the history social
    contexts might become important background information to interpret current social
    context.


    For virtual agents to interact and communicate among each other freely, there
    are a lot of bottlenecks to overcome. Previous virtual agents search assume maxims
    of communication [12] to simplify the agent communication problem to overcome
    some bottlenecks that lead to the design of ACL [2][11]. The Grice maxims can
    be viewed as the assumptions on an ideal communication that must obey the principles
    of Quality, Quantity, Relation and Manner. The quality principle assumes the communication
    agents are honest and truthfully. For example, if they ask a question about X,
    they don''t know X and they want to know X. The quantity principle assumes the
    communication agents are precise. For example, if they communicate, they will
    reveal as much information as required, no more and no less. The relation principle,
    assume the communication agents will convey only relevant information. That, if
    they refer the things to the purpose of communication. The manner principle assumes
    the communication agents must present things appropriately. Namely, they will
    avoid ambiguities and present things in a clear and orderly way. The Grice maxims
    are to characterize an ideal communication among virtual agents and robots. They
    can also serve as criteria to evaluate whether a way of communication is good.
    However, it is hard for human to follow in the real world communication communicators
    consciously might wish to attain the ideal communication goals. There are couples
    of reasons that human communicators cannot follow the Grice maxims easily:


    +   1. Humans are not always cooperative, and therefore, you cannot assume human
    communicators answer the question based on what they know. They might not be polite
    and therefore not always follow the protocol in communication or even when they
    sometimes violate the norms of communications in a hostile manner. For example,
    you are asking a stranger some information, the stranger might not necessarily
    reply what they know to.


    +   2. Humans are not always certain about what they know or cannot sometimes
    find the exact terms or parsimony statements to express. Or they might sometimes
    have false beliefs, even they they have an intention to reveal the truth. They
    can sometimes generate incorrect or false information unintentionally.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# 146 Cognitive Robotics


    +   3. Humans might not always be honest, and sometimes times lie or cheat to
    others. Therefore they might also generate false information intentionally.


    +   4. Humans might be malicious or negative pragmatic such as irony or sarcasm
    at various situations in social interactions. For example, one might want to discredit
    or hurt the social influence of another.


    +   5. Human might not express directly, but rather adopt indirect hints (sometimes
    due to politeness) in social interactions. For example, not to explicitly mention
    the age or sex to females directly.


    +   6. Humans may have ambiguous or multiple intentions in one statement. For
    example, asking time or requesting to light a cigarette from a person might sometimes
    be used as a start of conversation to a stranger but might also have an intention
    to request the time or assistance at the same time.


    Social contexts in human interactions, either physical or dialogical, can be inferred
    from various clues based on observations. The fundamental techniques to interpret
    the social contexts can be based on various sensor technologies for context-awareness
    [9] such as camera, sound, or even environmental sensors such as GPS, temperature,
    etc. However, social awareness involves many mental states of agents that is difficult
    to verify or directly observe. With sensor data alone, we cannot easily distinguish
    social states of agents without support from some context background information
    and social models. This is because without background social contexts, there can
    be many ambiguities and exceptions in the interpretation. For example, seeing
    someone waving a hand, it might mean saying hello, saying good bye, or saying
    no, etc. depending on different social situations. Without background context
    models, only limited levels of abstract inference can be based on sensor data
    alone. For example, sensor data might be to recognize a person''s body movement
    as walking, but we must combine with background contexts such as walking/out of
    a room at given time period to infer if the person is going to sleep or is going
    out to work. Sometimes we need to know the social role of a person to judge if/her
    behavior is permitted to enter the room.


    In reality, physical interactions and verbal interactions can be viewed as communication
    actions. Agents can use body language, gesture, facial expressions to conduct
    communication among each other. But verbal interaction via dialogue is more complex
    than requires agents to adopt various complex levels of natural language processing
    and reasoning techniques. We attempt to capture the knowledge of verbal interactions
    in terms of speech theories and models [2]. The speech act model is to treat each
    utterance in a dialogue as an action that has intention, preconditions and effects.
    The pragmatic knowledge of a speech act is expressed in terms of the change of
    preconditions and effects. In particular, we model a speech act in terms of the
    change of social contexts in both preconditions and effects of the speech act.'
