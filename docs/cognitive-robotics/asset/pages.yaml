  md: 'During the experiment, participants were required to talk with the robots in
    their native languages and finish some tasks following the robots’ instructions.
    The experiment tasks were designed based on the functions existing robots or would
    have. The tasks of teaching included English teaching and health-care teaching.
    In the tasks of guiding, robots guided the participants to visit the former residence
    of Copernicus. The entertaining tasks included structuring on secure functions
    and performing security measures with respect to buildings.


    Participants did not operate the robots by themselves. The interaction between
    participants and robots included oral interaction and behavioural interaction.
    The robots just performed scattered, short-term and basic behaviours in order
    to avoid the influence of their body language on participants. For the humanoid
    robots, the behaviours included shaking heads, raising arms and moving legs. For
    the machine-robots, the behaviours included moving forwards and backwards through
    the rotation of wheels. For the zoomorphic robots, the behaviours had included
    nodding. The movements of all three types of robots were designed through the
    platform of Lego Mindstorm NXT. In total, 108 participants were recruited in this
    experiment, including 36 participants from Chinese, Korean and German cultures
    respectively. According to the results, Chinese and Korean participants showed
    higher likability, engagement and satisfaction than German participants. When
    the interaction mainly relied on oral communication rather than body language
    and environmental support, the engagement of robots’ recommendations on Chinese
    and German participants was lower than Korean participants in all contests.


    In the same year of 2007, Rau’s team conducted another experiment to investigate
    the impacts of robots’ recommendations on human decision-making behaviours [22,
    28]. The experiment included a series of prize-guessing tasks with similar items.
    Participants were required to guess which one was more expensive than two items.
    After participants made the primary decision, robots provided their suggestions.
    Participants had a choice to change or not change their first decision. This study
    considered two aspects: two robot-related variables (i.e. robots’ communication
    styles and language) and one human-related variables (participants’ cultural background).
    16 Chinese and 16 German participants were recruited to take part in the experiment.
    In different contexts, the robots communicated with the participants through different
    methods - implicit or explicit recommendations. The results indicated that Chinese
    participants considered robots more likable, more trustworthy and credible than
    German participants. When making decisions, Chinese participants were more likely
    to be influenced by robots than German participants. Both Chinese and German participants
    preferred to communicate with robots using implicit recommendations rather than
    explicit recommendations.'
