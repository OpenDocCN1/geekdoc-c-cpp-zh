    of organic food [64]. Beliefs concerning the perceived benefits or detriments
    of collaboration with a robot will be dependant on various individual situations,
    reasons for the collaboration, and the different individuals and robots involved.


    # 7.2.1.3 Normative Beliefs


    Normative Beliefs describes an individual''s beliefs about what others expect
    them to do in a given situation, and are in turn multiplied by these perceived
    norms [5]. Cross-cultural studies have demonstrated that Normative Beliefs have
    a strong capacity to influence an individual''s intention to perform a behaviour,
    even in a ''Confucian culture'' (p.193) where collective and interdependent mentality
    may be more highly valued, compared to Western cultures [40]. Given the highly
