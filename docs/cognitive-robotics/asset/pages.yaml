    # 1.4.4 When Robots Are Modified or Misused


    Misconduct by a robot, whether accidental or otherwise, can occur when a robot
    is misused or when it is modified by an owner or user in such a way as to make
    the product more liable to cause an accident. Clearly any modification made to
    a robot after its sale may be relevant in how a court determines questions of
    product defect or the issue of causation. And, modifications to a product could
    also introduce the possibility of shared responsibility for a robot accident,
    adding yet another level of complexity to the legal arguments.


    # 1.4.5 Other Considerations of Legal Responsibility


    I am sure that by now you have realized that the issue of product liability in
    law is far from straightforward, especially in the case of robotic products. And
    the less straightforward it is, the more the arteries of the courts will become
    clogged, the bigger the potential treasure chest will be for the lawyers.


    So we must accept that, in cases involving the use or misuse of an autonomous
    robot, the legal problem of who to blame is a complex one, far more than with
    a non-thinking product. And the fact that an autonomous robot bears some of the
    mental characteristics of a human being creates a very different class of legal
    problems if the robot is faulty.


    Believe it or the complications do not end there. Up now we have considered only
    cases where an accident was caused directly by the use or misuse of a robot, but
    it is also possible for a robot (or an animal) to cause accidents indirectly,
    for example by distracting drivers or other road users. This type of situation
    is addressed by German law, under which dog owners have a legal obligation to
    control the behavior of dogs on the street. If a dog in Germany irritates or restricts
    a road to the point of causing an accident, then the owner of the dog is held
    to be legally responsible for the accident.


    # 1.4.6 Summary of Legal Considerations


    With all of this myriad legal complexities to consider, and all the technological
    complexities, can it be reasonable to expect lawmakers to formulate laws that
    adequately deal with robot accidents? Are judges and juries going have the necessary
    background knowledge and understanding to decide justly on questions of liability?
    In my opinion the answer to both questions is a resounding “No!”


