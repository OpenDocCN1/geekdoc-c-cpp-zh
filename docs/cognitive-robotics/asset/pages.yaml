    the user will continue to explore and find new connections between their behaviour
    and the shape-changing object''s behaviour unless it is suggested in some time.
    In game design, for example, the length of the experience time on the casing,
    but in games clear goals are often achieved along the way to signal the progression,
    which help a user engaged in the exploration of the game. In hypertext research,
    studies suggest that users explore for some time, but quickly change their focus
    towards “getting the gist” of the story [23]. In those studies, users were faced
    with obstacles and unexpected behaviours of the story controlled by the computer
    system. At first, users would explore and look for variation; however, there was
    a quick shift toward making sense of the story that all users shared. Given playful
    shape-changing objects that can change shape according to mappings that may change
    and not adhere to ‘real’ physics, it would be interesting future work to evaluate
    whether users wanted continued and surprising physics, or if they strive to develop
    an understanding of the general behaviour of the object and if this understanding
    of how things works is upset by changes, how tolerant are the users or does it
    draw them in even more?


    # 5.5 MOVEMENT AND INCIDENTAL EFFECTS OF ACTUATORS


    Robots and shape-changing objects take action in the world through a variety of
    electronic and mechanical means. Skillful designers choose the actuators carefully
    according to the physical characteristics and performance taking into consideration
    the type of movement desired (rotation, linear, etc.). Per-'
