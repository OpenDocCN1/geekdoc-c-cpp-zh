    # 7.4 FUTURE RESEARCH


    The results of this early research have provoked a number of significant questions
    and highlighted areas for future research.


    Through the implementation of user studies and design iteration, we have begun
    work to test the cognitive model presented to determine the extent to which the
    determinants are able to predict human willingness to collaborate with a robot,
    and to investigate alternative possibilities for how it may be operationalised.
    Furthermore, we are interested in how these determinants might be distilled into
    a framework for use in the design and planning of socio-cultural robotic agents.


    We are curious whether this research will result in the identification and deliberate
    integration of cultural semantics into robotic design, or encourage an awareness
    and recognition of culture in design, leading to the development of ‘culturally
    neutral’ robots, or perhaps both.


    This cognitive model requires further research into specifically what factors
    may influence an individual’s assessment of their capacity and resources to engage
    with a robot (see HUMAN Control Beliefs). We predict that some of these factors
    may be deduced as a result of aesthetics, for example a complicated mechanical
    exterior compared to a streamline and simplistic aesthetic may greatly alter not
    only the user’s assessment of the robot but also their personal capacity to engage
    with it.'
