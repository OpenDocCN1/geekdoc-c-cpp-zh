    # 7.2.1 Determinants


    # 7.2.1.1 Control Beliefs


    In focusing on Perceived Behavioral Controls, we have separated our analysis into
    two predictors of Control Beliefs (HUMAN) and (ROBOT). PBC is the perceived ease
    or difficulty of engaging in the behavior determined by belief about personal
    resources, knowledge, skills and opportunities, and the power of these elements
    to influence behavioral outcomes [26].


    In a scenario requiring collaboration, the collaborators must establish mutual
    beliefs determining the intention, values, motivation and the capabilities of
    one another [17]. Thus, the human collaborator must make this assessment of a
    robotic counterpart.


    The ‘media equation’ presented by Byron Reeves and Clifford Nass [51] tells us
    that people will equate social robots with real social actors, and that our interactions
    with new media are social and natural, just like real life. Nass and associates
    have also found that individuals automatically apply social rules in their interaction
    with computers as if they were interacting with human beings [42, 47]. Considering
    this, we assume that a person will assess a robot collaborator just as they assess
    a human. For a robot collaborator, this judgement may be a matter of cognitive
    wiring, but for the human counterpart, we argue that this assessment will primarily
    be an initial visual aesthetic expectations and readings. Fong explains, “The
    form and structure of a robot is important because it helps establish social expectations.
    Physical appearance biases interaction. More, the relative familiarity (or strangeness)
    of a robot’s morphology can have profound effects on its accessibility, desirability,
    and expressiveness [30].


