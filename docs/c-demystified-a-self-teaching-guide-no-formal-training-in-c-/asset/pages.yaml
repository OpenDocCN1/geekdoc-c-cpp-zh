  md: "# Indirection Operator and Dereferencing\n\nThe primary use of a pointer is\
    \ to access and, if appropriate, change the value of the variable that the pointer\
    \ is pointing to. In the following program, the value of the integer variable\
    \ num is changed twice.\n\n```\n#include <iostream>\nusing namespace std;\n\n\
    int main () {\n    int num = 5;\n    int* iPtr = &num;\n    cout << \"The value\
    \ of num is \" << num << << \" << endl;\n    num = 10;\n    cout << \"The value\
    \ of num after num = 10 is \"\n    << num << endl;\n    *iPtr = 15;\n    cout\
    \ << \"The value of num after *iPtr is 15 is \"\n    << num << endl;\n    return\
    \ 0;\n}\n```\n\nThe resulting output is\nThe value of num is 5\nThe value of num\
    \ after num = 10 is 10\nThe value of num after *iPtr = 15 is 15\n\nThe first change\
    \ should be familiar, the direct assignment of a value to num, such as num = 10.\
    \ However, the second change is accomplished a new way, using the indirection\
    \ operator:\n\n*iPtr = 15;\n\nThe indirection operator is an asterisk, the same\
    \ asterisk that you used to declare the pointer or to perform multiplication.\
    \ However, in this statement the asterisk is not being in a declaration or to\
    \ perform multiplication, so in this context it is being used as an indirection\
    \ operator.\n\nNote As mentioned earlier in this chapter, this is another example\
    \ of a symbol having different meanings in the C++ programming language depending\
    \ on the context in which it was used.\n\nThe placement of the indirection operator\
    \ before a pointer is said to dereference the pointer. Similarly, some texts refer\
    \ to the indirection operator as the dereferencing operator. The value of a dereferenced\
    \ pointer is not an address, but rather the value at that address—that is, the\
    \ value of the pointer points to.\n\nFor example, in the preceding program, iPtr's\
    \ value is the address of num. However, the value of iPtr dereferenced is the\
    \ value of num. Thus, the two statements have the same effect, both changing the\
    \ value of num:\n\n```\nnum = 25;\n*iPtr = 25;\n```\n\nSimilarly, a dereferenced\
    \ pointer can be used in arithmetic expressions the same as the"
