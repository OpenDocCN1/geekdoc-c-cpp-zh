    \ issues arise variable scope and lifetime.\n\nThe issue of variable scope was\
    \ introduced in Chapter 8 in connection with the do loop. The issue of variable\
    \ lifetime is new.\n\n# Local Variables\n\nYou can call the same function multiple\
    \ times. The following program attempts to call the printMessage function in a\
    \ loop until the user decides to stop, and each time outputs the number of times\
    \ the printMessage function has been called. The goal is that the first time the\
    \ printMessage function is called, the output will be \"This function called 1\
    \ times\" (ardon the bad grammar), the second time the printMessage function is\
    \ called, the output will be \"This function called 2 times\" and so on.\n\n```\n\
    #include <iostream>\nusing namespace std;\nvoid printMessage(void);\n\nint main()\n\
