  md: "# Increment and Decrement Operators\n\nIncrement means to increase a value\
    \ by one. Conversely, decrement means to decrease a value by one. C++ has an increment\
    \ operator that you can use to decrease a value by one. This section will show\
    \ you how to use both, something that will be useful in the next section for the\
    \ loop, which uses increment and decrement operators.\n\n# The Increment Operator\n\
    \nIn the following program, the statement num += 1 increases the value of the\
    \ integer variable num, which was initialized to the value 2, by 1, so the output\
