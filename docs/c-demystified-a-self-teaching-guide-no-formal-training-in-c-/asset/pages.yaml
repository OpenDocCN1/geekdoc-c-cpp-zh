  md: '```

    while (num <= 10)

    cout << num << " ";

    ```


    Forgetting to update the value of the variable you are using in the condition
    is a common mistake with a loop. Forgetting the update is less common with a loop
    because update is the usual purpose of the third expression in the parentheses
    following the for keyword.


    Otherwise, the syntax rules discussed in Chapter 7 concerning the for loop apply
    to the while loop. For example, if more than one statement belongs to the while
    loop, then the statements must be contained within curly braces. That is why in
    the program outputs the numbers between 1 and 10 using the while loop, the two
    statements in the body of the loop are contained within curly braces.


    ```

    while (num <= 10)

    {

    cout << num << " ";

    num++;

    }

    ```


    In the program we just analyzed, the update of the value of num was done within
    the body of the loop. The update could also be done within the condition itself:


    ```

    #include <iostream>

    using namespace std;

    int main(void) {

    int num = 0;

    while (num++ < 10)

    cout << num << " ";

    return 0;

    }

    ```


    Updating the counter within the condition requires two changes from the previous
    code. First, the value of num has to be initialized to 0 or 1 because the increment
    inside the parentheses during the first iteration of the loop would change that
    variable''s value to 1. Second, the relational operator in the condition is <
    than <= because the value of num is being incremented before it is outputted.


    Updating the counter within the condition raises the question: Given the condition
    num++ < 10, which comes first, the comparison or the increment? Since the increment
    is postfix, the answer is the comparison.


    The counter could also be updated using a prefix increment. However, the condition
    should be ++num <= 10 to obtain the desired output.


    As for the loop, the statement or statements following the keyword and parentheses
    will not execute if the expression is followed by a semicolon; that would be interpreted
    as an empty test. So what would be the output if we placed a semicolon after the
    while condition in the following code fragment?


    ```

    while (num <= 10);

    cout << num++ << " ";

    ```


    The only number that would output is 11. The reason is that the loop continues,
    and the empty statement executes, until the condition fails when num is 11, at
    which time the statement executes and the value of num (11) is outputted.'
