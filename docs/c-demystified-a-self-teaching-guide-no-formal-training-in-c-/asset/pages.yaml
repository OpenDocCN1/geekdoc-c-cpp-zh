  md: "# The switch Statement\n\nThe switch statement is similar to an if /else if\
    \ /else statement. It evaluates the value of an integer expression and then compares\
    \ that to two or more other values to determine which code to execute.\n\nThe\
    \ following program shows a switch statement action in a program that determines\
    \ your average based on your grade:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main(void)\n{\n    char grade;\n    cout << \"Enter your grade: \"\
    ;\n    cin >> grade;\n    switch (grade)\n    {\n        case 'A':\n         \
    \   cout << \"Your average must be between 90 - 100\" << endl;\n            break;\n\
    \        case 'B':\n            cout << \"Your average must be between 80 - 89\"\
    \ << endl;\n            break;\n        case 'C':\n            cout << \"Your\
    \ average must be between 70 - 79\" << endl;\n            break;\n        case\
    \ 'D':\n            cout << \"Your average must be between 60 - 69\" << endl;\n\
    \            break;\n        default:\n            cout << \"Your average must\
    \ be below 60\" << endl;\n    }\n    return 0;\n}\n```\n\nHere are several sample\
    \ runs, each separated by a dotted line:\n\nEnter your grade: C\nYour average\
    \ must be between 70 - 79\n------\n\nEnter your grade: A\nYour average must be\
    \ between 90 - 100\n------\n\nEnter your grade: F\nYour average must be below\
    \ 60\n\nFigure 5-6 uses a flowchart to illustrate this program."
