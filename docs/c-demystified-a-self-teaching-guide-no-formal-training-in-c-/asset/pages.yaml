  md: '# Summary


    The three subjects of this chapter were the character data type, a C-String (a
    null-terminated array), and the C++ string class.


    We first discussed the issues involved in reading a reader when a newline character
    may be left in the input buffer, and derived the following three rules.


    The first rule is to always follow cin and the string extraction operator (>>)
    with the no-argument ignore member function. The reason is that the cin object
    with the string extraction operator >> leaves a newline in the input buffer, so
    calling the no-argument ignore member function will dispose of leftover newline
    character.


    The second rule is not to use the ignore member function after using the getline
    function. The reason is that the getline member function removes the newline character
    that terminated the input buffer.


    The third rule is that after using the get function with one argument, such as
    cin.get(ch), to check if you have a newline character in the input buffer, and
    if you don''t, use the ignore member function. The reason is that the get function
    with one argument being a single character will leave a newline character in the
    input buffer if you type a character and then press ENTER, but it won''t if you
    press ENTER.


    The C++ standard library cctype contains a number of functions that are useful
    with characters. The toupper and tolower functions each have one argument, a character.
    If the character represents A through Z, the toupper function returns the uppercase
    of that. Conversely, the tolower function returns the lowercase of that. If the
    argument is not a letter, both functions return the same character that is the
    argument. A number of other functions in the cctype standard library, including
    but not limited to isalpha and isdigit, permit you to determine the value of a
    character, such as whether it is a letter, digit, or whitespace.


    The cstring library provides a number of functions that are useful when working
    with C-Strings. Similarly, the string library provides a number of functions that
    are useful with the C++ string class.


    We use the strlen function to determine the length of a C-string, the length or
    size member functions to return the length of a C++ string variable. We use the
    strcopy function and the assignment operator = to assign a value to a C++ string.
    We use the strcat function to append a value to a C-string, and the combined addition
    and assignment operator += to append a value to a C++ string class. We use the
    strncmp function to compare two C-strings, and the relational operators to compare
    two C++ string variables.


    The cstlib standard library provides several functions for converting the C-string
    representation of a number to a numeric data type, such as atoi, or ASCII to integer,
    at, or ASCII to Long, atof, or ASCII to float, and itoa, or Integer to ASCII.'
