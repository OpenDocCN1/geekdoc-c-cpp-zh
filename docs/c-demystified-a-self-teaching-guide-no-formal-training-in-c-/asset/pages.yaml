  md: "lifetime of the times variable, beginning programmers often make all variables\
    \ global so they can access these variables anywhere and anytime in their program.\
    \ This is not a good idea.\n\nWhile the good news is that a global variable can\
    \ be accessed throughout your program, this is also the bad news. fact that a\
    \ global variable can be accessed and changed anywhere in your program makes it\
    \ more difficult to determine why, for example a global variable has an invalid\
    \ value than if the variable's scope was far more limited. This is simply because\
    \ the more limited a variable's scope, the less places there are in the code that\
    \ might affect its value.\n\nTherefore, global variables can make it more difficult\
    \ to fix problems with your programs. For this reason, some programmers, and programming\
    \ teachers, go to the extreme and pronounce that \"all variables are evil.\" I'm\
    \ not sure I would go that far, but I would recommend that not use global variables\
    \ unless you have a very good reason to do so, since there usually are better\
    \ alternatives. One alternative, a static local variable, is examined next.\n\n\
    # Static Local Variables\n\nUntil now a variable's lifetime was dictated by its\
    \ scope. Since a local variable's scope was limited to the function in which it\
    \ was declared, the local variable's lifetime ended when that function ended.\
    \ Since a global variable had scope throughout the program, the global variable's\
    \ lifetime did not end until the entire program.\n\nA static local variable is\
    \ different. A static local variable has the scope of a local variable but the\
    \ lifetime of a global variable. This may seem counter-intuitive, to illustrate\
    \ let's modify the print function we have working with.\n\nA static local variable\
    \ is declared exactly like a local variable, within a function rather than above\
    \ functions as a global variable. The difference between the declaration of a\
    \ static local and a nonstatic, or automatic, local variable is that declared\
    \ with the static keyword, and usually also with a starting value. Thus, in the\
    \ following program, instead of the declaration\n\n```\nint times;\n```\n\nthe\
    \ declaration is\n\n```\nstatic int times = 0;\n```\n\nHere is the program in\
    \ its entirety:\n\n```\n#include <iostream>\nusing namespace std;\nvoid printMessage(void);\n\
    \nint main () {\n    char choice;\n    do {\n        cout << \"Enter Q to quit,\
    \ any other character to continue: \";\n        cin >> choice;\n        if (choice\
    \ == 'Q')\n            cout << \"Input stopped\";\";\n        else\n         \
    \   printMessage();\n    }\n}\n```"
