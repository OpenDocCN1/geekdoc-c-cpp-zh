    \ <iostream>\nusing namespace std;\nint main (n{\n    int numTests;\n    cout\
    \ << \"Enter the number of test scores:\";\n    cin >> numTests;\n    int testScore[numTests];\n\
    \    return 0;\n}\n```\n\nThe result is a compiler error. The compiler will flag\
    \ the declaration of the array (int testScore[numTests]) and complain that a constant\
    \ expression was expected. The reason a constant (or literal) expression is required\
    \ is in this program we are allocating memory for the array at compile time. The\
    \ compiler needs to know exactly how much memory to allocate. However, if a variable\
    \ is the size declarator, the compiler does not know how much memory to allocate\
    \ because a variable's value may change. Indeed, in the preceding example, the\
    \ value of the variable used as the size declarator is not even known until runtime.\n\
    \nHaving said though, it is often desirable to have the user determine at runtime\
    \ the size of the array so it is neither too small nor too large, but just right.\
    \ To accomplish this, you need declare the array using dynamic memory allocation.\
    \ The following program modifies the previous one to use dynamic memory allocation:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main (\n{\n    int numTests;\n\
    \    cout << \"Enter the number of test scores:\";\n    cin >> numTests;\n   \
    \ int * iPtr = new int[numTests];\n    for (int i = 0; i < numTests; i++)\n{\n\
    \        cout << \"Enter test score #\" << i + 1 << \" : \";\n        cin >> iPtr[i];\n\
    \    }\n    for (i = 0; i < numTests; i++)\n    cout << \"Test score #\" << i\
    \ + 1 << \" is \"\n    << iPtr[i] << endl;\n    delete [] iPtr;\n    return 0;\n\
    }\n```\n\nSome sample input and output follows:\n\nEnter the number of test scores:\
