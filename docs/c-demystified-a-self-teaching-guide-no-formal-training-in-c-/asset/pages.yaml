    int testScore, myWeight, myHeight;\n```\n\nThe data type appears once, even though\
    \ three variables are declared. The reason is that the data type qualifies all\
    \ three variables, since they appear in the same statement as the data type.\n\
    \nHowever, the variables must all be the same data type to be declared in the\
    \ same statement. You cannot declare an int and a float variable in the same statement.\
    \ Instead, the int and float variables would have to be declared in separate statements.\n\
    \n```\nint testScore;\nfloat myGPA;\n```\n\n# Naming the Variable\n\nVariables,\
    \ like people, have names, which are used to identify the variable so you can\
    \ refer to it. There are only a few limitations on how you can name a variable.\n\
    \n+   * The variable name cannot begin with any character other than a letter\
    \ of the alphabet"
