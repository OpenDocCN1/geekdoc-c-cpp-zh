    # # Summary


    A function is a group of statements that together perform a task. While no program
    needs more than a **main** function, as you write and understand more complex
    and sophisticated programs, your code will be easier to write, and if you fix
    the code among different functions, each performing a specific task.


    You implement a function in addition to **main** by first defining and then calling
    it. A function definition consists of a function header and a function body. The
    function header consists of a return type, a function name, and an argument list.
    The function header is always followed by an open curly brace, which begins the
    *function body*. The function body ends with a curly brace and contains one or
    more statements, generally ending with a return statement. Additionally, unless
    the function is defined before it is used, it must be prototyped.


    In programs where the only function is **main**, all variables defined at the
    top of that function are accessed throughout the entire program. However, once
    we start dividing up the code into separate functions, issues arise concerning
    variable scope. A variable''s scope determines where it can be referred to. A
    variable''s lifetime determines when it is destroyed. A local variable''s scope
    and lifetime is limited to the function in which it was declared. By contrast,
    a global variable''s scope and lifetime are throughout the entire program. Finally,
    a static variable''s scope is limited to the function in which it was declared
    like a local variable, but its lifetime lasts throughout the entire program like
    a global variable.


    You can pass information to a function by using arguments, and pass arguments
    by value or by reference. You can also pass a variable by value when you don''t
    intend to change that value in the called function to affect that variable''s
    value in the calling function. Conversely, you pass a variable by reference when
    you intend to change that value in the called function to affect that variable''s
    value in the calling function. The order and data type of the arguments in the
    function prototype must correspond to the order and data type of the arguments
    in the function header. Similarly, the order and data type of the arguments in
    the function call must correspond to the order and data type of the arguments
    in the function header.


    While arguments are used to pass values to a called function, a return value can
    be used to pass a value back to the function that called it. However, while multiple
    values can be passed to a function as arguments, multiple values cannot be returned
    from functions.


    So far, the variables we''ve used have only been able to hold one value at a time.
    In [next chapter], we will discuss a type of variable that can hold multiple values
    simultaneously.


    Team LiB


