  md: '# What Is a Computer Program?


    Computers are widespread in our society because they have three advantages over
    us humans. First, computers can store huge amounts of information. Second, they
    can recall that information quickly and accurately. Third, computers can perform
    calculations with lightning speed and perfect accuracy.


    The advantages that computers have over even extend to thinking sports like chess.
    In 1997, the computer Deep Blue beat the world chess champion, Garry Kasparov,
    in a chess match. In 2003, Kasparov was out for revenge against another computer,
    Deep Junior, but only human, and therefore no match for the computer''s ability
    to calculate and remember games. Kasparov, while perhaps the best chess player
    ever, is only human, and therefore no match for the computer''s ability to calculate
    and remember games.


    However, we have one significant advantage over computers. We think on our own,
    while computers don''t at least not yet anyway. Indeed, computers fundamentally
    are more born than brain. A computer cannot do anything without step-by-step instructions
    from us telling it what to do. These instructions are called a computer program,
    and of course are written by a human, namely a computer programmer. Computer programs
    enable us to harness the computer''s tremendous power.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# What Is a Programming Language?


    When you enter a darkened room and want to see what is inside, you turn on a light
    switch. When you leave the room, you turn the light off.


    The first computers were not too different than that light switch. These early
    computers consisted of wires and switches in which the electrical current followed
    a path dependent on which switches were in the one (on) or off (zero) position.
    Indeed, I built such simple computer when I was a kid (which according to my own
    children was back when dinosaurs ruled the earth).


    Each switch''s position could be expressed as a 1: for one, 0 for the off position.
    Thus, the instructions given to these first computers, in the form of the switches''
    positions, were essentially a series of ones and zeros.


    Today''s computers, are far more powerful and sophisticated than these early computers.
    However, the language that computers understand, called machine language, remains
    the same, essentially ones and zeros.


    While computers think in ones and zeros, the humans who write computer programs
    usually don''t. Additionally, a complex program may consist of thousands or millions
    of step-by-step machine language instructions, which would require an incredibly
    amount of time to write. This is an important consideration since, due to competitive
    market forces, the amount of time within which a program has to be becoming increasingly
    and less.


    Fortunately, we do not have to write instructions to computers in machine language.
    Instead, we can write instructions in a programming language. Programming languages
    are far more understandable than programmers because programming languages resemble
    the structure and syntax of human language, not ones and zeros. Additionally,
    code can be written much faster with programming languages than machine language
    because programming languages automate instructions; programming language instruction
    can cover many language instructions.


    C++ is but one of many programming languages. Other programming languages include
    Java, C#, and Visual Basic. There are many others. Indeed, new languages are being
    created all the time. However, all programming languages have the same purpose,
    which is to enable a human programmer to give instructions to a computer.


    Why learn C++ instead of programming language? First, it is very widely used,
    both in industry and in education. Second, many other programming languages, including
    Java and C#, are based on C++. Indeed, the Java programming language was easier.
    Therefore, knowing C++ makes other programming languages easier.'
  merge: -1
