  md: "Converting a number from decimal to binary is almost as easy. Let's use 5 in\
    \ decimal as an example.\n\n+   1. You find the largest power of 2 that can be\
    \ divided into 5 with a quotient of 1. The answer is $2^2$, or 4.\n\n+   2. Remember\
    \ when converting from binary to decimal, the rightmost binary digit is multiplied\
    \ by $2^0$, or 1, the second binary digit from the right is multiplied by $2^1$,\
    \ the third binary digit from the right is multiplied by $2^2$, and so on. Since\
    \ the exponent is 2, a binary 1 goes into the third binary digit from the right,\
    \ so the binary number now is 11?, ? representing each binary digit we still need\
    \ to calculate.\n\n+   3. When you divide 5 by 4, the remainder is 1. You next\
    \ try to divide 1 by the next lowest power of 2, $2^0$, or 1. The quotient is\
    \ 0, so a binary 0 goes into the second binary digit from the right. The binary\
    \ number now is 10.\n\n+   4. When you divide 1 by 2, the remainder is still 1.\
    \ You next try to divide 1 by the next lowest power of 2, $2^0$, or 1. The quotient\
    \ is 1, so a binary 1 goes into the rightmost binary digit. The binary number\
    \ now is 101, and we're done.\n\nYou can also use the same techniques for converting\
    \ hexadecimal to decimal. When converting from hexadecimal to decimal, multiply\
    \ each hexadecimal digit (converting a to 10, b to 11, and so on) by the appropriate\
    \ power of 16. For example, 5c in hexadecimal is $(12 \times 16^0) + (5 \times\
    \ 16^1)$, which is $12 + 80$ or 92.\n\nConversely, when converting from decimal\
    \ to hexadecimal, the highest power of 16 that can be divided into 92 is $16^1$,\
    \ or 16. The quotient is 5, which goes into the second digit to the right. The\
    \ remainder is 12, which is c in hexadecimal. This goes into the rightmost digit,\
    \ resulting in the hexadecimal number 5c.\n\n![](img/02e7eccb2cb7476802f735732c9e08fc_38_0.png)"
