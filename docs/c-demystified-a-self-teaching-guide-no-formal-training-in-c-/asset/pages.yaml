    # Storage of Strings


    The amount of memory required for a string depends on the number of characters
    in the string. each memory address set aside for the string would store one character
    of the string.


    # The bool Data Type


    There is one more data type, bool. This data type has only two possible values,
    true and false. The term "bool" is a shortening of Boolean, which is usually used
    in connection with Boolean Algebra, named after the British mathematician, George
    Boole.


    The bool data type is mentioned separately since it does not necessarily fit into
    the number or text categories. It could be regarded as a numeric type in that
    zero is seen as false, and one (or any other non-zero number) as true. While it
    may not seem intuitive why zero would be false and one be true, remember that
    computers essentially store information in switches, where 1 is on, and 0 is off.


