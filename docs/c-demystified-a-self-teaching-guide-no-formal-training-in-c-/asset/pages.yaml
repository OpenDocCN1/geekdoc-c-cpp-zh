  md: "# The if Statement\n\nThe if statement is to execute code only when the value\
    \ of a relational expression is true.\nThe syntax of an if statement is\n\n```\n\
    if (Boolean value)\n    statement;\n```\n\nBoth lines together are called an if\
    \ statement. The first line consists of the if keyword followed by an expression,\
    \ as such a relational expression, that evaluates to a Boolean value, true or\
    \ false. The relational (or other Boolean) expression must be in parentheses,\
    \ and should not be terminated with a semicolon.\n\nThe next line is a conditional\
    \ statement. As you may recall from Chapter 1, a statement is an instruction to\
    \ the computer, directing it to perform a specific action. The statement is conditional\
    \ because it executes only if the value of the relational expression is true.\
    \ If the value of the relational expression is false, the conditional statement\
    \ is not executed—meaning, it essentially skipped.\n\nThe following program, which\
    \ tests if a number entered by the user is even, illustrates the use of an if\
    \ statement.\n\n```\n#include <iostream>\nusing namespace std;\nint main(void)\n\
    {\n    int num;\n    cout << \"Enter a whole number: \";\n    cin >> num;\n  \
    \  if (num % 2 == 0)\n        cout << \"The number is even\" << endl;\n    return\
    \ 0;\n}\n```\n\nIf the user enters an even number, the program outputs that the\
    \ number is even.\nThe number is even\n\nHowever, if the user enters an odd number,\
    \ then there is no output that the number is even.\n\nEnter a whole number: 16\n\
    \nFigure 5-3 is a flowchart of this program. This flowchart has one new symbol:\
    \ a diamond. It's used to represent the true/false statement being tested."
