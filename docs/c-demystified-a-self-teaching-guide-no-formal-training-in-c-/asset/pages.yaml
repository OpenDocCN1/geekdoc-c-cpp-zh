  md: "Enter a whole number: 17\nAnd the number is not odd\n\nIf you want more than\
    \ one statement to be part of the overall if statement, you must encase these\
    \ statements in curly braces:\n\n```\nif ( num % 2 == 0 ) {\n  cout << \"The number\
    \ is even\" << endl;\n  cout << \"And the number is not odd\" << endl;\n}\n```\n\
    \nThe second curly statement will execute only if the if expression is true.\n\
    \nForgetting these curly braces when you want multiple statements to be conditional\
    \ is another common syntax error.\n\n# Don't Mistakenly Use the Assignment Operator!\n\
    \nThe third most common syntax error is to use the assignment operator instead\
    \ of the relational equality operator because the assignment operator looks like\
    \ an equal sign:\n\n```\nif ( num % 2 = 0 ) // wrong operator!\n  cout << \"The\
    \ number is even\" << endl;\n```\n\nThe result is that if expression will evaluate\
    \ as the result of a comparison. Instead, it will evaluate the expression within\
    \ the parentheses as the end result of assignment, with a non-zero value being\
    \ regarded as true, a zero value being regarded as false.\n\nNote Some compilers\
    \ will treat this mistake as a compiler error.\n\n![](img/02e7eccb2cb7476802f735732c9e08fc_95_0.png)"
