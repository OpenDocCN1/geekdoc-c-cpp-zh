    Size of long is 4

    Size of float is 4

    Size of double is 8

    Size of long double is 8

    Size of char is 1

    Size of bool is 1


    Note The numbers displayed on your computer may be different, because the size
    of a data type depends on the particular computer and operating system you are
    using, and may not be the same as mine.


    # # Expressions


    The line of code


    ```

    cout << "Size of int is " << sizeof(int) << "\n";

    ```


    displays the following output:


    Size of int is 4


    In essence, the code sizeof(int) is replaced by 4 in the output.


    The code sizeof(int) is called an *expression*. An expression is a code statement
    that has a value, usually has to be evaluated when the program runs. An example
    of an expression is 4 + 4, which has a value, 8, that would be evaluated when
    the program runs.


    When the code runs, the expression sizeof(int) is evaluated as having the value
    4, which is then outputted.


    By contrast, the position of the statement within double quotes, "Size of int
    is" is outputted literally as "Size of int is 4." There is no need for an evaluation.
    Instead, this is considered a *literal string*. The term refers to the data type,
    a series of characters, and the term literal refers to the fact that the string
    is outputted literally, without evaluation. The string "Hello World!" in the code
    statement Chapter 1 was also a literal string.


    # # Outputting an Expression


    The expression "sizeof(int) is separated by the stream insertion operator (<<)
    from the literal string "Size of int is" If the code statement instead were


    ```

    cout << "Size of int is sizeof(int)

    n";

    ```


    then the output would be quite different:


    Size of int is sizeof(int)


    The reason for sizeof(int), being encased inside the double quotes, would be treated
    as a literal string, not an expression, and therefore not be evaluated, but displayed
    as is.


    Since "Size of int is" is a literal string and sizeof(int) is an expression, they
    need to be differentiated by being inserted into the output stream. This differentiation
    is done by placing a stream insertion operator between the literal string and
    the expression.'
