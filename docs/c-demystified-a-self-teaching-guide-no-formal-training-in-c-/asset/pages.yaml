  md: "![](img/02e7eccb2cb7476802f735732c9e08fc_93_0.png)\n\n# Figure 5-3: Flowchart\
    \ of a program that determines whether a number is even\n\nLet's now analyze how\
    \ the program works. You may find the flowchart a helpful visual aid in following\
    \ this textual explanation.\n\nThe program prompts the user to enter a number.\
    \ It then stores that input in the integer variable *num*.\n\nThe program next\
    \ evaluates the relational expression num % 2 == 0, which is enclosed in parentheses\
    \ the if keyword. This expression involves two operators, the arithmetic modulus\
    \ operator (%) and the relational equality operator (==). Since arithmetic operators\
    \ have precedence over relational operators, the expression num % 2 will be evaluated,\
    \ with the result compared to zero.\n\nA number is even if, divided by two, the\
    \ remainder equals zero. You learned in Chapter 4 that the modulus operator will\
    \ return the remainder from integer division. Accordingly, the expression num\
    \ % 2 will divide the number entered by the user by two, and return the remainder.\
    \ That remainder will be compared to zero using the relational equality operator.\n\
    \nIf the relational expression is true, it would be if the number inputted by\
    \ the user is even, then the conditional statement executes, outputting “The number\
    \ is even.” If the relational expression is false, which would be if the number\
    \ inputted by the user is odd, then the conditional statement is skipped, and\
