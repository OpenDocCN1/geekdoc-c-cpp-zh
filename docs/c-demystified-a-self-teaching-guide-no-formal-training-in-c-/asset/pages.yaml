    Figure 9-3 shows the order of execution graphically.


    ![](img/02e7eccb2cb7476802f735732c9e08fc_177_0.png)


    **Figure 9-3:** The order of execution of the return value of a function


    It is common that a returning value is called on the right side of an assignment
    operator with the left side of the assignment operator to capture the return value.
    It is not required. In the program, the variable sum was not necessary. Instead
    of the lines


    ```

    sum = addNumbers(firstNum, secondNum);

    cout << firstNumber << " " + " " << secondNum << " = " << sum;

    ```


    the return value could have been displayed as:


    ```

    cout << firstNumber << " " + " " << secondNum << " = = "

    << addNumbers(firstNum, secondNum);

    ```


    The only difference is that once this statement completes, the return value of
    the function is not used in later statements since it was not stored in a variable.
    In this program, it is not a problem because the return value is not used again.
    However, if you are going to use a return value more than once, it''s generally
    a good idea to store that value in a variable. This is typically done by calling
    the function on the right side of an assignment operator with a variable on the
    left side of the assignment operator to capture the return value.


    While multiple values can be passed to a function as arguments, multiple values
    cannot be returned from functions using the data types we have covered so far.
    This will change when we cover arrays in the next chapter, and structures and
    classes in later layers.


