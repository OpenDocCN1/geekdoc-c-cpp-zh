  md: 'object. You may create more than one constructor, such as one with no arguments
    and one with several arguments.


    In OOP, one principle is to separate what a function does from how it does it.
    In this spirit, programmers often separate a constructor''s prototype from its
    implementation, implementing the constructor outside of the body of the structure.
    If you do this, then in the function header of the constructor''s implementation,
    you will need to precede the constructor name with the scope resolution operator
    (::) to tell the compiler that the implementation is of a structure member.


    A structure may be passed as a function argument. Unlike an array name, a structure''s
    value is not an address. So, to change the values of its member variables, a structure
    needs to be passed by reference or address. However, a structure often passed
    by reference if the function will not change the value of its member variables
    because less memory is required to pass the address of the object itself, which
    may take up a lot of bytes. You precede the structure instance in the function
    argument list with the const keyword to prevent the function from inadvertently
    changing the values inside the structure.


    You may nest a structure inside another. Using the Person structure example, every
    person has a birthday. A birthday is a date, and date, in turn, may be defined
    by a Date structure that contains three member variables represent the month,
    day, and year of the particular date. You could then add to the Person structure
    declaration a member variable of the Structure Date to represent the person''s
    birthday. This is an example of the OOP concept of containment in that a person
    "has a" birthday.


    Classes are quite similar to structures. You declare a class similarly to how
    you declare a structure, just substituting the class keyword for the struct keyword.


    An important difference between a structure and a class is that member variables
    are, by default, public in a structure but private in a class. A public member
    variable may be accessed anywhere in the program. By contrast, a private member
    variable may be accessed only by a member function of the same class.


    In classes, typically member functions are used to read from and write to, the
    member variables. These member functions are public so they can be accessed outside
    the class. One benefit of keeping the member variables private and using public
    member functions for read and write access is input validation. Keeping the member
    variables private is an example of the OOP concepts of encapsulation and information-hiding.


    I hope you enjoyed this book as much as I enjoyed writing it, and I wish you the
    best of luck in your future programming endeavors.


