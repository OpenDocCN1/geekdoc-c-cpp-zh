  md: 'A common programming mistake in a while condition using a logical operator
    is to use && when you should use || or vice versa. While the logical && operator
    may seem the obvious choice in this example, the correct choice in other situations
    may be less intuitive. If you want to loop a number not between 1 and 10, would
    the loop be while (num < 1 && num > 10)? The latter; the condition would be false
    using the && operator since a number cannot be less than 1 and greater than 10.
    If you wanted to use a number the condition instead would be (num >= 1 && num
    <= 10).


    # Note


    The first condition is if num <= 0. If this expression is false, the data is valid,
    so the issue of whether the user wants to quit does not arise. Accordingly, the
    second condition, quit is true, is not evaluated. As discussed in Chapter 7, with
    a logical && operator, the right expression is evaluated only if the left expression
    is true. Therefore, the loop ends with quit being true, its initialized value,
    and code execution continues with the if / else statement following the while.


    However, if num < 0 is true, then the data is invalid, and the second condition,
    quit is true, is evaluated.


    The value of quit may be true after the user''s first attempt to enter data and
    the data was invalid. In this case, the user has not yet asked whether they want
    to quit. It is assumed that, so they have the opportunity to answer when they
    want to retry. Therefore, the quit variable is initialized to the value of false
    when it is declared.


    The second possibility is that this is the user''s second or later attempt to
    enter data and the data was invalid. In this case, the user has already asked
    whether they want to quit, so the value of quit is based on the user''s answer.


    If the value of quit is false, the loop continues. If the user wants to quit,
    then the expression quit == false will be false because the value of quit is true.
    Therefore, the loop ends with the value of quit being true, and code execution
    continues with the if / else statement following the while.


    At some point (hopefully) the loop will end, either because the user has entered
    a valid number or has not decided to quit today. Code execution continues with
    the if / else statement following the loop.


    The value of quit being false indicates that the user entered valid data, because
    they were still trying to do so, the loop would not have ended. Conversely, the
    value of quit being true indicates that the user entered valid data.


    Accordingly, we use the value of quit in the if / else statement after the loop
    whether the user entered valid data or decided to quit entering valid data.


    Thus, inside the loop, quit is a flag whose value indicates whether the user wants
    to try again, and after the loop ends, quit is a flag whose value indicates whether
    the user entered valid data.


