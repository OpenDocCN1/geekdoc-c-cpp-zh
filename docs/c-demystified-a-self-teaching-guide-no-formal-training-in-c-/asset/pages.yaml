  md: '# Summary


    Object-Oriented Programming (often known by its acronym, OOP) concerns, as its
    name indicates. A common purpose of a program is to provide a solution to real-world
    tasks, which involves people, places, things, or concepts. Programs use objects
    to represent real-world people, places, things, or concepts.


    Real-world objects also have relationships with other real-world objects. These
    relationships are either an "is a" relationship or a "has a" relationship.


    An example of an "is a" relationship is that a teacher is a person. This type
    of relationship is referred to as inheritance. Inheritance enables you to reuse
    existing code, such as the person class, when creating classes that represent
    more specialized objects, like teachers.


    An example of a "has a" relationship is that a car has an engine. This type of
    relationship is also referred to as containment. In addition, containment enables
    you to reuse existing code, such as when creating classes that represent the containing
    object, like cars.


    Code reuse makes application development faster since you don''t have to "reinvent
    the wheel.\ Additionally, the applications you develop are less buggy since the
    code you are reusing has been tested. OOP enables programs to model objects after
    complex real-world objects, and reuse existing, tested code.


    Objects generally too complex to be described by a single variable. Additionally,
    the variables necessary to describe an object may have different data types, so
    an array is not an option.


    A solution is to use a structure to describe complex objects. A structure is a
    programmer-defined type that enables you to package related variables together,
    even if the variables are of different data types. The variables that belong to
    a structure are called member variables.


    This chapter showed how to declare a structure. The declaration commences with
    `struct`, which is a keyword indicating that a structure is being declared. The
    `struct` keyword is followed by a name that indicates what the structure represents.


    Structures, like functions, have a body, enclosed in open and close curly braces.
    However, unlike functions, the curly brace must be followed by a semicolon. The
    body of the structure contains the member variables of the structure.


    The effect of declaring a structure is similar to declaring your data type. Accordingly,
    you need to declare a structure variable to create an instance of the structure.
    If you have many structure instances, you may declare a separate variable for
    each instance, or instead declare an array of structure instances.


    You use the dot operator (.) with the structure instance name to access the member
    variables, whether the access is to obtain the value of the variable or to assign
    a value to it.


    There are two ways to initialize a structure. The first way is to use an initialization
    list. The second way is to use a constructor. A constructor is a function that
    is automatically called when you attempt to create an instance of'
