  md: "# The While Loop\n\nThe while loop is similar to a for loop in that both have\
    \ the typical characteristics of a loop: the code inside continues to iterate\
    \ until a condition becomes false. The difference between them is in the parentheses\
    \ following the for and while keywords.\n\nThe parentheses following the for keyword\
    \ consists of three expressions, initialization, condition, and update. By contrast,\
    \ the parentheses following the while keyword consists only of the condition;\
    \ you have to take care of any initialization and update elsewhere in the code.\n\
    \nThis difference is illustrated by the program that outputs the numbers between\
    \ 1 and 10. Chapter 7 included the program that outputs the numbers between 1\
    \ and 10 using the for loop.\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main(void)\n{\n    for (int num = 1; num <= 10; num++)\n    {\n        cout\
    \ << num << \" \";\n    }\n    return 0;\n}\n```\n\nThe same program using the\
    \ while loop could be\n\n```\n#include <iostream>\nusing namespace std;\nint main(void)\n\
    {\n    int num = 1;\n    while (num <= 10)\n    {\n        cout << num << \" \"\
    ;\n        num++;\n    }\n    return 0;\n}\n```\n\n> Note The two statements in\
    \ the body of the while loop could be combined into one statement, cout << num++.\
    \ Two statements are used instead to make this example easier by eliminating the\
    \ precedence issue in the statement between the insertion insert and increment\
    \ operators.\n\nWith the while loop, the integer variable num had to be declared\
    \ and initialized before the loop since it cannot be inside the parentheses following\
    \ the while keyword. Further, num was updated inside the code of the loop using\
    \ the increment operator. This update can also be done inside the parentheses\
    \ following the keyword as shown by an example in this section.\n\nThe update\
    \ of the variable is particularly important with the while loop. Without that\
    \ update, the loop would be infinite. For example, in the excerpt from this program,\
    \ if num is not incremented, the loop would be infinite. The value of num would\
    \ not change from 1, so the condition num <= 10 would always remain true.\n\n\
    ```\nint num = 1;\n```"
