  md: 'precedence. Thus, the multiplication operator and the two division operators
    have equal precedence. Similarly, the addition and subtraction operators have
    equal precedence.


    Table 4-4 shows the results of applying precedence to several arithmetic expressions.
    We have not reviewed the division operators yet, but in the examples in Table
    4-4 the / operator works as it does in arithmetic.


    # Table 4-4: Precedence in Action


    | Expression | Result |

    | --- | --- |

    | 2 + 3 * 4 | 14, not 20 |

    | 8 / 2 - 1 | 3, not 8 |


    C++ also has rules associativity for determining which operation is performed
    first when two operators have equal precedence. Table 4-5 describes these rules.


    # Table 4-5: Associativity of Arithmetic Operators


    | Operator | Associativity |

    | --- | --- |

    | (unary negation) | Left to right |

    | * / % | Left to right |

    | - | Left to right |


    Therefore, the result of the expression 8 / 2 * 4 is 16, not 1, because division
    being the leftmost operator, is performed first.


    However, there are times when you need to override the default precedence. For
    example, in our program, calculating tuition, the default precedence would be
    multiply dropped by 72, after which the product would be added to total. However
    we want to change the order of operations so that dropped is first to total, and
    the sum multiplied by 72.


    You can override the default precedence. This is done in the statement:


    ```

    cout << "Total tuition owed: $\" << (total + dropped) * 72 << endl;"

    ```


    Expressions in parentheses are first. As a result of the parentheses, the expression
    (total + dropped) is evaluated so that dropped is first added to total, and the
    sum is multiplied by 72.


    # Division Operators


    Addition, subtraction, and multiplication each have one operator. division has
    two. / operator gives you the quotient, the % (or modulus) gives you the remainder.


    Quotient and remainder, along dividend and divisor, are terms that I learned in
    elementary school and did not use much until many years later. If you are rusty
    on arithmetic terminology I was, this example may help. In the problem 7 divided
    by 2, the dividend is 7 and the divisor is 2. The result of this division is 3
    and is the quotient and 1 is the remainder.'
