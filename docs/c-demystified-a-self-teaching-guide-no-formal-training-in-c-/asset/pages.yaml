  md: "# The Division Operator\n\nThe division operator returns the quotient. However,\
    \ the value of the quotient depends on whether at least one of the operands is\
    \ a floating point data type.\n\nFor example, the value of 10 / 4 is 2.5. However,\
    \ in C++, the value is 2 because, when both operands are an integer or whole number\
    \ data type, the result is an integer as well, and the remainder is not part of\
    \ the quotient. This is true even if the result is assigned to a floating point\
    \ variable. The output of the following program is 10 / 4 = 2.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main(void)\n{\n    int firstOp = 10, secondOp\
    \ = 4;\n    float result = firstOp / secondOp;\n    cout << firstOp << \" / \"\
    \ << secondOp << \" = \" << result;\n    return 0;\n}\n```\n\nHowever, the value\
    \ of 10.0/4 is 2.5 in C++. When at least one of the operands is a floating point\
    \ data type, and 10.0 would be interpreted as floating point, then the result\
    \ is a floating point as well. The output of the following program is 10 / 4 =\
    \ 2.5 because we changed the data type of firstOp from int to float:\n\n```\n\
    #include <iostream>\nusing namespace std;\nint main(void)\n{\n    float firstOp\
    \ = 10, result;\n    int secondOp = 4;\n    result = firstOp / secondOp;\n   \
    \ cout << firstOp << \" / \" << secondOp << \" = \" << result;\n    return 0;\n\
    }\n```\n\nGoing back to the first example, if you want the division of two integer\
    \ variables to be a float, then you have to cast one of the variables to the float.\
    \ A cast does not change the data type of the operation. You can cast the variable\
    \ by putting the desired data type in front of it in an expression, and placing\
    \ it in parentheses. This is how the first example could be changed to make the\
    \ result of integer division:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main(void)\n{\n    int firstOp = 10, secondOp = 4;\n    float result = (float)firstOp\
    \ / secondOp;\n    cout << firstOp << \" / \" << secondOp << \" = \" << result;\n\
    \    return 0;\n}\n```\n\nAll of the following expressions would work\n\n```\n\
    float result = (float)firstOp / secondOp;\nfloat result = firstOp / (float)secondOp;\n\
    ```"
