  md: '# Reading a Character


    ![](img/02e7eccb2cb7476802f735732c9e08fc_233_0.png)


    **Figure 12-2:** The input buffer after typing the letter x and pressing the enter
    key


    The get member function of the cin object removes the first character, x, from
    the input buffer and assigns value to the variable ch. As shown in Figure 12-2,
    the newline still remains in the input buffer.


    Since the newline remains in the input buffer, the next iteration of the loop,
    you do not have the opportunity to enter input. The get member function, which
    reads whitespace as printable characters, removes the newline character from the
    input buffer and assigns newline to the variable ch. Now the input buffer is empty,
    at the next loop iteration you will have the opportunity to enter input.


    # The cin.ignore Function


    The solution is to clear the newline character out of the input buffer before
    calling the getline function. You can do this by using the ignore member function
    of cin object.


    The ignore member function, like the get and getline member functions, is also
    overloaded. It can called with no arguments, one argument, or two arguments.


    Calling the ignore function with no arguments will cause the next character in
    the input buffer to be read, and discarded—that is, it won''t be assigned to anything.
    This is exactly what we want. We don''t need to assign the newline character left
    over in the input buffer into some variable. Rather, we just need to get rid of
    it.'
