  md: '# Flowcharting


    A program, like a river, flows from beginning to end. Programmers may find it
    helpful, in writing code and in atstanding someone else''s code, to visually depict
    the flow of the program. After all, in the adage a picture is worth a thousand
    words. The ability to visualize the flow of a program becomes even more helpful
    as we transition from relatively simple programs that flow in a straight line
    to more complex varieties that branch in different directions based on the value
    of a relational expression.


    Programmers use a flowchart to visually depict the flow of a program. Flowcharts
    use standardized symbols prescribed by the American National Standard Institute
    (ANSI), which prescribes other standards which we will be using in this book.
    Flowchart symbols represent different aspects of program, such as the start or
    end of a program, user input, how it displays on a monitor, and so on. These symbols
    are joined by arrows and other connectors which show the connections between different
    parts of the program and the direction of the program flow. Figure 5-1 shows several
    commonly used flowchart symbols. Others will be introduced later in this book
