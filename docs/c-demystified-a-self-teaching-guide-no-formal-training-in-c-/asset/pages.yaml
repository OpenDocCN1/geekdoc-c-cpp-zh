  md: "# Using the switch Statement with Logical Operators\n\nThe switch statement\
    \ was discussed at some length in Chapter 5. However, so far in this chapter it\
    \ has been conspicuous by its absence.\n\nIn Chapter 5, we discussed how the switch\
    \ statement was cumbersome when dealing with a number of ranges. The reason was\
    \ that the case could not be followed by a range of numbers because it must be\
    \ followed by a single integer constant.\n\nHowever, the switch statement may\
    \ be used with expressions that use the Logical And or Or operator. The reason\
    \ is that these expressions have only one of two values, true or false. True and\
    \ false are both constants; the value of true is always true and the value of\
    \ false is always false. While true and false are Boolean values, each has a corresponding\
    \ value: 1 and 0. Therefore, the case may be followed by true or false, just as\
    \ in Chapter 5 where the case could be followed by a character since each has\
    \ a corresponding integer ANSI or ASCII value.\n\nFor example, earlier in this\
    \ chapter the Logical And operator used in the following if/else structure in\
    \ determining whether the user is eligible to vote, the criteria that the user\
    \ must be at least 18 years old and\n\n```\nif (age >= 18 && citizen == true)\n\
    \    cout << \"You are eligible to vote\";\nelse\n    cout << \"You are not eligible\
    \ to vote\";\n```\n\nThe corresponding switch statement is\n\n```\nswitch (age\
    \ >= 18 && citizen == true)\n{\n    case true:\n        cout << \"You are eligible\
    \ to vote\";\n        break;\n    case false:\n        cout << \"You are not eligible\
    \ to vote\";\n}\n```\n\nAlso in this chapter, the Logical Or operator was used\
    \ in the if/else structure in determining whether the user gets into a movie free,\
    \ the criteria that the user must be either over 18 or at 65 years old.\n\n```\n\
    if (age <= 12 || age >= 65)\n    cout << \"Admission is free\";\nelse\n    cout\
    \ << \"You have to pay\";\n```\n\nThe corresponding switch statement is\n\n```\n\
    switch (age <= 12 || age >= 65)\n{\n    case true:\n        cout << \"Admission\
    \ is free\";\n        break;\n    case false:\n        cout << \"You have to pay\"\
    ;\n}\n```"
