  md: "# Pointers as Function Arguments\n\nPassing an array name by address is relatively\
    \ simple because the value of the array name is an address. However, you may often\
    \ want to pass a single variable by address. By single variable I don't mean a\
    \ variable that is unmarried, but instead, for example, int as opposed to an int\
    \ array.\n\nWith a single variable, subscript notation is not an option. Subscripts\
    \ make sense only with an array. Rather, you need to use pointer notation to pass\
    \ a single variable by address.\n\nPassing an argument by reference or by address\
    \ both enable the passed argument to be changed in the calling function—the called\
    \ function—only the syntax is different. In comparison, let's test with the following\
    \ program Chapter 9 that passes the variable to be by reference:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nvoid doubleIt(int&);\n\nint main ()\n{\nint\
    \ num;\n\tcout << \"Enter number: \";\n\tcin >> num;\n\tdoubleIt(num);\n\tcout\
    \ << \"The number doubled in main is \" << num << endl;\n\treturn 0;\n}\n\nvoid\
    \ doubleIt(int& x)\n{\n\tcout << \"The number to be doubled is \" << x << endl;\n\
    \tx *= 2;\n\tcout << \"The number doubled in doubleIt is \" << x << endl;\n}\n\
    ```\n\nHere is some sample input and output:\n\nEnter number: 3\nThe number to\
    \ be doubled is 3\nThe number doubled in doubleIt is 6\nThe number doubled in\
    \ main is 6\n\nLet's now modify this program so it passes the variable to be doubled\
    \ by address instead of by reference:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nvoid doubleIt(int*);\n\nint main ()\n{\nint num;\n\tcout << \"Enter number:\
    \ \";\n\tcin >> num;\n\tdoubleIt(&num);\n\tcout << \"The number doubled in main\
    \ is \" << num << endl;\n\treturn 0;\n}\n\nvoid doubleIt(int* x)\n```"
