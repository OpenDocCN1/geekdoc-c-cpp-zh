  md: '# Chapter 13: Persistent Data: File Input and Output


    # Overview


    As a kid, I had to listen, or not so politely, to endless (so endless it seemed
    at the time) lectures from my parents on how I could be better, or do better.
    After I became an adult, I realized to my amazement that my parents more often
    than not right. After I became a parent, I realized to my horror that I was repeating
    their lectures to my own children, who, of course, enjoy these "talks" about as
    much as I used to.


    One of my parents'' favorite lectures was how important it is to be persistent.
    Again, mom and dad showed true insight, because, though persistence is a very
    valuable trait in any person, as programmers, she should be persistent. By persistent,
    I mean the data should survive when the program is finished. Can you imagine if,
    after typing this chapter, when I exited Microsoft Word, everything I typed was
    lost?


    With the programs we have written so far, this is exactly what would happen. Whatever
    values we have stored in variables do not persist, or survive, when the program
    is finished. Instead, the data is lost because the data is stored in RAM (random
    access memory), which is cleared when the program (or the computer) stops running.


    Fortunately, Microsoft Word (and most programs for matter) has the capability
    to save data to a file on the computer''s hard drive or other storage medium so
    that later data can be retrieved when needed. That data persists after the termination
    of the program or even after the computer is turned off.


    This chapter will show you how to make your data persistent by saving to a file.
    Of course, saving the data accomplishes little unless you can later retrieve it,
    so this chapter will also show you how to retrieve data from a file.'
