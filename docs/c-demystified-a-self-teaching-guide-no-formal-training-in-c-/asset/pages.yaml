    - I am reading this book to help upgrade my skills for my current job or retrain
    for a new job.

    - I am reading this book because programming is my hobby.

    - I am reading this book because I have nothing to do to.


    If you chose the last statement, then you may need to get out more often. Otherwise,
    whether your primary reason for reading this book is education, or a hobby will,
    of course, influence your next steps in programming. For example, if you are retraining
    for a particular programming position, your focus will be much more specific than
    a student who is planning to obtain a higher degree in computer science.


    Nevertheless, regardless of whether your focus is specific or general, the major
    area that follows the subjects covered in this book is Object-Oriented Programming,
    often known by its acronym OOP. OOP (described in the following section) heavily
