  md: "You should give careful consideration to the number of elements in an array\
    \ before you declare the array since you can't resize an array in the middle of\
    \ a program in the event the array is too small or unnecessarily large. Sometimes,\
    \ the number of elements is obvious: an array of days in a week will have seven\
    \ elements. However, other times the number of elements is not intuitive. In some\
    \ circumstances, you should err on the side of declaring too many rather than\
    \ few elements. The reason is that the consequence of declaring too many elements,\
    \ wasted memory, is less severe than the consequence of declaring too few elements,\
    \ the inability to store values in the array.\n\n# Tip\n\n# Constants\n\nEach\
    \ of the size declarators used in the previous section was a literal. A literal\
    \ is a value written exactly as it is meant to be interpreted. For example, the\
    \ number 3 is a literal. Its value cannot be anything other than 3. You cannot\
    \ change the number 3 to have a different value. Likewise, the number 3 may be\
    \ used in the following program as the size declarator:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main () {\n    int testScore[3];\n    return 0;\n}\n\
    ```\n\nThe size declarator cannot be a variable. The following program attempts\
    \ unsuccessfully, to use a variable numTests in declaring the size of an array:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main () {\n    int numTests;\n\
    \    cout << \"Enter the number of test scores:\";\n    cin >> numTests;\n   \
    \ int testScore[numTests];\n    return 0;\n}\n```\n\nThe result is a compiler\
    \ error. The compiler will flag the declaration of the array (int testScore[numTests])\
    \ and complain that a constant expression was expected.\n\nIt is possible to declare\
    \ the size of an array if you use a different array declaration technique, dynamic\
    \ memory allocation, which is covered in Chapter 11.\n\n# Note\n\nThe term constant\
    \ is a new. A constant is a name that represents the same value throughout a program.\
    \ That value may be any one you specify. This is different from mathematical constants\
    \ such as PI, which correspond to a given value.\n\nA constant is the converse\
    \ of a variable, while a variable is a name that may represent different values\
    \ during the execution of a program. However, the value of a constant cannot change\
    \ during the execution of a program."
