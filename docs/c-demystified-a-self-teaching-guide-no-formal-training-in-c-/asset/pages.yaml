  md: 'The int data type requires 4 bytes of storage. Figure 2-4 shows how 65365 in
    decimal would be stored as an unsigned int data type.


    ![](img/02e7eccb2cb7476802f735732c9e08fc_42_0.png)


    **Figure 2-4:** Storage in memory of 65365 in decimal as an unsigned int data
    type


    You may legitimately say why 65365 in decimal as an unsigned int data type requires
    only four bytes of storage when 65365 in decimal as an unsigned short data type
    requires only two bytes of storage. Or if you specify instead of short the data
    type, four bytes of storage will be reserved, even if you could store the number
    in fewer bytes. The reason is that it is not known, when memory is reserved, what
    value will be stored. Additionally, the value could change. Accordingly, enough
    bytes of storage are reserved for the maximum possible value of that data type.


    # Why Use a Smaller Size Type?


    Given that an int can store a wider range of numbers than a short, you may also
    be wondering why you would use a short rather than an int. The answer is that
    the wider range of int comes at a price; it requires twice as much RAM as four
    instead of two bytes.


    However, computers these days come with megabytes of RAM, megabyte 1,048,576 bytes;
    you still may wonder why you should care about nearly extra bytes. If it was just
    2 extra bytes, you wouldn''t care. However, if you are writing a program for an
    insurance company that has one million customers, you won''t be talking about
    2 extra bytes, but 2 million extra bytes. You should not just reflexively choose
    the largest data type.


    All this said, as a general rule, of the six number data types, you most often
    will use int. However, it is good to know the other choices.


    # Floating-Point Data Types


    I was nearsighted every adult life until I had laser surgery on my eyes. In this
    surgery, the eye surgeon programs that the laser used to remove my eyeball by
    shaving off thin slices of cornea, meaning only thousands of an inch, in certain
    areas of my eyeball, leaving untouched areas, again only thousands of an inch
    way.


    Can you imagine my reaction if the eye surgeon had told me his philosophy was
    "close enough for work," he was using only whole numbers, ignoring any values
    to the right of the decimal point? You would have seen my silhouette through the
    wall after I ran to escape. (Since I still go to eye surgeon, who by the way,
    earned his way through college as a computer programmer, and it is not in my best
    interest to get on his bad side, let me add that he was precise and the surgery
    was successful.)


    Whole numbers fine for certain information where fractions don''t apply. For example,
    who would say they have 2% children? Whole numbers also fine for certain information
    where fractions do not apply but are not important. For you'
