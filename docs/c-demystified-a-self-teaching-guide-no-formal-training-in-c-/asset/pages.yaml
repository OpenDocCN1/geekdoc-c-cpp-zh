    # Precedence


    Table 6-5 lists precedence, from highest to lowest, among logical operators and
    between them and the relational operators.


    Table 6-5: The Precedence of Logical and Relational Operators


    | Operator (from highest to lowest) |

    | --- |

    | ! |

    | Relational operators (>, >=, <, <=, !=) |

    | && |

    | || |


    # Precedence and the Logical Not Operator


    Since the logical Not has a higher precedence than the relational operators, the
    program used to illustrate the logical Not operator uses an extra set of parentheses.


    ```

    if (!age > 12 && age < 65)

    ```


    Had the set of parentheses been omitted as follows, the result would always be
    that the user has to pay. Thus, admission would never be free regardless of the
    age.


    ```

    if (age > 12 && age < 65)

    ```


    The reason why the always having to pay regardless of age is that the logical
    Not operator has a higher precedence than the relational operators, the logical
    Not operator operates on age, not the expression > 12 && age < 65. If age is non-zero,
    then lage is zero. Since 0 is not greater than 12, the left part of the logical
    expression is false, so the overall expression is false.


    The result of the always having to pay regardless of age is the same even if age
    is zero. If age is zero, then lage is true, the integer value of which is 1. Since
    1 is not greater than 12, once again the left part of the logical expression is
    false, false, the overall expression is false.


    # Precedence and the Logical And Or Operators


    In contrast to the logical Not, the logical And and Or operators rank lower in
    precedence than the relational operators. Therefore, parentheses are not necessary
    to separate the logical and Not operators from the relational operators. For example,
    the following two statements (the first taken from the program that illustrates
    the logical And operator) are equivalent.


    ```

    if (age >= 18 && citizen == true)

    if ( age >= 18) && (citizen == true )

    ```


    However, parentheses are necessary when logical And and Or operators are used
    in one statement and when the one before the And and Or operator has higher precedence
    than the Or operator. This issue often arises when'
