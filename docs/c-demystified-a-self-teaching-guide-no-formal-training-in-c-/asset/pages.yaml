  md: "During several years of teaching C++ in an introductory programming class,\
    \ I have noticed several common mistakes in the writing of statements. Some of\
    \ these mistakes may result in compiler errors and are easy to stop. However,\
    \ other mistakes are harder to pick out since they do not cause an error, either\
    \ at compile time or run-time, but instead give rise to illogical results.\n\n\
    # Don't Put a Semicolon after the Relational Expression!\n\nThe first mistake\
    \ is to place a semicolon after the relational expression:\n\n```\nif ( num %\
    \ 2 == 0 ); // don't put a semicolon here!\ncout << \"The number is even\" <<\
    \ endl;\n```\n\nSince the compiler generally ignores blank space, the following\
    \ if statement would be the same, and better illustrates visually:\n\n```\nif\
    \ ( num % 2 == 0 )\n    // don't put a semicolon here!\ncout << \"The number is\
    \ even\" << endl;\n```\n\nNo compiler error result. The compiler will assume from\
    \ the statement that it is an empty statement. An empty statement does nothing,\
    \ and it is perfectly legal in C+, and indeed has some purpose, here is not intended.\n\
    \nOne consequence will be that empty statement will execute if the relational\
    \ expression is true. If this comes, so far, nothing will happen. There is no\
    \ harm done.\n\nHowever, there is an additional consequence, an illogical result.\
    \ The code statement \"The number is even\" will execute whether or not the relational\
    \ expression is true. In other words, if an odd number is entered, the program\
    \ will output \"The number is even.\"\n\nEnter a whole number: 17\nThe number\
    \ is even\n\nThe reason the code statement will execute whether or not the relational\
    \ expression is true is that the code statement is no longer part of the if statement.\
    \ Unless you use braces as explained in the next section, only the first statement\
    \ following the keyword and relational expression is conditional. That first conditional\
    \ statement is the empty statement, by virtue of the semicolon following it if\
    \ expression.\n\n# Curly Braces Needed for Multiple Conditional Statements\n\n\
    As discussed, if you use braces (explained later in this section), only the first\
    \ statement following the keyword and relational expression is conditional. For,\
    \ in the example code, only the first code statement is conditional. The second\
    \ code statement is not, so it will execute\n\n```\nif ( num % 2 == 0 )\n    cout\
    \ << \"The number is even\" << endl;\ncout << \"And the number is not odd\" <<\
    \ endl;\n```\n\nNote The indentation tells the programmer which statement is conditional\
    \ and which is not. The compiler ignores indentation.\n\nThus, if the user enters\
    \ an odd number at 17, the statement \"The number is even\" will not display because\
    \ the relational expression is false. However, the following statement \"And the\
    \ number is not odd\" will display because statement does not belong to the if\
    \ statement."
  merge: -1
