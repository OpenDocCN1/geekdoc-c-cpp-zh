    \ in the direction that data is moving. For example in the expression >> var,\
    \ data is moving from standard input into the variable. By contrast, in the expression\
    \ << var, the << indicates that data is moving from the variable to standard output.\n\
    \nWhen your program reaches a c statement, its execution halts until the user\
    \ types something at the keyboard and presses the ENTER key. Try running the following\
    \ program. You will see a blinking cursor until you type a number. Once you type\
    \ a number and press ENTER, the program will output \"Your test score is\" followed\
    \ by the number you inputted. For example, if you input 100, the output will be\
    \ \"Your test score is 100.\"\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main(void) {\n    int testScore;\n    cin >> testScore;\n    cout << \"Your\
