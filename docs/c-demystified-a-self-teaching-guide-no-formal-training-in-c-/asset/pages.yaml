    \ iterations, such as the program we have been that outputs the numbers between\
    \ 1 and 10. Rather, a while loop is a superior choice to a for loop in program\
    \ where the number of iterations is unpredictable, depending on user input runtime.\n\
    \nFor example, in the following program, the program asks the user to enter a\
    \ positive number, and in a loop continues until the user does so. The number\
    \ of times this loop may execute is unpredictable. It may never execute if the\
