  md: "However, with a pointer, the data type in the declaration means something different,\
    \ namely the data type of another variable (or constant) whose memory address\
    \ is the value of the pointer. In other words, the value of an integer pointer\
    \ must be the address of an integer variable or constant, the value of a float\
    \ pointer must be the address of a float variable or constant, and so forth.\n\
    \nThe actual data type of the value of all pointers, whether integer, float, character,\
    \ or otherwise, is the same, a long hexadecimal number that represents a memory\
    \ address. The only difference between pointers of different data types is the\
    \ data type of the variable or constant that the pointer points to. This is demonstrated\
    \ by the following program, which uses the sizeof operator to show that the sizes\
    \ of pointers of different data types are the same (a long data type uses 4 bytes\
    \ on my operating system and compiler) even though the different data types (int,\
    \ float, char) are not all the same size:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    int* iPtr;\n    float* fPtr;\n    char* cPtr;\n  \
    \  cout << \"The size of iPtr is \" << sizeof(iPtr) << endl;\n    cout << \"The\
    \ size of fPtr is \" << sizeof(fPtr) << endl;\n    cout << \"The size of cPtr\
    \ is \" << sizeof(cPtr) << endl;\n    return 0;\n}\n```\n\nThe output is therefore:\n\
    \nThe size of iPtr is 4\nThe size of fPtr is 4\nThe size of cPtr is 4\n\nOtherwise,\
    \ a pointer is similar to the variables or constants we have studied previously.\
    \ A pointer itself may be a variable or a constant, and like other variables or\
    \ constants, it is also stored at a memory address. What distinguishes a pointer\
    \ is that its value is the memory address of another variable or constant.\n\n\
