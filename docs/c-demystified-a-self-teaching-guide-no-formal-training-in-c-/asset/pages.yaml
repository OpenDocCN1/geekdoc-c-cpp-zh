  md: '# Defining and Calling a Function


    Implementing any function in addition to main involves two steps:


    +   1. Defining the function

    2. Calling the function


    The explanation of these steps uses terminology we have not discussed before,
    so that terminology is reviewed first.


    # Terminology of a Function


    Let''s look at a simple program with one function, main:


    The first line, int main (), is the function header. Unlike a statement, the function
    header is not followed by a semicolon.


    The function header consists of a return type, a function name, and an argument
    list. The data type indent preceding main is the return type, main is the function
    name, and the parentheses in this example but without, contains the argument list.


    A function header always is followed by an open curly brace, which braces the
    function body. The function body ends with close curly brace. There may be other
    open and curly braces between the open curly that braces the function body and
    the close curly brace that ends it, such as enclose multiple statements that belong
    to an statement or a loop.


    The function body consists of one or more statements. In this example, the function
    body consists of two statements. The last statement, return 0, is a return statement.
    The function body must contain a return statement unless the return type is void,
    which case the return statement is optional.


    The header and body together are referred to as the function definition. A function
    cannot execute until it is first defined. Once defined, a function executes when
    it is called.


    Normally, a function is called through code. The main function is the exception.
    The main function is called automatically when your program begins to run.


    The next sections will explain how to define your own function and call it.


    # Defining a Function


    Let''s take our "Hello World" example and divide the code into two functions,
    main and a printMessage that outputs "Hello World!" The comments (beginning with
    //'
