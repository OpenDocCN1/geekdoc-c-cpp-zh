    \nThis \"undefined identifier\" error is similar to the one in the \"Hello World!\
    \ project in Chapter 1 (which we deliberately) misspelled as Cout. Since testScore\
    \ is not a name built into C++, like an int, the compiler does not recognize it.\
    \ When you declare a variable, the compiler recognizes further references to the\
    \ variable name as referring to the variable that you declare.\n\n# Declaring\
    \ Multiple Variables of the Same Data Type\n\nIf you have several variables of\
    \ the same data type, you could declare each variable in a separate statement.\n\
    \n```\nint testScore;\nint myWeight;\nint myHeight;\n```\n\nHowever, if the variables\
    \ are the same data type, you don't need to declare each variable in a separate\
    \ statement. Instead, you can declare them all in one statement, separated by\
