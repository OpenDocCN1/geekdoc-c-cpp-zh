    # Rules to Live By


    Here are three simple rules that will avoid the problem caused by a newline character
    left in the input buffer (assuming, of course, you do not have a programming reason
    to keep the newline character in the input buffer).


    Rule #1: Always follow cin and the stream extraction operator (>>) to the ignore
    member function.


    Explanation: The cin object with the stream extraction operator (>>) always leaves
    a newline character in the input buffer. Clear it out with the ignore member function.


    ```

    char ch;

    cin >> ch;

    cin.ignore();

    ```


    Rule #2: Don''t follow the getline function with the no-argument ignore member
    function.


    Explanation: The getline function removes the newline character that terminated
    input from the input buffer. Therefore, it should not be followed by the ignore
    member function.


    Rule #3: After using the get function with one argument, such as cin.get(ch),
    check to see if you have a newline character in the input buffer. If you do, clear
    it with the ignore member function.


    Explanation: The get function with one argument being a single character will
    leave a newline character in the input buffer if you type a character and press
    ENTER. Therefore, you need to check if you need to clear the buffer. For example:


    ```

    char ch;

    cin.get(ch);

    if (ch != ''\n'')

    cin.ignore();

    ```


