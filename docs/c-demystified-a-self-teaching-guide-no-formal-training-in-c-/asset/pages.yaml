  md: "# Defining and Calling Function\n\nTherefore, viewing the main function can\
    \ provide an excellent overview of the order of events. Burying the main function\
    \ beneath numerous other functions requires someone reviewing your code for main\
    \ to obtain that overview. Additionally, in complex programs in which one function\
    \ calls another function still calls another, the order in which to define these\
    \ functions to avoid a compiler error can be confusing.\n\nThe solution of preference\
    \ is to prototype each function, except main, which does not have to be prototyped\
    \ since it is required by every program. The following program shows how to prototype\
    \ the printMessage function in the Hello World program:\n\n```\n#include <iostream>\n\
    using namespace std;\nvoid printMessage(void); // this is the prototype!\n\nint\
    \ main() {\n    printMessage();\n    return 0;\n}\nvoid printMessage(void) {\n\
    \    cout << \"Hello world!\";\n}\n```\n\nThe prototype is above all function\
    \ definitions. This ensures that the compiler, compiling the code from top to\
    \ bottom, will encounter the prototype before any function.\n\nThe prototype is\
    \ similar to a function header. The primary difference is that it has a semicolon\
    \ at the end because it is a statement. By contrast, a function header must not\
    \ be followed by a semicolon.\n\n+   There are other differences between the prototype\
    \ and the function header, unlike here, the parentheses following the function\
    \ name includes one or more arguments. Those differences will be discussed in\
    \ the section \"Sending Information to a Function\" later in this chapter.\n\n\
    Note\n\nTeam LiB\n\nPREVIOUS\n\nNEXT"
