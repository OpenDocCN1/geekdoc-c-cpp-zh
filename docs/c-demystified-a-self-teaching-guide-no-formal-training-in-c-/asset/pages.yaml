    \ rapid succession in your console window, with the application never ending.\n\
    \nYou might not intend an infinite loop in your code, but mistakes do happen;\
    \ I have made this mistake a lot once. If it happens to you, don't panic. You\
    \ can use the CTRL-BREAK combination to end the program. Knowing you have encountered\
    \ an infinite loop, you can correct the code error that caused it.\n\n# A Factorial\
    \ Example\n\nSo far, use of the loop has been relatively trivial, counting numbers\
    \ in ascending or descending order. However, the loop can be used for more sophisticated\
    \ programs.\n\nThe following program calculates the factorial of a number input\
    \ by the user. A factorial is the product of all positive integers from 1 to number.\
    \ For example, the factorial of 3 is 3 * 2 * 1, which is 6, the factorial of 5\
    \ is 5 * 4 * 3 * 2 * 1, which is 120.\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint main(void) \n{\n    int num, counter, total = 1;\n    cout << \"Enter\
