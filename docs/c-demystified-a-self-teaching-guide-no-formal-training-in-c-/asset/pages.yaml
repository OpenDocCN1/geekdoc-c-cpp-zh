- img_proc: true
  md: 'Note You may be wondering about the purpose of the long data type, since its
    size and range is the same as an int in Table 2-2. However, as noted just before
    that table, the actual size, and therefore, range of particular data type depends
    on the compiler and operating system. short may be 1 byte, or 2 bytes, and long
    may be 4 bytes.


    Beginning programmers sees something like shown in Table 2-2 and panic that they
    can''t possibly memorize all of it. The good news is you don''t have to. To be
    sure, memorization is necessary for any task. However, there is really too much
    information to memorize, programmers frequently resort to online help or reference
    books. Believe me, I do.


    Far more important than rote memorization is to understand and how your program
    works at it. Therefore, some arithmetic necessarily is involved, it is not difficult,
    and if you follow the arithmetic, a good understanding of data types will help
    you in your programming in the following chapters.


    # Signed vs. Data Type


    Table 2-2 lists three types: short, int, and long. Each of these three data types
    has either the unsigned version in front of it or not at all—as unsigned short
    and short.


    Unsigned means the number is always zero or positive, negative negative. Signed
    means the number may be negative or positive (or zero). If you don''t specify
    unsigned or signed, the data type is presumed to be signed. Thus, signed short
    and short are the.


    Since an unsigned data type means its value is 0 or positive, negative Table 2-2
    the smallest value of unsigned short is therefore; an unsigned short cannot be
    negative. By contrast, the smallest value of a short is -32767, since a signed
    data type may be negative, positive, or zero.


    # Size


    Each of the whole number data types listed in Table 2-2 has a size. Indeed, all
    C++ data types have a size. However, unlike people, the size of a data type is
    not expressed in inches or pounds (a subject for me), but in bytes.


    Since a byte is the smallest unit that a computer can process, no data type may
    be smaller than one. Most data types are larger than one; the whole data types
    listed in Table 2-2 are. However, regardless of the size, the number of bytes
    is a whole number. You cannot have a data type size of 3.5 bytes because .5, or
    4 bits, is too small for the computer.


    Generally, the number of bytes for a data type is the result of 2 since computers
    use a binary number system. Thus, typical data sizes are 1 byte (2⁰), 2 bytes
    (2¹), four bytes (2²), or eight bytes (2³).


    The size of data type matters in two respects: (1) the range of different values
    that the data type may represent and (2) the amount of memory required to store
    the data type.


    # Range'
