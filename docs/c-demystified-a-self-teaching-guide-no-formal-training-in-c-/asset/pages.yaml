  md: '# Introduction


    C++ was my first programming language. While I have learned others, I always thought
    C++ was the "best" programming language, perhaps because of the power it gives
    the programmer. Of course, this power is a double-edged sword, also being the
    power to hang yourself if you are not careful. Nonetheless, C++ has always been
    my favorite programming language.


    C++ also has been the first choice of others, not just in the business world because
    of its power, but also in academia. Additionally, many other programming languages,
    including Java and C#, are based on C++. Indeed, the Java programming language
    was written using C++. Therefore knowing C++ also makes learning other programming
    languages easier.


    # Why Did I Write this Book?


    Not as a reason to riches, fame, or beautiful women. I might be misguided, but
    I''m not completely delusional.


    To be sure, there are many introductory level books on C++. Nevertheless, I wrote
    this book because I believe in bringing a different and, hope, valuable perspective.


    As you may know from my author biography, I teach computer science at Los Angeles
    Valley College, a community college in the San Fernando Valley area of Los Angeles,
    where I grew up and have lived most of my life. I also write computer programs,
    by teaching has provided me with insights into how students learn I could not
    obtain from writing programs. These insights are gained not just from answering
    student questions during lectures. I spend each week in our college''s computer
    lab helping students with their programs, and many hours week reviewing and grading
    their assignments. Patterns emerge when introducing teaching methods that work
    and which order in which level of difficulty at which to introduce a new topic
    matters. I learn from my students that they are my best testers in my never-ending
    attempt to become a better teacher, but there is much truth in this hope.


    Additionally, my beta testers... err, students, seem to complain about the textbook
    matter book I built up. Many ask me why I wrote a book they could use to learn
    C++. They may be saying this flatter me (I''m not saying it doesn''t work), or
    for the more sinister reason that they will be able to blame the teacher for a
    poor book as well as poor instruction. Nevertheless, having written other books,
    these questions planted in my mind idea of writing a book that, in addition to
    being sold to the general public, also could be used as a supplement to a textbook.'
