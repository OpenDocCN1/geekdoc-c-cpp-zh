  md: '# Opening a File


    A file must be opened before you can read from it or write to it. As discussed
    in the introduction to this section, opening a file establishes a path of communication
    between the file and a stream object in your program. Opening a file for writing
    is first discussed.


    # Opening a File for Writing


    Either the ofstream or ifstream object may be used to open a file for writing.
    However, the ifstream object cannot be used for this purpose because it may only
    be used to read from a file.


    Both the ofstream and ifstream objects allow you to open a file of two ways. The
    first way is by using a member function, as you might expect, the open. The second
    alternative is using a constructor, which is explained in the “The ifstream or
    ofstream Constructor” section in this chapter, as follows:


    # The Open Member Function


    Both the ofstream and ifstream objects use an open member function, whose first
    argument is the name and location of the file to be opened. However, whether you
    include a second argument may depend on whether the ofstream or ifstream object
    is calling the open member function, or whether you want to access the file in
    a different “mode” than the default.


    # First Argument—Specifying the File to Be Opened


    The file to be opened for writing need not already exist. If it does, attempting
    to open it will automatically create it with the name at the specified location.
    However, whether or not the file exists, you need to specify a file name and location.


    Accordingly, whether the ofstream or ifstream object is calling the function,
    the first argument specifies the name and location of the file to be opened. This
    information may be provided by using either the relative path or absolute path
    of the file. The terms relative path and absolute path are new, let’s discuss
    them now.


    The relative path is the relative path to the location of your program. For example,
    the following statements for opening a file, students.dat, that is in the same
    directory as the program:


    ```

    ofstream outfile;

    outfile.open("students.dat");

    ```


    By contrast, the absolute path is the path starting with the drive letter, and
    including each directory and subdirectory until the file is reached. For example,
    if the students.dat file is in the Classes subdirectory of the Directory of my
    C++, it would be opened for writing, using the absolute path, as follows:


    ```

    ofstream outfile;

    outfile.open("C:\classes\students.dat");

    ```


    +   Note Two backslashes are necessary because one backslash is used to note an
    escape sequence. Two backslashes are the escape sequence for one backslash.


    Whether you use a relative or absolute path, the open function need not'
