  md: '# Anatomy of a C++ Program


    It seems to be a tradition in C++ programming books for the first code example
    to output to a console window the message "Hello World! (shown in Figure 1-1).


    ![](img/02e7eccb2cb7476802f735732c9e08fc_16_0.png)


    Note The term "console" goes back to the days before Windows when the screen did
    not have menus and toolbars but just text. If you have typed commands using DOS
    or UNIX, you likely did so in a console window. The text "Press any key to continue"
    immediately following "Hello World! is not part of the program, but instead is
    a code for how to close the console window.


    Unfortunately, all too often the "Hello World! is followed quickly by many other
    program examples without the book or teacher explaining how the "Hello World!
    program works. The result is a confused reader who''s ready to say "Goodbye, Cruel."


    While the "Hello World!" program looks simple, actually there is a lot going behind
    the scenes of this program. Accordingly, we are going to go through the following
    code for the -Hello World! program line by line, though not in top-to-bottom order.


    Note The code programmer writes is referred as source code, which is saved in
    a file that has a .cpp extension, standing for C++.


    # The main Function


    As discussed in the "What Is a Programming Language?" section, the purpose of
    C++, or any programming language, is to enable a programmer to write instructions
    for a computer. Often, a task is too complex for just one instruction. Instead,
    several related instructions are required.


    A function is a group of related instructions, also called statements, which together
    perform a particular task. The name of the function is how you refer to related'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'statements. In the "Hello World" program, main is the name of a function. A
    program may have many functions, and in Chapter 9 I will show you how to create
    and use functions. However, a program must have one main function, and only one
    main function. The reason is that the main function is the starting point for
    every C++ program. If there was no main function, the computer would not know
    where to start the program. If there was more than one main function, the program
    would not know whether to start at one or the other.


    Note The main function is preceded by int and followed by void in parentheses.
    It will cover the meaning of both in Chapter 9.


    # The Function Body


    Each of the related instructions, or statements, which belong to the main function
    are contained within the body of that function. A function starts with a left
    brace, {, and ends with a right brace, }.


    Each statement usually ends with a semicolon. The main function has two statements:


    ```

    cout << "Hello World!";

    return 0;

    ```


    Statements are executed in order, from top to bottom. Don''t worry, the term "executed"
    doesn''t mean the statement is put to down. Rather, it means that the statement
    is carried out, or executed, by the computer.


    # cout


    The first statement is


    ```

    cout << "Hello World!";

    ```


    cout is pronounced "C-out". The "out" refers to the direction in which cout sends
    a stream of data.


    A data stream may flow in one of directions. One direction is input—into your
    program from an outside source such as a file or keyboard input. The other direction
    is output—out from your program to an outside source such as a monitor, printer,
    or file.


    cout governs the output stream. It sends information to the standard output device.
    The standard output device is your monitor, though it could be something else,
    such as a printer or file on your hard drive.


    The << following is operator. You have likely used operators before, such as the
    arithmetic operators +, -, and /, for addition, subtraction, multiplication, and
    division, respectively.


    The << operator is known as the stream insertion operator. It inserts the information
    immediately to its right—in the text "Hello World!" into the data stream. The
    cout object sends that information to the standard output device—in this case,
    the monitor.


    Note In Chapter 3, we will learn about the counterparts to the cout and the <<
    operator, the cin object, which concerns the input stream, and the >> operator
    used with the cin.'
