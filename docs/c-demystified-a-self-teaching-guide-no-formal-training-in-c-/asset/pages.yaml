- img_proc: true
  md: "![](img/02e7eccb2cb7476802f735732c9e08fc_97_0.png)\n\n**Figure 5-4:** Flowchart\
    \ of program output if number is even or odd\n\n# # Conditional Operator\n\nThis\
    \ program could be rewritten using the conditional operator.\n\n```\n#include\
    \ <iostream>\nusing namespace std;\nint main(void) {\n    int num;\n    cout <<\
    \ \"Enter a whole number: \";\n    cin >> num;\n    cout << \"The number is \"\
    \ << (num % 2 == 0 ? \"even\" : \"odd\") << endl;\n    return 0;\n}\n```\n\nThe\
    \ syntax of the conditional operator is `[Relational expression] ? [statement\
    \ if true] : [statement if false]`\n\nIn this example, the relational expression\
    \ is `num % 2 == 0`. If the value of the relational expression is true, the output\
    \ is \"even\". However, if the value of the relational expression is false, then\
    \ the output is \"odd\".\n\nThe conditional operator requires three operands,\
    \ the relational expression and the two conditional statements. Therefore, it\
    \ is considered a ternary operator.\n\n# # Common Mistakes\n\nJust as with the\
    \ if, I noticed several common syntax mistakes with the else statement while teaching\
    \ C++ in introductory programming classes.\n\n# # No else without an if\n\nYou\
    \ can have an expression without an else part. However, you cannot have an else\
    \ part without an if. The else part must be part of an if statement. Therefore,\
    \ the else part works as \"none of the above\"; without an if part"
