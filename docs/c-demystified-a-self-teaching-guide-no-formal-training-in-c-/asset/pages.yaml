  md: '# What this Book Covers


    I strongly believe that the best way to learn programming is to write programs.
    The concepts covered by the chapters are illustrated by clearly and thoroughly
    explained code. You can run this code yourself, or use the code as the basis for
    further writing programs that expand on the concepts.


    Chapter 1 gets you started. It answers such as what is a computer program and
    what is a programming language. It then discusses the anatomy of a basic C++ program,
    both the code you see and what happens ''under the hood'', explaining how the
    preprocessor, compiler, and linker work to translate your code into instructions
    that the computer can understand. Finally, the chapter tells you how to use into
    an integrated development environment (IDE) to create and run a project.


    Being able to create and run a program that outputs "Hello World" as in Chapter
    1 is a good start. However, most programs first require the storing of information
    of different types, such as numeric and text. Chapter 2 explains the different
    types of memory, including random access memory, RAM. The chapter then discusses
    addresses, where data is stored in bytes, the unit of the amount of space required
    to store information. Because information comes in different forms, this chapter
    next discusses the data types for whole numbers, floating point numbers and text.


    The featured star of Chapter 3, which not only removes the overhead of memory
    to store information, but also provides you with a name by which information later
    may be retrieved. Because a variable without an assigned value is as pointless
    as a bank account without money. Therefore, this chapter explains how to assign
    a value to a variable, either at compile time using the assignment operator or
    at runtime using the cin object and extraction operator.


    As a former chess player, I have marveled at the ability of chess computers to
    play championships on even terms. The reason these computers have this ability
    is because they can calculate far more quickly and accurately than we can. Chapter
    4 covers arithmetic operators, which we use in code to handle the computer''s
    calculating ability.


    As programs become more sophisticated, they often branch in two or more directions
    based on whether a condition is true or false. For example, a calculator program
    would use the arithmetic operators you learned about in Chapter 4, your program
    first would need to determine whether the user chose addition, subtraction, multiplication,
    or division before performing the arithmetic operation. Chapters 5 and 6 introduce
    relational and logical operators, which are useful in determining a user''s choice,
    and the if and switch statements, used to direct the path the code follows based
    on the user''s.


    When you were a child, your parents may have told you not to repeat yourself.
    However, some code needs to continue and ask the user whether they want to run
    until the user enters valid data or quits. The primary subject of Chapters 7 and
    8 are loops, which are used to repeat execution until a condition is no longer
    true. Chapter 7 starts with the for loop, and also introduces the increment and
    decrement operators, which are very useful when working with loops. Chapter 8
    completes the'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'discussion of loops with the while and do while loops.


    Chapter 9 is about functions. A function is a block of one or more code statements.
    All of your C++ code executes is written within functions. This chapter will explain
    why and how you should write your functions. It first explains how to prototype
    and define a function, and how to call it. This chapter also explains how to use
    arguments to pass information back from the called function to a called function
    and return a value. Passing by value and by reference are also explained and distinguished.
    This chapter winds up by explaining variable scope and lifetime, both explaining
    and distinguishing local, static, and global variables.


    Chapter 10 is about arrays. The arrays variables provided in the book, which may
    only hold one value at a time, arrays may hold multiple values at once. Additionally,
    arrays work well with loops, which are covered in Chapters 7 and 8. This chapter
    also distinguishes arrays from arrays of other data types. This covers constants,
    which are similar to variables, but differ in that their value changes while the
    program is running.


    Chapter 11 is about pointers. The pointers often strikes fear in the heart of
    a C++ student, isn''t it? As you learned in Chapters 2 and 3, information is stored
    at addresses. Pointers provide you with an efficient way to access these addresses.
    You will also learn in this chapter about the indent operator and dereferencing
    them as well as pointer arithmetic.


    Most information, including user input, is in the form of character, C-string,
    and C++ string class types. Chapter 12 shows you functions are useful in working
    with these data types, including member functions of the cin object.


    Information is stored in files so it will be available after the program. Chapter
    13 teaches you about the file stream objects, ifstream, lstream, and ofstream,
    and how to use them and their member functions to open, read, and close files.


    Finally, with you a strong basis to go to the next step after this introductory
    level book, Chapter 14 introduces you to OOP, Object-Oriented Programming, and
    two programming concepts heavily used in OOP: structures and classes.


    A Quiz follows each chapter. Each quiz helps you confirm that you have absorbed
    the basics of the chapter. Unlike quizzes you took in school, you also have an
    answers appendix.


    Similarly, this book concludes with a Final Exam in the first appendix, and the
    answers to that found in the second appendix.


    ![](img/02e7eccb2cb7476802f735732c9e08fc_9_0.png)


    ![](img/02e7eccb2cb7476802f735732c9e08fc_9_1.png)


    ![](img/02e7eccb2cb7476802f735732c9e08fc_9_2.png)'
