    \n**Figure 9-1**: Order of execution of the Hello World Program\n\n# # Prototyping\n\
    \nSince execution always starts with main, it seems more logical to place the\
    \ main function first, ahead of the printMessage function, such as in the following\
    \ example:\n\n```\n#include <iostream>\nusing namespace std;\n```\n\n```\nint\
    \ main() {\n    printMessage();\n    return 0;\n}\nvoid printMessage(void) {\n\
