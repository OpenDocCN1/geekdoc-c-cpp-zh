  md: '# Assigning Values to Variables


    The purpose of a variable is to store information. Therefore, after you have created
    a variable, the next logical step is to specify the information that the variable
    will store. This is called *assigning* a value to a variable.


    A variable can be assigned a value supplied by the programmer in code. A variable
    also can be assigned a value by the user, usually via the keyboard, when the program
    is running.


    You may use the assignment operator, which is discussed in the [next section],
    to specify the value to be stored. You use the cin object (discussed in the upcoming
    section "Using the cin Object")- after the assignment operator, to obtain the
    user''s input, usually from the keyboard, and then take that input in a variable.


    # Assignment Operator


    You use the assignment operator to assign a value to a variable. The syntax is
    `[variable name] = [value];`


    The assignment operator looks like the equal sign. However, in C++ the sign is
    not used for test; it is used for assignment. As you learn in [Chapter 5], in
    C++, the equal sign is ==, also called the equality operator.


    The variable must be declared before, or at the same time, you assign it a value,
    not after-wards. In the following example, the first statement declares the variable,
    and the second statement assigns a value to that variable:


    ```

    int testScore;

    testScore = 95;

    ```


    The next example concerns [initialization], which is when you assign a value to
    a variable as part of the statement that declares that variable:


    ```

    int testScore = 95;

    ```


    However, the variable cannot be declared after you assign it a value. The following
    code will cause the compiler error "undeclared identifier" at the line testScore
    = 95:


    ```

    testScore = 95;

    int testScore;

    ```


    As mentioned earlier in the "Declaring Variables", this error will occur even
    though the variable is declared in the next line because the compiler reads the
    code from top to bottom, so when it reaches the line testScore = 95, it has not
    seen the variable declaration.


    The value assigned need not be a literal value, such as 95. The following code
    assigns to one variable the value of another integer:


    ```

    int a, b;

    a = 44;

    b = a;

    ```


    The assignment takes place in two steps:'
