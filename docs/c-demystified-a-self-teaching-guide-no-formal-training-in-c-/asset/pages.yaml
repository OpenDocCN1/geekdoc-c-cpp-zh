    By contrast, the prototype and function header for doubled when the argument is
    passed by reference each includes the ampersand before the data types:


    ```

    void doubleIt(int&);

    void doubleIt(int& x)

    ```


    However, the function call is the same whether the variable is passed by value
    or by reference; there is no ampersand in either case. Whether the program passes
    an argument in a function by value or by reference is dictated by the function''s
    prototype.


    You can pass multiple values by reference as well as by value. You can pass some
    values by reference and others by value. You pass by reference those values you
    need to change, and you pass by value those values you are not changing.


    +   Note There is another difference between passing by value and passing by reference.
    You can pass by reference expressions and constants (constants are covered in
    Chapter 10) as well. However, you can only pass variables by reference.


    For example, the following programNumbers has three arguments. The first two arguments
    are numbers to be added, and are passed by value. The third argument will be the
    sum of the two numbers and will be passed by reference, since its value is being
    changed in the called function:


