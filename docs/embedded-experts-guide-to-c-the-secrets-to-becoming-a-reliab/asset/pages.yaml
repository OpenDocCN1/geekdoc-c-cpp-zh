  md: '# Endnotes for Introduction


    1 Embedded software engineers have overcome this to an extent by creating their
    own equivalent of the “Hello World” program – they often write some simple code
    to flash an LED on their development board. This code is typically rather more
    complex than the canonical “Hello World” example.


    2 Many embedded compilers use it to provide some form of debug functionality.


    3 Despite the similarities between the two languages, C is not a subset of C++
    as is sometimes claimed. They are two distinct languages and should be treated
    as such – although most C programs can be written in such a way as to compile
    with a C++ compiler, the generated machine code is not guaranteed to be functionally
    equivalent to what would be generated by a C compiler. Furthermore, there are
    important differences in how the code is compiled.


    4 This is the name often sometimes given to “K&R style” – the style used in The
    C Programming Language and the original UNIX kernel, although it is not and never
    has been specified as an official preferred style; indeed, The C Programming Language
    states: “The position of braces is less important, although people hold passionate
    beliefs. We have chosen one of several popular styles. Pick a style that suits
    you, then use it consistently.”'
