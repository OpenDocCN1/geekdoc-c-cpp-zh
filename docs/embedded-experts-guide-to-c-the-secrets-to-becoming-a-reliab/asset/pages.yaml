  md: 'We have mentioned having a task queue several times, but so far have not discussed
    how one could be implemented. This may not be a problem – when using a third-party
    library to implement multitasking, such details are often of little interest to
    the programmer. However, even if you do not intend to implement your own scheduler,
    understanding the essentials can help clarify some of the other concepts we have
    covered.


    In its simplest form, a task queue could be implemented as an array of task contexts
    or task Each task handle is a struct storing all the information required about
    the task it relates to: at the very least, it must store a reference to the task
    entry function, the current program counter and stack pointer being used by the
    task and the values to be stored in other registers when the task is running.
    It also makes sense to include some additional information about the task, such
    as flags to indicate whether the task is suspended or waiting for an external
    resource.


    The task reference itself is easily implemented using a pointer to a function,
    although the syntax can appear arcane if you have not seen it before (it is common
    to use a typedef to improve readability). This requires the entry function of
    every task uses a common function signature – often the function will be called
    with no parameters and will not return a value, although this need not be the
    case provided all tasks are called and return in the same manner. This raises
    the question of how data is passed between tasks. Global variables can be used,
    but the usual precautions associated with them apply; indeed, the running of multiple
    tasks concurrently increases the risks associated with using global variables.
    Furthermore, using global variables prevents the tasks from being re-entrant.'
