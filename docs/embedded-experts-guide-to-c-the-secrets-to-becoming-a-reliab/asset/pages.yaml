    # Stacks


    A stack, occasionally known as a LIFO (last-in, first-out) is a simple data structure
    which allows variables to be read and removed in the reverse order to which they
    are written. The read and write operations are often referred to as “pop” and
    “push” respectively. Since the pop operation also removes the variable from the
    stack, there is often also a “peek” operation for reading a value without removing
    it.


    Most software already includes a often referred to simply as the stack, although
    this is not directly managed by the programmer. Instead, because it is used for
    local variable allocations and handling function calls and returns, the code for
    managing it is generated by the compiler. Much of the work in these cases is performed
    using hardware.


    When required, stacks are easy and efficient to implement. This can be done using
    an array to store the data and a pointer to the next free element. The pop and
    push functions need only copy data to or from the stack and increment or decrement
    the pointer as required. It is also recommended additional logic is included to
    prevent the stack from over- or underflowing. If the stack is only required to
    store one data type, then an integer may be used to track the next free location
    instead of a pointer; if the stack is intended to store multiple data types, it
    should be implemented as an array of'
