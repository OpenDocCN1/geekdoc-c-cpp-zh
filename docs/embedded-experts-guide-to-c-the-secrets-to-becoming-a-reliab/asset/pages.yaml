- pgno: 237
  md: 'Fig 10.3 - The simple round-robin scheduler (top) can be adapted to schedule
    tasks of different priorities. The weighted round-robin scheduler (centre) allocates
    more time to high-priority tasks, either by allowing them to run for longer or
    by allowing more tasks in the high-priority queue to run before switching to a
    lower priority task. The interleaved round-robin scheduler (bottom) achieves the
    same result, but distributes the time-slices for each priority so more evenly;
    although the total time spent running tasks in each queue is the same, some lower
    priority tasks will be allowed to run earlier than with the more basic weighted
    variety.


    Using the UART, user input and display example introduced at the beginning of
    this chapter, we could choose to assign the highest priority to the UART servicing
    task, an intermediate priority to handling user input and a low priority to updating
    the display. This would allow the fast UART communications to be processed more
    frequently, while the display updates would only have to be processed occasionally.
    Assigning a medium priority to the user input allows this to be handled frequently
    enough for the user not to notice any significant delay.


    This approach may seem intuitive and is likely to work for simple systems. However,
    a more thorough and systematic method of assigning priorities is required for
    most real systems. The optimal way to assign priorities, at least for fixed priority
    scheduling, is to use rate-monotonic While correctly assigning priorities can
    require some in-depth analysis, the principle is straightforward – the less time
    a task requires to the higher its priority should be, much like the STCF approach
    discussed earlier. For optimal CPU usage, task periods should be harmonic – each
    period should be an exact multiple of the periods of higher-priority (shorter
    period) tasks. If tasks cannot be reliably scheduled using rate-monotonic scheduling,
    then they cannot be reliably scheduled using any fixed-priority scheduler.'
