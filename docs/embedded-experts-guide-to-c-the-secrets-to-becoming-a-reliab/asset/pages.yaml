- pgno: 131
  md: '# Chapter 6:

    Data Security and Integrity


    A topic that is sadly neglected in many software development resources is that
    of security and integrity. This area is, however, more important than ever – the
    enormous growth in connectivity over the past twenty years or so now means that
    many seemingly trivial products have the potential to expose their users to problems
    ranging from nuisance and inconvenience to severe financial losses or physical
    harm. You may question the need for a plethora of everyday, Internet connected
    widgets (quite rightly, if you ask me!), but the fact remains that they are being
    built and sold. Of course, there are many other reasons why this topic is important
    – it is just no longer to be considered a specialist topic; it is something that
    every embedded engineer needs to know about.


    First, a couple of definitions:


    Integrity is about ensuring that data is “correct” – it has not been corrupted
    between being transmitted or stored and being received or retrieved. Data that
    is erroneous should be detected and either corrected where possible or discarded.


    Security is about ensuring that data cannot be accessed, or commands issued by,
    those with no right to do so, either intentionally or by mistake. This includes
    the subject of encryption – the process of making data completely inaccessible
    without access to additional information.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Although there is a degree of overlap between the two topics, it is important
    to distinguish between them. Integrity is important to any system where data errors
    may cause unwanted or potentially dangerous behaviour; the data need not be sensitive
    and there may be no need for such a system to be secure. Conversely, a secure
    system may not always need to pay close attention to data integrity even when
    that data may be regarded as sensitive. However, the two often go hand-in-hand
    and many of the methods used to ensure data integrity are also useful in ensuring
    its security.


    # Data encoding


    Before diving into a discussion of specialist methods used for ensuring the integrity
    of data, it is worth mentioning the need for data encoding. Many older communications
    protocols designed for connecting systems were not intended for transmitting arbitrary
    binary data; they expect to send and receive text, with certain character codes
    interpreted as control codes. Many assume 7-bit ASCII encoding (or default to
    it) and any arbitrary data must first be encoded to match. A considerable number
    of so-called binary-to-text encodings exist for this purpose. Although many newer
    protocols do not require such encodings, it is still worth having a basic understanding
    of them when setting up communications between systems; not only are the encodings
    still widely used to ensure compatibility but encoding data can also be useful
    when it needs to be mixed with control codes (to indicate the beginning and end
    of a stream, for instance).


    One popular encoding is known as Base64. The basic principle, which is similar
    to the method used in many other common encodings, is that the underlying data
    is broken into 6-bit words (which gives 64 possible'
