  md: 'In practice, most arrays are one-dimensional, i.e. only a single index is required
    to identify any element; however, multidimensional arrays, where elements are
    identified through multiple indices, are also supported. In the same way a one-dimensional
    array can be accessed using pointers, a multi-dimensional array may be accessed
    using pointers to pointers for a two-dimensional array, or however many layers
    of indirection are required for higher dimensional arrays. Because arrays are
    allocated to continuous regions of memory, it is also possible to access a multidimensional
    array using only a single level of indirection, although doing so is usually impractical
    and highly unlikely to result in code which is easily understood.


    Arrays are well-suited to random access operations; read and write operations
    take the same amount of time regardless of the location in the array being accessed.
    However, inserting or removing elements from an array arbitrarily is an expensive
    operation, because it requires significant rearrangement of other elements; other
    data structures, albeit ones often built using arrays, are better suited to these
    operations, and some of these will be covered in this chapter.


