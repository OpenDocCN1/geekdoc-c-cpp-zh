  md: 'Phase 2 of the translation process removes superfluous newlines from the source
    code. Any instance of a backslash followed by a newline is deleted. This is nothing
    more than a piece of housekeeping on the part of the preprocessor and of little
    concern to the programmer.


    Preprocessor tokenisation is the next step of translation. Tokenisation is the
    process of analysing and decomposing source code into its constituent parts –
    in the same way as a sentence may be analysed to identify nouns, verbs and other
    types of word, code may be analysed to extract identifiers, operators and other
    classes of token. The tokenisation process in C is context-sensitive – the token
    class may not be unambiguously resolved based solely on a sequence of characters.
    Occasionally this can lead to some cryptic errors, such as a typedef alias being
    treated as a variable name because an appropriate typedef is not found in the
    correct place. The fact the tokenisation process is context-sensitive will not
    stop the code from being interpreted in a different way to what seems obvious
    to the programmer: just try compiling a program which includes the line a=b/*c;
