- pgno: 6
  md: '# Foreword


    This is the foreword, skipped over by everyone. Dive right into the code! It''s
    what you are here for after all isn''t it? Come back to it later, in a year or
    two, if ever. With C the problems are perennial so the comments here will still
    be the same next year. On the other hand you could read it now. To understand
    why, here is some context for the book, C and embedded systems.


    You may be asking do we need yet another book on C programming. There are several
    reasons why we do. However, this not a book about “how to write there are already
    far too many of those. It is more a book of “how not to write C” and that is very
    important. More about this later.


    The constant thing about C is that C is always changing. The original Kernighan
    and Ritchie (K&R) first book on C, published in 1978, is less than 1/10th the
    size of the current C standard and most programmers haven’t read any C standard.
    (Have you read one?) Some of the constructs in K&R 2nd Edition, 36 years ago (or
    45 years for the 1st edition), have changed, often silently, and are still changing.
    Worse still problems in the C standard are often not being fixed but new things
    piled on them.


    Therefore, C programmers are working with a constantly changing language that
    may not behave as it used to or how the programmer expects it to. Then you have
    the problem that many, most, or possibly all(?) compilers tend not to fully implement
    the C Standard or restrict parts of it and then add their own extensions. There
    is very little you can assume'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'about C. I note that for one static analyser they had over 100 different configuration
    files for C compilers to tweak the checking for the (different) C each compiler
    used. Hence rigorously defined sub-sets like MISRA C and Barr C that try to highlight
    problem areas. Like the C standard, for 25 years, MISRA C has also been expanding
    to keep pace. After nearly three decades of being involved with the ISO C standard,
    including 5 years as UK Convenor, and also being involved with MISRA C since the
    mid-1990s: I would say, “I don’t know any one person who can claim to know the
    C Language fully.” They know some parts well and others less well. They know enough
    to know where to look to find out in the standard. Though as mentioned you also
    need the compiler documentation as well. So, if you meet someone who claims to
    “know C” they are going to be deluded. Any real expert I know has more sense to
    say that without several caveats. I seem to recall Dennis Richie saying there
    would be no K&R 3rd edition because the language had moved on so far from the
    one that he had developed that he didn’t know it fully.


    Secondly, most books on C are aimed at people writing apps on a generic OS like
    Windows or Linux. Programming in C for bare metal or an RTOS system is a very
    different game. This is where you really need to understand the subtleties of
    how the language handles the hardware and indeed the pitfalls of the hardware.
    There may not be.... Well, anything a desktop system would expect. Also as mentioned
    above there are many variations in C, as the author shows in the following chapters,
    many are permitted by the C Standard, but many others are compiler extensions.
    So “knowing C” is not enough for embedded developers, they also need to know the
    hardware and how the specific compiler deals with it. It is not just endianness.
    We all know there is big-endian and small-endian though I have worked on an MCU
    with three types of endian on the chip! The problem gets bigger with the storage
    of long and long depending on how'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'the hardware works. But you all knew that didn’t you? In the same way you know
    why you never use printf for debugging.


    So, unlike most “learn C” books, this book looks at many things that are essential
    for embedded developers that desktop OS programmers on Windows, Macs and Linux
    never encounter or, often, they are not even aware of. That said, even desk-top
    programmers will learn a lot from large parts of this book.


    I have said that this is more a book of how not to write C and that is very important.
    The author looks at some of the less than obvious pitfalls of C and how to avoid
    them. This is where it is how not to program in C. Why you should not be doing
    things that for often subtle reasons probably won’t do what you expect. In K&R
    or C90/95 it may have worked but not in in the same way in C99. In some cases,
    urban myths about register, volatile, constant and static that may have been true
    on a popular compiler or two 30 years ago are simply not true now. Others never
    were. When you start looking into these things you start to realise why MISRA
    C and Barr C exist.


    In 2018 I had a meeting with Michael Barr to discuss the new MISRA C and Barr
    C versions so that they were not incompatible. Michael does a lot of consultancy
    and his Barr C was born out of seeing the same problems time and time again in
    development teams. Three decades earlier in 1993-6, when the UK automotive companies
    were seeing exactly the same problems, they began the work that gave birth to
    the first MISRA C. This is the same way that CERT C was developed, although with
    a different result than MISRA and BARR. When I attended a course run by Chris
    Rose, the author of this book, some of the questions asked by those'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'attending were the same questions that have been asked for the last 30 years,
    often by people who have been programming for years.


    I was surprised to discover that the first static analyser (the original Lint)
    was developed by part of the K&R team in 1976 before they finished developing
    the language because people were misusing legal but dubious constructs. Yes, even
    K&R over 40 years ago realised programmers were misusing C. That it compiled clean
    was no guarantee of it being correct or doing what the programmer intended.


    In many ways it is more important to learn how not to write C than how to write
    C. So many problems are caused by programmers doing things that don''t work as
    expected. The other very important thing is that whilst this book does highlight
    these, very many areas (though not all 400 plus that I know of) it does not detail
    all the problems. Most are way outside the scope of a book like this but it does
    point you at where to look for answers. The one constant with embedded systems
    is they are all different, therefore not all the problems will apply to all developments,
    even if you should be aware of them in principle. Also, as I said, no one person
    is a complete expert. This is why the author points you at places where there
    are experts on the specific area rather than explain himself.


    So, in short, learn how not to write C for embedded systems. It will make the
    C you do write robust and solid. Then the code should even do what you intended
    and crucially not do anything you didn''t intend.


    Good luck


    Chris Hills'
  merge: -1
  img_proc: true
