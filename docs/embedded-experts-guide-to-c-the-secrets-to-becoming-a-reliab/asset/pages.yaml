  md: '# Chapter 4:

    Interrupts and Callbacks


    C is a procedural programming language; that is to say, a C program is built of
    procedures, known as functions, which can be invoked from elsewhere in the code,
    run, and eventually return to the location from which they were called. The functions
    themselves consist of statements which outline the computational steps the function
    is required to perform. The order in which the procedures and the statements contained
    within them are invoked is entirely determined by the code.


    But what if you need a way of changing the deterministic flow of a program? Say
    the device is supposed to be operated by a user. Would it be acceptable to the
    user if they were required to wait until the program was ready to respond to their
    input, or would they prefer the response to be, or at least to appear, instantaneous?
    Most people, at least when they are the user, would prefer the latter option,
    but this responsiveness is not an inherent feature of procedural programming.
    What is required is not a procedural program, but an event-driven one where control-flow
    is determined by conditions at runtime; an event, in this context, is any change
    in condition which requires the timely attention of the processor.


    To achieve such a responsive program, you could use a method known as busy waiting
    – this requires a loop which continuously monitors, blocking all other program
    activity, until the user input is detected. While this will work, it is clearly
    an inefficient way to write software. It also assumes there are no other events
    which the program may need to respond to –'
  merge: -1
  img_proc: true
