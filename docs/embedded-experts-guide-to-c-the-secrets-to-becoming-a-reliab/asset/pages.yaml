    # Using interrupts


    Interrupts, broadly speaking, fall into one of two categories: maskable and non-maskable
    A maskable interrupt is one which can be disabled through software, usually by
    writing to a specific register. Some processors also have a dedicated instruction
    to disable or enable all maskable interrupts. It can be helpful to define a macro
    to execute these instructions using a meaningful symbol name when required: something
    like #define DISABLE_INTERRUPTS asm “di” will do the job (this particular macro
    will work with PIC32 microcontrollers, the appropriate instruction for enabling
    interrupts is Such macros, or an equivalent function, may already be defined as
    a compiler extension or as part of a platform-specific library. Non-maskable interrupts
    cannot be disabled; therefore it is appropriate to use them when an event will
    always need to be responded to even if the processor is currently servicing another
    interrupt, such as an emergency stop signal. A reset signal is also an interrupt
