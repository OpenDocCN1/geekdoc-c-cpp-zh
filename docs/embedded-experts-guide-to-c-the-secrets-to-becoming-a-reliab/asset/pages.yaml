- pgno: 270
  md: 'that many existing embedded compilers will remain largely unchanged for some
    time.


    Second, there is no mention of Rust. The programming language – not the red stuff
    you find on nails. This is a book on C, so arguably there is no reason to mention
    any other language at all. Many are mentioned in passing, but not in detail. Why
    then, should Rust be any different?


    Rust does deserve a special mention. Its proponents say it is the language that
    will finally replace C (and C++). Such claims are premature, but should not be
    dismissed entirely. Rust does have some benefits over C. Throughout this book,
    I have highlighted the many issues the C language has, most of which can be avoided
    by using Rust. But the same could be said of Ada, and if programming languages
    became popular based solely on technical merit, we would see much less C and much
    more Ada. Rust, however, has something more than technical merit. Since 2021,
    it has had the Rust Foundation, the founding members of which are Microsoft, Amazon
    Web Services, Huawei, Google and Mozilla. Their support, rather than the language''s
    reputation for safety, are what I suspect is driving its seemingly unstoppable
    growth. By the time people started to show serious interest in Rust, this book
    was nearly complete. So, like C23, Rust''s absence is nothing more than a case
    of bad timing.


    There will be a market for C programmers for years to come, but at least consider
    learning some Rust.


    In case you''re wondering, the reason this book took so long to write is because
    C is so full of quirks and nuance. Researching it is to go down a rabbit hole.
    There is a great deal left unsaid in this book. I could keep working for another
    five years and there would still be a great deal left'
