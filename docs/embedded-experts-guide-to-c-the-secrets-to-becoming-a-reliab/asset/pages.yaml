- pgno: 275
  md: '![](img/605f0fb04c15ae9612ab9a8fee5ca8e7_275_0.png)


    Countless pieces of software are written in C. Every year, thousands of students
    learn the language. 50 years after first being created, it remains popular – especially
    for embedded applications.


    That popularity means a great many books have been written on how to write C.
    So you might – quite reasonably – ask if the world really needs another one. The
    answer: “probably not.”


    But this is NOT another book on how to write C – it is a book on how not to write
    C. That is something the world desperately does need, because despite its enduring
    popularity, many programmers remain blissfully unaware of the issues C has or
    how to avoid them.


    This book assumes you can already write C the way all those other books tell you
    to do it. Its purpose is not to repeat what you already know, but to reveal some
    of the nuances, curiosities and outright absurdities of the language that are
    all too often ignored.


    ![](img/605f0fb04c15ae9612ab9a8fee5ca8e7_275_1.png)'
