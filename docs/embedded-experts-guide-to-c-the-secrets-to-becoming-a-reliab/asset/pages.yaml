- pgno: 11
  md: '# Introduction:


    # Yet Another Book on C?


    The C programming language has existed for almost 50 years. The C Programming
    Language , the book on the language written by Brian Kernighan and Dennis Ritchie
    – was first published in 1978. Since then, there has been a second edition (which
    coincided with the first attempt to standardise the language) and countless other
    books on the topic. So, what possible reason could there be for another one?


    The answer: while many books acknowledge the many shortcomings of C, relatively
    few are written with the embedded programmer in mind. They are written for those
    who write software for PCs, servers and other “general purpose” platforms. This
    is somewhat surprising since embedded applications is one key area where C continues
    to dominate; more modern programming languages tend to be preferred in most other
    contexts.


    In my experience, and that of many others I have spoken to, the modern, general
    purpose programmer is woefully ill-equipped to program embedded systems. They
    lack the necessary knowledge of hardware and of how microprocessors really work.
    During their training, they are sometimes told such untruths as, “hardware is
    easy, software is hard.” This book is specifically written with embedded systems
    in mind.


    The internet has revolutionised the computing and wider software industries. It
    is now generally accepted by end-users that the software they use will require
    continuous updates. This allows programmers to become'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'complacent about “bugs” – coding errors that cause software to misbehave –
    they can simply be corrected later. Speak to anyone who has ever written safety-critical
    software and they despair at this attitude. If you cannot immediately see why,
    ask yourself how comfortable you would be travelling if the aerospace industry
    had a reputation for releasing regular updates for their control software. Even
    the word “bug” is frowned upon by many – it trivialises the devastating consequences
    the errors can have; the word defects is preferred to emphasise their seriousness.
    Although not always inappropriate, cycles of repeat updates are often not an option
    in embedded applications. Assuming a continuous internet connection (or even a
    connection at all!) is hardly good practice; more importantly, a single defect
    can cause enormous damage before being detected. The consequences of defective
    software should be required knowledge for any programmer. Updates would not have
    helped the victims of Therac-25 or saved the maiden flight of While the consequences
    might not always be so serious, there are countless other cases where there is
    little or no opportunity to correct the defects later.


    The embedded systems you work with may not be safety critical, but there are still
    many areas where embedded software differs from its general purpose relative.
    For example, the traditional first task for a computer programmer learning a new
    language is to display the words, “Hello World” to the screen. In C, like most
    languages, this is a simple task once you have discovered the printf function.
    At least, it is until we consider embedded I often work with hardware that have
    only numerical displays – or no display at all! It is somewhat meaningless to
    display words on a non-existent display. Even for embedded systems which do include
    a display, there is no reason to assume that printf will write anything to it
    (although, since the function is part of the C Standard Library, it is included
    with every compliant C There are many other examples of'
  merge: -1
  img_proc: true
- pgno: 13
  md: '"standard" functions that are likely to exhibit anything other than the expected
    behaviour when used in embedded software.


    ```

    #include

    /* A program to say hello, then exit. */

    int main(void)

    {

    printf("Hello, world. \\n");

    return

    }

    ```


    Fig I.1 The classic "Hello, World" program written in C.


    Although no book can make you write perfect, defect-free software every time or
    teach you everything there is to know about any language, this book will at least
    highlight the areas where they are most likely to creep in when using the C language.
    Crucially, it is intended to offer practical advice and guidance rather than be
    a treatise on programming theory. It will also help you to develop better practices
    so that your style and attitude to programming is one that inherently favours
    reliability and safety. Unfortunately, C is a particularly problematic language
    when it comes to writing reliable, safe software.


    Given the well-documented shortcomings of C, you might question why it has enjoyed
    such enduring success. The answer is that C is flexible, portable in most cases
    and compilers are generally able to produce efficient machine code. The widespread
    availability of C compilers is also a major factor; there is a C compiler for
    almost every platform currently in use. In embedded applications, the low-level
    features of C make it particularly suitable. The lack of an extensive run-time
    environment'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'makes it possible to write stand-alone code which does not require any underlying
    system to support it – this is also why C has remained popular as a language for
    developing operating systems. Alternatives do exist: Pascal, and Ada have all
    competed with C at some point; more recently, it has been suggested that Google''s
    Go language may displace C as the preferred systems programming language (personally,
    I am sceptical, but only time will tell).


    # What exactly are embedded systems?


    You may already have your own ideas about what qualifies as an embedded system,
    but sadly there is no definitive example of what one is. It is simply too broad
    a category to precisely define. The phrase covers the vast majority of modern
    digital electronics, from digital alarm clocks to the flight control computers
    of spacecraft. This includes telecommunications technology, traffic management
    equipment, computer peripherals, medical devices, and the electronic systems in
    modern vehicles. I know an embedded system when I see it, and they are everywhere.


    Ask a dozen engineers how they define an embedded system and you will likely receive
    a dozen different answers based on individual experiences. Some will assure you
    that embedded systems are “small”, but this need not be true. Others will assure
    you that they have little or no means of user control, again, this is only sometimes
    the case. It is also not true that operating systems are not used with embedded
    systems – they often are, and many operating systems have been developed for exactly
    this purpose. There are, however, some common features that will regularly appear
    in the various definitions you hear. There will likely be some reference to well-defined
    tasks – embedded systems are typically not intended as'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'general-purpose tools; they have a specific list of functions to perform.

    Often low-level hardware access is required to interface with the various

    elements in an embedded system without the convenience of abstraction

    granted when programming for general-purpose computers. Strict timing

    requirements and constrained resources are other common features of

    embedded systems. Handling these constraints requires a different mindset

    compared to programming a system where memory is in abundance and

    timing is rarely critical. Finally, embedded systems can be used to handle

    safety-critical tasks; above all else, this is a very good reason to treat them

    differently to other systems. The consequences of writing poor software

    for safety-critical applications are not limited to reputational damage or

    lost profit: people can lose their lives.


    The range and variety of embedded systems is constantly evolving. In

    recent years, the “Internet of Things” has become a common topic of

    discussion. Most of the “things” that comprise this novel, loosely defined

    concept are embedded systems of one form or another. This adds another

    dimension to the responsibilities of every embedded engineer: that of

    information security. As data is transported and stored in ever increasing

    quantities, and much of that data is personal and identifiable, it is crucial

    that the means by which it is collected and processed is protected, both

    from deliberate misuse and from negligent disclosure. While the

    consequences of bad software may not be so immediately severe as those

    in safety-critical systems, releasing somebody’s credit card details or

    location is hardly an insignificant mistake.


    Although this may help explain how embedded programming differs from

    other more general styles, it does not really answer the seemingly simple

    question posed at the beginning of this section. Unfortunately, the best I

    can do in that regard is to offer a general, vague definition: An embedded'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'system is a computer which performs dedicated functions as part of a larger
    system.


    # What exactly is C?


    You already know that C is a programming language (if you did not, I would be
    very surprised that you chose to pick up this book), but that is only a partial
    description. A more complete explanation would be that C is a general-purpose,
    procedural programming language – it does not attempt to limit the type of programs
    that can be written in the language and each program consists of building-blocks
    known as functions. Every C program has at least one function – almost always
    called – but most have more; indeed, too much code in the main function (or any
    other function) is generally a sign of a poorly written piece of software. From
    a more practical perspective, before diving into how we use C, it is worth clarifying
    a few points.


    When we refer to C it may appear as though we are referring to a single programming
    language. Although this is true to an extent, it is necessary to be aware of that
    there no fewer than five versions of standardised (ISO) C, not including amendments:


    The most recent of which (at the time of writing) is C18 (the 2018 version).


    You may also come across ANSI C, which was the first attempt at standardisation.


    ANSI C ("C89") and'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'the first version of ISO C (“C90”) are, from a practical standpoint, equivalent.


    In addition to ANSI and ISO versions, the language existed prior to the first
    published standard; this version is usually referred to as “K&R C” since it is
    the version used in “The C Programming Language.” However, K&R C is not a standard
    and should not be treated as such – there is no such thing as a K&R compiler.
    (See Fig 1.2)


    +   - 1967 BCPL (Influenced B)

    +   - 1969 B (Influenced C) Unix introduced

    +   - 1972 C introduced

    +   - 1973 Unix kernel rewritten in C

    +   - 1979 "The C Programming Language" ("K&R C")

    +   - 1989 ANSI C/"C89" The C Programming Language, 2nd Edition

    +   - 1990 ISO C/"C90"'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/605f0fb04c15ae9612ab9a8fee5ca8e7_18_0.png)


    Fig I.2 Key moments in history of the C Language.


    While there is a degree of compatibility between different versions of the language,
    it is not guaranteed and certainly should not be relied upon. Features are added
    with each new edition and some others are deprecated. The behaviour of the language
    may also be clarified or refined whenever a new version of the standard is published.


    The question of which version you should use is not easy to answer. Compilers
    typically lag by a few years when it comes to implementing the latest version
    of the standard and many deliberately target earlier versions of the standard
    as a way of maintaining compatibility. Furthermore, few compilers are truly faithful
    to the standards anyway; most vendors will include additional features, and many
    choose not to implement the standard in full. As far as embedded systems are concerned,
    you are unlikely be using a compiler that implements anything more recent than
    C99, although there may be many vendor specific extensions included to help with
    common problems. For some platforms, it may be that you are'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'restricted to C90 or C95 (more accurately: C90, Amendment 1). You will need
    to check your compiler documentation to be sure. For the majority of this book,
    C99 is assumed unless otherwise stated. Whenever the “C Standard” is mentioned
    without additional clarification, it is the 1999 version that is being referred
    to.


    Much of the advice and guidance found in this book is based on additional coding
    standards, particularly MISRA C and Barr C. Despite their applicability to professional
    embedded programming, neither receives much acknowledgement in general programming
    literature. MISRA C is a standard specifically produced to aid in writing safety-critical
    C programs. Barr C is similar, in that it focusses on software reliability and
    safety, and does not conflict with the MISRA C rules. Barr C is available free
    of charge from the Barr Group website. There is a charge for a copy of MISRA C,
    but it is remarkably affordable and worth the investment if you are involved in
    writing any high-reliability embedded software.


    # Stylistic conventions used in the book


    Like most programming books, this one uses certain stylistic conventions when
    mixing text and code. Keywords, function and variable names and code fragments
    are all written using monospaced font. This highlights them so that they can easily
    be identified as code snippets; it is also consistent with the display style of
    development environments. On occasion, unimportant pieces of code are omitted
    and replaced with a placeholder: ...; Where this placeholder appears, you may
    simply assume that the code it replaces is legal C and unimportant to the example
    in question.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'One area of (mostly pointless) debate among programmers, for no particularly
    good reason, is the bracing and indentation style that should be used. There are
    people with strong opinions on the subject and this has resulted in such nonsense
    as one style being dubbed the “One True Bracing and some programmers boasting
    of “correcting” the style of others. Becoming evangelical about such things is
    pointless; there are multiple styles and all result in valid code. Personally,
    I prefer to place opening and closing braces on their own line, indented to the
    same level as the preceding (or following) code, with additional indentation between
    the braces; this is the style I use in examples throughout this As far as I am
    concerned, you are free to pick any style which appeals to you. If you work as
    a team, agree a style and then have the team use it consistently. Ultimately,
    the style you use hardly matters, but consistency does.


    There is less debate around the placement of parentheses after function names
    and control statements, although some people do still have strong feelings about
    this too. For completeness, the style I use in this book and my own code is not
    to include a space before the opening parenthesis following a function name, but
    to include one following a control statement (such as an or


    # What’s in this book?


    This book started life as a one-day training course entitled “C Programming for
    Embedded Systems”. The course, and this book, explores many aspects of the C language
    with a particular emphasis on embedded systems, although this book adds some additional
    material not present on the course. It assumes a certain level of familiarity
    with the language and is not an entry level book – what this book will not help
    you with is the basics of the C language; there already exist many books and'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'courses for that purpose and the best way to learn is to begin experimenting.


    You may choose to read this book from cover-to-cover, or you may choose only to
    read those chapters or sections which you find particularly interesting or useful.
    That decision is yours alone. Either way it is worth quickly outlining what each
    chapter covers:


    The first chapter, “Trust the Programmer” - Issues with C, will help you to understand
    why C has developed such a poor reputation where safe programming is concerned.


    The second chapter, Writing Safer C, will introduce a combination of techniques
    and tools you can use to make your software safer and more reliable rather than
    relying on extensive debugging.


    Chapter three, Managing Memory, provides practical guidance on how memory housekeeping
    in embedded systems. It shows you how to implement common memory management techniques
    and helps you decide when it is appropriate to use them.


    Chapter four, Interrupts and Callbacks, will help you write better interrupt service
    routines, as well as understand the problems and risks that can arise as a result
    of the change in program flow and how to overcome them.


    Chapter five, Interacting with Hardware, describes the best-practice approach
    to writing hardware drivers, as well as introducing you to common communication
    protocols you are likely to encounter in embedded systems.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Chapter six, Data Security and Integrity, focusses on the requirements for
    many modern systems, where protecting communications from eavesdropping is a serious
    concern.


    Chapter seven, The C Preprocessor, deals with the C preprocessor, which is not
    strictly a part of the language and often neglected, but needs to be properly
    understood in order to write good software.


    Chapter eight, Understanding the Translation Process, gives some in-depth analysis
    of what happens when a C program is compiled and how the process can be manipulated
    when required.


    Chapter nine, Run! Run! Run! – Optimising Software, provides some useful guidance
    on how and when to optimise your software as well as helping you to determine
    which parts of the software to concentrate on.


    Chapter ten, Multitasking, introduces the concepts required when writing multitasking
    software and describes the steps you need to take in order to write a basic task
    scheduler.


    Finally, chapter eleven, Bootloaders and Operating Systems, will help you write
    software for hosted environments, where you must often sacrifice some control
    over behaviour in exchange for having many management functions handled for you.


    If you have read this far, then this is probably to book for you. All that remains
    is to wish you the best of luck in developing the skills you need to become an
    embedded programming expert.'
  merge: -1
