    An atomic operation is one which executes in a such a way it cannot be interrupted.
    Single processor instructions are always atomic, at least on single-processor,
    single-core contexts. In general, any operation requiring multiple processor instructions
    is not atomic, but there are ways to make such operations behave as though they
    are atomic. Acquiring a mutex is an example of an operation which must be atomic,
    since partially acquiring it would result in the resource becoming either permanently
    locked or not locked at all.


