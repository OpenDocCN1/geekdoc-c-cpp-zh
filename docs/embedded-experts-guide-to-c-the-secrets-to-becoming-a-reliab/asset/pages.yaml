  md: '# Chapter 11:

    Bootloaders and

    Operating Systems


    Previous chapters have been written assuming the reader is writing standalone
    software – software which runs in what is called a freestanding environment in
    the C Standard – which does not require an operating system to run. While a great
    deal of embedded software falls into this category, it is worth briefly looking
    at software which is not expected to run in this way but instead requires what
    the C Standard refers to as a hosted environment . An operating system provides
    software and hardware management functions, such as task scheduling, IO control
    and memory management. Embedded operating systems are generally lightweight in
    comparison to the more familiar ones found on PCs, servers and other general-purpose
    computers; their design also often prioritises efficiency and determinism over
    extensive functionality and maintainability. ¹ A Real-time Operating System (RTOS)
    is one which has predictable task timing and is therefore well suited to time-critical
    applications.


    Although having an operating system takes embedded programming a step closer to
    more general-purpose programming, it is still important to continue following
    the rules for writing good embedded software – a good operating system will give
    you some protection against some common programming errors, but it is still preferable
    to write good software rather than relying on the environment helping it to recover
    when an error does occur.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Bootloaders


    Another topic which has not so far been addressed is It has been assumed the intended
    application already resides in program memory and it can be run directly. This
    is often the case, but it is also possible for a program to be stored externally
    to program memory and loaded when the system is first activated; this is achieved
    using a bootloader. A more generally, is any program which loads other programs
    into memory so they can run; these are usually included as an essential part of
    most operating systems. Bootloaders are not suitable for all platforms; some microcontrollers
    are unable to support them and in other cases it may not be appropriate because
    of the type of memory or because resources are too constrained.


    The primary benefit of bootloaders is they offer flexibility; the application
    code can be loaded from any source the bootloader understands and if multiple
    possible sources are present it should be possible to choose between them – a
    feature which could be used, for example, to implement both “normal” and “maintenance”
    modes. Furthermore, because the loadable code is not launched directly, it becomes
    possible for programs to be without the need for specialist development tools
    while also, with a well-designed bootloader, mitigating the risks of self-modifying
    code.


    The most basic bootloaders serve no function other than to identify and copy the
    bootable program from its source into program memory before branching to the program
    entry point. Such a bootloader is severely limited; a functional bootloader should
    at least include a means of verifying the integrity of the code it is loading
    and determining which code should be loaded if numerous options are available.
    More advanced bootloaders are also used – the BIOS (basic input/output system)
    found in'
