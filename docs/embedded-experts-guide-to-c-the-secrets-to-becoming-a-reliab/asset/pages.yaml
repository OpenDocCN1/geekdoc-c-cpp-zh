  md: 'queue has a weight or relative priority which determines how many tasks in
    the queue will be scheduled before tasks in the next queue begin to be scheduled.
    For example, a scheduler using three queues may be implemented, with the first
    queue having a weight of 3, the second a weight of 2 and the third a weight of
    1 – three tasks from the first queue could be scheduled, followed by two from
    the second queue and finally a single task from the third queue. As a result of
    the weighted scheduling, tasks in the first, high-priority queue will be allocated
    more overall processor time compared to tasks in the other two


