    # Error detection


    Error detection methods are nothing The simplest method is to use a parity bit
    – a single bit appended to a word that indicates whether an even or odd number
    of ‘1’ bits in the data. This is sufficient to detect a single bit error, or any
    odd numbers of bit errors, but will fail when the number of errors is even. A
    parity bit cannot help in identifying which bit has changed; the data itself could
    even be intact, with the parity bit being in error. The parity bit may be calculated
    from an arbitrary number of bits, although the likelihood of errors going undetected
    increases as the number of bits increases. Despite their limitations, parity bits
    are widely used, particularly in many simple communications protocols.


