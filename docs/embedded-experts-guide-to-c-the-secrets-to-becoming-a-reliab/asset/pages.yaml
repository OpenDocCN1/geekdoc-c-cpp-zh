- pgno: 70
  md: '# Chapter 3:

    Managing Memory


    Memory management for embedded systems differs significantly compared with other
    systems. Embedded systems generally have resource constraints which can cause
    dynamic memory allocation to fail. Although failure may occur as a result of memory
    exhaustion, such failures can also occur without dynamic memory allocation being
    used. Rather, the risk arises as a result of memory fragmentation ; specifically,
    sufficient free memory can be available, but not as a continuous block of the
    required size. This, rather than the risk of memory exhaustion, is the reason
    dynamic memory allocation should be avoided in embedded systems. Assuming the
    system has been designed with sufficient resources, memory allocation is not the
    problem; it is the subsequent freeing of the memory which causes fragmentation.


    There is therefore relatively little memory management to be done in embedded
    systems and this chapter is arguably poorly named. Memory is statically allocated,
    except for variables on the call this ensures usage is deterministic and avoids
    the fragmentation problem. There are, however, times in embedded programming where
    behaviour similar to dynamic memory allocation is required; although this could
    be described as a form of dynamic memory allocation, it should be managed in such
    a way memory allocation is still static. Furthermore, although memory fragmentation
    can still occur, it is handled in such a way so as not to cause the issues seen
    with true dynamic allocation.'
  merge: -1
  img_proc: true
