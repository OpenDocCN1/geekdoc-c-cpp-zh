  md: 'One specific benefit of multitasking is it can be used to eliminate many instances
    of busy waiting from code. Busy waiting (also known as spinning) is a technique
    used to wait for a resource to become available. It will often take the form of
    an empty while loop which continuously checks to see if the required resource
