    to read multiple inputs simultaneously which significantly reduces the code complexity
    associated with them. Sampling is most commonly periodic and driven by a timer
    interrupt, although alternative methods of triggering a sample are possible. Where
    periodic sampling is used, the sampling frequency is primarily determined by the
    bandwidth of the signal being captured; any signal must be sampled at least twice
    the bandwidth of the Oversampling – sampling at a higher frequency than the minimum
    required – is a common practice since it simplifies the design of hardware and
    can be used to increase precision of the samples when used appropriately. Sampling
    which is not periodic may be used when it is important to know the value of an
