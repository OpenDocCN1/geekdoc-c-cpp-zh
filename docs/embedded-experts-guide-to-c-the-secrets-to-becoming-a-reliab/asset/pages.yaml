    others are easily mistyped. The precedence of some operators is inconsistent with
    their mathematical equivalents. It is possible to write statements in C that,
    although perfectly legal as far as the language is concerned, behave very differently
    to what would naturally be expected; because these statements are perfectly legal,
    the compiler may not even issue a warning when they are encountered and they can
