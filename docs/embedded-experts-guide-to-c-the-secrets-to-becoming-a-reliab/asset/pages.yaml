    # Know the operators


    You will often hear you can improve execution speed by carefully selecting the
    operators you use. For instance, multiplication or division by a power of two
    is often claimed to be more efficiently as either a left or right shift, respectively.
    This technique, however, is only valid for unsigned integer types and, at least
    in the case of multiplication, is not guaranteed to result in any increase in
    speed.


    It is worth having at least an idea of the relative performance of the different
    operators. Generally, for integer arithmetic: addition, subtraction and bitwise
    operations will typically perform the fastest, shifts usually have similar performance,
    multiplication will usually, but not necessarily, be slower (this largely depends
    on whether the CPU includes a hardware multiplier) and the division and modulo
    operators will almost invariably be the slowest. For floating point arithmetic,
    multiplication may be marginally faster than both addition and subtraction but
    is likely to have similar performance, and division is much slower.


    For floating point calculations (but not integer ones) it can sometimes be quicker
    to multiply by the reciprocal of a number than to divide directly.'
