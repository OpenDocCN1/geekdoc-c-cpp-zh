    difference with encryption is that the process should be infeasible to reverse
    without access to a valid decryption In modern cryptography, there are two main
    classes of encryption algorithm (ciphers): symmetric key and asymmetric (or public)
    key algorithms. Symmetric key ciphers use the same key for both encryption and
    decryption; asymmetric key ciphers use a pair of keys, only one of which needs
    to remain secret – a public key for encryption and the other private key for decryption;
    the private key may also be used for encryption – this provides no security but
    guarantees the authenticity of the data.


    The benefit of asymmetric key is that they overcome the problem of needing to
    securely share keys; one of the keys can be made public for anyone to use, while
    the other remains private without compromising security. However, they are also
    usually much more computationally expensive to use than symmetric key ciphers
    and are far more reliant on the properties of the key to work securely – the best-known
    asymmetric ciphers require key pairs to be generated by starting with two large
    prime numbers.


    Although asymmetric encryption is an interesting and important topic, it won’t
    be covered here since it is also a specialised area, requiring implementations
    of large integers (thousands of bits long) and an understanding of mathematical
    methods that, although not overly difficult to work with, are beyond the scope
