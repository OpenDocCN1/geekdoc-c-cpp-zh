    a record of resource availability. Crucially, adjusting the record must be “safe”
    in the same way locking and unlocking a mutex must be safe – the adjustment cannot
    be interrupted and the record should remain accurate. A semaphore which only shows
    whether a resource is available or not is known as a binary semaphore and is conceptually
    similar to a mutex. Where multiple copies of a resource are available, a counting
    semaphore is used to track the number of available copies. Semaphores and mutexes
    differ: a mutex controls access to a resource, while a semaphore is used only
    to track its availability.


