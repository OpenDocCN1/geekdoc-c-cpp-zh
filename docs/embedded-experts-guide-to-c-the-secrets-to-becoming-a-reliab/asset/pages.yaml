  md: 'Other lengths of Hamming code are possible. As the code length increases, so
    does the efficiency of the code; a 255-bit Hamming code includes 247 bits of data.
    These longer codes are still only capable of correcting a single-bit error.


    There are also other error correcting codes that offer other improvements – for
    instance, one common implementation of the Reed-Solomon algorithm can transmit
    223 bytes of data for every 255 bytes sent. Reed-Solomon codes are also particularly
    useful for correcting the common problem of burst errors – errors that effect
    several consecutive bits – which repetition and Hamming codes are poorly suited
    for. They are, however, computationally expensive to encode and decode, which
    can limit the maximum possible data-rate on resource-constrained


    To an extent, burst error performance can be improved using a technique known
    as interleaving. This involves re-ordering the data to be transmitted before sending
    so that if a series of errors do occur, their effects are spread through the data
    when the order is corrected on reception. This will not necessarily help in recovering
    the lost data but is a useful technique when either a small amount of loss over
    the entire transmission is acceptable or when the corrupt data can be inferred
    by some other means. There are some disadvantages to interleaving: first, all
    data must be interleaved before transmitting, which introduces some additional
    latency in the transmission, and all data must be received before it can be de-interleaved,
    adding more latency; second, in some cases it may be preferable to have the errors
    localised, rather than spread throughout the data – in this case, interleaving
    is not appropriate.


