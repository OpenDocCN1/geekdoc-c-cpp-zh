    # Working with operating systems: the reality


    Although useful for general purpose programming, the previous section is not especially
    helpful for many embedded operating systems, particularly more resource-constrained
    platforms. The C Standard has very little to say on interacting with operating
    systems and what it does say is almost invariably accompanied by the caveat that
    the behaviour is implementation defined – if the implementation chooses to define
    it at all. Applications on embedded systems are often intended to run indefinitely
    without returning and even when an operating system is present, the prototype
    for main is often still void since there is little, if anything, the operating
    system can do with the returned value and very limited means for providing arguments
    to main. Similarly, such operating systems may not implement any means of storing
    and accessing environment variables or sending and receiving signals. Furthermore,
    many embedded operating systems are designed to be statically linked to the applications
    running on them – the operating system and application are compiled together as
    a single program. Operating system functions are largely available to call from
    the application in the same way as any other function and as a result there is
    relatively little need to communicate indirectly with the operating system.


    Embedded operating systems still provide useful functionality. They typically
    include a scheduler and implement mutexes and semaphores as a minimum and often
    memory management routines will also be provided. Most will also include a Hardware
    Abstraction Layer (HAL); essentially a library of functions which allow software
    to interact with the platform’s'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'hardware without requiring knowledge of how it works. This is arguably beneficial,
    not only in terms of reducing the time and risk involved in writing the necessary
    code yourself, but also for making software more More advanced operating systems
    go further and provide even more complex functionality, such as filesystems and
    inter-process communication.


    Historically, embedded operating systems have mostly also been real-time operating
    systems – they are guaranteed to run tasks according to strict time Despite this,
    there is still relatively little standardisation of how operating systems implement
    these functions, particularly for simpler operating systems, and software written
    to work with one system is unlikely to be easily portable to another. Examples
    of embedded operating systems which behave in a proprietary manner are:


    +   Azure RTOS (previously ThreadX).


    +   FreeRTOS. (and the related),


    +   SAFERTOS and


    +   OPENRTOS.


    There have been some efforts to standardise operating systems, the most successful
    of which is POSIX. This is briefly described in the next section, although operating
    systems which are truly POSIX compliant are relatively rare and somewhat more
    complex than can be supported by smaller embedded systems.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# POSIX


    The histories of the C language and the Unix operating system and thoroughly intertwined;
    they were initially developed almost in parallel and computer scientist Dennis
    Ritchie was heavily involved in both. As computers became more affordable and
    widespread, many new variants of Unix and other Unix-like operating systems emerged;
    this led to efforts to develop a standardised interface for operating systems
    to maintain compatibility between them and ensure portability of programs from
    one operating system to another. This resulted in the IEEE publishing the first
    version of the POSIX (Portable Operating System Interface) standard in 1988. Development
    has continued and the most recent version of the POSIX standard (at the time of
    writing) was in 2017.


    POSIX was developed with C compatibility in mind and the C Standard Library includes
    features to provide compatibility with POSIX. Standard methods are provided for
    creating and managing inter-process messaging, and many other common tasks. A
    number of additional signals are also introduced by POSIX; although these are
    not part of the C Standard they are common across all POSIX operating systems
    so remain relatively portable. Simply, the POSIX allows the C Standard Library
    to be significantly expanded in a way which is portable, provided the target system
    runs a POSIX compliant operating system. This makes POSIX compliant operating
    systems a good choice when deciding which system to use. The unistd.h header file
    provides much of the POSIX API for the C language.


    Although many operating systems are mostly POSIX compliant, relatively few are
    fully certified; those which are include QNX (known for being'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'used in cars and some mobile devices – most notably those from BlackBerry),
    INTEGRITY-178B (notable for its use in aerospace, for having obtained Evaluation
    Assurance and for having allegedly classified, rather than simply closed, source
    code) and newer versions of MacOS. There is far greater choice when considering
    operating systems which are either compliant but not certified, or mostly compliant.
    Most versions of Linux and BSD-descended operating systems fall into this category.


    There is a great deal more which could be said about multitasking, bootloaders
    and operating systems – these are advanced topics somewhat beyond the scope of
    everyday C programming (and, indeed, the C Standard); entire books have been written
    on each of these topics. However, it is important to have an appreciation of all
    three subjects, especially as the distinction between embedded and more general-purpose
    applications becomes increasingly blurred and embedded operating systems grow
    in both size and complexity – in some cases being comparable to their desktop
    counterparts.'
  merge: -1
  img_proc: true
