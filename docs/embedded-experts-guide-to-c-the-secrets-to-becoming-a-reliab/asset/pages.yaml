    # Some thanks are in order:


    It is fitting that Chris Hills agreed to write the foreword to this book. Chris
    attended my first training course as a guest; his contribution on the day was
    remarkable, his feedback and advice has been invaluable. On many occasions he
    has been responsible for highlighting some of the issues the C Language has –
    these are easily missed or forgotten about, so I will share with you the same
    advice Chris shared with me when we first met: use a static analyser.


    My publisher, Ladey Adey, and her team have made this book possible. While the
    words are mine, there is much more to a book - layout, typesetting and aesthetics
    must all be considered. There are also many publishing-specific considerations
    to publishing of which I was blissfully unaware – and probably still would be
    without the help I have received in navigating them. The team have also been remarkably
    patient with me! I naively suggested this book would be drafted within a year.
    It was not.


    Eleanor, my wife, has been patient too. She has tolerated me writing a book when
    I probably should have been making a greater effort to earn some more immediate
    income.'
