    # Naming conventions


    Choosing meaningful function and variable names is an important part of writing
    code that can be easily understood and reviewed. Many programmers use abbreviations
    or truncations, which, although seemingly logical at the time, are easily misunderstood
    later. Furthermore, it is common to use single character names for generic variables,
    such as loop counters. Although such habits are widespread, they are unhelpful
    and usually unnecessary.


    Rather than using the variable name i for a loop counter, for instance, a more
    descriptive variable name such as count or index can be used; there is no performance
    cost in doing so and such names add some context that can make your intentions
    clear. Meaningful names, even for “trivial” variables, are also easier to read
    when reviewing code – when rapidly skimming, it is easy to confuse statements
    such as var = i; and var = as well as being difficult to know at a glance which
    was actually intended. Symbol names may be up to 31 characters long, so it is
    rarely necessary to significantly shorten them. Rather than worrying about keeping
    names short, worry about not allowing them to be too short – a lower limit of
    three characters is a reasonable choice; it is short enough to allow simple names
    for generic variables, but long enough that it forces you to put some thought
    into them.


    There will be times when it is useful to identify certain special characteristics
    of a the most common examples are pointers and globals.'
