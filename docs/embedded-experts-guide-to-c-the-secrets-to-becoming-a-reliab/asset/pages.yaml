    # Pre-emptive multitasking


    The coroutine multitasking we have already discussed is an example of cooperative
    multitasking. The simplicity of cooperative scheduling makes it appealing in applications
    with limited resources and where there is a clear point at which a task can regularly
    yield to the next one, since this step must be explicit and it is undesirable
    for one task to have exclusive use of the processor for too long. This is perfectly
    adequate in many circumstances, particularly where a small number of tasks of
    equal priority are required, but it can be difficult to manually determine an
    appropriate balance between progressing one task and allowing others to progress
    as well.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Pre-emptive multitasking is a much more flexible alternative. A pre-emptive
    scheduler can interrupt tasks in order to allow other tasks to run. This immediately
    frees the programmer from determining the best point in the code at which to yield
    control, immediately solving the problem of one task taking a disproportionate
    amount of processor time in comparison to others. In addition, more advanced pre-emptive
    schedulers can schedule tasks based on their importance.


    One of the better known and easiest to implement scheduling methods is the round-robin
    algorithm. Tasks are allowed to run for a fixed amount of time before execution
    is handed to the next one. Once all tasks have used their allocated time, execution
    returns to the first task – this is known as cyclic processing. The cycle continues
    until all tasks in the queue are complete. If a new task is initiated, it joins
    the back of the task queue. In its simplest form, a round robin scheduler does
    not allow tasks to be ordered by priority, but there are variants which do factor
    in the relative importance of tasks.


    Correctly implemented, a round robin scheduler has the advantage of being starvation
    free: no task is denied access to resources because they are always in use by
    another task. The algorithm is also deterministic – if a task is in the queue,
    it is guaranteed to be allocated some time to run. The major disadvantage of the
    round robin approach is, in its basic form, it does not take account of either
    priority or size of a task – the scheduler always steps through the task queue
    in the same order and allocates the same time for each task regardless of how
    long the task needs to run.


    Considering the round-robin scheduler allows each task to run for a fixed amount
    of time before handing execution to the next task in the list, it seems sensible
    the scheduler should be implemented using a timer interrupt (this is true of many
    other scheduling algorithms as well). The interrupt service routine must determine
    which task should be running and whether the task'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'has already been started. If the scheduler forces a task to yield control,
    then the machine state must be saved – this means all register values, including
    the program counter and stack pointer, must be moved to non-register memory. If
    the next task in the queue has not already been started, the scheduler will need
    to create a new stack frame for the task before calling the entry function for
    the task (the entry function is the equivalent of the main() function for a task).
    If the task has previously been started, the scheduler needs to retrieve the machine
    state from the last time the task yielded from memory and restore it. The process
    of switching between tasks is commonly known as context


    Dealing with a task which ceases execution through a return statement can create
    problems if not handled with care. Without compiler support, the return statement
    will be treated as it would in any other function and the stack may not be correctly
    restored. It is therefore essential to ensure either tasks do not return in the
    traditional sense and instead use a different method to cease execution, which
    is difficult to guarantee in practice without compiler support, or for the scheduler
    to manage stack restoration when tasks do return. The requirement to manipulate
    the stack pointer and program counter directly makes it impossible to write a
    pre-emptive scheduler using only the C Standard Library.


    The round-robin scheduler is not the only possible scheduler you could use. It
    generally performs well on one metric – response time. This is the average time
    between a task arriving in the queue and execution of the task beginning. If we
    consider a different metric, turnaround time – the average time between a task
    arriving in the queue and finishing execution – then performance is generally
    poor. If we wish to improve turnaround time, then an alternative such as a Shortest
    Time-to-completion First (STCF) scheduler is more appropriate. Unlike a round-robin
    scheduler, a STCF scheduler does not regularly switch tasks by default (although
    it must regularly monitor waiting tasks). As the name implies, STCF scheduling
    works by selecting the task which is expected to take the least time to complete
    and runs it first.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Whenever a new task is added to the queue, its expected time to completion
    must be compared to the other tasks, including the running task. Only if the new
    task is expected to take less time to complete than the currently running task
    will the scheduler switch execution to the new task.


    STCF scheduling has the advantage of context switching (which is generally an
    expensive operation in terms of processing time) being reduced compared to round-robin
    scheduling and average turnaround time is improved. However, average response
    time is likely to increase significantly and with a long running time may be repeatedly
    pre-empted in favour of shorter ones. STCF is an example of a dynamic scheduler
    – one which allows task priorities to change after they have been added to the
    task queue. Dynamic schedulers are usually an unsuitable choice for embedded systems
    – they require significant scheduling overhead and are much less deterministic
    than static schedulers. However, the scheduling principle behind STCF – that the
    shortest task should be the first to run – can be used to determine the relative
    priorities of statically scheduled tasks. We shall return to this later.


    Regardless of which scheduler you use, multitasking is not without risk. Sharing
    variables between tasks is not trivial – reads and writes to these shared variables
    must be atomic. Functions which are shared between threads should ideally be reentrant,
    although functions which are restricted to a single thread need not where this
    is not possible, the functions must use some alternative means, such as a mutex,
    to prevent concurrent accesses to shared resources. Most functions in the C Standard
    Library are not guaranteed to be reentrant.


    In most instances it is desirable to allow the scheduler to pause one task and
    pre-empt it with another, otherwise there would be little point in using the scheduler
    at all. However, there are times when a task must not be pre-empted – some parts
    of a task may be deemed critical which must be allowed to run.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'This is the case when accessing global variables, for instance. Ideally, a
    single atomic operation would be used to prevent issues arising from pre-emption,
    but this is not always possible. For instance, if the data to be accessed is a
    structure or array, multiple read or write operations will be required, even if
    the word size of individual members or elements is the same as the processor word
    size.


    In this situation, the easiest way to prevent pre-emption is often to disable
    interrupts. This must be done in a way which does not disrupt future scheduler
    timings, so if it is not possible for the interrupt to remain pending until the
    code has exited the critical section, it may also be necessary to stop the timer
    which drives the scheduler interrupt for the duration of the critical section,
    or to use an alternative workaround mechanism. Merely disabling interrupts does
    not work on multi-processor or multi-core systems, where concurrent access to
    resources will remain possible on many architectures. Furthermore, unless only
    specific interrupts are disabled, then no interrupts may be serviced during the
    critical sections. This may be the intended result, since an interrupt service
    routine could potentially require access to the same shared resources, but as
    a general rule, interrupts should be disabled only when necessary and not merely
    for convenience.


    This is where mutexes and semaphores, concepts introduced earlier in this chapter,
    become important. As has already been mentioned, mutexes and semaphores must be
    implemented in an atomic manner. Many processors include special instructions
    to facilitate this: examples include special test-and-set and compare-and-swap
    instructions. However, these may not be available, particularly if you are not
    using a processor with significant built-in support for multitasking. Careful
    programming and a proven library are crucial to developing multithreaded code
    for accessing shared resources.


