- pgno: 110
  md: '# Chapter 5:

    Interacting with Hardware


    Embedded programming, unlike applications programming, tends to involve a much
    closer coupling between software and hardware. No discussion of embedded programming
    would therefore be complete without also considering how to write code which interacts
    with hardware. Such code is necessarily implementation specific; it requires knowledge
    of the underlying system and the hardware which is available. Unfortunately, this
    means it can only be covered superficially here since a more in-depth discussion
    would necessarily be devoted to a single platform. For general-purpose programming,
    C includes the stdio.h header, which provides functions for reading and writing
    the standard streams (known as stdin, stdout and stderr ) – for most implementations
    these are typically associated with a keyboard and a display – and files. However,
    extending the concept of standard streams to embedded systems is not particularly
    helpful given the wide variations the programmer is likely to encounter. Furthermore,
    the streams themselves are abstractions which require an implementation to make
    them meaningful – this is most often provided by an operating system. It is necessary,
    therefore, for the embedded programmer to be adept at writing software which interacts
    directly with hardware rather than relying on the functionality provided within
    the C language.


    Hardware in embedded systems tends to be fixed – the original specification is
    intended to be suitable throughout the life of the system. This does simplify
    software development somewhat, since drivers do not need to cope with unexpected
    changes or upgrades which could change'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'their functionality. Peripherals for which drivers are required can be broadly
    separated into input, output and combined input/output devices. The names are
    self-explanatory: input devices include peripherals such as keyboards and analogue
    to digital converters; displays and relays are examples of output devices and
    input/output devices include data storage and most communications and networking
    hardware. In the case of microcontroller based systems or system-on-chip platforms
    the peripherals are often included in the same device as the CPU. On more complex
    systems, the peripherals are usually separate hardware. In practice it is usually
    necessary to have at least some hardware which is not integrated.


    Peripherals may be either memory-mapped or port-mapped; memory-mapped peripherals
    are those which can be accessed using the same bus as the CPU uses for memory
    accesses whereas port-mapped peripherals require a separate bus and, at the lowest
    level, special machine code instructions to access. Memory-mapped IO has the advantage
    of being easily accessed using pointers and without the need for any special instructions,
    which requires either inline assembly code or a precompiled library. In addition,
    compiler extensions will often allow the address of a variable to be specified,
    eliminating the need for pointers, and CPU specific header files will often map
    peripherals to a meaningful structure type.


    This chapter shall cover the methods required to interact with memory-mapped IO.
    The application-specific nature of


    port-mapped IO makes it difficult to cover in any meaningful depth. It is also
    not possible to consider every type of hardware you may encounter, so while you
    may find the information here useful, it will still be necessary to adapt it to
    the applications you work with.'
  merge: -1
  img_proc: true
