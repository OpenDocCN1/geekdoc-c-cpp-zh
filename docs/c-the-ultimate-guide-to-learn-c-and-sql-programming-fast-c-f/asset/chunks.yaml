    \n利用编译的程序是由计算机的 CPU 读取的，而不是通过安装在计算机上运行该程序的程序进行解释的。因此，程序更多的是与计算机的处理系统通信，而不是与某个程序。\n\
    \n你可能已经知道这一点，但计算机无法读取字母，必须读取二进制代码，因此代码必须翻译成计算机可读的形式。这个过程被称为编译。现在，面向对象的代码只是代码的结构方式。你将在后面的章节中更好地理解这一小知识。\n\
    \n所以这一切意味着什么，你为什么需要知道它？作为一名使用 C++ 的程序员，你需要的不仅仅是一个普通的文本编辑器。只有少数几种编程语言只需要这些，而它们并不是真正的编程语言。你需要的工具之一是编译器。\n\
    \n你可能想要的另一件事是集成开发环境，也称为 IDE。这是一种面向程序员的文本编辑器，具有语法高亮功能并集成了编译器。对于 Windows 和 Linux，你可以使用不同的选项。\n\
    \n你并不真的需要 IDE，因为一个基础的文本编辑器就可以了，但像记事本这样的工具会让事情变得稍微复杂。文字处理器也是一个糟糕的选择，因为它们有拼写和语法的自动纠正功能，如果不小心，它们会搞乱你的代码。\n\
    \n开始学习 C++ 之前，你应该理解它有一套严格的语法。这意味着代码是大小敏感的，所以输入‘Hello’会和输入‘hello’不同。此外，你应该知道这种编程语言并不在乎空格，所以不用担心它。\n\
    \n以上就是你初学 C++ 时需要知道的全部内容。让我们进入一些实际编码来带你上路吧！\n\n## 第一章 – 你的程序\n![ANd9GcSiYFVzWNtEsPfcM_CSykJhn4tkkH-GCJ4xX-yvN9K3b23DtDU2aQ](img/00010.jpeg)\
    \ 由于这是一份关于如何开始 C++ 的简短教程，我们将在第一章让你从一个程序开始。你的第一个程序将非常简单。你要做的只是在屏幕上写一个短语，但这不像在 Word\
    \ 文档中写那么简单。首先，让我们看看代码，然后我们深入探讨它的含义。\n\n![](img/00011.jpeg)\n\n这一行将告诉编译器它必须为程序链接\
    \ `iostream` 库。库是一个存储代码片段的地方，这些片段被称为函数。库还存储其他东西，如变量和运算符。\n\n`iostream` 库的代码允许你将字符发送到文本流中，然后将其传输到屏幕上。把它想象成一条河流。你是河流的源头，屏幕是海洋。从源头放入河流的任何东西都会出现在屏幕上。\n\
    \n下一行（第二行）让编译器你想你想名为 `std` 的命名空间，这是一个标准命名空间。命名空间是存储代码的区域。\n\n（注：原文此处存在大量重复段落，已根据要求去重，仅保留核心逻辑说明）\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout <<\
    \ \"Hello, World!\" << endl;\n    return 0;\n}\n```\n"
- fmt: '

    It’s easy and simple. A variable name can be anything, but be sure it’s something
    relevant and not something that’s already reserved and means something in C++
    and it doesn’t begin with a number or a special character. You should start with
    a lowercase letter, and end the statement with a semi-colon.


    Line nine in the code above is known as an assignment and assigns a value to the
    variable. The equal sign is the assignment operator, and it is what does the assigning.
    The variable on the left is given the value on the right, and the `=` is a binary
    operator because it has two operands. One to the left and the other to the right.
    The operand on the right doesn’t have to be a value. It can be another variable.
    The left has to be a variable and you can’t change the meaning of the number seven.
    In the example, the integer variable `var` is a value of forty-two.


    You can see the `cout` statement doesn’t have quotations marks around the variable
    name. That’s because you want to output the value of the `var` and not display
    the string ‘var’. If you were compiling the program, it would print ‘42’ because
    that is the value the `var` has. Try changing it to another integer and look at
    the output.


    ![images](images/00016.jpeg)


    Variables also have prefixes that are added to their declaration that changes
    how they act. Some will change the size, and others will not allow negative numbers,
    and others might do something entirely different.


    Now that you know about variables let’s talk about how to expand the program!


    # Chapter Three - Expanding Your Program


    Now that you know how to use variables and how to put them into the program let’s
    take a look how to expand the program. All you really know what to do is use the
    variables and put them into your program, so all you can really do is set the
    output and values of the variable. That isn’t useful when you’re creating a real
    program.


    ![images(2)](images/00017.jpeg)


    What you need is a way to manipulate the variables and receive input from a user.
    So let’s take a look at the next!


    ## iostream Library


    You already know that the `iostream` library is able to output data, but it can
    also obtain input data, too. The command is very like the `cout` statement. The
    command is `cin`. There is one different, though. When you use `cin`, the operator
    after it’s inverted.


    Instead of being `<<`, it’s `>>`. This is confusing to remember in the beginning,
    but you’ll learn it eventually. Note that when you run the program, you’ll need
    to press the enter key after you put in the desired information, like a terminal/cmd
    prompt.


    Take a look at the following program to see the difference between the two.


    ![](images/00018.jpeg)


    Now you can probably see that it’s simple to get the user’s input using the `iostream`
    library, which produces some more useful programs. `iostream` is a lot more powerful,
    though. You can combine many statements into one.


    For example, to put out two strings or variables you would normally need two statements,
    but you can combine many `cout` statements and produce a much shorter code. All
    you have to do is just add another operator for the item you’re outputting or
    inputting.


    For example:


    ![](images/00019.jpeg)


    You can also combine together `cin` statements in the same way you’d receive several
    parts of the input in a row. Enter has to be pressed after each one, and you can’t
    mix input and output on a line of code.


    Now that you know how to combine code and expand your program let’s talk more
    about operators.


    # Chapter Four – Operators


    You’ve learned how to output text, declare a variable and obtain input, but you
    can’t do anything with the variables. Sure, you can give them values, but what
    use is that in the real world? What you really need is a way to manipulate the
    variables without doing hard work. Luckily, the operators will save you!


    You’ve already investigated two operators that are linked to the `iostream` library,
    the input and output or `>>` and `<<`.


    ![images](images/00020.jpeg)


    These operators are able to be put into categorical groups, the first one being
    arithmetic operators. These are `-`, `+`, `/`, and `*`. You would use them exactly
    you would use them in math. For example, this piece of code will add two numbers
    together and display the results.


    ![](images/00021.jpeg)


    Now that you know how to use operators let’s take a look at conditionals!


    # Chapter Five– Conditionals


    It’s great to have a program that does single, linear tasks, like saying ‘Hello’,
    but it’s rare that you’re going to come across for the need of having a program
    that does linear tasks only. Programs usually use something known as conditions,
    or statements that can branch the code into different paths depending on whether
    a condition is true or not. It’s like a fork on the road, basically.


    C++ conditionals have the form of `if` statements. For example, if something is
    true, execute this line of code, if something is false, execute another line of
    code. Take a look at the following code piece as an example.


    ![](images/00022.jpeg)


    Lines one through five should be pretty obvious to you by this point, but line
    three is the one where you may need a little explanation. This is the example
    of the `if` statement. It operates by first taking the matter of the integer variable
