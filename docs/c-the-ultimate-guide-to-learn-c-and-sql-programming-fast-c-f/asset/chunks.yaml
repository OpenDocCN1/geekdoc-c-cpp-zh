    每张表都包含一组列。这些列定义了表中的不同数据项。这使得关系模型与其他类型的数据库有所不同之处。你会注意到，某些数据库将数据完全存储在一起。然而，在关系模型中，所有数据都通过列分隔开，且每一列都有一个名称。每列还可以限制添加到其中的数据类别和大小。例如，某些列只能存储字符串，而某些列只能存储数字。分配给每列的限制取决于数据库的创建者。


    列还被分为“必填”和“非必填”两类。必填列意味着表中的每一行都必须有与该列要求对应的数据。另一方面，非必填列意味着我们可以为该列下的每行指定一个 `NULL`
    值。在你学习 `SQL` 的过程中，你会发现 `NULL` 在数据库编程中有许多用途。


    使用行的主要用点是拥有可检索的数据和存储数据的容器。我们为什么要存储数据？简单是因为我们希望在将来再次获取这些数据，并且只是想给它们提供一个临时存放的地方。这就是数据库的核心思想。


    ## 键 (Keys)


    关系数据库的至关重要的元素之一是键。我们现在知道表有几列，每列都有名称。每列还具有相关的属性。我们可以在列中声明的属性之一就是键。


    在关系数据库中，我们总是为每一行分配一个主键（primary key）。这种特殊类型的键用于唯一地确定某一行。这意味着该键的值必须保持唯一，且在表中不能有任何重复。当且仅当我们的关系模型中存在另一个包含该键的表时，我们可能可以将这两个表合并在一起。


    在合并两个表时，总会有没有重复的主键。合并后，你会注意到表中会出现一个带有这些键的新列。这些键现在被称为 `Foreign keys`（外键）。它们充当通往第二张表主键的链接，允许你方便地连接来自两个分离的表中的行。


    除了主键和外键之外，我们还有自然键（natural keys）。自然键是全局性的。这意味着你不能更改它们，因为它们在全球范围内被用于识别单个实体。例如，出版的书籍总有自然键，即我们所知的
    `ISBN`。每本出版的书都有自己唯一的 `ISBN`，在处理书籍的关系数据库时，你需要将其作为主键。在处理像电子邮件、人员等具有非自然键的数据库时，情况会有不同，你需要为每一行发明自己的主键。


    让我们用一个人员及其联系电话的数据库作为示例。我们不能将姓名视为主键。也不能将人员的电话号码视为主键。这是因为全球可能有两个或多个人具有相同的联系电话、名字，甚至姓氏。因此，我们应该自己创建主键。这就是标识列（identity
    column）派上用场的地方。


    标识列作为一个自动递增列，当我们向表中添加数据时，它会继续生成唯一键。键的组合并不重要，因为我们只需要数据库中每个身份都有一个唯一键。


    ## 第 2 章 – 关系模型示例


    由于我在上一章中使用了人员数据库，现在我将为你提供一个联系人数据库作为关系模型的完美示例。


    一个简单的联系人数据库通常如下：


    | 名字 (First Name) | 姓 (Last Name) | 电子邮件地址 (Email Address) |

    | :--- | :--- | :--- |

    | John | Doe | johndoe@email.com |

    | Mae | Lee | maelee@email.com |


    在此表中，我们有三列在寻找特定的数据。第一列请求名字。第二列请求姓，第三列请求该人的电子邮件地址。


    我们的行（除第一行外）指的是单个实体。我们第一个实体的行指的是名为 John Doe 的人，他的电子邮件是 `johndoe@email.com`。我们第二个实体的行指的是
    Mae Lee，电子邮件地址为 `maelee@email.com`。


    这是一个由三列划分两个实体的数据库示例。


    假设 John Doe 有两个电子邮件地址，而 Mae Lee 有三个。有些人最终会增加列来添加额外数据。因此，表最终会像这样：


    | 名字 (First Name) | 姓 (Last Name) | 邮箱 1 | 邮箱 2 | 邮箱 3 |

    | :--- | :--- | :--- | :--- | :--- |

    | John | Doe | johndoe@... | johndoe2@... | `NULL` |

    | Mae | Lee | maelee@... | maelee2@... | maelee3@... |


    如果我们使用这种数据库设计就会出现问题。首先，如果我们面临的问题是找到每个人有多少个电子邮件地址怎么办？获取我们所需的答案将非常困难且繁琐。这就是使用列基础数据库的缺点。第二个问题是，对于那些只有一个电子邮件地址的人，我们将产生大量的
    `NULL` 值。第三，这种设计是不实际的，你不需要数据库专家也能意识到这一点。


    为了解决这三个问题，我们可以这样做：


    | 键 (Key) | 名字 (First Name) | 姓 (Last Name) |

    | :--- | :--- | :--- |

    | 1 | John | Doe |

    | 2 | Mae | Lee |


    第一步是先为实体创建一个表。在这个表中，我们将第一列分配给主键。第二步是创建另一个表，我们可以存储这些人员电子邮件地址的值。第二个表看起来如下：


    | 键 (Key) | 人员键 (Person’s Key) | 电子邮件地址 (Email Address) |

    | :--- | :--- | :--- |

    | 1 | 1 | johndoe@email.com |

    | 2 | 1 | johndoe2@email.com |

    | 3 | 2 | maelee@email.com |

    | 4 | 2 | maelee2@email.com |

    | 5 | 2 | maelee3@email.com |


    在此表中，你会看到有两个列用于键。第一列引用分配给每个电子邮件地址的主键。第二列引用来自我们第一张表的外键。这是一个一对多关系模型的示例。


    在这个模型中，我们能够以最实际的方式组织数据。现在，我们回答关于每个人有多少个电子邮件的查询也变得更容易了。这种方法被称为 `Normalization`（规范化）。


    设计数据库有许多方法，高效的设计取决于你试图回答的哪些查询。


    说了这么多，你现在准备好接触 `SQL` 了。


    ## 第 3 章 – SQL 语句


    `SQL` 是一种特定的数据库语言。我们使用这种语言来创建语句。这些语句由有效的单词组成。某些单词应该由 `SQL` 定义，而另一些单词应该由你定义。你在这些语句中声明的某些单词是表名、列名以及你表内部变量或数据。


    ### SQL 事实


    在继续之前，我想向你展示一些关于 `SQL` 的重要事实。


    关于 `SQL` 你需要知道的第一点是，它是可读的，因为是用英语编写的。换句话说，学习 `SQL` 比任何其他编程语言都更容易。


    其次是你可以使用 `SQL` 做更多事情。这与大多数人的印象相反，大多数人认为 `SQL` 仅用于数据查询。


    第三是，有效的 `SQL` 语句应该以分号 `;` 结尾。尽管有些人会告诉你它不再需要了，但我建议在你的查询中添加它，因为它是 `ANSI` 标准的一部分。此外，它在旧版和现代数据库中都能正常工作。


    '
- fmt: '

    The fourth is that `SQL` is not case-sensitive. You can put your variables in
    both lower and upper cases. Both ways will work out just fine in the structured
    query language. One good way to practice this is to assert `SQL`-specific keywords
    in uppercases and user-defined keywords in lowercases. This will allow you to
    efficiently and quickly identify the different keywords within a statement.


    ## SQL Commands


    It is important to keep in mind that all `SQL` statements begin with a command.
    The command is typically a verb to signify what the database needs to do. One
    good example of a command used in `SQL` statements is `SELECT`.


    The `SELECT` command tells the database to select a set of data. As you can see,
    it is an English-based word and pretty much obvious of what the system will do.
    This is how the command looks like when used in an `SQL` statement.


    ```

    | SELECT VALUES FROM TABLE; |

    ```


    The example above is a generic example of an `SQL` statement and I will talk about
    it piece by piece later on.


    Take note that the set of values or variables that you need to assert in a statement
    depends upon what command you are trying to execute. All these variables come
    in the statement right after the command.


    ## Naming Values


    As what I have already said, the `SQL` statement is made up of words that are
    within `SQL` specification and user-created names. This means that naming values
    such as keys, table names, columns, and etc. are significant in `SQL`.


    There is no absolute rule in naming things in `SQL`. People have their own ways
    to name variables, but I suggest you follow the method I use in this book for
    the sake of consistency. Here are two naming rules that I will be implementing
    in this book:


    - All table names must be in singular form. (e.g. `person`, `email`, `phone`,
    `user`, etc.)

    - Column names should never be repeated in the database.


    There are some people who prefer to use plural names for their table names. This
    is not wrong. Nevertheless, I am more comfortable when using singular form table
    names. As for the column names, there will always be a time when two or more columns
    from separated tables have the same name. Hence, what I do is to uniquely name
    each column for disambiguation purposes. For instance, instead of using `ID` as
    the column name for primary keys in both the `user` table and `email` table; I
    would rather use the names `user_ID` and `email_ID` for each column.


    You should also take note that names in `SQL` are scoped. This means that the
    database itself must have a name. The tables within the database must have names
    too. The columns inside every table must be named as well. When calling for the
    table, its name must be scoped through the database name with the use of period
    (`.`) to separate the names. Hence, this is how they are going to look like when
    asserted in an `SQL` statement:


    - `Database.Table`

    - `Table.Column`


    ## Creating Data in SQL


    I have no intention to teach you how to create a database from scratch. As beginners,
    your tasks should only circle around adding or updating values to an already existing
    database. However, I have a feeling that some of you still have that eagerness
    to learn `SQL` in order to create the entire application including the database
    itself. And so, I will introduce that part of `SQL`, but just enough to help you
    jumpstart.


    The `SQL` keyword to create a new database is the statement `CREATE DATABASE`
    and this falls under ANSI specification. Let us say you want to create a new database
    for contact numbers of people and you want to name this new database as `Contacts`.
    Here is how you are going to do it.


    ```

    | CREATE DATABASE Contact; |

    ```


    In order for you to work on that database, you need to use it first. The keyword
    we need here is the `USE DATABASE` command. This is how we are going to execute
    it.


    ```

    | USE DATABASEContact; |

    ```


    If you want to create a table inside the `Contact` database, then what you need
    to execute is the `CREATE TABLE` command and here is you do it.


    ```

    | CREATE TABLE Contacts.User (…); |

    ```


    After that, you can now put all column names, types, and definitions.


    ## Data Types


    Data types are important because it follows column restrictions. Each column has
    a rule on which type of data you can store in it.


    Here are some of the major data types and their short descriptions.


    | Data Type | Description |

    | :--- | :--- |

    | `CHARACTER` | Used to define the number of characters allowed in the column.
    No more, no less. |

    | `CHARACTER VARYING` | Used to define the maximum number of characters allowed
    in the column. Can be less but not more than the specific value. |

    | `BINARY` | Used to dedicate the column for hexadecimal data. |

    | `SMALLINT` | Used to store numerical data ranging from -32, 768 to 32, 767.
    |

    | `INTEGER` | Used to store numerical data ranging from -2, 147, 483, 648 to 2,
    147, 483, 647. |

    | `BIGINT` | Used to store numerical data ranging from -9, 223, 372, 036, 854,
    775, 808 to 9, 223, 372, 036, 854, 775, 807. |

    | `BOOLEAN` | Used to store either `TRUE` or `FALSE` values. |

    | `DATE` | Used to store `DAY`, `MONTH`, and `YEAR` in the following format: `YYYY-MM-DD`.
    |

    | `TIME` | Used to store `SECOND`, `MINUTE`, and `HOUR` in the following format:
    `HH:MM:SS`. |

    | `TIMESTAMP` | Used to store both `TIME` and `DATE`. |


    There are other data types supported that you can use for more complex numbers,
    for instance. There is also specific data type for `UNICODE` characters against
    regular characters. Now these are just a few of the flavors that you can use in
    database programming.


    # CHAPTER 4 – Coding in MySQL


    I will teach you how to code SQL database using `MySQL`. Why `MySQL`? First is
    because it is an open-source platform and you can get it for free. Second is because
    it is compatible with all major operating systems: Linux, OSX, and Windows. Third
    is because it features ANSI mode which enforces ANSI specifications to your database.
    Not all RDMs have this kind of feature.


    In this chapter, I will teach you how to efficiently use the `SELECT` command.
    This will allow you to effectively use this command to create interesting and
    efficient data queries.


    ## SELECT Command Anatomy


    You should have learned by now that we have the `SQL` keyword `SELECT` which is
    a command to get specific data from our database. After the `SELECT` keyword,
    what should follow is the list of items we want to have from our database. We
    call it the “select list”. If the select list only contains variables, then you
    can simply write the statement in this manner:


    ```

    | SELECT ‘[Variable]’,’[Variable]’; |

    ```


    Most of the time, the select list contains the names of the columns. When it does,
    it is important to define which table can we find these columns. This is where
    the `FROM` command comes in.


    For instance, our select list contains `User` (column A) and `Email` (column B)
    and we can find these columns inside the table named as `Contact`. In order to
    define which table to look for, we should include the `FROM` command by doing
    this.


    ```

    | Format:SELECT [COLUMN_NAME], [COLUMN_NAME] FROM [TABLE_NAME];Example:SELECTUser,EmailFROMContact;
    |

    ```


    But, what if I have a lot of columns in the table and I want to select all all,
    you ask? Well, this is where the power of the asterisk (`*`) comes in. This is
    known as the wildcard symbol in `SQL` statement. To select all columns inside
    a table, you need to execute a statement in this format.


    ```

    | SELECT* FROM [TABLE_NAME]; |

    ```


    As you can see, the wildcard symbol comes after the `SELECT` command. Now this
    is useful when selecting all the columns. If you do not need to select all the
    columns, then using the wildcard symbol may become dangerous and inefficient.


    There are different ways to quickly assert multiple columns in an `SQL` statement
    depending upon the platform that you are using. I personally recommend that you
    avoid using the wildcard command since the inefficient use of this syntax may
    also break applications.


    FROM Command


    Selecting a single table is fairly easy to write an SQL statement. As you can
    see from previous examples, it only follows a simple format.


    ```

    | FROM [TABLE_NAME] |

    ```

    '
