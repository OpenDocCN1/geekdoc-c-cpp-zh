    | INTEGER | Used to store numerical data ranging from -2, 147, 483, 648 to 2,
    147, 483, 647. |


    | BIGINT | Used to store numerical data ranging from -9, 223, 372, 036, 854, 775,
    808 to 9, 223, 372, 036, 854, 775, 807. |


    | BOOLEAN | Used to store either TRUE or FALSE values. |


    | DATE | Used to store DAY, MONTH, and YEAR in the following format: YYYY-MM-DD.
    |


    | TIME | Used to store SECOND, MINUTE, and HOUR in the following format: HH:MM:SS.
    |


    | TIMESTAMP | Used to store both TIME and DATE. |


    There are other data types supported that you can use for more complex numbers,
    for instance. There is also specific data type for UNICODE characters against
    regular characters. Now these are just a few of the flavors that you can use in
    database programming.


    # CHAPTER 4 – Coding in MySQL


    I will teach you how to code SQL database using MySQL. Why MySQL? First is because
    it is an open-source platform and you can get it for free. Second is because it
    is compatible with all major operating systems: Linux, OSX, and Windows. Third
    is because it features ANSI mode which enforces ANSI specifications to your database.
    Not all RDMs have this kind of feature.


    In this chapter, I will teach you how to efficiently use the SELECT command. This
    will allow you to effectively use this command to create interesting and efficient
    data queries.


    SELECT Command Anatomy


    You should have learned by now that we have the SQL keyword SELECT which is a
    command to get specific data from our database. After the SELECT keyword, what
    should follow is the list of items we want to have from our database. We call
    it the “select list”. If the select list only contains variables, then you can
    simply write the statement in this manner:


    | SELECT ‘[Variable]’,’[Variable]’; |


    Most of the time, the select list contains the names of the columns. When it does,
    it is important to define which table can we find these columns. This is where
    the FROM command comes in.


    For instance, our select list contains User (column A) and Email (column B) and
    we can find these columns inside the table named as Contact. In order to define
    which table to look for, we should include the FROM command by doing this.


    | Format:SELECT [COLUMN_NAME], [COLUMN_NAME] FROM [TABLE_NAME];Example:SELECTUser,EmailFROMContact;
    |


    But, what if I have a lot of columns in the table and I want to select them all,
    you ask? Well, this is where the power of the asterisk (*) comes in. This is known
    as the wildcard symbol in SQL statement. To select all columns inside a table,
    you need to execute a statement in this format.


    | SELECT* FROM [TABLE_NAME]; |


    As you can see, the wildcard symbol comes after the SELECT command. Now this is
    useful when selecting all the columns. If you do not need to select all the columns,
    then using the wildcard symbol may become dangerous and inefficient.


    There are different ways to quickly assert multiple columns in an SQL statement
    depending upon the platform that you are using. I personally recommend that you
    avoid using the wildcard command since the inefficient use of this syntax may
    also break applications.


    FROM Command


    Selecting a single table is fairly easy to write an SQL statement. As you can
    see from previous examples, it only follows a simple format.


    | FROM [TABLE_NAME] |'
