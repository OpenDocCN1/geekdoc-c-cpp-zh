    它实际上有自己的名字。它是一个无限循环，所以会无限循环下去。通过代码，你会得到类似“1 等于 1 吗？是的，相等，打印一个‘a’。”的内容。这会一次一次重复。创建无限循环还有其他方法，但你可能不想创建一个。


    ## Do While 循环


    第二种循环是 `do while` 循环。`do while` 循环看起来如下：


    ![](img/00028.jpeg)


    虽然它看起来与你刚刚看到的标准 `while` 循环不同，但它们几乎是一样的，只有一个区别。`while` 循环会评估条件以判断其是否为真，如果是则运行代码；而
    `do while` 循环会先执行某些代码，然后检查条件是否为真。由于这种机制，无论你为大括号之间的代码初始化 `userInput` 为什么，它都会被执行。


    ## For 循环

    第三种循环是 `for` 循环。这是三种循环中最复杂的，但一旦你理解了它，它就非常强大。现在，我们只需要了解它的用法。看看这个 `for` 循环。


    ![](img/00029.jpeg)


    这段代码告诉程序首先将值 `i` 设置为 2，只要 `i` 小于 10，就将其值输出到屏幕上并递增。你可以轻松地使用 `while` 循环复制这个循环，但它会使用更多的代码，而且非常凌乱。


    你还应该知道，`for` 循环第一行使用的变量必须是同一个变量。你还应该记住，第一个语句不是条件判断，而是一个赋值。当你想要遍历各种数据时，这种循环会非常有用，当你在下一章学习数组时就会看到它。


    ## 第七章 – 数组


    数组是一组组合在一起的变量，因为它们有共同的用途。它们并不真的非要有共同点，但将不相关的东西放在一起并不是一个好主意。这就像向你的文件柜里填满随机纸张而却从不整理它们。如果你打算那样做，你还需要文件柜干什么呢？


    这里是一个整数变量数组的声明。


    ```cpp

    1 int a [5];

    ```


    你可以看到数组看起来像普通变量，但它们末尾有一些方括号。当你声明数组时，括号内将填充你所需要的数组的大小。在这种情况下，你将存储五个整数变量。


    ![images(2)](img/00030.jpeg)


    只要你有足够的 RAM 内存，数组可以是你想要的大小，但它一次只能包含一种类型的变量。变量类型可以是你通常使用的任何类型。


    访问数组中的特定变量是非常简单的。你在方括号中放入你想要的变量数字。所以对于你想要的第一个变量使用 `[0]`，对于第二个使用 `[1]`，依此类推。看一眼下面的示例。


    ![](img/00031.jpeg)


    你不应该做的一件事是访问数组中不存在的变量，例如在一个只有五个位置的数组中访问第十个变量，或者访问没有给其分配变量的变量。如果没有分配变量，你将得到所谓的“垃圾值”（garbage
    value），因为它返回的值是无法使用的。


    如果变量不存在，你可能会得到“段错误”（segmentation fault），因为程序将尝试访问它未被允许访问的内存段。这可能导致程序意外终止。现在你已经知道如何创建数组，让我们来看看如何创建函数！


    ## 第八章 – 函数


    函数是编写复杂程序的好方法，而不需要重复代码。例如，假设你有一段复杂的代码，从用户处获取输入并进行解析。现在，假设你需要运行这段代码几次，但不在循环中运行。在此之前，你每次都必须写一遍。


    ![images(3)](img/00032.jpeg)


    有了现代的复制粘贴，这并不是大问题，但它看起来会很糟糕，而且当你需要修复错误时，重复的代码可能会成为问题。为了解决这个问题，你可以创建函数，函数是你能够反复调用的代码段，而不需要每次都编写。


    实际上，你已经用过函数了。`Main` 就是一个函数。所以，让我们来看看它是如何工作的。


    ![](img/00033.jpeg)


    让我们检查第一行，包含 `main` 单词的行。这开始定义一个不带参数的函数，被称为 `main`，它将返回一个 `int` 类型的值。你已经知道 `int`
    是什么（一种变量类型），但“返回一个值”意味着什么？


    C++ 中的函数就像数学中的函数一样，你输入一个数字并对其进行某些操作，然后得到一个答案。在这里，`int` 是输出函数将要变成的变量。参数是放入函数的变量，函数在返回结果之前会执行操作。


    让我们来看带有 `main` 的函数。


    ![](img/00034.jpeg)


    参数的写法类似于变量定义，并用逗号分隔。它们写在函数名后面，并放在括号内……（关于 `argc` 和 `argv` 的细节）……现在你已经知道什么是函数，让我们来看看指针。


    ## 第九章 – 指针


    RAM 随机访问内存是计算机保存所有变量的地方，但有时自己了解这些转换是好的。考虑一下数组是如何工作的，它们只是长排的变量，其类型由程序员告诉编译器。


    所以你可能认为这就像内存 一样，你是对的。当你标记数组且第五个值实际上是数字六（因为所有数组从零开始），你在第一个变量之后，结合你对整数占 4 个字节的了解，你可以看到数组中的第
    n 个整数将具有这个地址：


    ![](img/0036.jpeg)


    因此，第六元素的地址是 1020。那么这为什么很有用呢？你可以在程序编译和运行时创建数组，并使其具有合适的。


    指针是一个普通变量，但它不存储整数，而是存储另一个变量的地址。这是一个指针。


    ![](img/0037.jpeg)


    在这个指针中，你有一个存储整数地址的变量。`*` 是作为指针的变量，而不是普通变量。你已将其赋值为 0。

