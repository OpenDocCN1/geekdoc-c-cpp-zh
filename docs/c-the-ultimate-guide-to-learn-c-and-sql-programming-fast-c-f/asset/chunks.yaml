    既然你已经了解了它们是什么，让我们在下一章中学习动态内存。


    # 第十章 - 动态内存


    到目前为止，你已经能够在编译时创建变量并在运行时修改它们；然而，当你使用动态内存分配时，你也可以在运行时创建它们。这种方法在程序运行期间对 RAM 进行分配和释放。由于你正在访问
    RAM，推测你将通过指针来操作是理所当然的，但 `C++` 中的动态内存使用方式与 C 语言不同。


    请看以下代码块。


    ![](img/00038.jpeg)


    在这里，你创建了一个指向 `int` 的指针并为它预留了一些内存。由于 `i` 仍然是一个指针而不是变量，你必须将 `i` 所指向的值设置为 5，而不是设置
    `i` 本身。这改变了 `i` 指向的位置，并导致 RAM 中某处预留的内存变成了“孤儿内存”。这种被遗忘的内存被称为内存泄漏。为了防止这种情况，请务必使用
    `delete` 运算符符释放你最初预留的内存。


    ![images(5)](img/00039.jpeg)


    不过，将内存分配到单个变量并没有太大帮助。如果你预先知道变量将会存在，就可以正常地声明它。这种方法的作用是创建在编译时未知的变长数组。但你到底如何可能预知呢？你不能创建一个指针数组并在需要时访问它们，那只是在创建一个巨大的数组并希望一切顺利的基础上，变成了一种更消耗
    RAM 的实现方式了。


    现在你已经知道了什么是动态内存以及如何使用它，让我们在下一章中看看类和对象。


    # 第十一章 - 类与对象


    这实际上是 `C++` 设计的初衷：支持类和对象。没有了它们，`C++` 只是真正的 C 语言。但之前提到的类和对象是什么？类就像一种模具，而对象是从模具中产生的东西。这些模具是灵活的，可以制造你喜欢的任何类型的对象。模具可以是通用的也可以是特定的。


    ![images(5)](img/00040.jpeg)


    假设你想制造一辆汽车。这将是一个抽象的教程，因为代码实际上并没有执行任何操作。思考汽车需要哪些属性。它们需要速度、价格、颜色、制造商和型号。如果是四轮驱动还是不是呢？你能对它做什么？你可以启动引擎和停止它吗？


    让我们来看看汽车外观的类定义。


    ![](img/00041.jpeg) ![](img/00042.jpeg)


    ![](img/00043.jpeg)


    如你所见，类的定义与 `struct` 非常相似，这是很合理的，因为它们都是对数据分组的方法。但这个类包含了一些 `struct` 无法实现的内容：函数。


    # 总结


    到此时，你已经学会了如何创建你的第一个简单程序以及更多内容！你了解了变量是什么、如何扩展程序、如何使用运算符、条件、循环、数组、函数、指针、动态内存以及类和对象，从而将你的程序蜕变为一件杰作！你看，`C++`
    并不像你曾经认为的那么困难，尽管它确实有难度。


    下一步是收集你从书中汲取的知识，并继续阅读更多关于 `C++` 编程奇妙世界的内容。一旦你熟悉了，就搭建一台虚拟机来进行编程并开始吧！你将学习到一种在当今计算机行业中非常有价值的技能。


    感谢阅读。希望你喜欢。我请你留下诚恳的反馈。

    '
