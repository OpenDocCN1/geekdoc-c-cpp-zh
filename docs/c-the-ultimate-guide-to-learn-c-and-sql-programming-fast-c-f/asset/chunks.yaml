    第四点是 `SQL` 是不区分大小写的。你可以将变量写为小写或大写。在结构化查询语言中，两种方式都能正常工作。练习这一点的一种好方法是将 `SQL` 特定的关键字写为大写，用户定义的关键字写为小写。这将允许你高效、快速地识别语句中的不同关键字。


    ## SQL 命令


    请记住，所有的 `SQL` 语句都以一个命令开头。该命令通常是一个动词，表示数据库需要执行的操作。`SQL` 语句中使用的命令的一个很好的例子是 `SELECT`。


    `SELECT` 命令告诉数据库选择一组数据。如你所见，它是一个英语单词，系统将要的操作非常显而易见。这是该命令在 `SQL` 语句中的用法形式：


    ```

    | SELECT VALUES FROM TABLE; |

    ```


    上面的示例是一个 `SQL` 语句的通用示例，稍后我会逐一进行介绍。


    请注意，在语句中需要指定的数值或变量集合取决于你尝试执行的命令。所有这些变量都跟在命令之后。


    ## 命名命名


    正如我所说的，`SQL` 语句由 `SQL` 规范中的单词和用户创建名称组成。这意味着对键、表名、列等值进行命名在 `SQL` 中是非常重要的。


    在 `SQL` 中命名事物没有绝对的规则。人们有自己命名变量的方法，但为了一致性，我建议你遵循我在书中使用的方法。以下是我将在本书中实施的两个命名规则：


    - 所有表名必须是单数形式。（例如：`person`、`email`、`phone`、`user` 等）

    - 列名在数据库中不应重复。


    有些人倾向于使用复数名称作为表名。这并没有错。尽管如此，使用单数形式表名让我感到更舒服。至于列名，总会有来自不同表的两个或多个列具有相同的名称。因此，我的做法是为了消除歧义而为每个列命名唯一的名称。例如，与其在
    `user` 表和 `email` 表中使用 `ID` 作为主键的列名；我宁愿使用 `user_ID` 和 `email_ID` 作为每个列的名字。


    你还应该注意 `SQL` 中的名称是有作用域的。这意味着数据库本身必须有一个名称。数据库内的表也必须有名称。每个表内部的列也必须命名。当调用表时，必须通过点（`.`）使用数据库名来限定其的作用域。因此，它们在
    `SQL` 语句中的表示形式如下：


    - `Database.Table`

    - `Table.Column`


    ## 在 SQL 中创建数据


    我并不打算教你如何从零创建一个数据库。作为初学者，你们的任务应该只围绕向已有的数据库添加或更新值展开。然而，我感觉你们中的某些人仍然渴望学习 `SQL` 以创建包括数据库在内的整个应用程序。因此，我将介绍
    `SQL` 的这部分，但仅足以帮助你快速上手。


    创建新数据库的 `SQL` 关键字语句是 `CREATE DATABASE`，它属于 ANSI 规范。假设你想为人员的联系电话创建一个新数据库，并将此新数据库命名为
    `Contacts`。以下是操作方法：


    ```

    | CREATE DATABASE Contact; |

    ```


    为了能够操作该数据库，你需要首先使用它。我们这里需要的关键字是 `USE DATABASE` 命令。这是我们执行它的方式：


    ```

    | USE DATABASEContact; |

    ```


    如果你想在 `Contact` 数据库中创建一个表，你需要执行的是 `CREATE TABLE` 命令，这里是操作方法：


    ```

    | CREATE TABLE Contacts.User (…); |

    ```


    之后，你现在就可以所有的列名、类型和定义了。


    ## 数据类型


    数据类型很重要，因为它们遵循列的限制。每一列都有关于你可以在其中存储什么类型数据的规则。


    以下是一些主要数据类型及其短描述。


    | 数据类型 | 描述 |

    | :--- | :--- |

    | `CHARACTER` | 用于定义列中允许的字符数。不多也不少。 |

    | `CHARACTER VARYING` | 用于定义列中允许的最大字符数。可以少于但不能超过特定值。 |

    | `BINARY` | 将该列专门用于十六进制数据。 |

    | `SMALLINT` | 用于存储从 -32, 768 到 32, 767 之间的数值数据。 |

    | `INTEGER` | 用于存储从 -2, 147, 483, 648 到 2, 147, 483, 647 之间的数值数据。 |

    | `BIGINT` | 用于存储从 -9, 223, 372, 036, 854, 775, 808 到 9, 223, 372, 036, 854, 775,
    807 之间的数值数据。 |

    | `BOOLEAN` | 用于存储 `TRUE` 或 `FALSE` 值。 |

    | `DATE` | 用于存储 `DAY`、`MONTH` 和 `YEAR`。格式：YYYY-MM-DD。 |

    | `TIME` | 用于存储 `SECOND`、`MINUTE` 和 `HOUR`。格式：HH:MM:SS。 |

    | `TIMESTAMP` | 用于存储 `DATE` 和 `TIME`。格式：YYYY-MM-DD HH:MM:SS。 |

    | `UNICODE` | 用于存储 Unicode 字符。 |


    还有其他你可以在数据库中使用的类型，例如正则字符。


    # 第 4 章 – 在 MySQL 中编码


    我将教你如何使用 `MySQL` 编写 SQL。为什么选择 `MySQL`？第一是因为它是开源平台，你可以免费获取。第二是因为它兼容主要的操作系统：Linux、OSX
    和 Windows。第三是因为它具有 ANSI 模式，适用于所有 RDM。


    在本章中，我将教你如何高效地使用 `SELECT` 命令。这将允许你创建有趣且高效的查询。


    ## SELECT 命令结构


    你现在应该已经了解到我们拥有 `SELECT` 命令，它是从数据库中获取特定数据的命令。在 `SELECT` 关键字之后，应该是我们从数据库中想要的项目列表。我们称之为“选择列表”。如果选择列表只包含变量，你可以按照这种方式编写语句：


    ```

    | SELECT ''[Variable]’,[Variable]’; |

    ```


    大多数情况下，选择列表包含列名。当确实如此，定义我们在哪个表中查找这些列是非常重要的。这就是 `FROM` 命令出现的地方。


    例如，我们的选择列表包含 `User`（列 A）和 `Email`（列 B），我们可以在名为 `Contact` 的表中找到这些列。为了定义要查找的表，我们应该这样做包含
    `FROM` 命令：


    ```

    | 格式:SELECT [COLUMN_NAME], [COLUMN_NAME] FROM [TABLE_NAME];示例:SELECTUser,EmailFROMContact;
    |

    ```


    但是，如果我的表有很多列，我想选择所有的列怎么办？你问。。，这就是星号（`*`）发挥威力的地方。这被称为 `SQL` 语句中的通配符。为了选择表中的所有列，你需要执行如下格式的语句：


    ```

    | SELECT* FROM [TABLE_NAME]; |

    ```


    如你所见，通配符位于 `SELECT` 命令之后。现在这在选择所有列时非常有用。如果你不需要选择所有列，那么使用通配符可能会变得危险且低效。


    FROM 命令


    选择单个表编写 SQL 语句相当简单。如你从之前的示例所示，它遵循一个简单的格式：


    ```

    | FROM [TABLE_NAME] |

    ```

