- md: "\n[content]\nto hide the actual implementation from the outside world. The\
    \ good is for software engineering reasons while another advantage is that an\
    \ implementation module can be compiled separately without needing to recompile\
    \ other modules. Recompilation of other modules is only necessary when a definition\
    \ module is changed. All modules depending on the changed module will be recompiled\
    \ as well. Implementations of functions, graphs and class instances are therefore\
    \ only allowed in implementation modules. They are exported by only specifying\
    \ their type in the definition module. The right-hand side of any type definition\
    \ can remain hidden. In this abstract data type is created (see 5.4).\n\nIn a\
    \ definition module the following global definitions are given in any order.\n\
    \n| DefDefinition | ImportDef // see 2.5 |\n| | FunctionTypeDef // see 3.7 |\n\
    | | MacroDef // see 10.3 |\n| TypeDef // see Chapter 5 |\n| ClassDef // see Chapter\
    \ 6 |\n| TypeClassExportDef // see 6.10 |\n| GenericExportDef // see Chapter 7\
    \ |\n\n- The definitions in an implementation module only have a meaning in the\
    \ module which they are defined (see 2.3) these are exported by putting into the\
    \ corresponding definition module. They also have a meaning in other modules in\
    \ which the definitions are exported (see 2.5).\n\n- In the corresponding implementation\
    \ module all exported definitions have to get an appropriate implementation (this\
    \ holds for functions, abstract data types, class instances).\n\n- An abstract\
    \ data type is exported by specifying the left-hand side of a type in the definition\
    \ module. In the corresponding implementation module the abstract type has to\
    \ be defined but then the right hand has to be defined as well. For such an abstract\
    \ data type only the name of the type is exported not its details.\n\n- A function,\
    \ global graph or class instance is exported by the type header in the definition\
    \ module. For optimal efficiency it is recommended to specifically specify strict\
    \ annotations (see 10.1). For library functions it is recommended to specify the\
    \ uniqueness type attributes (see Chapter 9). The implementation of a function,\
    \ a graph, a class instance has to be given in the corresponding implementation\
    \ module.\n\n- Although it is not required to repeat an exported definition in\
    \ the corresponding implementation module, it is a good habit to do so keep the\
    \ implementation module readable. If a definition is repeated, the definition\
    \ given in the definition module and the implementation module should be the same\
    \ (modulo local variable names).\n\nDefinition module.\n\n```\ndefinition module\
    \ ListOperations\n```\n\n```\n::complex // abstract type definition\nre:: complex\
    \ -> Real number // function taking the real part of complex\nim:: complex ->\
    \ Real complex // function taking the imaginary part of complex\nmkcomplex:: Real\
    \ Real -> Complex // function creating a complex number\n```\n\ncorresponding\
    \ implementation module):\n\n```\nimplementation module ListOperations\n```\n\n\
    ```\n::complex := (!Real,!Real!) // a type synonym\n```\n\n```\ncomplex -> Real\
    \ // type of function followed by its\nre (first,_) = first\n\nim: complex ->\
    \ Real\nim (,_scnd) = scnd\n\nmkcomplex:: Real Real -> Complex\nmcomplex first\
    \ scnd = (first,scnd)\n```\n\n## 2.5 Importing Definitions\n\nVia an import statement\
    \ a definition exported by a module (see 2.4) can be imported into any other (definition\
    \ or implementation) module. There are two kinds of import statements, explicit\
    \ imports and implicit imports.\n\n```\nImportDef = ImplicitImportDef\n      \
    \     | ExplicitImportDef\n```\n\nA module depends on another module if it imports\
    \ something from that other module. CLEAN 2.x cyclic dependencies are allowed.\n\
    \n### 2.5.1 Explicit Imports of Definitions\n\nExplicit imports are statements\
    \ in the modules to import from as well as the identifiers indicating the definitions\
    \ to import are explicitly specified. All identifiers explicitly being imported\
    \ in a definition or implementation will be included in the global scope (= outermost\
    \ scope, see 2.3.2) of the module that does import.\n\n```\nExplicitImportDef\
    \ = from ModuleName import [Imports]-list ;\nImports           = FunctionName\n\
    \                   | : TypeName[ConstructorsOrFields]\n                   | class\
    \ ClassName [Members]\n                   | instance ClassName [TypeName]+\nConstructorsOrFields\
    \ = (ConstructorName)-list\n                      | {..}\n                   \
    \   | {FieldName}-list\nMembers           = {..}\n                   | {MemberName}\n\
    ```\n\nThe syntax and semantics of explicit import statements have been completely\
    \ revised in CLEAN 2.x in order to make it possible to discriminate between the\
    \ different namespaces that exist in CLEAN (see 2.1). One can import functions\
    \ or macros, types with optionally their corresponding constructors, record types\
    \ with their corresponding fieldnames, classes and instances of classes.\n\nExample\
    \ of an implicit import.\n\n```\nimplementation module XXX\n```\n\n```\nfrom m\
    \ import F,\n               :: T1, = T2(..), :: T3(C1, C2), :: T4{..}, :: T5(field1,\n\
    field2),\n               class C1, class C2(..), class C3 (mem1, mem2),\n    \
    \           instance C4 Int\n```\n\nWith the import statement the following definition\
    \ exported by m are imported in module XXX:\n\nfunction or marco, the type T1,\
    \ the algebraic type T2 with all its constructors are exported by m, the algebraic\
    \ type T3 with all its constructors C1 and C2, the record type T4 with all'it\
    \ fields are exported by m, the record type T5 with all its members field1 and\
    \ field2, the class C1, the class C2 with all its members are exported by m, the\
    \ class C3 with all its members mem1 and mem2, the instance of C4 defined in others.\n\
    \nImporting identifiers can cause error messages because the imported identifiers\
    \ may be in conflict with other identifiers belonging to the same name must all\
    \ have different names within the same scope (see 2.1). This problem can be solved\
    \ by renaming the internally defined identifiers or by renaming the imported identifiers\
    \ (eg by adding an additional module layer just to rename).\n\n### 2.5.2 Implicit\
    \ Imports of Definitions\n\n```\nImplicitImportDef = import {ModuleName}-list;\n\
    ```\n\nImplicit imports are operations in which only the module name to import\
    \ from is mentioned. In this case definitions that are exported from that module\
    \ as well as all definitions that are imported in the indicated module and so\
    \ on. all related functions from various modules can be imported with one single\
    \ import. This opens the possibility for definition modules to serve as a kind\
