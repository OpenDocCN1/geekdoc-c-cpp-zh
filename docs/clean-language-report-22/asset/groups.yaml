    \n在语法上，图的定义与函数的定义通过分隔左右侧的符号来区分：图使用 \"=\"，而函数使用 \"->\"。然而，通常情况下，更通用的符号 \"=\" 同时用于这两种定义。通常，从上下文中可以清楚地看出其含义（具有参数、选择器也易于识别）。不过，当是一个简单常量时，该语法是不歧义的（它可以是一个常量函数，也可以是一个常量图）。\n\
    \n全局图与常量函数的定义：biglist1 是一个图，它在每次被应用时只计算一次。\n\n```\nbiglist1 = [1..10000] // 一个常量函数（如果定义在全局）\n\
    biglist2 = [1..10000] // 一个图\nbiglist3 -> [1..10000] // 一个常量函数\n```\n\n图以空间消耗为代价节省执行时间。常量函数以执行时间为代价节省空间。因此，当计算耗时而空间消耗较小时，使用图；在其他情况下使用常量函数。\n\
    \n## 10.3 定义宏\n\n宏是在编译时而非运行时应用的函数（重写规则）。宏可以用于定义函数、创建内联替换、重命名函数以及进行条件编译。通过宏定义，例如可以为常量分配一个名称，使其可以作为函数定义左侧的模式使用。\n\
    \n在编译时，宏定义的右侧将被替换到宏定义作用域内每个宏的应用中。这节省了函数调用并使基本块变得更大（见 Plasmejer and Van Ekelen,\
    \ 1993），从而生成更好的代码。缺点是生成的代码会更多。内联替换也是编译器执行的常规优化之一。为了避免代码爆炸，编译器通常不会替换大型函数。宏提供了手动控制替换过程的语法，以便在效率和代码大小之间获得最佳权衡。\n\
    \n```\nMacroDef          = [MacroFicityDef]\nMacroFicityDef    = (FunctionName)\
    \ [Fix][Prec ;\nDefMacro          = (Variable) := Function Body;\n           \
    \         [LocalFunctionAltDefs]\n```\n\n编译时的替换过程保证终止。为了确保这一点，对宏施加了限制（与普通函数相比）。只允许变量作为形式参数。一个宏由单个分支组成。此外，宏不允许循环直到替换过程终止。\n\
    \n宏定义的示例。\n\n```\nBlack     :: 1   // 宏定义\nWhite     :: 0   // 宏定义\n```\n\n```\n\
    :: Color === Int   // 类型别名定义\n```\n\n```\nInvert: Color -> Color // 函数定义\nInvert\
    \ Black = White\nInvert White = Black\n```\n\n示例：为了列表使用 (a?b) 代替 [a:b] 以及其在函数\
    \ map 中的用法。\n\n```\n(?) infixr 5 // 宏的结合性 (Fixity)\n(?) h t ::= // 运算符的宏定义\n```\n\
    \n```\nmap: (a -> b) [a] -> [b]\nmap f (x?xs) = f x ? map xs\nmap f [] = []\n\
    ```\n\n注意，宏可以包含局部函数定义。这些局部定义（可以是递归的）也可以被内联替换。通过这种复杂的替换，可以实现目标并生成高效的代码。\n\n示例宏可以用于加速频繁使用的函数。例如函数\
    \ foldl 的定义。\n\n```\nfoldl op r 1 ::= foldl r l // 宏定义\nwhere\nfoldl r [] = r\n\
    ```\n\n```\nfoldl r [a:x] = foldl (op r a) x\n\nsum list = foldl (+) 0 list\n\
    ```\n\n在替换宏 foldl 后，编译器将生成一个非常高效的函数 sum：\n\n```\nsum list = foldl 0 list\nwhere\n\
    \  foldl r [] = r\n  foldl r [a:x] = foldl ((+) r a) x\n```\n\n宏的展开发生。这里的类型规范。解构是不可能的。\n\
    \n## 10.4 效率提示\n\n以下是一些如何让你的程序高效的额外建议：\n\n- 使用性能分析器找出哪些消耗了大量空间。\n- 转换递归函数。\n-\
    \ 使用数组代替列表。\n- 尽可能使用严格数据结构。\n- 增加堆空间。\n\n## 11.1 外部导出 (Foreign Export)\n\n可以使用\
    \ foreign export 从 C 调用某些 Clean 函数。满足以下条件时这是可能的：\n\n- 函数已导出。\n- 所有参数都标记为严格的（见\
    \ 3.7.5）。\n- 参数和结果类型属于以下类型之一：\n* Int\n* Real\n* {Char}\n* {Int}\n* {Real}\n* 这些类型的元组（包括元组）。\n\
    \n实现模块中使用以下语法将函数导出到外部语言：\n\n```\nForeignExportDef = foreign export [ call | stdcall\
    \ ] FunctionName;\n```\n\n可以通过在函数名前加上 call 或 stdcall 来指定调用约定。默认是 call。\n\n传递 C\
    \ 类型的参数：\n\n- Int，使用与 Clean 中的 Int 大小相同的 C 整数。在 32 位平台上这是 4 字节，在 64 位平台上是 8 字节。通常\
    \ long 的大小合适，但在 64 位 Windows 上可以使用 __int64。\n- Real，使用 double。\n- {Char}，传递字符串的地址。开头的\
    \ 4 字节（32 位平台）或 8 字节（64 位平台）应包含字符数量。字符串字符存储在后续字节中：字符串被复制到堆中，Clean 使用该副本。\n- {Int}，传递数组的地址。数组元素的大小与\
    \ Clean 中的 Int 相同。元素数量应存储在偏移量 -32（32 位）或 -16（64 位）处的 4 字节。数组被复制到堆中，Clean 使用该副本。\n\
    - {Real}，传递数组的地址。元素的大小与 Clean 中的 Real（8 字节）和 C 中的 double 相同。元素数量应以与 {Int} 相同的方式存储。数组被复制到堆中，Clean\
    \ 使用该副本。\n- 元组。元素按上述描述的方式作为单独参数传递，顺序与元组中的顺序相同。\n\n## 11.2 使用 ABC 指令\n\n该工具可用于生成接口。本文手册未对此讨论。\n\
    \n如何从 C 调用 Clean 函数在第 11.1 节中讨论。\n\n"
