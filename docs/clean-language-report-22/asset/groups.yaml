    \nCLEAN 中使用图的特性使得程序员能够显式地共享项或创建循环结构。通过这种方式，可以获得时间和空间效率。\n\n## 1.2 全局图\n\n由于 CLEAN\
    \ 中存在全局图，特定 CLEAN 程序中的初始图与基本语义略有不同。在特定 CLEAN 程序中，初始图定义为：\n\n```\n@DataRoot = Graph\
