    # 6.8 Shorthand for Defining Overloaded Functions


    A class definition seems sometimes a bit overtone when a class actually consists
    of one member. Special syntax is provided for this case.


    ```

    TypeClassDef = class ClassNameTypeVariable [ClassContext]

    [[where] | {ClassMemberDef}]

    class FunctionNameTypeVariable :: FunctionType;

    class (FunctionName) [Fix][Prec] TypeVariable :: FunctionType;

    ```


    Example of an overloaded function/operator.


    ```

    class (+) infixl 6 a:: a a -> a


    which is shorthand for:

    class + a

    where

    (+) infixl 6:: a a -> a

    ```


    The instantiation of such a single-member class is done in a similar way as with
    ordinary classes, using the name of the overloaded function as class name.


    Example of an instantiation of an overloaded function/operator.


    ```

    instance + Int

    where

    (+) x y = x ^y

    ```


    # 6.9 Classes Defined in Terms of Other Classes


    The definition of a class can optionally specify that other classes that already
    have been defined elsewhere include. The classes to include are specified after
    the overloaded type variable. It is not needed (but it is allowed) to define new
    members in the class body of the new class. In this way one can give a new name
    to a collection of existing classes creating a hierarchy of classes (cyclic dependencies
    are forbidden). Since one and the same can be included in other classes, one can
    combine classes in different kinds of meaningful ways. For an example have a closer
    look at the CLEAN standard library (see StdOverloaded and StdClass)


    Example of defining classes in terms of existing classes. The class Arith consists
    of class + and -.


    ```

    class (+) infixl 6 a:: a a -> a

    class (-) infixl 6 a:: a a -> a

    class Arith a | +,- a

    ```'
