    # 9.5 Combining Uniqueness Typing and Overloading


    An overloaded function actually stands for a collection of real functions. The
    types of these real functions are obtained from the overloaded function by substituting
    the corresponding instance type for the class variable. These instance types may
    contain uniqueness information, and, for the propagation requirement, the aforementionedsubstitution
    might give rise to uniqueness attributes overloaded type specification.


    Consider, for instance, the identity class


    ```

    class id a:: a -> a

    ```


    If we want to define an instance of id for lists, say id L, which leaves uniqueness
    of the list elements intact, the (fully expanded) type of id becomes


    ```

    instance L v:[u:a] -> v:[u:a]

    ```


    However, as said before, the type specification of such an instance is not specified
    completely; it is derived from the overloaded type in combination with the instance
    type (i.e. [...] in this particular example).


    In CLEAN we require that the type specification of an overloaded operator anticipates
    attributes arising from uniqueness propagation, that the uniqueness attribute
    of the class variable should be chosen in a way that for any instance this ‘class
    attribute’ does not conflict with the uniqueness attribute(s) in the fully expanded
    type of this instance. In the above example this means that the type of id becomes


    ```

    class id a:: a -> a

    ```


    Another possibility


    ```

    class id a:: *a -> *a

    ```


    However, the latter version of id will be more restrictive in its use, since it
    will always require that the argument is unique.


