    \ due to a type unification error. It is mentioned that the argument of h2 is\
    \ incompatible with [a] -> Int, but it is not assumed that the argument of h2\
    \ is (A.a: [a] -> Int). The type variable is unified with both Int and Char, which\
    \ gives rise to a type error.\n\n```\nh2: (a) -> Int\nh f = f [1..100] + f ['a..'z']\n\
    ```\n\nStart = h2 length\n\n**Counter Example:** The function h3 is used to apply\
    \ a function to a list of Int as Char. Since no type is specified the type inference\
    \ system will assume f to be of type ([a] -> Int) but not of type A(A.a: [a] ->\
    \ Int). The solution is the same as above and we will again get a type error.\n\
    \n```\nh3 f = f [1..100] + f ['a..'z']\n```\n\nStart = h3 length\n\n- CLEAN cannot\
    \ infer polymorphic functions of Rank 2 automatically! One is obligated to explicitly\
    \ specify universally quantified types of Rank 2.\n- Explicit quantification on\
    \ higher ranks than rank 2 (e.g. quantifiers specified somewhere inside the type\
    \ specification of a function argument) is not allowed.\n- A polymorphic function\
    \ of Rank 2 cannot be used in a way for arguments in which the function is universally\
    \ quantified.\n\n**Examples:** In the example it is shown that f1 can only be\
    \ applied to all its arguments since its last argument is universally quantified.\
    \ The function f2 can be used only with respect to its argument that is not universally\
    \ quantified.\n\n```\nf1:: (A.a:b->b) -> a\nf1 x id = id x\n\nf2:: (A.a:b->b)\
    \ -> a -> a\nf2 id x = id x\n\nillegal1 = f1 // this will raise a type error\n\
    illegal2 = f1 3 // this will raise a type error\nlegall1 :: Int\nlegall1 = f1\
    \ 3 where id x = x // ok\nillegal3 = f2 // this will raise a type error\nlegall2\
    \ :: (a -> a)\nlegall2 = f2 where id x = x // ok\nlegall3 :: Int\nlegall3 = f2\
    \ id 3 where id x = x // ok\n```\n\n## 3.7 Functions with Strict Arguments\n\n\
    In the definition of a function the arguments can optionally be annotated as being\
    \ strict. In reasoning about functions it will always be true that the corresponding\
    \ arguments will be in strong root normal form (see 2 before the rewriting of\
    \ the function takes). In general, strictness information will increase the efficiency\
    \ of execution (see Chapter 10).\n\n```\nFunctionType = Type [ClassContext][UnqTypeEqualities]\n\
    Type         = [BrackType]+\nBrackType    = [UniversalQuantVariables][Strict][UnqTypeAttrib]\
    \ SimpleType\n```\n\nExample of a function with strictness annotations.\n\n```\n\
    Acker:: !Int !Int -> Int\nAcker 0 j = inc j\nAcker i = Acker (dec i) l\nAcker\
    \ i j = Acker (dec i) (Acker i (dec j))\n```\n\nThe CLEAN compiler includes a\
    \ fast and clever strictness analyzer that is based on abstract reduction (Nöcker,\
    \ 1993). The compiler can derive the strictness of the function arguments in many\
    \ cases, such as the example above. When a function is exported from a module\
    \ (see Chapter 2), its type has to be specified in the definition module. To obtain\
    \ optimal efficiency, the programmer should also include the strictness information\
    \ to the type definition in the definition module. One can ask the compiler to\
    \ print out the types with the derived strictness information and paste this into\
    \ the definition module.\n\n- Notice that strictness annotations are only allowed\
    \ at the outermost level of the argument type. Strictness annotations inside type\
    \ instances of arguments are not possible (with exception for some defined types\
    \ like tuples and lists). Any part (of) a data structure can be changed from lazy\
    \ to strict, but this has to be specified in the type definition (see 5.1.5).\n\
    \n## Predefined Types\n\n### 4.1 Basic Types: Int, Real, Char and Bool\n\n###\
    \ 4.4 Arrays\n\n### 4.2 Lists\n\n### 4.5 Predefined Type Constructors\n\n### 4.3\
    \ Tuples\n\n### 4.6 Arrow Types\n\nBasic types like Integers, Booleans, Characters,\
    \ Reals, Lists and Arrays are frequently used that they have been predefined in\
    \ CLEAN for reasons of efficiency and/or convenience. The types and their syntax\
    \ that have been added to inspect to (via pattern matching) objects of these types\
    \ are treated in this chapter.\n\n```\nPredefinedType = BasicType // see 4.1\n\
    \             = ListType // see 4.2\n             = TupleType // see 4.3\n   \
    \          = ArrayType // see 4.4\n             = ArrowType // see 4.6\n     \
    \        = PredefinedAbstractType // see 4.7\n```\n\nIn Chapter 5 we will explain\
    \ how new types can be defined.\n\n## 4.1 Basic Types: Int, Real and Bool\n\n\
    Basic types are algebraic types (see 5.1) which are predefined for reasons of\
    \ efficiency and convenience: Int (for 32 bit integer value), Real (for 64 bit\
    \ double precision floating point value), Char (for 8 bit ASCII value) and Bool\
    \ (for 8 bit boolean values). Programming convenience syntax is introduced to\
    \ denote constant values (constructors of these predefined types). There is also\
    \ a special notation to denote a string (an unbounded array of characters), as\
    \ well as denote a list of characters (see 4.2).\n\n```\nBasicType = Int // see\
    \ StdInt.dcl\n           = Real // see StdReal.dcl\n           = Char // see StdChar.dcl\n\
    \           = Bool // see StdBool.dcl\n```\n\n### 4.1.1 Constants of Basic Type\n\
    \nIn a constant value of basic type can be created.\n\n```\nBasicValue = IntDenotation\n\
    \            = RealDenotation\n            = BoolDenotation\n            = CharDenotation\n\
    \nIntDenotation = [Sign][Digit]+ // decimal number\n              = [Sign][OctDigit]+\
    \ // octal number\n              = [Sign][HexDigit]+ // hexadecimal number\nRealDenotation\
    \ = [Sign][Digit]+\nBoolDenotation = {Digit}+\nCharDenotation = {AnyChar}+\n```\n\
    \n### 4.1.2 Patterns of Basic Type\n\nA constant value of predefined type Int,\
    \ Real, Bool or Char (see 4.1) can be specified as pattern.\n\nBasicValuePattern\
    \ = BasicValue\n\nThe decoration of such a value must obey the syntactic description\
    \ above.\n\nUse of integers in a pattern:\n\n```\nfib:: Int -> Int\nfib 0 = 1\n\
    fib 1 = 1\nfib n = 1 + fib (n-2) * fib\n```\n\n## 4.2 Lists\n\nA list is an algebraic\
    \ type defined for programming convenience. A list can contain an infinite number\
    \ of elements. All elements must be of the same type. Lists are very often used\
    \ in functional languages and therefore the syntactic sugar is provided for the\
    \ creation and manipulation of lists (dot-expressions, list comprehensions) while\
    \ there is also special syntax for a list of characters.\n\nLists can be lazy\
    \ (default), and optionally be defined as head strict, spine strict, strict (both\
    \ head and spine), head strict unboxed, and strict unboxed. Lazy, strict and unboxed\
    \ lists are all of different type. All these different types of lists have different\
    \ time and space properties (see 10.1.3). Because these are of different type,\
    \ conversion functions are needed to change e.g. a lazy list to a strict list.\
    \ Functions defined on one type of list are not capable of append to another type\
    \ of list. However, one can define overloaded functions that can be used on any\
    \ list: lazy, strict as well as unboxed lists.\n\n```\nListType = [[ListKind]\
    \ Type [SpineStrictness]]\nListKind // head strict list\n // head strict, unboxed\
    \ list\nSpineStrictness // tail (spine) strict list\n```\n\n- All elements of\
    \ a list must be of the same type.\n\n### 4.2.1 Creating Lists\n\nBecause lists\
    \ are very convenient and frequently used data structures, there are several syntactical\
    \ constructs in CLEAN for creating lists, including dot expression and ZF-expressions.\
    \ Since CLEAN is a lazy functional language, the default list in CLEAN is a lazy\
    \ list. However, in some cases strict lists, spine strict lists and unboxed lists\
    \ can be more convenient and more efficient.\n\n```\nList = ListDenotation\nDotexpression\n\
    ZF-expression\n```\n\n- All elements of a list must be of the same type.\n\n##\
    \ Lazy Lists\n\n```\nListDenotation = [[ListKind] [[GraphExpr]-list : [GraphExpr]]\
    \ [SpineStrictness]]\nLGraphExpr = GraphExpr\nCharsDenotation CharsDenotation\n\
    ```\n\n```\nCharsDenotation Char = Char Char (AnyChar/~Char)+ Char\n```\n\nOne\
    \ way to create a list is by explicit enumeration of the list elements. Lists\
    \ are constructed by adding one or more elements to an existing list.\n\nVarious\
    \ to define a lazy list with the integer elements 1,3,5,7,9.\n\n```\n[1:3:[5:7:[9:[]]]]\n\
    [1:3:5:7:9:[]]\n[1,3,5,7,9]\n[1:[3,5,7,9]]\n[1,3::[7,9]]\n```\n\nA special notation\
    \ is provided for the frequently used list of characters.\n\nVarious ways to define\
    \ a lazy list with the characters 'a', 'b' and 'c'.\n\n```\n['a':['b':['c']]]\n\
    ['a','b','c']\n['abc']\n['ab','c']\n```\n\nExample of denotations.\n\n| Type |\
    \ Denotation |\n| :--- | :--- |\n| Integer (decimal) | 0|1|2|...|9|10 |\n| Integer\
    \ (octal) | 00|01|02|...|07|10|02 |\n| Integer (hexadecimal) | 0x0|0x1|0x2|...|0x8|0x9|0xB|0x1|0x2\
    \ |\n| Real | 0.0|1.5|...|3.14E10 |\n| Boolean | True False |\n| Character | 'a'|'b'|...'|A'|'B'|...\
    \ |\n| String | \"\"...\"Rinus\"|\"Marko\"|... |\n| List of characters | ['Rinus']|['Marko']|...\
    \ |\n"
