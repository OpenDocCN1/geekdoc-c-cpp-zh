    # 10.1.4 Time Consumption in Strict and Lazy Context


    Strict arguments of functions can sometimes be handled much more efficiently than
    lazy arguments, in particular when the arguments are of basic type.


    Example: functions with strict arguments of basic type are more efficient.


    ```

    Ackermann:: !Int !Int -> Int

    Ackermann j = j+1

    Ackermann i 0 = Ackermann (i-1) 1

    Ackermann i j = Ackermann (i-1) (j-1)

    ```


    The computation of a lazy version of Ackermann 3 takes 14.8 seconds + 0.1 seconds
    for garbage collection on an old MacII (5mb heap). When both arguments are annotated
    as strict (which in this case will be done automatically by the compiler) the
    calculation will take 1.5 seconds + 0.0 seconds garbage collection. The gain is
    one of magnitude. Instead of rewriting graphs the calculation is performed using
    stacks and registers where possible. The speed is comparable with a recursive
    call in highly optimised C or with the speed when the function was programmed
    directly in assembly.


