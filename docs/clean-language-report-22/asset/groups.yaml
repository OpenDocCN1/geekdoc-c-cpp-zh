    \n```\nStart:: Int\nStart = 2 + more\nwhere\nmore:: Int\nmore = 3 + 4\n```\n\n\
    ## 6.7 Defining Derived Members in a Class\n\nThe members of a class consist of\
    \ a set of functions or operators that logically belong to each other. It is often\
    \ the case that the effect of some members (derived members) can be expressed\
    \ in others. For instance, <> can be regarded as synonym for not (=). For software\
    \ engineering (the fixed relation is made explicit) and efficiency (one does not\
    \ need to include such derived members in the dictionary record) are used for\
    \ good to make this relation explicit. CLEAN the existing macro facilities (see\
    \ Chapter 10.3) are used for this purpose.\n\nClasses with macro definitions to\
    \ specify derived members.\n\n```\nclass Eq a\nwhere\n  (=) infix 2 :: a -> Bool\n\
