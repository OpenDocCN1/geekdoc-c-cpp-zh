    \ (chars,file2)\nwhere\n  (ok,file1) = *\n  (chars,file2) = freadc file\n```\n\
    \nchars,file2 = readchars file\n\nThis explicit naming of threaded parameters\
    \ not only looks ugly, these kind of definitions are sometimes also hard to read\
    \ as well (in which order do things happen? which state is passed in when?) We\
    \ have to admit: an imperative style of programming is easier to read when things\
    \ happen in a certain order such as the case when doing I/O. That is why we have\
    \ introduced *let-before* expressions.\n\nLet-before expressions are special expressions\
    \ that can be defined before a guard or function body. One way one can define\
    \ sequential actions in the order in which they suppose to happen. *Let-before*\
    \ expressions have the following syntax:\n\n```\nLetBeforeExpression = # (GraphDef)+\n\
    \                    | # !(GraphDef+)\n```\n\nThe form with the exclamation mark\
    \ (#!) forces the evaluation of the node-ids that appear in the left-hand sides\
    \ of the definitions. Note that one can only define constant selectors (GraphDef)\
    \ in a Let-before expression. One cannot define functions.\n\nLet-before expressions\
    \ have a special scope rule to obtain an imperative looking look. Variables in\
    \ the left-hand side of these definitions do not appear in the scope of the right-hand\
    \ side of that definition, but they appear in the scope of the other definitions\
    \ that follow (including the root expression, excluding local definitions in blocks).\n\
    \nThis is shown in the following picture:\n\n```clean\nFunction args\n# selector1\
    \ = expression1\n  guard1 = expression2\n  selector2 = expression3\n  guard2 =\
    \ expression4\nwhere\n  local_definitions\n```\n\nNotice that a variable defined\
    \ in a let-before expression cannot be used in a where expression. The reverse\
    \ is true however: definitions in the where expression can be used in the let-before\
    \ expression.\n\nUse let-before expressions, short notation, re-using names up\
    \ to the special scope of the let before)\n\n```clean\nreadchars::*File -> ([Char],\
    \ *File)\nreadchars file\n# (ok,char,file) = fread file\n# not ok = ([],file)\n\
    # (chars,file) = readchars file\n((char:chars), file)\n```\n\nEquivalent definition\
    \ renaming threaded parameters\n\n```clean\nreadchars::*File -> ([Char], *File)\n\
    readchars file\n# (ok,char,file1) = fread file\n# not ok = ([],file1)\n# (chars,file2)\
    \ = readchars file1\n((char:chars), file2)\n```\n\nThis notation can also be dangerous:\
    \ the same name is used on different spots while the meaning of the name is not\
    \ the same (one has to take the scope into account which changes from definition\
    \ to definition). However, the notation is rather safer when it is used to thread\
    \ parameters of unique type. The type system will spill when such parameters are\
    \ not used in a correct threaded manner. We do not recommend the use of let expressions\
    \ to adopt an imperative programming style for other cases.\n\nAbuse of let before\
    \ expression.\n\n```clean\nexchange: (a, b) -> (b, a)\nexchange (x, y)\n# temp\
    \ = x\nx = y\ny = temp\n(x, y)\n```\n\n## 3.6 Defining Constants\n\nOne can give\
    \ a name to a constant expression (actually a graph), such that the expression\
