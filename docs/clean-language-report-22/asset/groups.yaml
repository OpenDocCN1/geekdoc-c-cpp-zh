    In the generic definition, recognised by the keyword generic, the first type of
    the generic function has to be specified. The type variables mentioned after the
    generic function name are called generic type variables. Similar to types, these
    are substituted by the actual instance type. A generic function defines a set
    of type constructors. There is one class for each possible kind in the set. Such
    a generic function is sometimes called a kind-indexed class. The classes generated
    by the generic function always have one class variable, even if the generic function
    has generic variables. The reason for this is that the generic function can be
    defined by only one argument.


    ```

    Classes that are automatically generated for the generic function map given above.

    class Map|*| t              :: t -> t

    class Map(*->*) t              :: (a -> b) (t a) -> t b

    class Map(*->->*) t            :: (al -> b1) (a2 -> b2) -> t b1 b2

    ```


    Roughly the algorithm for deriving classes is the following.

    Suppose we have a generic function genFun with type Gen.


    ```

    :: GenFun al an ::= :=\n   Generic genFun al an  :: al : an  :: GenFun al .. an

    ```


    A class for kind k.


    ```

    class genFun{|k} t      :: GenFun{|k} t .. t

    ```


    Is derived by the induction of structure kind


    ```

    :: GenFun|*| al an ::= :: GenFun al .. an

    :: GenFun(k->l) al an ::= :=\nn   A.bl bn : ::**| (GenFun|k| b1 bn) -> GenFun|l|
    (al b1) ... (an bn)

