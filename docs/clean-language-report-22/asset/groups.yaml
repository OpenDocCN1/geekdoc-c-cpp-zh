    \ | :--- | :--- | :--- |\n| | k | l | m | n | o | p | q | r | s | t |\n| 大写字母\
    \ = a | b | c | d | e | f | g | h | i | j |\n| | k | l | m | n | o | p | q | r\
    \ | s | t |\n| 特殊字符 = u | v | w | x | y | z |\n| | | | | | | | | | | |\n\n使用的规范是变量始终以小写字母开头，而构造函数和类型以大写字母开头。其他标识符可以从特殊字符定义（如\
    \ +, <，见附录 A）。这两类标识符不能混合使用。这使得诸如 `a+1`（等同于 `a +1`）的表达式可以省略空格。\n\n## 2.2 作用域的嵌套\n\
