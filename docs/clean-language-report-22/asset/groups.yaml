    \ []\n\n(-) infixl 6:: [a] -> [a] | Arith a\n(-) [x:xs] [y:ys] = [x - y:xs]\n\
    (-) [] = []\n```\n\nEquality class.\n\n```\nclass Eq a\nwhere\n(=) infix 2:: a\
    \ -> a -> Bool\ninstance Eq [a] | Eq a // on lists\nwhere\n(=) infix 2:: [a] [a]\
    \ -> Bool | Eq a\n(=) [x:xs] [y:ys] = x == y && xs == ys\n(=) [] = True\n(=) []\
    \ = False\n```\n\n## 6.4 Type Constructor Classes\n\nThe CLEAN type system offers\
    \ the possibility to use higher order types (see 3.7.1). This makes it to define\
    \ type constructor classes (similar to constructor classes as defined in Gofer,\
    \ Jones (1993)). In case the overloaded type variable of the type class is not\
    \ of kind x, but of higher order, e.g. X -> X -> X etc. This offers the possibility\
    \ to define overloaded functions that can be instantiated with type constructors\
    \ of higher order (as usual, the overloaded variable and a complex instantiation\
    \ of this type variable need to be of the same kind). This makes it possible to\
    \ overload more complex functions like map and like.\n\nExample of a definition\
    \ of a type constructor class. The class Functor including the overloaded map\
    \ function which varies in type f of kind X -> X.\n\n```\nclass Functor f\nwhere\n\
    map:: (a -> b) (f a) -> (f b)\n```\n\nExample of an instantiation of a type constructor\
    \ class. An instantiation of the well-known function map on lists ([ is of kind\
    \ X -> X), and a map function defined on Tree's Tree (Tree is of kind X -> X).\n\
    \n```\ninstance Functor []\nwhere\nmap:: (a -> b) [a] -> [b]\nmap f [x:xs] = f\
    \ x : map f xs\nmap f [] =\n```\n\n```\n::Tree a = (/\\ infix 0 (Tree a) (Tree\
    \ a)\n    | Leaf a\n```\n\n```\ninstance Functor Tree\nwhere\nmap:: (a -> b) (Tree\
    \ a) -> (Tree b)\nmap f (l/r a) = map f l \\/ map f r\nmap f (Leaf a) = Leaf (f\
    \ a)\n```\n\nCLEAN 2.0 offers the possibility to define generic functions. With\
    \ generic functions one is able to define a function like map works for any type\
    \ (see...).\n\n## 6.5 Overlapping Instances\n\nIdentical instances of the same\
    \ class are not allowed. The compiler would not know instance to choose. However,\
    \ it is not required that all instances of different type. It is allowed to specify\
    \ an instance of a class which overlap with some other instance given for class,\
    \ i.e. the types of different class instances are different but can be unified\
    \ with each other. This is allowed to specify an instance that works for any type,\
    \ by instantiating with a variable instead of instantiating with a concrete type.\
    \ This can be handy to define a simple default case (see also generic). If more\
    \ than one instance is applicable, the compiler will always choose the most specific.\n\
    \nExample of overlapping instances. Below are three instances for Eq: one for\
    \ Integer, one for Real values, and one of any type. The latter is more general\
    \ and overlaps with the other instances. If Integers or Reels are compared, the\
    \ corresponding equality function will be chosen.\n\n```\nclass Eq a\nwhere\n\
    (=) infix 2 :: a -> Bool\n```\n\n```\ninstance Eq Int // on Integers\nwhere\n\
    (=) x y = x == y\n```\n\n```\ninstance Eq Real // on Reals\nwhere\n(=) x y = x\
    \ == y\n```\n\n```\ninstance Eq a // generic instance for Eq\nwhere (=) x y =\
    \ False\n```\n\nIt is sometimes unclear which instance is the most specific. In\
    \ this case the lexicographical order is chosen using the instance (with type\
    \ constructors). The two instances overlap with each other. In any case the function\
    \ is applied to two Boolean values, the compiler will choose the first instance.\n\
    \n```\nclass C a1 a2\nwhere f:: a1 a2 -> Bool\n```\n\n```\ninstance C Bool\nwhere\
    \ f x = b\n```\n\n```\ninstance C Bool\nwhere f x = b\n```\n\n```\nStart = f True\
    \ // the result will yield True\n```\n\n## 6.6 Instance Overloading\n\nIt is possible\
    \ that a CLEAN expression using overloaded functions is internally ambiguously\
    \ overloaded. The problem can occur when an overloaded function which has overloaded\
    \ type appears on the right-hand side. If such a function is applied in such way\
    \ that the overloaded type does not appear in the resulting type of the application,\
    \ any of the instances of the overloaded function can be used. In that case an\
    \ overloaded function is internally ambiguously overloaded the compiler cannot\
    \ determine instance to take: type error.\n\nCounter example (ambiguous overloaded\
    \ expression). The function body of f is internally overloaded which results in\
    \ a type error. It is not possible to determine whether its argument is an Int\
    \ or Bool.\n\n```\nclass Read a -> String\n```\n\n```\nclass Write a -> a\n```\n\
    \n```\ninstance Read Int, Bool // export of class instance, see 6.10\n```\n\n\
    ```\ninstance Write Int, Bool\n```\n\n```\nf:: String -> String // This results\
    \ in a type error (Read x\n```\n\nOne can solve such an ambiguity by splitting\
    \ the expression in parts that are typed explicitly such that it becomes clear\
    \ of the instances should be used.\n\n```\nf: String -> String\nf x = Write (MyRead\
    \ x)\nwhere\nMyRead:: Int -> String\nMyRead x = Read x\n```\n\nCounter example\
    \ (ambiguous overloaded expression). The function + is internallyously overloaded\
    \ which results in a type error. The compiler is not able to infer the result\
    \ type of the multiple parameter class Arith a b c. The reason is that the compiler\
    \ will first do the type unification and then try to solve the overloading. In\
    \ this case solving the overloading will have consequences for other situations.\
