    \ T 中，因为该类型无法与 `A.a:a -> a` 统一。\n\n```\n:: T = C (A:b) b -> b\nf:: (T b) -> (Int,Char)\n\
    f (C g) = (g l, g 'a')\n\nId::a -> a\nId x = x\n\nStart = f (C2 Ids)\n```\n\n\
    ## 5.1.5 类型定义中的严格标记\n\n使用严格性数据结构而不是惰性数据结构，函数式程序的运行效率会高得多。如果你的程序的任务之一是将惰性数据结构转换为严格性结构，这必须在类型的定义中手动完成。\n\
    \n```\nAlgebraicTypeDef      = ::TypeLhs            = ConstructorDef\n       \
    \                       || {ConstructorDef};\nConstructorDef        = [ExistentialQuantVariables]ConstructorName\
    \ {BracketType]\n                              ExistentialQuantVariables](ConstructorName)\
    \ [Fix][Prec] {BracketType}\nStrict                 !\n```\n\n在构造函数的定义（在代数数据类型或记录类型）中，数据构造函数的参数可以被标记为严格。因此，某些参数可以定义为严格，而另一些参数可以定义为惰性。对此类类型对象的推理始终是：当检查对象时，被标记的参数处于强范式（strong\
    \ normal form）。每当在严格环境中创建新对象时，编译器将处理评估。如果在惰性环境中创建了新对象，编译器将插入代码，每当该对象放入严格环境中时都会处理评估。如果在某个参数中创建了数据结构，是否不定义此类数据结构的无限实例以避免不终止会更好？\n\
    \n因此，在类型定义中，可以定义一个数据构造函数在其零或多个参数上是严格的。严格性是数据结构的一个属性，在它的类型中指定。\n\n- 通常情况下（元组除外），不能任意混合严格和非严格数据结构，因为它们被认为是不同的类型。\n\
    \n当一个带有严格标记的参数处于严格环境中，而该参数是根据其他严格标记的数据结构定义的时，后者也处于严格环境中，因此被求值。因此，可以根据需要将 CLEAN\
    \ 的默认语义更改为（超）严格语义。系统将检查类型的复杂度并确保严格性的维持。\n\n没有显式符号来创建代数数据类型的未拆箱（unboxed）版本。编译器将为给定的类型选择最有效的表示方法。对于包含基础类型严格元素、记录和数组类型的数据类型定义，将选择未拆箱表示。\n\
    \n示例：Point 定义中的两个整数值都是严格的，由于它们已知是基本类型，将以未拆箱形式存储。存储在 MyPoint 中的整数值也是严格的，但由于 MyTuple\
    \ 是多态的，它们将以未拆箱形式存储。\n\n```\n::Point = (!Int,!Int)\n```\n\n```\n::MyTuple a = Pair\
    \ !a a\n```\n\n```\n::MyPoint = MyTuple Int\n```\n\n类似于类型 `[a]` 的用户定义惰性列表可以在代数类型定义中如下定义：\n\
    \n```\n::LazyList a = LazyCons a (LazyList a)\n             | LazyNil\n```\n\n\
    类似于类型 `![a]` 的头部严格列表可以在代数类型定义中如下定义：\n\n```\n::HeadList a = HeadCons !a (HeadList\
    \ a)\n             | HeadNil\n```\n\n类似于类型 `![a]` 的尾部严格列表可以在代数类型定义中如下定义：\n\n```\n\
    ::TailList a = TailCons a !(TailList a)\n             | TailNil\n```\n\n类似于类型\
    \ `![a]` 的严格列表可以在代数类型定义中如下定义：\n\n```\n::StrictList a = StrictCons !a !(StrictList\
    \ a)\n             | StrictNil\n```\n\n类似于类型 `[#Int]` 的未拆箱列表可以在代数类型定义中如下定义：\n\n\
    ```\n::UnboxedList = UnboxedList !Int\n               | UnboxedList\n```\n\n##\
    \ 5.1.6 代数类型的语义限制\n\n代数类型的其他语义限制：\n\n- 类型的名称必须与同一作用域内的其他名称不同。\n- 右侧使用的所有类型变量都是绑定的，即必须在左侧或通过右侧指定的通用量化符绑定。\n\
    - 数据构造函数只能在同一作用域和命名空间内定义。\n- 当在位置位置数据构造函数时，两个参数都必须存在。构造函数可以使用曲线方式，但此时它们作为前缀构造函数使用。\n\
    - 代数类型定义的右侧应产生一个种类（kind），所有定义的构造函数参数也应该是该种类。\n- 代数类型中的存在量化类型变量在创建数据结构时只能实例化为具体类型（而不是变量）。\n\
    \n## 5.2 定义记录类型\n\n记录类型基本上是一个定义了一个构造函数的代数数据类型。记录的特殊之处在于，构造函数的每个参数都关联了一个字段名，并且记录不能使用曲线方式。\n\
    \n与普通的代数数据结构相比，记录的使用提供了大量的符号便利性，因为字段名允许按位置选择。创建记录时，构造函数的所有参数必须定义，但可以任意顺序指定参数。此外，当对记录进行模式匹配时，必须提到你感兴趣的字段（参见\
    \ 5.2.2）。记录可以通过函数更新创建（参见 5.2.1）。在这种情况下，必须为那些与旧值不同的字段指定值。\n\n存在类型和通用类型（参见 5.1.3\
    \ 和 5.1.4）允许在记录类型中使用（如任何其他类型中）。构造函数的参数可以可选地标记为严格（参见 10.1）。第 9 章处理的唯一性属性。\n\n```\n\
    RecordTypeDef = TypeLhs = [ExistentialQuantVariables] [Strict] {[FieldName ::\
    \ [Strict Type]-list} ;\n```\n\n作为记录类型名称的数据构造函数。\n\n- 适用于代数数据类型的语义限制适用于记录类型。每个记录内部的字段名必须不同。允许在不同的记录中使用相同的字段名。如果在不同的记录中使用了相同的名称，可以显式地指定预期的\n\
    \n"
