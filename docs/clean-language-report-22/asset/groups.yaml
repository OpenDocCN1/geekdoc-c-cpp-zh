    to hide the actual implementation from the outside world. The good is for software
    engineering reasons while another advantage is that an implementation module can
    be compiled separately without needing to recompile other modules. Recompilation
    of other modules is only necessary when a definition module is changed. All modules
    depending on the changed module will be recompiled as well. Implementations of
    functions, graphs and class instances are therefore only allowed in implementation
    modules. They are exported by only specifying their type in the definition module.
    The right-hand side of any type definition can remain hidden. In this abstract
    data type is created (see 5.4).


    In a definition module the following global definitions are given in any order.


    | DefDefinition | ImportDef // see 2.5 |

    | | FunctionTypeDef // see 3.7 |

    | | MacroDef // see 10.3 |

    | TypeDef // see Chapter 5 |

    | ClassDef // see Chapter 6 |

    | TypeClassExportDef // see 6.10 |

    | GenericExportDef // see Chapter 7 |


    +   The definitions in an implementation module only have a meaning in the module
    which they are defined (see 2.3) these are exported by putting into the corresponding
    definition module. They also have a meaning in other modules in which the definitions
    are exported (see 2.5).


    +   In the corresponding implementation module all exported definitions have to
    get an appropriate implementation (this holds for functions, abstract data types,
    class instances).


    +   An abstract data type is exported by specifying the left-hand side of a type
    in the definition module. In the corresponding implementation module the abstract
    type has to be defined but then the right hand has to be defined as well. For
    such an abstract data type only the name of the type is exported not its details.


    +   A function, global graph or class instance is exported by the type header
    in the definition module. For optimal efficiency it is recommended to specifically
    specify strict annotations (see 10.1). For library functions it is recommended
    to specify the uniqueness type attributes (see Chapter 9). The implementation
    of a function, a graph, a class instance has to be given in the corresponding
    implementation module.


    +   Although it is not required to repeat an exported definition in the corresponding
    implementation module, it is a good habit to do so keep the implementation module
    readable. If a definition is repeated, the definition given in the definition
    module and the implementation module should be the same (modulo local variable
    names).


