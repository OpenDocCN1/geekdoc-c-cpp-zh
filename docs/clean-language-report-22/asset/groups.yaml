    \nThe fact that graphs are being used in CLEAN gives the programmer the ability\
    \ to explicitly share terms or to create cyclic structures. In this way time and\
    \ space efficiency can be obtained.\n\n## 1.2 Global Graphs\n\nDue to the presence\
    \ of global graphs in CLEAN the initial graph in a specific CLEAN program is slightly\
    \ different from the basic semantics. In a specific CLEAN program the initial\
    \ graph is defined as:\n\n```\n@DataRoot = Graph @StartNode @GlobId1 @GlobId2\
    \ ... @GlobIdn\n@StartNode = Initial\n@GlobId1 = Initial\n@GlobId2 = Initial\n\
    ...\n@GlobIdn = Initial\n```\n\nThe root of the initial graph will not only contain\
    \ the node-id of the start node, the root of the graph to be rewritten, but it\
    \ will also contain for each global graph (see 10.2) a reference to an initial\
    \ node (initialized with the symbol Initial). All references to a specific global\
    \ graph will be references to its initial node, or when it is rewritten, they\
    \ will be references to its reduct.\n\n## Modules and Scopes\n\n## 2.1 Identifiers,\
    \ Scopes and Name Spaces\n\n## 2.4 Definition Modules\n\n## 2.2 Modular Structure\
    \ of Clean Programs\n\n## 2.5 Importing Definitions\n\n## 2.6 System Definition\
    \ and Implementation Modules\n\n## 2.3 Implementation Modules\n\nA CLEAN program\
    \ is composed out of modules. Each module is stored in a file that contains CLEAN\
    \ source code. There are implementation modules and definition modules, in the\
    \ spirit of Modula-2 (Wirth, 1982). This module system is used for several reasons.\n\
    \n- First of all, the module structure is to control the scope of definitions.\
    \ The basic idea is that definitions only have a meaning in the implementation\
    \ module they are defined unless they are exported by the corresponding definition\
    \ module.\n- Having the exported collections in a separate definition module has\
    \ as advantage that in addition adds a self-contained interface document one can\
    \ reach out to others. The definition module is a document that defines functions\
    \ and data types can be used without revealing implementation details.\n- Furthermore,\
    \ the module structure enables separate compilation which heavily reduces compilation\
    \ time. If the definition module stays, a change in an implementation module will\
    \ only cause the recompilation of that module. When the definition module is changed\
    \ as well, only those implementation modules that are affected by this change\
    \ need to be recompiled.\n\nIn this Chapter we explain the module structure of\
    \ CLEAN and the influence it has on the scope of definitions. New scopes can also\
    \ be introduced inside modules. This is further explained in Chapters 2 and 3.\n\
    \nIn the pictures in the subsections below nested boxes indicate nested scopes.\n\
    \n## 2.1 Identifiers, Scopes and Name Spaces\n\n### 2.1.1 Naming Conventions of\
    \ Identifiers\n\nIn CLEAN we distinguish the kind of identifiers.\n\n| ModuleName\
    \ = LowerCase | UpperCase | Funnyld |\n| :--- | :--- | :--- |\n| FunctionName\
    \ = LowerCase | UpperCase | Funnyld |\n| ConstructorName = | UpperCase | |\n|\
    \ SelectorVariable = LowerCase | | |\n| Variable = LowerCase | | |\n| MacroName\
    \ = LowerCase | UpperCase | Funnyld |\n| FieldName = LowerCase | | |\n| TypeName\
    \ = | UpperCase | Funnyld |\n| TypeVariable = LowerCase | | |\n| UniqueTypeVariable\
    \ = LowerCase | | |\n| ClassName = LowerCase | UpperCase | Funnyld |\n| MemberName\
    \ = | UpperCase | Funnyld |\n\n| LowerCaseld = LowerCaseChar~{IdChar} |\n| UpperCaseld\
    \ = UpperCase~{IdChar} |\n\n![](img/9aeba7d533510ecb39b0eab112e3ff5d_20_0.png)\n\
    \n## 2.1.2 Scopes and Name Spaces\n\n| LowerCaseld = LowerCaseChar~{IdChar} |\n\
    | UpperCaseld = UpperCase~{IdChar} |\n\n![](img/9aeba7d533510ecb39b0eab112e3ff5d_20_1.png)\n\
    \n| LowerCase | = a | b | c | d | e | f | g | h | i |\n| :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| | k | l | m | n | o | p\
    \ | q | r | s | t |\n| UpperCase | = a | b | c | d | e | f | g | h | i | j |\n\
    | | k | l | m | n | o | p | q | r | s | t |\n| SpecialChar | = u | v | w | x |\
    \ y | z |\n | | | | | | | | | | | |\n\nThe convention used is that variables always\
    \ start with a lowercase character while constructors and types start with an\
    \ uppercase character. The other identifiers may either start with uppercase or\
    \ lowercase character but one can also define identifiers from special characters\
    \ like +, < (see Appendix A). These two kinds of identifiers cannot be mixed.\
    \ This makes it possible to leave out white space in expressions like a+1 (same\
    \ as a +1).\n\n## 2.2 Nesting of Scopes\n\nReusing identifier names is possible\
    \ by introducing a new scope level. Scopes can be nested: within a scope a new\
    \ scope can be defined. Within such a nested scope definitions can be given, new\
    \ names\n"
