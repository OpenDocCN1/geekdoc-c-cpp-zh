    In an ordinary pattern match one can use data constructors (to test whether an
    argument is of specific value) and variables (which match on any concrete value
    in the dynamic). Similarly, in a pattern match on a dynamic type one can use type
    constructors (to test whether a dynamic contains an expression of specific type)
    and type variables (which match on any type). However, there are differences between
    ordinary variables and type pattern variables. All ordinary variable symbols introduced
    on the left-hand side of a function (see 3.2). But the same type variable can
    be used several times in the left-hand side (and, of course, in the right-hand
    side) of a function type. Type pattern variables have the function attribute as
    secure and can appear in a pattern as well as the right-hand side of a function
    in the context of a dynamic type.


    PatternVariable = Variable


    Each time the same type variable is used in the left-hand side, the dynamic, the
    pattern matching will try to unify the variable with the concrete type stored
    in the dynamic. If the same type variable is used several times on the left-hand
    side, the most general unify is determined that matches on all corresponding types
