    实例化的，那么 `T` 在其第二个参数上也是传播的。实际上，传播不仅是类型构造器的属性，也是类型本身的属性，特别是“部分类型”。例如，部分类型 `[]` 在其（唯一的）参数上是传播的（注意，类型所期望的参数数量直接取决于所使用的类型构造器的种类）。类型
