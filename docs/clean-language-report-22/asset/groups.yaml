    ## 9.4.1 高阶唯一性类型系统


    高阶函数产生部分应用（通常称为柯里化应用，Curried applications），即实际参数个数少于对应符号的元数（arity）的应用。如果这些部分应用包含唯一的子表达式，则必须小心。


    例如，考虑以下类型为的函数 fprite：


    ```clean

    fprite :: *File -> *File

    ```


    在应用中：


    ```clean

    fpritec unifie

    ```


    （假设 unifie 返回一个唯一的文件）。显然，该应用的类型形式为 o: (Char -> *File)。问题是：o 是什么种属性？它是一个变量，还是唯一的？在做出决定之前，应该注意，允许上述应用被共享是危险的。例如，如果表达式
    fpritec unifie 被传递给函数：


    ```clean

    WriteAB write_fun = (write_fun ''a'', write_fun ''b'')

    ```


    那么在两个操作发生时，参数 fpritec 不再是唯一的。显然，fpritec unifie 表达式本质上是唯一的；它的引用计数可能大于 1。为了防止这种本质上唯一的表达式被复制，CLEAN
    将 -> 类型构造器与 * 属性结合视为特殊：不允许丢弃它的唯一性。关于属性 o 的问题可以回答为：它是 *。如果 WriteAB 的类型如下：


    ```clean

    WriteAB: (Char -> uFile) -> (uFile, uFile)

    WriteAB_write_fun = (write_fun ''a'', write_fun ''b'')

    ```


    表达式 WriteAB (priteprite unifie) 被类型系统拒绝，因为它不允许类型为 *(Char -> *File) 的参数强制转换为 (Char
    -> uFile)。很容易看出，可以通过某种方式对 WriteAB 进行类型标注，使得该表达式具有类型。


    为了定义包含柯里化应用的结构，通常使用（匿名）属性是方便的。示例：


    ```clean

    :: Object a b = { state: ann, fun.: (b -> a) }

    new: * Object FileChar

    new = { state: unifie, fun = fpritec unifie }

    ```


    通过向 Object 的类型定义添加参数，可以在此数据结构中存储唯一函数。函数 new 展示了这一点。由于 new 包含一个本质唯一的表达式，它本身也变成了本质上唯一的。因此，new
    永远不会失去它的唯一性，因此只能在需要唯一对象的上下文中使用。


    如果函数（或数据构造函数）的类型包含属性而非具体属性，确定该函数的柯里化应用的类型将会复杂。通常，这些变量将需要转换，如下例所示。


    ```clean

    Prepend: u:[a] [a] -> v:[a] [u<=v]

    Prepend a b = Append b

    ```


    ```clean

    PrependList: u:[a] -> w:([a] -> v:[a]) [u<=v, w<=u]

    PrependList a = Prepend a

    ```


    该表达式 (Prepend some_list) 的解释是：它产生一个函数，当该函数应用于另一个列表 other_list 时，会交付一个扩展的新列表，包含
    other_list 和 some 的连接。我们将这个新列表称为 new_list。如果 new_list 应该是唯一的（即，因为*），那么根据语句 u<=v，属性
    u 也变为 *。但是，如果 u=*，那么 w 也会变为 *，因为 w<=..。这表明原始表达式 (PrependList some_list) 的 (箭头)
    类型变为唯一的，且该表达式不能被共享。


    ## 9.4 唯一类型转换


    如所述，向需要非唯一参数的函数提供唯一对象是安全的（除非我们处理的是唯一箭头类型；见上文）。表示此点的技术工具是通过基于属性排序的

    ‘s≤‘non-unique’

    的转换（子类型）关系来实现。σσ'' 的有效性取决于 σ,σ'' 中属性 u 的 u≤u'' 的子类型有效性。例如，有：


    ```clean

    u:[w:Int] u≤u'':{v:[w'':Int]} iff u≤u'', v≤v, w≤w''.

    ```


    然而，需要进行一些改进。首先，必须考虑用转换语句（针对属性变量）表示的唯一性约束。其次，应该仔细处理箭头类型上的转换限制。第三，通过我们第一个参数中所谓的
