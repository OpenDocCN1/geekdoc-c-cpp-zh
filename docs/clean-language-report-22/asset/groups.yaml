    Smeters, 1993; see 10.1.3. Whenever a data structure occurs in a strict context
    (see 10.1.1), it will be evaluated.

    The order of evaluation of expressions in a function body can also be changed
    from lazy to strict by using a strict let-expression (see 3.5.4).


    One has to be careful though. When a programmer manually changes lazy evaluation
    to strict evaluation, the termination behavior of the program might change. It
    is only safe to put strict annotations in the code that the function or data constructor
    is known to be strict in the corresponding argument which means that the evaluation
    in advance does not change the termination behavior of the program. The compiler
    is not able to check this.


    # 10.2 Defining Graphs on the Global Level


    Constant graphs can also be defined on a global level (for local constant graphs
    see 3.6).


    ```

    GraphDef = Selector=[:]GraphExpr;

    ```


    A global graph definition defines a global constant (closed) graph, i.e. a graph
    which has the same scope as a global function (see 2.1). The selector variables
    that occur in the selectors of a global graph have a scope as globally as defined
    functions.


    Special global graphs (in contrast with local graphs) are that they are not garbage
    collected during the evaluation of the program A global graph can be compared
    with a CAF (Constant Application Form); its value is computed once and remained
    at runtime. A global graph can save execution time at the cost of permanent space
    consumption.


    Syntactically the definition of a graph is distinguished from the definition of
    a function by the symbol which separates left-hand from right-hand side: "=" is
    used for graphs where "->" is used for functions. However, in general the more
    common symbol "=" is used for both types of definitions. Generally it is clear
    from the context what it means (having parameters, selectors are also easily recognisable).
    However, when a simple constant the syntax is unambiguous (it can be a constant
    function as well as a constant graph).


    Global graph versus constant function definition: biglist1 is a graph which is
    computed only once, every time it is applied.


    ```

    biglist1 = [1..10000] // a constant function (if defined globally)

    biglist2 = [1..10000] // a graph

    biglist3 -> [1..10000] // a constant function

    ```


    A graph saves execution-time at the cost of space consumption. A constant function
    saves space at the cost of execution time. So, use graphs when the computation
    is time-consuming while the space consumption is small and constant functions
    in the other case.'
  - "[PAGE 126]\n\n# 10.3 Defining Macros\n\nMacros are functions (rewrite rules)\
    \ which are applied at compile-time instead of at run-time. Macro's can be used\
    \ to define functions, create inline substitutions, rename functions, do conditional\
    \ compilation. With a macro definition one, for instance, assign a name to a constant\
    \ that it can be used as pattern on the left-hand side of a function definition.\n\
    \nAt compile-time the right-hand side of the macro definition will be substituted\
    \ for every application of the macro in the scope of the macro definition. This\
    \ saves a function call and makes basic blocks larger (see Plasmejer and Van Ekelen,\
    \ 1993) that better-code can be generated. A disadvantage is that more code will\
    \ be generated. Inline substitution is also one of the regular optimisations performed\
    \ by the compiler. To avoid code explosion a compiler will generally not substitute\
    \ big functions. Macros provide the grammer to control the substitution process\
    \ manually to get an optimal trade-off between the efficiency and the size of\
    \ the code.\n\n```\nMacroDef          = [MacroFicityDef]\nMacroFicityDef    =\
    \ (FunctionName) [Fix][Prec ;\nDefMacro          = (Variable) := Function Body;\n\
    \                    [LocalFunctionAltDefs]\n```\n\nThe compile-time substitution\
    \ process is guaranteed to terminate. To ensure this restrictions are imposed\
    \ on Macro's (compared to common functions). Only variables are allowed as formal\
    \ argument. A macro allows consists of a single alternative. Furthermore, 8) Macro\
    \ are not allowed to cycle until the substitution process terminates.\n\nExample\
    \ of a macro definition.\n\n```\nBlack     :: 1   // Macro definition\nWhite \
    \    :: 0   // Macro definition\n```\n\n```\n:: Color === Int   // Type synonym\
    \ definition\n```\n\n```\nInvert: Color -> Color // Function definition\nInvert\
    \ Black = White\nInvert White = Black\n```\n\nExample: marco to use (a?b) for\
    \ lists instead of [a:b] and its use in the function map.\n\n```\n(?) infixr 5\
    \ // Fixity of Macro\n(?) h t ::= // Macro definition of\noperator\n```\n\n```\n\
    map: (a -> b) [a] -> [b]\nmap f (x?xs) = f x ? map xs\nmap f [] = []\n```\n\n\
    Notice that macros can contain local function definitions. These local definitions\
    \ (can be recursive) may also be substituted inline. In this complicated substitutions\
    \ can be achieved resulting in efficient code.\n\nExample macros can be used to\
    \ speed up frequently used functions. See for instance the definition of the function\
    \ foldl.\n\n```\nfoldl op r 1 ::= foldl r l // Macro definition\nwhere\nfoldl\
    \ r [] = r\n```"
  - "[PAGE 127]\n\n```\nfoldl r [a:x] = foldl (op r a) x\n\nsum list = foldl (+) 0\
    \ list\n```\n\nAfter substitution of the macro foldl a very efficient function\
    \ sum will be generated by the compiler:\n\n```\nsum list = foldl 0 list\nwhere\n\
    \  foldl r [] = r\n  foldl r [a:x] = foldl ((+) r a) x\n```\n\nThe expansion of\
    \ the macro takes place before type checking. Type specifications of macro rules\
    \ are not possible. When operators are defined as macros, fixity and associativity\
    \ can be defined.\n\n# 10.4 Efficiency Tips\n\nHere are some additional suggestions\
    \ how to make your program more efficient:\n\n+   * Use the CLEAN profiler to\
    \ find out which frequently collector takes are consuming a lot of space andor\
    \ time. If you modify your program, these functions are the one to have a good\
    \ look at.\n* Transform a recursive function to a tail-recursive function.\n*\
    \ It is better to accumulate results in parameters instead of in the right-hand\
    \ side results.\n* Arrays can be more efficient than lists since they allow constant\
    \ access time on their elements and can be destructive updated.\n* When functions\
    \ return multiple ad-hoc results in a tuple put these results in a strict tuple\
    \ instead (can be indicated in the type).\n* Use strict data structures whenever\
    \ possible.\n* Export the strictness information to other modules (the compiler\
    \ will will warn you if you don't).\n* Make function strict in its arguments whenever\
    \ possible.\n* Use macros for simple constant expressions or frequently used functions.\n\
    * Use CAF's and local graphs to avoid recalculation of expressions.\n* Selections\
    \ in a lazy context can be better transformed into functions which do a pattern\
    \ match.\n* Higher order functions are nice but inefficient (the compiler will\
    \ try to convert higher order function into first order functions).\n* Constructors\
    \ of high arity are inefficient.\n* Increase the heap space in the case that the\
    \ garbage collector takes place often."
  - '[PAGE 128]


    # Foreign Language Interface


    # 11.1 Foreign Export


    # 11.2 Using ABC instructions


    The tool htoclean can be used to generate interfaces to C functions. This is not
    discussed in this manual.


    How to call Clean functions from C is discussed in section 11.1.


    ABC instructions of the virtual machine for Clean can be used. This is explained
    in section 11.2.


    # 11.1 Foreign Export


    Some Clean functions can be called from C using foreign export. This is possible
    if:


    +   * The function is exported.

    * All arguments are annotated as strict (see 3.7.5).

    * The arguments and result type is either of the following:

    * Int

    * Real

    * {Char}

    * {Int}

    * {Real}

    * A tuple of these strictly annotated tuples (including tuples),


    The following syntax is used in an implementation module to export a function
    to a foreign language:


    ```

    ForeignExportDef = foreign export [ call | stdcall ] FunctionName;

    ```


    The calling convention may be specified by prefixing the function name with call
    or stdcall. The default is call,


    To pass an argument of C type:


    +   * Int, use a C integer that has the same size as an Int in Clean. On 32 bit
    platforms this is 4 bytes, on 64 bit platforms it 8 bytes. Usually long has the
    right size, except on 64 bit Windows __int64 can be used instead.

    * Real, use double.

    * {Char}, pass the address of the string. The first 4 (on 32 bit platforms) or
    8 (on 64 bit platforms) should contain the number of characters. The characters
    of the string are stored in the following bytes: The string is copied to the Heap,
    and this copy is used in Clean.

    * {Int}, pass the address of the array. The elements of the array have the same
    size as an Int in Clean. The number of elements should be stored in 4 bytes at
    offset -32 (32 bit) or 8 bytes at offset -16 (64 bit). The array is copied to
    the Heap, and this copy is used in Clean.

    * {Real}, pass the address of the array. The elements of the array have the same
    size as a Real in Clean (8 bytes) and a double in C. The number of elements should
    be stored in the same way as for {Int}. The array is copied to the Heap, and this
    copy is used in Clean.

    * tuple. The elements are passed as separate arguments as described above, in
    the same order as in the tuple.'
- md: "\nPreferably, the macros in the file Clean.h (part of the tool htoclean) should\
    \ be used to access strings and arrays,\n\nIf result of function is not a tuple,\
    \ the result is passed in the same way as an argument, except that strings and\
    \ arrays are not copied. The address of the string or array in the heap is passed\
    \ to C. This string or array may only be used until the next call or return to\
    \ Clean, because the Clean runtime system deallocate or move the array.\n\nIf\
    \ multiple values are yielded, because the result is a tuple, the result type\
    \ in C is void. To return the values, for each value an additional argument with\
    \ the address where the result should be stored is added (at the end, in the same\
    \ order as in the tuple). For example, if the result has type (Real, Int), an\
    \ additional double * and long * (__int64 * for 64 bit Windows) is added.\n\n\
    ## 11.2 Using ABC instructions\n\nFunction can be implemented using ABC instructions\
    \ from the virtual machine used by Clean:\n\n```\nABCCodeFunctionDef = Function\
    \ {Pattern} = code [inline] { ABCInstructions }\n```\n\nBy adding the ABC instructions\
    \ will be inlined if the function is called in a strict context. This is used\
    \ to define primitive functions of the StdEnv, for example integer addition. htoclean\
    \ generates calls to C functions using the ABC instruction ccall.\n\n## Context-free\
    \ Syntax Description\n\nA.1 Clean Program\nA.6 Class And Generic Definitions\n\
