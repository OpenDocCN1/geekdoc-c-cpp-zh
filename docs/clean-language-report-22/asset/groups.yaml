    # Basic Semantics


    # 1.1 Graph Rewriting


    # 1.2 Global Graphs


    The semantics of the CLEAN is based on Term Graph Rewriting Systems (Barendregt,
    1987; Plasmeijer and Van Eekelen, 1993). This means in a CLEAN program works semantically
    on graphs instead of the usual terms. This enabled us to incorporate CLEAN''s
    typical features (definition of cyclic data structures, like copying, uniqueness
    typing) which would otherwise be very difficult to get a proper semantics for.
    However, in many cases the programmer does not need to be aware of the fact he/she
    is manipulating graphs. Evaluation of a CLEAN program takes place in the same
    way as other functional languages. One of the differences between CLEAN and other
    functional languages is when a variable occurs more than once in a function body,
    the semantics prescribe that the actual argument is shared (the semantics of most
    other languages do not prescribe this although it common practice in implementation
    of a functional language). Furthermore, one label can make the definition of cyclic
    structures possible. People familiar with other functional languages will have
    no problems writing CLEAN programs.


    When applications are being written, or when CLEAN is interfaced with the non-functional
    world, or when efficiency counts, or when one simply wants to have a good understanding
    of the language it is good to have some knowledge of the basic semantics of CLEAN
    which is based on graph rewriting. In this chapter a short introduction to the
    basic semantics of CLEAN and the implementation techniques of CLEAN can be found
    in Plasmeijer and Van Eekelen (1993).


    # 1.1 Graph Rewriting


    A program basically consists of a number of graph rewrite rules (function definitions)
    which specify how a given graph (the initial expression) has to be rewritten


    A graph is a set of nodes. Each node has defining node-identifier (the node-id).
    A node consists of a symbol and (possibly empty) sentence of applied node-id''s
    (the arguments of the symbol) Applied node-id can be seen as references (arcs)
    in the graph, as they have a direction: from the node which the node-id is applied
    to the node which the node-id is the defining identifier.


    Each rewrite rule consists of a left-hand side graph (the pattern) and a right-hand
    side (rhs) consisting of a graph (the contractor) or a single node-id (a redirection).
    In CLEAN rewrite rules are not comparing: the left-hand side (lhs) graph of a
    rule is a tree, each node identifier is applied only once, there exists exactly
    one path from the root to this graph.


    A rewrite rule defines a (partial) Function The function symbol is the root symbol
    of the left-hand side graph or the rule alternatives. All other symbols that appear
    in rewrite rules are, constructor symbols.


    The program graph is that is rewritten according to the rules. Initially, this
    program is fixed; it consists of a single node containing the symbol Start, so
    there is no need to specify this graph in the program explicitly. The part of
    the graph that matches the pattern of a certain rewrite rule is called redex (reducible
    expression). A rewrite of a redex to its reduce can take place according to the
    right-hand side of the corresponding rewrite rule. If this right-hand is a contraction
    then the rewrite consists of building this contract and doing a redirection of
    the root of the redex to root of the right-hand side. Otherwise, only'
  - "[PAGE 17]\n\nredirection of the root of the root to the single node-identified\
    \ on the right-hand side is performed. a redirection of the root-id n1 to a node-id\
    \ n2 means that all occurrences of n1 are replaced by occurrences of n2 (which\
    \ is in reality implemented by overwriting n1 with n2).\n\nA reduction strategy\
    \ is a function that makes choices out of the available reduces. A reducer is\
    \ a function that reduces reduces that are indicated by the strategy. The result\
    \ of a reducer is reached as soon as the re-duction strategy does not indicate\
    \ reduces any more. A graph is in normal form if the patterns in the rules match\
    \ any of the graph. A graph is said to be in root normal form when the root of\
    \ a graph is not a root of a graph and can never become a root of a reducer. In\
    \ general it is undecidable whether a graph is in root normal form.\n\nA pattern\
    \ partially matches a graph firstly if the symbol of the pattern equals the symbol\
    \ of the root of the graph and secondly in positions where symbols in the pattern\
    \ are not syntactically to symbols in the graph, the corresponding sub-graph is\
    \ a redux or the sub-graph itself is partially matching a graph. A graph in strong\
    \ root normal form if the graph does not partially match any. It is decidable\
    \ whether not a graph is in strong root normal form. A graph in strong root normal\
    \ form does not match any rule, or if it is also in root normal form.\n\nThe default\
    \ strategy used in CLEAN is the functional strategy. Reducing graphs according\
    \ to this strategy resembles very much the execution proceeds in order lazy functional\
    \ languages: in the standard lambda calculus the functional strategy corresponds\
    \ to normal order. Order graph rewrite the functional strategy proceeds as follows:\
    \ if there are several rules for a partial function, the rules are tried in textual\
    \ order; patterns are tested from left to right; evaluation to strong normal form\
    \ of arguments is forced when an actual argument is matched against a corresponding\
    \ variable of the part. A default of this strategy can be found in (Toyama et\
    \ al., 1991).\n\n# 1.1.1 A Small Example\n\nConsider the following CLEAN:\n\n\
    ```\nAdd Zero z = z (1)\nAdd (Succ a) z = Succ (Add a z) (2)\n\nStart = Add (Succ\
    \ o) o\n      where\n        o = Zero (3)\n```\n\n```\nAdd Zero z = z (1)\nAdd\
    \ (Succ a) z = Succ (Add a z) (2)\n\nStart = Add (Succ o) o\n      where\n   \
    \     o = Zero (3)\n```\n\nThese rules are internally translated to a semantically\
    \ equivalent set of rules in which the graph structure both left-hand side as\
    \ right-hand side of the rewrite has been made explicit by adding node-id. Using\
    \ the set of rules with explicit node-id it will be easier to understand what\
    \ the meaning of the rules in x graph rewriting is.\n\n```\nx = Add y z\ny = Zero\
    \ (1)\n```"
