    ```\n\n## 记录字段的记录\n\n| RecordSelection = RecordExpr [.TypeName].FieldName (Selection)\
    \ |\n| Selection = RecordExpr [.TypeName]!FieldName (Selection) |\n| = .FieldName|ArrayIndex\
    \ |\n\n通过记录选择（使用 `*`），你可以选择指定记录字段中的值。使用 `!` 的“唯一”选择会返回一个包含包含所求记录的元组。\n\n## 5.2.2\
    \ 记录模式\n\n具体类型的左侧应与抽象类型定义的左侧（变量名的 alpha 转换除外）保持一致（包括严格性和唯一性类型属性）。\n\n```\nRecordPattern\
    \ = {[TypeName] | [FieldName = GraphExpr]-list\n```\n\n- 只有那些想要使用的字段才在记录定义中提到。\n\
    - 可以使用类型构造器将记录与其他记录区分开；如果至少指定了一个在其他记录中未定义的字段名，则可以省略类型构造器。\n\n```\n::Tree a = Node\
    \ (Tree a) (Tree a)\n        | Leaf a\n```\n\n通过记录选择（使用 `*`），你可以选择指定记录字段中的值。使用\
    \ `!` 的“唯一”选择会返回一个包含所求记录的元组。\n\n```\nMirror::Tree a -> Tree a\nMirror (Node tree:(right))\
    \    = Node {tree=r,right=l}\nMirror leaf                               = leaf\n\
    ```\n\n定义的另一种 Mirror。\n\n```\nMirror (Node tree)    = Node {tree=right,right=left}\n\
    ```\n\n或者\n\n```\nMirror (Node tree:(left,right))    = Node {tree\n\nleft,right.\n\
    \n}\n\n别名类型允许程序员为现有类型引入一个新的类型名称。\n\n```\nSynonymTypeDef              :: TypeLhs\
    \ := [UniversalQuantVariables]Type\n```\n\n- 不允许类型的循环定义（例如 `:Tab::a := Gab::Tab`）。\n\
    \n类型定义的示例。\n\n```\n::Operator a -> a -> a\nmap2: (Operator a) [a] [a] -> [a]\n\
    map2 op []               = []\nmap2 op [f1:r2] [f2:r2] = [op f1 f2 :map2 op r1\
    \ r2]\n```\n\n```\nStart:: Int\nStart = map2 (*) [2,3,4,5] [7,8,9,10]\n```\n\n\
    ## 5.4 定义抽象数据类型\n\n可以通过在 CLEAN 模块中定义类型（见第 2 章）导出类型。由于软件工程的原因，有时只需要类型的名称而不是其具体实现（类型定义的右侧）。这变成了一个抽象数据类型。在\
    \ CLEAN 中，这是通过只指定类型定义模块的左侧并将具体定义（类型定义的右侧）隐藏在实现模块来实现。因此，使用了 CLEAN 的结构来隐藏实际实现。当你想对抽象类型对象进行操作时，需要导出创建和操作此类类型对象的函数。\n\
    \n- 抽象类型定义只允许在定义模块中进行，具体定义必须在实现模块中给出。\n\n```\nAbstractTypeDef              ::\
    \ TypeLhs ;\n```\n\n示例。\n\n```\ndefinition module stack\n::Stack a\nEmpty    \
    \     ::  (Stack a)\n```\n"
