    \ above is corrupted/garbled. Let me restart and provide the clean version based\
    \ on the provided text.)\n\nThe basic idea is that definitions given in an implementation\
    \ module only have a meaning in the module in which they are defined unless these\
    \ definitions are exported by putting them into the corresponding module definition.\
    \ In that case the definitions also have a meaning in other modules in which the\
    \ definitions are imported (see 2.5).\n\n```\nCleanProgram = [Module]+\nModule\
    \ = DefinitionModule\n = ImplementationModule\nDefinitionModule = definition module\
    \ ModuleName;\n    (DefDefinition)\n = system module ModuleName;\n    (DefDefinition)\n\
    ImplementationModule = [implementation] module ModuleName;\n    (ImplDefinition)\n\
    ```\n\n- An exquisite CLEAN program consists of at least one implementation module,\
    \ the main or start module, which is the top-most (root module) of a CLEAN program.\n\
    - Each CLEAN module has to be in a separate file.\n- The name of a module (i.e.,\
    \ the module name) should be the name of the minus (suffix) in which the module\
    \ is stored.\n- A definition module should have .decl as suffix; an implementation\
    \ module should have .icl as suffix.\n- A definition module can have at most one\
    \ corresponding implementation module.\n- Every implementation module (except\
    \ the main module, see 2.3.1) must have a corresponding definition module.\n\n\
    ## 2.3 Implementation Modules\n\n### 2.3.1 The Main or Start Module\n\n- In the\
    \ main module a Start rule has to be defined (see Chapter 1).\n- Only in the main\
    \ module one can leave out the keyword implementation in the module header. In\
    \ that case the implementation module does not need to have a corresponding definition\
    \ module (which makes sense for a top-most module).\n\nA very tiny but complete\
    \ program consisting of one implementation module.\n\n```\nmodule hello\nStart\
    \ = \"Hello World!\"\n```\n\nEvaluation of a CLEAN program consists of the evaluation\
    \ of the application defined in the right-hand side of the Start rule (see Chapter\
    \ 1). The right-hand side of the Start rule is regarded to be the initial expression\
    \ to be computed.\n\nis allowed to have a Start rule in other implementation modules\
    \ as well. This can be handy for testing functions defined in such a module: to\
    \ evaluate such Start simply generate an application with the module and root\
    \ execute it. In the CLEAN one can specify which module has to be regarded as\
    \ the root module.\n\nThe definition of the left-hand side of the Start rule consists\
    \ of the symbol Start with optional argument (of type *World), which is the environment\
    \ parameter, which is necessary to write interactive applications.\n\nA CLEAN\
    \ program can run in two modes.\n\n# I/O Using the Console\n\nThe first mode is\
    \ a console mode. It is chosen when the Start rule is defined as a nullary function.\n\
    \n```\nStart:: TypeOfStartFunction\n// initial expression\nStart = ...\n```\n\n\
    In the console mode, part of the initial expression (indicated by the right-hand\
    \ side of the Start rule), which is in root normal form (also called the head\
    \ normal or root stable form), is printed as soon as possible. The console mode\
    \ can be used for instance to debug functions.\n\nIn the CLEAN IDE one can choose\
    \ to print the result of a Start expression with or without the data constructors.\n\
    \nFor example, the initial expression\n\n```\nStart:: String\nStart = \"Hello\
    \ World!\"\n```\n\nin mode \"show data constructors\" will print: \"Hello World!\"\
    , in mode \"don't show data constructors\" it will print: Hello World!\n\n# I/O\
    \ on the Unique World\n\nThe second mode is the root mode. It is chosen when the\
    \ optional parameter (which is of type *World) is added to the Start and deliver\
    \ as result.\n\n```\nStart:: *World -> *World\n// initial expression returning\
    \ a changed\nStart w = ...\nworld\n```\n\nThe world which is given to the initial\
    \ expression is an abstract data structure, an abstract world of type *World which\
    \ models the concrete physical world as the program. The abstract world in principle\
    \ contain anything what functional program needs to interact during execution\
    \ with the concrete world. The world can be as a state and modifications of the\
    \ world can be realized via state transition functions on a unique world the modifications\
    \ of the abstract world directly be realized in the physical world, without loss\
    \ of efficiency and without losing referential transparency (see Chapter 9)\n\n\
    The concrete way in which the world can be handled in CLEAN is by the system programmer.\
    \ One way to handle the world is using the predefined CLEAN I/O library, which\
    \ can be regarded as a parallel independent operating system. It is possible to\
    \ do file I/O, window based I/O, dynamic process creation and communication in\
    \ a functional language in an efficient way. The definition of the I/O is treated\
    \ in a separate document (Object I/O tutorial, Ahmet et al., 1997).\n\n### 2.3.2\
    \ Scope of Global Definitions in Implementation Modules\n\nIn an implementation\
    \ module the following global definitions can be specified in any order.\n\n```\n\
    ImplDefinition               = ImportDef             // see 2.5\n            \
    \                  FunctionDef            // see Chapter 3\n                 \
    \             GraphDef                // see 3.6\n                           \
    \   MacroDef                // see 10.3\n                              TypeDef\
    \                 // see Chapter 5\n                              ClassDef   \
    \             // see Chapter 6\n                              GenericsDef    \
    \        // see Chapter 7\n```\n\nDefinitions on the global level (outermost level\
    \ in the module,) have in principle the whole implementation module as scope (see\
    \ Figure 2.1).\n\n# Figure 2.1 (Scope of global definitions inside an implementation\
    \ module).\n\n```\nimplementation module XXX\n:: TypeName typevars = type_expression\
    \ // definition of a new type\n```\n\n- TypeName typevars = type_expression //\
