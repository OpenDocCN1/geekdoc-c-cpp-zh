    \ and Bifunctor provide mapping function. One provides mapping for type of kind\
    \ '*->*' and the other for types of kind '*->*'. In fact instances mapping functions\
    \ for all kinds are similar.\n\n## 7.2 Defining Generic Functions\n\nThe generic\
    \ feature of CLEAN is to derive instances for types of different kinds from a\
    \ single generic definition. These generic functions are known as kind-indexed\
    \ functions (Alistairine & Plasmijer, A Generic Programming Extension for Clean).\
    \ Actually, a generic function in CLEAN stands for a set of classes and instances\
    \ of the same kind for different kinds. Since CLEAN allows function to be used\
    \ in a Curried manner (see 3.7.1), the compiler is not able to deduce which kind\
    \ of map is. Therefore the kind of a generic function application has to be specified\
    \ explicitly.\n\nTo define a generic function the programmer has to provide: the\
    \ base of the generic function and the base cases (instances) of the generic function.\n\
    \n```haskell\nGenericsDef          | GenericDef;\nGenericCase         | GenericCase;\n\
    DeriveDef           | DeriveDef;\n\nGenericDef          | generic FunctionName\
    \ TypeVariable+ :: FunctionType\nGenericCase         | ([GenericArg]) (Pattern)+\
    \ = FunctionBody\nGenericTypeArg     | CONS of [Pattern]\n                   \
    \   | FIELD of [Pattern]\n                      | TypeConstructorName\n      \
    \                | TypeVariable\n```\n\nExample. The generic definition of equality.\n\
    \n```haskell\ngq a ::               a  -> Bool\ngq (Int)            x y -> x ==\
    \ y\ngq (Char)          x y -> x == y\ngq (Bool)          x y -> x == y\ngq (Real)\
    \          x y -> x == y\n```\n\n```haskell\neq ( | )      UNIT = True\neq (PAIR\
    \ x1 y1) (PAIR x2 y2) = x1 == x2 && y1 == y2\neq (EITHER x) (LEFT y) = x = y\n\
    eq (EITHER x) (RIGHT y) = x = y\neq (CONS x) (CONS y) = x = y\neq (FIELD x) (FIELD\
    \ y) = x = y\n```\n\nExample. The generic definition of:\n```haskell\ngeneric\
    \ gMap b a :               -> b\ngMap c :               x = x\ngMap (PAIR x y)\
    \ (PAIR u v) = PAIR (gMap x u) (gMap y v)\ngMap (EITHER x) (LEFT y) = LEFT (gMap\
    \ x y)\ngMap (EITHER x) (RIGHT y) = RIGHT (gMap x y)\ngMap (CONS x) (CONS y) =\
    \ CONS (gMap x y) -- wait, logic is messy here\n```\n\nBidirectional mapping:\n\
    ```haskell\ngeneric gMap b a :               -> b\ngMap c :               x =\
    \ x\ngMap (PAIR x y) (PAIR u v) = PAIR (gMap x u) (gMap y v)\ngMap (EITHER x)\
    \ (LEFT y) = LEFT (gMap x y)\ngMap (EITHER x) (RIGHT y) = RIGHT (gMap x y)\ngMap\
    \ (CONS x) (CONS y) = CONS (gMap x y)\ngMap (FIELD x) (FIELD y) = FIELD (gMap\
    \ x y)\n```\n\nIn the generic definition, recognised by the keyword generic, the\
    \ first type of the generic function has to be specified. The variables mentioned\
    \ after the generic name are called generic variables. Similar to types, these\
    \ are substituted by the actual instance. A generic function defines a set of\
    \ type constructors. There is one class for each kind. Such a generic function\
    \ is sometimes called a kind-indexed class. The classes generated by the generic\
    \ function always have one variable, even if the generic function has generic\
    \ variables. The reason for this is that the generic function can be defined by\
    \ only argument.\n\nClasses that are automatically generated for the generic map\
    \ given above:\n```haskell\nclass Map*| t              :: t -> t\nclass Map(*->*)\
    \ t              :: (a -> b) (a) -> t\nclass Map(*->*) t            :: (a -> b1)\
    \ (a2 -> b2) -> b1 b2\n```\n\nRoughly the algorithm for deriving classes is the\
    \ following. Suppose we have a generic function genFun with type Gen.\n\n```haskell\n\
    :: GenFun a n ::=   Generic genFun a : n :: GenFun a .. n\n```\n\nA class for\
    \ kind k:\n```haskell\nclass genFun{|k} t      :: GenFun{|k} t .. t\n```\n\nIs\
    \ derived by the induction of structure:\n```haskell\n:: GenFun*| a n ::= :: GenFun\
    \ a .. n\n:: GenFun(k->l) a n ::=   a n :: (GenFun|k| b1 n) -> GenFun|l| (a n)\n\
    ```\n\nThe programmer provides a set of basic cases for a generic function. Based\
    \ on its basics the generic function can be derived for other types. The next\
    \ section for detailed discussion on types for which a generic function can and\
    \ cannot be derived. Here we discuss what can be specified as the type argument\
    \ in the definition of a generic base case:\n\n- Generic structural representation\
    \ type. UNIT, PAIR, EITHER, CONS and FIELD. The programmer must always derive\
    \ these types as they cannot be derived by the compiler. Without these cases a\
    \ generic function cannot be derived for basically any type.\n- Basic type. If\
    \ a generic function is supposed to work on types that involve basic types, instances\
    \ of basic types must be derived.\n- Type variable. Type variable stands for all\
    \ types of kind *. If a generic function has a case for a type variable it means\
    \ that by all types of kind will be handled by that instance. The programmer can\
    \ override the default behavior by defining an instance on a specific type.\n\
    - Arrow type (->). If a generic function is supposed to work with types that involve\
    \ the arrow type, an instance on the arrow type must be provided.\n- Type constructor.\
    \ A programmer may provide instances on other types. This may be needed for two\
    \ reasons:\n  1. The instance cannot be derived for the reasons explained in the\
    \ next section.\n  2. The instance can be generated, the programmer is not satisfied\
    \ with generic behavior for this type and wants to provide a specific behavior.\n\
    \n## 7.3 Deriving Generic Functions\n\nThe user has to tell the compiler instances\
    \ of generic functions on which types are to be generated. This is done with the\
    \ derive.\n\n```haskell\nDeriveDef = derive FunctionName TypeConstructorName+\n\
    ```\n\nDerive instances of generic mapping and generic equality for List, Tree,\
    \ []:\n```haskell\nderive eQ List, Tree, []\nderive gMap List, Tree, []\n```\n\
    \nA generic function can be automatically specialized to algebraic types that\
    \ are not abstract in the module where the derive directive is given. Generic\
    \ structure representation types: PAIR, EITHER, UNIT, CONS, FIELD. Also see the\
    \ previous section. It is possible to derive instances for these types automatically\
    \ because they are useful to build structural representation of types that is\
    \ needed to derive an. Deriving instances for then would yield non-terminating\
    \ cyclic functions. Instances on these types must be provided for the user. Derived\
    \ instances of algebraic types call these instances.\n\n- Arrow type (->). An\
    \ instance on the arrow type must be provided by the programmer, if he or she\
    \ wants the generic function to work with types containing arrows.\n- Basic types\
    \ like Int, Char, Real, Bool. In principle it is possible to derive all basic\
    \ types as algebraic types but would be very inefficient. The user can provide\
    \ a defined instance on a basic type.\n- Array types as they are not types. The\
    \ user may in instead derive a generic function for the types involved on the\
    \ right-hand side of a synonym type definition.\n- Abstract types. The compiler\
    \ does not know the structure of an abstract data type to derive the instance.\n\
    - Quantified types. The programmer has to manually provide instances for type\
    \ definitions with universal and existential quantification.\n\nThe compiler issues\
    \ an error if there is no required instance for a type available. Required instances\
    \ are\n"
  mdcn: "\n类型与其和-积表示之间的同构关系。\n\n```\n:: List a ::= Either UNIT (PAIR a (List a))\n\
    ```\n\n```haskell\nlistToStruct      :: (List a) -> _ListS\nlistToStruct Nil \
    \        = LEFT UNIT\nlistToStruct (Cons x xs) = RIGHT (PAIR x xs)\n```\n\n```haskell\n\
    listFromStruct   :: (List a) -> _List a\nlistFromStruct (LEFT UNIT)   = Nil\n\
    listFromStruct (RIGHT (PAIR x xs)) = Cons x xs\n```\n\n```\n:: Tree a ::= Either\
    \ (PAIR Tree a) (Tree a))\n```\n\n```haskell\ntreeStruct      :: (Tree a) -> _TreeS\n\
    treeFrom        :: (TreeS) -> _Tree a\n```\n\n正如我们所，所有的代数类型都可以以这种方式表示。基本类型不是代数类型，但它们很少：它们由箭头构造函数（->）表示。要对类型的结构泛泛地定义函数，只需为构建该结构的组件定义实例即可。这些组件是二元和、二元积、基本类型和箭头类型。\n\
    \n和、积以及原始类型上的相等。箭头类型无法可行地定义相等性，因此省略了该实例。\n\n```haskell\ninstance UNIT\nwhere\n\
    \  (=) infix 2 :: UNIT UNIT -> Bool\n  (=) UNIT UNIT              = True\n```\n\
    \n```haskell\ninstance PAIR a b | Eq a & Eq b\nwhere\n  (=) infix 2 :: (PAIR a\
    \ b) (PAIR a b) -> Bool\n  (=) (PAIR a b1) (PAIR a2 b2) = a1 == a2 && b1 == b2\n\
    ```\n\n```haskell\ninstance EITHER a b | Eq a & Eq b\nwhere\n  (=) infix 2 ::\
    \ (EITHER a b) (EITHER a b) -> Bool\n  (=) (LEFT x) (LEFT y) = x = y\n  (=) (RIGHT\
    \ x) (RIGHT y) = x = y\n  (=) x = False\n```\n\n```haskell\ninstance Int\nwhere\n\
    \  (=) infix 2 :: Int Int -> Bool\n  (=) x y = eqInt x y // 整数的原始相等性\n```\n\n\
    通过在结构组件上拥有实例，我们可以自动为所有其他类型生成实例。\n\n可以自动生成的列表和树的相等性。参数首先转换为结构化表示，然后对它们进行比较。\n\n\
    ```haskell\ninstance Eq (List a) | Eq a\nwhere\n  (=) infix 2 :: (List a) (List\
    \ a) -> Bool | Eq a\n  (=) xs ys = listToStruct xs == listToStruct ys\n```\n\n\
    ```haskell\ninstance Tree a | Eq a\nwhere\n  (=) infix 2 :: (Tree a) (Tree a)\
    \ -> Bool | Eq a\n  (=) xs ys = treeStruct xs == treeStruct ys\n```\n\n不仅是一个类的实例也揭示了实例定义中的相似性。\n\
    \n双泛子（Bifunctor）为种类为 '*->*' 的类型提供了映射函数。实例的定义与 Functor 实例类似。\n\n```haskell\n::\
    \ Tree2 a b\n  | Tip a\n  | Bin b (Tree a b) (Tree a b)\n```\n\n```haskell\nclass\
    \ Bifunctor f\nwhere\n  bmap :: (a1 -> b1) (a2 -> b2) (f a1 a2) -> (f b1 b2)\n\
    ```\n\n```haskell\ninstance Bifunctor Tree\nwhere\n  bmap :: (a1 -> b1) (a2 ->\
    \ b2) (Tree2 a1 a2) -> (Tree b1 b2)\n  bmap f1 f2 (Tip x) = Tip (f1 x)\n  bmap\
    \ f1 f2 (Bin x r) = Bin (f2 x) (bmap f1 f2 r)\n```\n\n上述示例中的实例工作方式与 Functor 实例类似：它也按分处理子结构组件。Functor\
    \ 和 Bifunctor 都提供了映射函数。一个为种类为 '*->*' 的类型提供映射，另一个为种类为 '*->*' 的类型提供。事实上，所有种类的映射函数实例都是相似的。\n\
    \n## 7.2 定义泛型函数\n\nCLEAN 的泛型特征是从单个泛型定义为不同种类的类型导出实例。这些泛型函数被称为种类索引函数（kind-indexed\
    \ functions）（Alistairine & Plasmijer, A Generic Programming Extension for Clean）。实际上，CLEAN\
    \ 中的一个泛型函数代表了针对不同种类的相同类的类和实例。由于 CLEAN 允许以柯里化方式使用函数（参见 3.7.1），编译器无法推断是哪种类的映射。因此，泛型函数应用的种类必须显式指定。\n\
    \n要定义泛型函数，程序员必须提供：泛型函数的基础以及泛型函数的边界情况（实例）。\n\n```haskell\nGenericsDef         \
    \ | GenericDef;\nGenericCase         | GenericCase;\nDeriveDef           | DeriveDef;\n\
    \nGenericDef          | generic FunctionName TypeVariable+ :: FunctionType\nGenericCase\
    \         | ([GenericArg]) (Pattern)+ = FunctionBody\nGenericTypeArg     | CONS\
    \ of [Pattern]\n                      | FIELD of [Pattern]\n                 \
    \     | TypeConstructorName\n                      | TypeVariable\n```\n\n示例。相等性的泛型定义。\n\
    \n```haskell\ngq a ::               a  -> Bool\ngq (Int)            x y -> x ==\
    \ y\ngq (Char)          x y -> x == y\ngq (Bool)          x y -> x == y\ngq (Real)\
    \          x y -> x == y\n```\n\n```haskell\neq (UNIT )      = True\neq (PAIR\
    \ x1 y1) (PAIR x2 y2) = x1 == x2 && y1 == y2\neq (EITHER x) (LEFT y) = y\neq (EITHER\
    \ x) (RIGHT y) = y\neq (CONS x) (CONS y) = y\neq (FIELD x) (FIELD y) = y\n```\n\
    \n示例。以下是泛型定义：\n```haskell\ngeneric gMap b a :               -> b\ngMap c :   \
    \            x = x\ngMap (PAIR x y) (PAIR u v) = PAIR (gMap u) (gMap v)\ngMap\
    \ (EITHER x) (LEFT y) = LEFT (gMap y)\ngMap (EITHER x) (RIGHT y) = RIGHT (gMap\
    \ y)\ngMap (CONS x) (CONS y) = CONS (gMap y)\ngMap (FIELD x) (FIELD y) = FIELD\
    \ (gMap y)\n```\n\n双向映射：\n```haskell\ngeneric gMap b a :               -> b\n\
    gMap c :               x = x\ngMap (PAIR x y) (PAIR u v) = PAIR (gMap u) (gMap\
    \ v)\ngMap (EITHER x) (LEFT y) = LEFT (gMap y)\ngMap (EITHER x) (RIGHT y) = RIGHT\
    \ (gMap y)\ngMap (CONS x) (CONS y) = CONS (gMap y)\ngMap (FIELD x) (FIELD y) =\
    \ FIELD (gMap y)\n```\n\n上述泛型映射自动生成的类：\n```haskell\nclass Map*| t            \
    \  :: t -> t\nclass Map(*->*) t              :: (a -> b) (a) -> t\nclass Map(*->*)\
    \ t            :: (a -> b1) (a2 -> b2) -> b1 b2\n```\n\n导出类的近似算法如下。假设我们有一个类型为\
    \ Gen 的泛型函数 genFun。\n\n```haskell\n:: GenFun a n ::=   Generic genFun a : n ::\
    \ GenFun a .. n\n```\n\n种类 k 的类：\n```haskell\nclass genFun{|k} t      :: GenFun{|k}\
    \ t .. t\n```\n\n通过结构归纳导出：\n```haskell\n:: GenFun*| a n ::= :: GenFun a .. n\n\
    :: GenFun(k->l) a n ::=   a n :: (GenFun|k| b1 n) -> GenFun|l| (a n)\n```\n\n\
    程序员为泛型函数提供一组基础情况。根据这些基础，可以为其他类型导出泛型函数。下一节将详细讨论可以导出和不能导出泛型函数的类型。这里我们讨论在泛型边界定义中可以指定的类型参数：\n\
    \n- 泛型结构表示类型。UNIT、PAIR、EITHER、CONS 和 FIELD。程序员必须导出这些类型，因为编译器无法导出它们。没有这些情况，泛型函数无法用于任何类型。\n\
    - 基本类型。如果泛型函数用于涉及基本类型的类型，必须导出基本类型的实例。\n- 类型变量。类型变量代表种类 * 的所有类型。如果泛型函数有一个类型变量的情况，意味着所有此类类型将由该实例处理。程序员可以通过在特定类型上定义实例来覆盖默认行为。\n\
    - 箭头类型（->）。如果泛型函数用于涉及箭头类型的类型，则必须提供箭头类型的实例。\n- 类型构造器。程序员可以在其他类型上提供实例。这可能有两个原因：\n\
    \  1. 由于下一节解释的原因，无法导出实例。\n  2. 实例可以生成，程序员对该类型的泛型行为不满意并并提供特定的行为。\n\n## 7.3 导出泛型函数\n\
    \n用户必须告诉编译器在哪些类型上生成泛型函数的实例。这是通过 `derive` 实现。\n\n```haskell\nDeriveDef = derive\
    \ FunctionName TypeConstructorName+\n```\n\n为 List、Tree、[] 导出泛型映射和泛型相等实例：\n```haskell\n\
    derive eQ List, Tree, []\nderive gMap List, Tree, []\n```\n\n泛型函数可以自动特化为派指令所在模块中非抽象的代数类型。泛型结构表示类型：PAIR、EITHER、UNIT、CONS、FIELD。另见前节。可以自动为这些类型导出实例，因为它们有助于构建导出所需的类型表示。为这些类型导出实例将产生不终止的循环函数。必须为用户提供这些实例。代数类型的导出实例调用这些实例。\n\
    \n- 箭头类型（->）。如果程序员希望泛型函数处理包含箭头的类型，则必须提供箭头类型的实例。\n- 基本类型如 Int、Char、Real、Bool。原则上可以将所有基本类型导出为代数类型，但效率会非常低。用户可以在基本类型上提供定义的实例。\n\
    - 数组类型，因为它们不是类型。用户反而可以为同名类型定义的右侧涉及的类型导出泛型函数。\n- 抽象类型。编译器不知道抽象数据类型的结构以导出实例。\n-\
    \ 量化类型。程序员必须为具有全称和存在量化的类型定义手动提供实例。\n\n当没有可用的所需的实例时，编译器将发出错误。所需的实例是\n\n"
