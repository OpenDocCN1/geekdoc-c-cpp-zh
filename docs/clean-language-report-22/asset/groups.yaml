- md: "\n## 7.4 Applying Generic Functions\n\nThe generic function in Clean stands\
    \ for a set of overloaded functions. There is one in the set for each kind. When\
    \ a generic function is applied, the compiler must select one overloaded function\
    \ in the set. The compiler cannot derive the required kind automatically. For\
    \ this reason a kind has to be provided explicitly at each generic function application.\
    \ Between the brackets { and | } one can specify the intended kind. The compiler\
    \ resolves overloading of the selected function as usually.\n\n```\nGenericExpression\
    \ = FunctionName TypeKindExpr\nTypeKind           = {|*| }\n```\n\nExample: a\
    \ generic equality operator can be defined as equality on types of kind.\n`(==)\
    \ infix 2 :: a -> Bool gEq(|*|) a\n`(==) x y = gEq(|*|) x y`\n\nExample: a mapping\
    \ function fmap for functions and bmap for bifunctors can be defined in terms\
    \ of the generic mapping function by just specializing it its appropriate kind.\n\
    \n```\nfmap :: (a -> b) (f a) -> gMap(|->*|) f\nfmap x y = gMap(|->*|) f x y\n\
    ```\n\n```\nbmap :: (a1 -> a2) (f a1 a2) -> (f b1 b2) | gMap(|->*|) f\nbmap f1\
    \ f2 x y = gMap(|->*|) f1 f2 x y\n```\n\nEquality makes sense only for kind. In\
    \ the example we use the standard way of comparing elements.\n\n```\neqListFsts\
    \ :: {(a, b), [a, c]} -> Bool gEq(|*|) a\neqqListFsts xs ys = gEq(|*|) (\\x y\
    \ === fst ys)\n```\n\n```\neqFsts :: {(f, a, b), (f a, c)} -> Bool gEq(|->*|)\
    \ f & gEq(|*|) a\neqqFsts xs ys = gEq(|*|) (\\x y === fst y ys)\n```\n\nExamples\
    \ of generic applications\n\n```\nStart =\n  ({|*|} [1,2], [2,3]) // True\n  ([1,2],\
    \ === [1,2]) // True\n  (gEq(|->*|) (\\x y -> True) [1,2] [4,5,6]) // True\n```\n\
    \n## 7.5 Using Constructor Information\n\nAs we have outlined, the structural\
    \ representation of types lacks information about specific constructors and record\
    \ fields, such as name, arity etc. This is because this information is not part\
    \ of the structure of types: different types can have the same structure. However,\
    \ some generic functions need this information. Consider, for an example toString\
    \ that converts a value of any type to a string. It needs to print constructor\
    \ names. For that reason the structural representation of types is extended with\
    \ special constructor and field markers to pass information about fields and constructors\
    \ to a generic function.\n\nDefinition of the constructor and field marker types\
    \ (in StdGeneric.dcl).\n\n```\n:: CONS a = CONS a\n:: FIELD a = FIELD a\n```\n\
    \nThe markers themselves do not contain any information about constructors and\
    \ fields. Instead, the information is passed to instances of a generic function\
    \ on these markers.\n\nExamples of structural representation with constructor\
    \ and field information\n\n- ListS a ::= EITHER (CONS UNIT) (CONS PAIR (List a))\n\
    - TreeS ::= EITHER (CONS a) (CONS PAIR (Tree a))\n\n- Complex = ( re :: Real,\
    \ im :: Real )\n- ComplexS ::= PAIR (FIELD Real) (FIELD Real)\n\n## GenericTypeArg\n\
    \n```\nCONS of {Pattern}\nFIELD [of {Pattern}]\nTypeConstructorName\nTypeVariable\n\
    ```\n\nDefinition of the constructor and field descriptors (StdGeneric.dcl).\n\
    Constructor descriptor is passed after of in the CASE of a generic function.\n\
    \n- ConsDescriptor\n  gcd_name :: String\n  gcd_arity :: Int\n\nField descriptor\
    \ is passed after of in the FIELD of a generic function.\n\n- FieldDescriptor\n\
    \  gfd_name :: String\n\nGeneric pretty printer.\n\n```\ngeneric gToString a ::\
    \ String a -> String\ngToString { Int } sep x = toString x\ngToString { UNIT }\
    \ sep x = =\ngToString { PAIR } fx fy sep (PAIR x y) = fx sep +++ sep +++ fy sep\
    \ y\ngToString { EITHER } fl fr sep (LEFT x) = fl sep\ngToString { EITHER } fl\
    \ fr sep (RIGHT x) = fr sep\ngToString { CONS c } fx sep (CONS x)\n| c.gcd_arity\
    \ == 0 = c.gcd_name\n| isEmpty c.gcd_fields = \" +++ c.gcd_name +++ \" \" +++\
    \ + \" x +++ \"\"\n| otherwise = \" \" +++ c.gcd_name +++ \" \" +++ fx +++ \"\
    \ \" x +++ \"\"\ngToString { FIELD f } fx sep (FIELD x) = f.gfd_name +++++ fx\n\
    ```\n\n```\ntoStr :: a -> String | gToString(|*) a\ntoStr x = gToString(|*) \"\
    \ x\n```\n\n## 7.6 Generic Functions and Uniqueness Type\n\nCurrently generic\
    \ support for uniqueness is rudimentary and experimental.\n\nUniqueness is very\
    \ important in Clean. The generic extension can deal with uniqueness. The mechanism\
    \ that generic types for different kinds is extended to deal with uniqueness information.\
    \ Roughly speaking it\n\nThe type of standard mapping for lists with uniqueness:\n\
    `map :: (.a -> .b) [!a] -> [.b]`\n\nGeneric mapping with uniqueness. The instance\
    \ on lists has the same uniqueness typing as the standard\n`generic gMap a b ::\
    \ a -> -> b`\n\nUniqueness information specified in the generic function is used\
    \ in typing of generated code.\n\n## Generated classes\n\n```\nclass gMap[*|]\
    \ t :: .t > .t\nclass gMap[*->|] t :: (.a -> .b) (.t a) -> .t b\nclass gMap(*->*|]\
    \ t :: (.al -> .b1) (.a2 -> .b2) (.t a1 .a2) > .b1 .b2\n```\n\nConstraint limits\
    \ with uniqueness: generated types for higher order types require local uniqueness\
    \ inequalities which are currently not supported.\n\n```\nCounter Example due\
    \ to limitation gMap[*->*] t ::\n(A. (a:a) (b:b) (.a -> .b) -> (f a:a) -> g a:a,\
    \ [f <= a, g <= b]\n(.t f) -> .t .g\n[f <= t, g <= t]\n```\n\n## 7.7 Exporting\
    \ Generic Functions\n\nGeneric declarations and generic cases - both provided\
    \ and derived - can be exported from a module.\nExporting a generic function is\
    \ done by giving the generic declaration in the DCL module. Exporting provided\
    \ and derived\n```\nGenericExport = GenericDef\n| DeriveDef = GenericDef\n```\n\
    ```\nGenericDef = generic TypeName\n|DeriveDef = derive TypeName\n```\n```\nGenericDef\
    \ = generic TypeName\n|DeriveDef = derive TypeName\n```\nExample of exporting\
    \ generic:\n```\ngeneric gMap a b :: a -> b\nderive gMap a b :: (a -> b) (f a)\
    \ -> b\n```\n\n## 8.0 Dynamics\n\n- 8.1 Packing Expressions into a Dynamic\n-\
    \ 8.2 Unpacking Dynamics using a pattern Match\n- 8.3 Safe Communication using\
    \ Dynamics\n- 8.4 Architecture of the implementation\n- 8.5 Semantic Restrictions\
    \ on Dynamics\n\nWhat can you do with \"Dynamics\"? With \"Dynamics\" it is possible\
    \ to store and exchange information. The generic extension can deal with uniqueness.\
    \ The mechanism that generic types for different kinds is extended to deal with\
    \ uniqueness information. Roughly speaking it\n\nThe type of standard mapping\
    \ for lists with uniqueness:\n`map :: (.a -> .b) [!a] -> [.b]`\n\nGeneric mapping\
    \ with uniqueness. The instance on lists has the same uniqueness typing as the\
    \ standard\n`generic gMap a b :: a -> -> b`\n\nUniqueness information specified\
    \ in the generic function is used in typing of generated code.\n\n## Generated\
    \ classes\n\n```\nclass gMap[*|] t :: .t > .t\nclass gMap[*->|] t :: (.a -> .b)\
    \ (.t a) -> .t b\nclass gMap(*->*|] t :: (.al -> .b1) (.a2 -> .b2) (.t a1 .a2)\
    \ > .b1 .b2\n```\n\nConstraint limits with uniqueness: generated types for higher\
    \ order types require local uniqueness inequalities which are currently not supported.\n\
    \n```\nCounter Example due to limitation gMap[*->*] t ::\n(A. (a:a) (b:b) (.a\
    \ -> .b) -> (f a:a) -> g a:a, [f <= a, g <= b]\n(.t f) -> .t .g\n[f <= t, g <=\
    \ t]\n```\n\n## 7.7 Exporting Generic Functions\n\nGeneric declarations and generic\
    \ cases - both provided and derived - can be exported from a module.\nExporting\
    \ a generic function is done by giving the generic declaration in the DCL module.\
    \ Exporting provided and derived\n```\nGenericExport = GenericDef\n|DeriveDef\
    \ = GenericDef\n```\n```\nGenericDef = generic TypeName\n|DeriveDef = derive TypeName\n\
    ```\n```\nGenericDef = generic TypeName\n|DeriveDef = derive TypeName\n```\nExample\
    \ of exporting generic:\n```\ngeneric gMap a b :: a -> b\nderive gMap a b :: (a\
    \ -> b) (f a) -> b\n```\n\n## 8.0 Dynamics\n\n- 8.1 Packing Expressions into a\
    \ Dynamic\n- 8.2 Unpacking Dynamics using a pattern Match\n- 8.3 Safe Communication\
    \ using Dynamics\n- 8.4 Architecture of the implementation\n- 8.5 Semantic Restrictions\
    \ on Dynamics\n\nWhat can you do with \"Dynamics\"? With \"Dynamics\" it is possible\
    \ to store and exchange information. The generic extension can deal with uniqueness.\
    \ The mechanism that generic types for different kinds is extended to deal with\
    \ uniqueness information. Roughly speaking it\n\nThe type of standard mapping\
    \ for lists with uniqueness:\n`map :: (.a -> .b) [!a] -> [.b]`\n\nGeneric mapping\
    \ with uniqueness. The instance on lists has the same uniqueness typing as the\
    \ standard\n`generic gMap a b :: a -> -> b`\n\nUniqueness information specified\
    \ in the generic function is used in typing of generated code.\n\n```\nIn CLEAN\
    \ 2.0 we have a dynamic type system that CLEAN offers a hybrid type system with\
    \ both static and dynamic type. An object of static type can be patched into an\
    \ object of dynamic type (a \"Dynamic\") and backwards. The type of a Dynamic\
    \ can be checked at-run. An application can also check types of static Dynamics\
    \ can be unified with each other, without a need to know what types to manage\
    \ processes and plug-ins (see Van Weelen and Plasmeijer, 2002).\n\nIn this Chapter\
    \ we explain how a Dynamic can be constructed (see 8.1). In Section 8.2 we explain\
    \ how the type of a Dynamic can be inspected by a pattern match, and how one can\
    \ ensure that Dynamics fit together using run-time unification.\n"
  mdcn: "\n\n## 7.4 应用泛型函数\n\nClean 中的泛型函数（generic function）代表一组重载函数。该集合中每种种类（kind）都对应一个函数。当应用泛型函数时，编译器必须从该集合中选择一个重载函数。编译器无法自动推导出所需的\
    \ kind。因此，在每次应用泛型函数时，必须显式地提供一个 kind。在括号 `{` 和 `| }` 之间，可以指定预期的 kind。编译器将像通常一样解析所选函数的重载。\n\
    \n```\nGenericExpression = FunctionName TypeKindExpr\nTypeKind           = {|*|\
    \ }\n```\n\n示例：一个泛型相等运算符可以定义为对 kind 类型的相等。\n`(==) infix 2 :: a -> Bool gEq(|*|)\
    \ a\n`(==) x y = gEq(|*|) x y`\n\n示例：针对函数的映射函数 `fmap` 和针对双函子（bifunctors）的 `bmap`\
    \ 可以通过泛泛型映射函数指定合适的 kind 来定义。\n\n```\nfmap :: (a -> b) (f a) -> gMap(|->*|) f\n\
    fmap x y = gMap(|->*|) f x y\n```\n\n```\nbmap :: (a1 -> a2) (f a1 a2) -> (f b1\
    \ b2) | gMap(|->*|) f\nbmap f1 f2 x y = gMap(|->*|) f1 f2 x y\n```\n\n相等性仅对 kind\
    \ 才有意义。在示例中，我们使用了比较元素的标准方法。\n\n```\neqListFsts :: {(a, b), [a, c]} -> Bool gEq(|*|)\
    \ a\neqqListFsts xs ys = gEq(|*|) (\\x y === fst ys)\n```\n\n```\neqFsts :: {(f,\
    \ a, b), (f a, c)} -> Bool gEq(|->*|) f & gEq(|*|) a\neqqFsts xs ys = gEq(|*|)\
    \ (\\x y === fst y ys)\n```\n\n泛型应用的示例：\n\n```\nStart =\n  ({|*|} [1,2], [2,3])\
    \ // True\n  ([1,2], === [1,2]) // True\n  (gEq(|->*|) (\\x y -> True) [1,2] [4,5,6])\
    \ // True\n```\n\n## 7.5 使用构造函数信息\n\n正如我们所概述的，类型的结构化表示缺乏关于特定构造函数和记录字段的信息，例如名称、元数（arity）等。因为这些信息不是类型结构的一部分：不同类型可以具有相同的结构。然而，某些泛型函数需要这些信息。例如，考虑\
    \ `toString`，它将任何类型的值转换为字符串。它需要打印构造函数的名称。因此，类型的结构化表示通过特殊的构造和字段标记进行了扩展，以便将字段和构造函数的信息传递给泛型函数。\n\
    \n构造函数和字段标记类型的定义（在 `StdGeneric.dcl` 中）。\n\n```\n:: CONS a = CONS a\n:: FIELD a\
    \ = FIELD a\n```\n\n标记本身不包含任何关于构造函数和字段的信息。相反，这些信息被传递给在这些标记上的泛型函数实例。\n\n带有构造函数和字段信息的结构化表示示例：\n\
    \n- ListS a ::= EITHER (CONS UNIT) (CONS PAIR (List a))\n- TreeS ::= EITHER (CONS\
    \ a) (CONS PAIR (Tree a))\n\n- Complex = ( re :: Real, im :: Real )\n- ComplexS\
    \ ::= PAIR (FIELD Real) (FIELD Real)\n\n## GenericTypeArg\n\n```\nCONS of {Pattern}\n\
    FIELD [of {Pattern}]\nTypeConstructorName\nTypeVariable\n```\n\n构造函数和字段描述符的定义（StdGeneric.dcl）。在泛型函数的\
    \ `CASE` 分句中，构造函数描述符传递在 `of` 之后。\n\n- ConsDescriptor\n  gcd_name :: String\n \
    \ gcd_arity :: Int\n\n字段描述符在泛型函数的 `FIELD` 分句中传递在 `of` 之后。\n\n- FieldDescriptor\n\
    \  gfd_name :: String\n\n泛型漂亮打印器。\n\n```\ngeneric gToString a :: String a -> String\n\
    gToString { Int } sep x = toString x\ngToString { UNIT } sep x = =\ngToString\
    \ { PAIR } fx fy sep (PAIR x y) = fx sep +++ sep +++ fy sep y\ngToString { EITHER\
    \ } fl fr sep (LEFT x) = fl sep\ngToString { EITHER } fl fr sep (RIGHT x) = fr\
    \ sep\ngToString { CONS c } fx sep (CONS x)\n| c.gcd_arity == 0 = c.gcd_name\n\
    | isEmpty c.gcd_fields = \" +++ c.gcd_name +++ \" \" +++ + + \" x +++ \"\"\n|\
    \ otherwise = \" \" +++ c.gcd_name +++ \" \" +++ fx +++ \" \" + x +++ \"\"\ngToString\
    \ { FIELD f } fx sep (FIELD x) = f.gfd_name +++++ fx\n```\n\n```\ntoStr :: a ->\
    \ String | gToString(|*) a\ntoStr x = gToString(|*) \" x\n```\n\n## 7.6 泛型函数与唯一类型\n\
    \n目前对唯一性（uniqueness）的泛型支持是初步且实验性的。\n\n唯一性在 Clean 中非常重要。泛型扩展可以处理唯一性。不同 kind 的泛型机制被扩展以处理唯一性信息。粗略来说它\n\
    \n带有唯一性的列表标准映射类型：\n`map :: (.a -> .b) [!a] -> [.b]`\n\n带有唯一性的泛型映射。列表上的实例具有与标准相同的唯一性类型：\n\
    `generic gMap a b :: a -> -> b`\n\n泛型函数中指定的唯一性信息用于生成代码的类型化。\n\n## 生成类\n\n```\n\
    class gMap[*|] t :: t\n```\n"
