    \n```\nclass Arith a\nwhere\n(+) infixl 6::: a -> a\n(-) infixl 6::: a -> a\n\
    ```\n\nExample. Classes can have several type variables.\n\n```\nclass Arith a\
    \ b c\nwhere\n(::) infixl 6::: a -> b -> c\n```\n\nWith an instance declaration\
    \ an instance of a class can be defined (this is similar to the creation of a\
    \ dictionary record). When the instance is made one has to specify for which concrete\
    \ type an instance is created. For each overloaded function in the class an instance\
    \ of the overloaded function or operator has to be defined. The instance can be\
