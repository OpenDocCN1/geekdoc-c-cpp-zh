    \ = {re=r1+r2,im=im1+i2}\n```\n\n编译器会解箱化（unboxes）记录以使生成的代码更高效。在某些情况下这种效率较低，例如抽象数据类型、可以在原地更新的大型唯一记录或记录被共享时。因此，通过在记录类型定义中的\
    \ `{` 之前添加一个 `!`，可以防止解箱。\n\n## 5.2.1 创建记录与记录字段的选择\n\n记录是一种类似于元组的代数数据结构，其优点可以通过字段名而不是位置来选择它的元素。\n\
    \n```\nRecord = RecordDenotation\n      | RecordUpdate\n```\n\n## 简单记录\n\n创建记录的第一种方法是显式为其每个字段定义一个值。\n\
