    # 基础语义


    ## 1.1 图重写


    ## 1.2 全局图


    CLEAN 的语义基于项图重写系统 (Barendregt, 1987; Plasmeijer and Van Eekelen, 1993)。这意味着 CLEAN
    程序在语义上是针对图运行的，而不是通常的项。这使得我们能够整合 CLEAN 的典型特征（循环数据结构的定义，如复制、唯一性类型），否则要为这些特征获得适当的语义将非常困难。然而，在许多情况下，程序员不需要意识到自己正在操纵图。CLEAN
    程序的评估方式与其他函数式语言相同。CLEAN 与其他函数式语言的区别之一在于，当变量在函数体中出现多次时，语义规定实际参数是共享的（大多数其他语言的语义并未规定这一点，尽管这是函数式语言实现中的常见做法）。此外，一个标签可以使循环结构的定义成为可能。熟悉其他函数式语言的人编写
    CLEAN 程序将没有问题。（注：原文在此处存在大量重复段落，翻译已按逻辑去重并整合）。


    ***


    此外，一个标签可以使循环结构的定义成为可能。熟悉其他函数式语言的人编写 CLEAN 程序将没有问题……（此处省略重复内容）


