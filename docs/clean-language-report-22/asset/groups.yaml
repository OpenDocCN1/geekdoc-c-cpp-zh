    # Uniqueness Typing


    - 9.1 Basic Ideas behind Uniqueness Typing

    - 9.2 Attribute Propagation

    - 9.3 Defining New Types with Uniqueness Attributes

    - 9.4 Uniqueness and Sharing

    - 9.5 Combining Uniqueness Typing and Overloading

    - 9.6 Higher-Order Type Definitions

    - 9.7 Destructive Updates using Uniqueness Typing


    Although CLEAN is purely functional, operations with side-effects (I/O operations)
    are permitted. To achieve this without violating the semantics, the classical
    types are supplied with so unique attributes. If an argument of a function is
    indicated as unique, it is guaranteed that at run-time the actual object is local,
    i.e. there are no references to it. Clearly, a destructive update of such a "unique
    object" can be performed safely.


    The uniqueness type system makes it possible to define direct interfaces with
    an operating system, a type system (updating persistent data), with GUI''s libraries,
    it allows to create arrays, records or user data structures that can be updated
    destructively. The time and space behavior of a functional program therefore greatly
    benefits from the uniqueness typing.


    Uniqueness types are deduced automatically. Type attributes are polymorphic: attribute
    variables and inequalities on these variables can be used to indicate relations
    and restrictions on the concrete attribute value.


    Sometimes the inferred attributes give some extra information on the run-time
    behavior of a function. The uniqueness type system is a transparent extension
    of classical typing that means if one is not interested in uniqueness information
    one can simply ignore it.


    Since the uniqueness typing is a rarer complex matter we explain this type system
    and the motivation behind it in detail. The first Section (9.1) explains the basic
    motivation and ideas behind uniqueness typing. Section 9.2 focuses on the so-called
    uniqueness propagation property of (algebraic) type constructors. When we show
    how data structures are defined containing unique objects (Section 9.3). Section
    9.4 decribes the effect of sharing on uniqueness types. To maintain referential
    transparency, it appears that function types have to be treated specially. The
    last Section 9.5 describes the combination of uniqueness typing and overloading.
    Especially, the subsections on constructors and higher-order type definitions
    are very complex: we suggest that the reader skips these sections at first instance.


    ## 9.1 Basic Ideas behind Uniqueness Typing


    The uniqueness typing is an extension of Milner/Mycroft typing. In the uniqueness
    system unique attributes are attached to the classical types. Uniqueness attributes
    appear in the type specifications of functions (see 9.4) but are also permitted
    in the definitions of new data types (see 9.3). A classical type can be prefixed
    by one of the following uniqueness type attributes:


    | Type | {BrackType} |

    | :--- | :--- |

    | BrackType | [UniversalQuantVariables] [Strict] |


    ### UnqTypeAttr


    [UnqTypeAttr] SimpleType

    // type attribute "unique"

    UniqueTypeVariable: // a type attribute variable

    // an anonymous type attribute

    ```


    The basic idea behind uniquing is the following. Suppose a function, F, has a
    unique argument (argument with type *σ, for some σ). This attributes an additional
    restriction on applications of F.


    It is guaranteed that F will have private (''unique'') access to this particular
    argument (Barendsen and Smeters, 1993; Plasmjeir and Van Eelen, 1993); the object
    will have a reference count of 1 at the moment it is inspected by the function.
    It is important to know that there can be more than 1 reference to the object
    before specific access takes places. If a uniquely typed object is not used to
    construct the result it will become garbage (reference dropped to zero). Due to
    the fact that this analysis is performed statically the object can be garbage
    collected (see Chapter 1) at compile-time. It is harmless to reuse the space occupied
    by the argument to create the function result. In other words: it is allowed to
    update the unique object destruct any consequences for referential transparency.


    Example: The I/O library fwritec is used to write a character to a file yielding
    a new result. In general it is not allowed to overwrite the file with the given
    character to construct the result. However, by demanding the argument file to
    be unique by specifying


    ```

    fwritec:: *File -> *File

    ```


    It is guaranteed by the type system that fwritec has private access to the file
    such that overwriting the file can be done without violating the functional semantics
    of the program. The resulting file is unique and can be passed as continuation
    to another call of e.g. fwritec making further writing possible.


    ```

    WriteABC:: *File -> *File

    WriteABC file = fwritec ''c'' (fwritec ''b'') (fwritec ''a'' file)

    ```


    Observe that a file is unique in a single threaded (as a kind of unique token)
    from one function to another each function can modify the file knowing that it
    has private access to the file.


    One can make these intermediate files more visible by writing the WriteABC as
    follows.


    ```

    WriteABC file = file3

    where

    file1 = fwritec ''a'' file

    file2 = fwritec ''b'' file1

    file3 = fwritec ''c'' file2

    ```


    or, alternatively (to avoid the explicit numbering of the files),


    ```

    WriteABC file

    # file = fwritec ''a'' file

    file = fwritec ''b'' file

    = fwritec ''c'' file

    ```


    The type system makes it possible to make no distinction between a CLEAN file
    and a physical file of the real world: file I/O can be treated effectively as
    in imperative languages. The uniqueness prevents writing while other readers/writers
    are active. One cannot only apply fwritec to a file being used elsewhere.


    For instance, the following expression is not approved by the type system:


    ```

    (file, fwritec ''a'' file)

    ```


    Function arguments with uniqueness attributes added to the classical types are
    considered as "unique": there are no reference requirements for these arguments.
    The function is only allowed to read access (as usual in a functional language)


    ```

    fread:: -> (Char, File)

    ```


    can be applied to both unique and non-unique files. In the first case the resulting
    file is also unique and can, for example, be used for further reading or writing.
    This is fine since.


    To indicate that functions don''t change uniqueness properties of arguments, one
    can use attribute variables.


    The simplest example is the identity function that can be typed as:


    ```

    id: u:a -> u:a

    id x = x

    ```


    Here is an ordinary type variable, whereas u is an attribute variable. If id is
    applied to a unique object the result is also unique (in case u is instantiated
    with the concrete attribute). Of course, if id is applied to a non-unique object,
    the result remains non-unique. As ordinary type variables, attribute variables
    should be instantiated uniformly.


    A more example is the function fread that is typed as


    ```

    fread: u:File -> u:(Char, u:File)

    ```


    Again fread can be applied to both unique and non-unique files. In the first case
    the resulting file is also unique and can, for example, be used for further reading.
    Moreover, observe that not only the resulting file is attributed, but also the
    tuple containing that file and the character that has been read. This is due to
    the so called uniqueness propagation rule; see below.


    To summarize, uniqueness typing makes it possible to update objects destructively
    within a purely functional language. For the development of real world applications
    (which manipulate files, windows, arrays, databases, etc.) this is an indispensable
    property.


    ## 9.2 Attribute Propagation


    Having explained the general ideas of uniqueness typing, we can now focus on some
    details of this typing system.


    If a unique object is stored in a data structure, the data structure itself becomes
    unique as well. uniqueness propagation rule prevents unique objects are shared
    indirectly via the data structure in which these objects are stored. To explain
    this form of hidden sharing, consider the following definition of the function
    head


    ```

    head: [*a] -> *a

    head [hd:tl] = hd

    ```


    The pattern causes head to access to the ''deeper'' elements hd and tl. Note that
    head does not have any uniqueness requirements on its list argument. This means
    that in an application of the head list might be shared, as can be seen in the
    following function heads


    ```

    heads list = (head list, head list)

    ```

