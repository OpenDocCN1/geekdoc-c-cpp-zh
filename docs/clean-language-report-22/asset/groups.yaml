    # 8.1.1 Packing Abstract Data Types


    Certain types simply cannot be packed into a Dynamic for fundamental reasons.
    Examples are examples of abstract predefined type that have a special meaning
    in the real world, such as objects of type World and type File. It is not sound
    to pack objects of these types into a Dynamic, because their real counterpart
    cannot be packed and stored.


