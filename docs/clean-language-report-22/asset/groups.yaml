    \ A constant function is just a function defined with zero arg [see 3.1].\n\n\
    The garbage collector will collect locally defined graphs when they are no longer\
    \ connected to the root of the program (see Chapter 1).\n\n## 3.6 Selectors\n\n\
    The left-hand side of a graph definition can be a simple name, but is also be\
    \ more complicated pattern called a selector. A selector is a pattern that introduces\
    \ one or more selector variables implicitly defining projection functions to identify\
    \ (parts of) a graph being defined. One can identify the graph as a whole or can\
    \ identify its components. A selector can contain constants (also user defined\
    \ introduced by algebraic type definitions), variables and wildcards. With a wildcard\
    \ one can indicate that one is not interested in certain components.\n\nSelectors\
