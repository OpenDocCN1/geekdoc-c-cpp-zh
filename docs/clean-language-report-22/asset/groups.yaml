    \ \"Overloading error [...]: no instance of type [a].\" The CLEAN 2.x compiler\
    \ applies no unification after resolving overloading. So c is in function f applied\
    \ to a list with a polymorph type [a]. And this is considered to be different\
    \ from the instance type [Int]. If you f the type [Int] -> [Int] the upper code\
    \ will be accepted.\n\nCLEAN 2.x handles uniqueness attributes in type synonyms\
    \ different than CLEAN 1.3.x. Consider the following definitions:\n\n```\n:: ListList\
    \ a := [[a]]\nf :: *(ListList {Int}) -> *(Int)\nf [[a]] = { a & [0]=0 }\n```\n\
    \nIn CLEAN 1.3.x the ListList type synonym was expanded to\n\n```\nf :: **[Int]]\
    \ -> *(Int)\n```\n\nwhich is correct in CLEAN 1.3.x. CLEAN 2.x expands it to\n\
    \n```\nf :: **[Int]] -> *(Int)\n```\n\nThis yields a uniqueness error in CLEAN\
    \ 2.x because the inner list is shared but contains a unique object. This problem\
    \ happens only when type synonyms have attributes like \"inbetween\". An \"inbetween\"\
    \ attribute is neither the \"root\" nor the attribute of an actual argument. E.g.\
    \ with the upper type synonym, the formal argument \"a\" is substituted with {Int}.\
    \ Note that the \"a\" is substituted for \"a\". Because we wrote (ListList ...)\
    \ the root attribute is \"*. The result of expanding (ListList {Int}) is [u:[*{Int]].\
    \ \"u\" is an attribute \"inbetween\" because it is neither the root nor the attribute\
    \ of a formal argument. Such attributes are made _not_unique in CLEAN 2.x and\
    \ this is why the upper is not accepted. The code would be accepted if you redefine\
    \ ListList to\n\n```\n:: ListList a := [[a]]\n```\n\nAnonymous uniqueness attributes\
    \ in type contexts are not allowed in CLEAN 2.x. So in the following function\
    \ type simply remove the point.\n\n```\nf :: a | myClass .a\n```\n\nThe String\
    \ type has become a predefined type. As a consequence you cannot import this type\
    \ explicitly anymore. So:\n\n```\nfrom String import :: String\n```\n\nis not\
    \ valid.\n\nThere was a bug in the uniqueness typing system of CLEAN 1.3: Records\
    \ or data constructors could haveentially quantified variables, whose uniqueness\
    \ attribute did _not_ propagate. This bug has"
  - "[PAGE 13]\n\nsolved in CLEAN 2.x. As a consequence, the 2.x compiler might complain\
    \ about your program where the 1.3 compiler was happy. The problem might occur\
    \ when you use the I/O library or you use objects with a uniquely attributed local\
    \ state. Now the object becomes unique as well and may not be shared anymore.\n\
    \n# Differences in the Module System\n\nThe syntax and semantics of explicit import\
    \ statements have been completely revised. With CLEAN 2.x it is possible to discriminate\
    \ the different namespaces in import statements. In CLEAN 1.3.x with the following\
    \ statement\n\n```\nfrom m import F\ncould have the import of a function F together\
    \ with a type F and a class F with all its instances from m. In CLEAN 2.x one\
    \ can precisely describe from which space one wants to import (see 2.5.2). For\
    \ example, the following import statement\n```\n\n```\nfrom m import F,\n:: T1;\
    \ :: T2(..), :: T3(C1, C2), :: T4(..), :: T5(field1, field2),\n  class C1, class\
    \ C2(..), class C3 (mem1, mem2)\n```\n\ncauses the following declarations to be\
    \ imported: the function or macro F, the type T1, the algebraic type T2 with all\
    \ its constructors that are exported by m, the type T3 with it's constructors\
    \ C1 and C2, the record type T4 with all its fields that are exported by m, the\
    \ record type T5 with its fields field1 and field2, the class C1, the class C2\
    \ with all it's members that are exported by m, the class C3 with all it's members\
    \ mem1 and mem2.\n\nThere is a tool \"CopPort\" that is available to automatically\
    \ convert CLEAN sources with 1.3.x import syntax to using 2.x syntax.\n\nPrevious\
    \ Releases. The first release of CLEAN was publicly available in 1987 and had\
    \ version number 0.5 (with half of the work was done; -). At that time, CLEAN\
