    top（既是正又是负）。通常，这是通过分析（可能的相互递归）代数类型定义，其基础符号 sign(->)=(-,+）得到的。


    示例：a 的符号为 T，b 的符号为 +


    ```clean

    ::FunList a b = Cons (a -> b) | Nil

    ```


    CLEAR 系统在重载函数的类型规范中显式指示可能的属性。为了获得产生唯一数据结构的 map 版本，其重载类型指定如下：


    ```clean

    class map m:: (.a ->.b).(m a) ->. (b)

    ```


