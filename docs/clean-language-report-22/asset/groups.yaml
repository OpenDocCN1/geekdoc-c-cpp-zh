    # 6.1 Type Classes


    In a type class definition one gives a name to a set of overloaded functions (this
    is similar to the definition of a type of the dictionary record as explained above).
    For each overloaded function or operator which is a member of the class overloaded
    name and its overloaded type is specified. The type class variables are used to
    indicate how the different instantiations of the class vary from each other. CLEAN
    2.0 offers multi-parameter type constructor classes, similar to those available
    in Haskell.


    ```

    class ClassName TypeVariable+ [ClassContext]

    [where] :: {ClassMemberDef}+;

    class FunctionName Variable+ :: FunctionType;

    class (FunctionName) [Fix][Prec] TypeVariable+ :: FunctionType;

    ```


    ```

    ClassMemberDef = FunctionType

    [MacroDef]

    ```


    Example of the definition of a type class; in this case the name Arith contains
    two overloaded operators.


    ```

    class Arith a

    where

    (+) infixl 6::: a -> a

    (-) infixl 6::: a -> a

    ```


    Example. Classes can have several type variables.


    ```

    class Arith a b c

    where

    (::) infixl 6::: a -> b -> c

    ```


    With an instance declaration an instance of a class can be defined (this is similar
    to the creation of a dictionary record). When the instance is made one has to
    specify for which concrete type an instance is created. For each overloaded function
    in the class an instance of the overloaded function or operator has to be defined.
    The instance can be found via uniform substitution of the type class variables
    by the corresponding type specified in the instance definition.


    ```

    TypeClassInstanceDef = instance ClassName Type+ [ClassContext]

    [where] ([DefFunction]+) // in implementation modules

    [special] {TypeVariable = Type} // in definition modules

    ```


    Example of the definition of an instance of a type class Arith for type Int. The
    type of the concrete functions can be obtained via uniform substitution of the
    type variable in the class definition by the corresponding type specified in the
    instance definition. One is not obliged to repeat the type of the concrete functions
    (not the free fix or associativity in the case of operators).


    ```

    instance Arith Int

    where

    (+): Int Int -> Int

    (+) x y = x ^ y

    (-):: Int Int -> Int

    ```'
