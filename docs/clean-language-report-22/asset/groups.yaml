  - "[PAGE 33]\n\nguard is a Boolean expression attached to a rule that can be regarded\
    \ as generalisation of the pattern matching mechanism: the alternative only matches\
    \ the patterns defined on the left hand-side match and its (optional) guard evaluates\
    \ to True (see 3.1). Otherwise the next alternative of the function is tried.\
    \ Pattern matching takes place before the guards are evaluated.\n\nThe guards\
    \ are tried in textual order. The alternative corresponding to the first guard\
    \ that yields True will be evaluated. A right-hand side without a guard is regarded\
    \ to have a guard that evaluates to True (the 'otherwise' or 'default' case).\
