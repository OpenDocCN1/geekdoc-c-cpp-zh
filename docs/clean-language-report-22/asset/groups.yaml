    \ Naming Conventions of Identifiers\n### 2.1.2 Scopes and Name Spaces\n### 2.1.3\
    \ Nesting of Scopes\n### 2.2 Modular Structure of Clean Programs\n### 2.3 Implementation\
    \ Modules\n### 2.3.1 The Main or Start Module\n- I/O Using the Console\n- I/O\
    \ on the Unique World\n### 2.3.2 Scope of Global Definitions in Implementation\
    \ Modules\n### 2.3.3 Begin and End of a Definition: the Layout Rule\n### 2.4 Definition\
    \ Modules\n### 2.5 Importing Definitions\n### 2.5.1 Explicit Imports of Definitions\n\
    ### 2.5.2 Implicit Imports of Definitions\n### 2.6 System Definition and Implementation\
    \ Modules\n\n## 3 DEFINING FUNCTIONS AND CONSTANTS\n### 3.1 Functions\n### 3.2\
    \ Patterns\n### 3.3 Guards\n### 3.4 Expressions\n### 3.4.1 Lambda Abstraction\n\
    ### 3.4.2 Case Expression and Conditional Expression\n### 3.5 Local Definitions\n\
    ### 3.5.1 Let Expression: Local Definitions in Expressions\n### 3.5.2 Where Block:\
    \ Local Definitions in a Function Alternative\n### 3.5.3 With Block: Local Definitions\
    \ in a Guarded Alternative\n### 3.5.4 Let-Before: Local Constants defined between\
    \ Guards\n### 3.6 Defining Constants\n### 3.6.1 Selectors\n### 3.7 Typing Functions\n\
    ### 3.7.1 Typing Curried Functions\n### 3.7.2 Typing Operators\n### 3.7.3 Typing\
    \ Partial Partials\n### 3.7.4 Explicit use of the Universal Quantifier in Function\
    \ Types\n### 3.7.5 Functions with Strict Arguments\n\n## 4 PREDEFINED TYPES\n\
    ### 4.1 Basic Types: Int, Real, Char and Bool\n### 4.1.1 Creating Constant Values\
    \ of Basic Type\n### 4.1.2 Patterns of Basic Type\n### 4.2 Lists\n### 4.2.1 Creating\
    \ Lists\n- Lazy Lists\n- Strict, Unboxed and Overloaded Lists\n- DotDot Expressions\n\
    - List Comprehensions\n### 4.2.2 List Patterns\n### 4.3 Tuples\n### 4.3.1 Creating\
    \ Tuples\n### 4.3.2 Tuple Patterns\n### 4.4 Arrays\n### 4.4.1 Creating Arrays\
    \ and Selection of field Elements\n- Simple Array\n- Array Update and Array Comprehensions\n\
    - Selection of an Array Element\n### 4.4.2 Array Patterns\n### 4.5 Predefined\
    \ Type Constructors\n### 4.6 Arrow Types\n### 4.7 Predefined Abstract Types\n\n\
    ## 5 DEFINING NEW TYPES\n### 5.1 Defining Algebraic Data Types\n### 5.1.1 Using\
    \ Constructors in Patterns\n### 5.1.2 Using Higher Order Types\n### 5.1.3 Defining\
    \ Algebraic Data Types with Existentially Quantified Variables\n### 5.1.4 Defining\
    \ Algebraic Data Types with Universally Quantified Variables\n### 5.1.5 Strictness\
    \ Annotations in Type Definitions\n### 5.1.6 Semantic Restrictions on Algebraic\
    \ Data Types\n### 5.2 Defining Record Types\n### 5.2.1 Creating Records and Selection\
    \ of Record Fields\n- Simple Records\n- Record Update\n- Selection of a Record\
    \ Field\n### 5.2.2 Record Patterns\n### 5.3 Defining Synonym Types\n### 5.4 Defining\
    \ Abstract Data Types\n### 5.4.1 Defining Abstract Data Types with Synonym Type\n\
    \n## 6 OVERLOADING\n### 6.1 Type Classes\n### 6.2 Functions Defined in Terms of\
    \ Overloaded Functions\n### 6.3 Instances of Type Classes in Terms of Overloaded\
    \ Functions\n### 6.4 Type Constructor Classes\n### 6.5 Overlapping Overloading\n\
    ### 6.6 Internal Overloading\n### 6.7 Defining Members in a Class\n### 6.8 Shorthand\
    \ for Defining Overloaded Functions\n### 6.9 Classes Defined in Terms of Other\
    \ Classes\n### 6.10 Exporting Type Classes\n### 6.11 Semantic Restrictions on\
    \ Type Classes\n\n## 7 GENERIC PROGRAMMING\n### 7.1 Basic Ideas Behind Generic\
    \ Programming\n### 7.2 Defining Generic Functions\n### 7.3 Deriving Generic Functions\n\
    ### 7.4 Applying Generic Functions\n### 7.5 Using Constructor Information\n###\
    \ 7.6 Generic Functions and Uniqueness Typing\n### 7.7 Exporting Generic Functions\n\
    \n## 8 DYNAMICS\n### 8.1 Packing Expressions into a Dynamic\n### 8.1.1 Packing\
    \ Abstract Data Types\n### 8.1.2 Packing Overloaded Functions of Unique Type\n\
    ### 8.1.3 Packing Expressions of Unique Type\n### 8.1.4 Packing Arguments of Unknown\
    \ Type\n### 8.1.5 Using Dynamic Typing to Defeat the Static System\n### 8.2 Unpacking\
    \ Dynamics Using a Match\n### 8.2.1 Unpacking Abstract Data Types\n### 8.2.2 Unpacking\
    \ Overloaded Functions\n### 8.2.3 Unpacking Expressions of Unique Type\n### 8.2.4\
    \ Checking and Unifying Types using Type Variables\n### 8.2.5 Checking and Unifying\
    \ Types using Overloaded Variables\n### 8.3 Safe Communication using Dynamics\n\
    ### 8.4 Architecture of the implementation of Dynamics\n### 8.5 Semantic Restrictions\
    \ on Dynamics\n\n## 9 UNIQUESS TYPING\n### 9.1 Basic Ideas behind Uniqueness Typing\n\
    ### 9.2 Attribute Propagation\n### 9.3 Defining New Types with Uniqueness Attributes\n\
    ### 9.4 Uniqueness and Sharing\n### 9.4.1 Higher Order Uniqueness Typing\n###\
    \ 9.4.2 Uniqueness Coercions\n### 9.5 Combining Uniqueness Typing and Overloading\n\
    ### 9.5.1 Constructor Classes\n### 9.6 Higher-Order Type Definitions\n### 9.7\
    \ Destructive Updates using Uniqueness Typing\n\n## 10 STRICTNESS, MACROS AND\
    \ EFFICIENCY\n### 10.1 Annotations to Change Lazy Evaluation into Strict Evaluation\n\
    ### 10.1.1 Advantages and Disadvantages of Lazy versus Strict Evaluation\n###\
    \ 10.1.2 Strict and Lazy Context\n### 10.1.3 Space Consumption in Strict and Lazy\
    \ Context\n### 10.1.4 Time Consumption in Strict and Lazy Evaluation\n### 10.1.5\
    \ Changing Lazy into Strict Evaluation\n### 10.2 Defining Graphs on the Global\
    \ Level\n### 10.3 Defining Macros\n### 10.4 Efficiency Tips\n\n## 11 FOREIGN LANGUAGE\
    \ INTERFACE\n### 11.1 Foreign Export\n### 11.2 Using ABC\n\n## CONTEXT-FREE SYNTAX\
    \ DESCRIPTION\n### A.1 Clean Program\n### A.2 Import Definition\n### A.3 Function\
    \ Definition\n### A.3.1 Types of Functions\n### A.3.2 Patterns\n### A.3.3 Graph\
    \ Expressions\n### A.4 Macro Definition\n### A.5 Type Definition\n### A.5.1 Type\
    \ Expression\n### A.6 Class and Generic Definitions\n### A.7 Foreign Export Definition\n\
    ### A.8 Names\n### A.9 Denotations\n\n## LEXICAL STRUCTURE\n### B.1 Lexical Program\
    \ Structure\n### B.2 Comments\n### B.3 Reserved Keywords and Symbols\n\n## BIBLIOGRAPHY\n\
    \n# Preface\n\n- Introduction\n- More Information on Clean\n- About this Language\
    \ Report\n- Some Remarks on the Clean Syntax\n- Notational Conventions Used in\
    \ this Report\n- How to Obtain Clean\n- Current State of the Clean System\n- Copyright,\
    \ Authors and Credits\n- Final Remarks\n\nIntroduction\n\nCLEAN is a practical\
    \ applicable general-purpose lazy functional language suited for the development\
    \ of real world applications.\n\nCLEAN has many features among which some very\
    \ special ones.\n\nFunctional languages are usually implemented using graph-rewriting\
    \ techniques. CLEAN has explicit graph semantics; one can explicitly define the\
    \ sharing of structures (cyclic structures as well) in the language (Barendregt\
    \ et al., 1987; Sleep et al., 1993, Eekelen et al., 1997). This provides a better\
    \ framework for controlling the time behavior of functional programs.\n\nOf particular\
    \ importance for practical use is CLEAN's Uniqueness Type System (Barendsen and\
    \ Smeters, 1993a) enabling the incorporation of destructive updates of arbitrary\
    \ objects within a pure framework and the creation of direct interfaces with the\
    \ outside world.\n\nCLEAN's \"unique\" features have made it possible to define\
    \ (in CLEAN) a sophisticated and efficient I/O library (Achten and Plasmijer,\
    \ 1992 & 1995). The Clean I/O library enables I/O operations with a high level\
    \ of abstraction. One can define callback functions and I/O components with arbitrary\
    \ local states providing an object-oriented style of programming (Achten, 1996;\
    \ Achten and Plasmijer, 1997). The library forms a platform independent interface\
    \ to window-based systems: one can port window I/O operations in CLEAN to different\
    \ platforms (support Mac and PC) without modification of source code.\n\nAlthough\
    \ CLEAN is by default a lazy language one can smoothly turn it into a strict language\
    \ to obtain time/space behavior: functions can be defined lazy as well as (partially)\
    \ strict in its arguments; (recursive) data structure can be defined lazy as well\
    \ as (partially) strict in any of its arguments.\n"
