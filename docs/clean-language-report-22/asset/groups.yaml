    The programmer provides a set of basic cases for a generic function. Based on
    its basics generic function can be derived for other types. The next section for
    detailed discussion on types for which a generic function can and cannot be derived.
    Here we discuss what can be specified as the type argument in the definition of
    a generic base case


    +   - Generic structural representation type. UNIT, PAIR, EITHER, CONS and FIELD.
    The programmer must always derive these types as they cannot be derived by the
    compiler. Without these cases a generic function cannot be derived for basically
    any type.

    - Basic type. If a generic function is supposed to work on types that involve
    basic types, instances of basic types must be derived.

    - Type variable. Type variable stands for all types of kind *. If a generic function
    has a case for a type variable it means that by all types of kind star will be
    handled by that instance. The programmer can override the default behavior by
    defining an instance on a specific type.

    - Arrow type (->). If a generic function is supposed to work with types that involve
    the arrow type, an instance on the arrow type must be provided.

    - Type constructor. A programmer may provide instances on other types. This may
    be needed for two reasons.


    +   1. The instance cannot be derived for the reasons explained in the next section.

    2. The instance can be generated, the programmer is not satisfied with generic
    behavior for this type and wants to provide a specific behavior.


    # 7.3 Deriving Generic Functions


    The user has to tell the compiler instances of generic functions on which types
    are to be generated. This is done with the derive.


    ```

    DeriveDef = derive FunctionName TypeConstructorName+

    ```


    Derive instances of generic mapping and generic equality for List, Tree, []

    drive eQ List, Tree, []

    drive gMap List, Tree, []


    A generic function can be automatically specialized to algebraic types that are
    not abstract in the module where the derive directive is given. Generic structure
    representation types: PAIR, EITHER, UNIT, CONS, FIELD. Also see the previous section.
    It is possible to derive instances for these types automatically because they
    are useful to build structural representation of types that is needed to derive
    an. Deriving instances for then would yield non-terminating cyclic functions.
    Instances on these types must be provided for the user. Derived instances of algebraic
    types call these instances.


    +   - Arrow type (->). An instance on the arrow type must be provided by the programmer,
    if he or she wants the generic function to work with types containing arrows.

    - Basic types like Int, Char, Real, Bool. In principle it is possible to derive
    all basic types as algebraic types but would be very inefficient. The user can
    provide a defined instance on a basic type.

    - Array types as they are of not types. The user may in steadad derive a generic
    function for the types involved on the right-hand side of a synonym type definition.

    - Abstract types. The compiler does not know the structure of an abstract data
    type to derive the instance.

    - Quantified types. The programmer has to manually provide instances for type
    definitions with universal and existential quantification.


    The compiler issues an error if there is no required instance for a type available.
