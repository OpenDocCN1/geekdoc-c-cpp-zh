- md: "\nconstructors. For instance, list used in a selector pattern needs to be of\
    \ [a]; [a] cannot be used because it stands for [a[]] implementing a test on the\
    \ arity constructor []. If the pattern is a record only those fields which one\
    \ is interested in to be indicated in the pattern. Arrays cannot be used as a\
    \ selector. Selectors cannot be defined globally.\n\n## 3.7 Typing Functions\n\
    \nAlthough one is in general not obligated to explicitly specify the type of a\
    \ function (CLEAN compiler can in general *infer* the type) the explicit specification\
    \ of the type is **highly recommended** to increase the readability of the program.\n\
    \n```\nFunctionDef        = [FunctionDef]\n                              DefFunction\n\
    FunctionTypeDef  = FunctionName : Function Type;\n                           \
    \   (FunctionName) [Fix][Prec] [:: FunctionType];\nFix               = infix1\n\
    \                              infix\n                              infix\nPrec\
    \              = Digit\nFunctionType     = Type -> [ClassContext][UnqTypeUnequalities]\n\
    Type             = [Bracket]+\nBrType          = [UniversalVariables][UnqTypeUnequalities]\n\
    UniversalVariables = A.Type\nSimpleType = Type\n```\n\nAn explicit specification\
    \ is **required** when a function is exported, or when the programmer wants to\
    \ make additional restrictions on the application of the function (e.g. a more\
    \ restricted type can be defined as explained in Chapter 7). The CLEAN system\
    \ uses a combination of Milner/Wright system which ensures that in some cases\
    \ is not capable to infer the type of a function (using Milner/Hindley system;\
    \ Eek, 1993). When universally quantified types are used (see 3.7), explicit typing\
    \ by the programmer is required.\n\nThe Cartesian diagram is used for the specification\
    \ of function type. The diagram is denoted by juxtaposition of arguments. For\
    \ the single argument the brackets can be left out. In type specifications the\
    \ binding priority of application is higher than that of arrow.\n\n- The function\
    \ symbol before the double colon should be the same as the function symbol of\
    \ the corresponding rule.\n- The arity of the functions has to correspond with\
    \ the number of arguments of which the Cartesian product is taken. So in CLEAN\
    \ one can tell the arity of the function by its type. Showing how arity of a function\
    \ is reflected in:\n\n```\nmap: (a->b) [a] -> [b]                            \
    \   // map has arity 2\nmap f = []\nmap f (x:xs) = f x : map xs\ndomap: (a->b)\
    \ [a] -> [b]                               // domap has arity 2\n```\n\nThe specification\
    \ of a locally defined function cannot refer to a variable introduced in the type\
    \ specification of a surrounding function (there is not scope on definitions).\
    \ The grammar cannot specify the type of such a function. The type will be inferred\
    \ and checked (after it is lifted by the compiler to the global level) by the\
    \ type system.\n\n**Counter example** (illegal type specification). The function\
    \ $g$ returns a tuple. The type of the first element is the same as the argument\
    \ of $f$. Such a dependency (indicated here by \"~\") cannot be specified.\n\n\
    ```\nf :: a -> (a,a)\nf x = g x\nwhere\n  // g :: b -> (a,b)\n  y = (x,y)\n```\n\
    \n### 3.7.1 Curried Functions\n\nIn CLEAN all symbols (functions and constructors)\
    \ are defined with *fixed arity*. However, in an application it is allowed to\
    \ apply to an arbitrary number of arguments. A *curried application* of a function\
    \ is an application of a function with a number of arguments which is less than\
    \ its arity (note that in CLEAN a function can be derived from its type). With\
    \ the aid of the predefined internal function a curried function applied on the\
    \ required number of arguments is transformed into an equivalent curried function.\n\
    \nThe type axiom of the CLEAN type system include for all $s$ defined with arity\
    \ $n$ the equivalence of $s :: (t2 \\dots tn)$ with $s :: (t1 \\to t2 \\dots tn)$.\n\
    \n### 3.7.2 Typing Operators\n\nAn *operator* is a *function* with arity two that\
    \ can be used in infix position. An operator can be defined by enclosing the operator\
    \ name between parentheses in the left-side of the function definition. An operator\
    \ has a *precedence* (0 through 9, default 9) and a *fixity* (*infix, infixr*\
    \ or just *infix*, default *infix*). A higher precedence binds more tightly. When\
    \ operators have equal precedence, the fixity determines the priority. In an expression\
    \ ordinary function application always has the highest priority (10). See also\
    \ Section 3.1 and 3.4.\n\n- The type of an operator must obey the requirements\
    \ for typing functions with arity two.\n- If the operator is explicitly typed\
    \ the operator name should also be put between parentheses in the type rule.\n\
    - When an infix fixity is enclosed in parentheses it can be applied as a prefix\
    \ function. Possible recursive definitions of the newly defined operator on the\
    \ right-side also follow this convention.\n\nExample of an operator and its definition:\n\
    \n```\n(c) infix 8 :: (x -> y) (z -> x) -> (z -> y) // function composition\n\
    (c) f g = \\x -> f (g x)\n```\n\n### 3.7.3 Typing Partial Functions\n\nPatterns\
    \ and guards imply a condition that has to be fulfilled before a rewrite rule\
    \ can be applied (see 3.2 3.3). This makes it possible to define *partial function*\
    \ $s$, functions which are not defined for all possible values of the specified\
    \ type.\n\nWhen a partial function is applied to a value outside the domain for\
    \ which the function is defined it will result in a run-error. The compiler gives\
    \ a warning when functions are defined which might be partial.\n\nWith the abort\
    \ expression (see StdMisc::dcl) one can change any partial function into a total\
    \ function (the abort expression can have any type). The abort expression can\
    \ be used to give a user-defined run-time message.\n\nUse of abort to make a function\
    \ total.\n\n```\nfac:: Int -> Int\nfac 0 = 1\nfac n = n * fac (n - 1)\notherwise\
    \ = abort \"fac called with negative number\"\n```\n\n## 3.7.4 Explicit use of\
    \ Universal Quantifier in Function Types\n\nWhen a type of polymorphic function\
    \ is specified in CLEAN, the universal quantifier is generally left out. The function\
    \ map defined as usual, universal quantifier is specified:\n\n```\nmap:: (a->b)\
    \ [a] -> [b]\nmap f [] = []\nmap f (x:xs) = f x : map xs\n```\n\n**Counter Example.**\
    \ The same function map again, but the implicit universal quantifier has become\
    \ visible. This makes the specified type more precise, but makes the type definition\
    \ a bit longer as well. The current version of Clean does not allow quantifiers\
    \ on the topmost level.\n\n```\nmap:: A: a (a->b) [a] -> [b]\nmap f [] = []\n\
    map f (x:xs) = f x : map xs\n```\n\n**Implemented:** Clean 2.0 it is allowed to\
    \ explicitly write the universal quantifier. One can write down the quantifier\
    \ A (for all) direct after the :: type definition of function. In this way one\
    \ can introduce the type variables used in the type definition of the function.\
    \ As usual, the type variables introduced have the whole function type as scope.\n\
    \n```\nFunctionType = Type -> Type [ClassContext][UnqTypeEqualities]\nType = (BracketType+)\n\
    BracketType = [UniversalQuantVariables][Strict][UnqTypeAttr] SimpleType\nUniversalQuantVariables\
    \ = A.{TypeVariable}+\n```\n\n**Not Implemented:** We will allow Rank N polymorphism.\
    \ We are working on it.\n\nExample: The function h is used to apply a polymorphic\
    \ function of type (A.a: [a] -> Int) of an Int as well as a type of Char. Due\
    \ to the explicit use of the universal quantifier in the type specification of\
    \ h.\n"
  mdcn: "\n构造函数。例如，选择器模式中使用的列表必须是 `[a]`；`[a]` 不能使用，因为它代表 `[a[]]`，这表示对元数构造函数 `[]` 执行了测试。如果模式是一个记录（record），则只有人们感兴趣的字段才会在模式中指定。数组不能用作选择器。选择器不能全局定义。\n\
    \n## 3.7 函数的类型化\n\n虽然通常没有义务显式地指定函数的类型（CLEAN 编译器通常可以*推断*类型），但为了提高程序的可读性，显式指定类型是**高度推荐的**。\n\
    \n```\nFunctionDef        = [FunctionDef]\n                              DefFunction\n\
    FunctionTypeDef  = FunctionName : Function Type;\n                           \
    \   (FunctionName) [Fix][Prec] [:: FunctionType];\nFix               = infix1\n\
    \                              infix\n                              infix\nPrec\
    \              = Digit\nFunctionType     = Type -> [ClassContext][UnqTypeUnequalities]\n\
    Type             = [Bracket]+\nBrType          = [UniversalVariables][UnqTypeUnequalities]\n\
    UniversalVariables = A.Type\nSimpleType = Type\n```\n\n当导出函数时，或者当程序员想要对函数的应用添加额外限制时（例如，如第7章所示，可以定义更严格的类型），**必须**进行显式指定。CLEAN\
    \ 系统使用了 Milner/Wright 组合，这确保了在某些情况下无法推断函数的类型（使用 Milner/Hindley 系统；Eek, 1993）。当使用全量化类型时（见\
    \ 3.7），需要程序员进行显式类型化。\n\n笛卡尔图用于函数类型的规范。该图通过参数的并列来表示。对于单个参数，可以省略括号。在类型规范中，应用的绑定优先级高于箭头。\n\
    \n- 双冒号 `::` 之前的函数符号与对应规则的函数符号相同。\n- 函数的元数必须与笛卡尔积的参数数量对应。因此在 CLEAN 中，可以通过其类型判断函数的元数。展示函数的元数如何在代码中反映：\n\
    \n```\nmap: (a->b) [a] -> [b]                               // map 有 2 个参数\nmap\
    \ f = []\nmap f (x:xs) = f x : map xs\ndomap: (a->b) [a] -> [b]              \
    \                 // domap 有 2 个参数\n```\n\n局部定义函数的规范不能引用在周围函数类型规范中引入的变量（定义没有作用域）。语法无法指定此类函数的类型。该类型将由类型系统在被编译器提升到全局层级后进行推断和检查。\n\
    \n**反例**（非法的类型指定）。函数 $g$ 返回一个元组。第一个元素的类型与 $f$ 的参数相同。这种依赖关系（此处用 `~` 表示）是无法指定的。\n\
    \n```\nf :: a -> (a,a)\nf x = g x\nwhere\n  // g :: b -> (a,b)\n  y = (x,y)\n\
    ```\n\n### 3.7.1 柯里化函数 (Curried Functions)\n\n在 CLEAN 中，所有符号（函数和构造函数）都是用*固定元数*定义的。但在应用中，允许应用于任意数量的参数。函数的*柯里化应用*是指使用少于其元数的参数对函数进行应用（注意在\
    \ CLEAN 中，函数可以从其类型推导出）。在预定义内部函数的帮助下，应用于所需数量参数的柯里化函数将转换为等效的柯里化函数。\n\nCLEAN 类型系统的类型公理对于所有定义为元数\
    \ $n$ 的 $s$，包含 $s :: (t2 \\dots tn)$ 与 $s :: (t1 \\to t2 \\dots tn)$ 的等价性。\n\n\
    ### 3.7.2 类型运算符\n\n*运算符*是元数为二的*函数*，可以在中缀位置使用。可以通过在函数定义的左侧将运算符名括在括号中来定义运算符。运算符具有*优先级*（0\
    \ 到 9，默认为 9）和*结合性*（fixity，包括 *infix*、*infixr* 或仅 *infix*，默认为 *infix*）。优先级越高，结合越紧密。当运算符的优先级相同时，由结合性决定优先级。在表达式中，普通函数应用始终具有最高优先级（10）。另见第\
    \ 3.1 节和 3.4 节。\n\n- 运算符的类型必须遵守元数为二的函数类型化要求。\n- 如果运算符被显式类型化，则在类型规则中也应将运算符名放在括号内。\n\
    - 当中缀结合性包含在括号中时，它可以作为前缀函数应用。右侧新定义运算符可能的递归定义也遵循这一约定。\n\n运算符及其定义的示例：\n\n```\n(c)\
    \ infix 8 :: (x -> y) (z -> x) -> (z -> y) // 函数复合\n(c) f g = \\x -> f (g x)\n\
    ```\n\n### 3.7.3 部分函数的类型化\n\n模式和守卫（guards）意味着在应用重写规则之前必须满足的条件（见 3.2 3.3）。这使得定义*部分函数*\
    \ $s$ 成为可能，即对于指定类型的所有可能值都没有定义的函数。\n\n当部分函数应用于其定义域之外的值时，将导致运行时错误（run-error）。当定义的可能是部分函数时，编译器会给出警告。\n\
    \n通过 `abort` 表达式（见 StdMisc::dcl），可以将任何部分函数转换为全函数（`abort` 表达式可以是任何类型）。`abort` 表达式可以提供自定义运行时消息。\n\
    \n使用 `abort` 使函数全量化：\n\n```\nfac:: Int -> Int\nfac 0 = 1\nfac n = n * fac (n -\
    \ 1)\notherwise = abort \"fac called with negative number\"\n```\n\n## 3.7.4 函数类型中全量化符的显式使用\n\
    \n在 CLEAN 中指定泛型类型时，通常省略全量化符。通常定义的 `map` 函数指定了全量化符：\n\n```\nmap:: (a->b) [a] ->\
    \ [b]\nmap f = []\nmap f (x:xs) = f x : map xs\n```\n\n**反例**。同样的函数 `map`，但隐含的全量化符变得可见。这使得指定的类型更精确，但也让类型定义变长了。目前的\
    \ Clean 版本不允许在顶层使用量化符。\n\n```\nmap:: A: a (a->b) [a] -> [b]\nmap f = []\nmap f\
    \ (x:xs) = f x : map xs\n```\n\n**已实现**：Clean 2.0 允许显式编写全量化符。可以在函数类型定义 `::` 后直接写入量化符\
    \ `A`。通过这种方式可以引入类型定义中使用的类型变量。与一样，引入的类型变量的作用域是整个函数类型。\n\n```\nFunctionType = Type\
    \ -> Type [ClassContext][UnqTypeEqualities]\nType = (BracketType+)\nBracketType\
    \ = [UniversalQuantVariables][Strict][UnqTypeAttr] SimpleType\nUniversalQuantVariables\
    \ = A.{TypeVariable}+\n```\n\n**未实现**：我们将允许 Rank N 多态性。我们正在开发中。\n\n示例：函数 `h` 用于将类型为\
    \ `(A.a: [a] -> Int)` 的泛型函数应用于 `Int` 以及 `Char` 类型。这是由于在 `h` 的类型规范中显式使用了全量化符。\n\
    \n"
