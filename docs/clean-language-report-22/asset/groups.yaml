    ## Strictness, Macros and Efficiency


    - 10.1 Defining Partially Strict Data Structures and Functions

    10.2 Defining Graphs on the Global Level

    10.3 Defining Macros

    10.4 Efficiency Tips


    Programming in a functional language means that one should focus on algorithms
    and without worrying about all kinds of efficiency details. However, when large
    applications are being written it may happen that this attitude results in a program
    that is unacceptably inefficient in time/or space.


    In this Chapter we explain several kinds of annotations and directives that can
    be defined in CLEAN. These annotations and directives are designed to give the
    programmer some means to influence the time and space behavior of CLEAN.


    CLEAN is by default a lazy language: applications will only be evaluated when
    results are needed for the final outcome of the program. However, lazy evaluation
    is in general not very efficient. It is much more efficient to compute function
    arguments in advance (strict evaluation) when it is known the order of data structures
    and functions can be changed from lazy to strict. This is explained in Section
    10.1.


    One can define constant graphs on the global level also known as Constant Application
    Forms (see Section 10.2). Unlike constant functions, these constant graphs are
    shared that they are computed only once. This generally reduces execution time
    at the cost of some heap space to remember the graph constants.


    Macros (Section 10.3) are special functions that will already be substituted (evaluated)
    at compile-time. This generally reduces execution time (the work has already been
    done by the compiler) but it will lead to an increase of object code.


    ## 10.1 Annotations to Change Lazy Evaluation into Strict Evaluation


    CLEAN uses by default a lazy evaluation strategy: a redex is only evaluated when
    it is needed to compute the final result. Some functional languages (e.g. ML,
    Harper et al.) use an eager (strict) evaluation strategy and always evaluate all
    arguments in advance.


    ### 10.1.1 Advantages and Disadvantages of Lazy versus Strict Evaluation


    - Lazy evaluation has the following advantages (+) / disadvantages (-) over strict
    evaluation:

    - only those computations which contribute to the final result are computed (for
    all algorithms this is a clear advantage which it generally gives a greater expressive
    freedom);

    - one can work with infinite data structures (e.g. [..]);

    - it is known when a lazy evaluation will be computed (disadvantage for debugging,
    for controlling evaluation);

    - strict evaluation is in general much more efficient, in particular for objects
    of basic types, non-recursive types and records which are composed of such types;

    - in strict evaluation (e.g. 2 + 3 + 4) takes less space than a lazy one, sometimes
    the other way around (e.g. [1000]);


    ### 10.1.2 Strict and Lazy Context


    Each expression in a function definition is considered to be either strict (appearing
    in a strict context: it has to be evaluated to strict normal form) or lazy (appearing
    in a lazy context : not yet to be evaluated to strict normal form). Following
    rules specify whether or not a particular expression is lazy or strict:

    * a non-variable pattern is strict;

    * an expression in a guard is strict;

    * the expressions specified in a strict let-before expression are strict;

    * the root expression is strict;

    * the arguments of a function or data constructor in a strict context are strict
    when these arguments are being annotated in the strict type of that function (manually
    or automatically) or in the type definition of the data constructor;

    * all the other expressions are lazy.


    Evaluation of a function will happen in the following order: patterns, guard,
    expressions in a strict let before expression, root expression (see also 3.1).


    ### 10.1.3 Space Consumption in Strict and Lazy Context


    The space occupied by CLEAN depend on the kind of structures one is using, but
    also depends on whether these data structures appear in a strict or in a lazy
    context. To understand this one must have some knowledge about the basic implementation
    of CLEAN (see Plasmeijer and Van Eekelen, 1993).


    Graphs (see Chapter 1) are stored in a piece of memory called the heap. The amount
    of space needed depends heavily on the kind of structures that are in use. Graph
    structures are created in a lazy context occupy more space than graphs created
    in a strict context. The garbage collector in the runtime of CLEAN automatically
    collects graphs that are not being used. The arguments of functions are evaluated
    on a stack. There are two stacks: the A-stack, which contains references to graph
    nodes stored in the heap and the BC-stack which contains arguments of basic type
    and return addresses. Data in a lazy context are passed via references on the
    A-stack. Data structures of the basic types (Int, Real, Char or Bool) in a strict
    context are stored on the B-stack or in registers. This is also the case for these
    basic types when they are part of a record or tuple in a strict context.


    Data living on the B-stack are boxed. They consume less space (because they are
    not part of a node) and can be treated much more efficiently. When a function
    is called in a lazy context its data are placed in a graph node (boxed). The amount
    of space occupied is depending on the parity of the function.


    In the table below the amount of space consumed in the different situations is
    summarised (the lazy as well as the strict context). For the size of the elements
    one can take the size consumed in a strict context.


    | Type | Arity | Lazy context (bytes) | Strict context (bytes) | Comment |

    | :--- | :--- | :--- | :--- | :--- |

    | Int, Bool | | 8 | 4 | |

    | Char | | 4 | 4 | node shared |

    | Real | | 12 | 8 | |

    | Small Record | n | 4 | 12 | |

    | Large Record | n | 8 | 12 | |

    | Tuple | 2 | 12 | 8 | |

    | a | n | 20*n | 12*n | |

    | !Int | | 20*n | 12*n | |

    | !Bool,!Char | n | 20+4*n(4) | 12+4*n(4) | |

    | !Real | n | 20+8*n | 12+8*n | |

    | !Tuple, !Record | n | 20+sizetup*n | 12+sizetup*n | |

    | Hnf | 0 | | 4 | node also for |

    | Pointer to Function | 0,1,2 | | 4 | node node |


    ### 10.1.4 Time Consumption in Strict and Lazy Context


    Strict arguments of functions can be handled much more efficiently than lazy arguments,
    in particular when they are of basic type.


    Example: functions with strict arguments are more efficient.


    ```

    Ackermann:: !Int !Int -> Int

    Ackermann j = j+1

    Ackermann i 0 = Ackermann (i-1) 1

    Ackermann i j = Ackermann (i-1) (j-1)

    ```


    The computation of a lazy version of Ackermann 3 takes 14.8 seconds + 0.1 seconds
    for garbage collection on an old MacII (5mb heap). When both arguments are annotated
    as strict (which in this case will be done by the compiler) the calculation will
    take 1.5 seconds + 0.0 seconds garbage collection. The gain is one of magnitude.
    Instead of rewriting graphs the calculation is performed using stacks and registers
    where possible. The speed is comparable with a recursive call in highly optimised
    C or with the speed when the function was programmed in assembly.


