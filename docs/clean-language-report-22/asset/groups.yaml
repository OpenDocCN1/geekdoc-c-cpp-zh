    where\n  (<) infix 2 :: a -> Bool\n  (>) infix 2 :: a -> Bool | Ord a\n  (>) x\
    \ y := y < x\n  (<=) infix 2 :: a -> Bool | Ord a\n  (<=) x y := not (y<x)\n \
    \ (>=) infix 2 :: a -> Bool | Ord a\n```\n"
