- md: "\ncode written in any other language. What exactly is allowed depends on the\
    \ CLEAN compiler used and the platform for which code is generated. The keyword\
    \ `code` is reserved to make it possible to write CLEAN programs in a foreign\
    \ language. This is not treated in this reference manual.\n\nWhen one writes system\
    \ implementation modules one has to be very careful; the correctness of the functions\
    \ can no longer be checked by the CLEAN compiler. Therefore, the programmer is\
    \ now responsible for the following:\n\n- The function must be correctly typed.\n\
    - When a function destructively updates one of its (sub-)arguments, the corresponding\
    \ type of the arguments should have the uniqueness type attribute. Furthermore,\
    \ those arguments must be strict.\n\n# Defining Functions and Constants\n\n3.1\
    \ Functions\n3.2 Patterns\n3.3 Guards\n3.4 Expressions\n3.5 Local Definitions\n\
    3.6 Defining Constants\n3.7 Typing Functions\n\nIn this chapter we explain how\
    \ functions (actually: graph rewrite rules) and constants (actually: graph expressions)\
    \ are defined in CLEAN. A definition of a function consists of an (root) expression\
    \ (see 3.4) with help of patterns (see 3.2) and guards (see 3.3), a distinction\
    \ can be made between several alternative definitions for functions. constants\
    \ can be defined locally in a function. For programming convenience (evaluation,\
    \ observation of unique objects and threading operations) a special let is introduced\
    \ (see 3.5.1). The typing of functions is discussed in Section 3.7. For overloaded\
    \ functions see Chapter 6. For functions working on unique datatypes see Chapter\
    \ 9.\n\n# 3.1 Functions\n\n```\nFunctionDef = // see Chapter 4 for typing functions\n\
    DefOfFunction = [FunctionDef]\nFunctionAltDef = [FunctionAltDef];\nFunction (Pattern)\
    \ // see 3.2 for patterns\n(LetBeforeExpression) // see 3.5.4\n{[ Guard =]FunctionBody)+\\\
    \ // see 3.3 for guards\n[LocalFunctionAltDefs] // see 3.5\nFunction = // ordinary\
    \ function\n(FunctionName) // operator function prefix\nFunctionBody = // see\
    \ 3.4\nRootExpression;\n[LocalFunctionAltDefs]\n```\n\nA function definition of\
    \ one or more function alternative (rewrite rule). The left-hand side of such\
    \ a function alternative a pattern can be specified which can serve as a sequence\
    \ of called called. The root expression (see 3.4) of a particular rule is chosen\
    \ for execution when\n\n- the patterns in the formal arguments are matching the\
    \ corresponding actual arguments of the function application (see 3.2) and\n-\
    \ the optional guard (see 3.3) specified on the right-hand side evaluates to True.\n\
    \nThe alternatives are listed in textual order. A function can be preceded by\
    \ a definition of its type (Section 3.7).\n\n- Function definitions are only allowed\
    \ in implementation modules (see 2.3).\n- It is required that the alternatives\
    \ of a function are textually grouped together (separated by semi-colons) when\
    \ the layout sensitive mode is not chosen.\n- Each of a function must start with\
    \ the function symbol.\n- A function has a fixed arity, so in each rule the same\
    \ number of formal arguments must be specified. Functions can be used and applied\
    \ to any number of arguments, as is usual in higher functional languages.\n- The\
    \ function name must in principle be different from other names in the same name\
    \ and same scope (see 2.1). However, it is possible to overload functions and\
    \ operators (see Chapter 6).\n\nExample of function definitions in a CLEAN module.\n\
    \n```haskell\n# module example\n\nimport StInt // module header\n\nmap: (a ->\
    \ b) [a] -> [b] // type of map\nmap f list = [f e | e<- list] // definition of\
    \ the function\nmap\n\nsquare: Int -> Int // type of square\nsquare x = x * x\
    \ // definition of the function\nsquare\n\nStart: [Int] // type of Start rule\n\
    Start = map square [1.000]\n```\n\nAn operator is a function with arity two that\
    \ can be used as infix (brackets are left or) or as prefix function (the operator\
    \ name preceding its arguments to be surrounded by brackets). The precedence (0\
    \ through 9) and fixity (infixleft, infixright, infix) can be defined in the type\
    \ definition (see 3.7.1) of the operators determine the priority of the operator\
