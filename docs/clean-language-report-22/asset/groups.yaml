    File) cannot be packed into Dynamic.


    A compile time error message will be given in those cases where the compiler refuses
    to pack an expression into a Dynamic.


    In the current implementation there are additional restrictions on the kind of
    types that can be packed into a Dynamic. Currently it is not possible to pack
    any abstract data type into a dynamic at all. The reason is that the test on equality
    of abstract types is not equal: it does not seem to enough the quality of the
    definitions of types involved. We also test whether the operations defined on
    these abstract data types are exactly the same. The most straightforward way to
    do this would be to require that abstract data types are coming from the same
    module (repository).


    +   - Expressions containing objects of abstract data type cannot be packed into
    a Dynamic. We are working on this. Check the latest version of the Clean system.


