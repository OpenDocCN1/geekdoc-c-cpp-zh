    Start = G 1 + G + 2\n\n### 4.3.2 元组模式\n\n预定义代数类型元组的对象可以在函数、case 表达式或列表生成器中被指定为模式。\n\
    \n```\nTuplePattern = (GraphPattern,GraphPattern)-list\n```\n\n在元组上使用模式匹配以访问复数组件的示例。\n\
    \n```\n: complex := (Real,Real) // complex 被定义为 (real,Real) 的类型别名\n```\n\n```\n\
    realpart:: Complex -> Real\nrealpart(re_) = re // 选择复数的实部\n```\n\n```\nimagpart::\
    \ Complex -> Real\nimagpart(_, im) = im // 选择复数的虚部\n```\n\n## 4.4 数组\n\n数组是为了效率考虑而定义的代数数据类型。数组包含有限数量的元素，所有元素必须是相同类型。数组具有一种属性，可以通过索引在常数时间内访问其元素。索引必须是\
    \ 0 到 array-1 之间的整数值。可以对数组元素进行破坏性更新以确保唯一类型性。为了编程便利，提供了创建、选择和更新数组元素的语法（数组推导式），同时也有用于字符串的特殊语法（字符的箱化数组）。数组的缺点是使用它们会增加运行时错误（索引越界）的可能性。\n\
    \n为了在时间和空间上获得最优效率，数组根据数组的具体类型来实现。默认情况下，数组被实现为懒性数组（类型 {a}），数组由一个包含数组元素指针的连续内存块组成。如果使用的类型为\
    \ !，则相同的表示是严格的。区别在于，如果对数组求值，则严格数组的所有元素都将被求值。对于数组，像列表那样区分严格性和尾部严格是没有意义的。按照习惯，必须确保严格元素不代表无限计算。\n\
    \n对于基本类型、记录类型和元组类型的元素，可以使用未箱化的数组（如果其类型为 {#}）。在这种情况下，模式被数组元素取代。懒性、严格和未箱化的数组被视为不同类型的对象。然而，数组上的大多数操作都是重载的，可以用于懒性数组以及未箱化数组。\n\
    \n```\nArrayType = {[ArrayKind] Type}\nArrayKind = ! // 严格数组\n             //\
    \ 未箱化数组\n```\n\n### 4.4.1 创建数组和选择字段元素\n\n数组是一种类似于元组/记录的数据结构，其中所有元素都是相同类型。不是通过位置或名称选择，而是通过索引在常数时间内高效地选择数组元素。数组的更新在\
    \ CLEAN 中完成，因此，如果想使用此功能，数组是唯一的（参见第 9 章）。当时间和空间消耗变得关键时（CLEAN），数组是非常有用的。\n\n（注：原文中此处存在大量重复的\
