    \              . .ArrayIndex\nRecordExpr = .GraphExpr\n```\n\n- 表达式必须产生一个记录。\n\
    \n写在 `(& f = v)` 左侧的记录读作：`r` 带有 `f` 值为 `v` 是要复制的记录。在 `&` 的右侧指定了此新记录与旧记录不同的类型。结构可以是记录的任何字段，可以是记录或数组中任何字段或元素的选择。所有其他字段都将被复制并隐式创建。注意，函数式更新是经典意义上的破坏性更新，因为创建了一个新记录。记录的函数式更新执行得足够好，我们没有为唯一类型记录的破坏性更新添加支持。`&`\
    \ 运算符位于其参数之间。\n\n在函数式更新中更新记录。\n\n```\nMoveColorPoint::ColorPoint (Real, Real)\
