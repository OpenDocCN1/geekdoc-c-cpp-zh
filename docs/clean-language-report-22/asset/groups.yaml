  - "[PAGE 22]\n\n# 2.2 Modular Structure of Clean Programs\n\nA CLEAN program consists\
    \ of a collection of definition modules and implementation modules. An implementation\
    \ mention and a definition module correspond to each other if the names of the\
    \ two modules are the same. The basic idea is that definitions given in an implementation\
    \ module only have a meaning in the module in which they are defined unless these\
    \ definitions are exported by putting them into the corresponding module definition.\
    \ In that case the definitions also have a meaning in other modules in which the\
    \ definitions are imported (see 2.5).\n\n```\nCleanProgram = [Module]+\nModule\
    \ = DefinitionModule\n = ImplementationModule\nDefinitionModule = definition module\
    \ ModuleName;\n    (DefDefinition)\n = system module ModuleName;\n    (DefDefinition)\n\
    ImplementationModule = [implementation] module ModuleName;\n    (ImplDefinition)\n\
    ```\n\n+   - An exquisite CLEAN program consists of at least one implementation\
    \ module, the main or start module, which is the top-most (root module) of a CLEAN\
    \ program.\n- Each CLEAN module has to be in a separate file.\nnThe name of a\
    \ module (i.e., the module name) should be the name of the minus (suffix) in which\
    \ the module is stored.\n- A definition module should have .decl as suffix; an\
    \ implementation module should have .icl as suffix.\nA definition module can have\
    \ at most one corresponding implementation module.\nEvery implementation module\
    \ (except the main module, see 2.3.1) must have a corresponding definition module.\n\
    \n# 2.3 Implementation Modules\n\n# 2.3.1 The Main or Start Module\n\n+   - In\
    \ the main module a Start rule has to be defined (see Chapter 1).\n- Only in the\
    \ main module one can leave out the keyword implementation in the module header.\
    \ In that case the implementation module does not need to have a corresponding\
    \ definition module (which makes sense for a top-most module).\n\nA very tiny\
    \ but complete program consisting of one implementation module.\n\n```\nmodule\
    \ hello\nStart = \"Hello World!\"\n```\n\nEvaluation of a CLEAN program consists\
    \ of the evaluation of the application defined in the right-hand side of the Start\
    \ rule (see Chapter 1). The right-hand side of the Start rule is regarded to be\
    \ the initial expression to be computed."
  - '[PAGE 23]


    is allowed to have a Start rule in other implementation modules as well. This
    can be handy for testing functions defined in such a module: to evaluate such
    Start simply generate an application with the module and root execute it. In the
    CLEAN one can specify which module has to be regarded as the root module.


    The definition of the left-hand side of the Start rule consists of the symbol
    Start with optional argument (of type *World), which is the environment parameter,
    which is necessary to write interactive applications.


    A CLEAN program can run in two modes.


    # I/O Using the Console


    The first mode is a console mode. It is chosen when the Start rule is defined
    as a nullary function.


    ```

    Start:: TypeOfStartFunction

    // initial expression

    Start = ...

    ```


    In the console mode, part of the initial expression (indicated by the right-hand
    side of the Start rule), which is in root normal form (also called the head normal
    or root stable form), is printed as soon as possible. The console mode can be
    used for instance to debug functions.


    In the CLEAN IDE one can choose to print the result of a Start expression with
    or without the data constructors.


    For example, the initial expression


    ```

    Start:: String

    Start = "Hello World!"

    ```


    in mode "show data constructors" will print: "Hello World!", in mode "don''t show
    data constructors" it will print: Hello World!


    # I/O on the Unique World


    The second mode is the root mode. It is chosen when the optional parameter (which
    is of type *World) is added to the Start and deliver as result.


    ```

    Start:: *World -> *World

    // initial expression returning a changed

    Start w = ...

    world

    ```


    The world which is given to the initial expression is an abstract data structure,
    an abstract world of type *World which models the concrete physical world as the
    program. The abstract world in principle contain anything what functional program
    needs to interact during execution with the concrete world. The world can be as
    a state and modifications of the world can be realized via state transition functions
    on a unique world the modifications of the abstract world directly be realized
    in the physical world, without loss of efficiency and without losing referential
    transparency (see Chapter 9)


    The concrete way in which the world can be handled in CLEAN is by the system programmer.
    One way to handle the world is using the predefined CLEAN I/O library, which can
    be regarded as a parallel independent operating system. It is possible to do file
    I/O, window based I/O, dynamic process creation and communication in a functional
    language in an efficient way. The definition of the I/O is treated in a separate
    document (Object I/O tutorial, Ahmet et al., 1997).'
  - "[PAGE 24]\n\n# 2.3.2 Scope of Global Definitions in Implementation Modules\n\n\
    In an implementation module the following global definitions can be specified\
    \ in any order.\n\n```\nImplDefinition               = ImportDef             //\
    \ see 2.5\n                              FunctionDef            // see Chapter\
    \ 3\n                              GraphDef                // see 3.6\n      \
    \                        MacroDef                // see 10.3\n               \
    \               TypeDef                 // see Chapter 5\n                   \
    \           ClassDef                // see Chapter 6\n                       \
    \       GenericsDef            // see Chapter 7\n```\n\nDefinitions on the global\
    \ level (outermost level in the module,) have in principle the whole implementation\
    \ module as scope (see Figure 2.1).\n\n# Figure 2.1 (Scope of global definitions\
    \ inside an implementation module).\n\n```\nimplementation module XXX\n:: TypeName\
    \ typevars = type_expression // definition of a new type\nfunctionName: type_of_args\
    \ -> type_of_result // definition of the type of a\nfunction functionName args\
    \ = expression // definition of a function\nselector = expression graph // definition\
    \ of a constant\nclass className = expression // definition of a class\nmacroName\
    \ args === expression // definition of a macro\n```\n\nTypes can be defined globally\
    \ (see Chapter 5) and therefore have a meaning in the whole implementation module.\
    \ Type variables introduced on the left-hand side of a (algebraic, record, synonym,\
    \ overload, class, function, graph) type define the right-hand side of the type\
    \ definition as scope.\n\nFunctions, the type of these functions, (selectors)\
    \ and macro's can be defined on the global level as well as on a local in nested\
    \ scopes. When defined globally they have a meaning in the whole implementation\
    \ module. Arguments introduced on the left-hand side of a definition (formal arguments)\
    \ only have a meaning in the corresponding right-hand side.\n\nFunctions, the\
    \ type of constants, (selectors) and macro's can also be defined locally in a\
    \ new scope. However, new scopes can only be introduced at certain points. In\
    \ functional languages local definitions are defined by tradition using let-expressions\
    \ (definitions given before are used in a certain expression, nice for a bottom-up\
    \ style of programming) and where-blocks (definitions given afterwards, nice for\
    \ a top-down style of programming). These constructs are explained in detail in\
    \ Chapter 3.\n\n# 2.3.3 Begin and End of Definition: the Layout Rule\n\nCLEAN\
    \ code can be written in two modes: layout sensitive mode 'on' and 'off'. The\
    \ layout sensitive is switched off when a semi-colon is specified after the module\
    \ name. In each definition has to be ended with a semicolon ';'. A new scope has\
    \ to begin with '(' and ends with a ')'. This mode is handy if CLEAN code is generated\
    \ automatically (e.g. by a compiler)."
