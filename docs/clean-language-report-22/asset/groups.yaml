    gMap ( PAIR ) fx fy (PAIR x y) = PAIR (fx x) (fy y)

    gMap ( EITHER ) fl fr (LEFT) = LEFT (fl x)

    gMap ( EITHER ) fl fr (RIGHT) = RIGHT (fr x)

    gMap ( CONS ) cx fx (CONS) = CONS (fx x)

    gMap ( FIELD ) fx fx (FIELD) = FIELD (fx x)


