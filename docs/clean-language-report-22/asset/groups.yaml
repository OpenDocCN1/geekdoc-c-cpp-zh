    \ braces (‘’ and ’) which are used to group a list of definitions.\n\nThe following\
    \ notational conventions are used in the context-free syntax descriptions:\n\n\
    - [notation] means that the position of notation is optional\n- [notation] means\
    \ that notation can occur zero or more times\n- [notation+] means that notation\
