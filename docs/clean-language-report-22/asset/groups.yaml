    ## 9.4.1 Higher Order Uniqueness Typing


    Higher-functions give rise to partial (often called Curried) applications, i.e.
    applications in which the actual number of arguments is less than the arity of
    the corresponding symbol. If these partial applications contain unique sub-expressions
    one has to be careful.


    Consider, for example the following function fprite with type


    ```clean

    fprite :: *File -> *File

    ```


    in the application


    ```clean

    fpritec unifie

    ```


    (assuming that unifie returns a unique file). Clearly, the type of this application
    is of form o: (Char -> *File). The question is: what kind of attribute is o? Is
    it a variable, or is it unique? Before making a decision, one should notice that
    it is dangerous to allow the above application to be shared. For example, if the
    expression fpritec unifie is passed to a function


    ```clean

    WriteAB write_fun = (write_fun ''a'', write_fun ''b'')

    ```


    Then the argument fpritec is no longer unique at the moment of the two operations
    take place. Apparently, the fpritec unifie expression is essentially unique; its
    reference count could become greater than 1. To prevent such essentially unique
    expression from being copied, CLEAN considers the -> type constructor in combination
    with the * attribute as special: it is not permitted to discard its uniqueness.
    The question about the attribute o can be answered as: it is *. If WriteAB is
    typed as follows


    ```clean

    WriteAB: (Char -> uFile) -> (uFile, uFile)

    WriteAB_write_fun = (write_fun ''a'', write_fun ''b'')

    ```


    The expression WriteAB (priteprite unifie) is rejected by the type system because
    it does not allow the argument of type *(Char -> *File) to be coerced to (Char
    -> uFile). One can easily see that it is possible to type WriteAB in such a way
    that the expression becomes typed.


    To define structures containing Curried applications is often convenient to use
    the (anonymous) attribute. Example


    ```clean

    :: Object a b = { state: ann, fun.: (b -> a) }

    new: * Object FileChar

    new = { state: unifie, fun = fpritec unifie }

    ```


    By adding an argument to the type definition of Object, it is possible to store
    unique functions in this data structure. This is shown by the function new. Since
    new contains an essentially unique expression it becomes essentially unique itself.
    So, new can never lose its uniqueness, and hence, it can only be used in a context
    where a unique object is demanded.


    Determining the type of a Curried application of a function (or data constructor)
    is somewhat involved if the type of that function contains attributes instead
    of concrete attributes. Mostly, these variables will require coercion, as seen
    in the below example.


    ```clean

    Prepend: u:[a] [a] -> v:[a] [u<=v]

    Prepend a b = Append b

    ```


    ```clean

    PrependList: u:[a] -> w:([a] -> v:[a]) [u<=v, w<=u]

    PrependList a = Prepend a

    ```


    Some explanation is in this expression (Prepend some_list) yields a function that,
    when applied to another list, other_list, delivers a new list extended containing
    the concatenation of other_list and some. Let''s call this new_list. If new_list
    should be unique (i.e. because*), then because of the statement u<=v the attribute
    u also becomes*. But, if u=* then also w=*, for w<=.. This implies that (arrow)
    type of the original expression (PrependList some_list) becomes unique, and this
    expression cannot be shared.


    ## 9.4 Uniqueness Type Coercions


    As said, offering a unique object to a function that requires a non-unique argument
    is safe (unless we are dealing with unique arrow types; see above). The technical
    tool to express this is via coercion (subtype) relation based on the ordering


    ‘s≤‘non-unique’


    on attributes. The validity of σσ'' depends subtype-wise on the validity of u≤u''
    with u,attributes in σ,σ''. One has, for example


    ```clean

    u:[w:Int] u≤u'':{v:[w'':Int]} iff u≤u'', v≤v, w≤w''.

    ```


    However, some refinements are necessary. Firstly, the uniqueness constraints expressed
    in terms of coercion statements (on attribute variables) must be taken into account.
    Secondly, the coercion restriction on arrow types should be handled carefully.
    And Thirdly, by the so-called contravariance of -> in our first argument we have


    ```clean

    :(σ->τ) u≤:(σ''->τ'') iff σ≤σ'', τ≤τ''

    ```


    Since -> may appear in the definitions of algebraic type constructors, these constructors
    may inherit the and contravariant subtyping behavior with respect to their arguments.
    We can classify the ‘sign’ of the arguments of each type constructor as + (positive,
    covariant), - (negative, contravariant) or top (both positive and negative). In
    general this is by analysing the (possible mutually recursive) algebraic type
    definitions with basis sign(->)=(-,+).


    Example: a has sign T, b has sign +


    ```clean

    ::FunList a b = Cons (a -> b) | Nil

    ```


    The system of CLEAR that a possible attribute is explicitly indicated in the type
    specification of the overloaded function. In order to obtain versions of map producing
    unique data structures, its overloaded type is specified as follows:


    ```clean

    class map m:: (.a ->.b).(m a) ->. (b)

    ```

