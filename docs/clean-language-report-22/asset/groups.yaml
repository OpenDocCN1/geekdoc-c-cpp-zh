    # 唯一类型（Uniqueness Typing）


    - 9.1 唯一类型背后的基本思想

    - 9.2 属性传播

    - 9.3 使用唯一性属性定义新类型

    - 9.4 唯一性与共享

    - 9.5 唯一类型与重载的结合

    - 9.6 高阶类型定义

    - 9.7 使用唯一类型进行破坏性更新


    尽管 CLEAN 是纯函数语言，但允许执行带有副作用的操作（I/O 操作）。为了在不违反语义的情况下实现这一点，经典类型被赋予了唯一属性（unique attributes）。如果一个函数的参数被标记为唯一，则可以保证在运行时该对象是局部的，即没有指向该对象的引用。显然，对这种“唯一对象”进行破坏性更新是安全的。


    唯一类型系统使得与操作系统、类型系统（更新持久化数据）、GUI 库定义直接接口成为可能；它允许创建可以进行破坏性更新的数组、记录或用户数据结构。因此，函数式程序的时间空间行为极大受益于唯一类型。


    唯一类型是自动推导的。类型属性是多态的：这些变量上的属性变量和不等式可用于指示对具体属性值的关系和限制。


    有时，推断出的属性提供了关于函数运行时行为的额外信息。唯一类型系统是经典类型系统的透明扩展，这意味着如果人们对唯一信息感兴趣，就可以简单地忽略它。


    由于唯一类型是一个较少见的复杂问题，我们详细解释了这种类型系统及其背后的动机。第一节（9.1）解释了唯一类型背后的基本动机和思想。第 9.2 节关注（代数）类型构造构造的所谓“唯一性传播”属性。我们将展示如何定义包含唯一对象的数据结构（第
    9.3 节）。第 9.4 节描述了共享对唯一类型的影响。为了保持引用透明性，函数类型似乎必须被特殊对待。最后一节 9.5 节描述了唯一类型与重载的结合。特别是关于构造函数和高阶类型定义的子节非常复杂：我们建议读者初次阅读跳过这些章节。


    ## 9.1 唯一类型背后的基本思想


    唯一类型是 Milner/Mycroft 类型系统的扩展。在唯一系统中，唯一属性被附加在经典类型上。唯一属性出现在函数的类型规范中（见 9.4），也允许出现在新数据类型的定义中（见
    9.3）。经典类型可以带有以下唯一类型属性之一的前缀：


    | 类型 | {BrackType} |

    | :--- | :--- |

    | BrackType | [UniversalQuantVariables] [Strict] |


    ### UnqTypeAttr


    [UnqTypeAttr] SimpleType

    // type attribute "unique"

    UniqueTypeVariable: // 一个类型属性变量

    // 一个匿名类型属性

    ```


    唯一性背后的基本思想如下。假设函数 F 有一个唯一参数（类型为 *σ* 的参数，对于某些 σ）。该属性对 F 的调用施加了额外的限制。


    可以保证 F 对该特定参数具有私有的（''unique''）访问权限（Barendsen and Smeters, 1993; Plasmjeir and
    Van Eelen, 1993）；在函数检查该对象时，该对象的引用计数为 1。需要注意的是，在特定访问发生之前，该对象可能有于 1 个引用。如果一个唯一类型的对象没有被用于构造结果，它将变成垃圾（引用降为零）。由于这种分析是静态执行的，该对象可以在编译时被垃圾回收（见第
    1 章）。用参数所占的空间来创建函数结果是无害的。换句话说：允许更新唯一对象而不会对引用透明性产生任何后果。


    示例：I/O 库 `fwritec` 用于向文件写入字符并产生新结果。通常情况下，不允许用给定的字符覆盖文件来构造结果。然而，通过指定参数文件为唯一的：


    ```

    fwritec:: *File -> *File

    ```


    类型系统保证 `fwritec` 对文件具有私有访问权限，因此可以在不违反程序函数式语义的情况下覆盖文件。结果文件是唯一的，可以作为延续传递给另一个 `fwritec`
    调用，使得进一步的写入成为可能。


    ```

    WriteABC:: *File -> *File

    WriteABC file = fwritec ''c'' (fwritec ''b'') (fwritec ''a'' file)

    ```


    观察到文件在单线程中（作为一种唯一令牌）从一个函数到另一个函数是唯一的，每个函数在修改文件时都知道自己对文件有私有访问权限。


    可以通过以下方式编写 `WriteABC` 使这些中间文件更加可见：


    ```

    WriteABC file = file3

    where

    file1 = fwritec ''a'' file

    file2 = fwritec ''b'' file1

    file3 = fwritec ''c'' file2

    ```


    或者，另一种（为了避免文件的显式编号），


    ```

    WriteABC file

    # file = fwritec ''a'' file

    file = fwritec ''b'' file

    = fwritec ''c'' file

    ```


    类型系统使得 CLEAN 文件与真实世界中的物理文件之间没有区别：文件 I/O 可以有效地像命令式语言一样被处理。唯一性防止在其他读取器/写入器活动时进行写入。不能仅将
    `fwritec` 应用于正在其他地方使用的文件。


    例如，以下表达式不被类型系统允许：


    ```

    (file, fwritec ''a'' file)

    ```


    带有唯一属性的函数参数被认为是“唯一的”：这些参数没有唯一性要求。函数只允许读取（正如函数式语言中通常那样）


    ```

    fread:: (Char, File)

    ```


    应用于唯一的和非唯一的文件。在第一情况下，结果文件也是唯一的，可以用于进一步的读取。这是没问题的，因为。


    为了指示函数不改变参数的唯一性，可以使用属性变量。


    最简单的例子是标识函数，它可以被类型化：


    ```

    id: u:a -> u:a

    id x = x

    ```


    这里是普通类型变量，而 u 是属性变量。如果 id 应用于唯一对象，结果也是唯一的（取决于 u 实例化的具体属性）。当然，如果 id 应用于非唯一对象，结果保持非唯一。作为普通类型变量，属性变量应该一致实例化。


    另一个例子是函数 `fread`，其类型为：


    ```

    fread: u:File -> u:(Char, u:File)

    ```


    再次，`fread` 可以应用于唯一的和非唯一的文件。在第一情况下，结果文件也是唯一的，可以用于进一步的读取。此外，注意不仅结果文件被赋予了属性，包含该文件和读取字符的元组也是如此。这是由于所谓的唯一性传播规则；见下文。


    总结来说，唯一类型使得在纯函数语言中进行破坏性更新成为可能。对于应用开发（处理文件、窗口、数组、数据库等），这是一个不可缺的属性。


    在解释了唯一类型的基本思想后，我们现在可以关注该类型系统的某些细节。


    如果一个唯一对象存储在数据结构中，该数据结构本身也变成了唯一的。唯一性传播规则防止唯一对象通过存储它们的数据结构被间接共享。为了解释这种隐式共享，考虑以下函数
    `head` 的定义：


    ```

    head: [*a] -> *a

    head [hd:tl] = hd

    ```


    模式导致 `head` 访问深层元素 `hd` 和 `tl`。注意 `head` 对其列表参数没有任何唯一性要求。这意味着在 `head` 的应用中列表可能会被共享，正如以下函数
    `heads` 所示：


    ```

    heads list = (head list, head list)

    ```

