    \ have equal precedence, the fixity determines the priority.\n\n- When an operator\
    \ is used in infix position both arguments have to be present. Operators can be\
    \ used in curved way, but then they have to be used as prefix functions.\n\nOperator\
    \ definition.\n\n```haskell\n(++) infixr 0: [a] [a] -> [a]\n(++) [] ys = ys\n\
    (++) (x:xs) ys = x:(xs ++ ys)\n\n(*) infixr 9: (a -> b -> c) -> a -> b -> c\n\
    (*) f x y = f x y\n```\n\n# 3.2 Patterns\n\nA pattern specified on the-hand side\
    \ of a function definition specifies the formal arguments. An alternative is chosen\
    \ only if the actual arguments of the function application match the formal arguments.\
    \ A formal argument is either a constant (data constructor) with its optional\
    \ sub-patterns that can consist of sub-patterns or it is a variable.\n\n| Pattern\
    \ | Type |\n| :--- | :--- |\n| Pattern = Variable |\n| BrackPattern = (Pattern)\
    \ |\n| SpecialPattern | DynamicPattern |\n| GraphPattern = Constructor // see\
    \ Chapter 8 |\n| GraphPattern = PatternName // Infix data constructor |\n| Pattern\
    \ = Variable |\n\nA pattern variable can be a (node) variable or a wildcard. A\
    \ variable is any concrete value of the corresponding argument and therefore does\
    \ not enforce any value. A Wildcard is an anonymous variable one can use to indicate\
    \ that the variable is not used in the right-hand side of the function. That makes\
    \ it possible to identify the whole pattern as well as its contents.\n\nExample\
    \ of algebraic data type definition and its use in a function match.\n\n```haskell\n\
    Tree a = Node (Tree a) (Tree a) | Nil\n```\n\n```haskell\nMirror :: Tree a ->\
    \ Tree a\nMirror (Node left right) = Node right left\nMirror Nil = Nil\n```\n\n\
    Use of anonymous variables.\n\n```haskell\nreal :: Complex -> Real\nreal (re,_)\
    \ = re\n```\n\nUse of list patterns, use of guards, use of variables to identify\
    \ patterns and sub-patterns; merge merges two (sorted) lists into one (sorted).\n\
    \n```haskell\nmerge :: [Int] [Int] -> [Int]\nmerge f [] = f\nmerge f s = s\nmerge\
    \ f (x:xs) (y:ys)\n  | x < y           = x:merge xs (y:ys)\n  | otherwise    \
    \   = y:merge f ys\n```\n\nIt is possible that the specified patterns turn a function\
    \ into a partial function (see 3.7). When a partial function is outside the scope\
    \ of the function it is defined will result in a runtime error. A compile time\
    \ warning is generated that such a situation might arise. The formal arguments\
    \ of a function and the function body are contained in a new scope.\n\n- All symbols\
    \ introduced at the left-hand side of a function definition must have different\
    \ names.\n\nFor convenience and efficiency syntax is provided to express pattern\
    \ match on data structures of predefined type and record type. They are treated\
    \ elsewhere (else).\n\n```haskell\nSpecialPattern      = BasicValuePattern //\
    \ see 4.1.2\n                      ListPattern       // see 4.2.2\n          \
    \            TuplePattern      // see 4.3.2\n                      ArrayPattern\
    \      // see 4.4.2\n                      RecordPattern     // see 5.2.2\n```\n\
    \n# 3.3 Guards\n\n```\nGuard = BooleanExpr\n      | otherwise\n```\n\nguard is\
    \ a Boolean expression attached to a rule that can be regarded as generalisation\
    \ of the pattern matching mechanism: the alternative only matches the patterns\
    \ defined on the left-side match and its (optional) guard evaluates to True (see\
    \ 3.1). Otherwise the next alternative of the function is tried. Pattern matching\
    \ takes place before the guards are evaluated.\n\nThe guards are tried in textual\
    \ order. The alternative corresponding to the first guard that yields True will\
    \ be evaluated. A right-hand side without a guard is regarded to have a guard\
    \ that evaluates to True (the 'otherwise' or 'default' case). In keyword otherwise\
    \ is synonym for True for people who like to emphasize the option.\n\n- Only the\
    \ last alternative of a function can have otherwise as guard or can have no guard.\
    \ It is possible that the guards turn the function into a partial function when\
    \ it is applied outside the domain for which the function defined will result\
    \ into a runtime error. Every compile time must be detected.\n\nFunction definition\
    \ with guards.\n\n```haskell\nfilter :: Int [Int] -> [Int]\nfilter pr [n:str]\n\
    n mod pr == 0 = filter pr str\notherwise = [n:filter pr str]\n```\n\nEquivalent\
    \ definition of previous filter.\n\n```haskell\nfilter :: Int [Int] -> [Int]\n\
    filter pr [n:str]\nn mod pr == 0 = filter pr str\notherwise = [n:filter pr str]\n\
    ```\n\nGuards can be nested. When a guard on one level evaluates to True, the\
    \ guards on the next level are tried.\n\n- To ensure that at least one of the\
    \ alternatives of a nested guard will be successful, a nested guard alternative\
    \ must always have a 'default case' as last alternative.\n\nExample of a nested\
    \ guard.\n\n```haskell\nexample arg1 arg2\n| predicate21 arg1 // if predicate21\
    \ arg1\n| predicate21 arg2 = calculate1 arg1 arg2 // then (if predicate21\narg2\
    \ | predicate22 arg2 = calculate2 arg1 arg2 // else predicate22 arg2\nthen | otherwise\
    \ = calculate3 arg1 arg2 // else ...)\n| predicate22 arg1 = calculate4 arg1 arg2\
    \ // else predicatel2 arg1\n```\n\n# 3.4 Expressions\n\nThe main body of a function\
    \ is called the root expression. The root expression is a graph expression.\n\n\
    ```\nRootExpression = GraphExpr\nGraphExpr = Application [{BrackGraph]+\nGraphExpr\
    \ Operator GraphExpr\n| GenericAppExpr\n```\n"
  mdcn: "\n用任何其他语言编写的代码。具体允许哪些操作取决于使用的 CLEAN 编译器以及生成代码的平台。关键字 `code` 被保留，用以能够使用外来语言编写\
    \ CLEAN 程序。本参考手册不涉及这部分内容。\n\n在编写系统实现模块时，必须非常小心；函数的正确性无法再由 CLEAN 编译器检查。因此，程序员现在需要负责以下内容：\n\
    \n- 函数必须具有正确的类型。\n- 当函数破坏性地更新其任一（子）参数时，相应的参数类型应具有唯一类型属性（uniqueness type attribute）。此外，这些参数必须是严格的（strict）。\n\
    \n# 定义函数和常量\n\n3.1 函数\n3.2 模式\n3.3 守卫\n3.4 表达式\n3.5 局部定义\n3.6 定义常量\n3.7 函数类型\n\
    \n在本章中，我们将解释如何在 CLEAN 中定义函数（实际上：图重写规则）和常量（实际上：图表达式）。函数的定义由一个（根）表达式（见 3.4）组成，并借助模式（见\
    \ 3.2）和守卫（见 3.3），这种这种可以区分函数的几种备选定义。常量可以在函数内部局部定义。为了编程的方便（求值、唯一对象的观察和线程操作），引入了特殊的\
    \ `let`（见 3.5.1）。函数的类型将在第 3.7 节中讨论。重载函数请见第 6 章。对于处理唯一数据类型的函数，请见第 9 章。\n\n# 3.1\
    \ 函数\n\n```\nFunctionDef = // 函数类型请见第 4 章\nDefOfFunction = [FunctionDef]\nFunctionAltDef\
    \ = [FunctionAltDef];\nFunction (Pattern) // 模式见 3.2\n(LetBeforeExpression) //\
    \ 见 3.5.4\n{[ Guard =]FunctionBody)+\\ // 守卫见 3.3\n[LocalFunctionAltDefs] // 见\
    \ 3.5\nFunction = // 普通函数\n(FunctionName) // 运算符函数前缀\nFunctionBody = // 见 3.4\n\
    RootExpression;\n[LocalFunctionAltDefs]\n```\n\n一个或多个函数备选（重写规则）的函数定义。此类函数备选的左侧可以指定一个模式，该模式可以作为一系列调用的序列。当以下情况发生时，选择特定规则的根表达式（见\
    \ 3.4）执行：\n\n- 形式参数中的模式与函数应用对应的实际参数匹配（见 3.2）\n- 并且右侧指定的可选守卫（见 3.3）求值为 `True`。\n\
    \n备选方案按文本顺序列出。函数前面可以有一个其类型定义（第 3.7 节）。\n\n- 函数定义仅允许在实现模块中（见 2.3）。\n- 当未选择布局敏感模式时，要求函数的备选方案在文本上分组在一起（用分号隔开）。\n\
    - 函数的每个备选方案必须以函数符号开始。\n- 函数具有固定的元数（arity），因此在每条规则中必须指定相同数量的形式参数。函数可以应用于任意数量的参数，这在高级函数式语言中很常见。\n\
    - 原则上函数名必须与同名同作用域内的其他名称不同（见 2.1）。但是，可以重载函数和运算符（见第 6 章）。\n\nCLEAN 模块中函数定义的示例。\n\
    \n```haskell\n# module example\n\nimport StInt // 模块头\n\nmap: (a -> b) [a] ->\
    \ [b] // map 的类型\nmap f list = [f e | e<- list] // 函数定义\nmap\n\nsquare: Int ->\
    \ Int // square 的类型\nsquare x = x * x // 函数定义\nsquare\n\nStart: [Int] // Start\
    \ 规则的类型\nStart = map square [1.000]\n```\n\n运算符是一个元数为二的函数，可以作为中缀使用（括号内）或作为前缀函数使用（运算符位于其参数之前）。运算符的优先级（0\
    \ 到 9）和结合性（infixleft, infixright, infix）可以在类型定义中定义，决定了运算符在表达式应用中的优先级。优先级越高，绑定越紧密。当运算符优先级相同时，结合性决定优先级。\n\
    \n- 当运算符在中缀位置使用时，两个参数都必须存在。运算符可以使用中缀方式使用，但它们必须作为前缀函数使用。\n\n运算符定义。\n\n```haskell\n\
    (++) infixr 0: [a] [a] -> [a]\n(++) [] ys = ys\n(++) (x:xs) ys = x:(xs ++ ys)\n\
    \n(*) infixr 9: (a -> b -> c) -> a -> c\n(*) f x y = f y\n```\n\n# 3.2 模式\n\n\
    函数定义左侧指定的模式指定了形式参数。只有当函数应用的实际参数匹配形式参数时，才会选择该备选方案。形式参数可以是常量（数据构造函数）、带有可选子模式的备选方案或者是一个变量。\n\
    \n| 模式 | 类型 |\n| :--- | :--- |\n| Pattern = Variable |\n| BrackPattern = (Pattern)\
    \ |\n| SpecialPattern | DynamicPattern |\n| GraphPattern = Constructor // 见第 8\
    \ 章 |\n| GraphPattern = PatternName // Infix data constructor |\n| Pattern = Variable\
    \ |\n\n模式变量可以是节点（node）变量或通配符（Wildcard）。变量是对应参数的任何具体值，因此不强制任何值。通配符可以在函数定义的右侧使用。这使得能够识别整个模式及其内容。\n\
    \n代数数据类型定义及其在函数中的用法。\n\n```haskell\nTree a = Node (Tree a) (Tree a) | Nil\n```\n\
    \n```haskell\nMirror :: Tree a -> Tree a\nMirror (Node left right) = Node right\
    \ left\nMirror Nil = Nil\n```\n\n匿名变量的使用。\n\n```haskell\nreal :: Complex -> Real\n\
    real (re,_) = re\n```\n\n列表模式的使用、守卫的使用、变量的使用识别模式和子模式；merge 将两个（排序的）列表合并为一个（排序的）。\n\
    \n```haskell\nmerge :: [Int] [Int] -> [Int]\nmerge f [] = f\nmerge f s = s\nmerge\
    \ f (x:xs) (y:ys)\n  | x < y           = x:merge xs (y:ys)\n  | otherwise    \
    \   = y:merge f ys\n```\n\n指定的模式可能函数变为部分函数（见 3.7）。在函数定义范围之外调用部分函数会导致运行时错误。编译时会产生这种情况的警告。函数的形式参数和函数体包含在一个作用域内。\n\
    \n- 函数定义左侧的所有符号必须具有不同的名称。\n\n为了方便和效率，提供了语法来对预定义类型和记录类型的数据结构进行模式匹配（else）。\n\n```haskell\n\
    SpecialPattern      = BasicValuePattern // 见 4.1.2\n                      ListPattern\
    \       // 见 4.2.2\n                      TuplePattern      // 见 4.3.2\n     \
    \                 ArrayPattern      // 见 4.4.2\n                      RecordPattern\
    \     // 见 5.2.2\n```\n\n# 3.3 守卫\n\n```\nGuard = BooleanExpr\n      | otherwise\n\
    ```\n\n守卫是附加到规则上的布尔表达式，可以视为模式匹配机制的推广：只有当左侧定义的模式匹配且其（可选）守卫求值为 `True` 时（见 3.1），才会选择该备选方案。否则，尝试函数的下一个备选方案。模式匹配发生在守卫评估之前。\n\
    \n守卫按文本顺序尝试。第一个产生 `True` 的守卫对应的备选方案将被执行。没有守卫的右侧被认为有一个求值为 `True` 的守卫（`otherwise`\
    \ 或 `default` 情况）。对于喜欢强调选项的人，`otherwise` 关键字是 `True` 的同义词。\n\n- 只有最后一个备选方案可以使用\
    \ `otherwise` 作为守卫或没有守卫。守卫可能将函数变为部分函数，当它应用于函数定义的域之外时会导致运行时错误。必须在编译时检测到这种情况。\n\n\
    带守卫的函数定义。\n\n```haskell\nfilter :: Int [Int] -> [Int]\nfilter pr [n:str]\nn mod\
    \ pr == 0 = filter pr str\notherwise = [n:filter pr str]\n```\n\n之前 filter 的等效定义。\n\
    \n```haskell\nfilter :: Int [Int] -> [Int]\nfilter pr [n:str]\nn mod pr == 0 =\
    \ filter pr str\notherwise = [n:filter pr str]\n```\n\n守卫可以嵌套。当某一层的守卫求值为 `True`\
    \ 时，会尝试下一层的守卫。\n\n- 为了确保嵌套守卫的备选方案中至少有一个成功，嵌套守卫备选方案必须有一个“默认情况”作为最后一个备选方案。\n\n嵌套守卫的示例。\n\
    \n```haskell\nexample arg1 arg2\n| predicate21 arg1 // if predicate21 arg1\n|\
    \ predicate21 arg2 = calculate1 arg1 arg2 // then (if predicate21\narg2 | predicate22\
    \ arg2 = calculate2 arg1 arg2 // else predicate22 arg2\nthen | otherwise = calculate3\
    \ arg1 arg2 // else ...)\n| predicate22 arg1 = calculate4 arg1 arg2 // else predicatel2\
    \ arg1\n```\n\n# 3.4 表达式\n\n函数的主体被称为根表达式。根表达式是一个图表达式。\n\n```\nRootExpression =\
    \ GraphExpr\nGraphExpr = Application [{BrackGraph]+\n| Operator GraphExpr\n| GenericAppExpr\n\
    ```\n"
