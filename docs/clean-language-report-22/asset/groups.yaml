  - '[PAGE 109]


    Function arguments with uniqueness attributes added to the classical type are
    considered as "unique": there are no reference requirements for these arguments.
    The function is only allowed to have read access (as usual in a functional language)
    even if some of the function applications the actual argument have no reference
    count 1.


    ```

    fread:: -> (Char, File)

    ```


    The fread can be applied to both unique as well as non-unique file. This is fine
    since the function only reads access on the file. The type indicates that the
    result is always a non-unique file. Such a file can be passed for further reading,
    but not for further writing.


    To indicate that functions don''t change uniqueness properties of arguments, one
    can use attribute variables.


    The simplest example is the identity function that can be typed as follows:


    ```

    id: u:a -> u:a

    id x = x

    ```


    Here is an ordinary type variable, whereas u is an attribute variable. If id is
    applied to a unique object the result is also unique (in case u is instantiated
    with the concrete attribute *). Of course, if id is applied to a non-unique object,
    the result remains non-unique. As ordinary type variables, attribute variables
    should be instantiated uniformly.


    A more example is the function fread that is typed as


    ```

    fread: u:File -> u:(Char, u:File)

    ```


    Again fread can be applied to both unique and non-unique files. In the first case
    the resulting file is also unique and can, for example, be used for further reading
    or writing. Moreover, observe that not only the resulting file is attributed,
    but also the tuple containing that file and the character that has been read.
    This is due to the so called uniqueness propagation rule; see below.


    To summarize, uniqueness typing makes it possible to update objects destructively
    within a purely functional language. For the development of real world applications
    (which manipulate files, windows, arrays, databases, etc.) this is an indispensable
    property.


    # 9.2 Attribute Propagation


    Having explained the general ideas of uniqueness typing, we can now focus on some
    details of this typing system.


    If a unique object is stored in a data structure, the data structure itself becomes
    unique as well. uniqueness propagation rule prevents unique objects are shared
    indirectly via the data structure in which these objects are stored. To explain
    this form of hidden sharing, consider the following definition of the function
    head


    ```

    head: [*a] -> *a

    head [hd:tl] = hd

    ```


    The pattern causes head to access to the ''deeper'' elements hd and tl. Note that
    head does not have any uniqueness requirements on its list argument. This means
    that in an application of the head list might be shared, as can be seen in the
    following function heads


    ```

    heads list = (head list, head list)

    ```'
