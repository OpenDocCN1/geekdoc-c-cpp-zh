    \ pages.\n\n# About this Language Report\n\nIn this report the syntax and semantics\
    \ of CLEAN version 2.0 are explained. We always give a motivation why we have\
    \ included a feature. Although the report is not intended as introduction into\
    \ the language, we did our best to make it as readable as possible. Nevertheless,\
    \ one sometimes has to work through several sections all over the report. We have\
    \ included links where possible to support browsing through the manual.\n\nAt\
    \ several places in this report context free syntax fragments of CLEAN are given.\
    \ We sometimes repeat fragments that are also given just to make the description\
    \ clearer (e.g. in the uniqueness chapter we repeat parts of the syntax for the\
    \ classical types). We hope that this is not confusing. The complete collection\
    \ of context free grammar rules is summarized in Appendix A.\n\n# Some Remarks\
    \ on the Clean Syntax\n\nThe syntax of CLEAN is similar to the one used in most\
    \ modern functional languages. However, there are a couple of small syntactic\
    \ differences we want to point out here for people who don't like to read language.\n\
    \nIn CLEAN the arity of a function is reflected in its type. When a function is\
    \ defined its untried type is specified! To avoid any confusion we want explicitly\
    \ state here in CLEAN there is no restriction whatsoever on the curried type of\
    \ functions. However we do not need a feel to express in this every type. Actually,\
    \ the way we express types of functions more clearly reflects the way functions\
    \ are internally treated.\n\nE.g., the standard map function (arity 2) is specified\
    \ in CLEAN as follows:\n\n```\nmap:: (a -> b) [a] -> [b]\nmap f [] = []\nmap f\
    \ [x:xs] = [f x:map f xs]\n```\n\nEach predefined structure such as a list, tuple,\
    \ a record or array has its own kind of brackets: lazy lists are always denoted\
    \ with square brackets [], spine lists are denoted by [...], overloaded lists\
    \ by {[...}, unboxed boxes by {#}. For the the usual parentheses are used (,),\
    \ curly braces are used for records (indexed by field name) and as for arrays\
    \ (indexed by number).\n\nIn types funny symbols can appear like, u:, *, ! which\
    \ can be ignored and left out if one is not interested in uniqueness or strictness.\n\
    \nThere are only a few keywords in CLEAN leading to a heavily overloaded use of\
    \ : and symbols:\n\n```\nfunction::argtype -> restype // type specification of\
    \ a function\n\nfunction pattern\n guard = rhs // definition of a function\n\n\
    selector = graph // definition of a constant/CAF/graph\n\nfunction args := rhs\
    \ // definition of a macro\n```"
  - "[PAGE 9]\n\n```\n// Type args = typedef\n// an algebraic data type definition\n\
    // a type synonym definition\n// an abstract type definition\n```\n\nAs is common\
    \ in modern languages, there is a layout rule in CLEAN (see 2.3). For reasons\
    \ of portability it is assumed that a tab is set to 4 spaces and a non-proportional\
    \ font is used.\n\nFunction definition in CLEAN use of the layout rule.\n\n```\n\
    primes:: [Int]\nprimes = sieve [2..]\nwhere\nsieve:: [Int] -> [Int]\nsieve (pr:r)\
    \ = [pr:sieve (filter pr r)]\nfilter:: Int [Int] -> [Int]\nfilter pr [n:r]\n \
    \ n mod pr == 0\n  otherwise = [n:filter pr r]\n```\n\n# Notational Conventions\
    \ Used in this Report\n\nThe following notational conventions are used in this\
    \ report. Text is printed in Microsoft Sans Serif 9pts, examples of CLEAN restrictions\
    \ are given in Courier New 9pts,\n\n+   Semantic restrictions are given in a bulleted\
    \ list-of-points. When these restrictions are not obeyed they will always result\
    \ in a compile-time error. In very few cases the restrictions can only be detected\
    \ at run-time (array index out-of-range, partial function called outside the domain).\n\
    \nThe following notational conventions are used in the context-free syntax descriptions:\n\
    [notation] means that the presence of notation is optional\n{notation} means that\
    \ notation can occur zero or more times\n{notation}+ means that notation occurs\
    \ at least once\none or more occurrences of notation separated by commas\nterinals\
    \ are printed in 9 pts courier\nkeywords are printed in 9 pts courier\nterinals\
    \ - can be left out in layout mode are printed in 9 pts courier\nis used for correction\
    \ notations\n{notation}/~str means the longest expression not containing the string\n\
    \nAll CLEAN examples in this report assume that the dependent mode has been chosen\
    \ that redundant semi-colons and curly braces are left out (see 2.3.3).\n\n# How\
    \ to Obtain Clean\n\nCLEAN and the INTEGRATED DEVELOPMENT ENVIRONMENT (IDE) can\
    \ be used free of charge. They can be obtained\n\n+   via World Web (http://clean.cs.ru)\
    \ or\nvia ftp (ftp://clean.cs.ru) in directory pub/Clean).\n\nCLEAN is available\
    \ on several platforms. Please check our WWW-pages regularly to see the latest\
    \ news. New versions of CLEAN in general appear first on WINDOWS and later on\
    \ MAC systems. Versions for Linux appear less frequently."
- md: "\n# Current State of the Clean System\n\nRelease 2.1 (November 2002).\n\nCompared\
    \ with the previous version the following changes have been made.\nExperimental\
    \ features of the previous version, such as dynamics (see Chapter 8), generics\
    \ (see Chapter 7) and strict-lists (see 4.2) have been improved and further incorporated\
    \ in the language.\nMany bugs, most of which were appeared in the new features,\
    \ have been removed.\nThe quality of the code generation has been improved.\n\n\
    Release 2.0 (November 2001).\n\n- There are many changes changed to the previous\
    \ release (CLEAN 1.3.x). We have added many new features in CLEAN 2.0 you will\
    \ like.\n- CLEAN 2.0 has multi-parameter type constructor classes. See Section\
    \ 6.4.\n- CLEAN 2.0 has universally quantified data types and functions (rank\
    \ 2). Section 3.7.4 and 5.1.4.\n- The explicit import mechanism has been refined.\
    \ Now can more precisely as to import and not what. See 2.5.1.\n- Cyclic dependencies\
    \ between definition modules are allowed. This makes it easier to define implementations\
    \ that share definitions. See 2.5.1.\n- Definitions in a definition module need\
    \ not to be repeated in the corresponding implementation module. See 2.4.\n- Due\
    \ to multi-parameter type constructor classes a better incorporation of the type\
    \ Array could be. See 4.4.\n\nCLEAN 2.0 offers an hybrid type system: one can\
    \ have statically and dynamically typed objects (Dynamics). A statically typed\
    \ expression can be changed into a dynamically typed one and backwards. The type\
    \ of a Dynamic can be inspected together using run-time unification, one can store\
    \ a Dynamic into a file with one function or read a Dynamic stored by another\
    \ CLEAN application. Dynamics can be used to store and retrieve information without\
    \ needing to write parsers, as one can exchange data and copy (!) applications\
    \ in a safe manner. Dynamics makes it easy to create mobile code, create plug-ins\
    \ or create a persistent store. The CLEAN run-time system has been extended to\
    \ support dynamic type checking, run-time unification, lazy dynamic linking and\
    \ just-in-time code generation See Chapter 8.\n\nThere is special syntax for strict\
    \ and unbound lists. One can easily change from lazy to strict and backwards.\
    \ Overloaded functions can be defined for any list (lazy, strict or unbound).\
    \ See 4.2. One can write functions with map, fold in generic. The generic functions\
    \ can one define work with other kinds. Kind induced functions can be indicated\
    \ which is actually meant (see Chapter 7). A generic definition can be specified\
    \ for a special type. The CLEAN system has been extended: a new version of the\
    \ CLEAN IDE, a new version of the run-time-system, and a dynamic linker is included.\
    \ See 8.3. CLEAN 2.0 comes with an integrated proof system (Sparkle), all written\
    \ in CLEAN of course. CLEAN 2.0 is open source. All source code will be made available\
    \ on the net.\n\nWe have removed things:\n\n- We do not longer support annotations\
    \ for concurrent evaluations ({P} and (l) annotations). However, we are working\
    \ on a library that will support evaluation of CLEAN expressions with Dynamics\
    \ (see Van Weelden Plasmijjer, 2002).\n- There is no strict-let expression (let!)\
    \ anywhere in CLEAN 2.x. You can enforce strict evaluation using the strict hash\
    \ (#).\n- One cannot default instances that could be used to disambiguate ambiguous\
    \ internal overloading. Disambiguating can be done by explicitly specifying the\
    \ required type.\n\nThere is some bad news:\n\n- Due to all these changes CLEAN\
    \ 2.0 is not upwards compatible with CLEAN 1.3.x. Many things are the same but\
    \ there are small differences as well. So, one has to put some effort in porting\
    \ a CLEAN 2.0. The most important syntactical differences are described below.\
    \ Note that we no longer support J.\n- The CLEAN 1.3 compiler is written in C.\
    \ The CLEAN 2.0 compiler has been rewritten from scratch in CLEAN. The internal\
    \ structure of the new compiler is better than the old one, but the new compiler\
    \ has become a bit slower than the previous C as well. Large programs will take\
    \ about 1.7 times as much time to compile (which is still pretty impressive for\
    \ a lazy functional language).\n\n# Syntactic differences between Clean 1.3 and\
    \ Clean 2.0\n\nCLEAN 2.x is not downward compatible with CLEAN 1.3.x. Probably\
    \ you have to change your 1.3.x sources to get them through the CLEAN 2.x compiler.\n\
    \n# Differences in Expression Syntax\n\nThere is no strict-level expression (let!)\
    \ anymore in CLEAN 2.x. You can still enforce strict evaluation using the strict\
    \ hash list (#).\n\n# Differences in the Type System\n\n- For multiparameter type\
    \ classes a small change in the syntax for instance definitions was necessary.\
    \ In CLEAN 1.3.x it was assumed that every instance definition has only one type\
    \ argument. So in the following 1.3.x instance definition\n\n```\ninstance c T1\
    \ T2\n```\n\nthe type (T1 T2) was meant (the type T1 with the argument T2). This\
    \ should be written in CLEAN 2.x as\n\n```\ninstance c (T1 T2)\n```\n\notherwise\
    \ T1 and T2 will be interpreted as two types.\n\nThe type Array has changed. In\
    \ CLEAN 2.x the Array class has become a multiparameter class, whose first argument\
    \ type is the array and second argument type is the array element (??). There\
    \ a 1.3 definition\n\n```\nMkArray :: !Int (Int -> e) -> e.(a) | Array e\nMkArray\
    \ i = {f j <- [0..i]}\n```\n\nbecomes in CLEAN 2.x:\n\n```\nMkArray :: !Int (Int\
    \ -> e) -> (a) | Array e\nMkArray i = {f j <- [0..i]}\n```\n\nThere is a difference\
    \ in resolving overloading. Consider the following code:\n\n```\nclass c a ::\
    \ a ->\ninstance c [Int] where\n    c [x:xs] = xs = [Int]\n```\n\nAlthough this\
    \ is accepted by CLEAN 1.3.x, CLEAN 2.x will complain: \"Overloading error: no\
    \ instance of type [a].\" The CLEAN 2.x compiler applies no unification after\
    \ resolving overloading. So c in function f applied to a list with type [a]. And\
    \ this is considered to be different from the type [Int]. If you the type [Int]\
    \ the code will be accepted CLEAN 2.x handles uniqueness attributes in type synonyms\
    \ different than CLEAN 1.3.x. Consider the following definitions:\n\n```\nListList\
    \ a := [[a]]\nf :: (ListList {Int}) -> *(Int)\nf [[a]] = {a & [0]}\n```\n\nIn\
    \ CLEAN 1.3.x the ListList type synonym was expanded to\n\n```\nf :: **[Int]]\
    \ -> *(Int)\n```\n\nwhich is correct in CLEAN 1.3.x. CLEAN 2.x expands it to\n\
    \n```\nf :: **[Int]] -> *(Int)\n```\n\nThis yields a uniqueness error in CLEAN\
    \ 2.x because the inner list is shared but contains a unique object. This problem\
    \ happens only when type synonyms have attributes like \"inbetween\". An \"inbetween\"\
    \ attribute is neither the \"root\" nor the attribute of actual argument. E.g.\
    \ with the type synonym, formal argument \"a\" is substituted with {Int}. Note\
    \ that the \"a\" is substituted for \"a\". Because we wrote (ListList ...) the\
    \ result of expanding (ListList {Int}) is [u:[Int]]. \"u\" is an attribute \"\
    inbetween\" because it is neither the root nor the attribute of formal argument.\
    \ Such attributes are made not unique in CLEAN 2.x and this is why the is not\
    \ accepted. The code would be accepted if you ListList to\n\n```\nListList a :=\
    \ [[a]]\n```\n\nAnonymous uniqueness attributes in type contexts are not allowed\
    \ in CLEAN 2.x. So in the following function simply remove the point.\n\n```\n\
    f :: a | myClass .a\n```\n\nThe String type has become a predefined type. As a\
    \ consequence you cannot import this type anymore. So:\n\n```\nfrom String import\
    \ String\n```\n\nis not valid.\n\nThere was a bug in the uniqueness typing system\
    \ of CLEAN 1.3: Records or data constructors could have quantified variables,\
    \ whose uniqueness attribute did not propagate. This bug has solved in CLEAN 2.x.\
    \ As a consequence the 2.x compiler might complain about your program where 1.3\
    \ compiler was happy. The problem might occur when you use the I/O library or\
    \ you use objects with uniquely attributed local state. Now the object becomes\
    \ unique as well and may not be shared anymore.\n\n# Differences in the Module\
    \ System\n\nThe syntax and semantics of explicit import statements have been completely\
    \ revised. With CLEAN 2.x it is possible to discriminate the different namespaces\
    \ in import statements. In CLEAN 1.3.x with the following statement\n\n```\nfrom\
    \ m import F\n```\n\ncould have the import of a function F together with a type\
    \ F and a class F with all its instances from m. In CLEAN 2.x one can precisely\
    \ describe from which space one wants to import (see 2.5.2). For example, the\
    \ following import statement\n\n```\nfrom m import F,\nT1; :: T2(..), :: T3(C1,\
    \ C2), :: T4(..), :: T5(field1, field2),\nclass C1, class C2(..), class C3 (mem1,\
    \ mem2)\n```\n\ncauses the following declarations to be imported: the function\
    \ or macro F, the type T1, the algebraic type T2 with all its constructors that\
    \ are exported by m, the type T3 with its constructors C1 and C2, the record type\
    \ T4 with all its fields that are exported by m, the record type T5 with its fields\
    \ field1 and field2, the class C1, the class C2 with all its members that are\
    \ exported by m, the class C3 with all its members mem1 and mem2.\n\nThere is\
    \ a tool \"CopPort\" that is available to automatically convert CLEAN sources\
    \ with 1.3.x import syntax to using 2.x syntax.\n\nPrevious Releases. The first\
    \ release of CLEAN was publicly available in 1987 and had version number 0.5 (with\
    \ half of the work was done; -). At that time, CLEAN was only thought as an intermediate\
    \ language. Many releases followed. One of them was version 0.8 which is used\
    \ in the Plasmeijer & Van Eeken Bible (Madison-Wesley, 1993). Version 1.0 was\
    \ the first mature version of CLEAN.\n\n# Copyright, Authors and Credits\n\nCLEAN,\
    \ CLEAN DEVELOPMENT SYSTEM, copyright 1987 - 2001, HILT B.V., the Netherlands.\n\
    \nHILT is a Dutch company owned by the CLEAN team founded to ensure excellent\
    \ technical support for commercial environments. HILT furthermore educates in\
    \ functional programming and develops commercial applications using CLEAN.\n\n\
    The CLEAN is a spin-off of the research performed by the Software Technology research\
    \ group, Nijmegen for Information and Computing Sciences (NIII), at the UNIVERSITY\
    \ OF NIJMEGEN under the supervision of prof. dr. i. Rinus Plasmeijver.\n\nThe\
    \ CLEAN System 2.0 is developed by:\nPeter Achten:\nObject I/O library\nArtem\
    \ Alamarine:\nSupport for Generic Programming\nDiederik van Arkel:\nCLEAN Integrated\
    \ Development Environment for Windows and Mac\n"
  mdcn: "\n\n# Clean 系统的现状\n\n版本 2.1 (2002年11月)。\n\n与之前的版本相比，进行了以下更改。\n之前版本的实验性功能，如动态（见第\
    \ 8 章）、泛型（见第 7 章）和严格列表（见 4.2）已经得到改进并进一步融入了语言中。\n许多漏洞（大部分出现在新功能中）已被移除。\n代码生成的质量得到了提高。\n\
    \n版本 2.0 (2001年11月)。\n\n- 与之前的发布版本（CLEAN 1.3.x）相比有很多变化。我们在 CLEAN 2.0 中增加了许多你可能会喜欢的新功能。\n\
    - CLEAN 2.0 具有多参数类型构造器类。见第 6.4 节。\n- CLEAN 2.0 具有全量化数据类型和函数（2 阶）。见第 3.7.4 和 5.1.4\
    \ 节。\n- 显式导入机制经过了精炼。现在可以更精确地指定导入的内容。见第 2.5.1 节。\n- 允许定义模块之间存在循环依赖。这使得定义共享定义的实现变得更加容易。见第\
    \ 2.5.1 节。\n- 定义模块中的定义不需要在相应的实现模块中重复。见第 2.4 节。\n- 由于多参数类型构造器类的引入，Array 类型可以被更好地整合。见第\
    \ 4.4 节。\n\nCLEAN 2.0 提供了一种混合类型系统：可以拥有静态类型和动态类型的对象（Dynamics）。静态类型表达式可以转换为动态类型表达式，反之亦然。可以使用运行时统一化共同检查\
    \ Dynamic 的类型，可以使用一个函数将 Dynamic 存储到文件中，或读取由另一个 CLEAN 程序存储的 Dynamic。Dynamics 可用于存储和检索信息，而无需编写解析器，因为可以以安全的方式交换数据和复制\
    \ (!) 应用程序。Dynamics 使得创建移动代码、插件或持久化存储变得简单。CLEAN 运行时系统已经扩展，以支持动态类型检查、运行时统一化、惰性动态链接和即时代码生成，详见第\
    \ 8 章。\n\n严格和无界列表有特殊的语法。可以轻松地从惰性切换到严格，反之亦然。可以为任何列表（惰性的、严格的无界的）定义重载函数。见 4.2 节。可以在泛型中使用\
    \ map、fold 编写函数。泛型函数可以定义以与其他类型工作。Kind 诱导的函数可以指示其实际含义（见第 7 章）。可以为特殊类型指定泛型定义。CLEAN\
    \ 系统已经扩展：包含一个新版本的 CLEAN IDE、新版本的运行时系统以及一个动态链接器。见第 8.3 节。CLEAN 2.0 带有一个集成的证明系统（Sparkle），当然是用\
    \ CLEAN 编写的。CLEAN 2.0 是开源的。所有源代码将在网上发布。\n\n我们移除了一些内容：\n\n- 我们不再支持并发评估的注解（{P} 和\
    \ (l) 注解）。然而，我们正在开发一个库，支持使用 Dynamics 评估 CLEAN 表达式（见 Van Weelden Plasmijjer, 2002）。\n\
    - CLEAN 2.x 中任何地方都没有严格-let 表达式 (let!)。你可以使用严格哈希 (#) 来强制严格评估。\n- 不能创建用于消除模糊内部重载的默认实例。可以通过显式指定所需的类型来消除歧义。\n\
    \n有一些坏消息：\n\n- 由于所有这些更改，CLEAN 2.0 不向上兼容 CLEAN 1.3.x。许多地方是相同的，但也有细微的。因此，迁移到 CLEAN\
    \ 2.0 需要花费一些精力。下面描述了最主要的语法差异。注意，我们不再支持 J。\n- CLEAN 1.3 编译器是用 C 语言编写的。CLEAN 2.0\
    \ 编译器用 CLEAN 从头重写。新编译器的内部结构比旧的更好，但新编译器也比之前的 C 慢一点。大型程序的编译时间将增加约1.7 倍（对于惰性函数式语言来说，这仍然令人印象）。\n\
    \n# Clean 1.3 和 Clean 2.0 之间的语法差异\n\nCLEAN 2.x 不向下兼容 1.3.x。你可能需要修改 1.3.x 的源码以通过\
    \ CLEAN 2.x 编译器的。\n\n# 表达式语法的差异\n\nCLEAN 2.x 中不再有严格级表达式 (let!)。你仍然可以使用严格哈希列表 (#)\
    \ 强制严格评估。\n\n# 类型系统中的差异\n\n- 对于多参数类型类，实例定义的语法需要进行微小更改。在 CLEAN 1.3.x 中，假设每个实例定义只有一个类型参数。因此，在下面的\
    \ 1.3.x 实例定义中：\n\n```\ninstance c T1 T2\n```\n\n指的是类型 (T1 T2)（带有参数 T2 的类型 T1）。这在\
    \ CLEAN 2.x 中应写为：\n\n```\ninstance c (T1 T2)\n```\n\n否则 T1 和 T2 将解释为两个类型。\n\n\
    Array 类型已经发生了变化。在 CLEAN 2.x 中，Array 类已变成多参数类，其第一个参数类型是数组，第二个参数类型是数组元素 (??)。这里有一个\
    \ 1.3 的定义：\n\n```\nMkArray :: !Int (Int -> e) -> e.(a) | Array e\nMkArray i =\
    \ {f j <- [0..i]}\n```\n\n在 CLEAN 2.x 中变为：\n\n```\nMkArray :: !Int (Int -> e)\
    \ -> (a) | Array e\nMkArray i = {f j <- [0..i]}\n```\n\n重载解析方面存在差异。考虑以下代码：\n\n\
    ```\nclass c a :: a ->\ninstance c [Int] where\n    c [x:xs] = xs = [Int]\n```\n\
    \n虽然 1.3.x 接受这种写法，但 2.x 会报错：“重载错误：没有类型 [a] 的实例。”CLEAN 2.x 编译器在解析重载后，将 c 应用于类型为\
    \ [a] 的列表。这被认为与类型 [Int] 不同。CLEAN 2.x 处理类型别名属性与 1.3.x 不同。考虑以下定义：\n\n```\nListList\
    \ a := [[a]]\nf :: (ListList {Int}) -> *(Int)\nf [[a]] = {a}\n```\n\n在 CLEAN 1.3.x\
    \ 中，ListList 类型别名展开为：\n\n```\nf :: **[Int]] -> *(Int)\n```\n\n 2.x 中产生唯一错误，因为内部列表是共享的但包含一个唯一的对象。这种情况只当类型别名具有\
    \ \"inbetween\" 属性时发生。“inbetween\" 属性既不是 \"root\" 也不是形式参数的属性。例如，使用类型别名，形式参数 \"\
    a\" 被替换为 {Int}。因为我们写了 (ListList ...)，结果 (ListList {Int}) 是 [u:[Int]]。\"u\" 是属性\
    \ \"inbetween\"，因为它既不是 \"root\" 也不是形式参数的属性。此类属性在 CLEAN 2.x 中被设为唯一，这就是为什么不被接受的原因。如果\
    \ ListList 到，代码将被接受：\n\n```\nListList a := [[a]]\n```\n\nCLEAN 2.x 不允许在类型上下文中使用匿名唯一属性。因此，在以下函数中只需移除点即可：\n\
    \n```\nf :: a | myClass .a\n```\n\nString 类型已成为预定义类型。因此你不能再导入该类型。所以：\n\n```\n\
    from String import String\n```\n\n是无效。\n\nCLEAN 1.3 的唯一性系统中有一个漏洞：记录或数据构造器可能带有唯一属性，该属性不会传递。该漏洞在\
    \ CLEAN 2.x 中得到了解决。因此，2.x 编译器可能会对 1.3 编译器接受的程序报错。当你使用 I/O 库或使用具有唯一属性的对象时可能会出现问题。现在对象也是唯一的，且不再可以共享。\n\
    \n# 模块系统的差异\n\n显式导入语句的语法和语义已完全修订。在 CLEAN 2.x 中，可以在导入语句中区分命名空间。在 CLEAN 1.3.x 中，使用以下语句：\n\
    \n```\nfrom m import F\n```\n\n可能会导入函数 F、类型 F 以及来自 m 的所有实例类 F。在 CLEAN 2.x 中，可以精确地描述从哪个空间导入（见\
    \ 2.5.2）。例如，以下导入语句：\n\n```\nfrom m import F,\nT1; :: T2(..), :: T3(C1, C2), ::\
    \ T4(..), :: T5(field1, field2),\nclass C1, class C2(..), class C3 (mem1, mem2)\n\
    ```\n\n会导致导入以下声明：函数或宏 F、类型 T1、由 m 输出的所有构造器的类型 T2、带有构造器 C1 和 C2 的类型 T3、由 m 输出的所有字段的记录类型\
    \ T4、带有字段 field1 和 field2 的记录类型 T5、类 C1、由 m 输出的所有成员的类 C2 以及带有成员 mem1 和 mem2 的类\
    \ C3。\n\n有一个名为 \"CopPort\" 的工具，可自动将 1.3.x 导入语法的 CLEAN 源码转换为 2.x 语法。\n\n之前的版本。CLEAN\
    \ 的首次发布于 1987 年，版本号为 0.5（工作完成了一半；-）。那时，CLEAN 只被认为是一种中间语言。之后有很多次发布。其中之一是 0.8 版本，用于《Plasmeijer\
    \ & Van Eeken 经》（Madison-Wesley, 1993）。版本 1.0 是 Clean 的第一个成熟版本。\n\n# 版权、作者和感谢\n\
    \nCLEAN, CLEAN 开发系统，版权 1988 - 2001, HILT B.V., 荷兰。\n\nHILT 是一家由 CLEAN 团队拥有的荷兰公司，旨在为商业环境提供卓越的技术支持而成立。HILT\
    \ 还负责函数编程的教育，并使用 CLEAN 开发商业应用。\n\nCLEAN 是奈梅根大学（UNIVERSITY OF NIJMEGEN）在 Rinus\
    \ Plasmeijver 教授指导下，由奈梅根信息与计算科学（NIII）软件技术研究小组进行的研究成果转化。\n\nCLEAN 系统 2.0 由以下人员开发：\n\
    Peter Achten：对象 I/O 库\nArtem Alamarine：泛型编程支持\nDiederik van Arkel：适用于 Windows\
    \ 和 Mac 的 CLEAN 集成开发环境\n"
