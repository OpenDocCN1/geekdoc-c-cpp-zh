    application (.exe file under Windows). The compilation scheme described above
    can be used even if Dynamics are internally used in an application. But, as soon
    as Dynamics are communicated to File or communicated to another program, a different
    run-time support is needed and the traditional compilation scheme is changed to
    prepare this.


    ![](img/9aeba7d533510ecb39b0eab112e3ff5d_105_1.png)


    In the changed compilation scheme, the static linker not only generates an application
    (actually, currently it is a .bat file), but it also generates two additional
    files. One is called the code repository (.lib file). All object codes of your
    application are collected here. The other file (.typ file) is a repository that
    contains all type'
  - '[PAGE 106]


    definitions. The repositories serve as a database which is accessed by the Dynamic
    Linker. Whenever an (other) application needs a plug or a type that has to be
    checked, the Dynamic Linker will look it up in the appropriate repository. When
    time a CLEAN program is recompiled, new repositories are created. Repositories
    should not be removed by hand because it might make the Dynamics stored on disk
    unreadable. A special garbage collector is provided that can remove unused repositories.


    When a CLEAN application doing dynamic I/O is started, a special linker (the Dynamic
    Linker, written in CLEAN) is started with it as well (if it is not already running).
    The Dynamic Linker is a server application on the computer. It will serve CLEAN
    programs that read or write Dynamics. The Dynamic Linker will construct the application
    or plug-in at run-time in the same way as the Static linker will compile to a
    conventional CLEAN program. There is no penalty unless the Code is linked to


    When a Dynamic is written to using the function writeDynamic, two (!) files are
    created: a .dyn and a .sysdyn file. The .sysdyn file contains the actual information:
    a String encoding of the dynamic. This sysdyn is used by the Dynamic Linker and
    should not be touched by the user because it might make the Dynamics stored on
    disk unreadable. The special garbage collector will also remove unused .sysdyn
    files.


    The user may only touch and use the .dyn file that contains the actual dynamic
    stored in the .sysdyn file. The .dyn file can be seen as a "typed" file. It can
    be handled like any other user file. It can be renamed, moved or deleted without
    any danger.


    When a Dynamic is written to a file, an encoding of the graph and its type are
    written to disk. The graph is encoded in a way that will be maintained when the
    graph is read again. The stored graph may contain unwanted evaluations. In a Dynamic
    on disk, functions are represented by symbolic pointers to the corresponding code
    repositories. The types stored in a Dynamic point to the corresponding type definitions
    stored in the type repositories.


    No plug-in will be plugged unless its type is approved. When a Dynamic stored
    on disk is read by an (other) application, first a pointer to the stored Dynamic
    is used in the CLEAN program. To use a Dynamic in an application one first has
    to examine it in a pattern match. In the pattern match the type of the Dynamic
    in an application first has to examine it with a specified type or with the type
    of another Dynamics. If the run-time application is successful, the Dynamic Linker
    will check whether all definitions of the types involved are identical as well.
    This information is fetched from the corresponding type repository when needed.
    If the types match succeeds as well, the corresponding function body can be evaluated.
    When the evaluation of the stored Dynamic is demanded, the graph in the Dynamic
    on disk is reconstructed as needed Dynamics nested in a Dynamic are reconstructed
    lazily). The Dynamic Linker links in the code to the unvaluated functions stored
    in the Dynamic. It is fetched from the code repository and plugged in the running
    (!) application. In cases the Dynamic Linker will ask the Code Generator to generate
    new code (just-in-time code generation) to construct the required image. The Dynamic
    Linker has to ensure that identical data types in different applications are linked
    in such a way that they are considered to be of the same type at run-time.


    # 8.5 Semantic Restrictions on Dynamics


    Dynamics are an experimental feature of CLEAN 2.0. In the current version there
    are still many restrictions and limitations.


    +   - The following types cannot be packed/unpacked: abstract data types, uniqueness
    types, overloaded types. We are working on it.'
