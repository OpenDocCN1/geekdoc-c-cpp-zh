    ### 8.2 使用 Match 解包动态\n### 8.2.1 解包抽象数据类型\n### 8.2.2 解包重载函数\n### 8.2.3 唯一类型表达式解包\n\
    ### 8.2.4 使用类型变量检查并统一类型\n### 8.2.5 使用重载变量检查并统一类型\n### 8.3 使用动态进行安全通信\n### 8.4\
    \ 动态实现的架构\n### 8.5 动态的限制\n\n## 9 唯一性类型化 (Uniqueness Typing)\n### 9.1 唯一类型化的基本思想\n\
    ### 9.2 属性传播\n### 9.3 使用唯一性属性定义新类型\n### 9.4 唯一性与共享\n### 9.4.1 高阶唯一类型化\n### 9.4.2\
    \ 唯一性强制转换\n### 9.5 唯一类型化与重载的结合\n### 9.5.1 构造器类\n### 9.6 高阶类型定义\n### 9.7 使用唯一类型化进行破坏性更新\n\
    \n## 10 严格性、宏与效率\n### 10.1 将惰性求值转换为严格求值的标注\n### 10.1.1 惰性与严格求值的优缺点\n### 10.1.2\
    \ 严格与惰性上下文\n### 10.1.3 严格与惰性上下文中的空间消耗\n### 10.1.4 严格与惰性求值的计算消耗\n### 10.1.5 将惰性转变为严格求值\n\
    ### 10.2 在全局层面定义图\n### 10.3 定义宏\n### 10.4 效率技巧\n\n## 11 外部语言接口\n### 11.1 外部导出\n\
    ### 11.2 使用 ABC\n\n## 上下文无关语法描述\n### A.1 Clean 程序\n### A.2 导入定义\n### A.3 函数定义\n\
    ### A.3.1 函数类型\n### A.3.2 模式\n### A.3.3 图表达式\n### A.4 宏定义\n### A.5 类型定义\n### A.5.1\
    \ 类型表达式\n### A.6 类与泛型定义\n### A.7 外部导出定义\n### A.8 命名\n### A.9 语义赋值\n\n## 词法结构\n\
    ### B.1 词法程序结构\n### B.2 注释\n### B.3 关键字与符号\n\n## 参考文献\n\n# 前言\n\n- 引言\n- 关于 Clean\
    \ 的更多信息\n- 关于本语言报告\n- 关于 Clean 语法的的一些说明\n- 本报告使用的符号惯例\n- 如何获取 Clean\n- Clean 系统的现状\n\
    - 版权、作者与致谢\n- 结语\n\n引言\n\nCLEAN 是一种实用的、通用的惰性函数式语言，适用于开发现实世界的应用程序。\n\nCLEAN 具有许多特性，其中包含一些非常特殊的。\n\
    \n函数式语言通常使用图重写技术实现。CLEAN 具有显式的图语义；可以在语言中显式定义结构的共享（包括循环结构）（Barendregt et al., 1987;\
    \ Sleep et al., 1993, Eekelen et al., 1997）。这为控制函数程序的时间行为提供了更好的框架。\n\n对于实际应用而言，特别重要的是\
    \ CLEAN 的唯一性类型系统（Barendsen and Smeters, 1993a），它允许在纯框架内整合任意对象的破坏性更新，并与外部世界创建直接接口。\n\
    \nCLEAN 的“独特”特性使得在 CLEAN 中定义一个复杂且高效的 I/O 库成为可能（Achten and Plasmijer, 1992 & 1995）。Clean\
    \ I/O 库实现了高抽象的 I/O 操作。可以定义回调函数和带有任意本地状态的 I/O 组件，提供面向对象的编程风格（Achten, 1996; Achten\
    \ and Plasmijer, 1997）。该库为窗口系统提供了平台无关接口：无需修改源代码即可将 Clean 中的窗口 I/O 操作移植到不同平台（支持\
    \ Mac 和 PC）。\n\n尽管 CLEAN 默认是惰性语言，但我们可以平滑地转换为严格语言以获取时间/空间行为：函数可以定义为惰性的，也可以在参数上是部分严格的；（递归）数据结构可以定义为惰性的，也可以在任何参数上是部分严格的。\n\
    \n"
