    # 5.4 Defining Abstract Data Types


    A type can be exported by defining the type in a CLEAN module (see Chapter 2).
    For software engineering reasons it sometimes only the name of a type but not
    its concrete (the right-hand side of the type definition). The type becomes an
    abstract data type. In CLEAN this is by specifying only the left-hand-side of
    a type definition module while the concrete definition (right-hand side of the
    type definition) is hidden in the implementation module. So, CLEAN''s structure
    is used to hide the actual implementation. When one wants to do something with
    objects of abstract type needs to export functions that can create and manipulate
    objects of this type as well.


    +   - Abstract type definitions are only allowed in definition modules, the concrete
    definition has to be given in the implementation module.

    nThe left-hand side of the concrete type should be identical to (modulo alpha
    conversion for variable names) the left-hand side of the abstract type definition
    (inclusive strictness and uniqueness type attributes).


    ```

    AbstractTypeDef              :: TypeLhs ;

    ```


    Example of an abstract data type.


    ```

    definition module stack

    ::Stack a

    Empty         ::  (Stack a)

    ```'
