    # 9.7 Destructive Updates using Uniqueness Typing


    So, it is allowed to update a uniquely typed function argument (*) destructively
    when the argument does not reappear in the result function. The question is: does
    the compiler make use of this possibility?


    Destructive updates take place in some predefined functions and operators which
    work on predefined structures such arrays (&operator) and (writing to a file).
    Arrays and files are intended to be used destructively and there can have a large
    impact on the space and time behavior of your application (a new node does not
    have to be claimed and filled, the garbage collector is invoked less and the locality
    of memory references is increased)


    Performing destructive updates is only sensible when information is stored in
    nodes. Arguments of type (Int, Real, Char or Bool) are stored on the B-stack or
    in registers and therefore does not make sense to make them unique.


    The CLEAN compiler also has an option to re-use user-defined unique types: the
    space occupied by an argument of unique type will under certain conditions be
