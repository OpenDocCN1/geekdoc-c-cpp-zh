    rule is chosen for execution when


    +   * the patterns in the formal arguments are matching the corresponding actual
    arguments of the function application (see 3.2) and

    * the optional guard (see 3.3) specified on the right-hand side evaluates to True.

    The alternatives are listed in textual order. A function can be preceded by a
    definition of its type (Section 3.7).


    +   * Function definitions are only allowed in implementation modules (see 2.3).

    * It is required that the alternatives of a function are textually grouped together
    (separated by semi-colons) when the layout sensitive mode is not chosen.

    * Each of a function must start with the function symbol.

    * A function has a fixed arity, so in each rule the same number of formal arguments
    must be specified. Functions can be used and applied to any number of arguments,
    as is usual in higher functional languages.

    * The function name must in principle be different from other names in the same
    name and same scope (see 2.1). However, it is possible to overload functions and
    operators (see Chapter 6).


