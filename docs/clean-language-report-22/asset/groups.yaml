    ## 6.3 Instances of Type Classes Defined in Overloaded Functions\n\nThe concrete\
    \ functions defined in a class instance definition can also be defined in terms\
    \ of (other) overloaded functions. This is reflected in the type of the instantiated\
    \ functions. Both the concrete type and the context here have to be specified.\n\
    \nExample of an instance declaration with a type which depends on the same type\
