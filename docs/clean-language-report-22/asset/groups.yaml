    \ information about CLEAN (http://clean.cs.ru/nl) please check out our pages.\n\
    \n## About this Language Report\n\nIn this report the syntax and semantics of\
    \ CLEAN version 2.0 are explained. We always give a motivation why we have included\
    \ a feature. Although the report is not intended as introduction into the language,\
    \ we did our best to make it as readable as possible. Nevertheless, one sometimes\
    \ has to work through several sections all over the report. We have included links\
    \ where possible to support browsing through the manual.\n\nAt several places\
    \ in this report context free syntax fragments of CLEAN are given. We sometimes\
    \ repeat fragments that are also given just to make the description clearer (e.g.\
    \ in the uniqueness chapter we repeat parts of the syntax for the classical types).\
    \ We hope that this is not confusing. The complete collection of context free\
    \ grammar rules is summarized in Appendix A.\n\n## Some Remarks on the Clean Syntax\n\
    \nThe syntax of CLEAN is similar to the one used in most modern functional languages.\
    \ However, there are a couple of small syntactic differences we want to point\
    \ out here for people who don't like to read language.\n\nIn CLEAN the arity of\
    \ a function is reflected in its type. When a function is defined its untried\
    \ type is specified! To avoid any confusion we want explicitly state here in CLEAN\
    \ there is no restriction whatsoever on the curried type of functions. However\
    \ we do not need a feel to express in this every type. Actually, the way we express\
    \ types of functions more clearly reflects the way functions are internally treated.\n\
    \nE.g., the standard map function (arity 2) is specified in CLEAN as follows:\n\
    \n```\nmap:: (a -> b) [a] -> [b]\nmap f [] = []\nmap f [x:xs] = [f x:map f xs]\n\
    ```\n\nEach predefined structure such as a list, tuple, a record or array has\
    \ its own kind of brackets: lazy lists are always denoted with square brackets\
    \ [], spine lists are denoted by [...], overloaded lists by {[...}, unboxed boxes\
    \ by {#}. For the the usual parentheses are used (,), curly braces are used for\
    \ records (indexed by field name) and as for arrays (indexed by number).\n\nIn\
    \ types funny symbols can appear like, u:, *, ! which can be ignored and left\
    \ out if one is not interested in uniqueness or strictness.\n\nThere are only\
    \ a few keywords in CLEAN leading to a heavily overloaded use of : and symbols:\n\
    \n```\nfunction::argtype -> restype // type specification of a function\n\nfunction\
    \ pattern\n guard = rhs // definition of a function\n\nselector = graph // definition\
    \ of a constant/CAF/graph\n\nfunction args := rhs // definition of a macro\n```\n\
    \n```\n// Type args = typedef\n// an algebraic data type definition\n// a type\
    \ synonym definition\n// an abstract type definition\n```\n\nAs is common in modern\
    \ languages, there is a layout rule in CLEAN (see 2.3). For reasons of portability\
    \ it is assumed that a tab is set to 4 spaces and a non-proportional font is used.\n\
    \nFunction definition in CLEAN use of the layout rule.\n\n```\nprimes:: [Int]\n\
    primes = sieve [2..]\nwhere\nsieve:: [Int] -> [Int]\nsieve (pr:r) = [pr:sieve\
    \ (filter pr r)]\nfilter:: Int [Int] -> [Int]\nfilter pr [n:r]\n  n mod pr ==\
    \ 0\n  otherwise = [n:filter pr r]\n```\n\n## Notational Conventions Used in this\
    \ Report\n\nThe following notational conventions are used in this report. Text\
    \ is printed in Microsoft Sans Serif 9pts, examples of CLEAN restrictions are\
    \ given in Courier New 9pts,\n\n- Semantic restrictions are given in a bulleted\
    \ list-of-points. When these restrictions are not obeyed they will always result\
    \ in a compile-time error. In very few cases the restrictions can only be detected\
    \ at run-time (array index out-range, partial function called outside the domain).\n\
    \nThe following notational conventions are used in the context-free syntax descriptions:\n\
    [notation] means that the presence of notation is optional\n{notation} means that\
    \ notation can occur zero or more times\n{notation}+ means that notation occurs\
    \ at least once\none or more occurrences of notation separated by commas\nterinals\
    \ are printed in 9 pts courier\nkeywords are printed in 9 pts courier\nterinals\
    \ can be left out in layout mode are printed in 9 pts courier\nis used for correction\
    \ notations\n{notation}/~str means the longest expression not containing the string\n\
    \nAll CLEAN examples in this report assume that the dependent mode has been chosen\
    \ that redundant semi-colons and curly braces are left out (see 2.3.3).\n\n##\
    \ How to Obtain Clean\n\nCLEAN and the INTEGRATED DEVELOPMENT ENVIRONMENT (IDE)\
    \ can be used free of charge. They can be obtained\n\n- via World Web (http://clean.cs.ru)\
    \ or\nvia ftp (ftp://clean.cs.ru) in directory pub/Clean).\n\nCLEAN is available\
    \ on several platforms. Please check our WWW-pages regularly to see the latest\
    \ news. New versions of CLEAN in general appear first on WINDOWS and later on\
    \ MAC systems. Versions for Linux appear less frequently.\n"
