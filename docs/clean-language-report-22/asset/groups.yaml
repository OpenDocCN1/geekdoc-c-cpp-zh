    \ modules\n[special] {TypeVariable = Type} // in definition modules\n```\n\nExample\
    \ of the definition of an instance of a type class Arith for type Int. The type\
    \ of the concrete functions can be obtained via uniform substitution of the type\
    \ variable in the class definition by the corresponding type specified in the\
    \ instance definition. One is not obliged to repeat the type of the concrete functions\
    \ (not the free fix or associativity in the case of operators).\n\n```\ninstance\
    \ Arith Int\nwhere\n(+): Int Int -> Int\n(+) x y = x ^ y\n(-): Int Int -> Int\n\
    (-) x y = x - y\n```\n\nExample of the definition of an instance of a type class\
    \ Arith for type Real.\n\n```\ninstance Arith Real\nwhere\n(+) x y = x + y\n(-)\
    \ x y = x - y\n```\n\nExample. Instantiation of Arith2 using the definitions above.\n\
    \n```\ninstance Arith2 Int Int where (:+) x y = x + y\ninstance Arith2 Real Int\
    \ (:+) x y = x + y\ninstance Arith2 Int Real (:+) x y = x + y\ninstance Arith2\
    \ Real Real (:+) x y = x + y\n```\n\nOne can define many instances of a class\
