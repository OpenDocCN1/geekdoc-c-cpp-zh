    \ // strict array\n             // unboxed array\n```\n\n# 4.4.1 Creating Arrays\
    \ and Selection of field Elements"
  - "[PAGE 56]\n\nAn array is a tuple/record-like data structure in which all elements\
    \ are of the same type. Instead of selection by position or name the elements\
    \ of an array can be selected efficiently in constant time by indexing. The update\
    \ of arrays is done in CLEAN and therefore arrays are unique (see Chapter 9) if\
    \ one wants to use this feature. Arrays are very useful if time and space consumption\
    \ is becoming critical (CLEAN arrays are implemented very efficiently). If efficiency\
    \ is not a big issue we recommend not to use arrays by lists: lists induces a\
    \ much better programming style. Lists are more flexible and less error prone:\
    \ array elements can only be accessed via indices and if you make a calculation\
    \ error, indices may point outside the array bounds (e.g. a matrix) it is detected,\
    \ but only at run-time. CLEAN arrays starts with 0. More dimensional arrays can\
    \ be defined as an array of.\n\nFor efficiency reasons, arrays are available of\
    \ several types: there are lazy arrays {a}, strict arrays (type {!a}) and unboxed\
    \ arrays {#Int}. All arrays are considered to be of different type. By using the\
    \ overloading mechanism (type constructor classes) one can still define (overloaded)\
    \ functions that work on any of these.\n\n```\nArray = ArrayDenotation\n     \
    \ | ArrayUpdate\n```\n\n+   - All elements of an array need to be of same type.\n\
    \n# Simple Array\n\nA new array can be created in a number of ways. A direct way\
    \ is to simply list the array elements.\n\n```\nArrayDenotation = {GraphExpr}-list\n\
    \              | StringDenotation\n\nStringDenotation = StringDel(AnyChar~/~StringDel)StringDel\n\
    StringDel = \"\n```\n\nBy default a lazy array will be created. Arrays are created\
    \ unique (the * or. attribute in front of the type, Chapter 4) to make destructive\
    \ updates.\n\nA lazy array is a box with pointers pointing to the array elements.\
    \ One can also create a strict array (explicitly define its type as {!Int}), which\
    \ will have the power to the elements to the array box points will be directly\
    \ evaluated. One can create an unboxed array (explicitly define its type as {#Int}),\
    \ which will have the power to evaluate the elements (which are to of basic value)\
    \ are stored in the array box. Clearly the last one is the most efficient representation\
    \ (see also Chapter 10).\n\nCreating a lazy array, strict and unboxed array of\
    \ integers with elements 1,3,5,7,9.\n\n```\nMyLazyArray :: {:Int}\nMyLazyArray\
    \ = {1,3,5,7,9}\n\nMyStrictArray :: {!Int}\nMyStrictArray = {1,3,5,7,9}\n\nMyUnboxedArray\
    \ :: {#Int}\nMyUnboxedArray = {1,3,5,7,9}\n```\n\nCreating two dimensional array,\
    \ in this case a unique array of unique arrays of unboxed integers.\n\n```\nMatrixA\
    \ :: ({#Int})\nMatrixA = {{1,2,3,4},{5,6,7,8}}\n```"
  - '[PAGE 57]


    To make it possible to use operators as array selection on any of these arrays
    (of actually different type) a multi parameter type constructor has been defined
    (in StdArray) which expresses that "some kind of array structure is created".
    The compiler will therefore deduce the following type:


    ```

    Array :: (a Int) | Array a Int

    Array = (1,3,5,7,9)

    ```


    A string is a predefined type which is equivalent to an unboxed array of characters
    {#Char}. Notice that this array is not unique, such that a destructive update
    of a string is not allowed. There is special syntax to denote strings.


    Some ways to define a string, i.e. an unboxed array of character.


    ```

    "abc"

    (''a'', ''b'', ''c'' )

    ```


    There are a number of handy functions for the creation and manipulation of arrays
    defined in CLEAN''s Standard Environment. These functions are overloaded to deal
    with any type of array. The restrictions for these functions express that "an
    array structure is required" containing "an array element".


    # Type of some defined on Arrays.


    ```

    createArray :: !Int e -> (a e) | Array a e // size arg1, a[i] =

    arg2 :: (a e) -> Int | Array a // number of elements in

    array

    ```


    # Array Update and Array Comprehensions


    It is possible to create an array out of an existing one (a functional update).


    ```

    ArrayUpdate = { ArrayExpr & [{ArrayIndex Selection} = GraphExpr-list] [\\ {Qualifier}-list]

    | [ArrayExpr] GraphExpr \\ {Qualifier}-list]

    Selection = FieldName

    | = ArrayIndex

    ArrayExpr = GraphExpr

    ```


    From the left (& a [i] = v) is pronounced as: array a for a[i] value v old array
    has to be specified which has to be of unique type to make destructive updating
    possible. From the right of the & array elements are listed in the new array from
    the old one. One can change the element of the array or any field or array element
    of a record or stored in the array. The &-operator is strict in its arguments.


    +   An array expression must be of type.

    The array expression to the left of the update operator ''&'' yields an object
    of type unique.

    an array index must be an integer value between 0 and the number of elements of
    the array-1. An index out of range will result in a run-time error.

    unboxed arrays can only be of basic type, record type or array type.

    A unique array of any type created by an overloaded function cannot be converted
    to a non-unique array.


    Important. For reasons of efficiency we have defined the updates only on arrays
    which are of unique type (*...), so that the update can always be done destructively
    (!) which is semantically sound because the original unique array is known not
    to be used anymore.'
