    \ Semantic Restrictions on Algebraic Data Types\n\nOther semantic restrictions\
    \ on algebraic data types:\n\n+   - The name of a type must be different from\
    \ other names in the same scope and name space (see 2.1) The name of a type variable\
    \ must be different from other variable names in the same scope and name space\n\
    \ All type variables used on the right-hand side are bound, i.e. must be either\
    \ on the left-hand side of the algebraic type being defined, or must be bound\
    \ by a universal quantifier specified on the corresponding argument.\nA data constructor\
    \ can only be defined within the same scope and name space. So, each data constructor\
    \ unambiguously identifies its type to make type inference possible.\n When a\
    \ data constructor is used in infix position both arguments have to be present.\
    \ Data constructors can be used in a curved way in the function world, but then\
    \ they are used as ordinary prefix constructors.\n Type constructors can be used\
    \ in a curved way in the type world; to predefined bracket-like constructors (for\
    \ tuples, arrays) in a curved way they may be used in prefix notation.\nThe right-hand\
    \ side of an algebraic data type definition should yield a type of kind X, all\
    \ arguments of the data constructor being defined should be of kind X as well.\n\
    A type can only be instantiated with a type that is the same kind.\n An existentially\
    \ quantified type variable specified in an algebraic data type can only be instantiated\
    \ with a concrete type (not a type variable) when a data structure of this type\
    \ is created.\n\n# 5.2 Defining Record Types\n\nA record type is basically an\
    \ algebraic data type in which exactly one constructor is defined. Special about\
    \ records is that a field name is attached to each of the arguments of the data\
    \ constructor and that\n\n+   - records cannot be used in a curved way.\n\nCompared\
    \ with ordinary algebraic data structures the use of records gives a lot of notational\
    \ convenience because the field name enable selection by position When a record\
    \ is created all arguments of the constructor have to be defined but one can specify\
    \ the arguments in any order. Furthermore, when pattern matching is performed\
    \ on a record, one has to mention those fields one is interested in (see 5.2.2).\
    \ A record can be created via a functional update (see 5.2.1). In that case one\
    \ has to specify the values for those fields that differ from the old. Matching\
    \ and creation of records can be be specified in CLEAN which allows a change in\
    \ the structure of a record without those functions having to be explicitly referenced\
    \ to the fields changed\n\nExistential and universal types (see 5.1.3 and 5.1.4)\
    \ are allowed in record types (as in any other type). The arguments of the constructor\
    \ can be optionally annotated as being strict (see 10.1). The option uniqueness\
    \ attributes treated in Chapter 9.\n\n```\nRecordTypeDef = TypeLhs = [ExistentialQuantVariables]\
    \ [Strict] {[FieldName :: [Strict Type]-list} ;\n```\n\nAs data constructor for\
    \ the name of the record type is used internally.\n\n+   - The semantic restrictions\
    \ that apply for algebraic data types hold for record types. The field names inside\
    \ each record have to be different. It is allowed to use the same field name in\
    \ different records. If the same names are used in different records, one can\
    \ explicitly specify the intended"
- md: "\nrecord type when the record is constructed.\n\nExample of a record definition.\n\
    \n```\n::Complex    = { re :: Real\n               im :: Real }\n```\n\nThe combination\
    \ of existential type variables in record types are of use for an object oriented\
    \ style of programming.\n\nExample use of an existentially quantified record.\
    \ One can create an object of a certain type that can have different representations.\n\
    \n```\n::Object = { state :: x\n               get :: x -> Int\n             \
    \  set :: x -> Int -> x }\n```\n\n```\nCreateObject1 :: Object\nCreateObject1\
    \ = {state = []], get = myget, set = myset}\nwhere\n  myget :: [Int] -> Int\n\
    \  myget [i:is] = i\n  myget [] = 0\n  myget :: [Int] -> [Int]\n  myget i = [i:is]\n\
    ```\n\n```\nCreateObject2 = {state = 0.0, get = myget, set = myset}\nwhere\n \
    \ myget :: Real -> Int\n  myget r = toInt r\n  myget :: Real -> Real\n  myget\
    \ ri = r + toReal i\n```\n\n```\nGet:: Object -> Object\nGet (state,get) = get\
    \ state\n```\n\n```\nSet:: Object Int -> Object\nSet o=(state.state) i = {o &\
    \ state = set state i}\n```\n\n```\nStart:: [Object]\nStart = map (Set 3) [CreateObject1,CreateObject]\n\
    ```\n\nExample of a complex number as record type with strict contents.\n\n```\n\
    ::Complex    = { re :: !Real\n               im :: !Real }\n```\n\n```\n(+) infixl\
    \ 6 :: !Complex -> Complex\n(+) {re=r1,im=i1} = {re=r1+r2,im=im1+i2}\n```\n\n\
    The compiler unboxes records to make the generated code more efficient. In some\
    \ cases this is less efficient, for example abstract data types, large unique\
    \ records that can be updated in place, or when records are shared. Therefore\
    \ unboxing can be prevented by adding an ! before the { in the record type definition.\n\
    \n## 5.2.1 Creating Records and Selection of Record Fields\n\nA record is a tuple-like\
    \ algebraic data structure that has the advantage that its elements can be selected\
    \ by field name rather than position.\n\n```\nRecord = RecordDenotation\n    \
    \  | RecordUpdate\n```\n\n## Simple Records\n\nThe first way to create a record\
    \ is by explicitly defining a value for each of its fields.\n\n```\nRecordDenotation\
    \ = {[TypeName] | [FieldName = GraphExpr]-list}\n```\n\nCreation of a record.\n\
    \n```\n::Point = { x:: Real\n           } // record type definition\n::ColorPoint\
    \ = { p: Point\n               c: Color } // record type definition\n::Color =\
    \ Red | Green | Blue // algebraic type definition\n```\n\n```\nCreateColorPoint::Real,Real)\
    \ Color -> ColorPoint // type of function\nCreateColorPoint(px,py) col = { c =\
    \ col // function creating a new record\n                              p = { x\
    \ = px\n                               y = py }}\n```\n\n- A record can only be\
    \ used if its type has been defined in a record type definition; the field names\
    \ used must be identical to the field names specified in the corresponding type.\n\
    - When creating a record explicitly, the order in which the records are instantiated\
    \ is irrelevant, but all fields have to get a value; of these values must be an\
    \ instantiation of the corresponding type specified in record type definition.\
    \ Used of records is not possible.\n- When creating a record, its type constructor\
    \ can be used to disambiguate the record from other records; the type constructor\
    \ can be left out if there is at least one field name is specified which is not\
    \ defined in some other record.\n\n## Record Update\n\nThe second way is to construct\
    \ a new record out of an existing one (a functional record update).\n\n```\nRecordUpdate\
    \ = {[TypeName] | [RecordExpr &|[FieldName {Selection} = GraphExpr]-list}\n  \
    \            Selection = .FieldName\n              . .ArrayIndex\nRecordExpr =\
    \ .GraphExpr\n```\n\n- The expression must yield a record.\n\nThe record written\
    \ to the left of the (& f = v) is pronounced as: r with f for the value v is the\
    \ record to be duplicated. On the right of the & the types are specified in which\
    \ this new record differs from the old one. A structure can be any field of the\
    \ record or a selection of any field or element of a record or array. All other\
    \ fields are duplicated and created implicitly. Notice that the functional update\
    \ is an update in the classical, destructive sense since a new record is created.\
    \ The functional update of records is performed well enough that we do not add\
    \ support for destructive updates of records of unique type. The &-operator sits\
    \ in its arguments.\n\nUpdating a record within the functional update.\n\n```\n\
    MoveColorPoint::ColorPoint (Real, Real) -> ColorPoint\nMoveColorPoint cp (dx,\
    \ dy) = cp.px + dx, cp.y = c.p.y + dy\n```\n\n## Record of a Record Field\n\n\
    | RecordSelection = RecordExpr [.TypeName].FieldName (Selection) |\n| Selection\
    \ = RecordExpr [.TypeName]!FieldName (Selection) |\n| = .FieldName|ArrayIndex\
    \ |\n\nWith a record selection (using the '*'), you can select the value in the\
    \ indicated record field. A 'unique' selection using the '!' returns a tuple containing\
    \ the demanded record.\n\n## 5.2.2 Record patterns\n\nThe left-hand side of the\
    \ concrete type should be identical to (modulo alpha conversion for variable names)\
    \ the left-hand side of the abstract type definition (inclusive strictness and\
    \ uniqueness type attributes).\n\n```\nRecordPattern = {[TypeName] | [FieldName\
    \ = GraphExpr]-list\n```\n\n- Only those fields one would like to use are mentioned\
    \ in the record definition.\n- The type constructor can be used to disambiguate\
    \ the record from other records; the type constructor can be left out if there\
    \ is at least one field name is specified which is not defined in some other record.\n\
    \n```\n::Tree a = Node (Tree a) (Tree a)\n        | Leaf a\n```\n\nA record selection\
    \ (using the '*'), you can select the value in the indicated record field. A 'unique'\
    \ selection using the '!' returns a tuple.\n\nMirror::Tree a -> Tree a\nMirror\
    \ (Node tree:(left,right))    = Node {tree=r,right=l}\nMirror leaf           \
    \                    = leaf\n```\n\nThe first alternate of function Mirror defined\
    \ in.\n\n```\nMirror (Node tree)    = Node {tree=right,right=left}\n```\n\nor\n\
    \n```\nMirror (Node tree:(left,right))    = Node {tree=left,right=tree}\n```\n\
    \n## 5.3 Defining Synonym Types\n\nSynonym types permits the programmer to introduce\
    \ a new type name for an existing type.\n\n```\nSynonymTypeDef              ::\
    \ TypeLhs := [UniversalQuantVariables]Type\n```\n\n- Cyclic definitions of synonym\
    \ types (e.g. :Tab::a := Gab::Tab) are not allowed.\n\nExample of a type definition.\n\
    \n```\n::Operator a -> a -> a\nmap2: (Operator a) [a] [a] -> [a]\nmap2 op [] \
    \              = []\nmap2 op [f1:r2] [f2:r2] = [op f1 f2 :map2 op r1 r2]\n```\n\
    \n```\nStart:: Int\nStart = map2 (*) [2,3,4,5] [7,8,9,10]\n```\n\n## 5.4 Defining\
    \ Abstract Data Types\n\nA type can be exported by defining the type in a CLEAN\
    \ module (see Chapter 2). For software engineering reasons it sometimes only the\
    \ name of a type but not its concrete (the right-hand side of the type definition).\
    \ The becomes an abstract data type. In CLEAN this is by specifying only the left-hand-side\
    \ of a type definition module the concrete definition (right-hand side of the\
    \ type definition) is hidden in the implementation module. So, CLEAN's structure\
    \ is used to hide the actual implementation. When one wants to do something with\
    \ objects of abstract type needs to export functions that can create and manipulate\
    \ objects of this type.\n\n- Abstract type definitions are only allowed in definition\
    \ modules, the concrete definition has to be given in the implementation module.\n\
    The left-hand side of the concrete type should be identical to (modulo alpha conversion\
    \ for variable names) the left-hand side of the abstract type definition (inclusive\
    \ strictness and uniqueness type attributes).\n\n```\nAbstractTypeDef        \
    \      :: TypeLhs ;\n```\n\nExample of an abstract data type.\n\n```\ndefinition\
    \ module stack\n::Stack a\nEmpty         ::  (Stack a)\n```\n"
