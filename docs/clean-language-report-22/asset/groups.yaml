    \ e) | Array a e\nSwap i j:([i]=ai,j]=aj) = {a & [i]aj, [j]=ai}\n```\n\n# 4.5\
    \ Predefined Type Constructors\n\nPredefined types can also be used in curved\
    \ way. This make the type constructor has been defined for predefined types of\
    \ higher kind (see also 5.1.2). The kind X stands for so-called first-order type:\
    \ a type expecting no further arguments ([Int, [Int], etcetera). All functions\
    \ are of kind X. The kind X -> X stands for a type that can be applied to a (first-order)\
    \ type which which another first-order type, X -> X -> X expects two type arguments,\
    \ and so on.\n\n```\nInt, Bool, [Int], Tree [Int] :: X\na{}, (), Int, (->) (a)\
    \ :: X -> X\n(,), (--) :: X -> X -> X\n:: :: X -> X -> X -> X\n```\n\n```\nPredefinedTypeConstructor\
    \ = [] // list type constructor\n[!] // head list type constructor\n[!] // tail\
    \ list type constructor\n[#] // strict list type constructor\n[!] // unboxed head\
    \ list type constructor\n[#] // unboxed strict list type\n{,+} // tuple type constructor\
    \ (arity > 2)\n{} // lazy array type constructor\n[!] // strict array type constructor\n\
    [#] // unboxed array type constructor\n(-- // arrow type constructor\n```\n\n\
    So, all predefined types can be written in prefix notation as follows:\n\n```\n\
    [] is equivalent with [a]\n[!] is equivalent with ![a]\n[!] is equivalent with\
    \ ![a]\n[!] a is equivalent with ![a]\n[#] is equivalent with [#a]\n[!] a is equivalent\
    \ with [a]\n(,) a b is equivalent with (a,b)\n(,) a b c is equivalent with (a,b,c)\
    \ and so on for n-tuples\n() is equivalent with (a)\n!() is equivalent with (a)\n\
    ```"
  - "[PAGE 61]\n\n# a is equivalent with {#a}\n(-)-> b is equivalent with (a -> b)\n\
    \n# ## 4.6 Arrow Types\n\nThe *arrow type* is a predefined type constructor used\
    \ to indicate *function* objects (these functions have at least one). One can\
    \ use the Cartesian product (uncurried version) to denote the function type ([see\
    \ 3.7])) to obtain a compact notation. Curried functions applications and types\
    \ are automatically converted to their uncurried equivalent versions.\n\nArrowType\
    \ = (Type -> Type)\n\nExample of an arrow type.\n\n((a -> b -> c) [a] [b] -> [c])\n\
    \nbeing equivalent with:\n\n((a -> b -> c) -> [a] -> [b] -> [c])\n\n# ## 4.7 Predefined\
    \ Abstract Types\n\n*Abstract data types* are types of which the actual definition\
    \ is hidden ([see 5.4]). In CLEAN the types **World** and **File** are *predefined\
    \ abstract data types*. They are recognised by the compiler and treated specially,\
    \ either for efficiency or they play a special role in the language. Since the\
    \ actual definition is hidden it is not possible to denote constant values of\
    \ these predefined abstract types. There are functions predefined in the CLEAN\
    \ library for the creation and manipulation of these predefined abstract data\
    \ types. Some functions work (only) on unique objects.\n\nAn object of type **World**\
    \ (*) indicates that the world is unique is automatically created when a program\
    \ is started. This object is optionally given as argument to the *Start* function\
    \ ([see 2.3]). With this object efficient interfacing with the world (which indeed\
    \ unique) is possible.\n\nAn object of type **File** or **File** (unique File)\
    \ can be created by means of the functions defined in *StdFile* (see CLEANS Standard\
    \ Library). It makes direct manipulation of persistent data. The type **File**\
    \ is predefined for reasons of efficiency; CLEAN **Files** are directly coupled\
    \ to concrete files.\n\nThe type **String** is a predefined synonym type that\
    \ is predefined for convenience. The type synonym for unboxed array of characters\
    \ (#Char).\n\n```\nPredefType = World          // see StdWorld.dcl\n         \
    \      | File             // see StdFile.dcl\n               | String        \
    \ // synonym for {#Char}\n```"
- md: "\n# Defining New Types\n\n## 5.1 Defining Algebraic Data Types\n## 5.2 Defining\
    \ Record Types\n## 5.3 Defining Synonym Types\n## 5.4 Defining Abstract Data Types\n\
    \nCLEAN is a strongly typed language: every object (graph) and function (graph\
    \ rewrite) in CLEAN has a type. The basic type system of CLEAN is based on the\
    \ classical polymorphic Milner/Hindley/Mycroft (Milner 1978; Hindley 1969, Mycroft\
    \ 1984) type system. This type is adapted for graph rewriting systems and extended\
    \ with basic types, (possibly existentially and universally quantified) algebraic\
    \ types, record types, abstracts and synonym types.\n\nNew types can be defined\
    \ in an implementation as well as in a definition module. Abstract types can only\
    \ be defined on the global level and only in a definition module hiding the actual\
    \ implementation in the corresponding implementation module.\n\n```\nTypeDef =\
    \ AlgebraicTypeDef // see 5.1\n               RecordTypeDef // see 5.2\n     \
    \          SynonymTypeDef // see 5.3\n               AbstractTypeDef // see 5.4\n\
    ```\n\n# 5.1 Defining Algebraic Data Types\n\nWith an algebraic data type one\
    \ assigns a new constructor (a new type) to a newly introduced data structure.\
    \ The data structure consists of a new constant value (called the data constructor)\
    \ that can have zero or more arguments (of any type). Every data constructor must\
    \ unambiguously have been (pre) defined in an algebraic data type. Several data\
    \ constructors can be introduced in one algebraic data type which makes it possible\
    \ to define alternative data structures of the same algebraic data type. The data\
    \ constructors, just like functions, be be used in a curved way. Also type constructors\
    \ can be used in a curved way, although in the type world of course.\n\nPolymorphic\
    \ algebraic data types can be defined by adding (possibly existentially or universally\
    \ quantified, see below) type to the constructors on the left-hand side of the\
    \ algebraic data type. The arguments of the data constructor in a type definition\
    \ are instances of types (that are defined or are being defined).\n\nTypes can\
    \ be prefixed by uniqueness type attributes (see Chapter 9). The arguments of\
    \ a data constructor can optionally be annotated as being strict (see 5.1.5).\n\
    \n```\nAlgebraicTypeDef = :TypeLhs = ConstructorDef\n                    { ConstructorDef\
    \ } ;\nTypeLhs = [*TypeConstructor {TypeVariable]\nTypeConstructor = TypeName\n\
    ConstructorDef = [ExistentialQuantVariables]ConstructorName (BrackType)\n    \
    \             [ExistentialQuantVariables](ConstructorName)[Prec][BrackType]\n\
    Fix = infix\n     infix\n     infix\nPrec = Digit\n```\n\n```\nBrackTypeQuantVariables\
    \ = [UniversalQuantVariables][Strict][UnqTypeAttrib] SimpleType\nExistentialUniversalQuantVariables\
    \ = E.{TypeVariable}+\n```\n\nExample of an algebraic type definition and its\
    \ use.\n\n```\n::Day = Mon | Tue | Wed | Thu | Fri | Sat | Sun\n::Tree = NilTree\n\
    \  NodeTree (Tree a) (Tree a)\n```\n\n```\nMyTree:: (Tree Int) // constant function\
    \ yielding a Tree of Int\nMyTree = NodeTree 1 NilTree Nil NilTree\n```\n\nAn algebraic\
    \ type definition can be seen as the specification of a grammar in which is specified\
    \ what legal data objects are of that type. Notice that all CLEAN types (basic,\
    \ list, tuple, array, record, abstract types) can be regarded as special cases\
    \ of an algebraic type.\n\nConstructors with two arguments are defined as infix\
    \ constructor, in a similar way as other functions (with fixity, infixr or just\
    \ infix, default infixl and precedence (over 9, default)). If infix constructors\
    \ are surrounded by brackets they can also be used in prefix position (see 3.1\
    \ and 3.4). A pattern match can be written down in infix position as:\n\n- When\
    \ a constructor is used in infix position (in an expression or in a pattern) both\
    \ arguments must be present. Constructor operators can be used in a curved way,\
    \ but then they have to be used as ordinary prefix constructors (see 3.1 and 3.4).\n\
    \nAlgebraic type definition and constructor pattern in function definition.\n\n\
    ```\n::Tree2 a = (/) infix1 0 (Tree a) (Tree a)\n  | Value a\nMirror:: (Tree2\
    \ a) -> Tree2 a\nMirror (left\\right) = Mirror right\\Mirror left\nMirror leaf\
    \ = leaf\n```\n\nExample of an algebraic type defining an infix data constructor\
    \ and a function on this type; notice that one cannot use a '\\' because that\
    \ character is already reserved.\n\n```\n::List a = (<>) infixr 5 (List a)\n \
    \ | Nil\n```\n\n```\nHead:: (List a) -> a\nHead (x<:xs) = x\n```\n\n- All data\
    \ constructors defined in the scope must have different names, to make type inferencing\
    \ possible.\n\nScope of type definitions.\n\n```\nimplementation module XYZ\n\
    :: Type_constructor[type_vars = expression]\nother_definitions\n```\n\n## 5.1.1\
    \ Using Constructors in Patterns\n\nAn algebraic data type can be used in a pattern.\
    \ The pattern consists of the data constructor (see 3.2) with optional arguments\
    \ on which it contain sub-patterns. A constructor forces evaluation of the corresponding\
    \ actual argument to strict root normal form if the strategy has to determine\
    \ whether the actual argument is equal to the specified constructor.\n\n```\n\
    GraphPattern = Constructor // Zero arity Constructor\n                (Constructor\
    \ (Pattern)) // Constructor pattern\nGraphPattern ConstructorName = Infix Constructor\
    \ operator\n                GraphPattern\n```\n\nExample of an algebraic data\
    \ type definition and its use in a pattern in function definition.\n\n```\n::Tree\
    \ = Node (Tree a) (Tree a)\n      | Nil\nMirror:: (Tree a) -> Tree a\nMirror (left\\\
    right) = Mirror right\\Mirror left\nMirror leaf = leaf\n```\n\n- The constructor\
    \ forces evaluation of the corresponding actual argument to strict root normal\
    \ form if the strategy has to determine whether the actual argument is equal to\
    \ the specified constructor.\n\n## 5.1.2 Using Order Types\n\n## 5.1.3 Defining\
    \ Algebraic Data Types with Existentially Quantified Variables\n\n- The constructor\
    \ of Tree2 \n\n- Objects that have different types are considered of the same\
    \ type and can be part of the same list.\n\n```\n::List a = (<>) infixr 5 (List\
    \ a)\n  | Nil\n```\n\n```\nHead:: (List a) -> a\nHead (x<:xs) = x\n```\n\n## 5.1.4\
    \ Defining Algebraic Data Types with Universally Quantified Variables\n"
  mdcn: "\n\n# 定义新类型\n\n## 5.1 定义代数数据类型\n## 5.2 定义记录类型\n## 5.3 定义别名类型\n## 5.4 定义抽象数据类型\n\
    \nCLEAN 是一种强类型语言：CLEAN 中的每个对象（图）和函数（图重写）都有一个类型。CLEAN 的基础类型系统基于经典的多多态 Milner/Hindley/Mycroft\
    \ 类型系统（Milner 1978; Hindley 1969, Mycroft 1984）。该类型系统针对图重写系统进行了调整，并扩展了基础类型、（可能是存在或全称量化的）代数类型、记录类型、抽象类型和别名类型。\n\
    \n新类型可以在实现模块（implementation module）也可以在定义模块（definition module）中定义。抽象类型只能在全局范围内定义，且只能在定义模块中定义，以隐藏相应实现模块中的实际实现。\n\
    \n```\nTypeDef = AlgebraicTypeDef // 见 5.1\n               RecordTypeDef // 见\
    \ 5.2\n               SynonymTypeDef // 见 5.3\n               AbstractTypeDef\
    \ // 见 5.4\n```\n\n# 5.1 定义代数数据类型\n\n通过代数数据类型，可以为新引入的数据结构分配一个新的构造函数（一种新类型）。该数据结构由一个新常量值（称为数据构造函数）组成，它可以具有零或多个参数（任意类型）。每个数据构造函数必须在代数数据类型中被明确地（预）定义。一个代数数据类型可以引入多个构造函数，这使得定义相同代数数据类型的替代数据结构成为可能。数据构造函数和函数一样，可以使用曲线形式（curved\
    \ way）调用。此外，类型构造函数也可以使用曲线形式，尽管是在类型世界中。\n\n通过在代数数据类型的左侧为构造函数添加（可能是存在或或全称量化的，见下文）类型，可以定义多态代数数据类型。类型定义中数据构造函数的参数是类型的实例（已定义或正在定义的类型）。\n\
    \n类型可以由唯一性类型属性作为前缀（见第 9 章）。数据构造函数的参数可以可选地被标记为严格的（见 5.1.5）。\n\n```\nAlgebraicTypeDef\
    \ = :TypeLhs = ConstructorDef\n                    { ConstructorDef } ;\nTypeLhs\
    \ = [*TypeConstructor {TypeVariable]\nTypeConstructor = TypeName\nConstructorDef\
    \ = [ExistentialQuantVariables]ConstructorName (BrackType)\n                 [ExistentialQuantVariables](ConstructorName)[Prec][BrackType]\n\
    Fix = infix\n     infix\n     infix\nPrec = Digit\n```\n\n```\nBrackTypeQuantVariables\
    \ = [UniversalQuantVariables][Strict][UnqTypeAttrib] SimpleType\nExistentialUniversalQuantVariables\
    \ = E.{TypeVariable}+\n```\n\n代数类型定义及其使用的示例。\n\n```\n::Day = Mon | Tue | Wed |\
    \ Thu | Fri | Sat | Sun\n::Tree = NilTree\n  NodeTree (Tree a) (Tree a)\n```\n\
    \n```\nMyTree:: (Tree Int) // 返回 Int 类型 Tree 的常量函数\nMyTree = NodeTree 1 NilTree\
    \ Nil NilTree\n```\n\n代数类型定义可以被视为一种语法的规范，其中规定了该类型的合法数据对象。请注意，所有的 CLEAN 类型（基础、列表、元组、数组、记录、抽象类型）都可以被视为代数类型的特例。\n\
    \n具有两个参数的构造函数被定义为中置构造函数（infix constructor），类似于其他函数（带有结合性 fixity、infixr 或仅为 infix，默认为\
    \ infixl 以及优先级（在 9 以上，默认）。如果中置构造函数被括号括围，它们也可以在前缀位置使用（见 3.1 和 3.4）。模式匹配可以在中置位置写成如下：\n\
    \n- 当构造函数在中置位置（在表达式或模式中）使用时，两个参数都必须同时存在。构造函数操作符可以使用曲线形式，但到那时它们必须作为普通的前缀构造函数来使用（见\
    \ 3.1 和 3.4）。\n\n函数定义中的代数类型定义和构造函数模式。\n\n```\n::Tree2 a = (/) infix1 0 (Tree a)\
    \ (Tree a)\n  | Value a\nMirror:: (Tree2 a) -> Tree2 a\nMirror (left\\right) =\
    \ Mirror right\\Mirror left\nMirror leaf = leaf\n```\n\n定义中置数据构造函数以及在该类型上定义函数的示例；注意不能使用\
    \ '\\' 字符，因为该字符已被保留。\n\n```\n::List a = (<>) infixr 5 (List a)\n  | Nil\n```\n\
    \n```\nHead:: (List a) -> a\nHead (x<:xs) = x\n```\n\n- 作用域内定义的所有数据构造函数必须有不同的名称，以便进行类型推导。\n\
    \n类型定义的作用域。\n\n```\nimplementation module XYZ\n:: Type_constructor[type_vars =\
    \ expression]\nother_definitions\n```\n\n## 5.1.1 在模式中使用构造函数\n\n代数数据类型可以用于模式中。模式由数据构造函数（见\
    \ 3.2）以及可选的参数组成，参数包含子模式。当策略需要判断实际参数是否等于指定的构造函数时，构造函数会强制将相应的参数求值为严格根范式（strict root\
    \ normal form）。\n\n```\nGraphPattern = Constructor // 0 元构造函数\n              \
    \  (Constructor (Pattern)) // 构造函数模式\nGraphPattern ConstructorName = Infix Constructor\
    \ operator\n                GraphPattern\n```\n\n代数类型定义及其在函数定义中模式使用的示例。\n\n```\n\
    ::Tree = Node (Tree a) (Tree a)\n      | Nil\nMirror:: (Tree a) -> Tree a\nMirror\
    \ (left\\right) = Mirror right\\Mirror left\nMirror leaf = leaf\n```\n\n- 当策略需要判断实际参数是否等于指定的构造函数时，构造函数会强制将相应的参数求值为严格根范式。\n\
    \n## 5.1.2 使用顺序类型\n\n## 5.1.3 使用存在量化变量代数数据类型\n\n- Tree2 的构造函数\n\n- 不同类型的对象被视为相同的类型，并且位于同一个列表中。\n\
    \n```\n::List a = (<>) infixr 5 (List a)\n  | Nil\n```\n\n```\nHead:: (List a)\
    \ -> a\nHead (x<:xs) = x\n```\n\n## 5.1.4 使用全称量化变量代数数据类型\n\n"
