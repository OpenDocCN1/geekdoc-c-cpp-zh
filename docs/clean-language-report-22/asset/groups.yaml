    \ functions or complex data structures. Typically, predefined function and operators\
    \ for arithmetic and File I/O are implemented as system modules.\n\nSystem implementation\
    \ modules may use machine code, C-code, abstract machine code (PABC-code) or\n"
  mdcn: "\n为了向外部世界隐藏实际实现。这样做的好处是出于软件工程考虑，另一个优势是实现模块可以单独编译，而无需重新编译其他模块。只有当定义模块发生变化时，才需要重新编译其他模块。所有依赖于更改模块的模块也将重新编译。因此，函数、图和类实例的实现只允许在实现模块中。它们通过在定义模块中指定其类型来导出。任何类型定义的右侧都可以保持隐藏。在此创建了抽象数据类型（见\
    \ 5.4 节）。\n\n在定义模块中，按任意顺序给出以下全局定义：\n\n| DefDefinition | ImportDef // 见 2.5 |\n\
    | | FunctionTypeDef // 见 3.7 |\n| | MacroDef // 见 10.3 |\n| TypeDef // 见第 5 章\
