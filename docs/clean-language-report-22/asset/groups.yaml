    \ string\n  | string ! last '' = string\n  | otherwise = string%(0,last-1)\nwhere\n\
    \  last = maxindex string\n```\n\nWhen a graph is actually a name is given to\
    \ (part of) expression. The definition of a graph can be compared with a definition\
    \ of a constant (data) or a constant (projection) function. However, notice that\
    \ graphs are constructed using the basic semantics of CLEAN [see Chapter 1] that\
    \ means multiple references to the same graph will result in sharing of graph.\
