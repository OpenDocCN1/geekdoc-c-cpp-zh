    3.7 Typing Functions


    3.4 Expressions


    In this chapter we explain how functions (actually: graph rewrite rules) and constants
    (actually: graph expressions) are defined in CLEAN. A definition of a function
    consists of an (root) expression (see 3.4) with help of patterns (see 3.2) and
    guards (see 3.3) a distinction can be made between several alternative definitions
    for functions. constants can be defined locally in a function. For programming
    convenience (evaluation, observation of unique objects and threading operations)
    a special let is introduced (see 3.5.1). The typing of functions is discussed
    in Section 3.7. For overloaded functions see Chapter 6. For functions working
    on unique datatypes see Chapter 9.


    # 3.1 Functions


    ```

    FunctionDef = // see Chapter 4 for typing functions

    DefOfFunction = [FunctionDef]

    FunctionAltDef = [FunctionAltDef]; +

    Function (Pattern) // see 3.2 for patterns

    (LetBeforeExpression) // see 3.5.4

    {[ Guard =]FunctionBody)+\ // see 3.3 for guards

    [LocalFunctionAltDefs] // see 3.5

    Function = // ordinary function

