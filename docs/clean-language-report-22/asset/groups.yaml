    # Current State of the Clean System


    Release 2.1 (November 2002).


    Compared with the previous version the following changes have been made.

    Experimental features of the previous version, such as dynamics (see Chapter 8),
    generics (see Chapter 7) and strict-lists (see 4.2) have been improved and further
    incorporated in the language.

    Many bugs, most of which were appeared in the new features, have been removed.

    The quality of the code generation has been improved.


    Release 2.0 (November 2001).


    +   - There are many changes changed to the previous release (CLEAN 1.3.x). We
    have added many new features in CLEAN 2.0 you will like.

    - CLEAN 2.0 has multi-parameter type constructor classes. See Section 6.4.

    - CLEAN 2.0 has universally quantified data types and functions (rank 2). Section
    3.7.4 and 5.1.4.

    - The explicit import mechanism has been refined. Now can more precisely as to
    import and not what. See 2.5.1.

    - Cyclic dependencies between definition modules are allowed. This makes it easier
    to define implementations that share definitions. See 2.5.1.

    - Definitions in a definition module need not to be repeated in the corresponding
    implementation module. See 2.4.

    - Due to multi-parameter type constructor classes a better incorporation of the
    type Array could be. See 4.4.


    CLEAN 2.0 offers an hybrid type system: one can have statically and dynamically
    typed objects (Dynamics). A statically typed expression can be changed into a
    dynamically typed one and backyards. The type of a Dynamic can be inspected together
    using run-time unification, one can store a Dynamic into a file with one function
    or read a Dynamic stored by another CLEAN application. Dynamics can be used to
    store and retrieve information without needing to write parsers, as one can exchange
    data and copy (!) applications in a safe manner. Dynamics makes it easy to create
    mobile code, create plug-ins or create a persistent store. The CLEAN run-time
    system has been extended to support dynamic type checking, run-time unification,
    lazy dynamic linking and just-in-time code generation See Chapter 8.


    There is special syntax for strict and unbound lists. One can easily change from
    lazy to strict and backwards. Overloaded functions can be defined for any list
    (lazy, strict or unbound). See 4.2.One can write functions with map, fold in generic.
    The generic functions can one define work with other kinds. Kind induced functions
    can be indicated which is actually meant (see Chapter 7). A generic definition
    can be specified for a special type. The CLEAN system has been extended: a new
    version of the CLEAN IDE, a new version of the run-time-system, and a dynamic
    linker is included. See 8.3. CLEAN 2.0 comes with an integrated proof system (Sparkle),
    all written in CLEAN of course. CLEAN 2.0 is open source. All source code will
    be made available on the net.


    We have removed things:


    +   - We do not longer support annotations for concurrent evaluations ({P} and
    (l) annotations. However, we are working on a library that will support evaluation
    of CLEAN expressions with Dynamics (see Van Weelden Plasmmejer, 2002).

    - There is no strict-let expression (let!) anywhere in CLEAN 2.x. You can enforce
    strict evaluation using the strict hash (#).

    - One cannot default instances that could be used to disambiguate ambiguous'
  - '[PAGE 11]


    internal overloading. Disambiguating can be done by explicitly specifying the
    required type.


    There is some bad news:


    +   - Due to all these changes CLEAN 2.0 is not upwards compatible with CLEAN
    1.3.x. Many things are the same but there are small differences as well. So, one
    has to put some effort in porting a CLEAN 2.0. The most important syntactical
    differences are described below. Note that we no longer support J

    - The CLEAN 1.3 compiler is written in C. The CLEAN 2.0 compiler has been rewritten
    from scratch in CLEAN. The internal structure of the new compiler is better than
    the old one, but the new compiler has become a bit slower than the previous C
    as well. Large programs will take about 1.7 times as much time to compile (which
    is still pretty impressive for a lazy functional language).


    # Syntactic differences between Clean 1.3 and Clean 2.0


    CLEAN 2.x is not downward compatible with CLEAN 1.3.x. Probably you have to change
    your 1.3.x sources to get them through the CLEAN 2.x compiler.


    # Differences in Expression Syntax


    There is no strict-level expression (let!) anymore in CLEAN 2.x. You can still
    enforce strict evaluation using the strict hash list (#).


    # Differences in the Type System


    +   - For multiparameter type classes a small change in the syntax for instance
    definitions was necessary. In CLEAN 1.3.x it was assumed that every instance definition
    has only one type argument. So in the following 1.3.x instance definition


    ```

    instance c T1 T2

    ```


    the type (T1 T2) was meant (the type T1 with the argument T2). This should be
    written in CLEAN 2.x as


    ```

    instance c (T1 T2)

    ```


    otherwise T1 and T2 will be interpreted as two types.


    The type Array has changed. In CLEAN 2.x the Array class has become a multiparameter
    class, whose first argument type is the array and second argument type is the
    array element (??). There a 1.3 definition


    ```

    MkArray :: !Int (Int -> e) ->.(a e) | Array a &ArrayElem e

    MkArray i = {f \ j <- [0..i-1]}

    ```


    becomes in CLEAN 2.x:


    ```

    MkArray :: !Int (Int -> e) ->.(a e) | Array a e

    MkArray i = {f \ j <- [0..i-1]}

    ```


    There is a difference in resolving overloading. Consider the following code:


    ```

    class c a :: a ->

    ```'
