    \ in CLEAN) is started with it as well (if it is not already running). The Dynamic\
    \ Linker is a server application on the computer. It will serve CLEAN programs\
    \ that read or write Dynamics. The Dynamic Linker will construct the application\
    \ or plug-in at run-time in the same way as the Static linker will compile to\
    \ a conventional CLEAN program. There is no penalty unless the Code is linked\
    \ to.\n\nWhen a Dynamic is written to using the function writeDynamic, two files\
