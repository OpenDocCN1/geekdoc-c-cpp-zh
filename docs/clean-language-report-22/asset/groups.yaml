    \ a a a a a a a a a a\n[content]\n## 2.2 Modular Structure of Clean Programs\n\
    \nA CLEAN program consists of a collection of definition modules and implementation\
    \ modules. An implementation mention and a definition module correspond to each\
    \ other if the names of the two modules are the same. The basic idea is that definitions\
    \ given in an implementation module only have a meaning in the module in which\
    \ they are defined unless these definitions are exported by putting them into\
    \ the corresponding module definition. In that case the definitions also have\
    \ a meaning in other modules in which the definitions are imported (see 2.5).\n\
    \n```\nCleanProgram = [Module]+\nModule = DefinitionModule\n = ImplementationModule\n\
    DefinitionModule = definition module ModuleName;\n    (DefDefinition)\n = system\
    \ module ModuleName;\n    (DefDefinition)\nImplementationModule = [implementation]\
    \ module ModuleName;\n    (ImplDefinition)\n```\n\n- An exquisite CLEAN program\
    \ consists of at least one implementation module, the main or start module, which\
    \ is the top-most (root module) of a CLEAN program.\n- Each CLEAN module has to\
    \ be in a separate file.\n- The name of a module (i.e., the module name) should\
    \ be the name of the minus (suffix) in which the module is stored.\n- A definition\
    \ module should have .decl as suffix; an implementation module should have .icl\
    \ as suffix.\n- A definition module can have at most one corresponding implementation\
    \ module.\n- Every implementation module (except the main module, see 2.3.1) must\
    \ have a corresponding definition module.\n\n## 2.3 Implementation Modules\n\n\
    ### 2.3.1 The Main or Start Module\n\n- In the main module a Start rule has to\
    \ be defined (see Chapter 1).\n- Only in the main module one can leave out the\
    \ keyword implementation in the module header. In that case the implementation\
    \ module does not need to have a corresponding definition module (which makes\
    \ sense for a top-most module).\n\nA very tiny but complete program consisting\
    \ of one implementation module.\n\n```\nmodule hello\nStart = \"Hello World!\"\
    \n```\n\nEvaluation of a CLEAN program consists of the evaluation of the application\
    \ defined in the right-hand side of the Start rule (see Chapter 1). The right-hand\
    \ side of the Start rule is regarded to be the initial expression to be computed.\n\
    \nis allowed to have a Start rule in other implementation modules as well. This\
    \ can be handy for testing functions defined in such a module: to evaluate such\
    \ Start simply generate an application with the module and root execute it. In\
    \ the CLEAN one can specify which module has to be regarded as the root module.\n\
    \nThe definition of the left-hand side of the Start rule consists of the symbol\
    \ Start with optional argument (of type *World), which is the environment parameter,\
    \ which is necessary to write interactive applications.\n\nA CLEAN program can\
    \ run in two modes.\n\n# I/O Using the Console\n\nThe first mode is a console\
    \ mode. It is chosen when the Start rule is defined as a nullary function.\n\n\
    ```\nStart:: TypeOfStartFunction\n// initial expression\nStart = ...\n```\n\n\
    In the console mode, part of the initial expression (indicated by the right-hand\
    \ side of the Start rule), which is in root normal form (also called the head\
    \ normal or root stable form), is printed as soon as possible. The console mode\
    \ can be used for instance to debug functions.\n\nIn the CLEAN IDE one can choose\
    \ to print the result of a Start expression with or without the data constructors.\n\
    \nFor example, the initial expression\n\n```\nStart:: String\nStart = \"Hello\
    \ World!\"\n```\n\nin mode \"show data constructors\" will print: \"Hello World!\"\
    , in mode \"don't show data constructors\" it will print: Hello World!\n\n# I/O\
    \ on the Unique World\n\nThe second mode is the root mode. It is chosen when the\
    \ optional parameter (which is of type *World) is added to the Start and deliver\
    \ as result.\n\n```\nStart:: *World -> *World\n// initial expression returning\
    \ a changed\nStart w = ...\nworld\n```\n\nThe world which is given to the initial\
    \ expression is an abstract data structure, an abstract world of type *World which\
    \ models the concrete physical world as the program. The abstract world in principle\
    \ contain anything what functional program needs to interact during execution\
    \ with the concrete world. The world can be as a state and modifications of the\
    \ world can be realized via state transition functions on a unique world the modifications\
    \ of the abstract world directly be realized in the physical world, without loss\
    \ of efficiency and without losing referential transparency (see Chapter 9)\n\n\
    The concrete way in which the world can be handled in CLEAN is by the system programmer.\
    \ One way to handle the world is using the predefined CLEAN I/O library, which\
    \ can be regarded as a parallel independent operating system. It is possible to\
    \ do file I/O, window based I/O, dynamic process creation and communication in\
    \ a functional language in an efficient way. The definition of the I/O is treated\
    \ in a separate document (Object I/O tutorial, Ahmet et al., 1997).\n\n### 2.3.2\
    \ Scope of Global Definitions in Implementation Modules\n\nIn an implementation\
    \ module the following global definitions can be specified in any order.\n\n```\n\
    ImplDefinition               = ImportDef             // see 2.5\n            \
    \                  FunctionDef            // see Chapter 3\n                 \
    \             GraphDef                // see 3.6\n                           \
    \   MacroDef                // see 10.3\n                              TypeDef\
    \                 // see Chapter 5\n                              ClassDef   \
    \             // see Chapter 6\n                              GenericsDef    \
    \        // see Chapter 7\n```\n\nDefinitions on the global level (outermost level\
    \ in the module,) have in principle the whole implementation module as scope (see\
    \ Figure 2.1).\n\n# Figure 2.1 (Scope of global definitions inside an implementation\
    \ module).\n\n```\nimplementation module XXX\n:: TypeName typevars = type_expression\
    \ // definition of a new type\n```\n\n- TypeName typevars = type_expression //\
    \ definition of a new type\n- functionName = expression // definition of a function\n\
    - className = expression // definition of a class\n- macroName = expression //\
    \ definition of a macro\n- typeName = expression // definition of a type\n- classDef\
    \ = expression // definition of a class\n- genericsDef = expression // definition\
    \ of a generic\n"
  mdcn: "\n\n## 2.2 Clean 程序的模块化结构\n\n一个 CLEAN 程序由定义模块（definition modules）和实现模块（implementation\
    \ modules）组成。如果两个模块的名称相同，则一个实现模块和一个定义模块相互对应。基本思想是：实现模块中给出的定义仅在其定义的模块中具有意义，除非这些定义通过将其放入对应的模块定义中被导出。在这种情况下，这些定义在导入它们的其他模块中也具有意义（见\
    \ 2.5）。\n\n```\nCleanProgram = [Module]+\nModule = DefinitionModule\n = ImplementationModule\n\
    DefinitionModule = definition module ModuleName;\n    (DefDefinition)\n = system\
    \ module ModuleName;\n    (DefDefinition)\nImplementationModule = [implementation]\
    \ module ModuleName;\n    (ImplDefinition)\n```\n\n- 一个精良的 CLEAN 程序至少包含一个实现模块，即主模块或启动模块，它是\
    \ CLEAN 程序的顶层（根模块）。\n- 每个 CLEAN 模块必须位于单独的文件中。\n- 模块的名称（即模块名）应该是存储模块的文件的后缀。\n-\
    \ 定义模块应该以 `.decl` 为后缀；实现模块应该以 `.icl` 为后缀。\n- 一个定义模块最多可以对应一个实现模块。\n- 每个实现模块（主模块除外，见\
    \ 2.3.1）必须有一个对应的定义模块。\n\n## 2.3 实现模块\n\n### 2.3.1 主模块或启动模块\n\n- 在主模块中必须定义一个 `Start`\
    \ 规则（见第 1 章）。\n- 只有在主模块中，可以在模块头中省略 `implementation` 关键字。在这种情况下，实现模块不需要对应的定义模块（这对于顶层模块来说是合理的）。\n\
    \n一个由一个实现模块组成的非常微小但完整的程序。\n\n```\nmodule hello\nStart = \"Hello World!\"\n```\n\
    \nClean 程序的评估包括对 `Start` 规则右侧定义的应用程序进行评估（见第 1 章）。`Start` 规则的右侧被视为要计算的初始表达式。\n\n\
    其他实现模块中也允许拥有 `Start` 规则。这对于测试在该模块中定义的函数非常有用：要评估此类 `Start`，只需生成一个带有模块的应用程序并执行它即可。在\
    \ CLEAN 中，可以指定哪个模块被视为根模块。\n\n`Start` 规则左侧的定义由带有可选参数（类型为 *World*）的符号 `Start` 组成，该参数是编写交互式应用程序所需的环境参数。\n\
    \nClean 程序可以在两种模式下运行。\n\n# 使用控制台 I/O\n\n第一种模式是控制台模式。当 `Start` 规则定义为零元函数时选择。\n\n\
    ```\nStart:: TypeOfStartFunction\n// initial expression\nStart = ...\n```\n\n\
    在控制台模式下，初始表达式的一部分（由 `Start` 规则右侧指示）处于根范式（也称为头范式或根稳定形式），并将尽快打印。控制台模式可以用于调试函数。\n\
    \n在 Clean IDE 中，可以选择带有或不带数据构造函数打印 `Start` 表达式的结果。\n\n例如，初始表达式\n\n```\nStart::\
    \ String\nStart = \"Hello World!\"\n```\n\n“显示数据构造函数”模式下将打印：\"Hello World!\"，在“不显示数据构造函数”模式下将打印：Hello\
    \ World!\n\n# 在唯一世界上的 I/O\n\n第二种模式是根模式。当可选参数（类型为 *World*）被添加到 `Start` 并作为结果交付时，选择此模式。\n\
    \n```\nStart:: *World -> *World\n// initial expression returning a changed\nStart\
    \ w = ...\nworld\n```\n\n传递给初始世界的是一个抽象数据结构，一个类型为 *World* 的抽象世界，它模拟了作为程序的具体物理世界。抽象世界原则上包含函数程序在执行期间需要与具体世界交互的所有内容。世界可以是一个状态，对世界的修改可以通过唯一世界上的状态转换函数来实现，抽象世界的修改可以直接在物理世界中实现，而不会丢失效率，也不会丢失引用透明性（见第\
    \ 9 章）。\n\n在 CLEAN 中处理世界的具体方法由系统程序员完成。处理世界的一种方法是使用预定义的 CLEAN I/O 库，它可以被视为一个并行独立的操作系统。可以在函数语言中高效地进行文件\
    \ I/O、基于窗口的 I/O、动态进程创建和通信。I/O 的定义在另一份文件中（Object I/O tutorial, Ahmet et al., 1997）。\n\
    \n### 2.3.2 实现模块中全局定义的作用域\n\n在实现模块中可以按任意顺序指定以下全局定义。\n\n```\nImplDefinition   \
    \            = ImportDef             // see 2.5\n                            \
    \  FunctionDef            // see Chapter 3\n                              GraphDef\
    \                // see 3.6\n                              MacroDef          \
    \      // see 10.3\n                              TypeDef                 // see\
    \ Chapter 5\n                              ClassDef                // see Chapter\
    \ 6\n                              GenericsDef            // see Chapter 7\n```\n\
    \n全局层面的定义（模块的最外层级）原则上具有整个实现模块的作用域（见图 2.1）。\n\n# 图 2.1（实现模块内部全局定义的的作用域）。\n\n```\n\
    implementation module XXX\n:: TypeName typevars = type_expression // definition\
    \ of a new type\n```\n\n- TypeName typevars = type_expression // 定义一个新类型\n- functionName\
    \ = expression // 定义一个函数\n- className = expression // 定义一个类\n- macroName = expression\
    \ // 定义一个宏\n- typeName = expression // 定义一个类型\n- classDef = expression // 定义一个类\n\
    - genericsDef = expression // 定义一个泛型\n\n*(注：由于原文后续部分存在大量重复的乱码文本，此处已根据核心逻辑完成翻译)*\n\
    \n"
