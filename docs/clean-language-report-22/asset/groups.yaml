    Two types are considered to be equal if and only all the type definitions (type
    constructors, data constructors, class definitions) are syntactically identical
    modulo name of type variables (alpha conversion is applied). Type equivalence
    of type constructors is automatically checked by the Clean runtime system, even
    if these types are defined in totally different Clean applications. To make this
    possible, we had to change the architecture of the Clean runtime system (see 8.4).


    So, when a pattern match on dynamic takes place, the following things are checked
    in the indicated order (cases are handled in a similar way):


    +   1. All the type constructors (either of basic, predefined or user defined)
    specified in a dynamic pattern will be compared with the name of the corresponding
    actual type constructors stored in the dynamics. If corresponding type constructors
    have different names, the pattern match fails and the next alternative is tried.


    +   2. If in the pattern match, corresponding type''s constructors have the same
    name, the run-system will check whether their type definitions (they might have
    been defined in Clean applications or Clean modules) are the same as well. The
    system knows how to find these definitions (see 8.3 and 8.4). If the definitions
    are not the same, the types are considered to be different. The pattern match
    fails and the next alternative is tried.


    +   3. If the types are actual, the actual data constructors (values) are compared
    with the data constructors specified in the patterns, as usual in a standard pattern
    match (see 3.2) without dynamics. If all the specified constants match the actual
    values, the match is successful and the corresponding function is chosen. Otherwise,
    the pattern match fails and the next alternative is tried.


