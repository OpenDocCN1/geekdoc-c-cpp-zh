    \ different names within the same scope (see 2.1). This problem can be solved\
    \ by renaming the internally defined identifiers or by renaming the imported identifiers\
    \ (eg by adding an additional module layer just to rename).\n\n## 2.6 System Definition\
    \ and Implementation Modules\n\nSystem modules are special modules. A system definition\
    \ module indicates that the implementation module is a system implementation module\
