- md: "\n## SpineStrict\n\nClean any data structure can be made (partially) strict\
    \ or unboxed (see 10.1). This has consequences for the time and space behavior\
    \ of the data structure.\n\nFor instance, lazy lists are very convenient (evaluated\
    \ unless it is really needed for the computation, but they can be inefficient\
    \ if almost always all elements are evaluated sooner or later). Strict lists are\
    \ often more efficient, but one has to be careful not to trigger a near infinite\
    \ computation. Spine lists are more efficient as, but one cannot handle infinite\
    \ lists within that. Unboxed lists are more compact: instead of a pointer to the\
    \ elements list, the element itself is stored in an unboxed list. However, unboxed\
    \ lists have also a disadvantage that they can only be used in certain cases:\
    \ they can only contain elements of basic type, records and tuples. It does not\
    \ make sense to offer unboxing for arbitrary types: boxing saves space, but if\
    \ not Cons nodes are copied lists: the elements are copied as well otherwise the\
    \ contents could remain shared using the element pointer index.\n\nIn terms of\
    \ efficiency it can make quite a difference (e.g strict lists can sometimes be\
    \ 6 times faster) what kind of list is actually used. But it is in general decide\
    \ which kind of list is best to use. This depends on how a list is used in a program.\
    \ A wrong choice might turn a program from useless (to inefficient), from terminating\
    \ to non-terminating.\n\nBecause lists are frequently used, special syntax is\
    \ provided to make it easier for a programmer to change from one list to another,\
    \ just changing the kind of brackets. One can define a list of which the head\
    \ element is strict or the spine is (indicated by !), a list of the spine is strict\
    \ the head element is lazy (indicated by !) and a completely evaluated list (indicated\
    \ by !!). One can have an unboxed list with a strict head element (indicated by\
    \ !) and a completely unboxed list of which addition in the spine is strict as\
    \ well (indicated by #!).\n\nVarious types of list.\n\n```\nfac 10 : expression\
    \ ] // lazy list\n! fac 10 : expression ] // head strict list\n! fac 10 : expression\
    \ ! // head strict and tail strict list\n# fac 10 : expression ] // head strict\
    \ list, unboxed.\n! fac 10 : expression ! // head strict and tail strict list,\
    \ unboxed\n```\n\n- Unboxed data structures can only contain elements of basic\
    \ type, records and arrays.\n\nExample of an overloaded list.\n\n```\nfac 10 :\
    \ expression ] // overloaded list\n```\n\nOther ways to create lists are via dot-dot\
    \ expressions and list comprehensions.\n\n## DotDot Expressions\n\nDotDotexpression\
    \ = [[ListKind] GraphExpr [, GraphExpr] . [GraphExpr] [SpineStrictness]]\n\nWith\
    \ a dot-expression the list elements are enumerated by giving the first element\
    \ (n1), an optional second element (n2) and an optional list (e).\n\nAlternative\
    \ ways to define a list dot expression.\n\n```\n[1,3..9]             // [1,3,5,7,9]\n\
    [1..9]               // [1,2,3,4,5,6,7,8,9]\n[..]                // [1,2,3,4,5\
    \ and so on...]\n['a..'c']             // ['abc']\n```\n\nThe generated list is\
    \ in general calculated as:\n\n```\nfrom_then_to: ! !a la -> [a] | Enum a\nfrom_then_to\
    \ n1 e2\n| n1 < n2 = _from_by_to n1 (n2-n1) e\n  = _from_by_to n1 (n2-n1)\nwhere\n\
    \  from_by_to n s e\n  | n<=e = [n : _from_by_to (n+s) s e]\n  = []\n\nfrom_by_down\
    \ n s e\n  | n>=e = [n : _from_by_down (n+s) s e]\n  = []\n```\n\nThe step size\
    \ is one by default. If no limit specified an infinite list is generated.\n\n\
    With a dot-expression one can also define a lazy list, a strict list, an unboxed\
    \ or an overloaded list.\n\n```\n[ 1,3..9 ]           // a lazy list\n[! 1,3..9\
    \ ]          // a strict list\n[! 1,3..9 !]         // a strict list (head and\
    \ spine)\n[ 1,3..9 ]           // a strict list, unboxed\n[ 1,3..9 !]        \
    \ // a strict list (head and spine), unboxed\n[ 1,3..9 ]           // an overloaded\
    \ list\n```\n\nDifferent types of lists (lazy, strict, unboxed and overloaded)\
    \ can be defined with dot expression. Dot-expression can only be used if one imports\
    \ from the standard library. Dot-expressions are predefined on types of Int, Real\
    \ and Char, also can be applied to any user defined structure for which enumeration\
    \ has been instantiated.\n\n## List Comprehensions\n\n```\nZF-expression     \
    \ = [ListKind] GraphExpr \\ (Qualifier)-[SpineStrictness]\nQualifier         =\
    \ Generators { let {LocalDef} } {Guard}\nGenerators        = (Generator)-list\n\
    Generator         = Selector // select from lazy list\n                   = Selector-\
    \ ListExpr // select from overloaded list\n                   = Selector- ArrayExpr\
    \ // select from array\nSelector         = BackPattern\n```\n\nGraphExpr = GraphExpr\n\
    ArrayExpr = GraphExpr\nGuard = BooleanExpr\nListKind = ! // head strict list //\
    \ unboxed list // overloaded list // spine list\n\n## SpineStrict\n\nWith a list\
    \ generator used to ZF-expression one can construct a list of elements from other\
    \ lists or arrays. With a list generator (use symbol ':') one can draw elements\
    \ from any (lazy, strict, unboxed) list. One can define several generators in\
    \ a row separated by '.'. All generators in such a sequence will vary. The drawing\
    \ of elements will stop if one of the generators is exhausted. Selectors are used\
    \ as patterns to identify parts of graph expression. They are explained in Section\
    \ 3.6. Only lists that match the selector are taken into account. Guards can be\
    \ used as filter the list by generator that matches selector are taken into account.\
    \ The scope of selector variables introduced on the left side of generator is\
    \ such that variables can be used in guards and All variables introduced this\
    \ way can be used in the expression before the \\ (see the picture).\n\n```\n\
    expression \\ selector <- expression\nguard <- selector\n```\n\nZF-expression:\n\
    expr1 yields [(0,0),(0,1),(0,2),(1,0),(1,1),(1,2),(2,0),(2,1),(2,2),(3,0),(3,1),(3,2)]\n\
    expr2 yields [(0,0),(0,1),(2,2)]\nexpr3 yields [(0,0),(0,1),(1,0),(2,1),(2,2),(3,0),(3,1),(3,3)]\n\
    \n```\nexpr1 = [x,y] x <- [0..3], y <- [0..2]\nexpr2 = [x,y] x <- [0..3] & y <-\
    \ [0..2]\nexpr3 = [x,y] x <- [0..3], y <- [0..3]\n```\n\nZF-expression: a well-known\
    \ sort.\n\n```\nsort:: [a] -> [a] | Ord a\nsort [] = []\nsort [p:ps] = sort [x..ps\
    \ | x<=|p] ++ [p] ++ sort [x..ps | x>|p]\n```\n\nOverloaded ZF-expression sorting\
    \ any list (lazy, strict or unboxed).\n\n```\nsort:: (l a) -> (l a) | Ord a &\
    \ List 1 a\nsort [] = []\nsort [p:ps] = sort [x..ps | x<=|p] ++ [p] ++ sort [x\
    \ <--ps |]\n```\n\nZF-expression: converting an array into a list.\n\n```\nArrayA\
    \ = {1,2,3,4,5}\n```\n\n```\nListA: [a]\nListA = [a \\ a <- ArrayA]\n```\n\nLocal\
    \ definitions can be introduced in a ZF expression after generator(s) using let:\n\
    \n```\nQualifier = Generators { let {LocalDef} } {|Guard}\n```\n\nThe variables\
    \ introduced in this way can be used in the guard and local definitions, other\
    \ qualifiers that follow, and the expression before the \\.\n\n## 4.2.1 Patterns\n\
    \nAn object of the predefined alphabetic type list can be specified as pattern\
    \ in function, case expression or list generator.\n\n```\nListPattern = [[ListKind]{[GraphPattern}-list\
    \ [: GraphPattern]] [SpineStrictness]\nGraphPattern = GraphPattern\nListKind =\
    \ CharsDenotation // head strict list\nSpineStrictness = ! // unboxed head strict\
    \ list // overloaded list // spine strict list\n```\n\nNotice that only list patterns\
    \ can be specified (one cannot use a dot-expression or list comprehension to define\
    \ a list pattern).\n\nUse of list patterns, use of guards, of variables to identify\
    \ patterns and sub-patterns; merge merges two (sorted) lazy lists into one (sorted)\
    \ list.\n\n```\nmerge :: [Int] [Int] -> [Int]\nmerge f = f\nmerge s = s\nmerge\
    \ f:(x:xs) s:(y:ys) = [x:merge xs s]\nx < y = [x:merge xs ys]\nown = [y:merge\
    \ f ys]\n```\n\nmerge_u merges two (sorted) head lists into one unboxed (sorted)\
    \ list.\n\n```\nmerge_u :: [#Int] [#Int] -> [#Int]\nmerge_u f = f\nmerge_u s =\
    \ s\nmerge_u f:(x:xs) s:(y:ys) = [#x:merge_u xs s]\nx < y = [#x:merge_u xs ys]\n\
    un = [#y:merge_u f ys]\n```\n\nmerge_l merges two (sorted) lists into one (sorted)\
    \ list. Any list (lazy, strict or unboxed) can be merged, but both lists have\
    \ to be the same length (both, head strict, tail strict or unboxed)\n\n```\nmerge_l\
    \ :: (l a) (l a) -> (l a) | List 1 a\nmerge_l f [] = f\nmerge_l [] s = s\n```\n"
  mdcn: "\n\n## SpineStrict 骨部严格性\n\n任何数据结构都可以被（部分）变为严格的（strict）或非箱的（unboxed，见10.1）。这将对数据结构的时间空间产生影响。\n\
    \n例如，惰性列表（lazy lists）非常方便（除非计算真的需要，否则不会求值，但如果几乎所有元素迟早会被求值，它们的效率可能会低下）。严格列表（Strict\
    \ lists）通常更高效，但必须小心不要触发近乎无限的计算。骨部列表（Spine lists）效率更高，但无法在其中处理无限列表。非箱列表（Unboxed\
    \ lists）更紧凑：它不是指向元素列表的指针，而是将元素本身存储在非箱列表中。然而，非箱列表也有一个缺点，即只能在某些情况下使用：它们只能包含基本类型、记录（records）和元组（tuples）。为任意类型提供非箱是没有意义的：箱（boxing）可以节省空间，但如果不箱\
    \ Cons 节点将复制列表：元素也会被复制，否则内容可以通过元素指针索引保持共享。\n\n在效率方面，实际使用哪种列表可能会产生相当差异（例如，严格列表有时会快\
    \ 6 倍）。但通常需要决定使用哪种列表是最好的。这取决于列表在程序中如何使用。错误的选择可能会让程序从无用变为低效，从能终止变为不终止。\n\n由于列表被频繁使用，提供了特殊的语法来让程序员更容易从一种列表切换到另一种，只需更改括号类型。可以定义一种头部元素是的或骨部严格的（用\
    \ `!` 表示）列表，一种骨部严格而头部元素是惰性的列表（用 `!` 表示），以及一个完全求值的列表（用 `!!` 表示）。可以拥有一个具有严格头部元素的非箱列表（用\
    \ `!` 表示），以及一个骨部同样严格的完全非箱列表（用 `#!` 表示）。\n\n各种类型的列表。\n\n```\nfac 10 : expression\
    \ ] // 惰性列表\n! fac 10 : expression ] // 头部严格列表\n! fac 10 : expression ! // 头部和尾部严格列表\n\
    # fac 10 : expression ] // 头部严格列表，非箱\n! fac 10 : expression ! // 头部和尾部严格列表，非箱\n\
    ```\n\n- 非箱数据结构只能包含基本类型、记录和数组。\n\n重载列表示例。\n\n```\nfac 10 : expression ] // 重载列表\n\
    ```\n\n创建列表的其他方法是通过点点表达式（dot-dot expressions）和列表推导式（list comprehensions）。\n\n\
    ## 点点表达式\n\nDotDotexpression = [[ListKind] GraphExpr [, GraphExpr] . [GraphExpr]\
    \ [SpineStrictness]]\n\n通过点表达式，通过给出第一个元素 (n1)、一个可选的第二个元素 (n2) 和一个可选的列表 (e) 来枚举列表元素。\n\
    \n定义列表点表达式的替代方法。\n\n```\n[1,3..9]             // [1,3,5,7,9]\n[1..9]         \
    \      // [1,2,3,4,5,6,7,8,9]\n[..]                // [1,2,3,4,5 等以此类推...]\n['a..'c']\
    \             // ['abc']\n```\n\n生成的列表通常计算为：\n\n```\nfrom_then_to: ! !a la ->\
    \ [a] | Enum a\nfrom_then_to n1 e2\n| n1 < n2 = _from_by_to n1 (n2-n1) e\n  =\
    \ _from_by_to n1 (n2-n1)\nwhere\n  from_by_to n s e\n  | n<=e = [n : _from_by_to\
    \ (n+s) s e]\n  = []\n\nfrom_by_down n s e\n  | n>=e = [n : _from_by_down (n+s)\
    \ s e]\n  = []\n```\n\n步长默认为一。如果未指定限制，则生成一个无限列表。\n\n通过点表达式，还可以定义惰性列表、严格列表、非箱列表或重载列表。\n\
    \n```\n[ 1,3..9 ]           // 惰性列表\n[! 1,3..9 ]          // 严格列表\n[! 1,3..9 !]\
    \         // 严格列表（头部和骨部）\n[ 1,3..9 ]           // 严格列表，非箱\n[ 1,3..9 !]       \
    \  // 严格列表（头部和骨部），非箱\n[ 1,3..9 ]           // 重载列表\n```\n\n不同类型的列表（惰性、严格、非箱和重载）可以用点表达式定义。点表达式只有在从标准库导入时才能使用。点表达式预定义在\
    \ Int、Real 和 Char 类型上，也可以应用于任何已实例化枚举（enumeration）的用户定义结构。\n\n## 列表推导式\n\n```\n\
    ZF-expression      = [ListKind] GraphExpr \\ (Qualifier)-[SpineStrictness]\nQualifier\
    \         = Generators { let {LocalDef} } {Guard}\nGenerators        = (Generator)-list\n\
    Generator         = Selector // 从惰性列表中选择\n                   = Selector- ListExpr\
    \ // 从重载列表中选择\n                   = Selector- ArrayExpr // 从数组中选择\nSelector  \
    \       = BackPattern\n```\n\nGraphExpr = GraphExpr\nArrayExpr = GraphExpr\nGuard\
    \ = BooleanExpr\nListKind = ! // 头部严格列表 // 非箱列表 // 重载列表 // 骨部严格列表\n\n## SpineStrict\
    \ 骨部严格性\n\n使用用于 ZF-expression 的列表生成器，可以从其他列表或数组构造一个元素列表。使用列表生成器（使用符号 `:`）可以构造...（注：原文此部分似乎存在重复或逻辑断层，此处根据上下文翻译）。\n\
    \n（注：原文从此处开始出现了大量重复的描述和乱码片段，已按原文结构进行翻译）\n\n"
