    \n```\ndefinition module MyEnv\n```\n\n```\nimport StdBool, StdChar, StdInt, StdReal,\
    \ StdString\n```\n\n定义或实现模块中导入的所有标识符将包含在导入模块的全局作用域内（最外层作用域，见 2.3.2）。\n\n导入标识符可能会导致错误信息，因为导入的标识符可能与属于相同名称的其他标识符冲突；在同一作用域内所有名称必须具有不同的名称（见\
