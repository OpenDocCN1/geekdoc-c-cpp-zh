    ## 9.6 Higher-Order Type Definitions


    We will describe the effect of uniqueness typing on type definitions containing
    higher-order type variables. At it it turns out, this combination introduces a
    number of difficulties which would make a full description very complex. Moreover,
    even after skipping a list of details we have to reader that some of the remaining
    parts are still hard to understand.


    As mentioned earlier, two properties of newly defined type constructor concerning
    uniqueness typing are important, namely property and sign classification. One
    can imagine that, when dealing with higher-order types the determination on these
    properties becomes more involved. Consider, for example, the following type definition.


    - T m = C (m a)


    The question whether T is propagating in its second argument cannot be decided
    by examining this definition only; it depends on the actual instantiation of the
    (higher-order) type variable m. If m is instantiated with a propagating constructor,
    {}, then T becomes propagating in its second argument as well. Actually, propagation
    is not only a property of type constructor, but also of types themselves, particularly
    of ''partial types'' For example, the partial type [] is propagating in its (only)
    argument (Note that the number of arguments a type expects, directly follows from
    the kinds of type constructors that have been used). The type [] is propagating
    in its argument, so is the type T (( Int).


    The analysis in CLEAN that determines propagation of (partial) types has been
    split into two phases. During the first phase, new type definitions are examined
    in order to determine the propagation dependencies between the arguments of each
    new type constructor. To explain the idea, we return to our previous example.


    - T m = C (m a)


    First observe that the propagation of the type variable m is not interesting because
    m does not stand for ''data'' (which is of kind *). We associate the propagation
    of m in T with the position(s) of the occurrence (s) of m''s applications. In
    general, T is propagating in a higher-order variable m if one of m''s applications
    appears on a propagating position in the definition of T. Moreover, for each order
    type variable, we determine the propagation of all first order type variables
    in the following: m is propagating in a, where a is a higher-order first-order
    type variable of T, if a appears on a propagating position in one of m''s applications.
    In the above example, m is propagating in a, since a is on a propagating position
    in the application (m a). During the second phase, the propagation properties
    of (partial) types are determined using the results of the first phase. This (roughly)
    proceeds as follows. Consider the type T for some (partial) type σ, and T as defined.
    First, determine (recursively) the propagation of σ. Then type T is propagating
    if (1) σ is propagating, (2) T is propagating in m, and moreover (3) m is propagating
    in a (the second argument of the type constructor). With T as defined, (2) and
    (3) are fulfilled. Thus now


    - T2 = C2 (a -> Int)


    Then T T2 is not propagating.


    The adjusted uniqueness propagation rule (see also...) becomes:


    - Let σ,τ be two unique types. Suppose σ has attribute u. Then, if τ is propagating
    the application (τ) should have an attribute v such that v ≤ u.


