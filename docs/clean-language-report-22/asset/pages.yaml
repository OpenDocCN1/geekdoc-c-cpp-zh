  md: '# Modules and Scopes


    2.1 Identifiers, Scopes and Name Spaces


    2.4 Definition Modules


    2.2 Modular Structure of Clean Programs


    2.5 Importing Definitions


    2.6 System Definition and Implementation Modules


    2.3 Implementation Modules


    A CLEAN program is composed out of modules. Each module is stored in a file that
    contains CLEAN source code. There are implementation modules and definition modules,
    in the spirit of Modula-2 (Wirth, 1982). This module system is used for several
    reasons.


    +   - First of all, the module structure is to control the scope of definitions.
    The basic idea is that definitions only have a meaning in the implementation module
    they are defined unless they are exported by the corresponding definition module.

    - Having the exported collections in a separate definition module has as advantage
    that in addition adds a self-contained interface document one can reach out to
    others. The definition module is a document that defines functions and data types
    can be used without revealing implementation details.

    - Furthermore, the module structure enables separate compilation which heavily
    reduces compilation time. If the definition module stays, a change in an implementation
    module will only cause the recompilation of that module. When the definition module
    is changed as well, only those implementation modules that are affected by this
    change need to be recompiled.


    In this Chapter we explain the module structure of CLEAN and the influence it
    has on the scope of definitions. New scopes can also be introduced inside modules.
    This is further explained in Chapters 2 and 3.


    In the pictures in the subsections below nested boxes indicate nested scopes.


    # 2.1 Identifiers, Scopes and Name Spaces


    2.1.1 Naming Conventions of Identifiers


    In CLEAN we distinguish the kind of identifiers.


    | ModuleName = LowerCase | UpperCase | Funnyld |

    | FunctionName = LowerCase | UpperCase | Funnyld |

    | ConstructorName = | UpperCase | |

    | SelectorVariable = LowerCase | |

    | Variable = LowerCase | |

    | MacroName = LowerCase | UpperCase | Funnyld |

    | FieldName = LowerCase | |

    | TypeName = | UpperCase | Funnyld |

    | TypeVariable = LowerCase | |

    | UniqueTypeVariable = LowerCase | |

    | ClassName = LowerCase | UpperCase | Funnyld |

    | MemberName = | UpperCase | Funnyld |


    | LowerCaseld = LowerCaseChar~{IdChar} |

    | UpperCaseld = UpperCase~{IdChar} |


    ![](img/9aeba7d533510ecb39b0eab112e3ff5d_20_0.png)'
