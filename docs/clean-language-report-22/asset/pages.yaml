  md: "# Defining New Types\n\n5.1 Defining Algebraic Data Types\n\n5.3 Defining Synonym\
    \ Types\n\n5.2 Defining Record Types\n\n5.4 Defining Abstract Data Types\n\nCLEAN\
    \ is a strongly typed language: every object (graph) and function (graph rewrite)\
    \ in CLEAN has a type. The basic type system of CLEAN is based on the classical\
    \ polymorphic Milner/Hindley/Mycroft (Milner 1978; Hindley 1969, Mycroft 1984)\
    \ type system. This type is adapted for graph rewriting systems and extended with\
    \ basic types, (possibly existentially and universally quantified) algebraic types,\
    \ record types, abstracts and synonym types.\n\nNew types can be defined in an\
    \ implementation as well as in a definition module. Abstract types can only be\
    \ defined on the global level. Abstract types can only be defined in a definition\
    \ module hiding the actual implementation in the corresponding implementation\
    \ module.\n\n```\nTypeDef = AlgebraicTypeDef // see 5.1\n               RecordTypeDef\
    \ // see 5.2\n               SynonymTypeDef // see 5.3\n               AbstractTypeDef\
    \ // see 5.4\n```\n\n# 5.1 Defining Algebraic Data Types\n\nWith an algebraic\
    \ data type one assigns a new constructor (a new type) to a newly introduced data\
    \ structure. The data structure consists of a new constant value (called the data\
    \ constructor) that can have zero or more arguments (of any type). Every data\
    \ constructor must unambiguously have been (pre) defined in an algebraic data\
    \ type. Several data constructors can be introduced in one algebraic data type\
    \ which makes it possible to define alternative data structures of the same algebraic\
    \ data type. The data constructors, just like functions, be used in a curved way.\
    \ Also type constructors can be used in a curved way, although in the type world\
    \ of course.\n\nPolymorphic algebraic data types can be defined by adding (possibly\
    \ existentially or universally quantified, see below) type to the constructors\
    \ on the left-hand side of the algebraic data type. The arguments of the data\
    \ constructor in a type definition are instances of types (that are defined or\
    \ are being defined).\n\nTypes can be prefixed by uniqueness type attributes (see\
    \ Chapter 9). The arguments of a data con-structor can optionally be annotated\
    \ as being strict (see 5.1.5).\n\n```\nAlgebraicTypeDef = :TypeLhs = ConstructorDef\n\
    \                    { ConstructorDef } ;\nTypeLhs = [*TypeConstructor {TypeVariable]\n\
    TypeConstructor = TypeName\nConstructorDef = [ExistentialQuantVariables]ConstructorName\
    \ (BrackType)\n                 [ExistentialQuantVariables](ConstructorName)[Prec][BrackType]\n\
    Fix = infix\n     infix\n     infix\nPrec = Digit\n```"
