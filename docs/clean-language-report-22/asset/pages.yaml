    Introduction


    CLEAN is a practical applicable general-purpose lazy functional programming language
    suited for the development of real world applications.


    CLEAN has many features among which some very special ones.


    Functional languages are usually implemented using graph-rewriting techniques.
    CLEAN has explicit graph semantics; one can explicitly define the *sharing of
    structures (cyclic structures as well)* in the language (Barendregt et al., 1987;
    Sleep et al., 1993, Eekelen et al., 1997). This provides a better framework for
    controlling the time behavior of functional programs.


    Of particular importance for practical use is CLEAN''s Uniqueness Type System
    (Barendsen and Smeters, 1993a) enabling the incorporation of destructive updates
    of arbitrary objects within a pure framework and the creation of direct interfaces
    with the outside world.


    CLEAN''s "unique" features have made it possible to define (in CLEAN) a sophisticated
    and efficient I/O library (Achten and Plasmijer, 1992 & 1995). The Clean I/O library
    enables I/O operations with a high level of abstraction. One can define callback
    functions and I/O components with arbitrary local states providing an object-oriented
    style of programming (Achten, 1996; Achten and Plasmijer, 1997). The library forms
    a platform independent interface to window-based systems: one can port window
    I/O operations in CLEAN to different platforms (support Mac and PC) without modification
    of source code.


    Although CLEAN is by default a lazy language one can smoothly turn it into a *strict*
    language to obtain time/space behavior: *functions* can be defined lazy as well
    as *(partially)* strict in its arguments; (recursive) *data structure* can be
    defined lazy as well as *(partially)* strict in any of its arguments.


    The rich type system of CLEAN 1 (offering high-order, polymorph types, type classes,
    types extensively quantified with multi parameter type constructors, abstract
    types, synonym types, arrays, lists) is limited to rank 2, rank n is in preparation).
    Furthermore, arrays and lists are better in the language. Strict, spine-unboxed,
    and overloaded lists are predefined in the language.


    CLEAN now offers a hybrid type system with both static and dynamic typing. An
    object (expression) of static type can be changed into an object of dynamic type
    (a "Dynamic") and backwards. One can make a Dynamic written by any CLEAN program
    with one function call. A Dynamic can contain data as well as (unevaluated) types.
    This means that one can easily transfer data as well as copy (!) from one CLEAN
    application to another a type safe manner enabling mobile code and persistent
    storage of an instance.'
