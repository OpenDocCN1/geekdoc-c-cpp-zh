  md: "# DotDot Expressions\n\nDotDotexpression = [[ListKind] GraphExpr [, GraphExpr]\
    \ . [GraphExpr] [SpineStrictness]]\n\nWith a dot-expression the list elements\
    \ are enumerated by giving the first element (n1), an optional second element\
    \ (n2) and an optional list (e).\n\nAlternative ways to define a list dot expression.\n\
    \n```\n[1,3..9]             // [1,3,5,7,9]\n[1..9]               // [1,2,3,4,5,6,7,8,9]\n\
    [..]                // [1,2,3,4,5 and so on...]\n['a..'c']             // ['abc']\n\
    ```\n\nThe generated list is in general calculated as:\n\n```\nfrom_then_to: !\
    \ !a la -> [a] | Enum a\nfrom_then_to n1 e2\n| n1 < n2 = _from_by_to n1 (n2-n1)\
    \ e\n  = _from_by_to n1 (n2-n1)\nwhere\n  from_by_to n s e\n  | n<=e = [n : _from_by_to\
    \ (n+s) s e]\n  = []\n\nfrom_by_down n s e\n  | n>=e = [n : _from_by_down (n+s)\
    \ s e]\n  = []\n```\n\nThe step size is one by default. If no limit specified\
    \ an infinite list is generated.\n\nWith a dot-expression one can also define\
    \ a lazy list, a strict list, an unboxed or an overloaded list.\n\n```\n[ 1,3..9\
    \ ]           // a lazy list\n[! 1,3..9 ]          // a strict list\n[! 1,3..9\
    \ !]         // a strict list (head and spine)\n[ 1,3..9 ]           // a strict\
    \ list, unboxed\n[ 1,3..9 !]         // a strict list (head and spine),\nunboxed\n\
    [ 1,3..9 ]           // an overloaded list\n```\n\nDifferent types of lists (lazy,\
    \ strict, unboxed and overloaded can be defined with a dot expression as.\n\n\
    Dot-expression can only be used if one imports StEnum from the standard library.\n\
    Dot-expressions are predefined on types of Int, Real and Char, dot also can be\
    \ applied to any user defined structure for which the class enumeration type has\
    \ been instantiated (CLEANS Environment).\n\n# List Comprehensions\n\n```\nZF-expression\
    \      = [ListKind] GraphExpr \\ (Qualifier)-[SpineStrictness]\nQualifier    \
