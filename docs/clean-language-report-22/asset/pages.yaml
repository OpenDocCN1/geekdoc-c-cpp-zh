    When a Dynamic is written to using the function writeDynamic, two (!) files are
    created: a .dyn and a .sysdyn file. The .sysdyn file contains the actual information:
    a String encoding of the dynamic. This sysdyn is used by the Dynamic Linker and
    should not be touched by the user because it might make the Dynamics stored on
    disk unreadable. The special garbage collector will also remove unused .sysdyn
    files.


    The user may only touch and use the .dyn file that contains the actual dynamic
    stored in the .sysdyn file. The .dyn file can be seen as a "typed" file. It can
    be handled like any other user file. It can be renamed, moved or deleted without
    any danger.


    When a Dynamic is written to a file, an encoding of the graph and its type are
    written to disk. The graph is encoded in a way that will be maintained when the
    graph is read again. The stored graph may contain unwanted evaluations. In a Dynamic
    on disk, functions are represented by symbolic pointers to the corresponding code
    repositories. The types stored in a Dynamic point to the corresponding type definitions
    stored in the type repositories.


