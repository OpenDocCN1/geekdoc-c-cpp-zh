    \nCLEAN 2.x handles uniqueness attributes in type synonyms different than CLEAN\
    \ 1.3.x. Consider the following definitions:\n\n```\n:: ListList a := [[a]]\n\
    f :: *(ListList {Int}) -> *(Int)\nf [[a]] = { a & [0]=0 }\n```\n\nIn CLEAN 1.3.x\
