    The convention used is that variables always start with a lowercase character
    while constructors and types-start with an uppercase character. The other identifiers
    can either start with an uppercase or lowercase character. Note that for the identifiers
    may be consisting of a combination of lower and/or uppercase characters but one
    can also define identifiers from special characters like +, <, etc. (see Appendix
    A). These two kinds of identifiers cannot be mixed. This makes it possible to
    leave out white space in expressions like a+1 (same as a +1).


    # 2.1.2 Scopes and Name Spaces


    The scope is the program region in which definitions (e.g. function definition,
    class definition, macro definition, type definition) with the identifiers introduced
    (e.g. function name, class name, variable name, type constructor name, type variable
    name) have a meaning.


    It must be clear from the context to which an identifier is referring. If all
    identifiers in a scope have different names then it will be clear what definition
    is meant. However, one generally wants to have free choice in naming identifiers.
    Identifiers belonging to different name spaces no conflict arise if the same name
    is used. In CLEAN the name spaces exist:


    +   - ModuleNames form a space;

    - FunctionNames,ConstructorNames,SelectorVariables,Variables and MacroNames form
    a space;

    - FieldNames form a space;

    - TypeNames,TypeVariables andUniqueVariables form a name space;

    - ClassNames form a name space.


    So, it is allowed to use the same identifier for different purposes as long as
    the identifiers belong to different name spaces.


    > Identifiers belonging to the same name space must all have different names within
    the same scope. Under certain conditions it is allowed to use the same name for
    different functions and operators (overloading, see Chapter 6).


    # 2.1.3 Nesting of Scopes


    Reusing identifier names is possible by introducing a new scope level. Scopes
    can be nested: within a scope a new scope can be defined. Within such a nested
    scope definitions can be given, new names'
