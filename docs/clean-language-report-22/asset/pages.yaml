  md: "An array is a tuple/record-like data structure in which all elements are of\
    \ the same type. Instead of selection by position or name the elements of an array\
    \ can be selected efficiently in constant time by indexing. The update of arrays\
    \ is done in CLEAN and therefore arrays are unique (see Chapter 9) if one wants\
    \ to use this feature. Arrays are very useful if time and space consumption is\
    \ becoming critical (CLEAN arrays are implemented very efficiently). If efficiency\
    \ is not a big issue we recommend not to use arrays by lists: lists induces a\
    \ much better programming style. Lists are more flexible and less error prone:\
    \ array elements can only be accessed via indices and if you make a calculation\
    \ error, indices may point outside the array bounds (e.g. a matrix) it is detected,\
    \ but only at run-time. CLEAN arrays starts with 0. More dimensional arrays can\
    \ be defined as an array of.\n\nFor efficiency reasons, arrays are available of\
    \ several types: there are lazy arrays {a}, strict arrays (type {!a}) and unboxed\
    \ arrays {#Int}. All arrays are considered to be of different type. By using the\
    \ overloading mechanism (type constructor classes) one can still define (overloaded)\
    \ functions that work on any of these.\n\n```\nArray = ArrayDenotation\n     \
    \ | ArrayUpdate\n```\n\n+   - All elements of an array need to be of same type.\n\
    \n# Simple Array\n\nA new array can be created in a number of ways. A direct way\
    \ is to simply list the array elements.\n\n```\nArrayDenotation = {GraphExpr}-list\n\
    \              | StringDenotation\n\nStringDenotation = StringDel(AnyChar~/~StringDel)StringDel\n\
    StringDel = \"\n```\n\nBy default a lazy array will be created. Arrays are created\
    \ unique (the * or. attribute in front of the type, Chapter 4) to make destructive\
    \ updates.\n\nA lazy array is a box with pointers pointing to the array elements.\
    \ One can also create a strict array (explicitly define its type as {!Int}), which\
    \ will have the power to the elements to the array box points will be directly\
    \ evaluated. One can create an unboxed array (explicitly define its type as {#Int}),\
    \ which will have the power to evaluate the elements (which are to of basic value)\
    \ are stored in the array box. Clearly the last one is the most efficient representation\
    \ (see also Chapter 10).\n\nCreating a lazy array, strict and unboxed array of\
    \ integers with elements 1,3,5,7,9.\n\n```\nMyLazyArray :: {:Int}\nMyLazyArray\
