    \ | Wed | Thu | Fri | Sat | Sun\n::Tree = NilTree\n  NodeTree (Tree a) (Tree a)\n\
    ```\n\n```\nMyTree:: (Tree Int) // constant function yielding a Tree of Int\n\
    MyTree = NodeTree 1 NilTree Nil NilTree\n```\n\nAn algebraic type definition can\
    \ be seen as the specification of a grammar in which is specified what legal data\
    \ objects are of that type. Notice that all CLEAN types (basic, list, tuple, array,\
    \ record, abstract types) can be regarded as special cases of an algebraic type.\n\
    \nConstructors with two arguments are defined as infix constructor, in a similar\
