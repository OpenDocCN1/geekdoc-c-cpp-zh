    # 10.2 Defining Graphs on the Global Level


    Constant graphs can also be defined on a global level (for local constant graphs
    see 3.6).


    ```

    GraphDef = Selector=[:]GraphExpr;

    ```


    A global graph definition defines a global constant (closed) graph, i.e. a graph
    which has the same scope as a global function (see 2.1). The selector variables
    that occur in the selectors of a global graph have a scope as globally as defined
    functions.


    Special global graphs (in contrast with local graphs) are that they are not garbage
    collected during the evaluation of the program A global graph can be compared
    with a CAF (Constant Application Form); its value is computed once and remained
    at runtime. A global graph can save execution time at the cost of permanent space
    consumption.


    Syntactically the definition of a graph is distinguished from the definition of
    a function by the symbol which separates left-hand from right-hand side: "=" is
    used for graphs where "->" is used for functions. However, in general the more
    common symbol "=" is used for both types of definitions. Generally it is clear
    from the context what it means (having parameters, selectors are also easily recognisable).
    However, when a simple constant the syntax is unambiguous (it can be a constant
    function as well as a constant graph).


    Global graph versus constant function definition: biglist1 is a graph which is
    computed only once, every time it is applied.


    ```

    biglist1 = [1..10000] // a constant function (if defined globally)

    biglist2 = [1..10000] // a graph

    biglist3 -> [1..10000] // a constant function

    ```


    A graph saves execution-time at the cost of space consumption. A constant function
    saves space at the cost of execution time. So, use graphs when the computation
    is time-consuming while the space consumption is small and constant functions
    in the other case.'
