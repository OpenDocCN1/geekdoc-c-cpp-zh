  md: '# Dynamics


    +   8.1 Packing Expressions into a Dynamic


    +   8.2 Unpacking Dynamics Using a Pattern Match


    +   8.3 Type Safe Communication using Dynamics


    +   8.4 Architecture of the implementation


    +   8.5 Semantic Restrictions on Dynamics


    Dynamics is a new experimental feature of CLEAN. The concept is easy to understand,
    but the implementation is not straightforward (see Vervaat and Plasmeijer, 2002).
    So, it will take time before all bits and pieces are implemented and the system
    will work flawlessly. Please be patient.


    What can you do with "Dynamics" With "Dynamics" it is possible to store and exchange
    a CLEAN expression between (different) CLEAN applications in any and type-safe
    way. The expression may contain (unevaluated) data and (unevaluated) functions.
    Here are some examples of its use:

    store and fetch information to and from disk (settings and the like). Traditionally,
    information written to file has to be converted by the programmer to String format.
    When the file is read again a parser has to be constructed to parse the input
    and convert the String back to the appropriate structure. Dynamics can store and
    retrieve (almost) any CLEAN data structure with just one (!) function call. Not
    only can be saved, but also code (unevaluated functions, higher order), which
    is part of the data being stored. Dynamics makes it easier to write a persistent
    application: an application that stores the settings in a way that the next time
    the user will see everything in the same way as the last time the application
    was used.


    Differently programmed CLEAN applications, even distributed across a network,
    can easily communicate arbitrary expressions that contain data as well as code
    (unevaluated functions) in a type-safe way. Dynamics can be communicated via file
    or messaging primitives offered by the CLEAN libraries. The fact that CLEAN applications
    can communicate code that a running CLEAN application can be extended with additional
    functionality. So, plug-ins and mobile code can be realized easily and everything
    is type-safe.


    To make this possible we need special features in the CLEAN language. In the CLEAN-run
    system support is needed as well. This includes dynamic type checking, dynamic
    type unification, dynamic encoding and decoding of arbitrary CLEAN expressions
    and types, dynamic linking, garbage collection of objects on disk, and just-in-time
    code generation.


    In CLEAN 2.0 we have a dynamic type system that CLEAN offers a hybrid type system
    with both static and dynamic type. An object of static type can be patched into
    an object of dynamic type (a "Dynamic") and backwards. The type of a Dynamic can
    be checked at-run. An application can also check types of static Dynamics can
    be unified with each other, without a need to know what types to manage processes
    and plug-ins (see Van Weelen and Plasmeijer, 2002).


    In this Chapter we explain how a Dynamic can be constructed (see 8.1). In Section
    8.2 we explain how the type of a Dynamic can be inspected by a pattern match,
    and how one can ensure that Dynamics fit together using run-time unification.


    We explain in Section 8.3 how dynamics can be used to realize safe communication
    of expressions between independently executing applications. In Section 8.4 we
    explain the basic architecture of the CLEAN'
