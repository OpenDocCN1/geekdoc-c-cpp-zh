  md: '# SpineStrict


    CLEAN any data structure can be made (partially) strict or unboxed (see 10.1).
    This has consequences for the time and space behavior of the data structure.


    For instance, lazy lists are very convenient (evaluated unless it is really needed
    for the computation, but they can be inefficient if almost always all elements
    are evaluated sooner or later. Strict list are often more efficient, but one has
    to be careful not to trigger a near infinite computation. Spine lists are more
    efficient as, but one cannot handle infinite lists within that. Unboxed lists
    are more compact: instead of a pointer to the elements list the element itself
    is stored in an unboxed list. However, unboxed lists have also disadvantage that
    they can only be used in certain cases: they can only contain elements of basic
    type, records and tuples. It does not make sense to offer unboxing for arbitrary
    types: boxing saves space, but if not Cons nodes are copied lists: the elements
    are copied as well otherwise the contents could remain shared using the element
    pointer index.


    In terms of efficiency it can make quite a difference (e.g strict lists sometimes
    be 6 times faster) kind of list is actually used. But it is in general decide
    which kind of list is best to use. This depends on how a list is used in a program.
    A wrong choice might turn a program from useless (to inefficient), from terminating
    to non-terminating.


    Because lists are frequently used, special syntax is provided to make it easier
    for a programmer to change from one list to another, just changing the kind of
    brackets. One can define a list of which the head element is strict or the spine
    is (indicated by !), a list of the spine is strict the head element is lazy (indicated
    by !) and a completely evaluated list (indicated by !!). One can have an unboxed
    list with a strict head element (indicated by !) and a completely unboxed list
    of which addition in the spine is strict as well (indicated by #!).


    Various types of list.


    ```

    fac 10 : expression ] // lazy list

    ! fac 10 : expression ] // head strict list

    ! fac 10 : expression ! // head strict and tail strict list

    # fac 10 : expression ] // head strict list, unboxed.

    ! fac 10 : expression ! // head strict and tail strict list,

    unboxed

    ```


    +   - Unboxed data structures can only contain elements of basic type, records
    and arrays.


    Example of an overloaded list.


    ```

    fac 10 : expression ] // overloaded list

    ```


    Other ways to create lists are via dot-dot expressions and list comprehensions.'
