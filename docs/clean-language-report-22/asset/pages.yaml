    end of a header, a CLEAN program becomes layout sensitive. The *layout rule* assumes
    the omission of the semicolon ('';'') that defines a definition and of the braces
    (''{'' and ''}'') that are used to group a list of definitions. These symbols
    are automatically added according to the following rules:


    In layout sensitive mode the indentation of the first lexeme after the keywords
    *let*, #*, *!*, *of*, *where*, or *with* determines the indentation of the group
    of definitions the keyword has to obey. Depending on the indentation of the first
    lex on a subsequent line the following happens. A new definition is assumed if
    the lexeme starts on the same indentation (and a semicolon is inserted). A previous
    definition is assumed to be continued if the lexeme is indented more. The group
    of definitions ends (and a close brace is inserted) if the lexeme is indented
    less. Global definitions are assumed to start in column 0.


    We strongly agree to write programs in layout sensitive mode. *For reasons of
    portability it is assumed that a tab space is set to 4 white spaces and a non-proportional
    font is used.*


