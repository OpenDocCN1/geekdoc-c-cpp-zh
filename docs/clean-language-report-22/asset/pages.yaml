  md: "# MyTree2:: Tree2 []\nMyTree2 = NodeTree [1,2] NilTree NilTree Quantified Variables\n\
    \n# 5.1.3 Defining Algebraic Data Types with Existentially Quantified Variables\n\
    \nAn algebraic type definition can contain existentially quantified type variable\
    \ s (or, for short, existential type variables) (Läfer 1992). These special variables\
    \ are defined on the right-hand side of the type definition and are indicated\
    \ by preceding them with \"E\". Existential types are useful if one wants to create\
    \ (recursive) data structures in which objects of different types are stored (e.g.\
    \ with elements of different types).\n\n```\nAlgebraicTypeDef ::= TypeLhs :: ConstructorDef\n\
    ConstructorDef ::= {ConstructorDef};\nExistentialQuantVariables ConstructorName\
    \ [BracketType]\n[ExistentialQuantVariables](ConstructorName) [Fix][Prec] [BracketType]\n\
    ExistentialQuantVariables .= {E.TypeVariable}+\n```\n\nExample of such an existentially\
    \ quantified type. In this example we an existentially quantified state s, and\
    \ a method to change this state s, and a method to convert the state s into a\
    \ String. Upon mention of such record MyObject the type of the internal state\
    \ and the methods defined on the state are consistent (in this case the state\
    \ is of Int). The methods stored on the Object can (only) be applied on the state\
    \ of that thus enabling an object-oriented style of programming. The concrete\
    \ type of the state held in the object is not visible from outside. To show it\
    \ to the outside world one has to convert the state, which can be of any type,\
    \ to an ordinary not existentially quantified type. For instance, PrintState converts\
    \ the state into a String. Objects that have states of different type are considered\
    \ of the same type and can be part of the same list.\n\n```\n::Object = E.s: {state::s,\
