    the implementation module is a system implementation module which does not contain
    ordinary CLEAN. System implementation modules is allowed to define foreign functions:
    both of these functions are written in any language other CLEAN. System implementation
    modules make it possible to create interfaces to operating systems, to file systems
    or to increase execution speed of heavily functions or complex data structures.
    Typically, predefined function and operators for arithmetic and File I/O are implemented
    as system modules.


