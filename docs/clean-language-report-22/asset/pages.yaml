  md: "An algebraic data type can be used in a pattern. The pattern consists of the\
    \ data constructor (see 3.2) with optional arguments on which it contain sub-patterns.\
    \ A constructor forces evaluation of the corresponding actual argument to strict\
    \ root normal form if the strategy has to determine whether the actual argument\
    \ is equal to the specified constructor.\n\n```\nGraphPattern = Constructor //\
    \ Zero arity Constructor\n                (Constructor (Pattern)) // Constructor\
    \ pattern\nGraphPattern ConstructorName = Infix Constructor operator\n       \
    \         GraphPattern\n```\n\nExample of an algebraic data type definition and\
    \ its use in a pattern in function definition.\n\n```\n::Tree = Node (Tree a)\
    \ (Tree a)\n      | Nil\nMirror:: (Tree a) -> Tree a\nMirror (Node e left right)\
    \ = Node e (Mirror right) (Mirror left)\n      Mirror Nil = Nil\n```\n\n+   -\
    \ The data constructor used in a patter must be defined in an algebraic data type.\n\
    \n# 5.1.2 Using Higher Order Types\n\nIn algebraic type definition ordinary types\
    \ can be used (such as a basic type, e.g. Int, or a list type, e.g. [Int], or\
    \ an instantiation of a user defined type, e.g. Tree Int), but one can also use\
    \ higher order types. Higher order types can be constructed by partial applications\
    \ of the type constructors. Higher order types can be applied in the world similar\
    \ as higher order functions in the world. The use of higher order increases the\
    \ flexibility with which algebraic types can be defined. Predefined types can\
    \ be used in correct way (see 4.5). Higher order types play important role in\
    \ combination with type classes (see Chapter 6).\n\nOf course, one needs to ensure\
    \ that all types are defined in a correct way. To be able to specify the rules\
    \ that indicate whether a type itself is correct, we introduce the notion of kind.\
    \ A kind can be seen as the 'type of type'. In our case, the kind of type expresses\
    \ the number of types it may have. The kind x stands for so-called first-order\
    \ type: a type expecting no further arguments ({Int, Bool, [Int], cetera). All\
    \ functions are of kind x. The kind x -> x for a type that can be applied to a\
    \ (first-order) type, which yields another first-order type, x -> x -> x expects\
    \ two arguments, and so.\n\nIn CLEAN each top-level type should have kind x. A\
    \ top-level type is a type that occurs either as an argument or result of a function\
    \ or as argument of a data constructor (some algebraic data type). The rule for\
    \ determining the kinds of the type variables (which can be of any order) is fairly\
    \ simple: the kind of a type variable without arguments, it is x. Its kind corresponds\
    \ to the number of arguments to which it is applied. The kind of type variable\
    \ determines its possible instances, i.e. it can only be instantiated with a type,\
    \ which is of the same kind as the type variable.\n\nExample of an algebraic type\
    \ using higher order types; the type i in the definition of Tree2 s of kind X\
    \ -> X is instantiated with a (also of kind X -> X) in the definition of MyTree2.\n\
    \n```\n::Tree2 t = NilTree\n      NodeTree (t Int) (Tree2 t) (Tree2 t)\n```"
