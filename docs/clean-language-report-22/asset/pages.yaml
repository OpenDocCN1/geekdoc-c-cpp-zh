  md: '# 10.1.2 Strict and Lazy Context


    Each expression in a function definition is considered to be either strict (appearing
    in a strict context: it has to be evaluated to strict normal form) or lazy (appearing
    in a lazy context : not yet to be evaluated to strict normal form). Following
    rules specify whether or not a particular expression is lazy or strict:

    * a non-variable pattern is strict;

    * an expression in a guard is strict;

    * the expressions specified in a strict let-before expression are strict;

    * the root expression is strict;

    * the arguments of a function or data constructor in a strict context are strict
    when these arguments are being annotated in the strict type of that function (manually
    or automatically) or in the type definition of the data constructor;

    * all the other expressions are lazy.


    Evaluation of a function will happen in the following order: patterns, guard,
    expressions in a strict let before expression, root expression (see also 3.1).


    # 10.1.3 Space Consumption in Strict and Lazy Context


    The space occupied by CLEAN depend on the kind of structures one is using, but
    also depends on whether these data structures appear in a strict or in a lazy
    context. To understand this one must have some knowledge about the basic implementation
    of CLEAN (see Plasmeijer and Van Eekelen, 1993).


    Graphs (see Chapter 1) are stored in a piece of memory called the heap. The amount
    of space needed depends heavily on the kind of structures that are in use. Graph
    structures are created in a lazy context occupy more space than graphs created
    in a strict context. The garbage collector in the runtime of CLEAN automatically
    collects graphs that are not being used. The arguments of functions are evaluated
    on a stack. There are two stacks: the A-stack, which contains references to graph
    nodes stored in the heap and the BC-stack which contains arguments of basic type
    and return addresses. Data in a lazy context are passed via references on the
    A-stack. Data structures of the basic types (Int, Real, Char or Bool) in a strict
    context are stored on the B-stack or in registers. This is also the case for these
    basic types when they are part of a record or tuple in a strict context.


    Data living on the B-stack areboxed. They consume less space (because they are
    not part of a node) and can be treated much more efficiently. When a function
    is called in a lazy context its data are placed in a graph node (boxed). The amount
    of space occupied is depending on the parity of the function.


    In the table below the amount of space consumed in the different situations is
    summarised (the lazy as well as the strict context). For the size of the elements
    one can take the size consumed in a strict context.


    | Type | Arity | Lazy context (bytes) | Strict context (bytes) | Comment |

    |---|---|---|---||

    | Int, Bool | | 8 | 4 | |

    | Int (0≤n32), Char | | | 4 | node shared |

    | Real | | 12 | 8 | |

    | Small Record | n | 4 + Σ elements | Σ elements | total length≤12 |

    | Large Record | n | 8 + Σ elements | Σ elements | |

    | Tuple | 2 | 12 | | Σ elements | |

    | >2 | | 8 + 4*n | Σ elements | |'
