    The CLEAN compiler (written in CLEAN) compiles CLEAN implementation modules (.icl
    and .dcl files) to machine independent abc-code (.abc files). The CLEAN definition
    modules are used to check the consistency between the separately programmed CLEAN
    modules. The abc-code contains machine instructions for a virtual abstract machine,
    the abc-machine (see Plasmeier and van Eekelen, 1993). The abc-code is a kind
    of platform independent byte code specially designed for CLEAN. The Code Generator
    (the one and only application in the Clean system which is) translates the abc-code
    into platform dependent symbolic machine code (.obj files under Windows). The
    code generator can generate code for different platforms such as Intel (Windows,
    Linux), Motorola (Mac) and Sparc (Unix) processors. The Static Linker (written
    in CLEAN) links all the object modules of one CLEAN program together into a clickable
    application (.exe file under Windows). The compilation scheme described above
    can be used even if Dynamics are internally used in an application. But, as soon
    as Dynamics are communicated to File or communicated to another program, a different
