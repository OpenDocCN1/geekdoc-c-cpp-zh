    # 1.2 Global Graphs


    Due to the presence of global graphs in CLEAN the initial graph in a specific
    CLEAN program is slightly different from the basic semantics. In a specific CLEAN
    program the initial graph is defined as:


    ```

    @DataRoot = Graph @StartNode @GlobId1 @GlobId2 ... @GlobIdn

    @StartNode = Initial

    @GlobId1 = Initial

    @GlobId2 = Initial

    ...

    @GlobIdn = Initial

    ```


    The root of the initial graph will not only contain the node-id of the start node,
    the root of the graph to be rewritten, but it will also contain for each global
    graph (see 10.2) a reference to an initial node (initialized with the symbol Initial).
    All references to a specific global graph will be references to its initial node,
    or when it is rewritten, they will be references to its reduct.'
