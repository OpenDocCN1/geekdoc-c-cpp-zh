  md: 'Preferably, the macros in the file Clean.h (part of the tool htoclean) should
    be used to access strings and arrays,


    If result of function is not a tuple, the result is passed in the same way as
    an argument, except that strings and arrays are not copied. The address of the
    string or array in the heap of passed to C. This string or array may only be used
    until the next call or return to Clean, because the Clean runtime system deallocate
    or move the array.


    If multiple values are yielded, because the result is a tuple, the result type
    in C is void. To return the values, for each value an additional argument with
    the address where the result should be stored is added (at the end, in the same
    order as in the tuple). For example, if the result has type (Real, Int), an additional
    double * and long * (__int64 * for 64 bit Windows) is added.


    # 11.2 Using ABC instructions


    Function can be implemented using ABC instructions from the virtual machine used
    by Clean:


    ```

    ABCCodeFunctionDef = Function {Pattern} = code [inline] { ABCInstructions }

    ```


    By adding the ABC instructions will be inlined if the function is called in a
    strict context.


    This is used to define primitive functions of the StdEnv, for example integer
    addition. htoclean generates calls to C functions using the ABC instruction ccall.'
