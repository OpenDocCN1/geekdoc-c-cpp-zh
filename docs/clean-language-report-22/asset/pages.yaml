    \ -> *(Int)\n```\n\nThis yields a uniqueness error in CLEAN 2.x because the inner\
    \ list is shared but contains a unique object. This problem happens only when\
    \ type synonyms have attributes like \"inbetween\". An \"inbetween\" attribute\
    \ is neither the \"root\" nor the attribute of an actual argument. E.g. with the\
    \ upper type synonym, the formal argument \"a\" is substituted with {Int}. Note\
    \ that the \"a\" is substituted for \"a\". Because we wrote (ListList ...) the\
