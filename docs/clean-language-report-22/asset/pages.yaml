  md: "# Lexical Structure\n\nB.1 Lexical Program Structure\nB.2 Comments\nB.3 Reserved\
    \ Keywords and Symbols\n\nIn this appendix the lexical structure of CLEAN is given.\
    \ It describes the kind of tokens recognised by the scanner/parser. In particular\
    \ it summarizes the keywords, symbols and characters which have a special meaning\
    \ in the language.\n\n# B.1 Lexical Program Structure\n\nIn this section the lexical\
    \ structure of CLEAN is given. It describes the kind of tokens recognised by the\
    \ scanner/parser. In particular it summarizes the keywords, symbols and characters\
    \ which have a special meaning in the language.\n\n```\nLexProgram = { Lexeme\
    \ | (Whitespace)+ }\nLexeme = ReservedKeywordOrSymbol // see Section B.3\n   \
    \    ReservedChar // see Section A.9\n       Literal\n       Identifier\nIdentifier\
    \ = LowerCase // see A.8\n       UpperCase // see A.8\n       Funnyldd // see\
    \ A.8\nLiteral = IntDenotation // see A.9\n       RealDenotation // see A.9\n\
    \       BoolDenotation // see A.9\n       CharDenotation // see A.9\n       CharsDenotation\
    \ // see A.9\n       StringDenotation\nWhitespace = space // a space character\n\
    \       tab // a horizontal tab\n       newline // a newline char\n       formfeed\
    \ // a formfeed\n       vertab // a vertical tab\n       Comment // see Section\
    \ B.2\n```\n\n# B.2 Comments\n\n```\nComment = // AnythingTillNL\n       newline\n\
    \       /* AnythingTill* // comments may be nested\n       */\n       /* AnythingTill*\
    \ */\n       {AnyChar~newline} // no newline\n       {AnyChar~*} // no \"*\"\n\
    \       {AnyChar~/*} // see A.8\n       IdChar\n       ReservedChar\n       Special\n\
    AnythingTillNL =\nAnythingTill/* = =\nAnythingTill/* = =\nAnyChar = =\n```"
