    # 11.6.3 The Gepko Python Solver


    The gekko package can be used to solve dynamical optimization problem at mode
    6 (Nonlinear control / dynamic optimization (CTL)). The objective function can
    be written in Mayer''s form, adding a new variable X whose derivative is the integral
    of the objective function, and the problem will be to minimize φ(X(t_f)). The
    following example shows how gekko can be used to solve an optimal control problem.


    Example 11.5 We consider the optimal control problem of the SIR model described
    in Example 11.4, and use the Gepko Python package to solve it.

    The code SolveGekkoSIR uses the Gepko Python to solve the problem of example 11.4.


