  md: '# Solving Linear Programming Problems with pulp


    Then, some variable (for example LPP) shall be used to define the problem and
    solve it. pulp enables the user to name his/her problem and defining its type
    (*maximization, minimization*) through the function LpProblem. To define a maximization
    problem the parameter LpMaximize shall be passed as a second argument to LpProblem,
    and to define a minimization problem the parameter LpMinimize shall be passed
    for:


    In [15]: LPP = pulp.LpProblem("Problem of maximizing profit", LpMaximize)


    The variables of the problem shall be defined by the pulp function LpVariable.
    It receives a string and bounds of variable. For example if the problem contains
    a 0 ≤ x ≤ 5:


    x = plp.LpVariable("x", 0., 5.)


    Those variables can be used with problem instance LPP.

    Next, the equality and inequality constraints of the problem are added to the
    problem instance. If the problem contains an inequality constraint 2x+y ≤ 10 then
    this constraint is added to the problem using an instruction:


    LPP += 2*x + y <= 10


    In pulp the user does not have to change the forms of the inequality constraints.
    if the problem contains a constraint x+y ≥ 2, it can be added to the problem instance
    without transforming it to other form:


    LPP += x + y >= 2


    Finally, after defining the problem, the solve() method of the LPP instance can
    be used to solve the problem and displaying the results.

    The Python script SolveExLinProg.py is used to solve the problem of Example 9.1
    and show the results:


    ```

    # SolveExLinProg.py

    2 import pulp as pulp

    3 LPP = pulp.LpProblem("Problem statement: \n", pulp.LpMaximize)

    4 X, y, z = pulp.LpVariable("x", lowBound=0), ...

    pulp.LpVariable("y", lowBound=0), pulp.LpVariable("z", ...

    lowBound=0),

    5 LPP += 3*x + y + 2*z

    6 LPP += x + y <= 40

    7 LPP += x + 2*z <= 60

    8 LPP += x >= 0.

    9 LPP += y >= 0.

    10 LPP += z >= 0.

    11 print (LPP)

    12 status = LPP.solve()

    13 print(''Status of the optimization process: '' + ...

    pulp.LpStatus[status])

    ```'
