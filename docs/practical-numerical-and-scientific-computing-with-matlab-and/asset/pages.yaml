    By solving the second equation in $p(t)$ together with the transversality condition,
    we get


    $p^*(t) = e^{a(T-t)}$


    By solving the first equation in $u(t)$, we get


    $u^*(t) = -\frac{p^*(t)}{2\alpha} = \frac{e^{a(T-t)}}{2\alpha}$


    Finally, by solving the third equation in $x(t)$, we get


    $x^*(t) = \left(x_0 - \frac{e^{aT}}{4\alpha a}\right)e^{at} + \frac{e^{a(T-t)}}{4\alpha}$


    # 11.3 Necessary Conditions of the Discretized System


    We develop in this section a numerical method for solving an OCP without transforming
    it into one without time delays.


    Let $\mathcal{N}$ be a positive integer and $h = \frac{T-t_0}{N}$ then $s_0 =
    t_0 < s_1 < \dots < s_{\mathcal{N}} = t_f$ where $s_{i+1} = s_i + h$ and $h$ is
    positive for the interval $[t_0, t_f]$. Let $x(s_i), \mathbf{p}(s_i)$ and $\mathbf{u}(s_i)$
    be the values of $x(t), \mathbf{p}(t)$ and $\mathbf{u}(t)$ at $t=s_i$, $i=0,1,\dots,\mathcal{N}$.
    The Hamiltonian at $s_i$ is given by


    ```

    $\mathcal{H}[s_i] = \mathcal{H}(s_i, x(s_i), \mathbf{x}(s_i - \tau), \mathbf{p}(s_i))
    = L_0[s_i] + \mathbf{p}^T(s_i)f[s_i] \quad (11.17)$

    ```


