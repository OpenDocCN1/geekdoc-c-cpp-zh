    used to find an approximation for the system solution in iteration $k+1$. This
    is done as follows:


    ```

    $x_1^{(k+1)} = \frac{1}{a_{11}}(b_1 - a_{12}x_2^{(k)} - \dots - a_{n1}x_n^{(k)})$$

    $x_2^{(k+1)} = \frac{1}{a_{22}}(b_2 - a_{21}x_1^{(k)} - a_{23}x_3^{(k)} - \dots
    - a_{n2}x_n^{(k)})$$

    $\vdots$

    $x_i^{(k+1)} = \frac{1}{a_{ii}}(b_i - a_{i1}x_1^{(k)} - \dots - a_{i,i-1}x_{i-1}^{(k)}
    - a_{i,i+1}x_{i+1}^{(k)} - \dots - a_{in}x_n^{(k)}) \quad (2.3)$$

    $\vdots$

    $x_n^{(k+1)} = \frac{1}{a_{nn}}(b_n - a_{n1}x_1^{(k)} - \dots - a_{n,n-1}x_{n-1}^{(k)})$

    ```


    Generally, in solution iteration $x_i^{(k+1)}$ can be written in the form:


    ```

    $x_i^{(k+1)} = \frac{1}{a_{ii}}(b_i - \sum_{j=1, j \neq i}^n a_{ij}x_j^{(k)}),
    i=1, \dots, n \quad (2.4)$

    ```


    The Jacobi method stops when,


    ```

    $||x_i^{(k+1)} - x_i^{(k)}|| < \varepsilon$,

    ```


    for some arbitrary $\varepsilon > 0$.


    **Example 2.1** Write the first iterations of the Jacobi method, for the linear
    system:


    ```

    $\begin{pmatrix} 2 & -1 & 1 \ -2 & 5 & -1 \ 1 & -2 & 4 \end{pmatrix} \begin{pmatrix}
    x_1 \ x_2 \ x_3 \end{pmatrix} = \begin{pmatrix} -1 \ 1 \ 1 \end{pmatrix}$

    ```


    starting from the zeros vector


    ```

    $x^{(0)} = \begin{pmatrix} 0 \ 0 \ 0 \end{pmatrix}$

    ```


    **Solution:**


