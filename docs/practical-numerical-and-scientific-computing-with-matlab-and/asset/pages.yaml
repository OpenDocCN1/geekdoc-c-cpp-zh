  md: "# Solving Systems of Nonlinear Ordinary Differential Equations\n\nThe second\
    \ step is to write a function, which can evaluate the right-hand side of the system,\
    \ where the output is an n-dimensional vector. This is done as follows:\n\n```\n\
    function z = fp(t, z)\nz = [ f.1(t, z);      \nf.2(t, z);      ...\n4\nf.n(t,\
    \ z);      n6 ];\n```\n\nFinally, we write a script to define the initial condition,\
    \ time space and calls the ode45 function to solve the system.\n\nT = [t_0, t_1];\n\
    z0 = [y_10; y_20; ...; y_n0];\n[t, z] = ode45(fp, T, T0);\n\nThe ode45 function\
    \ discretizes the time space [t_0,t_1] into m (not equidistant) points and returns\
    \ the result in f. Also, the matrix z is of type (m+1)×(n+1). The first column\
    \ of z (z:,1) is the solution vector y1, the second column z(:,2) is the solution\
    \ vector y2, ...etc.\n\n# Example 7.7 Using MATLAB, solve:\n\n```\nS'(t) = -0.031S+0.02R,\
    \ S(0) = 0.85, t ∈ [0,300]\nI'(t) = 0.031S-0.01I, I(0) = 0.15, t ∈ [0,300]\nR'(t)\
    \ = 0.01I-0.02R, R(0) = 0, t ∈ [0,300]\n```\n\nWe define a function SIRSSlope\
    \ to evaluate the right-hand sides of the system equations.\n\n```\n% SIRSSlope\n\
    function z = SIRSSlope(t, x)\ns = x(1); I = x(2); R = x(3);\nz = [-0.03*S+0.02*R;\
    \ 0.03*S-0.01*I; 0.01*I-0.02*R];\n```\n\nWe write a script 'SolveSIRS.m' to implement\
    \ the solver:\n\n```\n% SolveSIRS.m\nclear; clc;\ntspan = [0, 300];\nz0 = [0.85;\
    \ 0.15; 0];\n[t, z] = ode45(@SIRSSlope, span, z0);\ns = z(:,1); I = z(:,2); R\
    \ = z(:,3);\nplot(t, S, '-b', t, I, ':r', R, '-m', 'LineWidth', 2);\ngrid on;\n\
    label('Time');\n```"
