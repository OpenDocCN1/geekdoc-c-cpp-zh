  md: '# Numerical Differentiation and Integration


    Unlike Newton-Cotes methods, a Gauss integration method does not determine the
    positions of the interpolation points $x_j, j=1,\dots,n$ in $[a,b]$, nor the corresponding
    weights $w_j$ with the purpose of finding a quadrature that is exact for polynomials
    of degree up to $2n-1$ [47]. In other words, the derivation of a Gauss quadrature
    is based on finding the set of points locations (Gauss points) and corresponding
    weights such that the quadrature is exact for polynomials of degree $2n-1$ or
    less.


    All Gauss points lie in the interval $[-1,1]$, therefore the first step to start
    from is to use a variable transform


    ```

    $x = \frac{b-a}{2}s+\frac{b+a}{2},-1\le s\le 1$$

    ```


    to convert the integral problem from


    ```

    $I = \int_a^b f(x)dx$$

    ```


    into the form


    ```

    $I = \frac{b-a}{2}\int_a^b (\frac{b-a}{2}s+\frac{b+a}{2})ds.$

    ```


    Through this variable transform, the point $x=a$ is mapped into $s=-1$ and $x=b$
    to $s=1$. Values $a<x<b$ are mapped to $-1<s<1$.\nThe next step is to choose a
    positive integer $n$ and assuming that $f(x)$ is a polynomial of degree $2n-1$.
    That is:


    ```

    $f(x)=c_0+c_1x+\dots+c_{2n-1}x^{2n-1},\quad(6.20)$

    ```


    where $c_1,\dots,c_{2n-1}$.\nThe purpose is to find optimal sets of points $a\le
    x_1<\dots<x_n\le b$ (through $-1\le s_1\le s_2<\dots<le s_{n-1}<le s_n\le 1$)
    and weights $w_1,w_2,\dots,w_n$ such that


    ```

    $$\int_a^b f(x)dx=\frac{b-a}{2}\int_{-1}^1 (\frac{b-a}{2}s+\frac{b+a}{2})ds\approx\sum_{j=1}^n
    w_j(\frac{b-a}{2}s_j+\frac{b+a}{2})\quad(6.21)$

    ```


    is exact for $f(x)=c_0+c_1x+\dots+c_{2n-1}x^{2n-1}$\nIntegrating (6.20) from $a$
    to $b$ gives:


    ```

    $$\int_a^b f(x)dx=\int_a^b (c_0+c_1x+\dots+c_{2n-1}x^{2n-1})dx\n=c_0(b-a)+c_1\frac{b^2-a^2}{2}+\dots+c_{2n-1}\frac{b^2-a^{2n}}{2n}\quad(6.22)$

    ```


    From Equation (6.20):


    ```

    $f(x_j)=c_0+c_1x_j+\dots+c_{2n-1}x_j^{2n-1},\j=1,\dots,n$$

    ```'
