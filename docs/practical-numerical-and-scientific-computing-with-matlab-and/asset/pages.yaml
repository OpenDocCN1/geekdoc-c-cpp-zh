    # 9.7 Solving Quadratic Programming Problems


    A quadratic programming problem is an optimization problem whose objective function
    is quadratic and constraints are linear. A general form of a quadratic programming
    problem is:


    $$\min \frac{1}{2}x^T Hx + \alpha^T x, H \in \mathbb{R}^{n \times n}, \alpha,
    x \in \mathbb{R}^n \quad (9.9)$


    together with the linear equality constraints described by (9.2) and linear inequality
    constraints described by Equation (9.3).


    Through this section, solution of quadratic programming problem described in the
    following example will be considered:'
