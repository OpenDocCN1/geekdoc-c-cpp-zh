    The second-order sufficient condition for $(x^*, \lambda^*)$ to be optimal is:


    ```

    $$\nabla_{xx}^2 L(x^*, \lambda^*) = \nabla^2 f(x^*) + \sum_{j=1}^p \lambda_j^*
    \nabla^2 E(x^*) = \mathbf{H}(x^*) \in \mathbb{R}^n \quad (10.13)$

    ```


    be positive-definite.


    If $\nabla_x E^T(x) \in \mathbb{R}^{n \times p}$ is a full-rank matrix, then it
    has $QR$ factorization of the form


    ```

    $$\nabla E^T(x) = [\mathbf{Q} \quad \mathbf{Z}] \quad \begin{bmatrix} \mathbf{R}
    \ \mathbf{0} \end{bmatrix}$

    ```


    where $\mathbf{Q} \in \mathbb{R}^{n \times p}, \mathbf{Z} \in \mathbb{R}^{n \times
    (n-p)}, \mathbf{R} \in \mathbb{R}^{p \times p}$ and $\mathbf{0}$ is a matrix of
    zeros of type $(n-p) \times p$. The matrix $\mathbf{Q}$ is a basis for the column
    space of $\nabla_x E^T(x)$, whereas $\mathbf{Z}$ is a basis for its null space.


    At the optimum solution $x^*$, the gradient of the objective function is orthogonal
    to the constraint surfaces. This is the projection of the gradient vector onto
    the constraint surface. This can be expressed as $Z^{*T} \nabla f(x^*) = 0$, which
    is equivalent to the first order necessary conditions (10.11). The second order
    necessary conditions for $(x^*, \lambda^*)$ are equivalent to (10.12) $Z^{*T}
    H Z^*$ be positive semi-definite, and the second order sufficient condition of
    optimality of $(x^*, \lambda^*)$ that is equivalent to (10.13) $Z^{*T} H Z^*$
    be positive [20].


    The Newton''s method iterates to find a couple $(x^*, \lambda^*) \in \mathbb{R}^{(n-p)
    \times p}$ such that the necessary conditions (10.11 and 10.12) are fulfilled.
    At iteration $k$, the Karush-Kuhn-Tucker (KKT) system is composed from a previously
    computed couple $(x^{(k)}, \lambda^{(k)})$ to solving


