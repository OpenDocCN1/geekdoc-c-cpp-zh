  md: '# 10

    Solving Optimization Problems: Nonlinear Programming


    # Abstract


    Nonlinear programming problems are divided into two kinds of problems: unconstrained
    and constrained [19, 20]. An unconstrained optimization problem is a problem of
    the form


    ```

    $$\min f(\mathbf{x}), \quad \mathbf{x} = [x_1, x_2, \dots, x_n]^T \in \mathbb{R}^n$$\quad
    (10.1)

    ```


    A general constrained optimization problem consists of the objective function
    in Equation (10.1) with equality constraints:


    ```

    $$E(\mathbf{x}) = 0,$\quad (10.2)

    ```


    and inequality constraints:


    ```

    $$I(\mathbf{x}) \le 0$\quad (10.3)

    ```


    where $\mathbf{x} \in \mathbb{R}^n, E(\mathbf{x}) \in \mathbb{R}^p$ and $I(\mathbf{x})
    \in \mathbb{R}^q$.


    In this chapter, methods for solving both unconstrained and constrained optimization
    problems using MATLAB\® and Python will be implemented.


    # 10.1 Solving Unconstrained Problems


    In this section, problem (10.1) is considered. If $\mathbf{x}^* = [x_1^*, x_2^*,
    \dots, x_n^*]^T \in \mathbb{R}^n$ then the optimal solution of the problem, then


    ```

    $$g(\mathbf{x}^*) = \mathbf{0}$\quad (10.4)$$n$\mathbf{y}^T \mathbf{H}(\mathbf{x}^*)
    \mathbf{y} \ge 0, \quad \forall \mathbf{y} \in \mathbb{R}^n,\quad (10.5)

    ```


    261'
