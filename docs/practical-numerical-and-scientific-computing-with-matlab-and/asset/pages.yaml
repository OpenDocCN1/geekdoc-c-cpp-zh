    # 10.2 Solving Constrained Optimization Problems


    At the beginning an optimization problem with equality constraints is considered.
    The form of the problem is:


    min f(x), \quad x \in \mathbb{R}^n \quad (10.8)


    subject to the equality constraints:


    E(x) = 0 \quad (10.9)


    where \E \in \mathbb{R}^p, p \leq n.

    To derive the necessary and sufficient optimality conditions, construct the Lagrangian
    system:


    L(x) = f(x) + E^T(x)\lambda \quad (10.10)


    with \lambda \in \mathbb{R}^p is the vector of Lagrange multipliers. Then, the
    first-order necessary conditions for x* to be optimal:


    ```

    \nabla_x L(x^*, \lambda^*) = 0 = \nabla_x f(x^*) + \nabla_x E^T(x^*)\lambda^*\n\nabla_lambda
    L(x^*, \lambda^*) = 0 = E(x^*) \quad (10.11)

    ```


    where \nabla_x E(x) is the Jacobian matrix evaluated at the point x \in \mathbb{R}^n.

    The second-order necessary condition is:


    \nabla_{xx}^2 L(x^*, \lambda^*) = \nabla_{xx}^2 f(x^*) + \sum_{j=1}^p \lambda_j^*
    \nabla_{xx}^2 E(x^*) = \mathbf{H}(x^*) \in \mathbb{R}^n \quad (10.12)


    positive semi-definite.'
