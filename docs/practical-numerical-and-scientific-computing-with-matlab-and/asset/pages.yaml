    print('x = ', x)\nprint('Iterations = ', Iterations)\n```\n\n# 10.1.4 Quasi Newton's\
    \ Methods\n\nThe Newton's method for solving unconstrained Hessian minimization\
    \ problems suffer the problem that the inverse of the Hessian matrix must be evaluated\
    \ at iteration $k$ to find the search direction $p^{(k)}$. When the Hessian is\
    \ illconditioned the search direction will be inaccurate and the iteration process\
    \ could be unsuccessful.\n\nInstead of directly inserting the Hessian matrix,\
    \ the quasi-Newton's methods look for approximations to the Hessian matrix in\
    \ the different iterations. Therefore, $H^{(k)}$ is replaced by a positive definite\
