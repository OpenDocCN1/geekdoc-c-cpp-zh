    # 1.2.2 Gauss and Gauss-Jordan Elimination


    Gauss and Gauss-Jordan elimination methods are related to each other. If given
    a matrix $A \in R^{n \times n}$, then both Gauss and Gauss-Jordan perform elementary
    operations through consequent steps over matrix $A$. The Gauss method stops after
    obtaining the row echelon form of matrix $A$ (If $A$ is non-singular, its row
    echelon form is an upper triangular matrix), whereas Gauss-Jordan continues until
    reaching the reduced row echelon form (If $A$ is nonsingular, its reduced row
    echelon form is the identity matrix). To illustrate the differences between the
    row echelon and the reduced row echelon forms, the two forms are computed for
    the matrix:


    ![](img/9923905aaa045c7096d90695cee3e3bc_27_0.png)


    By finding the row echelon form for the given matrix.


    ![](img/9923905aaa045c7096d90695cee3e3bc_27_1.png)'
