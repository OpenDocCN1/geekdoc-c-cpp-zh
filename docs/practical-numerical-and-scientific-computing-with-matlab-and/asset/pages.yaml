    The system may be subject to continuous state inequality constraints


    $$\mathbf{I}(t, \boldsymbol{x}(t)) \le 0, \quad \forall t \in [t_0, t_f].$\quad
    (11.4)$


    and equality constraints


    $$\mathbf{E}(t, \boldsymbol{x}(t)) = 0, \quad \forall t \in [t_0, t_f].$\quad
    (11.5)$


    It is subject to terminal conditions:


    $$\psi(t_f, \boldsymbol{x}(t_f)) = 0,\quad (11.6)$


    where $\boldsymbol{x}(t) = [x_1(t), \dots, x_n(t)]^T \in R^n$ is the state vector
    and $\boldsymbol{u}(t) = [u_1(t), \dots, u_m(t)]^T \in R^m$ is the control vector.


    The terminal term $t_f$ is a fixed positive number. $\mathcal{U}$ is the class
    of all piecewise continuous functions $\boldsymbol{u}(t)$ defined on $[t_0, t_f]$,
    with $a_i \le u_i(t) \le b_i, a_i, b_i \in R$.


    The function $f: R \times R^n \times R^m \to R^m$


    The term $\varphi(\boldsymbol{x}(t))$ in equation (11.1) is called the Mayer part,
    and the integral term of Equation (11.1) is called the Bolza part. A cost function
    could consist of only a Mayer part, only a Bolza part or a combination of both
    [10].


    # 11.2 The First-Order Optimality Conditions and Existence Of Optimal Control


    Notation: Throughout the chapter, we will use the following notations: $L_0[t]
    \equiv L_0(t, \boldsymbol{x}(t), \boldsymbol{u}(t))$ and $f[t] \equiv f(t, \boldsymbol{x}(t),
    \boldsymbol{u}(t))$.


    The Hamiltonian for problem (11.1)-(11.6) is given by


    $$\mathcal{H}(t) = \mathcal{H}(t, \boldsymbol{x}, \boldsymbol{u}, \boldsymbol{p})
    = \boldsymbol{p}(t)^T \boldsymbol{f}[t]$


    then, the augmented cost can be written as:


    $$\J(\boldsymbol{u}) = \varphi(t_f, \boldsymbol{x}(t_f)) + \boldsymbol{

    u}^T \Psi(t_f, \boldsymbol{x}(t_f)) + \int_{t_0}^{t_f} [\mathcal{H}[t] - p(t)^T
    \boldsymbol{f}(t)]dt$$


    The first-order necessary conditions for the optimality are found by applying
    the variational principle to the augmented cost function, also referred to as
    Lagrangian [24, 11]. The augmented cost function is given by


    $$\J(\boldsymbol{u}) = \varphi(t_f, \boldsymbol{x}(t_f)) + \boldsymbol{

    u}^T \Psi(t_f, \boldsymbol{x}(t_f)) + \int_{t_0}^{t_f} [L_0[t] + \boldsymbol{p}(t)^T
    (\boldsymbol{f}[t] - \dot{x}(t))]dt$\quad (11.7)$


