  md: "# Solving Unconstrained Problems\n\n(ii) **Search direction problem:** given\
    \ a unit vector $p^{(k)}$, such that $f(x^{(k)} + \\alpha p^{(k)})$ is a decreasing\
    \ function at iteration $k$, find a step size $\\alpha$ for $0 < \\alpha < \\\
    alpha_{max}$. That is $p^{(k)}$ is a **descent direction.**\n\nThe numerical optimization\
    \ methods differ from each other by the methods through which the search directions\
    \ are determined and the gradient vector and Hessian matrices are approximated\
    \ and (or) updated.\n\n# 10.1.1 Line Search Algorithm\n\nThere are two kinds of\
    \ line search algorithms: *exact line search* and *ineact line search*. The exact\
    \ line search algorithm looks for the exact size $\\alpha = (\\alpha_{Exact})$\
    \ that\n\n$$\\alpha_{Exact} = \\arg\\min_{\\alpha>0}f(x^{(k)} + \\alpha p^{(k)}\\\
    }$\n\nwhich is numerically inaccurate. The inexact line search algorithms looks\
    \ for approximations for the exact step size $\\alpha_{Exact}$. This is done iteratively,\
    \ starting from an initial guess $\\alpha^0$ and constructing a sequence of step\
    \ sizes $\\alpha^0, \\alpha^1, ..., \\alpha^k$ such that $\\alpha^k \\approx \\\
    alpha_{Exact}$ [49].\n\nThe most inexact line search algorithm is the *backtracking\
    \ line search algorithm*, which employs two parameters $a$ and $b$ and is based\
    \ on Armijo condition:\n\n$f(x^{(k)}) + \\alpha p^{(k)}) > f(x^{(k)}) + \\alpha\
    \ a^k g(x^{(k)})Tp^{(k)}$\n\nThe parameter $a$ is associated with the termination\
    \ condition of Armijo. The parameter $0 < b < 1$ is used to update the step size\
    \ in each iteration, where $\\alpha^j = b\\alpha^{j-1}$, starting from a large\
    \ step $\\alpha^0$ (usually 1).\n\nThe MATLAB function **LineSearch** receives\
    \ a function $f$, a vector $g$ representing the gradient of $f$ the starting vector\
    \ $x$ and a unit (direction) vector $p$ and returns the optimal step size $\\\
    alpha$:\n\n```\nfunction alpha = LineSearch(f, g, x, p)\na = 0.3; b = 0.9;\nalpha\
    \ = 1.0;\nwhile f(x+alpha*p) > f(x) + a*alpha*g(x)'*p\nalpha = b*alpha;\nend\n\
    ```\n\nThe Python code of the function LineSearch.py is:\n\n```\nimport numpy\
    \ as np\ndef LineSearch(f, g, x, p):\nab, b = 0.3, 0.9\nalpha = 1.0\nwhile f(x+alpha*p)\
    \ > f(x) + a*alpha*np.dot(g(x), p):\n  alpha = b*alpha\n```"
