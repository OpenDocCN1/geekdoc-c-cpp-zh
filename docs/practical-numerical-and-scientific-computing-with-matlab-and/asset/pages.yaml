    # 10.1.4.2 The Davidon-Fletcher-Powell (DFP) Algorithm


    The Davidon-Fletcher-Powell (DFP) method has a close form as the BFGS to update
    the approximate Hessian matrix. At iteration k, the vectors $s^{(k)}$ and $y^{(k)}$
    are computed the same way as in the BFGS algorithm. For formulating the Hessian
    matrix $H^{(k+1)}$, vectors $y^{(k)}$ and $s^{(k)}$ of the BFGS method exchange
    their role in the DFP method [3, 20]. The formula of updating the Hessian matrix
    at iteration k is


    ```

    $H^{(k+1)} = H^{(k)} - \frac{s^{(k)}(s^{(k)})^T}{y^{(k)T s^{(k)}} + \frac{y^{(k)}(y^{(k)})^T
    H^{(k)}}{y^{(k)T H^{(k)} y^{(k)}}$

    ```


    **Example 10.2** In this example, the DFP method will be implemented to minimize
    the quadratic function


    $f(x_1, x_2, x_3) = (x_1-2)^2 + (1-x_3)^2+x_2^2+1$


    The Python code is:


