    A point $t_{i,i=0, \dots, N}$ in a switching interval $[s_k, s_{k+1}]$ where $k
    = [i/h_c]$. Hence,


    ```

    $u_j(t_i) = v_j^k \text{ and } x_m(t_i) = x_m^i.$

    ```


    Now, the control $u_j(t), t \in [t_0, t_f]$ is given by The Mayer part of the
    objective function $\varphi(x(t_f))$ is evaluated at the time $t_N$. i.e. $\varphi(x(t_f))
    = \varphi(x(t_N))$. We use Simpson''s quadrature to approximate the Bolza part
    of the objective function, provided that $N$ is an integer.


    ```

    $L_0^i = L_0(x(t_i), u(t_i)) = L_0(x(t_i), v^k), k = [i/h_c],$

    ```


    then,


    ```

    $\int_{t_0}^{t_f} L_0(x(t), u(t)) dt \approx \frac{h}{2}(L_0^0 + L_0^N) + \frac{4h}{3}\sum_{i=1}^{\lfloor\frac{N}{2}\rfloor}
    L_0^{2i-1} + \frac{2h}{3}\sum_{i=1}^{\lfloor\frac{N}{2}\rfloor} L_0^{2i}$

    ```


    The objective function is approximated by


    ```

    $J(u(t)) \approx \varphi(x^N) + \frac{h}{3}(L_0^0 + L_0^N) + \frac{4h}{3}\sum_{i=1}^{\lfloor\frac{N}{2}\rfloor}
    L_0^{2i-1} + \frac{2h}{3}\sum_{i=1}^{\lfloor\frac{N}{2}\rfloor} L_0^{2i}$ (11.30)

    ```


    The equality constraints (11.29):


    ```

    $E(x^i) = 0, \quad 0 \leq i \leq N$ (11.31)

    ```


    The inequality constraints (11.28):


    ```

    $I(x^i) \leq 0, \quad 0 \leq i \leq N$ (11.32)

    ```


    The classical fourth-order Runge-Kutta method is used for the discretization of
    the state equations as follows:


    ```

    $\mathbf{k}_1 = \mathbf{f}(x^i, u^i)\n\mathbf{k}_2 = \mathbf{f}(x^i + hk_1/2,
    u^{i+\frac{h}{2}})\n\mathbf{k}_3 = \mathbf{f}(x^i + hk_2/2, u^{i+\frac{h}{2}})\n\mathbf{k}_4
    = \mathbf{f}(x^i + hk_3, u^{i+1})\nx^{i+1} = x^i + \frac{h}{6}(\mathbf{k}_1 +
    2\mathbf{k}_2 + 2\mathbf{k}_3 + \mathbf{k}_4)$ (11.33)

    ```


    where $u^{i+\frac{h}{2}} = u(t_i + h/2)$ can be approximated from some interpolation
    method, such as the piecewise cubic Hermite interpolating polynomials.'
