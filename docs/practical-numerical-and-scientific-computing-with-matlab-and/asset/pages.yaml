    p[0] = 0.5

    for j in range(N):

    np[j+1] = (1.0+h*p[j])/(1+h*p[j])

    plt.subplot(2, 2, k)

    plt.plot(t, p, color=''blue'', label=''h = ...'')

    plt.legend()

