  md: "# The Iterative Methods\n\nMultiplying the linear system $Ax = b$ by $w$ and\
    \ replacing $A$ by $U+D+L$ gives\n\n> $(\\omega U+\\omega D+\\omega L)x = \\omega\
    \ b = (\\omega U+(1-\\omega)D+\\omega L)x = \\omega b$\n\nfrom which,\n\n> $(D+\\\
    omega L)x = ((1-\\omega)D-\\omega U)x + \\omega b$\n\nThe iterative method is\
    \ obtained by replacing $x$ at the left-hand side by $x^{(k+1)}$ and by $x^{(k)}$\
    \ at the right-hand side, giving the formula\n\n> $(D-\\omega L)x^{(k+1)} = ((1-\\\
    omega)D-\\omega U)x^{(k)} + \\omega b$\n\nWhen $\\omega < 1$, the iterative method\
    \ in (2.7) is under relaxation method. When $\\omega = 1$ the method is identical\
    \ to Gauss-Seidel iteration, and when $\\omega > 1$ (2.7) is over-relaxation method.\
    \ In the latest case ($\\omega$), the resulting method is called the successive-relaxation\
    \ method and is abbreviated as SOR.\n\nBy writing $S_\\omega = D-\\omega L, T_\\\
    omega = (1-\\omega)D+\\omega U, B_\\omega = S_\\omega^{-1}T_\\omega$ and $c_\\\
    omega = S_\\omega^{-1}b$, the SOR iterative method is\n\n> $x^{(k+1)} = B_\\omega\
    \ x^{(k)} + c_\\omega$\n\nThe MATLAB function SOR receives a matrix $A$, a vector\
    \ $b$, an initial starting vector $x0$, a real value $\\omega$ and a tolerance\
    \ $\\varepsilon$, and returns an approximate solution of the system $Ax=b$ within\
    \ the given tolerance together with the number of iterations.\n\n```\nfunction\
    \ [x, Iters] = SOR(A, b, w, x0, Eps)\nD = diag(diag(A));\nL = tril(A) - D; U =\
    \ A - (L+D);\nB = -(D-wL)*((1-w)D+wU); c = (D+wL)\bb;\niters = 1;\nx = B*x0 +\
    \ c;\nwhile norm(x-x0) > Eps\nx0 = B*x0 + c;\niters = Iters + 1;\nend\n```\n\n\
    Applying the above code to examples 2.1 and 2.2:\n\n```\n>> A = [2 -1 1; -2 5\
    \ -1; -1 2 4]; b = [-1;1;3];\n>> x0 = [1.; 1.; 1.]; w = 1.25; Eps = 1e-8 ;\n>>\
    \ [x, Iters] = SOR(A, b, w, x0, Eps)\n```\n\n```\nx =\n1.0000\n```"
