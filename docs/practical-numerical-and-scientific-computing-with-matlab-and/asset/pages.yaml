    6     h = (b-a)/N

    7     P = zeros((N+1), ''float'')

    8     P[0] = P0

    9     for j in range(N):

    10        P[j] = P[j]+h*/2*f(t[j], P[j])

    11        P[j+1] = P[j]+h*f(t[j]+h/2, P[j])

    12    return t, P, P-Pect, inf

