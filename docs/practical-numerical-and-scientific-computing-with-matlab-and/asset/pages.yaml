    $$w_1 = \frac{b-a}{1}$$

    $$$w_1 x_1 = \frac{b^2-a^2}{2}$$

    ```


    Solving this system of equations gives:


    ```

    $$w_1 = b-a$ and $x_1 = \frac{b+a}{2}$.$

    ```


    The Gauss quadrature is:


    ```

    $$\int_a^b f(x)dx = (b-a)f(\frac{b+a}{2}) (6.25)$$

    ```


