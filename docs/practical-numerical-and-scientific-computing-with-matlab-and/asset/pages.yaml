  md: "# 76 Ill-Conditioning and Regularization Techniques\n\n(3) the computed solution\
    \ $x^*$ is stable. This is characterized by the existence of $\\mathbf{F}^{-1}$.\n\
    \nProblem (3.5) is a well-posed problem if conditions (1)-(3) are satisfied. It\
    \ is an ill-posed problem if it is not a well-posed problem.\n\nIn real life,\
    \ the data $\\mathbf{y}$ is usually obtained from measurements which are contaminated\
    \ by small errors [42]. Solving the noisy data in an ill-posed system will result\
    \ in a catastrophic erroneous solution which is irrelevant to the true solution,\
    \ as had seen in the previous section.\n\nTo find an interpretation to what is\
    \ going behind, one should consider the singular value decomposition of the matrix\
    \ $\\mathbf{F}$. Let $(\\mathbf{U}, \boldsymbol{\\Sigma}, \\mathbf{V}^T)$ be the\
    \ singular value decomposition of the matrix $\\mathbf{F}$, where $\\mathbf{U}\
    \ \\in \\mathbb{R}^{m \times m}$ and $\\mathbf{V} \\in \\mathbb{R}^{n \times n}$\
    \ are two unitary matrices and $\boldsymbol{\\Sigma} \\in \\mathbb{R}^{m \times\
    \ n}$ is a diagonal matrix. The inverse of matrix $\\mathbf{F}$ is given by $\\\
    mathbf{F}^{-1} = (\\mathbf{U}\boldsymbol{\\Sigma}\\mathbf{V}^T)^{-1} = \\mathbf{V}\b\
    oldsymbol{\\Sigma}^{-1}\\mathbf{U}^T$. Now the solution $\\mathbf{x}$ of the linear\
    \ system $\\mathbf{F}\\mathbf{x}=\\mathbf{y}$ is given by\n\n```\n$$\\mathbf{x}\
    \ = \\mathbf{F}^{-1}\\mathbf{y} = \\sum_{i=1}^n \\frac{(\\mathbf{U}_i^T\\mathbf{y})}{\\\
    sigma_i}\\mathbf{V}_i \\quad (3.8)$\n```\n\nwhere $\\mathbf{U}_i^T$ and $\\mathbf{V}_i$\
    \ are the $i^{th}$ columns of the matrices $\\mathbf{U}$ and $\\mathbf{V}$, and\
    \ the $\\sigma_i$'s are the singular values of $\\mathbf{F}$, $i=1, \\dots, m$,\
    \ with $\\sigma_1 \\geq \\sigma_2 \\geq \\dots \\geq \\sigma_n \\geq 0$.\n\nTherefore,\
    \ the solution $\\mathbf{x}$ is a linear combination of $\\{\\mathbf{V}_1, \\\
    dots, \\mathbf{V}_n\\}$, the columns of $\\mathbf{V}$, with coefficients $\\frac{\\\
    mathbf{U}_i^T\\mathbf{y}}{\\sigma_i}, i=1, \\dots, n$.\n\nWhen the noisy data\
    \ $\\mathbf{y}^e$ is used instead of the exact data $\\mathbf{y}$, we get given\n\
    \n```\n$$\\mathbf{F}^{-1}\\mathbf{y}^e = \\sum_{i=1}^n \\frac{(\\mathbf{U}_i^T\\\
    mathbf{y})}{\\sigma_i}\\mathbf{V}_i = \\sum_{i=1}^n \\frac{(\\mathbf{U}_i^T\\\
    mathbf{y})}{\\sigma_i}}\\mathbf{V}_i + \\sum_{i=1}^n \\frac{(\\mathbf{U}_i^T\\\
    mathbf{e})}{\\sigma_i}}\\mathbf{V}_i = \\mathbf{x} + \\sum_{i=1}^n \\frac{(\\\
    mathbf{U}_i^T\\mathbf{e})}{\\sigma_i}}\\mathbf{V}_i \\quad (3.9)$\n```\n\nFrom\
    \ equation (3.9), we find that, $||\\mathbf{y}-\\mathbf{x}||^2 = \\sum_{i=1}^n\
    \ |\\frac{(\\mathbf{U}_i^T\\mathbf{e})}{\\sigma_i}|^2$. As the matrix $\\mathbf{F}$\
    \ tends to be singular, some of its singular values tend to zero, and some of\
    \ the coefficients $\\frac{(\\mathbf{U}_i^T\\mathbf{e})}{\\sigma_i}$ gets very\
    \ large. This tells us, that the residual norm is not affected by how small the\
    \ noise is, but by how small a singular value of the matrix $\\mathbf{F}$ is.\n\
    \nAs an explanation, let us look at the singular values of the $20 \\times 20$\
    \ Hilbert matrix:\n\n```\n>> H = hil(20);\n>> [U, S, V] = svd(H);\n>> format short\
    \ en>> D = diag(S)\n1.9071e+00\n```"
