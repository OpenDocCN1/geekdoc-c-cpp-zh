    # 6.2 Numerical Integration


    If $f$ is a function that is defined over a real interval $[a,b]$, then the area
    under the curve of $f$ from $x=a$ to $x=b$ is given by the integral:


    > $I = \int_{a}^{b} f(x)dx$


    If $F(x)$ is the anti-derivative of $f(x)$ in $[a,b]$, then by the fundamental
    theorem of calculus


    > $I = \int_{a}^{b} f(x)dx = F(b) - F(a)$


    However, there are many functions defined over finite intervals whose anti-derivatives
    are unknown, although they do exist. Such examples include:


    > $I_1 = \int_{0}^{\infty} \frac{\sin(x)}{x}dx$


    > $I_2 = \int_{0}^{3} e^{-x^2}dx$


    and'
