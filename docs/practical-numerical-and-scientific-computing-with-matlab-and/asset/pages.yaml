    # 10.1.2 The Steepest Descent Method


    From the elementary calculus, the gradient vector $g(x) = \nabla f(x)$ points
    to the direction of greatest increase in a function of several variables $f(x)$.
    Hence, $-g(x)$ points to the direction of greatest decrease in $f(x)$. Any descent
    direction $p(x)$ makes an acute angle with $-g(x)$. The steepest descent method
    chooses the search direction to be $p(x) = -\frac{g(x)}{\|g(x)\|}$, in the steepest
    descent method the iterative process to progress from a point $x^{(k)}$ to a point
    $x^{(k+1)}$ is given by the formula:


    ```

    $x^{(k+1)} = x^{(k)} - \alpha^{(k)} \frac{g(x^{(k)})}{\|g(x^{(k)})\|}$

    ```


    where $\alpha^{(k)}$ is found from a line search algorithm [20, 49]. For example,
    to minimize


    ```

    $f(x_1, x_2) = x_1^2 - x_1x_2 + 4x_2^2$

    ```


    the gradient at any point $x = [x_1, x_2]^T$ is given by


    ```

    $g(x) = \begin{bmatrix} 2x_1 - x_2 \ -x_1 + 8x_2 \end{bmatrix}$

    ```


    The MATLAB script SolveEwiWithSteepDesc.m finds the minimum of the objective function
    based on the steepest descent method.


    ```

    % SolveEwiWithSteepDesc.m

    2   clear; clf;

    3   f = @(x) x(1)^2-x(1)*x(2) + 4*x(2)^2 - 1;

    4   g = @(x)[2*x(1)-x(2); -x(1)+8*x(2)];

    5   x0 = [1]; Eps = 1e-8;

    6   [Iterations] = Gradf(f, g, x0, Eps);

    7   disp(''optimum = '' ''); disp(x);

    8   disp([''Iterations = '', numstr(Iterations)]);

    9

    10 function [x, Iterations] = Gradf(f, g, x0, Eps)

    11   x = x0;

    12   Iteration = 0;

    13   while norm(g(x), 2) > Eps

    14     p = -g(x)/norm(g(x), 2);

    15     alpha = LineSearch(f, g, x, p);

    16     x = x + alpha * p;

    17     fprintf(''%3i\t%14.9f\t%12.10e\n'', Iterations, f(x),

    18       norm(g(x), 2));

    19     Iterations = Iterations + 1;

    20   end

    ```'
