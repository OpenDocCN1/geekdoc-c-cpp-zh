    Starting from an initial guess $z^0 = (x^0, y^0)^T$, the iterative method is:


    ```

    $z^{(n+1)} = z^{(n)} - J^{-1}(z^{(n)})f(z^{(n)})$\n$ = \begin{pmatrix} x^{(n)}
    \ y^{(n)} \end{pmatrix} - \begin{pmatrix} 2x^{(n)} & 2y^{(n)} \ -2x^{(n)} & 2y^{(n)}
    \ \end{pmatrix}^{-1} \begin{pmatrix} x^{(n)^2 + y^{(n)^2 \ -x^{(n)^2 + y^{(n)^2}
    \end{pmatrix}$

    ```


    The following MATLAB code implements the solution of the above given problem,
    starting from the initial guess $[1,1]^T$.


    ```

    1 % SolveWithJacobi.m

    2 function [z, Iterations] = Newton_sys(f, J, z0, Eps)

    3   IJ = inv(J(z0));

    4   z = z0 - iJ(z0)*f(z0);

    5   Iters = 0;

    6   while norm(z-z0, inf) >= Eps

    7     z = z;

    8     z = z - iJ(z0)*f(z0);

    9     Iters = Iters + 1;

    10  end

    ```


    The execution of the above code, will give the results:


    ```

    >> f = @(z)[z(1)^2 + z(2)^2 - 30; z(1)^2 - z(2)^2 - 24];

    >> J = @(z)[2*z(1), 2*z(2); -2*z(1), 2*z(2)];

    >> z0 = [1; 1];

    >> Eps = 1e-8;

    >> [z, Iterations] = Newton_sys(f, J, z0, Eps);

    >> fprintf(''Iterations: %i\n'', Iterations);

    >> fprintf(''The solution of the system is given: %n\n\t\t\t x1 = %18.15f\n\t\t\t
    x2 = %18.15f\n'', z(1), z(2));

    Iterations = 6

    ```


    The solution of the system is given:


    ```

    x1 = 1.73205080756887

    x2 = 5.196125422706632

    ```


    The Python code for the function SolveWithJacobi is:


    ```

    1 from numpy import array, inf

    2 from numpy.linalg import norm, inv

    3 def SolveWithJacobi(f, J, z0, Eps):

    4   IJ = lambda z: inv(J(z))

    5   z = z0 - IJ(z0)*f(z0)

    6   Iterations = 1

    7   while norm(z-z0, inf) >= Eps:

    8     z0 = z

    9     z = z - IJ(z0)*f(z0)

    10    Iterations += 1

    11  return z, Iterations

    ```'
