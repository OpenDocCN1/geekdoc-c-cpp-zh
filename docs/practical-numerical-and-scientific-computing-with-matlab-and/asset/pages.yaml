    **Example 7.10** In this example, gekko will be used to solve the stiff system
    of differential equations:


    ```

    $$\frac{dy_1(t)}{dt} = -1002*y_1(t) + 1000*y_2^2(t), \ y_1(0) = 1$$

    $\frac{dy_2(t)}{dt} = y_1(t) + y_2*(1+y_2(t)), y_2(0) = 1$

    ```


