    # 11.6 Solving Optimal Control Problems Using Direct Methods


    Direct transcription methods are well-known class for solving optimal control
    problems. Direct transcription methods are also known as discretize optimize methods,
    the problem discretization is a prior stage to the optimization process [10].
    Methods of discretization such as the Runge-Kutta methods [50], splines [24],
    collocation methods [57], etc., are used for the discretization of the state equations,
    whereas some numerical quadrature method such as the trapezoidal rule or the Simpson''s
    rule is used for the evaluation of the objective function.


    One of the efficient direct methods for solving the optimal control problems,
    is the control parameterization technique [58, 59, 60]. In CPT, the time domain
    is partitioned by a number of switching points at which the control variables
    are evaluated, each switching is partitioned by a number of quadrature points
    at which the state variables are evaluated. At each switching, the control variable
    is approximated by a constant or linear-wise continuous function [58].


    At the end of the discretization stage, the optimal control problem is transformed
    into a large or medium scale finite dimensional nonlinear programming problem
    (NLP) [11]. The resulting NLP can be solved by any nonlinear programming software,
    such as the MATLAB''s toolbox [17], the SQP [12], the FSQP [29], etc.'
