    (v) equating the coefficient of $\delta u^T$ to zero, gives the terminal constraints


    ```

    $\Psi(t_f,x(t_f)) = 0 \quad (11.15)$

    ```


    (vi) equating the coefficient of $\delta t_f$ to zeros, gives the condition on
    the Hamiltonian at the terminal time,


    ```

    $$\mathcal{H}[t_f] = - \frac{\partial \varphi(t_f,x(t_f))}{\partial t_f} - \nu^T
    \frac{\partial \Psi(t_f,x(t_f))}{\partial t_f}} \quad (11.16)$

    ```


    Equations (11.11, 11.12, 11.13) define the *Euler-Lagrange equations* [54, 15]
    for the optimal control problems.


