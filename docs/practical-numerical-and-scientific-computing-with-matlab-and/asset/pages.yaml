    equation is said to have numerical instability if there exist solutions to the
    finite difference equation that do not correspond to any of the possible solutions
    of the differential equations. Mickens points to some cases of numerical instability[37].
    These cases are:


    +   (i) Representing a derivative in the differential equation with a discrete
    derivative of higher order. An example to this is when representing the logistic
    model


    ```

    \frac{dP}{dt} = P(1-P), P(0) = P_0

    ```


    using the central difference scheme:


    ```

    \frac{p^{j+1}-p^{j-1}}{2h} = P^j(1-P^j) \Rightarrow p^{j+1} = p^{j-1}+2hP^j(1-P^j).

    ```


    Figure 8.1 shows the solution of the logistic model $P(t)=P(1-P(t)), P(0)=0.5$
    using the central, forward and backward difference schemes. The figure show that
    the solutions obtained by both forward and backward difference schemes have the
    same behavior as the original model, as the central finite difference scheme is
    relative to the exact solution.


    +   (ii) Using the standard denominator function $h$ [40]. The first and second
    derivatives at a point $t_j$ are approximated by:


    ```

    \frac{du(t_i)}{dt} \approx \frac{u(t_i)-u(t_{i-1})}{h} \quad \frac{du(t_i)}{dt}
    \approx \frac{u(t_{i+1})-u(t_i)}{h}\n\frac{d^2u(t_i)}{dt^2} \approx \frac{u(t_{i+1})-2u(t_i)+u(t_{i-1})}{h^2}

    ```


    In many cases, the selection of the classical denominator function is not suitable
    and can lead to numerical instability. To see such example, consider the first
    order IVP:


    ```

    \frac{dy(t)}{dt} = Ay(t)+t,y(0) = 0.

    ```


    The exact solution of this IVP is


    ```

    y(t) = \frac{1}{A^2}(e^{At}-(At+1)).

    ```


    The interval [0,1] is divided into 1000 subintervals, by points $0=t_0<t_1...<t_{1000}=1$
    and each subinterval has a length $h=0.001$. The forward Euler''s method, Implicit
    trapezoidal rule and classical fourth-order Runge-Kutta method will be used for
    solving the given problem at the discrete points for different values of parameter
    $A$. Theoretically, the error of Euler''s method will be of $\mathcal{O}(h)=\mathcal{O}(10^{-3})$,
    the error of the'
