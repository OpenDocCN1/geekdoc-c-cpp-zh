    # 11.5 Solving Optimal Control Problems Using Indirect Methods


    # 11.5.1 Numerical Solution Using Indirect Transcription Method


    Given the Euler-Lagrange equations:


    ```

    $$\frac{\partial\mathcal{H}}{\partial u} = 0$$

    $\dot{x}(t) = \frac{\partial\mathcal{H}}{\partial p} = f(t,x(t),u(t)), \ x(t_0)
    = x_0$$

    $\dot{p}(t) = -\frac{\partial\mathcal{H}}{\partial x}, \ p(T) = p_T$

    ```


    Suppose that Equation 11.22 can be solved such that


    ```

    $u^*(t) = g(x(t),p(t)),$

    ```


    then the following steps can be carried out to find the optimal control and optimal
    trajectory.\n**Step one:** Divide the interval $[t_0, t_f]$ into $N$ equally spaced
    sub-intervals, by the points $s_0 < s_1 < \dots < s_i = s_{i+1}-s_i = \frac{t_f-t_0}{N}$.

    **Step two:** Choose an initial guess $u = u^{(0)}$ for the control $u(t)$, a
    maximum number of iterations $MaxIter$ and a tolerance $\epsilon$.

    **Step three:** repeat until $n=0$.

    **Step five:** solve the state equations (11.20) with initial condition (11.3)
    as follows:


    # Algorithm 1 (Solving state equations)


    5.1 Set $x^{(0)} = x^0$.


    5.2 for $i=0, 1, \dots, N-1$


    5.2.1 advance to $x^{i+1(n)}$ using an integration method of ODEs, as as the fourth-order
    Runge-Kutta method


    ```

    $k_1 = f(s_i, x^{(i)(n)}, u^{(i)(n)})$

    $$k_2 = f(s_i + \frac{h}{2}, x^{(i)(n)} + \frac{hk_1}{2}, u^{(i)(n)} + \frac{hu^{(i+1(n)}}{2})$$

    $$k_3 = f(s_i + \frac{h}{2}, x^{(i)(n)} + \frac{hk_2}{2}, u^{(i)(n)} + \frac{u^{(i+1(n)}}{2})$$

    $$k_4 = f(s_i + h, x^{(i)(n)} + hk_3, u^{(i+1(n)}})$$n$$x^{(i+1(n)} = x^{(i)(n)}
    + \frac{h}{6}(k_1 + 2k_2 + 2k_3 + k_4).$$

    ```'
