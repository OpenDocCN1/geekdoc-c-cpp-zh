    # 2.2.2 The Gauss Integration Method


    On approximating the integral


    ![](img/9923905aaa045c7096d90695cee3e3bc_161_0.png)


    A Lagrange polynomial of degree n that interpolates the integrand function f(x)
    at equally spaced points to derive a Newton-Cotes quadrature. Such as a Newton-Cotes
    quadrature is expected to be exact for a polynomial of degree more than n-1.'
