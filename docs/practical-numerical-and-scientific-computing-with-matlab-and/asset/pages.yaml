    The solution of the above linear system is a fixed point $x^*$, where


    ```

    $x^* = Bx^* + c$

    ```


    The fixed point is approached iteratively, starting from the given initial point
    $x^{(0)}$, by using the iterative relationship:


    ```

    $x^{(k+1)} = Bx^{(k)} + c$

