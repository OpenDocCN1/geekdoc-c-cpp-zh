  md: '# Nonstandard Finite Difference Methods for Solving ODEs


    and $y^j \approx y(t_j)$. Suppose that the solution of the discrete finite difference
    scheme


    ```

    $y^j = G(t_j, h, y^i, y^0, \lambda). \quad (8.4)$

    ```


    According to Mickens [37] Equation (8.3) is an exact finite difference scheme
    of the differential equation if its solution (8.4) is as same as the solution
    of associated differential equation (8.2). That means


    ```

    $y^j = G(t_j, h, y^i, y^0, \lambda) = F(t_j, y(t_j), y^0, \lambda) = y(t_j)$.

    ```


    Mickens [39] described a mechanism to construct finite difference schemes for
    many kinds of models. The idea is to incorporate some qualitative features of
    the solution of the problem into the discrete model. Qualitative features can
    be obtained from the linear part in the model. The nonlinear parts are dealt with
    using the nonlocal approximation techniques.


    # 8.3.1 Exact Finite Difference Schemes for Homogeneous Linear ODEs


    In this section, exact finite difference schemes will be derived for three kinds
    of linear and homogeneous ODEs. They include first order, linear second order
    equation and linear system of first order ODEs.


    # 8.3.1.1 Exact Finite Difference Schemes for a Linear Homogeneous First-Order
    ODE


    Given the initial value problem:


    ```

    $\frac{dy(t)}{dt} = -\alpha y(t), y(0) = y^0$

    ```


    The exact solution of the given IVP is $y(t) = y^0 e^{-\alpha t}$. The bases function
    is $y_1(t) = e^{-\alpha t}$. To determine the exact finite difference scheme of
    the given IVP, consider the determinant:


    | y^j | e^{-\alpha t_j} | y^j | |

    |---|---|---|---|

    | y^{j+1} | e^{-\alpha t_{j+1}} | $=e^{-\alpha t_j}$ $y^{j+1}$ $e^{-\alpha h}$
    | $0 \Rightarrow y^{j+1} = e^{-\alpha h} y^j$ |


    Subtracting $y^j$ from the two sides and multiplying the right-hand side by $\alpha$
    and dividing by $\alpha$ the discrete scheme:


    ```

    $y^{j+1} - y^j = -\alpha \left( \frac{1-e^{-\alpha h}}{\alpha} \right) y^j$

    ```


    from which,


    ```

    $\frac{y^{j+1}-y^j}{\frac{1-e^{-\alpha h}}{\alpha}} = -\alpha y^j$

    ```'
