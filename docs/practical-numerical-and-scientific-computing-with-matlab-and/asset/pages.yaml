  md: '# xiv


    # Preface


    libraries. The MATLAB version used for this book is 2017b and the Python version
    is 3.7.4.


    The book consists of 11 chapters divided into three parts: the first part is concerned
    with discussing numerical solutions for linear and nonlinear systems and numerical
    difficulties facing these types of problems with how to overcome these numerical
    difficulties. The second part deals with methods of completing functions, differential
    and numerical integration, and solutions of differential equations. The last part
    of the book discusses methods to solve linear and nonlinear programming and optimal
    control problems. It also contains specialized software in Python language to
    solve some numerically. These software packages may be downloaded from a third
    party, such as Gecko which is used for the solutions of differential equations
    and nonlinear programming in addition to the optimal controls. Also, the Pulp
    package is used to solve linear programming problems and Pyomo package is used
    for solving linear and nonlinear programming problems. How to install and run
    such a package is also presented in the book.


    What distinguishes this book from many other numerical analysis books is that
    it contains some topics that are not usually found in other books, asstandard
    finite difference methods for solving differential equations and optimal control
    problems. In addition, the book discusses implementations of methods with high
    convergence rates, such as Gauss methods discussed in the numerical differentiation
    and integration, exact finite difference schemes for solving differential equations
    in the nonstandard finite difference Chapter. It also uses python-based software
    for solving some kinds of mathematical problems numerically.


    The parts of the book are separate from each other so that the student can study
    any part of it without having to read the previous parts of that part. exception
    to this is the optimal control chapter in the third part, which requires studying
    numerical methods to solve the differential equations discussed in the second
    part.


    After reading this book and implementing the programs contained on it, a student
    will be able to deal with and solve many kinds of mathematical problems such as
    differential equations, static, and dynamical optimization problems and apply
    the methods to real-life problems.


