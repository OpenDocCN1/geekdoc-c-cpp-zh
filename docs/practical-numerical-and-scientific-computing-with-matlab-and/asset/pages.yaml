  md: '# #7 Solving Systems of Nonlinear Ordinary Differential Equations


    # # Abstract


    Differential equations have wide applications in modelling real phenomena [61,
    62]. Analytical solutions of differential equations can be found for few special
    and simple cases. Hence, numerical methods are more appropriate in finding solutions
    of some differential equations.


    This chapter discusses some of the numerical methods for solving a system of initial
    value problems:


    ```

    $$\frac{dy}{dx} = f(x,y), y(a) = y_0,$ \quad (7.1)$

    ```


    where $y: R \to R^n, f: R \times R^n \to R^n$ and $x \in [a,b]$. Here, we assume
    that the functions $f_j(x,y)$ are Lipschitz continuous in $[a,b]$ for all $j=1,...,n$
    and at least one function $f_k(x,y)$ is nonlinear for some $k \in \{1, 2, \dots,
    n\}$.


    It is divided into five sections. The second and third sections discuss the general
    idea of Runge-Kutta methods, explicit and implicit methods. The fourth section
    discusses the MATLAB^{\circledR}$ built-in functions for solving systems of differential
    equations. The fifth section discusses the scipy functions and gekko Python methods
    for solving initial value problems.


    # # 7.1 Runge-Kutta Methods


    An M-stage Runge-Kutta method for solving Equation (7.1), is any numerical method
    characterized by a triplet $A=(a)_{ij} \in R^{M \times M}, b=(b_i) \in R^M$ and
    $\mathbf{c}=(c_i) \in R^M, i=1,...,M$ [13]. The triplet $(A,b,c)$ satisfies the
    Butcher array


    | | $c_1$ | $a_{11}$ | | $a_{1M}$ |

    |---|---|---|---|---|

    | | $A$ | | | | |

    | $b^T =$ | $c_M$ | $a_{M1}$ | | $a_{MM}$ |

    | | | $b_1$ | ... | $b_M |'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Solving Systems of Nonlinear Ordinary Differential Equations


    The parameters $c_j, j=1, \dots, M$ are such that $0 \leq c_1 \leq c_2 \leq \dots
    \leq c_M \leq 1$.

    The parameters $a_{ij}, i, j=1, \dots, M$ satisfy


    ```

    $$\sum_{j=1}^{M} a_{ij} = c_i,$$

    ```


    the parameters $b_i, i=1, \dots, M$ satisfy


    ```

    $$\sum_{i=1}^{M} b_i = 1$$

    ```


    An $M$-stage Runge-Kutta method, for solving (7.1) is described below.

    Divide the interval $[a,b]$ into $N$ sub-intervals $[x_i, x_{i+1}], i=0, \dots,
    N$, each of length $h_i = x_{i+1}-x_i$. Then, $a=x_0 < x_1 < \dots < x_N=b$.

    Given $y(x_i)$, we compute $y(x_{i+1})$, by integrating equation (7.1) on $[x_i,
    x_{i+1}]$, as


    ```

    $$\y(x_{i+1}) = y(x_i) + \int_{x_i}^{x_{i+1}} f(x, y(x))dx,\ (7.2)$

    ```


    $i=0, \dots, N-1$.

    On each sub-interval $[x_i, x_{i+1}]$ let $x_i^{(j)} = x_i + c_j h_i$ for $j=1,
    \dots, M$. The slope then evaluated as $f(x_i^{(j)}, y(x_i^{(j)}))$, and the weighted
    sum of the slope over the sub-interval $[x_i^{(j)}, x_{i+1}^{(j)}]$; $j=1, \dots,
    M$ is given by


    ```

    $$\f(x_i^{(j)}, y(x_i^{(j)})) \approx \sum_{l=1}^{M} a_{jl} h_i f(x_i^{(l)}, y(x_i^{(l)}))$

    ```


    where $\sum_{l=1}^{M} a_{jl} = c_j$. Then


    ```

    $$\y(x_i^{(j)}) = y(x_i^{(1)}) + \int_{x_i^{(1)}}^{x_i^{(j)}} f(x, y(x))dx\\\approx
    y(x_i^{(1)}) + h_i \sum_{l=1}^{M} a_{jl} f(x_i^{(l)}, y(x_i^{(l)}),\ (7.3)$

    ```


    The weighted average of the slope over the interval $[x_i, x_{i+1}]$ is then convex
    combination of the slopes $f(x_i^{(j)}, y(x_i^{(j)})); j=1, \dots, M$, given by


    ```

    $$\sum_{j=1}^{M} b_j f(x_i^{(j)}, y(x_i^{(j)})) \ \sum_{i=1}^{M} b_i = 1$$

    ```


    (7.2) finally becomes


    ```

    $$\y(x_i^{(M)}) \approx y(x_i^{(1)}) + h_i \sum_{j=1}^{M} b_j f(x_i^{(j)}, y(x_i^{(j)})),\
    (7.4)$

    ```'
