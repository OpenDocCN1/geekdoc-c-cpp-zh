    which can be written in the matrix form:


    ```

    $$\frac{dz}{dt} = Az(t) = \begin{bmatrix} a & b \ c & d \end{bmatrix} \begin{bmatrix}
    x(t) \ y(t) \end{bmatrix} \quad (8.5)$

    ```'
