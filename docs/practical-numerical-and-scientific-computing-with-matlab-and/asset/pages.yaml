    # 11.6.1 Statement of the Problem


    In this section we consider an optimal control problem of the form:


    ```

    $\min_{u \in U} \varphi(x(t_f)) + \int_{t_0}^{t_f} L_0(x(t), u(t)) dt$

    ```


    subject to the dynamics:


    ```

    $\dot{x}(t) = f(x(t), u(t)),$

    ```


    with initial conditions


    ```

    $x(t_0) = x^0$,

    ```


    where $x, \varphi : R^n \to R^n, u : R^n \to R^m$ and $x^0 \in R^n$.


    The system is also subject to state inequality constraints:


    ```

    $I(x(t)) \leq 0$

    ```


    and state equality constraints


    ```

    $E(x(t)) = 0$

    ```


    where $I : R^n \to R^p$ and $E : R^n \to R^q$ are differentiable with respect
    to $x$.\nIn the two following sections we describe the solution of optimal control\nproblems
    using **control parameterization technique** (CPT) and imple-\nment it in MATLAB.
    Also, we will discuss the solution of optimal control\nproblems using the Python''s
    **Gekko** package.


    # 11.6.2 The Control Parameterization Technique


    For the discretization of the control variables $u(t)$, let $N_c$ be a positive
    integer\nand $h = \frac{t_f-t_0}{N_c}$ so that $s_0 = t_0 < s_1 < ... < s_{N_c}
    = t_f$ where $s_{i+1} = s_i + h$\\npartition for the interval $[t_0, t_f]$. Let
    us assume that, in an interval $[s_j, s_{j+1}]$, the\nvalue of the control function
    $u_j(t)$ ($i=1, \dots, m$) is a constant ( $u_j(t) = v_j^i$)\nor a linear function
    (i.e. $u_j(t) = a_j^i t + b_j^i$) where $a_j^i$ and $b_j^i$\nare called the control
    parameters. An interval $[s_j, s_{j+1}]$ is called a **switching\ninterval**.
    Hence, there are $N_c$ switching intervals $j=0, \dots, N_c - 1$. For some discussion,
    we assume that in $[s_i, s_{i+1}]$, $u_j(t) = v_j^i$ where $v_j^i$ is a\nstant.


    For the discretization of the state variables, each switching interval\n$[s_i,
    s_{i+1}]$ is divided into $Q$ sub-intervals, where $Q$ is a fixed positive-\nnger.
    The time interval $[t_0, t_f]$ is divided into $N = N_c Q$ subintervals.\n$h =
    (t_f-t_0)/N$ and $t_i = t_0 + ih$ to suppose that the state vari-\n$x_j(t_i)$
    is approximated by the value $x_j$; $j=1, \dots, N$. We also\nnotice that


    ```

    $h = \frac{t_f-t_0}{N} = \frac{t_f-t_0}{N_c Q}$.

    ```'
