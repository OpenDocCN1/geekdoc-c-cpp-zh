    ```

    $\frac{\partial \mathcal{H}}{\partial \mathbf{u}}[s_i] = 0, s_0 \le s_i \le s_{\mathcal{N}}
    \quad (11.18)$

    ```


    +   2.


    ```

    $\begin{cases} \mathbf{p}(s_i) = \mathbf{p}(s_{i+1}) + h \frac{\partial \mathcal{H}}{\partial
    \mathbf{x}}[s_i] + \frac{\partial \mathcal{H}}{\partial \mathbf{x}}[s_{i+1}],
    & s_0 \le s_i \le s_{(\mathcal{N}-1)}N \ \mathbf{p}(s_i) = \mathbf{p}(s_{i+1})
    + h \frac{\partial \mathcal{H}}{\partial \mathbf{p}}[s_i], & s_{(\mathcal{N}-1)}N
    \le s_i \le s_{\mathcal{N}} \end{cases} \quad (11.19)$

