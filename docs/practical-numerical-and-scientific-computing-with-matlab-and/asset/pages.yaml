    # 8.3 Exact Finite Difference Schemes


    Given an initial value problem


    ```

    $\frac{dy}{dt}=f(t,y(t), \lambda), \ y(a)=y^0, t \in[a,b]$

    ```


    where $\lambda$ is the set of model parameters. Suppose that the solution $y(t)$
    of the given initial value problem is


    ```

    $$y(t)=F(t,y(t),y^0, \lambda).$$

    ```


    Let $N$ be a positive integer, $h=\frac{b-a}{N}$ and $t_j=a+jh, j=0,\dots,N$.
    Consider a finite difference scheme


    ```

    $$y^{j+1}=g(h,t_j,y^j, \lambda).$$

    ```'
