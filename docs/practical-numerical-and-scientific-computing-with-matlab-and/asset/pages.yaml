  md: "# Implicit Runge-Kutta Methods\n\nThe first method is the implicit trapezoidal\
    \ method which has the Butcher table:\n\n```\n0 0 0\n1 1/2 1/2\n  1/2 1/2\n```\n\
    \nand has the form:\n\n```\ny^{n+1} = y^n + 1/2 f(t_n, y^n) + f(t_{n+1}, y^{n+1})\n\
    ```\n\nThe implicit trapezoidal method is based on second order.\n\n**Example\
    \ 7.4** In this example, MATLAB and Python programs be used to solve a system\
    \ of two ordinary differential equations, representing two competing species $x(t)$\
    \ and $y(t)$, $t \\in [0,T]$, both are subject to logistic growth, in the absence\
    \ of the other population:\n\n```\ndx(t)/dt = r_1x(t)(1-x(t))-ax(t)y(t), x(0)\
    \ = x_0\ndy(t)/dt = r_2y(t)(1-y(t))-bx(t)y(t), y(0) = y_0\n```\n\nThe MATLAB code\
    \ is\n\n```\n% ITSolCompSpec.m\nclear; clc\nt0 = 0; T = 50; r1 = 0; r2 = 0.3;\
    \ a = 0.2; a = 1.0; b = 0.9;\nf = @(t,z) [0.3*z*(1-z(1))-z(1)*z(2); ...]\n0.2*z*(1-z(2))-0.9*z(1)*z(2)];\n\
    z0 = [0.5 0.5]; Dim = length(z0);\nN = 100*(T-t0);\nt = linspace(t0, T, N+1);\n\
    h = (T-t0)/N;\nEpsilon = 1e-15\nn = length(t);\nz = zeros(Dim, N+1);\nYPrime =\
    \ zeros(n, Dim);\nz(1) = z0;\ni = 1;\nwhile (i <= N)\nk1 = f(t(i), z(i));\nk2\
    \ = feval(f, t(i+1), z(i)+h*k1);\nYPrime(i) = k1;\nyest = z(i) + h*k1;\nz(i+1)\
    \ = yest + h/2.0*(k1+k2);\nwhile(norm(z(i+1)-yest)>Epsilon)\nyest = z(i+1);\n\
    k2 = feval(f, t(i+1),yes);\nz(:, i+1) = z(:, i) + (h/2.0)*(k1+k2);\n```"
