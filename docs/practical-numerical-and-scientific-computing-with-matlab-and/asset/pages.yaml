    $$+ \dots + w_n(c_0 + \dots + c_{2n-1}x_n^{2n-1} + \dots + w_n x_n)$$

    $$= c_0(w_1 + \dots + w_n) + c_1(w_1 x_1 + \dots + w_n x_n)$$

    $$++ \dots + c_{2n-1}(x_1^{n-1} + \dots + w_n x_n^{n-1}) = (6.23)$$

    ```


    Comparing the terms of Equation (6.22) and (6.23) give $2n$ nonlinear equations
    in the $2n$ unknowns $x_j$ and $w_j, j=1, \dots, n$.


    ```

    $$w_1 + w_2 + \dots + w_n = \frac{b-a}{1}$$

    $$$w_1 x_1 + w_2 x_2 + \dots + w_n x_n = \frac{b^2-a^2}{2}$$

    $$$w_1 x_1^2 + w_2 x_2^2 + \dots + w_n x_n^2 = \frac{b^3-a^3}{3} (6.24)$$

    $$$w_1 x_1^{n-1} + w_2 x_2^{n-1} + \dots + w_n x_n^{n-1} = \frac{b^n-a^n}{n}$$

    ```


