  md: "# Numerical Differentiation and Integration\n\n![](img/9923905aaa045c7096d90695cee3e3bc_170_0.png)\n\
    \nFIGURE 6.8: The positions of Legendre-Gauss points for polynomials of degrees\
    \ $n=1,\\dots,10$.\n\nFigure 6.8 shows the distribution of Legendre-Gauss points\
    \ for polynomials of degrees 1 to 10.\n\nHaving the $n$ coordinates of the Legendre-Gauss\
    \ points $x_1,\\dots,x_n$, the corresponding weights $w_1,\\dots,w_n$ can be found\
    \ by solving the linear system:\n\n> $$\\begin{pmatrix} 1 & 1 & \\dots & 1 \\\
    \ x_1 & x_2 & \\dots & x_n \\ x_1^2 & x_2^2 & \\dots & x_n^2 \\ \\vdots & \\vdots\
    \ & \\ddots & \\vdots \\ x_1^{n-1} & x_2^{n-1} & \\dots & x_n^{n-1} \\end{pmatrix}\
    \ \\begin{pmatrix} w_1 \\ w_2 \\ \\vdots \\ w_n \\end{pmatrix} = \\begin{pmatrix}\
    \ 2 \\ 0 \\ \\frac{2}{3} \\ \\vdots \\ \\frac{1-(-1)^n}{n} \\end{pmatrix}$ $\\\
    quad (6.27)$\n\nThe matrix at the left-hand side of Equation (6.27) is the transpose\
    \ matrix of the Vandermonde matrix of type $n \\times n$, constructed from the\
    \ vector of points $x_1,\\dots,x_n$.\n\nThe following Python code (FindLGParams.py)\
    \ includes a function LGpw that receives a parameter $n$ and returns the corresponding\
    \ Legendre-Gauss points and weights.\n\n```\n#FindLGParams.py\n\nfrom scipy.special\
    \ import legendre\nimport numpy as np\n\ndef LGpw(n):\n    s = list(np.sort(np.legendre(n)))\n\
    \    X = (np.fliplr(np.vand(s))).T\n    Y = np.array([(1-(-1)**j)/j for j in range(1,\
    \ n+1)])\n    w = np.linalg.solve(X, Y)\n    return s, w\n```"
