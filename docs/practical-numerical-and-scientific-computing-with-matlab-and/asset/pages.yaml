    # 3.2.2 Tikhonov Regularization Method


    Tikhonov regularization methods are the most well known methods for regularization
    of an ill-conditioned system. A Tikhonov regularization method with a penalty
    is added to a solution with a large norm. If $\varphi(x) = \|Fx-y\|^2$ is the
    square of the length of the residual vector $Fx-y$, the problem is to minimize
    the functional $\varphi\alpha = \varphi(x) = \|Fx-y\|^2 + \alpha\|x\|^2$, where
    the penalty $\alpha\|x\|^2$ is added to penalize the components of the vector
    $x$ on rapid variations from negative values and vice versa.


    We write


    $\varphi\alpha(x) = \langle Fx-y, Fx-y\rangle+\alpha x>=(Fx-y)^T(Fx-y)+\alpha
    x^T x$

    $= x^T(F^TF+\alpha I)x - 2x^T F^Ty + y^T y$


    If the functional $\varphi\alpha(x)$ takes its minimum value at $x=x^\alpha$,
    then

    Now, $F^TF+\alpha I = V(\sigma^2+\alpha)V^T$, then


    ```

    $x^\alpha = \sum_{i=1}^n \frac{\sigma_i}{\sigma_i^2+\alpha}V_i$ (3.11)

    ```


    We consider the term $\frac{\sigma_i}{\sigma_i^2+\alpha}$. For large eigenvalues
    $\sigma_i$, the term $\frac{\sigma_i}{\sigma_i^2+\alpha} \approx \frac{1}{\sigma_i}$,
    and for very small values for $\sigma_i$, $\frac{\sigma_i}{\sigma_i^2+\alpha}
    \approx \frac{\sigma_i}{\alpha}$. Suitable choices for $\alpha$ could reduce the
    high frequencies resulted by the small eigenvalues.'
