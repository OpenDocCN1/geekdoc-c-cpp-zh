    lambda}^* + \\nabla I^T(\\boldsymbol{x}^*)\\boldsymbol{\\mu}^* \\quad (10.16)$\n\
    $\\nabla_{\\boldsymbol{\\lambda}} L(\\boldsymbol{x}^*, \\boldsymbol{\\lambda}^*,\
