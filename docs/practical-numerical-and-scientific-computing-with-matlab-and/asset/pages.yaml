    end{matrix}\\begin{matrix} \\ \\hat{\\alpha}_n = \\int_{a}^{b} x^n f(x)dx \\end{matrix}$\n\
    ```\n\nThe optimal coefficients $\\hat{\\alpha}_0, \\dots, \\hat{\\alpha}_n$ are\
    \ obtained by solving the normal equations (2.24).\n\nWe write a function `FunCoeff`\
    \ that receives a function $f$, limits of an interval $a$ and $b$ and the degree\
    \ of the least-squares approximating polynomial $n$. The function returns a vector\
    \ `alpha` whose components are the optimal coefficients $\\hat{\\alpha}_0, \\\
    dots, \\hat{\\alpha}_n$.\n\nThe MATLAB code of the function `FunCoeff`:\n\n```\n\
    matlab\nfunction alpha = FunCoeff(f, a, b, n)\n    alpha = zeros(n+1);\n    y\
    \ = zeros(n+1, 1);\n    j = 0;\n    while j <= n\n        k = 0;\n        while\
    \ k <= j\n            alpha(j+1, k+1) = (b^(j+k+1)-a^(j+k+1))/(j+k+1);\n     \
    \       k = k + 1;\n        end\n        j = j + 1;\n    end\n```"
