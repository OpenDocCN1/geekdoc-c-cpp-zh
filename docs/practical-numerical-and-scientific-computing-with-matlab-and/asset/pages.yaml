  md: "# Solving Linear Systems with Iterative and Least Squares Methods\n\nconverge\
    \ to the solution of the linear system $x = x^*$. The generated sequence stops\
    \ at some vector $x^{(s)}$ that satisfies:\n\n> $|x^{(s)} - x^{(s-1)}| < \\varepsilon$\n\
    \nwhere $||\\cdot||$ is some norm in $\\mathbb{R}^n$ and $\\varepsilon > 0$ is\
    \ a given tolerance. The solution of the linear system $x^*$ is approximated by\
    \ $x^{(s)}$, that is $x^* \\approx x^{(s)}$. Generally, there are two kinds of\
    \ iterative methods [47]:\n\n+   1. **stationary iterative methods**: at an iteration\
    \ $k$ the iterative method computes $x^{(k)}$ from $x^{(k-1)}$ without referring\
    \ to the previous history. This class of methods includes the Jacobi, Gauss-Seidel\
    \ and relaxation methods.\n\n+   2. **non-stationary iterative methods**: at iteration\
    \ $k$, the iterative method refers to the whole history $x^{(0)}, x^{(1)}, \\\
    dots, x^{(k-1)}$ for the computation of $x^{(k)}$. This class of methods includes\
    \ the conjugate gradient and GMRES subspace methods.\n\nIn this section, three\
    \ stationary iterative methods for solving linear system will be discussed. The\
    \ methods include the Jacobi, Gauss-Seidel and relaxation methods.\n\n# 2.2.1\
    \ The General Idea\n\nGiven the linear system $Ax = b$, $\\varepsilon > 0$ and\
    \ an initial point $x^{(0)}$. The goal is to generate a sequence of vectors in\
    \ $\\mathbb{R}^n$\n\n> $x^{(0)}, x^{(1)}, x^{(2)}, \\dots$\n\nthat converges to\
    \ the solution of the linear system $Ax = b$. That is\n\n> $\\lim_{k \to \\infty}\
    \ x^{(k)} = x^*$\n\nThe generation of sequence stops at some iteration $s$, with\n\
    \n> $|x^{(s)} - x^{(s-1)}| < \\varepsilon$\n\nIn a stationary iterative method,\
    \ the matrix $A$ is expressed as a sum of two matrices $S$ and $T$, that $A =\
    \ S+T$, where $S$ is an invertible matrix. Then, the linear system $Ax = b$ is\
    \ replaced by $(S+T)x = b$ or\n\n> $Sx = b - Tx$\n\nSince $S$ is invertible, we\
    \ multiply the two sides by $S^{-1}$ and obtain a linear system:\n\nwhere $B =\
    \ -S^{-1}T$ and $c = S^{-1}b$."
