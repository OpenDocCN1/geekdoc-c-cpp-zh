    1.00000e+00


    A matrix with a large condition number is ill-conditioned, otherwise, it is well-conditioned
    [7, 6]. The condition number for any singular matrix is $\infty$. For any nonsingular
    matrix, the condition number lies in [1, $\infty$).


    An equivalent measure to condition the condition number $\kappa(A)$ is the reciprocal
    condition number $rcond(A)$,


    > $rcond(A) = \frac{1}{||A||_1 \cdot ||A^{-1}||_1}$$


    Under this measure, the reciprocal condition number of any singular matrix is
    0, for any other nonsingular matrix is in the interval (0.0, 1.0). A matrix $A$
    is closer to singular if $0 \neq \kappa(A) \approx 0$ [42].


    # 3.1.3 Linking the Condition Numbers to Matrix Related Eigenvalues


    If $A$ is a squared $n$ by $n$ matrix with eigenvalues $\{\lambda_1, \dots, \lambda_n\}$,
    then the condition number of matrix $A$ is the ratio between the largest (in magnitude)
    and smallest (in magnitude) eigenvalues. That is:


    > $$\kappa(A) = \frac{\lambda_{max}}{\lambda_{min}}$


    where $\lambda_{max} = \max(|\lambda_j|, j=1, \dots, n)$ and $\lambda_{min} =
    \min(|\lambda_j|, j=1, \dots, n)$.'
