  md: "# Ill-Conditioning in Solutions of Linear Systems 69\n\nBoth MATLAB and Python\
    \ adopt the IEEE double precision numbers as default type of their numerical variables\
    \ with floating points. The smallest binary fraction that can be represented by\
    \ 52 bits is $2^{-52} \\approx 2.2204 \times 10^{-16}$. This number is called\
    \ the machine precision and is denoted by $\\varepsilon$. In MATLAB the machine\
    \ precision can be seen by typing in the window:\n\n```\n>> disp(eps)\n2.2204e-16\n\
    ```\n\nIn Python it can be seen by typing:\n\n```\nIn [35]: print(np.info(float).eps)\n\
    2.22046049250313e-16\n```\n\nIf the fractional part of some floating number requires\
    \ more than 52 bits to be represented, the computer can represent only 52 bits\
    \ of the number and ignores the rest. The difference between the true fractional\
    \ part of the number and the computer representation is called the round off error.\
    \ For example it is well known that $sin\\pi=0, n=0, \\pm1, \\dots$. By Python\
    \ and MATLAB do not give 0 exactly if we choose $n \\neq 0:\n\n```\nIn [36]: np.sin(0.0)\n\
    Out [36]: 0.0\nIn [37]: np.sin(np.pi)\n0\nOut [37]: 1.224464791473532e-16\n```\n\
    \n```\n>> disp(sin(2*pi))\n-2.4493e-16\n```\n\nNow to understand how a shift in\
    \ vector $b$ at the right-hand side of the linear system $Ax=b$, or in matrix\
    \ $A$, can change the solution of the linear system, the properties of matrix\
    \ norm are used to explore such a phenomena.\n\nFirst, it is assumed that the\
    \ right-hand side from $b$ to $b+\\Delta b$ can lead to a change in the solution\
    \ of the system from $x$ to $x+\\Delta x$. Then,\n\n$A(x+\\Delta x)=b+\\Delta\
    \ b \\Rightarrow Ax+A\\Delta x=b+\\Delta b \\Rightarrow A\\Delta x=\\Delta b \\\
    Rightarrow \\Delta x=A^{-1}\\Delta b$\n\nbecause $Ax=b$. Then,\n\n$||b||=\\||Ax||\
    \ \\leq ||A||||x|| \\leq ||A||||Delta x|| = ||A^{-1}|| ||\\Delta b||$, (3.1)\n\
    \nand\n\n$|\\Delta x||=||A^{-1} \\Delta b|| \\leq ||A^{-1}|| ||\\Delta b||$.$,\
    \ (3.2)"
