  md: '# Preface


    The past few decades have witnessed tremendous development in the manufacture
    of computers and software, and scientific computing has become an important tool
    for finding solutions to scientific problems that come from various branches of
    science and engineering. Nowadays, scientific computing has become one of the
    most important means of research and learning in the fields of science and engineering,
    which are indispensable to any researcher, teacher, or student in the fields of
    science and engineering.


    One of the most important branches of scientific computing is a numerical analysis
    which deals with the issues of finding approximate solutions to such problems
    and analyzing errors related to such approximate methods. Both the MATLAB® and
    Python programming languages provide many libraries that can be used to find solutions
    of scientific problems visualizing them. The ease of use of these two languages
    became the most languages that most scientists use to solve scientific problems
    care about.


    The idea of this book came after I took courses of scientific computing for physics
    students, introductory and advanced courses in mathematical software and mathematical
    applications in many Universities in Africa and the gulf area. I also conducted
    workshops for mathematics and science students who are interested in computational
    mathematics in some Sudanese Universities. In these courses and workshops, MATLAB
    and Python were used for the implementation of the numerical approximation algorithms.
    Hence, the purpose of introducing this book is to provide the student with a practical
    guide to solve mathematical problems using MATLAB and Python without the need
    for third-party assistance. Since numerical analysis is concerned with the problems
    of approximation and errors of numerical methods associated with approximation
    methods, this book is more concerned with how these two aspects are applied in
    practice by software, where illustrations and tables are used to clarify approximation
    solutions, errors and speed of convergence, and its relations to some of the numerical
    method parameters, as step size and tolerance. MATLAB and Python are the most
    popular programming languages for mathematicians, scientists, and engineers. Both
    the two programming languages possess various libraries for numerical and symbolic
    computations and data representation and visualization. Proficiency with the computer
    programs contained in this book requires that the student have prior knowledge
    of the basics of the programming languages MATLAB and Python, such as branching,
    Loops, symbolic packages, and the graphical'
  merge: -1
