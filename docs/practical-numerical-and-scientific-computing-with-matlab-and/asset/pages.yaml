    (IV) Dynamical consistency between the solutions of the discrete model and differential
    equation. That means all the properties possessed by the solution of the differential
    equation must be possessed by the solution of the discrete model. Particular properties
    include positiveness, monotonicity, boundedness, limit cycles and other periodic
    solutions, etc.'
