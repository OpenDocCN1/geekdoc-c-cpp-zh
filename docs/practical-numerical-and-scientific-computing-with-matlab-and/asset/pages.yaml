  md: '# Solving Optimal Control Problems Using Direct Methods


    subject to:


    $$\dot{x}(t) = rx(t)\left(1 - \frac{r(t)}{W}\right) - cx(t)y(t)-\alpha(1-q)u(t),x(0)=x_0,t
    \in [0,T]$\$


    $$\dot{y}(t) = y(t)(-\alpha+kbz(t)+kcx(t))-\alpha Ku(t),y(0)=y_0,t \in [0,T]$\$


    $$\dot{z}(t) = ez\left(1 - \frac{z(t)}{V}\right)-by(t)z(t)-\alpha qu(t),z(0)=z_0,t
    \in [0,T]$\$


    where


    $u_{min} \leq u(t) \leq u_{max}$


    The values of model parameters are as follows: $r=1,e=2,a=2.5,b=3.1,b=1.2,c=0.2,\alpha=0.7,q=0.9,k=1.0,V=1000,W=5,K=0.01,T=50$
    and $\xi=0.05,1$


    The Python code:


    ```

    #!/usr/bin/env python3

    from gekko import GEKKO

    import numpy as np

    import matplotlib.pyplot as plt


    r = 1.0; e = 2.5; a = 3.1; b = 1.2; c = 0.2; alpha = 0.7;

    q = 0.9; k = 1.0; V = 1000; W = 5; K = 0.01; D = 0.5;

    T = 50

    t = 0

    n = 300

    m = GEKKO(remote=False)

    time = np.linspace(0, T, N+1)

    x, y, z = m.Var(3.1), m.Var(3.7), m.Var(2.2)

    u = m.Var(lb=0.0, ub=1.0)

    p = m.Var(value=0.0)

    p = np.zeros(N) # mark final time point

    final = m.Param(value=p)

    Equations

    m.Equation(x.dt) = r*(1-x/V)-c*x*y-alpha*(1-q)*u

    m.Equation(y.dt) = y*(-alpha+kbz+kcx)-alpha*Ku*u

    m.Equation(z.dt) = ez*(1-z/V)-by*z-alpha*qu*u

    m.Equation(u.dt) = -z/D*u**2

    m.Obj(z * final) # Objective function

    m.options.ODE = 6 # optimal control mode

    m.solve()

    t = time

    ```


