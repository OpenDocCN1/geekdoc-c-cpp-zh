    Using the first-order differential operator $L = D_1$, equation (3.12) takes the
    form


    ```

    $\varphi_{\alpha}(x) = ||Fx-y||_2^2 + \alpha||D_1x||_2^2 = ||Fx-y||_2^2 + \alpha
    \sum_{i=1}^{m-1} (x_{i+1}-x_i)^2 \quad (3.13)$

    ```


    Using the second-order differential operator $L = D_2$, equation (3.12) takes
    the form


    ```

    $\varphi_{\alpha}(x) = ||Fx-y||_2^2 + \alpha||D_2x||_2^2 = ||Fx-y||_2^2 + \alpha
    \sum_{i=1}^{m-2} (x_{i+2}-2x_{i+1}+x_i)^2 \quad (3.14)$

    ```


    Minimizing $\varphi_{\alpha}(x)$ which appears in equation (3.12) is equivalent
    to solving the normal equations


    ```

    $(F^T F + \alpha L^T L)x^{\alpha} = F^T y \quad (3.15)$

    ```


    Hansen [22] considered the use of generalized singular value decomposition (GSVD)
    to obtain the solution of problem (3.15). The generalized value decomposition
    for a pair $(F, L)$, where $F \in \mathbb{R}^{m \times n}$ and $L \in \mathbb{R}^{p
    \times n}$, with $p \leq n \leq m$ is given by the form


    ```

    $F = U \begin{bmatrix} \Sigma & 0 \ 0 & I_{n-p} \end{bmatrix} X^{-1} \quad L =
    V \begin{bmatrix} M & 0 \ \end{bmatrix} X^{-1} \quad (3.16)$

    ```


    where


    $\Sigma = \begin{bmatrix} \sigma_1 & 0 & \dots & 0 \ 0 & \sigma_2 & \dots & 0
    \ \vdots & \vdots & \ddots & \vdots \ 0 & 0 & \dots & \sigma_p \end{bmatrix},
    \quad M = \begin{bmatrix} \mu_1 & 0 & \dots & 0 \ 0 & \mu_2 & \dots & 0 \ \vdots
    & \vdots & \ddots & \vdots \ 0 & 0 & \dots & \mu_p \end{bmatrix}$


    with $0 \leq \sigma_1 \leq \sigma_2 \leq \dots \leq \sigma_p \leq 1$ and $0 <
    \mu_p \leq \mu_{p-1} \leq \dots \leq \mu_1 \leq 1$ \nThe sets $\{\sigma_i\}$ and
    $\{\mu_i\}$ are normalized such that $\sigma_i + \mu_i = 1$. \nThe solution $x^{\alpha}$
    of equation (3.15) is given by


    ```

    $x^{\alpha} = \sum_{i=1}^{n} (U_i^T y) \frac{\sigma_i}{\sigma_i^2 + \alpha\mu_i^2}
    x_i + \sum_{i=p+1}^{n} (U_i^T y) x_i \quad (3.17)$

    ```'
