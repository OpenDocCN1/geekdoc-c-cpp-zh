  md: '# 3.2 Regularization of Solutions in Linear Systems


    Regularization is the process of stabilizing the solution of an ill-posed problem
    [60, 59, 58]


    ```

    $Fx = y, F \in \mathbb{R}^{m \times n}, x \in \mathbb{R}^n \text{ and } y \in
    \mathbb{R}^m.$

    ```


    The regularization is done through introducing a parametric family of approximate
    inverse operators


    ```

    ${\Gamma_{\alpha} : \mathbb{R}^n \to \mathbb{R}^m : \Gamma_{\alpha} \approx F^{-1},\alpha
    \in (0, \infty)\}$

    ```


    such that, for each $y$ satisfying $\||y-y|| \le \varepsilon$ there exists a $\alpha
    \in (0, \infty)$ such that, $x^\alpha = \Gamma_{\alpha}y \to x$ as $\alpha \to
    0$.


    Some regularization techniques include the truncated SVD method, the Tikhonov
    regularization method, the L-curve method and the Morozov discrepancy principle
    [8, 9].


    In this section we discuss these methods.


    # 3.2.1 The Truncated SVD (TSVD) Method


    Considering the linear system


    ```

    $Fx = b, F \in \mathbb{R}^{n \times n}, x \in \mathbb{R}^n \text{ and } y \in
    \mathbb{R}^n$,

    ```


    and suppose that $U, \Sigma$ and $V$ are the svd factors of matrix $F$, such that
    $F=U\Sigma V^T$. Hence, $F^{-1}=V\Sigma^{-1}U^T$. The unique solution of the linear
    system $fx=b$ is given by:


    ```

    $x = V\Sigma^{-1}U^T = \sum_{j=1}^n \frac{u_j^T}{\sigma_j}v_j = \frac{u_1^T}{\sigma_1}v_1
    + \dots + \frac{u_n^T}{\sigma_n}v_n$

    ```


    where $u_j$ and $v_j$ are the $j^{th}$ columns of $U$ and $V$ respectively, and
    $\sigma_j$ is the $j^{th}$ diagonal element of $\Sigma$, with $\sigma_1 \ge \sigma_2
    \ge \dots \ge \sigma_n$.


    The idea behind the regularization method based on truncated TSVD is to truncate
    terms that contain very small singular values from the summation in equation (3.9).
    If a $\alpha \ge \varepsilon$ (is the machine precision) and $\sigma_1 \ge \sigma_2
    \ge \dots \ge \sigma_{\alpha} \ge \sigma_{\alpha+1} \ge \dots \ge \sigma_n$,


    ```

    $x^\alpha = \sum_{j=1}^\alpha \frac{u_j^T}{\sigma_j}v_j = \frac{u_1^T}{\sigma_1}v_1
    + \dots + \frac{u_{\alpha}^T}{\sigma_{\alpha}}v_{\alpha} \quad (3.10)

    ```


    Up to some optimal regularization level $\alpha^*$, the TSVD method performs well
    (for $\alpha \le \alpha^*$), after that (when $\alpha$ exceeds $\alpha^*$) the
    solution is affected by truncating more terms and as $\alpha \ge \alpha^*$, $x^\alpha$
    goes away from $x$.'
