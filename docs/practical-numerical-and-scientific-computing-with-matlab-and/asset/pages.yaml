  md: '# 3

    Ill-Conditioning and Regularization

    Techniques in Solutions of Linear Systems


    # Abstract


    If a small perturbation is introduced to either the coefficient matrix $A$ or
    vector $b$, it might lead to a big change in the solution vector $x$. Hence, both
    the direct and iterative methods are not guaranteed to give accurate solutions
    of the given linear system.


    This chapter is divided into two sections. The first section presents the concept
    of ill-conditioning in linear systems and how to use MATLAB® and Python to measure
    the condition numbers of matrices. In the second section, some regularization
    techniques are presented to stabilize the solutions of ill-conditioned systems.


    # 3.1 Ill-Conditioning in Solutions of Linear Systems


    An ill-conditioned linear system is a linear system which responds to a small
    perturbation on the coefficient matrix or the vector at the right-hand side with
    a large change in the system solution [28, 42]. To see this, two kinds of little
    perturbations will be presented to two examples that will be considered. In the
    first example a slight change on one component of the coefficient matrix will
    be introduced and in the second example the perturbation will be made on the vector
    at the right-hand side.


    **Example 3.1** In this example we consider the linear system $Fx = d$, with


    ```

    A = \begin{pmatrix} 5.0 & 1.0 & 1.0 \ 1.0 & 5.0 & 1.0 \ 1.0 & 1.0 & 5.0 \end{pmatrix}
    \quad b = \begin{pmatrix} 5.0 \ -3.0 \ 5.0 \end{pmatrix}

    ```


    To solve this linear system in MATLAB, we use the following commands:


    ```

    >> A = [5., 1., 1.; 1., 5., 1.; 1., 1., 5.]

    A =

    ```'
