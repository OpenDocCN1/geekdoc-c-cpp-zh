    # 7.4.3 Solving a System of IVPs


    In this section, we consider a system of initial value problems. The system is
    of the form:


    ```

    $$\begin{aligned} \frac{dy_1}{dt} &= f_1(t, y_1(t), \dots, y_n(t)), y_1(t_0) =
    y_1^0, t \in [t_0, t_1] \ \frac{dy_2}{dt} &= f_2(t, y_1(t), \dots, y_n(t)), y_2(t_0)
    = y_2^0, t \in [t_0, t_1] \ \dots &= \dots \ \frac{dy_n}{dt} &= f_n(t, y_1(t),
    \dots, y_n(t)), y_n(t_0) = y_n^0, t \in [t_0, t_1] \end{aligned}$$ (7.8)

    ```


    The first step to solve the above system of IVPs is to write it in a vector form.
    To do that, we let:


    ```

    $z = \begin{pmatrix} y_1(t) \ y_2(t) \ \vdots \ y_n(t) \end{pmatrix}$

    ```


    then,


    ```

    $$\frac{dz(t)}{dt} = \begin{pmatrix} f_1(t, z(t)) \ f_2(t, z(t)) \ \vdots \ f_n(t,
    z(t)) \end{pmatrix} \text{ and } \mathbf{z}(t_0) = \begin{pmatrix} y_1(t_0) \
    y_2(t_0) \ \vdots \ y_n(t_0) \end{pmatrix} = \begin{pmatrix} y_1^0 \ y_2^0 \ \vdots
    \ y_n^0 \end{pmatrix}$

    ```'
  merge: -1
  pgno: 211
