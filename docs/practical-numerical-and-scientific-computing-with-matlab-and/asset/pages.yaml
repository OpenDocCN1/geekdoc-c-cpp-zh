  md: '# Newton''s Interpolation


    Since the first $n+1$ derivatives exist for both $\psi(x)$ and $E_n(x)$, then
    so is $G(x)$. $G(x)$ has $n+2$ distinct roots in $[a,b]$. From the intermediate
    value theorem, $G''(x)$ has $n+1$ distinct roots in $(a,b)$ and $G''''(x)$ has
    $n$ distinct roots in $(a,b)$. By the mathematical induction, $G^{(k)}$ has $n-k+2$
    distinct roots in $(a,b)$. Hence, $G^{(n+1)}$ has at least one root in $(a,b)$.
    Let $\xi$ be a root for $G^{(n+1)}$ in $(a,b)$, that is $G^{(n+1)}(\xi) = 0$.


    From the definitions of $E_n(x)$ and $\psi(x)$, $E^{(n+1)}(x) = f^{(n+1)}(x)$
    and $\psi^{(n+1)} = (n+1)!$. Then,


    ```

    $G^{(n+1)}(x) = f^{(n+1)}(x) - \frac{(n+1)!}{\psi(t)} E_n(t)$

    ```


    At $x=\xi$,


    ```

    $G^{(n+1)}(\xi) = f^{(n+1)}(\xi) - \frac{(n+1)!}{\psi(t)} E_n(t) = 0$,

    ```


    from which,


    ```

    $E_n(t) = \frac{\psi(t)}{n+1} f^{(n+1)}(\xi)$

    ```


    # 5.2 Newton''s Interpolation


    A set of data points $(x_j, f(x_j))$, $j=0,\dots,n$, the problem is to find a
    polynomial $P_n(x)$ of degree not exceeding $n$ such that $P_n(x_j)=f(x_j)$ for
    all $j=0,\dots,n$.


    The Lagrange interpolation defined by


    ```

    $P_n(x) = \sum_{j=0}^n L_j(x)f(x_j)$,

    ```


    where


    ```

    $L_i(x) = \prod_{j \neq i}^n \frac{x-x_j}{x_i-x_j}$,

    ```


    suffer a problem that it is not possible to obtain $L_{i+1}(x)$ from $L_i(x)$
    (that there is no iterative method to compute the polynomials $L_i(x),i=0,\dots,n$).
    This makes the complexity of the algorithm high. Hence, Newton''s interpolating
    polynomials can be seen as an alternative to the Lagrange polynomials.


    # 5.2.1 Description of the Method


    In Newton''s interpolation method, a polynomial $P_k(x)$ of degree $k$ where $1
    \le k \le n$ is computed from $p_{k-1}$ using an iterative technique. It starts
    with'
