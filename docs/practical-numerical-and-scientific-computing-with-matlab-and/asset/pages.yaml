    # 5.3.2 Interpolation with the Spline Function


    Interpolating with piecewise linear polynomials results in functions that are
    not differentiable at the interpolation points as seen in Figure 5.4. The MATLAB
    function spline computes a piecewise cubic polynomial such that the first and
    second derivatives are smooth at the interpolation points $(x_j,y_j)$.


