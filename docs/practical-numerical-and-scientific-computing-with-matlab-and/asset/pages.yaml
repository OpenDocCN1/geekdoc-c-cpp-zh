    # 5.2.2 Newton''s Divided Differences


    Given a data table:


    | x | x0 | x1 | ... | xn |

    |---|---|---|---|---|n| f(x) | f(x0) | f(x1) | ... | f(xn) |


    and the problem is to find a Newton''s polynomial


    > $P_n(x) = c_0 + \sum_{k=1}^{n} c_k \prod (x - x_j)$


    that interpolates the given tabular data $(x_j, f(x_j))$, $j = 0, \dots, n$.

    The basis functions for the Newton''s interpolating polynomials are


    > $N_0(x) = 1, N_1(x) = x - x_0, N_2(x) = (x - x_0)(x - x_1), \dots, N_n(x) =
    (x - x_0) \dots (x - x_{n-1}).$.


    ![](img/9923905aaa045c7096d90695cee3e3bc_131_0.png)


    FIGURE 5.2: Approximation of the function $\sin(4x)/(1 + x)$ at 101 points, using
    a Newton''s interpolating polynomial constructed by 10 data points.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# 114 Data Interpolation


    Therefore, computing a Newton''s polynomial is restricted to computing the polynomial
    coefficients $c_0, \dots, c_n$.


    The method of divided differences is a short way for computing the coefficients
    of Newton''s interpolating polynomials $c_j, j=0, \dots, n$. In a divided difference
    method, a method of divided tables is constructed.


    Before discussing the construction of Newton''s divided differences table, the
    following notations will be used:


    ```

    $f[x_k] = f(x_k), k=0, \dots, n$$

    $$f[x_k, x_{k+1}] = \frac{f[x_{k+1}]-f[x_k]}{x_{k+1}-x_k}, k=0, \dots, n-1$$

    $$f[x_k, x_{k+1}, x_{k+2}] = \frac{f[x_{k+1}, x_{k+2}]-f[x_k, x_{k+1}]}{x_{k+2}-x_k},
    k=0, \dots, n-2$$

    ```


    and generally,


    ```

    $f[x_k, x_{k+1}, \dots, x_{k+j}] = \frac{f[x_k, \dots, x_{k+j+1}]-f[x_k, \dots,
    x_{k+j}]}{x_{k+j+1}-x_k}, k=0,\dots,n-(j+1)$

    ```


    Then, the Newton''s divided difference table is defined by:


    | $x_k$ | $f[x_k]$ | $f[x_{k-1}, x_k]$ | $\dots$ | $f[x_0, \dots, x_k]$ |

    |---|---|---|---||

    | $x_0$ | $f[x_0]$ | | | |

    | $x_1$ | $f[x_1]$ | $f[x_0, x_1]$ | | |

    | $\dots$ | $\dots$ | $\dots$ | $\dots$ | $\dots |

    | $x_n$ | $f[x_n]$ | $f[x_{n-1}, x_n]$ | $\dots$ | $f[x_0, \dots, x_n]$ |


    The coefficients of Newton''s interpolating polynomials are given by the following
    forms:


    ```

    $c_0 = f(x_0)$$

    c_1 = \frac{f[x_1]-f[x_0]}{x_1-x_0} = f[x_0, x_1]$$

    c_2 = \frac{f[x_1, x_2]-f[x_0, x_1]}{x_2-x_0} = f[x_0, x_1, x_2]$$

    ```


    and generally,


    ```

    $c_k = \frac{f[x_1, \dots, x_k]-f[x_0, \dots, x_{k-1}]}{x_k-x_0} = f[x_0, \dots,
    x_k], k=1, \dots, n.$

    ```


    Hence, the coefficients of Newton''s interpolating polynomials are the diagonal
    elements on the table of Newton''s divided differences.'
