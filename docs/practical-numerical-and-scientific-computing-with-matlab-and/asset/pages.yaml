    The above results show that the 1-point Gauss quadrature behaves as a second order
    method and the 2-point Gauss quadrature behaves as a fourth-order method.


    Higher-order Gauss quadrature methods can be obtained for $n \ge 3$. In fact,
    in $n$-points Gauss quadrature method, the points $x_1,x_2,\dots,x_n$ are the
    roots of the Legendre polynomial $P_n(x)$. Hence, this class of points is referred
    to as *Legendre-Gauss points*. The Python function located in *scipy.special*
    receives a parameter $n$ and returns the coefficients of the corresponding $n^{th}$-degree
    Legendre polynomial [5, 44].


    ```

    In [29]: from scipy.special import legendre

    In [30]: legendre(4)

    Out [30]: poly1([4.3750000e+00, 4.857225372e-16,-3.7500000e+01, 2.4286128e-16,
    3.75000000e-01])

    In [31]: legendre(4)

    4 3 2

    4.375 x + 4.857e-16 x - 3.75 x + 2.429e-16 x + 0.375

    ```


    ```

    In [32]: np.roots(legendre(4))

    Out [32]: array([0.86113631, -0.86113631, 0.33998104, -0.33998104])

    ```


    The last line `np.roots(legendre(4))` gives the points of the 4-points Legendre-Gauss
    quadrature.'
