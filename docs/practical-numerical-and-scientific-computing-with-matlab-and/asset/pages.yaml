  md: "# Regularization of Solutions in Linear Systems\n\nThe MATLAB function SolveWithTSVD\
    \ receives a matrix F, vector b and regularization parameter alpha. It applies\
    \ the truncated SVD regularization to return a solution x.\n\n```\nfunction x\
    \ = SolveWithTSVD(F, b, Alpha)\n    [U, S, V] = svd(A);\n    D = diag(S);\n  \
    \  [m, n] = size(A);\n    x = zeros(m, 1);\n    for i = 1 : length(S)\n      \
    \  if D(i) > Alpha\n            x = x + U(:,i)*b/D(i)*V(:,i)';\n        end\n\
    \    end\nend\n```\n\nThe function SolveWithTSVD is designed for 20x2 Hilbert\
    \ matrix, the vector b at the RHS components are the summations of H rows. The\
    \ exact solution y is a vector of ones of 20x1.\nUsing a script SolveForHilb,\
    \ an unregularized solution z and a regularized solution w are computed and shown\
    \ in Figure 3.2. Also, the error norms for different values of the regularization\
    \ parameters alpha_j = 10^(j-1) are shown.\n\n```\nH = hilb(20);\ny = ones(20,\
    \ 1);\nb = H * y;\nsubplot(1, 2, 1);\nplot(1:20, y,'b',z,'r','LineWidth', 3);\n\
    legend('Exact Solution','Unregularized Solution');\nxlabel('Solution Component');\n\
    ylabel('Component Value');\ngrid on;\nformat short e\ndisp('Error norm of unregularized\
    \ solution ||y-z||_2', ...)\ndisp(norm(y-z))\n```\n\n![](img/9923905aaa045c7096d90695cee3e3bc_97_0.png)\n\
    \nFIGURE 3.2: Unregularized and regularized solutions of Hx = b."
