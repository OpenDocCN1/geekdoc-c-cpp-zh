    $P_0(x) = c_0 = f(x_0)$.\n\nThen, $P_k$ is obtained from the iteration:\n\n$P_k(x)\
    \ = P_{k-1}(x) + c_k \\prod_{j=0}^{k-1} (x - x_j),$ (5.4)\n\nwhere $c_k$ is a\
    \ constant that is determined by substituting the data point $(x_k, f(x_k))$ in\
    \ the equation of $P_k(x)$, such that it satisfies the relation $P_k(x) = f(x_j)$,\
    \ $j = 0,\\dots,n$.\n\nFrom the iterative formula of Newton's interpolation, the\
    \ Newton's polynomial interpolates the data $(x_0, f(x_0)), \\dots, (x_k, f(x_k))$\
    \ by equation (5.4) is of:\n\n$P_k(x) = c_0 + c_1(x-x_0) + c_2(x-x_0)(x-x_1) +\
    \ \\dots + c_k(x-x_0)\\dots(x-x_{k-1}),$ (5.5)\n\nwith $P_0(x) = c_0 = f(x_0)$.\n\
    \nFor a given points $(x_j, f(x_j))$, the MATLAB function ComputeNewton-Coeff\
