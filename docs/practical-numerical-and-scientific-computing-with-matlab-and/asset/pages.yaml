  md: '# # Numerical Differentiation and Integration


    #  Abstract


    This chapter discusses the numerical methods for approximating derivative and
    integrations of functions. The chapter is divided into two sections: the first
    section discusses the numerical differentiation of functions based on finite difference
    formulas and the second discusses the numerical integration based on Newton-Cotes
    and Gauss methods. Such numerical differentiation or integration algorithms are
    implemented using both MATLAB® and Python.


    # 6.1 Numerical Differentiation


    # 6.1.1 Approximating Derivatives with Finite Differences


    Let $x_0 \in (a,b) \subset \mathbb{R}$ and $f \in \mathcal{C}^{n+1}[a,b]$. Then,
    for $h>0$ and $k\le n$ the Taylor expansion around $x_0$ is given by:


    ```

    $f(x_0+h)=f(x_0)+hf''(x_0)+\frac{h^2}{2!}f''''(x_0)+\dots+\frac{h^k}{k!}f^{(k)}(x_0)\n+\frac{h^{k+1}}{(k+1)!}f^{(k+1)}(\xi),\xi\in[x_0,x_0+h]
    \quad (6.1)$

    ```


    and


    ```

    $f(x_0+h)=f(x_0)-hf''(x_0)+\frac{h^2}{2!}f''''(x_0)+\dots+\frac{(-h)^k}{k!}f^{(k)}(x_0)\n+\frac{(-h)^{k+1}}{(k+1)!}f^{(k+1)}(\eta),\eta\in[x_0-h,x_0]
    \quad (6.2)$

    ```'
