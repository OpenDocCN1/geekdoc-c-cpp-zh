  md: '# Regularization of Solutions in Linear Systems


    # 3.2.3 The L-curve Method


    Using small values for the regularization parameter $\alpha$ on equations (3.11)
    and (3.15) may not inhibit the quantities $\frac{\sigma_i}{\alpha}$ and $\frac{\sigma_i}{\alpha+\alpha\mu_i}$
    effectively. Hence, no much improvement can be obtain for the smoothness of the
    unregularized solution, but it causes the regularized solution to stay close to
    the unregularized solution. On the other hand, using large values for the regularization
    parameter $\alpha$ do impose more smoothness on the regularized solution, but
    it causes to go away from the minimum residual value, obtained for the unregularized
    solution. Between these two extremes, optimal regularization parameters do lie.


    When we plot the points ($||Fx^\alpha-y||, ||Lx^\alpha||$) for different values
    of $\alpha$ on the loglog scale, it takes the shape of an L-curve. The L-curve
    clearly display the compromise between minimization of the two quantities $||Fx^\alpha-y||$
    and $||Lx^\alpha||$ [22]. At the corner of this L-curve, optimal values for the
    regularization parameter $\alpha$ are located.


    # 3.2.4 The Discrepancy Principle


    Linz and Wang [33] considered the problem of solving a linear system $Fx=b$, where
    $F$ is an $m \times n$ matrix with $m \ge n$, $x \in \mathbb{R}^n$ and $b \in
    \mathbb{R}^m$. He stated that, a solution $x$ for this linear system is referred
    to as *acceptable* if it satisfies the condition


    > $||Fx-b|| \le \varepsilon$$


    where $\varepsilon$ is the total error of the data and computations. According
    to Linz and Wang [33] $x$ is a *plausible* solution only if


    > $||Lx|| \le M$$


    where $M$ is a chosen positive number. Therefore, the task becomes to select $\alpha$,
    so that the regularized solution $x^*$ is both acceptable and plausible. The solution
    $x$ is the *most plausible acceptable* solution, if it solves the problem


    ```

    $$\min_{x \in \mathbb{R}^n} ||Lx|| \quad (3.18)$

    ```


    subject to the constraint


    ```

    $||Fx-b|| \le \varepsilon \quad (3.19)$

    ```


    Problem (3.18)-(3.19) is equivalent to solve the problem


    ```

    $$(F^T F + \alpha B^T B)x^\alpha = F^T b \quad (3.20)$

    ```


    subject to


    ```

    $||Fx^\alpha-b|| \le \varepsilon \quad (3.21)$

    ```


    and the *Morozov discrepancy principle* is the problem of selecting a such that,
    (3.20-3.21) is satisfied.'
