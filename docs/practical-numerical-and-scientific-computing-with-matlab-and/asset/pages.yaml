    In [33]: n1, n2, n3 = norm(A, 1), norm(A, 2), norm(A, np.inf)\nIn [34]: print(n1,\
    \ '\\n', n2, '\\n', n3)\n```\n\n9.0\n6.5467563644\n7.0\n\nIn MATLAB, also the\
    \ norm function is used to compute $\\|A\\|_p$ of matrix A.\n\n```\n>> A = [1,\
    \ -2; 2, -3; 3, -4];\n>> n1 = norm(A, 1), n2 = norm(A, 2), n3 = norm(A, inf)\n\
    n1 =\n9\nn2 =\n6.5468\nn3 =\n7\n```\n\nLet $A$ and $B$ be matrices of type $m\
    \ \times n$, $\\alpha$ a scalar and $\boldsymbol{x}$ be a vector in $\\mathbb{R}$.\
    \ The norm function is $\\|\\cdot\\| : \\mathbb{R}^{m \times n} \to \\mathbb{R}$\
    \ that satisfies the following properties:\n\n+   (a) $\\|\\alpha A\\| \\ge 0$.\n\
    (b) $\\|\\alpha A\\| = |\\alpha| \\cdot \\|A\\|$.\n(c) $\\|A+B\\| \\le \\|A\\\
    | + \\|B\\|$.\n(d) $\\|A\boldsymbol{x}\\| \\le \\|A\\|\\|\boldsymbol{x}\\|$.\n\
    (e) $\\|AB\\| \\le \\|A\\|\\|B\\|$,\n\n**II) Machine precision:** A digital computer\
    \ has limited storage capacity to represent a number with floating point. Subject\
    \ to the International Electrical and Electronic Engineering (IEEE) standards,\
    \ a double-precision number is represented by 8 bits (64 bits). These 64 bits\
    \ are divided into three segments: the most significant bit (the most left) is\
    \ used for representing the sign of the number. The next 11 bits are used to represent\
    \ the exponent part and the last 52 bits (called *mantissa*) are used to represent\
    \ the binary fraction bits. Under this setup, the minimum floating number that\
    \ can be represented by 64 bits is approximately $-1.7977 \times 10^{308}$ and\
    \ the largest floating number is approximately $1.7977 \times 10^{308}$."
