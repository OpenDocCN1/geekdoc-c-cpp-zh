    # 7.4.4 Solving Stiff Systems of IVPs


    If the IVP system stiff, the MATLAB function ode45 fails in finding a solution
    for the problem. An example for this system is the Vanderpool oscillator, given
    by the second order differential equation:


    > $y''''(x) + \sigma(y^2(x)-1)y''(x) + y(x) = 0, y''(0) = 2$


    If we let $y_1(x) = y''(x), y_2(x) = y(x)$, we can recover the Vanderpool system
    can be written in the form:


    ```

    $y_1''(x) = y_2(x), y_1(0) = 1$

    $y_2''(x) = \sigma(1-y_1^2(x))y_2(x) - y_1(x), y_2(0) = 0 \quad (7.9)$

    ```


    The MATLAB ode45 function will fail to solve the Vanderpool system (7.9). We can
    use the MATLAB function, ode23s instead to solve the system (7.9).

    We will declare $\sigma$ as a global variable and then solve the system as follows:'
