  md: '# Solving a System of Nonlinear Equations


    We can write the above system in the vector form, by writing:


    $$\mathbf{x} = \begin{pmatrix} x_1 \ x_2 \ \vdots \ x_n \end{pmatrix} \text{ and
    } \mathbf{f}(\mathbf{x}) = \begin{pmatrix} f_1(x) \ f_2(x) \ \vdots \ f_n(x) \end{pmatrix}$


    $x^*$ is any point in $\mathbb{R}^n$, the approximation by the first two terms
    of the Taylor expansion of $\mathbf{f}(\mathbf{x}^*)$ is given by:


    $$\mathbf{f}(\mathbf{x}^*) \approx \mathbf{f}(\mathbf{x}^*) + J(\mathbf{x}^*)(\mathbf{x}-\mathbf{x}^*)$


    where $J(\mathbf{x}^*)$ is the Jacobian matrix and the $ij$ component of the $J$
    is defined by:


    $$(J(\mathbf{x}^*))_{ij} = \frac{\partial f_i(x)}{\partial x_j}|_{x=\mathbf{x}^*}$$


    Now, if we set $\mathbf{f}(\mathbf{x}) = 0$, we obtain the equation:


    $$\mathbf{f}(\mathbf{x}^*) + J(\mathbf{x}^*)(\mathbf{x}-\mathbf{x}^*) = 0$$


    from which we find that


    $$\mathbf{x}^* = \mathbf{x}^* - J^{-1}(\mathbf{x}^*)\mathbf{f}(\mathbf{x}^*)$


    Starting from an initial guess $\mathbf{x}^{(0)}$ for the solution of $\mathbf{f}(\mathbf{x})
    = 0$, the iteration:


    $$\mathbf{x}^{(n+1)} = \mathbf{x}^{(n)} - J^{-1}(\mathbf{x}^{(n)})\mathbf{f}(\mathbf{x}^{(n)})$


    converges to the closest solution of $\mathbf{f}(\mathbf{x}) = 0$ to the initial
    point $\mathbf{x}^{(0)}$.


    In MATLAB, the function ''jacobian'' can be used to find the Jacobian matrix of
    the nonlinear system of equations $\mathbf{f}(\mathbf{x})$.


    **Example 4.1** Use MATLAB to find a solution to the nonlinear system of equations:


    $$x^2+y^2 = 30$$

    $-x^2+y^2 = 24$$


    We write:


    $$\mathbf{f}(x,y) = [x^2+y^2-30, -x^2+y^2-24]^T$$


    The Jacobian matrix for the nonlinear system is given by:


    $$$J(x,y) = \begin{pmatrix} 2x & 2y \ -2x & 2y \end{pmatrix}$$'
