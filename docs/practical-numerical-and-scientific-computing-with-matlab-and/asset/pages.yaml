  md: "# Ill-Conditioning in Solutions of Linear Systems\n\n4.8704e-01\n7.5596e-02\n\
    8.9611e-03\n8.6776e-04\n7.0334e-05\n4.8305e-06\n2.8277e-07\n1.4140e-08\n6.0361e-10\n\
    2.1929e-11\n6.7408e-13\n1.7384e-14\n3.7318e-16\n1.5057e-17\n1.2511e-17\n7.3767e-18\n\
    5.4371e-18\n1.7279e-18\n5.8796e-19\n\nWe see that the last 6 singular values of\
    \ $H=USVT$ are below $\\varepsilon(2.204 \times 10^{-16})$, which are not discriminated\
    \ from 0 in the $64-bit$ systems. Dividing by such a value when computing $H^{-1}=VS^{-1}U^T$\
    \ causes huge errors, since the diagonal elements of $S^{-1}$ are the reciprocals\
    \ of the diagonal elements of $S$.\n\nAccording to the distribution of the singular\
    \ values of $F$, ill-posed problems (whose coefficient matrices are ill-conditioned)\
    \ are divided into two classes. Namely, the **rank deficient problems** and the\
    \ **discrete ill-posed problems**. These two classes of problems can be distinguished\
    \ using the following properties [36]\n\n+   1. in the rank deficient problems,\
    \ there is a small cluster of small singular values, while in discrete ill-posed\
    \ problems there is a large cluster of small singular values.\n\n+   2. in the\
    \ rank deficient problems there is a clear gap between the large and small singular\
    \ values, while in discrete ill-posed problems the singular values decay gradually\
    \ without gaps between the large and small singular values.\n\n+   3. for the\
    \ rank deficient problems, there could be a formulation which can eliminate the\
    \ ill-conditioning but no such formulation exists for the ill-posed problems."
