  md: "# Data Interpolation\n\n# # Abstract\n\nData interpolation means to use a given\
    \ set of $n+1$ data points to approximate\n\na function $f(x)$ by a polynomial\
    \ $P_n(x) = a_nx^n + a_{n-1}x^{n-1} + \\dots + a_1x + a_0$ (of\n\ndegree not exceeding\
    \ $n$, such that $P_n(x_i) = f(x_i)$, $i=0,\\dots,n$, where $a_0,\\dots,a_n$\n\
    \nare constants. The data points are given by the table:\n\n| $x$ | $x_0$ | $x_1$\
    \ | $\\dots$ | $x_n$ |\n|---|---|---|---|--|\n| $f(x)$ | $f(x_0)$ | $f(x_1)$ |\
    \ $\\dots$ | $f(x_n)$ |\n\nwhere $x_i \neq x_j$ for $i \neq j$ and $x_0 < x_1\
    \ < \\dots < x_n$.\n\nThis chapter discusses some of the interpolation methods\
    \ and their imple-\nmentation in MATLAB\\00 and Python. It is divided into four\
    \ sections. Section 1\ndiscusses Lagrange interpolation and its implementation\
    \ in MATLAB and\nPython. Section 2 discusses Newton's interpolation and the divided\
    \ differ-\nte technique for finding the coefficients of Newton's interpolation.\
    \ One-\ndimensional interpolations with MATLAB and Python are discussed in\nSections\
    \ 3 and 4.\n\n# ## 5.1 Lagrange Interpolation\n\nThis section is divided into\
    \ three sections. In the first section, construction\nimplementation of the Lagrange\
    \ interpolating polynomial from a given\ndata will be discussed. The proof of\
    \ uniqueness of the Lagrange interpolating\npolynomial will be discussed in Section\
    \ 2. In the last section, a formula of the\ninterpolation error, using Lagrange\
    \ interpolation will be presented.\n\n# ### 5.1.1 Construction of Lagrange Interpolating\
    \ Polynomial\n\nIn Lagrange interpolation, $n+1$ polynomials $L_0(x), L_1(x),\\\
    dots,L_n(x)$ are con-\nstructed. Each polynomial $L_j(x), (j=0,\\dots,n)$ is of\
    \ degree $n$, such that\n\n```\n$L_i(x_j) = \\begin{cases} 1, & i=j \\ 0, & i\
    \ \\neq j \\end{cases}$\n```"
