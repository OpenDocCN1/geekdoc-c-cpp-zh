    # ## Abstract

    This chapter discusses the solutions of nonlinear systems using MATLAB® and Python.
    It is divided into two sections. The first section presents numerical methods
    for solving single nonlinear equation. The second section discusses numerical
    methods for solving a system of nonlinear equations.


    # ## 4.1 Solving a Single Nonlinear Equation


    Consider a nonlinear equation of the form:


    f(x) = 0


    where $f:R\rightarrow R$ is a nonlinear function. The problem is to find a point
    $x=x^*$ such that $f(x^*)=0$. Then, $x=x^*$ is called a *root* of the continuous
    function $f$. For example, if $f(x)=e^{-x}-\cos x+0.5$, then the root of $f(x)=e^{-x}-\cos
    x+0.5=0$ is at the intersection of the curves $x=e^{-x}+0.5$ and $\cos(x)$ as
    be seen in Figure 4.1.


    In this section four methods for solving the given nonlinear equation, namely,
    the bisection method, the Newton-Raphson method, the secant and the iterative
    method will be discussed and implemented in MATLAB and Python.


    # ### 4.1.1 The Bisection Method


    Assume that the function $f(x)$ is continuous in an interval $[a,b]$ and is changing
    its sign from positive to negative or vice as it moves from $a$ to $b$. A direct
    result from the intermediate value theorem is that a continuous function cannot
    change its sign in an interval, without passing zero [52].


    The bisection method is an iterative method, in which iteration divides the interval
    that contains the root into two equally subintervals, drops the half which does
    not contain the root and looks for the root in the other half.


