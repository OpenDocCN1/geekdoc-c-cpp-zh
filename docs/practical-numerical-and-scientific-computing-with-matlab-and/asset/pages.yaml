    **Example 7.3** In this example mid-point rule will be used to solve the logistic-growth
    model:


    ```

    $\tilde{P}(t) = rP(t)(1-P(t)), P(0) = P_0, t \in [0,T]$

    ```


    The exact solution of this model is


    ```

    $P(t) = \frac{P_0}{P_0+(1-P_0)e^{-rt}}$

    ```


    The Python code for solving the logistic growth model with $r=0.2, P_0=0.1$ in
    $[0,30]$ is:


    ```

    1 from numpy import listspace, zeros, exp, inf, log2, arrange

