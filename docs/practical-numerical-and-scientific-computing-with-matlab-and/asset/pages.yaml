    3 A[:, j] = x[:]**(j)\n4 Q = np.linalg.solve(A.T@A, A.T@y):\n```\n\ncan be replaced\
    \ by:\n\n```\n1 Q = np.polyfit(x, y, k)\n```\n\nTherefore, we have the following\
    \ remarks:\n\n+   (a) As the degree of the fitting polynomial increases, the least-squares\
    \ error decreases.\n\n+   (b) if $n$ data points, the degree of the fitting polynomial\
    \ cannot exceed $n-1$, otherwise, the matrix of the normal equations will be singular.\n\
    \n+   (c) if $n$ data points, and the fitting polynomial is of degree $n-1$, the\
    \ matrix of coefficients is called the **Vandermonde matrix**.\n\n+   (d) The\
    \ Vandermonde matrix is nonsingular, but as the number of data points $n$ increases,\
    \ it gets closer to singular.\n\n# Least-squares Approximations of functions:\n\
    \nGiven a function $f(x)$ that is continuous in an interval $[a,b] \\in \\mathbb{R}$.\
    \ If $P_n(x) = \\alpha_n x^n + \\alpha_{n-1}x^{n-1} + \\dots + \\alpha_0, \\alpha_0,\
    \ \\dots, \\alpha_n \\in \\mathbb{R}$ is a polynomial of degree $n$ that approximates\
    \ $f(x)$ in $[a,b]$, then the approximation $E(\\alpha_0, \\alpha_1, \\dots, \\\
    alpha_n)$ is defined by:\n\n> $E(\\alpha_0, \\alpha_1, \\dots, \\alpha_n) = \\\
    |f(x) - P_n(x)\\|^2 = \\int_a^b (f(x) - \\sum \\alpha_j x^j)^2 dx$ (2.20)\n\n\
    The problem is to find the optimal coefficients $\\hat{\\alpha}_0, \\hat{\\alpha}_1,\
    \ \\dots, \\hat{\\alpha}_n$ such that the $^{th}$-degree polynomial $P_n(x) =\
    \ \\sum_{j=0}^n \\hat{\\alpha}_j x^j$ is a least solution of the approximation\
    \ i.e.:\n\n> $E(\\hat{\\alpha}_0, \\hat{\\alpha}_1, \\dots, \\hat{\\alpha}_n)\
    \ = \\int_a^b (f(x) - \\sum \\alpha_j x^j)^2 dx = \\min_{\\alpha_0, \\dots, \\\
    alpha_n \\in \\mathbb{R}} \\{E(\\alpha_0, \\alpha_1, \\dots, \\alpha_n)\\}$ (2.21)\n\
    \nAt the optimal parameters $\\hat{\\alpha}_0, \\hat{\\alpha}_1, \\dots, \\hat{\\\
    alpha}_n$, we find that\n\n> $\\frac{\\partial E}{\\partial \\alpha_k}\big|_{\\\
    hat{\\alpha}_k} = 0, k = 0, \\dots, n$ (2.22)"
