  md: '# Solving Linear Systems with Iterative and Least Squares Methods


    # Abstract


    The direct methods for solving a linear system $Ax = b$ are to find the exact
    solution of the linear system, by inverting the matrix $A$ directly or indirectly.
    The iterative methods aim at finding an approximate solution of the linear system
    by finding a sequence of vectors that is converging to the exact solution. In
    the case the linear system does not have a solution, the problem turns into a
    least squares problem.


    This chapter aims to find approximate and least squared solutions of linear systems.
    It is divided into three sections. In the first section, basic concepts such as
    error norm and convergence of vector sequences are introduced. Then, in the second
    section three iterative methods for finding approximate solutions of linear systems
    of equations are discussed and implemented in MATLAB and Python. When a linear
    system does not have a solution, the problem turns into searching for a least
    squares solution that minimizes the error norm. Examples of least squares problems
    and best approximations of functions by polynomials are discussed and implemented
    in MATLAB and Python, in the third section.


    # 2.1 Mathematical Backgrounds


    This section presents the concepts of vectors norms and the convergence of sequences
    in a vector space $R^n$.


    # 2.1.1 Convergent Sequences and Cauchy''s Convergence


    Let $a$ be any point in $R$, and $\varepsilon \in R^+$ be any positive real number.
    The $\varepsilon$-neighbourhood of $a$ (denoted by $N(a,\varepsilon)$) is the
    set of all points $x \in R$ that lie in the open interval $(a-\varepsilon, a+\varepsilon)$.
    That is, $N(a,\varepsilon) = \{x \in R : |x-a| < \varepsilon\}$ [46]. A sequence
    of real numbers $\{a_n\}_{n=0}^\infty = a_0, a_1, a_2,\dots$ is said to converge
    to $a \in R$, for any choice of $\varepsilon > 0$, $N(a,\varepsilon)$ contains
    an infinite sub-sequence'
