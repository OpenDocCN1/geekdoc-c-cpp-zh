  md: "# Solving a System of Nonlinear Equations\n\nTo find a root for the function\
    \ $f(x) = x^2 - 3$, using the Newton-Raphson method, it is noticed that $f'(x)\
    \ = 2x$, and therefore, the iterative method is of the form:\n\n$x^{(n+1)} = x^{(n)}\
    \ - \frac{f(x^{(n)})}{f'(x^{(n)})} = x^{(n)} - \frac{(x^{(n)})^2-3}{2x^{(n)}}$\n\
    \nThe MATLAB function NewtonRaphson.f, implements the Newton-Raphson method:\n\
    \n```\nfunction [x, Iter] = NewtonRaphson(f, fp, x0, Epsilon)\n    Iter = 0;\n\
    \    xl = x0 - f(x0)/fp(x0);\n    while abs(xl) >= Epsilon\n        x0 = xl;\n\
    \        xl = x0 - f(x0)/fp(x0);\n        Iter = Iter + 1;\n    end\n    x = xl;\n\
    ```\n\nCalling the NewtonRaphson function from the command prompt:\n\n```\n>>\
    \ format long\n>> f = @(x) x^2 - 3;\n>> fp = @(x) 2*x;\n>> Epsilon = 1e-8;\n>>\
    \ x0 = 1;\n>>[x, Iterations] = NewtonRaphson(f, fp, x0, Epsilon)\nx = =\n1.732050810014728\n\
    Iterations =\n3\n>> [x, Iterations] = NewtonRaphson(f, fp, -x0, Epsilon)\nx =\
    \ =\n-1.73205081014728\nIterations =\n3\n```\n\nThe code of the Python function\
    \ NewtonRaphson(f, fp, x0, Eps) is:\n\n```\ndef NewtonRaphson(f, fp, x0, Eps):\n\
    \    from math import fabs\n    x = x0 - f(x0)/fp(x0)\n    Iters = 1\n    while\
    \ fabs(f(x)) >= Eps:\n        x0 = x\n        x = x0 - f(x0)/fp(x0)\n        Iters\
    \ += 1\n    return x, Iters\n```"
