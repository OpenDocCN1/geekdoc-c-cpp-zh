- img_proc: true
  md: '# Solving Optimization Problems: Nonlinear Programming


    where $g(x) = \nabla f(x)$ is the gradient vector and $H(x)$ is the Hessian matrix
    defined by:


    ```

    $g(x) = \nabla f(x) = \begin{bmatrix} \frac{\partial f(x)}{\partial x_1} \ \frac{\partial
    f(x)}{\partial x_2} \ \vdots \ \frac{\partial f(x)}{\partial x_n} \end{bmatrix}$

    ```


    ```

    $H(x) = \begin{bmatrix} \frac{\partial^2 f(x)}{\partial x_1^2} & \frac{\partial^2
    f(x)}{\partial x_1\partial x_2} & \dots \ \frac{\partial^2 f(x)}{\partial x_2\partial
    x_1} & \frac{\partial^2 f(x)}{\partial x_2^2} & \dots \ \vdots & \vdots & \ddots
    \ \frac{\partial^2 f(x)}{\partial x_n\partial x_1} & \frac{\partial^2 f(x)}{\partial
    x_n\partial x_2} & \frac{\partial^2 f(x)}{\partial x_n^2} \end{bmatrix}$

    ```


    Equation (10.5) is to say that the Hessian matrix is a positive semi-definite.
    Equations (10.4)-(10.5) are necessary optimality conditions of $x^*$. If condition
    (10.5) is replaced by the condition:


    > $y^T H(x*)y > 0, \quad \forall y \in \mathbb{R}^n \quad (10.6)$


    (that the Hessian is positive definite), then the conditions (10.4)-(10.6) are
    sufficient optimality conditions.


    The numerical methods for solving (10.1) are iterative. They agree in starting
    from an initial $x^{(0)}$ of the solution $x^*$ and then construct a sequence
    of $x^{(0)},x^{(1)},x^{(2)},\dots$ where $f^{(0)} > f^{(1)} > \dots$. At iteration
    $k$, moving from $x^{(k)}$ to a point $x^{(k+1)}$ in numerical optimization passes
    through two steps: in the first step a **search direction** $p^{(k)}$ in the second
    step a **line search** in direction of $p^{(k)}$ (where $||p^{(k)}\| = 1$) to
    locate the minimum point $x^{(k+1)} = x^{(k)} + \alpha p^{(k)}$ in the line is
    carried out, such that $f(x^{(k+1)}) < f(x^{(k)})$. The iterative process stops
    at $x^{(k)}$ if


    > $||g(x^{(k)})\| < \epsilon$


    $\epsilon$ is an arbitrary positive real and $H(x^{(k)})$ is positive semi-definite
    [3, 20].


    The numerical optimization techniques for unconstrained optimization care about
    two problems:


    +   **Line search problem**: given a function $f(x)$, $g(x) = \nabla f(x)$, a
    point $x^{(k)}$ at iteration $k$ a descent direction $p^{(k)}$, find $\alpha^{(k)}
    > 0$ such that for $\alpha = \alpha^{(k)}$ the function $f$ is minimized along
    the ray $x^{(k)} + \alpha p^{(k)}$, that is


    ```

    $\alpha^{(k)} = \arg\min_{\alpha>0}\{f(x^{(k)} + \alpha p^{(k)}\}$

    ```'
