    \ Systems\n\nGiven a linear system of equations\n\n$Fx = y$$\n\nwhere $F \\in\
    \ \\mathbb{R}^{m \times n}$, $x \\in \\mathbb{R}^n$ is a vector of unknowns, $y\
    \ \\in \\mathbb{R}^m$ is a vector of exact\ndata and $n \\leq m$.\n\nWe want to\
    \ compute a solution $x^* \\in \\mathbb{R}^n$ to the linear system (3.5) such\n\
    that,\n\n+   - $x^*$ is a least-squares solution to problem (3.5). The existence\
    \ of a least-\nsquares solution $x_{LS}$ is characterized by\n\n$x_{LS} = \\text{arg}\
    \ \\min_{x \\in \\mathbb{R}^n} || Fx - y||^2$$\n\n$x^*$ is unique. The uniqueness\
    \ of a least-squares solution $x_{LSMN}$ is char-\\acterized by\n\n$x^* = x_{LSMN}\
    \ = \\text{arg} \\min_{x \\in \\mathbb{R}^n} \\{||x_{LS}||^2\\} = F^{-1}y$$\n\n\
    $x_{LSMN}$ is referred to as a least squares minimum norm solution."
