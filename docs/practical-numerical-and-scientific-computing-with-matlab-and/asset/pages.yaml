  md: '108


    Data Interpolation


    of degree $n$ with complex coefficients has at most $n$ zeros. So, if a polynomial
    $p(x)$ of degree $n$ has more than $n$ roots, it must be the zero polynomial $p(x)=0,
    \forall x \in \mathbb{C}$.


    To prove the uniqueness of Lagrange interpolating polynomial, assume $p_n(x)$
    and $q_n(x)$ are polynomials of degree $n$, that interpolate the given data $(x_i,
    y_i), i=0, \dots, n$. Then, $p_n(x)=q_n(x)=y_i$ for all $i=0, \dots, n$. Let $r(x)=p_n(x)-q_n(x)$
    for all $x \in [x_0,x_n]$. Since both $p_n(x)$ and $q_n(x)$ are of degrees $n$,
    then $r$ is at most $n$. Now, $r(x_i)=p_n(x_i)-q_n(x_i)=0$ for $i=0,n$ has $n+1$
    roots in $[x_0,x_n]$, while it is of degree $n$. From the fundamental theorem
    of algebra, this cannot happen unless $r$ is the zero polynomial in $[x_0,x_n]$,
    that is $r(x)=0, \forall x \in [x_0,x_n]$. This proves that $p_n(x)=q_n(x)$, for
    $x \in [x_0,x_n]$.


    # 5.1.3 Lagrange Interpolation Error


    Given a $f:[a,b] \to \mathbb{R}$ and $n+1$ points $x_0,\dots,x_n$ in $[a,b]$.
    Let $p_n(x)$ be a polynomial of degree $n$ that interpolates the data $(x_0,f(x_0)),\dots,(x_n,f(x_n))$.
    That is $p_n(x)=f(x_j)$ for all $j=0,\dots,n$.


    From the Lagrange interpolation, $p_n(x)$ is:


    $$p_n(x)=\sum_{i=0}^{n}L_i(x)f(x)$


    Define the interpolation error:


    $E_n(x)=f(x)-p_n(x), x \in[a,b]$ (5.3)


    Assuming that $f$ is differentiable continuously, a formula for the function $E_n(x)$
    will be derived.


    The following theorem gives an estimate for Lagrange interpolation.


    **Theorem 5.1** $x_0,x_1,\dots,x_n$ be $n+1$ distinct values and $t$ any real
    value. Let $a=\min\{x_0,\dots,x_n\}$ and $b=\max\{x_0,\dots,x_n\}$. Let $f$ be
    a real valued function on $[a,b]$ that is differentiable $n+1$ times. Let $p_n(x)$
    be the Lagrange polynomial that interpolates the data $(x_0,f(x_0)),\dots,(x_n,f(x_n))$.
    Then, there exists $\xi \in[a,b]$ such that


    $$E_n(x)=f(x)-p_n(x)=\frac{\psi(x)}{(n+1)!}^{(n+1)}(\xi)$


    **Proof:**


    It is clear that the result is true for $x=x_i,Vi=0,...,n$. Assume that the result
    is true when $x \neqneq x_i$. Fix a value $t \in[a,b]$ and define


    $$G(x)=\frac{\psi(x)}{\psi(t)}E_n(t), x \in[a,b],$


    where $\psi(x)=\prod_{j=0}^{n}(x-x_j)$.'
