    +   1. the **minimax** problem, where the minimization is over the infinity-norm:

    find \hat{x} : ||\mathbf{b} - A\hat{x}||\infty = \min_{\mathbf{x} \in \mathbb{R}^n}
    ||\mathbf{b} - A\mathbf{x}||\infty = \min \max_{i=1,\dots,m} \{|b_i - (A\mathbf{x})_i|\},


    +   2. the **absolute deviation** problem, where the minimization is over $|\cdot||_1:

    find \hat{x} : ||\mathbf{b} - A\hat{x}||_1 = \min_{\mathbf{x} \in \mathbb{R}^n}
    \sum_{j=1}^m |b_j - (A\mathbf{x})_j|,


    +   3. the **least squares** problem, where the minimization is under the classical
    Euclidean distance in $\mathbb{R}^m:

    find \hat{x} : ||\mathbf{b} - A\hat{x}||_2 = \min_{\mathbf{x} \in \mathbb{R}^n}
    \left( \sum_{j=1}^m |b_j - (A\mathbf{x})_j|^2 \right).


    From an over-determined system:

    $A\mathbf{x} = \mathbf{b}$,


    where $A \in \mathbb{R}^{m \times n}, \mathbf{x} \in \mathbb{R}^n, \mathbf{b}
    \in \mathbb{R}^m$ and $m > n$, the aim is to find a least squares solution of
    the least squares problem:


    find \hat{x} : ||\mathbf{b} - A\hat{x}||_2 = \min_{\mathbf{x} \in \mathbb{R}^n}
    \left( \sum_{j=1}^m |b_j - (A\mathbf{x})_j|^2 \right). \quad (2.10)


    If $\hat{x} \in \mathbb{R}^n$ is a least squares solution of the linear system
    $A\mathbf{x} = \mathbf{b}$, then it satisfies:

    $|\mathbf{b} - A\hat{x}|| \le ||\mathbf{b} - A\mathbf{x}||, \forall \mathbf{x}
    \in \mathbb{R}^n$ \quad (2.11)


    From the linear algebra lemma, $\bar{\mathbf{b}} = A\hat{x}$ is the orthogonal
    projection of $\mathbf{b}$ in $Col(A)$ ($\mathbf{b} - A\hat{x} = \bar{\mathbf{b}}
    \perp \text{Col}(A)$). That is, if $a_j$ is the $j^{th}$-column of matrix $A$,
    then $a_j \cdot (\mathbf{b} - A\hat{x}) = 0, j = 1,\dots,n$. As a result, we get:


    $A^T(\mathbf{b} - A\hat{x}) = A^T\mathbf{b} \quad (2.12)


    Equation (2.12) is called the **normal equations**, and the least squares solution
    $\hat{x}$ is equivalent to solve the normal equations.'
