    # 5.3 MATLAB''s Interpolation Tools


    MATLAB provides many functions for data interpolation. In this section, the MATLAB
    functions interp1, spline and pchip will be discussed.


    # 5.3.1 Interpolation with the interp1 Function


    The MATLAB function `interp1` receives two vectors $x$ and $y$ and a third argument
    which could be a scalar value or a vector. In this case, it interpolates the data
    $(x_j, y_j)$ with piecewise polynomials. To see this, 8 data points will be sampled
    from the function $y = e^{-x}\sin(x)$ in the interval $[0,3]$, then the constructed
    interpolating polynomial will be evaluated at 100 data points. This can be done
    through the following MATLAB commands:


    To construct the sample data points:


    ```

    >> x = linspace(0, 3, 8);

    >> y = exp(-).*sin(x);

    ```


    To define the points s at which the interpolating polynomial will be evaluated:


    ```

    >> s = linspace(0, 3);

    ```


    The function `interp1` is used as follows:


    ```

    >> P = interp1(x, y, s);

    ```


    The function `interp1` joins any two points $(x_j, y_j)$ and $(x_{j+1}, y_{j+1})$
    by straight lines. Hence, the interpolating polynomial is a piecewise-linear'
