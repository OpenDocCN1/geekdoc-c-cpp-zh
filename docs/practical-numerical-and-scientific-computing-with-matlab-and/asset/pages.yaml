    \            Iters += 1\n    return c, Iters\n```\n\n+   [In1]: f = lambda x:\
    \ x**2 - 3\n[In2]: a, b = 1, 2.\n[In3]: Eps = 1e-8\n[In4]: x, Iters = Bisection(f,\
    \ a, b, Eps)\n[In5]: print('Approximate root is:', x, '\\nIterations:',\nApproximate\
    \ root is: 1.7320508062839508\nIterations: 25\n\n# 4.1.2 The Newton-Raphson Method\n\
    \nIf a function $f(x)$ is continuous in the neighbourhood of a point $x_0$, then\
    \ it can be written in the form:\n\n> $f(x) = f(x_0) + f'(x_0)(x-x_0) + \\mathcal{O}((x-x_0)^2)$\n\
    \nNow, if $x_1$ is a root for the function $f(x)$, then $f(x_1) = 0$. That is:\n\
    \n> $f(x_0) + f'(x_0)(x_1-x_0) \\approx f(x_1)$\n\nFrom the above equation:\n\n\
    > $x_1 = x_0 - \\frac{f(x_0)}{f'(x_0)}$\n\nprovided that $f'(x_0) \\neq 0$.\n\
    The Newton-Raphson method is an iterative method for finding an approximation\
    \ to the closest root of the function $f(x)$ to an initial guess $x_0$. Starting\
    \ from $x_0$, it generates a sequence of numbers $x_0, x_1, x_2, \\dots$,\n\n\
    > $x_{n+1} = x_n - \\frac{f(x_n)}{f'(x_n)}$\n\nThis sequence of numbers converges\
    \ to the closest root of $f$ to $x_0$."
