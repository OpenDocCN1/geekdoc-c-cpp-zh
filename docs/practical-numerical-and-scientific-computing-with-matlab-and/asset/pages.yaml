  md: '# (III) Nonlinear terms shall be approximated by using non-local approximations:

    terms like $y^2(t)$ shall be represented by $y^j y^{j+1}$ or $y^{j-1} y^{j+1}$
    instead of

    $(y^j)$, where $y^j \approx y(t_j)$. For example, the discrete model corresponding

    to the logistic model


    ```

    $$\frac{dy}{dt} = y(t)(1-y(t)), y(0) = 0.5$$

    ```


    could be

    $\frac{y^{j+1}-y^j}{h} = y^j(1-y^{j+1}) \Rightarrow y^{j+1} = \frac{y^j(1+h)}{1+h},
    y^0 = 0.5$$


    A Python code nonlocapplog.py is used to solve the logistic model

    using nonlocal approximations. The code is


    ```

