    The python code for the SolveUpperSystem, is as follows.


    ```

    1 import numpy as np

    2 def SolveUpperSystem(A, b):

    3 n = len(b)

    4 x = np.zeros((n, 1), ''float'')

    5 x[n-1] = b[n-1]/A[n-1, n-1]

    6 for i in range(n-2, -1, -1):

    7 x[i] = b[i]

    8 for j in range(i+1, n):

    9 x[i] -= A[i, j]*x[j]

    10 x[i] /= A[i, i]

    11 return x

    ```


