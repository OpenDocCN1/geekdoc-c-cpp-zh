  md: '# Solving Linear Systems with Iterative and Least Squares Methods


    $\{a_n\}_{n=N}^\infty = a_N, a_{N+1}, a_{N+2}, \dots$ of the sequence $\{a_n\}_{n=0}^\infty$.
    To express the convergence of the sequence $\{a_n\}_{n=0}^\infty$ to a mathematically,
    we write


    ```

    $|a_n - a| < \varepsilon, \forall n \ge N$$

    ```


    For example, the sequence


    ```

    $$\begin{cases} \frac{n}{n+1} & n=0 \end{cases} \to 1$ as $n \to \infty$$

    ```


    if we may choose for $\varepsilon > 0$, then


    ```

    $$\left| \frac{n}{n+1} - 1 \right| = \left| \frac{-1}{n+1} \right| < \varepsilon
    \Rightarrow n > \frac{1}{\varepsilon}-1 = \frac{1-\\varepsilon}{\varepsilon}$$

    ```


    and therefore, if we let


    ```

    $N = \left[ \frac{1-\varepsilon}{\varepsilon} \right]$$

    ```


    ```

    $$\left| \frac{n}{n+1} - 1 \right| < \varepsilon.$$$

    ```


    **Definition 2.1** (Convergence of a sequence [46]) Let $\{a_n\}$ be a real-valued
    sequence. We say that the sequence $\{a_n\}$ converges to a real number, if for
    any $\varepsilon > 0$, there exists $N \in \mathbb{N}$ such that:


    ```

    $|a_n - a| < \varepsilon, \forall n \ge N.$$$

    ```


    In this case, we say that the limit of sequence $\{a_n\}$, and we write


    ```

    $$\lim_{n \to \infty} a_n = a$$$

    ```


    It is worthy to notice that $\{a_n\}$ is a convergent (to some limit a), then,


    ```

    $|a_0 - a_1| \ge |a_1 - a_2| \ge \dots \ge |a_n - a_{n+1}| \ge \dots.$$$

    ```


    and


    ```

    $|a_n - a_{n+1}| \to 0,$ as $n \to \infty$$$

    ```


    For example, in the sequence $\{a_n - a_{n+1}\}$, is the corresponding sequence


    ```

    $$\begin{cases} \frac{n}{n+1} \end{cases} (n+1)(n+2),$ is$$

    ```


    ```

    $$\frac{1 1 1 1}{2'' 6'' 12'' 20''} \dots \to 0$ as $n \infty.$$$

    ```


    **Definition 2.2** A sequence $\{a_n\}$ is Cauchy if for any $\varepsilon > 0$,
    there exists $N \in \mathbb{N}$, such that


    ```

    $|a_n - a_m| < \varepsilon,$for all $n, m \ge N.$$$

    ```


    Because $\mathbb{R}$ is complete, any convergent sequence is a Cauchy sequence
    and vice-versa.'
