    (iv) equating the coefficient of $\delta x(t_f)$ to zero, gives the $transversality
    condition$


    ```

    $p(t_f) = - \frac{\partial \varphi(t_f,x(t_f))}{\partial x(t_f)} + \nu^T \frac{\partial
    \Psi(t_f,x(t_f))}{\partial x(t_f)}} \quad (11.14)$

