    sum_{i=0}^{n} L_i(x)y_i \\quad (5.1)$\n\nThe polynomial $P_n(x)$ is of degree\
    \ $n$, because each $L_i(x)$ is an $n^{th}$-degree polynomial, for all $i = 0,\
    \ \\dots, n$. Moreover, $P_n(x)$ satisfies:\n\n$P_n(x) = \\sum_{i=0}^{n} L_i(x)y_i\
    \ = L_j(x)y_j = 1 \\cdot y_j = y_j, \\quad j = 0, \\dots, n$\n\nThis proofs $P_n(x)$\
    \ interpolates the given data.\n\nTo construct the $n+1$ polynomials $L_i(x),\
