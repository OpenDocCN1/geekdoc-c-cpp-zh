    \ of the steepest descent method is that at the beginning converges quickly to\
    \ the optimum solution, but as it comes closer to the solution its convergence\
    \ rate drops rapidly and its progress towards the optimum solution becomes too\
    \ slow [3].\n\n# 10.1.3 Newton's Method\n\nAt iteration $k$, the function $f$\
    \ is approximated near $x^{(k)}$ by a quadratic formula from Taylor series:\n\n\
    $f(x) \\approx f(x^{(k)}) + g(x^{(k)})^T(x-x^{(k)}) + (x-x^{(k)})^T H(x^{(k)})(x-x^{(k)})\
    \ \\quad (10.7)$\n\nThe quadratic function at the right-hand side has a unique\
