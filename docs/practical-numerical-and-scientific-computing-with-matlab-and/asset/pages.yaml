    # 11.4 Numerical Solution of Optimal Control


    The numerical methods for solving optimal control problems are generally divided
    into two classes, the *indirect methods* and the *direct methods*.


    The indirect methods involve forming the optimality conditions using the calculus
    of variations and the Pontryagin maximum principle [10, 54]. These methods transcribe
    the optimal control problem into a set of two-points boundary value problems in
    the state and co-state (adjoint) variables. The resulting equations are then solved
    using the shooting methods [10, 55].


    The direct methods involve the transformation of the optimal control problem into
    a large nonlinear programming problem [11], and then solving the constrained nonlinear
    programming problem using sequential quadratic programming (SQP) methods [12,
    25], are also known as discretize optimize methods, because the problem discretization
    is a prior stage to the optimization process [10].


    The direct methods include


    +   1. the collocation methods, in which both the state and control variables
    are discretized using the collocation methods.


    +   2. the control parameterization methods, in which the control variables are
    parameterized and the optimal control problem, becomes an optimal selection problem
    [32], and,


    +   3. the iterative dynamic programming (IDP), which is an extension to the Bellman
    dynamical programming concept [35].


    A classic example of Optimal Control Software based on an indirect method is MISER3,
    [25]. Dieter Kraft (1985) presented the software package, Trajectory Optimization
    by Mathematical Programming (TOMP), which has numerical solutions of OCPs may
    be calculated by a direct shooting approach [27]. In 2001, J. Kiezenka and L.F.Shamine
    presented the MATLAB code byp4 as an example of an effective application of indirect
    collocation methods to solve the two-point boundary value problems resulting from
    the Pontryagin maximum principle. In 1997, John T. Betts and W.P Hoffman presented
    the Sparse Optimal Control Software (SOCS) [11]. Another FOR-TRAN code DIRCOL
    by O. Von Stryk [1993] is an example of the direct collocation approach [57].'
