  md: '# 70 Ill-Conditioning and Regularization Techniques


    By dividing Equation (3.2) by Equation (3.1) gives:


    $$\frac{\|x\|}{\|A\|\|x\|} \leq \frac{\{\|A^{-1}\| \cdot \\Delta b\|}{\|b\|}$


    from which,


    $$\frac{\|\Delta x\|}{\|x\|} \leq \|A\|\|A^{-1}\| \frac{\|\Delta b\|}{\|b\|}$
    (3.3)


    The number $\kappa(A) = \|A\|\|A^{-1}\|$ is called the **condition number** of
    matrix $A$. The bigger the condition number, the higher the sensitivity of the
    linear system to perturbation on the right-hand side and vice versa. Equation
    (3.3) shows the relationship between the relative change in solution of the linear
    system compared to the relative change in the right-hand side of the linear system.
    Second, if it is assumed that matrix $A$ is changed to $A+\Delta A$ leads to the
    change in the solution $x$ to $x+\Delta x$, then


    $$(A+\Delta A)(x+\Delta x) = b \Rightarrow Ax + A\Delta x + \Delta Ax + A\Delta
    x = b \Rightarrow A\Delta x + \A\Delta x = 0$$


    Multiplying the two sides by $A^{-1}$ gives


    $$\Delta x + A^{-1}\Delta A(x+\Delta x) = 0 \Rightarrow -\Delta x = A^{-1}\Delta
    A(x+\Delta x)$


    By taking the norms for the two sides, we get:


    $$\\|\Delta x\| = \\|A^{-1}\Delta A(x+\Delta x)\| \leq \\|A^{-1}\| \cdot \\|A\|
    \cdot \\|x+\Delta x\|$


    Dividing the two sides by $\|\x+\Delta x\\|$ and multiplying the right-hand side
    by


    $$\frac{\|\Delta x\|}{\|x+\Delta x\\|} \leq \kappa(A) \frac{\|DeltaA\|}{\|A\\|}$
    (3.4)


    Equation (3.4) shows the relationship between the relative change in the solution
    vector $x$ to the relative change in matrix $A$, in terms of the condition number
    of matrix $A$.


    It can be seen that the smaller the condition number of a matrix $A$, the less
    the linear system be sensitive to perturbations, and the resulting system is well-posed.
    Also, the larger condition number, the more sensitive the linear system is to
    perturbations, and the resulting system is ill-posed. The condition number of
    the $3 \times 3$ zero matrix is $\infty$ and for the $3 \times 3$ identity matrix
    is 1. The MATLAB code used can be for finding the condition number of a matrix
    $A$.


    ```

    >> A = [100 1 0; 0 1 2; 0 2 4.003]

    A =

    100.0000      1.0000      0

    0             1.0000      2.0000

    ```'
