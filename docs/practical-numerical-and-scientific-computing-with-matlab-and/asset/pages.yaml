    # 7.5.2 Solving ODEs with Gepko


    GEKKO is a python optimization solver that is originally designed for solving
    dynamic optimization problems for mixed-integer, nonlinear, and differential algebraic
    equations (DAE) problems [2]. The default solver of Gepko is the IPOPT solver
    which is based on the interior point method. It includes others solvers as APOPT,
    BPOPT, SNOPT, and MINOS [2].


    The discretization of state equations is performed by orthogonal collocation on
    finite elements, where each finite element collocation approximates control and
    state variables with polynomials [2].


    To initialize a gepko model in python, the following two instructions are


    ```

    1 from gekko import GEKKO

    2 m = GEKKO(remote = False)

    ```


    Assigning the Value to the parameter remote informs gepko to set the server to
    be the local machine.


    If the model contains a variable $x$ that is bounded from below by $x_{min}$,
    from above by $x_{max}$ and has an initial value $x_0$, then it can be declared
    as


    ```

    x = m.Var(value = x_0, lb = x_{min}, ub = x_{max})

    ```


    Example 7.9 This example uses gepko to solve the SIR:


    > $S(t) = \alpha S(t) - \mu S(t), S(0) = S_0, t \in [0,T]$

    $I(t) = \alpha S(t) - (\mu + \beta)I(t), I(0) = I_0, t \in [0,T]$

    $R(t) = \beta I(t) - \mu R(t), R(0) = R_0, t \in [0,T]$


    with $\alpha = 0.05, \mu = 0.05, \beta = 0.6$ and $T = 25$.


    The gepko python code is:


    ```

    #Solvegepkko.py

    from gekko import GEKKO

    import numpy as np

    import matplotlib.pyplot as plt


    Lambda = 0.05; mu = 0.05; alpha = 2; beta = 0.6

    t0 = 0

    T = 25

    N = 1000

    m = GEKKO(remote=False)

    m.time = np.linspace(0, T, N+1)

    S, R = m.Var(value=0.9), m.Var(value=0.1),nm.Equations()

    m.Equation(S.dt()) == Lambda-alpha*S-mu*S

    m.Equation(I.dt()) == alpha*S-(mu+beta)*I

    m.Equation(R.dt()) == beta*I-mu*R


    m.options.IMODE = 4 # simulation mode

    m.solve()

    ```'
