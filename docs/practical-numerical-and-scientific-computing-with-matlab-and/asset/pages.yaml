  md: '# Nonstandard Finite Difference Methods for Solving ODEs


    Considering the causes leading to numerical instabilities in the standard finite
    difference schemes, four nonstandard construction rules have been established
    by Micken''s for the design of such numerical scheme. These rules are stated in
    [37]:


    +   (I) Using a discrete derivative of order that differs from the order of the
    differential equation can lead to numerical instability, the order of the discrete
    model shall be as same as the order of the differential equation. Under this rule
    the central finite difference scheme cannot be used as an approximation of the
    first derivative in the discrete model of a first-order differential equation.
    Either the forward or backward difference schemes can be used.


    +   (II) Nonstandard denominator functions have been used for the discrete representation
    of the continuous derivative. $\frac{dy}{dt}$ at $t=t_j$ is of the form:


    ```

    $$\frac{dy}{dt} = \frac{y(t_{j+1}) - \psi(\lambda, h)y(t_j)}{\phi(\lambda, h)}$$$

    ```


    where $\lambda$ is a vector of the model''s parameters, $\psi(\lambda, h)$ and
    $\phi(\lambda, h)$ shall fulfill the properties:


    ```

    $$\psi(\lambda, h) \rightarrow 1$ and $\phi(\lambda, h) \rightarrow h$ as $h \rightarrow
    0$$

    ```


    An example to how the use of nontrivial denominator can lead to numerical instability,
    consider the exponentially decay model


    ```

    $$\frac{P(t)}{dt} = -P(t), P(0) = 0.5.$$$

    ```


    In Euler''s method, suppose the nontrivial denominator function $h$ is replaced
    by the denominator function


    ```

    $$\phi(h) = \frac{1-e^{-h}}{h}$$$

    ```


    hence the discrete result model


    ```

    $$\P^{j+1} = (1-\phi)P^j, P^0 = 0.5$$

    ```


    The python code expdecdens.py is used to solve the exponential decay model for
    different values of the step-size $h$:


    ```

    #expdecdens.py

    import numpy as np

    import matplotlib.pyplot as plt

    steps = [0.5, 1.05, 2.5, 5.0]

    plt.figure(1, figsize=(12, 12))

    ```'
