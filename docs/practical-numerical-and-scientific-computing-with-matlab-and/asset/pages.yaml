  md: '# 134 Numerical Differentiation and Integration


    The numerical integration methods work to find definite integral of a function
    $f$ in an interval $[a,b]$, through first partitioning the interval $[a,b]$ by
    points $x_0, x_1, \dots, x_N$, such that $a \le x_0 < x_1 < \dots < x_N \le b$,
    then approximate $I$ by a sum of the form:


    ```

    $I = \int_a^b f(x)dx \approx \sum_{j=0}^N w_j f(x_j) \quad (6.12)$

    ```


    where the different numerical integration methods differ from each other in the
    way by which points $x_i$ are selected and coefficients $w_j$ are calculated.
    Equation (6.12) is called *numerical quadrature*. Hence, the term numerical quadrature
    points to a form, in which an integration formula is approximated by a finite
    sum.


    In this chapter, we discuss two classes of numerical integration methods, namely:
    the Newton-Cotes and Gauss methods.


    # 6.2.1 Newton-Cotes Methods


    In Newton-Cotes methods, the points $x_0, \dots, x_n$ are chosen such that $x_0
    = a < x_1 < \dots < x_n = b$, with $h=(b-a)/n$. The idea behind Newton-Cotes methods
    to approximate $I = \int_a^b f(x)dx$ is to first approximate $f(x)$ by a Lagrange
    polynomial $P_n(x)$ of degree $n$. Then, to approximate $I$ by the integral of
    $P_n(x)$ $[43, 47]$. That is:


    ```

    $\int_a^b f(x)dx \approx \int_a^b \sum_{j=0}^n L_j(x)f(x_j)dx = \sum_{j=0}^n \left(\int_a^b
    L_j(x)dx\right)f(x_j) \quad (6.13)$

    ```


    Hence, the quadrature weights $w_j$ in Newton-Cotes methods are given by:


    ```

    $w_j = \int_a^b L_j(x)dx$

    ```


    The numerical integration formulas for $n=1$ and $n=2$ will be derived and discussed.


    +   (I) $n=1$: when $n=1, h=(b-a)/1=b-a$ and the given data points $(a,f(a))$
    and $(b,f(b))$. The Lagrange interpolating polynomial is


    ```

