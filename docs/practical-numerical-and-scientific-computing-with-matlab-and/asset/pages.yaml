    ```

    $$\int_{t_0}^{t_f} -\mathbf{p}^T(t)\dot{\mathbf{x}}(t)\delta dt = -\mathbf{p}^T(t_f)\delta\mathbf{x}(t_f)
    + \int_{t_0}^{t_f} \mathbf{p}^T(t)\delta\dot{\mathbf{x}}(t)dt$\quad (11.9)$

    ```


