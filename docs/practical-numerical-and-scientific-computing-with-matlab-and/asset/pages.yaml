    \   0  0  2\n```\n\nIn Python, the Jordan form of a matrix $A$ can be found by\
    \ using the method `jacobian_form` of a symbolic matrix.\n\n```\n[1]: import numpy\
    \ as np\n[2]: import numpy as smp\n[3]: A = np.array([[2, 0, 0], [1, 1, -3], [-1,\
    \ -1, -1]])\n[4]: P, J = (smp.Matrix(A)).jordan_form()\n[5]: P, J = np.array(P),\
