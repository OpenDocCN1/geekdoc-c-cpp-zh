  md: "# Other Nonstandard Finite Difference Schemes 237\n\nIn [37] Mickens put the\
    \ rules for selecting the denominator function and dealing with the nonlinear\
    \ terms. Given an initial value problem,\n\n```\n$\\frac{du}{dt}=f(u), u(0)=u_0$$\n\
    ```\n\nTo find the denominator function, the equilibria points of the differential\
    \ equations are calculated by solving:$f(u)=0$ for $u(t)$. Let $u_1, u_2, \\dots,\
    \ u_n$ be the equilibria points of the differential equation.\n\n```\n$r_k=\\\
    left[\\frac{df}{du}\right]_{u=u_k},k=1,\\dots,n$$\n```\n\nand $r=\\max\\{|r_k|,\
    \ k=1, \\dots, n\\}$. Then the denominator function is given by:\n\n```\n$\\phi(r,h)=\\\
    frac{1-e^{-rh}}{r}$$\n```\n\nThe linear and nonlinear terms at the right-hand\
    \ side can be approximated using nonlocal approximations. For a example $u(t)$\
    \ in the differential equation can be approximated at $t_k$ by $2u_k-u_{k+1}$,\
    \ a term $u^2(t)$ in the differential equation can be approximated at $t_k$ by\
    \ $2u_k^2-u_ku_{k+1}$,\n\n**Example 8.4** this example is taken from [37] and\
    \ constructs a nonstandard finite difference scheme for the differential equation:\n\
    \n```\n$\\frac{du}{dt}=u^2(t)-u^3(t),u(0)=u_0$$\n```\n\nThe equilibria points\
    \ of the model are $u_1=u_2=0$ and $u_3=1$. The denominator is $\\phi(h)=1-e^{-h}$.\
    \ The term $u^2(t)$ is approximated at $t_k$ by $2u_k^2-u_ku_{k+1}$ and the nonlinear\
    \ term $-u^3(t)$ is approximated by $-u_k^2u_{k+1}$. The nonstandard finite difference\
    \ scheme is:\n\n```\n$\\frac{u_{k+1}-u_k}{\\phi}=2u_k^2-u_ku_{k+1}-u_k^2u_{k+1}$$\n\
    ```\n\nwhich after few manipulations gives:\n\n```\n$u_{k+1}=\\frac{(1+2\\phi\
    \ u_k)u_k}{1+\\phi(u_k+u_k^2)}$\n```\n\nThe Python script MickPopModel.py implements\
    \ the nonstandard finite difference scheme of Mickens and its solution:\n\n```\n\
    1 import numpy as np\n2 import matplotlib.pyplot as plt\n3 a, b, N=0.0, 25.0,\
    \ 100\n```"
