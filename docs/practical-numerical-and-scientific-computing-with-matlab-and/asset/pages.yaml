    # 5.4.1 The function interpp


    The Python''s function interpp has a similar syntax to the MATLAB function interp1.
    If no kind of interpolation is received, it interpolates the given data cubic
    with linear piecewise polynomials. If it receives the kind (quadratic, cubic,
    etc.), then it interpolates the given data with that kind of continuous piecewise
    polynomial.


    For example, ten equidistant samples from the function


    ```

    $$\cos(4x)\n\frac{1}{1+x}$

    ```


    will be used to interpolate the function with linear, quadratic and cubic piecewise
    polynomials, based on the interp1 function. The Python script interp1d implements
    the interpolation with interp1:


