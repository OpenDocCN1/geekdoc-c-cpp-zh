    ![](img/9923905aaa045c7096d90695cee3e3bc_174_0.png)


    FIGURE 6.9: The distribution of Legendre-Gauss-Lobbatto points in the interval
    $[-1,1]$ for $n=2,3,\dots,11$.


    The numerical quadratures based on $n-1$ are open. That they are not including
    the boundary points $-1.0$ and $1.0$ (hence the integration boundaries $a$ and
    $b$). There is another class of Gauss quadratures that imposes the choice of the
    boundary points $-1.0$ and $1.0$. So, in addition to $x_1=-1.0$ and $x_n=1.0$,
    $n$-points Gauss quadrature may choose the roots of $(1-x^2)P''_{n-1}(x)$ where
    $P''_{n-1}(x)$ is the derivative of the Legendre polynomial of degree $n-1$ with
    $n \ge 2$. This kind of points is referred as as Legendre-Gauss-Lobbatto (LGL)
    points.


    Figure 6.9 shows the Legendre-Gauss-Lobbatto points for different values of $n$.


    The corresponding weights to the $n$-LGL points can be obtained from Equation
    (6.27). For $n=2$ and $n=3$, the resulting quadratures coincide with the trapezoidal
    and Simpson''s rules. For $n \ge 4$ the resulting quadratures are different from
    those obtained by Newton-Codes methods.


    Because the boundary points are enforced to be included in the $n$ LGL-points,
    the accuracy of the method is reduced by 2. Instead of being accurate up to degree
    $2n-1$ they are accurate up to degree $2n-3$.


    The Python code LGLParams includes a function `LGLpw` that receives a positive
    integer $n \ge 2$ and the corresponding $n$-LGL points $-1=x_1 < x_2 < \dots <
    x_n=1$ and weights $w_1, \dots, w_n$. It approximates the definite integral


    ```

    $I = \int_{0}^{2} \frac{x}{1+2x^2}$

    ```


    using 4-LGL points.'
