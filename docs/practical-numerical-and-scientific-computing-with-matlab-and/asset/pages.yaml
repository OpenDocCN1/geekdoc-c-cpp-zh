    $min x_1^2 + 4x_2^2 + 4x_3^2 + x_4^2 + 4x_1x_3 + 4x_2x_4 + 2x_1 + x_2 + x_3 +
    2x_4$


    subject to the inequality constraints:


    | $x_4$ | $\ge$ | 10 |

    | $2x_1 + x_2 + x_3 + 2x_4$ | $\ge$ | 24 |

    | $x_2 + x_3$ | $\ge$ | 20 |

    | $x_1 + x_2 + x_3 + x_4$ | $\le$ | 30 |

    | $0 \le x_1, x_2, x_3, x_4$ | $\le$ | 20 |


    MATLAB has a function quadprog for solving quadratic programming problems. The
    function fmincon can also be used for solving quadratic problems.


    # Solution with quadprog MATLAB''s function


    The MATLAB''s function quadprog receives the matrix $H$, the vector $\alpha$,
    matrix of inequality constraints $C$ and its right-hand side vector $d$, matrix
    of equality constraints $A$ and its right-hand side $b$, and vectors of lower
    bounds $l_b$ and upper bounds $u_b$. It is of the form:


    > [xopt, fval] = quadprog(H, alpha, C, d, b, lb, ub);


    If any of the inputs is missing, it can be replaced by blank brackets []. The
    MATLAB script SolveQuadProg.m is used to solve Example 9.2.


    ```

    % SolveQuadProg.m

    clear; clc;

    H = [2, 0, 4, 0, 8, 0, 4, 0, 8, 0, 4, 0, 2];

    alp = [-2, 0, -1, 2];

    C = [-1, 0, -0, -1, 2, -1, -1, -2, 0, -1, -1, 0, 1, 1, 1];

    d = [-10; -24; -30];

    lb = [0; 0; 0];

    ub = [20; 20; 0];

    [xopt, fval] = quadprog(H, alp, C, d, [], [], ub);

    fprintf(''Optimal solution found at: %s\n'', disp(xopt));

    fprintf(''objective function at optimal point: %10.7f\n'', fval);

    ```


