    $+ + \left( \frac{\partial \varphi}{\partial t_f} + \frac{\partial \varphi}{\partial
    \mathbf{x}}\right)\delta f[t_f] + \nu^T \left( \frac{\partial \varphi}{\partial
    t_f} + \frac{\partial \varphi}{\partial \mathbf{x}}\right)\delta f[t_f] (此处重复)
    + [\mathcal{H}(t) - \mathbf{p}^T(t)\dot{x}(t)]\delta f[t_f]$\

    $+ + \int_{t_0}^{t_f} \left[ \left( \frac{\partial \mathcal{H}}{\partial \mathbf{x}}[t]
    + \mathbf{p}^T(t) \right)\delta \mathbf{x} + \frac{\partial \mathcal{H}}{\partial
    u}\delta u + \frac{\partial \mathcal{H}}{\partial \mathbf{p}}[t] - \dot{x}(t)]\delta
    \mathbf{p} \right] dt$\quad (11.10)$

    ```


    The necessary optimality conditions define a stationary point, at which any arbitrary
    variations in the free variables, result in no change in the total cost [57, 54].
    The first order optimality conditions are given by


    +   (i) equating the coefficient of $\delta\mathbf{u}$ to zero gives


    ```

    $$\frac{\partial \mathcal{H}}{\partial \mathbf{u}}[t] = 0, \quad t_0 \le t \le
    t_f$\quad (11.11)$

    ```


    +   (ii) equating the coefficient of $\delta\mathbf{x}$ to zero gives the adjoint
    equations


    ```

    $$\mathbf{p}^T(t) = -\frac{\partial \mathcal{H}}{\partial \mathbf{x}}[t], \quad
    t_0 \le t \le t_f$\quad (11.12)$

    ```


    +   (iii) equating the coefficient of $\delta\mathbf{p}$ to zeros gives the state
    equations


    ```

    $$\dot{\mathbf{x}}(t) = \frac{\partial \mathcal{H}}{\partial \mathbf{p}}[t] =
    \mathbf{f}(t, \mathbf{x}(t), u(t)), \quad t_0 \le t \le t_f$\quad (11.13)$

    ```'
