- img_proc: true
  md: '# Numerical Differentiation and Integration


    By setting $k=1$ in Equation (6.1) and solving for $f''(x_0)$ the first derivative
    of $f(x)$ at $x=x_0$ is given by:


    ```

    $f''(x_0) = \frac{f(x_0+h)-f(x_0)}{h} + \frac{h}{2}f''''(\xi), \xi \in [x_0,x_0+h]
    \quad (6.3)$

    ```


    Hence, by taking as small possible value of $h \varepsilon \ge 0$, $f''(x)$ can
    be approximated by:


    ```

    $f''(x_0) \approx \frac{f(x_0+h)-f(x_0)}{h} \quad (6.4)$

    ```


    where $\varepsilon$ denotes the machine precision. If $h$ is taken to be less
    than $\varepsilon$, round-off error can affect the accuracy of approximate derivative
    at $x_0$.


    The approximate formula of the derivative $f''(x)''$ in Equation (6.4) is called
    the **forward difference formula.**


    By setting $k=1$ in Equation (6.2) and solving for $f''(x_0)$ the first derivative
    of $f(x)$ at $x=x_0$ is given by:


    ```

    $f''(x_0) = \frac{f(x_0+h)-f(x_0)}{h} - \frac{h}{2}f''''(\eta), \eta \in [x_0,x_0+h]
    \quad (6.5)$

    ```


    from which $f''(x)$ can be approximated by:


    ```

    $f''(x_0) \approx \frac{f(x_0+h)-f(x_0)}{h} \quad (6.6)$

    ```


    where $\varepsilon$ denotes the machine precision. If $h$ is taken to be less
    than $\varepsilon$, round-off error can affect the accuracy of approximate derivative
    at $x_0$.


    The approximate formula of the derivative $f''(x)''$ in Equation (6.4) is called
    the **forward difference formula.** Also, the approximate formula of $f''(x)$
    in Equation (6.6) is called the **backward difference formula** [31].


    The last terms of equations (6.3)


    ```

    $R_2''(x) = \frac{h}{(2)!}f''''''(x), x \in [x_0,x_0+h]$

    ```


    and (6.6)


    ```

    $R_2''''(t) = -\frac{h}{2}f''''''(t), t \in [x_0-h,x_0]$

    ```


    give the *remainders* at points $x \in [x_0,x_0+h]$ and $x_0-h,x_0$, respectively.
    Ignoring the remainder while approximating some function is known as the **truncation
    error.** If $f''''''(x)$ is bounded by a constant $M_1 \in \mathbb{R}^+$ in $[t_0,t_0+h]$
    and by $M_2 \in \mathbb{R}^+$ in $[x_0-h,x_0]$, then:


    ```

    $|R_2''(x)| \le M_1 \cdot h, for x \in [x_0,x_0+h] \quad (6.7)\n|R_2''''(t)| \le
    M_2 \cdot h, for t \in [x_0-h,x_0]. \quad (6.8)$

    ```


    This indicates that the truncation error in both the forward and backward difference
    formulas are $\mathcalO}(h)$.'
