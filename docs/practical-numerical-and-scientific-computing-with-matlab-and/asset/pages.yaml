  md: "# MATLAB ODE Solvers\n\n# 7.4 MATLAB ODE Solvers\n\nMATLAB provides many routines\
    \ to solve systems of first differential equations. In this lecture we will discuss\
    \ how the MATLAB function ode45 can be used for solving a system of first order\
    \ initial value problems (IVPs) of ordinary differential equations.\n\n# 7.4.1\
    \ MATLAB ODE Solvers\n\nThere are two general classes of ODE solvers in MATLAB:\
    \ solvers for non-stiff problems, and solvers for stiff problems.\n\n+   **Non-stiff\
    \ problems solvers:**nLAB has three solvers for non-stiff problems: ode23, ode45\
    \ and ode113.\n\nThe ode23 is of low order that integrates a system of first-order\
    \ differential equations using second and third order explicit Runge-Kutta methods.\n\
    \nThe ode45 is of medium order that integrates a system of first-order equations\
    \ using fourth and fifth order explicit Runge-Kutta methods. It is more accurate\
    \ than ode23 in solving non-stiff problems.\n\nThe ode113 solver belongs to the\
    \ Adams-Bashforth-Moulton predictor-corrector pairs of 1 to 13. Therefore, the\
    \ ode113 is a low to medium ODE solver. In many problems it is more efficient\
    \ than the ode45 solver.\n\n+   **Stiff problems solvers** MATLAB possesses five\
    \ solvers for solving stiff problems. They are ode15s, ode23s, ode23t, ode23b\
    \ and ode15i.\n\n# 7.4.2 Solving a Simple IVP\n\nWe consider an IVP of the:\n\n\
    ```\n$\\\frac{dy}{dt} = f(t,y)), t \\in [t_0, t_1], \\quad (7.6)$\n$y(t_0) = y_0\
    \ \\quad (7.7)$\n```\n\nTo solve the IVP (7.6)-(7.7), we have to write a function,\
    \ which returns the right-hand side of Equation (7.6). This can be done as follows:\n\
    \n```\nfunction z = fp(t, y)\nz = f(t, y) ;\n```\n\nNow from the command window\
    \ (or a MATLAB script), we can define the time period, the initial condition and\
    \ call the ode45 function to solve the IVP. We do this as follows:"
