    A quadrature based on $n$ Gauss-Legendre points integrates polynomials of degree
    $2n-1$ or less. Including the inclusion of the two boundary points as Legendre-Gauss-Lobatto
    points increases the accuracy by 2 to $2n-3$.


    Another class of Gauss points is the Legendre-Gauss-Radau (LGR) points in which
    one boundary point is selected among the $n$ points. The LGR-points are the roots
    of $P_{n-1}(x)+P_n(x)$, where $P_n(x)$ is the Legendre polynomial'
