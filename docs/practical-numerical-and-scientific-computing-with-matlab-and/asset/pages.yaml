  md: "# Solving Systems of Nonlinear Ordinary Differential Equations\n\n| c | A |\
    \ 0 | 0 | ... | 0 | 0 |\n|---|---|---|---|---|---||}{\n| | $b^t$ | 0 | $a_{21}$\
    \ | ... | 0 | 0 |\n| | $c_3$ | $a_{31}$ | $a_{32}$ | ... | 0 |\n| | | ... | ...\
    \ | ... | | |\n| | $c_M$ | $a_{M1}$ | $a_{M2}$ | ... | $a_{M-1}$ | 0 |\n| | |\
    \ $b_1$ | $b_2$ | ... | $b_{M-1}$ | $b_M |\n\nIn an explicit Runge-Kutta method,\
    \ the function slope at a point $x_i^{(k)}$ depends only on the slopes at previous\
    \ points $x_i^{(1)}, \\dots, x_i^{(k-1)}$. The most important explicit Runge-Kutta\
    \ methods are the Euler's methods, Heun's method and the classical fourth-order\
    \ Runge-Kutta method [16].\n\n# 7.2.1 Euler's Method\n\nThe simplest explicit\
    \ Runge-Kutta method is the Euler method, whose Butcher tabular is:\n\n| c | A\
    \ | 0 | 0 |\n|---|---|---||}{\n| | $b^t$ | 0 | 1 |\n\nand is derived from:\n\n\
    $y(x_{i+1}) = y(x_i) + h_i f(x_i, y(x_i)) + \\mathcal{O}(h^2)$\n\nas\n\n$y^{i+1}\
    \ = y^i + h f(x_i, y(x_i))$ (7.5)\n\nwhere $y^i \\approx y(x_i)$ and $h = \\max(h_i,\
    \ i=1, \\dots, N)$.\nBecause the local truncation error in Euler's method is $\\\
    mathcal{O}(h^2)$, the approximation of the method is $\\mathcal{O}(h)$, as the\
    \ summation of the local truncation errors of $N$ subintervals is $\\mathcal{O}(N\
    \ \\cdot h^2) = \\mathcal{O}(h)$.\n\n**Example 7.1 (solving initial value problem\
    \ with Euler's method)** In this example, the Euler's method will be used to solve\
    \ the initial value problem\n\n$\\frac{dy}{dt} = t - 2ty, y(0) = 1, \text{ for\
    \ } t \\in [0, 2]$.\n\nTo apply Euler's method, the interval $[0,2]$ is divided\
    \ into $N$ subintervals (each of length $h=2/N$) by the points $t_0=0 < t_1 <\
    \ \\dots < t_N=2$, where $t_j=t_0+h$ and $t_{j+1}=t_j+h=2/N$. At a point $t_j$,\
    \ the solution function $y(t_j)$ is approximated by $y_j$.\n\nStarting from the\
    \ point $(t_0, y_0)=(0,1)$, Euler's method use the difference formula:\n\n$y_{j+1}\
    \ = y_j + h f(t_j, y_j) = y_j + h(t_j-2t_jy_j), j=0,1,\\dots,N-1$\n\nto approximate\
    \ $y$ at $t_{j+1}$ giving $y_{j+1}$.\n\nThe exact solution of the initial value\
    \ problem\n\n$\\dot{y}(t) = t - 2ty, y(0) = 1$"
