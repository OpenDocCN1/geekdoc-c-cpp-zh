    or free.


    The minimum of $J(u)$ is determined by computing the variation $\delta J$ with
    all the free variables and equating it to the zero $i.e.$ $\delta J = 0$.


    ```

    $$\delta J = \frac{\partial \Psi(t_f, \mathbf{x}(t_f))}{\partial t_f}\delta t_f
    + \frac{\partial \Psi(t_f, \mathbf{x}(t_f))}{\partial \mathbf{x}}\delta \mathbf{x}
