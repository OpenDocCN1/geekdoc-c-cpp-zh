    **Remark 2.3** When approximating a function $f(x)$ by a polynomial $P_n(x)$ of
    degree $n$ in the interval $[0,1]$, the resulting coefficient matrix is called
    Hilbert matrix. The Hilbert matrix of type $n \times n$ ($H_n$) is given by:


    ```

    $H_n = \begin{pmatrix} 1 & 1/2 & 1/3 & \dots & 1/n \ 1/2 & 1/3 & 1/4 & \dots &
    1/(n+1) \ 1/3 & 1/4 & 1/5 & \dots & 1/(n+2) \ \vdots & \vdots & \vdots & \ddots
    & \vdots \ 1/n & 1/(n+1) & 1/(n+2) & \dots & 1/n \end{pmatrix} \quad (2.25)$

    ```


    MATLAB has a function hilb, which receives an integer $n$ and return the corresponding
    Hilbert matrix $H_n$.


