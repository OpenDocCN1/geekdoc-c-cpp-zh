  md: "# The Iterative Methods\n\n[ 1.00000002]\n[-1.00000002]]\n\n# 2.2.3.1 The Gauss-Seidel\
    \ Iterative Method\n\nThe Gauss-Seidel method is close to the Jacobi method, but\
    \ it benefits from the recently updated variables $x_1^{(k+1)}, ..., x_{i-1}^{(k+1)}$\
    \ in iteration $k+1$ to update $x_i^{(k+1)}$, whereas the other variables $x_i^{(k+1)},\
    \ ..., x_n^{(k)}$ are taken from the previous iteration $k$. The Gauss-Seidel\
    \ is of the form:\n\n```\n$a_{11}x_1^{(k+1)} = b_1 - a_{12}x_2^{(k)} - ... - a_{n1}x_n^{(k)}$\n\
    $a_{21}x_1^{(k+1)} + a_{22}x_2^{(k+1)} = b_2 - a_{23}x_3^{(k)} - ... - a_{n2}x_n^{(k)}$\n\
    $:\n$a_{ai}x_i^{(k+1)} + ... + a_{in}x_n^{(k+1)} = b_i - a_{ai,i+1}x_{i+1}^{(k)}\
    \ - ... - a_{in}x_n^{(k)} \\quad (2.5)$\n$:\n$a_{n1}x_1^{(k+1)} + ... + a_{nn}x_n^{(k+1)}\
    \ = b_n$\n```\n\nFrom equation (2.5),\n\n```\n$x_1^{(k+1)} = \frac{1}{a_{11}}(b_1\
    \ - a_{12}x_2^{(k)} - ... - a_{n1}x_n^{(k)})$\n$x_2^{(k+1)} = \frac{1}{a_{22}}(b_2\
    \ - a_{21}x_1^{(k+1)} - a_{23}x_3^{(k)} - ... - a_{n2}x_n^{(k)})$\n$:\n$x_i^{(k+1)}\
    \ = \frac{1}{a_{ii}}(b_i - a_{ai1}x_1^{(k+1)} - ... - a_{ii,i-1}x_{i-1}^{(k)}\
    \ - a_{ii,i+1}x_{i+1}^{(k)}) \\quad (2.6)$\n$... - a_{in}x_n^{(k)}$\n$:\n$x_n^{(k+1)}\
    \ = \frac{1}{a_{nn}}(b_n - a_{n1}x_1^{(k+1)} - ... - a_{nn,n-1}x_{n-1}^{(k+1)})$\n\
    ```\n\nThe following MATLAB function implements the Gauss-Seidel method in the\
    \ equation format:\n\n```\nfunction [x, Iters] = GaussSeidel(A, b, Eps, x0)\n\
    \  Iters = 1 ;\n  x = zeros(size(x0)) ; n = length(b) ;\n  for i = 1 : n\n   \
    \ x(i) = b(i);\n    for j = 1 : i-1\n      x(i) = x(i)-A(i,j)*x(j);\n    end\n\
    \  end\n```"
