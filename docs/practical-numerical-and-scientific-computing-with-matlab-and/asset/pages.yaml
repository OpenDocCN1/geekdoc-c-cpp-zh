    The continuous optimal control problem described by the equations (11.25), (11.26),
    (11.27), (11.28) and (11.29) is transformed into the discrete nonlinear programming
    problem:


    ```

    $$\minimize_{u\in\mathbb{R}^{m(1+N_c)}} \varphi(x) + \frac{h}{3}(L_0^0 + L_N^0)
    + \frac{4h}{3}L_i^{2i-1} + \frac{2h}{3}L_i^{2i} \quad (11.34)$

    ```


    subject to:


    ```

    $x^{i+1} - x^i - \frac{h}{6}(k_1 + 2k_2 + 2k_3 + k_4) = 0 \quad (11.35)$

    ```


    subject to the initial condition


    ```

    $x(x^0) - x^0 = 0 \quad (11.36)$

    ```


    subject to the equality constraints:


    ```

    $E(x^i) = 0, \quad i=0,1,2,...,N, \quad (11.37)$

    ```


    the inequality constraints:


    ```

    $I(x^i) \leq 0, \quad i=0,1,2,...,N, \quad (11.38)$

    ```


    Finally both the control variables $u_k, k=1,2,...,m$ and the state variables
    $x_{i,j}$ are mapped into one vector $\mathbf{Y}$. $x_i^j$ is mapped into $\mathbf{Y}(i-(i-1)N+j),
    i=1,2,...,m; j=0,1,...,N$ and $u_k^i$ is mapped into $\mathbf{Y}((k-1)+n+(n-1)N+(k-1)),
    k=1,2,...,m; l=0,1,...,N$. The total length of the vector $\mathbf{Y}$ is $n(1+N)+m(1+N_c)$.


    The problem described by (11.31), with the constraints (11.35) and (11.37) then
    becomes:


    ```

    $$\minimize_{\mathbf{Y}\in\mathbb{R}^{n(1+N)+m(1+N_c)}} \Psi(\mathbf{Y})$

    ```


    subject to the equality and inequality constraints:


    ```

    $E(\mathbf{Y}) = 0, \n$I(\mathbf{Y}) \leq 0$

    ```


    and subject to the initial conditions:


    ```

    $$\mathbf{Y}(i-1+(i-1)N)-x_i^0 = 0, \quad i=1,2,...,n$

    ```


