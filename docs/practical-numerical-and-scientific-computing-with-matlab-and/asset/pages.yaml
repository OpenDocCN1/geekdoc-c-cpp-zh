    # 8.3.1.2 Exact Finite Difference Scheme for Linear Homogeneous Second Order ODE


    Example 8.2 (second order ODE [39]) In this example, the exact finite difference
    scheme will be established for solving the second order BVP:


    ```

    $$\frac{d^2u}{dt^2}(t)+\omega^2u(t)=0, u(0)=u_0, u(2)=u_1$

    ```


    The characteristic equation corresponding to the given BVP


    ```

    $r^2+\omega^2=0$,

    ```


    whose solutions are


    ```

    $r_{1,2}=\pm\omega i$.

    ```


    Hence, the bases solution functions of the BVP


    ```

    $u_1(t)=\sin(\omega t)$ and $u_2(t)=\cos(\omega t)$.

    ```


    Consider the determinant:


    | u^{j-1} | \cos(\omega t_{j-1}) | \sin(\omega t_{j-1}) | |

    | u^j | \cos(\omega t_j) | \sin(\omega t_j) | = 0. |

    | u^{j+1} | \cos(\omega t_{j+1}) | \sin(\omega t_{j+1}) | |


    Using the trigonometric identity $\cos(b)-\cos(a)=\sin(a-b)\sin(b)$ and remembering
    that $t_{j+1}-t_j=t_j-t_{j-1}=h, 1-t_{j-1}=2h$ the determinant is expanded into


    ```

    $$\sin(\omega t)u^{j-1}-\sin(2\omega t)u^j+\sin(\omega t)u^{j+1}=0 \Rightarrow
    u^{j-1}-2\cos(\omega t)u^j+u^{j+1}=0$

    ```


    Subtracting $2u^j$ from adding $2\cos(\omega t)$ to the sides and using the trigonometric
    identity $\cos(x)=1-2\sin^2(\frac{x}{2})$ gives:


    ```

    $u^{j-1}-2u^j+u^{j+1}=-4\sin^2(\frac{\omega h}{2})u^j \Rightarrow u^{j-1}-2u^j+u^{j+1}=-\frac{4}{\omega^2}\sin^2(\frac{\omega
    h}{2})\omega^2u^j$

    ```'
