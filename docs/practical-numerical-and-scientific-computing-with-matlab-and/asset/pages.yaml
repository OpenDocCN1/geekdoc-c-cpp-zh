  md: "# Explicit Runge-Kutta Methods\n\nThe formulas (7.3) and (7.4) define the M-stage\
    \ Runge-Kutta method. If the coefficients $a_{ij}=0$ for all $l > j$ the resulting\
    \ Runge-Kutta method is explicit. If $a_{ij}=0$, for all $l > j$, but $a_{jj}\
    \ \neq 0$ for some $j$, the method is semi-explicit. Otherwise it is implicit\
    \ [14].\n\nThe quantity $\\xi_j = y(x_j^{(1)} + \\sum_{l=1}^M b_{lj} f(x_l^{(j)},\
    \ y_l^{(j)})) - y(x_j^{(M)})$ defines the local truncation error of the M-stage\
    \ Runge-Kutta method. The M-stage Runge-Kutta method is defined of order $P \\\
    in \\mathbb{N}$, if its truncation error is $\\mathcal{O}(h^{P+1})$, where $h\
    \ = \\max_{i=0,\\dots,N} |h_i|$.\n\nThe order of the M-stage Runge-Kutta method\
    \ is achieved by satisfying conditions on the coefficients $(a_{ij}),b_i$ and\
    \ $c_i$, $i,j \\in \\{1,\\dots,M\\}$. Butcher [14] stated the number of conditions\
    \ on an implicit M-stage Runge-Kutta method, to be of order $P$ as in table (7.1).\n\
    \nTABLE 7.1: The number of restrictions on a P-order implicit Runge-Kutta method\n\
    \n| Order (P) | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n| Number of Restrictions | 1\
    \ | 2 | 4 | 8 | 17 | 37 | 85 | 200 |\n\nIn Table (7.2) we state the conditions\
    \ on the coefficients $(A,b,c)$ for the M-stage Runge-Kutta methods up to order\
    \ four. A method of order $P$ if it satisfies all the conditions from 1 to $P$.\n\
    \nTABLE 7.2: The relationships between the order of the M-stage-method\n\n| Order\
    \ | Conditions |\n| 1 | $\\sum_{i=1}^M b_i = 1$ |\n| 2 | $\\sum_{i=1}^M b_i a_{ij}\
    \ = \\frac{1}{2}$ |\n| 3 | $\\sum_{i=1}^M b_i c_i^2 = \\frac{1}{3}$, $\\sum_{i=1}^M\
