    The formula in Equation (6.10) is called the central difference formula.

    If $|f''''''(x)| \in \mathbb{R}^+$, then the approximation error of central difference

    formula is bounded by $M/h^2$ which means that the difference for-

    mula is $O(h^2)$ method.


