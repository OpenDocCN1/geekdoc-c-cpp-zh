  md: '# Exact Finite Difference Schemes


    Now, equation (8.5) can be written as


    $$\frac{dz}{dt} = PJP^{-1}z.$


    Multiplying the two sides of equation (8.5) by $P^{-1}$ and using the linear transformation


    $u(t) = P^{-1}z(t)$


    Equation (8.5) can be written as


    $$\frac{du}{dt} = Ju \quad (8.6)$


    The solution of the linear system (8.5) is obtained by solving the linear system
    (8.6) and using the linear transformation


    $z(t) = Pu(t).$


    In [48], the exact finite difference schemes are derived for the three kinds of
    Jordan forms. The author proved that the linear system (8.6) has an exact finite
    difference scheme of the form:


    $$\frac{u^{j+1}-u^j}{\phi} = J(\theta u^{j+1} + (1-\theta)u^j) \quad (8.7)$


    where $\phi$ and $\theta$ are to be determined in terms of the step-size $h$ and
    the eigenvalues of $A$. The functions $\phi$ and $\theta$ are as follows:


    +   I. In the case that matrix $A$ has two distinct roots $\lambda_1$ and $\lambda_2$,
    that is


    $$\J = \begin{bmatrix} \lambda_1 & 0 \ 0 & \lambda_2 \end{bmatrix}$$


    $$\phi$ and $\theta$ are


    $$\phi = \frac{(\lambda_1-\lambda_2)(e^{\lambda_1h}-1)(e^{\lambda_2h}-1)}{\lambda_1\lambda_2(e^{\lambda_1h}-1)(e^{\lambda_2h}-1)}$


    and


    $$\theta = \frac{\lambda_2(e^{\lambda_1h}-1)-\lambda_1}{(\lambda_1-\lambda_2)(e^{\lambda_1h}-1)(e^{\lambda_2h}-1)}$


    +   II. In the case that $A$ has a repeated eigenvalue $\lambda$ and $\text{Dim}(A-\lambda
    I) = 2$, that is


    $$\J = \begin{bmatrix} \lambda & 0 \ 0 & \lambda \end{bmatrix}$$


    then,


    $$\phi = \frac{e^{\lambda h}-1}{\lambda(e^{\lambda h}-1)+\lambda}$'
