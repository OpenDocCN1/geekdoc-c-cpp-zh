    z(t) = \\begin{bmatrix} x(t) \\ y(t) \\end{bmatrix}\n```\n\nand, $a,b,c$ are real\
    \ numbers.\nMatrix $A$ is similar to its Jordan form $J \\in \\mathbb{R}^{2\\\
    times2}$, hence there exists an invertible matrix $P \\in \\mathbb{R}^{2\\times2}$\
    \ such that $J = P^{-1}AP$. The diagonal elements of $J$ are the eigenvalues of\
    \ $A$ and the columns of $P$ are the eigenvectors or generalized eigenvectors\
    \ of $A$. The Jordan form of $J$ has one of three forms:\n\n```\nJ = \\begin{bmatrix}\
    \ \\lambda_1 & 0 \\ 0 & \\lambda_2 \\end{bmatrix} or \\begin{bmatrix} \\lambda\
    \ & 0 \\ 0 & \\lambda \\end{bmatrix} or \\begin{bmatrix} \\lambda & 1 \\ 0 & \\\
    lambda \\end{bmatrix}\n```\n\nwith $\\lambda_1 \\neq \\lambda_2 \\neq 0$ and $\\\
    lambda \\neq 0$.\n\nIn MATLAB, the Jordan form of a matrix $A$ can be found by\
    \ using the MATLAB function `jacobian`, which returns the matrices $P$ and $J$.\n\
    \n```\n>> A = [2, 0; 0, 1; -3; -1, -1, -1];\n>> [P, J] = jordan(A);\n>> disp('P\
    \ = ' ' ); disp(P);\nP =\n   1.2500e-01  1.5000e+00\n   1.2500e-01  -5.0000e-01\
