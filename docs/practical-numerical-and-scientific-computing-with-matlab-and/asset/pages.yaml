    \ It replaces $f'(x_n)$ by the finite difference formula:\n\n```\n$f'(x_n) \\\
    approx \\frac{f(x_n) - f(x_{n-1})}{x_n - x_{n-1}}$\n```\n\nHence, the secant method\
    \ is of the form:\n\n```\n$x_{n+1} = x_n - \\frac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})}f(x_n)$\n\
    ```\n\nStarting from some interval $[a,b]$ that contains a root of $f(x)$, the\
    \ secant method iteration approaches the zero of $f(x)$ in $[a,b]$.\nThe MATLAB\
    \ function *Secant* implements the secant method. It receives a function $f$,\
    \ the limits of the interval $[a,b]$ that contains the root of $f$ and a tolerance\
    \ $\\varepsilon > 0$. It allows the method to return an approximate solution $x$\
    \ and the number of iterations *Iterations*\n\n```\nfunction [x, Iterations] =\
    \ Secant(f, a, b, Eps)\n    x = b - ((b-a)*f(b)) / (f(b)-f(a));\n    Iterations\
    \ = 1;\n    while fabs(f(x)) >= Eps\n        a = b;\n        b = x;\n        x\
    \ = b - ((b-a)*f(b)) / (f(b)-f(a));\n        Iterations = Iterations + 1;\n  \
