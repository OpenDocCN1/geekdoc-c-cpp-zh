    ```\n\n```\nfunction x = SolveWithTikhonov(A, b, Alpha)\n[U, S, V] = svd(A);\n\
    D = diag(S);\n[m, n] = size(A);\nx = zeros(m, 1);\nfor i = 1:n\n    x = x + U(:,\
    \ i).*b*D(i)/(D(i)^2+Alpha)*V(:, i);\nend\n```\n\nIn Tikhonov regularization further\
    \ smoothing be imposed on the vector of solution $x$, by imposing the smoothness\
