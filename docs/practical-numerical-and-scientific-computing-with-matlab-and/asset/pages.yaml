    ''active-set'', ''Display'', ''MaxIter'', inf,

    ''MaxFunvals'', inf, ''TolFun'', le-6, ''TolX'', ...

    ''TolFun'', le-6);

    [x,val] = mincon(SIRObjective, x0, [], [], [], [], [], [], Options);

