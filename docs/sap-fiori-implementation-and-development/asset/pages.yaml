  md: '# 7.2 SAP Gateway Service Builder


    SAP Gateway translates complex data structures into easy-to-consume OData services.
    The SAP Gateway Service Builder is the central interface of SAP Gateway (access
    via Transaction SEGW). The SAP Gateway Service Builder includes both the code-based
    development of OData services for experienced developers and noncode-based generation
    of services for less experienced developers. We’ll cover only the noncode-based
    development services in this book.


    The SAP Gateway Service Builder contains all relevant functions for the modeling
    and development of OData services in SAP Gateway. It supports the entire development
    lifecycle of an OData service in SAP Gateway. The SAP Gateway Service Builder’s
    main objective is to provide comprehensive support for building OData services
    in a declarative way or by reusing existing objects in the SAP Business Suite
    system. Later, you’ll see a data model in SAP Gateway Service Builder. This modeling
    environment follows a project-based approach, and all relevant data is consolidated
    in these projects.


    Now that you understand the entities, entity types, entities, associations, and
    so on from the service document and service metadata document, let’s explore them
    in the SAP Gateway Service Builder. To begin, you must first navigate to the SAP
    Gateway Service Builder by following these steps:


    +   1. Log in to the SAP Gateway server.

    2. Open the SAP Gateway Service Builder by running Transaction SEGW.

    3. Open a project by clicking.

    4. Enter the Create Sales Order project details “SRA017_SALESORDER_CREATE” in
    the PROJECT field, and press Figure 7.13.


    ![](img/45a7493fede9b923b78389c8563e03c4_268_0.png)


    Figure 7.13 Create Sales Order Project


    You should now see the SALES ORDER ORDER CREATION project (see Figure 7.14).'
