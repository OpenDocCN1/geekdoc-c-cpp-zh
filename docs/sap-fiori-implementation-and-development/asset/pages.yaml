    # 1.2.2 SAP Web Dispatcher


    Depending on the type of SAP Fiori app you are running (transactional, fact sheet,
    or analytical), the queries are directed by the SAP Web Dispatcher from the client/browser
    to the ABAP frontend or SAP HANA XS. It is not mandatory to use the SAP Web Dispatcher
    if you are implementing transactional apps, however for analytical apps and fact
    sheet apps you need to configure the SAP Web Dispatcher.


    40'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'When a user runs an analytical app, requests are forwarded from the client
    to the SAP HANA XS engine by the SAP Web Dispatcher. Similarly, when a user runs
    a fact sheet app, requests are forwarded from the client to the ABAP backend system
    by the SAP Web Dispatcher. The SAP Web Dispatcher may act either as a simple service
    provider or actively participate in the exchange between a client and server.


    The SAP Web Dispatcher is capable of intercepting, inspecting, and interacting
    with requests and responses. Interacting with requests and responses enables more
    advanced traffic management services such as application layer security, web acceleration,
    page routing, and secure remote access. The SAP Web Dispatcher also provides the
    ability to direct requests based on a wide variety of parameters such as user
    device, location, network conditions, and even the time of day.


    Common uses for the SAP Web Dispatcher:


    +   * Load balancing

    The SAP Web Dispatcher is most commonly used to provide load balancing services
    for scalability and availability. Increasingly, the SAP Web Dispatcher is also
    used as a strategic point in the network to enforce web application security through
    web application firewalls, application delivery firewalls, and deep inspection
    to mitigate data leaks. The SAP Web Dispatcher can also be deployed to offload
    services from applications as a way to improve performance through acceleration,
    intelligent, and caching.


    +   * Web acceleration

    The SAP Web Dispatcher can compress inbound and outbound data, as well as commonly
    requested content, both of which speed up the flow of traffic between the browser
    and the ABAP servers or SAP HANA XS. The SAP Web Dispatcher can also perform additional
    tasks such as SSL encryption to take the load off your web servers, thereby boosting
    their performance.


    +   * Security and anonymity

    By intercepting requests for your backend servers, the SAP Web Dispatcher protects
    the request identities and acts as an additional defense against security attacks.
    It also ensures that multiple servers can be accessed from a single record locater
    or URL, regardless of the structure of your local area network.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 1.2.3 Communication Channels


    It is vital that different layers in SAP Fiori are able to communicate with one
    another. In this section, we''ll discuss how data is transferred between the client,
    ABAP frontend, ABAP backend, and SAP HANA XS. In doing so, we''ll highlight the
    different communication channels and protocols that are implemented in the SAP
    Fiori system landscape. Figure 1.16 shows the high level SAP Fiori architecture
    with the communication channels and protocols.


    ![](img/45a7493fede9b923b78389c8563e03c4_41_0.png)


    As shown in Figure 1.16, the communication type between the client and the SAP
    Web Dispatcher depends on the type of application that the user is running in
    the client/browser or the type of task that the user is performing. For example,
    when a user runs a fact sheet app, the client sends an INA search request.


    The communication between the SAP Web Dispatcher and the ABAP servers depends
    on the type of request the SAP Web Dispatcher forwards from the client to the
    ABAP servers:'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# ABAP frontend server (transactional apps)


    +   - HTML requests

    - OData requests


    # ABAP backend server (fact sheets apps only)


    +   - INA search requests


    A trusted RFC connection is established for communication between the ABAP frontend
    server and the ABAP backend server. Data and services are provided from the ABAP
    backend server to the ABAP frontend server using OData services.


    Communication between the SAP Web Dispatcher and SAP HANA XS only when a user
    runs analytical apps. The SAP Web Dispatcher forwards the OData request from the
    client to SAP HANA XS.


    Understanding how each of these components speak with one another is useful when
    errors or issues arise.


