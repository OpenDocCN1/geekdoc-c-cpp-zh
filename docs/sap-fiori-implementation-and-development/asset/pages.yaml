  md: '# Extend the UI Layer with the SAP Web IDE


    The Fact Sheet Editor plugin in the SAP Web IDE allows developers to create fact
    sheets from scratch and extend existing sheets (refer to Section 10.1). The beauty
    of the SAP IDE is that you can connect to the ABAP system and preview the fact
    sheet. In this section, you''ll extend the fact sheet app with the SAP Web IDE
    by following detailed steps.


    # Retrieve the BSP Application and Annotation File


    Before we take a deep dive into this process, let''s first get the details of
    the BSP application and the annotation file details of the SAP Order fact sheet
    app. Search for "Sales Orders" in the SAP Fiori apps reference library at https://fiorilibrary.hana.ondemand.com/sap/fix/externalViewer/index.html,
    and navigate to the EXTENSIBILITY section (see Figure 10.53).


    | Extensibility of the UI application the front-end server. |

    | Component | Technical Name |

    | BSP containing SAPUIS application | BSCN_ANF_SDSLLS |

    | Annotation XML (Fact Sheet Only) | BSCN_SALES_ORDER_SRV_ANNO.xml |


    **Figure 10.53** Sales Order Fact Sheet Technical Names


    # Select a Template


    The next step is to extend the UI layer of the app using an SAP standard fact
    sheet app template. Follow these steps:


    +   1. Log in the SAP Web IDE, and click New PROJECT FROM TEMPLATE (see Figure
    10.54).


    ![](img/45a7493fede9b923b78389c8563e03c4_419_0.png)


    **Figure 10.54** Creating a New Project from Template'
