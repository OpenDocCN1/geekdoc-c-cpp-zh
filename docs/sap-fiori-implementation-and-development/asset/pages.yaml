  md: 'This chapter demonstrates how to create and extend a fact sheet app and provides
    a complete example app to illustrate the extension process.


    # 10 Creating and Extending Fact Sheet Apps


    In this chapter, we''ll show you how to create and extend fact sheet apps. We''ll
    start with a brief introduction into the various layers of the system landscape
    of fact sheet apps, and we''ll highlight the steps to create and extend them.
    To recap, fact sheet apps display contextual information about central objects
    that are used in your business operations. You can drill down from one fact sheet
    to another fact sheet, and you can call fact sheets from SAP Fiori Launchpad.
    Fact sheet apps run only on an SAP HANA database, and they require an ABAP stack.


    Figure 10.1 shows the system landscape of fact sheet apps. The landscape is comprised
    of two layers: the user interface (UI) layer that contains the product-specific
    UI add-ons, SAPUI5 control library, and SAP Fiori Launchpad, and the SAP Business
    Suite layer that contains the search model.


    ![](img/45a7493fede9b923b78389c8563e03c4_388_0.png)


    Figure 10.1 Fact Sheet Apps Architecture'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'Fact sheet apps are created or extended from annotation files in an XML format,
    which are based on semantic and object structure. A fact sheet is represented
    by a combination of a search model, OData service, and the Business Server Page
    (BSP) application. Fact sheet apps can be extended by enhancing one or multiple
    layers. As explained in Chapter 9, you can create new SAP Fiori apps from scratch
    or extend existing SAP Fiori apps.


    | Checklist |

    | You''ll use the following in the chapter:

    | Search and Analytics Modeler

    | Connector Administrator Cockpit

    | SAP Web IDE |


    # 10.1 Enabling the Fact Sheet App Editor Plugin


    In Chapter 8, we introduced you to the SAP Web IDE and walked you through the
    various options that are available with this tool. Next, we need to enable the
    Fact Sheet Editor plugin in the SAP Web IDE to create or extend fact sheet apps.
    Followlow these steps:


    +   1. Log in to the SAP Web IDE.'
