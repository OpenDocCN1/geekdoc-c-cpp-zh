  md: 'This chapter provides an overview of the SAP Web IDE and how it can be used
    to create or extend SAP Fiori apps.


    # 8 Introduction to SAP Web IDE


    The SAP Web Integrated Development Environment (SAP Web IDE) is the environment
    used to create and extend SAP Fiori apps. In this chapter, we''ll take a deep
    dive into the SAP Web IDE to see how it works. We''ll begin in Section 8.1 with
    an overview of the SAP Web IDE and how to leverage this tool in conjunction with
    developing and extending SAP Fiori applications. In Section 8.2, we''ll show how
    to set up SAP Web IDE with the SAP HANA Cloud Platform (SAP HCP).


    Finally, in Section 8.3, we''ll turn our attention to the technical aspects of
    this tool and look at the different phases of the end-to-end SAP Fiori application
    development process, from designing the application, developing, previewing the
    app with the simulator, and then finally deploying the app to different application
    landscapes.


    We''ll also discuss the various templates and the WYSIWYG layout editor capabilities
    for nonprogrammers. After each phase of the development process, we''ll include
    steps to show you how to create a Master Detail transactional app using the Entity
    Data Model file (EDMX). We''ll then demonstrate how to create mock data to test
    the app and deploy it.


    | Version |

    | During the writing of this chapter (November 2016), we used SAP Web IDE version
    1.15.5. |'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 8.1 SAP Web IDE Overview


    The SAP Web IDE is a browser-based tool that enables developers to build new user
    experiences. It''s designed to shorten the end-to-end application development
    lifecycle, from prototyping, developing, instantly previewing, and deploying SAP
    Fiori applications.


    The SAP Web IDE accelerates building modern applications for mobile and desktop
    using the latest user interface (UI) technologies. It''s a very flexible tool
    with robust code editors for developers who want to develop applications quickly
    and efficiently. In addition, this tool also empowers nonprogrammers to build
    applications using wizards and templates.


    In this section, we will look at the architecture of the SAP Web IDE, and then
    provide an outline of its advantages over technologies such as the Eclipse-based
    IDE.


    # 8.1.1 Architecture


    From a bird''s eye view, Figure 8.1 shows the position of the SAP Web IDE in the
    SAP HCP architecture, where the full functionality is available.


    ![](img/45a7493fede9b923b78389c8563e03c4_313_0.png)


    Figure 8.1 SAP Web IDE in the Architecture'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'The following elements are found in the SAP Web IDE architecture:


    +   - SAP HANA Cloud Platform (SAP HCP)

    This is a Platform as a Service (PaaS) where users can build, deploy, run, and
    manage applications in the cloud.


    +   - SAP HANA Cloud Cockpit

    This is a central managing cockpit where users manage all the key information
    about applications and activities through the web-based interface.


    +   - SAP Web IDE

    This is where all the development takes place.


    +   - Orion

    This provides a workspace where the projects or files are located and enables
    users to work on their projects that are stored in the workspace.


    +   - GIT

    This is a repository that manages the versions of your applications, controlling
    your source code versioning.


    +   - SAPUI5

    This is the technology that is used to build your applications.


    +   - SAP HANA Cloud Connector

    This is the connector that integrates the SAP Web IDE and SAP HCP securely.


    +   - SAP Gateway

    This is the connector that connects the SAP Web IDE to your SAP system with access
    to OData functionality.


    # 8.1.2 Advantages


    Although some developers continue to use an Eclipse-based IDE for their application
    development projects, there are a number of advantages to using the SAP Web IDE.


    Figure 8.2 shows today''s method and process for developing an application, where
    you start with installing the IDE, plugin, and libraries; then code the application
    from scratch; and finally wait for the reviews.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 8 | Introduction to SAP Web IDE


    ![](img/45a7493fede9b923b78389c8563e03c4_315_0.png)


    Figure 8.2 SAP Web IDE versus Eclipse IDE


    As shown in 8.2, the SAP Web IDE has one particularly visible advantage over Eclipse-based
    IDE—the speed at which it developers deliver applications. This is because the
    SAP Web IDE has the advantage of ready-made templates for SAP Fiori apps. Therefore,
    you have the option to either develop an application and run it with mock data,
    or you can start development by directly importing the service from the SAP Gateway
    service.


    Additionally, installing and updating the Eclipse IDE isn''t an easy task. Making
    sure that all developers are on the same version is an even bigger challenge because
    Eclipse has multiple versions such as Juno and Kepler. The SAP Web IDE, on the
    other hand, is just about subscribing to the IDE service and running the SAP Web
    IDE—it''s that simple.


    When it comes to developing applications, the SAP Web IDE is the next generation
    cloud-based development environment. It provides real-time code review and testing
    into the modern pipeline—allowing more than one person to code in real time by
    connecting to the same repository—and instantly previews applications. These features
    allow developers to collaborate with business experts and designers to fulfill
    end-user requirements and expectations more effectively.


