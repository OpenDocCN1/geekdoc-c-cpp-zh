  md: '# Preface


    SAP Fiori is a user experience (UX) for SAP software. It applies modern design
    principles and provides a personalized, responsive, and easy-to-use user experience.
    SAP Fiori is a set of applications (HR apps, customer relationship apps, financials
    apps, and more) that run on SAP ERP and fall into one of three categories by their
    general purpose: transactional apps, fact sheet apps, and analytical apps. These
    apps provide a user interface from which to accomplish functionality that already
    present in an SAP system.


    There are several things a company can do with SAP Fiori applications:


    +   - Implement them

    - Customize them

    - Create them from scratch


    Regardless of what a company is doing with these apps, any form of implementation
    or development requires SAP Gateway (the integration technology that connects
    the frontend SAP Fiori app to the backend SAP system). In addition, knowledge
    of SAPUI5 (the programming language on which the UI of SAP Fiori apps is based)
    is needed in order to customize or create apps.


    It''s time to take the first step in your SAP Fiori journey! In this introduction,
    we''ll discuss the book''s target audience, layout its purpose, and provide a
    structural overview of the topics that lie ahead.


    # Target Audience


    SAP Fiori has a broad appeal given its wide use in SAP systems, as well as the
    many apps it offers across industries. However, given the technical details involved
    in the implementing and developing of SAP Fiori apps, this book is primarily focused
    on the following two audiences:'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Preface


    +   - Developers and administrators at companies who run SAP ERP

    - Consultants who are hired to implement SAP Fiori for a company running SAP ERP


    Again, this casts a wide net in terms of readers for this book. However, each
    chapter will layout the general knowledge and prerequisites required for implementation
    and developing each SAP Fiori app type.


    # Objective


    This book is meant to be a complete guide to implementing and developing SAP Fiori
    apps. The purpose of the book is to teach you how to implement, customize, and
    create SAP Fiori applications. You will walk away with a complete understanding
    of how to accomplish all of these tasks in specific and technical detail through
    step-by-step instructions, screenshots, and example applications.


    # Structure of the Book


    This book is divided into three parts. Part I, Getting Started, explains the first
    steps in SAP Fiori: a basic explanation of what it is, and instructions on installation
    and configuration.


    The following walks through the chapter topics in Part I:


    +   - Chapter 1: Introduction to SAP Fiori

    To begin your SAP Fiori journey, we will look at its architecture and integration,
    with a focus on reverse proxy (SAP Web Dispatcher) and the channels of communication.
    We will then discuss the three SAP Fiori app types, and related technologies such
    as SAP Gateway, SAPUI5, and SAP HANA.

    - Chapter 2: Installation and Configuration

    Before any implementation or development can begin, you will need to install and
    configure the SAP system so it''s ready to deploy SAP Fiori apps. In this chapter,
    we will begin by looking at the three SAP Fiori system landscapes used for implementing
    the apps: the ABAP environment, SAP HANA database, and SAP HANA XS. We''ll move
    on to the two compatible deployment options: central hub and embedded. The last
    two sections walk through the installation and configuration processes.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Part II, Implementation, is devoted to the implementation of SAP Fiori apps.
    It starts by introducing the security measures that should be in place to ensure
    the apps are safe. It then begins explaining the step-by-step process for implementing
    the three different types of SAP Fiori apps: transactional, fact sheet, and analytical.
    It devotes a chapter to creating OData services in SAP Gateway, which is required
    in all implementations for the frontend of SAP Fiori to communicate with the backend
    of SAP.


    The following walks through the chapter topics in Part II:


    +   - Chapter 3: SAP Fiori Security

    It''s important to understand the various security mechanisms that can be put
    in to prevent the unauthorized and unauthenticated use of SAP Fiori apps. In this
    chapter, we look at securing the app communication channels and security measures
    for encryption. We then delve into single sign-on and authenticating apps. Finally,
    we provide an overview of how to manage users and authorize access.


    +   - Chapter 4: Implementing Transactional Apps

    In this implementation chapter, we''ll begin discussing how to implement transactional
    apps. We''ll be activating SAPUI5 component and OData services. Next, we dive
    into the ABAP frontend and backend roles before running the app. We end the chapter
    with a discussion on creating custom business catalogs and roles.


    +   - Chapter 5: Implementing Fact Sheet Apps

    Many ABAP frontend tasks are shared between transactional and fact sheet apps.
    In this chapter, we focus on the specific fact sheet apps implementation steps
    that must be completed. This includes creating search connectors manually and
