  md: '# 1.4-3 SAP HANA XS


    SAP HANA XS is a key component of SAP HANA as a platform. SAP HANA XS is a small
    footprint application and web server. It provides an development platform inside
    of SAP HANA, offering improved performance and access to SAP HANA''s core features.
    That said, XS is an extension of the SAP HANA database- and not a separate software
    component installed on the same hardware. XS is tightly integrated into the deepest
    parts of SAP HANA. With the release of SAP HANA SPS 05, SAP HANA XS became available
    for customers and partners to develop their own SAP HANA-based applications.


    > More information

    For information on building applications using SAP HANA XS, check out the SAP
    PRESS E-Bite, Hands on with SAP HANA XS, by Craig Cmehil, at www.sap-press.com/4068.
    This E-Bite can also be used in conjunction with the SAP HANA CodeJam.


    As previously mentioned, analytical apps only run on an SAP HANA database and
    use VDMs. SAP HANA contains the Fiori app content, KPI modeling framework, generic
    drilldown, and SAP HANA Live VDMs (see Figure 1.43).


    ![](img/45a7493fede9b923b78389c8563e03c4_71_0.png)


    Figure 1.43 SAP HANA XS Engine


    SAP HANA Live is a complete set of pre-defined VDMs that expose the SAP Business
    Suite application data. SAP HANA Live provides different types of views: values
    help views, private views, reuse views, and query views. We''ll discuss more about
    SAP HANA Live views in Chapter 11.'
