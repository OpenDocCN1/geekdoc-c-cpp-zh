    Figure B.12 Test Theme


    +   4. Copy the URL and paste it at the end of the SAP Fiori Launchpad URL with
    "&" before the URL. Now, let''s test the theme by running the URL. You should
    now see the new custom theme applied to your SAP Fiori Launchpad:

    `https://<host>.<domain>:<port>/sap/bc/ui5_ui/ui2/shell/abap/Fiorilauunchpad.html?sap-theme=CorporateTheme@<host>:.50000/sap/bc/themes/lient-120/-cache-2VCj7NrjFnvVx-uDZ8vm6HqrJVPsl1`

    5. The next step is to overwrite the standard theme with the custom theme, which
    you created in the previous steps. Run Transaction /UI2/NWBC_CFG_SAP.'
  merge: -1
  pgno: 553
- img_proc: true
  md: '6. Set the SAP_FLP parameter value to the custom theme which you created pre-viously
    (see Figure B.13).


    ![](img/45a7493fede9b923b78389c8563e03c4_554_0.png)


    **Figure B.13** Overwrite Standard Theme


    You should now see SAP Fiori Launchpad with the new theme.


    > > Important!


    Whenever you apply a patch, make sure you check whether your custom theme is working
    without any issues. If you come across any issues, you may have to rebuild the
    theme with the UI Theme Designer.'
