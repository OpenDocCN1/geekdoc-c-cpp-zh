    # 12.3 Summary


    Workflows are important for carrying out daily business activities. In this chapter,
    we discussed the basics of the workflow process and how to integrate SAP Business
    Workflows with the My Inbox app in SAP Fiori. Specifically, we''ve configured
    the All Items tile, which shows you all the workflow tasks that you have access
    to in the backend system. We concluded the chapter by creating a custom workflow
    for a scenario-specific tile.


    In the next chapter, we''ll be integrating SAP Fiori apps with other SAP products.'
