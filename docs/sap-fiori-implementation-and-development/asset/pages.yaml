  md: '# Foreword


    The world is changing and technology is at the center of everything we do. Younger
    generations are born into a world of rapid technological evolution and the millennials
    are entering the workforce with the mindset that simplicity is key. We are now
    a society equipped with mobile devices that instantly allow access to social networks
    and countless apps. Subsequently, users are accustomed to a new and improved user
    experience. Businesses have quickly caught onto this new demand and realized that
    enterprise software cannot be an exception. It is unacceptable to show users the
    complexity of business software and it has become imperative to provide a beautiful
    user experience. Businesses are being forced to change with the times they want
    to stay relevant, and SAP has emerged as a leader in this evolution.


    For the past few years, SAP has been rethinking enterprise software with a focus
    on end users. Enterprise software is powerful and covers end-to-end business processes.
    However, the end-to-end cycle is not one size fits all. Depending on your role
    in an enterprise, you might need to see different data than a counterpart in your
    organization. For this reason, SAP set out to completely reimagine the end user
    experience. They started out by focusing on the most commonly used business transactions,
    such as vacation requests, time entry, expense reporting, etc. Then, they set
    out to develop a consistent and holistic user experience for SAP software. Five
    design guidelines were established to aid in this evolution: role-based, delightful,
    coherent, simple, and responsive. By keeping focused alignment with growing end
    demands, SAP quickly needed to be created by role, allow you to complete your
    job easily, be consistent across the offering, and be intuitive to work on any
    device. In May 2013, SAP hit the mark and launched SAP Fiori as the new user experience
    for SAP.


    Today, SAP Fiori consists of over 500+ apps, ranging across all lines of business
    and industries. In order to support the breadth of business transactions used
    by customers, SAP developed three supporting SAP Fiori app types: transactional,
    fact sheet, and analytical apps. Transactional apps support task-based access'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Foreword


    and support changes, as well as creations and approvals with guided navigation.
    Fact sheet apps allow you to search and explore essential information about objects,
    and provide contextual navigation between related objects. Analytical apps provide
    a visual overview of a dedicated topic for related analysis. Transactional apps
    can run on either an ABAP or SAP HANA database. However, fact sheet and analytical
    type apps require an SAP HANA database. All of these is a web-based entry point
    for SAP Fiori applications, allowing an end user to personalize their view.


    While SAP worked to simplify business processes and provide a delightful end user
    experience, they also realized that customers have individual needs, and out-of-the-box
    apps might not work for everybody. In recognition of this fact, SAP developed
    tools to support developers and designers in their implementation of SAP Fiori.
    Tools as the SAP Web IDE provide developers everything they need to customize
    and extend the apps for their work in business, the UI Theme Designer enables
    companies to easily brand their SAP Fiori Launchpad and apps to align with their
    company brand and color schemes.


    SAP Fiori Implementation and Development delivers a comprehensive end-to-end understanding
    of SAP Fiori, providing developers and IT professionals with in-depth knowledge
    about SAP Fiori as the user experience for SAP business applications. With a specific
    focus on the deployment and configuration of each of the app types, readers can
    also expect to learn the technical aspects required for a successful implementation
    as well as the security and authentication options vital for their organization.
    You will conclude your SAP Fiori understanding with the underlying technologies
    and tools that support SAP Fiori, including the creation and extension of OData
    services within SAP Gateway, the SAP Web IDE for UI extensibility and customizations,
    business workflows for approval apps, and integration with other SAP technologies.


    After reading this book, you will not only understand what SAP Fiori is, but how
    you can also leverage the technology to provide your end users with a delightful
    and consistent user experience. Gone are the days of complexity and focusing only
    on feature enhancements. SAP has created a new standard of focusing on end users,
    providing them with a holistic experience centered on the tasks relevant to their
    job. The teachings in this book will provide you with the tools to'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'immediately enable SAP Fiori in your organization. With detailed explanations
    and guidance throughout, SAP Fiori Implementation and Development will help simplify
    your business processes.


    # Liz Thorburn, SAP


    Technology RIG, Development P&I Technology'
  merge: -1
  pgno: 14
- img_proc: true
