  md: '# 4.6 Custom Business Catalogs and Roles


    In the previous section, we discussed how to enable the Create Sales Order transactional
    app using the standard SAP business catalog (SAP_SD_BCR-FIELD-SALREP_X1) and the
    standard SAP business catalog (SAP_BC_FIELD-SALREP_X1). However, in a real-world
    scenario, you might need to create your own catalogs and roles.


    To demonstrate how to do this, let''s look at an example. User A is supposed to
    only have access to the Create Sales Order transactional app. User B is supposed
    to only have access to the Change Sales Order transactional app. However, both
    the apps are part of the same standard catalog (SAP_SD_BC_FIELDSALESREP-X1), so
    if you assign the standard SAP business role to both users, then both will be
    able to use the apps. To remedy such scenarios, you must create a custom business
    catalog and a custom role. In this exercise, we''ll show you how to achieve that.


