    in Figure 6.3:


    +   - CRITICAL: "100"

    - WARNING: "30"

    - TARGET: "10"


    CRITICAL, WARNING, and TARGET values are the threshold values of a KPI. These
    depend on the goal type selected previously. For example, if you select LOWER
