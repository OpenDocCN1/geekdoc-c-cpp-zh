- img_proc: true
  md: 'This chapter explains how to create and extend an analytical app and illustrates
    the process by walking through a complete example app.


    # 11 Creating and Extending Analytical Apps


    In Chapter 1, we introduced you to the SAP Fiori system landscape with SAP HANA
    XS. You then learned how to implement a standard SAP Fiori analytical app with
    and without the SAP Smart Modeler in Chapter 6. In this chapter, we will focus
    on creating and extending an analytical app with an example based on SAP HANA
    Live views. All the SAP Fiori analytical apps are based on SAP HANA Live views,
    so we will begin with an overview of SAP HANA Live before digging into the creation
    and extension process.


    # 11.1 Introduction to SAP HANA Live


    By now, you know that analytical apps only run on an SAP HANA database, and that
    apps are developed on query views from SAP HANA Live. Therefore, it''s important
    to understand some basic concepts about SAP HANA Live before we look at creating
    or extending analytical apps. Because SAP HANA Live is a big topic, we will keep
    the introduction brief. However, a basic understanding of SAP HANA Live is needed
    to get started with the app development. Figure 11.1 shows the logical architecture
    of the SAP Fiori landscape with SAP HANA Live (VDM).


    So, what is SAP HANA Live? SAP HANA Live is a complete set of predefined data
    models VDMs that expose the SAP Business Suite application data. SAP delivers
    the SAP HANA Live packages for a large number of SAP Suite application areas;
    for example, in Figure 11.1, you see SAP HANA Live for SAP ERP, SAP CRM, and so
    on. Customers can just download and install the packages they need.


    In this section, we will look at the important aspects of SAP HANA Live, including
    SAP HANA Live views, the SAP HANA Live Browser, and the process of exposing these
    views to SAP Fiori analytical apps.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# 11 | Creating and Extending Analytical Apps


    ![](img/45a7493fede9b923b78389c8563e03c4_437_0.png)


    Figure 11.1 Logical Architecture of SAP HANA Live Content


    # 11.1.1 SAP HANA Live Views


    The VDM is a structured representation of SAP HANA database views that follows
    consistent modeling rules. The data from the SAP Business Suite is consumed into
    the analytical apps using these views. A VDM contains four types of SAP HANA Live
    views:


    As the name implies, these views are used to populate value help, the drop-down
    lists in the applications that provide a full list of possible values for entities,
    for example customers, materials, and so on.


    438'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# Private views


    These views summarize certain SQL transformations on one or several database tables.
    A private view can be based on database tables, other private views, or reuse
    views. These are the SAP standard views that directly use SAP tables. Or one can
    modify these views.


    # Reuse views


    These views expose the business data from the SAP Business Suite systems in a
    well-structured format. These views are designed to be reused in other views,
    and they consist of one more private views.


    # Query views


    As previously mentioned, all analytical apps are developed on query views. These
    are the top level of views, designed to expose business data from the SAP Business
    Suite system and for direct consumption by the analytical apps.


    Now that you know the different views available in SAP HANA Live, let''s look
    at how to browse and navigate these views.


    # 11.1.2 SAP HANA Live Browser


    SAP HANA Live Browser is a web application built using SAPUI5. With this tool,
    users can easily browse and navigate the SAP HANA content views. You can access
    SAP HANA Live Browser from the link http://SAP HANA Server Host>:80-SAP HANA Instance>/sap/hba/explorer/.


    Figure 11.2 shows the landing page of the SAP HANA Live Browser. On this screen,
    the content is organized by application components, and users can navigate between
    ALL VIEWS, MY FAVORITES, SEARCH, and INVALID VIEWS tabs.


    On selecting a view on the left-hand side of the screen, you can see the details
    of the selected view on the right side. The icons at the right side are listed
    from left to right in the following list:


    +   - OPEN DEFINITION


    Use this icon to view the metadata of the SAP HANA Live views.


    +   - OPEN CONTENT


    Use this icon to view the data of the SAP HANA Live views.


    +   - OPEN CROSS REFERENCE


    Use this icon to view the tables and views cross references.'
  merge: -1
