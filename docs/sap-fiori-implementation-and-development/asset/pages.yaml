  md: '# 6.3.1 Create the KPI


    The first task is to create a KPI by following these steps:


    +   1. Log in SAP Fiori Launchpad.


    +   2. Click the CREATE KPI app under the KPI MODELER group (see Figure 6.2).


    ![](img/45a7493fede9b923b78389c8563e03c4_217_0.png)


    Figure 6.2 Create KPI


    # KPI Modeler Group


    If you don''t see the KPI modeler group in SAP Fiori Launchpad, then refer Chapter
    2, Section 2.6.4, and grant user access to the KPI modeler.


    In the next screen, you need to fill in the following mandatory details about
    the KPI (see Figure 6.3):


    +   ID: Has to be a unique ID for the KPI; you can use either the auto-generated
    ID or use a standard naming convention depending on your business. For this, we
    chose SAP.PRESS.DAYSSALESOUTSTANDING.


    +   TITLE: Enter a meaningful name that appears in the tile header at runtime.
    Here we entered “Days Sales Outstanding (KPI)”.


    +   DESCRIPTION (optional): Enter “Total Days Sales Outstanding for the last 12
    months”.


    +   TYPE: Choose KEY PERFORMANCE INDICATOR (KPI).'
