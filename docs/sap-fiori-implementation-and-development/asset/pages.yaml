    a transactional app.


    # 9.2 Extending Transactional Apps


    Many customers want to customize their SAP Fiori apps beyond the standard applications
    delivered by SAP. The ability to extend transactional and other SAP Fiori apps
    is useful when, for example, to add a field, hide nonrelevant controls, replace
    a standard view with a custom view, or add a custom OData service. Depending on
    the application type and extension requirements, you can enhance one or multiple
    content layers.


    Figure 9.20 shows the system landscape of a transactional app. The landscape is
    comprised of three main layers. The following explains each layer and when you
    can extend them:


    +   - SAP Business Suite layer

    This contains the business logic and backend data. You can extend the SAP Business
    Suite layer if the backend logic and the content required for the app extension
    don''t exist.'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# SAP Gateway layer


    This maintains the connections to the backend system and allows users to create
    OData services. You can extend the SAP Gateway layer (OData) if the backend-logic
    and the content required for the app enhancement are present in the SAP Business
    Suite layer, not exposed to the SAP Gateway server.


    # UI layer


    This layer contains the product-specific UI add-ons, SAPUI5 control library, and
    SAP Fiori Launchpad. You can extend the UI layer if the backend logic and the
    content required for the app extension are present in the SAP Gateway layer but
