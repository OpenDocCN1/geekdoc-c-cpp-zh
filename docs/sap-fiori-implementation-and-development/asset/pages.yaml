  md: '# Analytical Apps with the SAP Business Modeler | 6.3


    +   GOAL TYPE: This indicates which kind of KPI value is meaningful for the application.
    Choose from three options:


    +   MAXIMIZING (HIGHER IS BETTER): Higher the better; for example, profit-related
    KPI values are higher the better.


    +   MINIMIZING (LOWER IS BETTER): Lower the better; for example, cost-related
    KPI values are lower the better.


    +   TARGET (CLOSER TO TARGET IS BETTER): Closer value is to the target is better,
    for example, attrition rate.


    Here we choose MINIMUM (LOWER IS BETTER).


    +   TAGS (optional): Enter these to more easily search for your KPI.


    +   OWNER NAME (optional): Enter the name of the person responsible for executing
    the KPI.


