  md: 'View

    A view is a collection of classes representing the different elements in a UI.
    This is the visual part of your application, i.e. all of the things the user can
    see and respond to the screen, as buttons, list boxes, etc. Views can be defined
    using:


    +   - XML (sap.ui.core.mvc.XMLView)

    - JavaScript (sap.ui.core.mvc.JSView)

    - JSON (sap.ui.core.mvc.JSONView)


    Declarative HTML (sap.ui.core.mvc.HTMLView)

    Controller

    A controller represents the classes connecting the model and the view. When a
    user clicks on a button or selects an item from the list box, an event is triggered.
    The controller then handles the event and communicates between the classes in
    the model and view.


    ![](img/45a7493fede9b923b78389c8563e03c4_55_0.png)


    Figure 1.23 MVC Design Concept


    In addition to these concepts, SAPUI5 also supports data binding. SAPUI5 data
    binding supports three model implementations: JSON, an XML model, and an OData
    model. Simply put, SAPUI5 data binding is the process by which the properties
    in data sources/models are bound to properties in the SAPUI5 control or views.
    This involves a two way data binding: any change in the property values of a model
    will automatically be reflected in the views; similarly, any change in the values
    of views will automatically be updated in the model.'
