- img_proc: true
  md: '# OData and HTTP methods


    Because SAP Fiori apps use OData to access data, the reverse proxy must be configured
    to allow certain HTTP methods to be made available. As part of the SAP Web Dispatcher
    configuration, you saw how to enable the SAP Web Dispatcher (reverse proxy) to
    use HTTPS. Similarly, you need to enable the ABAP frontend server and SAP HANA
    XS to use HTTPS.


    # URL rewriting


    You should configure the URL rewrite at the reverse proxy level because when the
    OData services are accessed through reverse proxy, URLs may be invalid or might
    lose protocols, names, or port numbers.


    # Internet Communications Framework (ICF) security


    SAP Fiori applications consist of OData services and SAPUI-based content, which
    are managed by the ICF. For security reasons, they are initially disabled. Therefore,
    you need activate these services during the configuration.


    # Security session protection


    It''s recommended that you activate HTTP security session management through Transaction
    SIC_SESSIONS for SAP NetWeaver version 7.0 and higher. For extra protection for
    security-related cookies, it''s also recommended that you activate the following:


    +   * HTTPOnly flag: This instructs to deny access to a cookie by a client-side
    script. Therefore, even if a user accidentally accesses a link that exploits the
    cross-site scripting (XSS) flaw, the browser won''t reveal the cookie to a third
    party.

    * SECURE flag: To protect cookies from being passed over unencrypted requests,
    the secure flag tells the browser to send cookies only if the request is sent
    through a secured channel, such as HTTPS.


    Having looked at the security measures in place to protect communications between
    layers, let''s now discuss the authentication and supported SSO methods.


    # 3.1-4 SAP Web Dispatcher to SAP HANA XS


    The SAP Web Dispatcher should allow only those requests that would be routed to
    the general ICF services. If you''re using Fiori analytical apps, then the queries
    are routed from the SAP Web Dispatcher to SAP HANA XS. To transfer the data securely
    between these two components, see the following sections.'
  merge: -1
  pgno: 146
- img_proc: true
  md: "# Enable SAP HANA XS to Use HTTPS\n\nThe SAP HANA XS engine is a lightweight\
    \ web application, and SAP HANA uses the SAP Web Dispatcher as a reverse proxy.\
    \ In this section, we'll provide you with high level steps on how to enable the\
    \ SAP HANA XS engine to use HTTPS.\n\nFollow these steps:\n\n+   1. Log in to\
    \ the OS of the SAP HANA server, and edit the instance profile of the SAP Web\
    \ Dispatcher at /usr/sap/<SID>/HDB<instance_nr>/<hostname>/wdisp\n2. Add the following\
    \ parameters:\n    * wdisp/shm_attach_mode = 6\n    * wdisp/ssl_add_client_protocol_header\
    \ = true\n    * ssl/ssl_lib = /usr/sap/<SID>/SYS/global/security/libapscrypto\n\
    \    * ssl/server_pse\n    * /usr/sap/<SID>/HDB<instance_nr>/<hostname>/sec/SAPSSL.pse\
    \ icm/HTTPS/verify_client = 0\n3. Download and install SAP Cryptographic Library\
    \ on the SAP HANA server, and copy libcrypto.so to /usr/sap/<SID>/SYS/global/security/lib/.\n\
    4. Copy SAPNet.ca to /usr/sap/<SID>/HDB<instance_nr>/<hostname>/sec.\n5. Run the\
    \ command to set the SECURID environment variable:\n    export:SECURID=\"/usr/sap/<SID>/HDB<instance_nr>/<hostname>/sec\"\
    \n6. Create a certificate request and SSL key pair using the SAPGENPSE tool.\n\
    7. Download SAPNetCA.cer, and save it to /usr/sap/<SID>/HDB<instance_nr>/<hostname>/sec.\n\
    sapgenpse import_own_cert -c SAPSSL.pse -p SAPSSL.pse -x <PIN> -r SAPNetCA.cer\n\
    8. Create a credential file for the SAP Web Dispatcher to access the PSEs during\
    \ runtime.\n9. Import the signed certificate to the SAP Web Dispatcher server.\n\
    10. Restart the SAP Web Dispatcher."
