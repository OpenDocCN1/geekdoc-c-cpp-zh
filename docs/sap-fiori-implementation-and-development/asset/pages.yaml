    Now let''s dig deep into the layers of these communication channels and discuss
    how to secure them. By now, you should be familiar with the SAP Fiori landscape.
    Figure 3.2 shows the high level system landscape from the communication channel
    and apps perspective.


    ![](img/45a7493fede9b923b78389c8563e03c4_139_0.png)


    Figure 3.2 SAP Fiori System Landscape from the Apps Perspective


