- img_proc: true
  md: '# Creating and Extending Analytical Apps


    +   - ADD TAGS

    Use this icon to add personalized tags, select a view, and then click the ADD
    TAGS button.


    +   - GENERERATE SLT

    Use this icon to generate the SAP Landscape Transformation (SLT) file.


    +   - SAP LUMIRA

    Use this icon to open the SAP HANA Live view in SAP Lumira and build storyboards
    using the data from SAP HANA Live.


    +   - SAP BUSINESSOBJECTS ANALYSIS

    Use this icon to open the SAP HANA Live view in SAP BusinessObjects Analysis to
    perform further detailed analysis on your data.


    ![](img/45a7493fede9b923b78389c8563e03c4_439_0.png)


    **Figure 12.** SAP HANA Live Browser


    With an overview of both SAP HANA Live views and its browser, in the next section
    we will discuss how these views work in relation to SAP Fiori analytical apps.


    # 11.1.3 Exposing SAP HANA Live Views to Analytical Apps


    Views in SAP HANA Live can be exposed as an OData service. These services can
    integrate SAP HANA Live views with SAP Fiori analytical apps. By now, you''re
    familiar with OData services and its concepts. An OData service for SAP HANA XS'
  merge: -1
  pgno: 439
- img_proc: true
  md: 'is defined in a text file with the suffix .xsodata. The data is transferred
    to analytical apps over HTTP using either the Atom (XML) or the JavaScript Object
    Notation (JSON) format.


    A couple of advantages of using SAP HANA Live with analytical apps include the
    following:


    +   - Developers can build analytical apps directly on SAP HANA Live views without
    the need for additional software.


    +   - All analytical apps run on the primary database, there''s no need for users
    to wait for the data loading jobs to complete. The cycle time from redisplaying
    in analytical apps is dramatically reduced.


    In addition, when working with SAP HANA Live views in correlation with SAP Fiori
    analytical apps, it''s important to keep the following points in mind:


    +   - Private views should not be copied or modified.


    +   - Use query views or reuse views for extensions by copying them. If you change
    the original views, then the changes will be lost next time when a new VDM is
    installed.


    +   - The Enforce SQL Execution flag must be set to TRUE for all graphical calculation
    views.


    +   - Using attribute and analytic views must be avoided.


    Now that you have a basic understanding of SAP HANA Live and its views, let''s
    walk through how to create or extend an analytical app using a view from SAP HANA
    Live. The creation and extension process is very similar, so we''ll first cover
    the creation processes in detail, and then we''ll talk about the extension process
    from a high level.


    # Prerequisites


    A number of prerequisites must be met before you start creating or extending analytical
    apps:


    +   - The correct version of SAP HANA must be installed on the SAP HANA server
    per the requirements for SAP HANA Live. Refer to the SAP Fiori apps reference
    library to find the exact versions.


    +   - The standard SAP tables that are used by SAP HANA Live must exist and be
    populated with data by an appropriate data replication mechanism.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '+   * The SAP HANA Client and SAP HANA Studio software must be installed on
    the client systems.

    * A beginner''s knowledge of SAP HANA data modeling is required.

    * You must be familiar with or have access to the SAP HANA Live release notes.

    * You need to have access to KPI modeler apps (see Chapter 6).


    We highly recommend going through Chapter 6 before you work on the examples in
    this chapter.


    # 11.2 Creating Analytical Apps


    In this section, we''ll show you how to create an analytical app using an example
    based on a sales order calculation view. The first step in this process is to
    create the SAP HANA Live view.


    # 11.2.1 Create the SAP HANA Live View


    To create the SAP HANA Live view, you can either create from scratch or create
    by copying an existing view.


    In this example, you''ll create a new view by copying an existing calculation
    view. Follow these steps:


    +   1. Log in to your SAP HANA system from SAP HANA Studio.

    2. Select the DEVELOPERS perspective.

    3. Create a new package by right-clicking (either the CONTENT folder or on the
    existing package) and selecting NEW • PACKAGE (see Figure 11.3).


    # Creating a Package


    It''s not necessary to create a new package at the same location where you created
    an old package (see Figure 11.3). The new package can be located anywhere in the
    CONTENT folder. However, it''s important to keep in mind that the package you''re
    creating should be included in the SAP Web Dispatcher. For example, in our demo
    system, sap.hba is included in the SAP Web Dispatcher (refer to Chapter 3, Section
    3.1.2).'
