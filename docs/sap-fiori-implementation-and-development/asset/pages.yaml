  md: 'The most common modifications to SAP Fiori apps involve workflow. Accordingly,
    this chapter provides an overview of SAP Business Workflow, explains how and when
    to create a custom workflow, and shows a step-by-step example based on the My
    Inbox app.


    # 12 Workflow and SAP Fiori


    A workflow is an orchestrated and repeatable pattern of a business activity. It
    can represent a sequence of operations, be declared as the work of a person or
    group, demonstrate staff structure, or be one or more simple or complex mechanisms.


    This chapter starts with an introduction to workflow and the basic terminology
    used in the workflow process in Section 12.1. We''ll introduce you to the My Inbox
    app architecture in Section 12.2, and we''ll discuss how the My Inbox application
    simplifies the processing of workflow tasks for end users.


    In Section 12.2.1, we''ll discuss the prerequisites that needs to be fulfilled
    before start implementing workflows and the My Inbox app. We''ll walk through
    how to implement the All Items Inbox tile in Section 12.2.2. We''ll end the chapter
    with step-by-step instructions on how to define a workflow scenario and implement
    a scenario-specific inbox.


    # 12.1 Workflow Basics


    A workflow, as the name suggests, is a flow of work activities in a sequence resulting
    in an exchange of information. To better understand the workflow process, we''ll
    look at a simple example of a leave application: An employee submits a leave application
    to the manager, and the manager checks the leave application. If everything looks
    good he will approve it; however, if something in the leave application isn''t
    correct, the manager will reject it. If this process happened on a traditional
    paper basis, the process would take forever. In such scenarios, SAP Business Workflow,
    or SAP workflow, streamlines this process.'
  merge: -1
  pgno: 472
- img_proc: true
  md: '# Workflow and SAP Fiori


    SAP Business Workflow is a cross-application tool that automates business processes
    such as leave approval procedures and makes the whole process quick and simple.
    SAP Business Workflow maps business processes in the SAP system and processes
    them under the workflow system. These workflows can be anything from a simple
    approval process to the more complex business processes. Typically, SAP Business
    Workflow helps in situations where processes have to be run repeatedly or where
    a large number of agents in a specific sequence are involved.


    When a document is created, updated, or deleted, SAP Business Workflow creates
    events. These events represent an action in the system, and these events are captured
    by SAP Business Workflow, which handles the work items based on the defined workflow
    templates.


    Let''s look again at the leave application example. When an employee submits a
    leave application, the manager receives a notification/request to approve or reject
    it. These requests are delivered to their inbox as a work item, and as an agent.
    If the manager requests more information, the employee receives a work item to
    his inbox.


    Currently, enterprises across industries use multiple workflow engines as part
    of their landscape to run their business process. In addition, they have to use
    different types of inbox-like portals, or Universal Work Lists (UWLs), to track
    their day-to-day activities. The biggest challenge for the end users is to use
    multiple sources for work items because they need to be trained to interact with
    different task management technologies. Inconsistent user experience across different
    devices will impact their daily activities. From an IT perspective, setting up
    and configuring all of the workflows accessible from mobile devices is the biggest
    challenge.


    Customers want a unified inbox where all their business users can easily access
    and manage work items from one location, with consistent user experience across
    all devices. This will reduce the complexity and increase productivity of end
    users. The My Inbox app in SAP Fiori is the solution that satisfies all these
    workflow needs.


    In the next section, we''ll look at creating standard and custom workflows using
    the My Inbox app in SAP Fiori.'
  merge: -1
  pgno: 473
- img_proc: true
  md: '# 12.2 Creating Standard and Custom Workflows with the My Inbox App


    The My Inbox app is a full-blown workflow inbox for SAP Fiori. This transactional
    application can process workflows tasks based on the decision options defined
    in the backend server. The My Inbox app can process tasks from SAP Business Workflow,
    SAP Business Process Management (BPM), and third-party providers.


    The following are some of the key features of the My Inbox app:


    +   - Users can sort and filter the information that is displayed in the app.

    - Users can select multiple requests and approve or reject them.

    - Users can add attachments and post comments.

    - Users can share their tasks via SAP Jam or email.


    Figure 12.1 shows the high level system landscape of the My Inbox app. This app
    runs on SAP Gateway to other SAP Fiori transactional apps, however, there is a
    special service called the Task Gateway Service in the SAP Gateway server, which
    is the key component. This component harmonizes views from different task providers
    as BPM, SAP Business Workflow, or third-party workflow engines. The task information
    is exposed from different task providers in a standard format called the task
    consumption model. This model can be extended with additional task providers via
    the task provider''s application programming interface (API).


    SAP provides out-of-the-box integration with SAP Business Workflow and SAP BPM
    service providers. In the next version, SAP is planning to integrate SAP HANA
    task management. In addition, third-party workflow engines are supported.


    In the sections that follow, we''ll look at the prerequisites for using the My
    Inbox app, how to create standard workflows with the All Items tile provided by
    SAP, and how to create custom workflows for a scenario-specific inbox.'
  merge: -1
  pgno: 474
- img_proc: true
  md: '![](img/45a7493fede9b923b78389c8563e03c4_475_0.png)


