  md: '# SAP Gateway Service Builder | 7.2


    RUNTIME Artifacts

    When you generate an OData service (i.e., it automatically generates the code
    (it generates the following runtime artifacts) and registers the OData service
    to the SAP Gateway server. The following are important runtime artifacts (see
    Figure 7.20):


    +   Data Provider Base Class (suffix_DPC): This is an ABAP class. DPC provides
    all the methods required to handle OData requests; for example, it''s used to
    create your CRUD methods as well as function methods.

    - Data Provider Extension Class (suffix_DPC_EXT): You can define all your back-end
    in refined methods of the DPC extension class.

    - Model Provider Base Class (suffix_MPC): This is a base ABAP class. MPC is used
    to define the EDM of your service. Typically, developers don''t touch this class
    unless there is some feature that isn''t available in the SAP Gateway tool, and
    they want to build the service with that feature.

    - Model Provider Extension Class (suffix_MPC_EXT): This is the implementation
    class that inherits the base class. Developers can modify and add features to
    this class.

    - Registered Model (suffix_MDL): This is the technical name of the OData service
    model, for example, SALESORDER_MDL.

    - Registered Service (suffix_SRV): This is the technical name of the OData service,
    for example, SALESORDER_SRV.


    ![](img/45a7493fede9b923b78389c8563e03c4_272_0.png)


    Figure 7.20 Runtime Artifacts


