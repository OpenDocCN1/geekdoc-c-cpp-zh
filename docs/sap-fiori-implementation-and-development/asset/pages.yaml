  md: 'The communication between the ABAP frontend server and the ABAP backend server.


    The communication between the SAP Web Dispatcher and SAP HANA XS.


    Additionally, Figure 3.2 shows what layers of these app types pass through the
    SAP Fiori landscape. All communication channels discussed earlier should be encrypted
    to ensure integrity and confidentiality of data. In the next section, we''ll show
    how to secure the communication channels of your SAP Fiori system.


    # 3.1.1 Client to SAP Web Dispatcher


    Starting from the top, to simplify communication between the browser and the different
    systems in the SAP Fiori landscape, we use a reverse proxy to ensure queries from
    the browser are routed correctly (i.e., to the ABAP frontend, ABAP backend, or
    SAP HANA XS engine). Depending on the type of app users on SAP Fiori Launchpad,
    a client issues the request to the SAP Web Dispatcher. To secure this communication
    channel, you need to enable the SAP Web Dispatcher to use HTTPS communication.
    The client sends the HTTPS-encrypted data to the SAP Web Dispatcher, and then
    the SAP Web Dispatcher decrypts the data and sends the unencrypted data to the
    ABAP servers.


    # 3.1.2 SAP Web Dispatcher to ABAP Servers


    The next level in securing the SAP Fiori landscape is figuring the connection
    between the SAP Web Dispatcher and the ABAP servers. SAP Fiori transactional apps
    route calls from the SAP Web Dispatcher to the ABAP frontend server, and SAP Fiori
    search and fetch apps route calls from the SAP Web Dispatcher to the ABAP backend
    server. To secure these communication channels, you need to configure the components
    discussed in the following two sections.


    # Enable ABAP Frontend and ABAP Backend Servers to Use HTTPS


    Following are the high level steps on how to configure the ABAP frontend and backend
    servers to use HTTPS. Because both servers are based on SAP Netaver, they have
    the same configuration steps.


    Make sure the SAP Web Dispatcher is installed. Next, you''ll configure it as an
    SSL client in the system landscape by following these steps:'
