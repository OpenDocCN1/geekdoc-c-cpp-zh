  md: 'Table 10.1 shows the list of files or folders that are generated when you use
    the Modification Free Sheet Application template in the SAP WEB IDE.


    | File/Folder | Description |

    |---|---|

    | data | This folder contains the original annotation file. |

    | Original.xsl | This file contains the XLT template that is generated exactly
    the like the .anno file. This file is used to track the changes that a user makes
    to the annotation file. |

    | Work.xsl | This file contains all the changes made by a user in the Design View.
    In our example, we added the Risk CATEGORY field, and that will be captured in
    this file. |

    | .project.json | This service contains the service URL details and the main entity
    sets. |

    | .anno | This is the original fact sheet annotation file. |

    | .otr | This service contains the Online Text Repository (OTR) aliases with the
    labels and backend availability status. |

    | .xml | This service contains the ABAP code for the OTR. |

    | .xsl | This file is used in the backend system to apply changes to the matching
    fact sheet. |

    | Preview.xml | The result of the .xsl and the original .anno file is saved in
    this preview.xml file. |

    | neo-app.json | This service contains settings to preview the fact sheet in SAP
    Fiori Launchpad. |


    Table 10.1 Project Files


