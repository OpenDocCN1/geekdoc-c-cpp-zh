    will have access to all the apps). In this section, we''ll show you how to create
    a custom catalog and role to give access to specific analytical apps in SAP Fiori
    Launchpad.


    In Chapter 4, Section 4.6, we discussed how to create a custom catalog and custom
    role for a transactional app. You''ll be following a similar process for non-smart
    analytical apps.


    To enable your app with custom roles and catalog, you must complete the following
    steps:


