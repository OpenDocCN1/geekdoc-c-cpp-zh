    So far, we''ve reviewed the OData concepts and SAP Gateway Service Builder components
    with an example based on the Create Sales Order OData service. Now let''s look
    into the most important part of the SAP Gateway Service Builder—modeling an OData
    service.


    # 7.3 Modeling an OData Service


    OData model creation is at the heart of application development in SAP Gateway.
    In this section, we''ll give you an overview of the OData service modeling methods
    and in detail the different modeling phases for OData service.


    There are two ways to create OData services with SAP Gateway:


    +   **Service development**

    This is a code-based option and is very flexible in developing highly efficient
    and specialized services.


    +   **Service generation**

    This is a quicker approach to building a service with a lot less effort. There
    are three options to generate SAP Gateway services with this approach, which you
    can choose from based on your requirements and skillset (see Figure 7.22):


    +   * Option 1—RFC generation: Service is generated using a tool called the RFC/BOR
    Generator.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '+   Option 2–Redefinition: Allows you to define a service based on an existing
    data source or an existing SAP Gateway service.


    +   Option 3–Model composition: Allows you to mash up multiple existing services.


    In the service creation process, there are three main phases (see Figure 7.22):


    +   Phase 1: Data model definition


    In this phase


