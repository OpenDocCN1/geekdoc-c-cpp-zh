  md: '# Implementing Transactional Apps


    +   - Set up the frontend roles. This involves the following subtasks:

    - Copy the business catalog role that provides access to the relevant catalog
    in SAP Fiori Launchpad.

    - Add authorizations for the required OData service to the business role.

    - Assign frontend roles to users.


    +   - Set up the backend roles. This involves the following subtasks:

    - Copy the backend authorization role that provides access to the backend data.

    - Assign backend roles to users.


    The following sections look in detail at these tasks for configuring the frontend
    and the backend servers when implementing transactional apps.


    # 4.1 Activating the SAPUI5 Component


    During a frontend configuration, the first step is to activate the Internet Communication
    Framework (ICF) service via Transaction SICF (Activate and Maintain SAP Web Services).
    Transaction SICF is used to maintain services for HTTP communication in the SAP
    system using the Internet Communication Manager (ICM) and the ICF. This is a software
    layer in the application server that provides an ABAP interface for HTTP, HTTPS,
    and SMTP requests.


    For security reasons, all the ICF are made available in an inactive state. When
    you install your new SAP system, standard SAP services may not be active, you''ll
    have to use Transaction SICF to activate them. Also, when you create a new service,
    you may have to activate it before it can be executed; otherwise, you may get
    an error.


    Now that you know Transaction SICF is and what it is, you need to know which service
    to activate to enable the Create Sales Order transactional app. For that, you
    need to go to the app-specific page in the apps references library. Follow the
    steps in Chapter 2, Section 2.4 to get the SAPUI5 application name of the Create
    Sales Order app (see Figure 4.1)'
