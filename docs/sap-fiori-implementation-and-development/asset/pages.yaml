    # 11.3 Extending Analytical Apps


    You can extend an analytical app when the standard SAP Fiori analytical apps don''t
    meet your requirements. In this section, we''ll look at how to extend an app using
    an example based on the sales order query calculation view.


    As previously mentioned, the SAP Fiori landscape for analytical apps is comprised
    of two main layers: the SAP HANA and the UI layer. Depending on the individual
    analytical app extension requirements, you can extend one or multiple layers.
    Note the following when extending either of these layers:


    +   * SAP HANA layer

    This layer is extended when the backend content required for the analytical app
    extension is available in the SAP HANA models, but isn''t exposed to the OData
    service.


    +   * UI layer

    This layer is extended when the backend content is exposed to the OData service
    later, but isn''t exposed in the analytical app.


    In the previous section, you learned that analytical apps are developed on preelivered
    SAP HANA objects such as views, and these views reside in SAP'
  merge: -1
