    # 1.3.2 Fact Sheet Apps


    Fact sheet apps enable users to view essential contextual information and a 360
    degree view of specific central objects used in their business operations. You
    can call fact sheets from the search results displayed in SAP Fiori Launchpad,
    or from other fact sheets, from transactional and analytical apps. For example,
    users can drilldown from a fact sheet app to a related business partner or master
    data. Figure 1.19 shows the high level landscape for fact sheet apps.


    When a user launches a fact sheet app, the launch request is sent from the client/browser
    to the SAP Web Dispatcher (reverse proxy). Communication between the client and
    the SAP Web Dispatcher happens via OData HTTP/HTTPS protocols. The SAP Web Dispatcher
    sends the INA search request protocols to the search models in the ABAP backend.


    The ABAP frontend contains product-specific UI components and infrastructure components.
    The ABAP backend server comprises the SAP Business Suite with the business logic,
    search models, OData services, and model provider. Fact sheet apps run only on
    an SAP HANA database and require an ABAP stack.


    In this book, we''ll discuss the implementation of fact sheet apps in Chapter
    5, and the creation/extension process in Chapter 10.'
