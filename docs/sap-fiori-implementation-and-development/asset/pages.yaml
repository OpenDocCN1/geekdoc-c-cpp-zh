    ![](img/45a7493fede9b923b78389c8563e03c4_371_0.png)


    Figure 9.42 Runtime Artifacts


    21. When you redefine an OData service, it generates the new OData service with
    the DPC and MPC. The DPC is used to code your new CRUD methods as well as function
    imports. You can define all backend logic in redefined methods of the DPC extension
    class. The MPC is used to define the data model; using the code-based implementation
    methods, you can create entities, properties, and so on.


    22. The SAP Gateway Service Builder generates the project. The base class inherits
    its code from the minimal SAP Gateway abstract class /IWBEP/CL_MGW_PUSH_ABS_DATA,
    and the extension class is created for both MPC and DPC by the SAP Gateway Service
    Builder, which is inherited from the base class.


    You''ve successfully extended the OData service! In the next section, we''ll register
    the OData service.'
