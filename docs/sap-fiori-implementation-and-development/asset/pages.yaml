- img_proc: true
  md: '# Register the OData Service


    The next step is to register the OData service. To expose the OData service you
    created in the previous step, you must create an entry in the service catalog
    in the SAP Gateway system (frontend server). A custom OData service is always
    developed on top of the SAP OData add-on installed in the backend server. To register
    the service on the frontend server, follow these steps:


    +   1. Select the SERVICE Maintenance folder from your project.

    2. Select your SAP Gateway host system, and click REGISTER (Figure 9.43).


    ![](img/45a7493fede9b923b78389c8563e03c4_372_0.png)


    Figure 9-43 Registering the Service


    +   3. Select LOCAL PACKAGE.

    4. Click CONTINUE


    # Test the OData Service


    After the service is registered, the final step is to test the OData service.
    In the next steps, we''ll test the service via a quotation ID that is available
    in the backend system. You can select any quotation that is available in your
    backend system to check if the OData service is responding correctly.


    Follow these steps:


    +   1. Run Transaction /IWFND/MAINT_SERVICE (on the SAP frontend server).

    2. Double-click the service in the list you''ve created in the previous step.'
