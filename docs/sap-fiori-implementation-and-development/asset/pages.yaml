    # 8.3 Development Process Overview


    Before we start applications or discussing the development process, let''s take
    a moment to explore the features of the SAP Web IDE. After you log in to the SAP
    Web IDE, you should see the development page see Figure 8.10).


    As shown in Figure 8.10, the menu bar gives you access to all the functions and
    features that are available in the SAP Web IDE. Below the menu is the toolbar,
    which has some of the most commonly used features such as SAVE, DELETE, RUN, and
    so on. On the left of screen is the WELCOME page and DEVELOPMENT preferences.
    Upon clicking the DEVELOPMENT button, you''ll open a screen area next to it, which
    has the list of files and projects within a project. You can open the file and
    its contents on the right-hand side in the code editor area. If you open several
    files, those files will be shown as tabs. On the right side of the screen, you''ll
    find features such as search, GIT PANE, GIT HISTORY,'
