  md: '# Introduction to SAP Fiori


    Congratulations, you''ve created your very first SAPUI5 app!


    # More Information


    For more information on building applications using SAPUI5, check out the SAP
    PRESS book, Getting Started with SAPUI5, by Miroslav Antolovic, at www.sap-press.com/3565.


    Chapter 8, we''ll dig deeper into the SAP Web IDE, and walk you through the options
    available to create or extend an SAP Fiori app. Next, we''ll look at the use of
    OData via SAP Gateway for SAP Fiori apps.


    # 1.4.2 OData and SAP Gateway


    Facebook and Ebay use it—so what is OData? And, how does SAP Gateway harness it
    for SAP software and applications? In this section, we''ll look at answering these
    questions and more.


    We''ll begin by discussing the concepts of OData and REST-based protocols. We''ll
    expand on the benefits of OData, and then look at the six constraints used to
    identify an application is considered RESTful. Then, we''ll walk through how to
    consume an OData service with a simple example.


    Finally, we wrap up the section by introducing SAP''s solution for harnessing
    the raw power of OData: SAP Gateway.


    # OData and REST


    Open Data Protocol (OData) is a REST-based protocol used to expose and consume
    data on the web. It is built on web technologies such as HTTP, Atom Publishing
    protocol (AtomPub), XML, and JSON to provide access to information from a variety
    of applications. It was originally developed by Microsoft, and was designed to
    provide a RESTful API which is accessible by forming an appropriate Uniform Resource
    Identifier (URI) and assigning it to the corresponding HTTP header. Essentially,
    anything that is possible with the UI becomes part of the API. Put simply, OData
    is used to expose, access, and modify information from different sources. The
    following are some of the advantages of using an OData protocol with SAP Gateway:


    +   - Industry-standard protocols for creating and consuming data APIs

    - Builds on core protocols like HTTP'
