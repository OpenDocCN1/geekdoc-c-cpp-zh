  md: '# Transactional and Fact Sheet Apps


    Similar to the frontend PFCG for the business catalog covered in Section 3.3.2,
    SAP delivers backend PFCG roles for every transactional app and fact sheet app;
    for example, the My Quotations app (refer to Figure 3.7) is delivered with a backend
    authorization role (PFCG) for the technical catalog. These roles include references
    to the corresponding OData services, which are required to run the apps.


    # Transactional App Roles


    Roles for the transactional apps don''t comprise authorizations for business data
    to be displayed in the app. These authorizations are provided by customer.


    For the user to access this transactional app, the administrator has to assign
    both the backend and frontend roles to the user. This is discussed further in
    Chapter 4, Section 4.3 and Section 4.4.


    # Fact Sheet Apps


    For fact sheet apps, in addition to the OData service authorization, you need
    to authorize users'' access to the underlying search models. You can find the
    search model entries in the AUTHORIZATIONS tab of Transaction PFCG (Role Maintenance).
    Follow these steps:


    +   1. From your ABAP backend server, run Transaction PFCG.

    2. Enter a role name, for example, "SAP_SD_SALESORDER_APP", and click.

