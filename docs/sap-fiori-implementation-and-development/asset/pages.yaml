  md: '# 10.3 Extending Fact Sheet Apps


    ![](img/45a7493fede9b923b78389c8563e03c4_406_0.png)


    Now that you understand the end-to-end process to create a fact sheet app, let''s
    look at the fact sheet extension process.


    # 10.3 Extending Fact Sheet Apps


    You extend a fact sheet when a standard fact sheet app delivered by SAP doesn''t
    meet your requirements. The following are scenarios when you can extend a specific
    layer of a system landscape for fact sheet apps:


    +   - You can extend a search model when you want to add fields to the fact sheet
    app that aren''t available in the search model.

    - You can extend the UI layer if the backend logic and the content required for
    the app extension are present in the SAP Gateway layer, but it''s not exposed
    to the UI layer.


    We''ll use an example based on the Sales Order fact sheet app in this section.
    We''ll walk you through extending both a search model and the UI layer by adding
    the new field RISK CATEGORY to the Sales Order app.


    407'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# 10.3.1 Extend the Search Model


    The first step in the extension process is to extend the search model. From the
    SAP Fiori reference library, search for the Sales Order fact sheet app, and navigate
    to the CONFIGURATION section. Go to the SEARCH CONNE section to get a list of
    connectors for the Sales Order fact sheet app (see Figure 10.33). In Chapter 5,
    Section 5.4, we discussed how to create a connector on a search model and how
    to enable an app using these connectors. In this section, we''ll show you how
    to extend a search model by adding a field.


    ![](img/45a7493fede9b923b78389c8563e03c4_407_0.png)


    # Search Models and Connectors


    To get the complete list of search models and connectors of all the SAP Fiori
    fact sheet apps, refer to SAP Note 1861013.


    To extend a model, we use the Search and Analytics Modeler, which is a component
    of SAP Enterprise Search. This tool allows developers to create or change models
    for search object connectors. You need to have extensive knowledge of the SAP
    Business Suite backend technology to create or change any search model.


    SAP Enterprise Search and the Search and Analytics Modeler are big topics. In
    this chapter, we''ll cover a very basic example on how to enhance a search model
    by added a field to it. The sections that follow walk through the different steps
    for extending the search model.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Extending Fact Sheets Apps | 10.3


    # Enhance the Model


    In this section, we will begin by enhancing our data model. As previously mentioned,
    most of the steps are similar when creating or enhancing a search object connector.
    In both scenarios, you''ll follow the sequence of screens:


    +   1. Expand the SD-SLS component, and then select SALES_ORDER_H.

