  md: '# 6.3.3 Configure the KPI Tile


    A KPI tile is the graphical representation of the evaluation of the KPI, which
    is visible to the user at runtime. The KPI is displayed in a tile. When you click
    the tile in SAP Fiori Launchpad, you''ll be able to drill down into the details.
    There are six types of KPI tiles:


    +   - NUMERIC TILE

    The aggregated value of the KPI measure of the evaluation that you created in
    Section 6.3.2 is displayed in the tile. In this tile, data is displayed in numeric
    format. The color of the value that is displayed depends on the threshold values,
    which you created with critical and warning values (see Figure 6.9).


