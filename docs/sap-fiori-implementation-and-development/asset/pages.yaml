    # 2.7 Summary


    This chapter provided an overview of the SAP Fiori system landscape and how to
    connect it with the ABAP environment, SAP HANA, and SAP HANA XS. We''ve discussed
    the many steps and tasks that are needed to install and configure SAP Fiori. There
    are certainly many SAP Fiori apps (500+), and the choice of the SAP Fiori landscape
    depends on the types of SAP Fiori apps you''ll use.


    Now that you understand how to set up SAP Fiori and what is needed to install
    different components in the landscape, we can look at securing different layers
    of the SAP Fiori system using authentication methods or single sign-on (SSO) procedures.
    We''ll discuss this in the next chapter.'
