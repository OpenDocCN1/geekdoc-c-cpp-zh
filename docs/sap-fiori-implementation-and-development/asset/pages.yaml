  md: 'This chapter walks through the implementation of fact sheet apps, including
    information on ABAP backend roles and search connectors.


    # 5 Implementing Fact Sheet Apps


    SAP Fiori fact sheet apps display contextual information and key facts about central
    objects used in business operations. Fact sheets can be called from SAP Fiori
    Launchpad or from other fact sheet, transactional, and analytical apps.


    Although many of the ABAP frontend tasks when compared to transactional and fact
    sheet apps are similar, it''s important to understand where their differences
    lie in terms of implementation.


    From an architectural perspective, when compared to transactional apps, the following
    is true for fact sheet applications:


    +   - Fact sheet apps must run only on an SAP HANA database system.


    +   - Fact sheet apps require a reverse proxy.


    +   - Fact sheet apps directly access search engines on the backend server via
    the INA search protocol.


    +   - Fact sheet apps display data from the SAP HANA database through search models.


    In this chapter, we''ll show you how to implement the Sales Order fact sheet app.
    The following is an overview of the configuration tasks for fact sheet apps:


    +   - Activate the SAPUI5 component.


    +   - Activate OData services for the SAPUI5 applications in SAP Gateway.


    +   - Assign an ABAP backend role to the user.


    +   - Create search connectors.


    +   - Index search connectors.'
  merge: -1
  pgno: 198
