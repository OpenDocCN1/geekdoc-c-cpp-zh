- img_proc: true
  md: '# 7.1 Introduction to OData


    By now you know that OData is the open standard that provides standard platform-agnostic,
    interoperability, and access to data sources via websites. The Open Data Protocol
    (OData) was built on web technologies such as HTTP, Atom Publishing protocol (AtomPub),
    XML, and JavaScript Object Notation (JSON) to provide access information from
    a variety of applications. It was designed to provide a RESTful application programming
    interface (API) that is accessible by forming an appropriate Uniform Resource
    Identifier (URI) and assigning it to the corresponding HTTP header. The biggest
    advantage of OData services is that they are multichannel and developed to serve
    many applications. Put simply, OData is used to expose, access, and modify information
    from different sources.


    In the following sections, we''ll discuss the basics of an OData service and OData
    queries.


    # 7.1.1 OData Service Basics


    In this section, we''ll cover the basic structure of an OData service. Let''s
    start with simple operations that can be performed using OData protocol.


    We''ll use a standard OData service of a Create Sales Order app, which you activated
    in Chapter 4, Section 4.2, to understand the concepts of an OData service. Follow
    these steps to view the OData service of the app:


    +   1. Log in to your ABAP frontend server.

    2. Run Transaction IWFND/MAINT_SERVICE.

    3. Filter with EXTERNAL Service Name for "SRA017_SALESORDER", and press Enter
    (See Figure 7.1).


    ![](img/45a7493fede9b923b78389c8563e03c4_261_0.png)


    Figure 7.1 Service Name'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Introduction to OData


    4. Select the service, then click GATEWAY CLIENT (see Figure 7.2).


    ![](img/45a7493fede9b923b78389c8563e03c4_262_0.png)


    Figure 7.2 Gateway Client


    5. Click Execute (see Figure 7.3).


    ![](img/45a7493fede9b923b78389c8563e03c4_262_1.png)


    Figure 7.3 Executing the


    An OData service is a logical data model that depicts how the users perceive the
    model behind the UI. Essentially, anything that is possible with the UI becomes
    part of the API, and each OData service is represented with a service root URI.
    There are two types of documents accompanying each OData service:


    +   * Service document

    This shows the details about entities: entity set. Figure 7.4 shows the service
    document with seven entities: Customers, Products, Product Images, Sales Orders,
    Product Attributes, Order Items, and Partner Addresses.


    +   * Service metadata document

    This gives you the structure of an OData service. It describes the Entity Data
    Model (EDM) of the source. In the service metadata document, the data is described
    in EDM terms using XML for describing models called the Conceptual Schema Definition
    Language (CSDL). An EDM describes the organization and the relationships between
    different data resources with models and entity types


    263'
