  md: 'You''ve successfully enabled HTTPS communication between the SAP Web Dispatcher
    and SAP HANA XS. You can test the configuration by running the URL https://<host_name>:<port>/sap/hana/xs/admin.


    #  3.2 Single Sign-On and User Authentication


    Now that we''ve covered some of the basic concepts of security in the SAP Fiori
    system, we can dive into some advanced security concepts of the authentication
    strategies that are supported in the SAP Fiori landscape. In this section, we''ll
    give you an overview of various advanced security-related system components based
    on Kerberos/SPNego, SAML 2.0, SAP login tokens, and X.509 certificate authentication.


    The SAP Fiori system needs to know the identity of a user. Knowing a user''s identity
    allows the SAP Fiori system to provide a customized experience and grant the user
    permissions to access the data from the backend servers. The authentication concept
    for SAP Fiori apps includes initial user authentication on the ABAP frontend,
    followed by the authentication of all requests to the backend systems. Table 3.3
    shows different types of SAP Fiori apps that support different authentication
    methods for SSO.


    Authentication is a process in which the credentials provided by a user from the
    client/browser are compared to those on file in a database of authorized users.
    After the user is authenticated, it creates a security session between the client
    and the SAP Gateway server for that specific user.


    | Authentication Method for SSO | Transactional Apps | Fact Sheet Apps | Analytical
    Apps (via SAP HANA XS) | Search (Fact Sheet) Apps |

    | User name/password | Yes | Yes | Yes |

    | SPNego/Kerberos (with SAP NetWeaver SSO) | Yes | Yes | No | No |

    | SAML 2.0 SAP login tokens | Yes | Yes | No | Yes |

    | X.509 | Yes | Yes | Yes | Yes |


    Table 3.3 Authentication for Requests in the Frontend Server'
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Important!\n\nSetting up security and authentication is a huge topic, so\
    \ we recommend always refer to the documentation provided at http://help.sap.com\
    \ for an in-depth understanding and the most up-to-date information on this topic.\n\
    \n# 3.2.1  Kerberos/SPNego\n\nKerberos/SPNego is a network authentication protocol\
    \ developed by MIT, and is a robust protocol that protects from any form of attacks.\
    \ In a nutshell, Kerberos offers the following:\n\n+   * A protocol for authentication\n\
    * Uses tickets to authenticate\n* Avoids storing passwords locally or sending\
    \ them over the Internet\n* A trusted third party\n* Built on symmetric-key cryptography\n\
    \nIf you've already implemented Kerberos/SPNego (e.g., Active Directory), then\
    \ this authentication is recommended. You can enable Kerberos/SPNego authentication\
    \ for the ABAP frontend server to access the SAP Fiori apps in your corporate\
    \ network. Because the Active Directory system is typically located in your corporate\
    \ network, Kerberos/SPNego authentication can't be used outside your corporate\
    \ network. To enable SSO using your corporate network, you might have to set up\
    \ a private network (VPN) connection.\n\n#   \n\nThe complete detailed steps for\
    \ configuring Kerberos/SPNego authentication have been documented in the Implementation\
    \ Guide (IMG) on the SAP Help Portal at http://help.sap.com/sapso\n\nThe following\
    \ are some of the advantages of using the Kerberos/SPNego authentication:\n\n\
    +   * It simplifies the logon process to the ABAP frontend server by using the\
    \ user's Windows logon data.\n* A separate logon to the ABAP frontend server isn't\
    \ required."
  merge: -1
  pgno: 149
- img_proc: true
  md: 'SSO setup within your system landscape will be simplified using Kerberos for
    both SAP GUI and HTTP.


    It’s supported by most mobile device vendors.


    > Important!

    The configuration of the Kerberos/SPnego authentication requires significant involvement
    from your Active Directory administration team.


    # 3.2.2 Security Assertion Markup Language 2.0


    SAML is an XML-based standard for communicating identity information between organizations
    and service providers. It is for enabling the secure transmittal of authentication
    tokens and other user attributes across domains.


    If you’ve already implemented SAML version 2.0 as the method of SSO, you can then
    configure the ABAP frontend server for use with SAML 2.0 in conjunction with Identity
    Provider (IDP) software such as SAP IDP, Ping Federate, or Microsoft-Active Directory
    Services (AD FS). In comparison with Kerberos authentication, SAML 2.0 authentication
    is relatively easy to configure. To enable SSO outside your corporate network
    (Internet-facing), you must make sure that the SAML IDP is securely accessible
    from outside your corporate network.


    The complete detailed steps for configuring SAML 2.0 authentication has been documented
    in the IMG on the SAP Help Portal at http://help.sap.com/nw74. Once there, choose
    APPLICATION HELP • FUNCTION-ORIENTED VIEW • SECURITY • USER AUTHENTICATION AND
    SINGLE SIGN-ON • INTEGRATION IN SINGLE SIGN-ON (SSO) ENVIRONMENTS • SINGLE SIGN-ON
    FOR WEB-BASED ACCESS • USING SAML 2.0 • CONFIGURING ABAP AS A SERVICE PROVIDER.


    The following are some of the advantages of using SAML 2.0:


    +   Works well in scenarios where the trust configuration can be complicated


    +   Enables you to map SAP users based on user name attributes or a user’s e-mail
    address


    +   Works well for scenarios with multiple user domains


    > Important!

    The SAP Fiori system landscape, SAML 2.0 is supported only for communication with
    the ABAP frontend server—not for SAP HANA.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Let''s take a closer look at SAML authentication flow. The most basic SAML
    archi-tect involves three main objects: a user, an IDP, and a service provider
    (see Figure 3.5). The users will need to authenticate themselves in a process
    known as service provider-based authentication.


    ![](img/45a7493fede9b923b78389c8563e03c4_151_0.png)


    Figure 3.5 SAML Authentication


    Looking at Figure 3.5, the steps for service provider-based authentication include
    the following:


    +   * First, the user attempts to access the application (i.e., the client sends
    a request to SAP Gateway server via a proxy server).

    * The federated identity software running on the IDP kicks into action, and the
    SAML 2.0 IDP server validates the user credentials, allowing the user to be properly
    authenticated.

    * The IDP then constructs and sends a specially formatted message containing information
    about that user (SAML artifact) back to the SAP Gateway server. The SAP Gateway
    then determines that the message came from a known IDP and creates a session for
    that specific user in the SAP Gateway, allowing user direct access to that application.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Transparency


    This whole process of the SAML message being created and the operation between
    the IDP and SAP Gateway is completely transparent to users. They all see is SAP
    Fiori Launchpad after clicking on the URL or app.


    #  3.2.3 SAP Logon Tickets


    SAP logon tickets are the cookies of a session that are stored in the client''s
    browser. For SAP logon tickets, you have two options: you can use either the existing
    system, such as a portal that already issues logon tickets, or you can configure
    the ABAP frontend server to issue logon tickets. You must also configure the required
    backend systems (ABAP or SAP HANA) to accept logon tickets. SSO then provides
    access to the SAP HANA database (or any database) from any frontend without needing
    to log in. The SAP HANA store contains the root CA that is used to sign the trusted
    certificates required for SSO authentication.


    # Important!


    User mapping isn''t supported, so you must ensure that users in the ABAP system
    have the same user name as the databases in SAP HANA. If a customer uses all three
    types of SAP Fiori apps, make sure the user name complies with the stricter restriction
    rules from SAP HANA.


    As we explained in Chapter 2, Section 2.6.5, from SAP NetWeaver 7.4 SP 6, you
    can even perform system configuration tasks automatically by using predefined
    tasks. You can use the SAP_SAP2GATEWAY_TRUSTED_CONFIG task list to create a trusted
    connection from an SAP system to an SAP Gateway system. Follow the process from
    Chapter 2, Section 2.6.5, and the system will guide you through the configuration
    of the tasks when you execute a task list (see Figure 3.6).


    The complete detailed steps for configuring the SAP logon token authentication
    is documented in the IMG on the SAP Help Portal at http://help.sap.com/nw74. Once
    there, use APPLICATION HELP • FUNCTION-ORIENTED VIEW • SECURITY • USER AUTHENTICATION
    AND SINGLE SIGN-ON • INTEGRATION IN SINGLE SIGN-ON (SSO) ENVIRONMENTS • SINGLE
    SIGN-ON FOR WEB-BASED ACCESS • USING LOGON TICKETS • USING LOGON TICKETS WITH
    AS ABAP • CONFIGURING AS ABAP TO ACCEPT LOG TICKETS.'
