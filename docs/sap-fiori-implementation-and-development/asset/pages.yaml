  md: '# B.2.2 Expert Theming


    Next, let''s look at the Expert Theming tool. To use this tool, select the EXPERT
    option and then enter "tilecolor" in the search box to filter the objects (see
    Figure B.7).


    ![](img/45a7493fede9b923b78389c8563e03c4_551_0.png)


    Figure B.7 Expert Theming


    You can change the color for the SAPUSHEILTCOLOR field, and that will change the
    color of the icons in the tiles. Your output should reflect all the changes you''ve
    made until now, and you can toggle between the ORIGINAL and Preview mode (see
    Figure B.8).


    ![](img/45a7493fede9b923b78389c8563e03c4_551_1.png)


    Figure B.8 Original and Preview Modes'
  merge: -1
  pgno: 551
- img_proc: true
  md: '# B.2.3 Save and Build


    The next step is to save and publish the changes to the ABAP frontend server.
    Fol-low these steps:


    1. Click on THEME • SAVE & BUILD (see Figure B.9).


    ![](img/45a7493fede9b923b78389c8563e03c4_552_0.png)


    Figure B.9 Save and Build


    2. Enter the THEME ID and the TITLE, and then click OK (see Figure B.10).


    ![](img/45a7493fede9b923b78389c8563e03c4_552_1.png)


    Figure B.10 Theme Details


    3. After the custom theme is saved and built, you should see a message something
    similar to Figure B.11. Click OK.


    ![](img/45a7493fede9b923b78389c8563e03c4_552_2.png)


    Figure B.11 Save Theme'
  merge: -1
  pgno: 552
- img_proc: true
  md: '# B.2.4 Test the Custom Theme


    You''ve successfully created a custom theme and then uploaded to the ABAP frontend
    server. Next, you''ll have to test the custom theme by following these steps:


    +   1. Log in to the ABAP frontend server, and run Transaction UI5/THEME_TOOL.

    2. Scroll down or search for your custom theme.

    3. Double-click on INFO (see Figure B.12).


    ![](img/45a7493fede9b923b78389c8563e03c4_553_0.png)


