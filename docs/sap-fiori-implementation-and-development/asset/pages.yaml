    # 2.2.2 SAP HANA Database


    When using Fiori with the SAP HANA database, the following four layers are implemented:
    the client, the reverse proxy, the ABAP frontend server, and the ABAP backend
    server (see Figure 2.2). This architecture is similar to what we discussed in
    the previous section, so we''ll only focus on the additional new layers or components.
    Which each layer has a clearly defined purpose. This type of landscape supports
    both transactional apps and fact sheet apps.


