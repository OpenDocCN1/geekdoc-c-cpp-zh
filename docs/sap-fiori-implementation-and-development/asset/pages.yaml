  md: 'This chapter provides an overview of how SAP apps can be integrated with SAP
    Lumira, SAP Jam, and SAP BusinessObjects Design Studio.


    # 13 Integration with Other SAP Products


    The SAP Fiori landscape can be integrated with SAP products such as SAP Jam, SAP
    Lumira, and SAP BusinessObjects Design Studio. In this chapter, we''ll cover the
    integration steps for each piece of software.


    We''ll start with an introduction of how to leverage SAP Jam in conjunction with
    SAP Fiori in Section 13.1, including how this can help business users collaborate
    with other tiles in SAP Fiori Launchpad or from SAP Fiori application. We''ll
    begin by looking at prerequisites for integration in Section 13.1.1. In Section
    13.1.2, we''ll show you how to configure a social media catalog, and we''ll leverage
    SAP Jam tiles in SAP Fiori Launchpad to collaborate with teams. We''ll end the
    SAP Jam and SAP Fiori integration section with an overview on different collaboration
    components in Section 13.1.4.


    Next, in Section 13.2, we''ll introduce you to SAP''s self-service visualization
    tool—SAP Lumira. We''ll start with the roles and authorizations that are required
    for a user to access SAP Lumira in SAP Fiori, and we''ll introduce the different
    tiles that are available in SAP Fiori from the SAP Lumira perspective. We''ll
    end the section by showing you how to create a SAP Fiori tile from SAP Lumira
    story.


    The chapter concludes with a discussion on integrating with SAP BusinessObjects
    Design Studio in Section 13.3. We''ll start with an overview of SAP BusinessObjects
    Design Studio and then briefly introduce the existing standard SAP Fiori apps
    that are developed using SAP BusinessObjects Design Studio. In Section 13.3.1,
    we''ll show you the configuration that is required on the ABAP servers to run
    all SAP BusinessObjects Design Studio applications that use the standard SAP'
  merge: -1
  pgno: 506
- img_proc: true
  md: 'Business Server Pages (BSP) application. We''ll end the section with an exercise
    on how to build an SAP Fiori app using SAP Business Warehouse (SAP BW) query and
    the standard BSP application.


    # 13.1 SAP Jam


    SAP Jam is a powerful enterprise social network solution where users can collaborate
    with teams to brainstorm issues related to business objects or to share knowledge
    within the organization. SAP Jam solves problems and improves decision making.
    In addition, SAP Jam can now be integrated with SAP Fiori via any of the following
    methods:


    +   * Using social media tiles in SAP Fiori Launchpad

    * Using collaboration components


    To better demonstrate how integration between these two products can help businesses,
    let''s look at an example. Say you''re a sales manager viewing sales orders in
    the Track Sales Order in SAP Fiori. During this review, you realize something''s
    wrong with a particular sales order. The next thing you do is share this information
    with your team, who can help solve this problem as quickly as possible. The SAP
    Fiori and SAP integration makes it easy to share the issue with team members via
    SAP Jam, which not only solves your issues with your subject matter experts quickly
    but also improves your decision making. After the problem is solved, you''ll receive
    a notification in SAP Fiori Launchpad. The beauty of SAP Jam is that all this
    social collaboration is happening securely across your entire organization, directly
    from SAP Fiori Launchpad.


    There are a number of prerequisites that have to be fulfilled to integrate SAP
    Jam and SAP Fiori. We''ll highlight the prerequisites in the next section. You''ll
    then configure the social media catalog to provide user access to SAP Jam tiles.
    Finally, we''ll highlight collaboration components that are integrated within
    SAP Fiori applications.


    # 13.1.1 Prerequisites


    The Social Media Integration (SMI) function integrates SAP Jam social collaboration
    platform tiles and SAP Fiori. The collaboration features of SMI aren''t just'
  merge: -1
  pgno: 507
- img_proc: true
  md: 'integrated between SAP Jam and SAP Fiori; they can also be integrated with
    other web technologies such as Web Dynpro, ABAP, and SAPUI5.


    You need to configure ABAP SMI to allow SAP Fiori apps and SAP Fiori Launchpad
    to use the SMI functions developed for SAP Fiori. SMI offers functions that run
    within the SAP Fiori app and run as an SAP Fiori tile. For more information, go
    to http://help.sap.com/nw-uiaddon, and choose SAP JAM INTEGRATION.


    In addition, you need to fulfill the following prerequisites:


    +   - Purchase an SAP Jam license

    - Ensure that every SAP Fiori user has an SAP Jam account


    # 13.1.2 Configuration


    After the SAP Jam and SAP ABAP SMI are configured, you can configure SAP tiles
    in SAP Fiori. The *social media catalog* is used to group Jam-related tiles for
    SAP Fiori Launchpad. Similar to other catalogs, the social media catalog should
    be associated to a PFCG role as well. We''ll now show you how to create a catalog
    and how to add this catalog to a new role. Most of these steps are very similar
    to what you''ve been seeing in the previous chapters.


