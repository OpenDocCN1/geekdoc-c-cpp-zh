    # Enable SSL between the SAP Web Dispatcher and the ABAP Frontend Server


    Secure Sockets Layer (SSL) is one of the standard security technologies for establishing
    an encrypted link between a server and client. SSL allows sensitive information
    to be transmitted securely. Typically, data is sent between the browser/client
    and the ABAP servers in plain text, leaving you exposed to eavesdropping. The
    most important part of SSL is the digitally signed certificate authority (CA),
    so when a user tries to connect the ABAP servers, the client will only trust the
    certificates from the organizations on its list of trusted CAs. In this section,'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'we will provide you with the high level steps for securing communications between
    the SAP Web Dispatcher and the ABAP frontend server using SSL. Follow these steps:


    +   1. Extract the SAP Cryptographic Library package, and install it on the SAP
    Web Dispatcher.


    +   2. Create an SAP Web Dispatcher''s Personal Security Environment (PSE) and
    the certificate requests using the SAPGENPSE configuration tool.


    For those without an SAP Basis background, the cryptography tool SAPGENPSE is
    used to generate a keystore in which you can store a certificate.


    +   3. After the certificate request is created, the contents of each of the certificate
    requests to a CA to be signed.


    +   4. After you''ve received the certificate response from your CA, import it
    into the SAP Web Dispatcher''s corresponding PSE using either the trust manager
    or the SAPGENPSE tool.


    +   5. Create credentials for the SAP Web Dispatcher to access the PSEs during
    runtime.


    +   6. Set the SSL profile parameters for the SAP Web Dispatcher.


    +   7. Restart the SAP Web Dispatcher, and test the connection.


    # 3.1-3 ABAP Frontend Server to ABAP Backend Server


    In the previous section, we discussed SSL, which is used to secure the communications
    between the client and the ABAP server. Similarly, there is a software layer in
    the SAP NetWeaver called Secure Network Communications (SNC), which enables stronger
    authentication, encryption, and SSO mechanism server to server. Using SNC, you
    can enable end-to-end application-level security. In addition, you can implement
    security features such as SSO functions that SAP doesn''t provide directly.


    In SAP Fiori, transactional and fact sheets transfer data from the ABAP backend
    to the ABAP frontend server using OData services. We''ll now look at how to secure
    these ABAP layers using SNC.'
