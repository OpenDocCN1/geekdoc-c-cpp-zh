  md: '# 3.1 Communication Channel Security and Encryption


    As discussed in Chapter 1, Section 1.2, SAP Fiori architecture crosses different
    network layers (see Figure 3.1).


    ![](img/45a7493fede9b923b78389c8563e03c4_137_0.png)


    Figure 3.1 Internet and Intranet Deployment Scenario


    The first point of defense in your SAP Fiori system should be secure the lines
    of communication between these layers. Chapter 1 explained, communication among
    the client, reverse proxy, and the servers to be established by using different
    communication channels and protocols to transfer data securely within your SAP
    Fiori system landscape.


    When a user launches an SAP Fiori application, the launch request is sent from
    the client to the SAP Gateway server via SAP Fiori Launchpad. During that launch,
    the SAP Gateway server (or ABAP frontend server) authenticates the user by using
    one of the authentication and SSO mechanisms.


    For example, if you''re implementing a transactional app in an Internet-facing
    scenario (i.e., the external-facing scenario), a common security measure is to
    put a'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'reverse proxy, that is, either the SAP Web Dispatcher or a third-party reverse
    proxy such as Apache, in the demilitarized zone (DMZ). SAP recommends deploying
    the SAP Web Dispatcher in your Internet-facing deployment scenario (see Figure
    3.1) because the security features aren''t very strong in the SAP Web Dispatcher;
    for example, it can''t scan the incoming POST bodies.


    Table 3.1 shows the communication paths used by SAP Fiori applications and the
    protocol that used for the connection. The application and the security types
    of data are transferred between all these communication paths.


    | Communication Path | Protocol | Application Type |

    | --- | --- | --- |

    | Web browser to SAP Web Dispatcher | OData HTTP/HTTPS | Fact sheet and analytical
    apps |

    | SAP Web Dispatcher to ABAP frontend server | OData HTTP/HTTPS | All |

    | SAP Web Dispatcher to SAP HANA XS | OData HTTP/HTTPS | Analytical apps |

    | SAP Web Dispatcher to ABAP backend server | INA HTTP/HTTPS | Fact sheet apps
    |

    | ABAP frontend server to ABAP backend server | RFC | Transactional apps and fact
    sheet apps |

    | ABAP backend server to SAP HANA/any database | SQL | Analytical apps |


    Table 3.1 Communication Paths


    To avoid third-parties intercepting communications between two layers, a system
    needs to be in place that''s susceptible to eavesdropping. Securing communication
    monitoring which users who have access to their company''s sensitive data on SAP
    Fiori Launchpad, in addition to ensuring that third parties who weren''t provided
    access can''t intercept anything. Communications taking place over different layers
    of the SAP Fiori landscape and an increasing awareness of the importance of interception
    issues, in this section, we''ll discuss a couple of ways to secure your communication
    channels.


    Encryption makes data hard to read by unauthorized parties. There are two important
    steps you can take to ensure that your data is safe:'
