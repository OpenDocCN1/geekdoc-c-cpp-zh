    \ or backend components.\n\n# SAP Maintenance Planner\n\nSAP recommends using\
    \ the SAP Maintenance Planner to install and update versions, to make sure all\
    \ the dependencies are addressed, and to ensure the system remains consistent.\
    \ The SAP Maintenance Planner is the successor of Maintenance Optimizer, Landscape\
    \ Planner, and SAP Product System Editor, and it's the central point of access\
    \ for all maintenance activities. Using this tool, you can easily perform system\
    \ upgrades, support package installations, and enhancement package updates. In\
    \ addition, you can consolidate critical tasks, such as defining maintenance dependencies,\
    \ and on, with the SAP Maintenance Planner.\n\nYou can launch the SAP Maintenance\
    \ Planner (see Figure 2.15) from https://apps.support.sap.com/sap/support/mp (log\
    \ in with your user ID).\n\n![](img/45a7493fede9b923b78389c8563e03c4_91_0.png)\n\
    \nFigure 2.15 SAP Maintenance Planner\n\nAs shown in Figure 2.15, the SAP Maintenance\
    \ Planner contains the following four areas:\n\n+   - EXPLORE SYSTEMS\n  Determines\
    \ the systems in your landscape."
