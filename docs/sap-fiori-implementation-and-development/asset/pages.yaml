    +   - Main drivers are SAP, Microsoft, and IBM


    +   - Decouple backend and frontend


    +   - Access by URI


    +   - Multichannel


    As we mentioned, OData is a REST-based protocol. REST stands for Representational
    State Transfer. It was first introduced by Roy Thomas Fielding in his 2000 PhD
    dissertation Architectural Styles and the Design of Network-based Software Architectures.
    Architectural properties of REST are recognized by applying six constraints. An
    application is considered RESTful only when all the following constraints are
    satisfied:


    +   - Constraint 1: Client server


    A uniform interface separates clients from servers. This kind of model allows
    the client and software components to be developed independently or replaced.
    For example, clients are not concerned about the data storage which remains in
    the server and servers are not concerned about the UI or user status, enabling
    servers to be more scalable.


    +   - Constraint 2: Stateless


    The client-server communication is further constrained by no client context stored
    on the server between requests, i.e. stateless interface requires the client to
    send requests with all the necessary information to the server, and a session
    client is held in the client.


    +   - Constraint 3: Cacheable


    Response from the servers can be cacheable. Therefore, it is important to implicitly
    or explicitly define whether the responses from the server are cache or not. Caching
    partially or completely eliminates client-server interactions and further improves
    performance and scalability.


    +   - Constraint 4: Layered system


    A client cannot ordinarily distinguish if it''s connected directly to an actual
    endpoint server or to an intermediate server. System scalability can be improved
    by enabling load balancing and by providing shared caches on the intermediate
    servers.


    67'
