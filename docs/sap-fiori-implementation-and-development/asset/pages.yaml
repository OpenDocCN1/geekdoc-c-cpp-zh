  md: "Entities are structured as records with a key, under the entity types. For\
    \ example, expand the Customer entity type, and you'll notice the keys (Customer\
    \ ID, Division, etc.).\n\nAssociation defines the relationship between two entity\
    \ types, and association includes two association ends (entity types). Association\
    \ ends the entity type elements, the roles of the entity type elements, and the\
    \ cardinality rules for each association end. For example, expand the CustomerSalesOrder\
    \ association in the service metadata document see Figure 7.8, and the entity\
    \ are Customers and Sales Order, and the cardinality is one to many (i.e., one\
    \ customer have many products).\n\n```\n<Association sap:version=\"1.0\" Name=\"\
    CustomersSalesOrder\">\n  <End Type=\"SRAD017_SALESORDER_CREATE_SRV.Customer\"\
    \ Role=\"FromRole,CustomersSalesOrder\">\n  <End Type=\"SRAD017_SALESORDER_CREATE_SRV.Customer\"\
    \ Role=\"ToRole,CustomersSalesOrder\">\n  <ReferentialConstraint>\n    <Principal\
    \ Role=\"FromRole,CustomersSalesOrder\">\n      <PropertyRef Name=\"Division\"\
    />\n      <PropertyRef Name=\"DistributionChannel\"/>\n      <PropertyRef Name=\"\
    SalesOrganization\"/>\n      <PropertyRef Name=\"CustomerID\"/>\n    </Principal>\n\
    \    <Dependent Role=\"ToRole,CustomersSalesOrder\">\n      <PropertyRef Name=\"\
    Division\"/>\n      <PropertyRef Name=\"DistributionChannel\"/>\n      <PropertyRef\
    \ Name=\"SalesOrganization\"/>\n      <PropertyRef Name=\"CustomerID\"/>\n   \
    \ </Dependent>\n  </ReferentialConstraint>\n</Association>\n```\n\nFigure 7.8\
    \ Association\n\nFor example, to read the list of customers from an OData service,\
    \ replace $meta-data with customers at the end of the service URL. Initially you\
    \ might find this very confusing, but eventually you'll get used to all these\
    \ terms, and you'll be able to understand an OData service very easily.\n\n# 7.1.2\
    \ OData Service Queries\n\nNow that you understand how to read a service, let's\
    \ move on to the most important operations, that is, Create, Read, Update, and\
    \ Delete (CRUD) operations. OData uses the existing HTTP verbs (POST, GET, PUT,\
