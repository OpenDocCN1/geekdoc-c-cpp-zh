    # 6.3.5 Assign Roles to Users to Access SAP HANA Data


    Users launch analytical apps from SAP Fiori Launchpad, and then the SAP Dispatcher
    directs the OData request from the client to SAP HANA XS. Both the data and the
    KPI definitions are stored in the SAP HANA system. So for the users to access
    the data and the KPI definitions from the SAP HANA system, you need to ensure
    that they are given the correct access rights.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Analytical Apps with the SAP Smart Business Modeler | 6.3


    In Chapter 2, gave you an overview of the SAP Fiori architecture with the SAP
    HANA XS landscape. SAP HANA XS contains the SAP Fiori app content, KPI framework,
    generic drillndown, and the VDM reuse content. SAP HANA XS reads data from the
    SAP HANA database. Using the Odata services that require authorizations (i.e.,
    SAP HANA privileges), these privileges are grouped together in roles, and certain
    generic roles that must be assigned to all users.


    In Chapter 2, we discussed these roles in greater detail. Besides generic roles,
    SAP delivers a role for each analytical app, which includes all app-specific privileges
    as well. For the users who need access to a specific app, you need to assign this
    app-specific role to the user.


    # SAP HANA Role


    For more information on the SAP HANA role for a specific app, refer to the app-specific
    documentation.


    Figure 6.31 shows the Days Sales Outstanding app-specific role that has to be
    assigned to the user for the user to read the KPI data from the SAP HANA system.


    | Technical Configuration |

    |---|---|

    | Technical Catalog | /UI2/SAP_KPIFRW5_TC_S |

    | TECHNICAL_PFCG_ROLE | /UI2/SAP_KPIFRW5_TCR_S |

    | Semantic Object | |

    | Action | AnalyzeKPIDetails |


    | OData Services |

    | OData Service | Package |

    | /sap/hbar/sfin700/odata/ar/kpi.xsodata | sap.hba.r.sfin700.db |


    | SAP HANA Roles |

    | Role | Package |

    | sap.hba.r.sfin700.roles: SapSmartBusinessReceivablesManager | sap.hba.r.sfin700.roles
    |


    Figure 6.31 App-Specific Configuration Details


