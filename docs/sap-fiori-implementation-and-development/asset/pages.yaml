    # MVC Concept


    Model-View-Controller (MVC) is a fundamental design pattern used to separate UI
    from business logic. It was introduced by Trygge Reenskaug, and is one of the
    first software architectural pattern for implementing UI.


    This concept divides a given software application into three interconnected parts,
    separating the internal representation of information from the ways that information
    is accepted from the user. You will see MVC design concepts in most of the SAP
    Fiori applications when you create or extend an app. Figure 1.23 shows the MVC
    pattern which proposes three main components or objects to be used in software
    development:


    +   - Model


    Model represents the underlying, logical structure of data in a software application
    and the high level classes associated with it. This object model does not contain
    any information about the UI.


    55'
