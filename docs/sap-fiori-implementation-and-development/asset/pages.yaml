  md: '# # B Customizing SAP Fiori Launchpad


    SAP Fiori Launchpad is a shell page from which all SAP Fiori apps can be accessed.
    SAP Fiori Launchpad can be customized using a tool called the UI Theme Designer.
    The UI Theme Designer isn''t just for SAP Fiori, but also functions as a tool
    for cross-coloring scenarios many platforms and technologies. For example, when
    you create a theme for SAP Fiori Launchpad, you can then apply the same theme
    to SAP Fiori applications, Web Dynpro ABAP, Floor Plan Manager (FPM), and SAP
    Business Client.


    # ## B.1 UI Theme Designer Overview


    The UI Theme Designer is a browser-based tool with a WYSIWY designer; therefore,
    any change that you make can be viewed immediately in the browser. Using the UI
    Theme Designer, you can create your own themes with your corporate identity, corporate
    colors, and company logo.


    Figure B.1 shows the SAP Fiori Launchpad architecture with the UI Theme Designer.
    The top layer shows the UI Theme Designer built on SAPUI5. The theme repository
    on the ABAP frontend server contains SAP standard themes and custom themes. Anytime
    you create a custom theme, the Theme Designer generates LESS files, CSS files,
    and images, which are saved into the repository. These files are received via
    HTTP calls. The application is loaded with the CSS files from a chosen custom
    theme.


    ![](img/45a7493fede9b923b78389c8563e03c4_546_0.png)


    Figure B.1 Architecture'
  merge: -1
  pgno: 546
- img_proc: true
  md: 'The following are transaction codes you''ll be using while working with the
    UI Theme Designer:


    +   - UI5/THEME_DESIGNER

    This transaction is used to create, edit, copy, delete, or rebuild/upgrade a theme.


    +   - UI5/THEME_TOOL

    This transaction is used for deleting, exporting, importing, transporting, and
    to analyze theme content.


    +   - UI Theme Repository

    This tool is used for exporting or importing single files, or it''s used to analyze
    theme content.


    Now that you have an overview of the UI Theme Designer, let''s look at how to
    create themes for SAP Fiori Launchpad.


    # B.2 Creating a Custom Theme


    In this section, we''ll show you how to create a new theme for SAP Fiori Launchpad
    and how to apply it to the default template. To do so, follow these steps:


    +   1. Log in to your ABAP frontend server.

    2. Run Transaction UI5/THEME_DESIGNER to open the UI Theme Designer.

    3. Select a theme, and click OPEN (see Figure B.2).


    ![](img/45a7493fede9b923b78389c8563e03c4_547_0.png)


    548'
  merge: -1
  pgno: 547
- img_proc: true
  md: '# Base Theme


    You can create a custom theme only on a base theme. For example, in the previous
    step, to create a new custom theme we started with the SAP Blue Crystal.


    4. Enter the link to the application. In our example, we want to change the theme
    of SAP Fiori Launchpad, so enter the SAP Fiori Launchpad URL (see Figure B.3).
    You can also provide a name for the application, but this is optional.


    ![](img/45a7493fede9b923b78389c8563e03c4_548_0.png)


    Figure B.3 Application Link


    The UI Theme Designer provides various options for theming depending on the skill
    (see Figure B.4).


    +   * Quick Theming

    * Expert Theming *

    * Color palette *

    * Manual LESS or CSS editing


    * Experimental features, which aren''t for productive use, may be changed by SAP
    at any time.


    You can toggle between ORIGINAL and PREVIEW modes to compare your changes with
    the actual version.'
  merge: -1
  pgno: 548
- img_proc: true
  md: 'You can select between different layouts, that is, DESKTOP, MOBILE, and TABLET,
    to simulate your changes on different device types.


    ![](img/45a7493fede9b923b78389c8563e03c4_549_0.png)


    Figure B.4 UI Designer Options


    Next, let''s look at some of the options in Quick Theming that can help you change
    the look and feel of SAP Fiori Launchpad.


    # B.2.1 Quick Theming


    Using the Quick Theming option, you can change the background colors, fonts, and
    images. The following steps demonstrate how to do this for your custom application:


    +   1. First, we''ll add a custom background and logo. Upload the images by clicking
    the button next to the menu (see Figure B.5).


    +   2. After uploading the background image and icon, the Quick Theming tool will
    replace the standard SAP images. Similarly, you can change the text colors, fonts,
    and so on (see Figure B.6).


    550'
  merge: -1
