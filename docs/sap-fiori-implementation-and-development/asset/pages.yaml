    # 2.5.2 SAP Web Dispatcher


    In Chapter 1, we give a brief introduction to the SAP Web Dispatcher. In this
    section, we will discuss the SAP Web Dispatcher in greater detail. To recap, the
    SAP Web Dispatcher enables users to access the SAP Web Gateways that are behind
    the corporate firewall. The SAP Web Dispatcher is the entry point for HTTP and
    HTTPS requests. The main role of the SAP Web Dispatcher is to accept or reject
    connections from the client/browser. After the connection is accepted, it diverts
    the queries from the browser to your SAP system.


    2'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Depending on the type of app you''re running, the queries are directed by the
    SAP Web Dispatcher (reverse proxy) from the browser to the ABAP frontend or the
    SAP HANA server. For example, when you run an analytical app, the SAP Web Dispatcher
    routes the queries first to the ABAP frontend server and then to the SAP HANA
    XS engine.


    # Deploying Transactional Apps


    If you''re deploying transactional apps, and running them only via an intranet
    zone, then you don''t need to set up a reverse proxy. However, if you want to
    access the transactional apps via the Internet, then you can use a reverse proxy
    (SAP Web Dispatcher).


    SAP recommends installing the SAP Web Dispatcher as the reverse proxy. Following
    the installation and configuration process that is available online at https://help.sap.com/saphelp_nw74/helpdata/en/48/8fe37933114e6fe10000000a421937/frameset.html


    After the SAP Web Dispatcher is installed, you need to configure the following
    communication scenarios. We''ll cover these configuration topics in further detail
    during the security setup in Chapter 3:


    +   - HTTP communication


    +   - SSL termination


    +   - SSL reencryption


    # 2.5.3 SAP HANA Server


    As previously discussed, analytical apps run only on an SAP HANA database, using
    VDMs. A VDM is a structured representation of SAP HANA database views, and these
    VDMs are deployed with SAP HANA Live for SAP Business Suite.


    SAP delivers the SAP HANA Live packages for a large number of SAP Business Suite
    areas. For more information on SAP HANA Live, go to http://help.sap.com/hba, and
    select the package you want to install.


    Depending on the SAP Fiori apps that you want to implement, you have to install
    the SAP Smart Business products on your SAP HANA server as well. These SAP Smart
    Business products include the VDM Table 2.1 provides a list of SAP Smart Business
    products that are available.'
