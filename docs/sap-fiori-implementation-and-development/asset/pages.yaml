    # 12.2.3 Scenario Specific Inbox


    SAP delivers many standard approval scenarios. However, in real-world scenarios,
    the standard approval apps may not be sufficient for your business requirements.
    The My Inbox app allows you to define your workflow scenario and create scenario-specific
    tiles in SAP Fiori Launchpad. Next, we''ll provide an example with step-by-step
    instructions on how to add a custom workflow to the My Inbox app based on a purchase
    order approval process. The following tasks will be:


