    a lightweight programming model for desktop and mobile applications. All the SAP
    Fiori UIs are built using SAPUI5 technology, so it is important to understand
    the basic concepts of SAPUI5, and the tools that support the development of SAP
    Fiori apps. The following list describes the key features of SAPUI5:


    +   - SAPUI5 APIs are designed to be easily consumed and used


    +   - SAPUI5 supports client features based on JavaScript


    +   - Custom controls or UI components can be easily extended


    +   - Powerful theming tools which allows users to change the theme for custom
    branding based on CSS


    +   - Provides AJAX capabilities and can be used with other standard JavaScript
    libraries


    +   - Uses the popular jQuery library as a foundation


    +   - High performance; fully supports SAP product standards


    +   - Based on open standards like OpenAJAX, JavaScript, HTML5, etc.'
