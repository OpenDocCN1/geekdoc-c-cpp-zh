- img_proc: true
  md: 'To begin your SAP Fiori journey, we''ll start with the basics: SAP Fiori''s
    architecture, app types, and the related SAP technologies required for implementation.


    # # Introduction to SAP Fiori


    In today''s business environment, users face many challenges in the hunt for timely,
    up-to-date, and accurate information. In addition, accessibility to this information,
    anywhere, anytime, is vital to their ability to make faster, smarter decisions.
    Applications have revolutionized the landscape of "on-demand" business accessibility
    in addressing the needs of these users.


    SAP''s answer: SAP Fiori. SAP Fiori UX provides role-based, personalized user
    experience (UX) for enterprise-wide engagements across lines of businesses (LOBs),
    and offers optimal usability on multiple devices for the best business interactions.
    In this book, we''ll discuss the development skills needed to implement, customize,
    and create SAP Fiori apps.


    Beginning with this chapter, we''ll introduce you to SAP Fiori, and all the related
    concepts you will come throughout this book. We''ll start with an overview of
    SAP Fiori and SAP''s UX strategy in Section 1.1, then dive into SAP Fiori''s architecture
    and integration technologies in Section 1.2. From there, we''ll look at the three
    main types of SAP Fiori apps: transactional, fact sheet, and analytical apps in
    Section 1.3. Finally, in Section 1.4, we''ll discuss related SAP technologies
    that enable the implementation and use of these apps.


    # ## 1.1 SAP Fiori and the Evolution of UX


    Technology requirements are changing. An emphasis on user experience is now prevalent
    in the creation of new and emerging products. Like the Facebook and Twitter apps,
    users want a similar user experience for their business applications.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Introduction to SAP Fiori


    At SAPPHIRE 2013, SAP released a new class of SAPUI5-based applications, and dubbed
    them SAP Fiori, as part of their revamped UX strategy. The idea? Apply modern
    design principles for a totally reimagined user experience.


    The initial release of SAP Fiori had 25 apps, and today (November 2015) the number
    of SAP Fiori apps has grown rapidly to over 500, providing consistent and simple
    UX across multiple devices. Even now, SAP continues to work on new and innovative
    SAP Fiori apps to add to its portfolio. Up-to-date app information can be found
    on the SAP Fiori apps reference library http://www.sap.com/fiori-apps-library.
    Chapter 2, Section 2.4 provides further information on the apps reference library.


    # Meaning in the Name


    Fiori means flower in Italian. This is the reason why you see flower pictures
    associated with SAP Fiori—such as the cover of this book.


    In the sections that follow, we''ll provide an overview of SAP''s UX strategy,
    then describe how this has impacted the UX design principles used to develop SAP
    Fiori apps.


    # 1.1.1 SAP UX Strategy


    SAP''s UX strategy has four areas of focus:


    +   * New  SAP continues to create new applications with consumer-grade user experiences
    to accomplish customer needs.


    +   * Renew  SAP took all the most frequently used business scenarios and renewed
    them with SAP Fiori apps by improving the user experience.


    +   * Enable  This gives SAP customers and partners the ability to improve the
    user experience on their own using enablement tools. For example, SAP Screen Personas
    enables customers to optimize or simplify any screen in the graphical user interface
    (GUI).


    +   * UX design services  This is an element that came from customers who wanted
    to transfer their own reality into the SAP UX strategy.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Primarily, UX design services are at the heart of the SAP UX strategy. Some
    believe that UX is a lot of colors and fancy components. However, this is simply
    not true. Great UX can have a tremendous impact on a business'' success. With
    great user experience you can:


    +   - Achieve productivity and work more efficiently.

    - Increase user adoption and decrease errors.

    - Save on training costs.


    To achieve true design innovation, the following three concepts should be kept
    in mind:


    +   - Business

    Understanding the business requirements.

    - Technology

    Exploring and understanding the feasibility or technology.

    - Human values

    Understanding what usability and desirability mean to your users.


    As previously mentioned, only once these three components are combined together,
    you will achieve the design innovation.


    In the same vein, in the next section, we''ll discuss how SAP''s UX design services
    have been implemented into SAP Fiori UX design principles.


    # 1.1.2 SAP Fiori UX Design Principles


    SAP Fiori design principles ensure that all business applications follow the UX
    design services developed by SAP. The following are five design principles that
    make up the SAP Fiori UX paradigm. These five design principals together create
    a beautiful UX that is consistent, regardless of your role in the organization
    or screen:


    +   - Role-based

    SAP broke down a number of SAP transactions and turned them into easy-to-use apps
    that are task-based and tailored to show only the most relevant information that
    the user needs.


    +   - Responsive

    SAP made sure that SAP Fiori UX worked seamlessly to facilitate consistent user'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'experience across all devices such as phones, tablets, and desktops; and supports
    multiple mobile technologies such as iOS, Android, Windows, and Mac.


    +   * Simple

    SAP Fiori UX is focused on delivering simple, intuitive user experience to match
    customer demands. SAP used a simple 1-1-3 (i.e. one user, one case, and three
    screens) scenario to make SAP Fiori apps easy to use and learn.


    +   * Coherent

    SAP made sure all the SAP Fiori apps have a similar look and feel by establishing
    best practices for design.


    +   * Delightful

    SAP Fiori is designed to have a low barrier of adoption, and provide users with
    apps that enable them to be proactive by using an assistant.


    Having clearly defined design principles ensures quality SAP Fiori apps over a
    multitude of software. With this brief introduction, we will turn our attention
    to the architectural components and integration technologies found in SAP Fiori.


    # 1.2 Architecture and Integration


    In this section, we''ll discuss the high level architecture that all SAP Fiori
    apps allow. Figure 1.1 shows different components of the architecture.


    From this bird''s eye view, we see that the SAP Fiori system landscape is comprised
    of a client/browser layer, reverse proxy, ABAP servers, SAP HANA Extended Application
    Services (XS), and a backend database. Each layer has a clearly defined purpose,
    and are bundled with components that fulfill that purpose. The following define
    each of these layers:


    +   * Client/browser

    The client layer is where the actual consumption of SAP Fiori apps takes place.
    SAP Fiori Launchpad is the entry point to all SAP Fiori apps on mobile, desktop,
    or tablet (see Section 1.2.1).


    +   * Reverse proxy

    A reverse proxy is a type of proxy server that typically sits behind the firewall
    in a private network and directs client requests to the appropriate backend server.
    The reverse proxy provides an additional level of security and control to ensure
    the smooth flow of network traffic between clients and servers. SAP'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'recommends using the SAP Web Dispatcher as a reverse proxy server (see Section
    1.2.2). The SAP Web Dispatcher is only required as a reverse proxy for analytical
    and fact sheet apps.


    +   **ABAP servers**nThe ABAP frontend server is recommended for all app types.
    The ABAP frontendend server contains the UI layer and infrastructure components,
    as well as SAP Gateway with OData enablement. The ABAP backend server contains
    the backend business logic and search models for fact sheet apps.


    +   **SAP HANA XS**

    SAP HANA XS is only required for analytical apps. SAP HANA XS replicates data
    from the backend server and remodels it using virtual data models (VDM).


    +   **Backend server**nThe backend database can be any database for transactional
    apps or an SAP HANA database for fact sheet and analytical apps.


    ![](img/45a7493fede9b923b78389c8563e03c4_30_0.png)


    Figure 1.1 SAP Fiori Architecture


    Now that we have a general idea of SAP Fiori''s architecture and system landscape,
    we''ll look more closely at some of the key architectural features, as well as
    explore how the different layers of SAP Fiori communicate with one another.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 1.2.1 SAP Fiori Launchpad


    SAP Fiori Launchpad is the entry point for all SAP Fiori applications. It is a
    role-based, personalized platform, with real-time capabilities. The beauty of
    SAP Fiori Launchpad is that it is designed around a very simple and intuitive
    user experience, and doesn''t require a lot of training.


    Figure 1.2 shows the SAP Fiori Launchpad homepage with a variety of apps. Users
    can personalize the homepage by managing groups or apps.


    ![](img/45a7493fede9b923b78389c8563e03c4_31_0.png)


    Figure 1.2 SAP Fiori Launchpad Homepage


    SAP Fiori Launchpad, users have access to only those apps or groups to which content
    administrators assign them. Tiles are divided into groups ① (see Figure 1.2),
    and users have access to create, delete, or arrange these groups. Using the TILE
    CATALOG ➁, users can add tiles to these groups. Administrators can set the tiles/apps
    to display automatically in the homepage ❸. In addition, users can add, remove,
    rename, and move tiles from the homepage using the PERSONALIZE icon ❹. From SAP
    Fiori Launchpad, you cannot only launch SAP Fiori apps, but also SAPUI5 custom
    apps, Web Dynpro ABAP, or any URL.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'Search is another capability of SAP Fiori Launchpad. Using this feature, users
    can view recent searches, recent apps, and any apps finds. Additionally, users
    can directly open a fact sheet app. For example, a user can search for a sales
    order number in SAP Fiori Launchpad and open the Sales Order fact sheet app to
    get answers immediately. In Chapter 5, we''ll discuss the implementation of search
    functionality in fact sheet apps.


    SAP Fiori Launchpad allows users to create their own custom themes using the UI
    Theme Designer, and apply these to SAP Fiori Launchpad. In Appendix B, we will
    walk you through the step-by-step instructions on how to create a custom theme
    using this tool.


    Another important aspect of SAP Fiori Launchpad is its responsiveness. This feature
    makes it that visual design adapts automatically to the respective screen size,
    be it desktop, mobile phones, or tablets. SAP provides a native app for SAP Fiori
    Launchpad called SAP Fiori Client that enables this. More information on SAP Fiori
    Client can be found in Appendix A.


    Next, we will discuss the different deployment options for SAP Fiori Launchpad.


    # Deployment Options


    There are a number of deployment options available to deploy SAP Fiori Launchpad.
    Depending on your existing landscape and the types of apps you would like to implement,
    you can decide which deployment option is right for you (Figure 1.3).


    As shown in Figure 1.3, you can deploy SAP Fiori Launchpad on the following systems:


    +   - ABAP frontend server in combination with SAP Gateway

    This is the traditional implementation, and is recommended for customers without
    an SAP Enterprise Portal implementation. It is the only platform that supports
    all the SAP Fiori app types (transactional, fact sheet, and analytical apps).


    +   - SAP Enterprise Portal

    This deployment is recommended for customers who would want to reuse their existing
    SAP Enterprise Portal and run SAP Fiori Launchpad. Technically, it is just another
    framework page which enables the use of SAP Fiori Launchpad.'
  merge: -1
