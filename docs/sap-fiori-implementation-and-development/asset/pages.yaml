  md: '# 9.2.2 Extend the SAP Gateway Layer


    In Chapter 7, we discussed OData concepts in general with a simple OData service
    example. Additionally, we looked at the different options when redefining an OData
    service that is created in SAP Gateway and external services as BOPF, SAP BW Query,
    and GenIL. Using the SAP Gateway Service Builder, you can extend the OData service
    using the redefine technique, which lets you reuse the business objects and services
    from your existing SAP system landscape.


    The SAP Gateway Service Builder is an OData-compliant modeling environment that
    provides developers with a set of tools for creating and maintaining an OData
    service. This tool provides options for both experienced developers and less experienced
    developers. Experienced developers can define a new service, whereas less experienced
    developers can import existing definition files or use content generators to expose
    the data for simple consumption. In addition, this tool empowers nonprogrammers
    to build applications using wizards and templates.


    # Redefine and Extend the OData Service


    A standard SAP-delivered project will be the starting point for the extension
    project. Let''s look at how to extend an OData service by using the redefine technique
    in the SAP Gateway Service Builder. Follow these steps:


    +   1. Log in to ABAP frontend server.


    +   2. Run Transaction SEGW.


    +   3. Create a new project by clicking the Create Project icon (see Figure 9.32).


    ![](img/45a7493fede9b923b78389c8563e03c4_365_0.png)


    +   4. On the next page, enter the following project details (see Figure 9.33):


    +   - PROJECT: "ZLORD_MY_QUOTATION"


    +   - DESCRIPTION: "OData Service Extension for My Quotation"'
