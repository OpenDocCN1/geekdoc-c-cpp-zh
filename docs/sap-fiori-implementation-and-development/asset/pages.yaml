  md: '# EXPLORE SYSTEM TRACKS


    Lists groups of technical systems.


    # TRANSACTIONS


    Gives you an overview of all the transactions you created.


    # PLAN A NEW SYSTEM


    Enables you to add a new system to your landscape.


    SAP Fiori apps require frontend and backend components. These components are delivered
    in separate products that you need to install in the system landscape. The SAP
    Maintenance Planner addresses the need to install frontend and backend components
    delivered in separate products by calculating all the system requirements for
    an SAP Fiori installation.


    You can choose the apps that you need to install from the SAP Fiori apps reference
    library, and then launch the SAP Maintenance Planner from the library to calculate
    the system requirements to install the apps you selected. We''ll highlight some
