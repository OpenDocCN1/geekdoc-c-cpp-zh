  md: '# Extending Transactional Apps | 9.2


    With high level introduction, let''s straight into the steps for extending a transactional
    app by using an example based on the My Quotations transactional app. You''ll
    extend the app by adding the STATE field to the standard app (see Figure 9.22);
    that is, you''ll display the STATE field in the SHIP TO ADDRESS.


