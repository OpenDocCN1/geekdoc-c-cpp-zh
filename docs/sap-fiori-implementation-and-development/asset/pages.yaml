    # 9.2.1 Extend the SAP Business Suite Layer


    The first step in the extension process is to append the ABAP DDIC structure of
    the OData service with the new field in the backend server (SAP Business Suite
    layer), so that you can use the new region field in the UI layer.


    Region/State


    REGION and STATE are the same. REGION is the field from the DDIC structure, and
    STATE is the title that you''re adding in the app.


    To add a field to the app, you need to find out the package and the DDIC structure
    details. You can do this by referring to the SAP Fiori app-specific online help
    at http://help.sap.com/fiori, and navigating to the APP EXTENSIBILITY section
    of the My Quotations app.


