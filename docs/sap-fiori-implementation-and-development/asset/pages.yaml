  md: 'OData services are required to connect SAP Fiori to the backend SAP system.
    This chapter gives you an overview of service generation methods and offers step-by-step
    instructions on how to generate the OData services using the SAP Gateway Service
    Builder.


    # #7 Creating OData Services with SAP Gateway


    Before we creating and extending SAP Fiori apps, we need to clear some basic concepts
    on OData services and the SAP Gateway Service Builder. The main objective of this
    chapter is to give you an in-depth look at OData services and SAP Gateway Service
    Builder, as well as the process of creating an OData service. We''ll walk you
    through the service generation methods using the SAP Gateway Service Builder,
    and at the end of this chapter, we''ll do a couple of exercises to explore the
    three main states in service creation: data model definition, service implementation,
    and service maintenance.


    In Chapter 1, we introduced the REST protocol, OData protocol, and SAP Gateway.
    SAP Gateway and OData service creation is a big topic. Our intent is to discuss
    current scenarios or methods of service generation will enable you to better understand
    the processes when creating or extending SAP Fiori apps in the next chapters.
    In this chapter, you''ll learn three different ways to create data models and
    generate OData services using the SAP Gateway Service Builder.


    We start with an overview of OData concepts exploring its documents with an example
    in Section 7.1.1 and then guide you through the various terms in the SAP Gateway
    Service Builder (see Section 7.2). In Section 7.3.1, we''ll introduce you to import
    functions to build a data model, an example of Sales Order Header data from the
    Business Object Repository (BOR), and show you how to build a data model and generate
    an OData service. In Section 7.3.2, we''ll provide an overview of the second method
    to generate data models and OData services by redefining services. At the end
    of this section, we''ll show you how to create an OData service on top of an SAP
    Business Explorer (BEx) query.'
  merge: -1
