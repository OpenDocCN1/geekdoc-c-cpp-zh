  md: '# Dear Reader,


    I have a confession...I love my iPhone. I wake up to it in the morning and lay
    beside it at night. There are times when I fear Siri may know me better than I
    know myself... and the apps; don''t even get me started! I''m a Flipboard fiend,
    sucking up news like oxygen. Pandora dictates my mood. I''m fascinated by this
    tiny computer at my fingertips. But more than anything, it''s the ease and the
    simplicity of use that allows me to feel, well, connected to the world.


    We have spoken. And we declare: “Make it simple. Make it mine.” SAP’s answer:
    SAP Fiori. With 500+ apps and more to come, this cross-industry UX has simplified
    business interactions in classic products and in new products such as SAP S/4HANA
    Finance. As a developer, it''s your job to keep pace with these innovations. That''s
    where this comes into play. With this guide, you''ll discover how to implement
    SAP Fiori apps, create apps from scratch, and extend functionality—all to the
    delight of your users. So, turn the page, and discover why SAP Fiori is more than
    just a pretty face; it''s an experience.


    What did you think about SAP Fiori Implementation and Development? Your comments
    and suggestions are the most useful tools to help us make our books best they
    can be. Please feel free to contact me and share any praise or criticism you may
    have.


    Thank you for purchasing a book from SAP PRESS!


