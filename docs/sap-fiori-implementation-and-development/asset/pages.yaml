  md: '# ABAP Backend Server


    Installation of the ABAP backend server components depends on the backend database
    and the SAP Business Suite product. To run the SAP Fiori apps, you need to install
    the instances you need for your SAP Business products on your ABAP backend servers.
    As mentioned previously, SAP recommends using SAP Maintenance Planner to install
    the components. The following are the two main components that you need to install
    on the ABAP backend server:


    +   - SAP Business Suite products

    SAP Fiori products are installed on the backend server as add-ons to specific
    SAP Business Suite products.


    +   - SAPNetweaver component

    If the backend database is SAP HANA, then this component should be SAP NetWeaver
    7.4 SPS 7. If the backend database is not SAP HANA (for transactional apps only),
    then the NetWeaver version depends on the SAP Business Suite product, and you
    need to refer to the product-specific online help to get the version details.


    In this section, we''ll explain the components you need to install with a simple
    example.


    If the central application instance of one of the enhancement packages of SAP
    ERP 6.0 that you''re running is EHP 2 to EHP 7, then you need to install Central
    App INT. If the central application instance of one of the enhancement packages
    of SAP ERP 6.0 that you''re running is EHP 7 (SPS 2 or higher), then you need
    to install Central App INT NW 740.


    Similarly, if you''re running an SAP ERP Human Capital Management (SAP ERP HCM)
    application instance for one of the enhancement packages of SAP ERP 6.0 (up to
    EHP 7), then you need to install HCM INT, and if you''re running EHP 7 (SPS 2
    or higher), then you need to install HCM INT NW 740.


    Figure 2.13 shows the installed product version on the ABAP backend server and
    the SAP Fiori principal apps for SAP ERP 1.0 (FIORI APPLICATIONS X1 740).


    Similarly, Figure 2.14 shows the product-specific components on the ABAP backend
    server.'
