    # 5.4 Creating Search Connectors


    SAP Fiori fact sheet apps are based on search models. To enable the use of fact
    sheet apps, search connectors must be created for the underlying search models.


    A connector is a runtime object corresponding to the search model. It''s a system-specific
    and client-specific object that is created in Transaction ESH_COCKPIT. Most of
    the data displayed in fact sheet apps come from search models, which are transferred
    to the frontend server using OData services.


    202'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'To enable the use of a specific fact sheet app, the underlying search models
    must be activated. When activating a search model, a search connector is created.
    The search models that need to be activated for your app are listed in the app-specific
    implementation information in SAP Help at http://help.sap.com/fiori.


    # SAP Fiori Search


    Before you work on the backend changes, make sure you''ve set up SAP Fiori search
    (Chapter 2).


    Fact sheets read business data via search connectors from the database. The creation
    of search connectors is therefore a prerequisite to using fact sheet apps.


    To create search connectors, you need the following authorizations (see Figure
    5.7):


    +   - SAP_ESH_SEARCH

    - SAP_ESH_LOCAL_ADMIN


    ![](img/45a7493fede9b923b78389c8563e03c4_202_0.png)


    Figure 5.7 Roles to Create Search Connectors


    The SAP HANA-enabled search models for the search software component SAPAPPL may
    only be used in SAP Fiori search. Figure 5.8 shows the information from the apps
    reference library with the search connectors and search models information of
    a Sales Order fact sheet app.'
