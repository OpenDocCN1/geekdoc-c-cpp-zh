  md: 'In this chapter, we''ll look at implementing transactional apps—from activating
    the SAPUI5 component to running the app.


    # # 4 Implementing Transactional Apps


    As you''ve learned from the previous chapters, SAP Fiori transactional apps can
    be implemented on an SAP HANA database or any database. Therefore, no matter what
    the SAP Fiori landscape may be (AS ABAP, SAP HANA database, or SAP HANA XS), the
    major tasks for implementing transactional apps remain the same in all environments.
    The ABAP frontend server infrastructure is comprised of the central UI component
    with an SAPUI5 control library, SAP Fiori Launchpad, as well as SAP Gateway with
    the OData enablement. At this point, we''ve installed and configured all these
    components in the previous chapters. The ABAP backend server contains the business
    logic, with the frontend components accessing the backend server through a trusted
    remote function (RFC) connection.


    > Prerequisites

    Before you proceed with these steps, make sure the frontend and backend components
    of your app are already available in your system landscape (refer to Chapter 2,
    Section 2.5.1).


    We will begin with the ABAP frontend server tasks. The frontend server (ABAP)
    contains the user interface (UI) layer with the product-specific UI components
    for the products as well as the infrastructure components. We''ve already activated
    the central UI add-on on Internet Communication Framework (ICF) services for Chapter
    2. We''ll now work on the central services relevant to this specific app. In this
    section, we will use the transactional app Create Sales Order as an example.


    The following is an overview of the configuration tasks for transactional apps:


    +   - Activate the SAPUI5 component.

    - Activate OData services for the SAPUI5 applications in SAP Gateway.'
  merge: -1
