    +   - If your frontend server is on SAP NetWeaver 7.4, then you need the the following
    components (see Figure 12.2):


    +   - Component for part: UIX01CA1 100 SP 05

    - SAP Gateway component: IW_PGW 100 SP 07


    +   - If your frontend server is lower than SAP NetWeaver 7.4, then you need the
    following components in addition to the UIX01CA1 and IW_PGW:


    +   - SAP Gateway 2.0 SP 10


    +   - UI add-on 1.0 for SAP NetWeaver 7.03 SP 10 or higher (UI5 1.2.60)


    +   - On the backend server, you need to be on SAP EHP 1 for SAP NetWeaver 7.3
    SPS 15 (for BPM support).


    +   - If your backend server is on an SAP NetWeaver version lower than 7.4, then
    you need to have the SAP IW BEP 200 SP 10 Gateway component installed on the backend
    server.'
