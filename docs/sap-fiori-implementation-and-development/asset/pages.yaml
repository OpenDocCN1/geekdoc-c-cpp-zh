  md: '# Deployment Options | 2.3


    The central hub deployment offers several advantages, including the following:


    +   A central place is provided for theming and branding SAP Fiori apps, which
    also provides a single point of maintenance for UI issues.


    +   Developers can make changes to the UI without worrying about the backend development
    authorizations.


    +   A single point of access is provided to multiple backend systems, and it supports
    the composition and routing of multiple backend systems as well.


    +   Because there is no direct access to the backend data, you can benefit from
    enhanced security.


    +   The lifecycle of UI applications can be decoupled from the backend.


    +   Production scenarios with medium to high loads are supported.


    The only disadvantage with this kind of deployment is that it needs an additional
    server for SAP Gateway.


    > Important!


    SAP recommends separating your backend business logic and the frontend UI components
    from each other by implementing the central hub deployment option.


    # 2.3.2 Embedded Deployment


    Embedded deployment happens when the SAP Fiori UI add-ons (both central and product
    specific), and the SAP Gateway are deployed along with the backend SAP Business
    Suite (see Figure 2.6).


    ![](img/45a7493fede9b923b78389c8563e03c4_82_0.png)


