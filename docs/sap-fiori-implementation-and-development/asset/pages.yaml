  md: 'This chapter discusses the various security mechanisms that can be put in place
    to prevent the unauthorized and unauthenticated use of SAP Fiori apps.


    # 3 SAP Fiori Security


    When configuring SAP Fiori apps, it''s important that you keep in mind those security
    measures that will ensure the right users are given proper access to assigned
    apps. Additionally, you must ensure that your data and processes support your
    business needs without allowing unauthorized access to critical information.


    In this chapter, we''ll introduce you to security measures for SAP Fiori and the
    various sign-on (SSO) procedures that are supported. We''ll even look at the concepts
    relating to securing the various layers of SAP Fiori. We will begin in Section
    3.1 by reviewing some key concepts that will be seen throughout the chapter, such
    as the data flow between different layers of the SAP Fiori landscape, what the
    different network and communication channels are, and how to secure these channels.
    After we walk through the basics, in Section 3.2, we''ll give you an overview
    of the various authentication methods or SSO procedures, such as Kerberos, Security
    Assertion Markup Language (SAML), and SAP login tokens, and discuss the flow/processes
    of these authentication methods.


    Finally, the chapter concludes with a discussion on the user authorizations that
    are required for different types of apps in Section 3.3. We''ll look at authorizations
    that a user needs to have in SAP Fiori Launchpad, SAP Gateway, and the ABAP frontend
    and backend systems to run the apps in SAP Fiori Launchpad.


    Scope


    This book doesn''t discuss how to secure the ABAP stack or the SAP HANA platform
    as this is a huge topic. However, we''ve added certain links that point to the
    online help pages.'
