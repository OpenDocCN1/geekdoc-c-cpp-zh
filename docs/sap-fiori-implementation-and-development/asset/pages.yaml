  md: '# 13.3 SAP BusinessObjects Design Studio


    SAP BusinessObjects Design Studio allows designers to create dashboards, planning
    applications intuitively based on SAP BW, SAP HANA, and universes. You can build
    applications in SAP BusinessObjects Design Studio and make them available in SAP
    Fiori Launchpad. Currently, SAP hasn''t released a standard or recommended procedure
    to make all SAP BusinessObjects Design applications available in SAP Fiori Launchpad
    as a tile. In this section, we''ll just focus on the standard SAP Fiori apps that
    are developed in SAP BusinessObjects Design Studio.


    At the time of writing this book (November 2015), SAP released wave of 8 SAP Fiori
    apps. There are currently three standard apps that are created using SAP BusinessObjects
    Design Studio and integrated with SAP Fiori:


    +   - Develop Liquidity Plans (transactional app)


    +   - Liquidity Plans (analytical app)


    +   - Cash Flow – Detailed Analysis (analytical app)


    To make SAP BusinessObjects Design Studio apps accessible in the SAP Fiori landscape,
    SAP provides a generic SAP BusinessObjects Design Studio component as part of
    SAP Fiori applications. This generic component (BSP application) is used for all
    the SAP BusinessObjects Design Studio-based SAP Fiori applications. With the BSP
    application, FIN_DS_ANALYZE, you can visualize any SAP BW query, with an SAP BW
    query or an SAP BusinessObjects Design Studio planning template to be pasted to
    reuse this component.


    # 13.3.1 Configuration


    For the SAP BusinessObjects Design Studio-based SAP Fiori applications to run
    in the SAP Fiori landscape, you need to perform the following steps on the backend
    server. These steps are done only once for all SAP BusinessObjects Design Studio-based
    applications (i.e., you don''t have to repeat these steps for every app). Following
    steps:


    +   1. Begin the process of activating the Internet Communication Framework (ICF)
    services that are required on the backend server by logging in to the backend
    server.


    +   2. Run Transaction SICF.'
