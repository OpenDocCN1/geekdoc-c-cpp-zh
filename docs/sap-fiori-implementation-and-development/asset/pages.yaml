    # 13.1.3 SAP Jam Tiles


    There are two types of SAP Jam-based SAP Fiori tiles that can initiate collaboration
    directly in your SAP Fiori Launchpad:


    +   - Group tiles

    You can add tiles in SAP Fiori Launchpad for any SAP Jam group you belong to.
    The group tile displays the group name, group icon, time since last activity,
    and the content updated every five minutes. For example, Figure 13.8 shows the
    PROJECT MANAGER GROUP, with an activity recorded one minute ago.


    +   - Notification tiles

    You can add a notification tile in SAP Fiori Launchpad to view notifications received
    in an SAP Jam account. The notification tile displays the notification sender''s
    name and photo, notification type, notification message, and group name if the
    notification is from a group. This tile can display up to 10 notifications and
    show new notification content in 10-second intervals. For example, Figure 13.8
    shows the last notification, which was created by user Anil B, responding to the
    user Larry R''s question.'
