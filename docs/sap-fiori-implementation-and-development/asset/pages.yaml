- img_proc: true
  md: 'This chapter walks you through implementing analytical apps with and without
    the SAP Smart Business Modeler.


    # 6 Implementing Analytical Apps


    In Chapter 1, we discussed the architecture and communication channels between
    different layers for analytical apps. In this chapter, we''ll provide you with
    the step-by-step instructions involved in implementing analytical apps run on
    an SAP HANA database, which use virtual data models (VDM). We''ll use an example
    based on the Days Sales Outstanding app and the Profit Analysis app. However,
    these steps apply to most analytical app implementations.


    In Section 6.1, we''ll begin with an overview of the standard analytical apps
    and analytical apps that are created using SAP Smart Business Modeler, which are
    enriched analytical apps with real-time performance indicator (KPI) data that
    are designed for specific business roles. We''ll include in our discussion the
    SAP Fiori roles for different lines of business (LBs). We''ll then look at the
    prerequisites that need to be covered prior to the Days Sales Outstanding app
    implementation in Section 6.2, before diving into the KPI modeling steps.


    In Section 6.3, we''ll discuss the SAP Smart Business Modeler and model a KPI
    using an example based on the Days Sales Outstanding app. In addition, we''ll
    cover the technical aspects of the SAP Smart Business Modeler and show you how
    to leverage them in conjunction with an analytical app. You''ll learn how to create
    a generic drilldown application using the SAP Smart Business Modeler. At the end
    of this section, we''ll show you how to create your own catalogs and groups to
    enable them.


    In Section 6.4, we''ll introduce you to analytical apps that don''t require the
    SAP Smart Business Modeler to implement them. We''ll use an example based on the
    Profit Analysis app and provide high level steps on how to implement them. As
    previously mentioned, these steps apply to most analytical apps that don''t use
    the SAP Smart Business Modeler.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 6.1 Overview


    SAP Fiori analytical apps are the new user experience (UX) for SAP Business Suite
    powered by SAP HANA and are developed using SAPUI5. These apps allow realtime
    insights into your business by displaying KPIs, allowing you to make faster, better
    decisions. In this chapter, we will show you how to configure many analytical
    app types with examples based on the Days Sales Outstanding app and the Profit
    Analysis app, respectively.


    There are two types of apps under the analytical umbrella:


    +   **Analytical apps (non-smart apps)**nThese apps provide real-time information
    on large volumes of data.


    +   **Analytical apps designed using SAP Smart Business Modeler**nThese apps closely
    monitor the most important KPIs. SAP Smart Business apps are analytical apps that
    offerdrilldown capabilities based on the SAP Smart Business framework.


    In Chapter 1, we discussed SAP Fiori roles for different LOBs. For example, the
    SAP UX for Finance LOB, you have accounts payable, accountant, cash manager, GL
    accounts role. Certain apps can be configured for these roles. Figure 6.1 shows
    an SAP Smart Business product called Smart Business for SAP S/4HANA Finance (formerly
    SAP Smart Business for SAP Simple Finance). These products contain one or more
    analytical apps. Similarly, for each LOB, there are different SAP Smart Business
    products.


    | Overdue Receivables | Days Sales Outstanding | Future Receivables | Days Beyond
    Terms |

    |---|---|---|---|n| Open Disputes | Dunning Level Distribution | Credit Limit
    Utilization | Promises to Pay |

    | Collection Progress | Total Receivables | | |


    Figure 6.1 SAP Smart Business for SAP S/4HANA Finance'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'These apps provide a real-time insight into your business days. For example,
    Figure 6.1 shows your company''s collection progress, days outstanding, and other
    KPIs. You''ll be able to drill down from this KPI or operational performance indicators
    (OPs) to a detailed analysis. In the next section, we''ll show you how to model
    a KPI or O and how to drill down from that KPI tile.


    # What Are KPI and O?


    Both KPIs and OPIs refer to the vital metrics of an aspect of your business from
    different perspectives that are crucial to the success of your business. KPIs
    look at board categories such as the sales of a particular region, and OPIs focus
    on a specific measure of a specific function or operation, for example, orders
    processed per shift.


    The following are some of the key benefits of analytical apps designed using the
    SAP Business Modeler (smart apps):


    +   * They offer role-based access to all relevant information, such as KPIs,
    OPIs, news feeds, specific tasks, trends, and alerts.

    * You can build your own KPI with the threshold values and color-coded visualizations.

    * You can create a drilldown from one application to another, to a SAP Lumina
    storyboard, or to an SAP BusinessObjects Design Studio application.

    * They provide end-to-end insight into action scenarios, including simulation
    and forecasting.


    We''ve covered some of the basic concepts of analytical apps. Before you enable
    and implement these two types of analytical apps, let''s review some of the prerequisites.


    # 6.2 Implementation Prerequisites


    A number of prerequisites need to be fulfilled prior to implementation to configure
    the analytical apps. In Chapter 2, Section 2.5.3, we covered all the components
    that have to be installed on SAP HANA and the ABAP frontend and backend servers.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 6 | Implementing Analytical Apps


    The following is a quick checklist of components that should be installed and
    configured in your system:


    +   Install the KPI framework on the ABAP frontend server

    Enable the KPI framework on the SAP HANA server

    Install SAP Gateway on the ABAP frontend server

    Install the central UI components

    Install the following SAP Smart Business products on the ABAP frontend server:

    - SAP Smart Business for CRM 1.0

    - SAP Smart Business for FCC 1.0

    - SAP Smart Business for ERP 1.0

    - SAP Smart Business for GRC 1.0

    - SAP Smart Business for EM 1.0

    - SAP Smart Business for TM 1.0

    Configure the SAP Web Dispatcher

    Install the SAP HANA Application Lifecycle Manager (HALM) and single sign-on (SSO)

    Enable SAP HANA authentication and single sign-on (SSO)

    Assign the PFCG role /UI2/SB_KPIMOD_TCR_S to your frontend server

    Assign the role, sap.hba.r.sb.roles::SAP_SMART_BUSINESS_MODELER; to your SAP HANA
    user to access the SAP Smart Business Modeler


    > ! You have to implement the SAP Notes that are required for every specific app.
    Refer to the app-specific online help at http://help.sap.com/fiori.


    By now, know that analytical apps run on an SAP HANA database that houses the
    KPI data. For the users to access the data from the SAP HANA database, you need
    to provide access to SAP HANA from the ABAP frontend server. For that, you need
    to enable user access to the KPI data (see Chapter 3, Section 3.2 and Section
    3.3).


    216'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'There are two ways to implement analytical apps, and the implementation differs
    according to the type of app that you want to use:


    +   Analytical apps launched using the KPI tile


    For these types of apps, you can model your KPI or use predefined KPIs with the
    SAP Smart Business Modeler apps. In addition, you can configure a generic drilldown
    using a predefined template or a custom drilldown. We''ll cover this method in
    Section 6.3.


    +   Analytical app that uses the app launcher tile


    App-specific content is provided for these types of apps. This content defines
    what to display and how to display it in SAP Fiori Launchpad. You can''t adapt
    or configure the information displayed by these apps. We''ll cover this implementation
    method in Section 6.4.


    We''ll begin by implementing analytical apps using the SAP Smart Business Modeler.


    # 6.3 Analytical Apps with the SAP Smart Business Modeler


    The SAP Smart Business Modeler is a tool delivered as part of the SAP Business
    suite. This tool allows you to model KPIs and report tiles that enable targeted
    monitoring of key business data using SAP Fiori Launchpad.


    You can define KPIs and reports in the SAP Smart Business Modeler to which you
    can apply different evaluations so that you can respond to the ever-changing business
    landscape. You can add additional perspectives on the relevant data with drilldown
    views that are accessed through the KPI tile.


    Analytical apps using the SAP Smart Business Modeler are launched via KPI tiles.
    The Days Sales Outstanding app allows you to filter and drill down by various
    dimensions, and then check the days outstanding by customer country and company
    code. As you did with the transactional and fact sheet apps chapters, refer to
    the SAP Fiori apps library for the app that you''ll implement in the next section.


    In the next sections, we''ll show you how to create a Days Sales Outstanding analytical
    app using the SAP Smart Business Modeler and how to add a drilldown from the KPI
    tile with step-by-step instructions. The first step is to create a KPI.'
  merge: -1
  pgno: 216
