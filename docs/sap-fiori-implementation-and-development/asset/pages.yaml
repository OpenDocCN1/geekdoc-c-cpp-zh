  md: '# Sales Order Fulfillment App


    Typically, all SAP Smart Business apps drill down from one analytical app to another
    analytical app. However, there is one hybrid app, the Sales Order Fulfillment
    app, which drills down from an analytical app to a transactional app.


    The Sales Order Fulfillment app is the only hybrid app that uses SAP Gateway (ABAP
    frontend server) and SAP HANA XS as. It needs SAP Gateway because it sends requests
    to the backend. After you configure the Sales Order Fulfillment app, it will be
    added as an analytical app tile in SAP Fiori Launchpad. When a user opens the
    app, a transactional app is added. Hence, this is the only hybrid app that has
    a tile of an analytical app and launches with the features of a transactional
    app.


    # 6.5 Summary


    In this chapter, we provided the step-by-step instructions on how to create an
    analytical app using the SAP Smart Business Modeler for the Sales Outstanding
    app. We discussed everything from how to create a KPI to providing authorization
    to the user to an app and its drillndown views. In addition, we showed you how
    to enable an app with custom groups and catalogs. We then gave you an overview
    of how to enable analytical apps that don''t use a KPI tile to launch (non-smart
    analytical apps).


    In the next chapter, we''ll explore OData services in depth. Understanding OData
    services is very important, as you''ll be using this concept a lot during the
    extension or creation of transactional, fact sheet, and analytical apps, which
    we cover in the third part of this book.'
