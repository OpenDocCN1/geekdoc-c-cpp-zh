    is a technology that provides a simple way to connect devices, environments, and
    platforms to SAP applications using any programming language or model without
    the need for SAP knowledge, leveraging REST services and OData protocols.


    SAP Gateway offers the following capabilities:


    +   Supports any device, any platform


    +   Multiple object aggregation


