  md: 'This chapter demonstrates how to create and extend transactional apps via an
    example. A complete example app is also presented that illustrates the extension
    process.


    # 9 Creating and Extending Transactional Apps


    In Chapter 8, we discussed the options that are available in the SAP Web IDE to
    create or extend an SAP Fiori application, and in Chapter 7, we looked at the
    basic OData concepts and how to create an OData service. In this chapter, we''ll
    begin all the pieces together as we walk through the end-to-end process of creating
    and extending transactional apps.


    In the first part of this chapter, we''ll explore the process of creating transactional
    apps (see Section 9.1). We''ll start by outlining basics of app creation using
    a template in the SAP Web IDE, and then we''ll cover an end-to-end process of
    creating a transactional app. In the second part of this chapter, we''ll explore
    how to extend a transactional app. We''ll start our discussion in Section 9.2
    with an overview of the extension process and examine various extension layers
    in the architecture and the skills required to extend each of these layers. In
    Section 9.2.1, Section 9.2.2, and Section 9.2.3, we''ll describe the end-to-end
    extension process of each layer of the architecture with an example based on the
    My Quo- transactional app.


    # 9.1 Creating Transactional Apps


    In this section, we''ll walk you the step-by-step process of creating a transactional
    app using a template from the SAP Web IDE. In the previous chapter, we''ll get
    an overview of the different templates that are available as part of the SAP Web
    IDE. In this section, we''ll focus on the user interface (UI) layer of the transactional
    app. In a real-world scenario, you''ll be creating an OData service'
