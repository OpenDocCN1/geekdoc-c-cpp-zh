  md: '![](img/45a7493fede9b923b78389c8563e03c4_153_0.png)


    After the configuration is completed, the ABAP frontend server acts as a ticket
    issuing system, and the ABAP backend system acts as a ticket accepting system.
    The following are the authentication flow steps between the ABAP frontend and
    ABAP backend servers:


    +   1. The user logs in with the user name and password to the ABAP frontend server.

    2. The ABAP frontend verifies the user name and password. After the authentication
    is successful, the user is logged on to the system and issued a logon ticket.

    3. The user''s web browser then sends the logon ticket and uses that ticket for
    authentication on the ABAP backend system.

    4. The web browser then sends the issued logon ticket with the user logon ticket
    to the ABAP backend server.

    5. The ABAP backend server verifies the tickets.

    6. If the tickets are valid, then the ABAP servers provide access to the user.


    | SAP Logon Tickets |

    | SAP logon tickets are transferred as web browser cookies; therefore, you can
    only use this authentication if all the systems in your landscape are located
    within the same DSN. |


    # 3.2.4 X.509 Certificate


    If your customer has implemented a public key infrastructure (PKI) for user authentication,
    you can then use X.509 certificates by configuring the required backend systems
    (ABAP or SAP HANA) to accept X.509 certificates.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# User Authorizations and Management | 3-3


    The following are some advantages of using X.509 certificates:


    +   - X.509 certificates work well in Internet-facing scenarios because they don''t
    require an issuing system during logon.


    +   - Using X.509 certificates for both SAP GUI and HTTP will simplify SSO setup
    within your system landscape.


    To run the SAP Fiori apps on desktops and mobile devices, X.509 certificates must
    be distributed to them. For mobile devices, X.509 certificates are distributed
    by mobile management software.


    To minimize security risks, SAP recommends implementing a method to revoke the
    X.509 certificates because they remain valid for a relatively long time.


    # 3.3 User Authorizations and Management


    Two primary processes are involved in providing access in SAP Fiori:


    +   - Authentication process

    Proves that users are allowed to access the servers.


    +   - Authorization process

    Determines whether the person who is logged in has access to a specific app or
    to perform a specific action.


    In this section, we''ll look at the various user authorization steps for SAP Fiori
    Launchpad, SAP Gateway, and different SAP Fiori apps.


    Before we begin with our discussion on authorizations, let''s review user management.


    # 3.3.1 User Management


    A couple of user management tools are provided for both SAP NetWeaver AS Java
    and SAP NetWeaver AS ABAP. You''ll use the following transaction codes while working
    with user management in SAP Fiori:


    +   - Transaction SU01 – User Maintenance (user management for as ABAP)


    +   - Transaction PFCG – Profile Generator (to create roles and assign authorizations
    to users)'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'There are a couple of important considerations to note from a user management
    perspective:


    +   The user must exist in the following:


    +   - SAP Gateway frontend server for all app types


    +   - SAP Business Suite ABAP backend server for all app types


    +   - SAP HANA database for fact sheet and analytical apps


    +   - User names must be the same in both the ABAP system and the SAP HANA database.
    If you''re planning to implement all three types of apps, make sure the user name
    complies with the stricter restriction rules from SAP HANA.


    +   - If your deployment is embedded, it''s not necessary to create users in an
    additional system.


    +   - You can use the Central User Administration (CUA) to synchronize users in
    the backend and the frontend systems to ensure user names in both systems match.


    # 3.3.2 User Authorization


    With a better understanding of how users are managed, let''s now look at the different
    authorizations required.


    # SAP Fiori Launchpad


    SAP Fiori Launchpad is the entry point for all SAP Fiori apps. After users are
    authenticated, they can see and access those SAP Fiori apps that have been assigned
    by an administrator to the catalog for the user''s role.


    SAP delivers business roles for users of SAP Fiori apps. Every business role provides
    access to a set of apps relevant for specific users. For example, the PFCG role
    for the business catalog of My Quotations app see Figure 3.7, gives the user access
    to the My Quotations app So, to use this app in SAP Fiori Launchpad, the administrator
    has assign the business role catalog to that user. In Chapter 4, Section 4.4,
    we''ll discuss these roles and authorizations in great detail. SAP Fiori Launchpad
    catalog and the UI PFCG roles bundle all frontend privileges that are required
    for the execution of the apps.


    Figure 3.7 shows the app-specific (My Quotation app) implementation help page
    from the SAP Fiori apps reference library.'
