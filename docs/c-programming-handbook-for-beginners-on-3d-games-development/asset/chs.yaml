  \ Online Learning\n    - Unreal Engine YouTube 频道\n    - Udemy 上关于 Unreal Engine\
  \ 和 C++ 游戏开发的课程\n- **社区和论坛**：\n    - Unreal Engine 论坛\n    - Unreal Slackers Discord\
  \ 服务器\n    - Reddit 的 `/unrealreal`\n\n### 专业领域资源\n\n根据你的兴趣，探索针对你所选专业领域的特定资源：\n\n\
  - **玩法编程**：\n    - 《Game Programming Patterns》作者 Robert Nystrom 编写\n    - 《AI for\
  \ Game Developers》作者 David M Bourg 和 Glenn Seemann 编写\n- **图形编程**：\n    - 《Real-Time\
  \ Rendering》（第 4 版）作者 Tomas Akenine-Möller, Eric Haines, Naty Hoffman, Morgan McGuire\
  \ 和 Kenneth Hoff 编写\n    - 《OpenGL SuperBible》（第 7 版）作者 Graham Sellers, Richard\
  \ S Wright Jr 和 Nicholas Haemel 编写\n- **引擎编程**：\n    - 《Game Engine Architecture》（第\
  \ 3 版）作者 Jason Gregory 编写\n    - 《3D Math Primer for Graphics and Game Development》（第\
  \ 3 版）作者 Fletcher Dunn 和 Ian Parberry 编写\n- **网络与多人游戏**：\n    - 《Multiplayer Game\
  \ Programming》作者 Joshua Glazer 和 Sanjay Madhav 编写\n    - 《Game Networking: Principles\
  \ and Practices》作者 Glenn Fiedler 编写\n\n## 游戏开发社区\n\n与其他开发者联系，分享你的作品并向专业人士学习。\n\n\
  - GameDev.net：一个面向游戏开发者的在线社区。\n- Gamasutra：领先的行业新闻、文章和资源网站。\n- Indie Game Developer\
  \ Subreddit：一个独立开发者的支持性社区。\n\n## 额外建议\n\n- **定期练习**：巩固技能的最佳方法是持续练习。从事个人项目，参加游戏松，并尝试新想法。\n\
  - **协作**：与其他开发者合作，学习他们的经验。\n- **寻求反馈**：不要害怕分享你的作品并寻求他人反馈。建设性的批评可以帮助你识别需要改进之处并作为开发者不断成长。\n\
  - **保持好奇**：游戏开发的世界不断演变。保持好奇，探索新技术，永不停学习。\n\n你与 C++ 和 Unreal Engine 的之旅不会随着这本书的完成而结束。这是一场充满无限可能的激动冒险的开始。通过利用上述提到的资源和社区，你可以继续扩展知识，精炼技能，并创造出吸引和启发全球玩家的游戏。\n\
  \n## 关键术语表\n\n- **3D 游戏开发**：在三维虚拟环境中创建交互数字体验的过程。\n- **访问修饰符 (Access Specifiers)**：C++\
  \ 中的关键字（`public`、`private`, `protected`），用于控制类成员的可见性和可访问性。\n- **Actor**：在 Unreal\
  \ Engine 中，可以存在于游戏世界的对象，例如角色、道具或环境元素。\n- **算法 (Algorithm)**：解决问题或完成任务的逐步步骤程序或规则集合。\n\
  - **资产 (Asset)**：游戏开发中使用的数字资源，如 3D 模型、纹理、声音或动画。\n- **蓝图 (Blueprint)**：Unreal Engine\
  \ 中的视觉脚本系统，允许你在无需编写代码的情况下创建游戏逻辑和交互。\n- **瓶颈 (Bottleneck)**：系统中的拥塞点或限制点，阻碍整体性能。\n\
  - **C++**：一种广泛用于游戏开发的高性能编程语言。\n- **类 (Class)**：C++ 中的用户定义数据类型，作为创建对象的蓝图，定义它们的属性和行为。\n\
  - **客户端 (Client)**：在多人游戏中，运行在玩家机器上的单个游戏实例，与服务器通信。\n- **编译器 (Compiler)**：一种将人类可读代码（如\
  \ C++）翻译成机器可执行指令的程序。\n- **组件 (Component)**：在 Unreal Engine 中，一种模块化的构建块，用于为 `Actor`\
  \ 添加特定的功能或行为。\n\n\n\n\n\n# 技术术语表\n\n- **并发**: 程序同时执行多个任务或线程的能力。\n- **构造函数**: C++\
  \ 中的一种特殊的成员函数，在对象创建时自动调用，负责初始化其数据成员。\n- **内容浏览器**: 在虚幻引擎（Unreal Engine）中，用于管理和组织项目资产的工具。\n\
  - **控制流**: 程序中语句执行的顺序，由 `if`、`else`、`switch` 和循环等结构控制。\n- **剔除**: 选择性地丢弃玩家不可见的对象或对象部分的过程，以提高渲染性能。\n\
  - **数据结构**: 在计算机内存中组织和存储数据的方式，以便高效的访问和操作。\n- **数据类型**: 一种指定变量可以包含的值类型以及对其进行的操作的分类。\n\
  - **调试**: 识别并修复程序中错误或漏洞的过程。\n- **析构函数**: C++ 中的一种特殊的成员函数，在对象销毁时自动调用，负责执行清理工作。\n\
  - **动态内存分配**: 在程序执行期间使用 `new` 运算符从堆（heap）分配内存的过程。\n- **封装**: 将数据和操作该数据的功能封装在单个单元（类）中，向外部世界隐藏实现细节。\n\
  - **异常处理**: C++ 中一种使用 `try-catch` 块优雅地管理错误和异常情况的机制。\n- **表达式**: 运算符和操作数的组合，评估后得到一个值。\n\
  - **第一人称射击游戏 (FPS)**: 一种视频游戏类型，玩家从主角视角体验游戏，通常涉及火器战斗。\n- **函数**: C++ 中一个自包含的代码块，执行特定任务并可选地返回一个值。\n\
  - **游戏引擎**: 为开发视频游戏提供工具和技术的软件框架。\n- **游戏循环**: 游戏中的中心循环，反复处理输入、更新游戏世界并渲染图形。\n- **垃圾回收**:\
  \ 一种自动内存管理机制，回收不再使用的对象所占内存。\n- **泛型编程**: 一种编程风格，允许你编写适用于多种数据类型的代码，而无需重复代码。\n- **堆**:\
  \ 程序执行期间用于动态分配的内存区域。\n- **平视显示 (HUD)**: 游戏中的图形叠加层，显示血量、弹药和目标等信息。\n- **继承**: 一种 OOP\
  \ 概念，允许你创建继承现有类（基类）属性和行为的新类（派生类）。\n- **集成开发环境 (IDE)**: 一个为编写、编译和调试代码提供完整环境的应用程序。\n\
  - **延迟**: 数据从网络上的一个点传输到另一个点所需的时间。\n- **细节水平 (LOD)**: 一种根据模型与摄像机的距离动态调整复杂度来优化 3D\
  \ 模型的技术。\n- **内存泄漏**: 内存已分配但未释放的情况，导致内存浪费和潜在的性能问题。\n- **多线程**: 程序并发执行多个线程的能力，通常是为了提高性能或响应能力。\n\
  - **对象**: C++ 中类的实例，代表一个具有自身数据和行为的特定实体。\n- **面向对象编程 (OOP)**: 一种专注于创建封装数据和行为对象的编程范式。\n\
  - **运算符**: C++ 中的一种符号，用于触发涉及一个或多个操作数的动作或计算。\n- **优化**: 改进程序性能、效率或资源利用率的过程。\n- **平台跳游戏**:\
  \ 一种视频游戏类型，玩家控制角色在平台之间跳跃并绕过障碍物。\n- **指针**: C++ 中的一种变量，用于存储另一个变量的内存地址。\n- **多态**:\
  \ 一种 OOP 概念，允许不同类的对象被视为共同基类的对象。\n- **性能分析**: 分析程序性能以识别瓶颈和优化区域的过程。\n- **过程**: C++\
  \ 中一种不返回值的特殊函数类型。\n- **反射**: 程序在运行时检查其自身结构和行为的能力。\n- **复制**: 在多人游戏中，跨网络同步动作执行体（actors）和组件的状态的过程。\n\
  - **服务器**: 在多人游戏中，管理游戏世界并与连接的客户端通信的中央权威。\n- **智能指针**: C++ 中自动管理内存的类，有助于防止内存泄漏和悬空指针。\n\
  - **标准模板库 (STL)**: C++ 中一组预构建的模板，提供了数据结构、算法和迭代器。\n- **语句**: C++ 中执行操作的完整指令，通常以分号结尾。\n\
  - **语法**: 规定编程语言中代码编写方式的规则集。\n- **模板**: C++ 中的一种蓝图，用于创建可以处理多种数据类型的类或函数，而无需重复代码。\n\
  - **纹理**: 用于为 3D 模型提供表面细节和颜色的图像。\n- **线程**: 一种独立的指令序列，可以在同一进程内与其他线程并发执行。\n- **虚幻引擎\
  \ (Unreal Engine)**: 一种强大的游戏引擎，用于开发广泛的游戏和交互体验。\n- **用户界面 (UI)**: 允许玩家与游戏交互的视觉元素和控件。\n\
  - **变量**: 内存中一个命名的存储位置，存储程序执行期间可以改变的值。\n- **视口**: 在虚幻引擎中，显示你正在创建的 3D 世界的主窗口。\n-\
  \ **可视化脚本**: 一种使用节点和线等视觉元素而非传统文本代码的编程方法。\n\n"
