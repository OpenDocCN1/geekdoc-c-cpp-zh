  trans: "\n\n# 在线教程和课程：许多网站和平台提供各种 C++ 主题的教程和课程。\n\n## 游戏开发中的专业化\n\n游戏开发涵盖了广泛的领域。考虑在你特别感兴趣的领域进行专精：\n\
    \n- **玩法编程 (Gameplay Programming)**：专注于核心游戏机制、玩家交互和 AI 的实现。\n- **图形编程 (Graphics\
    \ Programming)**：深入研究色器、渲染管线和视觉效果，以创建惊人的图形效果并优化性能。\n- **引擎编程 (Engine Programming)**：参与游戏引擎本身的开发，打造为其他开发者提供服务的工具和技术。\n\
    - **网络编程 (Network Programming)**：专注于构建强大且可扩展的多人系统，实现无缝的在线交互。\n- **音频编程 (Audio\
    \ Programming)**：创建沉浸式声景和音频系统，增强玩家体验。\n- **工具编程 (Tools Programming)**：开发工具和流水线，以简化游戏开发流程并提高生产力。\n\
    \n## 精通 Unreal Engine\n\n继续扩展你对 Unreal Engine 的专业知识。\n\n- **高级功能**：探索 Unreal Engine\
    \ 的高级功能，例如：\n    - **Niagara**：一个强大的视觉特效系统，用于创建惊人的粒子特效、流体模拟等。\n    - **动画与骨骼绑定\
    \ (Animation and Rigging)**：掌握角色动画和绑定的艺术，让你的角色活起来。\n    - **AI 与行为树 (AI and Behavior\
    \ Trees)**：深入研究 AI 开发，为你的游戏实体创建复杂且智能的行为。\n    - **网络与多人游戏 (Networking and Multiplayer)**：在你的多人基础基础上，探索高级网络功能，如专用服务器、匹配对机制和语音聊天。\n\
    - **Unreal Engine 文档与社区**：利用 Unreal Engine 丰富的文档、教程和论坛继续学习，并与其他开发者建立联系。\n- **游戏松\
    \ (Game Jams) 与项目**：参加游戏松或着手个人项目，以应用你的技能、尝试新想法并建立你的作品集。\n\n## 行业参与\n\n与游戏开发行业和社区保持联系。\n\
    \n- **会议和活动**：参加游戏开发会议和活动，与其他开发者建立联系，学习最新趋势并获取灵感。\n- **在线社区**：参与专注于游戏开发和 Unreal\
    \ Engine 的在线论坛、社交媒体群和 Discord 服务器。\n- **开源项目**：为开源游戏引擎或项目做出贡献，以获得经验并与其他开发者协作。\n\
    \n## 永停止学习\n\n游戏开发的世界不断演变，新的技术、工具和技巧层出不穷。拥抱终身学习的心态，保持好奇，不断实验并突破边界。你学得越多、成长越快，就越能创造出吸引和启发全球玩家的卓越游戏体验。\n\
    \n## 额外资源和学习材料\n\n你进入 C++ 和 Unreal Engine 游戏开发之旅才刚刚开始。为了继续你的成长并扩展知识，丰富的资源和学习材料等待着你。在本节中，我们将提供一份精选价值资源列表，帮助你深入研究专业领域，跟上最新技术，并与充满活力的开发者社区联系。\n\
    \n### C++ 资源\n\n- **书籍**：\n    - 《The C++ Programming Language》（第 4 版）由 Bjarne\
    \ Stroustrup 编写\n    - 《Effective Modern C++》作者 Scott Meyers \n    - 《C++ Primer》（第\
    \ 5 版）由 Stanley B. Lippman, Josée Lajoie 和 Barbara E. Moo 编写\n- **在线教程和课程**：\n\
    \    - `LearnCpp.com`\n    - Udemy 上的零学者 C++ 教程\n    - Coursera 的 C++ 专项课程\n-\
    \ **参考文档**：\n    - `cppreference.com`\n    - 微软的 C++ 文档（针对 Visual Studio 用户）\n\
    \n### Unreal Engine 资源\n\n- **官方文档**：\n    - Unreal Engine 文档\n    - Unreal Engine\
    \ C++ API 参考\n- **教程和课程**：\n    - Unreal Online Learning\n    - Unreal Engine\
    \ YouTube 频道\n    - Udemy 上关于 Unreal Engine 和 C++ 游戏开发的课程\n- **社区和论坛**：\n    -\
    \ Unreal Engine 论坛\n    - Unreal Slackers Discord 服务器\n    - Reddit 的 `/unrealreal`\n\
    \n### 专业领域资源\n\n根据你的兴趣，探索针对你所选专业领域的特定资源：\n\n- **玩法编程**：\n    - 《Game Programming\
    \ Patterns》作者 Robert Nystrom 编写\n    - 《AI for Game Developers》作者 David M Bourg\
    \ 和 Glenn Seemann 编写\n- **图形编程**：\n    - 《Real-Time Rendering》（第 4 版）作者 Tomas\
    \ Akenine-Möller, Eric Haines, Naty Hoffman, Morgan McGuire 和 Kenneth Hoff 编写\n\
    \    - 《OpenGL SuperBible》（第 7 版）作者 Graham Sellers, Richard S Wright Jr 和 Nicholas\
    \ Haemel 编写\n- **引擎编程**：\n    - 《Game Engine Architecture》（第 3 版）作者 Jason Gregory\
    \ 编写\n    - 《3D Math Primer for Graphics and Game Development》（第 3 版）作者 Fletcher\
    \ Dunn 和 Ian Parberry 编写\n- **网络与多人游戏**：\n    - 《Multiplayer Game Programming》作者\
    \ Joshua Glazer 和 Sanjay Madhav 编写\n    - 《Game Networking: Principles and Practices》作者\
    \ Glenn Fiedler 编写\n\n## 游戏开发社区\n\n与其他开发者联系，分享你的作品并向专业人士学习。\n\n- GameDev.net：一个面向游戏开发者的在线社区。\n\
    - Gamasutra：领先的行业新闻、文章和资源网站。\n- Indie Game Developer Subreddit：一个独立开发者的支持性社区。\n\
    \n## 额外建议\n\n- **定期练习**：巩固技能的最佳方法是持续练习。从事个人项目，参加游戏松，并尝试新想法。\n- **协作**：与其他开发者合作，学习他们的经验。\n\
    - **寻求反馈**：不要害怕分享你的作品并寻求他人反馈。建设性的批评可以帮助你识别需要改进之处并作为开发者不断成长。\n- **保持好奇**：游戏开发的世界不断演变。保持好奇，探索新技术，永不停学习。\n\
    \n你与 C++ 和 Unreal Engine 的之旅不会随着这本书的完成而结束。这是一场充满无限可能的激动冒险的开始。通过利用上述提到的资源和社区，你可以继续扩展知识，精炼技能，并创造出吸引和启发全球玩家的游戏。\n\
    \n## 关键术语表\n\n- **3D 游戏开发**：在三维虚拟环境中创建交互数字体验的过程。\n- **访问修饰符 (Access Specifiers)**：C++\
    \ 中的关键字（`public`、`private`, `protected`），用于控制类成员的可见性和可访问性。\n- **Actor**：在 Unreal\
    \ Engine 中，可以存在于游戏世界的对象，例如角色、道具或环境元素。\n- **算法 (Algorithm)**：解决问题或完成任务的逐步步骤程序或规则集合。\n\
    - **资产 (Asset)**：游戏开发中使用的数字资源，如 3D 模型、纹理、声音或动画。\n- **蓝图 (Blueprint)**：Unreal Engine\
    \ 中的视觉脚本系统，允许你在无需编写代码的情况下创建游戏逻辑和交互。\n- **瓶颈 (Bottleneck)**：系统中的拥塞点或限制点，阻碍整体性能。\n\
    - **C++**：一种广泛用于游戏开发的高性能编程语言。\n- **类 (Class)**：C++ 中的用户定义数据类型，作为创建对象的蓝图，定义它们的属性和行为。\n\
    - **客户端 (Client)**：在多人游戏中，运行在玩家机器上的单个游戏实例，与服务器通信。\n- **编译器 (Compiler)**：一种将人类可读代码（如\
    \ C++）翻译成机器可执行指令的程序。\n- **组件 (Component)**：在 Unreal Engine 中，一种模块化的构建块，用于为 `Actor`\
    \ 添加特定的功能或行为。\n\n"
- fmt: '

    # Technical Glossary


    - **Concurrency**: The ability of a program to execute multiple tasks or threads
    simultaneously.

    - **Constructor**: A special member function in C++ that''s automatically called
    when an object is created, responsible for initializing its data members.

    - **Content Browser**: In Unreal Engine, a tool for managing and organizing assets
    within a project.

    - **Control Flow**: The order in which statements are executed within a program,
    controlled by constructs like `if`, `else`, `switch`, and loops.

    - **Culling**: The process of selectively discarding objects or parts of objects
    that are not visible to the player to improve rendering performance.

    - **Data Structure**: A way of organizing and storing data in a computer''s memory
    to facilitate efficient access and manipulation.

    - **Data Type**: A classification that specifies the kind of values a variable
    can hold and the operations that can be performed on it.

    - **Debugging**: The process of identifying and fixing errors or bugs in a program.

    - **Destructor**: A special member function in C++ that''s automatically called
    when an object is destroyed, responsible for performing cleanup actions.

    - **Dynamic Memory Allocation**: The process of allocating memory from the heap
    during program execution using the `new` operator.

    - **Encapsulation**: The bundling of data and the functions that operate on that
    data within a single unit (a class), hiding implementation details from the outside
    world.

    - **Exception Handling**: A mechanism in C++ for gracefully managing errors and
    exceptional situations using `try-catch` blocks.

    - **Expression**: A combination of operators and operands that evaluates to a
    value.

    - **First-Person Shooter (FPS)**: A genre of video games where the player experiences
    the game from the perspective of the protagonist, typically involving combat with
    firearms.

    - **Function**: A self-contained block of code in C++ that performs a specific
    task and optionally returns a value.

    - **Game Engine**: A software framework that provides tools and technologies for
    developing video games.

    - **Game Loop**: The central loop in a game that repeatedly handles input, updates
    the game world, and renders graphics.

    - **Garbage Collection**: Automatic memory management that reclaims memory occupied
    by objects that are no longer in use.

    - **Generic Programming**: A programming style that allows you to write code that
    works with a variety of data types without the need for code duplication.

    - **Heap**: A region of memory used for dynamic allocation during program execution.

    - **Heads-Up Display (HUD)**: A graphical overlay in a game that displays information
    such as health, ammo, and objectives.

    - **Inheritance**: An OOP concept that allows you to create new classes (derived
    classes) that inherit properties and behaviors from existing classes (base classes).

    - **Integrated Development Environment (IDE)**: A software application that provides
    a comprehensive environment for writing, compiling, and debugging code.

    - **Latency**: The time it takes for data to travel from one point to another
    on a network.

    - **Level of Detail (LOD)**: A technique for optimizing 3D models by dynamically
    adjusting their complexity based on their distance from the camera.

    - **Memory Leak**: A situation where memory is allocated but not deallocated,
    leading to wasted memory and potential performance issues.

    - **Multithreading**: The ability of a program to execute multiple threads concurrently,
    often to improve performance or responsiveness.

    - **Object**: An instance of a class in C++, representing a specific entity with
    its own data and behavior.

    - **Object-Oriented Programming (OOP)**: A programming paradigm that focuses on
    creating objects that encapsulate data and behavior.

    - **Operator**: A symbol in C++ that triggers an action or computation involving
    one or more operands.

    - **Optimization**: The process of improving the performance, efficiency, or resource
    usage of a program.

    - **Platformer**: A genre of video games where the player controls a character
    who jumps between platforms and navigates obstacles.

    - **Pointer**: A variable in C++ that stores the memory address of another variable.

    - **Polymorphism**: An OOP concept that allows objects of different classes to
    be treated as objects of a common base class.

    - **Profiling**: The process of analyzing a program''s performance to identify
    bottlenecks and areas for optimization.

    - **Procedure**: A special type of function in C++ that doesn''t return a value.

    - **Reflection**: The ability of a program to examine its own structure and behavior
    at runtime.

    - **Replication**: In multiplayer games, the process of synchronizing the state
    of actors and components across the network.

    - **Server**: In a multiplayer game, the central authority that manages the game
    world and communicates with connected clients.

    - **Smart Pointers**: Classes in C++ that manage memory automatically, helping
    prevent memory leaks and dangling pointers.

    - **Standard Template Library (STL)**: A collection of pre-built templates in
    C++ that provide data structures, algorithms, and iterators.

    - **Statement**: A complete instruction in C++ that performs an action, typically
    ending with a semicolon.

    - **Syntax**: The set of rules that govern how code is written in a programming
    language.

    - **Template**: A blueprint in C++ for creating classes or functions that can
    operate with various data types without the need for code duplication.

    - **Texture**: An image used to provide surface details and colors for 3D models.

    - **Thread**: An independent sequence of instructions that can be executed concurrently
    with other threads within the same process.

    - **Unreal Engine**: A powerful game engine used for developing a wide range of
    games and interactive experiences.

    - **User Interface (UI)**: The visual elements and controls that allow the player
    to interact with a game.

    - **Variable**: A named storage location in memory that holds a value that can
    change during program execution.

    - **Viewport**: In Unreal Engine, the main window that displays the 3D world you''re
    creating.

    - **Visual Scripting**: A method of programming using visual elements like nodes
    and wires instead of traditional text-based code.

    '
