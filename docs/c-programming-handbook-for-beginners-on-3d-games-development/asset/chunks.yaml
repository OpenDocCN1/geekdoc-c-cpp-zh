  trans: '


    # 技术术语表


    - **并发**: 程序同时执行多个任务或线程的能力。

    - **构造函数**: C++ 中的一种特殊的成员函数，在对象创建时自动调用，负责初始化其数据成员。

    - **内容浏览器**: 在虚幻引擎（Unreal Engine）中，用于管理和组织项目资产的工具。

    - **控制流**: 程序中语句执行的顺序，由 `if`、`else`、`switch` 和循环等结构控制。

    - **剔除**: 选择性地丢弃玩家不可见的对象或对象部分的过程，以提高渲染性能。

    - **数据结构**: 在计算机内存中组织和存储数据的方式，以便高效的访问和操作。

    - **数据类型**: 一种指定变量可以包含的值类型以及对其进行的操作的分类。

    - **调试**: 识别并修复程序中错误或漏洞的过程。

    - **析构函数**: C++ 中的一种特殊的成员函数，在对象销毁时自动调用，负责执行清理工作。

    - **动态内存分配**: 在程序执行期间使用 `new` 运算符从堆（heap）分配内存的过程。

    - **封装**: 将数据和操作该数据的功能封装在单个单元（类）中，向外部世界隐藏实现细节。

    - **异常处理**: C++ 中一种使用 `try-catch` 块优雅地管理错误和异常情况的机制。

    - **表达式**: 运算符和操作数的组合，评估后得到一个值。

    - **第一人称射击游戏 (FPS)**: 一种视频游戏类型，玩家从主角视角体验游戏，通常涉及火器战斗。

    - **函数**: C++ 中一个自包含的代码块，执行特定任务并可选地返回一个值。

    - **游戏引擎**: 为开发视频游戏提供工具和技术的软件框架。

    - **游戏循环**: 游戏中的中心循环，反复处理输入、更新游戏世界并渲染图形。

    - **垃圾回收**: 一种自动内存管理机制，回收不再使用的对象所占内存。

    - **泛型编程**: 一种编程风格，允许你编写适用于多种数据类型的代码，而无需重复代码。

    - **堆**: 程序执行期间用于动态分配的内存区域。

    - **平视显示 (HUD)**: 游戏中的图形叠加层，显示血量、弹药和目标等信息。

    - **继承**: 一种 OOP 概念，允许你创建继承现有类（基类）属性和行为的新类（派生类）。

    - **集成开发环境 (IDE)**: 一个为编写、编译和调试代码提供完整环境的应用程序。

    - **延迟**: 数据从网络上的一个点传输到另一个点所需的时间。

    - **细节水平 (LOD)**: 一种根据模型与摄像机的距离动态调整复杂度来优化 3D 模型的技术。

    - **内存泄漏**: 内存已分配但未释放的情况，导致内存浪费和潜在的性能问题。

    - **多线程**: 程序并发执行多个线程的能力，通常是为了提高性能或响应能力。

    - **对象**: C++ 中类的实例，代表一个具有自身数据和行为的特定实体。

    - **面向对象编程 (OOP)**: 一种专注于创建封装数据和行为对象的编程范式。

    - **运算符**: C++ 中的一种符号，用于触发涉及一个或多个操作数的动作或计算。

    - **优化**: 改进程序性能、效率或资源利用率的过程。

    - **平台跳游戏**: 一种视频游戏类型，玩家控制角色在平台之间跳跃并绕过障碍物。

    - **指针**: C++ 中的一种变量，用于存储另一个变量的内存地址。

    - **多态**: 一种 OOP 概念，允许不同类的对象被视为共同基类的对象。

    - **性能分析**: 分析程序性能以识别瓶颈和优化区域的过程。

    - **过程**: C++ 中一种不返回值的特殊函数类型。

    - **反射**: 程序在运行时检查其自身结构和行为的能力。

    - **复制**: 在多人游戏中，跨网络同步动作执行体（actors）和组件的状态的过程。

    - **服务器**: 在多人游戏中，管理游戏世界并与连接的客户端通信的中央权威。

    - **智能指针**: C++ 中自动管理内存的类，有助于防止内存泄漏和悬空指针。

    - **标准模板库 (STL)**: C++ 中一组预构建的模板，提供了数据结构、算法和迭代器。

    - **语句**: C++ 中执行操作的完整指令，通常以分号结尾。

    - **语法**: 规定编程语言中代码编写方式的规则集。

    - **模板**: C++ 中的一种蓝图，用于创建可以处理多种数据类型的类或函数，而无需重复代码。

    - **纹理**: 用于为 3D 模型提供表面细节和颜色的图像。

    - **线程**: 一种独立的指令序列，可以在同一进程内与其他线程并发执行。

    - **虚幻引擎 (Unreal Engine)**: 一种强大的游戏引擎，用于开发广泛的游戏和交互体验。

    - **用户界面 (UI)**: 允许玩家与游戏交互的视觉元素和控件。

    - **变量**: 内存中一个命名的存储位置，存储程序执行期间可以改变的值。

    - **视口**: 在虚幻引擎中，显示你正在创建的 3D 世界的主窗口。

    - **可视化脚本**: 一种使用节点和线等视觉元素而非传统文本代码的编程方法。


    '
