    # UDP (用户数据报协议)

    提供了一种更快速、无连接的通信方法，但不保证交付或顺序。通常用于对关键性较低的数据，如语音聊天或实时游戏更新，这些情况下偶尔的丢包是可以接受的。


    ## 核心网络概念


    - **延迟 (Latency)**：数据包从网络上的一点传输到另一点所需的时间。高延迟会导致游戏过程中出现明显的延迟，影响响应速度和玩家体验。

    - **带宽 (Bandwidth)**：单位时间内通过网络连接可以传输的数据量。人数较多或更新频繁的多人游戏需要足够的带宽来确保游戏流畅。

    - **丢包 (Packet Loss)**：数据包由于网络拥塞或其他问题未能到达目的地的现象。游戏开发者必须实施相应的策略来优雅地处理丢包，最大限度地减少其对游戏性的的影响。

    - **同步 (Synchronization)**：确保所有连接的客户端对游戏世界有一致视图的过程。这涉及到仔细管理游戏状态更新的时间和顺序，并处理潜在的冲突或不一致性。


    ## 多人游戏开发中的挑战


    - **延迟补偿 (Latency Compensation)**：实施技术来缓解延迟影响，例如客户端预测和服务器调和，以便在存在网络延迟的情况下也能保持流畅的游戏。

    - **防作弊 (Cheating Prevention)**：设计健壮的系统以防止作弊和破解，确保所有玩家都有公平且愉快的体验。

    - **网络安全 (Network Security)**：保护玩家数据并防止未经授权的访问或对游戏服务器的攻击。

    - **可扩展性 (Scalability)**：构建能够处理大量并发玩家而不牺牲性能或稳定性的多人架构。


    ## 虚幻引擎的网络框架


    虚幻引擎提供了一个全面的网络框架，简化了多人游戏开发的许多复杂性。它对以下内容内置支持：


    - **复制 (Replication)**：跨网络同步 Actor（Actor）和组件的状态。

    - **远程过程调用 (RPCs)**：在远程机器（客户端或服务器）上执行函数以触发操作或交换数据。

    - **网络游戏状态 (Networked Game State)**：管理并复制全局游戏状态信息。

    - **匹配和大厅系统 (Matchmaking and Lobby Systems)**：促进玩家连接和形成游戏会议的过程。


    理解网络基础知识对于创建成功的多人游戏至关重要。通过掌握客户端-服务器模型、数据传输机制和核心网络概念，你将能够应对多人游戏开发的挑战和复杂性。


    ## 搭建多人项目


    在掌握了基础网络概念后，是时候在虚幻引擎中为你的多人游戏奠定基础。这涉及配置项目以进行网络游戏、建立服务器与客户端之间的通信通道，并启用游戏状态信息的无缝复制。让我们了解设置多人项目的涉及步骤，为你的游戏进入共享体验的世界做好准备。


    ### 项目配置


    1. **选择合适的模板**：从在虚幻引擎中创建一个新项目开始。选择与你的游戏类型和视角一致的模板。多人游戏的流行选择包括“第三人称”或“第一人”模板，它们带有基础的角色移动和摄像控制。

    2. **启用网络**：访问项目设置并导航到“项目设置 (Project Settings)”->“引擎 (Engine)”->“网络 (Networking)”部分。确保勾选“启用多人
    (Enable Multiplayer)”。这将激活虚幻引擎的网络框架并启用复制和 `RPCs` 功能。

    3. **配置在线子系统 (Online Subsystem)**：根据你的目标平台和所需的在线功能，你可能需要配置 `Online Subsystem`。它处理特定平台的在线服务，如匹配、排行榜和成就。有关为你选择平台配置
    `Online Subsystem` 的具体说明，请参考虚幻引擎文档。


    ### 游戏模式与玩家控制器


    - **游戏模式 (Game Mode)**：`GameMode` 类定义游戏的规则和行为。对于多人游戏，创建一个继承自 `AGameModeBase` 的自定义
    `GameMode` 类，并重写 `Login()`、`PostLogin()` 和 `HandleStartingNewPlayer()` 等函数来管理玩家连接和生成。

    - **玩家控制器 (Player Controllers)**：`PlayerController` 类处理输入并控制 `Pawn` 或 `Character`。在多人游戏中，每个玩家将拥有自己的
    `PlayerController` 实例。创建一个继承自 `APlayerController` 的自定义 `PlayerController` 类，并实现处理玩家输入、摄像控制和其他玩家特定逻辑的函数。


    ### 网络 Actor 与复制


    - **Actor 复制 (Actor Replication)**：虚幻引擎的复制系统会自动跨网络同步 `Actors` 和 `Components`的状态。要启用
    `Actor` 的复制，在其 `UCLASS()` 宏中添加 `Replicates` 关键字：


    ```cpp

    UCLASS(Replicates)

    class MYPROJECT_API AMyActor : public AActor

    {

    // ...

    };

    ```


    - **复制属性 (Replicated Properties)**：在你的 Actor 类中使用 `UPROPERTY(Replicated)` 宏装饰属性，以确保其值复制到所有客户端。

    - **RPCs (远程过程调用)**：使用 `RPCs` 在远程机器（客户端或服务器）上执行函数以触发操作或交换数据。使用 `UFUNCTION(Server,
    Reliable, WithValidation)` 或 `UFUNCTION(Client, Reliable)` 宏装饰函数以将其定义为 `RPCs`。


    ### 测试与迭代


    - **编辑器中运行 (Play in Editor, PIE)**：虚幻引擎的 PIE 模式允许你在编辑器内模拟多人环境，使用多个玩家测试你的网络设置和游戏机制。

    - **专用服务器 (Dedicated Server)**：为了更健壮的测试和部署，考虑设置一个独立于任何客户端实例的专用服务器。

    - **网络分析器 (Network Profiler)**：利用虚幻引擎的 `Network Profiler` 监控网络流量，识别瓶颈并优化你的多人游戏的性能。


    在虚幻引擎中搭建多人项目涉及配置项目进行网络游戏、创建自定义的 `GameMode` 和 `PlayerController` 类、启用 Actor 复制以及利用
    `RPCs` 进行通信。通过遵循这些步骤并利用虚幻引擎强大的网络框架，你为构建引人注目且沉浸的人人体验奠定了坚实的基础。


    ## 玩家复制与同步


    在复杂的多人游戏中，玩家复制和同步确保所有连接的客户端对游戏世界拥有和谐且一致的感知。每个玩家的动作、移动和交互必须在游戏的所有实例中忠实地镜像，创建一个每个人都感到连接和沉浸的共享现实。在本节中，我们将揭示玩家复制和同步背后的机制，探索虚幻引擎如何协调这场共享体验的交响乐。


    ### 服务器的角色


    在客户端服务器架构中，服务器是游戏状态的最终权威。它接收来自所有连接客户端的输入，处理这些输入，然后将游戏世界的更新广播回每个客户端。这确保了每个人看到的游戏是一致的，即使计时或网络状况存在细微差异。


    ### Actor 复制


    - **所有权 (Ownership)**：世界中的每个 `Actor` 通常由服务器或其中一个客户端“所有”。所有者负责更新 `Actor`状态并将这些更改复制到其他机器。


