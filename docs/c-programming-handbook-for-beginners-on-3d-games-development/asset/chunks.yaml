    \ 移动、`rotate` 旋转、`scale` 比例）根据需要调整它们的位置、朝向和大小。\n\n4. **添加光照**：\n   - 将 `Content\
    \ Browser` 中的 `directional light` 拖入视口。\n   - 调整其旋转和强度以达到所需的光照效果。\n   - 尝试其他类型的光，如\
    \ `point lights`（光源）或 `spotlights`（聚光灯），为你的场景增加深度和氛围。\n\n5. **设置天空**：\n   - 如果导入了\
    \ `sky sphere` 或 `skybox`，将其拖入视口并调整设置以创建视觉吸引人的背景。\n\n6. **添加交互性（可选）**：\n   - 创建一个简单的\
    \ `Blueprint`，让其中一个形状在玩家按下时旋转。\n   - 在 `Level Editor` 中将 `Blueprint` 附加到形状上。\n\
    \   - 运行关卡并测试交互。\n\n7. **保存工作**：\n   - 保存项目以防进度丢失。\n\n### 探索与实验\n\n- **网格吸附**：使用网格吸附来精确对齐物体。\n\
    - **视图模式**：在 `lit`（受光）和 `unlit`（无光）模式之间切换。\n- **在编辑器中运行**：使用 `Play` 按钮测试你的关卡。\n\
    \n### 扩展你的场景\n\n当你对基础操作熟悉后，考虑使用更复杂的资产和光照技术扩展你的场景。\n\n## 第 4 章：C++ 与集成\n\n### 在虚幻引擎中创建\
    \ C++ 类\n\n虽然蓝图提供直观的方法，但 `C++` 仍然是游戏开发的骨。让我们创建一个继承自 `Actor` 的简单 `MyActor`。\n\n\
    1. 在 `Content Browser` 中右键点击并选择 `New C++ Class`。\n2. 选择父类：选择 `Actor` 为父类。\n3.\
    \ 将类命名为 `MyActor` 并点击 `Create Class`。\n4. Visual Studio 或 Xcode 将打开生成的头文件 (`.h`)\
    \ 和源文件 (`.cpp`)\n\n### 理解 C++ 类层次结构\n\n虚幻引擎提供了丰富的类层次结构：\n\n- **UObject**：大多数对象的基类，提供基本的内存管理和序列化。\n\
    - **Actor**：代表任何可以放置在关卡中的对象。\n- **Pawn**：可以被附领和控制的 Actor。\n- **Character**：具有内置移动和动画能力的特殊\
    \ Pawn。\n- **UAComponent**：为 Actor 添加功能的模块化构建块。\n- **AGameModeBase**：定义游戏的规则和行为。\n\
    - **PlayerController**：处理输入并控制 `Pawn`。\n\n### 虚幻引擎中 C++ 类的剖析\n\n```cpp\n// MyActor.h\n\
    #pragma once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"MyActor.generated.h\" // 对虚幻引擎的反射系统非常重要\n\nUCLASS()\nclass MYPROJECT_API\
    \ AMyActor : public AActor\n{\nGENERATED_BODY()\n\npublic:\n    // 设置此 actor 属性的默认值\n\
    \    AMyActor();\n\nprotected:\n    // 当游戏开始或被生成时调用\n    virtual void BeginPlay()\
    \ override;\n\npublic:\n    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n\
    };\n```\n\n```cpp\n// MyActor.cpp\n#include \"MyActor.h\"\n\n// 设置默认值\nAMyActor::AMyActor()\n\
    {\n    // 设置此 actor 每帧调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// 当游戏开始或被生成时调用\nvoid AMyActor::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n\n// 每帧调用\nvoid AMyActor::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n```\n\n"
- fmt: "\n- `GENERATED_BODY()` macro: Generates additional code for Unreal Engine's\
    \ reflection system.\n- `AMyActor` class declaration: Inherits from `AActor`.\n\
    - `Constructor`: Initializes the actor's properties.\n- `BeginPlay()`: Called\
    \ when the actor is spawned or the game starts.\n- `Tick()`: Called every frame,\
    \ allowing the actor to perform actions and respond to events.\n\n### Source File\
    \ (.cpp)\n- `#include` directive: Includes the header file for this class.\n-\
    \ Constructor and function implementations: Define the actual behavior of the\
    \ `Constructor`, `BeginPlay()`, and `Tick()`.\n\n### Compiling and Using Your\
    \ C++ Class\n1. Save your changes in Visual Studio or Xcode.\n2. Return to Unreal\
    \ Editor and click the \"Compile\" button in the toolbar.\n3. Your new `MyActor`\
    \ class should now be available in the Content Browser.\n4. Drag and drop `MyActor`\
    \ into the Level Editor to place an instance of it in your scene.\n\n### Extending\
    \ Your C++ Class\nYou can add custom properties, components, and functions to\
    \ your C++ class to tailor it to your specific game requirements. Unreal Engine\
    \ provides macros and tools to expose these elements to the editor, Blueprints,\
    \ and other parts of your project.\n\n### The Power of C++ in Unreal Engine\n\
    By creating and extending C++ classes, you gain fine-grained control over your\
    \ game's behavior, performance, and architecture. C++ empowers you to build complex\
    \ game systems, optimize performance-critical code, and integrate with external\
    \ libraries or APIs.\n\nAs we progress through this book, we'll delve deeper into\
    \ C++ and Unreal Engine integration, exploring how to access and modify actors\
    \ and components, utilize Unreal Engine's built-in classes, and establish communication\
    \ between Blueprints and C++. Get ready to unleash the full potential of C++ within\
    \ the vibrant world of Unreal Engine game development!\n\n### Accessing and Modifying\
    \ Actors and Components\nIn the intricate tapestry of Unreal Engine, Actors and\
    \ Components are the fundamental building blocks that shape your game world. Actors\
    \ represent entities within the scene, while Components provide them with specific\
    \ functionalities and behaviors. C++ empowers you to delve into the heart of this\
    \ structure, granting the ability to access, modify, and interact with Actors\
    \ and Components programmatically. Let's explore the techniques and tools at your\
    \ disposal for harnessing this power within your C++ code.\n\n#### Accessing Actors\n\
    - **World**: The `UWorld` class represents the game world, containing all the\
    \ Actors and other elements within a level. You can access the current world through\
    \ various means, such as:\n    - Within an Actor: Use the `GetWorld()` function\
    \ to retrieve the world an Actor belongs to.\n    - From a `PlayerController`:\
    \ Use `GetWorld()` to access the world associated with the player controller.\n\
    \    - From a `UGameInstance`: Use `GetWorld()` to get the world associated with\
    \ the game instance.\n- **Actor Iterators**: Once you have a reference to the\
    \ world, you can iterate through all the Actors within it using actor iterators.\n\
    \n```cpp\nfor (TActorIterator<AActor> It(GetWorld()); It; ++It)\n{\n    AActor*\
    \ Actor = *It;\n    // ... Do something with the Actor\n}\n```\n- **Finding Actors\
    \ by Class**: You can use the `TActorIterator` to filter actors by their class.\n\
    \n```cpp\nfor (TActorIterator<AMyActor> It(GetWorld()); It; ++It)\n{\n    AMyActor*\
    \ MyActor = *It;\n    // ... Interact with the specific MyActor instances\n}\n\
    ```\n- **Other Methods**: Unreal Engine provides additional functions for finding\
    \ actors, such as:\n    - `FindActorByName()`\n    - `GetAllActorsOfClass()`\n\
    \    - `UGameplayStatics::GetAllActorsWithTag()`\n\n#### Accessing Components\n\
    - `GetComponentByClass()`: This function allows you to retrieve a specific Component\
    \ attached to an Actor by its class.\n\n```cpp\nUStaticMeshComponent* MeshComponent\
    \ = MyActor->GetComponentByClass(UStaticMeshComponent::StaticClass());\nif (MeshComponent)\n\
    {\n    // ... Do something with the MeshComponent\n}\n```\n- `GetComponentsByClass()`:\
    \ This function retrieves an array of all Components of a specific class attached\
    \ to an Actor.\n- `GetComponentByName()`: You can also find a Component by its\
    \ name if you've assigned one in the editor.\n\n#### Modifying Actors and Components\n\
    Once you have a reference to an Actor or Component, you can modify its properties\
    \ and behavior through its member functions and variables.\n- **Transform**: Change\
    \ an Actor's position, rotation, or scale using functions like `SetActorLocation()`,\
    \ `SetActorRotation()`, and `SetActorScale3D()`.\n- **Visibility**: Control an\
    \ Actor's visibility using `SetActorHiddenInGame()`.\n- **Component Properties**:\
    \ Modify properties specific to a Component, such as the material of a `UStaticMeshComponent`\
    \ or the movement settings of a `UCharacterMovementComponent`.\n- **Custom Functions**:\
    \ If you've created custom C++ classes for your Actors or Components, you can\
    \ call their member functions to perform specific actions or modify their internal\
    \ state.\n\n### Example: Making an Actor Move\nLet's say you have a `MyActor`\
    \ class with a `UStaticMeshComponent` named `Mesh`. You can make the actor move\
    \ forward in its current direction using C++ code within the `Tick()` function.\n\
    \n```cpp\nvoid AMyActor::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    \    FVector NewLocation = GetActorLocation() + GetActorForwardVector() * MovementSpeed\
    \ * DeltaTime;\n    SetActorLocation(NewLocation);\n}\n```\nIn this example:\n\
    - `GetActorLocation()` retrieves the Actor's current position.\n- `GetActorForwardVector()`\
    \ gets the direction the Actor is facing.\n- We multiply the forward vector by\
    \ `MovementSpeed` and `DeltaTime` to calculate the movement offset.\n- `SetActorLocation()`\
    \ updates the Actor's position.\n\n### The Power of C++ Control\nBy accessing\
    \ and modifying Actors and Components through C++, you gain precise control over\
    \ your game world. You can create dynamic behaviors, implement complex game mechanics,\
    \ and respond to player interactions in ways that might not be possible with Blueprints\
    \ alone.\n\nAs you progress through this book, you'll encounter numerous examples\
    \ of how C++ is used to manipulate Actors and Components, creating immersive and\
    \ interactive game experiences. By mastering these techniques, you'll unlock a\
    \ new level of creative freedom and technical prowess in your Unreal Engine projects.\n\
    \n### Using Unreal Engine's Built-in Classes\nUnreal Engine provides a vast library\
    \ of built-in C++ classes that encapsulate essential game development functionalities.\
    \ From managing player input and controlling character movement to handling collisions\
    \ and rendering graphics, these classes offer a wealth of pre-built tools to accelerate\
    \ your development process. Let's explore some of the key built-in classes and\
    \ understand how to leverage their capabilities within your C++ code.\n\n####\
    \ Input Handling\n- `APlayerController`: The `APlayerController` class represents\
    \ the player's interface to the game world. It handles input from devices like\
    \ keyboards, mice, gamepads, and touchscreens, translating them into actions within\
    \ the game.\n    - **Input Events**: You can bind C++ functions to specific input\
    \ events (e.g., key presses, mouse clicks) using the `SetupInputComponent()` function\
    \ within your `APawn` or `ACharacter` class.\n\n```cpp\nvoid AMyCharacter::SetupPlayerInputComponent(UInputComponent*\
    \ PlayerInputComponent)\n{\n    Super::SetupPlayerInputComponent(PlayerInputComponent);\n\
    \    // Bind actions to input events\n    PlayerInputComponent->BindAction(\"\
    Jump\", IE_Pressed, this, &AMyCharacter::Jump);\n    PlayerInputComponent->BindAxis(\"\
    MoveForward\", this, &AMyCharacter::MoveForward);  \n}\n```\n- `UInputComponent`:\
    \ The `UInputComponent` class manages input bindings and triggers events when\
    \ specific input actions occur.\n\n#### Character Movement\n- `ACharacter`: The\
    \ `ACharacter` class is a specialized `APawn` that provides built-in support for\
    \ character movement, including walking, running, jumping, and crouching.\n  \
    \  - `UCharacterMovementComponent`: This component handles the core movement logic\
    \ for `ACharacter`, allowing you to customize movement parameters like speed,\
    \ jump height, and gravity.\n"
