  trans: "\n\n在面向对象编程领域，访问修饰符充当着门员的角色，控制类成员的可见性和可访问性。它们决定了类的哪些部分可以从类外部访问，以及哪些部分仍然隐藏在其内部机制中。C++\
    \ 提供了三种主要的访问修饰符：`public`、`private` 和 `protected`。让我们探索它们的作用，并理解它们如何有助于代码的组织和封装。\n\
    \n### 公共访问 (public Access)：敞开的大门\n\n- **可见性**：声明为 `public` 的成员可以在代码的任何地方访问，包括类内部和外部实体。\n\
    - **目的**：公共成员通常定义了类的接口，提供了程序其他部分可以交互的函数和数据。\n- **示例**：在 `Player` 类中，像 `takeDamage()`、`increaseScore()`\
    \ 和 `displayStats()` 等函数可能可能是 `public` 的，允许游戏的其他部分修改玩家状态或获取有关玩家的信息。\n\n### 私有访问\
    \ (private Access)：内部密室\n\n- **可见性**：声明为 `private` 的成员只能从类内部访问。它们对外部世界（包括其他类和函数）隐藏的。\n\
    - **目的**：私有成员用于封装类的内部实现细节，保护敏感数据并确保对象的状态只能通过其公共接口进行修改。\n- **示例**：在 `Player` 类中，如\
    \ `name`、`health` 和 `score` 等数据成员通常是 `private` 的，以防止外部直接修改，并确保这些值的更改通过类的成员函数进行控制。\n\
    \n### 保护访问 (protected Access)：家族圈\n\n- **可见性**：声明为 `protected` 的成员可以在类本身内部及其派生类（子类）中访问。它们对代码的其他部分隐藏的。\n\
    - **目的**：`protected` 访问主要用于继承语境。它允许派生类访问并修改基类的某些成员，同时仍然对外部世界保持某种程度的封装。\n- **示例**：如果你你创建一个继承自\
    \ `Player` 类的 `SuperPlayer` 类，你可能会将 `Player` 类的某些成员声明为 `protected`，以允许 `SuperPlayer`\
    \ 类访问并修改它们，同时仍让它们对代码的其他部分隐藏。\n\n### 选择正确的访问修饰符\n\n访问修饰符的选择取决于类成员的具体角色及其与代码其他部分的关系。这里是一些通用指南：\n\
    \n- **数据成员**：在大多数情况下，数据成员应该是 `private` 的，以强制封装并保护数据完整性。\n- **成员函数**：构成类接口的函数应该是\
    \ `public` 的。辅助函数或内部实现细节可以是 `private` 的。\n- **继承**：对于你希望与派生类共享但对外部世界隐藏的成员，使用 `protected`\
    \ 访问。\n\n### 访问修饰符的好处\n\n- **封装**：访问修饰符强制封装，促进模块化设计并使代码更容易维护。\n- **数据保护**：通过限制对数据成员的访问，可以防止意外或未经的修改，确保数据一致性。\n\
    - **代码组织**：访问修饰符通过清晰定义哪些成员是公共接口的一部分，哪些是内部实现细节，帮助组织代码。\n\n### 掌握访问控制\n\n当你继续你的\
    \ C++ 之旅时，请密切关注代码中使用访问修饰符。理解它们的目的以及它们如何有助于封装将让你能够编写出结构良好、可维护且健壮的 C++ 程序。\n\n###\
    \ 项目 2：构建一个基础 2D 游戏\n\n```cpp\n#include <iostream>\n#include <conio.h>\n#include\
    \ <vector>\n#include <ctime>\n#include <utility>\n\nclass Snake {\npublic:\n \
    \   std::vector<std::pair<int, int>> body;\n    int direction;\n    int length;\n\
    };\n\nclass Food {\npublic:\n    int x, y;\n};\n\nclass Game {\npublic:\n    void\
    \ run() {\n        // Game loop logic\n    }\nprivate:\n    Snake snake;\n   \
    \ Food food;\n    int width, height;\n    bool gameOver;\n};\n\nint main() {\n\
    \    Game game;\n    game.run();\n    return 0;\n}\n```\n\n类定义（简化版）\n\n```cpp\n\
    class Snake {\npublic:\n    std::vector<std::pair<int, int>> body;\n    int direction;\n\
    \    int length;\n};\n\nclass Food {\npublic:\n    int x, y;\n};\n\nclass Game\
    \ {\npublic:\n    void run() {\n        // Game loop logic\n    }\nprivate:\n\
    \    Snake snake;\n    Food food;\n    int width, height;\n    bool gameOver;\n\
    };\n```\n\n游戏循环\n\n`Game::run()` 函数将实现游戏循环：\n\n1. **初始化**：设置初始游戏状态，创建蛇和食物，并初始化变量。\n\
    2. **输入**：获取玩家输入以控制蛇的方向。\n3. **更新**：根据输入和游戏逻辑更新游戏世界。\n    - 移动蛇。\n    - 检查与墙壁、蛇尾或食物的碰撞。\n\
    \    - 如果蛇吃了食物，生成新食物并增加蛇的长度。\n    - 如果发生碰撞，将 `gameOver` 设置为 `true`。\n4. **渲染**：清除控制台并重绘游戏元素（蛇、食物、得分）。\n\
    5. **重复**：继续循环直到 `gameOver` 为 `true`。\n6. **游戏结束**：显示最终得分和游戏结束消息。\n\n应用中的关键 OOP\
    \ 概念\n\n- **封装**：每个类封装了自己的自己的数据和行为，为交互提供了整洁的接口。\n- **继承**：你可能会为不同类型的食物或道具创建派生类，它们继承自基\
    \ `Food` 类。\n- **多态**：（可能在更高级的版本中）你可能会有不同类型的游戏对象与蛇交互，每个对象都通过虚函数实现自己的行为。\n\n记住\n\
    \n这是一个简化的大纲。实际实现将涉及更详细的移动、碰撞检测、渲染逻辑以及可能的计分和难度等等功能。\n\n下一步\n\n- 完善类定义并实现它们的成员函数。\n\
    - 编写 `Game::run()` 函数来驱动游戏循环。\n- 测试并完善你的游戏，根据你的需要添加功能和增强。\n\n"
- fmt: '

    Upon launching Unreal Engine, you''re greeted with a visually rich and dynamic
    interface, a playground for crafting immersive 3D worlds. While it may seem overwhelming
    at first, understanding the key components and their functionalities is crucial
    for navigating this powerful game development tool. Let''s embark on a guided
    tour of the Unreal Engine interface, familiarizing ourselves with its essential
    elements and empowering you to take your first steps in this exciting environment.


    # The Main Window


    - **Viewport**: This is your primary window into the 3D world you''re creating.
    It displays your level, actors, and allows you to navigate and interact with your
    scene in real-time.

    - **Content Browser**: Think of this as your project''s file explorer. It organizes
    all the assets (models, textures, sounds, etc.) and blueprints within your project,
    facilitating easy access and management.

    - **Outliner**: This hierarchical list displays all the actors (objects) present
    in your current level, providing a structured overview of your scene''s composition.

    - **Details Panel**: When you select an actor in the viewport or outliner, the
    `Details` panel reveals its properties, components, and settings, enabling you
    to customize and modify its behavior.

    - **Toolbar**: Located at the top of the main window, the toolbar offers quick
    access to frequently used tools and commands, streamlining your workflow.


    # Modes and Editors


    Unreal Engine features various modes and editors that cater to specific aspects
    of game development.


    - **Placement Mode**: This is the default mode, where you can place, move, and
    manipulate actors within your level.

    - **Landscape Mode**: This specialized mode allows you to sculpt and paint terrain
    to create realistic landscapes.

    - **Blueprint Editor**: A visual scripting environment that empowers you to create
    game logic and interactions without writing code.

    - **Material Editor**: This editor enables you to design and customize materials
    that define the visual appearance of objects in your scene.

    - **Animation Editor**: Here you can create and edit animations for characters
    and objects, bringing them to life with movement.


    # Additional Panels and Windows


    - **World Settings**: This panel lets you configure global settings for your level,
    such as lighting, gravity, and game mode.

    - **Output Log**: This window displays messages and logs from Unreal Engine, helping
    you track errors, warnings, and other important information.

    - **Console**: This command-line interface allows you to execute Unreal Engine
    commands and access debugging tools.

    - **Modes Panel**: This panel provides access to additional modes and editors,
    expanding the functionality of the Unreal Engine interface.


    # Navigating the Viewport


    ### Movement

    - `WASD` Keys: Move the camera forward, backward, left, and right.

    - `Q` and `E` Keys: Move the camera up and down.

    - `Right Mouse Button + Drag`: Orbit the camera around a point.

    - `Middle Mouse Button + Drag`: Pan the camera horizontally and vertically.

    - `Mouse Wheel`: Zoom in and out.


    ### Selection

    - `Left Click`: Select an actor in the viewport.

    - `Ctrl + Left Click`: Add or remove actors from the selection.

    - `Shift + Left Click`: Select multiple actors by dragging a box around them.


    # Customizing the Interface


    Unreal Engine offers a high degree of customization, allowing you to tailor the
    interface to your preferences.


    - **Layout**: You can rearrange panels and windows to create a layout that suits
    your workflow.

    - **Hotkeys**: Many actions in Unreal Engine have associated hotkeys, enabling
    you to work more efficiently.

    - **Editor Preferences**: The `Editor Preferences` menu provides a wide array
    of options for customizing the appearance and behavior of the editor.


    # Familiarization and Exploration


    Take some time to explore the Unreal Engine interface, experimenting with different
    tools and features. Don''t be afraid to make mistakes – learning is a process
    of discovery!


    As you become more comfortable with the interface, you''ll gain the confidence
    and skills to navigate this powerful game development environment and embark on
    the creation of your 3D masterpieces.


    # Navigating the Content Browser and Level Editor


    The Content Browser and Level Editor are two pivotal components of Unreal Engine,
    working in tandem to empower you to manage assets and construct captivating 3D
    worlds. Let''s explore these powerful tools and unravel their intricacies, enabling
    you to harness their full potential for your game development endeavors.


    ## The Content Browser: Your Asset Library


    ### Organization

    The Content Browser serves as a centralized repository for all your project''s
    assets, including:

    - **Meshes**: 3D models representing characters, objects, and environments.

    - **Textures**: Images that provide surface details and colors for your 3D models.

    - **Materials**: Define how light interacts with surfaces, dictating their visual
    appearance.

    - **Blueprints**: Visual scripts that encapsulate game logic and behavior.

    - **Sounds**: Audio effects and music that enhance immersion.

    - **And more**: Other asset types such as animations, particle systems, and UI
    elements.


    ### Navigation

    - **Folders**: Organize your assets into folders and subfolders to maintain a
    structured project.

    - **Search Bar**: Quickly locate specific assets using keywords or filters.

    - **Asset Preview**: See thumbnails and details of assets without opening them.

    - **Collections**: Group related assets for easy access and management.


    ### Key Actions

    - **Import**: Bring external assets (created in other software) into your project.

    - **Create**: Generate new assets directly within Unreal Engine (e.g., materials,
    blueprints).

    - **Drag and Drop**: Place assets from the Content Browser into the Level Editor
    to add them to your scene.

    - **Right-Click Context Menu**: Access a variety of asset-specific operations,
    such as editing, renaming, or deleting.


    ## The Level Editor: Building Your World


    - **Viewport**: The Level Editor''s viewport offers a real-time 3D view of your
    level, where you can place and manipulate actors.


    ### Modes

    - **Placement Mode**: The default mode, ideal for positioning and transforming
    actors.

    - **Landscape Mode**: Sculpt terrain and paint textures to create immersive environments.

    - **Foliage Mode**: Populate your scenes with trees, grass, and other vegetation.


    ### Tools

    - **Transform Tools**: Move, rotate, and scale actors using intuitive gizmos.

    - **Geometry Editing Tools**: Modify meshes directly within the editor.

    - **Lighting Tools**: Place and adjust lights to create mood and atmosphere.

    - **And More**: A wide array of tools for specific tasks like creating volumes,
    triggers, and particle systems.


    ### Key Actions

    - **Place Actors**: Drag and drop assets from the Content Browser into the viewport
    to place them in your level.

    - **Select and Transform**: Select actors using the left mouse button and transform
    them using the gizmos or the `Details` panel.

    - **Edit Actor Properties**: Modify an actor''s behavior and appearance through
    its properties in the `Details` panel.

    - **Create Levels**: Design multiple levels for your game and manage them within
    the editor.


    # Seamless Workflow


    The Content Browser and Level Editor work hand-in-hand to facilitate a seamless
    game development workflow. You''ll frequently transition between them, importing
    assets into the Content Browser, placing them in the Level Editor, and tweaking
    their properties to achieve your desired vision.


    # Tips and Tricks


    - **Organize Early**: Establish a clear folder structure in the Content Browser
    from the outset to avoid clutter as your project grows.

    - **Utilize Search**: The search bar in the Content Browser is a powerful tool
    for quickly locating specific assets.

    - **Learn Hotkeys**: Mastering essential hotkeys will significantly speed up your
    workflow.

    - **Experiment and Explore**: Don''t hesitate to experiment with different tools
    and features. The more you explore, the more comfortable you''ll become with Unreal
    Engine''s vast capabilities.


    ## Beyond the Basics

