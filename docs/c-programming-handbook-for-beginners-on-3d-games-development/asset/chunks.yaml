    \ 的位置、旋转或缩放。\n- **Visibility（可见性）**：使用 `SetActorHiddenInGame()` 控制 Actor 的可见性。\n\
    - **组件属性**：修改特定组件的属性，例如 `UStaticMeshComponent` 的材质或 `UCharacterMovementComponent`\
    \ 的移动设置。\n- **自定义函数**：如果你为 Actor 或组件创建了自定义 C++ 类，可以调用它们的成员函数来执行特定操作或修改其内部状态。\n\
    \n### 示例：让 Actor 移动\n假设你有一个 `MyActor` 类，其中包含一个名为 `Mesh` 的 `UStaticMeshComponent`。你可以在\
    \ `Tick()` 函数中使用 C++ 代码让 Actor 向其当前方向向前移动。\n\n```cpp\nvoid AMyActor::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n    FVector NewLocation = GetActorLocation()\
    \ + GetActorForwardVector() * MovementSpeed * DeltaTime;\n    SetActorLocation(NewLocation);\n\
    }\n```\n在此示例中：\n- `GetActorLocation()` 获取 Actor 的当前位置。\n- `GetActorForwardVector()`\
    \ 获取 Actor 面向的方向。\n- 我们将向前向量乘以 `MovementSpeed` 和 `DeltaTime` 来计算移动偏移。\n- `SetActorLocation()`\
    \ 更新 Actor 的位置。\n\n### C++ 控制的威力\n通过 C++ 访问和修改 Actor 及组件，你对游戏世界获得了精确的控制。你可以创建动态行为，实现复杂的游戏机制，并以仅蓝图可能无法的方式响应玩家交互。\n\
    \n随着本书的进行，你将遇到许多使用 C++ 操控 Actor 和组件的示例，从而创建沉浸式和交互性的游戏体验。通过掌握这些技术，你将在 Unreal Engine\
    \ 项目中解锁新水平的创作自由和技术能力。\n\n### 使用 Unreal Engine 的内置类\nUnreal Engine 提供了一个庞大的内置 C++\
    \ 类库，封装了核心的游戏开发功能。从管理玩家输入和控制角色移动，到处理碰撞和渲染图形，这些类提供了丰富的预构建工具来加速你的开发过程。让我们探索一些关键的内置类，并理解如何在\
    \ C++ 代码中利用它们的功能。\n\n#### 输入处理\n- `APlayerController`：`APlayerController` 类代表玩家与游戏世界的界面。它处理来自键盘、鼠标、游戏手柄和触摸屏设备的输入，并将其翻译为游戏动作。\n\
    \    - **输入事件（Input Events）**：你可以在 `APawn` 或 `ACharacter` 类中使用 `SetupInputComponent()`\
    \ 函数将 C++ 函数绑定到特定的输入事件（例如按键按下、鼠标点击）。\n\n```cpp\nvoid AMyCharacter::SetupPlayerInputComponent(UInputComponent*\
    \ PlayerInputComponent)\n{\n    Super::SetupPlayerInputComponent(PlayerInputComponent);\n\
    \    // 将动作绑定到输入事件\n    PlayerInputComponent->BindAction(\"Jump\", IE_Pressed,\
    \ this, &AMyCharacter::Jump);\n    PlayerInputComponent->BindAxis(\"MoveForward\"\
    , this, &AMyCharacter::MoveForward);  \n}\n```\n- `UInputComponent`：`UInputComponent`\
    \ 类管理输入绑定并在发生特定输入动作时触发事件。\n\n#### 角色移动\n- `ACharacter`：`ACharacter` 类是一个特殊的 `APawn`，为角色移动提供了内置支持，包括行走、跑步、跳跃和蹲下。\n\
    \    - `UCharacterMovementComponent`：该组件处理 `ACharacter` 的核心移动逻辑，允许你自定义移动参数，如速度、跳跃高度和重力。\n\
    \n"
- fmt: "\n```cpp\nvoid AMyCharacter::MoveForward(float Value)\n{\n    if (Controller\
    \ && Value != 0.0f)\n    {\n        // Find out which way is forward\n       \
    \ const FRotator Rotation = Controller->GetControlRotation();\n        const FRotator\
    \ YawRotation(0, Rotation.Yaw, 0);\n        // Get forward vector\n        const\
    \ FVector Direction = FRotationMatrix(YawRotation).GetUnitAxis(EAxis::X);\n  \
    \      // Add movement in that direction\n        AddMovementInput(Direction,\
    \ Value);  \n    }\n}\n```\n\n## Collision and Physics\n\n- `UPrimitiveComponent`:\
    \ The base class for components that can participate in collision and physics\
    \ simulations. Examples include:\n    - `UStaticMeshComponent`: Renders static\
    \ 3D meshes and handles collisions.\n    - `USkeletalMeshComponent`: Renders animated\
    \ skeletal meshes (characters) and handles collisions.\n    - `UCapsuleComponent`:\
    \ A simple capsule shape often used for character collision.\n- `Collision Settings`:\
    \ You can configure collision settings for each component, specifying how it interacts\
    \ with other objects in the world.\n- `Physics Simulation`: Enable physics simulation\
    \ on components to allow them to interact with forces and gravity.\n\n## Rendering\
    \ and Graphics\n\n- `USceneComponent`: The base class for components that define\
    \ an object's position, rotation, and scale in the world. It's the foundation\
    \ for attaching other components to an actor.\n- `UStaticMeshComponent`: Renders\
    \ static 3D meshes.\n- `USkeletalMeshComponent`: Renders animated skeletal meshes.\n\
    - `UMaterialInterface`: Defines the visual appearance of a surface.\n- `ULightComponent`:\
    \ Provides various types of lights to illuminate your scene.\n\n## Game Logic\
    \ and Systems\n\n- `AGameModeBase`: Defines the rules and behavior of a game mode,\
    \ such as player spawning, scoring, and win conditions.\n- `AGameBase`: Stores\
    \ global game state information that needs to be replicated to all clients in\
    \ a multiplayer game.\n- `UWorld`: Represents the game world and provides access\
    \ to various world-related functions and data.\n- `UGameplayStatics`: A collection\
    \ of static utility functions for common game-related tasks, such as spawning\
    \ actors, playing sounds, and accessing player information.\n\n## Leveraging Built-in\
    \ Classes\n\nUnreal Engine's built-in classes offer a wealth of pre-existing functionality,\
    \ saving you time and effort in your game development process. By understanding\
    \ how to utilize these classes effectively, you can focus on the unique aspects\
    \ of your game while relying on the engine's robust framework to handle common\
    \ tasks.\n\nAs you progress through this book and embark on more complex projects,\
    \ you'll encounter a wide array of Unreal Engine's built-in classes. Don't hesitate\
    \ to explore the engine's documentation and experiment with different classes\
    \ to discover their capabilities and how they can contribute to your game development\
    \ endeavors.\n\n### Communicating Between Blueprints and C++\n\nUnreal Engine\
    \ fosters a harmonious coexistence between Blueprints and C++, allowing you to\
    \ seamlessly blend the strengths of visual scripting and traditional coding within\
    \ your game projects. This synergy empowers you to leverage the intuitive nature\
    \ of Blueprints for rapid prototyping and design while harnessing the performance\
    \ and flexibility of C++ for core game systems and complex logic. Let's delve\
    \ into the mechanisms that facilitate communication between these two powerful\
    \ paradigms, enabling them to work in concert to bring your game ideas to life.\n\
    \n### Exposing C++ Functionality to Blueprints\n\nUnreal Engine provides a set\
    \ of macros and tools that allow you to expose C++ functions, variables, and properties\
    \ to Blueprints, making them accessible and modifiable within the visual scripting\
    \ environment.\n\n- `UFUNCTION()` Macro: Decorate C++ functions with the `UFUNCTION()`\
    \ macro to make them callable from Blueprints. You can specify various options\
    \ within the macro, such as:\n    - `BlueprintCallable`: Makes the function callable\
    \ from Blueprints.\n    - `BlueprintImplementableEvent`: Creates an event in Blueprints\
    \ that can be overridden with custom Blueprint logic.\n    - `BlueprintPure`:\
    \ Indicates that the function has no side effects and can be safely used in pure\
    \ Blueprint nodes.\n- `UPROPERTY()` Macro: Decorate C++ variables with the `UPROPERTY()`\
    \ macro to expose them as properties in Blueprints. You can configure various\
    \ aspects of the property, such as:\n    - `EditAnywhere`: Allows the property\
    \ to be edited in the Details panel of the Blueprint Editor.\n    - `BlueprintReadWrite`:\
    \ Makes the property both readable and writable from Blueprints.\n    - `Replicated`:\
    \ Ensures the property is synchronized across the network in multiplayer games.\n\
    \n### Calling Blueprint Functions from C++\n\nUnreal Engine also provides mechanisms\
    \ for calling Blueprint functions from your C++ code, enabling seamless interaction\
    \ between the two systems.\n\n- `BlueprintImplementableEvent`: If you've created\
    \ a `BlueprintImplementableEvent` in C++, you can trigger its execution from C++\
    \ code using the `ProcessEvent()` function.\n\n```cpp\nvoid AMyActor::TriggerMyEvent()\n\
    {\n    // ... (Perform some C++ logic)\n    // Trigger the BlueprintImplementableEvent\n\
    \    if (OnMyEvent)\n    {\n        OnMyEvent.Broadcast();\n    }\n}\n```\n\n\
    - `BlueprintCallable`: You can call `BlueprintCallable` functions directly from\
    \ C++ using the `CallFunctionByNameWithArguments()` function on a `UObject` instance.\n\
    \n### Best Practices\n\n- **Clear Interfaces**: Design your C++ classes with clear\
    \ and well-defined interfaces, exposing only the essential functionality to Blueprints.\n\
    - **Documentation**: Use comments and tooltips to document your C++ functions\
    \ and properties, making their purpose and usage clear to Blueprint users.\n-\
    \ **Performance Considerations**: Be mindful of performance when communicating\
    \ between Blueprints and C++. Minimize the frequency of calls and data transfers\
    \ between the two systems, especially in performance-critical sections of your\
    \ code.\n\n### Example: Spawning Actors from Blueprints\n\nLet's say you have\
    \ a C++ `Spawner` class that handles spawning actors in your game world. You can\
    \ expose a `SpawnActor` function to Blueprints, allowing designers to trigger\
    \ the spawning of actors from within the Blueprint Editor.\n\n```cpp\nUCLASS()\n\
    class MYPROJECT_API ASpawner : public AActor\n{\n    GENERATED_BODY()\npublic:\n\
    \    // ...\n    UFUNCTION(BlueprintCallable)\n    void SpawnActor(TSubclassOf<AActor>\
    \ ActorClass, const FVector& Location, const FRotator& Rotation);\n};\n```\n\n\
    In a Blueprint, you can then call this `SpawnActor` function to create new actors\
    \ at specific locations and orientations, empowering designers to populate the\
    \ game world and create dynamic scenarios without writing C++ code.\n\n### The\
    \ Synergy of Blueprints and C++\n\nBy mastering the techniques for communicating\
    \ between Blueprints and C++, you unlock a powerful workflow that combines the\
    \ strengths of both visual scripting and traditional coding. This synergy empowers\
    \ you to build complex and interactive game experiences, leveraging the intuitive\
    \ nature of Blueprints for rapid prototyping and design while relying on the performance\
    \ and flexibility of C++ for core game systems and intricate logic.\n\n### Project\
    \ 4: Building a Simple 3D Character Controller\n\nLet's embark on an exciting\
    \ journey into the heart of 3D game development by building a simple character\
    \ controller using C++ and Unreal Engine. In this project, we'll create a basic\
    \ player character that can move around a 3D environment, respond to keyboard\
    \ input, and interact with the world. This fundamental system will serve as the\
    \ foundation for more complex character behaviors and interactions in your future\
    \ projects.\n\n#### Project Goals\n\n- Create a C++ class for your character.\n\
    - Implement basic movement controls (forward, backward, left, right).\n- Handle\
    \ jumping and gravity.\n- Integrate with Unreal Engine's built-in character movement\
    \ component.\n- Test and refine the character's movement in a 3D scene.\n\n####\
    \ Step-by-Step Guide\n\n1. **Create a New C++ Class**:\n    - Right-click in the\
    \ Content Browser and select \"New C++ Class\".\n    - Choose \"Character\" as\
    \ the parent class.\n"
