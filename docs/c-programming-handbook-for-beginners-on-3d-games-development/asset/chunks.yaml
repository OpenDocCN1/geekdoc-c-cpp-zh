    \ Value);  \n    }\n}\n```\n\n## 碰撞与物理\n\n- `UPrimitiveComponent`: 可以参与碰撞和物理模拟的组件基类。示例包括：\n\
    \    - `UStaticMeshComponent`: 渲染静态 3D 网格并处理碰撞。\n    - `USkeletalMeshComponent`:\
    \ 渲染带动画骨骼网格（角色）并处理碰撞。\n    - `UCapsuleComponent`: 一种简单的胶囊形状，通常用于角色碰撞。\n- `Collision\
    \ Settings`: 你可以为每个组件配置碰撞设置，指定它与世界中其他对象的交互方式。\n- `Physics Simulation`: 在组件上启用物理模拟，允许它们与力和重力产生作用。\n\
    \n## 渲染与图形\n\n- `USceneComponent`: 定义对象在世界中位置、旋转和缩放的组件基类。它是将其他组件附加到 Actor 的基础。\n\
    - `UStaticMeshComponent`: 渲染静态 3D 网格。\n- `USkeletalMeshComponent`: 渲染带动画的骨骼网格。\n\
    - `UMaterialInterface`: 定义表面的视觉外观。\n- `ULightComponent`: 提供各种类型的的光来照明你的场景。\n\n\
    ## 游戏逻辑与系统\n\n- `AGameModeBase`: 定义游戏模式的规则和行为，例如玩家生成、得分和胜利条件。\n- `AGameBase`:\
    \ 存储全局游戏状态信息，这些信息在多人游戏中需要同步到所有客户端。\n- `UWorld`: 代表游戏世界，并提供访问各种世界相关函数和数据的接口。\n\
    - `UGameplayStatics`: 静态实用函数集合，用于常用的游戏相关任务，如生成 Actor、播放声音和访问玩家信息。\n\n## 利用内置类\n\
    \n虚幻引擎的内置类提供了丰富的预存功能，可以在你的游戏开发过程中节省精力和精力。通过理解如何有效利用这些类，你可以专注于游戏的独特方面，同时依赖引擎稳健的框架来处理常见任务。\n\
    \n当你随着这本书的学习并开始更复杂的项目时，你将会遇到各种虚幻引擎内置类。不要犹豫探索引擎的文档并对不同的类进行实验，以发现它们的功能以及它们如何为你的游戏开发工作做出贡献。\n\
    \n### 蓝图与 C++ 之间的通信\n\n虚幻引擎促进了蓝图（Blueprints）与 C++ 之间的和谐共存，允许你在游戏项目中无缝结合视觉脚本和传统编码的优势。这种协同作用使你能够利用蓝图的直观性进行快速原型设计和设计，同时利用\
    \ C++ 的性能和灵活性处理核心游戏系统和复杂逻辑。让我们深入研究促进这两个强大范式之间通信的机制，使它们协同工作并将你的游戏想法变为现实。\n\n###\
    \ 将 C++ 功能暴露给蓝图\n\n虚幻引擎提供了一宏和工具，允许你将 C++ 函数、变量和属性暴露给蓝图，使其在视觉脚本环境中可访问且可修改。\n\n\
    - `UFUNCTION()` 宏：使用 `UFUNCTION()` 宏装饰 C++ 函数，使其可以从蓝图中调用。你可以在宏中指定各种选项，例如：\n  \
    \  - `BlueprintCallable`: 使函数可以从蓝图中调用。\n    - `BlueprintImplementableEvent`: 在蓝图中创建一个事件，可以使用自定义的蓝图逻辑对其进行重写。\n\
    \    - `BlueprintPure`: 表示函数没有副作用，可以安全地用在纯蓝图节点。\n- `UPROPERTY()` 宏：使用 `UPROPERTY()`\
    \ 宏装饰 C++ 变量，将其作为属性暴露在蓝图中。你可以配置属性的各个方面，例如：\n    - `EditAnywhere`: 允许在蓝图编辑器的细节面板中编辑该属性。\n\
    \    - `BlueprintReadWrite`: 使该属性在蓝图中既可读又可写。\n    - `Replicated`: 确保该属性在多人游戏中跨网络进行同步。\n\
    \n### 从 C++ 用蓝图函数\n\n虚幻引擎还提供了从你的 C++ 代码调用蓝图函数的机制，实现了两个系统之间的无缝交互。\n\n- `BlueprintImplementableEvent`:\
    \ 如果你在 C++ 中创建了 `BlueprintImplementableEvent`，则可以使用 `ProcessEvent()` 函数从 C++ 代码中触发其执行。\n\
    \n```cpp\nvoid AMyActor::TriggerMyEvent()\n{\n    // ... (执行某些 C++ 逻辑)\n    //\
    \ 触发 BlueprintImplementableEvent\n    if (OnMyEvent)\n    {\n        OnMyEvent.Broadcast();\n\
    \    }\n}\n```\n\n- `BlueprintCallable`: 你可以使用 `UObject` 实例上的 `CallFunctionByNameWithArguments()`\
    \ 函数直接从 C++ 调用 `BlueprintCallable` 函数。\n\n### 最佳实践\n\n- **清晰的接口**：设计你的 C++ 类时具有清晰且定义良好的接口，只向蓝图暴露核心功能。\n\
    - **文档**：使用注释和工具提示来记录你的 C++ 函数和属性，使其目的和用法对蓝图用户清晰可见。\n- **性能考虑**：在蓝图和 C++ 之间通信时要注意性能。减少两个系统之间调用和数据传输的频率，特别是在代码中对性能敏感的区域。\n\
    \n### 示例：从蓝图生成 Actor\n\n假设你有一个 C++ `Spawner` 类，用于处理在游戏世界中生成 Actor。你可以将 `SpawnActor`\
    \ 函数暴露给蓝图，允许设计师在蓝图编辑器内部触发 Actor 的生成。\n\n```cpp\nUCLASS()\nclass MYPROJECT_API\
    \ ASpawner : public AActor\n{\n    GENERATED_BODY()\npublic:\n    // ...\n   \
    \ UFUNCTION(BlueprintCallable)\n    void SpawnActor(TSubclassOf<AActor> ActorClass,\
    \ const FVector& Location, const FRotator& Rotation);\n};\n```\n\n在蓝图中，你可以调用此\
    \ `SpawnActor` 函数在特定位置和朝向创建新的 Actor，使设计师能够在不编写 C++ 代码的情况下充实游戏世界并创建动态场景。\n\n###\
    \ 蓝图与 C++ 的协同作用\n\n通过精通在蓝图与 C++ 之间通信的技巧，你解锁了一种结合了视觉脚本和传统编码优势的强大工作流。这种协同作用使你能够构建复杂且交互式的游戏体验，利用蓝图的直观性进行快速原型设计和设计，同时依赖\
    \ C++ 的性能和灵活性处理核心游戏系统和复杂的逻辑。\n\n### 项目 4：构建一个简单的 3D 角色控制器\n\n让我们通过使用 C++ 和虚幻引擎构建一个简单的角色控制器，开启\
    \ 3D 游戏开发中心激动人心之旅。在这个项目中，我们将创建一个基础玩家角色，它可以在 3D 环境中移动，响应键盘输入，并与世界交互。这个基础系统将成为你未来项目中更复杂的角色行为和交互的基础。\n\
    \n#### 项目目标\n\n- 为你的角色创建一个 C++ 类。\n- 实现基础移动控制（向前、向后、向左、向右）。\n- 处理跳跃和重力。\n- 与虚幻引擎内置的角色移动组件（character\
    \ movement component）集成。\n- 在 3D 场景中测试并精炼角色的移动。\n\n#### 步骤指南\n\n1. **创建一个新的 C++\
    \ 类**：\n    - 在内容浏览器（Content Browser）中右键点击并选择“New C++ Class”（新建 C++ 类）。\n    -\
    \ 选择“Character”（角色）作为父类。\n\n"
- fmt: "\n1. Name your class `MyCharacter` and click \"Create Class\".\n\n2. Implement\
    \ Movement Functions:\n- In your `MyCharacter.cpp` file, override the following\
    \ functions:\n    - `SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)`:\
    \ Bind input actions to functions that will handle movement.\n    - `MoveForward(float\
    \ Value)`: Move the character forward or backward based on input.\n    - `MoveRight(float\
    \ Value)`: Move the character left or right based on input.\n    - `Jump()`: Make\
    \ the character jump.\n\n3. Configure Character Movement:\n- Access the character's\
    \ `UCharacterMovementComponent` using `GetCharacterMovement()`.\n- Set movement\
    \ properties like `MaxWalkSpeed`, `JumpZVelocity`, and `GravityScale` to control\
    \ the character's movement behavior.\n\n4. Create a Level:\n- Design a simple\
    \ 3D level with a floor, some obstacles, and perhaps a few platforms.\n- Make\
    \ sure the level has adequate space for the character to move around.\n\n5. Place\
    \ Your Character:\n- In the Level Editor, drag and drop your `MyCharacter` Blueprint\
    \ into the viewport.\n- Position the character at a suitable starting point in\
    \ the level.\n\n6. Play and Test:\n- Press the \"Play\" button to start the game\
    \ and test your character's movement controls.\n- Use the WASD keys to move, the\
    \ spacebar to jump, and observe how the character interacts with the environment.\n\
    \n### C++ Code Snippets (Illustrative)\n\n```cpp\n// MyCharacter.cpp (excerpt)\n\
    \nvoid AMyCharacter::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)\n\
    {\n    Super::SetupPlayerInputComponent(PlayerInputComponent);  \n    PlayerInputComponent->BindAxis(\"\
    MoveForward\", this, &AMyCharacter::MoveForward);\n    PlayerInputComponent->BindAxis(\"\
    MoveRight\", this, &AMyCharacter::MoveRight);\n    PlayerInputComponent->BindAction(\"\
    Jump\", IE_Pressed, this,   &ACharacter::Jump);\n}\n\nvoid AMyCharacter::MoveForward(float\
    \ Value)\n{\n    // ... (Implementation similar to the example in the previous\
    \ section)\n}\n\nvoid AMyCharacter::MoveRight(float Value)\n{\n    // ... (Implementation\
    \ similar to MoveForward, but using the Y axis)\n}\n```\n\n### Enhancements and\
    \ Further Exploration\n- **Camera Control**: Implement camera controls to allow\
    \ the player to look around and navigate the 3D world more effectively.\n- **Animations**:\
    \ Add animations to the character's movement, such as walking, running, and jumping\
    \ animations.\n- **Collisions**: Handle collisions with obstacles and other actors\
    \ in the environment.\n- **Interactions**: Enable the character to interact with\
    \ objects in the world, such as picking up items or triggering events.\n\nBy building\
    \ this simple 3D character controller, you've gained hands-on experience with\
    \ essential game development concepts like movement, input handling, and character\
    \ control. This project serves as a solid foundation for creating more complex\
    \ and interactive characters in your future Unreal Engine projects.\n\n***\n\n\
    # Part III: 3D Game Development Projects\n\n## Chapter 5: Building a 3D Platformer\
    \ Game\n\nDesigning the Game World\nThe game world is the canvas upon which your\
    \ platforming adventure unfolds. It's a realm of challenges, secrets, and visual\
    \ delights, carefully crafted to engage and captivate your players. In this section,\
    \ we'll embark on the exciting process of designing the game world for our 3D\
    \ platformer, exploring key considerations and techniques that will shape the\
    \ player's experience and bring your vision to life.\n\n### Conceptualization\
    \ and Theme\n- **Core Idea**: Begin by defining the core concept of your game\
    \ world. What's the overarching theme or setting? Is it a whimsical fantasy realm,\
    \ a post-apocalyptic wasteland, or a vibrant underwater world? The theme will\
    \ influence the visual style, gameplay mechanics, and overall atmosphere of your\
    \ platformer.\n- **Narrative Elements**: Consider incorporating narrative elements\
    \ into your game world. A compelling story can add depth and purpose to the player's\
    \ journey, motivating them to explore and overcome challenges.\n- **Level Design\
    \ Philosophy**: Decide on the overall level design philosophy. Will your levels\
    \ be linear and focused, or will they offer open-ended exploration with multiple\
    \ paths and secrets to discover?\n\n### Level Layout and Structure\n- **Platform\
    \ Placement**: Platforms are the heart of a platformer. Carefully plan their placement,\
    \ considering factors like:\n    - Challenge: Create a balanced progression of\
    \ difficulty, gradually introducing more challenging jumps, obstacles, and enemy\
    \ encounters.\n    - Flow: Guide the player's movement through the level, ensuring\
    \ a smooth and intuitive experience.\n    - Visual Appeal: Design visually interesting\
    \ and varied platform layouts that encourage exploration and discovery.\n- **Obstacles\
    \ and Hazards**: Incorporate obstacles and hazards that test the player's skills\
    \ and add excitement to the gameplay. Examples include:\n    - Moving platforms:\
    \ Platforms that shift, rotate, or disappear, requiring precise timing and agility.\n\
    \    - Spikes and pitfalls: Dangerous elements that inflict damage or cause the\
    \ player to lose progress.\n    - Environmental hazards: Fire, water, or other\
    \ elements that pose a threat to the player.\n- **Enemy Placement**: Strategically\
    \ place enemies throughout the level to create challenges and opportunities for\
    \ combat. Consider:\n    - Enemy Types: Introduce a variety of enemy types with\
    \ different behaviors and attack patterns.\n    - Difficulty: Balance the number\
    \ and strength of enemies to match the player's progression and skill level.\n\
    \    - Patrol Patterns: Design enemy patrol routes that create interesting encounters\
    \ and tactical opportunities.\n- **Collectibles and Secrets**: Reward exploration\
    \ and skillful play by incorporating collectibles into your levels. These can\
    \ include:\n    - Coins or gems: Basic collectibles that contribute to the player's\
    \ score or unlock new content.\n    - Power-ups: Temporary enhancements that grant\
    \ the player special abilities or advantages.\n    - Secret areas: Hidden locations\
    \ that offer additional challenges or rewards.\n\n### Visual Design and Atmosphere\n\
    - **Art Style**: Choose a cohesive art style that complements the game's theme\
    \ and creates a visually appealing world.\n- **Color Palette**: Use color strategically\
    \ to establish mood, highlight important elements, and guide the player's attention.\n\
    - **Lighting**: Employ lighting to create atmosphere, emphasize key areas, and\
    \ enhance the visual impact of your scene.\n- **Sound Design**: Incorporate sound\
    \ effects and music to immerse the player in the game world and provide feedback\
    \ on their actions.\n\n### Level Building in Unreal Engine\n- **Blocking Out**:\
    \ Start by creating a basic layout of your level using simple shapes (cubes, planes,\
    \ etc.) to define the overall structure and platform placement.\n- **Asset Placement**:\
    \ Replace the basic shapes with your final game assets (meshes, textures, etc.)\
    \ from the Content Browser.\n- **Lighting and Atmosphere**: Add lights, adjust\
    \ their properties, and apply post-processing effects to achieve the desired visual\
    \ style and mood.\n- **Playtesting**: Regularly playtest your level to identify\
    \ areas for improvement, ensuring smooth gameplay flow and a balanced challenge.\n\
    \n### Iterative Design Process\nGame world design is an iterative process. Don't\
    \ be afraid to experiment, make changes, and refine your levels based on feedback\
    \ and playtesting. The goal is to create an engaging and memorable experience\
    \ for your players.\n\nBy carefully designing your game world, you lay the foundation\
    \ for a captivating platforming adventure. The combination of well-placed platforms,\
    \ challenging obstacles, strategic enemy encounters, and visually appealing environments\
    \ will keep players immersed in your game and eager to explore every corner of\
    \ your creation.\n"
