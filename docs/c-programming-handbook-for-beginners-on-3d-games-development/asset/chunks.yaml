  trans: "\n\n第一人称射击游戏（FPS）中的关卡布局是发生激烈火战、战术机动和肾腺素飙升时刻的战场。它是一个精心打造的环境，旨在引导玩家的旅程、呈现挑战并提供令人兴奋的游戏体验的机会。在本节中，我们将深入探讨\
    \ FPS 关卡布局设计的艺术，探索将塑造玩家体验并创造令人记忆且引入胜目的战斗场所的关键考虑和技术。\n\n## FPS 关卡设计的的核心原则\n\n-\
    \ **流向与节奏（Flow and Pacing）**：良好的 FPS 关卡引导玩家通过一系列遭遇和目标，保持流感和节奏。避免长段的空白区域或单调的走廊，相反要创造出战斗、探索和战略决策的节奏。\n\
    - **垂直性（Verticality）**：通过多层结构、坡道、楼梯和跳垫将垂直性引入关卡。这为游戏玩法增加了动态元素，鼓励玩家利用整个 3D 空间，并创造侧翼和战术机动的机会。\n\
    - **掩护与隐藏（Cover and Concealment）**：提供充足的掩护和隐藏选项，如墙壁、箱子和植被，允许玩家进行战略性位置选择并避开敌火。平衡掩护的可用性，以创造脆弱时刻并鼓励战术决策。\n\
    - **视线与交战距离（Sightlines and Engagement Distances）**：仔细考虑视线和交战距离以创建多样的战斗场景。长视线利于狙击手和远程武器，而近战环境则能促进激烈、快速的火战。\n\
    - **侧翼路径（Flanking Routes）**：设计具有多个侧翼路径和替代路径的关卡，允许玩家超越对手，并从不同角度接近战斗遭遇。\n- **环境叙事（Environmental\
    \ Storytelling）**：使用环境细节和视觉线索讲述故事或传达有关关卡背景的信息。这可以创造沉浸感并增强玩家与游戏世界的联系。\n\n## 关卡设计流程\n\
    \n1. **概念化（Conceptualization）**：从定义关卡的核心概念开始。设定或主题是什么？是军事基地、废弃的城市，还是未来的空间站？主题将影响关卡的视觉风格、游戏机制和整体氛围。\n\
    2. **布局草图（Layout Sketching）**：勾画关卡的粗略布局，尝试不同的形状、大小和配置。考虑关键地标、目标和战斗区域的放置。\n3. **在\
    \ Unreal Engine 中进行白模（Blockout in Unreal Engine）**：使用基础形状（立方体、圆体等）在 `Unreal Engine`\
    \ 中创建关卡的 3D 白模。这允许你快速对布局进行迭代并测试游戏流。\n4. **资产放置（Asset Placement）**：用来自 `Content\
    \ Browser` 的最终游戏资产（网格、纹理等）替换白模形状。注意视觉构图、光照和环境叙事。\n5. **玩法迭代（Gameplay Iteration）**：反复测试关卡，精炼掩护、障碍物和敌人的放置，以创建平衡且吸引的战斗遭遇。\n\
    6. **打磨与细节化（Polish and Detailing）**：为关卡添加最后的 touch，例如视觉效果、声音设计和交互元素，以增强整体呈现和沉浸感。\n\
    \n## 关卡设计的关键元素\n\n- **目标（Objectives）**：明确定义玩家在关卡内的目标，无论是到达某点、消灭所有敌人还是完成特定任务。\n\
    - **战斗区域（Combat Areas）**：设计具有多种掩护选项、侧翼路径和垂直性的战斗区域，以鼓励战术性玩法。\n- **探索区域（Exploration\
    \ Areas）**：包括奖励探索的区域，如隐藏房间、秘密通道或可选目标。\n- **大场景设计（Set Pieces）**：创建难忘的大场景设计，例如大规模战斗或环境危险，以贯穿游戏过程并创造兴奋时刻。\n\
    \n## Unreal Engine 中的关卡设计工具\n\n`Unreal Engine` 了一了一套强大的工具来辅助关卡设计，包括：\n\n- **几何体编辑工具（Geometry\
    \ Editing Tools）**：直接在编辑器中修改网格以自定义环境。\n- **景观工具（Landscape Tools）**：雕刻地形并绘制纹理以创建真实的景观。\n\
    - **光照工具（Lighting Tools）**：放置和调整灯光以营造情绪和氛围。\n- **视觉效果（Visual Effects）**：添加粒子系统、贴图和其他视觉效果以增强关卡的呈现。\n\
    - **蓝图（Blueprints）**：使用 `Blueprints` 在关卡中创建交互元素、触发器和动态事件。\n\n设计引人入胜的 FPS 关卡布局需要创意、技术技能以及对游戏机制的深刻理解。通过仔细考虑流向、节奏、垂直性、掩护和视线等因素，你可以创造出挑战并令玩家兴奋的沉浸环境。\n\
    \n## 实现武器和战斗机制\n\n任何第一人称射击游戏的核心在于其武器库和赋予其生命的生动战斗机制。在本节中，我们将利用 `C++`、`Blueprints`\
    \ 和 `Unreal Engine` 的强大功能探索武器和战斗系统的实现，为玩家及其敌人配备毁灭工具，并创造让玩家紧张的精彩火战。\n\n### 武器设计\n\
    \n- **武器多样性**：提供多种武器选择，每种武器都有独特的特性、优点和缺点。考虑包括：\n    - **主武器**：突击枪、散弹枪、狙击枪等，构成玩家武器库的核心。\n\
    \    - **副武器**：手枪、冲锋枪或其他用于近战或战术局势的侧手。\n    - **爆炸物**：手雷、火箭发射器或其他产生范围伤害的爆炸装置。\n\
    \    - **近战武器**：刀子、斧头或其他用于残忍击杀的战斗武器。\n- **武器属性**：为每种武器定义关键属性，例如：\n    - **伤害**：每射击或每次冲击造成的伤害量。\n\
    \    - **射速**：武器发射射物的速度。\n    - **精度**：弹道扩散程度或火线锥形，影响武器的精确度。\n    - **范围**：武器可以造成伤害的有效距离。\n\
    \    - **装弹时间**：耗尽弹药后装弹武器的时间。\n    - **弹药容量**：武器可以携带的最大弹药量。\n- **武器行为**：为每种武器实现独特的行为，例如：\n\
    \    - **后坐力**：射击后武器向上跳动，影响精度。\n    - **散布**：连续射击时弹道范围的扩大。\n    - **装弹动画**：伴随装弹过程的视觉动画。\n\
    \    - **音效**：射击、装弹和其他武器交互的独特声音。\n\n### 战斗机制\n\n- **命中检测与伤害**：实现一个检测弹丸或近战攻击何时命中目标并应用相应伤害的系统。考虑因素：\n\
    \    - **碰撞箱**：为角色和物体定义碰撞体积（`hitboxes`）以判断它们是否被命中。\n    - **伤害类型**：区分不同类型的伤害，如子伤害、爆炸伤害或近战伤害，每种都有自己的效果。\n\
    \    - **健康系统**：为玩家和敌人实现健康系统，跟踪他们的健康值并在健康值归零时触发死亡或其他事件。\n- **玩家能力**：通过以下能力增强玩家的战斗能力：\n\
    \    - **冲刺**：允许玩家在短时间内移动得更快。\n    - **蹲下**：减少玩家轮廓并提高精度，同时牺牲移动性。\n    - **开镜瞄准\
    \ (ADS)**：使用某些武器时放大以提高精度。\n    - **装弹**：补充武器弹药。\n- **敌人 AI**：创建智能的敌人 AI，它们可以：\n\
    \    - **巡逻与导航**：在关卡中移动，遵循预定义的路径或对玩家的存在做出反应。\n\n"
- fmt: "\n- Attack: Engage the player with various weapons and tactics.\n- Take Cover:\
    \ Seek cover when under fire or strategically reposition themselves.\n- React\
    \ to Damage: Respond to being hit, potentially fleeing, seeking cover, or becoming\
    \ more aggressive.\n\n## Implementation\n\nYou can implement weapons and combat\
    \ mechanics using a combination of `C++`, `Blueprints`, and Unreal Engine's built-in\
    \ features.\n\n- **Weapon Blueprints**: Create `Blueprints` classes for each weapon,\
    \ defining their attributes, behaviors, and visual representation.\n- **C++ Weapon\
    \ Logic**: Implement core weapon logic in `C++`, such as projectile spawning,\
    \ hit detection, and damage calculation.\n- **Animation Blueprints**: Use `Animation\
    \ Blueprints` to create and control weapon animations, such as firing, reloading,\
    \ and equipping.\n- **Sound Cues**: Integrate `sound cues` for weapon fire, impacts,\
    \ reloads, and other combat-related events.\n- **AI Behavior Trees**: Utilize\
    \ `Behavior Trees` to design and control enemy AI behavior.\n- **Game State**:\
    \ Track player and enemy health, ammunition, and other combat-related data in\
    \ your game state.\n\n## Balancing and Playtesting\n\nThorough balancing and playtesting\
    \ are crucial for creating a fair and enjoyable combat experience. Adjust weapon\
    \ attributes, enemy AI behavior, and level design to achieve the desired level\
    \ of challenge and excitement.\n\nImplementing weapons and combat mechanics is\
    \ a complex but rewarding endeavor. By combining `C++`, `Blueprints`, and Unreal\
    \ Engine's powerful features, you can create a visceral and engaging combat system\
    \ that will keep players coming back for more.\n\n## Creating AI Enemies\n\nIn\
    \ the realm of first-person shooters, AI enemies are the adversaries that challenge\
    \ the player, test their skills, and create dynamic and engaging combat encounters.\
    \ They breathe life into the game world, transforming static environments into\
    \ battlegrounds teeming with intelligent and unpredictable opponents. In this\
    \ section, we'll explore the art of creating AI enemies, utilizing `C++`, `Blueprints`,\
    \ and Unreal Engine's AI framework to populate your FPS levels with a variety\
    \ of formidable foes.\n\n### Enemy Design and Behavior\n\n- **Enemy Types**: Introduce\
    \ a diverse cast of enemy types, each with its own unique strengths, weaknesses,\
    \ and combat tactics. Consider including:\n    - **Grunts**: Basic foot soldiers\
    \ armed with standard weapons, ideal for early-game encounters.\n    - **Specialists**:\
    \ Enemies with unique abilities or weapons, such as snipers, heavy weapon specialists,\
    \ or stealth units.\n    - **Bosses**: Powerful and challenging enemies that serve\
    \ as major obstacles or climactic encounters.\n- **AI Behavior**: Craft engaging\
    \ AI behaviors that create dynamic and challenging combat scenarios. Enemies should:\n\
    \    - **Patrol and Navigate**: Move around the level, following predefined paths\
    \ or dynamically reacting to the player's presence. Utilize Unreal Engine's navigation\
    \ mesh and AI perception system to facilitate realistic movement and awareness.\n\
    \    - **Attack**: Engage the player with various weapons and tactics, utilizing\
    \ cover, flanking maneuvers, and coordinated attacks.\n    - **Take Cover**: Seek\
    \ cover when under fire or strategically reposition themselves to gain an advantage.\n\
    \    - **React to Damage**: Respond to being hit, potentially fleeing, seeking\
    \ cover, or becoming more aggressive.\n    - **Communicate**: Incorporate communication\
    \ systems for enemies to alert each other to the player's presence or coordinate\
    \ attacks.\n\n### Implementation\n\nYou can implement AI enemy behavior using\
    \ a combination of `C++`, `Blueprints`, and Unreal Engine's AI tools.\n\n- **C++\
    \ AI Controller**: Create a `C++` class that inherits from `AAIController` to\
    \ control the behavior of your AI enemies. Implement decision-making logic and\
    \ actions within this class.\n- **Behavior Trees**: Utilize `Behavior Trees`,\
    \ a visual scripting system for AI, to define complex enemy behaviors and decision-making\
    \ processes. Behavior Trees allow you to create modular and reusable AI logic\
    \ that can adapt to different situations and stimuli.\n- **Blackboard**: Use a\
    \ `Blackboard` component to store and share data between different parts of the\
    \ AI system, such as the enemy's current target, health, or alert status.\n- **Environmental\
    \ Awareness**: Leverage Unreal Engine's AI perception system to enable enemies\
    \ to detect the player, hear sounds, and react to their surroundings.\n- **Animation\
    \ Blueprints**: Use `Animation Blueprints` to create and control enemy animations,\
    \ such as idle, walking, running, attacking, and taking damage animations.\n-\
    \ **Sound Cues**: Integrate `sound cues` for enemy vocalizations, footsteps, weapon\
    \ fire, and other audio feedback.\n\n### Balancing and Playtesting\n\nCarefully\
    \ balance enemy AI behavior, health, and damage output to create a challenging\
    \ but fair experience for the player. Playtest your levels extensively to ensure\
    \ that enemy encounters are engaging, varied, and contribute to the overall gameplay\
    \ flow.\n\n### Additional Considerations\n\n- **Difficulty Levels**: Implement\
    \ different difficulty settings that adjust enemy AI behavior, health, and damage\
    \ output to cater to various player skill levels.\n- **Enemy Spawning**: Design\
    \ systems for dynamically spawning enemies throughout the level, creating a sense\
    \ of challenge and unpredictability.\n- **Boss Encounters**: Craft unique and\
    \ memorable boss encounters that test the player's skills and serve as climactic\
    \ moments in the game.\n\nBy creating intelligent and engaging AI enemies, you\
    \ populate your FPS levels with dynamic adversaries that challenge and excite\
    \ the player. The combination of `C++`, `Blueprints`, and Unreal Engine's AI tools\
    \ empowers you to design a diverse cast of enemies with unique behaviors and combat\
    \ tactics, creating a thrilling and immersive gameplay experience.\n\n## Adding\
    \ Health and Damage Systems\n\nHealth and damage systems are fundamental components\
    \ of any FPS game, creating a sense of vulnerability, risk, and reward in combat\
    \ encounters. They track the well-being of both the player and their adversaries,\
    \ governing the impact of weapons and attacks, and ultimately determining the\
    \ outcome of battles. In this section, we'll explore the implementation of health\
    \ and damage systems, utilizing `C++`, `Blueprints`, and Unreal Engine's features\
    \ to create a visceral and impactful combat experience.\n\n### Health Representation\n\
    \n- **Health Points**: The most common approach is to represent health using a\
    \ numerical value, often referred to as health points (HP). The player and enemies\
    \ start with a certain amount of HP, and this value decreases when they take damage.\n\
    - **Health Bars**: Visualize health using health bars or other UI elements, providing\
    \ players with real-time feedback on their current health status.\n\n### Damage\
    \ Calculation and Application\n\n- **Damage Values**: Assign damage values to\
    \ different weapons and attacks, reflecting their power and impact. Consider factors\
    \ like weapon type, distance, and accuracy when determining damage values.\n-\
    \ **Hit Detection**: Utilize Unreal Engine's collision system to detect when projectiles\
    \ or melee attacks hit their targets. You can use `hitboxes`, `line traces`, or\
    \ other techniques to determine if a hit has occurred.\n- **Damage Application**:\
    \ When a hit is detected, apply the appropriate damage to the target's health\
    \ points. You can use `C++` code or `Blueprint` events to handle damage calculations\
    \ and updates.\n\n### Health-Related Events and Effects\n\n- **Damage Feedback**:\
    \ Provide visual and audio feedback to the player and enemies when they take damage.\
    \ This can include:\n    - **Hit Markers**: Visual indicators that appear on the\
    \ screen when a shot connects.\n    - **Blood Splatter**: Visual effects that\
    \ show the impact of damage on characters and the environment.\n    - **Pain Sounds**:\
    \ Audio cues that convey the sensation of being injured.\n    - **Screen Shake**:\
    \ Camera shake effects that intensify the impact of powerful attacks.\n- **Death\
    \ and Respawning**: Implement logic to handle character death when their health\
    \ reaches zero. This might involve:\n    - **Death Animations**: Play animations\
    \ to depict the character's demise.\n"
  raw: '○     Attack: Engage the player with various weapons and tactics.


    ○ Take Cover: Seek cover when under fire or strategically reposition themselves.


    ○ React to Damage: Respond to being hit, potentially fleeing, seeking cover, or
    becoming more aggressive.


    Implementation


    You can implement weapons and combat mechanics using a combination of C++, Blueprints,
    and Unreal Engine''s built-in features.


    ● Weapon Blueprints: Create Blueprint classes for each weapon, defining their
    attributes, behaviors, and visual representation.


    ● C++ Weapon Logic: Implement core weapon logic in C++, such as projectile spawning,
    hit detection, and damage calculation.


    ● Animation Blueprints: Use Animation Blueprints to create and control weapon
    animations, such as firing, reloading, and equipping.


    ● Sound Cues: Integrate sound cues for weapon fire, impacts, reloads, and other
    combat-related events.


    ● AI Behavior Trees: Utilize Behavior Trees to design and control enemy AI behavior.


    ● Game State: Track player and enemy health, ammunition, and other combat-related
    data in your game state.


    Balancing and Playtesting


    Thorough balancing and playtesting are crucial for creating a fair and enjoyable
    combat experience. Adjust weapon attributes, enemy AI behavior, and level design
    to achieve the desired level of challenge and excitement.


    Implementing weapons and combat mechanics is a complex but rewarding endeavor.
    By combining C++, Blueprints, and Unreal Engine''s powerful features, you can
    create a visceral and engaging combat system that will keep players coming back
    for more.


    ### Creating AI Enemies


    In the realm of first-person shooters, AI enemies are the adversaries that challenge
    the player, test their skills, and create dynamic and engaging combat encounters.
    They breathe life into the game world, transforming static environments into battlegrounds
    teeming with intelligent and unpredictable opponents. In this section, we''ll
    explore the art of creating AI enemies, utilizing C++, Blueprints, and Unreal
    Engine''s AI framework to populate your FPS levels with a variety of formidable
    foes.


    Enemy Design and Behavior


    ● Enemy Types: Introduce a diverse cast of enemy types, each with its own unique
    strengths, weaknesses, and combat tactics. Consider including:


    ○ Grunts: Basic foot soldiers armed with standard weapons, ideal for early-game
    encounters.


    ○ Specialists: Enemies with unique abilities or weapons, such as snipers, heavy
    weapon specialists, or stealth units.


    ○ Bosses: Powerful and challenging enemies that serve as major obstacles or climactic
    encounters.


    ● AI Behavior: Craft engaging AI behaviors that create dynamic and challenging
    combat scenarios. Enemies should:


    ○ Patrol and Navigate: Move around the level, following predefined paths or dynamically
    reacting to the player''s presence. Utilize Unreal Engine''s navigation mesh and
    AI perception system to facilitate realistic movement and awareness.


    ○ Attack: Engage the player with various weapons and tactics, utilizing cover,
    flanking maneuvers, and coordinated attacks.


    ○ Take Cover: Seek cover when under fire or strategically reposition themselves
    to gain an advantage.


    ○ React to Damage: Respond to being hit, potentially fleeing, seeking cover, or
    becoming more aggressive.


    ○ Communicate: Incorporate communication systems for enemies to alert each other
    to the player''s presence or coordinate attacks.


    Implementation


    You can implement AI enemy behavior using a combination of C++, Blueprints, and
    Unreal Engine''s AI tools.


    ● C++ AI Controller: Create a C++ class that inherits from  AAIController to control
    the behavior of your AI enemies. Implement decision-making logic and actions within
    this class.


    ● Behavior Trees: Utilize Behavior Trees, a visual scripting system for AI, to
    define complex enemy behaviors and decision-making processes. Behavior Trees allow
    you to create modular and reusable AI logic that can adapt to different situations
    and stimuli.


    ● Blackboard: Use a Blackboard component to store and share data between different
    parts of the AI system, such as the enemy''s current target, health, or alert
    status.


    ● Environmental Awareness: Leverage Unreal Engine''s AI perception system to enable
    enemies to detect the player, hear sounds, and react to their surroundings.


    ● Animation Blueprints: Use Animation Blueprints to create and control enemy animations,
    such as idle, walking, running, attacking, and taking damage animations.


    ● Sound Cues: Integrate sound cues for enemy vocalizations, footsteps, weapon
    fire, and other audio feedback.


    Balancing and Playtesting


    Carefully balance enemy AI behavior, health, and damage output to create a challenging
    but fair experience for the player. Playtest your levels extensively to ensure
    that enemy encounters are engaging, varied, and contribute to the overall gameplay
    flow.


    Additional Considerations


    ● Difficulty Levels: Implement different difficulty settings that adjust enemy
    AI behavior, health, and damage output to cater to various player skill levels.


    ● Enemy Spawning: Design systems for dynamically spawning enemies throughout the
    level, creating a sense of challenge and unpredictability.


    ● Boss Encounters: Craft unique and memorable boss encounters that test the player''s
    skills and serve as climactic moments in the game.


    By creating intelligent and engaging AI enemies, you populate your FPS levels
    with dynamic adversaries that challenge and excite the player. The combination
    of C++, Blueprints, and Unreal Engine''s AI tools empowers you to design a diverse
    cast of enemies with unique behaviors and combat tactics, creating a thrilling
    and immersive gameplay experience.


    ### Adding Health and Damage Systems


    Health and damage systems are fundamental components of any FPS game, creating
    a sense of vulnerability, risk, and reward in combat encounters. They track the
    well-being of both the player and their adversaries, governing the impact of weapons
    and attacks, and ultimately determining the outcome of battles. In this section,
    we''ll explore the implementation of health and damage systems, utilizing C++,
    Blueprints, and Unreal Engine''s features to create a visceral and impactful combat
    experience.


    Health Representation


    ● Health Points: The most common approach is to represent health using a numerical
    value, often referred to as health points (HP). The player and enemies start with
    a certain amount of HP, and this value decreases when they take damage.


    ● Health Bars: Visualize health using health bars or other UI elements, providing
    players with real-time feedback on their current health status.


    Damage Calculation and Application


    ● Damage Values: Assign damage values to different weapons and attacks, reflecting
    their power and impact. Consider factors like weapon type, distance, and accuracy
    when determining damage values.


    ● Hit Detection: Utilize Unreal Engine''s collision system to detect when projectiles
    or melee attacks hit their targets. You can use hitboxes, line traces, or other
    techniques to determine if a hit has occurred.


    ● Damage Application: When a hit is detected, apply the appropriate damage to
    the target''s health points. You can use C++ code or Blueprint events to handle
    damage calculations and updates.


    Health-Related Events and Effects


    ● Damage Feedback: Provide visual and audio feedback to the player and enemies
    when they take damage. This can include:


    ○ Hit Markers: Visual indicators that appear on the screen when a shot connects.


    ○ Blood Splatter: Visual effects that show the impact of damage on characters
    and the environment.


    ○ Pain Sounds: Audio cues that convey the sensation of being injured.


    ○ Screen Shake: Camera shake effects that intensify the impact of powerful attacks.


    ● Death and Respawning: Implement logic to handle character death when their health
    reaches zero. This might involve:


    ○     Death Animations: Play animations to depict the character''s demise.'
