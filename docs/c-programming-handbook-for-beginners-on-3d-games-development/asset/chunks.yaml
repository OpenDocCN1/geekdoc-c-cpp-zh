    \ `MyCharacter.cpp` 文件中重写以下函数：\n    - `SetupPlayerInputComponent(UInputComponent*\
    \ PlayerInputComponent)`：将输入动作绑定到处理移动的函数。\n    - `MoveForward(float Value)`：根据输入让角色向前或向移动。\n\
    \    - `MoveRight(float Value)`：根据输入让角色向左或向右移动。\n    - `Jump()`：让角色跳跃。\n\n3. 配置角色移动：\n\
    - 使用 `GetCharacterMovement()` 获取角色的 `UCharacterMovementComponent`。\n- 设置 `MaxWalkSpeed`、`JumpZVelocity`\
    \ 和 `GravityScale` 等移动属性来控制角色的移动行为。\n\n4. 创建关卡：\n- 设计一个包含地板、一些障碍物可能还有几个平台的简单 3D\
    \ 关卡。\n- 确保关卡有足够的空间让角色自由移动。\n\n5. 放置你的角色：\n- 在关卡编辑器（Level Editor）中，将你的 `MyCharacter`\
    \ 蓝图拖放到视口中。\n- 将角色放置在关卡中合适的起始位置。\n\n6. 运行并测试：\n- 按“Play”（播放）按钮开始游戏并测试你角色的移动控制。\n\
    - 使用 WASD 键移动，使用空格键跳跃，并观察角色如何与环境交互。\n\n### C++ 代码片段（示例性）\n\n```cpp\n// MyCharacter.cpp\
    \ (excerpt)\n\nvoid AMyCharacter::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)\n\
    {\n    Super::SetupPlayerInputComponent(PlayerInputComponent);  \n    PlayerInputComponent->BindAxis(\"\
    MoveForward\", this, &AMyCharacter::MoveForward);\n    PlayerInputComponent->BindAxis(\"\
    MoveRight\", this, &AMyCharacter::MoveRight);\n    PlayerInputComponent->BindAction(\"\
    Jump\", IE_Pressed, this,   &ACharacter::Jump);\n}\n\nvoid AMyCharacter::MoveForward(float\
    \ Value)\n{\n    // ... (实现与上一节中的示例类似)\n}\n\nvoid AMyCharacter::MoveRight(float\
    \ Value)\n{\n    // ... (实现与 MoveForward 类似，但使用 Y 轴)\n}\n```\n\n### 增强与进一步探索\n\
    - **相机控制**：实现相机控制，允许玩家环顾并更有效地在 3D 世界中导航。\n- **动画**：为角色的移动添加动画，例如行走、跑步和跳跃动画。\n\
    - **碰撞**：处理与环境中的障碍物和其他 Actor（物体）的碰撞。\n- **交互**：允许角色与世界中的物体交互，例如拾捡物品或触发事件。\n\n\
    通过构建这个简单的 3D 角色控制器，你已经获得了移动、输入处理和角色控制等核心游戏开发概念的实战经验。该项目为你未来在 Unreal Engine 项目中创建更复杂、互动互动性的角色奠定了坚实的基础。\n\
    \n***\n\n# 第三部分：3D 游戏开发项目\n\n## 第 5 章：构建 3D 平台跳跃游戏\n\n### 设计游戏世界\n游戏世界是你平台跳转冒险展开的画布。这是一个充满挑战、秘密和视觉盛宴的领域，经过精心设计以吸引并留住玩家。在本节中，我们将开始为我们的\
    \ 3D 平台跳跃游戏设计游戏世界的兴奋过程，探索将塑造玩家体验并使你的愿景变为现实的关键考虑和技术。\n\n### 概念化与主题\n- **核心理念**：首先定义你游戏世界的核心概念。总的主题或设定是什么？是一个奇幻的幻想世界、一个末日后的荒野，还是一个充满活力的水下世界？主题将影响平台跳跃游戏的视觉风格、游戏机制和整体氛围。\n\
    - **叙事元素**：考虑将叙事元素融入你的游戏世界。一个引人入胜的故事可以为玩家的旅行增加深度和目的，激励他们探索并克服挑战。\n- **关卡设计哲学**：决定整体关卡设计哲学。你的关卡将是线性且集中的，还是提供具有多路径和可发现秘密的开放式探索？\n\
    \n### 关卡布局与结构\n- **平台放置**：平台是平台跳转游戏的核心。仔细规划它们的放置，考虑以下因素：\n    - 挑战：创建一个平衡的难度梯度，逐渐引入更具挑战性的跳跃、障碍物和敌人遭遇。\n\
    \    - 流程：引导玩家在关卡中的移动，确保获得顺畅且直观的体验。\n    - 视觉吸引力：设计视觉上有趣且多样的平台布局，鼓励探索和发现。\n- **障碍物与危险**：加入测试玩家技能的障碍物和危险因素，增加游戏的趣味性。示例包括：\n\
    \    - 移动平台：会移动、旋转或消失的平台，需要精确的时机和敏捷性。\n    - 尖刺与陷阱：造成伤害或导致玩家丢失进的危险元素。\n    - 环境危险：火、水或其他对玩家构成威胁的元素。\n\
    - **敌人放置**：在整个关卡中策略性地放置敌人，创造战斗和机会。考虑：\n    - 敌人类型：引入具有不同行为和攻击模式的多种敌人类型。\n    -\
    \ 难度：平衡敌人的数量和强度，以匹配玩家的进度和技能水平。\n    - 巡逻模式：设计敌人巡逻路线，创造有趣的遭遇和战术机会。\n- **可收集物品与秘密**：通过在关卡中加入可收集物品来奖励探索和高技巧操作。这些包括：\n\
    \    - 硬币或宝石：有助于玩家得分或解锁新内容的基础收集物。\n    - 强化道具：赋予玩家特殊能力或优势的临时增强。\n    - 秘密区域：提供额外挑战或奖励的隐藏位置。\n\
    \n### 视觉设计与氛围\n- **艺术风格**：选择一种统一的艺术风格，补充游戏主题并创建一个视觉吸引力的世界。\n- **色调**：策略性地使用颜色来建立情绪、突出重要元素并引导玩家的注意力。\n\
    - **光照**：利用光照营造氛围，强调关键区域并增强场景的视觉冲击。\n- **声音设计**：加入音效和音乐，让玩家沉浸在游戏世界中并对其操作提供反馈。\n\
    \n### 在 Unreal Engine 中构建关卡\n- **原型搭建（Blocking Out）**：使用简单形状（立方体、平面等）开始创建关卡的基本布局，定义整体结构和平台放置。\n\
    - **资源放置**：从内容浏览器中使用你的最终游戏资产（网格、纹理等）替换基础形状。\n- **光照与氛围**：添加灯光，调整它们的属性并应用后处理效果，以实现预期的视觉风格和氛围。\n\
    - **测试**：定期测试你的关卡以识别需要改进的地方，确保游戏流程顺畅且挑战性平衡。\n\n### 迭代设计过程\n游戏世界设计是一个迭代过程。不要害怕实验、更改并根据反馈和测试来完善你的关卡。目标是为玩家创造一个引人入胜且难忘的体验。\n\
    \n通过精心设计你的游戏世界，你为引人入胜的平台冒险奠定了基础。良好放置的平台、具有挑战性的障碍物、策略性的敌人遭遇和视觉吸引力的环境相结合，将让玩家沉浸在你的游戏中，并渴望探索你创作的每一个角落。\n\
    \n"
- fmt: "\nBringing your character to life and enabling them to traverse the 3D platforming\
    \ world you've designed is a pivotal step in game development. Fluid and responsive\
    \ movement controls are essential for creating an enjoyable and immersive player\
    \ experience. In this section, we'll delve into the implementation of player movement\
    \ and controls, utilizing C++ and Unreal Engine's powerful character movement\
    \ component to empower your character with the ability to jump, run, and conquer\
    \ the challenges that lie ahead.\n\n## Leveraging Unreal Engine's Character Movement\
    \ Component\n\nUnreal Engine provides a robust `UCharacterMovementComponent` that\
    \ handles the core mechanics of character movement, including:\n\n- **Walking\
    \ and Running**: The component manages movement along the ground, taking into\
    \ account factors like slope, friction, and acceleration.\n- **Jumping**: It implements\
    \ jumping mechanics, controlling jump height, air control, and gravity.\n- **Crouching**:\
    \ It enables crouching behavior, adjusting the character's capsule collider and\
    \ movement capabilities.\n- **Falling and Landing**: It handles falling and landing,\
    \ applying damage or triggering events based on impact.\n\n### Access the Character\
    \ Movement Component\n\nWithin your `MyCharacter` class you can access the character\
    \ movement component using the `GetCharacterMovement()` function.\n\n```cpp\n\
    UCharacterMovementComponent* MovementComponent = GetCharacterMovement();\n```\n\
    \n### Implementing Basic Movement\n\n- **Forward/Backward Movement**: Use the\
    \ `AddMovementInput()` function to apply movement input along the character's\
    \ forward vector. The input value typically ranges from -1 (backward) to 1 (forward).\n\
    \n```cpp\nvoid AMyCharacter::MoveForward(float Value)\n{\n    if (Controller &&\
    \ Value != 0.0f)\n    {\n        // ... (Implementation similar to the previous\
    \ chapter)\n        AddMovementInput(Direction, Value);\n    }\n}\n```\n\n- **Left/Right\
    \ Movement**: Implement similar logic to move the character left or right, use\
    \ the character's right vector instead.\n- **Jumping**: Call the `Jump()` function\
    \ on the character movement component to initiate a jump.\n\n```cpp\nvoid AMyCharacter::Jump()\n\
    {\n    if (GetCharacterMovement()->IsMovingGround())\n    {\n        Jump();\n\
    \    }\n}\n```\n\n### Customizing Movement Behavior\n\n- **Movement Speed**: Adjust\
    \ the `MaxWalkSpeed` property of the character movement component to control the\
    \ character's maximum walking or running speed.\n- **Jump Height**: Modify the\
    \ `JumpZVelocity` property to control the height of the character's jumps.\n-\
    \ **Gravity**: Tweak the `GravityScale` property to influence how strongly gravity\
    \ affects the character.\n- **Air Control**: Adjust the `AirControl` property\
    \ to control how much control the player has over the character while in the air.\n\
    \n## Advanced Movement Techniques\n\nAs you progress in your game development\
    \ journey you can explore more movement techniques such as:\n\n- **Double Jumping**:\
    \ Allow the character to perform an additional jump while in air.\n- **Wall Jumping**:\
    \ Enable the character to jump off walls to reach higher areas.\n- **Dashing or\
    \ Dodging**: Implement quick bursts of movement for evasion or traversal.\n- **Climbing\
    \ and Mantling**: Allow the character to climb ledges or obstacles.\n\n## Polishing\
    \ the Controls\n\n- **Responsiveness**: Ensure the controls feel snappy and responsive,\
    \ minimizing input lag and providing immediate feedback to the player's actions.\n\
    - **Smoothness**: Implement smooth acceleration and deceleration to create more\
    \ natural and fluid movement experience.\n- **Customization**: Provide options\
    \ for players to customize their control scheme and sensitivity settings.\n\n\
    By implementing player movement and controls, you've breathed life into your character,\
    \ enabling them to explore the 3D platforming world you've created. The combination\
    \ of Unreal Engine's character movement component and your C++ code empowers you\
    \ to craft a responsive and enjoyable control scheme that enhances the player's\
    \ immersion and sense of agency.\n\n## Creating Interactive Elements and Obstacles\n\
    \nA captivating platformer isn't merely a collection of platforms; it's a dynamic\
    \ world brimming with interactive elements and challenging obstacles that test\
    \ the player's skills and enrich their experience. In this section, we'll delve\
    \ into the creation of these engaging components, utilizing C++, Blueprints, and\
    \ Unreal Engine's versatile tools to add depth and excitement to your 3D platforming\
    \ adventure.\n\n### Types of Interactive Elements and Obstacles\n\nThe possibilities\
    \ for interactive elements and obstacles are virtually limitless, but let's explore\
    \ a few common examples:\n\n- **Moving Platforms**: These dynamic platforms can\
    \ move horizontally, vertically, or along a predefined path, requiring precise\
    \ timing and agility from the player. You can implement their movement using Blueprints\
    \ or C++ code, controlling their speed, direction, and patterns.\n- **Triggers\
    \ and Switches**: Triggers can be invisible volumes or physical objects that activate\
    \ events when the player interacts with them. For example, a trigger might open\
    \ a door, reveal a hidden passage, or spawn a group of enemies. Switches, on the\
    \ other hand, can be toggled on or off, affecting the state of other elements\
    \ in the level.\n- **Collectibles**: Scatter coins, gems, or other valuable items\
    \ throughout your levels to reward exploration and incentivize skillful play.\n\
    - **Power-Ups**: Grant the player temporary abilities or enhancements, such as\
    \ increased speed, invincibility, or the ability to double jump.\n- **Traps and\
    \ Hazards**: Introduce elements that pose a threat to the player, such as spikes,\
    \ fire pits, or crumbling platforms. These hazards add an element of danger and\
    \ encourage careful navigation.\n- **Puzzles and Challenges**: Incorporate puzzles\
    \ or skill-based challenges that require the player to think critically or execute\
    \ precise maneuvers to progress.\n\n### Implementation Approaches\n\nYou have\
    \ the flexibility to implement interactive elements and obstacles using either\
    \ Blueprints or C++ code, depending on your preference and the complexity of the\
    \ desired behavior.\n\n- **Blueprints**: Blueprints are ideal for creating visually\
    \ intuitive interactions and simple mechanics. They allow you to quickly prototype\
    \ ideas and iterate on gameplay elements without writing code.\n- **C++**: C++\
    \ is well-suited for implementing more complex or performance-critical interactions,\
    \ providing fine-grained control and optimization opportunities.\n\n### Example:\
    \ Creating a Moving Platform\n\nLet's create a simple moving platform using Blueprints:\n\
    \n1. **Create a Blueprint**: In the Content Browser, create a new Blueprint class\
    \ with the Parent Class set to `Actor`.\n2. **Add Components**: Add a `Static\
    \ Mesh Component` to represent the platform's visual appearance and a `Box Collision\
    \ Component` to handle collisions with the player.\n3. **Add Movement Logic**:\n\
    \    - In the Event Graph, create a `Timeline` node to control the platform's\
    \ movement over time.\n    - Connect the Timeline's `Update` output to a `SetActorLocation`\
    \ node to update the platform's position.\n    - Configure the Timeline to define\
    \ the movement pattern (e.g., back and forth between two points).\n\n## Testing\
    \ and Refinement\n\nThorough testing is essential to ensure your interactive elements\
    \ and obstacles function as intended and contribute positively to the gameplay\
    \ experience. Pay attention to:\n\n- **Responsiveness**: Interactions should feel\
    \ immediate and provide clear feedback to the player.\n- **Fairness**: Obstacles\
    \ and challenges should be challenging but not frustratingly difficult or unfair.\n\
    - **Balance**: Maintain a balance between challenge and reward, ensuring that\
    \ overcoming obstacles feels satisfying and rewarding.\n\n## Level Design Integration\n"
  raw: 'Bringing your character to life and enabling them to traverse the 3D platforming
    world you''ve designed is a pivotal step in game development. Fluid and responsive
    movement controls are essential for creating an enjoyable and immersive player
    experience. In this section, we''ll delve into the implementation of player movement
    and controls, utilizing C++ and Unreal Engine''s powerful character movement component
    to empower your character with the ability to jump, run, and conquer the challenges
    that lie ahead.


    Leveraging Unreal Engine''s Character Movement Component


    Unreal Engine provides a robust  UCharacterMovementComponent that handles the
    core mechanics of character movement, including:


    ● Walking and Running: The component manages movement along the ground, taking
    into account factors like slope, friction, and acceleration.


    ● Jumping: It implements jumping mechanics, controlling jump height, air control,
    and gravity.


    ● Crouching: It enables crouching behavior, adjusting the character''s capsule
    collider and movement capabilities.


    ● Falling and Landing: It handles falling and landing, applying damage or triggering
    events based on the impact.


    Accessing the Character Movement Component


    Within your  MyCharacter C++ class, you can access the character movement component
    using the  GetCharacterMovement() function. This grants you control over various
    movement parameters and allows you to customize the character''s behavior.


    C++


    UCharacterMovementComponent* MovementComponent = GetCharacterMovement();


    Implementing Basic Movement


    ● Forward/Backward Movement: Use the  AddMovementInput() function to apply movement
    input along the character''s forward vector. The input value typically ranges
    from -1 (backward) to 1 (forward).


    C++


    void  AMyCharacter::MoveForward(float Value)


    {


    if (Controller && Value != 0.0f)


    {


    // ... (Implementation similar to the example in the previous chapter)


    AddMovementInput(Direction, Value);


    }


    }


    ● Left/Right Movement: Implement similar logic to move the character left or right,
    but use the character''s right vector instead of the forward vector.


    ● Jumping: Call the  Jump() function on the character movement component to initiate
    a jump.


    C++


    void  AMyCharacter::Jump()


    {


    if (GetCharacterMovement()->IsMovingOnGround())


    {


    ACharacter::Jump();


    }


    }


    Customizing Movement Behavior


    ● Movement Speed: Adjust the  MaxWalkSpeed property of the character movement
    component to control the character''s maximum walking or running speed.


    ● Jump Height: Modify the  JumpZVelocity property to control the height of the
    character''s jumps.


    ● Gravity: Tweak the  GravityScale property to influence how strongly gravity
    affects the character.


    ● Air Control: Adjust the  AirControl property to control how much control the
    player has over the character while in the air.


    Advanced Movement Techniques


    As you progress in your game development journey, you can explore more advanced
    movement techniques, such as:


    ● Double Jumping: Allow the character to perform an additional jump while in the
    air.


    ● Wall Jumping: Enable the character to jump off walls to reach higher areas.


    ● Dashing or Dodging: Implement quick bursts of movement for evasion or traversal.


    ● Climbing and Mantling: Allow the character to climb ledges or obstacles.


    Polishing the Controls


    ● Responsiveness: Ensure the controls feel snappy and responsive, minimizing input
    lag and providing immediate feedback to the player''s actions.


    ● Smoothness: Implement smooth acceleration and deceleration to create a more
    natural and fluid movement experience.


    ● Customization: Provide options for players to customize their control scheme
    and sensitivity settings.


    By implementing player movement and controls, you''ve breathed life into your
    character, enabling them to explore the 3D platforming world you''ve created.
    The combination of Unreal Engine''s character movement component and your C++
    code empowers you to craft a responsive and enjoyable control scheme that enhances
    the player''s immersion and sense of agency.


    ### Creating Interactive Elements and Obstacles


    A captivating platformer isn''t merely a collection of platforms; it''s a dynamic
    world brimming with interactive elements and challenging obstacles that test the
    player''s skills and enrich their experience. In this section, we''ll delve into
    the creation of these engaging components, utilizing C++, Blueprints, and Unreal
    Engine''s versatile tools to add depth and excitement to your 3D platforming adventure.


    Types of Interactive Elements and Obstacles


    The possibilities for interactive elements and obstacles are virtually limitless,
    but let''s explore a few common examples:


    ● Moving Platforms: These dynamic platforms can move horizontally, vertically,
    or along a predefined path, requiring precise timing and agility from the player.
    You can implement their movement using Blueprints or C++ code, controlling their
    speed, direction, and patterns.


    ● Triggers and Switches: Triggers can be invisible volumes or physical objects
    that activate events when the player interacts with them. For example, a trigger
    might open a door, reveal a hidden passage, or spawn a group of enemies. Switches,
    on the other hand, can be toggled on or off, affecting the state of other elements
    in the level.


    ● Collectibles: Scatter coins, gems, or other valuable items throughout your levels
    to reward exploration and incentivize skillful play.


    ● Power-Ups: Grant the player temporary abilities or enhancements, such as increased
    speed, invincibility, or the ability to double jump.


    ● Traps and Hazards: Introduce elements that pose a threat to the player, such
    as spikes, fire pits, or crumbling platforms. These hazards add an element of
    danger and encourage careful navigation.


    ● Puzzles and Challenges: Incorporate puzzles or skill-based challenges that require
    the player to think critically or execute precise maneuvers to progress.


    Implementation Approaches


    You have the flexibility to implement interactive elements and obstacles using
    either Blueprints or C++ code, depending on your preference and the complexity
    of the desired behavior.


    ● Blueprints: Blueprints are ideal for creating visually intuitive interactions
    and simple mechanics. They allow you to quickly prototype ideas and iterate on
    gameplay elements without writing code.


    ● C++: C++ is well-suited for implementing more complex or performance-critical
    interactions, providing fine-grained control and optimization opportunities.


    Example: Creating a Moving Platform


    Let''s create a simple moving platform using Blueprints:


    1. Create a Blueprint: In the Content Browser, create a new Blueprint class with
    the Parent Class set to  Actor.


    2. Add Components: Add a  Static Mesh Component to represent the platform''s visual
    appearance and a  Box Collision Component to handle collisions with the player.


    3.    Add Movement Logic:


    ○ In the Event Graph, create a "Timeline" node to control the platform''s movement
    over time.


    ○ Connect the Timeline''s "Update" output to a "SetActorLocation" node to update
    the platform''s position.


    ○ Configure the Timeline to define the movement pattern (e.g., back and forth
    between two points).


    Testing and Refinement


    Thorough testing is essential to ensure your interactive elements and obstacles
    function as intended and contribute positively to the gameplay experience. Pay
    attention to:


    ● Responsiveness: Interactions should feel immediate and provide clear feedback
    to the player.


    ● Fairness: Obstacles and challenges should be challenging but not frustratingly
    difficult or unfair.


    ● Balance: Maintain a balance between challenge and reward, ensuring that overcoming
    obstacles feels satisfying and rewarding.


    Level Design Integration'
