  trans: "\n\n- **快速原型制作**：视觉化脚本允许你快速尝试想法并迭代游戏机制。\n- **调试**：`Blueprint Editor` 提供了视觉化调试工具，帮助你识别并修复逻辑中的问题。\n\
    \n## 蓝图与 C++：黄金搭档\n\n虽然蓝图功能非常强大，但 C++ 仍然是性能关键型或复杂游戏系统的首选语言。虚幻引擎允许蓝图与 `C++` 之间进行无缝集成，使你能够利用这两种方法的优势。\n\
    \n### 项目 3：搭建你的第一个 3D 场景\n\n让我们开启在虚幻引擎中创建 3D 场景的实操之旅吧。在这个项目中，我们将结合学到的关于界面、`Content\
    \ Browser` 和蓝图的知识，构建一个基础的 3D 环境。随着学习的深入，这个基础场景将成为构建更复杂的游戏关卡和体验的基石。\n\n### 项目目标\n\
    \n- 熟悉 `Level Editor` 及其工具。\n- 学习如何在场景中导入和放置资产。\n- 尝试基础的光照和大气效果。\n- 利用蓝图添加简单的交互性。\n\
    \n### 步骤指南\n\n1. **创建新关卡**：\n   - 启动虚幻引擎并创建一个新项目。选择“空白 (Blank)”模板，使用 `C++` 作为编程语言并将“桌面/主机”作为目标平台。\n\
    \   - 项目打开后，你将看到一个新的空关卡。\n\n2. **导入资产**：\n   - 在 `Content Browser` 中，右键点击并选择 `Import\
    \ to...` 或使用工具栏上的 `Import` 按钮。\n   - 导入几个基础资产来填充你的场景。你可以从这里开始：\n     - 地网格（平面或简单的地面纹理）。\n\
    \     - 几个基础形状，如立方体或球体。\n     - 一个用于照明场景的 `directional light`（方向光）。\n     - 一个\
