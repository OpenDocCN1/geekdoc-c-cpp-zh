- fmt: "\n- **Rapid Prototyping**: Visual scripting enables you to quickly experiment\
    \ with ideas and iterate on gameplay mechanics.\n- **Debugging**: The `Blueprint\
    \ Editor` provides visual debugging tools to help you identify and fix issues\
    \ in your logic.\n\n## Blueprints and C++: A Powerful Duo\n\nWhile Blueprints\
    \ are incredibly versatile, C++ remains the language of choice for performance-critical\
    \ or complex game systems. Unreal Engine allows seamless integration between Blueprints\
    \ and `C++`, enabling you to leverage the strengths of both approaches.\n\n###\
    \ Project 3: Setting Up Your First 3D Scene\n\nLet's embark on a hands-on journey\
    \ into the world of 3D scene creation within Unreal Engine. In this project, we'll\
    \ combine the knowledge we've acquired about the interface, the `Content Browser`,\
    \ and Blueprints to construct a basic 3D environment. This foundational scene\
    \ will serve as a stepping stone for more elaborate game levels and experiences\
    \ as we progress.\n\n### Project Goals\n\n- Familiarize yourself with the `Level\
    \ Editor` and its tools.\n- Learn how to import and place assets within a scene.\n\
    - Experiment with basic lighting and atmospheric effects.\n- Utilize Blueprints\
    \ to add simple interactivity.\n\n### Step-by-Step Guide\n\n1. **Create a New\
    \ Level**:\n   - Launch Unreal Engine and create a new project. Choose a \"Blank\"\
    \ template with `C++` as the programming language and \"Desktop/Console\" as the\
    \ target platform.\n   - Once the project opens, you'll be presented with a new,\
    \ empty level.\n\n2. **Import Assets**:\n   - In the `Content Browser`, right-click\
    \ and select `Import to...` or use the `Import` button in the toolbar.\n   - Import\
    \ a few basic assets to populate your scene. You can start with:\n     - A floor\
    \ mesh (a plane or a simple ground texture).\n     - A few basic shapes like cubes\
    \ or spheres.\n     - A `directional light` to illuminate the scene.\n     - A\
    \ `sky sphere` or a `skybox` to create a background.\n\n3. **Place Assets in the\
    \ Level**:\n   - Drag and drop the floor mesh from the `Content Browser` into\
    \ the viewport to create a ground plane.\n   - Similarly, drag and drop the other\
    \ shapes to position within within the scene.\n   - Use the transform tools (`translate`,\
    \ `rotate`, `scale`) to adjust their positions, orientations, and sizes as desired.\n\
    \n4. **Add Lighting**:\n   - Drag the `directional light` from the `Content Browser`\
    \ into the viewport.\n   - Adjust its rotation and intensity to achieve the desired\
    \ lighting effect.\n   - Experiment with other light types like `point lights`\
    \ or `spotlights` to add more depth and atmosphere to your scene.\n\n5. **Set\
    \ up the Sky**:\n   - If you imported a `sky sphere` or `skybox`, drag it into\
    \ the viewport and adjust its settings to create a visually appealing background.\n\
    \n6. **Add Interactivity (Optional)**:\n   - Create a simple `Blueprint` that\
    \ makes one of the shapes rotate when the player presses a key.\n   - Attach the\
    \ `Blueprint` to the shape in the `Level Editor`.\n   - Play the level and test\
    \ the interaction.\n\n7. **Save Your Work**:\n   - Save your project to avoid\
    \ losing progress.\n\n### Exploration and Experimentation\n\n- **Grid Snapping**:\
    \ Use grid snapping to align objects precisely.\n- **View Modes**: Switch between\
    \ `lit` and `unlit` modes.\n- **Play in Editor**: Use the `Play` button to test\
    \ your level.\n\n### Expanding Your Scene\n\nAs you become more comfortable with\
    \ the basics, consider expanding your scene with more complex assets and lighting\
    \ techniques.\n\n## Chapter 4: C++ and Integration\n\n### Creating C++ Classes\
    \ in Unreal Engine\n\nWhile Blueprints offer an intuitive approach, `C++` remains\
    \ the backbone of game development. Let's create a simple `MyActor` that inherits\
    \ from `Actor`.\n\n1. Right-click in the `Content Browser` and select `New C++\
    \ Class`.\n2. Choose Parent Class: Select `Actor` as the parent class.\n3. Name\
    \ your class `MyActor` and click `Create Class`.\n4. Visual Studio or Xcode will\
    \ open with the generated header (`.h`) and source (`.cpp`) files.\n\n### Understanding\
    \ C++ Class Hierarchy\n\nUnreal Engine offers a rich hierarchy of classes:\n\n\
    - **UObject**: The base class for most objects, providing essential memory management\
    \ and serialization.\n- **Actor**: Represents any object that can be placed in\
    \ level. own- **Pawn**: An actor that can be possessed and controlled.\n- **Character**:\
    \ A specialized Pawn with built-in movement and animation capabilities.\n- **UAComponent**:\
    \ A modular building block that adds functionality to an actor.\n- **AGameModeBase**:\
    \ Defines the rules and behavior of a game.\n- **PlayerController**: Handles input\
    \ and controls a `Pawn`.\n\n### Anatomy of a C++ Class in Unreal Engine\n\n```cpp\n\
    // MyActor.h\n#pragma once\n\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"MyActor.generated.h\" // Important for Unreal Engine's reflection\
    \ system\n\nUCLASS()\nclass MYPROJECT_API AMyActor : public AActor\n{\nGENERATED_BODY()\n\
    \npublic:\n    // Sets default values for this actor's properties\n    AMyActor();\n\
    \nprotected:\n    // Called when the game starts or when spawned\n    virtual\
    \ void BeginPlay() override;\n\npublic:\n    // Called every frame\n    virtual\
    \ void Tick(float DeltaTime) override;\n};\n```\n\n```cpp\n// MyActor.cpp\n#include\
    \ \"MyActor.h\"\n\n// Sets default values\nAMyActor::AMyActor()\n{\n    // Set\
    \ this actor to call Tick() every frame. You can turn this off to improve performance\
    \ if you don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n}\n\n// Called\
    \ when the game starts or when spawned\nvoid AMyActor::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n\n// Called every frame\nvoid AMyActor::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n```\n"
  raw: '● Rapid Prototyping: Visual scripting enables you to quickly experiment with
    ideas and iterate on gameplay mechanics.


    ● Debugging: The Blueprint Editor provides visual debugging tools to help you
    identify and fix issues in your logic.


    Blueprints and C++: A Powerful Duo


    While Blueprints are incredibly versatile, C++ remains the language of choice
    for performance-critical or complex game systems. Unreal Engine allows seamless
    integration between Blueprints and C++, enabling you to leverage the strengths
    of both approaches.


    ### Project 3: Setting Up Your First 3D Scene


    Let''s embark on a hands-on journey into the world of 3D scene creation within
    Unreal Engine. In this project, we''ll combine the knowledge we''ve acquired about
    the interface, the Content Browser, and Blueprints to construct a basic 3D environment.
    This foundational scene will serve as a stepping stone for more elaborate game
    levels and experiences as we progress.


    Project Goals


    ●     Familiarize yourself with the Level Editor and its tools.


    ● Learn how to import and place assets within a scene.


    ●     Experiment with basic lighting and atmospheric effects.


    ●     Utilize Blueprints to add simple interactivity.


    Step-by-Step Guide


    1.    Create a New Level:


    ○ Launch Unreal Engine and create a new project. Choose a "Blank" template with
    "C++" as the programming language and "Desktop/Console" as the target platform.


    ○ Once the project opens, you''ll be presented with a new, empty level.


    2.    Import Assets:


    ○ In the Content Browser, right-click and select "Import to..." or use the "Import"
    button in the toolbar.


    ○ Import a few basic assets to populate your scene. You can start with:


    ■ A floor mesh (a plane or a simple ground texture).


    ■     A few basic shapes like cubes or spheres.


    ■     A directional light to illuminate the scene.


    ■ A sky sphere or a skybox to create a background.


    3.    Place Assets in the Level:


    ○ Drag and drop the floor mesh from the Content Browser into the viewport to create
    a ground plane.


    ○ Similarly, drag and drop the other shapes to position them within the scene.


    ○ Use the transform tools (translate, rotate, scale) to adjust their positions,
    orientations, and sizes as desired.


    4.    Add Lighting:


    ○ Drag the directional light from the Content Browser into the viewport.


    ○ Adjust its rotation and intensity to achieve the desired lighting effect.


    ○ Experiment with other light types like point lights or spotlights to add more
    depth and atmosphere to your scene.


    5.    Set up the Sky:


    ○ If you imported a sky sphere or skybox, drag it into the viewport and adjust
    its settings to create a visually appealing background.


    6.    Add Interactivity (Optional):


    ○ Create a simple Blueprint that makes one of the shapes rotate when the player
    presses a key.


    ○ Attach the Blueprint to the shape in the Level Editor.


    ○     Play the level and test the interaction.


    7.    Save Your Work:


    ○     Regularly save your level to avoid losing progress.


    Exploration and Experimentation


    Feel free to experiment with different asset placements, lighting setups, and
    Blueprint interactions. This project is an opportunity to explore the Level Editor''s
    capabilities and unleash your creativity.


    Tips and Tricks


    ● Use Grid Snapping: Enable grid snapping to precisely align objects in your scene.


    ● View Modes: Switch between different view modes (lit, wireframe, unlit) to get
    different perspectives on your scene.


    ● Play in Editor: Frequently test your level by pressing the "Play" button to
    see how it looks and feels in real-time.


    Expanding Your Scene


    As you become more comfortable with the basics, consider expanding your scene
    with more complex assets, advanced lighting techniques, and intricate Blueprint
    interactions. The possibilities are endless!


    By completing this project, you''ve taken your first steps in creating a 3D environment
    within Unreal Engine. You''ve learned how to import assets, place them in a scene,
    and add basic lighting and interactivity. This foundational knowledge will serve
    you well as you embark on more ambitious game development projects.


    ## Chapter 4: C++ and Unreal Engine Integration


    Creating C++ Classes in Unreal Engine


    While Blueprints offer a visually intuitive approach to game development, C++
    remains the backbone of Unreal Engine, providing unparalleled power, performance,
    and flexibility. In this section, we''ll bridge the gap between these two worlds,
    exploring how to create C++ classes within Unreal Engine and leverage their capabilities
    to build robust and efficient game systems.


    Understanding Unreal Engine''s Class Hierarchy


    Unreal Engine boasts a rich class hierarchy, where most game objects and systems
    inherit from a set of core classes. Familiarizing yourself with this hierarchy
    is crucial for understanding how to create and extend C++ classes within the engine.


    ● UObject: The Foundation - Most Unreal Engine classes derive from  UObject, a
    base class that provides essential features like:


    ○ Garbage Collection: Automatic memory management, ensuring objects are destroyed
    when no longer referenced.


    ○     Serialization: Saving and loading objects to and from disk.


    ○ Reflection: Runtime information about class properties and functions, enabling
    tools like the editor to interact with your code.


    ● AActor: The Building Block -  AActor represents any object that can exist in
    the game world, such as characters, props, and environmental elements. It provides
    essential functionalities like:


    ○     Transformation: Position, rotation, and scale in the 3D world.


    ○ Components: Modular building blocks that add specific features and behaviors
    to actors (e.g., mesh rendering, physics, collision).


    ○ Ticking: Regular updates during gameplay, allowing actors to perform actions
    and respond to events.


    ● Other Key Classes: Unreal Engine offers a plethora of other classes catering
    to various aspects of game development, such as:


    ○     APawn: A controllable character or entity.


    ○ ACharacter: A specialized Pawn with built-in movement and animation capabilities.


    ○ UComponent: A modular building block that adds functionality to an actor.


    ○ AGameModeBase: Defines the rules and behavior of a game mode.


    ○     PlayerController: Handles input and controls a Pawn or Character.


    Creating Your First C++ Class


    Unreal Engine streamlines the process of creating C++ classes through its integrated
    tools. Let''s create a simple  MyActor class that inherits from  AActor.


    1. Right-click in the Content Browser and select "New C++ Class".


    2. Choose Parent Class: Select  Actor as the parent class.


    3. Name your class  MyActor and click "Create Class".


    4. Visual Studio or Xcode will open with the generated C++ header (.h) and source
    (.cpp) files for your new class.


    Anatomy of a C++ Class in Unreal Engine


    C++


    // MyActor.h


    #pragma once


    #include "CoreMinimal.h"


    #include "GameFramework/Actor.h"


    #include "MyActor.generated.h" // Important for Unreal Engine''s reflection system


    UCLASS()


    class MYPROJECT_API AMyActor :  public AActor


    {


    GENERATED_BODY()


    public:   


    // Sets default values for this actor''s properties


    AMyActor();  


    protected:


    // Called when the game starts or when spawned


    virtual  void  BeginPlay() override;


    public:   


    // Called every frame


    virtual  void  Tick(float DeltaTime) override;  


    };


    C++


    // MyActor.cpp


    #include "MyActor.h"


    // Sets default values


    AMyActor::AMyActor()


    {


    // Set this actor to call Tick() every frame.  You can turn this off to improve
    performance if you don''t   need it.


    PrimaryActorTick.bCanEverTick = true;  


    }


    // Called when the game starts or when spawned


    void  AMyActor::BeginPlay()


    {


    Super::BeginPlay();


    }


    // Called every frame


    void  AMyActor::Tick(float DeltaTime)


    {


    Super::BeginPlay();  


    }


    ●     Header File (.h)


    ○     #include directives: Include necessary Unreal Engine header files.


    ○ UCLASS() macro: Tells Unreal Engine this is a class it should be aware of.'
