  trans: "\n\n## 持续改进\n-性能分析应该是贯穿整个开发过程的持续过程。当你添加新功能或修改现有系统时，定期的性能分析有助于你识别任何性能退化并保持最佳性能。\n\
    \n## Unreal Engine 中的性能分析工具\nUnreal Engine 了一了一系列强大的性能分析工具来辅助性能分析：\n\n- **Unreal\
    \ Insights**：一个全面的性能分析和追踪系统，捕获有关 CPU、GPU 和内存使用的的详细信息，允许你识别性能热点和瓶颈。\n- **Stat Commands**：控制台命令，提供实时性能统计和对引擎各个方面的见解，例如帧率、绘制调用（draw\
    \ calls）和内存使用情况。\n- **Profiler UI**：Unreal 编辑器内的可视化界面，可实时显示分析数据，允许你在工作时监控性能。\n\
    \n## 识别瓶颈\n\n- **CPU 性能分析**：分析 CPU 使用情况，以识别占用过多处理时间的函数或系统。常见的 CPU 瓶颈包括：\n    -\
    \ **游戏逻辑**：复杂的 AI 计算、物理模拟或大规模游戏系统可能会给 CPU 带来压力。\n    - **渲染**：低效的渲染算法、过多的绘制调用或复杂的材质着色器可能会影响\
    \ CPU 性能。\n- **垃圾回收**：频繁的垃圾回收周期会导致临时暂停并影响帧率。\n- **GPU 性能分析**：检查 GPU 使用情况，以准确定渲染瓶颈所在区域。常见的\
    \ GPU 瓶颈包括：\n    - **过度绘制（Overdraw）**：由于几何体重叠或透明对象导致像素被多次渲染。\n    - **填充率（Fill\
    \ Rate）**：GPU 填充屏幕像素的能力，受高分辨率纹理、复杂着色器或大量对象的影响。\n    - **着色器复杂度**：执行复杂计算或访问大量数据的着色器会限制\
    \ GPU 性能。\n- **内存性能分析**：监控内存使用情况，以识别内存分配或碎片导致性能问题的区域。内存泄漏、过度的资源加载或低效的数据结构都会导致内存瓶颈。\n\
    \n## 解读数据\n一旦你收集了分析数据，有效地对其进行解读非常重要：\n\n- **识别热点**：寻找始终出现在分析器列表顶部的函数或系统，这表明它们消耗了大量的资源。\n\
    - **分析调用堆栈（Call Stacks）**：检查热点的调用堆栈，以理解导致性能问题的函数调用链。\n- **比较数据**：比较不同运行或场景的性能分析数据，以识别趋势并隔离性能问题的根源。\n\
    \n## 针对性优化\n一旦你识别了瓶颈，你就可以实施针对性的优化来提高性能。这些优化可能涉及：\n\n- **算法改进**：用更优化的替代方案替换低效的算法。\n\
    - **代码重构**：重组或重写代码以提高性能、减少冗余或消除不必要的计算。\n- **资源优化**：减小纹理、模型和其他资源的大小和复杂度，以最小化减少内存占用和渲染开销。\n\
    - **剔除（Culling）和 LOD**：采用剔除和多级细节（`LOD`）技术来减少渲染的对象数量，并根据它们与摄像机的距离优化性能。\n- **多线程**：利用多线程将任务分配到多个核心上并提高并行性。\n\
    \n性能分析和识别瓶颈是性能优化过程中不可或缺的步骤。通过利用 Unreal Engine 的性能分析工具并分析性能数据，你可以确定性能问题的根源，并实施针对性的优化，以实现流畅、响应迅速且视觉惊艳的游戏体验。\n\
    \n## 优化 C++ 代码\nC++ 代码优化是精炼代码以实现巅峰性能的艺术，确保你的游戏运行流畅且高效。这是一个多层次的过程，涉及仔细的分析、战略性的决策以及对\
    \ C++ 语言特性和编译器优化的深度理解。在本节中，我们将探索 Unreal Engine 游戏开发背景下优化 C++ 代码的关键技术，使你能够编写高性能代码，最大限地利用硬件能力并提供卓越的游戏体验。\n\
    \n### 性能分析引导优化\n- **识别热点**：使用性能分析工具（如上一节所述）识别消耗最多 CPU 时间的函数或代码段。\n- **关注关键路径**：优先优化位于关键路径上的代码，例如游戏循环、渲染流水线或核心游戏系统。这些区域的优化对整体性能的影响最大。\n\
    \n### 算法和数据结构优化\n- **选择合适的算法**：选择适用于任务的算法，考虑时间复杂度和空间复杂度。\n- **高效的数据结构**：利用提供快速访问和操作的数据结构。例如，如果不需要排序，使用\
    \ `std::unordered_map` 代替 `std::map` 进行快速键值查找。\n- **缓存优化**：在内存中排列数据以最大化缓存局部性，减少缓存缺失。\n\
    - **向量化**：利用 SIMD（单指令多数据）指令对多个数据元素执行操作，利用处理器的并行性。\n\n### 代码级优化\n- **循环展开（Loop\
    \ Unrolling）**：手动展开循环以减少循环开销并提高指令并行性。谨慎使用此技术，因为它可能会增加体积。\n- **分支预测**：构建代码以减少分支预测错误，这会破坏流水流水线并影响性能。考虑分支重排序或循环切换技术。\n\
    - **内联函数**：使用 `inline` 关键字建议编译器将函数调用替换为实际代码，通过消除函数调用开销来提高性能。\n- **常量正确**：使用 `const`\
    \ 标记不可修改的变量和函数，允许编译器执行额外的优化。\n\n### 内存优化\n- **减少分配**：使用对象池或预分配等技术减少动态内存分配的次数。\n\
    - **避免内存碎片**：使用自定义分配器或内存池更有效地管理内存并减少碎片。\n- **面向数据的设计**：以优化内存访问模式和缓存利用的方式来组织你的数据。\n\
    \n### 编译器优化\n- **优化级别**：Unreal Engine 提供了各种优化级别（例如“Development”、“Shipping”），控制编译器优化的激进程度。在发布版本中使用更高优化级别以最大化性能。\n\
    - **性能分析引导优化 (PGO)**：带有监测功能编译游戏以收集分析数据，然后根据这些数据重新编译并优化。PGO 在某些情况下可以带来显著的性能提升。\n\
    \n### 其他考虑\n- **分析与迭代**：持续对代码进行性能分析并迭代优化，衡量每次更改的影响以确保其是有益的。\n- **可读性与性能**：在代码可读性和性能之间寻求平衡。避免可能导致代码难以维护的过度或晦涩的优化。\n\
    - **特定平台优化**：考虑针对特定平台的优化，以利用不同硬件架构的独特能力。\n\n"
- fmt: "\nOptimizing C++ code is an ongoing process that requires careful analysis,\
    \ strategic decision-making, and a willingness to experiment and iterate. By understanding\
    \ the principles of performance optimization and leveraging Unreal Engine's tools\
    \ and C++ language features, you can write code that's both efficient and maintainable,\
    \ delivering exceptional gameplay experiences that push the boundaries of what's\
    \ possible.\n\n## Level of Detail (LOD) and Culling\n\nIn the pursuit of optimal\
    \ performance in 3D game development, Level of Detail (LOD) and culling techniques\
    \ emerge as powerful tools for balancing visual fidelity with rendering efficiency.\
    \ `LOD` allows you to dynamically adjust the complexity of 3D models based on\
    \ their distance from the camera, while culling selectively discards objects that\
    \ are not visible to the player. Let's explore these essential optimization strategies\
    \ and discover how they contribute to smooth and responsive gameplay experiences.\n\
    \n### Level of Detail (LOD)\n\n- **Concept**: LOD` involves creating multiple\
    \ versions of a 3D model, each with varying levels of detail. As the model moves\
    \ farther away from the camera, the engine automatically switches to a lower-detail\
    \ version, reducing the number of polygons and vertices that need to be rendered.\n\
    - **Benefits**:\n    - **Performance Improvement**: By rendering simpler versions\
    \ of distant objects, `LOD` significantly reduces the load on the `GPU`, leading\
    \ to improved frame rates and smoother gameplay.\n    - **Visual Quality Preservation**:\
    \ `LOD` transitions are typically designed to be seamless, ensuring that the visual\
    \ quality of the scene remains consistent even as objects move closer or farther\
    \ away.\n- **Implementation**:\n    - **Manual LOD Creation**: Create multiple\
    \ versions of your 3D models in your 3D modeling software, each with a decreasing\
    \ level of detail. Import these `LODs` into Unreal Engine and assign them to your\
    \ `Static Mesh` assets.\n    - **Automatic LOD Generation**: Unreal Engine provides\
    \ tools for automatically generating `LODs` based on your original high-resolution\
    \ model. This can save time and effort, but might require manual tweaking for\
    \ optimal results.\n\n### Culling\n\n- **Concept**: Culling is the process of\
    \ selectively discarding objects or parts of objects that are not visible to the\
    \ player, preventing them from being rendered and saving valuable `GPU` resources.\n\
    - **Types of Culling**:\n    - **Frustum Culling**: Discards objects that are\
    \ outside the camera's view frustum (the visible area of the 3D world).\n    -\
    \ **Occlusion Culling**: Discards objects that are obscured by other objects in\
    \ the scene, even if they are technically within the view frustum.\n    - **Distance\
    \ Culling**: Discards objects that are beyond a certain distance from the camera,\
    \ regardless of their visibility.\n    - **Backface Culling**: Discards the back\
    \ faces of polygons that are facing away from the camera, as they are not visible.\n\
    - **Benefits**:\n    - **Performance Improvement**: Culling significantly reduces\
    \ the number of objects that need to be rendered, leading to substantial performance\
    \ gains, especially in complex scenes with many objects.\n    - **Efficiency**:\
    \ Culling avoids wasting `GPU` resources on rendering objects that the player\
    \ can't see, allowing those resources to be used for more important tasks.\n\n\
    ### LOD and Culling in Unreal Engine\n\nUnreal Engine provides built-in support\
    \ for `LOD` and culling, making it easy to implement these optimization techniques\
    \ in your projects.\n\n- **LOD Settings**: Configure `LOD` settings for your `Static\
    \ Mesh` assets within the `Static Mesh Editor`. You can specify the screen size\
    \ at which each `LOD` should be used and adjust transition settings for smooth\
    \ visual transitions.\n- **Culling Settings**: Control culling behavior through\
    \ project settings and individual component settings. You can adjust culling distances,\
    \ enable or disable occlusion culling, and fine-tune other culling parameters.\n\
    \n### Best Practices\n\n- **Balance Visual Quality and Performance**: Strive for\
    \ a balance between visual fidelity and performance when creating `LODs`. Reduce\
    \ polygon count and detail in distant `LODs` while maintaining acceptable visual\
    \ quality.\n- **Test Thoroughly**: Playtest your levels with `LOD` and culling\
    \ enabled to ensure smooth transitions and avoid visual popping or other artifacts.\n\
    - **Profile and Optimize**: Use profiling tools to identify areas where `LOD`\
    \ or culling could be further optimized to improve performance.\n\n`LOD` and culling\
    \ are indispensable techniques for optimizing performance in 3D games. By dynamically\
    \ adjusting the level of detail for objects based on their distance from the camera\
    \ and selectively discarding invisible objects, you can significantly reduce rendering\
    \ overhead and achieve smooth frame rates, even in complex and visually rich scenes.\n\
    \n## Optimizing Assets and Textures\n\nIn the realm of 3D game development, assets\
    \ and textures are the visual building blocks that bring your worlds to life.\
    \ However, high-resolution textures and complex 3D models can place a significant\
    \ burden on memory and rendering performance. In this section, we'll explore techniques\
    \ for optimizing assets and textures, enabling you to reduce their size and complexity\
    \ without compromising visual quality. This optimization process ensures that\
    \ your game loads quickly, runs smoothly, and delivers a visually stunning experience,\
    \ even on hardware with limited resources.\n\n### Texture Optimization\n\n- **Texture\
    \ Compression**: Unreal Engine provides various texture compression formats that\
    \ significantly reduce file sizes without drastically impacting visual quality.\
    \ Choose the appropriate compression format based on the type of texture and its\
    \ intended use.\n- **Mipmapping**: `Mipmaps` are pre-calculated, lower-resolution\
    \ versions of your textures. They enable the engine to select the most appropriate\
    \ texture resolution based on the object's distance from the camera, reducing\
    \ aliasing and improving performance.\n- **Texture Atlases**: Combine multiple\
    \ textures into a single texture atlas to reduce draw calls and improve rendering\
    \ efficiency. This technique is particularly effective for UI elements or small\
    \ objects that share the same material.\n- **Texture Streaming**: Stream textures\
    \ into memory only when they are needed, reducing initial loading times and memory\
    \ usage.\n\n### 3D Model Optimization\n\n- **Polygon Reduction**: Reduce the number\
    \ of polygons in your 3D models using decimation techniques or manual optimization\
    \ in your 3D modeling software. Strive for a balance between visual quality and\
    \ polygon count, especially for objects that are far from the camera or less important\
    \ for gameplay.\n- **Level of Detail (LOD)**: As discussed earlier, create multiple\
    \ versions of your 3D models with varying levels of detail to optimize performance\
    \ based on their distance from the camera.\n- **Mesh Simplification**: Simplify\
    \ complex meshes by removing unnecessary details or combining similar elements.\n\
    - **Baking**: Bake high-resolution details into normal maps or other texture maps\
    \ to achieve similar visual quality with lower polygon counts.\n\n### Additional\
    \ Optimization Techniques\n\n- **Material Optimization**: Simplify complex material\
    \ shaders and reduce the number of texture samples to improve rendering performance.\n\
    - **Culling**: Employ culling techniques (frustum culling, occlusion culling,\
    \ distance culling) to avoid rendering objects that are not visible to the player.\n\
    - **Instancing**: Use instancing to render multiple copies of the same object\
    \ with a single draw call, significantly improving performance for scenes with\
    \ many repetitive elements.\n- **Lightmapping**: Pre-calculate lighting information\
    \ and store it in lightmaps, reducing the need for real-time lighting calculations\
    \ and improving performance.\n\n### Tools and Workflow\n\nUnreal Engine provides\
    \ a range of tools to assist in asset and texture optimization:\n\n- **Texture\
    \ Editor**: Configure texture compression settings, generate mipmaps, and preview\
    \ the impact of different compression formats.\n- **Static Mesh Editor**: Access\
    \ `LOD` settings, collision properties, and other optimization options for your\
    \ 3D models.\n"
  raw: 'Optimizing C++ code is an ongoing process that requires careful analysis,
    strategic decision-making, and a willingness to experiment and iterate. By understanding
    the principles of performance optimization and leveraging Unreal Engine''s tools
    and C++ language features, you can write code that''s both efficient and maintainable,
    delivering exceptional gameplay experiences that push the boundaries of what''s
    possible.


    ### Level of Detail (LOD) and Culling


    In the pursuit of optimal performance in 3D game development, Level of Detail
    (LOD) and culling techniques emerge as powerful tools for balancing visual fidelity
    with rendering efficiency. LOD allows you to dynamically adjust the complexity
    of 3D models based on their distance from the camera, while culling selectively
    discards objects that are not visible to the player. Let''s explore these essential
    optimization strategies and discover how they contribute to smooth and responsive
    gameplay experiences.


    Level of Detail (LOD)


    ● Concept: LOD involves creating multiple versions of a 3D model, each with varying
    levels of detail. As the model moves farther away from the camera, the engine
    automatically switches to a lower-detail version, reducing the number of polygons
    and vertices that need to be rendered.


    ●     Benefits:


    ○ Performance Improvement: By rendering simpler versions of distant objects, LOD
    significantly reduces the load on the GPU, leading to improved frame rates and
    smoother gameplay.


    ○ Visual Quality Preservation: LOD transitions are typically designed to be seamless,
    ensuring that the visual quality of the scene remains consistent even as objects
    move closer or farther away.


    ●     Implementation:


    ○ Manual LOD Creation: Create multiple versions of your 3D models in your 3D modeling
    software, each with a decreasing level of detail. Import these LODs into Unreal
    Engine and assign them to your Static Mesh assets.


    ○ Automatic LOD Generation: Unreal Engine provides tools for automatically generating
    LODs based on your original high-resolution model. This can save time and effort,
    but might require manual tweaking for optimal results.


    Culling


    ● Concept: Culling is the process of selectively discarding objects or parts of
    objects that are not visible to the player, preventing them from being rendered
    and saving valuable GPU resources.


    ●     Types of Culling:


    ○ Frustum Culling: Discards objects that are outside the camera''s view frustum
    (the visible area of the 3D world).


    ○ Occlusion Culling: Discards objects that are obscured by other objects in the
    scene, even if they are technically within the view frustum.


    ○ Distance Culling: Discards objects that are beyond a certain distance from the
    camera, regardless of their visibility.


    ○ Backface Culling: Discards the back faces of polygons that are facing away from
    the camera, as they are not visible.


    ●     Benefits:


    ○ Performance Improvement: Culling significantly reduces the number of objects
    that need to be rendered, leading to substantial performance gains, especially
    in complex scenes with many objects.


    ○ Efficiency: Culling avoids wasting GPU resources on rendering objects that the
    player can''t see, allowing those resources to be used for more important tasks.


    LOD and Culling in Unreal Engine


    Unreal Engine provides built-in support for LOD and culling, making it easy to
    implement these optimization techniques in your projects.


    ● LOD Settings: Configure LOD settings for your Static Mesh assets within the
    Static Mesh Editor. You can specify the screen size at which each LOD should be
    used and adjust transition settings for smooth visual transitions.


    ● Culling Settings: Control culling behavior through project settings and individual
    component settings. You can adjust culling distances, enable or disable occlusion
    culling, and fine-tune other culling parameters.


    Best Practices


    ● Balance Visual Quality and Performance: Strive for a balance between visual
    fidelity and performance when creating LODs. Reduce polygon count and detail in
    distant LODs while maintaining acceptable visual quality.


    ● Test Thoroughly: Playtest your levels with LOD and culling enabled to ensure
    smooth transitions and avoid visual popping or other artifacts.


    ● Profile and Optimize: Use profiling tools to identify areas where LOD or culling
    could be further optimized to improve performance.


    LOD and culling are indispensable techniques for optimizing performance in 3D
    games. By dynamically adjusting the level of detail for objects based on their
    distance from the camera and selectively discarding invisible objects, you can
    significantly reduce rendering overhead and achieve smooth frame rates, even in
    complex and visually rich scenes.


    ### Optimizing Assets and Textures


    In the realm of 3D game development, assets and textures are the visual building
    blocks that bring your worlds to life. However, high-resolution textures and complex
    3D models can place a significant burden on memory and rendering performance.
    In this section, we''ll explore techniques for optimizing assets and textures,
    enabling you to reduce their size and complexity without compromising visual quality.
    This optimization process ensures that your game loads quickly, runs smoothly,
    and delivers a visually stunning experience, even on hardware with limited resources.


    Texture Optimization


    ● Texture Compression: Unreal Engine provides various texture compression formats
    that significantly reduce file sizes without drastically impacting visual quality.
    Choose the appropriate compression format based on the type of texture and its
    intended use.


    ● Mipmapping: Mipmaps are pre-calculated, lower-resolution versions of your textures.
    They enable the engine to select the most appropriate texture resolution based
    on the object''s distance from the camera, reducing aliasing and improving performance.


    ● Texture Atlases: Combine multiple textures into a single texture atlas to reduce
    draw calls and improve rendering efficiency. This technique is particularly effective
    for UI elements or small objects that share the same material.


    ● Texture Streaming: Stream textures into memory only when they are needed, reducing
    initial loading times and memory usage.


    3D Model Optimization


    ● Polygon Reduction: Reduce the number of polygons in your 3D models using decimation
    techniques or manual optimization in your 3D modeling software. Strive for a balance
    between visual quality and polygon count, especially for objects that are far
    from the camera or less important for gameplay.


    ● Level of Detail (LOD): As discussed earlier, create multiple versions of your
    3D models with varying levels of detail to optimize performance based on their
    distance from the camera.


    ● Mesh Simplification: Simplify complex meshes by removing unnecessary details
    or combining similar elements.


    ● Baking: Bake high-resolution details into normal maps or other texture maps
    to achieve similar visual quality with lower polygon counts.


    Additional Optimization Techniques


    ● Material Optimization: Simplify complex material shaders and reduce the number
    of texture samples to improve rendering performance.


    ● Culling: Employ culling techniques (frustum culling, occlusion culling, distance
    culling) to avoid rendering objects that are not visible to the player.


    ● Instancing: Use instancing to render multiple copies of the same object with
    a single draw call, significantly improving performance for scenes with many repetitive
    elements.


    ● Lightmapping: Pre-calculate lighting information and store it in lightmaps,
    reducing the need for real-time lighting calculations and improving performance.


    Tools and Workflow


    Unreal Engine provides a range of tools to assist in asset and texture optimization:


    ● Texture Editor: Configure texture compression settings, generate mipmaps, and
    preview the impact of different compression formats.


    ● Static Mesh Editor: Access LOD settings, collision properties, and other optimization
    options for your 3D models.'
