    # # Create walls


    To create the walls, add both a "Wall" instance and a "Wall_Torch" instance to
    the "Walls" container and reset both to the standard values with Reset. Now position
    them upright on the outer ones Floor panels so that the visible surfaces point
    inwards towards the floor surfaces, e.g. B. on positions (0,2,-2) and (2,2,-2).
    Now copy these instances again as with the "Floor" instances and arrange them
    as you wish on the outer edges of the floor slabs so that at the end floor area
    is framed. Since the torches of the "Wall_Torch" instances are responsible for
    the lighting later you should make sure that enough instances are distributed
    in the level so that all corners are illuminated.'
