    \ transform.position;\n        Ray ray = new Ray(transform.position, direction.normalized);\n\
    \        RaycastHit hit;\n        if (Physics.Raycast(ray, out hit, 5)) {\n  \
    \          if (hit.collider.gameObject == player) {\n                Vector3 dir\
    \ = hit.transform.position;\n                float angle = Vector3.Angle(dir,\
    \ transform.forward);\n                if (angle < fieldOfView * 0.5f)\n     \
    \               StopSearching();\n            }\n        }\n    }\n\n    public\
    \ void StopSearching() {\n        playerDetected = true;\n        CancelInvoke(\"\
    Searching\");\n    }\n\n    void OnTriggerEnter (Collider other) {\n        if\
    \ (other.gameObject.CompareTag(\"Door\")) {\n            obstacleDetected = true;\n\
    \        }\n    }\n\n    void OnTriggerExit (Collider other) {\n        if (other.gameObject.CompareTag(\"\
    Door\")) {\n            obstacleDetected = false;\n        }\n    }\n}\n```\n\n\
    # 管理健康状态\n\n接下来，我们要处理 NPC 的生命管理和健康。像 PlayerHealth 脚本一样，这个脚本应该构建在 HealthController\
    \ 类之上，因此我们将创建一个名为 EnemyHealth 的新脚本，它继承自 HealthController 并拥有以下变量（见列表 21.69）：\n\
    \n```go\nusing UnityEngine;\nusing System.Collections;\npublic class EnemyHealth\
