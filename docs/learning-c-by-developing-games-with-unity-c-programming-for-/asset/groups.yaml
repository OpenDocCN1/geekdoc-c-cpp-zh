    [content]

    Some 2D games use 3D geometry for the environment and characters, but restrict
    the gameplay to two dimensions. For example, the camera may show a “side scrolling
    view” and the player can only move unto two dimensions, but game still use 3D
    models for the obstacles and a 3D perspective for the camera. For these games,
    the 3D effect may serve a stylistic rather than functional purpose. This type
    of game is also sometimes referred to as “2.5D”. Although the gameplay is 2D,
    you will mostly be manipulating 3D models to build the game so you should start
    the editor in 3D mode.


    Perhaps the gaming industry is one of the most difficult industries in this era,
    and that is in many ways that start with technical challenges, passing through
    an audience that is difficult to satisfy and ruthless even for the major companies
    if their products are not at the required level, and not an end to fierce competition
    and high failure rates and the difficulty of achieving profits that cover high
    production costs.


    On the other hand, there are features of this industry that make survival in it
    is possible. On the technical side, for example, the vast majority of games are
    not free of similar functions and repetitive patterns of data processing, which
    makes the reuse of the software modules of previous games in order to create new
    games possible. This, in turn, contributes to overcoming technical obstacles and
    shortening time and effort.


    When you talk about making a game, you are here to mention the big process that
    involves dozens and possibly hundreds of tasks to accomplish in many areas. Making
    a game means producing, marketing, and publishing it, and all the administrative,
    technical, technical, financial, and legal procedures and steps involved in these
    operations. However, what is important for us in this series of lessons is the
    technical aspect which is game development, which is the process of building the
    final software product with all its components. This process does not necessarily
    include game design, as the design process has a broader perspective and focuses
    on such things as the story, the general characteristic of the game, the shapes
    of the stages and the nature of the opponents, as well as the rules of the game,
    its goals and terms of winning and losing.


    Returning to the game development process, we find that many specializations and
    skills contribute to this process. There are painters, model designers, animation
    technicians, sound engineers, and director, in addition to - of course - programmers.
    This comprehensive view is important to know that the programmer''s role in producing
    the game is only an integral role for the roles of other team members, though
    this image is beginning to change with the emergence of independent developers
    Indie Developers who perform many tasks besides programming.


    ## Why do we use game engines?


    If we wanted to talk in more detail about the role of programmers in the games
    industry, we will find that even at the level of programming itself there are
    several roles that must be taken: there are graphics programming and are input
    systems, resource import systems, artificial intelligence, physics simulation
    and others such as sound libraries and aids. All of these tasks can be accomplished
    in the form of reusable software modules as I mentioned earlier, and therefore
    these units together constitute what is known as the Game Engine. By using the
    engine and software libraries that compose it, you are reducing yourself to the
    effort needed to build an I / O system, simulate physics, and even a portion of
    artificial intelligence. What remains is to write the logic of your own game and
    create what distinguishes it from other games. This last point is what the next
    series of lessons will revolve around, and although the task seems very small
    compared to developing the entire game, it is on its smallness that requires considerable
    effort in design and implementation as we will see.


    ## Quick steps to get started with Unity Engine


    If you did not have previous experience with this engine, you can read this quick
    introduction, and you can skip it if you have dealt with this engine previously.
    I will not elaborate on these steps since there are many lessons, whether in Arabic
    or English, that you take, but here we are to make sure that each series reader
    has the same degree of initial knowledge before starting.


    ## The first step: download and install the engine


    To download the latest version of the engine, which is 19, go directly to the
    website http://unity3d.com and then download the appropriate version for the operating
    system that you are using, knowing that the free version of the engine has great
    potential and it meets the purpose for our project in this series of lessons.


    ## Step two: create the project


    Once the engine is is running after installing it, the start screen will appear,
    click New Project to display a screen like the one you see in the image below.
    All you have to do is choose the type 2D and then choose the name and location
    of the new project that you will create, and then click on Create Project.


    - 1. The name defaults to New Unity Project but you can change it to whatever
    you want. Type the name you want to call your project into the Project name field.

    - 2. The location defaults to your home folder on your computer but you can change
    it. EITHER (a) Type where you want to store your project on your computer into
    the Location field. OR (b) Click on the three blue dots... This brings up your
    computer’s Finder (Mac OS X) or File Explorer (Windows OS).

    - 3. Then, in Finder or File Explorer, select the project folder that you want
    to store your new project in, and select “Choose”.

    - 4. Select 3D or 2D for your project type. The default is 3D, coloured red to
    show it is selected. (The 2D option sets the Unity editor to display its 2D features,
    and the 3D option displays 3D features. If you aren’t sure which to choose, leave
    it as 3D; you can change this setting later.)

    - 5. There is an option to select Asset packages... to include in your project.
    Asset packages are pre-made content such as images, styles, lighting effects,
    and in-game character controls, among many other useful game creating tools and
    content. The asset packages offered here are free, bundled with Unity, which you
    can use to get started on your project. EITHER: If you don''t want to import these
    bundled assets now, or aren''t sure, just ignore this option; you can add these
    assets and many others later via the Unity editor. OR: If you do want to import
    these bundled assets now, select Asset packages... to display the list of assets
    available, check the ones you want, and then click on Done.

    - 6. Now select Create project and you’re all set!


    ## Step Three: Get to know the main program windows


    At first we got 4 major windows in Unity. Here is a summary of its functions:


    - **Scene Window**: It you use to build the game scene, add different objects
    to it and distribute it in 2D space. Initially this window contains only one object
    which is the camera.

    - **Hierarchy**: contains a tree arrangement that contains all the objects that
    have been added to the scene and helps you in organizing the relationships between
    them, as it is possible to add objects as children to other beings so that the
    son being is affected by the parent being as we will see. Initially this window
    contains only one object which is the camera.

    - **Project Browser**: Displays all files inside the project folder, whether they
    were added to the scene or not added. The project initially contains one folder
    called Assets, and inside it we will add all other files and folders.

    - **Inspector Properties Window**: When selecting any object from the scene hierarchy,
    scene window, or project browser, its properties will appear in this window and
    you can change it from there.

    - **Console**: The console tab is used to display error and warning messages.
    If you have made programming errors, for example, Unity displays them here. But
    you, as a developer, can also issue reports about this.


    ```

    Console Clear Collapse On Play Error Pause

    Assets/Scripts/MainMenu.cs(11.17): error CS0103: The name "exampleObject" does
    not exist in the current context

    ```


    Messages about errors that must be rectified (errors) are shown in red in the
    window. In contrast, warnings, i.e. non-critical errors, appear yellow. Normal
    information messages are displayed in white. You can also filter the messages
    according to these ratings using the three symbols on the right. In addition to
    the three filter options, the upper console bar also has a few buttons. These
    have the following meanings:

