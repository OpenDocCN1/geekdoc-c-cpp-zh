    # Component programming


    An important principle of Unity is that every GameObject has its own components.
    So you are not programming a life management system that manages the life strength
    of all opponents, but a script that only manages the health of an individual opponent.
    This script is then added to each opponent again, so that each opponent has its
    own administration, and this principle can (and should) sometimes not be adhered
    to in certain situations. But first of all, you should make sure that each GameObject
    has its own components.'
