    # 引言


    Unity 是一个跨平台开发平台，最初用于开发游戏，但现在已用于许多领域，例如：建筑、艺术、儿童应用、信息管理、教育、娱乐、营销、医疗、军事、物理装置、模拟、训练等。


    Unity 承担了开发游戏和类似互动体验的许多复杂性，并在后台处理了这些问题，让人们可以专注于游戏的的设计和开发。这些复杂性包括图形渲染、世界物理和编译。高级用户可以根据需要与之交互并调整它们，而初学者则无需担心。Unity
    游戏的开发分为两部分：第一部分——在 Unity 编辑器内；第二部分——使用代码，特别是 C#。Unity 捆绑了 MonoDev Visual Studio
    2015 Community 版用于编写 C#。


    # 2D 或 3D 项目


    Unity 同样适用于创建 2D 和 3D 游戏。但它们有什么区别呢？当你在 Unity 中创建一个新项目时，可以选择从 2D 或 3D 模式开始。你可能已经知道自己想要构建什么，但有一些细微的点可能会影响你选择的模式。选择从
    2D 还是 3D 模式开始决定了 Unity 编辑器的某些设置——例如图像是被导入为纹理（textures）还是精灵（sprites）。不过不用担心选错，无论你在创建项目时设置了何种模式，你都可以随时在
    2D 或 3D 模式之间切换。以下是一些帮助你选择的指南。


    # 全 3D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_21_0.png)


    3D 游戏通常利用三维几何结构，材质和纹理渲染在这些对象的表面，使其看起来像实体的环境、角色以及在场景中自由移动的物体，并以写实的方式在世界中投射光影。3D
    游戏通常使用透视（perspective）渲染场景，因此物体在靠近相机时，在屏幕上显示得也更大。对于所有符合此描述的游戏，请从 3D 模式开始。


    # 正交 3D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_21_1.png)


    有时游戏使用 3D 几何结构，但使用正交相机（orthographic）而不是透视相机。这是一种常用于提供俯视角的游戏的技术，有时被称为“2.5D”。如果你正在制作这类游戏，你也应该在
    3D 模式下使用编辑器，因为即使没有透视效果，你仍然在处理 3D 模型和资产。不过，你需要将相机和场景视图切换为正交（Orthographic）。（上方场景来自
    Synty Studios 和 BITGEM）


    # 全 2D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_22_0.png)


    许多 2D 游戏使用平面图形，有时被称为精灵（sprites），它们完全没有三维几何结构。它们作为平面图像绘制到屏幕上，游戏相机也没有透视效果。对于这类游戏，你应该在
    2D 模式下启动编辑器。


