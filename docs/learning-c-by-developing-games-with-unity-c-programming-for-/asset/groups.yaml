    MainCamera\");\n\n}\n```\n\n## FindGameObjectsWithTag\n\n如果有多个具有相同标签的对象，但你又想将它们都收集到一个数组中，你应该使用\
    \ `FindGameObjectsWithTag` 方法。作为返回值，你将收到一个包含带有此标签的对象的 GameObject 数组。\n\nGameObject\
    \ [] enemies;\n\n```\nvoid Awake () {\n\nenemies = GameObject.FindGameObjectsWithTag(\"\
    Enemy\");\n\n}\n```\n\n## Find\n\n你可以通过名称查找 GameObject。`GameObject` 类的静态方法 `Find`\
    \ 适用于此操作。\n\n```\nGameObject leftArm;\n```\n\n```\nleftArm = GameObject.Find(\"\
    Left Arm\");\n```\n\n你还可以通过输入你正在查找的 GameObject 的父对象来进一步指定搜索查询。使用斜杠字符 `[/]` 分隔不同的\
    \ GameObject。要表示一个对象是最后一个且本身没有父对象（根对象），可以在前面加一个斜杠。\n\n```\nleftArm = GameObject.Find(\"\
    Bob / Left Arm\"); // Left Arm 有父对象 Bob\n```\n\n```\nleftArm = GameObject.Find(\"\
    / Bob / Left Arm\"); // Bob 是根对象\n```\n\n## 激活和禁用 GameObject\n\n每个 GameObject\
    \ 都提供了 `SetActive` 方法。你可以用它来激活或禁用整个一个 GameObject。为该方法传递你想要实现的状态。\n\n```\nvoid\
    \ Start () {\n    gameObject.SetActive(false);\n}\n```\n\n请注意，只有在你已经可以访问该对象（例如通过\
    \ Inspector 赋值）时，才能激活一个被禁用的对象。使用上述查找方法，你无法找到被禁用的对象。\n\n## 毁 GameObject\n\n要完全销毁一个\
    \ GameObject，必须将对象传递给 `Destroy` 方法。\n\n```\nvoid DestroyPlayer () {\n    GameObject\
    \ player;\n}\n```\n\n```\nplayer = GameObject.FindWithTag(\"Player\");\n\nDestroy\
    \ (player);\n\n}\n```\n\n你还可以给 `Destroy` 方法传递一个浮点数参数，按相应的秒数延迟销毁。\n\nDestroy (player,\
    \ 2.5F);\n\n## 创建 GameObject\n\n大多数情况下，你会通过主菜单使用制体（prefabs）创建 GameObject（见“Prefabs”章节）。但当然，你也可以在运行时创建全新的\
    \ GameObject。你可以通过标准的 C# 方式创建一个 `GameObject` 类的新实例来实现。无论实例是局部变量还是全局变量，或者具有什么访问修饰符，并不重要。由于每个\
    \ GameObject 默认名称为 \"New GameObject\"，你也可以在实例化时给你的 GameObject 命名。\n\n```\nGameObject\
    \ go = new GameObject ( );\n```\n\n```\nGameObject go2 = new GameObject ( \"My\
    \ Name\");\n```\n\n## 访问组件\n\n有多种方法访问组件。访问其他 GameObject 组件的最简单方法是声明一个组件类型的公共变量，并在开发期间将该组件的\
    \ GameObject 拖入该变量。该变量指引的不是 GameObject，而是该 GameObject 的组件。如果 GameObject 没有此组件，则变量的内容为\
    \ `null`，即为空。\n\n```\npublic transform player;\n\nvoid Start () {\n    if ( player\
    \ != null)\n        player.position = Vector3.zero;\n}\n```\n\n## GetComponent\n\
    \n每个 GameObject 都有 `GetComponent` 方法，通过该方法你可以访问相应 GameObject 的所有组件。如果你在调用此方法时不带\
    \ GameObject，该方法将在你自己的 GameObject 中查找此组件。以下示例搜索了玩家的 `HealthController` 以及它自己的，并将其赋值给两个不同的变量以便以后使用。\n\
    \nHealthController playerHc;\n\nHealthController myHc;\n\n```\nvoid Awake ( )\
    \ {\n    GameObject player;\n\n    player = GameObject.FindWithTag(\"Player\"\
    );\n\n    playerHc = player.GetComponent<HealthController>();\n\n    myHc = GetComponent<HealthController\
    \ > ();\n}\n\nvoid Update () {\n    if (playerHc.health> 0) {\n    //Code...\n\
    }\n}\n```\n\n## 减少开销\n\n尽可能减少 `GetComponent` 的访问。对于更频繁的访问，请将组件保存在变量中。\n\n## SendMessage\n\
    \n调用方法的一种非常有趣的方式是 `SendMessage` 方法。`SendMessage` 由 `GameObject` 类提供，并遍历 GameObject\
    \ 的所有 `MonoBehaviour` 脚本，调用所有同名的方法。因此，你甚至不需要知道位于哪个脚本中。可选地，你还可以给 `SendMessage`\
    \ 传递一个传递参数以及 `SendMessageOptions` 类型的选项参数。后者决定了接收方法是否是绝对必要的。如果是必要的但没有找到，则会触发错误。\n\
    \n以下示例脚本可以附加到带有碰撞器的任何武器或陷阱上，以便接触时造成伤害。脚本尝试调用另一个 GameObject 中名为 `ApplyDamage` 的方法并向其传递伤害值\
    \ 1。为此，访问了传递的碰撞参数的 GameObject 并调用了 `SendMessage`。\n\nusing UnityEngine;\n\nusing\
    \ System.Collections;\n\n```\npublic class damage: MonoBehaviour {\n    public\
    \ float amount = 1;\n\n    void OnCollisionEnter( Collision collision) {\n   \
    \     collision.gameObject.SendMessage(\"ApplyDamage\", amount,\n        SendMessageOptions.DontRequireReceiver);\
    \ \n    }\n}\n```\n\n`DontRequireReceiver` 参数表示不需要接收者。这意味着如果目标对象使用此方法的脚本，则不会触发错误。你可以在“Physics\
    \ in Unity”章节中了解碰撞。\n\n## 变量访问\n\n如果你想访问自己的 GameObject 组件，Unity 提供了通过变量访问的方法，这极大地简化了编程工作。这包括\
    \ `AudioSource` 组件、`rigidbody` 组件或 `transform` 组件。\n\n```\naudio.Play();\n```\n\
    \n```\nrigidbody.AddForce (0, 1, 0);\n```\n\n```\ntransform.Translate (0, 10,\
    \ 0);\n```\n\n## 添加组件\n\n想要在运行时为 GameObject 添加新组件，你可以运行每个 GameObject 的 `AddComponent`\
    \ 方法。以下示例为 GameObject 添加了 `HealthController` 脚本组件和 `Rigidbody`。\n\n```\ngameObject.AddComponent<HealthController\
    \ > ();\n```\n\n```\ngameObject.AddComponent<Rigidbody > ();\n```\n\n## 移除组件\n\
    \n从 GameObject 移除组件，像销毁 GameObject 一样使用 `Destroy` 方法。如果你想销毁自己的脚本，使用关键字 `this`。在这里，你也可以使用第二个参数引入时间延迟。\n\
    \n```\nDestroy (rigidbody); // 销毁刚体\n\nDestroy ( this, 2); // 2秒销毁脚本实例\n```\n\n\
    ## 激活和禁用组件\n\n与其直接移除组件，仅禁用它可能也有意义。优点是你以后可以重新激活它。一个经典的例子是灯。以下示例访问了自己 GameObject\
    \ 的 `Light` 组件并使用逻辑否定运算符（感叹号）反转 `enabled` 状态。效果是让开启的灯关闭，让关闭的灯开启。\n\n```\nvoid\
    \ Switch () {\n\nlight.enabled =! light.enabled;\n\n}\n```\n\n## 随机值\n\n随机值是让游戏变得有趣的元素元素。应用范围从分配随机参数值（如强度）到生成并放置\
    \ GameObject 以及创建整个关卡。为此，Unity 提供了 `Random` 类，它提供了许多生成随机值的有趣方法。最常见的是 `Range` 方法。注意：\n\
    \n- `float` 类型的 `Range` 生成位于起始值和结束值之间的随机值。起始和结束值也可以作为结果返回。\n- `int` 类型的 `Range`\
    \ 生成从起始值开始的随机值，但必须小于 结束值。\n\nusing UnityEngine;\n\nusing System.Collections;\n\
    \n```\npublic class RandomXPosition: MonoBehaviour {\n\nvoid Start () {\n\n  \
    \  float xPos = Random.Range(0.0F, 5.0F);\n\n    Vector3 pos = new Vector3 (xPos,\
    \ 10.0);\n\n    transform.position = pos;\n\n}\n\n}\n```\n\n"
