    \ the text \"Throwing stone\".\n- With InventoryItem you assign \"Stone\" as itemName\
    \ and \"stone\" as texture.\n- You do not need to change the collider size here.\n\
    \n![](img/e263e4c2a46d978fb73216c778f3ec48_176_0.png)\n"
