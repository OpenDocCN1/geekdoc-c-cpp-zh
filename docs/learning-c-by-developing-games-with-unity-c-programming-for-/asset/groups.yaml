    Finally the ceiling of the dungeon has to be built. The procedure is almost identical
    to that of the floor surfaces, except that the visible side is naturally facing
    down. Add a "ceiling" instance to the "Ceilings" container and reset it with a
    reset . Now move it to position (0,2,0) and rotate it with the rotation parameter
    to (90,0,0) so that it is exactly above a "Floor" instance at a distance of the
    height of a Wall instance Now copy this instance and move it around until finally
    the entire dungeon is completely enclosed by the floor, wall and ceiling elements.'
