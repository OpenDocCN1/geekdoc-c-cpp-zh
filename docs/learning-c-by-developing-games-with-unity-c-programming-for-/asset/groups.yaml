    \ (33);\n        myNumbers.Add (17);\n        if (myNumbers.IndexOf(33) >= 0)\
    \ {\n            myNumbers.Remove (33);\n            Debug.Log (myNumbers.Count.ToString());\n\
    \        }\n    }\n```\n\n# 常用技巧\n\nUnity 项目中经常使用的泛型类型是 `List <T>` 类型。它的工作方式与数组类似，但这种类型的对象提供的功能比普通数组多得多。你可以使用\
    \ `Add` 方法向这些对象添加许多新元素，使用各种命令对它们进行搜索，或者使用 `Remove` 删除特定元素。创建列表对象时，只需输入对象应该包含的类型即可。在接下来的示例中，因此你应该特别注意\
    \ `myNumbers` 的变量声明，以及 `System.Collections.Generic` 命名空间的包含，`List` 类属于该命名空间。\n\
    \n# 排序\n\n`List` 类的另一个优势是使用 `Sort` 方法对元素进行排序。然而，只有当类型实现了 `IComparable` 接口时，这种方法才能工作。你可以在“接口”章节中找到更多关于此主题的信息。\n\
    \n# 字典\n\n另一个你应该了解的命名空间类是 `Dictionary<TKey, TValue>`，简称 `Dictionary`。它包含两个泛型参数。字典存储键值对。第一个值是唯一标识符（键），第二个值是值。每个键在字典中只能出现一次。下面的示例展示了如何使用\
    \ `ContainsKey` 检查键是否存在，如何使用 `Add` 方法创建新的键值对，以及如何使用键来访问并修改它。\n\n```csharp\nusing\
