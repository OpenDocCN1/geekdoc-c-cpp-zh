    # # Create a quest


    This section is about the actual task the player has to solve. In our game, our
    player should find a water container with which he can catch dripping water. To
    solve this task, also known as a quest, he still has to complete sub-quests and
    fight opponents.


    # # Manage experience points


    For overpowering an opponent and solving the quest, the player should also get
    experience points at the end. Therefore we want to first create a small script
    called EPController that manages these experience points and displays them in
    the GUI. You assign this script to the "Game Controller", which already has the
    LifePoint controller. For the functionalities we need a total of two variables:
    one variable that stores the EP value and another that contains a reference to
    a GUI Object to display the value there.


    ```

    public GUIText epText;

    private int eps = 0;

    ```


