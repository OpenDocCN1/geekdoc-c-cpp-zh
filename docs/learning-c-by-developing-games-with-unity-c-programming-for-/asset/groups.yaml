    \n# Inventory items\n\nIn our game we are dealing with three different item types.\
    \ We want to create these in this section.\n\n# HoverEffects\n\nBefore that, we\
    \ want to program a small script that should display an information text as soon\
    \ as the player points to an object with the mouse. In addition, the player should\
    \ be informed whether he can pick up this object and add it to his inventory.\
    \ We want to achieve this by changing the cursor. Since the information text should\
    \ always appear directly with the respective item, there are now two different\
    \ versions of the implementation. Either we place the text object directly in\
    \ the three-dimensional world with the respective object (e.g. with a 3D component),\
    \ or we use a normal GUI object which is then positioned in the two-dimensional\
    \ pixel coordinate system of the GUI. The advantage of the latter method is that\
    \ the font would always be the same size regardless of how far away an object\
    \ is. And that's why we want to take this procedure. So first we will create a\
    \ general GUIText object that we will always want to place later at the respective\
    \ position where information text is to be displayed.\n\n1. Create GUIText object\
    \ via GameObject which you call \"TooltipText\".\n2. Position the GameObject on\
    \ (0,0,0).\n3. Now create a new \"Tooltip\" and assign it to the GameObject \"\
    Tooltip\".\n4. Set Anchor to \"middle center\" and Alignment to \"center\".\n\
    5. Remove the assigned default text.\n6. If you want, you can also assign different\
    \ font or use the Size and Color properties to adjust it as wish.\n\nNow we create\
    \ a new script called \"HoverEffects\". First, we need a reference to the GUIText\
    \ object and a variable for the information text. We also want to change the cursor.\
    \ Since we want to use a different cursor than the standard pointer in our game\
    \ anyway we are now using two variables: standardCursor and clickableCursor. With\
    \ an additional variable hotSpot we also specify the position of the cursor which\
    \ however simply remains at zero.\n\n```csharp\npublic Texture2D standardCursor;\n\
    public Texture2D clickableCursor;\npublic string tooltipText;\nprivate Vector2\
    \ hotSpot = Vector2.zero;\nprivate GUIText msgBox;\n\nvoid start() {\n    msgBox\
    \ = GameObject.FindWithTag(\"Tooltip\").GetComponent<GUIText>();\n    msgBox.transform.position\
    \ = Vector3.zero;\n}\n\nvoid OnMouseEnter() {\n    if (clickableCursor == null)\n\
    \        Cursor.SetCursor(clickableCursor, hotSpot, CursorMode.Auto);\n    msgBox.text\
    \ = tooltipText;\n    Vector2 pos;\n    pos.x = Input.MousePosition.x;\n    pos.y\
    \ = Input.MousePosition.y + 20; // we put the text a little over the pointer.\n\
    \    msgBox.pixelOffset = pos;\n}\n\nvoid OnMouseExit() {\n    ExitEffect();\n\
    }\n\nvoid Destroy() {\n    ExitEffect();\n}\n\nvoid ExitEffect() {\n    if (standardCursor\
    \ == null)\n        Cursor.SetCursor(standardCursor, hotSpot, CursorMode.Auto);\n\
    \    if (msgBox == null)\n        msgBox.text = \"\";\n}\n```\n\n# Default cursor\n\
    \nAnd while we're at the cursor instead of the normal cursor we want to display\
    \ our own pointer in the form of a sword in the game. We will later assign this\
    \ image to the standard cursor variable of the HoverEffects script. To assign\
    \ the default cursor go to Edit / Project Settings / Player and assign the graphic\
    \ \"icon_01_32x32\" to parameter \"Default Cursor\".\n\n# key\n\nNow we can take\
    \ care of our items. First we want to create a key that we will later need to\
    \ open a locked gate.\n\n1. Drag the model \"iron_key_01\" into your scene and\
    \ rename the GameObject to \"IronKey\".\n2. Assign it the material \"placeables_01_diff\"\
    \ which uses the texture of the same name with shader \"Diffuse\".\n3. Now add\
    \ a box collider to it and slightly enlarge this collider (not the GameObject!)\
    \ over its size in all directions, e.g. by (0.2,0.08,0.02). Since the key is quite\
    \ small we increase the contact area of the key so that the player can later select\
    \ it more easily.\n4. Now add the HoverEffects script to the key. Assign standard\
    \ cursor \"icon_01_32x32\" clickable cursor \"icon_02_32x32\" and tooltip \"Iron\
    \ Key\". Check the import settings for both textures. The Texture Type should\
    \ be on \"Cursor\", the Wrap Mode on \"Clamp\" and the Max Size on 32.\n5. Finally\
    \ add the InventoryItem script to the key. itemName is \"Key\", texture assign\
    \ the texture \"key\" and as picSound take \"picUp\". You should also assign the\
    \ import settings for the \"key\" texture. Here the Texture Type should be \"\
    GUI\" and the Max Size should be 64.\n6. Finally, drag the completed GameObject\
    \ into the \"Prefab\" folder to create a prefab.\n\n![](img/e263e4c2a46d978fb73216c778f3ec48_174_0.png)\n\
    \n# Water tank\n\nDo the same with some changes now with the \"bucket_01_empty\"\
    \ model. I want to briefly explain these changes:\n\n- The name of the GameObject\
    \ is changed to \"BucketEmpty\".\n\n![](img/e263e4c2a46d978fb73216c778f3ec48_175_0.png)\n\
    \n# stone\n\nAnd finally, do this with the \"stone_01\" model. However, there\
    \ are some differences that I would like to briefly explain:\n\n- The name is\
    \ changed to \"Stone\".\n- Instead of the Box Collider, this time add a Sphere\
