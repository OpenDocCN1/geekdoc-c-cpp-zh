    # Create scripts


    In Unity, each script contains exactly one class. The name of the script is always
    the same as that of the class. Otherwise there will be an error later if you want
    to use this. Therefore, when choosing the name of the script, the following also
    applies: do not use spaces or special characters. To create a script, do one of
    the following:


    +   - You use the main menu Assets / Create and select the desired script type
    (in our case C # Script ).


    +   - You use the Create menu of the Project Browser (located above), where you
    can also find the script types listed.


    +   - You use the context menu of the Project Browser, which you can access with
    the right mouse button. You can also find the script types there via the Create
    menu branch.


    +   - You use the New Script option of the Add Component button in the Inspector.
    As soon as you select a GameObject in the hierarchy, you will find it among all
    added components of the GameObject. The script is created by default in the root
    of the project browser and attached to the selected GameObject.'
