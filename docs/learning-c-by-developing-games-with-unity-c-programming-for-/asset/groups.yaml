- md: "\nAn important feature of object-oriented programming is the possibility of\
    \ inheritance. That means nothing more than that as a programmer can develop a\
    \ new class that can use another class with all its methods, variables etc. as\
    \ a basis without having to rewrite the code. This new class is also called the\
    \ derived class. The class from which it inherits is called the base class. If\
    \ a class should now inherit from another, a colon is written after the class\
    \ name, followed by the name of the base class.\n\n```cs\npublic class MyScriptName:\
    \ MonoBehaviour {\n\n//Code\n}\n```\n\nEven if you may not make much use of inheritance\
    \ yourself, this is a very important issue for you as a Unity programmer. Every\
    \ class is created in Unity and is to be used as a component must inherit from\
    \ the Unity class MonoBehaviour. This includes everything a class needs to be\
    \ able to be used as a component. You can find out more about this in Chapter\
    \ 4, \"Script Programming\".\n\n## Base class and derived classes\n\nIf a class\
    \ is to inherit from another in C# a colon must be written after the class name,\
    \ followed by the name of the base class. Suppose we have a class person with\
    \ a public variable name and a private variable points.\n\n```cs\npublic class\
    \ person {\n\n    public string name = \"\";\n\n    private int points = 0;\n\n\
    }\n```\n\nThe derived class NPC, which should have an additional variable health,\
    \ would then look like this:\n\n```cs\npublic class NPC: person {\n\n    public\
    \ int health;\n}\n```\n\nNow you can create an object of the class NPC and use\
    \ both public variables:\n\n```cs\nNPC npc = new NPC ();\nnpc.name = \"Legolas\"\
    ;\n```\n\n```cs\nnpc.health = 10;\n```\n\n## Inheritance and visibility\n\nEven\
    \ if the NPC class inherits from the base class Person in the example above, the\
    \ rules of visibility that I explained earlier still apply. You cannot access\
    \ a private variable or a private method of the base class in a derived class.\
    \ If you still want to allow access, you can define these members with the keyword\
    \ protected instead of private\n\n```cs\npublic class person {\n    public string\
    \ name = \"\";\n    protected int points = 0;\n}\n```\n\nThis means that the variable\
    \ points is still not visible from the outside, but can be accessed in the derived\
    \ class NPC.\n\n```cs\npublic class NPC: person {\n\n    public int health;\n\n\
    \    public void DoSomething () {\n        points = 100;\n    }\n}\n```\n\n##\
    \ Override inherited method\n\nImagine that you have a basic class person who,\
    \ in addition to various variables and methods, also has a method called Shoot.\
    \ To display this functionality, a short text should first be output in the console\
    \ (console tab). You can do this with the Debug.Log command. While the class Person\
    \ is provided with a standard text \"Peng!\", the class NPC should now say something\
    \ else. For this purpose C# there is the possibility to overwrite methods. To\
    \ do this, the method to be overwritten must first be declared as overwritable\
    \ in the base class. This is done with the keyword virtual.\n\n```cs\npublic class\
    \ person {\n\n    public virtual void Shoot () {\n        Debug.Log(\"Peng!\"\
    );\n    }\n}\n```\n\nThe derived class can (but does not have to) override this\
    \ method. The key word here is override.\n\n```cs\npublic class NPC: person {\n\
    \n    public override void Shoot () {\n        Debug.Log(\"Tie!\");\n    }\n}\n\
    ```\n\n## Access to the base class\n\nIf you have now overwritten a method of\
    \ the base class in the derived class, but now want to access the method of the\
    \ base class, the question naturally arises how to do it now. This is made possible\
    \ by the base keyword. You access methods, variables etc. of the base class via\
    \ base.\n\n```cs\npublic class NPC: person {\n    public override void shoot ()\
    \ {\n        base.Shoot();\n        Debug.Log(\"Tie!\");\n    }\n}\n```\n\n##\
    \ Seal classes\n\nAnother way of inheritance is by sealing. This means preventing\
    \ the inheritance ability of a class. In other words, if you prepend the sealed\
    \ keyword in the class definition, no other class can inherit from it.\n\n```cs\n\
    public sealed class NPC: person { // code ... }\n```\n\n## Polymorphism\n\nObject-oriented\
    \ programming languages offer another useful skill called polymorphism. You can\
    \ treat all objects / instances that have a common base class in the same way.\
    \ The following method triggers the Shoot function from a passed object. The script\
    \ does not care whether the object is actually of the Person type or a class that\
    \ was derived from Person (e.g. NPC from the previous example).\n\n```cs\nvoid\
    \ LetsShoot (Person person) {\n    person.Shoot();\n}\n```\n\nDelivery of various\
    \ objects to LetsShoot:\n\n```cs\nPerson person = new person ();\nNPC npc = new\
    \ NPC ();\nLetsShoot (person);\nLetsShoot (npc);\n```\n\n## Interfaces\n\nAnother\
    \ feature of the object orientation of C# are interfaces. With you define common\
    \ features of different classes, via which you can address them again. In this\
    \ way you can treat different classes equally, which can be very useful in certain\
    \ situations. There are general interfaces that have already been predefined by\
    \ Microsoft, which are also important for certain functionalities, and you can\
    \ define your own interfaces.\n\n## Define interface\n\nTo define an interface,\
    \ the keyword is interface used. By convention, the name of an interface always\
    \ begins with an I, so in the example above it would be IShootable. The rest of\
    \ the interface is similar to a class, with the difference that the methods are\
    \ not programmed.\n\n```cs\npublic interface IShootable {\n    void shoot();\n\
    }\n```\n\nAn important difference between classes and interfaces concerns access\
    \ modifiers. While everything in classes is private that has no access modifier,\
    \ interfaces are considered internal. After all, an interface is also used to\
    \ describe the external impact of a class. All other access modifiers, apart from\
    \ public, are even prohibited for interfaces.\n\n## Implement interfaces\n\nIf\
    \ a class is to implement an interface, this is done in the same way as inheriting\
    \ a class, i.e. with a colon. If an inheritance is inherited from a class as well\
    \ as one (or more) interfaces are implemented, these are listed separated by commas\
    \ after the name of the base class. The implementation of IShootable interface\
    \ could then look like:\n\n```cs\nusing UnityEngine;\nusing System;\n\npublic\
    \ class gun: MonoBehaviour, IShootable {\n\n    private WeaponController weaponController;\n\
    \n    void Awake () {\n        weaponController = gameObject.GetComponent<WeaponController>();\n\
    \    }\n\n    public void UseMe () {\n        weaponController.Switch(this);\n\
    \    }\n\n    public void Shoot () {\n        Debug.Log(\"Peng!\");\n    }\n}\n\
    ```\n\nThe individual areas of the script are not so important at the moment and\
    \ will be dealt with in more detail in the other chapters. Nevertheless, I would\
    \ like to anticipate what is actually happening here. As soon as the Awake method\
    \ is called, the script component WeaponController (whose code will be treated\
    \ in a moment) is searched for and assigned to a private variable. If the UseMe\
    \ method is now called, Gun's own script instance is transferred to the switch\
    \ method of the WeaponController. Finally, the Shoot method only writes the text\
    \ \"Peng\" into the Unity console for demonstration purposes.\n\n## Support from\
    \ MonoDevelop\n\nThe programming environment MonoDevelop helps you to implement\
    \ an interface. If you have written the implementation IShootable behind MonoBehaviour\
    \ in the example above, move your mouse pointer to IShootable and press the right\
    \ mouse button. In the context menu that appears, go to Refactor / Implement implicit.\
    \ Then all properties, methods, etc. are automatically added to your class. All\
    \ you have to do now is fill it with life. Of Course, you can then remove the\
    \ exception (error message) that is inserted by default.\n"
  mdcn: "\n\n面向对象编程的一个重要特性是继承的可能性。这意味着程序员可以开发一个新类，它可以使用另一个类的所有方法、变量等作为基础，而无需重写代码。这个新类被称为派生类（derived\
    \ class）。它所继承的类被称为基类（base class）。如果一个类现在要继承另一个类，在类名后写一个冒号，然后是基类的名称。\n\n```cs\n\
    public class MyScriptName: MonoBehaviour {\n\n//Code\n}\n```\n\n即使你可能自己并不经常使用继承，但这对作为\
    \ Unity 程序员的你来说非常重要的问题。Unity 中创建的类如果要作为组件使用，必须继承自 Unity 类 MonoBehaviour。这包含了类作为组件所需的所有内容。你可以在第\
    \ 4 章“脚本编程”中找到更多信息。\n\n## 基类与派生类\n\n在 C# 中，如果一个类要继承另一个类，必须在类名后写一个冒号，然后是基类的名称。假设我们有一个类\
    \ person，它有一个公共变量 `name` 和私有变量 `points`。\n\n```cs\npublic class person {\n\n \
    \   public string name = \"\";\n\n    private int points = 0;\n\n}\n```\n\n派生类\
    \ NPC 应该有一个额外的变量 `health`，那么它看起来如下：\n\n```cs\npublic class NPC: person {\n\n \
    \   public int health;\n}\n```\n\n现在你可以创建一个 NPC 类的对象，并使用这两个公共变量：\n\n```cs\nNPC\
    \ npc = new NPC ();\nnpc.name = \"Legolas\";\n```\n\n```cs\nnpc.health = 10;\n\
    ```\n\n## 继承与可见性\n\n即使在上面的示例中 NPC 类继承了基类 Person，我之前解释的可见性规则仍然适用。你不能在派生类中访问基类的私有变量或私有方法。如果你仍然想允许访问，可以使用\
    \ `protected` 关键字代替 `private` 来定义这些成员。\n\n```cs\npublic class person {\n    public\
    \ string name = \"\";\n    protected int points = 0;\n}\n```\n\n这意味着变量 `points`\
    \ 从外部来看仍然不可见，但在派生类 NPC 中可以访问。\n\n```cs\npublic class NPC: person {\n\n    public\
    \ int health;\n\n    public void DoSomething () {\n        points = 100;\n   \
    \ }\n}\n```\n\n## 重写继承的方法\n\n假设你有一个基础类 person，它除了各种变量和方法外，还有一个名为 `Shoot` 的方法。为了显示此功能，首先应该在控制台（console\
    \ 标签页）中输出一段短文本。你可以使用 `Debug.Log` 命令来实现。虽然 Person 类提供了标准文本 \"Peng!\"，但 NPC 类现在应该说一些不同的内容。为了实现这一点，C#\
    \ 提供了覆盖方法的可能。要做到这一点，被重写的方法必须先在基类中被声明为可重写的。这是通过 `virtual` 关键字实现的。\n\n```cs\npublic\
    \ class person {\n\n    public virtual void Shoot () {\n        Debug.Log(\"Peng!\"\
    );\n    }\n}\n```\n\n派生类可以（但不必）重写此方法。这里的关键字是 `override`。\n\n```cs\npublic class\
    \ NPC: person {\n\n    public override void Shoot () {\n        Debug.Log(\"Tie!\"\
    );\n    }\n}\n```\n\n## 访问基类\n\n如果你现在在派生类中重写了基类的方法，但现在想访问基类的方法，自然就产生了一个现在如何做的问题。这是通过\
    \ `base` 关键字实现的。你通过 `base` 访问基类的方法、变量等。\n\n```cs\npublic class NPC: person {\n\
    \    public override void shoot () {\n        base.Shoot();\n        Debug.Log(\"\
    Tie!\");\n    }\n}\n```\n\n## 密封类\n\n另一种继承的方法是通过密封。这意味着防止类的继承能力。换句话说，如果你在类定义前面加上\
    \ `sealed` 关键字，没有其他类可以继承自它。\n\n```cs\npublic sealed class NPC: person { // code\
    \ ... }\n```\n\n## 多态\n\n面向对象的编程语言提供了另一种实用的技能，称为多态。你可以以相同的方式处理所有具有共同基类的对象/实例。以下方法触发了传递对象的\
    \ `Shoot` 函数。脚本并不关心该对象实际上是 `Person` 类型还是派生自 `Person` 的类（例如上一个示例中的 NPC）。\n\n```cs\n\
    void LetsShoot (Person person) {\n    person.Shoot();\n}\n```\n\n向 LetsShoot 传递各种对象：\n\
    \n```cs\nPerson person = new person ();\nNPC npc = new NPC ();\nLetsShoot (person);\n\
    LetsShoot (npc);\n```\n\n## 接口\n\nC# 面向对象的另一个特性是接口。通过接口你可以定义不同类的共同特征，并借此再次对它们进行。这样你可以平等地对待不同的类，这在某些情况下非常有用。微软已经预定义了一些通用接口，这些对于某些功能也很重要，你也可以定义自己的接口。\n\
    \n## 定义接口\n\n要定义接口，使用 `interface` 关键字。按照惯例，接口名称始终以 `I` 开头，因此在上面的示例中它将是 `IShootable`。接口的其余部分类似于类，区别在于方法没有编写实现。\n\
    \n```cs\npublic interface IShootable {\n    void shoot();\n}\n```\n\n类和接口之间的重要区别涉及访问修饰符。在类中，所有没有访问修饰符的内容都是私有的，而接口被认为是内部的。毕竟，接口也用于描述类的外部影响。除了\
    \ `public` 之外，其他访问修饰符在接口中都是禁止的。\n\n## 实现接口\n\n如果一个类要实现接口，其方法与继承类相同，即使用冒号。如果既继承一个类又实现一个（或多个）接口，这些将用逗号列在基类名称之后。`IShootable`\
    \ 接口的实现如下：\n\n```cs\nusing UnityEngine;\nusing System;\n\npublic class gun: MonoBehaviour,\
    \ IShootable {\n\n    private WeaponController weaponController;\n\n    void Awake\
    \ () {\n        weaponController = gameObject.GetComponent<WeaponController>();\n\
    \    }\n\n    public void UseMe () {\n        weaponController.Switch(this);\n\
    \    }\n\n    public void Shoot () {\n        Debug.Log(\"Peng!\");\n    }\n}\n\
    ```\n\n脚本的各个区域目前并不重要，将在其他章节中详细讨论。尽管如此，我想预测这里实际上发生了什么。当 `Awake` 方法被调用时，将搜索并为 `WeaponController`\
    \ 脚本组件（其代码稍后处理）赋值。如果现在调用 `UseMe` 方法，Gun 自身的脚本实例将传递给 `WeaponController` 的 `switch`\
    \ 方法。最后，`Shoot` 方法仅向 Unity 控制台写入 \"Peng\" 用于演示。\n\n## MonoDevelop 支持\n\n编程环境 MonoDevelop\
    \ 帮助你实现接口。如果你在上面的示例中 `MonoBehaviour` 后面写了实现 `IShootable`，将指针移动到 `IShootable` 并点击右键。在出现的右菜单中，转到\
    \ Refactor / Implement implicit。然后所有的属性、方法等都会被自动添加到你的类中。你现在只需为它注入生命。当然，你现在可以删除默认插入的异常（错误消息）。\n\
    \n"
