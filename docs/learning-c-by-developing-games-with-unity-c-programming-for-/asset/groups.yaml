    \ (0, 1, 0);\n```\n\n```\ntransform.Translate (0, 10, 0);\n```\n\n## Add components\n\
    \nWant to add a new component at runtime a GameObject, you can run the method\
    \ AddComponent use of each GameObject offering. The following example adds a script\
    \ component own GameObject Health controllers and a Rigidbody to.\n\n```\ngameObject.AddComponent<HealthController\
    \ > ();\n```\n\n```\ngameObject.AddComponent<Rigidbody > ();\n```\n\n## Remove\
    \ components\n\nTo remove a component from a GameObject, use the Destroy method\
    \ as if you were destroying a GameObject . If you want to destroy your own script,\
    \ use the keyword this . Here, too, you can incorporate time delays using a second\
    \ parameter.\n\nDestroy (rigidbody); // destroy your rigid body\n\nDestroy ( this,\
    \ 2); // destroy your script instance with a 2 delay\n\n## Activate and deactivate\
    \ components\n\nInstead of removing a component completely straight away, it can\
    \ also make sense to just deactivate it. The advantage is that you can reactivate\
    \ it later. A classic example is light. The following example accesses the Light\
    \ component of your own GameObject and uses the logical negation operator (the\
    \ exclamation mark) to reverse the state of enabled. The effect is that the switched\
    \ on light is switched off and the light is switched on.\n\n```\nvoid Switch ()\
    \ {\n\nlight.enabled =! light.enabled;\n}\n```\n\n## Random values\n\nRandom values\
    \ are an important element in making games interesting. The application options\
    \ range from assigning a random parameter value such as strength to generating\
    \ and placing GameObjects to creating entire levels. For this, Unity offers the\
    \ Random class , which offers several interesting methods for generating random\
    \ values. The most common is the Range method . Please note that there are two\
    \ different versions.\n\n- Range for float values generates a random value that\
    \ lies between the start and the end value. The start and end values can also\
    \ be returned as results.\n- Range for int values generates a random value that\
    \ ranges from the start value, but must be smaller (!) Than the end value.\n\n\
    using UnityEngine;\n\nusing System.Collections;\n\n```\npublic class RandomXPosition:\
    \ MonoBehaviour {\n\nvoid Start () {\n\n    float xPos = Random.Range(0.0F, 5.0F);\n\
    \n    Vector3 pos = new Vector3 (xPos, 10.0);\n\n    transform.position = pos;\n\
    \n}\n}\n```\n"
  mdcn: "\n\n你可以通过标签（tag）来查找 GameObject。为此，`GameObject` 类提供了 `FindWithTag` 方法。如果场景中有多个带有此标签的\
