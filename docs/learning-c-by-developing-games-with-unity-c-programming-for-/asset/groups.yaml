    ```c\nconst float gravity = 9.8f;\n```\n\n## 枚举\n\n你可以使用枚举来创建易读的常量列表。听起来有点神秘的其实是非常实用的东西。假设你想保存一个棋子的状态。它有三种状态：站立、行走、跳跃。为了查询棋子的当前状态，你首先需要定义一个包含这三个值的枚举\
