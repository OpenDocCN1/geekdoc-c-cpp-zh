    \ below. Keep in mind that every script/ may have these methods, but they do not\
    \ have to be implemented. On the contrary, it is better to delete methods if they\
    \ are not filled with code. Because each of the following methods is called according\
    \ to the definitions and accordingly costs performance, even if they are empty.\n\
    \n# Update\n\nThe most important method in Unity is the Update method. Most of\
    \ the code is programmed here. Update runs throughout the game, each time before\
    \ a frame is rendered, that is, before a new frame is drawn on the monitor. Note\
    \ that the rendering times of the individual frames can vary. If you want to program\
    \ in update code that should be independent of frames, the values should be multiplied\
    \ again with the time value `deltaTime` of the Class. This value represents the\
    \ time between the last and the current frame. For example, if you add motion\
    \ directly to a GameObject using the Transform component. Each time Update is\
    \ called, the object is moved a little bit further. You can find out more about\
    \ Transform in Chapter 5, \"Objects in the Third Dimension\".\n\n```csharp\nvoid\
    \ Update () {\n    float speed = 20.0F;\n    float distance = speed * Time.deltaTime;\n\
    \    transform.Translate(Vector3.forward * distance);\n}\n```\n\n# FixedUpdate\n\
    \nThe FixedUpdate method is called in defined time intervals and should be used\
    \ if you Rigidbodys want to access (Rigidbodies are responsible for simulating\
    \ physical behavior). The background is that the Unity physics engine does not\
    \ work frame-based, but works in discrete time intervals, i.e. in fixed time periods.\
    \ Therefore, before each calculation of the physics in Unity, all FixedUpdate\
    \ methods are executed in the MonoBehaviour scripts. You can find out more about\
    \ physics in the chapter “Physics in Unity”. The following example adds a torque\
    \ to the rigid body of the object in every FixedUpdate call so that it rotates\
    \ around the Y axis.\n\n```csharp\nvoid FixedUpdate () {\n    rigidbody.AddTorque\
    \ (0, 2, 0);\n}\n```\n\n# Change time interval\n\nBy default, the time interval\
    \ in which FixedUpdate is called is 0.2 seconds. You can change this via Edit\
    \ / Project Settings / Time / Fixed Timestep.\n\n# Awake\n\nThis method is executed\
    \ once, when the script instance is loaded. When loading a scene, all objects\
    \ in the scene are initially initialized. Then the Awake methods of the individual\
    \ GameObjects are called in a random order. Since all GameObjects were initially\
    \ initialized, it is already possible to find other GameObjects and assign variables.\n\
    \n```csharp\nprivate GameObject cam;\n\nvoid Awake () {\n    cam = GameObject.FindWithTag(\"\
    MainCamera\");\n}\n```\n\n# begin\n\nThe Start method behaves similarly to Awake.\
    \ However, unlike Awake, this method is only carried out on active instances.\
    \ If a script instance is deactivated at the beginning and is later set to enabled,\
    \ Start is only called at that moment. In addition, the Start methods are only\
    \ called after all Awake methods have been executed, which makes it easy to control\
    \ the order of initialization and to delay certain executions. The following example\
    \ uses the FindWithTag method to find the player character for theirs Assign a\
    \ script instance of the HealthController class.\n\n```csharp\nprivate int playerHealth;\n\
    \nvoid Start () {\n    HealthController hc = GameObject.FindWithTag(\"Player\"\
    ).GetComponent<HealthController>();\n    playerHealth = hc.health;\n}\n```\n\n\
    # OnGUI\n\nThe OnGUI method is part of Unity's GUI system. In this method, user\
    \ input is triggered. Since Unity does not work frame-based, but rather event-based,\
    \ OnGUI is also called several times. You can find out more about GUI in the same.\n\
    \n```csharp\nvoid OnGUI () {\n    GUI.Label(new Rect (0,0,100,30), \"Hello World!\"\
    );\n}\n```\n\n# LateUpdate\n\nAnother method that is not used as often, but is\
    \ still important, is the LateUpdate method. This is carried out after all update\
    \ methods have been executed, before rendering. This method is therefore often\
    \ used, especially for camera scripts. If a camera tracks a target that is moved\
    \ in the update method, this could be added to one camera so it follows the player\
    \ all the time.\n\n```csharp\npublic Transform target;\n\nvoid LateUpdate () {\n\
    \    transform.LookAt(target.position);\n}\n```\n\n# Component programming\n\n\
    An important principle of Unity is that every GameObject has its own components.\
    \ So you are not programming a life management system that manages the health\
    \ of all opponents, but a script that only manages the health of an individual\
    \ opponent. This script is then added to each opponent, so that each opponent\
    \ has its own administration, and this principle can (and should) not be adhered\
    \ to in certain situations. But first of all, you should make sure that each GameObject\
    \ has its own components. Incidentally, this also makes a big difference in access\
    \ to the components.\n\n# Access GameObjects\n\nAccessing a component's own GameObject\
    \ is very easy. Simply use the lowercase variable gameObject for this. This makes\
    \ it very easy to access components of your own objects, which I will talk about\
    \ in a moment.\n\n```csharp\nOtherScript otherScript = gameObject.GetComponent<OtherScript>();\n\
    ```\n\nTo access other GameObjects, there are several methods that you can use\
    \ both at development time and runtime. The first method, which is also the most\
    \ gentle on performance, is the Inspector assignment, in which you create a public\
    \ variable to which you can drag and drop the other GameObject during development.\n\
    \n```csharp\npublic GameObject player;\n\nvoid Update () {\n    if (player !=\
    \ null) {\n        //Code...\n    }\n}\n```\n\nBut you can also access other GameObjects\
    \ at runtime. If you want to access them more often, make sure that you save them\
    \ in variables. This brings an enormous performance advantage, since Unity has\
    \ to run through all GameObjects of a scene in the worst case to find the right\
    \ one.\n\n"
