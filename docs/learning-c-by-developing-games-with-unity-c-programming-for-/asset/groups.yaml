  mdcn: "\n\n![](img/e263e4c2a46d978fb73216c778f3ec48_237_0.png)\n\n在相应转换的检查器（Inspector）中，现在存储了条件，当条件满足时，状态将从一个状态切换到另一个：\n\
    \n- 任意状态 -> Hit: Hit; The = FALSE。\n- 任意状态 -> Dying: Hit; The = TRUE。\n- Hit ->\
    \ Flying: Exit Time = 0.80。\n- Flying -> Attacking: Attack = TRUE。\n- Attacking\
    \ -> Flying: Attack = FALSE。\n\n现在你可以将动画机控制器（Animator Controller）分配给我们的“Bat”（蝙）预制体控制器的\
    \ Animator 组件。你可以使用场景中的“Bat”实例进行此操作，并在点击 *Apply* 之后将这些调整应用回预制体。由于动画没有向模型传递任何移动，你也可以在那里禁用\
    \ Apply Root Motion（应用根运动）。\n\n## 创建 NavMesh\n\n接下来，我们要为路径查找功能创建 NavMesh。要做到这一点，通过\
    \ Window / Navigation 打开导航窗口。现在，在导航窗口中使用导航静态专家（navigation static expert）标记场景中的所有静态对象。或者在相应\
    \ GameObject 的检查器中完全勾选静态标记（static tick）。在我们情况下，这应该是所有的“Wall”（墙）、“Floor”（地板）和“Ceiling”（天花板）对象，以及装饰对象“Create”和“Barrel”（桶）。\n\
    \n![](img/e263e4c2a46d978fb73216c778f3ec48_238_0.png)\n\n确保所有的“Gate”（门）对象及其子对象未声明为静态。否则，无论门开启关闭，它们将始终作为障碍进入路径计算。现在我们需要调整\
    \ NavMeshAgent beacon 选项页中的设置。\n\n- 将 radius（半径）设置为 0.6。\n- 将 Height（高度）设置为 1.4。\n\
    \n现在你可以使用 Bake 按钮创建 NavMesh。请确保在移动、删除或添加新的装饰物品后重新启动烘焙，以便重新计算 NavMesh。创建完成后，你将看到蓝色的\
    \ NavMesh。现在你可以检查是否漏了调用某个障碍静态标记，或错误地将移动部分定义为静态。\n\n## 识别周围环境和敌人\n\n一旦蝙蝠注意到我们的英雄，它就应该攻击他。为了实现这一点，我们想要编写一个名为\
    \ EnemySonar 的脚本，它会寻找玩家，但我们也希望这个脚本能确保蝙蝠不会撞到落闸门。毕竟，我们没有将落闸门（“gate”）标记为静态，这意味着整个对象不被视为路径计算的障碍物。如果你使用\
    \ Unity Pro，可以简单地为子对象“gate_01”配上 NavMeshObstacle 组件，并忽略脚本的这部分。Unity 将独立地处理落闸门。但如果你使用的是免费版本，我将展示如何在不使用该组件的情况下实现。这个脚本我们需要四个变量。第一个变量字段\
    \ `fieldOfView`（视野）表示 NPC 的视野范围，第二个变量 `obstacleDetected` 表示是否检测到障碍。第三个变量 `playerDetected`\
    \ 存储是否检测到玩家，最后我们需要一个存储“Player” GameObject 对象的变量。毕竟，脚本的作用就是恰好找到这个对象。\n\n```\npublic\
    \ float fieldOfView = 120;\npublic bool obstacleDetected = false;\npublic bool\
    \ playerDetected = false;\nprivate GameObject player;\n```\n\n对于我们的搜索过程，我们恰好需要一个想要调用的方法\
    \ `Searching`。在此中，我们想要使用射线检测（raycast）搜索玩家。然而，由于这种计算非常密集，且帧数会影响游戏中许多对手的性能，我们只想每半秒执行一次此过程。为此，我们在\
    \ `Start` 方法中使用 `InvokeRepeating` 命令启动此方法，并在那里我们也定义了重复节奏。如果你想更改间隔，可以轻松地设置。\n\n\
    ```go\nvoid start () {\n    player = GameObject.FindGameObjectWithTag(\"Player\"\
    );\n    InvokeRepeating(\"Searching\", 0.5F, 0.5F);\n}\n```\n\n在 `Searching` 方法中，我们现在从自己的位置向玩家位置发送一条射线检测（我们已经在\
    \ `Start` 方法中完成了变量赋值）。如果之间没有障碍，我们现在检查角度是否在 `fieldOfView` 的帧范围内。如果是这种情况，我们就调用 `StopSearching`\
    \ 方法，将 `playerDetected` 变量设置为 TRUE，并停止 `Searching` 方法。因为一旦对手发现了“玩家”，它就应该跟随玩家，即使玩家消失在转角处不再被\
    \ NPC 看到。为了能从另一个脚本中断搜索过程，我们立即将 `StopSearching` 创建为一个公开可见的方法。\n\n```go\nvoid Searching\
    \ () {\n    Vector3 direction = player.transform.position - transform.position;\n\
    \    Ray ray = new Ray(transform.position, direction.normalized);\n    RaycastHit\
    \ hit;\n    if (Physics.Raycast(ray, out hit, 5)) {\n        if (hit.collider.gameObject\
    \ == player) {\n            Vector3 dir = hit.transform.position;\n          \
    \  float angle = Vector3.Angle(dir, transform.forward);\n            if (angle\
    \ < fieldOfView * 0.5f)\n                StopSearching();\n        }\n    }\n\
    }\n```\n\n```go\nvoid StopSearching () {\n    playerDetected = true;\n    CancelInvoke(\"\
    Searching\");\n}\n```\n\n现在我们到了需要与门检查的部分。由于是这种情况，我们将变量设置为 TRUE。如果门在移动，我们将变量 设置为\
    \ FALSE。\n\n```go\nvoid OnTriggerEnter (Collider other) {\n    if (other.gameObject.CompareTag(\"\
    Door\")) {\n        obstacleDetected = true;\n    }\n}\nvoid OnTriggerExit (Collider\
    \ other) {\n    if (other.gameObject.CompareTag(\"Door\")) {\n        obstacleDetected\
    \ = false;\n    }\n}\n```\n\n当然，这个解决方案有些缺点，但目前它应该是优雅的，配合 NavMeshObstacle 或另一个路径系统。下面的列表了完整的\
    \ EnemySonar 脚本，你需要将其分配给蝙预制体。\n\n```go\nusing UnityEngine;\nusing System.Collections;\n\
    public class EnemySonar : MonoBehaviour {\n    public float fieldOfView = 120;\n\
    \    public bool obstacleDetected = false;\n    public bool playerDetected = false;\n\
    \    private GameObject player;\n    void start () {\n        player = GameObject.FindGameObjectWithTag(\"\
    Player\");\n        InvokeRepeating(\"Searching\", 0.5F, 0.5F);\n    }\n\n   \
