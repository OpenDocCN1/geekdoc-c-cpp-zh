  mdcn: "\n\n![](img/e263e4c2a46d978fb73216c778f3ec48_213_0.png)\n\n最后，是渲染器模块，我们将渲染模式设置为网格（mesh）。现在我们在\
    \ Mesh (\"stone\") 下选择石头的模型的网格。现在重要的是，你还要选择关联材质。\n\n| Renderer | | |\n|---|---|---|\n\
    | Render Mode | stone | |\n| Material | placeables_01_diff | |\n| Sort Mode |\
    \ None | |\n| Sorting Fudge | 0 | |\n| Cast Shadows | ✓ | |\n| Receive Shadows\
    \ | ✓ | |\n| Max Particle Size | 0.5 | |\n\n粒子效果已经就绪了。现在，你只需要在粒子系统的检查器中点击 Apply，将所做的设置应用到制体（prefab）中。最后，石头不仅应该在视觉上爆炸，还要在听上重现这种效果。为了做到，请在\
    \ GameObject 上添加你自己的 AudioSource，激活 Play On Awake 并取消激活 Loop。现在将音频片段 \"stoneCrash\"\
    \ 赋值给它。为了使用粒子系统 GameObject，将此制体分配给 \"ThrowingStone\" 制体中 StoneBehaviour 脚本的 destroyedGo\
    \ 变量。\n\n## 创建任务\n\n这一部分关于玩家必须解决的实际任务。在我们的游戏中，玩家应该找到一个水容器，用来接滴落的水。为了解决这个任务（也称为任务），他仍然必须完成子任务并与对手战斗。\n\
    \n## 管理经验值\n\n为了击败对手并完成任务，玩家最后还应该获得经验值。因此，我们想首先创建一个名为 EPController 的小脚本，它用来管理这些经验值并在\
    \ GUI 中显示它们。你将此脚本分配给 \"Game Controller\"，它已经拥有了 LifePoint 控制器。对于这些功能，我们总共需要两个变量：一个存储\
