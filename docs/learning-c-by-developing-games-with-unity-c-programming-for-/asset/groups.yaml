    and reset it to the default values with Reset . Now rotate the Floor instance
    to (-90,0,0) so that it is positioned like a floor slab. And now we have the first
    base plate ready, copy this plate as often as you like and place it side by side.
    It is easiest to always copy a single disk, e.g. B with [Ctrl] + [D] , and this
    immediately to the new position, z. B. (0,0,2), before you take on the next floor
    plate. I would always do the repositioning via the position parameters in the
    Inspector, as this is the fastest and most accurate. In this way, you'
