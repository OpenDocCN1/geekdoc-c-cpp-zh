  - '[PAGE 159]


    # Create an inventory system


    Core element of most role-playing games is an inventory system that is used to
    manage items that the hero finds in the course of the game. Most of the time it
    also plays an important role in solving quests, where it is often about finding
    certain items and taking them to a person or a specific place. In our example
    game, too, the player will have to find various items that will ultimately be
    managed with this inventory system.


    # Management logic


    An object of the generic class Dictionary <TKey, TValue>, which already got to
    know in the chapter "C # and Unity", should serve as the core element of our inventory
    system. A dictionary manages so-called key-value pairs. Each data record has a
    unique identifier, the value of which can be changed as required. In our case,
    this means that the name of the item could be used as the key and the number of
    individual items is taken as the value. If a new inventory item is added to the
    dictionary, you simply need to increase the value of the respective key by one.
    I already presented such an example in the "C # and Unity" chapter.


    # ItemProperties


    In our case, we want to go a little further. Because we don''t just want to count
    the items, we also want to display them in the GUI of our game. For this we need
    another value that must be saved in the dictionary, namely the graphic associated
    with the object. For this reason, we cannot simply take the number as a value,
    but we have to create our own type that contains both the number and the'
