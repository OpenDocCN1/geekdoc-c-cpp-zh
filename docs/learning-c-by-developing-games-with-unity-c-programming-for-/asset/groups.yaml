    \ You can also delete these methods if necessary. You can also change or completely\
    \ remove the inheritance. Only then are these classes logically no usable as components.\n\
    \n# Unity's event methods\n\nYou now know how to script in Unity. Now the question\
    \ remains when the code in these scripts will actually be executed. The procedure\
