    # # syntax


    First of all, a few words about basic programming: Program code (also called source
    code) consists of lines of code that are processed one after the other. So that
    the computer also understands these lines, they are translated into machine language
    with a program called compiler, the so-called compiling. So that the compiler
    also knows when the end of a single line of code is reached, a semicolon is added
    to the end in C #; written. Other important characters in C # are the curly braces
    {}. These are used to identify coherent blocks of code.


    # # Comments


    In addition to the actual code, you may also want to add annotations to your code
    that are not meant to be run by the computer. Such lines that are not to be executed
    are also called comments. Mark a comment with a double slash //. Anything behind
    it until the next line break is considered non-executable code. What is in this
    line before the double slash is considered executable!


