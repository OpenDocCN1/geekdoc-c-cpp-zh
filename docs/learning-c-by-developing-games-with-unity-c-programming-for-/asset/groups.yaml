    # INTRODUCTION


    Unity is a cross-platform development platform initially created for developing
    games but is now used for a wide range of things such as: architecture, art, children''s
    apps, information management, education, entertainment, marketing, medical, military,
    physical installations, simulations, training, and many more.


    Unity takes a lot of the complexities of developing games and similar interactive
    experiences and looks after them behind the scenes so people can get on designing
    and developing their games. These complexities include graphics rendering, world
    physics and compiling. More advanced users can interact and adapt them as needed
    for beginners they need not worry about it. Games in Unity are developed in two
    halves; the first half -within the Unity editor, and the second half -using code,
    specifically C#. Unity is bundled with MonoDev Visual Studio 2015 Community for
    writing C#.


    # 2D OR 3D PROJECTS


    Unity is equally suited to creating both 2D and 3D games. But what''s the difference?
    When you create a new project in Unity, you have the choice to start in 2D or
    3D mode. You may already know what you want to build, but there are a few subtle
    points that may affect which mode you choose. The choice between starting in 2D
    or 3D mode determines some settings for the Unity Editor - such as whether images
    are imported as textures or sprites. Don''t worry about making the wrong choice
    though, you can swap between 2D or 3D mode at any time regardless of the mode
    you set when you created your project. Here are some guidelines which should help
    you choose.


    # Full 3D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_21_0.png)


    3D games usually make use of three-dimensional geometry, with materials and textures
    rendered on the surface of these objects to make them appear as solid environments,
    characters and objects that move in and around the scene freely, with light and
    shadows cast around the world in a realistic way. 3D games usually render the
    scene using perspective, so objects appear larger on screen as they get closer
    to the camera. For all games that fit this description, start in 3D mode.


    # Orthographic 3D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_21_1.png)


    Sometimes games use 3D geometry, but use an orthographic camera instead of perspective.
    This is a common technique used in games which give you a bird''s-eye view of
    the action, and is sometimes called “2.5D”. If you''re making a game like this,
    you should also use the editor in 3D mode, because even though there is no perspective,
    you will still be working with 3D models and assets. You''ll need to switch your
    camera and scene view to Orthographic though.(scenes above from Synty Studios
    and BITGEM)


    # Full 2D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_22_0.png)


    Many 2D games use flat graphics, sometimes called sprites, which have no three-dimensional
    geometry at all. They are drawn to the screen as flat images, and the game''s
    camera has no perspective. For this type of game, you should start the editor
    in 2D mode.


