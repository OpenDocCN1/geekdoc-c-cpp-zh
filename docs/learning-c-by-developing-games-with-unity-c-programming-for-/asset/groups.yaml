    \n## Place and configure objects\n\nNow you can define the starting point of the\
    \ hero in your dungeon and place all objects of the quest and sub-quest in such\
    \ a way that a playable plot arises from it (see Figure 21.21). In addition to\
    \ the “BucketEmpty” water container prefab, this also includes the “IronKey” key\
    \ prefab. Both should already have the necessary InventoryItem scripts with the\
    \ respective IDs. You also need an instance of the “Gate” prefab to display the\
    \ locked gate (isLocked is TRUE). You can also place multiple gates in your dungeon,\
    \ e.g. are not locked. Set IsLocked to FALSE for these gates.\n\n![](img/e263e4c2a46d978fb73216c778f3ec48_230_0.png)\n\
    \nWhen you have done this, you can now start your game and test whether all objects\
    \ actually react the way you want them. Make sure that the game-relevant objects\
    \ are all clearly visible and clickable in the game. With a rigid camera like\
    \ the one we are using here, it is best to position such objects at eye level\
    \ or camera level. Use decorative objects such as wooden boxes or barrels to place\
    \ the game-relevant objects on them, or you can make these objects more conspicuous\
    \ so that they can be seen more easily. So you can e.g. through the use of special\
    \ shaders or cleverly placed light sources, the objects present and more eye-catching.\n\
    \n![](img/e263e4c2a46d978fb73216c778f3ec48_231_0.png)\n\nFor this reason, in Figure\
    \ 21.23, a Point Light child object was added to the key on the left motif, which\
    \ was positioned just above the key. So that this does not illuminate the surroundings\
