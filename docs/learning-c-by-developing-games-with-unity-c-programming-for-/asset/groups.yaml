    ```\nvoid DestroyPlayer () {\n    GameObject player;\n}\n```\n\n```\nplayer =\
    \ GameObject.FindWithTag(\"Player\");\n\nDestroy (player);\n\n}\n```\n\nYou can\
    \ also give the Destroy method a float parameter that delays the destruction by\
    \ the respective seconds.\n\nDestroy (player, 2.5F);\n\n## Create GameObjects\n\
    \nMost of the time you will create GameObjects via the main menu with prefabs\
    \ (see chapter \" Prefabs ). But of course you can also create completely new\
    \ GameObjects at runtime. You do do this by creating a new instance of the GameObject\
    \ class in the normal C # way. It does not matter whether the instance is a local\
    \ or global variable or which access modifier it has. Since each GameObject Default\
    \ initially has the name \"New GameObject\", you can also give your GameObject\
    \ a name when you instantiate it.\n\n```\nGameObject go = new GameObject ( );\n\
    ```\n\n```\nGameObject go2 = new GameObject ( \"My Name\");\n```\n\n## Access\
    \ components\n\nThere are several ways to access components. The easiest way to\
    \ access components of other GameObjects is to declare a public variable of the\
    \ type of the component to which you drag the component's GameObject during development.\
    \ The variable then does not refer to the GameObject, but to the component of\
    \ the GameObject. If the GameObject does not have this component, the content\
    \ of the variable is null, i.e. empty.\n\n```\npublic transform player;\n\nvoid\
    \ Start () {\n    if ( player != null)\n        player.position = Vector3.zero;\n\
    }\n```\n\n## GetComponent\n\nEach GameObject has the GetComponent method , with\
    \ which you can access all components of the respective GameObject. If you write\
    \ this call without a GameObject, the method looks for this component in your\
    \ own GameObject. The following example searches for the HealthController of the\
    \ player as well as its own and assigns two different variables in order to use\
    \ them later.\n\nHealthController playerHc;\n\nHealthController myHc;\n\n```\n\
    void Awake ( ) {\n    GameObject player;\n\n    player = GameObject.FindWithTag(\"\
    Player\");\n\n    playerHc = player.GetComponent<HealthController>();\n\n    myHc\
    \ = GetComponent<HealthController > ();\n}\n\nvoid Update () {\n    if (playerHc.health>\
    \ 0) {\n    //Code...\n}\n}\n```\n\n## Reduce traffic\n\nBe sure to reduce GetComponent\
    \ accesses as much as possible. For more frequent access, save the components\
    \ in variables instead.\n\n## SendMessage\n\nA very interesting way to call a\
    \ method is the SendMessage method . SendMessage is provided by the GameObject\
    \ class and runs through all MonoBehaviour scripts of the GameObject, calling\
    \ every method with this name. So you don't even need to know which script it\
    \ is in. Optionally, you can also give SendMessage a transfer parameter as well\
    \ as an option parameter of the type SendMessageOptions . The latter determines\
    \ whether a recipient method is absolutely necessary or not. If one is necessary,\
    \ but none is found, an error is triggered.\n\nThe following example script could\
    \ be attached to any weapon or trap with a collider to cause damage on contact.\
    \ The script tries to call a method called ApplyDamage in the other GameObject\
    \ and transfer the damage value 1 to it. For this purpose, the GameObject of the\
    \ passed collision parameter is accessed and SendMessage is called.\n\nusing UnityEngine;\n\
    \nusing System.Collections;\n\n```\npublic class damage: MonoBehaviour {\n   \
    \ public float amount = 1;\n\n    void OnCollisionEnter( Collision collision)\
    \ {\n        collision.gameObject.SendMessage(\"ApplyDamage\", amount,\n     \
    \   SendMessageOptions.DontRequireReceiver); \n    }\n}\n```\n\nThe DontRequireReceiver\
    \ parameter states that no receiver is necessary. This means that no error is\
    \ triggered if the target object does not have a script using this method. You\
    \ can find out about collisions in the chapter “Physics in Unity”.\n\n## Variable\
    \ access\n\nIf you want to access components of your own GameObjects, Unity offers\
