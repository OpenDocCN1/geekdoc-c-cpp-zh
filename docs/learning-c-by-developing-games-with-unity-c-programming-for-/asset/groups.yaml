    ## 创建简单的 3D 游戏


    现在你已经学习了 Unity 的基础知识，让我们把这些知识应用到游戏中。为此，你将在附带的 DVD 上找到一个示例游戏，它应该有三个版本：


    - 空示例游戏（Empty example game）：该项目仅包含各种资产，如 3D 模型、纹理、音频文件等。

    - 模板示例游戏（Template ExampleGame）：除了资产外，还包含一个具有预定义关设计的场景，本章后面的描述正是针对此定制的。

    - 示例游戏（Example game）：作为演示对象，展示示例游戏最终应该是什么。


    在这个示例游戏的背景下，我们想要开发一个小型地下城迷宫（dungeon crawler）类角色扮演3D 游戏。这种类型主要关于解决墙壁（地下城）中的谜题以及战斗敌
    NPC。由于这里可以使用许多不同的技术，因此这是一个非常好的说明示例。开发一个完整的地下城迷宫将稍微超出范围范围，因此我们在这里只处理单个任务，即玩家必须解决的一个任务。在这种情况下，目标是找到一个容器来收集掉落的饮料。在寻找这个容器时，玩家会遇到需要战斗的敌人蝙蝠和需要打开的锁门。我们将首先使用
    `GUIElements`（`GUitexture`、`UIText`）和 `OnGUI` 编程来实现 GUI。最后有一个额外章节，我将回顾为了使用从 4.6
    版本开始提供的新 uGUI 控制需要更改的内容，因为我在写这本书时只写了新控件的测试版本，而我想和你一起开发一个可运行的示例，示例最初将基于传统的 GUI
    技术。一旦新的 uGUI 系统正式发布，我将在我的博客上为你提供第二个版本供下载，该版本将使用新的 uGUI 控制。你可以在本书的“引言”部分找到更多信息。


    ![](img/e263e4c2a46d978fb73216c778f3ec48_145_0.png)


    ## 备份副本和版本管理


    在开发游戏时，你当然应该定期保存项目。建议再次复制项目的中间状态，并将其备份保存到另一个目录（甚至是外部存储）中。不一定非要等到硬盘崩溃，例如某次更改不符合你的预期就足够了。在这种情况下，如果你可以轻松地切换回之前的状态将是非常有利的。为此还有专门的软件，即所谓的版本管理软件（版本控制系统），来承担这项任务。通过复制项目，你也可以简单地手动这样做。


    ## 关卡设计


    即使其他章节引用模板项目，我仍然想在下面简要说明你如何使用各种 3D 模型来自己设计关卡。


    如果你想使用自己设计的 3D 模型，你必须首先将 FBX 文件、纹理等导入到项目。。通过将它们拖放到项目的 Project Browser（项目浏览器）中可以很容易实现。最好使用自己的文件夹在
    Project Browser 中对不同的资产类型进行分类和跟踪，例如“Materials”（材质）“Models”（模型）“Scenes”（场景）等。你也会在示例游戏中找到这些。


    ![](img/e263e4c2a46d978fb73216c778f3ec48_146_0.png)


    ## 通用导入设置


    对于提供的模型和纹理，你应该在任何地方都使用以下导入设置：


    - Model / Scale Factor: 1

    - Model / Generate Colliders: deactivate（取消）

    - Animations / Import animation: deactivate（取消）


    然而，由于某些模型需要特殊设置，我们稍后将进行调整。


    ## bat_03 导入设置


    蝙蝠模型“bat_03”有自己的动画。因此，在模型的导入设置中也必须进行以下设置：


    - Animations / Import Animations: activate（激活）


