    接下来我们要为墙创建一个制体：


    4. 将“torch_01”和“torch_holder_01”对象拖入场景

    5. 将“torch_01”作为“torch_holder_01”的子对象，并放置在 (0,0,0.13)。

    6. 现在将“torch_holder_01”对象拖入 Prefabs 文件夹并重命名为“Torch”。


    ## Wall_Torch 制体


    现在我们想要创建一个第二个墙制体，它也有墙火炬。


    1. 复制制体“Wall”并重命名为“Wall_Torch”。

