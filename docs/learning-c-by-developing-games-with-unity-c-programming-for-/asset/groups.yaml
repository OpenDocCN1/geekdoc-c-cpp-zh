    ## Syntax error


    If you have a syntax error in a script, e.g. for example if you have forgotten
    a semicolon ("parsing error") or use a non-instantiated variable, Unity will display
    an error message after you save this incorrect script. This appears both at the
    bottom of the Unity window and in the console (console tab). If you click on this
    message, MonoDevelop will open and you will get to where the error occurs.


    ![](img/e263e4c2a46d978fb73216c778f3ec48_94_0.png)


    ## Forwarding of error messages


    Clicking on the error message in the console does not always lead to the location
    where the developer made the programming error.


    Should you e.g. for example if you forget a semicolon at the end of a line, the
    compiler may only recognize the next line as faulty, since the (previous) line
    of code has not yet been completed and this new command must not appear at this
    point. Especially for beginners, this times leads to long error searches because
    the error can be found somewhere else than it is displayed.


    ## Usable programming languages


    When programming scripts, you can choose between the programming languages JavaScript,
    Boo and C#. While you can mix the languages in a Unity project any amount (not
    within a script!), it is recommended, as far as it goes toward avoiding. An itself
    is the language of mixing within a project not a problem. But once you try to
    access another from one script, it can become problematic. I''ll get to the details
    in Section 4.14, “Compilation Order”. Therefore, as far as possible, I recommend
    restricting yourself to one language within a project.


    ## Why C#?


    As you will have noticed, I use the language C# in this book. Initially, Unity
    focused on the JavaScript language. However, this has changed significantly over
    time, so that C# is now the focus. C# offers more functionalities and is also
    more widespread than the JavaScript branch specially adapted for Unity, also often
    called UnityScript


    ## Unity''s instance structure


    As I mentioned in the previous chapter "C# and Unity", all scripts that are to
    be used as components must inherit from the MonoBehaviour class. However, this
    class inherits from another class. In the end, components and GameObjects even
    have the same origin, namely the Object class from the Namespace UnityEngine.
    Figure 4.3 shows the relationships between the most important classes of the Namespace
    Unity engine in a class diagram. The arrows always point from the derived class
    to the respective base class.


    ![](img/e263e4c2a46d978fb73216c778f3ec48_97_0.png)


    ## Object


    Object is the parent base class of all objects in Unity. It provides some fundamental
    properties and methods, such as for example, the static method Destroy to destroy
    an object or the method DontDestroyOnLoad, which I will explain in this chapter.
    The classes GameObject, Component and ScriptableObject are derived from this class.
    For more experienced C# developers, it should be pointed out again that this is
    a Unity object class, not the one provided by the framework NET class.


    ## GameObject


    GameObject inherits directly from Object is the base class of all objects in a
    scene Unity. Most GameObjects are via the main menu GameObject created in the
    editor. If you want to create GameObject instances by code


    ## ScriptableObject


    ScriptableObject also inherits directly from Object. First of all, ScriptableObjects
    are common scripts that inherit from ScriptableObject and are usually used to
    store large amounts of data. Instances of these classes are created with the static
    method CreateInstance of the ScriptableObject class and can be created at runtime
    as well as at development time. ScriptableObjects are used more in special situations,
    e.g. to create data containers that can be stored outside of a scene, configured
    and read in if required.


    ## Component


    The Component class also inherits from Object and is the basis of all classes
    that can be attached to a GameObject. That is why they are created by adding them
    to the respective instance using the GameObject method AddComponent. Other important
    classes inherit from Component, of which I would like to give the Transform and
    Behavior classes as examples. Because in Unity all of them are derived from Component
    Classes as components are often referred to in German as "components".


    ## Transform


    The Transform class inherits from Component and is added to every GameObject in
    a scene by default. Only if you create a GameObject with code does it not automatically
    have a transform component. In turn, the class RectTransform inherits from Transform,
    which is used by the uGUI system in the GUI design.


    ## Behavior


    The Behavior class inherits from the Component class. Classes that inherit from
    Behavior are also known as Behaviors or also generally as Components/Components
    and can be switched on and off via the enabled property. Examples of classes that
    are derived from Behaviors are Light or NavMeshAgent which I will talk about in
    the other chapters. Finally, the MonoBehaviour class also inherited from Behavior.


    ## MonoBehaviour


    The class MonoBehaviour is the base class of all script classes in Unity that
    are to be used as components and can be attached to a GameObject. Even if MonoBehaviour
    inherits from Behavior, you have to keep in mind with a deactivated enabled property
    only that Execution of methods Start, Awake and OnGUI is prevented. Other methods
    can still be called and executed, like OnTriggerEnter or OnCollisionEnter.


    ## Create scripts


    In Unity, each script contains exactly one class. The name of the script is always
    the same as that of the class. Otherwise there will be an error later if you want
    to use this. Therefore, when choosing the name of the script, the following also
    applies: do not use spaces or special characters. To create a script, do one of
    the following:


    - You use the main menu Assets / Create and select the desired script type (in
    our case C# Script).

    - You use the Create menu of the Project Browser (located above), where you can
    also find the script types.

    - You use the context menu of the Project Browser, which you can access with the
    right button. You can also find the script types there via the Create menu.

    - You use the New Script option of the Add Component button in the Inspector.
    As as you select a GameObject in the hierarchy, you will find it among all added
    components of the GameObject. The script is created by default in the root of
    the project browser and attached to the selected GameObject.


    Double-clicking on the created script opens it in the standard development environment
    MonoDevelop.


    ## Rename scripts


    If you subsequently change the name of a script in the project browser or in the
    script itself, the counterpart must always be changed at the same time. If they
    differ, be it only case-sensitive, there will be an error later or you simply
    cannot add it to a GameObject. Therefore, use the rename functionality in MonoDevelop
    at best when renaming. This not only renames the class, but also the script and
    all integrations of the script in the project. You can access this function with
    the right button Refactor / Rename as soon as you have positioned the cursor in
    the class name. The Rename function also makes sense if you want to rename related
    variables. In this case, too, all positions where you have already used them will
    be renamed.


    If you rename a script that has already been attached to a GameObject, you may
    find an entry "Missing (MonoBehaviour)" instead of the script after renaming.
    In such a situation, delete this entry and add your renamed script again. The
    easiest way to delete this entry is to use the Remove Component function in the
    context menu of the component (symbolized by the gear in the Inspector).

