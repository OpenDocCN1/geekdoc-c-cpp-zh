    ## Execution order


    Sometimes it is important to make sure that one script is executed before the
    other, with two scripts you can often still use Update and LateUpdate, but with
    three scripts this is no longer possible. For this there are the Script Execution
    Order Settings, which you can find under Edit / Project Settings / Script Execution
    Order.


    ![](img/e263e4c2a46d978fb73216c778f3ec48_142_0.png)


    You can add a script by clicking the plus sign. You can then leave the script
    there or drag it up and change the time value. The scripts are then processed
    from top to bottom. All scripts not defined here are called in the Default Time
    area in a random order.


    ## CHAPTER 3


    ## Create a simple 3d game


    Now that you have learned the basics of Unity, let''s put this knowledge into
    practice in a game. For this you will find an example game on the enclosed DVD,
    which should be available in three different versions:


    - Empty example game: This project only contains the various assets as the 3D
    models, textures, sound files, etc.

    - Template ExampleGame: In addition to the assets, this also has a scene with
    a predefined level design, to which the later descriptions in this chapter are
    tailored.

    - Example game: This serves as a demonstration object and shows the example game
    how it should look in the end.


    In the context of this example game, we want to develop a small, role-playing
    3D game from the dungeon crawler genre. This genre is mostly about solving puzzles
    in a wall (dungeon) and fighting hostile NPCs. Since a lot of different techniques
    can be used here, this is very good as an illustrative example. Developing a complete
    dungeon crawler would course go a little beyond the scope, which is why we will
    only deal with a single quest here, i.e. with a task, that the player has to solve.
    In this case, the aim is to find a container to collect dropping drinking water.
    When searching for this container, the player will come across both enemy bats
    to fight and locked gates to be opened. That we will first implement the GUI with
    GUIElements (GUitexture, UIText) and OnGUI programming. At the end there is an
    additional section in which I go back to what needs to be changed in order to
    use the new uGUI controls that are available from version 4.6, because I only
    wrote beta versions of the new ones while writing the book uGUI objects and I
    would like to develop a working example with you, the example will initially be
    based on the conventional GUI techniques. As soon as the new uGUI system is officially
    available, I will offer you a second variant for download on my blog, which then
    uses the new uGUI controls. You can find more information about this in the "Introduction"
    of this book.


    ![](img/e263e4c2a46d978fb73216c778f3ec48_145_0.png)


    ## Backup copies and version management


    When developing a game, you should of course save your project at regular intervals.
    It is also advisable to copy the intermediate status of your project again and
    to save it as a backup in another directory (or even external). It doesn''t always
    have to be a disk crash, it''s enough that z. B a change does not what you imagined.
    Then it is advantageous if you can easily switch back to a previous status. For
    this purpose there is also extra software, so-called version management software
    (Version Control System), which takes on this task. By copying your project, you
    can also do this manually in a simple way.


    ## Level design


    Even if the other sections refer to the template project, I would like to explain
    briefly below how you can use the various 3D models to design a level yourself.


    If you want to use your own designed 3D models, you must of course first import
    FBX files, textures etc. into your project. This is very easy to do by dragging
    and dropping it into the project''s Project Browser. It is best to use your own
    folder to sort the various asset types in the Project Browser and to keep track
    of things. B."Materials", "Models", "Scenes" etc. You will also find these in
    the example game.


    ![](img/e263e4c2a46d978fb73216c778f3ec48_146_0.png)


    ## General import settings


    With the supplied models and textures, you should always use the following import
    settings everywhere:


    - Model / Scale Factor: 1

    - Model / Generate Colliders: deactivate

    - Animations / Import animation: deactivate


    However, since some models require special settings, we will now adjust them later.


    ## bat_03 Import Settings


    The bat model "bat_03" has its own animations. Therefore, the following settings
    must also be made in the import settings of the model:


    - Animations / Import Animations: activate


    ## Import settings


    The model of the wooden box "crate_01" is larger in scale. So that we can also
    benefit from dynamic batching (see chapter) "Troubleshooting and Performance")
    with this model, we are not allowed to scale the model in the scene afterwards.
    That''s we''re already changing the scaling when importing. Otherwise, the remaining
    settings remain the same as for the "General Import Settings"


    - Model / Scale Factor: 0.25


    ## stone_01 Import Settings


    We also want to adjust the size of the 3D model of the stone when importing it.
    In addition, we want to make the edges of the model a little softer, which is
    why we recalculate the normals within Unity and adjust them using Smoothing Angle.
    The rest is set as explained in the section "General Import Settings"


    - Model / Scale Factor: 0.1

    - Model / Normals Calculate: activate

    - Model / Smoothing Angle: 100


    ## floor_01 Import Settings


    So that our player can walk on the floor, we want to automatically add a collider
    to the floor model "floor_01". Of course there are other options, but in this
    case we want to work with the automatically generated colliders.


    - Model / Generate Colliders: activate


    ## Assign material


    When importing the FBX files, the associated material is usually created. You
    can also import textures and assign materials to them. You also have to select
    materials.


    - Materials that have normal maps use the "Bumped Diffuse" shader

    - For textures, select the "Diffuse" shader


    ## Create prefabs


    Instead of dragging the models into the scene, we want to create prefabs from
    the models. If we did not proceed in this way, we would have to equip each model
    instance.


    ## Wall Prefab


    For our walls we create a prefab called "Wall":


    1. Drag the "wall_01" model into the scene.

    2. Add a box collider to the model.

    3. Drag the model into "Prefabs" folder and rename it to "Wall".


    ## Torch Prefab


    Next we want to create a prefab for the wall:


    4. Drag the objects "torch_01" and "torch_holder_01" into the scene

    5. Assign the "torch_01" to the torch holder "torch_holder_01" as a child object
    and position the torch on (0,0,0.13).

    6. Now drag "torch_holder_01" object into "Prefabs" folder and rename it to "Torch".


    ![](img/e263e4c2a46d978fb73216c778f3ec48_149_0.png)


    ## Wall_Torch Prefab


    Now we want to create a second wall prefab, which, however, also has the wall
    torch.


    1. Copy the prefab "Wall" and rename it to "Wall_Torch".

    2. Now drag "Wall_Torch" and "Torch" into the scene and add "Torch" as a child
    object of "Wall_Torch".

    3. Rotate Torch to (-90,90,0). Next we want to position the torch holder on the
    wooden surface using the vertex snapping:


    4. To do this, mark "Wall_Torch" and press the [V] key. You can select a vertex
    of the object by moving the mouse.

    5. If you now have a vertex on the outer edge of the holder, press the left mouse
    button and slide the torch towards the wall. The torch will jump to the wall and
    place it on a vertex of Wall. Presumably this will be somewhere on the edge of
    the wall. It is important here that this is outside, so that the torch is not
    in the wall, but We don''t want to achieve more with this and you can release
    the mouse button and [V] again. When you have positioned the torch holder on the
    outer surface, you only need to manually position “Torch” on the middle wooden
    beam. Therefore, change from “ Torch "manually set the X position to" 1 "and the
    Y position to" -1 ".

    6. Then confirm the changes with Apply so that the "Wall_Torch" prefab accepts
    all changes.

