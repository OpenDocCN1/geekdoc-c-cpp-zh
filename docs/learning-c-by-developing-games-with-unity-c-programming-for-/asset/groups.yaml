    \ `IShootable` 接口并因此具有 `shoot` 函数，任何类都可以传递给 `Switch`。\n\n```csharp\nusing UnityEngine;\n\
    \nusing System.Collections;\n\npublic class WeaponController : MonoBehaviour\n\
    {\n    public IShootable weapon;\n\n    public void switch(IShootable newWeapon)\n\
    \    {\n        weapon = newWeapon;\n    }\n\n    public void ShootCurrentWeapon()\
    \ \n    {\n        weapon.Shoot();\n    }\n}\n```\n\n# 命名空间\n\n如果我们在本书末尾开发这个演示游戏，你会发现在一个\
    \ Unity 项目中创建了许多类。此外，Unity 在后台编程时使用的框架也提供了许多类。为了不让你丢失视图并避免产生混乱，引入了所谓的命名空间（Namespaces）。命名空间是一种组织结构，它将相关的类型（类等）结构化，并将它们分组为逻辑单元。你可以将其比为文件系统上的文件夹，其中包含各种文件。如果你现在想在\
    \ Unity 中使用某种类型，必须引用项目中的命名空间并集成到类中。通常情况下，Unity 会处理这一切。只有当你想要使用特殊类型时，才需要手动完成。\n\
    \n你可以在脚本文件的开头使用关键字 `using` 包含一个命名空间。接接的示例类包含了 `System.Collections.Generic` 命名空间，以便使用\
    \ `List` 类型。\n\n```csharp\nusing System.Collections.Generic;\n\npublic class TestClass\n\
    {\n    private List<string> myList;\n}\n```\n\n如果你再次查看接口示例，你会发现命名空间已经通过这种方式被集成了，即\
    \ `UnityEngine` 和 `System.Collections` 命名空间。你可以在“脚本编程”章节中找到更多关于这两个命名空间的信息。\n\n\
    # 泛型类和方法\n\n在面向对象的编程中，“泛型（generic）”一词实际上意味着，例如方法或类，泛泛之，即在设计时不考虑具体类型。最后使用的类型（或方法）将通过尖括号\
    \ `< >` 传递给类（或方法）。在 C# 中，要分配的这种类型通常用泛型类（或方法）中的字母 `T` 表示。\n\n```csharp\nusing UnityEngine;\n\
    \nusing System.Collections;\n\npublic class MyGeneric <T> {\n\n    public T current;\n\
    }\n```\n\n在泛型类中任何使用参数 `T` 的地方，稍后都会使用传递的类型。因此，变量 `current` 将具有你在实例化时所指定的数据类型。\n\
    \nMyGeneric <string> test = new MyGeneric <string>();\n\ntest.current = \"ddd\"\
    ;\n\nMyGeneric <int> test2 = new MyGeneric <int>();\n\ntest2.current = 2;\n\n\
    # 常用技巧\n\nUnity 项目中经常使用的泛型类型是 `List <T>` 类型。它的工作方式与数组类似，但这种类型的对象提供的功能比普通数组多得多。你可以使用\
    \ `Add` 方法向这些对象添加许多新元素，使用各种命令对它们进行搜索，或者使用 `Remove` 删除特定元素。创建列表对象时，只需输入对象应该包含的类型即可。在接下来的示例中，因此你应该特别注意\
    \ `myNumbers` 的变量声明，以及 `System.Collections.Generic` 命名空间的包含，`List` 类属于该命名空间。\n\
    \n```csharp\nusing UnityEngine;\n\nusing System.Collections.Generic;\n\npublic\
