    ## 语法错误


    如果你在脚本中存在语法错误，例如，你忘记了分号（“解析错误”）或使用了未实例化的变量，Unity 将在你保存此错误脚本后显示一条错误消息。此消息会显示在 Unity
    窗口底部和控制台（console 标签页）中。如果你点击此消息，MonoDevelop 将打开并带你到错误发生的地方。


    ![](img/e263e4c2a46d978fb73216c778f3ec48_94_0.png)


    ## 错误信息的转发


    在控制台中点击错误消息并不总是能找到开发者编写编程错误的位置。


    例如，如果你在行末尾忘记了分号，编译器可能只认为下一行是有错误的，因为（之前的）代码行尚未完成，而这个新命令不应该在此处出现。对于初学者来说，这会导致长时间的错误搜索，因为错误可能出现在显示位置的其他地方。


    ## 可用的编程语言


    在编写脚本时，你可以在 JavaScript、Boo 和 C# 编程语言之间选择。虽然你可以在 Unity 项目中任意混合这些语言（但在脚本内部不能！），但建议尽可能避免这样做。在项目内部混合语言本身不是问题。但一旦你尝试从一个脚本访问另一个语言，可能会变得复杂。我将在第
    4.14 节“编译顺序”中介绍细节。因此，我建议尽可能将项目限制在一种语言内。


    ## 为什么选择 C#？


    正如你所注意到的，我在书中使用了 C# 语言。最初，Unity 专注于 JavaScript 语言。但随着时间的推移发生了巨大变化，现在 C# 是重点。C#
    更多功能，而且比专为 Unity 设计的 JavaScript 分支（通常称为 UnityScript）更广泛。


    ## Unity 的实例结构


    正如我在上一章“C# 与 Unity”中提到的，所有要作为组件使用的脚本必须继承自 MonoBehaviour 类。然而，该类继承自另一个类。最终，组件和
    GameObject 甚至具有相同的起源，即 UnityEngine 命名空间中的 Object 类。图 4.3 显示了类图中 Unity 引擎命名空间中最重要类之间的关系。箭头始终从派生类指向相应的基类。


    ![](img/e263e4c2a46d978fb73216c778f3ec48_97_0.png)


    ## Object


    Object 是 Unity 中所有对象的父基类。它提供了一些基本属性和方法，例如用于删除对象的静态方法 Destroy，以及我将在本章中解释的 DontDestroyOnLoad
    方法。GameObject、Component 和 ScriptableObject 类都派自此类。对于更有经验的 C# 开发者，应该再次指出，这是一个 Unity
    对象类，而不是 .NET 框架提供的类。


    ## GameObject


    GameObject 直接继承自 Object，Object 是 Unity 场景中所有对象的基类。大多数 GameObject 是通过编辑器中主菜单的 GameObject
    创建的。如果你想通过代码创建 GameObject 实例


    ## ScriptableObject


    ScriptableObject 也直接继承自 Object。首先，ScriptableObjects 是继承自 ScriptableObject 的通用脚本，通常用于存储大量数据。这些类的实例是通过
    ScriptableObject 类的静态方法 CreateInstance 创建的，并且可以在运行时和开发期间创建。ScriptableObjects 更多用于特殊情况，例如创建可以存储在场景之外的数据容器，并在需要时进行配置和读取。


    ## Component


    Component 类也继承自 Object，它是所有可以附加到 GameObject 上的类的基础。这就是为什么它们通过使用 GameObject 方法
    AddComponent 将它们添加到相应的实例中来创建的。其他重要类继承自 Component，我想以 Transform 和 Behavior 类作为示例。因为在
    Unity 中，所有它们都派生自 Component 类，因为组件在德语中通常被称为 "components"。


    ## Transform


    Transform 类继承自 Component，并默认添加到场景中的每个 GameObject 中。只有当你用代码创建 GameObject 时，它才不会自动拥有
    transform 组件。相反，RectTransform 类继承自 Transform，它被 uGUI 系统在 GUI 设计中使用。


    ## Behavior


    Behavior 类继承自 Component 类。继承自 Behavior 的类也称为 Behaviors，或泛称为 Components/Components，并且可以通过
    enabled 属性开启或关闭。派自 Behaviors 的类例如 Light 或 NavMeshAgent，我将在其他章节中讨论它们。最后，MonoBehaviour
    类也继承自 Behavior。


    ## MonoBehaviour


    MonoBehaviour 类是 Unity 中所有作为组件使用并可以附加到 GameObject 的脚本类的基类。即使 MonoBehaviour 继承自
    Behavior，你只需要记住，禁用 enabled 属性只会阻止 Start、Awake 和 OnGUI 方法的执行。其他方法仍然可以调用和执行，例如 OnTriggerEnter
    或 OnCollisionEnter。


    ## 创建脚本


    在 Unity 中，每个脚本恰包含一个类。脚本名称始终与类名相同。否则，当你想使用它时将会出错。因此，在选择脚本名称时，适用以下规则：不要使用空格或特殊字符。要创建脚本，执行以下操作之一：


    - 使用主菜单 Assets / Create 并选择脚本类型（在本例中为 C# Script）。

    - 使用 Project Browser（上方）的 Create 菜单，你也可以在那里找到脚本类型。

    - 使用 Project Browser 的上下文菜单，可以通过右键访问。你也可以在那里找到脚本类型。

    - 使用 Inspector 中 Add Component 按钮的 New Script 选项。当你选择层级中的 GameObject 时，你会在已添加组件中找到它。脚本默认创建在项目浏览器的根目录下，并附加到选中的
    GameObject 上。


    双击创建的脚本将在开发环境 MonoDevelop 中打开它。


    ## 重命名脚本


    如果你随后在项目浏览器或脚本本身中更改脚本名称，对应的名称必须同时更改。如果它们不一致（即使只是大小写敏感），以后你想使用它时将会出错。因此，在重命名时，最好使用
    MonoDevelop 中的重命名功能。这不仅会重命名类，还会重命名脚本以及脚本在项目中的所有引用。一旦将光标置于类名中，可以通过右键 Refactor /
    Rename 访问此功能。当你想要重命名相关变量时，重命名功能也很有意义。


