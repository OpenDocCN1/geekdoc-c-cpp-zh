    \ and \"Tile2-Value\" in the order corresponding to the guileTextures-Array and\
    \ \"Tile1-Quantity\" and \"Tile2-Quantity\" to the guileQuantities-Array. You\
    \ can now test the text property of the two \"Quantity\" objects, assign different\
