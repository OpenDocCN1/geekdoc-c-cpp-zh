    \  if (player != null) {\n        //代码...\n    }\n}\n```\n\n但你也可以在运行时访问其他 GameObject。如果你想频繁访问它们，请确保将它们保存在变量中。这带来了巨大的性能优势，因为在坏情况下\
    \ Unity 必须遍历场景中所有的 GameObject 才能找到正确的一个。\n\n\n"
