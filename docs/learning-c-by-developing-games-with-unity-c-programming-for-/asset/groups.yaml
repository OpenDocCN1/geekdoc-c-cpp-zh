    Unity 的一个重要原则是每个 GameObject 都有自己的组件。因此你不是编写一个管理所有对手健康的生命管理系统，而是编写一个只管理单个对手健康的脚本。该脚本被添加到每个对手上，以便每个对手都有自己的管理，并且在某些情况下不遵循这一原则。但首先，你应该确保每个\
    \ GameObject 都有自己的组件。顺便提一下，这在访问组件时也有巨大的差异。\n\n# 访问 GameObject\n\n访问组件自身的 GameObject\
