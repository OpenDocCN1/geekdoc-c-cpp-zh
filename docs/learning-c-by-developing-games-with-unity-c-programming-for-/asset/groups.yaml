    # Life management


    In this game I would like to create a life management system with you, which does
    not only manage the simple health of the player. The player should also have several
    life points, so that the game is only over when all lives have been used up.


    # GUI elements


    But first we want to create the GUI elements for this life management.


    +   1. First we create a new Empty GameObject, which we simply call "GUI". This
    should serve as a container object for the GUI objects.

    2. Reset the GameObject "GUI" to the default values with the Reset function .

    3. Immediately create another UITextext object that you name "LpText". This should
    serve to display the life points. Add "LpText" as a child object to the "GUI"
    container object. Now position "LpText" on (0,1,0) and a pixel offset (33, -49).

    4. To make the value in the GUI a little more appealing, we want to underlay the
    value with a more appealing graphic. To do this, create a GUITexture object and
    name it "LBg". Set position to (0,1,-1) and scale to (0,0,1). the last values
    being W and H. Assign texture to the graphic "lifepointHeart", whose texture should
    be "GUI" and Max Size 32.

    5. In addition to the life points, we also want to display the current state of
    health. To do this, create a GUITexture object that you call “HealthBar", set
    Position to (0,1,0) and Scale to (0,0,1). Since this'
