- md: "\nYou can find a GameObject by its tag. To this end, the class GameObject method\
    \ FindWithTag available. If there are several GameObjects with this tag in the\
    \ scene, one is selected at random.\n\n```\nGameObject cam; void Awake () {\n\n\
    cam = GameObject.FindWithTag(\"MainCamera\");\n\n}\n```\n\n## FindGameObjectsWithTag\n\
    \nIf there are several objects with the same tag, but you also want to collect\
    \ them all in an array, you should use the FindGameObjectsWithTag method . As\
    \ a return value, you will receive a GameObject array of all objects found with\
    \ this tag.\n\nGameObject [] enemies;\n\n```\nvoid Awake () {\n\nenemies = GameObject.FindGameObjectsWithTag(\"\
    Enemy\");\n\n}\n```\n\n## Find\n\nYou can find a GameObject by its name. The static\
    \ method Find of the class GameObject is suitable for this.\n\n```\nGameObject\
