    \n## if 语句\n\n最简单的分支是所谓的 if 语句。它的工作类似于一个开关 (switch)，可以根据条件执行代码。此外，还可以指定在条件不满足时执行的备选代码，因此整个代码的行为如下：“如果条件成立，则执行此操作，否则执行另一操作”：\n\
