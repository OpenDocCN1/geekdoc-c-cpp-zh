    # Quest giver configuration


    As a quest giver, I would like to use the particle system "Waterdrops", which
    I already introduced in Section 11.10, "Creating Water Drops", of the chapter
    "Particle Effects with Shuriken. So that the player actually pays attention to
    this particle system, we are adding this to it the WaterdropSound script, which
    we also developed in "Create water drops". Use the "waterdrop" file as an audio
    clip. Additionally, you can also increase the amount of water droplets created
    by the particle system. To do this, set the rate value in the emission module
    slightly higher, e.g. E. on 0.8. Position this particle system in one place of
    the dungeon on the ceiling. It is best to place it in a place that the player
    can see when the game starts. This will lead the player to the quest immediately
