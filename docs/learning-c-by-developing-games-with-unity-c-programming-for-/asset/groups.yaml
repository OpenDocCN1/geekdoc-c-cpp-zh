- md: "\nAs you can see from the listing, we need references to the previously programmed\
    \ EnemySonar script, to the EPController script of the \"Game Controller\" and\
    \ to our own animator component. We also want to address the \"Hit\" and \"Die\"\
    \ variables from the animator later, which is why we save their hash values in\
    \ variables. Of course there should also be experience points for killing an opponent,\
    \ which is why we still need a variable eps. Finally, we need two variables for\
    \ the state of shock that the opponent should fall into if he was injured. For\
    \ this we want isShocked a Boolean variable that saves the state, and a variable\
    \ that the two methods use to set the duration of this content.\n\nIn the next\
    \ step we program out the Damaging and Dying methods in the base class HealthController.\
    \ As a call first we set the trigger parameter \"Hit\" in the Damaging method\
    \ so that the Animator Controller switches to the \"Hit\" state. In addition,\
    \ the sound of your own audio source should be played and the isShocked variable\
    \ set to TRUE. Of course, this should be reset after a time specified by the variable\
    \ shockedTime. We do this in a separate ResetShocked method.\n\n```\npublic void\
    \ override Damaging () {\n    anim.SetTrigger(hitTrigger);\n    audio.Play();\n\
    \    isShocked = true;\n    if (!enemySonar.playerDetected)\n    enemySonar.StopSearching();\n\
    \    Invoke(\"ResetShocked\", shockedTime);\n}\n```\n\n```\nvoid ResetShocked\
    \ () {\n    isShocked = false;\n}\n```\n\n}\n\nWe also want the player to be identified\
    \ as soon as they injure their opponent. That is why we also call StopSearching\
    \ from the EnemySonar script if it has not yet been detected. In the Dying method,\
    \ we set the \"Die\" parameter to TRUE in addition to the \"Hit\" trigger. We\
    \ also play the AudioClip here and set isShocked to TRUE. However, we now call\
    \ the DestroyMe method instead of a second delay, which destroys the entire GameObject\
    \ and assigns the experience points to the EPController.\n\n```\npublic override\
    \ void Dying () {\n    anim.SetBool(dieBool, true); anim.SetTrigger (hitTrigger);\n\
