    a scene by default. Only if you create a GameObject with code does it not automatically
    have a transform component. In turn, the class RectTransform inherits from Transform,
    which is used by the uGUI system in the GUI design.


    # Behavior


    The Behavior class inherits from the Component class. Classes that inherit from
    Behavior are also known as Behaviors or also generally as Components / Components
    and can be switched on and off via the enabled property . Examples of classes
    that are derived from Behaviors are Light or NavMeshAgent which I will talk about
