    When the player drops the projectile, the Launch () function is called, which
    can be given a numeric value representing the firing force coefficient. This enables
    us to make more than one slingshot with different firing forces. When called,
    this function verifies that the projectile is under the control of the player
    and that the player is currently holding it, and that it has not yet launched.
    After these conditions are met, the firing force is calculated by the distance
    between the projectile''s holding position and its dropping position and multiplied
    by the function-supplied operator, since pulling the projectile further would
    result in greater firing force. The solid object is then activated again by setting
    the isKinematic variable to false and reactivating the solid body''s response
    to external forces before adding its firing force. After the launch is executed
    the status variables are updated; the player is prevented from controlling the
    projectile by changing the controllable to false and the launch state is activated
    by launched to true and is also re-held to false since the player is no longer
    holding the projectile. Finally the ProjectileLaunched message is sent in order
    to inform other applets that the projectile has been launched.


