  md: '# CHAPTER 1


    # C# and Unity


    Even if Unity already supplies ready-made components for many standard tasks (for
    the areas of audio, physics, particle effects or even rendering), the actual,
    individual game logic must still be programmed by yourself. In Unity, this is
    done with scripts, individual text files that are translated by a program (called
    a compiler) into commands that are understandable to computers when the game is
    created. Scripts usually behave like components in Unity and are attached to GameObjects
    accordingly. As we are working with the C # programming language in this book,
    I would first like to introduce you to this language and how it is used in Unity.
    If you have already dealt with C # I would still recommend that you read this
    chapter, because it also explains some special features that apply specifically
    in Unity.'
  merge: -1
