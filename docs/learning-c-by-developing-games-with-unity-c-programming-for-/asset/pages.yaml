    # Model, rig and animation import


    Since the bat model "bat_03" already comes with its own animations, we no longer
    need to worry about creating the animations. However, these animations are often
    packed into a single large animation when exporting from the actual modeling program.
    This is also the case in our case, which is why we now have to take them apart
    again in the import settings and distribute them to various animation clips. To
    do this, go to the animations in the import settings of the bat model "bat_03"
    -Equestrian. You can now add new clips to the list using the plus sign below the
    animation clips list. You then specify the section of the associated animation
    using the timeline or the two input fields below. You can enter the name directly
    in the text field and overwrite the suggested name. In total, we now create three
    animations in this way: "flying", "hit" and "dying" (see Figure 21.24).'
