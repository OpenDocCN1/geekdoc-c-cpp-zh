    The class MonoBehaviour is the base class of all script classes in Unity that
    are to be used as components and can be attached to a GameObject. Even if MonoBehaviour
    inherits from Behavior, you have to keep in mind with a deactivated enabled property
    only that Execution of the methods Start , Awake , Update and OnGUI is'
