    # Create a simple 3d game


    Now that you have learned the basics of Unity, let''s put this knowledge into
    practice in a game. For this you will find an example game on the enclosed DVD,
    which should be available in three different versions:


    +   - Empty example game: This project only contains the various assets as the
    3D models, textures, sound files, etc.

