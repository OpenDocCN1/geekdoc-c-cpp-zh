    The three functions HoldProjectile (), DragProjectile (), and ReleaseProjectile
    () do call the Hold (), Drag (), and Launch () functions of the current projectile
    currentProjectile. The function that needs some explanation here is DragProjectile
    () because it contains an additional step that is not present in the Projectile,
    which is to verify the distance of the projectile from the initial site while
    pulling back does not exceed the allowable length of the rubber slingshot stretch.
    This stretch is defined in the maxStretch variable. The way we are going to impose
    this maximum length should take into account the ease of control as well, if the
    player pulls the cursor beyond the allowed length should not withdraw with the
    projectile, but at the same time must remain able to change the angle of launch.
    In order to achieve this mechanism we will use linear interpolation again and
    this is described in lines 131 and 132.


    The idea is to calculate the distance between the launch location and the current
    currentDist and compare it to the maximum expansion, maxStretch. If this distance
    exceeds the limit, we will divide maxStretch by currentDist, thus obtaining the
    required interpolation between the original launchPosition.position and the current
    location of the newPosition. This will naturally decrease with increasing distance
    from the cursor to the launch site, thus maintaining a constant distance from
    the launch site, which is the maxStretch. By completing the interpolation, we
    get the correct newPosition without affecting the smooth motion, and then use
    the Drag () function to move the projectile. It is necessary to use this function
