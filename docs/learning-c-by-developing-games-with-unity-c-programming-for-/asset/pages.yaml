    to develop a script called EnemySonar that looks for the player, but we also want
    this script to ensure that the bat doesn''t hit the portcullis. After all, we
    did not call the fall gate ("gate") static, which means the entire object is not
    considered an obstacle for the path calculation. If you use Unity Pro, you can
    simply equip the child object "gate_01" with a NavMeshObstacle component and neglect
    this part of the script. Unity then takes care of the fall gate independently.
    But if you''re using the free version, I''ll show how you can do it without this
    component. For this script we need four variables. The first variable fieldView
    indicates the field of view of the NPC, the second obstacleDetected indicates
    whether an obstacle was detected. The third variable, playerDetected stores whether
    the player has been detected, and the last thing we need is a variable in which
    we store the "Player" GameObject. After all, the script is supposed to find exactly
    this object.'
