  md: 'A special feature of Unity is the script compilation order, which is divided
    into four different phases. This is important because from a script you can only
    access others that are in the same or an earlier phase , the question remains
    how to determine which script is compiled in which phase. This is controlled in
    Unity via the folder names in which you store your scripts in the Project Browser.
    The names don''t really matter, but some of them are reserved for special purposes,
    for example Folders with this name should only store scripts that also inherit
    from the class Editor, not from MonoBehaviour. You can use this to expand Unity
    with your own functionalities , for example. Unity proceeds with the compilation
    in four different steps.


    +   1. All scripts are compiled which are located in folders with the names Standard
    Assets, Pro Standard Assets and Plugins.


    +   2. All editor scripts that are located in folders named Editor and in the
    above folders Standard Assets, Pro Standard Assets and Plugins are compiled.


    +   3. All other scripts that are outside of folders named Editor are compiled.


    +   4. Finally, any remaining scripts (in folders named editor) kompiert.Weiter
    , there is the reserved folder names WebPlayerTemplates whose scripts contained
    are not compiled.


    If you want to use your C # script to access a Boo or JavaScript class, the script
    you want to access must have been compiled in an earlier phase than itself. In
    this case, you could use the JS script in the Move the plugins folder and it is
    already accessible from your C # script.'
