    # Game controller


    In a game there are always functionalities that cannot be specifically assigned
    to a game object, but relate to the entire game or at least to the current scene.
    A good example of this is a pause menu or background music. Such components are
    usually assigned to a GameObject called "Game Controller". "Game controllers"
    are typical components of a game, which is why Unity already provides a "Game
    Controller" tag by default in order to identify them more quickly. Since we also
    need a "Game Controller" in our game, create one now New GameObject with the name
    "Game Controller" to it. First, you transfer an AudioSource to it, when you activate
    both Play On and Loop. Now assign the "backgroundMusic" file to the AudioClip
    property and set the volume to 0.3 for the time being, which you can later adjust
    to suit your taste. So that the background music is the same volume everywhere
    always evenly distributed over both speakers, we deactivate the parameter 3D sound
    in the import settings of "back-groundMusic".


