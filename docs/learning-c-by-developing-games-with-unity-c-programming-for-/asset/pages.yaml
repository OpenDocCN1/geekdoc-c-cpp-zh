  md: '# INTRODUCTION


    Unity is a cross-platform development plat initially created for developing games
    but is now used for a wide range of things such as: architecture, art, children''s
    apps, information management, education, entertainment, marketing, medical, military,
    physical installations, simulations, training, and many more.Unity takes a lot'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'of the complexities of developing games and similar interactive experiences
    looks after them behind the scenes so people can get on designing and developing
    their games. These complexities include graphics rendering, world physics and
    compiling. More advanced users can interact and adapt them as needed for beginners
    they need not worry about it.Games in Unity are developed in two halves; the first
    half -within the Unity editor, and the second half -using code, specifically C#.
    Unity is bundled with MonoDevopor Visual Studio 2015 Communityfor writing C#.


    # 2D OR 3D PROJECTS


    Unity is equally suited to creating both 2D and 3D games. But what''s the difference?
    When you create a new project in Unity, you have the choice to start in 2D or
    3D mode. You may already know what you want to build, but there are a few subtle
    points that may affect which mode you choose.Thechoice between starting in 2D
    or 3D mode determines some settings for the Unity Editor -such as whether images
    are imported as textures or sprites. Don''t worry about making the wrong choice
    though, you can swap between 2D or 3D mode at any time regardless of the mode
    you set when you created your project. Here are some guidelines which should help
    you choose.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Full 3D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_21_0.png)


    3D games usually make use of three-dimensional geometry, with materials and textures
    rendered on the surface of these objects to make them appear as solid environments,
    characters and objects that move inandaround the scene freely, with light and
    shadows cast around the world in a realistic way. 3D games usually render the
    scene using perspective, so objects appear larger on screen as they get closer
    to the camera. For all games that fit this description, start in3Dmode.


    # Orthographic 3D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_21_1.png)


    Sometimes games use 3D geometry, but use an orthographic camera instead of perspective.
    This is a common technique used in games which give you a bird''s-eye view of
    the action, and is sometimes called “2.5D”. If you''re making a game like this,'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'you should also use the editor in3Dmode, because even though there is nosperspective,
    you will still be working with 3D models and assets. You''ll need to switch yourcameraandscene
    viewtoOrthographicthough.(scenes above fromSynty StudiosandBITGEM)


    # Full 2D


    ![](img/e263e4c2a46d978fb73216c778f3ec48_22_0.png)


    Many 2D games use flat graphics, sometimes called sprites, to which have no three-dimensional
    geometry at all. They are drawn to the screen as flat images, and the game''s
    camera has no perspective. For this type of game, you should start the editor
    in 2D mode.


    # 2D gameplay with 3D graphics


    ![](img/e263e4c2a46d978fb73216c778f3ec48_22_1.png)'
