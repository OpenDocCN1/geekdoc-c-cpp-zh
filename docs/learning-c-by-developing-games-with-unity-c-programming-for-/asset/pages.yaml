    # Change web player template


    The first peculiarity concerns attacking. Since the player can throw the stones
    not only with the [Space] key, but also with the right mouse button, there is
    a conflict with a standard Unity function. With the right mouse button, the player
    normally calls up a context menu in the web player with which this context menu
    does not pop up every time the player wants to throw a stone, we can now suppress
    this context menu. To do this, go to the Player Settings of the web player via
    Edit / Project Settings / Player and select "No Context Menu" in the Web Player
    Template area.


