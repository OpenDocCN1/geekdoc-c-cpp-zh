    The [SAS Code 4-4](#Chapter4.xhtml_ch4-pro4) example with the results shown in
    [Figure 4-4](#Chapter4.xhtml_ch4-fig4) was produced using the SASDATE option.
    The code executed in [SAS Code 4-3](#Chapter4.xhtml_ch4-pro3) was executed before
    the code in [SAS Code 4-4](#Chapter4.xhtml_ch4-pro4). But the dates in [Figure
    4-4](#Chapter4.xhtml_ch4-fig4) are before the dates shown in [Figure 4-3](#Chapter4.xhtml_ch4-fig3).
    This is because the SASDATE option uses the DATE/TIME from when the SAS session
    started as the value entered for the dates.


