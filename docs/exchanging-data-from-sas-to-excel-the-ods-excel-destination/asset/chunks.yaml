    ### ODS EXCLUDE Statement


    The ODS EXCUDE statement is a stand-alone ODS statement. It is discussed here
    because the syntax includes the name of an open and active ODS statement, when
    the ODS EXCLUDE statement is encountered in the SAS code. The purpose of the ODS
    EXCLUDE statement is to prevent ODS objects from being output. The ODS TRACE statement
    shown in [SAS Code 3-2](#Chapter3.xhtml_ch3-pro2) enables you to find the names
    of the ODS objects that are available for output. [SAS Code 3-3](#Chapter3.xhtml_ch3-pro3)
    uses the ODS EXCLUDE statement to prevent the “Moments” and “Quantiles” ODS objects
    from being output to the Excel workbook, but all of the other objects from the
    UNIVARIATE procedure are output. I am also using an ODS Excel suboption that will
    be described later so that I can show all of the output on one page of an Excel
    workbook. When [SAS Code 3-3](#Chapter3.xhtml_ch3-pro3) is executed, the SAS Results
    window will look like [Figure 3-5](#Chapter3.xhtml_ch3-fig5) because nothing was
    “EXCLUDED” from that ODS output stream. However, the Excel output will not include
    the “Moments” and “Quantiles” ODS objects and is shown in [Figure 3-6](#Chapter3.xhtml_ch3-fig6).


    SAS Code 3-3 – Excluding Moments and Quantiles from the Excel Output Workbook


    ODS EXCEL options(Sheet_interval=''NONE'');


    ODS EXCEL EXCLUDE Moments Quantiles;


    PROC UNIVARIATE  DATA=sashelp.shoes


       (keep =  region stores product


        where=(region="Asia" and product="Boot"));


