    \ [SAS Code 5-3](#Chapter5.xhtml_ch5-pro3) shows how to use this option to insert\
    \ a blank sheet after producing an output sheet with data.\n\nSAS Code 5-3 – Using\
    \ the `BLANK_SHEET=` Option to Insert a Named Sheet into the Output Workbook\n\
    \n```sas\nods excel file=\"&path.\\Empty_Workbook.xlsx\";\nproc print data=asia_only;\n\
    run;\nods excel(BLANK_SHEET='Empty');\n```\n\nFigure 5-5 – Excel Output with a\
    \ Blank Worksheet\n\n![image](images/f0038-01.jpg)\n\n### The `CONTENTS=` Option\n\
    \nThe `CONTENTS=` option will build a Table of Contents for every worksheet, and\
    \ it will provide a hyperlink to jump directly to the sheet. This makes the job\
    \ of listing the contents and access to your data. In [Figure 5-6](#Chapter5.xhtml_ch5-fig6)\
    \ I am holding the cursor over `A3` and the Excel options to select the hyperlink\
    \ are not. Of course, your computer will show a different path. Here I am using\
    \ `SASHELP` data set to show multiple pages. The `CONTENTS=` and `INDEX=` options\
    \ produce similar. The `INDEX=` option produces an.\n\nSAS Code 5-4 – Using `CONTENTS=`\
    \ Option to Produce Hyperlinks to Data\n\n```sas\nods excel file=\"&path.\\Table_Of_Contents.xlsx\"\
    \n         (CONTENTS='ON');\nproc print data=sashelp;\nby region;\nrun;\nods close;\n\
    ```\n\nFigure 5-6 – The Table of Contents\n\n![image](images/f0039-01.jpg)\n\n\
    ### The `INDEX=` Option\n\nThe `INDEX=` option will build a Table of Contents\
    \ for every worksheet, and it will provide a hyperlink to jump directly to the\
    \ sheet. This makes the job of listing the contents and access to your data. In\
    \ [Figure 5-7](#Chapter5.xhtml_ch5-fig7) I am holding the cursor over `A1` and\
    \ the Excel options to select the hyperlink are not. Of course, your computer\
    \ will show a different path. Here I am using `SASHELP` data set to show multiple\
    \ pages. The `CONTENTS=` and `INDEX=` options produce similar. The `INDEX=` option\
    \ produces an.\n\n```sas\nods excel file=\"&path.\\INDEX_Of_Workbook.xlsx\"\n\
    \         (INDEX='ON');\nproc print data=sashelp;\nby region;\nrun;\nods close;\n\
    ```\n\nFigure 5-7 – The Index Page\n\n![image](images/f0040-01.jpg)\n\n### The\
    \ `MSG_LEVEL=` Option\n\nI had a lot of trouble with this suboption. After several\
    \ emails with SAS Technical Support, I was told the option was to identify options\
