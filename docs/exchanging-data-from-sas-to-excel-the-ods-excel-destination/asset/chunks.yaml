    \ 4 章：设置 Excel 属性\n\n### 引言\n本章介绍 `ODS EXCEL` 目标选项，允许您向“属性”表输入文本。这是一个节省时间的选项，可以在创建工作簿的同时更新属性。本章描述的所有选项都接受字符串。\n\
    \n### 修改 Excel 属性的选项\n在本章中，我们将讨论以下 `ODS EXCEL` 目标选项，它们提供了将字符串应用于文档属性的方法。表 4-1\
    \ 列出的选项标识了 SAS 将字符串发送到文档属性的方式。\n\n表 4-1 – 修改 Excel 属性的 ODS 目标选项\n\n| 操作参数 | 描述\
    \ |\n| --- | --- |\n| `AUTHOR` | 为文档属性添加作者信息字符串 |\n| `CATEGORY` | 为文档属性添加类别信息字符串\
    \ |\n| `COMMENTS` | 为文档属性添加注释字符串 |\n| `FILE` | 为您的工作簿选择路径和文件名 |\n| `KEYWORDS`\
    \ | 为文档属性添加关键字字符串 |\n| `STATUS` | 创建状态。您可以提供一个在文档属性中看到的字符串 |\n| `SASDATE` | 在属性表中保存\
