  trans: "\n\n# 本书未讨论 SAS 注册表的修改\n\n## 在 ODS EXCEL 语句中使用 ODS 文档对象模型 (DOM)\n\nSAS 文档将\
    \ ODS 文档对象模型或 `DOM` 描述为 `ODS EXCEL` 语句可用选项之一。实际上，`DOM` 选项适用于大多数 ODS 语句，但 `ODS\
    \ LISTING` 和 `ODS OUTPUT` 语句除外。上述 *SAS 9.4 Output Delivery System: Advanced Topics,\
    \ Third Edition* 手指出，ODS 的 `DOM` 功能允许您“确定存在哪些元素和属性，以便构建您的 CSS 选择器来访问这些区域”。再次，由于时间限制，我不对此\
    \ ODS 功能进行详细解释。当与 `ODS EXCEL` 语句配合使用时，有两种格式可用：\n\n1. `ODS EXCEL DOM`;\n2. `ODS\
    \ EXCEL DOM <=\"external-file\">`;\n\n语句 1 将输出写入 SAS 日志，而语句 2 将其写入外部文件。但输出长什么样呢？`SAS\
    \ Code 6-1` 显示了第一种格式的语法，`SAS Log 6-1` 显示了输出的部分列表。格式 2 仅将相同的信息写入外部文件，此处未显示。我还使用了\
    \ `PROC PRINT` 来显示 `SAS Log 6-1` 中显示的输出信息。这里使用 `ODS TRACE` 语句来描述代码执行期间生成的 ODS\
    \ 输出。`ODS TRACE` 语句在`第 3 章` 中简要描述。\n\n### SAS Code 6-1 – 使用 DOM 选项识别 CSS 元素\n\n\
    ```sas\nods trace dom;\nods excel dom;\nods excel options(sheet_interval='none');\n\
    proc print data=sashelp.shoes(where=\n      (Product    = 'Boot'     and\n   \
    \   Subsidiary = 'New York' and\n      region      = 'United States'));\nrun;\n\
    ods excel close;\nods trace off;\nods html;\n```\n\n`SAS Log 6-1` 仅是输出的部分列表。在此显示是为了帮助识别稍后\
    \ `ODS EXCEL ANCHOR=` 选项使用的某些元素。\n\n### SAS Log 6-1 – DOM Trace 输出的部分列表\n\n```\n\
    296  ods trace dom;\n297  ods excel dom;\n. . . more dom trace output . . .\n\
    298\n299  ods excel options(sheet_interval='none');\n300\n301  proc print data=sashelp.shoes(where=\n\
    302         (Product    = 'Boot'     and\n303          Subsidiary = 'New York'\
    \ and\n304          region      = 'United States'));\n305  run;\n      <div>\n\
    \      </div>\n      <section id=\"idx\" class=\"oo\" data-name=\"procprinttable\"\
    \ label=\"data set sashelp.shoes\" proc=\"print\" output=\"print\" contents-label=\"\
    data set sashelp.shoes\">\n. . . more dom trace output . . .\n<th class=\"header\"\
    \ type=\"char\" unformatted-type=\"char\" index=\"2\" name=\"region\" data-name=\"\
    region\" label=\"region\">Region\n                            </th>\n<th class=\"\
    header\" type=\"char\" unformatted-type=\"char\" index=\"3\" name=\"product\"\
    \ data-name=\"product\" label=\"product\">Product\n                          \
    \  </th>\n<th class=\"header\" type=\"char\" unformatted-type=\"char\" index=\"\
    4\" name=\"subsidiary\" data-name=\"subsidiary\" label=\"subsidiary\">Subsidiary\n\
    \                            </th>\n. . . more dom trace output . . .\ntype=\"\
    char\" index=\"2\" name=\"region\" data-name=\"region\" label=\"region\">United\
    \ States\n                            </td>\n<td class=\"data\" type=\"char\"\
    \ unformatted-type=\"char\" index=\"3\" name=\"product\" data-name=\"product\"\
    \ label=\"product\">Boot</td>\n<td class=\"data\" type=\"char\" unformatted-type=\"\
    char\" index=\"4\" name=\"subsidiary\" data-name=\"subsidiary\" label=\"subsidiary\"\
    >New York</td>\n<td class=\"data\" type=\"num\" . . . more dom trace output .\
    \ . .\nNOTE: There were observations read from the data SASHELP.SHOES. WHERE (Product='Boot')\
    \ and (Subsidiary='New York') and (region='United States');\nNOTE: PROCEDURE PRINT\
    \ used (Total process time): real time 32 seconds cpu time 28 seconds\n306\n307\
    \  ods excel close;\n. . . more dom trace output . . .\nNOTE: Writing EXCEL file:\
    \ \\sasexcl.xlsx\n308  ods trace off;\n309  ods html;\nNOTE: Writing HTML Body\
    \ file: sashtml10.htm\n```\n\n加粗高亮的短语 `section id=\"idx\"`、`class=\"header\"`\
    \ 和 `class=\"data\"`将在解释 ODS Anchor 选项时进行详细说明。这些是 `ODS EXCEL DOM` 选项和 `ODS TRACE`\
    \ 语句显示的 CSS 元素。当然，还有许多其他元素，事实上，列表中每个“header”和“data”部分都至少存在四个其他类语句。`ODS TRACE`\
    \ 列表超过了 7 页，数据量太大无法显示。`表 6-2` 包含了一些可用元素类型以及简要定义。更多信息，请参阅 SAS Institute Inc. 2014.\
    \ *SAS 9.4 Output Delivery System: Third Edition*。Cary, NC: SAS Institute Inc.\n\
    \n### 表 6-2 – CSS 选择器类\n\n| 若干 CSS 选择器类示例 |\n| 选择器类 | 说明 | 示例 |\n| :--- | :---\
    \ | :--- |\n| 类选择器 (Class Selectors) | 类选择器是根据 ODS 报告标记中 `class=` 属性的值选择元素的样式选择器。类选择器在类名之前必须有一个点\
    \ (`.`)。例如，在以下规则集中，类选择器是 `.SYSTEMTITLE`。 | .systemtitle { font-family: arial,\
    \ helvetica, sans-serif; color: red; border: 1px solid black; } |\n| 元素选择器 (Element\
    \ Selectors) | 元素选择器是根据元素名称选择 DOM 元素的样式选择器。例如，以下规则集选择了名为 P 的元素： | p {color:green}\
    \ |\n| 通用选择器 (Universal Selector) | 通用选择器是一种通配符样式选择器。它可以匹配任何元素名称。通用选择器的语法是星号 (`*`)。\
    \ | * |\n| 伪类选择器 (Pseudo-Class Selectors) | 伪类选择器是根据 DOM 元素之间的关系选择元素的样式选择器。伪类由带有冒号\
    \ (`:`) 前缀的伪类名称表示。以下是使用伪类选择器的某些示例：<br>• 选择父元素的第一个和最后一个孩子<br>• 根据在父元素中的位置索引选择特定的子元素<br>•\
    \ 根据特定元素的位置选择元素 | :root 选择 DOM 中的顶层元素。<br>:first-child 选择父元素内的第一个元素。<br>:first-of-type\
    \ 选择父元素内的第一个该类型（即相同元素名称）元素。<br>:marker 选择打印输出中的列表项目符号。<br>:nth-child(an+b) 根据公式\
    \ `an + b` 选择元素。该公式选择从位置 `b` 开始的每隔 `a` 个元素。公式可以用关键字 `even` 或 `odd` 代替，用于交替选择的简单情况。<br>:nth-of-type(an+b)\
    \ 选择 `:nth-child`，但在计算时仅使用相同类型的相同元素。<br>:empty 选择一个或多个空元素。这仅适用于由过程指定为空的元素。<br>:before\
    \ 在元素之前插入内容。<br>:after 在元素之后插入内容<br>:not(…) 如果参数内的选择器不为真，则选择该元素。 |\n| ID 选择器 (ID\
    \ Selectors) | ID 选择器是根据 DOM 元素的 `id=` 属性选择元素的样式选择器。ID 在 DOM 中必须是唯一的，且 `id=` 属性中只能指定一个。ID\
    \ 选择器由 `#` 前缀指示。以下是一个带有 ID 选择器的 CSS 规则集： | `#idx1 { font-style: italic } |\n\n"
- fmt: "\n# Attribute Selectors\nAttribute selectors select DOM elements with the\
    \ specified attribute. ID selectors and class selectors are special case attribute\
    \ selectors. Attribute selectors use the following syntax to select attributes:\
    \ `[*attribute operator \"value\"]`\n\n| Operator | Description |\n| :--- | :---\
    \ |\n| | Operator specifies the operator. Operator allows partial matches. |\n\
    | `=` | matches the entire attribute value. |\n| `^=` | matches the beginning\
    \ of an attribute value. |\n| `=$ | matches the end of an attribute value. |\n\
    | `*=` | matches any substring in an attribute value. |\n| `~=` | matches any\
    \ space-separated word in an attribute value. This operator can be used to emulate\
    \ the class selector. |\n| `|=` matches an attribute value and an optional value\
    \ followed by a hyphen. This operator is used to match language codes such as\
    \ `enUS`, `en-GB`, and so on. |\n\n# Combinators\nCombinators are characters that\
    \ select an element based partially on its context within another element. This\
    \ is done by combining selectors using one of the following characters.\n\n| Character\
    \ | Description |\n| :--- | :--- |\n| `\" \"` (space) | indicates that the selector\
    \ to the left must match an element anywhere in the parentage of the currently\
    \ selected element. |\n| `>` | selects elements that are a direct descendent of\
    \ the specified element. |\n| `~` | selects elements that have another sibling\
    \ anywhere within the parent. |\n| `+` | selects elements that have a specified\
    \ element immediately preceding them |\n\n[*](#Chapter6.xhtml_ch6_tfn_3) This\
    \ is a special case that is used the same way as the `PRETEXT`, `PREIMAGE`, `POSTTEXT`,\
    \ and `POSTIMAGE` style attributes.\n\nFigure 6-1 – Excel Output Using the DOM\
    \ Option to Identify CSS Elements\n\n![image](images/f0051-01.jpg)\n\n[Figure\
    \ 6-1](#Chapter6.xhtml_ch6-fig1) is an image of the output of example [SAS Code\
    \ 6-1](#Chapter6.xhtml_ch6-pro1). It looks pretty simple. There are no surprises\
    \ here. The code in [SAS Code 6-1](#Chapter6.xhtml_ch6-pro1) did not apply any\
    \ style changes to the workbook. It only restricted the number of rows processed\
    \ so that the DOM trace output could be small enough to allow the identification\
    \ of a few CSS elements for use later.\n\n## The ODS ANCHOR= Option\nAn Anchor\
    \ tag is an important part of the ODS output. You can specify an `ANCHOR` or allow\
    \ ODS to generate them using default names. The syntax is to provide the keyword\
    \ `ANCHOR` and an `anchor-name`, as follows: `ANCHOR='anchor-name'`. The default\
    \ anchor name is `id=\"idx\"`. Once you specify the first anchor, that name is\
    \ used and a number is added to the end of the name for the next anchor. The code\
    \ in [SAS Code 6-2](#Chapter6.xhtml_ch6-pro2) created a user generated Cascading\
    \ Style Sheet with two references called `#Expense .header` and `#Expense .data`.\
    \ Each of these references modify some portion of the Excel output worksheet colors.\
    \ When you use an `ANCHOR`, you are changing the `ID=` attribute of the current\
    \ style sheet output in use, this is effective in both SAS style sheets and Cascading\
    \ style sheets (`#ID=`). To identify where these anchors appear in the output\
    \ style, use the DOM option. An example of how to use the ODS EXCEL DOM option\
    \ is described above, see [SAS Code 6-1](#Chapter6.xhtml_ch6-pro1).\n\nIn this\
    \ section I will provide a simple example. There are many documents, papers, and\
    \ books written on this subject in which you can find more examples. The official\
    \ website of the World Wide Web Consortium that maintains the CSS standards is\
    \ [https://www.w3.org/Style/CSS/](https://www.w3.org/Style/CSS/).\n\nAnother good\
    \ source of information about this type of data manipulation is a SAS Global Forum\
    \ paper found at the following URL: [http://support.sas.com/resources/papers/proceedings15/SAS1880-2015.pdf](http://support.sas.com/resources/papers/proceedings15/SAS1880-2015.pdf)\n\
    \nSAS Code 6-2 – Using a Style Sheet to Modify Excel Output.\n\n```sas\n*****\
    \ Build a Cascading Style Sheet file;\n\nfilename my_css \"css_text.css\";\n\n\
    data _null_;\n   file my_css noprint notitles linesize=256;\n   put\n      '#Expense\
    \ .header {background-color:orange}' /\n      '#Expense .data   {background-color:pink\
    \  }' ;\nrun;\n\nOds html close;\n\n***** Use a Cascading Style Sheet file;\n\n\
    ods excel cssstyle = \"css_text.css\"\n          options(sheet_interval='none');\n\
    \n***** Use an ANCHOR;\n\nods excel anchor=\"expense\";\n\nproc print data=sashelp.shoes(where=\n\
    \      (Product     = 'Boot'     and\n      Subsidiary = 'New York' and\n    \
    \  region      = 'United States'));\nrun;\n\nods excel close;\nods html;\n```\n\
    \nThe CSS file created in [SAS Code 6-2](#Chapter6.xhtml_ch6-pro2) modified the\
    \ background colors to Orange and Pink. The ODS EXCEL `cssstyle=` option is described\
    \ later. Figure 6-2 – Excel Output Using the ANCHOR= option\n\n![image](images/f0053-01.jpg)\n\
    Notice that Column `A` is a `DATA` element, not `HEADER`.\n\n## The _SIZING= Option\n\
    The `_SIZING=` option is hard to see, I will show the code here. The `_SIZING=`\
    \ option is not visible in the document, but the `SIZE` attribute is. The web\
    \ site provides more details: [http://www.w3.org/TR/2002/css-pos-model-3/](http://www.w3.org/TR/2002/css-pos-model-3/)\
    \ or [www.w3.org/TR/2002/css-box-model-3/](http://www.w3.org/TR/2002/css-box-model-3/).\
    \ The web page says that the `CONTENT=` option derives the width from the cell,\
    \ while the `BORDER=` option will derive the width of the border.\n\nSAS Code\
    \ 6-3 – The _SIZING= Option\n```sas\nods excel file = \"\\path\\box_sizing.xlsx\"\
    \n          _sizing=border_box;\n\nproc print data=Asia_only;\nrun;\n\nods excel\
    \ close;\n```\n\n## Using Cascading Style Sheets with the CSSSTYLE= Option\nSAS\
    \ and Cascading Style Sheet usage is pervasive, even I wrote a paper on the topic.\
    \ I showed how to create and include a simple CSS file into Excel using the ODS\
    \ destination. To save you from having to look up that paper I will include some\
    \ of the information.\n\n## Simple Color Changes Using a CSS File\nThis section\
    \ will provide an example of making simple color changes to the output Excel `body`,\
    \ `header`, `rowheader`, and `data` portions of the worksheet using a CSS file\
    \ generated in a few lines of SAS code.\n\nSAS Code 6-4 – Creating a Cascading\
    \ Style Sheet File and Simple SAS Work File\n```sas\n* Define a CSS output file;\n\
    filename css \"\\path.\\my_css_1.css\";\n\n* Write a css file;\ndata _null_;\n\
    \   file css noprint linesize=132;\n   put\n      \".body  {background-color:\
    \ lightblue;  } /\n      \".header{background-color: gold;   } /\n      \".rowheader\
    \ {background-color: purple;   \" /\n      \"            color: white;       \
    \     } /\n      \".data  {background-color: lightgreen; } \" ;\nrun;\n\n* Create\
    \ a simple file to write to Excel;\noptions linesize=255;\ndata test_css;\n  \
    \ Column_a =  'My test item 1'; output;\n```\n"
  raw: "| Attribute Selectors | Attribute selectors select DOM elements with the specified\
    \ attribute. ID selectors and class selectors are special case attribute selectors.\
    \ Attribute selectors use the following syntax to select attributes:[*attribute\
    \ operator \"value\"*] \n\nOperator specifies the operator.Operator allows partial\
    \ matches. | = matches the entire attribute value. \n\n^= matches the beginning\
    \ of an attribute value.\n\n=$ matches the end of an attribute value.\n\n*= matches\
    \ any substring in an attribute value.\n\n**~=** matches any space-separated word\
    \ in an attribute value. This operator can be used to emulate the class selector.\n\
    \n&#124;= matches an attribute value and an optional value followed by a hyphen.\
    \ This operator is used to match language codes such as enUS, en-GB, and so on.\
    \ |\n\n| Combinators | Combinators are characters that select an element based\
    \ partially on its context within another element. This is done by combining selectors\
    \ using one of the following characters. | \" \" (space) indicates that the selector\
    \ to the left must match an element anywhere in the parentage of the currently\
    \ selected element. \n\n**>** selects elements that are a direct descendent of\
    \ the specified element.\n\n~ selects elements that have another sibling anywhere\
    \ within the parent.\n\n+ selects elements that have a specified element immediately\
    \ preceding them |\n\n[*](#Chapter6.xhtml_ch6_tfn_3) This is a special case that\
    \ is used the same way as the PRETEXT, PREIMAGE, POSTTEXT, and POSTIMAGE style\
    \ attributes.\n\nFigure 6-1 – Excel Output Using the DOM Option to Identify CSS\
    \ Elements\n\n![image](images/f0051-01.jpg)\n\n[Figure 6-1](#Chapter6.xhtml_ch6-fig1)\
    \ is an image of the output of example [SAS Code 6-1](#Chapter6.xhtml_ch6-pro1).\
    \ It looks pretty simple. There are no surprises here. The code in [SAS Code 6-1](#Chapter6.xhtml_ch6-pro1)\
    \ did not apply any style changes to the workbook. It only restricted the number\
    \ of rows processed so that the DOM trace output could be small enough to allow\
    \ the identification of a few CSS elements for use later.\n\n### The ODS ANCHOR=\
    \ Option\n\nAn Anchor tag is an important part of the ODS output. You can specify\
    \ an “ANCHOR” or allow ODS to generate them using default names. The syntax is\
    \ to provide the keyword ANCHOR and an anchor-name, as follows: ANCHOR='anchor-name'.\
    \ The default anchor name is id=\"idx\". Once you specify the first anchor, that\
    \ name is used and a number is added to the end of the name for the next anchor.\
    \ The code in [SAS Code 6-2](#Chapter6.xhtml_ch6-pro2) created a user generated\
    \ Cascading Style Sheet with two references called “#Expense .header” and ‘#Expense\
    \ .data”. Each of these references modify some portion of the Excel output worksheet\
    \ colors. When you use an ANCHOR, you are changing the ID= attribute of the current\
    \ style sheet output in use, this is effective in both SAS style sheets and Cascading\
    \ style sheets (#ID=). To identify where these anchors appear in the output style,\
    \ use the DOM option. An example of how to use the ODS EXCEL DOM option is described\
    \ above, see [SAS Code 6-1](#Chapter6.xhtml_ch6-pro1).\n\nIn this section I will\
    \ provide a simple example. There are many documents, papers, and books written\
    \ on this subject in which you can find more examples. The official website of\
    \ the World Wide Web Consortium that maintains the CSS standards is [https://www.w3.org/Style/CSS/](https://www.w3.org/Style/CSS/).\n\
    \nAnother good source of information about this type of data manipulation is a\
    \ SAS Global Forum paper found at the following URL: [http://support.sas.com/resources/papers/proceedings15/SAS1880-2015.pdf](http://support.sas.com/resources/papers/proceedings15/SAS1880-2015.pdf)\n\
    \nSAS Code 6-2 – Using a Style Sheet to Modify Excel Output.\n\n***** Build a\
    \ Cascading Style Sheet file;\n\nfilename my_css \"css_text.css\";\n\ndata _null_;\n\
    \n   file my_css noprint notitles linesize=256;\n\n   put\n\n      '#Expense .header\
    \ {background-color:orange}' /\n\n      '#Expense .data   {background-color:pink  }'\
    \ ;\n\nrun;\n\nOds html close;\n\n***** Use a Cascading Style Sheet file;\n\n\
    ods excel cssstyle = \"css_text.css\"\n\n          options(sheet_interval='none');\n\
    \n***** Use an ANCHOR;\n\nods excel anchor=\"expense\";\n\nproc print data=sashelp.shoes(where=\n\
    \n      (Product    = 'Boot'     and\n\n       Subsidiary = 'New York' and\n\n\
           region     = 'United States'));\n\nrun;\n\nods excel close;\n\nods html;\n\
    \nThe CSS file created in [SAS Code 6-2](#Chapter6.xhtml_ch6-pro2) modified the\
    \ background colors to Orange and Pink. The ODS EXCEL CSSSTYLE= option is described\
    \ later in this chapter.\n\nFigure 6-2 – Excel Output Using the ANCHOR= option\
    \ and a CSS File to Change Excel Output\n\n![image](images/f0053-01.jpg)\n\nNotice\
    \ that Column ‘A’ Row ‘2’ is not a “DATA” element, it is a ROW HEADER.The CSS\
    \ file does not contain background color instructions for ROW HEADER; therefore,\
    \ it is given the default background color of white.\n\n### The BOX_SIZING= Option\n\
    \nThe output of this option is hard to see, I will show the code here for one\
    \ of the options, but not the output because the difference from the default output\
    \ is not really noticeable at the resolution available in this document. This\
    \ option interacts with the borders of the cells of the output Excel worksheet.\
    \ I found that the differences are as small as one or two pixels and the width\
    \ of the boarders are only noticeable at very large magnifications. It is also\
    \ closely tied to Cascading Style Sheet processing. The SAS Documentation points\
    \ to the following WC3/CSS3 website for a more detailed description. [http://www.w3.org/TR/2002/WD-css3-box-20021024/#box-sizing](http://www.w3.org/TR/2002/WD-css3-box-20021024/#box-sizing).\
    \ However, the syntax shown on the web page does not seem to apply to the SAS\
    \ syntax. The web site basically says that the difference is that the CONTENT_BOX=\
    \ option derives the width from the content of the cell, while the BORDER_BOX=\
    \ option will derive the width of the cell from calculations that include the\
    \ width of the border and the padding. Both of these definitions are expressed\
    \ (visible) as changes in the number of pixels used to print the border of an\
    \ Excel data cell.\n\nSAS Code 6-3 – The BOX_SIZING= Option\n\nods excel file\
    \ = \"&path\\box_sizing_border_box.xlsx\"\n\n          box_sizing=border_box;\n\
    \n   **proc print** data=Asia_only;\n\n   **run**;\n\nods excel close;\n\n###\
    \ Using Cascading Style Sheets with the CSSSTYLE= Option\n\nSAS and Cascading\
    \ Style Sheet usage is so pervasive, even I wrote a paper on the topic [[1](#Chapter6.xhtml_ch6fn_1)].\
    \ I showed how to create and include a simple CSS file into Excel using the ODS\
    \ Excel destination. To save you from having to look up that paper I will include\
    \ some of the information here.\n\n[[1](#Chapter6.xhtml_ch6_fn_1)] Benjamin, William\
    \ E, Jr. Owl Computer Consultancy, LLC, Phoenix AZ, 2016\\. “Working with the\
    \ SAS® ODS EXCEL Destination to Send Graphs, and Use Cascading Style Sheets When\
    \ Writing to EXCEL Workbooks” Published on the WEB site [http://www.mwsug.org/proceedings/2016/HW/MWSUG-2016-HW04.pdf](http://www.mwsug.org/proceedings/2016/HW/MWSUG-2016-HW04.pdf).\n\
    \n### Simple Color Changes Using a CSS File\n\nThis section will provide an example\
    \ of making simple color changes to the output Excel worksheet “body”, “header”,\
    \ “rowheader”, and “data” portions of the worksheet using a CSS file generated\
    \ in a few lines of SAS code.\n\nSAS Code 6-4 – Creating a Cascading Style Sheet\
    \ File and a Simple SAS Work File\n\n   * Define a CSS output file;\n\n  filename\
    \ css \"&path.\\my_css_1.css\";\n\n  * Write a css file;\n\n  data _null_;\n\n\
      file css noprint linesize=132;\n\n  put\n\n  \".body  {background-color: lightblue;  }\
    \ \" /\n\n  \".header{background-color: gold;       } \" /\n\n  \".rowheader {background-color:\
    \ purple;   \" /\n\n  \"            color: white;             } \" /\n\n  \".data  {background-color:\
    \ lightgreen; } \" ;\n\n   run;\n\n   * Create a simple file to write to Excel;\n\
    \n   options linesize=255;\n\n   data test_css;\n\n       Column_a =  'My test\
    \ item 1'; output;"
