  raw: '[SAS Code 9-18](#Chapter9.xhtml_ch9-pro18) reproduces the header from the
    first page on all of the output pages.


    Figure 9-25 – Showing the ROW_REPEAT=‘HEADER’ Option Settings


    ![image](images/f0181-01.jpg)


    Only row one of the spreadsheet is repeated on the pages.


    Figure 9-26 – Output from the ROW_REPEAT= ‘HEADER’ Setting


    ![image](images/f0182-01.jpg)


    This is another way to get the headers to print on the output pages. Only part
    of the page is reproduced in [Figure 9-26](#Chapter9.xhtml_ch9-fig26).


    ### The FORMULAS= Suboption


    Anyone who has used Excel for any length of time has probably become familiar
    with the fact that you can use Excel formulas to calculate any number of things.
    Well, this suboption enables you to use SAS to set up formulas as fields in the
    output data set to be implemented when Excel opens the data file. The default
    is that using the data as a formula is turned off. When you want to use the FORMULAS=’ON’
    suboption, any data field that begins with an equal sign (=) activates the formula
    processing. The FORMULAS= suboption might not be the only way to add a formula
    to an Excel worksheet.


    The DATA step here is creating a SAS character value that contains an equal sign,
    and the values of the fields Sales and Returns so that the net value of Sales
    minus Returns can be calculated. When formula processing is turned off, the character
    values are visible. When formulas are turned on, the calculation occurs and the
    value is displayed because of the prepended equal sign.


    The code in [SAS Code 9-19](#Chapter9.xhtml_ch9-pro19) is required for use with
    both [SAS Code 9-20](#Chapter9.xhtml_ch9-pro20) and [SAS Code 9-21](#Chapter9.xhtml_ch9-pro21).
    This code builds a SAS data set that has a new column called “NET_SALES”. The
    formula subtracts returns from sales to calculate “NET_SALES”. This calculation
    is not done for the header row by adding one to the value of the _n_ variable.
    Other methods of reading the ASIA_ONLY data set might not work the same as the
    method I choose here.


    SAS Code 9-19 Example of how to setup a data field to activate Excel formula processing.


       data ASIA_FORMULAS;


         set Asia_only;


         row = _n_ + 1;


         net_sales =  ''=''                          ||


                       left(trim(put(sales,9.)))   ||


                       ''-''                         ||


                       left(trim(put(returns,9.)))


                       ;


       run;


    Execute the code in [SAS Code 9-19](#Chapter9.xhtml_ch9-pro19) before using either
    [SAS Code 9-20](#Chapter9.xhtml_ch9-pro20) or [SAS Code 9-21](#Chapter9.xhtml_ch9-pro21).
    No output figure is shown for this code.


    SAS Code 9-20 Print Example with the FORMULA sub-option set to ‘OFF’.


    ods excel file = "&path\Formulas_off.xlsx"


             options(formulas=''off'');


      proc print data=Asia_formulas;


      run;


    ods excel close;


    Figure 9-27 Net_Sales shown with formulas turned off.


    ![image](images/f0183-01.jpg)


    Without formulas turned on, the Net_Sales column does not make sense.


    SAS Code 9-21 – Print Example with the FORMULA= Suboption Set to ‘ON’


    ods excel file = "&path\Formulas_on.xlsx"


             options(formulas=''on'');


      proc print data=Asia_formulas;


      run;


    ods excel close;


    Figure 9-28 – Net_Sales Shown with Formulas Turned On


    ![image](images/f0184-01.jpg)


    This image shows that the formula for Net_Sales was executed. But notice that
    the column is left justified, which indicates that the field contains a character
    value and, by default, is not formatted.


    ### The START_AT= Suboption


    The START_AT= suboption is a handy way to place your output into the Excel worksheet
    somewhere other than the default top-left corner of the worksheet (cell A1). This
    option gives you the freedom to place the output into any row and column of your
    output worksheet, allowing you to move your data under rows of blank cells. CSS
    style sheets described in [Chapter 6](#Chapter6.xhtml) can be used to add images
    into the worksheet, and the START_AT= suboption can be used to position your data.
    SAS 9.4M4 also has added the ability to use alphabetic characters for the column
    identifiers as in cell “A1”. The value ‘4,5’ is ‘Column,Row’ format.


    SAS Code 9-22 – Using the START_AT= Suboption to Offset the Data within the Excel
    Worksheet


    ods excel file = "&path\Starting_at.xlsx"


             options(start_at=''4,5'');


       proc print data=Asia_only;


      run;


    ods excel close;


    Figure 9-29 – Showing the Output Data Offset to cell ‘D5’, Column 4, Row 5


    ![image](images/f0185-01.jpg)


    Often a company will have a logo used specifically to brand corporate Excel spreadsheets.
    This option gives you a way to free up space for that logo (or anything else)
    without having to manually move the data. See [Chapter 6](#Chapter6.xhtml) for
    using CSS style options to add images.


    ### Conclusion


    In this chapter, we discussed many ODS Excel destination suboptions that allowed
    us to manipulate features of the Excel worksheet rows, columns, and cells at the
    time that SAS is executing. With these options, you are able to set filters, hide
    columns or rows, freeze headers or row labels, adjust the height and width of
    the output rows, execute formulas, and even control the spacing of the whole report.
    These options are especially advantageous for anyone who does not want to open
    their Excel workbooks to modify the sheets.


