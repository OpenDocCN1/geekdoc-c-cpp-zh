    \n![image](images/f0033-01.jpg)\n\n### The `ID=` Option\n\nThe `ID=` option enables\
    \ you to create multiple instances of `ODS` output from the same SAS code. Having\
    \ different `ID` values enables you to apply different options and suboptions\
    \ to separate output. The `ID=` option can be very useful if you need multiple\
    \ copies of the same data. If you need a working Excel spreadsheet, a printable\
    \ Excel workbook, or a PDF for outside delivery, you can use the `ID=` option\
    \ to produce these copies in one process. The ability to do this enables you to\
    \ have a working copy to markup and verify, a production copy to ship, and a PDF\
    \ copy for documentation, without rerunning the job. My example here produces\
    \ three files, two Excel workbooks and a PDF file. I will discuss these files\
    \ separately. In the [SAS Code 5-2](#Chapter5.xhtml_ch5-pro2) example I did not\
    \ use the `ID=` option on the first `ODS EXCEL` statement to show that it is not\
