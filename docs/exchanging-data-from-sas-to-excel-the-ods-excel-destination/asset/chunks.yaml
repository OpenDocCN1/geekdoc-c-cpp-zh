    ### Introduction


    In this chapter I will be discussing and showing examples that impact the appearance
    of the final output Excel worksheet. This includes SAS Style options, Cascading
    Style Sheets, and options that affect the location, density, and size of text
    and images in the output Excel worksheets. These options control worksheet-level
    features of the output Excel file.


    Using these options, you can modify the way the basic colors of the spreadsheet
    appear, and the size of the cells in the output worksheet. Text can be added to
    the worksheet, anchors for hyperlinks can be added, graphical image density can
    be modified, default SAS styles can change the worksheet, and external cascading
    style sheets can be applied. All of these features can be added manually after
    the workbook is created, but these options enable you to make the desired output
    when the workbook is created. This allows the workbook to be displayed the way
    that you want it to appear and have the creation and last modified date be the
    same. Again, the SAS data set “ASIA_ONLY” is defined in [Chapter 2](#Chapter2.xhtml).


    ### Arguments That Affect Worksheet-Level Output Features


    In this chapter we will discuss the following SAS ODS Excel destination topics.
    I consider these topics to affect the overall appearance of the output worksheet.


    Table 6-1 – ODS Excel Destination Actions


    | **Action Parameter / Alias** | **Options** | **Description** |


    | DOM | File=“quoted external filename” or Blanks meaning no defined file name.
    | This option writes the output from the document object model to either an external
    file or the SAS Log if no file name is supplied.[*](#Chapter6.xhtml_ch6tfn_1)
    |


    | ANCHOR | ''anchor-name'' | Specifies the anchor tag name, ''IDX'' is the default
    first anchor. |


    | BOX_SIZING | CONTENT_BOX or BORDER_BOX | This option describes how to measure
    the width of the cells (this can also be adjusted by using the SAS Registry[**](#Chapter6.xhtml_ch6tfn_2)).
    |


    | CSSSTYLE | ''file-specification''<(media-type1<...media-type-10>)> | Fully qualified
    name of a Cascading Style |


    | IMAGE_DPI/DPI | ''number'' | Dots per inch to use for graphical output |


    | STYLE | style-override(s) | Use a predefined style element (a collection of
    style changes) or a single (or group of) style name-value pair of changes. |


    | TEXT | text-string | Inserts a text string into the output document. |


    [*](#Chapter6.xhtml_ch6_tfn_1) For more information about the ODS document object
    model (DOM), see the following URL: [http://support.sas.com/documentation/cdl/en/odsadvug/69833/HTML/default/viewer.htm#n0pg2pc6qv5vzhn160f8j7ap4uv1.htm](http://support.sas.com/documentation/cdl/en/odsadvug/69833/HTML/default/viewer.htm#n0pg2pc6qv5vzhn160f8j7ap4uv1.htm)
    or the SAS manual “SAS Institute Inc. 2016. *SAS® 9.4 Output Delivery System:
    Advanced Topics, Third Edition*. Cary, NC: SAS Institute Inc.”'
