- fmt: "\n# Figure 7-1 – Excel Output with the `EMBEDDED_FOOTNOTES=` Option Off\n\n\
    ![image](images/f0073-01.jpg)\n\nWith the `EMBEDDED_FOOTNOTES=` option turned\
    \ off, no SAS footnotes appear at the bottom of the output worksheet. This is\
    \ the default setting for the `EMBEDDED_FOOTNOTES=` suboption. This works well\
    \ for most applications because it does not place alphabetic characters in any\
    \ columns of the output worksheet.\n\n### Embedded Footnotes Turned On\n\nWhen\
    \ `EMBEDDED_FOOTNOTES` are turned on, then footnotes sent from SAS are displayed\
    \ on the Excel worksheet pages. See [SAS Code 7-2](#Chapter7.xhtml_ch7-pro2) for\
    \ the code.\n\n#### SAS Code 7-2 – Using the `EMBEDDED_FOOTNOTES='ON'` Option\n\
    \nCode to generate the Excel file in [Figure 7-2](#Chapter7.xhtml_ch7-fig2);;\n\
    \n```sas\nods excel file = \"&path\\Footnote_on.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\n#### Figure\
    \ 7-2 – Excel Output with the `EMBEDDED_FOOTNOTES=` Option On\n\n![image](images/f0074-01.jpg)\n\
    \n[Figure 7-2](#Chapter7.xhtml_ch7-fig2) shows a worksheet with the `EMBEDDED_FOOTNOTES=`\
    \ option turned on. The SAS footnote appears at the bottom of the output worksheet.\
    \ Here the suboption `EMBEDDED_FOOTNOTES` produces the footnote text ‘footnote\
    \ one’ after the bottom of the output table.\n\n### Embedded Footnotes=‘ON’ with\
    \ Multiple Outputs on a Worksheet\n\nWhen using the `SHEET_INTERVAL='NONE'` suboption\
    \ with the `EMBEDDED_FOOTNOTES=` suboption, multiple SAS outputs can appear on\
    \ the same worksheet and footnotes can be displayed for each output from SAS.\
    \ See [SAS Code 7-3](#Chapter7.xhtml_ch7-pro3) for a coding example and [Figure\
    \ 7-3](#Chapter7.xhtml_ch7-fig3) for an example of the Excel output.\n\n#### SAS\
    \ Code 7-3 – Using `EMBEDDED_FOOTNOTES` and `SHEET_INTERVAL` Suboptions.\n\nCode\
    \ to generate the Excel file in [Figure 7-3](#Chapter7.xhtml_ch7-fig3);;\n\n```sas\n\
    ods excel file = \"&path\\Footnote_on_multiple.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on'\n\
    \            SHEET_INTERVAL='none');\n    proc print data=Asia_only;\n    run;\n\
    \    footnote 'footnote two';\n    proc print data=Asia_only;\n    run;\nods excel\
    \ close;\n```\n\nThis code produces an Excel worksheet with two output tables\
    \ and a footnote after each table. See [Figure 7-3](#Chapter7.xhtml_ch7-fig3)\
    \ for details.\n\n#### Figure 7-3 – `EMBEDDED_FOOTNOTES=` Option On and Multiple\
    \ Outputs on One Worksheet\n\n![image](images/f0075-01.jpg)\n\nIn [Figure 7-3](#Chapter7.xhtml_ch7-fig3),\
    \ the `EMBEDDED_FOOTNOTES=` option produces the footnote text ‘foot note one’\
    \ after the first output table and the footnote ‘foot note two’ after the second\
    \ table. Both of these output tables were sent to the same worksheet with the\
    \ `SHEET_INTERVAL=`Suboption.\n\n### The `EMBED_FOOTNOTES_ONCE=` Suboption\n\n\
    In [SAS Code 7-4](#Chapter7.xhtml_ch7-pro4) the `EMBED_FOOTNOTES_ONCE=` suboption\
    \ is used in conjunction with the `EMBEDDED_FOOTNOTES=` suboption. Because [SAS\
    \ Code 7-4](#Chapter7.xhtml_ch7-pro4) only outputs one SAS table to Excel, the\
    \ `EMBED_FOOTNOTES_ONCE` suboption as it is used here looks like extra code that\
    \ does nothing. However, the code in [SAS Code 7-5](#Chapter7.xhtml_ch7-pro5)\
    \ sends two tables to the output Excel worksheet. The output with `EMBEDDED_FOOTNOTES='OFF'`\
    \ is not shown here because it looks the same as [Figure 7-1](#Chapter7.xhtml_ch7-fig1).\n\
    \n#### `EMBED_FOOTNOTES_ONCE` with Only One Output Table\n\n#### SAS Code 7-4\
    \ – Showing How to Print Footnotes Only Once on a Worksheet\n\n```sas\nfootnote\
    \ 'foot note one';\nods excel file = \"&path\\Footnote_once_on.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on'\n\
    \            EMBED_FOOTNOTES_ONCE='on');\n    proc print data=Asia_only;\n   \
    \ run;\nods excel close;\n```\n\nOnly one table and one footnote is output by\
    \ the [SAS Code 7-4](#Chapter7.xhtml_ch7-pro4).\n\n#### Figure 7-4 – Excel Output\
    \ with `EMBEDDED_FOOTNOTES` and `EMBED_FOOTNOTES_ONCE` Set to ‘ON’\n\n![image](images/f0076-01.jpg)\n\
    \nIt looks like the [SAS Code 7-4](#ch7.xhtml_ch7-pro4) did nothing, but look\
    \ at [SAS Code 7-5](#Chapter7.xhtml_ch7-pro5) to see a different result.\n\n###\
    \ `EMBED_FOOTNOTES_ONCE` with More Than Output Table\n\nIn [SAS Code 7-5](#Chapter7.xhtml_ch7-pro5)\
    \ two footnotes and two output tables are coded and the result is shown in [Figure\
    \ 7-5](#Chapter7.xhtml_ch7-fig5). The `EMBED_FOOTNOTES_ONCE=` suboption forced\
    \ the last footnote to appear at the bottom of each page. However, footnotes can\
    \ be changed if the output worksheet changes.\n\n#### SAS Code 7-5 – Printing\
    \ the Last Footnote Once on a Worksheet\n\n```sas\nfootnote 'foot note one';\n\
    ods excel file = \"&path\\Footnote_on_multiple.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on'\n\
    \            EMBED_FOOTNOTES_ONCE='on'\n            SHEET_INTERVAL='none');\n\
    \    proc print data=Asia_only;\n    run;\n    footnote 'foot note two';\n   \
    \ proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nThe footnote\
    \ ‘foot note one’ will not appear on the output Excel because it is not the last\
    \ footnote output to the worksheet. `SHEET_INTERVAL='NONE'` causes both tables\
    \ to appear on the same worksheet.\n\n#### Figure 7-5 – Excel Output with `EMBEDDED_FOOTNOTES_ONCE`\
    \ and Multiple Outputs on a Page\n\n![image](images/f0078-01.jpg)\n\nHere the\
    \ combination of `EMBED_FOOTNOTES_ONCE` and `EMBEDDED_FOOTNOTES` suppresses the\
    \ footnote ‘foot note one’ that was displayed in [Figure 7-3](#Chapter7.xhtml_ch7-fig3).\
    \ Only the most active footnote is displayed. This is often used with the `EMBEDDED_TITLES`\
    \ option to place the SAS titles and footnotes onto the Excel worksheet. When\
    \ multiple pages are produced the footnotes appear on each page,\n\n### The `EMBEDDED_TITLES=`\
    \ Suboption\n\n`EMBEDDED_TITLES=` suboption shown here sends the SAS titles to\
    \ the output Excel worksheet. This is often used with the `EMBEDDED_FOOTNOTES=`\
    \ suboption to place the SAS titles and footnotes onto the Excel worksheet. When\
    \ multiple pages are produced the titles appear on each page. The titles can be\
    \ changed and the new title will appear on the next output worksheet. When multiple\
    \ outputs are sent to one worksheet, the titles can be changed between procedure\
    \ outputs on the same worksheet.\n\n### `EMBEDDED_TITLES='OFF'`\n\n`EMBEDDED_TITLES='OFF'`\
    \ is the default value for this suboption. [SAS Code 7-6](#Chapter7.xhtml_ch7-pro6)\
    \ shows how to code this suboption. Because you can code many `ODS EXCEL` statements,\
    \ you can turn this suboption on and off, but turning it on and off is only effective\
    \ if the worksheet changes.\n\n#### SAS Code 7-6 – Using the `EMBEDDED_TITLES='OFF'`\
    \ Suboption\n\n```sas\ntitle 'title one';\nods excel file = \"&path\\Title_off.xlsx\"\
    \n    options(EMBEDDED_TITLES='off');\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\nThe [SAS Code 7-6](#ch7.xhtml_ch7-pro6) above is the\
    \ same as the default and it produces a worksheet with no titles, as shown in\
    \ [Figure 7-6](#Chapter7.xhtml_ch7-fig6) below.\n\n#### Figure 7-6 – Excel Output\
    \ with `EMBEDDED_TITLES='OFF'`\n\n![image](images/f0079-01.jpg)\n\nThis is the\
    \ default output when the `EMBEDDED_TITLES=` option is either set to ‘OFF’ or\
    \ not used.\n\n### `EMBEDDED_TITLES='ON'`\n\n`EMBEDDED_TITLES='ON'` suboption\
    \ causes the SAS `TITLE` to be output in the Excel worksheets that are generated\
    \ by the ODS Excel output. [Figure 7-7](#Chapter7.xhtml_ch7-fig7) shows the Excel\
    \ output worksheet created by [SAS Code 7-7](#Chapter7.xhtml_ch7-pro7).\n\n####\
    \ SAS Code 7-7 – Using `EMBEDDED_TITLES='ON'`\n\n```sas\ntitle 'title one';\n\
    ods excel file = \"&path\\Title_on.xlsx\"\n    options(EMBEDDED_TITLES='on');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\n#### Figure\
    \ 7-7 – Excel Output with `EMBEDDED_TITLES='ON'`\n\n![image](images/f0080-01.jpg)\n\
    \n[Figure 7-7](#ch7.xhtml_ch7-fig7) shows the title at the top of the Excel worksheet.\n\
    \n#### SAS Code 7-8 – `EMBEDDED_TITLES='ON'` and `SHEET_INTERVAL='NONE'`\n\n```sas\n\
    title 'title one';\nods excel file = \"&path\\Titles_on_multiple.xlsx\"\n    options(EMBEDDED_TITLES='on'\n\
    \            SHEET_INTERVAL='none');\n    proc print data=Asia_only;\n    run;\n\
    \    title 'title two';\n    proc print data=Asia_only;\n    run;\nods excel close;\n\
    ```\n"
  raw: 'Figure 7-1 – Excel Output with the EMBEDDED_FOOTNOTES= Option Off


    ![image](images/f0073-01.jpg)


    With the EMBEDDED_FOOTNOTES= option turned off, no SAS footnotes appear at the
    bottom of the output worksheet. This is the default setting for the EMBEDDED_FOOTNOTES=
    suboption.This works well for most applications because it does not place alphabetic
    characters in any columns of the output worksheet.


    ### Embedded Footnotes Turned On


    When EMBEDDED_FOOTNOTES are turned on, then footnotes sent from SAS are displayed
    on the Excel worksheet pages. See [SAS Code 7-2](#Chapter7.xhtml_ch7-pro2) for
    the code.


    SAS Code 7-2 – Using the EMBEDDED_FOOTNOTES=’ON’ Option


    ** Code to generate the Excel file in [Figure 7-2](#Chapter7.xhtml_ch7-fig2) ***;


    ods excel file = "&path\Footnote_on.xlsx"


              options(EMBEDDED_FOOTNOTES=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-2 – Excel Output with the EMBEDDED_FOOTNOTES= Option On


    ![image](images/f0074-01.jpg)


    [Figure 7-2](#Chapter7.xhtml_ch7-fig2) shows a worksheet with the EMBEDDED_FOOTNOTES=
    option turned on. The SAS footnote appears at the bottom of the output worksheet.
    Here the suboption EMBEDDED_FOOTNOTES produces the footnote text ‘footnote one’
    after the bottom of the output table.


    ### Embedded Footnotes=‘ON’ with Multiple Outputs on a Worksheet


    When using the SHEET_INTERVAL=‘NONE’ suboption with the EMBEDDED_FOOTNOTES= suboption,
    multiple SAS outputs can appear on the same worksheet and footnotes can be displayed
    for each output from SAS. See [SAS Code 7-3](#Chapter7.xhtml_ch7-pro3) for a coding
    example and [Figure 7-3](#Chapter7.xhtml_ch7-fig3) for an example of the Excel
    output.


    SAS Code 7-3 – Using EMBEDDED_FOOTNOTES and SHEET_INTERVAL Suboptions.


    ** Code to generate the Excel file in [Figure 7-3](#Chapter7.xhtml_ch7-fig3) ***;


    ods excel file = "&path\Footnote_on_multiple.xlsx"


              options(EMBEDDED_FOOTNOTES=''on''


                      SHEET_INTERVAL=''none'');


       proc print data=Asia_only;


       run;


       footnote ''footnote two'';


       proc print data=Asia_only;


       run;


    ods excel close;


    This code produces an Excel worksheet with two output tables and a footnote after
    each table. See [Figure 7-3](#Chapter7.xhtml_ch7-fig3) for details.


    Figure 7-3 – EMBEDDED_FOOTNOTES= Option On and Multiple Outputs on One Worksheet


    ![image](images/f0075-01.jpg)


    In [Figure 7-3](#Chapter7.xhtml_ch7-fig3), the EMBEDDED_FOOTNOTES= option produces
    the footnote text ‘foot note one’ after the first output table and the footnote
    ‘foot note two’ after the second table. Both of these output tables were sent
    to the same worksheet with the SHEET_INTERVAL=Suboption.


    ### The EMBED_FOOTNOTES_ONCE= Suboption


    In [SAS Code 7-4](#Chapter7.xhtml_ch7-pro4) the EMBED_FOOTNOTES_ONCE= suboption
    is used in conjunction with the EMBEDDED_FOOTNOTES= suboption. Because [SAS Code
    7-4](#Chapter7.xhtml_ch7-pro4) only outputs one SAS table to Excel, the EMBED_FOOTNOTES_ONCE
    suboption as it is used here looks like extra code that does nothing. However,
    the code in [SAS Code 7-5](#Chapter7.xhtml_ch7-pro5) sends two tables to the output
    Excel worksheet. The output with EMBEDDED_FOOTNOTES=‘OFF’ is not shown here because
    it looks the same as [Figure 7-1](#Chapter7.xhtml_ch7-fig1).


    ### EMBED_FOOTNOTES_ONCE with Only One Output Table


    SAS Code 7-4 – Showing How to Print Footnotes Only Once on a Worksheet


    Footnote ''foot note one'';


    ods excel file = "&path\Footnote_once_on.xlsx"


              options(EMBEDDED_FOOTNOTES=''on''


                      EMBED_FOOTNOTES_ONCE=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Only one table and one footnote is output by the [SAS Code 7-4](#Chapter7.xhtml_ch7-pro4)
    example.


    Figure 7-4 – Excel Output with EMBEDDED_FOOTNOTES and EMBED_FOOTNOTES_ONCE Set
    to ‘ON’


    ![image](images/f0076-01.jpg)


    It looks like the [SAS Code 7-4](#Chapter7.xhtml_ch7-pro4) did nothing, but look
    at [SAS Code 7-5](#Chapter7.xhtml_ch7-pro5) to see a different result.


    ### EMBED_FOOTNOTES_ONCE with More Than One Output Table


    In [SAS Code 7-5](#Chapter7.xhtml_ch7-pro5) two footnotes and two output tables
    are coded and the result is shown in [Figure 7-5](#Chapter7.xhtml_ch7-fig5). The
    EMBED_FOOTNOTES_ONCE= suboption forced only the last footnote to appear at the
    bottom of each page. However, footnotes can be changed if the output Excel worksheet
    changes.


    SAS Code 7-5 – Printing the Last Footnote Only Once on a Worksheet


    Footnote ''foot note one'';


    ods excel file = "&path\Footnote_once_on_multiple.xlsx"


              options(EMBEDDED_FOOTNOTES=''on''


                      EMBED_FOOTNOTES_ONCE=''on''


                      SHEET_INTERVAL=''none'');


       proc print data=Asia_only;


       run;


       Footnote ''foot note two'';


       proc print data=Asia_only;


       run;


    ods excel close;


    The footnote ‘foot note one’ will not appear on the output Excel worksheet because
    it is not the last footnote output to the worksheet. SHEET_INTERVAL=‘NONE’ causes
    both tables to appear on the same Excel worksheet.


    Figure 7-5 – Excel Output with EMBED_FOOTNOTES_ONCE and Multiple Outputs on a
    Page


    ![image](images/f0078-01.jpg)


    Here the combination of EMBED_FOOTNOTES_ONCE and EMBEDDED_FOOTNOTES suppresses
    the footnote ‘foot note one’ that was displayed in [Figure 7-3](#Chapter7.xhtml_ch7-fig3).
    Only the most active footnote is displayed. This is often used with the EMBEDDED_TITLES
    option to place the SAS titles and footnotes onto the Excel worksheet pages. When
    multiple pages are produced the footnotes appear on each page,


    ### The EMBEDDED_TITLES= Suboption


    The EMBEDDED_TITLES= suboption shown here sends the SAS titles to the output Excel
    worksheet. This is often used with the EMBEDDED_FOOTNOTES= suboption to place
    the SAS titles and footnotes onto the Excel worksheet pages. When multiple pages
    are produced the titles appear on each page. The titles can be changed and the
    new title will appear on the next output worksheet. When multiple outputs are
    sent to one worksheet, the titles can be changed between procedure outputs on
    the same worksheet.


    ### EMBEDDED_TITLES=‘OFF’


    EMBBEDDED_TITLES =‘OFF’ is the default value for this suboption. [SAS Code 7-6](#Chapter7.xhtml_ch7-pro6)
    shows how to code this suboption. Because you can code many ODS EXCEL statements,
    you can turn this suboption on and off, but turning it on and off is only effective
    if the worksheet changes.


    SAS Code 7-6 – Using the EMBEDDED_TITLES=‘OFF’ Suboption


    Title ''title one'';


    ods excel file = "&path\Title_off.xlsx"


              options(EMBEDDED_TITLES=''off'');


       proc print data=Asia_only;


       run;


    ods excel close;


    The [SAS Code 7-6](#Chapter7.xhtml_ch7-pro6) above is the same as the default
    and it produces a worksheet with no titles, as shown in [Figure 7-6](#Chapter7.xhtml_ch7-fig6)
    below.


    Figure 7-6 – Excel Output with EMBEDDED_TITLES=‘OFF’


    ![image](images/f0079-01.jpg)


    This is the default output when the EMBEDDED_TITLES= option is either set to ‘OFF’
    or not used.


    ### EMBEDDED_TITLES=‘ON’


    The EMBEDDED_TITLES=‘ON’ suboption causes the SAS TITLE to be output in the Excel
    worksheets that are generated by the ODS Excel output. [Figure 7-7](#Chapter7.xhtml_ch7-fig7)
    shows the Excel output worksheet created by [SAS Code 7-7](#Chapter7.xhtml_ch7-pro7).


    SAS Code 7-7 – Using EMBEDDED_TITLES=‘ON’


    Title ''title one'';


    ods excel file = "&path\Title_on.xlsx"


              options(EMBEDDED_TITLES=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-7 – Excel Output with EMBEDDED_TITLES=‘ON’


    ![image](images/f0080-01.jpg)


    [Figure 7-7](#Chapter7.xhtml_ch7-fig7) shows the title at the top of the Excel
    worksheet.


    SAS Code 7-8 – EMBEDDED_TITLES=‘ON’ and SHEET_INTERVAL=‘NONE’


    Title ''title one'';


    ods excel file = "&path\Titles_on_multiple.xlsx"


              options(EMBEDDED_TITLES=''on''


                      SHEET_INTERVAL=''none'');


       proc print data=Asia_only;


       run;


       Title ''title two'';


       proc print data=Asia_only;


       run;


    ods excel close;'
