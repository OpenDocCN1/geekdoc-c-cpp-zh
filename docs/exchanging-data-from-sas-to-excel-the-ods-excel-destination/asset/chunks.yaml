    \ 中的‘HEIGHTS’部分是复数，正如复数名称所暗示的，该子选项会影响几行的高度。零的单值表示应使用字体大小作为下面列表中描述的所有行类型的高度。对于此选项，你需要提供一个带引号的位置参数字符串，以识别下面列出的七行高度。可以跳过某些值，但跳过的参数需要逗号来表示该参数缺失，最后一个使用的值除外。如上述，行高以点（points）为单位。\n\
    \n*   表头行\n*   表体行\n*   BY 值行\n*   标题\n*   页脚\n*   分页高度\n*   段落间距高度\n\n### SAS\
    \ 代码 9-15 – 与 ROW_HEIGHTS= 选项相关的行高的代码选项\n\n```sas\nods excel file = \"&path\\\
    Row_Heights.xlsx\"\noptions(ROW_HEIGHTS='20,15,15,35,55,25,5'\n        embedded_titles='on'\n\
    \        embedded_footnotes='on'\n        sheet_interval='none');\nTitle 'my title';\n\
    footnote 'my footnote';\nproc print data=asia_only;\nby Subsidiary;\nrun;\nods\
    \ excel close;\n```\n\n### 图 9-19 – 显示 SAS 代码 9-15 产生的不同行高的 Excel 输出\n\n![image](img/f0176-01.jpg)\n\
    \n在这个示例中，我使用 `BY` 将数据分成不同的段，以显示 Excel 输出中使用的不同类型的间距。标题和页脚比其他行大。标题用绿色突出，因为它包含了单元格“A1”，这是工作簿首次打开时的默认光标。行\
    \ `2`、`4`、`11`、`13`、`25`、`28` 和 `30` 非常小，几乎被隐藏了。子公司标题行比数据略大，BY 行被小线包围。\n\n## ROW_REPEAT=\
    \ 子选项\n\n`ROW_REPEAT=` 的结果比 `COLUMN_REPEAT=` 更难识别。如果你的数据没有延伸到第二页，那么该子选项将毫无用处。此子选项允许将第一页中间或标题的信息复制到长打印输出的后续工作表中。\n\
    \n*(注：原文后续存在大量内容重复，翻译时已根据逻辑进行了去重处理)*\n"
- fmt: "\n[SAS Code 9-18](#Chapter9.xhtml_ch9-pro18) reproduces the header from the\
    \ first page on all of the output pages.\n\nFigure 9-25 – Showing the `ROW_REPEAT=‘HEADER’`\
    \ Option Settings\n\n![image](images/f0181-01.jpg)\n\nOnly row one of the spreadsheet\
    \ is repeated on the pages.\n\nFigure 9-26 – Output from the `ROW_REPEAT= ‘HEADER’`\
    \ Setting\n\n![image](images/f0182-01.jpg)\n\nThis is another way to get the headers\
    \ to print on the output pages. Only part of the page is reproduced in [Figure\
    \ 9-26](#Chapter9.xhtml_ch9-fig26).\n\n### The FORMULAS= Suboption\n\nAnyone who\
    \ has used Excel for any length of time has probably become familiar with the\
    \ fact that you can use Excel formulas to calculate any number of things. Well,\
    \ this suboption enables you to use SAS to set up formulas as fields in the output\
    \ data set to be implemented when Excel opens the data file. The default is that\
    \ using the data as a formula is turned off. When you want to use the `FORMULAS=’ON’`\
    \ suboption, any data field that begins with an equal sign (`=`) activates the\
    \ formula processing. The `FORMULAS=` suboption might not be the only way to add\
    \ a formula to an Excel worksheet.\n\nThe `DATA` step here is creating a SAS character\
    \ value that contains an equal sign, and the values of the fields `Sales` and\
    \ `Returns` so that the net value of `Sales` minus `Returns` can be calculated.\
    \ When formula processing is turned off, the character values are visible. When\
    \ formulas are turned on, the calculation occurs and the value is displayed because\
    \ of the prepended equal sign.\n\nThe code in [SAS Code 9-19](#Chapter9.xhtml_ch9-pro19)\
    \ is required for use with both [SAS Code 9-20](#Chapter9.xhtml_ch9-pro20) and\
    \ [SAS Code 9-21](#Chapter9.xhtml_ch9-pro21). This code builds a SAS data set\
    \ that has a new column called “NET_SALES”. The formula subtracts returns from\
    \ sales to calculate “NET_SALES”. This calculation is not done for the header\
    \ row by adding one to the value of the `_n_` variable. Other methods of reading\
    \ the `ASIA_ONLY` data set might not work the same as the method I choose here.\n\
    \nSAS Code 9-19 Example of how to setup a data field to activate Excel formula\
    \ processing.\n\n```sas\ndata ASIA_FORMULAS;\n    set Asia_only;\n    row = _n_\
    \ + 1;\n    net_sales =  ='                          ||\n                left(trim(put(sales,9.)))\
    \    ||\n                '-'                        ||\n                left(trim(put(returns,9.)))\n\
    \                ;\nrun;\n```\n\nExecute the code in [SAS Code 9-19](#Chapter9.xhtml_ch9-pro19)\
    \ before using either [SAS Code 9-20](#Chapter9.xhtml_ch9-pro20) or [SAS Code\
    \ 9-21](#Chapter9.xhtml_ch9-pro21). No output figure is shown for this code.\n\
    \nSAS Code 9-20 Print Example with the FORMULA sub-option set to ‘OFF’.\n\n```sas\n\
    ods excel file = \"&path\\Formulas_off.xlsx\"\n    options(formulas='off');\n\
    proc print data=Asia_formulas;\n    run;\nods excel close;\n```\n\nFigure 9-27\
    \ Net_Sales shown with formulas turned off.\n\n![image](images/f0183-01.jpg)\n\
    \nWithout formulas turned on, the `Net_Sales` column does not make sense.\n\n\
    SAS Code 9-21 – Print Example with the `FORMULA=` Suboption Set to ‘ON’\n\n```sas\n\
    ods excel file = \"&path\\Formulas_on.xlsx\"\n    options(formulas='on');\nproc\
    \ print data=Asia_formulas;\n    run;\nods excel close;\n```\n\nFigure 9-28 –\
    \ Net_Sales Shown with Formulas Turned On\n\n![image](images/f0184-01.jpg)\n\n\
    This image shows that the formula for `Net_Sales` was executed. But notice that\
    \ the column is left justified, which indicates that the field contains a character\
    \ value, by default, is not formatted.\n\n### The START_AT= Suboption\n\nThe `START_AT=`\
    \ suboption is a handy way to place your output into the Excel worksheet somewhere\
    \ than the default top-left corner of the worksheet (cell `A1`). This option gives\
    \ you the freedom to place the output into any row and column of your output worksheet,\
    \ allowing you to move your data under cells. CSS style sheets described in [Chapter\
    \ 6](#Chapter6.xhtml) can be used to add images into the worksheet, and `START_AT=`\
    \ suboption can be used to position your data. SAS 9.4 has added the ability to\
    \ use alphabetic characters for column identifiers as in “A1”. The value ‘4,5’\
    \ is ‘Column,Row’ format.\n\nSAS Code 9-22 – Using the START_AT= Suboption to\
    \ Offset the Data within the Excel\n\n```sas\nods excel file = \"&path\\Starting_at.xlsx\"\
    \n    options(start_at='4,5');\nproc print data=Asia_only;\n    run;\nods excel\
    \ close;\n```\n\nFigure 9-29 – Showing the Output Offset to cell ‘D5’, Column\
    \ 4, Row 5\n\n![image](images/f0185-01.jpg)\n\nOften a company will have a logo\
    \ used specifically to brand Excel spreadsheets. This option gives you a way to\
    \ free up space for that logo (or anything else) without having to manually move\
    \ the data. See [Chapter 6](#Chapter6.xhtml) for using CSS options to add images.\n\
    \n### Conclusion\n\nIn this chapter, we discussed many ODS Excel destination suboptions\
    \ allowed us to manipulate features of the Excel worksheet rows, columns, and\
    \ cells at the time SAS is executing. With these options, you are able to set\
    \ filters, hide columns or rows, freeze headers or row labels, adjust the height\
    \ and width of the output rows, execute formulas, and even control the spacing\
    \ of the whole report. These options are especially advantageous for anyone does\
    \ not want to open Excel workbooks modify the sheets.\n\n## Index\n\nA\n`ABSOLUTE_COLUMN_WIDTH=`\
    \ option 9, 156, 160\n`ABSOLUTE_ROW_HEIGHT=` option 9, 157, 172\nactions 8, 11–21,\
    \ 31–33, 110–111\n*See also* options\n`ANCHOR=` option 8, 46, 47, 51–53, 67\n\
    arguments\naffecting output features 45–66\naffecting worksheet-level output features\
    \ 46\nODS EXCEL destination 8\nattribute selectors 50\n`AUTHOR=` option 8, 23,\
    \ 25–26\n`AUTOFILTER=` option 9, 156, 162\n\nB\nbackground images, adding using\
    \ CSS 59–61\nbackward compatibility 2–3\nBenjamin, William E., Jr. \"Working with\
    \ the SAS® ODS EXCEL Destination to Send Graphs, and Use Cascading Style Sheets\
    \ When to EXCEL Workbooks\" 54\n`BLACKANDWHITE=` option 9, 110, 112\n`BLANK_SHEET=`\
    \ option 9, 32, 37–38\n`BOX_SIZING=` option 8, 46, 53–54\nC\nCascading Style Sheets\
    \ (CSS)\nadding background images using 59–61\nchanging colors with files 54–56\n\
    modifying output using files 56–59\nstandards (website) 52\nusing with `CSSSTYLE=`\
    \ option 54–61\n`CATEGORY=` option 8, 23, 25–26\ncell options 155–158\n`CENTER_HORIZONTAL=`\
    \ option 9, 110, 113–116\n`CENTER_VERTICAL=` option 9, 110, 116–118\nCentral Processing\
    \ Unit (CPU) 5\nclass selectors 49\nclasses, CSS Selector 49–51\n`CLOSE` statement\n\
    about 3, 8, 12\ndefault Excel property sheets 24\nexample 12–15\ncolors, changing\
    \ with CSS files 54–56\nCOLUMN 156\ncolumn options 155–158\n`COLUMN_REPEAT=` option\
    \ 9, 162–168\ncombinators 50–51\n`COMMENTS=` option 8, 23, 25–26\ncompatibility,\
    \ backward 2–3\n`CONTENTS=` option 9, 32, 38–39\nCSS (Cascading Style Sheets)\n\
