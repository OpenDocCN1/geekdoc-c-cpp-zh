    # 结论


    ### 引言

    本章将讨论影响整个工作簿级别输出的 ODS Excel 选项。我们将讨论标题、脚注、页面对齐、工作表间隔、页签标签以及 BYLINE（行行）的放置。虽然这些
    ODS Excel 选项可能会影响单个工作表，如果在 Excel 工作簿生成期间一直保持不变，这些选项具有影响许多页面的潜力。因此，我认为它们会影响整个工作簿。这些选项中的大多数直接影响工作表的视觉显示，但
    `FIT` 选项（`FIT_TO_PAGE`、`PAGES_FITHEIGHT` 和 `PAGES_FITWIDTH`）仅在 Excel 工作簿中设置选项。这三个选项的实际效果仍然完全由
    Excel 控制。这意味着在发生打印时，Excel 可能会收缩或扩展数据。Excel 还会管理 SAS 提供的标题和脚注，这可能会导致打印输出上的数据重叠。


    部分屏幕截图包含了 Excel 的“页面设置”工作表。当使用 Microsoft Excel 2013 时，可以在“页面布局”选项卡下的“打印标题”选项中找到“页面设置”。“页面设置”工作表有四个选项卡：“页面”、“边距”、“页眉/页脚”和“工作表”。


    ### ODS Excel 目标子选项

    在本章中，我们将讨论以下 SAS ODS Excel 目标主题。


    表 7-1 – ODS Excel 目标操作


    | 子选项参数 | 值 | 说明 |

    | --- | --- | --- |

    | `EMBEDDED_FOOTNOTES` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 此选项指定是否应将脚注嵌入到工作表中。负值选项导致脚注不添加到
    Excel 工作表中。 |

    | `EMBED_FOOTNOTES_ONCE` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 此选项控制嵌入脚注是否显示在工作表底部。正响应（`YES`
    和 `ON`）导致脚注仅在工作表底部出现一次。负响应（`OFF` 和 `NO`）会导致嵌入脚注显示在工作表输出的底部。选项名别名 = “EMBED_FOOTERS_ONCE”
    |

    | `EMBEDDED_TITLES` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 此选项指定是否应将标题嵌入到工作表中。正响应（`YES`
    和 `ON`）导致标题显示在工作表中。 |

    | `EMBED_TITLES_ONCE` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 此选项控制嵌入标题是否显示在工作表底部。正响应（`YES`
    和 `ON`）导致标题在工作表顶部出现一次。 |

    | `FITTOPAGE` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 此选项决定是否嵌入标题。正响应（`YES` 和
    `ON`）开启此选项，而负响应（`OFF` 和 `NO`）关闭它。 |

    | `GRIDLINES` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 此选项控制 Excel 是否应该尝试适应。正响应（`YES`
    和 `ON`）开启此选项，而负响应（`OFF` 和 `NO`）关闭它。 |

    | `PAGES_FITHEIGHT` | ‘number’ | 此选项指定垂直适应多少页。 |

    | `PAGES_FITWIDTH` | ‘number’ | 此选项指定横向适应多少页。 |

    | `SHEET_INTERVAL` | ‘BYGROUP’, ‘PAGE’, ‘PROC’, ‘NONE’, ‘TABLE’ 默认值 = ‘TABLE’
    | 此选项决定何时创建新的工作表。 |

    | `SHEET_LABEL` | ‘text-string’, ‘NONE’ 默认值 = ‘NONE’ | 如果提供了，则使用 `text-string`
    作为标签。 |

    | `SHEET_NAME` | ‘text-string’ | 提供时，则使用 `text-string` 作为名称。 |

    | `SUPPRESS_BYLINES` | ‘OFF’, ‘ON’,‘YES’, ‘NO’ 默认值 = ‘OFF’ | 正响应抑制工作表中 BYline
    行的输出。 |


    ### The EMBEDDED_FOOTNOTES= 子选项

    此处显示的 `EMBEDDED_FOOTNOTES=` 子选项将 SAS 脚注发送到输出的 Excel 工作表。这通常与 `EMBEDDED_TITLES=`
    子选项一起使用，将 SAS 标题和脚注放在 Excel 工作表页面。当产生多个页时，脚注会出现在每页上。可以更改脚注，新脚注将出现在下一个输出工作表中。当将多个输出发送到一个工作表时，可以在同一工作表的不同输出之间更改脚注。默认值或
    `EMBEDDED_FOOTNOTES=‘OFF’`（或 `NO`）会导致不输出脚注。


    ### 嵌入脚注关闭

    当 `EMBEDDED_FOOTNOTES` 关闭时（默认值），从 SAS 发送的脚注不会显示在 Excel 工作表页面。


    SAS 代码 7-1 – 使用 EMBEDDED_FOOTNOTES=’OFF’ 选项

    生成图 7-1 中 Excel 文件的代码（Chapter7_ch7-fig1）：


    ```

    footnote ''foot note one'';

    ods excel file = "&path\Footnote_off.xlsx"

    options(EMBEDDED_FOOTNOTES=''off'');


    proc print data=Asia_only;

    run;


    ods excel close;

    ```

    在 SAS 代码 7-1 中，SAS 代码有一个脚注，但输出工作表图 7-1 显示没有 SAS 脚注。


