    67   ODS EXCEL SHOW;


    Current EXCEL select list is:


    1\. Moments


    2\. Quantiles


    68   PROC UNIVARIATE  DATA=sashelp.shoes


    69      (keep =  region stores product


    70       where=(region="Asia" and product="Boot"));


    71   variable stores;


    72   freq stores;


    73   RUN;


    NOTE: PROCEDURE UNIVARIATE used (Total process time):


          real time           0.18 seconds


          cpu time            0.11 seconds


    74   ODS EXCEL CLOSE;


    NOTE: Writing EXCEL file: .\sasexcl.xlsx


    ### Conclusion


    The number of ODS EXCEL actions are limited but they impact the output workbook
    and the log. The ODS SELECT and ODS EXCLUDE statements produced the same Results
    window entries because the commands were not issued for the standard output HTML
    ODS output stream. However, the Excel workbook that was generated was different
    for each command. Log entries for the ODS SHOW output were shown in [Log Output
    3.2](#Chapter3.xhtml_ch3-prol2) and they produced very different Excel files.
    These ODS EXCEL actions enable you to selectively output elements of the ODS generated
    output data. This gives you full control over the output that is generated and
    what you want to include in an Excel workbook.


    ## Chapter 4: Setting Excel Document Property Values


    [Options to Modify the Excel Document Properties Sheet](#Chapter4.xhtml__Toc490064720)


    [Default Excel Property Sheets](#Chapter4.xhtml__Toc490064721)


    [Modify Excel Property Sheets with the ODS EXCEL Destination](#Chapter4.xhtml__Toc490064722)


    [Excel Property Sheet Date/Time Fields without the SASDATE Option](#Chapter4.xhtml__Toc490064723)


    [Excel Property Sheet Date/Time Fields with the SASDATE Option](#Chapter4.xhtml__Toc490064724)


    [Conclusion](#Chapter4.xhtml__Toc490064725)


    ### Introduction


    This chapter addresses ODS EXCEL destination options that enable you to enter
    text into the “Excel Properties Sheet” directly from SAS. This is a time-saving
    option that enables you to update properties at the same time that your workbook
    is created. This also eliminates the need to explain why your workbook was modified
    after it was created. All of the options described in this chapter accept a text
    string as input.


    ### Options to Modify the Excel Document Properties Sheet


    In this chapter we will discuss the following ODS EXCEL destination options that
    address ways to apply text strings to the items in the Excel document properties
    sheet. The options listed in [Table 4-1](#Chapter4.xhtml_ch4-tab1) identify the
    ways that SAS can send text strings to the Excel Document Properties Sheet.


    Table 4-1 – ODS Excel Destination Options to Modify the Excel Document Property
    Sheet Values


    | **Action Parameter** | **Description** |


    | --- | --- |


    | AUTHOR | adds an author information string to the Excel document properties.
    |


    | CATEGORY | adds a category information string to the Excel document properties.
    |


    | COMMENTS | adds a comment string to the Excel document properties. |


    | FILE | selects a path and filename for your output Excel workbook. |


    | KEYWORDS | adds a keyword string to the Excel document properties. |


    | STATUS | creates a status. You can provide a text string that can be seen in
    the Excel document properties. |


    | SASDATE | saves the SAS date in the Excel property sheet instead of the default
    Excel date. |


    | TITLE | adds a title string to the Excel document properties. |


    ### Default Excel Property Sheets


    The SAS documentation describes the simplest ODS EXCEL statement implementation
    as shown below in [SAS Code 4-1](#Chapter4.xhtml_ch4-pro1). Writing the ODS EXCEL
    statement code with no arguments (also called Options) invokes output to the default
    home directory. [SAS Code 4-1](#Chapter4.xhtml_ch4-pro1) shows the best practice
    of using the FILE= option to identify an output Excel workbook. When using PC
    SAS, the current folder can be identified in two ways. Either by looking at the
    bottom of the SAS Display Manager window (bottom left or bottom right depending
    on your SAS version) or by selecting the “Change Folder” screen of the “Tools>Options>Change
    Current Folder” menu selection.


    The ODS EXCEL statement with the CLOSE action argument releases the Excel workbook
    for use by other activities, including opening the workbook with Excel or some
    other program.


    SAS Code 4-1 – Code That Does Not Change the Default Excel Document Property Values


    *Code that does not Change Default Excel document property values;


    ODS EXCEL;


    PROC PRINT DATA=SASHELP.Shoes;


    RUN;'
