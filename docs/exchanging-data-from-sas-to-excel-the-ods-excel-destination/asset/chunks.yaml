    \n![image](img/f0044-01.jpg)\n\n### 结论\n\n如你所见，本章所示选项允许程序人员预设许多功能，这些功能在 Excel\
    \ 文件中重新生成是非常耗耗时的。我展示了如何通过一次运行 SAS 代码生成多个不同的输出文件和文件类型，从而缩短程序执行时间并减少人为错误。手动生成目录可能需要数小时。预设标签页颜色和缩放级别的功能对于数据识别以及在屏幕或页面上的定位也有帮助。\n\
    \n## 第 6 章：影响输出特征的参数\n\n### 引言\n\n在本章中，我将讨论并展示影响最终输出工作表外观的示例。这包括 SAS `Style` 选项、层级样式表（CSS），以及影响输出\
    \ Excel 工作表中文本和图像的位置、密度和大小的选项。这些选项控制输出 Excel 文件的工作表级功能。\n\n通过使用这些选项，你可以修改电子表格基础颜色的显示方式，以及输出工作表中单元格的大小。可以在工作表中添加文本、为超链接添加锚点、修改图形图像密度、默认的\
    \ SAS 样式可以更改工作表，并且可以应用外部层级样式表。所有这些功能都可以在工作簿创建后手动添加，但这些选项让你在工作簿创建时就能获得所需的输出。这使得工作簿能够以你想要的方式显示，并具有创建和最后修改日期。再次，数据集\
    \ `ASIA_ONLY` 定义在第 2 章。\n\n### 影响工作表级别的参数\n\n在本章中，我们将讨论以下 ODS Excel 目标主题。我认为这些主题会影响工作表的整体外观。\n\
    \n表 6-1 – ODS Excel 目标\n\n| 参数 / 别名 | 选项 | 描述 |\n| :--- | :--- | :--- |\n| `DOM`\
    \ | `File=\"外部文件名\"` 或 空表示未定义 | 该选项将文档对象模型的输出写入外部文件或 SAS 日志。 |\n| `ANCHOR` | `'锚点名称'`\
    \ | 指定锚点标记，`'IDX'` 是默认第一个锚点。 |\n| `BOX_SIZING` | `CONTENT_BOX` 或 `BORDER_BOX`\
    \ | 该选项描述如何测量单元格宽度（注册表调整）。 |\n| `CSSSTYLE` | `'文件规范'<(媒体类型 1<...媒体类型-10)>` | 层级样式的完全限定名称\
    \ |\n| `IMAGE_DPI/DPI` | `'数字'` | 图形输出每英寸点数 |\n| `STYLE` | `样式覆盖(s)` | 使用预定义的样式元素（样式更改集合）或单个（一组）样式名称-值对更改。\
    \ |\n| `TEXT` | `文本字符串` | 在输出文档中插入文本字符串。 |\n\n有关 ODS 文档对象模型（`DOM`）的更多信息，请查看以下\
    \ URL：[`support.sas.com/documentation/cdl/en/odsadvug/69833/HTML/default/viewer.htm#n0pg2pc6qv5vzhn160f8j7ap4uv1`](http://support.sas.com/documentation/cdl/en/odsadvug/69833/HTML/default/viewer.htm#n0pg2pc6qv5vzhn160f8j7ap4uv1)\
    \ 或参考 SAS 手册“SAS Institute Inc. 2016. *SAS® 9.4 Output Delivery System: Advanced\
    \ Topics, Third Edition*. Cary, NC: SAS Institute Inc.”\n\n"
- fmt: "\n# Modification of the SAS Registry is not discussed in this book.\n\n##\
    \ Using the ODS Document Object Model (DOM) with the ODS EXCEL Statement\n\nThe\
    \ SAS documentation describes the ODS Document Object Model or `DOM` as one of\
    \ the options available to the `ODS EXCEL` statement. Actually, the `DOM` option\
    \ can be applied to most ODS statements except the `ODS LISTING` and `ODS OUTPUT`\
    \ statements. The *SAS 9.4 Output Delivery System: Advanced Topics, Third Edition*\
    \ manual noted above says that the `DOM` feature of ODS allows you to “determine\
    \ what elements and attributes exist so that you can construct your CSS selectors\
    \ to access those areas.” Again, space and time do not permit me to give a full\
    \ explanation of this ODS feature. When used with the `ODS EXCEL` statement two\
    \ formats are available.\n\n1. `ODS EXCEL DOM`;\n2. `ODS EXCEL DOM <=\"external-file\"\
    >`;\n\nStatement number 1 writes the output to the SAS Log, while statement number\
    \ 2 writes to an external file. But what does the output look like? `SAS Code\
    \ 6-1` shows the syntax of the first format, and `SAS Log 6-1` shows a partial\
    \ listing of the output. Format 2 just writes the same information to an external\
    \ file and is not shown here. I also used `PROC PRINT` to show output information\
    \ that the `SAS Log 6-1` displays. The `ODS TRACE` statement is used here to describe\
    \ the ODS outputs generated during the code execution. The `ODS TRACE` statement\
    \ is briefly described in `Chapter 3`.\n\n### SAS Code 6-1 – Using the DOM Option\
    \ to Identify CSS Elements\n\n```sas\nods trace dom;\nods excel dom;\nods excel\
    \ options(sheet_interval='none');\nproc print data=sashelp.shoes(where=\n    \
    \  (Product    = 'Boot'     and\n      Subsidiary = 'New York' and\n      region\
    \      = 'United States'));\nrun;\nods excel close;\nods trace off;\nods html;\n\
    ```\n\n`SAS Log 6-1` is only a partial listing of the output. It is shown here\
    \ to help identify some of the elements used later by the `ODS EXCEL ANCHOR=`\
    \ option.\n\n### SAS Log 6-1 – Partial Listing of the DOM Trace Output\n\n```\n\
    296  ods trace dom;\n297  ods excel dom;\n. . . more dom trace output . . .\n\
    298\n299  ods excel options(sheet_interval='none');\n300\n301  proc print data=sashelp.shoes(where=\n\
    302         (Product    = 'Boot'     and\n303          Subsidiary = 'New York'\
    \ and\n304          region      = 'United States'));\n305  run;\n      <div>\n\
    \      </div>\n      <section id=\"idx\" class=\"oo\" data-name=\"procprinttable\"\
    \ label=\"data set sashelp.shoes\" proc=\"print\" output=\"print\" contents-label=\"\
    data set sashelp.shoes\">\n. . . more dom trace output . . .\n<th class=\"header\"\
    \ type=\"char\" unformatted-type=\"char\" index=\"2\" name=\"region\" data-name=\"\
    region\" label=\"region\">Region\n                            </th>\n<th class=\"\
    header\" type=\"char\" unformatted-type=\"char\" index=\"3\" name=\"product\"\
    \ data-name=\"product\" label=\"product\">Product\n                          \
    \  </th>\n<th class=\"header\" type=\"char\" unformatted-type=\"char\" index=\"\
    4\" name=\"subsidiary\" data-name=\"subsidiary\" label=\"subsidiary\">Subsidiary\n\
    \                            </th>\n. . . more dom trace output . . .\ntype=\"\
    char\" index=\"2\" name=\"region\" data-name=\"region\" label=\"region\">United\
    \ States\n                            </td>\n<td class=\"data\" type=\"char\"\
    \ unformatted-type=\"char\" index=\"3\" name=\"product\" data-name=\"product\"\
    \ label=\"product\">Boot</td>\n<td class=\"data\" type=\"char\" unformatted-type=\"\
    char\" index=\"4\" name=\"subsidiary\" data-name=\"subsidiary\" label=\"subsidiary\"\
    >New York</td>\n<td class=\"data\" type=\"num\" . . . more dom trace output .\
    \ . .\nNOTE: There were observations read from the data SASHELP.SHOES. WHERE (Product='Boot')\
    \ and (Subsidiary='New York') and (region='United States');\nNOTE: PROCEDURE PRINT\
    \ used (Total process time): real time 32 seconds cpu time 28 seconds\n306\n307\
    \  ods excel close;\n. . . more dom trace output . . .\nNOTE: Writing EXCEL file:\
    \ \\sasexcl.xlsx\n308  ods trace off;\n309  ods html;\nNOTE: Writing HTML Body\
    \ file: sashtml10.htm\n```\n\nThe bold highlighted phrases `section id=\"idx\"\
    `, `class=\"header\"`, and `class=\"data\"` will be expanded upon explaining the\
    \ ODS Anchor option. These are CSS elements that the ODS EXCEL DOM option and\
    \ the `ODS TRACE` statement showed. Of course, many others exist and in fact at\
    \ least four other class statements exist in each of the “header” and “data” parts\
    \ of the listing. The ODS TRACE listing had over 7 pages of listing, far too much\
    \ data to display. `Table 6-2` includes some of the element types available, as\
    \ well as a brief definition. For more information, see SAS Institute Inc. 2014.\
    \ *SAS 9.4 Output Delivery System: Third Edition*. Cary, NC: SAS Institute Inc.\n\
    \n### Table 6-2 – CSS Sector Classes\n\n| A Limited Selection of CSS Selector\
    \ Classes |\n| Selector Class | Description | Example |\n| :--- | :--- | :---\
    \ |\n| Class Selectors | Class selectors are style selectors that select elements\
    \ based on the value of the `class=` attribute in the markup of an ODS report.\
    \ Class selectors must have a period (`.`) preceding the class name. For example,\
    \ in the following rule set, the class selector is `.SYSTEMTITLE`. | .systemtitle\
    \ { font-family: arial, helvetica, sans-serif; color: red; border: 1px solid black;\
    \ } |\n| Element Selectors | Element selectors are style selectors that select\
    \ DOM elements based on the element name. For example, the following rule set\
    \ selects elements with the name P: | p {color:green} |\n| Universal Selector\
    \ | The universal selector is a style selector that is a wildcard. It can match\
    \ any element name. The syntax for the universal selector is an asterisk (`*`).\
    \ | * |\n| Pseudo-Class Selectors | Pseudo-class selectors are style selectors\
    \ that select elements based on the relationships between DOM elements. Pseudo-classes\
    \ are represented by the pseudo-class name prefixed with a colon (`:`). The following\
    \ are examples of some ways that you can use pseudo-class selectors:<br>• select\
    \ the first and last child of a parent element<br>• select a specific child based\
    \ on its positional index in the parent element<br>• select an element by position\
    \ of a particular element name | :root selects the top-level element in the DOM.<br>:first-child\
    \ selects the first element within the parent.<br>:first-of-type selects the first\
    \ element of that type (that is, same element name) in the parent.<br>:marker\
    \ selects a list item bullet in printer output.<br>:nth-child(an+b) selects an\
    \ element based on the equation `an + b`. This equation selects every `a`th element\
    \ starting with element at position `b`. The equation can be replaced with the\
    \ keywords `even` or `odd` for the simple case of alternating the selection.<br>:nth-of-type(an+b)\
    \ selects the `:nth-child`, except that only the same elements of the same type\
    \ are used in the calculation.<br>:empty selects one or more empty elements. This\
    \ only applies to elements that have been specified as empty by the procedure.<br>:before\
    \ inserts content before the element.<br>:after inserts content after the element<br>:not(…)\
    \ selects an element if the selector within the argument is not true. |\n| ID\
    \ Selectors | ID selectors are style selectors that select elements based on the\
    \ `id=` attribute of a DOM element. The ID must be unique within a DOM and only\
    \ one can be specified in the `id=` attribute. ID selectors are indicated by a\
    \ `#` prefix. The following is a CSS rule set with an ID selector: | `#idx1 {\
    \ font-style: italic } |\n"
