    ### 引言


    ODS Excel 目标的“动作”是处理输出 Excel 工作表结构和内容的 ODS 命令。对于 `ODS EXCEL` 语句，只有少数命令被分类为“动作”，它们分别是
    `Close`、`Exclude`、`Select` 和 `Show`。在本章中我将解释这些动作并提供示例。首先，在描述这些动作之后，我想演示最简单的实现方法，这将让你创建一个
    Excel 工作表。


    `ODS TRACE` 语句实际上并不是 ODS Excel 目标的一部分。然而，在向 Excel 文件输出数据时，它可以帮助你识别可能想要 `SELECT`
    或 `EXCLUDE` 的输出 ODS 对象的名称。


    #### 表 3-1 – ODS TRACE 语句


    | 动作参数 | 描述 |

    | :--- | :--- |

    | `ODS TRACE` | 在 SAS 日志中创建一个列表，识别由代码生成的 ODS 输出对象，这些对象可以通过 `ODS EXCEL` 的 `SELECT`
    和 `EXCLUDE` 动作进行控制。 |


    ### ODS Excel 目标动作


    在本章中，我们将讨论以下 SAS ODS Excel 目标动作。


    #### 表 3-2 – ODS Excel 目标动作


    | 动作参数 | 选项 | 描述 |

    | :--- | :--- | :--- |

    | `NONE` | none | 将输出的 Excel 文件发送到 SAS 默认输出目录。根据你的 SAS 版本，默认目录显示在显示管理器窗口的左下或右侧。
    |

    | `EXCLUDE[*]` | ALL, NONE,Exclusion(s) | 从输出的 Excel 工作表中抑制一个 ODS 输出对象。 |

    | `SELECT[*]` | ALL, NONE,Exclusion(s) | 在输出的 Excel 工作表中包含一个 ODS 输出对象。 |

    | `SHOW[*]` | none | 向 SAS 日志写入当前被排除或选中的 ODS 输出对象列表。 |

    | `CLOSE` | none | 此动作关闭目标。任何与 `ODS EXCEL` 语句关联的文件都将由 SAS 释放，现在可以通过运行 Excel 打开。
    |


    `[*]` 使用此动作之前必须打开 ODS Excel 目标。


