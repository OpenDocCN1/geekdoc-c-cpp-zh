    \ are shown in [SAS Log 3-2](#Chapter3.xhtml_ch3-prol2) below.\n\nSAS Code 3-5\
    \ – SAS Code to Select Moments and Quantiles in the Excel Output Workbook\n\n\
    ```\nODS EXCEL options(Sheet_interval='NONE');\n\nODS EXCEL SELECT Moments Quantiles;\n\
    \nODS EXCEL SHOW;\n\nPROC UNIVARIATE  DATA=sashelp.shoes\n    (keep =  region\
