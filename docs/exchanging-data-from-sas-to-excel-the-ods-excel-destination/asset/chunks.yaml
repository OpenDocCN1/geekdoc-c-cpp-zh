    \ Suboption\n\nOften times you will find that you have data that either you or\
    \ your boss want to see in one cell, for example a product description. But if\
    \ a count of inventory or bin number (in the same column or in a different one?)\
    \ is only a few characters long, you might also want to limit the size of that\
    \ column. Most Excel output files have variable widths for the data in columns.\
    \ While Excel does a fair job of adjusting the column widths when data is read\
    \ into the workbook sheets, it often truncates or pads the width based on either\
    \ the first row (variable titles or column names), or some other formula known\
    \ only to Excel.\n\nThe `ABSOLUTE_COLUMN_WIDTH=` option enables you to adjust\
    \ the widths of the columns based on your needs. This enables you to take control\
    \ of one more part of the output to make it what you want. [Figure 9-1](#Chapter9.xhtml_ch9-fig1)\
