    ### ODS SHOW Statement


    The ODS SHOW statement is a stand-alone ODS statement. It is discussed here because
    the syntax includes the name of an ODS statement that is open and active when
    the ODS SHOW statement is encountered within the SAS code. The purpose of the
    ODS SHOW statement is to indicate the status of ODS objects in the output. The
    ODS TRACE statement shown in [SAS Code 3-2](#Chapter3.xhtml_ch3-pro2) enables
    you to find the names of the ODS objects that are available for output. [SAS Code
    3-5](#Chapter3.xhtml_ch3-pro5) uses the ODS SELECT statement to include the “Moments”
    and “Quantiles” ODS objects in the output to the Excel workbook, but all of the
    other objects from the UNIVARIATE procedure are suppressed from the output. I
    am also using an ODS EXCEL suboption that will be described later so that I can
    show all of the output on one page of an Excel workbook. When [SAS Code 3-5](#Chapter3.xhtml_ch3-pro5)
    is executed, the SAS Results window will look like [Figure 3-5](#Chapter3.xhtml_ch3-fig5)
    because nothing was “EXCLUDED” from that ODS output stream. However, the Excel
    output will only include the “Moments” and “Quantiles” ODS objects and is the
    same as shown in [Figure 3-7](#Chapter3.xhtml_ch3-fig7). I have also included
    an ODS EXCEL SHOW statement; the results of this statement are shown in [SAS Log
    3-2](#Chapter3.xhtml_ch3-prol2) below.


    SAS Code 3-5 – SAS Code to Select Moments and Quantiles in the Excel Output Workbook


    ODS EXCEL options(Sheet_interval=''NONE'');


    ODS EXCEL SELECT Moments Quantiles;


    ODS EXCEL SHOW;


    PROC UNIVARIATE  DATA=sashelp.shoes


       (keep =  region stores product


        where=(region="Asia" and product="Boot"));


    variable stores;


    freq stores;


    RUN;


    ODS EXCEL CLOSE;


    Log Output 3-2 – Example of the Output of the ODS SHOW Statement


