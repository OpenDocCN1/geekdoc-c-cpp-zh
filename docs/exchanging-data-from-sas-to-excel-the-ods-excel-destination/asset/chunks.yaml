    ### Introduction


    This chapter will discuss the ODS Excel options that affect output at the level
    of the whole workbook. We will discuss titles, footnotes, page alignment, sheet
    intervals, tab labels, and BYLINE placement. While these ODS Excel options might
    impact individual worksheets, when left unchanged for the full time that the Excel
    workbook is being generated, these options have the potential to affect many pages.
    Therefore, I consider them to affect the whole workbook. Most of these options
    directly affect the visual display of the worksheets, but the FIT options (FIT_TO_PAGE,
    PAGES_FITHEIGHT, and PAGES_FITWIDTH) only set options in the Excel workbook. The
    actual effect of these three options is still under the full control of Excel.
    This means that Excel might contract or expand the data when printing occurs.
    Excel also manages the titles and footnotes provided by SAS and this might cause
    the overlapping of data on printout.


    Some of the screen images include the Excel “Page Setup” sheet. When using Microsoft
    Excel 2013 the Page Setup can be found on the “PAGE LAYOUT” tab under the “Print
    Titles” option. The “Page Setup” sheet has four tabs; “Page”, “Margins”, “Header/Footer”,
    and “Sheet”.


    ### ODS Excel Destination Suboptions


    In this chapter we will discuss the following SAS ODS Excel destination topics.


    Table 7-1 – ODS Excel Destination Actions


    | **Suboption Parameter** | **Values** | **Description** |


    | --- | --- | --- |


    | EMBEDDED_FOOTNOTES | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘OFF’ | This option specifies
    whether footnotes should be embedded within the worksheet. Negative options cause
    footnotes not to be added to the Excel worksheets. |


    | EMBED_FOOTNOTES_ONCE | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘OFF’ | This option
    controls whether embedded footnotes appear at the bottom of the worksheet. Positive
    responses (YES and ON) cause footnotes to appear only once, at the botton of the
    worksheet. Negative responses (OFF and NO) cause embedded footnotes to appear
    at the bottom of the output in the worksheet. Option name alias = “EMBED_FOOTERS_ONCE”
    |


    | EMBEDDED_TITLES | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘NO’ | This option determines
    whether the titles appear in the worksheet. Positive responses (YES and ON) will
    embed the titles while negative responses (OFF and NO) cause titles not to be
    embeded. |


    | EMBED_TITLES_ONCE | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘OFF’ | This option controls
    whether embeded titles appear at the top of the worksheet. Positive responses
    (YES and ON) cause titles to appear only once at the top of the worksheet. Negative
    responses (OFF and NO) cause embedded titles to appear as they would normally.
    |


    | FITTOPAGE | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘OFF’ | This option controls whether
    Excel should try to print the worksheet onto one page. Positive responses (YES
    and ON) turn on this option while negative responses (OFF and NO) turn the option
    off. |


    | GRIDLINES | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘OFF’ | This option controls whether
    Excel should try to print gridlines. Positive responses (YES and ON) turn on this
    option while negative responses (OFF and NO) turn the option off. |


    | PAGES_FITHEIGHT | ‘number’ | Many worksheets contain more data than will print
    on one sheet of paper. This option specifies how many pages down to fit onto a
    printed sheet. |


    | PAGES_FITWIDTH | ‘number’ | Many worksheets contain more data than will print
    on one sheet of paper. This option specifies how many pages across to fit onto
    a printed sheet. |


    | SHEET_INTERVAL | ‘BYGROUP’, ‘PAGE’, ‘PROC’, ‘NONE’, ‘TABLE’, Default = ‘TABLE’
    | This option determines when a new worksheet is created. ●‘BYGROUP’ = a new worksheet
    is created for each new BYGROUP. (Alias BYGROUPS)●   ‘PAGE’ = a new worksheet
    is created for each new page of procedure output.●   ‘PROC’ = a new worksheet
    is created for each new procedure and it contains all data for that procedure.●   ‘NONE’
    = all of the output is on one page.●‘TABLE’ = a new worksheet is created for each
    table. (Alias OUTPUT) |


    | SHEET_LABEL | ‘text-string’, ‘NONE’, Default = ‘NONE’ | If supplied, the ‘text-string’
    is used as the first part of the worksheet name, which replaces the predefined
    label string. This is a label that prepends to the sheet name. This option can
    also be used in conjunction with other options like ‘SHEET_INTERVAL.’ When ‘NONE’
    is specified then the default sheet label is used. |


    | SHEET_NAME | ‘text-string’ | When provided, the text-string is used as the name
    of the next worksheet. The text-string can be up to 28 characters long. When required,
    a worksheet counter is added to the worksheet name to ensure the names are unique.
    |


    | SUPPRESS_BYLINES | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default = ‘OFF’ | Positive responses
    suppress the output of BY lines in the worksheet, while negative responses allow
    the BY lines to appear. |


    ### The EMBEDDED_FOOTNOTES= Suboption


    The EMBEDDED_FOOTNOTES= suboption shown here sends the SAS footnotes to the output
    Excel worksheet. This is often used with the EMBEDDED_TITLES= suboption to place
    the SAS titles and footnotes onto the Excel worksheet pages. When multiple pages
    are produced the footnotes appear on each page. The footnotes can be changed and
    the new footnote will appear on the next output worksheet. When multiple outputs
    are sent to one worksheet, the footnotes can be changed between outputs on the
