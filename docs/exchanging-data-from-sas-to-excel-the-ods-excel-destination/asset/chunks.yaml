    \n### ZOOM= 选项\n\n当工作表中的数据无法适应屏幕时，你可以通过使用屏幕右下角的滑块来减小字体尺寸。这让你让你看到更多的列。`ZOOM=` 选项可以提供相同的功能，但是通过编程方式实现的。在下面我减小了工作表文本的大小，但工作簿的屏幕截图与其他图像保持相同的比例。图像中的数据并非为了可读性，这只是一个展示可以这样操作的示例。注意右下角的滑块显示为\
