  trans: "\n\n```sas\nODS EXCEL CLOSE;\n\n*不更改默认 Excel 文档属性值的代码； *使用 FILE= 选项\n\n\
    ODS EXCEL FILE=”C:\\Users\\wmebe_000\\Book_2016\\Excel_workbook.xlsx\";\n\nPROC\
    \ PRINT DATA=SASHELP.Shoes;\n\nRUN;\n\nODS EXCEL CLOSE;\n```\n\n图 4-1 – 具有默认属性的\
    \ Excel 文档属性表\n\n![image](img/f0025-01.jpg)\n\n注意，`Author（作者）和`Last Modified（最后修改）字段使用的是创建账户登录时赋值的值，而`Title（标题）值是默认的\
    \ SAS 标题文本。\n\n### 使用 ODS EXCEL 目标修改 Excel 属性表\n\n下一个示例向 Excel 文档属性表添加字符字符串。以下每个选项都会影响\
    \ Excel 属性表，并显示在图 4-2。\n\n- `AUTHOR`\n- `CATEGORY`\n- `COMMENTS`\n- `KEYWORDS`\n\
    - `STATUS`\n- `TITLE`\n\nSAS 代码 4-2 – 设置 Excel 文档属性值\n\n```sas\nODS EXCEL\nAUTHOR\
    \ = 'AUTHOR - text-string 1'\n CATEGORY = 'CATEGORY - text-string 2'\nCOMMENTS\
    \ = 'COMMENTS - text-string 3'\nKEYWORDS = 'KEYWORDS - text-string 4'\nSTATUS\
    \ = 'STATUS - text-string 5'\nTITLE = 'TITLE - text-string 6'\n;\n\nPROC PRINT\
    \ DATA=SASHELP.Shoes;\n\nRUN;\n\nODS EXCEL CLOSE;\n```\n\n注意，大多数 SAS 语法图并没有显示\
    \ SAS 指令中字母与符号之间的空格。此代码演示了你可以通过添加空格来提高代码的可读性。\n\n图 4-2 – 具有 SAS 生成的属性的 Excel 文档属性表\n\
    \n![image](img/f0026-01.jpg)\n\n注意，`KEYWORDS（关键词）`选项的文本出现在属性表中`Tags（标签）`字段的右侧。\n\
    \n### 不带 SASDATE 选项的 Excel 属性表日期/时间字段\n\nSAS 代码 4-3 – 不带 SASDATE 选项的 Excel 属性表\n\
    \n```sas\nODS EXCEL;\n\nPROC PRINT DATA=sashelp.shoes;\n\nrun;\n\nODS EXCEL CLOSE;\n\
    ```\n\n图 4-3 – 不带 SASDATE 选项的 Excel 文档属性表\n\n![image](img/f0027-01.jpg)\n\n###\
    \ 带有 SASDATE 选项的 Excel 属性表日期/时间字段\n\nSAS 代码 4-4 示例所示的结果位于图 4-4，是使用 `SASDATE` 选项生成的。SAS\
    \ 代码 4-3 中执行的代码在 SAS 代码 4-4 代码之前执行的。但图 4-4 中的日期早于图 4-3 中显示的日期。这是因为 `SASDATE` 选项使用\
    \ SAS 会话启动时的`DATE/TIME` 作为日期的输入值。\n\nSAS 代码 4-4 – 带有 SASDATE 选项的 Excel 文档属性表\n\
    \n```sas\nODS EXCEL SASDATE;\n\nPROC PRINT DATA=sashelp.shoes;\n\nrun;\n\nODS\
    \ EXCEL CLOSE;\n```\n\n图 4-4 – 带有 SASDATE 选项的 Excel 文档属性表\n\n![image](img/f0028-01.jpg)\n\
    \n### 结论\n\n许多 `ODS EXCEL` 选项允许你修改 Excel 文档属性表。你可以直接从 SAS 程序中填充这些值。你指定的字符串也可以是\
    \ SAS 宏变量。这让你对生成的数据以及你想要输出到 Excel 工作簿属性表字段的内容具有完全控制权。许多时候，这些值在工作簿生成后手动更新。如果你的程序只写一个工作簿，这对你来说可能不是问题。但是，如果你的\
    \ SAS 代码产生了几个或数百个工作簿，你可能不想花时间手动更新每一个一个。\n\n## 第 5 章：影响工作簿的选项\n\nODS Excel 目标操作\n\
    \n- FILE= 选项\n- ID= 选项\n- BLANK_SHEET= 选项\n- CONTENTS= 选项\n- INDEX= 选项\n- MSG_LEVEL=\
    \ 选项\n- TAB_COLOR= 选项\n- ZOOM= 选项\n- 结论\n\n### 引言\n\n本章将讨论 `ODS Excel` 目标以及影响工作簿的一些选项。在第\
    \ 2 章中，`ID=` 选项被用于创建工作簿的多个实例。本章将讨论 `ID=` 选项及其影响工作簿的子选项。在第 2 章中，`ID=` 选项被用于创建工作簿的多个实例。本章将讨论\
    \ `ID=` 选项及其影响工作簿的子选项。\n\n### ODS Excel 目标操作\n\n在本章中我们将讨论以下 SAS：\n\n表 5-1–ODS\
    \ Excel 目标操作\n\n| **操作** | **选项** | **描述** |\n| --- | --- | --- |\n| `FILE` |\
    \ 文件规格 | 此选项定义要创建的 Excel 工作簿的文件位置。创建 *.xlsx 文件。 |\n| `ID` | 数字整数或字母或下划线开头的字符序列\
    \ | 此选项允许同时创建同一目标的多个实例，每个实例可以有不同的选项。标识符将指定已打开的实例，`ID=` 选项必须紧跟在目标后面。 |\n| `BLANK_SHEET`\
    \ | 字符串，默认 NONE | 在工作簿中创建一个空白工作表，并使用`string`的值作为工作表名称。Excel 允许标签长度为 32 个字符，但你提供的字符串不能超过\
    \ 28 个字符，因为 SAS 留了 4 个字符以确保标签名称唯一。该名称长度至少为一字符。这四个字符保留在表名末尾作为工作表计数器，通过添加数值计数后缀来创建工作表名称。\
    \ |\n| `CONTENTS` | OFF、ON、YES、NO，默认 OFF | 对此选项的积极响应将创建一个包含工作簿目录的第一工作表。 |\n| `INDEX`\
    \ | OFF、ON、YES、NO，默认 OFF | 对此选项的积极响应将创建一个包含工作簿所有工作表索引的最后一个工作表。 |\n| `MSG_LEVEL`\
    \ | 字符串，默认 NO | 抑制来自 Excel 的消息。 |\n| `TAB_COLOR` | 字符串 | 提供的字符串标识下一个工作表标签的颜色。你可以使用以下方法描述标签颜色。对于\
