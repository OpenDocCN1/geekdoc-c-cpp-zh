  trans: "\n\nMicrosoft Excel 具有向后兼容功能，允许其读取格式化文本文件。SAS 拥有 `PROC TEMPLATE` 和 `DATA`\
    \ 步功能，可以创建 Microsoft Excel 能够读取的文本文件，可以使用 `DATA` 步输出代码或 `ODS` 功能。这些功能中最广为人知且使用广泛的是\
    \ `ODS` 标签集 `EXCELXP`。该标签集生成一种特定类型的 XML，即 XML Spreadsheet 2003 格式 (`XMLSS`)。Excel\
    \ 可以将 `XMLSS` 格式作为工作表读取。SAS 用户可以下载 `EXCELXP` 的 `PROC TEMPLATE` 代码并修改 `PROC TEMPLATE`\
    \ 代码以构建该标签集。然后他们可以将其编译到自己的系统中（从 9.4 版本开始，`EXCELXP` 标签集也预加载到 `Base SAS` 中）。`EXCELXP`\
    \ 标签集具有许多选项和功能，我在我的第一书中讨论过。SAS 还通过 `LIBNAME` 语句提供了访问 Excel 工作簿的方法，我将在此不再讨论它。此功能需要\
    \ `SAS/ACCESS for PC Files` 软件。\n\n[1] [`en.wikipedia.org/wiki/64-bit_computing`](https://en.wikipedia.org/wiki/64-bit_computing)\n\
    \n## 作为示例的数据源\n\n我喜欢使用 `SASHELP` 目录下的数据文件。使用这些文件允许所有人重现示例，然后将示例扩展到您自己的数据文件中。由于某些示例的性质，可以使用多个文件来生成图表和其他输出，以更完整地解释为\
    \ `ODS EXCEL` 目标用户提供的各种可用选项。虽然我会尝试解释所有选项，但有时会在同一个示例中展示多个功能。\n\n为了尽可能让所有的示例保持在一页纸内，我将使用以下代码生成一个仅包含\
    \ 14 条观测值的 SAS 数据集。我为每个章节在 SAS 作者页面上提供了 SAS 代码，并标记为 `SAS Code (chapter number)-0.sas`。该代码与下方的\
    \ `SAS Code – 2-1` 中的代码类似。您将需要修改代码以匹配您计算机上的目录。在其他章节中，我将直接使用 SAS 数据集“ASIA_ONLY”，而不引用此代码。\n\
    \n### SAS 代码 2-1 创建 ASIA_ONLY SAS 数据集\n\n```sas\n/****************************************************/\n\
    /**  创建 SAS 工作数据集 ASIA_ONLY 的代码 **/\n/****************************************************/\n\
    data ASIA_ONLY;\n   set sashelp.shoes (where=(region=\"Asia\"));\nrun;\n*在此处创建您自己的路径名;\n\
    %let path = I:\\SAS__Book_2016\\Chapter 2 Excel Output;\noptions nodate;\n```\n\
    \n## EXCELXP 标签集\n\n名为 `EXCELXP` 的 SAS `ODS` 标签集是一个具有许多功能和选项的多用途标签集。您可以创建 Excel\
    \ 可读的工作表，具有许多预设选项和功能，例如横向打印、变量单元格大小和内部格式，这些功能如果手动制作需要很长时间。该标签集拥有超过 75 个可以应用于输出文件的选项，SAS\
    \ 用户实际上可以修改并存储该标签集供个人使用。生成的输出文件是 Microsoft Excel 可以读取的命令。但如果您使用以 `xlsx` 结尾的文件扩展名写入输出文件，Microsoft\
    \ Excel 将向您发出关于输入文件格式的错误消息。`EXCELXP` 标签集的一个局限性是无法直接在 Excel 工作表中生成图形输出。\n\n## ODS\
    \ EXCEL 目标\n\nSAS 创建 Excel 工作簿方式的最新扩展是作为 SAS 9.4 (TS1M1) 的实验版本发布的，被称为 `SAS ODS\
    \ EXCEL` 目标。SAS 9.4 (TS1M3) 现在拥有完全支持的 `ODS Excel` 目标版本，它以原生 Excel 格式（带有 `.xlsx`\
    \ 扩展名的 Open XML）写入 Excel 工作簿。作为一种“目标”，此 `ODS` 功能不能像 `EXCELXP` 标签集那样被 SAS 用户修改。但并不意味着输出的\
    \ Excel 工作簿不能被修改。本书的意图是解释并向展示如何使用目标中的选项来创建自己的自定义工作簿。\n\n## ODS EXCEL 目标的功能\n\n\
    ### 简单语法\n\n`ODS EXCEL` 语句的通用语法相当简单，但选项很多且多样。注意，本书讨论了“操作 (Actions)”、“选项 (Options)”和“子选项\
    \ (Suboptions)”。要获得最完整且最新的 `ODS EXCEL` 选项列表，请参考以下 URL 中的 `ODS` 文档：[`support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf`](http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf)。参见第\
    \ 6 章 获取 `ODS Excel` 目标的详细信息和示例。\n\n### SAS 代码 2-2 – 简单 ODS Excel 语法\n\n```sas\n\
    ODS EXCEL 目标的语法。\nODS EXCEL <(<ID=> *identifier*)> < *action*> ;\nODS EXCEL <(<ID=>\
    \ *identifier*)> <*option(s)*> ;\n```\n\nSAS 代码 2-2 中显示的 SAS `ODS Excel` 目标语法只是冰山一角。如所示，除了“ODS\
    \ EXCEL”之外的所有内容都是可选的。在后续章节中，我将解释语法中除了 `ODS EXCEL` 的元素。在本书中，我会对“操作”和“选项”之间做出区分。然而，有一点需要指出，有一个名为\
    \ `OPTIONS` 的参数，它们是 `OPTIONS` 的子选项。\n\n### ID=\n\n此功能允许您在处理期间打开 Excel 工作簿。\n\n\
    ### 操作\n\n操作的数量较少，负责处理 Excel 工作簿的打开、关闭、选择和排除。这些操作在以下 URL 的在线文档中有更详细的描述：[`support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf`](http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf)。但相关的解释包含在后续章节。\n\
    \n### 表格 2-1 ODS 操作列表\n\n| 操作 |  |\n| :--- | :--- |\n| NONE | 将 Excel 输出到 SAS\
    \ 默认目录。根据您的 SAS 版本，默认目录显示在显示器的左侧或右侧。 |\n| CLOSE | 关闭带或不带 `ID=` 选项的 Excel 语句。 |\n\
    | EXCLUDE | `EXCLUDE` 语句防止输出 O 对象 对象。 |\n| SELECT | `SELECT` 语句将 O 对象包含在输出中。 |\n\
    | SHOW | `SHOW` 语句将当前选择或排除列表写入日志 |\n\n### 可选参数（选项）\n\n以下 `ODS EXCEL` 语句选项接受参数，除了\
    \ `GFOOTNOTE/NOGFOOTNOTE` 和 `GTITLE/NOGTITLE` 选项对。`OPTIONS` 选项的语法为 `OPTIONS(sub-option1\
    \ sub-option2 … sub-optionN);`。所有这些子选项都是 `ODS EXCEL` 语句的 `OPTIONS(...)` 参数。在书中我可能会将其称为选项或子选项，但它们实际上是\
    \ `OPTIONS` 选项的子选项。子选项列表见表格 2-3。\n\n### 表格 2-2 Excel 选项列表\n\n| 可选参数 | | |\n| :---\
    \ | :--- | :--- |\n| ANCHOR= | AUTHOR= | BOX_SIZE= |\n| AUTOFILTER= | BLACKANDWHITE=\
    \ | |\n| CATEGORY= | COMMENTS= | CSSSTYLE= |\n| DOM= | DPI= | FILE= |\n| GFOOTNOTE\
    \ | NOGFOOTNOTE | GTITLE |\n| NOGTITLE | IMAGE_DPI= | KEYWORDS= |\n| ID= | OPTIONS\
    \ | SASDATE |\n| STATUS= | STYLE= | TEXT= |\n| TITLE= | WORK= | |\n\n### OPTIONS\
    \ 语句的子选项\n\n### 表格 2-3 ODS EXCEL OPTIONS 选项的子选项\n\n| OPTIONS 参数的子选项 | | |\n| :---\
