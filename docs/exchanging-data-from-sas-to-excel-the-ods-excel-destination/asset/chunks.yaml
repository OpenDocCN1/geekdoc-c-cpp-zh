    ### A Simple ODS Excel Example and the CLOSE Action


    The SAS documentation describes the simplest ODS EXCEL statement implementation,
    as shown below, with no arguments followed by some SAS procedural code and the
    ODS EXCEL statement with the CLOSE action argument. In this first example I am
    showing all of the screens that are generated by SAS 9.4 (TS1M3) using PC SAS
    on Windows. Future examples will only show the code and Excel output workbook
    or worksheets generated. In this example, I changed the SAS default output directory
    to “C:\Users\wmebe_000\Book_2016” by selecting the “Tools>Options>Change Current
    Folder>Change Folder” screen on the SAS toolbar. The folder must exist for the
    change to be effective. Typically, I would use the FILE= option, which will be
    explained in a later chapter, but I just wanted to show that it is not required.


    ### A Simple ODS Excel Output Step


    The code in [SAS Code 3-1](#Chapter3.xhtml_ch3-pro1) is so basic that it does
    not name either the workbook or the worksheet that is generated by the code. This
    code accepts all of the default values provided by SAS. The output location is
    the current SAS directory, the workbook name is “sasexcl.xlsx”, and the sheet
    name is “Print 1 - Data set SASHELP.S,” which is the first 28 characters of the
    SAS Procedure and the SAS data set name.


    SAS Code 3-1 – A Simple ODS Excel Output


    ODS EXCEL;


    PROC PRINT DATA=sashelp.shoes;


    RUN;


    ODS EXCEL CLOSE;


    [Figure 3-1](#Chapter3.xhtml_ch3-fig1) shows the SAS code, SAS log, and SAS default
    location of the output Excel Workbook. The LOG window also shows a NOTE that says
    “NOTE: Writing HTML Body file: sashtml.htm. This occurs because the ODS HTML location
    was not closed before running the [SAS Code 3-1](#Chapter3.xhtml_ch3-pro1).


    Figure 3-1 – SAS Code, Log, and Default Output Directory


    ![image](images/f0013-01.jpg)


    On the bottom of the PC SAS display manager window the default output directory
    name is listed. The actual location on the screen varies depending on the version
    of SAS that you are using. This form of execution selects the filename at execution
    time, while the FILE= option enables you to select an output filename. In this
    example, the name defaults to sasexcl.xlsx, but on other operating systems the
    default name might be different. Depending on the operating system that the SAS
    code was running on, and the TOOLS> Options> Preferences “Results” tab selections,
    the output EXCEL workbook can be forced open using EXCEL. This is shown in [Figure
    3-2](#Chapter3.xhtml_ch3-fig2).


    Figure 3-2 – Excel Output from a Simple ODS EXCEL Statement


    ![image](images/f0014-01.jpg)


    The windows output directory is shown in [Figure 3-3](#Chapter3.xhtml_ch3-fig3);
    the directory was empty before the SAS code was executed. Afterward, the directory
    shows the output Excel workbook. Since the workbook was opened the temporary file
    generated by Excel is also visible.


    Figure 3-3 – SAS Default Output Windows Directory


    ![image](images/f0014-02.jpg)


    As you can see the simplest form of writing an Excel file with the ODS Excel destination
    is uncomplicated. When Microsoft released Version 2007 of Microsoft Office software,
    they changed the format of their Excel workbooks from a binary formatted file
    to an Open XML set of files stored in a compressed file structure. Most people,
    myself included, would call this a “ZIP” file. While this may not be what SAS
    or Microsoft call the file structure, if you change the “.xlsx” of the filename
    to “.zip” you can use the Winzip program to open the Excel workbook to see the
    underlying data elements. [Figure 3-4](#Chapter3.xhtml_ch3-fig4) shows the internal
    directories of the Excel *.xlsx workbook. While I do not intend to expose all
    of the mysteries of the internal workings of an Excel workbook, I will say that
    the data is in there somewhere. Now you know where to look.'
