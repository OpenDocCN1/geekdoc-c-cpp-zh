  trans: '


    SAS 在 Base SAS 第 7 版本中推出了输出交付系统（ODS）。SAS 第 8 和 9 版本扩展并引入了允许 SAS 与 Microsoft Excel
    之间传输数据的方法。这些传输方法被称为“目标”（destinations，如 `CSV` 或 `HTML`）或“标记集”（tagsets，如 `CSV`、`HTML`、`MSOFFICE2K`
    或 `EXCELXP`），它们允许 SAS 代码创建 Microsoft Excel 能够读取的文件。在 Microsoft Office 2007 发布后，SAS
    编写了多个版本的若干 ODS 工具以应对 Microsoft Office 产品的变化。与 Microsoft Excel 可读文件相关的 ODS 标记集均被创建为
    Excel 可以读取的文本文件，但并未直接写入新的 Excel 文件 Open XML 格式。


    标记集是 SAS 模板代码的一个模块，由 `PROC TEMPLATE` 进行编译，并存储在每个安装的 SAS 版本的 `SASHELP` 库中。任何具有
    `SASHELP` 库访问权限的用户都可以使用这些标记集。SAS 用户可以对标记集进行更改（或创建自己的标记集），并将其编译到用户库中。这通常仅有一台计算机可以访问，但用户标记集是可以共享的。


    新的 SAS ODS EXCEL 目标（不是标记集）其独特之处在于，无论请求的文件名是什么，它都会创建一个 Open XML 格式的文件。提供扩展名为 `*.xls`
    的输出文件名并不会创建一个 Excel 2003 可以读取的二进制格式 Excel 文件。然而，当使用 `*.xls` 扩展名作为输出 Excel 工作簿名称时，Excel
    将发送一条错误消息，并且（取决于 Excel 版本）在你继续操作时，可能会允许你打开创建的文件。


    该功能没有需要进行向后兼容的历史版本。然而，ODS EXCEL 目标的一些功能与 SAS ODS 标记集 `EXCELXP` 的功能相似。虽然我没有在之前的书中书中提供
    `EXCELXP` 标记集每个功能的详细信息，但我确实列出了大部分可用功能。随 `EXCELXP` 增加的大部分功能在 ODS Excel 目标中同样可用。


    ## 为什么 ODS Excel 目标是 SAS 的仅限输出功能


    根据定义，SAS ODS（输出交付系统）功能仅是“输出（OUTPUT）”的。一旦通过 `ODS FILE` 语句定义文件、使用 SAS 代码创建文件并通过
    `ODS <destination> CLOSE` 语句关闭，它就可以供其他程序或 SAS 功能使用。如果安装了 SAS/ACCESS for PC Files
    软件，则可以使用 `LIBNAME` 语句打开一个新的 Excel 工作簿。


    ## 本书的布局


    本书的目的是详细描述 ODS EXCEL 目标的选项。我将参数和选项归类为我认为的常用用法元素。我担任应用程序程序员已 40 多年，并利用我的经验来建立我认为的逻辑单元。您应该能够使用索引按字母顺序查找选项。我希望我的分类方法能够满足其他需求。虽然
    `EXCELXP` 标记集和 ODS EXCEL 目标是 SAS 独立且独特的特性，但每个工具的许多选项都为输出 Excel 工作簿提供了类似的输出。接下来的章节将描述参数和选项，并在空间允许的情况下提供尽可能多的示例。目标是让每个内容都有对应的示例。下面的列表显示了我通用的分类类别。我稍后会描述这些参数和选项。


    ### ODS 目标 EXCEL 参数


    * 文件标识

    * Excel 文件属性

    * 输出功能


    ### ODS 目标 EXCEL 选项组


    * 工作簿 (Workbook)

    * 工作表 (Worksheet)

    * 打印 (Print)

    * 列 (Column)

    * 行 (Row)

    * 单元格级


    ## 通用章节布局


    从第 3 章起的章节将分别介绍并解释 ODS EXCEL 目标的一些功能，提供功能描述，随后是 SAS 代码和 Excel 输出。为了节省空间，每个示例可能包含一个或多个功能。如前所述，功能的分类是我个人的观点，可能与任何人的描述方式不同。


    ## 第 2 章：ODS 标记集与目标


    * [从外部观察 Microsoft Excel 的变化]

    * [用作示例的数据源]

    * [EXCELXP 标记集]

    * [ODS EXCEL 目标]

    * [ODS EXCEL 目标的功能]

    * [简单语法]

    * [ID=]

    * [操作 (Actions)]

    * [可选参数（选项）]

    * [OPTIONS 语句的子选项]

    * [通用章节说明]


    ### 从外部观察 Microsoft Excel 的变化


    在从 2006 年到 2015 年的十年间，SAS 与 Microsoft Excel 交互的方式发生了许多变化。这些变化始于 Microsoft 发布 Office
    2007。由于本书主要涉及 Excel，我将专门指代该产品。多年来，Microsoft Excel 文件的格式一直保持不变。使用记事本程序打开一个小的 Excel
    文件可以看到文件的二进制模式。虽然这通常没有意义，但这些模式偶尔会显示出可读的文本。从 Microsoft Excel 2007 开始，Excel 格式转换为压缩文件（本质上是包含
    XML 文件的 ZIP 文件）。我不会尝试去解码或解释这些文件，这对微软来说行得通。他们可以保护自己的 Excel 文件，防止 `.xlsx` 文件中包含
    Visual Basic for Applications (VBA) 宏。这让用户知道其中没有宏，文件更安全。微软 确实允许带有其他扩展名的 Excel
    文件包含宏和二进制组件（*.xlsm` 或 `*.xlsb` 文件扩展名）。


    '
- fmt: "\nMicrosoft Excel had backward compatible features that allowed it to read\
    \ formatted text files. SAS had `PROC TEMPLATE` and `DATA` step features that\
    \ would allow text files that Microsoft Excel was able to read to be created,\
    \ either by using `DATA` step output code or `ODS` features. The best known and\
    \ most widely used of these features was the `ODS` tagset `EXCELXP`. This tagset\
    \ produces a specific type of XML, the XML Spreadsheet 2003 format (`XMLSS`).\
    \ Excel can read the `XMLSS` format as a worksheet. SAS users can download the\
    \ `EXCELXP` `PROC TEMPLATE` code and modify the `PROC TEMPLATE` code to build\
    \ the tagset. Then they can compile them into their system (starting in version\
    \ 9.4 the `EXCELXP` tagset is also pre-loaded into `Base SAS`). The `EXCELXP`\
    \ tagset has many options and features that I discussed in my first book. SAS\
    \ also provided access to Excel workbooks with the `LIBNAME` statement, which\
    \ I will not discuss here. This feature requires `SAS/ACCESS for PC Files` software.\n\
    \n[[1](#Chapter2.xhtml_ch2_fn_1)] [https://en.wikipedia.org/wiki/64-bit_computing](https://en.wikipedia.org/wiki/64-bit_computing)\n\
    \n## Data Sources Used as Examples\n\nI like to use data files in the `SASHELP`\
    \ directory. Using these files allows everyone to reproduce the examples and then\
    \ extend the examples to your data files. Because of the nature of some of the\
    \ examples, several files can be used to produce graphs and other output to more\
    \ fully explain the options that are available to the users of the `ODS EXCEL`\
    \ destination. While I will attempt to explain all of the options, I will at times\
    \ show several features in the same example.\n\nIn an effort to keep all of my\
    \ examples as close to one page as possible I will be using the following code\
    \ to produce a SAS data set with only 14 observations. I have provided SAS code\
    \ on the SAS Authors page labeled as `SAS Code (chapter number)-0.sas` for each\
    \ chapter. The code is similar to the code in `SAS Code – 2-1` below. You will\
    \ need to modify the code to match the directories on your computer. In other\
    \ chapters I will be using the SAS data set “ASIA_ONLY” without referring to this\
    \ code.\n\n### SAS Code 2-1 Create ASIA_ONLY SAS Data Set\n\n```sas\n/****************************************************/\n\
    /**  Code to create a SAS work data set ASIA_ONLY **/\n/****************************************************/\n\
    data ASIA_ONLY;\n   set sashelp.shoes (where=(region=\"Asia\"));\nrun;\n* Create\
    \ Your Own path name here;\n%let path = I:\\SAS__Book_2016\\[Chapter 2](#Chapter2.xhtml)\
    \ Excel Output;\noptions nodate;\n```\n\n## The EXCELXP Tagset\n\nThe SAS `ODS`\
    \ tagset called `EXCELXP` is a versatile tagset with many features and options.\
    \ You can create Excel readable worksheets that have many preset options and features\
    \ like landscape printing, variable cell sizes, and internal formatting that could\
    \ take a long time to produce manually. This tagset has over 75 options that can\
    \ be applied to an output file, and the tagset can actually be modified and stored\
    \ by SAS users for personal use. The output files produced are commands that Microsoft\
    \ Excel can read. But if you write the output file using a filename extension\
    \ that ends in `xlsx`, Microsoft Excel will give you an error message about the\
    \ format of the input file. One limitation of the `EXCELXP` tagset is the inability\
    \ to produce graphic output in an Excel worksheet directly.\n\n## The ODS EXCEL\
    \ Destination\n\nThe newest addition to the way that SAS creates Excel workbooks\
    \ was released as an experimental version with SAS 9.4 (TS1M1), and is called\
    \ the `SAS ODS EXCEL` destination. SAS 9.4 (TS1M3) now has the fully supported\
    \ version of the `ODS Excel` destination and it writes Excel workbooks in the\
    \ native Excel format (Open XML with the `.xlsx` extension). As a “destination”\
    \ this `ODS` feature cannot be modified by a SAS user like the tagset `EXCELXP`.\
    \ But that does not mean that the output Excel workbook cannot be modified. The\
    \ intent of this book is to explain and show you how to use options in the destination\
    \ to create your own customized workbooks.\n\n## Features of the ODS EXCEL Destination\n\
    \n### Simple Syntax\n\nThe general syntax of the `ODS EXCEL` statement is rather\
    \ simple, but the options are many and varied. Note that this book discusses “Actions”,\
    \ “Options”, and “Suboptions.” For the most complete and updated list of `ODS\
    \ EXCEL` options, refer to the `ODS` documentation at the following URL: [http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf](http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf).\
    \ See [Chapter 6](#Chapter6.xhtml) for detailed information and examples of the\
    \ `ODS Excel` destination.\n\n### SAS Code 2-2 – Simple ODS Excel Syntax\n\n```sas\n\
    Syntax for the ODS EXCEL destination.\nODS EXCEL <(<ID=> *identifier*)> < *action*>\
    \ ;\nODS EXCEL <(<ID=> *identifier*)> <*option(s)*> ;\n```\n\nThe SAS `ODS Excel`\
    \ destination syntax shown in [SAS Code 2-2](#Chapter2.xhtml_ch2-pro2) is just\
    \ the tip of the iceberg. As shown, everything except “ODS EXCEL;` is optional.\
    \ While the features of the syntax will be explained in later chapters, I will\
    \ take a moment here to explain the relationships of these syntax elements.\n\n\
    In this book I make a distinction between the “Action” and “Option” of the `ODS`\
    \ destination. However, one thing to point out is there an `Argument` called `OPTIONS`\
    \ that has many `SUB-OPTIONS`. I will generally refer to the distinct types as\
    \ “Actions” or “Additional Arguments” where they are suboptions of the `OPTIONS`\
    \ option.\n\n### ID=\n\nThis feature enables you to open Excel workbooks during\
    \ your processing.\n\n### Actions\n\nThe number of actions is relatively small\
    \ and deals with generating the output for the Excel workbook. These actions control\
    \ opening and closing the Excel workbook and selecting, excluding, and listing\
    \ the SAS objects that are output. These are more fully described in the online\
    \ documentation at the following URL: [http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf](http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf).\
    \ But an explanation is included in later chapters.\n\n### Table 2-1 List of ODS\
    \ Excel Actions\n\n| Actions | Include |\n| :--- | :--- |\n| NONE | Sends Excel\
    \ output to the SAS Default directory. Depending your version of SAS, the default\
    \ directory is shown in the bottom left or right side of the display manager window.\
    \ |\n| CLOSE | Closes an `ODS Excel` statement with or without an `ID=` option.\
    \ |\n| EXCLUDE | An `ODS EXCLUDE` statement prevents an ODS object from being\
    \ output. |\n| SELECT | An `ODS SELECT` statement includes an ODS object in the\
    \ output. |\n| SHOW | An `ODS SHOW` statement writes the current selection or\
    \ exclusion list to the log |\n\n### Optional Arguments (Options)\n\nThe following\
    \ `ODS EXCEL` Statement options accept parameters, except the `GFOOTNOTE/NOGFOOTNOTE`\
    \ and `GTITLE/NOGTITLE` option pairs. The `OPTIONS` option syntax is `OPTIONS(sub-option1\
    \ sub-option2 … sub-optionN);`. All of these suboptions are accepted on the `OPTIONS(...)`\
    \ argument of the `ODS EXCEL` statement. Throughout the book I may call them options\
    \ or suboptions but they are really suboptions of the `OPTIONS` option. A list\
    \ of the suboptions is in [Table 2-3](#Chapter2.xhtml_ch2-tab3).\n\n### Table\
    \ 2-2 List of ODS Excel Options\n\n| Optional Arguments | | |\n| :--- | :--- |\
    \ :--- |\n| ANCHOR= | AUTHOR= | BOX_SIZING= |\n| AUTOFILTER= | BLACKANDWHITE=\
    \ | |\n| CATEGORY= | COMMENTS= | CSSSTYLE= |\n| DOM= | DPI= | FILE= |\n| GFOOTNOTE\
    \ | NOGFOOTNOTE | GTITLE |\n| NOGTITLE | IMAGE_DPI= | KEYWORDS= |\n| ID= | OPTIONS\
    \ | SASDATE |\n| STATUS= | STYLE= | TEXT= |\n| TITLE= | WORK= | |\n\n### Suboptions\
    \ of the OPTIONS Statement\n\n### Table 2-3 Suboptions of the OPTIONS option of\
    \ the ODS EXCEL statement\n\n| Suboptions of the OPTIONS Argument | | |\n| :---\
    \ | :--- | :--- |\n| ABSOLUTE_COLUMN_WIDTH= | ABSOLUTE_ROW_HEIGHT= | | || AUTOFILTER=\
    \ | BLACKANDWHITE= | |\n"
  raw: 'Microsoft Excel had backward compatible features that allowed it to read formatted
    text files. SAS had PROC TEMPLATE and DATA step features that would allow text
    files that Microsoft Excel was able to read to be created, either by using DATA
    step output code or ODS features. The best known and most widely used of these
    features was the ODS tagset EXCELXP. This tagset produces a specific type of XML,
    the XML Spreadsheet 2003 format (XMLSS). Excel can read the XMLSS format as a
    worksheet. SAS users can download the EXCELXP PROC TEMPLATE code and modify the
    PROC TEMPLATE code to build the tagset. Then they can compile them into their
    system (starting in version 9.4 the EXCELXP tagset is also pre-loaded into Base
    SAS). The EXCELXP tagset has many options and features that I discussed in my
    first book. SAS also provided access to Excel workbooks with the LIBNAME statement,
    which I will not discuss here. This feature requires SAS/ACCESS for PC Files software.


    [[1](#Chapter2.xhtml_ch2_fn_1)] [https://en.wikipedia.org/wiki/64-bit_computing](https://en.wikipedia.org/wiki/64-bit_computing)


    ### Data Sources Used as Examples


    I like to use data files in the SASHELP directory. Using these files allows everyone
    to reproduce the examples and then extend the examples to your data files. Because
    of the nature of some of the examples, several files can be used to produce graphs
    and other output to more fully explain the options that are available to the users
    of the ODS EXCEL destination. While I will attempt to explain all of the options,
    I will at times show several features in the same example.


    In an effort to keep all of my examples as close to one page as possible I will
    be using the following code to produce a SAS data set with only 14 observations.
    I have provided SAS code on the SAS Authors page labeled as SAS Code (chapter
    number)-0.sas for each chapter. The code is similar to the code in SAS Code –
    2-1 below. You will need to modify the code to match the directories on your computer.
    In other chapters I will be using the SAS data set “ASIA_ONLY” without referring
    to this code.


    SAS Code 2-1 Create ASIA_ONLY SAS Data Set


    /****************************************************/


    /**  Code to create a SAS work data set ASIA_ONLY  **/


    /****************************************************/


    data ASIA_ONLY;


       set sashelp.shoes (where=(region="Asia"));


    run;


    * Create Your Own path name here;


    %let path = I:\SAS__Book_2016\[Chapter 2](#Chapter2.xhtml) Excel Output;


    options nodate;


    ### The EXCELXP Tagset


    The SAS ODS tagset called EXCELXP is a versatile tagset with many features and
    options. You can create Excel readable worksheets that have many preset options
    and features like landscape printing, variable cell sizes, and internal formatting
    that could take a long time to produce manually. This tagset has over 75 options
    that can be applied to an output file, and the tagset can actually be modified
    and stored by SAS users for personal use. The output files produced are commands
    that Microsoft Excel can read. But if you write the output file using a filename
    extension that ends in xlsx, Microsoft Excel will give you an error message about
    the format of the input file. One limitation of the EXCELXP tagset is the inability
    to produce graphic output in an Excel worksheet directly.


    ### The ODS EXCEL Destination


    The newest addition to the way that SAS creates Excel workbooks was released as
    an experimental version with SAS 9.4 (TS1M1), and is called the SAS ODS EXCEL
    destination. SAS 9.4 (TS1M3) now has the fully supported version of the ODS Excel
    destination and it writes Excel workbooks in the native Excel format (Open XML
    with the .xlsx extension). As a “destination” this ODS feature cannot be modified
    by a SAS user like the tagset EXCELXP. But that does not mean that the output
    Excel workbook cannot be modified. The intent of this book is to explain and show
    you how to use options in the destination to create your own customized workbooks.


    ### Features of the ODS EXCEL Destination


    ### Simple Syntax


    The general syntax of the ODS EXCEL statement is rather simple, but the options
    are many and varied. Note that this book discusses “Actions”, “Options”, and “Suboptions.”
    For the most complete and updated list of ODS EXCEL options, refer to the ODS
    documentation at the following URL: [http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf](http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf).
    See [Chapter 6](#Chapter6.xhtml) for detailed information and examples of the
    ODS Excel destination.


    SAS Code 2-2 – Simple ODS Excel Syntax


    Syntax for the ODS EXCEL destination.


    ODS EXCEL <(<ID=> *identifier*)> < *action*> ;


    ODS EXCEL <(<ID=> *identifier*)> <*option(s)*> ;


    The SAS ODS Excel destination syntax shown in [SAS Code 2-2](#Chapter2.xhtml_ch2-pro2)
    is just the tip of the iceberg. As shown, everything except “ODS EXCEL;” is optional.
    While the features of the syntax will be explained in later chapters, I will take
    a moment here to explain the relationships of these syntax elements.


    In this book I make a distinction between the “Action” and “Option” features of
    the ODS Excel destination. However, one thing to point out is that there is an
    “Argument” called “OPTIONS” that has many “SUB-OPTIONS.” I will generally refer
    to the distinct types as “Actions” or “Additional Arguments” where the “Additional
    Arguments” are either options or sub-options, as they are described in the SAS
    HELP under the Base SAS 9.4 (TS1M3) topic “ODS EXCEL Statement.” I will clarify
    this in later chapters.


    ### ID=


    This feature enables you to open multiple Excel workbooks during your processing.


    ### Actions


    The number of actions is relatively small and deals with generating the output
    for the Excel workbook. These actions control opening and closing the Excel workbook
    and selecting, excluding, and listing the SAS objects that are output. These are
    more fully described in the online documentation at the following URL: [http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf](http://support.sas.com/documentation/cdl/en/odsug/69832/PDF/default/odsug.pdf).
    But an explanation is included in later chapters.


    Table 2-1 List of ODS Excel Actions


    | **Actions Include** |


    | NONE | Sends Excel output to the SAS Default output directory.Depending onn
    your version of SAS, the default directory is shown in the bottom left or right
    side of the display manager window. |


    | CLOSE | Closes an ODS EXCEL statement with or without an ID= option. |


    | EXCLUDE | An ODS EXCLUDE statement prevents an ODS object from being output.
    |


    | SELECT | An ODS SELECT statement includes an ODS object in the output. |


    | SHOW | An ODS SHOW statement writes the current selection or exclusion list
    to the log |


    ### Optional Arguments (Options)


    The following ODS EXCEL Statement options accept parameters, except the GFOOTNOTE/NOGFOOTNOTE
    and GTITLE/NOGTITLE option pairs. The OPTIONS option syntax is “OPTIONS(sub-option1
    sub-option2 … sub-optionN);”. A list of the suboptions is in [Table 2-3](#Chapter2.xhtml_ch2-tab3).


    Table 2-2 List of ODS Excel Options


    | **Optional Arguments** |


    | ANCHOR= | AUTHOR= | BOX_SIZING= |


    | CATEGORY= | COMMENTS= | CSSSTYLE= |


    | DOM= | DPI= | FILE= |


    | GFOOTNOTE | NOGFOOTNOTE | GTITLE |


    | NOGTITLE | IMAGE_DPI= | KEYWORDS= |


    | ID= | OPTIONS | SASDATE |


    | STATUS= | STYLE= | TEXT= |


    | TITLE= | WORK= |   |


    These optional arguments will be explained in later chapters.


    ### Suboptions of the OPTIONS Statement


    All of these suboptions are accepted on the OPTIONS(…) argument of the ODS EXCEL
    statement. Throughout the book I may call them options or suboptions but they
    are really suboptions of the OPTIONS option.


    Table 2-3 Suboptions of the OPTIONS option of the ODS EXCEL statement


    | **Suboptions of the OPTIONS Argument** |


    | ABSOLUTE_COLUMN_WIDTH= | ABSOLUTE_ROW_HEIGHT= |  |


    | AUTOFILTER= | BLACKANDWHITE= |  |'
