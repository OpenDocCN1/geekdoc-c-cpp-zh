  raw: 'The URL to add an image to the Excel workbook is added to this code, with
    comments about where to find and place the image.


    SAS Code 6-12 – Using a CSS File to Include a URL Reference


    /* with CSS style modification */


    ods excel file = "&path.\Test_css_file_3.xlsx"


        cssstyle = "&path.\my_css_3.css"


        options(zoom=''15'');


    %***graph_it***;


    ods excel close;


    Make sure you look at [SAS Code 6-11](#Chapter6.xhtml_ch6-pro11) to verify the
    location pointed to by the macro variable &PATH. Then adjust the filenames and
    image names so that you can read in the image that you want. With a smaller image
    the repeating pattern will be more noticeable. In [Figure 6-7](#Chapter6.xhtml_ch6-fig7)
    I made the graph very small, 15 percent of the normal size to show off the image.


    Figure 6-7 – An Excel Graph with CSS and a URL Added


    ![image](images/f0061-01.jpg)


    ### The IMAGE_DPI= Option


    This ODS EXCEL option enables you to adjust the pixel density of the output image.
    An image with more pixels to the inch can be expanded and not lose clarity as
    fast as a less dense image. To show the effect of this option I have produced
    two images with different IMAGE_DPI values. [SAS Code 6-13](#Chapter6.xhtml_ch6-pro13)
    creates an image with the default IMAGE_DPI density of 150 pixels per inch. While
    [SAS Code 6-14](#Chapter6.xhtml_ch6-pro14) code uses an IMAGE_DPI of 700\. Figures
    6-8 and 6-9 are both expanded to 400 times normal when viewed with Excel.


    Be careful, when the IMAGE_DPI is too large you can run out of memory and might
    need to resort to increasing the SAS MEMSIZE= system option to a value over 2GB
    if you run out of memory.


    SAS Code 6-13 – Create an Excel Graph with Default IMAGE_DPI Setting


    ods excel file = "&path.\Test_file_5.xlsx";


    %***graph_it***;


    ods excel close;


    Figure 6-8 – An Excel Graph with Default IMAGE_DPI Setting


    ![image](images/f0062-01.jpg)


    Notice the rough edges on the Pie Chart, and the downward stroke of the ‘7’ and
    ‘2’.


    SAS Code 6-14 – Create an Excel Graph with IMAGE_DPI=700 Setting


    ods excel file = "&path.\Test_file_6.xlsx"


              image_dpi=’700’;


    %***graph_it***;


    ods excel close;


    Figure 6-9 – An Excel Graph with an IMAGE_DPI = 700 Setting


    ![image](images/f0063-01.jpg)


    See the clear lines on the edge of the pie chart, and the ‘7’ and ‘2’ no longer
    look fuzzy.


    ### The STYLE= Option


    Hidden beneath each ODS output we use is a default style. When the ODS EXCEL statement
    is used to write an Excel workbook there is always a style used. The default STYLE
    is EXCEL. The ODS EXCEL STYLE= option enables you to modify that default.


    ### The ODS EXCEL STYLE= Option


    There is a way to determine what styles are available in your current version.
    [SAS Code 6-15](#Chapter6.xhtml_ch6-pro15) generates a list of the available styles.
    They are displayed by PROC TEMPLATE. They reside in the SASHELP.TMPLMST item store.
    The Table of Supported SAS Styles below contains the names of the styles supported
    in SAS version 9.4 1M3\. The SAS code prints a list and I copied the list into
    the table shown here.


    SAS Code 6-15 – Generate a List of SAS Supported Styles


    ods _all_ close;


    ods listing;


       **proc template**;


          list styles;


       **run**;


    quit;


    Table of Supported SAS Styles for SAS version 9.4 1M3


    | **List of SAS Styles Supported (SAS 9.4 1M3)** |


    | Analysis | BarrettsBlue | BlockPrint | DTree |


    | Daisy | Default | Dove | EGDefault |


    | Excel | FancyPrinter | Festival | FestivalPrinter |


    | Gantt | GrayscalePrinter | HTMLBlue | Harvest |


    | HighContrast | HighContrastLarge | Journal | Journal1a |


    | Journal2 | Journal2a | Journal3 | Journal3a |


    | Listing | Meadow | MeadowPrinter | Minimal |


    | MonochromePrinter | Monospace | Moonflower | Netdraw |


    | NoFontDefault | Normal | NormalPrinter | Ocean |


    | Pearl | PearlJ | Plateau | PowerPointDark |


    | PowerPointLight | Printer | Raven | Rtf |


    | Sapphire | SasDocPrinter | SasWeb | Seaside |


    | SeasidePrinter | StatDoc | Statistical | Word |


    | vaDark | vaHighContrast | vaLight |   |


    SAS Code 6-16 – Generate an Excel Workbook with STYLE=SEASIDE


    ods excel file = "&path.\Test_file_Style_1.xlsx"


                   STYLE=SEASIDE;


    **Proc Print** data=Asia_Only;


    **run**;


    ods excel close;


    The default STYLE is EXCEL which produces light blue Column and Row headers. Each
    of the styles listed in the Table of Supported SAS Styles produces a different
    layout in the EXCEL workbook. I have not executed code using all of the styles,
    but I do know that some of the styles only have minor differences from other styles.


    Figure 6-10 Excel Workbook Using the SEASIDE STYLE


    ![image](images/f0065-01.jpg)


    Notice the yellow Column and Row headers.


    ### The ODS EXCEL STYLE= Overrides


    There are other ways to “Stylize” your output within Excel worksheets, and some
    of them even have “STYLE=” as part of the name. However, styles are applied within
    the procedures, not the ODS statement. As a result I will list some of the different
    types of style overrides, but not show detailed examples. I found these examples
    on page 311 of SAS Institute Inc. 2016. *SAS® 9.4 Output Delivery System: User’s
    Guide, Fifth Edition*. Cary, NC: SAS Institute Inc.


    There are two methods of providing style overrides. First, as a style element,
    which is a collection of attributes that affect some output of a SAS program.
    Second, as a style attribute, which is a name-value pair that describes an output
    behavior or visual result that you want to apply to output data. A style attribute
    change is the most specific way to directly change how your data looks.


    SAS Code 6-17 – Syntax of the Style Overrides


    /* These code segments are out of context


    * The Style-override element name syntax;


    style-element-name | [style-attribute-name-1=style-attribute-value-1


    <style-attribute-name-2=style-attribute-value-2 ...>]


    * The Style-override attribute syntax;


    style={tagattr=''format:$#,##0_);[Red]\($#,##0\)


    formula:RC[-1]-RC[-2]''};


    */


    These syntax descriptions in [SAS Code 6-17](#Chapter6.xhtml_ch6-pro17) are out
    of context. These are style overrided but will not execute as coded. In order
    to get information about the proper way to use these SAS code structures. See
    SAS Institute Inc. 2016\. *SAS® 9.4 Output Delivery System: Procedures Guide,
    Third Edition*. Cary, NC: SAS Institute Inc. for these and other attribute name-value
    pairs.


    ### The TEXT= Option


    The ODS EXCEL TEXT= option enables you to place a text string into your output.
    It is that simple.


    SAS Code 6-18 – Using the ODS TEXT= Option


    ods excel file = "&path.\Text_String_1.xlsx"


                   options(sheet_interval=''NONE'');


    **Proc Print** data=Asia_Only (where=(Subsidiary = ''Bangkok''));


    **run**;


    ods excel text = '' '';


    ods excel text = ''this is two blank lines and a text string in the middle of
    my two outputs'';


    ods excel text = ''the first blank line (row 7) after the first listing is a space
    between reports generated by SAS'';


    ods excel text = '' '';


    **Proc Print** data=Asia_Only (where=(Subsidiary = ''Bangkok''));


    **run**;


    ods excel close;


    There are four ODS TEXT= options shown,


    Figure 6-11 – ODS Excel TEXT= Option Output


    ![image](images/f0066-01.jpg)


    The ODS TEXT= option lines appear on rows 8 to 11.


    ### Conclusion


    The ODS Document Object Model is generated to give information that will help
    in building the CSS style. This was mentioned in the discussion of the ANCHOR=
    option. We then moved on to creating Cascading Style Sheet files with commands
    to change colors, modify graphs, and insert data from a URL. You learned how to
    make your text and images sharper and clearer by outputting more pixels per inch.
    Text comments and style overrides rounded up the chapter. This chapter introduces
    you to many methods and options that you might never have considered using as
    output to an Excel workbook.


    ## Chapter 7: Options That Affect Worksheet Features


    [ODS Excel Destination Suboptions](#Chapter7.xhtml__Toc490065493)'
