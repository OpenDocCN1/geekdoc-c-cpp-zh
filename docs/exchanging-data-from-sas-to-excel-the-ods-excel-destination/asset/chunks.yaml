    ### Conclusion


    A number of ODS EXCEL options enable you to modify the Excel document property
    sheet. You can populate the values directly from your SAS program. The strings
    that you specify can also be SAS macro variables. This gives you full control
    over the data generated and what you want to output to the Excel workbook property
    sheet fields. Many times these values are manually updated after the workbook
    is generated. If your program writes only one workbook, this might not be an issue
    for you. However, if your SAS code produced several or hundreds of workbooks,
    you might not want to take the time to update each one manually.


    ## Chapter 5: Options That Affect the Workbook


    [ODS Excel Destination Actions](#Chapter5.xhtml__Toc490064828)


    [The FILE= Option](#Chapter5.xhtml__Toc490064829)


