    ### Conclusion


    As you can see the options shown in this chapter allow the programmer to preset
    many features that are time consuming to reproduce within the Excel file manually.
    I have shown how several different output files and file types can be produced
    in one pass over the SAS code, cutting down on the program execution time and
    manual errors. The manual generation of a Table of Contents can take hours to
    locate and to create the hyperlinks. The feature to preset tab colors and zoom
    level are also helpful for data identification and positioning on the screen or
    printed page.


