    ### Sending Graphs to Excel and Modifying the Output Using a CSS File


    One of the things that you will find out in life is that by learning a lot you
    will figure out that there is still a lot more to learn. This book was never intended
    to teach you everything about the ODS Excel options and suboptions. But because
    of the size and prevalence of CSS, I would be remiss if I did not show an example
    of adding a graph and an image to an Excel spreadsheet and modifying it using
    the ODS CSSSTYLE= option.


    First, let’s create a CSS file to make some magical color changes to a graphical
    output image.


    SAS Code 6-7 – CSS File to Change Colors on a Graph


    filename my_css "my_css_2.css";


    data _null_;


       file my_css noprint notitles linesize=132;


       put


         ".graphbackground       {background-color: orange;     } " /


         ".graphtitle1text       {color: blue; Font: 20pt arial;  " /


         "                        font-weight: bold;            } " /


         ".graphfootnotetext     {color: blue; Font: 12pt arial;  " /


         "                        font-weight: bold;            } " /


         ".graphvaluetext        {color: black;                 } " /


         ".graphdata1            {color: red;                   } " /


         ".graphdata2            {color: white;                 } " /


         ".graphdata3            {color: blue;                  } " /


         ".graphdata4            {color: red;                   } " /


         ".graphdata5            {color: white;                 } " /


         ".graphdata6            {color: blue;                  } " /


         ".graphdata7            {color: red;                   } " /


         ".graphdata8            {color: white;                 } " /


         ".graphdata9            {color: blue;                  } " ;


       run;


    Now we need to have a way to reproduce a graph so that it can be displayed in
    two Excel workbooks.


    SAS Code 6-8 – A Macro to Generate a Graph


    %macro *Graph_it*;


          PROC SQL;


          CREATE VIEW WORK.Sorted_1 AS


             SELECT T.Region, T.Sales


                  FROM SASHELP.SHOES(WHERE=(Region ne "Asia")) as T;


          QUIT;


          Legend1


             FRAME


             POSITION = (BOTTOM CENTER OUTSIDE);


          TITLE1 "Pie Chart of SASHELP.Shoes Return data by Region";


          TITLE2 "Execpt Asia";


          FOOTNOTE1 "Produced by William E Benjamin Jr";


          PROC GCHART DATA =WORK.Sorted_1;


             PIE3D  Region / SUMVAR=Sales


             TYPE=SUM            LEGEND=LEGEND1


             SLICE=OUTSIDE       PERCENT=OUTSIDE


             VALUE=OUTSIDE       OTHER=4


             OTHERLABEL="Other"  COUTLINE=BLACK


             NOHEADING;


          RUN;


          QUIT;


          TITLE;


          FOOTNOTE;


          RUN;


    %mend Graph_it;


    SAS Code 6-9 – Outputting a Graph to Excel without CSS Modifications


    /* without CSS style modification */


    ods excel file = "&path.\Test_css_file_1.xlsx";


    %***graph_it***;


    ods excel close;


    This code executes the graph using a macro to produce a graph, no CSS modifications
    are applied and the output is based on default style template that is used.


    Figure 6-5 – An Excel Graph without CSS Modifications


    ![image](images/f0058-01.jpg)


    Every part of the Graph in [Figure 6-5](#Chapter6.xhtml_ch6-fig5) has its own
    color.


    SAS Code 6-10 – Outputting a Graph to Excel with CSS Modifications


    /* with CSS style modification */


    ods excel file = "&path.\Test_css_file_2.xlsx"


        cssstyle = "&path.\my_css_2.css";


    %*graph_it*;


    ods excel close;


    The CSS file had a big affect on the output graph. It is much more colorful, but
    much less readable. I never said that all CSS file commands made good changes
    to an output process. But hopefully these code snippets will give you something
    that you can use to figure out what elements of the CSS file changed your graphical
    output.


