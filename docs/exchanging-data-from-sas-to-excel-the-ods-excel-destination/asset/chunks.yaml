  trans: "\n\n# 图 7-1 – 关闭 `EMBEDDED_FOOTNOTES=` 选项的 Excel 输出\n\n![image](img/f0073-01.jpg)\n\
    \n当关闭 `EMBEDDED_FOOTNOTES=` 选项时，输出工作表的底部不会出现任何 SAS 脚注。这是 `EMBEDDED_FOOTNOTES=`\
    \ 子选项的默认设置。这对于大多数应用程序都非常有效，因为它不会在输出工作表的任何列中放置字母。\n\n### 开启嵌入式脚注\n\n当开启 `EMBEDDED_FOOTNOTES`\
    \ 时，来自 SAS 的脚注将显示在 Excel 工作表页面上。相关代码请参阅 SAS 代码 7-2。\n\n#### SAS 代码 7-2 – 使用 `EMBEDDED_FOOTNOTES='ON'`\
    \ 选项\n\n用于生成 图 7-2 中 Excel 文件的代码：\n\n```sas\nods excel file = \"&path\\Footnote_on.xlsx\"\
    \n    options(EMBEDDED_FOOTNOTES='on');\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\n#### 图 7-2 – 开启 `EMBEDDED_FOOTNOTES=` 选项的 Excel 输出\n\n\
    ![image](img/f0074-01.jpg)\n\n图 7-2 显示了一个开启了 `EMBEDDED_FOOTNOTES=` 选项的工作表。SAS\
    \ 脚注出现在输出工作表的底部。在这里，子选项 `EMBEDDED_FOOTNOTES` 在输出表格底部之后生成脚注文本‘footnote one’。\n\n\
    #### 在工作表上有多个输出时设置 `EMBEDDED_FOOTNOTES=‘ON’`\n\n在使用 `EMBEDDED_FOOTNOTES=` 子选项配合\
    \ `SHEET_INTERVAL='NONE'` 子选项时，多个 SAS 输出可以出现在同一个工作表中，并且可以为每个 SAS 输出显示脚注。编码示例请参阅\
    \ SAS 代码 7-3，Excel 输出示例请参阅 图 7-3。\n\n#### SAS 代码 7-3 – 使用 `EMBEDDED_FOOTNOTES`\
    \ 和 `SHEET_INTERVAL` 子选项。\n\n用于生成 图 7-3 中 Excel 文件的代码：\n\n```sas\nods excel file\
    \ = \"&path\\Footnote_on_multiple.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on'\n\
    \            SHEET_INTERVAL='none');\n    proc print data=Asia_only;\n    run;\n\
    \    footnote 'footnote two';\n    proc print data=Asia_only;\n    run;\nods excel\
    \ close;\n```\n\n此代码生成了一个包含两个输出表格的 Excel 工作表，每个表格后面都有一个脚注。详情请参阅 图 7-3。\n\n####\
    \ 图 7-3 – `EMBEDDED_FOOTNOTES=` 选项开启且同一工作表上有多个输出\n\n![image](img/f0075-01.jpg)\n\
    \n在 图 7-3 中，`EMBEDDED_FOOTNOTES=` 选项在第一个输出表格之后生成脚注文本‘foot note one’，在第二个表格之后生成脚注‘foot\
    \ note two’。这两个输出表格都是通过 `SHEET_INTERVAL=` 子选项发送到同一个工作表的。\n\n### `EMBED_FOOTNOTES_ONCE=`\
    \ 子选项\n\n在 SAS 代码 7-4 中，`EMBED_FOOTNOTES_ONCE=` 子选项与 `EMBEDDED_FOOTNOTES=` 子选项结合使用。由于\
    \ SAS 代码 7-4 仅向 Excel 输出一个 SAS 表格，这里使用的 `EMBED_FOOTNOTES_ONCE` 子选项看起来像是不起作用的额外代码。然而，SAS\
    \ 代码 7-5 中的代码将两个表格发送到输出的 Excel 工作表。这里没有显示 `EMBEDDED_FOOTNOTES='OFF'` 的输出，因为它看起来与\
    \ 图 7-1 相同。\n\n#### 只有一个输出表格时使用 `EMBED_FOOTNOTES_ONCE`\n\n#### SAS 代码 7-4 – 显示如何在工作表上仅打印一次脚注\n\
    \n```sas\nfootnote 'foot note one';\nods excel file = \"&path\\Footnote_once_on.xlsx\"\
    \n    options(EMBEDDED_FOOTNOTES='on'\n            EMBED_FOOTNOTES_ONCE='on');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nSAS 代码 7-4\
    \ 仅输出一个表格和一个脚注。\n\n#### 图 7-4 – `EMBEDDED_FOOTNOTES` 和 `EMBED_FOOTNOTES_ONCE`\
    \ 均为‘ON’的 Excel 输出\n\n![image](img/f0076-01.jpg)\n\n看起来 SAS 代码 7-4 没做任何事，但请看 SAS\
    \ 代码 7-5 以查看不同的结果。\n\n#### 有多个输出表格时使用 `EMBED_FOOTNOTES_ONCE`\n\n在 SAS 代码 7-5 中，使用了\
    \ `EMBED_FOOTNOTES_ONCE=` 子选项配合 `EMBEDDED_FOOTNOTES=` 子选项。由于 SAS 代码 7-5 输出了两个\
    \ SAS 表格，`EMBED_FOOTNOTES_ONCE` 子选项在这里起到了作用。输出结果如 图 7-5 所示。`EMBEDDED_FOOTNOTES='OFF'`\
    \ 的输出未在此处显示。\n\n#### SAS 代码 7-5 – 在工作表上仅打印一次脚注\n\n```sas\nfootnote 'foot note\
    \ one';\nods excel file = \"&path\\Footnote_once_on.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on'\n\
    \            EMBED_FOOTNOTES_ONCE='on'\n            SHEET_INTERVAL='none');\n\
    \    proc print data=Asia_only;\n    run;\n    footnote 'foot note two';\n   \
    \ proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nSAS 代码 7-4 仅输出一个表格和一个脚注。\n\
    \n#### 图 7-5 – `EMBEDDED_FOOTNOTES=` 和 `EMBED_FOOTNOTES_ONCE` 均为‘ON’且同一工作表上有多个输出\n\
    \n（注：此处根据原文逻辑对应，原文中该段描述略有重复，已按语境翻译）\n\n*(纠正：原文在该部分存在描述错乱，以下为根据逻辑重新翻译对应的 SAS 代码\
    \ 7-5)*\n\n#### SAS 代码 7-5 – 在工作表上仅打印一次脚注\n\n```sas\nfootnote 'foot note one';\n\
    ods excel file = \"&path\\Footnote_on_multiple.xlsx\"\n    options(EMBEDDED_FOOTNOTES='on'\n\
    \            EMBED_FOOTNOTES_ONCE='on'\n            SHEET_INTERVAL='none');\n\
    \    proc print data=Asia_only;\n    run;\n    footnote 'foot note two';\n   \
    \ proc print data=Asia_only;\n    run;\nods excel close;\n```\n\n此代码生成了一个包含两个输出表格的\
    \ Excel 工作表，每个表格后面都有一个脚注。详情请参阅 图 7-5。\n\n*(注：原文文本中 Figure 7-5 的标题和 SAS Code 7-5\
    \ 的描述似乎存在排版上的重复，翻译时已根据 Markdown 结构进行了对齐处理。)*\n\n#### SAS 代码 7-5 – 在工作表上仅打印一次脚注\n\
    \n```sas\nfootnote 'foot note one';\nods excel file = \"&path\\Footnote_on_multiple.xlsx\"\
    \n    options(EMBEDDED_FOOTNOTES='on'\n            EMBED_FOOTNOTES_ONCE='on'\n\
    \            SHEET_INTERVAL='none');\n    proc print data=Asia_only;\n    run;\n\
    \    footnote 'foot note two';\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\n"
- fmt: "\n`SAS Code 7-8` produces the output in `Figure 7-8` showing two output tables\
    \ each with its own title.\n\nFigure 7-8 – Excel Output with EMBEDDED_TITLES=‘ON’\
    \ and Two SAS TITLE Statements\n\n![image](images/f0082-01.jpg)\n\n`Figure 7-8`\
    \ shows how the titles can be changed between procedure output tables. Here the\
    \ `SHEET_INTERVAL=` option ‘NONE’ was used to force the SAS output from two procedures\
    \ onto one Excel worksheet.\n\n### The EMBED_TITLES_ONCE= Suboption\n\nThe `EMBEDD_TITLES_ONCE=`\
    \ suboption shown here works with the `EMBEDDED_TITLES=` suboption. The SAS titles\
    \ are sent to the output Excel worksheet with the `EMBEDDED_TITLES=` option. `EMBED_TITLES_ONCE`\
    \ makes sure that the titles appear only once at the top of the page.\n\n### EMBED_TITLES_ONCE\
    \ and Only One Output Worksheet\n\nThe `EMBED_TITLES_ONCE=` suboption places the\
    \ first active SAS title onto the Excel worksheet pages. When multiple pages are\
    \ produced the titles appear on each page. The titles can be changed and the new\
    \ title will appear on the next output worksheet. When multiple outputs are sent\
    \ to one worksheet the footnotes can be changed between outputs, but only the\
    \ first active set of titles will be displayed.\n\nSAS Code 7-9 – The EMBED_TITLES_ONCE=\
    \ Suboption\n\n```sas\nTitle 'title one';\nods excel file = \"&path\\Title_once_on.xlsx\"\
    \n    options(EMBEDDED_TITLES='on'\n            EMBED_TITLES_ONCE='on');\n   \
    \ proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nWhen only one\
    \ `TITLE` statement is active it is used.\n\nFigure 7-9 – EMBED_TITLES_ONCE= Suboption\
    \ Set to ‘ON’\n\n![image](images/f0083-01.jpg)\n\nNote that when only one table\
    \ is output and if both the `EMBEDDED_TITLES=` and `EMBED_TITLES_ONCE=` suboptions\
    \ are used, then the output appears to look the same.\n\n### EMBED_TITLES_ONCE\
    \ with Multiple Outputs on a Worksheet\n\nWhen writing more than one SAS output\
    \ to the same Excel worksheet, `EMBEDDED_TITLES=`‘ON’ and `EMBED_TITLES_ONCE=`‘ON’\
    \ work together to display the SAS titles in the Excel worksheet. If two titles\
    \ would normally appear on the worksheet, the `EMBED_TITLES_ONCE=` option allows\
    \ only the first active title to be output.\n\nSAS Code 7-10 – EMBED_TITLES_ONCE\
    \ Used with Two Titles and Output Tables\n\n```sas\nTitle 'title one';\nods excel\
    \ file = \"&path\\Title_once_on_multiple.xlsx\"\n    options(EMBEDDED_TITLES='on'\n\
    \            EMBED_TITLES_ONCE='on'\n            SHEET_INTERVAL='none');\n   \
    \ proc print data=Asia_only;\n    run;\n    Title 'title two';\n    proc print\
    \ data=Asia_only;\n    run;\nods excel close;\n```\n\nFigure 7-10 – EMBEDDED_TITLES\
    \ and EMBED_TITLES_ONCE Suboptions Used with Multiple Titles\n\n![image](images/f0085-01.jpg)\n\
    \n`Figure 7-10` shows how the titles can be changed between procedure output tables.\
    \ Here the `SHEET_INTERVAL=NONE` option was used to force the SAS output from\
    \ two procedures onto one Excel worksheet. `EMBED_TITLES_ONCE=`‘ON’ suppresses\
    \ the second title, but only the first active title is placed in the worksheet.\n\
    \n### The FITTOPAGE= Suboption\n\nThe SAS ODS EXCEL suboption `FITTOPAGE=` is\
    \ a handy way to send output directly to Excel to be printed on one page. However,\
    \ Excel is in control of the printing and it will at times compress data into\
    \ a print font that becomes unreadably small. It is up to the SAS programmer to\
    \ make sure that the output being sent to Excel will be readable on one page.\
    \ My example here deliberately fits that bill.\n\nSAS Code 7-11 – The FITTOPAGE=\
    \ Suboption\n\n```sas\nods excel file = \"&path\\Fit_to_Page_off.xlsx\"\n    options(FITTOPAGE='off');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nTo determine\
    \ whether the option worked is to look at the `EXCEL Page Setup` sheet shown in\
    \ `Figure 7-1`. The `FIT TO` option on the `Page Setup` sheet is not set.\n\n\
    Figure 7-11 – FITTOPAGE= Default Suboption\n\n![image](images/f0087-01.jpg)\n\n\
    The image in `Figure 7-11` is the default setting for Excel, which is the same\
    \ as the SAS suboption `FITTOPAGE=` is set to OFF. Therefore, the setting does\
    \ not activate the `FIT TO` option within the `SCALING` settings. Consequently,\
    \ the printed output will not be forced onto one page.\n\nSAS Code 7-12 – FITTOPAGE\
    \ Suboption Set to ‘ON’\n\n```sas\nods excel file = \"&path\\Fit_to_Page_on.xlsx\"\
    \n    options(FITTOPAGE='on');\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\nFigure 7-12 – FITTOPAGE Suboption Using the ‘ON’ Setting\n\
    \n![image](images/f0088-01.jpg)\n\nThe image in `Figure 7-12` activates the `FIT\
    \ TO` option within the `SCALING` settings. The `FITTOPAGE` value used here is\
    \ ‘ON’.\n\n### The GRIDLINES= Suboption\n\nTurning grid lines on and off in Excel\
    \ usually requires accessing the `Page Setup` (see the chapter introduction) to\
    \ toggle a check box for the feature. I looked close to find the differences the\
    \ setting activated. It was only visible on the `Print Preview` panel. The difference\
    \ is a darker exterior line on the `Print Preview` panel when gridlines are on.\
    \ In fact, when viewing the `Print Preview` panel for `GRIDLINES =‘ON’ output,\
    \ there also appears to be a blank row at the bottom of the output.\n\nSAS Code\
    \ 7-13 – GRIDLINES=‘OFF’ Suboption\n\n```sas\nods excel file = \"&path\\GRIDLINES_off.xlsx\"\
    \n    options(GRIDLINES='off');\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\nFigure 7-13 – Page Setup When GRIDLINES are turned ‘OFF’\n\
    \n![image](images/f0089-01.jpg)\n\nThe `GRIDLINES` check box is blank in the `PRINT`\
    \ section.\n\nFigure 7-14 – “Print Preview” Sheet When GRIDLINES=‘OFF’\n\n![image](images/f0090-01.jpg)\n\
    \nNotice that the exterior line around the data is the same as the interior lines\
    \ of the data table. This indicates that `GRIDLINES` are turned ‘OFF’.\n\nSAS\
    \ Code 7-14 – GRIDLINES=‘ON’ Suboption\n\n```sas\nods excel file = \"&path\\GRIDLINES_on.xlsx\"\
    \n    options(GRIDLINES='on');\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\nFigure 7-15 – Page Setup When GRIDLINES Are Turned ‘ON’\n\
    \n![image](images/f0091-01.jpg)\n\nThe `GRIDLINES` check box is selected in the\
    \ `PRINT` section.\n\nFigure 7-16 – “Print Preview” Sheet When GRIDLINES=‘ON’\n\
    \n![image](images/f0092-01.jpg)\n\nNotice that the exterior line around the data\
    \ is thicker than the interior lines of the data table. This indicates that `GRIDLINES`\
    \ are turned ‘ON’ and that a blank line appears at the bottom. This blank line\
    \ at the bottom does not get to all Excel output.\n\n### The PAGES_FITHEIGHT=\
    \ Suboption\n\nThis suboption is similar to the `FITTOPAGE` suboption in that\
    \ it also adjusts the `Fit to` information on the Excel `Page Setup` sheet. This\
    \ option adjusts the number of pages in the height box of the `Fit to` Excel value.\
    \ However, Excel is still in control of the printing, so you might have to experiment\
    \ with this suboption to get Excel to output what you really want. Excel has a\
    \ tendency to reduce the font size with this suboption.\n\nSAS Code 7-15 – Using\
    \ the PAGES_FITHEIGHT= Suboption to Put More Data on One Page\n\n```sas\nods excel\
    \ file = \"&path\\PAGES_FITHEIGHT_on.xlsx\"\n    options(PAGES_FITHEIGHT='2'\n\
    \            SHEET_INTERVAL='none');\n    proc print data=Asia_only;\n    run;\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nFigure 7-17\
    \ – The PAGES_FITHEIGHT Suboption Adjusts Excel FIT TO Number of Pages Tall\n\n\
    ![image](images/f0093-01.jpg)\n\n### The PAGES_FITWIDTH= Suboption\n\nThis suboption\
    \ is similar to the `FITTOPAGE=` suboption in that it also adjusts the `Fit to`\
    \ information on the Excel `PAGE SETUP` sheet. `PAGES_FITWIDTH=` adjusts the number\
    \ of pages in the width box of the `Fit to` Excel value. However, Excel is still\
    \ in control of the printing so you might have to experiment with this suboption\
    \ to get Excel to output what you really want. Excel has a tendency to reduce\
    \ the font size with this suboption.\n\nSAS Code 7-16 – The Excel FIT TO ‘Width’\
    \ Option Puts More Information on One Printed Sheet\n"
  raw: '[SAS Code 7-8](#Chapter7.xhtml_ch7-pro8) produces the output in [Figure 7-8](#Chapter7.xhtml_ch7-fig8)
    showing two output tables each with its own title.


    Figure 7-8 – Excel Output with EMBEDDED_TITLES=‘ON’ and Two SAS TITLE Statements


    ![image](images/f0082-01.jpg)


    [Figure 7-8](#Chapter7.xhtml_ch7-fig8) shows how the titles can be changed between
    procedure output tables. Here the SHEET_INTERVAL= option ‘NONE’ was used to force
    the SAS output from two procedures onto one Excel worksheet.


    ### The EMBED_TITLES_ONCE= Suboption


    The EMBED_TITLES_ONCE= suboption shown here works with the EMBEDDED_TITLES= suboption.
    The SAS titles are sent to the output Excel worksheet with the EMBEDDED_TITLES=
    option. EMBED_TITLES_ONCE makes sure that the titles appear only once at the top
    of the page.


    ### EMBED_TITLES_ONCE and Only One Output Worksheet


    The EMBED_TITLES_ONCE= suboption places the first active SAS title onto the Excel
    worksheet pages. When multiple pages are produced the titles appear on each page.
    The titles can be changed and the new title will appear on the next output worksheet.
    When multiple outputs are sent to one worksheet the footnotes can be changed between
    outputs, but only the first active set of titles will be displayed.


    SAS Code 7-9 – The EMBED_TITLES_ONCE= Suboption


    Title ''title one'';


    ods excel file = "&path\Title_once_on.xlsx"


              options(EMBEDDED_TITLES=''on''


                      EMBED_TITLES_ONCE=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    When only one TITLE statement is active it is used.


    Figure 7-9 – EMBED_TITLES_ONCE= Suboption Set to ‘ON’


    ![image](images/f0083-01.jpg)


    Note that when only one table is output and if both the EMBEDDED_TITLES= and EMBED_TITLES_ONCE=
    suboptions are used, then the output appears to look the same.


    ### EMBED_TITLES_ONCE with Multiple Outputs on a Worksheet


    When writing more than one SAS output to the same Excel worksheet, EMBEDDED_TITLES=‘ON’
    and EMBED_TITLES_ONCE=‘ON’ work together to display the SAS titles in the Excel
    worksheet. If two titles would normally appear on the worksheet, the EMBED_TITLES_ONCE=
    option allows only the first active title to be output.


    SAS Code 7-10 – EMBED_TITLES_ONCE Used with Two Titles and Output Tables


    Title ''title one'';


    ods excel file = "&path\Title_once_on_multiple.xlsx"


              options(EMBEDDED_TITLES=''on''


                      EMBED_TITLES_ONCE=''on''


                      SHEET_INTERVAL=''none'');


       proc print data=Asia_only;


       run;


       Title ''title two'';


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-10 – EMBEDDED_TITLES and EMBED_TITLES_ONCE Suboptions Used with Multiple
    Titles


    ![image](images/f0085-01.jpg)


    [Figure 7-10](#Chapter7.xhtml_ch7-fig10) shows how the titles can be changed between
    procedure output tables. Here the SHEET_INTERVAL=NONE option was used to force
    the SAS output from two procedures onto one Excel worksheet. EMBED_TITLES_ONCE=‘ON’
    suppresses the second title, but only the first active title is placed in the
    worksheet.


    ### The FITTOPAGE= Suboption


    The SAS ODS EXCEL suboption FITTOPAGE= is a handy way to send output directly
    to Excel to be printed on one page. However, Excel is in control of the printing
    and it will at times compress data into a print font that becomes unreadably small.
    It is up to the SAS programmer to make sure that the output being sent to Excel
    will be readable on one page. My example here deliberately fits that bill.


    SAS Code 7-11 – The FITTOPAGE= Suboption


    ods excel file = "&path\Fit_to_Page_off.xlsx"


              options(FITTOPAGE=''off'');


       proc print data=Asia_only;


       run;


    ods excel close;


    To determine whether the option worked is to look at the EXCEL Page Setup sheet
    shown in [Figure 7-11](#Chapter7.xhtml_ch7-fig11). The “FIT TO” option on the
    Excel “Page Setup” sheet is not set.


    Figure 7-11 – The FITTOPAGE= Default Suboption


    ![image](images/f0087-01.jpg)


    The image in [Figure 7-11](#Chapter7.xhtml_ch7-fig11) is the default setting for
    Excel, which is the same as when the SAS suboption FITTOPAGE= is set to OFF. Therefore,
    the setting does not activate the “FIT TO” option within Excel under the “SCALING”
    settings. Consequently, the printed output will not be forced onto one page.


    SAS Code 7-12 – The FITTOPAGE Suboption Set to ‘ON’


    ods excel file = "&path\Fit_to_Page_on.xlsx"


              options(FITTOPAGE=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-12 – The FITTOPAGE Suboption Using the ‘ON’ Setting


    ![image](images/f0088-01.jpg)


    The image in [Figure 7-12](#Chapter7.xhtml_ch7-fig12) activates the “FIT TO” suboption
    within Excel under the “SCALING” settings. The FITTOPAGE value used here is ‘ON’.


    ### The GRIDLINES= Suboption


    Turning grid lines on and off in Excel usually requires accessing the Excel “Page
    Setup” (see the chapter introduction) to toggle a check box for the feature. I
    looked close to find the differences that the setting activa ted. It was only
    visible on the Excel print preview panel. The difference is a darker exterior
    grid line on the “Print Preview” panel when gridlines are on. In fact, when viewing
    the “Print Preview” panel for the GRIDLINES =‘ON’ output, there also appears to
    be a blank row at the bottom of the output tables.


    SAS Code 7-13 – The GRIDLINES=‘OFF’ Suboption


    ods excel file = "&path\GRIDLINES_off.xlsx"


              options(GRIDLINES=''off'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-13 – Page Setup When GRIDLINES are turned ‘OFF’


    ![image](images/f0089-01.jpg)


    The GRIDLINES check box is blank in the “PRINT” section.


    Figure 7-14 – “Print Preview” Sheet When GRIDLINES=‘OFF’


    ![image](images/f0090-01.jpg)


    Notice that the exterior line around the data is the same as the interior lines
    of the data table. This indicates that GRIDLINES are turned ‘OFF’.


    SAS Code 7-14 – The GRIDLINES=‘ON’ Suboption


    ods excel file = "&path\GRIDLINES_on.xlsx"


              options(GRIDLINES=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-15 – Page Setup When GRIDLINES Are Turned ‘ON’


    ![image](images/f0091-01.jpg)


    The GRIDLINES check box is selected in the “PRINT” section.


    Figure 7-16 – “Print Preview” Sheet When GRIDLINES=‘ON’


    ![image](images/f0092-01.jpg)


    Notice that the exterior line around the data is thicker than the interior lines
    of the data table. This indicates that GRIDLINES are turned ‘ON’ and that a blank
    line appears at the bottom. This blank line at the bottom does not get output
    to all Excel output.


    ### The PAGES_FITHEIGHT= Suboption


    This suboption is similar to the FITTOPAGE suboption in that it also adjusts the
    ‘Fit to’ information on the Excel ‘Page Setup’ sheet. This option adjusts the
    number of pages in the height box of the ‘Fit to’ Excel value. However, Excel
    is still in control of the printing, so you might have to experiment with this
    suboption to get Excel to output what you really want. Excel has a tendency to
    reduce the font size with this suboption.


    SAS Code 7-15 – Using the PAGES_FITHEIGHT= Suboption to Put More Data on One Page


    ods excel file = "&path\PAGES_FITHEIGHT_on.xlsx"


              options(PAGES_FITHEIGHT=''2''


                      SHEET_INTERVAL=''none'');


       proc print data=Asia_only;


       run;


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 7-17 – The PAGES_FITHEIGHT Suboption Adjusts Excel FIT TO Number of Pages
    Tall


    ![image](images/f0093-01.jpg)


    ### The PAGES_FITWIDTH= Suboption


    This suboption is similar to the FITTOPAGE= suboption in that it also adjusts
    the ‘Fit to’ information on the Excel ‘PAGE SETUP’ sheet. PAGES_FITWIDTH= adjusts
    the number of pages in the width box of the ‘Fit to’ Excel value. However, Excel
    is still in control of the printing so you might have to experiment with this
    suboption to get Excel to output what you really want. Excel has a tendency to
    reduce the font size with this suboption.


    SAS Code 7-16 – The Excel FIT TO ‘Width’ Option Puts More Information on One Printed
    Sheet'
