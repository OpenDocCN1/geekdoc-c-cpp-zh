    ### The ABSOLUTE_COLUMN_WIDTH= Suboption


    Often times you will find that you have data that either you or your boss want
    to see in one cell, for example a product description. But if a count of inventory
    or bin number (in the same column or in a different one?) is only a few characters
    long, you might also want to limit the size of that column. Most Excel output
    files have variable widths for the data in columns. While Excel does a fair job
    of adjusting the column widths when data is read into the workbook sheets, it
    often truncates or pads the width based on either the first row (variable titles
    or column names), or some other formula known only to Excel.


    The ABSOLUTE_COLUMN_WIDTH= option enables you to adjust the widths of the columns
    based on your needs. This enables you to take control of one more part of the
    output to make it what you want. [Figure 9-1](#Chapter9.xhtml_ch9-fig1) shows
    the output of the ODS Excel destination without modifications for the SAS WORK.ASIA_ONLY
    data set. [Figure 9.2](#Chapter9.xhtml_ch9-fig2) shows the output with adjusted
    column widths. [SAS Code 9.1](#Chapter9.xhtml_ch9-pro1) shows the code to produce
    output from WORK.ASIA_ONLY with and without ABSOLUTE_COLUMN_WIDTH adjustments.


    SAS Code 9-1 – ODS Excel Code to Show Default ABSOLUTE_COLUMN_WIDTH= Usage


    ods excel file = "&path\Non_Adjusted_column_width.xlsx"


      options(ABSOLUTE_COLUMN_WIDTH=''NONE'');


      proc print data=ASIA_ONLY noobs;


      run;


    ods excel close;


    Figure 9-1 – Excel Output without Adjusted Column Widths


    ![image](images/f0159-01.jpg)


    In [Figure 9-1](#Chapter9.xhtml_ch9-fig1) many of the column titles have spaces
    in front of the column names in row one of the Excel worksheet.


    SAS Code 9-2– ODS Excel Code to Show ABSOLUTE_COLUMN_WIDTH= Usage


    ods excel file = "&path\Adjusted_column_width.xlsx"


             options(ABSOLUTE_COLUMN_WIDTH=''6,14,10,6,8,9,8'');


      **proc print** data= ASIA_ONLY noobs;


      **run**;


    ods excel close;


    As mentioned above, the numbers in the ABSOLUTE_COLUMN_WIDTH= suboption in [SAS
    Code 9-2](#Chapter9.xhtml_ch9-pro2) are column-specific character counts that
    reduce the column widths.


    Figure 9-2 – Excel Output with Adjusted Column Widths


    ![image](images/f0160-01.jpg)


    When the true sizes of the output fields are known, then you can adjust the width
    of the Excel columns to use the space on the spreadsheet more efficiently.


    ### The AUTOFILTER= Suboption


    The Excel AUTOFILTER= option is something that is useful within the Excel workbook.
    It enables you to filter and sort values within a column of data without modifying
    the Excel worksheet. The default is to have all of the columns not filtered. An
    alternative strategy is to have all of the columns filtered. This option goes
    one step further in that it enables you to select a range of columns to filter.
    You can choose one column or a set of contiguous columns to filter. My examples
    in [SAS Code 9-3](#Chapter9.xhtml_ch9-pro3) and [SAS Code 9-4](#Chapter9.xhtml_ch9-pro4)
    show the ‘all’ option and the range option but do not show the null condition
    or a single column. The single column option would be a number range of just one
    number.


    SAS Code 9-3 – Code to Apply to Filters to All Excel Columns


    ods excel file = "&path\AUTOFILTER_all.xlsx"


             options(AUTOFILTER=''all'');


      proc print data=Asia_only;


      run;


    ods excel close;


    Figure 9-3 – ODS AUTOFILTER= Suboption for All Columns


    ![image](images/f0161-01.jpg)


    The small down arrow on the first row of the spreadsheet indicates that the column
    is filtered.


    SAS Code 9-4 – Code to Apply to Filters to a Range of Excel Columns


    ods excel file = "&path\AUTOFILTER_range.xlsx"


             options(AUTOFILTER=''3-5'');


      proc print data=Asia_only;


      run;


    ods excel close;


    Figure 9-4 – AUTOFILTER= to Filter a Range of Columns


    ![image](images/f0162-01.jpg)


    Notice here that only three columns, ‘C’, ‘D’, and ‘E’ have filtering turned on.


    ### The COLUMN_REPEAT= Suboption'
