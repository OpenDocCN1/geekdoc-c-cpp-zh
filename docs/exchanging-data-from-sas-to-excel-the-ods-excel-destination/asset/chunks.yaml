  trans: "\n\n## SAS 代码 9-12 – FROZEN_ROWHEADERS= 默认值\n\n```sas\nods excel file =\
    \ \"&path\\Frozen_rowHeaders_on.xlsx\"\noptions(Frozen_rowHeaders='on');\nproc\
    \ print data=Asia_only;\nrun;\nods excel close;\n```\n\n### 图 9-16 – FROZEN_ROWHEADERS=\
    \ ‘ON’ 显示列 ‘B’ 缺失\n\n![image](img/f0173-01.jpg)\n\n在这里，我将 Excel 工作表数据向左滚动了一列（隐藏了“B”列）。这一点体现在‘B’列不可见上。判断行标题是否冻结的另一种方法是看列‘A’列和‘C’列之间的垂直线。SAS\
    \ 的典型输出不会显示 SAS 输出数据之外的网格线。该线在所有行之间都是垂直的，但在 Excel 行 16 到 18 之间更为明显，因为其余的网格部分是缺失的。\n\
    \n### SAS 代码 9-13 – FROZEN_ROWHEADERS= 子选项冻结四列\n\n```sas\nods excel file = \"\
    &path\\Frozen_rowHeaders_number.xlsx\"\noptions(Frozen_rowHeaders='4');\nproc\
    \ print data=Asia_only;\nrun;\nods excel close;\n```\n\n### 图 9-17 - FROZEN_ROWHEADERS=\
    \ 有四列冻结\n\n![image](img/f0174-01.jpg)\n\n在图 9-17 中，我将 Excel 工作表数据向左滚动了一列，隐藏了“E”列。判断行标题是否冻结的另一种方法是看列‘D’和‘F’之间的垂直线。此\
    \ SAS 输出没有显示 A1 到 H15 单元格之外的网格线。指示冻结标题的垂直线在所有行之间都是垂直的，但在 Excel 行 16 到 18 之间更为明显，因为其余的网格部分是缺失的。\n\
    \n## HIDDEN_ROWS= 子选项\n\n现在可以在 SAS 执行时隐藏 Excel 工作表，而无需在创建工作簿后手动进行。`HIDDEN_ROWS=`\
    \ 子选项是灵活的；你可以在同一个 `number_list_range` 值字符串中组合单个行和范围。默认选项是不隐藏任何行。\n\n### SAS 代码\
    \ 9-14 – 隐藏一行和范围行的 HIDDEN_ROWS= 子选项\n\n```sas\nods excel file = \"&path\\Hidden_Rows.xlsx\"\
    \noptions(Hidden_Rows='4,8-10');\nproc print data=Asia_only noobs;\nrun;\nods\
    \ excel close;\n```\n\n### 图 9-18 – 隐藏行的 Excel 输出\n\n![image](img/f0175-01.jpg)\n\
    \n图 9-18 显示第 4 行以及第 8、9 和 10 行被隐藏了。注意 Excel 表头列中第 3 行和第 5 行之间以及第 7 行和第 11 行之间的双线。确保不要将\
    \ Excel 行标题列与 SAS OBS 编号混淆，后者也会跳号。\n\n## ROW_HEIGHTS= 子选项\n\n子选项名称 `ROW_HEIGHTS`\
    \ 中的‘HEIGHTS’部分是复数，正如复数名称所暗示的，该子选项会影响几行的高度。零的单值表示应使用字体大小作为下面列表中描述的所有行类型的高度。对于此选项，你需要提供一个带引号的位置参数字符串，以识别下面列出的七行高度。可以跳过某些值，但跳过的参数需要逗号来表示该参数缺失，最后一个使用的值除外。如上述，行高以点（points）为单位。\n\
    \n*   表头行\n*   表体行\n*   BY 值行\n*   标题\n*   页脚\n*   分页高度\n*   段落间距高度\n\n### SAS\
    \ 代码 9-15 – 与 ROW_HEIGHTS= 选项相关的行高的代码选项\n\n```sas\nods excel file = \"&path\\\
    Row_Heights.xlsx\"\noptions(ROW_HEIGHTS='20,15,15,35,55,25,5'\n        embedded_titles='on'\n\
    \        embedded_footnotes='on'\n        sheet_interval='none');\nTitle 'my title';\n\
    footnote 'my footnote';\nproc print data=asia_only;\nby Subsidiary;\nrun;\nods\
    \ excel close;\n```\n\n### 图 9-19 – 显示 SAS 代码 9-15 产生的不同行高的 Excel 输出\n\n![image](img/f0176-01.jpg)\n\
    \n在这个示例中，我使用 `BY` 将数据分成不同的段，以显示 Excel 输出中使用的不同类型的间距。标题和页脚比其他行大。标题用绿色突出，因为它包含了单元格“A1”，这是工作簿首次打开时的默认光标。行\
    \ `2`、`4`、`11`、`13`、`25`、`28` 和 `30` 非常小，几乎被隐藏了。子公司标题行比数据略大，BY 行被小线包围。\n\n## ROW_REPEAT=\
    \ 子选项\n\n`ROW_REPEAT=` 的结果比 `COLUMN_REPEAT=` 更难识别。如果你的数据没有延伸到第二页，那么该子选项将毫无用处。此子选项允许将第一页中间或标题的信息复制到长打印输出的后续工作表中。我正将第一页中间或标题的信息复制到长打印输出的后续工作表中。SAS\
