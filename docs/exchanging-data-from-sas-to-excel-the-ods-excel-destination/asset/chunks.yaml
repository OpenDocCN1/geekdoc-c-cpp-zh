    ### Introduction


    The ODS Excel destination “Actions” are ODS commands dealing with the structure
    and content of the output Excel workbook. There are only a few commands classified
    as “Actions” for the `ODS EXCEL` statement, and they are `Close`, `Exclude`, `Select`,
    and `Show`. In this chapter I explain these actions and provide examples. First,
    after describing the actions, I want to demonstrate the simplest implementation
    that will enable you to create an Excel workbook.


    The `ODS TRACE` statement is not actually part of the ODS Excel destination. However,
    it will help you identify the names of output ODS objects that you might want
    to `SELECT` or `EXCLUDE` when outputting data to your Excel files.


    #### Table 3-1 – ODS TRACE Statement


    | Action Parameter | Description |

    | :--- | :--- |

    | `ODS TRACE` | Creates a listing in the SAS log that identifies ODS output objects
    generated by your code that can be controlled with the `ODS EXCEL` `SELECT` and
    `EXCLUDE` actions. |


    ### ODS Excel Destination Actions


    In this chapter we will discuss the following SAS ODS Excel destination actions.


    #### Table 3-2 – ODS Excel Destination Actions


    | Action Parameter | Options | Description |

    | :--- | :--- | :--- |

    | `NONE` | none | Sends the output Excel file to the SAS default output directory.
    Depending on your version of SAS the default directory is shown in the bottom
    left or right side of the display manager window. |

    | `EXCLUDE[*]` | ALL, NONE,Exclusion(s) | Suppresses an ODS output object from
    the output Excel workbook. |

    | `SELECT[*]` | ALL, NONE,Exclusion(s) | Includes an ODS output object in the
    output Excel workbook. |

    | `SHOW[*]` | none | Writes to the SAS log the list of currently excluded or selected
    ODS output objects. |

    | `CLOSE` | none | This action closes the destination. Any files currently associated
    with the `ODS EXCEL` statement are released by SAS and can now be opened by running
    Excel. |


    `[*]` The ODS Excel destination must be open to use this action.


    ### A Simple ODS Excel Example and the CLOSE Action


    The SAS documentation describes the simplest implementation. The `ODS TRACE` statement
    is not actually part of the ODS Excel destination. However, it will help you identify
    the names of output ODS objects that you might want to `SELECT` or `EXCLUDE` when
    outputting data to your Excel files.


    The SAS documentation describes the simplest implementation. The `ODS TRACE` statement
    is not actually part of the ODS Excel destination. However, it will help you identify
    the names of output ODS objects that you might want to `SELECT` or `EXCLUDE` when
    outputting data to your Excel files.


    ```

    ODS EXCEL;

    PROC PRINT data=help.class;

    RUN;

    ODS CLOSE;

    ```

