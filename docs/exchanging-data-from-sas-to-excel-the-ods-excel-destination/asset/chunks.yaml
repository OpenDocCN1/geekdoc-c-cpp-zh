    \nPROC PRINT DATA=sashelp.shoes;\n\nrun;\n\nODS EXCEL CLOSE;\n```\n\nFigure 4-3\
    \ – Excel Document Property Sheet without the SASDATE Option\n\n![image](images/f0027-01.jpg)\n\
    \n### Excel Property Sheet Date/Time Fields with the SASDATE Option\n\nThe [SAS\
