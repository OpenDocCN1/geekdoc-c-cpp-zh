    \ DATA=SASHELP.Shoes;\n\nRUN;\n\nODS EXCEL CLOSE;\n```\n\nNote that most SAS syntax\
    \ diagrams do not show spaces between letters and symbols of the SAS instructions.\
    \ This code demonstrates that you can add spaces to make your code more readable.\n\
    \nFigure 4-2 – Excel Document Property Sheet with SAS Generated Properties\n\n\
