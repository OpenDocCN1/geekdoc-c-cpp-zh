  trans: "\n\n```sas\nods excel file = \"&path\\PAGES_FITWIDTH_on.xlsx\"\n       \
    \  options(PAGES_FITWIDTH='2'\n                 SHEET_INTERVAL='none');\n   print\
    \ some variables three times to get a wide output;\n   %let vars = region product\
    \ subsidiary stores sales;\n   proc print data=Asia_only;\n       var &vars &vars\
    \ &vars;\n   run;\nods excel close;\n```\n\n图 7-18 – `PAGES_FITWIDTH=` 子选项调整 Excel\
    \ 自动适应页数宽度\n\n![image](img/f0094-01.jpg)\n\n### SHEET_INTERVAL= 子选项\n\n当你有多个输出结果并希望将它们放在同一个\
    \ Excel 工作簿中时，`SHEET_INTERVAL=` 子选项非常有用。该子选项允许你以几种不同的方式合并或分离输出结果。该子选项可以使用五个值：'BYGROUP'、'PAGE'、'PROC'、'NONE'\
    \ 和 ‘TABLE’。下面分别显示了这些值的每个示例输出。\n\n这些子选项值执行以下任务，其中‘TABLE’是默认值。\n\n- ‘BYGROUP’ =\
    \ 为每个新的 `BYGROUP` 创建一个新的工作表。\n- ‘PAGE’ = 为过程输出的每一个新页创建一个新的工作表。\n- ‘PROC’ = 为每个新过程创建一个新的工作表，并包含该过程的所有数据。\n\
    - ‘NONE’ = 所有输出内容都在一个页上。\n- ‘TABLE’ = 为每个表格创建一个新的工作表。\n\n### SHEET_INTERVAL=‘BYGROUP’\
    \ 示例\n\n在使用 `SHEET_INTERVAL=` 子选项的‘BYGROUP’值时，当 SAS ‘BY GROUP’发生变化时会创建一个新的工作表。新\
    \ BY GROUP 的标签页名称由 SAS 生成，但可以使用处理工作表名称的其他子选项来自定义输出工作表名称。参见 `SHEET_LABEL=` 和 `SHEET_NAME=`\
    \ 子选项。\n\nSAS 代码 7-17 – 使用 `SHEET_INTERVAL=` ‘BYGROUP’值的方法\n\n```sas\nods excel\
    \ file = \"&path\\SHEET_INTERVAL_bygroup.xlsx\"\n         options(SHEET_INTERVAL='bygroup');\n\
    \   proc print data=sashelp.shoes;\n       by region;\n   run;\nods excel close;\n\
    ```\n\n使用‘BYGROUP’间隔会将每个 SAS BY 组放在新的 Excel 工作表中。示例参见图 7-19。默认标签页名称生成的名称包含“By\
    \ Group”、从 1 开始的组编号以及 By Group 区域值。\n\n图 7-19 – `SHEET_INTERVAL=` ‘BYGROUP’ Excel\
    \ 输出的第一张工作表\n\n![image](img/f0095-01.jpg)\n\n图 7-19 是使用 `SHEET_INTERVAL=` ‘BYGROUP’值生成的第一个输出工作表。生成了默认标签页名称，每个工作表都包含\
    \ `SASHELP.SHOES` 数据集中不同 Region 值的数据。\n\n图 7-20 – `SHEET_INTERVAL=` ‘BYGROUP’\
    \ Excel 输出的第二个工作表\n\n![image](img/f0096-01.jpg)\n\n图 7-20 是使用 `SHEET_INTERVAL=`\
    \ ‘BYGROUP’值生成的第二个输出工作表。生成了默认标签页名称，每个工作表都包含 `SASHELP.SHOES` 数据集中不同 Region 值的数据。\n\
    \n### SHEET_INTERVAL=‘PAGE’ 示例\n\n在使用 `SHEET_INTERVAL=` 子选项的‘PAGE’值时，当生成新的一页输出时会创建一个新的工作表。这有时很难展示，在这里我使用了两个过程\
    \ `PROC PRINT` 和 `PROC UNIVARIATE` 来生成一个新的‘PAGE’输出。\n\nSAS 代码 7-18 – 使用 `SHEET_INTERVAL=`\
    \ ‘PAGE’值的方法\n\n```sas\nods excel file = \"&path\\SHEET_INTERVAL_page.xlsx\"\n\
    \         options(SHEET_INTERVAL='page');\n   proc print data=Asia_only;\n   run;\n\
    \   PROC UNIVARIATE DATA=sashelp.shoes\n      (keep = region stores product\n\
    \      where=(region=\"Asia\" and product=\"Boot\"));\n   BY region;\n   variable\
    \ stores;\n   freq stores;\n   RUN;\nods excel close;\n```\n\n在输出的 Excel 工作簿中，标签页名称显示值‘PAGE’，后面是一个数字，然后是过程名称。标签页名称由\
    \ SAS 生成，但可以使用处理工作表名称的其他子选项来自定义输出工作表名称。参见 `SHEET_LABEL=` 和 `SHEET_NAME=` 子选项。\n\
    \n图 7-21 – ODS Excel `SHEET_INTERVAL=` ‘PAGE’ 页输出\n\n![image](img/f0097-01.jpg)\n\
    \n第一页是 14 行数据的 `PROC PRINT` 输出。\n\n图 7-22 – ODS Excel `SHEET_INTERVAL=` ‘PAGE’\
    \ 页输出\n\n![image](img/f0097-02.jpg)\n\n第二页是完整的 `PROC UNIVARIATE` 输出。\n\n### SHEET_INTERVAL=‘PROC’\
    \ 示例\n\n在使用 `SHEET_INTERVAL=` 子选项的‘PROC’值时，当执行新过程并输出数据时，会创建一个新的工作表。这很容易展示，在这里我使用了两个过程\
    \ `PROC PRINT` 和 `PROC UNIVARIATE` 在过程执行时生成一个新的工作表。在很多情况下，这种输出与使用‘PAGE’值看起来是一样的。\n\
    \nSAS 代码 7-19 – 使用 `SHEET_INTERVAL=` ‘PROC’值的方法\n\n```sas\nods excel file = \"\
    &path\\SHEET_INTERVAL_proc.xlsx\"\n         options(SHEET_INTERVAL='proc');\n\
    \   proc print data=Asia_only;\n   run;\n   PROC UNIVARIATE DATA=sashelp.shoes\n\
    \      (keep = region stores product\n      where=(region=\"Asia\" and product=\"\
    Boot\"));\n   BY region;\n   variable stores;\n   freq stores;\n   RUN;\nods excel\
    \ close;\n```\n\n图 7-23 – 使用值‘PROC’的 `SHEET_INTERVAL=` 子选项，第一页\n\n![image](img/f0098-01.jpg)\n\
    \n注意这里的 Excel 工作表名称以以前缀‘Proc’开头，这是页指示器，后面是一个数字和过程名称的指示器。\n\n图 7-24 – 使用值‘PROC’的\
    \ `SHEET_INTERVAL=` 子选项，第二页\n\n![image](img/f0099-01.jpg)\n\n`PROC PRINT` 和 `PROC\
    \ UNIVARIATE` 的所有数据都在单独的工作表表中。标签页名称由 SAS 生成，但可以使用处理工作表名称的其他子选项来自定义输出工作表名称。参见 `SHEET_LABEL=`\
    \ 和 `SHEET_NAME=` 子选项。\n\n### SHEET_INTERVAL=‘NONE’ 示例\n\nSAS 代码 7-20 显示了使用 `SHEET_INTERVAL=`\
    \ 子选项的代码，此时所有数据都发送到同一个工作表中。在更改此工作簿的 `SHEET_INTERVAL=` 值之前，不会创建新的工作表。这很容易展示，在这里使用了两个\
    \ `PROC PRINT` 过程生成了一个长列表。图 7-25 显示只有一个名为‘Sheet 1’的工作表。\n\nSAS 代码 7-20 – 使用 `SHEET_INTERVAL=`\
    \ 值的方法\n\n```sas\nods excel file = \"&path\\SHEET_INTERVAL_none.xlsx\"\n     \
    \    options(SHEET_INTERVAL='none');\n   proc print data=Asia_only;\n   run;\n\
    \   proc print data=Asia_only;\n   run;\nods excel close;\n```\n\n图 7-25 – `SHEET_INTERVAL=`\
    \ 值‘NONE’\n\n![image](img/f0100-01.jpg)\n\n当激活‘NONE’值时，所有输出都在一个页上。\n\n### SHEET_INTERVAL=‘TABLE’\
    \ 示例\n\nSAS 代码 7-21 显示了使用 `SHEET_INTERVAL=` 子选项的‘TABLE’值的代码。每个表格的数据都发送到不同的工作表，在这里使用了两个过程\
    \ `PROC PRINT` 和 `PROC UNIVARIATE` 生成了许多表格。参见图 7-26 到 7-28。\n\nSAS 代码 7-21 – 使用\
    \ `SHEET_INTERVAL=` ‘TABLE’值的方法\n\n```sas\nods excel file = \"&path\\SHEET_INTERVAL_table.xlsx\"\
    \n         options(SHEET_INTERVAL='table');\n   proc print data=Asia_only;\n \
    \  run;\n   PROC UNIVARIATE DATA=sashelp.shoes\n      (keep = region stores product\n\
    \      where=(region=\"Asia\" and product=\"Boot\"));\n   BY region;\n   variable\
    \ stores;\n   freq stores;\n   RUN;\nods excel close;\n```\n\n图 7-26 – 第一个表格 SHEET_INTERVAL\n\
    \n![image](img/f0101-01.jpg)\n\n图 7-27 – 第二个表格 SHEET_INTERVAL\n\n![image](img/f0101-02.jpg)\n\
    \n"
- fmt: "\nFigures 7-26 and 7-27 show the first two tables that are generated. The\
    \ tab names of the worksheets indicate the data source, but do not indicate the\
    \ number of sheets. To show the number of worksheets there are several ways that\
    \ it can be done. You can scroll through all of the sheets to find all six sheets,\
    \ you could add a ‘Table of Contents’ or an ‘Index’ to the workbook, or if you\
    \ are careful you can enter `ALT/F11` at the same time to show the Visual Basic\
    \ for Applications project desktop. [Figure 7-28](#Chapter7.xhtml_ch7-fig28) shows,\
    \ in the upper left corner, the Excel filename and the names of all of the worksheets\
    \ in the workbook. But, use caution. If you have never seen this part of Excel\
    \ before, it is easy to type something that will make your workbook unusable.\
    \ Just take my word that this exists.\n\nFigure 7-28 – Excel Visual Basic for\
    \ Applications Desktop\n\n![image](images/f0102-01.jpg)\n\nBe careful using the\
    \ Visual Basic for Applications desktop, you can ruin your workbook here.\n\n\
    ### The `SHE_LABEL=` Suboption\n\nSince the default values for label names on\
    \ the output sheets of an Excel workbook are not always the ones your boss wants\
    \ to see, you might want to change the tab names. The first thing you can do is\
    \ change the prefix of the generated tab names by using the `ODS Excel SHEET_LABEL=`\
    \ option. When this option is not present or set to ‘NONE’, then SAS takes over\
    \ the task of figuring out what names to apply to each tab of the workbook. You\
    \ can use a ‘string’ of your choosing to change the prefix. This option only changes\
    \ the prefix and allows SAS to determine the rest of the tab name. Excel tab names\
    \ are 32 characters long, but SAS reserves the last four characters to ensure\
    \ that unique names are output.\n\nSAS Code 7-22 – ODS Excel `SHEET_LABEL=`‘NONE’\
    \ Option Code\n\n```sas\nods excel file = \"&path\\SHEET_LABEL_none.xlsx\"\noptions(SHEET_LABEL='none');\n\
    proc print data=sashelp.shoes;\n    by region;\nrun;\nods excel close;\n```\n\n\
    Figure 7-29 – Default Value of the `SHEET_LABEL=` ‘NONE’\n\n![image](images/f0103-01.jpg)\n\
    \nThe default prefix for worksheets generated with `PRINT` procedure is “Print”\
    \ followed by a number and some part of the SAS data set name. Other procedures\
    \ will produce a different prefix. [SAS Code 7-23](#Chapter7.xhtml_ch7-pro23)\
    \ shows that you can use any string.\n\nSAS Code 7-23 – ODS Excel `SHEET_LABEL=`‘My_Prefix’\
    \ Value\n\n```sas\nods excel file = \"&path\\SHEET_LABEL_string.xlsx\"\noptions(SHEET_LABEL='My_Prefix');\n\
    proc print data=sashelp.shoes;\n    by region;\nrun;\nods excel close;\n```\n\n\
    Figure 7-30 – Use of a ‘string’ with the `SHEET_LABEL=` Option to Change the Sheet\
    \ Tab Prefix\n\n![image](images/f0104-01.jpg)\n\nIn [Figure 7-30](#Chapter7.xhtml_ch7-fig30)\
    \ the sheet tab prefix is “My_Prefix” but the rest of the tab name is the same\
    \ as the default sheet label.\n\n### The `SHEET_NAME=` Suboption\n\nThis option,\
    \ unlike the `SHEET_LABEL=` option, changes the whole sheet name. Of course, the\
    \ default here is to not use the option, because any string used with this option\
    \ replaces the whole sheet (tab) name. Once again, the Excel tab names can be\
    \ 32 characters, but SAS reserves the last four characters for a unique number\
    \ to ensure that the output sheets have unique names. The string that you provide\
    \ is used for all of the tabs until the `SHEET_NAME` suboption is changed. The\
    \ example shown in [Figure 7-31](#Chapter7.xhtml_ch7-fig31) has multiple worksheets\
    \ generated from the SAS `BY` statement, and the sheet names have a number following\
    \ the name in the second and following worksheets. This suboption also accepts\
    \ the SAS constant ‘#BYVAL’ when you want to use the BY GROUP values as the tab\
    \ names. Using this suboption enables you to have more control over the tab names\
    \ of your Excel workbook.\n\nSAS Code 7-24 – Using the `SHEET_NAME=` Option to\
    \ Change Full Names of the Excel Worksheets\n\n```sas\nods excel file = \"&path\\\
    SHEET_NAME_My_String.xlsx\"\noptions(SHEET_NAME='My_Sheet_Names');\nproc print\
    \ data=sashelp.shoes;\n    by region;\nrun;\nods excel close;\n```\n\nFigure 7-31\
    \ – Excel Output with Sheet Names Changed by the ODS Excel `SHEET_NAME` Option\n\
    \n![image](images/f0105-01.jpg)\n\n### The `SUPPRESS_BYLINES=` Suboption\n\nThe\
    \ default value for the `SUPPRESS_BYLINES=` suboption is to not suppress them.\
    \ [Figure 7-32](#Chapter7.xhtml_ch7-fig32) shows this condition. The `SHEET_INTERVAL=`\
    \ ‘NONE’ suboption forced the output from the `PRINT` procedure to one worksheet\
    \ so that the display would fit into one.\n\nSAS Code 7-25 – Using the `SUPPRESS_BYLINES=`‘OFF’\
    \ Value\n\n```sas\nods excel file = \"&path\\SUPPRESS_BYLINES_off.xlsx\"\noptions(SUPPRESS_BYLINES='off'\
    \ SHEET_INTERVAL='none');\nproc print data=sashelp.shoes\n    where=(region ne\
    \ 'Africa');\n    by region;\nrun;\nods excel close;\n```\n\nThis code not only\
    \ forces all of the output data to one Excel worksheet, it also does not include\
    \ the data for region ‘Africa’ because that data would not fit onto the first\
    \ page, as shown in [Figure 7-32](#Chapter7.xhtml_ch7-fig32).\n\nFigure 7-32 –\
    \ Excel Output Showing the `BYLINE` Values\n\n![image](images/f0106-01.jpg)\n\n\
    The data from ‘Africa’ was suppressed by the SAS code, and the `BYLINE` values\
    \ show up as ‘Region =Asia’, ‘Region=Canada’, and in all of the other regions\
    \ in the SASHELP.SHOES data.\n\nSAS Code 7-26 – Using the `SUPPRESS_BYLINES=`‘ON’\n\
    \n```sas\nods excel file = \"&path\\SUPPRESS_BYLINES_on.xlsx\"\noptions(SUPPRESS_BYLINES='on'\
    \ SHEET_INTERVAL='none');\nproc print data=sashelp.shoes\n    where=(region ne\
    \ 'Africa');\n    by region;\nrun;\nods excel close;\n```\n\nFigure 7-33 – Excel\
    \ Output with BYLINES Suppressed\n\n![image](images/f0107-01.jpg)\n\nThe data\
    \ from ‘Africa’ was suppressed by the SAS code, and the `BYLINE` values are also\
    \ suppressed in this Excel workbook.\n\n### Conclusion\n\nThe examples in this\
    \ chapter help to clearly visualize how you can adjust the ways that titles, footnotes,\
    \ and label information is displayed on your output worksheet. Having the ability\
    \ to introduce these features into your Excel output at the time your SAS code\
    \ runs can be a huge time saving coding practice. Proper use of these features\
    \ can also enhance the way that your final workbooks appear, without having to\
    \ modify your workbooks after they are generated.\n\n## Chapter 8: Options That\
    \ Affect Print\n"
  raw: 'Figures 7-26 and 7-27 show the first two tables that are generated. The tab
    names of the worksheets indicate the data source, but do not indicate the number
    of sheets. To show the number of worksheets there are several ways that it can
    be done. You can scroll through all of the sheets to find all six sheets, you
    could add a ‘Table of Contents’ or an ‘Index’ to the workbook, or if you are careful
    you can enter ALT/F11 at the same time to show the Visual Basic for Applications
    project desktop. [Figure 7-28](#Chapter7.xhtml_ch7-fig28) shows, in the upper
    left corner, the Excel filename and the names of all of the worksheets in the
    workbook. But, use caution. If you have never seen this part of Excel before,
    it is easy to type something that will make your workbook unusable. Just take
    my word that this exists.


    Figure 7-28 – Excel Visual Basic for Applications Desktop


    ![image](images/f0102-01.jpg)


    Be careful using the Visual Basic for Applications desktop, you can ruin your
    workbook here.


    ### The SHEET_LABEL= Suboption


    Since the default values for label names on the output sheets of an Excel workbook
    are not always the ones your boss wants to see, you might want to change the tab
    names. The first thing you can do is change the prefix of the generated tab names
    by using the ODS Excel SHEET_LABEL= option. When this option is not present or
    set to ‘NONE’, then SAS takes over the task of figuring out what names to apply
    to each tab of the workbook. You can use a ‘string’ of your choosing to change
    the prefix. This option only changes the prefix and allows SAS to determine the
    rest of the tab name. Excel tab names are 32 characters long, but SAS reserves
    the last four characters to ensure that unique names are output.


    SAS Code 7-22 – ODS Excel SHEET_LABEL=‘NONE’ Option Code


    ods excel file = "&path\SHEET_LABEL_none.xlsx"


              options(SHEET_LABEL=''none'');


       proc print data=sashelp.shoes;


          by region;


       run;


    ods excel close;


    Figure 7-29 – Default Value of the SHEET_LABEL= ‘NONE’


    ![image](images/f0103-01.jpg)


    The default prefix for worksheets generated with PRINT procedure is “Print” followed
    by a number and some part of the SAS data set name. Other procedures will produce
    a different prefix. [SAS Code 7-23](#Chapter7.xhtml_ch7-pro23) shows that you
    can use any string.


    SAS Code 7-23 – ODS Excel SHEET_LABEL=‘My_Prefix’ Value


    ods excel file = "&path\SHEET_LABEL_string.xlsx"


              options(SHEET_LABEL=''My_Prefix'');


       proc print data=sashelp.shoes;


          by region;


       run;


    ods excel close;


    Figure 7-30 – Use of a ‘string’ with the SHEET_LABEL= Option to Change the Sheet
    Tab Prefix


    ![image](images/f0104-01.jpg)


    In [Figure 7-30](#Chapter7.xhtml_ch7-fig30) the sheet tab prefix is “My_Prefix”
    but the rest of the tab name is the same as the default sheet label.


    ### The SHEET_NAME= Suboption


    This option, unlike the SHEET_LABEL= option, changes the whole sheet name. Of
    course, the default here is to not use the option, because any string used with
    this option replaces the whole sheet (tab) name. Once again, the Excel tab names
    can be 32 characters, but SAS reserves the last four characters for a unique number
    to ensure that the output sheets have unique names. The string that you provide
    is used for all of the tabs until the SHEET_NAME suboption is changed. The example
    shown in [Figure 7-31](#Chapter7.xhtml_ch7-fig31) has multiple worksheets generated
    from the SAS BY statement, and the sheet names have a number following the name
    in the second and following worksheets. This suboption also accepts the SAS constant
    ‘#BYVAL’ when you want to use the BY GROUP values as the tab names. Using this
    suboption enables you to have more control over the tab names of your Excel workbook.


    SAS Code 7-24 – Using the SHEET_NAME= Option to Change Full Names of the Excel
    Worksheets


    ods excel file = "&path\SHEET_NAME_My_String.xlsx"


              options(SHEET_NAME=''My_Sheet_Names'');


       proc print data=sashelp.shoes;


          by region;


       run;


    ods excel close;


    Figure 7-31 – Excel Output with Sheet Names Changed by the ODS Excel SHEET_NAME
    Option


    ![image](images/f0105-01.jpg)


    ### The SUPPRESS_BYLINES= Suboption


    The default value for the SUPPRESS_BYLINES= suboption is to not suppress them.
    [Figure 7-32](#Chapter7.xhtml_ch7-fig32) shows this condition. The SHEET_INTERVAL=
    ‘NONE’ suboption forced the output from the PRINT procedure to one worksheet so
    that the display would fit into one image.


    SAS Code 7-25 – Using the SUPPRESS_BYLINES=‘OFF’ Value


    ods excel file = "&path\SUPPRESS_BYLINES_off.xlsx"


              options(SUPPRESS_BYLINES=''off''


                      SHEET_INTERVAL=''none'');


       proc print data=sashelp.shoes


                      (where=(region ne ''Africa''));


          by region;


       run;


    ods excel close;


    This code not only forces all of the output data to one Excel worksheet, it also
    does not include the data for region ‘Africa’ because that data would not fit
    onto the first page, as shown in [Figure 7-32](#Chapter7.xhtml_ch7-fig32).


    Figure 7-32 – Excel Output Showing the ‘BYLINE’ Line Values


    ![image](images/f0106-01.jpg)


    The data from ‘Africa’ was suppressed by the SAS code, and the ‘BYLINE’ values
    show up as ‘Region =Asia’, ‘Region=Canada’, and in all of the other regions in
    the SASHELP.SHOES data set.


    SAS Code 7-26 – Using the SUPPRESS_BYLINES=‘ON’ Value


    ods excel file = "&path\SUPPRESS_BYLINES_on.xlsx"


              options(SUPPRESS_BYLINES=''on''


                      SHEET_INTERVAL=''none'');


       proc print data=sashelp.shoes


                      (where=(region ne ''Africa''));


          by region;


       run;


    ods excel close;


    Figure 7-33 – Excel Output with BYLINES Suppressed


    ![image](images/f0107-01.jpg)


    The data from ‘Africa’ was suppressed by the SAS code, and the ‘BYLINE’ values
    are also suppressed in this Excel workbook.


    ### Conclusion


    The examples in this chapter help to clearly visualize how you can adjust the
    ways that titles, footnotes, and label information is displayed on your output
    worksheet. Having the ability to introduce these features into your Excel output
    at the time that your SAS code runs can be a huge time saving coding practice.
    Proper use of these features can also enhance the way that your final workbooks
    appear, without having to modify your workbooks after they are generated.


