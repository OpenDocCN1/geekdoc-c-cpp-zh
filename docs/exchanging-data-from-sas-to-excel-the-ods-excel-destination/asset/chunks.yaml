    ### View of Microsoft Excel Changes from the Outside


    During the decade between 2006 and 2015, there have been many changes in the way
    SAS interfaced with Microsoft Excel. The changes began with the Microsoft release
    of Office 2007. Because this book deals mainly with Excel, I will refer to that
    product specifically. For many years the format of Microsoft Excel files had remained
    the same. Opening a small Excel file with the Notepad program enabled you to see
    the binary patterns of the file. While this was generally not a useful thing to
    do, the patterns did occasionally show readable text. With Microsoft Excel 2007
    the Excel format converted to a compressed file (essentially a ZIP file) of XML
    files. I am not going to try to decode those files or explain them, it just worked
    for Microsoft. They could protect their Excel files from having Visual Basic for
    Applications (VBA) macros inside the `.xlsx` files. This allowed users to know
    there were no macros and the files were safer. Microsoft did allow the Excel files
    with other file extensions to contain macros and binary components (`*.xlsm` or
    `*.xlsb` file extensions).

