    \ will look like [Figure 3-5](#Chapter3.xhtml_ch3-fig5) because nothing was “EXCLUDED”\
    \ from that ODS output stream. However, the Excel output will only include the\
    \ “Moments” and “Quantiles” ODS objects and is shown in [Figure 3-7](#Chapter3.xhtml_ch3-fig7).\n\
    \nSAS Code 3-4 – SAS Code to Select Moments and Quantiles in the Excel Output\
    \ Workbook\n\n```\nODS EXCEL options(Sheet_interval='NONE');\n\nODS EXCEL SELECT\
    \ Moments Quantiles;\n\nPROC UNIVARIATE  DATA=sashelp.shoes\n    (keep =  region\
    \ stores product\n    where=(region=\"Asia\" and product=\"Boot\"));\nvariable\
