    ### Introduction


    In this chapter, we will discuss the ODS EXCEL options that affect Row, Column,
    and Cell level data that is output into an Excel worksheet. In this chapter, the
    SASHELP.SHOES data set will be filtered with a WHERE clause to include only data
    from the “ASIA” region along with part of the SASHELP.ORSALES data set. This will
    enable me to show all of the data on the same worksheet. Unless otherwise noted,
    all of the examples in this chapter will be using the following data set called
    “ASIA_ONLY” that was shown in [Chapter 2](#Chapter2.xhtml).


    ### ODS Excel Destination Column, Row, and Cell Options


    In this chapter, we will discuss the following SAS ODS EXCEL destination topics.
    The Microsoft Help screens provide a description of how the column width and row
    heights are determined, which I have included here to help describe the heights
    listed in the following tables.


    “On a worksheet, you can specify a column width of 0 (zero) to 255\. This value
    represents the number of characters that can be displayed in a cell that is formatted
    with the standard font. The default column width is 8.43 characters. If a column
    has a width of 0 (zero), the column is hidden.


    You can specify a row height of 0 (zero) to 409\. This value represents the height
    measurement in points (1 point equals approximately 1/72 inch or 0.035 cm). The
    default row height is 12.75 points (approximately 1/6 inch or 0.4 cm). If a row
    has a height of 0 (zero), the row is hidden.”


    Table 9.1 – ODS Excel Destination Suboptions for Column Features


    | **Column Features** |


