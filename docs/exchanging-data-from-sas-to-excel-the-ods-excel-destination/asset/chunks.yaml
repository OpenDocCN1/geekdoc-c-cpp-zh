  trans: "\n\n`SAS Code 7-8` 生成了图 7-8 所示的输出，显示了两个输出表，每个表都有自己的标题。\n\n图 7-8 – 使用 EMBEDDED_TITLES=‘ON’\
    \ 和两个 SAS TITLE 语句的 Excel 输出\n\n![image](img/f0082-01.jpg)\n\n`Figure 7-8` 显示了如何在过程输出表之间更改标题。在这里，使用了\
    \ `SHEET_INTERVAL=` 选项‘NONE’来强制将两个过程的 SAS 输出到同一个 Excel 工作表中。\n\n### EMBEDDED_TITLES_ONCE=\
    \ 子选项\n\n此处显示的 `EMBEDDED_TITLES_ONCE=` 子选项与 `EMBEDDED_TITLES=` 子选项配合使用。SAS 标题通过\
    \ `EMBEDDED_TITLES=` 选项发送到输出的 Excel 工作表中。`EMBEDDED_TITLES_ONCE` 确保标题只在页顶部出现一次。\n\
    \n### EMBEDDED_TITLES_ONCE 与仅有的输出工作表\n\n`EMBEDDED_TITLES_ONCE=` 子选项将第一个活动的 SAS\
    \ 标题置于 Excel 工作表页。当产生多个页面时，标题会出现在每个页上。标题可以更改，新标题将出现在下一个输出工作表中。当将多个输出发送到一个工作表时，脚注可以在输出之间进行更改，但只会显示第一组活动标题。\n\
    \nSAS Code 7-9 – EMBEDDED_TITLES_ONCE= 子选项\n\n```sas\nTitle 'title one';\nods\
    \ excel file = \"&path\\Title_once_on.xlsx\"\n    options(EMBEDDED_TITLES='on'\n\
    \            EMBEDDED_TITLES_ONCE='on');\n    proc print data=Asia_only;\n   \
    \ run;\nods excel close;\n```\n\n当仅有一个 `TITLE` 语句处于活动状态时，将使用它。\n\n图 7-9 – EMBEDDED_TITLES_ONCE=\
    \ 子选项设置为‘ON’\n\n![image](img/f0083-01.jpg)\n\n请注意，当只输出一个表格且同时使用了 `EMBEDDED_TITLES=`\
    \ 和 `EMBEDDED_TITLES_ONCE=` 子选项时，输出看起来是相同的。\n\n 工作 工作表中具有多个输出时的 EMBEDDED_TITLES_ONCE\n\
    \n当向同一个 Excel 工作表写入多个一个 SAS 输出时，`EMBEDDED_TITLES=`‘ON’和 `EMBEDDED_TITLES_ONCE=`‘ON’会共同作用，在\
    \ Excel 工作表中显示 SAS 标题。如果通常会在工作表中出现两个标题，则 `EMBEDDED_TITLES_ONCE=` 选项允许输出第一个活动标题。\n\
    \nSAS Code 7-10 – 在两个标题和输出表在使用 EMBEDDED_TITLES_ONCE\n\n```sas\nTitle 'title one';\n\
    ods excel file = \"&path\\Title_once_on_multiple.xlsx\"\n    options(EMBEDDED_TITLES='on'\n\
    \            EMBEDDED_TITLES_ONCE='on'\n            SHEET_INTERVAL='none');\n\
    \    proc print data=Asia_only;\n    run;\n    Title 'title two';\n    proc print\
    \ data=Asia_only;\n    run;\nods excel close;\n```\n\n图 7-10 – 在多个标题在使用 EMBEDDED_TITLES\
    \ 和 EMBEDDED_TITLES_ONCE 子选项\n\n![image](img/f0085-01.jpg)\n\n`Figure 7-10` 显示了如何在过程输出表之间更改标题。在这里，使用了\
    \ `SHEET_INTERVAL=NONE` 选项强制将两个过程的 SAS 输出到一个 Excel 工作表中。`EMBEDDED_TITLES_ONCE=`‘ON’抑制了第二个标题，仅将第一个活动标题放在工作表中。\n\
    \n### FITTOPAGE= 子选项\n\nSAS ODS EXCEL 子选项 `FITTOPAGE=` 是将输出直接发送到 Excel 并在一页上的方便方法。然而，打印由\
    \ Excel 控制，它有时会将数据压缩成小到无法阅读的字体。这需要 SAS 程序员来确保发送到 Excel 的输出在页内是可读的。我这里的示例特意符合这一点。\n\
    \nSAS Code 7-11 – FITTOPAGE= 子选项\n\n```sas\nods excel file = \"&path\\Fit_to_Page_off.xlsx\"\
    \n    options(FITTOPAGE='off');\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\n确定该选项是否生效的方法是查看图 7-1 所示的 `EXCEL Page Setup` 表。`Page Setup`\
    \ 表格上的 `FIT TO` 选项未设置。\n\n图 7-11 – FITTOPAGE= 默认子选项\n\n![image](img/f0087-01.jpg)\n\
    \n图 7-11 中的图像是 Excel 的默认设置，与 SAS 子选项 `FITTOPAGE=` 设置为 OFF 相同。因此，该设置没有激活 `SCALING`\
    \ 设置中的 `FIT TO` 选项。因此，打印输出不会被强制在一页上。\n\nSAS Code 7-12 – FITTOPAGE 子选项设置为‘ON’\n\
    \n```sas\nods excel file = \"&path\\Fit_to_Page_on.xlsx\"\n    options(FITTOPAGE='on');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\n图 7-12 – 使用‘ON’设置的\
    \ FITTOPAGE 子选项\n\n![image](img/f0088-01.jpg)\n\n图 7-12 中的图像激活了 `SCALING` 设置中的\
    \ `FIT TO` 选项。此处使用的 `FITTOPAGE` 值为‘ON’。\n\n### GRIDLINES= 子选项\n\n在 Excel 中开启和关闭网格线通常需要访问\
    \ `Page Setup`（参见章节引言）来切换该功能的复选框。我仔细观察以寻找设置激活的差异。它只在 `Print Preview` 面板中可见。差异在于网格线开启时，`Print\
    \ Preview` 面板上有一条较深的外部线。事实上，当查看 `GRIDLINES =‘ON’` 输出的 `Print Preview` 面板时，输出底部似乎还有一个空行。\n\
    \nSAS Code 7-13 – GRIDLINES=‘OFF’ 子选项\n\n```sas\nods excel file = \"&path\\GRIDLINES_off.xlsx\"\
    \n    options(GRIDLINES='off');\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\n图 7-13 – 网格线设置为‘OFF’时的 Page Setup\n\n![image](img/f0089-01.jpg)\n\
    \n `GRIDLINES` 复选框在 `PRINT` 部分是空白的。\n\n图 7-14 – 网格线设置为‘OFF’时的“Print Preview”表\n\
    \n![image](img/f0090-01.jpg)\n\n注意数据周围的外部线条与内部线条相同。这表明 `GRIDLINES` 为‘OFF’。\n\n\
    SAS Code 7-14 – GRIDLINES=‘ON’ 子选项\n\n```sas\nods excel file = \"&path\\GRIDLINES_on.xlsx\"\
    \n    options(GRIDLINES='on');\n    proc print data=Asia_only;\n    run;\nods\
    \ excel close;\n```\n\n图 7-15 – 网格线设置为‘ON’时的 Page Setup\n\n![image](img/f0091-01.jpg)\n\
    \n `GRIDLINES` 复选框在 `PRINT` 部分被选中。\n\n图 7-16 – 网格线设置为‘ON’时的“Print Preview”表\n\n\
    ![image](img/f0092-01.jpg)\n\n注意数据周围的外部线条比内部线条更粗。这表明 `GRIDLINES` 为‘ON’，并且底部出现了一个空行。底部的空行并没有延伸到所有\
    \ Excel 输出。\n\n### PAGES_FITHEIGHT= 子选项\n\n`PAGES_FITHEIGHT=` 子选项与 `FITTOPAGE`\
    \ 子选项相似，它们都会在 Excel `Page Setup` 表上调整 `Fit to` 信息。该选项调整 Excel `Fit to` 框中的页数。然而，打印仍由\
    \ Excel 控制，因此你可能需要尝试此选项以让 Excel 输出你真正想要的内容。Excel 有倾向在使用此选项时减小字体。\n\nSAS Code 7-15\
    \ – 使用 PAGES_FITHEIGHT= 子选项将更多数据放在一页上\n\n```sas\nods excel file = \"&path\\PAGES_FITHEIGHT_on.xlsx\"\
    \n    options(PAGES_FITHEIGHT='2'\n            SHEET_INTERVAL='none');\n    proc\
    \ print data=Asia_only;\n    run;\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\n图 7-17 – PAGES_FITHEIGHT 子选项调整 Excel FIT TO 的页数\n\n![image](img/f0093-01.jpg)\n\
    \n### PAGES_FITWIDTH= 子选项\n\n该子选项与 `FITTOPAGE=` 子选项相似，它们都会在 Excel `PAGE SETUP`\
    \ 表上调整 `Fit to` 信息。`PAGES_FITWIDTH=` 调整 Excel `Fit to` 框中的页数。然而，打印仍由 Excel 控制，因此你可能需要尝试此选项以让\
    \ Excel 输出你真正想要的内容。Excel 有倾向在使用此选项时减小字体。\n\nSAS Code 7-16 – Excel FIT TO ‘宽度’选项将更多信息放在一个打印工作表上\n\
    \n"
- fmt: "\n```sas\nods excel file = \"&path\\PAGES_FITWIDTH_on.xlsx\"\n         options(PAGES_FITWIDTH='2'\n\
    \                 SHEET_INTERVAL='none');\n   print some variables three times\
    \ to get a wide output;\n   %let vars = region product subsidiary stores sales;\n\
    \   proc print data=Asia_only;\n       var &vars &vars &vars;\n   run;\nods excel\
    \ close;\n```\n\nFigure 7-18 – `PAGES_FITWIDTH=` Suboption Adjusts the Excel FIT\
    \ TO Number of Pages Wide\n\n![image](images/f0094-01.jpg)\n\n### The SHEET_INTERVAL=\
    \ Suboption\n\nThe `SHEET_INTERVAL=` suboption is useful when you have multiple\
    \ outputs that you want to place into the same Excel Workbook. This suboption\
    \ enables you to combine or separate the outputs in several different ways. There\
    \ are five values that you can use with this suboption: 'BYGROUP', 'PAGE', 'PROC',\
    \ 'NONE', and ‘TABLE’. An example output of each of these values is shown separately\
    \ below.\n\nThe suboption values perform the following tasks, with ‘TABLE’ being\
    \ the default.\n\n- ‘BYGROUP’ = a new worksheet is created for each new `BYGROUP`.\n\
    - ‘PAGE’ = a new worksheet is created for each new page of procedure output.\n\
    - ‘PROC’ = a new worksheet is created for each new procedure and it contains all\
    \ data for that procedure.\n- ‘NONE’ = all of the output is on one page.\n- ‘TABLE’\
    \ = a new worksheet is created for each table.\n\n### SHEET_INTERVAL=‘BYGROUP’\
    \ Example\n\nWhen using the ‘BYGROUP’ value for the `SHEET_INTERVAL=` suboption,\
    \ a new worksheet is created when the SAS ‘BY GROUP’ changes. The tab names of\
    \ new BY GROUPS are generated by SAS, but other suboptions that deal with the\
    \ sheet names can be used to customize the output sheet names. See the `SHEET_LABEL=`\
    \ and `SHEET_NAME=` suboptions.\n\nSAS Code 7-17 – Ways to Use the `SHEET_INTERVAL=`\
    \ ‘BYGROUP’ Value\n\n```sas\nods excel file = \"&path\\SHEET_INTERVAL_bygroup.xlsx\"\
    \n         options(SHEET_INTERVAL='bygroup');\n   proc print data=sashelp.shoes;\n\
    \       by region;\n   run;\nods excel close;\n```\n\nUsing the ‘BYGROUP’ interval\
    \ places each SAS BY Group onto a new Excel worksheet. See [Figure 7-19](#Chapter7.xhtml_ch7-fig19)\
    \ for an example. Default tab names were generated containing “By Group,” the\
    \ group number starting from one, and the By Group region value.\n\nFigure 7-19\
    \ – `SHEET_INTERVAL=` ‘BYGROUP’ First Sheet of Excel Output\n\n![image](images/f0095-01.jpg)\n\
    \n[Figure 7-19](#Chapter7.xhtml_ch7-fig19) is the first sheet of output generated\
    \ using the `SHEET_INTERVAL=` ‘BYGROUP’ value. Default tab names were generated\
    \ and each worksheet contains data for a different Region value of the `SASHELP.SHOES`\
    \ data set.\n\nFigure 7-20 – `SHEET_INTERVAL=` ‘BYGROUP’ Second Sheet of Excel\
    \ Output\n\n![image](images/f0096-01.jpg)\n\n[Figure 7-20](#Chapter7.xhtml_ch7-fig20)\
    \ is the second sheet of output generated using the `SHEET_INTERVAL=` ‘BYGROUP’\
    \ value. Default tab names were generated and each worksheet contains data for\
    \ a different Region value of the `SASHELP.SHOES` data set.\n\n### SHEET_INTERVAL=‘PAGE’\
    \ Example\n\nWhen using the ‘PAGE’ value for the `SHEET_INTERVAL=` suboption,\
    \ a new worksheet is created when a new page of output is generated. This is sometimes\
    \ hard to show, here I used two procedures `PROC PRINT` and `PROC UNIVARIATE`\
    \ to generate a new ‘PAGE’ of output.\n\nSAS Code 7-18 – Ways to Use the `SHEET_INTERVAL=`\
    \ ‘PAGE’ Value\n\n```sas\nods excel file = \"&path\\SHEET_INTERVAL_page.xlsx\"\
    \n         options(SHEET_INTERVAL='page');\n   proc print data=Asia_only;\n  \
    \ run;\n   PROC UNIVARIATE DATA=sashelp.shoes\n      (keep = region stores product\n\
    \      where=(region=\"Asia\" and product=\"Boot\"));\n   BY region;\n   variable\
    \ stores;\n   freq stores;\n   RUN;\nods excel close;\n```\n\nIn the output Excel\
    \ workbook the tab names show the values ‘PAGE’ followed by a number and then\
    \ the procedure name. The tab names are generated by SAS, but other suboptions\
    \ that deal with the sheet names can be used to customize the output sheet names.\
    \ See the `SHEET_LABEL=` and `SHEET_NAME=` suboptions.\n\nFigure 7-21 – The ODS\
    \ Excel `SHEET_INTERVAL=` ‘PAGE’ Page Output\n\n![image](images/f0097-01.jpg)\n\
    \nPage one is the `PROC PRINT` output of 14 lines of data.\n\nFigure 7-22 – The\
    \ ODS Excel `SHEET_INTERVAL=` ‘PAGE’ Page Output\n\n![image](images/f0097-02.jpg)\n\
    \nPage two is the full `PROC UNIVARIATE` output.\n\n### SHEET_INTERVAL=‘PROC’\
    \ Example\n\nWhen using the ‘PROC’ value for the `SHEET_INTERVAL=` suboption,\
    \ a new worksheet is created when a new procedure executes and outputs data. This\
    \ is easy to show, here I used two procedures `PROC PRINT` and `PROC UNIVARIATE`\
    \ to generate a new worksheet when procedure executes. In many cases this output\
    \ looks the same as the ‘PAGE’ value is used.\n\nSAS Code 7-19 – Ways to Use the\
    \ `SHEET_INTERVAL=` ‘PROC’ Value\n\n```sas\nods excel file = \"&path\\SHEET_INTERVAL_proc.xlsx\"\
    \n         options(SHEET_INTERVAL='proc');\n   proc print data=Asia_only;\n  \
    \ run;\n   PROC UNIVARIATE DATA=sashelp.shoes\n      (keep = region stores product\n\
    \      where=(region=\"Asia\" and product=\"Boot\"));\n   BY region;\n   variable\
    \ stores;\n   freq stores;\n   RUN;\nods excel close;\n```\n\nFigure 7-23 – The\
    \ `SHEET_INTERVAL=` Suboption Using the Value ‘PROC’, Page One\n\n![image](images/f0098-01.jpg)\n\
    \nNotice here that the Excel worksheet names begin with the prefix ‘Proc’, which\
    \ is the page indicator, followed by a number and the indicator of the procedure\
    \ name.\n\nFigure 7-24 – The `SHEET_INTERVAL=` Suboption Using the Value ‘PROC’,\
    \ Page Two\n\n![image](images/f0099-01.jpg)\n\nAll of the data for both `PROC\
    \ PRINT` and `PROC UNIVARIATE` appears in a separate worksheet for each procedure.\
    \ The tab names are generated by SAS, but other suboptions that deal with the\
    \ sheet names can be used to customize the output sheet names. See the `SHEET_LABEL=`\
    \ and `SHEET_NAME=` suboptions.\n\n### SHEET_INTERVAL=‘NONE’ Example\n\n[SAS Code\
    \ 7-20](#Chapter7.xhtml_ch7-pro20) shows code using the ‘NONE’ value for the `SHEET_INTERVAL=`\
    \ suboption where all data is sent to the same worksheet. No new worksheets are\
    \ created until the `SHEET_INTERVAL=` value is changed for this workbook. This\
    \ is easy to show, here I used two `PROC PRINT` procedures to generate a long\
    \ listing. [Figure 7-25](#Chapter7.xhtml_ch7-fig25) shows only one worksheet named\
    \ ‘Sheet 1’.\n\nSAS Code 7-20 – Ways to Use the `SHEET_INTERVAL=` ‘NONE’ Value\n\
    \n```sas\nods excel file = \"&path\\SHEET_INTERVAL_none.xlsx\"\n         options(SHEET_INTERVAL='none');\n\
    \   proc print data=Asia_only;\n   run;\n   proc print data=Asia_only;\n   run;\n\
    ods excel close;\n```\n\nFigure 7-25 – The `SHEET_INTERVAL=` Value ‘NONE’\n\n\
    ![image](images/f0100-01.jpg)\n\nAll output appears on one page when value ‘NONE’\
    \ is active.\n\n### SHEET_INTERVAL=‘TABLE’ Example\n\n[SAS Code 7-21](#Chapter7.xhtml_ch7-pro21)\
    \ shows code using the ‘TABLE’ value for the `SHEET_INTERVAL=` suboption. Data\
    \ for each table is sent to a different worksheet, here I used two procedures\
    \ `PROC PRINT` and `PROC UNIVARIATE` to generate many tables. See Figures 7-26\
    \ to 7-28.\n\nSAS Code 7-21 – Ways to Use the `SHEET_INTERVAL=` ‘TABLE’ Value\n\
    \n```sas\nods excel file = \"&path\\SHEET_INTERVAL_table.xlsx\"\n         options(SHEET_INTERVAL='table');\n\
    \   proc print data=Asia_only;\n   run;\n   PROC UNIVARIATE DATA=sashelp.shoes\n\
    \      (keep = region stores product\n      where=(region=\"Asia\" and product=\"\
    Boot\"));\n   BY region;\n   variable stores;\n   freq stores;\n   RUN;\nods excel\
    \ close;\n```\n\nFigure 7-26 – The First Table SHEET_INTERVAL\n\n![image](images/f0101-01.jpg)\n\
    \nFigure 7-27 – The Second Table SHEET_INTERVAL\n\n![image](images/f0101-02.jpg)\n"
  raw: 'ods excel file = "&path\PAGES_FITWIDTH_on.xlsx"


              options(PAGES_FITWIDTH=''2''


                      SHEET_INTERVAL=''none'');


       * print some variables three times to get a wide output;


       %let vars = region product subsidiary stores sales;


       proc print data=Asia_only;


          var &vars &vars &vars;


       run;


    ods excel close;


    Figure 7-18 – PAGES_FITWIDTH= Suboption Adjusts the Excel FIT TO Number of Pages
    Wide


    ![image](images/f0094-01.jpg)


    ### The SHEET_INTERVAL= Suboption


    The SHEET_INTERVAL= suboption is useful when you have multiple outputs that you
    want to place into the same Excel Workbook. This suboption enables you to combine
    or separate the outputs in several different ways. There are five values that
    you can use with this suboption: ''BYGROUP'', ''PAGE'', ''PROC'', ''NONE'', and
    ‘TABLE’. An example output of each of these values is shown separately below.


    The suboption values perform the following tasks, with ‘TABLE’ being the default.


    ●   ‘BYGROUP’ = a new worksheet is created for each new BYGROUP.


    ●   ‘PAGE’ = a new worksheet is created for each new page of procedure output.


    ●   ‘PROC’ = a new worksheet is created for each new procedure and it contains
    all data for that procedure.


    ●   ‘NONE’ = all of the output is on one page.


    ●   ‘TABLE’ = a new worksheet is created for each table.


    ### SHEET_INTERVAL=‘BYGROUP’ Example


    When using the ‘BYGROUP’ value for the SHEET_INTERVAL= suboption, a new worksheet
    is created when the SAS ‘BY GROUP’ changes. The tab names of new BY GROUPS are
    generated by SAS, but other suboptions that deal with the sheet names can be used
    to customize the output sheet names. See the ‘SHEET_LABEL=’ and ‘SHEET_NAME=’
    suboptions.


    SAS Code 7-17 – Ways to Use the SHEET_INTERVAL= ‘BYGROUP’ Value


    ods excel  file = "&path\SHEET_INTERVAL_bygroup.xlsx"


              options(SHEET_INTERVAL=''bygroup'');


       proc print data=sashelp.shoes;


          by region;


       run;


    ods excel  close;


    Using the ‘BYGROUP’ interval places each SAS BY Group onto a new Excel worksheet.
    See [Figure 7-19](#Chapter7.xhtml_ch7-fig19) for an example. Default tab names
    were generated containing “By Group,” the group number starting from one, and
    the By Group region value.


    Figure 7-19 – SHEET_INTERVAL= ‘BYGROUP’ First Sheet of Excel Output


    ![image](images/f0095-01.jpg)


    [Figure 7-19](#Chapter7.xhtml_ch7-fig19) is the first sheet of output generated
    using the SHEET_INTERVAL= ‘BYGROUP’ value. Default tab names were generated and
    each worksheet contains data for a different Region value of the SASHELP.SHOES
    data set.


    Figure 7-20 – SHEET_INTERVAL= ‘BYGROUP’ Second Sheet of Excel Output


    ![image](images/f0096-01.jpg)


    [Figure 7-20](#Chapter7.xhtml_ch7-fig20) is the second sheet of output generated
    using the SHEET_INTERVAL= ‘BYGROUP’ value. Default tab names were generated and
    each worksheet contains data for a different Region value of the SASHELP.SHOES
    data set.


    ### SHEET_INTERVAL=‘PAGE’ Example


    When using the ‘PAGE’ value for the SHEET_INTERVAL= suboption, a new worksheet
    is created when a new page of output is generated. This is sometimes hard to show,
    here I used two procedures PROC PRINT and PROC UNIVARIATE to generate a new ‘PAGE’
    of output.


    SAS Code 7-18 – Ways to Use the SHEET_INTERVAL= ‘PAGE’ Value


    ods excel  file = "&path\SHEET_INTERVAL_page.xlsx"


              options(SHEET_INTERVAL=''page'');


       proc print data=Asia_only;


       run;


       PROC UNIVARIATE  DATA=sashelp.shoes


          (keep =  region stores product


           where=(region="Asia" and product="Boot"));


       BY region;


       variable stores;


       freq stores;


       RUN;


    ods excel  close;


    In the output Excel workbook the tab names show the values ‘PAGE’ followed by
    a number and then the procedure name. The tab names are generated by SAS, but
    other suboptions that deal with the sheet names can be used to customize the output
    sheet names. See the ‘SHEET_LABEL=’ and ‘SHEET_NAME=’ suboptions.


    Figure 7-21 – The ODS Excel SHEET_INTERVAL= Option ‘PAGE’ Page One Output


    ![image](images/f0097-01.jpg)


    Page one is the PROC PRINT output of 14 lines of data.


    Figure 7-22 – The ODS Excel SHEET_INTERVAL= Option ‘PAGE’ Page Two Output


    ![image](images/f0097-02.jpg)


    Page two is the full PROC UNIVARIATE output.


    ### SHEET_INTERVAL=‘PROC’ Example


    When using the ‘PROC’ value for the SHEET_INTERVAL= suboption, a new worksheet
    is created when a new procedure executes and outputs data. This is easy to show,
    here I used two procedures PROC PRINT and PROC UNIVARIATE to generate a new worksheet
    when each procedure executes. In many cases this output looks the same as when
    the ‘PAGE’ value is used.


    SAS Code 7-19 – Ways to Use the SHEET_INTERVAL= ‘PROC’ Value


    ods excel  file = "&path\SHEET_INTERVAL_proc.xlsx"


              options(SHEET_INTERVAL=''proc'');


       proc print data=Asia_only;


       run;


       PROC UNIVARIATE  DATA=sashelp.shoes


          (keep =  region stores product


           where=(region="Asia" and product="Boot"));


       BY region;


       variable stores;


       freq stores;


       RUN;


    ods excel  close;


    Figure 7-23 – The SHEET_INTERVAL= Suboption Using the Value ‘PROC’, Page One


    ![image](images/f0098-01.jpg)


    Notice here that the Excel worksheet names begin with the prefix ‘Proc’, which
    is the page type indicator, followed by a number and the indicator of the procedure
    name.


    Figure 7-24 – The SHEET_INTERVAL= Suboption Using the Value ‘PROC’, Page Two


    ![image](images/f0099-01.jpg)


    All of the data for both PROC PRINT and PROC UNIVARIATE appears in a separate
    worksheet for each procedure. The tab names are generated by SAS, but other suboptions
    that deal with the sheet names can be used to customize the output sheet names.
    See the ‘SHEET_LABEL=’ and ‘SHEET_NAME=’ suboptions.


    ### SHEET_INTERVAL=‘NONE’ Example


    [SAS Code 7-20](#Chapter7.xhtml_ch7-pro20) shows code using the ‘NONE’ value for
    the SHEET_INTERVAL= suboption where all data is sent to the same worksheet. No
    new worksheets are created until the SHEET_INTERVAL= value is changed for this
    workbook. This is easy to show, here I used two PROC PRINT procedures to generate
    a long listing. [Figure 7-25](#Chapter7.xhtml_ch7-fig25) shows only one worksheet
    named ‘Sheet 1’.


    SAS Code 7-20 – Ways to Use the SHEET_INTERVAL= ‘NONE’ Value


    ods excel  file = "&path\SHEET_INTERVAL_none.xlsx"


              options(SHEET_INTERVAL=''none'');


       proc print data=Asia_only;


       run;


       proc print data=Asia_only;


       run;


    ods excel  close;


    Figure 7-25 – The SHEET_INTERVAL Value ‘NONE’


    ![image](images/f0100-01.jpg)


    All output appears on one page when value ‘NONE’ is active.


    ### SHEET_INTERVAL=‘TABLE’ Example


    [SAS Code 7-21](#Chapter7.xhtml_ch7-pro21) shows code using the ‘TABLE’ value
    for the SHEET_INTERVAL= suboption. Data for each table is sent to a different
    worksheet, here I used two procedures PROC PRINT and PROC UNIVARIATE to generate
    many tables. See Figures 7-26 to 7-28.


    SAS Code 7-21 – Ways to Use the SHEET_INTERVAL=‘TABLE’ Value


    ods excel  file = "&path\SHEET_INTERVAL_table.xlsx"


              options(SHEET_INTERVAL=''table'');


       proc print data=Asia_only;


       run;


       PROC UNIVARIATE  DATA=sashelp.shoes


          (keep =  region stores product


           where=(region="Asia" and product="Boot"));


       BY region;


       variable stores;


       freq stores;


       RUN;


    ods excel  close;


    Figure 7-26 – The First Table SHEET_INTERVAL


    ![image](images/f0101-01.jpg)


    Figure 7-27 – The Second Table SHEET_INTERVAL


    ![image](images/f0101-02.jpg)'
