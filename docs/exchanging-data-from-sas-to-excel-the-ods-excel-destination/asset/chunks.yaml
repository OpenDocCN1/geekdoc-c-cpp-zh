    \ are shown in [SAS Log 3-2](#Chapter3.xhtml_ch3-prol2) below.\n\n## Chapter 4:\
    \ Setting Excel Property Values\n\n### Introduction\nThis chapter addresses `ODS\
    \ EXCEL` destination options that enable you to enter text into the “Properties\
    \ Sheet”. This is a time-saving option that enables you to update properties at\
