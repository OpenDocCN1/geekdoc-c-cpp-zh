    \ 文档描述了简单的 `ODS EXCEL` 语句实现，如下方的 SAS 代码 4-1 所示。不带任何参数（也称为选项）编写 `ODS EXCEL` 语句代码将调用到默认主目录。SAS\
    \ 代码 4-1 展示了使用 `FILE=` 选项标识输出 Excel 工作簿的最佳实践。\n\n带有 `CLOSE` 操作参数的 `ODS EXCEL`\
    \ 语句会释放工作簿供其他活动使用，包括使用 Excel 或其他程序打开工作簿。\n\nSAS 代码 4-1 – 不更改默认 文档属性的代码\n\n```\n\
