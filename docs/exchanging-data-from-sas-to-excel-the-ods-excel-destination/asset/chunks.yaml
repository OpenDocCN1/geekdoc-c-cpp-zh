    Name:        Moments\nLabel:      Moments\nTemplate:   base.univariate.Moments\n\
    Path:        Univariate.ByGroup1.Stores.Moments\n-------------\nOutput Added:\n\
    -------------\nName:        BasicMeasures\nLabel:      Basic Measures of Location\
    \ and Variability\nTemplate:   base.univariate.Measures\nPath:        Univariate.ByGroup1.Stores.BasicMeasures\n\
    -------------\nOutput Added:\n-------------\nName:        Tests\nLabel:      Tests\n\
    Template:   base.univariate.Tests\nPath:        Univariate.ByGroup1.Stores.Tests\n\
    -------------\nOutput Added:\n-------------\nName:        Quantiles\nLabel:  \
    \    Quantiles\nTemplate:   base.univariate.Quantiles\nPath:        Univariate.ByGroup1.Stores.Quantiles\n\
    -------------\nOutput Added:\n-------------\nName:        ExtremeObs\nLabel: \
    \     Extreme Observations\nTemplate:   base.univariate.ExtremeObs\nPath:    \
    \    Univariate.ByGroup1.Stores.ExtremeObs\n-------------\nNOTE: The above message\
    \ was for the following BY group: Region=Asia\nNOTE: PROCEDURE UNIVARIATE (Total\
    \ time):\n      real time            0.75 seconds\n      cpu time            0.51\
    \ seconds\n9    ODS TRACE OFF;\n```\n\n### 图 3-5 – PROC UNIVARIATE 输出\n\n![image](img/f0018-01.jpg)\n\
    \n第一部分展示了如何从单个工作表中的原始数据创建 Excel 工作簿，其中包含所有数据变量以及一列指示 SAS 观测值编号的新列。这非常直观，并为 *.xlsx`\
    \ 输出文件生成了原生格式的 Excel 工作簿。\n\n日志列表显示了按 `PROC UNIVARIATE` 生成顺序输出的 ODS 元素。日志中的每个“Output\
    \ Added”标记描述了由 `UNIVARIATE` 过程创建的新 ODS 输出元素。ODS 对象的“Name”可以用于 `SELECT` 或 `EXCLUDE`\
    \ ODS 输出流中的该部分到 Excel 工作簿中。\n\n## ODS EXCLUDE 语句\n\n`ODS EXCLUDE` 语句是一个独立的 ODS\
    \ 语句。在这里讨论它是因为当遇到 `EXCLUDE` 语句时，语法包含了开启且激活的 ODS 语句。`ODS EXCLUDE` 语句的目的是防止 ODS\
    \ 对象输出。SAS 代码 3-2 中所示 `ODS TRACE` 语句允许你找到可用的 ODS 对象名称。SAS 代码 3-3 使用 `ODS EXCLUDE`\
    \ 语句防止 `Moments` 和 `Quantiles` ODS 对象输出到 Excel 工作簿，但 `UNIVARIATE` 过程的所有其他对象都会输出。我还使用了一个稍后描述的\
    \ ODS Excel 子选项，以便将所有输出显示在 Excel 工作簿的一个页上。当执行 SAS 代码 3-3 时，SAS 窗口看起来将像 图 3-5，因为该\
    \ ODS 输出流中没有内容被“EXCLUDE”。然而，Excel 输出将不包含 `Moments` 和 `Quantiles` ODS 对象，如 图 3-6\
    \ 所示。\n\n### SAS 代码 3-3 从 Excel 输出工作簿中排除 Moments 和 Quantiles\n\n```\nODS EXCEL\
    \ options(Sheet_interval='NONE');\nODS EXCEL EXCLUDE Moments Quantiles;\n\nPROC\
    \ UNIVARIATE  DATA=sashelp.shoes\n    (keep =  region stores product\n    where=(region=\"\
    Asia\" and product=\"Boot\"));\nBY region;\nvariable stores;\nfreq stores;\nRUN;\n\
    \nODS EXCEL CLOSE;\n```\n\n### 图 3-6 – 排除 Moments 和 Quantiles 的 Excel 输出工作簿\n\n\
