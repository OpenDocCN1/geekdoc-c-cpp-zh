    SAS Code 5-2 – Using the `ODS ID=` Option to Produce Multiple Outputs\n\n```sas\n\
    ods excel file=\"&path.\\ID_no_Style.xlsx\" ;\nods excel (id=harvest) style=harvest\n\
    \         file=\"&path.\\ID_harvest_Style.xlsx\" ;\nods pdf (id=Sapphire) style=Sapphire\n\
    \         file='ID_Sapphire_Style.pdf';\nproc print data=asia_only;\nrun;\nods\
    \ excel close;\nods excel (id=harvest) close;\nods pdf (id=Sapphire) close;\n\
    ```\n\n[Figure 5-2](#Chapter5.xhtml_ch5-fig2) is an output Excel workbook. This\
    \ workbook has no updates to the output workbook, it shows only the defaults,\
    \ and this is what SAS will normally create.\n\nFigure 5-2 – ODS Excel Output\
    \ Using No Style or `ID=` Option (the defaults)\n\n![image](images/f0035-01.jpg)\n\
    \nThe output in the next image, [Figure 5-3](#Chapter5.xhtml_ch5-fig3), was created\
