  trans: "\n\nSAS Code 9-18 在所有输出页面上复制第一页的页眉。\n\n图 9-25 – 显示 `ROW_REPEAT=‘HEADER’`\
    \ 选项设置\n\n![image](img/f0181-01.jpg)\n\n只有电子表格的第一行在页面上重复。\n\n图 9-26 – `ROW_REPEAT=\
    \ ‘HEADER’` 设置的输出\n\n![image](img/f0182-01.jpg)\n\n这是让表头打印在输出页面上的另一种方法。在图 9-26\
    \ 中，仅复制了页面的部分内容。\n\n### FORMULAS= 子选项\n\n任何使用 Excel 一段时间的人可能都可能熟悉了这样一个事实：你可以使用\
    \ Excel 公式来计算任何内容。那么，此子选项允许你使用 SAS 将公式设置为输出数据集中的字段，以便在 Excel 打开数据文件时执行。默认关闭了将数据作为公式的功能。当你想要使用\
    \ `FORMULAS=’ON’` 子选项时，任何以等号 (`=`) 开头的数据字段都会激活公式处理。`FORMULAS=` 子选项可能不是向 Excel\
    \ 工作表中添加公式的唯一方法。\n\n这里的 `DATA` 步骤正在创建一个包含等号的 SAS 字符值，以及 `Sales` 和 `Returns` 字段的值，以便可以计算\
    \ `Sales` 减去 `Returns` 的净值。当关闭公式处理时，字符值是可见的。当开启公式时，由于前加了等号，计算就会发生并显示该值。\n\nSAS\
    \ Code 9-19 中的代码适用于 SAS Code 9-20 和 SAS Code 9-21。该代码构建了一个具有新列“NET_SALES”的 SAS\
    \ 数据集。该公式从销售额中减去退货（Returns）以计算“NET_SALES”。此计算通过给 `_n_` 变量的值加 1 来避免对表头行执行。读取 `ASIA_ONLY`\
    \ 数据集的其他方法可能与我在这里选择的方法不同。\n\nSAS Code 9-19 示例：如何设置数据字段以激活 Excel 公式处理。\n\n```sas\n\
    data ASIA_FORMULAS;\n    set Asia_only;\n    row = _n_ + 1;\n    net_sales = \
    \ ='                          ||\n                left(trim(put(sales,9.)))  \
    \  ||\n                '-'                        ||\n                left(trim(put(returns,9.)))\n\
    \                ;\nrun;\n```\n\n在 ways SAS Code 9-20 或 SAS Code 9-21 之前，请执行 SAS\
    \ Code 9-19 中的代码。此代码没有显示输出图形。\n\nSAS Code 9-20 将 FORMULA 子选项设置为 ‘OFF’的打印示例。\n\n\
    ```sas\nods excel file = \"&path\\Formulas_off.xlsx\"\n    options(formulas='off');\n\
    proc print data=Asia_formulas;\n    run;\nods excel close;\n```\n\n图 9-27 关关闭时显示的\
    \ Net_Sales。\n\n![image](img/f0183-01.jpg)\n\n在未开启公式的情况下，`Net_Sales` 列没有意义。\n\n\
    SAS Code 9-21 – `FORMULA=` 子选项设置为 ‘ON’ 的打印示例\n\n```sas\nods excel file = \"&path\\\
    Formulas_on.xlsx\"\n    options(formulas='on');\nproc print data=Asia_formulas;\n\
    \    run;\nods excel close;\n```\n\n图 9-28 – 开启公式后显示的 Net_Sales\n\n![image](img/f0184-01.jpg)\n\
    \n此图像显示了 `Net_Sales` 的公式已执行。但请注意该列是左对齐的，这表明该字段默认包含字符值，未经过格式化。\n\n### START_AT=\
    \ 子选项\n\n`START_AT=` 子选项是一种方便的方法，可以将你的输出放置在 Excel 工作表中默认左上角（单元格 `A1`）以外的地方。此选项让你自由将输出放置在输出工作表的任何行和列，允许你将数据移动到单元格下方。在第\
    \ 6 章 中描述的 CSS 样式表可用于向工作表中图像，而 `START_AT=` 子选项可用于定位数据。SAS 9.4 增加了使用字母作为列标识符的功能，如“A1”。‘4,5’\
    \ 是‘列,行’格式。\n\nSAS Code 9-22 – 使用 START_AT= 子选项偏移 Excel 内的数据\n\n```sas\nods excel\
    \ file = \"&path\\Starting_at.xlsx\"\n    options(start_at='4,5');\nproc print\
    \ data=Asia_only;\n    run;\nods excel close;\n```\n\n图 9-29 – 显示输出偏移到单元格 ‘D5’，第\
    \ 4 列，第 5 行\n\n![image](img/f0185-01.jpg)\n\n通常公司会使用 logo。此选项提供了一种方法，为 logo 留出空间而无需手动移动数据。参见第\
    \ 6 章 添加图像。\n\n### 结论\n\n在本章中，我们讨论了许多 ODS 选项，它们允许我们操作 Excel 工作表的行、列和单元格。通过这些选项，可以设置公式、隐藏行或列、调整输出的高度和宽度、执行公式，并控制布局。\n\
    \n## 索引\n\nA\n`ABSOLUTE_COLUMN_WIDTH=` 9, 156\n`ABSOLUTE_ROW_HEIGHT=` 9, 157\n\
    `ANCHOR=` 8, 46\n`AUTOFILTER=` 9, 5\n`AUTHOR=` 8, 23\nB\n`BLACKANDWHITE=` 9, 110\n\
    `BLANK_SHEET=` 9, 32\n`BOX_SIZING=` 8, 54\nC\nCascading Style Sheets (CSS)\n`CATEGORY=`\
    \ 8, 25\n`CENTER_HORIZONTAL=` 9, 110\n`CENTER_VERTICAL=` 9, 116\n`CLOSE` \n`COLUMN_REPEAT=`\
    \ 9, 168\n`COMMENTS=` 8, 23\n`CONTENTS=` 9, 32\n`CSSSTYLE=` \nD\n`DATA` step,\
    \ text files\n`DOM` 8, 46\n\n`DPI=` 8, 9\n`DRAFTQUALITY=` 9, 110\nE\n`EMBEDDED_FOOTNOTES=`\n\
    `EMBEDDED_TITLES=`\n`EMBED_FOOTNOTES_ONCE=`\n"
