  trans: "\n\n此选项控制打印的 Excel 输出是否包含 Excel 的“ROW”（行）和“COLUMN”（列）值。默认不打印这些 Excel 表头。Excel\
    \ 的“ROW”（行）标题是打印工作表左侧的行号，而“COLUMN”（列）标题是打印工作表顶部的字母。选择“ON”可开启打印。默认选项为“OFF”。\n\n\
    ### SAS 代码 8-14 – 打开 ODS Excel 目标 ROWCOLHEADINGS= 选项\n\n```sas\nods excel file\
    \ = \"&path\\ROWCOLHEADINGS_on.xlsx\"\n    options(ROWCOLHEADINGS='on');\n   \
    \ proc print data=Asia_only;\n    run;\nods excel close;\n```\n\n图 8-29 – Excel\
    \ 页面设置表显示勾选行列标题的复选框\n\n![image](img/f0142-01.jpg)\n\n此图显示选中了“Row and column headings”（行列标题）复选框，表示应该打印\
    \ Excel 的“行”和“列”表头。\n\n图 8-30 – Excel 打印页显示 Excel 的“行”和“列”表头\n\n![image](img/f0143-01.jpg)\n\
    \n此页面以纵向格式输出，但为了节省空间被截断了。\n\n### SCALE= 选项\n\n我经常发现很难在一个打印页面上显示全组变量。ODS Excel\
    \ 的 `SCALE=` 选项可以帮助我减少输出，以便在页面上容纳更多内容。下方 SAS 代码 8-15 中的示例保持了纵向打印不变，但缩小了打印材料的尺寸。默认将输出比例缩放为\
    \ 100%。若要设置其他值，请在引号内放置一个正数，如 SAS 代码 8-15 所示。多年来我花了一些时间研究这个选项，并发现了一些有趣现象。我目前正在使用\
    \ Excel 2013，Excel `SCALE=` 选项的范围是正常尺寸的 10% 到 400%。如果你在 SAS 代码的字符串中输入非数值值，SAS\
    \ 会将 100 传递给 Excel。SAS 不检查你输入的值，只检查它是否为数值。我在 Excel 2013 中观察到以下结果。我不预认为会有其他差异，但在其他\
    \ Excel 版本中可能会出现。\n\n#### 当使用 Excel 2013 时，如果你输入：\n\n*   非数值值 – SAS 不生成错误，且 SAS\
    \ 将 100 传递给 Excel。\n*   负数 – SAS 不生成错误，Excel 使用 100%。\n*   数字 0 – SAS 不生成错误，Excel\
    \ 使用 10%。\n*   1 到 9 之间的数字 – SAS 不生成错误，Excel 将 \"AUTO\" 作为“PAGE LAYOUT”（页面布局）SCALE\
    \ 值。在“Page Setup”（页面设置）页面，当你尝试使用“PAGE”（页面）选项卡时会显示错误消息。信息为“数字必须在 10 到 400 之间。请输入此范围内的数字重试。”然后你必须取消并在“SCALE”而非“AUTO”输入数字。\n\
    *   10 到 400 = 正常\n*   401 到 32767 之间的数字 – SAS 不生成错误信息，Excel 使用输入的数字作为“PAGE LAYOUT”SCALE\
    \ 值以及“PAGE”选项卡上的“Page Setup”比例值。不会产生 Excel 错误，你可以进入“Print Preview”（打印预览）页。然而，当你退出“Print\
    \ Preview”页时，两个位置的比例值都会恢复为 400。此外，任何尝试使用切换箭头增加或减少比例值的操作都会导致值恢复为 400%。\n*   大于\
    \ 32767 的数字 ((2 ** 15) -1) 会导致 Excel 在访问“Page Setup”表上的“PAGE”选项卡时产生错误。此值通常被称为\
    \ 32K，因为从 0 开始恰好存在 2 的 15 次方的个数字。在二进制中，其范围从 ‘000000000000000’b 到 ‘111111111111111’b。\n\
    \n### SAS 代码 8-15 – 将 ODS Excel SCALE 选项设置为正常尺寸的 50%\n\n```sas\nods excel file\
    \ = \"&path\\SCALE_50.xlsx\"\n    options(SCALE='50');\n    proc print data=Asia_only;\n\
    \    run;\nods excel close;\n```\n\n图 8-31 – ODS Excel 目标“SCALE=” 选项设置为‘50’时的结果\n\
    \n![image](img/f0145-01.jpg)\n\n你可以在此处显示的 Excel“Page Layout”（页面布局）选项卡和“Page Setup”（页面设置）表上查看“SCALE”值。\n\
    \n图 8-32 – 选择“SCALE='50’”时的输出\n\n![image](img/f0146-01.jpg)\n\n这是整页的打印输出。是的，在这个尺寸下，它几乎无法阅读，尤其是如果你在小屏幕上阅读的话。但字体尺寸的减小确实能让你在一个工作表上放置更多信息。如果你以横向（Landscape）模式打印并有更多列，效果更好。\n\
    \n### TITLE_FOOTNOTE_NOBREAK= 选项\n\nODS Excel 目标 `TITLE_FOOTNOTE_NOBREAK=` 选项是一个棘手的选项。它属于那种“今天我们没有香蕉”类型的选项之一。许多人称其为双重否定选项。“NOBREAK”（不换行）部分表示在输出中不换行标题和脚注。而“TITLE”FOOTNOTE_NOBREAK”选项本身表示不换行标题和脚注。不使用该选项的“NO”值意味着标题和脚注过长时换行。是的，我知道这很困惑。希望下面的代码和截图有所帮助。我将直接显示产生输出\
    \ Excel 工作表的代码段。\n\n### SAS 代码 8-16 – 默认设置 TITLE_FOOTNOTE_NOBREAK= \n\n```sas\n\
    title   \"This a my long title so I can show that it wraps around when title_footnote_nobreak\
    \ is active.\";\nfootnote \"This a my very long footnote (it prints in a smaller\
    \ font) so I can show that it wraps around when title_footnote_nobreak not active.\"\
    ;\nods excel file = \"&path\\TITLE_FOOTNOTE_NOBREAK_default.xlsx\"\n    options(embedded_titles='yes'\n\
    \            embedded_footnotes='yes');\nproc print data=asia_only;\nrun;\nods\
    \ excel close;\n```\n\nSAS 代码 8-16 代码是 `TITLE_FOOTNOTE_NOBREAK=` 选项的默认设置，当标题或脚注过长时，会导致标题和脚注换到下一行。\n\
    \n图 8-33 – 默认设置 TITLE_FOOTNOTE_NOBREAK= \n\n![image](img/f0148-01.jpg)\n\n不使用\
    \ ODS EXCEL `TITLE_FOOTNOTE_NOBREAK=` 选项时，如果标题或脚注过长，它们会换行。此外，注意标题和脚注的字体大小不同，且加粗选项也不同。\n\
    \nSAS 代码 8-17 中的代码将 `TITLE_FOOTNOTE_NOBREAK=` 选项设置为“NO”，产生的结果与默认选项相同。\n\n"
