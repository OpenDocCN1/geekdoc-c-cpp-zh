    \ stores;\n\nfreq stores;\nRUN;\n\nODS EXCEL CLOSE;\n```\n\nLog Output 3-2 – Example\
    \ of the Output of the ODS SHOW Statement\n\n```\n65   ODS EXCEL options(Sheet_interval='NONE');\n\
