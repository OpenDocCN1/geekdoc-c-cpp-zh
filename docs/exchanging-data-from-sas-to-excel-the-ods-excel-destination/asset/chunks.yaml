    Because the SAS University Edition run-time environment differs slightly from
    other SAS products, I found that special code was needed that might not be needed
    in SAS Studio. I recommend using SAS University Edition because it is a great
    way for new SAS users to learn how to use SAS software without spending a lot
    of money. Please see the following paper I wrote, available at the following URL:
    https://pharmasug.org/proceedings/2017/AD/PharmaSUG-2017-AD12.pdf . This paper
    was presented at PharmaSUG 2017 and is titled “Using the ODS EXCEL Destination
    with SAS^® University Edition to Send Graphs to Excel.”


    ## Output and Graphics


    All output and graphs were generated by using Base SAS or SAS/GRAPH. The code
    can be found in the book or on my SAS Author page, located at the following URL:
    https://support.sas.com/authors.


    ## We Want to Hear from You


    SAS Press books are written by SAS Users for SAS Users. We welcome your participation
    in their development and your feedback on SAS Press books that you are using.
    Please visit sas.com/books to do the following:


    - Sign up to review a book

    - Recommend a topic

    - Request information about how to become a SAS Press author

    - Provide feedback on a book


    Do you have questions about a SAS Press book that you are reading? Contact the
    author through saspress@sas.com or https://support.sas.com/author_feedback.


    SAS has many resources to help you find answers and expand your knowledge. If
    you need additional help, see our list of resources located at the following URL:
    sas.com/books.


    ## About The Author


    ![image](images/f00xi-01.jpg)


    William E. Benjamin, Jr., owns Owl Computer Consultancy, LLC, and works as a consultant,
    trainer, and author. William has been a SAS user for over 30 years and a consultant
    since 2007. He received an MBA from Western International University and a BS
    in computer science from Arizona State University. He has written and presented
    papers for SAS Global Forum, as well as many regional and local SAS users groups.


    Learn more about this author by visiting his author page at http://support.sas.com/benjamin.
    There you can download free book excerpts, access example code and data, read
    the latest reviews, get updates, and more.


    ## Chapter 1: Introduction


    - [What is the SAS ODS EXCEL Destination?](#Chapter1.xhtml__Toc490057055)

    - [Why I like Backward Compatibility](#Chapter1.xhtml__Toc490057056)

    - [Why the ODS Excel Destination Is an Output-Only Feature of SAS](#Chapter1.xhtml__Toc490057057)

    - [Layout of This Book](#Chapter1.xhtml__Toc490057058)

    - [General Chapter Layout](#Chapter1.xhtml__Toc490057059)


    ### Introduction


    Since I began writing code in 1973 to make computers do what I wanted them to
    do, instead of what they wanted to do, I have always worked as an application
    programmer. That means that I used someone’s software to build a tool to do something.
    When I upgrade my software the tools I have already written still need to work,
    because not every computer is upgraded at the same time and new features need
    to be available to everyone.


    While Base SAS and other features of SAS software make SAS an important and useful
    software suite, many people are not programmers or analysts and do not write computer
    programs. These people have learned to use and understand how Microsoft Excel
    can benefit them. They are quite often managers, directors, and vice presidents,
    and they want to use the data in a comfortable format. Since the release of Microsoft
    Excel 2007 and the Open XML format, the upgrades made to Excel and computer hardware
    in general have caused many updates and changes to the way SAS processes Microsoft
    Excel workbooks and worksheets.


    The first adaptations came in the form of learning to read and write the new Excel
    formats. These changes upgraded `PROC EXPORT`, `PROC IMPORT`, the `SAS LIBNAME`
    statement, and the new `SAS PC Files Server`. The introduction of the `SAS PC
    Files Server` bridged the 32 to 64-bit barrier in application software, operating
    system software, and computer hardware. The release of the `SAS ODS EXCELXP` tagset
    occurred before the introduction of Excel 2007. The `EXCELXP` tagset writes output
    text files in the Extensible Markup Language (XML) format. Both Excel 2003 and
    2007 can read these files. The new Excel 2007 (and later) workbooks are stored
    in the open XML format. Between the release of the `EXCELXP` tagset and December
    2014, over 100 modifications in several releases occurred.


    In late December 2014, I found out about a new SAS ODS feature, the `ODS EXCEL`
    destination. After nearly eight years of research and preparation my first book
    was days away from being finalized for publication. I realized I had the software
    required to create an example and lobbied hard to get something into my first
    book. This second book replaces the page and half that introduced the EXCEL destination
    in the first book.


    ### What is the SAS ODS EXCEL Destination?


    The SAS Output Delivery System has two major features that deal with outputting
    data that Microsoft Excel can read. The general classifications are tagsets and
    deinations. Each of these has many features. Tagsets are created by `PROC TEMPLATE`
    code that any SAS programmer can modify, while the ODS destinations are fixed
    executable modules that the user cannot modify. While the `ODS EXCEL` destination
    is a new part of Base SAS, many of the features of the `EXCELXP` tagset are available
    to the new `ODS EXCEL` destination. See Chapter 2, “ODS Tagset versus Destination”
    for more information.


    ### Why I like Backward Compatibility


    Backward compatibility is a challenge that nearly every software producer faces.
    It does not matter if you develop software suites, operating systems, or reports
    for your boss. The only thing you can guarantee about the software, data, or reports
    you need need produce is that they will change. SAS is one of the software producers
    that do a good job of maintaining backward compatibility. Sometimes I recode legacy
    features to accept the same inputs as before but I also accept new options and
    output new information. This allows the legacy code to run seamlessly but give
    new features to existing routines. At other times the SAS documentation is updated
    to say that an option is retained for backward compatibility, but is not used
    by the software.


    I like backward capability because it enables me to write new code inside a current
    feature of a tool I have written. This leaves the existing functions intact and
    lets me write new features. Thus, allowing me to have one upgraded program without
    losing features.


    #### Why I Cannot Use Backward Compatibility for This Book


    The change from the binary formatted `*.xls` file structure to the open XML file
    format was a big file format change that was introduced with Microsoft Office
    2007. The new output `*.xlsx` file format, which included “zip” files of XML code,
    also changed the access method for all new Excel workbook files. Any SAS user
    that needed to read or write an Excel worksheet needed to consider the Excel workbook
    format changes.

