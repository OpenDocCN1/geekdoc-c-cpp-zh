  trans: "\n\n[content]\n\n公司通常希望在每个打印页的顶部显示与公司或文档相关的特殊信息。`PRINT_HEADER=` 选项将文本字符串放入\
    \ Excel 工作表区域，从而在每页的顶部设置页眉。此页眉通常是手动设置的，但 SAS 可以在运行时插入文本。SAS 标题（title）将覆盖此选项并取而代之。要消除\
    \ SAS 生成的标题（例如“The SAS System”），请使用 `TITLE` 语句。\n\n#### SAS 代码 8-10 – `PRINT_HEADER=`\
    \ \n\n```sas\nods excel file = \"&path\\PRINT_HEADER.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text');\n   title;\n   proc print data=Asia_only;\n   run;\nods excel\
    \ close;\n```\n\n图 8-19 – `PRINT_HEADER=` 页面设置\n\n![image](img/f0130-01.jpg)\n\
    \n为了在图 8-20 的页面顶部获得“My Header Text”文本，必须使用 `TITLE` 语句关闭 SAS 标题。\n\n图 8-20 – 显示请求文本“My\
    \ Header Text”的打印结果\n\n![image](img/f0131-01.jpg)\n\n完整的打印页显示了输出页眉文本的位置。\n\n####\
    \ `PRINT_HEADER_MARGIN=` 选项\n\n页面设置表中的 Excel “页眉”（Header）设置似乎与页面设置表中的“顶部”（Top）边距设置独立运行。我需要花一点时间解释它的工作原理。我的示例\
    \ SAS 代码 8-11 显示了多个选项，而不只是 `PRINT_HEADER_MARGIN=` 选项。此示例的作用是输出三个 Excel 工作簿。我将展示一个页面设置表，并描述\
    \ `PRINT_HEADER_MARGIN=` 设置的三种不同值如何影响打印输出。在这个示例中，我还会显示预览表上的边距和标题选项卡，以解释示例。默认页眉设置为\
    \ 0.0（零）英寸，这也是顶部边距设置的常用默认值。我还减少了 `PRINT_AREA=` 的打印输出量，并添加了 `PRINT_HEADER=` 文本字符串。这样我就可以展示两者都被输出了，但页眉被打印输出\
    \ Excel 数据单元格的信息所隐藏。\n\n#### SAS 代码 8-11 – 使用 `PRINT_HEADER_MARGIN` 设置的示例\n\n\
    ```sas\nods excel (id=1) file = \"&path\\PRINT_HEADER_Margin_0_5.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text'\n           PRINT_HEADER_MARGIN='0.5'\n           PRINT_AREA='b,4,f,9');\n\
    ods excel (id=2) file = \"&path\\PRINT_HEADER_Margin_1.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text'\n           PRINT_HEADER_MARGIN='1'\n           PRINT_AREA='b,4,f,9');\n\
    ods excel (id=3) file = \"&path\\PRINT_HEADER_Margin_4.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text'\n           PRINT_HEADER_MARGIN='4'\n           PRINT_AREA='b,4,f,9');\n\
    \   title ;\n   proc print data=Asia_only;\n   run;odsods excel (id=1) close;\n\
    ods excel (id=2) close;\nods excel (id=3) close;\n```\n\n图 8-21 – 页眉设置为 0.5 英寸的\
    \ Excel 页面设置\n\n![image](img/f0133-01.jpg)\n\n此截图显示了 SAS 代码 8-11 示例的第一步输出，其中 `PRINT_HEADER_MARGIN=`\
    \ 值设置为 0.5 英寸。此处未显示的输出文件（`ID=2` 和 `ID=3`）将页眉框中的值分别设置为 1 和 4 英寸。打印预览页见图 8-22、8-23\
    \ 和 8-24。\n\n图 8-22 – `PRINT_HEADER_MARGIN=0.5` 和 Excel 顶部边距=0.5\n\n![image](img/f0134-01.jpg)\n\
    \n具有 0.5 英寸默认顶部边距和 0.5 英寸 `PRINT_HEADER_MARGIN=` 的打印输出。这显示了默认顶部边距和 `ODS PRINT_HEADER_MARGIN=`\
    \ 是对齐的。\n\n图 8-23 – `PRINT_HEADER_MARGIN=1.0` 和 Excel 顶部边距=0.5\n\n![image](img/f0135-01.jpg)\n\
    \n具有 0.5 英寸默认顶部边距和 1.0 英寸 `PRINT_HEADER_MARGIN=` 的打印输出。这显示了默认顶部边距和 `ODS PRINT_HEADER_MARGIN=`\
    \ 是分开应用的。\n\n图 8-24 – `PRINT_HEADER_MARGIN=4.0` 和 Excel 顶部边距=0.5\n\n![image](img/f0136-01.jpg)\n\
    \n具有 0.5 英寸默认顶部边距和 4.0 英寸 `PRINT_HEADER_MARGIN=` 的打印输出。这显示了默认顶部边距和 `ODS PRINT_HEADER_MARGIN=`\
    \ 是分开应用的，且 `PRINT_HEADER_MARGIN=` 同样独立于打印数据。\n\n#### `ROWBREAKS_COUNT=` 选项\n\n\
    `ROWBREAKS_COUNT=` 选项允许你作为程序员将输出页按你想要的分分组。在 SAS 代码 8-12 中，我使用了值‘10’。如果不打印输出页，很难看到此选项的结果。然而，如果你调用打印预览然后返回标准工作表，将显示新的虚线。这些虚线代表了在打印页面时使用的分页符。\n\
    \n#### SAS 代码 8-12 – `ROWBREAKS_COUNT=` 设置为 10\n\n```sas\nods excel file = \"\
    &path\\ROWBREAKS_COUNT.xlsx\"\n   options(ROWBREAKS_COUNT='10');\n   proc print\
    \ data=Asia_only;\n   run;\nods excel close;\n```\n\n图 8-25 – 应用 `ROWBREAKS_COUNT=10`\n\
    \n![image](img/f0137-01.jpg)\n\n垂直虚线和“Obs 10”下方的线代表将发生的分页。同样注意，`ROWBREAKS_COUNT=`\
    \ 分隔了数据，并显示在第一页的后续中。\n\n#### `ROWBREAKS_INTERVAL=` 选项\n\n`ROWBREAKS_INTERVAL=`\
    \ 选项在选择 `SHEET_INTERVAL='NONE'` 时效果最佳。当你选择不将所有信息放在一个工作表中时，它可能会产生新的 Excel 工作表。SAS\
    \ 代码 8-13 示例输出了三个工作簿。最后的 Excel 工作簿将比例设置为 50% 以将所有内容放入一个页。图 8-26 到 8-28 显示了整个第一页。图\
    \ 8-26 的底部是分页计数。这些示例都在 Excel 工作表中。\n\n#### SAS 代码 8-13 – 所有选项的 `ROWBREAKS_INTERVAL=`\n\
    \n```sas\nods excel (id=1) file = \"&path\\ROWBREAKS_INTERVAL_out.xlsx\"\n   options(ROWBREAKS_INTERVAL='output'\n\
    \           sheet_interval=\"none\");\nods excel (id=2) file = \"&path\\ROWBREAKS_INTERVAL_proc.xlsx\"\
    \n   options(ROWBREAKS_INTERVAL='proc'\n           sheet_interval=\"none\");\n\
    ods excel (id=3) file = \"&path\\ROWBREAKS_INTERVAL_none.xlsx\"\n   options(ROWBREAKS_INTERVAL='none'\n\
    \           sheet_interval=\"none\"\n           scale='50');\nproc sort data=Asia_only\
    \ out=temp;\n   by product;\n   run;\nproc print data=temp;\n   by product;\n\
    \   run;\nproc print data=temp;\n   by product;\n   run;\nods excel (id=1) close;\n\
    ods excel (id=2) close;\nods excel (id=3) close;\n```\n\n图 8-26 – `ROWBREAKS_INTERVAL=`\
    \ 设置为每个输出更改分页\n\n![image](img/f0139-01.jpg)\n\n图 8-26 到 8-28 示例中的所有信息都输出到了 Excel\
    \ 工作表中，但每个示例的打印页数不同。在图 8-26 中，数据按每个输出单元分割并打印了 16 页。\n\n图 8-27 – `ROWBREAKS_INTERVAL=`\
    \ 设置为每个过程更改分页\n\n![image](img/f0140-01.jpg)\n\n在图 8-27 中，数据按每个过程单元分割并打印了两个页。\n\
    \n图 8-28 – `ROWBREAKS_INTERVAL=` 设置为 None 以仅输出一页\n\n![image](img/f0141-01.jpg)\n\
    \n在图 8-28 中，数据没有分割并打印在一个页上。\n\n#### `ROWCOLHEADINGS=` 选项\n\n[/content]\n"
- fmt: "\nThis option controls whether or not the printed Excel output has the Excel\
    \ “ROW” and “COLUMN” values printed. The default is not to print these Excel headings.\
    \ The Excel “ROW” headings are the row numbers on the left side of the printed\
    \ spreadsheet, and the “COLUMN” headings are the letters at the top of the printed\
    \ spreadsheet. Selecting “ON” turns the printing on. The default option is “OFF”.\n\
    \n### SAS Code 8-14 – The ODS Excel Destination ROWCOLHEADINGS= Option Turned\
    \ On\n\n```sas\nods excel file = \"&path\\ROWCOLHEADINGS_on.xlsx\"\n    options(ROWCOLHEADINGS='on');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nFigure 8-29\
    \ – Excel Page Setup Sheet Showing the Check Box with the Row and Column Headings\
    \ Selected\n\n![image](images/f0142-01.jpg)\n\nThis image shows the “Row and column\
    \ headings” check box selected indicating that Excel “Row” and “Column” headers\
    \ should be printed.\n\nFigure 8-30 – Excel Print Page Showing the Excel “Row”\
    \ and “Column” Headers\n\n![image](images/f0143-01.jpg)\n\nThis page was output\
    \ as a portrait formatted page, but it is truncated to save space.\n\n### The\
    \ SCALE= Option\n\nOften I have found it hard to get a full set of variables on\
    \ one printed page, The ODS Excel `SCALE=` option helps me reduce the output to\
    \ allow more on a page. The example below in [SAS Code 8-15](#Chapter8.xhtml_ch8-pro15)\
    \ leaves the portrait printing alone, but it reduces the size of the printed material.\
    \ The default is to scale the output at 100%. To set another value, place a positive\
    \ number within quotation marks, as shown in [SAS Code 8-15](#Chapter8.xhtml_ch8-pro15).\
    \ I took some time to play with this option over the years and found some interesting\
    \ things. I am currently using Excel 2013, and the range for the Excel `SCALE=`\
    \ option is 10% to 400% normal size. If you enter a nonnumeric value into the\
    \ string in your SAS code, SAS passes 100 to Excel. SAS does not check the value\
    \ that you enter, only that it is numeric. I have noticed the following results\
    \ with Excel 2013\\. I do not expect differences but they might occur in other\
    \ versions of Excel.\n\n#### When Using Excel 2013, If You Enter:\n\n*   A nonnumeric\
    \ value – SAS does not generate an error and SAS passes 100 to Excel.\n*   A negative\
    \ number – SAS does not generate an error and Excel uses 100%.\n*   The number\
    \ zero – SAS does not generate an error and Excel uses 10%.\n*   Numbers from\
    \ 1 to 9 – SAS does not generate an error and Excel uses \"AUTO\" as the \"PAGE\
    \ LAYOUT\" SCALE value. On the \"Page Setup\" page an error message is shown when\
    \ you try to use the \"PAGE\" tab. The message says \"The number must be between\
    \ 10 and 400\\. Try again by entering a number in this range.\" Then you have\
    \ to cancel and reenter a number in the \"SCALE\" instead of \"AUTO.\"\n*   10\
    \ to 400 = ok\n*   A number between 401 and 32767 – SAS does not generate an error\
    \ message and Excel uses the number entered as the \"PAGE LAYOUT\" SCALE value\
    \ and the \"Page Setup\" scale value on the \"PAGE\" tab. No Excel error is generated\
    \ and you can proceed to the “Print Preview” page. However, when you exit the\
    \ “Print Preview” page the scale value reverts to 400 in both locations. Also,\
    \ any attempt to use the toggle arrows to increase or decrease the scale values\
    \ causes the value to revert to 400%.\n*   Numbers over 32767 ((2 ** 15) -1) cause\
    \ Excel to generate an error when accessing the “PAGE” tab on the “Page Setup”\
    \ sheet. This value is commonly referred to as 32K because when starting at zero\
    \ exactly 2 to the 15^(th) power numbers exist. In binary this would range from\
    \ ‘000000000000000’b to ‘111111111111111’b.\n\n### SAS Code 8-15 – The ODS Excel\
    \ SCALE Option Set to 50% of Normal Size\n\n```sas\nods excel file = \"&path\\\
    SCALE_50.xlsx\"\n    options(SCALE='50');\n    proc print data=Asia_only;\n  \
    \  run;\nods excel close;\n```\n\nFigure 8-31 – Result of the ODS Excel Destination\
    \ “SCALE=” Option When Set to ‘50’\n\n![image](images/f0145-01.jpg)\n\nYou can\
    \ view the “SCALE” value both on the Excel “Page Layout” tab and on the “Page\
    \ Setup” sheet shown here.\n\nFigure 8-32 – The Output When “SCALE=’50’” Is Selected\n\
    \n![image](images/f0146-01.jpg)\n\nThis is a full page of the printed output.\
    \ Yes, at this size it is nearly unreadable especially if you are reading this\
    \ on a small screen. But the decreased size of the fonts does enable you to place\
    \ more information on a sheet. This works better if you are printing in Landscape\
    \ mode and have more columns.\n\n### The TITLE_FOOTNOTE_NOBREAK= Option\n\nThe\
    \ ODS Excel destination `TITLE_FOOTNOTE_NOBREAK=` option is a tricky one. This\
    \ is one of those “Yes, we have no bananas today” type of options. Many people\
    \ would call this a double negative option. The “NOBREAK” part of the option says\
    \ do not break titles and footnotes in the output Excel workbook. The option “YES”\
    \ says do not break the titles and footnotes. The default of not using the option\
    \ and the “NO” value of the option negates the “NOBREAK” part of the option name\
    \ and means to wrap the titles and footnotes if they are long. Yes, I know that\
    \ was confusing. Hopefully the code and screen shots below will help. I will show\
    \ the output directly below the code segments that produce the output Excel workbooks.\n\
    \n### SAS Code 8-16 – ODS Excel TITLE_FOOTNOTE_NOBREAK= Option (Default Setting)\n\
    \n```sas\ntitle   \"This a my long title so I can show that it wraps around when\
    \ title_footnote_nobreak is not active.\";\nfootnote \"This a my very long footnote\
    \ (it prints in a smaller font) so I can show that it wraps around when title_footnote_nobreak\
    \ not active.\";\nods excel file = \"&path\\TITLE_FOOTNOTE_NOBREAK_default.xlsx\"\
    \n    options(embedded_titles='yes'\n            embedded_footnotes='yes');\n\
    proc print data=asia_only;\nrun;\nods excel close;\n```\n\nThe [SAS Code 8-16](#Chapter8.xhtml_ch8-pro16)\
    \ code is the default setting for the `TITLE_FOOTNOTE_NOBREAK=` option and causes\
    \ the titles and footnotes to wrap to the next line if the title or footnote is\
    \ too long.\n\nFigure 8-33 – The TITLE_FOOTNOTE_NOBREAK= Option (Default Setting)\n\
    \n![image](images/f0148-01.jpg)\n\nWithout using the ODS EXCEL `TITLE_FOOTNOTE_NOBREAK=`\
    \ option the titles and footnotes wrap to the next line if the title or footnote\
    \ is too long. Also, note that the Titles and footnotes are printed in different\
    \ font sizes and have different bold options.\n\nThe code in [SAS Code 8-17](#Chapter8.xhtml_ch8-pro17)\
    \ sets the `TITLE_FOOTNOTE_NOBREAK=` option to ‘NO’, which produces the same result\
    \ as the default option.\n\n### SAS Code 8-17 – ODS Excel TITLE_FOOTNOTE_NOBREAK=\
    \ Option Set to “NO”\n\n```sas\ntitle   \"This a my long title so I can show that\
    \ it wraps around when title_footnote_nobreak=''no''\";\nfootnote \"This a my\
    \ very long footnote (it prints in a smaller font) so I can show that it wraps\
    \ around when title_footnote_nobreak=''no''\";\nods excel file = \"&path\\TITLE_FOOTNOTE_NOBREAK_no.xlsx\"\
    \n    options(title_footnote_nobreak='no'\n            embedded_titles='yes'\n\
    \            embedded_footnotes='yes');\nproc print data=asia_only;\nrun;\nods\
    \ excel close;\n```\n"
  raw: 'This option controls whether or not the printed Excel output has the Excel
    “ROW” and “COLUMN” values printed. The default is not to print these Excel headings.
    The Excel “ROW” headings are the row numbers on the left side of the printed spreadsheet,
    and the “COLUMN” headings are the letters at the top of the printed spreadsheet.
    Selecting “ON” turns the printing on. The default option is “OFF”.


    SAS Code 8-14 – The ODS Excel Destination ROWCOLHEADINGS= Option Turned On


    ods excel file = "&path\ROWCOLHEADINGS_on.xlsx"


              options(ROWCOLHEADINGS=''on'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-29 – Excel Page Setup Sheet Showing the Check Box with the Row and Column
    Headings Selected


    ![image](images/f0142-01.jpg)


    This image shows the “Row and column headings” check box selected indicating that
    Excel “Row” and “Column” headers should be printed.


    Figure 8-30 – Excel Print Page Showing the Excel “Row” and “Column” Headers


    ![image](images/f0143-01.jpg)


    This page was output as a portrait formatted page, but it is truncated to save
    space.


    ### The SCALE= Option


    Often I have found it hard to get a full set of variables on one printed page,
    The ODS Excel SCALE= option helps me reduce the output to allow more on a page.
    The example below in [SAS Code 8-15](#Chapter8.xhtml_ch8-pro15) leaves the portrait
    printing alone, but it reduces the size of the printed material. The default is
    to scale the output at 100%. To set another value, place a positive number within
    quotation marks, as shown in [SAS Code 8-15](#Chapter8.xhtml_ch8-pro15). I took
    some time to play with this option over the years and found some interesting things.
    I am currently using Excel 2013, and the range for the Excel SCALE= option is
    10% to 400% normal size. If you enter a nonnumeric value into the string in your
    SAS code, SAS passes 100 to Excel. SAS does not check the value that you enter,
    only that it is numeric. I have noticed the following results with Excel 2013\.
    I do not expect differences but they might occur in other versions of Excel.


    ### When Using Excel 2013, If You Enter:


    ●   A nonnumeric value – SAS does not generate an error and SAS passes 100 to
    Excel.


    ●   A negative number – SAS does not generate an error and Excel uses 100%.


    ●   The number zero – SAS does not generate an error and Excel uses 10%.


    ●Numbers from 1 to 9 – SAS does not generate an error and Excel uses "AUTO" as
    the "PAGE LAYOUT" SCALE value. On the "Page Setup" page an error message is shown
    when you try to use the "PAGE" tab. The message says "The number must be between
    10 and 400\. Try again by entering a number in this range." Then you have to cancel
    and reenter a number in the "SCALE" instead of "AUTO."


    ●   10 to 400 = ok


    ●A number between 401 and 32767 – SAS does not generate an error message and Excel
    uses the number entered as the "PAGE LAYOUT" SCALE value and the "Page Setup"
    scale value on the "PAGE" tab. No Excel error is generated and you can proceed
    to the “Print Preview” page. However, when you exit the “Print Preview” page the
    scale value reverts to 400 in both locations. Also, any attempt to use the toggle
    arrows to increase or decrease the scale values causes the value to revert to
    400%.


    ●Numbers over 32767 ((2 ** 15) -1) cause Excel to generate an error when accessing
    the “PAGE” tab on the “Page Setup” sheet. This value is commonly referred to as
    32K because when starting at zero exactly 2 to the 15^(th) power numbers exist.
    In binary this would range from ‘000000000000000’b to ‘111111111111111’b.


    SAS Code 8-15 – The ODS Excel SCALE Option Set to 50% of Normal Size


    ods excel file = "&path\SCALE_50.xlsx"


              options(SCALE=''50'');


       **proc print** data=Asia_only;


       **run**;


    ods excel close;


    Figure 8-31 – Result of the ODS Excel Destination “SCALE=” Option When Set to
    ‘50’


    ![image](images/f0145-01.jpg)


    You can view the “SCALE” value both on the Excel “Page Layout” tab and on the
    “Page Setup” sheet shown here.


    Figure 8-32 – The Output When “SCALE=’50’” Is Selected


    ![image](images/f0146-01.jpg)


    This is a full page of the printed output. Yes, at this size it is nearly unreadable
    especially if you are reading this on a small screen. But the decreased size of
    the fonts does enable you to place more information on a sheet. This works better
    if you are printing in Landscape mode and have more columns.


    ### The TITLE_FOOTNOTE_NOBREAK= Option


    The ODS Excel destination TITLE_FOOTNOTE_NOBREAK= option is a tricky one. This
    is one of those “Yes, we have no bananas today” type of options. Many people would
    call this a double negative option. The “NOBREAK” part of the option says do not
    break titles and footnotes in the output Excel workbook. The option “YES” says
    do not break the titles and footnotes. The default of not using the option and
    the “NO” value of the option negates the “NOBREAK” part of the option name and
    means to wrap the titles and footnotes if they are long. Yes, I know that was
    confusing. Hopefully the code and screen shots below will help. I will show the
    output directly below the code segments that produce the output Excel workbooks.


    SAS Code 8-16 – ODS Excel TITLE_FOOTNOTE_NOBREAK= Option (Default Setting)


    title    "This a my long title so I can show that it wraps around when title_footnote_nobreak
    is not active.";


    footnote "This a my very long footnote (it prints in a smaller font) so I can
    show that it wraps around when title_footnote_nobreak not active.";


    ods excel file = "&path\TITLE_FOOTNOTE_NOBREAK_default.xlsx"


              options(embedded_titles=''yes''


                      embedded_footnotes=''yes'');


     proc print data=asia_only;


      run;


    ods excel close;


    The [SAS Code 8-16](#Chapter8.xhtml_ch8-pro16) code is the default setting for
    the TITLE_FOOTNOTE_NOBREAK= option and causes the titles and footnotes to wrap
    to the next line if the title or footnote is too long.


    Figure 8-33 – The TITLE_FOOTNOTE_NOBREAK= Option (Default Setting)


    ![image](images/f0148-01.jpg)


    Without using the ODS EXCEL TITLE_FOOTNOTE_NOBREAK= option the titles and footnotes
    wrap to the next line if the title or footnote is too long. Also, note that the
    Titles and footnotes are printed in different font sizes and have different bold
    options.


    The code in [SAS Code 8-17](#Chapter8.xhtml_ch8-pro17) sets the TITLE_FOOTNOTE_NOBREAK=
    option to ‘NO’, which produces the same result as the default option.


    SAS Code 8-17 – ODS Excel TITLE_FOOTNOTE_NOBREAK= Option Set to “NO”


    title    "This a my long title so I can show that it wraps around when title_footnote_nobreak=''''no''''";


    footnote "This a my very long footnote (it prints in a smaller font) so I can
    show that it wraps around when title_footnote_nobreak=''''no''''";


    ods excel file = "&path\TITLE_FOOTNOTE_NOBREAK_no.xlsx"


              options(title_footnote_nobreak=''no''


                      embedded_titles=''yes''


                      embedded_footnotes=''yes'');


     proc print data=asia_only;


      run;


    ods excel close;


    [SAS Code 8-17](#Chapter8.xhtml_ch8-pro17) code is set to NO for the TITLE_FOOTNOTE_NOBREAK=
    option and it causes the titles and footnotes to wrap to the next line if the
    title or footnote is too long.


    Figure 8-34 – The TITLE_FOOTNOTE_NOBREAK= Option Set to “NO”


    ![image](images/f0149-01.jpg)


    When using the ODS EXCEL TITLE_FOOTNOTE_NOBREAK= option set to NO, the titles
    and footnotes wrap to the next line if the title or footnote is too long. Also,
    note that the titles and footnotes are printed in different font sizes and have
    different bold options.


    The code in [SAS Code 8-18](#Chapter8.xhtml_ch8-pro18) sets the TITLE_FOOTNOTE_NOBREAK=
    option to ‘YES’, which prevents the titles and footnotes from wrapping.


    SAS Code 8-18 – ODS Excel TITLE_FOOTNOTE_NOBREAK= Option Set to YES


    title    "This a my long title so I can show that it does not wrap around when
    title_footnote_nobreak=''''yes''''";'
