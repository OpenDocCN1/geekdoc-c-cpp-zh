    ## About This Book


    ### What Does This Book Cover?


    I wrote this book to help SAS users of all skill levels learn to use the new SAS
    ODS EXCEL Destination software. My years of programming experience have helped
    me decode the mysteries of vendor-supplied system documentation. I wanted to convert
    that information into practical examples of how to apply the options to every
    day programming applications. Microsoft Excel is one of the most widely used software
    tools available to computer users. While many computer programmers are also Excel
    software users, there are far more Excel users than programmers that use Excel.
    Of course, this book is for SAS users who move data to Excel workbooks. The intent
    of this book is to enable SAS users to format the Excel Workbook output in a way
    that eliminates manual changes after the workbook is created.


    This book explains how to use all of the options in the ODS EXCEL destination
    available in SAS 9.4 (TS1M3). I have broken up the options and suboptions into
    groups that I feel work on similar parts of the Excel output workbooks. My grouping
    is different from any other grouping that is provided by SAS Institute or anyone
    else.


    This book uses only the Microsoft Windows operating system version of Base SAS
    to execute the examples. However, since the ODS Excel destination is a supported
    part of Base SAS, the code and examples will work on other operating systems (IBM
    Mainframes, UNIX, Linux, and perhaps others.) In addition, with the proper library
    assignments this will work on other SAS Products, like SAS Enterprise Guide, SAS
    Studio, and SAS University Edition.


    ### Is This Book for You?


    Whatever your skill level, I hope you will find examples that will teach you something.
    In every class I teach or paper I present, I always ask whether anyone learned
    anything. I want you to be able to find a place on your desk for this book, use
    it as you progress through the skills presented, and gain expertise to easily
    move your data.


    ### What Are the Prerequisites for This Book?


    This book is designed for you to use without the need for prerequisites. If you
    can open the SAS program and copy data using your mouse, then you can get started.
    I do not attempt to teach you how to write SAS programs or build an Excel spreadsheet,
    but I present methods to move data between the two data storage tools.


    ### What Should You Know about the Examples?


    This book includes software examples for you to follow to gain hands-on experience
    with SAS.


    ### Software Used to Develop the Book''s Content


    SAS 9.4 (TS1M3) was used was used to create all the examples in this book. I used
    Microsoft Excel 2013 while writing this book. I also know that the files generated
    are compatible with Microsoft Excel 2016. I expect them to be compatible with
    Microsoft Excel 2007 and Excel 2010\. The output files are always in the new Excel
    file format (*.xlsx).


    ### Example Code and Data


    The example code shown in this book was executed using the Base SAS Display Manager
    on a Microsoft Windows 10 Operating System. I expect it to execute in any other
    Base SAS environment. Most of the examples use a subset of the SASHELP.SHOES data
    set that I called ASIA_ONLY, because the name implies that it includes only the
    data from the region “ASIA” of the SASHELP.SHOES data set. Some examples use the
    whole SASHELP.SHOES data set, and a few others are identified when they are used.


    You can access the example code and data for this book by linking to its author
    page at [https://support.sas.com/authors](https://support.sas.com/authors). Each
    chapter has a segment of code that is not shown in the book (except for [Chapter
    2](#Chapter2.xhtml)), which creates a path and sets some other values. The code
    name has a general format of “SAS Code 3.0 Create ASIA_ONLY file in [Chapter 03](#Chapter3.xhtml)
    Path.sas,” You will need to modify these modules to execute the code.


    ### SAS University Edition


    If you are using SAS University Edition to access data and run your programs,
    then please check the SAS University Edition page to ensure that the software
    contains the product or products that you need to run the code. The link is [www.sas.com/universityedition](http://www.sas.com/universityedition).'
