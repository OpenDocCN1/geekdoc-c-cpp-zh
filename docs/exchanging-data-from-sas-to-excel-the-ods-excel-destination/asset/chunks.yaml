    \ in the row and column headers. The `ID=` option identified this file as `HARVEST`,\
    \ during the opening and closing of the Excel Workbook. Any options assigned during\
    \ this `ODS FILE` statement and sent to the output file at the close are unique\
    \ to this Excel Workbook.\n\nFigure 5-3 – ODS Excel Output Using Harvest Style\
    \ and the `ID=` Option\n\n![image](images/f0036-01.jpg)\n\nThe next image, [Figure\
    \ 5-4](#Chapter5.xhtml_ch5-fig4), is the result of the `ODS PDF` statement. This\
    \ output was generated with the SAS supported style called `Sapphire`. Once again,\
    \ the `ODS PDF` statement defined the output options. In the `ID=` option where\
    \ the `ID` was set to “SAPPHIRE”, the output is a PDF file.\n\nFigure 5-4 – ODS\
    \ PDF Output Using the Sapphire Style and the `ID=` Option\n\n![image](images/f0037-01.jpg)\n\
    \n### The `BLANK_SHEET=` Option\n\nThis option produces an empty worksheet in\
