    \n### `FILE=` 选项\n\n`FILE=` 定义了要创建的 Excel 工作表的输出文件位置。这可以是你所使用的系统的任何有效文件规范。`ODS`\
    \ 目标仅创建格式为 `*.xlsx` 的 Excel 工作簿。\n\nSAS 代码 5-1 – 使用 `FILE=` 选项定义输出的 Excel 工作簿\n\
    \n```sas\nods excel file=\"&path.\\Excel_output_workbook.xlsx\" ;\nproc print\
    \ data=asia_only;\nrun;\nods excel close;\n```\n\n图 5-1 – 由 ODS Excel 目的 `FILE=`\
    \ 选项定义的简单 Excel 文件。\n\n![image](img/f0033-01.jpg)\n\n### `ID=` 选项\n\n`ID=` 选项允许你从同一段\
    \ SAS 代码创建多个 `ODS` 输出实例。不同的 `ID` 值允许你对分离输出应用不同的选项和子选项。如果你需要同一份数据的多个副本，`ID=` 选项将非常有用。如果你需要一个可行的\
    \ Excel 电子表格、一个可打印的 Excel 工作簿或用于外部交付的 PDF，可以使用 `ID=` 选项在一个进程中生成这些副本。这种能力让你能够拥有一份用于标记和验证的可运行副本、一份用于发送的生产副本以及一份用于文档说明的\
    \ PDF 副本，而无需重新运行作业。我的示例在这里生成了三个文件：两个 Excel 工作簿和一个 PDF 文件。我将分别讨论这些文件。在 SAS 代码 5-2\
    \ 示例中，我没有在第一个 `ODS EXCEL` 语句中使用 `ID=` 选项，以说明它并不是第一个实例所需的，仅适用于后续的 `ODS` 文件定义。\n\
    \nSAS 代码 5-2 – 使用 `ODS ID=` 选项产生多个输出\n\n```sas\nods excel file=\"&path.\\ID_no_Style.xlsx\"\
    \ ;\nods excel (id=harvest) style=harvest\n         file=\"&path.\\ID_harvest_Style.xlsx\"\
    \ ;\nods pdf (id=Sapphire) style=Sapphire\n         file='ID_Sapphire_Style.pdf';\n\
    proc print data=asia_only;\nrun;\nods excel close;\nods excel (id=harvest) close;\n\
    ods pdf (id=Sapphire) close;\n```\n\n图 5-2 是输出 Excel 工作簿。此工作簿对输出工作簿没有更新，它只显示默认值，这是\
    \ SAS 通常创建的内容。\n\n图 5-2 – 使用无样式或 `ID=` 选项（默认值）的 ODS Excel 输出\n\n![image](img/f0035-01.jpg)\n\
    \n下一图 图 5-3 是使用 SAS 维护的名为 `HARVEST` 的 `STYLE` 创建的。注意行和列标题中不同的颜色。`ID=` 选项在 Excel\
    \ 工作簿的打开和关闭期间将此文件识别为 `HARVEST`。在此 `ODS FILE` 语句期间分配的并在关闭时发送到输出文件的任何选项对于该 Excel\
    \ 工作簿都是唯一的。\n\n图 5-3 – 使用 Harvest 样式和 `ID=` 选项的 ODS Excel 输出\n\n![image](img/f0036-01.jpg)\n\
    \n下一图 图 5-4 是 `ODS PDF` 语句的结果。此输出是使用 SAS 支持的名为 `Sapphire` 的样式生成的。再次，`ODS PDF`\
    \ 语句定义了输出选项。在 `ID` 设置为“SAPPHIRE”的 `ID=` 选项中，输出是一个 PDF 文件。\n\n图 5-4 – 使用 Sapphire\
    \ 样式和 `ID=` 选项的 ODS PDF 输出\n\n![image](img/f0037-01.jpg)\n\n### `BLANK_SHEET=`\
    \ 选项\n\n此选项在 Excel 工作簿中产生一个空白工作表。但为什么你会想要一个空白工作表呢？我将它们作为 Excel 工作簿内部的临时草稿纸。我经常从我的\
    \ SAS 代码中调用 `VBS`（Visual Basic Scripts）或 `VBA`（Visual Basic for Applications）程序（更多信息请参见\
    \ *Exchanging Data Between SAS(R) and Microsoft Excel* [Cary, NC: SAS Institute,\
    \ 2015]，第 12-14 章）。这些空白工作表可以被这些窗口或 Excel 程序使用，然后在关闭工作簿之前删除。你可能能想到在 Excel 工作簿中创建空白工作表的其他用途。`ODS`\
    \ 命令可以插入到你 SAS 代码的不同位置，且不需要是唯一使用的选项。SAS 代码 5-3 显示了如何使用此选项在产生带数据的输出表后插入一个空白工作表。\n\
    \nSAS 代码 5-3 – 使用 `BLANK_SHEET=` 选项向输出工作簿中插入命名工作表\n\n```sas\nods excel file=\"\
    &path.\\Empty_Workbook.xlsx\";\nproc print data=asia_only;\nrun;\nods excel(BLANK_SHEET='Empty');\n\
    ```\n\n图 5-5 – 空白工作表的 Excel 输出\n\n![image](img/f0038-01.jpg)\n\n### `CONTENTS=`\
    \ 选项\n\n`CONTENTS=` 选项将为每个工作表构建目录，并提供跳转到工作表的超链接。这让 SAS 能够创建它通常创建的内容。在 图 5-6 中，我的光标悬停在\
    \ `A3` 上，Excel 选项并没有生效。当然，你的计算机会显示不同的路径。在这里我使用 `SASHELP` 数据显示多个页。`CONTENTS=` 和\
    \ `INDEX=` 选项是类似的。\n\nSAS 代码 5-4 – 使用 `CONTENTS=` 选项产生数据的超链接\n\n```sas\nods excel\
    \ file=\"&path.\\Table_Of_Contents.xlsx\"\n         (CONTENTS='ON');\nproc print\
    \ data=sashelp;\nby region;\nrun;\nods close;\n```\n\n图 5-6 – 目录\n\n![image](img/f0039-01.jpg)\n\
    \n### `INDEX=` 选项\n\n`INDEX=` 选项将为每个工作表构建目录，并提供跳转到工作表的超链接。这让 SAS 能够创建它通常创建的内容。在\
    \ 图 5-7 中，我的光标悬停在 `A1` 上，Excel 选项并没有生效。当然，你的计算机会显示不同的路径。在这里我使用 `SASHELP` 数据显示多个页。`CONTENTS=`\
    \ 和 `INDEX=` 选项是类似的。\n\n```sas\nods excel file=\"&path.\\INDEX_Of_Workbook.xlsx\"\
