  trans: "\n“页面居中——垂直”（Center on page – Vertically）复选框已标记。\n\n图 8-7 – 使用 `CENTER_HORIZONTAL=‘ON’`\
    \ 选项居中的输出\n\n![image](img/f0118-01.jpg)\n\n数据在页边距顶部和底部之间居中。请注意，此处关闭了水平居中，因此页面是左对齐的。\n\
    \n### `DRAFTQUALITY=` 选项\n\n我在家里做很多工作，自己购买纸张和墨盒。我使用一台很好的打印机，但它并不是非常快速的打印机。我在打印时会尽可能使用草稿模式以节省墨水。此设置允许我为打印预设草稿模式，这样当我实际打印图像时，就不会忘记开启它。默认设置为“OFF”，此处未显示。由于我无法在书中展示这种差异，因此我向你们展示了该设置。\n\
    \nSAS 代码 8-4 – 将 `DRAFTQUALITY=` 选项设置为‘ON’\n\n```sas\nods excel file = \"&path\\\
    DRAFTQUALITY_printing_on.xlsx\"\n    options(DRAFTQUALITY='ON');\n    proc print\
    \ data=Asia_only;\n    run;\nods excel close;\n```\n\n图 8-8 – Excel 页面设置屏幕显示 `DRAFTQUALITY=`\
    \ 选项设置为‘ON’\n\n![image](img/f0119-01.jpg)\n\n在“打印”（Print）主题下，“草稿质量”（Draft quality）复选框被选中。\n\
    \n### `ORIENTATION=` 选项\n\nODS Excel `ORIENTATION=` 选项允许你更改打印输出在页面上的显示方式。默认是‘PORTRAIT’竖向，此处未显示，因为大部分其他图像也是竖向模式。选项有'PORTRAIT'（竖向）或'LANDSCAPE'（横向），Excel\
    \ 设置在 Excel 工作表的“页面设置”（Page Setup）工作表中显示。\n\nSAS 代码 8-5 – 将打印页面方向设置为 LANDSCAPE\n\
    \n```sas\nods excel file = \"&path\\ORIENTATION_LANDSCAPE_printing_on.xlsx\"\n\
    \    options(ORIENTATION='LANDSCAPE' );\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\n图 8-9 – Excel “页面设置”工作表中显示方向设置为‘LANDSCAPE’\n\n![image](img/f0120-01.jpg)\n\
    \n页面设置‘LANDSCAPE’设置。\n\n图 8-10 – 在‘LANDSCAPE’模式下打印的数据\n\n![image](img/f0121-01.jpg)\n\
    \n‘LANDSCAPE’模式下的完整打印页，显示数据在打印页面上的实际位置。\n\n### `PAGE_ORDER_ACROSS=` 选项\n\n当你的\
    \ Excel 输出没有打印在一个页纸上时（无论是因为太宽还是太长），Excel 会自动选择分段打印数据。Excel 使用的默认方法是在适合一页的第一组列列中打印所有数据行。这意味着第\
    \ 1 页将包含适合页面的前 `n` 列的数据，而第 2 页将包含同一组 `n` 列的后续行数据。\n\n例如，假设你的数据输出有 20 列 100 行。如果一页可以容纳\
    \ 10 列和 50 行，那么意味着第 1 到 10 列和第 1 到 50 行在第 1 页，而第 1 到 10 列和第 51 到 100 行在第 2 页。第\
    \ 3 页将包含第 11 到 20 列和第 1 到 50 行。第四页也是最后一页将包含第 11 到 20 列和第 51 到 100 行。这被称为“向下后向右”的页面顺序。如果你希望第\
    \ 1 页有第 1 到 10 列，第 2 页有第 11 到 20 列，则应使用“向右后向下”的页面顺序。包含更多数据的表格将继续你为打印输出所选择的模式。当然，由你决定最易阅读的打印顺序，然后将其应用于你的输出。\n\
    \nSAS 代码 8-6 – `PAGE_ORDER_ACROSS=` 设置为 OFF 和 ON 的页面顺序打印选择\n\n```sas\nods excel\
    \ (ID=1) file = \"&path\\PAGE_ORDER_ACROSS_printing_off.xlsx\"\n    options(PAGE_ORDER_ACROSS='Off'\
    \ );\n\nods excel (ID=2) file = \"&path\\PAGE_ORDER_ACROSS_printing_on.xlsx\"\n\
    \    options(PAGE_ORDER_ACROSS='ON' );\n\n    proc print data=Asia_only;\n   \
    \ run;\n\nods excel (ID=1) close;\nods excel (ID=2) close;\n```\n\n图 8-11 – Excel\
    \ 页面顺序默认设置，`PAGE_ORDER_ACROSS=‘OFF’`\n\n![image](img/f0122-01.jpg)\n\n页面顺序图中的箭头向下，然后到下一列。这被称为“向下，后向右”。\n\
    \n图 8-12 – Excel 页面顺序设置，`PAGE_ORDER_ACROSS=‘ON’`\n\n![image](img/f0123-01.jpg)\n\
    \n页面顺序图中的箭头先向右，然后向下。\n\n### `PRINT_AREA=` 选项\n\n如果你只想打印特定的单元格区域，可以在 ODS Excel\
    \ 中使用 `PRINT_AREA` 选项进行设置。由于 `PRINT_AREA` 总是形成矩形，你需要识别左上角和右角的单元格。这在书中没有显示，但我向你们展示了该设置。\n\
    \nSAS 代码 8-7 – 将 `PRINT_AREA=` 设置为 ON\n\n```sas\nods excel file = \"&path\\PRINT_AREA.xlsx\"\
    \n    options(PRINT_AREA='B4:F9');\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\n图 8-13 – Excel 页面设置显示 `PRINT_AREA=` 选项\n\n![image](img/f0124-01.jpg)\n\
    \n显示 B4 到 F9。\n\n图 8-14 – 在 `PRINT_AREA` 模式下打印的数据\n\n![image](img/f0125-01.jpg)\n\
    \n显示指定区域的完整打印页。\n\n### `PRINT_FOOTER=` 选项\n\n公司通常希望每页底部都有相关信息。可以通过增大页脚来实现。`PRINT_FOOTER=`\
    \ 选项将文本放在页面底部。\n\nSAS 代码 8-8 – 在页面底部放置页脚\n\n```sas\nods excel file = \"&path\\\
    PRINT_FOOTER.xlsx\"\n    options(PRINT_FOOTER='My Footer Text');\n    proc print\
    \ data=Asia_only;\n    run;\nods excel close;\n```\n\n图 8-15 – Excel 页面设置显示 `PRINT_FOOTER=`\
    \ 选项\n\n![image](img/f0126-01.jpg)\n\n页脚文本位于底部。\n\n图 8-16 – 显示页脚的打印页\n\n![image](img/f0127-01.jpg)\n\
    \n这是完整的页面。\n\n### `PRINT_FOOTER_MARGIN=` 选项\n\n公司使用预印纸张输出时，页面底部可能有一个他们想要保留的图像而不覆盖它。可以通过增大页脚来实现。在这里，我将打印页脚并使用三英寸的页脚边距来展示此功能。\n\
    \nSAS 代码 8-9 – `PRINT_FOOTER_MARGIN=` 选项\n\n```sas\nods excel file = \"&path\\\
    PRINT_FOOTER_MARGIN.xlsx\"\n    options(PRINT_FOOTER='My Footer Text', PRINT_FOOTER_MARGIN='3');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\n图 8-17 – Excel\
    \ 页面设置页脚设置为 3 英寸\n\n![image](img/f0128-01.jpg)\n\n图 8-18 – 应用 `PRINT_FOOTER_MARGIN=`\
    \ 选项\n\n![image](img/f0129-01.jpg)\n"
- fmt: "\nOften companies want to have special company related or document-related\
    \ information at the top of every printed page. The `PRINT_HEADER=` option places\
    \ the text string into the Excel worksheet area that places headers at the top\
    \ of each page. This header is often set manually, but SAS can insert the text\
    \ at run time. A SAS title will override this option and will be used instead.\
    \ To eliminate titles generated by SAS, like “The SAS System,” use the `TITLE`\
    \ statement.\n\n#### SAS Code 8-10 – The `PRINT_HEADER=` Option\n\n```sas\nods\
    \ excel file = \"&path\\PRINT_HEADER.xlsx\"\n   options(PRINT_HEADER='My Header\
    \ Text');\n   title;\n   proc print data=Asia_only;\n   run;\nods excel close;\n\
    ```\n\nFigure 8-19 – The `PRINT_HEADER=` Page Setup Sheet\n\n![image](images/f0130-01.jpg)\n\
    \nTo get the text “My Header Text” at the top of the page in [Figure 8-20](#Chapter8.xhtml_ch8-fig20)\
    \ the SAS titles had to be turned off using the `TITLE` statement.\n\nFigure 8-20\
    \ – The Printout Showing the Requested Text “My Header Text”\n\n![image](images/f0131-01.jpg)\n\
    \nThe full printed page showing the positioning of the output header text.\n\n\
    #### The `PRINT_HEADER_MARGIN=` Option\n\nThe Excel “Header” setting on the Page\
    \ Setup sheet seems to act independently from the “Top” margin setting on the\
    \ Page Setup sheet. I need to spend a little more time here to explain how it\
    \ works. My example [SAS Code 8-11](#Chapter8.xhtml_ch8-pro11) shows several options,\
    \ not just the `PRINT_HEADER_MARGIN=` option. What this example does is output\
    \ three Excel workbooks. I will show one Page Setup sheet and describe how the\
    \ three different settings for the `PRINT_HEADER_MARGIN=` setting affect the output\
    \ printout. In this example, I will also show the margin and heading tabs on the\
    \ preview sheet to help explain the examples. The default header setting is 0.0\
    \ (zero) inches, which is also the common default for the top margin setting.\
    \ I also reduced the amount of `PRINT_AREA=` printed output and added a `PRINT_HEADER=`\
    \ text string. In this way I can show that both are output, but the header is\
    \ hidden by the information from the printed output Excel data cells.\n\n####\
    \ SAS Code 8-11 – Examples of Using the `PRINT_HEADER_MARGIN` Settings\n\n```sas\n\
    ods excel (id=1) file = \"&path\\PRINT_HEADER_Margin_0_5.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text'\n           PRINT_HEADER_MARGIN='0.5'\n           PRINT_AREA='b,4,f,9');\n\
    ods excel (id=2) file = \"&path\\PRINT_HEADER_Margin_1.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text'\n           PRINT_HEADER_MARGIN='1'\n           PRINT_AREA='b,4,f,9');\n\
    ods excel (id=3) file = \"&path\\PRINT_HEADER_Margin_4.xlsx\"\n   options(PRINT_HEADER='My\
    \ Header Text'\n           PRINT_HEADER_MARGIN='4'\n           PRINT_AREA='b,4,f,9');\n\
    \   title ;\n   proc print data=Asia_only;\n   run;odsods excel (id=1) close;\n\
    ods excel (id=2) close;\nods excel (id=3) close;\n```\n\nFigure 8-21 – Excel Page\
    \ Setup Sheet Showing the Header Set to 0.5 Inches\n\n![image](images/f0133-01.jpg)\n\
    \nThis screen shot shows the output of the first step in the [SAS Code 8-11](#Chapter8.xhtml_ch8-pro11)\
    \ example where the `PRINT_HEADER_MARGIN=` value is set to 0.5 inches. The other\
    \ output files (`ID=2` and `ID=3`), which are not shown here, set the value in\
    \ the header box to 1 and 4 inches respectively. The print preview pages are shown\
    \ in Figures 8-22, 8-23, and 8-24.\n\nFigure 8-22 – `PRINT_HEADER_MARGIN=0.5`\
    \ and Excel Top Margin=0.5\n\n![image](images/f0134-01.jpg)\n\nPrinted output\
    \ with the default top margin of 0.5 inches and the `PRINT_HEADER_MARGIN=` of\
    \ 0.5 inches. This shows that both the default top margin and `ODS PRINT_HEADER_MARGIN=`\
    \ are aligned.\n\nFigure 8-23 – `PRINT_HEADER_MARGIN=1.0` and Excel Top margin=0.5\n\
    \n![image](images/f0135-01.jpg)\n\nPrinted output with the default top margin\
    \ of 0.5 inches and the `PRINT_HEADER_MARGIN=` of 1.0 inches. This shows that\
    \ the default top margin and `ODS PRINT_HEADER_MARGIN=` are applied separately.\n\
    \nFigure 8-24 – `PRINT_HEADER_MARGIN=4.0` and Excel Top Margin=0.5\n\n![image](images/f0136-01.jpg)\n\
    \nPrinted output with the default top margin of 0.5 inches and the `PRINT_HEADER_MARGIN=`\
    \ of 4.0 inches. This shows that the default top margin and `ODS PRINT_HEADER_MARGIN=`\
    \ are applied separately, and that `PRINT_HEADER_MARGIN=` is also independent\
    \ of the printed data.\n\n#### The `ROWBREAKS_COUNT=` Option\n\nThe `ROWBREAKS_COUNT=`\
    \ option allows you as a programmer to break the output pages into groups that\
    \ you want. In [SAS Code 8-12](#Chapter8.xhtml_ch8-pro12), I have used the value\
    \ of ‘10’. The results of this option are not easy to see without printing the\
    \ output pages. However, if you call up the print preview and then go back to\
    \ the standard sheet new dotted lines are displayed. These dotted lines represent\
    \ the page breaks that are used when the page is printed.\n\n#### SAS Code 8-12\
    \ – `ROWBREAKS_COUNT=` Set to a Value of 10\n\n```sas\nods excel file = \"&path\\\
    ROWBREAKS_COUNT.xlsx\"\n   options(ROWBREAKS_COUNT='10');\n   proc print data=Asia_only;\n\
    \   run;\nods excel close;\n```\n\nFigure 8-25 – Applying `ROWBREAKS_COUNT=10`\n\
    \n![image](images/f0137-01.jpg)\n\nThe vertical dotted line and the line below\
    \ “Obs 10” represent the page breaks that will occur. Also notice that `ROWBREAKS_COUNT=`\
    \ splits the data after data lines, and the first row of headers is not counted\
    \ as one of the 10 lines. You have to use other options to reproduce the row headers\
    \ on the second and following pages.\n\n#### The `ROWBREAKS_INTERVAL=` Option\n\
    \nThe `ROWBREAKS_INTERVAL=` option works best when `SHEET_INTERVAL='NONE'` is\
    \ selected. When you choose not to place all information onto one sheet, then\
    \ the breaks most likely will cause a new Excel worksheet to be generated as opposed\
    \ to a new printed page. The example shown in [SAS Code 8-13](#Chapter8.xhtml_ch8-pro13)\
    \ writes three workbooks with the same data set printed twice by the `PRODUCT`\
    \ values. The final Excel output workbook also has the scale setting set to 50%\
    \ to fit everything onto one page. Figures 8-26 to 8-28 show only the full first\
    \ page of the Excel Print screen. Shown at the bottom of [Figure 8-26](#Chapter8.xhtml_ch8-fig26)\
    \ is the page counter. I do not show it here, but all of the data for each of\
    \ these examples is on one Excel worksheet.\n\n#### SAS Code 8-13 – The `ROWBREAKS_INTERVAL=`\
    \ Options Shown for All Options\n\n```sas\nods excel (id=1) file = \"&path\\ROWBREAKS_INTERVAL_out.xlsx\"\
    \n   options(ROWBREAKS_INTERVAL='output'\n           sheet_interval=\"none\");\n\
    ods excel (id=2) file = \"&path\\ROWBREAKS_INTERVAL_proc.xlsx\"\n   options(ROWBREAKS_INTERVAL='proc'\n\
    \           sheet_interval=\"none\");\nods excel (id=3) file = \"&path\\ROWBREAKS_INTERVAL_none.xlsx\"\
    \n   options(ROWBREAKS_INTERVAL='none'\n           sheet_interval=\"none\"\n \
    \          scale='50');\nproc sort data=Asia_only out=temp;\n   by product;\n\
    \   run;\n   proc print data=temp;\n   by product;\n   run;\n   proc print data=temp;\n\
    \   by product;\n   run;\nods excel (id=1) close;\nods excel (id=2) close;\nods\
    \ excel (id=3) close;\n```\n\nFigure 8-26 – `ROWBREAKS_INTERVAL=` Set to Page\
    \ for Each Output Change\n\n![image](images/f0139-01.jpg)\n\nAll the information\
    \ for the examples in Figures 8-26 to 8-28 were output to one Excel worksheet,\
    \ but the data is printed on a different number of pages for each example. In\
    \ [Figure 8-26](#Chapter8.xhtml_ch8-fig26) the data is split by each output unit\
    \ and is printed on 16 pages.\n\nFigure 8-27 – `ROWBREAKS_INTERVAL=` Set to Page\
    \ for Each Procedure Change\n\n![image](images/f0140-01.jpg)\n\nIn [Figure 8-27](#Chapter8.xhtml_ch8-fig27)\
    \ the data is split by each procedure unit and is printed on two pages.\n\nFigure\
    \ 8-28 – `ROWBREAKS_INTERVAL=` Set to None So Only One Page Is Output\n\n![image](images/f0141-01.jpg)\n\
    \nIn [Figure 8-28](#Chapter8.xhtml_ch8-fig28) the data is not split and is printed\
    \ on one page.\n\n#### The `ROWCOLHEADINGS=` Option\n"
  raw: 'Often companies want to have special company related or document-related information
    at the top of every printed page. The PRINT_HEADER= option places the text string
    into the Excel worksheet area that places headers at the top of each page. This
    header is often set manually, but SAS can insert the text at run time. A SAS title
    will override this option and will be used instead. To eliminate titles generated
    by SAS, like “The SAS System,” use the TITLE statement.


    SAS Code 8-10 – The PRINT_HEADER= Option


    ods excel file = "&path\PRINT_HEADER.xlsx"


              options(PRINT_HEADER=''My Header Text'');


       title;


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-19 – The PRINT_HEADER= Page Setup Sheet


    ![image](images/f0130-01.jpg)


    To get the text “My Header Text” at the top of the page in [Figure 8-20](#Chapter8.xhtml_ch8-fig20)
    the SAS titles had to be turned off using the TITLE statement.


    Figure 8-20 – The Printout Showing the Requested Text “My Header Text”


    ![image](images/f0131-01.jpg)


    The full printed page showing the positioning of the output header text.


    ### The PRINT_HEADER_MARGIN= Option


    The Excel “Header” setting on the Page Setup sheet seems to act independently
    from the “Top” margin setting on the Page Setup sheet. I need to spend a little
    more time here to explain how it works. My example [SAS Code 8-11](#Chapter8.xhtml_ch8-pro11)
    shows several options, not just the PRINT_HEADER_MARGIN= option. What this example
    does is output three Excel workbooks. I will show one Page Setup sheet and describe
    how the three different settings for the PRINT_HEADER_MARGIN= setting affect the
    output printout. In this example, I will also show the margin and heading tabs
    on the preview sheet to help explain the examples. The default header setting
    is 0.0 (zero) inches, which is also the common default for the top margin setting.
    I also reduced the amount of PRINT_AREA= printed output and added a PRINT_HEADER=
    text string. In this way I can show that both are output, but the header is hidden
    by the information from the printed output Excel data cells.


    SAS Code 8-11 – Examples of Using the PRINT_HEADER_MARGIN Settings


    ods excel (id=1) file = "&path\PRINT_HEADER_Margin_0_5.xlsx"


              options(PRINT_HEADER=''My Header Text''


                      PRINT_HEADER_MARGIN=''0.5''


                      PRINT_AREA=''b,4,f,9'');


    ods excel (id=2) file = "&path\PRINT_HEADER_Margin_1.xlsx"


              options(PRINT_HEADER=''My Header Text''


                      PRINT_HEADER_MARGIN=''1''


                      PRINT_AREA=''b,4,f,9'');


    ods excel (id=3) file = "&path\PRINT_HEADER_Margin_4.xlsx"


              options(PRINT_HEADER=''My Header Text''


                      PRINT_HEADER_MARGIN=''4''


                      PRINT_AREA=''b,4,f,9'');


       title ;


       proc print data=Asia_only;


       run;


    ods excel (id=1) close;


    ods excel (id=2) close;


    ods excel (id=3) close;


    Figure 8-21 – Excel Page Setup Sheet Showing the Header Set to 0.5 Inches


    ![image](images/f0133-01.jpg)


    This screen shot shows the output of the first step in the [SAS Code 8-11](#Chapter8.xhtml_ch8-pro11)
    example where the PRINT_HEADER_MARGIN= value is set to 0.5 inches. The other output
    files (ID=2 and ID=3), which are not shown here, set the value in the header box
    to 1 and 4 inches respectively. The print preview pages are shown in Figures 8-22,
    8-23, and 8-24.


    Figure 8-22 – PRINT_HEADER_MARGIN=0.5 and Excel Top Margin=0.5


    ![image](images/f0134-01.jpg)


    Printed output with the default top margin of 0.5 inches and the PRINT_HEADER_MARGIN=
    of 0.5 inches. This shows that both the default Excel top margin and the ODS PRINT_HEADER_MARGIN=
    are aligned.


    Figure 8-23 – PRINT_HEADER_MARGIN=1.0 and Excel Top margin=0.5


    ![image](images/f0135-01.jpg)


    Printed output with the default top margin of 0.5 inches and the PRINT_HEADER_MARGIN=
    of 1.0 inches. This shows that the default Excel top margin and the ODS PRINT_HEADER_MARGIN
    are applied separately.


    Figure 8-24 – PRINT_HEADER_MARGIN=4.0 and Excel Top Margin=0.5


    ![image](images/f0136-01.jpg)


    Printed output with the default top margin of 0.5 inches and the PRINT_HEADER_MARGIN=
    of 4.0 inches. This shows that the default Excel top margin and the ODS PRINT_HEADER_MARGIN=
    are applied separately, and that the PRINT_HEADER_MARGIN= is also independent
    of the printed data.


    ### The ROWBREAKS_COUNT= Option


    The ROWBREAKS_COUNT= option allows you as a programmer to break the output pages
    into groups the size that you want. In [SAS Code 8-12](#Chapter8.xhtml_ch8-pro12),
    I have used the value of ‘10’. The results of this option are not always easy
    to see without printing the output pages. However, if you call up the print preview
    and then go back to the standard sheet display new dotted lines are displayed.
    These dotted lines represent the page breaks that are used when the page is printed.


    SAS Code 8-12 – ROWBREAKS_COUNT= Set to a Value of 10


    ods excel file = "&path\ROWBREAKS_COUNT.xlsx"


              options(ROWBREAKS_COUNT=''10'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-25 –Applying the ROWBREAKS_COUNT=10 Option.


    ![image](images/f0137-01.jpg)


    The vertical dotted line and the line below “Obs 10” represent the page breaks
    that will occur. Also notice that the ROWBREAKS_COUNT= splits the data after data
    lines, and the first row of headers is not counted as one of the 10 lines. You
    have to use other options to reproduce the row headers on the second and following
    pages.


    ### The ROWBREAKS_INTERVAL= Option


    The ROWBREAKS_INTERVAL= option works best when SHEET_INTERVAL=’NONE’ is selected.
    When you choose not to place all information onto one sheet, then the breaks most
    likely will cause a new Excel worksheet to be generated as opposed to a new printed
    page. The example shown in [SAS Code 8-13](#Chapter8.xhtml_ch8-pro13) writes three
    workbooks with the same sorted data set printed twice by the ‘PRODUCT’ values.
    The final Excel output workbook also has the scale setting set to 50% to fit everything
    onto one page. Figures 8-26 to 8-28 show only the full first page of the Excel
    Print Preview screen. Shown at the bottom of [Figure 8-26](#Chapter8.xhtml_ch8-fig26)
    is the page counter. I do not show it here, but all of the data for each of these
    examples is on one Excel worksheet.


    SAS Code 8-13 – The ROWBREAKS_INTERVAL= Options Shown for All Options


    ods excel (id=1)file = "&path\ROWBREAKS_INTERVAL_out.xlsx"


              options(ROWBREAKS_INTERVAL=''output''


                        sheet_interval="none");


    ods excel (id=2)file = "&path\ROWBREAKS_INTERVAL_proc.xlsx"


              options(ROWBREAKS_INTERVAL=''proc''


                        sheet_interval="none");


    ods excel (id=3)file = "&path\ROWBREAKS_INTERVAL_none.xlsx"


              options(ROWBREAKS_INTERVAL=''none''


                        sheet_interval="none"


                        scale=''50'');


     proc sort data=Asia_only out=temp;


      by product;


      run;


      proc print data=temp;


     by product;


      run;


      proc print data=temp;


     by product;


      run;


    ods excel (id=1) close;


    ods excel (id=2) close;


    ods excel (id=3) close;


    Figure 8-26 – ROWBREAKS_INTERVAL= Set to Page for Each Output Change


    ![image](images/f0139-01.jpg)


    All the information for the examples in Figures 8-26 to 8-28 were output to one
    Excel worksheet, but the data is printed on a different number of pages for each
    example. In [Figure 8-26](#Chapter8.xhtml_ch8-fig26) the data is split by each
    output unit and is printed on 16 pages.


    Figure 8-27 – ROWBREAKS_INTERVAL= Set to Page for Each Procedure Change


    ![image](images/f0140-01.jpg)


    In [Figure 8-27](#Chapter8.xhtml_ch8-fig27) the data is split by each procedure
    unit and is printed on two pages.


    Figure 8-28 – ROWBREAKS_INTERVAL= Set to None So Only One Page Is Output


    ![image](images/f0141-01.jpg)


    In [Figure 8-28](#Chapter8.xhtml_ch8-fig28) the data is not split and is printed
    on one page.


    ### The ROWCOLHEADINGS= Option'
