  trans: "\n[content]\n\n# 属性选择器\n属性选择器根据指定的属性选择 DOM 元素。ID 选择器和类选择器是特殊的属性选择器。属性选择器使用以下语法选择属性：`[*attribute\
    \ operator \"value\"]`\n\n| 算符 | 说明 |\n| :--- | :--- |\n| | 运算符指定了操作符。操作符允许部分匹配。\
    \ |\n| `=` | 匹配整个属性值。 |\n| `^=` | 匹配属性值的开头。 |\n| `=$ | 匹配属性值的结尾。 |\n| `*=` | 匹配属性值中的任何子字符串。\
    \ |\n| `~=` | 匹配属性值中任何由空格分隔的单词。此运算符可以模拟类选择器。 |\n| `|=` | 匹配属性值以及带有连字符后缀的可选值。此运算符用于匹配语言代码，例如\
    \ `enUS`、`en-GB` 等。 |\n\n# 组合器\n组合器是根据元素在另一个元素中的部分上下文来选择元素的字符。这是通过使用以下字符之一组合选择器来实现。\n\
    \n| 字符 | 说明 |\n| :--- | :--- |\n| `\" \"` (空格) | 表示左侧的选择器必须匹配当前选中元素父级中任何位置的元素。\
    \ |\n| `>` | 选择指定元素的直接后代。 |\n| `~` | 选择在父级中任何位置具有另一个兄弟元素的元素。 |\n| `+` | 选择紧接指定元素之前的元素\
    \ |\n\n* 这是一个特殊情况，其用法与 `PRETEXT`、`PREIMAGE`、`POSTTEXT` 和 `POSTIMAGE` 样式属性相同。\n\
    \n图 6-1 – 使用 DOM 选项识别 CSS 元素的 Excel 输出\n\n![image](img/f0051-01.jpg)\n\n图 6-1\
    \ 是示例 SAS 代码 6-1 输出的图像。它看起来非常简单。这里没有任何惊喜。SAS 代码 6-1 中的代码没有对工作簿应用任何样式更改。它只是限制了处理的行数，以便使\
    \ DOM 跟踪输出足够小，从而允许识别供以后使用的几个 CSS 元素。\n\n## ODS ANCHOR= 选项\n锚点标签是 ODS 输出的重要组成部分。你可以指定\
    \ `ANCHOR` 或允许 ODS 使用默认名称生成它们。语法是提供关键字 `ANCHOR` 和 `anchor-name`，如下：`ANCHOR='anchor-name'`。默认锚点名称为\
    \ `id=\"idx\"`。一旦指定了第一个锚点，该名称将被使用，并在下一个锚点的末尾添加一个数字。SAS 代码 6-2 中的代码创建了一个带有两个引用的用户自定义级联样式表，分别为\
    \ `#Expense .header` 和 `#Expense .data`。这些引用中的每一个都会修改 Excel 输出工作表的某些部分的颜色。当你使用\
    \ `ANCHOR` 时，你正在更改当前正在使用的样式表输出的 `ID=` 属性，这在 SAS 样式表和级联样式表 (`#ID=`) 中均是有效的。要识别这些锚点出现在输出样式中的位置，请使用\
    \ DOM 选项。上面描述了如何使用 ODS EXCEL DOM 选项的示例，请参阅 SAS 代码 6-1。\n\n在本节中，我将提供一个简单的示例。关于这个主题有许多文档、论文和书籍，你可以在其中找到更多示例。维护\
    \ CSS 标准的世界维网联盟（W3C）官方网站是 [`www.w3.org/Style/CSS/`](https://www.w3.org/Style/CSS/)。\n\
    \n关于此类数据操作的另一个良好来源是位于以下 URL 的 SAS Global Forum 论文：[`support.sas.com/resources/papers/proceedings15/SAS1880-2015.pdf`](http://support.sas.com/resources/papers/proceedings15/SAS1880-2015.pdf)\n\
    \nSAS 代码 6-2 – 使用样式表修改 Excel 输出。\n\n```sas\n***** 构建一个级联样式表文件;\n\nfilename my_css\
    \ \"css_text.css\";\n\ndata _null_;\n   file my_css noprint nottitles linesize=256;\n\
    \   put\n      '#Expense .header {background-color:orange}' /\n      '#Expense\
    \ .data   {background-color:pink  }' ;\nrun;\n\nOds html close;\n\n***** 使用一个级联样式表文件;\n\
    \nods excel cssstyle = \"css_text.css\"\n          options(sheet_interval='none');\n\
    \n***** 使用 ANCHOR;\n\nods excel anchor=\"expense\";\n\nproc print data=sashelp.shoes(where=\n\
    \      (Product     = 'Boot'     and\n      Subsidiary = 'New York' and\n    \
    \  region      = 'United States'));\nrun;\n\nods excel close;\nods html;\n```\n\
    \n在 SAS 代码 6-2 中创建的 CSS 文件将背景色修改为橙色和粉色。ODS EXCEL `cssstyle=` 选项将在后描述。图 6-2 – 使用\
    \ ANCHOR= 选项的 Excel 输出\n\n![image](img/f0053-01.jpg)\n注意列 `A` 是 `DATA` 元素，而不是\
    \ `HEADER`。\n\n## _SIZING= 选项\n`_SIZING=` 选项很难看到，我在这里显示代码。`_SIZING=` 选项在文档中不可见，但\
    \ `SIZE` 属性是可见的。网站提供了更多细节：[`www.w3.org/TR/2002/css-pos-model-3/`](http://www.w3.org/TR/2002/css-pos-model-3/)\
    \ 或 [www.w3.org/TR/2002/css-box-model-3/](http://www.w3.org/TR/2002/css-box-model-3/)。网页说\
    \ `CONTENT=` 选项从单元导出宽度，而 `BORDER=` 选项将导出边框宽度。\n\nSAS 代码 6-3 – _SIZING= 选项\n```sas\n\
    ods excel file = \"\\path\\box_sizing.xlsx\"\n          _sizing=border_box;\n\n\
    proc print data=Asia_only;\nrun;\n\nods excel close;\n```\n\n## 使用 CSSSTYLE= 选项使用级联样式表\n\
    SAS 和级联样式表的使用非常广泛，甚至我针对这个主题写过一篇论文。我展示了如何使用 ODS 目标创建并将简单的 CSS 文件引入 Excel。为了省你去查那篇论文的麻烦，我将包含其中的信息。\n\
    \n## 使用 CSS 文件进行颜色更改\n本节将提供一个示例，如何使用几行 SAS 代码生成的 CSS 文件对输出 Excel 工作表的 `body`、`header`、`rowheader`\
    \ 和 `data` 部分进行颜色更改。\n\nSAS 代码 6-4 – 创建级联样式表文件和简单的 SAS 工作文件\n```sas\n* 定义 CSS\
