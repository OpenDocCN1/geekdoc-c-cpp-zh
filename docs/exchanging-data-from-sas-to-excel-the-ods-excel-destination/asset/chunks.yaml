    ### 引言


    自从从 1973 年开始编写代码让计算机按照我想要的方式运行，而不是按照它们想要的方式运行以来，我一直担任应用程序程序员工作。这意味着我是在使用某人的软件来构建一个工具以完成某些任务。当我升级软件时，我已经编写的工具仍然需要运行，因为并不是每台计算机都是同时升级的，而且新功能需要对所有人可用。


    虽然 Base SAS 和 SAS 软件的其他功能使 SAS 成为重要且实用的软件套件，但许多人并不是程序员或分析师，他们不编写计算机程序。这些人已经学习了使用并理解
    Microsoft Excel 如何让他们受益。他们通常是经理、总监和副总裁，他们希望以舒适的格式使用数据。自从 Microsoft Excel 2007
    和 Open XML 格式发布以来，对 Excel 以及整个计算机硬件的升级导致了 SAS 处理 Microsoft Excel 工作簿和工作表的方式发生了许多更新和变化。


    第一批适应体现在学习读写新的 Excel 格式。这些变化升级了 `PROC EXPORT`、`PROC IMPORT`、`SAS LIBNAME` 语句以及新的
    `SAS PC Files Server`。`SAS PC Files Server` 的引入桥接了应用程序软件、操作系统和计算机硬件之间的 32 位到 64
    位障碍。`SAS ODS EXCELXP` 标签集的发布发生在 Excel 2007 引入之前。`EXCELXP` 标签集以可扩展标记语言 (XML) 格式写入输出文本文件。Excel
    2003 和 2007 都能读取这些文件。新的 Excel 2007（及更高版本）工作簿以开放 XML 格式存储。在 `EXCELXP` 标签集发布到 2014
    年 12 月之间，在多个版本中发生了超过 100 次修改。


    2014 年 12 月底，我发现一个新的 SAS ODS 功能——`ODS EXCEL` 目标。在经过近八年的研究和准备后，我的第一本书距离定稿出版仅剩几天。我意识到拥有创建示例所需的软件，并努力争取在我的第一书中加入一些内容。这本书取代了第一书中介绍
    EXCEL 目标的一页半内容。


    ### 什么是 SAS ODS EXCEL 目标？


    SAS 输出交付系统（ODS）具有两个处理输出 Microsoft Excel 可读数据的两个功能。通用分类为标签集（tagsets）和目标（destinations）。每一者都有许多功能。标签集通过
    `PROC TEMPLATE` 代码创建，任何 SAS 程序员都可以修改，而 ODS 目标是用户无法修改的固定执行模块。虽然 `ODS EXCEL` 目标是
    Base SAS 的新部分，但 `EXCELXP` 标签集的许多功能在新的 `ODS EXCEL` 目标可用。更多信息请参见第 2 章“ODS 标签集与目标”。


    ### 为什么我喜欢向后兼容


    向后兼容是几乎每个软件生产商面临的挑战。无论你是在开发软件套件、操作系统还是为你的老板编写报告，这都不重要。你需要产生的软件、数据或报告唯一能保证的事情就是它们会发生变化。SAS
    是维护向后兼容方面做得良好的软件生产商之一。有时我会重写遗留功能以接受与以前相同的输入，但我也接受新选项并输出新信息。这使得旧代码能够无缝运行，同时为现有程序提供新功能。在其他情况下，SAS
    文档会更新，说明某个选项为了向后兼容而保留，但软件并未使用它。


    我喜欢向后兼容性，是因为它允许我在我编写的工具的当前功能内部编写新代码。这保持了现有功能的完好，并让我编写新功能。因此，这让我可以在不丢失功能的情况下拥有一个升级后的程序。


    #### 为什么我无法在本书中使用向后兼容


    从二进制格式的 `*.xls` 文件结构到开放 XML 文件格式的更改是随 Microsoft Office 2007 引入的大文件格式变化。新的输出 `*.xlsx`
    文件格式（包含 XML 代码的“压缩”文件）也改变了所有新 Excel 工作簿文件的访问方法。任何需要读取或写入 Excel 工作表的 SAS 用户都需要考虑
    Excel 工作簿格式的变化。


