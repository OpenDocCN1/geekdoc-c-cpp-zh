    \ Shown in the [SAS Log 5-1](#Chapter5.xhtml_ch5-pro1) text box below.\n\nSAS\
    \ Code 5-6 – Using `MSG_LEVEL=` Option\n\n```sas\nods excel file=\"&path.\\MSG_LEVEL_No_in_Workbook.xlsx\"\
    \n         options(MSG_LEVEL='NO'\n                 MSG_LEVEL='YES'\n        \
    \         MSG_LEVEL='any string'\n                 ASCII_DOTS='YES'\n        \
    \         CURRENCY_SYMBOL='$');\nproc print data=asia_only;\nvar sales;\nrun;\n\
    ods close;\n```\n\nSAS Log 5-1 – Log Output from MSG_LEVEL Suboption Testing\n"
