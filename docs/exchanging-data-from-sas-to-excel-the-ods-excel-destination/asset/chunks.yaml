    \ So I attempted to determine what type of responses I would get using this option.\
    \ [SAS Code 5-6](#Chapter5.xhtml_ch5-pro6) shows four ways that I tried to run\
    \ the code with the `MSG_LEVEL=` suboption. Well I set the value to `NO`, `YES`,\
