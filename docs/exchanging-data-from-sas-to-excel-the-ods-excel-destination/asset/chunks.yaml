    ODS EXCEL CLOSE;\n```\n\nFigure 4-1 – Excel Document Property Sheet with Default\
    \ Properties\n\n![image](images/f0025-01.jpg)\n\nNote that the `Author` and `Last\
    \ Modified` fields use field values that are assigned when the account login was\
    \ created, and the `Title` value is the default SAS title text.\n\n### Modify\
    \ Excel Property Sheets with the ODS EXCEL Destination\n\nThe next example adds\
