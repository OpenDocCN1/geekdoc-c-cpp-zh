    \ 过大时可能会耗尽内存，如果内存不足，可能需要将 SAS 的 `MEMSIZE=` 系统选项增加到 2GB 以上的值。\n\nSAS 代码 6-13 –\
    \ 使用默认 IMAGE_DPI 设置创建 Excel 图表\n\n```sas\nods excel file = \"&path.\\Test_file_5.xlsx\"\
