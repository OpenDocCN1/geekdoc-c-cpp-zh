    \ – Excel Document Property Sheet with the SASDATE Option\n\n![image](images/f0028-01.jpg)\n\
    \n### Conclusion\n\nA number of `ODS EXCEL` options enable you to modify the Excel\
    \ document property sheet. You can populate the values directly from your SAS\
