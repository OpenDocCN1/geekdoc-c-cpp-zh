    SAS debuted the Output Delivery System (ODS) with Version 7 of Base SAS. SAS Versions
    8 and 9 expanded upon and introduced methods that would allow data transfers between
    SAS and Microsoft Excel. The transfer methods called destinations (like `CSV`
    or `HTML`) or tagsets (like `CSV`, `HTML`, `MSOFFICE2K`, or `EXCELXP`) allowed
    SAS code to create files that Microsoft Excel could read. After the release of
    Microsoft Office 2007, SAS wrote many versions of several ODS tools to address
    the changes to the Microsoft Office products. The ODS tagsets related to files
    Microsoft Excel could read were all created as text files that Excel could read,
    but did not directly write to the new Excel file open XML format.


    A tagset is a module of SAS template code that `PROC TEMPLATE` compiles and stores
    in the `SASHELP` library with each installed version of SAS. Every user with access
    to the `SASHELP` library can use these tagsets. A SAS user can apply changes to
    a tagset (or create one of their own) and compile this to a user library. This
    is usually accessible to only one computer, but the user tagsets are sharable.


    The new SAS ODS EXCEL destination (not a tagset) is unique in that it creates
    a file in the Open XML Format, regardless of the filename requested. Providing
    an output filename with an extension of `*.xls` does not create a binary formatted
    Excel file that Excel 2003 can read. However, when using the `*.xls` extension
    as an output Excel workbook name Excel will send an error message and might (depending
    on the Excel version) enable you to open the created file if you continue.


    There is no history for this feature to be backward compatible with. However,
    some features of the ODS EXCEL destination are similar to features of the SAS
    ODS tagset `EXCELXP`. While I did not provide details for every feature of the
    `EXCELXP` tagset in my previous book, I did list most of the features that are
    available. Most of the features that were added with `EXCELXP` are available with
    the ODS Excel destination.


    ## Why the ODS Excel Destination Is an Output-Only Feature of SAS


    By definition, the SAS ODS (Output Delivery System) features are “OUTPUT” only.
    Once the file is defined with the `ODS FILE` statement, created with SAS code,
    and closed with the `ODS <destination> CLOSE` statement it is available for use
    by other programs or SAS features. If the SAS/ACCESS for PC Files software is
    installed, then you can use the `LIBNAME` statement to open a new Excel Workbook.


    ## Layout of This Book


    The intent of this book is to describe in detail the options of the ODS EXCEL
    destination. I will be grouping the arguments and options into what I consider
    common usage elements. I have been an applications programmer for over 40 years
    and am using my experience to establish what I consider logical units. You should
    be able to use the index to look up the options alphabetically. I hope my grouping
    is satisfactory for other needs. While the `EXCELXP` tagset and the ODS EXCEL
    Destination are separate and unique features of SAS, many of the options of each
    tool provide similar output to an output Excel workbook. The following chapters
    will describe the arguments and options while providing as many examples as space
    permits. The goal is to show something for everything. The lists below show my
    general grouping categories. I will describe each of these arguments and options
    later.


    ### ODS Destination EXCEL Arguments


    * File identification

    * Excel file properties

    * Output features


    ### ODS Destination EXCEL Option Groups


    * Workbook

    * Worksheet

    * Print

    * Column

    * Row

    * Cell level


    ## General Chapter Layout


    Chapters 3 and beyond will each introduce and explain some features of the ODS
    EXCEL destination by providing a description of the feature followed by the SAS
    code and Excel output. To conserve space each example might contain one or more
    features. As noted before, the groupings of the features are my own and might
    not be the same as anyone else might describe them.


