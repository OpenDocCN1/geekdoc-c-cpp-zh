  trans: "\n本章将讨论影响整个工作簿级别输出的 ODS Excel 目标子选项。其中某些子选项会影响 Excel 工作簿中输出数据的颜色、大小、位置、间距和可见性。页眉、标题、页脚、脚注、间距和打印顺序的调整，通常是工作簿创建者在完成构建工作簿的\
    \ SAS 程序后必须完成的工作。ODS Excel 目标的这些功能允许在创建 Excel 工作簿的同时完成这些任务。通过在安装这些功能的情况下创建工作簿，你可以交付一个无需再次修改的工作簿。\n\
    \n# ODS Excel 目标操作\n\n在本章中，我们将讨论以下 SAS ODS EXCEL 目标相关主题。\n\n表 8-1 – ODS Excel\
    \ 目标操作\n\n| 操作参数 | 选项 | 描述 |\n| --- | --- | --- |\n| BLACKANDWHITE | ‘OFF’, ‘ON’,‘YES’,\
    \ ‘NO’Default=‘OFF’ | 正向响应将打印模式更改为仅黑白打印，负向响应允许彩色打印。 |\n| CENTER_HORIZONTAL | ‘OFF’,\
    \ ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | 正向响应将工作表在打印页上水平居中，负向响应不在打印输出时不进行水平居中。 |\n| CENTER_VERTICAL\
    \ | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | 正向响应将工作表在打印页上垂直居中，负向响应不在打印输出时不进行垂直居中。\
    \ |\n| DRAFTQUALITY | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | 此选项的正向响应将导致输出以“草稿”质量模式打印。然而，当此选项生效时，不会打印图表。\
    \ |\n| ORIENTATION | ‘PORTRAIT’, ‘LANDSCAPE’,Default= ‘PORTRAIT’ | 此选项将打印输出在打印页面对齐为纵向（PORTRAIT）或横向（LANDSCAPE）。\
    \ |\n| PAGE_ORDER_ACROSS | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | 此选项控制电子表格中信息的打印顺序。正向响应导致数据先跨页打印，然后向下打印。负向响应导致打印先在页面上向下，再跨页打印。\
    \ |\n| PRINT_AREA | ‘ITEM’, Default= NONE | 此选项允许您定义输出打印区域，该区域是电子表格值（单元格）的子集‘ITEM’是一个带引号的值字符串，代表要打印的电子表格的左上单元格和右下单元格。例如‘b,4,f,10’。\
    \ |\n| PRINT_FOOTER | ‘text-string’ | 打印时除非活动脚注，否则此文本字符串将放在页脚中。这不会覆盖 FOOTNOTE\
    \ 语句。 |\n| PRINT_FOOTER_MARGIN | ‘number’,Default=0.5 inches | 此选项指定页脚边距，并在 Excel\
    \ 页面设置窗口中设置。指定的单位为英寸。 |\n| PRINT_HEADER | ‘text-string’ | 打印时除非活动标题，否则此文本字符串将放在页眉中。这不会覆盖\
    \ TITLE 语句。 |\n| PRINT_HEADER_MARGIN | ‘number’, Default= 0.5 inches | 此选项指定页眉边距，并在\
    \ Excel 页面设置窗口中设置。指定的单位为英寸。 |\n| ROWBREAKS_COUNT | ‘number’ | 此选项指定在打印了指定数量的数据行后插入分页符。\
    \ |\n| ROWBREAKS_INTERVAL | ‘OUTPUT’, ‘PROC’, ‘NONE’Default=‘NONE’ | 此选项控制分页符的放置。●‘OUTPUT’在每个输出对象之间放置分页符。●‘PROC’在每个过程输出之间放置分页符。●‘NONE’不插入自定义分页符。\
    \ |\n| ROWCOLHEADINGS | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | 正向响应表示应该打印行和列标题。负向响应表示不应该打印行和列标题。\
    \ |\n| SCALE | ‘number’, Default= 100 | 此选项控制输出打印的缩放比例。 |\n| TITLE_FOOTNOTE_NOBREAK\
    \ | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘NO’ | 此选项控制标题和脚注是否跨行换行。正向响应抑制换行，负向响应允许换行。想一下“是的，我们今天没有香蕉了。”\
    \ |\n| TITLE_FOOTNOTE_WIDTH | ‘number’,Default=‘0’ | 此选项指定标题和脚注跨越的列数。如果值为‘0’（零），则标题和脚注将跨越电子表格使用的所有列。\
    \ |\n\n## BLACKANDWHITE=选项\n\n此 ODS Excel 选项允许您强制打印输出仅为“黑白”格式。如果您的打印机不打印彩色图像，这非常有用。有时在黑白打印机上打印时，色调会褪色为相同的颜色。希望这有助于平滑它们。我在这里没有显示默认值，它是‘OFF’。\n\
    \nSAS 代码 8-1 – BLACKANDWHITE= 选项开启‘ON’\n\n```sas\nods excel file = \"&path\\Black_and_white_printing.xlsx\"\
    \n    options(BLACKANDWHITE='ON');\n    proc print data=Asia_only;\n    run;\n\
    ```\n\n图 8-1 – BLACKANDWHITE= 选项开启‘ON’\n![image](img/f0112-01.jpg)\n\n## CENTER_HORIZONTAL=\
    \ 选项\n\n此 ODS Excel 选项允许您强制打印输出仅为“黑白”格式。如果您的打印机不打印彩色图像，这非常有用。有时在黑白打印机上打印时，色调会褪色为相同的颜色。希望这有助于平滑它们。我在这里没有显示默认值，它是‘OFF’。\n\
    \nSAS 代码 8-1 – BLACKANDWHITE= 选项开启‘ON’\n\n```sas\nods excel file = \"&path\\Black_and_white_printing.xlsx\"\
    \n    options(BLACKANDWHITE='ON');\n    proc print data=Asia_only;\n    run;\n\
    ```\n\n图 8-1 – BLACKANDWHITE= 选项开启‘ON’\n![image](img/f0112-01.jpg)\n\n## CENTER_VERTICAL\
    \ 选项\n\n此 ODS Excel 选项允许您强制打印输出仅为“黑白”格式。如果您的打印机不打印彩色图像，这非常有用。有时在黑白打印机上打印时，色调会褪色为相同的颜色。希望这有助于平滑它们。我在这里没有显示默认值，它是‘OFF’。\n\
    \nSAS 代码 8-1 – BLACKANDWHITE= 选项开启‘ON’\n\n```sas\nods excel file = \"&path\\Black_and_white_printing.xlsx\"\
    \n    options(BLACKANDWHITE='ON');\n    proc print data=Asia_only;\n    run;\n\
    ```\n"
- fmt: "\nThe ‘Center on page – Vertically’ check box is marked.\n\nFigure 8-7 – Centered\
    \ Output from the `CENTER_HORIZONTAL=‘ON’` Option\n\n![image](images/f0118-01.jpg)\n\
    \nThe data is centered on the page between the top and bottom edges of the page\
    \ margins. Take note that the horizontal centering was turned off here, so the\
    \ page is left-justified.\n\n### The `DRAFTQUALITY=` Option\n\nI do a lot of work\
    \ from home, and buy my own paper and ink. I use a good printer, but it is not\
    \ really a fast printer. I use the draft mode when I print as often as I can to\
    \ save ink. This setting allows me to preset the draft mode for printing so that\
    \ I do not forget to turn it on when I actually print an image. The default setting\
    \ is ‘OFF” and is not shown here. Since I cannot show a distinction here in the\
    \ book, I am showing the setting.\n\nSAS Code 8-4 – Setting the `DRAFTQUALITY=`\
    \ Option to ‘ON’\n\n```sas\nods excel file = \"&path\\DRAFTQUALITY_printing_on.xlsx\"\
    \n    options(DRAFTQUALITY='ON');\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\nFigure 8-8 – Excel Page Setup Screen Showing the `DRAFTQUALITY=`\
    \ Option Set to ‘ON’\n\n![image](images/f0119-01.jpg)\n\nUnder the ‘Print’ topic\
    \ the ‘Draft quality’ check box is selected.\n\n### The `ORIENTATION=` Option\n\
    \nThe ODS Excel `ORIENTATION=` option enables you to change how the printout appears\
    \ on the page. The default is ‘PORTRAIT’ and is not shown here because most of\
    \ the other images are also in the portrait mode. The options are 'PORTRAIT' or\
    \ 'LANDSCAPE' and the Excel setting is shown on the ‘Page Setup’ sheet of the\
    \ Excel worksheet.\n\nSAS Code 8-5 – Setting the Printed Page Orientation to LANDSCAPE\n\
    \n```sas\nods excel file = \"&path\\ORIENTATION_LANDSCAPE_printing_on.xlsx\"\n\
    \    options(ORIENTATION='LANDSCAPE' );\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\nFigure 8-9 – The Excel ‘Page Setup’ Sheet Showing the\
    \ Orientation set to ‘LANDSCAPE’\n\n![image](images/f0120-01.jpg)\n\nPage Setup\
    \ ‘LANDSCAPE’ setting.\n\nFigure 8-10 – Data Printed in ‘LANDSCAPE’ Mode\n\n![image](images/f0121-01.jpg)\n\
    \nFull printed page in ‘LANDSCAPE’ mode to show actual location of the data on\
    \ the printed page.\n\n### The `PAGE_ORDER_ACROSS=` Option\n\nWhen your output\
    \ from Excel does not print on one page, either because it is too wide or too\
    \ long, Excel automatically chooses to print the data in sections. The default\
    \ method that Excel uses is to print all data rows in the first group of columns\
    \ that fit onto a page. That means that page 1 will have the data from the first\
    \ `n` columns that fit on the page, and page 2 will have the data from same set\
    \ of `n` columns for the following rows.\n\nFor example, suppose your data output\
    \ has 20 columns and 100 rows. If 10 columns fit on a page and 50 rows fit on\
    \ a page this would mean that columns 1 to 10 and rows 1 to 50 would be on page\
    \ 1, and columns 1 to 10 and rows 51 to 100 would be on page 2. Page 3 would contain\
    \ columns 11 to 20 and rows 1 to 50. The fourth and last page would contain columns\
    \ 11 to 20 and rows 51 to 100. This is called page order “down, then over”. If\
    \ instead you want page 1 to have columns 1 to 10 and page 2 to have columns 11\
    \ to 20 you would use the page order “over, then down”. Spreadsheets with more\
    \ data would continue the pattern that you select for the printed output. It is\
    \ of course your choice to determine the print order that you can read best, and\
    \ then apply it to your output.\n\nSAS Code 8-6 – Page Order Print Selection with\
    \ `PAGE_ORDER_ACROSS=` Set to OFF and ON\n\n```sas\nods excel (ID=1) file = \"\
    &path\\PAGE_ORDER_ACROSS_printing_off.xlsx\"\n    options(PAGE_ORDER_ACROSS='Off'\
    \ );\n\nods excel (ID=2) file = \"&path\\PAGE_ORDER_ACROSS_printing_on.xlsx\"\n\
    \    options(PAGE_ORDER_ACROSS='ON' );\n\n    proc print data=Asia_only;\n   \
    \ run;\n\nods excel (ID=1) close;\nods excel (ID=2) close;\n```\n\nFigure 8-11\
    \ – Default Settings for Excel Page order, `PAGE_ORDER_ACROSS=‘OFF’`\n\n![image](images/f0122-01.jpg)\n\
    \nThe arrow in the page order diagram goes down then to the next column. This\
    \ is called “Down, then over.”\n\nFigure 8-12 – Settings for Excel Page order,\
    \ `PAGE_ORDER_ACROSS=‘ON’`\n\n![image](images/f0123-01.jpg)\n\nThe arrow in the\
    \ page order diagram goes over then to down.\n\n### The `PRINT_AREA=` Option\n\
    \nIf you want to print only a specific range of cells, this can be set up in ODS\
    \ Excel using the `PRINT_AREA` option. Because the `PRINT_AREA` always forms a\
    \ rectangle, you need to identify the top-left and bottom-right cells. This is\
    \ not shown in the book, but I am showing the setting.\n\nSAS Code 8-7 – Setting\
    \ the `PRINT_AREA=` Option to ON\n\n```sas\nods excel file = \"&path\\PRINT_AREA.xlsx\"\
    \n    options(PRINT_AREA='B4:F9');\n    proc print data=Asia_only;\n    run;\n\
    ods excel close;\n```\n\nFigure 8-13 – Excel Page Setup Showing the `PRINT_AREA=`\
    \ Option\n\n![image](images/f0124-01.jpg)\n\nThis shows only cells B4 through\
    \ F9.\n\nFigure 8-14 – Data Printed in `PRINT_AREA` Mode\n\n![image](images/f0125-01.jpg)\n\
    \nFull printed page showing only the specified area is printed.\n\n### The `PRINT_FOOTER=`\
    \ Option\n\nOften companies want to have special company-related information at\
    \ the bottom of every page. This can be accomplished by having a larger footer.\
    \ The `PRINT_FOOTER=` option places the text at the bottom of the page.\n\nSAS\
    \ Code 8-8 – Putting a Footer at the Bottom of Each Page\n\n```sas\nods excel\
    \ file = \"&path\\PRINT_FOOTER.xlsx\"\n    options(PRINT_FOOTER='My Footer Text');\n\
    \    proc print data=Asia_only;\n    run;\nods excel close;\n```\n\nFigure 8-15\
    \ – Excel Page Setup Showing the `PRINT_FOOTER=` Option\n\n![image](images/f0126-01.jpg)\n\
    \nThe footer text is placed at the bottom.\n\nFigure 8-16 – Printed Page with\
    \ Footer Displayed\n\n![image](images/f0127-01.jpg)\n\nThis is the full page.\n\
    \n### The `PRINT_FOOTER_MARGIN=` Option\n\nWhen companies use preprinted paper\
    \ for output, they might have an image at the bottom of the page that they want\
    \ to preserve, without writing over it. This can be accomplished by having a larger\
    \ footer. Here, I will print a footer and use a three-inch footer margin to show\
    \ this feature.\n\nSAS Code 8-9 – The `PRINT_FOOTER_MARGIN=` Option\n\n```sas\n\
    ods excel file = \"&path\\PRINT_FOOTER_MARGIN.xlsx\"\n    options(PRINT_FOOTER='My\
    \ Footer Text', PRINT_FOOTER_MARGIN='3');\n    proc print data=Asia_only;\n  \
    \  run;\nods excel close;\n```\n\nFigure 8-17 – Excel Page Setup Showing the Footer\
    \ Set to 3 Inches\n\n![image](images/f0128-01.jpg)\n\nFigure 8-18 – Applying the\
    \ `PRINT_FOOTER_MARGIN=` Option\n\n![image](images/f0129-01.jpg)\n"
  raw: 'The ‘Center on page – Vertically’ check box is marked.


    Figure 8-7 – Centered Output from the CENTER_HORIZONTAL=‘ON’ Option


    ![image](images/f0118-01.jpg)


    The data is centered on the page between the top and bottom edges of the page
    margins. Take note that the horizontal centering was turned off here, so the page
    is left-justified.


    ### The DRAFTQUALITY= Option


    I do a lot of work from home, and buy my own paper and ink. I use a good printer,
    but it is not really a fast printer. I use the draft mode when I print as often
    as I can to save ink. This setting allows me to preset the draft mode for printing
    so that I do not forget to turn it on when I actually do print an image. The default
    setting is ‘OFF” and is not shown here. Since I cannot show a distinction here
    in the book, I am showing the setting.


    SAS Code 8-4 – Setting the DRAFTQUALITY= Option to ‘ON’


    ods excel file = "&path\DRAFTQUALITY_printing_on.xlsx"


              options(DRAFTQUALITY=''ON'');


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-8 – Excel Page Setup Screen Showing the DRAFTQUALITY= Option Set to ‘ON’


    ![image](images/f0119-01.jpg)


    Under the ‘Print’ topic the ‘Draft quality’ check box is selected.


    ### The ORIENTATION= Option


    The ODS Excel ORIENTATION= option enables you to change how the printout appears
    on the page. The default is ‘PORTRAIT’ and is not shown here because most of the
    other images are also in the portrait mode. The options are ''PORTRAIT'' or ''LANDSCAPE''
    and the Excel setting is shown on the ‘Page Setup’ sheet of the Excel worksheet.


    SAS Code 8-5 – Setting the Printed Page Orientation to LANDSCAPE


    ods excel file = "&path\ORIENTATION_LANDSCAPE_printing_on.xlsx"


              options(ORIENTATION=''LANDSCAPE'' );


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-9 – The Excel ‘Page Setup’ Sheet Showing the Orientation set to ‘LANDSCAPE’


    ![image](images/f0120-01.jpg)


    Page Setup ‘LANDSCAPE’ setting.


    Figure 8-10 – Data Printed in ‘LANDSCAPE’ Mode


    ![image](images/f0121-01.jpg)


    Full printed page in ‘LANDSCAPE’ mode to show actual location of the data on the
    printed page.


    ### The PAGE_ORDER_ACROSS= Option


    When your output from Excel does not print on one page, either because it is too
    wide or too long, Excel automatically chooses to print the data in sections. The
    default method that Excel uses is to print all data rows in the first group of
    columns that fit onto a page. That means that page 1 will have the data from the
    first *n* columns that fit on the page, and page 2 will have the data from same
    set of *n* columns for the following rows.


    For example, suppose your data output has 20 columns and 100 rows. If 10 columns
    fit on a page and 50 rows fit on a page this would mean that columns 1 to 10 and
    rows 1 to 50 would be on page 1, and columns 1 to 10 and rows 51 to 100 would
    be on page 2\. Page 3 would contain columns 11 to 20 and rows 1 to 50\. The fourth
    and last page would contain columns 11 to 20 and rows 51 to 100\. This is called
    page order “down, then over”. If instead you want page 1 to have columns 1 to
    10 and page 2 to have columns 11 to 20 you would use the page order “over, then
    down”. Spreadsheets with more data would continue the pattern that you select
    for the printed output. It is of course your choice to determine the print order
    that you can read best, and then apply it to your output.


    SAS Code 8-6 – Page Order Print Selection with PAGE_ORDER_ACROSS= Set to OFF and
    ON


    ods excel (ID=1) file = "&path\PAGE_ORDER_ACROSS_printing_off.xlsx"


              options(PAGE_ORDER_ACROSS=''Off'' );


    ods excel (ID=2) file = "&path\PAGE_ORDER_ACROSS_printing_on.xlsx"


              options(PAGE_ORDER_ACROSS=''ON'' );


       proc print data=Asia_only;


       run;


    ods excel (ID=1) close;


    ods excel (ID=2) close;


    Figure 8-11 – Default Settings for Excel Page order, PAGE_ORDER_ACROSS=‘OFF’


    ![image](images/f0122-01.jpg)


    The arrow in the page order diagram goes down then to the next column. This is
    called “Down, then over.”


    Figure 8-12 – Settings for Excel Page Order, PAGE_ORDER_ACROSS=‘ON’


    ![image](images/f0123-01.jpg)


    The arrow in the page order diagram goes over then down then to the set of rows.
    This is called “Over, then down.”


    ### The PRINT_AREA= Option


    If you want to print only a select number of rows and columns this can be set
    up when your SAS program executes by using the ODS Excel option called PRINT_AREA=.
    Because any group of cells in the Excel spreadsheet always forms a rectangle (of
    course a square set of cells is also a rectangle), all you need to do is identify
    the left most top corner cell and the right most bottom cell. This does not change
    the spreadsheet image, but the codes that you supply appear in the “Print Area”
    of the page setup sheet. The default is that the whole worksheet is output, which
    is not shown.


    SAS Code 8-7 – Code to Select a Small Print Area


    ods excel file = "&path\PRINT_AREA.xlsx"


              options(PRINT_AREA=''b,4,f,9'' );


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-13 – The PRINT_AREA= Option to Print Only 30 Cells of the Spreadsheet


    ![image](images/f0124-01.jpg)


    “Print area” shows the cell range of B4:F9; these cells will be the only ones
    printed.


    Figure 8-14 – The PRINT_AREA= Output from [SAS Code 8-7](#Chapter8.xhtml_ch8-pro7)


    ![image](images/f0125-01.jpg)


    This is the print preview output for this option. The page was printed in portrait
    mode and truncated to save space.


    ### The PRINT_FOOTER= Option


    Often companies want to have special company related or document-related information
    at the bottom of every printed page. The PRINT_FOOTER= option places the text
    string into the Excel worksheet area that places footers at the bottom of each
    page. This footer is often set manually, but SAS can insert the text at run time.
    A SAS footnote will override this option and will be used instead.


    SAS Code 8-8 – Putting a Footer at the Bottom of Each Output Page


    ods excel file = "&path\PRINT_FOOTER.xlsx"


              options(PRINT_FOOTER=''My Footer Text'' );


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-15 – Page Setup Sheet Showing the Excel Page Footer Information


    ![image](images/f0126-01.jpg)


    Remember that setting this footer using the SAS PRINT_FOOTER= option does not
    require you to open and change the output Excel workbook.


    Figure 8-16 – Printed Page with the Excel Footer Displayed


    ![image](images/f0127-01.jpg)


    The full page is shown here to demonstrate the actual location of the text.


    ### The PRINT_FOOTER_MARGIN= Option


    When companies use preprinted paper for output documents, they might have an image
    at the bottom of the page that they want to preserve, without writing over the
    image. This can be accomplished by having a larger footer at the bottom of the
    page. Here, I will print a footer and use a three-inch footer margin to show this
    feature. The footer margin is measured in inches and the default value is 0.5
    inches.


    SAS Code 8-9 – The PRINT_FOOTER_MARGIN= Option


    ods excel file = "&path\PRINT_FOOTER_MARGIN.xlsx"


              options(PRINT_FOOTER=''My Footer Text''


                      PRINT_FOOTER_MARGIN=''3'' );


       proc print data=Asia_only;


       run;


    ods excel close;


    Figure 8-17 – Excel Page Setup Sheet Showing the Footer Set to 3 Inches


    ![image](images/f0128-01.jpg)


    The footer box has a value of 3, and is measured in inches and reserves space
    at the bottom of the page.


    Figure 8-18 –Applying the PRINT_FOOTER_MARGIN= Option


    ![image](images/f0129-01.jpg)


    This is the full page. Compare this to [Figure 8-16](#Chapter8.xhtml_ch8-fig16)
    to see the difference between the default footer margin and the 3-inch margin.


    ### The PRINT_HEADER= Option'
