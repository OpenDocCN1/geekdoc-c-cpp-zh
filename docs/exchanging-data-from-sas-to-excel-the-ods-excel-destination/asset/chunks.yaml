  trans: "\n\n图 7-26 和 7-27 显示了生成的前两个表格。工作表的标签页名称指示了数据源，但没有指示工作表的数量。显示工作表数量有几种方法可以实现。你可以滚动所有的工作表来找到全部六个工作表，可以在工作簿中添加“目录”或“索引”，或者如果你足够小心，可以同时按下\
    \ `ALT/F11` 来显示 Visual Basic for Applications（Visual Basic 应用程序）项目桌面。图 7-28 在左上角显示了\
    \ Excel 文件名以及工作簿中所有工作表的名称。但请务必小心。如果你从未见过 Excel 的这部分，很容易输入某些导致你的工作簿无法使用的内容。听我的吧，这个功能确实存在。\n\
    \n图 7-28 – Excel Visual Basic for Applications 桌面\n\n![image](img/f0102-01.jpg)\n\
    \n使用 Visual Basic for Applications 桌面时要小心，你可能会在这里破坏你的工作簿。\n\n### `SHE_LABEL=`\
    \ 子选项\n\n由于 Excel 工作簿输出表上标签名称的默认值并不总是你老板想看到的，你可能想要更改标签页名称。你可以做的第一件事是使用 `ODS Excel\
    \ SHEET_LABEL=` 选项更改生成的标签页名称的前缀。当此选项不存在或设置为‘NONE’时，SAS 将接管确定工作簿中每个标签页应用什么名称的任务。你可以使用自定义选择的“字符串”来更改前缀。此选项仅更改前缀并允许\
    \ SAS 确定标签页名称其余部分。Excel 标签页名称为 32 个字符，但 SAS 保留了最后四个字符以确保输出唯一的名称。\n\nSAS 代码 7-22\
    \ – ODS Excel `SHEET_LABEL=`‘NONE’ 选项代码\n\n```sas\nods excel file = \"&path\\\
    SHEET_LABEL_none.xlsx\"\noptions(SHEET_LABEL='none');\nproc print data=sashelp.shoes;\n\
    \    by region;\nrun;\nods excel close;\n```\n\n图 7-29 – `SHEET_LABEL=`‘NONE’\
    \ 的默认值\n\n![image](img/f0103-01.jpg)\n\n使用 `PRINT` 过程生成的工作表的默认前缀为“Print”，后面跟着一个数字和部分\
    \ SAS 数据集名称。其他过程将产生不同的前缀。SAS 代码 7-23 显示你可以使用任何字符串。\n\nSAS 代码 7-23 – ODS Excel\
    \ `SHEET_LABEL=`‘My_Prefix’ 值\n\n```sas\nods excel file = \"&path\\SHEET_LABEL_string.xlsx\"\
    \noptions(SHEET_LABEL='My_Prefix');\nproc print data=sashelp.shoes;\n    by region;\n\
    run;\nods excel close;\n```\n\n图 7-30 – 使用“字符串”配合 `SHEET_LABEL=` 选项更改工作表标签前缀\n\
    \n![image](img/f0104-01.jpg)\n\n在图 7-30 中，工作表标签前缀为“My_Prefix”，但标签页名称其余部分与默认工作表标签相同。\n\
    \n### `SHEET_NAME=` 子选项\n\n此选项与 `SHEET_LABEL=` 选项不同，它更改整个工作表名称。当然，这里的默认值是不使用该选项，因为使用此选项的任何字符串都会替换整个工作表（标签）名称。再次，Excel\
    \ 标签页名称可以是 32 个字符，但 SAS 保留了最后四个字符用于唯一数字，以确保输出的工作表具有唯一名称。你提供的字符串将用于所有标签页，直到更改 `SHEET_NAME`\
    \ 子选项。图 7-31 所示的示例从 SAS 的 `BY` 语句生成了多个工作表，在第二个及后续工作表中，工作表名称后面有一个数字。此子选项还接受 SAS\
    \ 常量‘#BYVAL’，当你想要使用 BY GROUP 值作为标签页名称时。使用此子选项允许你对 Excel 工作簿的标签页名称有更多控制。\n\nSAS\
    \ 代码 7-24 – 使用 `SHEET_NAME=` 选项更改 Excel 工作表的全名\n\n```sas\nods excel file = \"\
    &path\\SHEET_NAME_My_String.xlsx\"\noptions(SHEET_NAME='My_Sheet_Names');\nproc\
    \ print data=sashelp.shoes;\n    by region;\nrun;\nods excel close;\n```\n\n图\
    \ 7-31 – 通过 ODS Excel `SHEET_NAME` 选项更改工作表名称 Excel 输出\n\n![image](img/f0105-01.jpg)\n\
    \n### `SUPPRESS_BYLINES=` 子选项\n\n`SUPPRESS_BYLINES=` 子选项的默认值是不抑制。图 7-32 显示了这种情况。`SHEET_INTERVAL=`‘NONE’\
    \ 子选项强制 `PRINT` 过程的输出进入一个工作表，以便显示能够在一个页面内。\n\nSAS 代码 7-25 – 使用 `SUPPRESS_BYLINES=`‘OFF’\
    \ 值\n\n```sas\nods excel file = \"&path\\SUPPRESS_BYLINES_off.xlsx\"\noptions(SUPPRESS_BYLINES='off'\
    \ SHEET_INTERVAL='none');\nproc print data=sashelp.shoes;\n    where=(region ne\
    \ 'Africa');\n    by region;\nrun;\nods excel close;\n```\n\n这段代码不仅将所有输出数据强制到一个\
    \ Excel 工作表，而且不包含非洲地区的数据，因为如图 7-32 所示，该数据无法放入第一页。\n\n图 7-32 – 显示 `BYLINE` 值的 Excel\
    \ 输出\n\n![image](img/f0106-01.jpg)\n\n非洲地区的数据被 SAS 代码抑制了，`BYLINE` 值显示为‘Region\
    \ =Asia’‘Region=Canada’以及 SASHELP.SHOES 数据中的所有其他地区。\n\nSAS 代码 7-26 – 使用 `SUPPRESS_BYLINES=`‘ON’\n\
    \n```sas\nods excel file = \"&path\\SUPPRESS_BYLINES_on.xlsx\"\noptions(SUPPRESS_BYLINES='on'\
    \ SHEET_INTERVAL='none');\nproc print data=sashelp.shoes;\n    where=(region ne\
    \ 'Africa');\n    by region;\nrun;\nods excel close;\n```\n\n图 7-33 – 抑制 BYLINES\
    \ 的 Excel 输出\n\n![image](img/f0107-01.jpg)\n\n非洲地区的数据被 SAS 代码抑制了，`BYLINE` 值在在该工作簿中也被抑制了。\n\
    \n### 总结\n\n本章的示例有助于清晰地直观展示如何调整标题、脚注和标签信息在输出工作表上的显示方式。在运行 SAS 代码时将这些功能引入 Excel\
    \ 输出，可以是一项非常节省时间的编码实践。合理使用这些功能还可以增强你最终工作簿的外观，而无需在生成工作簿后对其进行修改。\n\n第 8 章：影响打印的选项\n\
    \n"
- fmt: "\nThis chapter will discuss the ODS Excel destination suboptions that affect\
    \ output at the level of the whole workbook. Some of these suboptions affect the\
    \ color, size, position, spacing, and visibility of the output data in the Excel\
    \ workbook. The manipulation of headers, titles, footers, footnotes, spacing,\
    \ and print order are often things that the creator of the workbook must do after\
    \ the completion of the SAS program to build the workbook. These features of the\
    \ ODS Excel destination allow these tasks to be accomplished as the Excel workbook\
    \ is being created. By being able to create the workbook with these features installed\
    \ you can deliver a workbook that has not been modified.\n\n# ODS Excel Destination\
    \ Actions\n\nIn this chapter we will discuss the following SAS ODS EXCEL destination\
    \ topics.\n\nTable 8-1 – ODS Excel Destination Actions\n\n| Action Parameter |\
    \ Options | Description |\n| --- | --- | --- |\n| BLACKANDWHITE | ‘OFF’, ‘ON’,‘YES’,\
    \ ‘NO’Default=‘OFF’ | Positive responses change the print mode to black and white\
    \ printing only, negative responses allow color printing. |\n| CENTER_HORIZONTAL\
    \ | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses center the worksheet\
    \ horizontally on the printed page, negative responses do not horizontally center\
    \ the printed output. |\n| CENTER_VERTICAL | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’\
    \ | Positive responses center the worksheet vertically on the printed page, negative\
    \ responses do not vertically center the printed output. |\n| DRAFTQUALITY | ‘OFF’,\
    \ ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses for this option will cause\
    \ the output to be printed in “DRAFT” quality mode. However, graphs will not be\
    \ printed when this option is in effect. |\n| ORIENTATION | ‘PORTRAIT’, ‘LANDSCAPE’,Default=\
    \ ‘PORTRAIT’ | This option aligns the printed output as either PORTRAIT or LANDSCAPE\
    \ on the printed page. |\n| PAGE_ORDER_ACROSS | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’\
    \ | This option controls what order the information in the spreadsheet is printed.\
    \ Positive responses cause the data to be printed across the page first, and then\
    \ down the page. Negative responses cause the printing to be down the page first\
    \ then across the page. |\n| PRINT_AREA | ‘ITEM’, Default= NONE | This option\
    \ enables you to define an output print area that is a subset of the values (cells)\
    \ of the spreadsheet. ‘ITEM’ is a quoted string of values that represent the top\
    \ left cell and the bottom right cell of the spreadsheet to be printed. An example\
    \ would be ‘b,4,f,10’. |\n| PRINT_FOOTER | ‘text-string’ | This text string will\
    \ be placed in the footer when printing, unless a footnote is active. This does\
    \ not override the FOOTNOTE statement. |\n| PRINT_FOOTER_MARGIN | ‘number’,Default=0.5\
    \ inches | This option specifies the amount of the footer margin, and is set in\
    \ the Excel page setup window. The units specified are in inches. |\n| PRINT_HEADER\
    \ | ‘text-string’ | This text string will be placed in the header when printing,\
    \ unless a title is active. This does not override the TITLE statement. |\n| PRINT_HEADER_MARGIN\
    \ | ‘number’, Default= 0.5 inches | This option specifies the amount of the header\
    \ margin, and is set in the Excel page setup window. The units specified are in\
    \ inches. |\n| ROWBREAKS_COUNT | ‘number’ | This option specifies that a page\
    \ break will be inserted after the number of data lines specified are printed.\
    \ |\n| ROWBREAKS_INTERVAL | ‘OUTPUT’, ‘PROC’, ‘NONE’Default=‘NONE’ | This option\
    \ controls the placement of page breaks. ● ‘OUTPUT’ puts a page break between\
    \ each output object.● ‘PROC’ puts a page break between each procedure output.●\
    \ ‘NONE’ does not insert custom page breaks. |\n| ROWCOLHEADINGS | ‘OFF’, ‘ON’,‘YES’,\
    \ ‘NO’Default=‘OFF’ | Positive responses indicate that row and column headings\
    \ should be printed. Negative responses indicate that row and column headings\
    \ should not be printed. |\n| SCALE | ‘number’, Default= 100 | This option controls\
    \ the scaling of the output printout. |\n| TITLE_FOOTNOTE_NOBREAK | ‘OFF’, ‘ON’,‘YES’,\
    \ ‘NO’Default=‘NO’ | This option controls whether the titles and footnotes wrap\
    \ across lines. Positive responses suppress wrapping, while negative responses\
    \ allow wrapping. Think “Yes, we have no bananas today.” |\n| TITLE_FOOTNOTE_WIDTH\
    \ | ‘number’,Default=‘0’ | This option specifies the number of columns that the\
    \ titles and footnotes span. If the value is ‘0’ (zero), then the titles and footnotes\
    \ span across all columns that are in use in the spreadsheet. |\n\n## The BLACKANDWHITE=\
    \ Option\n\nThis ODS Excel option enables you to force the print output to be\
