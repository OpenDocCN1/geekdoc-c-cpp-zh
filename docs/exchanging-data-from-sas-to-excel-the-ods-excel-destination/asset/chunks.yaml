    # 关于本书


    ### 本书涵盖了什么

    ODS Excel 目标操作提供了将 SAS 结果导出到 Excel 的方法。本书解释了如何使用这些操作来格式化和组织数据。多年的经验帮助我理解了这些选项。


    ### 这本书适合你吗？

    无论你的水平如何，我希望你能从中发现一些有用的内容。在我介绍的每一个中，我都会询问是否学到了什么。我希望你在阅读本书的过程中学会使用 SAS。


    ### 本书的先决条件是什么？

    本书为能够打开 SAS 程序并复制数据的人设计的。本书不需要额外的技能。


    ### 开发本书的软件

    使用 SAS 9.4 (TS1M3) 创建了书中的所有示例。我在编写本书时使用了 Microsoft Excel 2013。我也知道生成的生成是新的 Excel
