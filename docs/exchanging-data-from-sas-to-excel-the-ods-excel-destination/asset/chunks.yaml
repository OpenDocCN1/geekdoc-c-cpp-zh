    [https://pharmasug.org/proceedings/2017/AD/PharmaSUG-2017-AD12.pdf](https://pharmasug.org/proceedings/2017/AD/PharmaSUG-2017-AD12.pdf)
    . This paper was presented at PharmaSUG 2017 and is titled “Using the ODS EXCEL
    Destination with SAS^® University Edition to Send Graphs to Excel.”


    ### Output and Graphics


    All output and graphs were generated by using Base SAS or SAS/GRAPH. The code
    can be found in the book or on my SAS Author page, located at the following URL:
    [https://support.sas.com/authors](https://support.sas.com/authors).


