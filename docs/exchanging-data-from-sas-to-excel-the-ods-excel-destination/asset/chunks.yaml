    ### Introduction


    Since I began writing code in 1973 to make computers do what I wanted them to
    do, instead of what they wanted to do, I have always worked as an application
    programmer. That means that I used someone’s software to build a tool to do something.
    When I upgrade my software the tools I have already written still need to work,
    because not every computer is upgraded at the same time and new features need
    to be available to everyone.


    While Base SAS and other features of SAS software make SAS an important and useful
    software suite, many people are not programmers or analysts and do not write computer
    programs. These people have learned to use and understand how Microsoft Excel
    can benefit them. They are quite often managers, directors, and vice presidents,
    and they want to use the data in a comfortable format. Since the release of Microsoft
    Excel 2007 and the Open XML format, the upgrades made to Excel and computer hardware
    in general have caused many updates and changes to the way SAS processes Microsoft
    Excel workbooks and worksheets.


    The first adaptations came in the form of learning to read and write the new Excel
    formats. These changes upgraded PROC EXPORT, PROC IMPORT, the SAS LIBNAME statement,
    and the new SAS PC Files Server. The introduction of the SAS PC Files Server bridged
    the 32 to 64-bit barrier in application software, operating system software, and
    computer hardware. The release of the SAS ODS EXCELXP tagset occurred before the
    introduction of Excel 2007. The EXCELXP tagset writes output text files in the
    Extensible Markup Language (XML) format. Both Excel 2003 and 2007 can read these
    files. The new EXCEL 2007 (and later) workbooks are stored in the open XML format.
    Between the release of the EXCELXP tagset and December 2014, over 100 modifications
    in several releases occurred.


    In late December 2014, I found out about a new SAS ODS feature, the ODS EXCEL
    destination. After nearly eight years of research and preparation my first book
    was days away from being finalized for publication. I realized I had the software
    required to create an example and lobbied hard to get something into my first
    book. This second book replaces the page and a half that introduced the ODS EXCEL
    destination in the first book.


    ### What is the SAS ODS EXCEL Destination?


    The SAS Output Delivery System has two major features that deal with outputting
    data files that Microsoft Excel can read. The general classifications are ODS
    tagsets and ODS destinations. Each of these has many features. Tagsets are created
    by PROC TEMPLATE code that any SAS programmer can modify, while the ODS destinations
    are fixed executable modules that the user cannot modify. While the ODS EXCEL
    destination is a new part of Base SAS, many of the features of the ODS EXCELXP
    tagset are available to the new ODS EXCEL destination. See [Chapter 2](#Chapter2.xhtml),
    “ODS Tagset versus Destination” for more information.


    ### Why I like Backward Compatibility


    Backward compatibility is a challenge that nearly every software producer faces.
    It does not matter if you develop software suites, operating systems, or reports
    for your boss. The only thing you can guarantee about the software, data, or reports
    that you need to produce is that they will change. SAS is one of the software
    producers that do a good job of maintaining backward compatibility. Sometimes
    I recode legacy features to accept the same inputs as before but I also accept
    new options and output new information. This allows the legacy code to run seamlessly
    but give new features to existing routines. At other times the SAS documentation
    is updated to say that an option is retained for backward compatibility, but is
    not used by the software.


    I like backward capability because it enables me to write new code inside a current
    feature of a tool I have written. This leaves the existing functions intact and
    lets me write new features. Thus, allowing me to have one upgraded program without
    losing features.


    #### Why I Cannot Use Backward Compatibility for This Book


    The change from the binary formatted *.xls file structure to the open XML file
    format was a big file format change that was introduced with Microsoft Office
    2007. The new output *.xlsx file format, which included “zip” files of XML code,
    also changed the access method for all new Excel workbook files. Any SAS user
    that needed to read or write an Excel worksheet needed to consider the Excel workbook
    format changes. Everyone who had used or programmed applications using the old
    formats suddenly had to redo every application that used the old formats.'
