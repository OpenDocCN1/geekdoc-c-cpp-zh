    ### View of Microsoft Excel Changes from the Outside


    During the decade between 2006 and 2015, there have been many changes in the way
    SAS interfaced with Microsoft Excel. The changes began with the Microsoft release
    of Office 2007\. Because this book deals mainly with Excel, I will refer to that
    product specifically. For many years the format of the Microsoft Excel files had
    remained the same. Opening a small Excel file with the Notepad program enabled
    you to see the binary patterns of the file. While this was generally not a useful
    thing to do, the patterns did occasionally show readable text. With Microsoft
    Excel 2007 the Excel file format converted to a compressed file (essentially a
    ZIP file) of XML files. I am not going to try to decode those files or explain
    them, it just worked for Microsoft. They could protect their Excel files from
    having Visual Basic for Applications (VBA) macros inside the *.xlsx files. This
    allowed users to know there were no macros and the files were safer. Microsoft
    did allow the Excel files with other file extensions to contain macros and binary
    components (*.xlsm or *.xlsb file extensions).


    However, this provided a problem for everyone else. Many of the older products
    that were installed could not even open the new Excel files. Microsoft handed
    out free software to read these new file formats. SAS worked hard to convert their
    input and output routines to both read the new Excel formats and write the output
    files that Microsoft Excel could read. A compounding issue over that time period
    was the advent of new computer chips for the commonly used microprocessors. I
    still remember my first computer was based on an 8-bit instruction set to make
    the computer run. It of course had only one Central Processing Unit (CPU) in the
    approximately 2.5X2.5 inch chipset. It also needed a second chip that size to
    do the floating-point arithmetic. 64-bit computers started showing up as Personal
    Computers (PCs) around 2003 ^([[1](#Chapter2.xhtml_ch2fn_1)]), and by the time
    Microsoft Excel 2007 was introduced these computers were well on their way to
    being the standard for PC computer architecture. The last part of this puzzle
    is that computer operating system software is generally written to be forward
    compatible with one architecture. However, the operating systems can allow the
    program to choose an execution mode (32-bit or 64-bit mode). The problem then
    became an issue of the data, computer instruction, and memory addressing configurations.
    Backward compatibility required something to address these issues.'
