    # About This Book


    ### What Does This Book Cover?

    ODS Excel Destination actions provide methods to export SAS results to Excel spreadsheets.
    This book explains how to use these actions to format and organize data. My years
    of experience have helped me understand the options available in. I do not attempt
    to teach you how to write SAS programs, but I present methods to move data between
    the two.


    ### Is This Book for You?

    Whatever your skill level, I hope you will find something useful. In every class
    I present, I always ask whether anyone learned anything. I want you to be able
    to use SAS as you progress through the book. This book includes examples for you
    to follow in SAS.


    ### What Are the Prerequisites for This Book?

    This book is designed for those who can open a SAS program and copy data using
    their mouse. This book uses SAS without the need for prerequisites.


    ### Software Used to Develop the Book

    SAS 9.4 (TS1M3) was used to create all the examples in this book. I used Microsoft
    Excel 2013 while writing this book. I also know that the files generated are in
    the new Excel file format (`*.xlsx`).


    ### What Should You Know about the Examples?

    The example code shown in this book was executed using the Base SAS Display Manager
    on a Microsoft Windows 10 Operating System. I expect it to execute in any other
    Base SAS environment. Most of the examples use a subset of the `SASHELP.SHOES`
    data set that I called `ASIA_ONLY`, because the name implies that it includes
    only the data from the region “ASIA” of the `SASHELP.SHOES` data set. Some examples
    use the whole `SASHELP.SHOES` data set, and a few others are identified when they
    are used.


    You can access the example code and data for this book by linking to its author
    page at `https://support.sas.com/authors](https://support.sas.com/authors). Each
    chapter has a segment of code that is not shown in the book (except for [Chapter
    2](#Chapter2.xhtml)), which creates a path and sets some other values. The code
    name has a general format of `SAS Code 3.0 Create ASIA_ONLY file in [Chapter 03](#Chapter3.xhtml)
    Path.sas`.


    ### SAS University Edition

    If you are using SAS University Edition to access data and run your programs,
    then please check the SAS University Edition page to ensure that the software
    contains the product or products that you need to run the code. The link is `[www.sas.com/universityedition](http://www.sas.com/universityedition)`.

