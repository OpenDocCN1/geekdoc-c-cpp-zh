  trans: "\n\n# 图 3-4 – Excel 输出文件的 XML 内容\n\n![image](img/f0015-01.jpg)\n\n第一部分展示了如何从单个工作表中的原始数据创建\
    \ Excel 工作簿，其中包含所有数据变量以及一列指示 SAS 观测值编号的新列。这非常直观，并为 *.xlsx` 输出文件生成了原生格式的 Excel\
    \ 工作簿。\n\n## 使用 ODS TRACE 语句查找 ODS 对象名称\n\n我们流程的下一步是找到一种方法来识别可以由 ODS 输出的 ODS 输出元素。换句话说，如果你不知道自己拥有什么，又如何知道你想要保留什么呢？我们将使用\
    \ `ODS TRACE` 语句来识别可以输出的输出对象。然后，我将演示如何使用 `ODS EXCEL` 动作 `SHOW`、`SELECT` 和 `EXCLUDE`\
    \ 来最终确定你的输出。通过了解如何显示、选择或排除输出对象，你可以有选择性地控制你的输出工作簿中包含的内容。SAS 输出交付系统（ODS）承担了大量工作。`ODS\
    \ TRACE` 语句是 ODS 的功能之一，允许你查看内部机制以识别系统用于生成输出的内部对象。过程和 `DATA` 步为 ODS 生成的每个对象的信息会在\
    \ SAS Log 中显示。这些信息可以在项目开发期间使用，以确定这些输出数据对象的选择。简单的命令 `ODS TRACE ON` 和 `ODS TRACE\
    \ OFF` 可以开启和关闭此功能。SAS 代码 3-2 中的代码展示了如何使用使用 `ODS TRACE` 语句。在这里，它仅针对 `UNIVARIATE`\
    \ 过程开启。当计算机可以输出关于它所做的一切的信息时，你通常会得到比预期的更多的。在这个示例中，我只想查看一个过程输出。\n\n## 使用 ODS TRACE\
    \ 语句显示 PROC UNIVARIATE 对象\n\n虽然我在作为 ODS Excel 目标的一部分展示了 `ODS TRACE`、`ODS EXCLUDE`、`ODS\
    \ SELECT` 和 `ODS SHOW` 语句，但它们实际上是各自独立的 ODS 语句。这四个 ODS 语句允许你识别、选择和验证你想要输出的 ODS\
    \ 对象。在本章中描述它们是因为它们与 ODS Excel 目标配合工作。\n\n### SAS 代码 3-2 – 显示 SAS ODS 输出对象的 PROC\
    \ UNIVARIATE 调用\n\n```\nODS TRACE ON;\n\nPROC UNIVARIATE  DATA=sashelp.shoes\n\
    \    (keep =  region stores product\n    where=(region=\"Asia\" and product=\"\
    Boot\"));\nBY region;\nvariable stores;\nfreq stores;\nRUN;\n\nODS TRACE OFF;\n\
    ```\n\n### SAS 代码 3-2 的日志输出\n\n此日志列表显示了按 `PROC UNIVARIATE` 生成顺序输出的 ODS 元素。日志中的每个“Output\
    \ Added”标记描述了由 `UNIVARIATE` 过程创建的新 ODS 输出元素。ODS 对象的“Name”可以用于 `SELECT` 或 `EXCLUDE`\
    \ ODS 输出流中的该部分到 Excel 工作簿中。\n\n#### 日志输出 3.1 – ODS TRACE 命令的日志列表\n\n```\nNOTE:\
    \ This session is executing on the X64_8PRO  platform.\nNOTE: Additional host\
    \ information:\n  X64_8PRO WIN 6.2.9200  Workstation\nNOTE: SAS initialization\
    \ used:\n      real time            1.36 seconds\n      cpu time            0.98\
    \ seconds\n1    ODS TRACE ON;\n2    PROC UNIVARIATE  DATA=sashelp.shoes\nNOTE:\
    \ Writing HTML Body file: sashtml.htm\n3         (keep =  region stores product\n\
