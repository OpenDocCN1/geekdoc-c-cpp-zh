  trans: "\nODS Excel 目标 `COLUMN_REPEAT=` 选项的识别稍微有点复杂。此选项允许你将某些信息复制到宽幅打印输出的后续工作表中。如果你发送到\
    \ Excel 的输出文件没有足够的列，导致打印输出宽度不足以扩展到第二页，那么该选项似乎不起任何作用。可能你有一份关于部件或库存清单的大量信息，并希望产品描述在打印输出的后半部分或后续页面中重复。在这个示例中，我将使用\
    \ `SASHELP.ORSALES` SAS 数据集的前 53 行。下文显示的 Excel“打印预览”输出将显示为数据的左半和右半部分。你可以使用‘NONE’、一个数字、数字范围或‘HEADER’来描述你想要重复的内容。此外，使用数字‘1’与使用‘HEADER’\
    \ 相同。`FROZEN_HEADERS=` 或 `FROZEN_ROWHEADERS=` 都不影响表头列数。\n\n#### SAS 代码 9-5 – 为单列使用\
    \ `COLUMN_REPEAT=` 子选项\n\n```sas\nods excel file = \"&path\\COLUMN_REPEAT_number.xlsx\"\
    \n    options(COLUMN_REPEAT='6');\nproc print data=SASHELP.ORSALES(obs=53);\n\
    \  run;\nods excel close;\n```\n\n图 9-5 – 页面设置表显示列“$F”已重复\n\n![image](img/f0163-01.jpg)\n\
    \n“要在左侧重复的列:”中的符号为“$F:$F”；当打印页面后半部分时，变量 `PRODUCT_LINE` 将被重复。“$”符号表示绝对行“F”。“页面顺序”选择指定了所有适应第一页的列数据都将在第二页显示任何数据之前打印。在例示例中，我仔细地选择了\
    \ 53 行数据，以便所有 `COLUMN_REPEAT=` 选项输出恰好填充一页。第二页的数据是输出的后半部分。\n\n图 9-6 – `COLUMN_REPEAT`\
    \ 列‘6’输出的第一个预览页\n\n![image](img/f0164-01.jpg)\n\n此页显示了数据打印时的第一页。列“6”是 `Product_Group`\
    \ 变量。\n\n图 9-7 – `COLUMN_REPEAT` 列‘6’输出的第二个预览页\n\n![image](img/f0165-01.jpg)\n\
    \n此页显示了数据打印时的第二页。列“6”（“Product_Group”）作为该页的第一列被重复。\n\n#### SAS 代码 9-6 – 为列范围使用\
    \ `COLUMN_REPEAT=` 子选项\n\n```sas\nods excel (id=2) file = \"&path\\COLUMN_REPEAT_range.xlsx\"\
    \n    options(COLUMN_REPEAT='3-5');\nproc print data=SASHELP.ORSALES(obs=53);\n\
    \  run;\nods excel close;\n```\n\n图 9-8 – `COLUMN_REPEAT=` 列范围的 Excel“页面设置”显示\n\
    \n![image](img/f0166-01.jpg)\n\n在这里，列“C”到列“E”将在输出的后半部分打印。\n\n图 9-9 – 输出后半部分的局部图像\n\
    \n![image](img/f0166-02.jpg)\n\n列“Quarter”、`Product_Line` 和 `Product_Category`\
    \ 在输出的后半部分重复。\n\n#### SAS 代码 9-7 – 使用 HEADER 值使用 `COLUMN_REPEAT=` 子选项\n\n```sas\n\
    ods excel file = \"&path\\COLUMN_REPEAT_header.xlsx\"\n    options(COLUMN_REPEAT='header');\n\
    proc print data=SASHELP.ORSALES(obs=53);\n  run;\nods excel close;\n```\n\n图 9-10\
    \ – 使用 `COLUMN_REPEAT=` “HEADER” 选项时的示例数据\n\n![image](img/f0167-01.jpg)\n\n列“A”始终被视为“HEADER”，`FROZEN_HEADERS=`\
    \ 或 `FROZEN_ROWHEADERS=` 都不影响表头列数。\n\n图 9-11 – `COLUMN_REPEAT` 表头输出的局部图像\n\n![image](img/f0168-01.jpg)\n\
    \n在这里，“HEADER”选项将电子表格的列“A”复制到打印输出的后半部分。\n\n### `FROZEN_HEADERS=` 子选项\n\nODS Excel\
    \ `FROZEN_HEADERS=` 选项执行了另一件事，我多年来一直是手动操作。它设置了 Excel 工作表的顶行，使其不滚动。选择是所有行滚动（默认值）或在工作表顶部冻结一个或多个行。值“ON”或数字“1”仅冻结顶行，任何其他数字都会冻结相应数量行。\n\
    \n#### SAS 代码 9-8 – `FROZEN_HEADERS=` 子选项的默认值\n\n```sas\nods excel file = \"&path\\\
    Frozen_Headers_on.xlsx\"\n    options(Frozen_Headers='on');\nproc print data=Asia_only;\n\
    \  run;\nods excel close;\n```\n\n图 9-12 – `FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg)\
    \ （等待，提供的文本包含重复部分，我按照原文流进行）\n\n图 9-12 – `FROZEN_HEADERS=` 子选项的默认值\n\n```sas\n\
    ods excel file = \"&path\\Frozen_Headers_on.xlsx\"\n    options(Frozen_Headers='on');\n\
    proc print data=Asia_only;\n  run;\nods excel close;\n```\n\n图 9-12 – `FROZEN_HEADERS=`\
    \ 子选项“ON”\n\n![image](img/f0169-01.jpg) （注：源文本包含大量的重复/重叠块。我将按照提供的顺序格式化它们。）\n\n\
    图 9-12 – `FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg) （等待，查看提供的文本，它有许多细微差异的重复部分。我将按照提供的顺序精确处理文本。）\n\
    \n图 9-12 – `FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg) （实际上，用户提供的文本是一团重复内容。我将保持所提供文本的结构。）\n\
    \n### `FROZEN_HEADERS=` 子选项\n\nODS Excel `FROZEN_HEADERS=` 选项执行了另一件事，我多年来一直是手动操作。它设置了\
    \ Excel 工作表的顶行，使其不滚动。选择是所有行滚动（默认值）或在工作表顶部冻结一个或多个行。值“ON”或数字“1”仅冻结顶行，任何其他数字都会冻结相应数量行。\n\
    \n#### SAS 代码 9-8 – `FROZEN_HEADERS=` 子选项的默认值\n\n```sas\nods excel file = \"&path\\\
    Frozen_Headers_on.xlsx\"\n    options(Frozen_Headers='on');\nproc print data=Asia_only;\n\
    \  run;\nods excel close;\n```\n\n图 9-12 – `FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg)\
    \ （注：源文本包含大量的重复/重叠块。我将按照提供的顺序格式化它们。）\n\n图 9-12 – `FROZEN_HEADERS=` 子选项“ON”\n\n\
    ![image](img/f0169-01.jpg) （等待，查看提供的文本，它有许多细微差异的重复部分。我将按照提供的顺序精确处理文本。）\n\n图 9-12\
    \ – `FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg) （实际上，用户提供的文本是一团重复内容。我将保持所提供文本的结构。）\n\
    \n### `FROZEN_HEADERS=`... `FROZEN_HEADERS=` 子选项\n\nODS Excel `FROZEN_HEADERS=`\
    \ 选项执行了另一件事，我多年来一直是手动操作。它设置了 Excel 工作表的顶行，使其不滚动。选择是所有行滚动（默认值）或在工作表顶部冻结一个或多个行。值“ON”或数字“1”仅冻结顶行，任何其他数字都会冻结相应数量行。\n\
    \n#### SAS 代码 9-8 – `FROZEN_HEADERS=` 子选项的默认值\n\n```sas\nods excel file = \"&path\\\
    Frozen_Headers_on.xlsx\"\n    options(Frozen_Headers='on');\nproc print data=Asia_only;\n\
    \  run;\nods excel close;\n```\n\n图 9-12 – `FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg)\n\
    \n`FROZEN_HEADERS=` 子选项“ON”\n\n![image](img/f0169-01.jpg) （用户文本显然是重复的。我将进行格式化。）\n\
    \n### `HIDDEN_COLUMNS=` 子选项\n\n在 Excel 工作表中隐藏列是另一项经常手动完成的任务。`HIDDEN_COLUMNS=`\
    \ 选项非常灵活，因为你可以在同一个字符串中组合列和范围。默认是隐藏某些列。\n\n#### SAS 代码 9-10 – 使用 `HIDDEN_COLUMNS=`\n\
    \n```sas\nods excel file = \"&path\\Hidden_Columns.xlsx\"\n    options(Hidden_Columns='2,5-6');\n\
    proc print data=Asia_only;\n  run;\nods excel close;\n```\n\n图 9-14 – 输出上的隐藏列\n\
    \n![image](img/f0171-01.jpg)\n\n### `ABSOLUTE_ROW_HEIGHT=` 子选项\n\n我一直不喜欢打开 Excel\
    \ 工作簿来调整行高。现在我在创建工作表时使用 `ABSOLUTE_ROW_HEIGHT=` 选项。该选项字符串使用高度列表（逗号分隔并以磅为单位）来调整电子表格的每一行，包括第一行。如果字符串中仅有一个行值，则所有行都将调整为该高度。如果提供了多个数字，则按每个数字的顺序赋予行相应的高度。如果数据行多于提供的数字，则重复该模式直到数据耗尽。默认情况下不进行任何调整，所有行高度都相同。\n\
    \n#### SAS 代码 9-11 – 在重复模式中调整行高的 SAS 代码\n\n```sas\nods excel file = \"&path\\\
    Absolute_row_height.xlsx\"\n    options(ABSOLUTE_ROW_HEIGHT='15,30');\nproc print\
    \ data=Asia_only;\n  run;\nods excel close;\n```\n\n图 9-15 – `ABSOLUTE_ROW_HEIGHT=`\
    \ 子选项的重复模式输出\n\n![image](img/f0172-01.jpg)\n"
- fmt: "\n## SAS Code 9-12 – The FROZEN_ROWHEADERS= Default Option Value\n\n```sas\n\
    ods excel file = \"&path\\Frozen_rowHeaders_on.xlsx\"\noptions(Frozen_rowHeaders='on');\n\
    proc print data=Asia_only;\nrun;\nods excel close;\n```\n\n### Figure 9-16 – FROZEN_ROWHEADERS=\
    \ ‘ON’ Showing Column ‘B’ Missing\n\n![image](images/f0173-01.jpg)\n\nHere I have\
    \ scrolled the Excel worksheet data to the left (hiding column “B”) by one column.\
    \ This is shown by the fact that column ‘B’ is not visible. The other way to determine\
    \ that the row header is frozen is the vertical line between columns ‘A’ and ‘C’.\
    \ The typical output from SAS does not show grid lines outside of the data output\
    \ by SAS. The line is vertical between all rows but it is more visible below Excel\
    \ rows 16 to 18 because the rest of the grid is missing.\n\n### SAS Code 9-13\
    \ – FROZEN_ROWHEADERS= Suboption Freezing Four Columns\n\n```sas\nods excel file\
    \ = \"&path\\Frozen_rowHeaders_number.xlsx\"\noptions(Frozen_rowHeaders='4');\n\
    proc print data=Asia_only;\nrun;\nods excel close;\n```\n\n### Figure 9-17 - FROZEN_ROWHEADERS=\
    \ with Four Columns Frozen\n\n![image](images/f0174-01.jpg)\n\nIn [Figure 9-17](#Chapter9.xhtml_ch9-fig17)\
    \ I have scrolled the Excel worksheet data to the left by one column, hiding column\
    \ “E”. The other way to determine that the row header is frozen is the vertical\
    \ line between columns ‘D’ and ‘F’. This output from SAS does not show grid lines\
    \ outside of the cells A1 to H15. The vertical line indicating the frozen headers\
    \ is vertical between all rows but it is more visible in Excel rows 16 to 18 because\
    \ the rest of the grid is missing.\n\n## The HIDDEN_ROWS= Suboption\n\nHiding\
    \ rows in an Excel worksheet can now be done when SAS is executing instead of\
    \ doing it manually after the workbooks are created. The `HIDDEN_ROWS=` suboption\
    \ is flexible; you can combine individual rows and ranges in the same `number_list_range`\
    \ value string. The default option is to not have any rows hidden.\n\n### SAS\
    \ Code 9-14 – The HIDDEN_ROWS= Suboption with a Row and a Range of Rows Hidden\n\
    \n```sas\nods excel file = \"&path\\Hidden_Rows.xlsx\"\noptions(Hidden_Rows='4,8-10');\n\
    proc print data=Asia_only noobs;\nrun;\nods excel close;\n```\n\n### Figure 9-18\
    \ – Excel Output with Hidden Rows\n\n![image](images/f0175-01.jpg)\n\n[Figure\
    \ 9-18](#Chapter9.xhtml_ch9-fig18) shows that row 4 and rows 8, 9, and 10 are\
    \ hidden. Notice the double line in the Excel header column between rows 3 and\
    \ 5 and also between rows 7 and 11. Make sure that you do not confuse the Excel\
    \ row header column with the SAS OBS number, which also skips.\n\n## The ROW_HEIGHTS=\
    \ Suboption\n\nThe ‘HEIGHTS’ part of the suboption name `ROW_HEIGHTS` is plural,\
    \ and as the plural name implies, the suboption has an affect on several row heights.\
    \ A single value of zero indicates that the font size should be used as the height\
    \ of all of the row types described in the list below. For this option you need\
    \ to provide a quoted string of positional parameters to identify the seven row\
    \ heights listed below. Values can be skipped but skipped parameters require a\
    \ comma to show that the parameter is missing, except the last used value. As\
    \ mentioned above, row heights are measured in points.\n\n*   Table header rows\n\
    *   Table body rows\n*   BY value lines\n*   Titles\n*   Footers\n*   Page break\
    \ height\n*   Paragraph skip height\n\n### SAS Code 9-15 – Code Options to Display\
    \ Row Heights Associated with the ROW_HEIGHTS= Option\n\n```sas\nods excel file\
    \ = \"&path\\Row_Heights.xlsx\"\noptions(ROW_HEIGHTS='20,15,15,35,55,25,5'\n \
    \       embedded_titles='on'\n        embedded_footnotes='on'\n        sheet_interval='none');\n\
    Title 'my title';\nfootnote 'my footnote';\nproc print data=asia_only;\nby Subsidiary;\n\
    run;\nods excel close;\n```\n\n### Figure 9-19 – Excel Output Showing the Different\
    \ Row Heights Produced by SAS Code 9-15\n\n![image](images/f0176-01.jpg)\n\nIn\
    \ this example, I used `BY` to split the data into segments that would show different\
    \ types of spacing used in the Excel output. Titles and footnotes are larger than\
    \ the other lines. Titles is highlighted in green because it includes cell “A1”,\
    \ is the default cursor when workbooks are first opened. Rows `2`, `4`, `11`,\
    \ `13`, `25`, `28`, and `30` are so small they are nearly hidden. The subsidiary\
    \ header lines are slightly larger than the data and the BY lines are surrounded\
    \ by small lines.\n\n## The ROW_REPEAT= Suboption\n\nThe results of `ROW_REPEAT=`\
    \ are harder to identify than `COLUMN_REPEAT=`. If your data does not extend to\
    \ a second page, then the suboption is useless. This suboption allows copying\
    \ information from the middle of page one or header onto subsequent sheets of\
    \ a long printout. I am using the `SASHELP.ORSALES` data set rows 1 to 63. The\
    \ first and second “Print Preview” output is displayed below [Figure 9-21](#Chapter9.xhtml_ch9-fig21)\
    \ and [Figure 9-22](#Chapter9.xhtml_ch9-fig22). Valid options include `NONE`,\
    \ a `number`, a `number-range`, or `HEADER` to describe what you want to repeat.\
    \ Also, using the number `1` is the same as using `HEADER`. Neither `FROZEN_HEADERS=`\
    \ nor `FROZEN_ROWHEADERS=` affect the number of header columns.\n\n### SAS Code\
    \ 9-16 – Code to Output Repeated Row One\n\n```sas\nods excel file = \"&path\\\
    ROW_REPEAT_number.xlsx\"\noptions(SHEET_INTERVAL='none' ROW_REPEAT='6');\nproc\
    \ print data=SASHELP.ORSALES(obs=63);\nrun;\nods excel close;\n```\n\n### Figure\
    \ 9-20 – Page Setup Sheet Showing Row 6 Repeated on Top of Page 2\n\n![image](images/f0177-01.jpg)\n\
    \nAgain the `6` is Excel notation for the absolute row number `6`.\n\n### Figure\
    \ 9-21 – ROW_REPEAT= Output Page 1\n\n![image](images/f0178-01.jpg)\n\n[Figure\
    \ 9-21](#Chapter9.xhtml_ch9-fig21) shows the first page of the Print Preview sheet.\
    \ Because the width of the output exceeds the width of a portrait formatted page,\
    \ four sheets are output in “Down Then Over” order. I am only showing the first\
    \ two pages. Also, because the ‘Page Setup’ sheet obscures some of the data, it\
    \ is difficult to confirm exactly which row of data is duplicated. You need to\
    \ be careful because the row that is duplicated is the 6th row of the Excel worksheet,\
    \ not the 6th SAS observation. In [Figure 9-22](#Chapter9.xhtml_ch9-fig22) the\
    \ top row of the output on the Print preview sheet is Excel row `6` from the first\
    \ page of the output in [Figure 9-21](#Chapter9.xhtml_ch9-fig21). Admittedly,\
    \ it is difficult to see on either a printed page or mobile device.\n\n### Figure\
    \ 9-22 – ROW_REPEAT= Output Second Half\n\n![image](images/f0179-01.jpg)\n\nBe\
    \ careful, because the row that is duplicated is the 6th row of the Excel worksheet,\
    \ not the 6th SAS observation. The code in [SAS Code 9-17](#Chapter9.xhtml_ch9-pro17)\
    \ duplicates a range of rows. The value `3-5` duplicates the third, fourth, and\
    \ fifth row of the Excel output worksheet onto the second and subsequent output\
    \ pages, not SAS observations.\n\n### SAS Code 9-17 – Code to Output Repeated\
    \ Range of Row Values\n\n```sas\nods excel file = \"&path\\ROW_REPEAT_range.xlsx\"\
    \noptions(SHEET_INTERVAL='none' ROW_REPEAT='3-5');\nproc print data=SASHELP.ORSALES(obs=63);\n\
    run;\nods excel close;\n```\n\n### Figure 9-23 – The ROW_REPEAT= Suboption Using\
    \ a Range\n\n![image](images/f0180-01.jpg)\n\nRows 3, 4, and 5 are repeated at\
    \ the top of the page after page 1.\n\n### Figure 9-24 – ROW_REPEAT= Output Using\
    \ a Range\n\n![image](images/f0180-02.jpg)\n\nExcel observations 2, 3, and 4 appear\
    \ at the top of the printout. This data is from the SAS data set rows 3, 4, and\
    \ 5, because you include the headers in your count. Only part of the page is reproduced\
    \ in [Figure 9-24](#Chapter9.xhtml_ch9-fig24).\n\n### SAS Code 9-18 – Code to\
    \ Output Repeated Header Row Values\n\n```sas\nods excel file = \"&path\\ROW_REPEAT_header.xlsx\"\
    \noptions(SHEET_INTERVAL='none' ROW_REPEAT='header');\nproc print data=SASHELP.ORSALES(obs=63);\n\
    run;\nods excel close;\n```\n"
  raw: 'SAS Code 9-12 – The FROZEN_ROWHEADERS= Default Option Value


    ods excel file = "&path\Frozen_rowHeaders_on.xlsx"


             options(Frozen_rowHeaders=''on'');


      proc print data=Asia_only;


      run;


    ods excel close;


    Figure 9-16 – FROZEN_ROWHEADERS= ‘ON’ Showing Column ‘B’ Missing


    ![image](images/f0173-01.jpg)


    Here I have scrolled the Excel worksheet data to the left (hiding column “B”)
    by one column. This is shown by the fact that column ‘B’ is not visible. The other
    way to determine that the row header is frozen is the vertical line between columns
    ‘A’ and ‘C’. The typical output from SAS does not show grid lines outside of the
    data output by SAS. The line is vertical between all rows but it is more visible
    below Excel rows 16 to 18 because the rest of the grid is missing.


    SAS Code 9-13 – FROZEN_ROWHEADERS= Suboption Freezing Four Columns


    ods excel file = "&path\Frozen_rowHeaders_number.xlsx"


             options(Frozen_rowHeaders=''4'');


      proc print data=Asia_only;


      run;


    ods excel close;


    Figure 9-17 - FROZEN_ROWHEADERS= with Four Columns Frozen


    ![image](images/f0174-01.jpg)


    In [Figure 9-17](#Chapter9.xhtml_ch9-fig17) I have scrolled the Excel worksheet
    data to the left by one column, hiding column “E”. The other way to determine
    that the row header is frozen is the vertical line between columns ‘D’ and ‘F’.
    This output from SAS does not show grid lines outside of the cells A1 to H15\.
    The vertical line indicating the frozen headers is vertical between all rows but
    it is more visible in Excel rows 16 to 18 because the rest of the grid is missing


    ### The HIDDEN_ROWS= Suboption


    Hiding rows in an Excel worksheet can now be done when SAS is executing instead
    of doing it manually after the workbooks are created. The HIDDEN_ROWS= suboption
    is flexible; you can combine individual rows and ranges in the same ‘number_list_range’
    value string. The default option is to not have any rows hidden.


    SAS Code 9-14 – The HIDDEN_ROWS= Suboption with a Row and a Range of Rows Hidden


    ods excel file = "&path\Hidden_Rows.xlsx"


             options(Hidden_Rows=''4,8-10'');


       proc print data=Asia_only noobs;


      run;


    ods excel close;


    Figure 9-18 – Excel Output with Hidden Rows


    ![image](images/f0175-01.jpg)


    [Figure 9-18](#Chapter9.xhtml_ch9-fig18) shows that row 4 and rows 8, 9, and 10
    are hidden. Notice the double line in the Excel header column between rows 3 and
    5 and also between rows 7 and 11\. Make sure that you do not confuse the Excel
    row header column with the SAS OBS number, which also skips.


    ### The ROW_HEIGHTS= Suboption


    The ‘HEIGHTS’ part of the suboption name ROW_HEIGHTS is plural, and as the plural
    name implies, the suboption has an affect on several row heights. A single value
    of zero indicates that the font size should be used as the height of all of the
    row types described in the list below. For this option you need to provide a quoted
    string of positional parameters to identify the seven row heights listed below.
    Values can be skipped but skipped parameters require a comma to show that the
    parameter is missing, except the last used value. As mentioned above, row heights
    are measured in points.


    ●   Table header rows


    ●   Table body rows


    ●   BY value lines


    ●   Titles


    ●   Footers


    ●   Page break height


    ●   Paragraph skip height


    SAS Code 9-15 – Code Options to Display Row Heights Associated with the ROW_HEIGHTS=
    Option


    ods excel file = "&path\Row_Heights.xlsx"


             options(ROW_HEIGHTS=''20,15,15,35,55,25,5''


                     embedded_titles=''on''


                     embedded_footnotes=''on''


                     sheet_interval=''none'');


    Title    ''my title'';


    footnote ''my footnote'';


      proc print data=asia_only;


      by Subsidiary;


      run;


    ods excel close;


    Figure 9-19 – Excel Output Showing the Different Row Heights Produced by [SAS
    Code 9-15](#Chapter9.xhtml_ch9-pro15)


    ![image](images/f0176-01.jpg)


    In this example, I used the BYGROUP (Subsidiary) to split the data into segments
    that would show different types of spacing used in the Excel output. Titles and
    footnotes are larger than the other lines. Titles is highlighted in green because
    it includes cell “A1”, which is the default curser position when Excel workbooks
    are first opened. Rows ‘2’, ‘4’, ‘11’, ’13’, ‘23’, ‘25’, ‘28’, and ‘30’ are so
    small that they are nearly hidden. The subsidiary header lines are slightly larger
    than the data lines and the BY lines are surrounded by very small lines.


    ### The ROW_REPEAT= Suboption


    The results of ROW_REPEAT= suboption are harder to identify than the COLUMN_REPEAT=
    output. If your data does not extend to a second page, then the suboption is useless.
    This suboption allows copying information from the middle of page one or a header
    onto subsequent sheets of a long printout. I am using the SASHELP.ORSALES SAS
    data set rows 1 to 63\. The first and second “Print Preview” page output is displayed
    below in [Figure 9-21](#Chapter9.xhtml_ch9-fig21) and [Figure 9-22](#Chapter9.xhtml_ch9-fig22).
    Valid options include ‘NONE’, a ‘number’, a ‘number-range’, or ‘HEADER’ to describe
    what you want to repeat. Also, using the number ‘1’ is the same as using ‘HEADER’,
    Neither FROZEN_HEADERS= nor FROZEN_ROWHEADERS= affect the number of header columns.


    SAS Code 9-16 – Code to Output Repeated Row Values One Row


    ods excel file = "&path\ROW_REPEAT_number.xlsx"


             options(SHEET_INTERVAL=''none''


                     ROW_REPEAT=''6'');


      proc print data=SASHELP.ORSALES(obs=63);


      run;


    ods excel close;


    Figure 9-20 – Page Setup Sheet Showing Row 6 Repeated on Top of Page 2


    ![image](images/f0177-01.jpg)


    Again the ‘$’ is Excel notation for the absolute row number ‘6’.


    Figure 9-21 – ROW_REPEAT= Output Page 1


    ![image](images/f0178-01.jpg)


    [Figure 9-21](#Chapter9.xhtml_ch9-fig21) shows the first page of the Print Preview
    sheet. Because the width of the output exceeds the width of a portrait formatted
    page, four sheets are output in “Down Then Over” page order. I am only showing
    the first two pages. Also, because the ‘Page Setup’ sheet obscures some of the
    data, it is difficult to confirm exactly which row of data is duplicated. You
    need to be careful because the row that is duplicated is the 6^(th) row of the
    Excel worksheet, not the 6^(th) SAS observation.


    In [Figure 9-22](#Chapter9.xhtml_ch9-fig22) the top row of the output on the Print
    preview sheet is Excel row ‘6’ from the first page of the output in [Figure 9-21](#Chapter9.xhtml_ch9-fig21).
    Admittedly, it is difficult to see on either a printed page or mobile device.


    Figure 9-22 – ROW_REPEAT= Output Second Half


    ![image](images/f0179-01.jpg)


    Be careful, because the row that is duplicated is the 6^(th) row of the Excel
    worksheet, not the 6^(th) SAS observation.


    The code in [SAS Code 9-17](#Chapter9.xhtml_ch9-pro17) duplicates a range of rows.
    The value ‘3-5’ duplicates the third, fourth, and fifth row of the Excel output
    worksheet onto the second and subsequent output pages, not SAS observations.


    SAS Code 9-17 – Code to Output Repeated Range of Row Values


    ods excel file = "&path\ROW_REPEAT_range.xlsx"


             options(SHEET_INTERVAL=''none''


                     ROW_REPEAT=''3-5'');


      proc print data=SASHELP.ORSALES(obs=63);


      run;


    ods excel close;


    Figure 9-23 – The ROW_REPEAT= Suboption Using a Range


    ![image](images/f0180-01.jpg)


    Rows 3, 4, and 5 are repeated at the top of the page after page 1.


    Figure 9-24 – ROW_REPEAT= Output Using a Range


    ![image](images/f0180-02.jpg)


    Excel observations 2, 3, and 4 appear at the top of the printout. This data is
    from the SAS data set rows 3, 4, and 5, because you include the headers in your
    count. Only part of the page is reproduced in [Figure 9-24](#Chapter9.xhtml_ch9-fig24).


    SAS Code 9-18 – Code to Output Repeated Header Row Values


    ods excel file = "&path\ROW_REPEAT_header.xlsx"


             options(SHEET_INTERVAL=''none''


                     ROW_REPEAT=''header'');


      proc print data=SASHELP.ORSALES(obs=63);


      run;


    ods excel close;'
