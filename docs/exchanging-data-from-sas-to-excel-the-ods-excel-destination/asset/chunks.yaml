    **9**    ODS TRACE OFF;


    #### SAS Output for [SAS Code 3-2](#Chapter3.xhtml_ch3-pro2)


    [Figure 3-5](#Chapter3.xhtml_ch3-fig5) shows the HTML output generated by PROC
    UNIVARIATE where Region equals “Asia”, Product equals “Boot”, and Variable equals
    “Stores” from the SASHELP.SHOES data set.


    Figure 3-5 – PROC UNIVARIATE Output


    ![image](images/f0018-01.jpg)


    Each table of the output in the Results window is one of the ODS output objects
    generated by PROC UNIVARIATE. The tables are shown in the SAS log in the order
    in which they are generated. Two of the ODS output objects, “Moments” and “Quantiles”
    that were identified in [SAS Code 3-2](#Chapter3.xhtml_ch3-pro2), will be used
