  raw: 'This chapter will discuss the ODS Excel destination suboptions that affect
    output at the level of the whole workbook. Some of these suboptions affect the
    color, size, position, spacing, and visibility of the output data in the Excel
    workbook. The manipulation of headers, titles, footers, footnotes, spacing, and
    print order are often things that the creator of the workbook must do after the
    completion of the SAS program to build the workbook. These features of the ODS
    Excel destination allow these tasks to be accomplished as the Excel workbook is
    being created. By being able to create the workbook with these features installed
    you can deliver a workbook that has not been modified.


    ### ODS Excel Destination Actions


    In this chapter we will discuss the following SAS ODS EXCEL destination topics.


    Table 8-1 – ODS Excel Destination Actions


    | **Action Parameter** | **Options** | **Description** |


    | --- | --- | --- |


    | BLACKANDWHITE | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses change
    the print mode to black and white printing only, negative responses allow color
    printing. |


    | CENTER_HORIZONTAL | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses
    center the worksheet horizontally on the printed page, negative responses do not
    horizontally center the printed output. |


    | CENTER_VERTICAL | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses
    center the worksheet vertically on the printed page, negative responses do not
    vertically center the printed output. |


    | DRAFTQUALITY | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses for
    this option will cause the output to be printed in “DRAFT” quality mode. However,
    graphs will not be printed when this option is in effect. |


    | ORIENTATION | ‘PORTRAIT’, ‘LANDSCAPE’,Default= ‘PORTRAIT’ | This option aligns
    the printed output as either PORTRAIT or LANDSCAPE on the printed page. |


    | PAGE_ORDER_ACROSS | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | This option controls
    what order the information in the spreadsheet is printed. Positive responses cause
    the data to be printed across the page first, and then down the page. Negative
    responses cause the printing to be down the page first then across the page. |


    | PRINT_AREA | ‘ITEM’, Default= NONE | This option enables you to define an output
    print area that is a subset of the values (cells) of the spreadsheet. ‘ITEM’ is
    a quoted string of values that represent the top left cell and the bottom right
    cell of the spreadsheet to be printed. An example would be ‘b,4,f,10’. |


    | PRINT_FOOTER | ‘text-string’ | This text string will be placed in the footer
    when printing, unless a footnote is active. This does not override the FOOTNOTE
    statement. |


    | PRINT_FOOTER_MARGIN | ‘number’,Default=0.5 inches | This option specifies the
    amount of the footer margin, and is set in the Excel page setup window. The units
    specified are in inches. |


    | PRINT_HEADER | ‘text-string’ | This text string will be placed in the header
    when printing, unless a title is active. This does not override the TITLE statement.
    |


    | PRINT_HEADER_MARGIN | ‘number’, Default= 0.5 inches | This option specifies
    the amount of the header margin, and is set in the Excel page setup window. The
    units specified are in inches. |


    | ROWBREAKS_COUNT | ‘number’ | This option specifies that a page break will be
    inserted after the number of data lines specified are printed. |


    | ROWBREAKS_INTERVAL | ‘OUTPUT’, ‘PROC’, ‘NONE’Default=‘NONE’ | This option controls
    the placement of page breaks. ●   ‘OUTPUT’ puts a page break between each output
    object.●   ‘PROC’ puts a page break between each procedure output.●   ‘NONE’ does
    not insert custom page breaks. |


    | ROWCOLHEADINGS | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘OFF’ | Positive responses indicate
    that row and column headings should be printed. Negative responses indicate that
    row and column headings should not be printed. |


    | SCALE | ‘number’, Default= 100 | This option controls the scaling of the output
    printout. |


    | TITLE_FOOTNOTE_NOBREAK | ‘OFF’, ‘ON’,‘YES’, ‘NO’Default=‘NO’ | This option controls
    whether the titles and footnotes wrap across lines. Positive responses suppress
    wrapping, while negative responses allow wrapping. Think “Yes, we have no bananas
    today.” |


    | TITLE_FOOTNOTE_WIDTH | ‘number’,Default=‘0’ | This option specifies the number
    of columns that the titles and footnotes span. If the value is ‘0’ (zero), then
    the titles and footnotes span across all columns that are in use in the spreadsheet.
    |


    ### The BLACKANDWHITE= Option


    This ODS Excel option enables you to force the print output to be in “Black and
    White” only. This is useful if your printer does not print color images. Sometimes
    the color tones fade to all the same color if printed on a black and white printer.
    Hopefully this will help smooth them out. I did not show the default here, which
    is ‘OFF’.


    SAS Code 8-1 – The BLACKANDWHITE= Option Turned ‘ON’


    ods excel file = "&path\Black_and_white_printing.xlsx"


              options(BLACKANDWHITE=''ON'');


        **proc print** data=Asia_only;


       **run**;


    ods excel close;


    Figure 8-1 – The BLACKANDWHITE= Option Set to ‘ON’


    ![image](images/f0112-01.jpg)


    Under the “Print” section the check box for Black and White is selected.


    ### The CENTER_HORIZONTAL= Option


    This option sets the Excel ‘Page Setup’ indicator ‘Center on Page – Horizontally’
    to active when the option = ‘ON’. The result is that the output data is either
    centered between the left and right sides of the output page or is it not centered.
    ‘ON’ centers the output data. [Figure 8-2](#Chapter8.xhtml_ch8-fig2) shows the
    option turned off. The print images in [Figure 8-3](#Chapter8.xhtml_ch8-fig3)
    and [Figure 8-5](#Chapter8.xhtml_ch8-fig5) were executed in ‘Portrait’ mode, but
    cut short to conserve space.


    SAS Code 8-2 – The CENTER_HORIZONTAL= Options OFF and ON


    ods excel (id=1) file = "&path\CENTER_HORIZONTAL_printing_off.xlsx"


              options(CENTER_HORIZONTAL=''OFF'');


    ods excel (id=2) file = "&path\CENTER_HORIZONTAL_printing_on.xlsx"


              options(CENTER_HORIZONTAL=''ON'');


         proc print data=Asia_only;


       run;


    ods excel (id=1) close;


    ods excel (id=2) close;


    Figure 8-2 – CENTER_HORIZONTALLY=‘OFF’ Page Setup Sheet


    ![image](images/f0113-01.jpg)


    In the ‘Center on page’ area the check box for ‘Horizontally’ is not checked.
    And the margin image shows the output left-justified.


    Figure 8-3 – Printed Output That is Not Centered


    ![image](images/f0114-01.jpg)


    This is the default output style printed in portrait mode with the page shortened
    to conserve space.


    Figure 8-4 – CENTER_HORIZONTAL=‘ON’ Excel Settings


    ![image](images/f0115-01.jpg)


    In the ‘Center on page’ area the check box for ‘Horizontally’ is checked. And
    the margin image shows the output centered.


    Figure 8-5 – Centered Output from the CENTER_HORIZONTAL=‘ON’ Option


    ![image](images/f0116-01.jpg)


    This page was printed in portrait mode but the page was shortened to conserve
    space.


    ### The CENTER_VERTICAL= Option


    This option sets the Excel ‘Page Setup’ indicator ‘Center on Page –Vertically’
    to active when the option = ‘ON’. The result is that the output data is either
    centered between the top and bottom edges of the output page or is it not centered.
    ‘ON’ centers the output data. [Figure 8-6](#Chapter8.xhtml_ch8-fig6) shows the
    option turned off. The print images for CENTER_VERTICAL=‘OFF’ are the same as
    in [Figure 8-2](#Chapter8.xhtml_ch8-fig2) and [Figure 8-3](#Chapter8.xhtml_ch8-fig3)
    and are not repeated here.


    SAS Code 8-3 – The CENTER_VERTICAL= Options OFF and ON


    ods excel (id=1) file = "&path\CENTER_VERTICAL_printing_off.xlsx"


              options(CENTER_VERTICAL=''OFF'');


    ods excel (id=2) file = "&path\CENTER_VERTICAL_printing_on.xlsx"


              options(CENTER_VERTICAL=''ON'');


       proc print data=Asia_only;


       run;


    ods excel (id=1) close;


    ods excel (id=2) close;


    Figure 8-6 – CENTER_HORIZONTAL=‘ON’ Excel Settings


    ![image](images/f0117-01.jpg)'
