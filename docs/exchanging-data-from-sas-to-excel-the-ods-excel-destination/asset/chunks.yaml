    9.4M4 允许对“列”值使用字母字符，如 ‘D4’。 |


    ### ABSOLUTE_COLUMN_WIDTH= 子选项


    通常，您会发现某些数据是您或您的老板希望在一个单元格中查看的，例如产品描述。但如果库存计数或箱号（在同一列还是不同列中？）只有几个字符长，您可能也想限制该列的大小。大多数
    Excel 输出文件的列数据具有可变宽度。虽然 Excel 在将数据读入工作表时时调整列宽方面做得不错，但它通常会根据第一行（变量标题或列名）或只有 Excel
    知的其他公式来截断或填充宽度。


    `ABSOLUTE_COLUMN_WIDTH=` 选项允许您根据需要调整列的宽度。这使您能够控制输出的另一个部分，使其符合您的要求。图 9-1 显示了输出。


    ```markdown

    ABSOLUTE_COLUMN_WIDTH=

    ```


