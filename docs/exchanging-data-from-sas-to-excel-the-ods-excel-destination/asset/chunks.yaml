- fmt: "\n| ABSOLUTE_COLUMN_WIDTH | `'number-list'` or `'NONE’` Default = `'NONE’`\
    \ | This option enables you to specify the width of columns of the output spreadsheet\
    \ by providing a quoted string of numbers separated by commas, or the quoted string\
