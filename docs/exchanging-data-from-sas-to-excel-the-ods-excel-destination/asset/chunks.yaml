    [The BLANK_SHEET= Option](#Chapter5.xhtml__Toc490064831)


    [The CONTENTS= Option](#Chapter5.xhtml__Toc490064832)


    [The INDEX= Option](#Chapter5.xhtml__Toc490064833)


    [The MSG_LEVEL= Option](#Chapter5.xhtml__Toc490064834)


    [The TAB_COLOR= Option](#Chapter5.xhtml__Toc490064835)


    [The ZOOM= Option](#Chapter5.xhtml__Toc490064836)


    [Conclusion](#Chapter5.xhtml__Toc490064837)


    ### Introduction


    This chapter will discuss the ODS EXCEL ID= option and some suboptions that affect
    output at the level of the whole workbook. In [Chapter 2](#Chapter2.xhtml), the
    SASHELP.SHOES data was filtered with the WHERE clause to only include data from
    the “ASIA” region. This was done to enable display of the data on one screen image.
    Unless otherwise noted, all of the examples in this and the following chapters
    will be using the following data set called “ASIA_ONLY” that was shown in [Chapter
    2](#Chapter2.xhtml).


    Options and suboptions discussed in this chapter affect creating multiple output
    worksheets placing blank sheets into a workbook, setting up a Table of Contents
    or Index for the workbook with hyperlinks, suppressing messages, changing the
    tab colors, and messages and zoom level of the worksheets. Most programmers or
    people who work with Excel workbooks take these actions after the file is already
    created. This chapter shows you how to provide these features before you give
    the workbook to someone for review. These features can be a real time saver.


    ### ODS Excel Destination Actions


    In this chapter we will discuss the following SAS ODS Excel destination topics.
    If the SAS code shows the topic within the syntax “OPTIONS= (topic)”, then the
    topic is a “SUBOPTION” of the SAS ODS Excel destination.


    Table 5-1–ODS Excel Destination Actions


    | **Action Parameter** | **Options** | **Description** |


    | --- | --- | --- |


    | FILE | ‘file-specification’ | This option defines the output file location of
    the Excel workbook to be created. This can be any valid file specification for
    the system that you are using. This ODS destination only creates files formatted
    as *.xlsx Excel workbooks. |


    | ID | ‘numeric-positive-integer’,or a series of characters that begin with a
    letter or underscore that can contain letters, numbers, and underscores | This
    option allows the creation of multiple instances of the same destination at the
    same time, each can have different options. The identifier will specify another
    instance of a destination that is already open, and the ID= option must directly
    follow the destination name. It is also possible to omit the ID= by using a name
    or number to identify the instance. |


    | BLANK_SHEET | ‘string’, Default = NONE | A blank worksheet is created in the
    workbook and the value of the ‘string’ is used as the name of the worksheet. Excel
    permits a tab label to be 32 characters, but the string that you provide cannot
    be longer than 28 characters because SAS reserves 4 characters to ensure any generated
    tab names are unique. The name must have a length of at least one character. The
    four characters are reserved at the end of the sheet name as a worksheet counter
    used to create unique worksheet names by adding a numeric counter value as a suffix
    to the string value. |


    | CONTENTS | ‘OFF’, ‘ON’,‘YES’, ‘NO’,Default = ‘OFF’ | Positive responses to this
    option create a FIRST worksheet that contains a table of contents for the workbook.
    |


    | INDEX | ‘OFF’, ‘ON’,‘YES’, ‘NO’,Default = ‘OFF’ | Positive responses to this
    option create a FINAL/LAST worksheet that contains an index of all worksheets
    for the workbook. |


    | MSG_LEVEL | ‘string’, Default = ‘NO’ | Messages from Excel are suppressed. |


    | TAB_COLOR | ‘string’ | The string supplied identifies the color of the tab for
    the next worksheet. You can use the following methods to describe the tab color.
    For the ‘RGB’ and ‘RGBA’ color definitions the percent signs are optional.A string
    that names a valid Excel color pallet name, like ‘BLUE’.A string of 6 hexadecimal
    digits that describe a color definition, like ‘#0000ff’.A string that describes
    a RED, GREEN, BLUE set of colors, like ‘RGB(0,0,100)’A string that describes a
    RED, GREEN, BLUE set of colors with a transparency index, like ‘RGBA(0,0,100%,0.5)’
