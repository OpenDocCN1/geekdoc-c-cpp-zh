    the worksheet. |


    [*](#Chapter5.xhtml_ch5_tfn_1) [http://ebanshi.cc/questions/3207084/can-i-set-a-rgba-color-within-a-color-theme](http://ebanshi.cc/questions/3207084/can-i-set-a-rgba-color-within-a-color-theme)


    ### The FILE= Option


    The FILE= option defines the output file location of the Excel workbook to be
    created. This can be any valid file specification for the system that you are
    using. The ODS destination only creates files formatted as *.xlsx Excel workbooks.


    SAS Code 5-1 – Using the FILE= Option to Define an Output Excel Workbook


    ods excel file="&path.\Excel_output_workbook.xlsx" ;


    proc print data=asia_only;


    run;


    ods excel close;


    Figure 5-1 – A Simple Excel File Defined by the FILE= Option of the ODS Excel
    Destination.


    ![image](images/f0033-01.jpg)


    ### The ID= Option


    The ID= option enables you to create multiple instances of ODS output from the
    same SAS code. Having different ID values enables you to apply different options
    and suboptions to separate output. The ID= option can be very useful if you need
    multiple copies of the same data. If you need a working Excel spreadsheet, a printable
    Excel workbook, or a PDF for outside delivery, you can use the ID= option to produce
    these copies in one process. The ability to do this enables you to have a working
    copy to markup and verify, a production copy to ship, and a PDF copy for documentation,
    without rerunning the job. My example here produces three files, two Excel workbooks
    and a PDF file. I will discuss these files separately. In the [SAS Code 5-2](#Chapter5.xhtml_ch5-pro2)
    example I did not use the ID= option on the first ODS EXCEL statement to show
    that it is not required for the first instance, only for later ODS file definitions.


    SAS Code 5-2 – Using the ODS ID= Option to Produce Multiple Outputs


    ods excel file="&path.\ID_no_Style.xlsx" ;


    ods excel (id=harvest) style=harvest


              file="&path.\ID_harvest_Style.xlsx" ;


    ods pdf   (id=Sapphire) style=Sapphire


              file=''ID_Sapphire_Style.pdf'';


    proc print data=asia_only;


    run;


    ods excel close;


    ods excel (id=harvest)  close;


    ods pdf   (id=Sapphire) close;


    [Figure 5-2](#Chapter5.xhtml_ch5-fig2) is an output Excel workbook. This workbook
    has no updates to the output workbook, it shows only the defaults, and this is
    what SAS will normally create.


    Figure 5-2 – ODS Excel Output Using No Style or ID= Option (the defaults)


    ![image](images/f0035-01.jpg)


    The output in the next image, [Figure 5-3](#Chapter5.xhtml_ch5-fig3), was created
    using the SAS maintained STYLE called HARVEST. Notice the different colors in
    the row and column headers. The ID= option identified this file as HARVEST, during
    the opening and closing of the Excel Workbook. Any options assigned during this
    ODS FILE statement and sent to the output file at the close are unique to this
    Excel Workbook.


    Figure 5-3 – ODS Excel Output Using Harvest Style and the ID= Option


    ![image](images/f0036-01.jpg)


    The next image, [Figure 5-4](#Chapter5.xhtml_ch5-fig4), is the result of the ODS
    PDF statement. This output was generated with the SAS supported style called Sapphire.
    Once again, the ODS PDF statement defined the output options. In the ID= option
    where the ID was set to “SAPPHIRE”, the output is a PDF file.


    Figure 5-4 – ODS PDF Output Using the Sapphire Style and the ID= Option


    ![image](images/f0037-01.jpg)


    ### The BLANK_SHEET= Option


    This option produces an empty worksheet in the Excel workbook. But why would you
    want a blank worksheet? I use them for temporary scratch pads inside an Excel
    workbook. I often call VBS (Visual Basic Scripts) or VBA (Visual Basic for Applications)
    routines from my SAS code (see my *Exchanging Data Between SAS(R) and Microsoft
    Excel* [Cary, NC: SAS Institute, 2015], chaps. 12-14, for more information). These
    blank worksheets could be used by these windows or Excel routines and then deleted
    before closing the workbook. You might be able to think of other applications
    for creating a blank worksheet in an Excel workbook. The ODS command can be inserted
    into your SAS code at different places, and does not need to be the only option
    used. [SAS Code 5-3](#Chapter5.xhtml_ch5-pro3) shows how to use this option to
    insert a blank sheet after producing an output sheet with data.


    SAS Code 5-3 – Using the BLANK_SHEET= Option to Insert a Named Sheet into the
    Output Workbook


    ods excel file="&path.\Empty_Workbook.xlsx";


    proc print data=asia_only;


    run;


    ods excel options(BLANK_SHEET=''Empty Sheet'');


    ods excel close;


    Figure 5-5 – Excel Output of a Workbook with Data in One Sheet and a Blank Worksheet


    ![image](images/f0038-01.jpg)


    ### The CONTENTS= Option


    The CONTENTS= option will build a Table of Contents listing for every worksheet
    in your workbook, and it will provide a hyperlink to enable you to jump directly
    to the sheet from the Table of Contents. This makes the job of listing the contents
    and enabling access to your data much easier. In [Figure 5-6](#Chapter5.xhtml_ch5-fig6)
    below I am holding the cursor over cell A3 and the Excel options to select the
    cell or to follow the hyperlink are shown, but the cursor is not. Of course, your
    computer will show a different link path than mine. Here I am using the SASHELP.SHOES
    data set to show multiple pages. The CONTENTS= and INDEX= options produce similar
    results. The INDEX= option produces an abbreviated output.


    SAS Code 5-4–Using the CONTENTS= Option to Produce Hyperlinks to Data Pages


    ods excel file="&path.\Table_Of_Contents_Workbook.xlsx"


              options(CONTENTS=''ON'');


    proc print data=sashelp.shoes;


    by region;


    run;


    ods excel close;


    Figure 5-6 – The Table of Contents Page of an Excel Workbook


    ![image](images/f0039-01.jpg)


    ### The INDEX= Option


    The INDEX option will build a Table of Contents listing for every worksheet in
    your workbook, and it will provide a hyperlink to enable you to jump directly
    to the sheet from the Table of Contents. This makes the job of listing the contents
    and enabling access to your data much easier. In [Figure 5-7](#Chapter5.xhtml_ch5-fig7)
    below I am holding the cursor over cell A1 and the Excel options to select the
    cell or to follow the hyperlink are shown, but the cursor is not. Of course, your
    computer will show a different link path than mine. Here I am using the SASHELP.SHOES
    data set to show multiple pages. The CONTENTS= and INDEX= options produce the
    similar results, The CONTENTS= option produces an expanded “Table of Contents”
    output.


    SAS Code 5-5 – Using the INDEX= Option to Produce Hyperlinks to Data Pages


    ods excel file="&path.\INDEX_Of_Workbook.xlsx"


              options(INDEX=''ON'');


    proc print data=sashelp.shoes;


    by region;


    run;


    ods excel close;


    Figure 5-7 – The Index Page of an Excel Workbook


    ![image](images/f0040-01.jpg)


    ### The MSG_LEVEL= Option


    I had a lot of trouble with this suboption. After several emails with SAS Technical
    Support, I was told the option was to identify options from the EXCELXP Tagset
    that were deprecated in the ODS Excel destination. So I attempted to determine
    what type of responses I would get when using this option. [SAS Code 5-6](#Chapter5.xhtml_ch5-pro6)
    shows four ways that I tried to run the code with the MSG_LEVEL= suboption. Well
    I set the value to ‘NO’, ‘YES’, ‘any string’, and did not even code the suboption.
    Each time I got similar result. Shown in the [SAS Log 5-1](#Chapter5.xhtml_ch5-prol1)
    text box below.


    SAS Code 5-6 – Using the MSG_LEVEL= Option


    ods excel file="&path.\MSG_LEVEL_No_in_Workbook.xlsx"


              options(


              /* MSG_LEVEL=''NO''           */


              /* MSG_LEVEL=''YES''          */


              /* MSG_LEVEL=''any string''   */


              /* MSG_LEVEL= not even coded as an option */


                     ASCII_DOTS=''YES''


                     CURRENCY_SYMBOL=''$'');


    proc print data=asia_only;


    var sales;


    run;


     ods excel close;


    SAS Log 5-1 – Log Output from MSG_LEVEL Suboption Testing'
