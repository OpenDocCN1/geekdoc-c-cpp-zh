    can show that it does not wrap around when title_footnote_nobreak=''''yes''''";


    ods excel file = "&path\TITLE_FOOTNOTE_NOBREAK_yes.xlsx"


              options(title_footnote_nobreak=''yes''


                      embedded_titles=''yes''


                      embedded_footnotes=''yes'');


     proc print data=asia_only;


      run;


    ods excel close;


    The [SAS Code 8-18](#Chapter8.xhtml_ch8-pro18) code is set to YES for the TITLE_FOOTNOTE_NOBREAK=
    option and causes the titles and footnotes not to wrap to the next line if the
    title or footnote is too long.


    Figure 8-35 – The TITLE_FOOTNOTE_NOBREAK= Option Set to “YES”


    ![image](images/f0150-01.jpg)


    When using the ODS EXCEL TITLE_FOOTNOTE_NOBREAK= option set to NO, the titles
    and footnotes do not wrap to the next line if the title or footnote is too long.
    Also, note that the titles and footnotes are printed in different font sizes and
    have different bold options.


    ### The TITLE_FOOTNOTE_WIDTH= Option


    The TITLE_FOOTNOTE_WIDTH= option describes the number of columns that a SAS title
    or footnote can span. The default value of zero means that the titles and footnotes
    can span the same number of columns as the column data that is output. Here I
    will use long titles and footnotes to show the effects. Note that if the number
    of columns is too small the output might appear to be cutoff because the display
    space of the Excel cells are too small.


    SAS Code 8-19 – ODS Excel TITLE_FOOTNOTE_WIDTH= Option Set to the Default


    title    "This a my long title so I can show that it wraps around when title_footnote_width
    is not active.";


    footnote "This a my very long footnote (it prints in a smaller font) so I can
    show that it wraps around when title_footnote_width not active.";


    ods excel file = "&path\TITLE_FOOTNOTE_WIDTH_default.xlsx"


              options(embedded_titles=''yes''


                      embedded_footnotes=''yes'');


     proc print data=asia_only;


      run;


    ods excel close;


    Not using the TITLE_FOOTNOTE_WIDTH= option is the same as setting TITLE_FOOTNOTE_WIDTH=
    0\. This sets the title and footnote width to the number of data columns that
    are output.


    Figure 8-36 – The TITLE_FOOTNOTE_WIDTH= Option Set to the Default by Not Using
    It


    ![image](images/f0151-01.jpg)


    By not using the TITLE_FOOTNOTE_WIDTH= option or setting it to zero, the width
    is set to the number of columns of data output.


    SAS Code 8-20 – ODS Excel TITLE_FOOTNOTE_WIDTH= Option Set to 4


    title    "This a my long title so I can show how it wraps around when title_footnote_width=''''4''''";


    footnote "This a my very long footnote (it prints in a smaller font) so I can
    hwshow that it wraps around when title_footnote_width=''''4''''";


    ods excel file = "&path\TITLE_FOOTNOTE_WIDTH_4.xlsx"


              options(title_footnote_width=''4''


                      embedded_titles=''yes''


                      embedded_footnotes=''yes'');


     **proc print** data=asia_only;


      **run**;


    ods excel close;


    Note that providing a title or a footnote that is too long can cause the title
    or footnote to wrap too many times, then not all of the title or footnote will
    be visible in the space provided. You will usually need to correct this by increasing
    the size of the cell in Excel.


    Figure 8-37 – The TITLE_FOOTNOTE_WIDTH= Option Set to 4


    ![image](images/f0152-01.jpg)


    Here the TITLE_FOOTNOTE_WIDTH= value is set to “4” which causes the long titles
    and footnotes to wrap within the first four columns. This has the effect of hiding
    some of the text. But all of the text is available within the assigned title and
    footnote cells.


    SAS Code 8-21 – ODS Excel TITLE_FOOTNOTE_WIDTH= Option Set to 10


    title    "This a my long title so I can show that it does not wrap around when
    title_footnote_width=''''10''''";


    footnote "This a my very long footnote (it prints in a smaller font) so I can
    show that it does not wrap around when title_footnote_width=''''10''''";


    ods excel file = "&path\TITLE_FOOTNOTE_WIDTH_10.xlsx"


              options(title_footnote_width=''10''


                      embedded_titles=''yes''


                      embedded_footnotes=''yes'');


     **proc print** data=asia_only;


      **run**;


    ods excel close;


    This example applies a title/footnote width that is larger than the number of
    data columns printed, but if either the Title or Footnote is too long, it will
    wrap to the next line.


    Figure 8-38 – The TITLE_FOOTNOTE_WIDTH= Option Set to 10


    ![image](images/f0153-01.jpg)


    Here, with a value of 10, the titles and footnotes extend beyond the data columns.
    As you can see they will still wrap if the length of the title or footnote is
    too long.


    ### Conclusion


    This chapter has shown a lot of different ways to manipulate the output features
    of Excel from within your SAS code. While working with only the features to change
    or shift the output data, you can perform many tasks that you have been doing
    by hand, after the workbooks and spreadsheets are created. If you are doing this
    for a one-time report for a weekly meeting to give to your boss, all of this effort
    to find and use these ODS Excel destination suboptions might be over-kill. But,
    if you are producing dozens or hundreds of reports, these suboptions can be considered
    useful.


