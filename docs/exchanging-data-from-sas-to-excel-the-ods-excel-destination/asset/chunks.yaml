    \ SAS observation number. This is straightforward and generated an Excel workbook\
    \ in native format for the *.xlsx` output files.\n\n## Finding ODS Object Names\
    \ Using the ODS TRACE Statement\n\nThe next step in our process is to find a way\
    \ to identify the ODS output elements that are available to be output by ODS.\
    \ In other words, if you do not know what you have, how do you know what you want\
    \ to keep? We will use the `ODS TRACE` statement to identify output objects that\
    \ can be output. Then I will demonstrate how to use the `ODS EXCEL` actions `SHOW`,\
    \ `SELECT`, and `EXCLUDE` to finalize your output. By knowing how to show, select,\
    \ or exclude output objects, you can be selective in what your output workbooks\
    \ contain. The SAS Output Delivery System does a lot of work. The `ODS TRACE`\
    \ statement is one feature of ODS that lets you look under the covers to identify\
    \ internal objects used by the system to generate output. Information about each\
    \ object generated for ODS by procedures and the `DATA` step is exposed in the\
    \ SAS Log. This information can then be used at project development time to finalize\
    \ this selection of output data objects. The simple commands `ODS TRACE ON` and\
    \ `ODS TRACE OFF` turn this feature on and off. The code in [SAS Code 3-2](#Chapter3.xhtml_ch3-pro2)\
    \ shows how to use the `ODS TRACE` statement. Here it is turned on for only the\
    \ `UNIVARIATE` procedure. When a computer can output something about everything\
    \ it does, you can usually get more than you bargained for. In this example, I\
    \ just wanted to see the output for one procedure.\n\n## Using the ODS TRACE Statement\
    \ to Show PROC UNIVARIATE Objects\n\nWhile I am showing the `ODS TRACE`, `ODS\
    \ EXCLUDE`, `ODS SELECT`, and `ODS SHOW` statements as part of the ODS Excel destination,\
    \ they are in fact separate ODS statements in their own right. These four ODS\
    \ statements enable you to identify, choose, and verify the ODS objects that you\
    \ want to output. They are described in this chapter because they work in conjunction\
    \ with the ODS Excel Destination.\n\n### SAS Code 3-2 – A PROC UNIVARIATE Call\
    \ Showing SAS ODS Output Objects\n\n```\nODS TRACE ON;\n\nPROC UNIVARIATE  DATA=sashelp.shoes\n\
