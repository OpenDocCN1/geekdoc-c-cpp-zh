    begins at the new position. The new position is determined by specifying how far
    to offset the position from its original position. Optionally, the third argument
    of this function can be specified as SEEK_SET (beginning), SEEK_CUR (current position),
    or SEEK_END (end of file). For a text stream the offset must be either zero or
    a value returned by the ftell() function, with the original position specified
    as SEEK_SET. The fseek() function returns non-zero if an error occurs. |

    | `long ftell(FILE *stream )` | The ftell() function returns the current file
    position of the specified stream, or -1 if an error occurs. |

    | `int fgetpos(FILE *stream , fpos_t *ptr )` | The fgetpos() function records
    the current file position of the specified stream in the specified ptr pointer
    as a special fpos_t type. This function returns a non-zero value if an error occurs.
    |

