    Running i=1 j=3\n```\n```\n\n一种替代方案是避免使用 **goto** 关键字，改为在每次循环的每一次迭代中检查某个变量是否为布尔真值\
    \ (1)：\n\n- 8. 在现有变量声明中添加另一个变量，并用真值 1 初始化 int i , j , flag = 1 ;\n\n- 9. 在外层循环块的开头以及内层循环块中紧挨输出语句之前，都插入对新变量值的条件测试\
    \ if ( flag )\n\n避免创建名为 \"goto.exe\" 的程序可执行文件，因为这会与 Windows 内部的 **GOTO** 命令冲突。\n\
    \n- 10. 修改内层循环的第一行，将 goto 语句替换为将假值零赋给变量的语句 if ( i == 2 && j == 1 ) { flag = 0\
    \ ; }\n\n- 11. 删除右花括号之后现已过时的 end; 标签，然后保存、编译并再次执行程序，以查看与之前相同的结果输出\n\n```\n```\n\
    Command Prompt\nC:\\MyPrograms>gcc jump.c -o jump.exe\nC:\\MyPrograms>jump\nRunning\
    \ i=1 j=1\nRunning i=1 j=2\nRunning i=1 j=3\nC:\\MyPrograms>_\n```\n```\n\n##\
    \ 总结\n\n- **if** 关键字执行基本条件测试，以评估给定表达式的布尔值为 true 还是 false。\n- **else** 关键字可用于提供替代语句，以便在\
    \ **if** 语句将表达式评估为 false 时执行。\n- 在评估之后为程序提供可继续执行的替代方向，称为“条件分支”。\n- 由多个 **if else**\
    \ 语句执行的条件分支，通常可以通过 **switch** 语句更高效地执行。\n- 通常，**switch** 块中的每个 **case** 语句都必须以\
    \ **break** 语句终止。\n- 可选地，**switch** 块可以包含一个 **default** 语句，用于指定未找到匹配项时要执行的语句。\n\
    - **for** 关键字后面跟括号，其中指定初始化器、测试表达式和增量器，以控制循环。\n- **while** 关键字后面跟括号，其中指定测试表达式，以确定循环是否应继续。\n\
    - **while** 循环块之前必须有初始化器，并且其语句块内必须包含增量器。\n- **do** 关键字后面跟一个语句块，之后必须有一个以分号终止的 **while**\
    \ 语句。\n- **do while** 循环之前必须有初始化器，并且其语句块内必须包含增量器。\n- 与 **for** 循环和 **while** 循环不同，**do\
    \ while** 循环中的语句将始终至少执行一次。\n- **break** 关键字可用于终止循环，而 **continue** 关键字可用于跳过单次迭代。\n\
    - 循环可以嵌套，**goto** 关键字可用于退出到指定标签，尽管不建议使用它。\n\n## 6 使用函数\n\n本章演示如何将语句包含在“函数”中，以便每当\
    \ C 程序调用时执行。\n\n- 86 声明函数\n- 88 提供参数\n- 90 递归调用\n- 92 将函数放入头文件\n- 94 限制可访问性\n\
    - 96 总结\n\n添加一个 main 函数，其中声明一个整型变量\n\n```c\nint main()\n{\n    int num ;\n}\n\
    ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_88_0.png)\n\n请注意，每个函数原型都必须以分号结尾。\n\
    \n在 main 函数之后，定义自定义函数\n\n```c\nvoid first()\n{\n    printf( \"Hello from the first\
    \ function\\n\" ) ;\n}\n```\n\n```c\nint square5()\n{\n    int square = 5 * 5\
    \ ;\n    return square ;\n}\n```\n\n```c\nint cube5()\n{\n    int cube = (5 *\
    \ 5) * 5 ;\n    return cube ;\n}\n```\n\n现在，在 main 函数块中插入对自定义函数的调用\n\n```c\nfirst()\
    \ ;\nnum = square5() ;\nprintf( \"5x5= %d\\n\", num ) ;\nprintf( \"5x5x5= %d\\\
    n\", cube5() ) ;\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_88_1.png)\n\n\
    从技术上讲，自定义函数定义可以出现在 main() 函数之前——但惯例是包含原型，并将 main() 函数保留在程序代码的开头。\n\n在 main 函数块的末尾，按照该函数声明的要求返回整数零值\n\
    \n```c\nreturn 0 ;\n```\n\n保存程序文件，然后编译并执行程序，以查看自定义函数的输出\n\n![](img/d1dfb0563339ba187decb78799155b7f_88_2.png)\n\
    \n"
