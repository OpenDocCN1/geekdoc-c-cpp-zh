    \ to Integer: %d\\n\" , s3 , n3 );\n   ```\n\n4. 接下来，在函数块中，使用非标准函数将第一个整数变量值转换为包含其二进制等价的字符串并输出结果\n\
    \n   ```c\n   itoa( n1, s1, 2 );\n   printf( \"Decimal %d is Binary: %s\\n\" ,\
    \ n1 , s1 );\n   ```\n\n5. 然后，使用标准库函数将第一个整数变量值转换为包含其八进制和十六进制等价的字符串，并存储其字符长度\n\n\
    \   ```c\n   n2 = sprintf( s3, \"%o\", n1 );\n   printf( \"Decimal %d is Octal:\
    \ %s chars: %d\\n\", n1, s3, n2 );\n\n   n3 = sprintf( s3, \"%x\", n1 );\n   printf(\"\
