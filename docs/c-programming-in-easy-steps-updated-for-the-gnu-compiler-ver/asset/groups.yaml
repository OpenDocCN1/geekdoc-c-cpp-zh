    \ b x: %d\", rect.b.x);\n  printf(\"Point b y: %d\\n\", rect.b.y);\n  ```\n\n\
    - 9. 在 main 函数块的末尾，返回零整数值，如函数声明所要求\n\n  ```c\n  return 0;\n  ```\n\n- 10. 保存程序文件，然后编译并执行程序以查看存储在结构体成员中的值\n\
