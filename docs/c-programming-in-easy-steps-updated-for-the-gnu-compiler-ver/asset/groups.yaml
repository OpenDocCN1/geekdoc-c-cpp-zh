    \ 100 , sizeof(int) )。\n\n## Summary\n\n- struct 可以包含一个或多个任意数据类型的变量，称为 struct\
    \ 成员。\n- 每个 struct 成员都可以通过将成员名附加到标签名后，使用 `.` 点运算符来引用。\n- struct 的进一步实例将继承其派生自的原始结构的成员属性。\n\
