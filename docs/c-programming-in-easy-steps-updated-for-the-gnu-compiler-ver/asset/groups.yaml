    time.h 头文件中的 clock() 函数提供了另一种处理时间的方法。它返回自程序开始以来使用的处理器时间，以 clock “ticks” 表示。该函数可通过运行空循环直到达到未来的时间点来“暂停”程序的执行。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_155_0.png)\n\n- 1. 使用预处理器指令开始一个新程序，以包含标准输入/输出库函数和日期时间函数\n\
    ```c\n#include <stdio.h>\n#include <time.h>\n```\n- 2. 接下来，声明一个用于暂停程序的函数原型\n```c\n\
    void wait( int seconds );\n```\n- 3. 添加一个 main 函数，声明两个 time_t 变量和一个整数变量\n```c\n\
    int main()\n{\n    time_t go , stop ;\n    int i ;\n}\n```\n- 4. 接下来，在 main 函数块中，获取当前时间并输出一条消息\n\
    ```c\ngo = time( NULL );\nprintf ( \"\\nStarting countdown...\\n\\n\" );\n```\n\
    - 5. 添加一个循环，在每次迭代中输出倒计时值并调用另一个函数\n```c\nfor( i = 10 ; i > -1 ; i-- )\n{\n    printf\
    \ ( \"  %d\", i );\n    wait(1);\n}\n```\n- 6. 接下来，在 main 函数块中再次获取当前时间，然后输出运行循环所花费的时间\n\
    ```\nstop = time( NULL );\nprintf(\"\\nRuntime: %.0f seconds\\n\" , difftime(\
    \ stop, go ) );\n```\n- 7. 最后，在 main 函数块中，返回零整数值，如函数声明所要求\n```\nreturn 0 ;\n```\n\
    - 8. 在 main 函数块之后，开始函数定义，通过在当前经过的运行时间之外的未来点初始化一个 clock_t 变量\n```\nvoid wait( int\
    \ seconds )\n{\n    clock_t end_wait =\n        ( clock() ) + ( seconds * CLOCKS_PER_SEC\
    \ );\n}\n```\n- 9. 最后，在 wait 函数块中，添加一个空循环，当当前时间达到未来点时终止，将控制权返回到 main 函数中的循环\n\
    ```\nwhile ( clock() < end_wait ) { }\n```\n- 10. 保存程序文件，然后编译并执行程序以查看倒计时器和运行时间\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_156_0.png)\n\n每秒的时钟滴答数取决于实现，但在 time.h\
    \ 中由 CLOCKS_PER_SEC 常量定义。\n\n![](img/d1dfb0563339ba187decb78799155b7f_156_1.png)\n\
    \n你可以通过将 clock() 函数返回的值除以 CLOCKS_PER_SEC 值来得到以秒表示的经过运行时间。\n\n![](img/d1dfb0563339ba187decb78799155b7f_156_2.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_156_3.png)\n\n- 3. 在 main 函数块中，首先使用当前经过的秒数值对随机数生成器进行种子设置\n\
    ```c\nsrand( time(NULL) );\n```\n- 4. 接下来，按顺序用数字 0-59 填充一个数组\n```c\nfor( i = 0\
    \ ; i < 60 ; i++ ) { nums[i] = i ; }\n```\n- 5. 现在，将序列洗牌为随机顺序\n```c\nfor( i =\
    \ 1 ; i < 60 ; i++ )\n{\n r = ( rand() % 59 ) + 1 ;\n temp = nums[i] ; nums[i]=nums[r]\
    \ ; nums[r] = temp ;\n}\n```\n- 6. 将六个数组元素中的数字添加到一个字符串中\n```c\nfor( i = 1 ; i\
    \ < 7 ; i++ )\n{\n sprintf( buf , \"%d \" , nums[i] ) ;\n strcat( buf , \" \"\
    \ ) ; strcat( str , buf ) ;\n}\n```\n- 7. 然后，输出该字符串\n```c\nprintf( \"\\n%6s\\\
    n\\n\" , str ) ;\n```\n- 8. 在 main 函数块结束时，返回零整数值，如函数声明所要求\n```c\nreturn 0 ;\n\
    ```\n- 9. 保存程序文件，然后反复编译并执行程序，以在每次执行时看到 1-59 范围内的六个不同随机数的选择\n\n**不要忘记**\n数组元素 nums[0]\
    \ 被赋值为零，但这不包含在洗牌中，因为只有元素 1-59 才有资格被选择。\n\n**热提示**\n注意这里是如何使用 sprintf() 函数将 int\
    \ 值转换为 char 值，然后再将其连接到更大的文本字符串。\n\n![](img/d1dfb0563339ba187decb78799155b7f_158_0.png)\n\
    \n## 显示对话框\n\n![](img/d1dfb0563339ba187decb78799155b7f_159_0.png)\n\n请注意，WinMain()\
    \ 函数在完成时需要返回一个整数，就像通常的 main() 函数一样。\n\n在 Windows 操作系统中，C 程序可以通过 Windows 应用程序编程接口（WINAPI）提供的特殊函数轻松生成图形组件。这是通过添加编译器指令来包含\
    \ Windows 特定的 windows.h 头文件而使程序可用的。\n\n在 Windows 的 C 程序中，通常的 main() 函数程序入口点被这个特殊的\
    \ WinMain() 函数取代：\n\n```\nint WINAPI WinMain( HINSTANCE hInstance,\n    HINSTANCE\
    \ hPrevInstance, LPSTR lpCmdLine, int nCmdShow )\n```\n\n这些参数始终是必需的，以便程序与操作系统通信。hInstance\
    \ 参数是对程序的“句柄”引用；并且 hPrevInstance 参数在早期的 Windows 编程中使用，如今可以安全地忽略。lpCmdLine 参数是一个字符串，表示用于编译应用程序的命令行上使用的所有项，而\
    \ nCmdShow 参数控制窗口的显示方式。\n\n在 Windows 中创建的最简单的图形组件是仅带一个“OK”按钮的基本对话框。这是通过调用此 MessageBox()\
    \ 函数创建的：\n\n```\nint MessageBox( HWND hWnd, LPCTSTR lpText,\n    LPCTSTR lpCaption,\
    \ UINT uType );\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_159_1.png)\n\n\
    其他 MessageBox 图标常量包括 MB_ICONERROR、MB_ICONQUESTION 和 MB_ICONINFORMATION。\n\nhWnd\
    \ 参数是对父窗口（如果有）的“句柄”引用——如果没有父窗口，则此值指定为 NULL。lpText 参数是要显示的消息字符串，而 lpCaption 参数是要在对话框上显示的标题。最后，uType\
    \ 参数可以使用管道分隔列表中的特殊常量值指定图标和按钮。例如，常量 MB_OK 添加一个 OK 按钮，并且可以使用常量 MB_ICONEXCLAMATION\
    \ 添加一个感叹号图标。\n\n编译后，创建对话框的 C 程序可以像往常一样从命令行运行。此外，它可以通过在其可执行文件图标上双击来运行——但这将同时打开命令提示符窗口和对话框。但是\
    \ GNU C 编译器有一个特殊的 -mwindows 选项，可以在编译命令的最后添加，以在通过双击运行程序时抑制命令提示符窗口。\n"
