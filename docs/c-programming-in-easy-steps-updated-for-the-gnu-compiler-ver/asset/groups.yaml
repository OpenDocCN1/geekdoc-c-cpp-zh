  md: "\n## Joining strings\n\nThe combining of two strings into one single string\
    \ is more precisely known as string “concatenation”.\n\nThe standard C library\
    \ string.h header file contains two functions that can be used to concatenate\
    \ strings. To make these available to a program the string.h header file must\
    \ be added with an #include directive at the start of the program.\n\nThe first\
    \ string concatenation function is strcat(), which requires two arguments to be\
    \ specified stating the names of the two strings to concatenate. The string named\
    \ as its second argument is appended after the string named as its first argument,\
    \ then the function returns the entire concatenated first string. So, the function's\
    \ syntax looks like this:\n\n```\nstrcat( first-string , string-to-add-to-first-string\
    \ ) ;\n```\n\nIt is important to note that the first string array must be large\
    \ enough to accommodate all the characters of the concatenated strings to avoid\
    \ an error.\n\nThe second string-concatenation function is the similarly named\
    \ strncat() function (with an added “n”). This is used like the strcat() function\
    \ but takes a third argument to specify how many characters of the second string\
    \ should be appended onto the first string. Its syntax therefore looks like this:\n\
    \n```\nstrncat( first-string , string-to-add-to-first-string , length ) ;\n```\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_115_0.png)\n\nThese functions change\
    \ the original string length as they add characters.\n\nThe string being appended\
    \ will begin with the first character of the string specified by the second argument\
    \ by default, and end at the position specified by the third argument. But as\
    \ the name of the string is an implied pointer to its first character, pointer\
    \ arithmetic can be used to indicate a different position at which to begin appending,\
    \ with this syntax:\n\n```\nstrncat( first-string , (string-to-add-to-first-string+places)\
    \ , length ) ;\n```\n\nOnce again, as with the strcat() function, it is important\
    \ that the first string array must be large enough to accommodate all the characters\
    \ of the concatenated strings to avoid an error when using the strncat() function.\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output and string functions\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
    ```\n\n- 2. Add a main function that declares and initializes four character array\
    \ variables with strings\n\n```c\nint main()\n{\n  char s1[100];\n  char s2[];\n\
    \  char s3[100];\n  char s4[];\n}\n```\n\n- 3. Next, in the main function block,\
    \ append the second string onto the first and output the concatenated string\n\
    \n```c\nstrcat( s1, s2 );\n```\n\n- 4. Append the first 17 characters of the fourth\
    \ string onto the third and output the concatenated string\n\n```c\nstrncat( s3,\
    \ s4, 17 );\n```\n\n- 5. Append the last 14 characters of the fourth string onto\
    \ the third and output the concatenated string\n\n```c\nstrncat( s3, ( s4 + 17\
    \ ), 14 );\n```\n\n- 6. At the end of the main function block, return a zero integer\
    \ value, as required by the function declaration\n\n```c\nreturn 0;\n```\n\n-\
    \ 7. Save the program file, then compile and execute the program to see the concatenated\
    \ strings\n\n![](img/d1dfb0563339ba187decb78799155b7f_116_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_116_1.png)\n\
    \nThe string being lengthened must have an array size large enough to accommodate\
    \ all characters of the combined strings.\n\n![](img/d1dfb0563339ba187decb78799155b7f_116_2.png)\n\
    \n## Finding substrings\n\nA string can be searched to determine if it contains\
    \ a specified “substring” sequence of characters with a function named strstr().\
    \ This is part of the standard library string.h header file, which must be added\
    \ with an #include directive at the start of the program to make strstr() available.\n\
    \nThe strstr() function takes two arguments – the first specifies the string to\
    \ be searched, and the second specifies the substring to seek. If the substring\
    \ is not found, the function returns a NULL value. When the substring is found,\
    \ the function returns a pointer to the first character of the first occurrence\
    \ of the substring.\n\nThe array index number of the element containing the first\
    \ character of a located substring can be easily calculated using pointer arithmetic.\
    \ Subtracting the address of the first character of the substring, returned by\
    \ the strstr() function, from the address of the searched string’s first character\
    \ (to which the character array name points) can produce an integer value that\
    \ is the index number of the first substring character within the searched string.\n\
    \nIn C programming, the == and != comparison operators can be used to compare\
    \ a result against a NULL value but cannot be used to compare two strings. Instead,\
    \ the string.h standard library header file provides a function named strcmp()\
    \ for that purpose. This function takes two arguments that are the strings to\
    \ be compared. The comparison is made upon the numerical ASCII code value of each\
    \ character and their position. When the strings are identical in every respect,\
    \ including matching case, the strcmp() function returns zero. Otherwise, the\
    \ function returns a positive or negative integer depending on the string values.\n\
    \nThe strstr() function stops searching when it finds the first occurrence of\
    \ a substring. Subsequent occurrences of that substring within the searched string\
    \ will not be recognized.\n\n![](img/d1dfb0563339ba187decb78799155b7f_117_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_117_1.png)\n\n- 1. Begin a new program\
    \ with a preprocessor instruction to include the standard input/output and string\
    \ functions\n\n```c\n#include <stdio.h>\n#include <string.h>\n```\n\n- 2. Add\
    \ a main function that declares and initializes two character array variables\
    \ with strings\n\n```c\nint main()\n{\n  char str[] = \"No Time Like the Present.\"\
    ;\n  char sub[] = \"Time\";\n}\n```\n\n- 3. Next, in the main function block,\
    \ output a message if the second string value cannot be found in the first string\n\
    \n```c\nif( strstr( str, sub ) == NULL )\n{\n    printf( \"Substring \\\"Time\\\
    \" Not Found\\n\" ) ;\n}\n```\n\nNotice that the \\ character in this example\
    \ is used to escape the double-quote characters - to avoid premature termination\
    \ of the output strings.\n\n- 4. Now, add statements to output the memory address\
    \ and element index number within the first string at which the first character\
    \ of the located substring occurs\n\n```c\nelse\n{\n    printf( \"Substring \\\
    \"Time\\\" Found at %p\\n\" , strstr( str, sub) ) ;\n    printf( \"Element Index\
    \ Number %d\\n\\n\" , strstr(str,sub) - str ) ;\n}\n```\n\n- 5. Output the result\
    \ of three comparisons made against the value of the second string\n\n```c\nprintf(\"\
    %s Versus \\\"Time\\\": %d\\n\",sub, strcmp(sub,\"Time\"));\nprintf(\"%s Versus\
    \ \\\"time\\\": %d\\n\",sub, strcmp(sub,\"time\"));\nprintf(\"%s Versus \\\"TIME\\\
    \": %d\\n\",sub, strcmp(sub,\"TIME\"));\n```\n\n- 6. At the end of the main function\
    \ block, return a zero integer value, as required by the function declaration\n\
    \n```c\nreturn 0 ;\n```\n\n- 7. Save the program file, then compile and execute\
    \ the program to see the result of searching for a substring and the comparison\
    \ of three string values\n\n![](img/d1dfb0563339ba187decb78799155b7f_118_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_118_2.png)\n\nThe string.h header file\
    \ also contains two character-searching functions: strchr() finds the first occurrence\
    \ of a character in a string, and strrchr() finds the last occurrence – both return\
    \ NULL if the character is not found.\n\n## Validating strings\n\nThe standard\
    \ library header file named `ctype.h` contains a number of functions that are\
    \ useful to perform tests on characters. To make these available to a program,\
    \ the `ctype.h` header file must be added with an `#include` directive at the\
    \ start of the program.\n\nWithin the `ctype.h` header file, the `isalpha()` function\
    \ tests whether a character is alphabetical, whereas `isdigit()` tests whether\
    \ a character is numerical. Similarly, the `ispunct()` function tests whether\
    \ a character is any other printable symbol, whereas the `isspace()` function\
    \ tests whether a “character” is in fact a space.\n\nAdditionally, the `ctype.h`\
    \ header provides `isupper()` and `islower()` functions to test the character\
    \ case, along with `toupper()` and `tolower()` functions to change the character\
    \ case.\n\nEach test function returns a non-zero value (not necessarily a 1) when\
    \ the tested character is as expected, but always returns a zero if it is not\
    \ as expected.\n\nThese testing functions can be used to validate user string\
    \ input by looping through characters in the string to examine each in turn. Where\
    \ a character does not meet a required condition, a “flag” variable can be set\
    \ to advise the user that the entry is invalid.\n\n![](img/d1dfb0563339ba187decb78799155b7f_119_0.png)\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output and string functions\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
    ```\n\n- 2. Add a main function that declares three variables, initializing a\
    \ flag variable with a numeric true value (1)\n\n```c\nint main()\n{\n    char\
    \ str[7] ;\n    int i ;\n    int flag = 1 ;\n}\n```\n\n- 3. Next, in the main\
    \ function, request user input then assign that input as a string to the array\
    \ variable\n\n```c\nputs( \"Enter six digits without any spaces...\" );\ngets(\
    \ str );\n```\n"
  mdcn: "\n## 连接字符串\n\n将两个字符串合并成一个字符串，更准确的说法是字符串“拼接”。\n\n标准 C 库的 string.h 头文件包含两个可用于拼接字符串的函数。要在程序中使用这些函数，必须在程序开头用\
    \ #include 指令添加 string.h 头文件。\n\n第一个字符串拼接函数是 strcat()，它要求指定两个参数，分别说明要拼接的两个字符串的名称。作为第二个参数指定的字符串会被追加到作为第一个参数指定的字符串之后，然后该函数返回拼接后的完整第一个字符串。因此，该函数的语法如下所示：\n\
    \n```\nstrcat( first-string , string-to-add-to-first-string ) ;\n```\n\n需要注意的是，第一个字符串数组必须足够大，以容纳拼接后字符串的所有字符，从而避免出错。\n\
    \n第二个字符串拼接函数是名称相似的 strncat() 函数（多了一个“n”）。它的用法与 strcat() 函数类似，但接受第三个参数，用于指定应将第二个字符串的多少个字符追加到第一个字符串上。因此，它的语法如下所示：\n\
    \n```\nstrncat( first-string , string-to-add-to-first-string , length ) ;\n```\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_115_0.png)\n\n这些函数在添加字符时会改变原字符串的长度。\n\
    \n默认情况下，被追加的字符串将从第二个参数所指定字符串的第一个字符开始，并在第三个参数指定的位置结束。但由于字符串名是指向其第一个字符的隐含指针，因此可以使用指针运算来指定开始追加的不同位置，语法如下：\n\
    \n```\nstrncat( first-string , (string-to-add-to-first-string+places) , length\
    \ ) ;\n```\n\n同样，与 strcat() 函数一样，使用 strncat() 函数时，第一个字符串数组必须足够大，以容纳拼接后字符串的所有字符，从而避免出错。\n\
    \n- 1. 使用预处理指令开始一个新程序，以包含标准输入/输出函数和字符串函数\n\n```c\n#include <stdio.h>\n#include\
    \ <string.h>\n```\n\n- 2. 添加一个 main 函数，声明并初始化四个字符数组变量，并用字符串赋值\n\n```c\nint main()\n\
    {\n  char s1[100];\n  char s2[];\n  char s3[100];\n  char s4[];\n}\n```\n\n- 3.\
    \ 接下来，在 main 函数块中，将第二个字符串追加到第一个字符串上，并输出拼接后的字符串\n\n```c\nstrcat( s1, s2 );\n```\n\
    \n- 4. 将第四个字符串的前 17 个字符追加到第三个字符串上，并输出拼接后的字符串\n\n```c\nstrncat( s3, s4, 17 );\n\
    ```\n\n- 5. 将第四个字符串的最后 14 个字符追加到第三个字符串上，并输出拼接后的字符串\n\n```c\nstrncat( s3, ( s4\
    \ + 17 ), 14 );\n```\n\n- 6. 在 main 函数块末尾，按照函数声明的要求返回整数值零\n\n```c\nreturn 0;\n\
    ```\n\n- 7. 保存程序文件，然后编译并执行程序，以查看拼接后的字符串\n\n![](img/d1dfb0563339ba187decb78799155b7f_116_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_116_1.png)\n\n被加长的字符串必须具有足够大的数组大小，以容纳合并后字符串的所有字符。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_116_2.png)\n\n## 查找子字符串\n\n可以使用名为 strstr()\
    \ 的函数搜索字符串，以确定它是否包含指定的“子字符串”字符序列。该函数是标准库 string.h 头文件的一部分，必须在程序开头用 #include 指令添加该头文件，才能使用\
    \ strstr()。\n\nstrstr() 函数接受两个参数——第一个参数指定要搜索的字符串，第二个参数指定要查找的子字符串。如果未找到该子字符串，函数返回\
    \ NULL 值。找到该子字符串时，函数返回一个指针，指向该子字符串第一次出现处的第一个字符。\n\n通过指针运算可以轻松计算包含已定位子字符串第一个字符的元素的数组索引号。用被搜索字符串第一个字符的地址（字符数组名所指向的地址）减去\
    \ strstr() 函数返回的子字符串第一个字符的地址，可以得到一个整数值，即该子字符串第一个字符在被搜索字符串中的索引号。\n\n在 C 编程中，==\
    \ 和 != 比较运算符可用于将结果与 NULL 值进行比较，但不能用于比较两个字符串。为此，string.h 标准库头文件提供了一个名为 strcmp()\
    \ 的函数。该函数接受两个参数，即要比较的字符串。比较依据是每个字符的 ASCII 码数值及其位置。当两个字符串在每个方面都相同（包括大小写匹配）时，strcmp()\
    \ 函数返回零。否则，该函数会根据字符串值返回一个正整数或负整数。\n\nstrstr() 函数在找到子字符串的第一次出现时就会停止搜索。该子字符串在被搜索字符串中的后续出现将不会被识别。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_117_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_117_1.png)\n\
    \n- 1. 使用预处理指令开始一个新程序，以包含标准输入/输出函数和字符串函数\n\n```c\n#include <stdio.h>\n#include\
    \ <string.h>\n```\n\n- 2. 添加一个 main 函数，声明并初始化两个字符数组变量，并用字符串赋值\n\n```c\nint main()\n\
    {\n  char str[] = \"No Time Like the Present.\";\n  char sub[] = \"Time\";\n}\n\
    ```\n\n- 3. 接下来，在 main 函数块中，如果无法在第一个字符串中找到第二个字符串值，则输出一条消息\n\n```c\nif( strstr(\
    \ str, sub ) == NULL )\n{\n    printf( \"Substring \\\"Time\\\" Not Found\\n\"\
    \ ) ;\n}\n```\n\n请注意，此示例中的 \\ 字符用于转义双引号字符——以避免输出字符串过早终止。\n\n- 4. 现在，添加语句以输出已定位子字符串的第一个字符在第一个字符串中出现的内存地址和元素索引号\n\
    \n```c\nelse\n{\n    printf( \"Substring \\\"Time\\\" Found at %p\\n\" , strstr(\
    \ str, sub) ) ;\n    printf( \"Element Index Number %d\\n\\n\" , strstr(str,sub)\
    \ - str ) ;\n}\n```\n\n- 5. 输出针对第二个字符串值进行的三次比较的结果\n\n```c\nprintf(\"%s Versus\
    \ \\\"Time\\\": %d\\n\",sub, strcmp(sub,\"Time\"));\nprintf(\"%s Versus \\\"time\\\
    \": %d\\n\",sub, strcmp(sub,\"time\"));\nprintf(\"%s Versus \\\"TIME\\\": %d\\\
    n\",sub, strcmp(sub,\"TIME\"));\n```\n\n- 6. 在 main 函数块末尾，按照函数声明的要求返回整数值零\n\n\
    ```c\nreturn 0 ;\n```\n\n- 7. 保存程序文件，然后编译并执行程序，以查看查找子字符串以及比较三个字符串值的结果\n\n![](img/d1dfb0563339ba187decb78799155b7f_118_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_118_2.png)\n\nstring.h 头文件还包含两个字符搜索函数：strchr()\
    \ 查找字符在字符串中的第一次出现，strrchr() 查找最后一次出现——如果未找到该字符，两者都返回 NULL。\n\n## 验证字符串\n\n名为 `ctype.h`\
    \ 的标准库头文件包含许多可用于对字符执行测试的函数。要在程序中使用这些函数，必须在程序开头用 `#include` 指令添加 `ctype.h` 头文件。\n\
    \n在 `ctype.h` 头文件中，`isalpha()` 函数测试字符是否为字母字符，而 `isdigit()` 测试字符是否为数字字符。类似地，`ispunct()`\
    \ 函数测试字符是否为任何其他可打印符号，而 `isspace()` 函数测试“字符”是否实际上是空格。\n\n此外，`ctype.h` 头文件还提供 `isupper()`\
