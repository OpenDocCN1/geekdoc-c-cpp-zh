  - "[PAGE 49]\n\n# # Debugging definitions\n\nAlternatives can be offered with `#if`,\
    \ `#else` and `#elif` (else if) preprocessor directives. These allow conditional\
    \ branching to execute sections of code according to the result of an evaluation.\n\
    \nA constant initially defined by a preprocessor `#define` directive can be subsequently\
    \ undefined with an `#undef` directive. An evaluation may also be made to consider\
    \ whether a constant is undefined with an `#ifndef` (if not defined) preprocessor\
    \ directive.\n\nAll evaluations can be made in a function block, mixed with regular\
    \ C statements, and may be nested one within another. Macros of this kind are\
    \ particularly useful for debugging source code, as whole sections of the code\
    \ can be easily hidden or revealed, simply by changing the status of a **DEBUG**\
    \ macro.\n\n![](img/d1dfb0563339ba187decb78799155b7f_49_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_49_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_49_2.png)\n\nThe `==` equality operator\
    \ used in this example means “is equal to”.\n\n+   1. Begin a new program with\
    \ a preprocessor instruction to include the standard input/output library functions\
    \ `#include <stdio.h>`\n\n+   2. Add a further preprocessor directive to establish\
    \ a macro `#define DEBUG 1`\n\n+   3. Next, add a main function containing preprocessor\
    \ directives to evaluate and report the macro status\n\n```\n```c\n#if DEBUG ==\
    \ 1\n    printf(\"Debug status is 1\\n\");\n#elif DEBUG == 2\n    printf(\"Debug\
