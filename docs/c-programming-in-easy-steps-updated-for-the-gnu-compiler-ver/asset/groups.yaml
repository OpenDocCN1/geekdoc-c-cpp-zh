    \  ```\n\n- 3. 接下来，在 main 函数块中插入一个 while 循环，输出每个元素的编号及其包含的值\n  \n  ```c\n  i =\
    \ 0 ;\n  while( i < 3 )\n  {\n      printf( \"While: arr[%d] = %d\\n\" , i, arr[i]\
    \ ) ;  i++ ;\n  }\n  ```\n\n- 4. 现在，插入一个 do while 循环，同样输出每个元素的编号及其包含的值\n  \n \
    \ ```c\n  i = 0 ;\n  do\n  {\n      printf( \"\\nDo while: arr[%d] = %d\" , i,\
    \ arr[i] ) ; i++ ;\n  }\n  while( i < 3 ) ;\n  ```\n\n- 5. 在 main 函数块末尾，按照函数声明的要求返回整数值零\n\
    \  \n  ```c\n  return 0 ;\n  ```\n\n> **别忘了！**\n>\n> 将此测试表达式中的值改为零——即两个循环中都使用\
    \ `while (i<0)`——然后重新编译并再次运行程序，以看到只有 **do while** 循环的第一次迭代被执行。\n\n- 6. 保存程序文件，然后编译并执行程序，查看循环产生的看似相同的输出\n\
    \  \n  ```\n  C:\\MyPrograms>gcc dowhile.c -o dowhile.exe\n  \n  C:\\MyPrograms>dowhile\n\
    \  While: arr[0] = 10\n  While: arr[1] = 20\n  While: arr[2] = 30\n  \n  Do while:\
    \ arr[0] = 10\n  Do while: arr[1] = 20\n  Do while: arr[2] = 30\n  \n  C:\\MyPrograms>\n\
    \  ```\n\n## 跳出循环\n\nbreak 关键字可用于在满足指定条件时提前终止循环。break 语句位于循环语句块内，并且前面有一个测试表达式。当测试返回真时，循环立即结束，程序继续执行下一个任务。例如，在嵌套的内层循环中，它会继续执行外层循环的下一次迭代。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_81_0.png)\n\n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\
