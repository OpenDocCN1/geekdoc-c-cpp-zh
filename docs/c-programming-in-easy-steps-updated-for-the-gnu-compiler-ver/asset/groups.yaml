    \\nRuntime: %.0f seconds\\n\" , difftime( stop, go ) );\n```\n\n7 Finally, in\
    \ the main function block, return a zero integer value, as required by the function\
    \ declaration\n\n```\nreturn 0 ;\n```\n\n8 After the main function block, begin\
    \ the function definition by initializing a clock_t variable at a future point\
    \ beyond the current elapsed running time\n\n```\nvoid wait( int seconds )\n{\n\
    \    clock_t end_wait =\n        ( clock() ) + ( seconds * CLOCKS_PER_SEC );\n\
    }\n```\n\n9 Finally, in the wait function block, add an empty loop that terminates\
    \ when the current time reaches the future point, returning control to the loop\
    \ in the main function\n\n```\nwhile ( clock() ) < end_wait ) { }\n```\n\n10 Save\
    \ the program file, then compile and execute the program to see the countdown\
    \ timer and runtime\n\n![](img/d1dfb0563339ba187decb78799155b7f_156_0.png)\n\n\
    The number of clock ticks per second is implementation-dependent but is defined\
    \ in time.h by the CLOCKS_PER_SEC constant.\n\n![](img/d1dfb0563339ba187decb78799155b7f_156_1.png)\n\
    \nYou can find the elapsed runtime expressed in seconds by dividing the value\
    \ returned by the clock() function by the CLOCKS_PER_SEC value.\n\n![](img/d1dfb0563339ba187decb78799155b7f_156_2.png)\n\
