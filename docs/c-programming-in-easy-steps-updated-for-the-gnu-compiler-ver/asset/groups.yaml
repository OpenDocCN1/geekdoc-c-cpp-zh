  md: "\nUnless programming for a device with limited resources there is seldom a\
    \ need to utilize bitwise operators, but they can be useful. For instance, the\
    \ XOR (eXclusive OR) operator lets you exchange values between two variables without\
    \ the need for a third variable.\n\n- 1. Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n```c\n#include\
    \ <stdio.h>\n```\n- 2. Add a main function that declares and initializes two integer\
    \ variables, then outputs their initial values\n```c\nint main()\n{\n int x =\
    \ 10, y = 5;\n printf(\"\\nx=%d y=%d\\n\", x, y);\n}\n```\n- 3. Next, in the main\
    \ function block, insert an XOR statement three times to exchange the variable\
    \ values by binary bit manipulation\n```c\nx = x ^ y; /* 1010 ^ 0101 = 1111 (decimal\
    \ 15) */\ny = x ^ y; /* 1111 ^ 0101 = 1010 (decimal 10) */\nx = x ^ y; /* 1111\
    \ ^ 1010 = 0101 (decimal 5) */\n```\n- 4. Now, insert a statement to output the\
    \ exchanged values\n```c\nprintf(\"\\nx=%d y=%d\\n\", x, y);\n```\n- 5. At the\
    \ end of the main function block, return a zero integer value, as required by\
    \ the function declaration\n```c\nreturn 0;\n```\n- 6. Save the program file,\
    \ then compile and execute the program to see the XOR bitwise magic\n\n![](img/d1dfb0563339ba187decb78799155b7f_66_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_66_1.png)\n\nDo not confuse bitwise\
    \ operators with logical operators. Bitwise operators compare binary numbers whereas\
    \ logical operators evaluate Boolean values.\n\n![](img/d1dfb0563339ba187decb78799155b7f_66_2.png)\n\
    \n## Flagging bits\n\nBy far the most common use of bitwise operators is to manipulate\
    \ a compact “bit field” containing a set of Boolean “flags”. This is a much more\
    \ efficient use of memory than storing Boolean flag values in separate variables\
    \ – a char data type of just 1 byte can hold a bit field of eight flags, one per\
    \ bit, whereas eight separate char variables would require 8 whole bytes of memory.\n\
    \nThe initial bit flags can be set by assigning a decimal value to the variable\
    \ whose binary equivalent has a 1 for each bit that is to be turned “on” as a\
    \ Boolean flag. For example, decimal 8 has a binary equivalent of 1000 (1x8 0x4\
    \ 0x2 0x1) so turns on the fourth flag, reading from right to left from the least\
    \ significant bit.\n\nSubsequently, the bit flag values can be reversed using\
    \ the bitwise NOT ~ operator but care must be taken to mask zeros before the bit\
    \ flags, otherwise they will each be returned as 1. For example, to reverse a\
    \ bit field of four flags within the four right bits of a byte, the four left\
    \ bits must be masked. Decimal 15 is binary 00001111 (0x128 0x64 0x32 0x16 1x8\
    \ 1x4 1x2 1x1) and can be applied as this mask with the bitwise AND & operator.\n\
    \nThe bit flag pattern can also be manipulated by shifting those flags that are\
    \ turned on by a specified number of bits, using the bitwise Shift left << and\
    \ Shift right >> operators.\n\n![](img/d1dfb0563339ba187decb78799155b7f_67_0.png)\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n```c\n#include <stdio.h>\n```\n- 2. Add a main\
    \ function that declares a character variable initialized with a decimal value\
    \ turning on one bit flag\n```c\nint main()\n{\n int flags = 8; /* Binary 1000\
    \ (1x8 0x4 0x2 0x1) */\n}\n```\n- 3. Next, in the main function block, assign\
    \ a new value to the variable, to also turn on another flag\n```c\nflags = flags\
    \ | 2; /* 1000 | 0010 = 1010 (decimal 10) */\n```\n- 4. Now, insert statements\
    \ to output all the bit flag settings\n\n printf( \"Flag 1: %s\\n\", ( (flags\
    \ & 1) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag 2: %s\\n\", ( (flags & 2)\
    \ > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag 3: %s\\n\", ( (flags & 4) > 0 )\
    \ ? \"ON\" : \"OFF\" );\n printf( \"Flag 4: %s\\n\", ( (flags & 8) > 0 ) ? \"\
    ON\" : \"OFF\" );\n\n![](img/d1dfb0563339ba187decb78799155b7f_68_0.png)\n\n###\
    \ Hot tip\nIt's often convenient to predefine constants to represent each bit\
    \ flag. For example:\n #define FLAG1 1\n #define FLAG2 2\n #define FLAG3 4\n #define\
    \ FLAG4 8\n\n- 5. Next, insert statements to mask the first four bits of the byte,\
    \ then flip all the bit flag settings\n\n char mask = 15 ; /* Binary 00001111\
    \ */\n flags = ~flags & mask ; /* ~(1010 & 1111=1010) = 0101 */\n\n- 6. Now, insert\
    \ statements to output the reversed bit flag settings and the decimal value representing\
    \ this pattern\n\n printf( \"Flag 1: %s\\n\", ( (flags & 1) > 0 ) ? \"ON\" : \"\
    OFF\" );\n printf( \"Flag 2: %s\\n\", ( (flags & 2) > 0 ) ? \"ON\" : \"OFF\" );\n\
    \ printf( \"Flag 3: %s\\n\", ( (flags & 4) > 0 ) ? \"ON\" : \"OFF\" );\n printf(\
    \ \"Flag 4: %s\\n\", ( (flags & 8) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flags\
    \ decimal value is %d\\n\", flags );\n\n- 7. Add a statement to shift the “on”\
    \ bit flags one bit to the left then output the decimal value of the new pattern\n\
    \n flags = flags << 1 ; /* 0101 << 1 = 1010. */\n printf( \"Flags decimal value\
    \ is now %d\\n\", flags );\n\n- 8. At the end of the main function block, return\
    \ a zero integer value, as required by the function declaration\n return 0 ;\n\
    \n- 9. Save the program file, then compile and execute the program to see the\
    \ bit flag manipulation\n\n```\nCommand Prompt\nC:\\MyPrograms>gcc bitFlag.c -o\
    \ bitFlag.exe\nC:\\MyPrograms>bitFlag\nFlag 1: OFF\nFlag 2: ON\nFlag 3: OFF\n\
    Flag 4: ON\n\nFlag 1: ON\nFlag 2: OFF\nFlag 3: ON\nFlag 4: OFF\n\nFlags decimal\
    \ value is 5\nFlags decimal value is now 10\n\nC:\\MyPrograms>_\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_68_1.png)\n\
    \n### Don't forget\nLarger bit fields with more bit flags can be created using\
    \ a variable with more memory – an int data type of 4 bytes has 32 bits.\n\n##\
    \ Understanding precedence\n\nOperator precedence defines the order in which C\
    \ evaluates expressions. For instance, in the expression `a=6+b*3` the order of\
    \ precedence determines whether the addition or the multiplication is completed\
    \ first.\n\n![](img/d1dfb0563339ba187decb78799155b7f_69_0.png)\n\nThe `*` multiply\
    \ operator is on a higher row than the `+` addition operator – so in the expression\
    \ `a=6+b*3` the multiplication gets completed before the addition operation.\n\
    \nThe table below lists operator precedence in decreasing order, where operators\
    \ on higher rows have precedence over those on lower rows, so their operations\
    \ get completed first. Operators on the same row have equal precedence but the\
    \ order of completion is determined by associativity direction. For instance,\
    \ for “Left to right” associativity the operations on the left get completed first.\n\
    \n| Operator | Associativity |\n|---|---|\n| `( )` Function call &nbsp; `[ ]`\
    \ Array index<br>`->` Struct pointer &nbsp;`.` Struct member | Left to right |\n\
    | `!` NOT &nbsp; `~` Bitwise NOT &nbsp; `++` Increment<br>`--` Decrement &nbsp;`+`\
    \ Positive sign &nbsp;`sizeof`<br>`-` Negative sign &nbsp;`*` Pointer &nbsp;`&`\
    \ Address | Right to left |\n| `*` Multiply / Divide `%` Modulus | Left to right\
    \ |\n| `+` Add - Subtract | Left to right |\n| `<<` Shift left &nbsp;`>>` Shift\
    \ right | Left to right |\n| `<` Less than &nbsp;`<=` Less than or equal to<br>`>`\
    \ Greater than &nbsp;`>=` Greater than or equal to | Left to right |\n| `==` Equality\
    \ `!=` Inequality | Left to right |\n| `&` Bitwise AND | Left to right |\n| `^`\
    \ Bitwise XOR | Left to right |\n| `|` Bitwise OR | Left to right |\n| `&&` AND\
    \ | Left to right |\n| `||` OR | Left to right |\n| `?:` Conditional | Right to\
    \ left |\n| `=` `+=` `-=` `*=` `/=` `%=` `&=` `^=` `|=`<br>`<<=` `>>=` Assignment\
    \ operators | Right to left |\n| `,` Comma | Left to right |\n\n![](img/d1dfb0563339ba187decb78799155b7f_69_1.png)\n\
    \nThe `->` and `.` struct operators are described later in this book but are included\
    \ here to provide a complete precedence table of all operators.\n\n- 1. Begin\
    \ a new program with a preprocessor instruction to include the standard input/output\
    \ library functions\n\n `#include <stdio.h>`\n\n![](img/d1dfb0563339ba187decb78799155b7f_70_0.png)\n\
    \n- 2. Add a main function that outputs an integer from an expression following\
    \ row-level precedence rules, and another following explicitly determined precedence\n\
    \n int main()\n {\n printf(\"\\nDefault precedence ((2*3)+4)-5 : %d\\n\", 2*3+4-5\
    \ );\n printf(\"Explicit precedence 2*((3+4)-5) : %d\\n\", 2*((3+4)-5) );\n }\n\
    \n- 3. Next, in the main function block, output an integer from following Left-to-right\
    \ associativity precedence rules then another following explicitly determined\
    \ precedence\n\n printf( \"\\nDefault precedence (7*3) %% 2 : %d\\n\" , 7*3%2\
    \ );\n printf( \"Explicit precedence 7* (3%%2) : %d\\n\" , 7*(3%2) );\n\n- 4.\
    \ Now, output an integer following Right-to-left associativity precedence rules\
    \ then another from explicit precedence\n\n int num = 9 ;\n printf(\"\\nDefault\
    \ precedence(8/2)*4:%d\\n\", --num/2*sizeof(int));\n num = 9 ;\n printf(\"Explicit\
    \ precedence 8/(2*4):%d\\n\", --num/(2*sizeof(int)));\n\n- 5. At the end of the\
    \ main function block, return a zero integer value, as required by the function\
    \ declaration\n\n `return 0 ;`\n\n- 6. Save the program file, then compile and\
    \ execute the program to see output following precedence rules\n\n### Beware\n\
    \nIn order to output a % character the printf() statement requires %%.\n\n```\n\
    C:\\MyPrograms>gcc precedence.c -o precedence.exe\nC:\\MyPrograms>precedence\n\
    Default precedence ((2*3)+4)-5 : 5\nExplicit precedence 2*((3+4)-5) : 4\nDefault\
    \ precedence (7*3) % 2 : 1\nExplicit precedence 7* (3%2) : 7\nDefault precedence\
    \ (8/2)*4:16\nExplicit precedence 8/(2*4):1\nC:\\MyPrograms>\n```\n"
  mdcn: "\n除非是为资源受限的设备编程，否则很少需要用到按位运算符，但它们可能很有用。例如，XOR（异或）运算符让你无需第三个变量即可交换两个变量的值。\n\
    \n- 1. 开始一个新程序，使用预处理指令包含标准输入/输出库函数\n```c\n#include <stdio.h>\n```\n- 2. 添加一个 main\
    \ 函数，声明并初始化两个整型变量，然后输出它们的初始值\n```c\nint main()\n{\n int x = 10, y = 5;\n printf(\"\
    \\nx=%d y=%d\\n\", x, y);\n}\n```\n- 3. 接下来，在 main 函数块中，插入三次 XOR 语句，通过二进制位操作交换变量值\n\
    ```c\nx = x ^ y; /* 1010 ^ 0101 = 1111 (decimal 15) */\ny = x ^ y; /* 1111 ^ 0101\
    \ = 1010 (decimal 10) */\nx = x ^ y; /* 1111 ^ 1010 = 0101 (decimal 5) */\n```\n\
    - 4. 现在，插入一条语句以输出交换后的值\n```c\nprintf(\"\\nx=%d y=%d\\n\", x, y);\n```\n- 5. 在\
    \ main 函数块末尾，按照函数声明的要求返回整数零值\n```c\nreturn 0;\n```\n- 6. 保存程序文件，然后编译并执行程序，看看 XOR\
    \ 按位操作的魔力\n\n![](img/d1dfb0563339ba187decb78799155b7f_66_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_66_1.png)\n\
    \n不要将按位运算符与逻辑运算符混淆。按位运算符比较二进制数，而逻辑运算符评估布尔值。\n\n![](img/d1dfb0563339ba187decb78799155b7f_66_2.png)\n\
    \n## 标志位\n\n迄今为止，按位运算符最常见的用途是操作一个紧凑的“位域”，其中包含一组布尔“标志”。与将布尔标志值存储在单独变量中相比，这种方式对内存的利用效率高得多——仅\
    \ 1 字节的 char 数据类型可以容纳一个包含八个标志的位域，每位一个标志，而八个单独的 char 变量将需要整整 8 字节内存。\n\n可以通过向变量赋予一个十进制值来设置初始位标志，该值的二进制等价值中，每个要作为布尔标志“打开”的位都为\
    \ 1。例如，十进制 8 的二进制等价值为 1000（1x8 0x4 0x2 0x1），因此会打开第四个标志，从最低有效位从右向左读取。\n\n随后，可以使用按位\
    \ NOT ~ 运算符反转位标志值，但必须注意在标志位之前用零进行掩码，否则它们都会返回为 1。例如，要反转一个字节右侧四位中的四个标志的位域，必须对左侧四位进行掩码。十进制\
    \ 15 是二进制 00001111（0x128 0x64 0x32 0x16 1x8 1x4 1x2 1x1），可以通过按位 AND & 运算符将其作为该掩码应用。\n\
    \n还可以使用按位左移 << 和右移 >> 运算符，将已打开的标志位移指定的位数，从而操作位标志模式。\n\n![](img/d1dfb0563339ba187decb78799155b7f_67_0.png)\n\
    \n- 1. 开始一个新程序，使用预处理指令包含标准输入/输出库函数\n```c\n#include <stdio.h>\n```\n- 2. 添加一个 main\
    \ 函数，声明一个字符变量，并用一个打开一个位标志的十进制值初始化\n```c\nint main()\n{\n int flags = 8; /* Binary\
    \ 1000 (1x8 0x4 0x2 0x1) */\n}\n```\n- 3. 接下来，在 main 函数块中，为变量赋予一个新值，以同时打开另一个标志\n\
    ```c\nflags = flags | 2; /* 1000 | 0010 = 1010 (decimal 10) */\n```\n- 4. 现在，插入语句输出所有位标志设置\n\
    \n printf( \"Flag 1: %s\\n\", ( (flags & 1) > 0 ) ? \"ON\" : \"OFF\" );\n printf(\
    \ \"Flag 2: %s\\n\", ( (flags & 2) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag\
    \ 3: %s\\n\", ( (flags & 4) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag 4: %s\\\
    n\", ( (flags & 8) > 0 ) ? \"ON\" : \"OFF\" );\n\n![](img/d1dfb0563339ba187decb78799155b7f_68_0.png)\n\
    \n### 小技巧\n通常可以预先定义常量来表示每个位标志，这会很方便。例如：\n #define FLAG1 1\n #define FLAG2 2\n\
    \ #define FLAG3 4\n #define FLAG4 8\n\n- 5. 接下来，插入语句对字节的前四位进行掩码，然后翻转所有位标志设置\n\n\
    \ char mask = 15 ; /* Binary 00001111 */\n flags = ~flags & mask ; /* ~(1010 &\
    \ 1111=1010) = 0101 */\n\n- 6. 现在，插入语句输出反转后的位标志设置以及表示该模式的十进制值\n\n printf( \"Flag\
    \ 1: %s\\n\", ( (flags & 1) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag 2: %s\\\
    n\", ( (flags & 2) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag 3: %s\\n\", (\
    \ (flags & 4) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flag 4: %s\\n\", ( (flags\
    \ & 8) > 0 ) ? \"ON\" : \"OFF\" );\n printf( \"Flags decimal value is %d\\n\"\
    , flags );\n\n- 7. 添加一条语句，将“打开”的位标志向左移一位，然后输出新模式对应的十进制值\n\n flags = flags << 1\
    \ ; /* 0101 << 1 = 1010. */\n printf( \"Flags decimal value is now %d\\n\", flags\
    \ );\n\n- 8. 在 main 函数块末尾，按照函数声明的要求返回整数零值\n return 0 ;\n\n- 9. 保存程序文件，然后编译并执行程序，查看位标志操作\n\
    \n```\nCommand Prompt\nC:\\MyPrograms>gcc bitFlag.c -o bitFlag.exe\nC:\\MyPrograms>bitFlag\n\
    Flag 1: OFF\nFlag 2: ON\nFlag 3: OFF\nFlag 4: ON\n\nFlag 1: ON\nFlag 2: OFF\n\
    Flag 3: ON\nFlag 4: OFF\n\nFlags decimal value is 5\nFlags decimal value is now\
    \ 10\n\nC:\\MyPrograms>_\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_68_1.png)\n\
    \n### 不要忘记\n使用占用更多内存的变量可以创建具有更多位标志的更大位域——4 字节的 int 数据类型有 32 位。\n\n## 理解优先级\n\n\
    运算符优先级定义了 C 计算表达式的顺序。例如，在表达式 `a=6+b*3` 中，优先级顺序决定先完成加法还是乘法。\n\n![](img/d1dfb0563339ba187decb78799155b7f_69_0.png)\n\
    \n`*` 乘法运算符所在的行高于 `+` 加法运算符——因此在表达式 `a=6+b*3` 中，乘法会在加法运算之前完成。\n\n下表按优先级递减顺序列出运算符，其中较高行上的运算符优先于较低行上的运算符，因此它们的运算会先完成。同一行上的运算符具有相同优先级，但完成顺序由结合性方向决定。例如，对于“从左到右”结合性，左侧的运算会先完成。\n\
    \n| 运算符 | 结合性 |\n|---|---|\n| `( )` 函数调用 &nbsp; `[ ]` 数组索引<br>`->` 结构体指针 &nbsp;`.`\
    \ 结构体成员 | 从左到右 |\n| `!` 逻辑非 &nbsp; `~` 按位非 &nbsp; `++` 自增<br>`--` 自减 &nbsp;`+`\
    \ 正号 &nbsp;`sizeof`<br>`-` 负号 &nbsp;`*` 指针 &nbsp;`&` 取地址 | 从右到左 |\n| `*` 乘法 /\
    \ 除法 `%` 取模 | 从左到右 |\n| `+` 加 - 减 | 从左到右 |\n| `<<` 左移 &nbsp;`>>` 右移 | 从左到右 |\n\
    | `<` 小于 &nbsp;`<=` 小于或等于<br>`>` 大于 &nbsp;`>=` 大于或等于 | 从左到右 |\n| `==` 等于 `!=`\
    \ 不等于 | 从左到右 |\n| `&` 按位与 | 从左到右 |\n| `^` 按位异或 | 从左到右 |\n| `|` 按位或 | 从左到右 |\n\
    | `&&` 逻辑与 | 从左到右 |\n| `||` 逻辑或 | 从左到右 |\n| `?:` 条件 | 从右到左 |\n| `=` `+=` `-=`\
    \ `*=` `/=` `%=` `&=` `^=` `|=`<br>`<<=` `>>=` 赋值运算符 | 从右到左 |\n| `,` 逗号 | 从左到右\
    \ |\n\n![](img/d1dfb0563339ba187decb78799155b7f_69_1.png)\n\n`->` 和 `.` 结构体运算符将在本书后面描述，但此处列出它们是为了提供所有运算符的完整优先级表。\n\
    \n- 1. 开始一个新程序，使用预处理指令包含标准输入/输出库函数\n\n `#include <stdio.h>`\n\n![](img/d1dfb0563339ba187decb78799155b7f_70_0.png)\n\
    \n- 2. 添加一个 main 函数，输出一个遵循行级优先级规则的表达式得到的整数，以及另一个遵循显式确定优先级的表达式得到的整数\n\n int main()\n\
    \ {\n printf(\"\\nDefault precedence ((2*3)+4)-5 : %d\\n\", 2*3+4-5 );\n printf(\"\
    Explicit precedence 2*((3+4)-5) : %d\\n\", 2*((3+4)-5) );\n }\n\n- 3. 接下来，在 main\
    \ 函数块中，输出一个遵循从左到右结合性优先级规则的整数，然后输出另一个遵循显式确定优先级的整数\n\n printf( \"\\nDefault precedence\
    \ (7*3) %% 2 : %d\\n\" , 7*3%2 );\n printf( \"Explicit precedence 7* (3%%2) :\
    \ %d\\n\" , 7*(3%2) );\n\n- 4. 现在，输出一个遵循从右到左结合性优先级规则的整数，然后输出另一个来自显式优先级的整数\n\n\
    \ int num = 9 ;\n printf(\"\\nDefault precedence(8/2)*4:%d\\n\", --num/2*sizeof(int));\n\
    \ num = 9 ;\n printf(\"Explicit precedence 8/(2*4):%d\\n\", --num/(2*sizeof(int)));\n\
    \n- 5. 在 main 函数块末尾，按照函数声明的要求返回整数零值\n\n `return 0 ;`\n\n- 6. 保存程序文件，然后编译并执行程序，查看遵循优先级规则的输出\n\
    \n### 注意\n\n为了输出 % 字符，printf() 语句需要使用 %%。\n\n```\nC:\\MyPrograms>gcc precedence.c\
    \ -o precedence.exe\nC:\\MyPrograms>precedence\nDefault precedence ((2*3)+4)-5\
    \ : 5\nExplicit precedence 2*((3+4)-5) : 4\nDefault precedence (7*3) % 2 : 1\n\
    Explicit precedence 7* (3%2) : 7\nDefault precedence (8/2)*4:16\nExplicit precedence\
    \ 8/(2*4):1\nC:\\MyPrograms>\n```\n"
