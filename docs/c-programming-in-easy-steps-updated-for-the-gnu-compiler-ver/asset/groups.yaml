    \n结构体成员只能在变量声明中使用逗号分隔列表进行初始化——它们必须稍后单独初始化。\n\n## 在结构体中使用指针\n\n在结构体中使用字符指针作为字符串容器比为同一目的使用字符数组具有优势。\n\
    \n整个字符串只能在声明时分配给 char 数组。随后使用 = 运算符将字符串分配给结构体的 char 数组的唯一方法是一次将单个字符分配给一个元素。\n\n\
    在每次赋值中，= 运算符左侧的值称为“L-value”，代表内存位置，而 = 运算符右侧的值称为“R-value”，代表要读入该位置的数据。\n\nC 编程中的一条重要规则是\
