  mdcn: "\n## 总结\n\n- 算术运算符可以使用两个操作数构成表达式，用于加法 +、减法 -、乘法 *、除法 / 和取模 %。\n- 自增 ++ 和自减\
    \ -- 运算符使单个操作数增加或减少 1。\n- 赋值 = 运算符可以与算术运算符组合，先执行算术计算，然后将其结果赋值。\n- 比较运算符可以构成表达式，用于比较两个操作数的值：相等\
    \ ==、不相等 !=、大于 >、小于 <、大于或等于 >= 以及小于或等于 <=。\n- 逻辑与 && 和逻辑或 || 运算符构成表达式，对两个操作数求值以返回布尔值\
    \ true 或 false，而逻辑非 ! 运算符返回单个操作数的反向布尔值。\n- 条件 ?: 运算符对给定的布尔表达式求值，然后根据其结果返回两个操作数之一。\n\
    - sizeof 运算符返回数据类型或数据对象的内存字节大小。\n- 单个内存字节由八个位组成，每个位可以包含值一（1）或零（0）。\n- 按位或 |、按位与\
    \ &、按位非 ~ 和按位异或 ^ 运算符在对两个位中的值进行比较后返回一个值，而左移 << 和右移 >> 运算符按指定数量的位沿其方向移动位值。\n- 按位运算符最常见的用途是操作包含一组布尔标志的紧凑位字段。\n\
    - 包含多个运算符的表达式将按照默认优先级规则执行其运算，除非通过添加括号明确指定。\n\n## 测试表达式\n\n![](img/d1dfb0563339ba187decb78799155b7f_73_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_73_1.png)\n\n当要执行的代码只是单条语句时，可以选择省略花括号。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_73_2.png)\n\n通过将 if 和 else 语句组合为 if()\
    \ { ... } else if () { ... }，可以对多个表达式求值。\n\nif 关键字用于执行基本条件测试，该测试对给定表达式求值以得到布尔值\
    \ true 或 false。只有发现表达式为 true 时，才会执行求值之后花括号内的语句。因此，if 测试语句的语法如下所示：\n\n```\nif (\
    \ test-expression ) { statements-to-execute-when-true }\n```\n\n当测试为 true 时，可能要执行多条语句，但每条语句都必须以分号结尾。\n\
    \n有时可能需要对多个表达式求值，以确定是否应执行后续语句，这可以通过两种方式实现。逻辑与 && 运算符可用于确保仅当两个表达式都被发现为 true 时才执行这些语句，语法如下：\n\
    \n```\nif ( ( test-expression ) && ( test-expression ) ) { statements-to-execute\
    \ }\n```\n\n或者，可以将多个 if 语句“嵌套”，一个放在另一个内部，以确保仅当两个求值表达式都被发现为 true 时才执行后续语句，如下所示：\n\
    \n```\nif ( test-expression )\n{\nif ( test-expression ) { statements-to-execute\
    \ }\n}\n```\n\n当 if 测试语句求值的一个或多个表达式被发现为 false 时，其后面花括号内的语句不会执行，程序将继续执行后续代码。\n\n\
    通常更可取的是扩展 if 语句，附加一个 else 语句，指定当 if 语句求值的表达式被发现为 false 时要执行的花括号内语句，语法如下：\n\n```\n\
    if ( test-expression )\n{ statements-to-execute-when-true }\nelse\n{ statements-to-execute-when-false\
    \ }\n```\n\n这是一种基本编程技术，根据求值结果向程序提供两个可继续执行的方向，称为“条件分支”。\n\n- 1. 使用预处理指令开始一个新程序，以包含标准输入/输出库函数\n\
    \n    ```c\n    #include <stdio.h>\n    ```\n\n    ![](img/d1dfb0563339ba187decb78799155b7f_74_0.png)\n\
    \n- 2. 添加一个 main 函数，当被测表达式被发现为 true 时输出一条语句\n\n    ```c\n    int main()\n    {\n\
    \        if( 5 > 1 ) { printf( \"Yes, 5 is greater than 1\\n\" ) ; }\n    }\n\
    \    ```\n\n- 3. 接着，在 main 函数块中，当两个被测表达式都被发现为 true 时输出一条语句\n\n    ```c\n    if(\
    \ 5 > 1 )\n    {\n        if( 7 > 2 )\n        { printf(\"5 is greater than 1\
    \ and 7 is greater than 2\\n\") ; }\n    }\n    ```\n\n- 4. 现在，在两个被测表达式都被发现为 false\
    \ 后输出一条默认语句\n\n    ```c\n    if( 1 > 2 )\n    { printf(\"1st expression is true\\\
    n\") ; }\n    else if( 1 > 3 )\n    { printf(\"2nd expression is true\\n\") ;\
    \ }\n    else\n    { printf(\"Both expressions are false\\n\") ; }\n    ```\n\n\
    \    ![](img/d1dfb0563339ba187decb78799155b7f_74_1.png)\n\n- 5. 在 main 函数块末尾，按照函数声明的要求返回零整数值\n\
    \n    ```c\n    return 0 ;\n    ```\n\n在 C 中，布尔 true 在数值上表示为 1，布尔 false 表示为 0（零）。因此，表达式\
    \ ( 5 > 1 ) 是 ( 5 > 1 == 1 ) 的简写。\n\n- 6. 保存程序文件，然后编译并执行程序，以查看条件测试后的输出\n\n   \
    \ ```\n    C:\\MyPrograms>gcc ifelse.c -o ifelse.exe\n    C:\\MyPrograms>ifelse\n\
    \    Yes, 5 is greater than 1\n    5 is greater than 1 and 7 is greater than 2\n\
    \    Both expressions are false\n    C:\\MyPrograms>_\n    ```\n\n## 分支 switch\
    \ 语句\n\n当测试表达式仅求值单个条件时，由多个 **if else** 语句执行的条件分支通常可以通过 **switch** 语句更高效地执行。\n\n\
    **switch** 语句的工作方式不寻常。它将给定值作为参数实参，然后从多个 **case** 语句中寻找与该值匹配的语句。每个 **case** 语句中都包含找到匹配时要执行的代码。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_75_0.png)\n\n始终最好包含一个 **default** 语句——即使它只是在\
    \ **switch** 语句失败时输出错误消息。\n\n重要的是，用 **break** 关键字语句结束每个 **case** 语句，这样 **switch**\
    \ 语句在找到匹配后就会退出，而不会继续寻找更多匹配——除非这是有意要求。\n\n可选地，**case** 语句列表后面可以跟一个最终的 **default**\
    \ 语句，用于指定在任何 **case** 语句中都未找到匹配时要执行的代码。因此，switch 语句的语法通常如下所示：\n\n```c\nswitch\
    \ ( test-value )\n{\n  case match-value : statements-to-execute-when-matched ;\
    \ break ;\n  case match-value : statements-to-execute-when-matched ; break ;\n\
    \  case match-value : statements-to-execute-when-matched ; break ;\n  default\
    \ : statements-to-execute-when-no-match-found ;\n}\n```\n\n根据 ANSI C 标准，一个 **switch**\
    \ 语句最多可以至少有 257 个 **case** 语句，但其中任意两个 **case** 语句都不能尝试匹配相同的值。\n\n![](img/d1dfb0563339ba187decb78799155b7f_75_1.png)\n\
    \n**default** 语句不必出现在 switch 块的末尾，但将其放在那里是合乎逻辑的，因为那里不需要 **break** 语句。\n\n当多个匹配值各自要执行相同的语句时，只有最后一个\
    \ **case** 语句需要包含要执行的语句以及用于退出 **switch** 语句块的 **break** 语句。例如，要为匹配值 0、1 和 2 输出同一条消息：\n\
    \n```c\nswitch ( num )\n{\n  case 0 :\n  case 1 :\n  case 2 : printf( \"Less than\
    \ 3\\n\" ) ; break ;\n  case 3 : printf( \"Exactly 3\\n\" ) ; break ;\n  default\
    \ : printf( \"Greater than 3 or less than zero\\n\" ) ;\n}\n```\n\n- 1. 使用预处理指令开始一个新程序，以包含标准输入/输出库函数\n\
    \n    ```c\n    #include <stdio.h>\n    ```\n\n    ![](img/d1dfb0563339ba187decb78799155b7f_76_0.png)\n\
    \n- 2. 添加一个 main 函数，声明并初始化一个整数变量和一个字符变量\n\n    ```c\n    int main()\n    {\n \
    \       int num = 2 ; char letter = 'b' ;\n    }\n    ```\n\n- 3. 接着，在 main 函数块中，插入一个尝试匹配整数值的\
    \ switch 语句\n\n    ```c\n    switch( num )\n    {\n        case 1 : printf( \"\
    Number is one\\n\" ) ; break ;\n        case 2 : printf( \"Number is two\\n\"\
    \ ) ; break ;\n        case 3 : printf( \"Number is three\\n\" ) ; break ;\n \
    \       default : printf( \"Number is unrecognized\\n\" ) ;\n    }\n    ```\n\n\
    - 4. 现在，插入一个尝试匹配字符值的 switch 语句\n\n    ```c\n    switch( letter )\n    {\n    \
    \    case 'a' : case 'b' : case 'c' :\n            printf( \"Letter is %c\\n\"\
    \ , letter ) ; break ;\n        default : printf( \"Letter is unrecognized\\n\"\
    \ ) ;\n    }\n    ```\n\n    ![](img/d1dfb0563339ba187decb78799155b7f_76_1.png)\n\
    \n    > 在 switch 语句中，case 关键字、匹配值和冒号字符被视为一个唯一的“标签”。\n\n- 5. 在 main 函数块末尾，按照函数声明的要求返回零整数值\n\
    \n    ```c\n    return 0 ;\n    ```\n\n- 6. 保存程序文件，然后编译并执行程序，以查看 switch 语句的输出\n\
    \n    ```\n    Command Prompt\n\n    C:\\MyPrograms>gcc switch.c -o switch.exe\n\
    \    C:\\MyPrograms>switch\n    Number is two\n    Letter is b\n    C:\\MyPrograms>_\n\
    \    ```\n\n"
