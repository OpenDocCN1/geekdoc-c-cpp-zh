    \ value from accidental alteration, as the compiler will report an error if the\
    \ program attempts to subsequently alter the initial value.\n\nConstant names\
    \ are subject to the same naming conventions as variable names (described on page\
    \ 20) but it is traditional to use uppercase characters for constant names – to\
