  mdcn: "\n## 提供参数\n\n数据可以作为“参数”传递给自定义函数，然后函数可以使用这些数据来执行其语句。函数原型必须包含每个参数的名称和数据类型。\n\
    \n重要的是要认识到，在C编程中，数据是“按值”传递给指定为函数参数的变量。这与一些其他编程语言（如Pascal）不同，后者的参数是“按引用”传递的——函数操作的是原始值，而不仅仅是局部副本。\n\
    \n函数原型中的参数称为函数的“形式参数”。它们可以具有不同的数据类型，并且如果以逗号分隔，可以为单个函数指定多个参数。例如，包含四种数据类型各自参数的一个函数原型可能如下所示：\n\
    \n```c\nvoid action( char c , int i , float f , double d ) ;\n```\n\n编译器会检查函数原型中指定的形式参数是否与函数定义中的形式参数匹配，如果不匹配，则会报告错误。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_89_0.png)\n\n“按值”传递数据会将值赋给被调用函数中的一个变量。然后函数可以操作该副本，但不会影响原始数据。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_89_1.png)\n\n- 1. 使用预处理指令包含标准输入/输出库函数来开始一个新程序\n\
    ```c\n#include <stdio.h>\n```\n- 2. 声明三个自定义函数原型，每个原型在被调用时都有一个参数要传递\n```c\nvoid\
    \ display( char str[] ) ;\nint square( int x ) ;\nint cube( int y ) ;\n```\n-\
    \ 3. 添加一个 main 函数，该函数声明一个整数变量和一个用文本字符串初始化的字符数组变量\n```c\nint main()\n{\n    int\
    \ num ;\n    char msg[50] = \"String to be passed to a function\" ;\n}\n```\n\n\
    ### 4\n在 main 函数之后，定义自定义函数\n\n```c\nvoid display( char str[] )\n{\n    printf(\
    \ \"%s\\n\", str );\n}\n\nint square( int x )\n{\n    return ( x * x );\n}\n\n\
    int cube( int y )\n{\n    return ( y * y ) * y;\n}\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_90_0.png)\n\
    \n函数定义中使用的参数名可以与函数原型中使用的参数名不同，但参数的数据类型、数量和顺序必须相同。不过，在两者中采用相同的名称会更清晰。\n\n### 5\n\
    现在，在 main 函数中，插入调用每个自定义函数并传递参数值的语句\n\n```\ndisplay( msg );\nnum = square( 4 );\n\
    printf( \"4x4= %d\\n\", num );\nprintf( \"4x4x4= %d\\n\", cube( 4 ) );\n```\n\n\
    ### 6\n在 main 函数块的末尾，按照函数声明的要求返回一个零整数值\n\n```\nreturn 0 ;\n```\n\n### 7\n保存程序文件，然后编译并执行程序，以查看使用传递的参数值从自定义函数得到的输出\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_90_1.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_90_2.png)\n\
    \n函数不必返回任何值，但仍然可以包含 return 关键字而不带任何后续值，以表示将控制权返回给调用者。\n\n## 递归调用\n\n自定义函数中的语句可以自由地调用其他自定义函数，就像它们可以轻松调用标准库函数（如\
    \ `printf()`）一样。\n\n此外，函数可以调用自身，这些函数称为“递归函数”。与循环一样，重要的是递归函数必须修改被测试的表达式以避免持续执行——因此函数调用会在某个时刻结束。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_91_0.png)\n\n- 1. 使用预处理指令包含标准输入/输出库函数来开始一个新程序\n\
    ```c\n#include <stdio.h>\n```\n- 2. 声明一个自定义函数原型，该原型在被调用时有一个参数要传递\n```c\nvoid count_down_from(\
    \ int num );\n```\n- 3. 添加一个 main 函数，该函数声明一个整数变量\n```c\nint main()\n{\n    int\
    \ start ;\n}\n```\n- 4. 接下来，在 main 函数块中，添加一条语句，请求用户输入一个要赋给该变量的整数值\n```c\nprintf(\
    \ \"Enter a positive integer to count down from: \" );\nscanf( \"%d\", &start\
    \ );\n```\n- 5. 现在，在 main 函数块中，添加对自定义函数的调用，并将用户输入的值传递给它\n```c\ncount_down_from(\
    \ start );\n```\n- 6. 在 main 函数块中，添加一条语句，在控制权从自定义函数返回时输出一条消息\n```c\nprintf( \"\
    Lift Off!\\n\" );\n```\n- 7. 在 main 函数块的末尾，按照函数声明的要求返回一个零整数值\n```c\nreturn 0;\n\
    ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_91_1.png)\n\n在 `scanf()` 函数中，变量名前面必须加上\
    \ & 取地址运算符，如第24页所述。\n\n在 main 函数块之后，开始自定义函数定义，其中包含一条语句来输出函数调用期间传递的参数值\n\n```c\n\
    void count_down_from( int num )\n{\n    printf( \"%d\\n\", num );\n}\n```\n\n\
    接下来，在自定义函数块中，将作为参数传递的值递减\n\n```c\n--num ;\n```\n\n现在，在自定义函数块中，添加一个条件测试：如果递减后的值小于零，则将控制权返回给\
    \ main 函数；否则将该值作为参数递归调用此函数\n\n```c\nif( num < 0 ) return ;\nelse\n    count_down_from(\
    \ num ) ;\n```\n\n保存程序文件，然后编译并执行程序，在请求时输入一个整数，以查看递归函数调用的输出\n\n![](img/d1dfb0563339ba187decb78799155b7f_92_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_92_1.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_92_2.png)\n\
    \n递归函数可能比使用循环效率更低。\n\n![](img/d1dfb0563339ba187decb78799155b7f_92_3.png)\n\n##\
    \ 将函数放在头文件中\n\n由于篇幅考虑，本书中列出的示例程序必然很小，但实际上，大多数C程序会包含多得多的代码。\n\n在开发较大的程序时，应该考虑程序结构。随着程序增长，将整个程序代码维护在单个文件中可能会变得难以管理。\n\
    \n为了简化程序结构，可以创建一个自定义头文件来包含可能重复使用的函数。该文件应使用“.h”文件扩展名命名，就像C库中的标准头文件一样。\n\n通过在以 `main()`\
    \ 函数所在的文件开头添加 `#include` 预处理指令，可以使自定义头文件中的函数对程序可用。不过，在预处理指令中，自定义头文件名应使用双引号括起来，而不是使用用于包含标准头文件的\
    \ < 和 > 尖括号。\n\n![](img/d1dfb0563339ba187decb78799155b7f_93_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_93_1.png)\n\
    \n- 1. 创建一个名为“utils.h”的自定义头文件，其中包含单个函数的定义\n```c\nint square( int num )\n{\n return\
    \ ( num * num ) ;\n}\n```\n- 2. 使用预处理指令包含标准输入/输出库函数和自定义头文件来开始一个新程序\n```c\n#include\
    \ <stdio.h>\n#include \"utils.h\"\n```\n- 3. 声明一个没有参数的自定义函数原型\n```c\nvoid getnum()\
    \ ;\n```\n- 4. 添加一个 main 函数来调用另一个函数，然后按照声明的要求返回一个零整数\n```c\nint main()\n{\n getnum()\
    \ ;\n return 0 ;\n}\n```\n\n- 5. 在 main 函数块之后，通过声明两个变量来开始第二个函数定义\n```c\nvoid getnum()\n\
    {\n    int num ;\n    char again ;\n}\n```\n- 6. 接下来，在此函数定义中，添加语句以请求用户输入并将其值赋给一个变量\n\
    ```\nprintf(\"Enter an integer to be squared: \");\nscanf(\"%d\", &num );\n```\n\
    - 7. 现在，通过调用自定义头文件中的函数并传入输入值作为其参数来输出结果\n```\nprintf(\"%d squared is %d\\n\", num,\
    \ square(num) );\n```\n- 8. 添加一条语句，请求进一步的用户输入并将其值赋给一个变量\n```\nprintf(\"Square\
    \ another number? Y or N: \");\nscanf(\"%1s\", &again );\n```\n- 9. 最后，添加一个条件测试，以再次执行此函数或将控制权返回给\
    \ main 函数\n```\nif( again == 'Y' || ( again == 'y' ) ) getnum();\nelse return\
    \ ;\n```\n- 10. 保存程序文件，然后编译并执行程序，在请求时输入一个整数和字符，以查看函数调用的输出\n\n![](img/d1dfb0563339ba187decb78799155b7f_94_0.png)\n\
    \n程序文件和自定义头文件必须位于同一目录中，但使用常规命令进行编译——由于 `#include` 指令，编译器会自动读取头文件。\n\n![](img/d1dfb0563339ba187decb78799155b7f_94_1.png)\n\
    \n注意本示例中使用了 %1s 格式说明符——用于读取用户输入的下一个字符。\n\n![](img/d1dfb0563339ba187decb78799155b7f_94_2.png)\n"
