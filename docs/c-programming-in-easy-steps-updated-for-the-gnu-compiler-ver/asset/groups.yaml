    \n## 转换数据类型\n\n如果看起来合乎逻辑，编译器会隐式地将一种数据类型转换为另一种。例如，当把整数赋给 **float** 变量时，编译器会将整数转换为浮点值。\n\
    \n通过称为“强制类型转换”的过程，可以将存储在变量中的任何数据显式强制（coerce）转换为另一种数据类型的变量。强制类型转换只是在存储原始数据类型数据的变量名之前的圆括号中说明应转换为的数据类型。圆括号中还应包括任何修饰符，例如\
    \ *unsigned*（在适用时）——因此强制类型转换的语法如下所示：\n\n```\n`variable-name2 = ( modifiers data-type\
