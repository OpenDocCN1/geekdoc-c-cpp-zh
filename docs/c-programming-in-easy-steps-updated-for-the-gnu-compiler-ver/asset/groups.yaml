  - '[PAGE 25]


    # Inputting variable values


    The standard input/output library stdio.h provides a scanf() function that can
    be used to get user input into a program. The scanf() function requires two arguments
    within its parentheses to specify the type of data to be input and the location
    where the input should be stored.


    The first argument to the scanf() function must be one of the format specifiers
    from the table on page 22 between double quotes – for example, “%d” where input
    is an integer value. The second argument to the scanf() function must be a variable
    name preceded by the & character, except when the input data is a string of text.
    The & character has several uses in C programming but in this context is the “addressof”
    operator, which means that the input data should be stored at the memory location
    reserved for that variable.


    When a variable is declared, space is reserved in the machine’s memory to store
    the data assigned to that variable. The number of bytes reserved depends on the
    data type of the variable. The allocated memory is referenced by the unique variable
    name.


    Envision the computer’s memory as a very long row of slots. Each slot has a unique
    address, which is expressed in hexadecimal format. It’s like a long road of houses
    – each house contains people and has a unique numeric address. In C programs the
    houses are the slots, and the people are the data contained in those addresses.


    The scanf() function can simultaneously assign values to multiple variables too.
    Its first argument must then contain a list of format specifiers, each separated
    by a space, and the entire list must be enclosed by double quotes. The second
    argument must contain a comma-separated list of variable names, each preceded
    by the & addressof operator, to which each specified format applies.


    The & addressof operator can also be used to return the hexadecimal memory address
    at which the variable data is stored.


    Combining output from the printf() function and input from the scanf() function
    creates basic interactivity between the user and the program.


    ![](img/d1dfb0563339ba187decb78799155b7f_25_0.png)


    Strings are a special case and are demonstrated with the topic of arrays on page
    34.


    ![](img/d1dfb0563339ba187decb78799155b7f_25_1.png)


    Note that the scanf() function stops reading input when it encounters a space.'
