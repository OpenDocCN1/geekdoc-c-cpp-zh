    Sum is 100\nNum is 200\nC:\\MyProgram>\n```\n\n## 寄存器变量\n\n包含 register 关键字的变量声明会告知编译器，指定的变量将被程序频繁使用。其意图是让编译器将寄存器变量放入计算机的机器寄存器中，以加快访问速度。不过，它们的用处可能值得怀疑，因为编译器可以自由忽略这一建议。\n\
    \n只有局部内部变量才能声明为寄存器变量。无论如何，只有少数变量能保存在机器寄存器中，而且它们可能只能是某些类型。具体限制因机器而异。\n\n尽管有这些可能的缺点，register\
    \ 声明是无害的，因为当编译器实际上无法使用机器寄存器存储该变量时，register 关键字会被忽略。相反，该变量会像没有 register 关键字一样被创建。\n\
    \n与寄存器变量完全相反的效果，可通过包含 volatile 关键字的变量声明实现。这意味着该变量不得存储在机器寄存器中，因为它的值可能在任何时候发生变化，而无需编译器在附近发现的任何代码采取行动。这对大型程序中可能被多个线程并发修改的全局变量尤其重要。\n\
    \n可能受益于成为寄存器变量的一种变量，是用于存储循环控制值的局部变量。在循环的每次迭代中，该值都必须进行比较和更改，因此该变量会被反复访问。将该值存储在机器寄存器中，就可以加快循环的执行。\n\
    \n另一方面，如果全局变量用于存储循环的控制值，并且也可能从循环外部更改，那么该全局变量可能受益于成为 volatile 变量。\n\n循环结构在第 5 章中有完整描述，但旁边列出的示例是为了说明对寄存器变量的重复访问。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_31_0.png)\n\n这里为完整起见介绍了 register 和\
