  mdcn: "\n- 1. 使用预处理指令开始一个新程序，以包含标准输入/输出库函数\n\n~~~c\n#include <stdio.h>\n~~~\n\n\
    ![](img/d1dfb0563339ba187decb78799155b7f_26_0.png)\n\n- 2. 添加一个 main 函数，声明三个变量\n\
    \n~~~c\nint main()\n{\n  char letter ;\n  int num1, num2 ;\n}\n~~~\n\n- 3. 在 main\
    \ 函数中，在变量声明之后，插入语句以获取用户输入\n\n~~~c\nprintf( \"Enter any one keyboard character:\
    \ \" ) ;\nscanf( \"%c\", &letter ) ;\nprintf( \"Enter two integers separated by\
    \ a space: \" ) ;\nscanf( \"%d %d\" , &num1, &num2 ) ;\n~~~\n\n- 4. 接下来，插入语句以输出已存储数据的详细信息\n\
    \n~~~c\nprintf( \"Numbers input: %d and %d \\n\", num1, num2 ) ;\nprintf( \"Letter\
    \ input: %c \", letter ) ;\nprintf( \" Stored at: %p \\n\", &letter ) ;\n~~~\n\
    \n- 5. 在 main 函数块末尾，插入最后一条语句以返回零整数值，这是函数声明所要求的\n\n~~~c\nreturn 0 ;\n~~~\n\n> >\
    \ **别忘了！**\n> >\n> > 机器地址的格式说明符是 `%p`。\n\n- 6. 保存程序文件；编译并执行程序；在要求时输入数据；然后查看已存储数据的输出\n\
    \n```\n~~~\nCommand Prompt\nC:\\MyPrograms>gcc setvars.c -o setvars.exe\nC:\\\
    MyPrograms>setvars\nEnter any one keyboard character: M\nEnter two integers separated\
    \ by a space: 100 200\nNumbers input: 100 and 200\nLetter input: M  Stored at:\
    \ 0061FF2F\nC:\\MyPrograms>_\n~~~\n```\n\n## 限定数据类型\n\n创建 int 数据类型的整数变量时，默认情况下它既可以包含正值，也可以包含负值。这些值称为“有符号”值。可能值的范围由系统决定为“long”还是“short”。\n\
    \n如果 int 变量默认创建为 long 类型（很可能如此），则其可能值的范围通常为从最大值 +2,147,483,647 到最小值 -2,147,483,648。\n\
    \n另一方面，如果 int 变量默认创建为 short 类型（不太可能），则其可能值的范围通常为从最大值 +32,767 到最小值 -32,768。\n\n\
    不过，可以使用变量声明中的 short 和 long 限定符关键字来显式指定范围大小，如下所示：\n\n```\nshort int num1 ;   /*\
    \ Saves memory space. */\nlong int num2 ;   /* Allows bigger range. */\n```\n\n\
    limits.h C 库头文件包含每种数据类型大小的实现定义限值。对于未指定大小的 int 变量声明，可以通过名为 INT_MAX 和 INT_MIN 的常量值访问这些限值。类似地，SHRT_MAX\
    \ 和 SHRT_MIN 包含 short int 变量声明的限值，LONG_MAX 和 LONG_MIN 包含 long int 变量声明的限值。\n\n\
    当变量永远不会被赋予负值时，可以使用 unsigned 限定符关键字声明非负的“无符号”int 变量。无符号 short int 变量的可能范围通常为 0\
    \ 到 65,535，但只占用与常规 short int 变量相同的内存空间。无符号 long int 变量的可能范围通常为 0 到 4,294,967,295，但只占用与常规\
    \ long int 变量相同的内存空间。\n\nC 的 sizeof 运算符可用于显示不同数据类型的变量所保留的内存量。使用尽可能少的内存是良好的编程实践。例如，如果某个变量只会包含低于\
    \ 65,535 的正整数值，则最好使用仅保留 2 字节内存的无符号 short int 变量，而不是保留 4 字节内存的 long int 变量。\n\n\
    ![](img/d1dfb0563339ba187decb78799155b7f_27_0.png)\n\n常量始终完全使用大写字母命名，以便与变量区分开。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_27_1.png)\n\n分配给未指定大小的 int 变量的内存空间取决于系统，但通常默认会被当作\
    \ long int 处理。\n\n- 1. 使用预处理指令开始一个新程序，以包含标准输入/输出函数和常量\n\n```c\n#include <stdio.h>\n\
    #include <limits.h>\n```\n\n- 2. 添加一个 main 函数，其中包含输出 short int 数据类型的大小和范围的语句\n\
    \n```c\nint main()\n{\nprintf(\"short int... \\t size: %d bytes \\t\", sizeof(\
    \ short int ));\nprintf(\"%d to %d \\n\", SHRT_MAX, SHRT_MIN );\n}\n```\n\n- 3.\
    \ 接下来，插入语句以输出 long int 数据类型的大小和范围\n\n```c\nprintf(\"long int... \\t size: %d bytes\
    \ \\t\", sizeof( long int ));\nprintf(\"%ld to %ld \\n\", LONG_MAX, LONG_MIN );\n\
    ```\n\n- 4. 现在，插入语句以输出其他数据的大小\n\n```c\nprintf(\"char... \\t size: %d byte \\n\"\
    , sizeof( char ));\nprintf(\"float... \\t size: %d bytes \\n\", sizeof( float\
    \ ));\nprintf(\"double... \\t size: %d bytes \\n\", sizeof( double ));\n```\n\n\
    - 5. 插入最后一条语句以返回零整数值，这是函数声明所要求的\n\n```c\nreturn 0;\n```\n\n- 6. 保存程序文件，然后编译并执行程序，以查看数据类型的大小和范围\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_28_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_28_1.png)\n\
    \n注意本示例中如何使用 \\t 制表符转义序列来为输出添加间距。\n\n![](img/d1dfb0563339ba187decb78799155b7f_28_2.png)\n\
    \n## 使用全局变量\n\n变量在程序中的可访问程度称为“变量作用域”。在函数内声明的变量称为“局部”变量，而在任何函数块之外声明的变量称为“全局”变量。\n\
    \n局部变量只能从其声明所在的函数内部访问。这是默认的隐式行为，也可以通过变量声明中很少使用的 auto 关键字来显式指定。它们在函数被调用时存在，并通常在函数结束时消失。\n\
    \n另一方面，全局变量可以从程序中的任何函数内部访问。它们在程序执行时存在，并一直存在到程序结束。\n\n外部全局变量必须在程序开头恰好定义一次。它还必须在每个需要访问它的函数开头声明。该声明应以\
    \ extern 关键字开头，以表示它引用的是外部变量，而不是常规的局部变量声明。这些声明不应用于初始化全局变量。\n\n较大的 C 程序通常由多个源代码文件组成，这些文件一起编译以创建单个可执行文件。全局变量通常可以从一起编译的任何文件中的任何函数访问。所有函数通常也可以全局访问，但函数以及——更常见的是——全局变量可以通过在其声明中使用\
    \ static 关键字，将其可访问性限制为仅在创建它们的文件中。\n\n通常，一个程序不能使用多个同名变量，但如果每个变量都声明为 static 变量，并且在该源代码文件中唯一，则可以这样做。使用多个源代码文件编程时，可能会发现一个常见的全局变量名在两个不同文件中重复。将这些变量声明为\
    \ static 可以避免在源代码中每次出现时重命名其中一个变量。\n\n内部局部变量也可以声明为 static。与通常情况一样，它们只能从其声明所在的函数内部访问，但它们在函数结束时不会消失。这允许在函数内进行永久私有存储，直到程序结束。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_29_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_29_1.png)\n\
    \n广泛使用全局变量可能会引入名称冲突。\n\n![](img/d1dfb0563339ba187decb78799155b7f_29_2.png)\n\n\
    尽量只使用局部变量。全局变量允许方便地从程序中的任何函数访问值，但更好的做法是避免使用全局变量，而是在函数之间作为参数传递值。\n\n"
