  mdcn: "\n## 结构中的分组\n\n![](img/d1dfb0563339ba187decb78799155b7f_125_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_125_1.png)\n\
    \n结构体的变量成员不能在结构体声明中立即初始化。\n\n![](img/d1dfb0563339ba187decb78799155b7f_125_2.png)\n\
    \n通常，结构体声明会出现在 C 程序的 main() 函数之前。\n\nC 程序中的结构体可以包含一个或多个相同或不同数据类型的变量。这些变量被组合在单个结构体中，可以通过其名称方便地引用。结构体内的变量称为其“成员”。\n\
    \n将相关变量组合在结构体中有助于组织复杂的数据，尤其是在较大的程序中。例如，可以创建一个结构体来描述工资记录，其中包含变量来存储员工姓名、地址、薪水、税等。\n\
    \n在 C 程序中，结构体使用 struct 关键字声明，后跟给定名称和包含变量成员的大括号。最后，结构体声明必须在闭合大括号后以分号终止；因此，包含用于描述图表中点\
    \ x 和 y 坐标的成员的结构体可能如下所示：\n\n```c\nstruct coords\n{\n    int x ;\n    int y ;\n\
    } ;\n```\n\n可选地，“标签”名称可以在终止分号之前作为逗号分隔的列表包含。在效果上，结构体声明定义了一种新的数据类型，而标签名称就像该数据类型的变量。例如，可以像这样声明数据类型为“coords”的名为“point”的变量：\n\
    \n```c\nstruct coords\n{\n    int x ;\n    int y ;\n} point ;\n```\n\n然后可以通过将“.”运算符和成员名称附加到标签名称来引用每个结构体成员，例如\
    \ point.x。\n\n此外，可以使用现有结构体的名称声明新的结构体变量，该新变量将继承原始成员属性。例如，使用以下声明基于名为“coords”的结构体创建名为“top”的新结构体变量，其成员为\
    \ top.x 和 top.y：\n\n```c\nstruct coords top ;\n```\n\n- 1. 使用预处理器指令开始一个新程序，以包含标准输入/输出库函数\n\
