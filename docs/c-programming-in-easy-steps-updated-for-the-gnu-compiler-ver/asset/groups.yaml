    \ 12eight converts to Integer: 12\nString -65.8 converts to Integer: -65\nString\
    \ x13 converts to Integer: 0\n\nDecimal 12 is Binary: 1100\nDecimal 12 is Octal:\
    \ 14 chars: 2\nDecimal 12 is Hexadecimal: c chars: 1\n\nC:\\MyPrograms>_\n```\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_122_0.png)\n\n> itoa() 函数非常有用，但由于它不是\
    \ ANSI 标准的一部分，并非所有编译器都支持它——然而，本书中介绍的 GNU C 编译器支持它。\n\n![](img/d1dfb0563339ba187decb78799155b7f_122_1.png)\n\
    \n> 与 itoa() 函数不同，sprintf() 无法转换为二进制，因为没有用于二进制数字的格式说明符。\n\n## 摘要\n\n- 在 C 编程中，字符串是一个字符数组，其最后一个元素具有特殊的\
    \ `\\0` 空字符。\n- 每个字符也都有一个数值 ASCII 码值。\n- 字符数组名就像指向整个字符串的指针。\n- scanf() 函数在遇到第一个空格字符时停止读取输入，而\
    \ gets() 函数接受空格并自动添加最终的 `\\0` 空字符。\n- puts() 函数输出作为其参数指定的字符串，并在字符串末尾自动添加换行符。\n\
    - 标准 C 库 string.h 头文件提供了特殊的字符串处理函数，例如返回指定字符串长度的 strlen() 函数，或可以复制字符串的 strcpy()\
    \ 和 strncpy() 函数。\n- string.h 头文件还提供了 strcat() 和 strncat() 函数，可用于将字符串连接在一起。\n\
    - 此外，string.h 提供了搜索字符串中指定子字符串的 strstr() 函数，以及比较两个指定字符串的 strcmp() 函数。\n- 当 strstr()\
    \ 找不到它寻找的子字符串时，函数返回 NULL 值。\n- 标准 C 库 ctype.h 头文件提供了用于测试字符类型的函数，例如 isalpha()、isdigit()\
    \ 和 ispunct()。\n- ctype.h 头文件还提供了测试和设置字符大小写的 islower()、isupper() 和 tolower()、toupper()\
    \ 函数。\n- 标准库 stdlib.h 头文件提供了可以将字符串转换为整数的 atoi() 函数。\n- 标准库 stdlib.h 头文件提供了 sprintf()\
    \ 函数，可以将整数转换为字符串，其方式与功能更强大的非标准 itoa() 函数类似。\n\n## 9 构建结构\n\n本章介绍 \"struct\" 结构和\
