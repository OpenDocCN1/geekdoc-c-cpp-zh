    \nTypically, a struct declaration will appear before the main() function in a\
    \ C program.\n\nA structure in a C program can contain one or more variables of\
    \ the same or different data types. These are grouped together in a single structure\
    \ and can be conveniently referenced via its name. Variables within structures\
    \ are known as its “members”.\n\nGrouping related variables together in a structure\
    \ is helpful in organizing complicated data, especially in larger programs. For\
    \ example, a structure could be created to describe a payroll record with variables\
    \ to store an employee name, address, salary, tax, etc.\n\nA structure is declared\
    \ in a C program using the struct keyword followed by a given name and braces\
    \ containing the variable members. Finally, the structure declaration must be\
    \ terminated by a semi-colon after the closing brace; so a structure containing\
    \ members to describe x and y coordinates of a point in a graph could look like\
    \ this:\n\n```\nstruct coords\n{\n    int x ;\n    int y ;\n} ;\n```\n\nOptionally,\
    \ “tag” names can be included just before the terminating semi-colon as a comma-separated\
    \ list. In effect, the structure declaration defines a new data type, and tag\
    \ names act like variables of that data type. For example, a variable named “point”\
    \ of the data type “coords” can be declared like this:\n\n```\nstruct coords\n\
    {\n    int x ;\n    int y ;\n} point ;\n```\n\nEach struct member can then be\
    \ referenced by appending the “.” operator and the member name to the tag name,\
    \ such as point.x.\n\nAlso, a new structure variable can be declared using the\
    \ name of an existing structure, and that new variable will inherit the original\
    \ member properties. For example, create a new structure variable named “top”\
    \ based on the structure named “coords” with members top.x and top.y with this\
    \ declaration:\n\n```\nstruct coords top ;\n```"
