    \ pair of parentheses as they are in a **for** loop. Instead, the initializer\
    \ must appear before the start of the loop block, and the test-expression must\
    \ appear within parentheses after the **while** keyword, followed by braces containing\
    \ both an incrementer and the statements to be executed on each iteration.\n\n\
    ```\ninitializer\nwhile ( test-expression )\n{ statements-to-be-executed ; incrementer\
    \ }\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_79_0.png)\n\nNotice that\
    \ a semi-colon terminator is required after the while statement in the do while\
    \ loop.\n\nA do while loop provides a subtle variation on the syntax above by\
    \ placing the do keyword before the loop block and moving the while statement\
    \ to after the loop block.\n\n```\ninitializer\ndo { statements-to-be-executed\
    \ ; incrementer }\nwhile ( test-expression ) ;\n```\n\nBoth while loops and do\
    \ while loops will proceed to make iterations until the test-expression is found\
    \ to be false, at which point the loop will exit. It is therefore essential that\
    \ the loop body contains code that will, at some point, change the result of the\
    \ test-expression evaluation – otherwise an infinite loop is created that will\
    \ lock the system.\n\nThe significant difference between a while loop and a do\
    \ while loop is that a while loop will not make a single iteration if the test-expression\
    \ is false on its first evaluation. In contrast, a do while loop will always make\
    \ at least one iteration because its statements are executed before the evaluation\
    \ is made. If this is desirable a do while loop is obviously the best choice,\
    \ otherwise the choice between a for loop and a while loop is largely a matter\
    \ of personal preference. One rule of thumb suggests that a for loop is best used\
    \ to perform a specific number of iterations, whereas a while loop is best used\
    \ to iterate until a certain condition is met.\n\n![](img/d1dfb0563339ba187decb78799155b7f_79_1.png)\n\
    \nIn the event that a program runs an infinite loop, on Windows or Linux systems\
    \ press the Ctrl + C keyboard keys to halt the loop execution.\n\nLoops are the\
    \ perfect partner to use with arrays as each iteration can effortlessly read or\
    \ write into successive array elements.\n\n- 1. Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n  \n  ```c\n\
    \  #include <stdio.h>\n  ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_80_0.png)\n\
    \n- 2. Add a main function that declares a counter variable then declares and\
    \ initializes an array variable of three elements\n  \n  ```c\n  int main()\n\
    \  {\n      int i , arr[3] = { 10 , 20 , 30 } ;\n  }\n  ```\n\n- 3. Next, in the\
    \ main function block, insert a while loop that outputs each element number and\
    \ the value it contains\n  \n  ```c\n  i = 0 ;\n  while( i < 3 )\n  {\n      printf(\
    \ \"While: arr[%d] = %d\\n\" , i, arr[i] ) ;  i++ ;\n  }\n  ```\n\n- 4. Now, insert\
    \ a do while loop that also outputs each element number and the value it contains\n\
    \  \n  ```c\n  i = 0 ;\n  do\n  {\n      printf( \"\\nDo while: arr[%d] = %d\"\
    \ , i, arr[i] ) ; i++ ;\n  }\n  while( i < 3 ) ;\n  ```\n\n- 5. At the end of\
    \ the main function block, return a zero integer value, as required by the function\
    \ declaration\n  \n  ```c\n  return 0 ;\n  ```\n\n> **Don't forget!**\n>\n> Change\
    \ the value in this test-expression to zero — so `while (i<0)` in both loops —\
    \ then recompile and run the program again to see only the first iteration of\
    \ the **do while** loop get executed.\n\n- 6. Save the program file, then compile\
    \ and execute the program to see apparently identical output from the loops\n\
    \  \n  ```\n  C:\\MyPrograms>gcc dowhile.c -o dowhile.exe\n  \n  C:\\MyPrograms>dowhile\n\
    \  While: arr[0] = 10\n  While: arr[1] = 20\n  While: arr[2] = 30\n  \n  Do while:\
    \ arr[0] = 10\n  Do while: arr[1] = 20\n  Do while: arr[2] = 30\n  \n  C:\\MyPrograms>\n\
    \  ```\n\n## Breaking out of loops\n\nThe break keyword can be used to prematurely\
    \ terminate a loop when a specified condition is met. The break statement is situated\
    \ inside the loop statement block and is preceded by a test-expression. When the\
    \ test returns true, the loop ends immediately and the program proceeds on to\
    \ the next task. For example, in a nested inner loop it proceeds to the next iteration\
    \ of the outer loop.\n\n![](img/d1dfb0563339ba187decb78799155b7f_81_0.png)\n\n\
    - 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n  \n  ```c\n  #include <stdio.h>\n  ```\n\n\
    - 2. Add a main function that declares two integer variables to be used later\
    \ as loop iteration counters\n  \n  ```c\n  int main()\n  {\n      int i, j;\n\
    \  }\n  ```\n\n- 3. Next, in the main function block, insert two nested loops\
    \ to output their counter values on each of three iterations\n  \n  ```c\n  for(i\
    \ = 1; i < 4; i++)\n  {\n      for(j = 1; j < 4; j++)\n      {\n          printf(\"\
    Running i=%d j=%d\\n\", i, j);\n      }\n  }\n  ```\n\n- 4. At the end of the\
    \ main function block, return a zero integer value, as required by the function\
    \ declaration\n  \n  ```c\n  return 0;\n  ```\n\n- 5. Save the program file, then\
    \ compile and execute the program to see the output from nested loops\n\n![](img/d1dfb0563339ba187decb78799155b7f_81_1.png)\n"
  mdcn: "\n\n## 按次数循环\n\n循环是程序中自动重复执行的一段代码。循环中所有语句的一次完整执行称为一次“迭代”，或一“轮”。循环的长度由循环内进行的条件测试控制。只要被测试表达式为真，循环就会继续；直到被测试表达式为假，此时循环结束。\n\
    \n在 C 编程中，有三种循环结构：for 循环、while 循环和 do while 循环。其中最常见的也许是 for 循环，其典型语法如下：\n\n```\n\
    for ( initializer ; test-expression ; incrementer ) { statements }\n```\n\n初始化器用于为循环已执行迭代次数的计数器设置起始值。为此使用一个整型变量，传统上命名为“i”。\n\
    \n在循环的每次迭代中，都会对测试表达式求值，并且仅当该表达式为真时，该次迭代才会继续。当测试表达式变为假时，循环立即结束，不再执行这些语句。每次迭代时，计数器先递增，然后执行语句。\n\
    \n循环可以嵌套，一个循环位于另一个循环内，从而在外层循环的每次迭代中完整执行内层嵌套循环的所有迭代。\n\n![](img/d1dfb0563339ba187decb78799155b7f_77_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_77_1.png)\n\n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n\
    \  \n  ```c\n  #include <stdio.h>\n  ```\n\n- 2. 添加一个 main 函数，声明两个整型变量，稍后用作循环迭代计数器\n\
    \  \n  ```c\n  int main()\n  {\n      int i , j ;\n  }\n  ```\n\n- 3. 接下来，在 main\
    \ 函数块中插入一个 for 循环，在三次迭代的每一次中输出循环计数器的值\n  \n  ```c\n  for( i = 1 ; i < 4 ; i++\
    \ )\n  {\n      printf( \"Outer loop iteration %d\\n\" , i ) ;\n  }\n  ```\n\n\
    - 4. 在 main 函数块末尾，按照函数声明的要求返回整数值零\n  \n  ```c\n  return 0 ;\n  ```\n\n- 5. 保存程序文件，然后编译并执行程序，查看\
    \ for 循环的输出\n  \n  ```\n  C:\\MyPrograms>gcc forloop.c -o forloop.exe\n  C:\\\
    MyPrograms>forloop\n  Outer loop iteration 1\n  Outer loop iteration 2\n  Outer\
    \ loop iteration 3\n  C:\\MyPrograms>\n  ```\n\n- 6. 现在，在循环块中，紧接现有输出语句之后插入一个嵌套循环，在三次内层循环迭代的每一次中输出循环计数器的值\n\
    \  \n  ```c\n  for(j = 1 ; j < 4 ; j++)\n  {\n      printf( \"\\tInner loop iteration\
    \ %d\\n\" , j ) ;\n  }\n  ```\n\n- 7. 再次保存程序文件，然后编译并执行程序，查看两个循环的输出\n  \n  > **实用提示**\n\
    \  >\n  > for 循环计数器也可以倒计数——每次迭代使用 `i--` 而不是 `i++` 来递减计数器值。\n  \n  ```\n  C:\\\
    MyPrograms>gcc forloop.c -o forloop.exe\n  C:\\MyPrograms>forloop\n  Outer loop\
