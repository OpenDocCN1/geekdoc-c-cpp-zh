    \n![](img/d1dfb0563339ba187decb78799155b7f_83_0.png)\n\n## 跳转到标签\n\ngoto 关键字据说允许程序流程跳转到程序代码中其他位置的标签，就像网页上的超链接一样。然而，实际上这可能导致错误；它的使用不受欢迎；并且它被认为是不良的编程实践。\n\
    \ngoto 关键字跳转是一种强大的特性，它已在计算机程序中存在了数十年，但许多早期程序员滥用了它的能力，他们编写的程序以令人费解的方式到处跳转。这产生了难以阅读的程序代码，因此\
    \ goto 的使用变得非常不受欢迎。\n\ngoto 关键字的一种可能有效用法是：通过跳转到紧接在外层循环块结束之后的标签，干净地跳出内层嵌套循环。这会立即退出两个循环，因此两个循环都不会再执行后续迭代。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_83_1.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_83_2.png)\n\
    \n请注意，goto 语句仅按名称指定标签，但标签本身必须带有一个结尾的冒号 :。\n\n- 1. 使用一条预处理指令开始一个新程序，以包含标准输入/输出库函数。\n\
    \n```c\n#include <stdio.h>\n```\n\n- 2. 添加一个 main 函数，其中声明两个整型变量，稍后将用作循环迭代计数器。\n\
    \n```c\nint main()\n{\n    int i, j;\n}\n```\n\n- 3. 接下来，在 main 函数块中插入两个嵌套循环，在三次迭代中的每一次输出其计数器值。\n\
    \n```c\nfor( i = 1; i < 4; i++ )\n{\n    for( j = 1; j < 4; j++ )\n    {\n   \
    \     printf( \"Running i=%d j=%d\\n\", i, j );\n    }\n}\n```\n\n- 4. 在内层嵌套循环的第一行插入一条语句，以便在指定计数器值时跳转到名为“end”的标签。\n\
    \n```c\nif( i == 2 && j == 1 ) { goto end; }\n```\n\n- 5. 现在，在外层循环的右花括号之后添加该标签。\n\
    \n```c\n} end:\n```\n\n- 6. 在 main 函数块的末尾，按照函数声明的要求返回整数零值 return 0 ;\n\n- 7. 保存程序文件，然后编译并执行程序，以查看跳转后循环退出\n\
    \n在 C 中，布尔值以数字 1（true）和 0（false）表示\n\n```\n```\nCommand Prompt\nC:\\MyPrograms>gcc\
