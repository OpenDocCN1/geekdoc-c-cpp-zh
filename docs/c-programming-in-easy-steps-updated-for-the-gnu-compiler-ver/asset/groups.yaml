  md: "\n## Supplying arguments\n\nData can be passed as “arguments” to custom functions,\
    \ which can then use that data to execute their statements. The function prototype\
    \ must include the name and data type of each argument.\n\nIt is important to\
    \ recognize that in C programming, the data is passed “by value” to the variable\
    \ specified as the function argument. This is different to some other programming\
    \ languages, such as Pascal, whose arguments are passed “by reference” – where\
    \ the function operates on the original value, not just a local copy.\n\nThe arguments\
    \ in a function prototype are known as the “formal parameters” of the function.\
    \ These may be of different data types, and multiple arguments can be specified\
    \ for a single function if separated by a comma. For example, a function prototype\
    \ with arguments of each of the four data types could look like this:\n\n```c\n\
    void action( char c , int i , float f , double d ) ;\n```\n\nThe compiler checks\
    \ that the formal parameters specified in the function prototype match those in\
    \ the function definition and will report an error if they do not match.\n\n![](img/d1dfb0563339ba187decb78799155b7f_89_0.png)\n\
    \nPassing data “by value” assigns the value to a variable in the called function.\
    \ The function can then manipulate that copy but it does not affect the original\
    \ data.\n\n![](img/d1dfb0563339ba187decb78799155b7f_89_1.png)\n\n- 1. Begin a\
    \ new program with a preprocessor instruction to include the standard input/output\
    \ library functions\n```c\n#include <stdio.h>\n```\n- 2. Declare three custom\
    \ function prototypes with one argument to be passed to each one when called\n\
    ```c\nvoid display( char str[] ) ;\nint square( int x ) ;\nint cube( int y ) ;\n\
    ```\n- 3. Add a main function that declares an integer variable and a character\
    \ array variable initialized with a string of text\n```c\nint main()\n{\n    int\
    \ num ;\n    char msg[50] = \"String to be passed to a function\" ;\n}\n```\n\n\
    ### 4\nAfter the main function, define the custom functions\n\n```c\nvoid display(\
    \ char str[] )\n{\n    printf( \"%s\\n\", str );\n}\n\nint square( int x )\n{\n\
    \    return ( x * x );\n}\n\nint cube( int y )\n{\n    return ( y * y ) * y;\n\
    }\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_90_0.png)\n\nThe argument names\
    \ used in the function definition can differ from those used in the function prototype\
    \ but the argument data types, number, and order must be the same. It is clearer\
    \ to adopt the same names in both, though.\n\n### 5\nNow, in the main function,\
    \ insert statements calling each of the custom functions and passing argument\
    \ values\n\n```\ndisplay( msg );\nnum = square( 4 );\nprintf( \"4x4= %d\\n\",\
    \ num );\nprintf( \"4x4x4= %d\\n\", cube( 4 ) );\n```\n\n### 6\nAt the end of\
    \ the main function block, return a zero integer value, as required by the function\
    \ declaration\n\n```\nreturn 0 ;\n```\n\n### 7\nSave the program file, then compile\
    \ and execute the program to see the output from custom functions using passed\
    \ argument values\n\n![](img/d1dfb0563339ba187decb78799155b7f_90_1.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_90_2.png)\n\
    \nA function need not return any value but can still include the return keyword\
    \ without any following value to signify the return of control to the caller.\n\
    \n## Calling recursively\n\nStatements within custom functions can freely call\
    \ other custom functions just as readily as they can call standard library functions\
    \ like `printf()`.\n\nAdditionally, functions can call themselves, and these are\
    \ known as “recursive functions”. As with loops it is important that recursive\
    \ functions must modify a tested expression to avoid continuous execution – so\
    \ the function call ends at some point.\n\n![](img/d1dfb0563339ba187decb78799155b7f_91_0.png)\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n```c\n#include <stdio.h>\n```\n- 2. Declare\
    \ a custom function prototype with one argument to be passed when called\n```c\n\
    void count_down_from( int num );\n```\n- 3. Add a main function that declares\
    \ an integer variable\n```c\nint main()\n{\n    int start ;\n}\n```\n- 4. Next,\
    \ in the main function block, add a statement requesting the user input an integer\
    \ value to be assigned to the variable\n```c\nprintf( \"Enter a positive integer\
    \ to count down from: \" );\nscanf( \"%d\", &start );\n```\n- 5. Now, in the main\
    \ function block, add a call to the custom function, passing it the value entered\
    \ by the user\n```c\ncount_down_from( start );\n```\n- 6. In the main function\
    \ block, add a statement to output a message when control returns from the custom\
    \ function\n```c\nprintf( \"Lift Off!\\n\" );\n```\n- 7. At the end of the main\
    \ function block, return a zero integer value, as required by the function declaration\n\
    ```c\nreturn 0;\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_91_1.png)\n\n\
    The variable name must be preceded by the & address of operator in the scanf()\
