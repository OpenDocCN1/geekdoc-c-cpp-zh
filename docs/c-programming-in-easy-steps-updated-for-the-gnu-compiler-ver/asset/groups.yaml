    \ produces the integer 65. Casting integer values within these ranges to a **char**\
    \ data type produces the equivalent letter.\n\nIt is often necessary to cast integer\
    \ values into their floating-point equivalents to perform accurate arithmetic.\
    \ Division can otherwise produce a truncated integer result. For example, with\
    \ `int x=7,y=5` the statement `float z = x / y` assigns the value of 1.000000.\
    \ Accurate arithmetic requires the statement to use casts as `(float)x / (float)y`\
    \ produces the floating-point value of 1.400000.\n\nCasting long, precise floating-point\
    \ numbers from a **double** data type into a shorter **float** data type does\
    \ not simply truncate the longer value at the sixth decimal place but rounds up\
    \ or down to the nearest figure. For example, with `double decimal = 0.1234569`\
