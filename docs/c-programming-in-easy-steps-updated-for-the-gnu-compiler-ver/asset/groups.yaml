    # Grouping in a union


    In C programming, a “union” allows different pieces of data, of any data type,
    to be stored at the same memory location as the program proceeds – assigning a
    value to the union will overwrite that previously stored there. This allows efficient
    use of memory.


    A union is like a struct but is declared with the union keyword and, because of
    its nature, its members can only be assigned values individually as the program
    proceeds.


    An array of unions can be created in the same way as an array of structs was created
    in the previous example, but union members can only be initialized in the declaration
    if they are all of the same data type. A pointer to a union can be created in
    exactly the same manner in which a pointer to a struct is created and a union
    can be passed to a function just like any other variable.


    ![](img/d1dfb0563339ba187decb78799155b7f_135_0.png)


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions

    +   ```c

    +   #include <stdio.h>

    +   ```

    +   2. Next, declare an un-named structure defining a data type with three members
    and one tag name

    +   ```c

    +   typedef struct { int num ; char ltr , *str } Distinct ;

    +   ```

    +   3. Now, declare an un-named union defining a data type with three members
    and one tag name

    +   ```c

    +   typedef union { int num ; char ltr , *str ; } Unified ;

    +   ```

    +   4. Add a main function that declares a variable of the struct''s data type
    and initializes each of its members

    +   ```c

    +   int main()

    +   {

    +   Distinct sdata = { 10 , ''C'' , "Program" } ;

    +   }

    +   ```

    +   5. Now, in the main function block, declare a variable of the union data type

    +   ```c

    +   Unified udata ;

    +   ```


    ![](img/d1dfb0563339ba187decb78799155b7f_135_1.png)


    It is the programmer''s responsibility to understand which type of data is being
    stored in a union at any point in the execution of a program.'
