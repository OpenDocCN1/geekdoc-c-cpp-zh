    Values are %d and %f \\n\", num, pi );\nprintf(\"%%7d displays %7d \\n\", num\
    \ );\nprintf(\"%%07d displays %07d \\n\", num );\nprintf(\"Pi is approximately\
    \ %1.10f \\n\", pi );\nprintf(\"Right-aligned %20.3f rounded pi \\n\", pi );\n\
    printf(\"Left-aligned %-20.3f rounded pi \\n\", pi );\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_24_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_24_1.png)\n\nTo display a \"%\" character\
    \ with the printf() function, prefix it with another \"%\" character, as seen\
