  mdcn: "\n## 扫描文件流\n\nscanf() 函数用于获取用户输入，是 fscanf() 函数的简化版本，其文件流固定设置为 stdin。fscanf()\
    \ 函数允许你将要读取的文件流指定为它的第一个参数。它在读取仅包含数字的文件时还有一个优势——文本文件中的数字只是被看作一串字符，但由 fscanf() 读取时，它们可以转换为相应的数值类型。\n\
    \n同样，printf() 函数用于输出，是 fprintf() 函数的简化版本，其文件流固定设置为 stdout。fprintf() 函数允许你将要写入的文件流指定为它的第一个参数。\n\
    \n因此，fscanf() 和 fprintf() 在选择从 stdin 还是文件读取、以及写入 stdout 还是文件方面提供了很大的灵活性。\n\n![](img/d1dfb0563339ba187decb78799155b7f_149_0.png)\n\
    \n- 1. 新建一个程序，使用预处理指令包含标准输入/输出库函数\n  `#include <stdio.h>`\n\n- 2. 添加一个 main 函数，声明两个文件指针、一个整数数组变量和两个普通整数变量\n\
    \  ```c\n  int main()\n  {\n  FILE *nums_ptr , *hint_ptr ;\n  int nums[20] , i\
    \ , j ;\n  }\n  ```\n\n- 3. 接下来，在 main 函数块中，尝试打开一个现有的本地文件用于读取，并打开另一个文件用于写入\n \
    \ ```c\n  nums_ptr = fopen ( \"nums.txt\" , \"r\" ) ;\n  hint_ptr = fopen( \"\
    hint.txt\" , \"w\" ) ;\n  ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_149_1.png)\n\
    \n- 4. 现在，测试两个文件是否都已成功打开\n  ```c\n  if( nums_ptr != NULL && hint_ptr != NULL )\n\
    \  {\n  }\n  ```\n\n- 5. 在 if 块中，从文件中扫描整数并存入整数数组的元素中\n```\nfor( i = 0 ; !feof(\
    \ nums_ptr ) ; i++ )\n{\n    fscanf( nums_ptr , \"%d\" , &nums[i] ) ;\n}\n```\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_150_0.png)\n\n请注意，此示例中使用 feof() 函数来测试是否已到达文件末尾——到达时退出循环。\n\
    \n- 6. 接下来，在 if 块中，输出数组元素的值\n```\nfprintf( stdout , \"\\nTotal numbers found:\
    \ %d\\n\" , i ) ;\nfor( j=0 ; j<i ; j++ ) { fprintf( stdout , \"%d \" , nums[j]\
    \ ) ; }\n```\n\n- 7. 现在，将数组元素的值写入一个文件\n```\nfprintf( hint_ptr , \"fscanf and fprintf\
    \ are flexible\\n\" ) ;\nfor( j=0 ; j<i ; j++ ) { fprintf( hint_ptr , \"%d \"\
    \ , nums[j] ) ; }\n```\n\n- 8. 最后，在 if 块中，完成后关闭两个文件\n```\nfclose( nums_ptr ) ;\n\
    fclose( hint_ptr ) ;\n```\n\n- 9. 添加一条备用消息，用于尝试失败时显示\n```\nelse\n{\n    fprintf(\
    \ stdout , \"Unable to open a file\\n\" ) ; return 1 ;\n}\n```\n\n- 10. 保存程序文件，然后编译并执行该程序，以打开文件并输出和写入其内容\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_150_1.png)\n\nfscanf() 和 fprintf()\
    \ 函数接受的参数与 scanf() 和 printf() 相同，另外还多一个位于首位的流参数。\n\n![](img/d1dfb0563339ba187decb78799155b7f_150_2.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_150_3.png)\n\n## 报告错误\n\nC 语言在 stdio.h\
    \ 头文件中提供了一个名为 perror() 的函数，可用于打印描述性错误消息。它需要一个字符串作为唯一参数，perror() 会在该字符串后添加一个冒号，然后添加当前错误的描述。\n\
    \n此外，errno.h 头文件定义了一个名为“errno”的整数表达式，当发生错误时会被赋予一个错误代码编号。这个错误代码编号可以作为 string.h\
    \ 头文件中 strerror() 函数的参数，以输出其关联的错误消息。\n\n![](img/d1dfb0563339ba187decb78799155b7f_151_0.png)\n\
    \n- 1. 新建一个程序，使用预处理指令包含标准输入/输出函数、错误消息处理和字符串函数\n  ```c\n  #include <stdio.h>\n\
    \  #include <errno.h>\n  #include <string.h>\n  ```\n\n- 2. 添加一个 main 函数，声明一个文件指针和一个整数变量\n\
    \  ```c\n  int main()\n  {\n    FILE *f_ptr ;\n    int i ;\n  }\n  ```\n\n- 3.\
    \ 接下来，在 main 函数块中，尝试打开一个实际不存在的文件\n  ```c\n  f_ptr = fopen( \"nosuch.file\", \"\
    r\" ) ;\n  ```\n\n- 4. 输出确认信息，或者在尝试失败时输出错误消息\n  ```c\n  if( f_ptr != NULL ) {\
    \ printf( \"File opened\\n\" ) ; }\n  else { perror( \"Error\" ) ; }\n  ```\n\n\
    - 5. 现在，添加一个循环，输出与每个已定义的数值 errno 错误代码关联的错误消息\n  ```c\n  for( i = 0 ; i < 44 ;\
    \ i++ )\n  {\n    printf( \"Error %d : %s\\n\", i , strerror(i) ) ;\n  }\n  ```\n\
    \n- 6. 在 main 函数块末尾，按照函数声明的要求返回整数值零 return 0 ;\n\n- 7. 保存程序文件，然后编译并执行该程序以查看错误消息\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_152_0.png)\n\n```\nC:\\MyPrograms>gcc\
    \ errno.c -o errno.exe\nC:\\MyPrograms>errno\nError: No such file or directory\n\
    Error 0 : No error\nError 1 : Operation not permitted\nError 2 : No such file\
    \ or directory\nError 3 : No such process\nError 4 : Interrupted function call\n\
    Error 5 : Input/output error\nError 6 : No such device or address\nError 7 : Arg\
