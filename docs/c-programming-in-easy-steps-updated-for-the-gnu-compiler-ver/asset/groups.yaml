    # Functions for direct stream input and output


    The fread() and fwrite() functions contained in the stdio.h header file are most
    effective to read and write entire text files:


    ```

    size_t fread( void *ptr , size_t size , size_t nobj , FILE *stream )

    ```


    The fread() function reads from the specified stream into the specified ptr array
    pointer at most nobj objects of size size. This function returns the number of
    objects it has read, which may be less than the number requested in the function
    call.


    The status of fread() can be tested as it proceeds using the feof() function and
    ferror() functions – see the error functions listed on the opposite page


    ```

    size_t fwrite(const void *ptr, size_t size, size_t nobj, FILE *stream)

    ```


    The fwrite() function writes from the specified ptr pointer nobj objects of size
    size. It returns the number of objects that it has written. If an error occurs,
    the returned value will be less than that requested by nobj in the function call.'
