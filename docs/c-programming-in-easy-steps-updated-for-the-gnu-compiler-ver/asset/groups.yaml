    # Copying strings


    ![](img/d1dfb0563339ba187decb78799155b7f_113_0.png)


    Ensure that the target array is of sufficient size to hold all the characters
    of the string being copied – including a terminating \0 null character.


    The standard C libraries include a header file named string.h that contains special
    string-handling functions. To make these available to a program the string.h header
    file must be added with an #include directive at the start of the program.


    One of the functions in the string.h file is strlen(), which can be used to find
    the length of a string supplied as its argument. The strlen() function returns
    an integer that is the total number of characters in the string – including space
    “characters”, but excluding the final \0 null character.


    The string.h header file also provides two useful functions to copy strings from
    one array to another. The first of these is strcpy(), which requires two arguments
    to be specified. The first argument specifies the name of the target array to
    copy the string into, and the second argument specifies the name of the source
    array from where the string should be copied. So, its syntax looks like this:


    ```

    strcpy( target-array , source-array ) ;

    ```


    All characters in the source array are copied into the target array, including
    the \0 null terminating character. If there are other elements after the null
    character these are also padded with \0. This ensures that remnants from a longer
    original string are removed when a shorter string is copied into an array.


    The second string-copying function is the similarly named strncpy() function (with
    an added “n”). This is used like the strcpy() function but takes a third argument
    to specify how much of the string to copy. Its syntax therefore looks like this:


    ```

    strncpy( target-array , source-array , length ) ;

    ```


    The string being copied will begin with the first character of the source array
    but will end at the position specified by the third argument – so the final \0
    null character is not automatically copied. After the characters have been copied,
    the next element in the target array must be assigned a terminating \0 null character
    to promote the array to constant string status. Thus it is necessary to ensure
    that the target array is always one element larger than the actual number of characters
    being copied into it, including space “characters”, to accommodate the final \0
    null character.'
  md: "\n## Summary\n\n- A pointer is a variable that stores the memory address of\
    \ another variable expressed in hexadecimal.\n- The * dereference operator is\
    \ used to reference the value contained in the variable to which the pointer points.\n\
    - In a pointer variable declaration, the variable name is prefixed by the * character\
    \ to denote that the variable will be a pointer.\n- A pointer variable can be\
    \ assigned the address of another variable using the & addressof operator.\n-\
    \ Pointer arithmetic allows a pointer to move between consecutive memory places\
    \ and is especially useful for moving between array elements.\n- When an integer\
    \ variable array name is assigned to a pointer, that pointer automatically stores\
    \ the memory address of the first element of the array.\n- Pointers can be passed\
    \ as arguments to other functions.\n- Passing a pointer as a function argument\
    \ passes by reference, allowing that function to operate on the original value.\n\
    - Each element in an array of pointers can store the address of another variable.\n\
    - An array of pointers is especially useful for handling strings of characters.\n\
    - When a character string variable array name is assigned to a pointer, that pointer\
    \ automatically stores the entire string.\n- A pointer to a function must always\
    \ be enclosed within parentheses when using the * dereference operator, to avoid\
    \ compiler errors.\n- Dereferencing a function pointer calls the function to which\
    \ it points and passes any arguments specified to the pointer.\n\n## 8 Manipulating\
    \ Strings\n\n- 110 Reading strings\n- 112 Copying strings\n- 114 Joining strings\n\
    - 116 Finding substrings\n- 118 Validating strings\n- 120 Converting strings\n\
    - 121 Summary\n\n## Manipulating strings\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_0.png)\n\
    \n### Reading strings\n\nIn C programming, a string is an array of characters\
    \ that has the special \\0 null character in its last element. Each character,\
    \ including punctuation and non-printing characters such as newline, has a unique\
    \ numerical ASCII code value. This means that characters can be changed arithmetically.\
    \ For example, where **char letter = 'S'** then **letter++** changes the value\
    \ to 'T'. ASCII code values for lowercase letters are always 32 higher than those\
    \ of uppercase letters, so the case of any character can be changed by adding\
    \ or subtracting a value of 32. For example, where **char letter = 'M'** then\
    \ **letter += 32** changes the value to 'm'. As C does not have a dedicated string\
    \ data type, string variables must be created as character arrays, remembering\
    \ to add a final element for the \\0 null character to promote the array to string\
    \ constant status. This means that the name of an array then acts like an implied\
    \ pointer to the entire string of characters. The **sizeof** operator will return\
    \ the string’s array length when the string name is supplied as its argument.\
    \ A string may be assigned to an array or to a pointer of the char data type,\
    \ like this:\n\n```c\nchar arr[6] = { 'A', 'l', 'p', 'h', 'a' };\nchar *ptr =\
    \ \"Beta\";\nprintf( \"%s\", arr );    /* Outputs \"Alpha\"    */\nprintf( \"\
    %s\", ptr );    /* Outputs \"Beta\"     */\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_1.png)\n\
    \nYou can find the standard ASCII character code table on pages 162–163.\n\nString\
    \ values can be introduced into a C program by input from the user via the **scanf()**\
    \ function described on page 24. This function works well for single characters\
    \ or multiple characters forming a single word, but **scanf()** has a severe limitation\
    \ in that it stops reading when it encounters a space. This means that the user\
    \ cannot input a sentence via **scanf()** as the string gets truncated at the\
    \ space following the first word. The solution to the **scanf()** problem is provided\
    \ by two alternative functions located in the **stdio.h** header file. The first\
    \ of these is named **fgets()** and can be used to read input from the user. This\
    \ accepts all characters, including spaces, and assigns the string to a character\
    \ array specified as its first argument. Its second argument must specify the\
    \ number of characters to read, and its third argument must specify where to read\
    \ from, such as **stdin** to read standard input. The **fgets()** function automatically\
    \ adds the \\0 null character at the end of the string when the user hits the\
    \ Return key – to ensure the input has string constant status. The companion to\
    \ **fgets()** is the **puts()** function that will output a string specified as\
    \ its argument and automatically add a newline character at the end.\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_2.png)\n\
    \nIn C, character values must be enclosed by single quotes, and strings must be\
    \ enclosed by double quotes.\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_3.png)\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions.\n\n```c\n#include <stdio.h>\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_112_0.png)\n\
    \n- 2. Add a main function that declares a character array.\n\n```c\nint main()\n\
    {\n    char str[51];\n}\n```\n\n- 3. Next, in the main function block, request\
    \ input from the user and assign it to the array variable.\n\n```c\nprintf( \"\
    \\nEnter up to 50 characters with spaces:\\n\" );\nfgets( str, sizeof( str ),\
    \ stdin );\n```\n\n- 4. Now, in the main function block, output the string stored\
    \ in the array variable.\n\n```c\nprintf( \"fgets() read: \" );\nputs( str );\n\
    ```\n\n- 5. Repeat the process to see the scanf() limitation.\n\n```c\nprintf(\
    \ \"\\nEnter up to 50 characters with spaces:\\n\" );\nscanf( \"%s\", str );\n\
    printf( \"scanf() read: %s\\n\", str );\n```\n\n- 6. At the end of the main function\
    \ block, return a zero integer value, as required by the function declaration.\n\
    \n```c\nreturn 0;\n```\n\n- 7. Save the program file, then compile and execute\
    \ the program to see the string results.\n\n![](img/d1dfb0563339ba187decb78799155b7f_112_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_112_2.png)\n\nIf you don't want a newline\
    \ added after the output, use printf() instead of puts().\n\n### Copying strings\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_113_0.png)\n\nEnsure that the target\
    \ array is of sufficient size to hold all the characters of the string being copied\
    \ – including a terminating \\0 null character.\n\nThe standard C libraries include\
    \ a header file named string.h that contains special string-handling functions.\
    \ To make these available to a program the string.h header file must be added\
    \ with an #include directive at the start of the program.\n\nOne of the functions\
    \ in the string.h file is strlen(), which can be used to find the length of a\
    \ string supplied as its argument. The strlen() function returns an integer that\
    \ is the total number of characters in the string – including space “characters”,\
    \ but excluding the final \\0 null character.\n\nThe string.h header file also\
    \ provides two useful functions to copy strings from one array to another. The\
    \ first of these is strcpy(), which requires two arguments to be specified. The\
    \ first argument specifies the name of the target array to copy the string into,\
    \ and the second argument specifies the name of the source array from where the\
    \ string should be copied. So, its syntax looks like this:\n\n```c\nstrcpy( target-array\
    \ , source-array ) ;\n```\n\nAll characters in the source array are copied into\
    \ the target array, including the \\0 null terminating character. If there are\
    \ other elements after the null character these are also padded with \\0. This\
    \ ensures that remnants from a longer original string are removed when a shorter\
    \ string is copied into an array.\n\nThe second string-copying function is the\
    \ similarly named strncpy() function (with an added “n”). This is used like the\
    \ strcpy() function but takes a third argument to specify how much of the string\
    \ to copy. Its syntax therefore looks like this:\n\n```c\nstrncpy( target-array\
    \ , source-array , length ) ;\n```\n\nThe string being copied will begin with\
    \ the first character of the source array but will end at the position specified\
    \ by the third argument – so the final \\0 null character is not automatically\
    \ copied. After the characters have been copied, the next element in the target\
    \ array must be assigned a terminating \\0 null character to promote the array\
    \ to constant string status. Thus it is necessary to ensure that the target array\
    \ is always one element larger than the actual number of characters being copied\
    \ into it, including space “characters”, to accommodate the final \\0 null character.\n"
  mdcn: "\n## 摘要\n\n- 一个指针是一个变量，它存储另一个变量的内存地址，以十六进制表示。\n- * 解引用运算符* 用于引用指针所指向的变量中包含的值。\n\
    - 在指针变量声明中，变量名前面加上 * 字符以表示该变量将是一个指针。\n- 指针变量可以使用 & 取地址运算符为其分配另一个变量的地址。\n- 指针算术允许指针在连续的内存位置之间移动，尤其适用于在数组元素之间移动。\n\
    - 当整数变量数组名被赋给一个指针时，该指针会自动存储数组第一个元素的内存地址。\n- 指针可以作为参数传递给其他函数。\n- 将指针作为函数参数传递是按引用传递，允许该函数对原始值进行操作。\n\
    - 指针数组中的每个元素都可以存储另一个变量的地址。\n- 指针数组特别适用于处理字符字符串。\n- 当字符字符串变量数组名被赋给一个指针时，该指针会自动存储整个字符串。\n\
    - 使用 * 解引用运算符* 时，指向函数的指针必须始终用括号括起来，以避免编译器错误。\n- 解引用函数指针会调用其指向的函数并传递指定给该指针的任何参数。\n\
    \n## 8 操作字符串\n\n- 110 读取字符串\n- 112 复制字符串\n- 114 连接字符串\n- 116 查找子字符串\n- 118 验证字符串\n\
    - 120 转换字符串\n- 121 摘要\n\n## 操作字符串\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_0.png)\n\
    \n### 读取字符串\n\n在 C 编程中，字符串是一个字符数组，其最后一个元素具有特殊的 \\0 空字符。每个字符，包括标点符号和换行等不可打印字符，都有一个唯一的数值\
    \ ASCII 码。这意味着字符可以通过算术运算进行更改。例如，其中 **char letter = 'S'**，则 **letter++** 会将值更改为\
    \ 'T'。小写字母的 ASCII 码值总是比大写字母高 32，因此可以通过加减 32 的值来更改任何字符的大小写。例如，其中 **char letter\
    \ = 'M'**，则 **letter += 32** 会将值更改为 'm'。由于 C 没有专门的字符串数据类型，字符串变量必须作为字符数组创建，记得为\
    \ \\0 空字符添加一个最终元素，以使数组获得字符串常量状态。这意味着数组的名称随后就像指向整个字符字符串的隐式指针。**sizeof** 运算符在将字符串名称作为其参数提供时，将返回字符串的数组长度。字符串可以分配给\
    \ char 数据类型的数组或指针，如下所示：\n\n```c\nchar arr[6] = { 'A', 'l', 'p', 'h', 'a' };\n\
    char *ptr = \"Beta\";\nprintf( \"%s\", arr );    /* Outputs \"Alpha\"    */\n\
    printf( \"%s\", ptr );    /* Outputs \"Beta\"     */\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_1.png)\n\
    \n您可以在第 162–163 页找到标准 ASCII 字符代码表。\n\n字符串值可以通过用户输入引入 C 程序，使用第 24 页所述的 **scanf()**\
    \ 函数。该函数适用于单个字符或构成单个单词的多个字符，但 **scanf()** 有一个严重的限制，即在遇到空格时停止读取。这意味着用户无法通过 **scanf()**\
    \ 输入句子，因为字符串会在第一个单词后的空格处被截断。**scanf()** 问题的解决方案由位于 **stdio.h** 头文件中的两个替代函数提供。其中第一个名为\
    \ **fgets()**，可用于从用户读取输入。它接受所有字符，包括空格，并将字符串分配给作为其第一个参数指定的字符数组。其第二个参数必须指定要读取的字符数，其第三个参数必须指定从何处读取，例如\
    \ **stdin** 以读取标准输入。**fgets()** 函数在用户按下回车键时自动在字符串末尾添加 \\0 空字符——以确保输入具有字符串常量状态。**fgets()**\
    \ 的配套函数是 **puts()** 函数，它将输出作为其参数指定的字符串并自动在末尾添加换行符。\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_2.png)\n\
    \n在 C 中，字符值必须用单引号括起来，字符串必须用双引号括起来。\n\n![](img/d1dfb0563339ba187decb78799155b7f_111_3.png)\n\
    \n- 1. 使用预处理器指令开始一个新程序，以包含标准输入/输出库函数。\n\n```c\n#include <stdio.h>\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_112_0.png)\n\
    \n- 2. 添加一个 main 函数，声明一个字符数组。\n\n```c\nint main()\n{\n    char str[51];\n}\n```\n\
    \n- 3. 接下来，在 main 函数块中，从用户请求输入并将其分配给数组变量。\n\n```c\nprintf( \"\\nEnter up to 50\
    \ characters with spaces:\\n\" );\nfgets( str, sizeof( str ), stdin );\n```\n\n\
    - 4. 现在，在 main 函数块中，输出存储在数组变量中的字符串。\n\n```c\nprintf( \"fgets() read: \" );\nputs(\
    \ str );\n```\n\n- 5. 重复该过程以查看 scanf() 的限制。\n\n```c\nprintf( \"\\nEnter up to\
    \ 50 characters with spaces:\\n\" );\nscanf( \"%s\", str );\nprintf( \"scanf()\
    \ read: %s\\n\", str );\n```\n\n- 6. 在 main 函数块的末尾，返回零整数值，如函数声明所要求。\n\n```c\n\
    return 0;\n```\n\n- 7. 保存程序文件，然后编译并执行程序以查看字符串结果。\n\n![](img/d1dfb0563339ba187decb78799155b7f_112_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_112_2.png)\n\n如果您不希望在输出后添加换行符，请使用 printf()\
    \ 而不是 puts()。\n\n### 复制字符串\n\n![](img/d1dfb0563339ba187decb78799155b7f_113_0.png)\n\
    \n确保目标数组足够大，可以容纳正在复制的字符串的所有字符——包括终止的 \\0 空字符。\n\n标准 C 库包含一个名为 string.h 的头文件，其中包含特殊的字符串处理函数。为了使这些函数可供程序使用，必须在程序开始时使用\
    \ #include 指令添加 string.h 头文件。\n\nstring.h 文件中的一个函数是 strlen()，可用于查找作为其参数提供的字符串的长度。strlen()\
    \ 函数返回一个整数，即字符串中的字符总数——包括空格“字符”，但不包括最终的 \\0 空字符。\n\nstring.h 头文件还提供了两个有用的函数，用于从一个数组复制字符串到另一个数组。其中第一个是\
    \ strcpy()，它需要指定两个参数。第一个参数指定要将字符串复制到的目标数组的名称，第二个参数指定应从其中复制字符串的源数组的名称。因此，其语法如下所示：\n\
    \n```c\nstrcpy( target-array , source-array ) ;\n```\n\n源数组中的所有字符都复制到目标数组中，包括\
    \ \\0 终止空字符。如果空字符之后还有其他元素，这些元素也将用 \\0 填充。这确保了当较短的字符串复制到数组中时，较长原始字符串的残余部分被删除。\n\
    \n第二个字符串复制函数是名称相似的 strncpy() 函数（多了一个“n”）。它与 strcpy() 函数的使用方式类似，但接受第三个参数来指定要复制的字符串的多少。因此，其语法如下所示：\n\
    \n```c\nstrncpy( target-array , source-array , length ) ;\n```\n\n正在复制的字符串将从源数组的第一个字符开始，但将在第三个参数指定的位置结束——因此最终的\
    \ \\0 空字符不会自动复制。复制字符后，目标数组中的下一个元素必须分配一个终止的 \\0 空字符，以使数组获得常量字符串状态。因此，有必要确保目标数组始终比实际复制到其中的字符数大一个元素，包括空格“字符”，以容纳最终的\
    \ \\0 空字符。\n"
