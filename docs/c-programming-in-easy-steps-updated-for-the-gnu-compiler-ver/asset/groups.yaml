    4. Request memory to accommodate 100 integers

    mem = malloc( 100 * sizeof( int ) );


    ![](img/d1dfb0563339ba187decb78799155b7f_138_0.png)


    Even though an int typically occupies 4 bytes it is good practice to use the sizeof()
    operator to specify the size in case of variation.


    5. Next, output details of the allocated memory block or an advisory message if
    the request fails

    if( mem != NULL )

    {

    size = _msize( mem );

    printf( "\nSize of block for 100 ints: %d bytes\n", size );

    printf( "Beginning at %p\n", mem );

    }

    else { printf( "!!! Insufficient memory\n"); return 1; }


    ![](img/d1dfb0563339ba187decb78799155b7f_138_1.png)


    The implementation of the realloc() function can vary on different platforms.


    6. Now, attempt to enlarge the allocated memory block and output its details or
    an advisory message if the request fails

    mem = realloc( mem , size + ( 100 * sizeof( int ) ) );

    if( mem != NULL )

    {

    size = _msize( mem );

    printf( "\nSize of block for 200 ints: %d bytes\n", size );

    printf( "Beginning at %p\n", mem );

    }

    else { printf( "!!! Insufficient memory\n"); return 1; }


    7. At the end of the main function block, remember to release the allocated memory,
    then return the require zero integer value

    free( mem );

    return 0 ;


    8. Save the program file, then compile and execute the program to see the allocated
    memory blocks when the requests are successful


