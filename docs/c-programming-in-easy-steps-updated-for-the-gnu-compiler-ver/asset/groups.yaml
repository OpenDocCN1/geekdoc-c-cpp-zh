    MyPrograms>_\n```\n\n错误代码消息的范围由实现定义。Linux 系统上的范围比 Windows 平台更大。\n\n## 获取日期和时间\n\
    \n当前系统时间通常按自 1970 年 1 月 1 日 GMT 00:00:00（纪元）以来经过的秒数计算。该总计数表示根据公历的当前日期和时间，被称为“日历时间”。time.h\
    \ 头文件中提供了处理日期和时间的特殊函数，还提供了一个名为 tm 的数据类型结构体，用于存储日期和时间组成部分，如下所示：\n\n| 组件： | 说明：\
    \ |\n|---|---|\n| int tm_sec | 分钟之后的秒数，通常为 0-59 |\n| int tm_min | 小时之后的分钟数，0-59\
    \ |\n| int tm_hour | 自午夜起的小时数，0-23 |\n| int tm_mday | 月中的第几天，1-31 |\n| int tm_mon\
    \ | 自一月起的月份数，0-11 |\n| int tm_year | 自 1900 年起的年数 |\n| int tm_wday | 自星期日起的天数，0-6\
    \ |\n| int tm_yday | 自 1 月 1 日起的天数，0-365 |\n| int tm_isdst | 是否实行夏令时 |\n\n当前经过的秒数由\
    \ time( NULL ) 函数以 time_t 数据类型返回。然后可以将其指定为 localtime() 函数的参数，以转换为 tm 结构体的各个组成部分。\n\
    \n可以使用 asctime() 函数以标准日期和时间格式输出该结构体的各个组成部分。或者，可以使用 strftime() 函数以及特殊的时间格式说明符来输出各个组成部分。该函数需要四个参数，分别指定用于存储格式化日期字符串的\
    \ char 数组、字符串最大长度、用于提取所需组成部分的文本和格式说明符，以及要使用的 tm 结构体。\n\n![](img/d1dfb0563339ba187decb78799155b7f_153_0.png)\n\
    \n如果夏令时生效，夏令时组件 tm_isdst 为正数；如果未生效，则为零；如果该信息不可用，则为负数。\n\n所有时间格式说明符的完整列表包含在第 183\
    \ 页的参考部分中。\n"
