    \ loop iteration 3\n  Outer loop iteration 2\n    Inner loop iteration 1\n   \
    \ Inner loop iteration 2\n    Inner loop iteration 3\n  Outer loop iteration 3\n\
    \    Inner loop iteration 1\n    Inner loop iteration 2\n    Inner loop iteration\
    \ 3\n  C:\\MyPrograms>\n  ```\n\n## 当条件为真时循环\n\nwhile 循环是上一示例中所述 for 循环的替代方案。**while**\
    \ 循环也需要初始化器、测试表达式和递增器，但它们不像 **for** 循环那样整齐地列在一对括号内。相反，初始化器必须出现在循环块开始之前，测试表达式必须出现在\
    \ **while** 关键字之后的括号内，随后是花括号，其中包含递增器以及每次迭代要执行的语句。\n\n```\ninitializer\nwhile (\
    \ test-expression )\n{ statements-to-be-executed ; incrementer }\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_79_0.png)\n\
    \n注意，在 do while 循环中，while 语句之后需要分号终止符。\n\ndo while 循环对上述语法做了细微变化：将 do 关键字放在循环块之前，并将\
    \ while 语句移到循环块之后。\n\n```\ninitializer\ndo { statements-to-be-executed ; incrementer\
    \ }\nwhile ( test-expression ) ;\n```\n\nwhile 循环和 do while 循环都会继续迭代，直到测试表达式被判定为假，此时循环将退出。因此，循环体必须包含在某个时刻改变测试表达式求值结果的代码；否则就会创建无限循环，导致系统锁死。\n\
    \nwhile 循环与 do while 循环的显著区别在于：如果测试表达式在第一次求值时为假，while 循环一次迭代都不会执行。相反，do while\
    \ 循环始终至少执行一次迭代，因为其语句在求值之前执行。如果希望如此，do while 循环显然是最佳选择；否则，在 for 循环和 while 循环之间选择主要取决于个人偏好。一条经验法则是：for\
    \ 循环最适合执行特定次数的迭代，而 while 循环最适合迭代直到满足某个条件。\n\n![](img/d1dfb0563339ba187decb78799155b7f_79_1.png)\n\
    \n如果程序运行无限循环，在 Windows 或 Linux 系统上按 Ctrl + C 键来停止循环执行。\n\n循环与数组是完美搭档，因为每次迭代都可以轻松读取或写入连续的数组元素。\n\
    \n- 1. 使用预处理指令包含标准输入/输出库函数，开始一个新程序\n  \n  ```c\n  #include <stdio.h>\n  ```\n\n\
    ![](img/d1dfb0563339ba187decb78799155b7f_80_0.png)\n\n- 2. 添加一个 main 函数，声明一个计数器变量，然后声明并初始化一个包含三个元素的数组变量\n\
