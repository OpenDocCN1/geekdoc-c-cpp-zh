    \n## 7 岁以上儿童新书\n\n![](img/d1dfb0563339ba187decb78799155b7f_194_2.png)\n\n本书以引人入胜的故事情节，用有趣的方式、以轻松的步骤，教有志成为小程序员的孩子如何构建他们的第一个网站。\n\
    \n## 这本书？\n\n### 用通俗英语写成\n\n被术语吓到了？别担心，我们让内容保持简单明了。\n\n### 简单易学\n\n清晰的逐步说明让学习变得简单。\n\
    \n### 图文并茂\n\n我们不仅告诉你如何做，还向你展示如何做。\n\n### 全彩印刷\n\n本书采用彩色印刷，使其更易于使用，也更护眼。\n\n###\
    \ 而且物超所值\n\n还需要多说吗？\n\n£11.99 英国 / $15.99 美国\n\n《C 编程轻松学》是一本简洁而全面的指南，帮助你创建自己的\
    \ C 程序。现已推出第五版，并针对 GNU 编译器 6.3.0 版和 Windows 10 更新，这本广受欢迎的入门书让学习 C 变得轻松：\n\n- 安装并操作免费的\
    \ GNU 编译器。\n- 掌握 C 语言的关键方面：用颜色标记的示例程序，连同展示程序执行后输出的截图，使学习更加容易。\n- 下载免费示例代码，用来对照检查自己的作品。\n\
    \n所有示例演示了当前编译器在 Windows 和 Linux 操作系统上支持的 C 特性。\n\n非常适合需要基本理解过程式编程的程序员、学生以及希望进入计算机行业的新手。\n\
