    Writes the string s to the specified stream and returns a non-negative value,
    or EOF if an error occurs


    **int getc( FILE *stream )**

    The getc() function is the macro equivalent of fgetc()


    **int getchar( void )**

    The getchar() function is equivalent to getc( stdin )


    **char *gets( char *s )**

