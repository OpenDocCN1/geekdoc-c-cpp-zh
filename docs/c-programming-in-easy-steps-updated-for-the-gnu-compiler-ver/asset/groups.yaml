    on the next read. Only one pushback character per stream is guaranteed and EOF
    cannot be pushed back. This function returns the character pushed back, or EOF
    if an error occurs.


    ## Functions for direct stream input and output


    The fread() and fwrite() functions contained in the stdio.h header file are most
    effective to read and write entire text files:


    ```c

    size_t fread( void *ptr , size_t size , size_t nobj , FILE *stream )

    ```


    The fread() function reads at most nobj objects of size size from the specified
    stream into the array pointed to by ptr. This function returns the number of objects
    it has read, which may be less than the number requested in the function call.


    The status of fread() can be tested as it proceeds using the feof() and ferror()
    functions – see the error functions listed on the opposite page.


    ```c

