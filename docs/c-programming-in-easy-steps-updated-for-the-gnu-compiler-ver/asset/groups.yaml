    - 声明常量时，声明必须始终用其固定数据值初始化该常量。\n- enum 关键字会创建一系列按顺序编号的整数常量，默认从零开始。\n- 枚举系列中的任何常量都可以显式赋予一个整数值，该系列中后续常量将在此基础上递增。\n\
