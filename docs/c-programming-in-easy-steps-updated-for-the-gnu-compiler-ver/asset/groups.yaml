  - "[PAGE 77]\n\n# Looping for a number\n\nA loop is a piece of code in a program\
    \ that automatically repeats. One complete execution of all statements within\
    \ a loop is called an “iteration”, or a “pass”. The length of a loop is controlled\
    \ by a conditional test made within the loop. While the tested expression is found\
    \ to be true, the loop will continue – until the tested expression is found to\
    \ be false, at which point the loop ends.\n\nIn C programming there are three\
    \ types of loop structure – for loops, while loops, and do while loops. Perhaps\
    \ the most common of these is the for loop, which typically has this syntax:\n\
    \n```\nfor ( initializer ; test-expression ; incrementer ) { statements }\n```\n\
    \nThe initializer is used to set a starting value for a counter of the number\
    \ of iterations made by the loop. An integer variable is used for this purpose\
    \ and is traditionally named “i”.\n\nUpon each iteration of the loop the test-expression\
    \ is evaluated and that iteration will only continue while this expression is\
    \ true. When the test-expression becomes false the loop ends immediately without\
    \ executing the statements again. With every iteration the counter is incremented\
    \ then the statements executed.\n\nLoops can be nested, one within another, to\
    \ allow complete execution of all iterations of an inner nested loop on each iteration\
    \ of the outer loop.\n\n![](img/d1dfb0563339ba187decb78799155b7f_77_0.png)\n\n\
    ![](img/d1dfb0563339ba187decb78799155b7f_77_1.png)\n\n+   1. Begin a new program\
    \ with a preprocessor instruction to include the standard input/output library\
    \ functions\n+   `#include <stdio.h>`\n+   \n+   2. Add a main function that declares\
    \ two integer variables to be used later as loop iteration counters\n+   ```c\n\
    +   int main()\n+   {\n+       int i , j ;\n+   }\n+   ```\n+   \n+   3. Next,\
    \ in the main function block, insert a for loop to output the loop counter value\
    \ on each of three iterations\n+   ```c\n+   for( i = 1 ; i < 4 ; i++ )\n+   {\n\
    +       printf( \"Outer loop iteration %d\\n\" , i ) ;\n+   }\n+   ```"
  - "[PAGE 78]\n\n+   4. At the end of the main function block, return a zero integer\
    \ value, as required by the function declaration\n+       `return 0 ;`\n\n+  \
    \ 5. Save the program file, then compile and execute the program to see output\
    \ from the for loop\n\n```\n~~~\nC:\\MyPrograms>gcc forloop.c -o forloop.exe\n\
    C:\\MyPrograms>forloop\nOuter loop iteration 1\nOuter loop iteration 2\nOuter\
    \ loop iteration 3\nC:\\MyPrograms>\n~~~\n```\n\n+   6. Now, in the loop block,\
    \ insert a nested loop immediately after the existing output statement, to output\
    \ the loop counter value on each of three inner loop iterations\n\n```\n~~~\n\
    for(j = 1 ; j < 4 ; j++)\n{\n    printf( \"\\tInner loop iteration %d\\n\" , j\
    \ ) ;\n}\n~~~\n```\n\n+   7. Save the program file, then compile and execute the\
    \ program once more to see output from both loops\n\n> > **Hot Tip**\n> >\n> >\
    \ A for loop counter can also count down – by decrementing the counter value on\
