    \nRemember that the `&` address-of operator must precede the variable name in\
    \ scanf() to assign input to the variable.\n\n## Enumerating constant values\n\
    \nThe enum keyword provides a handy way to create a sequence of integer constants\
    \ in a concise manner. Optionally, the declaration can include a name for the\
    \ sequence after the enum keyword. The constant names follow as a comma-separated\
    \ list within braces.\n\nEach of the constants will, by default, have a value\
    \ one greater than that of the constant it follows in the list. Unless specified,\
    \ the first constant will have a value of zero; the next a value of 1; and so\
    \ on.\n\nFor example, named weekday constants can be given a sequence of integer\
    \ values starting at zero with `enum {MON,TUE,WED,THU,FRI};` – in this case, the\
    \ constant WED has an integer value of 2.\n\nThe constants can be assigned any\
    \ individual integer value in the declaration but the next constant in the list\
    \ will always increment the preceding value by one, unless it too is assigned\
    \ a value. For example, to begin the sequence at 1 instead of zero, assign 1 to\
    \ the first constant with `enum {MON=1,TUE,WED,THU,FRI};` – in this case, the\
    \ constant WED has an integer value of 3.\n\nThe list of enumerated constants\
    \ is also known as an \"enumeration set\" and may contain duplicate constant values.\
    \ For example, the value zero could be assigned to constants named NIL and NONE.\n\
    \nIn the following example, the enumeration set represents the points value of\
    \ balls in the game of snooker, and includes an optional name, which appears in\
    \ uppercase as it too is constant.\n\n![](img/d1dfb0563339ba187decb78799155b7f_43_0.png)\n\
    \n1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n\n   `#include <stdio.h>`\n\n2. Add a main function\
    \ that declares and initializes an enumerated set of constants starting at 1\n\
    \n   ```c\n   int main()\n   {\n     enum SNOOKER\n     { RED=1,YELLOW, GREEN,\
    \ BROWN, BLUE, PINK, BLACK };\n   }\n   ```\n\n3. Next, in the main function block,\
    \ declare an integer variable to store the sum of some constant values\n\n   `int\
    \ total ;`\n\n## Creating a constant type\n\nOnce an enumerated sequence is declared\
    \ it can be considered to be like a new data type in its own right, with properties\
    \ of its specified constant names and their associated values.\n\nVariables of\
    \ this **enum** data type can be declared in the same way that variables are declared\
    \ of other data types – using this syntax:\n\n```c\ndata-type variable-name ;\n\
    ```\n\nThe example on pages 42-43 created an enumerated sequence named **SNOOKER**,\
    \ which can be regarded as a data type of **enum SNOOKER**. So a variable named\
    \ “pair” of that data type can be created with the declaration **enum SNOOKER\
    \ pair ;** and can store values of the enumeration set defined by that type.\n\
    \nTo explicitly assign an integer value to a variable of an enumerated data type,\
    \ the C standard recommends that a cast be used to convert the **int** data type\
    \ to the **enum** data type, like this:\n\n```c\npair = ( enum SNOOKER ) 7 ;\n\
    ```\n\nIn practice this is not needed though, as enumerated values are always\
    \ integers so are equivalent to the **int** data type.\n\nAn **enum** declaration\
    \ can optionally also create a variable by specifying a variable name after the\
    \ final brace. For example, the declaration **enum BOOLEAN { FALSE , TRUE } flag\
    \ ;** defines an **enum** data type and creates a variable named “flag” of that\
    \ type.\n\nCustom data types can be defined using the **typedef** keyword and\
    \ this syntax:\n\n```c\ntypedef definition type-name ;\n```\n\nDeclaration of\
    \ custom data types can help make the program code more concise. For example,\
    \ where a program uses a number of **unsigned short int** variables it would be\
    \ useful to first create a custom data type with those modifiers, using this declaration:\n\
    \n```c\ntypedef unsigned short int USINT ;\n```\n\nEach **unsigned short int**\
    \ variable declaration can then simply use the custom data type name **USINT**\
    \ in place of **unsigned short int**.\n\n![](img/d1dfb0563339ba187decb78799155b7f_45_0.png)\n\
    \n> Although not essential, using the recommended cast to explicitly assign values\
    \ to an enumerated type variable serves as a reminder of its type.\n\n1. Begin\
    \ a new program with a preprocessor instruction to include the standard input/output\
    \ library functions\n\n   ```c\n   #include <stdio.h>\n   ```\n\n2. Add a main\
    \ function that declares and initializes an enumerated set of constants starting\
    \ at 1\n\n   ```c\n   int main()\n   {\n       enum SNOOKER\n       { RED=1,YELLOW,\
    \ GREEN, BROWN, BLUE, PINK, BLACK };\n   }\n   ```\n\n3. Next, in the main function\
    \ block, declare and initialize a variable of the defined enum type, then display\
    \ its value\n\n   ```c\n   enum SNOOKER pair = RED + BLACK ;\n   printf( \"Pair\
    \ value: %d \\n\", pair );\n   ```\n\n4. Now, add a statement to create a custom\
    \ data type\n\n   ```c\n   typedef unsigned short int USINT ;\n   ```\n\n5. Then,\
    \ declare and initialize a variable of the custom data type and display its value\n\
    \n   ```c\n   USINT num = 16 ;\n   printf( \"Unsigned short int value: %d \\n\"\
    , num );\n   ```\n\n6. At the end of the main function block, return a zero integer\
    \ value, as required by the function declaration\n\n   ```c\n   return 0 ;\n \
    \  ```\n\n7. Save the program file, then compile and execute the program to see\
    \ the value assigned to the enumerated type variable and to the custom data type\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_46_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_46_1.png)\n\
    \n```text\nC:\\MyPrograms>gcc constype.c -o constype.exe\nC:\\MyPrograms>constype\n\
    Pair value: 8\nUnsigned short int value: 16\nC:\\MyPrograms>\n```\n\n## Defining\
    \ constants\n\nThe preprocessor `#define` directive can be used to specify constant\
    \ text values that can be used in a program with this syntax:\n\n```c\n#define\
    \ CONSTANT-NAME \"text-string\"\n```\n\nLike the `#include` directive, these should\
    \ appear at the very start of the program code. Any occurrences of the specified\
    \ constant name in the program code will be substituted for the associated text\
    \ string by the preprocessor before compilation.\n\nA conditional preprocessor\
    \ `#ifdef` directive can also be used to evaluate whether a definition currently\
    \ exists. Depending on the result of the evaluation it may be followed by a `#define`\
    \ directive to specify a constant text value. This preprocessor routine is known\
    \ as a \"macro\" and each macro must end with an `#endif` directive.\n\nUsefully,\
    \ a preprocessor macro can examine compiler-defined constants to determine the\
    \ host operating system. These will vary from machine to machine, but on the Windows\
    \ platform there will typically be a constant named `__WIN32`, and on the Linux\
    \ platform there will typically be a `linux` constant. An `#ifdef` preprocessor\
    \ directive can apply an appropriate text string to identify the host platform.\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_47_0.png)\n\n1. Begin a new program\
    \ with a preprocessor instruction to include the standard input/output library\
    \ functions\n\n   ```c\n   #include <stdio.h>\n   ```\n\n2. Add three further\
    \ preprocessor directives that specify text strings for substitution in the source\
    \ code\n\n   ```c\n   #define LINE \"\"\n   #define TITLE \"C Programming in easy\
    \ steps\"\n   #define AUTHOR \"Mike McGrath\"\n   ```\n\n3. Next, add a conditional\
    \ macro that specifies a text string to identify the Windows host platform\n\n\
    \   ```c\n   #ifdef __WIN32\n   #define SYSTEM \"Windows\"\n   #endif\n   ```\n"
  mdcn: "\n## ... 继续\n\n4. 现在，插入语句请求用户输入并将其分配给变量。\n\n   ```c\n   printf(\"Enter the\
