    # Reading & writing lines


    The fgetc() function is not the most efficient way to read text into a program,
    as it must be called repeatedly to read each character. It is better to employ
    the fgets() function that reads text one whole line at a time.


    The fgets() function requires three arguments. The first argument specifies a
    char pointer or char array to which the text will be assigned. The second argument
    must be an integer specifying the maximum number of characters to read per line.
    The third argument is a file pointer specifying where to read from.


    Similarly, the fputc() function, which writes text one character at a time, is
    less efficient than the fputs() function that writes text line by line. The fputs()
    function requires two arguments to specify the text to write and a file pointer
    denoting the file to be written to. A newline character is added by fputs() after
    the line is written. This function returns zero when successful, or the EOF constant
