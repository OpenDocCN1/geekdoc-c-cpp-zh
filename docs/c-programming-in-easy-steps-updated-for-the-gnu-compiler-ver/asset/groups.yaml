    \ different. Each comma-separated list of member values must be enclosed within\
    \ a pair of braces.\n\nSimilarly, a struct can be passed as an argument to a function,\
    \ just like any other variable. The structure's data type must be specified in\
    \ both the function prototype declaration and its definition, along with a variable\
    \ name by which the function can address its member values.\n\nBut remember that\
    \ passing by value, simply using a regular variable, means that the function will\
    \ operate on a copy of the struct – its original member values will remain unchanged.\
    \ Passing the struct by reference, on the other hand, using a pointer variable,\
    \ means that the function will operate on the original struct members – so the\
    \ original member values will get changed.\n\n![](img/d1dfb0563339ba187decb78799155b7f_133_0.png)\n\
    \n> Simply assigning all the values as a comma-separated list will not work –\
    \ each set of values must be enclosed by its own pair of braces.\n\n![](img/d1dfb0563339ba187decb78799155b7f_133_1.png)\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n\n```c\n#include <stdio.h>\n```\n\n- 2. Next,\
    \ declare an un-named structure defining a data type with two members and one\
    \ tag name\n\n```c\ntypedef struct\n{\n  char *name ;\n  int quantity ;\n} Item\
    \ ;\n```\n\n- 3. Now, declare an array of the structure's data type, initializing\
    \ each member of three structures\n\n```c\nItem fruits[3] =\n{ { \"Apple\", 10\
    \ }, { \"Orange\", 20 }, { \"Pear\", 30 } };\n```\n\n- 4. Add a function prototype\
    \ that will pass a structure variable and a pointer variable to a structure as\
    \ arguments\n\n```c\nvoid display( Item val , Item *ref );\n```\n\n## Grouping\
    \ in a union\n\nIn C programming, a “union” allows different pieces of data, of\
    \ any data type, to be stored at the same memory location as the program proceeds\
    \ – assigning a value to the union will overwrite that previously stored there.\
    \ This allows efficient use of memory.\n\nA union is like a struct but is declared\
    \ with the union keyword and, because of its nature, its members can only be assigned\
    \ values individually as the program proceeds.\n\nAn array of unions can be created\
    \ in the same way as an array of structs was created in the previous example,\
    \ but union members can only be initialized in the declaration if they are all\
    \ of the same data type. A pointer to a union can be created in exactly the same\
    \ manner in which a pointer to a struct is created and a union can be passed to\
    \ a function just like any other variable.\n\n![](img/d1dfb0563339ba187decb78799155b7f_135_0.png)\n\
    \n- 1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n\n```c\n#include <stdio.h>\n```\n\n- 2. Next,\
    \ declare an un-named structure defining a data type with three members and one\
    \ tag name\n\n```c\ntypedef struct { int num ; char ltr , *str } Distinct ;\n\
    ```\n\n- 3. Now, declare an un-named union defining a data type with three members\
    \ and one tag name\n\n```c\ntypedef union { int num ; char ltr , *str ; } Unified\
    \ ;\n```\n\n- 4. Add a main function that declares a variable of the struct's\
    \ data type and initializes each of its members\n\n```c\nint main()\n{\nDistinct\
    \ sdata = { 10 , 'C' , \"Program\" } ;\n}\n```\n\n- 5. Now, in the main function\
    \ block, declare a variable of the union data type\n\n```c\nUnified udata ;\n\
    ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_135_1.png)\n\n> It is the programmer's\
    \ responsibility to understand which type of data is being stored in a union at\
    \ any point in the execution of a program.\n\n- 6. After the variable declarations,\
    \ output the value and memory address of each struct member\n\n```c\nprintf(\"\
    \\nStructure:\\nNumber: %d\", sdata.num );\nprintf(\"\\tStored at: %p\\n\", &sdata.num\
    \ );\nprintf(\"Letter: %c\", sdata.ltr );\nprintf(\"\\tStored at: %p\\n\", &sdata.ltr\
    \ );\nprintf(\"String: %s\", sdata.str );\nprintf(\"\\tStored at: %p\\n\", &sdata.str\
    \ );\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_136_0.png)\n\n- 7. Now,\
    \ assign a value to the first union member then output its value and memory address\n\
    \n```c\nudata.num = 16 ;\nprintf( \"\\nUnion:\\nNumber: %d\" , udata.num );\n\
    printf( \"\\tStored at: %p\\n\" , &udata.num );\n```\n\n- 8. Next, assign a value\
    \ to the second union member then output its value and memory address\n\n```c\n\
    udata.ltr = 'A' ;\nprintf( \"Letter: %c\" , udata.ltr );\nprintf( \"\\tStored\
    \ at: %p\\n\" , &udata.ltr );\n```\n\n- 9. Finally, assign a value to the third\
    \ union member then output its value and memory address\n\n```c\nudata.str = \"\
    Union\" ;\nprintf( \"String: %s\" , udata.str );\nprintf( \"\\tStored at: %p\\\
    n\" , &udata.str );\n```\n\n- 10. At the end of the main function block, return\
    \ a zero integer value, as required by the function declaration\n\n```c\nreturn\
    \ 0 ;\n```\n\n- 11. Save the program file, then compile and execute the program\
    \ to see the values stored in the structure, and union members and the addresses\
    \ where they are stored\n\n```text\nC:\\MyPrograms>gcc union.c -o union.exe\n\
    C:\\MyPrograms>union\nStructure:\nNumber: 10    Stored at: 0061FF24\nLetter: C\
    \     Stored at: 0061FF28\nString: Program Stored at: 0061FF2C\n\nUnion:\nNumber:\
    \ 16    Stored at: 0061FF20\nLetter: A     Stored at: 0061FF20\nString: Union\
    \ Stored at: 0061FF20\n```\n"
  mdcn: "\n## 指向结构体\n\n指向结构体数据类型的指针可以像指向常规数据类型的指针一样创建。在这种情况下，指针保存用于存储成员数据的内存区域的起始地址。\n\
    \n在 C 程序中使用指向结构体的指针非常普遍，因此甚至有一个专门的操作符来描述它。在结构体指针中，“.”点操作符可以被 \"->\" 替换，后者是一个连字符后跟大于号操作符。这种组合被称为箭头操作符。例如，指向结构体成员的指针\
    \ ptr->member 等价于 (*ptr).member。\n\n![](img/d1dfb0563339ba187decb78799155b7f_131_0.png)\n\
    \n- 1. 使用预处理器指令包含标准输入/输出库函数开始一个新程序\n\n```c\n#include <stdio.h>\n```\n\n- 2. 接下来，声明一个未命名的结构体，定义一个包含两个字符指针成员和一个标签名的数据类型\n\
    \n```c\ntypedef struct {\n  char *name; char *popn ;\n} City ;\n```\n\n- 3. 现在，添加一个\
    \ main 函数，声明三个常规变量和一个指针变量，全部为结构体数据类型\n\n```c\nint main()\n{\n  City ny , la ,\
    \ ch , *ptr ;\n}\n```\n\n- 4. 在 main 函数块内，为第一个变量的成员赋值然后显示存储的值，使用点操作符同时存储和检索值\n\
    \n```c\nny.name = \"New York City\" ;\nny.popn = \"8,274,527\" ;\nprintf( \"\\\
    n%s , Population: %s\\n\", ny.name , ny.popn ) ;\n```\n\n- 5. 将第二个变量的地址赋给指针变量\n\
    \n```c\nptr = &la ;\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_131_1.png)\n\
    \n箭头操作符在 C 编程中很有用，可用于区分结构体指针和其他指针。\n\n- 6. 现在，为第二个变量的成员赋值，然后显示存储的值，使用箭头操作符存储值并使用点操作符检索值\n\
    \n```c\nptr->name = \"Los Angeles\";\nptr->popn = \"3,834,340\";\nprintf( \"\\\
    n%s, Population: %s\\n\" , la.name, la.popn );\n```\n\n- 7. 接下来，将第三个变量的地址赋给指针变量\n\
    \n```c\nptr = &ch ;\n```\n\n- 8. 现在，为第三个变量的成员赋值，然后显示存储的值，使用箭头操作符同时存储和检索值\n\n```c\n\
    ptr->name = \"Chicago\";\nptr->popn = \"2,836,658\";\nprintf( \"\\n%s, Population:\
    \ %s\\n\" , ptr->name, ptr->popn );\n```\n\n- 9. 在 main 函数块结束时，返回零整数值，如函数声明所要求\n\
    \n```c\nreturn 0;\n```\n\n- 10. 保存程序文件，然后编译并执行程序以查看结构体成员中存储的值\n\n本示例中的人口值被指定为字符串以保留逗号分隔。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_132_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_132_1.png)\n\
    \n## 向函数传递结构体\n\n结构体成员值可以像任何其他数据类型的数值一样存储在数组中。数组按通常方式声明，但为其元素赋值的方法略有不同。每个由逗号分隔的成员值列表必须用一对大括号括起来。\n\
    \n同样，结构体可以像任何其他变量一样作为参数传递给函数。结构体的 数据类型必须在函数原型声明及其定义中同时指定，并附带一个变量名，以便函数寻址其成员值。\n\
    \n但请记住，按值传递，仅使用常规变量，意味着函数将对结构体的副本进行操作——其原始成员值将保持不变。另一方面，按引用传递结构体，使用指针变量，意味着函数将对原始结构体成员进行操作——因此原始成员值将被更改。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_133_0.png)\n\n> 简单地将所有值作为逗号分隔列表赋值是无效的——每组值必须用自己的大括号对括起来。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_133_1.png)\n\n- 1. 使用预处理器指令包含标准输入/输出库函数开始一个新程序\n\
    \n```c\n#include <stdio.h>\n```\n\n- 2. 接下来，声明一个未命名的结构体，定义一个包含两个成员和一个标签名的数据类型\n\
    \n```c\ntypedef struct\n{\n  char *name ;\n  int quantity ;\n} Item ;\n```\n\n\
    - 3. 现在，声明一个结构体数据类型的数组，初始化三个结构体的每个成员\n\n```c\nItem fruits[3] =\n{ { \"Apple\"\
    , 10 }, { \"Orange\", 20 }, { \"Pear\", 30 } };\n```\n\n- 4. 添加一个函数原型，该原型将传递一个结构体变量和一个指向结构体的指针变量作为参数\n\
    \n```c\nvoid display( Item val , Item *ref );\n```\n\n## 联合中的分组\n\n在 C 编程中，“union”允许在程序进行时将不同类型、任意数据类型的不同数据片段存储在同一内存位置——为联合赋值会覆盖之前存储在其中的内容。这允许高效使用内存。\n\
    \n联合类似于结构体，但使用 union 关键字声明，并且由于其特性，其成员只能在程序进行时单独赋予值。\n\n联合数组可以像前一个示例中创建结构体数组的方式一样创建，但联合成员只能在声明时初始化，如果它们全部是相同的数据类型。指向联合的指针可以以与指向结构体的指针完全相同的方式创建，并且联合可以像任何其他变量一样传递给函数。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_135_0.png)\n\n- 1. 使用预处理器指令包含标准输入/输出库函数开始一个新程序\n\
    \n```c\n#include <stdio.h>\n```\n\n- 2. 接下来，声明一个未命名的结构体，定义一个包含三个成员和一个标签名的数据类型\n\
    \n```c\ntypedef struct { int num ; char ltr , *str } Distinct ;\n```\n\n- 3. 现在，声明一个未命名的联合，定义一个包含三个成员和一个标签名的数据类型\n\
    \n```c\ntypedef union { int num ; char ltr , *str ; } Unified ;\n```\n\n- 4. 添加一个\
    \ main 函数，声明结构体数据类型的变量并初始化其每个成员\n\n```c\nint main()\n{\nDistinct sdata = { 10\
    \ , 'C' , \"Program\" } ;\n}\n```\n\n- 5. 现在，在 main 函数块中，声明联合数据类型的变量\n\n```c\n\
    Unified udata ;\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_135_1.png)\n\n\
    > 程序员有责任了解在程序执行过程中的任何时刻联合中存储的是哪种类型的数据。\n\n- 6. 在变量声明之后，输出每个结构体成员的值和内存地址\n\n```c\n\
    printf(\"\\nStructure:\\nNumber: %d\", sdata.num );\nprintf(\"\\tStored at: %p\\\
    n\", &sdata.num );\nprintf(\"Letter: %c\", sdata.ltr );\nprintf(\"\\tStored at:\
    \ %p\\n\", &sdata.ltr );\nprintf(\"String: %s\", sdata.str );\nprintf(\"\\tStored\
    \ at: %p\\n\", &sdata.str );\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_136_0.png)\n\
    \n- 7. 现在，为第一个联合成员赋值然后输出其值和内存地址\n\n```c\nudata.num = 16 ;\nprintf( \"\\nUnion:\\\
    nNumber: %d\" , udata.num );\nprintf( \"\\tStored at: %p\\n\" , &udata.num );\n\
    ```\n\n- 8. 接下来，为第二个联合成员赋值然后输出其值和内存地址\n\n```c\nudata.ltr = 'A' ;\nprintf( \"Letter:\
    \ %c\" , udata.ltr );\nprintf( \"\\tStored at: %p\\n\" , &udata.ltr );\n```\n\n\
    - 9. 最后，为第三个联合成员赋值然后输出其值和内存地址\n\n```c\nudata.str = \"Union\" ;\nprintf( \"String:\
    \ %s\" , udata.str );\nprintf( \"\\tStored at: %p\\n\" , &udata.str );\n```\n\n\
    - 10. 在 main 函数块结束时，返回零整数值，如函数声明所要求\n\n```c\nreturn 0 ;\n```\n\n- 11. 保存程序文件，然后编译并执行程序以查看结构体和联合成员中存储的值以及它们存储的地址\n\
