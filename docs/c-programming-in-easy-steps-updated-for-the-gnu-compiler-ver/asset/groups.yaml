    \ 函数用于释放已分配内存。\n\n## 10 Producing Results\n\n本章演示了 C 程序如何利用文件、系统时间、随机数以及简单的 Windows\
    \ 对话框。\n\n- 140 创建文件\n- 142 读取和写入字符\n- 144 读取和写入行\n- 146 读取和写入整个文件\n- 148 扫描文件流\n\
    - 150 报告错误\n- 152 获取日期和时间\n- 154 运行计时器\n- 156 生成随机数\n- 158 显示对话框\n- 160 Summary\n\
    \n### 创建文件\n\n用于处理文件的特殊数据类型在 stdio.h 头文件中定义。它称为“文件指针”，语法为 FILE *fp。文件指针用于打开、读取、写入和关闭文件。在\
    \ C 程序中，可以使用声明 FILE *file_ptr ; 创建一个名为“file_ptr”的文件指针。\n\n文件指针指向 stdio.h 头文件中定义的结构，该结构包含有关文件的信息。这包括有关当前字符以及文件是被读取还是被写入的详细信息。\n\
    \n在文件可以被读取或写入之前，它必须首先始终使用 fopen() 函数打开。这需要两个参数来指定文件的名称和位置，以及打开文件的“模式”。fopen()\
    \ 函数在成功时返回文件指针，失败时返回 NULL 值。\n\n一旦文件成功打开，就可以在指定的模式下读取文件、追加到文件或在文件中写入新文本，取决于对 fopen()\
    \ 函数的调用中指定的模式。之后，打开的文件必须始终通过调用 fclose() 函数并指定文件指针作为其唯一参数来关闭。\n\n下表列出了可以作为 fopen()\
