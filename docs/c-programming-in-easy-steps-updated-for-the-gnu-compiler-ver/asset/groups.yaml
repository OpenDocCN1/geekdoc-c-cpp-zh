  mdcn: "\n## 2 存储变量值\n\n本章演示如何使用 C 程序中的变量容器存储、检索和操作各种类型的数据。\n\n- 20 创建程序变量\n- 22\
    \ 显示变量值\n- 24 输入变量值\n- 26 限定数据类型\n- 28 使用全局变量\n- 30 注册变量\n- 32 转换数据类型\n- 34 创建数组变量\n\
    - 36 描述维度\n- 38 摘要\n\n## 创建程序变量\n\n![](img/d1dfb0563339ba187decb78799155b7f_21_0.png)\n\
    \n变量是 C 程序中的一个容器，可在计算机内存中存储数据值。存储的值可使用变量名引用。程序员可以为变量选择任何名称，只要它遵守下表中列出的命名约定即可：\n\
    \n| 命名规则 | 示例 |\n|---|---|\n| 不能包含任何 C 关键字 | volatile |\n| 不能包含算术运算符 | a+b*c |\n\
    | 不能包含标点字符 | %$#@! |\n| 不能包含任何空格 | no spaces |\n| 不能以数字开头 | 2bad |\n| 可以在其他位置包含数字\
    \ | good1 |\n| 可以包含大小写混合 | UPdown |\n| 可以包含下划线 | is_ok |\n\n![](img/d1dfb0563339ba187decb78799155b7f_21_1.png)\n\
    \n变量名在 C 中区分大小写——因此名为 \"VAR\"、\"Var\" 和 \"var\" 的变量将被视为三个不同的变量。\n\n选择有意义的变量名是良好的做法，以便使程序代码更易于理解。要在程序中创建变量，只需将其“声明”即可。变量声明的语法如下：\n\
    \n```\ndata-type variable-name ;\n```\n\n首先，声明指定变量被允许包含的数据类型。这将是下一页所述的四种数据类型之一。数据类型后跟一个空格，然后是所选的变量名，遵守上表中的命名约定。与\
    \ C 程序中的所有语句一样，声明必须以分号结束符结尾。同一数据类型的多个变量可以在单个声明中作为逗号分隔的列表创建，如下所示：\n\n```\ndata-type\
    \ variable-name-1 , variable-name-2 , variable-name-3 ;\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_21_2.png)\n\
    \nC 关键字列在本书内侧封面上的表格中。\n\nC 语言中有四种基本数据类型。它们使用下表中列出的 C 关键字定义，并附带对每种数据类型的描述：\n\n\
    | 数据类型： | 描述： | 示例： |\n|---|---|---|\n| char | 单个字节，只能存储一个字符 | 'A' |\n| int |\
    \ 整数 | 100 |\n| float | 浮点数，精确到六位小数 | 0.123456 |\n| double | 浮点数，精确到 10 位小数 |\
    \ 0.0123456789 |\n\n![](img/d1dfb0563339ba187decb78799155b7f_22_0.png)\n\nchar\
    \ 数据类型的值必须始终用单引号括起来——双引号是不正确的。\n\n四种数据类型为存储数据分配不同的机器内存量。最小的是 char 数据类型，只分配一个字节的内存；最大的是\
    \ double 数据类型，通常分配八个字节的内存。这是 float 数据类型分配的内存量的两倍，因此 double 数据类型只有在需要较长、精确的浮点数时才应使用。\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_22_1.png)\n\n在变量赋值中，= 运算符左侧的部分称为 L\
    \ 值对象，其右侧称为 R 值数据。\n\n变量声明应在程序中出现任何可执行代码之前进行。当给变量赋值时，该变量被称为已“初始化”。可选地，变量可以在声明时初始化。\n\
    \n下面的示例代码片段声明并初始化了各种变量，其适当的值如代码注释所述——描述性注释位于 /* 和 */ 之间，由编译器忽略：\n\n```\nint num1\
    \ , num2 ;    /* Declares two integer variables. */\nchar letter ;        /* Declares\
    \ a character variable. */\nfloat decimal = 7.5 ; /* Declares and initializes\
    \ a floating-point variable. */\n\nnum1 = 100 ;         /* Initializes the integer\
    \ variables. */\nnum2 = 200 ;\nletter = 'A' ;       /* Initializes the character\
    \ variable. */\n```\n\n使用预处理器指令开始一个新程序以包含标准输入/输出库函数\n\n```\n#include <stdio.h>\n\
    ```\n\n添加一个 main 函数声明并初始化两个变量\n\n```\nint main()\n{\n    int num = 100 ;\n   \
    \ double pi = 3.1415926536 ;\n}\n```\n\n在 main 函数中，在变量声明之后，插入语句以各种格式输出变量值\n\n\
    ```\nprintf(\"Integer is %d \\n\", num );\nprintf(\"Values are %d and %f \\n\"\
    , num, pi );\nprintf(\"%%7d displays %7d \\n\", num );\nprintf(\"%%07d displays\
    \ %07d \\n\", num );\nprintf(\"Pi is approximately %1.10f \\n\", pi );\nprintf(\"\
    Right-aligned %20.3f rounded pi \\n\", pi );\nprintf(\"Left-aligned %-20.3f rounded\
    \ pi \\n\", pi );\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_24_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_24_1.png)\n\n要使用 printf() 函数显示 \"%\"\
    \ 字符，请用另一个 \"%\" 字符作为前缀，如此处所示。\n\n在 main 函数块末尾，插入最后一条语句以返回零整数值，如函数声明所要求\n\n```\n\
    return 0 ;\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_24_2.png)\n\n请注意，当格式说明符分配的小数位数较少时，浮点值会被四舍五入——并非简单地截断。\n\
    \n保存程序文件，然后在命令提示符下编译并执行程序以查看变量值按指定格式输出\n\n![](img/d1dfb0563339ba187decb78799155b7f_24_3.png)\n\
    \n## 输入变量值\n\n标准输入/输出库 stdio.h 提供了一个 scanf() 函数，可用于将用户输入获取到程序中。scanf() 函数在其括号内需要两个参数，以指定要输入的数据类型和输入应存储的位置。\n\
    \nscanf() 函数的第一个参数必须是第 22 页表格中用双引号括起来的格式说明符之一——例如，“%d”，其中输入为整数值。scanf() 函数的第二个参数必须是一个变量名，其前面加上\
    \ & 字符，除非输入数据是文本字符串。& 字符在 C 编程中有多种用途，但在这种上下文中是“addressof”运算符，这意味着输入数据应存储在为该变量保留的内存位置。\n\
    \n当声明变量时，会在机器内存中为存储分配给该变量的数据预留空间。保留的字节数取决于变量的数据类型。分配的内存由唯一的变量名引用。\n\n将计算机的内存想象成一排很长的槽。每个槽都有一个唯一的地址，以十六进制格式表示。这就像一条很长的房屋道路——每栋房子都包含人们并具有唯一的数字地址。在\
    \ C 程序中，房子是槽，人们是这些地址中包含的数据。\n\nscanf() 函数也可以同时为多个变量赋值。其第一个参数必须然后包含格式说明符列表，每个说明符由空格分隔，并且整个列表必须用双引号括起来。第二个参数必须包含变量名以逗号分隔的列表，每个变量名前都加上\
    \ & addressof 运算符，对应每个指定的格式。\n\n& addressof 运算符也可以用来返回变量数据存储的十六进制内存地址。\n\n将 printf()\
    \ 函数的输出与 scanf() 函数的输入结合起来可在用户和程序之间创建基本的交互性。\n\n![](img/d1dfb0563339ba187decb78799155b7f_25_0.png)\n\
    \n字符串是特例，并在第 34 页的数组主题中演示。\n\n![](img/d1dfb0563339ba187decb78799155b7f_25_1.png)\n\
    \n请注意，scanf() 函数在遇到空格时停止读取输入。\n"
