  - '[PAGE 107]


    # Pointing to functions


    Pointers can be created that point to functions, although this ability is used
    less than pointers that point to data values.


    A pointer to a function is like a pointer to data but must always be enclosed
    within parentheses when using the * dereference operator to avoid a compiler error.
    These will also be followed by further parentheses containing any arguments to
    be passed to the function to which the pointer points.


    The function pointer contains the address in memory at which the function to which
    it points begins. When the function pointer is dereferenced, the function to which
    it points gets called, and any arguments specified to the function pointer get
    passed to the called function.


    A function pointer can even be passed as an argument to another function – so
    the receiving function may then call the function to which the function pointer
    points.


    ![](img/d1dfb0563339ba187decb78799155b7f_107_0.png)


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions

    +      `#include <stdio.h>`

    +   2. Declare a custom function prototype that has an integer argument, and another
    that has both a function pointer argument and an integer argument

    +      `int bounce(int a);`

    +      `int caller(int (*function)(int), int b);`

    +   3. Add a main function that declares an integer variable, then declares and
    initializes a function pointer variable

    +      `int main()`

    +      `{`

    +      `  int num;`

    +      `  int (*fptr)(int) = bounce;`

    +      `}`

    +   4. After the main function block, define the first custom function to output
    a received value and return an integer

    +      `int bounce(int a)`

    +      `{`

    +      `  printf("\nReceived Value: %d\n", a);`

    +      `  return ((3 * a) + 3);`

    +      `}`'
