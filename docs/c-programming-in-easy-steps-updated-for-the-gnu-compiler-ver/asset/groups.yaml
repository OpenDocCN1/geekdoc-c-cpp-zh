    \ hello 即可。\n\n![](img/d1dfb0563339ba187decb78799155b7f_16_4.png)\n\n你现在已经创建、编译并执行了简单的\
    \ Hello World 程序，这是 C 编程的起点。本书中的所有其他示例都将以相同的方式创建、编译和执行。\n\n## 理解编译\n\n在从原始 C 源代码文件生成可执行文件的过程中，编译过程实际上经历四个独立阶段，每个阶段都会生成一个新文件：\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_17_0.png)\n\n- **预处理** – 预处理器将原始源代码\
    \ `.c` 文件中的所有预处理器指令替换为实际实现这些指令的库代码。例如，为 `#include` 指令替换库代码。生成的包含替换内容的文件为文本格式，通常具有\
    \ `.i` 文件扩展名。\n- **翻译** – 编译器将 `.i` 文件中的高级指令翻译为低级汇编语言指令。生成的包含翻译内容的文件为文本格式，通常具有\
    \ `.s` 文件扩展名。\n- **汇编** – 汇编器将 `.s` 文件中的汇编语言文本指令转换为机器码。生成的包含转换内容的目标文件为二进制格式，通常具有\
    \ `.o` 文件扩展名。\n- **链接** – 链接器将一个或多个二进制目标 `.o` 文件合并为单个可执行文件。生成的文件为二进制格式，通常具有 `.exe`\
    \ 文件扩展名。\n\n严格来说，“编译”描述的是上述前三个阶段，它们处理单个源代码文本文件，并最终生成单个二进制目标文件。如果程序源代码包含语法错误，例如缺少分号语句终止符或缺少圆括号，编译器将报告这些错误，编译将失败。\n\
    \n另一方面，链接器可以处理多个目标文件，并最终生成单个可执行文件。这允许从模块化目标文件创建大型程序，而每个目标文件可能包含可复用函数。如果链接器发现多个目标文件中定义了同名函数，它会报告错误，并且不会创建可执行文件。\n\
    \n通常，编译过程中间阶段创建的临时文件会自动删除，但可以通过在编译器命令中包含 -save-temps 选项来保留它们以供检查：\n\n1. 在 MyPrograms\
    \ 目录中的命令提示符下，输入 `gcc hello.c -save-temps -o hello.exe`，然后按回车重新编译程序并保存临时文件\n2.\
    \ 在 Windows 记事本之类的纯文本编辑器中打开 hello.i 文件，查看文件最末尾的源代码，其前面是替换后的 stdio.h 库代码\n3. 现在，在纯文本编辑器中打开\
    \ hello.s 文件，查看转换为低级汇编代码的结果，并注意与 C 代码版本相比它显得多么不友好\n\n![](img/d1dfb0563339ba187decb78799155b7f_18_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_18_1.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_18_2.png)\n\
    \n用汇编语言繁琐编写的程序可以比用 C 编写的程序运行得更快，但更难开发和维护。对于传统计算机编程，C 几乎总是首选。\n\n## 总结\n\n- 美国国家标准协会（ANSI）制定了\
    \ C 编程语言公认的标准。\n- 其他编程语言，例如 C++ 和 C#，部分源自 C 语言。\n- C 语言拥有许多标准库，其中包含久经考验的函数，可用于任何程序。\n\
    - C 库包含在名称具有 .h 文件扩展名的头文件中。\n- C 程序创建为名称具有 .c 文件扩展名的纯文本文件。\n- 流行的 GNU C 编译器（GCC）包含在\
    \ Minimalist GNU for Windows（MinGW）包中。\n- 将编译器所在目录添加到系统路径，可以方便地从任何目录运行编译器。\n-\
    \ 程序具有一个或多个函数，其中包含在函数被调用时要执行的语句。\n- 每个 C 程序都必须有一个 main() 函数。\n- 函数声明首先指定函数执行后要返回的值的数据类型。\n\
    - 要执行的语句包含在 { } 花括号内，每条语句必须以 ; 分号终止符结尾。\n- 预处理器指令在程序编译的第一阶段实现，通常会替换为库代码。\n- GNU\
    \ C 编译器通过 gcc 命令运行，并且可以包含 -o 选项来命名可执行输出文件。\n- 编译过程中创建的临时文件可以使用 -save-temps 编译器命令选项保留。\n\
    \n"
