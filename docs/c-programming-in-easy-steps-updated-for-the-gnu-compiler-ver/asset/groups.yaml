    +      ```c

    +      #include <stdio.h>

    +      ```

    +   2. Add a main function that declares and initializes three integer variables
    and two character variables

    +      ```c

    +      int main()

    +      {

    +          int zero = 0 , nil = 0 , one = 1 ;

    +          char upr = ''A'' , lwr = ''a'' ;

    +      }

    +      ```

    +   3. Next, in the main function block, output the result of comparison operations
    performed on the variables

    +      ```c

    +      printf( "Equality (0==0): %d \n" , zero == nil );

    +      printf( "Equality (0==1): %d \n" , zero == one );

    +      printf( "Equality (A==a): %d \n" , upr == lwr );

    +      printf( "Inequality (A!=a): %d \n" , upr != lwr );

    +      printf( "Greater than (1>0): %d \n" , one > nil );

    +      printf( "Less than (1<0): %d \n" , one < nil );

    +      printf( "Greater or equal (0>=0): %d \n" , zero >= nil );

    +      printf( "Less or equal (1<=0): %d \n" , one <= nil );

    +      ```

    +   4. At the end of the main function block, return a zero integer value, as
    required by the function declaration

    +      ```c

    +      return 0 ;

    +      ```

    +   5. Save the program file, then compile and execute the program to see the
    results of the comparison operations


    ![](img/d1dfb0563339ba187decb78799155b7f_58_0.png)


    > > **Don''t forget:** Numerically, 1 represents a true result and 0 represents
    a false result.


    > > **Hot tip:** The ASCII code value for uppercase ''A'' is 65 and for lowercase
    ''a'' it''s 97 — so their comparison here returns 0 (false).


