    ## 1 入门


    *欢迎来到 C 的世界。本章演示如何在文本中创建 C 程序，然后如何将其编译为可执行的字节形式。*


    - 8 介绍 C 语言

    - 10 安装 C 编译器

    - 12 编写 C 程序

    - 14 编译 C 程序

    - 16 理解编译

    - 18 小结


    ### 介绍 C 语言


    ![](img/d1dfb0563339ba187decb78799155b7f_9_0.png)


    丹尼斯·M·里奇，C 编程语言的创造者。


    C 是一种紧凑的通用计算机编程语言，最初由丹尼斯·麦卡利斯泰尔·里奇为 Unix 操作系统开发。它于 1972 年首次在数字设备公司（Digital Equipment
    Corporation）的 PDP-11 计算机上实现。


    这种新编程语言被命名为“C”，因为它接替了大约 1970 年推出的名为“B”的早期编程语言。


    Unix 操作系统以及几乎所有 Unix 应用程序都是用 C 语言编写的。然而，C 并不限于特定平台，程序可以在任何支持 C 的机器上创建，包括运行 Windows
    平台的机器。


    C 的灵活性和可移植性使其非常流行，该语言于 1989 年由美国国家标准学会（ANSI）正式标准化。ANSI 标准明确规定了 C 的各个方面，从而消除了此前关于该语言精确语法的不确定性。


    ANSI C 已成为 C 语言公认的标准，本书对其进行了描述并通过示例进行了演示。


    ### 为什么要学习 C 编程？


    C 语言已经存在相当长的时间，并见证了 Java、C++ 和 C# 等更新编程语言的出现。这些新语言中有许多至少部分源自 C——但规模要大得多。更紧凑的 C
    更适合作为编程入门，因为它更简单易学。


    一旦掌握了 C 编程原理，继续学习更新的语言就会更容易。例如，C++ 是 C 的扩展，除非你先精通 C 编程，否则可能很难学习。


    尽管更新的语言提供了额外特性，C 仍然很受欢迎，因为它用途广泛且高效。如今它被用于大量平台，从微控制器到最先进的科学系统，无所不包。世界各地的程序员青睐 C，因为它使他们能在程序中获得最大的控制力和效率。


    ![](img/d1dfb0563339ba187decb78799155b7f_9_1.png)


    20 年前用 C 编写的程序在今天依然与当时一样有效。


    ### 标准 C 库


    ANSI C 定义了许多标准库，其中包含久经考验的函数，可在你自己的 C 程序中使用。


    这些库包含在“头文件”中，每个头文件的扩展名都是“.h”。下表列出了标准 C 库头文件的名称及其用途说明：


    | 库 | 描述 |

    |---|---|

    | stdio.h | 包含输入和输出函数、类型及宏定义。大多数 C 程序都使用该库，它几乎占整个 C 库的三分之一 |

    | ctype.h | 包含用于测试字符的函数 |

    | string.h | 包含用于操作字符串的函数 |

    | math.h | 包含数学函数 |

    | stdlib.h | 包含用于数字转换、存储分配等的实用函数 |

    | assert.h | 包含一个可用于向程序添加诊断信息的函数 |

    | stdarg.h | 包含一个可用于遍历函数参数列表的函数 |

    | setjmp.h | 包含一个可用于避免正常调用和返回序列的函数 |

    | signal.h | 包含用于处理程序中可能出现的异常情况的函数 |

    | time.h | 包含用于操作日期和时间组成部分的函数 |

    | limits.h | 包含 C 数据类型大小的常量定义 |

    | float.h | 包含与浮点运算相关的常量定义 |


    ![](img/d1dfb0563339ba187decb78799155b7f_10_0.png)


    函数是一段可以在 C 程序中反复复用的代码。C 库中每个函数的说明见从第 161 页开始的参考章节。


    - 1. 在打开互联网连接的情况下，启动 Web 浏览器，然后访问 sourceforge.net/projects/mingw，并单击“下载”按钮以获取
    MinGW 安装程序

    - 2. 启动安装程序，并在“安装管理器”对话框中接受建议的位置 C:\MinGW

    - 3. 选择“基本”和“C++ 编译器”项，然后单击“安装”中的“应用更改”以完成安装

    - 4. 在 Windows 的“控制面板”中，单击“系统”图标，然后选择“高级系统设置”项，以打开“系统属性”对话框

    - 5. 在“系统属性”对话框中，单击“环境变量”按钮，选择 Path 系统变量，然后单击“编辑”按钮，并添加位置 C:\MinGW\bin;

    - 6. 单击“确定”关闭每个对话框，然后打开“命令提示符”窗口，并输入命令 gcc -v，以查看编译器返回版本信息


    ![](img/d1dfb0563339ba187decb78799155b7f_12_0.png)


    MinGW C++ 编译器是位于 C:\MinGW\bin 的二进制可执行文件。为了让它可以从任何系统位置访问，现在应将此文件夹添加到系统 Path 中：


    ![](img/d1dfb0563339ba187decb78799155b7f_12_1.png)


    ![](img/d1dfb0563339ba187decb78799155b7f_12_2.png)


    由于 C++ 是 C 的扩展，任何 C++ 开发工具也可以用来编译 C 程序。


    ![](img/d1dfb0563339ba187decb78799155b7f_12_3.png)


    Path 语句中的位置地址必须以 ; 分号结尾。


    ![](img/d1dfb0563339ba187decb78799155b7f_12_4.png)


    ![](img/d1dfb0563339ba187decb78799155b7f_12_5.png)


    MinGW 安装过程可能会发生变化，但当前指南可在 mingw.org/wiki/Getting_Started 找到。


    ![](img/d1dfb0563339ba187decb78799155b7f_12_6.png)


    ### 编写 C 程序


    在 C 程序中，要执行的代码语句包含在“函数”中，函数使用以下语法格式定义：


    *数据类型 函数名* ( ) { *要执行的语句* }


    函数被调用以执行其包含的语句后，可以向调用者返回一个值。该值必须是函数名之前指定的数据类型。


    一个程序可以包含一个或多个函数，但必须始终有一个名为“main”的函数。**main()** 函数是所有 C 程序的起点，除非在程序中找到 **main()**
    函数，否则 C 编译器不会编译该代码。


    程序中的其他函数可以使用字母、数字和下划线字符任意命名，但名称不能以数字开头。此外，必须避免使用本书封面前内页表格中列出的 C 关键字。


