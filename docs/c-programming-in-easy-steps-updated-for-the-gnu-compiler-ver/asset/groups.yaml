    \ integer with `(int)num` produces the integer 5, not 6.\n\nWhen casting from\
    \ a **char** variable to an **int** variable the resulting integer value is the\
    \ numerical ASCII code value that represents that character. The uppercase alphabet\
    \ has numerical ASCII values 65-90, whereas the lowercase alphabet has 97-122.\
