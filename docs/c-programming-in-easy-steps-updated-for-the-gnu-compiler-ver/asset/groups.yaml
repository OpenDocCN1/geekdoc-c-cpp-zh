    +   3. In the main function block, first seed the random number generator with
    the current elapsed seconds value

    +   ```c

    +   srand( time(NULL) );

    +   ```

    +   4. Next, fill an array with the numbers 0-59 in sequence

    +   ```c

    +   for( i = 0 ; i < 60 ; i++ ) { nums[i] = i ; }

    +   ```

    +   5. Now, shuffle the sequence into a random order

    +   ```c

    +   for( i = 1 ; i < 60 ; i++ )

    +   {

    +    r = ( rand() % 59 ) + 1 ;

    +    temp = nums[i] ; nums[i]=nums[r] ; nums[r] = temp ;

    +   }

    +   ```

    +   6. Add the numbers from six array elements to a string

    +   ```c

    +   for( i = 1 ; i < 7 ; i++ )

    +   {

    +    sprintf( buf , "%d " , nums[i] ) ;

    +    strcat( buf , " " ) ; strcat( str , buf ) ;

    +   }

    +   ```

    +   7. Then, output the string

    +   ```c

    +   printf( "\n%6s\n\n" , str ) ;

    +   ```

    +   8. At the end of the main function block, return a zero integer value, as
    required by the function declaration

    +   ```c

    +   return 0 ;

    +   ```

    +   9. Save the program file, then compile and execute the program repeatedly
    to see a selection of six different random numbers in the range 1-59 upon each
    execution


    **Don''t forget**

    The array element nums[0] gets assigned a zero value, but this is not included
    in the shuffle as only elements 1-59 are eligible for selection.


    **Hot tip**

    Notice how the sprintf() function is used here to translate int values into char
    values that can then be concatenated to the larger text string.


