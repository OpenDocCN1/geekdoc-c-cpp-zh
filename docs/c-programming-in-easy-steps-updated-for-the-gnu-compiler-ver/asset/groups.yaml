    \ num ) ;\n```\n\nSave the program file then compile and execute the program,\
    \ inputting an integer when requested, to see the output from recursive function\
    \ calls\n\n![](img/d1dfb0563339ba187decb78799155b7f_92_0.png)\n\n![](img/d1dfb0563339ba187decb78799155b7f_92_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_92_2.png)\n\nA recursive function can\
