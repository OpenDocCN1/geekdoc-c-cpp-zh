    \n## Summary\n\n- A variable is a container in a C program in which a data value\
    \ can be stored in computer memory.\n- Variable names must adhere to the C naming\
    \ conventions.\n- The four basic data types in C are **char**, **int**, **float**,\
    \ and **double**.\n- Format specifiers %d, %f, %c, %s, and %p can be used with\
    \ the **printf()** function to display variable values of different types.\n-\
    \ User input can be assigned to variables by the **scanf()** function.\n- The\
    \ permissible range of **int** variables can be explicitly qualified using the\
    \ **short** and **long** keywords.\n- Variables that will never hold negative\
    \ values may be qualified as **unsigned** to extend their positive range.\n- The\
    \ number of memory bytes reserved by any variable can be revealed using the **sizeof**\
    \ operator.\n- Variable scope describes the extent of accessibility to a variable,\
    \ and may be local or global.\n- The **extern** keyword specifies an externally\
    \ defined variable and the **static** keyword limits accessibility to the same\
    \ source file.\n- Performance of heavily used variables may be improved using\
    \ the **register** keyword to place the variable in a machine register.\n- Variables\
    \ unsuitable for registers can be marked as **volatile**.\n- The compiler may\
    \ implicitly change data types where that is logical, or they may be changed explicitly\
    \ by casting.\n- Array variables store multiple items of data within individual\
    \ elements that are sequentially numbered – starting at zero.\n- Values in array\
    \ elements are referenced by the array variable name followed by their element\
    \ number within square brackets.\n- Array variables can have multiple indices\
    \ to create multi-dimensional arrays.\n\n## Declaring program constants\n\nWhere\
    \ a program is required to use a fixed constant data value that will never change,\
    \ it should be declared in the same way as a variable, but including the `const`\
    \ keyword in the declaration. For example, a constant representing the unchanging\
    \ integer value of one million can be declared and initialized, like this:\n\n\
    ```\nconst int MILLION = 1000000;\n```\n\nConstant declarations must always initialize\
