    \ C 源代码文件的 MyPrograms 文件夹中。在 Windows 上目录为 C:\\MyPrograms，在 Linux 系统上为 /home/MyPrograms。\n\
    \n| 文件模式 | 操作 |\n|---|---|\n| r | 打开现有文件以读取 |\n| w | 打开现有文件以写入。如果不存在则创建新文件，或打开现有文件并丢弃其所有先前内容\
