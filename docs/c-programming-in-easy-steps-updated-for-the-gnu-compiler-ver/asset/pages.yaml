    ```


    # Diagnostic functions


    The assert() function, contained in the assert.h header file, can be used to add
    diagnostics to a program:


    ```

    void assert( int expression );

    ```


    If *expression* is zero when assert( expression ) is executed the function will
    print a message on stderr, such as:


    ```

    Assertion failed: expression, file filename, line n

    ```


    The assert() function then attempts to terminate the program.


    ```

    `<stdarg.h>`

    ```


    # Argument functions


    The stdarg.h header file contains functions that can be used to step through a
    list of function arguments without first knowing their number and type. Due to
    the nature of these functions they must be implemented as “macros” within the
    function body.


    The list of arguments is assigned to a special data type named va_list. The functions
    listed in the following table manipulate a variable named “args” of the va_list
    type:


    | Function | Description |

    |---|---|

    | `va_start( va_list args, lastarg )` | Must be called once to initialize the
    `va_list` named `args` at the position in the list of the last known argument
    `lastarg`. |

    | `va_arg( va_list args, data-type )` | After `va_list args` has been initialized
    by `va_start()` each successive call to `va_arg()` will return the value of the
    next argument in the `args` list as the specified `data-type`. |

    | `va_end( va_list args )` | Must be called once after the arguments in the `va_list
    args` have been processed, before the function is exited. |'
