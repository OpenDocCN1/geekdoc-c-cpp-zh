    \ to a pointer variable. The name of a string char array acts like a pointer to\
    \ its first element so the & addressof operator is not needed when assigning a\
    \ string to a pointer variable.\n\n+   1. Begin a new program with a preprocessor\
    \ instruction to include the standard input/output library functions\n+   `#include\
