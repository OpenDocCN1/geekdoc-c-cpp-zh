  md: "6 Next, in the main function block, get the current time once more then output\
    \ the time taken to run the loop\n\n```\nstop = time( NULL );\nprintf(\"\\nRuntime:\
    \ %.0f seconds\\n\" , difftime( stop, go ) );\n```\n\n7 Finally, in the main function\
    \ block, return a zero integer value, as required by the function declaration\n\
    \n```\nreturn 0 ;\n```\n\n8 After the main function block, begin the function\
