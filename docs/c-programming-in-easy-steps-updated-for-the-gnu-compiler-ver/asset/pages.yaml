  md: "# Calling recursively\n\nStatements within custom functions can freely call\
    \ other custom functions just as readily as they can call standard library functions\
    \ like `printf()`.\n\nAdditionally, functions can call themselves, and these are\
    \ known as “recursive functions”. As with loops it is important that recursive\
    \ functions must modify a tested expression to avoid continuous execution – so\
    \ the function call ends at some point.\n\n![](img/d1dfb0563339ba187decb78799155b7f_91_0.png)\n\
    \n+   1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n+   \n+      ```c\n+      #include <stdio.h>\n\
    +      ```\n+   \n+   2. Declare a custom function prototype with one argument\
    \ to be passed when called\n+   \n+      ```c\n+      void count_down_from( int\
    \ num );\n+      ```\n+   \n+   3. Add a main function that declares an integer\
    \ variable\n+   \n+      ```c\n+      int main()\n+      {\n+          int start\
    \ ;\n+      }\n+      ```\n+   \n+   4. Next, in the main function block, add\
    \ a statement requesting the user input an integer value to be assigned to the\
    \ variable\n+   \n+      ```c\n+      printf( \"Enter a positive integer to count\
    \ down from: \" );\n+      scanf( \"%d\", &start );\n+      ```\n+   \n+   5.\
    \ Now, in the main function block, add a call to the custom function, passing\
    \ it the value entered by the user\n+   \n+      ```c\n+      count_down_from(\
    \ start );\n+      ```\n+   \n+   6. In the main function block, add a statement\
    \ to output a message when control returns from the custom function\n+   \n+ \
    \     ```c\n+      printf( \"Lift Off!\\n\" );\n+      ```\n+   \n+   7. At the\
    \ end of the main function block, return a zero integer value, as required by\
    \ the function declaration\n+   \n+      ```c\n+      return 0;\n+      ```\n\n\
    ![](img/d1dfb0563339ba187decb78799155b7f_91_1.png)\n\nThe variable name must be\
    \ preceded by the & address of operator in the scanf() function, as described\
    \ on page 24."
