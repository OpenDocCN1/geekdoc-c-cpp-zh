- pgno: 69
  md: '# # Understanding precedence


    Operator precedence defines the order in which C evaluates expressions. For instance,
    in the expression `a=6+b*3` the order of precedence determines whether the addition
    or the multiplication is completed first.


    ![](img/d1dfb0563339ba187decb78799155b7f_69_0.png)


    The `*` multiply operator is on a higher row than the `+` addition operator –
    so in the expression `a=6+b*3` the multiplication gets completed before the addition
    operation.


    The table below lists operator precedence in decreasing order, where operators
    on higher rows have precedence over those on lower rows, so their operations get
    completed first. Operators on the same row have equal precedence but the order
    of completion is determined by associativity direction. For instance, for “Left
    to right” associativity the operations on the left get completed first.


    | Operator | Associativity |

    |---|---|

    | `( )` Function call &nbsp; `[ ]` Array index<br>`->` Struct pointer &nbsp;`.`
    Struct member | Left to right |

    | `!` NOT &nbsp; `~` Bitwise NOT &nbsp; `++` Increment<br>`--` Decrement &nbsp;`+`
    Positive sign &nbsp;`sizeof`<br>`-` Negative sign &nbsp;`*` Pointer &nbsp;`&`
    Address | Right to left |

    | `*` Multiply / Divide `%` Modulus | Left to right |

    | `+` Add - Subtract | Left to right |

    | `<<` Shift left &nbsp;`>>` Shift right | Left to right |

    | `<` Less than &nbsp;`<=` Less than or equal to<br>`>` Greater than &nbsp;`>=`
    Greater than or equal to | Left to right |

    | `==` Equality `!=` Inequality | Left to right |

    | `&` Bitwise AND | Left to right |

    | `^` Bitwise XOR | Left to right |

    | `|` Bitwise OR | Left to right |

    | `&&` AND | Left to right |

    | `||` OR | Left to right |

    | `?:` Conditional | Right to left |

    | `=` `+=` `-=` `*=` `/=` `%=` `&=` `^=` `|=`<br>`<<=` `>>=` Assignment operators
    | Right to left |

    | `,` Comma | Left to right |


    ![](img/d1dfb0563339ba187decb78799155b7f_69_1.png)


    The `->` and `.` struct operators are described later in this book but are included
    here to provide a complete precedence table of all operators.'
  merge: -1
