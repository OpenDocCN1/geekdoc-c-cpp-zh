  md: "# Displaying a dialog box\n\n![](img/d1dfb0563339ba187decb78799155b7f_159_0.png)\n\
    \nNotice that the WinMain() function requires an integer to be returned upon completion,\
    \ just like the usual main() function.\n\nIn the Windows operating system, C programs\
    \ can easily produce graphical components via special functions provided by the\
    \ Windows Application Programming Interface (WINAPI). This is made available to\
    \ the program by adding a compiler directive to include the Windows-specific windows.h\
    \ header file.\n\nIn a C program for Windows, the usual main() function program\
    \ entry point is replaced by this special WinMain() function:\n\n```\nint WINAPI\
    \ WinMain( HINSTANCE hInstance,\n    HINSTANCE hPrevInstance, LPSTR lpCmdLine,\
    \ int nCmdShow )\n```\n\nThese arguments are always required in order for the\
    \ program to communicate with the operating system. The hInstance argument is\
    \ a \"handle\" reference to the program; and the hPrevInstance argument, used\
    \ in earlier Windows programming, can be safely ignored these days. The lpCmdLine\
    \ argument is a string that represents all items used on the command line to compile\
    \ the application, and the nCmdShow argument controls how the window will be displayed.\n\
    \nThe most simple graphical component to create in Windows is a basic dialog box\
    \ with just one \"OK\" button. This is created by calling this MessageBox() function:\n\
    \n```\nint MessageBox( HWND hWnd, LPCTSTR lpText,\n    LPCTSTR lpCaption, UINT\
    \ uType );\n```\n\n![](img/d1dfb0563339ba187decb78799155b7f_159_1.png)\n\nOther\
    \ MessageBox icon constants include MB_ICONERROR, MB_ICONQUESTION and MB_ICONINFORMATION.\n\
    \nThe hWnd argument is a \"handle\" reference to the parent window, if any – without\
    \ a parent window this value is specified as NULL. The lpText argument is the\
    \ message string to be displayed, and the lpCaption argument is the title to be\
    \ displayed on the dialog box. Finally, the uType argument can specify icons and\
    \ buttons using special constant values in a pipe-delimited list. For example,\
    \ the constant MB_OK adds an OK button and an exclamation icon can be added with\
    \ the constant MB_ICONEXCLAMATION.\n\nAfter compilation, a C program that creates\
    \ a dialog box can be run as usual from the command line. Additionally, it can\
    \ be run by a double-click on its executable file icon – but this will open both\
    \ a Command Prompt window and the dialog box. But the GNU C Compiler has a special\
    \ -mwindows option that can be added at the very end of the compilation command\
    \ to suppress the Command Prompt window when the program is run by a double-click."
