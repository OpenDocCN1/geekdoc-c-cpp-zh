- pgno: 61
  md: '# # Examining conditions


    ![](img/d1dfb0563339ba187decb78799155b7f_61_0.png)


    Possibly the C programmer''s favorite test operator is the `?:` conditional operator,
    also known as the "ternary" operator. This operator first evaluates an expression
    for a true or false Boolean value, then executes one of two given statements depending
    on the result of the evaluation.


    The conditional operator has this syntax:


    ```

    ~~~c

    ( test-expression ) ? if-true-do-this : if-false-do-this ;

    ~~~

    ```


    This operator could, for example, be used to evaluate whether a given number is
    odd or even by examining if there is any remainder after dividing the number by
    two, then output an appropriate string, like this:


    ```

    ~~~c

    ( 7 % 2 != 0 ) ? printf( "Odd Number" ) : printf( "Even Number" ) ;

    ~~~

    ```


    In this case, dividing seven by two does not leave a zero remainder – so the expression
    evaluates as true; therefore the first statement is executed, correctly describing
    the number as an odd value.


    The conditional operator is also useful to ensure correct grammar in output regarding
    singular and plural items, thus avoiding awkward phrases like "There is 5". The
    evaluation can simply be made within the `printf()` statement to use the appropriate
    version:


    ```

    ~~~c

    printf( "There %s %d" , ( num == 1 ) ? "is" : "are" , num ) ;

    ~~~

    ```


    In this case, when it''s true that the `num` variable has a value of one, the
    "is" version will be used, otherwise the "are" version will be used.


    The conditional operator can also be used to assign an appropriate value to a
    variable depending on the result of an evaluation. Used in this way its syntax
    looks like this:


    ```

    ~~~c

    variable = ( test-expression ) ? if-true-assign-this : if-false-assign-this ;

    ~~~

    ```


    This operator could, for example, be used to evaluate whether one given number
    is greater than another then assign the greater number to a variable, like this:


    ```

    ~~~c

    int num , a = 5 , b = 2 ;

    num = ( a > b ) ? a : b ;

    ~~~

    ```


    In this case, the value of variable `a` is greater than that of variable `b`,
    so the `num` variable is assigned the greater value of `5`.


    ![](img/d1dfb0563339ba187decb78799155b7f_61_1.png)


    Although the conditional operator is quick and easy to use it can reduce code
    readability.'
  merge: -1
  img_proc: true
