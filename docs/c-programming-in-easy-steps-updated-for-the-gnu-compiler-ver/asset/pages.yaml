  md: '# # Comparing bit values


    A byte comprises 8 bits that can each contain a 1 or a 0 to store a binary number
    representing decimal values from 0 to 255. Each bit contributes a decimal component
    only when that bit contains a 1. Components are designated right-to-left from
    the “Least Significant Bit” (LSB) to the “Most Significant Bit” (MSB). The binary
    number in the bit pattern below represents decimal 50.


    ![](img/d1dfb0563339ba187decb78799155b7f_65_0.png)


    Many C programmers never use bitwise operators but it is useful to understand
    what they are and how they may be used.


    | Bit No | 7 MSB | 6 | 5 | 4 | 3 | 2 | 1 | 0 LSB |

    |---|---|---|---|---|---|---|---|---|

    | Decimal | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | Binary | 0 | 0 | 1 | 1 | 0 | 0 | 1 | 0 |


    Although the char data type is the basic 1-byte storage unit in C programming,
    as described on page 62, it is possible to manipulate individual parts of a byte
    using “bitwise” operators.


    | Operator: | Name: | Binary number operation: |

    |---|---|---|

    | &#124; | OR | Return a 1 in each bit where either of two compared bits is a
    1<br>Example: 1010 &#124; 0101 = 1111 |

    | &amp; | AND | Return a 1 in each bit where both of two compared bits is a 1<br>Example:
    1010 &amp; 1100 = 1000 |

    | ~ | NOT | Return a 1 in each bit where the bit is not 1, and return 0 where
    the bit is 1<br>Example: ~ 1010 = 0101 |

    | ^ | XOR | Return a 1 in each bit where only one of two compared bits is a 1<br>Example:
    1010 ^ 0100 = 1110 |

    | &lt;&lt; | Shift left | Move each bit that is a 1 a specified number of bits
    to the left<br>Example: 0010 &lt;&lt; 2 = 1000 |

    | &gt;&gt; | Shift right | Move each bit that is a 1 a specified number of bits
    to the right<br>Example: 1000 &gt;&gt; 2 = 0010 |


    ![](img/d1dfb0563339ba187decb78799155b7f_65_1.png)


    Each half of a byte is known as a “nibble” (4 bits). The binary numbers in the
    examples in the table describe values stored in a nibble.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Unless programming for a device with limited resources there is seldom a need
    to utilize bitwise operators, but they can be useful. For instance, the XOR (eXclusive
    OR) operator lets you exchange values between two variables without the need for
    a third variable.


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions

    +   ```c

    +   #include <stdio.h>

    +   ```

    +   2. Add a main function that declares and initializes two integer variables,
    then outputs their initial values

    +   ```c

    +   int main()

    +   {

    +    int x = 10, y = 5;

    +    printf("\nx=%d y=%d\n", x, y);

    +   }

    +   ```

    +   3. Next, in the main function block, insert an XOR statement three times to
    exchange the variable values by binary bit manipulation

    +   ```c

    +   x = x ^ y;  /* 1010 ^ 0101 = 1111 (decimal 15) */

    +   y = x ^ y;  /* 1111 ^ 0101 = 1010 (decimal 10) */

    +   x = x ^ y;  /* 1111 ^ 1010 = 0101 (decimal 5) */

    +   ```

    +   4. Now, insert a statement to output the exchanged values

    +   ```c

    +   printf("\nx=%d y=%d\n", x, y);

    +   ```

    +   5. At the end of the main function block, return a zero integer value, as
    required by the function declaration

    +   ```c

    +   return 0;

    +   ```

    +   6. Save the program file, then compile and execute the program to see the
    XOR bitwise magic


    ![](img/d1dfb0563339ba187decb78799155b7f_66_0.png)


    ![](img/d1dfb0563339ba187decb78799155b7f_66_1.png)


    Do not confuse bitwise operators with logical operators. Bitwise operators compare
    binary numbers whereas logical operators evaluate Boolean values.


    ![](img/d1dfb0563339ba187decb78799155b7f_66_2.png)'
  merge: -1
