- pgno: 171
  md: '# <stdio.h>


    # ...cont''d


    # Functions for direct stream input and output


    The fread() and fwrite() functions contained in the stdio.h header file are most
    effective to read and write entire text files:


    ```

    size_t fread( void *ptr , size_t size , size_t nobj , FILE *stream )

    ```


    The fread() function reads from the specified stream into the specified ptr array
    pointer at most nobj objects of size size. This function returns the number of
    objects it has read, which may be less than the number requested in the function
    call.


    The status of fread() can be tested as it proceeds using the feof() function and
    ferror() functions – see the error functions listed on the opposite page


    ```

    size_t fwrite(const void *ptr, size_t size, size_t nobj, FILE *stream)

    ```


    The fwrite() function writes from the specified ptr pointer nobj objects of size
    size. It returns the number of objects that it has written. If an error occurs,
    the returned value will be less than that requested by nobj in the function call.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Error functions


    Many of the standard functions in the C library set status indicators when an
    error occurs, or when the end of a file is reached. These indicators can be tested
    using the error functions listed in the table below. Also, the integer expression
    errno, defined in the errno.h header file, may contain an error code giving more
    information about the most recent error.


    ```

    void clearerr( FILE *stream )

    ```


    The clearerr() function clears the end of file and error indicators for the specified
    stream


    ```

    int feof( FILE *stream )

    ```


    The feof() function returns a non-zero value if the end of file indicator is set
    for the specified stream


    ```

    int ferror( FILE *stream )

    ```


    The ferror() function returns a non-zero value if the error indicator is set for
    the specified stream


    ```

    void perror( const char *s )

    ```


    The perror() function prints an implementation-defined error message associated
    with the integer value contained in the errno expression. See also the strerror()
    function in the string.h header file'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'A filestream is processed by moving through the characters it contains, one
    by one. The functions in the following table can be used to manipulate the position
    in the filestream:


    ```

    int fseek(FILE *stream , long offset , int original )

    ```


    The fseek() function sets the file position in the specified stream. Subsequent
    reading or writing begins at the new position. The new position is determined
    by specifying how far to offset the position from its original position. Optionally,
    the third argument of this function can be specified as SEEK_SET (beginning),
    SEEK_CUR (current position), or SEEK_END (end of file). For a text stream the
    offset must be either zero or a value returned by the ftell() function, with the
    original position specified as SEEK_SET. The fseek() function returns non-zero
    if an error occurs


    ```

    long ftell(FILE *stream )

    ```


    The ftell() function returns the current file position of the specified stream,
    or -1 if an error occurs


    ```

    int fgetpos(FILE *stream , fpos_t *ptr )

    ```


    The fgetpos() function records the current file position of the specified stream
    in the specified ptr pointer as a special fpos_t type. This function returns a
    non-zero value if an error occurs


    ```

    int fsetpos(FILE *stream , const fpos_t *ptr )

    ```


    The fsetpos() function positions the file pointer in the specified stream at the
    position recorded by fgetpos() in the ptr pointer. This function returns a non-zero
    value if an error occurs'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Character test functions


    The ctype.h header file contains functions for testing characters. In each case,
    the character must be specified as the function''s argument. The function returns
    a non-zero value (true) when the tested condition is met, or zero (false) if it
    is not. Additionally, this header file contains two functions for converting the
    case of letters. All the functions in the ctype.h header file are listed in the
    table below, together with a description of their purpose:


    | Function: | Description: |

    |---|---|

    | isalpha( c ) | is the character a letter? |

    | isalnum( c ) | is the character a letter or a number? |

    | iscntrl( c ) | is the character a control character? |

    | isdigit( c ) | is the character a decimal digit? |

    | isgraph( c ) | is the character any printing character except a space? |

    | islower( c ) | is the character a lowercase letter? |

    | isprint( c ) | is the character any printing character including a space? |

    | ispunct( c ) | is the character any printing character except a space, a letter,
    or a digit? |

    | isspace( c ) | is the character a space, formfeed, newline, carriage return,
    horizontal tab, or vertical tab? |

    | isupper( c ) | is the character an uppercase letter? |

    | isxdigit( c ) | is the character a hexadecimal digit? |

    | int tolower( int c ) | convert the character to lowercase |

    | int toupper( int c ) | convert the character to uppercase |'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# String functions


    The string.h header file contains the following functions that can be used to
    compare and manipulate text strings:


    | Function: | Description: |

    |---|---|

    | char *strcpy( s1 , s2 ) | copy s2 to s1, then return s1 |

    | char *strncpy( s1 , s2 , n ) | copy n characters of s2 to s1, then return s1
    |

    | char *strcat( s1 , s2 ) | concatenate s2 to the end of s1, then return s1 |

    | char *strncat( s1 , s2 , n ) | concatenate n characters of s2 to the end of
    s1, then return s1 |

