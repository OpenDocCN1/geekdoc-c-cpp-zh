- pgno: 170
  md: '# Functions for character input and output


    **int fgetc( FILE *stream )**

    Returns the next character of the specified stream as a char, or the EOF constant
    if at the end of the file or if an error occurs


    **char *fgets( char *s , int n , FILE *stream )**

    Reads the next n-1 characters into the specified stream then adds a \0 null character
    at the end of the array. This function returns s, or NULL if at the end of the
    file or if an error occurs


    **int fputc( int c , FILE *stream )**

    Writes the character c to the specified stream and returns the character written
    or EOF if an error occurs


    **int fputs( const char *s , FILE *stream )**

    Writes the string s to the specified stream and returns a non-negative value,
    or EOF if an error occurs


    **int getc( FILE *stream )**

    The getc() function is the macro equivalent of fgetc()


    **int getchar( void )**

    The getchar() function is equivalent to getc( stdin )


    **char *gets( char *s )**

    Reads the next input line into an array, replacing its final newline character
    with a \0 null character. It returns s, or NULL if at the end of the file or if
    an error occurs


    **int putc( int c , FILE *stream )**

    The putc() function is the macro equivalent of fputc()


    **int putchar( int c )**

    is equivalent to putc( c , stdout )


    **int puts( const char *s )**

    Writes the string s and a newline character to stdout. It returns a non-negative
    value, or EOF if an error occurs


    **int ungetc( int c , FILE *stream )**

    Pushes the character c back onto the specified stream where it is returned on
    the next read. Only one pushback character per stream is guaranteed and EOF cannot
    be pushed back. This function returns the character pushed back, or EOF if an
    error occurs'
