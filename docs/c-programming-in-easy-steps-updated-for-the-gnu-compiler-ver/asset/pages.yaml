  md: "# # Breaking out of loops\n\nThe break keyword can be used to prematurely terminate\
    \ a loop when a specified condition is met. The break statement is situated inside\
    \ the loop statement block and is preceded by a test-expression. When the test\
    \ returns true, the loop ends immediately and the program proceeds on to the next\
    \ task. For example, in a nested inner loop it proceeds to the next iteration\
    \ of the outer loop.\n\n![](img/d1dfb0563339ba187decb78799155b7f_81_0.png)\n\n\
    +   1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n\n```\n```c\n#include <stdio.h>\n```\n```\n\n\
    +   2. Add a main function that declares two integer variables to be used later\
    \ as loop iteration counters\n\n```\n```c\nint main()\n{\n    int i, j;\n}\n```\n\
    ```\n\n+   3. Next, in the main function block, insert two nested loops to output\
    \ their counter values on each of three iterations\n\n```\n```c\nfor(i = 1; i\
    \ < 4; i++)\n{\n    for(j = 1; j < 4; j++)\n    {\n        printf(\"Running i=%d\
    \ j=%d\\n\", i, j);\n    }\n}\n```\n```\n\n+   4. At the end of the main function\
    \ block, return a zero integer value, as required by the function declaration\n\
    \n```\n```c\nreturn 0;\n```\n```\n\n+   5. Save the program file, then compile\
    \ and execute the program to see the output from nested loops\n\n![](img/d1dfb0563339ba187decb78799155b7f_81_1.png)"
