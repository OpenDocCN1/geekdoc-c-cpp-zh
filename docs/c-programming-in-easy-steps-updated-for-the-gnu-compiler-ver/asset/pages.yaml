  md: "# Defining type structures\n\nA data type defined by a structure can be declared\
    \ to be an actual data type definition by adding the **typedef** keyword at the\
    \ very beginning of the structure declaration. This identifies the structure to\
    \ be a prototype from which other structures can be declared simply using any\
    \ of its tag names – without the **struct** keyword.\n\nUsing **typedef** may\
    \ often help simplify the code by not requiring the **struct** keyword when declaring\
    \ variables of a data type defined in a structure. It is helpful, however, to\
    \ capitalize the tag name so it is easily recognizable as a structure-defined\
    \ data type.\n\nDeclarations of variables of data types defined in a structure\
    \ may optionally initialize all their members by assigning values as a comma-separated\
    \ list within braces.\n\nStructures may also be nested within other structures.\
    \ In that case, individual members are referenced using two “.” dot operators,\
    \ with the syntax *outer-structure.inner-structure.member*.\n\n+   1. Begin a\
    \ new program with a preprocessor instruction to include the standard input/output\
    \ library functions\n+   \n+      ```c\n+      #include <stdio.h>\n+      ```\n\
    +   \n+   2. Declare an un-named structure defining a data type with two members\
    \ and one tag\n+   \n+      ```c\n+      typedef struct\n+      {\n+         \
    \ int x ;\n+          int y ;\n+      } Point ;\n+      ```\n+   \n+   3. Then,\
    \ create two variables of the structure-defined data type, initializing both members\
    \ of one variable\n+   \n+      ```c\n+      Point top = { 15, 24 } ;\n+     \
    \ Point btm ;\n+      ```\n+   \n+   4. Next, add a main function that initializes\
    \ both members of the other variable of the structure-defined data type\n+   \n\
    +      ```c\n+      int main()\n+      {\n+          btm.x = 5 ;\n+          btm.y\
    \ = 8 ;\n+      }\n+      ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_127_0.png)"
