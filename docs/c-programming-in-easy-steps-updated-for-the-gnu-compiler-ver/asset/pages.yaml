  md: '# Passing pointers to functions


    In C programs, function arguments pass their data "by value" to a local variable
    inside the called function. This means that the function is not operating on the
    original value, but a copy of it.


    Passing a pointer to the original value instead overcomes this to allow the called
    function to operate on the original value. This technique passes the data "by
    reference" and is a fundamental advantage provided by pointers.


    ![](img/d1dfb0563339ba187decb78799155b7f_103_0.png)


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions `#include <stdio.h>`

    +   2. Declare two custom function prototypes that each pass a single integer
    pointer variable to a function `void twice( int *ptr );` `void thrice( int *ptr
    );`

    +   3. Add a main function that declares and initializes a regular integer variable
    with a numeric value, and an integer pointer variable with the address of that
    regular variable

    +   ```

    +   int main()

    +   {

    +       int num = 5 ;

    +       int *ptr = &num ;

    +   }

    +   ```

    +   4. Next, in the main function block, output the address stored by the pointer
    variable and the dereferenced value

    +   ```

    +   printf( "ptr stores address: %p\n" , ptr ) ;

    +   printf( "ptr dereferences value: %d\n\n" , *ptr ) ;

    +   ```

    +   5. Now, output the original value of the regular integer variable

    +   ```

    +   printf( "The num value is %d\n" , num ) ;

    +   ```


    ![](img/d1dfb0563339ba187decb78799155b7f_103_1.png)


    Notice that the pointer argument must be included in the function prototype declaration.'
  merge: -1
  img_proc: true
