  md: '# Reporting errors


    The C language provides a function named perror() in the stdio.h header file that
    can be used to print descriptive error messages. It requires a string as its sole
    argument, to which perror() adds a colon followed by a description of the current
    error.


    Additionally, the errno.h header file defines an integer expression named "errno"
    that is assigned an error code number when an error occurs. This error code number
    can be specified as the argument to a strerror() function from the string.h header
    file to output its associated error message.


    ![](img/d1dfb0563339ba187decb78799155b7f_151_0.png)


    +   1. Begin a new program with a preprocessor instruction to include the standard
    input/output functions, error message handling, and string functions

    +   ```c

    +   #include <stdio.h>

    +   #include <errno.h>

    +   #include <string.h>

    +   ```

    +   2. Add a main function that declares a file pointer and an integer variable

    +   ```c

    +   int main()

    +   {

    +     FILE *f_ptr ;

    +     int i ;

    +   }

    +   ```

    +   3. Next, in the main function block, attempt to open a file that does not
    actually exist

    +   ```c

    +   f_ptr = fopen( "nosuch.file", "r" ) ;

    +   ```

    +   4. Output a confirmation or an error message as the attempt has failed

    +   ```c

    +   if( f_ptr != NULL ) { printf( "File opened\n" ) ; }

    +   else { perror( "Error" ) ; }

    +   ```

    +   5. Now, add a loop to output the error message associated with each defined
    numerical errno error code

    +   ```c

    +   for( i = 0 ; i < 44 ; i++ )

    +   {

    +     printf( "Error %d : %s\n", i , strerror(i) ) ;

    +   }

    +   ```'
