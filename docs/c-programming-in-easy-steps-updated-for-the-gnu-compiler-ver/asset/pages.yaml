  md: '# this book?


    # It''s written in plain English


    Put off by the jargon? Don''t worry, we keep things straightforward.


    # It''s easy to follow


    Clear, step-by-step instructions make learning simple.


    # It''s fully illustrated


    We don''t just tell you how to do it, we also show you how.


    # It''s in full color


    This book''s printed in color to make it simpler to use and easier on the eye.


    # And it''s fantastic value


    Do we need to say any more?


    £11.99UK / $15.99US


    C Programming in easy steps is a concise yet comprehensive guide to help you create
    your own C programs. Now in its fifth edition and updated for the GNU Compiler
    version 6.3.0 and Windows 10, this popular primer makes learning C easy:


    +   - install and operate the free GNU Compiler.

    +   - Master the key aspects of the C language: color-coded example programs together
    with screenshots that illustrate the output when the program has been executed
    make it even easier.

    +   - Download the FREE sample code for checking against your own work.


    All examples demonstrate C features supported by current compilers on both Windows
    and Linux operating systems.


    Ideal for programmers, students and novices seeking a career in computing who
    need a fundamental understanding of procedural programming.


