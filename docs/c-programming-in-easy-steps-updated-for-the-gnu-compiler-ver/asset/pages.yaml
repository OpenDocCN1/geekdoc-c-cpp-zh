- pgno: 41
  md: "# # Declaring program constants\n\nWhere a program is required to use a fixed\
    \ constant data value that will never change, it should be declared in the same\
    \ way as a variable, but including the `const` keyword in the declaration. For\
    \ example, a constant representing the unchanging integer value of one million\
    \ can be declared and initialized, like this:\n\n```\nconst int MILLION = 1000000;\n\
    ```\n\nConstant declarations must always initialize the constant object with the\
    \ data value they will contain. The program can never change the value of a constant\
    \ from its initial value. This safeguards the constant value from accidental alteration,\
    \ as the compiler will report an error if the program attempts to subsequently\
    \ alter the initial value.\n\nConstant names are subject to the same naming conventions\
    \ as variable names (described on page 20) but it is traditional to use uppercase\
    \ characters for constant names – to easily distinguish them from variable names\
    \ when reading the source code.\n\nThe `const` keyword can also be used in an\
    \ array declaration if all its initial element values are never to be changed\
    \ by the program.\n\n+   1. Begin a new program with a preprocessor instruction\
    \ to include the standard input/output library functions\n+   \n+      ```c\n\
    +      #include <stdio.h>\n+      ```\n\n+   2. Add a main function that declares\
    \ a constant value approximating the mathematical value of Pi\n+   \n+      ```c\n\
    +      int main()\n+      {\n+          const float PI = 3.141593;\n+      }\n\
    +      ```\n\n+   3. Next, in the main function block, insert statements declaring\
    \ four variables\n+   \n+      ```c\n+      float diameter;\n+      float radius;\n\
    +      float circ;\n+      float area;\n+      ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_41_0.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_41_1.png)"
