- pgno: 165
  md: '# Input & output functions


    The functions and types defined in the stdio.h header file represent almost one
    third of the C language library. It is used to introduce data into a program and
    generate output from a program.


    A “stream” is a data source terminated by a \n newline character. It may be read
    or written by “opening” the stream, and terminated by “closing” it. Opening a
    stream returns a FILE type pointer in which information needed to control the
    stream is stored.


    The functions listed in the following table perform file operations:


    # File-handling functions


    ```

    FILE fopen( const char *filename , const char mode )

    ```


    The fopen() function returns a FILE pointer, or NULL if the file cannot be opened.
    Any of the following modes may be specified in the function call:


    +   - r  open a text file for reading only

    +   - w  create a text file to write to, and discard any previous contents

    +   - a  append – open or create a text file for writing at the end of the file

    +   - r+  open a text file to update (read and write)

    +   - w+  open a text file to update (read and write, discarding any previous
    contents)

    +   - a+  append – open or create a text file for update, for writing at the end
    of the file


    If the file being opened is a binary file, a b should be added after the file
    mode – for example, wb+


    ```

    FILE freopen( const char *filename , const char mode , FILE *stream )

    ```


    The freopen() function opens a file with the specified mode and associates the
    stream with it. It returns the stream, or NULL if an error occurs. This function
    is normally used to change the files associated stdin, stdout or stderr


    ```

    int fflush( FILE *stream )

    ```


    On an output stream this function causes any buffered data to be written immediately.
    It returns the EOF constant for a write error, or zero otherwise. A call to fflush(
    NULL ) flushes all output streams'
