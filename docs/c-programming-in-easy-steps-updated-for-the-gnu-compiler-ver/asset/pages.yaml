  md: '# Placing functions in headers


    The example programs listed throughout this book are necessarily small due to
    space considerations but in reality, most C programs will contain significantly
    more code.


    When developing larger programs, some thought should be given to program structure.
    Maintaining the entire program code in a single file can become unwieldy as the
    program grows.


    In order to simplify the program structure, a custom header file can be created
    to contain functions that may be used repeatedly. This should be named with a
    “.h” file extension, like the standard header files in the C library.


    The functions in the custom header file can be made available to the program by
    adding an #include preprocessor directive at the start of the file containing
    the main() function. The custom header file name should be enclosed within double
    quotes in the preprocessor directive though, rather than by the < and > angled
    brackets that are used to include standard header files.


    ![](img/d1dfb0563339ba187decb78799155b7f_93_0.png)


    ![](img/d1dfb0563339ba187decb78799155b7f_93_1.png)


    +   1. Create a custom header file named “utils.h” containing the definition of
    a single function

    +   ```c

    +   int square( int num )

    +   {

    +    return ( num * num ) ;

    +   }

    +   ```

    +   2. Begin a new program with a preprocessor instruction to include the standard
    input/output library functions and the custom header file

    +   ```c

    +   #include <stdio.h>

    +   #include "utils.h"

    +   ```

    +   3. Declare a custom function prototype with no arguments

    +   ```c

    +   void getnum() ;

    +   ```

    +   4. Add a main function to call the other function then return a zero integer
    as required by the declaration

    +   ```c

    +   int main()

    +   {

    +    getnum() ;

    +    return 0 ;

    +   }

    +   ```'
