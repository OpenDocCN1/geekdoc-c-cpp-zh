  md: '# Preface


    The creation of this book has provided me, Mike McGrath, a welcome opportunity
    to update my previous books on C programming with the latest techniques. All examples
    I have given in this book demonstrate features supported by current compilers
    on both Windows and Linux operating systems, and the book''s screenshots illustrate
    the actual results produced by compiling and executing the listed code.


    # Conventions in this book


    In order to clarify the code listed in the steps given in each example, I have
    adopted certain colorization conventions. Components of the C language itself
    are colored blue; numeric and string values are red; programmer-specified names
    are black; and comments are green, like this:


    ```

    /* Store then output a text string value. */

    char *myMessage = "Hello from C";

    printf(myMessage);

    ```


    Additionally, in order to identify each source code file described in the steps,
    a colored icon and file name appears in the margin alongside the steps:


    ![](img/d1dfb0563339ba187decb78799155b7f_7_0.png)


    # Grabbing the source code


    For convenience I have placed source code files from the examples featured in
    this book into a single ZIP archive, which you can obtain by following these easy
    steps:


    +   1. Browse to www.ineasysteps.com then navigate to Free Resources and choose
    the Downloads section

    +   2. Find C Programming in easy steps, 5th edition in the list, then click on
    the hyperlink entitled All Code Examples to download the archive

    +   3. Now, extract the archive contents to any convenient location on your computer


    I sincerely hope you enjoy discovering the powerful expressive possibilities of
    C programming and have as much fun with it as I did in writing this book.


    Mike McGrath'
