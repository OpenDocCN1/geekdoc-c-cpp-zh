- pgno: 163
  md: '# ASCII character codes


    ASCII (American Standard Code for Information Interchange) is the standard representation
    of characters by numerical code. The non-printing character codes, originally
    developed for teletypes, are now rarely used for their intended original purpose.


    There are also extended ASCII code sets from 128-255 (not listed) containing accented
    characters and symbols, but these sets do vary.


    Note that the character represented by character code 32 is not missing – it is,
    in fact, the non-printing space character. Also, the character represented by
    character code 127 is the delete character.


    | Code | Char | Description |

    |---|---|---|

    | 0 | NUL | null |

    | 1 | SOH | start of heading |

    | 2 | STX | start of text |

    | 3 | ETX | end of text |

    | 4 | EOT | end of transmission |

    | 5 | ENQ | enquiry |

    | 6 | ACK | acknowledgement |

    | 7 | BEL | bell |

    | 8 | BS | backspace |

    | 9 | TAB | horizontal tab |

    | 10 | NL | newline |

    | 11 | VT | vertical tab |

    | 12 | FF | form feed |

    | 13 | CR | carriage return |

    | 14 | SO | shift out |

    | 15 | SI | shift in |


    | Code | Char | Description |

    |---|---|---|

    | 16 | DLE | data link escape |

    | 17 | DC1 | device control 1 |

    | 18 | DC2 | device control 2 |

    | 19 | DC3 | device control 3 |

    | 20 | DC4 | device control 4 |

    | 21 | NAK | neg. acknowledge |

    | 22 | SYN | synchronous file |

    | 23 | ETB | end of trans. block |

    | 24 | CAN | cancel |

    | 25 | EM | end of medium |

    | 26 | SUB | substitute |

    | 27 | ESC | escape |

    | 28 | FS | file separator |

    | 29 | GS | group separator |

    | 30 | RS | record separator |

    | 31 | US | unit separator |'
