- pgno: 137
  md: "# Allocating memory\n\nThe standard C stdlib.h library header file provides\
    \ memory management functions, with which a program can explicitly request memory\
    \ be made available as the program executes. The malloc() function requires a\
    \ single integer argument to specify how many bytes of memory to allocate, whereas\
    \ the calloc() function requires two integer arguments that get multiplied together\
    \ to specify how many bytes of memory to allocate. Both of these functions return\
    \ a pointer to the beginning of the memory block when successful, or a NULL value\
    \ upon failure.\n\nMemory previously allocated with malloc() or calloc() can be\
    \ increased with the realloc() function. This requires the pointer to the allocated\
    \ memory block as its first argument, and an integer specifying the new block\
    \ size as its second argument. It returns a pointer to the beginning of the enlarged\
    \ memory block when successful, or a NULL value upon failure.\n\nAll memory allocated\
    \ with these functions should be released when no longer required by specifying\
    \ the memory block pointer as the argument to the free() function.\n\nThere is\
    \ no standard C function to determine the size of a dynamically allocated memory\
    \ block but this can be discovered with platform-specific functions. On Windows\
    \ there is _msize() and on Linux there is malloc_usable_size(). Both these functions\
    \ require the memory block pointer as their argument.\n\n![](img/d1dfb0563339ba187decb78799155b7f_137_0.png)\n\
    \nThe calloc() function clears all allocated memory space to zero, but malloc()\
    \ leaves whatever values are already there.\n\n![](img/d1dfb0563339ba187decb78799155b7f_137_1.png)\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_137_2.png)\n\nOn Linux systems, replace\
    \ the _msize prototype declaration and function calls with the alternative malloc_usable_size.\n\
    \n+   1. Begin a new program with preprocessor instructions to include the standard\
    \ library input/output functions and memory management functions\n+   2. Declare\
    \ a Windows-specific function prototype\n+   3. Add a main function that declares\
    \ an integer variable and an integer pointer variable\n\n```\n#include <stdio.h>\n\
    #include <stdlib.h>\n```\n\n```\nint _msize( int *bytes );\n```\n\n```\nint main()\n\
    {\n    int size, *mem;\n}\n```"
  merge: -1
  img_proc: true
