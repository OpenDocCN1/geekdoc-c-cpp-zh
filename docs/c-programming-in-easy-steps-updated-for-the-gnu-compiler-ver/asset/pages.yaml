  md: "![](img/d1dfb0563339ba187decb78799155b7f_83_0.png)\n\n# Going to labels\n\n\
    The goto keyword supposedly allows the program flow to jump to labels at other\
    \ points in the program code, much like a hyperlink on a web page. However, in\
    \ reality this can cause errors; its use is frowned upon; and it is considered\
    \ bad programming practice.\n\nThe goto keyword jump is a powerful feature that\
    \ has existed in computer programs for decades, but its power was abused by many\
    \ early programmers who created programs that jumped around in an unfathomable\
    \ manner. This produced unreadable program code, so the use of goto became hugely\
    \ unpopular.\n\nOne possible valid use of the goto keyword is to break cleanly\
    \ from an inner nested loop by jumping to a label just after the end of its outer\
    \ loop block. This immediately exits both loops so no further iterations of either\
    \ loop are executed.\n\n![](img/d1dfb0563339ba187decb78799155b7f_83_1.png)\n\n\
    ![](img/d1dfb0563339ba187decb78799155b7f_83_2.png)\n\nNotice that the goto statement\
    \ specifies the label by name only, but the label itself must have a terminating\
    \ : colon.\n\n+   1. Begin a new program with a preprocessor instruction to include\
    \ the standard input/output library functions.\n+   \n+   ```c\n+   #include <stdio.h>\n\
    +   ```\n\n+   2. Add a main function that declares two integer variables to be\
    \ used later as loop iteration counters.\n+   \n+   ```c\n+   int main()\n+  \
    \ {\n+       int i, j;\n+   }\n+   ```\n\n+   3. Next, in the main function block,\
    \ insert two nested loops to output their counter values on each of three iterations.\n\
    +   \n+   ```c\n+   for( i = 1; i < 4; i++ )\n+   {\n+       for( j = 1; j < 4;\
    \ j++ )\n+       {\n+           printf( \"Running i=%d j=%d\\n\", i, j );\n+ \
    \      }\n+   }\n+   ```\n\n+   4. Insert a statement as the first line of the\
    \ inner nested loop, to jump to a label named “end” at a specified counter value.\n\
    +   \n+   ```c\n+   if( i == 2 && j == 1 ) { goto end; }\n+   ```\n\n+   5. Now,\
    \ add the label after the closing brace of the outer loop.\n+   \n+   ```c\n+\
    \   } end:\n+   ```"
