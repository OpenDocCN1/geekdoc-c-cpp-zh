    \ in millimeters: \");\n+   scanf(\"%f\", &diameter);\n+   ```\n\n+   5. Next,\
    \ add statements to calculate values for the other three variables using the constant\
    \ value and user input.\n+   \n+   ```c\n+   circ = PI * diameter;\n+   radius\
    \ = diameter / 2;\n+   area = PI * (radius * radius);\n+   ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_42_0.png)\n\
    \nHere the * asterisk character is the arithmetical multiplication operator, and\
    \ the / forward slash character is the division operator. Arithmetical operators\
