- pgno: 153
  md: '# # Getting the date and time


    Current system time is usually counted as the number of seconds elapsed since
    the Epoch at 00:00:00 GMT on January 1, 1970. The total count represents the current
    date and time according to the Gregorian calendar and is referred to as “Calendar
    time”. Special functions to handle date and time are provided in the time.h header
    file along with a data type struct named tm in which to store date and time components,
    as below:


    | Component: | Description: |

    |---|---|

    | int tm_sec | seconds after the minute, normally 0-59 |

    | int tm_min | minutes after the hour, 0-59 |

    | int tm_hour | hours since midnight, 0-23 |

    | int tm_mday | day of the month, 1-31 |

    | int tm_mon | months since January, 0-11 |

    | int tm_year | years since 1900 |

    | int tm_wday | days since Sunday, 0-6 |

    | int tm_yday | days since January 1st, 0-365 |

    | int tm_isdst | is Daylight Saving Time in effect |


    The current elapsed seconds count is returned by a time( NULL ) function as a
    time_t data type. This can then be specified as the argument to a localtime()
    function for conversion to its various tm struct components.


    The struct components can be output in a standard date and time format using an
    asctime() function. Alternatively, individual components can be output using special
    time format specifiers with a strftime() function. This function requires four
    arguments to specify a char array in which to store the formatted date string,
    the maximum string length, the text and format specifiers to extract the required
    components, and the tm struct to be used.


    ![](img/d1dfb0563339ba187decb78799155b7f_153_0.png)


    The Daylight Saving component tm_isdst is positive if Daylight Saving is in effect,
    zero if not, or negative if that information is unavailable.


    A complete list of all time format specifiers is included in the Reference section
    on page 183.'
