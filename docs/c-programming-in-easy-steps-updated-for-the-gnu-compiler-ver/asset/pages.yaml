- pgno: 59
  md: '# Assessing logic


    The logical operators most commonly used in C programming are listed in the table
    below:


    | Operator: | Operation: |

    |---|---|

    | && | Logical AND |

    | || | Logical OR |

    | ! | Logical NOT |


    The logical operators are used with operands that have the Boolean values of true
    or false, or an expression that can convert to true or false.


    The logical && AND operator will evaluate two operands and return true only if
    both operands are themselves true. Otherwise, the && AND operator will return
    false.


    This is used in conditional branching, where the direction of a C program is determined
    by testing two conditions. If both conditions are satisfied, the program will
    go in a certain direction, otherwise it will take a different direction.


    Unlike the && AND operator that needs both operands to be true, the || OR operator
    will evaluate two operands and return true if either one of the operands is itself
    true. If neither operand is true then the || OR operator will return false. This
    is useful in C programming to perform a certain action if either one of two test
    conditions has been met.


    ![](img/d1dfb0563339ba187decb78799155b7f_59_0.png)


    The term "Boolean" refers to a system of logical thought developed by the English
    mathematician George Boole (1815-1864).


    The third logical ! NOT operator is a "unary" operator – that is used before a
    single operand. It returns the inverse value of the given operand, so if the variable
    var is a true value then !var would return a false value. The ! NOT operator is
    useful in C programming to toggle the value of a variable in successive loop iterations
    with a statement like var = !var. This ensures that on each pass the value is
    reversed, like flicking a light switch on and off.


    In C programming, a zero represents the Boolean false value; and any non-zero
    value, such as 1, represents the Boolean true value.'
  merge: -1
  img_proc: true
