    \ to output the calculated values formatted to two decimal places.\n+   \n+  \
    \ ```c\n+   printf(\"\\n\\tCircumference is %.2f mm\", circ);\n+   printf(\"\\\
    n\\tAnd the area is %.2f sq.mm\\n\", area);\n+   ```\n\n+   7. At the end of the\
    \ main function block, return a zero integer value, as required by the function\
