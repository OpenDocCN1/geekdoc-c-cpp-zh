- pgno: 111
  md: '# Manipulating strings


    ![](img/d1dfb0563339ba187decb78799155b7f_111_0.png)


    # Reading strings


    In C programming, a string is an array of characters that has the special \0 null
    character in its last element. Each character, including punctuation and non-printing
    characters such as newline, has a unique numerical ASCII code value. This means
    that characters can be changed arithmetically. For example, where **char letter
    = ‘S’** then **letter++** changes the value to ‘T’. ASCII code values for lowercase
    letters are always 32 higher than those of uppercase letters, so the case of any
    character can be changed by adding or subtracting a value of 32. For example,
    where **char letter = ‘M’** then **letter += 32** changes the value to ‘m’. As
    C does not have a dedicated string data type, string variables must be created
    as character arrays, remembering to add a final element for the \0 null character
    to promote the array to string constant status. This means that the name of an
    array then acts like an implied pointer to the entire string of characters. The
    **sizeof** operator will return the string’s array length when the string name
    is supplied as its argument. A string may be assigned to an array or to a pointer
    of the char data type, like this:


    ```

    ```c

    char arr[6] = { ‘A’, ‘l’, ‘p’, ‘h’, ‘a’ };

    char *ptr = "Beta";

    printf( "%s", arr );    /* Outputs "Alpha"    */

    printf( "%s", ptr );    /* Outputs "Beta"     */

    ```

    ```


    ![](img/d1dfb0563339ba187decb78799155b7f_111_1.png)


    You can find the standard ASCII character code table on pages 162–163.


    String values can be introduced into a C program by input from the user via the
    **scanf()** function described on page 24. This function works well for single
    characters or multiple characters forming a single word, but **scanf()** has a
    severe limitation in that it stops reading when it encounters a space. This means
    that the user cannot input a sentence via **scanf()** as the string gets truncated
    at the space following the first word. The solution to the **scanf()** problem
    is provided by two alternative functions located in the **stdio.h** header file.
    The first of these is named **fgets()** and can be used to read input from the
    user. This accepts all characters, including spaces, and assigns the string to
    a character array specified as its first argument. Its second argument must specify
    the number of characters to read, and its third argument must specify where to
    read from, such as **stdin** to read standard input. The **fgets()** function
    automatically adds the \0 null character at the end of the string when the user
    hits the Return key – to ensure the input has string constant status. The companion
    to **fgets()** is the **puts()** function that will output a string specified
    as its argument and automatically add a newline character at the end.


    ![](img/d1dfb0563339ba187decb78799155b7f_111_2.png)


    In C, character values must be enclosed by single quotes, and strings must be
    enclosed by double quotes.


    ![](img/d1dfb0563339ba187decb78799155b7f_111_3.png)'
