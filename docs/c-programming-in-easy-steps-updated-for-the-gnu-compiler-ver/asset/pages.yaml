  md: "# Pointing to structures\n\nPointers to struct data types can be created in\
    \ just the same way as pointers to regular data types. In this case, the pointer\
    \ holds the address of the beginning of the region of memory used to store the\
    \ member data.\n\nThe use of pointers to structures is so common in C programs\
    \ that there is even a special operator to describe it. In a struct pointer the\
    \ \".\" dot operator can be replaced by \"->\", which is a hyphen followed by\
    \ the greater-than operator. This combination is known as the arrow operator.\
    \ For example, a pointer to a struct member ptr->member is the equivalent of (*ptr).member.\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_131_0.png)\n\n+   1. Begin a new program\
    \ with a preprocessor instruction to include the standard input/output library\
    \ functions\n+   #include <stdio.h>\n+   \n+   2. Next, declare an un-named structure\
    \ defining a data type with two character pointer members and one tag name\n+\
    \   typedef struct {\n+     char *name; char *popn ;\n+   } City ;\n+   \n+  \
    \ 3. Now, add a main function that declares three regular variables and a pointer\
    \ variable, all of the struct data type\n+   int main()\n+   {\n+     City ny\
    \ , la , ch , *ptr ;\n+   }\n+   \n+   4. Within the main function block, assign\
    \ values to members of the first variable then display the stored values, using\
    \ the dot operator to both store and retrieve the values\n+   ny.name = \"New\
    \ York City\" ;\n+   ny.popn = \"8,274,527\" ;\n+   printf( \"\\n%s , Population:\
    \ %s\\n\", ny.name , ny.popn ) ;\n+   \n+   5. Assign the address of the second\
    \ variable to the pointer variable\n+   ptr = &la ;\n\n![](img/d1dfb0563339ba187decb78799155b7f_131_1.png)\n\
    \nThe arrow operator is useful in C programming to differentiate between structure\
    \ pointers and other pointers."
