  md: '# Utility functions


    <stdlib.h>

    Functions that perform various useful tasks


    +   - `double atof( const char *s )` Converts s to a double

    +   - `int atoi( const char *s )` Converts s to an int

    +   - `long atol( const char *s )` Converts s to a long

    +   - `double strtod( const char *s , char **endp )` Converts the initial part
    of s to a double, ignoring leading whitespace. A pointer to the rest of s is stored
    in *endp

    +   - `long strtol( const char *s , char **endp, int b )` Converts the initial
    part of s to a long using base b. A pointer to the rest of s is stored in *endp

    +   - `unsigned long strtoul( const char *s , char **endp , int b )` This function
    is the same as the strtol() function except the returned result is an unsigned
    long

    +   - `int rand( void )` Returns a pseudo-random number between zero and an implementation-defined
    maximum of at least 32,767

    +   - `void srand( unsigned int seed )` Sets the seed for a new sequence of random
    numbers supplied by rand(). The initial seed is 1

    +   - `void *calloc( size_t nobj , size_t size )` Returns a pointer to memory
    space for an array of nobj objects of size size, or NULL if the request cannot
    be met. The space is initialized to zero bytes

    +   - `void *malloc( size_t size )` Returns a pointer to memory space for an object
    of size size, or NULL if the request fails. This space is uninitialized

    +   - `void *realloc( void *p , size_t size )` Changes the size of an object pointed
    to by p to size size. This function returns a pointer to the new space, or NULL
    if the request fails

    +   - `void free( void *p )` The free() function deallocates the memory space
    pointed to by p. Note that p must be a pointer to memory space previously allocated
    by calloc(), malloc(), or realloc()'
