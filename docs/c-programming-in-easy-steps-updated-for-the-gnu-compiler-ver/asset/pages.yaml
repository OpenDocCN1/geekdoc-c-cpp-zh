  md: "# Defining constants\n\nThe preprocessor #define directive can be used to specify\
    \ constant text values that can be used in a program with this syntax:\n\n```\n\
    #define CONSTANT-NAME \"text-string\"\n```\n\nLike the #include directive, these\
    \ should appear at the very start of the program code. Any occurrences of the\
    \ specified constant name in the program code will be substituted for the associated\
    \ text string by the preprocessor before compilation.\n\nA conditional preprocessor\
    \ #ifdef directive can also be used to evaluate whether a definition currently\
    \ exists. Depending on the result of the evaluation it may be followed by a #define\
    \ directive to specify a constant text value. This preprocessor routine is known\
    \ as a \"macro\" and each macro must end with an #endif directive.\n\nUsefully,\
    \ a preprocessor macro can examine compiler-defined constants to determine the\
    \ host operating system. These will vary from machine to machine, but on the Windows\
    \ platform there will typically be a constant named __WIN32, and on the Linux\
    \ platform there will typically be a linux constant. An #ifdef preprocessor directive\
    \ can apply an appropriate text string to identify the host platform.\n\n![](img/d1dfb0563339ba187decb78799155b7f_47_0.png)\n\
    \n+   1. Begin a new program with a preprocessor instruction to include the standard\
    \ input/output library functions\n+   #include <stdio.h>\n+   \n+   2. Add three\
    \ further preprocessor directives that specify text strings for substitution in\
    \ the source code\n+   #define LINE \"\"\n+   #define TITLE \"C Programming in\
    \ easy steps\"\n+   #define AUTHOR \"Mike McGrath\"\n+   \n+   3. Next, add a\
    \ conditional macro that specifies a text string to identify the Windows host\
    \ platform\n+   #ifdef __WIN32\n+   #define SYSTEM \"Windows\"\n+   #endif"
  merge: -1
