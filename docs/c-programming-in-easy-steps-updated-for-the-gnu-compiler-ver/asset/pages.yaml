- pgno: 95
  md: "# Restricting accessibility\n\nThe static keyword can be used to restrict the\
    \ accessibility of functions to the file in which they are created, in exactly\
    \ the same way that static variables have restricted accessibility. This is recommended\
    \ practice in larger programs that are spread over multiple “c” files, to safeguard\
    \ against accidental misuse of functions. For instance, the square() and multiply()\
    \ functions can't be directly called from the main() function in this example.\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_95_0.png)\n\n+   1. Begin a new program\
    \ with a preprocessor instruction to include the standard input/output library\
    \ functions\n+   \n+   ```c\n+   #include <stdio.h>\n+   ```\n+   \n+   2. Declare\
    \ two custom function prototypes\n+   \n+   ```c\n+   void menu();\n+   void action(\
    \ int option );\n+   ```\n+   \n+   3. Add a main function to call the first custom\
    \ function then return a zero integer as required by the declaration\n+   \n+\
    \   ```c\n+   int main()\n+   {\n+       menu();\n+       return 0;\n+   }\n+\
    \   ```\n+   \n+   4. After the main block, define the first custom function to\
    \ pass a menu option as an argument to another function\n+   \n+   ```c\n+   void\
    \ menu()\n+   {\n+       int option;\n+       printf( \"\\nWhat would you like\
    \ to do?\" );\n+       printf( \"\\n1. Square a number\" );\n+       printf( \"\
    \\n2. Multiply two numbers\" );\n+       printf( \"\\n3. Exit\\n\" );\n+     \
    \  scanf( \"%d\", &option );\n+       action( option );\n+   }\n+   ```\n+   \n\
    +   5. Begin a second program file with a preprocessor to include the standard\
    \ input/output functions, and declare the custom prototypes once more\n+   \n\
    +   ```c\n+   #include <stdio.h>\n+   \n+   void menu();\n+   void action( int\
    \ option );\n+   ```\n\n![](img/d1dfb0563339ba187decb78799155b7f_95_1.png)\n\n\
    Notice that prototypes are declared here for each file containing calls to those\
    \ functions – to prevent an “implicit declaration of function” compiler warning.\n\
    \n![](img/d1dfb0563339ba187decb78799155b7f_95_2.png)"
