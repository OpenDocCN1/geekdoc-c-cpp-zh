  trans: "\n\n# 字符串与向量\n\n如果我们有一个字符串向量，例如一个名为 `ja` 且包含我们想要打印数据的向量，并且我们想要打印其中每个字符串的长度：\n\
    \n```cpp\nfor (string i : ja) {\n    cout << i << \" \";\n    cout << i.length()\
    \ << \" \";\n    cout << \"\\n\";\n}\n```\n\n你可以创建任何你想要 `create` 的 `object`，但我们将在下一章开始实际创建对象时更显式地讨论这一点。\n\
    \n另一种容器类型是 `lists`，它的工作方式与 `vectors` 非常相似。这两个领域之间的具体差异对于相对初学者来说可能难以理解。尽管如此，关于这两种容器的通用规则是：除非你必须在容器末尾以外的地方不断添加或删除元素，否则通常应该使用\
    \ `vector`。\n\n另一种类型的容器被称为 `associative container`（关联容器），它可以通过键、值和映射值来进行格式化。它通常根据键进行排序。关联容器最著名的类型被称为\
    \ `map`。当你需要将一组数据与特定特征关联时，这种工具非常有用。一个现实世界的例子是，库存系统可以使用代码（整数——键）和物品名称（字符串——映射数据）的\
    \ `map` 来维护。\n\n对于这一点，你需要导入 `<map>` 并声明一个 `map`：\n\n```cpp\nMap<int, string> inventory;\n\
    inventory[00400030] = \"tamagotchi, blue\";\ninventory[00400031] = \"tamagotchi,\
    \ white\";\ninventory[00324359] = \"twilight, dvd\";\ninventory[44539294] = \"\
    dark souls, xbox 360\";\n```\n\n如果你想在代码的后续调用某个特定元素，可以进行类似的操作：\n\n```cpp\ncout\
    \ << \"inventory[00400030]: \" << inventory[00400030] << \"\\n\";\n```\n\n调用 `inventory[00400030]`\
    \ 将打印映射值，在这里是 \"tamagotchi, blue\"。\n\n另一种类型的关联容器是 `set`。sets 的工作方式与 maps 非常相似，不同之处它们不允许重复项。maps\
    \ 允许重复的值，但不允许重复的键。\n\n该领域还包括一个名为 `algorithms` 的库。该库可用于搜索、排序和处理元素范围。该领域还包含如 `equal()`\
    \ 等函数，它用于判断两个元素集合是否相等。还有 `transform()`，它可以将给定的函数应用到给定的范围。\n\n## 结语\n\n我们来到了这本书的末尾，但这是你编程生涯中漫长而丰实旅程的开始。掌握了\
    \ C++ 的基础知识，是时候开始你的学习了。开始编写那些程序吧！开始实现数据结构和算法吧。\n\n如果你喜欢开始学习 C++，那么这种奇妙的语言还有很多东西可以学习和实践。请务必通过该系列的第二本书继续你的旅程，该书将探讨稍微复杂的主题，同时仍然对初学者非常友好。\n\
    \nC++ 编程语言是一种具有竞争力的通用平台，它借用了一些命令式编程范式的特征，并可以在许多平台上运行。它被称为命令式编程语言，因为它使用逐步步进的过程来实现目标。该语言使用对象设计概念来实现复杂的程序。下一步是开始用\
    \ C++ 编写一些程序。\n\n如果你是一个初学者，目标是开始编写一些 C++ 程序，并看到你使用这种语言获得的结果。\n\n"
