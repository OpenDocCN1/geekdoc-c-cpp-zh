    高级编程语言的出现是为了解决汇编语言和机器语言引起的问题。任何计算机都可以运行这些语言。高级语言通常带有一个名为编译器的程序。编译器的作用是生成 CPU 可以直接理解的可执行文件。这些程序是独立的。今天使用的现代编译器在将代码转换为可执行格式方面非常高效且快速。有些编程语言使用解释器。解释器的工作是执行代码，但不将其编译成机器码。在这里我们不会学习解释器。任何给定的编程语言都可以被解释或编译。像
    C、C++ 和 Pascal 这样的语言是编译的，而像 JavaScript 和 Perl 这样的脚本语言是被解释的。


    问出这个问题，你会得到几十种不同的答案，但简单来说，C++ 是一种编译的面向对象的计算机编程语言。如果你是编程初学者，即使是这句话可能也让你感到有些困惑，所以让我们再详细拆解一下。


    编程语言有两种类型——一种是解释型的，另一种是编译型的。解释型语言读取代码并一次执行一次内部的命令。CPU 编译的是语言而不是程序；计算机无法读取字母；它们只读取二进制数字，所以当你编写代码时，它会被首先翻译成二进制。这被称为编译。


    解释中的面向对象部分只是描述了代码的结构，但稍后会进入更多细节。


    这些对我意味着什么？


    要成功学习 C++，你需要同时使用文本编辑器和编译器。如果你使用的是 Windows PC，可以使用已经安装在电脑上的记事本作为你的文本编辑器；而作为编译器（它将把你的代码转换为可执行格式），你应该使用
    GCC/C++。


    ### Linux/Unix


    检查你的 Linux 计算机是否安装了 gcc 的简单方法是打开命令行并输入：


    ```

    g++ -v

    ```


    如果安装了 gcc，你将获得类似下面的信息：


    ```

    Using built-in specs

    Target: i386-redhat-linux

    Configured with: ../configure --prefix=/usr

    Thread model: posix

    GCC version: 4.1.2 (20080704)

    ```


    如果没有安装 gcc，你可以按照 `gnu.org/install` 上的说明进行安装。在 Mac 上获取 gcc 的方法是访问 `developer.apple.com/tools`
    并按照指示进行安装。


    要在 Windows 上获取 gcc，你必须先从 `mingw.org` 下载并安装 gcc-core、g++ 等相关版本的 gcc。


    你还可以考虑的另外一点是集成开发环境。这种文本编辑器集成了编译器和代码块语法高亮。还有什么我应该知道的吗？有的。C++ 的语法非常严格，而且所有内容对大小写敏感，所以在使用
    C++ 时要小心你输入的内容；单词 "hello" 和 "Hello" 的含义不同，但你将在书中学更多。现在，让我们直接进入正题。在进入过多细节之前，让我们开始编写一段简单的代码。这是所有类型计算机教程的典型示例，所以话不多说，让我们先拆解一下，代码编写如下：


    ![Image0059.jpg](img/Image0059.jpeg)


    第 1 行是告诉你的计算机你想为你的程序链接一个库。库是一个存储少量代码以及变量和操作符的存储库。流库（stream library）有一段代码允许将字符移动到文本流中，然后显示在屏幕上。


    第 2 行告诉计算机你想使用标准命名空间——这是存储你代码的地方，如果你编写了两段名称相同的代码，这非常有用。第 4 行是代码的开始。大括号内的所有内容都是编译器读取并翻译的内容——这一行必须出现在你编写的每一个程序中；否则什么都不会发生。


    下一阶段是程序的输出，在本例中是 "hello, world!"。在这里我们使用了一些存储在流（stream）中的代码，即 `cout`。代码后面的 `<<`
    是一个操作符，它翻译为“输出”，意味着我们将代码发送到指定的流。"hello, world!" 被称为字符串，它无非是包含在双引号中的字符序列。注意该行以分号结尾——这是告诉计算机代码已结束，如果不使用，程序将无法编译。


    第 8 行始终位于 `main` 的末尾，

