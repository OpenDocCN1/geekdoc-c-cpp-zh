    ## 引言

    欢迎来到奇妙的世界的世界，本书章节将让你对 C++ 编程有一个基础的理解。到最后一章节，你将能够使用 C++ 创建属于自己的完整程序。


    本指南面向 C++ 的初学者。然而，如果你对编程完全陌生，我建议先读读一本编程入门书籍，它涵盖了初学者需要知道的所有概念、术语、编程范式和编码技术。


    本指南将花费一些时间来介绍我们使用 C++ 语言可以做的一切事情，以及学习这种语言有多大好处。


    这门 C++ 语言面向对象的编程课程为学习者提供了设计、开发和有效实现健壮程序模型所需的概念和技术。作为学习者，你将掌握如何将面向对象分析和设计的概念应用于解决日常活动中的各种问题的实用知识。


    C++ 是一种广泛用于通用编程的计算机编程语言。它是 C 语言的扩展。可以通过 C 获取对 C++ 的基础理解。这就是为什么这两种计算机语言都被表示为 C/C++。这种多范式语言开发于
    1979 年。


    在当今世界，许多操作系统使用 C++ 作为其基础语言。一些系统驱动程序、浏览器和游戏是基于 C++ 程序的。它是一种免费、编译型且静态类型的编程语言。许多专业人士认为
    C++ 是实现所需结果最高效的语言。


    学习代码终究是未来的语言。我们生命中的某个时刻都曾听过类似这样的话。


    当你读到最后时，你应该能够毫无问题地阅读 C++ 代码并编写既有趣又有用的程序。那么，让我们开始学习 C++ 吧。


    ## 第 1 章：C++ 剖析

    ### 编程语言简介

    如你所知，程序无非是一组指令。这些指令由硬件（即物理计算机设备）执行。尽管现代计算机运行很快，但它们也有其局限性。计算机只理解用原生语言给出的一组指令。为此，你应该理解机器语言、汇编语言和高级级语言的概念。


    ### 机器语言

    尽管计算机非常先进，但它们无法直接理解像 C++ 这样的语言。计算机理解所谓的位的 `0` 和 `1`。这是一组以二进制格式给出的指令，我们需要对其进行翻译以便处理器执行工作。不同的处理器具有不同类型的指令。例如，奔腾处理器的指令集与
    Macintosh 类似。在最开始，程序员必须用二进制编写他们的指令。这非常耗时且具有挑战性。幸运的是，我们不需要经历那个过程。


    ### 汇编语言

    由于机器语言很难处理，人们发明了一种名为汇编语言的新语言。在这里，每条指令都被赋予了一个短名称，变量用名称代替了二进制位，使得程序员更容易编写代码。你可能会问如何理解不能理解汇编语言，答案是：不能。汇编语言将在汇编器的帮助下转换为机器语言。记住，每个
    CPU 都有对应的汇编语言。


    '
