  trans: "\n\n```cpp\ncout << \"integer constant: \" << a << \"\\n\";\ncout << \"\
    floating point constant: \" << b << \"\\n\";\ncout << \"character constant: \"\
    \ << b << \"\\n\";\nreturn 0;\n```\n\n输出：\n在此代码的情况下，控制台将弹出以下输出：\nInteger constant:\
    \ 50\nFloating-point constant: 9.7\nCharacter constant: k\n\n字面量 (Literal constants)\n\
    \n字面量是用于指定所需数据的常量值。众所周知，常量是改变的，因此我们必须指定它的数据值。字面量是最常见的常量形式。这里是一个显示不同类型字面量的表格。\n\
    \n![Image00075.jpg](img/Image00075.jpeg)\n\n# 第 3 章：函数\n\n你可能记得在某个时候处理 `math`\
    \ 类时需要处理过函数，例如 `f(x) = 2x + 5`。`f(0)` 将会是 `5`（`f(2(0) = 5`），`f(1)` 将会是 `7`（`f(2(1)\
    \ + 5`），`f(2)` 将会是 `9`（`f(2(2) + 5`），依此类推。\n\nC++ 中的函数工作原理类似。函数执行操作并返回一个值。它们并不总是必须返回值；然而，不返回值的函数是\
    \ `void` 函数。\n\n首先，看看这段代码，它现在看起来很有意义了；我们将过一遍它。创建一个新项目并清空 `main.cpp` 的内容，输入以下内容：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint getarea(int bl, int\
    \ bw);\n\nint main()\n{\n    int length, width;\n    cout << \"enter the length,\
    \ and enter the width.\\n\";\n    cin >> length >> width;\n    cout << \"the area\
    \ is: \" << getarea(length, width);\n    return 0;\n}\n\nint getarea(int bl, int\
    \ bw)\n{\n    int area = bl * bw;\n    return area;\n}\n```\n\n让我们逐行分析这段代码。\n\n\
    ```cpp\n#include <iostream>\n``` 这引入包含了输入和输出的核心组件。`using namespace std;` 表示我们正在使用标准输入/输出命名空间。`int\
    \ getarea(int bl, int bw);` 这是我们声明第一个函数的地方。C++ 是过程编译的，所以你不能随随地放置函数。你必须在之后编写它们之前声明它们，或者在编写\
    \ `main` 函数之前完全编写它们。为了清晰起见，我倾向于先声明，然后在 `main` 函数之后编写函数，但这是个人选择。无论如何，我们在这里创建一个名为\
    \ \"getarea\" 的函数。名称前的 `int` 表示它将返回一个整数值。同样，`float getarea(...)` 将返回一个浮点数值，`char\
    \ getcharacter(...)` 将返回一个字符，依此类推。在声明中，我们有两个称为参数的变量，就像 `f(x)` 中的 x 作为参数被修改的那样。\n\
    \n```cpp\nint main()\n{\n    // 这是我们 main 函数的开始，以防你没有概念\n    int length, width;\n\
    \    cout << \"enter the length, and enter the width.\\n\";\n    cin >> length\
    \ >> width;\n    cout << \"the area is: \" << getarea(length, width);\n}\n```\
    \ 这里我们需要进一步的解释，即关于一个值的输出流。此外，由于此函数返回一个值，你可以创建一个新的整数并将函数的返回值赋值给它，如 `int area =\
    \ getarea(length, width);`。不过，这是一种浪费，因为这个程序不需要创建这个变量。但如果你确实需要存储像 `area` 这样的变量，你可以完全这样做。\n\
    \n```cpp\nint getarea(int bl, int bw)\n{\n    // 这镜像了函数声明，我们在这里开始编写\n    int area\
    \ = bl * bw;\n    // 我们创建了一个名为 area 的新变量，它获取函数中的两个参数并相乘得到一个值。我们返回同一个整数。\n    return\
    \ area;\n}\n```\n\n简单，每个 main 函数都必须返回 0。\n\n这是对函数的简要介绍。它们是结构化程序的重要方式。所有内容都只在一个函数中的程序读起来很枯燥，且维护很有挑战性。分得更开程序要更容易理解和管理。\n\
    \n# 第 4 章：多态\n\n多态意味着以许多形式存在。在编程中，当我们有许多通过继承关系相互关联的类时，就会发生多态。在 C++ 中，多态意味着对函数的调用将根据调用该函数的对象的类型导致不同函数的执行。考虑下面给出的示例，我们有一个基类被另外两个类派生：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass figure\n{\nprotected:\n\
    \    int breadth, length;\n\npublic:\n    figure(int bx = 0, int by = 0){\n  \
    \      breadth = bx;\n        length = by;\n    }\n\n    int area()\n{\n```\n"
- fmt: "\n```cpp\nclass figure {\nprotected:\n    int breadth, length;\npublic:\n\
    \    figure(int x = 0, int y = 0) {\n        breadth = x;\n        length = y;\n\
    \    }\n    virtual int area() {\n        cout << \"area of parent class:\" <<\
    \ endl;\n        return 0;\n    }\n};\n\nclass rectangle: public figure {\npublic:\n\
    \    rectangle(int x = 0, int y = 0) : figure(x, y) {}\n    int area() {\n   \
    \     cout << \"area of rectangle class:\" << endl;\n        return breadth *\
    \ length;\n    }\n};\n\nclass square: public figure {\npublic:\n    square(int\
    \ x = 0, int y = 0) : figure(x, y) {}\n    int area() {\n        cout << \"area\
    \ of square class:\" << endl;\n        return breadth * length;\n    }\n};\n\n\
    // main function\nint main() {\n    figure*figure;\n    rectangle rec(10, 7);\n\
    \    square sq(5, 5);\n\n    // store address of rectangle figure\n    figure\
    \ = &rec;\n    // call rectangle area.\n    figure->area();\n\n    // store address\
    \ of square figure\n    figure = &sq;\n    // call square area.\n    figure->area();\n\
    \n    return 0;\n}\n```\n\nThe code will return the following output:\n\n![Image00076.jpg](images/Image00076.jpeg)\n\
    \nThe output is incorrect. The reason for this is that the call of `area()` function\
    \ has been set only by the compiler based on the version of the base class. This\
    \ is because static resolution of the function call is fixed before the execution\
    \ of the program. Sometimes, this is referred to as early binding since it occurs\
    \ during the compilation of the program.\n\nLet's make a modification to the code\
    \ so that the `area()` function is declared within the `figure` class. however,\
    \ we will declare it with the `virtual` keyword as shown below:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nclass figure {\nprotected:\n    int breadth,\
    \ length;\npublic:\n    figure(int x = 0, int y = 0) {\n        breadth = x;\n\
    \        length = y;\n    }\n    virtual int area() {\n        cout << \"area\
    \ of parent class:\" << endl;\n        return 0;\n    }\n};\n\nclass rectangle:\
    \ public figure {\npublic:\n    rectangle(int x = 0, int y = 0) : figure(x, y)\
    \ {}\n    int area() {\n        cout << \"area of rectangle class:\" << endl;\n\
    \        return breadth * length;\n    }\n};\n\nclass square: public figure {\n\
    public:\n    square(int x = 0, int y = 0) : figure(x, y) {}\n    int area() {\n\
    \        cout << \"area of square class:\" << endl;\n        return breadth *\
    \ length;\n    }\n};\n\nint main() {\n    figure*figure;\n    rectangle rec(10,\
    \ 7);\n    square sq(5, 5);\n    figure = &rec;\n    figure->area();\n    figure\
    \ = &sq;\n    figure->area();\n    return 0;\n}\n```\n\nThe code should now return\
    \ the following result:\n\n![Image00077.jpg](images/Image00077.jpeg)\n\nThe compiler\
    \ considers the elements of a pointer rather than bits. The objects of ca classes\
    \ have their respective definition of the `area()` function called. Each derived\
    \ class has a different implementation of the function named `area()`. This is\
    \ known as polymorphism. You have more than one class with the same function name\
    \ and the same parameters, but the implementation is different.\n\nNotice that\
    \ we used the virtual keyword to make the function virtual. When a virtual function\
    \ is defined in the base class and another version in the derived class, this\
    \ will act as a signal to the compiler that static linkage to the function is\
    \ not needed. We only need a selection of the function to be called based on the\
    \ type of object for which the function is being called. This operation is known\
    \ as late binding or dynamic linkage.\n\nSometimes, you may need including a virtual\
    \ function in the base class for it be redefined in a derived class to suit the\
    \ class objects, but you have no meaningful definition to give the function in\
    \ the base class. In such a case, you have the following:\n\n```cpp\nclass figure\
    \ {\nprotected:\n    int breadth, length;\npublic:\n    figure(int x = 0, int\
    \ y = 0) {\n        breadth = x;\n        length = y;\n    }\n    virtual int\
    \ area();\n};\n```\n\nNote that the use of a `virtual` function in the base class\
    \ is the body of wait, you also have a virtual destructor. Polymorphism object\
    \ destruction is tricky, especially when it comes through an interface. You could\
    \ have a code like this:\n\n```cpp\nclass drawable {\npublic:\n    virtual void\
    \ draw();\n};\n\nclass paintable : drawable {\npublic:\n    void draw();\n   \
    \ paintable();\n    ~paintable();\n};\n\nvoid deletedraw(drawable* drawable) {\n\
    \    delete drawable;\n}\n\nint main() {\n    deletedraw(new drawable());\n}\n\
    ```\n\nWhat’s going on inside `deleted`? Remember, when `delete` is used, the\
    \ destructor is called, so the line `delete drawable;` makes a function call.\
    \ But how does the compiler know where the `paintable` destructor is? The compiler\
    \ doesn't know the exact type of the `drawable` variable, but it does know it's\
    \ a `drawable`, something that has a `draw()` method.\n"
