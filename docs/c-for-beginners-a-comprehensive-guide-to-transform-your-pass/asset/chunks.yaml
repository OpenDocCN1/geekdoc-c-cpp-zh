    与许多其他语言一样，C++ 支持各种构建块。在本次教程中，你将学习如何在处理从简单到复杂的程序时，如何使用各种内置数据类型。


    数据类型区域分为基本数据类型、派生数据类型和抽象数据类型。你不仅将学习如何使用基本数据类型和标准数据类型，还将学习如何定义你自己的自定义数据类型。


    享受你的旅程。如果你在编程时没有乐趣，那么它就不适合你。所以，让它变得有趣一点、兴奋一点，让它成为你每天早晨起床的理由。


    祝你的旅程顺利。

    '
