  trans: "\n我们可以定义一个带有成员函数的类，且类的定义可以在类内部也可以在类外部进行。\n\nC++ 中的类与结构体相似，但唯一的区别在于，默认情况下，类的访问控制权限是私有的（private），而结构体的访问权限是公开的（public）。\n\
    \nC++ 通过类提供了面向对象编程的所有重要特性，如封装、抽象和继承等。\n\n类的每个对象都拥有其独立的数据成员拷贝，我们可以根据需要为类创建任意数量的对象。\n\
    \n# 对象\n\n类仅仅是一个蓝图，定义一个类时并不会分配任何内存。只有在为该类创建对象后，才会分配内存。对象区域包含了在类类中声明的数据变量的实例，该类的成员函数会在这些实例上运行。\n\
    \n对象区域通过特殊的构造函数进行初始化——这是一种稍后我们会学习的特殊方法。析构是另一个特殊函数，在对象超出作用域时销毁该对象。\n\n```cpp\n\
    Class Mobiles{\n\n  Int price;\n\n  Void calling()(){}\n\n  Void messaging()(){}\n\
    \n};\n\nVoid main(){\n\n  Mobiles m1; // 为类 Mobiles 创建的对象\n}\n```\n\n# 构造函数\n\n\
    构造函数是类似于类成员函数的特殊函数，承担着对象初始化的重要任务。当对象被创建时，编译器会调用构造函数。构造函数在为特定对象提供存储空间后，通过初始化其成员来初始化创建的对象。每个类至少有一个构造函数，如果类中没有显式定义构造函数，就会产生一个没有参数的默认构造函数。\n\
    \n```cpp\nClass test\n{\n\n  Char c;\n\nPublic:\n\n  Test(); // 构造函数\n};\n\nClass\
    \ test\n{\n\n  Int a;\n\nPublic:\n\n  Test(); // 构造函数的声明\n\n  Test::test() //\
    \ 定义构造函数\n\n  {\n\n    A=1;\n  }\n};\n```\n\n# 析构函数\n\n析构函数是一种特殊的类函数，负责在对象超出作用域时销毁对象。当对象超出作用域时，编译器会自动调用构造函数。\n\
    \n析构函数的语法与构造函数相同，唯一的区别是使用波浪符号 `~` 用于析构函数的声明。此外，析构函数没有参数。\n\n```cpp\nClass test\n\
    {\n\nPublic:\n\n  ~test(); // 类 test 的析构函数\n};\n```\n\n# 调用构造函数和析构函数的示例\n\n```cpp\n\
    Class test{\n\n  Test()\n  {\n\n    cout << \"aa constructor has been called\"\
    ;\n  }\n\n  ~test()\n  {\n\n    cout << \"aa destructor has been called\";\n \
    \ }\n};\n\nInt main()\n\n{\n\n  Test test1; // 调用了构造函数\n\n  Int a=18;\n\n  If(a)\n\
    \n  {\n\n    Test test2; // 再次调用构造函数\n\n  } // obj2 超出作用域并调用该 obj2 的析构函数\n\n}\
    \ // 为对象 obj1 调用析构函数\n```\n"
- fmt: "\n}\n\n}\n\n```cpp\n//a  bothera  bcodea  bneededa  bfora  bboarda  binitialization\n\
    }\n```\n\nI won't keep showing you all the `method` `declarations`, but I will\
    \ continue to show you the `class` `declaration`, `so` that you can see how it\
    \ all fits together.\n\nNow note that the constructor above is in the `public`\
    \ part of the class. If we didn't make the `chessboard` constructor `public`,\
    \ we couldn't create any `object` instances. Why not? Because, whenever an `object`\
    \ is created, the `constructor` has to be called; if we make it `private`, it\
    \ can't be called from outside the class. Objects can only be initialized by calling\
    \ the `constructor` and, if you make it `private`, you won't be able to declare\
    \ the object.\n\nThe constructor gets called on the same line the object is created\
    \ on:\n\n```cpp\nChessboard board; // calls the chessboard constructor\n```\n\n\
    Or when memory is allocated:\n\n```cpp\nChessboard *board = new chessboard; //\
    \ this calls the chessboard constructor as part of the memory allocation\n```\n\
    \nWhen multiple objects are declared:\n\n```cpp\nChessboard a;\nChessboard b;\n\
    ```\n\nConstructor area always runs in the order of the `object` declaration—and\
    \ then so. With a normal function, a constructor can take one or more arguments,\
    \ and several constructors can be overloaded by the type of argument if there\
    \ is a different way of initializing the object. For example, a second constructor\
    \ could be created for `chessboard` to take the `board_size` class:\n\n```cpp\n\
    class chessboard {\n    Chessboard();\n    chessboard(int board_size);\n};\n```\n\
    \nThe function definition is the same as any class method:\n\n```cpp\nChessboard::chessboard(int\
    \ bsize)\n{\n    //a… code\n}\n```\n\nThe argument is passed to the constructor\
    \ like this:\n\n```cpp\nChessboard board(8); // 8 is an argument to the chessboard\
    \ constructor\n```\n\nWhen you use the `new` keyword, passing an argument looks\
    \ like you're calling the constructor directly:\n\n```cpp\nChessboard *p_board\
    \ = new chessboard(8);\n```\n\nA note on the syntax: although parentheses are\
    \ used for passing arguments, you can't use them to declare objects that have\
    \ no no-argument constructors.\n\nYou can't do this:\n\n```cpp\nChessboard board();\n\
    ```\n\nThe correct form is:\n\n```cpp\nChessboard board;\n```\n\nHowever, you\
    \ can use parentheses when the `new` keyword is used:\n\n```cpp\nChessboard *board\
    \ = new board();\n```\n\nThis is one of the unfortunate little foibles of C++\
    \ parsing because the details are kept very obscure. Just don't use parentheses\
    \ when you declare objects with a no-argument constructor.\n\nSo what happens\
    \ if a constructor isn't declared? If a constructor isn't declared, C++ creates\
    \ one. It won't take arguments or initialize `ints`, `chars`, or any other primitive\
    \ type, but it will initialize every class `field` by calling the default `constructor`\
    \ for each one.\n\nGenerally, you should create a constructor just to make sure\
    \ everything gets properly initialized. As soon as the call the `constructor`\
    \ is declared, C++ won't generate the default for you. The compiler assumes that\
    \ you know exactly what you're doing and that you're going to create a `constructor`\
    \ for the object, and that're why you need a `constructor` for the object, in\
    \ particular, if you create a `field` that the code doesn't automatically generate\
    \ a default `constructor` for.\n\nIf a `field` is declared in the class:\n\n```cpp\n\
    class holder {\npublic:\n    holder(int val);\nprivate:\n    int val;\n};\n\n\
    holder::holder(int val) : val(val)\n{\n    // The field is initialized by the\
    \ initializer list\n}\n```\n"
