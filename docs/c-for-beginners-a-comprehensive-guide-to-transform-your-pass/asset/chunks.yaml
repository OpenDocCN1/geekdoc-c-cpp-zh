  trans: "\n\n当你在使用 STL 遇到编译器错误时，这些区域极其难以阅读和理解。\n\n你不会在库中找到所有的数据结构。\n\n彻底讨论 STL 需要一整本书，因此我将只向你介绍你在\
    \ STL 中会使用的最常用数据结构的概述。\n\n## Vectors\n\nSTL 中包含了数组的替代品——`vector`。它非常像数组，但可以自动调整大小；你不再需要担心分配内存和移动其他元素。然而，`vector`\
    \ 的语法与标准数组不同。\n\n数组的语法是：\n\n```cpp\nint ban_array[10];\n```\n\n而 vector 的语法是：\n\
    \n```cpp\n#include <vector>\n\nusing namespace std;\n\nVector<int> ba_vector(10);\n\
    ```\n\n必须包含 `vector` 头文件以及 `std` 命名空间。这是因为与 `cout` 和 `cin` 一样，`vector` 是标准库的一部分。\n\
    \n此外，当声明一个 `vector` 时，你必须提供存储在 `vector` 中的数据类型。这是通过使用角括号 `<>` 完成的：\n\n```cpp\n\
    Vector<int>\n```\n\n这利用了一种名为模板（templates）的 C++ 特性。`vector` 代码的编写方式允许存储任何数据类型。你只需要告诉编译器\
    \ vector 存储的是什么类型。这实际上意味着我们这里有两个类型：数据结构类型（它决定了数据的组织方式）以及数据结构中包含的数据类型。使用模板允许你将不同的数据结构类型与数据结构内部不同的数据类型相结合。\n\
    \n最后，当提供 `vector` 大小时，必须放在圆括号中而不是方括号：\n\n```cpp\nVector<int> ba_vector(10);\n\
    ```\n\n这是某些变量类型初始化的语法。为此，值 10 被传递给初始化（称为构造函数），从而设置了向量的大小为十。在指南过程中，你将学习到构造函数以及带有构造函数的对象。\n\
    \n一旦创建了 `vector`，就可以像数组一样访问单个元素：\n\n```cpp\nFor (int bi = 0; bi < 10; bi++)\n\
    {\n    A_vector[bi] = 0;\n    An_array[bi] = 0;\n}\n```\n\n### 在 vector 上调用方法\n\
    \n`vector` 为你提供的功能比数组多得多。你还可以进行一些操作，例如在 vector 的末尾添加元素。`vector` 提供了一个函数来帮助处理此类操作，但函数的语法与之前使用的语法不同。\n\
    \n`vector` 使用了一种名为方法（method）的 C++ 特性。这是用数据类型声明的函数。调用方法需要新的语法，例如所示：\n\n```cpp\n\
    A_vector.size();\n```\n\n这是在 `ba_vector` 上调用方法，并返回大小。这有点像访问字段，但通过调用结构上的方法来实现。虽然对\
    \ `vector` 执行了某些操作，但 `vector` 不需要向方法传递参数。`vector` 用于向方法传递参数的语法是\n\n```cpp\n<type>.<function(variable,\
    \ args);\n```\n\n换句话说，类似于编写：\n\n```cpp\n<function>(variable, args);\n```\n\n在示例中，`ba_vector.size()`\
    \ 就像：\n\n```cpp\nSize(ba_vector);\n```\n\n### 其他特性\n\nvector 还可以非常轻松地管理包含的项目数量，而不需要分配内存，例如，向\
    \ vector 添加额外项目的写法如下：实现电子邮件地址簿（通过名称查找地址）或在程序中通过账户 查找账户以允许用户进入游戏时，在编程中常见的实现：\n\n\
    ```cpp\nA_vector.push_back(10);\n```\n\n这向 vector 中添加了另一个值为 10 的项目。如果你想对数组这样做，vector\
    \ 将需要调整大小，而内存情况是不一样的。括号主要只适用于已经分配的数据。\n\n所以，像这样的代码：\n\n```cpp\nVector<int> ba_vector(10);\n\
    A_vector[10] = 10; // 最后一个有效元素是 9\n```\n\n将无法运行，并可能导致程序崩溃。更不用说它是危险的。这样写：\n\n```cpp\n\
    Vector<int> ba_vector(10);\nA_vector.push_back(10); // 向 vector 添加新元素\n```\n\n\
    是可以调整 vector 大小的的。\n\n## Maps\n\n我们稍前提到了 maps，即使用一个值来查找另一个值。这在编程中很常见，例如当你想实现一个可以通过名称查找地址的电子邮件簿，或者在程序中通过账户\
    \ 查找账户以允许用户进入游戏时。\n\n"
- fmt: "\nThe `map` container stores key-value pairs. Each element has a key and a\
    \ value, and the key is used to look up the value. To have a map for an address\
    \ book, we could implement it as follows:\n\n```cpp\n#include <map>\n#include\
    \ <string>\n\nusing namespace std;\n\nMap<string, string> name_to_email;\n```\n\
    \nWe have to tell the structure there are two types: `string` for the key, and\
    \ another `string` for the value, which is the address in this case.\n\nOne of\
    \ the map’s helpful features is that when a `map` is used, the syntax can also\
    \ be used like an array. If you want to add a value, it’s much like an array,\
    \ except the key type is used instead of an integer:\n\n```cpp\nname_to_email[\"\
    billyunter\"] = \"billybunter@thisemailaddress.com\";\n```\n\nAnd getting a value\
    \ from a map is much the same:\n\n```cpp\ncout << name_to_email[\"billyunter\"\
    ];\n```\n\nYou get the simplicity that goes with an array, but with the ability\
    \ to store whatever type you want. And what’s even better is that, unlike the\
    \ `vector`, the `map` size doesn’t have to be set before the `[]` operator is\
    \ used to add an element.\n\nRemoving items from maps is just as easy. Let’s say\
    \ that you fell out with billyunter and want him removed from your address book.\
    \ You can do that using the `erase` method:\n\n```cpp\nname_to_email.erase(\"\
    billyunter\");\n```\n\nAnd you can use the `size()` method to check what size\
    \ the map is:\n\n```cpp\nname_to_address.size();\n```\n\nAnd the `empty()` method\
    \ to see if a map is empty:\n\n```cpp\nif (name_to_address.empty())\n{\n    cout\
    \ << \"the address book is empty I wish you hadn't deleted billy.\";\n}\n```\n\
    \nDo not confuse this with how you make a map empty; that’s done using the `clear()`\
    \ method:\n\n```cpp\nname_to_address.clear();\n```\n\nBecause of the consistency\
    \ in naming conventions in the STL, the same methods can be used on vectors.\n\
    \n### Iterators\n\nAs well as data storage and the ability to access elements\
    \ individually, you can also go through all the items in a data structure. With\
    \ arrays or vectors, this is just a case of reaching each element using the array\
    \ `length`. But with maps, because they have both numerical and non-numeric keys,\
    \ you can’t always iterate through using a counter variable.\n\nTo get around\
    \ this, the STL provides us with an iterator, which is a variable that lets you\
    \ access the elements of a data structure sequentially, even if the structure\
    \ doesn’t have a good way of doing that. You’ll start by using iterators with\
    \ vectors and then move to the next element using the iterator. Some syntax is\
    \ required for declaring an iterator for a vector of integers, it would look like\
    \ this:\n\n```cpp\nvector<int>::iterator it = vec.begin();\n```\n\nIterators are\
    \ similar to pointers—they point to an element. We can loop over a map using a\
    \ similar approach, but remember that the map doesn’t store single values; it\
    \ stores key/value pairs. When youference an iterator, it has two fields—one for\
    \ a key and one for a value:\n\n```cpp\nint key = it->first; // get the key from\
    \ the iterator\nint value = it->second; // get the value from the iterator\n```\n\
    \nBelow is some code that will display a map’s content in a easy-to-read format:\n\
    \n```cpp\nvoid displaymap(map<string, string> map_to_print)\n{\n    for (map<string,\
    \ string>::iterator it = map_to_print.begin(); it != map_to_print.end(); ++it)\n\
    \    {\n        cout << it->first << \" -> \" << it->second << endl;\n    }\n\
    }\n```\n\nThis code is very similar to what is used for iterating over a vector;\
    \ the only difference is that the map data structure is used along with first\
    \ and second fields of the iterator.\n\n### Checking a map for a value\n\nSometimes\
    \ you want be able to see if a given key has been stored in a map. You use the\
    \ `find()` method to see if the specified value is there; the iterator is incremented\
    \ if you want to move to the next element. The prefix operator is also used:\n\
    \n```cpp\ncout << *it; // print the vector's first element\n++it\n```\n\nIf you\
    \ want code that will loop over a whole vector, it will look like this:\n\n```cpp\n\
    for (vector<int>::iterator it = vec.begin(); it != vec.end(); ++it)\n{\n    cout\
    \ << *it << endl;\n}\n```\n"
