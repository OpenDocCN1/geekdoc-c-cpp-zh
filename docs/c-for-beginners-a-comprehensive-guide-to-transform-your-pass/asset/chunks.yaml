  trans: "\n\n如果你不熟悉使用 C++ 编程，你会发现 `cout`、`cin` 和 `endl` 在编码过程中频繁出现。使用你现有的方法将会非常麻烦；因此，你应该选择通过使用\
    \ `std` 命名空间来指示编译器，从而让你的工作更快。\n\n## 第 2 章：声明常量\n\n### C++ 常量\n\n常量是程序不允许更改的固定值，被称为字面量。`const`\
    \ 属于任何基本数据类型。注意，它与普通变量的区别在于常量的值在定义后不能被更改。\n\n要使用 `#define` 预处理器定义常量，我们使用下面的语法：\n\
    \n```\n#define identifier value\n```\n\n`identifier` 是常量的名称，而 `value` 表示赋值给常量的值。下面的程序描述了如何实现：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\n#define width 7\n#define\
    \ length 11\n\nint main() {\n    int rectangle_area;\n    rectangle_area = length\
    \ * width;\n    cout << \"the area of the rectangle is \" << rectangle_area;\n\
    \    return 0;\n}\n```\n\n在上面的示例中，我们定义了两个常量分别为 `width` 和 `length`。我们分别为它们赋值了 `7`\
    \ 和 `11`。我们还定义了变量 `rectangle_area`，并给它赋值为这两个常量乘积。然后我们打印了这个变量的值。\n\n执行时，代码应该返回以下基础输出：\n\
    \n### 使用 `const` 关键字\n\n我们也可以通过 `const` 关键字来定义常量。要做到这一点，我们使用下面的语法：\n\n```\nconst\
    \ data_type variable = value;\n```\n\n注意，我们必须定义常数的数据类型；这次常量的值是通过赋值运算符 (`=`) 进行赋值的。让我们来看一个演示它的示例：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    const\
    \ int length = 7;\n    const int width = 11;\n    int rectangle_area;\n    rectangle_area\
    \ = length * width;\n    cout << \"the area of the rectangle is \" << rectangle_area;\n\
    \    return 0;\n}\n```\n\n我们刚刚创建了相同的示例，但这次常量是使用 `const` 关键字定义的。\n\n执行时，代码将返回以下结果：\n\
    \n注意，在编程中，始终使用大写字母命名常量是好的。\n\n### 使用 C++ 数据类型\n\n现在你已经创建了你的第一个程序，还有另一件事与每小时编写代码同等重要，甚至更重要，那就是：文档。\n\
    \n每个程序都需要文档，这即使不是为了帮助其他程序员理解你的程序，也是为了帮助你在写完代码多年后能自己理解自己的程序。这听起来可能像某种魔法“代码”，但在现实世界中，你需要通过成功才能被理解。在一种语言中，如果你使用斜杠\
    \ `//`，编译器将忽略两行之间的任何内容。在你的一生中，你需要为你的工作添加文档以避免混淆。\n\n使用大写字母命名常量总是好的，因为这是最可能的，但当你使用变量时，你必须按照如下方式赋值：\n\
    \n```cpp\nint x = 12;\n```\n\n在这个示例中，我们使用 `cin` 从用户处获取值，然后打印输出。注意，在这种语言中，没有 `printf`，相反\
    \ `cout` 是控制台的占位符。如果你想给变量赋值，必须使用 `cin` 获取数字：\n\n```cpp\nint x;\ncin >> x;\ncout\
    \ << x;\n```\n\n"
- fmt: '

    The program above first declares an integer `x`, then it asks you to enter a value
    and displays it on the screen. In an instance where someone else wants to manipulate
    the variable through multiplication or through division, you, the programmer would
    have to declare some more variables and some form of expression to add some code
    to the program above.


    ![Image00067.jpg](images/Image00067.jpeg)


    In the above, the program declares three integers and equals variable `z` to the
    division of `x` and `y`. When the program assigns a value to `x` and `y`, then
    displays the held variable `z`. While the above code may work, there is a flaw
    bound to arise from `z` being equal to the division of `x` by `y`. In the above
    instance, if the user assigns `4` as `x` and `2by`, that would not present a problem
    because `4` is divisible by `2`. However, what would happen if the values were
    `6` and `4`? Leaving the program code in its current state would prompt you for
    an answer mainly because so far as I know, `x` and `y` only hold integer numbers
    without decimals. In the above example of the user assigning `6` and `4`, it is
    evident that they are not divisible, and subdivision will place a decimal. So,
    how do we fix this? The answer is relatively simple; rather than declaring `z`,
    which is an integer that cannot hold values with decimals, we can declare `z`
    as a `double`. I would be tempted to say that `double` data types are superior
    to integers since `double` data types are capable of holding decimal numbers.
    Here is how our program would look


    ![Image00068.jpg](images/Image00068.jpeg)


    While the program code looks so much better, there is also something not entirely
    correct with it, and if you run the program, you will still not get the right
    answer. Can you guess why? Because of something called truncation. This might
    sound complicated but in fact, not. In the above program code, `x` and `y` are
    integers so as seen, you cannot get the correct answer if two integers result
    in a decimal.


    Simply put, this is the meaning of truncation. To fix this, one of the variables
    has to be a `double` type. Doing this prompts the compiler to recognize this and
    convert the other integer into a `double` temporarily. Alternatively, you can
    simply declare each variable as `double`; this is something at your discretion.
    Here is how the full program would look.


    ![Image00069.jpg](images/Image00069.jpeg)


    With everything we have seen so far in our C++ learning experience, becoming a
    master coder is key. Types of constants


    First thing, integers are stored in binary formation you will code integers as
    `8`. For example, the following table will show you different integers, their
    values in programming and their data


    ![Image00070.jpg](images/Image00070.jpeg)Whenever you find an integer closed between
    single quotes, this would be a constant. Moreover, there is a chance you will
