    现在你已经有了程序的源代码，只需使用你的编译器进行简单的编译即可。细节稍后会介绍，首先我想开始介绍你代码的组成部分。下一章将详细介绍你成为一名成功的 C++
    程序员需要学习的知识。


    # C++ 程序的结构


    正如我们已经讨论过的，计算机程序无非是一组告诉计算机该做什么的顺序指令。


    ## 语句和表达式


    在 C++ 中，语句仅仅是程序中最小且独立的单元。它也是编程语言中最常见的指令形式。在 C++ 中，语句是你向编译器传达指令以执行特定任务的方式。我们使用
    `;` 来结束一条语句。C++ 有许多种语句，下面给出了最常见的几种语句类型。


    ```cpp

    int x;

    x = 5;

    std::cout << x;

    ```


    我们将在后面的章节中讨论上述语句的功能。


    ## 函数


    函数是序列中按顺序执行的语句区域。有一个叫做 `main` 的函数，当在运行任何 C++ 程序时，它都必须存在，程序的执行是从 `main` 函数开始的。函数有非常特定的任务要执行，并且它们只执行这些任务。为了成为一名优秀的
    C++ 程序员，你需要知道如何高效地使用函数。在下一章，你将学习更多关于函数的知识。


    ## 库和 C++ 标准库


    库是预编译的代码集合。它们被用于不同的程序。如果你想扩展程序的功能，可以添加库。C++ 语言核心是极简且直观的，但它也带有一个名为 C++ 标准库的内置库。C++
    标准库为我们提供了额外的功能。


    ## 语法和错误


    我们都知道，在许多语言中，句子是遵循该特定语言的语法规则构建的。以英语为例，你通常用句号结束句子。所有规范句子构建的规则被称为语法。同样，C++ 也有语法。注意，不遵守语法将导致你的代码无效。检查是否遵循
    C++ 语言的基本语法是编译器的责任。如果你违反了基本语法，编译器将编译代码并对语法违规进行报错。这个问题被称为语法错误。C++ 编译器只有在没有发现语法错误的情况下才会编译程序。它会显示所有发现的错误，并建议你使其有效，以便能够无任何错误地执行代码。


    # 编译你的第一个程序


    在编译你的第一个程序之前，你应该知道两件重要的事情。你的程序将写在 .cpp 文件中，这些文件稍会被添加到项目中。项目也被称为工作空间（workspaces）或解决方案（solutions）。代码文件和项目设置将保存到你的项目中。你应该从创建一个变量的新项目开始。


    什么是 C++ 变量？变量是存储值的东西。变量名就像一个名字，但给出的变量类型非常重要。赋值值的行被称为赋值。


    ```cpp

    int age = 25;

    ```


    赋值值的行被称为赋值。注意 C++ 对数字不使用引号。


    ```cpp

    std::cout << "42";

    ```


    该字符串的输出是 42。那里没有引号。变量名是一个字符串。下面给出的变量类型非常重要。变量的大小取决于架构。


    ## 大小变化


    前缀改变变量的大小，但你需要将它用于负数。有两种类型的尺寸。


    # 大小变化


    ```cpp

    short age;

    long age;

    ```

