    上述程序首先声明了一个整数 `x`，然后要求你输入一个值并将其显示在屏幕上。在其他人想通过乘法或除法来操作变量的情况下，你作为程序员必须声明更多的变量和某种形式的表达式，以向上面的程序添加一些代码。


    ![Image00067.jpg](img/Image00067.jpeg)


    在上方，程序声明了三个整数，并将变量 `z` 赋值为 `x` 和 `y` 的除法。当程序为 `x` 和 `y` 赋值后，会显示对应的变量 `z`。虽然上面的代码可以运行，但由于
    `z` 等于 `x` 除以 `y`，将会出现一个缺陷。在上面的例子中，如果用户给 `x` 赋值 `4` 并给 `y` 赋值 `2`，这没有问题，因为 `4`
    可以被 `2` 整除。然而，如果值是 `6` 和 `4` 会发生什么？让程序代码保持现状会提示你一个答案，主要因为据我所知，`x` 和 `y` 只包含不带小数的整数。在用户赋值
    `6` 和 `4` 的上述示例中，显而易见它们不能整除，除法将产生小数。那么，我们如何修复这个问题呢？答案相对简单；与其声明一个不能存储小数值的整数 `z`，我们可以将
    `z` 声明为 `double`。我倾向于说 `double` 数据类型优于整数，因为 `double` 数据类型能够存储小数。我们的程序看起来会是这样：


    ![Image00068.jpg](img/Image00068.jpeg)


    虽然程序代码看起来好多了，但它也有一些不完全正确的地方，如果你运行程序，仍然无法得到正确答案。你能猜出为什么吗？这是因为所谓的“截断”（truncation）。这听起来很复杂，但实际上并非如此。在上面的程序代码中，`x`
    和 `y` 是整数，如所见，如果两个整数的结果是小数，无法得到正确答案。


    简单来说，这就是截断的含义。要修复这个问题，其中一个变量必须是 `double` 类型。这样做会提示编译器识别这一点并将另一个整数临时转换为 `double`。或者，你也可以简单地将每个变量声明为
    `double`；这取决于你的主意。这里是完整程序的样子。


