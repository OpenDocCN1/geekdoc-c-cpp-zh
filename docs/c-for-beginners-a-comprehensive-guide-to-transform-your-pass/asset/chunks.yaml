    \n### Taking a stock\n\nI have only touched the basics of the STL, but now you\
    \ have enough information to use some of the foundational types in the library.\
    \ The `vector` class can be used to replace arrays altogether, and if you don’t\
    \ want to take the time to insert and modify, vectors can also be used in place\
    \ of lists. With the `vector` type at your fingertips, there are a few reasons\
    \ why you would want to use an array, most being advanced, such as when you work\
    \ with file I/o, which we will discuss at the end of this guide.\n\nThe single\
    \ most useful data type is the `map`. Using maps makes it easy to write sophisticated\
    \ programs without having to worry too much about data structure creation. Instead,\
    \ your attention can be focused on solving problems in some ways, the `map` can\
    \ replace a basic binary tree. Most of the time, you’ll want to go into binary\
    \ tree implementation unless it’s for a certain performance requirements, or you\
    \ you specifically need a tree structure.\n\nThat’s where the STL’s true power\
    \ lies: around 80 percent of the time, it gives you the core structures you need,\
    \ leaving you free to write the code that solves the problems. The rest of the\
    \ time, you will need the knowledge to build and implement your own data structures.\n\
    \nSome programmers prefer using their code instead of ready-built code. Most of\
    \ the time, you should not use your own data structures; the built-in ones are\
    \ faster, better, and more complete. however, knowing how to build them does give\
    \ you much better insight into using them.\n\nSo, when might you want to use your\
    \ own structures? Let’s say you want a calculator that allows arithmetic expressions\
    \ as input by users and then evaluates the inputs with the correct order of operations.\
    \ Bana example would be something like `4*9+8/3`, evaluated in a way that the\
    \ division and multiplication are done before the addition.\n\nThis kind of structure\
    \ can easily be thought of in terms of a binary tree. You could express `4*9+8/3`\
    \ like this:\n\n```\n+\n/\n4*83\n```\n\nEach node is evaluated in one of two ways:\n\
    \nIf the node is a number, the value is returned\nIf the node is an operator,\
    \ the values of the two subtree are computed, and the operation is performed.\n\
    \nTo build a tree like this you will require a raw data structure; you can’t just\
    \ use a `map`. If you only have the STL, you will struggle with this. however,\
    \ once you understand recursion and binary trees, it becomes a lot easier.\n\n\
    ## Chapter 9: STL\n\nSTL/cpp standard library: containers, algorithms, iterators\n\
    \nA common misconception is to refer to the C++ standard library as the STL. The\
    \ STL, for standard library as template, was developed some time ago. The++ standard\
    \ library is a set of templates which were deprecated but some are extremely useful\
    \ still.\n\nThe containers allow you to manage sets of data. Containers include\
    \ vectors, lists, and others. To handle your data of the same type, you need to\
    \ use a `vector` template:\n\n```\nvector<int> grades;\n```\n\nNow you are able\
    \ to access everything regarding a vector like:\n\n```cpp\nvector<int> grades;\n\
    ```\n\nAdding values to a vector is simple. You can push a value onto the vector\
    \ by doing this:\n\n```cpp\ngrades.push_back(55);\n```\n\nWhat if you want to\
    \ add values into the vector? Well, you can use the standard library's `insert()`\
    \ function. This function takes two arguments: the index and the values, like\
    \ this:\n\n```cpp\nvector<int> grades;\n```\n\nIf you want to insert multiple\
    \ values at once, you can use an initializer list:\n\n```cpp\nint[] mmp = {96,\
    \ 64, 75, 83};\ngrades.insert(grades.end(), mmp, mmp + 4);\n```\n\nTo go through\
    \ every item in the list, you use a `for` loop in other languages. In C we do\
    \ the following:\n\n```cpp\nfor (int bia : grades) {\n    cout << bia << \"\\\
    n\";\n}\n```\n\nWhat if we weren’t using a primitive data type but an object?\
    \ There are a few reasons why:\n\n```cpp\nclass Student {\n    // ...\n};\nvector<Student>\
    \ grades;\n```\n"
