  trans: "\n\n上面的程序创建了一个类型为 `tt` 的类。`tt(void rectangle<tt::setvalues(tt num1, tt num2))`\
    \ 语句指定函数参数也是模板参数，并且在调用类时应始终包含。\n\n### 带有多个参数的类模板\n\n你可以在类中拥有多个泛型数据类型。你可以在模板规范内部使用逗号分隔的列表来声明泛型类。\n\
    \n#### 语法\n```cpp\nTemplate<class xy, class xyz, ...>\nClass class-name\n{\n//function\
    \ body;\n};\n```\n\n#### 示例：带有两个泛型的类\n```cpp\nTemplate<class f1, class f2>\nClass\
    \ numbers\n{\n    f1 j;\n    f2 k;\npublic:\n    Numbers(f1 x, f2 y)\n    {\n\
    \        j = x;\n        k = y;\n    }\n    void print()\n    {\n        cout\
    \ << j << k << \"\\n\";\n    }\n};\n\nint main()\n{\n    Numbers<float, int> numbers1(2.5,\
    \ 23);\n    Numbers<int, char> numbers2(5, 'z');\n    numbers1.print();\n    numbers2.print();\n\
    \    return 0;\n}\n```\n**输出:**\n2.523\n5z\n\n函数的用法与普通函数相似，但通过模板适应多种数据类型。这使得函数变得更有用，因为你只需要编写一个程序。模板在编译时展开。类类模板，你可以创建一个带有不同参数的函数模板。\n\
    \n#### 语法\n```cpp\nTemplate<class type>\nReturn-type name(arguments)\n{\n    Function\
    \ body;\n};\n```\n\n在定义模板时，必要时必须在函数体和参数列表中包含模板类型。\n\n#### 示例 1：交换值的函数\n```cpp\n\
    Template<class t1>\nvoid swap(t1 &num1, t1 &num2)\n{\n    t1 val = num1;\n   \
    \ num1 = num2;\n    num2 = val;\n};\n```\n调用模板函数的方式与普通调用方式相同。\n\n#### 示例 2：函数模板的实现\n\
    ```cpp\nTemplate<class test>\nTest max(test x, test y)\n{\n    Test results;\n\
    \    results = x > y ? x : y;\n    return results;\n};\n\nint main()\n{\n    int\
    \ a = 5, b = 6;\n    double l = 4, m = 6;\n    c = max<int>(a, b);\n    n = max<double>(l,\
    \ m);\n    cout << c << endl;\n    cout << n << endl;\n    return 0;\n}\n```\n\
    在这个示例中，`test` 是模板参数。函数 `max` 使用不同的参数类型（`int` 和 `double`）调用了两次。当编译器实例化时，它会根据类型每次调用函数。使用特定类型实例化模板后产生的对象将与参数\
    \ `x` 和 `y` 的类型相同。\n\n上面的程序根据值的大小对值进行排序。如果使用 `numbers` 数组，则将应用排序算法对数字从小到大排序。\n\
    \n### 带有多个参数的函数模板\n![Image00090.jpg](img/Image0090.jpeg)\n就像类模板一样，你可以拥有多个由逗号分隔的泛型数据类型。\n\
    \n#### 示例：带有多个参数的模板类\n```cpp\nTemplate<class temp1, class temp2>\nvoid display(temp1\
    \ j, temp2 k)\n{\n    cout << j << \" \" << k << \"\\n\";\n}\n\nint main()\n{\n\
    \    J = display(2019, \"edge\");\n    K = display(18.5, 1854);\n    return 0;\n\
    }\n```\n**输出:**\n2019 edge\n18.5 1854\n\n#### 重载模板\n你可以使用相同的名称配合不同的模板参数来重载模板。如果没有找到匹配项，系统将生成错误消息。\n\
    \n#### 示例：重载模板\n```cpp\nTemplate<class m>\nvoid display(m)\n{\n    cout << \"\
    template: \" << m << \"\\n\";\n}\n\nvoid display(int n)\n{\n    cout << \"template:\
    \ \" << n << \"\\n\";\n}\n\nint main()\n{\n    display(0);\n    display(15.20);\n\
    \    return 0;\n}\n```\n**输出:**\ntemplate: 0\ntemplate: 15.20\n\n在创建类模板时，由于成员函数使用类型参数参数化，类外部的成员函数，因此模板应该定义成员函数。成员函数模板有三种定义方式：\n\
    1. 在文件作用域内显式定义，用于实例化模板的返回类型。\n2. 在文件作用域内带有模板参数。\n3. 在类内部。\n\n成员函数模板实例化了一个未显式生成的函数。如果类同时拥有成员函数和显式函数，则显式定义具有优先级。\n\
    \n#### 语法\n![Image00091.jpg](img/Image0091.jpeg)\n示例：带有成员函数模板的 vector 类\n![Image00092.jpg](img/Image0092.jpeg)\n\
    \n### 非类型模板参数\n模板可以有单个或多个类型参数。除了类型参数外，你还可以使用非类型参数模板。你可以使用字符串、常量、内置类型和函数名创建模板参数。\n\
    ![Image00093.jpg](img/Image0093.jpeg)\n\n上面的模板将数组的大小作为参数传递。编译器只在运行时才知道数组的大小。参数区域是在创建模板类时指定的。\n\
    \n"
- fmt: "\nWhile a template class ends up being limited to a library writers who want\
    \ a classes such as a map and a vector, every day programmers can also benefit\
    \ from being able to make their code more generic for you. So you shouldn’t use\
    \ a template just because you can; instead, you should be looking for opportunities\
    \ to get rid of classes that only differ by the type.\n\nYes, by the area you\
    \ are likely to find yourself writing more template methods than classes, but\
    \ you still need to have some idea of how to use them, especially if you have\
    \ data structures of your own that you want to implement.\n\nDeclaring a template\
    \ class isn’t very different from a template function. Let’s say that we want\
    \ to build a small class that will wrap an array:\n\n```cpp\ntemplate <typename\
    \ T>\nclass arraywrapper\n{\nprivate:\n    T *pmem;\n};\n```\n\nAs with the template\
    \ function, we begin with the declaration that a template is being introduced.\
    \ We use the `template` keyword, and then the template parameters area added.\
    \ We only have one parameter here, `T`.\n\nType `T` can be used whenever we want\
    \ the type that would be specified by the user, just like with template functions.\
    \ When a function is defined for a template class, the template syntax also has\
    \ been used. So let’s add a constructor to `arraywrapper` our class:\n\n```cpp\n\
    template <typename T>\nclass arraywrapper\n{\npublic:\n    arraywrapper(int size);\n\
    \nprivate:\n    T *pmem;\n};\n\n// So that the constructor can be defined outside\
    \ the class, we start by\n// indicating that the function is a template\ntemplate\
    \ <typename T>\narraywrapper<T>::arraywrapper(int size)\n: pmem(new T[size])\n\
    {\n}\n```\n\nWe start with the basic template introduction and declare the parameter\
    \ for the template. The difference is, the class name now has the `arraywrapper`\
    \ template in it, which tells everyone that this belongs to a template class and\
    \ isn’t a template function of a standard class called `arraywrapper`.\n\nIn this\
    \ implementation, the template parameter can be used to stand for the provided\
    \ type, just as with the template functions. however, the function will need to\
    \ idea the size from the first type declaration for example, by writing `vec<int>size();`.\n\
    \nTo get the size of a vector of integers, you need to write `vec.size()`.\n\n\
    Templates in header files up now we have to write everything directly into `.cpp`\
    \ files. If we want to place our template declaration into the header? The problem\
    \ here is that the code makes use of classes or template functions needs to access\
    \ the whole template definition for every single function call that is a template\
    \ class. This is not the same way a standard function works; usually, if you placed\
    \ the class in a header file, you would also need to add the full definition along\
    \ with the `add()` method putting them all into one `.cpp` file normally. If you\
    \ didn’t do this, you would not be able to use `calc`.\n\nThis is a rather unfortunate\
    \ thing about templates, and it’s about how templates have been compiled. Most\
    \ of the time, when the compiler parses the first time, it pretty much ignores\
    \ templates. It’s only when a template is used with a concrete type attached that\
    \ the compiler generates the code for that type. To do that, the template has\
    \ be available to the compiler so the code can be generated. The result of this\
    \ is that template code has included in all files that will use that template.\
    \ And, when a file that has a template is compiled, you may not learn of any syntax\
    \ errors in that template until the template is used for the first time.\n\nThe\
    \ easiest thing to do, when creating a template class, is to place template definitions\
    \ into the header file. It’s also helpful if you use an extension other than `.h`,\
    \ just to indicate that the file is a template—for example.\n\n## Error messages\n\
    \nIf there is a significant downside to using templates, it’s that many compilers\
    \ will throw errors that are not easy to understand when a template is used, whether\
    \ you write it or not. You could end up with pages of errors just for one mistake.\
    \ Template error messages are not easy simply because the template parameters\
    \ area expanded to their fullest, even those that you don’t normally use.\n\n\
    There is a similar constraint on the second parameter for the `vector` template—this\
    \ requires a type that has support more functionality than the humble `int` gives.\
    \ The errors area complaining about the multitude of ways that `int` just isn’t\
    \ a valid type for the parameter.\n"
