    Now that you have the source code for the program, a bit to compile using your
    compiler. More details later, first I want to start going over what makes up your
    code. The next chapter details that you will need to learn to become a successful
    C++ programmer.


    # Structure of the C++ program


    As we have already discussed, a computer program is nothing but a set of instructions
    in a sequence that tells the computer what to do.


    ## Statements and expressions


    In C++, a statement is nothing but the smallest and independent unit in the program.
    It is also the most common form of instruction in a programming language. In C++,
    statements are a way to convoy your instructions to the compilers to carry out
    a specific task. We use '';'' to terminate a statement. In C++, there are many
    kinds of statements, and some of the most common types of statements given below.


    ```cpp

    int x;

    x = 5;

    std::cout << x;

    ```


    We will discuss the functions of the above statements in later chapters.


    ## Functions


    Functions are an area of statements in a sequence which are executed in sequential
    order. There is a function called the `main` function, and it must be in every
    C++ program when any C++ program is run, the execution of the program starts within
    the `main` function. Functions have a very specific job to perform and they perform
    only those jobs. For you to become a good C++ programmer, you need to know how
    to use functions efficiently. In the next chapter, you''ll learn more about functions.


    ## Libraries and the C++ standard library


    Libraries are a collection of code which is pre-compiled. They are used within
    different programs. If you wish to extend the capabilities of your program, you
    can add libraries. The core C++ language is minimalistic and straightforward,
    but it also comes with a built-in library called the C++ standard library. The
    C++ standard library provides us with additional functionalities.


    ## Syntax and errors


    We all know that in many languages, sentences are constructed following the grammatical
    rules of that particular language. Take the example of the English language where
    you normally end sentences with a period. All rules which govern the construction
    of sentences is called syntax. Similarly, C++ also has syntax. Note that not following
    the syntax will simply leave your code invalid. It is the responsibility of the
    compiler to see that the basic syntax of the C++ language is followed. If you
    violate the basic syntax, the compiler will compile the code and will complain
    about the syntax violation. That issue is called a syntax error. C++ compilers
    only compile the program if there are no syntax errors found. It will display
    all the errors found and suggest you to make them valid so that you could execute
    the code without any errors.


    # Compiling your first program


    There are two important things that you should know before you go to compile your
    first program. Your programs will be written in .cpp files, which will be added
    to your project later. Projects are also called as workspaces or solutions. The
    code files and the idea settings will be saved to your project. You should start
    a new project creating a kind of variables.


    What makes a C++ variable? A variable is something that stores a value. The variable
    name is like a name, but the type of variable given below is important. The line
    that assigns a value is called assignment.


    ```cpp

    int age = 25;

    ```


    The line that assigns the value is called assignment. Note that C++ does not use
    quotation marks for numbers.


    ```cpp

    std::cout << "42";

    ```


    The output of a string is 42. The quotation marks are not there. The variable
    name is a string. The type of variable given below is important. The size of the
    variable depends on the architecture.


    ## Size changes


    The prefix changes the size of the variable, but you need to use it for negative
    numbers. There are two types of sizes.


    # Size changes


    ```cpp

    short age;

    long age;

    ```

