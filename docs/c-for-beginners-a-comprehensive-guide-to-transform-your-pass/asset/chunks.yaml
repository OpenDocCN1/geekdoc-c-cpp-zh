  trans: "\n\n```cpp\nreturn this->name;\n}\n\nvoid setname(string name) {\n    this->name\
    \ = name;\n}\n```\n\n现在，在你的 `main` 方法中，在声明任何动物对象后，不要直接修改它的 `name` 属性，而应该使用像下面的\
    \ get/set 方法（假设你的实例动物名为 \"dog\"）：\n\n```cpp\nDog.setname(\"dog\");\n```\n\n然后，你可以通过在主方法中打印名称来测试这一点：\n\
    \n```cpp\ncout << \"the name of my favorite animal is: \" << dog.getName() <<\
    \ \"\\n\";\n```\n\n这些方法的工作原理是通过类内部的方法返回该值。`this->` 是 `this` 指针，它指向类特定实例的变量。每个对象都可以访问其变量，并可以通过\
    \ `this` 指针直接修改它们。\n\n无论如何，你的代码运行起来会非常出色。但如果你不想为每个类的每个实例都通过 get/set 来操作呢？那么，你可以使用所谓的“初始化函数”（initializer\
    \ function）。\n\n修改你的类使其看起来像这样：\n\n```cpp\nclass Animal {\nprivate:\n    String\
    \ name;\n\npublic:\n    Animal(string name) {\n        this->name = name;\n  \
    \  }\n\n    String getName() {\n        return this->name;\n    }\n\n    void\
    \ setname(string name) {\n        this->name = name;\n    }\n};\n```\n\n现在在你的\
    \ `main` 函数中，当你创建一个初始化函数时，可以去掉声明 `animal x` 后面跟着 `x.setname(\"name\")` 函数的代码块，你可以从一开始就设置某些变量。\n\
    \n例如，由于你的初始化函数接收参数 `name`，你可以在声明变量时直接绕过整个 `setname` 操作。看这个示例代码：\n\n```cpp\nAnimal\
    \ dog(\"dog\");\nAnimal elephant(\"elephant\");\nAnimal bird(\"bird\");\n```\n\
    \n这些都是 `Animal` 类的独立实例，得益于函数初始化器，它们的名称在没有使用 set 函数的情况下就已经设置好了。它可以接受任何你需要的数量的参数。这使得创建新对象变得极其容易，整个过程也变得精简。\n\
    \n现在我们已经简要讨论了对象的声明以及本质属性，让我们更多地谈谈可以使用它们进行的具体操作。这里的对象代表一类动物。我们可以为整个类设置它们可以执行的方法。\n\
    \n让我们思考一下每种动物都会做什么。每种动物都会睡觉、进和喝水，对吧？所以，将这些包含在你的类中并并不奇怪，这样 `Animal` 类的每个成员对象都可以执行这些方法。\n\
    \n假设我们有两种特定的食物：肉类和植物，它们也都由各自的对象来表示。我们可以为此创建两个不同的函数：\n\n```cpp\nvoid eat(plant\
    \ p) {\n    // code here\n}\n\nvoid eat(meat m) {\n    // code here\n}\n```\n\n\
    尽管它们共享相同的名称，但你可以根据在函数调用中包含的对象类型来调用其中任何一个，并且它们都会根据你包含的参数执行各自相应的代码。这被称为**函数重载**（function\
    \ overloading）。它是面向对象编程中的一项基本技术，可以帮助你创建功能强大且易于他人使用的清晰代码集。\n\n在我们学习类时，我们正在深入学习使得类在面向对象编程中变得极其有用且实用的内容。由于使用了类，你的代码最初看起来应该是这样的：\n\
    \n```cpp\nclass Animal {\nprivate:\n    String name;\n\npublic:\n    Animal(string\
    \ name) {\n        name = name;\n    }\n\n    String getName() {\n        return\
    \ name;\n    }\n\n    void setname(string name) {\n        name = name;\n    }\n\
    \n    void eat() {}\n};\n```\n\n在下一章中，我们将介绍类。类是一种用户定义的类型，具有数据成员和成员函数。通常来说，类是一个表示类实例的蓝图。类定义中的数据成员是变量。\n\
    \n### 关于类的重要点\n\n类名习惯上以大写字母开头。\n\n```cpp\nclass Human\n```\n\n函数重载允许类拥有多个同名的函数，但它取决于访问修饰符，如\
    \ private（私有）、public（公共）或 protected（保护）。\n\n"
- fmt: "\nWe can define a class with member functions, a class, and a definition that\
    \ can be either inside or outside the class.\n\nClass in C++ is similar to structures\
    \ but with the only difference being that by default, access control for classes\
    \ is private while for structures is public.\n\nC++ provides all important features\
    \ of object-oriented programming as encapsulation, abstraction and inheritance,\
    \ etc. with classes.\n\nEach object of a class has its separate copy of data members,\
    \ and we can create many numbers of objects for a class as needed.\n\n# Objects\n\
    \nClass is just a blueprint with defining a class, no memory is allocated to it.\
    \ Memory is allocated only after objects are created for that class. The objects\
    \ area contains instances having the data variables declared in that class and\
    \ the member functions of that class work on the instances.\n\nObjects area are\
    \ initialized with special constructor – a special methods which we will study\
    \ later. A destructor is another special function that destroys the object when\
    \ it goes out of scope.\n\n```cpp\nClass Mobiles{\n\n  Int price;\n\n  Void calling()(){}\n\
    \n  Void messaging()(){}\n\n};\n\nVoid main(){\n\n  Mobiles m1; // an object created\
    \ for class Mobiles\n}\n```\n\n# Constructors\n\nConstructors are special functions\
    \ similar to class member functions and having a important task of object initialization.\
    \ As an object is created, the compiler makes a call to the constructor. The constructor\
    \ initializes the created object by initializing its members after the storage\
    \ is provided to that particular object. There is at least one constructor for\
    \ a class, and if there is no explicitly defined constructor in a class, a default\
    \ constructor with no parameters comes into existence.\n\n```cpp\nClass test\n\
    {\n\n  Char c;\n\nPublic:\n\n  Test(); // a constructor\n};\n\nClass test\n{\n\
    \n  Int a;\n\nPublic:\n\n  Test(); // declaration for a constructor\n\n  Test::test()\
    \ // defining a constructor\n\n  {\n\n    A=1;\n  }\n\n};\n```\n\n# Destructors\n\
    \nDestructor is a special class function having a special responsibility of destroying\
    \ the object as object goes out of scope. The compiler automatically calls the\
    \ constructor as an object goes out of the scope.\n\nA destructor has the same\
    \ syntax as a constructor with a single difference that that tilde symbol `~`\
    \ is used for destructor declaration. Also, a destructor has no argument.\n\n\
    ```cpp\nClass test\n{\n\nPublic:\n\n  ~test(); // a destructor for class test\n\
    };\n```\n\n# Example for demonstration of calling of constructor and destructors\n\
    \n```cpp\nClass test{\n\n  Test()\n  {\n\n    cout << \"aa constructor has been\
    \ called\";\n  }\n\n  ~test()\n  {\n\n    cout << \"aa destructor has been called\"\
    ;\n  }\n};\n\nInt main()\n\n{\n\n  Test test1; // constructor is called\n\n  Int\
    \ a=18;\n\n  If(a)\n\n  {\n\n    Test test2; // again constructor is called\n\n\
    \  } // obj2 goes out of scope and destructor is called for that obj2\n\n} //\
    \ destructor is called for the object obj1\n```"
