    ## Introduction

    Welcome to the wonderful world of programming, the chapters contained in this
    book will give you a basic understanding of programming++. By the final chapter,
    you will be able to create a complete program of your own, using C++.


    This guide is aimed at newcomers to C++. If, however, you are entirely new to
    programming, I recommend first reading a primer on programming it covers all the
    concepts, terms, programming paradigms and coding techniques that a novice needs
    to know.


    This guidebook is going to take some time to look over all the things that we
    can do with the C++ language, and how beneficial learning this language can be.


    This object-oriented programming course in C++ language presents learners with
    the concepts and techniques necessary to design, develop and implement a robust
    program model effectively. As a learner, you will be able to grasp practical knowledge
    of how to apply the fundamental concepts of object-oriented analysis and design
    to solve various problems in your day day activities.


    C++ is a computer programming language widely used for general-purpose programming.
    It is an extension of C-language. The basic understanding of C++ can be acquired
    from C. That''s why both computer languages are represented as C/C++. Developed
    this multi-paradigma language in 1979.


    In today’s world, many operating systems use C++ as their basic language. Some
    system drivers, browsers, and games are based on C++ programs. It is free, compiled
    and statically typed programming language. Many professionals believe that C++
    is the most efficient language to achieve the desired results.


    Learning code is ultimately the language of the future. We all heard something
    close to that some point in our lives.


    By the time you reach the end, you should have no problem reading C++ code and
    writing programs that are both interesting and useful. So, let''s dive into learning
    C++.


    ## Chapter 1: anatomy of C++

    ### Introduction to programming languages

    As you already know, the program is nothing but a set of instructions. The instructions
    are executed by the hardware, which is the physical computer machinery. Though
    modern computers are fast, they have their limitations. Computers only understand
    a set of instructions given in their native language. For this, you should understand
    the concepts of machine language, assembly language, and high-level languages.


    ### Machine language

    Though computers are advanced, they cannot understand languages like C++ directly.
    Computers understand `0`s and `1`s called bits. This is a set of instructions
    given in binary format that we need translated for a processor to do a job. Different
    processors have different types of instructions. For example, the Pentium processors
    have an instruction set similar to Macintosh. In the very beginning, programmers
    had to write their instructions in binary. It was very time-consuming and challenging.
    Luckily, we don''t have to go through that.


    ### Assembly language

    As the machine language is tough to deal with, a new language called assembly
    language was invented. Here every instruction is given a short name, and the variables
    are replaced by names instead of binary digits, making it easier for a programmer
    to write code. You may ask how you can understand the assembly language it cannot.
    The assembly language will be converted into machine language with the help of
    a assembler. Remember that each CPU has an assembly language.

