- fmt: "\nIf you are not comfortable with programming in C++, you will realize that\
    \ `cout`, `cin`, and endl will come a lot in coding. Using the method you have\
    \ will be tedious; therefore, you should opt to instruct the compiler by using\
    \ the `std` namespace to make your work faster.\n\n## Chapter 2: declaring constants\n\
    \n### C++ constants\n\nConstants are fixed values that programs may not allow\
    \ to alter, and they are referred to as literals. A `const` belongs to any of\
    \ the basic data types. Note that regular variables with the difference being\
    \ that the values of constants cannot be changed after definition.\n\nTo define\
    \ a constant using the `#define` preprocessor, we use the syntax given below:\n\
    \n```\n#define identifier value\n```\n\nThe `identifier` is the name of the constant\
    \ while `value` denotes the value assigned to the constant. The following program\
    \ describes how this can be done:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\n#define width 7\n#define length 11\n\nint main() {\n    int rectangle_area;\n\
    \    rectangle_area = length * width;\n    cout << \"the area of the rectangle\
    \ is \" << rectangle_area;\n    return 0;\n}\n```\n\nIn the above example, we\
    \ have defined two constants, namely `width` and `length`. We have assigned values\
    \ of `7` and `11` to these respectively. We also have defined the variable `rectangle_area`\
    \ and assigned it the value of the product of the two constants. We then printed\
    \ the value of this variable.\n\nWhen executed, the code should return the following\
    \ base output:\n\n### Using the `const` keyword\n\nWe can also define a constant\
    \ by using the `const` keyword. To do this, we use the syntax given below:\n\n\
    ```\nconst data_type variable = value;\n```\n\nNote that we have to define the\
    \ data type of the constant; the value of the constant this time has assigned\
    \ using the assignment operator (`=`). Let us give an example demonstrating this:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    const\
    \ int length = 7;\n    const int width = 11;\n    int rectangle_area;\n    rectangle_area\
    \ = length * width;\n    cout << \"the area of the rectangle is \" << rectangle_area;\n\
    \    return 0;\n}\n```\n\nWe have just created the same example, but this time,\
    \ the constants have been defined using the `const` keyword.\n\nWhen executed,\
    \ the code should return the following result:\n\nNote that programmatically,\
    \ it is always good to name constants in the upper case.\n\n### Working with C++\
    \ data types\n\nNow that we have created your very first program, there is something\
    \ else of equal importance, if not greater, than spending every hour writing your\
    \ code; documentation.\n\nEvery program needs a documentation, if not to help\
    \ other programmers understand your program, but to help you understand your program\
    \ by yourself a years after writing a bit. That may sound like being a magic \"\
    code\" but in the world, you need to succeed to understand. In a language, if\
    \ you use slashes `//` the compiler will ignore anything between the two lines.\
    \ Throughout your life, you will need to add documentation to your work to avoid\
    \ confusion.\n\nIt is always good to name constants in the upper case because\
    \ it is most possible, but when you use a variable, you must assign a value in\
    \ the following manner:\n\n```cpp\nint x = 12;\n```\n\nIn this example, we use\
    \ `cin` to get a value from the user, then we print the output. Note that in this\
    \ language, there is no `printf`, and instead, `cout` is a placeholder for the\
    \ console. If you want to assign a value to a variable, you must use `cin` to\
    \ get the number:\n\n```cpp\nint x;\ncin >> x;\ncout << x;\n```\n"
