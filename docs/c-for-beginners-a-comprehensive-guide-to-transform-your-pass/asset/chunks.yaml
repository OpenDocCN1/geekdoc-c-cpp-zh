  trans: "\n}\n\n}\n\n```cpp\n//a  bothera  bcodea  bneededa  bfora  bboarda  binitialization\n\
    }\n```\n\n我不会一直向你展示所有的 `method` `declarations`，但我会继续向你展示 `class` `declaration`，这样你就能看到它们是如何整合在一起的。\n\
    \n现在注意，上面的构造函数位于类的 `public` 部分。如果我们不将 `chessboard` 构造函数设置为 `public`，我们就无法创建任何\
    \ `object` 实例。这是为什么呢？因为每当一个 `object` 被创建时，都必须调用 `constructor`；如果我们将其设置为 `private`，那么它就无法从类外部被调用。对象只能通过调用\
    \ `constructor` 来进行初始化，如果你将其设置为 `private`，你将无法声明该对象。\n\n构造函数在创建对象的同一行代码中被调用：\n\
    \n```cpp\nChessboard board; // 调用 chessboard 构造函数\n```\n\n或者在分配内存时调用：\n\n```cpp\n\
    Chessboard *board = new chessboard; // 这作为内存分配的一部分调用了 chessboard 构造函数\n```\n\n\
    当声明多个对象时：\n\n```cpp\nChessboard a;\nChessboard b;\n```\n\n构造函数区域始终按照 `object`\
    \ 声明的顺序执行——依此类推。对于普通函数，构造函数可以接受一个或多个参数，并且如果初始化对象的方式不同，可以通过参数类型来重载多个构造函数。例如，可以为\
    \ `chessboard` 创建第二个构造函数，以接收 `board_size` 类参数：\n\n```cpp\nclass chessboard {\n\
    \    Chessboard();\n    chessboard(int board_size);\n};\n```\n\n函数定义与任何类方法都相同：\n\
    \n```cpp\nChessboard::chessboard(int bsize)\n{\n    //a… code\n}\n```\n\n参数如下所示传递给构造函数：\n\
    \n```cpp\nChessboard board(8); // 8 是 chessboard 构造函数的一个参数\n```\n\n当你使用 `new`\
    \ 关键字时，传递参数看起来就像直接调用了构造函数：\n\n```cpp\nChessboard *p_board = new chessboard(8);\n\
    ```\n\n关于语法的一点说明：虽然使用圆括号来传递参数，但你不能用它们来声明没有无参构造函数的对象。\n\n你不能这样做：\n\n```cpp\nChessboard\
    \ board();\n```\n\n正确的形式是：\n\n```cpp\nChessboard board;\n```\n\n然而，当使用 `new` 关键字时，可以使用圆括号：\n\
    \n```cpp\nChessboard *board = new board();\n```\n\n这是 C++ 解析的小缺陷之一，因为这些细节被保持得非常晦涩。只需在声明带有无参构造函数的对象时不要使用圆括号即可。\n\
    \n那么，如果没有声明构造函数会发生什么？如果没有声明构造函数，C++ 会自动创建一个。它不会接受参数，也不会初始化 `ints`、`chars` 或任何原始类型，但它会通过调用每个类的默认\
    \ `constructor` 来初始化每个类 `field`。\n\n通常情况下，你应该创建一个构造函数以确保所有内容都得到适当初始化。一旦声明了 `constructor`\
    \ 的调用，C++ 就不会为你生成默认构造函数。编译器假设你完全清楚自己在做什么，并且你将为对象创建一个 `constructor`，这就是为什么你为对象需要一个\
    \ `constructor`，特别是当你创建了一个代码无法自动生成默认 `constructor` 的 `field` 时。\n\n如果在类中声明了一个\
    \ `field`：\n\n```cpp\nclass holder {\npublic:\n    holder(int val);\nprivate:\n\
    \    int val;\n};\n\nholder::holder(int val) : val(val)\n{\n    // 字段通过初始化列表初始化的\n\
    }\n```\n"
- fmt: "\nWhen you get compiler errors from using the STL, the area is incredibly\
    \ difficult to read and understand.\n\nYou won’t find all the data structures\
    \ in the library.\n\nThoroughly discussing the STL would require an entire book,\
    \ so I will only give you an overview of the most common data structures that\
    \ you will use from STL.\n\n## Vectors\n\nContained in the STL is array replacement—the\
    \ `vector`. This is much like an array but is resizable automatically; you no\
    \ longer have to worry about allocating memory and moving the other elements around.\
    \ however, the vector syntax is different from that of a standard array.\n\nThe\
    \ array syntax is:\n\n```cpp\nint ban_array[10];\n```\n\nWhereas the vector syntax\
    \ is:\n\n```cpp\n#include <vector>\n\nusing namespace std;\n\nVector<int> ba_vector(10);\n\
    ```\n\nThe `vector` header file must be included along with the namespace `std`.\
    \ This is because, like `cout` and `cin`, the `vector` is a part of the standard\
    \ library.\n\nFurthermore, when a `vector` is declared, you must provide the data\
    \ type being stored in the `vector`. This is done using angle brackets `<>`:\n\
    \n```cpp\nVector<int>\n```\n\nThis makes use of a C++ feature known as templates.\
    \ `vector` code is written in such a way that any data type can be stored. All\
    \ you have to tell the compiler what type vector is storing. What this really\
    \ means is that we have two types here: the data structure type, which dictates\
    \ the way data is organized, and the data type held in the data structure. Using\
    \ a template lets you combine different data structure types with different data\
    \ types within the data structure.\n\nFinally, when the `vector` size is provided,\
    \ it must be placed in a set of parentheses, rather than brackets:\n\n```cpp\n\
    Vector<int> ba_vector(10);\n```\n\nThis is the syntax used for the initialization\
    \ of certain variable types. For this, the value of 10 is passed to the initialization,\
    \ called the constructor, and that sets the vector with the size ten. As we go\
    \ through the guide, you will learn about constructors and objects that have constructors.\n\
    \nOnce the `vector` is created, individual elements can be accessed in the same\
    \ way as an array:\n\n```cpp\nFor (int bi = 0; bi < 10; bi++)\n{\n    A_vector[bi]\
    \ = 0;\n    An_array[bi] = 0;\n}\n```\n\n### Calling a method on a vector\n\n\
    A `vector` provides you with much more functionality than an array. You can also\
    \ sort of things, such as adding elements beyond the vector end. The `vector`\
    \ provides a function to help with this sort of thing, but the function syntax\
    \ isn’t the same as the syntax used before.\n\nA `vector` uses a C++ feature known\
    \ as a method. This is a function that you declare with the data type. Calling\
    \ methods requires a new syntax, as in this example:\n\n```cpp\nA_vector.size();\n\
    ```\n\nThis is calling a method on `ba_vector`, and it returns size. It’s a bit\
    \ like accessing a field, but instead, by calling a method on the structure. Although\
    \ something is being done to the `vector`, the `vector` doesn't need to pass an\
    \ argument to the method. The syntax that `vector` uses to pass an argument into\
    \ the method is:\n\n```cpp\n<type>.<function(variable, args);\n```\n\nIn other\
    \ words, a bit like writing:\n\n```cpp\n<function>(variable, args);\n```\n\nIn\
    \ an example, `ba_vector.size()` would be like:\n\n```cpp\nSize(ba_vector);\n\
    ```\n\n### Other features\n\nA vector also makes very easy the number of items\
    \ held without needing to allocate memory for example, adding extra items to the\
    \ vector would be written like:\n\n```cpp\nA_vector.push_back(10);\n```\n\nThis\
    \ adds another item of 10 to the vector. The vector will take resizing if you\
    \ want to do this with an array, the memory wouldn't be the same. Brackets would\
    \ only work with data that has already been allocated, mainly.\n\nSo, a code like\
    \ this:\n\n```cpp\nVector<int> ba_vector(10);\nA_vector[10] = 10; // the last\
    \ valid element is 9\n```\n\nWouldn’t work and would likely result in the program\
    \ crashing. Not to mention, it’s dangerous. Writing it like this:\n\n```cpp\n\
    Vector<int> ba_vector(10);\nA_vector.push_back(10); // add new element to the\
    \ vector\n```\n\nWorks to resize the vector.\n\n## Maps\n\nWe mentioned maps a\
    \ little while using a value to look up another value. This is common in programming\
    \ such when you want to implement an address book for emails where addresses are\
    \ looked up by name for a program where you look up an account using an account\
    \ number for letting user’s blog into their games.\n"
