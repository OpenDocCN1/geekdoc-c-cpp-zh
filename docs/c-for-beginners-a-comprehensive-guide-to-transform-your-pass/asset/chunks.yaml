    \ in the superclass virtual, and when we delete up a `drawable` interface, the\
    \ overridden destructor gets called. As a rule, when you make any superclass method\
    \ virtual, the superclass destructor should be made virtual as well. Once a method\
    \ is made virtual, you are saying that the class can pass around methods that\
    \ do whatever they want, and that includes deleting the object virtual makes sure\
    \ that the object is cleaned up properly.\n\n## Chapter 5: operator type and overloading\n\
    \nOperators in c++\n\nC++ provides a rich set of operators that perform a number\
    \ for different functions and constants and variables. C++ has mainly the following\
    \ types of operators:\n\n- Arithmetic operators as addition, multiplication, etc.\n\
    - Relational operators as less than, greater than, etc.\n- Logical operators as\
    \ and, or, etc.\n- Bitwise operators\n- Assignment operators\n- Arithmetic operators\n\
    \nC++ mainly provides it arithmetic operators. We will discuss each operator with\
    \ two variables `x` and `y` where `x` has a value of 45 and `y` has a value of\
    \ 25.\n\n![Image00078.jpg](images/Image00078.jpeg)\n\nRelational operators\n\n\
    C++ mainly provides it relational operators. the operators provide a resultant\
    \ value as true or false and generally used in condition checks. We will understand\
    \ the meaning of each operator with two variables `x` and `y` where `x` has a\
    \ value of 45 and `y` has a value of 25.\n\n![Image00079.jpg](images/Image00079.jpeg)\n\
    \n![Image00081.jpg](images/Image00081.jpeg)![Image00080.jpg](images/Image00080.jpeg)\n\
    \nLogical operators\n\nC++ supports the following 3 logical operators, which we\
    \ will explain using two variables `x` and `y` where `x` having a value of 0 and\
    \ `y` having a value of 1.\n\nA\n\nBitwise operators\n\nBitwise operators perform\
    \ their functionality bit by bit. bitwise and operator performs operator on every\
    \ two corresponding bits of two operands and bitwise or performs operator on every\
    \ two corresponding bits of two operands\n\n![Image00082.jpg](images/Image00082.jpeg)\n\
    \nAssume if `x=13;` and by `y=60;`\n\n`Xa = 00001101`\n`Ya = 00111100`\n`X|ya\
    \ = 00111101`\n`X&ya = 00001100`\n\nTable showing bitwise operator with `p= 60`\
    \ and `q= 13`\n\n![Image00083.jpg](images/Image00083.jpeg)\n\n![Image00084.jpg](images/Image00084.jpeg)\n\
    \nAssignment operators\n\n![Image00085.jpg](images/Image00085.jpeg)\n\n![Image00086.jpg](images/Image00086.jpeg)\n\
    \nOperators precedence and associativity\n\nEvery operator has precedence and\
    \ associativity associated with it. precedence of operators is used in determining\
    \ the sequence of operators for evaluating an expression in case expression has\
    \ several operators. In a expression, the operators having higher precedence area\
    \ are evaluated first. Associativity is a concept used when multiple operators\
    \ have the same precedence, it determines the evaluation from left.\n\n![Image087.jpg](images/Image087.jpg)\
    \ Overloading\n\nIn c++, we specify more than a function by operator overloading.\
    \ Operator overloading is a declaration in the same scope as previous declaration.\
    \ After the declaration, the compiler will determine the most appropriate function\
    \ by operator overloading with arguments.\n\nOperator overloading in C++ allows\
    \ overloading operators with built-in types. Operator overloading means that programmers\
    \ can use operators with user-defined types. Operator overloading is a simple\
    \ overload like a function, but it will have a return type and parameters.\n\n\
    ```cpp\nRectangle operator+(const rectangle&);\n```\n\nIn the example below, we\
    \ demonstrate the process of operator overloading by using a member function.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nclass rectangle\n{\npublic:\n\
    \    double getarea() {\n        return length * breadth;\n    }\n    void setlength(double\
    \ len) {\n        length = len;\n    }\n    void setbreadth(double bre) {\n  \
    \      breadth = bre;\n    }\nprivate:\n    double length;\n    double breadth;\n\
    };\n```\n"
