    High-level programming languages came into existence to solve those problems that
    assembly and machine languages were causing. The sea can run any computer. High-level
    languages come with a program called a compiler. The role of a compiler is to
    generate an executable file that a CPU can directly understand. The programs are
    standalone programs. Modern compilers that are available today are very efficient
    and fast at converting the code into an executable format. Some of programming
    languages use the interpreter. The job of an interpreter is to execute the code
    but without compiling it into machine code. But here we won’t learn about an interpreter.
    Any given programming language can be interpreted or compiled. Languages like
    C, C++, and Pascal are compiled while scripting languages like JavaScript and
    Perl are interpreted.


    Ask this question, and you will get dozens of different answers, but simply, C++
    is a compiled, object-oriented computer programming language. If you are new to
    programming, even that has probably left you somewhat confused, so let''s break
    it down a bit more.


    There are two types of programming language – one is interpreted, and the other
    is compiled. Interpreted languages read the code and execute the commands inside
    one at a time. The CPU compiles languages instead of a program; computers cannot
    read letters; they only read binary numbers, so when you write your code, it is
    translated into binary first. This is called compiling.


    The object-oriented part of the explanation just describes how the code is structured,
    but it will be going into more detail later on.


    What does all this mean to me?


