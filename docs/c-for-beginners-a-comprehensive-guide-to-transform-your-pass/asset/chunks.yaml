  trans: "\n```cpp\nclass figure {\nprotected:\n    int breadth, length;\npublic:\n\
    \    figure(int x = 0, int y = 0) {\n        breadth = x;\n        length = y;\n\
    \    }\n    virtual int area() {\n        cout << \"area of parent class:\" <<\
    \ endl;\n        return 0;\n    }\n};\n\nclass rectangle: public figure {\npublic:\n\
    \    rectangle(int x = 0, int y = 0) : figure(x, y) {}\n    int area() {\n   \
    \     cout << \"area of rectangle class:\" << endl;\n        return breadth *\
    \ length;\n    }\n};\n\nclass square: public figure {\npublic:\n    square(int\
    \ x = 0, int y = 0) : figure(x, y) {}\n    int area() {\n        cout << \"area\
    \ of square class:\" << endl;\n        return breadth * length;\n    }\n};\n\n\
    // main function\nint main() {\n    figure*figure;\n    rectangle rec(10, 7);\n\
    \    square sq(5, 5);\n\n    // store address of rectangle figure\n    figure\
    \ = &rec;\n    // call rectangle area.\n    figure->area();\n\n    // store address\
    \ of square figure\n    figure = &sq;\n    // call square area.\n    figure->area();\n\
    \n    return 0;\n}\n```\n\n代码将返回以下输出：\n\n![Image00076.jpg](img/Image00076.jpeg)\n\
    \n输出是错误的。原因是 `area()` 函数的调用仅由编译器根据基类的版本进行设置。这是因为函数调用的静态解析在程序执行之前就已经固定了。有时，这被称为**早期绑定**（early\
    \ binding），因为它发生在程序的编译期间。\n\n让我们对代码进行修改，使得 `area()` 函数在 `figure` 类中被声明。然而，我们将像下面所示使用\
    \ `virtual` 关键字来声明它：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    class figure {\nprotected:\n    int breadth, length;\npublic:\n    figure(int\
    \ x = 0, int y = 0) {\n        breadth = x;\n        length = y;\n    }\n    virtual\
    \ int area() {\n        cout << \"area of parent class:\" << endl;\n        return\
    \ 0;\n    }\n};\n\nclass rectangle: public figure {\npublic:\n    rectangle(int\
    \ x = 0, int y = 0) : figure(x, y) {}\n    int area() {\n        cout << \"area\
    \ of rectangle class:\" << endl;\n        return breadth * length;\n    }\n};\n\
    \nclass square: public figure {\npublic:\n    square(int x = 0, int y = 0) : figure(x,\
    \ y) {}\n    int area() {\n        cout << \"area of square class:\" << endl;\n\
    \        return breadth * length;\n    }\n};\n\nint main() {\n    figure*figure;\n\
    \    rectangle rec(10, 7);\n    square sq(5, 5);\n    figure = &rec;\n    figure->area();\n\
    \    figure = &sq;\n    figure->area();\n    return 0;\n}\n```\n\n代码现在应该返回以下结果：\n\
    \n![Image00077.jpg](img/Image00077.jpeg)\n\n编译器考虑的是指针的元素而不是位。类对象将调用它们各自的 `area()`\
    \ 函数定义。每个派生类都有名为 `area()` 函数的不同实现。这被称为**多态**（polymorphism）。你拥有多个具有相同函数名和相同参数的类，但实现是不同的。\n\
    \n注意我们使用了 `virtual` 关键字来使函数成为虚函数。当基类中定义了一个虚函数而在派生类中定义另一个版本时，这将向编译器发出信号，表明不需要对函数进行静态链接。我们只需要根据调用函数的对象类型来选择调用的函数。这种操作被称为**晚绑定**（late\
    \ binding）或**动态链接**（dynamic linkage）。\n\n有时，你可能需要在基类中包含虚函数以便在派生类中对其重新定义以适应类对象，但你没有为基类中的函数提供有意义的定义。在这种情况下，你有如下代码：\n\
    \n```cpp\nclass figure {\nprotected:\n    int breadth, length;\npublic:\n    figure(int\
    \ x = 0, int y = 0) {\n        breadth = x;\n        length = y;\n    }\n    virtual\
    \ int area();\n};\n```\n\n注意在基类中使用 `virtual` 函数是函数体……等等，你还有一个虚析构函数。多态对象的析构是复杂的，特别是当它通过接口进行时。你可以拥有这样的代码：\n\
    \n```cpp\nclass drawable {\npublic:\n    virtual void draw();\n};\n\nclass paintable\
    \ : drawable {\npublic:\n    void draw();\n    paintable();\n    ~paintable();\n\
    };\n\nvoid deletedraw(drawable* drawable) {\n    delete drawable;\n}\n\nint main()\
    \ {\n    deletedraw(new drawable());\n}\n```\n\n在 `deletedraw` 内部发生了什么？记住，当使用\
    \ `delete` 时，析构函数会被调用，因此 `delete drawable;` 这一行执行了函数调用。但编译器如何知道 `paintable` 析构函数在哪里？编译器不知道\
    \ `drawable` 变量的精确类型，但它知道是一个 `drawable`，一个拥有 `draw()` 方法的东西。\n"
