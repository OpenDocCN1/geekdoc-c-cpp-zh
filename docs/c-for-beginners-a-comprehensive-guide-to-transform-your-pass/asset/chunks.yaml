    # C++


    另外两个前缀限制了类型可以存储的范围——`signed` 和 `unsigned`。有符号（signed）变量可以存储负值和正值，而无符号（unsigned）变量只能取正值。


    ## 其他前缀


    在 `C++` 中你可以使用一些其他前缀，但它们并不常见，其中大多数我们不会使用，也不会在本书中介绍。不过，有两个非常有用的前缀，虽然不是`constant`——即
    `const` 和 `static`。前者是常量，值永远改变；后者保持变量的值不变，但仅限于函数调用之间；这是稍后要讨论的话题。


    ## 语言的核心：理解 C++`


    如今计算机运行着我们周围几乎的一切事物；每台电脑、你喜爱的手机以及各个品牌设备的核心都是程序。在你的学习过程中，我假设你已经了解什么是程序及其背后的结构。所有程序的核心都是一种语言；那么问题就来了：`C++`
    究竟是什么？


    `C++`（读作 see plus plus）是一种非常强大的通用编程语言。该语言的独特之处在于，它在提供低级内存管理的同时，还集成了至关重要的面向对象编程和泛型编程。


    该语言及其设计偏向于系统编程，例如嵌入式系统和操作系统内核，这里仅举几例。


    由于其性能、灵活性和效率，该语言也是许多程序员的青睐。该语言在许多场景中都有有效用途，例如服务器（如网络搜索、`SQL` 和电子商务）、桌面应用程序、对性能要求极高的应用程序（如太空探测器）以及电话交换机，而且最重要的是娱乐软件，你最喜欢的视频游戏就属于此类。


    该语言可以被称为一种编译型语言，在全球范围内许多平台上都有实现，并被 `Intel`、`SF`、`Microsoft` 和 `LLVM` 等许多跨国公司使用，仅举如此。


    如果你搜索 `ISO`（国际标准组织），你会发现 `C++` 是标准化的。ISO 在 2011 年 9 月批准并发布了当前版本的 `C++`，版本为 `ISO/IEC
    14882:2011`，正式称为 `C++11`。`C++` 最初于 1998 年实现标准化，版本为 `ISO/IEC 14882:1998`，然后修订为
    `C++03`，接着在 2003 年再次更新为 `ISO/IEC 14882:2003`。上述信息虽然有用，但对你来说并不重要。


    有什么比当前的标准 `C++11` 更重要的呢？因为它通过集成新特性和更大的库，取代了所有其他标准。


    一切与计算机相关的事，事实上，世界上其他一切事物都有其起源。`C++` 是 Stjarstrup 在 1979 年左右在实验室的结晶。为了这个目的，创造了一种伟大的创新语言。他希望有一种像
    `C` 一样灵活且高效的语言，同时也一种提供更高层功能来组织程序的语言。


    这里有一个关键：记得我说过学习 `C++` 会为你学习其他语言做好准备吗？原因如下：`C++` 影响了许多语言，包括 `Java`、`C#` 以及 1988
    年之后的所有版本的 `C`。


    在结束本章之前，我也许应该提到，`C++` 正是你所需要的。


    ## 初次上手 C++


    虽然学习 `C++` 令人兴奋，但在你编写代码之前，你需要一个环境（编译器）来将你的代码翻译成机器语言。如果你没有安装编译器，可以下载许多免费的编译器。


    安装编译器是程序编程的核心部分，但安装过程中的某些方面需要你注意，特别是在 Windows 上。对你来说，最佳选择是寻找各种编译器，但许多开发者在安装上感到困扰，这本身就是问题所在。


