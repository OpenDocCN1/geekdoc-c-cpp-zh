    \ offset a, b;\n    double breadth a, b;\n};\n\n// main 函数\n\nint main() {\n \
    \   Rectangle rectangle1;\n    // 声明类型为 Rectangle 的 rectangle1\n    Rectangle\
    \ rectangle2;\n    // 声明类型为 Rectangle 的 rectangle2\n    Rectangle rectangle3;\n\
    \    // 声明类型为 Rectangle 的 rectangle3\n    double area = 0.0;\n    // 在此处存储矩形的面积\n\
    \n    // rectangle1 规格\n    rectangle1.setlength(6.0);\n    rectangle1.setbreadth(7.0);\n\
    \n    // rectangle2 规格\n    rectangle2.setlength(12.0);\n    rectangle2.setbreadth(13.0);\n\
    \n    // rectangle1 的面积\n    Area a = rectangle1.getarea();\n    cout << \"area\
    \ of rectangle1: \" << a << endl;\n\n    // rectangle2 的面积\n    Area a = rectangle2.getarea();\n\
    \    cout << \"area of rectangle2: \" << a << endl;\n\n    // 两个对象相加：rectangle3\
    \ = rectangle1 + rectangle2\n    // rectangle3 的面积\n    Area a = rectangle3.getarea();\n\
    \    cout << \"area of rectangle3: \" << a << endl;\n\n    return 0;\n}\n```\n\
    \n执行时，代码将返回以下内容：\n\n![Image00088.jpg](img/Image00088.jpeg)\n\n考虑从上述代码中提取的章节：\n\
    \n```cpp\nRectangle operator+(const Rectangle& br) {\n    Rectangle rect;\n  \
    \  rect.length = this->length + br.length;\n    rect.breadth = this->breadth +\
    \ br.breadth;\n    return rect;\n}\n```\n\n这就是实现 `operator+` 重载机制的地方。我们重载了 `+`\
    \ 运算符，使其能够相两个矩形对象的测量值。这里是从上述代码中提取的另一行：\n\n```cpp\nRectangle rectangle3 = rectangle1\
    \ + rectangle2;\n```\n\n在上述行中，`rectangle1` 将被加到 `rectangle2` 上。这意味着 `rectangle1`\
    \ 的 `length` 将加到 `rectangle2` 的 `length` 上以得到 `rectangle3` 的 `length`，同时 `rectangle1`\
    \ 的 `breadth` 将加到 `rectangle2` 的 `breadth` 上以得到 `rectangle3` 的 `breadth`。然后两者相乘得到\
    \ `rectangle3` 的面积。\n\n`+` 运算符的含义已经被重载了！\n\n## 第 6 章：宏与模板\n\n### 模板简介\n\n模板是 C++\
    \ 编程语言中的一项重要特性，因为它允许函数和类使用泛型类型。通过允许模板定义不同的数据类型而无需相互重写，它们在函数和类的工作中起着至关重要的作用。\n\n\
    使用模板，你可以编写适用于任何数据类型的通用代码。你只需要将数据类型作为参数传递。模板提高了代码的可用性并增加了程序的灵活性。你可以创建一个简单的类或函数，并将数据类型作为参数传递，以实现任何数据类型所需的代码；每当你需要使用该函数时，调用函数并指定返回类型。\n\
    \n例如，如果你使用 `sort()` 函数来对仓库中的数据进行排序，可以将不同的数据类型作为参数传递给函数。你不需要根据传递给排序算法的数据类型来编写和维护多个文件代码，你仓库中的数据将根据特定的数据类型分别进行排序。因此，模板用于需要代码在多个数据类型之间可重用的情况。\n\
    \n在处理多重继承和运算符重载时，模板具有非常重要的意义，如下所示。模板的类型\n\n模板通过两种方式实现：\n\n- 使用函数模板\n- 使用类模板\n\n\
    模板是一种宏，当你为类定义模板时，它在执行期间会将类型替换为适当的类。类模板用于创建一个其成员为参数的类。语法：\n\n```cpp\ntemplate <class\
    \ T>\nclass {\n// 成员\n};\n```\n\n示例：\n\n![Image00089.jpg](img/Image00089.jpeg)\n\
    \n类的模板定义是一个普通类，但它是一个用于将数据类型作为参数传递给模板定义的模板。类模板定义遵循格式：\n\n`classname<int> objectname(arglist)`\n\
    \n"
- fmt: "\nThe program above creates a class of type `tt`. The `tt(void rectangle<tt::setvalues(tt\
    \ num1, tt num2))` statement specifies that the function parameter is also a template\
    \ parameter and should always be included when calling the class.\n\n### Class\
    \ templates with multiple parameters\n\nYou can also have more than one generic\
    \ data type in a class. You can declare the generic type class with a comma-separated\
    \ list inside the template specification.\n\n#### Syntax\n```cpp\nTemplate<class\
    \ xy, class xyz, ...>\nClass class-name\n{\n//function body;\n};\n```\n\n####\
    \ Example: class with two generic types\n```cpp\nTemplate<class f1, class f2>\n\
    Class numbers\n{\n    f1 j;\n    f2 k;\npublic:\n    Numbers(f1 x, f2 y)\n   \
    \ {\n        j = x;\n        k = y;\n    }\n    void print()\n    {\n        cout\
    \ << j << k << \"\\n\";\n    }\n};\n\nint main()\n{\n    Numbers<float, int> numbers1(2.5,\
    \ 23);\n    Numbers<int, char> numbers2(5, 'z');\n    numbers1.print();\n    numbers2.print();\n\
    \    return 0;\n}\n```\n**Output:**\n2.523\n5z\n\nFunctions work like a normal\
    \ function but accommodate multiple data types with templates. This makes functions\
    \ more useful since you have to write a single program. Templates expand during\
    \ compile time. Like a class template, you can create a function template with\
    \ different arguments.\n\n#### Syntax\n```cpp\nTemplate<class type>\nReturn-type\
    \ name(arguments)\n{\n    Function body;\n};\n```\n\nWhen defining templates,\
    \ you must include the template type in the function body and parameter list when\
    \ necessary.\n\n#### Example1: function to swap values\n```cpp\nTemplate<class\
    \ t1>\nvoid swap(t1 &num1, t1 &num2)\n{\n    t1 val = num1;\n    num1 = num2;\n\
    \    num2 = val;\n};\n```\nCalling a template function works the same way as a\
    \ normal call.\n\n#### Example2: implementation of a function template\n```cpp\n\
    Template<class test>\nTest max(test x, test y)\n{\n    Test results;\n    results\
    \ = x > y ? x : y;\n    return results;\n};\n\nint main()\n{\n    int a = 5, b\
    \ = 6;\n    double l = 4, m = 6;\n    c = max<int>(a, b);\n    n = max<double>(l,\
    \ m);\n    cout << c << endl;\n    cout << n << endl;\n    return 0;\n}\n```\n\
    In this example, `test` is the template parameter. The function `max` is called\
    \ twice with different argument types (`int` and `double`). When the compiler\
    \ instantiates, it calls the function each time by type. The output object produced\
    \ after instantiation of the template with a specific type will be of the same\
    \ type with the parameters `x` and `y`.\n\nThe program above sorts values based\
    \ on which is higher. If using an array of `numbers`, the sorting algorithm will\
    \ be applied to sort the numbers from smallest to highest.\n\n### Function template\
    \ with multiple parameters\n![Image00090.jpg](images/Image0090.jpeg)\nJust like\
    \ a class template, you can have more than one generic data type separated by\
    \ commas.\n\n#### Example: template class with multiple parameters\n```cpp\nTemplate<class\
    \ temp1, class temp2>\nvoid display(temp1 j, temp2 k)\n{\n    cout << j << \"\
    \ \" << k << \"\\n\";\n}\n\nint main()\n{\n    J = display(2019, \"edge\");\n\
    \    K = display(18.5, 1854);\n    return 0;\n}\n```\n**Output:**\n2019 edge\n\
    18.5 1854\n\n#### Overloading templates\nYou can overload templates using the\
    \ same name with different template arguments. If there is no match found, an\
    \ error message is generated by the system.\n\n#### Example: overload template\n\
    ```cpp\nTemplate<class m>\nvoid display(m)\n{\n    cout << \"template: \" << m\
    \ << \"\\n\";\n}\n\nvoid display(int n)\n{\n    cout << \"template: \" << n <<\
    \ \"\\n\";\n}\n\nint main()\n{\n    display(0);\n    display(15.20);\n    return\
    \ 0;\n}\n```\n**Output:**\ntemplate: 0\ntemplate: 15.20\n\nWhen creating a class\
    \ template, a member function outside the class since the member function is parameterized\
    \ using a type argument, therefore, the template should define the member functions.\
    \ Member function templates are defined in three ways:\n1. Explicit definition\
    \ in a file scope for a return type used to instantiate the template.\n2. During\
    \ the file scope with the template parameters.\n3. Inside the class.\n\nA member\
    \ function template instantiates a function not explicitly generated. If a class\
    \ has both a member function and an explicit function, then the explicit definition\
    \ is given more priority.\n\n#### Syntax\n![Image00091.jpg](images/Image0091.jpeg)\n\
    Example: class vector with a member function template\n![Image00092.jpg](images/Image0092.jpeg)\n\
    \n### Non-type template arguments\nTemplates can have a single or multiple type\
    \ arguments. You can also use a non-type argument template in addition to the\
    \ type argument. You can create a template argument using strings, constants,\
    \ built-in types, and function names.\n![Image00093.jpg](images/Image0093.jpeg)\n\
    \nThe above template passes the size of an array as an argument. The compiler\
    \ will only know the size of the array during the execution time. The arguments\
    \ area is specified during the creation of the template class.\n"
