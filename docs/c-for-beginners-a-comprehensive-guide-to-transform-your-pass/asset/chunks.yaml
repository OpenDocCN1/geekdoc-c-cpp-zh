    john doe\"];`\n\n如果该值不存在，`map` 将插入一个空元素。\n\n### 盘点\n\n我只触及了 STL 的基础知识，但现在你已经有足够的信息来使用库中的一些基础类型了。`vector`\
    \ 类可以完全替代数组，如果你不想花时间进行插入和修改，`vector` 也可以替代列表。有了 `vector` 类型在手，有几个原因你可能想使用数组，但大多数原因是高级的，例如当你处理文件\
    \ I/O 时（我们将在本指南的最后讨论这一点）。\n\n最实用的数据类型是 `map`。使用 `map` 可以轻松地编写复杂的程序，而无需过度担心数据结构的创建。相反，你可以将注意力集中在某些方式解决解决上，`map`\
    \ 可以替代基础二叉树。大多数情况下，除非是为了特定的性能需求，或者你明确需要树形结构，否则你不需要深入二叉树的实现。\n\n这就是 STL 真正的力量所在：在\
    \ 80% 的时间内，它为你提供了所需的内核结构，让你能够自由编写解决问题的代码。在剩下的时间内，你需要相关知识来构建和实现自己的数据结构。\n\n有些程序员更倾向于使用自己的代码而不是现成的代码。大多数情况下，你不应该使用自己的数据结构；内置的结构更快、更好且更完整。然而，了解如何构建它们确实能让你对使用它们有更深刻的见解。\n\
    \n那么，什么时候可能想使用自己的结构呢？假设你想要一个计算器，允许用户输入算术表达式，然后按照正确的运算符顺序评估输入值。一个例子是 `4*9+8/3`，其评估方式是在加法之前执行除法和乘法。\n\
    \n这种结构可以很容易用二叉树的形式考虑。你可以这样表示 `4*9+8/3`：\n\n```\n+\n/\n4*83\n```\n\n每个节点通过两种方式之一进行评估：\n\
    \n- 如果节点是数字，则返回该值\n- 如果节点是运算符，则计算两个子树的值并执行操作。\n\n要构建这样一树，你需要原始数据结构；你不能只使用 `map`。如果你只有\
    \ STL，你会为此感到困难。然而，一旦你理解了递归和二叉树，它就会变得简单得多。\n\n## 第 9 章：STL\n\nSTL/cpp 标准库：容器、算法、迭代器\n\
    \n一个常见的误解是将 C++ 标准库称为 STL。作为模板的标准库 (STL) 是在较早之前开发的。现在的 C++ 标准库是一组模板，虽然有些已经被弃用，但某些仍然有用。\n\
    \n容器允许你管理一组数据。容器包括 `vector`、`list` 等。为了处理相同类型的数据，你需要使用 `vector` 模板：\n\n```\nvector<int>\
    \ grades;\n```\n\n现在你可以访问有关 `vector` 的所有内容，如：\n\n```cpp\nvector<int> grades;\n\
    ```\n\n向 `vector` 添加值非常简单。你可以通过这样做将值推入 vector：\n\n```cpp\ngrades.push_back(55);\n\
    ```\n\n如果你想向 `vector` 中插入特定的值该呢？你可以使用标准库的 `insert()` 函数。该函数接受两个参数：索引和值，如下：\n\n\
    ```cpp\nvector<int> grades;\n```\n\n如果你想一次插入多个值，可以使用初始化列表：\n\n```cpp\nint[] mmp\
    \ = {96, 64, 75, 83};\ngrades.insert(grades.end(), mmp, mmp + 4);\n```\n\n要遍历列表中的每一项，在其他语言中你使用\
    \ `for` 循环。在 C++ 中我们如下操作：\n\n```cpp\nfor (int bia : grades) {\n    cout << bia\
    \ << \"\\n\";\n}\n```\n\n如果我们使用的不是原始数据类型而是对象呢？这里有几个原因：\n\n```cpp\nclass Student\
    \ {\n    // ...\n};\nvector<Student> grades;\n```\n\n"
- fmt: "\n# Strings and Vectors\n\nIf we have a vector of strings, for example, a\
    \ vector called `ja` containing data we want to print, and we want to print the\
    \ length of every string in it:\n\n```cpp\nfor (string i : ja) {\n    cout <<\
    \ i << \" \";\n    cout << i.length() << \" \";\n    cout << \"\\n\";\n}\n```\n\
    \nYou create any `object` that you `create`, but we'll talk more explicitly about\
    \ that when we actually start creating objects in the next chapter.\n\nAnother\
    \ type of container is `lists`, functions very similarly to `vectors`. The specific\
    \ differences between the two areas may be beyond the grasp of a relative beginner.\
    \ Still, the general rule concerning the two types of containers is that a `vector`\
    \ is generally the one that should be used unless you have to continually add\
    \ or erase elements from anywhere other than the end of the container.\n\nThere's\
    \ another type of container called an `associative container`, which can be formatted\
    \ with a key and value and a mapped value. It's generally ordered according to\
    \ the keys. The most prominent type of associative container is called a `map`.\
    \ This is great when you need to associate a set of data with a certain trait.\
    \ For a real-world example, a inventory system could be kept with a `map` of codes\
    \ (integers-the key) and item names (strings-the mapped data).\n\nFor this, you'd\
    \ import `<map>`, and declare a `map`:\n\n```cpp\nMap<int, string> inventory;\n\
    inventory[00400030] = \"tamagotchi, blue\";\ninventory[00400031] = \"tamagotchi,\
    \ white\";\ninventory[00324359] = \"twilight, dvd\";\ninventory[44539294] = \"\
    dark souls, xbox 360\";\n```\n\nIf you want to recall a specific element later\
    \ in your code, you could do something along the lines of:\n\n```cpp\ncout <<\
    \ \"inventory[00400030]: \" << inventory[00400030] << \"\\n\";\n```\n\nCalling\
    \ `inventory[00400030]` would print the mapped value, here being \"tamagotchi,\
    \ blue\".\n\nThere's another type of associative container called a `set`. Sets\
    \ function very similarly to maps, except that they don't allow duplicates. Maps\
    \ allow duplicate values, but not duplicate keys.\n\nAlso included in the area\
    \ a library called `algorithms`. This library can be used to search, sort, and\
    \ manipulate element ranges. Included in the area functions such as `equal()`,\
    \ which determines if two sets of elements equal each other. There is also a `transform()`,\
    \ which applies a given function to a given range.\n\n## Conclusion\n\nWe’ve come\
    \ to the end of this book, but this is just the start of a long and fruitful journey\
    \ for you life of programming. With the basics of C++ under your belt, it's time\
    \ to start your learning. Start writing those programs! Start implementing data\
    \ structures and algorithms.\n\nIf you enjoy getting started with C++, there is\
    \ so much more to learn and do with this wonderful language. Be sure to continue\
    \ your journey with the second book in the series, which looks at slightly more\
    \ complex topics while still being beginner-friendly.\n\nC++ programming language\
    \ is a competitive general-purpose platform which borrows some features of an\
    \ imperative programming paradigm and can run many platforms. It is referred as\
    \ a imperative programming language because it uses step-by-step processes to\
    \ achieve ba goals. The language uses the concept of object design to implement\
    \ complex programs. The next step is to start writing some programs in C++.\n\n\
    If you are a beginner, the goal is to start writing some programs in C++ and see\
    \ the results you get working with this language.\n"
