    # ## Compile-Time Name and Type Checking


    LINQ queries are fully name and type-checked at compile-time, reducing (or eliminating)
    runtime error surprises. Many domain languages like T-SQL embed the query text
    within string literals. These strings are ignored by the compiler for checking,
    and errors are often only found at runtime (hopefully during testing). Many type
    errors and mistyped field names will now be found by the compiler and fixed at
    that time.


    # ## Easier to Read Code


    The examples shown in this chapter show how code to carry out common tasks with
    data is simplified, even if unfamiliar with LINQ syntax at the moment. The removal
    of complex looping, sorting, grouping, and conditional code down to a single query
    statement means fewer logic errors and simpler debugging


    It is possible to misuse any programming language construct. LINQ queries offer
    far greater ability to write human- (and compiler-)hensible code when working
    with structured data sources if that is the author''s intention.


    # ## Over Fifty Standard Query Operators


    The built-in set of Standard Query Operators make easy work of grouping


    Table 1-1 Standard Query Operators in the .NET Framework 4 Release


    | Operator | Standard Query Operator Name |

    | --- | --- |

    | Aggregation | Aggregate, Average, Count, LongCount, Max, Min, Sum |

    | Conversion | AsEnumerable, Cast, OfType, ToArray, ToDictionary, ToList, ToLookup
    |

    | Element | DefaultEmpty, ElementAt, ElementAtOrDefault, First, FirstOrDefault,
    Last, LastOrDefault, Single, SingleOrDefault |'
