  md: "# CHAPTER 4 GROUPING AND JOINING DATA\n\nHow join/into Works The join/into\
    \ keyword combination in query expression syntax maps to the GroupJoin standard\
    \ query operator. GroupJoin operator returns a sequence of inner elements with\
    \ a matching key value for every outer element in a sequence. Unlike the pure\
    \ join syntax, every outer-sequence element has a represented group sequence,\
    \ but those without matching inner-sequence elements will have an empty group.\
    \ The GroupJoin extension method signature takes the following:\n\n```\npublic\
    \ static IEnumerable<TResult>\n    GroupJoin<TOuter, TInner, TKey, TResult(\n\
    \    IEnumerable<TOuter> outer,\n    IEnumerable<TInner> inner,\n    Func<TOuter,\
    \ TKey> outerKeySelector,\n    Func<TInner, TKey> innerKeySelector,\n    Func<TOuter,\
    \ IEnumerable<TInner>, TResult> resultSelector,\n    EqualityComparer<TKey> comparer\
    \ // optional\n```\n\nThe pseudo-code for this operator is similar to the Join\
    \ operator, except the groupings, rather than the individual elements in each\
    \ group, are returned. The pseudo-code for GroupJoin is\n\n+   1. Create a grouping\
    \ on the inner sequence for all elements that share the same inner-key selector\
    \ function value (as determined by the innerKeySelector argument). Call this list\
    \ lookup.\n2. Iterate the outer sequence. Call each current element item.\na.\
    \ Create a grouping from the lookup sequence for all elements that share the same\
    \ outer-key selector function result each item returns (as determined by the outerKeySelector\
    \ argument, and the comparator equality comparer if specified).\nb. Yield the\
    \ result by passing each item and the grouping to the resultSelector argument.\n\
    \nThe returned sequence will be in the order of the outer-sequence elements, although\
    \ it can be changed by any combination of order as required. The order of the\
    \ elements in each group will be the same as the inner sequence, and if you want\
    \ to change the order of the inner-sequence elements, consider using a subquery\
    \ in the selection projection with specific order by clauses instead of the Groupjoin\
    \ syntax.\n\nThe key selection expression for the outer and inner sequence can\
    \ be any expression that evaluates to a comparable type. The equals operator (what\
    \ is called when you do an == evaluation) will determine if the keys are"
