  md: "# HOW TO FILTER THE RESULTS (WHERE CLAUSE)\n\nThe C# compiler behind the scenes\
    \ converts the lambda expression into a standard anonymous method call (the following\
    \ code is functionally equivalent):\n\n```\nvar q = animals.Where(\n  delegate(string\
    \ a) {\n    return a.StartsWith(\"S\") && a.Length > 5; });\n```\n\nWhat Is Deferred\
    \ Execution?\nThe Where clause will only begin testing the predicate when somebody\
    \ (you through a foreach statement or one of the other standard query operators\
    \ that have an internal foreach statement) tries to iterate through the results;\
    \ until then, the iterator framework remembers exactly where it was the last time\
    \ it was asked for an element. This is called deferred execution, and it allows\
    \ you some predictability and control over when and how a query is executed. If\
    \ you want results immediately you can call List(), ToArray() or one of the other\
    \ standard operators that cause immediate realization of the results to another\
    \ format; otherwise, the query will begin evaluation only when you begin iterating\
    \ over it.\n\n# Where Filter Query Expressions (Preferred)\n\nThe query expression\
    \ where clause syntax drops the explicit range variable definition and the lambda\
    \ expression operator (=>), making it more concise and more familiar to the SQL-style\
    \ clauses that many developers understand. It is the preferred syntax for these\
    \ reasons. Rewriting the previous example using query expression syntax demonstrates\
    \ these differences, as follows:\n\n```\nstring[] animals = new string[] { \"\
    Koala\", \"Kangaroo\",\n\"Spider\", \"Wombat\", \"Snake\", \"Emu\", \"Shark\"\
    ,\n\"Sting-Ray\", \"Jellyfish\" };\n```\n\n```\nvar q = from animals\n  a.StartsWith(\"\
    S\") && a.Length > 5\n  select a;\n```\n\n```\nforeach (string s in q)\n  Console.WriteLine(s);\n\
    ```"
