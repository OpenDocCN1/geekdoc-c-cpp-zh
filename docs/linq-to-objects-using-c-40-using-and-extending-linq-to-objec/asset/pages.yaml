    \ Extension for this.)\n\nHow Join Works The query expression (like all the query\
    \ expression keywords) map to the extension method appropriately named Join. This\
    \ extension method takes two sequences (one as an extension method source outer,\
    \ the other as an ordinary argument inner), two key selection functions (one for\
