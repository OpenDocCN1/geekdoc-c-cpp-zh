- pgno: 261
  md: '# Named Arguments


    Traditionally, the position of the arguments passed to a method call identified
    which parameter that value matched. It is possible in C# 4.0 to specify arguments
    by name, in addition to position. This is helpful when many parameters are optional
    and you need to target a specific parameter without having to specify all preceding
    parameters.


    Methods can be called with any combination of positionally specified and named
    arguments, as long as the following rules are observed:


    +   - If you are going to use a combination of positional and named arguments,
    the positional arguments must be passed first. (They cannot come after named arguments.)

    - All non-optional parameters must be specified somewhere in the invocation, either
    by name or position.

    - If an argument is specified by position, it then cannot be specified by name
    as well.


    To understand the basic syntax, the following example creates System.Drawing.Point
    by using named arguments. It should be noted that there is no constructor for
    this type that takes the y-size, x-size by position—this reversal is solely because
    of named arguments.


    ```

    // reversing the order of arguments.

    Point p1 = new Point(y: 100, x: 10);

    ```


    The following method invocations will not compile:


    ```

    //Named argument specifies ''x'' a parameter for which a// positional argument
    has already been given"

    Point p3 = new Point(10, x: 10);

    ```


    ```

    //Named argument specifications must appear after all

    // fixed arguments have been specified

    Point p4 = new Point(y: 100, x: 10);

    ```


    ```

    // The best overload for ''.ctor'' does not have a

    // parameter named ''x''

    Point p5 = new Point(x: 10);

    ```'
