    ```

    int[] nums = new int[] { 0,4,2,6,3,8,3,1 };

    ```


    ```

    var result1 = nums.Where(n => n < 5).OrderBy(n => n);

    ```


    ```

    // or with line-breaks added for clarity

    var result2 = nums

    .Where(n => n < 5)

    .OrderBy(n => n);

    ```


    +   **Query Expression format** (preferred, especially for joins and groups)—Although
    not all standard query operators are supported by the query expression syntax,
    the benefit to the clarity of code when they are is very high. The query expression
    syntax is much gentler than the extension method syntax in that simplifies the
    syntax by removing lambda expressions and by introducing a familiar SQL-like representation.


    ```

    int[] nums = new int[] { 0,4,2,6,3,8,3,1 };

    ```


    ```

    var result = from n in nums

    where n < 5

    orderby n

    select n;

    ```


    +   **Query Dot syntax** (a combination of the two formats)—This combines a query
    expression syntax query surrounded by parentheses, followed by more operators
    using the Dot Notation syntax. As long as the query expression returns an IEnumerable<T>,
    it can be followed by an extension method.


    ```

    int[] nums = new int[] { 0,4,2,6,3,8,3,1 };

    ```


    ```

    var result = (from n in nums

    where n < 5

    orderby n

    select n).Distinct();

    ```


    **WHICH QUERY SYNTAX TO USE?** Personal preference will dictate this, the goal
    is to use the syntax that is easiest to read and will help developers who come
    after you to understand your intentions. With this in mind, dont unnecessarily
    mix the syntax styles in one query; mixing the styles makes the query harder to
    read by forcing the reader to count brackets and determine'
