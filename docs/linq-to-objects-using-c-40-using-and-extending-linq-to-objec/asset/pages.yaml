  md: "To demonstrate the ToLookup operator, the example shown in Listing 5-\n13 builds\
    \ a look-up list of all calls made from or to the same phone num-\nbr(calls_lookup).\
    \ The look-up groupings are then used in a second query\nto project a sequence\
    \ of calls against each contact. The resulting Console\noutput (shortened to the\
    \ first three records) is shown in Output 5-5.\n\n# Listing 5-13 Sample usage\
    \ of the ToLookup operator to achieve a one-to-many outer\njoin--see Output 5-5\n\
    \n```\nvar contacts = Contact.SampleData();\nvar calls = CallLog.SampleData();\n\
    \n// build a lookup list for the inner sequence\nvar calls_lookup =\n  (from c\
    \ in calls\n  orderby c.When descending\n  select c\n  .ToLookup(c => c.Number));\n\
    \n// one to many join on the phone number\nvar q3 = from c in contacts\n  orderby\
    \ c.LastName\n  select new\n  {\n    LastName = c.LastName,\n    Calls = calls_lookup[c.Phone]\n\
    \  });\n```\n\n```\nforeach (var contact in q3)\n{\n  Console.WriteLine(\"Last\
    \ name: {0}\", contact.LastName);\n  foreach (var call in contact.Calls)\n   \
    \ Console.WriteLine(\"- {0} call on {1} for {2}min.\",\n      call.Incoming ?\
    \ \"Incoming\" : \"Outgoing\",\n      call.When,\n      call.Duration);\n}\n```"
