    The Any operator is the most efficient way to test if any elements are in a sequence,
    and although the following code is equivalent, it is highly discouraged because
    it potentially requires iterating the entire sequence if the source does not implement
    IEnumerable<T>, which has a Count property. This source is only shown here to
    explain the basic logic of Any:


    ```

    bool b = one.Count() > 0;

    ```


    The second overload of Any that takes a predicate function is equally easy to
    use. It takes a predicate function and returns the Boolean result of true if any
    element in the sequence passes (returns true). The example shown in Listing 5-31,
