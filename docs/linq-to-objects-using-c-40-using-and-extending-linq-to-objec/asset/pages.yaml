    # Cast Operator


    The Cast operator yields all elements in a nongeneric IEnumerable collection as
    a given type. This is mainly to cater to the .NET 1.0 style of collections, which
    pre-date the generic type features of .NET Framework 2.0, such as the ArrayList
    collection, which holds references as object types. If the type of the elements
    cannot be cast to the new type, a System.InvalidCastException is thrown.


    ```

    // Casts an IEnumerable collection into an

    // IEnumerable<T> cannot be cast to the new type an

    // InvalidCastException is thrown.

    public static IEnumerable<TResult> Cast<TResult>(n    this IEnumerable source);

    ```


    To demonstrate using the Cast<T> operator, the following code initializes a nongeneric
    ArrayList collection (introduced in .NET Framework 1.0). This collection only
    has access to a few operators (cast, typeof), and gain access to all the LINQ
    standard query operators, which need to use the Cast operator as shown in Figure
    5-6.


    **Listing 5-6** Example LINQ query over the .NET 1.0 ArrayList type, which doesn''t
    implement IEnumerable<T>


    ```

    ArrayList list = new ArrayList();

    list.Add(1);

    list.Add(2);

    list.Add(3);

    ```'
