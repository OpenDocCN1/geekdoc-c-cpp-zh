    | Operator Type | Standard Query Operator Name |

    |---|---|n| Equality | SequenceEqual |

    | Generation | Empty, Range, Repeat |

    | Grouping | GroupBy, ToLookup |

    | Joining | GroupJoin, Join |

    | Merging | Zip |

