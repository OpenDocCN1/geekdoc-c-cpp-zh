- pgno: 45
  md: '# CHAPTER 2 INTRODUCING LINQ TO OBJECTS


    To use Implicitly Typed Local Variables, the declaration must follow these rules:


    +   1. No user defined local type called var can exist; otherwise, type is used.

    2. The variable declaration must have an initialization expression (that is, an
    equal sign followed by an expression, which can be a constant).

    3. The initialization expression (the expression to the right side of the equal
    sign), must have a compile-time type.

    4. The declaration cannot include multiple declarations (for example, var x =
    10, y = 42).

    5. The variable cannot refer to itself.


    Although the usefulness of declaring a variable in this way seems minor, it is
    a necessary feature for some types that have no legal way of being declared (Anonymous
    Types, for instance).


    # Anonymous Types


    Anonymous types are compile-time generated types whose properties are inherited
    from the object initialization expression at compile-time. These types can then
    be used locally within a method as temporary storage classes, avoiding having
    to build a specific data class for any and every set of properties. The new class
    inherits directly from System.Object and has no name (one that can be referenced
    from code anyway). What run-time type do you assign anonymous types? They have
    to be declared using the implicitly typed local variable construct (var) mentioned
    earlier.


    An anonymous type is defined by omitting the type name after a new statement and
    providing a valid Object Initializer expression that contains one or more assignments.
    List 2-5 demonstrates how to create an anonymous type and how it can be used in
    subsequent code, the output of which is shown in Output 2-2.


    # Listing 2-5 Declaring and using anonymous types—see Output 2-2


    ```

    // simple anonymous type declaration

    Console.WriteLine("- Simple Anonymous Type -");

    var item = new { Name = "Car", Price = 9989.00 };

    ```


    ```

    Console.WriteLine("Type: {0}, Name: {1}, Price: {2}",

    item.GetType().ToString(), item.Name, item.Price);

    ```'
