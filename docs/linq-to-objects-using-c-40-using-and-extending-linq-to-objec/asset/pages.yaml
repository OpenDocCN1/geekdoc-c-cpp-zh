  md: "# WRITING PARALLEL LINQ OPERATORS 291\n\nNOTE This isn't a statistics guide;\
    \ I'm using the sample variance and standard deviation formula [the difference\
    \ being the division of n or (n-1)]. I chose the sample variance because I get\
    \ to demonstrate how to handle more error conditions later. If you use this code,\
    \ check whether your situation needs the population equations or the sample equations\
    \ for variance and standard deviation – Wikipedia has pages of discussion on this\
    \ topic!\n\nFocusing on building the Variance operator first allows most of the\
    \ mathematics to be isolated to a single function (standard deviation is simply\
    \ the square-root of this value). This strategy simplifies the standardDeviation\
    \ operator to a Math.Sqrt() function on the result of the Variance function.\n\
    The most basic sequential Variance operator function to start with, built using\
    \ the aggregate standard query operator, is shown in Listing 9-8.\n\n# Listing\
    \ 9-8 Simple sequential variance calculation\n\n```\n// sequential variance calculation\n\
    public static double Variancel(\n    this IEnumerable<int> source)\n{\n    //\
    \ traditional aggregate\n    double mean = source.Average();\n\n    return source.Aggregate(\n\
    \        (double)0.0,\n        (subtotal, item) =>\n            subtotal + Math.Pow(item\
    \ - mean, 2),\n        (totalSum) => totalSum / (source.Count() - 1)\n    );\n\
    n\n```\n\nAfter the operator shown in Listing 9-8 through unit tests to ensure\
    \ proper mathematical results, optimizing performance can begin. A simple execution\
    \ time profile of the code was undertaken by measuring the time taken to calculate\
    \ the variance on a data set of 100,000 elements, 1,000 times. The results of\
    \ this can be seen in Table 9-2. I also tested the data source being an indexed\
    \ array and an IEnumerable<T> to isolate if there were any performance issues\
    \ with both types of input"
