    # How to Join with Data in Another Sequence


    The basis of any Relational Database Management System (DBMS) is the ability to
    draw together data from multiple sources (tables generally) as the result of a
    query; this is called “Joining” data. In relational databases, the joins are most
    often between primary key and foreign key-related columns, but a join can be achieved
    on any data as long as both data sources share a common column value. One fundamental
    reason for'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'splitting data into multiple sources is to avoid duplicating data—this

    process is called normalization by database developers.


    Although the concept of joining-in-memory collections isn''t a common

    pattern today (it''s more likely that you nest a collection inside another object

    to indicate a parent-child relationship). LINQ to Objects introduces the

    concept of joining multiple data sources through its powerful Join and

    GroupJoin operators and their equivalent query expression syntax options.

    LINQ also enables join-clause by using a subquery expression

    within the Select clause. This subquery of coding is often simpler to

    read and helps you avoid having to use any specific Join syntax in the query

    at all. Both techniques are covered in the examples throughout this chapter.


    There are three basic styles of Joins that are commonly used when

    drawing data from multiple sources based on a shared key value:


    +   ** Cross Join—Every element in the first sequence (the outer) is pro-

    jected with every element in the second sequence (the inner), often

    called the Cartesian Product. An example for this type of join is

    when you want to systematically access each pixel in a bitmap by you

    ax and y locations


    +   ** One-to-One Inner Join—This type of join allows you to access

    data in both sequences based on a common column value. The

    resulting sequence is flat (there is no subgroup). An example use for

    type of join is when you want to access data from another

    sequence to extend the data you have on some element. -


    +   ** One-to-Many Join—This type of join allows you to use the first

    sequence record as a key for a subgroup sequence where a given

    column value is used as the referential key. An example of this type

    of join is having a list of orders for a set of given customers.


    There are numerous ways in LINQ to achieve each of these join types.

    Each technique and its relative merit is discussed next.


