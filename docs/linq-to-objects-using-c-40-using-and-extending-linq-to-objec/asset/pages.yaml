  md: "# Skip and Take Operators\n\nSkip and Take do as their names suggest; Skip\
    \ jumps over the number of elements in a sequence (or skips the entire sequence\
    \ if the count of elements is less than the number to skip), and Take returns\
    \ the given number of elements (or as many elements as possible until the end\
    \ of the sequence is reached).\n\nThe method signatures available for the Skip\
    \ and Take operators are:\n\n```\n// skips the number of elements specified from\
    \ the\n// start of a sequence, then returns each element\npublic static IEnumerable<TSource>\
    \ Skip<TSource>(\n    this IEnumerable<TSource> source,\n    int count);\n```\n\
    \n```\n// Returns the number of elements specified from the\n// start of a sequence,\
    \ then skips the remaining\npublic static IEnumerable<TSource> Take<TSource>(\n\
    \    this IEnumerable<TSource> source,\n    int count);\n```\n\nAlthough the operators\
    \ are independent, they are often combined to achieve paging a result sequence.\
    \ The pattern generally used for paging is shown in Listing 5-25, which demonstrates\
    \ retrieving elements 21 to 30 (the third page), where each page is ten records\
    \ long (normally the page number is passed in as a variable). The Console output\
    \ from this example is shown in Output 5-14.\n\nListing 5-25 The Skip and Take\
    \ operator combine to return paged segments of a sequence—see 5-14\n\n```\nint[]\
    \ nums = Enumerable.Range(1, 50).ToArray();\n```\n\n```\nint page = 3;\nint pageSize\
    \ = 10;\n```\n\n```\nvar q = \n    Skip((page-1) * pageSize)\n    Take(pageSize);\n\
    ```\n\n```\nforeach (var i in q)\n    Console.Write(i + \" \" \");\n```"
