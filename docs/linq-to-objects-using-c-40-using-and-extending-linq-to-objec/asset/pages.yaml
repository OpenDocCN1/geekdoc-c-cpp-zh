    \ Order Number: Order 4\nCustomer: Zeeman Order Number: Order 5\n\nSimulating\
    \ Outer Joins—Getting Unmatched Elements Outer joins differ from inner joins in\
    \ the way they handle missing and unmatched values. An outer join will return\
    \ a result for outer elements that have no matching inner elements, whereas these\
    \ elements would be skipped when using an inner join (as demonstrated in Listing\
    \ 4-12).\n\nTo carry out an outer-join style query in LINQ to Objects, the DefaultEmpty\
    \ query operator is used in the clause of a join, and the null value generated\
    \ by this operator handled in the projection. Although this sounds difficult,\
    \ Listing 4-13 demonstrates an outer join using the sample data shown in Table\
    \ 4-2, which generates the Console output shown in Output 4-10. This query is\
    \ a little ambiguous at first glance, but in essence it injects a null (the default\
    \ value for an instance of Order type) for any Customer element that would have\
    \ been removed by the inner join. This propagates a null value for order that\
    \ any subsequent code working with that result property can process. In this example\
    \ the ternary operator in the Console.WriteLine statement is catching and handling\
    \ the null values by replacing those with the string \"*(no orders)*\"\n\nListing\
    \ 4-13 Structuring the query for an outer join where all outer-sequence records\
    \ are returned, though they have no orders—see Output 4-10\n\n```\nvar customers\
    \ = Customer.SampleData();\nvar orders = Order.SampleData();\n\nvar q = from c\
