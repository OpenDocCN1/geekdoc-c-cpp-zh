  md: "# Implicitly Typed Local Variables\n\nWhen a local variable is defined with\
    \ the keyword var instead of a concrete type, the declared type of the new variable\
    \ is inferred from the initialization expression. This removes the need to duplicate\
    \ the type name when it can be inferred by the initial value assignment or initialization\
    \ expression. Variables initialized using the var keyword are strongly-typed;\
    \ the variable is simply assigned a compile-time type of the initialization value\
    \ expression. Listing 2-4 demonstrates the use of implicit typing of local variables.\n\
    \n**Listing 2-4** Local variable declaration, implicitly typed examples\n\n```\n\
    // implicitly typed local variable declarations\nvar anInt = 1;\nvar aString =\
    \ \"Testing\";nvar listContact = new List<Contact>();\nvar intArray = new int[]\
    \ { 0, 1, 2, 3, 4 };\n\n// the above are identical to the following declarations\n\
    int anIntOld = 1;\nstring aStringOld = \"Testing\";nList<Contact> listContactOld\
    \ = new List<Contact>();\nint[] intArrayOld = new int[] { 0, 1, 2, 3, 4 };\n\n\
    // list is defined as type: List<Contact>\n// it shows how object and collection\n\
    // initialization work with the var style init.\nvar list = new List<Contact>\
    \ {\n    new Contact {\n        LastName = \"Magnennis\",\n        DateOfBirth\
    \ = new DateTime(1973,12,09)\n    },\n    new Contact {\n        LastName = \"\
    Doherty\",\n        DateOfBirth = new DateTime(1978,1,05)\n    }\n};\n```"
