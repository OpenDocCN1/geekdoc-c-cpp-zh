    A cross join can also be used to achieve a one-to-one join by creating every permutation
    between two collections then filtering all those elements that share a key value;
    although as you will see, this is generally the worst performing technique for
    this purpose in LINQ to Objects.


    # One-to-One Joins


    A one-to-one join allows data from two different sequences related to other by
    a common key value to be accessible in the select projection of a query. One-to-one
    joins are very commonplace in relational database systems, where the central theme
    is separating data into multiple tables related by parent and child key relationships.
    This process is called normalization. Although LINQ to Objects supports most of
    the common join types available in a relational database, it is not always the
    most efficient way to work with large volumes of data.


    > NOTE A relational database will out-perform LINQ to Objects in cases where data
    volume is large. The join features across object collections should be used for
    local fine-tuning of data retrieved from a database, not in place of data-base
    engine.


    There are a number of ways to achieve one-to-one joins using LINQ, which include


    +   * Using the join (or Join) operator

    * Using a subquery in the select projection

    * Using the SingleOrDefault operator in the select projection

    * Using a cross join with a where filter


    Each technique for one-to-one joining is covered in detail in this section, including
    the relative performance of each (summarized in Table 4-1 and described in detail
    later in this chapter in the “One-to-One Join Performance Comparisons” section).'
