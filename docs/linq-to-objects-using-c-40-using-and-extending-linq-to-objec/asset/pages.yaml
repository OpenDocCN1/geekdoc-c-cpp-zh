- pgno: 320
  md: "# WRITING PARALLEL LINQ OPERATORS 299\n\ntwo conditions we want to isolate\
    \ with a single conditional check. That final Selector function looks like this:\n\
    \n```\nresult => result[0] > 1 ?\n(result[2] - (result[1] * (result[1] / result[0])))\n\
    / (result[0] - 1) : 0.0\n```\n\nThis code is functionally equivalent to the following\
    \ if conditional statement:\n\n```\nif (result[0] > 1) {\n v =\n (result[2] -\
    \ (result[1] * (result[1] / result[0])))\n/ (result[0] - 1))\n} else {\n v = 0.0;\n\
    }\n```\n\nreturn v;\n\nListing 9-13 shows the final StandardDeviation and Variance\
    \ operators, including the accepted error handling code. The changes are minor\
    \ (indicated in bold); an additional check for a null source and the final Selector\
    \ function having logic to handle no source elements.\n\nListing 9-13 Final parallel\
    \ StandardDeviation and Variance operators including error handling code\n\n```\n\
    // parallel Variance aggregate extension method\n// based on the optimized sequential\
    \ algorithm\npublic static double Variance(\n  this ParallelQuery<int> source)\n\
    {\n```\n\n+   * based upon the blog posting by Igor Ostrovsky at -\n* http://blogs.msdn.com/pfteam/archive/2008/06/05/8576194.aspx\n\
    * which demonstrates how to use the factory functions in an\n* Aggregate function\
    \ for efficiency.\n*\n\n```\n// check for invalid source conditions\nif (source\
    \ == null) {\n  throw new ArgumentNullException(\"source\");\n```"
