- pgno: 161
  md: "# ToList Operator\n\nThe ToList operator returns a System.Collections.Generic.List<T>\
    \ of a given type from any IEnumerable<T> sequence. The most common reason to\
    \ use this operator is to force the immediate execution of a query in order to\
    \ capture the resulting data as a snapshot, enumerating over all elements.\n\n\
    ToList has a single overload with the following method signature:\n\n```\n// Returns\
    \ a System.Collections.Generic.List<T>\n// from a System.Collections.Generic.IEnumerable<T>\n\
    public static List<TSource> ToList<TSource(\n    IEnumerable<TSource> source);\n\
    ```\n\nTo demonstrate the ToList operator, Listing 5-12 executes a query over\
    \ an IEnumerable<T> sequence and then uses the ForEach method to write the results\
    \ in a List<T> and the results to the Console window.\n\n# Listing 5-12 The ToList\
    \ operator enumerates an IEnumerable<T> sequence and returns the results in a\
    \ List<T>\n\n```\nIEnumerable<int> data = Enumerable.Range(1, 5);\n```\n\n```\n\
    // Query and capture results in List<int>\nList<int> q = (from i in data\n   \
    \ where i < 3\n    select i).ToList();\n```\n\n```\n// ForEach is a method on\
    \ List<T>\nq.ForEach(j => Console.WriteLine(j));\n```\n\n# ToLookup Operator\n\
    \nThe ToLookup operator was first covered in Chapter 4, \"Grouping and Joining\
    \ Data,\" and it was used to facilitate very efficient one-to-many joins between\
    \ two sequences. ToLookup creates subsequences based on elements that share a\
    \ common key value. ToLookup is similar in size and behavior to ToDictionary,\
    \ the difference being how they handle duplicate elements with the same key value.\
    \ ToLookup allows multiple elements for a given key value, whereas ToDictionary\
    \ throws an exception if this ever occurs."
