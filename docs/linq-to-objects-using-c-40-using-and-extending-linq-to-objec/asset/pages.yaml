  md: "Listing 3-12 Sorting using a custom comparer. This comparer properly sorts\
    \ strings that\\end with a number—see Output 3-9\n\n```\npublic class AlphaNumbersSort\
    \ : IComparer<string>\n{\n    public int Compare(string a, string b)\n    {\n\
    \        StringComparer sc =\n            StringComparer.CurrentIgnoreCase;\n\n\
    \        // if either input is null or empty,\n        // do a straight string\
    \ comparison\n        if (string.IsNullOrEmpty(a) ||\n            string.IsNullOrEmpty(b))\n\
    \            return sc.Compare(a, b);\n\n        // find the last numeric sections\n\
    \        string numericX = FindTrailingNumber(a);\n        string numericY = FindTrailingNumber(b);\n\
    \n        // if there is a numeric end to both strings,\n        // we need to\
    \ investigate further\n        if (numericX != string.Empty &&\n            numericY\
    \ != string.Empty)\n        {\n            // first, compare the string prefix\
    \ only\n            int stringCompareResult =\n                sc.Compare(a.Remove(a.Length\
    \ - numericX.Length),\n                          b.Remove(b.Length - numericY.Length));\n\
    \n            // the strings prefix are different,\n            // return the\
    \ comparison result for the strings\n            if (stringPartCompareResult !=\
    \ 0)\n                return stringPartCompareResult;\n\n            // the strings\
    \ prefix is the same,\n            // need to test the numeric sections as well\n\
    \            double nX = double.Parse(numericX);\n            double nY = double.Parse(numericY);\n\
    \            return nX.CompareTo(nY);\n        }\n        else\n            return\
    \ sc.Compare(a, b);\n}\n```"
