    # Generation Operators—Generating Sequences of Data


    Generating sequences of data to combine with LINQ to Object queries is often necessary
    when building unit tests and when working with indexable data sources, like iterating
    through the x and y coordinates of a bitmap image. the generation methods are
    not extension methods; they are purely static method calls in the System.Linq.Enumerable
    class and are included with the LINQ operators because they fulfill the important
    task of creating sequences of data without using a for-loop construct.


