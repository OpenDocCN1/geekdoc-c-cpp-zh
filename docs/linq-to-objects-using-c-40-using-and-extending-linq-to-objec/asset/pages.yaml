  md: "NOTE There are a number of other new language features added in both C# 3.0\
    \ and C# 4.0 that don't specifically add to the LINQ story covered in this introduction.\
    \ The C# 4.0 features are covered in Chapter 8. C# 4.0 does require the .NET Framework\
    \ 4 to be installed on machines executing the compiled code.\n\n# Extension Methods\n\
    \nExtension methods allow us to introduce additional methods to any type without\
    \ inheriting or changing the source code behind that type. Methods introduced\
    \ to a given type using extension methods can be called on an instance of that\
    \ type in the same way ordinary instance methods are called (using the dot notation\
    \ on an instance variable of type).\n\nExtension methods are built as static methods\
    \ inside a static class. The first argument in the method has this modifier, which\
    \ tells the compiler that the following type is to be extended. Any following\
    \ arguments are treated as normal, other than the second argument becomes the\
    \ first and so on (the argument prefixed by this modifier is skipped).\n\nThe\
    \ rules for defining an extension method are\n\n+   1. The extension method needs\
    \ to be defined in a nongeneric static class\n2. The static class must be at the\
    \ root level of a namespace (that is, not nested within another class)\n3. The\
    \ extension method must be a static method (which is enforced by the compiler\
    \ due to the class also having to be marked static)\n4. The first argument of\
    \ the extension method must be prefixed with the this modifier, this is the type\
    \ being extended\n\nTo demonstrate the mechanics of declaring an extension method,\
    \ the following code extends the System.String type, adding a method called CreateHyperlink.\
    \ Once this code is compiled into a project, any class file that has a using MyNamespace;\
    \ declaration can simply call this method on any string instance in the following\
    \ fashion:\n\n```\nstring name = \"Hooked on LINQ\";\nstring link = name.CreateHyperlink(\n\
    \    \"http://www.hookedonlin.com\");\n```"
