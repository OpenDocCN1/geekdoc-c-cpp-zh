  md: "# SequenceEqual Operator\n\nThe SequenceEqual operator compares one sequence\
    \ with another and only returns true if the sequences are equal in element values,\
    \ element order, and element count. There are two method signatures for SequenceEqual,\
    \ one that takes the sequence to compare as an argument, and one that also allows\
