- pgno: 291
  md: '# Data Ordering


    Ordering and parallelism have a natural tension. When a dataset order can- be
    impacted, the implementation of how parallel tasks are executed and the results
    merged narrows considerably, causing a performance decrease. In most cases, the
    parallel implementation will still be superior in performance to the sequential
    implementation, but for the best paral-ization, try and limit order dependence.


    The key point is that if ordering is required to be predictable, then parallel
    performance is traded. This can often be minimized by increasing the granularity
    of the task to run order dependent code in one parallel processing after order
    dependent code executed sequentially after the parallel processing has been carried
    out.


    # Exceptions—Who Stops When Something Fails?


    Exception that occurs in a parallel task offers great challenges. How this exception
    is trapped and where that exception is marshaled is problematic to design, predict,
    and implement. Obvious obvious, but avoid exceptions! You have to be prudent and
    carry out precondition checking to han-dle exception cases in an organized fashion
    without resorting to throwing an exception or having one raised on your behalf.


    # Dealing with These Constraints


    Dealing with and understanding the constraints of writing operational par-lel
    code is an important skill. Microsoft’s Parallel Extensions offers sol-utions
    to the general challenges, but in order to successfully write code that performs
    exceptionally in a multicore environment, you often need to explicitly tell the
    executing framework what your requirements are for your specific case. For example,
    if the data order needs to be maintained, you need to tell the compiler that is
    the case. You will pay a performance penalty (maybe slight faster than a sequential
    algorithm, maybe not), for the final result to be correct, the compiler must be
    told to maintain the cur-rent data order.


    Microsoft has addressed the issues of parallelizing data problems through a specific
    technology called Parallel LINQ. The technology tackles parallelizing data querying
    and manipulation in a coherent fashion without causing data corruption or incorrect
    results. It still has to abide by the constraints and limitations as listed here,
    but the heavy lifting and consist-ent programming pattern it provides reduces
    the variation in personal techniques.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# LINQ Data Parallelism


    LINQ queries are designed for working with sets of data and provide a convenient
    vehicle for taking the complexity of coding data querying and manipulation tasks.
    Parallel LINQ to Objects is a set of standard query operators similar (almost
    identical) to the sequential query operators that are implemented using the Parallel
    Extensions for .NET 4, a library of data structures and thread-pool implementations
    that help a developer perform efficient parallelization. The implementation of
    these parallel standard query operator variants use the entire arsenal offered
    by the Parallel framework extensions in order to improve the throughput of the
    LINQ queries; however, as will be quite evident, it is not wise to just use these
    operators as direct replacements for their sequential counterparts in cases.


    To understand the benefit of Parallel LINQ queries, the following example shows
    the results and performance of a LINQ query before and after parallelization.
    The actual performance increase and CPU load during the sequential and parallel
    example are explored here to see that traditional sequential queries may not (and
    will not) use all of the CPU processing power natively. This CPU usage pattern
    will be contrasted against the CPU usage when Parallel LINQ is invoked.


    # Parallelizing a Query — Geonames Example


    Geenames.org is an online geographic database of over eight million place names.
    The files are available for download under a Creative Commons license, and the
    website contains regional subsets of data and a complete file of all place names
    (780MB when I downloaded it for this example). The files are in a specific tab-separated
    text structure, with over 15 columns of data, including elevation, name, and a
    two-letter country code. The example query will simply iterate this file and return
    a sorted list of all entries with an elevation greater than 8,000 meters.


    NOTE .NET 4 introduced new overloads in the File and Directory classes. File.ReadLines
    previously returned a string[] of all lines in a file. A new overload returns
    an IEnumerable<string>, which allows you to iterate a file (using this method,
    you could iterate the file manually) without loading the entire file contents
    into memory. This helped a lot with our 780MB text file parsing.'
  merge: -1
  img_proc: true
