    following sections.


    # HOW MUCH DATA ARE YOU PROJECTING IN A SELECT PROJECTION? As with all good data-access
    paradigms, the goal should be to return the fewest properties as possible when
    defining a query shape. This reduces the memory footprint and makes the result
    set easier to code against because there are fewer properties to wade through.


    # Return a Single Result Value or Element


    Some of the standard query operators return a single value as the result, or a
    single element from the source collection; these operators are listed in Table
    3-1. Each of these operators end any cascading of results into another query,
    and instead return a single result value or source element.


    Table 3-1 Sample Set of Operators that Return a Specific Result Value Type (covered
    in Chapters 5 and 6)


    | Return Type | Standard Query Operator |

    |---|---|n| Numeric | Aggregate, Average, Max, Min, Sum, Count, LongCount |

    | Boolean | All, Any, Contains, SequenceEqual |

    | Type <T> | ElementAt, ElementOrDefault, First, FirstOrDefault, Last, LastOrDefault,
    Single, SingleOrDefault, DefaultIfEmpty |'
