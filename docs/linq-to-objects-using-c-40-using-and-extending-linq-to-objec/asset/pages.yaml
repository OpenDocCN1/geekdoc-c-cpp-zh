  md: "# 292\\quad\\quad\\quad\\quadCHAPTER 9\\quad\\quad\\quad_PARALLEL LINQ TO OBJECTS\n\
    \n**Table 9-2** Performance Refactoring on Sequential Variance Operators. Source\
    \ Was an Array or an IEnumerable of 100,000 Integers—the Variance Was Calculated\
    \ 1,000 Times Each Test\n\n| Algorithm | Array[int] | IEnumerable<int> |\n|---|---|---|\n\
    | Variance1 (Listing 9-8) | 17,780ms | 19,564ms |\n| Variance2 (Listing 9-9) |\
    \ 4,211ms | 5,774ms |\n| Variance (Listing 9-10) | 2,635ms | 3,169ms |\n\ndata\
    \ source. The results were 17 to 20 seconds, and with this baseline, optimization\
    \ and refactoring can begin.\n\n# **Optimize the Sequential Algorithm**\n\nThe\
    \ Variance operator functionally works and follows the most basic equation implementation\
    \ possible. However, the Math.Pow() method is extremely expensive, as we are just\
    \ squaring a single value. An easy refactoring is to use simple multiplication\
    \ instead, and the resulting performance increase is dramatic (approximately four\
    \ times, as shown in Table 9-2). Listing 9-9 shows the refactoring required making\
    \ this optimization.\n\n**Listing 9-9** First optimization of the sequential operator—remove\
    \ the **Math.Pow** function\n\n```\npublic static double Variance2(\n    this\
    \ IEnumerable<int> source)\n{\n    // optimization 1 - removing the expensive\
    \ Math.Pow call\n    double mean = source.Average();\n    return source.Aggregate(\n\
    \        (0.0, 0),\n        (subtotal, item) => subtotal +\n            ((double)item\
    \ - mean) * ((double)item - mean),\n            (totalSum) => totalSum / (source.Count()\
    \ - 1)\n    );\n}\n```"
