    \ in source)\n    {\n        if (startPredicate(element))\n            foundStart\
    \ = true;\n\n        if (foundStart)\n            if (endPredicate(element))\n\
    \                yield break;\n            else\n                yield return\
    \ element;\n    }\n)\n```\n\nThe convention when writing sequence operators is\
    \ to separate the iterator code from the extension method implementation. This\
    \ allows the same functional iterator to be called from multiple extension"
