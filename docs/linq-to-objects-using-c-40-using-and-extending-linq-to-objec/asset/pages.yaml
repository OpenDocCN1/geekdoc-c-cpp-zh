  md: '# Table 4-1 One-to-One Join Techniques and Their Performance Comparisons


    | Technique | Many Record Performance | Single Record Performance | Comments |

    |---|---|---|---|

    | Using the join (or Join) operator | Best | Worst | Use the join syntax whenever
    you are working with five or more outer element records. Builds a lookup on the
    inner records first, avoiding repetitive looping in subsequent outer iterations.
    Example: List-4-12 |

    | Using a subquery in the select projection | Good | Good | Use the SingleOrDefault
    syntax rather than a subquery. There is no benefit to using a subquery. Example:
    Listing 4-14 |

    | Using the SingleOrDefault operator in the select projection | Good | Best |
    Use SingleOrDefault syntax whenever you are working with a single (or minimal
    number of) outer records. Example: Listing 4-15 |

    | Using a cross join with a where filter | Worst | Good | Only use when a cross
    join is actually needed. Never use when there are many records—will result in
    very poor performance. Example: Listing 4-16 |


