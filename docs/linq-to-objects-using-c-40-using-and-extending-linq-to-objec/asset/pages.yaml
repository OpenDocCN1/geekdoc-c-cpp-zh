- pgno: 253
  md: 'The following are some tips for developing new grouping operators:


    +   * Try and use the ToLookup standard query operator in your implementation
    if possible.

    * Separate the iterator logic into its own method, so that multiple operator overloads
    can re-use the same iterator implementation.

    * Try to build the groups in one enumeration pass through the source sequence
    for optimal performance.

    * Try to yield a result grouping as soon as you can build one. Avoid building
    all up-front in the case that the user never iterates past the first group (just
    for performance, sometimes it is unavoidable, but worth looking for an algorithm
    that performs best with deferred execution).


    # Summary


    This chapter introduced how to build custom operators when required. LINQ to Object
    operators are simply extension methods for any type implementing the IEnumerable<T>
    interface.


    The general guidance for building operators is to look at the implementation of
    Microsoft''s standard query operators and follow their patterns. This ensures
    that your operators are consistent in how they handle errors and how they are
    used when other developers begin using these extensions in query expressions.'
