  md: '# CONVERSION OPERATORS—CHANGING TYPES 131


    The second overload of count and LongCount that takes a filter predicate as an
    argument allows you to count the number of elements that pass that function (return
    the Boolean value of true). For example, to count the number of integers divisible
    by ten in an integer array, the following code can be used (in case you are interested,
    the result is 214,748,364):


    ```

    var nums = Enumerable.Range(1, int.MaxValue);

    var q3 = nums.Count(i => i % 10 == 0);

    ```


    The Count operator is optimized for sequences that implement the ICollection<T>
    interface. Collections implementing this interface support the Count property
    of their own and avoid an iteration of their underlying collection to return their
    counts. For these collections, Count returns source.Count result. This optimization
    is not possible when the overload specifying a predicate is used; a full loop
    of the sequence is unavoidable to apply the predicate function.


    # DOES LINQ TO OBJECTS HAVE BUILT-IN PERFORMANCE OPTIMIZATIONS?


    An interesting blog post by Alexandra Rusina from Microsoft details the performance
    optimizations built into the standard query operators and LINQ to Objects provider.
    It details how IList and ICollection tests allow for faster execution for certain
    operators.


    This information can be found at http://blogs.msdn.com/csharpfaq/archive/2009/01/26/does-the-linq-to-objects-provider-have-built-in-performance-optimization.aspx.


