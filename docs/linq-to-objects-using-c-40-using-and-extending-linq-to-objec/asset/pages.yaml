  md: "# HOW TO GROUP ELEMENTS\n\npart-number strings are null in value the moment\
    \ the Substring method is attempted. Null values are safely handled in general,\
    \ but if the range variable is processed within the key selector function, the\
    \ normal null handling rules apply. Thus it is necessary to confirm an element\
    \ isn't null before attempting to access properties or call methods on these range\
    \ variables.\n\nThe following code throws a NullReferenceException when the query\
    \ is first accessed for iteration:\n\n```\nstring[] partNumbers = new string[]\
    \ { \"SCW10\", null,\n\"SCW2\", \"SCW11\", null, \"NUT1\", \"NUT2\", null };\n\
    \n// beware - nulls in source data can break your group\n// expression. This grouping\
    \ will fail.\nvar q = from pn in partNumbers\n    group by pn.Substring(0, 3);\n\
    ```\n\nTo protect against this circumstance, check the key selection expression\
    \ for null values and throw all those elements into a group of your choosing to\
    \ keep the exception from being thrown and to allow the null grouping to be properly\
    \ processed, as the following code demonstrates:\n\n```\nstring[] partNumbers\
    \ = new string[] { \"SCW10\", null,\n\"SCW2\", \"SCW11\", null, \"NUT1\", \"NUT2\"\
    , null };\n```\n\nThe ternary operator (?) and the null-coalescing operator (??)\
    \ offer a convenient syntax for handling potential null values in the keySelector\
    \ expression. Listing 4-2 demonstrates their use in protecting against a null\
    \ property value. In this case both operators handle the state property null and\
    \ groups these elements under the key value string of (null).\n\n# USING THE TERNARY\
    \ (?) AND NULL COALESC (??) OPERATORS\n\nThe ternary operator shortens the common\
    \ if (condition) then (true expression) else (false expression) pattern of code\
    \ to (condition) ? (true expression) : (false expression). This is especially\
    \ useful when handling null values within query expressions where a full-if-else\
    \ statement is not valid syntax."
