- pgno: 216
  md: '# EXTENDING LINQ TO OBJECTS


    Goals of this chapter:


    +   - Define the different types of operators and what makes them unique.

    - Define the common patterns used in building each type of operator.

    - Understand the best practices and patterns used for error handling.


    LINQ to Objects is designed to be extended. This chapter discusses how new operators
    can be written to perform any custom requirement and then be used in exactly the
    same way as the standard query operators Microsoft has provided.


    # Writing a New Query Operator


    Although the standard query operators supplied are comprehensive, there is often
    the need to build more operators to satisfy a programming problem at hand. LINQ
    to Objects operators are in their purest form, extension methods that add functionality
    to any IEnumerable<T> collection type. Although writing new operators might seem
    ambitious at first, the implementation code for the standard query operators supplied
    by Microsoft rarely span more than a few lines, and it is unlikely your custom
    operators will be any more complex.


    Query operators for LINQ to Objects fall into four categories based on their return
    type and action. The basic operator categories are


    +   - Single element operator—Those that return a single element from a sequence
    (for example, First, Last, ElementAt).

    - Sequence operator—Those that return a sequence of elements (Where, Select).

    - Aggregate operator—Those that return an aggregate result value (Count, Min,
    Max, Average).'
