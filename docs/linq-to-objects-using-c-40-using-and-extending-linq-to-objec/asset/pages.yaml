- pgno: 319
  md: "# Adding Error Handling\n\nHaving written our operators, handling input and\
    \ specific error cases need to be introduced. The following input source conditions\
    \ need to be considered, tested, and handled accordingly:\n\n+   - The source\
    \ argument is null—throw an ArgumentNullException the source argument.\n- The\
    \ source argument is an empty array—return zero.\n- The source argument contains\
    \ only one element—return zero.\n\nChoosing to return zero for an empty array\
    \ and an array with a single element is very specific to this operator and my\
    \ particular specification. Generally, an InvalidOperationException is thrown,\
    \ but for a statistical measure of variance, I decided to avoid an exception in\
    \ this case. Microsoft Excel returns a #DIV/0! error for a single element sample\
    \ deviation calculation, which I find unfamiliar, albeit arguably more correct.\n\
    \nThe null source error is easily handled with an initial check coming into the\
    \ variance extension method, as we saw extensively in Chapter 7, “Extending LINQ\
    \ to Objects.” The error check is accomplished by adding the following code:\n\
    \n```\nif (source == null)\n    throw new ArgumentNullException(\"source\");\n\
    ```\n\nAlthough the single check before the initial variance calculation for a\
    \ null source is acceptable (being unavoidable), the check for zero or a single\
    \ element in the source requires some thought. Adding a check before the aggregation\
    \ function, similar to the following example, might cause an entire enumeration\
    \ of a source array that is not an indexed collection, but IEnumerable<T>:\n\n\
    ```\nif (source.Any() == false)\n    throw new InvalidOperationException(\"No\
    \ elements\");\n```\n\nWhen we build parallel operators, we are doing so to improve\
    \ performance, and looping over data sources is limited to few times as possible\
    \ (one time ideally). Our algorithm using the aggregate operator offers us an\
    \ ideal solution. The final Selector function has access to the cumulative count\
    \ determined in the aggregation loop. We can use a ternary operator to check for\
    \ zero or one element at that time and return a value of zero in that case. We\
    \ have avoided an extra loop and have catered to"
