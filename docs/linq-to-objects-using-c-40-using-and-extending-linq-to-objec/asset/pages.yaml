- pgno: 36
  md: '# Expressing Code as Data


    Although not completely relevant to the LINQ to Objects story at time, the ability
    to express LINQ queries as a data-structure opens new opportunities as to how
    that query might be optimized and executed at runtime. Beyond the basic features
    of LINQ providers that turn your C# and VB.Net code into a specific domain query
    language, the full advantage of code built using data or changed at runtime hasn''t
    been fully leveraged at this time. One concept being explored by Microsoft is
    the ability to build and compile snippets of code at runtime; this code might
    be used to apply custom business rules, for instance. When code is represented
    as data, it can be checked and modified depending on its security implications
    or how well it might operate concurrently based on the actual environment that
    code is executed in (whether that be your laptop or a massive multi-core server).


    # Summary


    Defining LINQ is a difficult task. LINQ is a conglomerate of loosely labeled technologies
    released in tandem with the .NET Framework 3.5 and further expanded in .NET Framework
    4. The other complexity of answering the question “What is LINQ?” is that it''s
    a moving target. LINQ is built using an open and extensible architecture, and
    new operators and data sources can be added by any.


    One point is: LINQ will change the approach to writing data-driven applications.
    Code will be simpler, often faster, and easier to read. There is no inherent downside
    to using the LINQ features; it is simply the next installment of the C# and VB.Net
    languages are being improved to support tomorrow’s coding challenges.


    The next chapter looks more closely at how to construct basic LINQ queries in
    C#, a prerequisite to understanding the more advanced features covered in later
    chapters.


