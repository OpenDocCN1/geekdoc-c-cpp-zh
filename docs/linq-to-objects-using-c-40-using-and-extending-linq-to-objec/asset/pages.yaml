  md: '# C# 4.0 FEATURES


    +   Goals of this chapter:

    - Define new C# 4.0 language features.

    - Demonstrate the new language features in the context of LINQ Objects.


    C# is an evolving language. This chapter looks at the new features added into
    C# 4.0 that combine to improve code readability and extend your ability to leverage
    LINQ to Object queries over dynamic data sources. The examples in this chapter
    show how to improving the coding model for developers around reading data from
    various sources, including text files and how to combine data from a COM-Interop
    source into a LINQ to Objects query.


    # Evolution of C#


    C# is still a relatively new language (circa 2000) and is benefiting from continuing
    investment by Microsoft''s languages team. The C# language is an ECMA and ISO
    standard. (ECMA is an acronym for European Computer Manufacturers Association,
    and although it changed its name to Ecma International in 1994, it kept the name
    Ecma for historical reasons.¹) The standard ECMA-334 and ISO/IEC 23270:2006 is
    freely available online at the Ecma International website* and describes the language
    syntax and notation. However, Microsoft''s additions to the language over several
    versions take some time to progress through the standards process, so Microsoft''s
    release cycle leads Ecma''s acceptance by at least a version.


    Each version of C# has a number of new features and generics and nullable types
    in C# 2.0, the major themes have been generics and generally major theme.'
