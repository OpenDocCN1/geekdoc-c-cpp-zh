    \ partitioning the data is more complex, and the actual partitioning scheme depends\
    \ on the operators used in the query, among other factors.\n\nThe built-in partition\
    \ schemes at the time of writing are called chunk, striped, and hash. Each of\
    \ these data partitioning schemes vais"
