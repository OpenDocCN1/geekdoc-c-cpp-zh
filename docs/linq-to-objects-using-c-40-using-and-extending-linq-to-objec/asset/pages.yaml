  md: '# THE (ALMOST) CURRENT LINQ STORY


    different domain-specific languages (DSLs) and development environments to retrieve
    and manipulate data from different sources.

    LINQ has simple goals on the surface, but it has massive impact on the way programs
    are written now and how they will be written in the future. A foundational piece
    of LINQ technology (although not directly used when executing LINQ to Object queries
    is a feature that can turn C# and VB.Net code into a data-structure. This intermediate
    data-structure can express expression tree, although not covered in this book,
    also code to be converted into a data structure that can be processed at runtime
    and be used to generate statements for a specific domain query language, as pure
    SQL statements for example. This layer of abstraction between developer coding
    language, and a domain-specific query language and execution runtime, allows an
    almost limitless ability for LINQ to expand as new sources of data emerge or new
    ways to optimize access to existing data sources come into reality.


    # The (Almost) Current LINQ Story


    The current LINQ family of technologies and concepts allows an extensive set of
    operators that work over structured data, independent of how data is stored or
    retrieved. The generalized architecture of the technology also allows the LINQ
    concepts to be expanded to almost any domain or technology.


    The loosely coupled product names that formed the marked LINQ family may distract
    from the true story. Each specific flavor of LINQ carries out its own underlying
    query mechanism and features that often aren''t LINQ-specific, but they eventually
    build and converge into a standard C# or VB.Net programming query interface for
    data—hence, these products get by the LINQ moniker. The following list of Microsoft-specific
    products and technologies form the basis of what features currently constitute
    LINQ. This list doesn''t even begin to cover the community efforts contributing
    to the overall LINQ story and is intended to just broadly outline the current
    scope:


    +   - LINQ Language Compiler Enhancements

    - C# 3.0 and C# 4.0; New language constructs in C# to support writing queries
    (these often built on groundwork work in C# 2.0, namely generics, iterators, and
    anonymous methods)

    - VB.Net 9; New language constructs in VB.Net to support writing queries

    - A mechanism for storing code as a data structure and a way to convert user code
    into this data structure (called an expression tree)'
