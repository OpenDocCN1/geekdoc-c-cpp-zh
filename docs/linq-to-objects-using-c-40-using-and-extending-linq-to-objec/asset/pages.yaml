  md: "# HOW TO FILTER THE RESULTS (WHERE CLAUSE) 49\n\n# QUERY EXPRESSION DEVELOPER\
    \ TIPS\n\n+   - If you need to mix extension methods with query expressions, put\
    \ them at the end.\n- Keep each part of the query expression on a separate line\
    \ to allow you individually comment out individual clauses for debugging.\n\n\
    # How to Filter the Results (Where Clause)\n\nOne of the main tasks of a LINQ\
    \ query is to restrict the results from a larger collection based on some criteria.\
    \ This is achieved using the Where operator, which tests each element within a\
    \ source collection and returns only elements that return a true result when tested\
    \ against a given predicate expression. A predicate is simply an expression that\
    \ takes an element of the same type of items in the source collection and returns\
    \ true or false. This predicate is passed to the Where clause using a lambda expression.\n\
    \nThe extension method for the Where operator is surprisingly simple; it iterates\
    \ the source collection using a foreach loop, testing each element as it goes,\
    \ returning those that pass. Here is a close facsimile of the actual code in the\
    \ System.Linq library:\n\n```\npublic delegate TResult Func<T1, TResult>(T1 arg1);\n\
    ```\n\n```\npublic static IEnumerable<T> Where<T(\n    IEnumerable<T> source,\n\
    \    Func<T, bool> predicate) {\n```\n\n```\nforeach (T element in source)\n \
    \   if (predicate(element))\n        yield return element;\n```\n\n```\n}\n```\n\
    \nThe LINQ to Objects Where operator seems pretty basic on the surface, but its\
    \ implementation is simple due to the powerful yield return statement that first\
    \ appeared in the .NET Framework 2.0 to make building collection iterators easier.\
    \ Any code implementing the built-in enumeration pattern (as codified by any collection\
    \ that implements the interface"
  merge: -1
