- pgno: 165
  md: '# Element Operators


    DefaultIfEmpty, ElementAt, ElementAtOrDefault, First, FirstOrDefault, Last, LastOrDefault,
    Single, and SingleOrDefault are all types of operators that return an individual
    element from a sequence or a default value if no element of a specific type exists.


    The OrDefault variation of each of these operators (and DefaultIfEmpty) neatly
    handles the situation where an element cannot be found that satisfies the criteria,
    returning a default (T) result in these cases. The variations that do not end
    with OrDefault throw an exception if no element satisfies the criteria.


    WHAT DOES THE DEFAULT KEYWORD RETURN? The default keyword solves the issue of
    not knowing what default value to initially assign to a generic type. The default
    keyword returns null for reference types and zero for numeric value types. For
    structs, it returns each member of the struct initialized to zero or null, depending
    on whether they are value or reference types.


    # DefaultIfEmpty Operator


    DefaultIfEmpty operator allows the graceful handling of when a sequence is empty
    (has no elements). There are two method overloads; the first handles an empty
    sequence by returning a single element of default(TSource) within an IEnumerable<T>.
    The second overload takes an argument specifying a default value to return if
    the source sequence is empty. In both cases, the default value is only returned
    if the source sequence is empty. The method signatures available are:


    ```

    // Returns the source sequence, or the default(TSource)

    // in an IEnumerable<TSource> if the source sequence has

    // no elements

    public static IEnumerable<TSource> DefaultIfEmpty<TSource>(source);

    // Returns the source sequence, or the defaultValue

    // specified in an IEnumerable<T> if the source sequence has

    // has no elements

    public static IEnumerable<TSource> DefaultIfEmpty<TSource>(source,

    TSource defaultValue);

    ```'
