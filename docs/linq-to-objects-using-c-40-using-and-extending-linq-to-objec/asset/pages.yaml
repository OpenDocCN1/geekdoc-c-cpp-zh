  md: "# PARTITIONING OPERATORS—SKIPPING AND TAKING ELEMENTS 163\n\n# SkipWhile and\
    \ TakeWhile Operators\n\nThe SkipWhile and TakeWhile operators skip or return\
    \ elements from a sequence while a predicate function passes (returns True). The\
    \ first element that doesn't pass the predicate function ends the process of evaluation.\n\
    \nThere are two overloads for each operator—one that takes a predicate to determine\
    \ if an element is skipped, and the second that the predicate also provides an\
    \ element index position that can be used in the predicate function for any given\
    \ purpose. The method signatures are:\n\n```\n// Skip elements while a predicate\
    \ passes,\n// then return all the remaining elements.\npublic static IEnumerable<TSource>\
    \ SkipWhile<TSource(\n    this IEnumerable<TSource> source,\n    Func<TSource,\
    \ bool> predicate);\n```\n\n```\n// Skip elements while a predicate passes,\n\
    // then return all the remaining elements.\n// This overload also provides index\
    \ position as an argument for use in the predicate function.\npublic static IEnumerable<TSource>\
    \ SkipWhile<TSource(\n    this IEnumerable<TSource> source,\n    Func<TSource,\
    \ int, bool> predicate);\n```\n\n```\n// Return elements while a predicate passes,\n\
    // then skip all the remaining elements.\npublic static IEnumerable<TSource> TakeWhile<TSource(\n\
    \    this IEnumerable<TSource> source,\n    Func<TSource, bool> predicate);\n\
    ```\n\n```\n// Return elements while a predicate passes,\n// then skip all the\
    \ remaining elements.\n// This overload also provides index position as an argument\
    \ for use in the predicate function.\npublic static IEnumerable<TSource> TakeWhile<TSource(\n\
    \    this IEnumerable<TSource> source,\n    Func<TSource, int, bool> predicate);\n\
    ```\n\nA simple example of where these operators are useful when parsing text\
    \ files from the beginning. The example shown in Listing 5-27 skips any lines\
    \ at the start of a file (in this case, this data is in string format for simplicity)\
    \ and then returns all lines until an empty line is found. All lines after this\
    \ blank line are ignored. The Console output from this example is shown in Output\
    \ 5-1."
