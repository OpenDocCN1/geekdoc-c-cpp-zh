    nums.DefaultIfEmpty() = 1

    empty.DefaultIfEmpty() = 0

    empty.DefaultIfEmpty(100) = 100


    # ElementAt and ElementAtOrDefault Operators


    The ElementAt operator returns the element at a given zero-based position in a
    sequence. An ArgumentOutOfRangeException is thrown if the index position is less
    than zero or beyond the end of the sequence. To avoid this exception, use the
    ElementAtOrDefault operator instead, and a default(T) instance will be returned
    when the index is out of range.'
