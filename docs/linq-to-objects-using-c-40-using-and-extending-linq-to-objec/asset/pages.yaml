- pgno: 298
  md: 'certain set of source data types and operator scenarios; the parallel runtime
    chooses the appropriate one and partitions the data for execution when a worker
    process asks for more work.


    You are not limited to the partitioners Microsoft has built-in. They have allowed
    for custom partitioners to be written for a specific purpose; this topic is beyond
    the scope of this book, but search online for Partitioner-ConfigSource for details.
    To understand each of the built-in partitioners and to understand their relative
    strengths and weaknesses, each one briefly explained.


    **Range Partitioning** The range partitioning scheme breaks an input data set
    into equal-sized ranges optimized for the number of threads determined available
    (best case: equal to the number of cores available). Range partitioning is chosen
    when the data source is indexable (IList<T> and arrays). For indexable sources
    like these, the length is known when enumerating the data source (to determine
    the count), and the number of elements per partition for parallel execution is
    simply calculated upfront.


    This partitioning scheme offers great parallel efficiency, largely from not needing
    any synchronization between participating threads. Threads get a range of data
    assigned to them and can process data without any interaction (incoming or outgoing)
    with other threads. The downside of this thread isolation is that other threads
    cannot help out if one thread gets behind in processing due to uneven utilization;
    on balance though, this partitioning scheme is efficient.


    **Chunk Partitioning** Chunk partitioning is used when a data source isn''t indexed
    (IEnumerable<T>) where the elements can be accessed by index and the count property
    cannot be ascertained without an enumeration of the entire data source.


    Microsoft has optimized this partitioning scheme for a wide variety of queries,
    and although the exact algorithm isn''t known, the responsible team''s blog posts
    indicate that the number of elements per partition is doubled after a certain
    number of requests and so on. This allows this partitioning scheme to be adaptable
    from sources with only a few elements to sources with many million elements, keeping
    each core filled with work, while still balancing their load to ensure the greatest
    chance of each core finishing to the same time.


    As mentioned previously, this partitioning algorithm can''t be as exact as range
    partitioning, and you should strive for using an indexable collection for your
    parallel data sources whenever possible.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Hash Partitioning This partitioning scheme is for queries (containing operators)
    that need to compare data elements. For example, the following-operators compare
    key hash values when they execute: Join, GroupJoin, GroupBy, Distinct, Except,
    Union, and Intersect. The intention of partitioning scheme is that elements that
    share the same hash-code will be partitioned into the same thread. The alternative
    options of partitioning elements would require extensive and complex inter-thread
    synchronization and data sharing. This partitioning scheme reduces over-head and
    enhances parallel performance for queries using these operators.


    The downside however is that hash partitioning is complex and has a higher overhead
    than the partitioning schemes listed so far. However, it is the most efficient
    and viable option for query operators that need to compare hash codes to do their
    work, such as GroupBy and Join.


    # HASH-CODE DISTRIBUTION CONCERNS WHEN USING HASH


    PARTITIONING Stephen Toub from Microsoft''s Parallel Framework team made the following
    note on this subject during a quick review. I couldn''t have written this better,
    so didn''t even try:


    > "The system makes an assumption that hash codes for elements are equally spread
    across all elements, such that the partitions will end up having many numbers
    of items, resulting in a load-balanced system. If, however, too many of one hash
    code exist (such as if the same string appeared in a list of strings a disproportionate
    number of times, or if a poor hash function was used on a custom type), load balance
    issues can result. This is the same problem hashtags/dictionaries have, where
    the speed of access is expected to be O(1), but that can quickly get thrown out
    of whack if one bucket fills up significantly faster than other buckets."


    Striped Partitioning Striped partitioning is used for standard query operators
    that process and evaluate from the front of a data source. SkipWhile and TakeWhile
    are the operators that use this partitioning scheme. Striped partitioning is only
    available when the data source is indexable (List-T and arrays, T[]) and assumes
    that each element needs to be processed sequentially in order to avoid launching
    off a significant amount of work that has to be thrown away at merge time It achieves
    this by taking very small ranges at a time, processing these in parallel to gain
    some optimization, and then merging carefully based on the result of the while
    predicate.'
  merge: -1
