    # Merging Operators


    Zip, a single merging operator, was added into .NET Framework 4.


    # Zip Operator


    The Zip operator merges the corresponding elements of two sequences using a specified
    selector function. The selector function takes an element from the first sequence
    and the corresponding element and projects a result using the function supplied.
    This process continues until one of the sequences (or both) has no more elements.

    Zip has a single overload with the following method signature:


    ```

    // Merges (combines) the elements from two sequences using the

    // resultSelector function until one sequence has no more elements.

    public static IEnumerable<TResult> Zip<TFirst, TSecond, TResult>(nthis IEnumerable<TFirst>
    first,

    IEnumerable<TSecond> second,

    Func<TFirst, TSecond, TResult> resultSelector);

    ```'
