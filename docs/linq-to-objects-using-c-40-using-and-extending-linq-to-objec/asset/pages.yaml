    // mean = sum / count\n// variance = (sum_sqr sum * mean) / (n - 1)\nresult =>\n\
    (result[2] - (result[1] * (result[1] / result[0]))\n/ (result[0] - 1)\n);\n```\n\
    \nAs Table 9.2 shows, the performance benefits gained by optimizing the sequential\
