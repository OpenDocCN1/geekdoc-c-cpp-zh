- pgno: 71
  md: "# CHAPTER 3 WRITING BASIC QUERIES\n\nIEnumerable natively supports callers\
    \ asking for the next item in a collection—at which time the next item is computed\
    \ (supported by the foreach keyword as an example). Any collection implementing\
    \ IEnumerable<T> pattern (which also implements IEnumerable) will be extended\
    \ by the where operator, which will return a single element at a time when asked,\
    \ as long as that element satisfies the predicate expression (returns true).\n\
    \nFilter predicate expressions are passed to the extension method using a lambda\
    \ expression (for a recap on what a lambda expression is see Chapter 2, \"Introducing\
    \ LINQ to Objects\"), although if query expression syntax takes an even cleaner\
    \ form. Both of these predicate expression styles are explained and covered in\
    \ detail in the following sections.\n\n# Where Filter Using a Lambda Expression\n\
    \nWhen forming a predicate for the Where operator, the predicate takes an input\
    \ element of the same type as the elements in the source collection and returns\
    \ true or false (a Boolean value). To demonstrate using a simple Where predicate,\
    \ consider the following code:\n\n```\nstring[] animals = new string[] { \"Koala\"\
    , \"Kangaroo\",\n\"Spider\", \"Wombat\", \"Snake\", \"Emu\", \"Shark\",\n\"Sting-Ray\"\
    , \"Jellyfish\" };\n```\n\n```\nvar q = animals.Where(\n    a => a.StartsWith(\"\
    S\") && a.Length > 5);\n\nforeach (string s in q)\n    Console.WriteLine(s);\n\
