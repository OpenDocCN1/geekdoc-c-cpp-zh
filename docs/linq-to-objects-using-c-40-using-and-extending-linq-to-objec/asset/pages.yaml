  md: "# Create and Test the Parallel Operator\n\nIt is a straightforward adaption\
    \ from the sequential code that is built using the Aggregate standard query operator\
    \ to derive the parallel operator using the Parallel LINQ Aggregate standard query\
    \ operator. A Parallel LINQ operator is an extension method of the ParallelQuery<T>\
    \ type, rather than the IEnumerable<T> type.\n\nThe Aggregate standard query operator\
    \ has an extra argument not present on its sequential counterpart. You read earlier\
    \ that data is partitioned and acted upon by different threads of execution during\
    \ parallel query execution. This necessitates that each thread's result must be\
    \ merged with the other threads' results in order for the aggregation to be mathematically\
    \ sound. We need to supply this Combine Accumulator function (for each result),\
    \ in addition to the Update Accumulator function (each element).\n\nListing 9-12\
    \ shows the standard query operators with no error guards or handling (we get\
    \ to that in a moment). If you compare it to optimized sequential operator in\
    \ Listing 9-10, you can see the subtle changes. We continue to use our single\
    \ pass aggregation function, but we update it to work in a concurrent world. The\
    \ changes were made as follows:\n\n+   - IEnumerable<T> was replaced by ParallelQuery<T>\
    \ for this extension method. Any query that operates over a source.AsParallel\
    \ will be routed to this extension method overload rather than the sequential\
    \ overload.\n- The seed array is created using a factory function; this allows\
    \ each partition to create (by calling this function) and operate on its own seed\
    \ in isolation, avoiding any contention between threads during the aggregation\
    \ process.\n- The Combine Accumulator function can just add (sum each element\
    \ with the same position) by index the left and right side arrays.\n\n![](img/a165e601c4b83dd836f659a99a3c067c_316_0.png)\n\
    \n# Listing 9-12 The parallel Variance and StandardDeviation extension methods\n\
    \n```\npublic static double Variance(\n    this ParallelQuery<int> source)\n{\n\
    \    /* based on the blog posting by Igor Ostrovsky - -\n     * http://blogs.msdn.com/pfxteam/archive/2008/06/05/8576194.aspx\n\
    \     * which demonstrates how to use the factory functions in an\n```"
