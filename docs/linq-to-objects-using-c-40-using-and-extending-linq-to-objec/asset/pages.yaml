  md: "# Aggregation Operators—Working with Numbers 123\n\n# Aggregation Operators—Working\
    \ with Numbers\n\nLINQ's aggregation operators enumerate a sequence of values\
    \ (normally numeric, but not mandatory), perform some operation for each element,\
    \ and ultimately return a result (normally numeric, but not mandatory). In pure\
    \ form, Sum, Average, Min, and Max can all be built using the Aggregate operator;\
    \ however, the specifically named operators make queries cleaner in syntax by\
    \ spelling out the exact operation being performed. Each of these operators are\
    \ covered in detail in the following sections, starting with the Aggregate operator.\n\
    \n# Aggregate Operator\n\nThe Aggregate operator performs a folding pattern on\
    \ each element using a lambda expression and passing the accumulated result to\
    \ the next element when processed. This operator is powerful, both in building\
    \ day-to-day queries to process an entire sequence and building other operators\
    \ that carry out numeric operations on a sequence (the Aggregate operator is used\
    \ as the basis for a custom operator to calculate the standard deviation and variance,\
    \ as discussed in Chapter 9,\"Parallel LINQ to Objects\")\n\nThe Aggregate operator\
    \ has three overloaded method signatures. These overload allow you to specify\
    \ a seed value and/or a selection function in addition to the aggregation function.\
    \ The method signatures available are:\n\n```\n// Applies an accumulator function\
    \ to each element.\npublic static TSource Aggregate<TSource>(\n\tthis IEnumerable<TSource>\
    \ source,\n\tFunc<TSource, TSource, TSource> func);\n```\n\n```\n// Applies an\
    \ accumulator function to each element.\n// The accumulator can be a different\
    \ type than the elements,\n// and a starting (seed) value must be specified.\n\
    public static TAccumulate Aggregate<TSource, TAccumulate>(\n\tthis IEnumerable<TSource>\
    \ source,\n\tTAccumulate seed,\n\tFunc<TAccumulate, TSource, TAccumulate> func);\n\
    ```\n\n```\n// Applies an accumulator function to each element.\n// The accumulator\
    \ can be a different type than the elements\n```"
