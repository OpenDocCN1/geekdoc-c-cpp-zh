    # Specifying Your Own Custom Sort Comparison Function


    To support any sorting order that might be required, custom sort comparison classes
    are easy to specify. A custom compare class is a class based on a standard .NET
    Interface called IComparer<T>, which exposes a single method: Compare. This interface
    is not specifically for LINQ; it is the basis for all .NET Framework classes that
    require sorting (or custom sorting) capabilities.


    Comparer works by returning an integer result, indicating the relationship between
    a pair of instance types. If the types are deemed equal, the function returns
    zero. If the first instance is less than the second instance, a negative value
    is returned, or if the first instance is larger than the second instance, the
    function returns a positive value. How you equate the integer result value is
    up to you.


