  md: 'which part of a query the extension method syntax applies to. If you mix styles,
    keep them together; for example, use the query expression at the start surrounded
    by parentheses, then the extension methods at the end for the necessary operators
    (as shown in all examples in this book when mixing was needed).


    My preference (because of my SQL background perhaps) is to use the query expression
    syntax wherever possible and then revert to using the extension method using an
    operator not supported by query expressions (the Distinct operator, for instance),
    but I always add these operators at the end of the query. I''ll sometimes use
    all expression method syntax but never when the query has a Join or GroupBy operator.


    Each query syntax has its own merits and pitfalls, which the following sections
    cover in detail.


    # Query Expression Syntax


    The query expression syntax provided in C# 3.0 and later versions makes queries
    clearer and more concise. The compiler converts the query expression into extension
    method syntax during compilation, so the choice of which syntax to use is based
    solely on code readability.


    Figure-3-1 shows the basic form of query expressions built into C# 3.0.


    ```

    IEnumerable<T-T> query-expression-identifier =

    from identifier in expression

    let_opt identifier = expression

    where_opt boolean-expression

    join_opt type_opt identifier In expression on

    expression equals expression into_opt identifier

    orderby_opt ordering-clause(s) ascending|descending opt

    group_opt expression by expression into_opt identifier

    select expression into_opt identifier

    ```


    Figure 3-1 The basic query expression syntax form. The C# 3.0 Language Specification
    outlines exactly how this form is translated into extension methods for compilation.'
