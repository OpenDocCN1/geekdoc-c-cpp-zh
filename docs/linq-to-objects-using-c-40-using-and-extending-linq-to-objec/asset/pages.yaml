    # Listing 5-15 The DefaultIfEmpty operator allows safe handling of potentially
    source sequences—see Output 5-6


    ```

    var nums = new int[] { 1, 2, 3, 4, 5 };

    var empty = new int[] { };


    // returns 1, because the array isn''t empty

