  md: "# WRITING A GROUPING OPERATOR 223\n\n4. Write unit tests and ensure they pass\
    \ (avoiding the religious debate as to whether tests should be written before\
    \ the code or vice versa).\n\nThe Lookup standard query operator almost universally\
    \ caters to any grouping requirement (for instance, it is the basis for GroupBy\
    \ operator). If you find an implementation using the Lookup operator, you can\
    \ save a lot of time. For educational purposes, we are going to build a grouping\
    \ operator from scratch.\n\n# Grouping Collection Implementation\n\nEach group\
    \ result from a grouping operator should follow the IGrouping<TKey, TElement>\
    \ interface. This collection implementation should be read-only from the consuming\
    \ application code and only populated by our grouping operator code. Listing 7-14\
    \ shows a basic implementation is a close facsimile of the Group type used by\
    \ Microsoft in the standard query operator's; however, we need to duplicate that\
    \ code because class is marked internal. You will notice that any property setter\
    \ or method that can alter the contents of the collection throws a NotSupportedException\
    \ (the collection is read-only). You can iterate, access elements by index, and\
    \ retrieve the key property for the group—but that is essentially all.\n\nListing\
    \ 7-14 Example grouping element collection implementation—predominantly read-only\n\
    \n```\npublic class Grouping<TKey, TElement> :\n  IGrouping<TKey, TElement>, IList<TElement>\n\
    {\n    internal TKey key;\n    internal TElement[] elements;\n    internal int\
    \ count;\n\n    public Grouping(int count)\n    {\n        elements = new TElement[count];\n\
    \    }\n\n    internal void Add(TElement element)\n```"
