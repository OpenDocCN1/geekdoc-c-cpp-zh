    \ out. When no IComparer is passed in, the default equality comparer is for the\
    \ source element type.\n\nThe method signatures available for the SequenceEqual\
    \ operator:\n\n```\n// Return true if the two sequences are equal\n// in element\
    \ values, order and count.\n// Uses IComparer<TSource>.Default\n// to compare\
    \ elements for equality.\npublic static bool SequenceEqual<TSource>(\n    IIEnumerable<TSource>\
    \ first,\n    IIEnumerable<TSource> second);\n\n// Return true if the two sequences\
