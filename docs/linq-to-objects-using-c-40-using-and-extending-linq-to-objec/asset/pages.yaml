- pgno: 306
  md: '# The AsParallel and AsSequential Operators


    The AsParallel operator attached to the source of a LINQ query turns a sequential
    query into a parallel query. (Parallel means the overload operator extending ParallelQuery<T>
    is called rather than the overload extending IEnumerable<T>.) The AsSequential
    operator on the other hand, returns the query from that point forward calling
    the sequential operators (IEnumerable<T> overload rather than Simply, these extension
    methods allow you to opt-in and opt-out of using the Parallel LINQ extensions
    from within a query expression.


    To maximize the efficiency of LINQ queries, it is sometimes necessary for the
    developer to take control over what parts of a query are parallel and which parts
    aren''t. Some operators exclude the query from seeing any parallel performance
    improvement, and in order to allow Parallel LINQ to operate on other parts of
    a query, some developer intervention is required.


    # When to Use the AsSequential Operator


    The ability to control what parts of a query are sequential and what parts executed
    parallel allows you to isolate parts of a query that run slower when executing
    concurrently. This is often the case when queries are composed (one query as the
    source of another). When composing queries in this way, it can be useful to force
    one part to be sequential while another is parallel. A good strategy is carefully
    consider which parts of a query benefit from parallelization, by inserting it
    after portion of any query at the end by an AsSequential operator.


    Remembering back to the early sections of this chapter where the Parallel LINQ
    process was described, the initial step in an analysis of the LINQ query is to
    determine if parallelization is a good fit. This process entails looking at the
    operators called in a query, and if certain operators are called (particularly
    on non-indexed collection types), then those queries are executed sequentially.
    You can use the AsSequential operator to isolate those operators and achieve a
    greater use of parallelization in the areas that benefit.


    The exact rules about when Parallel LINQ will decide to execute a query as sequential
    (even though you think it AsParallel) is likely to change as Microsoft adds more
    capabilities into their analysis and operators in the future. At the time of writing,
    the easiest way to see this occur is to use the Take operator on an IEnumerable<T>
    (in our case, the anonymous projected result from a query). The following query
    would execute if source was an unindexed collection:


    ```

    var q = source.AsParallel().Take(5);

    ```'
