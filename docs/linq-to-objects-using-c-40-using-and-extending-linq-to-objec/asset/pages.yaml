  md: '# CHAPTER 6


    # WORKING WITH SET DATA


    Goals of this chapter:


    +   - Define the two options for working with set data using LINQ.

    - Introduce the HashSet type and how this relates to LINQ.

    - Introduce the LINQ standard query operators that relate to working with set
    data.


    There are two ways of applying set-based functions over data sequences using LINQ.
    This chapter explores the merits of both options and explains when and why to
    use one method over another.


    # Introduction


    Set operations allow various functions to compare elements against each other
    in collections (and in some cases, the same collection) against each other to
    determine overlapping and unique elements within a collection.


    Framework libraries for set operations were missing in the .NET Framework 1, 2,
    and 3. The HashSet was introduced in .NET Framework 3.5, and this collection type
    solves most set problems often faced by developers. LINQ extended set function
    capability with specific operators, some of which overlap with HashSet functionality.
    It is important to understand the benefits of both strategies and when to choose
    one over another. This section looks in detail at the two main choices:


    +   - LINQ standard query operators

    - HashSet<T> class from the System.Collections.Generic namespace'
