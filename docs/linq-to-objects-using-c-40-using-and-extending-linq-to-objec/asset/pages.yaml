- pgno: 339
  md: "For several years, Troy has been one of the key figures in the LINQ community.\
    \ This comprehensive and well written book serves as a compendium of the important\
    \ wisdom and experience that he has accumulated through his years of studying\
    \ LINQ and its uses.\n\n* Charlie Calvert\n\nMicrosoft C Community Program Manager\n\
    \n“LINQ is changing the way we think about working with data, and in many ways,\
    \ also about programming in general. LINQ to Objects C# 4.0 is a thorough reference\
    \ that teaches how to simplify many-to-day tasks with data. It also gives you\
    \ the foundations that are necessary to understand a wide range of fascinating\
    \ LINQ that will, no doubt, continue to appear over the next few years.\n\n* Thomas\
    \ Petrickec\n\nMicrosoft MVP and author of\nReal-World Functional Programming\n\
    \nTroy Magennis is a Microsoft C# MVP and a key veteran who currently works for\
    \ Travelocity, which manages the travel and leisure websites worldwide. As a former\
    \ Vice President of Architecture, he led a team of architects across seven continents,\
    \ coming today the traveler's champion. Technology has always been a passion.\
    \ Cutting his teeth on 8-bit personal computers, Troy moved into electronic engineering\
    \ (learning coding), later into software development and architecture for some\
    \ of the most prominent corporations in automotive, banking, and online. Troy's\
    \ first experience with LINQ was in 2006 when he took a sabbatical to learn it\
    \ and became hooked, ultimately leading him to publish the popular HotPeek.com\n\
    \n# Your Complete Example-Guide to Using and Extending LINQ to Objects and PLINO\n\
    \nUsing LINQ, .NET developers can write queries over collections with the same\
    \ deep functionality that was once available only with SQL and relational databases.\
    \ Now, for the first time, developers have a comprehensive and authoritative guide\
    \ to applying LINQ to Objects in real-world software. Microsoft Troy Magennis\
    \ introduces state-of-the-art techniques for working with in-memory collections\
    \ more efficiently and elegantly—and writing code that is exceptionally powerful,\
    \ robust, and flexible.\n\nDrawing on his experience coding software using LINQ\
    \ and hosting the popular HotPeekOnline.com, site Magennis presents timely, realistic\
    \ solutions to a wide spectrum of development challenges, such as combining data\
    \ from multiple sources, and achieving optimal performance with extremely large\
    \ sets of data. You'll begin with quickstarts how to use LINQ to Objects and query\
    \ syntax. Then you will drill down to techniques for applying and extending these\
    \ features with C# 4.0 and C# 3.0—including code examples that reflect the realities\
    \ of production development\n\nCoverage\n\n+   * Writing basic LINQ queries with\
    \ C#: filtering, projecting, and sorting data in in-memory collections\n* Advanced\
    \ techniques for grouping and joining data and understanding the performance implications\
    \ of each technique Taking full advantage of LINQ's standard query operators\n\
    \ Creating custom query operators that follow best coding patterns and error handling\n\
    * Writing more, readable LINQ queries with C# 4.0 enhancements, including the\
    \ new dynamic features\n* Combining LINQ with COM-data sources such as Microsoft\
    \ Excel\n* Using Parallel LINQ to Objects (PLINQ) to optimize for multi-core processors,\
    \ and how to build custom query operators\n* Integrating the LINQ to Objects into\
    \ your day-to-day coding\n\n![](img/a165e601c4b83dd836f659a99a3c067c_339_0.png)\n\
    \nFREE Online Edition\nwith purchase of this book.\n\nDetails on Last Page\n\n\
    ISBN: 978-0-321-63700-0\nISBN-10: 0-321-63700-3\n\n54499\n\n9780321637000\n\n\
    $44.99 | $53.99 CAD\n\nAddison-Wesley\nPearson Education\n\nText printed on recycled\
    \ cover\n\nCover photograph by Chad Baker / Photodesic / Getty Images"
