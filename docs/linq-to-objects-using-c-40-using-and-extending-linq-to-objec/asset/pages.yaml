- pgno: 311
  md: 'Build the operator using the Task Parallel Library looping constructs System.Threading.Parallel.For
    and System.Threading.Parallel.ForEach.

    This should rarely necessary—build your operator using the Parallel Library Task
    class directly.


    Before going down any of these paths, however, you should optimize the sequential
    algorithm as much as possible. The sequential algorithm will form the base for
    the parallel implementation.


    To demonstrate the process for writing a new parallel operator, a statistical
    extension for calculating the variance and the standard deviation of an integer
    data source are shown. Parallel queries are especially suited for queries over
    large numeric data sets, and aggregating statistical values is a common business
    requirement for scientific and financial software.


    # Building a Parallel Aggregate Operator—Sample Standard Deviation


    To demonstrate making a parallel operator, we will implement a statistical function
    for standard deviation, which is a measure of variance for a set of data. In order
    to build this operator, you follow the general development steps:


    +   1. Create and test a sequential algorithm.

    2. Optimize the sequential algorithm as much as possible.

    3. Create and test the parallel algorithm.

    4. Add error-handling condition guard code. (This can be done at any stage.)


    # Building the Sequential Algorithm


    Like many computing problems nowadays, our first port of call is to search the
    Internet for algorithms and reference material. A quick search of Wikipedia shows
    that variance and standard deviation can be calculated using the following formulas:


    Sample Standard Deviation = Square root (Sample Variance)

    Unbiased Estimate of Sample Variance = (Sum (x - mean(x))^2) / (n - 1)'
