  md: '# CHAPTER I


    # INTRODUCING LINQ


    Goals of this chapter:


    +   - Define “Language Integrated Query” (LINQ) and why it was built.

    - Define the various components that make up LINQ.

    - Demonstrate how LINQ improves existing code.


    This chapter introduces LINQ—from Microsoft’s design goals to how it improves
    the code we write for data access-based applications. By the end of this chapter,
    you will understand why LINQ was built, what components makeup the LINQ family,
    and LINQ’s advantages over previous technologies. And you get a chance to see
    the LINQ syntax at work while reviewing some before and after code makers.


    Although this book is primarily about LINQ to Objects, it is important to have
    an understanding of the full scope and goals of all LINQ technologies in order
    to make better design and coding decisions.


    # What Is LINQ?


    Language Integrated Query, or LINQ for short (pronounced “link”), is a set of
    Microsoft .NET Framework language enhancements and libraries built by Microsoft
    to make working with data (for example, a collection of in-memory objects, rows
    from a database table, or elements in an XML file) simpler and more intuitive.
    LINQ provides a layer of programming abstraction between .NET languages and an
    ever-growing number of underlying data sources.


    Why is this so inviting to developers? In general, although there are many existing
    programming interfaces to access and manipulate different sources of data, many
    of these interfaces use a specific language or syntax of their own. If applications
    access and manipulate data (as most do), LINQ allows developers to query data
    using similar C# (or Visual'
