- pgno: 250
  md: "```\nprivate static IEnumerable<IGroup<int, T>>\nSegmentIterator<T>n    IEnumerable<T>\
    \ source,\n    int segments)\n{\n    // calculate the number of elements per segment\n\
    \    int count = source.Count();\n    int perSegment = (int)Math.Ceiling(\n  \
    \      (decimal)count / segments);\n\n    // build the empty groups\n    Grouping<int,\
    \ T[]> groups =\n        new Grouping<int, T>([segments]);\n\n    for (int i =\
    \ 0; i < segments; i++)\n    {\n        Grouping<int, T> g =\n            new\
    \ Grouping<int, T>(perSegment);\n\n        g.key = i + 1;\n        groups[i] =\
    \ g;\n    }\n\n    // fill the groups and yield results\n    // when each group\
    \ is full.\n    int index = 0;\n    int segment = 1;\n    Grouping<int, T> group\
    \ = groups[0];\n    using (Enumerator<T> e = source.GetEnumerator())\n    {\n\
    \        while (e.MoveNext())\n        {\n            group.Add(e.Current);\n\
    \            index++;\n\n            // yield return when we have filled each\
    \ group\n            if ((segment < segments) &&\n                (index == perSegment))\n\
    \            {\n                yield return group;\n                index = 0;\n\
    \                segment++;\n                group = groups[segment - 1];\n  \
    \          }\n        }\n    }\n```"
