    in a second sequence. Cross joins in LINQ to Objects ironically aren''t

    implemented using either of the Join operators, but rather a clever use of

    t SelectMany operator. The query expression syntax will be familiar (not

    identical) to anyone with knowledge of standard SQL joins. In LINQ

    query expression syntax, you simply specify multiple from statements, as

    shown in the following code:'
