    # How to Use Grouping Results in the Same Query

    (Query Continuation)


    It is possible to use grouping results as a local variable within the query by
    appending the into clause after the group when using the query expression syntax
    (when using extension method syntax, you just continue your query from the result
    of the Groupby extension method). The into projects the grouping result into a
    local variable that you can reference throughout the rest of the query expression,
    giving you access to the key values and the grouped elements.


    The simplest form of query continuation using groups is for providing aggregation
    results within the query''s projection clause. Listing 4-9 demonstrates how to
    calculate various subtotals for a set of grouped data. This example aggregates
    the CallLog data introduced in Chapter 2 (Table 2-2) by first grouping by the
    call number; continuing the query with the into keyword; and then projecting subtotals,
    counts, and averages into an anonymous type. The Console results are shown in

    Output 4-6.'
