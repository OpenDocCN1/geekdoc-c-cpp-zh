    | InvariantCulture | Case-sensitive string comparison using the word comparison
    rules of the invariant culture. |

    | InvariantCultureIgnoreCase | Case-insensitive string comparison using the word
    comparison rules of the invariant culture. |

    | Ordinal | Case-sensitive ordinal string comparison. |

    | OrdinalIgnoreCase | Case-insensitive ordinal string comparison. |


    WHEN TO USE CURRENTCULTURE AND INVARIANTCULTURE addition to worrying about case-sensitive
    and case-insensitive string comparison, it is important to consider the culture
    sensitivity of the strings being compared and how the results of this comparison
    are displayed to the user.

    Microsoft has recommended guidelines on MSDN (see http://msdn.microsoft.com/en-us/library/kzcwbcsc.aspx),
    and these generally state that if the result of a sort is being displayed to an
    end user, culture-sensitive sorting (the built-in comparers starting with CurrentCulture)
    should be used (sorting items in a listbox for example). Culture-insensitive comparison
    (the built-in comparers starting with InvariantCulture) should be used when comparing
    strings internally, and the result of string comparison should not depend on the
    end user''s culture settings, for example when comparing XML tokens in a file
    with those needed for processing in an application.


