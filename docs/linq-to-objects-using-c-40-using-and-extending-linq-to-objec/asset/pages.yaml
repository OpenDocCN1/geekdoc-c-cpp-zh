- pgno: 255
  md: 'LINQ in C# 3.0, dynamic types in C# 4.0. The major features added in each release
    are generally considered to be the following:


    +   - C# 2.0—Generics (.NET Framework support was added, and C# benefited from
    this); iterator pattern (the yield keyword); anonymous methods (the delegate keyword),
    nullable types, and the null coalescing operator (??).


    +   - C# 3.0—Anonymous types, extension methods, object initializers, collection
    initializers, implicitly typed local variables (var keyword), lambda expressions
    (=>), and the LINQ query expression pattern.


    +   - C# 4.0—Optional Parameters and Named Arguments, Dynamic typing (dynamic
    type), improved COM-Interop, and Contra and Co-Variance.


    The new features in C# 3.0 that launched language support can be found in Chapter
    2, "Introducing LINQ to Objects," and this chapter documents each of the major
    new features in C# 4.0 from the perspective of how they impact the LINQ story.


    # Optional Parameters and Named Arguments


    A long-requested feature for C# was to allow for method parameters to be optional.
    Two closely related features in C# 4.0 fulfill this role and enable us to omit
    arguments that have a defined default value when calling a method, and to pass
    arguments by name rather than position when calling a method.


    OPTIONAL PARAMETERS OR OPTIONAL ARGUMENTS? Optional parameters and named arguments
    are sometimes called optional arguments and named arguments. These names are used
    interchangeably in this book, and in most literature, including the C# 4.0 specification
    that uses both, sometimes in the same section. I use "argument" when referring
    to a value passed in from a method call and "parameter" when referring to the
    method signature.


    The main benefit of these features is to improve COM-Interop programming (which
    is covered shortly) and to reduce the number of method overloads created to support
    a wide range of parameter overloads. It is'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'common programming pattern to have a master method signature containing all
    parameters (with the actual implementation) chained to a number of overloaded
    methods that have a lesser parameter set calling the master method with hard-coded
    default values. This common programming pattern becomes unnecessary when optional
    parameters are used in the definition of the aforementioned master method signature,
    arguably improving code readability and debugging reducing clutter. (See Listing
    8-2 for an example of the old and new way to create multiple overloads.)


    There has been fierce debate on these features on various email lists and blogs.
    Some C# users believe that these features are not necessary and introduce uncertainty
    in versioning. For example if version 2 of assembly changes a default parameter
    value for a particular method, client code that was assuming a specific default
    might break. This is true, but the existing chained method call patterns suffers
    from a similar issue—default values are coded into a library or application somewhere,
    so thinking about when and how to handle these hard-coded defaults would be necessary
    using either the existing chained method pattern or the new optional parameters
    and named arguments. Given that optional parameters were left out of the original
    C# implementation (even when the .NET Runtime had support VB.NET utilized this
    feature), we must speculate that although this feature is unnecessary for general
    programming, coding COMInterop libraries without this feature is unpleasant and
    at times infuriating—hence, optional parameters and specifying arguments by name
    have made its way into the language.


    COM-Interop code has always suffered due to C#''s inability to handle optional
    parameters as a concept. Many Microsoft Office Component Object Model (COM) libraries,
    like those built to automate Excel or Word for instance, have method signatures
    that contain 25 optional parameters. Previously you had no choice but to pass
    dummy arguments until you reached the "one" you wanted and then fill in the remaining
    arguments until you had fulfilled all 25. Optional parameters and named arguments
    solve this madness, making coding against COM interfaces much easier and cleaner.
    The code shown in Listing 8-1 demonstrates the before and after syntax of a simple
    Excel COM-Interop call to open an Excel spreadsheet. It shows how much cleaner
    this type of code can be written when using C# 4.0 versus any of its predecessors.'
