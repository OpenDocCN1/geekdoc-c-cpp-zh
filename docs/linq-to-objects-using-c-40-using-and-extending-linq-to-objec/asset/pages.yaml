- pgno: 195
  md: 'The decision of how to approach a set-based task depends on problem specifics,
    but in general the strengths of each can be described in the following ways:


    Use HashSet and its operators when


    +   - Duplicate items are not allowed in the collections.

    - Modifying the original collection is desired. These operators allow changes
    to the original collection.


    Use LINQ Operators when


    +   - Duplicate items are allowed in the collections.

    - When returning a new IEnumerable<T> is desired rather than modifying the original
    collection.


    # The LINQ Set Operators


    LINQ to Objects has standard query operators for working on sets of elements within
    collections. These operators allow two different collections (containing the same
    types of elements) to be merged into a single collection using various methods.


    The set operators all implement a deferred execution pattern, simply meaning that
    they do not evaluate the next element until they are iterated over one element
    at a time. Each operator is detailed in this section, including the method signatures
    for each operator.


    # Concat Operator


    Concat combines the contents of two collections. It operates by looping over the
    first collection yielding each element, looping over the second collection yielding
    each element. If returning the duplicate elements is not the desired behavior,
    consider using the Union operator instead. An ArgumentNullException is thrown
    if either collection is null when this operator is called.


    Concat has a single overload with the following method signature:


    ```

    // Combines the contents of two collections.

    // Returns all elements from the first collection,

    ```'
