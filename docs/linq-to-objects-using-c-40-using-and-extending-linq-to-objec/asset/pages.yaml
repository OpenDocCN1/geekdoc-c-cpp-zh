    \ that implements IEnumerable<T> and return a single element from collection.\
    \ The built-in standard query operators First, Last and ElementAt are examples\
    \ of this category of operator, returning the first element, the last element,\
    \ or the element at a given index position, respectively.\n\nUnderstanding how\
    \ Microsoft constructed the standard query operators is the first step to understanding\
    \ how to write custom operators. To explore Microsoft's approach to operator construction,\
    \ let's build our own version of the Last operator before moving onto building\
    \ a more complex operator.\n\n# Building Our Own Last Operator\n\nTo learn how\
    \ to build an operator that returns a single element, let's first look at how\
    \ the built-in standard query operator Last is implemented. The shortest-compilable\
    \ implementation for the Last operator is shown in Listing 7-1.\n\n**Listing 7-1**\
    \ Shortest compilable Last operator implementation\n\n```\npublic static T Last<T>(\n\
    \    IEnumerable<T> source)\n{\n    using (IEnumerator<T> enumerator = source.GetEnumerator())\n\
    \    {\n        if (enumerator.MoveNext())\n        {\n            T current;\n\
    \            do\n            {\n                current = enumerator.Current;\n\
    \            }\n            while (enumerator.MoveNext());\n        }\n    }\n\
    ```"
