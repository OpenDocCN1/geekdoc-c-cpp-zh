  md: 'lookup a single record (our second scenario). Each join type is measured with
    the collection sizes ranging from 1, 5, 50, and 100 elements for each collection.


    Conclusions can be drawn from these simple experiments:


    +   - Use the ToLookup syntax for all one-to-many scenarios, unless the inner
    query is complex and easier to achieve with a subquery.

    - The join/into syntax is slower than the other techniques and should only be
    used with small inner sequence counts (it gets superior as inner sequence sizes
    grows) or when aggregation operators are going to be used over the join result.

    - Use a relational database system for large volume join operations where possible.


    # Summary


    LINQ to Objects offers a variety of features that support grouping and joining
    multiple sources of data. Although much of the syntax is borrowed from the relational
    database world, it is important to understand the performance profile when working
    with larger sequence sizes. Whenever possible, leave grouping and joining of large
    datasets to a relational database (after all, that is what they are intended to
    be used for); however, once these results are returned in-memory, feel free to
    use the power of LINQ to Objects’ suite of grouping and joining functionality
    to refine the result.'
