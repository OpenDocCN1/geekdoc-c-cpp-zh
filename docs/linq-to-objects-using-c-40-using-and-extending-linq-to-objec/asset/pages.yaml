  md: 'member name or method name does not exist. This static typing allows for very
    rigorous error checking during compile time, and generally improves code performance
    because the compiler can make targeted optimizations based on exact member name
    and method name resolution. Dynamic-typed languages on the other hand enable member
    and method lookups to be carried out at runtime, rather than compile time. Why
    is this good? The main identifiable reason is that this allows code to locate
    members and methods dynamically at runtime and handle additions without requiring
    a recompile of one system or another.


    I''m going to out the religious debate as to which is better. I believe there
    are positives and negatives in both approaches, and C# 4.0 allows you to make
    the choice depending on the coding problem you need to solve. Dynamic typing allows
    very clean coding patterns to be realized, as you will see in an upcoming example,
    where we code the names in a CSV file without the need for generating a backing
    class for every different CSV file format that might need to be read.


    # Using Dynamic Types


    When a variable is defined with the type dynamic, the compiler ignores the call
    far as traditional error checking is concerned and instead stores away the specifics
    of the action for the executing runtime process to a later time (at execution
    time). Essentially, you can write whatever method calls (with whatever parameters),
    indexers, and properties you want on a dynamic object, and the compiler will not
    complain. These actions are picked up at runtime and executed according to how
    the dynamic type''s binder determines it appropriate.


    A binder is the code that gets the payload for an action on a dynamic instance
    type at runtime and resolves it into some action. Within the C# language, there
    are two paths code can take at this point, depending on the binding being used
    (the binding is determined from the actual type of the dynamic instance):


    +   - The dynamic type does not implement IDynamicMetaObjectProvider interface.
    In this case, the runtime uses reflection and its traditional method lookup and
    overload resolution logic before immediately executing the actions.


    +   - The dynamic type implements the IDynamicMetaObjectProvider interface, by
    either implementing this interface by hand or inheriting'
