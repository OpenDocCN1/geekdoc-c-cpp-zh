  md: 'ThenBy operators, of which there can be zero or many depending on how much
    control you want over the subsorting when multiple elements share equal order
    after the previous expressions.


    The following examples demonstrate sorting a source sequence first by the [w]
    key, then in descending order by the [x] key, and then in ascending order by the
    [y] key:


    ```

    [source].OrderBy([w])

    ThenByDescending([x])

    ThenBy([y]);

    ```


    When using the query expression syntax, each sorting key and the optional direction
    keyword needs to be separated by a comma character. If the descending or ascending
    direction keywords are not specified, LINQ assumes ascending order.


    ```

    from [v] in [source]

    orderBy [w], [x] descending, [y]

    select [z];

    ```


    The result from ordering a collection will be an IEnumerable<T>, which implements
    IEnumerable<T> to allow further query operations to be cascaded end-to-end.

    The ordering extension methods are implemented using a basic but efficient Quicksort
    algorithm (see http://en.wikipedia.org/wiki/Quicksort for further explanation
    of how this algorithm works). The implementation LINQ to Objects uses a sorting
    type called unstable, which simply means that elements that compare to equal key
    values may not retain their relative positions to the source collections (although
    this is simply solved by cascading the result into a ThenBy or ThenByDescending
    operator). The algorithm is fairly fast, and it lends itself to parallelization,
    which is certainly leveraged by Microsoft''s investment in Parallel LINQ.


    # What Is Parallelization?


    Parallelization refers to improving performance of applications by fully leveraging
    multiple processors and multiple-cores on those processors running code. Parallelization
    is detailed in Chapter 9, "Parallel LINQ to Objects," which also demonstrates
    how LINQ queries can benefit from multicore and multiprocessor hardware improvements.'
