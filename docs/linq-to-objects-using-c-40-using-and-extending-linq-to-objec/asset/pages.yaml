- pgno: 160
  md: "# CONVERSION OPERATORS—CHANGING TYPES 139\n\nNOTE One confusing aspect of using\
    \ theDictionary operator is the reversal of the generic type definition between\
    \ the operator (element type and then key type) and the Dictionary type (key type\
    \ and then element type). You will notice in the example shown in Listing 5-10,\
    \ that the Dictionary is defined as Dictionary<string, Contact> and the Dictionary\
    \ operator as ToDictionary<Contact, string>. It makes sense from the method declaration\
    \ perspective (source type always comes first and then the return type), it just\
    \ needs to be remembered. This is often a source of confusion when learning to\
    \ use this operator.\n\nTheToDictionary operator isn't limited to projecting the\
    \ elements as their own type. Passing in an element selection function allows\
    \ the value held in the Dictionary against a key to be any type. The example shown\
    \ in Listing 5-11 projects the elements to an anonymous type and uses case-insensitive\
    \ comparison to ensure that keys are absolutely unique (not just different by\
    \ character casing), using the built-in static string comparison instances (creating\
    \ IEqualityComparers is covered in Chapter 4 in the \"Specifying Your Own Key\
    \ Comparison Function\" section and in Chapter 6 under \"Custom EqualityComparers\
    \ When Using LINQ Set Operators\")\n\nListing 5-11 TheDictionary operator also\
    \ accepts a custom equality comparer and element projection expression\n\n```\n\
    List<Contact> contacts = Contact.SampleData();\n\n// materialize DOB values into\
    \ a Dictionary\n// case-insensitive key comparison\nDictionary<string, DateTime>\
    \ dictionary =\ncontacts.ToDictionary<Contact, string, DateTime>(\n c => c.LastName\
    \ + c.FirstName,\n e => e.DateOfBirth,\n StringComparer.CurrentIgnoreCaseCase);\n\
    ```\n\n```\n// dictionary contains only DOB value in elements\nDateTime dob =\
    \ dictionary[\"Kamph\" + \"Mack\"];\n```\n\n```\nConsole.WriteLine(\"Kamph DOB\
    \ = {0}, dob);\n```"
