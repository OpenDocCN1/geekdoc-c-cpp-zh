- pgno: 282
  md: '# CHAPTER 9


    # PARALLEL LINQ TO OBJECTS


    Goals of this chapter:


    +   - Discuss the drivers for parallel programming, and how Parallel LINQ fits
    that story.

    - Demonstrate how to turn sequential queries into parallel queries using Parallel
    LINQ.

    - Demonstrate how to create a custom parallel operator.


    This chapter introduces Parallel LINQ to Objects. PLINQ introduces data parallelism
    into LINQ queries, giving a performance boost on multi-core and multiprocessor
    machines while making the results predictable and correct. This chapter also demonstrates
    how to build your own parallel operator.


    # Parallel Programming Drivers


    Microsoft has invested heavily in .NET Framework 4 and Visual Studio 2010 to allow
    all developers to safely and easily embrace parallel programming concepts within
    applications. The main driver for the Parallel Programming model is simply that
    the era of massive doubling and doubling of processor speed is apparently over,
    and therefore, the era of our code automatically doubling in speed as hardware
    improves is also coming an end. This breakdown in Moore''s Law (proposed by an
    Intel executive that predicted a doubling of CPU processor speed every two years),
    as it is commonly known, was brought to a screeching halt due to thermal and power
    constraints within the heart of a PC in the silicon processor that executes programs.
    To counter this roadblock and allow to computing speed to continue to scale, processor
    manufacturers and computer hardware designers have simply added more than one
    processor into the hardware that runs code.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'However, not all programming techniques, languages, compilers, or developers
    for that matter automatically scale to writing multiple core compatible code.
    This leaves a lot of unused processing power on the table—CPU processing power
    that could improve responsiveness and user experience of applications.


    Microsoft’s MSDN Magazine published an article titled "Paradigm Shift—Design Considerations
    for Parallel Programming" by David Callahan, which offers Microsoft’s insight
    regarding the drivers and approach Microsoft is taking in response to the need
    for parallel programming. It begins by setting the scene:


    +   ...today, performance is improved by the addition of processors.

    -called multicore systems are now ubiquitous. Of the course, the multicore approach
    improves performance only when software can perform multiple activities at the
    same time. Functions that perform perfectly well using sequential techniques must
    be written to allow multiple processors to be used if they are to realize the
    performance gains promised by the multiprocessor machines.


    And concludes with the call to action:


    The shift to parallelism is an inflection point for the software industry where
    new techniques must be adopted. Developers must embrace parallelism for those
    portions of their applications that are time sensitive today or that are expected
    to run on larger data sets tomorrow.


    The main take-away regarding parallel programming drivers is that there is no
    more free application performance boost just because of hardware CPU speed upgrade;
    for applications to run faster in the future, programming techniques that support
    multiple processors (and cores) need to be the standard approach. The techniques
    employed must also not be limited in how many CPU cores the code was originally
    authored from. The application needs to detect and automatically embrace the available
    cores on the executing hardware (which will likely be orders of magnitude larger
    in processing power) whether that be 2 cores or 64 cores. Code must be authored
    in a way that can scale accordingly without specifically compiled versions.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# History of Processor Speed and Multicore Processors


    Looking back at processor history, there was a 1GHz speed processor in 2000, which
    doubled in 2001 to 2GHz, and topped 3GHz in 2002; however, it has been a long
    hiatus from seeing processor speed increasing at that rate. In 2008 processor
    clock speeds were only just approaching 4GHz. In fact, when clock speed stopped
    increasing, so did manufacturer marketing the speed of processors; speed was replaced
    by various measures of instructions per second. Power consumption, heat dissipation,
    and memory latency are just some of the plethora of limiting factors pure CPU
    clock-speed increases. Another technique for improving CPU performance had to
    be found in order to keep pace with consumer demand.


    The limit of pure clock-speed scaling wasn''t a surprise to this industry as a
    whole, and Intel engineers, who first published an article in the October 1989
    issue of IEEE Spectrum (“Microprocessors to improve Circ 2000”) predicted the
    use of multicore processor architecture to improve the end-user experience when
    using PCs. Intel delivered on their promise in 2005, as competing processor companies,
    and it is almost certain that any computer bought today has multiple cores built
    into each microprocessor chip, and for the lucky few, multiple microprocessor
    chips built into the motherboard.


    Rather than straight improvement in processor clock speed, there are now more
    processor cores to do the work. Intel in their white "Intel-Core Processor Architecture
    Development Background" clearly defines in an understandable way "multicore processors"
    consists of:


    Explained most simply, multi-core processor architecture entails silicon design
    engineers placing two or more Intel Pentium processor-based “execution cores,”
    or computational engines, within a single processor. This multi-core processor
    plugs directly into a single processor socket, but the operating system perceives
    each of its execution cores as a discrete logical processor with all the associated
    execution resources.


    The idea behind this implementation of the chip''s internal architecture is in
    essence a "divide and conquer" strategy. In other words, by divvying up the computational
    work performed by the single Pentium microprocessor core in spreading it over
    multiple execution cores, a multi-core processor can perform more work within
    a given clock cycle. Thus,'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 264 CHAPTER 9 PARALLEL LINQ TO OBJECTS


    it is designed to deliver a better overall user experience. To enable this improvement,
    the software running on the platform must be written so that it can spread its
    workload across multiple cores. This functionality is called thread-level parallelism
    or "threading." Applications and operating systems (such as Microsoft Windows
    XP) that are written to support it are referred to as "threaded" or "multi-threaded."


    The final sentence of this quote is important: "Applications and operating systems...that
    are written to support it..." Although the operating system running code almost
    certainly supports multi-threading, not all applications are coded in a fashion
    that fully exploits that ability. In fact, the current use of multi-threading
    in applications is to improve the perceived performance of an application, rather
    than actual performance in most cases—a subtle distinction to be explored shortly.


    # Cores Versus Processors Versus CPUs


    The operating system running on your PC (or server) explores all cores in physical
    processors it has available to—aggregating these as a total number of available
    CPUs. An example is that if a 4-processor machine is running 4-core processors,
    it will show in the operating system as 16 CPUs. (Multiply the number of physical
    processors by the number of cores in each processor.) Sixteen CPUs is now common
    in server machines, and the number of CPUs is increasing due to both increased
    physical socket and core count growth. Expect 32, 64, or even 128+ CPU machines
    to be available at a commercial level now and a consumer level shortly.


    # Multi-Threading Versus Code Parallelism


    Multi-threading is about programming a specific number of threads to deal with
    specific operations. Parallel programming is detecting the number of processors
    and splitting the work of a particular operation across those known CPUs (processor
    times). Splitting work in applications across multiple threads introduces a form
    of concurrency into applications; however, multi-threading doesn''t natively offer
    computational performance'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# MULTI-THREADING VERSUS CODE PARALLELISM 265


    improvement (in most cases) and comes at a high price in code complexity- ty when
    built using current programming paradigms.

    The parallel programming goal is to make sure applications take advantage of multiple
    cores for improving computational performance and continue to improve performance
    as more cores are added over time. This doesn''t simply occur by making applications
    multi-threaded. In fact, badly implemented threading code can hurt performance.
    True code parallelism offers the same benefits as multi-threading offers, in a
    way that aims to improve computational performance of applications, whilst safeguarding
    against common concurrency defects and issues.


    Pure multi-threading is most commonly used to improve the perception of performance
    in an application. The classic example is for common web browser applications;
    browsers like Internet Explorer, Firefox, Safari all download and display the
    pages'' HTML content first, while behind the scenes they are gathering and progressively
    displaying images as they download over time. Why? If it took 15 seconds to download
    an entire page and images, blocking the user interface from accepting a response
    until it is complete, users would feel (deservedly) unsatisfied. Launching the
    retrieval of images on a separate background thread keeps the user-interface thread
    available for other user-input—“Cancel, I made a mistake” or “Changed my mind,
    go here instead” as examples.


    Building applications with the snappiness multi-threading concepts is addictive,
    although it is often difficult to synchronize access to shared resources like
    the user''s input or in-memory data. The permutations of what thread finishes
    and starts before another and the difficulty of debugging these defects leads
    to many abandoned attempts at improving perceived performance. Comprehending how
    to do even the most simple multi-threading task without spending hours finding
    crashes and application freezes is challenging and very time-consuming and mentally
    taxing.(These types of defects are race conditions, the cause of many famous software
    production problems, including the North American Blackout of 2003, which was
    partially attributed to a software application race condition.)


    The following are some problems with using threading alone for:


    +   - Complex to write—Race conditions are hard to envision and debug.

    - The correct number of threads is best equal to the number of CPUs—However, this
    changes from machine to machine. How do I spread the work required across multiple
    threads? How many threads are optimal?'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# What Is a Race Condition?


    Wikipedia has the best explanation I''ve found to explain what a race condition
    is to a "manager#".


    Applications can run at different speeds on different computer systems or different
    situations (i.e., variations in Internet performance or processor loading), which
    may cause the application to crash randomly on some systems and never on others.
    The unpredictable nature of an intermittent bug caused by a race condition is
    a frequent source of frustration within the profession of software development.
    Example: A horse represents the computer application. Each horse represents a
    specific element in the application, which are all running in parallel, as user
    interface graphics versus communications running concurrently. The software may
    require that a specific horse must win the race in the application to run properly.
    The application may work flawlessly if #5 finishes first, while the application
    crashes if the wrong horse finishes the race. One possible solution to this problem
    is to add synchronization to guarantee that horse #5 finishes before #2. Metaphorically,
    this is similar to jockey #2 and #5 teaming up to #5 run ahead of #2.


    +   - If not all work takes equal time to run?— CPUs idle when they could be taking
    on work overloading another CPU.


    +   - Threads are heavy—Threads take memory and time to set up, manage, and teardown.
    Create too many of them and applications can exhaust available resources. Threads
    are allocated 1MB of memory by default by the CLR, not the sort of overhead you
    blind-want to assign. (See blog posting on the issue by Joe Duffy.,7)


    The underpinnings for all parallelism features, including the parallel extensions
    and Parallel LINQ, are threads. However, these libraries abstract away the direct
    manipulation of threading and give developers an easier interface to code. The
    Task Parallel Library and Parallel LINQ reusable libraries allow a lighter-weight
    way of scheduling work and having that work efficiently executed across multiple
    CPUs. Microsoft has retained all of the benefits introduced through multi-threading
    applications but solved the problems working at the CPU''s level.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Application multi-threading advantages:


    +   - Maintaining application UI responsiveness during long-running processes.

    - Allows multiple requests or processes to be handled in relative isolation, that
    is, each input web request can be handled by a server on a different thread in
    isolation; if one fails, the others continue to function.

    - Offload work can occur in the background—priority allows many applications to
    coexist sharing the available resources.


    # Application parallelism advantages:


    +   - Same advantages as multi-threading offers.

    - Computational performance is improved.

    - Performance scales as more cores/processors are added without explicit user
    code to specify the hardware configuration.


    Hopefully, you will see that multi-threading underpins all parallel programming
    techniques because it is the technology supported at a process level. However,
    the perils (covered shortly) and complexity of actually utilizing threading time,
    to reduce processing time, requires clever coding practices. Microsoft''s Parallelism
    Extensions offer an approachable on-ramp for parallelizing general application
    code and goes a long way to addressing the common obstacles that surface when
    writing parallel applications.


    # Parallelism Expectations, Hindrances, and Blockers


    Parallel program performance isn''t always a linear scaling based on the number
    of CPU cores, as will be shown shortly through examples. (Doubling the number
    of cores doesn''t halve the execution time.) There are many factors that contribute
    to supporting and hindering performance improvements using parallel programming
    techniques. It is important to understand these hindrances and blockers in order
    to leverage the full power of the toolset provided and to know when to invoke
    its power.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Amdahl’s Law—You Will Still Be as Slow as the Longest Sequential Part


    Amdahl''s Law defines the fundamental maximum performance improvement that can
    be expected for parallel computing. Amdahl''s Law models the performance gain
    of a parallel implementation over its sequential counterpart. It simply states
    that the maximum parallel performance improvement is limited by the time needed
    by any sequential part of an algorithm or program.


    Amdahl''s formula is 1 / ((1-P) + (P/Speedup))


    (P = proportion supporting parallelization, Speedup = 2 for two CPUs, etc.)


    It seems reasonable to determine that if a sequential program was spread across
    two cores, the maximum performance gain would be 2x. However, in reality, not
    all of the program can run in parallel, and the actual performance gain will be
    lower than 2x. How much lower? That depends on how much of the algorithm supports
    parallelization. If a sequential algorithm implementation takes one second, and
    20% of the program is written to support parallel execution on a dual-core machine
    (2 CPUs), the maximum performance boost from parallelization would be 1 / ((1-0.2)
    + (0.2/2)) = 1.11 times improvement.


    Amdahl''s Law is handy to put correct expectations around the benefit and time
    spent when optimizing an application. The code you write to support parallelization
    (and therefore decrease the amount of sequential time), the closer to the theoretical
    maximum speedup you approach. If you want to read more, seek John L. Gustafson''s
    article that lists the shortcomings and reevaluation of Amdahl''s Law with respect
    to massively parallel systems, like those becoming available now at http://www.scl.ameslab.gov/Publications/Gust/AmdahlLaw/AmdahlLaw.html.


    The key point is to fully embrace parallelization and achieve closer performance
    gains to the theoretical best possible performance (doubling for two processors,
    quadrupling for four, and so on), the algorithm and work partitioning should be
    designed to limit the sequential time required for a program.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Parallel Overhead—Finding the Ideal Work Partition Size


    There is overhead in running an application across multiple CPUs. Some work is
    involved in forking, merging, and managing the partitioning of work that each
    thread (and eventually CPU) will execute. It should make sense that if the work
    being performed in parallel takes less time than the overhead of making that code
    execute in parallel, then the code will take longer to execute.


    There is art in understanding what granularity work should be partitioned. Too
    small and you will actually harm performance; too big and you are not taking advantage
    of scheduling tasks across multiple CPUs. There is no substitute for testing performance
    tradeoffs using different granularity of work partitioning.


    The key point is that parallelism doesn''t come completely free; there is a sweet-spot
    for work partition size, and this needs to be considered when writing parallelized
    code. Testing and profiling is the only way to ensure the work time is more than
    the overhead for parallelizing as work.


    # Synchronization—Parallel Partitions Working as a Team


    Sometimes code running on one CPU needs to access data from another. This synchronization
    harms performance because the object needed has to be locked, and other parallel
    execution paths might need to wait for that lock to be removed before they can
    proceed, so it gets very hard to predict actual performance gains.


    The best possible performance can be achieved when tasks are performed in parallel
    have no shared data; they are completely isolated, and no synchronization locks
    are needed. This takes careful design and sometimes creating parallel work at
    a different granularity or changing your algorithm approach in such a way that
    the only synchronization needs to occur at the completion of the task (rather
    than throughout).


    The key point is to keep parallel tasks as autonomous and self-contained as possible.
    Any external synchronization will reduce performance or introduce hard-to-debug
    race conditions.'
  merge: -1
