  md: '# LINQ DATA PARALLELISM 275


    is much more balanced and even throughout the query''s execution, not perfectly
    even but far superior to the sequential version. Although the query didnt run
    twice as fast (as might be expected on a dual-core machine), the speed improvement
    is significant and was solely achieve by adding .AsParallel() to the sequential
    query.


    Failing short of the perfect doubling of performance in this case is due to the
    constraints spoken about earlier (Amdahl''s Law, ordering, and so on); there is
    overhead in managing the parallelization process and sorting and is to a large
    degree limited by the disk access speed. It is important to realize that if this
    same test had been run on a quad-core processor, the results would have been closer
    to a four times increase in performance with no additional code changes. (Although
    never exceeding, and who knows when your hard-drive access speed limits improvement,
    the key point is no code changes are required to take advantage of more cores).


    Having seen this example, understanding what actually occurred behind the scenes
    to parallelize a LINQ helps you realize what queries will be substantially improved
    by adding the AsParallel extension to a data source and what queries will actually
    degrade in performance.


    # What Happens During a Parallel LINQ Query?


    The general parallelization process for a query is to partition the work, hand
    off the work to worker processes running on different threads, and merge the results
    on completion. To achieve this general process, a query marked to execute as parallel
    goes through the following (much simplified here for clarity) process by the Parallel
    LINQ runtime:


    +   1. Query analysis (Will parallelism help?)

    2. Partitioning

    3. Parallel execution

    4. Merging the parallel results


    Each of these steps is covered briefly here in order to help you understand how
    queries might be structured for best parallel performance.


    # Query Analysis


    The first step when a LINQ query is passed to the Parallel LINQ execution engine
    is query analysis. The query pattern is examined to determine if it is a candidate
    for parallelization improvement with respect to time and memory resources. If
    it isn''t, then the query will be executed sequentially.'
