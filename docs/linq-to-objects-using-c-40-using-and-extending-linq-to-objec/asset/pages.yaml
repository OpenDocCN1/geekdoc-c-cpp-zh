  md: '# 246 CHAPTER B C# 4.0 FEATURES


    WHEN TO USE VAR AND DYNAMIC TYPE DECLARATIONS It might seem confusing as to which
    type definition should be used based on circumstance. Here are my recommendations:


    **Concrete type**—Use whenever you know the type at coding time. If you know the
    type when defining a field, property, or return type—use it!


    **The var keyword**—Use this when declaring an anonymous type or when capturing
    the result of a LINQ query projecting to an anonymous type.


    **The dynamic keyword**—Use only when declaring a dynamic type, generally meaning
    a type that implements IDynamicMetaObjectProvider. These can be custom types or
    one of the run-time binders provided by Microsoft for COM-Interop that interoperate
    with dynamic languages like IronPython and IronRuby. Declaring types that do not
    implement this interface incurs an overhead at runtime.


    Specific binders are written to support specific purposes. IronRuby, IronPython,
    and COM-Interop are just a few of the bindings available to support dynamic language
    behavior from within C# 4.0. However, you can write your own and consume these
    types in order to solve some common coding problems, as you will see shortly in
    an example in which text file data is exposed using a custom dynamic type and
    this data is used as the source of a LINQ to Objects query.


    # Using Dynamic Types in LINQ Queries


    Initially you might be disappointed to learn that dynamic types aren''t supported
    in LINQ. LINQ relies exclusively on extension methods to carry out each expression
    operation. Extension methods cannot be resolved at runtime due to the lack of
    information in the compiled assembly. Extension methods are introduced into scope
    by adding the assembly containing the extension into scope via a using clause,
    which is available at compile time for method resolutions, but not available at
    runtime—hence no LINQ support. However, this only means you can''t define collection
    types as dynamic, but you can use dynamic types at the instance level (the types
    in the collections being queried), and you will see in this example.


    For this example we create a type that allows comma delimited text files to be
    read and queried in an elegant way, often useful when importing'
