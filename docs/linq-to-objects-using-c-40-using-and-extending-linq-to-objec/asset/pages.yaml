- pgno: 48
  md: '# LINQ ENABLING C# 3.0 LANGUAGE ENHANCEMENTS 27


    Lambda expressions are used when passing method-based arguments to any of the
    LINQ Query operators, like where for instance. A before and after example of how
    a where clause would need to be formatted with without the new syntax would be


    ```

    // C# 2.0 anonymous method syntax

    source.Where(delegate (Contact c) { return c.State == "WA"; });

    ```


    ```

    // C# 3.0 lambda expression syntax

    source.Where(c => c.State == "WA");

    ```


    Lambda expressions build upon the original anonymous method syntax by improving
    compile time inference (the compiler works out the types of the arguments in most
    cases, eliminating the need to specify the input argument parameter types) and
    simplifying the syntax by eliminating the delegate keyword and the return statement
    for Expression bodies.


    > NOTE Lambda expressions are generally single-expression delegates (only contain
    a single expression) when used with LINQ due to their limitation of not being
    convertible to expression trees. Anonymous methods can have multiple expressions
    and span multiple lines.


    Some more general forms of lambda expressions taking input arguments and specifying
    explicit types when necessary (the compiler often can infer the type without assistance)
    are


    ```

    () => [expression]

    ([parameter]) => [expression]

    ([param type [param]]) => [expression]

    (parameter1, parameter2) => [expression]

    ([param type][param], [param type][param2]) => [expression]

    ```


    Surrounding parentheses for lambdas with a single parameter are optional. Lambda
    expressions infer the parameter type and return types in most cases, but if the
    compiler cannot determine the types, you must explicitly type them by adding a
    type before the parameter identifier.


    ```

    n => n < 5

    (int n) => n < 5 (explicit parameter typing)

    n => n % 2 == 1 (true for odd numbers)

    (n, index) => n < index (multiple parameters)

    ```'
