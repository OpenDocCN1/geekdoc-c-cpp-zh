    allows control over what LINQ provider will be called and used extensively when
    choosing LINQ providers—most commonly at this time when choosing to execute part
    of a LINQ to SQL query in-memory rather than at the database. This technique is
    demonstrated in Chapter 9, where it is used to segment queries into sequential
    and parallel implementations.


