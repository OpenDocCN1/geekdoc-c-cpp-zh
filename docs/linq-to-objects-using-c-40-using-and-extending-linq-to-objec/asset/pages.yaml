- pgno: 310
  md: "# WRITING PARALLEL LINQ OPERATORS 289\n\n```\nvar q3 = source1.AsParallel().AsOrdered()\n\
    \    Concat(source2.AsParallel().AsOrdered());\n```\n\n# Writing Parallel LINQ\
    \ Operators\n\nConvention would dictate that whenever a sequential LINQ operator\
    \ is considered to support a parallel operator pattern users will come to expect\
    \ based on the support of the other standard query operator operators (not a definite\
    \ requirement, but should be considered). Not all operators will significantly\
    \ benefit from parallelization, and without an understanding of a specific operator,\
    \ it's hard to capture explicit guidance in this area. The following types of\
    \ operators make exceptionally good candidates for parallelization:\n\n+   - Order-independent\
    \ operators that iterate an entire source collection, for example, Where.\n- Mathematical\
    \ aggregate functions such as `Sum`.\n- Operators that can yield partial results\
    \ before the entire source collection has been processed by that operator (allowing\
    \ the next operator to begin before all data is furnished by the previous operator).\n\
    \nOther operator types could still benefit from parallel implementations, but\
    \ the overhead is high, and the linear scaling of performance versus number of\
    \ CPU cores will reduce.\n\n# Parallel Operator Strategy\n\nImplementing parallel\
    \ operators in a raw form can be challenging. At the lowest level, you can use\
    \ the Task Parallel Library as the basis for underlying algorithms, but you should\
    \ exhaust all other avenues for implementation first. Here is some general guidance\
    \ when attempting to build a parallel extension method operator:\n\n+   - Try\
    \ and compose your operator using the current Parallel LINQ operators.\n- Use\
    \ the aggregate extension method operator whenever possible (demonstrated shortly)."
