    \ the following form:\n\n```\npublic static IEnumerable<TResult>\nJoin<TOuter,\
    \ TInner, TKey, TResult(\nthis IEnumerable<TOuter> outer,\nIEnumerable<TInner>\
    \ inner,\nFunc<TOuter, TKey> outerKeySelector,\nFunc<TInner, TKey> innerKeySelector,\n\
