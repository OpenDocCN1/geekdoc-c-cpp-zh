  md: '# GROUPING AND JOINING DATA


    Goals of this chapter:


    +   - Define the capabilities of LINQ joining and grouping features.

    - Demonstrate grouping and joining data sources.

    - Discuss the best practices and pitfalls to avoid when grouping and joining data
    sources.


    The main goal of this chapter is to define the capabilities of LINQ Objects''
    extensive grouping and joining features. Best practices and the most likely pitfalls
    to be avoided when grouping and joining data sources are discussed. By the end
    of this chapter you will be well-versed in how to write queries that group input
    data into subcollections and how to join data in one collection with matching
    data from another.


    # How to Group Elements


    Grouping in LINQ enables you to return partitioned sets of data from a collection
    based on a given key value. An example might be to group all Contact records by
    the state property. In LINQ this query can be simply written


    ```

    var q = from c in contacts

    group c by c.State;

    ```


    Or if you prefer the extension method query syntax


    ```

    var q = contacts.GroupBy(c => c.State);

    ```


    The result from a LINQ grouping operation is an enumerable sequence of groups
    (themselves sequences), with each group having a'
