  md: "To understand how the Join operator works, the basic pseudo-code carries out\
    \ is as follows:\n\n+   1. Create a grouping on the inner sequence function value\
    \ for all elements that share the inner key selector function value (as determined\
    \ by the innerKeySelector argument). Call this list of groups lookup.\n2. Iterate\
    \ the outer sequence. Call each element item.\n   a. Create a grouping on the\
    \ lookup sequence for all elements that share the same outer-key selector function\
    \ value as this item (as determined by the outerKeySelector argument). If a comparator\
    \ argument is supplied, use this comparator to calculate the equality.\n   b.\
    \ If there are any items in this grouping result\n      i. Loop through all elements\
    \ in this group\n      ii. Yield the result returned by the result selector on\
    \ each element (using the resultSelector)\n\nThe returned sequence will be in\
    \ the order of the outer sequence elements, one record for each matching inner\
    \ element, followed by the outer element's records. Outer elements without matching\
    \ inner elements will be skipped. (I think you get that by now—this is an inner\
    \ join. If you want the unmatched elements, see the “Simulating Outer Joins—Getting\
    \ Unmatched Elements” section.)\n\nThe key selection expression for the outer\
    \ and inner sequence can be any expression that evaluates to a comparable type.\
    \ The equals operator (what is called when you do an evaluation) will determine\
    \ if the keys are equal or a custom EqualityComparator can be supplied to customize\
    \ this equality comparison in the same way a custom equality comparator was used\
    \ in the grouping examples earlier in this chapter. (See the “Specifying Your\
    \ Own Key Comparison Function” section.)\n\nFrom the final query select projection,\
    \ you have access to both sequences’ matching elements. The range variable can\
    \ be used for both the inner and outer records throughout the query and referenced\
    \ within the selection projection to create a new type or an anonymous type.\n\
    \n# One-to-One Join Using a Subquery\n\nA subquery in a queries Select projection\
    \ can achieve a one-to-one join. In testing, this option did not perform as well\
    \ as the alternatives and should only be considered for very small (less than\
    \ ten-element) sequence sizes. This technique simply looks up related data from\
    \ a second sequence with the first query’s select projection. Listing 4-14 demonstrates\
    \ the subquery technique, and the result is shown in Output 4-11."
