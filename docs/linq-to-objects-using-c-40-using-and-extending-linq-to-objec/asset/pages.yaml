  md: 'Basic.NET [VB.NET] language syntax independent of the source of that data.
    This means that nowadays different languages are used when querying data from
    different sources (Transact-SQL for Microsoft SQL Server development, XPath or
    XQuery for XML data, and code nested forit statements when querying in-memory
    collections), LINQ allows you to use C# (or VB.Net) in a consistent type-safe
    and compile-time syntax checked.


    One of Microsoft''s first public whitepapers on the LINQ technology,"LINQ Project
    Overview" authored by Don Box and Anders Hejlsberg, set the scene as to the problem
    they see and how they planned to solve that problem with LINQ.


    After two decades, the industry has reached a stable point in the evolution of
    object-oriented (OO) programming technologies. Programmers now take for granted
    features like classes, objects, and methods. In looking at the current and next
    generation of technologies it has become apparent that the next big challenge
    in programming technology is to reduce the complexity of accessing and integrating
    information that is not natively defined using OO technology. The two most common
    sources of non-OO information are relational databases and XML.


    Rather than add relational or XML-specific features to our programming languages
    and runtime, with the LINQ project we have taken a more general approach and are
    adding general purpose query facilities to the .NET Framework that apply to all
    sources of information, not just relational or XML data. This facility is called
    .NET Language Integrated Query (LINQ).


    We use the term integrated query to indicate that query is an integrated feature
    of the developer''s primary programming languages (e.g., C#, Visual Basic). Language
    integrated query allows query expressions to benefit from the rich metadata, compile-time
    syntax checking, static typing and IntelliSense that was previously available
    only to imperative code. Language integrated query also allows a single general-purpose
    declarative query facility to be applied to all in-memory information, not just
    information from external sources.


    A single sentence pitch describing the principles of LINQ is simple: LINQ normalizes
    language and syntax for writing queries against many sources, allowing developers
    to avoid having to learn and master many'
