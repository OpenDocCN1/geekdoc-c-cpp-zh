  md: '# AGGREGATION OPERATORS—WORKING WITH NUMBERS 125


    # Output 5-1


    Sum plus 100 = 106


    Simple aggregations are easy to understand. The seed and accumulator don''t have
    to be numeric types; they can be any type, including an array. Calculating the
    average for example needs two accumulated values to calculate a result in a single
    iteration of the source sequence. The general technique is to keep multiple values
    in an array and update these on each accumulation cycle. For example, to calculate
    the average of a sequence in a single pass, the code in Listing 5-2 can be used.


    Listing 5-2 Calculating the average of an integer array; this example demonstrates
    how to use the Aggregate operator with more than a single accumulator value


    ```

    var nums = new int[] { 1, 2, 3 };


    int count = 0;


    var avg = nums.Aggregate(


    0, // accumulator function for sum, initially 0


    // accumulator function.

    (acc, i) =>

    {

    count += 1; // running count

    acc += i; // running sum

    return acc;

    },


    // selector function, returns 0 when no elements

    acc => count > 0 ? acc / count : 0


    Console.WriteLine("Average = {0}", avg);

    ```'
