  md: '# CHAPTER 2


    # INTRODUCING LINQ TO OBJECTS


    Goals of this chapter:


    +   - Define the capabilities of LINQ to Objects.

    - Define the C# language enhancements that make LINQ possible.

    - Introduce the main features of LINQ to Objects through a brief overview.


    LINQ to Objects allows us to query in-memory collections and any type that implements
    the IEnumerable<T> interface. This chapter gives you a first real look at the
    language enhancements that support the LINQ story and introduces you to the main
    features of LINQ to Objects with a short overview. By the end of this chapter,
    the query syntax should be more familiar to you, and the following chapters bring
    you deeper into the query syntax and features.


    # LINQ Enabling C# 3.0 Language Enhancements


    Many new C# language constructs were added in version 3.0 to improve the general
    coding experience for developers. Almost all the C# features added relate in some
    way to the realization of an integrated query syntax within called LINQ.


    The features added in support of the LINQ syntax fall into two categories. The
    first is a set of compiler syntax additions that are shorthand for common constructs,
    and the second are features that alter the way method names are resolved during
    compilation. All these features, however, combine to allow a fluent query experience
    when working with structured data sources.


    To understand how LINQ to Object queries compile, it is necessary to have some
    understanding of the new language features. Although this chapter will only give
