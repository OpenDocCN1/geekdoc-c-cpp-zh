  md: '# STANDARD QUERY OPERATORS


    Goals of this chapter:


    +   - Introduce the standard query operators not covered so far.

    - Show examples for each operator to help in real world application.


    Up to this point, we have explored the main operators that filter, project, order,
    group, and join. This chapter introduces the remaining operators and demonstrates
    how they are used. By the end of this chapter (and Chapter 6, “Working with Set
    Data,” which details the set-based operators), you will have seen all of the standard
    query operators.


    # The Built-In Operators


    Microsoft .NET Framework 4 has 52 built-in standard query operators. These operators
    are in the System.Linq namespace and are made available in each class file by
    adding the following clause:


    ```

    using System.Linq;

    ```


    Many of the operators were discussed in Chapters 3 and 4. This chapter covers
    the remaining operators, except set-based operators, which are covered in Chapter
    6 (see Table 5-1 for a summary). These operators form the basis of most LINQ queries,
    and the remaining operators introduced in this chapter build on these capabilities
    to make more complex queries possible. Table 5-2 lists the standard query operators
    discussed in this chapter.'
