- pgno: 50
  md: "# Query Expressions\n\nQuery expressions are the feature where all of the previous\
    \ new language constructs merge, and their pivotal role in LINQ can be seen. The\
    \ following-is a brief overview; future chapters cover how to write query expressions\
    \ in detail, but for now focus on how the language enhancements combine into a\
    \ query language integrated into C#.\n\nQuery expressions are a language syntax\
    \ enhancement only; the query expression is mapped into a series of extension\
    \ method calls and then into a series of static method calls by the compiler (for\
    \ LINQ to Objects, LINQ provides such as LINQ to SQL do not operate this way—they\
    \ build to expression trees and are beyond the scope of this book). The advantage\
    \ of the query syntax however, is its clarity and how familiar it appears to anyone\
    \ who has worked in other query languages. Both query syntax styles and their\
    \ benefits and tradeoffs are covered in Chapter 3, “Writing Basic Queries,” and\
    \ throughout the rest of the book.\n\nListing 2-7 shows two functionally identical\
    \ LINQ queries; the first query1 uses the query expression language syntax, and\
    \ query2 uses pure extension method calls to compose the query. query1 makes use\
    \ of anonymous types (line 7), Object Initialization (line 9 and 10), and implicitly\
    \ typed local variables (line 5). The code shown in query2 is similar to how the\
    \ compiler converts the query syntax into extension method calls, and free-form\
    \ expressions throughout the query into lambda expressions is shown here to give\
    \ you a glimpse into how LINQ query syntax is decomposed into more traditional\
    \ code constructs. Lambda expressions can be seen where expressions were used\
    \ (lines 15 and 16), and you can also see extension methods taking the place of\
    \ the keywords where and select (lines 15 and 16).\n\n# Listing 2-7 Example query\
    \ expression showing the new language constructs in unison\n\n```\n// note: Person.SampleData()\
    \ returns a populated\n// List<Person> sample data collection.\n\n// LINQ Query\
    \ Expression Syntax\nvar query1 = from c in Person.SampleData()\n    where c.State\
    \ == \"WA\"\n    select new\n    (\n        Name = c.FirstName + \" \" + c.LastName,\n\
    \        State = c.State\n```"
