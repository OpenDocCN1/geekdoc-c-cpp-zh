- pgno: 247
  md: "# Building the Segment Operator\n\nTo demonstrate writing a grouping operator,\
    \ we will write an example operator called Segment. The Segment operator divides\
    \ the elements in a source sequence into equal-sized groups (equal element count)\
    \ where it can, except the last group if the elements can't be distributed equally.\n\
    The Segment operator has the following requirements:\n\n+   - To take any collection\
    \ implementing IEnumerable<T> as an input source and divide it into multiple groups\
    \ with the same number of elements.\n- If the number of elements doesn't allow\
    \ all groups to be equally sized, the last group and all other groups of equal\
    \ size should be reduced.\n- If there are more segments than elements, put one\
    \ element in as many as possible and return empty groups for the remaining.\n\
    - Each group should have a Key property with the sequential segment number that\
    \ is, 1 for the first group, 2 for the second, and so on.\n- Throw an ArgumentNullException\
    \ if the source sequence is null.\n- Throw an ArgumentOutOfRangeException if the\
    \ number of segments is zero or less than zero.\n\nA quick example of how the\
    \ Segment operator should work is shown in Listing 7-15. The Console output from\
    \ this example is shown in Output 2.\n\nListing 7-15 Calling the Segment operator\
    \ to divide a string array into five groups—see Output 2\n\n```\nstring[] elements\
    \ = new string[][\n    { \"A\", \"B\", \"C\", \"D\", \"E\", \"F\", \"G\", \"H\"\
    , \"I\", \"J\" };\n\nvar groups = elements.Segment(5);\n\nforeach (var g in groups)\n\
    {\n    Console.WriteLine(\"Group key: {0}\", g.Key);\n    foreach (var elm in\
    \ g)\n        Console.WriteLine(\" {0}\", elm);\n}\n```"
