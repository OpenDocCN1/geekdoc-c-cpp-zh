  md: '# ABOUT THE AUTHOR


    Troy Magennis is a Microsoft Visual C# MVP, an award given to industry participants
    who dedicate time and effort to educating others about the virtues of technology
    choices and industry application.


    A keen traveler, Troy currently works for Travelocity, which manages the travel
    and leisure websites travelocity.com, lastminute.com, and zuji. As vice president
    of Architecture, he leads a talented team of architects spread across four continents
    committed to being the traveler''s companion.


    Technology has always been a passion for Troy. After cutting his teeth on early
    8-bit personal computers (Vic20s, Commodore 64s), he moved into electronics engineering,
    which later led to positions in software application development and architecture
    for some of the most prominent corporations in automotive, banking, and online
    commerce.


