  md: '# 84 CHAPTER 4 GROUPING AND JOINING DATA


    The GetHashCode method is intended for use in hashing algorithms and data structures
    such as a hash table. The implementation of this method returns an integer value
    based on at least one value contained in the instance of an object. The resulting
    hash code can be used by other data structures as a unique value (but not guaranteed
    unique). It is intended as a quick way of segmenting instances in a collection
    or as a short-cut check for value equality (although a further check needs to
    be carried out for to be certain of object value equality). The algorithm that
    computes the hash code should return the same integer value when two instances
    of an object have the same values (in the data fields being checked), and it should
    be fast, given that this method will be called many times during the group-evaluation
    process.


    The following example demonstrates one possible use of a custom equality comparer
    function in implementing a simple Soundex comparison routine (http://en.wikipedia.org/wiki/Soundex
    for a full definition of the Soundex algorithm) that will group phonetically similar
    names. The code for the SoundexEqualityComparer is shown in Listing 4-5. Soundex
    is an ageold algorithm that computes a reliable four character string value based
    on the phonetics of a given word; an example would be "Katie" is phonetically
    identical to "Katy."


    The approach for building the Soundex equality operator is to


    +   1. Code the Soundex algorithm to return a four-character string representing
    phonetic sounding given a string input. The form of the Soundex code is a single
    character, followed by three numerical digits, for example A123 or V456.

    2. Implement the GetHashCode for a given string. This will call the Soundex method
    and then convert the Soundex code to an integer value. It builds the integer using
    the ASCII value of the character, multiplying it by 1000 and adding the three
    digit suffix of the Soundex code to this number, for example A123 would become,
    (65 * 1000) + 123 = 65123.

    3. Implement the Equals method by calling GetHashCode on both input x and y and
    then comparing the return integer results. Return true if the hash codes match
    (GetHashCode can be used in this implementation of overloading the Equals operator
    because it is known that the Soundex algorithm implementation returns a unique
    value—this is not the case with other GetHashCode implementations).'
