  md: "# CONVERSION OPERATORS—CHANGING TYPES\n\nthrown if a duplicate key insert is\
    \ attempted during the conversion process.\nA Dictionary collection allows efficient\
    \ access to elements based on key value, and converting a sequence to a dictionary\
    \ is a way of improving lookup performance if code frequently needs to find elements\
    \ by key value.\n\nThere are four method overloads of the ToDictionary operator.\
    \ The simplest overload takes only a delegate for determining the key selection\
    \ function, and the most complex takes a delegate for key selection, selection,\
    \ and an IComparer that is used for determining if key values are equal. When\
    \ the element selector function is not passed, the element type itself is used,\
    \ and when an IComparer<TSource>.Default is used. The method signatures available:\n\
    \n```\n// Creates a Dictionary of elements in a sequence\n// Key values returned\
    \ by the key selector\n// function must be unique, otherwise a\n// System.ArgumentException\
    \ will be thrown.\n// Uses EqualityComparer<TSource>.Default\n// to compare keys\
    \ for uniqueness.\npublic static Dictionary<TKey, TSource> ToDictionary<TSource,\
    \ TKey>(n    this IEnumerable<TSource, TKey> keySelector);\n```\n\n```\n// Creates\
    \ a Dictionary of elements in a sequence\n// and projects the elements to a new\
    \ type.\n// Key values returned by the key selector\n// function must be unique,\
    \ otherwise a\n// System.ArgumentException will be thrown.\n// Uses EqualityComparer<TSource>.Default\n\
    // to compare keys for uniqueness.\npublic static Dictionary<TKey, TElement> ToDictionary<TSource,\
    \ TElement>(\n    this IEnumerable<TSource, TKey> keySelector,\n    Func<TSource,\
    \ TElement> elementSelector);\n```\n\n```\n// Creates a Dictionary of elements\
    \ in a sequence\n// Key values returned by the key selector\n// function must\
    \ be unique, otherwise a\n// System.ArgumentException will be thrown.\n// Uses\
    \ the comparer to test for key uniqueness.\n```"
