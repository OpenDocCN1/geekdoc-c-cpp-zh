- pgno: 13
  md: '# PREFACE


    LINQ to Objects Using C# 4.0 takes a different approach to the subject of Language
    Integrated Query (LINQ). This book focuses on the LINQ syntax and working with
    in-memory collections rather than focusing on replacing other database technologies.
    The beauty of LINQ is that once you master the syntax and concepts behind how
    to compose clever queries, the underlying data source is mostly irrelevant. That''s
    not to say that technologies such as LINQ to SQL, LINQ to XML, and LINQ to Entities
    are un-important; they are just not covered in this book.


    Much of the material for this book was written during late 2006 when Language
    Integrated Query (LINQ) was in its earliest preview period. I was lucky enough
    to have a window of time to learn a new technology when LINQ came along. It became
    clear that beyond the clever data access abilities being demonstrated (DLNQ at
    the time, LINQ to SQL eventually), LINQ to Objects would have the most impact
    on the day-to-day developers'' life. Working with in-memory collections of data
    is one of the more common tasks performed, and looking through code in my previous
    projects made it clear how my for-loops and nested if-condition statements evolved.
    LINQ and the language enhancements proposed were going to change the look and
    feel of the way we programmed, and from where I was sitting that was fantastic.


    The initial exploration was published on HookedOnLINQ.com Wiki (102 pages at that
    time), and the traffic grew over the next year or two to a healthy level. Material
    could have been pulled together for a publication at that time (and be first to
    market with a book on this subject, something Addison-Wesley editor will probably
    never forgive me for), but I felt knowing the syntax and the raw operators wasn''t
    a book worth reading. It was critical to know how LINQ works in the real world
    and how to use it on real projects before I put that material into ink. The first
    round of books for any new programming technology often go slightly deeper than
    the online-documentation, and I wanted to wait and see how'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# PREFACE


    # iii


    the LINQ story unfolded in real-world applications and write the first book of
    the second-generation—the book that isn''t just reference, but has integrity that
    only real-world application can engrain.


    The LINQ story is a lot deeper and has wider impact than most people realize at
    first glance of TechEd session recording or user-group presentation. The ability
    to store and pass code as a data structure and to control when and how that code
    executes a powerful platform for working with all matter of data sources. The
    few LINQ providers shipped by Microsoft are just the start, and many more are
    built by the community through the extension points. After mastering the LINQ
    syntax and understanding the operators'' use (and how to avoid misuse), any developer
    can work more effectively and write cleaner code. This is the purpose of this
    book: assist the reader in beginning the journey, to introduce how to use LINQ
    for more real-world examples and to dive a little deeper than most books on the
    subject, to explore the performance benefits of one solution over another, and
    to deeply look how to create operators for any specific purpose.


    I hope you agree after reading this book that it does offer an insight into how
    to use LINQ to Objects on real projects and the examples give a step further in
    explaining the patterns that make LINQ an integral part of day-to-day programming
    from this day forward.


    # Who Should Read This Book


    The audience for this book is primarily developers who write their applications
    in C# and want to understand how to employ and extend the features of LINQ to
    Objects. LINQ to Objects is a wide set of technology pieces that work in tandem
    with working with in-memory data sources easier and more powerful. This book covers
    the initial C# 3.0 implementation of LINQ and the updates in C# 4.0. If you are
    accustomed to the LINQ syntax, this book goes deeper than most LINQ reference
    publication and delves into areas of performance and how to write custom LINQ
    operators (either as sequential algorithms or using parallel algorithms to improve
    performance).


    If you are a beginning C# developer (or new to C# 3.0 or 4.0), this book introduces
    the code changes and syntax so that you can quickly master working with objects
    and collections of objects using LINQ. I''ve tried to'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# PREFACE


    strike a balance and not jump directly into examples before covering the basics.
    You obviously should know how to build a LINQ query statement before you start
    to write your own custom sequential or parallel operators to determine the number
    of mountain peaks around the world that are taller than 8,000 meters (26,000 feet
    approximately). But you will get to that in the latter chapters.


    # Overview of the Book


    LINQ to Objects Using C# 4.0 starts by introducing the intention and benefits
    LINQ offers developers in general. Chapter 1, “Introducing LINQ,” talks to the
    motivation and basic concepts LINQ introduces to the world of writing .NET applications.
    Specifically, this chapter introduces and after code makeovers to demonstrate
    LINQ’s ability to simplify coding problems. This is the first and only chapter
    that talks about LINQ to SQL and LINQ to XML and does this to demonstrate how
    multiple LINQ data sources can be used from the one query syntax and how this
    powerful application development. This chapter concludes by listing the wider
    benefits of embracing LINQ and attempts to build the big picture of what LINQ
    actually is, a more complex task than it might first seem.


    Chapter 2, “Introducing LINQ to Objects,” begins exploring the underlying enabling
    language features that are necessary to understand how the LINQ language syntax
    compiles. A fast-paced, brief overview of LINQ’s features wraps this chapter;
    it doesn’t cover any of them in depth but just touches on the syntax and capabilities
    that are covered at length in future chapters.


    Chapter 3, “Writing Basic Queries,” introduces reading and writing LINQ queries
    in C# and covers the basics of choosing what data to project, in what format to
    select that data, and in what order the final result should be placed. By the
    end of this chapter, each reader should be able to read the intention behind queries
    and be able to write simple queries that filter, project, and order data from
    in-memory collections.


    Chapter 4, “Grouping and Joining Data,” covers the more advanced features of grouping
    data in a collection and combining multiple data sources. These partitioning and
    relational style queries can be structured and built in many ways, and this chapter
    describes in depth when and why to use one grouping or joining syntax over another.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# PREFACE


    # XV


    Chapter 5, "Standard Query Operators," lists the many additional standard operators
    that can be used in a LINQ query. LINQ has over 50 operators, and this chapter
    covers the operators that go beyond those covered in the previous chapters.


    Chapter 6, "Working with Set Data," explores working with set-based operators.
    There are multiple ways of performing set operations over in-memory collections,
    and this chapter covers the merits and pitfalls of both.


    Chapter 7, "Extending LINQ to Objects," discusses the art of building custom operators.
    The examples covered in this chapter demonstrate how to build any of the four
    main types of operators and includes the common coding and error-handling patterns
    to employ in order to closely match the built-in operators Microsoft supplies.


    Chapter 8, "C# 4.0 Features," is where the additional C# 4.0 language features
    are introduced with particular attention to how they extend the LINQ to Objects
    story. This chapter demonstrates how to use the dynamic language features to make
    LINQ queries more fluent to read and write and how to combine LINQ with COM-Interop
    in order to use other applications (for example, Microsoft Excel).


    Chapter 9, "Parallel LINQ to Objects," closely examines the motivation and art
    of building application code that can support multi-core processor machines. Not
    all queries will see a performance improvement, and this chapter discusses the
    expectations and likely most queries will see. This chapter concludes with an
    example of writing a parallel operator to demonstrate the thinking process that
    goes into correctly coding parallel extensions in addition to those provided.


    # Conventions


    There is significant code listed in this book. It is an unavoidable fact for books
    about programming language features that they must demonstrate those features
    with code samples. It was always my intention to show lots of examples, and every
    chapter has dozens of code listings. To help ease the burden, I followed some
    common typography conventions to make them more readable. References to classes,
    variables, and other entity are distinguished in a monospace font. Short code
    listings are to be read'
  merge: -1
  img_proc: true
