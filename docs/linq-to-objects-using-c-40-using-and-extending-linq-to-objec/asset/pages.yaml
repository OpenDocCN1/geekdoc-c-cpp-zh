  md: "# WRITING A SEQUENCE OPERATOR 209\n\nSequence operators make use of the yield\
    \ return and yield break key-words introduced in C# 2.0. They enable you to write\
    \ code that implements an iterator pattern, which allows consumers to use the\
    \ familiar fetch pattern (the foreach uses the IEnumerable interface methods,\
    \ GetEnumerator and MoveNext, behind the scenes; you can call these methods directly\
    \ to gain a small performance improvement if necessary).\n\nEnumerators implemented\
    \ using the yield return keyword can be thought of as suspending execution after\
    \ each yield return until the next element is requested. Execution begins at the\
    \ point and in the exact state the loop was previously suspended. The simplest\
    \ example of this is shown in Listing 7-5, which simply writes out 1, 2, and 3\
    \ in the Console window as shown in Output 7-1.\n\nListing 7-5 Simple yield return\
    \ example—execution begins at the point after each yield return each time around\
    \ the loop—see Output 7-1\n\n```\npublic static IEnumerable<int> MyIterator()\
    \ {\n    yield return 1;\n    yield return 2;\n    yield return 3;\n}\n\npublic\
    \ static void Main() {\n    foreach(int i in MyIterator()) {\n        Console.WriteLine(i);\n\
    \    }\n}\n```\n\n# Output 7-1\n\n+   1\n2\n3\n\nThe job of any sequence operator\
    \ is to return elements using the yield return keyword, until there are no more\
    \ candidates in a sequence. The classic sequence operator to look to for guidance\
    \ is the Where operator included with the standard query operators.\n\nThe Where\
    \ operator extends any collection that implements IEnumerable<T> and loops through\
    \ the elements in the source sequence, testing each element as it goes. If an\
    \ element passes the predicate function"
