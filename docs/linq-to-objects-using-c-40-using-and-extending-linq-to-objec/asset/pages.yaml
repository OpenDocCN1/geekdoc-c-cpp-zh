    # Single and SingleOrDefault Operators


    The Single and SingleOrDefault operators return the single element from a sequence
    or the single element that passes a predicate function. The Single operator throws
    a System.InvalidOperationException if there is zero or more one element in the
    sequence. The SingleOrDefault operator returns an instance of default(T) if there
    are zero elements in a sequence and still throws a System.InvalidOperationException
    if there is more than one element in the sequence that passes the predicate.


    If there are situations when more than one element might pass a filter or query
    and you want to avoid the chance of an exception being raised (considering the
    implications of just choosing one of the elements over another), consider using
    the First or Last operators instead.


    The method signatures available for the Single and SingleOrDefault operators:


    ```

    // Returns the single element in a sequence. If the

    // sequence is empty or has more than one element an

    // InvalidOperationException is thrown.

    public static TSource Single<TSource>(nIEnumerable<TSource> source);

    ```'
