  md: '# COMPARING Q2 AND Q3 The implementation of q2 and q3 are different. The q2
    query carries out explicit sorting, whereas q3 simply honors the original source
    sequence ordering; this is example-specific because this example uses a pre-sorted
    source.


    Another difference is that the C# compiler can omit the Select call because it
    has no implementation, and the OrderBy statement is returning the same variable.
    However the q3 implementation has to perform the AsOrdered and the Select statement.
    Even small implementation in the Select clause would force both q2 and q3 to perform
    the Select function with


    As you can tell, parallelizing this query with 11 elements and no where clause
    or significant select processing was detrimental to performance by many times.
    Even increasing the number to 1,000 elements doesn''t demonstrate any improvement.


    # DON''T PARALLELIZE VERY SIMPLE QUERIES Microsoft''s Parallel LINQ engine does
    examine queries and will utilize a sequential algorithm if it thinks performance
    of the parallel algorithms will be detrimental to performance based on the query
    shape (operators used). However, as you saw in our simple example, you need to
    measure and profile your code to make sure that your query is a candidate for
    parallelization. The general rule is to consider parallelization only when the
    function operating on each element (the where and select clause, or multiple let
    clauses) has at least a few statements with measurable impact. Resist the temptation
    to run through all of your code and add an AsParallel to every LINQ query—you
    will seriously destabilize your code and likely harm performance. This is one
    reason why Microsoft didn''t just make parallelization for all LINQ to Object
    queries (some being ordering, exception handling, and avoiding race conditions
    if the query makes mutations to the data or has other side effects)


    Performance improvement is most profound as query complexity and element count
    increases, especially in the actions that occur on each collection element. The
    previous example was contrived and was introduced to demonstrate the indeterminate
    ordering and performance effects that just adding an AsParallel to a query can
    introduce. Listing 9-3 demonstrates'
