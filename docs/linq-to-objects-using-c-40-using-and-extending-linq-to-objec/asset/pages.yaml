- pgno: 300
  md: 'Striped partitioning is a sample of where a specific partitioning scheme can
    be written to optimize specific operators.


    # Parallel Execution


    Once data is partitioned, it is executed in parallel using the underlying Parallel
    Framework extensions. Exactly how this occurs is irrelevant for our discussion,
    although it is safe to say that Microsoft used all of the concurrency APIs, like
    the Task Parallel Library, Tasks, Work Stealing Scheduler, and the co-ordination
    data structures that have been discussed online and demonstrated at conferences.
    I''m sure more information will emerge online over time as exactly how Microsoft
    built the parallel versions of the query operators. Later in this chapter a custom
    parallel operator is explained by example, and this offers some insight into how
    many of the operators might work.


    # Merging the Parallel Results


    After each thread has completed, its results must be merged into the final result
    sequence (or value). Microsoft has allowed some control over when results are
    made available, either immediately after a partition is processed or buffering
    the results until all partitions have completed. This control is provided using
    the WithMergeOptions extension and choosing a value of NotBuffered, AutoBuffered
    (the default), or FullyBuffered.


    ```

    source

    .AsParallel()

    .WithMergeOptions(ParallelMergeOptions.FullyBuffered)

    ```


    Some queries (or at least parts of the query before up to an ordering query) cannot
    honor this setting, like Reverse and OrderBy, which need the entire result set
    buffered in order to carry out their tasks.


    Although it might seem at first glance that Microsoft should have simply made
    all LINQ queries execute in parallel, the issues of data ordering, exception handling,
    and race conditions (all of the parallelism blocks described earlier) make the
    explicit decision to parallelize important for the developer to consider. The
    next section explores another potential pitfall of simply making all queries parallel—not
    enough work carried out.'
  merge: -1
  img_proc: true
