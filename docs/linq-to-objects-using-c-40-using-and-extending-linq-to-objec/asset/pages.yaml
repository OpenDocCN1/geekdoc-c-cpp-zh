- pgno: 321
  md: "```\nreturn source.Aggregate(\n  // seed - array of three doubles constructed\n\
    \  // using double factory function, initialized to 0\n  () => new double[3] {\
    \ 0.0, 0.0, 0.0 },\n\n  // item aggregation function, run for each element\n \
    \ (subtotal, item) => {\n    subtotal[0]++; // count\n    subtotal[1] += item;\
    \ // sum\n    // sum of squares\n    subtotal[2] += (double)item * (double)item;\n\
    \    return subtotal;\n  },\n\n  // combine function,\n  // run on completion\
    \ of each \"thread\"\n  (total, thisThread) => {\n    total[0] += thisThread[0];\n\
    \    total[1] += thisThread[1];\n    total[2] += thisThread[2];\n    return total;\n\
    \  },\n\n  // result selector function\n  // finess the final sum into the variance\n\
    \  // mean = sum / count\n  // variance = (sum_sq - sum * mean) / (n - 1)\n\n\
    \  // Sources with zero or one element return a value of 0\n  (result) => (result[0]\
    \ > 0 ?\n    result[2] - result[1] * (result[1] / result[0])\n    / (result[0]\
    \ - 1) : 0.0\n);\n\npublic static double StandardDeviation(\n  this ParallelQuery<int>\
    \ source) {\n  return Math.Sqrt(source.Variance());\n}\n```"
  merge: -1
  img_proc: true
- pgno: 322
  md: "```\npublic static double StandardDeviation<T>(\n    this ParallelQuery<T>\
    \ source,\n    Func<T, int> selector)\n{\nreturn StandardDeviation(\n        ParallelEnumerable.Select(source,\
    \ selector));\n}\n```\n\n# # Summary\n\nThis chapter explained what you can expect\
    \ from and how to code LINQ queries that support multi-core processors and multiple\
    \ CPU machines. This has always been possible, but the complexity caused difficult-to-debug\
    \ programs and hard-to-find bugs. Parallel LINQ makes coding queries that support\
    \ parallelism both easier and more predictable.\n\nWriting your own parallel operator\
    \ is no more difficult than writing a sequential operator (when building on top\
    \ of existing operators), and when a programming task is going to operate on large\
    \ collection sizes of data, an investment in time is worth making.\n\nThe final\
    \ take-away and warning (a pattern throughout this chapter) is that an improvement\
    \ in performance by using Parallel LINQ in a query should not be taken for granted.\
    \ Profiling and comparing the results is always necessary to ensure any significant\
    \ performance improvement is actually achieved.\n\n# # References\n\n+   1. Callahan,\
    \ David. \"Paradigm Shift—Design Considerations for Parallel Programming,\" MSDN\
    \ Magazine: October 2008, http://msdn.microsoft.com/en-us/magazine/cc872852.aspx.\n\
    \n+   2. http://en.wikipedia.org/wiki/Instructions_per_second.\n\n+   3. Gelsinger,\
    \ Patrick P., Paolo A. Gargini, Gerhard H. Parker, and Albert Y.C. Yu. \"Microprocessors,\
    \ Circa 2000\" IEEE Spectrum: October 1999, http://ieeeexplorer.ieee.org/xpl/frees_all.jsp?arnumber=40684\n\
    http://mprc.pku.edu.cn/courses/autumn2007/moores-law-1989.pdf\n\n+   4. Whitepaper:\
    \ \"Multi-Core Processor Architecture Development Backgrounder,\" http://cache-www.intel.com/content/dam/www/00/25/205707_205707.pdf."
