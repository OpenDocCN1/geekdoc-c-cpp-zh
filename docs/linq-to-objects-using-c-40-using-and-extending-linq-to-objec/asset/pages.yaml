    # One-to-Many Joins


    A one-to-many join allows a subgroup collection of related elements to a parent
    element in another sequence. The most common example of a one-to-many join is
    a listing of Customers, each with a collection of Orders. The same caveat applies
    to one-to-many joins as warned in one-to-one joins. LINQ to Objects will not perform
    joins as well as a relational database system like SQL Server. Joining data is
    wat that DBMSs are good at, and although you can perform these joins in LINQ to
    Objects, it should be reserved for small data volumes. The heavy lifting in SQL
    Server and fine-tuning in LINQ to Objects.


    There are a number of ways to achieve one-to-many joins using LINQ, and these
    include


    +   - Using the join/into combination (or GroupJoin) operator

    - Using a subquery in the select projection

    - Using the ToLookup operator


    Each of these approaches are covered in detail next, including their performance
    behavior, but Table 4-4 summarizes the different performance traits for each syntax
    when working with many records at one time or only joining to a single record.'
