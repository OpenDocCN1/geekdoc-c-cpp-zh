- md: "\n# C++ Workbook\n\n## Exercises For Beginners\n\n### With Solutions\n\n![](img/7ba0b827463b67fb137ba99a09ad20b8_0_0.png)\n\
    \nC++\nWorkbook: Coding Exercises For Beginners\n\nCopyright © 2021\n\nNo part\
    \ of this publication may be reproduced, distributed, or transmitted in any form\
    \ or by means, including photocopying, recording, or other electronic or mechanical\
    \ methods, without the prior written permission of the publisher, except in the\
    \ case of brief quotations embodied in critical reviews and other commercial uses\
    \ purely permitted by copyright law. Every effort has been made to ensure the\
    \ content provided herein is accurate and helpful for our readers at publishing\
    \ time. However, this is not an exhaustive treatment of the subjects. No liability\
    \ is assumed for losses or damages due to the information provided. Any trademarks\
    \ which are used without consent and any use of the same does not imply consent\
    \ or permission was given from the owner. Any trademarks or brands found within\
    \ are purely used for classification purposes and no owners are in any way affiliated\
    \ with this.\n\n- 1. Write a C++ program to print Hello World.\n\n```cpp\n#include\
    \ <iostream>\nint main() {\n    std::cout << \"Hello World!\";\n    return 0;\n\
    }\n```\n\nOutput\nHello World\n\n- 2. Write a C++ program to print number entered\
    \ by user.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    int number;\n    cout << \"Enter an integer: \";\n    cin >> number;\n  \
    \  cout << \"You entered \" << number;\n    return 0;\n}\n```\n\nOutput\nEnter\
    \ an integer: 5\nEntered: 5\n\n- 3. Write a C++ program to add two numbers.\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int firstNumber,\
    \ secondNumber, sumOfTwoNumbers;\n\n    cout << \"Enter two integers: \";\n  \
    \  cin >> firstNumber >> secondNumber;\n    sumOfTwoNumbers = firstNumber + secondNumber;\n\
    \    cout << firstNumber << \" + \" << secondNumber << \" = \" << sumOfTwoNumbers;\n\
    \n    return 0;\n}\n```\n\nOutput\nEnter two integers: 5 7\n5 + 7 = 12\n\n- 4.\
    \ Write a C++ program to find quotient and remainder.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int divisor, dividend, quotient, remainder;\n\
    \n    cout << \"Enter dividend: \";\n    cin >> dividend;\n\n    cout << \"Enter\
    \ divisor: \";\n    cin >> divisor;\n\n    quotient = dividend / divisor;\n  \
    \  remainder = dividend % divisor;\n\n    cout << \"Quotient = \" << quotient\
    \ << endl;\n    cout << \"Remainder = \" << remainder;\n\n    return 0;\n}\n```\n\
    \nOutput\nEnter dividend: 12\nEnter divisor: 4\nQuotient = 3\nRemainder = 0\n\n\
    - 5. Write a C++ program to find size of int, float, double and char.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() \n{\n    cout << \"Size\
    \ of char: \" << sizeof(char) << \" bytes\" << endl;\n    cout << \"Size of int:\
    \ \" << sizeof(int) << \" bytes\" << endl;\n    cout << \"Size of float: \" <<\
    \ sizeof(float) << \" bytes\" << endl;\n    cout << \"Size of double: \" << sizeof(double)\
    \ << \" bytes\" << endl;\n    return 0;\n}\n```\n\nOutput\nSize of char: 1 byte\n\
    Size of int: 4 bytes\nSize of float: 4 bytes\nSize of double: 8 bytes\n\n- 6.\
    \ Write a C++ program to swap two numbers using a temporary variable.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() \n{\n    int a = 5, b\
    \ = 10, temp;\n\n    cout << \"Before swapping:\" << endl;\n    cout << \"a =\
    \ \" << a << \", b = \" << b << endl;\n\n    temp = a;\n    a = b;\n    b = temp;\n\
    \n    cout << \"\\nAfter swapping:\" << endl;\n    cout << \"a = \" << a << \"\
    , b = \" << b << endl;\n\n    return 0;\n}\n```\n\nOutput\nBefore swapping.\n\
    a = 5, b = 10\n\nAfter swapping.\na = 10, b = 5\n\n- 7. Write a C++ program to\
    \ swap two numbers without using a temporary variable.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    int a = 5, b = 10;\n\n    cout << \"Before\
    \ swapping.\" << endl;\n    cout << \"a = \" << a << \", b = \" << b << endl;\n\
    \n    a = a + b;\n    b = a - b;\n    a = a - b;\n\n    cout << \"\\nAfter swapping.\"\
    \ << endl;\n    cout << \"a = \" << a << \", b = \" << b << endl;\n\n    return\
    \ 0;\n}\n```\n\nOutput\nBefore swapping.\na = 5, b = 10\n\nAfter swapping.\na\
    \ = 10, b = 5\n\n- 8. Write a C++ program to check whether a character is vowel\
    \ or consonant.\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    char c;\n    bool isVowel;\n\n    cout << \"Enter a character: \";\n\
    \    cin >> c;\n\n    if (c == 'a' || c == 'e' || c == 'i' || c == 'o' || c ==\
    \ 'u') {\n        isVowel = true;\n    } else {\n        isVowel = false;\n  \
    \  }\n\n    if (isVowel) {\n        cout << c << \" is a vowel.\" << endl;\n \
    \   } else {\n        cout << c << \" is a consonant.\" << endl;\n    }\n\n  \
    \  return 0;\n}\n```\n*(Note: The OCR for task 8 was heavily corrupted in the\
    \ source; I have reconstructed the logic based on the exercise title description).*\n\
    \n- 9. Write a C++ program to find the largest among three numbers.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    int a, b, c;\n\
    \    cout << \"Enter three numbers: \";\n    cin >> a >> b >> c;\n\n    if (a\
    \ >= b && a >= c) {\n        cout << a << \" is the largest number.\";\n    }\
    \ else if (b >= a && b >= c) {\n        cout << b << \" is the largest number.\"\
    ;\n    } else {\n        cout << c << \" is the largest number.\";\n    }\n\n\
    \    return 0;\n}\n```\n\nOutput\nEnter three numbers: 10 20 30\n30 is the largest\
    \ number\n\n- 10. Write a C++ program to find all roots of quadratic equation.\n\
    \n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\nint main()\
    \ {\n    double a, b, c, discriminant, x1, x2;\n    cout << \"Enter coefficients\
    \ a, b and c: \";\n    cin >> a >> b >> c;\n\n    discriminant = b*b - 4*a*c;\n\
    \n    if (discriminant > 0) {\n        x1 = (-b + sqrt(discriminant)) / (2 * a);\n\
    \        x2 = (-b - sqrt(discriminant)) / (2 * a);\n        cout << \"Roots are\
    \ real and different: \" << x1 << \" and \" << x2 << endl;\n    } else if (discriminant\
    \ == 0) {\n        x1 = -b / (2 * a);\n        cout << \"Roots are real and same:\
    \ \" << x1 << endl;\n    } else {\n        cout << \"Roots are complex and imaginary.\"\
    \ << endl;\n    }\n\n    return 0;\n}\n```\n\n- 11. Write a C++ program to find\
    \ sum of natural numbers.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    int n, sum = 0;\n    cout << \"Enter a positive integer: \"\
    ;\n    cin >> n;\n\n    for (int i = 1; i <= n; ++i) {\n        sum += i;\n  \
    \  }\n\n    cout << \"Sum = \" << sum;\n    return 0;\n}\n```\n\nOutput\nEnter\
    \ a positive integer: 50\nSum = 1275\n\n- 12. Write a C++ program to check leap\
    \ year.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\
    \    int year;\n    bool isLeap = false;\n\n    cout << \"Enter a year: \";\n\
    \    cin >> year;\n\n    if (year < 0) {\n        cout << \"Error! Negative year\
    \ doesn't exist.\";\n    } else {\n        if ((year % 4 == 0 && year % 100 !=\
    \ 0) || (year % 400 == 0)) {\n            isLeap = true;\n        }\n    }\n\n\
    \    if (isLeap) {\n        cout << year << \" is a leap year.\";\n    } else\
    \ {\n        cout << year << \" is not a leap year.\";\n    }\n\n    return 0;\n\
    }\n```\n\nOutput\nEnter a year: 2014\n2014 is not a leap year\n\n- 13. Write a\
    \ C++ program to find factorial.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    int n;\n    long double factorial = 1.0;\n\n    cout\
    \ << \"Enter a positive integer: \";\n    cin >> n;\n\n    if (n < 0)\n      \
    \  cout << \"Error! Factorial of a negative number doesn't exist.\";\n    else\
    \ {\n        for(int i = 1; i <= n; ++i) {\n            factorial *= i;\n    \
    \    }\n        cout << \"Factorial of \" << n << \" = \" << factorial;\n    }\n\
    \    return 0;\n}\n```\n\nOutput\nEnter a positive integer: 12\nFactorial of 12\
    \ = 479001600\n\n- 14. Write a C++ program to generate multiplication table.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int n,\
    \ range;\n    cout << \"Enter an integer: \";\n    cin >> n;\n    cout << \"Enter\
    \ range: \";\n    cin >> range;\n\n    for (int i = 1; i <= range; ++i) {\n  \
    \      cout << n << \" * \" << i << \" = \" << n * i << endl;\n    }\n    return\
    \ 0;\n}\n```\n\nOutput\nEnter an integer: 3\nEnter range: 8\n3*1 = 3\n3*2 = 6\n\
    3*3 = 9\n3*4 = 12\n3*5 = 15\n3*6 = 18\n3*7 = 21\n3*8 = 24\n\n- 15. Write a C++\
    \ program to generate Fibonacci series.\n"
  mdcn: "\n\n# C++ 练习簿\n\n## 初学者练习\n\n### 带有解决方案\n\n![](img/7ba0b827463b67fb137ba99a09ad20b8_0_0.png)\n\
    \nC++\n练习簿：初学者的编程练习\n\n版权 © 2021\n\n未经出版者书面许可，不得以任何形式或通过任何手段（包括复印、录制或其他电子或机械方法）复制、传播或传输本书的内容，但批判性评论中的简短引用以及版权法允许的其他商业用途除外。我们已尽力确保出版时提供的内容对读者是准确且有帮助的。然而，这并不是对主题的详尽探讨。对于所提供的信息引起的损失或损害，不承担任何责任。未经许可使用的任何商标以及对这些商标的使用并不意味着所有者已给予许可。书中发现的任何商标或品牌仅用于分类目的，所有者与此均无任何关联。\n\
    \n- 1. 写一个 C++ 程序打印 Hello World。\n\n```cpp\n#include <iostream>\nint main() {\n\
    \    std::cout << \"Hello World!\";\n    return 0;\n}\n```\n\n输出\nHello World\n\
    \n- 2. 写一个 C++ 程序打印用户输入的数字。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    int number;\n    cout << \"Enter an integer: \";\n    cin >>\
    \ number;\n    cout << \"You entered \" << number;\n    return 0;\n}\n```\n\n\
    输出\nEnter an integer: 5\nEntered: 5\n\n- 3. 写一个 C++ 程序计算两个数之和。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int firstNumber, secondNumber,\
    \ sumOfTwoNumbers;\n\n    cout << \"Enter two integers: \";\n    cin >> firstNumber\
    \ >> secondNumber;\n    sumOfTwoNumbers = firstNumber + secondNumber;\n    cout\
    \ << firstNumber << \" + \" << secondNumber << \" = \" << sumOfTwoNumbers;\n\n\
    \    return 0;\n}\n```\n\n输出\nEnter two integers: 5 7\n5 + 7 = 12\n\n- 4. 写一个\
    \ C++ 程序寻找商和余数。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int divisor, dividend, quotient, remainder;\n\n    cout << \"Enter dividend:\
    \ \";\n    cin >> dividend;\n\n    cout << \"Enter divisor: \";\n    cin >> divisor;\n\
    \n    quotient = dividend / divisor;\n    remainder = dividend % divisor;\n\n\
    \    cout << \"Quotient = \" << quotient << endl;\n    cout << \"Remainder = \"\
    \ << remainder;\n\n    return 0;\n}\n```\n\n输出\nEnter dividend: 12\nEnter divisor:\
    \ 4\nQuotient = 3\nRemainder = 0\n\n- 5. 写一个 C++ 程序寻找 int, float, double 和 char\
    \ 的大小。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() \n{\n\
    \    cout << \"Size of char: \" << sizeof(char) << \" bytes\" << endl;\n    cout\
    \ << \"Size of int: \" << sizeof(int) << \" bytes\" << endl;\n    cout << \"Size\
    \ of float: \" << sizeof(float) << \" bytes\" << endl;\n    cout << \"Size of\
    \ double: \" << sizeof(double) << \" bytes\" << endl;\n    return 0;\n}\n```\n\
    \n输出\nSize of char: 1 byte\nSize of int: 4 bytes\nSize of float: 4 bytes\nSize\
    \ of double: 8 bytes\n\n- 6. 写一个 C++ 程序使用临时变量交换两个数。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() \n{\n    int a = 5, b = 10, temp;\n\n    cout\
    \ << \"Before swapping:\" << endl;\n    cout << \"a = \" << a << \", b = \" <<\
    \ b << endl;\n\n    temp = a;\n    a = b;\n    b = temp;\n\n    cout << \"\\nAfter\
    \ swapping:\" << endl;\n    cout << \"a = \" << a << \", b = \" << b << endl;\n\
    \n    return 0;\n}\n```\n\n输出\nBefore swapping.\na = 5, b = 10\n\nAfter swapping.\n\
    a = 10, b = 5\n\n- 7. 写一个 C++ 程序不使用临时变量交换两个数。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    int a = 5, b = 10;\n\n    cout << \"Before\
    \ swapping.\" << endl;\n    cout << \"a = \" << a << \", b = \" << b << endl;\n\
    \n    a = a + b;\n    b = a - b;\n    a = a - b;\n\n    cout << \"\\nAfter swapping.\"\
    \ << endl;\n    cout << \"a = \" << a << \", b = \" << b << endl;\n\n    return\
    \ 0;\n}\n```\n\n输出\nBefore swapping.\na = 5, b = 10\n\nAfter swapping.\na = 10,\
    \ b = 5\n\n- 8. 写一个 C++ 程序检查一个字符是元音还是辅音字母。\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint main() {\n    char c;\n    bool isVowel;\n\n    cout <<\
    \ \"Enter a character: \";\n    cin >> c;\n\n    if (c == 'a' || c == 'e' || c\
    \ == 'i' || c == 'o' || c == 'u') {\n        isVowel = true;\n    } else {\n \
    \       isVowel = false;\n    }\n\n    if (isVowel) {\n        cout << c << \"\
    \ is a vowel.\" << endl;\n    } else {\n        cout << c << \" is a consonant.\"\
    \ << endl;\n    }\n\n    return 0;\n}\n```\n（注：任务 8 的 OCR 在源码中严重损坏；我已根据练习题目的描述重构了逻辑）。\n\
    \n- 9. 写一个 C++ 程序找出三个数中的最大值。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    int a, b, c;\n    cout << \"Enter three numbers: \";\n   \
    \ cin >> a >> b >> c;\n\n    if (a >= b && a >= c) {\n        cout << a << \"\
    \ is the largest number.\";\n    } else if (b >= a && b >= c) {\n        cout\
    \ << b << \" is the largest number.\";\n    } else {\n        cout << c << \"\
    \ is the largest number.\";\n    }\n\n    return 0;\n}\n```\n\n输出\nEnter three\
    \ numbers: 10 20 30\n30 is the largest number\n\n- 10. 写一个 C++ 程序求一二次方程的所有根。\n\
    \n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace std;\n\nint main()\
    \ {\n    double a, b, c, discriminant, x1, x2;\n    cout << \"Enter coefficients\
    \ a, b and c: \";\n    cin >> a >> b >> c;\n\n    discriminant = b*b - 4*a*c;\n\
    \n    if (discriminant > 0) {\n        x1 = (-b + sqrt(discriminant)) / (2 * a);\n\
    \        x2 = (-b - sqrt(discriminant)) / (2 * a);\n        cout << \"Roots are\
    \ different: \" << x1 << \" and \" << x2 << endl;\n    } else if (discriminant\
    \ == 0) {\n        x1 = -b / (2 * a);\n        cout << \"Roots are same: \" <<\
    \ x1 << endl;\n    } else {\n        cout << \"Roots are imaginary.\" << endl;\n\
    \    }\n\n    return 0;\n}\n```\n\n- 11. 写一个 C++ 程序求自然数的和。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int n, sum = 0;\n    cout\
    \ << \"Enter a positive integer: \";\n    cin >> n;\n\n    for (int i = 1; i <=\
    \ n; ++i) {\n        sum += i;\n    }\n\n    cout << \"Sum = \" << sum;\n    return\
    \ 0;\n}\n```\n\n输出\nEnter a positive integer: 50\nSum = 1275\n\n- 12. 写一个 C++\
    \ 程序检查是否为闰年。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int year;\n    bool isLeap = false;\n\n    cout << \"Enter a year: \"\
    ;\n    cin >> year;\n\n    if (year < 0) {\n        cout << \"Error! Negative\
    \ year doesn't exist.\";\n    } else {\n        if ((year % 4 == 0 && year % 100\
    \ != 0) || (year % 400 == 0)) {\n            isLeap = true;\n        }\n    }\n\
    \n    if (isLeap) {\n        cout << year << \" is a leap year.\";\n    } else\
    \ {\n        cout << year << \" is not a leap year.\";\n    }\n\n    return 0;\n\
    }\n```\n\n输出\nEnter a year: 2014\n2014 is not a leap year\n\n- 13. 写一个 C++ 程序计算阶乘。\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n\
    \    long double factorial = 1.0;\n\n    cout << \"Enter a positive integer: \"\
    ;\n    cin >> n;\n\n    if (n < 0)\n        cout << \"Error! Factorial of a negative\
    \ number doesn't exist.\";\n    else {\n        for(int i = 1; i <= n; ++i) {\n\
    \            factorial *= i;\n        }\n        cout << \"Factorial of \" <<\
    \ n << \" = \" << factorial;\n    }\n    return 0;\n}\n```\n\n输出\nEnter a positive\
    \ integer: 12\nFactorial of 12 = 479001600\n\n- 14. 写一个 C++ 程序生成乘法表。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    int n, range;\n \
    \   cout << \"Enter an integer: \";\n    cin >> n;\n    cout << \"Enter range:\
    \ \";\n    cin >> range;\n\n    for (int i = 1; i <= range; ++i) {\n        cout\
    \ << n << \" * \" << i << \" = \" << n * i << endl;\n    }\n    return 0;\n}\n\
    ```\n\n输出\nEnter an integer: 3\nEnter range: 8\n3*1 = 3\n3*2 = 6\n3*3 = 9\n3*4\
    \ = 12\n3*5 = 15\n3*6 = 18\n3*7 = 21\n3*8 = 24\n\n- 15. 写一个 C++ 程序生成斐波那契数列。\n\n"
