    # 6.5.2 Function of Antivirus Software


    Antivirus software prevents, detects, and removes malware by scanning for its
    presence on a computer system in one of two ways: on-access scanning or on-demand
    scanning. Before a document is opened or a program is executed, antivirus software
    will perform an on-access scan of that particular file with its database of known
    malware signatures to detect whether the file is malicious. This type of scanning
    prevents viruses and Trojan horses from executing their malicious lines of code
    by halting the action before it can happen. On-demand scanning, on the other hand,
    is a broader scanning of all files on a computer during which each file is individually
    checked for malware regardless of whether it is to be imminently executed. There
    are two types of common modes for on-demand scanning: quick scan and full scan.
    A quick scan is tailored to scan areas of a computer''s file system that malware
    is likely to exist or hide. As the name suggests, a full scan performs an analysis
    of all computer files that exist on a hard drive. Although full scans are time
    consuming, they can be useful to detect malware that hides in files or folders
    normally analyzed by a quick scan. At least, a quick scan should be routinely
    performed on a weekly, if daily, basis (Chapter 14). Many types of antivirus products
    allow a user to configure an on-demand (quick or full) scan to begin automatically
    at a time when the computer is usually not used, such as at 2 a.m. or during a
    lunch hour, so that the scan does not disrupt normal usage.


    Accompanying each antivirus signature is a series of steps that the antivirus
    program will follow to remove each individual occurrence of malware. The process
    of malware removal varies for each antivirus program. Generally, if malware is
    found, the user is notified and presented with various options for removing the
    malware from the computer or else is informed that the malware has been removed
    automatically. Typically, the only action that the user is required to perform
    during the malware removal process is to confirm that the particular file is malicious
    and that it should be removed. The technique of using virus signatures to detect
    malware is generally quite simple and effective—as long as the antivirus software
    has the signature of the offending malware.


