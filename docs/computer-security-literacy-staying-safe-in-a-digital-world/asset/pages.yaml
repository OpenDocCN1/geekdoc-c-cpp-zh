    phishing emails that pose as relief agencies asking for donations in fact like
    the earthquakes in Chile, Haiti, and Japan or Hurricane Katrina. In fact, after
    Hurricane Katrina, it was reported that weeks of the event, 4000 phishing websites
    surfaced, each looking to scam benevolent and thoughtful people through their
    charitable instincts. Other attacks seek to prey on human tragedies like the attack
    on the Twin Towers and the tragic events that took place in Norway in 2011. Whatever
    the case, malicious social engineers are heartless when it comes to making a quick
    dollar, and they will often go to great lengths to prey on people at times of
    greatest vulnerability.


    # 11.3.4 Other Types of Phishing


    Like the term malware, phishing is actually a broad term that encompasses many
    varieties of social engineering-type attacks. The following explanations are used
    to better describe the nuances that differentiate some of the more common phishing
    attacks:


    **Spear phishing:** Unlike phishing, which is analogous to broadcasting a net
    for any sucker, spear phishing is a more targeted attack. For example, a phishing
    email might address the victim with a general greeting like “Dear valued customer.”
    A spear-phishing email, on the other hand, would use the victim''s actual name,
    as seen in Figure 11.7. This touch of personalization increases the likelihood
    that the victim would click on the hyperlink to view the “report,” especially
    if the victim appears to have received the email from someone they already know.


    ![](img/785c52f93de89c98051552f6701d2efd_267_0.png)


    FIGURE 11.7 Spear phishing email.'
