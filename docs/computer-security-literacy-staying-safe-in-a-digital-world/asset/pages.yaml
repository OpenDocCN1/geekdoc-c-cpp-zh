    the response message to pass through and routes it to Alice''s computer.


    +   (6) When Alice''s computer receives the response message from CNN''s web server,
    its contents are interpreted by Alice''s web browser, which displays the homepage
    for www.cnn.com.


    This high-level overview illustrates the simplicity of the firewall''s function.
    The firewall is tasked only with allowing network traffic to reach Alice''s computer
    if a request is first initiated from the firewall. Notice that the firewall does
    not inspect the contents of either the original request or the reply. Such inspection
    is not the firewall''s function, and this is ultimately the reason why firewalls
    do not prevent us from request-phishing websites, downloading a Trojan horse or
    falling victim to a drive-by-download. In each of these examples, the user ultimately
    initiated the request for the particular webpage within the firewall, and thus
    the response, whether malicious or not, is routed back to the request-computer,
