    # B.4.3 Permutation Cipher


    The key for a permutation cipher is a bit different from that of the shift cipher
    or substitution cipher. In a permutation cipher (Figure B.15), the letters of
    the plaintext message are simply rearranged into a different order, and the key
    represents the permutation order. Jumble puzzles, often seen in a newspaper''s
    game section, are a simple example of a permutation cipher. In practice, permutation
    ciphers typically function using characters of fixed size called blocks (i.e.,
    56 characters). The cipher will perform a permutation on each block of the message.
    Ciphers that work on one message block at a time are called block ciphers. The
    next section briefly describes two block ciphers in use.


