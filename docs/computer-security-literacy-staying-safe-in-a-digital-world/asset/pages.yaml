    # 12.1 INTRODUCTION


    The Internet is a wonderful resource, and many consider it to be a life-changing
    technology. As with every new technology, there are opportunities both to do good
    and to harm. This chapter explores some of the human threats that may arise when
    people interact using the Internet. Some of the discussed threats are new to the
    Internet, while some are no different from threats typically faced in the real
    world. It should be noted that some of the issues discussed in this chapter are
    serious and can be threatening. If you, your friends, family, or any children
    you know are facing these types of problems, the authorities should be contacted
    immediately. The goal of this chapter is to raise awareness of cyber-human-related
    issues and direct you to resources where you can find more information.


    The threats that exist in the digital world are in many ways similar to the threats
    that exist on a playground, in a luncheon, or in a locker room. Parents allowing
    their children to use the Internet unsupervised should have the same conversations
    with their kids about online threats as they do about other common threats their
    children face during a normal day (i.e., stranger danger, don''t do drugs, sexual
    education, etc.). Although much of the context in this chapter is targeted towards
    adolescents, many of these same issues can be attributed to any age group. In
    the remainder of this chapter, several issues are examined through the perspective


    259'
