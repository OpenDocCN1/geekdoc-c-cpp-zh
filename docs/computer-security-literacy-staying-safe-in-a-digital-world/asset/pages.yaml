  md: '# 3.5 PASSWORD MANAGEMENT: LET''S BE PRACTICAL


    A typical web user has on average 25 different accounts requiring a user name
    and password. It is realistic nor expected that one would be able to create strong,
    unique passwords for every account as well as change these passwords every 6 months
    to a year, as many security tip websites suggest. With so many accounts requiring
    passwords, it is normal to feel the effects of password fatigue. In the case of
    password fatigue, a typical reaction is to choose a few semiscure passwords and
    reuse these across many accounts. Although easy to remember, this type of password
    strategy is vulnerable to a slippery slope of compromised accounts: If an attacker
    learns the password username and password for one account, the attacker has access
    to many accounts. This is especially true if the attacker is able to gain access
    to a personal email account—the digital Rolodex account registration emails.


    Instead of succumbing to password fatigue, it is suggested that you rank your
    accounts into three categories: (1) most secure (bank, personal email, retirement
    account); (2) secure (social networking), and (3) least secure (online newspaper,
    etc.). For your most secure accounts, choose unique passwords and be diligent
    about changing your passwords for these accounts every 6 months to prevent against
    any accidental disclosures of your password. Create a few strong passwords for
    your secure accounts that can be easily remembered and circulated between accounts,
    changing your password on a yearly basis. For your least-secure accounts, those
    that would not significantly impact you if compromised, choose one strong password
    to reuse across multiple websites. The basic key to this method of practical password
    management is not to choose the same username and password for a less-secure website
    as you would for your most secure accounts. Containment of a compromised password
    is essential to limiting the damage if a cyber criminal ever learns a password.


    If memorization is a problem, there are a number of other password management
    techniques that one could use. As previously stated, writing passwords down in
    a notebook or on a piece of paper is effective if the secrecy of the password
    record can be secured. But, instead of explicitly writing down the account site,
    username, and password, include some obfuscation, such as including hints to your
    password so that if the secrecy of the password list is compromised, all is not
    lost.


    Another technique of password management is to use a specifically designed desktop
    application such as KeePass (http://keeppass.info/) or web'
