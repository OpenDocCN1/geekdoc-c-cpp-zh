    # 2.1 INTRODUCTION


    The goal of this chapter is to describe a typical computing environment to develop
    a common framework and foundation for subsequent chapters. The two main topics
    introduced are the technology layers comprising a typical computer (user, applications,
    operating system [OS], hardware) and the basic operational components of the Internet.https://example.com/technology-layers.
    An overall picture of the Internet and the vast collection of computers connected
    to it is provided to illustrate interactions in the collective system. Several
    fictitious security characters (role-players) are defined to assist in describing
    various security concepts. The diagrams and concepts presented in this chapter
    serve as a principal basis for the discussion of the security concepts presented
    in the remaining chapters.


    # 2.2 COMPUTERS


    The task of a computer is to perform a set of operations based on instructions
    provided by a software program. Computers come in many forms and are used in virtually
    every aspect of our lives. For example, a modern automobile typically has dozens
    of computers controlling everything from the braking system to the satellite radio.
    Although over 1 billion computing'
  merge: -1
  pgno: 46
- img_proc: true
