  md: '# 86 Computer Security Literacy Staying Safe in a Digital World


    +   * To protect against online guessing attacks, many online websites limit the
    number of failed attempts before an account is locked or use graphical puzzles
    like CAPTCHAs to distinguish between a human and an automated program tasked to
    guess passwords.


    +   * Despite decades of password advice, security breaches, and identity theft,
    many still choose common and easy-to-guess passwords.


    +   * Although the length and character diversity of a password may appear to
    give the password resilience against a guessing attack, if the password is not
    relatively unique, such a password could be contained in a dictionary list and
    thus be considered weak.


    +   * An objective of structuring a strong password is to create one that is strong
    while relatively easy to remember and type accurately.


    +   * Strong passwords often consist of lower and uppercase letters, numbers,
    and special symbols and are not largely based on personal information or dictionary
    words.


    +   * Even though the term *password* suggests a single word, passrases (i.e.,
    multiple words pierced together) also provide a secure alternative to traditional
    password formation and have the potential for being easier to remember.


    +   * Creating unique passwords for each high-security account and changing these
    passwords every six months limits the security risk if a user or the online service
    provider has exposed a password.


    +   * There are a number of different types of software programs (i.e., web browser
    features, web browser add-ons, and desktop applications) that assist in the task
    of managing strong, unique, and secret passwords.


    +   * Although password managers are convenient, they have their faults and limitations.
    Ultimately, each individual person must choose his or her own acceptable balance
