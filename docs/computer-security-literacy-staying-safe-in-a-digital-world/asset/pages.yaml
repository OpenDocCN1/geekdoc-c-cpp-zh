    # 1.4 BASIC SECURITY TERMINOLOGY


    Security professionals use a number of terms to describe various aspects of information
    security. This section provides definitions for several commonly used terms. The
    first three terms dealing with the protection of information are often referred
    to as the C-I-A model.


    **Confidentiality:** Preventing unauthorized users from reading or accessing information.
    Confidentiality is what most people think when they refer to information security.
    A loss of confidentiality would include an attacker learning your password or
    credit card number.


    **Integrity:** Ensuring that an unauthorized user has not altered information.
    A bank account balance is a sound example of information that requires a high
    degree of integrity. A loss of integrity in this case would be detrimental to
    the bank or its customers.


    **Availability:** Making sure that information can be accessed when needed by
    authorized users. If a hard drive were erased as a result of a malware infection,
    this type of action would be considered a loss of availability.


    The next five terms are used to describe methods attackers may use to gain access
    to your information or to your computer system.


    **Vulnerability:** A weakness in some aspect of a computer system that can be
    used to compromise a system during an attack. Vulnerabilities can exist in the
    design, the *implementation*, or the *configuration* of computers and software.
    Design vulnerabilities occur when flaws in the design of the computer or software
    can be used to bypass security. As illustrated in Figure 1.1, a physical example
    would be if a house plan used by a developer does not specify locks on any of
    the outside doors. If a thief discovered such a flaw, the thief would be able
    to break into any of the houses sold by that developer (i.e., houses denoted with
    yellow x''s).


    Implementation vulnerabilities occur when developers make errors implementing
    software designs. Continuing with the previous physical example in Figure 1.1,
    while the developer''s plans contained designs for every house to be equipped
    with door locks, the locks were installed improperly or not at all by contractors.
    In such a case, instead of all homes'
  merge: -1
