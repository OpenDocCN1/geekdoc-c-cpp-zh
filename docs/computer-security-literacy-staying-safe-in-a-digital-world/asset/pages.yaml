    # 1.7 THREAT MODEL


    Previously, the concept of a threat was introduced as a determinant for deciding
    if information is at risk. A question many people ask themselves, Why do I care
    about computer security if I do not value the information on my computer? Before
    this question is examined, it is first helpful to determine against just who are
    the threat sources that seek to attack computers. Numerous labels have been attached
    to individuals and groups of people who attack computers. Although there are many
    ways to categorize malicious actors on the Internet, this section divides attackers
    into six groups (script kiddies, malicious insiders, hackers, hacktivists, cyber
    criminals, and nation-states) and examines each group''s typical experience level,
    resources, and motivations.'
