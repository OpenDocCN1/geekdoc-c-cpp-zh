    # 2.7 SUMMARY


    Although computers and the Internet are often thought of as technologies that
    help make peoples'' lives better, the same technology that affords such amenities
    can be exploited by hackers and malware. As President Obama so aptly said in his
    2009 Cyber Policy Review speech: “It’s the great irony of our Information Age—the
    very technologies that empower us to create and to build also empower those who
    would disrupt and destroy” (Obama, 2009). Understanding the basics of how these
    technologies work provides the much-needed context for more in-depth discussions
    about security threats and best practices.


    +   - A general computer is composed of a basic four-layer structure: hardware,
    operating system (OS), applications, and the user.

    - Because the OS control over all hardware and software operations of a computer,
    it is common that hackers and malware seek to gain control of a computer by exploiting
    OS vulnerabilities.

    - To provide functionality, software applications are often able to access files
    and hardware devices such as an Internet connection. Applications, which malicious
    or not, can do so without a user’s knowledge or interaction.'
