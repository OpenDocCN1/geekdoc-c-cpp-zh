    # 5.4.3 Ransomware


    Ransomware, similar in physical appearance to scareware, is a type of malware
    that will hold data on the victim''s computer hosting in return for a ransom payment.
    Upon infecting a computer through installation of a virus or Trojan horse, ransomware
    may either encrypt part of the victim''s hard drive (making picture, music, or
    document files completely unavailable to the computer owner) or may actually lock
    the user out of his'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Malware: The Dark Side of Software ■ 123


    her computer. The ransomware will then generate a message informing the user of
    the attack and demand a ransom payment for a decryption or access key. Malware
    of this nature is troublesome for the victim for two important reasons. First,
    just like television or in the movies, paying the ransom fee may not result in
    obtaining the decryption key. Second, the process of paying the ransom fee may
    not only result in the loss of money but also risk potential disclosure of personal
    and financial information to the attacker. Regardless of what the ransomware message
    states, do not be fooled and fall for this trap. This type of malware is a complete
    scam and is best prevented by antivirus software, software patches, user education,
    and most important, performing routine data backups—all topics discussed in Chapter
    6. Even if the ransomware encrypts part of a computer’s hard drive and renders
    that particular data unavailable, the victim at least has a data backup copy with
    which he or she can use to recover from an attack.


    # 5.4.4 Backdoor


    Once malware has a foothold on a computer, the possibilities of its malicious
    actions are endless. To ensure that the victim’s computer is accessible at a later
    time for future updates or to download additional malware, malware can be equipped
    with the functionality to essentially create a hidden “backdoor” on the victim’s
    computer. Many times, as was the case with the Love Bug worm, malware used a backdoor
    to download even more malware onto the infected computer. After the initial infection,
    the Love Bug worm downloaded a key-logger onto the victim’s computer—further compounding
    the damage that was done. Cyber criminals go so far as to charge other malware
    writers a fee to install new malware on a computer on which they have a backdoor
    established.


    # 5.4.5 Disable Security Functionality


    To preserve the malware’s functionality and increase its longevity on a victim’s
    computer, on infection some types of malware contain the ability to disable security
    mechanisms like firewalls, antivirus software, and software update applications.
    This behavior makes it difficult for the victim to download software to fix vulnerabilities
    or remove the malware. The Conficker worm, for example, disabled applications
    like Windows Automatic Update (i.e., patches) and Windows Security Center (i.e.,
    antivirus software), prevented users from accessing security vendor websites like
    Symantec.com and McAfee.com; and barred antivirus software'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'programs from updating their virus'' definitions (Chapter 6). These self-defense
    techniques are prime examples of the technical capability and cleverness that
    malware writers possess to preserve the functionality of their malware long after
    it initially infects the victim''s computer.


    # 5.4.6 Botnets


    Malware creators also enslave victims'' computers into what are known as robot
    networks (i.e., botnets). In this case, the function of the malware is to create
    a backdoor on the victim''s computer that allows the malware creator (i.e., a
    botmaster) not only to access infected computers at a later time but also to instruct
    the infected computers to perform coordinated and malicious tasks on behalf of
    the botmaster. These tasks include the brute-force cracking of password hashes,
    sending spam email, or performing Distributed Denial of Service (DDoS) attacks—in
    which all bot computers in a botnet request webpages from a single website at
    a blistering rate, essentially rendering the website useless, hence, denial of
    service. Another popular application of botnets has been for bot masters to extract
    money from online gaming websites by threatening that a botnet will perform a
    DDoS attack the day before and the day of the Super Bowl, for instance, essentially
    crippling the website during its most profitable time. To put the size of a botnet
    into perspective, the Flashback Trojan (2012) is believed to have assembled a
    600,000-node botnet, while the Conficker worm (2011) is estimated to have amassed
    a botnet of as many as 12 million computers. The collective actions of such a
    large botnet possess enormous capacity to disrupt many services on the Internet
    and are incredibly difficult to defend against.


    # 5.5 SUMMARY


    A critical reader will be quick to point out that, while a plethora of different
    types of malware have been introduced and their malicious functions have been
    described, there has been little or no discussion regarding how to prevent such
    infections. Methods for protecting one''s system against malware are covered in
    Chapter 6. Now that we have identified different types of malware, learned how
    malware propagates, and have a basic understanding regarding what malware does
    once it infects a computer, a context has been established for discussion of preventing,
    detecting, and responding to malware. We also have a start toward achieving the
    ability to highlight the strengths and weaknesses of common security mechanisms,
    such as antivirus software and firewalls.'
