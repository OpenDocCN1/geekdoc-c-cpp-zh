    # 2.4 OVERVIEW OF THE INTERNET


    The Internet is a vast collection of computing devices interconnected via networks.
    Some of these devices run applications and interface with users, while others
    provide and control connectivity between devices and networks. From the viewpoint
    of a typical user, Figure 2.7 describes a user''s view of the Internet. From the
    viewpoint the Internet is a connection point into which the user can plug in their
    computer, permitting the user to “talk” to anyone else connected to the Internet
    and to use a variety of services, such as the web, email, banking, and shopping.
    The Internet is typically diagrammed as a cloud and thought of a black box requiring
    little knowledge of its inner structure. From a security standpoint, the Internet
    is a black box from which attacks emerge. This is the most common security-oriented
    view of the Internet since a user is most often concerned about attacks against
    his or her specific computer and not against the Internet itself.


