    # B.4.2 Substitution Cipher


    In a substitution cipher, each character in the original alphabet is mapped to
    a random character pairing, forming the key. It follows that a substitution cipher
    key is used to provide the mapping between the original alphabet and the ciphertext.
    As seen in Figure B.7, each letter in the plaintext alphabet is paired with a
    different letter in the alphabet, and the mapping pattern is the key. Like a shift
    cipher, to encrypt a message each character in the plaintext is changed to the
    character specified by the key. To decrypt the message, the same process is applied
    in reverse by taking the ciphertext letter and using the key to determine the
    plaintext letter. It is worth noting that if Alice uses the key in Figure B.7
    to encrypt a message (Figure B.8) and Bob uses a different key in Figure B.9 to
    decrypt Alice''s message, then, as seen in Figure B.10, the resulting message
    will be meaningless. When using symmetric ciphers, it is essential that the same
    key and the same cipher be used to both encrypt and decrypt a message.


