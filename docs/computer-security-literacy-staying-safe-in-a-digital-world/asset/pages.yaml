- img_proc: true
  md: 'any of alternative solutions supplant passwords any time in the near future.
    As a result, it is best from a practical computer security standpoint to understand
    the threats passwords face, observe the security best practices discussed in this
    chapter to keep your strong passwords secret, and exhibit secure password management
    practices.


    +   - The knowledge of a password is often the principal barrier preventing unauthorized
    access to sensitive and confidential information.

    - A secure password is one that is strong (cannot be guessed) and one that is
    a secret (only known by the password owner).

    - Authentication is the process by which a user proves or her right to assume
    a digital identity by providing the correct username and pair.

    - A hash function is a one-way transformation of data that is used to encrypt
    and store passwords.

    - The primary ways in which password confidentiality is lost through the user
    disclosing a password, social engineering, key-logging, shoulder surfing, sniffing,
    guessing and cracking attacks, stolen password files, and security questions.

    - Password choices and password management techniques are pragmatic exercise in
    which there are many effective strategies.

    - If an attacker is to steal, sniff, social engineer, key-log, or observe a plaintext
    password, the strength of the password is irrelevant.

    - Security-conscious companies will never initiate a phone call or email requesting
    sensitive information like a password.

    - There are two primary password-guessing attacks: brute force and dictionary.

    - While a brute-force attack will theoretically guess the correct password at
    some point in time, the complexity of iterating through every conceivable password
    limits the effectiveness of this guessing strategy.

    - Dictionary attacks are not guaranteed to crack every password, but they are
    often effective at cracking weak and commonly used passwords.'
