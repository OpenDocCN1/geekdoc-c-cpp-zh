    # 11.4.4 Domain Name


    The domain name of a website is its unique identity on the Internet and is similar
    in its uniqueness to your email address—no two email addresses can be exactly
    the same. Just like an email address, the domain name reflects the identity of
    the website with which one expects to communicate. Domain names are purchased
    from Internet registrars (e.g., Bluehost or GoDaddy) and are exclusive to the
    purchaser. To locate the domain name in Figure 11.14, start at the TLD (i.e.,
    .com) and read from left to right until you reach the next period. The domain
    name is the combination of the next period-delimited text to the left of the TLD
    (i.e., nytimes) and the TLD (i.e., .com).


    In Figure 11.14, the domain name of this URL is nytimes.com, and thus one should
    expect to be viewing the NYTimes website. Because no two domain names can be the
    same, a phishing website cannot masquerade under the same domain name as nytimes.com.
    A phishing website must use a different domain name. For example, if you expect
    to be viewing your bank''s website (i.e., Bank of America), the displayed domain
    name should be consistent with this expectation. In Figure 11.15, it is clear
    that the domain name is webportallogin.com and clearly not bankofamerica.com;
    thus, the URL is that of a phishing website.


    A common trick that phers play is to register websites with names that are similar
    to, but not quite the same as, domain names of legitimate websites. This is known
    as cyber-squatting or typo-squatting. In the following example, can you determine
    which of the (i.e.) following domain names is the correct one for Microsoft?


    +   a. microsoft.com

    b. microsoft.com

    c. microsoft.info

    d. microsoft.com

    e. microsoft-verify.com


    ![](img/785c52f93de89c98051552f6701d2efd_273_0.png)


    FIGURE 11.14 Domain name.'
