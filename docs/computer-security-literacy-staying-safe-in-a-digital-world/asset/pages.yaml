    # 9.3.4 Evil Twin Router


    To provide wireless connectivity for large areas such as an airport terminal,
    hotel, or college campus, many wireless routers are often installed in strategic
    locations to provide broad coverage and are typically assigned the same SSID.
    As a result, depending on the location of the user, one may be within the range
    of several wireless routers at one time. To simplify the process of connecting
    to a wireless network, network management will often only display the SSID of
    the wireless network that has the strongest signal (for all routers with the same
    SSID). That way, the user is provided with presumably the best connection available.
    While helpful in most contexts, such a convenience can and has been exploited
    by attackers.'
