  md: '# Passwords Under Attack ■ 63


    There is an ongoing debate over whether to better manage passwords by writing
    them down in a notebook, for example. Some experts say to write your passwords
    down, while others caution against it. Neither is totally correct or incorrect.
    Password management is a pragmatic exercise for which there are no absolute rules.
    If writing passwords down in a list allows you to choose stronger, more secure
    passwords and if that list can be stored in a safe place, then it in some cases
    may be beneficial. However, if a password list were all in danger of being exposed,
    found by a roommate, or accidentally left in a coffee shop, conventional wisdom
    would suggest that an alternative password management technique would be more
    effective (Section 3.5).


    # 3.3.2 Social Engineering


    In many cases, it is actually much easier for an attacker simply to ask the user
    for a password than it is to attempt to compromise a computer system or perform
    a guessing attack. In such activity, known as social engineering, an attacker
    will often call an unsuspecting victim, perhaps posing as a corporate IT worker
    in a pickle or as a graduate student from Yale conducting research for a dissertation.
    After providing a convincing backstory to make the fake identity, the attacker
    then needs to claim the victim''s password for one reason or another. If the victim
    is fooled and reveals the password to the attacker, the password is no longer
    a secret.


    Legitimate companies will never phone or email customers to ask for their login
    credentials. Just as you would not give the keys to your home to a person sitting
    next to you on a bus, you should not give your password to a stranger who solicits
    it, no matter how convincing his or her story may be. Phone-based solicitation
    of passwords is just one example of a much larger class of social engineering
    attacks. With respect to particular computer security, social engineering and
    its many types of attack require a chapter of their own (Chapter 11).


    # 3.3.2.1 Phishing


    One of the most prevalent and effective ways for a cyber criminal to steal a person''s
    username and password is through a phishing attack—a form of social engineering.
    Phishing is similar to its homophonic counterpart, in the sense that the attacker
    sends “bait” in the form of phishing emails that appear to come from trusted institutions
    like a bank. As shown in Figure 3.7, Phishing Phil sends a phishing email to Alice
