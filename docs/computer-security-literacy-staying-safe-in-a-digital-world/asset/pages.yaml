    devices are produced every year, most of these computers do not represent targets
    for hackers or malware as these computers do not process or store confidential
    information. The concepts presented in this book narrowly focus on personal and
    nonpersonal computers that process our private and confidential information and
    therefore represent a security risk.


    For the purpose of discussions about practical computer security, a general computer
    is considered to have the basic four-layer structure (hardware, OSs, applications,
    and users) shown in Figure 2.1. Each of these layers is described subsequently.


    # 2.2.1 Hardware


    The designation hardware refers to the collection of physical components used
    to create a computer. This collection may vary from computer to computer, depending
    on the computing device''s intended use. Figure 2.2 depicts a diagram of the hardware
    components likely to be found in a typical computer. Correspondingly, Figure 2.3
    shows the physical representation of the items presented in Figure 2.2.


    As shown in Figures 2.2 and 2.3, the "brains" of the computer is the central processing
    unit (CPU), the CPU responsible for executing the instructions provided by software.
    The CPU is connected to memory (i.e., RAM) that stores the instructions (i.e.,
    software) to be executed by the CPU. In most computers, the CPU, memory, and other
    hardware devices are located on a physical structure called a motherboard whose
    printed-circuit configuration interconnects many of the hardware components used
    in the computer. The hard drive and the CD-ROM/DVD drive are two other hardware
    elements found in a typical computer. The hard drive is used to store both collections
    of data (data files) and


