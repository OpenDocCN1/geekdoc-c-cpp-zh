    # 14.3 DEFENSE-IN-DEPTH TASKS


    Well-managed computer security hygiene requires that one perform daily, weekly,
    and monthly security exercises to keep their defense-in-depth strategy current.
    This section provides a summary and quick reference for such tasks that should
    continue to be performed after completion of this book.


    On a daily basis:


    +   1. Perform either a file backup of new documents or a system backup. Failures
    and malware infections often occur at the most inconvenient times and can result
    in complete loss of availability for the information stored on your hard drive.
    A daily routine backup schedule prevents many different scenarios and is a necessity
    for maintaining good computing hygiene.


    +   2. Update virus signatures. Antivirus vendors distribute virus signatures
    on a daily basis. Remember to detect the most current malware, your antivirus
    software needs the most current virus signatures. Without a daily update, new
    malware strains have the potential to infect your computer and operate unrestrained.


    On a weekly basis:


    +   1. Ensure that all software is up to date and patched. In the past, malware
    has often been highly successful because people were remiss in updating their
    software—both applications and operating system—and installing patches in a timely
    manner. To prevent malware infections and drive by downloads, it is imperative
    that you check your operating system, web browser, and frequently used applications
    (office suite, PDF viewer, etc.) at least once a week to ensure that they are
    up to date and properly patched. An alternative is to schedule operating systems
    or applications to check for patches on a weekly basis.


    +   2. Perform a quick scan or full scan with antivirus software. As part of your
    weekly computing routine, schedule time to perform a quick scan or complete system
    scan with your antivirus software to verify that your computer is void of malware.
    Before performing the scan, equip your antivirus software with the most recent
    virus signatures.'
