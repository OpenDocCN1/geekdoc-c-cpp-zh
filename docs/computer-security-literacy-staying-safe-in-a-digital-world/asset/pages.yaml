  md: '# CHAPTER 4


    # Email Security


    # 4.1 INTRODUCTION


    Email is one of the most common Internet applications and is widely used for both
    business and personal communications. As email has become an integral part of
    our daily lives, it has also given attackers a means to easily target and contact
    many potential victims, often by sending emails pretending to be someone they
    are not. The first goal of this chapter is to introduce the underlying concepts
    and various components of basic email systems on the Internet. With this knowledge
    in hand, this chapter explores common ways in which the email system can be used
    to target potential victims and how these attacks can be mitigated through security
    best practices. In addition, a handful of email privacy concerns is also discussed.


    # 4.2 EMAIL SYSTEMS


    Email is one of the earliest network applications and one of the first to gain
    widespread use on the Internet. In comparison to the present day, early email
    systems were initially simple programs that restricted users to the options of
    creating, sending, and reading short text messages without supporting file attachments—much
    like modern-day text messaging. Furthermore, early email systems were proprietary
    and generally did not communicate well with each other. As the popularity of email
    grew and the demand for functionality and interoperability increased, the email
    system evolved into the familiar systems of today. Figure 4.1 depicts the two
    primary components of contemporary email systems: the Message Transfer Agent (MTA)
    designed to store and transport email messages'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 90 Computer Security Literacy Staying Safe in a Digital World


    Application-based UA: Outlook, Thunderbird, etc. Web-based UA: Gmail, Hotmail,
    etc.


    ![](img/785c52f93de89c98051552f6701d2efd_115_0.png)


    FIGURE 4.1 Email system components.


    across the Internet and the User Agent (UA) that enables users to manage email
    messages.


    # 4.2.1 Message Transfer Agent


    Because the electronic mail system was patterned after the ordinary postal mail
    system, an understanding of the email system can be gained through comparison.
    As shown in Figure 4.2, MTAs are similar to mailboxes in that they are responsible
    for both sending and receiving email messages. In place of postal carriers, MTAs
    communicate with each other using the Simple Mail Transfer Protocol (SMTP), and
    an email may be routed through several MTAs on its journey from sending MTA to
    destination MTA. Each individual MTA also maintains its own file storage system
    for inbound mail not picked up by the receiver, and for outbound mail waiting
    to be delivered. Except for spam filters and antivirus scanners, MTAs do not need
    to open emails to route a message to its final destination.


    Like a mailbox or post office box, emails can be delivered or picked up by the
    user. This type of storage system enables users to receive and accumulate emails
    when they are not logged into their email accounts. Just like the need for a key
    to a post office box, a user must first authenticate to the MTA by providing a
    correct'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Email Security ■ 9


    Application-based UA:

    Outlook, Thunderbird,

    etc.


    Web-based UA:

    Gmail, Hotmail,

    etc.


    ![](img/785c52f93de89c98051552f6701d2efd_116_0.png)


    FIGURE 4.2 Email versus postal system.


    username and password. The use of authentication provides confidentiality by preventing
    unauthorized users from accessing one’s emails.


    The sending of an email is also very similar to putting a letter in a mailbox.
    As in the postal system, outbound email is not authenticated, meaning that one
    does not need to supply a username and password to send an email from an MTA.
    Furthermore, one can place a letter in a mailbox with a return address not that
    of the sender for both conventional mail and email. Some, but not all, MTAs check
    the validity of an email’s return address, that is, whether it matches the sender’s
    address, before an email is sent. If this check is not performed, the ability
    to forge the sender email address is created, and from the email receiver’s perspective,
    it is difficult to verify the authenticity of emails by examining the “from address”
    alone (more on this in this further discussion).


    # 4.2.2 User Agents


    Another major component of an email system is the User Agent (UA), whose function
    is to support interaction between the user and the MTAs. The UA is generally the
    most familiar aspect of the email system for many'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 92  Computer Security Literacy: Staying Safe in a Digital World


    people since its capabilities are visible to the user. The UA controls access
    to each individual user''s email account and allows one to create, send, and generally
    manage email messages. As shown in Figures 4.1 and 4.2, a UA can take on one of
    two predominant forms: an application-based UA accessed as a dedicated desktop
    application (e.g., Outlook, Thunderbird, or iMail) or a web-based UA accessed
    via a web browser (e.g., Gmail or Hotmail).


    Using a dedicated application-based UA like Microsoft Outlook (or Outlook Express)
    is similar to having mail delivered directly to your home. To access email from
    such a system, each user must authenticate to the email service MTA to retrieve
    the user''s emails to their desktop computing environment. Like a home mailbox,
    this type of mail system will hold one''s mail at an MTA until the user is able
    to retrieve it. In this case, the retrieval of one''s email involves using the
    UA to download emails to one''s computer. This type of UA also maintains local
    storage to help each user manage email messages offline on his or her own computer.
    Because retrieved emails reside on a physical computer in the user''s space, an
    application-based UA allows one to access already downloaded emails even if the
    computer is not currently connected to the Internet.


    The second common method for accessing a UA is through a web browser. In this
    case, the UA is not an application running on a computer, but instead resides
    on a server owned and operated by an email service provider (e.g., Gmail) accessed
    via the Internet using a web browser like Internet Explorer or Firefox. Getting
    access to a web-based UA requires that the user first provide authentication (username
    and password) to his or her email provider. Using this type of UA is similar to
    having your mail delivered to a centrally located post box and gaining mail by
    requesting one message at a time, much like requesting a web page. Unlike the
    desktop application version of the UA, emails in this system do not reside locally
    on your computer but are instead stored on the email provider''s servers (i.e.,
    in the cloud). This provides the capability to view one''s emails from many different
    Internet-connected computers. It should also be noted that web-based email accounts
    provide support and access to application-based UAs.


    The UA provides the user with many useful capabilities that, as will be discussed,
    have security implications. Examples include capabilities for attaching documents
    to outbound email, viewing documents attached to inbound email, saving documents
    on the user''s computer, and addressing, replying, and forwarding messages.


    *'
