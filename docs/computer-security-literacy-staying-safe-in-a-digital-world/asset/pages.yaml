  md: '# Computer Security Literacy Staying Safe in a Digital World


    information in a matter of hours. Adding to the threat, hardware key-loggers possess
    enough storage to record keystrokes for up to a year’s time.


    Software key-loggers, on the other hand, are malicious software programs that
    perform the same function of recording keystrokes but instead insert themselves
    into a computer’s operating system as spyware. In comparison to their hardware
    counterpart, software key-loggers are not restricted to external keyboards connected
    via cords and thus are also threats to laptop users. Furthermore, unlike hardware
    key-loggers that require the attacker to physically insert and remove the device,
    software key-loggers can be installed and used to relay stolen information back
    to the cyber criminal via the Internet. The attacker can thus avoid being in physical
    proximity to the crime scene.


    The threat of key-loggers is the motivation of why you should strongly refrain
    from typing passwords or other sensitive information on computers. This statement
    is valid for any computer found in a store, library, hotel lobby, or coffee shop
    and pertains to friends’ or coworkers’ computers. The same is true for your own
    computer if you believe to be infected with malware (or malware in Chapter 5).
    There is no telling what type of key-logging malware might be installed on an
    unsecured or untrusted computer, and typing a password on such a computer could
    likely result in a loss of password secrecy.


    # 3.3.4 Wireless Sniffing


    Analogous to discovering a secret by eavesdropping on a telephone conversation,
    the act of sniffing data as it travels to and from a computer over a wireless
    Internet connection (Chapter 9). In a sniffing attack, hackers are able to use
    a laptop and readily available free software programs to enable the laptop to
    become a listening device for all Internet traffic to and from a wireless router
    (Figure 3.9). Attackers are able to see both what is submitted to a website (i.e.,
    username and password) and what web requests may return (i.e., the contents of
    an email). To the attacker who is sniffing wireless traffic, it is almost as if
    the attacker is sitting behind you, watching every move you make on the web over
    your shoulder. If such an act were, however, carried out in a more literal sense—an
    attacker was able to physically watch a victim type their password—this loss of
    password confidentiality is known as shoulder surfing. The threat of shoulder
    surfing, especially in busy coffee shops or on an airplane, is a real danger as
    some people are adept at this skill.'
