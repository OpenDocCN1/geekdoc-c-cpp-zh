    stolen before a fraudulent act, the credit card owner is not liable for any of
    the fraudulent charges that ensue (Figure 8.2). If a credit card owner notices
    a fraudulent charge on or her monthly bill, he or she has up to 60 days from the
    bill issue date to send the creditor a written dispute regarding the fraudulent
    charges. Within this 60-day period, the credit card owner is liable for a maximum
    of $50 for the fraudulent charges. If a fraudulent charge has not been identified
    before the 60 days elapsed, credit card owner becomes liable for all and all damages.
    In reality, though, card companies or banks will often waive such fees or liability
    costs for the credit card owner.


    Debit cards, on the other hand, are protected under the Electronic Funds Transfer
    Act (EFTA). Under the EFTA, debit card owners have only two business days to dispute
    a fraudulent charge, following which their maximum liability increases from $50
    to $500 (Figure 8.2). After 60 days, just like for credit card owners, the liability
    for debit card owners becomes unlimited. The real question is not whether one
    should use a credit card or a debit card when shopping online, but why one would
    use any method of payment other than a credit card given the protection in payment
    procedure that is afforded by law to the credit owner.


    # 8.2.3 Single-Use Credit Cards


    To provide enhanced security and to reduce the anxiety people feel when disclosing
    a credit card number, many credit card issuers provide a free service for their
    customers that allow them to use virtual credit card numbers for online transactions.
    A virtual credit card number is a temporary credit card number randomly generated
    by the credit card issuer on behalf of the card owner. The user of the virtual
    credit card service does not actually receive a physical card but receives a virtual
    number for temporary use. Users of virtual credit cards are able to set the virtual
    card''s purchase limit, expiration date, and number of uses. They can also limit
    the use of the card to specific online merchants if they so choose.'
