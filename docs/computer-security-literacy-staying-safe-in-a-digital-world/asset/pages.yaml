    # 5.3 HOW DO I GET MALWARE?


    This section discusses the different ways in which a computer can become infected
    with malware. The purpose of this section is not to use scare tactics to compel
    you to take immediate actions or drastically alter your computer habits, but instead
    to highlight what is possible, how malware spreads, and what actions could result
    in a malware infection. In the context of the nondigital world, the knowledge
    that there is an increased risk of contracting a biological infection by touching
    public door handles does not stop many of us from performing such actions. However,
    it certainly does help to understand the risks that we are taking and the most
    effective way with which to deal with these risks.


    # 5.3.1 Removable Media


    Before it became commonplace to connect computers together to form networks, the
    primary means by which malware was passed from computer to computer was by way
    of floppy disks. Malware of this nature did not spread as a file stored on the
    floppy disk but instead as malicious code resident in the floppy disk that was
