    # 11.4.1 Reading a URL


    Just as a mailing address represents a unique and specific location in the physical
    world, a URL denotes a unique and specific web document address in the cyber world.
    A URL (i.e., http://www.google.com/) is nothing more than a cryptic set of instructions
    that enables your computer—with the help of the Internet—to send and receive web
    documents and information to and from other computers and servers connected to
    the Internet.


    Unlike webpages of the early 1990s, many webpages today are no longer passive
    documents from which one simply reads text or pictures. Today''s web (Web 2.0)
    represents an interactive experience in which we are frequently submitting information
    (i.e., passwords, credit card numbers, etc.) into webpages that are then routed
    through the Internet to other computers and servers. In this context, the URL
    is the location on the Internet to which you are sending your personal and private
    information. Tricking you into entering your private information into a phony
    website designed to look like a legitimate website is at the heart of what phishing
    attacks are all about. Being able to read a URL successfully can be either a first
    line of defense before one determines whether to click on a URL or a last line
    of defense before one reveals confidential information to a phony website.


    Figure 11.10 provides an example used in the next sections to demonstrate how
    to break down and better understand the purpose and significance of each part
    of a URL.


    # 11.4.2 Protocol


    When browsing the web, there are two predominant protocols (Hypertext Transfer
    Protocol [HTTP] and Hypertext Transfer Protocol Secure [HTTPS])


    ```

    http://www.nytimes.com/pages/technology/index.html

    protocol://subdomain.domain.topLevelDomain/filePath/filename

    ```


