    # 10.4 MALWARE AND PHISHING


    As social networking has increased in popularity, it has garnered much attention
    from scammers, phishers, and malware distributors. This is due to the very principles
    that have made social networking so popular: People want to be social online.
    In this context, social means generating content and interacting with content
    generated by others by clicking on almost anything and everything. Unfortunately,
    not all content on social networking sites is what it appears to be, and errant
    clicks can result in malware infections and identity theft. This section discusses
    the methods that cyber criminals use to exploit the common uses of social networking
    and why these methods have been successful.


    # 10.4.1 Koobface


    First appearing in 2008, the Koobface worm (anagram for Facebook) have become
    the most notorious malware spread via social networking to date. Koobface targets
    users on Facebook, Myspace, and Twitter, among other services, and it infects
    both Macs and PCs. Although the threat of Koobface has subsided as late—a trend
    that could be reversed at any time—it provides an apt case study as it epitomizes
    how malware can be spread via social networking sites.


    To a potential victim, the threat of the Koobface worm first appears as a message,
    tweet, or post from a friend (someone who the victim already knows), similar to
    what is shown in Figure 10.2. Malicious messages are effective because they use
    social engineering tactics to directly target the human vulnerability of curiosity
    by purposefully crafting enticing messages related to recent events or scandalous
    pictures.'
