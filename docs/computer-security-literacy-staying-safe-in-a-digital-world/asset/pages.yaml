  md: '# Appendix B: Basics of Cryptography ■ 327


    # B.5 MODERN SYMMETRIC KEY CIPHERS


    In 1976, the Data Encryption Standard (DES), a symmetric key encryption algorithm,
    was adopted as the federal standard. DES uses a 56-bit (7-character) key and uses
    a block size of 64 bits (8 characters). DES is ideally suited for the encryption
    of computer data since it works with individual bits of information and not just
    letters of the alphabet. At one time, DES was considered to be uncrackable, but
    as computers have become faster, this is no longer the case. DES was in widespread
    use until around 2002, when the Advanced Encryption Standard (AES) was adopted.
    AES uses larger keys (128, 192, or 256 bits) with a block size of 128 bits. AES
    is considered at this time to be practically immune to cryptanalysis and is presently
    used in most computer and network systems requiring encryption.


    One of the main security issues with symmetric ciphers is the strength of the
    key used to encrypt the messages against cryptanalysis. In many respects, the
    strength of a cryptographic key is very similar to the strength of a password
    against a brute-force attack, as discussed in Chapter 3, Passwords. Differently
    from passwords, which are based on alphabetical characters, cryptographic keys
    operate on bits, 1s and 0s (8 bits = 1 byte = 1 character). While the probability
    of guessing a single character in a password is 1/93 (93 possible characters from
    to choose), the probability of guessing a single bit in a cryptographic key is
    only 1/2 (either a 1 or a 0). While this might lead one to believe that passwords
    are composed of characters more resilient to guessing cryptographic keys, this
    is not the case. Consider an eight-character password. The probability of randomly
    guessing the password is (1/93)^8 = 1/5.6E15. Now, consider an eight-character
    cryptographic key. The probability of randomly guessing the key would be (1/2)^64
    = 1/1.8E19. Although the probability of guessing a single bit is much higher than
    that, the significantly longer key length makes a cryptographic key much harder
    to guess. Each additional bit added to a cryptographic key actually doubles the
    number of keys an attacker must guess. As a result, the difference between a 128-bit
    key and a 256-bit key is not twice as much for the attacker but actually 2^128
    more for the attacker. Needless to say, the longer the key length, the more resilient
    is the implementation of DES or AES against cryptanalysis or brute-force guessing
    of the encryption/decryption key.'
