  md: '# 136 Computer Security Literacy Staying Safe in a Digital World


    # 6.3.3 Two Types of Firewalls


    There are two types of firewalls: (1) software firewalls and (2) hardware firewalls.
    Software firewalls (also called personal firewalls) are either elements of an
    operating system or are installed on a computer as a separate application. Hardware
    firewalls, on the other hand, are built into a router—a device used as a gateway
    to the Internet. Because both types of firewalls shield customers from the Internet,
    a question that arises is: Do I need to be protected behind both a hardware and
    software firewall? To answer this question, we can apply the defense-in-depth
    concept to this particular context. At the very least, make sure that the software
    firewall residing on your computer is turned on. If your computer is a laptop,
    do not rely on wireless routers at a library or coffee shop to be equipped with
    a firewall to protect your computer from the Internet. If a coffee shop router
    does indeed have a firewall, then your computer is protected behind it. But if
    the router does not have a firewall, at least your own software firewall is enabled,
    and your computer will not be susceptible to network-based attacks. A software
    firewall should always be enabled before connecting to the Internet. Studies have
    shown that computers are probed and attacked within minutes of being connected
    to the Internet.


    In addition to performing the functions already discussed, software firewalls
    residing on a computer also have more enhanced ability to provide an extra layer
    of protection against network-based attacks than do hardware firewalls. The advantage
    is that the software firewall can dictate just which applications on a computer
    can originate messages bound for the Internet. For example, it is often the case
    that applications on a computer may, unseen to the user, access the Internet to
    search for patches or updates. With a software firewall in place, an application
    must first seek the user''s permission to perform such actions on the user''s
    behalf. A hardware firewall does not have this level of scrutiny overgoing network
    traffic and, as a result, treats all outgoing network traffic as legitimate requests.


    In your normal everyday use of a computer, you will likely never see the results
    of the protection that a firewall provides as it is an unheralded security workhorse.
