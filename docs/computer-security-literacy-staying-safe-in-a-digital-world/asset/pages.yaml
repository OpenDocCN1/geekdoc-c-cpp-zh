    # Case Studies


    # 13.1 INTRODUCTION


    Security concepts and principles are often best understood when presented in the
    context of real-life situations. In this chapter, to illustrate practical security
    best practices, many of the key topics discussed throughout the book are applied
    and presented as case studies to situations you might typically encounter in your
    everyday use of computer security. Although these case studies are based on actual
    events, the fictitious characters of Alice and Bob have been cast into the star
    roles.


    # 13.2 UNABLE TO REMOVE MALWARE: HELP!


    Alice is using her computer and notices an unfamiliar application on the task
    bar that keeps displaying pop-up messages indicating that her computer is infected
    with 81 variants of malware. While the program appears to be antivirus software,
    Alice is well aware that it must be a rogue program and clearly not the antivirus
    software she installed on her computer. She suspects that it must be scareware
    (i.e., fake antivirus). To rid her computer of this malware, Alice updates her
    antivirus software to include the most recent virus signatures and performs a
    complete system scan of her hard drive for malware. At the conclusion of this
    scan, the antivirus software did not indicate the presence of new malware, but
    the rogue application on the task bar continues to display unwanted messages.


    The process of removing malware can be a very challenging endeavor, even for the
    security elite. For this reason, it is important to be proactive about one''s
    security and actively practice the defense-in-depth strategy'
  merge: -1
