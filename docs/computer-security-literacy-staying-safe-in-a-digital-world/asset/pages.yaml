    # 8.5.1 Indicators of Trust


    To prevent falling victim to online scams and phishing websites, there are a few
    “indicators of trust” that one can search for on a retailer’s website or in one’s
    own personal web browser. The presence of these indicators provides a higher degree
    of confidence that one is indeed shopping at a reputable and secure website.


    +   - URL: Ensure you have traveled to the webpage yourself by typing the correct
    URL, using a bookmark, or by the coupling of a search engine and a link scanner
    (Appendix C: Web Surfing Security Technologies). Before submitting any financial
    information, verify that the URL conforms to the website on which you expect to
    be shopping (Chapter 11).


    +   - Link Scanner: Check a link scanner indicator to ensure that the webpage
    or domain name has not been flagged as malicious (Appendix C: Web Surfing Security
    Technologies).


    +   - HTTPS: Any time you enter financial information online, make sure that the
    webpage you are viewing is encrypting the web traffic with HTTPS. Confirm that
    the web address bar is blue or green and make sure that the lock icon in the web
    browser is closed (see Chapter 7). Remember that the use of HTTPS only verifies
    that data is encrypted as it travels between your computer and the online shopping
    server, and that the website is indeed what it says it is, whether malicious or
    not. On its own, HTTPS does not guarantee that a website is secure or not a phishing
    website, as many security tip websites and articles coach people to believe.


    If a website accepts financial information but does not make use of HTTPS, that
    is a fundamental security mechanism, and if a company is unable to implement this
    security best practice properly, then it is likely that the company does not place
    a high value on the security of consumers’ information. It is quite possible that
    such a website will also follow other suspect security practices.'
