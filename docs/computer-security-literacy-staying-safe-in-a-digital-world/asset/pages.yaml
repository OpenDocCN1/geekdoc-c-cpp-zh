    # 13.3 SECURELY HANDLING SUSPICIOUS EMAIL ATTACHMENTS


    As has been presented many times throughout the book, attackers use emails to
    target their victims. Whether through a cunning message attempting to induce the
    user to reply to the email, to click on a hyperlink, or open an attachment, such
    attacks have been and continue to be devastatingly effective. When opening an
    email, there are best practices that should be followed to prevent the loss of
    personal information, a malware infection, or in the situation under discussion,
    Bob receives a suspicious email (Figure 13.1), supposedly from the Internal Revenue
    Service (IRS), that contains an attachment asking Bob to disclose a great deal
    of information. What should Bob do?


    Before taking any action, even of opening the email, Bob should first ask himself
    whether he knows the sender of the email or is expecting an email message from
    that sender. If the answer is no, and if the email appears at all suspicious,
    Bob should simply delete the email without opening it. In this case, an unsolicited
    email from the IRS stating in capital letters “TAX EXEMPTION NOTIFICATION” should
    raise red flags for Bob and prompt the action of deleting it. If, on the other
    hand, the sender email address or subject content appear to be familiar, before
    opening the email Bob should ask himself the following questions: (1) Am I expecting
    this email? (2) Could this be malicious? By asking these questions, Bob will be
    in a critical frame of mind before taking further action with respect to the email.
    Even if the email has been sent to Bob by a family member, a friend, a coworker,
    or an acquaintance, Bob should not let his guard down. Many of the most successful
    computer worms and viruses have been permitted to spread by the trust that people
    place in emails and attachments apparently revealed from people they know and
    trust.


    Phishing emails (Figure 13.1) often contain telltale signs that they are malicious
    in nature, and Bob could potentially use these clues to determine the correct
    course of action when dealing with suspicious emails. Despite the highly suspicious
    claim in the email shown in Figure 13.1, at first glance it appears legitimate.
