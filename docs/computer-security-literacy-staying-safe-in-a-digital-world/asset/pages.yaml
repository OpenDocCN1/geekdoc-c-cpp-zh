    practices are used on Internet-connected computers, such schemes are classified
    as adware (i.e., advertising software). For example, the use of online services
    such as Bing, Gmail, and Facebook grant users access to these applications in
    exchange for viewing web-based adware posted within, above, or adjacent to the
    application''s main content area. This basic concept has allowed companies like
    Google, Facebook, and others to generate billions of dollars in profits. In such
    cases, user exposure to adware is an inevitable consequence of using free computer
    services, and users generally regard it, most, as an inconvenience.


