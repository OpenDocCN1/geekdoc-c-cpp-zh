    pharmacy drugs” and everything in between. As a computer user seeking to keep
    your computer free of malware, the last thing you want to do is believe these
    claims and click on hyperlinks in suspicious emails.


    # 11.2.4 Phone Calls


    Social engineering scams are not restricted to the digital world but also exist
    in the real world. Based on the life of a real person, the character of Frank
    Abagnale in the movie Catch Me If You Can is a prime example of a social engineer
    at work. With keen observation skills, confidence tricks, and insight into human
    psychology, Frank impersonates the roles of a teacher, doctor, lawyer, and pilot—in
    the process deceiving a number of people into divulging sensitive information.


    In a manner reminiscent of Franks Abagnale''s exploits, malicious social engineers
    have used conventional phones, often posing as computer security experts. Offering
    a “free computer security check,” these smootalk social engineers attempt to dupe
    their victims allowing the attacker to gain remote access to their computer. This
    enables the attacker to install spyware or a backdoor to the victim''s computer,
    leading to the theft of personal and financial information. Just as you would
    avoid pop-up ads and suspicious emails, do not act on unsolicited phone calls
    from socalled computer security experts and certainly do not give a stranger your
    passwords or your credit card number. A legitimate company will never initiate
    a phone call asking you to give them remote access to your computer, and it will
    not walk you through steps of installing software on your computer from the web.


    # 11.3 PHISHING


    While the previously described attacks use social engineering tactics to distribute
    malware, ultimately leading to the theft of personal information, phishing attacks
    seek to accomplish the same goal, taking a slightly different approach to doing
    so. Phishing attacks try to steal personal information directly by using social
    engineering tactics to mimic trustworthy sources. If trust is gained, the victim
    haphazardly discloses personal information directly to the attacker. This section
    provides examples of ways in which phishing attacks are typically carried out.


    # 11.3.1 Phishing Emails


    Perhaps the most well-known and prevalent form of phishing occurs through the
    use of email. Phishing emails, which are different from spam'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'emails (legitimate, but annoying), seek to obtain your personal and private
    information by tricking you into replying to an email message, installing a website
    that is a malicious façade of a legitimate website, installing spyware on your
    computer (i.e., drive-by-download), or a combination of these techniques.


    Figure 11.5 is a phishing email that relies heavily on social engineering tactics
    to fool your victim into reacting to a “desperate situation.” Although emails
    of this type appear to be sent by someone already known to the receiver, such
    as a son or granddaughter, rest assured that this is most likely not the case.
    What this type of phishing email is relying on is that the victim falls hook,
    line, and sinker for the desperate plea, takes immediate action, and replies to
    the email. An attacker receiving a reply often sends instructions to the victim
    describing the procedure to wire transfer money to a designated account.


    One of the best defenses against this type of attack is to be aware that they
    exist and you should not trust everything you read and receive on the Internet.
    If an email is suspicious, copy part of the text from the email into a search
    engine. Popular email attacks will return results indicating that you are not
    the first person to receive such an email. Also, you should double-check with
    a trusted source concerning the contents of such an email. A call to a family
    member or friend could easily verify whether the email request is bogus. Furthermore,
    if one does reply to an email, ask the requesting person to authenticate themselves
    in trouble by asking a question that only the alleged person therein would be
    able to answer. When presented with such emails or scams, take the time to scrutinize
    the message, especially before wiring money to a nondescript account.


    ![](img/785c52f93de89c98051552f6701d2efd_265_0.png)


    Figure 11.5 Dramatic phishing email.'
