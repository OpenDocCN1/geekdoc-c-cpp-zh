    AdCenter network or by purchasing ad space on sites like Times.com. The act of
    clicking on malverting ad can result in a drive-by download or being taken to
    a website that cunningly tries to sell a phony to steal personal and financial
    information. Because these ads appear on respected, well-known, and trusted websites,
    these ads tend to lull users into a false sense of security.


