    # 2.2.2 Operating Systems


    The OS is a highly complex computer program typically consisting of millions of
    lines of computer code. The primary objective of the OS is to control the basic
    operations of the computer, namely, all the interactions between the hardware
    devices (i.e., hard drive, mouse, USB devices, memory, monitor, etc.), software
    applications, and the user. In many ways, the OS can be thought of as a traffic
    cop—charged with the task of monitoring and controlling multiple concurrent events
    within a computer so that it runs smoothly. The brokering of resources by the
    OS enables applications to run simultaneously while all share the hardware devices
    connected to the computer. The Windows OS, Mac OS X, and Linux are examples of
    popular OSs for personal computers, and they comprise over 95% of the total OS
    market share. While all OSs perform the same basic functions, there are differences
    (Chapter 1) that have security implications to us as the users.


    Because the OS presides over the operations of the entire computer, it is natural
    for hackers or malware to attempt to compromise the OS by exploiting vulnerabilities
    to gain control over a computer and thereby access all of its information. This
    is why OS vendors are constantly providing software patches/updates (Chapter 6),
    typically by wire of Internet downloads, to reduce or eliminate vulnerabilities
    and thus protect computers from hackers and malware. The OS can also protect your
    computer'
