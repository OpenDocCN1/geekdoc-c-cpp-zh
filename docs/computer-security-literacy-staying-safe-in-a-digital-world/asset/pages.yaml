    Once Bob’s computer is connected to a wireless router, he can begin browsing the
    web, engage in instant messenger chats, and check his email. To do this, Bob’s
    computer and the router engage in a series of message exchanges that are broadcast
    wirelessly, hence the term wireless network. Because Bob’s laptop does not know
    the physical location of the router in the coffee shop, it broadcasts Internet
    transactions in an omnidirectional manner so that the wireless router, somewhere
    within the radius of a city block (i.e., a York north-south city block or approximately
    264 feet) from the computer (Figure 9.2), will be able to “hear” the messages.
    Depending on the router and a number of other factors, the maximum transmission
    distance of a router will vary. The wireless broadcasting of Internet transactions
    has security implications and is one of the main risks that one faces when connecting
    to a wireless network.


    # 9.3 WIRELESS SECURITY THREATS


    While wireless networks afford the convenience of untethered wireless access to
    the Internet, they are also accompanied by the threats of sniffing (Section 9.3.1),
    unauthorized connections (Section 9.3.2), rogue routers (Section 9.3.3), and evil
    twin routers (Section 9.3.4). Before discussing the security best practices when
    using and administering wireless networks, we first build on our knowledge of
    how wireless networks work and discuss these threats.


    # 9.3.1 Sniffing


    Similar to eavesdropping on phone conversations, a threat faced when using a wireless
    network is that another computer is able to “sniff” one’s'
