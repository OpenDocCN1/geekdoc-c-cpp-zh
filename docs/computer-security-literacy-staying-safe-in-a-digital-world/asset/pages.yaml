    or the router''s security settings. Thus, in many ways, many people blindly connect
    to public wireless routers without concern for security can be problematic as
    attackers are also able to exploit this blind trust.


    Attackers have been known to create rogue wireless access points in public places
    such as an airport terminal, for example, with an enticing SSID similar to “Free_Airport_WIFI.”
    Establishing an unsecured and inviting wireless network in the presence of a busy
    and laptop-toting crowd creates a trap for potential victims (Figure 9.7). When
