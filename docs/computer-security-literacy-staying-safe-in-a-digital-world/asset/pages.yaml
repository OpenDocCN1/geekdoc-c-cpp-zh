    # 7.2.5 Cookies


    A key issue in the early days of the WWW was that websites did not possess the
    capability to know if two different requests originated from the same user''s
    web browser. Subsequently, websites were not able to track the actions of their
    users and thus were unable to provide any state of history (i.e., if the user
    was logged in or not, user identity or preferences, what the user was doing in
    a shopping cart, etc.) to enhance the user''s browsing experience. The remedy
    to this problem was to allow websites to store cookies—small text files—in their
    users'' web browsers. As a result, web browsers now enable websites (i.e., amazon.com,
    ntimes.com) to read and write information about a user''s web browsing behaviors
    on the user''s computer using cookies. Therefore, when a specific user returns
    to a particular website, the website has the capability to remember who the user
    is, what the user''s past actions were, and the user''s preferences. To curtail
    some privacy concerns, websites are only able to read their own cookies. Thus,
    amazon.com is not able to directly read cookies created by a user''s web browser.
    Because cookies afford both users and websites increased conveniences, it should
    be expected that this trade-off has associated costs.


