    place the computer child uses to access the Internet in a public area in the house.
    Creating an environment where kids feel safe talking to parents about what they
    encounter on the Internet enables parents to detect problems early and can provide
    educational moments. Remember, when children fall victim to online crimes, it
    is typically not their fault. Although older children might possess enough savvy
