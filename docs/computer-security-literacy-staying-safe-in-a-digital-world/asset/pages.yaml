  md: '# 328 Appendix B: Basics of Cryptography


    # B.6 PUBLIC KEY CRYPTOGRAPHY


    In the case of symmetric key encryption, Alice and Bob had to establish a secret
    shared key before they were able to encrypt and decrypt communications, seeming
    to require Alice and Bob to meet in person. What if Alice and Bob are on opposite
    sides of the globe, without a shared key, and need to exchange confidential data?
    Even though cryptography had been used, practiced, and studied for thousands of
    years, this problem eluded cryptographers until 1976, with Whitfield Diffie and
    Martin Hellman introduced the Diffie-Hellman key exchange. Asymmetric encryption,
    often called public key encryption, uses two mathematically related keys (one
    public key and one private key) instead of a single shared key. As shown in Figure
    B.16, Alice''s key is split into two parts: a public key ($A_{public}$) and a
    private key ($A_{private}$). In fact, everyone uses public key cryptography with
    a matched public and private key. As the name suggests, the public key is known
    to everyone and is often used for the task of encrypting a message. The matching
    private key, on the other hand, is only known by its owner, in this case Alice.
    The private key is used to decrypt a message encrypted by Alice''s public key.
    The principle and beauty behind this cryptographic algorithm is that anyone can
    encrypt and send message to Alice using her public key. However, if Alice''s key
    kept private, Alice is the only person that can decrypt the message.


    Figure B.16 demonstrates the functionality of asymmetric cryptography. In this
    case, Bob wants to confess his love to Alice with a love letter but is intent
    on keeping his message a secret from his jealous girlfriend Eavesdropper Eve.
    To encrypt the message, Bob obtains Alice''s public key, available on Alice''s
    public website for everyone to use. Bob encrypts the message "Alice I love you"
    with Alice''s public key and sends the message to Alice halfway across the globe.
    Even if Eve intercepts the message, without Alice''s private key she will be unable
    to decrypt the message. When Alice receives the message from Bob, Alice simply
    decrypts


