  md: '# Social Engineering:

    Phishing for Suckers


    # 11.1 INTRODUCTION


    Just as malware exploits software vulnerabilities, social engineers exploit human
    vulnerabilities to accomplish their goals. Social engineering is the art of manipulating
    people to reveal information or perform actions that are not in their best interest.
    In many ways, it is much easier for a social engineer to trick you into giving
    him or her credit card number or password or install malware on your computer
    than it is for an attacker to accomplish the same goal through other more technical
    means. This is why many current malware propagation methods include some sort
    of social engineering trickery (e.g., Love Bug worm, fake antivirus) to accomplish
    their goals.


    Social engineers are essentially artists who use confidence tricks, among many
    other cunning techniques, to carry out their attacks. As discussed in Chapter
    5, instead of hacking into a corporation from the Internet, one group of would-be
    attackers scattered malware-infested USB (Universal Serial Bus) flash drives in
    the target corporation’s parking lot. By exploiting the human vulnerabilities
    of curiosity and goodwill, the attackers were able to get unsuspecting employees
    to pick up the USB flash drives on their way into work and unknowingly install
    malware on their computers.


    Social engineering is a broad term that encompasses many types of scams—in both
    the virtual and the real worlds—including the more'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# 234 Computer Security Literacy: Staying Safe in a Digital World


    commonly known term phishing. While the predominant focus of this chapter is on
    identifying and avoiding common phishing scams, this also examines how social
    engineering techniques are used to distribute malware—two scenarios that often
    end in identity theft. When applying the defense-in-depth strategy to the mitigation
    of social engineering tactics, user education is often key and sometimes the only.
    The goal of this chapter is to provide basic awareness of common social engineering
    tactics to enable you to identify social engineering attacks and demonstrate how
    to read and analyze URLs (Uniform Resource Locators).


    # 11.2 SOCIAL ENGINEERING: MALWARE DISTRIBUTION


    With an ever-increasing focus on computer security and the ubiquitous use of firewalls,
    malware distributors can no longer rely on the untested exploitation of computers
    via the Internet. In many cases, hackers now must fuel their victims into performing
    an action, opening an email attachment or clicking on a hyperlink, to bypass a
    firewall. To do this, malware distributors use a number of social engineering
    techniques and introduce these attacks into common accounts (i.e., opening emails,
    browsing the web, social networking) that people already perform on a daily basis.
    This section explores ways which malware is distributed under the disguise of
    social engineering—enabling you to recognize and prevent such attacks before you
    become a victim.


    # 11.2.1 Instant Messages


    Like email, instant message programs such as AOL instant messenger, Skype, and
    Facebook Chat provide the means for an attacker to send a malicious message with
    the goal of installing malware on your computer. Coupled with a hyperlink, such
    malicious messages will appear on your computer promising, for example, to show
    you an embarrassing picture of a popular celebrity. If you click on the hyperlink,
    it is likely that your computer will be subjected to a drive-by download of malware
    or another similar attack. Instead of appealing to the human vulnerability of
    curiosity, malware distributors will alternatively use instant message programs
    to attack the human vulnerabilities of urgency and insecurity, as seen in Figure
    11.1.


    Claiming to be from “Update Support,” the malicious message in Figure 11.1 provides
    a prime example of how social engineering techniques are used to fool a victim
    into performing an action that is not in his or her best interest. This malicious
    message uses numerous—perhaps suspiciously'
