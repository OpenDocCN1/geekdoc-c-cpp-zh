    # 2.4.4 Public versus Private IP Addresses


    Unique IP addresses on the Internet are called public IP addresses. Private IP
    addresses are also used in networking to create private networks capable of connecting
    to the public Internet. Every computer within the same private network must have
    a unique IP address, but comput- ers different private networks can have identical
    private IP addresses. A device with a private IP address cannot be connected directly
    to the Internet but is connected to the Internet using a special router called
    a Network Address Translator (NAT). A NAT has two connections: a public IP address
    for its Internet connection and a private IP address for its non-Internet private
    network connection. NATs allow mul- tive computers in a private network to share
    a single public IP address. There are a couple of advantages to using a NAT. First,
    they allow a user to set up a home network with multiple computers using a single
    public IP address. The use of NATs has also allowed the Internet to have more
    computers than the allowable number of public IP addresses. As shown in Figure
    2.14, Bob and Alice are both able to have the same private IP address but have
    different, and globally unique, public IP addresses. There are three private network
    ranges, namely:


    +   10.0.0.0 to 10.255.255.255


    +   172.16.0.0 to 172.32.255.255


    +   192.168.0.0 to 192.168.255.255


