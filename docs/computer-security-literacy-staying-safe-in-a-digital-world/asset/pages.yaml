    of a victim. Some shoulder surfers are quite adept at reading keystrokes as they
    are typed, words off a screen, or even numbers on a credit card. When in a public
    place, it is best to leave confidential transactions for a later time when you
    can be connected to a secure and trusted network and have privacy from those around
    you. For avid travelers, privacy filters for computer screens be purchased to
    help mitigate the threat of shoulder surfing.


    Also, when using a computer in a public space, beware of leaving your computer
    at a table when using the restrooms, buying an item, or stepping outside to take
    a call. Criminals are thieves of opportunity, and many computers are stolen when
    they are left unattended even for short periods of time.


    # 9.5 WIRELESS NETWORK ADMINISTRATION


    As illustrated in Figure 9.9, there are many cost-effective technologies and easily
    deployable methods that one can use to receive an Internet connection into their
    home. To create a wireless Internet network, one typically attaches a router to
    the device in the house that receives the Internet connection (e.g., cable modem),
    or the receiving device serves a dual purpose as a receiver and a wireless router.
    The resulting Wi-Fi network that the wireless router creates is virtually the
    same for each method and independent of how the Internet connection originates
    in the house. As a result, and despite the fact that each type or brand of wireless
    router may be slightly different, the security concerns and administrative security
    controls for Wi-Fi networks remain largely consistent.'
