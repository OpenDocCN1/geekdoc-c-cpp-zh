    or no password at all. Furthermore, the default admin passwords for many brands
    of routers are no secret and are posted on publicly available websites. Because
    of this, it is best to change a router''s admin password during initial router
    setup (Figure 9.10). Failing to change the default admin password would enable
    anyone connected to your wireless router to access the same admin controls, which
    could result in numerous devious deeds, including locking you out of your own
    wireless router. If it is suspected that such an action has occurred,'
