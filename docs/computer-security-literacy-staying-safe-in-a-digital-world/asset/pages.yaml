  md: '# Defense in Depth


    When shopping online, or performing any activity online for that matter, maintain
    the defense-in-depth strategy outlined in Chapter 6. Make sure that you have recently
    performed a backup of your data, apply the most current web browser and system
    patches, enable your firewall, and ensure that your antivirus software is enabled
    and that its signatures are up to date. If you take these steps, the risk and
    potential impact of a malware infection has been decreased, even if you get tricked
    into visiting a malicious website as the consequence of an online shopping activity.


    # Credit Card versus Debit Card


    When purchasing items online, a consumer is afforded the most protection under
    U.S. federal law and in the payment procedure when using a credit card as opposed
    to a debit card. Although credit and debit cards look similar in appearance, they
    differ in payment procedures—the financial steps taken to transfer money from
    the card owner to the online retailer. A credit card allows consumers to buy items
    online, operating on the concept of buy now, pay later. When a purchase is made,
    the credit card issuer pays for it. Every 30 days or so, the credit card issuer
    assesses the credit card owner a bill for the month''s transactions. This payment
    procedure is advantageous to the consumer because if a card number is compromised
    and fraudulent charges are made, the initial money used to pay for such purchases
    has been supplied by the credit card issuer and not by the consumer''s bank account.
    This payment procedure also affords the credit card owner the ability to dispute
    fraudulent charges and withhold payments until fraudulent charges have been investigated.


    Debit cards, unlike credit cards, are not afforded the same protection due to
    the fundamental differences in payment procedures. A debit card is similar to
    an electronic check. If a fraudulent purchase or withdrawal is made with a debit
    card, the money is directly withdrawn from the card owner''s checking account,
    and the financial transaction is made immediately. Due to the speed of such transactions,
    the ability to issue a stop payment to thwart a fraudulent purchase is highly
    unlikely.


    Two separate laws protect credit cards and debit cards, and each of these laws
    affects the card owner''s liability for fraudulent charges. Credit cards are protected
    under the Fair Credit Billing Act (FCBA). Under the FCBA, if a credit card owner
    reports that a card or card number has been'
