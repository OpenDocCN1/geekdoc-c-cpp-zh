    Nancy, Imposter Ivan, Shy Sally, Hiring Hank, Posting Paul, Sharing Sam, and Victim
    Vince.


    # 12.2 THE DIFFERENCES BETWEEN CYBERSPACE AND THE PHYSICAL WORLD


    To set the context for this chapter, ask yourself the following question: How
    is the Internet different from the “real world”? We would argue that many of the
    human threats that lurk on the Internet are not necessarily new, but people generally
    perceive these threats in a different way. For example, start with the way people
    often describe the Internet: People use terms like cyberspace and virtual world.
    Each of these, including the term Internet itself, implies a place different from
    that of the real world. Also, the Internet enables and encourages people to assume
    multiple personas and create alter egos. All these factors can lead people to
    believe that the two worlds (real and virtual) are separate, and actions in one
    have no or little effect on the other. Exploring a few differences in the way
    the virtual world operates relative to the real world would shed more light on
    this issue.


    As previously mentioned, one of the major differences between the real world and
    the cyber world is that your identity or identities do not have to be related
    to your real identity. The Internet creates numerous opportunities for users to
    create profiles, avatars (graphical representations of users or alter egos), and
    online identities. This gives the user a feeling of anonymity and the associated
    ability to act in ways he or she would never act in the real world. Anonymity
    can be both good and bad. Consider the example of Anonymous Annie, who creates
    a profile so she can discuss some personal issues online. Annie uses the anonymity
    of the Internet to talk about private issues that she might not discuss if her
    identity is known. Imposter Ivan, on the other hand, has created an online profile
    pretend to be someone he is not, perhaps a doctor, for the sole purpose of conning
    people out of their personal and private information. If Alice and Ivan meet in
    a chat room, Ivan could use his fake persona to reveal information about herself.
    Depending on the context and motivation, anonymity can be both a strength and
    a weakness of the Internet experience.'
