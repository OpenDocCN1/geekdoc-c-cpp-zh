    # 13.12 BUYING AND SELLING ONLINE


    Many different types of online marketplaces exist on the Internet, and users can
    buy and sell items from the comfort of their homes. While community-based marketplaces
    are certainly not new, the ease and low cost of entry to engaging in online marketplaces
    encourage common and widespread interaction with them. Two types of marketplaces
    are typically used to sell items online. The first is an online marketplace (i.e.,
    eBay, Amazon Marketplace), which allows people to pseudonymously buy and sell
    through a trusted third party (i.e., PayPal or credit card), and the seller typically
    mails the item directly to the buyer. The second type of online marketplace uses
    a method similar to placing an ad in the newspaper (i.e., Craigslist). This type
    of marketplace typically employs a website to facilitate communication between
    buyers and sellers. Differently from websites like eBay, the exchange of merchandise
    and money is managed directly between the buyer and seller and often done in person.
    As with most things in life, with the good comes bad. When selling personal belongings
    online, Alice should observe the same security best practices as if she were putting
    an ad in the Sunday paper.


