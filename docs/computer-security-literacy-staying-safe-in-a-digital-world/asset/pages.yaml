    **Zero-Day Exploit:** When attack code is used to target a system before the vulnerability
    is discovered or known by the security community (i.e., defenders or good guys),
    this action is known as a “zero-day” exploit. Zero-day exploits are particularly
    dangerous because security practitioners are initially defenseless against such
    attacks.


