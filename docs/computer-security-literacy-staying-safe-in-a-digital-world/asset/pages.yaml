    easy way to check. When browsing the web, both a secure carrier (i.e., HTTPS)
    and an insecure carrier (i.e., HTTP) will get your letter (i.e., web traffic)
    to its destination, but only HTTPS provides the added service of confidentiality
    while data is in transit.


