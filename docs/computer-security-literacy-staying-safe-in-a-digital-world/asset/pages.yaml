    As discussed in Chapter 5, a defining characteristic of a worm is that it is able
    to spread over a network without human involvement. One of the ways in worms propagate
    is by performing an automated process of scanning computers on a network for vulnerabilities
    that can be exploited. This process is similar to the actions that a hacker performs.
    However, with a firewall in place, a computer is protected against such network-based
    activity and resulting attacks. The example in Figure 6.3 illustrates how the
    functionality of a firewall protects against such threats.


    +   (1) To gain access to a computer, worms and hackers craft malicious messages
    and send them through the Internet with the hope that the malicious messages are
    able to exploit one or more vulnerabilities on a target computer.


    +   (3) In this case, because the target computer behind the firewall (i.e., Alice’s
    computer) did not initiate any requests either to the worm or to Intruder Trudy’s
    computer, the firewall blocks the malicious messages. Only responses to requests
    that originate from the computer behind the firewall are allowed to travel through
    the firewall. All unwanted and potentially malicious Internet traffic is thus
    discarded by the firewall before it ever reaches the target computer.


