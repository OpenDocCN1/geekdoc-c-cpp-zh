    the physical networks are not necessarily even in the same city.


    As previously discussed, IP addresses are globally unique identifiers assigned
    to devices on the Internet. IP addresses are assigned in blocks assigned to organizations,
    which in turn assign to individual devices. For example, when a consumer purchases
    Internet service from an ISP like Mediacom, Mediacom assigns an IP address to
    its new customer''s computer. The overall assignment of Internet IP addresses
    is controlled, and a few centralized groups allocate block addresses. There are
    two methods for IP address assignment: static and dynamic. In static assignment,
    an address is assigned to a device, typically through manual configuration, and
    address is personally “reserved” for that device. In dynamic assignment, the address
    is determined using a protocol during each Internet session, and a device''s IP
    address may change from session to session. The dynamic method enables an ISP
    to maintain a pool of IP addresses smaller than its actual number of potential
    users and then allocate from this pool to users requesting use of the Internet
    at particular times. This could present a problem if the number of users requesting
    exceeded the maximum pool size, in which case some users would have to wait for
    an address to become available.


    Most computers are configured by default to use dynamic IP assignment and therefore
    can connect to a network without the prior-user configuration necessary when using
    static IP addresses. The Dynamic Host Configuration Protocol (DHCP) is designed
    to support dynamic assignment of IP addresses. Referring to Figure 2.13, it can
