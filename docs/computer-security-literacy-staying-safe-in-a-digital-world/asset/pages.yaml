    Due to the ubiquitous use and reliance on the WWW among computers, attackers have
    spent a great deal of time attempting to exploit both human and technical vulnerabilities
    that coincide with the use of the web. The central focus of these attacks is the
    web browser and the functionalities that a web browser affords to make one''s
    web experience richer, convenient, interactive, and timely. Many of these qualities
