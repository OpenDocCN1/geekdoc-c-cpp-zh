    # 12.3 CONSIDER THE CONTEXT: WATCH WHAT YOU SAY AND HOW IT IS COMMUNICATED


    By examining human communication over time and focusing on the differences between
    oral and written communication, one can see how valuable context and emotion are
    to the meaning of a message. In the distant past, written communication tended
    to be used for keeping historical records, storytelling, or private communications
    between people with established relationships. Oral communication, on the other
    hand, was the primary method individuals used to interact with one another. With
    the advent of the telephone, this distinction still held true. One of the primary
    differences between written and oral communication is that oral communication
    provides individuals with the means to express emotion through tone, volume, inflection,
    and so on. Written communication, on the other hand, does not provide an effective
    method for expressing emotions. This is why authors of fiction typically describe
    the emotional state of a character instead of allowing a reader to discover or
    infer it from textual dialogue.


    When using the Internet as a method of communication, it is important to understand
    that emotion can be difficult to convey via simple text messages. A single message
    might be interpreted differently by each reading it, and without proper context,
    it is possible that a given reader will be unable to interpret the message correctly.
    Take, for example, the simple question, “Why did you leave the party early?” It
    is difficult to tell if the writer posing the question is upset, concerned, annoyed,
    or simply curious. People sometimes try to add emotional content to statements
    by using capital letters or extra characters. The same statement written as “WHY
    did you leave the party EARLY?” could imply that the questioner was either upset
    or perhaps conveying a completely different emotion, that a friend met a really
    good time at the party. Without the proper context, readers of the message are
    left to interpret it in ways they see, which may or may not lead to the correct
    interpretation. Not only is it difficult to express emotion and the level of emotion
    in written text, it is equally, if not more, to extract the true meaning from
    written messages. Furthermore, certain aspects of spoken dialogue, like sarcasm,
    are difficult enough to interpret orally and are almost impossible to fully understand
    in written form. To aid in conveying of expression and emotion through typed text,
    many use emoticons–keystroke representations of faces, such as :) for happy. Even
    with emoticons to assist in the framing'
