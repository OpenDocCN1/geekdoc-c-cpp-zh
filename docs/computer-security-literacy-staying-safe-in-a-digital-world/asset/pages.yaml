    # 9.4 PUBLIC WI-FI SECURITY


    When connecting to a wireless router in a public space (secure or not), users
    beware. It is best to assume that a public wireless network is not secure, and
    that an attacker will be able to sniff all of your wireless traffic. It follows
    that wireless networks in public places should primarily be used to surf the web
    recreationally. Even though interacting with websites that use of HTTPS mitigates
    the threat of sniffing traffic by means of data encryption, as discussed in Chapter
    7, other threats like session hijacking remain a concern. Apart from refraining
    to use public wireless'
