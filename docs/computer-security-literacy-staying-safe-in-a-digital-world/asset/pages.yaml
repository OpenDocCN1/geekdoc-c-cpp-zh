    # 9.3.2 Unauthorized Connections


    When connecting to a wireless router at a coffee shop or public library, there
    should be an expectation that many unknown, and thus untrusted, people are connected
    to the same wireless router. Because of this, one must assume that his or her
    traffic will be sniffed and therefore act accordingly (Section 9.4). This same
    communal sharing of a wireless network, however, should not occur with a wireless
    router that you own and use in your private residence. The term piggybacking refers
    to a user connecting to a private wireless network not intended to be available
    for general public use.


    An attacker who piggybacks connects to a wireless router without permission and
    often even without knowledge of the router''s owner; thus, it is an unauthorized
    connection. Many times, piggybacking is enabled because the owner of the wireless
