    # 3.3.5.1 Brute-Force Guessing


    Brute force is the name given to the first password-guessing attack discussed,
    and this attack is played out exactly as one would expect from the self-descriptive
    title. In a brute-force attack, the attacker simply attempts to guess the password
    by account trying every possible combination of characters until the correct password
    is discovered. Time becomes the most limiting factor in this type of attack. As
    the length and complexity of the password increase, thus also the number of guessing
    attempts that a successful attacker must make, so the amount of time taken to
    guess all conceivable characters. Consider Figure 3.10, which shows the time required
    to guess every password of a given length and with varying character combinations.
    In this example, it is assumed that the attacker is capable of guessing 1 million
    passwords per second—an incredibly ambitious assumption for a web-based login
    site. As in Figure 3.10, increasing the password length and character diversity
    increases the amount of time to guess every password.


    Many corporations providing web-based services are well aware of this type of
    attack and install authentication defense mechanisms. A popular type of defense
    is to lock an account after three—or some other relatively small number—of failed
    login attempts. This defensive scheme to prevent guessing attacks is similar to
    one used in ATMs that consume a debit card after three failed login attempts.
    While this effectively limits brute-force attacks for web logins, it provides
    a potential complication for users who have trouble remembering passwords—an example
    of how security can be at odds with convenience.


