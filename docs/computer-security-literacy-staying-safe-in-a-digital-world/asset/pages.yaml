    # 6.5.4 False Positives and False Negatives


    Antivirus software effectiveness depends on a detection mechanism. In the profession
    of information security, whenever one talks about a detection mechanism, the occurrence
    of both "false positives" and "false negatives" must be addressed. In the context
    of antivirus software, a false positive occurs when an antivirus program incorrectly
    determines that a legitimate piece of software is actually a malware program.
    Depending on just how the antivirus software reacts to errantly flagging a legitimate
    program, the results of this phenomenon can be quite devastating. In 2010, a large
    antivirus vendor inadvertently released a signature that detected a critical Windows
    operating system as malicious and removed it from all the computer systems on
    it was installed. The result of this action set the affected computers into a
    constant reboot cycle, effectively rendering them useless. This particular false
    positive caused thousands of computers, including computers in hospitals, police
    departments, and multinational corporations all over the world, to crash. A false-positive
    event occurred in 2006 when an antivirus vendor released a signature that resulted
    in the detection and removal of Microsoft Excel from its clients'' computer systems.
    Although antivirus vendors rigorously test their signatures before they are released
    to their clients, the threat of false positives, although minimal, will always
    exist.


    The opposite of a false positive, errantly detecting a legitimate program as malicious,
    is a false negative, that is, errantly failing to detect a malicious program as
    such. This type of error is much more common and often results in a malware infection.
    False negatives occur when antivirus software does not have an accompanying signature
    for a specific type of malware. To avoid false negatives, it is imperative that
    antivirus signatures be frequently updated.


