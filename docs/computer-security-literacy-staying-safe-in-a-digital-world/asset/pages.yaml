  md: '# CHAPTER 7


    # Securely Surfing the World Wide Web


    # 7.1 INTRODUCTION


    For most people, the primary method to check their email, shop online, interact
    with friends via social networking, and access many other aspects of the Internet
    is through the World Wide Web (WWW or the web). The common application that is
    used to access such services on the WWW is the web browser. It therefore makes
    sense that hackers, cyber thieves, and other people intent on doing harm would
    target peoples'' common uses of the WWW and the web browser for their wicked purposes.
    Surfing the web exposes users to attacks like drive-by downloads, in which the
    simple act of requesting a webpage can result in a malware infection. Actions
    on the web can also result in the loss of privacy and personal information. This
    chapter shows that a typical web browser is a very complex application that provides
    its user access to data in many different formats. While many of the features
    that a web browser provides are convenient to its users, these same conveniences
    can be at odds with security and privacy.


