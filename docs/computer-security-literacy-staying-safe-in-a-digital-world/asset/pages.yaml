    in your everyday use of computers is in HTTPS. Although the provided example of
    public key cryptography uses people as examples, banks, online retailers, and
    other entities use public key cryptography to encrypt information between themselves
    and their customers. Consider online banking: Do remember establishing a shared
    secret key (i.e., symmetric key cryptography) with your bank before engaging in
    online banking actions? The answer to this question should be “no” because'
