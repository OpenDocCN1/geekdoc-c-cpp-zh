    +   - WPA (Wi-Fi Protected Access) is older and less effective than WPA2 but certainly
    better than WEP (Wired Equivalent Privacy). If WPA2 is not available, WPA should
    be chosen over WEP.


    +   - WEP is the least-secure option but still better than no security at all
    (i.e., disabling the security mode).


    In summary, enabling the security mode on a wireless router provides two security
    benefits that create a secure wireless network. Authentication prevents unintended
    piggybackpackers from connecting to your wireless network; encrypting the wireless
    data prevents against eavesdroppers. It should be noted that these two security
    benefits come hand in hand, meaning that one cannot be enabled without the other.


