    instead to a website showing a login portal similar in appearance to that bank''s
    login page. At this point, if the user enters his username and password or any
    other information what is assumed to be the correct bank''s website, it will be
    sent directly to the attacker. Compounding the problem for the victim is that,
    despite entering the correct username and password for the victim''s actual bank
    account, the login attempt to the fake site will be denied. Unaware that this
    is an attack, this prompts victims to try other frequently used username and password
    combinations and thus gives the attacker not only their bank''s login credentials
    but also other online account credentials.


    Phishing emails are not restricted to only those types described but also exist
    in many different forms. The best way to defeat phishing attacks is to be critical
    of all emails, regardless of origin, and never click on hyper-links in an email
    that promise take you to a website. The best security practice is always to use
    the URL of the site that you wish to visit yourself or use a trusted bookmark.


    # 11.3.2 No Shame Game


    Social engineers are tactless predators seeking to take advantage of people''s
    emotions and sympathy after tragic events. Examples include'
