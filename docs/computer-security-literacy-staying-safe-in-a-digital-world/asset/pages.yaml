    # 2.3.1 Booting a Computer


    When a computer is first turned on, it goes through a process called booting (hence
    the term reboot when a computer is restarted). Figure 2.4 shows the steps involved
    in the booting process.


    In Step 1 in Figure 2.4, the user turns on the computer by pressing the "power
    button" or "on switch." This action causes the CPU to search for a specific program
    to execute. The motherboard (shown in Figures 2.2 and 2.3) is designed to provide
    a "hardwired" and relatively small program, called the Basic Input/Output System
    (BIOS), for the CPU to execute at power-on (Step 2). The BIOS contains a series
    of programs that provide basic access to the hardware and the initial configuration
    of the computer. One function of the BIOS is to load boot code (so-called because
    this is a sort of bootstrapping operation) from a storage device (Step 3).


