  md: '# 152 Computer Security Literacy: Staying Safe in a Digital World


    +   * A firewall is a security mechanism that provides a logical separation between
    a computer and the Internet and prevents against a number of unwanted and malicious
    network-based attacks.


    +   * Firewalls do not perform malware detection and thus do not prevent a user
    from downloading a Trojan horse. Furthermore, firewalls do not prevent against
    user-initiated attacks that lead to phishing attacks or drive-by downloads.


    +   * The main threats that a firewall protects against are network-based attacks
    carried out by worms and hackers that originate from the Internet.


    +   * A software firewall should always be enabled before connecting to the Internet.


    Although effective at blocking network-based attacks, firewalls do not protect
    against nonnetwork attacks such as a virus on a USB flash drive.


    +   * Software patches fix software vulnerabilities that malware and hackers seek
    to exploit.


    +   * It is imperative that software patches for both operating systems and applications
    are applied and installed as soon as they become available as it is likely for
    every patch also exists a type of malware that is able to exploit the same vulnerability
    that the patch seeks to fix.


    +   * The function of antivirus software is to prevent, detect, and remove malware
    from a computer.


    +   * The major limitations of antivirus software are that it can only detect
    malware for which it has a corresponding signature, the process is completely
    reactionary to malware threats, and it takes time between malware is discovered
    and when antivirus vendors release a signature for a client to download.


    +   * Aware of the techniques of antivirus software, on infection malware has
    been known to disable antivirus software or prevent a computer from updating virus
    signatures. Furthermore, some types of malware evolve each time they infect a
    computer to subsequently change their virus signature.'
