    Another aspect of perceived anonymity is that people can act in ways they would
    not real in real life. As discussed further in the chapter, people sometimes say
    things to others while using the Internet they would never say to them in person.
    They will talk to people they do not know and tell them information they would
    never tell a stranger on the bus, for example. It can be said that the Internet
    makes the weak strong, the shy outgoing, and everyone beautiful.


    A characteristic that makes the Internet a different place for the world is the
    speed and ease with which information can be widely shared. In the real world,
    except for television, radio, and mass publication, it is difficult to spread
    information among a large group of people, and it is even more difficult if that
    information is nonverbal (pictures, text, etc.). To distribute information among
    a geographically dispersed group of friends, one would have to rely on making
    physical copies and using physical distribution systems (post office, etc.). On
    the Internet, however, it is much easier to create and distribute copies of pictures
    or text to hundreds or thousands of people. Furthermore, the sheer of dissemination
    on the Internet makes such sharing almost instantaneous. These Internet qualities
    course make it harder to keep information contained within a small group of people.


    There is also a tendency among many to think that if something is read on the
    Internet, it is probably true. Part of this belief stems from the innate trust
    people tend to place in computers and the Internet; they perceive them as objects,
    and objects, in their view, do not deceive. Before the Internet, only a few selects
