  md: '# CHAPTER 3


    # Passwords Under Attack


    # 3.1 INTRODUCTION


    Just as a lock and key are used to protect against unauthorized access to a home,
    passwords provide the same type of access control for computers and online accounts.
    Like the possession of a key, the secrecy of a password is often the only barrier
    that separates the private and confidential information found in bank, personal
    email, and online shopping accounts, to name a few, from those who seek to harm.
    With so valuable information protected by knowledge of a single password, it should
    come as no surprise that passwords are routinely attacked and from every conceivable
    angle. These attacks can be both creative and effective, targeting not only the
    passwords but also password owners, who are often susceptible to errantly disclosing
    their passwords. Being aware of password threats and having the ability to identify
    threats that you and your passwords will encounter is essential for the everyday
    use of information technology (IT).


    When tasked with creating a password, many people are accustomed to rules as those
    shown in Figure 3.1. A common misconception is that, by following these rules,
    one has effectively mitigated all password threats. While these rules are certainly
    important, they alone are not sufficient to achieve sound password security. In
    fact, these rules are only a small piece of a much larger, seldom discussed, body
    of knowledge that composes practical password security. This chapter examines
    the many password threats, how to keep passwords secret, how to choose strong
    passwords, and last but not least, methods to assist in effectively managing the
    many passwords that one needs to remember to function in everyday life.'
  merge: -1
