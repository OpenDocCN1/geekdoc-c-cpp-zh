    # 13.6 SMART PHONES AND MALWARE


    Bob recently purchased a smart phone. While driving home from work one day, he
    hears on the radio that smart phones, like personal computers, are vulnerable
    to malware and phishing attacks. Bob is curious: Do malware and phishing attacks
    really exist for smart phones? If so, how can he go protecting the integrity of
    his phone and the confidentiality of his personal information?


    Cell phones and smart phones are more than just phones; they are actually computers
    with phone-calling capabilities. When examined closely, many cell phones can be
    found to have a CPU (central processing unit), memory, permanent storage, an operating
    system, input/output ports, a monitor, a keyboard, wireless Internet cards, and
    so on, so it should come no surprise that smart phones (and tablet computers)
    suffer from the same security threats as desktop and laptop computers. With digital
    computers, the two most significant threats for cell phone users are malware and
    phishing. For the sake of brevity, this case study focuses primarily on cell phone
    use, but the same threats and security practices also apply to tablet computers.


    While the volume and diversity of malware seeking to compromise cell phones is
    nowhere near focusing on traditional computers, malware for cell phones is a real
    threat of increasing significance. The primary means for malware to adversely
    affect cell phones is through the downloading of Trojan horses—seemingly legitimate
    cell phone applications (i.e., apps) containing embedded malware. While the victim
    may think he or she is installing a “Super Ringtone Maker” app, the person may
    also be installing malware. Consequences of smart phone malware infection range
    all the way to theft of personal information stored on the phone (number, contacts,
    key-logging, etc.) to sending text messages to premium numbers, resulting in incurring
    financial consequences without the phone''s owner''s knowledge.


    The decision regarding whether to install an application on a cell phone is ultimately
    in the hands of the cell phone user. To avoid downloading a malicious app, stick
    to familiar applications with positive reputations and'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'only download apps from well-known app marketplaces (i.e., Android Marketplace,
    Apple App Store). Although a more reputable source, even well-known app stores
    have been known to distribute malware-infected applications. If you are not familiar
    with an application, carefully research it before downloading it on your phone.
    Also, beware of malverting ads that attempt to trick phone users into installing
    malicious applications. As a security practice, it is best not to install unsolicited
    applications on your phone. Last, like computers, cell phones are also susceptible
    to drive-by-downloads in which the simple act of viewing a malicious webpage is
    enough to install malware on a cell phone.


    As is the case with desktop or laptop computers, it is good security practice
    to install antivirus software on your phone, especially if you frequently download
    apps. Antivirus software for cell phones has been available for some time, and
    many vendors offering antivirus software for personal computers, such as AVG,
    Symantec, and McAfee, also make antivirus software for cell phones—sometimes even
    free antivirus apps. The same limitations discussed in Chapter 6 for personal
    computer antivirus protection apply to cell phone antivirus software as well;
    namely, antivirus software cannot detect a specific type of malware if it does
    not have the corresponding signature.


    Regardless of the cell phone provider, cell phone model, or cell phone OS (operating
    system), cell phone users are as susceptible to phishing attacks in the same way
    as laptop-computing users. If a cell phone can open an email or text message or
