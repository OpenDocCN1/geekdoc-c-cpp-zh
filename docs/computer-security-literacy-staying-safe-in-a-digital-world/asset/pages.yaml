    The time between attack code production and widespread attacks can also vary depending
    on the attack code type and its distribution method.


    As is often the case, attack code is made available on the Internet for other
    users to download, use, modify, and improve the original design. Attack code is
    like any other software that goes through a design process, and the attack code
    itself may ironically have vulnerabilities that can be exploited by other attack
