    # 11.6 SUMMARY


    As Bruce Schneider has said, "Only amateurs target systems; professionals target
    people." There is a great deal of truth in this statement since it is often much
    easier for a hacker to use social engineering tricks to dupe a victim into divulging
    sensitive information or installing malware onto a computer than it is for the
    hacker to compromise the victim''s security mechanisms (i.e., a firewall). One
    of the best defenses—and sometimes the only defense—against social engineering
    attacks is user education. Social engineers are very tricky, and the tactics they
    use purposefully exploit known human vulnerabilities. Understanding the purpose
    of these attacks, and how they can be defeated are important first steps toward
    strengthening your defense-in-depth approach to practical security.


    +   - Social engineering is the art of manipulating people to reveal information
    or perform actions that are not in their best interest.


    +   - Many malware distribution schemes (instant messages, fake virus, emails,
    and phone calls) incorporate social engineering tactics to bypass security mechanisms
    (i.e., firewalls) and to increase the success ratio.


    +   - Fake antivirus or scareware epitomizes social engineering work—it attempts
    to trick a victim into installing or paying for malware that did not previously
    exist on the victim''s computer.


    +   - Perhaps the most common type of social engineering in the digital world
    is phishing attacks, in which a criminal attempts to trick a victim into disclosing
    private information to a source the victim is tricked into believing is authentic.


    +   - Cyber criminals who construct phishing emails prey on catastrophes, hard
    times, current events, and peoples'' goodwill to help others. Be vigilant for
    phishing emails after natural disasters and especially during the holidays.


    +   - Spear phishing is a type of phishing attack that targets a specific individual,
    often by using their name. Personalizing phishing emails is intended to fool the
    victim into thinking the sender knows them and thus the email must be legitimate.'
