    use. The Windows operating system, for instance, has a significantly larger market
    share than Mac OS X. As of May 2012, the Windows operating system composed 92.5%
    of all desktop computers, while Mac OS X represented only 6.5%. Cyber criminals
    are often thieves of opportunity and prefer to target computers for which there
    is a high probability of stealing or damaging something of value. This does not
