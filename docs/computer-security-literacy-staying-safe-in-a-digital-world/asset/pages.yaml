    Targeting a specific victim in a spear-phishing email can go beyond the victim''s
    name, and this is one why public information sharing can be at odds with security.
    Public information provides a social engineer with ammunition for crafting- a
    compelling spear-phishing message. For instance, if your Facebook profile is public
    and it can be seen that you clearly like fantasy baseball and the Minnesota Twins,
    then a spear-phishing email addressed to you on the topic of fantasy baseball
    and the Minnesota Twins might seem innocent, thus making it more likely for you
    to take action, such as clicking on a malicious hyperlink. Such an attack, for
    example, may ask you to set up a new account to receive special and free insider
    statistics. In this case, the attacker is hoping that you establish the “new account”
    with the same username and password that you use for your email account or bank
    account. This is a prime example of why you do not want to use the same username
    and password combination on multiple websites.


    **SMishing**: Similar to phishing, SMishing is the act of phishing through Short
    Message Services (SMSs), more commonly known as texting. The tactics employed
    by those SMish are very similar to those of fishers (i.e., URLs or phrases like
    “act immediately”), and the same defense mechanisms of not replying to any such
    messages also apply to SMishing Attacks. Popular SMishing attacks include a text
    message that one has won a Walmart gift card. To claim the prize, the victim is
    led to a website and submit private information.


    **Whale phishing**: When an attacker targets high-ranking corporate officials,
    executives, and chief executive officers (CEOs) (i.e., big fish), this type of
    phishing is known as whaling.


    **Vishing**: Vishing is nothing more than a voice phishing (i.e., vishing) attack
    that occurs over a landline phone, cell phone, or voice call over the Internet
    (e.g., Skype).


