    # 8.2 CONSUMER DECISIONS


    By most accounts, shopping online is a voluntary activity. This means that consumers
    make decisions about where they are going to shop, what information they are going
    to disclose, and how they are going to pay for the items that they desire to purchase.
    While it is true that not all can go wrong when shopping online is the fault of
    the consumer (sometimes the disclosure of financial information is the fault of
    the online retailer), there are a number of decisions that a consumer can make
    that will decrease the risk of accidentally disclosing financial information.


    ![](img/785c52f93de89c98051552f6701d2efd_207_0.png)'
