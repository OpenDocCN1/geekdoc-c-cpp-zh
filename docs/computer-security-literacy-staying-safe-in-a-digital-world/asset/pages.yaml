    When an online purchase is made, the user presents the virtual credit card number
    to the online retailer, and the subsequent transaction appears on the user''s
    normal credit card bill with the virtual number listed next to the purchase. If
    the transaction details are compromised, or if an online retailer''s credit card
    database is hacked, the use of a virtual credit card decreases the amount of damage
    that an attacker can inflict. While the benefits of a virtual credit card are
    quite obvious, the added steps needed to increase security when shopping online
    is at odds with convenience. Because of this, virtual credit card numbers are
    not widely utilized even though this service has been available for quite some
    time.


    # 8.2.4 Passwords


    Many online retailers either require or give consumers the option to create password-protected
    accounts to make purchases. For the customer''s convenience


    # 8.2.5 Do Your Homework


    Just as the Internet provides numerous options to choose online retailers, it
    also provides the means for researching these same retailers. Generally, the safest
    choice is to shop with merchants that you know and trust and have well-established
    reputations. If you are faced with the decision of whether to purchase an item
    from an unknown online retailer, be sure to do some research about the company
    before making a purchase. A reputable company will list one phone number that
