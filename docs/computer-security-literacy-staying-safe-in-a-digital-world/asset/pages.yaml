    your defense-in-depth security strategy intact.


    # 14.4 CHAPTER SUMMARIES


    Now that you have completed the book, this section reviews the main points of
    each individual chapter.


    # Chapter 1: Introduction


    With respect to practical computer security, you, the user, often play the most
    important role in protecting your own security by the decisions you do or not
    make. As we individuals continue to rely heavily on personal computers to complete
    everyday tasks, personally taking an active role in the security of our own computer
    environments will continue to grow in importance. Cyber criminals and malware,
    the two most likely sources of attacks, are thieves of opportunity and typically
    do not target specific individuals but rather the "lowest-hanging fruit" on the
    tree. To protect the confidentiality, integrity, and availability of your data
    and computing environments, it is necessary to understand both human and computer
    vulnerabilities, how attackers exploit such vulnerabilities, and how to invest
    in your own security.


    # Chapter 2: Computers and the Internet


    Computers, through the execution of an operating system and application software,
    allow users to interface with hardware devices. While the'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Moving Forward with Security and Book Summary ■ 31


    actions of opening and executing (i.e., running) software applications are typically
    perceived to be performed only by human users, this is not always true, and some
    applications possess the capability of executing software programs or code without
    user knowledge. While such actions may be useful and convenient, they may also
    allow surreptitious malware to execute and perform actions on one''s computer
    without the user''s permission. In other words, malware can either become you
    or spy on you.


    When one connects a computer to the Internet, he or she is truly connecting to
    a global network. While this may allow a user in northern Minnesota to conveniently
    buy sheepboots from Australia, it also allows a teenager hacker sitting on his
    family couch in southeast England to attack a nuclear power plant in Brazil. The
    ubiquity and ease of access to the Internet continues to be used for both good
    and bad.


    # Chapter 3: Passwords


    The goal of password security is to create strong (i.e., hard-to-guess) and unique
    passwords and keep these passwords a secret against the many threats seeking to
    observe private information. More often than not, the greatest threat to the confidentiality
    of a password is not an attacker attempting a brute-force attack but rather the
    user himself or herself accidentally disclosing a password to the attacker through
    a key-logger or phishing website. In such scenarios, it does not matter how strong
    the password may be because the victim provides the password directly to the attacker
    in clear text. When creating a password or passphrase, the goal is to create a
    strong password but one that can be easily remembered. If you are unable to remember
    passwords effectively, there are a number of password management techniques and
    tools to aid you in this process. Furthermore, it is important not to reuse passwords
    across different accounts. There are many ways that a password can be compromised,
    and the loss of a single password shared by multiple accounts could enable an
    attacker to access all of them using the same credentials. Passwords can be lost
    and used without one''s knowledge, it is good security practice to change them
    often—more so for more valuable accounts—to prevent unauthorized access.


    # Chapter 4: Email


    Because email has become a predominant form of both business and personal communication,
    it is often targeted by attackers. In many ways, the email infrastructure on the
    Internet is analogous to the ordinary postal'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 302 Computer Security Literacy: Staying Safe in a Digital World


    system. Like a snail letter, an attacker, pretending to be a trusted entity, can
    send an email with a spoofed sender address and misleading content to potential
    victims. Enabled by the ease of digital communication, an attacker, at little
    or no cost, can send out hordes of emails to many potential victims in a short
    period of time. For the attacker to be successful, he or she may only need a small
    percentage of success.


    There are two predominant forms of email attacks. The first type is the phishing
    email that attempts to trick the victim into divulging sensitive information.
    Phishing emails are crafted to appear from a trusted entity and to entice the
    user to click on a hyperlink linking the victim to a phony website or to respond
    to the email and reveal private information. The second type of email-based attack
    attempts to trick the user to install malware on the user''s computer through
    either drive-by downloads or emails enticing users to open malware-laden attachments.
    Because of such threats, one must proceed with caution when opening an email from
    someone unknown or from someone you know but whom the message is unexpected. Most
    of the most successful email attacks have resulted from compromised email accounts,
    with victims receiving malicious email from people they knew and could trust.


    # Chapter 5: Malware


    It should come no surprise that virtually every action one performs on a computer
    could result in a malware infection. This is why education is such a critical
    component of practical computer security. Consider drive-by downloads, for example.
    Many people are unaware that simply clicking a hyperlink in an email, or in a
    malicious ad on a legitimate website, can result in a malware infection spread
    by code embedded in a webpage surreptiously executing on a user''s computer. Without
    knowledge of the many ways malware can spread, it is difficult to know how one
    can prevent against such attacks.


    The objectives of modern-day malware are quite different from those of more dated
    malware. Today''s malware producers are motivated by profit, and they craft their
    malicious code in such a way that it remains hidden on one''s computer to maximize
    its damage. The task of malware is typically to observe information about the
    victim (i.e., password, credit card numbers, etc.), to present the victim with
    malicious or deceiving ads, or to use the victim''s computer to attack other computers
    (i.e., botnet). Furthermore, malware creators often use their malware to create
    backdoors on their vic'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Moving Forward with Security and Book Summary ■ 303


    times'' computers so that the malware creator can access or download new malware
    to the victim''s computer at a later time.


    # Chapter 6: Malware Defense


    There is no single security mechanism that users can buy or use to protect them
    and their computers against all threats. Instead, practical computer security
    consists of a system of layers, representing a defense in depth. This way, if
    a given security mechanism fails, there are others potentially in place to prevent
    an attack. The essential components of a defense-in-depth strategy are data backup,
    firewalls, software patches, antivirus software, and user education. Each of these
    components has its own strengths and inherent limitations, and each must be maintained
    on a regular basis to minimize the risk of an attack. Central to this defensive
    scheme is user education, the overall goal of this book.


    # Chapter 7: Securely Surfing the Web


    The web browser is the predominant tool used by people in interacting with content,
    services, and applications hosted on the Internet. Accordingly, attackers often
    target web browsers and actions users perform on the web. Chief among attack techniques
    are misleading users by hyper-links. Attackers also exploit the conveniences of
    web browsers afford in automatically opening documents or executing code on behalf
    of the users. While these automatic behaviors can enhance one''s web browsing
    experience, a single errant click of the mouse can accidentally open and execute
    a malicious PDF document, subjecting a user to a potential malware infection.

    in addition to security threats, web browsers can be in conflict with privacy.
    Often, for purposes of convenience, web browsers retain a great deal of information
    about users'' browsing actions. However, if untrusted users access the computer
    or such actions performed on a public computer, this saved information poses a
    risk to privacy and security (i.e., saved passwords, session cookies). To protect
    one''s privacy, it is essential to understand exactly what web browsers store
    on the user''s behalf, how such information can be accessed, and how one can delete
    such information or prevent a web browser from remembering it in the first place.


    # Chapter 8: Online Shopping


    Online shopping is a billion-dollar industry, and it should come as no surprise-
    that cyber criminals have followed the money trail. Because online'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# 304 Computer Security Literacy: Staying Safe in a Digital World


    shopping is a voluntary activity, the decisions shoppers make or do not make often
    determine whether they fall victim to a scam. Applying the same level of shopper
    skepticism as exhibited in the physical world to the cyber world can prevent many
    online shopping scams. Also, when dealing with the online exchange of money, users
    are afforded the maximum protection under U.S. federal law and regulated payment
    procedures when they purchase items with a credit card rather than a debit card.
    When shopping online, stick to reputable websites by navigating to the website
    yourself; ensure that the website uses encryption-protected HTTPS, and provide
    only the necessary amount of information needed to make a purchase.


    # Chapter 9: Wireless Internet Security


    When using an unsecured public network, the information you send over such a network
    is vulnerable to eavesdropping. To mitigate attacks from viewing your sensitive
    data, sensitive information only over an HTTPS (Hypertext Transfer Protocol Secure),
    not HTTP (Hypertext Transfer Protocol) connection, or use a VPN (virtual private
    network) (Appendix C: Web Technologies). Each of these options encrypt your confidential
    data so that if an attacker is eavesdropping on your wireless traffic, the attacker
    will be unable to read or decrypt your communications.


    Most of us are not running a charity service for those who lack their Wi-Fi connection.
    Providing a wireless Internet signal in one''s residence costs money, and allowing
    piggybackers to share network bandwidth decreases the quality of service you receive
    from your paid-for-service. Furthermore, allowing piggybackers to connect to your
    wireless network presents a definite security issue and one that should be avoided
    to prevent the loss of confidential information.


    # Chapter 10: Social Networking


    The pervasiveness of social networking has grown to represent billions of users
    from multiple demographics and in all corners of the world. Despite the obvious
    benefits of social networking, there exist security and privacy trade-offs. Central
    among these trade-offs is the loss of privacy when sharing information online.
    Even information labeled as "private" on social networking sites is only relatively
    so, and so there is nothing to prevent a "friend" from removing shared content
    from a social networking platform and distributing it to whoever he or she pleases.
    Posting information on a social networking site, strongly consider how'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Moving Forward with Security and Book Summary ■ 305


    that information will affect you both now and in the future. Many corporations
    have rejected job candidates based on information discovered online. Furthermore,
    attackers can and have used information posted on social networking sites to mount
    attacks that range from spear-phishing emails to physical break-ins.


    Due to vast number of users, social networking sites have become a key target
    for those distributing malware and performing phishing attacks. When interacting
    with content generated by friends that not everything posted on a social networking
    site may be what it seems to be, and often attackers use compelling messages coupled
    with hyperlinks and videos to trick their victims.


    # Chapter 11: Social Engineering: Phishing for Suckers


    Social engineers are the scam artists of the Internet, adept at tricking users
    into performing actions not in their interests. To accomplish their deeds, social
    engineers exploit human vulnerabilities either by enticing users to install malware
    on their own computers or by convincing users to errantly disclose their confidential
    information. Because these attacks often involve nontechnical components, user
    education is the key defense. An important skill one can use to defeat social
    engineers is to recognize their attacks prior to falling victim to them. This
    often involves considering the context of an attacker''s ploy and developing a
    understanding of how social engineers carry out their attacks. Perhaps the best-known
    form of social engineering is phishing, in which attackers target users, generally
    through emails, to reveal confidential information like bank login credentials.
    In addition to being able to identify phishing ruses, one should also be able
    to read, decipher, and analyze URLs (Uniform Resource Locators) as a key defense
    against phishing attacks.


    # Chapter 12: Staying Online: The Human Threat


    Actions that take place in the cyber world have real-world consequences. Cyber
    bullying and cyber stalking have both emerged as serious threats to children and
    adults alike. With nearly constant access to potential victims through cell phones,
    social networking, and the Internet, the actions of present-day bullies are not
    confined to face-to-face encounters. Furthermore, when dealing with people online,
    one should realize that not everyone is who they claim to be, written messages
    can easily be taken out of context, nothing is private, anything posted on the
    Internet can last'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 306 Computer Security Literacy: Staying Safe in a Digital World


    forever, and one is often held responsible for the content they post online and
    for content others post about them.


    Chapter 13: Case Studies

    Practical computer security is an applied field of study. Because this is the
    case, the real test of the knowledge that you gained while reading this book cannot
    be measured with a standard test but rather when you put the book down and begin
    to interact with technology. Chapter 13 presents a number of case studies in the
    context of security describing situations you will very likely face as a user
    of technology. These case studies provide examples that can be used to share and
    discuss what you have learned with those around you.'
