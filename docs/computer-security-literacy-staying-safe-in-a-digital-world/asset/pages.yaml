    # 10.5 SUMMARY


    When generating content on a social networking site, it is safest to assume that
    any text, pictures, or video that you post will exist online forever. Removing
    such information from the Internet or a social networking site is like removing
    a tattoo. It takes a lot of time, money, and pain, and it may not be possible
    to remove all remnants of past decisions made. Online sites will remove information
    if it is incorrect or slanderous, but not because it is embarrassing or detrimental
    to your career.


    A handful of social networking sites have together accumulated billions of users.
    As of 2012, Facebook alone had over 901 million users and continues to grow. If
    you were in the business of malware distribution or phishing, you would also spend
    your time targeting social networking users. Social networking has countless upsides,
    but like most things in life, with the good comes the bad. Defeating the perils
    of social networking is chiefly done through user education and the defense-in-depth
    techniques discussed in Chapter 6.


    +   * Those who have actively engaged in social networking will inevitably amass
    a digital footprint of online content associated with their name.

    * The word friend has taken on new meaning with with the advent of social networking.

    * Designating an individual as a friend is a form of access control that often
    enables that person to view information considered personal and private.

    * Engaging in online friendships and associations with people who would not be
    considered friends in the real world can have negative consequences.

    * Just as there is no such thing as absolute security on social networking sites,
    there is no such thing as privacy. Content marked as private is only relatively
    private to those who are provided access, and such friends can easily copy and
    redistribute such information.

    * Not all those who seek to be one’s friend online have positive intentions.

    * The inviting nature of social networking makes it easy for one to overshare
    personal and confidential information.'
