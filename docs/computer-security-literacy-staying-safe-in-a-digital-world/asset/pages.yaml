    organized crime on the Internet. Their goal is to make money through attacking
    computers and their respective users. Cyber criminals may be hackers or malicious
    insiders, or they may hire hackers or pay for information. Cyber criminals may
    also use the same tools as script kiddies with the goal of profiting from stolen
    information. This group of malicious actors represents the largest threat to individual
    computer owners. Its members look for information to enable stealing individual
    identities and use such identities to make money. In fact, the cumulative profits
    from cyber crime have recently skyrocketed and are now being considered in the
    same context as illegal drug trade. Many security professionals believe that once
    groups of hackers learned how to make money by attacking computers that the security
    landscape of the Internet was fundamentally changed, and that virtually everyone
    has now been put at risk.


    **Nation-States:** Countries are becoming increasingly dependent on computers
    to conduct many activities, ranging from national defense, media, and public utilities
    to online banking and integrated supply chains. This makes their computer systems
    prime targets during times of conflict. Most nation-states have active cyber-warfare
    groups with goals of protecting themselves and attacking potential adversaries.
    Also, some nation-states use hackers to obtain trade secrets and other information
    from foreign companies and foreign governments with whom they have otherwise-friendly
    relationships. Most nation-states have virtually unlimited resources.


    Now that the threat sources have been defined, the question of, Why should I care?
    can be answered by considering three general categories describing what can happen
    to a victim as a result of a security breach. These general categories can be
    used to help make the point that information security can affect nearly anyone.
    Defending against these threats is discussed in further chapters.


    The first category of threat is called **malware**. Malware is a broad category
    covering malicious software installed on a victim''s computer without the victim''s
    knowledge or consent. Many people are familiar with the'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 16 Computer Security Literacy: Staying Safe in a Digital World


    term computer virus, a form of malware. Malware can cause loss of information
    (confidentiality), alteration of information (integrity), or even loss of the
    use of information or a computer (availability). Malware also has other functions,
    including using the victim''s computer to mount attacks against other computers
    on the Internet. Chapter 5 discusses the many ways in which malware finds its
    way onto a computer.


    The second threat category is disclosure of private information. There are many
    ways, including through malware, that information can be improperly disclosed.
    The impact arising from the loss of information depends on the type of information
    disclosed. Some information may have a monetary value, while other information
    may be personal in nature.


    The third threat category is loss of time, money, reputation, or resources. With
    most attacks, recovery costs time and, depending on the severity of the attack,
    can also cost money. Loss of reputation is harder to quantify, and depending on
    the person involved, can have significant consequences like the loss of employment,
    for example. For companies, on the other hand, such loss of reputation can cause
    long-term harm and even lead to failure and bankruptcy. Loss of resources can
    range from short-term loss of Internet access or use of a computer requiring the
    victim to start again reinstalling the operating system. Loss of resources also
    includes the deletion or accessing of personal or private data, such as pictures,
    tax return documents, and emails.


    The last question that needs to be addressed when discussing threats is, What
    is the value of the resources that we seek to protect? Remember the security tru,"Security
    is a matter of economics." Each individual person needs to determine the value
    of his or her computing assets and information to be protected and subsequently
    to decide the cost of securing it. An easy way to perform such an assessment is
    to state how much you would be willing to pay to recover your information if,
    at this instant, all information on your computer were deleted. For many people,
    the information stored on their computers (i.e., pictures, songs, schoolwork,
    programs, financial documents, etc.) is irreplaceable and invaluable.


    If you do not value your digital information, this does not mean that it is unnecessary
    to provide some level of security for your computer. After all, it is likely that
    you will use your computer to store confidential information like usernames and
    passwords or a credit card number when shopping online—all information you would
    not want an attacker to learn. By the same token, malware can cause damage to
    others if installed on'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# What Is Information Security? ■ 17


    your computer. Malware can also result in your Internet service provider ISP restricting
    your Internet access or may even result in you being accused of a computer-based
    crime. The remainder of the book seeks to provide you with the context to make
    informed decisions about computer security and to stay safe while using your computer
    faced with numerous situations that you are likely to encounter in your everyday
    use of computers and the Internet.


    # 1.8 SECURITY IS A MULTIDISCIPLINARY TOPIC


    There is a misconception that only people who have studied computer engineering
    or computer science populate the field of computer or information security. This
    perception could be further from the truth. Solving the problems of cyber security
    involves more than just dealing with technical issues; there are numerous social,
    political, legal, and economic issues to be addressed. As seen throughout the
    book, both attackers and defenders will use both technical and nontechnical methods
    to achieve their goals.


    Disciplines involved in protecting computers range from hard sciences like mathematics,
    computer science, and computer engineering to other, "soft" disciplines like social
    sciences, business, and economics. The hard sciences are typically involved with
    the creation and maintenance of the technology used to protect information, and
    these are the disciplines involved in the bulk of the security workforce. Disciplines
    like business, statistics, and economics are involved in determination of risk
    and the cost of attacks versus the cost of protection. They are also involved
    in developing appropriate business processes to help manage security. Disciplines
    like psychology, sociology, and political science focus on analyzing the social
    and political aspects of security. They study attackers to better understand why
    they attack and to help understand attacks against people. They also research
    the effects of attacks on individuals or society in general to improve understanding
    of how to better prepare individuals, corporations, or government entities to
    protect themselves.


    # 1.9 SUMMARY


    The prime objective of this book is to focus on the practical methods available
    to users wishing to protect the security and privacy of computer-based assets
    and personal information. While hackers and security companies are major external
    factors, the users, play the most significant'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 18 Computer Security Literacy: Staying Safe in a Digital World


    part in determining the security of our information by the decisions we do or
    do not make.


    +   - Information security is the process of protecting the confidentiality, integrity,
    and availability of personal data from the threats of hackers and malware.


    +   - An objective of practical computer security is to raise the bar high enough
    to greatly reduce the number of threats able to mount a successful attack by employing
    the defense-in-depth strategy discussed throughout this book.


    +   - The ubiquity of networking should make us concerned not only with data stored
    on our personally owned and controlled computers but also personal data that may
    reside on computer systems owned and controlled by others, either commercial entities
    like banks or shopping websites or personal computers owned and controlled by
    other individuals.


    +   - Practical computer security consists of a number of truisms: Security is
    a matter of ethics, security should be composed of layers of defenses, absolute
    security does not exist, security is at odds with convenience.


    +   - Hacker and malware exploit vulnerabilities to gain access to computer systems
    and information.


    +   - Risk is a combination of a computer''s vulnerability to attack, the likelihood
    of attack (threat), and the impact of the attack.


    +   - People''s tendency to ethically act and react differently in computer-based
    environments than they typically have in previous noncomputer contexts has contributed
    greatly to the challenges of cyber security.


    +   - The malicious actors on the Internet can be divided into six groups: script
    kiddies, malicious insiders, hackers, hacktists, cyber criminals, and nation-states.
    Each of these groups has differing experience levels, resources, and motivations.


    +   - Since potential computer security breaches are possible in virtually an
    unlimited number of areas where computers play a role, understanding and implementing
    appropriate safeguards require expertise in a broad range of fields beyond computer
    science, engineering, or similar technology-oriented specialties.'
