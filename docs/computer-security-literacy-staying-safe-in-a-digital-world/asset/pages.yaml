    # 9.5.5 Firewall


    Enabling a wireless router''s firewall protects a wireless network and the computers
    connected to it from the dangers and unwanted traffic originating from the Internet
    (Figure 9.12). As discussed in Chapter 6, even if a computer already has a software
    firewall enabled, it is still strongly advised to turn on the router''s firewall
    as an added security measure. Doing so protects a computer connected to your wireless
    network that does not have a firewall. It also provides defense in depth for computers
    that are firewall protected.


    # 9.5.6 Power Off Router


    When your wireless router is not going to be used for an extended period of time,
    simply turn the device off. Just like powering off a computer, attackers cannot
    attempt to access your wireless network if the device is turned off. As an added
    benefit, this action also saves energy.


