    # 3.3.7 Security Questions


    One side of having to choose and remember many passwords for multiple accounts
    is that people forget passwords from time to time. To automate password recovery,
    many websites offer a manual mechanism allowing a user to recover or reset his
    or her password. While the mechanics of such password recovery systems differ
    from site to site, they typically share a secondary form of authentication through
    use of a security question (Figure 3.15). Just as the primary password provides
    access to an account, the answer to the security question provides a second form
    of authentication for recovering a forgotten password. If the security question
    is answered correctly, some websites display the user''s forgotten password directly
    on the webpage, while others require the user to reset the password or email a
    new password to the user''s registered account.


    From a convenience standpoint for the account owner, having the option to enter
    a secondary password based on an easy-to-remember question is a simple password
    recovery method. It is not surprising that hackers find this retrieval method
    convenient. Instead of attempting to compromise a 12-character password, it is
    much simpler for an attacker to learn or reset a password by performing a web
    search for the elementary school of a target''s hometown or to browse public information
    on a social networking website for a potential victim''s dog. In fact, this is
    exactly what happened to the 2008 Republican vice presidential candidate Sarah
