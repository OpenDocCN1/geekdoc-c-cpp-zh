    # 3.4 STRONG PASSWORDS


    The objective of creating a strong password is to prevent against many types of
    guessing attacks like brute-force or dictionary attacks. Before the construct
    of a strong password is discussed, keep in mind that a password must also be familiar
    and remembered easily enough to be recalled and tallied accurately at a later
    time. Certainly the password “UW1llBv@v3icmeD” is strong and would be virtually
    unguessable; however, it would be difficult not to remember but also to type accurately.
    Forgetting a password or accidentally locking oneself out of an account due to
    too many unsuccessful authentication attempts tends to increase the potential
    of choosing a less-secure and more easily remembered password as a replacement.


    # 3.4.1 Creating Strong Passwords


    Choosing a password is a pragmatic process, and an optimal solution does not exist
    for a password that is easy to recall when needed but strong enough that it cannot
    be easily guessed or cracked. The suggestions for generating a strong password
    presented in this chapter are meant to serve as a set of guidelines and provide
    an illustration of what is generally accepted as best practice for achieving password
    strength. Knowing that one must be able to recall a password at a later time,
    it is often convenient to start creating a password with a word or phrase that
    is meaningful, such as a favorite location (i.e., Cape Cod) or band (i.e., Beach
    Boys). If the meaning behind the creation tells a story, it is likely to be easier
    to recall at a later time, even if the final password deviates from its original
    form as a simple name or phrase (i.e., Cape Cod transformed into $$C@pe99Cd0!


