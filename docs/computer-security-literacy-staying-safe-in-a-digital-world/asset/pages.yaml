  md: '# 336 Appendix C: Web Surfing Security Technologies


    ![](img/785c52f93de89c98051552f6701d2efd_361_0.png)


    FIGURE C.3 NoScript permission options.


    the browser access to execute scripts for a particular website. This means that
    a user must opt out of the most secure state, a sound security practice (Chapter
    10). To do this, as shown in Figure C.3, NoScript provides a number of user options
    in granting privileges (either temporarily or permanently) to a webpage or domain
    name. For instance, if the user clicked on “Allow all this page” the particular
    website would be permitted to execute all scripts, and the user would not have
    to grant permission to the same website in the future. Although the process of
    declaring true for a website may initially seem a bit involved, the overall security
    benefit of not automatically executing potentially malicious code as the result
    of an errant click of a mouse can outweigh the initial inconveniences.


    As an alternative to a script-blocking web add-on, popular web browsers also enable
    users to simplify the running of JavaScript all together. However, this requires
    one to locate this feature in their web preferences and then opt in to the most
    secure state. While not as user friendly as a web browser add-on, disabling JavaScript
    will go a long way in preventing drive-by downloads.


    # C.4 LINK SCANNING


    Hyperlinks create an omnipresent threat due to the fact that simple of clicking
    on a hyperlink can result in a drive-by download of malware, phishing website,
    or both. The challenge for the user lies in the difficulty of being able to tell
    which hyperlinks are safe to click on and which ones are malicious. To aid in
    making such decisions, there are a number of free web add-ons that provide the
    service of link scanning (i.e., hyperlink) (McAfee Site Advisor, http://www.siteadvisor.com/;
    Web of Trust (WOT), http://www.mywot.com/; AVG Secure search link scanner, http://'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Appendix C: Web Surfing Security Technologies ■ 337


    linkscanner.avg com/). Generally, the objective of link scanners is to continuously
    visit, scan, or track URLs (Uniform Resource Locator) and websites comprising
    the web for malicious content, pop-ups, phishing tactics, bad linking practices,
    poor reputations, and are compiled and queried by a link-scanning add-on each
    time a web browser displays a hyperlink. As a result, when a hyperlink appears
    in a web browser, a visual indicator is placed next to the hyperlink to indicate
    the security rating of the link and the domain name to which it belongs. Typically,
    hyperlinks with a green mark next to the name are safe (or low risk), yellow or
    orange indicates a minor risk, and red represents a URL or web domain that is
    a significant risk. It should be noted that each of the presented link scanners
    works a little bit differently, and each has its own rating system and visual
    indicators. A generic description of the function of link scanners was provided
    for the sake of brevity. To find out more information about how each of these
    link scanners works specifically, please visit the provided URLs.


