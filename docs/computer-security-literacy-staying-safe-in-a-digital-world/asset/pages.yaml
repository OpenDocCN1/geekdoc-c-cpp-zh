  md: 'discussed in Chapter 6. Following this path will reduce the risk of contracting
    malware and help prevent one from needing to be reactive and experience the onerous
    task of attempting to remove malware from a computer. The purpose of this case
    study is not to provide a "how-to" guide on removing malware from a computer because
    this process is too complicated. The purpose of this case study is rather to discuss
    what are generally accepted as the few predominant options that might be chosen
    if one is faced with Alice''s situation. The option that works best for you will
    greatly depend on your comfort level in performing the discussed tasks and the
    time, effort, and money you are willing to invest to rid your computer of malware.


    For Alice, the most common method to remove malware from her computer is to rely
    on her chosen antivirus software. However, as previously described, situations
    can arise in which antivirus software, even if it has the most current virus signatures,
    is unable to detect and remove all malware on a computer. In this situation, the
    first option for Alice is to deactivate her current antivirus software and try
    another antivirus program in the hope that the alternative option can detect the
    malware. This process can be repeated until the malware is removed. There are
    many free versions of antivirus software that Alice can choose from, including
    AVG Free Antivirus, Avast! Free Antivirus, Microsoft Security Essentials, Sophos
    Free Antivirus, Malwarebytes Free-malware, Avira Free Antivirus, and others. The
    mayhem behind this method lies in the hope that, Alice''s antivirus software did
    not contain the correct signature for the malware infecting her computer, another
    security software vendor might have the needed signature. It should be noted that
    installing two antivirus programs simultaneously does not necessarily double the
    protection, but instead often the two programs conflict or decrease overall computer
    performance. This is why it is best for Alice to deactivate or uninstall her current
    antivirus program before installing another.


    If Alice is unable or not willing to make the effort to remove the malware from
    her computer, she has a second option to employ a commercial technology service,
    perhaps a local computer store, to perform the malware removal on herself and
    at a cost. Although these services may have experienced and highly skilled technicians,
    there are no absolute guarantees that such services can remove the malware from
    Alice''s computer. Furthermore, Alice should be aware that the computer technician
    will have full access to all of her files and data, a serious privacy concern.'
