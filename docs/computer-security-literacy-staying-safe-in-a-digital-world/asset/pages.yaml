  md: '# Online Shopping


    8.1 INTRODUCTION

    When the infamous bank robber Willie Sutton was asked why he robbed banks, he
    replied, “That’s where the money is.” The online equivalent to the bank robber
    is the cyber criminal. Unlike the bank robber, however, the objective of the cyber
    criminal’s heist is to steal personal, confidential, and financial information
    (for the sake of brevity, all such information is referred to as “financial information”
    in this chapter). This financial information is then turned into a profit for
    the cyber criminal either by using the information directly or by selling it in
    an under-ground market.


    When online shopping first emerged, people were—and still are—reluctant to partake
    due to the uncertainty of sending their financial information across the Internet
    and the threat of cyber criminals. This initial hesitancy has gradually dissipated
    over time as consumer confidence has grown. Many people have accepted the risks
    of online shopping in return for the conveniences it affords, and this collective
    action has catapulted online shopping into a multibillion-dollar industry. During
    the fourth quarter of 2011, U.S. consumers spent more than $50 billion online—more
    than $1.25 billion on Cyber Monday alone. Cyber criminals, aware that online financial
    exchanges are “where the money is,” have also caused in this cyber phenomenon
    to the tune of an estimated $10 million during the 2011 holiday season alone.
    While online shopping is convenient for the consumer, it is accompanied by a number
    of threats and attacks that attempt to trick the consumer into buying false'
