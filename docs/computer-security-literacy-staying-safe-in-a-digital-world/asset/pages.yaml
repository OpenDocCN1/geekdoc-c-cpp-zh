  md: '# Introduction to Computers and the Internet


    The Internet is a vast network of billions of geographically dispersed computers
    located around the world and networked together by server-tiers of ISPs.


    The Internet is often conceptually thought of as a black box, with information
    flowing from the user''s computer into the box as well as from the box back to
    the user''s computer. Practical computer security is principally concerned with
    security attacks that originate from the Internet and threaten individual computers
    rather than attacks against the Internet itself.


    The Internet and its supporting technologies were not invented with security as
    a top priority, and it was not envisioned that the Internet would evolve to its
    current capacity.


    Using globally unique IP addresses, computers are able to connect to each other
    via the Internet by way of standardized networking protocols.


    The addressing of computers and the routing of Internet traffic are analogous
    to the postal system.


    Since people work better with meaningful names rather than long numerical IP addresses,
    Domain Name Servers (DNSs) translate numerical IP addresses (129.33.22.1) into
    names like ebay.com, google.com, iastate.edu, for example.


    The Network Address Translation (NAT) devices, often found in home routers, create
    private networks and expand the number of devices able to connect to the Internet.


    When web requests are routed through the Internet, they are literally routed through
    several geographically disperse routers that lie in between the requesting computer
    and the destination server.


    The World Wide Web is a single component of a larger set of services that compose
    the Internet. Because it is so widely used, the WWW is a prime target for hackers
    and cyber criminals.


    Since all computers are connected to the same Internet, they all technically possess
    the capability to be able to communicate with each other and thus also possess
    the capability to attack each other.'
