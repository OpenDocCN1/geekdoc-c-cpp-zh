    The phone system provides an example of connection-oriented communications, an
    approach in which a protocol exchange is used to establish a connection between
    the two parties (dialing the phone, picking up the phone). Once the connection
    has been established, the data flow between the two parties using the same route
    or path are received in the same order as sent. At the conclusion of the data
    flow, the connection is broken.


    Another method, called connectionless communication, can also be used to transfer
    data between two parties. The post office is a familiar example of a connectionless
    system. Each letter is handed independently and could conceivably follow a route
    different from other letters to get to a common destination. Each letter is self-contained
    and has its own address information. If multiple letters are sent from a given
    location to a given destination, there is no guarantee that they will be delivered
    at the same time and in the same order, that they will follow an identical route,
    or that they will be delivered at all. Like the mail system, the Internet operates
    in connectionless communication protocols. One of the main differences, however,
    is that data or files sent over the Internet are broken up into smaller chunks
    packed, and each packet is handled separately as it is sent from one computer
    to another. When all packets are received at the destination address, the packets
    are reassembled to create the original file.


    A common factor between both connection-oriented and connectionless methods is
    the requirement that users must be able to identify each other for the system
    to work fluidly. The phone system uses phone numbers to uniquely designate each
