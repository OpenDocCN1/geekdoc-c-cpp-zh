    not spread widely, and people could make a judgment through knowing their source.
    The modern Internet, however, allows people to make false statements that can
    spread through distributed social circles around the world in the matter of seconds.
    Since such statements are written in professional-looking printed form, people
    may have to believe them without question. We must strive to remember the obvious
    fact that not everything read and seen on the Internet is true.'
