    Cyber stalking is the online equivalent of physical stalking. Take the example
    of Dumped Duane, who was dating Alice. Duane and Alice were so deeply “in love”
    that they shared everything about their lives, including their passwords. One
    day, Alice told Duane that she did not want to see him anymore, which really upset
    Duane. In anger, Duane started to track Alice’s every movement. He would log into
    her email account, read her emails, and follow her on her social networking sites.
    When Alice started dating Bob, Duane became jealous and upset. He logged in her
    email account and started sending emails to Bob pretending to be Alice. He also
    used her Facebook account and posted harmful status information, all in an effort
    to cause Bob to dump Alice. What Duane did was illegal, and when Alice found out,
    she contacted local authorities, Much of this stalking activity could have been
    prevented if Alice had never told Duane her password or at least had changed her
    password when they broke up.


    This section outlined a couple of examples of character-based attacks. It is important
    for the reader to know that the same rules apply to cyberspace as to the physical
    world. If you or someone you knows they are becoming a victim, it is best to contact
    a trusted source or proper authorities. Also, every child using the Internet should
    be made aware of these issues and should be taught what to do and what not to
    do if such situations arise. The next section provides a few more tips and technologies
    that can help.


    # 2.9 IS THERE ANYTHING I CAN DO TO MAKE THE INTERNET A SAFER PLACE FOR MY CHILD?


