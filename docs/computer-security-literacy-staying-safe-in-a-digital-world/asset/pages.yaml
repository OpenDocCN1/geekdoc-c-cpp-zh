    # 3.3.5 Attacker Guesses Password


    Because online login webpages are accessible to anyone with a computer and an
    Internet connection, there always exists the threat that a password for a given
    username can be randomly discovered by means of guessing attack. In respect to
    guessing passwords, there are typically two types of attacks employed by attackers:
    brute force and dictionary attacks. Each of these types is discussed in the context
    of practical password security. This discussion implicitly provides a foundation
    for understanding how to better choose or construct passwords resilient to such
    attacks.'
