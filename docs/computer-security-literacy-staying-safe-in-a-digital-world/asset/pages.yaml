  md: '# CHAPTER 6


    # Malware:

    Defense in Depth


    # 6.1 INTRODUCTION


    In the context of computers and the Internet, there is no such thing as absolute
    security. No matter what precautions are taken, computers will always be vulnerable
    to a certain number of attacks, and there is no single security mechanism that
    can be purchased or downloaded that will be able to mitigate all potential threats.
    Although disheartening, this is the current state of computer security, and we
    must react accordingly. Just as modern medicine cannot always protect one''s health
    against a multitude of diseases, biological viruses, and illnesses, neither can
    software vendors protect one''s computer and personal data against all occurrences
    of malware or hacking. As an analogy, consider the common cold. Although it seems
    likely the common cold will never be eradicated, one can significantly decrease
    chances of contacting this illness by washing their hands, avoiding sick people,
    getting plenty of rest, and keeping their hands out of their nose, eyes, and mouth.
    This type of multilayer, precautionary, and proactive approach corresponds exactly
    to the strategy outlined in this chapter to safeguard a computer.


    The best defense against the myriad possible malware and hacking events that threaten
    the confidentiality, integrity, and availability of computing devices and personal
    information is a defense-in-depth approach to information security. Under this
    defensive strategy, no single mechanism is responsible for all defensive tasks,
    and employing a combination'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# 130 Computer Security Literacy: Staying Safe in a Digital World


    of many diverse mechanisms and strategies significantly decreases one''s risk
    of an attack. Like wearing both a belt and suspenders, if one mechanism fails,
    we can rely on another to keep our pants up, so to speak.


    The five components comprising the defense-in-depth strategy described in this
    chapter are: (1) data backup, (2) firewalls, (3) software patches, (4) antivirus
    software, and (5) user education. Each of these components is essential, and the
    neglect of even one of them increases one''s chance of falling victim to malware
    or of being unable to successfully prevent, detect, or recover from malware attacks.


    # 6.2 DATA BACKUP


    If you ask a dentist, "Which teeth should I floss?" the dentist will probably
    reply, "Only the teeth you want to save." The same principle holds true with respect
    to backup—only back the data that you want to save. In a digital world where personal
    computers store a vast number of documents, pictures, videos, and financial statements
    are, in many respects and to various degrees, invaluable and irreplaceable. Unfortunately,
    data in its digital form is just as susceptible to destruction as is physical
    printed data. Data backup is the first technique to be used in the defense-in-depth
    strategy. It can protect against not only the side effects of malware, but also
    a number of other computer catastrophes.


    Data failures are inevitable, and malware can strike at any time. A hard drive
    crash, a glass of water can spill on a laptop keyboard, or malware can delete
    a hard drive, all without warning. Any one of good number of such unforeseen events
    could occur on any day and result in the destruction of one''s most treasured
    data. Ask yourself this question: If, right now, your laptop hard drive crashes
    or piece of ransomware encrypts your data, would you be able to successfully recover
    your data from a backup? This is the ultimate recovery test because failures rarely
    give. If you subscribe to Murphy''s law, one knows that failures happen at the
    most inconvenient of times. The answer to the question is "no" and you value your
    data, then it is time to establish a sound backup strategy.


    There are a number of both methods and storage mediums can be used to replicate
    data for safekeeping. Three of the most common types of backup methods are as
    follows:


    +   - **File Backup:** Archiving individual files or folders.'
