    #  3.3 PASSWORD THREATS


    There is a distinct difference between choosing a strong password and keeping
    that password confidential. A strong password is chosen in such a way that neither
    a human nor a computer would be likely to successfully guess the password in any
    reasonable amount of time. While strength is a necessary condition for a secure
    password, password strength alone is not sufficient. Preserving the secrecy or
    not providing an accidental revelation of a password to an attacker are just as
    important, if not more, than choosing a strong password.


    The following section describes the many threats passwords face, so one should
    pay close attention to which of these threats are mitigated by strength and which
    are mitigated by password secrecy. Figure 3.6 provides a graphical depiction of
    the common ways through which attackers guess, steal, learn, or observe passwords.
    This figure serves as a guide for the examination of password threats and best
    practices.'
