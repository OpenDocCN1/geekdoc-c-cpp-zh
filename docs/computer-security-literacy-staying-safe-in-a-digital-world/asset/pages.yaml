    Example: "All the single ladies, all the single ladies" → "Atslatsl"


    Note: Use the acronym method to create a base for your password, then use the
    substitution method to increase the password’s strength and uniqueness.


    Example: "Atslatsl" → "@t$l@T$"


    +   * Phonetic Replacement: Replace parts of a word or phrase with a phonetic
    equivalent.


    Example: "I love to laugh" → "EyeLuv2L@ff"


    "How much money do I have?" → "m$$du1H4ve?"


    +   * Encapsulation: Use symbols or numbers to separate or encapsulate words or
    phrases.


    Example: "sunGlasses44" → "(sun)Glasses24"


    "footballTD" → "22football22*TD"'
