    # 9.5.2 Service Set Identifier


    As previously described, most wireless routers broadcast their SSID so that any
    Wi-Fi device within the nearby vicinity of the router will be able to detect,
    and thus connect to, the wireless network. While it makes sense for a public Wi-Fi
    hot spot, such as one found in a coffee shop or library, to broadcast its SSID
    to make the router''s existence known to its patrons, the same cannot be said
    for a home wireless network. From a security perspective, you do not want to broadcast
    your SSID and make your network known to your neighbors or to a driver cruising
    by on the street. Remember that a wireless network is not confined by a wall or
    door, but instead by the maximum transmission distance of the wireless router.
    When a wireless network is used in a private residence, its users who access the
    wireless network should already know the SSID, much like one remembers a username.
    many wireless network managers enable a user to save and automatically connect
    to previously known wireless networks. Therefore, the only real reason to broadcast
    an SSID for a home wireless router is for the convenience of needing to remember
    the wireless network''s name. Once again, security is at odds with convenience.
    As shown in Figure 9.11, many wireless routers allow the admin to disable the
    broadcasting of the SSID.


    ![](img/785c52f93de89c98051552f6701d2efd_230_0.png)


    FIGURE 9.11 Disable broadcast SSID.'
