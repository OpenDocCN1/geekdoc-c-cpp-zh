    **Exploit:** An exploit is an unimplemented method or algorithm that is able to
    take advantage of a vulnerability in a computer system. Using the door lock example,
    an exploit might consist of knowing that if you made a bump key—a key with no
    notches—it will open certain locks, but you do not possess or know how to make
    the key. Therefore, an exploit is a potential threat underlying a potential attack.


    **Attack Code:** An attack code is a program or other implementation of an exploit
    used to attack a vulnerability in a computer system. An attack code would be analogous
    to creating a bump key that would be able to open vulnerable locks. Throughout
    the remainder of this book, the coupling of an exploit and attack code is simply
    referred to as an exploit. The term *exploit* will also be used as a verb to denote
    the action of an attacker or malware when taking advantage of a vulnerability.


    **Attack:** The actual use of attack code against a system or the exploitation
    of a vulnerability. This is the same as using a bump key to open a vulnerable
    door.


    Figure 1.2 shows the chronological relationship among vulnerabilities, exploits,
    attack code, and attacks. Vulnerabilities often lie dormant in software programs
    for years before being discovered. Even when they are discovered, there may not
    be an easy way to exploit them. The time interval between when a vulnerability
    is discovered and an exploit is designed can be anything from days to months or
    even longer. Once the exploit has been identified, there may be a period of time
    before the attack code is created. Sometimes, the exploit is discovered directly
    through creation of attack code, and the time between exploit and attack code
    is zero.


    ![](img/785c52f93de89c98051552f6701d2efd_33_0.png)


