    +   **System Image Backup:** A complete system backup of all system files and
    personal files. This enables one to completely restore the entire computing environment
    to a previously saved backup image.


    +   **System Restore:** Different from a system image backup, a system restore
    copies only system files and not personal files as pictures, emails, or other
    documents. This enables one to restore a computing environment to a previous state
    without affecting current personal files.


    Depending on one’s preferred backup method, there are a number of storage media,
    such as external hard drives, CDs, DVDs, USB (Universal Serial Bus) flash drives,
    and online backup services that provide all large-volume data storage solutions.
    Furthermore, any of these options are relatively affordable if one considers their
    digital data to be priceless, or at least great value. There is no one-size-fits-all
    method for backing up data, and each backup solution depends on both the method
    and the storage medium that is chosen. Operating systems (i.e., Windows operating
    system and Mac OS X) and some external hard drives are equipped with software
    to perform one or more of the described backup methods. Find the method that works
    best for you, stick to a normal schedule (e.g., backing up on a daily or weekly
    basis), and verify that you can indeed restore your data when needed. In addition
    to preventing against hardware failures and malware, it is good security practice
    to keep a copy of your most valuable digital items in a secure location separate
    from the original to guard against threats like fire and theft.


    Establishing and using a backup strategy is essential to the preservation and
    longevity of data with respect to a number of possible threats. Realistically
    speaking, it is not a matter of planning for if your hard drive will fail or your
    computer will become infected with malware; it is planning when this happens.
    It is important to note that a hard drive (or any computer memory option for that
    matter) exists in two states:(1) the hard drive is going to fail or (2) the hard
    drive has failed. Hard drives are not made to last, and they will inevitably fail.
    No matter what ills befall your computer, having a sound backup strategy will
    allow you to recover a previous copy of your data or transfer it to another computer.
    For protection against malware such as ransomware, having a backup of data may
    be the last line of defense. It is necessary to take a proactive approach to data
    backup because it is


