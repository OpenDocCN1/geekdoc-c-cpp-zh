    wireless traffic (i.e., digital eavesdropping). For wireless sniffing to be possible,
    the attacker''s computer must first be connected to the same wireless router as
    the victim''s computer. As previously discussed, when computers communicate with
    a wireless router, they transmit communications all to be heard in the nearby
    vicinity. This means that all computers connected to the same Wi-Fi network are
    able to hear each other''s conversations. Because there is no beneficial or legitimate
    objective for capturing and processing other computers'' network traffic, the
    normal action of a computer is simply to ignore all other wire-traffic other than
    the traffic that is specifically addressed to the given computer (Figure 9.4).


    To reverse this default behavior of a computer and listen to others'' Internet
    traffic, there are a number of free, legal, and readily available software programs
    (e.g., Wireshark or TCPDUMP) that can put any normal computer into what is called
    “promiscuous mode”—requiring no special attacking hardware. Promiscuous mode enables
    a computer connected to a wireless router to receive and capture (i.e., sniff)
    all wireless traffic to and from the router and from all computers connected to
    the router (Figure 9.5). Because the attacker''s computer passively listens, there
    is no way for one to determine if traffic is being sniffed or not. The utility
    of sniffing software programs even goes so far as to let the sniffer filter specific
    Interternic traffic such as AOL IM (instant messaging) conversations


