    does not bind you to that relationship forever. Clean out your friend list from
    time to time just you would remove contacts you no longer call from your cell
    phone. Doing so will correct possible befriending mistakes of the past and minimize
    access to your private information. To determine whether to use a friend, use
    a friend’s birthday notice as a barometer. If you do not wish that person a happy
