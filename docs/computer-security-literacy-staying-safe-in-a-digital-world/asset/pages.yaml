    girlfriend. Even if Alice does not know Bob knows her passwords, there is a possibility
    that Alice''s account information may have been saved by the web browser on Bob''s
    computer or that Bob knows enough information about Alice to effectively guess
    her passwords or answers to her security questions. For these reasons and, it
    is best for Alice to change her passwords and security questions after the end
    of her relationship with Bob (also see Chapter 12).


    After a breakup, if either Alice or Bob is tempted to engage in any type of harassment
    behavior using text messaging, emails, or social networks, or she should be advised
    that such activities are considered criminal, and there are laws specifically
    addressing these issues. Just because communications may take place in the virtual
    world does not mean they are not punishable in the physical world. If either Alice
    or Bob feel they are being harassed, or she should contact the local enforcement
    agency immediately.


