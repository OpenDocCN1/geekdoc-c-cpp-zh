  md: '# 206 ■ Computer Security Literacy: Staying Safe in a Digital World


    If you choose not to broadcast your router''s SSID, a wise choice is also important
    to change the default SSID of a wireless router during the router''s initial setup
    process. Manufacturers typically sell wireless routers with the same SSID—often
    the manufacturer''s name. Changing this SSID will prevent an attacker from attempting
    to connect to your network, even if the SSID is not being broadcast, by simply
    guessing well-known default router names. If you choose to broadcast your router''s
    SSID, consider your privacy when doing so. Do not change your router''s name to
    somepersonal name such as your family''s name (i.e., Bob''s House) or other information
    that can be used to identify you or provide an attacker with a hint regarding
    what your password might be.


    # 9.5.3 Wireless Security Mode


    To create a secure wireless network, one must first enable the router''s security
    mode (illustrated in Figure 9.12). Enabling the security mode on a wireless router
    provides two distinct security benefits. First, it requires that a user wishing
    to access the wireless network must first authenticate to the router with a password.
    Authentication prevents unwanted users (i.e., piggyackers) who do not know the
    password from connecting to your wireless network. To prevent attackers from guessing
    your password, it is important to exhibit the same password best practices discussed
    in Chapter 3 when choosing the password that controls access to your wireless
    router.


    The second security benefit of enabling wireless security is that it encrypts
    wireless traffic that travels between your computer and the wireless router. The
    use of encryption mitigates the threat of eavesdropping. Just as HTTPS encrypts
    data between your computer and a web server, wireless security encrypts data over
    the wireless connection. Even if an attacker were able to piggyback on your network,
    the attacker would not be able to readily view your wireless traffic in plaintext.


    ![](img/785c52f93de89c98051552f6701d2efd_231_0.png)


    FIGURE 9.12 Enable wireless security mode.'
