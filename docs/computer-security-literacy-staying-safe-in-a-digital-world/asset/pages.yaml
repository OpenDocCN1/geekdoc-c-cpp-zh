  md: '# 190 Computer Security Literacy: Staying Safe in a Digital World


    # 8.6.2 Audit Credit Card Activity


    At a minimum, monitor your credit card activity for suspicious charges on a weekly
    basis. Diligence is the key to thwarting cyber criminals and stop-ing fraudulent
    charges before they become the consumer''s burden to pay. Attackers are well aware
    that a fraudulent purchase or withdrawing large sums of money (i.e., $4000 at
    a time) will appear as highly suspicious activities to the credit or debit card
    owner. As a result, cyber criminals have been known to employ more subtle techniques
    to avoid detection by buying items such as designer purses at reputable stores.
    To audit your own purchases, keep a record of receipts or confirmation statements
    you receive after purchases and cross-check your monthly credit card or bank account
    statements with records to ensure they are consistent. Be aware that fraudulent
    purchases may not appear on your statement for hours, days, or even months after
    a credit number is compromised since it takes time for cyber criminals to sell
    and abuse such information.


    # 8.7 SUMMARY


    Along with the convenience of online shopping comes the added risk of falling
    victim to an online scam. Cyber criminals have built a million-dollar industry
    based on the fact that many people do not exhibit caution when shopping online.
    Although not all of the risks of online shopping can be avoided, a great deal
    of them can be by the choices the consumer does or not make. To shop safe online,
    use common sense and apply the best practices discussed in this chapter.


    +   - As online shopping has evolved into a billion-dollar industry, it has also
    become a prime target for cyber criminals looking to steal financial information.


    +   - Online shopping is largely a voluntary activity in which many threats can
    be mitigated by the actions and security awareness of the consumer.


    +   - The defense-in-depth security strategy described in Chapter 6 should be
    applied during online shopping activities.


    +   - Although both debit cards and credit cards can be used to pay online shopping
    expenses, a credit card is the more secure option because of favorable consumer
    protection laws and payment procedures.'
