    by running applications like antivirus software and firewalls (Chapter 6) and,
    against being generally accessed by other users, by requiring a username/password
    combination to log in to the computer.


    # 2.2.3 Applications


    An application is a computer program that provides a specific function, such as
    word processing, web browsing, spreadsheet analysis, financial tools, and email.
    Some general-use applications typically are included with an OS, while other applications,
    more specifically focused on individual user needs, are purchased and then installed
    on the computer by the user. Applications can be obtained and installed from a
    number of sources, including the hard drive, CD-ROM/DVD, USB drives, and the Internet.
    While applications are typically thought of as installed or executed by a computer
    user, applications also possess the ability not to run other applications but
    also to install other unwanted software, like malware.


    # 2.2.4 Users


    A user can be anyone interacting with a computer, either directly or indirectly
    and whether permission is given or not. Direct interaction occurs when a user
    provides input to the computer (typically through a keyboard or mouse) or receives
    output from the computer via a screen display or a printed document. The most
    common type of direct interaction occurs with desktop or laptop computers. The
    user is the prime focus of this book because the actions a user does or does not
    often have the most significant bearing on a computer''s security and thus the
    user''s security.


    # 2.3 OPERATION OF A COMPUTER


    To better understand how a computer can be manipulated by a hacker or malware,
    it is important to understand how a computer operates and even more specifically
    how a computer loads and runs an OS and its given applications. Since attacks
    against a computer can originate from running applications, it is necessary to
    examine an application''s capabilities to permit such attacks to occur. The next
    three sections describe how a computer is started, how an OS loads and runs applications,
    and how applications interact with an OS and a computer''s hardware.'
