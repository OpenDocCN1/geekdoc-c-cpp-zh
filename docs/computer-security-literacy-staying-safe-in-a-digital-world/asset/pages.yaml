    address. Before making a purchase, carefully examine the physical location of
    the retailer. Consumers who shop with companies located outside the United States
    might not be afforded the same consumer protections that are granted under U.S.
    federal and state law when one is shopping with a U.S.-based company. Other useful
    pieces of information to understand before disclosing financial information are
    the company''s privacy policy, shipping details, and cancellation and return policies.
    Because collecting and analyzing such information may be tedious at times, an
