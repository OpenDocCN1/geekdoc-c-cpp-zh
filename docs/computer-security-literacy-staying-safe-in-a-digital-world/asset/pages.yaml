    # 1.5 CYBER ETHICS


    The indirect nature of computers creates a tendency among computer users to act
    somewhat differently behind a computer screen than they might act in the physical
    world. For example, most people would not steal a CD off the shelf of a local
    music store. In the cyber world, however, it is uncommon for people to download
    a file like a song or video that they clearly do not own. Although the reasons
    are many, there are people who generally feel that because such files are copies
    of “just data,” that these files have no perceived monetary value. In addition,
    others feel that since they just downloading a copy and the owner still has the
    original, that the act does not constitute stealing. Last, because people have
    little to no expectation of being caught for downloading copyrighted files, they
    do not fear any type of punishment for the action. The same mindsets seems to
    be present for attackers with respect to breaking into a computer versus breaking
    into a house.


    The U.S. legal system does not help much with this issue. In many cases, the theft
    of information is treated differently from the theft of physical property, and
    breaking into a computer to steal information is treated differently from breaking
    into a house to steal a similar item. Many of the laws that deal with computer
    crimes do not provide penalties as severe as those for noncomputer crimes. This
    difference in perception, coupled'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 12 Computer Security Literacy: Staying Safe in a Digital World


    with the relatively low probability of getting caught while engaging in data theft,
    adds to the problem of trying to keep your information protected.


    If the C-I-A model is reexamined and each of its elements (confidentiality, integrity,
    and availability) is related to a physical act, one can see the contrast between
    cyber ethics and traditional ethics. The loss of confidentiality is the same as
    theft of a physical item. When the integrity of information is compromised, the
    action can be considered equivalent to forgery. Finally, the loss of information
    availability is analogous to destruction of property. While many people would
    not steal a physical item, illegally forge a document, or destroy others'' personal
    property, the same ethics that such actions in the physical world do not always
    permeate into the cyber world.


    Another aspect that makes cyber ethics different from traditional ethics is the
    ease of carrying out cyber attacks. As discussed, there are many attack tools
    available on the Internet that can be used by people with limited computer skills.
    These tools allow virtually anyone to become a "h," contributing to the attitude
    that using tools that are found on the Internet is not unethical. Obviously, however,
    because someone can hack does not mean they should or escape penalty if they do.


    It should be pointed out that there are people, hackers or white-hat hackers,
    who are hired by corporations and get paid to attack computer systems and computer
    networks. They perform so-called penetration tests designed to test the security
    of systems. Penetration testers follow a strict set of guidelines and a well-defined
    code of ethics. The objective of penetration testers is to test computer systems
    and to identify security problems or vulnerabilities before they are exploited.
    There is also a popular misconception that companies often hire hackers for this
    purpose. While a few "reformed" hackers might find such jobs, many organizations
    will not hire someone with a history of malicious hacking activity and a criminal
    background.


    # 1.6 THE PERCEPTION OF SECURITY


    As has already discussed, security is a matter of economics. This statement is
    also true for cybercriminals. A common misconception in computer security is that
    one type of computer system is inherently more secure than another. First, regardless
    of the make, model, or vendor, all computer systems, operating systems, and applications
    are vulnerable to attack and are capable of being compromised. Often, a system''s
    potential for compromise is a function of its market share and overall volume
    of


