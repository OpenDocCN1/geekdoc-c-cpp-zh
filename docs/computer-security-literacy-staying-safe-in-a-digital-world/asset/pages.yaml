  md: '# 3.3.3 Key-Logging


    Keystroke logging, or key-logging, is the act of maliciously and covertly recording
    keystrokes made on a computer keyboard. On the surface, this threat might appear
    to be taken straight out of a spy movie. However, the threat of key-logging is
    actually quite real, and this method of attack is quickly increasing in popularity
    among hackers because of the value of the sensitive information that can be obtained
    in this way.


    Keyboard loggers can be implemented and deployed both as hardware and as software.
    A hardware key-logger is a small, inconspicuous device—similar-looking to a USB
    (Universal Serial Bus) flash drive—that is inserted between the keyboard and a
    computer (Figure 3.8). The task of a key-logger is simply to record every keystroke
    typed on the keyboard. Because the hardware key-logger sits in-line with the cord
    that connects the keyboard to the computer, the key-logger is able simply to record
    keystrokes as they are typed, an action that is undetectable by a user or the
    computer. Typically, such hardware devices are quite difficult to spot with an
    untrained eye. When placed on a computer in high-volume login areas such as a
    library, hotel lobby, or a public coffee shop, these devices can be quite devastating,
    capturing hordes of passwords and sensitive


    ![](img/785c52f93de89c98051552f6701d2efd_90_0.png)


    FIGURE 3.8 Hardware key-logger.'
