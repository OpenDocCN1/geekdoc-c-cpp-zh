    taking the bait and opening the ZIP file. This action would likely result in malicious
    code embedded in the ZIP document attempting to install a malicious program on
    the victim''s computer. Do not be fooled by emails that attempt to invoke a sense
    of urgency or insecurity. If you do not know who the email is, or if you know
    the sender but are not expecting a "patch," certainly do not open either the email
    or the attachment. Furthermore, a legitimate software vendor will never send a
    security patch by means of an email.


    Drive-by downloads do not require a victim to open a suspicious email attachment;
    instead, all that one needs to do to become a victim is to request a malware-laden
    webpage by clicking on a hyperlink. Computer users are often unaware that they
