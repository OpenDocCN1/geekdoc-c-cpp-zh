    # 11.4.3 Top-level Domain Name


    A top-level domain (TLD) can be thought of as an URL''s association—by country
    (.cn, .tk, .ru, .uk, .us) or more generally (.com, .net, .biz)—on the Internet,
    similar to that of a country or business sector. Just as an email address belongs
    to a specific service provider (i.e., @gmail.com or @hotmail.com), each website
    belongs to a TLD (i.e., .edu, .net, .info). To locate the TLD in Figure 11.13,
    start to the right of the protocol (e.g., http://) and read from right to left
    until you reach the first backslash in the URL; mark this spot. Now, from this
    spot, read from right to left until you encounter the first period; mark this
    spot. Between the two marked spots is the TLD (i.e., .com in this case). Note
    that these instructions for reading a URL are independent of this example and
    can be applied to any URL.


    By themselves, TLDs are not definitive indicators of whether a website is legitimate.
    For example, although .com is perhaps the most recognized TLD, a website that
    has the .com TLD is not necessarily safe. In facts, 60% of phishing websites have
    one of the four TLDs: .com, .net, .tk, and .cc. To determine the legitimacy of
    a TLD, it must be examined in context with the other components of the URL, and
    more specifically, the domain name.


    ![](img/785c52f93de89c98051552f6701d2efd_272_1.png)


    FIGURE 11.13 Top-level domain name.'
