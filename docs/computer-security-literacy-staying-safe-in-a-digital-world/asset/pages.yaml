    A third option is for Alice to attempt to restore her computing environment from
    a previously known good state by means of a system image backup or system restore
    (Chapter 6). This option requires Alice perform a regular backup of her computer.
    While in certain circumstances this method can be effective when dealing with
    a malware infection, the major risk when performing this task is dealing with
    potentially corrupt or "dirty" backups. For instance, if Alice restores her computer
    to a previous state, let us say 1 week earlier, but the malware infection occurred
    2 weeks earlier, Alice has not solved the problem. Even Alice restores to a previously
    known good state, but the malware-infected document is also contained in the backup,
    by reopening or installing the malware-infected document Alice can infect her
    computer again. Remember that a malware-infected document is not directly harmful
    unless it is opened or executed. If Alice is concerned about a dirty backup, she
    can scan the backup drive with her antivirus software, or if Alice is certain
    which file caused the malware infection, Alice can manually delete that file from
    the backup drive.


    The fourth option for Alice to rid her computer of malware is simply to erase
    the computer''s hard drive and reload the computer''s operating system, drivers,
    and applications. Although this is the most intrusive of the four options, it
    also represents the most dependable way to ensure that the malware has been removed
    from Alice''s computer. This is yet another situation in which it is crucial to
    create backups of one''s most-valued data. During this process of reformatting
    the hard drive, both the legitimate software as well as the malicious software
    will be completely erased from Alice''s hard drive. Before one decides on this
    option, it must be recognized that the process of rebuilding a computer in this
    fashion can be quite time consuming and will often require use of an operating
    system installation CD, and reinstallation of both application software and hardware
    driver software.


    As one can gather from the options described, removing malware from a computer
    is often neither a straightforward nor a desirable task. Furthermore, it is important
    to note that the removal of malware does not necessarily prevent future occurrences
    of the same or new malware. If one resorts to the same computing habits that resulted
    in contacting malware in the first place, one runs the risk of continually being
    in the predicament of either using a malware-infected computer or having to remove
    malware constantly. Despite all the advances in technology and computer security,
    in general there exists no quick, reliable, and straightforward way to remove'
