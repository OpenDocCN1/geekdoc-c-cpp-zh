    # 8.3 SPYWARE AND KEY-LOGGERS


    Never make a purchase online or divulge any financial information on a computer
    that you do not trust. The list of untrusted computers should include computers
    at a library, retail store, coffee shop, friend''s house, and so on. Key-loggers
    and spyware are constant threats on untrusted computers. Entering any financial
    information on such a computer could be the equivalent of handing your name, credit
    card number, and home address directly to a cyber criminal. If you believe that
    your computer has a malware infection, you should treat it as an untrusted machine.
    Online purchases should not be made until all malware has been removed from the
    computer. It is imperative to consistently follow the defense-in-depth strategy
    that, when one wants to make an online purchase, he or she has confidence in the
    security of his or her computing environment.


    # 8.4 WIRELESS SNIFFING


    Due to the threat of an attacker sniffing wireless traffic (Chapter 9), one should
    refrain from purchasing items when a computer is connected to an unsecured wireless
    network. Although using HTTPS (Hypertext Transfer Protocol Secure) may mitigate
    the risk of sniffing, there are websites that do not use HTTPS for entire browsing
    sessions; as a result, financial information may be sent in cleartext over the
    Internet. This information can subsequently be sniffed on an unsecured wireless
    network.


