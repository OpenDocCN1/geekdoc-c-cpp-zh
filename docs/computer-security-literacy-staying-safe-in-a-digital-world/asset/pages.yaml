  md: '# Appendix C: Web Surfing Security Technologies


    # C.1 INTRODUCTION


    The objective of this appendix is to introduce and discuss a handful of web and
    Internet security technologies that can be used to further mitigate the threats
    discussed in this. Given the correct context, each of these technologies can,
    in its own way, increase one''s defense in depth when surfing the web and using
    the Internet. Although this is not nearly a complete list of all additional security
    technologies above and beyond those discussed in Chapter 6, they do represent
    some of the most effective and widely used security technologies that one could
    utilize as part of an everyday computing routine.


    # C.2 PRIVATE BROWSING


    To enhance a user''s experience while surfing the web, and often in coordination
    with many websites, browsers track user behavior by storing a plethora of information
    about one''s web surfing actions (Chapter 7). This may include pages one has visited,
    what was clicked on those pages, what particular webpage or website has been visited,
    what was typed (i.e., form history), cached photos, and items purchased, name
    a few examples. While this may be convenient in some cases, the storing of such
    information can be at odds with one''s personal privacy and security. In response,
    and to defeat a web browser''s capability for storing every move one makes on
    the web, many web browsers (i.e., Firefox, IE (Internet Explorer), Safari, Chrome)
    are now equipped with a separate viewing mode known as “private browsing” mode
    (Figure C.1). When Firefox is put into private browsing mode (the web browser
    will not remember any “browser history, search history, download history, web
    form history, cookies, or temporary Internet files.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# 334 Appendix C: Web Surfing Security Technologies


    ![](img/785c52f93de89c98051552f6701d2efd_359_0.png)


    Figure C.1 Enabling private browsing mode.


    Private browsing is advantageous to use on a computer if a user desires that subsequent
    users not be able to discover his or her actions, such as on a shared computer
    at home or in a public place. For example, when using a shared computer at home,
    one might not want a browser to remember search history for the topic “engagement
    ring” or plans for a surprise birthday party. Private browsing is also useful
    if one wishes to browse the web without allowing websites to track his or session
    history using cookies—temporary websites used to store user information on one''s
    computer (Chapter 7).


    Beware that, while private browsing will enable one to surf the web anonymously
    with respect to a user or website that may have future access to the same computer,
    this does not mean that one''s actions on the web are anonymous from the network
    administrator''s view. If you are in a work environment, putting your browser
    into private browsing mode will not prevent those monitoring the corporate network
    from learning which websites you have visited and the content uploaded and downloaded
    from such sites. What private browsing will do is prevent the next person or website
    accessing your computer from learning those actions.


    # C.3 NOSCRIPT


    As has been discussed in many parts throughout the book, drive-by downloads present
    a serious threat to web browsers and the integrity of a computer. The simple act
    of requesting a webpage can result in the downloading and execution of malicious
    code embedded within the requested webpage, resulting in a malware infection.
    Recalling the discussion of malware from Chapter 5, remember that malicious code
    is not a danger until it has been executed—malicious web code falls under the
    same rules. When a webpage is requested, the default behavior of a web browser
    is to'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Appendix C: Web Surfing Security Technologies ■ 335


    execute all code retrieved to properly render the webpage’s contents for the user.
    Often, this includes the execution of scripts, videos, and other code elements
    that can possess malicious lines of code inserted by an attacker. To block the
    execution of all scripts, both malicious and legitimate, there exist web browser
    add-ons that enable a user to determine which websites are trusted and cannot.
    Popular and free examples are NoScript (https://addons.mozilla.org/en-US/firefox/addon/noscript/)
    for the Firefox browser and NotScrips (https://chrome.google.com/webstore/category/home)
    for the Chrome web browser.


    As shown in C.2, on requesting the webpage at the URL www.ystate.edu/, the NoScript
    add-on prevents five scripts from being automatically executed by the web browser.
    In this case, the user is able to view most of the website, but some of the website
    functionality has been potentially restricted by the blocking of these scripts.
    In a different context, such as a request for a malicious website, the five blocked
    scripts would represent the prevention of a potential drive-by download or other
    malicious actions. Thus, the malicious code has been downloaded to the computer
    but was not permitted to execute.


    The downside of NoScript and similar security add-ons is that they require the
    user to play an involved role in determining which websites are to be trusted
    and thus able to execute code automatically and which websites are not to be trusted.
    By default, NoScript automatically assumes that a website is potentially malicious
    and forces the user to grant


    ![](img/785c52f93de89c98051552f6701d2efd_360_0.png)


    FIGURE C.2 NoScript add-on example.'
