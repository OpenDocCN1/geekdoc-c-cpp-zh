  md: '# Wireless Internet Security 203


    networks, the security defense present to prevent against the many threats wireless
    networks present is to use a VPN to encrypt only web traffic but also all Internet
    traffic (Appendix C). Furthermore, one should assume that a public wireless network
    is not protected behind a firewall, and people should ensure that their software
