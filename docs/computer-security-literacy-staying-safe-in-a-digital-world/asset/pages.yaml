    To explain how privacy concerns arise through the use of cookies and third-party
    advertisers, consider a scenario in which Alice is shopping for a birthday present
    for Bob. While browsing an online retailer''s website (ginnybooks.com), Alice
    decides to place a particular book about marathon running in her virtual shopping
    cart. Not easier to buy the book that day, Alice knows through the use of cookies
    that the particular item she will select remain in her shopping cart when she
    returns to the website at another time—a convenience that most do not view as
    a privacy violation. Later in the day, Alice is browsing the web and decides to
    visit her local news website. However, to Alice''s surprise, she sees a web ad
    for the very book she placed in her shopping cart earlier in the day on a separate
    website. Because such an occurrence is too random to happen, Alice feels her privacy
    has been violated and wonders how another website could possibly know this information.


    Alice''s privacy concern can be answered by explaining how websites enable advertisers
    to use third-party cookies to track individuals'' habits (i.e., behavioral advertising)
    across multiple and seemingly unassociated websites. When Alice first visited
    ginnybooks.com, code embedded in the website, supplied by a third-party advertiser
    (iknowatyoulike.com), enables the advertiser to place a third-party cookie (i.e.,
    tracking cookie) containing a unique identifier and information about Alice''s
    habits on Alice''s computer. In return for providing access to its customer''s
    computer and web browsing behaviors, ginnybooks.com is often provided financial
    compensation. Not only can iknowatyoulike.com track Alice on ginnybooks.com, but
    it can also be used to track Alice when she visits another website that is associated
    with iknowatyoulike.com. Over time, and as Alice browses more and more websites
    that are in a business agreement with iknowatyoulike.com, the third-party advertiser
    is able to generate a very specific profile of Alice''s behaviors and preferred
    items. This information is then sold by iknowatyoudid.com to online advertisers,
