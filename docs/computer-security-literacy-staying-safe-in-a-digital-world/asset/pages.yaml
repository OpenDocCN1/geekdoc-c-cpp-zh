    # 13.4 RECOVERING FROM A PHISHING ATTACK


    One morning, in a rush to get out of the house and to work on time, Bob opens
    and quickly reads the email shown in Figure 13.2. He wants to quickly resolve
    this security alert before he leaves for work, so he proceeds to “Click here to
    resolve the problem” and is taken to a website that is an exact replica of his
    bank''s website. Bob attempts to log in to his bank account multiple times but
    is unsuccessful in achieving access. Still in a hurry, and increasingly frustrated,
    Bob closes his laptop, throws it in his bag, and decides to deal with the issue
    at a later time. On subway ride to work, Bob realizes that he fell for a phishing
    scam, line, and sink. What should Bob do now?


    This case illustrates one example of how phishing scams can play out. Sometimes,
    the victim realizes the mistake immediately and other times the victim may be
    completely fooled. In Bob''s situation, his first course of action should be to
    change the password to his bank account immediately. If Bob also uses the same
    username and password for other online accounts, he should change those passwords
    as well. As a second step, Bob should alert his bank at once and discuss his options
    with the bank''s fraud division on how to proceed given his circumstance.


    ![](img/785c52f93de89c98051552f6701d2efd_306_0.png)


