    will not prompt you to install software on your computer as the result of simply
    viewing a webpage. The only antivirus scans that should occur on your computer
    originate from the legitimate antivirus software that you have installed, and
    on-demand scans should appear only at times when you have scheduled an antivirus-scan
    to occur. Anything else should be considered highly suspect and probably malicious.


    # 11.2.3 Emails


    For years, emails have been on top of the list of methods that attackers have
    used to distribute malware. Emails are quick and effective and can be sent in
    incredible volume to many potential victims. Furthermore, attackers need not send
    malicious emails from their own accounts, but often do from accounts of people
    they have victimized. For an attacker to be successful, it is not critical that
    all the victims fall for the trap—only a small percentage.


    As discussed with the Love Bug worm in Chapter 5, emails coupled with a touch
    of social engineering have been a highly potent combination for malware distribution.
    Although the email attachment for “patch-8559.zip” is not nearly as compelling
    as open as a love letter attachment, the attachment in Figure 11.3 provides a
    more example


