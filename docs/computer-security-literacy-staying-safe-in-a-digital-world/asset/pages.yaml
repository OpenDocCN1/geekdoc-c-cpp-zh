  md: '# CHAPTER 9


    # Wireless Internet Security


    # 9.1 INTRODUCTION


    Wireless networks are literally all around us as we move through our every-day
    lives. No longer just found in private residences, airports, and coffee shops,
    wireless networks are now present in airplanes, restaurants, and city parks, just
    to name a few places. Coupled with the abundance of Wi-Fi-enabled mobile devices
    (i.e., smart phones, laptops, tablets) able to connect to wireless Internet networks,
    we are immersed in a culture of technology that enables effortless and seamless
    connection to the Internet. While wire-less networks provide the convenience of
    untouched access to the Internet, they also present a number of security threats
    that must be recognized and accounted for in order to use these networks safely.
    Such threats and corre-ponding wireless security best practices are the focus
    of this chapter.


    The topic of wireless security can be broken down into two parts. First is a description
    of how wireless networks work, providing the necessary context to describe the
    common types of threats and attacks occur while using wireless networks. The second
    is a discussion of security best practices from two perspectives. First is that
    accessing a public wire-less network as a user, perhaps in an airport or coffee
    shop. The second is from the viewpoint of an administrator of a private wireless
    network, such as one that might be in a home or apartment. Examining wireless
    security from the perspectives of both a user and an administrator will shed light
    on the security threats that you will most likely face when using wireless networks
    and reveal how wireless security best practices can miti-gate such threats.'
