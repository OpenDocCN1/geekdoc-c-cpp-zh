  md: '# CHAPTER 1


    # What Is Information Security?


    # 1.1 INTRODUCTION


    Information security has become a common term used by many, often in reference
    to a conflict between "hackers" and security professionals, or what many see as
    a war of the geeks. The term information security can have many definitions; some
    use it as an overarching term defining all security-related issues with technology,
    while others use it as a subclass of a broader category, such as information assurance.
    Simply put, information security is the process of protecting information from
    threats. In the context of this book, the terms computer security, cyber security,
    and information security are synonymous and can be used interchangeably. Information
    security is a broad field of study and employs a large number of people to implement
    and maintain computer and data security controls at a cost of billions of dollars
    per year. At first glance, information security may seem to be too complex a topic
    for average people to understand, let alone play an active role in protecting
    themselves from threats. The goal of this book is to change that perception because,
    in fact, everyone who uses a computer and the Internet has a role to play in protecting
    themselves and their information. Often, you the user play the most significant
    role in protecting your own security by the decisions you do or do not make.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Computer Security Literacy: Staying Safe in a Digital World


    This chapter all introduces you to the practical side of information security
    since, after all, practical security is the need that this book seeks to fulfill.
    Understanding basic security terminology and commonly held security truths is
    important for understanding the material in subsequent chapters. This chapter
    not only covers introductory material but also brings forth topics as cyber ethics
    and explores common security myths. The chapter further develops a simple threat
    model in which users are able to determine who and what they are protecting their
    information and computing resources as well as the value of these resources.


    # 1.2 HOW MUCH OF OUR DAILY LIVES RELIES ON COMPUTERS?


    Before the topic of information security is explored, it is important first to
    understand the impact computers have on our daily lives and what information computers
    store that is personally important to us. As we know, computers are everywhere
    and are responsible for making virtually every aspect of our lives better. Computers
    control everything from how you receive electricity, water, and other utilities
    to services ranging from air traffic control to online banking and everything
    in between. Because the protection of these computer systems is primarily the
    concern of their owners (e.g., corporations), the typical user of the system or
    service has little any role to play in protecting them. Since this book focuses
    on the user and what typical users can do to protect themselves, the focus is
    not on the impact of computers in general, but rather on the computers and information
    that you have control over and how you can protect your information from the many
    threats that lurk in the Internet.


    One way to view how people rely on computers is to examine how the average person
    perceives the privacy of information stored on computers. People use two different
    standards of privacy, one for computer data and one for noncomputer data. While
    most people would never walk up to a stranger on the street and hand their business
    card containing a wealth of their personal information (noncomputer data), people
    seem more than willing to disclose such information when it is in its digital
    form (computer data) on the Internet. Two questions you should ask yourself when
    disclosing digital information in the cyber world are, Would I give this information
    to someone I do not know in the real world? and What would this person do with
    my personal information? The answer to these questions should help guide you in
    classifying information as private or nonprivate.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# What Is Information Security? 3


    When considering private information stored on computers, there are two classifications
    of computers: personal and nonlocal. the owner of a “personal” computer owns both
    the computer hardware and the information stored on that hardware, as exemplified
    by the typical computer situation. A “nonpersonal” computer is one that is owned
    by a third party but contains information that relates to a person. A bank computer,
    for example, may be bank property, but it contains personal information about
    both you and the bank''s other clients. As will be discussed, the personal or
    nonlocal categorization of a computer does not change with respect to whether
    the information stored or processed is private or not, but it change how we, as
    individuals, handle information privacy and possibly what information we choose
    to store on computers.


    Computers are often regarded as powerful tools that can help people manage their
    daily lives; for this reason, many own personal computers. It is estimated that
    90% of individuals in the United States use a computing device, and worldwide
    personal computer sales exceeded more than 364 million units in 2011. People use
    computers to play games, to access the Internet, to manage finances, to keep in
    touch with friends and family, and retain information about their lives. Everything
    you do on a computer either generates or obtains. While a great deal of the information
    stored on your personal computer is nonlocal there is usually some information
    that would be considered private. Stop and think about the information stored
    on your computer to which you would answer “no” to the question posed previously:
    Would I give this information to someone I do not know? Such information is private
    and therefore should be protected. Since private information is stored on a computer
    owned by you (a personal computer), it is your responsibility to protect that
    information. Several of the chapters in this book focus on methods to help you
    keep such private information.


    Nonpersonal computers, on the other hand, are not owned by individuals but instead
    by third-party entities that store private information on behalf of their clients
    or users. Overall, there exists an enormous volume of private information stored
    on commercial, government, or thirdparty nonlocal computers, and these entities
    handle the safeguarding of the information stored on these systems. While a typical
    user has little or no control over many aspects of the security of the information
    stored on nonlocal computers, in certain cases the user has control over what
    information is stored and, just as important, how that information can be accessed
    (i.e., passwords). For example, a client of an e-commerce website'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Computer Security Literacy: Staying Safe in a Digital World


    freely chooses to disclose his or her name, address, and credit card number in
    exchange for the convenience of buying an item online. While the client cannot
    directly control the security of the system that processes and stores this private
    information, the client does have the ability to choose which e-commerce website
    he she prefers to at or whether to shop at all. Furthermore, if the client chooses
    to create an account on an e-commerce website for future use, the security of
    the password chosen is also a factor controlled by the client that can contribute
    to the overall security of the client''s information. This book discusses the
    types of private information you should entrust to nonpersonal computers and how
    to safeguard this information.


    # 1.3 SECURITY TRUISMS


    As discussed previously in this chapter, information security is a large and complex
    subject. There are, however, several overarching statements—security truisms—that
    can be made about information security. Security truisms—that apply to both personal
    and nonpersonal computers and should be used as guiding principles when considering
    information security.


    **Security Is a Matter of Economics:** When deciding what information to protect
    and how to protect it, the first question that should be asked is, Is it worth
    it? In other words, security costs time and money, and if the information or object
    that is being protected has little value, it does not make much sense to spend
    resources to protect it. A difficult task in this type of assessment is determining
    the value of what you are trying to protect on your computer. It is easy, for
    example, to decide how much insurance need for your home or any other tangible
    item. It is much more difficult to place an exact dollar value on the loss of
    information like pictures, videos, and documents containing personal and private
    information, especially many people regard this type of information as invaluable.
    Even defining loss in the context of information security is difficult since you
    may still possess the information after someone has gained access to it. Likewise,
    it is difficult to estimate the cost of security implementation, in time, money,
    or, and to measure the effectiveness of security controls. What is certain, however,
    is that the effort you put forth in time, money, education, or effort should be
    at least equal to the value of the information you are trying to safeguard.


    **Security Should Be Composed of Layers of Defenses:** There is no one single
    security mechanism that can protect all information from potential attacks. A
    layered approach will make it more difficult for anyone'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# What Is Information Security?


    to gain access to your information since an intruder must bypass multiple security
    methods to gain access. For example, a deadbolt lock can be used to safeguard
    a home. In addition, a motion detection alarm system can be used to detect whether
    the lock did its job or whether the intruder circumvented the lock by breaking
    through a window. You might also take your most valuable items and place them
    in a safe within the locked and alarm-equipped house. If one layer fails, there
    are additional layers in place to compensate and prevent a breach of security.


    **Absolute Security Does Not Exist:** We cannot protect against every possible
    event, especially when we cannot predict every potential security threat. No security
    system can be perfect in dealing with either the physical or the computer world.
    In the physical world, the goal of security is to make a potential attacker''s
    cost greater than the value of the asset you are trying to protect. While the
    same is true in the cyber world, the task of information security is generally
    regarded as a more challenging task due to thieves'' inherently low cost of entry
    to perform attacks. An attacker may need only modest resources to carry out a
    globally impactful attack that could victimize millions of people, and often there
    is little or no chance of the attacker being caught. Obviously, this gives cyber
    attackers an advantage over their physical counterpart.


    From the perspective of a practical computer user, no matter how much time and
    effort one puts will always be vulnerable to a certain number of attacks. Therefore,
    the objective of practical computer security is to raise the bar high enough to
    greatly reduce the number of threats able to mount a successful attack. By employing
    the defense-in-depth strategy discussed throughout this book, one can greatly
    improve the overall security of computing devices and the protection of personal
    information.


    **Security Is at Odds with Convenience:** In the physical world, security often
    involves extra steps or procedures to protect a valued object. For example, houses
    are often protected with a locked door, and a key is needed to gain access to
    the house. Information security is similar; passwords are used to gain access
    to information, requiring the user to remember and use the password every time
    the desired information is accessed. The more security mechanisms added to a computer
    system, the more intrusive security measures might be, often causing user frustration.
    This frustration may cause individuals to take shortcuts, like leaving a door
    unlocked or using a simple and easy-to-remember password thatat weakens the security
    safeguard. While added measures provide enhanced'
  merge: -1
  pgno: 30
