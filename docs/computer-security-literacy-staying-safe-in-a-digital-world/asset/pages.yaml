    # C.6 VIRTUAL PRIVATE NETWORK


    A virtual private network (VPN) is a security mechanism that enables a computer
    (i.e., client computer) outside a trusted network (e.g., corporate network) to
    connect to a trusted network securely. Much when connecting to a secure wireless
    network (Chapter 9), VPN security is provided by requiring users to provide authentication
    to the trusted network by supplying a preestablished username and password and
    by encrypting traffic between the client computer and the trusted network. To
    encrypt all network traffic, a VPN creates what is commonly referred to as an
    “encrypted tunnel” between the client computer and the trusted network, preserving
    confidentiality and mitigating any threat of eavesdropping. Unlike HTTPS, a VPN
    encrypts all Internet traffic, not just web traffic. A VPN is similar to that
    of wireless security; however, instead of encrypting wireless Internet traffic
    a VPN encrypts Internet traffic between a client computer and a trusted network
    (i.e., encrypted tunnel) regardless of the underlying network infrastructure.


    Often used in the corporate world, a VPN allows employees working from home or
    on the road to securely connect their computers to a corporate network just as
    if their computer actually resided in their regular office. The virtual network
    this enables the client computer to benefit from corporate network security mechanisms
    (i.e., firewalls and intrusion detection systems) as well as access to network
    services (i.e., file servers) available only to those connected to the corporate
    network. Figure C.12 provides a diagram showing the level of encryption provided
    by a VPN and demonstrates the function of a VPN through an explanation of how
    a web request from a client connected to a VPN would be routed through the VPN
    to the Internet and back to the client computer. It should be noted that there
    are many different kinds of VPNs providing many different types of security services.
    The following illustration and explanation of a VPN is used to give you a general
    idea of the concept of a VPN and how a VPN can be used as a defense-depth layer:'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# Appendix C: Web Surfing Security Technologies ■ 343


    1. By means of a desktop application, Alice connects her computer to a trusted
    network through a VPN, thus creating an encrypted tunnel of network traffic between
    Alice''s computer and the trusted network.


    2. When Alice makes a request to view CNN''s homepage, the request is routed through
    the Internet via the encrypted tunnel to the trusted network.


    3. From the trusted network, the request for CNN''s homepage is then routed to
    the Internet as if it originated from the trusted network and eventually is routed
    to CNN''s server.


    4. The response generated by CNN''s web server is then routed back to the trusted
    network.


    5. The trusted network then routes the response back through the encrypted tunnel
    to Alice''s computer.


    This example illustrates how a request for a website located outside the trusted
    network (i.e., on the Internet) is handled by Alice''s computer connected to a
    VPN. Alice''s computer does not directly communicate with CNN''s web server but
    instead uses the corporate network as an intermediary hop to do so. If Alice''s
    computer requests a service located in the trusted network, the request would
    then be transported through the


    ![](img/785c52f93de89c98051552f6701d2efd_368_0.png)


    FIGURE C.12 VPN diagram.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# 344 Appendix C: Web Surfing Security Technologies


    encrypted VPN tunnel to the service in the corporate network, and the response
    would be routed back to Alice’s computer via the VPN tunnel.


    In addition to allowing secure remote network access, VPNs can be used in another
    context to provide secure communications. In the case of an unsecured wireless
    network, as discussed in Chapter 9, a VPN provides a secure means to encrypt all
    network traffic to and from the client computer. Even if an attacker is sniffing
    wireless Internet traffic, the security provided by a VPN mitigates the threat
    of eavesdropping. As a result, VPNs provide a sound security solution for performing
    online activities when connected to an unsecured wireless network in a coffee
    shop or hotel lounge. It should be noted that a VPN does not prevent against spyware
    such as key-logging malware that may reside on the client computer.


    Many corporations offer free VPN access for their employees, and some require
    that remote users connect to a VPN to conduct business. If you do not have access
    to a VPN and would like to use such a security mechanism, there are a number of
    service providers that offer personal VPN access for around $10 a month. If you
    are in frequent need of secure Internet access on unsecured wireless networks,
    having access to a VPN is a must-have security mechanism since it prevents all
    types of eavesdropping threats discussed in Chapter 9, including session hijacking.


