  md: '# CHAPTER 10


    # Social Networking


    # 10.1 INTRODUCTION


    Flash forward to 30 years from now and envision a presidential race in which both
    candidates have actively participated in social networking throughout their entire
    lives. Imagine that they not only have Facebook accounts, but also have used other
    services, such as MySpace, Flickr, Tumblr, Pinterest, YouTube, Twitter, LinkedIn,
    Orkut, blogging, or even other services yet to be invented. The digital footprints
    amassed by such candidates will undoubtedly be substantial, and if history is
    a reliable indicator, every wall, blog entry, picture, and tweet will be examined
    under the finest microscope—likely needing to be explained, apologized for, or
    defended.


    Just like these future presidential candidates, as a user of social networking
    you also will accumulate an online digital footprint, and it will inevitably be
    tied to you as you progress through your life. It is unlikely that you will face
    the level of scrutiny expected to be faced by a presidential candidate, but you
    will be held accountable for your digital persona—and not only the content you
    generate but also the content about you by others. Today, such long-term consequences
    of sharing information in the virtual world are difficult to predict since this
    social phenomenon is still in its infancy. What do we understand today are the
    short-term security and privacy consequences of social networking and public information
    sharing. In the context of social networking, this chapter focuses on how malware
    is distributed on social networking sites, what type of information is shared,
    with whom this information is shared (i.e., “friends”), and how such information
    could potentially be used to one’s detriment.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 214 ■ Computer Security Literacy: Staying Safe in a Digital World


    # 10.2 CHOOSE YOUR FRIEND''S WISELY


    In the physical world, friends are people to whom we are attached by feelings,
    affection, or personal regard. In the world of social networking, however, the
    definition and application of the term friend is much more vague and loosely applied.
    For example, an individual who you have just met for the first time at a social
    gathering might not pass the test of being a friend in the physical world, but
    increasingly this type of casual connection is more than enough to pass the friendship
    test in the virtual world. Simply knowing a person''s face, name, or possible
    association to another “friend” is usually enough for many to enter into an online
    friendship with an individual. At other times, a simple friend request is sufficient,
    regardless of familiarity with the individual or any previous personal connection.
    In respect to online security and privacy, the choices made when befriending people
    in the digital world and the content (i.e., profile information, pictures, status
    updates, etc.) shared with them should not be taken lightly as such choices can
    have negative consequences in the real world.


    # 10.2.1 Access Control


    To understand the concept of a friend in the context of social networking, Facebook
    is used as a case study. The designator friend on Facebook in many ways represents
    the amount of information people are willing to share with that individual. Thus,
    the designation of a friend represents a form of access control to private information,
    much like a password protects access to an online account.


    The structure of Facebook’s privacy controls is determined by a user’s association
    with other users (i.e., friends or “friends of friends”) or more broadly to everyone
    on the Internet. These designations are then used to provide access control to
    information such as “your status, photos, and posts” or “photos and videos you
    are tagged in.” On Facebook, the most granular level of privacy control is the
