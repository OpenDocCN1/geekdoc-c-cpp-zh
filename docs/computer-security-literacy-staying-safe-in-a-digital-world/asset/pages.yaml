    # 2.4.7 Network Routing


    Previous sections discussed how devices on the Internet are addressed and how
    this addressing convention of the Internet is comparable to the postal system
    in which data is routed from one location to another until it arrives at its final
    destination. This section takes a closer look at routing—how data is moved through
    the Internet. One key function of the Internet is its ability to route packets
    (message fragments) from source to destination across multiple networks and networking
    devices, each owned or controlled by a different organization. For the sake of
    brevity, routing in this context is described as a simple function provided by
    a set of interconnected networking devices callers. It is assumed that routing
    provide methods for determining where to send packets to get them to their correct
    destinations. Before examining routing on the Internet, it is useful to look back
    at some of the history of routing in earlier networks.


    The first networks were based on some basic concepts as the telephone system,
    in which a route was first established between source and destination before any
    traffic could pass, and all traffic for a transaction followed this same established
    path. This connection-oriented approach made it easy to send and receive data,
    particularly since the data arrived in a sequential order. Undesirable complexity
    associated with this type of network results from the requirement to achieve a
    global view of all devices to establish a route. In such an approach, intermediate
    devices are not required to know about the network since they only react to commands
    given by the global network management system.


    The Internet uses a connectionless approach in which each packet of a transaction
    is handled separately by each router. Packets are sent from a source to any device
    capable of handling them. That device then queries its local route table and determines
    where to send the packet (Figure 2.19). Every device connected to a network has
    a route table that shows each possible destination to which it could next send
    the packet. In this table, potential next hops (i.e., routers) are specified by
    IP addresses and an interface (routers, for example, have two or more interfaces).
    At first glance, if every possible destination needs to have a route entry, this
    might seem to require a very large route table. The easiest way to look at how
    routing tables avoid this requirement is that each destination is represented
    by a network address consisting of an address and a network mask. The network
    mask is used to show which part of the IP'
