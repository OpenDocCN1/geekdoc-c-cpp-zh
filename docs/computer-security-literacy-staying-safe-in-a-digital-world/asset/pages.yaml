    # 11.4.5 Subdomain Name


    If a domain name is a unique identifier like a city name in a given state (not
    always the case, but let us assume so), then a subdomain can be thought of as
    a suburb of a domain name. In the context of the Internet, subdomains are often
    used to name and organize servers under a single domain name. Some websites have
    many subdomains, while others have none. The subdomain name is located between
    the protocol (i.e., http://) and the domain name (i.e., nyttimes.com). In Figure
    11.16, the subdomain name is www—a common subdomain name that is an abbreviation
    for the World Wide Web.


    The flexibility in the selection and naming of subdomains is used by phishers
    to fool you into thinking that you are on a legitimate website. As illustrated
    in Figure 11.15, the subdomain of this URL might lead users to believe that they
    are on Bank of America’s website. However, on closer examination, it can be seen
    that the domain name for this URL


