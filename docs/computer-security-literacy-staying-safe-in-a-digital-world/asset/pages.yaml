    worried about how much Bob knows about her online accounts and passwords. As a
    rule of thumb, it is good security practice for Alice (and Bob) to change their
    passwords after the end of a relationship. Jealous or vengeful lovers have been
    known to go to lengths to make their ex''s lives miserable after ever. This might
    include spying on an ex''s emails or social networking accounts, sending messages
    from an ex''s online accounts, or even changing an ex''s password to lock the
