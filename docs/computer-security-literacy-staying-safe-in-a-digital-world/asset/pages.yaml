  md: '# Malware: Defense in Depth ■ 151


    The true test of practical computer security knowledge does not occur when reading
    a book, sitting in a classroom, taking a quiz, or writing a paper about information
    security. It happens each and day as one interacts with computers and the Internet.
    The threats that we face as users of information technology are constantly evolving,
    and as a result, user education is not a static body of knowledge. Appendix A
    contains a list of websites that provide timely and practical articles about a
    range of computer and Internet security topics, including emerging threats, best
    practices, recent trends, and current events. This book is not the definitive
    guide on computer security literacy; instead, it represents a first step enabling
    you to go and read security articles in the popular press; to become more curious
    about the security settings in your web browser; to begin having conversations
    about security with family, friends, and coworkers; and to help you understand
    the practical context surrounding computer security best practices.


    # 6.7 SUMMARY


    The first step, which should be common practice of anyone using a computer, is
    to employ the defense-in-depth strategy: back up your data regularly, enable a
    software firewall, apply application and OS patches as they become available,
    diligently update antivirus signatures, and perform routine antivirus scans. These
    practices, coupled with user education (the how, why, what, and context), will
    go a long way in protecting you and your computer from the inherent risks of using
    the Internet.


