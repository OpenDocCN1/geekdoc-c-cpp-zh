    # 6.3 FIREWALLS


    Throughout history, many different civilizations have constructed defensive walls
    or barriers to separate themselves from the dangers of "others." Examples include
    the Great Wall of China, the French Maginot Line, or Hadrian''s Wall in northern
    England. Each of these structures is an example of a physical barrier that was
    constructed to fortify a safe zone between an "us" and a "them." It should be
    no surprise that defenses in cyberspace have employed similar techniques of isolation.
    Firewalls are the digital equivalent to the previous examples of physical security
    barriers. They act as defensive mechanisms that protect against dangers that lurk
    on the Internet. However, just as Hadrian''s Wall was not the end-all of defensive
    structures, in fact could be circumvented by simply sailing around it in a boat,
    so can firewalls be defeated. To avoid such a gap in security defense we examine
    exactly what a firewall does and not protect against and why it is an essential
    component—but only a component—of the presented defense-in-depth strategy.


    # 6.3.1 Function of a Firewall


    A firewall is a security mechanism that provides protection against unwanted and
    malicious network traffic (e.g., Internet traffic) from reaching a computer. Without
    a firewall, a computer is essentially a sitting duck and susceptible to network-based
    attacks from hackers or malware (i.e., worms) that propagate over a network connection.
    With a firewall, as conceptually shown in Figure 6.1, a computer is effectively
    isolated from the Internet. The task of a firewall is to prevent or filter malicious
    Internet traffic from reaching a computer while permitting legitimate traffic
    to pass unharmed. Firewalls do not, however, inspect the content of network traffic
    for malware. As a result, firewalls do not prevent a user from downloading a Trojan
    horse or a malicious email attachment, and thus other defense-in-depth mechanisms
    are needed to protect against such threats.


    A firewall filters network traffic based on the origin of a request to the Internet,
    that is, was the action first initiated by the computer before the firewall? Only
    replies that were first initiated by Alice''s computer behind the firewall are
    to pass from the Internet back through the firewall. This functionality enables
    a firewall to protect against worms and hackers'
