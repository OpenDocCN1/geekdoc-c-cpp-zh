  md: '# # Appendix B: Basics of Cryptography


    # ## B.1 INTRODUCTION


    Cryptography is one of the most heavily relied-on security mechanisms to preserve
    confidentiality of information at rest (i.e., data stored on a computer hard drive)
    and in transit (i.e., data traveling over the Internet). Without cryptography
    technology, the Internet would be a drastically different place than we have come
    to know and depend on in our daily lives. The average user of information technology,
    whether or not aware of it, relies on cryptography virtually every day of his
    or her life (i.e., via HTTPS [Hypertext Transfer Protocol Secure], secure wireless
    networks, password hashes). This appendix describes cryptography''s underpinnings
    and explores classic cryptographic algorithms, principles, and terminology and
    also provides rudimentary knowledge regarding when and how cryptography is protecting
    a user''s communication of data.


    # ## B.2 BASIC TERMINOLOGY


    This section defines a number of common terms used to describe cryptography and
    subsequently referenced not only in this appendix but also throughout the book.


    +   - **Confidentiality**: Ensuring that information is only accessible to authorized
    people.

    - **Cryptography**: The practice and study of hiding information so that it can
    be viewed and accessed only by authorized users.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# 320 Appendix B Basics of Cryptography


    +   - Plaintext: Information exchanged before any cryptography has been applied.


    +   - Ciphertext: Plaintext that has been converted through cryptography into
    a format unreadable to anyone except authorized users.


    +   - Cipher: The algorithm used to convert plaintext to ciphertext.


    +   - Key: The secret information required to convert plaintext into ciphertext
    and subsequently to convert ciphertext back to plaintext.


    +   - Encryption: The process of using a cipher and a key to convert plaintext
    into ciphertext.


    +   - Decryption: The process of converting ciphertext into plaintext using a
    cipher and a key.


    +   - Cryptanalysis: The process of converting ciphertext to plaintext without
    knowledge of the key.


    # B.3 HISTORY OF CRYPTOGRAPHY


    Cryptography has been used to preserve the confidentiality of information for
    thousands of years. The first documented case of written encryption occurred around
    1900 BC when Egyptians substituted symbols in hieroglyphic messages. In 1500 BC,
    the Mesopotamians used cryptography to safeguard the secrecy of a pottery glaze
    recipe—not different from the modern-day equivalent of encrypting a hard drive
    intellectual property. A better-documented case of historic cryptography was that
    of a system used by Julius Caesar around AD 56. Caesar used a simple system in
    which letters of the alphabet were substituted (A = X, B = Y, and so on) to communicate
    with his generals. This cryptographic cipher is now referred to as a substitution
    cipher and more specifically the Caesar shift cipher. Cryptography also played
    a central role in the 1586 Babington plot, in which Mary Queen of Scots sought
    to assassinate Queen Elizabeth in an attempt to take the throne of England.


    There have been many examples of encryption based on various types of substitutions
    and rearranging of letters, but was not until World War I and World War II that
    significant advancements were made in the area of cryptography and technology—necessity
    is the mother of invention. Many historians believe that the effectiveness or
    lack thereof of cryptography played a central role in outcomes of both world wars.
    During'
