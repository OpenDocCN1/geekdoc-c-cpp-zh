  md: '# Email Security


    # 4.2.3 Email Addressing


    Just like conventional mail, the email system is based on a system of unique destination
    and return addresses. An email sender specifies the address of the recipient in
    the format "username@email_domain_name" and typically provides his or her email
    address as the return address. However, in the conventional mail system, the sender''s
    email address typically plays no role in the process of transferring an email
    message from the sender to the receiver. Like the sender''s address on an envelope,
    the sender''s address is included in the email message and is displayed to the
    recipient by the UA, even though it does not have to be the address of the actual
    sender of the email message. In this situation, the action of pretending to be
    someone else is known as spoofing and allows a sender to pretend to be virtually
    anyone, including your bank or an online shopping website.


    To transfer an email from one MTA to another, it is necessary for the sending
