    and even romance. Simon Singh’s book *The Code Book* (referenced in the reading
    list in Appendix A) provides excellent reading for anyone wanting to learn about
    the history of cryptography and the principles and implementation of modern-day
    cryptography. The next several sections examine different cryptographic systems
    and discuss a methodology for cryptanalysis.


    # B.4 SYMMETRIC KEY CRYPTOGRAPHY: CLASSICAL CIPHERS


    Symmetric key cryptography is a method by which everyone needing to encrypt and
    decrypt information knows the same secret key. For example, if Alice and Bob are
    to send each other encrypted messages using symmetric key encryption, they must
    agree upon a shared secret key beforehand. As shown in Figures B.1 and B.2, the
    processes of encryption and decryption are virtually the same when using a symmetric
    cipher. When a secret key is applied to the cipher with the plaintext as input,
    it is converted to ciphertext. The ciphertext can then be converted back into
    plaintext using the ciphertext as input and applying- the same key used for encryption
    to the cipher. Shift, substitution,


