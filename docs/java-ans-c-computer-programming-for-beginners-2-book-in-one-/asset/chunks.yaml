    ## 引言


    Java 的历史可以追溯到 1991 年，当时程序员 Haughton、Mike Sheridan 和 James Gosling 想出了一种可以用于电视开发的编程语言。然而，它被认为超前时代，因此他们基于
    C 和 C++ 对其进行了重新开发，使其使用起来更加简单和经济。伴随重新开发而来的是 Java 的核心原则，如下：


    * 它必须是可移植的——或者说应该在许多平台上运行，且没有任何一个平台的运行效果不如其他平台；

    * 它在使用时应该是安全可靠的——而且性能良好；

    * 人们花费的时间应该越少越好，这意味着他们应该使用与他们熟悉的词汇，尽管起初看起来很复杂，但很快他们就会意识到它实际上是通行的；它应该精确地执行。


    1995 年，Sun Microsystems 最后发布了 Java 1.0——Java 的首次诞生，它具有惊人的安全性、无成本的运行时以及跨网络的文件访问功能。在过去的几年里，又发布了
    7 个版本，从 2006 年起，Java 开始通过 GNU（或通用公共许可证）提供——这意味着它现在是一门免费的开源编程语言。这源于曾经当某些内容被变为私有且仅供付费时引发的公众抗议，这显然与其核心原则不符。现在开始阅读这本书，你很快就能学到更多
    Java！


    ## 第 1 章：什么是 Java？


    Java 是由 Sun Microsystems 构建的编程语言，后来由 Oracle 公司接管。它被设计为可以在任何支持 Java 的操作系统运行。这使得该语言如此受欢迎，因为开发者只需要编写一次程序，程序就可以在任何操作系统上运行，而无需程序员更改代码。世界上大多数的现代应用程序都是用
    Java 编程语言制作的。大多数主要程序的服务器端和业务逻辑都是基于 Java 构建的。在本书中，你将学习如何编写像上面的程序，还将学习能够让你开始写作的高级概念。下面提到了
    Java 的一些设计目标：


    * 该语言旨在编写一次并能够在尽可能多的平台上运行，且没有哪个平台的运行效果不如其他平台；

    * 它在使用时应该是安全可靠的——而且性能良好；

    * 人们花费与之连接的时间应该越少越好，这意味着他们应该使用与他们熟悉的词汇，尽管起初看起来很复杂，但很快他们就会意识到它实际上是通行的；它应该精确地执行。


