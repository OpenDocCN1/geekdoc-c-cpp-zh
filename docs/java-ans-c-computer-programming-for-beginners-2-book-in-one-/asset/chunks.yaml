    # 第一章：什么是 C 语言？


    ![Tecnologia, Intelligenza Artificiale, Cervello, Pensare](img/image_rsrc3YZ.jpg)


    本书是对 C 语言的全面介绍，并配有深入的示例。人们经常误认为，由于 `Java` 和 `Python` 等现代编程语言的出现，C 语言已经失去了它的热度。然而，许多初学者并不理解
    `C` 仍然被广泛用于开发编译器和操作系统。C 语言中使用的许多高级编程概念仍然被认为是为了更好地理解编程的途径。本章将详细介绍 C 语言的各种重要特性。我们建议你使用任的操作系统来对书中介绍的程序进行实验。让我们开始吧！


    ## C 语言的历史


    在开始讨论编程语言的具体组件、原理和哲学之前，讨论其历史是必不可少的。在 20 世纪 70 年代，当编程行业还很小，有效的编程语言寥寥，`C` 是由 `Denis
    Ritchie` 在贝尔实验室发明的。他开发 `C` 语言是为了开发贝尔实验室公司正尝试构建的 `UNIX` 操作系统。`UNIX` 系统的几乎所有组件都是使用
    `C` 编程语言大量编写的。许多图形用户功能也是通过 `C` 语言的帮助实现的。


    幸运的是，`UNIX` 在技术领域变得非常流行，并为 `C` 带来了所需的普及度。随着 `C` 语言的最初成功，`Denis Ritchie` 和贝尔实验室开始在不同的操作系统中分发
    `C` 语言。过去配备 `C` 语言的著名操作系统之一是 `IBM PC`。许多与计算机相关的行业在开发 `C` 编程应用程序时开始实现自己的代码。因此，在很短的时间内，`C`
    演变成了最流行的中级语言之一。即使在发明 50 年后，`C` 仍然被认为是世界上见过的最重要的中级语言之一。它仍然被广泛用于开发系统编程应用程序以及处理机器人和电动汽车等硬件设备的人工智能应用。


    ## 为什么它如此特别？


    首先，要理解 `C` 语言被认为不适合开发现代网页和移动应用程序。有如 `Java`、`Php` 等多种现代编程语言用于此目的。`C` 语言编程专门用于真实世界的系统应用，在这些应用中，我们需要在低层与硬件工作。现代编程语言对于此类实现的库非常少，且实际上的程序结构非常糟糕，这使得它们几乎无法与硬件的低层组件进行有效交互。而
    `C` 由于其所遵循的语法结构和程序处理流，可以非常有效地与硬件组件进行交互。这就是为什么 `C` 仍然被认为是创建新操作系统和编译器的最佳选择。


    ## C 语言的特性


    尽管 `C` 处理的是底层硬件资源，但它通常被视为中级语言，因为它整合了各种高级编程语言的特性，例如整洁的语法和组织化结构。`C` 语言也广为人知，是因为它被用作哈佛、斯坦福、普林斯顿等等许多大学的入门级教学资源。


    在 `C` 语言开发的早期，由于许多公司创建了可以添加到语言中的不同库和功能，程序员为该语言开发系统性的更新变得困难。由于由于原因，国际标准组织 (ISO)
    开始为 `C` 编程语言声明单个库函数。建议所有程序员都使用相应的格式以获得更好的结果。你可以从官方 `C` 语言网站获取最新的指南。


    以下是 C 语言的一些基本特性：


    1. **可移植性**：`C` 语言被认为极具移植性，可以在任何操作系统上执行。此前，它是开发为运行在 `MS-DOS` 系统上的。但随着 `windows`、`Mac`
    和 `Linux` 操作系统的爆发，`C` 扩展了它支持不同操作系统的能力。许多第三方开发者也开发了数十种编译器来有效运行 `C` 语言程序。

    2. **轻量**：`C` 语言通常被认为比今天占据主流行业的其他高级编程语言更轻。即使是 `C` 语言的继者 `C++` 实现的代码行也比 `C` 多。`C`
    轻量特性的原因在于其有效的语法原理。许多现代编程语言如 `Java`、`Scala` 被强制使用复杂的模板代码语法在各种平台上运行应用程序。相反，`C` 使用简单且严格的语法，使该语言成为轻量级的编程实体。

    3. **函数式编程**：`C` 与其他高级语言之间最重要的区别是它支持函数式编程。它使用过程以重复的模式完成任务。其他高级语言使用面向对象的范式来实现软件中的不同功能。函数式编程通常被认为开发系统级应用是有效的。然而，随着最新的更新，我们也可以在
    `C` 语言中实现面向对象的范式。在彻底检查后，我们对 `C` 语言提供的面向对象编程功能并不完全满意。如果你渴望开发面向对象范式的应用程序，我们建议你学习
    `Python` 或 `Java`。如果你习惯简单、有效的范式，我们建议你尝试 `C` 提供的过程化编程。

    4. **可扩展性**：`C` 语言的一个重要特性是它可以根据我们的需要进行扩展以利用我们的目的。许多空间通信设施如 `NASA` 使用此功能开发它们的库，这些库可以与它们的硬件机器和火箭进行交互。当你开发类似于
    `Windows` 或 `Mac` 的操作系统时，这种在默认库中添加我们自己的函数的优势非常有用。

    5. **指针的使用**：`指针` 是 `C` 语言中一种高级功能，用于指向变量的硬件值。`指针` 可以指向内存位置，并可以用于程序中复杂功能的逻辑实现。极少数编程语言使用指针来表示存储位置值。尽管有缺点，指针仍然是实现软件系统中复杂功能的宝贵资源。

    6. **巨大的函数库**：`C` 提供了大量的系统函数库。所有这些函数都有其目的，并用于开发高级系统应用程序。我们将在书后的章节中详细讨论不同的时间函数和字符串处理函数。


    除了这些特性，`C` 语言也是一种开源资源且免费使用。通过此，我们完成了对 `C` 语言的简要而彻底的介绍。本章作为专家对 `C` 语言的介绍。在下一章中（这里这里解释的概念的延续），我们将详细讨论
    `C` 语言的各种优势和应用。让我们开始吧！


    # 第二章：为什么 C 语言很重要？


    ![Codice Binario, Digitale, Sistema Binario, Binario](img/image_rsrc3Z0.jpg)


    上一章全面涵盖了对 `C` 编程语言的重要性和历史的颂歌。本章进一步扩展了上一章介绍的概念。我们将详细讨论可用的各种 `C` 版本，以及 `C` 编程语言的应用和优势。这是一个理论章节，有助于在你的脑海中建立一些非常基础的想法，这些想法在你处理复杂的编程问题时对你有帮助。请跟随以了解更多信息！


    ## 为什么 C 编程语言很重要？


    现在有很多编程语言，所有它们都服务于重要的目的。本章的这一部分解释了一些合理的论据，证明 `C` 语言比那些高级现代编程语言更好。然而，选择他最熟悉的语言是程序员自己的选择。我们并不否认这一客观事实。我们只是在给出一些非常基本的论据，证明
    `C` 语言对于某些应用和媒介是最好的。


    a) **它们运行快**：`C` 的重要优势是它可以直接处理硬件资源。相对于其他高级语言的这种优势使得 `C` 成为一种快速处理语言。许多其他编程语言提供了丰富的额外功能，但它们无法比拟
    `C` 提供的更快的处理速度。

    b) **它是可移植的**：移植性是 `C` 最初成功的主要原因之一。在过去，汇编语言使移植性变成了一个遥不可及的困难，经常强制程序员创建多个版本的代码以部署在不同的设备上。然而，`C`
    开始提供高级的可移植性自定义，可以帮助我们在支持编译器的帮助在任何平台上运行程序代码。只要你使用 `C` 作为你的主要开发语言，就不需要担心你的软件无法在不同的操作系统上运行。

    c) **模块化**：`C` 语言允许你将代码片段以模块化实体的形式存储。这些就像用户定义的函数，可以根据需要导入。这些类似于 `Java` 编程语言中的包。模块化是可扩展的，可以解决许多程序员面临的问题。

    d) **静态类型语言**：编程界对于静态和动态类型语言有很多争论，关于哪种有效。动态和静态类型语言的区别在于在编译期间，静态类型语言显示错误更快。`C`
    是一种静态类型语言，由于这个特性它运行更快。然而，我们并不否认动态类型语言在编译过程中提供了更好的安全性特性。

    e) **学习资源**：`C` 语言除了拥有许多优势还可以帮助你深入理解编程。许多现代编程语言是动态的，不会为你提供学习和适应开辟了技术革命路径的方法。相反，`C`
    提供了许多帮助理解工作过程的信息。`C` 经常被用作许多大学的主要开发语言。

    f) **理解其他语言很重要**：`C` 帮助你理解不同的编程语言，如 `Python`、`C++` 和 `#`。


