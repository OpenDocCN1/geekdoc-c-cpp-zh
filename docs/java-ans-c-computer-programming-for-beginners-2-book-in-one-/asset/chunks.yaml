  trans: "\n\n此注释跨越两行。*/如果你查看上面的注释，你会发现它以 `/*` 开头，并以 `*/` 结尾。此外，如果你查看之前的图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，但以一个星号和一个正斜杠（`*/）结尾；这被称为\
    \ Javadoc 注释。\n\n### 什么是变量\n另一方面，变量是一个包含特定数据类型及其分配或接收的值的“对象”。之所以被称为变量，是因为其中包含的值可以根据它在代码中的用法、程序员声明其值的方式，甚至程序用户选择如何与之交互而发生变化。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记和调用手头的存储值。\n\
    \n### Java 中的变量类型\nJava 要求程序员使用声明语句，即用于声明变量的行代码，通过指定特定的数据类型和名称来定义它们。Java 有处理变量的特殊方式，即将变量定义为包含特定类型和值信息的容器，这不像\
    \ python 等语言，那些语言只需要声明变量，且变量可以动态更改其类型；Java 变量是静态的，一旦声明，其类型就会保持不变。\n\n```javaInt\
    \ number = 20;\nBoolean completed = true;\nString hello = “Hello World!\";\n```\n\
    \n声明中的语法在之前的示例中可见，变量类型在前，然后是变量名，最后是值。另请注意，声明语句可以在一行中由多个声明，如下例：\n\n```java\nInt\
    \ number = 20, Boolean completed = true, string hello = “Hello World!\";\n```\n\
    \nJava 变量可以在开始时不赋任何值；在这些情况下，Java 选择为这些变量分配一个特定的默认值，例如：\n\n```java\nByte a;\nShort\
    \ num;\nBoolean answer;\n```\n\n将分别产生值 0、0 和 false。更完整的默认值列表如下：`byte`、`short`、`int`\
    \ 和 `long` 数据类型都将产生默认值 0，而 `float` 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘`u\\\
    0000`’ 值，字符串或任何其他对象将具有 null 默认值，所有的 `Booleans` 将以 false 默认值开始。\n\n在 Java 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量\
    \ `num` 来存储一个数字，我们必须先声明变量：`int num`，然后才能赋值，例如 `num = 10`。上述过程通常被称为并指代为“赋值语句”，其中值被按照程序员声明的方式分配给变量。\n\
    \n然而，Java（实际上实际上是大多数编程语言）工作方式的一个显著特点是，在赋值语句中（例如我们的 `num = 10` 示例中），实际存储的值是等号右侧的值，即值\
    \ 10，而 `num` 只是调用该存储值的“标记”。这就是为什么有许多 Java 程序员倾向于使用“获取（getting）”值的术语，而不是“赋值（assigning）”，尽管在大多数情况下，它们可以互换使用，且在某些少数场景之外，功能基本相同。然而，请注意，一旦值被分配给变量，就需要执行函数才能使变量内部的数据更改其数据类型。\n\
    \n### 变量命名\n创建变量是一项简单的任务，特别是考虑到 Java 程序员倾向于根据数据类型或变量将存储内容的用途来创建和命名它们。然而，在命名这些变量时有几个规则，否则\
    \ Java 将无法识别它并导致错误信息。变量名的主要限制是它不应以特殊字符（如下划线或数字）开头。但是，变量名可以由字母、数字甚至下划线等字符组成，只要下划线不在开头即可。不能使用其他字符，例如\
    \ `#` 或 `$`，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会识别。\n\n虽然这些是主要规则，但在命名变量时有一些提示：\n-\
    \ 变量名应该是描述性的，因为在较长的代码中，可能很难记住“x”是做什么的。像“count”或“output”这样的变量名比使用通用的“x”或“y”更容易记忆，并将有助于避免混淆。\n\
    - 除了具有描述性外，如果变量名保持较短，变量将更容易使用。虽然像 `banking_information_account_records` 这样的变量名非常有描述性，但在程序中需要反复输入它会非常累人，而且较长的变量名会增加拼写错误的概率，会导致代码出现\
    \ bug，导致运行时错误或代码无法按预期运行，或者运行了但在过程中引入了 bug。\n- 同样请注意，Java 变量的习惯一直是全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉大小写可能会导致变量无法识别，因为\
    \ Java 将大写字母视为与小写字母完全不同的字符。\n\n### Java 基本类型\n### 方法命名规范\n我们将重新回顾命名规范，因为你将使用方法。在\
    \ Java 编程中，方法执行操作，它们还接收调用者提供的任何参数，并向调用者返回结果。以下是声明方法的语法：\n```\n[Access Control\
    \ Modifier] Return Type methodName([set of parameters]) {body of the method}\n\
    ```\n\n命名时有几个规则需要记住：\n- 方法名始终是动词（具体意味着可以使用多个单词来命名它们）。\n- 方法名的第一个单词应该是全小写字母，而其余单词应遵循驼峰命名法（camel\
    \ case）。\n现在，你应该记住，动词用于方法名，表示一个动作，而名词用于变量名，表示某种属性。遵循方法的语法和规范：`public double computeArea()\
    \ {return * Math.PI;}`\n\n### 在代码中使用构造函数\n我们将概述一些与面向对象编程相关的额外细节。正如前面所述，构造函数看起来像方法，但在许多方面仍然与方法不同。构造函数的名称将与方法相同。使用关键字\
    \ `new` 来创建构造函数的实例并对其进行初始化。以下是使用 `Employee` 类在代码中初始化的示例：\n\n```java\nEmployee\
    \ rate1 = new();\nEmployee rate2 = new();\n```\n\n构造函数隐式地返回 `void` ——这意味着它没有返回类型。你不能在构造函数的体内放置返回语句，因为编译器将其标记为错误。调用构造函数的唯一方法是通过使用\
    \ `new` 语句。我们已经提供了几种方法。\n\n最后的区别是构造函数可以有参数。回到上面的示例——第一行 `Employee()`被称为默认构造函数。默认构造函数的作用是将变量初始化为特定值。在上面的示例中，成员变量\
    \ `rate1` 被初始化为默认状态。构造函数可以重载吗？是的，可以。构造函数的行为也像方法，这意味着你可以像重载方法一样重载构造函数。以下是使用 `Employee`\
    \ 类通过不同参数重载构造函数的示例：\n\n```java\nEmployee()\nEmployee(int r)\nEmployee(int r, String\
    \ b)\n```\n\n### 如何初始化变量\n现在我们知道了如何声明变量以及可用的各种变量类型，下一步是学习如何在“表达式”中使用它们。表达式是 Java\
    \ 程序中最常用的构建块，通常用于产生一个新值，尽管在某些情况下，表达式用于给变量分配一个新值。通常，表达式由值、变量和方法调用组成。\n\n还有一些表达式不产生结果，而是影响另一个变量。一个示例是根据操作更改变量值的表达式：没有新值输出，而是存在副作用，导致变量值改变。\n\
    \n在我们之前的示例程序中，例如打印“Hello World”程序，我们将原始值引入到 `print` 函数中，这被称为“硬编码”输出。然而，在此时，我们应该尝试结合所学变量的知识。变量的操作方式与原始值相同，因为它们只是引用计算机之前存储的值，因此程序员可以使用变量名代替值。为了演示这一点，让我们记住之前的“Hello\
    \ World”程序：\n\n```java\nprint (\"Hello World\")\ninput(\"\\nnPlease press the\
    \ return key to close this window.\");\n```\n\n现在，不再硬编码 \"Hello World\" 字符串，我们可以简单地将其为一个变量并让程序输出该变量。这看起来应该是这样的：\n\
    \n```java\nstring = \"Hello World\";\nprint(string);\ninput(\"\\nnPlease press\
    \ the return key to close this window.\");\n```\n\n这应该输出与之前程序相同的结果，看起来类似于：\nHello\
    \ World Please press the return key to this window.\n\n### 由代码修改的变量\n读者可能会奇怪，为什么在这种情况下甚至使用变量，因为这让我们的代码变得更长。在非常短的代码中，例如经典的“Hello\
    \ World”，使用变量确实会使其变长，但为了演示如何使用它们来缩短代码，让我们使用另一个代码显示变量的用处。对于这段代码，我们将尝试打印几个乘法表值。在代码中我们将使用一些迭代和循环，将在以后解释。\n\
    \n```java\nInt num = 9;\nbyte count = 0;\nwhile (counter <10) {\n    print(num\
    \ \" * \");\n    print(counter \"= \");\n    print(num * counter \"\\n\");\n \
    \   counter = counter + 1;\n}\n```\n\n这段基础代码片段将输出 `num` 变量中任何内容的九倍乘法表。在这个程序中，我们要整合一个名为\
    \ `while` 条件和一个迭代函数。然而，如果我们拆解所提供的代码组件，`while` 条件告诉 Java 继续迭代其下方的代码，直到条件不成立。由于\
    \ `count` 初始化为值 0，并且每次代码运行时，`count` 变量都会增加一，循环将运行十次。代码最终看起来应该是如下输出：\n9 * 0 = 0\n\
    9 * 1 = 9\n9 * 2 = 18\n9 * 3 = 27\n9 * 4 = 36\n9 * 5 = 45\n9 * 6 = 54\n9 * 7 =\
    \ 63\n9 * 8 = 72\n9 * 9 = 81\n\n"
