    \ where it has been created. Here’s another important point that you should remember\
    \ about variables that you create within a method – it can only specify one keyword\
    \ for it: `final`. You will not be allowed to create a `default`, `protected`,\
    \ `public`, or even a `private` variable within the method body. And that is basically\
    \ how information is hidden in your code, which, if you observe, facilitates data\
    \ abstraction and encapsulation.\n\n## Encapsulation? Information Hiding? What’s\
    \ the Difference?\n\nIt would appear at first glance that encapsulation and data\
    \ or information hiding may look the same, but there is indeed a subtle difference\
    \ between these two terms. Now, Nat Pryce and Steve Freeman has made quite an\
    \ accurate distinction between these two although you may read from other authors\
    \ who use these terms interchangeably. We’ll use Freeman and Pryce’s descriptions\
    \ here to draw the difference between these two concepts in Java programming.\n\
    \n### Information Hiding\nLet’s begin with information hiding since that is where\
    \ we left off. You can already judge what “information hiding” means. It simply\
    \ means information is concealed. The actual functions and procedures performed\
    \ by the program are concealed. But, for what purpose? Why are the inner workings\
    \ kept hidden from the programmer?\n\nThe lower level details are ignored so that\
    \ you, the programmer, can focus on much more important things. That is also why\
    \ data is abstracted in Java. You can create classes, objects, and other elements\
    \ of your program; you can even import objects from one program to another without\
    \ worrying about the details on how that object does what it does. It’s like driving\
    \ a car. All you need to know is that when you insert your key into the keyhole\
    \ and start the car, it will start. You don’t have to worry about what makes it\
    \ start, how the wires are connected underneath there, where the gas goes, how\
    \ the engine burns the gas, etc. All you need to worry about is starting the car\
    \ and driving safely.\n\n### Encapsulation\nEncapsulation, on the other hand,\
    \ allows the user to control the amount of change in an object can affect the\
    \ other parts of class. The term “encapsulate” means to enclose everything in\
    \ a singular cell. That means that given the way the Java programming system is\
    \ designed, there will be no expected dependency from one independent cell to\
    \ another. Remember that objects within the Java programming environment are meant\
    \ to be stand alone, and there are no global variables to reference.\n\n## Abstraction\n\
    Abstraction simply refers to the process of hiding unnecessary details of an object\
    \ and only showing the ones that are relevant. Encapsulation on the other hand\
    \ simply means the binding of the states and the methods of an object together.\
    \ This binding eventually creates something called a `class` (we’ll cover that\
    \ in a little bit). Finally, message passing refers to the ability of objects\
    \ to interact with other objects. High-level programming languages, on the other\
    \ hand, have a much higher level of abstraction, meaning that code goes through\
    \ a program called a `compiler`, which acts as the computer’s translator, before\
    \ the computer is able to use it.\n\nThis level of abstraction is usually to the\
    \ point where the programming language already has syntax similar to English,\
    \ a global language. The `compiler` assumes the role of the translator between\
    \ the high-level language and the machine. This allows the programmer to write\
