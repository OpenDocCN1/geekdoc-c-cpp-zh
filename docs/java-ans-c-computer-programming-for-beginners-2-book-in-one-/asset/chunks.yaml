    can be used to regulate system expressions and develop effective system applications.For
    example:if (Var1 % var2)printf(" This is great")Logical operatorsC language also
    provides logical operators to compare two statements from a purely logical perspective.The
    famous logical operators are AND, OR and NOT.We will explain them in detail in
    the next section. Follow along!a) AND operatorThis logical operator displays the
    result only when both the statements that are involved are true. If any one of
    them is not true then the program will not execute.Here is the program code:#include<math.h>//This
    is used to import mathematical functionsmain(){int a=3;int b=6;int c= a*b;if(
    a == 3 AND b == 5){printf( " This is the correct statement")}elseprintf(" This
    is the wrong statement")}Output:This is the wrong statementIn the above program,
    the second statement is displayed as a result because one of the two statements
