    ## 第 8 章：Java 数据结构与算法

    ![Steinzeitcomputer, Calcolatore, Monumento, Betonrechner](img/image_rsrc3YR.jpg)


    为了更清楚地说明，假设有一个类 `Human`。这个 `class` 将具有身高、体重、性别、种族等属性。`human` 类还可以拥有如 `run`、`walk`、`talk`
    等方法。


    这些理论组件构成了 `human` 类，即对象的蓝图。现在类已经定义好了，程序员如果愿意，可以使用 `human` 类作为蓝图创建一个对象。他们可以调用类
    `Human` 并填充（populate）它的属性，赋予它特定的身高、体重、性别和种族。


    此外，对象已经内置了诸如 `run`、`walk` 和 `talk` 等函数，因此在从 `Human` 类创建一个名为 `Mike` 的对象时，它已经包含了运行、行走和说话的函数，不需要程序员再次编写这些特定函数，因为它们已经“固有”于所创建的对象中了。


    简而言之，这就是面向对象编程的意图：一种编程方式，允许程序员基于预定义的类进行设计，这样就可以更容易描述它们，并使用它们的内部或内置函数来对其进行操作。


    假设读者并不是完全完全的新手，并且已经通过 C 或或其他过程化语言进入了编程世界，那么下一个逻辑问题将是：为什么要用面向对象编程？


    嗯，它的主要优势之一是从长远来看，它可以节省时间。在较简单的算法和程序中，过程化编程通常要更快、更直接；而不需要构造和定义类，并根据该类创建对象，程序员真正需要做的只需声明必要的变量并编写函数，并创建算法来解决代码需要处理的问题。


    然而，当涉及到更复杂的程序需要更复杂的解决方案时，这就是面向对象编程开始大放异彩的地方。在很多程序中，会有时候需要将元素或数据分组在一起，以特定的方式处理，这会让工作变得更容易。


    这就是“类”（classes）的意义所在。而不是声明一组新的数据簇，程序员可以简单地基于预定义的类类，这样就可以更容易描述它们，并使用它们的内部或内置函数来对其操作。


    假设读者不是完全完全的新手……让我们看看赋值运算符在实际操作中如何工作。如果程序员以过程化的方式编写游戏，他们就必须手动描述每个棋片（兵兵、骑士、皇后、国王），并编写允许每个元素移动的函数。


    但是，如果程序员使用面向对象编程，而不是手动编写兵兵、骑士、皇后、国王，他们只需要编写代码：类来描述每个棋片。值得注意的是，仅使用初始化器的语法与使用初始化器和新关键字的语法之间没有区别。第一种（仅使用初始化器）被称为语法糖——这只是意味着语法更易于使用、更短，也更优雅。


    ## 第 9 章：数组

    ![Pensione, Università, Insegnamento](img/image_rsrc3YS.jpg)


    数组是元素的序列；每个元素必须与一个或多个位置相关。数组是存储数据的项组。索引是非负整数；在数组的情况下，它们用于标识元素。你可以考虑两者之间的关系，位于特定的位置。通常情况下，一个元素有一个索引，但有时会有更多。索引的数量是数组的维度。我们将通过查看一维数组开始；之后我们将转向多维数组。Java
    完全支持数组。数组中的每个元素将占据相同的字节量，确切的数量取决于元素的类型。同样重要的是，数组不能调整大小的；一旦创建，大小就不能更改。如果你需要一个不同大小的数组，你需要创建一个正确大小的新数组，然后从第一个数组复制所有元素。


    ### 一维数组

    一维数组是所有数组中最简单的。在这种数组中，一个元素与一个索引相关，用于存储列表项。我们可以使用三种独立的技术来创建一维数组：

    - 仅使用初始化器

    - 仅使用 `new` 关键字

    - 同时使用初始化器和 `new` 关键字


    #### 初始化器

    使用初始化器创建一维数组的语法是 `{expr}`。这种语法表示一维数组是可选的表达式列表，每个表达式用逗号分隔，全部位于大括号之间。所有的表达式都必须转换为兼容的。例如，如果你有一个两个元素的
    double 一维数组，这两个元素可以是 double 类型，而另一个可以是整数或浮点数。看这个例子：`{''J'', ''a'', ''v'', ''a''}`


    #### 使用 `new` 关键字

    `new` 关键字用于分配数组内存并返回数组引用。语法是：`new type[int_expr]`。语法告诉我们一维数组是一系列相同类型的元素。数组中的所有元素将被清零，并解释为以下值之一：

    - `0`

    - `0L`

    - `0.0F`

    - `0.0`

    - `false`

    - `null`

    - `\u0000`

    例如：`new char[4]`


    #### 使用初始化器和 `new` 关键字

    使用初始化器和 `new` 关键字创建数组的语法是上述上述两种独立语法方法的组合：`new type[] {expr,}`。因为我们可以通过查看逗号分隔的表达式列表计算出一维数组中有多少元素，所以我们不需要也不必须在方括号内使用
    `int_expr`。例如：`new char[] {''J'', ''a'', ''v'', ''a''}`


    值得注意的是，仅使用初始化器的语法与使用初始化器和 `new` 关键字的语法之间没有区别。第一种（仅使用初始化器）被称为语法糖——这只是意味着语法更易于使用。


    ### 数组变量

    单独一个新的一维数组是毫无用的。为了让它产生价值，我们必须将其引用赋值给具有兼容类型的数组变量，我们可以通过两种方式实现——直接赋值或使用方法调用。以下示例了如何声明变量：

    ```

    type var_name[] = type[];

    ```

    这两种语法都是声明存储一维数组引用的变量。你可以使用任何喜欢的类型，但首选的方法是第一种，即在变量后带有方括号。在这些示例中，有数组变量 `name1`、`name2`
    和 `name3`。方括号告诉 Java 这些变量将存储对一维数组的引用。`char` 关键字表示数组元素必须存储 char 类型的值，由于 Java 可以进行转换，你可以指定非负值。例如，以下是完美的，符合范围（0
    到 65535），并且可以轻松转换为 char：

    ```

    char[] chars = {''A'', 10};

    ```

    然而，下一个示例是不符合范围的：

    ```

    char[] chars = {''A'', 80000};

    ```

    所有数组都有一个长度属性。例如，`name1.length` 会返回一个值 4。通过指定的索引可以访问数组中的任何元素，我们通过以下语法来实现这一点：

    ```

    array_var[index]

    ```

    在这个表达式中，我们有一个正整数索引；长度属性值。不要忘记，索引从零开始。看几个示例：

    ```

    char ch = names[0]; // Get value

    names[1] = ''A''; // Set value

    ```

    如果指定了负索引，或大于（>=）长度值，Java 将创建一个异常并抛出它。该异常是：

    ```

    java.lang.ArrayIndexOutOfBoundsException

    ```


