    \                                              。以下是翻译后的中文内容：\n\n[content]\n你已经熟悉了前两个——`public`\
    \ 和 `private`。当变量被声明为 `public`（公共）时，它可以出现在你正在编写的程序的任何地方。相比之下，当它为 `private`（私有）时，它无法在被实例化的类体之外的任何地方被看到或访问。\n\
    \n让我们来看看另外两个访问控制修饰符。列表中的下一个是 `protected`（保护）——当你想要创建库（libs）时它非常有用。当一个变量是 `protected`\
    \ 时，意味着它只能在实例化此 Java 构造的包内可见——注意，这还包括所有的子类。另一方面，`default`（默认）访问控制修饰符在未指定另外三个修饰符时使用使用。在这种模式下，变量可以在程序员实例化的包或类中被访问。然而，请注意，变量仅在类的主体内可访问，而在它的子类中是不可用的。\n\
    \n请注意，你也可以在方法内部创建对象，通常规则适用——对象或变量只能在创建它的方法体内被访问。关于你在方法内部创建的变量，还有另一个重要点你需要记住——它只能为其指定一个关键字：`final`（最终）。你将不允许在方法体内部创建\
    \ `default`、`protected`、`public` 甚至 `private` 变量。这基本上就是信息在你的代码中隐藏的方式，如果你观察的话，它有助于数据抽象和封装。\n\
    \n## 封装？信息隐藏？它们有什么区别？\n\n乍一看，封装与数据或信息隐藏似乎是相同的，但这两个术语之间确实存在细微的。现在，Nat Pryce 和 Steve\
    \ Freeman 对这两个术语做出了非常准确的区分，尽管你可能从其他作者那里看到他们交叉使用这些术语。我们在这里使用 Freeman 和 Pryce 的描述来区分\
    \ Java 编程中这两个概念的区别。\n\n### 信息隐藏\n让我们从信息隐藏开始，因为这是我们上次停止的地方。你已经可以判断出“信息隐藏”意味着什么。它简单意味着信息被隐藏。程序执行的实际函数和过程被隐藏了。但是，为了什么目的？为什么要将内部运作对程序员隐藏起来？\n\
    \n忽略低层细节是为了让你，作为程序员，可以关注更重要的事情。这也是为什么在 Java 中数据被抽象的原因。你可以创建类、对象以及程序的其他元素；你甚至可以从一个程序导入对象到另一个程序，而无需担心该对象如何运作的细节。这就像开车。你只需要知道，当你把钥匙插入锁孔并启动汽车时，它就会启动。你不需要担心是什么让它启动的，下面的电线是如何连接的，汽油去向哪里，引擎是如何燃烧汽油的等。你只需要启动汽车并安全驾驶。\n\
    \n### 封装\n另一方面，封装允许用户控制对象对类其他部分影响的变化量。“封装（encapsulate）”一词意味着将一切都包裹在一个单一的单元中。这意味着，根据\
    \ Java 编程系统的设计方式，一个独立单元到另一个单元之间将不会有预期的依赖。记住， Java 编程环境中的对象本应该是独立的，而且没有全局变量可以引用。\n\
    \n## 抽象\n抽象简单指的是隐藏对象不必要的细节的过程，并只显示相关的细节。另一方面，封装简单意味着将对象的状态和方法绑定在一起。这种绑定最终创建了被称为\
    \ `class`（类）的东西（我们稍后会介绍）。最后，消息传递指的是对象与其他交互的能力。另一方面，高级编程语言具有更高层次的抽象，意味着代码在计算机可以使用它之前，会通过一个名为\
    \ `compiler`（编译器）的程序，该程序充当计算机的翻译官。\n\n这种程度的抽象通常到编程语言已经具有类似于英语（一种全球语言）的语法的地步。`compiler`\
    \ 承担了高级语言和机器之间翻译官的角色。这允许程序员以更自然的方式编写他们的程序，因为它允许编码员使用更“自然”的语言，而高级语言允许某些功能实现自动化，使编码员的生活变得简单得多。然而，这里的权衡是代码必须通过\
    \ `compiler`，这会让程序的运行和执行所需时间延长，而且与低级语言相比，计算机通常会使用更多内存。在这些高级语言中包含了更广为人知的，例如 `Python`、`C++`\
    \ 以及我们今天的话题 `Java`。\n\n## 第 16 章：Java 面试题\n\n### Java 编程语言\n- 什么是 WORA 原则？它为什么有益？\n\
    - Java 应用程序如何在多个平台上运行？\n- `JRE` 和 `JDK` 之间有什么区别？\n- 过程化编程和面向对象编程有什么区别？\n\n###\
    \ 面向对象编程（第一部分）\n- `class`（类）和 `object`（对象）有什么区别？\n- 当 `object` 第一次实例化时会发生什么？\n\
    - 基本类型（primitive type）和 `object` 之间有什么区别？\n- 自动装箱（autoboxing）和拆箱（unboxing）有什么区别？\n\
    - 什么是数组？\n- `String` 与普通对象有什么区别？\n- `StringBuilder` 和 `StringBuffer` 有什么区别？\n\
    - 为什么使用 `enums`（枚举）？\n\n### 面向对象编程（第二部分）\n- `method declaration` 和 `method signature`\
    \ 之间有什么区别？\n- 什么是递归方法？\n- `final` 关键字的作用是什么？\n- `static` 关键字的作用是什么？\n- 为什么 `static`\
    \ 方法无法访问非静态字段 (static field)?\n- 什么是访问修饰符？\n\n### 对象的基类\n- 浅拷贝和深拷贝有什么区别？\n- 为什么拷贝构造函数是优的？\n\
    - 标识符和 `equals()` 方法有什么区别？\n- `hashCode()` 方法和 `equals()` 方法之间有什么关系？\n- `toString()`\
    \ 方法的默认实现是什么？\n- `finalize()` 方法是用于清理的？\n\n### 组合与继承\n- 组合和继承有什么区别？\n- 方法重写和方法重载有什么区别？\n\
    - 你将如何决定使用组合或继承？\n\n### 抽象类与接口\n- `abstract class`（抽象类）和 `interface`（接口）之间有什么区别？\n\
    - 你将如何决定使用 `abstract class` 还是 `interface`？\n- 为什么类不能既是 `final` 又 `abstract`？\n\
    - 围绕 `interfaces` 设计代码库的价值是什么？\n- 什么是闭包（closure）？\n- 什么是 lambda 表达式？\n\n### 异常\n\
    - 什么是异常？\n- 未检查异常（unchecked）和已异常（checked）有什么区别？\n- 你将如何决定使用未检查或已异常？\n- `try/catch/finally`\
    \ 块是如何工作的？\n- `try-with-resources` 语句是如何工作的？\n\n### 泛型\n- 编译错误和运行时错误有什么区别？\n-\
    \ `generics`（泛型）的目的是什么？\n- `wildcards`（通配符）的不同类型有哪些？\n- 类型擦除（type erasure）是什么？\n\
    - 泛型的局限性有哪些？\n\n### 并发性\n- `Thread`（线程）的生命周期是什么？\n- 为什么共享资源需要同步（synchronization）？\n\
    - 什么用作 `synchronized` 静态和非静态方法的锁？\n- 如果两个线程访问同一个对象的非静态方法，会发生什么？\n- 如果两个线程访问同一个对象的\
    \ `synchronized` 静态方法和非静态方法，会发生什么？\n- `volatile` 关键字对于变量保证了什么？\n- `synchronized`\
    \ 关键字对于代码块保证了哪什么？\n- 有哪些内置的并发数据结构？\n- 执行器框架（executor framework）是什么？\n- `ThreadLocal`\
    \ 变量是什么？\n- 原子变量（atomic variables）是什么？\n\n### 内存管理\n- `JVM` 如何划分 `heap`（堆）内存？\n\
    - 垃圾收集的标准算法是什么？\n- 什么是内存泄漏？如何识别它们？\n- 引用的四种类型有哪些？\n- `ReferenceQueue` 是什么？\n-\
    \ 为什么幻引用比使用 `finalize()` 方法安全？\n\n### Java 数据库连接\n- `JDBC` 是什么？\n- 获取 `Connection`\
    \ 对象的两种方法是什么？\n- `Statements` 的三种类型是什么？\n- `ResultSet` 是？\n- 什么是 SQL 注入？如何防止？\n\
    - 对象关系映射（object-relational mapping）的优缺点是什么？\n- `Hibernate` 是什么？\n\n### Web 应用程序\n\
    - 什么是 servlet 容器？\n- 什么是 Web 应用程序？\n- 什么是 `WAR` 文件？\n- 什么是 `web.xml` 文件？\n- `Servlet`\
    \ 和 `HttpServlet` 之间有什么区别？\n- `Servlet` 和 `JSP` 之间有什么区别？\n- 什么是 servlet 过滤器？\n\
    - 什么是模型-视图-控制器（model-view-controller）模式？\n\n### Web 服务\n- 什么是面向服务的架构（service-oriented\
    \ architecture）？\n- 什么是 Web 服务？\n- `SOAP` 服务和 `REST` 服务之间有什么区别？\n- `JAX-WS` 和\
    \ `JAX-RS` 有什么区别？\n- 哪些框架有助于开发 Java Web 服务？\n\n### 算法\n- 什么是大 O 表示法？常见的例子有哪些？\n\
    - 什么是二分查找？它的性能如何？\n- 什么是插入排序？它的性能如何？\n- 什么是归并排序？它的性能如何？\n- 什么是快速排序？它的性能如何？\n-\
    \ 什么是 timsort（时间变排序）？它的性能如何？\n\n### Java 集合框架\n- `ArrayList` 和 `LinkedList` 之间有什么区别？\n\
