    ## 第 11 章：Java Web 开发

    什么是 Java Web 应用？

    简单来说，Java Web 应用是用 Java 构建的 Web 应用。但不仅如此，它们是生成完全交互式应用程序，每个页面包含不同的标记语言类型（如 XML、HTML
    等）以及动态内容。通常，一个 Java Web 应用将由 Web 组件组成，这些组件修改数据、存储数据、与 Web 服务及数据库交互，并根据用户的请求渲染内容。某些组件是
    JSP – JavaServer Pages、JavaBeans 和 servlets。开发 Web 应用所需的许多任务可能是重复的，或者可能需要大量的模板代码。我们可以使用
    Web 框架来消除常见开发活动的某些开销，例如，许多框架包含了帮助你管理会话的有用库，并且通常促进代码的重用。什么是 Java EE？企业版（Java EE）是最常用的平台之一，包含了一系列协调技术，可以处理一些开发开销。

