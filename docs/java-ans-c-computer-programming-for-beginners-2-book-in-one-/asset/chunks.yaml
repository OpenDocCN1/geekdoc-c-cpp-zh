    ## INTRODUCTION


    The history of Java dates back to 1991 when programmers Haughton, Mike Sheridan,
    and James Gosling thought of a programming language that could be used for the
    development of TV. However, it was deemed to be ahead of its own time, and thus
    they redeveloped it based on C and C++ to make it easier and more economical to
    use. With the redevelopment also came the core principles of Java, which are:


    * It has to be portable—or that should work on many platforms as possible, without
    any of them not working as well as the other;

    * It should be safe and secure to use—and definitely well;

    * People should feel connected to it as little time as possible, which means that
    they should be working with words that are somehow familiar to them, and even
    though it looks complex at first, sooner later, they have to realize that it actually
    works; it should perform with precision.


    In 1995, Sun Microsystems finally released Java 1.0—the first inception of Java,
    which had amazing security, no-cost runtimes, and file access across all networks.
    Over the years, 7 more releases had been made, and ever since 2006, Java started
    to be available through GNU, or General Public License—meaning it is now free,
    open-source programming language. This stemmed from the public outcry that happened
    once when some of its contents were made private and only available for a fee,
    which definitely not resonate with its core principles. Start reading this book
    now and youll learn more about Java in no time!


    ## Chapter 1: What is Java?


    Java is a programming language built by Sun Microsystems, which was later taken
    over by Oracle Corporation. It is designed to run on any operating system that
    supports Java. This is what made the language so popular, because the developer
    just had to write the program once, and the program could then run on any operating
    system without the need for the programmer to change the code. Most of modern
    applications built around the world are made from Java programming language. Most
    of the server side and business logic of major applications are built on the entire
    course of this book you will learn how to write programs such as the one above,
    and also learn advanced concepts that will enable you to start writing. Some of
    design goals for Java are mentioned below:


    * The language is intended to be written once and have the ability to run on any
    operating system.

    * The language should provide support for numerous engineering principles.

    * The language is intended to be used in developing software for distributed environments.

    * Portability is an important factor. This is why Java has the ability to run
    on Windows, Linux and MacOS operating system.

    * Support for internationalization is very important. Java is intended to be suitable
    for writing applications for both hosted and embedded systems. Other design goals
    are discussed next:


    ### 1 Strong Type Checking


    Java is strong type language. Every variable that defined needs to be attached
    to data type. You don’t need to understand the complete program for now, but let’s
    have a quick look at 2 lines of the code:


    ```

    int i=5; own```


    Here we are defining something known as variable, which is used to hold value.
    The value that can be stored depends on the data type. In example we are saying
    that `i` is of the type `int` or Integer value.


    ### Array Bounds Checking


    At runtime, Java will check whether the array has the required number of values.
    If one tries to access a value which outside the bounds of the array, an exception
    will be thrown. You don’t need to understand the complete program for now, but
    let’s have a quick look at the following lines of the code:


    ```

    int[] array1 = new int[2];

    ```


    Here we are declaring an array, which is a set of integer values. The value of
    2 means that we can only store two values in the array:


    ```

    array1[0] = 1;

    array1[1] = 2;

    array1[2] = 3;

    ```


    With this code we can see that we are assigning 3 values to the array. When you
    run this program, you will get an error because the program will see that the
    array has gone out of its allowable bounds of two. You will get the below error
    at runtime.


    ```

    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: 2at HelloWorld.main(HelloWorld.java:8)

    ```


    ## Chapter 2: Why Java is important?


    Next, Java has syntax and features that resemble other programming languages like
    C and C++. If you have any prior programming experience, you will find learning
    Java a breeze. Even if you are totally new to programming, you can rest assured
    that Java is designed to be a relatively easy language to learn. Most programmers
    find it easier to learn Java than say, C or C++. Java is also designed to be platform
    independent. As mentioned earlier, Java code is compiled into bytecode first,
    which can be run on any machine that has the Java Virtual Machine. Hence with
    Java, you can write the code once and run it anywhere you want. Next, Java is
    an object-oriented programming (OOP) language. Object-oriented programming is
    an approach to programming that breaks a programming problem into objects that
    interact with each other. We’ll be looking at various object-oriented programming
    concepts in this book. Once you master Java, you will be familiar with these concepts.
    This will make it easier for you to master other object-oriented programming languages
    in future.


    ### Basic Tips


    How has java become so successful? Java is such a widespread language for many
    reasons, and it owes a lot around the key principles it was designed around. One
    of the first principles of Java is its ease of use. The fundamentals of the Java
    programming language were adapted from C++, another extremely popular higher level
    programming language. However, though C++ and its predecessors, C and C are powerful
    languages, it tends to be rather complex in terms of syntax, and is not fully
    adapted for some of the purposes of Java, notably for internet technology integration.
    Java thus was able to base itself on C++, and build on this powerful language’s
    fundamentals in order to provide a language that is also similarly powerful, but
    easier to use and better suited for specialized users. Java is also a very reliable
    programming language, intentionally build in order to reduce and even eliminate
    the possibilities of fatal errors that arise from programmer errors. This is why
    Java heavily relies on object oriented programming principles, which allows the
    data and the manipulation of data to be packaged together, making Java more robust
    and reliable, as well as much more modular, allowing for code packages to be switched
    out and adapted as needed. In addition to the previous qualities of ease of use
    and reliability, given Java’s nature of initially being designed for mobile devices,
    it was designed to be able to provide a higher level of security and safety for
    its programming, as it was initially meant for mobile devices, which by their
    nature are meant to exchange data.

