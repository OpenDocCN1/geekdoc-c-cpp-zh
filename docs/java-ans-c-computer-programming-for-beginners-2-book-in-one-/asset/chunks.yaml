    13: Control Flow StatementsWhen we talk about conditional logic, we are mostly
    talking about the IF word.For example, IF user is younger than 18 then display
    this message; IF user is older than 18, display this message. Luckily, you will
    find that using conditional logic in Java is easy so let’s begin by looking at
    IF statements.  IF Statements   One of the most common things in computer programming
    is to execute code when one thing happens instead of something else. Run the program
    and check it – Note that NetBeans tends to run the program in bold text in the
    window for Projects, not the code that you displayed.If you want the code run
    in your coding window, right-click on the code, anywhere and then click on Run
    File in the menu that appears. The output will now appear in the Output window. Next,
    we change the user variable value from 17 to 18; now run the program again. You
    should see that the program runs fine, no errors but nothing will be printed.The
    reason for this is because the message is in between the curly brackets in the
    IF statement and that statement is looking for values of lower than 18\. If the
    condition isn’t met, Java will ignore the curly brackets and anything in between
    them, moving on to the rest of the code. Nested ifs    We have previously looked
    at nested scopes; now we want to look at nested ifs. You will interact most of
    the time with a nested if. The greatest lesson to learn is nested ifs point to
    the block of code with the else. Read the following example:![Description: Description:
    00027.jpeg](image_rsrc3YX.jpg)You should be able to note that the last else has
