    For example:int[] pair = { 4, 2, };is equivalent to the following four statements.int[]
    pair;pair = new int[2];pair[0] = 4;pair[1] = 2;AssemblerAn assembler is a program
    that is used for translating programs that are written in the assembly language
    into a binary form of a specified instruction set.Assembly languageThe assembly
    language is a symbolic one that corresponds very closely to a central processing
    unit (CPU) instruction set. The assembler (above) is the translation program that
