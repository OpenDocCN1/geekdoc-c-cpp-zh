    \n### 行为型设计模式\n- `command`（命令）模式是什么？什么时候有用？\n- `observer`（观察者）模式是什么？什么时候有用？\n\
    - `strategy`（策略）模式是什么？什么时候有用？\n- `visitor`（访问者）模式是什么？什么时候有用？\n- `null object`（空对象）模式是什么？什么时候有用？\n\
    \n### 反射\n- 什么是反射（reflection）？什么是内省（introspection）？\n- 什么是 `Class` 对象？\n- 什么是\
    \ `Field` 对象？\n- 什么是 `Method` 对象？\n- 反射的优缺点有哪些？\n\n### 依赖注入\n- 什么是控制反转（inversion\
    \ of control）？\n- 服务定位器（service locator）和依赖注入有什么区别？\n- 构造器注入和 setter 方法注入（setter\
    \ injection）有什么区别？\n- 配置 `Spring` 容器的方式有哪些？\n- `Spring` 容器的生命周期是什么？\n\n### 面向切面编程\n\
    - 核心关注（core concern）和横交叉关注（cross-cutting concern）有什么区别？\n- 什么是面向切面编程？\n- 代理（proxy）和二进制织入（binary\
    \ weaving）有什么区别？\n- `AspectJ` 库是什么？\n\n### 单元测试\n- 什么是测试驱动开发（test-driven development）？为什么有益？\n\
    - 什么是单元测试？`JUnit` 是什么？\n- 什么是固件（fixtures）？什么是模拟对象（mock objects）？\n\n### 编程问题\n\
    - 你如何写一个计算某数阶乘的方法？\n- 你如何判断一个字符串是否是回文（palindrome）？\n- 给定行，你如何验证括号是否平衡？\n- 给一个缺失\
    \ 1 到 100 数字的无序列表，你如何确定它？\n\n### 个人问题\n- 你能介绍一下你自己和你的经验吗？\n- 你能介绍你参与过的任何项目吗？\n\
    - 你能介绍一次解决特别挑战问题的经历吗？\n- 你能介绍一次与同事解决分的经历吗？\n- 你的开发环境是怎样的？\n- 你为什么想在我们公司工作？\n-\
    \ 你为什么要离开上一份工作？\n- 你最大的缺点是什么？你的优点是什么？\n\n第 17 章：Java 语言与术语\n\n绝对路径（Absolute filename）\n\
    绝对路径是指从文件系统顶部或根目录提供的完整路径，例如 `c:\\Java\\bin\\javac.exe`。抽象（Abstraction）是对复杂情况的简单表示。在基本术语中，抽象隐藏了代码段或程序的运作方式，只显示其功能。OOP\
    \ 设计通常围绕对现实对象进行建模时寻找抽象级别展开。抽象过高会导致细节不足；抽象过低则可能导致程序创建变得复杂。抽象方法（Abstract method）\n\
    抽象方法是头部包含保留关键字 `abstract` 的方法。抽象方法没有方法体。在接口内部设计的任何方法都被视为抽象的，没有例外。抽象方法的体定义在抽象类的子类中，或者如果一个类实现了接口，则定义在该类中。\n\
    抽象窗口工具包（Abstract Windowing Toolkit）\n`AWT` 或抽象窗口工具包包含了一类类，旨在使创建 GUI（图形用户界面）应用程序变得简单得多。你可以在\
    \ `java.awt` 包组找到它们，包含的类有按钮、窗口、文本区域等。访问器方法（Accessor method）\n访问器方法是专门用于访问类私有属性的方法。根据\
    \ Java 惯例，访问器方法以 `get` 加属性命名。例如，为了访问名为 `speed` 的属性，访问器方法为 `getSpeed()`。当属性被设置为\
    \ `private` 时，它会阻止外部类修改该值，除非使用了修改器方法（mutator method）。我们可以使用访问器方法对私有属性提供特定访问，并阻止其他类的其他对象访问私有属性——需要使用正确的可见性来实现这一点。\n\
    实际参数\n这是从方法外部传递到方法的参数值。当方法被调用时，值（实际参数）将复制到与之对应的形式参数中。实际参数类型和形式参数类型必须相互兼容。\n形式参数（Actual\
    \ parameter）见实际参数。\n地址空间（Address space）\n这是进程运行的虚拟内存区域。\n见 server。\n聚合（Aggregation）\n\
    这是一个 OOP 概念，一种关系，一个对象至少有一个另一个从属对象构成其状态。这些从属对象往往不会在包含它们的对象之外独立存在。当这个对象不再存在理由时，它的从属对象也不存在了。例如，你可能有一个拥有几个\
    \ `pump` 对象的 `GasStation` 对象。一旦 `GasStation` 对象被销毁或不再被使用，`pump` 对象也会随之消失。聚合也被称为\
    \ HAS-A 关系，与 IS-A 关系的继承区分开来。别名（Aliases）\n是对一个对象的多个引用。对象可以接收来自任何别名的消息，任何状态的改变结果都会被所有别名检测。匿名数组（Anonymous\
    \ array）\n这是一个没有标识符创建的数组。匿名数组通常作为实际参数创建，如下所示：Yearlyfall y = new Yearlyfall(new\
    \ int[]{10, 8, 9, 5, 3, 2, 0, 1});\n匿名类（Anonymous class）\n是一个没有类名的类。这种类型的类通常是子类或接口实现，通常作为实际参数创建或作为方法的返回结果。例如：\n\
    ```\nbutton.addActionListener(new ActionListener(){\n    public void actionPerformed(ActionEvent\
    \ e){\n        System.exit(0);\n    }\n});\n```\n匿名对象（Anonymous object）\n是一个没有标识符创建的对象。通常，它们是数组元素，方法的结果。例如：\n\
    ```\nPoint[] vertices = {new Point(0,0),new Point(0,1),new Point(1,0)};\n```\n\
    追加模式（Append mode）\n追加模式是一种文件写入模式，其中文件内容被保留并添加新内容。\n小程序（Applet）\nApplet 是一个基于 Applet\
    \ 类的小型 Java 程序。它们主要用于在网页上提供活跃内容，并具有许多限制它们能做什么的功能。\n应用程序（Application）\n有时与 program\
    \ 用同，但从 Java 的角度来说，application 是描述这些 程序的术语。\n应用程序编程接口（API）\nAPI 是用于编写程序的定义集合。在\
    \ Java 中，一个 API 是一个类、包和接口的集合，用于创建复杂的应用程序。\n参数（Argument）\n是从方法外部传递到方法的参数值。当方法被调用时，值（实际参数）将复制到与之对应的形式参数中。实际参数类型和形式参数类型必须相互兼容。\n\
    算术表达式（Arithmetic expression）\n算术表达式是一个包含 float 或 int 类型数值的表达式。例如，算术运算符 `*`、`-`\
    \ 和 `/` 均接受算术表达式作为操作数，其结果是算术值。\n算术运算符（Arithmetic operator）\n是一种返回数值结果的运算符，是算术表达式的一部分。运算符包括\
    \ `+`、`-` 和 `/`。Arpanet 是在互联网之前的网络。\n数组（Array）\n是固定大小的对象，可以包含至少零项。\n数组初始化器（Array\
    \ initializer）\n用于初始化数组。步骤在分离的角色中。例如：\n```java\nint[] pair = {4, 2};\n```\n等同于以下语句：\n\
    ```\nint[] pair;\npair[0] = 4;\npair[1] = 2;\n```\n汇编器（Assembler）\n是翻译汇编语言的程序。\n\
    汇编语言（Assembly language）\n是一种与中央处理器（CPU）密切对应的符号语言。汇编器（上述）是将程序转换为二进制的程序。\n赋值运算符（Assignment\
    \ operator）\n是等号（=`），用于将表达式的值存储到变量中；例如 `variable = y`。运算符的右侧在赋值之前必须被求值。赋值语句（Assignment\
    \ statement）\n是包含赋值运算符的语句。\n属性（Attribute）\n是类私有属性的特定使用。类实例中的属性值定义了当前状态。类定义可以通过给定的属性或属性对有效实例施加限制。例如，如果属性持有类类的考试结果，它不应该有负值。属性可以使用修改器方法和访问器方法进行操纵。\n\
    基础情况（Base case）\n是通过递归方法采取的非递归路径。\n基础类型（Base type）\n指示数组中的项类型，即。数组的定义类型。例如：\n\
    ```java\nint[] numbers;\n```\n数字的基础类型为 `int`。如果基础情况是类的类型，它将指示数组可以存储的最低类型。例如：\n\
    ```java\nShip[] berths;\n```\n所有可以存储在 berths 中的内容都是 Ship 类的实例。如果数组的基类型是 Object，它可能被用于存储任何类的实例。\n\
    行为（Behavior）\n类方法是类行为实现。特定对象的行为是类方法定义和特定对象当前状态的混合。\n大端（Big-endian）\n一种机器类型。机器之间最常见的区别之一是它们如何存储每个字节的数值数据。大端机器首先存储高位字节，然后是低位字节。另见小端。二进制（binary）\n\
    二进制是 2 基数表示。在 2 基中，只有 1 和 1 用作数字，数字的位置代表 2 的连续幂。另见位。\n二进制运算符（Binary operator）\n\
    二进制运算符是接受两个操作数的运算符。Java 有几种二进制运算符，包括一些算术和布尔的。\n二分查找（Binary search）\n是一种在排序数据中搜索的方法，首先查看中间位置。搜索将向左或向右移动，消除另一侧，直到所有数据都搜索完毕或找到特定项。\n\
    位（Bit）\n是一个二进制位。它只能取 0 和 1 两个值。位是构建数据和程序的的基本块。计算机会以位为单位定期移动数据。\n位操纵运算符（manipulation\
    \ operator）\n如 `|`、`&`、`^` 用于操纵数据内部的位。`<<`、`>>` 和 `>>>` 移位运算符也是位操作。\n空 final 变量\n\
    空 final 是在声明时未初始化的 final 变量。这些变量在使用之前需要以两种方式之一初始化——在每个类的构造函数或在实例中。\n块（Block）\n\
    是由一对大括号 `{}` 包裹的声明和语句构成的代码段。类体和方法体都用于封装作用域级。书签（Bookmark）\n是网络浏览器用于记忆细节的一种方式。布尔（Boolean）\n\
    是 Java 中的一种基本类型。它只有两种可能的值——TRUE 或 FALSE。布尔表达式（Boolean expression）\n是产生布尔结果的表达式，即\
    \ TRUE 或 FALSE。`&&` 和 `|` 运算符等与其他将接受布尔操作数，产生布尔结果。关系运算符将接受不同类型的操作数并产生布尔结果。\n启动（Boot）\n\
    当你打开计算机时，它会“启动”，该术语源于“pulling yourself up by your bootstra”（自提鞋带）。引导类（Bootstrap\
    \ class）\n是 Java 平台核心的一部分，如 `java.io` 和 `java.lang` 包中的类。边界错误（Boundary error）\n\
    是由于问题边缘发生的错误导致的结果，例如没有数据项、数组索引越界、循环终止等。边界错误是常见的逻辑错误。受限重复（Bounded repetition）\n\
    是循环体内的语句执行一定次数——循环\n"
