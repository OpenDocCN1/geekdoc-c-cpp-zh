    # Chapter 1: What is the C language?


    ![Tecnologia, Intelligenza Artificiale, Cervello, Pensare](image_rsrc3YZ.jpg)


    This book is a comprehensive introduction to C language with in-depth examples.
    It is often misunderstood that C has lost its popularity due to the entrance of
    modern programming languages such as `Java` and `Python`. However, a lot of beginners
    don''t understand that `C` is still extensively used to develop compilers and
    operating systems. A lot of advanced programming concepts used in C language are
    still considered a pathway to understanding programming in a better way. This
    chapter introduces various important characteristics of C language in detail.
    We recommend you to use an operating system of your choice to experiment experiment
    with the programs introduced in this book. Let us go!


    ## History of C


    It is mandatory to discuss the history of a programming language before starting
    to discuss its specific components, principles, and philosophy. In the 1970s when
    the programming industry was very small and when there were very few effective
    programming languages, `C` was invented in the Bell labs by `Denis Ritchie`. He
    developed `C` language to use it for the development of the `UNIX` operating system
    that Bell labs corporation is trying to build. Almost all the components of the
    `UNIX` system are extensively written using the `C` programming language. A lot
    of graphical user functionalities were also implemented with the help of the `C`
    language.


    Luckily, `UNIX` has become very popular in the technological landscape and has
    given `C` its required popularity. With the initial success of `C` language, `Denis
    Ritchie` and Bell labs started to distribute `C` language within different operating
    systems. One of the famous operating systems that came equipped with `C` language
    in the old times is `IBM PC`. A lot of the computer-related industries started
    to implement their code while developing `C` programming applications. So, within
    a very little time, `C` has evolved into one of the most popular middle-level
    languages. Even after 50 years after its invention, `C` is still considered one
    of the most important middle-level languages that the world has ever seen. It
    is still widely used to develop system programming applications and artificial
    intelligence applications that deal with hardware equipment such as Robotics and
    Electric cars.


    ## Why is it so special?


    First of all, understand that `C` language is considered bad for developing modern
    web and mobile applications. There are several modern programming languages such
    as `Java`, `Php` to serve this purpose. `C` language programming is exclusively
    used in real-world system applications where we need to work with the hardware
    at a low level. Modern programming languages have very fewer libraries for this
    sort of implementation and practically very bad programmatical structure that
    can make them nearly impossible to effectively interact with the lower-level components
    of the hardware. Whereas, `C` can interact with hardware components very effectively
    due to the syntactical structure and programmatical process flows it follows.
    This is the reason why still `C` is considered best to create new operating systems
    and compilers.


    ## Features of C language


    Even though `C` deals with low-level hardware resources it is often considered
    as a middle-level language because it integrates itself with various high-level
    programming language capabilities such as neat syntax and organizing structures.
    `C` language is also known widely because it is used as an entry-level teaching
    resource in various universities such as `Harvard`, `Stanford`, and `Princeton`,
    etc.


    At the initial stages of the development of `C` language, it has become difficult
    for programmers to develop systematic updates for the programming language due
    to a lot of companies creating different libraries and features that can be added
    to the language. Due to this reason, International standard organization (ISO)
    started to declare individual library functions for the `C` programming language.
    All the programmers are suggested to use this respective format for better results.
    You can find out the latest guidelines from the official `C` language website.


    Here are some of the essential features of the `C` language:


    1. **Portable**: `C` language is considered extremely portable and can be executed
    in any operating system. Previously, it is developed to be run on `MS-DOS` systems.
    But with the explosion of `windows`, `Mac` and `Linux` operating systems `C` has
    expanded its ability to support different operating systems. A lot of third-party
    software developers also have developed tens of compilers to run `C` language
    programs effectively.

    2. **Light**: `C` language is often considered lighter than the other high-level
    programming languages that have occupied the mainstream industry today. Even `C++`,
    the successor of `C` language implements more lines of code than the `C`. The
    reason for the lightweight features of `C` is due to its effective syntax principles.
    A lot of modern programming languages such as `Java`, `Scala` are forced to use
    complex boiler code syntax to run applications on various platforms. `C`, on the
    other hand, uses simple and strict syntax that makes the language a light-weight
    programming entity.

    3. **Functional programming**: The most important difference between `C` and other
    high-level languages is that it supports functional programming. It uses procedures
    to complete a task in a repetitive mode. Other high-level languages use the object-oriented
    paradigm to implement different features in the software. Functional programming
    is often considered effective to develop system-level applications. However, with
    the latest updates, we can also implement the object-oriented paradigm in `C`
    language. After thorough checks we have done we are not completely satisfied with
    the object-oriented programming features that `C` language offers. We recommend
    you to learn `Python` or `Java` if you are keen to develop applications in the
    object-oriented paradigm. If you are comfortable with a simple, effective paradigm
    then we suggest you try procedural programming that `C` provides.

    4. **Extensible**: One of the important features of the `C` language is that it
    can be expanded accordingly to utilize our purposes. A lot of space communication
    facilities such as `NASA` use this functionality to develop their libraries that
    can be used to interact with their hardware machines and rockets. This advantage
    of adding our own functions to the default library is very useful when you are
    developing your operating systems that are similar to `Windows` or `Mac`.

    5. **Usage of pointers**: A `pointer` is an advanced feature that is available
    in `C` language to point out the hardware value of a variable. `Pointers` can
    be used to point to a memory location and can be used in the logical implementation
    of complex features in the program. Very few programming languages use pointers
    to represent storage location values. Even though having its disadvantages pointers
    are still a valuable source of resource to implement complex features in the software
    systems.

    6. **Huge library of functions**: `C` provides a large library of system functions.
    All these functions serve a purpose and can be used for developing high-level
    system applications. We will be discussing different time functions and string
    manipulation functions in detail in the later chapters of this book.


    Apart from these features, `C` language is also an open-source resource and is
    free to use. With this, we have completed a brief and thorough introduction to
    the `C` language. This chapter acts as an introduction to `C` language by experts''
    words. In the next chapter, which is a continuation of the concepts explained
    here we will discuss various advantages and applications of `C` language in detail.
    Let us go!


    # Chapter 2: Why C language is important?


    ![Codice Binario, Digitale, Sistema Binario, Binario](image_rsrc3Z0.jpg)


    The previous chapter is an ode to the importance and history of the `C` programming
    language in a comprehensive manner. This chapter further expands the concepts
    that the previous chapter has introduced. We will in detail discuss different
    `C` versions that are available along with the applications and advantages of
    `C` programing language in detail. This is a theoretical chapter that helps to
    place some pretty basic ideas in your mind which can help you when you are dealing
    with complex programming problems. Follow along to know more about it!


    ## Why is the C programming language important?


    There are a lot of programming languages nowadays and all of them serve a significant
    purpose. This section of the chapter explains some of the reasonable arguments
    that prove that `C` language is better than those high-level modern programming
    languages. However, it is the programmer''s own choice to choose the language
    that he is most comfortable with. We are not denying that fact. We are just giving
    pretty basic arguments that prove that `C` language is the best for certain applications
    and mediums.


    a) **They are fast**: The important advantage of `C` is it can deal directly with
    hardware resources. This advantage over other high-level languages makes `C` a
    fast processing language. A lot of other programming languages offer abundant
    extra features but they cannot beat the faster processing time that `C` offers.

    b) **It is portable**: Portability is one of the main reasons for the initial
    success of `C`. Back in those days, assembly languages have made portability a
    distant difficulty and often forced programmers to create multiple versions of
    code to deploy on different devices. However, `C` started to offer advanced portability
    customizations that can help us run the program code on any platform with the
    help of a supportive compiler. You need not worry about your software not running
    on different operating systems anyone by using `C` as your primary development
    language.

    c) **Modularity**: `C` language offers you to store the snippets of your code
    in the form of modular entities. These are like user made functions that can be
    imported whenever they are needed. These are more related to packages in `Java`
    programming language. Modularity''s are extensible and can solve a lot of problems
    that programmers are facing.

    d) **A statically typed language**: There is a lot of argument in programming
    circles between static and dynamic typed languages related to which is effective.
    The difference between dynamic and statically typed languages is that during compile
    time, statically typed languages show errors in a much faster significance. `C`
    is a statically typed language and performs at a faster rate due to this feature.
    However, we don''t deny the fact that dynamically typed languages provide much
    better security features during the compilation process.

    e) **A learning resource**: `C` language apart from holding a lot of advantages
    can help you understand programming in depth. A lot of modern programming languages
    are dynamic and will not provide you a way to learn and adapt the programming
    philosophy that paved a path for a technological revolution. However, `C`, on
    the other hand, provides a lot of information to help you understand the working
    process. `C` is often used as a primary development language in various universities.

    f) **Important to understand other languages**: `C` helps you understand different
    programming languages such as `Python`, `C++`, and `#`.


