    ## Chapter 8: Java Data Structure and Algorithms

    ![Steinzeitcomputer, Calcolatore, Monumento, Betonrechner](image_rsrc3YR.jpg)


    In order to make this clearer, say that there is a class `Human`. This `class`
    will have attributes such as height, weight, gender, race. The `human` class can
    also have methods such as `run`, `walk`, `talk`.


    These theoretical components make up the `human` class, a blueprint for an object.
    Now that the class has been defined, the programmer, if they so wish, can create
    an object using the `human` class as a blueprint. They can invoke the class `Human`
    and `populate` its attributes, giving it a specific height, weight, gender, and
    race.


    In addition, the object already has built – in functions such as `run`, `walk`,
    and `talk`, so upon the creation of an object, let’s say named `Mike` from the
    `Human` class, it already contains the functions to run, walk, and talk, without
    need for the programmer to code those specific functions again, as they are already
    “inherent” in the created object.


    In a nutshell, that is what Object - oriented programming is meant to be: a way
    of programming that allows the programmer to draw on pre – defined classes so
    that it will be easier to describe them and use their internal, or built – in
    functions in order to operate them.


    Assuming that the reader is not a total newbie to programming, and has been introduced
    to the world of programming using C or another procedural – heavy language, the
    next logical question would be: why even use object – oriented programming?


    Well, one of its main advantages is that in the long run, it saves time. Procedural
    programming is usually much quicker and more straightforward in simpler algorithms
    and programs; rather than having to construct and define a class, and create an
    object based on that class, all the programmer really has to do is to simply declare
    the necessary variables and write the functions, and create the algorithm in order
    to solve the problem that they need the code to address.


    However, when it comes to more complex programs, needing more complex solutions,
    this is where object – oriented programming begins to shine, and this is where
    it starts to show its strength. In a lot of programs, there will be times that
    there will be a number of “objects” or data clusters that have to be grouped together,
    and that the programmer will be treating in a certain way.


    This is what “classes” are meant to address. Instead of declaring a new set of
    variables per data cluster, they can simply draw on a pre – made “class” and create
    a new “object”. Let’s see how this would work in practice. If a programmer were
    to code a chess game in procedural fashion, then they would have to manually describe
    each piece, all sixteen pawns, four knights, four rooks, two queens, and two kings.
    In addition, they will have to write the functions that allow each piece to move
    in its own way.


    However, if the programmer makes use of object - oriented programming, instead
    of having to code sixteen pawns, four knights, four rooks, two queens, two kings,
    they simply have to code six classes: one class to describe each piece. The programmer
    can now simply include the movement functions within each class, and have the
    attributes describe their position: whether they’re white’s pawn, or black’s pawn,
    these are all things that can be inserted through the “attributes” portion of
    the “pawn” class. Instead of thirty clusters of code, the programmer only has
    to do six. Now it’s much easier, much shorter, and also more elegant.


    ## Chapter 9: Arrays

    ![Pensione, Università, Ricerca, Insegnamento](image_rsrc3YS.jpg)


    Arrays are sequences of elements; each element must be associated with one or
    more positions. Elements are groups of memory locations, each storing one item
    of data. Indexes are integers that are non-negative; in the case of the array,
    they are used for identifying the element. You can consider the relationship between
    the two to be similar to how a post identifies a specific house on a specific
    street. Usually, one element will have one index but there may sometimes be more.
    The number of those indexes per element is the dimension of the array.


    We are going to start by looking at one-dimensional arrays; later we will move
    to multi-dimensional arrays. Java has full support for arrays. Each of the elements
    in an array will occupy the same byte amount and the exact amount will depend
    on the data type of the element. It is also worth noting at this stage that every
    element in one array will be of the same data type. It is also important to note
    that you cannot resize a Java array; they are of a fixed size and may not be changed
    once they have been created. Rather than doing this, if you needed an array to
    be a different size, you would need to create a new one of the correct size and
    then copy all the elements you need from the first array.


    ### One-Dimensional Arrays

    One-dimensional arrays are the simplest of all arrays. In this kind of array,
    one element is associated with one index and the array is used for storing data
    items in lists. We can use three separate techniques for creating a one-dimensional
    array:

    * With just an initializer

    * With just the new keyword

    * With both an initializer and the new keyword


    #### Just an Initializer

    The syntax required to use an initializer to create a one-dimensional array is
    `{expr,}`. What this syntax says is that a one-dimensional array is a list of
    expressions that is optional and with each expression separated by a comma, all
    between a set of curly braces. All of the expressions have got to evaluate to
    types that are compatible. For example, if you had a one-dimensional array of
    doubles with two elements, both of those elements may be of the double type or
    just one may be of the double type while the other may be an integer or a floating
    point number. Have a look at this example: `{''J'', ''a'', ''v'', ''a''}`


    #### Using the New Keyword

    The new keyword is used to allocate the array memory and return the array references.
    The syntax is: `new type[int_expr]`. What the syntax tells us is that the one-dimensional
    array is a series of elements, all of type. All the elements in the array will
    be zeroed and will be interpreted as one of the following:

    * `0`

    * `0L`

    * `0.0F`

    * `0.0`

    * `false`

    * `null`

    * `\u0000`

    For example: `new char[4]`


    #### Using an Initializer and the New Keyword

    The syntax required to create the array using both the initializer and the new
    keyword is this, a combination of the two separate syntax approaches mentioned
    above: `new type[] {expr,}`. Because we can work out how many elements are in
    the one-dimensional array by looking at the list of comma-separated expressions,
    we do not need and, indeed, must nor use, an `int_expr` within the set of square
    brackets. For example: `new char[] {''J'', ''a'', ''v'', ''a''}`


    It is worth noting that there is no difference between the syntax for using just
    the initializer and the syntax for using the initializer and the new keyword.
    The first one, with just the initializer, is something called syntactic sugar
    – this just means the syntax is much easier to use.


    ### Array Variables

    On its own, a new one-dimensional array is quite useless. For it to be worth anything,
    we must first assign its reference to an array variable that has a compatible
    type and we can do this in two ways – directly or by using a method call. The
    following example shows how the variable is declared:

    ```

    type var_name[] = type[];

    ```

    Both types of syntax are declaring the variable that will store the reference
    to one-dimensional array. You can use whichever type you prefer but the preferred
    method is the first one, with the set of square brackets after the variable. In
    these examples, there are array variables – `name1`, `name2`, and `name3`. The
    set of square brackets is telling Java that each of those variables will store
    the reference to one-dimensional array. The keyword, `char`, is an indication
    that the elements must store values of type but, provided Java can do a conversion
    to a char, you may specify values that are non-negative. For example, the following
    is perfectly ok because 10, a positive int, is small enough that it fits in the
    range for char (0 to 65535) and can easily be converted to char:

    ```

    char[] chars = {''A'', 10};

    ```

    However, the next example would not be ok because it’t fit in the range:

    ```

    char[] chars = {''A'', 80000};

    ```

    All array variables have a length property associated with them. For example,
    `name1.lenght` would return a value of 4. With the array variable specified, it
    is possible to access any of the elements in the array and we do this by stating
    the expression that will agree with this syntax:

    ```

    array_var[index]

    ```

    In this expression, we have a positive int of index; it ranges from 0 to lower
    than the length property value. Don’t forget, Java indexes start at zero. Have
    a look at a couple of examples:

    ```

    char ch = names[0]; // Get value

    names[1] = ''A''; // Set value

    ```

    If a negative index is specified, or one that >= (greater than equal to) the value
    that the length property returns, Java will create an exception object and throw
    it. That exception object is:

    ```

    java.lang.ArrayIndexOutOfBoundsException

    ```


