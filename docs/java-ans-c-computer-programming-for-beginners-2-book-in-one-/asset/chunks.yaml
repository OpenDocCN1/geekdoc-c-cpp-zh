    operator.Assignment OperatorsThese are operators that are used to make assignment
    operations easier. The assignment operators possible in JavaScript are given below.Now
    let’s look at how we can implement these operators in further detail.With this
    program, the output is as follows:JavaScript ProgramThe first value is 5The second
    value is 6The value of i+j is 11The value of i+=j is 11The value of i-=j is 5The
    value of i*=j is 30The value of i/=j is 5The value of i%=j is 5Bitwise OperatorsThese
    are operators that are used to make bit operations on operands.With this program,
    the output is as follows:JavaScript ProgramThe first value is 5The second value
    is 6The value of x AND y is 4The value of x OR y is 7The value of NOT x is -6The
    value of x XOR y is 3The value Zero fill left shift is 10The value Signed right
    shift is 2The value Zero fill right shift is 2Chapter 8: Java Data Structure and
    Algorithms![Steinzeitcomputer, Calcolatore, Monumento, Betonrechner](image_rsrc3YR.jpg)In
    order to make this clearer, say that there is a class “Human”. This “class” will
    have attributes such as height, weight, gender, race. The “human” class can also
    have methods such as “run”, “walk”, “talk”.These theoretical components make up
    the “human” class, a blueprint for an object. Now that the class has been defined,
    the programmer, if they so wish, can create an object using the “human” class
    as a blueprint.They can invoke the class “Human” and “populate” its attributes,
    giving it a specific height, weight, gender, and race.In addition, the object
    already has built – in functions such as “run”, “walk”, and “talk”, so upon the
    creation of an object, let’s say named “Mike” from the “Human” class, it already
    contains the functions to run, walk, and talk, without need for the programmer
    to code those specific functions again, as they are already “inherent” in the
    created object. In a nutshell, that is what Object - oriented programming is meant
    to be: a way of programming that allows the programmer to draw on pre – defined
    classes so that it will be easier to describe them and use their internal, or
    built – in functions in order to operate them.Assuming that the reader is not
    a total newbie to programming, and has been introduced to the world of programming
    using C or another procedural – heavy language, the next logical question would
    be: why even use object – oriented programming?Well, one of its main advantages
    is that in the long run, it saves time.Procedural programming is usually much
    quicker and more straightforward in simpler algorithms and programs; rather than
    having to construct and define a class, and create an object based on that class,
    all the programmer really has to do is to simply declare the necessary variables
    and write the functions, and create the algorithm in order to solve the problem
    that they need the code to address.However, when it comes to more complex programs,
    needing more complex solutions, this is where object – oriented programming begins
    to shine, and this is where it starts to show its strength.In a lot of programs,
    there will be times that there will be a number of “objects” or data clusters
    that have to be grouped together, and that the programmer will be treating in
    a certain way.This is what “classes” are meant to address. Instead of declaring
    a new set of variables per data cluster, they can simply draw on a pre – made
    “class” and create a new “object”. Let’s see how this would work in practice.If
    a programmer were to code a chess game in procedural fashion, then they would
    have to manually describe each and every piece, all sixteen pawns, four bishops
    and four knights, four rooks, two queens, and two kings.In addition, they will
    have to write the functions that allow each piece to move in its own separate
    way.However, if the programmer makes use of object - oriented programming, instead
    of having to code sixteen pawns, four bishops, four knights, four rooks, two queens,
    two kings, they simply have to code six classes: one class to describe each piece
    on the board.The programmer can now simply include the movement functions within
    each class, and have the attributes describe their position: whether they’re white
    king’s pawn, or black queen’s pawn, these are all things that can be inserted
    through the “attributes” portion of the “pawn” class. Instead of thirty – two
    clusters of code, the programmer only has to do six.Now it’s much easier, much
    shorter, and also much more elegant.Chapter 9: Arrays in Java![Pensione, Scuola,
    Università, Ricerca, Insegnamento](image_rsrc3YS.jpg)Arrays are sequences of elements;
    each element must be associated with one or more index positions.Elements are
    groups of memory locations, each one storing one item of data. Indexes are integers
    that are non-negative; in the case of the array, they are used for identifying
    the element associated with the index.You can consider the relationship between
    the two to be similar to how a postbox number identifies a specific house on a
    specific street.Usually, one element will have one index but there may sometimes
    be more.The number of those indexes per element is the dimension of the array.We
    are going to start by looking at one-dimensional arrays; later, we will move on
    to the multi-dimensional arrays. Java has full support for arrays. Each of the
    elements in an array will occupy the same byte amount and the exact amount will
    depend on the data type of the element.It is also worth noting at this stage that
    every element in one array will be of the same data type.It is also important
    to note that you cannot resize a Java array; they are of a fixed size and may
    not be changed once they have been created.Rather than doing this, if you needed
    an array to be a different size, you would need to create a new one of the correct
    size and then copy all the elements you need from the first array to the new one. One-Dimensional
    ArraysOne-dimensional arrays are the simplest of all arrays.In this kind of array,
    one element is associated with one index and the array is used for storing data
    items in lists.We can use three separate techniques for creating a one-dimensional
    array:●         With just an initializer●         With just the new keyword●        
    With both an initializer and the new keywordUsing Just an InitializerThe syntax
    required to use an initializer to create a one-dimensional array is:''{'' [expr
    ('','' expr)*] ''}''What this syntax says is that a one-dimensional array is a
    list of expressions that is optional and with each expression separated by a comma,
    all between a set of curly braces.All of the expressions have got to evaluate
    to types that are compatible.For example, if you had a one-dimensional array of
    doubles with two elements, both of those elements may be of the double type or
    just one may be of the double type while the other may be an integer or a floating
    point number.Have a look at this example:{ ''J'', ''a'', ''v'', ''a'' }Using the
    New KeywordThe new keyword is used to allocate the array memory and return the
    array references. The syntax is:''new'' type ''['' int_expr '']''What the syntax
    tells us is that the one-dimensional array is a series of positive elements, all
    of int (integer) type.All the elements in the array will be zeroed and will be
    interpreted as one of the following:●        0●        0L●        0.0F●        0.0●
           false●        null●         ‘\u0000’For example:new char[4]Using an Initializer
    and the New KeywordThe syntax required to create the array using both the initializer
    and the new keyword is this, a combination of the two separate syntax approaches
    mentioned above:''new'' type ''['' '']'' ''{'' [expr ('','' expr)*] ''}''Because
    we can work out how many elements are in the one-dimensional array by looking
    at the list of comma-separated expressions, we do not need and, indeed, must nor
    use, an int_expr within the set of square brackets. For example:new char[] { ''J'',
    ''a'', ''v'', ''a'' }It is worth noting that there is no difference between the
    syntax for using just the initializer and the syntax for using the initializer
    and the new keyword.The first one, with just the initializer, is something called
    syntactic sugar – this just means the syntax is much easier to use.Array VariablesOn
    its own, a new one-dimensional array is quite useless. For it to be worth anything,
    we must first assign its reference to an array variable that has a compatible
    type and we can do this in two ways – directly or by using a method call.The following
    example shows how the variable is declared:type var_name ''['' '']''type ''[''
    '']'' var_nameBoth types of syntax are declaring the variable that will store
    the reference to the one-dimensional array. You can use whichever type you prefer
    but the preferred method is the first one, with the set of square brackets after
    the variable type.In these examples, there are three array variables – name1,
    name2, and name3\. The set of square brackets is telling Java that each of those
    variables will store the reference to a one-dimensional array. The keyword, char,
    is an indication that the elements must store values of the char type but, provided
    Java can do a conversion to a char, you may specify values that are non-char.
    For example, the following is perfectly ok because 10, a positive int, is small
    enough that it fits in the range for char (o to 65535) and can easily be converted
    to a char:char[] chars = { ''A'', 10 };However, the next example would not be
    ok because it doesn’t fit in the range:char[] chars = { ''A'', 80000 };All array
    variables have a length property associated with them. This property will return
    the one-dimensional array length, indicated as a positive int.For example, name1.lenght
    would return a value of 4.With the array variable specified, it is possible to
    access any one of the elements in the array and we do this by stating the expression
    that will agree with this syntax:array_var ''['' index '']''In this expression,
    we have a positive int of index; it ranges from 0 to one lower than the length
    property value. Don’t forget, Java indexes start at zero.Have a look at a couple
    of examples:char ch = names[0]; // Get value.names[1] = ''A'';     // Set value.If
    a negative index is specified, or one that is >= (greater than or equal to) the
    value that the length property returns, Java will create an exception object and
    throw it. That exception object is:java.lang.ArrayIndexOutOfBoundsExceptionChapter
    10: Strings in JavaA string is nothing more than a sequence of characters that
    is terminated by the null character, to denote that the string has indeed been
    terminated.In Java a string is denoted by the string data type.Let’s revisit how
    to define a string in Java via an example.With the above program:We are first
    defining a variable ‘str’ to be of the ‘string’ type.Then we assign a string of
    “Hello World” to the ‘str’ variable.Finally we output the value to the console
    accordingly.With this program, the output is as follows:The value of the string
    is Hello WorldThere are a variety of functions available in Java to work with
    strings. Let’s look at them in more detail.  4.1 Length FunctionThis function
    is used to return the length of the string. Let’s look at an example of this function.With
    the above program:We are using the ‘length’ method to get the length of the string.With
    this program, the output is as follows:The length of the string is 114.2 toLowerCase
    FunctionThis function returns the string in lower case. Let’s now look at a simple
    example of this.With this program, the output is as follows:The lower case of
    the string is hello world4.3 toUpperCase FunctionThis function returns the string
    in upper case. Let’s quickly look at an example of this.With this program, the
    output is as follows:The lower case of the string is HELLO WORLD4.4 Contains FunctionThis
    function is used to check the existence of another string, and returns True or
    False. Below is an example of this function.With this program, the output is as
    follows:Does the string contain Hello - True4.5 endsWith FunctionThis function
    can be used to check whether a string ends with a particular string value. Let’s
    now look at a simple example of this function.With this program, the output is
    as follows:Does the string end with World - true4.6 indexOf FunctionThis function
    is used to get the index of a character in a string. Let’s have a look at an example
    of this.With this program, the output is as follows:The index value of e is 14.7
    Replace FunctionThis function is used to replace a character in the original string.
    Below we’ll look at an example of this function.With this program, the output
    is as follows:The value of the string is Hello Again4.8 Substring FunctionThis
    function is used to return a substring from the original string. Let’s look at
    a quick example of this function.With this program, the output is as follows:The
    value of the string is HelloIf the value is less than zero it means that the destination
    string precedes the value.If the value is greater than zero it means that the
    destination string follows the value.If the value is equal to zero then this instance
    has the same position in the sort order as the value.Let’s now look at an example
    of this function.With this program, the output is as follows:The output of the
    compareTo function is 0Chapter 11: Java Web DevelopmentWhat are Java Web Applications?Java
    web applications are, quite simply, web apps built using Java. But, much more
    than that, they are applications that generate web pages that are fully interactive,
    each containing different markup language types, such XML, HTML, and so on, along
    with dynamic content.Typically, a Java web application will be made up of web
    components that modify data temporarily store the data, interact with web services
    and with databases and will render content as requested by the application users.Some
    of the components are JSP – JavaServer Pages, JavaBeans and servlets.Many of the
    tasks that are required for the development of web applications can be somewhat
    repetitive or they may require huge amounts of boilerplate code.We can use web
    frameworks to take away some of the overhead that goes with the common development
    activities, for example, many of the frameworks include useful libraries that
    help you with page templating, session management and they often promote the reuse
    of code.What is Java EE?Java Enterprise Edition (Java EE) is one of the most commonly
    used platforms and it contains a range of coordinated technologies that take some
    of the complexity and cost out of the development of server-centric, multi-tier
    applications, making it much easier to deploy them and manage them.Java EE builds
    on Java SE and gives us a full set of development APIs that help us run server-side
    applications that are fully secure, portable scalable, robust, and reliable.Some
    of the basic components include:●        EJB (Enterprise JavaBeans) – fully managed
    server-side architecture for enclosing application business logic. With EJB technology,
    we can rapidly develop Java-based applications that are distributed, secure, transactional
    and portable in a simplified way●        JPA (Java Persistence API) – a framework
    that provides ORM (Object-Relational Mapping) for data management capabilities
    within applications built using Java technology.Ajax Development with JavaScriptJavaScript
    is used mainly in the client-side user interfaces in web applications and is an
    object-oriented language.Ajax, with stands for Asynchronous JavaScript and XML,
    is a technique that provides the ability for web pages to change without having
    to refresh the page each time.JavaScript toolkits can easily be used to implement
    components enabled by Ajax, along with their functionality, right into a web page.The
    Practicalities of Developing Web ApplicationsNow it’s time to get practical because
    that’s the only real way to learn how to build a web application in Java. We’re
    going to look at the basics of using the NetBeans IDE, how to produce a very simple
    web application, how to deploy it and how to see it in a web browser.This application
    will use a JSP page for name input and a JavaBeans component to ensure the name
    persists throughout the HTTP session, retrieving that name so it can be output
    on the next JSP page.The first place to start is in setting up your environment
    so you can follow along. The software and resources you will need are:●        
    The NetBeans IDE – v 7.2 onwards, Java EE●         Java Development Kit – v 7
    onwards●         Glassfish Server Open Source Edition v 4 onwards OR●        
    Tomcat Servlet container v 7 onwards OR●         Oracle Web Logic Server – v 10
    onwardsIf you opt for the Java EE version, you can easily install both the Glassfish
    and Apache Tomcat servlet containers.Set Up Your ProjectOnce you have downloaded
    everything from above, you can follow this tutorial. Start by opening the NetBeans
    IDEClick on File>New Project in the main menu or click CTRL+SHIFT+N if you prefer
    to use keyboard shortcuts.Now click on Categories and choose Java WebClick Projects>Web
    Application>NextGo to the text box for Project Name and call it HelloWeb. Decide
    the Project Location – it can be any directory on your system. For this tutorial
    we will be referring to the directory as $PROJECTHOME.This is an optional step
    – check the box beside Use the Dedicated Folder for Storing Libraries and decide
    where the libraries folder will go.Click on Next and a panel for the Server and
    Settings will open. Choose which Java EE version you are going to use with the
    applicationNext, choose which server you are going to use for deployment of your
    application.Note that you will only see those servers that are registered with
    the NetBeans IDE. Also note the Context Path (on server) changes to /HelloWeb/
    - this is indicative of the name you provided earlier.Click on FinishNetBeans
    IDE will now create a project folder called $PROJECTHOME/HelloWeb.If you go to
    the Files window in NetBeans or press CTRL+2, you can see the file structure for
    this project; go to the Projects window, or press CTRL+1 and you can see the logical
    structure.This project folder is where all of your metadata and source will go
    for this project. HelloWeb will open directly in NetBeans IDE while the Welcome
    page, which is index.jsp, will open in the main window in the Source Editor.Note
    – The NetBeans IDE may generate the default welcome page as index.html but this
    will depend on which server and which version of the Java EE that you chose when
    the project was created. You have two choices – follow this tutorial using the
    index.html file or go to the New File wizard and create an index.jsp file – if
    you choose the latter, make sure you delete index.html to avoid confusion.Create
    and Edit Application Source FilesThe NetBeans IDE serves many useful functions
    but one of the most important is the creation and editing of the source files
    for your web application.That, in all honesty, is what most web app developers
    spend the bulk of their time doing.With the IDE, you get a huge selection of tools
    that will suit all types of developer and the individual style that they have,
    regardless of whether you prefer the IDE to generate much of the code or whether
    you prefer to code manually.Chapter 12: Making our Program InteractiveHow to displaying
    outputThe floating type represents fractional numbers. The floating types exist
    in two types, the double and float. The double represents the double precision
    numbers while the float represents the single precision numbers.The double is
    applied frequently since functions of mathematics use double value. For instance,
    sqrt() will output a double. You can check its application in the code below.
    In this example, sqrt() has been applied to calculate the longest side of a triangle
