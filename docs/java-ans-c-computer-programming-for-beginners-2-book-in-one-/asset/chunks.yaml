  trans: "\n这条注释跨越两行.*/如果你查看上面的注释，你会注意到它以 `/*` 开头，以 `*/` 结尾。此外，如果你查看上一张图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，以一个星号和一个正斜杠（*/）结尾；这被称为\
    \ Javadoc 注释。\n\n# 第 4 章：什么是 Java 虚拟机？\n\n![Intelligenza Artificiale, Cervello,\
    \ Pensare, Controllo](img/image_rsrc3YF.jpg)\n\n虚拟机是模拟物理机器的软件。在传统的编程语言中，代码被编译为针对特定平台的机器语言。在\
    \ Java 中，代码被编译为称为 `bytecode`（字节码）的虚拟机语言。`JVM` 充当 `bytecode` 和底层物理机器之间的媒介。每个支持\
    \ Java 的平台都有自己的 `JVM` 实现。Java 应用程序是可移植的，因为每个 `JVM` 都遵循标准接口。\n\n`JVM` 和标准库的发行包被称为\
    \ Java 运行环境（`JRE`）。`JRE` 的发行包以及开发工具（如编译器和调试器）被称为 Java 开发工具包（`JDK`）。\n\n回到我们之前介绍的初始问题（即让计算\
    \ `add 1 + 1`），现在我们有一组指令（即你的算法）来解决这个问题，你你需要做的是将它翻译成计算机可以理解的指令。记住，计算机不说英语或任何其他人类语言。正如之前解释过的，你需要将所有这些指令翻译成一系列二进制信号。但完成所有的翻译工作将花费你大量的时间。记住，每个字符至少由\
    \ 8 位组成。之后，你需要将它们连接成实际指令来访问计算机内存，然后进行数学运算等——简而言之，这是一个巨大的混乱。没有人想处理那些事情。\n\n所以，你说的是一种语言，而计算机说另一种语言。那么，你如何让双方在中间会合呢？这就是\
    \ Java 这样的编程语言大显用场的地方。将编程语言想象是计算机和人类都能理解的中间语言——某种可以说，我们稍后会澄清这背后的细节。\n\n这里的目标是让计算机理解你的指令。在实现这一目标之前会发生两个阶段：\n\
    1. 第一步是使用编程语言编写你的算法。是的，你与机器之间的中间语言。嗯，尽管它已经是 Java 代码，计算机仍然无法完全理解你编写的所有内容。\n2. 那就是第\
    \ 2 步之处（记得是 2 步吗？）——你的 Java 代码将由一个名为编译编译器的程序处理。正如之前我们在介绍 Java 平台组件时解释的那样，`compiler`\
    \ 是一个将你的编程代码翻译成机器可读指令（即你的计算机可以理解的指令）的程序或应用程序。实际上后台还会发生一些事情，例如预编译步骤以及访问 Java 库（之前提到的），然后通过\
    \ `assembler`（汇编器）实际翻译成二进制代码，并在你编写原始代码中添加更多行代码。再次，这一切都在后台完成。\n\n作为一名 Java 程序员，你不必担心这些，因为\
    \ Java 平台是为了处理所有这些而开发的。了解这些是有趣的，也许当你的编程水平提高后，你就可以自己去研究底层编程细节了。现在，在我们开始编写 Java\
    \ 编程代码之前，你应该了解最后一点预备信息。那就是 Java 虚拟机。\n\n## 什么是 Java 虚拟机或 JVM？\n\n关于今天不同设备中不同类型的硬件和软件，有一个反复出现的问题。智能手机的硬件软件组件的行为与你的汽车或笔记本电脑不同。为了增加复杂性，不同处理器芯片、不同操作系统和不同电气组件数组的组合意味着编译（或翻译）你编写代码的方式也不同。你需要针对你正在编程的设备平台制作特定的机器码。\n\
    \n那么，什么是 Java 虚拟机或 `JVM`？它是一个设计在任何设备或机器上运行计算机程序的程序或应用程序。它在 1995 年发布时是一个非常有革命性的程序，直到今天仍然是一项巨大的创新。它解决了之前描述的困境。将\
    \ `JVM` 想象成你计算机内部的一种虚拟计算机。它实际上有两个主要功能：\n1. 第是在任何设备、任何操作系统或软件上运行任何程序。这总结为“编写一次，到处运行”的原则——随着经验的增加，你会听到这句话和其他编程经验。\n\
    2. 另一个功能是分配内存空间——它非常擅长管理计算机内存。\n\n`JVM` 加载在计算机内存（`RAM`）中。它是独立的，这意味着它可以运行任何支持 Java\
    \ 的设备——今天几乎每个设备都支持 Java。它不会为每种机器、芯片和软件组合生成代码。那是不可能的。即使你尝试，也会让 Java 变成一个庞大的系统，因为你必须考虑到那里每种硬件、软件和操作系统。\n\
    \n### JVM 是如何实现的？\n\n它产生自己独特的代码格式，称为 `bytecode`。请注意，与其他编程语言不同，当你的 Java 源代码被编译时，它不会被直接翻译或转换为机器可读的语言——再次，因为目标不是创建一种只能在一个计算机平台上运行的特定类型代码。\n\
    \n由 `compiler` 产生的 Java `bytecode` 是一组机器语言的指令。`Bytecode` 将运行在任何安装了 `JVM` 的计算机上。这也意味着\
    \ `JVM` 不仅运行 Java 代码和 Java 程序，它还可以运行用其他编程语言编写的程序——只需要将这些程序翻译（即编译）成 `bytecode`\
    \ 即可。此外，`bytecode` 不需要为了被不同设备理解而进行定制——只要设备拥有 `JVM`，它就可以运行 `bytecode`。这就是 Java\
    \ 能够在任何设备和任何计算机上运行的原因。\n\n# 编写你的第一段 Java 代码\n\n在你的计算机上编写和运行任何 Java 程序之前，你首先需要在你的计算机上安装它。要安装\
    \ Java 运行环境或 `JRE`（即带有 `JVM`、Java 库和所有其他文件的整个 Java 系统），你需要访问 Oracle 官方公司网站。\n\n\
    `https://www.oracle.com/technetwork/java/javase/downloads/index.html`。这些网页上还会提供如何下载\
    \ `JRE` 的说明。如果由于某种原因这些链接不起或你被带到了不同的页面，只需 Google 搜索“JRE download”，然后点击带有 `https://www.oracle.com/java/technologies/`\
    \ 的链接。注意：`JRE` 是你编写 Java 程序所需的，但你的计算机需要安装实际的 Java 系统才能运行程序。如果你需要为 Mac OS、Linux\
    \ 等其他操作系统安装 Java，你应该去那里。\n\n### 所需工具\n\n现在你只需要一个文本编辑器来编写你的第一段 Java 程序。你可以使用系统自带的任何文本编辑器（例如，如果你使用\
    \ Windows，可以使用记事本）。如果你想要支持更多的，也可以使用 Notepad++。但是，如果你想开发应用程序、测试你的编程代码，并拥有让 Java\
    \ 编程变得容易得多的工具，那么你需要一个名为 `IDE` 的程序，全称为集成开发环境。\n\n### IDE 特性\n\n`IDE` 通常带有自动补全和文本高亮等功能。它还可以用于构建文件。你的\
    \ Java 代码通常保存为 `.java` 文件。`compiler` 将处理该文件并返回一个 `.class` 文件，这是一个你可以运行以测试代码的文件。调试是\
    \ `IDE` 的另一个重要功能。`Debugging` 指的是定位和移除源代码中的错误。没有人期望你是完美的，但错误会阻止你的代码运行。`IDE` 拥有调试工具可以帮助你快速发现并编辑它们。\n\
    \n### Java 编程的最佳 IDE\n\n有很多 `IDE` 可以用于 Java 编程。我们无法列出所有，所以我们将介绍前三个：\n\n1. **NetBeans**:\
    \ 1997 年发布，可以在 Windows、Solaris、Mac OS 和 Linux 等不同操作系统运行。NetBeans 是开源的——这意味着它是免费下载和使用的。它具有语义和语法高亮功能。它还允许你重构源代码（即在不影响程序性能的情况下，将其更新到最新标准）。\n\
    2. **IntelliJ IDEA**: 2001 年 1 月发布。可以在 Windows、Mac OS 和 Linux 上运行。该 `IDE` 有两个版本。第一个是商业版（你需要付费的），另一个是\
    \ Apache 许可版。这是为严肃的程序员设计的 IDE。`IntelliJ IDEA` 的独特且强大的功能包括流分析和跨语言重构。它还支持其他基于 `JVM`\
    \ 的语言——是的，还有其他语言。\n3. **Eclipse**: 另一个高级集成环境。事实上，它是专门为 Java 程序开发设计的。它还支持其他编程语言，使其成为非常强大的工具。现在有\
    \ Eclipse 的两个版本。有一个云版本的 `IDE`，还有一个桌面版本，你可以在计算机上下载。这两个版本都带有一整套工具、应用程序和插件，让编程变得更容易。`Eclipse`\
    \ 带有它自己的编译器并改进插件。\n\n以下是你可以使用的 `IDEs` 简短列表：\n- Developer\n- Greenfoot\n- DrJava\n\
    - Codenavy\n- MyEclipse\n- BlueJ\n\n# 第 5 章：Java 程序的基本结构\n\n![Bordo, Elettronica,\
    \ Calcolatore, Ingegneria Elettrica](img/image_rsrc3.jpg)\n\n### 包 (Package)\n\
    \n在第一行，我们有语句 `package helloworld;`。这句话告诉编译器 Java 文件属于 `helloworld` 包。包是相关类和接口的组合。当我们在文件顶部编写\
    \ `package helloworld;` 时，我们要求编译器将此文件包含在 `helloworld` 包中。编译器将创建一个名为 `helloworld`\
    \ 的文件夹并将文件保存其中。属于同一个包的文件存储在同一个文件夹中。如果你导航到 `NetBeans` 文件夹，你会发现一个名为 `HelloWorld`\
    \ 的文件夹。`NetBeansProject` 文件夹通常位于 `Documents` 文件夹。如果你找不到文件夹，尝试使用计算机的搜索功能查找它。在 `HelloWorld`\
    \ 文件夹中，你会发现一个 `src` 文件夹，它包含了 `helloworld`。除了我们创建的包，Java 还带有许多预创建的包，例如，输入输出的代码在\
    \ `java.io` 包中，而实现图形界面（如按钮、菜单等）的代码在 `java.awt` 包中。我们需要导入这些预编写的包。\n\n### main 方法\n\
    \n在 `HelloWorld` 类中，我们有 `main()` 方法，它从第 5 行开始到第 8 行结束。`main()` 方法是所有 Java 应用程序的入口。每当\
    \ Java 应用程序启动时，都会调用 `main()` 方法。注意 `main()` 方法括号里的 `String[] args` 吗？这意味着 `main()`\
    \ 方法可以接受字符串数组作为输入。\n\n```java\npublic static void main(String[] args) {\n    //\
    \ 在屏幕上打印 Hello World\n}\n```\n\n第一行被称为注释，会被编译器忽略。\n\n### Java 的代码结构\n\n在图中，你应该注意到包名在前。此外，你应该注意分号是行的结束标记。分号是重要的，如果你省略了它，程序将无法编译。\n\
    \n```java\npackage project;\nclass FirstProject {\n    public static void main(String[]\
    \ args) {\n        //\n    }\n}\n```\n\n你可以在代码开始处使用左括号，使用右括号结束代码。这是一个片段示例，但你应该注意左右括号内的任何内容都是片段的一部分。此外，类左右括号内的内容实际上是一个代码段。这就是我的意思：代码的\
    \ `public` 部分意味着该方法在类外部可见。另一方面，`static` 意味着不需要创建新对象，而 `void` 意味着没有返回值并继续。\n\n\
    # 第 7 章：数据类型和变量\n\n当然，使用 Java 的关键原因之一是它对面向对象的关注。面向对象编程或 `OOP` 是一种语言模型，它允许程序代码围绕数据而不是函数和逻辑组织（后者被称为过程编程）。这些“数据簇”被组织成被称为“对象”的东西，因此得名面向对象编程。这些对象是由被称为“类”的东西创建的，这里的类是指传统意义上的对象类型，允许程序员根据两个主要标准对其进行分类：属性和方法。\n\
    \n类的属性是创建对象的原始数据：这些是它的描述符，例如它拥有的值以及组成对象的其他数据。第二个标准是对象的 `method`。这个 `method` 是行为，或类内部的逻辑序列，描述了它如何原生进行交互或被交互。为了更清楚，假设有一个\
    \ `Human` 类。这个 `class` 将具有身高、体重、性别、种族等属性。human 类还可以有 `run`、`walk`、`talk` 等方法。这些理论组件组\
    \ `human` 类，即对象的蓝图。现在类已经定义，程序员如果他们愿意，可以使用 `human` 类作为蓝图创建一个对象。他们可以调用 `Human` 类并填充它的属性，赋予它特定的身高、体重、性别和种族。此外，对象已经内置了如\
    \ `run`、`walk` 和 `talk` 等函数，因此在创建对象时（例如从 `Human` 类创建一个 `Mike`），它已经包含了跑步、行走和说话的功能，而不需要程序员再次编写那些特定函数，因为它们已经存在于所创建的对象中了。\n\
    \n简而言之，这就是面向对象编程的意义：一种编程方式，允许程序员利用预定义的类，以便更容易描述它们并使用它们的内部或内置函数来操作它们。假设读者不是编程完全新手，并且已经通过\
    \ C 或另一种过程化语言接触了编程世界，那么下一个逻辑问题将：为什么要用面向对象编程？嗯，它的主要优势之一是，长远来看，它可以节省时间。在简单的算法和程序中，过程编程通常要快且更直接；不需要构造和定义类并基于该类创建对象，程序员只需要声明必要的变量并编写函数，创建算法来解决代码需要处理的问题。然而，当涉及到复杂的程序、需要更复杂的解决方案时，这就是面向对象编程开始发光的地方，这也是它开始展现实力的地方。\n"
