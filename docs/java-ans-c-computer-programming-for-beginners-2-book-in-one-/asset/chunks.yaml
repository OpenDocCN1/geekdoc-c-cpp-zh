    \ Interview Questions\n\n### The Java Programming Language\n- What is the WORA\
    \ principle? Why is it beneficial?\n- How can Java applications run on multiple\
    \ platforms?\n- What is the difference between the `JRE` and the `JDK`?\n- What\
    \ is the difference between procedural programming and object-oriented programming?\n\
    \n### Object-Oriented Programming (Part I) \n- What is the difference between\
    \ a `class` and an `object`?\n- What happens when an `object` is instantiated\
    \ for the first time?\n- What is the difference between a primitive type and an\
    \ `object`?\n- What is the difference between autoboxing and unboxing?\n- What\
    \ is an array?\n- How is a `String` different from a regular object?\n- What is\
    \ the difference between a `StringBuilder` and the `StringBuffer`?\n- Why are\
    \ `enums`?\n\n### Object-Oriented Programming (Part II)\n- What is the difference\
    \ between a `method declaration` and a `method signature`?\n- What is a recursive\
    \ method?\n- What is the `final` keyword used for?\n- What is the `static` keyword\
    \ used for?\n- Why can’t a `static` method access nonstatic field?\n- What are\
    \ access modifiers?\n\n### The Object Superclass\n- What is the difference between\
    \ shallow copy and deep copy?\n- Why is a copy constructor preferable?\n- What\
    \ is the difference between the identity operator and `equals()` method?\n- What\
    \ is the relationship between `hashCode()` method and `equals()` method?\n- What\
    \ is the default implementation of `toString()` method?\n- Why is `finalize()`\
    \ method for cleanup?\n\n### Composition & Inheritance\n- What is the difference\
    \ between composition and inheritance?\n- What is the difference between method\
    \ overriding and method overloading?\n- How would you determine to use composition\
    \ or inheritance?\n\n### Abstract Classes & Interfaces\n- What is the difference\
    \ between an `abstract class` and `interface`?\n- How would you determine to use\
    \ an `abstract class` or `interface`?\n- Why can’t a class be both `final` and\
    \ `abstract`?\n- What is the value of designing a codebase around `interfaces`?\n\
    - What is closure?\n- What is lambda expression?\n\n### Exceptions\n- What is\
    \ an exception?\n- What is the difference between unchecked and checked exception?\n\
    - How would you determine to use unchecked or checked exception?\n- How does `try/catch/finally`\
    \ block work?\n- How does the `try-with-resources` statement work?\n\n### Generics\n\
    - What is the difference between compile-time error and runtime error?\n- What\
    \ is the purpose of `generics`?\n- What are the different types of `wildcards`?\n\
    - What is type erasure?\n- What are the limitations of `generics`?\n\n### Concurrency\n\
    - What is the lifecycle of a `Thread`?\n- Why is `synchronization` necessary on\
    \ shared resources?\n- What is used as `lock` for `synchronized` static and nonstatic\
    \ methods?\n- What would happen if two threads hit nonstatic methods on the same\
    \ object?\n- What would happen if two threads hit a `synchronized` static method\
    \ and nonstatic method on the same object?\n- What one thing does `volatile` keyword\
    \ guarantee about a variable?\n- What two things does `synchronized` keyword guarantee\
    \ about a block of code?\n- What are some built-in concurrent data structures?\n\
    - What is executor framework?\n- What is `ThreadLocal` variable?\n- What are atomic\
    \ variables?\n\n### Memory Management\n- How does the `JVM` divide memory on `heap`?\n\
    - What is the standard algorithm for garbage collection?\n- What are memory leaks?\
    \ How can they be identified?\n- What are the four types of references?\n- What\
    \ is `ReferenceQueue`?\n- Why is phantom reference safer than using `finalize()`\
    \ method?\n\n### Java Database Connectivity\n- What is `JDBC`?\n- What are the\
    \ two ways of acquiring a `Connection` object?\n- What are the three types of\
    \ `Statements`?\n- What is a `ResultSet`?\n- What is SQL injection? How can it\
    \ be prevented?\n- What are the advantages and disadvantages of object-relational\
    \ mapping?\n- What is `Hibernate`?\n\n### Web Applications\n- What is servlet\
    \ container?\n- What is a web application?\n- What is a `WAR` file?\n- What is\
