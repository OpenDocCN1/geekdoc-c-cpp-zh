    像 `+`、`-`、`*` 和 `/` 等运算符的功能与其他语言中的其他运算符完全相同。我们已经看到 JavaScript 具有处理数字的能力。因此，它也能够处理与数字数据类型配合使用的运算符。让我们详细地查看每一个运算符。


    ## 算术运算符

