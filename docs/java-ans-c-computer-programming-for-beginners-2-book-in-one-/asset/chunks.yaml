    " This is the correct statement")}elseprintf(" This is the wrong statement")}Output:This
    is the correct statementc) NOT operatorNOT operator is used to display when a
    statement is false. If not the other statement will be executed.#include<math.h>//This
    is used to import mathematical functionsmain(){int first=3;if( first == 3 NOT
    b == 5)printf(" This is the wrong statement")}Output:This is the wrong statementConditional
    and Loop operationsa) ConditionalConditional statements are used in the C programming
