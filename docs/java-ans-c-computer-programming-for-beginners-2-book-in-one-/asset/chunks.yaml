    / variable2;// This is where we use a ''/'' operato rprintf(" This is the number
    %n",variable3)}Output:This is the number 2Operator precedenceIt is also important
    to remember that the C programming language favors few operators above other operators.
    This is to resolve any conflicts or ambiguities in a mathematical expression.
    Usually, * and / are the highest priority operators followed by + and -.It is
    important to remember the concept of operator precedence while dealing with a
