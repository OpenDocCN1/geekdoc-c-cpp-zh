    # Comparison and Logical Operators


    *   `>` - Greater Than

    *   `<` - Less Than

    * `>=` - Greater Than or Equal To

    * `<=` - Less Than or Equal To


    Here''s four more you can use:


    *   `&&` - AND

    *   `||` - OR

    *   `==` - HAS A VALUE OF

    *   `!` - NOT


    The first one, a pair of ampersand symbols, is used for testing two or more conditions
    at once. We are checking to see if a user is older than the age of 18 but younger
    than the age of 40 – remember, we are checking what is in the variable called
    `user`. The first condition, “greater than 18”; the second condition, “less than
    40”. Between those two conditions, we have the `AND` operator so the entire line
    is saying else if `user` is greater than 18 AND `user` is less than 40. Now run
    the program and test it again; before it runs you should already be able to guess
    what is going to print. The `user` variable has a value of 21 so the message that
    is between the else if curly brackets will show in the output window.


    ## Nested IF Statements

    Look at where the curly brackets are – get one set in the wrong place or miss
    one out and the code will not run. Nested IF statements might be a little tricky
    but, really, all you are doing is narrowing the choices down.


    ## Boolean Values

    Instead of using `int`, `double` or `string`, you would simply type in `boolean`
    (lower case b) and, after the variable name, you assign a `TRUE` or `FALSE` value.
    Notice that we use a single equal sign as the assignment operator. If you wanted
    to see if a variable “has a value of”, you would need to use a pair of equals
    signs.


    This time, we have used the `NOT` operator in front of the variable called `user`.
    The `NOT` operator is indicated by the use of an exclamation mark, just one, and
    it will be placed in front of the variable that you are trying to test. This operator
    tests for negation, which means that it is testing for the opposite of the actual
    value.


    ## Switch Statements

    Another way of controlling flow is to use a `switch` statement. This provides
    you with the option of testing for a range of values for the variables and can
    be used in place of complicated, long IF … ELSE statements. Start with the word
    “switch” and then a set of parentheses. The variable you are checking is placed
    between the `switch` parentheses and is followed by a set of curly brackets. The
    rest of the `switch` statement goes in between the curly brackets.


    # Chapter 14: Java GUI Programming

    Assuming that the reader is not a total newbie to programming, and has been introduced
    to the world of programming using C or another procedural – heavy language, the
    next logical question would be: why even use object – oriented programming? Well,
    one of its main advantages is that in the long run, it saves time.


    ## How to build a small game with Java

    Procedural programming is usually much quicker and more straightforward in simpler
    algorithms and programs; rather than having to construct and define a `class`,
    and create an `object` based on that class, all the programmer really has to do
    is to simply declare the necessary variables and write the `functions`, and create
    the algorithm in order to solve the problem that they need the code to address.


    However, when it comes to more complex programs, needing more complex solutions,
    this is where object – oriented programming begins to shine, and this is where
    it starts to show its strength. In a lot of programs, there will be times that
    there will be a number of “objects” or data clusters that have to be grouped together,
    and that the programmer will be treating in a certain way. This is what “classes”
    are meant to address. Instead of declaring a new set of variables per data cluster,
    they can simply draw on a pre – made “class” and create a new “object”. Let’s
    see how this would work in practice.


    Each piece also has different methods of moving, depending on what piece they
    are. If a programmer were to code a chess game in procedural fashion, then they
    would have to manually describe each and every piece, all sixteen pawns, four
    bishops and four knights, four rooks, two queens, and two kings. In addition,
    they will have to write the `functions` that allow each piece to move in its own
    separate way.


    However, if the programmer makes use of object - oriented programming, instead
    of having to code sixteen pawns, four bishops, four knights, four rooks, two queens,
    two kings, they simply have to code six `classes`: one class to describe each
    piece on the board. The programmer can now simply include the movement `functions`
    within each class, and have the attributes describe their position: whether they’re
    white king’s pawn, or black queen’s pawn, these are all things that can be inserted
    through the “attributes” portion of the “pawn” class. Instead of thirty – two
    clusters of code, the programmer only has to do six. Now it’s much easier, much
    shorter, and also much more elegant.


