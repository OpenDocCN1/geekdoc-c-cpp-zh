    in C programming](#part0049.xhtml_a3UT)INTRODUCTIONThe history of Java dates back
    to 1991 when programmers Patrick Haughton, Mike Sheridan, and James Gosling thought
    of a programming language that could best be used for the development of Digital
    TV. However, it was deemed to be way ahead of its own time, and thus, they redeveloped
    it based on the C+ and C++ platforms to make it easier and more economical to
    use.With the redevelopment also came the core principles of Java, which are:It
    has to be portable—or that it should work on as many platforms as possible, without
    any of them not working as well as the other;It should be safe and secure to use—and
    definitely well encrypted;People should feel connected to it in as little time
    as possible, which means that they should be working with words that are somehow
    familiar to them, and even though it looks complex at first, sooner or later,
    they have to realize that it actually works;It should be dynamic, should work
    in threads, and could be modified when needed, and;It should perform with precision.As
    you can see, these core principles give you the feeling that the programmers real
    made Java for the people—so they can enjoy using more programs without having
    to buy too many devices.In 1995, Sun Microsystems finally released Java 1.0—the
    first public inception of Java, which had amazing security, no-cost runtimes,
    and file access restrictions across all networks. Over the years, 7 more Java
    releases had been made, and ever since 2006, Java started to be available through
    GNU, or General Public License—meaning it is now a free, open-source programming
    language. This stemmed from the public outcry that happened once when some of
    its contents were made private and only available for a fee, which definitely
    does not resonate with its core principles.Start reading this book now and you''ll
    learn more about Java in no time!Chapter 1: What is Java?![Particelle, Colore,
    Monitor, Wave, Astratto, Ricciolo](image_rsrc3YC.jpg)Java is a programming language
    that is built by Sun Microsystems, which was later taken over by the Oracle Corporation.
    It is designed to run on any operating system that supports Java. This is what
    made the language so popular, because the developer just had to write the program
    once, and the program could then run on any operating system without the need
    for the programmer to change the code.Most of the modern applications built around
    the world are made from the Java programming language. Most of the server side
    and business logic components of major applications are built on the Java programming
    language.During the entire course of this book you will learn how to write programs
    such as the one above, and also learn advanced concepts that will enable you to
    start writing complete application programs.Some of the design goals for Java
    are mentioned below:-           The language is intended to be written once and
    have the ability to be run on any operating system.-           The language should
    provide support for numerous software engineering principles.-           The language
    is intended to be used in developing software components suitable for deployment
    in distributed environments.Portability is an important factor. This is why Java
    has the ability to run on Windows, Linux and the MacOS operating system.Support
    for internationalization is very important.Java is intended to be suitable for
    writing applications for both hosted and embedded systems.Other design goals are
    discussed next:1.1 Strong Type CheckingJava is a strong type language. Every variable
    that is defined needs to be attached to a data type.You don’t need to understand
    the complete program for now, but let’s just have a quick look at 2 lines of the
    code.1)     int i=5;Here we are defining something known as a variable, which
    is used to hold a value. The value that can be stored depends on the data type.
    In this example we are saying that ‘i’ is of the type ‘int’ or Integer, which
    is a number data value.Array Bounds CheckingAt runtime, Java will check whether
    the array has the required number of values defined. If one tries to access a
    value which is outside the bounds of the array, an exception will be thrown.You
    don’t need to understand the complete program for now, but let’s just have a quick
    look at the following lines of the code.1)     int[] array1 = new int[2];Here
    we are declaring an array, which is a set of integer values. The value of ‘2’
    means that we can only store two values in the array.2) array1[0] = 1;array1[1]
    = 2;array1[2] = 3;With this code we can see that we are assigning 3 values to
    the array. When you run this program, you will get an error because the program
    will see that the array has gone out of its maximum allowable bounds of two. You
    will get the below error at runtime.Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException:
    2at HelloWorld.main(HelloWorld.java:8)Chapter 2: Why Java is important?![Monitor,
    Binario, Sistema Binario, Calcolatore](image_rsrc3YD.jpg)Next, Java has syntax
    and features that resemble other programming languages like C and C++. If you
    have any prior programming experience, you will find learning Java a breeze. Even
    if you are totally new to programming, you can rest assured that Java is designed
    to be a relatively easy language to learn. Most programmers find it easier to
    learn Java than say, C or C++.Java is also designed to be platform independent.
    As mentioned earlier, Java code is compiled into bytecode first, which can be
    run on any machine that has the Java Virtual Machine.Hence with Java, you can
    write the code once and run it anywhere you want.Next, Java is an object-oriented
    programming (OOP) language. Object-oriented programming is an approach to programming
    that breaks a programming problem into objects that interact with each other.We’ll
    be looking at various object-oriented programming concepts in this book. Once
    you master Java, you will be familiar with these concepts. This will make it easier
    for you to master other object-oriented programming languages in future.Basic
    TipsHow has java become so successful? Java is such a widespread language for
    many reasons, and it owes a lot around the key principles it was designed around.
    One of the first principles of Java is its ease of use.The fundamentals of the
    Java programming language were adapted from C ++, another extremely popular higher
    – level programming language.However, though C ++ and its predecessors, C and
    C # are powerful languages, it tends to be rather complex in terms of syntax,
    and is not fully adapted for some of the purposes of Java, notably for internet
    technology integration.Java thus was able to base itself on C ++, and build on
    this powerful language’s fundamentals in order to provide a language that is also
    similarly powerful, but easier to use and better – suited for some specialized
    users.Java is also a very reliable programming language, intentionally build in
    order to reduce and even eliminate the possibilities of fatal errors that arise
    from programmer errors. This is why Java heavily relies on object – oriented programming
    principles, which allows the data and the manipulation of data to be packaged
    together, making Java more robust and reliable, as well as much more modular,
    allowing for code packages to be switched out and adapted as needed.In addition
    to the previous qualities of ease of use and reliability, given Java’s nature
    of initially being designed for mobile devices, it was designed to be able to
    provide a higher level of security and safety for its programming, as it was initially
    meant for mobile devices, which by their nature are meant to exchange data over
    networks, making data security of the utmost priority.Due to this, Java has become
    one of the most secure programming languages widely available today, making it
    a highly attractive option to those who wish to write programs that are less vulnerable
    to exploits.Also, though Java was initially intended for mobile devices, Java
    has developed into a relatively platform – independent programming language, something
    that works to its advantage, as programs written in Java tend to work no matter
    what machine is running the program.Java was written as a language that would
    be portable and work cross – platform, meaning that it doesn’t matter what operating
    system the machine has, what hardware the machine is running, or what device it’s
    running on.This has led to its adaptability and its widespread use around the
    world. Due to these core principles prioritized by the Sun Microsystems team that
    developed Java: Ease of Use, Reliability, Safety, Cross – platform adaptability,
    Java became and still remains one of the most popular and most widely used programming
    languages today.Why Java?Of course, one of the key reasons to use Java is its
    focus on Object – oriented programming.Object – oriented programming, or “OOP”
    is a type of programming language model which allows the program’s code to be
    organized around data, rather than functions and logic, which is known as procedural
    programming.These “data clusters” are organized into things called “objects”,
    hence the moniker of “object – oriented programming”.These objects are created
    by something called “classes”, understood here in the traditional sense of how
    classes are: types of objects, allowing the programmer to “classify” them according
    to two major criteria: attributes and methods.The attributes of a class are the
    raw data that will create the object: these are its descriptors, such as the values
    that it possesses, and other relevant data that will make up the object. The second
    criterion is the “method” of the object.This “method” is the behavior, or the
    logical sequences contained within the class, describing how it interacts or can
    be interacted with natively. Chapter 3: Basics of Java![Banner, Intestazione,
    Matematica, Formula, Fisica](image_rsrc3YE.jpg)Java tokensJava tokens are the
    values that are smaller than other integers.These numbers are going to fall between
    the value of -32768 and 32767. The code that I have been using is not going to
    work for shorts, instead I am going to need to use the short function so that
    I can make sure that the values are going to fall between the set limitations.  Large
    values are going to be stored inside of a double value along with floating point
    values.A double does not have to be used if I can use a floating point.As I am
    storing a floating variable. I am going to need to put a letter at the end of
    my value amount. This value should be f because it is a floating point number.  KeywordsIn
    Java, the Boolean type refers to false or true values. Java finds out if it is
    true or false using the reserved keywords. Therefore, an expression Boolean type
    will assume one of these values. An example to demonstrate include: There are
    a few things to note about this program.First, the println(), displays a boolean
    value.Secondly, the boolean values control the flow of an if statement.You don’t
    need to go the long way in writing the boolean type this way: if (b == true)  The
    result shown by the operator such as < is boolean.It is one of the reasons why
    we have the expression 11 > 8 showing the value true .In addition, the other pair
    of parentheses near the 11 > 8 is important since plus comes before the >. IdentifiersThe
    top layer of the diagram above is for the identifier or name. This top layer is
    the name you give to a class.The name should specifically identify and also describe
    the type of object as seen or experienced by the user.In simple terms, the name
    or identifier should identify the class. OperatorsJava has an extensive list of
