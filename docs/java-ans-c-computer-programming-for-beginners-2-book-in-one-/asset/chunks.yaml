    \ and Terminology\n\nAbsolute filename\nAn absolute filename is a filename with\
    \ a full path that is provided from the top or the root of the file system tree,\
    \ or example `c:\\Java\\bin\\javac.exe`.Abstraction is a simple representation\
    \ of a complex situation. In basic terms, abstraction hides how a section of code\
    \ or program works and shows only the functionality of it. This is designed to\
    \ make it easier to maintain and work on the code. OOP design often revolves around\
    \ finding an abstraction level to work with when real-life objects are being modeled.\
    \ Too high a level and insufficient detail is capture; too low and you run the\
    \ risk of a program being more complicated to create and difficult to understand\
    \ that it should be.Abstract method\nAn abstract method is a method whose header\
    \ contains the reserved keyword, `abstract`. Abstract methods do not have a method\
    \ body. Any method that has been designed inside an interface is considered abstract,\
    \ with no exceptions. An abstract method’s body is defined inside an abstract\
    \ class subclass or, if a class implements the interface, within that class.Abstract\
    \ Windowing Toolkit\nThe `AWT`, or Abstract Windowing Toolkit contains a collection\
    \ of classes that are designed to make creating applications with GUIs (graphical\
    \ user interface) much simpler. You will find these in the `java.awt` group of\
    \ packages and classes included are for buttons, windows, frames, text areas and\
    \ more.Accessor method\nAn accessor method is a method that has been designed\
    \ specifically to provide access to a class private attribute. By Java convention,\
    \ accessor methods are prefixed with `get` and then the attribute name. For example,\
    \ to gain access to an attribute called speed, the accessor method would be `getSpeed()`.\
    \ When attributes are set as `private`, it stops objects from external classes\
    \ from modifying the value unless a mutator method is used. We can use accessor\
    \ methods to provide specific access to the private attribute values and to stop\
    \ other objects in other classes from accessing the private attribute – the correct\
    \ visibility needs to be used for the accessor to achieve this.Actor See client.Actual\
    \ argument\nThis is the value of the argument passed from outside a method into\
    \ a method. When the method is called, the values (actual argument) will be copied\
    \ to the formal arguments that correspond to it. The actual argument type and\
    \ the formal argument types must be compatible with one another.Actual parameter\
    \ See actual argument.Address space\nThis is the virtual memory area that a process\
    \ runs in.Agent See server.Aggregation\nThis is an OOP concept, a type of relationship\
    \ where one object has at least one other subordinate object making up its state.\
    \ These subordinate objects don’t tend to have an independent existence outside\
    \ the object that contains them. When this object no longer has a reason to exist,\
    \ neither do its subordinates. For example, you may have a `GasStation` object\
    \ that has a few `pump` objects. Once the `GasStation` object is destroyed or\
    \ has no further use, the `pump` objects follow suit. Aggregation is also known\
    \ as a HAS-A relationship, distinguishing form inheritance which is an IS-A relationship.Aliases\n\
    are several references to one object. The object may receive messages from any\
    \ aliases and any change in state the results will be detected by all.Anonymous\
    \ array\nThis is an array that has been created with no identifier. Anonymous\
    \ arrays tend to be created as actual arguments like this:Yearlyfall y = new Yearlyfall(new\
    \ int[]{10, 8, 9, 5, 3, 2, 0, 3, 8, 1});Anonymous class\nis one that does not\
    \ have a class name. This type of class is generally a subclass or interface implementation\
    \ and normally created as an actual argument or is returned as result of a method.\
    \ For example:\n```\nbutton.addActionListener(new ActionListener(){\n    public\
    \ void actionPerformed(ActionEvent e){\n        System.exit(0);\n    }\n});\n\
    ```Anonymous object\nis an object that gets created with no identifier. Usually,\
    \ they are array elements, results of methods. For example:\n```\nPoint[] vertices\
    \ = {new Point(0,0),new Point(0,1),new Point(1,0)};\n```\nAPI See application\
    \ interface.Append mode\nAppend mode is a mode of file writing in which the contents\
    \ of a file are kept and new content gets appended.Applet\nAn applet is a small\
    \ Java program that is based on the Applet class. Mostly they are used for providing\
    \ active content on a web page and have a number of features that limit them in\
    \ what they can do.Application is sometimes used synonymously for the word program\
    \ but, as far as Java is concerned, application is the term used to describe programs\
    \ that aren’t applets.Application programming interface (API)\nThe API is a set\
    \ of definitions used for writing a program. In Java, an API is a set of classes,\
    \ packages and interfaces used for creating complex applications without having\
    \ to start from the bottom up.Argument\nis the information or data passed to a\
    \ method. Sometimes arguments are called parameters. If a method expects to be\
    \ passed the method header must have a declaration for every argument.Arithmetic\
    \ expression\nAn arithmetic expression is one that contains numerical values that\
    \ are of float or int type. For example, the arithmetic operators, like `*`, `-`,\
    \ and `/`, all take an arithmetic expression as an operand and their results are\
    \ arithmetic values.Arithmetic operator\nThese are a type of operator that will\
    \ return a numerical result and are part of an arithmetic expression. Operators\
    \ include `+`, `-`, `*`, `/`.Arpanet is the network that came before the internet.Array\
    \ is an object of fixed size that can hold at least zero items of the declared\
    \ type. For example, an int array will hold int items.Array initializer\nis used\
    \ to initialize an array. It steps in to take the role of the separation step\
    \ and the initialization. For example:\n```java\nint[] pair = {4, 2};\n```\nis\
    \ equivalent to the following statements:\n```java\nint[] pair;\npair = new int[2];\n\
    pair[0] = 4;\npair[1] = 2;\n```\nAssembler is a program that is used for translating\
    \ programs that are written in the assembly language into a binary form of a specified\
    \ instruction set.Assembly language\nis a symbolic one that corresponds very closely\
    \ to a central processing unit (CPU) instruction set. The assembler (above) is\
    \ the translation program that transforms the program into binary.Assignment operator\n\
    is an equal sign (`=`) used for storing an expression’s value into a variable;\
    \ for example, `variable = expression`. The right side of the operator must be\
    \ evaluated before the assignment can be made. An assignment may, on its own be\
    \ used on an expression. This example assignment statement will store a value\
    \ of zero into both the variables – x = y = 0`.Assignment statement is a statement\
    \ that contains the assignment operator.Attribute\nis a specific use of an instance\
    \ variable. The attribute values in one class instance are defining the current\
    \ state of the specific instance. Class definitions can impose constraints on\
    \ the valid instance states through a requirement that a given attribute or attributes\
    \ do not take particular values. For example, if an attribute holds exam results\
    \ for a class, it should not have negative values. An attribute may be manipulated\
    \ using mutator and accessor methods.Base case is a non-recursive route taken\
    \ through a recursive method.Base type\nindicates the item type in an array, i.e.\
    \ the arrays’ defined type. For example:\n```java\nint[] numbers;\n```\nNumbers\
    \ have a base type of `int`. If the base case is the type of class, it will be\
    \ indicating lowest supertype of the objects that the array can store. For example:\n\
    ```java\nShip[] berths;\n```\nAll that can be stored in berths are instances of\
    \ the class called Ship. If an array’s base type is Object, it may be used for\
    \ storing instances for any class.Behavior\nClass methods are what implement the\
    \ behavior of a class. The behavior of a specific object is a mixture of the class\
    \ method definitions and the current state of the specific object.Big-endianA\
    \ type of machine. One of the most common differences between machines is how\
    \ they store each byte of numerical data with many bytes. A big-endian machine\
    \ will store high-order bytes first, followed by low-order bytes.Also see little-endianbinaryA\
    \ binary is base 2 number representation. With base 2 only 1 and 1 are used as\
    \ digits and the positions of the digits are representing successive powers of\
    \ 2.Also see bitBinary operator\nA binary operator is an operator that will take\
    \ two operands. Java has several binary operators, including some of the arithmetic\
    \ and Boolean.Binary search is a search that looks through sorted data where the\
    \ central position is looked at first. The search will then go to the left or\
    \ the right, eliminating the other side until all the data has been searched or\
    \ the specific item is located.Bit is a binary digit. It can take only two values,\
    \ 0 and 1. A bit is a basic block for building data and programs. A computer will\
    \ move data around on a regular basis in multiples of units made up bits. manipulation\
    \ operator like `|`, `&`, `^`, are used for manipulating bits inside data. The\
    \ `<<`, `>>` and `>>>` shift operators are bit manipulation too.Blank final variable\
    \ is a final variable that wasn’t initialized when it was declared. These variables\
    \ need to be initialized in one of two ways before it can be used – in every class\
    \ constructor or in an instance.Block is a section of code made up of declarations\
    \ and statements enclosed in a pair of opening and closing brackets `{}`. Both\
    \ a class body and method body are used for enclosing scope levels.Bookmark is\
    \ used by web browser as a way of remembering details.Boolean is a primitive type\
    \ in Java. It has just two possible values – TRUE or FALSE.Boolean expression\
    \ is one that results in boolean, i.e. TRUE or FALSE. The `&&` and `|` operators,\
    \ among others, will take boolean operand, producing boolean result. Relational\
    \ operators will take operands of different types and will produce boolean result.BootA\
    \ computer “boots” up when you turn it on and the term is derived the phrase “pulling\
    \ yourself up by your bootstra”.Bootstrap class is part of the Java Platform Core,\
    \ like those from `java.io` and `java.lang` packages.Boundary error is one that\
    \ happens as a result of a mistake happening at the edge of problem, such as no\
    \ items of data, indexing off an array, loop termination and more. Boundary errors\
    \ are common logical errors.Bounded repetition is where statements in the body\
    \ of a loop get a certain number of times – the number of times is worked out\
    \ when the loop begins. Java does not have any control structure that will guarantee\
    \ bounded repetition.Bounds is the limit of a collection or array. In Java, a\
    \ lower limit will always be zero and, where arrays are concerned, an upper bound\
    \ will be one less than the array length and it is fixed. When you index outside\
    \ a collection or array bound, you will get `OutOfBoundsException` thrown.Branch\
    \ instruction will store an instruction address in the counter for a program.\
    \ The result is that the next instruction fetched may not be the one that immediately\
    \ follows the branch instruction and causes disruption in the normal sequence\
    \ of instruction execution. The result of this is conditional execution and repetition.Break\
    \ statement is a statement for breaking out of a loop, a labeled block or switch\
    \ statement. In every case, control flow moves to the statement that immediately\
    \ follows the block containing the statement.Bridging method is one that provides\
    \ a bridge between methods in a public interface for a class and the private implementation\
    \ of that interface. Usually, bridging methods are non-public in terms of visibility.Byte\
    \ is, in computing terms, eight data bits. In Java, it is also a primitive type\
    \ with a size of eight bits.Bytecode The Java compiler translates Java source\
    \ files into bytecode which is the instruction set of the JVM. All bytecode is\
    \ stored in a `.class` file.CONCLUSION I would like to thank you for choosing\
    \ my guide on Java programming.As you can see, it is a simple yet complex language,\
    \ with so many different aspects to learn. By now you should have a good understanding\
    \ of the core concepts of Java programming and how to use it.Your next step is,\
    \ quite simply, practice.And keep on practicing. You cannot possibly read this\
    \ guide once and think that you know it all.I urge you to take your time going\
    \ through this; follow the tutorials carefully and don’t move on from any section\
    \ until you fully understand it and what it all means.To help you out, there are\
    \ several useful Java forums to be found online, full of people ready and willing\
    \ to help you out and point you in the right direction.There are also loads of\
    \ online courses, some free and some that you need to pay for, but all of them\
    \ are useful and can help you take your learning to the next level.Did you enjoy\
    \ this guide? I hope that it was all you wanted and more and has put you on the\
    \ right path to getting your dream job!C PROGRAMMING LANGUAGE FOR BEGINNERS step\
    \ by step guide to learn C programming and seriesWill NortonIntroductionProgramming\
