    to the first C program written in this book.In the next chapters, we will start
    an in-depth discussion about various important C programming language concepts.Let
    us go!Chapter 6: Functions![Matematica, Calcolo, Pagare, Bruchrechnung, Aritmetica](image_rsrc3Z4.jpg)C
    is a procedural programming language that adversely uses functions to complete
    tasks. Unlike modern programming languages such as Java which uses classes and
    objects to create instances, you need to use functions to create varied instances.Functions
    are usually determined as reusable code.They are first implemented for using mathematical
    calculations in the 13th century.In this chapter, we will in detail describe functions
    in the C programming language. We suggest you create your own programs to better
    understand functions.Let us go!What is a function?Functions are generally used
    in the mathematical operations to repeat a calculation or set of expressions.
    Computer programming languages adopted these functional concepts to create and
    maintain certain defined instructions.A lot of programming languages provide libraries
    that can be imported when they want to be used.For example, in C programming language
    to use printf and scanf notations you need to import studio.h. This is because
    printf and scanf are standard input, output functions.These are also called as
    system functions.You can also use your own defined functions which are programmatically
    known as user-defined functions by importing them.From a programming perspective,
    the function is a collection of logical and lexically correct statements that
    can be used for developing applications. Also, it is important to say that it
    is mandatory to have at least one function in the program.Main is the default
    function.Why functions are used?Imagine programming with a lot of static code
    that does the same task. It is not feasible and consumes a lot of time for the
    programmers.This is the reason why functions are used to regulate the large code
    and maintain equity in the program.With the help of functions, we can divide the
    code into many modules and can easily check them with any available debugger.
    Functions are also to organize and maintain, unlike complex static code that can
    go on for an infinite distance.For example, if you want to create a stock investor
    program in the normal programming instance you need to create static input and
    output for every option that is displayed on the interface.However, in procedural
    programming with the help of functions, you can create options or menu instances
    that can be used whenever needed.Advantages of functions1) EasyIt is easy to maintain
    and debug the code when functions are present. You can’t or it is practically
    not possible to develop complex code without functions. They are the actual building
    blocks of the c programming language and will always be. They are easy to create
    if you understand their basic implementation procedure.2) Pathway to modulesModules
    are an important component in the programming language. They categorize the language
    and divides or organizes meaningful code in one place. Functions are the basic
    nature of modules. If you learn about functions you can easily understand the
    complexity of modules. After learning about higher-order functions in-depth you
    will understand the importance of modules in a programming language.3) DebuggingDebugging
    is a process where the programmers check the programming code continuously and
    change the affected program code if they find any bugs. Bugs can be used for exploitation
    purposes by hackers. When effective functions are written it is easy to just change
    their logic during the debugging process. In this way, we will not encounter any
    dangerous errors that may compromise the system.4) Save timeWith functions, you
    will save a lot of time during the programming process. This process is called
    as code optimization.Types of functionsEvery programming language provides a different
    type of default system functions. For example, you can use mathematical and time
    functions in C language from the default libraries. Users can also create functions
    with new parameters and logical statements.These functions are called as user-made
    functions.In the next section, we will explain about user-made functions and library
    functions in detail.Follow along!a) library functionsThey are already pre-linked
    with the C compiler that they downloaded.All the functions are stored in the default
    c folder and can be imported whenever needed. Printf, scanf are some of the famous
    predefined functions in the C programming language.The merits of predefined functions
    are there is no need to specifically call them during the programming process.
    Also, they are fast because they are already linked to the compilers. However,
    remember that they are limited by the functionality they can offer and they cannot
    be extended by any means.Also, no one can edit or change the default functions
    that the C programming provides unlike user made functions.b) User-made functionsThese
    are the functions that are created by the programmer. For creating functions,
    you need to follow certain guidelines that the C programming language provides.
    You need to first define functions and call them whenever needed.In the next section,
    we will discuss the function declaration in detail.Follow along!How to define
    a function?First of all, remember that functions have a unique name and reserved
    keywords cannot be used as function names.Here is the format:Datatype name (//Enter
    parameters here){// Enter function logic here}Here, a datatype is the return value
    of the function you are trying to create. For example, if a function returns negative
    decimal values you need to declare float variables as the data type.In the next
    step, you need to enter a valid function name with parameters.What is a parameter
    in the function?To say in layman terms parameters are similar to variables but
    for functions. Each of the parameters is individually declared with a data type.Only
    variables declared in the parameters can be used in the body of the function.
    If there are any misspells while creating or calling parameters of the function
    you will encounter run time errors.At the last step, you need to create logical
    expressions and statements in the function body. In the function body, you cannot
    use variables or literals that are not declared before. So, make sure that all
    the specifiers are included before you start creating logical operations, conditionals,
    and loops in the function body.How to call a function?A function is useless if
    it cannot be used. Programming doesn''t allow usage of functions just by their
    names due to various potential errors. You need to follow certain rules to call
    a function in the C programming language.Here is the format:Datatype function
    (// Enter the parameters here)sample = function (//Enter the parameters here)Here,
    the data type represents the type of return value you are expecting. Sample represents
    a variable name. A function can be called only if the variables are declared with
    a global specifier.In the next section, we will in detail discuss function arguments.Follow
    along!What are the function arguments?Arguments are the values that functions
    take in the parameter part of the function. You can create functions without arguments
    too.There are some varied differences between functions with arguments and without
    arguments which we will be discussing now in detail.Functions with argumentsIf
    a function has arguments there is no need to declare variables again in the function
    body. When function arguments are declared you need to call the functions with
    arguments. If certain arguments are not shown while calling a function then it
    will end up with a syntax error.For example:function (int x, int y)Here is a function
    with two arguments x and y. Here x and y are both of int data type. If you are
    calling this function in the middle of the program you need to use the below format.function
    (3,4)If you leave the arguments without any values you will not further proceed
    with the compilation process.For example,function (3)Output:The syntax is not
    completeFunctions without argumentsIf functions are not declared or enclosed with
    arguments, they need to be called using a value or reference.These functions are
    especially used while creating complex system learning applications.They don''t
    consist of any parameters but use variables as a way to expand the logical equivalence
    to the function statements and expressions.Call by ValueWhen call by value argument
    instance is used you cannot change the parameter value again. This functionality
    is used especially when there is a necessity of using constant literal values
    in the function body.Here is a program:#include<stdio.h>void sample (float first,
    float second){double result;result=first;first=second;second=first;}main (){float
    first=100, second=200;result (first, second); // passing value to function// This
    is an example to calling a function using a value}In this program, the function
    result is called using the value. This is an easy way to declare functions and
    use them.In the next section, we will explain another advanced way to call function.Call
    by referenceUsually, when a variable or literal is declared they are stored in
    a memory location. Memory locations can be used to modify or alternate statements
    and expressions.You can easily know about your reference storage value using the
    pointers in the C programming language.When some advanced functions are used,
    it becomes a necessity to call the function values using reference points. The
    advantage of this feature is function value changes everywhere in the program
    when a reference pointer is used.Here is a program:#include<stdio.h>void sample
    (float first, float second){double result;result=first;first=second;second=first;}main
    (){result (&first, &second); // passing value to function by a reference// This
    is an example to calling a function using a reference}In the above program, we
    use a function that calls the arguments with the help of reference values. In
    the next section, we will discuss recursion in detail.Beginners are encouraged
    to learn about different system library functions too on their own. In the further
    chapters, we will discuss various string and time manipulative functions in detail.For
    now, let us look at an example that helps you understand the essence of recursive
    programming in C.Recursive functionsRecursive functions are used to decrease the
    code length of the complex problems such as sorting algorithms for an example.
    Creating a recursive function is difficult because it involves complex logical
    expressions. However, they are famous and popular in programming circles because
    they can reduce the load on the programing resources with their faster functional
    calling abilities.In layman terms, Recursion is a function that repeats by itself.
    That is, it uses its own arguments as functional parameters.Recursive functions
    are usually used in the creation and implementation of advanced data structures
    such as trees, graphs, and lists.For your better understanding of the topic in
    this chapter, we will implement factorial using a recursive function. Follow along!Here
    is the program:// Enter the libraries here#include <stdio.h>// Main function logicmain
    (){long int variable;for (variable=0; variable++;variable>11){// We only display
    factorial upto 10 numbers/* You can change the variable limit if needed */print(
    %n, factorial)// Enter the return value here// Factorial recursive logic begins
    from herelong int factorial(//Enter parameters here){if (variable == 0 )factorail
    == 0elsefactorail = result * (result-1)}return factorial;}Explanation:In the above
    program, factorial is calculated by a recursive function that calls by itself.
    First of all, we create two global variables, result, and factorial in the body
    of the function. Result is a temporary variable that holds the values during the
    functional process.Factorial is a variable that holds the end value and prints
    on the screen. They both use recursive logic to implement a factorial execution
    process in this program.We use a conditional and loop statement constantly to
    check whether are not the limit of factorial is crossed. If 10 numbers are completed,
    the function will stop recusing itself.We also used long, a program specifier
    for the integer values to allocate sufficient resources during the recursive process.Exercise:Try
    to create a recursive function for checking whether two numbers are prime or not.Procedural
    programming in the C languageAs said before, C is a procedural programming language
    that relies completely on functions to complete tasks.The major advantage of procedural
    programming is they can be used to create a new set of programs from the old programs.Object-oriented
    paradigm inspired programming languages such as Java consist of whole new instances
    and entities which can be difficult to maintain.Procedural programming can be
    completely achieved only when you can use functions, identifiers, and logical
    expressions combined to create efficient programs. Procedural programming has
    its demerits too. It is not possible to create a machine learning and artificial
    intelligence applications with the C programming language because they cannot
    create automatic functions.With this, we have completed a brief introduction to
    functions.In the next section of this book, we will in depth discuss various advanced
    C programming features such as arrays, structures, and pointers.For now, we suggest
    you look at some of the open-sourced GitHub projects to understand the usage of
    functions in-depth.In the immediate next chapter, we will discuss various basic
    operations C programming language can perform.Let us go!Chapter 7: Operations![Imparare,
    Matematica, Bambino, Ragazza, Formula, Fisica](image_rsrc3Z5.jpg)The previous
    chapter is a dive into the procedural philosophy of C programming language.Creating
    functions and using pre-built system functions is the most important task that
