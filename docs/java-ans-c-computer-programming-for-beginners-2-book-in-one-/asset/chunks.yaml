    \ What is your strength?\n\nChapter 17: Java Language and Terminology\n\nAbsolute\
    \ filename\nAn absolute filename is a filename with a full path that is provided\
    \ from the top or root of the file system, or example `c:\\Java\\bin\\javac.exe`.Abstraction\
    \ is a simple representation of a complex situation. In basic terms, abstraction\
    \ hides how a section of code or program works and shows only the functionality\
    \ of it. OOP design often revolves around finding an abstraction level to work\
    \ with when real-life objects are being modeled. Too high a level and insufficient\
    \ detail is capture; too low and you run the risk of a program being more complicated\
    \ to create.Abstract method\nAn abstract method is a method whose header contains\
    \ the reserved keyword, `abstract`. Abstract methods do not have a method body.\
    \ Any method that has been designed inside an interface is considered abstract,\
    \ with no exceptions. An abstract method’s body is defined inside an abstract\
    \ class subclass or, if a class implements the interface, within that class.Abstract\
    \ Windowing Toolkit\nThe `AWT`, or Abstract Windowing Toolkit contains a collection\
    \ of classes that are designed to make creating applications with GUIs (graphical\
    \ user interface) much simpler. You will find these in the `java.awt` group of\
    \ packages and classes included are for buttons, windows, text areas and more.Accessor\
    \ method\nAn accessor method is a method that has been designed specifically to\
    \ provide access to a class private attribute. By Java convention, accessor methods\
    \ are prefixed with `get` and then the attribute name. For example, to gain access\
    \ to an attribute called speed, the accessor method would be `getSpeed()`. When\
    \ attributes are set as `private`, it stops objects from external classes from\
    \ modifying the value unless a mutator method is used. We can use accessor methods\
    \ to provide specific access to the private attribute values and to stop other\
    \ objects in other classes from accessing the private attribute – the correct\
    \ visibility needs to be used for the accessor to achieve this.Actor See client.Actual\
    \ argument\nThis is the value of the argument passed from outside a method into\
    \ a method. When the method is called, the values (actual argument) will be copied\
    \ to the formal arguments that correspond to it. The actual argument type and\
    \ the formal argument types must be compatible with one another.Actual parameter\
    \ See actual argument.Address space\nThis is the virtual memory area that a process\
    \ runs in.Agent See server.Aggregation\nThis is an OOP concept, a type of relationship\
    \ where one object has at least one other subordinate object making up its state.\
    \ These subordinate objects don’t tend to have an independent existence outside\
    \ the object that contains them. When this object no longer has a reason to exist,\
    \ neither do its subordinates. For example, you may have a `GasStation` object\
    \ that has a few `pump` objects. Once the `GasStation` object is destroyed or\
    \ has no further use, the `pump` objects follow suit. Aggregation is also known\
    \ as a HAS-A relationship, distinguishing form inheritance which is an IS-A relationship.Aliases\n\
    are several references to one object. The object may receive messages from any\
    \ aliases and any change in state the results will be detected by all.Anonymous\
    \ array\nThis is an array that has been created with no identifier. Anonymous\
    \ arrays tend to be created as actual arguments like this:Yearlyfall y = new Yearlyfall(new\
    \ int[]{10, 8, 9, 5, 3, 2, 0, 1});Anonymous class\nis one that does not have a\
    \ class name. This type of class is generally a subclass or interface implementation\
    \ and normally created as an actual argument or is returned as result of a method.\
    \ For example:\n```\nbutton.addActionListener(new ActionListener(){\n    public\
    \ void actionPerformed(ActionEvent e){\n        System.exit(0);\n    }\n});\n\
    ```Anonymous object\nis an object that gets created with no identifier. Usually,\
    \ they are array elements, results of methods. For example:\n```\nPoint[] vertices\
    \ = {new Point(0,0),new Point(0,1),new Point(1,0)};\n```API See application interface.Append\
    \ mode\nAppend mode is a mode of file writing in which the contents of a file\
    \ are kept and new content gets appended.Applet\nAn applet is a small Java program\
    \ that is based on Applet class. Mostly they are used for providing active content\
    \ on a web page and have a number of features that limit them in what they can\
    \ do.Application is sometimes used synonymously for the word program but, as far\
    \ as Java is concerned, application is the term used to describe that applets.Application\
    \ programming interface (API)\nThe API is a set of definitions used for writing\
    \ a program. In Java, an API is a set of classes, packages and interfaces used\
    \ for creating complex applications.Argument\nis the information or data passed\
    \ to a method. Sometimes arguments are called parameters.Arithmetic expression\n\
    An arithmetic expression is one that contains numerical values that of float or\
