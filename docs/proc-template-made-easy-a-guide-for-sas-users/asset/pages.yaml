  md: '# Chapter 3: Creating and Customizing Table Templates


    # Defining a Table


    # Defining Headers and Footers


    # Defining Columns


    # Using Computed Column Values As Column Data


    # Table Attributes


    # Style Overrides and Traffic Lighting


    # The CELLSTYLE AS Statement


    # Using Table Templates within DATA _NULL_


    # Using Variables in Table Templates


    # Using Generic Columns


    # DATA Step Tricks


    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    # Modifying SAS Procedure Tables


    # The PROC FREQ Crosstabulation Table


    # Putting It All Together


    Although many people don''t realize it, almost all tabular output generated by
    SAS is created using a table template. Table templates describe what columns,
    headers, and footers should appear in the table. They can also contain style overrides
    to specify extra style information. In addition, there are many ways to create
    new columns based on columns in the existing data set. Because SAS generates tables
    using table templates, you can modify the output of procedures by editing the
    table templates that the procedures use. But the real power of table templates
    is in writing your own from scratch to create tables that aren''t possible to
    create any of the reporting procedures.


    In this chapter, we will show you how to create your own table templates, how
    to customize styles and traffic lighting, and how to modify the table templates
    used by SAS procedures.'
  merge: -1
  img_proc: true
- pgno: 15
  md: "# Defining a Table\n\nYou have already seen how to render some simple tables,\
    \ but now let's learn the method to define them. The first method we used for\
    \ all of SAS is not very flexible when we want to create the output table.\n\n\
    ```\nPROC TEMPLATE;\nDEFINE TABLE matlab;\n  LAYOUT _PAGE_(nobs=100);\n    FILE\
    \ TEMPLATE=\"mytable\";\n  END;\nRUN;\n```\n\nHere is the output from the code\
    \ above.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_0.png)\n\nThe DATA statement\
    \ has not changed much in this chapter, but we can simplify this method using\
    \ a macro. One of the macros we will define is DEFINE_TABLE, which automates the\
    \ table code shown above. We will be using this macro to bind this chapter of\
    \ data sets to tables.\n\n```\n%PROC TEMPLATE;\nDEFINE TABLE %&tablename;\n  LAYOUT\
    \ _PAGE_(nobs=100);\n    FILE TEMPLATE=\"%&tablename%\";\n  END;\nRUN;\n```\n\n\
    Here is the example using the macro in the code for DEFINE_TABLE.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_1.png)\n\
    \nIf you are using SAS 9.4, you can use the convenience PROC OTABLE, which handles\
    \ the definition of the table and data set to the table template. The example\
    \ is shown using PROC OTABLE below.\n\n```\nPROC OTABLE data=mytset template=mytable;\n\
    ```\n\nWhen you use PROC OTABLE, all columns in your data set will be displayed\
    \ in the table. You can control which columns are displayed by using the COLUMN\
    \ statement. This works just like the COLUMN statement in PROC REPORT.\n\n```\n\
    PROC OTABLE data=mytset template=mytable;\n  COLUMN name age weight;\nRUN;\n```\n\
    \nHere is the output when you use the COLUMN statement.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_2.png)\n\
    \nIf you have many columns in your data set they can be expressed using the notation\
    \ (e.g., all-*), you can use that notation in the COLUMN statement as well.\n\n\
    ```\nPROC OTABLE data=mytset;\n  COLUMN all-*;\nRUN;\n```\n\nThe COLUMN statement\
    \ is more advanced than that. For example you can stack values on top of each\
    \ other by grouping the columns in parentheses. The stacked statement will have\
    \ the header, weight and weight on top of each other in the same cell.\n\n```\n\
    PROC OTABLE data=mytset;\n  COLUMN (name age weight);\nRUN;\n```\n\nThe output\
    \ is shown below.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_3.png)\n\nYou\
    \ might have noticed that the header for the stacked columns only contains Age.\
    \ The variable that is on the top of the stacked columns what the header is. However,\
    \ you can change the header too. That technique is discussed later in chapter.\n\
    \nYou can combine this stacked feature with the list feature too.\n\nHere is the\
    \ output from the previous code.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_4.png)\n\
    \nAnother way to stack is so that the output table looks like a report with a\
    \ line break after the COLUMN statement. In that way you group the columns together\
    \ and then stack them on top of each other using an asterisk (*). The following\
    \ code stacks the columns horizontally over weight.\n\n```\nPROC OTABLE data=mytset;\n\
    \  COLUMN name * age weight;\nRUN;\n```\n\nThe output below is created below."
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Defining Headers\n\nTables have two types of headers: table headers and column\
    \ headers. Luckily, you can define both in the same table. You only need to specify\
    \ them next.\n\nTo define a header, you must have a table type and a name statement\
    \ to define it. In fact, the header is defined at the beginning of the table.\
    \ The following code shows examples of these types:\n\n```\n```latex\n\\begin{table}\n\
    \  \\header{Name}{Age}\n  \\row{Alice}{25}\n  \\row{Bob}{30}\n\\end{table}\n```\n\
    ```\n```\n\nNow that you have a header, you can use it or change it as you like.\
    \ For example, you can use the \\header statement to define the header within\
    \ a table definition.\n\nHere is an example of applying a header using a table\
    \ method:\n\n```\n```latex\n\\begin{table}\n  \\header{Name}{Age}\n  \\row{Alice}{25}\n\
    \  \\row{Bob}{30}\n\\end{table}\n```\n```\n\nThe output is shown below:\n\n| Name\
    \ | Age |\n|---|---|\n| Alice | 25 |\n| Bob | 30 |\n\nYou can add more headers\
    \ to the table as you want. However, the headers will appear in the table in the\
    \ order they do in the table definition.\n\n```\n```latex\n\\begin{table}\n  \\\
    header{Name}{Age}{City}\n  \\row{Alice}{25}{New York}\n  \\row{Bob}{30}{London}\n\
    \\end{table}\n```\n```\n\nThe output is shown below:\n\n| Name | Age | City |\n\
    |---|---|---|\n| Alice | 25 | New York |\n| Bob | 30 | London |\n\nNow let's consider\
    \ stacking headers. The stacking headers is similar to the way that the blocks\
    \ in the grid work. You can define multiple headers for the table, and the more\
    \ you define, the more they will be stacked. This is not something you would need\
    \ very time, but it shows the flexibility of table headers.\n\n```\n```latex\n\
    \\begin{table}\n  \\header{Personal Info}\n  \\header{Name}{Age}{City}\n  \\row{Alice}{25}{New\
    \ York}\n  \\row{Bob}{30}{London}\n\\end{table}\n```\n```\n\nThe output is shown\
    \ below:\n\n| Personal Info |\n| Name | Age | City |\n|---|---|---||\n| Alice\
    \ | 25 | New York |\n| Bob | 30 | London |\n\nWhen using the SPLIT statement,\
    \ it is important when you define multiple headers. It works fine for that, but\
    \ you can also use it to include a header in extended table headers. Going back\
    \ to our Terra example, in the case of the Terra example, we used the SPLIT statement\
    \ to split the header into two parts.\n\n```\n```latex\n\\begin{table}\n  \\header{Name\\\
    SPLIT{Age}{City}}\n  \\row{Alice}{25}{New York}\n  \\row{Bob}{30}{London}\n\\\
    end{table}\n```\n```\n\n# Common Table Headers and Footers\n\nThere are various\
    \ types of table footer: FIRST_FOOTER, LAST_FOOTER, and SPLIT. Each one has its\
    \ own purpose. You can choose one of them according to your needs.\n\n+   FIRST_FOOTER:\
    \ a footer that appears at the beginning of the table if the header is defined.\n\
    \n+   LAST_FOOTER: a footer that appears at the end of the table.\n\n+   SPLIT:\
    \ a footer that will be treated as two headers.\n\nPROFOOTER: a footer to be defined\
    \ in the table definition."
  merge: -1
  img_proc: true
- pgno: 17
  md: "# Defining Columns\n\nUsing the COLUMNS statement to define the structure of\
    \ the table, you can specify what each column defines such as the column name,\
    \ what the column header contains, and the data type.\n\nYou can use one of these\
    \ methods to define the overall structure of the table using the COLUMNS statement\
    \ or define individual columns that need special formatting.\n\n+   1. Define\
    \ the columns you want to include.\n\nLet's go to the first part using the COLUMNS\
    \ statement.\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n  AGE integer,\n\
    \  CITY char(20);\n```\n\nThe following table is simplified but not as complete\
    \ as necessary.\n\n| ID | NAME | AGE | CITY |\n|---|---|---|--|\n| 1 | Alice |\
    \ 25 | New York |\n| 2 | Bob | 30 | London |\n| 3 | Charlie | 22 | Tokyo |\n\n\
    Using a hybrid approach, you can use the COLUMNS statement to define the overall\
    \ structure, and then define columns to specify attributes. This would look like\
    \ the following:\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n  AGE integer,\n\
    \  CITY char(20);\n\nDEFINE ID\n  HEADER 'ID Number';\nDEFINE NAME\n  HEADER 'Full\
    \ Name';\nDEFINE AGE\n  HEADER 'Age (Years)';\nDEFINE CITY\n  HEADER 'City of\
    \ Residence';\n```\n\nNote that if you use both a COLUMNS statement and define\
    \ columns, the settings in the DEFINE statement will take precedence. Also, the\
    \ order of the columns in the table will be determined by the order of the information\
    \ in the COLUMNS statement; any columns defined in DEFINE will be automatically\
    \ appended to the COLUMNS statement at the end of the table.\n\nThe output table\
    \ is shown below.\n\n| ID Number | Full Name | Age (Years) | City of Residence\
    \ |\n|---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2 | Bob | 30 | London\
    \ |\n| 3 | Charlie | 22 | Tokyo |\n\nWhile this handles headers, you might want\
    \ to use a header header instead of just a line. In this case, you should use\
    \ the HEADER statement to associate a header with a column.\n\n```\nCOLUMNS\n\
    \  ID integer,\n  NAME char(20),\n  AGE integer,\n  CITY char(20);\n\nHEADER ID\n\
    \  LABEL 'ID Number';\nHEADER NAME\n  LABEL 'Full Name';\nHEADER AGE\n  LABEL\
    \ 'Age (Years)';\nHEADER CITY\n  LABEL 'City of Residence';\n```\n\nThe output\
    \ is shown below.\n\n| ID Number | Full Name | Age (Years) | City of Residence\
    \ |\n|---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2 | Bob | 30 | London\
    \ |\n| 3 | Charlie | 22 | Tokyo |\n\nAnother thing to do with columns is to format\
    \ the data format. This is done using the FORMAT statement. For example, to left-align\
    \ the information in the last column, you can use the FORMAT attribute. All the\
    \ numbers in our table are right-aligned. You can make them all aligned that way\
    \ with the following code:\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n\
    \  AGE integer,\n  CITY char(20);\n\nFORMAT CITY left20;\n```\n\nThe output for\
    \ this example is shown below.\n\n| ID Number | Full Name | Age (Years) | City\
    \ of Residence |\n|---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2 | Bob\
    \ | 30 | London |\n| 3 | Charlie | 22 | Tokyo |\n\nThere are many column attributes\
    \ that can be used to control the behavior of columns. However, most of the attributes\
    \ are used in the LIST statement. Listing the attributes allows you to control\
    \ how the columns are displayed in the output."
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Using Computed Values As Column Data


    Although you do not need to set a table template, you do not necessarily need
    a data column for each column. You can create columns from other data in the table.
    The COMPUTE statement determines whether a column is associated with a data or
    an expression. This statement takes a standard SAS expression. The expression
    is evaluated for every observation in the input data set to get the resulting
    output value. Here is the general format of the COMPUTE AS:


    ```

    COMPUTE as expr;

    ```


    Since we have using the SASHELP class set, let us trend and use the information
    to compute something useful. One thing that can be calculated is the body mass
    index (BMI). This is one measure to determine if someone is underweight, normal,
    or overweight. It is computed using the following formula:


    > BMI = weight^2 / height^2


    Find answers on the fly, or master something new. Subscribe today. Pricing options.


    Now that we have all of the information, add a new column to the table that contains
    each individual''s BMI.


    ```

    PROC TABLE data=sashelp.class (obs=7);

    COLUMN name age height weight bmi;

    DEFINE bmi;

    COMPUTE bmi AS (weight * 703) / (height * height);

    HEADER = "BMI";

    FORMAT bmi=2.;nEND;

    RUN;

    ```


    The resulting output is shown:


    | Name | age | height | weight | BMI |

    |---|---|---|---|---|

    | Alice | 11 | 56 | 63 | 25.03 |

    | James | 14 | 66 | 120 | 27.27 |

    | Mary | 90 | 59 | 117 | 33.74 |

    | Michael | 28 | 63 | 100 | 26.05 |

    | Patricia | 15 | 61 | 88 | 24.77 |

    | Robert | 13 | 65 | 140 | 29.91 |

    | Susan | 22 | 54 | 95 | 32.04 |

    | David | 11 | 69 | 160 | 23.33 |

    | Barbara | 19 | 62 | 103 | 27.99 |

    |Linda | 10 | 60 | 115 | 32.06 |


    A method to create new values in a column is using the TRANSLATE statement. Unlike
    PROC FORMAT, it takes the data in a column and converts it into a different representation.
    It is like of using a SAS format, but it gives you the full power of SAS expressions
    in the matching of the value and the replacement. In addition, the value of the
    column is based on the values of any number of columns, just like in the case
    of the COMPUTE AS statement. The general format of the TRANSLATE statement is:


    ```

    TRANSLATE expr-a INTO expr-b;


    ...


    expr-a INTO expr-b;

    ```


    The data in the column is tested against the expression on the left side of the
    INTO keyword. If the expression is true, then the data is generated by the expression
    on the right side of the INTO keyword. Let''s look at an example


    We do not care about the exercise in the SASHELP.CLASS data set for the male and
    female students, only whether they are above or below a certain value. However
    we only care if the weight is between 70 and 120. Any values outside that range
    can be represented by "low" and "high" respectively. For females, we want to do
    the same, except the values are 70 and 100. We could not accomplish this with
    a SAS format because SAS format requires the data from two columns.


    ```

    PROC TABLE

    data=sashelp.class(obs=7);

    COLUMN name age height weight;

    DEFINE weight;

    TRANSLATE weight-INTO "low" when weight < 70;

    TRANSLATE weight-INTO "high" when weight > 100;

    END;

    ;

    ```


    In this case, because we are using a new variable in the calculation, we need
    to include it in the COMPUTE column as well. Turn will be of using PRINT-OF in
    the column definition. The value of the VAL-KEY refers to whichever expression
    was currently being applied. In example, this does not make any difference when
    the TRANSLATE statement is used in one column; however, some TRANSLATE statement
    must be used in the table to apply to all of the columns in table. In that case,
    the VAL-KEY would correspond to whichever expression was currently being applied.
    Here, here is the output from the code below.'
