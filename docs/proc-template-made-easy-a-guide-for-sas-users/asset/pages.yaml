- pgno: 29
  md: '# Running PROC TEMPLATE Examples


    While the examples in this book work for many versions of SAS, if you have SAS
    9.3, you can simplify most of them. We have mentioned the addition of PROC ODSTABLE
    in SAS 9.3, which combines the steps of compiling a template and binding it to
    a data set into a single step. The following code snippets are essentially equivalent.:


    ```

    /* Using PROC TEMPLATE */nPROC TEMPLATE;

    DEFINE TABLE mytable;

    COLUMN name age height;

    END;

    RUN;


    %render(mytable, sashepclass);

    ```


    ```

    /* Using PROC ODSTABLE */

    PROC ODSTABLE DATA = sashepclass;

    COLUMN name age height;

    RUN;

    ```


    The primary difference between the two methods above is that in the PROC TEMPLATE
    code, the table template will remain on disk, whereas PROC ODSTABLE creates a
    temporary table definition that is discarded once the table has been rendered.


    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    NAME= option. The following code snippets give equivalent behavior:


    ```

    /* Using PROC TEMPLATE */

    PROC TEMPLATE;

    DEFINE TABLE mytable;

    COLUMN name age height;

    END;

    RUN;

    ```


    ```

    /* Using PROC ODSTABLE */

    PROC ODSTABLE NAME = mytable;

    COLUMN name age height;

    RUN;

    ```'
