- pgno: 1
  md: '# # About Book


    PROC TEMPLATE Made: A Guide for SAS users to understand the power of PROC TEMPLATE.
    This template language used by all SAS procedures to describe the output tables,
    as well as to create custom reports and graphics for styling is as powerful as
    the SAS Base procedures.


    # ## Is This For You?


    If you are looking to learn more about creating custom reports and how to create
    new designs with PROC TEMPLATE,


    # ## Scope of This Book


    Basic knowledge of ODS is required.


    This book covers the theory of tables and templates, and includes a full tour
    of how to use PROC TEMPLATE to create custom reports. Many examples are provided
    throughout to help you understand the concepts.


    Chapter 1, "Introduction", explains how to use SAS TEMPLATE to define the structure
    of a table. Chapter 2, "Using Tables in SAS Reports", explains how to use SAS
    TEMPLATE language to style the ODS output. Body of the tables are explained in
    detail. Chapter 3 explains how to create "data-dependent" and "data-independent"
    tables which are covered in the book.


    # ## Chapter 3: "Creating and Customizing Tables,"


    This chapter covers all types of tables including headers, footers, styles and
    how to style them within the ODS output. Examples of tables are provided, as well
    as how to use PROC TEMPLATE and PROC GREPORT to create them.


    # ## Chapter 4: "Template Management",


    This chapter explains how the ODS path is used to pass templates and how you can
    move them around your work environment. Up to the point of this book, every part
    of PROC TEMPLATE used to create design and display templates will also be demonstrated
    in this chapter.


    # ## Appendix A: "Compatibility with Previous Versions of SAS",


    Appendix A provides a compatibility table of styles between different SAS versions.


    # ## Appendix B: "Color Values in SASIGRAP",


    Appendix B provides a list of color values for SASIGRAP that you might use in
    your reports.


    # ## Is Not Covered in This Book


    This book does not cover other types of SAS reports such as statistics and graphs,
    but those that are not tables. SAS has many other ways to create reports. There
    are many different types of template from the others. You do not need to master
    this if you are interested in creating report tables, which is the type of book.


    # ## Examples in This Book


    All of the examples in this book are made with SAS 9.2 and example in the book
    will run in SAS 9.2 or greater. Syntax differences are explained where needed.
    For example, "Compatibility with Previous Versions of SAS" is included in the
    book.


    # ## Typographical Conventions Used in This Book


    The following typographical conventions are used in this book:


    +   **Times**

    Roman is used for most text.

    *Italic* is used for a general term that should be replaced with a value. For
    example, *example* would mean that you should replace it with your own value.

    **Bold** highlights points of special importance, including bold text in code.
    **Bold—Distribution** means to select "This" or "Distribution".


    ![](img/f42c8ff43e199c1b82aa844e9d40e211_1_0.png)


    # ## Software Used to Develop This Book


    This book was developed using SAS 9.2 and the example in the book will run in
    SAS 9.2 or greater. Syntax differences are explained where needed. For example,
    "Compatibility with Previous Versions of SAS" is included in the book.


    # ## Data and Programs Used in This Book


    All example used data sets are in the SASHELP library that relate to this book.
    The code sets used in this book are available on the author page for this book
    at http://author.sas.com/


    # ## Output and Graphics Used in This Book


    Unlike other books, the content generated in this book was created using HTML
    and PDF so that you can view it in the way you prefer.


    # ## Author Page


    You can access the author''s page at http://author.sas.com/ to see all SAS books
    that this author has written. For features that interest you, look for the link
    here. The link on this cover image will lead you to a chapter, example code and
    data, reviews, updates, and more.


    # ## Example Code and Data


    You can examine the example code and data for this book by linking to it at the
    author''s page at http://author.sas.com/. Check the link here to view all the
    SAS programs that are included in this book.'
  merge: -1
