- pgno: 8
  md: "# Using Pre-Defined Styles\n\nIt may be safe to assume that SAS comes with\
    \ so few dozen pre-defined styles that are ready to use; the only thing you have\
    \ to do is apply one to ODS output to use the STYLE-option. An example of using\
    \ a pre-defined style with ODS HTML output is shown below.\n\n```\nODS HTML style=class;\n\
    \nPROC PRINT data=sasclass(class=R);\nRUN;\n\nODS HTML CLOSE;\n```\n\nHere is\
    \ another example using SAS with PDF output.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_8_0.png)\n\
    \nFind answers on the fly, or master something. Subscribe today. [Pricing options].\n\
    \n```\nPROC PRINT data=sasclass(class=R);\nRUN;\n\nODS PDF CLOSE;\n```\n\n# Where\
    \ Are These Styles Coming from?\n\nYou might be wondering where the STYLES.SEASEDE\
    \ and STYLES.JOURNAL are stored, as well as any other style names. To find out\
    \ how to access them, the PROC TEMPLATE has a list to help you out all of the\
    \ templates on your system. The code below lists all of the templates in the styles\
    \ folder.\n\n```\nPROC TEMPLATE;\nLIST _all;\nRUN;\n```\n\nExecuting the code\
    \ above will generate a list looking something like the following:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_8_1.png)\n\
    \nIf you wanted to see what style looks like in other ODS output, you could try\
    \ looking through the ODS file for each one of them. This would be very tedious\
    \ and inefficient for learning. Luckily, SAS has a wonderful tool that can decode\
    \ the markup language to help you understand it. You can open any ODS output file\
    \ in a web browser and view it as HTML, just like any other page. If you click\
    \ on any item in the list above, you'll see the entry in \"Template\". These are\
    \ intended for templates.\n\nIf you wanted to see what style looks like in other\
    \ ODS output, you could try looking through the ODS file for each one of them.\
    \ This would be very tedious and inefficient for learning. Luckily, SAS has a\
    \ wonderful tool that can decode the markup language to help you understand it.\
    \ You can open any ODS output file in a web browser and view it as HTML, just\
    \ like any other page. If you click on any item in the list above, you'll see\
    \ the entry in \"Template\". These are intended for templates.\n\n```\nODS HTML\
    \ style=style.html;\n\nPROC PRINT data=sasclass;\n  CLASS class;\n  STYLEHTML=style;\n\
    RUN;\n\nODS HTML CLOSE;\n\nODS PDF style=style.html;\n\nPROC PRINT data=sasclass;\n\
    \  CLASS class;\n  STYLEPDF=style;\nRUN;\n\nODS PDF CLOSE;\n\nPROC TEMPLATE;\n\
    \  DEFINE style=;\n    <HTML>\n      <HEAD>\n        <style>\n          .class-style\
    \ {\n            font-family: Arial;\n            font-size: 12pt;\n         \
    \   color: #000;\n          }\n        </style>\n      </HEAD>\n      <body>\n\
    \      <div class=\"class-style\">\n        %body%\n      </div>\n      </body>\n\
    \    </HTML>\n  END;\nEND PROC TEMPLATE;\n```\n\nWhile we can't put a working\
    \ example of the code above into the printed pages of this book, the screenshot\
    \ of styles help below."
  merge: -1
  img_proc: true
- pgno: 9
  md: "# # Driving Behavior Analysis\n\nIn this paper we present a new method for\
    \ analyzing the driving behavior of human drivers. The method is based on the\
    \ braking, acceleration, and steering commands. We evaluate the method using two\
    \ different datasets. \n\nKeywords: driving behavior, human driving analysis,\
    \ self-driving, machine learning\n\n1. Introduction\n\nThe development of autonomous\
    \ vehicles has become a hot topic in recent years. However, a large number of\
    \ traffic accidents are caused by human errors. Therefore, it is necessary to\
    \ analyze human driving behavior to improve traffic safety. In this paper, we\
    \ propose a method to analyze human driving behavior.\n\nDriving behavior can\
    \ be characterized by various factors including steering, acceleration, and braking.\
    \ In this paper, we focus on the braking, acceleration, and steering commands\
    \ to identify different types of driving behavior, such as normal, aggressive\
    \ and aggressive driving.\n\nWe evaluate the method using two different datasets.\
    \ The first dataset is collected from real driving vehicles, and the second dataset\
    \ is collected from a driving simulator.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_9_0.png)\n\
    \nFigure 1 Overview of the proposed driving behavior analysis framework\n\nThe\
    \ proposed method consists of three steps: data preprocessing, feature extraction,\
    \ and behavior classification. In the first step, the raw data is processed to\
    \ remove noise and normalize values.\n\nIn the second step, features are extracted\
    \ from the preprocessed data. We use statistical features and time-series-based\
    \ features. In the third step, the extracted features are used to classify the\
    \ driving behavior using a machine learning model.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_9_1.png)\n\
    \nFigure 2 Comparison of acceleration data for different driving behaviors (a)\
    \ Normal (b) Aggressive driving\n\n2. Datasets\n\nWe use two datasets for our\
    \ experiments. The first dataset is collected from 20 human drivers in a real\
    \ environment. The data includes steering angle, speed, acceleration, and braking\
    \ pressure.\n\nThe second dataset is collected from a driving simulator where\
    \ 50 participants were asked to drive in various scenarios. The data includes\
    \ the same features as the first dataset.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_9_2.png)\n\
    \nFigure 3 Feature distribution of the first dataset\n\n3. Proposed Method\n\n\
    The proposed method consists of three steps: data preprocessing, feature extraction,\
    \ and behavior classification.\n\n3.1 Data Preprocessing. The raw data often contains\
    \ noise. We use a low-pass filter to smooth the data. Additionally, we normalize\
    \ the data to the range [0, 1].\n\n3.2 Feature Extraction. We extract various\
    \ features from the preprocessed data. These include statistical features such\
    \ as mean, variance, and standard deviation. We also extract time-series-based\
    \ features such as peak and frequency.\n\n3.3 Behavior Classification. We use\
    \ a Random Forest classifier to classify the driving behavior. The model is trained\
    \ using the extracted features and evaluated on a test set."
  merge: -1
  img_proc: true
- pgno: 10
  md: "# # Styles-And Overriding\n\nStyle Overriding, or 'style layering', means that\
    \ a style in a report is overridden by another style that is applied later. The\
    \ following example shows a sample of what you can do with overriding styles.\n\
    \nThis example changes the color of data cells in the table without using cell-level\
    \ attributes. This is made possible because any style applied later will override\
    \ a style applied earlier.\n\nAll traffic cells applied using 'traffic' style\
    \ is a way to change the appearance of all traffic cells at once, without having\
    \ to style each cell individually.\n\n```\n```javascript\nvar traffic = {\n  color:\
    \ 'red';\n};\n```\n```\n\nStyle overriding consists of two parts: the style name\
    \ (applied) and the style attributes (overridden). The example below shows how\
    \ these parts of the style work together.\n\n```\n```javascript\nvar traffic =\
    \ {\n  name: 'traffic';\n};\n```\n```\n\nBy using a style name that is already\
    \ defined in the theme, the default styles are overridden. You can use any style\
    \ name for your purpose. This is a good way to override styles in your report\
    \ without having to define a new style.\n\nWhen you want to override a style in\
    \ your report, you can look at this sample table example to demonstrate overriding\
    \ styles. The example below demonstrates overriding styles.\n\n```\n```javascript\n\
    var traffic = {\n  name: 'traffic';\n  color: 'red';\n};\n```\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_10_0.png)\n\
    \n| | | | | | |\n|---|---|---|---|---|-|\n| Jan | 10 | 20 | 30 | 40 | |\n| Feb\
    \ | 20 | 30 | 40 | 50 | |\n| Mar | 30 | 40 | 50 | 60 | |\n| Apr | 40 | 50 | 60\
    \ | 70 | |\n| May | 50 | 60 | 70 | 80 | |\n| Jun | 60 | 70 | 80 | 90 | |\n\nStyle\
    \ overrides are more interesting than static cells. In this example, we applied\
    \ a style to data cells. The table template was used for the overall style. For\
    \ now, we used a different template for the data cells in order to easily compare\
    \ the values of the same name.\n\nHere is the output from the example above. Note\
    \ the header and the table that are still in the default style. The content of\
    \ the data cells was changed by the override style.\n\nWe can also create this\
    \ report by using a new element with the style attributes used above, which means\
    \ adding a new template. For example, we use a different template instead of the\
    \ previous example. Then we add a new style template with the element attributes.\n\
    \n```\n```javascript\nvar traffic = {\n  name: 'traffic';\n  color: 'red';\n};\n\
    ```\n```\n\nNow the table from the previous example must be modified to follow\
    \ the header style. We also need to specify this new style template on the DOM.\n\
    \n```\n```javascript\nvar traffic = {\n  name: 'traffic';\n  color: 'red';\n};\n\
    ```\n```\n\nHere is the output:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_10_1.png)\n\
    \nUsing this method in this manner allows us to control all the traffic cells\
    \ in the report. If we want to change the appearance of all the cells in the override,\
    \ we only have to do it in one place. If we don't have the traffic attribute,\
    \ we would have to style all the cells in the report individually. See the next\
    \ section for dynamic attributes.\n\n# # Dynamic-Style Attributes\n\nDynamic attributes\
    \ are values of a style that are not specified in the cell. For example, the color\
    \ of a cell can depend on the value of the cell at that moment."
  merge: -1
  img_proc: true
