- pgno: 19
  md: '# Table Attributes


    Table attributes are used to affect the behavior of the table itself, as well
    as some header and column behaviors, many of the attributes are Listing-specific
    and will not be discussed here. A complete list of attributes can be found in
    the SAS 9.3 ODS Delivery System: User''s Guide, Second Edition.


    **BYLINE-ON | OFF**


    specifies whether or not to print the byline before the table.


    **CLASSLEVELSON | OFF**


    specifies whether or not to enable the BLANK, DUPS= attribute on a column if the
    previous column also has BLANK, DUPS= enabled and its value changed in the current
    row.


    **CONTENTS-ON | OFF**


    specifies whether or not to put the table in the table of contents.


    **CONTENTS_LABEL="string"**


    Find answers on the fly, look or master something new. See pricing options.


    **DATA_FORMAT_OVERRIDE=ON | OFF**


    specifies whether or not the format from the data column should take precedence
    over the format in the template.


    **LABEL="string"**


    specifies a label for the table. If no label is provided, the label from the data
    set will be used. If it does not have a label, the text of the first table header
    is used.


    **NEWPAGE=ON | OFF**


    specifies whether or not to force a page break before the table.


    **ORDER_DATA=ON | OFF**


    specifies whether or not the order of the columns in the data set override the
    order of the columns specified in the template.


    **PARENT="table-path"**


    specifies a table definition to inherit from. Inheritance will be discussed later
    in this chapter.


    **PRINT_FOOTERS=ON | OFF**


    specifies whether or not to print the table footers.


    **PRINT_HEADERS=ON | OFF**


    specifies whether or not to print the table headers.


    **STYLE="style-override"**


    specifies a style to apply to the header. Style overrides are discussed in "Style
    Overrides and Conditional Formatting" in Chapter 2.


    **USE_FORMAT_DEFAULTS=ON | OFF**


    specifies whether or not the width and number of decimals should be taken from
    the default values for the format name rather than the template.


    **USER_NAME=ON | OFF**


    specifies the column name as the header if neither the column definition nor the
    data set specifies one.


    Just as we have columns, headers, and footers, tables also support a NOTES statement
    that enables us to store a comment with the table that describes what the table
    is for. It is possible to have attribute values dynamically set at runtime rather
    than compile time. This is not as useful when you are using the PROC ODSTABLE
    condition to generate tables, but it can be quite useful when you are creating
    reusable table templates using PROC TEMPLATE.


    While we have only each attribute with explicit values here, it is possible to
    change various aspects of behavior, the look and feel defined by the overall style.
    It is possible to override style attributes within the table frame templates,
    and even do traffic lighting based on data. These techniques are discussed in
    the following section.'
  merge: -1
  img_proc: true
- pgno: 20
  md: "# Style-Override and Tracking\n\nWe have learned some examples of how to override\
    \ style and track back in CSS. Now, let's look at what is needed in order to apply\
    \ style overrides and track back to selectors.\n\nJust as a reminder, here is\
    \ the general form for setting up an override:\n\n```\n```css\n.selector {\n \
    \ color: red;\n}\n```\n```\n\nYou might have not known while reading this chapter\
    \ that all the attributes for tables can be overridden. However, it's only possible\
    \ for style overrides. Let's start with setting up a table:\n\n```\n```css\n.selector\
    \ {\n  color: blue;\n}\n```\n```\n\nStyle on the table is also not that interesting\
    \ because there aren't many styles that apply to tables. Now let's move on to\
    \ how to apply style to headers and footers. Let's create a table header and footer\
    \ colors on them:\n\n```\n```css\nthead {\n  background-color: yellow;\n}\ntfoot\
    \ {\n  background-color: blue;\n}\n```\n```\n\nHere is the output from the code:\n\
    \n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_0.png)\n\nNow header and footer\
    \ each have some type of columns, you can also change the styles on each individual\
    \ column using the exact name. For example:\n\n```\n```css\ntcol:nth-child(1)\
    \ {\n  color: red;\n}\ntcol:nth-child(2) {\n  color: green;\n}\n```\n```\n\nHere\
    \ is the output from the code:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_1.png)\n\
    \nWith headers and a few more tricks, we can override style systems on rows and\
    \ tables, but they also have some ways to override style based on the position.\
    \ For example:\n\n```\n```css\ntrow:nth-child(even) {\n  background-color: gray;\n\
    }\ntrow:nth-child(odd) {\n  background-color: white;\n}\n```\n```\n\nHere is the\
    \ output from the above code:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_2.png)\n\
    \nNo-more there, now that we have some data, we can also add some interesting\
    \ lighting effects. You have already seen some techniques using FASCET, SVETCH,\
    \ and SVETLINE. Now let's learn how to use SVETLINE to highlight the sections.\
    \ By using these techniques tracking with SVETLINE, you can make your tables even\
    \ more powerful with the CELLYST alignment.\n\n# The CELLYST Alignment\n\nIn the\
    \ example below, on the left where the row and column headers are highlighted,\
    \ and on the right where the expression is evaluated in order with the CELLYST\
    \ alignment. The variables and dimension variables can be defined in the expression\
    \ (which we use with question mark). If we want to define multiple variables that\
    \ are used in a range, we can use square brackets. For example:\n\n```\n```css\n\
    tcol:nth-child(1-3) {\n  color: red;\n}\n```\n```\n\nHere is the output from the\
    \ above code:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_3.png)\n\n| Name\
    \ | Description |\n| --- | --- |\n| _col_ | column number starting with 1 |\n\
    | _dim_ | dimension of the current column |\n| _row_ | row number starting with\
    \ 1 |\n| _stk_ | style element name |\n| _val_ | data value |"
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Using Table Templates in MySQL\n\nUsing Table Templates allows you to create\
    \ tables that are just like any other. The generated table structure is based\
    \ on the definition in the TEMPLATE table. You can use the TEMPLATE table to create\
    \ many different tables with the same structure.\n\nTo create a table from a template,\
    \ use the CREATE_TABLE procedure and specify the output table name.\n\nHere is\
    \ an example of code:\n\n```\nCALL CREATE_TABLE('output_table', 'template_name');\n\
    ```\n\nNow you can insert data into your table using the INSERT_DATA procedure\
    \ and specify the output table name. The following code is an example of the call:\n\
    \n```\nCALL INSERT_DATA('output_table', 'value1', 'value2', 'value3');\n```\n\n\
    You can select data from your table using the SELECT statement and specify the\
    \ output table name.\n\n```\nSELECT * FROM output_table;\n```\n\nThe main benefit\
    \ of using templates is that you don't have to create the same structure over\
    \ and over again. You can use one template to create many tables with the same\
    \ structure.\n\nTo create a template, use the CREATE_TEMPLATE procedure.\n\n```\n\
    CALL CREATE_TEMPLATE('template_name', 'CREATE TABLE output_table (\n  column1\
    \ INT,\n  column2 INT,\n  column3 VARCHAR(50),\n  column4 VARCHAR(50)\n);');\n\
    ```\n\nHere is an example of code:\n\n```\nCALL CREATE_TEMPLATE('template_name',\
    \ 'CREATE TABLE output_table (\n  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n\
    \  column4 VARCHAR(50)\n);');\n```\n\nUsing the template name, the code above\
    \ can be executed:\n\nHere is the output:\n\n```\nCREATE TABLE output_table (\n\
    \  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n  column4 VARCHAR(50)\n\
    );\n```\n\nAnother use of the code above showing that two columns are redundant:\n\
    \nHere is the output:\n\n```\nCREATE TABLE output_table (\n  column1 INT,\n  column2\
    \ INT,\n  column3 VARCHAR(50),\n  column4 VARCHAR(50)\n);\n```\n\nUsing Variables\
    \ in Templates\n\nThis allows you to pass variables to the template so that you\
    \ can create a table with dynamic column names. This is useful when you need to\
    \ create many tables with slightly different column names.\n\nWhat this means\
    \ is that you can use the table template to create multiple representations of\
    \ the same data. For example, if you have a table with demographic data and you\
    \ want to create a table for each state, you can use the table template to do\
    \ this.\n\nHere is an example of code:\n\n```\nSET @table_name = 'output_table';\n\
    SET @column1 = 'column1';\nSET @column2 = 'column2';\nSET @column3 = 'column3';\n\
    SET @column4 = 'column4';\n\nCALL CREATE_TEMPLATE('template_name', CONCAT('CREATE\
    \ TABLE ', @table_name, ' (\n  ', @column1, ' INT,\n  ', @column2, ' INT,\n  ',\
    \ @column3, ' VARCHAR(50),\n  ', @column4, ' VARCHAR(50)\n);'));\n```\n\nHere\
    \ is the output:\n\n```\nCREATE TABLE output_table (\n  column1 INT,\n  column2\
    \ INT,\n  column3 VARCHAR(50),\n  column4 VARCHAR(50)\n);\n```\n\nNow you can\
    \ insert data into your table using the INSERT_DATA procedure and specify the\
    \ output table name.\n\n```\nCALL INSERT_DATA(@table_name, 'value1', 'value2',\
    \ 'value3');\n```\n\nYou can select data from your table using the SELECT statement\
    \ and specify the output table name.\n\n```\nSELECT * FROM @table_name;\n```\n\
    \nThe main benefit of using templates is that you don't have to create the same\
    \ structure over and over again.\n\nUsing Dynamic Columns\n\nThis allows you to\
    \ create a table with a dynamic number of columns. This is useful when you need\
    \ to create a table where the number of columns is not known.\n\nHere is an example\
    \ of code:\n\n```\nSET @table_name = 'output_table';\nSET @column1 = 'column1';\n\
    SET @column2 = 'column2';\nSET @column3 = 'column3';\nSET @column4 = 'column4';\n\
    SET @column5 = 'column5';\nSET @column6 = 'column6';\n\nCALL CREATE_TEMPLATE('template_name',\
    \ CONCAT('CREATE TABLE ', @table_name, ' (\n  ', @column1, ' INT,\n  ', @column2,\
    \ ' INT,\n  ', @column3, ' VARCHAR(50),\n  ', @column4, ' VARCHAR(50),\n  ', @column5,\
    \ ' VARCHAR(50),\n  ', @column6, ' VARCHAR(50)\n);'));\n```\n\nHere is the output:\n\
    \n```\nCREATE TABLE output_table (\n  column1 INT,\n  column2 INT,\n  column3\
    \ VARCHAR(50),\n  column4 VARCHAR(50),\n  column5 VARCHAR(50),\n  column6 VARCHAR(50)\n\
    );\n```"
  merge: -1
  img_proc: true
- pgno: 22
  md: "# Inheritance\n\nSince we've already discovered inheritance in PROC TEMPLATE;\
    \ this isn't exactly new. When a template (table, column, or header) inherits\
    \ from another, most of the attributes will be the same as the parent, but the\
    \ child template can override other attributes.\n\nHere is a template that we\
    \ like the look of the most part, but we want to change a few aspects of.\n\n\
    ```\nPROC TEMPLATE;\n  TEMPLATE data_template;\n    TABLE name=data;\n      COLUMN\
    \ name=age;\n      COLUMN name=first_name;\n        DEFINE age;\n        DEFINE\
    \ first_name;\n        DEFINE first_name;\n        HEADER = \"First Name\";\n\
    \      END;\nEND;\n```\n\nHere is the output it generates.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_22_0.png)\n\
    \nWe want to change the age columns and just have a format of , and we want to\
    \ add a column for the gender.\n\n```\nPROC TEMPLATE;\n  TEMPLATE data_template;\n\
    \    PARENT = data_template;\n    COLUMN age=age (format=,);\n      DEFINE age;\n\
    \    COLUMN gender=gender;\n      DEFINE gender;\n      HEADER = \"Gender\";\n\
    \  END;\nEND;\n```\n\nIn this case, we are inheriting all of the attributes from\
    \ the parent, but we also define the gender column.\n\nMerging all of the attributes\
    \ and columns of the tables creates the resulting table. The emphasized portions\
    \ are from the parent template.\n\n```\nPROC TEMPLATE;\n  TEMPLATE data_template;\n\
    \    COLUMN name=name;\n    CLASS class=class;\n    TABLE name=data SASHELP.CLASS(class=class);\n\
    \      DEFINE name;\n      DEFINE class;\n  END;\nEND;\n```\n\nHere is the output\
    \ when this table is produced using SASHELP.CLASS.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_22_1.png)\n\
    \nColumns, headers, and footers inherit in the exact same way, but they are not\
    \ actually stored. Columns can contain only attributes. Headers and footers can\
    \ only contain attributes.\n\nYou are not limited to inheriting in the same scope.\
    \ You can define a column inside a table and use it as a parent for another table.\
    \ You can share columns across tables using nested inheritance. For example, you\
    \ can define a column in one table and then use it as a column in another table.\n\
    \n```\nPROC TEMPLATE;\n  TEMPLATE class_stats;\n    STYLE = (font=bold);\n   \
    \ TABLE class=class;\n      COLUMN weight=weight;\n        DEFINE weight;\n  END;\n\
    END;\n```\n\nHere is the output.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_22_2.png)\n\
    \nWhile you see from above that inheritance was simple because they only had a\
    \ single level of package, the templates used by SAS procedures can be more tricky\
    \ to manage.\n\nIf you remember back to chapter 5, we mentioned that a template\
    \ can have multiple tables. But you can only inherit from one table at a time.\n\
    \n```\nPROC TEMPLATE;\n  TEMPLATE table_template;\n    TABLE data=data;\n    CLASS\
    \ class=class;\n    COLUMN weight=weight;\n      DEFINE weight;\n  END;\nEND;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 23
  md: "# # Variable Declaration\n\nVariables are containers used to store data values\
    \ that can be changed and used throughout the program. To declare a variable in\
    \ C#, you use the type followed by the variable name.\n\n```\n```csharp\\int age\
    \ = 25;\ndouble price = 19.99;\nstring name = \"John Doe\";\nbool isStudent =\
    \ true;\n```\n```\n\nThe example above shows four different types of variables:\
    \ int, double, string, and bool. Each type defines the kind of data the variable\
    \ can hold.\n\nVariables can also be declared without an initial value value.\
    \ This is useful when the value is determined later in the program.\n\n```\n```csharp\n\
    int count;\nCount = 10;\n```\n```\n\nThere are several ways to declare variables\
    \ in C#:\n\n+   - Single variable declaration\n- Multiple variable declaration\
    \ in one line\n- Declaring constants\n\nHere is an example of a single variable\
    \ declaration:\n\n```csharp\n```csharp\nint score = 100;\n```\n\nNow let's look\
    \ at how to declare multiple variables in one line:\n\n```\n```csharp\nint x =\
    \ 10, y = 20, z = 30;\n```\n```\n\nFinally, let's see how to declare constants.\
    \ Constants are variables whose the value cannot be changed once it is assigned.\n\
    \n```\n```csharp\nconst PI = 3.14159;\n```\n```\n\nVariables are often used in\
    \ tables. Here is a simple example:\n\n| Type | Description | Example |\n| ---\
    \ | --- | --- |\n| int | Stores whole numbers | 10 |\n| double | Stores decimal-point\
    \ numbers | 19.99 |\n| string | Stores text | \"Hello\" |\n| bool | Stores true\
    \ or false | true |\n\nAfter declaring a variable, you can use it in your code:\n\
    \n```\n```csharp\nint age = 25;\nConsole.WriteLine(age);\n```\n```\n\nYou can\
    \ also change the value of a variable like this:\n\n```\n```csharp\nint age =\
    \ 25;\nage = 26;\nConsole.WriteLine(age);\n```\n```\n\nVariables also have scopes.\
    \ The scope defines the region of the program where the variable is accessible.\n\
    \nThere are three types of scopes in C#: local, class, and global.\n\n+   - Local\
    \ variables: declared within a method or block.\n- Class variables: declared within\
    \ a class but outside any method.\n- Global variables: declared outside any class.\n\
    \nHere is an example of a local variable:\n\n```\n```csharp\nvoid MyMethod() {\n\
    \    int x = 5;\n    Console.WriteLine(x);\n}\n```\n```\n\nHere is an example\
    \ of a class variable:\n\n```\n```csharp\nclass MyClass {\n    int y = 10;\n \
    \   void MyMethod() {\n        Console.WriteLine(y);\n    }\n}\n```\n```\n\nHere\
    \ is an example of a global variable (note: C# doesn't have true global variables,\
    \ but static fields are used similarly):\n\n```\n```csharp\nclass MyClass {\n\
    \    static int z = 20;\n}\n```\n```\n\nIn summary, variables are essential for\
    \ storing and manipulating data in C#.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_23_0.png)"
  merge: -1
  img_proc: true
- pgno: 24
  md: "# # Putting All Together\n\nRather than just making one car, let's try to make\
    \ something little more complex. We will add different types and models of cars,\
    \ features like color, mileage, body type, wheels, price, and more. Let's start\
    \ with the car we've created so far:\n\n```\nclass Car:\n    def __init__(self,\
    \ make, model, color, mileage, body_type, wheels, price):\n        self.make =\
    \ make\n        self.model = model\n        self.color = color\n        self.mileage\
    \ = mileage\n        self.body_type = body_type\n        self.wheels = wheels\n\
    \        self.price = price\n```\n\nThis is the output from the code:\n\n```\n\
    car1 = Car(\\'Toyota', 'Corolla', 'white', 20000, 'sedan', 4, 20000)\n```\n\n\
    Now we will use the DataFrame to reduce the number of columns in our report. Let's\
    \ use the COLUMNS attribute for this:\n\n```\ndf = df[['make', 'model', 'color',\
    \ 'mileage', 'price']]\n```\n\nThis is what we have now:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_24_0.png)\n\
    \nLooking at the output, we see that we don't so many cars that we don't need\
    \ the weight of the car or the cost per hundred. Rather than adding another column\
    \ to show more, let's use the COLUMNS attribute to add the columns back into the\
    \ table.\n\nWe will use the COLUMNS attribute to add the columns we want to see:\n\
    \n```\ndf = df.COLUMNS(['weight', 'cost_per_100'])\n```\n\nThis is the output\
    \ now:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_24_1.png)\n\nNow we will use\
    \ the conditional formatting to highlight the columns. We also see that we can\
    \ use the PRESTSTYLE attribute to highlight cells based on a certain condition.\n\
    \nLet's highlight the price that is greater than 25000:\n\n```\nstyle = {\n  \
    \  'price': [{'bg_color': 'yellow', 'condition': lambda x: x > 25000}]\n}\ndf.style(style)\n\
    ```\n\nThis is the result:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_24_2.png)\n\
    \nNow we will change the condition on price. The picture looks a bit better but\
    \ it doesn't look so good when we take the price into account. The Porsche 911\
    \ doesn't look so good because its price is so high. Let's change the color of\
    \ the price that is greater than 50000.\n\nLet's highlight the price that is greater\
    \ than 50000:\n\n```\nstyle = {\n    'price': [{'bg_color': 'red', 'condition':\
    \ lambda x: x > 50000}]\n}\ndf.style(style)\n```\n\nThis is the result:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_24_3.png)\n\
    \nFinally, we have some ideas on how to use table formatting for your own data.\n\
    \n## Conclusion\n\nHere are the attributes used in creating the report: PRONT,\
    \ PRIC, REPORT, and TABLE_STYLE."
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Chapter 4: Template Management


    # Template Stores and the ODS Path


    # PROC TEMPLATE Statements


    # The DELETE Statement


    # The LINK Statement


    # The LIST Statement


    # The PATH Statement


    # The SOURCE Statement


    While most of this book is concerned with defining and using templates, PROC TEMPLATE
    also gives you additional tools to manage your templates. These tools aren''t
    much different than the utilities that you would use at a DOS prompt or UNIX shell
    to manage your files. PROC TEMPLATE has statements to list, display, and delete
    your templates. You can also link a template to another if you simply want to
    have two template names that do the same thing.


