- pgno: 3
  md: '# Chapter 1: Introduction


    # The Template Structure


    # Types of Templates


    # Data-Dependent Templates


    # Data-Independent Templates


    # Conclusion


    Fear of the unknown is the most common fear on the planet. PROC TEMPLATE is probably
    the second, at least for SAS users. We think both of these fears stem from the
    same source: the unknown. Once you understand PROC TEMPLATE and what it is not,
    it isn''t nearly as frightening. The biggest problem with understanding PROC TEMPLATE
    is realizing that it isn''t a procedure like PROC MEANS or PROC TABULATE that
    has one of statements and options to describe its behavior. PROC TEMPLATE is really
    a "wrapper" procedure that contains a common set of tools for template-based languages
    to use. These tools include things like defining a template template structure,
    persistence (and saving and restoring templates), and template store management¹.
    Beyond that, each template-based language has the freedom to define its statements
    and options in any way that it fits.


    Find answers on the fly, or master something. Subscribe today. [See pricing options].


    Or craft templates as you go along. With PROC TEMPLATE, you can do most of what
    you need in the Output Delivery System (ODS) without ever touching PROC TEMPLATE.
    However, there is no need to use PROC TEM if you truly want to master ODS and
    take advantage of all that it has to offer, PROC SAS is the way.


    There are literally thousands of templates built into SAS that control the structure
    of procedure templates, the layout of graphs, the style aspects of a report, and
    in some output types, the markup of the document itself. The great thing about
    templates is that they are user-editable. Even if a template is supplied by SAS
    for a particular purpose, if you want to change how a table or graph looks, you
    can modify your code of the template to behave the way you want. You can create
    new styles to coordinate with your company''s web site or logo. And you can change
    the way certain document types are rendered, or even create entirely new document
    types. These modified and created templates can be shared with other SAS users.


    If that wasn''t enough to convince you of PROC TEMPLATE''s power, it can also
    be used for reporting. There are templates (and helper procedures) to render custom
    tables and graphs. No other procedure gives you access to this ways of structuring
    your data.


    Now that you''re all hyped up about PROC TEMPLATE, let''s dive right in and look
    at the basic structure of all templates. While the purpose of templates can greatly
    from one to the next, the overall structure of them is very similar.'
  merge: -1
  img_proc: true
- pgno: 4
  md: "# The Template Structure\n\nRegardless of the objects and options for each\
    \ template language, they have all essentially defined by DEFINE. This structure\
    \ can be thought of as a simple bag of objects. Objects are key-value pairs associated\
    \ with an equal sign (=), where the name is on the left-side and the value is\
    \ on the right. Objects can contain other objects and options depending on what\
    \ is defined by the template language. Some templates allow nested objects which\
    \ can also contain nested objects. Other things can always be thought of as a\
    \ bag of unen own objects and options.\n\nLet's say we want a template to describe\
    \ a shopping cart of groceries. The shopping cart contains bags of groceries.\
    \ The items in the bag are individual objects that do not contain other objects.\n\
    \nA graphical representation of a typical shopping cart is shown below.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_4_0.png)\n\
    \nFirst answers on the Fig. 1 or something newer. Subscribe today. [See pricing\
    \ options](#)\n\nIn the image above, you see there are two bags of groceries in\
    \ the shopping cart. One bag has one item in it and the other bag has two items\
    \ in it. The diagram to the right is a block representation of the image. Now,\
    \ let's map the graphical representation of this shopping cart into PROC template.\n\
    \nAs mentioned previously, objects are defined by DEFINE and END statements. To\
    \ convert the graphical representation of the shopping cart into code, you just\
    \ have to use a \"DEFINE\" and \"END\" block for each type of the object to create.\
    \ The END statement completes the template. The DEFINE statement defines the type\
    \ of the object to create.\n\n```\nPROC TEMPLATE:\n\nDEFINE shopping_cart:\n \
    \ DEFINE bag:\n    DEFINE item;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE item;\n\
    \    END;\n  END;\n  DEFINE item;\n  END;\n  END;\n\nRUN;\n```\n\nThis is pretty\
    \ close to well-written PROC TEMPLATE code. The required pieces still missing\
    \ are associated with a name for each of the objects. In any template, DEFINE\
    \ statements must be associated. Names can consist of numbers, lists, and periods\
    \ (.), and must also be unique within a particular scope (the template, multiple\
    \ bags within a shopping cart first must have unique names within a bag). Adding\
    \ names to the code from above gives the following:\n\n```\nPROC TEMPLATE:\n\n\
    DEFINE SHOPPING_cart:\n\n  DEFINE bag:\n    DEFINE item milk;\n      QTY = 2;\n\
    \    END;\n  END;\n  DEFINE bag:\n    DEFINE item lettuce;\n    END;\n    DEFINE\
    \ item oranges;\n      TYPE = ORANGE;\n      QUANTITY = 10;\n    END;\n  END;\n\
    \n  END;\n\nRUN;\n```\n\nIf you have ever seen any real PROC TEMPLATE code, the\
    \ structure above is proving to look quite familiar. The only missing are options\
    \ and statements within the objects that affect each template's behavior. Let's\
    \ add some options to the grocery items to make this example complete.\n\n```\n\
    PROC TEMPLATE:\n\nDEFINE SHOPPING_cart:\n\n  DEFINE bag:\n    DEFINE item milk;\n\
    \      QTY = 2;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE item lettuce;\n \
    \   END;\n    DEFINE item oranges;\n      TYPE = ORANGE;\n      QUANTITY = 10;\n\
    \    END;\n  END;\n\n  END;\n```\n\nOf this course is purely hypothetical because\
    \ there is no such thing as a shopping cart that is structured. There is one additional\
    \ statement, but it will demonstrate how all templates are structured from objects,\
    \ options, and that statements.\n\n+   1. Templates are defined by DEFINE and\
    \ END statements.\n2. Objects are defined by DEFINE.\n3. Objects within a scope\
    \ must have unique names."
  merge: -1
  img_proc: true
- pgno: 5
  md: "# # Types of Templates\n\nThere are different types of templates available,\
    \ such as Table, Graph and Taglet. Each one does what it does. With that in mind,\
    \ the only rule of template design is to keep the data and use the template. Even\
    \ if there are independent templates, they can be broken down into smaller components.\n\
    \n+   - Templates that are mapped to data sets independent templates\n- Templates\
    \ that are not mapped to data sets independent templates\n\n# ## Data-Dependent\n\
    \nThe data-dependent templates include Table, Graph and Taglet templates. Each\
    \ of these uses data sets to generate the output.\n\n+   - Templates that output\
    \ on an observation-based basis.\n- Templates that output on entity basis.\n\n\
    Controlling the output of a template on an observation-based basis is much more\
    \ advanced than controlling the output of a template on entity basis because the\
    \ ODA data steps are difficult to understand. We will start with a complicated\
    \ set of templates that are easier to understand. The method is to define and\
    \ render the template. A example of a table is shown below.\n\n```\nPRINT:\n \
    \ template: table_class\nclass:\n  data: dataset_1\n```\n\nThe original code shows\
    \ how to use PRINT_CLASS to map a TABLECLASS into a table. You can also use PRINT\
    \ or PRINT_CLASS to do the same shown below.\n\n```\nPRINT:\n  template: table_class\n\
    class:\n  data: dataset_1\n  output: table_class\n```\n\nUsing this method, the\
    \ original code looks like this:\n\n```\nPRINT:\n  template: table_class\nclass:\n\
    \  data: dataset_1\n  output: table_class\n```\n\nThe only difference between\
    \ using PRINT_CLASS and PRINT_TEMPLATE/DATA_NULL is that the former will save\
    \ the template file to the disk for later. If you want to use the template without\
    \ saving it to the disk, use PRINT_NULL instead. You can also use PRINT_NULL to\
    \ store the templates in memory as needed.\n\n```\nPRINT_NULL:\n  template: table_class\n\
    data: dataset_1\n```\n\nHere is an example of a graph generated by TAGLET. The\
    \ templatelet that we used is:\n\n```\nGRAPH:\n  template: graph_class\nclass:\n\
    \  data: dataset_1\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_5_0.png)\n\
    \nGraphs are also very fast to interest your readers, so multiple SAS books appear\
    \ in point on the topic. So it is worth noting that, rather than that is the topic,\
    \ we'll refer to these to for a full explanation of that templatelet.\n\n# ##\
    \ Data-Independent Templates\n\nThe data-independent templates include Table templates\
    \ and Taglet templates. Each of these defines the output that is produced for\
    \ that ODA output type. Other of these template types use a data set to produce\
    \ data and output.\n\nBoth Table and Taglet templates are addressed by the global\
    \ ODA statement. You can tell ODA to use the template with the 'STYLE=' option.\n\
    \nWhile tags are a type of templates, they can also be considered a programming\
    \ language. The Taglet defines the markup of the output created, which includes\
    \ HTML, XML, JSON, PDF, etc. You can use a Taglet that defines field codes, MQ,\
    \ or even another Taglet.\n\nTaglet templates are responsible for generating the\
    \ layout, which in most cases, is created by HTML. Taglet templates are not containing\
    \ anything that you would normally need to display. However, the rendered output\
    \ of the taglet is shown below.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_5_1.png)\n\
    \nYou may have noticed that the ODA statement was used to invoke the HTML Taglet.\
    \ This is actually a short part in the taglet code. The more general way of invoking\
    \ a taglet is to use its full as follows:"
