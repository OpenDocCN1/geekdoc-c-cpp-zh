    structure, you should have a better understanding of PROC TEMPLATE at a high level.
    The following chapters will delve more deeply into table templates, style templates,
    and template management. Finally, the appendices contain very valuable information
    about compatibility between versions of SAS, a visual style attribute reference,
    and a table of SAS/GRAPH colors that can be used in PROC TEMPLATE styles. So let''s
    move on to some more concrete subject material.


    # (Endpoints)


