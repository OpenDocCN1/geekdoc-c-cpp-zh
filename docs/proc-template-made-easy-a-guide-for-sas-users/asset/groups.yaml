  - "[PAGE 4]\n\n# The Template Structure\n\nRegardless of the objects and options\
    \ for each template language, they have all essentially defined by DEFINE. This\
    \ structure can be thought of as a simple bag of objects. Objects are key-value\
    \ pairs associated with an equal sign (=), where the name is on the left-side\
    \ and the value is on the right. Objects can contain other objects and options\
    \ depending on what is defined by the template language. Some templates allow\
    \ nested objects which can also contain nested objects. Other things can always\
    \ be thought of as a bag of unen own objects and options.\n\nLet's say we want\
    \ a template to describe a shopping cart of groceries. The shopping cart contains\
    \ bags of groceries. The items in the bag are individual objects that do not contain\
    \ other objects.\n\nA graphical representation of a typical shopping cart is shown\
    \ below.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_4_0.png)\n\nFirst answers\
    \ on the Fig. 1 or something newer. Subscribe today. [See pricing options](#)\n\
    \nIn the image above, you see there are two bags of groceries in the shopping\
    \ cart. One bag has one item in it and the other bag has two items in it. The\
    \ diagram to the right is a block representation of the image. Now, let's map\
    \ the graphical representation of this shopping cart into PROC template.\n\nAs\
    \ mentioned previously, objects are defined by DEFINE and END statements. To convert\
    \ the graphical representation of the shopping cart into code, you just have to\
    \ use a \"DEFINE\" and \"END\" block for each type of the object to create. The\
    \ END statement completes the template. The DEFINE statement defines the type\
    \ of the object to create.\n\n```\nPROC TEMPLATE:\n\nDEFINE shopping_cart:\n \
    \ DEFINE bag:\n    DEFINE item;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE item;\n\
    \    END;\n  END;\n  DEFINE item;\n  END;\n  END;\n\nRUN;\n```\n\nThis is pretty\
    \ close to well-written PROC TEMPLATE code. The required pieces still missing\
    \ are associated with a name for each of the objects. In any template, DEFINE\
    \ statements must be associated. Names can consist of numbers, lists, and periods\
    \ (.), and must also be unique within a particular scope (the template, multiple\
    \ bags within a shopping cart first must have unique names within a bag). Adding\
    \ names to the code from above gives the following:\n\n```\nPROC TEMPLATE:\n\n\
    DEFINE SHOPPING_cart:\n\n  DEFINE bag:\n    DEFINE item milk;\n      QTY = 2;\n\
    \    END;\n  END;\n  DEFINE bag:\n    DEFINE item lettuce;\n    END;\n    DEFINE\
    \ item oranges;\n      TYPE = ORANGE;\n      QUANTITY = 10;\n    END;\n  END;\n\
    \n  END;\n\nRUN;\n```\n\nIf you have ever seen any real PROC TEMPLATE code, the\
    \ structure above is proving to look quite familiar. The only missing are options\
    \ and statements within the objects that affect each template's behavior. Let's\
    \ add some options to the grocery items to make this example complete.\n\n```\n\
    PROC TEMPLATE:\n\nDEFINE SHOPPING_cart:\n\n  DEFINE bag:\n    DEFINE item milk;\n\
    \      QTY = 2;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE item lettuce;\n \
    \   END;\n    DEFINE item oranges;\n      TYPE = ORANGE;\n      QUANTITY = 10;\n\
    \    END;\n  END;\n\n  END;\n```\n\nOf this course is purely hypothetical because\
    \ there is no such thing as a shopping cart that is structured. There is one additional\
    \ statement, but it will demonstrate how all templates are structured from objects,\
    \ options, and that statements.\n\n+   1. Templates are defined by DEFINE and\
    \ END statements.\n2. Objects are defined by DEFINE.\n3. Objects within a scope\
    \ must have unique names."
  - "[PAGE 5]\n\n# # Types of Templates\n\nThere are different types of templates\
    \ available, such as Table, Graph and Taglet. Each one does what it does. With\
    \ that in mind, the only rule of template design is to keep the data and use the\
    \ template. Even if there are independent templates, they can be broken down into\
    \ smaller components.\n\n+   - Templates that are mapped to data sets independent\
    \ templates\n- Templates that are not mapped to data sets independent templates\n\
    \n# ## Data-Dependent\n\nThe data-dependent templates include Table, Graph and\
    \ Taglet templates. Each of these uses data sets to generate the output.\n\n+\
    \   - Templates that output on an observation-based basis.\n- Templates that output\
    \ on entity basis.\n\nControlling the output of a template on an observation-based\
    \ basis is much more advanced than controlling the output of a template on entity\
