    \n### 样式属性名称的更改\n\n### 同时定义多个元素\n\n### 继承\n\n### CLASS 语句\n\n书中的示例旨在尽可能适用于许多版本的\
    \ SAS。某些存储过程和属性在 SAS 9.3 之前不可用，且 SAS 9.2 与之前的版本之间存在差异。可以通过一些变通方法使书中的示例适用于其他版本。这些方法在此处列出。\n\
    \n## 运行 PROC TEMPLATE 示例\n\n虽然书中的示例适用于许多 SAS 版本，但如果你使用的是 SAS 9.3，可以简化大部分示例。我们提到过\
    \ SAS 9.3 增加了 PROC ODTABLE，它将编译模板和将其绑定到数据集步骤合并为了了一个步骤。以下代码段本质上是等：\n\n```\n/* 使用\
    \ PROC TEMPLATE */\nPROC TEMPLATE;\nDEFINE TABLE mytable;\nCOLUMN name age height;\n\
    END;\nRUN;\n\n%render(mytable, sashepclass);\n```\n\n```\n/* 使用 PROC ODTABLE */\n\
    PROC ODTABLE DATA = sashepclass;\nCOLUMN name age height;\nRUN;\n```\n\n上述两种方法的主要区别在于，在\
    \ PROC TEMPLATE 代码中，表模板将保留在磁盘上，而 PROC ODTABLE 创建的临时表定义在表格渲染后就会被丢弃。\n\nNAME 选项。以下代码段提供了等效的行为：\n\
    \n```\n/* 使用 PROC TEMPLATE */\nPROC TEMPLATE;\nDEFINE TABLE mytable;\nCOLUMN name\
    \ age height;\nEND;\nRUN;\n```\n\n```\n/* 使用 PROC ODTABLE */\nPROC ODTABLE NAME\
    \ = mytable;\nCOLUMN name age height;\nRUN;\n```\n\n# Styles\n\nPROC TEMPLATE\
    \ 元素在 SAS 9.2 中发生了变化。许多更改被类似于以前版本那样的简单代码所取代。SAS 9.2 中对 PROC TEMPLATE 属性的更改允许与\
    \ CSS 属性名称保持一致，具备了同时创建多个样式元素的能力，并增加了 CSS 样式而非 PROC TEMPLATE 属性，尽管为了兼容 9.2 之前的版本，并非所有示例都已完成。\n\
    \n# 使用样式表 (CSS)\n\n直到 SAS 9.2 才引入了 CSS 支持。这是一个全新的功能，因此没有方法可以模拟这种行为。现在你可以使用 SAS\
    \ Enterprise Guide 样式编辑器创建适用于 ODS 输出类型的样式。\n\n| background | background/color\
    \ |\n| bottommargin | marginbottom |\n| bullet | liststyle |\n| cellheight | height\
    \ |\n| cellwidth | width |\n| font_face | fontFamily |\n| font_size | fontsize\
    \ |\n| font_style | style |\n| font_weight | fontweight |\n| font_width | fontwidth\
    \ |\n| foreground | color |\n| htmclass | class |\n| htmcontentype | contentype\
    \ |\n| htdctype | doctype |\n| indent | textindent |\n| just | textalign |\n|\
    \ leftmargin | marginleft |\n| fontweight | height |\n| outpwidth | width |\n\
    | rightmargin | marginright |\n| topmargin | margintop |\n| valign | verticalalign\
    \ |\n\n"
