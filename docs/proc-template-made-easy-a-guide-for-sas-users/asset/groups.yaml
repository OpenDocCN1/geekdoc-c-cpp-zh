  - '[PAGE 12]


    # Inline Formatting


    In addition to being able to style tables, cells, and other parts of a report,
    it is possible to put formatting within strings. Maybe rather than having an entire
    data cell be one color, the color of the characters and values within the cell
    to be formatted independently. This is ODS inline formatting. Luckily for us,
    the default format "style" can be easily changed to "Proc style", so we already
    know how to apply style attributes and element. We also need to know how to apply
    the style to the string that we have formatted differently. The general syntax
    for applying a style within a string is


    ```

    ods-escapechar=style-override;

    ```


    where *escapechar* is the special character used by the ODSESCAPECHAR statement,
    *style-override* is the style that we want to apply to, and the text is the text
    we want to format. Before we go any further, we should explain the ODS escape
    character. The ODS escape character is a special character used by the user to
    ODS to insert an inline function. In this case the function is called "style".
    The only condition of the escape is that the escape character doesn''t occur in
    the data itself. If the report contains the character, ODS will try to process
    the text that follows as an inline function. The ODS escape character must be
    defined once using the ODSESCAPECHAR statement.


    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    > **


    In this case, the character that will invoke inline functions is the caret (*).
    To turn the ODS escape character off, use the


    ```

    ODS ESCAPECHAR='''';

    ```


    The first character after the caret must be an open curly brace ({). The first
    character after the curly brace is the function name and all up until the matching
    curly brace (}) are arguments to the function. In the case of the style function,
    the arguments are the style override and the text to format. Let''s look at a
    simple example of using inline formatting in a style title. First, you have use
    an escape character that will indicate the beginning of an inline function. In
    this case, we are going to underline the word "word".


    ```

    ODS ESCAPECHAR=''*''

    TITLE "*{style=underline}word}* is underlined"

    PROC PRINT DATA=sashelp.class(OBS=2);

    RUN;

    ```


    The output from the code above:


    This word is underlined


    | Name | Sex | Age | Weight | Height |

    |---|---|---|---|---||

    | Alice | F | 31 | 59.0 | 63.1 |

    | Bob | M | 35 | 70.0 | 74.2 |


    With all other styles, you can also use element names. Here is an example that
    uses the row header element instead of explicitly specified style attributes.
    Then we use the style inline function to apply the style to title.


    ```

    ODS ESCAPECHAR=''*''

    TITLE "*{style=rowheader}word}* looks like a row header"

    PROC DATA=sashelp.class(OBS=2);

    RUN;

    ```


    The output is shown below.


    This word looks like a row header


    | Name | Sex | Age | Weight | Height |

    |---|---|---|---|---||

    | Alice | F | 31 | 59.0 | 63.1 |

    | Bob | M | 35 | 70.0 | 74.2 |


    Inline formatting will work on any string that goes through ODS, headers, titles
    and data cells. You just need to use the ODS escape character and put in the inline
    style function. Here is an example of using an style override to make all decimal
    places in the format header column.


    ```

    ODS ESCAPECHAR=''*''

    PROC TEMPLATE Made Easy

    DEFINE table=mytable

    COMPUTE __=(weight/100)**{style=FONT_SIZE=6pt}*;

    FORMAT _=8.2;

    JUST=RIGHT;

    END;

    RUN;


    tender(mytable,sashelp.class(OBS=5));

    ```


    Here is the output:


    | Name | Sex | Age | Weight | Height |

    |---|---|---|---|---||

    | Alice | F | 31 | 59.0 | 63.1 |

    | Bob | M | 35 | 70.0 | 74.2 |

    | Charlie | M | 26 | 69.0 | 70.2 |

    | David | M | 28 | 63.5 | 69.0 |

    | Edward | M | 34 | 63.0 | 69.0 |


    To summarize, we used a computed column and a Perl expression to create a new
    data value for the header that included an inline function. We won''t get into
    detail on exactly where this is but how this computed column is just converting
    values like ''69.0'' into ''69.00''. (style) ODS then takes that data value and
    applies the inline formatting to get the result you see in the screen shot.'
