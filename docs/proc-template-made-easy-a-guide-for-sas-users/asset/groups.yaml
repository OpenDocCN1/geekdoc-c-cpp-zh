  md: "\n# The Template Structure\n\nRegardless of the objects and options for each\
    \ template language, they have all essentially defined by DEFINE. This structure\
    \ can be thought of as a simple bag of objects. Objects are key-value pairs associated\
    \ with an equal sign (=), where the name is on the left-side and the value is\
    \ on the right. Objects can contain other objects and options depending on what\
    \ is defined by the template language. Some templates allow nested objects which\
    \ can also contain nested objects. Other things can always be thought of as a\
    \ bag of unique objects and options.\n\nLet's say we want a template to describe\
    \ a shopping cart of groceries. The shopping cart contains bags of groceries.\
    \ The items in the bag are individual objects that do not contain other objects.\n\
