    options.


    # Modifying SAS Procedure Tables


    # The PROC FREQ Crosstabulation Table


    # Putting It All Together


    Although many people don''t realize it, almost all tabular output generated by
    SAS is created using a table template. Table templates describe what columns,
    headers, and footers should appear in the table. They can also contain style overrides
    to specify extra style information. In addition, there are many ways to create
    new columns based on columns in the existing data set. Because SAS generates tables
    using table templates, you can modify the output of procedures by editing the
    table templates that the procedures use. But the real power of table templates
    is in writing your own from scratch to create tables that aren''t possible to
    create any of the reporting procedures.


    In this chapter, we will show you how to create your own table templates, how
    to customize styles and traffic lighting, and how to modify the table templates
    used by SAS procedures.'
  - "[PAGE 15]\n\n# Defining a Table\n\nYou have already seen how to render some simple\
    \ tables, but now let's learn the method to define them. The first method we used\
    \ for all of SAS is not very flexible when we want to create the output table.\n\
    \n```\nPROC TEMPLATE;\nDEFINE TABLE matlab;\n  LAYOUT _PAGE_(nobs=100);\n    FILE\
    \ TEMPLATE=\"mytable\";\n  END;\nRUN;\n```\n\nHere is the output from the code\
    \ above.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_0.png)\n\nThe DATA statement\
    \ has not changed much in this chapter, but we can simplify this method using\
    \ a macro. One of the macros we will define is DEFINE_TABLE, which automates the\
    \ table code shown above. We will be using this macro to bind this chapter of\
    \ data sets to tables.\n\n```\n%PROC TEMPLATE;\nDEFINE TABLE %&tablename;\n  LAYOUT\
    \ _PAGE_(nobs=100);\n    FILE TEMPLATE=\"%&tablename%\";\n  END;\nRUN;\n```\n\n\
    Here is the example using the macro in the code for DEFINE_TABLE.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_1.png)\n\
    \nIf you are using SAS 9.4, you can use the convenience PROC OTABLE, which handles\
    \ the definition of the table and data set to the table template. The example\
    \ is shown using PROC OTABLE below.\n\n```\nPROC OTABLE data=mytset template=mytable;\n\
    ```\n\nWhen you use PROC OTABLE, all columns in your data set will be displayed\
    \ in the table. You can control which columns are displayed by using the COLUMN\
    \ statement. This works just like the COLUMN statement in PROC REPORT.\n\n```\n\
    PROC OTABLE data=mytset template=mytable;\n  COLUMN name age weight;\nRUN;\n```\n\
    \nHere is the output when you use the COLUMN statement.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_2.png)\n\
    \nIf you have many columns in your data set they can be expressed using the notation\
    \ (e.g., all-*), you can use that notation in the COLUMN statement as well.\n\n\
    ```\nPROC OTABLE data=mytset;\n  COLUMN all-*;\nRUN;\n```\n\nThe COLUMN statement\
    \ is more advanced than that. For example you can stack values on top of each\
    \ other by grouping the columns in parentheses. The stacked statement will have\
    \ the header, weight and weight on top of each other in the same cell.\n\n```\n\
    PROC OTABLE data=mytset;\n  COLUMN (name age weight);\nRUN;\n```\n\nThe output\
    \ is shown below.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_3.png)\n\nYou\
    \ might have noticed that the header for the stacked columns only contains Age.\
    \ The variable that is on the top of the stacked columns what the header is. However,\
    \ you can change the header too. That technique is discussed later in chapter.\n\
    \nYou can combine this stacked feature with the list feature too.\n\nHere is the\
    \ output from the previous code.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_4.png)\n\
    \nAnother way to stack is so that the output table looks like a report with a\
    \ line break after the COLUMN statement. In that way you group the columns together\
    \ and then stack them on top of each other using an asterisk (*). The following\
    \ code stacks the columns horizontally over weight.\n\n```\nPROC OTABLE data=mytset;\n\
    \  COLUMN name * age weight;\nRUN;\n```\n\nThe output below is created below."
  - "[PAGE 16]\n\n# Defining Headers\n\nTables have two types of headers: table headers\
    \ and column headers. Luckily, you can define both in the same table. You only\
    \ need to specify them next.\n\nTo define a header, you must have a table type\
    \ and a name statement to define it. In fact, the header is defined at the beginning\
    \ of the table. The following code shows examples of these types:\n\n```\n```latex\n\
    \\begin{table}\n  \\header{Name}{Age}\n  \\row{Alice}{25}\n  \\row{Bob}{30}\n\\\
    end{table}\n```\n```\n```\n\nNow that you have a header, you can use it or change\
    \ it as you like. For example, you can use the \\header statement to define the\
    \ header within a table definition.\n\nHere is an example of applying a header\
    \ using a table method:\n\n```\n```latex\n\\begin{table}\n  \\header{Name}{Age}\n\
    \  \\row{Alice}{25}\n  \\row{Bob}{30}\n\\end{table}\n```\n```\n\nThe output is\
    \ shown below:\n\n| Name | Age |\n|---|---|\n| Alice | 25 |\n| Bob | 30 |\n\n\
    You can add more headers to the table as you want. However, the headers will appear\
    \ in the table in the order they do in the table definition.\n\n```\n```latex\n\
    \\begin{table}\n  \\header{Name}{Age}{City}\n  \\row{Alice}{25}{New York}\n  \\\
    row{Bob}{30}{London}\n\\end{table}\n```\n```\n\nThe output is shown below:\n\n\
    | Name | Age | City |\n|---|---|---|\n| Alice | 25 | New York |\n| Bob | 30 |\
    \ London |\n\nNow let's consider stacking headers. The stacking headers is similar\
    \ to the way that the blocks in the grid work. You can define multiple headers\
    \ for the table, and the more you define, the more they will be stacked. This\
    \ is not something you would need very time, but it shows the flexibility of table\
    \ headers.\n\n```\n```latex\n\\begin{table}\n  \\header{Personal Info}\n  \\header{Name}{Age}{City}\n\
    \  \\row{Alice}{25}{New York}\n  \\row{Bob}{30}{London}\n\\end{table}\n```\n```\n\
    \nThe output is shown below:\n\n| Personal Info |\n| Name | Age | City |\n|---|---|---||\n\
    | Alice | 25 | New York |\n| Bob | 30 | London |\n\nWhen using the SPLIT statement,\
    \ it is important when you define multiple headers. It works fine for that, but\
    \ you can also use it to include a header in extended table headers. Going back\
    \ to our Terra example, in the case of the Terra example, we used the SPLIT statement\
    \ to split the header into two parts.\n\n```\n```latex\n\\begin{table}\n  \\header{Name\\\
    SPLIT{Age}{City}}\n  \\row{Alice}{25}{New York}\n  \\row{Bob}{30}{London}\n\\\
    end{table}\n```\n```\n\n# Common Table Headers and Footers\n\nThere are various\
    \ types of table footer: FIRST_FOOTER, LAST_FOOTER, and SPLIT. Each one has its\
    \ own purpose. You can choose one of them according to your needs.\n\n+   FIRST_FOOTER:\
    \ a footer that appears at the beginning of the table if the header is defined.\n\
    \n+   LAST_FOOTER: a footer that appears at the end of the table.\n\n+   SPLIT:\
    \ a footer that will be treated as two headers.\n\nPROFOOTER: a footer to be defined\
    \ in the table definition."
  md: "\n## Putting All Together\n\nNow that we have put everything together, here\
    \ is how the PROB TEMPLATE looks, with a style that matches our output using HTML,\
    \ with matching styling.\n\nHere is the template output:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_0.png)\n\
    \nThis gives us a report that looks like this:\n\nHere is the output:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_1.png)\n\
    \nThe first thing to do is figure out what fonts and colors we will use in our\
    \ style. The techniques to do this are shown below. Some selectors will let us\
    \ show the style for a paragraph element to highlight it. Other selectors will\
    \ let us show the style for a table element to highlight it. For the HTML, other\
    \ colors might be better. But the best thing to do this is in case we want to\
    \ change the color of the elements in the future. When we do, we will see, that\
    \ we got the following colors:\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_2.png)\n\
    \n```css\nbody {\n  font-family: Arial, sans-serif;\n  color: #333;\n  background-color:\
    \ #f4f4f4;\n}\n\nh1 {\n  color: #0056b3;\n}\n\np {\n  margin-bottom: 15px;\n \
    \ line-height: 1.6;\n}\n\ntable {\n  border-collapse: collapse;\n  width: 100%;\n\
    }\n\nth, td {\n  border: 1px solid #ddd;\n  padding: 8px;\n  text-align: left;\n\
    }\n\nth {\n  background-color: #0056b3;\n  color: white;\n}\n```\n\nNow that we\
    \ have the CSS, we can link it to our HTML. Here is the HTML with the properties\
    \ for the template. The overall document structure looks like:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"style.css\">\n  <title>PROB\
    \ Report</title>\n</head>\n<body>\n  <h1>PROB Report</h1>\n  <p>This is a paragraph.</p>\n\
    \  <table>\n    <tr>\n      <th>Metric</th>\n      <th>Value</th>\n    </tr>\n\
    \    <tr>\n      <td>Metric 1</td>\n      <td>Value 1</td>\n    </tr>\n    <tr>\n\
    \      <td>Metric 2</td>\n      <td>Value 2</td>\n    </tr>\n  </table>\n</body>\n\
    </html>\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_3.png)\n\nWe're getting\
    \ pretty close, but there are still some things that could use some style. Note\
    \ that for our headers and the style for the table rows, we'll also change the\
    \ background color of the header marker to match our style.\n\n```css\nth {\n\
    \  background-color: #0056b3;\n  color: #ffffff;\n}\n\ntr:nth-child(even) {\n\
    \  background-color: #f2f2f2;\n}\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_4.png)\n\
    \nThe report looks quite well now with the Web site, but let's not look at the\
    \ PDF version of the report yet. There are some differences between this and the\
    \ HTML, but we can fix them. One thing we also see is that we need to add some\
    \ padding to the table to give it a bit more space.\n\n```css\ntd, th {\n  padding:\
    \ 12px;\n}\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_5.png)\n\n## Chapter\
    \ 3: Creating and Customizing Table Templates\n\n### Defining a Table\n\n### Defining\
    \ Headers and Footers\n\n### Defining Columns\n\n### Using Computed Column Values\
    \ As Column Data\n\n### Table Attributes\n\n### Style Overrides and Traffic Lighting\n\
    \n### The CELLSTYLE AS Statement\n\n### Using Table Templates within DATA _NULL_\n\
    \n### Using Variables in Table Templates\n\n### Using Generic Columns\n\n### DATA\
    \ Step Tricks\n\n### Modifying SAS Procedure Tables\n\n### The PROC FREQ Crosstabulation\
    \ Table\n\n### Putting It All Together\n\nAlthough many people don't realize it,\
    \ almost all tabular output generated by SAS is created using a table template.\
    \ Table templates describe what columns, headers, and footers should appear in\
    \ the table. They can also contain style overrides to specify extra style information.\
    \ In addition, there are many ways to create new columns based on columns in the\
    \ existing data set. Because SAS generates tables using table templates, you can\
    \ modify the output of procedures by editing the table templates that the procedures\
    \ use. But the real power of table templates is in writing your own from scratch\
    \ to create tables that aren't possible to create. In this chapter, we will show\
    \ you how to create your own table templates, how to customize styles and how\
    \ to modify the table templates used by procedures.\n\n## Defining a Table\n\n\
    You have already seen how to render some tables, but now let's learn the method\
    \ to define them. The first method we used for SAS is not very flexible when we\
    \ want to create the output.\n\nPROC TEMPLATE;\n  DEFINE TABLE matlab;\n  LAYOUT\
    \ _(obs=100);\n  FILE TEMPLATE=\"mytable\";\nEND;\nRUN;\n```\n\nHere is the output\
    \ from the code.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_0.png)\n\nThe\
    \ DATA statement has not changed much in this chapter, but we can simplify this\
    \ method using a macro. One of the macros we will define is DEFINE_TABLE, which\
    \ automates the table code above. We will be using this macro to bind data sets\
    \ to tables.\n\n```sas\nPROC TEMPLATE;\n  DEFINE TABLE %&tablename;\n  LAYOUT\
    \ _(obs=100);\n  FILE TEMPLATE=\"%&tablename%\";\nEND;\nRUN;\n```\n\nHere is the\
    \ example using the macro for DEFINE_TABLE.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_1.png)\n\
    \nIf you are using SAS 9.4, you can use PROC TABLE, which handles the definition\
    \ of the table and data set to the template. The example is shown using PROC TABLE.\n\
    \n```sas\nPROC TABLE data=mytset template=mytable;\n```\n\nWhen you use PROC TABLE,\
    \ all columns in your data set will be displayed in the table. You can control\
    \ which columns are displayed using the COLUMN statement. This works like PROC\
    \ REPORT.\n\n```sas\nPROC TABLE data=mytset template=mytable;\n  COLUMN name weight;\n\
    RUN;\n```\n\nHere is the output when you use the COLUMN statement.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_2.png)\n\
    \nIf you have many columns in your data set they can be expressed using notation\
    \ (e.g., all-*), you can use that notation in the COLUMN statement as well.\n\n\
    ```sas\nPROC TABLE data=mytset;\n  COLUMN all-*;\n```\n\nThe COLUMN statement\
    \ is more advanced than that. For example you can stack values on top of each\
    \ other by grouping the columns in parentheses. The stacked statement will have\
    \ the header and weight on top of each other in the same cell.\n\n```sas\nPROC\
    \ TABLE data=mytset;\n  COLUMN (name age);\nRUN;\n```\n\nThe output is shown below.\n\
    \n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_3.png)\n\nYou might have noticed\
    \ that the header for the stacked columns only contains Age. However, you can\
    \ change the header too. You can combine this stacked feature with the list too.\
    \ Here is the output from the previous code.\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_4.png)\n\
    \nAnother way to stack is that the output table looks like a report with a line\
    \ break after the COLUMN statement. In that way you group the columns together\
    \ and then stack them on top of each other using an asterisk (*). The following\
    \ code stacks the columns horizontally over weight.\n\n```sas\nPROC TABLE data=mytset;\n\
    \  COLUMN name * weight;\nRUN;\n```\n\nThe output below is created below.\n\n\
    ## Defining Headers\n\nTables have two types of headers: table headers and column\
    \ headers. Luckily, you can define both in the same table. You only need to specify\
    \ them.\n\nTo define a header, you must have a table type and a name statement\
    \ to define it. In fact, the header is defined at the beginning of the table.\
    \ The following code shows examples of these types:\n\n```latex\n<table>\n  <header>Name}{Age}\n\
    \  <row>Alice}{25}\n  <row>Bob}{30}\n</table>\n```\n\nNow that you have a header,\
    \ you can use it or change it as you like. For example, you can use the \\header\
    \ statement to define the header within a table definition. Here is an example\
    \ of applying a header using a table method:\n\n```latex\n<table>\n  <header>Name}{Age}\n\
    \  <row>Alice}{25}\n  <row>Bob}{30}\n</table>\n```\n\nThe output is shown below:\n\
    \n| Name | Age |\n|---|---|\n| Alice | 25 |\n| Bob | 30 |\n\nYou can add more\
    \ headers to the table as you want. However, the headers will appear in the table\
    \ in the order they do in the table definition.\n\n```latex\n<table>\n  <header>Name}{Age}{City}\n\
    \  <row>Alice}{25}{New York}\n  <row>Bob}{30}{London}\n</table>\n```\n\nThe output\
    \ is shown below:\n\n| Name | Age | City |\n|---|---|---|\n| Alice | 25 | New\
    \ York |\n| Bob | 30 | London |\n\nNow let's consider stacking headers. The stacking\
    \ headers is similar to the way that the blocks in the grid work. You can define\
    \ multiple headers for the table, and the more you define, the more they will\
    \ be stacked. This is not something you would need every time, but it shows the\
    \ flexibility of table headers.\n\n```latex\n<table>\n  <header>Personal Info>\n\
    \  <header>Name}{Age}{City}\n  <row>Alice}{25}{New York}\n  <row>Bob}{30}{London}\n\
    </table>\n```\n\nThe output is shown below:\n\n| Personal Info |\n| Name | Age\
    \ | City |\n|---|---|---||\n| Alice | 25 | New York |\n| Bob | 30 | London |\n"
  mdcn: "\n\n## 整合汇总\n\n现在我们已经将所有内容整合在一起了，这里是 PROB TEMPLATE 的外观，使用了与我们 HTML 输出匹配的样式，并具有相应的样式。\n\
    \n以下是模板输出：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_0.png)\n\n这让我们得到了如下所示报告：\n\
    \n以下是输出结果：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_1.png)\n\n首先要做的工作是确定我们在样式中使用的字体和颜色。实现此点的技术如下所示。某些选择器允许我们显示段落元素（paragraph）样式以突出显示。其他选择器则允许我们显示表格元素（table）样式以突出显示。对于\
    \ HTML，其他颜色可能更好。但最好的做法是考虑到我们将来可能想要更改元素的颜色。当我们这样做时，我们会发现得到了以下颜色：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_2.png)\n\
    \n```css\nbody {\n  font-family: Arial, sans-serif;\n  color: #333;\n  background-color:\
    \ #f4f4f4;\n}\n\nh1 {\n  color: #0056b3;\n}\n\np {\n  margin-bottom: 15px;\n \
    \ line-height: 1.6;\n}\n\ntable {\n  border-collapse: collapse;\n  width: 100%;\n\
    }\n\nth, td {\n  border: 1px solid #ddd;\n  padding: 8px;\n  text-align: left;\n\
    }\n\nth {\n  background-color: #0056b3;\n  color: white;\n}\n```\n\n现在我们有了 CSS，可以将其链接到我们的\
    \ HTML 中。以下是带有模板属性的 HTML。整体文档结构如下：\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n\
    \  <link rel=\"stylesheet\" href=\"style.css\">\n  <title>PROB Report</title>\n\
    </head>\n<body>\n  <h1>PROB Report</h1>\n  <p>This is a paragraph.</p>\n  <table>\n\
    \    <tr>\n      <th>Metric</th>\n      <th>Value</th>\n    </tr>\n    <tr>\n\
    \      <td>Metric 1</td>\n      <td>Value 1</td>\n    </tr>\n    <tr>\n      <td>Metric\
    \ 2</td>\n      <td>Value 2</td>\n    </tr>\n  </table>\n</body>\n</html>\n```\n\
    \n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_3.png)\n\n注：此处原文中存在大量重复的标题和段落，已根据要求进行翻译并处理，确保逻辑连贯。*\n\
    \n我们已经非常接近目标了，但还有一些事情需要进行样式处理。请注意，对于我们的表头和表格行的样式，我们还将更改表头标记的背景颜色以匹配我们的样式。\n\n\
    ```css\nth {\n  background-color: #0056b3;\n  color: #ffffff;\n}\n\ntr:nth-child(even)\
    \ {\n  background-color: #f2f2f2;\n}\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_4.png)\n\
    \n网页版的报告现在看起来很好，但让我们先不看 PDF 版本。它与 HTML 版本之间存在一些差异，但我们可以修复它们。我们还发现，我们需要为表格添加一些内边距（padding）以便留出空间。\n\
    \n```css\ntd, th {\n  padding: 12px;\n}\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_13_5.png)\n\
    \n## 第三章：创建和自定义表格模板\n\n### 定义表格\n\n### 定义表头和页脚\n### 定义列\n### 使用计算列\n### 表格属性\n\
    ### 样式覆盖与高亮\n### CELLSTYLE 语句\n### 在 DATA _ 使用表格模板\n### 在表格模板中使用变量\n### 使用通用列\n\
    ### DATA 步技巧\n### 修改 PROC 表格\n### PROC FREQ 交叉表\n\n### 整合汇总\n\n尽管许多人并没有意识到，SAS\
    \ 所有的表格输出都是使用表格模板创建的。表格模板描述了表格中应该出现的列、表头和页脚。它们还可以包含指定额外样式的覆盖。由于 SAS 使用表格模板生成表格，你可以通过编辑这些表格模板来修改输出。在本章中，我们将展示如何创建自己的表格模板、如何自定义样式以及如何修改过程使用的表格模板。\n\
    \n#### 定义表格\n\n你已经看到了如何渲染某些表格，现在让我们学习定义它们的方法。SAS 使用的第一种方法在我们需要创建输出时并不灵活。\n\n```sas\n\
    PROC TEMPLATE;\n  DEFINE TABLE matlab;\n  LAYOUT _(obs=100);\n  FILE TEMPLATE=\"\
    mytable\";\nEND;\nRUN;\n```\n\n这是代码的输出。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_0.png)\n\
    \nDATA语句在本章中没有变化，但可以使用宏来简化这种方法。我们将定义的宏之一是 `DEFINE_TABLE`，它自动化了上面的表格代码。我们将使用此宏将数据集绑定到表格。\n\
    \n```sas\nPROC TEMPLATE;\n  DEFINE TABLE %&tablename;\n  LAYOUT _(obs=100);\n\
    \  FILE TEMPLATE=\"%&tablename%\";\nEND;\nRUN;\n```\n\n这是使用宏 `DEFINE_TABLE` 的示例。\n\
    \n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_1.png)\n\n如果你使用的是 SAS 9.4，可以使用 `PROC\
    \ TABLE`，它可以处理从数据集到模板的定义。示例是使用 `PROC TABLE` 显示。\n\n```sas\nPROC TABLE data=mytset\
    \ template=mytable;\n```\n\n当你使用 `PROC TABLE` 时，数据集中的所有列将显示在表中。你可以使用 `COLUMN`\
    \ 语句控制显示哪些列。它的工作方式类似于 `PROC REPORT`。\n\n```sas\nPROC TABLE data=mytset template=mytable;\n\
    \  COLUMN name weight;\nRUN;\n```\n\n这是你使用 `COLUMN` 语句时的输出。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_2.png)\n\
    \n如果你的数据集中有很多列，可以使用表示法（例如 `all-*`）表示，你也可以 `COLUMN` 语句中使用该表示法。\n\n```sas\nPROC\
    \ TABLE data=mytset;\n  COLUMN all-*;\n```\n\n`COLUMN` 语句比这更高级。例如，你可以通过对列分组将值堆叠在一起。堆叠语句将表头和\
    \ weight 在同一个单元格内堆叠。\n\n```sas\nPROC TABLE data=mytset;\n  COLUMN (name age);\n\
    RUN;\n```\n\n输出所示。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_3.png)\n\n你可能已经注意到堆叠列的表头只包含\
    \ Age。然而，你也可以更改表头。你还可以将此堆叠功能与列表结合。这是上一个代码的输出。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_15_4.png)\n\
    \n另一种堆叠方法是输出表格看起来像在 `COLUMN` 语句后有换行的报告。通过这种方式，你将列分组，然后使用星号（*）将它们堆叠在一起。以下代码将列在\
    \ weight 之上水平堆叠。\n\n```sas\nPROC TABLE data=mytset;\n  COLUMN name * weight;\n\
    RUN;\n```\n\n下方生成的输出。\n\n## 定义表头\n\n表格有两种类型的表头：表格表头和列头。幸运的是，你可以在同一个表格中定义两者。你只需要指定它们。\n\
    \n要定义表头，你必须有一个表格类型和一个名称语句来定义它。事实上，表头是在表格的开始处定义的。以下代码显示了这些类型的示例：\n\n```sas\nPROC\
    \ TEMPLATE;\n  DEFINE TABLE Name>\n  header>Age>\n```\n\n"
