    # HTML-specific Style Attributes


    The following attributes are primarily used by the HTML output type; exceptions
    are noted.


    **CLASS=string**

    specifies the CSS class name to use instead of ODS pre-defined class name for
    the element.


    **CONTENTTYPE=string**

    specifies the content type of the document. This is generally used in the <meta>
    tag at the beginning of an HTML file to tell the browser what type of document
    it is.


    **DOCTYPEYPE=string**

    specifies the <!DOCTYPE> declaration to be printed at the top of the HTML document.


    **HREFTARGET=string**

    specifies the name of the frame to use in the target= HTML attribute.


    **HTMLID=string**

    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    **HTMLSTYLE=string**

    specifies additional CSS style content to add to the style= HTML attribute or
    CSS class.


    **PAGEBREAKHTML=string**

    specifies the markup to use for pagebreaks. This must be specified on the Body
    style element.


    **TAGATTR=string**

    specifies additional markup to include within the tag of an HTML element. This
    can be used to add attributes to an HTML tag that are not supported by ODS directly.
    This attribute is also used by the ExcelXP tag to add Excel-specific formatting.


    # Group Metric Attributes


    ### CAPITAL

    specifies the flags at the ends of the whiskers. The accepted values are SERIF,
    BRACKET, and NONE.


    ### CONTOUR

    specifies a point distance statistic from the box. The accepted values are MEDIAN,
    MEAN, and MAX.


    ### CORRELATION

    specifies attributes of the plot. This list varies on the type of graph. Multiple
    attributes can be specified by separating them with a comma.


    ### DIRECTION

    specifies the direction. The accepted values are horizontal and vertical.


    ### LINES

    specifies the color of lines.


    ### MARKERS

    specifies the size of the marker. The available symbols are listed below:


    | Name | Description | RGB | Sample |

    |---|---|---|---|

    | Arrow | Horizontal | | Hourglass |

    | ArrowBold | Vertical | | Hourglass |

    | ArrowWide | Left | | Hourglass |

    | ArrowWideFilled | Left | | Hourglass |

    | Aster | Right | | Hourglass |

    | AsterBold | Right | | Hourglass |

    | Asterisk | Right | | Hourglass |

    | Circle | Horizontal | | Hourglass |

    | CircleBold | Vertical | | Hourglass |

    | CircleWide | Horizontal | | Hourglass |

    | CircleWideFilled | Vertical | | Hourglass |

    | CircleDown | Horizontal | | Hourglass |

    | CircleDownFilled | Vertical | | Hourglass |

    | CircleTriangle | Left | | Hourglass |

    | CircleTriangleFilled | Left | | Hourglass |

    | Diamond | Right | LessThan | | Multicolored |

    | DiamondBold | Right | | Multicolored |

    | DiamondWide | Right | | Multicolored |

    | DiamondWideFilled | Right | | Multicolored |

    | DiamondDown | Right | | Multicolored |

    | DiamondDownFilled | Right | | Multicolored |

    | DiamondNarrow | Right | | Multicolored |

    | DiamondNarrowFilled | Right | | Multicolored |

    | Dagger | Right | | Multicolored |

    | Flag | Right | | Multicolored |


    ### HORIZONTAL

    specifies the minor ticks that should be displayed.


    ### NEUTRALCOLOR

    specifies the color of the y-tick.


    ### STARTCOLOR

    specifies the color of the first-tick.


    ### TICKELS

    specifies the location of all tick marks. The accepted values are INSIDE, OUTSIDE,
    or ACROSS.


    ### TRANSPAREY

    specifies the transparency of a region. A value of 0 will be completely transparent.


