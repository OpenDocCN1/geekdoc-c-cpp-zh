  - '[PAGE 26]


    # # Template Overrides and Defaults


    TEMPLATE allows you to include a file called ''default''. If you have a file with
    the same name, TEMPLATE will use yours instead of the default.


    ![](img/f42c8ff43e199c1b82aa844e9d40e211_26_0.png)


    Table and Template templates are grouped by their type name. Thus Table and Template
    templates have their own defaults. You can then use the Template in Table just
    like you use the Table in Template.


    If there is no override for a particular item, TEMPLATE will use the default.
    This is how it works.


    When a template is requested by an order, TEMPLATE looks for an override. If it
    finds one, it uses that. Otherwise, it uses the default.


    There are two types of TEMPLATE: LIST and QUOTE. These statements are discussed
    in the following section.


    # ## LIST


    When a list is requested by an order, TEMPLATE looks for an override. If it finds
    one, it uses that. Otherwise, it uses the default.


    ```

    ORDER DEFAULT

    ```


    The log output from the above command will look like:


    ```

    ORDER DEFAULT

    LIST DEFAULT

    LIST TEMPLATE_LIST

    ```


    If you see a name after DEFAULT, it means the order contains an override for that
    main item.


    # ## QUOTE


    When a quote is requested by an order, TEMPLATE looks for an override. If it finds
    one, it uses that. Otherwise, it uses the default.


    ```

    ORDER DEFAULT

    ```


    The log output from the above command will look like:


    ```

    ORDER DEFAULT

    QUOTE DEFAULT

    QUOTE TEMPLATE_QUOTE

    ```


    If you see a name after DEFAULT, it means the order contains an override for that
    main item.


    # ## SASUserTemplate


    When a SAS template is requested by an order, TEMPLATE looks for an override.
    If it finds one, it uses that. Otherwise, it uses the default.


    ![](img/f42c8ff43e199c1b82aa844e9d40e211_26_1.png)


    When a SAS template is requested by an order, TEMPLATE looks for an override.
    If it finds one, it uses that. Otherwise, it uses the default.


    ```

    ORDER SAS DEFAULT

    ```


    The log output from the above command will look like:


    ```

    ORDER SAS DEFAULT

    SASUSER DEFAULT

    SASUSER TEMPLATE_SASUSER

    ```


    If you see a name after DEFAULT, it means the order contains an override for that
    main item.'
