  mdcn: "\n\n## 样式覆盖与追踪\n\n我们已经学习了一些如何在 CSS 中覆盖样式和回溯的示例。现在，让我们来看看应用样式覆盖和回溯到选择器需要哪些条件。\n\
    \n在此提醒一下，这里是设置覆盖的通用格式：\n\n```css\n.selector {\n  color: red;\n}\n```\n\n在阅读这一章时，你可能不知道表格的所有属性都可以被覆盖。然而，这只在样式覆盖上是可行的。让我们从设置表格开始：\n\
    \n```css\n.selector {\n  color: blue;\n}\n```\n\n表格上的样式也不那么有趣，因为适用于表格的样式并不多。现在让我们转向如何将样式应用于表头和页脚。让我们为表头和页脚创建颜色：\n\
    \n```css\nthead {\n  background-color: yellow;\n}\ntfoot {\n  background-color:\
    \ blue;\n}\n```\n\n这是代码的输出结果：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_0.png)\n\
    \n现在表头和页脚都有某些类型的列，你也可以使用精确名称更改每个单独列的样式。例如：\n\n```css\ntcol:nth-child(1) {\n  color:\
    \ red;\n}\ntcol:nth-child(2) {\n  color: green;\n}\n```\n\n这是代码的输出结果：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_1.png)\n\
    \n通过表头和更多的技巧，我们可以覆盖行和表格的样式系统，但它们也有一些根据位置覆盖样式的方法。例如：\n\n```css\ntrow:nth-child(even)\
    \ {\n  background-color: gray;\n}\ntrow:nth-child(odd) {\n  background-color:\
    \ white;\n}\n```\n\n这是上述代码的输出结果：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_2.png)\n\
    \n到此为止，既然我们有了一些数据，我们还可以添加一些有趣的灯光效果。你已经看到过使用 FASCET、SVETCH 和 SVETLINE 的技术。现在让我们学习如何使用\
    \ SVETLINE 来高亮区域。通过使用这些带有 SVETLINE 的追踪技术，你可以结合 CELLYST 对齐让你的表格更加强大。\n\n## CELLYST\
    \ 对齐\n\n在下面的示例中，左侧是行头和列头被高亮的地方，右侧是根据 CELLYST 对齐顺序评估的表达式。变量和维度变量可以在表达式中定义（我们使用问号）。如果我们想定义在一个范围内的多个变量，可以使用方括号。例如：\n\
    \n```css\ntcol:nth-child(1-3) {\n  color: red;\n}\n```\n\n这是上述代码的输出结果：\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_20_3.png)\n\
    \n| 名称 | 描述 |\n| --- | --- |\n| _col_ | 从 1 开始的列号 |\n| _dim_ | 当前列的维度 |\n| _row_\
    \ | 从 1 开始的行号 |\n| _stk_ | 样式元素名称 |\n| _val_ | 数据值 |\n\n## 在 MySQL 中使用表格模板\n\n\
    使用表格模板（Table Templates）允许你创建与其他任何表格完全相同的表格。生成的表格结构基于 TEMPLATE 的定义。你可以使用 TEMPLATE\
    \ 创建许多具有相同结构的表格。\n\n要从模板创建表格，使用 CREATE_TABLE 过程并指定输出表名。这是一个代码示例：\n\n```sql\nCALL\
    \ CREATE_TABLE('output_table', 'template_name');\n```\n\n现在你可以使用 INSERT_DATA 过程向表格中插入数据。以下是代码示例：\n\
    \n```sql\nCALL INSERT_DATA('output_table', 'value1', 'value2');\n```\n\n你可以使用\
    \ SELECT 语句从表格中查询数据。\n\n```sql\nSELECT * FROM output_table;\n```\n\n使用模板的主要用处是，你不需要重复创建相同的结构。你可以使用一个模板创建许多结构相同的表格。要创建一个模板，使用\
    \ CREATE_TEMPLATE 过程。\n\n```sql\nCALL CREATE_TEMPLATE('template_name', 'CREATE\
    \ TABLE output_table (\n  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n\
    \  column4 VARCHAR(50)\n);');\n```\n\n这是一个代码示例：\n\n```sql\nCALL CREATE_TEMPLATE('template_name',\
    \ 'CREATE TABLE output_table (\n  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n\
    \  column4 VARCHAR(50)\n);');\n```\n\n使用模板名，上述代码可以执行。这是输出结果：\n\n```sql\nCREATE\
    \ TABLE output_table (\n  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n\
    \  column4 VARCHAR(50)\n);\n```\n\n上述代码的另一种用法显示了冗余列：\n\n```sql\nCREATE TABLE output_table\
    \ (\n  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n  column4 VARCHAR(50)\n\
    );\n```\n\n## 在模板中使用变量\n\n这允许将变量传递给模板，以便创建具有动态列名的表格。当你需要创建许多名称不同的表格时，这非常有用。这意味着你可以使用模板创建相同数据的多种表示。例如，如果你有一个表格并想为每个部分创建一个表格，可以使用模板来实现。这是一个代码示例：\n\
    \n```sql\nSET @table_name = 'output_table';\nSET @column1 = 'column1';\nSET @column2\
    \ = 'column2';\nSET @column3 = 'column3';\nSET @column4 = 'column4';\n\nCALL CREATE_TEMPLATE('template_name',\
    \ CONCAT('CREATE TABLE ', @table_name, ' (\n  ', @column1, ' INT,\n  ', @column2,\
    \ ' INT,\n  ', @column3, ' VARCHAR(50),\n  ', @column4, ' VARCHAR(50)\n);'));\n\
    ```\n\n这是输出结果：\n\n```sql\nCREATE TABLE output_table (\n  column1 INT,\n  column2\
    \ INT,\n  column3 VARCHAR(50),\n  column4 VARCHAR(50)\n);\n```\n\n现在你可以使用 INSERT_DATA\
    \ 过程向表格中插入数据。\n\n```sql\nCALL INSERT_DATA(@table_name, 'value1', 'value2', 'value3');\n\
    ```\n\n你可以使用 SELECT 语句从表格中查询数据。\n\n```sql\nSELECT * FROM @table_name;\n```\n\n\
    使用模板的主要用处是，你不需要重复创建相同的结构。\n\n## 动态列\n\n这允许你创建一个具有动态列数的表格。当你需要创建一个列数未知的表格时，这非常有用。这是一个代码示例：\n\
    \n```sql\nSET @table_name = 'output_table';\nSET @column1 = 'column1';\nSET @column2\
    \ = 'column2';\nSET @column3 = 'column3';\nSET @column4 = 'column4';\nSET @column5\
    \ = 'column5';\nSET @column6 = 'column6';\n\nCALL CREATE_TEMPLATE('template_name',\
    \ CONCAT('CREATE TABLE ', @table_name, ' (\n  ', @column1, ' INT,\n  ', @column2,\
    \ ' INT,\n  ', @column3, ' VARCHAR(50),\n  ', @column4, ' VARCHAR(50),\n  ', @column5,\
    \ ' VARCHAR(50),\n  ', @column6, ' VARCHAR(50)\n);'));\n```\n\n这是输出结果：\n\n```sql\n\
    CREATE TABLE output_table (\n  column1 INT,\n  column2 INT,\n  column3 VARCHAR(50),\n\
    \  column4 VARCHAR(50),\n  column5 VARCHAR(50),\n  column6 VARCHAR(50)\n);\n```\n\
    \n## 继承\n\n由于我们已经在 PROC TEMPLATE 中发现了继承，因此这并不完全新奇。当一个模板（表格、列或表头）继承自另一个模板时，大多数属性将与父模板相同，但子模板可以覆盖其他属性。这里有一个我们大部分视觉上都喜欢的模板，但我们想改变它的几个方面。\n\
    \n```\nPROC TEMPLATE;\n  TEMPLATE data_template;\n    TABLE name=data;\n     \
    \ COLUMN name=age;\n      COLUMN name=first_name;\n        DEFINE age;\n     \
    \   DEFINE first_name;\n        HEADER = \"First Name\";\n      END;\nEND;\n```\n\
    \n这是它生成的输出结果。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_22_0.png)\n\n我们想要更改\
    \ age 的格式，并添加一个 gender 列。\n\n```\nPROC TEMPLATE;\n  TEMPLATE data_template;\n\
    \    PARENT = data_template;\n    COLUMN age (format=);\n      DEFINE age;\n \
    \   COLUMN gender;\n      DEFINE gender;\n      HEADER = \"Gender\";\n  END;\n\
    END;\n```\n\n在这种情况下，我们从父模板继承了所有属性，但我们也定义了 gender 列。合并所有属性和列创建了结果表格。\n\n```\nPROC\
    \ TEMPLATE;\n  TEMPLATE data_template;\n    COLUMN name=name;\n    CLASS class=class;\n\
    \    TABLE name=data SASHELP.CLASS(class=class);\n      DEFINE name;\n      DEFINE\
    \ class;\n  END;\nEND;\n```\n\n这是使用 SASHELP.CLASS 表格时的输出。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_22_1.png)\n\
    \n列、头部和页脚的继承方式相同，但它们并没有被实际存储。列只能包含属性。头部和页脚只能包含属性。你不限于在同一个作用域内继承。你可以在表格内部定义列并将其作为另一个表格的父。通过嵌套继承可以在表格之间共享列。例如，你可以在一个表格中定义一个列，然后将其作为另一个表格的列。\n\
    \n```\nPROC TEMPLATE;\n  TEMPLATE class_stats;\n    STYLE = (font=bold);\n   \
    \ TABLE class=class;\n      COLUMN weight=weight;\n        DEFINE weight;\n  END;\n\
    END;\n```\n\n这是输出结果。\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_22_2.png)\n\n\
    虽然你从上面看到继承很简单，因为它们只有一个层级的包，但 SAS 过程使用的模板管理起来更复杂。如果你记得第 5 章，我们提到过模板可以包含多个表格。但你一次只能从一个表格继承。\n\
    \n```\nPROC TEMPLATE;\n  TEMPLATE table_template;\n    TABLE data=data;\n    CLASS\
    \ class=class;\n    COLUMN weight=weight;\n      DEFINE weight;\n  END;\nEND;\n\
    ```\n\n"
