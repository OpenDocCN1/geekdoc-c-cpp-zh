    \ how the columns are displayed in the output."
  - '[PAGE 18]


    # Using Computed Values As Column Data


    Although you do not need to set a table template, you do not necessarily need
    a data column for each column. You can create columns from other data in the table.
    The COMPUTE statement determines whether a column is associated with a data or
    an expression. This statement takes a standard SAS expression. The expression
    is evaluated for every observation in the input data set to get the resulting
    output value. Here is the general format of the COMPUTE AS:


    ```

    COMPUTE as expr;

    ```


    Since we have using the SASHELP class set, let us trend and use the information
    to compute something useful. One thing that can be calculated is the body mass
    index (BMI). This is one measure to determine if someone is underweight, normal,
    or overweight. It is computed using the following formula:


    > BMI = weight^2 / height^2


    Find answers on the fly, or master something new. Subscribe today. Pricing options.


    Now that we have all of the information, add a new column to the table that contains
    each individual''s BMI.


    ```

    PROC TABLE data=sashelp.class (obs=7);

    COLUMN name age height weight bmi;

    DEFINE bmi;

    COMPUTE bmi AS (weight * 703) / (height * height);

    HEADER = "BMI";

    FORMAT bmi=2.;nEND;

    RUN;

    ```


    The resulting output is shown:


    | Name | age | height | weight | BMI |

    |---|---|---|---|---|

    | Alice | 11 | 56 | 63 | 25.03 |

    | James | 14 | 66 | 120 | 27.27 |

    | Mary | 90 | 59 | 117 | 33.74 |

    | Michael | 28 | 63 | 100 | 26.05 |

    | Patricia | 15 | 61 | 88 | 24.77 |

    | Robert | 13 | 65 | 140 | 29.91 |

    | Susan | 22 | 54 | 95 | 32.04 |

    | David | 11 | 69 | 160 | 23.33 |

    | Barbara | 19 | 62 | 103 | 27.99 |

    |Linda | 10 | 60 | 115 | 32.06 |


    A method to create new values in a column is using the TRANSLATE statement. Unlike
    PROC FORMAT, it takes the data in a column and converts it into a different representation.
    It is like of using a SAS format, but it gives you the full power of SAS expressions
    in the matching of the value and the replacement. In addition, the value of the
    column is based on the values of any number of columns, just like in the case
    of the COMPUTE AS statement. The general format of the TRANSLATE statement is:


    ```

    TRANSLATE expr-a INTO expr-b;


    ...


    expr-a INTO expr-b;

    ```


    The data in the column is tested against the expression on the left side of the
    INTO keyword. If the expression is true, then the data is generated by the expression
    on the right side of the INTO keyword. Let''s look at an example


    We do not care about the exercise in the SASHELP.CLASS data set for the male and
    female students, only whether they are above or below a certain value. However
    we only care if the weight is between 70 and 120. Any values outside that range
    can be represented by "low" and "high" respectively. For females, we want to do
    the same, except the values are 70 and 100. We could not accomplish this with
    a SAS format because SAS format requires the data from two columns.


    ```

    PROC TABLE

    data=sashelp.class(obs=7);

    COLUMN name age height weight;

    DEFINE weight;

    TRANSLATE weight-INTO "low" when weight < 70;

    TRANSLATE weight-INTO "high" when weight > 100;

    END;

    ;

    ```


    In this case, because we are using a new variable in the calculation, we need
    to include it in the COMPUTE column as well. Turn will be of using PRINT-OF in
    the column definition. The value of the VAL-KEY refers to whichever expression
    was currently being applied. In example, this does not make any difference when
    the TRANSLATE statement is used in one column; however, some TRANSLATE statement
    must be used in the table to apply to all of the columns in table. In that case,
    the VAL-KEY would correspond to whichever expression was currently being applied.
    Here, here is the output from the code below.'
  - '[PAGE 19]


    # Table Attributes


    Table attributes are used to affect the behavior of the table itself, as well
    as some header and column behaviors, many of the attributes are Listing-specific
    and will not be discussed here. A complete list of attributes can be found in
    the SAS 9.3 ODS Delivery System: User''s Guide, Second Edition.


    **BYLINE-ON | OFF**


    specifies whether or not to print the byline before the table.


    **CLASSLEVELSON | OFF**


    specifies whether or not to enable the BLANK, DUPS= attribute on a column if the
    previous column also has BLANK, DUPS= enabled and its value changed in the current
    row.


    **CONTENTS-ON | OFF**


    specifies whether or not to put the table in the table of contents.


    **CONTENTS_LABEL="string"**


    Find answers on the fly, look or master something new. See pricing options.


    **DATA_FORMAT_OVERRIDE=ON | OFF**


    specifies whether or not the format from the data column should take precedence
    over the format in the template.


    **LABEL="string"**


    specifies a label for the table. If no label is provided, the label from the data
    set will be used. If it does not have a label, the text of the first table header
    is used.


    **NEWPAGE=ON | OFF**


    specifies whether or not to force a page break before the table.


    **ORDER_DATA=ON | OFF**


    specifies whether or not the order of the columns in the data set override the
    order of the columns specified in the template.


    **PARENT="table-path"**


    specifies a table definition to inherit from. Inheritance will be discussed later
    in this chapter.


    **PRINT_FOOTERS=ON | OFF**


    specifies whether or not to print the table footers.


    **PRINT_HEADERS=ON | OFF**


    specifies whether or not to print the table headers.


    **STYLE="style-override"**


    specifies a style to apply to the header. Style overrides are discussed in "Style
    Overrides and Conditional Formatting" in Chapter 2.


    **USE_FORMAT_DEFAULTS=ON | OFF**


    specifies whether or not the width and number of decimals should be taken from
    the default values for the format name rather than the template.


    **USER_NAME=ON | OFF**


    specifies the column name as the header if neither the column definition nor the
    data set specifies one.


    Just as we have columns, headers, and footers, tables also support a NOTES statement
    that enables us to store a comment with the table that describes what the table
    is for. It is possible to have attribute values dynamically set at runtime rather
    than compile time. This is not as useful when you are using the PROC ODSTABLE
    condition to generate tables, but it can be quite useful when you are creating
    reusable table templates using PROC TEMPLATE.


    While we have only each attribute with explicit values here, it is possible to
    change various aspects of behavior, the look and feel defined by the overall style.
    It is possible to override style attributes within the table frame templates,
    and even do traffic lighting based on data. These techniques are discussed in
    the following section.'
