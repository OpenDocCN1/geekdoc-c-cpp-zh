  - "[PAGE 17]\n\n# Defining Columns\n\nUsing the COLUMNS statement to define the\
    \ structure of the table, you can specify what each column defines such as the\
    \ column name, what the column header contains, and the data type.\n\nYou can\
    \ use one of these methods to define the overall structure of the table using\
    \ the COLUMNS statement or define individual columns that need special formatting.\n\
    \n+   1. Define the columns you want to include.\n\nLet's go to the first part\
    \ using the COLUMNS statement.\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n\
    \  AGE integer,\n  CITY char(20);\n```\n\nThe following table is simplified but\
    \ not as complete as necessary.\n\n| ID | NAME | AGE | CITY |\n|---|---|---|--|\n\
    | 1 | Alice | 25 | New York |\n| 2 | Bob | 30 | London |\n| 3 | Charlie | 22 |\
    \ Tokyo |\n\nUsing a hybrid approach, you can use the COLUMNS statement to define\
    \ the overall structure, and then define columns to specify attributes. This would\
    \ look like the following:\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n\
    \  AGE integer,\n  CITY char(20);\n\nDEFINE ID\n  HEADER 'ID Number';\nDEFINE\
    \ NAME\n  HEADER 'Full Name';\nDEFINE AGE\n  HEADER 'Age (Years)';\nDEFINE CITY\n\
    \  HEADER 'City of Residence';\n```\n\nNote that if you use both a COLUMNS statement\
    \ and define columns, the settings in the DEFINE statement will take precedence.\
    \ Also, the order of the columns in the table will be determined by the order\
    \ of the information in the COLUMNS statement; any columns defined in DEFINE will\
    \ be automatically appended to the COLUMNS statement at the end of the table.\n\
    \nThe output table is shown below.\n\n| ID Number | Full Name | Age (Years) |\
    \ City of Residence |\n|---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2 |\
