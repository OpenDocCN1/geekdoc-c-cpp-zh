  mdcn: "\n\n# 定义列\n\n使用 `COLUMNS` 语句来定义表格的结构，你可以指定每个列的定义，例如列名、列头包含的内容以及数据类型。\n\n\
    你可以使用以下方法之一，通过 `COLUMNS` 语句定义表格的整体结构，或者定义需要特殊格式的单独列。\n\n- 1. 定义你想要包含的列。\n\n让我们进入使用\
    \ `COLUMNS` 语句的第一部分。\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n  AGE integer,\n\
    \  CITY char(20);\n```\n\n下面的表经过了简化，但尚未达到所需的完整性。\n\n| ID | NAME | AGE | CITY |\n\
    |---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2 | Bob | 30 | London |\n\
    | 3 | Charlie | 22 | Tokyo |\n\n使用混合方法，你可以使用 `COLUMNS` 语句定义整体结构，然后定义列来指定属性。其写法如下：\n\
    \n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n  AGE integer,\n  CITY char(20);\n\
    \nDEFINE ID\n  HEADER 'ID Number';\nDEFINE NAME\n  HEADER 'Full Name';\nDEFINE\
    \ AGE\n  HEADER 'Age (Years)';\nDEFINE CITY\n  HEADER 'City of Residence';\n```\n\
    \n注意，如果你同时使用 `COLUMNS` 语句和定义列，则 `DEFINE` 语句中的设置将具有更高优先级。此外，表格中列的顺序将由 `COLUMNS`\
    \ 语句中信息的顺序决定；在 `DEFINE` 中定义的列将自动追加到表格末尾。\n\n输出表格如下所示。\n\n| ID Number | Full Name\
    \ | Age (Years) | City of Residence |\n|---|---|---|---|\n| 1 | Alice | 25 | New\
    \ York |\n| 2 | Bob | 30 | London |\n| 3 | Charlie | 22 | Tokyo |\n\n虽然这处理了表头，但你可能想使用标题而不仅仅是一行。在这种情况下，你应该使用\
    \ `HEADER` 语句将标题与列相关联。\n\n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n  AGE\
    \ integer,\n  CITY char(20);\n\nHEADER ID\n  LABEL 'ID Number';\nHEADER NAME\n\
    \  LABEL 'Full Name';\nHEADER AGE\n  LABEL 'Age (Years)';\nHEADER CITY\n  LABEL\
    \ 'City of Residence';\n```\n\n输出如下所示。\n\n| ID Number | Full Name | Age (Years)\
    \ | City of Residence |\n|---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2\
    \ | Bob | 30 | London |\n| 3 | Charlie | 22 | Tokyo |\n\n对列进行的另一个操作是格式化数据格式。这是通过\
    \ `FORMAT` 语句实现的。例如，要让最后一列的信息左对齐，可以使用 `FORMAT` 属性。我们表格中的所有数字都是右对齐的。你可以通过以下代码让它们全部对齐：\n\
    \n```\nCOLUMNS\n  ID integer,\n  NAME char(20),\n  AGE integer,\n  CITY char(20);\n\
    \nFORMAT CITY left20;\n```\n\n该示例的输出如下所示。\n\n| ID Number | Full Name | Age (Years)\
    \ | City of Residence |\n|---|---|---|---|\n| 1 | Alice | 25 | New York |\n| 2\
    \ | Bob | 30 | London |\n| 3 | Charlie | 22 | Tokyo |\n\n有许多列属性可以用于控制列的行为。然而，大多数属性用于\
    \ `LIST` 语句中。列出属性允许你控制列在输出中的显示方式。\n\n# 使用计算值作为列数据\n\n虽然你不需要设置表格模板，但也不一定需要为每个列设置数据列。你可以从表格中的其他数据创建列。`COMPUTE`\
    \ 语句确定列是否与某个表达式关联。该语句对输入数据集中的每个观测值进行求值，以得到输出值。由于我们在计算中使用新变量，需要在 `COMPUTE` 语句中包含它。以下是\
    \ `COMPUTE AS` 的通用格式：\n\n```\nCOMPUTE as expr;\n```\n\n由于我们使用了 `SASHELP` 数据集，让我们利用这些信息计算一些有用的东西。可以计算的是体重指数（BMI）。这是衡量某人是体重不足、正常还是超重的一个指标。使用以下公式计算：\n\
    \n> BMI = weight^2 / height^2\n\n现在我们有了所有信息，为表格中添加一个包含每个个人 BMI 的新列。\n\n```\nPROC\
    \ TABLE data=sashelp.class (obs=7);\nCOLUMN name age weight bmi;\nDEFINE bmi;\n\
    COMPUTE bmi AS (weight * 70) / (height * height);\nHEADER = \"BMI\";\nFORMAT bmi=.;\n\
    END;\nRUN;\n```\n\n输出如下：\n\n| Name | age | weight | BMI |\n|---|---|---|---|\n\
    | Alice | 11 | 56 | 63 | 25.03 |\n| James | 14 | 66 | 120 | 27.27 |\n| Mary |\
    \ 90 | 59 | 117 | 33.74 |\n| Michael | 28 | 63 | 100 | 26.05 |\n| Patricia | 15\
    \ | 61 | 88 | 24.77 |\n| Robert | 13 | 65 | 140 | 29.91 |\n| Susan | 22 | 54 |\
    \ 95 | 32.04 |\n| David | 11 | 69 | 160 | 23.33 |\n| Barbara | 19 | 62 | 103 |\
    \ 27.99 |\n| Linda | 10 | 60 | 115 | 32.06 |\n\n在列中创建新值的方法是使用 `TRANSLATE` 语句。与\
    \ `FORMAT` 不同，它获取列中的数据并转换为不同的表示。这类似于使用 SAS 格式，但在值的匹配和替换方面提供了完整的 SAS 表达式功能。此外，列的值基于任意列，就像\
    \ `COMPUTE` 语句的情况一样。`TRANSLATE` 语句的通用格式是：\n\n```\nTRANSLATE expr-a INTO expr-b;\n\
    ```\n\n列中的数据相对于 `INTO` 关键字左侧的表达式。如果表达式真，则数据由 `INTO` 关键字的右侧生成。对于男女学生，我们关心他们是否高于或低于某个值。然而只关心体重是否在\
    \ 70 到 120 之间。该范围之外的任何值都可以用“low”和“high”表示。对于女性，我们想要同样的操作，只是值是 70 和 100。我们无法通过\
    \ SAS 格式实现这一点，因为 SAS 格式需要两列的数据。\n\n```\nPROC TABLE data=sashelp.class(obs=7);\n\
    COLUMN name age weight;\nDEFINE weight;\nTRANSLATE weight-INTO \"low\" when weight\
    \ < 70;\nTRANSLATE weight-INTO \"high\" when weight > 100;\nEND;\n```\n\n在这种情况下，由于列定义中\
    \ `VAL-KEY` 指向当前应用的任何表达式。例如，当在列中使用 `TRANSLATE` 语句时，这没有区别；但必须在表格中使用某些 `TRANSLATE`\
    \ 语句以应用于所有列。以下是代码的输出：\n\n# 表格属性\n\n表格属性用于影响表格本身，以及某些表头和列的行为；许多属性是列表（Listing）特定的，在此不再讨论。完整的属性列表可以在《SAS\
    \ 9.3 ODS Delivery System: User's Guide, Second Edition》中找到。\n\n- **BYLINE-ON\
    \ | OFF**: 指定在表格前打印行标题（byline）。\n- **CLASSLEVELSON | OFF**: 指定如果之前的列也启用了 `BLANK,\
    \ DUPS=` 属性且其值在当前行发生变化，则是否在该列上启用 `BLANK, DUPS=` 属性。\n- **CONTENTS-ON | OFF**:\
    \ 指定是否将表格放入目录中。\n- **CONTENTS_LABEL=\"string\"**: 动态查找答案，查看或掌握新事物。参见定价选项。\n- **DATA_FORMAT_OVERRIDE=ON\
    \ | OFF**: 指定数据列的格式是否优于模板中的格式。\n- **LABEL=\"string\"**: 为表格指定标签。如果未提供标签，将使用数据集的标签。如果标签标签，则使用第一个表格表头的文本。\n\
    - **NEWPAGE=ON | OFF**: 指定是否在表格前强制分页。\n- **ORDER_DATA=ON | OFF**: 指定数据集中列的顺序是否覆盖模板中指定的列的顺序。\n\
    - **PARENT=\"table-path\"**: 指定一个要继承的表格定义。继承将在本章稍后的部分讨论。\n- **PRINT_FOOTERS=ON\
    \ | OFF**: 指定是否打印表格页脚。\n- **PRINT_HEADERS=ON | OFF**: 指定是否打印表格表头。\n- **STYLE=\"\
    style-override\"**: 指定应用到表头的样式。样式覆盖将在第二章的“样式覆盖和条件格式”中讨论。\n- **USE_FORMAT_DEFAULTS=ON\
    \ | OFF**: 指定宽度和小数位数应取格式名称的默认值，而不是模板。\n- **USER_NAME=ON | OFF**: 如果列定义和数据集均未指定，则使用列名作为表头。\n\
    \n"
