  - "[PAGE 10]\n\n# # Styles-And Overriding\n\nStyle Overriding, or 'style layering',\
    \ means that a style in a report is overridden by another style that is applied\
    \ later. The following example shows a sample of what you can do with overriding\
    \ styles.\n\nThis example changes the color of data cells in the table without\
    \ using cell-level attributes. This is made possible because any style applied\
    \ later will override a style applied earlier.\n\nAll traffic cells applied using\
    \ 'traffic' style is a way to change the appearance of all traffic cells at once,\
    \ without having to style each cell individually.\n\n```\n```javascript\nvar traffic\
    \ = {\n  color: 'red';\n};\n```\n```\n\nStyle overriding consists of two parts:\
    \ the style name (applied) and the style attributes (overridden). The example\
    \ below shows how these parts of the style work together.\n\n```\n```javascript\n\
    var traffic = {\n  name: 'traffic';\n};\n```\n```\n\nBy using a style name that\
    \ is already defined in the theme, the default styles are overridden. You can\
    \ use any style name for your purpose. This is a good way to override styles in\
    \ your report without having to define a new style.\n\nWhen you want to override\
    \ a style in your report, you can look at this sample table example to demonstrate\
    \ overriding styles. The example below demonstrates overriding styles.\n\n```\n\
    ```javascript\nvar traffic = {\n  name: 'traffic';\n  color: 'red';\n};\n```\n\
    ```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_10_0.png)\n\n| | | | | | |\n|---|---|---|---|---|-|\n\
    | Jan | 10 | 20 | 30 | 40 | |\n| Feb | 20 | 30 | 40 | 50 | |\n| Mar | 30 | 40\
    \ | 50 | 60 | |\n| Apr | 40 | 50 | 60 | 70 | |\n| May | 50 | 60 | 70 | 80 | |\n\
    | Jun | 60 | 70 | 80 | 90 | |\n\nStyle overrides are more interesting than static\
    \ cells. In this example, we applied a style to data cells. The table template\
    \ was used for the overall style. For now, we used a different template for the\
    \ data cells in order to easily compare the values of the same name.\n\nHere is\
    \ the output from the example above. Note the header and the table that are still\
    \ in the default style. The content of the data cells was changed by the override\
    \ style.\n\nWe can also create this report by using a new element with the style\
    \ attributes used above, which means adding a new template. For example, we use\
    \ a different template instead of the previous example. Then we add a new style\
    \ template with the element attributes.\n\n```\n```javascript\nvar traffic = {\n\
    \  name: 'traffic';\n  color: 'red';\n};\n```\n```\n\nNow the table from the previous\
    \ example must be modified to follow the header style. We also need to specify\
    \ this new style template on the DOM.\n\n```\n```javascript\nvar traffic = {\n\
    \  name: 'traffic';\n  color: 'red';\n};\n```\n```\n\nHere is the output:\n\n\
    ![](img/f42c8ff43e199c1b82aa844e9d40e211_10_1.png)\n\nUsing this method in this\
    \ manner allows us to control all the traffic cells in the report. If we want\
    \ to change the appearance of all the cells in the override, we only have to do\
    \ it in one place. If we don't have the traffic attribute, we would have to style\
    \ all the cells in the report individually. See the next section for dynamic attributes.\n\
    \n# # Dynamic-Style Attributes\n\nDynamic attributes are values of a style that\
    \ are not specified in the cell. For example, the color of a cell can depend on\
    \ the value of the cell at that moment."
  md: "\n## Using Pre-Defined Styles\n\nIt may be safe to assume that SAS comes with\
