    ## 关于本书


    PROC TEMPLATE 教程：一本帮助 SAS 用户理解 PROC TEMPLATE 威力的指南。所有 SAS 过程都使用这种模板语言来描述输出表格，并用于创建用于样式的自定义报告和图形，其功能与
    Base 过程一样强大。


    ### 这本书适合你吗？


    如果你希望学习更多关于创建自定义报告以及如何使用 PROC TEMPLATE 创建新设计的内容，


    ### 本书范围


    需要 ODS 的基础知识。


    本书涵盖了表格和模板的理论，并详尽介绍了如何使用 PROC TEMPLATE 创建自定义报告。书中穿插许多示例，以帮助你理解相关概念。


    第 1 章“引言”解释了如何使用 SAS TEMPLATE 定义表格的结构。第 2 章“在 SAS 报告中使用表格”解释了如何使用 SAS TEMPLATE
    语言对 ODS 输出进行样式设置。书中详细解释了表格的主体。第 3 章解释了如何创建书中涵盖的“数据依赖型”和“数据不依赖型”表格。


    ### 第 3 章：“创建和自定义表格”，


    本章涵盖了所有类型的表格，包括头、页脚、样式以及如何在 ODS 输出中对其进行样式设置。书中提供了表格示例，以及如何使用 PROC TEMPLATE 和 PROC
    GREPORT 来创建这些表格。


    ### 第 4 章：“模板管理”，


    本章解释了如何使用 ODS 路径传递模板，以及你如何在工作环境中移动它们。到本书为止，用于创建设计和显示模板的 PROC TEMPLATE 每个部分都将在本章中演示。


    ### 附录 A：“与 SAS 旧版本的兼容性”，


    附录 A 提供了不同 SAS 版本之间样式的兼容性表。


    ### 附录 B：“SAS/GRAPH 中的颜色值”，


    附录 B 提供了你可能在报告使用的 SAS/GRAPH 颜色值列表。


    ### 本书未涵盖的内容


    本书未涵盖其他内容。


    '
