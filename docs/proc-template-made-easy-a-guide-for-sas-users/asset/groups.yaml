  mdcn: "\n\n# 模板结构\n\n无论每个模板语言的对象和选项是什么，它们本质上都是通过 DEFINE 定义的。这种结构可以被认为是一个简单的对象包。对象是与等号\
    \ (=) 关联的键值对，其中名称在左侧，值在右侧。根据模板语言定义，对象可以包含其他对象和选项。某些模板允许嵌套对象，而嵌套对象也可以包含嵌套对象。其他内容始终可以被视为一组独特的对象和选项的包。\n\
    \n假设我们想要一个模板来描述一个杂货购物车。购物车包含几袋杂货。袋中的物品是独立的对象，不包含其他对象。\n\n一个典型购物车的图形化表示如下所示。\n\n\
    ![](img/f42c8ff43e199c1b82aa844e9d40e211_4_0.png)\n\n首先是对图 1 或更新更新内容的回答。今天就订阅。[查看定价选项](#)\n\
    \n在上面的图片中，你看到购物车里有两袋杂货。其中一袋有一个物品，另一个袋有两个物品。右侧的图表是该图像的区块表示。现在，让我们把购物车的图形表示映射到 PROC\
    \ TEMPLATE 中。\n\n如前所述，对象是由 DEFINE 和 END 语句定义的。要将购物车的图形表示转换为代码，你只需要为要创建的每个类型的对象使用“DEFINE”和“END”块。END\
    \ 语句完成模板。DEFINE 语句定义了要创建的对象类型。\n\n```\nPROC TEMPLATE:\n\nDEFINE shopping_cart:\n\
    \  DEFINE bag:\n    DEFINE item;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE\
    \ item;\n    END;\n  END;\n  DEFINE item;\n  END;\n  END;\n\nRUN;\n```\n\n这与编写良好的\
    \ PROC TEMPLATE 代码非常接近。仍然缺失的各个部分与每个对象的名称相关联。在任何模板中，DEFINE 语句必须建立关联。名称可以由数字、列表和点\
    \ (.) 组成，并且在特定范围内必须是唯一的（例如，在购物车内的多个袋子必须必须在袋子内具有唯一名称）。在上述代码中添加名称后可以得到如下结果：\n\n\
    ```\nPROC TEMPLATE:\n\nDEFINE SHOPPING_cart:\n\n  DEFINE bag:\n    DEFINE item\
    \ milk;\n      QTY = 2;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE item lettuce;\n\
    \    END;\n    DEFINE item oranges;\n      TYPE = ORANGE;\n      QUANTITY = 10;\n\
    \    END;\n  END;\n\n  END;\n\nRUN;\n```\n\n如果你以前见过任何真实的 PROC TEMPLATE 代码，上面的结构看起来会非常熟悉。唯一缺失的是对象内部的影响每个模板行为的选项和语句。让我们为杂货物品添加一些选项，以使这个示例变得完整。\n\
    \n```\nPROC TEMPLATE:\n\nDEFINE SHOPPING_cart:\n\n  DEFINE bag:\n    DEFINE item\
    \ milk;\n      QTY = 2;\n    END;\n  END;\n  DEFINE bag:\n    DEFINE item lettuce;\n\
    \    END;\n    DEFINE item oranges;\n      TYPE = ORANGE;\n      QUANTITY = 10;\n\
    \    END;\n  END;\n\n  END;\n```\n\n本课程的内容纯粹是假设性的，因为不存在所谓的结构化购物车。这里还有一个额外的语句，但它将演示所有模板是如何从对象、选项和语句构建而成的。\n\
    \n1. 模板由 DEFINE 和 END 语句定义。\n2. 对象由 DEFINE 定义。\n3. 范围内的对象必须具有唯一的名称。\n\n# 模板类型\n\
    \n有不同类型的模板可用，例如表格（Table）、图形（Graph）和 Taglet。每种都有其作用。考虑到这一点，模板设计的唯一规则就是保持数据并使用模板。即使有独立的模板，它们也可以被拆分为更小的组件。\n\
    \n- 映射到独立数据集的独立模板\n- 不映射到数据集的独立模板\n\n\n\n## 数据依赖型\n\n数据依赖模板包括表格、图形和 Taglet 模板。这些中的每一个都使用数据集来生成输出。\n\
    \n- 基于观测值的输出的模板。\n- 基于实体的输出的模板。\n\n基于观测值控制模板输出比基于实体的控制模板输出要先进得多，因为 ODA 数据步非常难以理解。我们将从一组更容易理解的复杂模板开始。该方法是定义并渲染模板。下表是一个表格示例。\n\
    \n```\nPRINT:\n  template: table_class\nclass:\n  data: dataset_1\n```\n\n原始代码显示了如何使用\
    \ PRINT_CLASS 将 TABLECLASS 映射到表格。你也可以使用 PRINT 或 PRINT_CLASS 来实现下所示的操作。\n\n```\n\
    PRINT:\n  template: table_class\nclass:\n  data: dataset_1\n```\n\n使用这种方法，原始代码如下：\n\
    \n```\nPRINT:\n  template: table_class\nclass:\n  data: dataset_1\n  output: table_class\n\
    ```\n\n使用 PRINT_CLASS 和 PRINT_TEMPLATE 的唯一区别是前者会将模板保存到磁盘。如果你想在不保存到磁盘的情况下使用模板，请使用\
    \ PRINT_NULL。你也可以根据需要将模板存储在内存中。\n\n```\nPRINT_NULL:\n  template: table_class\n\
    data: dataset_1\n```\n\n这是一个由 TAGLET 生成的图形示例。我们使用的模板是：\n\n```\nGRAPH:\n  template:\
    \ graph_class\nclass:\n  data: dataset_1\n```\n\n![](img/f42c8ff43e199c1b82aa844e9d40e211_5_0.png)\n\
    \n图形也能快速吸引读者，因此多个 SAS 书籍出现在主题上。所以值得注意的是，与其说是主题，我们将参考这些内容对该模板进行完整解释。\n\n## 数据独立型\n\
    \n数据独立型模板包括表格模板和 Taglet 模板。这些中的每一个都定义了为 ODA 输出类型生成的输出。其他模板类型使用数据集产生数据和输出。\n\n\
    表格和 Taglet 模板都由全局 ODA 语句处理。你可以告诉 ODA 使用模板。\n\n虽然标签是模板的一种，但它们也可以被视为一种编程语言。Taglet\
    \ 定义了输出的标记，包括 HTML、XML、PDF 等。Taglet 模板负责生成布局，在大多数情况下布局是由 HTML 创建的。然而，taglet 的渲染输出所示。\n\
    \n![](img/f42c8ff43e199c1b82aa844e9d40e211_5_1.png)\n\n# 结\n\n通过对各种模板语言和基本模板结构的概述，你应该对\
    \ PROC TEMPLATE 有一个高层次的理解。接下来的章节将深入探讨表格模板、样式模板和模板管理。最后，附录包含了关于 SAS 版本之间兼容性的非常有价值的信息、视觉样式属性引用以及可以在\
    \ PROC TEMPLATE 样式中 SAS/GRAPH 颜色表。现在，让我们进入更多的主题材料。\n\n1. 模板存储是保存模板的文件。\n2. Tagset\
    \ 模板并不用于列出输出。\n3. 对于存储在 Styles 文件夹中的样式，不需要 STYLE= 选项中指定“styles”前缀。该文件夹会自动检查。\n\
    \n"
