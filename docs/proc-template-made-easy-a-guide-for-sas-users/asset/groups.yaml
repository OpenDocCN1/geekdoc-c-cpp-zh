    int score = 100;\n```\n\n现在让我们来看看如何在一行内声明多个变量：\n\n```csharp\nint x = 10, y = 20,\
    \ z = 30;\n```\n\n最后，让我们来看看如何声明常量。常量是在赋值后值无法更改的变量。\n\n```csharp\nconst double\
    \ PI = 3.14159;\n```\n\n变量经常用于表格。这里是一个简单的示例：\n\n| 类型 | 说明 | 示例 |\n| --- | ---\
