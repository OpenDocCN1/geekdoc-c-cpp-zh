    Hello\" |\n| bool | 存储真或假 | true |\n\n在声明变量后，你可以在代码中使用它：\n\n```csharp\nint age\
    \ = 25;\nConsole.WriteLine(age);\n```\n\n你也可以这样更改变量的值：\n\n```csharp\nint age =\
    \ 25;\nage = 26;\nConsole.WriteLine(age);\n```\n\n变量还有作用域。作用域定义了程序中可以访问变量的区域。\n\
    \nC# 中三种类型的作用域：局部、类和全局。\n\n- 局部变量：在方法或块内声明。\n- 类变量：声明在类内部，但在任何方法之外。\n- 全局变量：声明在任何类之外。\n\
    \n以下是局部变量的示例：\n\n```csharp\nvoid MyMethod() {\n    int x = 5;\n    Console.WriteLine(x);\n\
