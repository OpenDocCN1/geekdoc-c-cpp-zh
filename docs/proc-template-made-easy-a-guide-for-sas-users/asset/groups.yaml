  - '[PAGE 29]


    # Running PROC TEMPLATE Examples


    While the examples in this book work for many versions of SAS, if you have SAS
    9.3, you can simplify most of them. We have mentioned the addition of PROC ODSTABLE
    in SAS 9.3, which combines the steps of compiling a template and binding it to
    a data set into a single step. The following code snippets are essentially equivalent.:


    ```

    /* Using PROC TEMPLATE */nPROC TEMPLATE;

    DEFINE TABLE mytable;

    COLUMN name age height;

    END;

    RUN;


    %render(mytable, sashepclass);

    ```


    ```

    /* Using PROC ODSTABLE */

    PROC ODSTABLE DATA = sashepclass;

    COLUMN name age height;

    RUN;

    ```


    The primary difference between the two methods above is that in the PROC TEMPLATE
    code, the table template will remain on disk, whereas PROC ODSTABLE creates a
    temporary table definition that is discarded once the table has been rendered.


    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    NAME= option. The following code snippets give equivalent behavior:


    ```

    /* Using PROC TEMPLATE */

    PROC TEMPLATE;

    DEFINE TABLE mytable;

    COLUMN name age height;

    END;

    RUN;

    ```


    ```

    /* Using PROC ODSTABLE */

    PROC ODSTABLE NAME = mytable;

    COLUMN name age height;

    RUN;

    ```'
  - '[PAGE 30]


    # Styles


    PROC TEMPLATE elements changed in SAS 9.2. There are many changes that were replaced
    with simple code like the previous version. The changes to PROC TEMPLATE attributes
    in SAS 9.2 allow be more consistent with CSS property names, the capability of
    creating multiple style elements simultaneously, and the addition of CSS styles
    rather than PROC TEMPLATE attributes though not all has been done in the examples
    to make them more pre-9.2 friendly.


    # Using Style Sheets (CSS)


    CSS support was not added until SAS 9.2. This was a completely new feature, so
    there is no way to mimic this behavior. Now you can use the SAS Enterprise Guide
    Style Editor to create styles that work with ODS output types.


    Find answers on the fly, or master something new. Subscribe today. See pricing
    options.


    | background | background/color |

    | bottommargin | marginbottom |

    | bullet | liststyle |

    | cellheight | height |

    | cellwidth | width |

    | font_face | fontFamily |

    | font_size | fontsize |

    | font_style | style |

    | font_weight | fontweight |

    | font_width | fontwidth |

    | foreground | color |

    | htmclass | class |

    | htmcontentype | contentype |

    | htdctype | doctype |

    | indent | textindent |

    | just | textalign |

    | leftmargin | marginleft |

    | fontweight | height |

    | outpwidth | width |

    | rightmargin | marginright |

    | topmargin | margintop |

    | valign | verticalalign |


    # Defining Multiple Style Elements Simultaneously


    In SAS 9.2, it became possible to define multiple style elements at the same time
    by separating the style element names with comma, as shown below.


    ```

    DEFINE style1;

    STYLE data=analysis, datastrong /

    COLOR = BLACK;

    END;

    ```


    This was not possible prior to SAS 9.2, but you can now define each separately
    to get the same effect.


    ```

    DEFINE style1;

    STYLE data;

    COLOR = BLACK;

    STYLE data=analysis /

    COLOR = BLACK;

    STYLE datastrong /

    COLOR = BLACK;

    END;

    ```


    # Inheritance


    The inheritance mechanism was completely re-written in SAS 9.2. This was not only
    to mimic the behavior of the new inherited model, but to solve the problems you
    encountered with the old model when you had to use style definitions without inheritance.


    # The Class Statement


    The CLASS statement did not exist prior to SAS 9.2. Since the CLASS statement
    is a shortcut for STYLE name from member = ; it is just a matter of changing your
    syntax to using the STYLE statement instead.


