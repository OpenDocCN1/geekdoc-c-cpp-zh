  mdcn: "\n\n# 变量声明\n\n变量是用于存储数据值的容器，这些值可以在程序中被更改和使用。在 C# 中声明变量，你使用类型后跟变量名。\n\n```csharp\n\
    int age = 25;\ndouble price = 19.99;\nstring name = \"John Doe\";\nbool isStudent\
    \ = true;\n```\n\n上面的示例显示了四种类型的变量：int、double、string 和 bool。每种类型定义了变量可以包含的数据类型。\n\
