    \ 10\n    cout << \"\\n\";\n}\n```\n\n+   STEP 3 Multiplication and division can\
    \ be applied as such:\n\n```\n#include <iostream>\nusing namespace std;\nint main\
    \ () {\n    float numbers = 100;\n    numbers = numbers * 10; // This multiplies\
    \ 100 by 10\n    cout << \"\\n\";\n    numbers = numbers / 10; // And divides\
    \ 1000 by 10\n    cout << \"\\n\";\n}\n```\n\n+   STEP 2 While simple, it does\
