    >>> a=2

    >>> print(a)

    2

    >>> b=2

    >>> print(b)

    2

    >>> print(a+b)

    4

    ```


    # 第 7 步


    你可以尝试不同类型的变量和函数。例如，你可以为某人的名字赋值：


    ```python

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

