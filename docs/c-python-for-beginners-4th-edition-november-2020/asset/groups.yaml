    # 操作系统特定需求


    C++ 可以在任何操作系统上运行，但对于初学者来说，汇齐所有必要的组件可能会令人困惑。以下是针对 C++ 的操作系统特定说明。


    ## LINUX


    Linux 用户很幸运，因为他们的操作系统中已经内置了编译器和文本编辑器。任何文本编辑器都可以允许你编写 C++ 代码，当将其保存为 .cpp 扩展名时，使用
    g++ 对其进行编译。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_0.png)


    ## WINDOWS


    我们之前提到过，一个好的 IDE 是微软的 Visual Studio。然而，更好的 IDE 和编译器是 Code::Blocks，它会根据新的发布年份定期保持更新。否则，Windows
    用户可以在 Notepad++ 中输入代码，然后通过 Code-Blocks 使用 MinGW 进行其编译。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_1.png)


    ## RASPBERRY PI (树莓派)


    树莓派的操作系统是 Raspian，它是基于 Linux 的。因此，你可以使用文本编辑器编写代码，然后像在任何 Linux 发行版中一样使用 g++ 进行编译。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_2.png)


