    2

    >>> print(a+b)

    4

    >>> name="David"

    >>> print(name)

    ```


    # 第 8 步


    让我们加一个姓氏：

    surname="Hayward"

    print(surname)


    你有两个包含名和姓的变量，可以独立地打印它们。


    ```python

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

