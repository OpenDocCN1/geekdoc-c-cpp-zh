    # HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly high above the hardware (also referred to as "the metal"). Languages
    that "fly to the metal," like Assembly, are called "low-level". Low-level languages
    read like this: `msg db low len eq - mid`


    # ZEN OF PYTHON


    Python lets access all the power of a computer in a language that humans can understand.
    Behind this is an ethos called "The Zen of Python." This is a collection of 20
    software principles that influence the design of language. Principles include
    "Beautiful is better than ugly", "Simple is better than complex", "Import this
    and display all your programs."


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_12_0.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is somewhat complicated by the existence
    of two active versions of the language: Python 3 and Python 2.


    - WORLD OF PYTHON

    When you visit Python Download you''ll notice there are two buttons available:
    for Python 3.6 and for Python 2.7.18; at the time of writing (remember Python
    is updated so you may use different version numbers).


    - PYTHON 3.X

    In 2008 Python 3 arrived with new and enhanced features. These features provide
    a more stable, effective and efficient environment but most (if not all) of these
    features are not compatible with Python 2. Not popular at first, Python 3 has
    since making the edge of Python programming.


    | Download the latest version for Windows | Download the latest version for Mac
    |

    | :--- | :--- |

    | Python 3.6 | Python 2.7.13 |


    Wondering which to use? Here''s more about the difference between Python 2 and
    3.

    Looking for Python with a different OS? Windows, Linux/Unix OS or Other.

    Want to test different versions of Python? Pre-releases


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_12_1.png)


    # PYTHON 2.X

    So why? Python 2 was launched in 2000 and has since adopted a large collection
    of modules, scripts, tutorials and so on. Over the years, Python 2 has become
    the first choice for Beginners and experts to choose, which makes it an extremely
    valuable resource.


    # PYTHON 3

    Python 3''s popularity has growing that its now standard to learn with the new
    features and begin past the previous version. Many development companies, such
    as SpaceX and NASA use Python 3 for important base.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_12_2.png)


    # Say Hello to Python


    ## How to Set Up Python in Windows


    Windows doesn''t come with Python 3.x preinstalled, so you''re going to install
    it yourself. Frankly, it''s an easy process to follow. While most seasoned developers
    may shun Windows as the platform for their code, it''s an ideal starting point
    for beginners.


    **STEP 1** Start by opening your browser to [www.python.org/downloads/](https://www.python.org/downloads/).
    Look for the download link for Python 3.x (in this case it is Python 3.6 but you
    may see later versions of 3).


    **STEP 2** Click the download button for version 3.x, and save the file to your
    Downloads Folder. When the file is downloaded, double-click the executable and
    the installer will launch. You have two choices: Install or Custom. We recommend
    opting for the Customise installation line.


    **STEP 3** Choosing the Customise option allows you to specify certain parameters,
    and whilst you may stay with the defaults, a good habit to avoid as sometimes
    (not with Python), installers may include unwanted features. On the next screen,
    ensure all boxes are ticked and click the next button.


    **STEP 4** The next page of options includes some interesting details about Python.
    Ensure the Associate file option, Add Python To Environment Variables, Precompiled
    Standard Library and Install for All users are ticked. This makes using Python
    much easier later on. Click Install when you''re ready to continue.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_0.png)

    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_1.png)

    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_2.png)

    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_3.png)


    **STEP 5** You may need to confirm with the Windows authentication notification.
    Simply click Yes and Windows will begin to install. Once the installation is complete
    the final Windows page will allow you to view the latest release notes, and some
    online tutorials.


    **STEP 6** Before you install the window, however, it''s best to click on the
    detailed Path Limit. This will allow Python to bypass 260 character limit, enabling
    you to execute programs stored in deep folders. Again, click Yes to activate the
    process; then you can Close the installation.


    **STEP 7** Windows 10 users will need to find the Python 3.x in the Start section.
    The first link, Python 3.6 (32-bit) will install the command line version of Python
    when clicked (more on that in a moment). To open IDLE, type IDLE into Windows.


    **STEP 8** Clicking on the IDLE (Python 3.6 32-bit) link will launch the Python
    Shell, where you can begin your Python journey. Don''t worry if your version is
    newer, as it''s Python 3.x will work inside your Python 3 interface.


    **STEP 9** If you now click on the Start button again, and this time is CMD, you''ll
    be presented with Command Prompt. Click it to get to the Windows command line.
    Enter "python" in the command line, and you need to type and press Enter.


    **STEP 10** The command line version of Python works in the same as the Shell
    you opened in Step 8; note the left-facing arrows (>>>). While it''s a perfectly
    fine environment, it''s not too user-friendly, so leave the command line for now.
    Enter exit() to leave and close the Command prompt.


    ```

    Python 3.6.2 (Windows v3.6.2:02fd33, Jul 8 2017, 08:14) [MSC V1900 32 bit (Intel)]

    Type "copyright", "license" for more information.

    >>>

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_14_0.png)


    ```

    Command Prompt

    Windows [Version 10.0.15063]

    (c) 2017 Microsoft Corporation. All rights reserved.

    C:\Users\davidpython> python

    Python 3.6.2 (tags/v3.6.2), Jul 8 2017, 08:14 [MSC V1900 32 bit]

    Type "copyright", "license" for more information.

    >>>

    C:\Users\davidpython>

    ```


    ```

    Command Prompt

    Windows [Version 10.0.15063]

    (c) 2017 Microsoft Corporation. All rights reserved.

    C:\Users\davidpython> python

    Python 3.6.2 (tags/v3.6.2), Jul 8 2017, 08:14 [MSC V1900 32 bit]

    Type "copyright", "license" for more information.

    >>>

    C:\Users\davidpython>

    ```


    IDLE (Python 3.6 32-bit)

    Desktop app

    Search results


    ## Setup successful


    Special thanks to Mark Hammond, whose years of freely shared Windows distribution,
    Python would be still for DOS.


    Now to Python! Start the online tutorial documentation.


    See what''s new in this release.


    - Disable length limit

    Changes your machine configuration to allow programs, including Python, to bypass
    the 260 character "MAX_PATH" limitation.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_14_0.png)


    ## How to Set Up Python on a Mac


    If you''re running an Apple Mac, then setting up Python is incredibly easy. In
    fact a version of Python is 2.5.1 already installed. However, you should make
    sure you''re running the latest version.


    Apple''s operating system comes with Python installed, so you don''t need to install
    it separately. However, Apple doesn''t update Python often and you''re probably
    running an older version. It makes sense to check and update first.


    **STEP 1** Open a new Terminal window by clicking Go > Utilities, then double-click
    the Terminal icon. Now enter --version You will see "Python 2.5.1" or even later,
    if Apple has updated the OS and Python installation. Either way, it''s best to
    check for the latest.


    **STEP 2** Open Safari and head over to www.python.org/downloads. With the Windows
    on the previous pages, you will see two download buttons: for Python 3.6.2, and
    for Python 2.7.13. Note, that version numbers may be different due to the frequent
    releases of Python.


    **STEP 3** Click on the latest version of Python 3.x, in our case this is the
    download for Python 3.6.2. This will automatically download the latest version
    of Python and depending on how you''ve got your Mac configured, it automatically
    starts the installation.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_15_0.png)


    | Download the latest version for Mac OS |

    | :--- | :--- |

    | Python 3.6.2 | Python 2.7.13 |


    Wondering which version to use? Here''s more about the difference between Python
    2 and 3.

    Looking for Python with a different OS? Windows, Linux, macOS, or Other.

    Want to test development versions of Python? Pre-releases


    **STEP 4** With the Python installation window, click the Continue button to begin
    the installation. It''s worth a moment to read through the Important Information
    section, as it contains something that applies to your version of macOS. When
    ready, click continue again.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_15_3.png)

