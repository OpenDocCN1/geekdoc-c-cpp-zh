    - **步骤 3** 准备好后，点击 Get（获取）变为 Install（安装）。输入你的 Apple ID，Xcode 开始下载和安装。这取决于你的网络速度。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_51_0.png)


