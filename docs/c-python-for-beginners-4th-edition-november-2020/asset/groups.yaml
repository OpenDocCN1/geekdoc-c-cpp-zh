    \ |\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_46_0.png)\n\n# 向 C++ 问好\n\n# 需要的设备\n\
    \n你不需要投入大量的资金学习 C++，也不需要整个计算机实验室。只要你有一台相当现代的计算机，其他一切都可以实现。\n\n# C++ 设置\n\n大多数（如果不是所有）操作系统中都包含\
    \ C++，因此可以推断无论你当前使用什么操作系统都可以学习 C++。\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_47_0.png)\n\
    \n- 计算机除非你喜欢在纸上手写 C++ 代码（这是以前程序员的做法），否则计算机是必须的。PC 用户可以使用任何 Linux 发行版，Mac 用户可以使用最新的\
    \ macOS。\n\n- 一个 IDE 就像 Python 一样，IDE 用于输入和执行你的 C++ 代码。许多 IDE 使用扩展和插件来帮助工作或添加额外功能。通常，IDE\
    \ 会根据所使用的内核提供增强，例如针对 Windows 10 的增强。\n\n- 编译器 编译器是将 C++ 语言转换为二进制的程序，以便计算机理解。虽然某些\
    \ IDE 内置了编译器，但另一些没有。我们喜欢的 IDE 带有一个编译器。\n\n- 文本编辑器 某些程序员倾向于使用文本编辑器组装他们的 C++ 代码，然后通过编译器运行。基本上你可以使用任何文本编辑器编写代码，只需将其保存为\
    \ .cpp 扩展名。然而，Notepad++ 是目前最好的文本编辑器之一。\n\n- 访问互联网 虽然在未连接互联网的计算机上学习编程完全可行，但极其困难。你需要安装相关软件、保持其更新、安装任何额外的或扩展并在编码时使用它们寻求帮助。这些都需要访问互联网。\n\
    \n- 时间和耐心 是的，和 Python 一样，你将需要投入大量时间学习用 C++ 编程。遗憾的是，除非你是天才，否则这不会在一夜之间甚至一周内完成。优秀的\
    \ C++ 程序员花费了许多时间磨练他们的技能，所以请耐心，从小处开始并持续学习。\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_47_1.png)\n\
    \n"
