    >>> name="David"

    >>> print(name)

    >>> surname="Hayward"

    >>> print(surname)

    >>> print(name+surname)

    DavidHayward

    ```


    # 第 10 步


    在 Python 3 中你可以用逗号分隔变量：


    print(name, surname)


    或者，你可以自己添加空格：


    print(name+" " +surname)


    使用逗号要整洁得多。恭喜，你刚刚进入了 Python 世界。


    ```python

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> name="David"

    >>> print(name)

    >>> surname="Hayward"

    >>> print(surname)

    >>> print(name, surname)

    David Hayward

    ```


    # 保存并执行你的代码


    虽然在 IDLE Shell 中工作对于小型代码片段是完美的，但它并不是为了输入程序列表设计的。在本节介绍 IDLE Editor，从现在起将在那里工作。


    # 编辑代码


    你最终会达到一个需要在 Shell 中输入代码行的阶段。相反，IDLE Editor允许你保存并执行 Python 代码。


