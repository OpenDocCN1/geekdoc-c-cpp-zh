    \ use on a daily basis, which makes it a complex and extraordinarily powerful\
    \ language to get to grips with. In this section, we look at how to install a\
    \ C++ IDE and compiler on your computer.\n\n# Why C++?\n\nC++ is one of the most\
    \ popular programming languages, called C with Classes, the language was renamed\
    \ C++ in 1983. It's an extension of the original C language and is a general purpose\
    \ object-oriented (OOP) environment.\n\n# C EVERYTHING\n\nDue to how complex the\
    \ language can be, and its power and performance, C++ is often used to develop\
    \ games, device drivers and even entire operating systems.\n\nDating back to 1970,\
    \ the start of the golden era of home computing, C++, or rather C with Classes,\
    \ was the brainchild of Danish computer scientist Bne Stroustrup while working\
    \ on his PhD thesis. Stroustrup's plan was to further the original C language,\
    \ which was widely used since the early seventies in computing labs and by regular\
    \ people who didn't have access to the mainframes and large data centres.\n\n\
    C++'s impact in the digital world is immense. Many of the programs, applications,\
    \ games and even operating systems, such as C++, are coded using C++. All of Adobe's\
    \ major applications, such as Photoshop, InDesign and so on, are developed in\
    \ C++. You will find that the browser you surf the Internet on is written in C++,\
    \ as well as Windows 10, Microsoft Office and the backbone to Google's search\
    \ engine. Apple's macOS is written largely in C++ (with some\n\nC++ proved to\
    \ be popular among the developers of the '80s, since it was a much easier environment\
    \ to get grips with and more importantly, it was 99% compatible with the original\
    \ C language. This meant that it could be used beyond the mainstream.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_45_0.png)\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nvoid main() {\n    char ch;\n\
