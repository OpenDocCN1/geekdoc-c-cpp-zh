    >>> b=2

    >>> print(b)

    2

    >>> print(a+b)

    4

    ```


    # 第 6 步


    最后一步的输出包含了 a 和 b 的单独值，正如你要求打印它们那样。如果你想将它们相加，可以使用：


    print(a+b)


    这段代码简单地获取 a 和 b 的值，将它们相加并输出结果。


    ```python

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

