    \n步骤 6 第一点是，Xed 会自动识别它为 C++ 文件，因为文件扩展名现在设置为 `.cpp`。代码中出现了颜色高亮，如果你打开文件管理器，你还可以看到文件上盖有该文件的图标。\n\
