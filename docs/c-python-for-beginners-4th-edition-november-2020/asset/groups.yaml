    # 如何在 Linux 上安装 Python


    大多数 Linux 发行版已经安装了 Python 2.x 版本，但我们将使用 Python 3.x，我们首先需要做一些工作来获取它。坦率地说，这并不困难。


    ## LINUX 企鹅


    Linux 是一个如此多功能的操作系统，因此很难确定执行某件事的唯一方法。不同的发行版以不同的方式安装软件，因此在本教程中我们将坚持使用 Linux Mint
    18.1。


    - 第 1 步：首先，你需要确定你的 Linux 系统中当前安装了哪个版本的 Python；如前提到的，本节将使用 Linux Mint 18.1。对于 macOS，通过按下
    Ctrl+Alt+T 进入终端。


    - 第 2 步：接下来在终端中输入：`python --version`。你应该会在显示器上看到与 Python 2.x 版本相关的输出。在特定情况下，它是
    Python 2.7.12。


    - 第 3 步：某些 Linux 发行版会在系统更新时自动将 Python 安装更新到最新版本。要检查，首先进行系统更新和升级：

    `sudo apt-get update && sudo apt-get upgrade`

    输入密码并让系统执行任何更新。


    ```

    File Edit View Search Terminal Help

    david@david-mint -- $

    ```


    ```

    File Edit View Search Terminal Help

    david@david-mint -- --version

    Python 2.7.12

    david@david-mint -- $ sudo apt-get update && sudo apt-get upgrade

    [sudo] password for david:

    ```


    - 第 4 步：更新完成后，你可能需要回答“Y”来授权你的更新，输入：`python3 --version` 查看 Python 3.x 是否已更新或安装。在
    Linux Mint 中，我们拥有 Python 3.5.2，这对于我们的目的足够了。


    ```

    File Edit View Search Terminal Help

    david@david-mint -- $ python --version

    Python 2.7.12

    david@david-mint -- $

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_17_0.png)


    第 5 步：然而，如果你想要最新版本（根据写作时 Python 网站的 3.6.2），你需要首先在终端输入这些命令：


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev libssl-dev

    sudo apt-get install libbz2-dev libsqlite3-dev tk-dev

    sudo apt-get install libdbm-dev libdb6-dev

    ```


    - 第 6 步：打开你的 Linux 浏览器并进入下载页面：www.python.org/downloads。点击 Python 3.6.2（或你需要的任何版本）下载源码
    Python-3.6.2.tar.gz。


    - 第 7 步：在终端中，进入下载的源码目录：`tar -xvf Python-3.6.2.tar.gz`。然后进入新编译的目录`cd Python-3.6.2/`。


    - 第 8 步：在 Python 文件夹内，输入：

    `./configure`

    `sudo make altinstall`

    这取决于你电脑的配置可能会有些不同。完成后，运行 `python3 --version` 安装的版本。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_18_0.png)


    - 第 9 步：对于 IDLE，你需要在终端输入：

    `sudo apt-get install idle3`

    可以通过命令 `idle3` 启动 IDLE。注意 IDLE 运行的版本与从源码安装的版本不同。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_18_1.png)


    - 第 10 步：你还需要 PIP（Python 安装包），它可以帮助你安装更多模块：

    `sudo apt-get install python3-pip`

    完成后，通过你的发行版可以使用 Python 3.x。


