    # 你的代码


    基本上，你已经通过上一个教程中的 `print("Hello everyone")` 编写了你的第一段代码。然而，让我们扩展一下，看看输入你自己的代码并尝试一些其他的
    Python 示例。


    ## 玩转 Python


    对于大多数语言（无论是计算机语言还是人类语言），核心都在于并在合适的场合应用正确的词汇。你并不是生来就知道这些的，所以你需要学习它们。


    - **第 1 步** 如果你关闭了 Python IDLE，请在 Shell 中重新打开它，无论你偏于哪种操作系统版本。尝试以下操作：


    print("Hello")


    ```python

    Python 3.4.2 Shell

    File Edit Shell Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> 6.9 on Linux

    >>> type("credits" or "license") for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    ```


    - **第 3 步** 你可以看到输出不是数字 4，而是你要求在 Shell 中打印的 2+2。引号定义了输出到 IDE Shell 的内容：


    print("2+2")


    ```python

    Python 3.4.2 Shell

    File Edit Shell Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> 6.9 on Linux

    >>> type("credits" or "license") for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    ```


    - **第 2 步** 正如预测的那样，单词 Hello 以蓝色文本的形式出现在 Shell 中，表示这是字符串的输出。这非常简单，不需要太解释。现在尝试：


    print("2*2")


    ```python

    Python 3.4.2 Shell

    File Edit Shell Debug Options Windows Help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> 6.9 on Linux

    >>> type("credits" or "license") for more information.

    >>> print("Hello")

    Hello

    >>> print(2*2)

    4

    ```


    你可以继续这样操作，向 Shell 打印 2+2、464+2344 等。一种更简单的方法是使用变量，我们稍后会详细介绍。现在，输入：


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_23_0.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_23_1.png)


    # 第 5 步


    你在这里做的是给字母 a 和 b 赋值：2 和 2。这些是新变量，只要它们的数字不变，就可以调用 Python 进行输出、加法、减法、除法等。尝试这个：


    print(b)


    ```python

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> print("hello")

    hello

    >>> print(2+2)

    4

    >>> a=2

    >>> print(a)

