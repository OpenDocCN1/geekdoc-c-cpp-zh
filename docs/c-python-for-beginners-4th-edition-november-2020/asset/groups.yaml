    C++ IDE 是 Code::Blocks。


    ### CODE::BLOCKS


    Code::Blocks 是一个免费的 C++、C 和 Fortran IDE，功能丰富且可以通过插件轻松扩展。它易于使用，自带编译器，并且有一个活跃的社区支持。


    - **步骤 1** 访问 Code::Blocks 网站：www.codeblocks.org/downloads。从那里，点击“Download the
    binary releases”链接获取 Windows 的最新下载版本。


    - **步骤 3** 找到文件后，点击行末尾的 Sourceforge.net 链接，会出现一个下载通知窗口；点击 Save 下载并将可执行文件保存到你的电脑上。找到下载的
    Code:Blocks 安装程序并双击开始运行。按照屏幕上的指令开始安装。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_49_0.png)


