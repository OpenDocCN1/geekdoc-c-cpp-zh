    Mac 所有者需要下载并安装 Xcode 来原生编译他们的 C++ 代码。macOS 的其他选项还包括 NetBeans、Eclipse 或 Code::Blocks。注意：由于缺乏
    Mac 开发人员，Mac 无法使用最新的 Code::Blocks。


