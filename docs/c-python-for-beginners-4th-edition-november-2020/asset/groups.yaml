    Editor，你可以在其中创建未来所需的程序。


    - **第 2 步** IDLE Editor 从本质上来说是一个具有 Python 功能（如编码等）的简单文本编辑器；类似于 Sublime。你像在 Shell
    中一样输入代码，参考上一个教程的示例，输入：


    - **第 3 步** 你可以看到 IDLE Editor 中和 Shell 中有相同的颜色编码，这让你更好地理解代码发生了什么。然而，要执行代码，你需要先保存它。按下
    F5 会打开一个 Save... 框。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_25_0.png)


    - **第 4 步** 点击 Save 框中的 OK，选择保存所有 Python 代码的地方。目的地可以是一个空闲文件夹，你也可以把它放在任何喜欢的地方。但请保持驱动器整洁，以便以后使用。


