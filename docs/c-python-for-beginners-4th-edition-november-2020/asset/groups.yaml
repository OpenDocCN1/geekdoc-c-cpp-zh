    4

    >>> name="David"

    >>> print(name)

    >>> surname="Hayward"

    >>> print(surname)

    ```


    # 第 9 步


    如果我们按照之前的相同程序使用 `+` 符号，name 不会在 Shell 中正确显示。你需要在它们之间使用空格，将它们定义为独立的变量。


    ```python

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

