    # Getting Started with Python


    Getting started with Python may seem a little daunting at first but the language
    has been designed with simplicity. Like most things, you need to start slowly,
    learn how to get what you want from the code. In this section, we cover variables,
    expressions, user input, conditions and loops; and types of errors you may come
    across.


    # Starting Python for the First Time


    We''re going to be using the Raspberry Pi as our hardware platform. The latest
    version of Raspbian comes preinstalled with Python 3, version 3.4.2 to be exact,
    so long as you have a version 3 Shell, all our code will work.


    # STARTING PYTHON


    We''re not going to go into the details of getting the Raspberry Pi up and running;
    however once you''re ready, fire up your Pi and get ready for coding.


    - STEP 1: With the Raspbian desktop loaded, click on the Menu followed by Programming
    > Python 3 IDLE. This opens the Python 3 Shell. Windows and Mac users can find
    the Python 3 IDLE from the Windows Start menu and via Finder.


    - STEP 2: The Shell is where you can enter code and see the responses and output
    of code you''ve generated. This is a kind of sandbox where you''re able to try
    out simple code and processes.


    - STEP 3: For example, in the Shell enter: `2+2` after pressing Enter, the next
    line displays the answer: 4. Basics, Python has taken your ''code'' and produced
    the relevant output.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_21_0.png)


    - STEP 4: The Shell acts very much like a calculator, since code is a series of
    mathematical interactions with the system. Integers, which are the infinite sequence
    of numbers, can be added, subtracted, multiplied and so on.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> on linux

    >>> type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    ```


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> on linux

    >>> type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    >>> 2345*64545232

    1509444000000

    >>> 64545232*12343

    796793393376

    >>> 98726898*43904

    4334333333392

    >>> 506472823538

    ```


    STEP 5: While that''s very interesting, it''s not particularly exciting. Instead,
    try this:


    ```python

    print("Hello everyone!")

    ```


    Just like the code you entered in Sublime in Installing a Text Editor of this
    book.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_22_0.png)


    STEP 8: The Python IDLE is a configurable environment. If you don''t like the
    ways you are represented, then you can change any way Options > Configure IDE
    and clicking on the Highlighting tab. We do not recommend, as you won''t be seeing
    them as screenshots.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_22_1.png)


    STEP 6: This is a little more like it, since you''ve produced your first bit of
    code. self-explanatory. It prints things. Python 3 requires the brackets as well
    as order to output to the screen, in this case the ''hello everyone'' example.


    ```

    >>> print("Hello everyone!")

    Hello everyone!

    >>> |

    ```


    STEP 9: Just like most programs, regardless of the operating system, there are
    numerous shortcuts. We don''t have room for all but within the Options > Configure
    IDLE and the Keys tab, you can see one of the current bounds.


    STEP 7: You have noticed the colour coding within the Python IDLE. The colours
    represent different elements of them code.


    | Black - Data and variables | Blue - User Functions |

    | Green - Strings | Red - Comments |

    | Purple - Functions | Light - Error Messages |

    | Orange - Commands |


    STEP 10: The Python IDLE is a power interface and one that''s actually written
    in Python using one of the available Qt kits. If you want to know many ins of
    the Shell, we recommend a few menus to which details of the docs.python.org/3/library/idle.html
    detail the IDLE''s features.


