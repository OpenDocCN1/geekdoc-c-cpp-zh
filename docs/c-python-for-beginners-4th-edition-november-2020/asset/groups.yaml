    STEP 5: However, if you want the latest version, 3.6.2 as per the Python website
    at the time of writing, you need to start by entering these commands into the
    Terminal:


    ```

    sudo apt-get install build-essential checkinstall

    sudo apt-get install libreadline-dev libssl-dev

    sudo apt-get install libbz2-dev libsqlite3-dev tk-dev

    sudo apt-get install libdbm-dev libdb6-dev

    ```


    STEP 6: Open up your Linux browser and go to the download page: www.python.org/downloads.
