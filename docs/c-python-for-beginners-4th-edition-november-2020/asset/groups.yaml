    \n```\nword=input(\"Please enter a four-letter word: \")\nif len(word) == 4:\n\
    \    print(word,\" is a four-letter word. Well done.\")\nelif len(word) == 3:\n\
    \    print(word,\" is a three-letter word. Try again.\")\nelse:\n    print(word,\"\
    \ is not a four-letter word.)\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_0.png)\n\
    \n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_1.png)\n\n# LOOPS\n\nA loop looks\
    \ quite similar to a condition but they are somewhat different in their operation.\
    \ A loop will run through the same block of code multiple times, with the support\
    \ of a condition.\n\n# STEP 1\n\nLet's start with a simple While statement. Like\
    \ IF, this will check if something is TRUE, then the indented code:\n\n```\nx\
    \ = 0\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_2.png)\n\
    \n# STEP 3\n\nThe loop is another example. For is used to loop over a range of\
    \ data, a list listed inside square brackets. For example:\n\n```\nwords=[\"Cat\"\
    ,\"Dog\",\"Unicorn\"]\nfor word in words:\n    print(word)\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_3.png)\n\
    \n# STEP 2\n\nThe difference between if and while is when the indented code finishes,\
    \ it goes back and checks the condition is still true. In an example x is less\
    \ than 10. With loop it prints the current value of x, then adds one to value.\
    \ When x eventually equals 10 stops.\n\n# STEP 4\n\nThe loop can also be used\
    \ in the countdown example by using the range function:\n\n```\nfor x in range(1,\
    \ 10):\n    print(x)\n```\n\nThe x=1 is not here because the range function creates\
    \ a list from first and last numbers.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_4.png)\n\
    \n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_5.png)"
