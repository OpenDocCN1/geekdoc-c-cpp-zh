    \ Xed，你可以通过点击菜单并在搜索栏输入 Xed 来启动它。点击右侧面板中的“文本编辑器”（Text editor）打开它。\n\n```\ndavid-mate:~\n\
    david-mate~$ sudo apt-get update && sudo apt-get upgrade\n[sudo] password for\
