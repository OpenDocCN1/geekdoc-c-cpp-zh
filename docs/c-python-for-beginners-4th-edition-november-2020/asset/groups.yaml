    \ 2** 大多数 Linux 发行版都预装了开始 C++ 编码所需的所有组件；但检查是否一切齐齐总是值得的。在终端终端中，输入 `sudo apt-get\
    \ install --build-essential` 并按回车。如果正确，则没有需要安装的内容；如果缺少，请按照下面的步骤操作。\n\n- **步骤 4**\
    \ 在 Xed 或你可能使用的任何其他文本编辑器中，输入你的 C++ Hello World 代码行。它与 Mac 生成的略有不同：\n\n```\ndavid-mate:~\n\
    david-mate~$ sudo apt-get update && sudo apt-get upgrade\nReading package lists...\
    \ Done\nReading state information... Done\nBuilding dependency tree... Done\n\
    You now have the latest version installed (12.04 ubuntu)\nbuild-essential is now\
    \ manually installed.\nTo upgrade, use apt upgrade. To remove not to upgrade.\n\
    david-mate~$ \n```\n\n```cpp\n#include <iostream>\nint main() {\n  // My first\
    \ C++ program\n  std::cout << \"Hello World!\\n\";\n}\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_53_1.png)\n\
    \n步骤 5 当你输入代码后，点击“文件” > “另存为”，并选择一个文件夹保存你的程序。将文件命名为 `hello.cpp`（只要扩展名是 `.cpp`，可以是任何名称）。点击“保存”继续。\n\
    \n步骤 8 在执行 C++ 文件之前，你需要对其进行编译。在 Linux 中，同样是使用 `g++`，这是一个开源 C++ 编译器；如果你和 C++ 文件在同一文件夹中，在终端中输入：`g++\
