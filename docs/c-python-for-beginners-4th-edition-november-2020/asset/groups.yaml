    ## Executing Code from the Command Line


    Although we''re working from the GUI throughout this book, it''s worth taking
    a look at Python''s command line handling. We already know there''s a command
    line version of Python but it''s also used to execute code.


    ## COMMAND THE CODE


    Using the code in the previous tutorial, one we named hello.py, let''s see how
    you can run code that was made in the GUI at the command line level.


    - **STEP 1** Python, in Linux, comes with two possible ways of executing via the
    command line. One of the ways is with Python 2, whilst the other uses the Python
    3 libraries and so on. First though, drop into the command line or Terminal on
    your operating system.


    - **STEP 3** Now you''re at the command line we can start Python. For Python 3
    you need to enter the command line version of the Shell, which will put you into
    the familiar three arrows as the cursor (>>).


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_27_0.png)


    - **STEP 2** Just as before, Raspberry Pi: We''re using Windows will need to click
    the Start button and search for cmd, then click the Command Line returned search;
    and macOS users can get access to their command line by clicking Go > Utilities
    > Terminal.


    - **STEP 4** From here you''re able to enter the code you''ve looked at previously,
    such as:


    ```python

    print(a)

    ```


    You can see that it works exactly the same.


    ```python

    @raspberrypi:~$ python3

    Python Copyright, Oct 19 2014, 13:31:11

    [GCC] 4.9.2 on linux

    Type help, ''credits'' or ''license'' for more information.

    >>> print(a)

    5

    ```


    | Command Prompt |

    | :--- | :--- |

    | cmd | see web results |


    ## Executing Code from the Command Line


    STEP 5 Now enter: exit() to leave the command line session and return you back
    to the command prompt. Enter the folder where you saved the code from the previous
    tutorial and list the files within; hopefully you see the hello.py.


    STEP 8 The result of running Python 3 code from the Python 2 code is quite obvious.
    While it doesn''t error out in any way, due to the differences between the way
    Python 3 handles the Print command over Python 2, the result is not as you expect.
    Using Sublime for the moment, open the hello.py file.


    ```

    File Edit Tabs Help

    python 4.2 (default) Oct 10 2014, 13:31:11

    >>> hello

    >>> print(''copyright'', ''credits'' or ''license'' for more information.

    >>> print()

    >>> print()

    >>> exit()

    >>> ls 5 Documents/

    rasberrypi~/Documents/Python code/

    rasberrypi~/Documents/Python code $ 5

    rasberrypi~/Documents/Python code $ python3 hello.py

    rasberrypi~/Documents/Python code $

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_28_0.png)


    STEP 6 From the same line as the code you''re going to run, enter into the following
    command line:

    python3 hello.py


    This will execute the code we created, which means you will:

    Python is cool print(a, b, c)


    STEP 9 Since Sublime Text isn''t available for the Raspberry Pi, you''re going
    to temporarily leave the Pi for the moment and use Sublime as an example that
    you don''t need to use Python IDLE. With the hello.py file, open it to the following:


    ```python

    name="What is your name?"

    print("hello", name)

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_28_1.png)


    STEP 7 Naturally, if you use Python 3, the syntax and layout that you used to
    in Python 3 will still work. If you try to run the code with Python 2 by entering:

    python hello.py


    ```

    File Edit Tabs Help

    python 4.2 (default) Oct 10 2014, 13:31:11

    >>> hello

    >>> print(''copyright'', ''credits'' or ''license'' for more information.

    >>> print()

    >>> print()

    >>> exit()

    >>> ls 5 Documents/

    rasberrypi~/Documents/Python code/

    rasberrypi~/Documents/Python code $ 5

    rasberrypi~/Documents/Python code $ python3 hello.py

    rasberrypi~/Documents/Python code $

    ```


    STEP 10 Save the hello.py file and drop back to the command line. Now execute
    the newly saved

    python3 hello.py


    The result will be the original Python 3 code! still, together with the added
    input command for your name, and displaying in the command window.


    ```

    File Edit Tabs Help

    rasberrypi~/Documents/Python code $ 5 python3 hello.py

    hello.py

    David What is your name?

    rasberrypi~/Documents/Python code $

    ```


    ## Numbers and Expressions


    We''ve seen some basic mathematical expressions with Python, simple addition and
    the like. Let''s expand on that and see just how powerful Python is as a calculator.
    You can work within the IDLE Shell or in the Editor, whichever you like.


    ## IT''S ALL MATHS, MAN


    You can get some impressive results with the mathematical powers of Python; with
    most, if not all, programming languages, it is math to drive the force


    - **STEP 1** Open the GUI version of Python 3, as mentioned at time being, you''re
    going to use the Shell or the Editor to warm up your muscle, which is a small
    gland located at the back of the (or not).


    - **STEP 3** You can use all the mathematical operations: divide, multiply, brackets
    and so on. Practise with a few, for example:


    ```

    1/2

    2*3

    (1-2)+(3*4)

    ```


    ```

    Python 3.4.2 Shell

    Python 3.4.2 (default. Oct 19 2014, 13:31:11)

    (GCC 4.9.1) on linux

    >>> "copyright", "credits" and "license" for more information.

    >>> 2+2

    ```


    - **STEP 3** You can use all the mathematical operations: divide, multiply, brackets
    and so on. Practise with a few, for example:


    ```

    1/2

    2*3

    (1-2)+(3*4)

    ```

