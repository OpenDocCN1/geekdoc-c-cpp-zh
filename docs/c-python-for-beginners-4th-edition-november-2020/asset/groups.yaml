- md: "\n# Conditions and Loops\n\nConditions and loops are what make a program interesting;\
    \ they can be simple or rather complex. How you use them depends greatly on what\
    \ the program is trying to achieve; they could be the number of lives left in\
    \ a game or just displaying a countdown.\n\n## TRUE CONDITIONS\n\nKeeping conditions\
    \ simple to begin with learning to program a more enjoyable experience. Let's\
    \ start then by checking something is TRUE, then doing else if it isn't.\n\n-\
    \ STEP 1: We create a new Python program that will ask the user to input a word,\
    \ then check to see if it's a four-letter word or not. Start with File = New File,\
    \ and with your input:\n\n```python\nword=input(\"Please enter a four-letter word:\
    \ \")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_39_0.png)\n\n- STEP 3:\
    \ You can use an if statement to check if the word is friendly and print a confirmation\
    \ if it applies to the rule:\n\nThe double equals (==) means check if something\
    \ is something else.\n\n- STEP 2: We can create a new variable, then use the len\
    \ function and pass the word through it to get the total number of letters the\
    \ user has entered:\n\n```python\nword=input(\"Please enter a four-letter word:\
    \ \")\nword_length=len(word)\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_39_1.png)\n\
    \n- STEP 4: The colon at the end of if tells Python that if something is true\
    \ everything after the colon is indented. Next, move the cursor back to the beginning\
    \ of\n\n```python\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print(\"\")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_39_2.png)\n\
    \n- STEP 5: Press F5 and save the code to execute. Enter a four letter word in\
    \ the Shell to begin with, you should have the returned message that it's word\
    \ is four letters. Now Press F5 and run the program this time a five-letter word.\
    \ The Shell will display that it's not a four-letter word.\n\n- STEP 6: Now expand\
    \ the code to include other conditions. Eventually, it could become quite complex.\
    \ We've added a condition for three-letter words:\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nif len(word) == 4:\n    print(word,\" is\
    \ a four-letter word. Well done.\")\nelif len(word) == 3:\n    print(word,\" is\
    \ a three-letter word. Try again.\")\nelse:\n    print(word,\" is not a four-letter\
    \ word.\")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_0.png)\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_1.png)\n\
    \n# LOOPS\n\nA loop looks quite similar to a condition but they are somewhat different\
    \ in their operation. A loop will run through the same block of code multiple\
    \ times, with the support of a condition.\n\n- STEP 1: Let's start with a simple\
    \ While statement. Like IF, this will check if something is TRUE, then the indented\
    \ code:\n\n```python\nx = 0\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\
    \n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_2.png)\n\n- STEP 3: The loop is\
    \ another example. For is used to loop over a range of data, a list listed inside\
    \ square brackets. For example:\n\n```python\nwords=[\"Cat\",\"Dog\",\"Unicorn\"\
    ]\nfor word in words:\n    print(word)\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_3.png)\n\
    \n- STEP 2: The difference between if and while is when the indented code finishes,\
    \ it goes back and checks the condition is still true. In an example x is less\
    \ than 10. With loop it prints the current value of x, then adds one to value.\
    \ When x eventually equals 10 stops.\n\n- STEP 4: The loop can also be used in\
    \ the countdown example by using the range function:\n\n```python\nfor x in range(1,\
    \ 10):\n    print(x)\n```\n\nThe x=1 is not here because the range function creates\
    \ a list from first and last numbers.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_4.png)\n\
    ![](img/ed6cd144194c0d6151a39d9bac5b687c_40_5.png)\n\n# Getting Started with Python\n\
    \n# Python Modules\n\nWe've mentioned modules previously, (The math module) but\
    \ as are such a large part of getting the most from Python, it's worth dedicating\
    \ a little more time to them. In this instance we're using the Windows version\
    \ of Python 3.\n\n# MASTERING MODULES\n\nThink of modules as an extension that's\
    \ imported into your Python code to enhance and extend its capabilities. There\
    \ are countless modules as we've seen, you can even make your own.\n\n- STEP 1:\
    \ Although good, the builtin functions within Python limited. The use of modules,\
    \ however, allows us to make more sophisticated programs. As you are aware, modules\
    \ are Python scripts that are imported, such as import.\n\n- STEP 3: The result\
    \ is an error in the IDLE Shell, as the Python module isn't recognised or installed\
    \ in Python. To install a module we can use PIP (Pip Installed Packages). Close\
    \ down the IDLE Shell and drop into a command prompt, enter:\n\n`pip install pygame`\n\
    \n```\nPython 3.6 Shell\nFile Edit Save Options Window Help\nPython 3.6.2 (v3.6.2:0553b5,\
    \ Jul 6 2017, 08:14:34) [MSC v.1900 32 bit (Intel)]\n```\n\n- STEP 2: Some modules,\
    \ especially math, are included by default, others are not.\n\n- STEP 4: The colon\
    \ at the end of if tells Python that if something is true everything after the\
    \ colon is indented. Next, move the cursor back to the beginning of\n\n```python\n\
    word=input(\"Please enter a four-letter word: \")\nword_length=len(word)\nif word_length\
    \ == 4:\n    print(\"\")\n```\n\n- STEP 5: Press F5 and save the code to execute.\
    \ Enter a four letter word in the Shell to begin with, you should have the returned\
    \ message that it's word is four letters. Now Press F5 and run the program this\
    \ time a five-letter word. The Shell will display that it's not a four-letter\
    \ word.\n\n- STEP 6: Now expand the code to include other conditions. Eventually,\
    \ it could become quite complex. We've added a condition for three-letter words:\n\
    \n```python\nword=input(\"Please enter a four-letter word: \")\nif len(word) ==\
    \ 4:\n    print(word,\" is a four-letter word. Well done.\")\nelif len(word) ==\
    \ 3:\n    print(word,\" is a three-letter word. Try again.\")\nelse:\n    print(word,\"\
    \ is not a four-letter word.\")\n```\n\n# Python Modules\n\nWe've mentioned modules\
    \ previously, (The math module) but as are such a large part of getting the most\
    \ from Python, it's worth dedicating a little more time to them. In this instance\
    \ we're using the Windows version of Python 3.\n\n- STEP 5: Close the command\
    \ prompt and relaunch the IDLE Shell. When you now enter, the module will be imported\
    \ into.\n\n- STEP 8: The modules contain the extra code needed to achieve a certain\
    \ result within your code, as we've experimented with. For example:\n\n```python\n\
    import random\nimport math\n\nfor i in range(5):\n    print(random.randint(1,25))\n\
    \nprint(math.pi)\n```\n\n- STEP 9: The result is a string of random numbers followed\
    \ by the value of Pi as pulled from the math module using the print(math.pi).\
    \ You can also pull in functions from a module using the import and commands,\
    \ such as: from random randint for i in range(5): print(random.randint(1,25))\n\
    \n- STEP 7: This code, saved and executed, will display random numbers from 1\
    \ to 25. You can play around to display more or less, from a greater or lesser\
    \ range. For example: import random for i in range(25): print(random.randint(1,100))\n\
    \n- STEP 10: This helps create a more streamlined approach to programming. You\
    \ can also import module*, however, it is often regarded as a waste of resources\
    \ but it might work nonetheless. modules can be imported as aliases: import math\
    \ as m print(m.pi)\nOf course, adding comments help to tell what's going on.\n"
  mdcn: "\n\n# 条件与循环\n\n条件和循环让程序变得有趣；它们可以很简单，也可以相当复杂。你如何使用它们很大程度上取决于程序试图实现的目标；它们可以是游戏中剩余的生命值，或者仅仅是显示倒计时。\n\
    \n## 真条件\n\n在开始学习编程时，保持条件简单会让过程变得更加愉快。让我们先从检查某项是否为真（TRUE），如果不是则执行其他操作开始。\n\n-\
    \ 步骤 1：我们创建一个 Python 程序，要求用户输入一个单词，然后检查它是否为四字母单词。从文件（File）新建文件（New File）开始，输入：\n\
    \n```python\nword=input(\"Please enter a four-letter word: \")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_39_0.png)\n\
    \n- 步骤 3：你可以使用 if 语句来检查单词是否“友好”，如果符合规则则打印确认信息：\n\n双等号 (==) 表示检查某物是否等于另一个某物。\n\n\
    - 步骤 2：我们可以创建一个新变量，然后使用 `len` 函数并将单词传递给它，以获取用户输入的字母总数：\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_39_1.png)\n\
    \n- 步骤 4：if 结尾的冒号告诉 Python，如果某项为真，冒号之后的所有内容都要缩进。接下来，将光标移回开头：\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(\"\")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_39_2.png)\n\
    \n- 步骤 5：按 F5 并保存代码以执行。在 Shell 中输入一个四字母单词开始，你应该会收到该单词是四个字母的回。。现在按 F5 运行程序，这次输入一个五字母单词。Shell\
    \ 将显示它不是四字母单词。\n\n- 步骤 6：现在扩展代码以包含其他条件。最终，它可能会变得非常复杂。我们为三字母单词添加了一个条件：\n\n```python\n\
    word=input(\"Please enter a four-letter word: \")\nif len(word) == 4:\n    print(word,\"\
    \ is a four-letter word. Well done.\")\nelif len(word) == 3:\n    print(word,\"\
    \ is a three-letter word. Try again.\")\nelse:\n    print(word,\" is not a four-letter\
    \ word.\")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_0.png)\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_1.png)\n\
    \n# 循环\n\n循环看起来和条件非常相似，但在运行机制上有所不同。循环会在条件的支持下多次运行同一代码块。\n\n- 步骤 1：让我们从简单的 While\
    \ 语句开始。像 IF 一样，它会检查某项是否为真，然后执行缩进的代码：\n\n```python\nx = 0\nwhile x < 10:\n    print(x)\n\
    \    x = x + 1\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_2.png)\n\n\
    - 步骤 3：For 是另一个例子。用于遍历数据范围（即方括号内列出的列表）。例如：\n\n```python\nwords=[\"Cat\",\"Dog\"\
    ,\"Unicorn\"]\nfor word in words:\n    print(word)\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_3.png)\n\
    \n- 步骤 2：if 和 while 的区别在于，当缩进代码完成后，它会返回检查条件是否仍然为真。在示例中 x 小于 10。循环中，它打印 x 的当前值，然后将值加1。当\
    \ x 最终等于 10 时停止。\n\n- 步骤 4：循环也可以通过使用 `range` 函数用于倒计时示例：\n\n```python\nfor x in\
    \ range(1, 10):\n    print(x)\n```\n\n这里没有 x=1 是因为 `range` 函数从第一个数字到最后一个数字创建一个列表。\n\
    \n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_4.png)\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_5.png)\n\
    \n# 入门 Python\n\n# Python 模块\n\n我们之前提到过模块（math 模块），但由于它们是充分利用 Python 的很大一部分，值得花更多时间在它们身上。在本例中，我们使用的是\
    \ Windows 版本的 Python 3。\n\n# 精通模块\n\n将模块想象为导入你的 Python 代码的扩展，以增强和扩展其功能。正如我们所看到的，有无数模块，你甚至可以创建自己的。\n\
    \n- 步骤 1：虽然 Python 内置函数很好用，但是有限的。然而，模块的使用允许我们编写更复杂的程序。如你所知，模块是被导入的 Python 脚本，例如\
    \ `import`。\n\n- 步骤 3：结果是在 IDLE Shell 中报错，因为 Python 模块未被识别或安装。要安装模块，我们可以使用 PIP（Pip\
    \ 安装 Packages）。关闭 IDLE Shell 进入命令提示符，输入：\n\n`pip install pygame`\n\n```\nPython\
    \ 3.6 Shell\nFile Edit Save Options Window Help\nPython 3.6.2 (v3.6.2:0553b5,\
    \ Jul 6 2017, 08:14:34) [MSC v.1900 32 bit (Intel)]\n```\n\n- 步骤 2：某些模块（尤其是 math）是默认包含的，其他不是。\n\
    \n- 步骤 4：if 结尾的冒号告诉 Python，如果某项为真，冒号之后的所有内容都要缩进。接下来，将光标移回开头：\n\n```python\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(\"\")\n```\n\n- 步骤 5：按 F5 并保存代码以执行。在 Shell 中输入一个四字母单词开始，你应该会收到该单词是四个字母的回。。现在按\
    \ F5 运行程序，这次输入一个五字母单词。Shell 将显示它不是四字母单词。\n\n- 步骤 6：现在扩展代码以包含其他条件。最终，它可能会变得非常复杂。我们为三字母单词添加了一个条件：\n\
    \n```python\nword=input(\"Please enter a four-letter word: \")\nif len(word) ==\
    \ 4:\n    print(word,\" is a four-letter word. Well done.\")\nelif len(word) ==\
    \ 3:\n    print(word,\" is a three-letter word. Try again.\")\nelse:\n    print(word,\"\
    \ is not a four-letter word.\")\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_40_0.png)\n\
    ![](img/ed6cd144194c0d6151a39d9bac5b687c_40_1.png)\n\n# Python 模块\n\n我们之前提到过模块（math\
    \ 模块），但由于它们是充分利用 Python 的很大一部分，值得花更多时间在它们身上。在本例中，我们使用的是 Windows 版本的 Python 3。\n\
    \n- 步骤 5：关闭命令提示符并重新启动 IDLE Shell。现在现在进入时，模块将被导入。\n\n- 步骤 8：模块包含了在你的代码中实现特定结果所需的额外代码，正如我们实验过的。例如：\n\
    \n```python\nimport random\nimport math\n\nfor i in range(5):\n    print(random.randint(1,25))\n\
    \nprint(math.pi)\n```\n\n- 步骤 9：结果是一系列随机数，随后是通过 `print(math.pi)` 从 math 模块提取的\
    \ Pi 值。你也可以通过 `import` 和命令从模块中引入函数，例如：`from random randint for i in range(5):\
    \ print(random.randint(1,25))`\n\n- 步骤 7：这段代码保存并执行后，将显示 1 到 25 之间的随机数。你可以尝试显示更多或更少，从更大或更小的范围。例如：`import\
    \ random for i in range(25): print(random.randint(1,100))`\n\n- 步骤 10：这有助于创建更简洁的编程方法。你也可以导入模块*，然而，这通常被认为是浪费资源，但它可能有效。模块可以作为别名导入：`import\
    \ math as m print(m.pi)`\n当然，添加注释有助于说明正在发生什么。\n\n"
