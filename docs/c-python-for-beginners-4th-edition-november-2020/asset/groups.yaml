    ## C++ 基础


    ## 编译与执行


    你已经创建了第一个 C++ 程序，现在你理解了其结构背后的基础知识。让我们实际行动起来，编译并执行（或者如果你愿意，也可以运行）该程序，看看它是什么样的。


    ## 来自 C++ 的问候


    在 Code::Blocks 中编译和执行 C++ 代码非常简单；只需点击图标并查看结果。以下是操作方法。


    - 步骤 1：如果还没有打开，请打开 Code-Blocks，并设置之前创建的 Hello World 程序。确保没有可见的错误，例如 `std::cout`
    行末尾缺少分号。


    - 步骤 3：从点击构建（Build）图标（黄色小牛图标）开始。此时，你的代码已经通过了 Code::Blocks 编译器的检查并检查任何错误。你可以通过查看底部窗格来查看构建结果。任何关于代码质量的消息都会在这里显示。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_63_0.png)


    - 步骤 2：如果你看到的界面与我们截图中的相似，请查看屏幕顶部的菜单栏。在顶部菜单的 Fortran 条目中，你会看到一组图标：黄色小牛、绿色按钮和一个代码/播放按钮。这些是运行（Run）、构建（Build）和运行（Run）功能。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_63_1.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_63_2.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_63_3.png)


    ## 步骤 5


    在命令行中按任意键即可关闭它，稍微修改你的 Code::Blocks 代码。让我们在 `#include` 行下方输入：


    ```cpp

    using namespace std;

    ```


    然后，删除 `cout` 行的部分，如下所示：


    ```cpp

    cout << "Hello, world\n";

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_64_0.png)


    ## 步骤 8


    在代码中故意创建一个错误。删除 `cout` 行中的分号，使其读取为：


    ```cpp

    cout << "Hello, world\n"

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_64_1.png)


    ## 步骤 6


    为了将更改应用到代码，我们需要重新编译、构建并运行它。但这一次，你只需点击构建/运行（Build/Run）图标（即黄色齿轮和绿色播放按钮的组合）。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_64_2.png)


    ## 步骤 9


    再次点击构建并运行以应用更改到代码。由于你插入错误，Code::Blocks 拒绝执行。在窗口底部的日志（Log）窗格中，你会被告知错误：Expected:
    '';'' before ''}'' token，指示缺少分号。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_64_3.png)


    ## 步骤 7


    正如我们在之前的页面中提到的，如果你已经在代码开头声明了 `using namespace std`，就不需要再使用 `std::cout` 了。我们可以很容易地点击构建/运行图标，但查看一下可用选项是值得的。你还可以看到通过构建和运行，文件已经保存。


    ## 步骤 10


    替换分号和 `cout` 行，在你的代码中添加新行：


    ```cpp

    cout << " Greetings from C++\n";

    ```


    `\n` 在输出文本的最后一行添加新行。构建并运行代码，以显示你的输出。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_64_4.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_64_5.png)


    ## 使用注释


    虽然在构成一个游戏甚至操作系统的许多行代码中，注释似乎是一个微不足道的元素，但实际上它们可能是最重要的因素之一。


    ## 注释的重要性


    代码内部的注释基本上是人类可读的描述，详细说明代码在某一点正在做什么。它们听起来不是特别重要，但无论你是专业人士还是初学者，没有注释都是编程中最令人沮丧的方面之一。


    简而言之，对代码进行注释的方式应该能够有效地描述一行代码、一个部分或单个元素的目的。你应该养成尽可能多注释的习惯，这样对编程一无所知的人也可以通过阅读你的代码来理解正在发生什么。


    在专业环境中，注释对代码的成功至关重要。在一个组织中，程序员与其他开发者一起工作。如果你正在编写软件，注释可以帮助其他团队成员理解并追踪问题。程序可能由成千上万行代码组成。如果你置于一个需要查找跨模块的
    80 万行代码中错误的位置，那么扫描每一行将会有帮助。最好的注释总是逻辑上连接代码，详细说明程序运行到这一行时发生了什么。你不需要对每一行都注释。然而，如果你写注释时考虑到读者，这种方法可以告诉你哪里是正确的。


