    \ It can be extremely complex and relatively simple.\n\n# C++ = MC?\n\nThe basic\
    \ mathematical symbols apply in C++ as they do in most other programming languages.\
    \ However, by using the C++ Library, you can also calculate square roots, powers,\
    \ trig and more.\n\n+   STEP 1 C++s mathematical operations follow the same patterns\
    \ as taught in school, in that multiplication and division take precedence over\
    \ addition and subtraction. You can alter that though. For now, create a new file\
    \ and enter:\n\n```\n#include <iostream>\nusing namespace std;\nint main () {\n\
    \    float numbers = 100;\n    numbers = numbers + 10; // This adds 10 to the\
