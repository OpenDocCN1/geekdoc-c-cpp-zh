    # 开始学习 Python


    刚开始学习 Python 可能看起来有些困难，但这种语言的设计非常简单。与大多数事情一样，你需要缓慢开始，学习如何从代码中获取你想要的内容。在本节中，我们将涵盖变量、表达式、用户输入、条件和循环；以及你可能会错误类型。


    # 首次启动 Python


    我们将使用树莓派作为硬件平台。Raspbian 的最新版本预装了 Python 3，具体来说是 3.4.2 版本，只要你有版本 3 Shell，我们所有的代码都可以运行。


    # 启动 PYTHON


    我们不会详细介绍启动树莓派的细节；但一旦你准备好了，启动你的 Pi 并准备好编码。


    - 第 1 步：加载 Raspbian 桌面后，点击菜单，然后选择 Programming > Python 3 IDLE。这会打开 Python 3 Shell。Windows
    和 Mac 用户可以通过 Windows 菜单和访达找到 Python 3 IDLE。


    - 第 2 步：Shell 是你可以输入代码并查看生成的代码的响应和输出的地方。这是一个你可以尝试简单代码和处理的沙盒。


    - 第 3 步：例如，在 Shell 中输入：`2+2` 并回车后，下一行显示答案：4。基础知识，Python 接收了你的“代码”并产生了相应的输出。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_21_0.png)


    - 第 4 步：Shell 的作用非常像计算器，因为代码是系统的一系列数学交互。整数（数字的无限序列）可以加、减、乘等。


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> on linux

    >>> type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    ```


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> on linux

    >>> type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    >>> 2345*64545232

    1509444000000

    >>> 64545232*12343

    796793393376

    >>> 98726898*43904

    4334333333392

    >>> 506472823538

    ```


    - 第 5 步：虽然那很有趣，但并不特别有趣。尝试这个：


    ```python

    print("Hello everyone!")

    ```


    就像你在本书《安装文本编辑器》中在 Sublime 里输入的代码一样。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_22_0.png)


    - 第 8 步：Python IDLE 是一个可配置的环境。如果你不喜欢你的表示方式，可以通过 Options > Configure IDE 并点击 Highlighting
    选项卡。我们不建议这样做，因为你不会在截图中看到它们。


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_22_1.png)


    - 第 6 步：这更像那么回事，因为你已经产生了第一段代码。自言其懂。它打印内容。Python 3 需要括号以及顺序来输出到屏幕，在本例中是“hello everyone”例子。


    ```

    >>> print("Hello everyone!")

    Hello everyone!

    >>> |

    ```


    第 9 步：和大多数程序一样，无论操作系统如何，有很多快捷键。我们没有空间列出所有的，但在 Options > Configure IDLE 的 Keys
    选项卡中，你可以看到当前的范围。


    第 7 步：你注意到了 Python IDLE 内部的颜色编码。颜色代表代码的不同元素。


    | Black - 数据和变量 | Blue - 用户函数 |

    | Green - 字符串 | Red - 注释 |

    | Purple - 函数 | Light - 错误消息 |

    | Orange - 命令 | |


    第 10 步：Python IDLE 是一个强大的界面，它是使用可用的 Qt 工具包用 Python 编写的。如果你想了解 Shell 的许多信息，我们推荐几个菜单，详情见
    docs.python.org/3/library/idle.html 介绍了 IDLE 的功能。


    # IDLE 颜色编码


