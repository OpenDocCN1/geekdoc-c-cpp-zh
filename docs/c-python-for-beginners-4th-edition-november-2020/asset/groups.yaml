    # How to Set Up Python in Linux


    Python version 2.x is already installed in most Linux distros but we''re going
    to be using Python 3.x, there''s a little work we need to do first to get hold
    of it. Frankly, it''s not too difficult.


    ## PYTHON PENGUIN


    Linux is such a versatile operating system that it''s often difficult to nail
    down one way of doing something. Different distributions go about installing software
    in different ways, so we will stick to Linux Mint 18.1 for this particular tutorial.


    - STEP 1: First you need to ascertain which version of Python is currently installed
    in your Linux system; as mentioned, we''re going to be using Linux Mint 18.1 for
    this section. With macOS, drop it into a Terminal by pressing Ctrl+Alt+T.


    - STEP 2: Next enter: `python --version` into the Terminal. You should have the
    output relating to version 2.x of Python in the display. In this particular case
    it is Python 2.7.12.


    - STEP 3: Some Linux distros will automatically update the installation of Python
    to the latest versions whenever the system is updated. To check, first do a system
    update and upgrade:

    `sudo apt-get update && sudo apt-get upgrade`

    Enter your password and let the system do any updates.


    ```

    File Edit View Search Terminal Help

    david@david-mint -- $

    ```


    ```

    File Edit View Search Terminal Help

    david@david-mint -- --version

    Python 2.7.12

    david@david-mint -- $ sudo apt-get update && sudo apt-get upgrade

    [sudo] password for david:

    ```


    - STEP 4: Once the update is complete, you may need to answer "Y" to authorise
    your updates, enter: `python3 --version` to see if Python 3.x is updated or installed.
    In the case of Linux Mint, we have Python 3.5.2 which is fine for our purposes.


    ```

    File Edit View Search Terminal Help

    david@david-mint -- $ python --version

    Python 2.7.12

    david@david-mint -- $

