    \ Connect to data using SQL | | |\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_46_0.png)\n\
    \n# Say Hello to C++\n\n# Equipment Needed\n\nYou don't need to invest a huge\
    \ amount of money to learn C++ and you don't need an entire computer lab. Providing\
    \ you have a fairly modern computer, everything else is available.\n\n# C++ SETUPS\n\
    \nMost, if not all, operating systems have C++ in their code, so it stands to\
    \ reason that you can learn to program no matter what OS you're currently using.\n\
    \n![](img/ed6cd144194c0d6151a39d9bac5b687c_47_0.png)\n\n- COMPUTER\nUnless you\
    \ fancy writing out your C++ code by hand on a sheet of paper (which is something\
    \ older coders used to do), a computer is an absolute must. PC users can have\
    \ any Linux distro or Windows Mac users use the latest macOS.\n\n- AN IDE\nJust\
    \ as with Python, an IDE is used to enter and execute your C++ code. Many IDEs\
    \ use extensions and plugins to help make work better, or add an extra level of\
    \ functionality. Often, an IDE provides enhancements depending on the core OS\
    \ being used, such as being enhanced for Windows 10.\n\n- COMPILER\nA compiler\
    \ is a program that converts the C++ language into binary, so that the computer\
    \ can understand. While some IDEs come with a compiler built in, others don't.\
    \ Our favourite IDE that comes with a C++ as part of the package.\n\n- TEXT EDITOR\n\
    Some programmers prefer to use a text editor to assemble their C++ code before\
    \ running it through a compiler. Essentially you can use any text editor to write\
    \ code, just save it with a .cpp extension. However, Notepad++ is one of the best\
    \ text editors available.\n\n- INTERNET ACCESS\nWhile it entirely possible to\
    \ learn how to code on a computer that's not attached to the Internet, it is extraordinarily\
    \ difficult. You need to install relevant software, keep it up to date, install\
    \ any extras or extensions and use them for help when coding. All of these require\
    \ access to the Internet.\n\n- TIME AND PATIENCE\nYes, with Python, you're going\
    \ to need to aside significant time to spend learning how to code in C++. Sadly\
    \ unless you're a genius, it's not going to overnight, or even a week. A good\
    \ C++ coder has spent many honing their craft, so be patient, start small and\
    \ keep learning.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_47_1.png)\n"
  mdcn: "\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_43_0.png)\n\n# 向 C++ 问好\n\n\
    C++ 是一种高级编程语言，被用于许多技术。从你喜欢的移动应用、控制台和 PC 游戏，到整个操作系统，全都是使用 C++ 以及一系列软件开发工具包（SDK）和自定义库开发的。\n\
    \nC++ 是你日常使用的大部分内容后的驱动力量，这使其成为一门复杂且极其强大的需要掌握的语言。在本节中，我们将介绍如何在你的计算机上安装 C++ IDE\
    \ 和编译器。\n\n# 为什么选择 C++？\n\nC++ 是最受欢迎的编程语言之一，曾被称为“带有类的 C”，它在 1983 年被重命名为 C++。它是原始\
    \ C 语言的扩展，是一个通用的面向对象（OOP）环境。\n\n# 关 C 的一切\n\n由于该语言的复杂性，以及其强大的功能和性能，C++ 常用于开发游戏、设备驱动程序甚至整个操作系统。\n\
    \nC++ 追溯到 1970 年（家用计算黄金时代的开始），C++，或者说“带有类的 C”，是丹麦计算机科学家 Bne Stroustrup 在撰写博士论文期间的结晶。Stroustrup\
    \ 的计划是进一步完善原始的 C 语言，该语言自 70 年代初以来已广泛应用于计算机实验室以及那些无法访问大型机和大型数据中心的普通人。\n\nC++ 对数字世界的影响是巨大的。许多程序、应用程序、游戏甚至操作系统（如\
    \ C++ 本身）都是使用 C++ 编写的。Adobe 的所有主要应用程序（如 Photoshop、InDesign 等）都是用 C++ 开发的。你会发现你上网的浏览器是用\
    \ C++ 编写的，Windows 10、Microsoft Office 以及 Google 搜索引擎的骨干也是。Apple 的 macOS 大部分是用\
    \ C++ 编写的（带有一些\n\nC++ 证明在 80 年代的开发者中非常受欢迎，因为它是一个更容易上手的环境，更重要的是，它与原始 C 语言有 99%\
    \ 的兼容性。这意味着它可以用于主流之外。\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_45_0.png)\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nvoid main() {\n    char ch;\n\
    \    cout<<\"Enter a character to check if it is vowel or not\";\n    cin >>ch;\n\
    \    switch (ch) {\n        case 'a': case 'A':\n            cout<<ch <<\" is\
    \ a Vowel\";\n            break;\n        case 'e': case 'E':\n            cout<<ch\
    \ <<\" is a Vowel\";\n            break;\n        case 'i': case 'I':\n      \
    \      cout<<ch <<\" is a Vowel\"\\n\";\n            break;\n        case 'o':\
    \ case 'O':\n            cout<<ch <<\" is a Vowel\"\\n\";\n            break;\n\
    \        case 'u': case 'U':\n            cout<<ch <<\" is a Vowel\"\\n\";\n \
    \           break;\n    }\n}\n```\n\n# 为什么选择 C++？\n\n安装 - Visual Studio 2017 (15.0.26223.1)，一个异步\n\
