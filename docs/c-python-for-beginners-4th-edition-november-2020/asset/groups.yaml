- md: "\n# How to Set Up C++ in Linux\n\nLinux is a great C++ coding environment.\
    \ Most Linux distros already have the essential components preinstalled, such\
    \ as a compiler and the text editors are excellent for entering code into colour\
    \ coding; and there are tons of extra software available to help you out.\n\n\
    ## LINUX++\n\nIf you're not familiar with Linux, we recommend taking a look at\
    \ one of our Linux titles from the BDM Publications range. If you have the Raspberry\
    \ Pi, the commands below work just fine and for this example we're using Linux\
    \ Mint.\n\n- **STEP 1** The first step is to ensure Linux is ready for your C++,\
    \ check the system and software are up to date. Open a terminal and type `sudo\
    \ apt-get update && sudo apt-upgrade`. Then press Return and enter your password.\
    \ These commands update the entire system and any installed software.\n\n- **STEP\
    \ 3** Amazingly, that's it. Everything is already ready for you to start coding.\
    \ Here's how to get your first C++ program up and running. In Linux Mint the main\
    \ text editor is Xed which you can launch by clicking on the Menu and typing Xed\
    \ into the search bar. Click on the Text editor in the right-hand pane to open\
    \ it.\n\n```\ndavid-mate:~\ndavid-mate~$ sudo apt-get update && sudo apt-get upgrade\n\
    [sudo] password for david: \n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_53_0.png)\n\
    \n- **STEP 2** Most Linux distros come preinstalled with all the necessary components\
    \ to start coding in C++; it's always worth checking to see if everything is present.\
    \ Still within the terminal, enter `sudo apt-get install --build-essential` and\
    \ press Return. If you have the right nothing is installed; if you're missing\
    \ them then follow the steps below.\n\n- **STEP 4** In Xed, or any other text\
    \ editor you may be using, enter the lines of code that make your C++ Hello World.\
    \ It's a little different from what the Mac produced:\n\n```\ndavid-mate:~\ndavid-mate~$\
    \ sudo apt-get update && sudo apt-get upgrade\nReading package lists... Done\n\
    Reading state information... Done\nBuilding dependency tree... Done\nYou now have\
    \ the latest version installed (12.04 ubuntu)\nbuild-essential is now manually\
    \ installed.\nTo upgrade, use apt upgrade. To remove not to upgrade.\ndavid-mate~$\
    \ \n```\n\n```\n#include <iostream>\nint main() {\n  // My first C++ program\n\
    \  std::cout << \"Hello World!\\n\";\n}\n```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_53_1.png)\n\
    \nSTEP 5 When you've entered your code, click File > Save As and choose a folder\
    \ to save your program. Name the file as hello.cpp (it can be any name as long\
    \ as it has .cpp as the extension). Click Save to continue.\n\nSTEP 8 Before you\
    \ execute the C++ file you need to compile it. In Linux it's the same to use g++,\
    \ an open source C++ compiler; if you're in the same folder as the C++ file, enter:\
    \ `g++ helloworld.cpp` in the Terminal and press Return.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_54_0.png)\n\
    \nSTEP 6 The first thing to notice is that Xed automatically recognises it as\
    \ a C++ file, since the file extension is now set to .cpp. The colouring is present\
    \ in the code and if you open the file manager you can also see the file's icon\
    \ stamped on it.\n\nSTEP 9 It takes a short time while the code is compiled by\
    \ g++ but providing there are no mistakes or errors in the code that you have\
    \ created return to the command prompt. The prompt of the code you have created\
    \ a new file. If you enter: `./a.out` into the Terminal you can see alongside\
    \ your C++ file is a.out.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_54_1.png)\n\
    \nSTEP 7 With your code now saved, drop it into the Terminal again. You need to\
    \ navigate to the location of the C++ file you just saved. Our example is in the\
    \ Documents folder, so navigate to it by entering `cd Documents`. Remember, Linux\
    \ is case sensitive, so anything must be entered correctly.\n\nSTEP 10 The file\
    \ is ready to compile the C++ code. To run the code enter: `./a` and press Return.\
    \ The words 'Hello World' appear on the screen. However, a.out isn't very friendly.\
    \ To make everything else look nice, you can recompile with: `g++ helloworld.cpp\
    \ -o helloworld` This creates an output file which can be run with: `./helloworld.\n\
    \n![](img/ed6cd144194c0d6151a39d9bac5b687c_54_2.png)\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_54_3.png)\n\
    \n# Other C++ IDEs to Install\n\nIf you want to try a different approach to working\
    \ with your C++ code, then there are plenty of options available to you.\n\n##\
    \ DEVELOPING C++\n\nIf you want to try a different approach to working with your\
    \ C++ code, then there are plenty of options available to you.\n\n- **ECLIPSE**:\
    \ It takes a short time while the code is compiled by g++ but providing there\
    \ are no mistakes or errors in the code that you have created return to the command\
    \ prompt. The prompt of the code you have created a new file. If you enter: `./a.out`\
    \ into the Terminal you can see alongside your C++ file is a.out.\n\n- **CODEITE**:\
    \ The first thing to notice is that Xed automatically recognises it as a C++ file,\
    \ since the file extension is now set to .cpp. The colouring is present in the\
    \ code and if you open the file manager you can also see the file's icon stamped\
    \ on it.\n\n- **NETBEANS**: The first thing to notice is that Xed automatically\
    \ recognises it as a C++ file, since the file extension is now set to .cpp. The\
    \ colouring is present in the code and if you open the file manager you can also\
    \ see the file's icon stamped on it.\n\n- **VISUAL STUDIO**: Microsoft's Visual\
    \ Studio is a mammoth IDE to create applications for Windows, Android, and iOS.\
    \ The Community version is free but there is a trial period.\n\n- **ANJUTA**:\
    \ AnjutaStudio is a Linux-only IDE that would normally find more advanced features\
    \ in a paid software. It has a GUI designer, source editor, interactive debugger.\n\
    \n- **QT CREATOR**: This cross-platform IDE is designed to create C++ applications\
    \ for desktop and mobile environments. It comes with code editor and integrated\
    \ tools for testing and debugging, as well as support for chosen platform.\n\n\
    - **MONODEVELOP**: This excellent IDE allows to write C++ code for desktop and\
    \ web applications across all the platforms. It's an advanced editor, integrated\
    \ debugger, and a configuration bench to help you create your code.\n\n- **U++**:\
    \ Ultimate++ is a cross-platform C++ IDE that boosts rapid development of code\
    \ with smart and aggressive use of C++. For the novice, it is a beast of an IDE\
    \ behind its complexity a beauty that would make a developer's knees worry.\n\n\
    (Note: The OCR text contained significant repetitions and garbled sentences in\
    \ the IDE section; the above represents the reconstructed structure based on the\
    \ context provided.)\n"
