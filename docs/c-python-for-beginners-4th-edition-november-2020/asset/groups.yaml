    # OS SPECIFIC NEEDS


    C++ will work in any operating system but getting all the necessary pieces together
    can be confusing to a newcomer. Here are some OS specifics for C++.


    ## LINUX


    Linux users are lucky in that they already have a compiler and text editor built
    into their operating system. Any text editor allows you to type out your C++ code,
    when it''s saved with a .cpp extension, use g++ to compile it.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_0.png)


    ## WINDOWS


    We have mentioned previously that a good IDE is Microsoft’s Visual Studio. However,
    a better IDE and compiler is Code::Blocks, which is regularly kept up to date
    with a new release year. Otherwise Windows users can enter their code in Notepad++,
    then compile it with MinGW by Code-Blocks.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_1.png)


    ## RASPBERRY PI


    The Raspberry Pi’s operating system is Raspian, which is Linux based. Therefore,
    you''re able to write your code using a text editor, then compile it with g++
    as you would in any Linux distro.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_2.png)


    ## MAC


    Mac owners will need to download and install Xcode to compile their C++ code natively.
    Other options for the macOS include NetBeans, Eclipse or Code::Blocks. Note: the
    latest Code::Blocks isn''t available for Mac due to a lack of Mac developers.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_3.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_48_4.png)


    ## How to Set Up C++ in Windows


    Windows users have a wealth of choice when it comes to programming in C++. There
    are plenty of IDEs and compilers available, including Visual Studio from Microsoft.
    However, in our opinion, the best C++ IDE to begin with is Code::Blocks.


    ### CODE::BLOCKS


    Code::Blocks is a free C++, C and Fortran IDE that is feature rich and easily
    extensible with plugins. It''s easy to use, comes with a compiler and a vibrant
    community behind it.


    - **STEP 1** By visiting the Code::Blocks site, at www.codeblocks.org/downloads.
    From there, click on the ''Download the binary releases'' link to be the latest
    downloadable version for Windows.


    - **STEP 3** When you''ve located the file, click on the Sourceforge.net link
    at the end of the line and a download notification window appears; click Save
    to download and save the executable to your PC. Locate the downloaded Code:Blocks
    installer and double-click to start. Follow the on-screen instructions to begin
    the installation.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_49_0.png)


    - **STEP 2** You can see that there are several Windows versions available. The
    one you want to download is ''mingw-setup.exe'' at the end of the current version.
    At the time of writing this: the mingw-setup-17.02-mingw-setup.exe is a C++ compiler
    and debugger from TDM-GCC (a compiler suite). The difference is that the mingw-setup
    version includes a C++ compiler and debugger from TDM-GCC.


    - **STEP 4** Once you''ve reached the licensing terms, there is a choice of installation
    options available. You can opt for a smaller install, missing out on some of the
    components but we recommend you opt for the Full as default.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_49_1.png)


    www.bdumping.com


    ## How to Set Up C++ in Windows


    **STEP 5** Choose an install location for Code:Blocks. It''s your choice, unless
    you have any special requirements. If you click Next, the install begins; if it
    finishes a notification pops up if you want to start Code::Blocks now, so yes.


    **STEP 8** Before you start using CodeBlocks it''s worth explaining why you needed
    the compiler. A compiler is a separate program that reads through your C++ code
    and checks it against the latest acceptable programming standards; this is why
    you need the most recent acceptable compiler. This is current C++, with C++20
    under.


    *Please wait while CodeBlocks is being installed*


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_50_0.png)


    **STEP 6** The first time Code:Blocks will auto-detect for C++ compilers you may
    have installed on your system. If you have any, click the first detected, GNU
    Compiler, and click the Default button to set it as your system C compiler. Click
    OK when you''re ready to continue.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_50_1.png)


    **STEP 9** Essentially, computers work and understand binary, zeros and ones,
    or Machine Language. Programming in binary isn''t feasible for humans. For example,
    output "Hello World" to the screen will appear in binary.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_50_2.png)


    **STEP 7** When the program starts another message appears, informing you that
    CodeBlocks is currently not the default for C++. You have two options: to leave
    everything as is or allow CodeBlocks to associate all file types. We recommend
    you opt for the best choice to associate CodeBlocks with supported file type.


    **STEP 10** The compiler takes what you have entered as C++ code and translates
    it into Machine Language. To execute it, the IDE ''builds'' the code, checking
    for errors, then runs it through the compiler to convert it into ones for the
    computer to act upon. It''s rather clever, when you stop to think about it.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_50_3.png)


    www.bdmpublic.com


    ## How to Set Up C++ on a Mac


    To begin C++ coding on a Mac you first need to install Xcode. This is a free,
    full featured IDE that’s designed to create native apps. However, you can also
    use it to create C++ code easily.


    ### XCODE


    Apple’s Xcode is primarily designed for users to develop apps for macOS, iOS and
    watchOS applications in Swift or Objective-C you can use it for C++ too.


    - **STEP 1** By opening the App Store on your Mac, Apple Menu -> App Store. In
    the Search box enter ‘Xcode’ and press Return. There are many suggestions filling
    the App Store window but it’s the first option, Xcode that you need to click.


    - **STEP 2** Take a moment to browse the app’s information, including the compatibility,
    to ensure you have the correct version of macOS. Xcode requires macOS 10.12.6
    or later to install and work.


    - **STEP 3** When you’re ready, click on the Get button then turns into Install.
    Enter your Apple ID and Xcode begins to download and install. It may take some
    time depending on the speed of your internet connection.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_51_0.png)


    - **STEP 4** When the installation is complete, click on the Open button to launch
    Xcode. Click Agree to the licence terms and enter your password to allow Xcode
    to make changes to the system. When that is done, Xcode begins to install additional
    components.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_51_1.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_51_2.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_51_3.png)


    ## How to Set Up C++ on a Mac


    **STEP 5** With everything installed, including the additional components, Xcode
    launches, displaying the version number among three choices and any recent projects
    you have worked on; with a fresh install, this is blank.


    **STEP 8** The next step asks you to create a Git Repository for all your future
    code. Choose a location on your Mac, or a network location, and click the Create
    button. When you''ve done all, you can start to code. The left-hand pane details
    the files used in the C++ program you''re coding. In the main.cpp file in the
    list:


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_52_0.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_52_1.png)


    **STEP 6** Start by clicking on New Xcode Project; this opens a window to choose
    which project you are developing for. Click the macOS, then click the Command
    Line Tool option. Next to continue.


    **STEP 9** You can see that Xcode has automatically completed a Hello World program
    for you. While it may not make much sense at present, you will discover more as
    you progress, the content is just Xcode utilizing what''s available on the Mac.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_52_2.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_52_3.png)


    **STEP 7** Fill in the various fields but to ensure that the Language option at
    the bottom is set to C++; simply choose it from the drop-down list. When you''ve
    filled in the fields, and made sure that C++ is the chosen language, click on
    the Next button to continue.


    **STEP 10** When you want to run the code, click on Product > Run. On the Mac,
    you may be asked to enable Developer Mode to perform functions without needing
    your password every session. When the program executes, the output is displayed
    at the bottom of the Xcode window.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_52_4.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_52_5.png)

