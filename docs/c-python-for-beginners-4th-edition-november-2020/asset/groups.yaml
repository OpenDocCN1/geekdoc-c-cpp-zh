    # C++ & Python

    For Beginners


    Starting something new can be daunting. Learning a skill or mastering a new piece
    of hardware is tough. Even tougher if you have no-one at hand to help. Conversely,
    as the complexity of the consumer technology increases, the size of the requisite
    manual decreases or in some cases it simply disappears. In numerous times in our
    lives we have all been "beginners", there is no shame in that fact and right so.
    How many times have you asked aloud, "What does this button do?" "Why doesn''t
    work?" "What do you mean it doesn''t do that?" "HELP!" At the start of any new
    journey or adventure we are all beginners but fortunately for you we are here
    to stand beside you at every stage.


    Over this extensive series of titles we will be looking in great depth at the
    latest consumer electronics, software, hobbies and trends out of the box! We will
    guide you step-by-step through using all aspects of the technology that you may
    have been previously apprehensive at attempting. Let our expert guide help you
    build your technology understanding and skills, taking you from a novice to a
    confident and experienced user.


    Over the page our journey begins. We would wish you luck but we''re sure with
    our support you won''t need it.


