  md: '# HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly high above the hardware (also referred to as "the metal\ Languages that
    "fly to the metal," like Assembly, are called "low-level". Low-level languages
    read like this: msg db low len eq - - mid


    # ZEN OF PYTHON


    Python lets access all the power of a computer in a language that humans can understand.
    Behind this is an ethos called "The Zen of Python." This is a collection of 20
    software principles that influence the design of language. Principles include
    "Beautiful is better than ugly" Simple is better than complex Import this and
    display all your programs.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_12_0.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is somewhat complicated by the existence
    of two active versions of the language: Python 3 and Python 2.


    +   - WORLD OF PYTHON

    When you visit Python Download you''ll notice there are two buttons available:
    for Python 3.6 and for Python 2.7.18; at the time of writing (remember Python
    is updated so you may use different version numbers).


    +   - PYTHON 3.X

    In 2008 Python 3 arrived with new and enhanced features. These features provide
    a more stable, effective and efficient programming environment but most (if not
    all) of these new features are not compatible with Python 2 code. Not popular
    at first, Python 3 has since making the exiting edge of Python programming.


    # Download the latest version for Windows


    | Download Python 3.6 | Download Python 2.7.13 |


    Wondering which to use? Here''s more about the difference between Python 2 and
    3.

    Looking for Python with a different OS? Python for Windows, Linux/Unix Mac OS
    or Other.

    Want to test different versions of Python? Pre release


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_12_1.png)


    # PYTHON 2.X


    So why two? Python 2 was launched in 2000 and has since adopted a large collection
    of modules, scripts, tutorials and so on. Over the years, Python 2 has become
    the first one of go to programming languages for Beginners and experts to choose
    in, which makes it an extremely valuable resource.


    # 3.WINS


    Python 3''s popularity has growing now that it''s now standard to learn developing
    with the new features and begin to past the previous version. Many development
    companies, such as SpaceX and NASA use Python 3 for important code base.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_12_2.png)'
