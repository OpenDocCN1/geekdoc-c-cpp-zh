  md: '# THE RASPBERRY PI


    Why use a Raspberry Pi? The Raspberry Pi is a tiny computer that''s very cheap
    to purchase but offers the user a fantastic learning platform. Its main operating
    system, Raspian, comes preinstalled with the latest Python with many Modules and
    extras.


    # RASPBERRY PI


    The Raspberry Pi 3 is the latest version, incorporating a more powerful CPU, more
    memory, Wi-Fi and Bluetooth support. You can pick up a Pi for £32 or as a part
    of kit for £50+, depending on the kit you''re interested in.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_10_0.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_10_1.png)


    # FUZE PROJECT


    The FUZE is a learning environment built on the latest model of the Raspberry
    Pi. You can purchase the workstations that come with an electronics kit and en
    robot arm for you to build and program. You can find more information on the FUZE
    at www.fuzze.uk.


    # BOOKS


    We have several great great-coding titles available at www.bdmpublicationscomcom
    Our Pi books cover how to buy your first Raspberry Pi, set it up and use it; there
    are some great step-by-step project examples and guides to get the most from Raspberry
    Pi to.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_10_2.png)


    # RASPBIAN


    The Raspberry Pi''s main operating system is a Debian-based Linux distribution
    that comes with everything you need in a simple to use. It''s streamlined for
    the Pi and an ideal platform for hardware and software projects, Python programming
    and as a desktop computer.


