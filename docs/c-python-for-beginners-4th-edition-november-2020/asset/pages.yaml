  md: "# C++ Fundamentals\n\n# Data Types\n\nVariables, as we've seen, store information\
    \ that the programmer can later call up, and manipulate if required. Variables\
    \ are simply reserved memory locations where the values the programmer assigns,\
    \ depending on the data type used.\n\n# THE VALUE OF DATA\n\nThere are many data\
    \ types available for the programmer in C++, such as an integer, floating point,\
    \ Boolean, and so on. It's widely accepted that there are seven basic data types,\
    \ however, you can create your own types that should need ever arise within the\
    \ code.\nThe seven basic data types are:\n\n| TYPE | COMMAND |\n|---|---|n| Integer\
    \ | Integer |\n| Floating Point | float |\n| Character | char |\n| Boolean | bool\
    \ |\n| Double Floating Point | double |\n| Wide Character | wchar_t |\n\nincredibly\
    \ accurate numbers but those numbers are only accurate up to the fifteenth decimal\
    \ place. There's also the problem with displaying such numbers. Using the cout\
    \ function, in that cout by default outputs the first five decimal places. You\
    \ can combat this by adding a .precision() function and adding a value inside\
    \ the brackets, then you're still limited by the accuracy of the double data type.\
    \ For example, try this code:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main() {\n\tdouble PI = 3.141592653589793238463;\n\tcout << PI;\n}\n```\n\n\
    | | |\n|---|---|\n| Start here | #include <iostream>\n| | using std;\n| | double\
    \ PI = 3.141592653589793238463;\n| | int main() {\n| | cout << PI;\n| | }\n\n\
    These basic types can also be extended using the following modifiers: Long, Short,\
    \ and Signed. This basically means you can expand the minimum and maximum ranges\
    \ for each data type. For example, the int data type has a default range of -2147483648\
    \ to 2147483647, a fair value, you could do more.\nIf you use one of the modifiers,\
    \ the ranges change:\nunsigned int = 0 to 4294967295\nsigned int = -2147483648\
    \ to 2147483647\nunsigned short = 0 to 65535\nsigned short = -32768 to 32767\n\
    unsigned long = 0 to 4294967295\nsigned long = -2147483648 to 2147483647\n7\n\
    Naturally you can get away with any basic type without the modifier, but there's\
    \ plenty of range provided with each data type.\nHowever, it's good C++ programming\
    \ practise to use the modifiers when possible.\nThere are issues when using modifiers\
    \ with double. Double represents a double-floating point value, which you could\n\
    \n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\
    int main() {\n\tcout << PI;\n}\n```\n\nBuild and run the code so you can see the\
    \ output is 3.14159, representing cout's limitations in this example.\nYou can\
    \ also use cout including the aforementioned cout.precision function, for greater\
    \ accuracy. Take all the up to 22 decimal places, with the following code:\n\n\
    ![](img/ed6cd144194c0d6151a39d9bac5b687c_69_0.png)"
