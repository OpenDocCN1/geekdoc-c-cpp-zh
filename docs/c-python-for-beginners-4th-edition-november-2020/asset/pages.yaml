  md: "# Structure of a C++ Program\n\n# COMMENTS\n\nLines with a double slash are\
    \ comments. This means they won't be executed in the code and ignored by the compiler.\
    \ Comments are designed to help you, or another programmer looking at your code,\
    \ explain what's going on. There are two types of comment: // covers multiple\
    \ lines, // a single line. Lines that begin with a double slash are comments.\
    \ This means they won't be executed and ignored by the compiler. Comments are\
    \ designed\n\n<<\nThe chevrons used here are instion operators. This means that\
    \ whatever follows the chevrons is be inserted into the std::cout statement; in\
    \ this case they're the 'Hello, world!' // are to be displayed on the screen when\
    \ you compile and execute the code\n\n```\n#include <iostream>\n\nint main() {\n\
    \    std::cout << \"Hello, world!\";\n    return 0;\n}\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    std::cout << \"Hello, world!\";\n   \
    \ return 0;\n}\n```\n\n# STD\n\nwhile stands for quite different, in C++ it means\
    \ Standard. It's part of the Standard Namespace in C++, which provides a number\
    \ of different statements and commands. You can leave the std:: part of the code\
    \ or must be declared at the start: using **namespace std;** not both. For example:\n\
    \n#include <iostream>\nusing namespace std;\n\n```\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    std::cout << \"Hello, world\\n\"; //Remember:\
