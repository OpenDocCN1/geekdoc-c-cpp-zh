    tackle functions. You''ve already used a few functions, such as the print command
    but Python now enables you to define your own functions.


    # ## FUNKY FUNCTIONS


    A function is a command that you enter into Python to do something. It''s a little
    piece of self-contained code that takes data, works on it and returns the result.


    +   **STEP 1** Not just a data that works on. They can do all of useful things
    in Python, such as sort data, change items from one to another and check the length
    or type of items. A function is a short word that follows by brackets. For example,
    `len()`, `list()` or `type()`.


