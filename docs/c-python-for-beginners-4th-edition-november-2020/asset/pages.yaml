  md: '# Say Hello to Python


    # # How to Set Up Python in Windows


    Windows users can easily install the latest version of Python via the main Python
    downloads. Whilst most seasoned Python developers may shun Windows as the platform
    of choice for their code, it''s an ideal starting point for beginners.


    # INSTALLING Windows 3.X


    Microsoft Windows doesn''t come with Python 3.x preinstalled as standard, so you''re
    going to have to install it yourself. Frankly, it''s an easy process to follow.


    +   **STEP 1** Start by opening your browser to [www.python.org/downloads/](https://www.python.org/downloads/)
    Look for the download link for Python 3.x (in this case it is Python 3.6 but you
    may see later versions of 3).


    +   **STEP 3** Choosing the Customise option allows you to specify certain parameters,
    and whilst you may stay with the defaults, a good habit to avoid as sometimes
    (not with Python), installers may include unwanted features. On the next screen,
    ensure all boxes are ticked and click the next button.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_0.png)


    Wondering which version to use? [Here more about the difference between Python
    2 and 3.](https://www.python.org/about/py23/ )


    Looking for Python with a different OS? [Windows, Linux/UNIX, OS X or Other](https://www.python.org/downloads/windows/)


    Want to help test development versions of Python? [Pre-releases](https://www.python.org/downloads/source/)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_1.png)


    +   **STEP 2** Click the download button for version 3.x, and save the file to
    your Downloads Folder. When the file is downloaded, double-click the executable
    and the installer will launch. You have two choices: Install or Custom. We recommend
    opting for the Customise installation line.


    +   **STEP 4** The next page of options includes some interesting details about
    Python. Ensure the Associate file option, Add Python To Environment Variables,
    Precompiled Standard Library and Install for All users are ticked. This makes
    using Python much easier later on. Click Install when you''re ready to continue.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_2.png)


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_13_3.png)


