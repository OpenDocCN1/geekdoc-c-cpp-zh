  md: "# C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there's plenty of built-in scope for some intense maths. C++ has a lot to offer\
    \ someone who's implementing mathematical models into their code. It can be extremely\
    \ complex and relatively simple.\n\n# C++ = MC?\n\nThe basic mathematical symbols\
    \ apply in C++ as they do in most other programming languages. However, by using\
    \ the C++ Library, you can also calculate square roots, powers, trig and more.\n\
    \n+   STEP 1 C++s mathematical operations follow the same patterns as taught in\
    \ school, in that multiplication and division take precedence over addition and\
    \ subtraction. You can alter that though. For now, create a new file and enter:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main () {\n    float numbers\
    \ = 100;\n    numbers = numbers + 10; // This adds 10 to the initial value\n \
    \   cout << \"\\n\";\n    numbers = numbers - 10; // This subtracts 10\n    cout\
    \ << \"\\n\";\n}\n```\n\n+   STEP 3 Multiplication and division can be applied\
    \ as such:\n\n```\n#include <iostream>\nusing namespace std;\nint main () {\n\
    \    float numbers = 100;\n    numbers = numbers * 10; // This multiplies 100\
    \ by 10\n    cout << \"\\n\";\n    numbers = numbers / 10; // And divides 1000\
    \ by 10\n    cout << \"\\n\";\n}\n```\n\n+   STEP 2 While simple, it does get\
    \ the old maths variable updated. Note that we used a float for numbers. If you\
    \ can use an integer, if you need decimals, you'd need to change it to a float\
    \ or decide the accuracy needed. Run the code and see the results.\n\n+   STEP\
    \ 4 Again, execute simple code and see the results. While not particularly interesting,\
    \ it's a start into C++ maths. We used a float here, so you can play around with\
    \ the code and multiply by divide, as well as add, and subtract.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_73_0.png)\n\
    \n```\nProcess returned (0x) execution time : 0.043 s\\Press any key to continue.\n\
    ```\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_73_1.png)\n\n```\nProcess returned\
    \ (0x) execution time : 0.050 s\\Press any key to continue.\n```"
