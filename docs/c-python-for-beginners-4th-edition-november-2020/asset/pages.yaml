  md: '# Say Hello to Python


    # # Why Python?


    There are many different programming languages available for the modern computer,
    and still available for 8 and 16-bit computers too. Some of these languages are
    designed for scientific work, others for mobile platforms and such. So why you
    choose Python out of all the rest?


    # ## PYTHON POWER


    Ever since the earliest computers were available, enthusiasts, users and professionals
    have toiled away until the weeks, lasting over an overheating heat of circuitry
    to create something akin to magic.


    These pioneers of programming carved their way into small routines that enabled
    the letter ''A'' to scroll across the screen. It may not terribly exciting to
    a generation that''s used to ultra-high-definition graphics and open world, multiplayer
    online gaming. Forty-seven years ago it was beginning brilliantly.


    Regardless of whether you use an Android device, iOS device, PC, Mac, Linux, Smart
    TV, games console, MP3 player, GPS device built-in a car, set-top box or something
    other connected and ''smart'' agents, all is programming.


    All aforementioned digital devices need instructions to tell what to do, and allow
    them to be interacted with. These instructions form the programming core of the
    device and that core can be built using a variety of programming languages.


    Naturally these beside helped lay the foundations for every piece of digital technology
    we use today. Some went on to become chief developers for software companies,
    others pushed the available hardware to limits and founded gaming empire that
    continues to amaze us.


    The languages in use today differ depending on the situation, the platform, the
    device, and how your device interacts with


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_7_0.png)


    > C++ is usually reserved for more complex operations, systems, and so on.'
