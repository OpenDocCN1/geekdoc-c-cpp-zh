  md: "# C++ Comments\n\nCommenting in C++ involves using a double slash '/', or a\
    \ forward slash and an asterisk, '/*'. You've already seen brief examples but\
    \ this is how they work.\n\nSTEP 1 Using the Hello World code as an example, you\
    \ can easily comment on different sections of the code using the double slash:\n\
    \n```\n// First C++ program\ncout << \"Hello, world!\\n\";\n\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    // My first C++ program\n    cout <<\
    \ \"Hello, world!\\n\";\n}\n\n```\n\nSTEP 4 Be careful when commenting, especially\
    \ with comments. it's very easy to forget to add the asterisk and slash thus negate\
    \ any code that falls inside the comment block.\n\n```\n// HelloWorld.cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello, world!\\\
    n\";\n    cout << \"And greetings from C++\";\n    // cover several lines\n  \
    \  // without the need to add more slashes\n    cout << \"This line is now ignored\
    \ by the compiler\";\n}\n```\n\nSTEP 2 You can add comments to the end of a line\
    \ of code, to describe in a better way's going on:\n\ncout << \"Hello, world!\\\
    n\";This line outputs the words 'Hello, world!'. The \\n denotes a new line.\n\
    \nNote, you don't have to put a semicolon at the end of a comment. This is because\
    \ it's a line that's ignored by the compiler.\n\n```\n// HelloWorld.cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    // Like the above\n  \
    \  cout << \"Hello, world!\\n\"; // This line ignores the world, which is\n}\n\
    ```\n\nSTEP 5 If you would try and use code, complaining of a missing bracket\
    \ ']' to finish off the code. If you've made a few times, then it can be time\
    \ consuming to go right. Frankly, the colour coding in Code:Blocks identifies\
    \ you with comments from.\n\n```\n// HelloWorld.cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n    // My first\n    cout << \"Hello, world!\\\
    n\";\n    cout << \"And greetings from C++\";\n    // This comment\n    // several\
    \ lines\n    // without the need to add more slashes /\n    cout << \"This line\
    \ is now ignored by the compiler\";\n}\n```\n\nSTEP 3 You can comment several\
    \ lines by using the asterisk and slash:\n\n> /* This comment can\ncover several\
    \ lines\nwithout the need to add more slashes /*\n\nJust remember to finish the\
    \ comment block with the opposite asterisk and slash.\n\nSTEP 6 If you're using\
    \ several lines, it's good practice in C++ to add an asterisk to each new line\
    \ of the comment block. This also helps you to remember the comment block off\
    \ before continuing the code:\n\n> /* This comment can\ncover several lines *\n\
    without the need to add more slashes *\n\n```\nint main() {\n    #include <iostream>\n\
    using namespace std;\n\n    cout << \"Hello, world!\\n\";\n    cout << \"And greetings\
    \ from C++\";\n\n    // This comment\n    // several lines\n    without the need\
    \ to add more slashes /\n\n    cout << \"This line is now ignored by the compiler\"\
    ;\n}\n```"
