    +   **STEP 2** The IDLE Editor is, for all intents and purposes, a simple text
    editor with Python features, coding and so on; in the same vein as Sublime. You
    enter the code as you would within the Shell, so taking an Example from the previous
    tutorial, enter:


    +   **STEP 4** Click on the OK in the Save box and select a destination where
    you''ll save all your Python code. The destination can be a deallocated folder
    pocket or you can just dump it wherever you like. Remember to keep a tidy drive
    though, to help you in the future.


