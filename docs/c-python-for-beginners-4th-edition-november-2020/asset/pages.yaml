  md: "# STEP 5\n\nThere are also many different operations that you can apply with\
    \ the string function. For instance, to get the length of a string you can use:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n    string greet\
    \ = \"Welcome\";\n    cout << \"The length of the string is: \" <<\n    cout <<\
    \ greet.size() << \"\\n\";\n}\n```\n\n# STEP 8\n\nJust as you might expect, you\
    \ can mix in an integer and store something to do with the string. In this, we\
    \ created int length, which stores the result of string::size() and outputs it\
    \ to the:\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n  \
    \  int length;\n    string greet1 = \"Hello\";\n    string greet2 = \" world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    length = greet3.size();\n    cout\
    \ << \"The length of the combined strings is: \" << greet3.size() << \"\\n\";\n\
    }\n```\n\n# STEP 6\n\nYou can see that with get::size() to output the length,\
    \ the number of characters there are, of the contents of the string. Naturally,\
    \ if you call your string operation, then you need to change the command to remove\
    \ it. It's always string operation. Build and run the code to see the results:\n\
    \n# STEP 9\n\nUsing the available operations that come with the string function,\
    \ you can manipulate the contents of a string. To remove characters from a string\
    \ you could:\n\n```\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    string str = \"Here is a long sentence in a string.\";\n    cout << str <<\
    \ \"\\n\";\n    str.erase(10,5);\n    cout << str << \"\\n\";\n    str.erase(str.begin()+8);\n\
    \    cout << str << \"\\n\";\n    str.erase(str.begin()+9, str.end()-9);\n   \
    \ cout << str << \"\\n\";\n}\n```\n\n# STEP 7\n\nYou can combine different strings,\
    \ or to form larger strings:\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main() {\n    string greet1 = \"Hello\";\n    string greet2 = \" world!\"\
    ;\n    string greet3 = greet1 + greet2;\n    cout << greet3 << \"\\n\";\n}\n```\n\
    \n# STEP 10\n\nIt's worth spending time playing around the numbers, which are\
    \ the character positions in the string. It can be hit or miss whether you get\
    \ it right, so practice makes perfect. Take a look at the screenshot to see the\
    \ result of:"
