  md: '# STEP 5


    What you have done here is assigning the letters a and b values: 2 and 2. These
    are new variables, which can be called upon Python to output, add, subtract, divide
    and so on as long as their numbers stay the same. Try this:


    # print(b)


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> print("hello")

    hello

    >>> print(2+2)

    4

    >>> a=2

    >>> print(a)

    2

    >>> b=2

    >>> print(b)

    2

    >>> print(a+b)

    4

    ```


    # STEP 6


    The output of the last steps contains the values of a and b individually, as you''ve
    asked them to be printed. If you want to add them, you can use the following:


    # print(a+b)


    This code simply takes the values of a and b, adds them together and outputs the
    result.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> print("hello")

    hello

    >>> print(2+2)

    4

    >>> a=2

    >>> print(a)

    2

    >>> b=2

    >>> print(b)

    2

    >>> print(a+b)

    4

    ```


    # STEP 7


    You can play with different kinds of variables and the function. For example,
    you can assign variables for someone''s name:


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> print("hello")

    hello

    >>> print(2+2)

    4

    >>> a=2

    >>> print(a)

    2

    >>> b=2

    >>> print(b)

    2

    >>> print(a+b)

    4

    >>> name="David"

    >>> print(name)

    David

    ```


    # STEP 8


    Let''s add a surname:

    surname="Hayward"

    print(surname)


    You have two variables containing a first name and a surname and can print them
    independently.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> name="David"

    >>> print(name)

    surname="Hayward"

    >>> print(surname)

    Hayward

    ```


    # STEP 9


    If we were to apply the same routine as before, using the + symbol, the name wouldn''t
    appear correctly in the Shell. Try it:


    # print(name-surname)


    You need a space between the two, defining them as separate variables and not
    something mathematically you play around.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> name="David"

    >>> print(name)

    david

    surname="Hayward"

    >>> print(surname)

    hayward

    >>> print(name+surname)

    David Hayward

    ```


    # STEP 10


    In Python 3 you can separate the variables with a space, comma:


    # print(name, surname)


    Alternatively, you can add the space yourself:


    # print(name+" "+surname)


    The use of the comma is much neater, as you can use. Congratulations, you''ve
    just taken your first steps into the world of Python.


    ```

    ### Python 3.4.2 Shell

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (SCT 4.9.1 on Linux)

    >>> type("credits" or "license") for more information.

    ''str''

    >>> name="David"

    >>> print(name)

    david

    surname="Hayward"

    >>> print(surname)

    hayward

    >>> print(name, surname)

    David Hayward

    ```'
