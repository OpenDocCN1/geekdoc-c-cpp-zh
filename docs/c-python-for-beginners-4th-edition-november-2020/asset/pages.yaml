  md: "# Say Hello to Python\n\n# Getting to Know Python\n\nPython is the greatest\
    \ programming language ever created. It enables you to fully harness the power\
    \ of a computer, in a language that is clean and easy to understand.\n\n# WHAT\
    \ IS PROGRAMMING?\n\nIt helps to understand what a programming language is before\
    \ you try to learn one, and Python is no different. Let's take a look at how Python\
    \ can come about and how it relates to other languages.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_11_0.png)\n\
    \n# PROGRAMMING RECIPES\n\nA programming language is a list of instructions that\
    \ a computer follows. These instructions can be as simple as playing a music file\
    \ or as complex as building a whole world. Python was conceived in the late 1980s\
    \ by Guido van Rossum at Centrum Wiskunde in the Netherlands as a successor to\
    \ the ABC language.\n\nGuido van Rossum, the Father of Python.\n\nPrograms are\
    \ like recipes for computers.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_11_1.png)\n\
    \nPut 100 grams of self-raising flour in a bowl.\nAdd 100 grams of butter to the\
    \ bowl.\nAdd 100 milliliters of milk.\nBake for an hour.\n\nPut 100 grams of self-raising\
    \ flour in a bowl.\nAdd 100 grams of butter to the bowl.\nAdd 100 milliliters\
    \ of milk.\nBake for an hour.\n\n```\nbowl = []\nflour = 100\nbutter = 50\nmilk\
    \ = 100\nbowl.append([flour, butter, milk])\ncake.cake()\n```\n\nJust like a recipe,\
    \ a program consists of instructions that you follow in order. A program that\
    \ describes a cake might like this:\n\n```\ncake = []\ndef cake(self):\n    flour\
    \ = 100\n    butter = 50\n    milk = 100\n    self.append([flour, butter, milk])\n\
    cake.cake()\n```\n\n# PROGRAM COMMANDS\n\nYou might not understand some of the\
    \ Python commands, bowl.append and cake(bowl). The first is a list, the second\
    \ another we'll look at both in this book. The main thing to know is that it's\
    \ easy to read Python code. Once you understand the commands, it's easy to figure\
    \ out how a program works.\n\n![](img/ed6cd144194c0d6151a39d9bac5b687c_11_2.png)\n\
    \n```\nPython 3.4.2 Shell\n>>> Python 3.4.2 (default, Oct 19, 2014, 23:21:17)\n\
    [GCC 6.3.2 default on Windows8]\ntype('copyright', 'credits' and 'license') for\
    \ more information\n>>> bowl = []\n>>> flour = 100\n>>> butter = 50\n>>> milk\
    \ = 100\n>>> bowl.append([flour, butter, milk])\n>>> cake = []\n>>> def cake(self):\n\
    ...     flour = 100\n...     butter = 50\n...     milk = 100\n...     self.append([flour,\
    \ butter, milk])\n... \n... ...\n>>> cake(cake)\n```\n\nwww.bdmppublications.com"
