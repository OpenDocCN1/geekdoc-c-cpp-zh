  md: '# Structure of a C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, and your entire program will fail to be compiled
    and executed. Many a professional programmer has fallen foul of sloppy structure.


    # #INCLUDE <C++ STRUCTURE>


    Learning the basics of programming, you begin to understand the structure of a
    program. The commands may be from one language to the next, but you will start
    to see how the code works.


    | C++ | #INCLUDE |

    |---|---|

    | C++ was invented by Danish student Bjarne Stroustrup in 1979, as part of his
    Ph.D. thesis. Initially C++ was called C with Classes, which added features to
    the popular C language, making it a much more user-friendly environment through
    a new structure. | The structure of a C++ program is quite precise. Every C++
    code begins with a directive: **#include <>**. The directive instructs the section
    of the standard C++ code. For example: **#include <iostream>** includes the iostream
    header to support input/output operations. |


    Bjarne Stroustrup, inventor of C++.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_61_0.png)


    # INT MAIN()


    int main() initiates the declaration of a function, which is a group of code statements
    under the name ''main''. All C++ code begins at the function, regardless of where
    it lies within the code.


    | *helloworld.cpp |

    |---|---|

    | 1 | #include <iostream> |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |

    | 6 | |


    | *helloworld.cpp |

    |---|---|

    | 1 | #include <iostream> |

    | 2 | |

    | 3 | int main() |

    | 4 | |

    | 5 | |

    | 6 | |


    # BRACES


    The open brace (curly brackets) is something that you may not have come before,
    especially if you''re using Python. The open brace indicates the beginning of
    the main function and contains all the code that belongs to that function.


    | #include <iostream> |

    |---|---|

    | 1 | |

    | 2 | |

    | 3 | int main() |

    | 4 | { |

    | 5 | |

    | 6 | } |'
