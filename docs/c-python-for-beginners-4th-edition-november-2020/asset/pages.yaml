    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> on linux

    >>> type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    >>> 2345*64545232

    1509444000000

    >>> 64545232*12343

    796793393376

    >>> 98726898*43904

    4334333333392

    >>> 506472823538


    ```'
