  md: '# Starting Python for the First Time


    We''re going to be using the Raspberry Pi as our Python 3 hardware platform. The
    latest version of Raspian comes preinstalled with Python 3, version 3.4.2 to be
    exact, so long as you have a version 3 Shell, all our code will work.


    # STARTING PYTHON


    We''re not going to go into the details of getting the Raspberry Pi up and running,
    there''s plenty of material available on that subject. However, once you''re ready,
    fire up your Pi and get ready for coding.


    +   **STEP 1** With the Raspbian desktop loaded, click on the Menu followed by
    Programming > Python 3 IDLE. This opens the Python 3 Shell. Windows and Mac users
    can find the Python 3 IDLE Shell from the Windows Start menu and via Finder.


    +   **STEP 3** For example, in the Shell enter: 2+2 after pressing Enter, the
    next line displays the answer: 4. Basics, Python has taken the ''code'' and produced
    the relevant output.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_21_0.png)


    +   **STEP 2** The Shell is where you can enter code and see the responses and
    output of code you''ve generated. This is a kind of sandbox, where you''re able
    to try out simple code and processes.


    +   **STEP 4** The Shell acts very much like a calculator, since code is a series
    of mathematical interactions with the system. Integers, which are the infinite
    sequence of numbers can be added, subtracted, multiplied and so on.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> on linux

    >>> type ''copyright'', ''credits'' or ''license'' for more information.

    >>> 2+2

    4

    ```


