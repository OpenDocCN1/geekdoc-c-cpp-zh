    >>> print (name, " is " + years old)

    David Howard: Descended from Vikings is 44 years old.

    ```


    STEP 9

    This use of Typecasting is also important when dealing with floating point arithmetic;
    for example, enter:


    shift=19.99

    Now enter type(shift) and you''ll see that Python has allocated the number as
    a ''float'', which contains a decimal point.


    ```

    Python 3.4 2 Shell

    >>> shift=19.99

    >>> type(shift)

    <class ''float''>n>>>

    ```


    STEP 7

    Another example of Typecasting is when you want input from the user, such as for
    example,


    enter= input("How old are you?")

    All data collected from the input is stored as a string.


    STEP 10

    When combining integers and floats Python converts the integer to a float, but
    the reverse doesn''t return the value you expect. When combining float and integer,
    Python will always round down to the nearest integer, calling trunc; instead of
    19.9 it becomes 19.


