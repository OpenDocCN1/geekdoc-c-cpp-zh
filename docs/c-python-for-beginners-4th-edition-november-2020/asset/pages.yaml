    # ## THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions

    detail what the code is doing at that point. They don''t

    sound especially but without comments is one of

    the frustrating aspects of programming, regardless of

    are professional or just starting out.


    In short, code should be commented in a manner as to

    effectively describe the purpose of a line, section, or individual

    elements. You should get in the habit of commenting as much as

    possible so that someone who doesn''t know anything

    about programming can pick up your code and understand what it''s

    go simply by reading through it.


    In a professional environment, comments are vital to the success

    of the code and the company. In an organisation,

    programmers work in teams alongside engineers, other developers

    handysts and so on. If you''re part of the team that''s

    writing software, your comments help to tell something going,

