  md: '# # Strings


    Strings are objects that represent and hold sequences of characters. For example,
    you could have a universal greeting in your code ''Welcome'' and assign that as
    a string to be called up wherever you like in the program.


    # ## STRING THEORY


    There are different ways in which you can create a string of characters, which
    historically are all carried over from the original C language, and are still
    supported by C++.


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_71_0.png)


    +   STEP 1 To create a string using char function. Open a new C++ file and begin
    with the usual header:


    ```

    #include <iostream>

    using namespace std;

    int main() {


    }

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_71_1.png)


    +   STEP 3 Build and run the code, and ''Welcome'' appears on the screen. While
    this is perfectly fine, it''s not a string. A string is a class, which defines
    objects that can be represented as a stream of characters and doesn''t need to
    be terminated like array. The code can therefore be represented:


    ```

    #include <iostream>

    using namespace std;

    int main() {


    char greet[] = "Welcome";

    cout << greet << "\n";

    }

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_71_2.png)


    +   STEP 2 It''s easy to confuse a string with an array. Here''s an array, which
    can be terminated with a null character:


    ```

    #include <iostream>

    using namespace std;

    int main() {


    char greet[8] = {''W'', ''e'', ''l'', ''c'', ''o'', ''m'', ''e'', ''\0''};

    cout << greet << "\n";

    }

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_71_3.png)


    +   STEP 4 C++ has also a string type, which works in the same way. Using the
    greeting code again,


    ```

    #include <iostream>

    using namespace std;

    int main() {


    string greet = "Welcome";

    cout << greet << "\n";

    }

    ```


    ![](img/ed6cd144194c0d6151a39d9bac5b687c_71_4.png)


    72 www.bdmpublications.com'
