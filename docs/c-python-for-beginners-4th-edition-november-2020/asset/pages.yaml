    ```

    int(age) + 10

    This will Cast the age string into an integer that can be worked:

    ```


    STEP 6

    This is a process known as Typecasting. The Python code is:


    ```

    print (character, " is " + str(age) + " years old.")

    ```


    or you can use:

    Notice that in the last example, you don''t need the spaces between the words
    in the quotes as commas treat each argument to print separately.


    ```

    >>> print (name, age)

    Traceback (most recent call last):

