  md: "# STEP 5\n\nThe interesting maths content comes when you call upon the C++\
    \ Math Library. In this header are dozens of mathematical functions along with\
    \ other parameters. Everything from cosine to tangent with two parameters, to\
    \ the value of Pi. You can call the header with:\n\n```\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\n\nint main() {\n\n}\n```\n\n# STEP 8\n\
    \nCalculating powers of numbers can be done with:\n\n```\n#include <iostream>\n\
    #include <cmath>\nusing namespace std;\n\nint main() {\n\n    float number = 12;\n\
    \n    cout << \"number to the power of 2 is \" << pow(number, 2) << \"\\n\";\n\
    \    cout << \"number to the power of 3 is \" << pow(number, 3) << \"\\n\";\n\
    \    cout << \"number to the power of .08 is \" << pow(number, 0.8) << \"\\n\"\
    ;\n}\n```\n\n| Files | Maths.cpp |\n|---|---|\n| 1 | #include <iostream> |\n|\
