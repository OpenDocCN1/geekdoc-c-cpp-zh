  \n## 附录 A. 区域设置与不区分大小写的字符串比较\n\n\n\n\n\nItem 35 解释了如何使用 `mismatch` 和 `lexicographical_compare`\
  \ 来实现不区分大小写的字符串比较，但它也指出，解决该问题的真正通用方案必须考虑本地化（locales）。这本书是关于 STL 的，而不是国际化的，因此关于本地化，我几乎无话可说。然而，《泛型编程与\
  \ STL》的作者 Matt Austern 在 [4 ] 在 2000 年 5 月份的 *C++ Report* [11 ] 专栏中讨论了不区分大小写字符串比较中的本地化方面。为了完整讲述这个重要话题的全部故事，我很荣幸在这里重新刊登他的专栏，并感谢\
  \ Matt 以及 101communications 允许我这样做。\n\n### 由 Matt Austern 撰写的：如何进行不区分大小写的字符串比较\n\
  \n如果你曾经写过一个使用字符串的程序（谁没写过呢？），那么你可能有时需要将两个仅大小写不同的字符串视为是相同的。也就是说，你需要进行比较——相等、小于、子串匹配、排序——并且这些比较要忽略大小写。事实上，关于标准\
  \ C++ 库最常被问的问题之一就是如何让字符串变得不区分大小写。这个问题被回答过很多次，但很多答案都是错误的。\n\n首先，让我们抛弃“你应该寻找一种方法编写不区分大小写的字符串类”的念头吧。是的，这在技术上某种程度上是可能的。标准库类型\
  \ `std::string` 实际上只是模板 `std::basic_string<char, std::char_traits<char>, std::allocator<char>\
  \ >` 的别名。它对所有比较使用 `traits` 参数，因此，通过提供一个适当重定义了相等和小于关系的 `traits` 参数，你可以以此方式实例化 `basic_string`，使得\
  \ `<` 和 `==` 运算符不区分大小写。你可以这样做，但这并不值得费那个劲。\n\n- **你将无法进行 I/O 操作**，至少在不增加痛苦的情况下。标准库中的\
  \ I/O 类（如 `std::basic_istream` 和 `std::basic_ostream`）就像 `std::basic_string` 一样是对字符类型和\
  \ traits 模板化的。（再次，`std::ostream` 只是 `std::basic_ostream<char, char_traits<char>\
  \ >` 的别名。）`traits` 参数必须匹配。如果你使用 `std::basic_string<char, my_traits_class>` 作为你的字符串，那么你必须使用\
  \ `std::basic_ostream<char, my_traits_class>` 进行流输出。你将无法使用像 `cin` 和 `cout` 这样的普通流对象。\n\
  \n- **不区分大小写与对象无关，而与你如何使用对象有关**。你可能在某些上下文中需要将字符串视为大小写敏感，而在另一些上下文中视为不区分大小写。（可能取决于用户控制的选项。）为这两种用途定义单独类型会在它们之间建立起一道人为的屏障。\n\
  \n- **它并不合适**。就像所有的 traits 类一样，^(†) `char_traits` 是短小、简单且无状态的。正如我们在本专栏后面看到的，适当的不区分大小写比较并不具备这些任何特征。\n\
  \n- **它还不够**。即使 `basic_string` 的所有成员函数都是不区分大小写的，当你需要使用如 `std::search` 和 `std::find_end`\
  \ 这样的非成员泛型算法时，这仍然没有帮助。如果你出于效率考虑决定对容器进行更改，它同样无帮助。\n\n一个更好的解决方案，一个更符合标准库设计的，是当你需要不区分大小写的比较时，使用非成员泛型算法。对于\
  \ `std::string` 容器，如果你需要进行不区分大小写的排序，你只需要提供一个不区分大小写的比较函数：\n\n```cpp\nlexicographical_compare(C.begin(),\
  \ C.end(), compare_without_case);\n```\n\n#### 不区分大小写的字符串比较\n\n如果你曾经写过一个使用字符串的程序（谁没写过呢？），那么你可能有时需要将两个仅大小写不同的字符串视为是相同的。也就是说，你需要进行比较——相等、小于、子串匹配、排序——并且这些比较要忽略大小写。事实上，关于标准\
  \ C++ 库最常被问的问题之一就是如何让字符串变得不区分大小写。这个问题被回答过很多次，但很多答案都是错误的。\n\n首先，让我们抛弃“你应该寻找一种方法编写不区分大小写的字符串类”的念头吧。是的，这在技术上某种程度上是可能的。标准库类型\
  \ `std::string` 实际上只是模板 `std::basic_string<char, std::char_traits<char>, std::allocator<char>\
  \ >` 的别名。它对所有比较使用 `traits` 参数，因此，通过提供一个适当重定义了相等和小于关系的 `traits` 参数，你可以以此方式实例化 `basic_string`，使得\
  \ `<` 和 `==` 运算符不区分大小写。你可以这样做，但这并不值得费那个劲。\n\n#### 第一次尝试\n\n“每一个复杂的问题都有一个简单的、整洁但错误的解决方案。”写\
  \ C++ 书的人很喜欢这种类，我在书中用过几次。它几乎是正确的，但这并不好。问题是微妙的。这里有一个你可以开始看到例子：\n\n(text0060.html_p091_01)\n\
  \n```cpp\nstruct lt_nocase : public::binary_function<char, char, bool> {\n    bool\
  \ operator()(char x, char y) const {\n        return std::toupper(static_cast<unsigned\
  \ char>(x)) <\n               std::toupper(static_cast<unsigned char>(y));\n   \
  \ }\n};\n```\n\n你应该在你的系统上尝试一下。在我的系统上（运行 IRIX 6.5 的 Silicon Graphics O2），输出如下：\n\n\
  s1 = GEWÜRZTRAMINER, s2 = gewürztraminer\n\ns1 < s2: true\n\n嗯，真奇怪。如果你正在进行不区分大小写的比较，\"\
  gewürztraminer\" 和 \"GEWZTRAMINER\" 不是相同的吗？现在有一个细微的变化：如果你在 `printf` 语句之前插入这一行\n\n\
  `setlocale(LC_ALL, \"de\");`\n\n输出突然变了：\n\ns1 = GEWÜRZTRAMINER, s2 = gewürztraminer\n\
  \ns1 < s2: false\n\n不区分大小写的字符串比较比看起来要复杂。这个看似无害的程序关键取决于我们大多数人倾向于忽略的东西：本地化。\n\n####\
  \ 本地化\n\n`char` 实际上只是一个小整数。我们可以选择将一个小整数解释为字符，但这种解释并没有什么普适性。某个特定的数字应该被解释为字母、标点符号还是非打印控制字符？\n\
  \n\n\n\n这个问题没有唯一的标准答案，对于核心 C 和 C++ 语言来说，这甚至没有区别。有几个库函数需要做出这些区分：例如，`isalpha` 用于判断一个字符是否为字母，而\
  \ `toupper` 将小写字母转换为大写字母，并且对大写字母或非字母字符不做任何操作。这一切都取决于本地的文化和语言习惯：在英语中，区分字母和非字母是一个意思，在瑞典语中则是另一个意思。从小写转换为大写在罗马字母和西里尔字母中含义不同，而且在希伯来语中完全没有意义。\n\
  \n默认情况下，字符处理函数适用于简单英语文本的字符集。字符 `'\\374’` 不受 `toupper` 的影响，因为它不是字母；它在某些系统上打印时可能看起来像\
  \ `ü`，但对于一个处理英文文本的 C 库程序来说，这无关紧。ASCII 字符集中没有 `ü` 字符。这一行\n\n```\nsetlocale(LC_ALL,\
  \ \"de\");\n```\n\n告诉 C 库开始按照德国习惯进行操作。（至少在 IRIX 上是这样的。区域设置名称并未标准化。）德国语中有字符 `ü`，所以\
  \ `toupper` 将 `ü` 变为 `Ü`。\n\n如果这让你感到紧张，那么你应该紧张。虽然 `toupper` 看起来是一个接收一个参数的简单函数，但它也依赖于一个全局变量——更糟糕，是一个隐藏的全局变量。这导致了所有常见的困难：使用\
  \ `toupper` 的函数可能依赖于整个程序中的其他任何函数。\n\n如果你用 `toupper` 进行不区分大小写的字符串比较，这可能是灾难性的。如果你有一个算法依赖于\
  \ `list` 的排序（例如 `binary_search`），然后一个新的区域设置导致排序顺序在它面前发生了变化，会发生什么？这样的代码是不可重用的；它几乎是不可用的。你不能将其用于库中——库被会被各种程序调用，而不仅仅是从不调用\
  \ `setlocale` 的程序。你可能在大规模程序中使用它不会出问题，但你会面临一个维护问题：也许你可以证明没有其他模块调用过 `setlocale`，但你能证明在明年版本的程序中没有其他模块会调用\
  \ `setlocale` 吗？\n\n在 C 语言中，这个问题没有很好的解决方案。C 库只有一个全局区域设置，仅此而已。在 C++ 中有一个解决方案。\n\n\
  ## C++ 中的区域设置\n\nC++ 标准库中的区域设置（locale）并不是隐藏在库实现深处的全局数据。它是一个 `std::locale` 类型的对象，你可以像创建其他对象一样创建它并将其传递给函数。你可以创建一个表示常规区域设置的区域设置对象，例如通过编写\n\
  \n```cpp\nstd::locale L = std::locale::classic();\n```\n\n或者你可以通过编写创建一个德语区域设置：\n\
  \n```cpp\nstd::locale L(\"de\");\n```\n\n（与 C 库一样，区域设置的名称并未标准化。请检查你的实现文档以找到哪些命名的区域设置。）\n\
  \nC++ 中的区域设置被分为不同的*facets*（功能面），每个面都处理国际化的不同方面，而 `std::use_facet` 函数从区域设置对象中提取特定的“面”。`ctype`\
  \ 面处理字符分类，包括大小写转换。最后，如果 `c1` 和 `c2` 的类型为 `char`，这段片段将以适用于区域设置 `L` 的不区分大小写的方式对它们进行比较。\n\
  \n警告：`use_facet` 是一个函数模板，其模板参数仅出现在返回类型中，而不是任何参数中。调用它使用了一种名为*显式模板参数指定*（explicit template\
  \ argument specification）的语言特性，某些 C++ 编译器尚未支持该特性。如果你使用的编译器不支持它，你的库实现者可能提供了替代方法，以便你以其他方式调用\
  \ `use_facet`。\n\n```cpp\nconst std::ctype<char>& ct = std::use_facet<std::ctype<char>\
  \ >(L);\n\nbool result = ct.toupper(c1) < ct.toupper(c2);\n```\n\n还有一个特殊的缩写：你可以写\n\
  \n```cpp\nstd::toupper(c, L),\n```\n\n这（如果 `c` 的类型为 `char`）与下面等价\n\n```cpp\nstd::use_facet<std::ctype<char>\
  \ >(L).toupper(c).\n```\n\n不过，尽量减少调用 `use_facet` 的次数，因为它的开销可能相当大\n\n正如字典序比较并不适用于所有的应用，逐字符的大小写转换也不总是合适的。（例如，在德语中，小写字母“ß”对应于大写序列“SS”）。然而，遗憾的是，逐字符的大小写转换是我们唯一拥有的。C\
  \ 标准或 C++ 标准库都没有提供任何一次性处理多个字符的大小写转换形式。如果这种限制对你的目的来说不可接受的，那么你就超出了标准库的范围。\n\n### 逸闻：另一个面\n\
  \n如果你已经熟悉 C++ 中的区域设置，你可能会想到另一种执行字符串比较的方法：`collate` 面的存在正是为了封装排序的细节，它具有一个接口与 C 库非常相似的成员函数。甚至还有一个小小的便利功能：如果\
  \ `L` 是一个区域设置对象，你可以通过编写 `L(x, y)` 来比较两个字符串，而不是通过调用 `use_facet` 的麻烦。\n\n“classic”区域设置有一个\
  \ `collate` 面可以执行字典序比较，就像 `string` 的 `operator<` 一样，但其他区域设置执行的是相应语言的比较。如果你的系统恰好带有了你感兴趣的语言的不区分大小写比较的区域设置，你可以直接使用它。\n\
  \n遗憾的是，这条建议虽然真实，但对于我们这些没有这种系统的人来说并没有太大帮助。也许有一天这类区域设置将会标准化，但目前还没有。如果还没有人为你写好了不区分大小写的比较函数，你就得自己写。就像\
  \ `strcmp` 函数一样。\n\n### 不区分大小写的字符串比较\n\n使用 `ctype` 可以很容易构建不区分大小写的字符串比较。这个版本并不是最优的，但至少是正确的。它使用了与之前相同的技巧：使用\
  \ `lexicographical_compare` 比较两个字符串，并通过将它们都转换为大写来比较两个字符。然而，这次我们仔细使用了区域设置对象而不是全局变量。（顺带一句，将两个字符转换为大写并不总是与将两个字符转换为小写得到相同的结果：无法保证这些操作是逆的。在法语中，习惯上在大写字母上省略变音。在法语区域设置中，`toupper`\
  \ 这种损真转换可能是合理的；它可能将‘é’和‘e’转换为同一个大写字母‘E’。在这种区域设置下，使用 `toupper` 不区分大小写比较会认为‘é’和‘E’是相等字符，而使用\
  \ `tolower` 不区分大小写比较则会认为它们不等。哪一个是正确答案？可能是前者，但取决于语言、当地习俗以及你的应用程序。）\n\n```cpp\nstruct\
  \ lt_str_1\n\n: public std::binary_function<std::string, std::string, bool> {\n\n\
  struct lt_char {\n\nconst std::ctype<char>& ct;\n\nlt_char(const std::ctype<char>&\
  \ c) : ct(c) {}\n\nbool operator()(char x, char y) const {\n\nreturn ct.toupper(x)\
  \ < ct.toupper(y);\n}\n\n};\n\n};\n\nstd::locale loc;\n\nconst std::ctype<char>&\
  \ ct;\n\nlt_str_1(const std::locale& L = std::locale::classic());\n```\n\n\n\n\n\
  ```cpp\n: loc(L), ct(std::use_facet<std::ctype<char> >(loc)) {}\n\nbool operator()(const\
  \ std::string& x, const std::string& y) const {\n    return std::lexicographical_compare(x.begin(),\
  \ x.end(),\n    y.begin(), y.end(),\n    lt_char(ct));\n}\n\n};\n```\n\n这还不完全优化；它的运行速度比应有的要慢。这个问题既烦人又具有技术性：我们在循环中调用了\
  \ `toupper`，而 C++ 标准要求 `toupper` 产生一次虚函数调用。某些优化器可能足够聪明，可以将虚函数的开销移到循环之外，但大多数优化器不能。在循环中应该避免使用虚函数调用。\n\
  \n在这种情况下，避免这种调用并不完全直观。人们很容易认为，正确的答案是使用 `ctype` 的另一个成员函数：\n\n`const char* ctype<char>::toupper(char*\
  \ f, char* l) const`\n\n它会改变范围 `f, l)` 内字符的大小写。不幸的是，这并不是我们我们目的的正确接口。使用它来比较两个字符串需要将两个字符串都拷贝到缓冲区中，然后将缓冲区转换为大写。这些缓冲区从哪里来？它们不能是固定大小的数组（多大才够用？），但动态数组需要昂贵的内存分配。\n\
  \n另一种解决方案是对每个字符进行一次大小转换，并缓存结果。这并不是一个完全通用的解决方案——例如，如果你处理的是 32 位 UCS-4 字符，它是完全不可行的。但如果你处理的是\
  \ `char`（大多数系统上为 8 位），在比较函数对象中维护 256 字节的大小转换信息也是不合理的。\n\n[点击此处查看代码图像\n\n```cpp\n\
  struct lt_str_2 :\npublic std::binary_function<std::string, std::string, bool> {\n\
  \    struct lt_char {\n        const char* tab;\n        lt_char(const char* t)\
  \ : tab(t) {}\n        bool operator()(char x, char y) const {\n            return\
  \ tab[x-CHAR_MIN] < tab[y - CHAR_MIN];\n        }\n    };\n\n    char tab[CHAR_MAX\
  \ - CHAR_MIN + 1];\n    lt_str_2(const std::locale& L = std::locale::classic())\
  \ {\n        const std::ctype<char>& ct = std::use_facet<std::ctype<char> >(L);\n\
  \        for (int i = CHAR_MIN; i <= CHAR_MAX; ++i)\n            tab[i - CHAR_MIN]\
  \ = (char) i;\n        ct.toupper(tab, tab + (CHAR_MAX - CHAR_MIN + 1));\n    }\n\
  \n    bool operator()(const std::string& x, const std::string& y) const {\n    \
  \    return std::lexicographical_compare(x.begin(), x.end(),\n        y.begin(),\
  \ y.end(),\n        lt_char(tab));\n    }\n};\n```\n\n如你所示，`lt_str_1` 和 `lt_str_2`\
  \ 并没有太大区别。前者拥有一个直接使用 `ctype` facet 的字符比较函数对象，而后者包含一个使用预计算大写转换表的字符比较函数对象。如果你创建一个\
  \ `lt_str_2` 函数对象，用它比较几个短字符串然后将其丢弃，这种方法可能会更慢。但对于任何实质性的用途，`lt_str_2` 都会明显比 `lt_str_1`\
  \ 快。在我的系统上，这种差异超过了一倍以上：使用 `lt_str_1` 排序一个包含 23791 个单词的列表需要 0.86 秒，而使用 `lt_str_2`\
  \ 只需 0.4 秒。\n\n我们从这一切中学习了什么？\n\n*   不区分大小写的字符串类是错误的抽象层次。C++ 标准库中的通用算法是通过策略（policy）进行参数化的，你应该利用这一事实。\n\
  *   字典序字符串比较是由字符比较构建的。一旦你有了一个不区分大小写的字符比较函数对象，问题就解决了。（而且你可以重用该函数对象来比较其他类型的字符序列，例如\
  \ `vector<char>`、字符串表或普通的 C 风格字符串。）\n*   不区分大小写的字符比较比看起来要困难。除非在特定区域（locale）的上下文中，否则它是没有的，因此字符比较函数对象需要存储区域信息。如果考虑速度，你应该编写函数对象以避免重复调用昂贵的\
  \ facet 操作。\n\n正确的不区分大小写比较需要大量的机制，但你只需要写一次。你可能不想考虑区域（locale）；大多数人都不想。（谁会在 1990 年想过千禧年漏洞\
  \ 呢？）尽管如此，如果你能写好依赖于区域的代码，那么你忽略区域的几率会比编写掩盖这些依赖关系的代码要大。\n\n![](img/348871.jpg)\n\n\
  ## 附录 B. 关于 Microsoft STL 平台的备注\n\n在本书的开头，我引入了 *STL 平台* 术语，是指特定编译器和标准模板库特定实现的组合。如果你在使用版本\
  \ 6 或更早版本的 Microsoft Visual C++ 编译器（即随版本 6 或更早版本的 Microsoft 发布的编译器），这种 STL 平台在 .NET\
  \ 之前是非常重要的，因为编译器有时比实现更强大。在附录中，我描述了旧版 STL 的缺陷，并提供了变通方案。对于 Visual C++ 6 之后的开发者，可以忽略这些问题。\n\
  \n### STL 中的成员模板函数\n\n在本书的开头，我引入了 *STL 平台* 术语，是指特定编译器和标准模板库特定实现的组合。如果你在使用版本 6 或更早版本的\
  \ Microsoft Visual C++ 编译器（即随版本 6 或更早版本的 Microsoft 发布的编译器），这种 STL 平台在 .NET 之前是非常重要的，因为编译器有时比实现更强大。在附录中，我描述了旧版\
  \ STL 的缺陷，并提供了变通方案。对于 Visual C++ 6 之后的开发者，可以忽略这些问题。\n\n### STL 中的成员模板函数\n\n假设你有两个\
  \ `Widget` `vector`，你想将一个 `vector` 拷贝到另一个 `vector` 的末尾。这很容易。只需使用 `vector` 的 `insert`\
  \ 函数（参见 Item 5 ):\n\n点击此处查看代码图像\n\n```cpp\nvector<Widget> vw1, vw2;\n...\nvw1.insert(vw1.end(),\
  \ vw2.begin(), vw2.end()); // 将 vw2 拷贝到 vw1 的末尾\n```\n\n如果你有一个 `vector` 和一个 `deque`，你可以同样这样做：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<Widget> vw;\ndeque<Widget> dw;\n...\nvw.insert(vw.end(),\
  \ dw.begin(), dw.end()); // 将 dw 拷贝到 vw 的末尾\n```\n\n事实上，无论要拷贝对象的容器类型是什么，你都可以这样做。这取决于容器的迭代器类型。即使是自定义容器也是如此：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<Widget> vw;\n...\nlist<Widget> lw;\n...\nvw.insert(vw.begin(),\
  \ lw.begin(), lw.end()); // 将 lw 拷贝到 vw 的头部\n\nset<Widget> sw;\n...\nvw.insert(vw.begin(),\
  \ sw.begin(), sw.end()); // 将 sw 拷贝到 vw 的头部\n\n```\n\n```cpp\ntemplate<typename\
  \ T, // 用于自定义的模板\ntypename Allocator = allocator<T> > // STL 兼容\nclass SpecialContainer\
  \ { ... }; // 容器\n\nSpecialContainer<Widget> scw;\n...\nvw.insert(vw.end(), scw.begin(),\
  \ scw.end()); // 将 scw 拷贝到 vw 的末尾\n```\n\n这种灵活性之所以可能，是因为 `vector` 的范围 `insert` 函数并不是函数。相反，它是一个*成员函数模板*，可以使用*任何迭代器类型*实例化以生成特定的范围\
  \ `insert` 函数。对于 `vector`，标准声明的 `insert` 模板如下：\n\n点击此处查看代码图像\n\n```cpp\ntemplate\
  \ <class T, class Allocator = allocator<T> >\nclass vector {\npublic:\n    ...\n\
  \    template <class InputIterator>\n    void insert(iterator position, InputIterator\
  \ first, InputIterator last);\n    ...\n};\n```\n\n每个标准容器都要求提供这种模板化的范围 `insert`\
  \ 函数。类似的成员函数模板也用于容器的范围构造函数和 `assign` 的范围形式（两者都在 Item 5 中被讨论过）。\n\n\n\n\n\n遗憾的是，MSVC\
  \ 版本 4–6 附带的 STL 实现没有声明任何成员函数模板。该库最初是为 MSVC 版本 4 开发的，而该编译器像那个时代的大多数编译器一样，缺乏成员函数模板功能。在\
  \ MSVC4 和 MSVC6 之间，编译器增加了对这些模板的支持，但由于影响了微软且未直接涉及微软的法律诉讼，该库基本上保持了冻结状态。\n\n由于随 MSVC4–6\
  \ 附带的 STL 实现是为缺乏成员函数模板的编译器而设计的，因此该库的作者通过将每个模板替换为特定的函数来估算此类模板的功能，这些函数只接受来自同一容器类型的迭代器。以\
  \ `insert` 为例，成员函数模板被替换为如下内容：\n\n点击此处查看代码图像\n\n```\nvoid insert(iterator position,\
  \ // \"iterator\" is the\niterator first, iterator last); // container's iterator\
  \ type\n```\n\n这种受限的范围成员函数形式使得能够从 `vector<Widget>` 到 `vector<Widget>` 或从 `list<int>`\
  \ 到 `list<int>` 执行范围 `insert`，但不能从 `vector<Widget>` 到 `list<Widget>` 或从 `set<int>`\
  \ 到 `deque<int>` 执行。即使从 `vector<long>` 到 `vector<int>` 执行范围 `insert`（或 `assign`\
  \ 或构造）也是不可能的，因为 `vector<long>::iterator` 与 `vector<int>::iterator` 不是同一类型。结果，以下完全有效的代码在\
  \ MSVC4–6 上无法编译：\n\n点击此处查看代码图像\n\n```\nistream_iterator<Widget> begin(cin), end;\
  \ // create begin and end\n// iterators for reading\n// Widgets from cin\n// (参见\
  \ Item 6 ) )\nvector<Widget> vw(begin, end); // read cin's Widgets into vw\n// (再次，参见\
  \ Item 6 ) *; won't*\n// *compile with MSVC4-6*\nlist<Widget> lw;\n...\nlw.assign(vw.rbegin(),\
  \ vw.rend()); // assign vw's contents to lw\n// (in reverse order) *; won't*\n//\
  \ *compile with MSVC4-6*\nSpecialContainer<Widget> scw;\n...\nscw.insert(scw.end(),\
  \ lw.begin(), lw.end()); // insert at the end of scw a\n// copy of the Widgets in\
  \ lw;\n// *won't compile with*\n*MSVC4-6*\n```\n\n那么如果你必须使用 MSVC4–6，该怎么办？这取决于你使用的\
  \ MSVC 版本以及你是否被强制使用编译器附带的 STL 实现。\n\n### MSVC4–5 的变通方法\n\n再次查看那些随 MSVC4–6 附带的 STL\
  \ 无法编译的有效代码示例：\n\n点击此处查看代码图像\n\n```\nvector<Widget> vw(begin, end); // rejected\
  \ by the MSVC4-6\n//STL implementation\nlist<Widget> lw;\n...\nlw.assign(vw.rbegin(),\
  \ vw.rend()); //also rejected\nSpecialContainer<Widget> scw;\n...\nscw.insert(scw.end(),\
  \ lw.begin(), lw.end()); // ditto\n```\n\n这些调用看起来相当不同，但它们都失败于相同的原因：STL 实现中缺少成员函数模板。对于这些问题有一个通用的治疗方法：改而使用\
  \ `copy` 和插入迭代器（参见 Item 30 )）。例如，这里是上述示例的变通方法：\n\n点击此处查看代码图像\n\n```\nistream_iterator<Widget>\
  \ begin(cin), end;\nvector<Widget> vw; // default-construct vw;\ncopy (begin, end,\
  \ back_inserter (vw)); // then copy the\n// Widgets in cin into it\nlist<Widget>\
  \ lw;\n...\nlw.clear(); // eliminate lw's old\ncopy (vw.rbegin(), vw.rend(), back_inserter\
  \ (lw)); // Widgets; copy over\n// vw's Widgets (in\n// reverse order)\nSpecialContainer<Widget>\
  \ scw;\n...\ncopy (lw.begin(), lw.end(), // copy lw's Widgets to\ninserter (scw,\
  \ scw.end())); // the end of scw\n```\n\n我鼓励你在使用 MSVC4–5 附带的库时使用基于 `copy` 的变通方法，但要小心！不要掉入习惯了这些变通方法的陷阱，以至于忘记了它们只是*变通方法*。正如\
  \ Item 5 所解释的，使用 `copy` 算法几乎总是不如于使用范围成员函数，因此只要你有机会将 STL 平台升级到支持成员函数模板的平台，就要在范围成员函数是恰当的方法停止使用\
  \ `copy`。\n\n### MSVC6 的额外变通方法\n\n你也可以在 MSVC6 上使用 MSVC4–5 的变通方法，但对于 MSVC6 还有另一个选项。（此处重复内容已按逻辑要求处理）。MSVC6\
  \ 编译器支持成员函数模板。\n\n无论你选择 SGI 的、STLport 的还是 Dinkumware 的实现作为 STL 替代，你不仅获得了一个支持成员函数模板的\
  \ STL，还将绕过库其他部分的兼容性问题，例如 `string` 未声明 `push_back`。此外，你还将获得非常有用的 STL 扩展，包括哈希容器（参见\
  \ Item 25 ）和单链表（`slist`）。SGI 和 STLport 的实现还提供了各种非标准仿器类，例如 `select1st` 和 `select2nd`（参见\
  \ Item 50 ).\n\n## 脚注\n\n^(†) 如果对 `auto_ptr` 标准化的痛苦历史感兴趣，请将网络浏览器指向 *More Effective\
  \ C++* 网站上的 *`auto_ptr`* *更新页面* [29 ]。\n\n\n\n\n\n这仅对于接受迭代器参数的 `erase` 形式有效。关联容器还提供了一种接受取值（value）参数的\
  \ `erase` 形式，该形式返回被删除的元素个数。在这里，我们只关注通过迭代器进行 `erase`。\n\n该保证中存在一个漏洞。如果异常完全没有被捕获，程序将终止。在这种情况下，局部对象（如\
  \ `lock`）可能不会调用析构函数。某些编译器会调用它们，而某些则不会。两种行为都是有效的。\n\n因为 `log[1.5] 1000 = 18`（向上取整为整数）。\n\
