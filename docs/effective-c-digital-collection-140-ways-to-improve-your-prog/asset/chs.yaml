  \ Designs*，Addison-Wesley, 1996, ISBN 0-201-63371-X。也可适用于 *Effective C++ CD*（见下文）。\n\
  \n• Scott Meyers, *Effective C++ CD: 85 Specific Ways to Improve Your Programs and\
  \ Designs*,Addison-Wesley, 1999, ISBN 0-201-31015-5。包含 *Effective C++*（第二版）、*More\
