  \n## Usenet 新闻组\n\n有三个 Usenet 新闻组专门负责 C++。一个通用的、随心所欲的新闻组是 `comp.lang.c++`。那里的帖子涵盖了万象：从对高级编程技巧的详细解释，到热爱或厌恶\
  \ C++ 的人的咆哮与赞美，再到全球各地的本科生为他们拖到太晚才开始完成的作业寻求帮助。该新闻组的访问量极高。除非你有几个小时的空闲时间，否则你可能需要使用过滤器来帮助“去粗取精”。找个好的过滤器——杂质有很多。\n\
  \n1995 年 11 月，创建了 `comp.lang.c++` 的版主版本。该新闻组命名为 `comp.lang.c++.moderated`，也旨在对 C++\
  \ 及相关问题进行常规讨论，但版主的目标是过滤掉与实现相关的问题和注释、详尽的在线 FAQ（“常见问题”列表）中已涵盖的问题、火焰战以及其他对大多数 C++ 从业者不感兴趣的事题。\n\
  \n一个关注更窄的新闻组是 `comp.std.c++`，它致力于讨论 C++ 标准本身。这个组里充满了“语言律师”，但如果你对 C++ 的某些挑剔问题在现有的参考书中得不到答案，这里是一个寻求答案的好地方。该新闻组由版主管理，因此信噪比非常高；你不会在这里看到任何寻求作业帮助的请求。\n\
  \n## 一个 `auto_ptr` 实现\n\n项目 9, 10, 26, 31 和 32 证明了 `auto_ptr` 模板的显著用途。遗憾的是，目前很少有编译器自带“正确”的实现。^(†)\
  \ 项目 9 和 28 描绘了你如何自己编写一个实现，但在启动现实项目时，拥有比草图更具体的东西要好得多。\n\n以下是 `auto_ptr` 实现的两种展示方式。第一种方式记录了类接口并在类定义之外实现了所有成员函数。第二种方式在类定义内部实现了每个成员函数。从风格上说，第二种方式劣于第一种，因为它没有将类接口与其实现分离。然而，`auto_ptr`\
  \ 产生的是简单的类，而第二种方式比第一种清晰地体现了这一点。\n\n这里是带有接口文档的 `auto_ptr`：\n\n点击查看代码图片\n\n```cpp\n\
