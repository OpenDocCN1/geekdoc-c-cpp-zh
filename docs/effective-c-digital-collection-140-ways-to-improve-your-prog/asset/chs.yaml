  \n## 前言\n\n> 它没有丝带！它没有标签！\n> 它没有包装、盒子或袋子！\n> — 苏斯博士，《格林奇是如何偷圣诞节的！》\n\n我第一次在 1995\
  \ 年介绍标准模板库，当时我在《More Effective C++》的最后一项以一个简短的 STL 概述结束。我本该谨慎一点的。不久后，我开始收到邮件，问我什么时候会写《Effective》。\n\
  \n我抵制了这一想法几年。起初，我对 STL 的熟悉程度不足以对它提供建议，但随着时间的推移，我对它的经验日益增长，这种担忧让位了其他顾虑。毫无疑问，该库代表了高效和可扩展设计领域的突破，但在*使用\
  \ STL* 时，存在我无法忽视的实际问题。移植除最简单的 STL 程序以外的所有都是挑战，不仅是因为实现各异，还因为底层编译器的模板支持从优秀到糟糕不等。STL\
  \ 教程很难得到，因此学习“STL 编程方式”很困难，而一旦克服了这一障碍，寻找易懂且准确的参考文档也是一项挑战。最令人畏的是，即使是微小的 STL 使用错误通常也会导致雪崩般的编译器诊断，每条都有数千个字符，且大多数指向错误源代码中未提到的类、函数或模板，几乎完全无法理解。然后，我注意到了一些令我惊讶的事情。尽管存在移植性问题，尽管文档糟糕，尽管编译器诊断看起来像传输噪声，我的许多咨询客户仍然在使用\
  \ STL。此外，他们不仅仅是在玩玩，而是在生产代码中使用它！这真是一个启发。\n\n\n\n\n此外，我知道关于 STL 的情况只会变得更好。库和编译器将变得更加符合标准（它们已经做到了），更好的文档将会出现（已经有了——请参阅从第\
  \ 225 页开始的参考文献），编译器的诊断也将改进（在很大程度上，我们仍在等待，但 Item 49 提供了我们在等待期间如何应对的建议）。因此，我决定尽一份力量，为\
  \ STL 运动做些贡献。这本书就是成果：改进你使用 C++ 标准模板库的 50 种具体方法。\n\n我最初的计划是在 1999 年下半年编写这本书，并带着这一想法拟定了一个大纲。但随后我改变了方向。我暂停了书籍的编写，开发了一门关于\
  \ STL 的入门培训课程，然后我向几组程序员教授了多次。大约一年后，我回归这本书，根据我培训课程的经验对大纲进行了大幅修订。正如我的 *Effective C++*\
  \ 之所以成功是因为立足于真实程序员所面临的问题，我希望 *Effective STL* 同样能解决 STL 编程的实践问题——这些是对专业开发人员最重要的方面。\n\
  \n我一直在寻找改进对 C++ 理解的方法。如果你对 STL 编程有新的准则建议，或者你对书中的准则有任何意见，请告诉我。此外，我持续的目标是使这本书尽可能准确，因此对于向我报告的书中每一个错误——无论是技术性的、语法的、拼写的还是其他的——在未来的印刷中，我都会乐意在致谢中加入第一个发现该错误的人的名字。请将你建议的准则、意见和批评发送到\
  \ estl@aristeia.com 。\n\n我维护着一份自初版印刷以来的书籍更改列表，包括错误修复、澄清和技术更新。该列表可以在 *Effective STL\
  \ Errata* 网站获取：[`www.aristeia.com/BookErrata/estl1e-errata.html`](http://www.aristeia.com/BookErrata/estl1e-errata.html)\
  \ 。\n\n如果你想在我对这本书进行更改时收到通知，我鼓励你加入我的邮件列表。我使用该列表发布可能对关注我 C++ 工作的人感兴趣的公告。详情请参阅 [`www.aristeia.com/MailingList/`](http://www.aristeia.com/MailingList/)\
  \ 。\n\nSCOTT DOUGLAS MEYERS 俄勒冈州斯塔福德\n\n[`www.aristeia.com/`](http://www.aristeia.com/)\
  \ 2001 年 4 月\n\n## 致谢\n\n在理解 STL、创建其相关的培训课程以及编写这本书的大约两年时间里，我得到了巨大的帮助。在我所有的帮助来源中，有两点尤为重要。第一个是\
  \ Mark Rodgers。Mark 慷慨地在在我创建培训材料时审阅它们，从他那里学到的 STL 知识比其他任何地方都要多。他还担任了这本书的技术评审员，再次提供了改进了几乎每一个章节（Item）的观察和见解。\n\
  \n另一个卓越的信息来源是几个与 C++ 相关的 Usenet 新组，特别是 `comp.lang.c++.moderated` (`clcm`)、`comp.std.c++`\
  \ 和 `microsoft.public.vc.stl`。十多年来，我一直依赖这些新闻组的参与者来回答我的问题并挑战我的思维，很难想象如果没有他们我该怎么办。我深感谢\
  \ Usenet 社区对这本书以及我之前关于 C++ 出版物提供的帮助。\n\n我对 STL 的理解是由各种出版物塑造的，其中最重要的列在参考文献中。我特别依赖\
  \ Josuttis 的 *The C++ Standard Library* [3 ]。\n\n这本书从根本上是对他人见解和观察的总结，尽管有少数想法是我自己的。我曾试图记录我在从哪里学到了什么，但这项任务是徒劳的，因为一个典型的章节（Item）包含了在长时间内从多个来源收集的信息。接下来的内容是不完整的，但这已是我的所能。请注意，我这里的目标是总结*我*第一次了解到某个想法或技术的地方，而不是该想法或技术最初开发的地方，或者是由谁提出的。\n\
  \n\n\n\n在 Item 1 中，我观察到节点容器对事务语义提供了更好的支持，这一结论基于 Josuttis 的《*C++ Standard Library*》第\
  \ 5.11.2 节 [3 ]。[Item 2 包含了 Mark Rodgers 提供的一个一个示例，说明了当分配器类型发生变化时 `typedef` 如何提供帮助。Item\
  \ 5 的灵感源于 Reeves 的《*C++ Report*》专栏“STL 陷阱” [17 ]。[Item 8 源于 Sutter 的《*Exceptional\
  \ C++*》中的 Item 37 [8 ]，且 Kevlin Henney 就 `auto_ptr` 容器在实践中如何失效的提供了重要的细节。在 Usenet\
  \ 发布中，Matt Austern 提供了分配器何时用的示例，我将他的示例包含在 Item 11 中。Item 12 基于 SGI STL 网站上关于线程安全的讨论\
  \ [21 ]。Item 13 中关于多线程环境下引用计数对性能的影响的内容引自 Sutter 对此主题的写作 [20 ]。Item 15 的想法来自 Reeves\
  \ 的《*C++ Report*》专栏“在现实世界中使用标准 `string`，部分 2” [18 ]。在 Item 16 中，Mark Rodgers 提出了我所展示的技巧，让\
  \ C API 直接将数据写入 `vector`。Item 17 包含了来自 Siemel Naran 和 Carl Barron 在 Usenet 上的信息。我从\
  \ Sutter 的《*C++ Report*》专栏“容器何时时候不是容器？”中借用了了 Item 18 [12 ]。在 Item 20 中，Mark Rodgers\
  \ 贡献了通过解引用函数对象将指针转换为对象的想法，Scott Lewandowski 提出了我展示的 `DereferenceLess` 版本。Item 21\
  \ 源于 Doug Harrison 在 `microsoft.public.vc.stl` 上的帖子，但将该项目的关注点限制在等价上的决定是我做的。我将 Item\
  \ 22 基于 Sutter 的《*C++ Report*》专栏“标准库新闻：`set` 和 `map`” [13 ]；Matt Austern 帮助我理解标准化委员会库问题\
  \ #103 的状态。Item 23 的灵感来自 Austern 的《*C++ Report*》文章“为什么你不应该使用 `set` ——以及应该用什么” [15\
  \ ]；David Smallberg 为我的 `DataCompare` 实现提供了一个精巧的改进。我对 Dinkumware 哈希表容器的描述基于 Plauger\
  \ 的《*C/C++ Users Journal*》专栏“哈希表” [16 ]。Mark Rodgers 不同意 Item 26 的整体建议，但该项目的早期动力是他他的观察：某些容器成员函数只接受\
  \ `iterator` 类型的参数。我对 Item 29 的处理受到了涉及 Matt Austern 和 James Kanze 的 Usenet 讨论的启发和告知；我也受到\
  \ Kreft 和 Langer 的《*C++ Report*》文章“用户定义插入器和提取器的复杂实现”的影响 [25 ]。Item 30 归于 Josuttis\
  \ 的《*C++ Standard Library*》第 5.4.2 节的讨论 [3 ]。在 Item 31 中，由于 Josuttis 的《*C++ Standard\
  \ Library*》第 5.4.2 节的讨论 [3 ]，Marco Dalla Gasper 贡献了相关的示例，而我使用 `nth_element` 计算中位数的例子源于\
