  \ 和 Robin Bruce（都是营销人员，但非常友善）。\n\nAbbi Staley 让周日的午餐变成了一段惯常且愉快的体验。\n\n正如她在之前的六本书和一张\
  \ CD 中所做的那样，我的妻子 Nancy 以她一如既有的宽容忍受我的研究和写作需求，并在我最需要的时候给予我鼓励和支持。她从不忘记提醒我，生活不仅仅有 C++\
  \ 和软件。\n\n还有我们的狗 Persephone。当我写下这些文字时，正是她的六岁生日。今晚，她、Nancy 和我将去 Baskin-Robbins 吃冰淇淋。Persephone\
  \ 要吃香草味的。一球。装在杯里。带走。\n\n## 引言\n\n你已经熟悉 STL 了。你知道如何创建容器、迭代内容、添加和删除元素，并应用常用算法，如 `find`\
  \ 和 `sort`。但你并不满意。你无法摆脱这种感觉：STL 提供的功能比你利用的要多。本该简单的任务并不简单。本该直接的操作会导致资源泄漏或行为异常。本该高效的过程需要比你愿意提供的更多时间或内存。是的，你知道如何使用\
  \ STL，但你不确定自己是否在*有效地*（effectively）使用它。\n\n我写这本书是为了写给你。\n\n在 *Effective STL* 中，我解释了如何结合\
  \ STL 组件以充分利用该库的设计。这些信息允许你针对简单直接的问题开发简单直接的解决方案，也能帮助你为更复杂的问题设计优雅的方法。我描述了常见的 STL 使用错误，并向你展示如何避免它们。这能帮助你规避资源泄漏、无法移植的代码以及未定义行为。我讨论了优化代码的方法，让\
  \ STL 运行得像它旨在成为的那样快速、流畅。\n\n书中的信息将让你成为一个更优秀的 STL 程序员。它会让你成为一个效率更高的程序员。还会让你成为一个更快乐的程序员。使用\
  \ STL 是很有趣的，但有效地使用它是极大的乐趣，这种乐趣让你不得不被别人从键盘前拉走，因为你简直不敢相信自己过得如此开心。即使只是扫一眼 STL，也能发现它是一个奇妙酷炫的库，但这种酷炫比你想象的要广泛和深刻得多。我在书中的主要目标之一就是让你传达这个库有多么神奇，因为在我编程的近\
  \ 30 年里，我从未见过像 STL 这样的东西。你可能也没有。\n\n### 定义、使用和扩展 STL\n\n“STL”并没有官方的定义，不同的人在使用这一术语时含义各不相同。在本书书中，“the\
  \ STL”指的是 C++ 标准库中与迭代器协作的部分。这包括标准容器（包括 `string`）、iostream 库的部分内容、函数对象和算法。它排除了标准容器适配器（`stack`、`queue`\
  \ 和 `priority_queue`）以及容器 `bitset` 和 `valarray`，因为它们缺乏迭代器支持。它也不包括数组。诚然，数组以指针的形式迭代器，但数组是\
  \ C++ *语言*的一部分，而不是库。\n\n从技术来说，我对 STL 的定义除了标准 C++ 库的扩展，特别是哈希容器、单链表、绳（ropes）以及各种非标准函数对象。尽管如此，一个有效的\
  \ STL 程序员需要意识到这些扩展，因此我会在适当的地方提到它们。事实上，Item 25 专门介绍了非标准哈希容器的概述。它们现在不在 STL 中，但类似于它们的东西几乎会进入下一个版本的标准\
  \ C++ 库，洞察未来是有价值的。\n\nSTL 扩展存在的理由之一是 STL 是一个为了可扩展而设计的库。然而，在本书书中，我关注的是*使用* STL，而不是向它添加新组件。例如，你会发现我对于编写自己的算法几乎话可说，而且对于编写新容器和迭代器没有提供任何指导。我相信，在增强其功能之前，精通\
  \ STL 已经提供的功能是重要的，这就是我在 *Effective STL* 中关注的。当你决定创建自己的类 STL 的组件时，你可以在 Josuttis 的\
  \ *The C++ Standard Library* [3 ] 和 Austern 的 *Generic Programming and the STL*\
  \ [4 ] 等书籍中找到如何做的建议。我在书中*确实*讨论了 STL 扩展的一个方面：编写自己的函数对象。如果你不知道如何做到这一点，就无法有效地使用 STL，因此我专门了一个章节讨论这一主题（第\
  \ 6 章）。\n\n### 引用\n\n前一段对 Josuttis 和 Austern 书籍的引用展示了我如何处理参考文献引用。通常情况下，我尝试提到被引用作品的足够信息，以便熟悉它的人能够识别出来。例如，如果你已经了解这些作者的书，你就不需要查参考文献就能发现\
  \ [3 ] 和 [4 ] 指的是你已经知道的书。当然，如果你不熟悉某部出版物，参考文献（从第 225 页开始）将为你提供完整的引用。\n\n我经常引用三部作品，因此我通常省略引用编号。其中第一个是\
  \ C++ 国际标准 [5 ]，我通常将其简称为“该标准”。另外两本是我早期关于 C++ 的书籍，*Effective C++* [1 ] 和 *More Effective\
  \ C++* [2 ]。\n\n### STL 与标准\n\n\n\n\n我经常引用 C++ 标准，因为 *Effective STL* 关注的是可移植的、符合标准的\
  \ C++。从理论来说，我在书中展示的所有内容都可以在每个 C++ 实现中运行。在实践中，事实并非如此。编译器和 STL 实现中的缺陷共同导致了某些有效代码无法编译，或者其行为没有按照预期的方式运行。在这些问题常见的情况下，我会描述这些问题，并解释你如何绕过它们。\n\
  \n有时候，最简单的绕过方法是使用不同的 STL 实现。附录 B 给出了这种情况的示例。事实上，你与 STL 打交道越深，区分你的`编译器`（compilers）和`库实现`（library\
  \ implementations）就变得越重要。当程序员在尝试让合法代码编译时遇到困难时，他们习惯于归咎编译器，但对于 STL 来说，编译器可能是好的，而 STL\
  \ 实现是有缺陷的。为了强调你同时依赖编译器和库实现这一事实，我将它们称为 `STL 平台`（STL platforms）。一个 STL 平台是特定编译器和特定\
  \ STL 实现的组合。在本书中，如果我提到编译器问题，你可以确定我的意思是编译器是罪魁祸首。然而，如果我提到你的 STL 平台有问题，你应该将其解释为“可能是编译器\
  \ bug，可能是库 bug，也可能两者都是”。\n\n我通常指代你的“编译器”（复数）。这源于我长期以来的一个信念：如果你能确保代码在多个编译器上运行，你就能提高代码的质量（特别是可移植性）。此外，使用多个编译器通常更容易解开因不当使用\
  \ STL 而产生的错误信息那错综复杂的乱麻。（条目 49 专门介绍了译码此类信息的方法。）\n\n我强调符合标准代码的另一个方面是，我担心你没有避免具有未定义行为（undefined\
  \ behavior）的结构。此类结构在运行时可能会发生任何操作。不幸的是，这意味着它们可能恰好按照你所希望的方式运行，从而导致虚假的安全感。太多的程序员假设未定义行为总是会导致显而易的问题的问题例如段错误或其他灾难性的失败。未定义行为的结果实际上可能微妙得多，例如很少被引用的数据损坏。它们在不同的程序运行中也可能不同。我发现，对未定义行为的一个良好的工作定义是“对我有效，对你有效，在开发和\
  \ QA 期间有效，但在你最重要的客户面前却炸了”。避免未定义行为是非常重要的，因此我指出了可能出现的常见情况。你应该训练自己对这类情况保持警惕。\n\n###\
  \ 引用计数（Reference Counting）\n\n如果不提到引用计数，讨论 STL 几乎是不可能的。正如你会在 条目 7 和 33 中看到的那样，基于指针容器的设计几乎不可避免地会导致引用计数。此外，许多\
  \ `string` 实现在内部都使用了引用计数，并且正如 条目 15 所解释的，这可能是一个你无法忽略的实现细节。在书中，我假设你已经熟悉引用计数的基础知识。如果你不熟悉，大多数中高级\
  \ C++ 教程都涵盖了这个主题。例如，在 *More Effective C++* 中，相关材料位于 条目 28 和 29 中。如果你不知道引用计数是什么且没有兴趣学习它，不要担心。你可以顺利地读完这本书，尽管这里那里可能会有几句话读起来没有本该那么那么通顺。\n\
  \n### `string` 和 `wstring`\n\n我关于 `string` 的任何话论同样适用于它的宽字符对应项 `wstring`。同样，每当我提到\
  \ `string` 与 `char` 或 `char*` 之间的关系时，`wstring` 与 `wchar_t` 或 `wchar_t*` 之间的关系也是如此。换句话说，仅仅因为我书中书中显式提到宽字符字符串，不要假设\
  \ STL 不支持它们。它对它们的支持与基于 `char` 的字符串一样好。它必须如此。`string` 和 `wstring` 都是同一个模板 `basic_string`\
  \ 的实例化。\n\n### 术语、术语、术语\n\n这并不是一本关于 STL 的入门书，所以我假设你已经掌握了基础知识。尽管如此，以下术语足够重要，我觉得我有必要回顾它们：\n\
  \n- `vector`、`string`、`deque` 和 `list` 被称为*标准序列容器*（standard sequence containers）。*标准关联容器*（standard\
  \ associative containers）是 `set`、`multiset`、`map` 和 `multimap`。\n\n- 迭代器根据它们支持的操作分为五类。简单来说，输入迭代器*（input\
  \ iterators）是只读迭代器，每个迭代位置可能只能读取一次。*输出迭代器*（output iterators）是只写迭代器，每个迭代位置可能只能写入一次。输入输出迭代器是基于读写输入输出流（例如文件）建模的。因此，输入输出迭代器最常见的表现分别是\
  \ `istream_iterator` 和 `ostream_iterator`，并不意外。*前向迭代器*（forward iterators）具有输入和输出迭代器的能力，但它们可以重复地读写同一个位置。它们不支持\
  \ `operator--`，所以它们只能向前移动，无论效率如何。正如你会在 条目 25 中看到的，哈希容器的设计产生了前向迭代器。单链表容器（在 条目 50\
  \ 中考虑））也提供前向迭代器。*双向迭代器*（bidirectional iterators）与前向迭代器一样，但可以像向前一样向移动。标准关联容器都提供双向迭代器。`list`\
  \ 也是。*随机访问迭代器*（random access iterators）具备双向迭代器的所有功能，而且提供了“迭代器算术”，即单步向前跳转的能力。`vector`、`string`\
  \ 和 `deque` 各提供随机访问迭代器。数组指针作为数组的随机访问迭代器。\n\n- 任何重载了函数调用运算符（即 `operator()`）的类都是*函数类*（functor\
  \ class）。由此类类创建的对象被称为函数对象（function objects）或*函数器*（functors）。STL 中许多处理函数对象的地方也适用于真正的函数，因此我经常用“函数对象”一词来同时指代\
  \ C++ 函数和真正的函数对象。\n\n- 函数 `bind1st` 和 `bind2nd` 被称为绑定器（binders）。\n\nSTL 的一个革命性方面是它的复杂度保证。这些保证限制了任何\
  \ STL 操作允许执行的工作量。这是非常好的，因为可以帮助你确定同一问题的不同方法的相对效率，无论你使用哪种 STL 平台。不幸的是，如果你没有正式接触过计算机科学术语，复杂度保证背后的术语可能会令人困惑。以下是对我在书中使用的复杂度术语的简要介绍。每个术语都指的是执行某操作所需的时间随\
  \ n（容器或范围中的元素数量）变化的情况。\n\n- 以*常数时间*（constant time）运行的操作，其性能不受 *n* 变化的影响。例如，在 `list`\
  \ 中插入一个元素是常数时间操作。无论列表有一个元素还是一百万个元素，插入所需的时间都相等。\n\n\n\n\n不要字面上地理解“常数时间”（constant\
  \ time）这个术语。它并不意味着执行某操作所需的时间字面上是恒定的，它仅仅意味着不受 `n` 的影响。例如，两个 STL 平台执行同一个“常数时间”操作所需的时间可能大不相同。如果一个库的实现比另一个复杂得多，或者一个编译器执行了远为激进的优化，就会发生这种情况。\n\
  \n常数时间复杂度的一种变体是`均摊常数时间`（amortized constant time）。均摊时间运行的操作通常是常数时间操作，但偶尔它们需要取决于 `n`\
  \ 的时间。均摊常数时间操作`通常`在常数时间内运行。\n\n- 以`对数时间`（logarithmic time）运行的操作随着 `n` 的增大而需要更多时间，但其所需的时间增长速率与\
  \ `n` 的对数成比例。例如，对一百万个元素进行的操作预计所需时间仅为对一百元素操作的三倍左右，因为 `log n 3 = 3 log n`。关联容器（例如\
  \ `set::find`）上的大多数搜索操作都是对数时间操作。\n\n- 以`线性时间`（linear time）运行的操作所需的时间随 `n` 的增加而以成比例的速度增加。标准算法\
  \ `count` 以线性时间运行，因为它必须查看其给定范围内的每一个元素。如果范围的大小增加三倍，它就必须做三倍的工作，我们预计它它需要大约三倍的时间。\n\n\
  作为一个一般规则，常数时间操作运行得比需要对数时间的操作快，而对数时间操作运行得比性能线性的操作快。当 `n` 足够大时，这总是成立的，但对于相对较小的 `n`\
  \ 值，理论复杂度较差的操作有时可能优于理论复杂度更好的操作。如果你想了解更多关于 STL 复杂度保证，请参阅 Josuttis 的 *The C++ Standard\
  \ Library* [3 ]。\n\n关于术语的最后一点，请记住 `map` 或 `multimap` 中的每个元素都有两个组件。我通常将第一个组件称为 `key`（键），将第二个组件称为\
  \ `value`（值）。给定：\n\n```\nmap<string, double> m;\n```\n\n例如，`string` 是键，`double`\
  \ 是值。\n\n### 代码示例\n\n本书中充满了示例代码，我会在引入每个示例时对其进行解释。尽管如此，预先了解几点也是值得的。\n\n你可以从上面的 `map`\
  \ 示例中看到，我经常省略 `#include` 并忽略 STL 组件位于 `std` 命名空间中的这一事实。在定义 map `m` 时，我可以这样写：\n\n\
  ```cpp\n#include <map>\n#include <string>\n\nusing std::map;\nusing std::string;\n\
  \nmap<string, double> m;\n```\n\n但我更倾向于为我们双方都减少这些干扰。\n\n当我为模板声明形式化类型参数时，我使用 `typename`\
  \ 而不是 `class`。也就是说，我不写成：\n\n```cpp\ntemplate<class T>\nclass Widget { ... };\n```\n\
  \n而是写成：\n\n```cpp\ntemplate<typename T>\nclass Widget { ... };\n```\n\n在这种语境下，`class`\
  \ 和 `typename` 的含义完全相同，但我发现 `typename` 更清晰地表达了我通常想说的内容：即*任何*类型都可以；`T` 不一定是一个类。如果你喜欢使用\
  \ `class` 来声明类型参数，请尽管使用。在这种语境下使用 `typename` 还是 `class` 纯属风格问题。\n\n在不同的语境下，这并不是风格问题。为了避免潜在的解析歧义（细节我就不就不详述了），你必须使用\
  \ `typename` 置于依赖形式化类型参数的类型之前。此类类型被称为`依赖类型`（dependent types），一个示例将有助于澄清我在说什么。假设你想为一个函数编写一个模板，该函数给定一个\
  \ STL 容器，返回容器中的最后一个元素是否大于第一个元素。这是实现它的一种方法：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ C>\nbool lastGreaterThanFirst(const C& container)\n{\n    if (container.empty())\
  \ return false;\n    typename C::const_iterator begin(container.begin());\n    typename\
  \ C::const_iterator end(container.end());\n    return *--end > *begin;\n}\n```\n\
  \n在这个示例中，局部变量 `begin` 和 `end` 的类型为 `C::const_iterator`。`const_iterator` 是依赖于形式化类型参数\
  \ `C` 的类型。因为 `C::const_iterator` 是一个依赖类型，你必须在它前面加上 `typename`。（某些编译器错误地接受了不带 `typename`\
  \ 的代码，但这种代码不可移植的。）\n\n我希望你注意到了我在上面示例使用的颜色。它的目的是将你的注意力集中在代码中特别重要的部分。通常，我会突出相关示例之间的差异，例如当我在\
  \ `Widget` 示例中展示声明参数 `T` 的两种可能方法时。这种用颜色标记示例中特别值得注意部分的用法也适用于图。例如，这张来自 Item 5 的图使用颜色来识别在插入新元素时受影响的两个指针：\n\
  \n![image](img/Image0054)\n\n我也使用颜色标记章节编号，但这种用法纯属多余。\n\n我最喜欢的两个参数是 `lhs` 和 `rhs`。它们分别代表“左操作数”和“右操作数”，在使用运算符时发现它们非常有用。由于这是我第一本彩色书，我希望你能原谅我有些夸张。\n\
  \n对于 `Widget` 类的名字，它与 GUI 或工具包无关。它只是我用来表示“某些某些类”的名字。有时，如第 7 页，`Widget` 是一个类模板而不是类。在这种情况下，你会发现我仍然将\
  \ `Widget` 称为类，尽管它实际上是模板。\n\n```cpp\nclass Widget { ... };\nbool operator==(const\
  \ Widget& lhs, const Widget& rhs );\n```\n\n当函数像这样被调用时：\n\n```cpp\nif (x == y) ...\
  \ // 假设 x 和 y 是 Widget\n```\n\n`x` 在 `==` 的左侧，在 `operator==` 内部被称为 `lhs`。\n\n我曾考虑在\
  \ *Effective STL* 中包含一个关于效率的章节，但最终认为目前的组织更好。尽管如此，许多 Item 都关注空间和运行需求。为了方便性能优化，这里是虚拟效率章节的目录：\n\
  \n- Item 4 ：调用 `empty` 而不是检查 `size()` 是否为零\n- Item 5 ：优先使用范围成员函数而非单元素对应的函数\n- Item\
  \ 14 ：使用 `reserve` 避免不重新分配\n- Item 15 ：注意字符串实现的差异\n- Item 23 ：考虑用排序向量替换关联容器\n- Item\
  \ 24 ：在效率重要时，仔细选择 `map::operator[]` 和 `map::insert` \n- Item 25 ：熟悉非标准的哈希容器\n- Item\
  \ 29 ：考虑使用 `istreambuf_iterators` 进行逐字符输入\n\n\n\n\n\n# 第 31 条：了解你的排序选项\n\n## 第 44\
  \ 条：优先使用成员函数而非同名的算法\n\n# 第 46 条：考虑使用函数对象而非函数作为算法参数\n\n## 《高效 STL》中的指南\n\n构成书中 50\
  \ 条内容（Item）的指南基于世界上最经验丰富的 STL 程序员的见解和建议。这些指南总结了为了从标准模板库（STL）中获得最大收益，你几乎总是应该做或几乎总是避免做的事情。与此同时，它们仅仅是指南。在某些情况下，违反这些指南是有意义的。例如，第\
  \ 7 条 的标题告诉你在容器销毁之前，对容器中的 `new` 出来的指针调用 `delete`，但该条的正文明确指出，这仅适用于指针所指向的对象应该随着容器的销毁而消失的情况。这种情况通常如此，但并非普遍如此。同样，第\
  \ 35 条 的标题恳请使用 STL 算法执行简单的不区分大小写的字符串比较，但该条的正文指出，在某些情况下，使用一个不仅在 STL 之外、甚至不是标准 C++\
  \ 一部分的函数会更好。\n\n只有你对自己正在编写的软件、它运行的环境以及它创建的背景足够了解，才能判断违反我提出的指南是否合理。大多数时候，它是不合理的，而且每个条目随后的讨论也解释了原因。在少数情况下，它是合理的。盲目听从指南是不恰当的，轻率忽视亦然不然。在你自顾其事之前，你应该确保自己有一个充分的理由。\n\
  \n### 第 1 章：容器\n\n诚然，STL 拥有迭代器、算法和函数对象，但对于大多数 C++ 程序员来说，最突出的是容器。它们比数组更强大、更灵活，能够动态增长（通常还会收缩）、管理自己的内存、跟踪持有的对象数量、限制其支持的操作的算法复杂度，等等等等。它们的流行是容易理解的。它们就是比竞争对手更好，无论竞争对手是其他库的容器，还是你自己编写的容器类型。STL\
  \ 容器不仅仅是好，它们*真的*很好。\n\n本章致力于适用于所有 STL 容器的指南。后续章节将侧重于特定的容器类型。这里涉及的话题包括：在面临的限制条件下选择合适的容器；避免认为为一种容器类型编写的代码可能适用于其他容器类型的幻觉；容器中对象拷贝操作的意义；在容器中存储指针或\
  \ `auto_ptr` 时产生的困难；删除的细节；使用自定义分配器可以和不能做什么；提高效率的技巧；以及在线程环境中使用容器的考虑因素。\n\n要涵盖的内容很多，但不必担心。这些条目将它们拆分成了易于理解的小块，在此过程中，你几乎可以学到几个*现在*就能应用到代码中的想法。\n\
  \n### 第 1 条：仔细选择你的容器\n\n你知道 C++ 提供了多种容器供你选择，但你意识到这种多样性到底有多大吗？为了确保你没有忽略掉任何选项，这里有一个快速回顾。\n\
  \n- **标准 STL 序列容器**：`vector`、`string`、`deque` 和 `list`。\n- **标准 STL 关联容器**：`set`、`multiset`、`map`\
  \ 和 `multimap`。\n- **非标准序列容器** `slist` 和 `rope`。`slist` 是单链表，而 `rope` 本质上是一个重型 `string`。（“rope”就是一种“重型\
  \ `string`”。懂了吗？）你将在第 50 条 中找到这些非标准（但常用）容器的简要概述。\n- **非标准关联容器** `hash_set`、`hash_multiset`、`hash_map`\
  \ 和 `hash_multimap`。我在第 25 条 中检查了这些广泛使用的、基于哈希表的标准关联容器变体。\n- **用 `vector<char>` 替代\
  \ `string`**。第 13 条 描述了这种替换可能合理的条件。\n- **用 `vector` 替代标准关联容器**。正如第 23 条 明确的那样，某些时候\
  \ `vector` 在时间和空间上都优于标准关联容器。\n\n- 若干**非 STL 容器**，包括数组、`bitset`、`valarray`、`stack`、`queue`\
  \ 和 `priority_queue`。因为这些是非 STL 容器，我在书中对它们话不多，尽管第 16 条 提到了数组优于 STL 容器的情况，且第 18 条\
  \ 解释了为什么 `bitset` 可能比 `vector<bool>` 好。同样注意的是，数组可以与 STL 算法一起使用，因为指针可以用数组迭代器。\n\n\
  这是一个丰富的选项，而选择它们时需要考虑的范围也同样丰富。遗憾的是，大多数关于 STL 的讨论观点非常狭隘，忽略了许多与选择最合适容器相关的问题。甚至标准也采取了这种做法，为在\
  \ `vector`、`deque` 和 `list` 之间选择提供了以下指导：\n\n```\nvector, list, and deque 为程序员提供了不同的复杂度权衡，应相应使用。vector\
  \ 是应该默认使用的序列类型。当在序列中间频繁插入和删除时，应使用 list。当大多数插入和删除发生在序列的开头或结尾时，deque 是首选的数据结构。\n```\
  \ 如果你主要关心算法复杂度，我假设这构成了合理的建议，但还有许多需要考虑的因素。\n\n稍后，我们将检查一些补充算法复杂度的重要容器相关问题，但首先我需要介绍一种分类\
  \ STL 容器的方法，这种方法讨论得那么频繁。那就是连续内存容器与节点容器的区别。\n\n*连续内存容器*（也称为*基于数组的容器*）将其元素存储在一个或多个（动态分配的）内存块中，每个内存块持有多个容器元素。如果插入新元素或删除现有元素，同一内存块中的其他元素必须向上或向下移动，以为新元素腾出空间或填充被删除元素留的空间。这种移动会影响性能（参见第\
  \ 5 条 和 14 条））和异常安全性（我们很快就会看到）。标准的连续内存容器有 `vector`、`string` 和 `deque`。非标准的 `rope`\
  \ 也是连续内存容器。\n\n\n\n\n\n`基于节点的容器（Node-based containers）`在每块（动态分配的）内存中只存储一个元素。容器元素的插入或删除操作只会影响指向节点的指针，而不会影响节点本身的内容，因此在插入或删除某些元素时，不需要移动元素的值。表示链表的容器（如\
  \ `list` 和 `slist` ）是基于节点的，所有的标准关联容器也是如此。（它们通常被实现为平衡树。）非标准的哈希容器使用了多种不同的基于节点的实现方式，正如你将在\
  \ Item 25 中看到的那样。\n\n在介绍这些术语之后，我们准备好勾勒出在选择容器时最相关的一些问题。在这些讨论中，我省略了对非 STL 风格容器（例如，数组、`bitset`\
  \ 集合等）的考虑，因为毕竟，这终是一本关于 STL 的书。\n\n- 你是否需要在容器的任意位置插入新元素？如果是的话，你需要序列容器；关联容器是无法满足的。\n\
  - 你是否在乎元素在容器中的排序方式？如果不在乎，哈希容器将是一个可行的选择。否则，你可能希望避免哈希容器。\n- 容器必须是标准 C++ 的一部分吗？如果是的话，那就排除了哈希容器、`slist`\
  \ 和 `rope`。\n- 你需要哪种类型的迭代器？如果必须是随机访问迭代器，那么你在技术上被局限于 `vector`、`deque` 和 `string`，但你可能也想考虑\
  \ `rope`。（关于 `rope` 的信息请参见 Item 50 ）。如果需要双向迭代器，你还必须避免 `slist`（参见 Item 50 ）以及哈希容器的一种常见实现方式（参见\
  \ Item 25 ）。\n- 在发生插入或删除时，避免现有容器元素的移动是否非常重要？如果是的话，你需要避开连续内存容器（参见 Item 5 ）。\n- 容器中的数据是否需要与\
  \ C 语言布局兼容？如果是的话，你局限于 `vector` s（参见 Item 16 ）。\n- 查找速度是否是关键考虑因素？如果是的话，你可能查看哈希容器（参见\
  \ Item 25 ）、排序后的 `vector` s（参见 Item 23 ）以及标准关联容器——可能按这个顺序。\n- 你介意底层容器使用引用计数吗？如果是的话，你可能希望避开\
  \ `string`，因为许多 `string` 实现都是引用计数的（参见 Item 13 ）。你还需要避免 `rope`，因为确定性的 `rope` 实现是基于引用计数的（参见\
  \ Item 50 ）。当然，你必须以某种方式表示你的字符串，所以你可能想考虑 `vector<char>`。\n- 你是否需要插入和删除的事务语义？也就是说，你是否需要可靠地回滚插入和删除操作的能力？如果是的话，你可能希望使用基于节点的容器。如果你需要多元素插入的事务语义（例如，范围形式——参见\
  \ Item 5 ），你可能倾向于选择 `list`，因为 `list` 是唯一一种为多元素插入提供事务语义的标准容器。事务语义对于那些关注编写异常安全代码的程序员来说尤为重要。（连续内存容器也可以实现事务语义，但会有性能开销，而且代码并不那么直观。要了解更多信息，请参阅\
  \ Sutter 的 *Exceptional C++* 中的 Item 17 [8 ）。）\n- 你是否需要最小化迭代器、指针和引用的失效？如果是的话，你可能希望使用基于节点的容器，因为此类容器上的插入和删除操作永远不会使迭代器、指针或引用失效（除非它们指向你正在删除的元素）。通常情况下，连续内存容器上的插入或删除可能会使指向容器的所有迭代器、指针和引用失效。\n\
  - 你在乎在容器上使用 `swap` 是否会导致迭代器、指针或引用失效吗？如果是的话，你需要避免 `string`，因为 `string` 是 STL 中唯一在\
  \ `swap` 期间会导致迭代器、指针和引用失效的容器。\n- 如果拥有一个具有随机访问迭代器的序列容器是否有帮助，只要不删除任何元素且插入仅发生在容器的末端，指向数据的指针和引用就不会失效？这是一个非常特殊的情况，但如果这是*你的*情况，`deque`\
  \ 就是你梦寐以求的容器。（有趣的是，当在末端进行插入时，`deque` 的迭代器可能会失效。）\n\n这些问题远不是问题的全部。例如，它们没有考虑到不同类型所采用的各种策略。（Item\
  \ 10](#text00048.html_ch01lev1sec1) 和 14 讨论了此类策略的某些方面。）尽管如此，它们应该足以说服你，除非你对排序、标准符合、迭代器能力、与\
  \ C 的布局兼容、查找速度、由于引用计数引起的异常、事务语义的实现或迭代器失效感兴趣，否则你需要考虑的不只是算法复杂度。STL 在容器方面提供了很多选项。如果你查看\
  \ STL 之外，还有更多选项。在选择容器之前，务必考虑*所有*选项。一个“默认容器”？我不认为如此。\n\n### Item 2：警惕容器无关代码的幻象\n\n\
  STL 是基于泛化的。数组被泛化为容器，并根据包含的对象类型参数化。函数被泛化为算法，并根据使用的迭代器类型参数化。指针被泛化为迭代器，并根据其指向的对象类型参数化。\n\
  \n这只是开始。具体的容器类型被泛化为序列和关联容器，相似的容器被相似的功能。标准的连续内存容器（参见 Item 1 ）提供随机访问迭代器，而标准的基于节点的容器（再次参见\
  \ Item 1 ）则提供双向迭代器。序列容器支持 `push_front` 和/或 `push_back` ，而关联容器不支持。关联容器提供了对数时间的 `lower_bound`、`upper_bound`\
  \ 和 `equal_range` 成员函数，但序列容器没有。\n\n随着这些泛化的进行，想要加入其中的这种心情是值得赞的，当你编写自己的容器、迭代器和算法时，你无疑想要追求它。然而，许多程序员试图以不同的方式追求它。他们没有在软件中提交特定的容器类型，而是试图泛化容器的概念，以便他们可以使用\
  \ `vector`，但保留以后将其替换为 `deque` 或 `list` 的选项——而无需更改使用它的代码。也就是说，他们力求编写*容器无关的代码*。这种泛化尽管初衷良好，但几乎总是误导的。\n\
  \n\n\n\n即使是对容器无关代码最热烈的拥护者，很快也会意识到，试图编写既能用于序列容器又能用于关联容器的软件是毫无意义的。许多成员函数仅适用于某一类容器，例如，只有序列容器支持\
  \ `push_front` 或 `push_back`，而只有关联容器支持 `count` 和 `lower_bound` 等。即使是像 `insert` 和\
  \ `erase` 这样的基础操作，其签名和语义也随类别而异。例如，当你向序列容器中 `insert` 一个对象时，它会留在你放置的位置；但如果你向关联容器中\
  \ `insert` 一个对象，容器会将该对象移动到它在容器排序顺序中应的位置。另一个例子是，接受迭代器的 `erase` 方法在序列容器上调用时会返回一个新的迭代器，但在关联容器上调用时则不返回任何内容。（Item\
  \ 9 给出了一个这种情况如何影响你编写的代码的示例。）\n\n假设，你希望编写出可以用于最常见的序列容器：`vector`、`deque` 和 `list`\
  \ 的代码。显然，你必须根据它们的共同交集进行编程，这意味着不能使用 `reserve` 或 `capacity`（参见 Item 14），因为 `deque`\
  \ 和 `list` 并不提供这些。`list` 的存在也意味着你放弃了 `operator[]`，并将自己限制在双向迭代器的能力范围内。这反过来意味着你必须避开要求随机访问迭代器的算法，包括\
  \ `sort`、`stable_sort`、`partial_sort` 和 `nth_element`（参见 Item 31）。\n\n另一方面，你对 `vector`\
  \ 的支持排除了 `push_front` 和 `pop_front` 的使用，且 `vector` 和 `deque` 都让 `splice` 和 `sort`\
  \ 的成员形式失效。结合上述限制，后者的禁令意味着你无法在你的“泛型序列容器”上调用任何形式的 `sort`。\n\n这些是显而易见的问题。如果你违反了这些任何一项限制，你的代码将无法在你想要使用的容器中的至少一个上通过编译。而*能够*通过编译的代码更具阴险性。\n\
  \n主要的罪祸是适用于不同序列容器的迭代器、指针和引用的失效规则不同。要编写出能在 `vector`、`deque` 和 `list` 中正确运行的代码，你必须假设在这些容器的任何一个中使迭代器、指针或引用失效的任何操作，都会使你正在使用的容器中的对应失效。因此，你必须假设每次调用\
  \ `insert` 都会失效一切，因为 `deque::insert` 会失效所有迭代器，且由于无法调用 `capacity`，必须假设 `vector::insert`\
  \ 会失效所有指针和引用。（Item 1 解释了这一点。）\n\n想要更多吗？你必须假设每次调用 `insert` 都会失效一切，因为你正在使用的容器中失效。（Item\
  \ 9 给出了一个这种情况如何影响你编写的代码的示例。） 类似的 `insert` 都会失效，因为 Item 16 解释了，除非你使用的容器中失效。（Item\
  \ 18 解释了，`vector` 并不总是。） 类似的 `insert` 都会失效，因为 Item 16 解释了，除非你使用的容器中失效。 类似的 `insert`\
