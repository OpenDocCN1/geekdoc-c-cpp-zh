  \ C++：改进程序和设计的 35 种新方法》的赞誉\n\n“这是一本关于 C++ 许多方面极具启发性的书：既包括你很少访问的语言领域，也包括你*以为*自己已经理解的熟悉领域。只有深入理解\
  \ C++ 编译器如何解释你的代码，你才希望能使用这种语言编写健壮的软件。这本书是获得这种理解水平的无价资源。读完这本书后，我觉得自己就像和一位 C++ 大师程序员进行了一次代码审查，并学到了他许多最有价值的见解。”\n\
  **—Fred Wild，Advantage Software Technologies 技术副总裁**\n\n“这本书包含了一系列编写良好 C++ 程序的重要技术。它解释了如何设计和实现这些想法，以及在某些显而易见的替代设计中隐藏着哪些潜在陷阱。它还对\
  \ C++ 最近添加的特性进行了清晰的解释。任何想使用这些新功能的人都会想手边放一本这本书以备随时参考。”\n**—Christopher J. Van Wyk，德鲁大学数学与计算机科学教授**\n\
  \n“最顶尖的工业级 C++。那些读过《有效的 C++》的人来说，这本书是完美的完美伴侣。”\n**—Eric Nagler，C++ 讲兼作者，加州大学圣塔克鲁兹延伸分校**\n\
  \n“《更有效的 C++》是对斯科特第一本书——《有效的 C++》的详尽且有价值的后续。我相信，每一位专业的 C++ 开发者都应该阅读并背诵《有效的 C++》和《更有效的\
  \ C++》中的技巧。我发现这些技巧涵盖了语言中不为人知、但重要且有时是奥秘的方面。我强烈将这本书以及他的第一本书推荐给开发者、测试人员和经理们……每个人都能从他的专家知识和卓越的讲解中受益。”\n\
  **—Steve Burkett，软件顾问**\n\n## 致谢\n\n许多人的帮助共同促成了这本书的诞生。有些人为技术主题贡献了主意，一些人帮助了书籍的制作过程，还有一些人只是在我工作期间让生活变得更有趣。\n\
  \n当一本书的贡献者很多时，放弃个人的致谢而代之以通用的“本书的贡献者多得无不详尽”并不罕见。我更倾向于遵循 John L. Hennessy 和 David\
  \ A. Patterson 在《[计算机体系结构量化方法](https://www.amazon.com/gp/product/0123704901?ie=UTF8&tag=mecpp1e-ebook-20&linkCode=as2&camp=1789&creative=9325&2creativeASIN=0123704901)》（Morgan\
  \ Kaufmann，1990 年第一版）中的详尽做法。除了为下文全面的致谢提供动力外，他们的书还为 90-10 规则提供了硬数据，我在第 16 项 中提到了该规则。\n\
  \n### 项目\n\n除了直接引用外，书中的所有文字都是我自己的。然而，我讨论的许多想法都来自他人。我已经尽力记录了谁贡献了什么，但我知道我包含了一些现在无法想起的来源信息，其中最重要的是许多来自\
  \ Usenet 新闻组 `comp.lang.c++` 和 `comp.std.c++` 的帖子。\n\nC++ 社区中的许多想法是由许多人独立开发的。在接下来的内容中，我仅指出我在哪些地方*接触*到了这些想法，而不是这些想法的来源。Brian\
  \ Kernighan 建议在第 2 项 中使用宏来近似 C++ 语法。\n\n在第 3 项 中，我发现，书中包含了一系列编写良好 C++ 程序的重要技术。它解释了如何设计和实现这些想法，以及在某些显而易见的替代设计中隐藏着哪些潜在陷阱。它还对\
  \ C++ 最近添加的特性进行了清晰的解释。任何想使用这些新功能的人都会想手边放一本这本书以备随时参考。\n\n在第 5 项 中，关于通过基类指针删除派生类对象的警告是基于材料。\n\
  \n在第 6 项 中，James Kanze 在 `comp.lang.c++` 上发布了关于通过前缀函数实现后置运算符的帖子。\n\n在第 8 项 中，我注意到了\
  \ `operator new` 和 `new` 运算符之间的区别。\n\n在第 9 项 中，使用析构函数防止资源泄漏的观点源于 Bjarne Stroustrup\
  \ 的《C++ 设计与演进》第 15 own。\n\n在第 11 项 中，我关于计数对象的模板类设计是基于 Jamshid Afshar 的帖子。\n\n在第\
  \ 18 项 中，我关于 `DynArray` 类的过度内存分配描述是基于 Cargill 在 1992 年 6 月《C++ 报告》中的文章。\n\n在第 21\
  \ 项 中，我的灵感来自 Brian Kernighan 在 1991 年 USENIX C++ 会议上的论文《AWK 到 C++》。\n\n在第 26 项 中，我对计数对象的模板类设计是基于\
  \ Jamshid Afshar 的帖子。\n\n在第 27 项 中，跟踪 `operator new` 指针的混入类想法是基于 Don Box 的建议。\n\n\
  在第 28 项 中，对智能指针的讨论部分基于 Steven Buroff 和 Rob Murray 在 1993 年 10 月份《C++ 报告》中的《C++ 神谕》专栏。\n\
  \n\n\n\n\n在 Item 29 中，使用基类存储引用计数并使用智能指针操作这些计数，是基于 Rob Murray 在其 *C++ Strategies\
  \ and Tactics* 第 6.3.2 节和 7.4.2 节中对相同主题的讨论（参见 page 286B）。为现有类添加引用计数的设计遵循了 Cay Horstmann\
  \ 在 1993 年 3 月至 4 月的《C++ Report》专栏中提出的方案。\n\n在 Item 30 中，我对左值上下文（lvalue contexts）的讨论基于\
  \ Dan Saks 在 1993 年 1 月份《C User's Journal》（现为 *C/C++ Users Journal*）专栏中的评论。关于“通过代理调用时，非代理成员函数不可用”的观察源于\
  \ Cay Horstmann 一篇未发表的论文。\n\n使用运行时类型信息构建类似 vtbl 的函数指针数组（在 Item 31 中）是基于 Bjarne Stroustrup\
  \ 在 `comp.lang.c++` 帖子以及其著作 *The Design and Evolution of C++* 第 13.8.1 节中提出的观点（参见\
  \ page 285B）。\n\nItem 33 中的材料基于我在 1994 年和 1995 年写的几篇《C++ Report》专栏。那些专栏反过来包含了来自\
  \ Klaus Kreft 的评论，关于如何使用 `dynamic_cast` 实现一个能检测错误类型参数的虚 `operator=`。\n\nItem 34\
  \ 中的大部分材料源于 Steve Clamage 在 1992 年 5 月份《C++ Report》上发表的文章《将 C++ 与其他语言链接》。在同一个 Item\
  \ 中，我对 `strdup` 等函数引起的问题的处理是受于一位匿名评审员的启发。\n\n### **本书**\n\n审阅书籍草稿是一项艰巨且至关重要的工作。我很感谢有这么多愿意为我投入时间和精力。我特别感谢\
