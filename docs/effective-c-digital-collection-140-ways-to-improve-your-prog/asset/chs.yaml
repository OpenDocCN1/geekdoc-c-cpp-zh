  \ `deque<bool>` 和 `bitset` 是替代数据结构，它们几乎肯定能满足你对 `vector<bool>` 所承诺的功能的需求。\n\n# 第\
  \ 3 章 关联容器\n\n就像《绿野仙踪》中的彩虹马一样，关联容器是不同颜色的生物。诚然，它们与顺序容器共享许多特征，但在许多基本方面与它们不同。例如，它们会自动保持排序；它们通过等价性（equivalence）而不是相等性（equality）的视角来看待其内容；`set`\
  \ 和 `map` 拒绝重复项；`map` 和 `multimap` 通常忽略它们所包含的每个对象的一半内容。是的，关联容器确实是容器，但如果你原谅我将 `vector`\
  \ 和 `string` 比作堪萨斯州，那么我们绝对不在堪萨斯州了。\n\n在接下来的章节中，我解释了等价性这一等关键概念，描述了对比较函数的一个重要限制，说明了为指针关联容器编写自定义比较函数的必要性，讨论了关键\
  \ `const` 特性的官方和实用两方面，并提供了关于提高关联容器效率的建议。\n\n在章节结束处，我检查了 STL 缺乏基于哈表的容器，并调查了两种常见的（非标准）实现。尽管\
  \ STL 本身没有提供哈希表，但你不需要自己编写或无计可用。高质量的实现随处可见。\n\n## Item 19：理解相等性和等价性之间的区别\n\nSTL 中充斥着对对象进行比较，以检查它们是否具有相同的值。例如，当你要求\
  \ `find` 在范围内查找具有特定值的第一个对象时，`find` 必须能够比较两个对象，以查看一个值是否与另一个值相同。同样，当你尝试向 `set` `insert`\
  \ 一个新元素时，`set::insert` 必须能够判断该元素的值是否已经在 `set` 中。\n\n`find` 算法和 `set` 的 `insert`\
  \ 成员函数是许多必须判断两个值是否相同的函数的代表。然而，它们以不同的方式执行此操作。`find` 对“相同”的定义是*相等性*（equality*），它基于\
  \ `operator==`。`set::insert` 对“相同”的定义是*等价性*（equivalence*），它通常基于 `operator<`。因为这些是不同的定义，可能出现这种情况：一个定义规定两个对象具有相同的值，而另一个定义却规定它们没有。因此，如果你想有效利用\
  \ STL，就必须理解相等性和等价性之间的区别。\n\n操作上，相等性的概念基于 `operator==`。如果表达式 `x == y` 返回真，则 `x` 和\
  \ `y` 具有相等的值，否则没有。这相当直接，但很有用记住，仅仅因为 `x` 和 `y` 具有相等的值并不意味着它们的所有数据成员具有相等的值。例如，我们可能有一个\
  \ `Widget` 类，它在内部具有相等的数据成员：\n\n```cpp\nclass Widget {\npublic:\n    int id;\n  \
  \  bool operator==(const Widget& rhs) const {\n        return id == rhs.id;\n  \
  \  }\nprivate:\n    int other_data;\n};\n```\n\n等价性是基于排序规则的。对于关联容器，等价性意味着两个对象在排序中是等价的。在一般情况下，关联容器的比较函数不是\
  \ `operator<` 甚至 `less`，它是一个用户定义的谓词。（参见 Item 39 获取更多关于谓词的信息）。每个标准关联容器通过其 `key_comp`\
  \ 成员函数公开排序谓词，因此对象 `x` 和 `y` 在关联容器 `c` 的排序规则下具有等价的值，如果以下表达式为真：\n\n```cpp\n!c.key_comp()\
  \ (x, y) && !c.key_comp() (y, x)\n```\n\n\n\n\n```cpp\nreturn ciStringCompare(lhs,\
  \ rhs); // 如何实现请参见 Item 35\n\n} // ciStringCompare 是\n\n// 实现的\n\n};\n```\n\n有了\
  \ `CIStringCompare`，可以很容易创建一个不区分大小写的 `set<string>`：\n\n点击此处查看代码图片\n\n```cpp\nset<string,\
  \ CIStringCompare> ciss; // ciss = \"不区分大小写的\n\n// 字符串集合\"\n```\n\n如果我们向集合中插入 `\"\
  Persephone\"` 和 `\"persephone\"`，只有第一个字符串会被添加，因为第二个字符串与第一个等价的：\n\n点击此处查看代码图片\n\n\
  ```cpp\nciss.insert(\"Persephone\"); // 设置中添加了一个新元素\n\nciss.insert(\"persephone\"\
  ); // 集合没有添加新元素\n```\n\n如果现在我们使用 `set` 的成员函数 `find` 来搜索字符串 `\"persephone\"`，搜索将成功：\n\
  \n```cpp\nif (ciss.find(\"persephone\") != ciss.end()) ... // 这个测试将通过\n```\n\n但如果我们使用非成员的\
  \ `find` 算法，搜索将失败：\n\n点击此处查看代码图片\n\n```cpp\nif (find(ciss.begin(), ciss.end(),\n\
  \n\"persephone\") != ciss.end()) ... // 这个测试将失败\n```\n\n这是因为 `\"persephone\"` 与\
  \ `\"Persephone\"` 是*等价的*（equivalent）（对于比较函数 `CIStringCompare` 而言），但它与其并不*相等*（equal）（因为\
  \ `string(\"persephone\") != string(\"Persephone\")`）。这个例子说明了为什么你应该遵循 Item 44 中的建议，优先使用成员函数（如\
  \ `set::find`）而不是它们的非成员对应项（如 `find`）。\n\n你可能会奇怪为什么标准关联容器是基于等价性（equivalence）而不是相等性（equality）。毕竟，大多数程序员对相等性有一种直觉，但对等价性却缺乏直觉。（如果不是这样，就没有必要写这个\
  \ Item 了。）答案乍看起来很简单，但观察得越仔细，它就变得越微妙。\n\n标准关联容器按排序顺序保持状态，因此每个容器都必须有一个比较函数（默认是 `less`）来定义如何保持排序状态。等价性是根据这个比较函数定义的，因此标准关联容器的客户端对于他们使用的任何容器只需要指定一个比较函数（决定排序顺序的那个）。如果关联容器使用相等性来判断两个对象何时具有相同的值，那么每个关联容器除了用于排序的比较函数外，还需要第二个比较函数来判断两个值何时相等。（默认情况下，这个比较函数推测将是\
  \ `equal_to`，但有趣的是，`equal_to` 从未用作 STL 的默认比较函数。当 STL 中需要相等性时，惯例是直接调用 `operator==`。例如，这就是非成员算法\
  \ `find` 的所做的。）\n\n假设我们有一个类似于 `set` 的 STL 容器，名为 `set2CF`，即“带有两个比较函数的集合”。第一个比较函数用于确定集合的排序顺序，第二个用于确定两个对象是否具有相同的值。现在考虑这个\
  \ `set2CF`：\n\n```cpp\nset2CF<string, CIStringCompare, equal_to<string> > s;\n```\n\
  \n在这里，`s` 在内部对字符串进行不区分大小写的排序，相等标准是直观的：如果两个字符串相互相等，它们就具有相同的值。我们将哈德斯不情的新娘（Persephone）的两种拼写插入\
  \ s 中：\n\n```cpp\ns.insert(\"Persephone\");\n\ns.insert(\"persephone\");\n```\n\n\
  这应该发生什么？如果我们观察到 `\"Persephone\" != \"persephone\"` 并将它们都插入 `s`，它们应该以什么顺序排列？记住，排序函数无法区分它们。我们是按某种任意顺序插入它们，从而放弃了以确定顺序遍历集合内容的能力吗？（这种无法以确定顺序遍历关联容器元素的能力已经困扰了\
  \ `multiset` `s` 和 `multimap` `s`，因为标准对等价值的相对顺序（对于 `multiset` `s`）或键的相对顺序（对于 `multimap`\
  \ `s`）没有限制。）或者我们坚持 `s` 内容的确定顺序，并忽略第二次尝试插入（针对“persephone”的插入）？如果我们这样做，这里会发生什么？\n\n\
  ```cpp\nif (s.find(\"persephone\") != s.end()) ... // 这个测试成功还是失败？\n```\n\n推测 `find`\
  \ 使用了相等性检查，但如果我们为了保持 `s` 中元素的确定顺序而忽略了第二次 `insert` 调用，那么这个 `find` 将失败，尽管对 `\"persephone\"\
  ` 的插入是基于其值重复而被忽略的！\n\n简而言之，通过只使用单个比较函数并采用等价性作为判断两个值是否“相同”的裁决标准，标准关联容器回避了如果允许使用两个比较函数可能会产生的一系列困难。它们的行为初看起来可能有点奇怪（尤其是当发现成员和非成员\
  \ `find` 返回结果不同时），但从长远来看，这避免了困惑。有趣的是，一旦你离开关联容器的领域，情况就会发生，相等性与等价性的问题可以被反复讨论。这里有两种基于哈希表的非（但常见的）关联容器。一种设计基于相等性，另一种设计基于等价性。\n\
  \n### Item 20：为指针容器指定比较类型\n\n假设你有一个 `string*` 的 `set`，并向集合插入了一些动物名称：\n\n点击此处查看代码图片\n\
  \n```cpp\nset<string*> ssp; // ssp = \"字符串指针集合\"\n\nssp.insert(new string(\"Anteater\"\
  ));\n\nssp.insert(new string(\"Wombat\"));\n\nssp.insert(new string(\"Lemur\"));\n\
  \nssp.insert(new string(\"Penguin\"));\n```\n\n你编写了以下代码来打印集合的内容，期望字符串按字母顺序输出。毕竟，`set`\
  \ 会保持内容排序。\n\n点击此处查看代码图片\n\n```cpp\nfor (set<string*>::const_iterator i = ssp.begin();\
  \ // 你期望看到\ni != ssp.end(); // 这里：\"Anteater\",\n\n++i) // \"Lemur\", \"Penguin\"\
  ,\n\ncout << *i << endl; // \"Wombat\"\n```\n\n注释描述了你期望看到的，但你完全没有看到。相反，你看到了四个十六进制数字。它们是指针值。因为集合持有的是指针，`*i`\
  \ 不是 `string`，而是 `string` 的*指针*。让这成为教训，提醒你遵循 Item 43 的指导，避免编写自己的循环。如果你改用调用 `copy`\
  \ 算法，\n\n点击此处查看代码图片\n\n```cpp\ncopy(ssp.begin(), ssp.end(), // 将 ssp 中的字符串\nostream_iterator<string>(cout,\
  \ \"\\n\")); // 输出到 cout（但这里\n// 不会编译）\n```\n\n你不仅写了更少的字符，还能更早地发现错误，因为这个 `copy`\
  \ 的调用无法编译。`ostream_iterator` 强制要求知道打印对象的类型，所以当你告诉它它是 `string`（通过将其作为模板参数传递时），你的编译器会检测到它与\
  \ `ssp` 中存储的对象类型（`string*`）之间的不匹配，并拒绝编译代码。类型安全又得了一分。\n\n\n\n\n如果你不耐烦地将显式循环中的 `*i`\
  \ 改为 `**i`，你可能会得到想要的输出，但很可能并不会。是的，动物名称会被打印出来，但它们按字母顺序出现的概率只有 1 分 24。`ssp` 保持其内容按排序排列，但它持有的是指针，所以它是按*指针值*排序的，而不是按字符串值排序。四个指针值有\
  \ 24 种可能的排列方式，因此指针存储时有 24 种可能的顺序。所以，你看到字母顺序字符串的概率是 1 分 24。\n\n从实践上来说，这 24 种排列并不是等可能的，因此“1\
  \ 分 24”的说法有点误导性。尽管如此，它仍然有 24 种不同的顺序，你可以得到其中任何一种。\n\n为了解决这个问题，回想起这一点：\n\n```cpp\n\
  set<string*> ssp;\n```\n\n是以下内容的简写：\n\n```cpp\nset<string*, less<string*> > ssp;\n\
  ```\n\n嗯，完全准确地说，它是以下内容的简写：\n\n```cpp\nset<string*, less<string*>, allocator<string*>\
  \ > ssp;\n```\n\n但在本节（Item）中分配器与我们无关，所以我们将忽略它们。\n\n如果你希望 `string*` 指针根据字符串值的确定顺序存储在集合中，你不能使用默认的比较函数类\
  \ `less<string*>`。你必须编写自己的比较函数类，该类的对象接受 `string*` 指针并根据它们所指向的 `string` 的值进行排序。如下所示：\n\
  \n```cpp\nstruct StringPtrLess:\n    public binary_function<const string*, // 参见\
  \ Item 40 查看\n    const string*, // 使用此基类的原因\n    bool> { // 类\n    bool operator()(const\
  \ string *ps1, const string *ps2) const\n    {\n        return *ps1 < *ps2;\n  \
  \  }\n};\n```\n\n然后你就可以将 `StringPtrLess` 作为 `ssp` 的比较类型了：\n\n```cpp\ntypedef set<string*,\
  \ StringPtrLess> StringPtrSet;\nStringPtrSet ssp; // 创建一个字符串集合并按\n// StringPtrLess\
  \ 定义的方式进行排序\n... // 插入与之前相同的四个字符串\n```\n\n现在，你的循环终于会执行你想要让它执行的操作（前提是你已经修复了之前那个使用\
  \ `*i` 而不是 `**i` 的问题）：\n\n```cpp\nfor (StringPtrSet ::const_iterator i = ssp.begin();\
  \ // 打印 \"Anteater\",\n    i != ssp.end(); // \"Lemur\",\n    ++i) // \"Penguin\"\
  ,\n    cout << **i << endl; // \"Wombat\"\n```\n\n如果你想用算法代替循环，可以写一个在打印它们之前知道如何解引用\
  \ `string*` 指针的函数，然后结合 `for_each` 使用该函数：\n\n```cpp\nvoid print(const string *ps)\
  \ // 向 cout 打印\n// ps 指向的对象\n{\n    cout << *ps << endl; // 通过 ps\n}\n\nfor_each(ssp.begin(),\
  \ ssp.end(), print); // 对 ssp 中的每个\n// 元素调用 print\n```\n\n或者你可以写得花哨一点，写一个通用的解引用函数类，然后配合\
  \ `transform` 和 `ostream_iterator` 使用：\n\n```cpp\n// 当这种类型的函数对象被传递 T* 时，它们返回 const\
  \ T&\nstruct Dereference {\n    template <typename T>\n    const T& operator()(const\
  \ T *ptr) const\n    {\n        return *ptr;\n    }\n};\n\ntransform(ssp.begin(),\
  \ ssp.end(), // “转换” ssp 中的\n    ostream_iterator<string>(cout, \"\\n\"), // 元素\n\
  \    Dereference()); // 解引用它，\n// 将结果写入\n// cout\n```\n\n然而，用算法替换循环并不是重点，至少对于本节（Item）来说不是。（这对于\
  \ Item 43 来说是重点）。重点在于，每当你创建一个指针的标准关联容器时，你必须记住容器将按指针的值进行排序。只有极少数情况下这是你想要的，所以你几乎总是想要创建自己的函数类来作为比较类型。\n\
  \n注意我写的是“比较*类型*”。你可能会奇怪，为什么你得费精力创建一个函数类，而不是简单地为集合写一个比较函数。例如，你可能会尝试这样做：\n\n```cpp\n\
  bool stringPtrLess(const string* ps1, // 假设的比较\nconst string* ps2) // 函数\n{\n  \
  \  return *ps1 < *ps2;\n}\nset<string*, StringPtrLess> ssp; // 无法编译\n```\n\n问题是\
  \ `set` 期望一个类型，而 `stringPtrLess` 是一个函数。遗憾的是，`set` 不要函数，它需要一个类型。`StringPtrLess` 是一个类型。\n\
  \n```cpp\nstruct StringPtrLess:\n    public binary_function<const string*,\n   \
  \ const string*,\n    bool> {\n    bool operator()(const string *ps1, const string\
  \ *ps2) const // 参数传递\n    , to)\n    {\n        return *ps1 < *ps2;\n    }\n};\n\
  set<string*, StringPtrLess> ssp; // 行为\n\n```\n\n等等，我在上面的例子中写错了。让我们看看正确的写法：\n\n\
  ```cpp\nstruct StringPtrLess:\n    public binary_function<const string*,\n    const\
  \ string*,\n    bool> {\n    bool operator()(const string *ps1, const string *ps2)\
  \ const\n    {\n        return *ps1 < *ps2;\n    }\n};\nset<string*, StringPtrLess>\
  \ ssp; // 有效\n\n```\n\n实际上，让我们看看解引用方法：\n\n```cpp\nstruct Dereference {\n    template\
  \ <typename T>\n    const T& operator()(const T *ptr) const\n    {\n        return\
  \ *ptr;\n    }\n};\n\ntransform(ssp.begin(), ssp.end(), ostream_iterator<string>(cout,\
  \ \"\\n\"), Dereference());\n```\n\n### Item 21: 让比较函数对相等值始终返回 false\n\n让我给你展示一些酷的东西。创建一个以\
  \ `less_equal` 为比较类型的集合，然后向集合插入 10：\n\n```cpp\nset<int, less_equal<int> > s; //\
  \ s 按 \"<=\" 排序\ns.insert(10); // 值 10\n```\n\n现在尝试插入 10：\n\n```cpp\ns.insert(10);\n\
  ```\n\n对于这次 `insert` 调用，集合必须确定 10 是否已经存在。我们知道它是存在的，但集合笨得像头，所以它必须检查。为了更容易理解集合所的操作，我们将调用最初插入\
  \ 10[A] 的 10 以及我们正尝试插入 10[B] 的 10。\n\n集合遍历其内部数据结构寻找插入 10[B] 的位置。它最终必须检查 10[B] 以判断它与\
  \ 10[A] 是否相同。关联容器对“相同”的定义是等价（参见 Item 19），所以集合测试 10[B] 是否等价于 10[A]。在执行此测试时，它自然使用集合的比较函数。在这个例子中，就是\
  \ `operator<=`，因为我们指定了 `less_equal` 作为集合的比较函数。因此，集合检查此表达式是否为真：\n\n```cpp\n!(10[A]\
  \ < = 10[B] ) && !(10[B] <= 10[A] ) // 测试 10[A] 和 10[B] 是否等价\n```\n\n\n\n嗯，`10[A]`\
  \ 和 `10[B]` 都是 10，所以 `10[A] <= 10[B]` 显然是真的。同样显然，`10[B] <= 10[A]` 也是真的。上面的表达式因此简化为\n\
  \n```\n!(true) && !(true)\n```\n\n然后简化为\n\n```\nfalse && false\n```\n\n结果为 `false`。也就是说，集合得出结论\
  \ `10[A]` 和 `10[B]` *不是*等等的，因此*不是*同一个，于是它将 `10[B]` 插入到容器中与 `10[A]` 并列。从技术上讲，这种操作会导致未定义行为，但几乎是普遍的结果是，集合最终包含了*两个*\
  \ 值为 10 的副本，这意味着它不再是一个集合了。通过使用 `less_equal` 作为我们的比较类型，我们破坏了容器！此外，*任何*在相等值时返回 `true`\
  \ 的比较函数都会发生同样的事情。这不很酷吗？\n\n好吧，也许你对“酷”的定义和我我不一样。尽管如此，你仍然需要确保你用于关联容器的比较函数在相等值时始终返回\
  \ `false`。然而，你必须保持警惕。违反这一约束其实出奇地简单。\n\n例如，条目 20 描述了如何为 `string*` 指针容器编写一个比较函数，使得容器根据\
  \ `string` 句柄的值而不是指针的值对其内容进行排序。该比较函数按升序对它们排序，但假设你需要一个为 `string*` 指针容器编写的按降序排序的比较函数。自然的做法是获取现有的代码并对其进行修改。如果你不小心，你可能会写出这样的代码，我在\
  \ 条目 20 中高亮了代码中的更改：\n\n点击此处查看代码图像\n\n```cpp\nstruct StringPtrGreater : // 高亮部分显示了如何\n\
  \npublic binary_function<const string*, // 这部分代码被修改了\n\nconst string*, // 来自第 89\
  \ 页。*注意，*\n\nbool> { // *这段代码是有缺陷的！*\n\nbool operator()(const string *ps1, const\
  \ string *ps2) const\n\n{\n\nreturn !(*ps1 < *ps2); // 仅对旧测试取反；\n\n} // *这是错误的！*\n\
  \n};\n```\n\n这里的主思想是通过取反比较函数内部的测试来反转排序顺序。遗憾的是，取反“`<` ”并不能给你你想要的“`>` ”，它给你的是“`>=`”。你现在理解了，“`>=`\
  \ ”因为在相等值时会返回 `true`，是关联容器的无效比较函数。\n\n你真正想要的比较类型是这个：\n\n点击此处查看代码图像\n\n```cpp\nstruct\
  \ StringPtrGreater: // 这是一个有效的\n\npublic binary_function<const string*, // 关联容器的\n\
  \nconst string*, // 比较类型\n\nbool> {\n\nbool operator()(const string *ps1, const\
  \ string *ps2) const\n\n{\n\nreturn *ps2 < *ps1 ; // 返回 *ps2 是否\n\n} // 优于 *ps1（即交换\n\
  \n// 操作数的\n\n// 顺序）\n}; //\n```\n\n为了避免掉入这个陷阱，你只需要记住：比较函数的返回值表示一个值在由该函数定义的排序顺序中是否在另一个值之前。相等的值永远不会在彼此之前，因此比较函数在相等值时应始终返回\
  \ `false`。\n\n唉。\n\n我知道你在想。你在想：“当然，这对于 `set` 和 `map` 来说是有道理的，因为这些容器不能包含重复项。但 `multiset`\
  \ 和 `multimap` 呢？这些容器可能包含重复项，所以我何不在乎容器认为两个相等值的对象不等等呢？它会把它们都存储，这正是 `multi` 容器本应该做的。没问题，对吧？”\n\
  \n错了。为了看到原因，让我们回到原始示例，但这次我们使用 `multiset`：\n\n点击此处查看代码图像\n\n```cpp\nmultiset<int,\
  \ less_equal<int> > s; // s 仍然按 \"<=\" 排序\n\ns.insert(10); // 插入 10[A]\n\ns.insert(10);\
  \ // 插入 10[B]\n```\n\n`s` 现在内部有两个 10 的副本，所以我们预预期如果对其执行 `equal_range`，我们将得到一对定义包含这两个副本的范围的迭代器。但这是可能的。`equal_range`\
  \ 尽管名字是如此，它识别的并不是相等值的范围，而是*等价*（equivalent）值的范围。在这个示例中，`s` 的比较函数说 `10[A]` 和 `10[B]`\
  \ 不等价，所以这两个都不可能位于 `equal_range` 确定的范围之内。\n\n你看到了吗？除非你的比较函数在相等值时始终返回 `false`，否则你就破坏了所有的标准关联容器，无论它们是否允许包含重复项。\n\
  \n\n\n\n```cpp\nint idNumber() const; // get employee ID number\n\n...\n\n};\n```\n\
  \n如你所见，我们可以获取关于员工的各种信息。然而，让我们做一个合理的假设：每个员工都有一个唯一的 ID 编号，该编号由 `idNumber` 函数返回。那么，为了创建一个员工的\
  \ `set`，显然仅按 ID 编号对集合进行排序是有意义的，如下：\n\n点击此处查看代码图像\n\n```cpp\nstruct IDNumberLess:\n\
  \npublic: binary_function<Employee, Employee, bool> { // 参见 Item 40\n\n    bool\
  \ operator()(const Employee& lhs,\n                    const Employee& rhs) const\n\
  \    {\n        return lhs.idNumber() < rhs.idNumber();\n    }\n};\n\ntypedef set<Employee,\
  \ IDNumberLess> EmpIDSet;\n\nEmpIDSet se; // se 是一个员工集合\n\n// 按 ID 编号排序\n```\n\n\
  从实践上来说，员工 ID 编号是该 `set` 中元素的 `key`。员工的其余数据只是随带其后的。既然如此，我们没有理由不能将特定员工的标题更改为某些有趣的内容。如下：\n\
  \n点击此处查看代码图像\n\n```cpp\nEmployee selectedID; // 用于持有员工的变量\n// 选定的 ID 编号\n\n...\n\
  \nEmpIDSet::iterator i = se.find(selectedID);\n\nif (i != se.end()){\n    i->setTitle(\"\
  Corporate Deity\"); // 给员工赋予新标题；\n} // *这不应该通过编译* --\n// 为什么请看下一页\n```\n\n由于我们在这里所做的只是改变员工的一个与集合排序方式无关的（员工的\
  \ `non-key` 部分），这段代码不会损坏集合。这就是为什么它是合理的。但这种合理的代码排除了让 `set` / `multiset` 的元素成为 `const`\
  \ 的可能。这就是它们不是 `const` 的原因。\n\n你可能会想，为什么同样的逻辑不适用于 `map` 和 `multimap` 中的键呢？创建一个从员工到（例如）他们居住国家的\
  \ map 难道没有意义吗？在这个 map 中，比较函数使用 `IDNumberLess`，就像上一个例子一样？鉴于这样一个 map，在不影响员工 ID 编号的情况下更改员工的标题，难道不是合理的吗？就像上一个例子一样？\n\
  \n坦率地说，我认为是有意义的。同样坦率地说，我怎么想并不重要。重要的是标准化委员会是怎么想的，而他们认为 `map` / `multimap` 的键应该是 `const`\
  \ 的，而 `set` / `multiset` 的值不应该是是。\n\n由于 `set` 或 `multiset` 中的值不是 `const`，尝试修改它们的行为可能会通过编译。本节（Item）的目的是提醒你：如果你确实更改了\
  \ `set` 或 `multiset` 中的元素，你必须确保不要更改 `key part` —— 即影响容器排序的元素部分。如果你这样做了，你可能会损坏容器，使用该容器将产生未定义的结果，并且那是你的错。另一方面，这种约束仅适用于被包含对象的键部分。对于被包含元素的所有其他部分，你可以随意修改；随你怎么改吧！\n\
  \n除了破碎的玻璃除外。记得我之前提到的破碎玻璃吗？我们现在正处于那里。拿些绷带，跟我来。\n\n即使 `set` 和 `multiset` 元素不是 `const`，实现层也有方法防止它们被修改。例如，某种实现可以令\
  \ `set<T>::iterator` 的 `operator*` 返回一个 `const T&`。也就是说，它可以让解引用 `set` 迭代器的结果成为集合中\
  \ `const` 元素的引用。在这样的实现下，无法修改 `set` 或 `multiset` 元素，因为访问元素的所有方式在让你接触它们之前都会添加一个 `const`。\n\
  \n这样的实现是合法的吗？可以辩说是合法的，也可以辩说是不法的。标准在这方面是不一致的，而且根据墨菲定律，不同的实现者以不同的方式解释了它。结果是，你会在某些\
  \ STL 实现中发现这段代码可以编译，而在另一些实现中则无法编译：\n\n点击此处查看代码图像\n\n```cpp\nEmpIDSet se; // 如前，se\
  \ 是一个员工集合\n// 按 ID 编号排序\n\nEmployee selectedID; // 如前，selectedID 是一个占符\n// 具有选定\
  \ ID \n// 员工\n\n...\n\nEmpIDSet::iterator i = se.find(selectedID);\n\nif (i != se.end()){\n\
  \    i->setTitle(\"Corporate Deity\"); // 一些 STL 实现\n} // 接受这一行，其他则拒绝\n```\n\n由于标准的模棱两可以及由此产生的不同解释，尝试修改\
  \ `set` 或 `multiset` 中元素的代码是不可移植的。^(†)\n\n^(†) 标准化委员会此后澄清，`set` 或 `multiset` 中的元素不应该是可修改的。那么我们处于什么境地？令人鼓励的是，事情并不复杂：如果不考虑移植性，我们必须抛弃\
  \ `*i` 的 `const` 属性。\n\n\n\n\n\n现在将类型转换为引用的重要性应该显而易见了。通过转换为引用，我们避免了创建新对象。相反，转换的结果是指向一个*已存在*对象的引用，即\
  \ `i` 所指向的那个对象。当我们对引用所指示的对象调用 `setTitle` 时，我们实际上是在对 `*i` 调用 `setTitle`，这正是我们想要的。\n\
  \n我刚才所写的这些内容对于 `set` 和 `multiset` 来说没有问题，但当我们转向 `map` 和 `multimap` 时，情况就变得复杂了。记住，`map<K,\
  \ V>` 或 `multimap<K, V>` 包含类型为 `pair<const K, V>` 的元素。那个 `const` 意味着对项的第一个分量被*定义*为\
  \ `const`，而*这*意味着尝试修改它（即使在去除了它的 `const` 属性之后）也是未定义行为。如果你是一个严格遵守标准规定规则的守法者，那么你*永远*不会尝试修改作为\
  \ `map` 或 `multimap` 键的对象。\n\n你一定听过转换是危险的，我希望这本书能清楚地说明：我希望你尽可能地避免它们。执行转换意味着暂时抛弃了类型系统的安全性，而我们讨论过的陷阱恰恰说明了当你丢掉安全网时会发生什么。\n\
  \n大多数转换都是可以避免的，包括我们刚刚考虑的那些。如果你想以一种始终有效且始终安全的方式更改 `set`、`multiset`、`map` 或 `multimap`\
  \ 中的元素，请按照以下五个简单步骤操作：\n\n1.  找到你想要更改的容器元素。如果你不确定执行该操作的最佳方法，Item 45 提供了关于如何执行适当搜索的指导。\n\
  2.  为-copy 为要修改的元素创建一个副本。对于 `map` 或 `multimap`，务必确保不要将副本的第一个分量声明为 `const`。毕竟，你想改变它！\n\
  3.  修改副本，使其具有你希望在容器中拥有的值。\n4.  从容器中移除该元素，通常通过调用 `erase` 实现（参见 Item 9）。\n5.  将新值插入容器中。如果新元素在容器排序顺序中的位置可能与移除的元素相同或相邻，请使用\
  \ `insert` 的“提示”（hint）形式将插入效率从对数时间提高到摊销常数时间。使用你从步骤 1 获得的迭代器作为提示。\n\n这里是同样的老旧员工示例，这次是用一种安全、可移植的方式编写的：\n\
  \n点击此处查看代码图像\n\n```\nEmpIDSet se; // 与之前一样，se 是员工集合\n\n// 按 ID 排序\n\nEmployee selectedID;\
  \ // 与之前一样，selectedID 是占位符\n\n// 具有所需 ID 号的员工\n\n...\n\nEmpIDSet::iterator i =\n\
  \nse.find(selectedID); // 步骤 1：找到要更改的元素\n\nif (i != se.end()) {\n\nEmployee e(*i);\
  \ // 步骤 2：复制元素\n\ne.setTitle(\"Corporate Deity\"); // 步骤 3：修改副本\n\nse.erase(i++);\
  \ // 步骤 4：移除元素；\n\n// 增加迭代器以维持\n\n// 其有效性（参见 Item 9 ）\n\nse.insert(i, e); // 步骤\
  \ 5：插入新值；提示其\n\n// 位置与原始\n// 元素相同\n```\n\n你可能会原谅我这样表达，但要记住*关键*点是：对于 `set` 和 `multiset`，如果你对容器元素执行任何就地修改，你就负责确保容器保持排序状态。\n\
  \n### Item 23: 考虑用排序的 `vector` s 替换关联容器\n\n许多 STL 程序员在面对需要提供快速查找的数据结构时，会立即想到标准的关联容器：`set`、`multiset`、`map`\
  \ 和 `multimap`。这在某种程度上是可以接受的，但还不够彻底。如果查找速度真的很重要，那么考虑非标准的哈希容器（hashed containers）也几乎是值得的（参见\
  \ Item 25）。通过合适的哈希函数，可以期望哈希容器提供常数时间查找。（如果哈希函数选择不当或表大小太小，哈希表查找的性能可能会下降，但在实践中这并不常见。）对于许多应用程序来说，哈希容器预期的常数时间查找比\
  \ `set`、`map` 及其 `multi` 伴侣们标志性的对数时间查找更具优势。\n\n即使你想要的是对数时间查找，标准关联容器可能不是你的最佳选择。反直觉的是，标准关联容器的性能逊于平庸的\
  \ `vector` 的情况并不罕见。如果你想有效利用 STL，你需要理解在何时以及如何 `vector` 能够提供比关联容器更快的查找。\n\n标准关联容器通常实现为平衡二叉树。平衡二叉树是一种针对插入、删除和查找的混合组合进行了优化的数据结构。也就是说，它是为了这类应用而设计的：先进行一些插入，然后是一些查找，然后可能是更多插入，然后是一些删除，然后是更多查找等等。这一系列事件的关键特征是插入、删除和查找都是混合在一起的。通常情况下，无法预测树上的下一次操作将是什么。\n\
  \n许多应用程序使用数据结构的方式并不那么混乱。它们对数据结构的使用可分为三个阶段，可以总结如下：\n\n1.  **设置。** 通过向其中插入大量元素创建一个新的数据结构。在这个阶段，几乎所有操作都是插入和删除。查找很少或不存在。\n\
  2.  **查找。** 咨询数据结构以寻找特定的信息。在这个阶段，几乎所有操作都是查找。插入和删除很少或不存在。查找如此频繁，该阶段的性能决定了其他阶段的性能。\n\
  3.  **重组。** 修改数据结构的内容，可能通过删除所有数据并插入新数据。从行为上，这个阶段等同于阶段 1。一旦该阶段完成，应用程序返回阶段 2。\n\n\
  对于以此方式使用数据结构的应用程序，`vector` 可能比关联容器提供更好的性能（无论时间和空间）。但不是任何 `vector` 都行。它必须是排序的 `vector`，因为只有排序容器才能与\
  \ `binary_search`、`lower_bound`、`equal_range` 等查找算法正常工作（参见 Item 34 ）但为什么对（排序的）vector\
  \ 进行二分查找的性能会比二叉搜索树更好？因为有些事是陈旧而真实的，其中一点是大小很重要。另一些虽然没那么陈旧但同样真实，其中之一是引用局部（locality\
  \ of reference）也很。\n\n首先考虑大小问题。假设我们需要一个容器来存放 `Widget` 对象，因为查找速度对我们很重要，我们正在考虑 `Widget`\
  \ 的关联容器和排序的 `vector<Widget>`。如果我们选择关联容器，我们几乎肯定会使用平衡二叉树。这种树由树节点组成，每个节点不仅包含一个 `Widget`，还指向左子节点的指针、指向右子节点的指针以及（通常还有）指向父节点的指针。这意味着在关联容器中存储一个\
  \ `Widget` 的空间开销至少是三个指针。\n\n\n\n\n相比之下，当我们在 `vector` 中存储 `Widget` 时，并没有开销；我们只是简单地存储\
  \ `Widget`。当然，`vector` 本身有开销，并且 `vector` 的末尾可能有空的（预留的）空间（参见 Item 14），但每个 `vector`\
  \ 的开销通常是忽略不道的（通常是三个机器字，例如三个指针或两个指针和一个 `int`），如果必要，可以通过“`swap` 技巧”修掉末尾的空空间（参见 Item\
  \ 17）。即使额外的空间没有被消除，对于下文的分析也不重要，因为在进行查找时不会引用这部分内存。\n\n假设我们的数据结构足够大，它们将分布在多个内存页上，但\
  \ `vector` 需要的页面会比关联容器少。这是因为 `vector` 不需要每个 `Widget` 的额外开销，而关联容器则为每个 `Widget` 都要消耗三个指针。为了理解为什么这很重要，假设你正在开发一个系统，其中\
  \ `Widget` 的大小为 12 字节，指针为 4 字节，一个内存页持有 4096 (4K) 字节。忽略每个容器的开销，当 `Widget` 存储在 `vector`\
  \ 中时，一个页可以容纳 341 个 `Widget`，但存储在关联容器中最多只能容纳 170 个。因此，关联容器使用的内存大约是 `vector` 的两倍。如果你在一个可用虚拟内存的环境工作，很容易看出这会导致很多的页错误（page\
  \ faults），从而使系统在处理大量数据时明显变慢。\n\n我在这里对关联容器的看法其实是乐观的，因为我假设二叉树中的节点聚集在一组相对较小的内存页上。大多数\
  \ STL 实现使用自定义的内存管理器（在容器的分配器之上实现——参见 Items 10 和 11）来实现这种聚集性，但如果你的 STL 实现未能采取措施来提高树节点之间的引用局部性，节点可能会分散在你的地址空间各处。这将导致更多的页错误。即使使用了惯用的聚集内存管理器，关联容器往往仍会有更多的页错误问题，因为与\
  \ `vector` 这种连续内存容器不同，基于节点的容器更难保证在容器遍历顺序中相邻的元素在物理内存中也是相邻的。然而，这恰恰是执行二分查找时能最程度地减少页错误的内存组织方式。\n\
  \n**结论：** 将数据存储在排序的 `vector` 中，可能比在标准关联容器中存储相同数据消耗更内存，而且在考虑页错误的情况下，通过二分查找搜索排序的 `vector`\
  \ 可能比搜索标准关联容器更快。\n\n当然，排序 `vector` 的巨大缺点是它必须保持排序！当插入一个新元素时，新元素之后的所有元素都必须向前移动一个。这听起来就很昂贵，如果\
  \ `vector` 必须重新分配其底层内存（参见 Item 14），代价会更加高昂，因为那时 `vector` 中的*所有*元素通常都要被拷贝。同样，如果从\
  \ `vector` 中删除一个元素，它之后的所有元素都必须向下移动。对于 `vector` 来说，插入和删除是昂贵的，但对于关联容器来说是廉价的。这就是为什么只有当你知道数据结构的使用方式使得查找几乎不会与插入和删除混合在一起时，考虑使用排序的\
  \ `vector` 代替关联容器才有意义的。\n\n本节（Item）包含了大量的文字，但极度缺乏示例，所以让我们来看一个使用排序 `vector` 代替 `set`\
  \ 的代码骨架：\n\n点击此处查看代码图像\n\n```cpp\nvector<Widget> vw; // set<Widget> 的替代方案\n\n...\
  \ // 设置阶段：大量的插入，\n\n// 少数查找\n\nsort(vw.begin(), vw.end()); // 设置阶段结束。（当\n\n// 模拟\
  \ multiset 时，你可能\n\n// 倾向于使用 stable_sort，请参见\n\n// Item 31 .）在模拟 set 时，\n\n// 请确保\
  \ vw 不包含重复元素！\n\nWidget w; // 用于查找的值对象\n\n... // 开始查找阶段\n\nif (binary_search(vw.begin(),\
  \ vw.end(), w)) ... // 通过 binary_search 查找\n\nvector<Widget>::iterator i =\n\nlower_bound(vw.begin(),\
  \ vw.end(), w); // 通过 lower_bound 查找；\n\nif (i != vw.end() && !(w < *i)) ... //\
  \ 参见 Item 19 关于\n\n// \"!(w < *i)\" 测试的解释\n\npair<vector<Widget>::iterator,\n\n\
  vector<Widget>::iterator> range =\n\nequal_range(vw.begin(), vw.end(), w); // 通过\
  \ equal_range 查找\n\nif (range.first != range.second) ... // 查找阶段结束\n```\n\n\n\n\
  在这个示例中，我们假设排序后的 `vector` 将模拟一个 `map<string, int>`。这段代码几乎是上述讨论的字面翻译，唯一的不同是成员函数 `keyLess`\
  \ 的存在。该函数存在是为了确保各种 `operator()` 函数之间的一致性。每个此类函数都简单地比较两个键值，因此，与其重复逻辑，我们将测试放在 `keyLess`\
  \ 内部，并让 `operator()` 函数返回 `keyLess` 执行的任何结果。这种令人赞叹的软件工程做法增强了 `DataCompare` 的可维护性，但存在一个微小的缺点。它为具有不同参数类型的\
  \ `operator()` 函数提供的支持，导致生成的函数对象变得不可适配（参见 Item 40 ）。算了吧吧。\n\n使用排序过的 `vector` 作为\
  \ map 本质上与将其用作 set 是一样的。唯一的重大区别在于，需要使用 `DataCompare` 对象作为比较函数：\n\n点击此处查看代码图像\n\n\
  ```cpp\nvector<Data> vd; // 替代方案\n\n// map<string, int>\n\n... // 设置阶段：大量的\n\n//\
  \ 插入，少量的查找\n\nsort(vd.begin(), vd.end(), DataCompare()); // 设置阶段结束。模拟-\n\n// 的 maps\
  \ 必须避免\n// 重复；模拟的 multimaps\n\n// 可能使用 stable_sort\n\nstring s; // 用于查找的值对象\n\n\
  ... // 查找阶段开始\n\nif (binary_search(vd.begin(), vd.end(), s, DataCompare())) ...\
  \ // 通过 binary_search 查找\n\nvector<Data>::iterator i =\nlower_bound(vd.begin(),\
  \ vd.end(), s, DataCompare()); // 通过 lower_bound 查找；\n\nif (i != vd.end() && !DataCompare()(s,\
  \ *i))... // 再次，参见 Item 19 \n// 关于\n// \"!DataCompare()(s, *i)\" 测试的信息\n\npair<vector<Data>::iterator,\
  \ vector<Data>::iterator> range =\nequal_range(vd.begin(), vd.end(), s, DataCompare());\
  \ // 通过 equal_range 查找\n\nif (range.first != range.second) ...\n\n... // 查找阶段结束，开始\n\
  \n// 重组阶段\n\nsort(vd.begin(), vd.end(), DataCompare()); // 开始新的查找阶段...\n```\n\n\
  如你所见，一旦你写好了 `DataCompare`，一切几乎都顺理成章了。一旦到位，它们的运行速度通常比使用真实 `map` 的相应设计更快且占用内存更少，*只要你的程序是按照第\
  \ 101 页上描述的分阶段方式使用该数据结构*。如果你的程序不是以分阶段操作该数据结构，那么使用排序过的 `vector` 而不是标准关联容器几乎将会浪费时间。\n\
  \n### Item 24: 当效率重要时，请在 `map::operator[]` 和 `map::insert` 之间仔细选择\n\n假设我们有一个 `Widget`\
  \ 类，它支持默认构造，以及从 `double` 构造和赋值：\n\n点击此处查看代码图像\n\n```cpp\nclass Widget {\npublic:\n\
  \    Widget();\n    Widget(double weight);\n    Widget& operator=(double weight);\n\
  \    ...\n};\n```\n\n现在假设我们想创建一个从 `int` 到 `Widget` 的 `map`，并且我们用特定的值初始化该 map。这非常简单：\n\
  \n```cpp\nmap<int, Widget> m;\nm[1] = 1.50;\nm[2] = 3.67;\nm[3] = 10.5;\nm[4] =\
  \ 45.8;\nm[5] = 0.0003;\n```\n\n事实上，唯一比这更简单的就是忘记正在发生什么。这太糟糕了，因为发生的情况可能会导致巨大的性能影响。\n\
  \n`map` 的 `operator[]` 函数是一个新奇的物种，与 `vector`、`deque` 和 `string` 的 `operator[]` 函数无关，与适用于数组的内置\
  \ `operator[]` 同样无关。相反，`map::operator[]` 的设计是为了方便“添加或更新”功能。也就是说，给定\n\n```cpp\nmap<K,\
  \ V> m;\n```\n\n表达式\n\n```cpp\nm[k] = v;\n```\n\n会检查键 `k` 是否已经在 map 中。如果不在，它会被添加，连同\
  \ `v` 一起作为对应的值。如果 `k` 已经在 map 中，其关联的值将更新为 `v`。它的工作原理是 `operator[]` 返回一个与 `k` 关联的值对象的引用。然后\
  \ `v` 被赋值给该引用（从 `operator[]` 返回的那个）所指向的对象。当更新现有键的关联值时，这种方法非常直观，因为已经有一个 `operator[]`\
  \ 可以返回引用的值对象。但如果 `k` 尚不在 map 中，则没有 `operator[]` 可以引用的值对象。在这种情况下，它将使用值类型的默认构造函数从零开始创建一个。然后\
  \ `operator[]` 返回指向这个新创建对象的引用。\n\n让我们再次看看第一部分：\n\n```cpp\nmap<int, Widget> m;\n\
  m[1] = 1.50;\n```\n\n`map` 的 `operator[]` 函数是一个新奇的物种，与 `vector`、`deque` 和 `string`\
  \ 的 `operator[]` 函数无关，与适用于数组的内置 `operator[]` 同样无关。相反，`map::operator[]` 的设计是为了方便“添加或更新”功能。也就是说，给定\n\
  \n```cpp\nmap<K, V> m;\n```\n\n表达式\n\n```cpp\nm[k] = v;\n```\n\n会检查键 `k` 是否已经在 map\
  \ 中。如果不在，它会被添加，连同 `v` 一起作为对应的值。如果 `k` 已经在 map 中，其关联的值将更新为 `v`。它的工作原理是 `operator[]`\
  \ 返回一个与 `k` 关联的值对象的引用。然后 `v` 被赋值给该引用（从 `operator[]` 返回的那个）所指向的对象。当更新现有键的关联值时，这种方法非常直观，因为已经有一个\
  \ `operator[]` 可以返回引用的值对象。但如果 `k` 尚不在 map 中，则没有 `operator[]` 可以引用的值对象。在这种情况下，它将使用值类型的默认构造函数从零开始创建一个。然后\
  \ `operator[]` 返回指向这个新创建对象的引用。\n\n让我们再次看看第一部分：\n\n```cpp\nmap<int, Widget> m;\n\
  m[1] = 1.50;\n```\n\n`map` 的 `operator[]` 函数是一个新奇的物种，与 `vector`、`deque` 和 `string`\
  \ 的 `operator[]` 函数无关，与适用于数组的内置 `operator[]` 同样无关。相反，`map::operator[]` 的设计是为了方便“添加或更新”功能。也就是说，给定\n\
  \n```cpp\nmap<K, V> m;\n```\n\n表达式\n\n```cpp\nm[k] = v;\n```\n\n会检查键 `k` 是否已经在 map\
  \ 中。如果不在，它会被添加，连同 `v` 一起作为对应的值。如果 `k` 已经在 map 中，其关联的值将更新为 `v`。它的工作原理是 `operator[]`\
  \ 返回一个与 `k` 关联的值对象的引用。然后 `v` 被赋值给该引用（从 `operator[]` 返回的那个）所指向的对象。当更新现有键的关联值时，这种方法非常直观，因为已经有一个\
  \ `operator[]` 可以返回引用的值对象。但如果 `k` 尚不在 map 中，则没有 `operator[]` 可以引用的值对象。在这种情况下，它将使用值类型的默认构造函数从零开始创建一个。然后\
  \ `operator[]` 返回指向这个新创建对象的引用。\n\n（注：由于提供的原文中存在大量重复的段落，根据“不要重复输出原文”的原则，此处展示了译文逻辑。实际完整翻译时应按原文结构进行去重对应。）\n\
  \n\n\n\n`insert` 的调用需要一个类型为 `IntWidgetMap::value_type` 的参数（即 `pair<int, Widget>`），因此当我们调用\
  \ `insert` 时，我们必须构造并析毁该类型的对象。这导致我们付出了 `pair` 构造函数和析构函数的开销。反过来，这又意味着 `Widget` 的构造和析构，因为\
  \ `pair<int, Widget>` 本身包含一个 `Widget` 对象。`operator[]` 不使用 `pair` 对象，因此它既不构造也不析构\
  \ `pair` 或 `Widget`。\n\n效率考量由此使我们得出结论：在向 map 中添加元素时，`insert` 比 `operator[]` 更优；而在更新\
  \ map 中已存在的元素时，效率和美感都决定了 `operator[]` 更有优。\n\n如果 STL 能提供一个兼顾两者优点的函数就太好了，即在一个语法上很有吸引力的包中提供高效的“添加或更新”功能。例如，想象这样一个这样的调用接口并不困难：\n\
  \n点击此处查看代码图片\n\n```\niterator affectedPair = // 如果键 k 不在 map m 中，高效地\nefficientAddOrUpdate\
  \ (m, k, v); // 将 pair (k,v) 添加到 m；否则\n// 高效地将 k 关联的值更新为 v。返回一个\n// 指向已添加或\n// 修改\
  \ pair 的迭代器\n```\n\nSTL 中没有这样的函数，但下面的代码所示，自己写一个并不特别困难。注释总结了正在发生什么，接下来的段落提供了一些额外的解释。\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate< typename MapType, // map 的类型\ntypename KeyArgType,\
  \ // 原因 reason 见下文\ntypename ValueArgType> // KeyArgType 和\n// ValueArgType 是类型\n\
  typename MapType::iterator // 参数\nefficientAddOrUpdate(MapType& m,\nconst KeyArgType&\
  \ k,\nconst ValueArgType& v)\n{\n    typename MapType::iterator lb = // 找到 k 所在或应该\n\
  \    m.lower_bound(k); // 在的位置；原因见第 7B 页\n    // \"typename\" 在这里\n    // 需要\n \
  \   if (lb != m.end() && // 如果 lb 指向一个 pair\n    !(m.key_comp()(k, lb->first)))\
  \ { // 它的键等于 k...\n        lb->second = v; // 更新 pair 的值\n        return lb; //\
  \ 并返回指向\n    } // 该 pair 的迭代器\n    } else {\n        typedef typename MapType::value_type\
  \ MVT;\n        return m.insert(lb, MVT(k, v)); // 将 pair(k, v) 添加到 m 并\n    } //\
  \ 返回指向\n    // 新 map 元素的迭代器\n}\n}\n```\n\n为了执行高效的添加或更新，我们需要能够找到 `k` 的值是否在 map 中；如果是，它在哪里；如果不是，它应该插入到哪里。这项工作是为\
  \ `lower_bound` 量身定制的（参见 Item 45 ），所以这就是我们调用的函数。为了确定 `lower_bound` 是否找到了我们寻找的键的元素，我们需要执行等价性测试的后半部分（参见\
  \ Item 19 ），并确保对 map 使用了正确的比较函数；该比较函数可以通过 `map::key_comp` 获取。等价性测试的结果告诉我们是在执行添加还是更新。\n\
  \n如果是更新，代码是非常直观的。`insert` 分支更有趣，因为它使用了 `insert` 的带“提示”（hint）的形式。构造函数 `m.insert(lb,\
  \ MVT(k, v))` “提示”了 `lb` 标识了键与 `k` 等价的新元素的正确插入位置，标准库保证如果提示是正确的，`insert`ion 操作将在分摊常数时间而非对数时间内完成。在\
  \ `efficientAddOrUpdate` 中，我们知道 `lb` 标识了正确的插入位置，因此对 `insert` 的调用保证是一个分摊常数时间的操作。\n\
  \n该实现的一个有趣方面是，`KeyArgType` 和 `ValueArgType` 并不非要是存储在 map 中的类型。它们只需要是*可转换*为 map 中存储的类型即可。另一种方法是消除类型参数\
  \ `KeyArgType` 和 `ValueArgType`，而是改用 `MapType::key_type` 和 `MapType::mapped_type`。然而，如果这样做，我们可能会在调用点强制发生不必要的类型转换。例如，再次看我们在这个\
  \ Item 示例中使用的 map 定义：\n\n```cpp\nmap<int, Widget> m; // 同之前\n```\n\n并记得 `Widget`\
  \ 接受来自 `double` 的赋值：\n\n点击此处查看代码图片\n\n```cpp\nclass Widget { // 同样同之前\npublic:\n\
  ...\n    Widget& operator=(double weight);\n...\n};\n```\n\n现在考虑这个对 `efficientAddOrUpdate`\
  \ 的调用：\n\n```cpp\nefficientAddOrUpdate(m, 10, 1.5);\n```\n\n假设这是一个更新操作，即 `m` 包含一个键为\
  \ 10 的元素。在这种情况下，推断出 `ValueArgType` 为 `double`，并将 1.5 赋值给与 10 关联的 `Widget`。如果在 `efficientAddOrUpdate`\
  \ 中使用了 `MapType::mapped_type` 作为 `ValueArgType` 的类型，我们可能会在调用点强制发生不必要的类型转换。\n\n效率考量由此使我们得出结论：在向\
  \ map 中添加元素时，`insert` 比 `operator[]` 更优；而在更新 map 中已存在的元素时，效率和美感都决定了 `operator[]`\
  \ 更有优。\n\n### Item 25：熟悉非标准的哈希容器\n\n对于 STL 程序员来说，通常不需要很长时间就会开始疑惑：“vector、list、map\
  \ 都有了，但哈表在哪里？”遗憾的是，标准 C++ 库中没有哈表。大家都认为这很遗憾，但标准化委员会认为添加它们会不合理地推迟标准的完成。目前，STL 并不提供哈表。\n\
  \n然而，如果你喜欢哈表，请宽心。你不需要从零开始自己实现。兼容 STL 的哈希容器从多个来源获取，它们甚至有了事实上的标准名称：`hash_set`、`hash_multiset`、`hash_map`\
  \ 和 `hash_multimap`。\n\n在这些共同名称背后，不同的实现存在差异。它们在接口、功能、底层数据结构以及它们支持的操作的相对效率上都存在差异。使用哈希表编写相当可移植的代码仍然可能的，但如果哈希容器被标准化，就没那么容易了。（现在你知道为什么标准很重要了。）\n\
  \n在可用的哈希容器实现中，最常见的两个来自 SGI（参见 Item 50 ）和 Dinkumware（参见 Appendix B ），因此在后续内容中我限制于这些供应商哈希容器的设计。STLport（再次参见\
  \ Item 50 ）也提供哈希容器，但 STLport 哈希容器是基于 SGI 的。对于本 Item 的目的，假设关于 SGI 哈希容器的所有内容也适用于 STLport\
  \ 哈希容器。\n\n哈希容器是关联容器，所以你不意外像所有关联容器一样，它们需要知道存储在容器中的对象类型、这些对象的比较函数以及这些对象的分配器。此外，哈希容器需要指定哈希函数。这暗示了哈希容器的如下声明：\n\
  \n```cpp\ntemplate<typename T,\ntypename HashFunction,\ntypename CompareFunction,\n\
  typename Allocator = allocator<T> >\nclass hash_ *container* ;\n```\n\n\n\n\n\n\
  这与 SGI 对哈希容器的声明非常，主要区别在于 SGI 为 `HashFunction` 和 `CompareFunction` 提供了默认类型。SGI 对\
  \ `hash_set` 的声明基本上如下所示（为了演示，我对其进行了微调）：\n\n点击此处查看图片\n\n```cpp\ntemplate<typename\
  \ T,\ntypename HashFunction = hash<T> ,\ntypename CompareFunction = equal_to<T>\
  \ ,\ntypename Allocator = allocator<T> >\nclass hash_set;\n```\n\nSGI 设计中一个值得注意的方面是使用\
  \ `equal_to` 作为默认比较函数。这偏离了标准关联容器的惯例，后者的默认比较函数是 `less`。这一设计决策的意义不仅仅是默认比较函数的改变。SGI\
  \ 的哈希容器通过测试 `equality`（相等性）来确定哈希容器中的两个对象是否具有相同的值，而不是 equivalence（等价）（参见 项目 19）。对于哈希容器来说，这并不是一个不合理的决定，因为哈希关联容器与标准的（通常是基于树的）容器不同，它们并不保持顺序。\n\
  \nDinkumware 的哈希容器采用采用不同的策略。它仍然允许你指定对象类型、哈希函数类型、比较函数类型和分配器类型，但它将默认的哈希和比较函数移动到一个单独的类似\
  \ traits 类中称为 `hash_compare`，并使 `hash_compare` 容器模板中 `HashingInfo` 参数的默认参数。（如果你不熟悉“traits”类的概念，可以打开一本良好的\
  \ STL 参考书，如 Josuttis 的 *The C++ Standard Library* [3 ] 并研究 `char_traits` 和 `iterator_traits`\
  \ 模板的设计动机和实现。）\n\n例如，这里是 Dinkumware 的 `hash_set` 声明（同样为了演示进行了微调）：\n\n点击此处查看图片\n\n\
  ```cpp\ntemplate<typename T, typename CompareFunction>\nclass hash_compare;\n\n\
  template<typename T,\ntypename HashingInfo = hash_compare<T, less<T> > ,\ntypename\
  \ Allocator = allocator<T> >\nclass hash_set;\n```\n\n该接口设计中有意思的部分在于对 `HashingInfo`\
  \ 的使用。容器的哈希和比较函数存储在那里，但 `HashingInfo` 类型还持有了控制表中最小桶（buckets）数量的枚举值，以及容器元素与桶之间允许的最大比例。当超过此比例时，哈表中的桶数量会增加，并且表中的某些元素会被重新哈希。（SGI\
  \ 提供了成员函数，可以对表桶的数量（因此表元素与桶的比例）提供类似的控制。）\n\n在对演示进行一些微调后，`hash_compare`（`HashingInfo`\
  \ 的默认值）大体看起来如下：\n\n点击此处查看图片\n\n```cpp\ntemplate<typename T, typename CompareFunction\
  \ = less<T> >\nclass hash_compare {\npublic:\n    enum {\n    bucket_size = 4, //\
  \ 元素与桶的最大比例\n    min_buckets = 8 // 最小桶数量\n    };\n    size_t operator()(const T&)\
  \ const; // 哈希函数\n    bool operator()(const T&, // 比较函数\n    const T&) const;\n\
  \    ... // 省略了一些内容，包括\n}; // CompareFunction 的使用\n```\n\n`operator()` 的重载（在本例中是为了同时实现哈希和比较函数）是一种比你想象中更频繁出现的策略。关于该想法的另一个应用，请查看\
  \ 项目 23 。\n\nDinkumware 设计允许你编写自己的类似于 `hash_compare` 的类（可能通过派生 `hash_compare` 本身），只要你的类提供了\
  \ `bucket_size`、`min_buckets`、两个 `operator()` 函数（一个接受一个参数，一个接受两个参数）加上我省略的内容，你就可以用它来控制\
  \ Dinkumware `hash_set` 或 `hash_multiset` 的配置和行为。`hash_map` 和 `hash_multimap` 的配置控制也是类似的。\n\
  \n注意，在 SGI 和 Dinkumware 的设计中，你都可以将所有决策留给实现，并简单编写如下代码：\n\n```cpp\nhash_set<int> intTable;\
  \ // 创建一个整数哈希集\n```\n\n为了使其通过编译，哈希表必须持有一个整数类型（如 `int`），因为默认的哈希函数通常限制为整数类型。（SGI 的默认哈希函数稍微灵活一点。项目\
  \ 50 将告诉你可以在何处找到所有细节。）\n\n在底层，SGI 和 Dinkumware 的实现采取了完全不同的路径。SGI 采用传统的开放哈希方案，由一个指向元素单向链表的指针数组（即桶）组成。Dinkumware\
  \ 同样采用开放哈希，但其设计基于一种新颖的数据结构，该结构由一个迭代器数组（本质上是桶）指向元素的双向链表组成，其中相邻的迭代器对标识了每个桶中元素的范围。（详情请参阅\
  \ Plauger 标题恰当的“Hash Tables” [16 ]。）\n\n作为这些实现的用户，你会对以下事实感兴趣：SGI 使用单链表存储表元素，而 Dinkumware\
  \ 使用双向链表。这种差异是值得的，因为它影响了迭代器的类别。SGI 的哈希容器提供向前迭代器，因此你放弃了反向遍历的能力；SGI 的哈希容器没有 `rbegin`\
  \ 或 `rend` 成员函数。Dinkumware 哈希容器的迭代器是双向的，因此它们提供了正向反向遍历。\n\n哪种设计对你和你的应用程序最好？我无法得知。只有你能决定，而且这个\
  \ Item 并没有提供足够做出合理结论的信息。相反，这个 Item 的目标是确保你知道尽管 STL 本身缺乏哈希容器，但兼容 STL 的哈希容器（具有不同的接口、功能和权衡）并不难。对于\
  \ SGI 和 STLport 实现，你甚至可以免费获得，因为它们可以免费下载。\n\n## 4. 迭代器\n\n乍看，迭代器似乎很直观。仔细观察，你会发现标准\
  \ STL 容器提供了四种迭代器类型：`iterator`、`const_iterator`、`reverse_iterator` 和 `const_reverse_iterator`。从那里开始，早晚你会注意到在这四种类型中，只有一种类型被容器的某些\
  \ `insert` 和 `erase` 形式接受。那时问题就开始了。为什么要四种迭代器类型？它们之间是什么关系？它们可以相互转换吗？不同类型在调用算法和 STL\
  \ 工具函数时可以混合吗？这些类型与容器及其成员函数有什么关系？\n\n本章回答了这些问题，并引入了一个比通常获得更多关注的迭代器类型：`istreambuf_iterator`。如果你喜欢\
  \ STL，但对 `istream_iterator` 在读取字符流时的性能不满意，`istreambuf_iterator` 可能正是你正在寻找的工具。\n\n\
  ### 项目 26：优先使用 `iterator` 而非 `const_iterator`、`reverse_iterator` 和 `const_reverse_iterator`\n\
  \n\n\n\n\n正如你所知，每个标准容器都提供四种类型的迭代器。对于一个 `container<T>`，`iterator` 类型类似于 `T*`，而 `const_iterator`\
  \ 类似于 `const T*`（你可能也看到它被写成 `T const *`；它们的意思相同）。递增 `iterator` 或 `const_iterator`\
  \ 会使你在从头到尾的遍历中移动到容器中的下一个元素。`reverse_iterator` 和 `const_reverse_iterator` 分别地类似于\
  \ `T*` 和 `const T*`，不同之处在于递增这些迭代器类型会使你在从尾到头的遍历中移动到容器中的下一个元素。\n\n让我向你展示两点。首先，看一眼\
  \ `vector<T>` 中 `insert` 和 `erase` 的一些签名：点击查看代码\n\n```cpp\niterator insert(iterator\
  \ position, const T& x);\niterator erase(iterator position);\niterator erase(iterator\
  \ rangeBegin, iterator rangeEnd);\n```\n\n每个标准容器都提供了与这些类似的函数，尽管返回类型取决于容器类型。需要注意的是，这些函数要求\
  \ `iterator` 类型的参数。而不是 `const_iterator`，不是 `reverse_iterator`，也不是 `const_reverse_iterator`。虽然容器支持四种迭代器类型，但其中一种类型具有其他类型不具备的权限。那种类型就是\
  \ `iterator`。`iterator` 是特殊的。我想向你展示的第二点是这张图，它显示了迭代器类型之间存在的转换：\n\n![image](img/Image0060.gif)\n\
  \n该图显示了从 `iterator` 到 `const_iterator`、从 `iterator` 到 `reverse_iterator`，以及从 `reverse_iterator`\
  \ 到 `const_reverse_iterator` 的隐式转换。它还显示 `reverse_iterator` 可以通过 `reverse_iterator`\
  \ 的 `base` 成员函数转换为 `iterator`，同样，`const_reverse_iterator` 也可以通过 `base` 转换为 `const_iterator`。该图并没有显示从\
  \ `base` 获取的迭代器可能不是你想要的那个。关于这方面的故事，请参阅项目 28。\n\n你会发现，没有办法从 `const_iterator` 变为 `iterator`，或者从\
  \ `const_reverse_iterator` 变为 `reverse_iterator`。这很重要，这意味着如果你有一个 `const_iterator`\
  \ 或 `const_reverse_iterator`，你会发现很难将这些迭代器用于某些容器成员函数。此类函数要求 `iterator`，由于没有从 const\
  \ 迭代器类型变回 `iterator` 的转换路径，如果你想用它们来指定插入位置或要删除的元素，那么 const 迭代器类型基本上是没用的。\n\n不要被误骗，认为这意味着\
  \ const 迭代器通来说是没用的。它们并不是的。它们在算法中非常有用，因为算法通常不在乎它们处理的是什么种类型的迭代器，只要它们属于相应的类别即可。const\
  \ 迭代器对于许多容器成员函数也是可以的。只有某些形式的 `insert` 和 `erase` 是挑剔的。\n\n我写道如果你想指定插入位置或要删除的元素，const\
  \ 迭代器“很大程度上”是没用的。这隐含的意思是它们并不是完全没用。如果你能找到一种从 `const_iterator` 或 `const_reverse_iterator`\
  \ 获取 `iterator` 的方法，它们就是有用的。这通常是可能的。然而，这总是可行，即使可行，实现方法也并不直观易见。效率可能也不非常高。这个话题的深度足以单独列为一个项目，所以如果你对细节感兴趣，请参阅项目\
  \ 27。目前，我们有足够的信息来理解为什么通常优先选择 `iterator` 而非 const 和反向迭代器是有意义的：\n\n* 某些版本的 `insert`\
  \ 和 `erase` 需要 `iterator`。如果你想调用这些函数，你就必须产生 `iterator`。const 和反向迭代器是不行的。\n* 无法将\
  \ `const_iterator` 隐式转换为 `iterator`，而且在项目 27 中描述的从 `const_iterator` 生成 `iterator`\
  \ 的技术既不通用，也不保证高效。\n* 从 `reverse_iterator` 到 `iterator` 的转换可能在转换后需要对迭代器进行调整。项目 28\
  \ 解释了何时以及为何。\n\n所有这些因素共同使得，如果你倾向于使用 `iterator` 而非它们的 const 和反向同事，操作容器将是最简单、最高效，且最不容易产生细微错误的。\n\
  \n从实践上来说，涉及到 `iterator` 和 `const_iterator` 时，你更有可能有选择。`iterator` 和 `reverse_iterator`\
  \ 之间的决定通常是系统为你做出的。你要么需要从头到尾的遍历，要么需要从尾到头的遍历，大抵如此。你选择你需要的某一个，如果这意味着选择 `reverse_iterator`，你就选择\
  \ `reverse_iterator` 并使用 `base` 将其转换为 `iterator`（可能在此之前经过偏移量调整——参见项目 28）。\n\n在涉及到\
  \ `iterator` 和 `const_iterator` 时候，你更有可能面临选择。`iterator` 和 `reverse_iterator` 之间的决定通常是为你做出的。你要么需要从头到尾的遍历，要么需要从尾到头的遍历，大抵如此。你选择你需要的某一个，如果这意味着选择\
  \ `reverse_iterator`，你就选择 `reverse_iterator` 并使用 `base` 将其转换为 `iterator`（可能在此之前经过偏移量调整——参见项目\
  \ 28）。\n\n当你想要调用需要 `iterator` 的容器成员函数时，在 `iterator` 和 `const_iterator` 之间有理由选择 `iterator`。一种最令人头疼的问题涉及\
  \ `iterator` 和 `const_iterator` 之间的比较。我希望我们都能同意这段代码是合理的：点击查看代码\n\n```cpp\ntypedef\
  \ deque<int> IntDeque;\ntypedef IntDeque::iterator Iter;\ntypedef IntDeque::const_iterator\
  \ ConstIter;\n\nIter i;\nConstIter ci;\n\nif (i == ci)\n```\n\n我们在这里只是比较容器中的两个迭代器，这是\
  \ STL 的基本操作。唯一的转折在于一个对象的类型是 `iterator`，另一个类型是 `const_iterator`。这不应该是问题。`iterator`\
  \ 应该隐式转换为 `const_iterator`，比较应该在两个 `const_iterator` 之间进行。\n\n在设计良好的 STL 实现中，这正是发生的情况，但在其他实现中，代码将无法编译。由于这些实现将\
  \ `const_iterator` 的 `operator==` 声明为成员函数而非非成员函数，但你对问题产生的原因可能不如对解决方法感兴趣，而这种方法是交换迭代器的顺序，如下所示：点击查看代码\n\
  \n```cpp\nif (ci == i)\n```\n\n每当你在同一个表达式中混合 `iterator` 和 `const_iterator`（或 `reverse_iterator`\
  \ 和 `const_reverse_iterator`）时，就会出现这类问题，而不仅仅是在比较它们时。例如，如果你尝试从一个随机访问迭代器减去另一个时，\n\n\
  ```cpp\nif (i - ci >= 3)\n```\n\n如果迭代器类型不同，你的（有效）代码可能会被（错误地）拒绝。在这种情况下，简单的解决方法是通过（安全的）强制转换将\
  \ `iterator` 转换为 `const_iterator`：点击查看代码\n\n```cpp\nif (static_cast<ConstIter>(i)\
  \ - ci >= 3)\n```\n\n\n\n\n防止此类问题最简单的方法是尽量减少迭代器类型的混合使用，这反过来会导致我们倾向于使用 `iterator`\
  \ 而非 `const_iterator`。从 `const` 正性的角度（这确实是一个值得考虑的角度）来看，仅仅为了避免潜在的实现缺陷（所有这些缺陷都有解决方法）而避开\
  \ `const_iterator` 似乎是不合理的，但考虑到某些容器成员函数中 `iterator` 的“受崇地位”，很难不得出这样一个事实性结论：`const_iterator`\
  \ 不仅没有 `iterator` 好用，有时它们根本不值得费那个劲。\n\n### Item 27：使用 `distance` 和 `advance` 将容器的\
  \ `const_iterator` 转换为 `iterator`\n\n`Item 26` 指出，某些接受迭代器作为参数的容器成员函数坚持使用 `iterator`；`const_iterator`\
  \ 是不行的。那么，如果你手里有一个 `const_iterator`，而你想在迭代器指示的位置向容器插入一个新值，该怎么办？你必须以某种方式将 `const_iterator`\
  \ 转换为 `iterator`，而且你必须主动完成转换，因为正如 `Item 26` 所解释的，从 `const_iterator` 到 `iterator`\
  \ 并没有隐式转换。\n\n我知道你在想什么。你在想：“当别无办法时，就用大锤子。”在 C++ 的世界里，这只意味着一件事：强制转换（casting）。为你这种想法感到羞愧。这些想法是从哪里来的？\n\
  \n让我们正面面对你对类型转换的执念。看看尝试将 `const_iterator` 转换为 `iterator` 会发生什么：\n\n点击此处查看代码图片\n\n\
  ```cpp\ntypedef deque<int> IntDeque; // 方便 typedef\n\ntypedef IntDeque::iterator\
  \ Iter;\n\ntypedef IntDeque::const_iterator ConstIter;\n\nConstIter ci; // ci 是一个\
  \ const_iterator\n\n...\n\nIter i(ci); // 错误！没有从\n\n// const_iterator 到 iterator\
  \ 的隐式转换\n\nIter i(const_cast<Iter>(ci)); // 错误！不能将\n\n// const_iterator 转换为 iterator\n\
  ```\n\n这个示例恰好使用了 `deque`，但对于 `list`、`set`、`multiset`、`map`、`multimap` 以及 `Item 25`\
  \ 中的哈希容器，结果都是相同的。在 `vector` 或 `string` 的情况下，转换行*可能*可以通过编译，但这些是稍后我们会考虑的特殊情况。\n\n\
  转换无法编译的原因是，对于这些容器类型，`iterator` 和 `const_iterator` 是不同的类，它们之间的关系几乎比 `string` 和 `complex<double>`\
  \ 还要疏远。尝试将一种类型转换为另一种类型是没有意义的，这就是为什么 `const_cast` 被拒绝的原因。`static_cast`、`reinterpret_cast`\
  \ 和 C 风格强制转换会导致相同的结果。\n\n遗憾的是，如果迭代器的容器是 `vector` 或 `string`，这种无法编译的转换可能会通过编译。这是因为这些容器的实现通常使用指针作为迭代器。对于此类实现，`vector<T>::iterator`\
  \ 是 `T*` 的别名，`vector<T>::const_iterator` 是 `const T*` 的别名，`string::iterator` 是 `char*`\
  \ 的别名，而 `string::const_iterator` 是 `const char*` 的别名。在这样的实现下，从 `const_iterator`\
  \ 到 `iterator` 的 `const_cast` 将通过编译并正常工作，因为转换是将 `const T*` 转换为 `T*`。然而，即使在这样的实现下，`reverse_iterator`\
  \ 和 `const_reverse_iterator` 是真正的类，因此你不能将 `const_reverse_iterator` `const_cast`\
  \ 为 `reverse_iterator`。此外，正如 `Item 50` 所解释的，即使是 `vector` 和 `string` 迭代器为指针的实现，也只在编译发布\
  \ 模式时使用那种表示。所有这些因素导致了结论：即使对于 `vector` 和 `string`，将 `const` 迭代器转换为迭代器也是不明智的，因为其可移植性存疑。\n\
  \n如果你可以访问 `const_iterator` 来源容器，有一种安全、可移植的方法可以获取对应的 `iterator`，^(†)，而且它不需要绕过类型系统。这是解决方案的本质，尽管在编译之前对其进行稍微修改：\n\
  \n^(†) 我后来发现，这里描述的方法对于使用引用计数的 `string` 实现可能会失效。详情请参阅 jep 关于此书第 121 页的 8/22/01 注释，位于\
  \ `[`www.aristeia.com/BookErrata/estl1e-errata.html`](http://www.aristeia.com/BookErrata/estl1e-errata.html)`。\n\
  \n\n\n我们现在知道如何使用 `advance` 和 `distance` 来获取与 `const_iterator` 对应的 `iterator`，但到目前为止我们回避了一个具有相当实用价值的问题：这种技术的效率如何？答案很简单。它的效率取决于迭代器所允许的程度。对于随机访问迭代器（如\
  \ `vector`、`string` 和 `deque` 提供的迭代器），它是常数时间操作。对于双向迭代器（即所有其他标准容器的迭代器以及某些哈希容器的实现，参见\
  \ Item 25），它是线性时间操作。\n\n由于产生等同于 `const_iterator` 的 `iterator` 可能需要线性时间，你可能希望重新考虑那些需要从\
  \ `const_iterator` 生成 `iterator` 的设计。事实上，这种考虑有助于引出 Item 26 ，该条目建议你**在处理容器时，优先使用\
  \ `iterator` 而非 `const` 和反向迭代器。\n\n### 第 28 条：理解如何使用 `reverse_iterator` 的基 `iterator`\n\
  \n在 `reverse_iterator` 上调用 `base` 成员函数会产生“对应”的 `iterator`，但这并不清楚这意味着什么。例如，看看这段代码，它将数字\
  \ 1-5 放入 `vector` 中，设置一个 `reverse_iterator` 指向 3，并将一个 `iterator` 初始化为 `reverse_iterator`\
  \ 的基：\n\n点击查看代码图像\n\n```cpp\nvector<int> v;\n\nv.reserve(5); // 参见 Item 14\n\nfor\
  \ (int i = 1; i <= 5; ++i) { // 将 1-5 放入 vector\n  v.push_back(i);\n}\n\nvector<int>::reverse_iterator\
  \ ri = // 使 ri 指向 3\nfind(v.rbegin(), v.rend(), 3);\n\nvector<int>::iterator i(ri.base());\
  \ // 使 i 与 ri 的基 相同\n```\n\n执行这段代码后，情况可以被看作如下：\n\n![image](img/Image00061.gif)\n\
  \n这张图片很直观，展示了 `reverse_iterator` 的特征偏移及其对应的基 `iterator`，后者模拟了 `rbegin()` 和 `rend()`\
  \ 相对于 `begin()` 和 `end()` 的偏移量，但它并没有告诉你你需要的所有信息。特别是，它没有解释如何使用 `i` 来执行你想要在 `ri` 上执行的操作。\n\
  \n如 Item 26 所解释的，某些容器成员函数只接受 `iterator` 作为迭代器参数，因此如果你想（例如）在 `ri` 标识的位置插入一个新元素，你无法直接这样做；`vector`\
  \ 的 `insert` 函数不接受 `reverse_iterator`。如果你想删除 `ri` 指向的元素，也会遇到类似的问题。`erase` 成员函数拒绝\
  \ `reverse_iterator`，而是坚持使用 `iterator`。要执行插入或删除，你必须通过 `base` 将 `reverse_iterator`\
  \ 转换为 `iterator`，然后使用该 `iterator` 完成任务。\n\n所以，假设你*确实*想在 `ri` 指向的位置向 `v` 插入一个新元素。特别地，假设你想插入值\
  \ 99。考虑到在上面的图中 `ri` 是从右向左遍历的一部分，并且插入发生在用于指定插入位置的迭代器所指向的元素*前面*，我们预期的 99 在反向遍历中最终将落到\
  \ 3 的前面。插入后，`v` 看起来将是这样：\n\n![image](img/Image00062.gif)\n\n当然，我们不能使用 `ri` 来指示插入位置，因为它不是一个\
  \ `iterator`。我们必须使用 `i`。如上所述，当 `ri` 指向 3 时，`i`（即 `ri.base()`）指向 4。如果想要插入的值最终落在我们在我们能够使用\
  \ `ri` 指定插入位置时本该所在的位置，那么 `i` 恰恰需要指向那里。结论是？\n\n*   要模拟在由 `reverse_iterator ri` 指定的位置进行插入，请在\
  \ `ri.base()` 所在的位置进行插入。对于插入而言，`ri` 和 `ri.base()` 是等价的，而 `ri.base()` 才是真正*对应*于 `ri`\
  \ 的 `iterator`。\n\n现在让我们考虑删除元素。再次查看原始 `vector` 中 `ri` 和 `i` 的关系（即在插入 99 之前）：\n\n\
  ![image](img/Image00063.gif)\n\n如果我们想删除 `ri` 指向的元素，不能直接使用 `i`，因为 `i` 指向的元素与 `ri`\
  \ 相同。相反，我们必须删除 `i`*前面*的元素。因此，\n\n*   要模拟在由 `reverse_iterator ri` 指定的位置进行删除，请在 `ri`*前面*的位置进行删除。对于删除而言，`ri`\
  \ 和 `ri.base()` 不等价，而 `ri.base()` 是对应于 `ri` 的 `iterator`。值得查看代码来执行这种删除，因为它包含一个惊喜。\n\
  \n点击查看代码图像\n\n```cpp\nvector<int> v;\n\n... // 如上，将 1-5 放入 v\n\nvector<int>::reverse_iterator\
  \ ri = // 如上，使 ri 指向 3\nfind(v.rbegin(), v.rend(), 3);\n\nv.erase(--ri.base());\
  \ // 尝试在 ri.base() 前面删除\n// 对于 vector，这// 通常不会编译\n```\n\n现在应该清楚了，说 `reverse_iterator`\
  \ 的 `base` 成员函数返回“对应”的 `iterator` 是不准确的。对于插入目的它是如此，但对于删除目的则不是。在将 `reverse_iterator`\
  \ 转换为 `iterator` 时，重要的是知道你计划对该 `iterator` 做什么，因为只有这样才能判断你拥有的 `iterator` 是否是你需要的\n\
  \n### 第 29 条：考虑使用 `istreambuf_iterator` 进行逐字符输入\n\n假设你想将一个文本文件复制到 `string` 对象中。这看起来是一个相当合理的方法：\n\
  \n点击查看代码图像\n\n```cpp\nifstream inputFile(\"interestingData.txt\");\n\nstring fileData((istream_iterator<char>(inputFile)),\
  \ // 将 inputFile 读\nistream_iterator<char>()); // fileData; 下文\n// 为什么这\n// 不完全正确\n\
  ```\n\n### 很快你就会发现这种方法未能将文件中的空白字符复制到字符串中。这是因为 `istream_iterator` 使用 `operator>>`\
  \ 函数来执行实际读取，而默认情况下，`operator>>` 函数会跳过空白字符。\n\n假设你想保留空白字符，你需要做的只是覆盖默认。只需为输入流清除 `skipws`\
  \ 标志即可：\n\n```cpp\nifstream inputFile(\"interestingData.txt\");\n\ninputFile.unsetf(ios::skipws);\
  \ // 禁止跳过\n```\n\n\n\n```cpp\n// inputFile 中的空白字符\n\nstring fileData((istream_iterator<char>(inputFile)),\n\
  \nistream_iterator<char>());\n```\n\n现在，`inputFile` 中的所有字符都被拷贝到了 `fileData` 中。\n\
  \n遗憾，你可能会发现它们的拷贝速度并没有你想象的那么快。`istream_iterator` 依赖的 `operator>>` 函数执行的是格式化输入，这意味着每当你调用其中一个函数时，它们都代表你完成大量的工作。它们必须创建和销毁\
  \ `sentry` 对象（一种用于为每次调用 `operator>>` 执行设置和清理活动的的特殊 iostream 对象），它们必须检查可能影响其行为的流标志（例如\
  \ `skipws`），它们必须对读取错误进行详尽的检查，并且当它们遇到问题时，它们必须检查流的异常掩码以确定是否应该抛出异常。如果你正在执行格式化输入，这些都是重要的活动；但如果你只是想从输入流中获取下一个字符，这些就大材小用了。\n\
  \n一种更高效的方法是使用 STL 中最不为人知的秘密之一：`istreambuf_iterator`。你可以像使用 `istream_iterator` 一样使用\
  \ `istreambuf_iterator`，但 `istream_iterator<char>` 对象使用 `operator>>` 从输入流读取单个字符，而\
  \ `istreambuf_iterator<char>` 对象则直接访问流的缓冲区并读取下一个字符。（更具体地说，从 istream `s` 读取的 `istreambuf_iterator<char>`\
  \ 对象将调用 `s.rdbuf()->sgetc()` 来读取 `s` 的下一个字符。）\n\n修改我们的文件读取代码以使用 `istreambuf_iterator`\
  \ 非常简单，大多数 Visual Basic 程序员不需要尝试两次就能搞定：\n\n点击此处查看代码图像\n\n```cpp\nifstream inputFile(\"\
  interestingData.txt\");\n\nstring fileData((istreambuf _iterator<char>(inputFile)),\n\
  \nistreambuf _iterator<char>());\n```\n\n注意，这里不需要“取消设置” `skipws` 标志。`istreambuf_iterator`\
  \ 永远不会跳过任何字符。流缓冲区中下一个是什么，它们就抓取什么。\n\n与 `istream_iterator` 相比，它们抓取得快——在我进行的简单基准测试中，速度快了高达\
  \ 40%，尽管如果你的实际情况有所不同，也不要意外。如果速度优势随着时间的推移而增加也不要意外，因为 `istreambuf_iterator` 位于 STL\
  \ 中一个很少访问的角落，实现者尚未在那里花费大量时间进行优化。例如，在我使用的一种实现中，在我的原始测试中，`istreambuf_iterator` 只比\
  \ `istream_iterator` 快了约 5%。这样的实现显然有很大的空间来优化它们的 `istreambuf_iterator` 实现。\n\n如果你需要逐个读取流中的字符，你不需要格式化输入的强大功能，而且你会在意读取流的时间，那么每个迭代器多输入三个字符对于换取通常显著的性能提升来说，是一个很小的代价。对于非格式化的逐字符输入，你应该始终考虑\
  \ `istreambuf_iterator`。\n\n顺便说，你还应该考虑相应的非格式化逐字符输出操作的 `ostreambuf_iterator`。它们避免了与其表兄弟\
  \ `ostream_iterator` 相同的开销（以及灵活性），因此它们的性能通常也优于后者。\n\n## 第 5 章 算法\n\n我在第 1 章 的开头提到，容器获得了\
  \ STL 大部分的赞誉。从某种意义上说，这是可以理解的。容器是卓越成就，它们每天让无数 C++ 程序员的生活变得更轻松。尽管如此，STL 算法本身也具有重要意义，同样能够减轻开发者的负担。事实上，鉴于有\
  \ 100 多种算法，很容易认为它们为程序员提供了一套比容器（仅有 8 种）永远无法企及的、更精细的工具集。也许它们的数量就是问题所在之处。理解 8 种不同的容器类型显然比记住\
  \ 70 个算法名称并尝试跟踪每个算法的作用要工作量少得多。\n\n我在本章中有两个主要目标。首先，我想通过展示这些算法如何让你的生活变得更轻松，向你介绍一些不太为人知的算法。请放心，我不会用背记名称列表来惩罚你。我在本章中向你展示的算法是因为它们解决了常见问题，例如执行不区分大小的字符串比较、高效地找到容器中\
  \ *n* 个最符合要求的对象、总结范围内所有对象的特征，以及实现 `copy_if` 的行为（这是来自原始 HP STL 的算法，在标准化期间被丢弃了）。\n\
  \n我的第二个目标是教你如何避免算法的常见用法问题。例如，除非你完全理解这些算法做了（以及*没有*做什么），否则你不能调用 `remove`，或者它的兄弟们 `remove_if`\
  \ 和 `unique`。当你 `remove` 的对象范围包含指针时，情况尤为如此。同样，许多算法仅对排序范围有效，所以你需要了解哪些是这些算法以及它们为什么要施加这种限制。最后，最常见的算法相关错误之一是要求算法将其结果写入一个不存在的地方，因此我解释了这种荒谬情况是如何发生的，以及如何确保你不会受其苦。\n\
  \n在本章结束时，你可能不会像对待容器那样对待算法，但我希望你能够更频繁地让它们获得关注。\n\n### 事项 30：确保目标范围足够\n\nSTL 容器在添加新对象时会自动扩展自身（通过\
  \ `insert`、`push_front`、`push_back` 等）。由于这种机制非常完善，某些程序员产生了一种认为永远不需要担心为对象留空间的想法。如果真是那样！\n\
  \n问题出现在程序员*考虑*向容器中插入对象但没有告诉 STL 它们在想什么时。这是这种现象的一种常见方式：\n\n点击此处查看代码图像\n\n```cpp\n\
  int transmogrify(int x); // 此函数根据 x 产生\n\n// 一个新值\n\nvector<int> values;\n\n...\
  \ // 将放入 values\n\nvector<int> results; // 将 transmogrify 应用\n\ntransform(values.begin(),\
  \ values.end(), // values 中的每个对象\n\nresults.end(), // 将返回值追加\n\ntransmogrify); //\
  \ 到 results；*这*\n\n// *代码有 bug！*\n```\n\n\n\n\n犯下这种错误的程序员几乎总是意图让所调用的算法结果被 `insert`\
  \ 到目标容器中。如果你确实希望发生这种情况，你必须明确说明出来。STL 是一个库，而不是一个读心术士。在这个例子中，表达“请将 `transform` 的结果放在名为\
  \ `results` 的容器的末尾”的方法是调用 `back_inserter` 来生成指定目标范围起始的迭代器：\n\n点击此处查看代码图像\n\n```cpp\n\
  vector<int> results; // 对 results 应用 transmogrify\ntransform(values.begin(), values.end(),\
  \ // 将 values 中的每个对象\nback_inserter(results) , // 插入\ntransmogrify); // values 插入\n\
  // results 的末尾\n```\n\n在内部，`back_inserter` 返回的迭代器会调用 `push_back`，因此你可以将 `back_inserter`\
  \ 用于任何提供 `push_back` 的容器（即任何标准序列容器：`vector`、`string`、`deque` 和 `list`）。如果你更倾向于让算法在容器的前部插入元素，你可以使用\
  \ `front_inserter`。在内部，`front_inserter` 利用 `push_front`，因此 `front_inserter` 仅适用于提供该成员函数的容器（即\
  \ `deque` 和 `list`）：\n\n点击此处查看代码图像\n\n```cpp\n... // 与上文相同\nlist<int> results; //\
  \ results 现在是一个 list\ntransform(values.begin(), values.end(), // 将 transform 的结果\n\
  front_inserter(results) , // 插入到 results 的前面\ntransmogrify); // results 的顺序是*反序的*\n\
  ```\n\n由于 `front_inserter` 导致每个添加到 `results` 中的对象都执行了 `push_front`，因此 `results`\
  \ 中对象的顺序将是 `values` 中对应对象的*反序*。这就是为什么 `front_inserter` 不像 `back_inserter` 那么频繁使用的原因之一。另一个原因是\
  \ `vector` 不提供 `push_front`，所以 `front_inserter` 无法与 `vector` 使用。\n\n如果你希望 `transform`\
  \ 将其输出放在 `results` 的前面，但又希望输出顺序与 `values` 中对应对象的顺序相同，只需以反序遍历 `values` 即可：\n\n点击此处查看代码图像\n\
  \n```cpp\nlist<int> results; // 与上文相同\ntransform(values.rbegin (), values.rend(),\
  \ // 将 transform 的结果\nfront_inserter(results), // 插入到 results 的前面\ntransmogrify);\
  \ // results；保持了\n// 对象的相对顺序\n```\n\n鉴于 `front_inserter` 允许你强制算法将其结果插入到容器的前部，而 `back_inserter`\
  \ 允许你告诉它们将结果放在容器的末尾，`inserter` 允许你强制算法将结果插入到容器的任意位置，这并不意外奇：\n\n点击此处查看代码图像\n\n```cpp\n\
  vector<int> values; // 如上文\n...\nvector<int> results; // 如上文，但现在\n... // results\
  \ 在调用 transform\n// 之前包含了一些数据\ntransform(values.begin(), values.end(), // 将 transmogrify\
  \ 的结果\ninserter(results, results.begin() + results.size() / 2) , // 插入\n); // 将\
  \ trans-\n// mogrifica-\n// tions 插入到\n// results 的\n// 中间\n```\n\n无论你使用 `back_inserter`、`front_inserter`\
  \ 还是 `inserter`，向目标范围的每次插入都是一次一个对象完成的。项目 5 解释了对于连续内存容器（`vector`、`string` 和 `deque`）来说这可能是昂贵的，但项目\
  \ 5 建议的解决方案（使用范围成员函数）在由算法执行插入时无法应用。在这个例子中，`transform` 将一次一个值地写入其目标范围，你无能改变这一点。\n\
  \n与仅仅调用 `push_back` 和 `push_front` 的 `back_inserter` 和 `front_inserter` 不同，`inserter`\
  \ 返回一个能够跟踪其最近插入位置的迭代器。随后的插入将紧接最近插入的元素之后。\n\n当你插入的容器是 `vector` 或 `string` 时，可以通过遵循项目\
  \ 14 的建议并提前调用 `reserve` 来最小化开销。你仍然必须在每次插入发生时承担移动元素的代价，但至少你避免了重新分配容器底层内存的需求：\n\n\
  点击此处查看代码图像\n```cpp\nvector<int> values; // 如上文\n...\nvector<int> results; // 如上文，但现在\n\
  ... // results 在调用 transform\n// 之前包含了一些数据\ntransform(values.begin(), values.end(),\
  \ // 将 transmogrify 的结果\ninserter(results, results.begin() + results.size() / 2)\
  \ , // 插入\n); // 将 trans-\n// mogrifica-\n// tions 插入到\n// results 的\n// 中间\n```\n\
  \n\n\n\n```cpp\nvector<int> values;\n\nvector<int> results;\n\n...\n\nif (results.size()\
  \ < values.size()) { // 确保 results 至少\n    results.resize(values.size()); // 和 values\
  \ 一样大\n}\n\ntransform(values.begin(), values.end(), // 覆盖前\n    results.begin(),\
  \ // values.size() 个元素\n    transmogrify); // results 中的元素\n```\n\n或者你可以 `clear\
  \ results` 然后按照通常的方法使用插入迭代器：\n\n点击此处查看代码图片\n\n...\n\n```cpp\nresults.clear() ; //\
  \ 销毁 results 中的\n// 所有元素\nresults.reserve(values.size()); // 预留足够的空间\n\ntransform(values.begin(),\
  \ values.end(), // 将 transform 的\n    back_inserter (results), // values 放入 results\n\
  \    transmogrify);\n```\n\n本节（Item）展示了一个主题的多个变体，但我希望底层的旋律能留在你的脑海中。每当你使用一个需要指定目标范围的算法时，请确保目标范围已经足够大，或者在算法运行过程中增大范围。若要在执行过程中增加大小，请使用插入迭代器，例如\
  \ `ostream_iterator` 或由 `back_inserter`、`front_inserter` 或 `inserter` 返回的迭代器。这就是你需要记忆的所有。\n\
  \n### Item 31：了解你的排序选项\n\n我该如何排序呢？让我数数方法。\n\n当许多程序员考虑对对象排序时，脑海中只会浮算法：`sort`。（有些程序员会想到\
  \ `qsort`，但一旦他们读了 Item 46，他们就会收回意念，并将 `qsort` 的想法替换为 `sort`。）\n\n现在，`sort` 是一个很棒的算法，但在不需要的地方浪费这种性能是没有意义。有时你并不需要全排序。例如，如果你有一个\
  \ `Widget` 向量，想选出 20 个质量最好的 `Widget` 发给你最忠诚的客户，你只需要进行足以识别这 20 个最佳 `Widget` 的排序；其余部分可以保持无序。你需要的是部分排序，有一种名为\
  \ `partial_sort` 的算法正如其名所示：\n\n点击此处查看代码图片\n\n```cpp\nbool qualityCompare(const Widget&\
  \ lhs, const Widget& rhs)\n{\n    // 返回 lhs 的质量是否大于 rhs 的质量\n}\n```\n\n...\n\n```cpp\n\
  partial_sort (widgets.begin(), // 将最好的 20 个元素\n    widgets.begin() + 20, // （按顺序）放在\
  \ widgets\n    widgets.end(), // 的前端\n    qualityCompare);\n```\n\n... // 使用 widgets...\n\
  \n在在调用 `partial_sort` 之后，`widgets` 的前 20 个元素是容器中最好的且是有序的，即：质量最高的 `Widget` 是 `widgets[0]`，下一个最好的是\
  \ `widgets[1]`，以此类推。这使得将最好的 `Widget` 发给最好的客户，将次优的 `Widget` 发给次优的客户，以此类推变得非常容易。\n\
  \n如果你只在乎这 20 个最好的 `Widget` 发给你的 20 个最好的客户，但不在乎哪个 `Widget` 发给哪个客户，那么 `partial_sort`\
  \ 提供的就超出了你的需求。在这种情况下，你只需要任何顺序的 20 个最好的 `Widget`。STL 有一个算法恰好能实现你想要的功能，尽管它的名字可能不会立刻跳出脑海。它被称为\
  \ `nth_element`。\n\n`nth_element` 对范围进行排序，使得位置 *n*（由你指定）上的元素是该范围被完全排序后本该位置的元素。此外，当\
  \ `nth_element` 返回时，位置 *n* 之前的所有元素在排序顺序上都不在位置 *n* 元素之后，且位置 *n* 之后的所有元素在排序顺序上都不在位置\
  \ *n* 元素之前。如果这听起来很复杂，那仅仅是因为我必须字斟句酌。我稍后会解释原因，但让我们先看看如何使用 `nth_element` 来确保最好的 20\
  \ 个 `Widget` 位于 `widgets` 向量的前部：\n\n点击此处查看代码图片\n\n```cpp\nnth_element (widgets.begin(),\
  \ // 将最好的 20 个元素\n    widgets.begin() + 19, //  widgets 的前端，\n    widgets.end(),\
  \ // 但不用担心\n    qualityCompare); // 它们的顺序\n```\n\n如你所见，`nth_element` 的调用本质上与 `partial_sort`\
  \ 的调用相同。它们效果上的唯一区别是 `partial_sort` 排序了位置 1-20 上的元素，而 `nth_element` 没有。然而，这两种算法都将\
  \ 20 个质量最好的 `Widget` 移动到了向量的前部。\n\n这引出一个重要问题：当存在质量水平相同的元素时，这些算法会做什么？假设例如，有 12 个质量评分为\
  \ 1（最高）的元素和 15 个质量评分为 2（次优）的元素。\n\n（注：原文后半部分包含重复/混乱的句子，已清理以保持核心技术指令。）\n\n`partial_sort`\
  \ 和 `nth_element` 不保证等值元素的稳定性。请参见 Item 19 了解什么是等值。\n\n说到 `nth_element`，这个名字奇特的算法功能非常强大。除了能让你找到范围的前\
  \ *n* 个元素外，它还可以用于寻找范围内的中位数，或寻找特定百分位数的值：\n\n点击此处查看代码图片\n\n```cpp\nvector<Widget>::iterator\
  \ begin(widgets.begin()); // 方便变量\nvector<Widget>::iterator end(widgets.end());\
  \ // 用于 widgets 的起始和结束迭代器\nvector<Widget>::iterator goalPosition; // 指向目标元素// 所在的位置\n\
  // 下面代码找到具有\n// 中位数质量的 Widget\ngoalPosition = begin + widgets.size() / 2; // 目标元素在\n\
  // 排序后的向量中间所在的位置\nnth_element (begin, goalPosition, end, // 找到 widgets 中的\n// 中位数值\n\
  qualityCompare); // ... goalPosition 现在\n// 指向具有中位数质量的 Widget\n\n// 下面代码找到具有\n//\
  \ 75 百分位数质量的 Widget\nvector<Widget>::size_type goalOffset = 0.25 * widgets.size();\
  \ // 计算目标元素\n// 距离起始位置有多远\nnth_element (begin, begin + goalOffset, end, // 找到 75\n\
  // 百分位的质量值\nqualityCompare); // ... begin+goalOffset 现在\n// 指向具有 75 百分位数\n// 质量水平的\
  \ Widget\n```\n\n\n\n\n\n`sort`, `stable_sort` 和 `partial_sort` 在你确实需要对元素进行排序时非常好用，而当你需要识别前\
  \ `n` 个元素或特定位置的元素时，`nth_element` 则能胜任。但有时你需要与 `nth_element` 类似但又不完全相同的东西。例如，假设你不需要识别前\
  \ 20 个质量最好的 `Widget`。相反，你需要识别所有质量评级为 1 或 2 的 `Widget`。当然，你可以按质量对 `vector` 进行排序，然后搜索第一个质量评级低于\
  \ 2 的元素。这就能确定一范围内低质量 `Widget` 范围的起点。\n\n然而，全排序可能工作量很大，而这项工作并不需要这么多的工作量。更好的策略是使用\
  \ `partition` 算法，它会重新排列范围内的元素，使得所有符合特定标准的元素位于范围的开头。\n\n例如，为了将所有质量评级为 2 或以上的 `Widget`\
  \ 移动到 `widgets` 的前面，我们定义了一个函数来识别哪些 `Widget` 符合标准，\n\n点击此处查看代码图片\n\n```cpp\nbool\
  \ hasAcceptableQuality(const Widget& w)\n{\n    // 返回 w 的质量评级是否为 2 或更好；\n}\n```\n\
  \n然后将该函数传递给 `partition`：\n\n点击此处查看代码图片\n\n```cpp\nvector<Widget>::iterator goodEnd\
  \ = // 移动所有满足\npartition (widgets.begin(), // hasAcceptableQuality 到\n         \
  \  widgets.end(), // widgets 前面，并\n           hasAcceptableQuality); // 返回指向第一个\n\
  \                               // 不满 widget 的迭代器\n```\n\n在此次调用之后，从 `widgets.begin()`\
  \ 到 `goodEnd` 的范围包含了所有质量为 1 或 2 的 `Widget`，而从 `goodEnd` 到 `widgets.end()` 的范围包含所有质量评级更低的\
  \ `Widget`。如果在分区过程中保持等效质量水平 `Widget` 的相对位置很重要，那么我们自然会选择 `stable_partition` 而不是 `partition`。\n\
  \n`sort`、`stable_sort`、`partial_sort` 和 `nth_element` 算法要求随机访问迭代器，因此它们只能应用于 `vector`、`string`、`deque`\
  \ 和数组。在标准关联容器中排序元素是没有意义的，因为此类容器使用它们的比较函数来始终保持排序状态。唯一一种我们可能想使用 `sort`、`stable_sort`、`partial_sort`\
  \ 或 `nth_element` 但无法无法的容器是 `list`，而 `list` 通过提供其成员函数 `sort` 在某种程度上弥补了这一缺陷。（有趣的是，`list::sort`\
  \ 执行的是稳定排序。）如果你想对 `list` 进行排序，那么你可以这样做，但如果你想在 `list` 的对象上使用 `partial_sort` 或 `nth_element`，你必须间接地去实现。其中一种间接方法是将元素拷贝到一个具有随机访问迭代器的容器中，然后对该容器应用所需的算法。另一种方法是创建一个\
  \ `list::iterator` 容器，在该容器上使用该算法，然后通过迭代器访问列表元素。第三种方法是使用有序迭代器容器中的信息，迭代地通过 `splice`\
  \ 将列表元素“移动”到你希望它们所在的位置。如你所见，有很多选择。\n\n`partition` 和 `stable_partition` 与 `sort`、`stable_sort`、`partial_sort`\
  \ 和 `nth_element` 的区别在于它们只需要双向迭代器。因此，你可以对任何标准序列容器使用 `partition` 和 `stable_partition`。\n\
  \n让我们总结一下你的排序选项：\n\n- 如果你需要对 `vector`、`string`、`deque` 或数组进行全排序，可以使用 `sort` 或 `stable_sort`。\n\
  - 如果你有一个 `vector`、`string`、`deque` 或数组，并且只需要对前 `n` 个元素排序，可以使用 `partial_sort`。\n\
  - 如果你有一个 `vector`、`string`、`deque` 或数组，你需要识别位置 `n` 处的元素，或者你需要在不排序的情况下识别前 `n` 个元素，`nth_element`\
  \ 可以供你调用。\n- 如果你需要将标准序列容器或数组的元素分为满足和不满足某些标准的元素，你可能在寻找 `partition` 或 `stable_partition`。\n\
  - 如果你的数据在 `list` 中，你可以直接使用 `partition` 和 `stable_partition`，并可以使用 `list::sort` 代替\
  \ `sort` 和 `stable_sort`。如果你需要 `partial_sort` 或 `nth_element` 提供的效果，你必须间接地处理该任务，但正如我上面概述的，有很多选择。\n\
  \n此外，你可以通过将数据存储在标准关联容器中来始终保持排序状态。你可能还会考虑标准非 STL 容器 `priority_queue`，它也始终保持元素有序。（`priority_queue`\
  \ 传统上被认为是 STL 的一部分，但正如我在引言中提到的，我对“STL”的定义要求容器支持迭代器，而 `priority_queue` 不支持。）\n\n\
  “但性能呢？”你可能会想。广义地说，工作量更多的算法比稳定排序的算法花费的时间长。我们可以对在本节中讨论的算法进行如下排序，将倾向于使用少资源（时间和空间）的算法列在需要更多资源的之前：\n\
  \n1. `partition`\n2. `stable_partition`\n3. `nth_element`\n4. `partial_sort`\n5.\
  \ `sort`\n6. `stable_sort`\n\n关于在这些之间进行选择的建议是根据你的需求做出选择，而不是基于性能考虑。如果你选择了一个完成你所需的算法（例如，用\
  \ `partition` 代替 `sort`），你可能得到的代码不仅是你所愿的最清晰的表达，而且也是实现该目标最高效的方法。\n\n### Item 32:\
  \ 如果你真的想删除，请通过 `erase` 跟进类似 `remove` 的算法\n\n我在本节的开头对 `remove` 进行回顾，因为 `remove` 是\
  \ STL 中最令人困惑的算法。误解 `remove` 很容易，消除关于 `remove` 做了什么、为什么要这样做以及它是如何操作的所有疑虑是非常重要的。\n\
  \n这里是 `remove` 的声明：\n\n```cpp\ntemplate<class ForwardIterator, class T>\nForwardIterator\
  \ remove(ForwardIterator first, ForwardIterator last, const T& value);\n```\n\n\
  与其他所有算法一样，`remove` 一对标识要操作范围的迭代器。它不接收容器，所以 `remove` 不知道哪个容器持有它正在查找的元素。此外，`remove`\
  \ 发现该容器是不可能的，因为没有从迭代器回到容器的方法。\n\n思考一下如何从容器中删除元素。唯一的方法是调用该容器的成员函数，几乎总是某种形式的 `erase`。（`list`\
  \ 有几个删除元素且不名为 `erase` 的成员函数，但它们仍然是成员函数。）因为从容器中删除元素的唯一方法是调用该容器的成员函数，由于 `remove` 无法知道操作元素的容器，因此\
  \ `remove` 不可能从容器中删除元素。这解释了原本令人困惑的观察：`remove` 容器中的元素从未改变容器中元素的数量：\n\n点击此处查看代码图片\n\
  \n```cpp\nvector<int> v; // 创建一个 vector<int> 并填充\nv.reserve(10); // 1-10 的值值。（关于\
  \ reserve 调用的解释请参见 Item 14(text00049.html_ch02lev1sec2））\nfor (int i = 1; i <= 10;\
  \ ++i) {\n    v.push_back(i);\n}\ncout << v.size(); // 打印 10\n```\n\n\n\n\n```cpp\n\
  v[3] = v[5] = v[9] = 99; //将 3 个元素设置为 99\n\nremove(v.begin(), v.end(), 99); // 移除所有值为\
  \ 99 的元素\n\ncout << v.size(); // 打印的仍然是 10！\n```\n\n为了理解这个示例的含义，请记住以下内容：\n\n> `remove`\
  \ 并没有“真正”删除任何东西，因为因为它做不到。\n\n重复记忆对你有好处：\n\n> `remove` 并没有“真正”删除任何东西，*因为它做不到*。\n\n\
  `remove` 并不知道它本应该从哪个容器中删除元素，而没有那个容器，它就无法调用那些在“真正”删除某些东西时所需的成员函数（如果真要真地删除某些东西的话）。\n\
  \n这解释了 `remove` **没有**做什么，也解释了它为什么不**这样做。我们现在需要回顾的是 `remove` **到底** 了什么。\n\n简而言之，`remove`\
  \ 会移动它所给范围内的元素，直到所有“未被移除”的元素都位于该范围的前部（保持它们原始的相对顺序）。它返回一个指向最后一个“未被移除”元素之后的迭代器。这个返回值就是该范围的“新逻辑末尾”。\n\
  \n就就我们的示例而言，在调用 `remove` 之前，`v` 看起来如下：\n\n![image](img/Image00064.gif)\n\n如果我们将\
  \ `remove` 的返回值存储在一个名为 `newEnd` 的新迭代器中，\n\n```cpp\nvector<int>::iterator newEnd(\
  \ remove(v.begin(), v.end(), 99)) ;\n```\n\n那么调用之后，`v` 看起来如下：\n\n![image](img/Image00065.gif)\n\
  \n在这里，我使用了问号来表示那些在概念上已从 `v` 中移除但仍然存在的元素值。\n\n逻辑上似乎，如果“未被移除”的元素位于 `v` 的 `v.begin()`\
  \ 和 `newEnd` 之间，那么“被移除”的元素就一定位于 `newEnd` 和 `v.end()` 之间。*事实并非如此！* 这些“被移除”的值并不一定不再存在于\
  \ `v` 中。`remove` 不会改变范围内元素的顺序以使所有“被移除”的元素位于末尾，它只是让所有“未被移除”的值位于开头。虽然标准并没有要求这样做，但范围新逻辑末尾之后的元素通常*保留它们原来的旧值*。在调用\
  \ `remove` 之后，在我知道的所有实现中，`v` 看起来如下：\n\n![image](img/Image00066.gif)\n\n如你所示，原本存在于\
  \ `v` 中的两个“99”值已不在了，而一个“99”仍然保留。通常情况下，在调用 `remove` 之后，从范围内移除的值可能继续存在于该范围内，也可能不再存在。大多数人觉得这很惊讶，但为什么呢？你要求\
  \ `remove` 去掉某些值，它就做到了。你并没有要求它将被移除的值放在一个你以后可以访问的特殊位置，所以它没有这样做。问题出在哪里？（如果你不想丢失任何值，可能应该调用\
  \ `partition` 或 `stable_partition` 而不是 `remove`。`partition` 和 `stable_partition`\
  \ 在 Item 31 中有所描述。）\n\n`remove` 的行为听起来很记恨，但这仅仅是算法运行方式导致的副作用。在内部，`remove` 遍历范围，用稍后要保留的值来覆盖那些要被“移除”的值。这种覆盖是通过对持有要被覆盖值的元素进行赋值来完成的。\n\
  \n你可以将 `remove` 为执行了某种压缩操作，其中要被移除的值充当压缩过程中被填充的“洞”的角色。对于我们的 vector `v`，过程如下：\n\n\
  1. `remove` 检查 `v[0]`，发现它的值不应该被移除，然后移动到 `v[1]`。它对 `v[1]` 和 `v[2]` 执行了相同的操作。\n2.\
  \ 它发现 `v[3]` 应该被移除，因此注意到 `v[3]` 的值可能会被覆盖，然后移动到 `v[4]`。这类似于注意到 `v[3]` 是一个需要填充的“洞”。\n\
  3. 它发现 `v[4]` 的值应该被保留，因此将 `v[4]` 赋值给 `v[3]`，注意到 `v[4]` 现在可能会被覆盖，然后移动到 `v[5]`。继续这个压缩的类比，它用\
  \ `v[4]` “填充”了 `v[3]`，并注意到 `v[4]` 现在是一个洞。\n4. 它发现 `v[5]` 应该被移除，因此忽略了它并移动到 `v[6]`。它继续记住\
  \ `v[4]` 是一个等待填充的洞。\n5. 它发现 `v[6]` 是一个应该保留的值，因此将 `v[6]` 赋值给 `v[4]`，记住 `v[5]` 现在是下一个要填充的洞，然后移动到\
  \ `v[7]`。\n6. 以类似于上述的方式，它检查了 `v[7]`、`v[8]` 和 `v[9]`。它将 `v[7]` 赋值给 `v[7]`（此处应为逻辑上的移位），将\
  \ `v[8]` 赋值给 `v[5]`，将 `v[9]` 赋值给 `v[6]`，`v[7]` 要被移除。\n7. 它返回一个指向下一个要覆盖元素的迭代器。\n\n\
  你可以想象值在 `v` 中的移动方式如下：\n\n![image](img/Image00067.gif)\n\n正如 Item 33 所解释的，`remove`\
  \ 覆盖某些值在当这些值是指针时会有重要影响。但对于这个 Item，只需要理解 `remove` 不从容器中消除任何元素，因为它做不到。只有容器成员函数可以消除元素，这正是\
  \ `erase` 的全部意义：\n\n你想要删除的元素很容易识别。它们是从范围的“新逻辑末尾”开始到实际结束的元素。为了删掉这些元素，你只需要用这两个迭代器调用\
  \ `erase`（因为 `remove` 本身返回范围的新逻辑末尾，所以调用非常简单）：\n\n```cpp\nvector<int> v; // 同前\n\
  ...\nv.erase(remove(v.begin(), v.end(), 99), v.end()); // *真正*移除所有 99\ncout << v.size();\
  \ // 现在返回 7\n```\n\n将 `remove` 的返回值作为 `erase` 的第一个参数是如此常见，以至于成了一种惯用法。事实上，`remove`\
  \ 和 `erase` 如此紧密结合，以至于在 `list` 的成员函数中它们合并了。这是 STL 中唯一名为 `remove` 的消除元素的函数：\n\n```cpp\n\
  list<int> li; // 创建列表\n... // 向其放入一些值\nli.remove(99); // 所有值为 99 的元素\n// 这真的删除了元素，所以\
  \ li 的大小可能会变化\n```\n\n可以说，将此函数命名为 `remove` 是 STL 中的一种不一致。关联容器中的对应函数是 `erase`，`list`\
  \ 的 `remove` 也应该被称为 `erase`。然而事实并非如此，我们必须习惯。（好处是，Item 44 指出，对于列表，调用 `remove` 成员函数比应用\
  \ erase-remove 技巧更高效。）\n\n一旦你理解了 `remove` 无法“真正”从容器中删除东西，配合 `erase` 使用它就会变成本能。你唯一需要记住的是，`remove`\
  \ 并不是这种情况唯一的算法。还有两个“类似 `remove`”的算法：`remove_if` 和 `unique` 。\n\n\n\n\n`remove` 和\
  \ `remove_if` 之间的相似性是显而易见的，我不在此赘述，但 `unique` 的行为也像 `remove` 一样。它被要求在一个范围内移除元素（相邻的重复值），而无需访问持有该范围元素的容器。因此，如果你真的想从容器中删除元素，也必须将\
  \ `unique` 的调用与 `erase` 的调用配合使用。`unique` 与 `list` 的交互上也类似于 `remove`。正如 `list::remove`\
  \ 真的删除了元素（而且比 `erase-remove` 惯用法更高效），`list::unique` 也真的删除了相邻的重复项（效率也比 `erase-unique`\
  \ 高）。\n\n### Item 33：警惕对指针容器使用类似 `remove` 的算法\n\n假设你创建了一系列动态分配的 `Widget`，每个都可能经过认证，你并将生成的指针存储在一个\
  \ `vector` 中：\n\n点击此处查看代码图片\n\n```cpp\nclass Widget {\npublic:\n    ...\n    bool\
  \ isCertified() const; // 是否经过认证\n    ...\n};\n\nvector<Widget*> v; // 创建一个 vector\
  \ 并填充它\n... // 指向动态分配的指针\nv.push_back(new Widget); // 分配的 Widgets\n...\n```\n\n\
  在对 `v` 进行了一段时间操作后，你决定舍弃那些未认证的 `Widget`，因为你不再需要它们了。考虑到 Item 43 关于优先使用算法调用而非显式循环的告诫，并且已经读过\
  \ Item 32 关于 `remove` 和 `erase` 之间关系的论述，你的想法自然地转到了 `erase-remove` 惯用法，尽管在这种情况下你用的是\
  \ `remove_if`：\n\n点击此处查看代码图片\n\n```cpp\nv.erase(remove_if(v.begin(), v.end(), //\
  \ 删除指向\n    not1(mem_fun(&Widget::isCertified))), // 未认证的\n.end()); // Widgets;\
  \ 参见\n// Item 41\n// 关于\n// mem_fun 的信息\n```\n\n突然，你开始担心对 `erase` 的调用，因为你隐约地记得 Item\
  \ 7 讨论过在容器中销毁指针无法删除指针所指向的内容。这是一个合理的担忧，但在这种情况下，它来得太晚了。在 `erase` 被调用时，你极极可能已经泄露了资源。担心\
  \ `erase` 是对的，但首先，要担心 `remove_if`。\n\n假设在调用 `remove_if` 之前，`v` 看起来像这样，我标记了未认证的 `Widget`。\n\
  \n![image](img/Image00068.gif)\n\n调用 `remove_if` 之后，`v` 通常看起来像这样（包括 `remove_if`\
  \ 返回的迭代器）：\n\n![image](img/Image00069.gif)\n\n如果这种转换看起来毫无意义，请参阅 Item 32，因为它准确解释了当调用\
  \ `remove`——或者在本例中是 `remove_if`——时会发生什么。\n\n资源泄露的原因现在显而易见了。被“移除”的指向 Widget B 和 C\
  \ 的指针被 vector 中后面“未移除”的指针覆盖了。没有指针指向这两个未认证的 `Widget`，它们永远无法被删除，其内存和其他资源被泄露了。\n\n\
  一旦 `remove_if` 和 `erase` 都返回，情况如下：\n\n![image](img/Image00070.gif)\n\n这使得资源泄露变得尤为明显，现在应该很清楚为什么你应该尝试避免在动态分配对象的容器上使用\
  \ `remove` 和类似的算法（即 `remove_if` 和 `unique`）。在许多情况下，你会发现 `partition` 算法（参见 Item 31）是一个合理的替代方案。\n\
  \n如果你无法避免在之类容器上使用 `remove`，消除此问题的方法之一是在应用 `erase-remove` 惯用法之前删除指针并将其置为空空，然后消除容器中的所有空指针：\n\
  \n点击此处查看代码图片\n\n```cpp\nvoid delAndNullifyUncertified(Widget*& pWidget) // 如果 *pWidget\
  \ 是\n// 未认证的 Widget，\n{\n    if (!pWidget->isCertified()) { // 删除指针\n        delete\
  \ pWidget; // 并将其置为空空\n        pWidget = 0;\n    }\n}\n\nfor_each(v.begin(), v.end(),\
  \ // 删除并置空\n    delAndNullifyUncertified); // 所有指向\n// 未认证 widget 的指针\nv.erase(remove(v.begin(),\
  \ v.end(), // 从 v 中消除空指针\n    static_cast<Widget*>(0)), // 0 必须转换为\n    v.end());\
  \ // 指针类型以便 C++\n// 正确推导出\n// remove 的第 3 个参数\n```\n\n当然，这假设容器不持有任何你想保留的指针。如果它持有，你可能不得不自己写循环来删除元素。在遍历时从容器中删除元素有一些细微之处，所以在使用之前确保阅读\
  \ Item 9。\n\n如果你愿意用引用计数智能指针替换指针容器，`remove` 相关的困难就会消失，你可以直接使用 `erase-remove` 惯用法：\n\
  \n```cpp\ntemplate<typename T> // 引用计数\nclass RCSP { ... }; // 智能指针\ntypedef RCSP<Widget>\
  \ RCSPW; // RCSPW = \"Widget\"\n\nvector<RCSP*> v; // 创建一个 vector 并填充它\n... // 指向动态分配的指针\n\
  v.push_back(new Widget); // 分配的 Widgets\n...\nv.erase(remove_if(v.begin(), v.end(),\
  \ // 删除指向\n    not1(mem_fun(&Widget::isCertified))), // 未认证的\n    v.end()); // Widgets;\
  \ 参见\n```\n\n为了这种这种工作，必须能够将智能指针类型（例如 `RCSP<Widget>`）转换为对应的内置指针类型（例如 `Widget*`）。这是因为被调用的成员函数（例如\
  \ `Widget::isCertified`）要求内置指针。如果没有隐式转换，编译器将报错（等等，文中说“如果没有隐式转换，编译器将报错”）。\n\n如果你编程工具箱中还没有引用计数智能指针，你应该检查一下\
  \ Boost 库中的 `shared_ptr`。关于 Boost 的介绍，请查看 Item 50。\n\n无论你选择如何处理指针容器（通过引用计数智能指针、在调用算法之前删除并置空指针，还是使用自己的技术），本节的指导原则保持不变：对指针容器使用类似\
  \ `remove` 的算法。\n\n### Item 34：注意哪些算法期望有序范围\n\n并不是所有算法都适用于范围。例如，`remove`（参见 Item\
  \ 32 和 33）需要向前迭代器并通过这些迭代器进行赋值。因此，它不能应用于由输入迭代器界定的范围，不适用于 `map` 或 `multimap`，也不适用于\
  \ `set` 和 `multiset` 的某些实现（参见 Item 22）。同样，许多排序算法（参见 Item 31）要求随机访问迭代器，因此无法在 `list`\
  \ 的元素上调用这些算法。\n\n如果你违反了这类规则，你的代码将无法编译，这种事件可能会以冗长且难以理解的错误信息为预兆。然而，算法的其他先决条件更为微妙。在这些条件中，最可能是某些算法要求范围是有序。在适用时，遵守这一要求是非常关重要的，因为违反它会导致未定义的运行时行为。\n\
  \n\n\n一些算法可以处理已排序或未排序的范围，但它们在对有序范围进行操作时最为有用。你应该理解这些算法是如何运作的，因为这解释了为什么有序范围最适合它们。\n\
  \n我知道你们中有些人人喜欢死记硬背，所以这里有一份要求操作数据必须经过排序的算法列表：\n\n- `binary_search`, `lower_bound`\n\
  - `upper_bound`, `equal_range`\n- `set_union`, `set_intersection`\n- `set_difference`,\
  \ `set_symmetric_difference`\n- `merge`, `inplace_merge`\n- `includes`\n\n此外，以下算法通常用于有序范围，尽管它们并不强制要求有序：\n\
  \n- `unique`, `unique_copy`\n\n我们很快就会看到，“有序”的定义有一个重要的约束条件，但首先，让我尝试理清这一系列算法。如果你理解为什么需要此类范围，那么记住哪些算法适用于有序范围就会容易得多。\n\
  \n搜索算法 `binary_search`、`lower_bound`、`upper_bound` 和 `equal_range`（参见项目 45）需要有序范围，因为它们使用二分查找查找值。与\
  \ C 库的 `bsearch` 一样，这些算法保证对数时间的查找，但作为交换，你必须提供已经排好顺序的值。\n\n实际上，说这些算法保证对数时间查找并不完全准确。只有当传递了随机访问迭代器时，它们才保证这种性能。如果给它们功能较弱的迭代器（例如双向迭代器），它们仍然执行对数次比较，但运行时间是线性的。这是因为由于缺乏执行“迭代器算术”的能力，它们需要线性时间在搜索范围内的位置移动。\n\
  \n`set_union`、`set_intersection`、`set_difference` 和 `set_symmetric_difference` 这四组算法提供了其名称所示的集合论操作的线性时间性能。为什么它们要求有序范围？因为如果没有它们，它们无法在线性时间内完成工作。如果你开始察觉到一个趋势，即要求有序范围的算法是为了提供比在未排序范围内能保证的更好的性能，那么你是正确的。请继续关注。这种趋势将会持续。\n\
  \n`merge` 和 `inplace_merge` 执行实际上等同于归并排序算法的一次单遍：它们读取两个有序范围并产生一个包含两个源范围所有元素的新有序范围。它们在线性时间内运行，如果它们不知道源范围已经排序，它们就无法做到。\n\
  \n最后一个要求有序源范围的算法是 `includes`。它用于确定一个范围中的所有对象是否也在另一个范围中。由于 `includes` 可能会假设两个范围都是有序的，因此它保证了线性时间的性能。如果没有那个保证，它的运行通常会更慢。\n\
  \n与我们刚刚讨论的算法不同，`unique` 和 `unique_copy` 即使在未排序范围内提供了提供了定义的行为。但看看标准是如何描述 `unique`\
  \ 行为的（斜体是我写的）：\n\n> 从每个连续相等元素组中删除除第一个元素以外的所有元素。\n\n换句话说，如果你想让 `unique` 消除范围内的所有重复项（即让范围内的所有值“唯一”），你必须首先确保所有重复值都相邻。猜怎么着？这正是排序的作用之一。在实践中，`unique`\
  \ 通常用于消除范围中的所有重复值，因此你几乎总是想要确保传递给 `unique`（或 `unique_copy`）的范围是有序的。（Unix 开发者会发现 STL\
  \ 的 `unique` 与 Unix 的 `uniq` 之间惊人的相似性，我怀疑这种相似性绝非偶然。）\n\n顺带提一下，`unique` 以 `remove`\
  \ 一的方式从范围内消除元素，也就是说它只是“某种程度上”消除了它们。如果你不这意味着什么，请立即查看项目 32 和 33。对于理解 `remove` 和类似\
  \ `remove` 的算法（包括 `unique`）的作用，无论如何强调都不为过。有基本的理解是不够的。如果你*不知道*它们做什么，你就会遇到麻烦。\n\n\
  这引出了关于范围“有序的”意味着什么的细则说明。由于 STL 允许你指定在排序期间使用的比较函数，不同的范围可能会以不同的方式排序。例如，给定两个 `int`\
  \ 范围，一个可能按默认方式排序（即升序），而另一个可能使用 `greater<int>` 排序（即降序）。给定两个 `Widget` 范围，一个可能按价格排序，另一个可能按年龄排序。有这么多不同的排序方式，因此为\
  \ STL 提供一致的排序相关信息至关重要。如果你将一个有序范围传递给同时也接受比较函数的算法，请确保你传递的比较函数的行为与你用于排序该范围的函数相同。\n\n\
  这里有一个你*不*想要做的示例：\n\n点击此处查看代码图像\n\n```cpp\nvector<int> v; // 创建一个 vector，放入一些\n\n\
  ... // 将数据放入其中，对其进行排序\n\nsort(v.begin(), v.end(), greater<int>()); // 降序\n\n...\
  \ // 对 vector 进行操作\n\n// (在不改变它的)\n\nbool a5Exists = // 在 vector 中搜索 5，\n\nbinary_search(v.begin(),\
  \ v.end(), 5); // 假设它是按\n\n// 升序排序的！*\n```\n\n默认情况下，`binary_search` 假设它搜索的范围是按 `<`\
  \ 排序的（即值是升序的），但在示例中，vector 是按降序排序的。当你在一个排序顺序与算法预期不同的值范围上调用 `binary_search`（或 `lower_bound`\
  \ 等）时，得到未定义的结果，你不应该感到意外。\n\n为了让代码正确运行，你必须告诉 `binary_search` 使用与 `sort` 相同的比较函数：\n\
  \n点击此处查看代码图像\n\n```cpp\nbool a5Exists = // 搜索 5\nbinary_search(v.begin(), v.end(),\
  \ 5, greater<int>()); // 使用 greater 作为\n// 比较\n// 函数\n```\n\n所有要求有序范围的算法（即本项目除 `unique`\
  \ 和 `unique_copy` 之外的所有算法）都通过等价性（equivalence）来确定两个值是否“相同”，就像标准的关联容器（它们本身是有序的）一样。相比之下，`unique`\
  \ 和 `unique_copy` 两个对象是否“相同”的默认方式是相等性（equality），尽管你可以通过向这些算法传递定义另一种“相同”定义的谓词来覆盖此默认值。关于等价性和相等性之间差异的详细讨论，请参阅项目\
  \ 19。要求有序范围的十一个算法这样做是为了提供比其他情况下可能的更高的效率。只要你记得只向它们传递有序范围，只要你确保确保算法使用的比较函数与用于排序的函数一致，你就能尽情享受无忧的搜索、集合和合并操作，而且你还会发现\
  \ `unique` 和 `unique_copy` 消除了*所有*重复值，正如你几乎确定希望它们这样做的那样。\n\n### 项目 35：通过 `mismatch`\
  \ 或 `lexicographical_compare` 实现简单的不区分大小写的字符串比较\n\n\n\n\n\nSTL 新手最常问的问题之一是：“我如何使用\
  \ STL 进行不区分大小写的字符串比较？” 这是一个看起来非常简单的问题。不区分大小写的字符串比较要么非常简单，要么非常困难，取决于你希望通用到什么种程度。如果你愿意忽略国际化问题，并将关注点限制在\
  \ `strcmp` 设计的那种字符串上，那么任务就很简单。如果你希望能够处理 `strcmp` 无法适用的语言中的字符字符串（即存储除英语以外几乎任何语言文本的字符串），或者程序使用默认本地区域（locale）以外的情况，那么任务就非常困难。\n\
  \n在本节（Item）中，我将解决问题的简单版本，因为这足以演示如何利用 STL 发挥作用。（问题的更难版本并不涉及更多 STL。相反，它涉及到与本地区域相关的问题，你可以在\
  \ 附录 A 中阅读相关内容。）为了让这个简单问题更具挑战性，我将处理两次。想要不区分大小写字符串比较的程序员通常需要两个不同的调用接口：一个类似于 `strcmp`（返回负数、零或正数），另一个类似于\
  \ `operator<`（返回 `true` 或 `false`）。因此，我将展示如何使用 STL 算法实现这两个调用接口。\n\n首先，我们需要一种方法来判断两个字符是否相同，只是忽略大小写。当考虑国际化问题时，这是一个复杂的问题。下面的字符比较函数是一个简单的解决方案，但它类似于\
  \ `strcmp` 的字符串比较方法，而且由于在本节中我只考虑适用于类似 `strcmp` 方法方法的字符串，因此国际化问题不予计入，这个函数足够了：\n\n\
  点击此处查看代码图像\n\n```cpp\nint ciCharCompare(char c1, char c2) // 不区分大小写比较字符\n\n{ //\
  \ c1 和 c2，如果 c1 < c2 则返回 -1，\n\n// 如果 c1==c2 则返回 0，如果 c1 > c2 则返回 1\n\nint lc1 =\
  \ tolower(static_cast<unsigned char>(c1)); // 见下文\n\nint lc2 = tolower(static_cast<unsigned\
  \ char>(c2)); // 关于这些语句的信息\n\n// 语句\n\nif (lc1 < lc2) return -1;\n\nif (lc1 > lc2)\
  \ return 1;\n\nreturn 0;\n\n}\n```\n\n该函数遵循了 `strcmp` 的做法，根据 `c1` 和 `c2` 的关系返回负数、零或正数。与\
  \ `strcmp` 不同，`ciCharCompare` 在执行比较之前将两个参数都转换为小写。这使得它变成了不区分大小写的字符比较。\n\n与 `<cctype>`（以及\
  \ `<ctype.h>`）中的许多函数一样，`tolower` 的参数和返回值类型都是 `int`，但除非该 `int` 是 `EOF`，否则它的值必须能够表示为\
  \ `unsigned char`。在 C 和 C++ 中，`char` 可能是符号的，也可能是无符号的（取决于实现），当 `char` 是符号的时，确保其值可以表示为\
  \ `unsigned char` 的唯一方法是在调用 `tolower` 之前将其强制转换为该类型。这解释了上述代码中的类型转换。（在 `char` 已经是无符号的实现上，这些转换是空操作。）它也解释了为什么使用\
  \ `int` 而不是 `char` 来存储 `tolower` 的返回值。\n\n给定 `ciCharCompare`，很容易编写我们两个不区分大小写字符串比较函数中的第一个，即提供\
  \ `strcmp` 接口的函数。这个函数 `ciStringCompare` 返回负数、零或正数，取决于所比较字符串的关系。它是围绕 `mismatch` 算法构建的，因为\
  \ `mismatch` 识别出两个范围内对应值不相同的第一个位置。\n\n在可以调用 `mismatch` 之前，我们必须满足它的前提条件。特别是，我们必须确保如果一个字符串比另一个短，则较短的字符串是第一个传递的范围。因此，我们将实际工作交给一个名为\
  \ `ciStringCompareImpl` 的函数，并让 `ciStringCompare` 仅确保参数按正确的顺序传递，如果由于必须交换参数，则调整返回值：\n\
  \n点击此处查看代码图像\n\n```cpp\nint ciStringCompareImpl(const string& s1, // 见下文\n\nconst\
  \ string& s2); // 实现\n\nint ciStringCompare(const string& s1, const string& s2)\n\
  \n{\n\nif (s1.size() <= s2.size()) return ciStringCompareImpl(s1, s2);\n\nelse return\
  \ -ciStringCompareImpl(s2, s1);\n\n}\n```\n\n在 `ciStringCompareImpl` 中，重型工作由 `mismatch`\
  \ 完成。它返回一个迭代器对，指示范围内对应字符首次不匹配的位置：\n\n点击此处查看代码图像\n\n```cpp\nint ciStringCompareImpl(const\
  \ string& s1, const string& s2)\n\n{\n\ntypedef pair<string::const_iterator, //\
  \ PSCI = \"pair of\n\nstring::const_iterator> PSCI; // string::const_iterator\"\n\
  \nPSCI p = mismatch ( // 见下文\n\ns1.begin(), s1.end(),\n\ns2.begin(), s2.end(),\n\
  \nnot2(ptr_fun(ciCharCompare)));\n\nif (p.first == s1.end()) { // 如果 s1\n\nif (p.second\
  \ == s2.end()) return 0; // s2 相等\n\nelse return -1; // s1 比 s2 短\n\nreturn ciCharCompare(*p.first,\
  \ *p.second); // 在差异处\n\n}\n```\n\n如果有运气的话，注释清楚地说明了发生了什么。从根本上说，一旦知道了字符串不同的地方，很容易判断哪个字符串在另一个前面。唯一可能看起来奇怪的是传递给\
  \ `mismatch` 的谓词 `not2(ptr_fun(ciCharCompare))`。这个谓词负责在字符匹配时返回 `true`，因为 `mismatch`\
  \ 在谓词返回 `false` 时停止。我们不能为此目的使用 `ciCharCompare`，因为它返回 -1、1 或 0，并且像 `strcmp` 一样，它在字符匹配时返回\
  \ 0。如果我们将 `ciCharCompare` 作为谓词传递给 `mismatch`，C++ 将 `ciCharCompare` 的返回类型转换为 `bool`，而显然零的\
  \ `bool` 等值是 `false`，这与我们要求的相反！同样，当 `ciCharCompare` 返回 1 或 -1 时，它会被解释为 `true`，因为在\
  \ C 中所有非值都被视为 `true`。这再次与我们要求的相反。为了修复这种语义反转，我们在 `ciCharCompare` 前抛入一个 `not2` 和一个\
  \ `ptr_fun`，一切就正常了。\n\n我们对 `ciStringCompare` 的第二个方法产生了一个标准的 STL 谓词；这种函数可以作为关联容器的比较函数。该实现既短又完美，因为我们只需要修改\
  \ `ciCharCompare` 以给我们一个具有谓词接口的字符比较函数，然后将执行字符串的任务交给 STL 中名称第二长的长的算法 `lexicographical_compare`：\n\
  \n点击此处查看代码图像\n\n```cpp\nbool ciCharLess(char c1, char c2) // 返回 c1 是否在\n\n不区分大小写的比较中优于\
  \ c2\n\nreturn // 不区分写的\n\ntolower(static_cast<unsigned char>(c1)) < // Item 46\
  \ 解释了为什么\n\n函数对象可能 // 优于这个\n\n函数\n\ntolower(static_cast<unsigned char>(c2));\n}\n\
  \nbool ciStringCompare(const string& s1, const string& s2)\n\n{\n\nreturn lexicographical_compare\
  \ (s1.begin(), s1.end(),\n\ns2.begin(), s2.end(),\n\nciCharLess); // 这个算法\n\n}\n\
  ```\n\n不，我不会再让你等了。最长的算法名称是 `set_symmetric_difference` .\n\n\n\n\n如果你熟悉 `lexicographical_compare`\
  \ 的行为，那么上面的代码已经尽可能清晰了。如果你不熟悉，它可能就像混凝土一样晦懂。幸运的是，将混凝土替换为玻璃并不是难。\n\n`lexicographical_compare`\
  \ 是 `strcmp` 的通用版本。然而，`strcmp` 仅作用于字符数组，而 `lexicographical_compare` 作用于任何类型取值的范围。此外，虽然\
  \ `strcmp` 总是比较两个字符以判断它们的关系是相等、小于还是大于对方，但 `lexicographical_compare` 可以传递一个任意的谓词，用于判断两个值是否满足用户定义的标准。\n\
  \n在上面的调用中，`lexicographical_compare` 被要求根据 `ciCharLess` 的调用结果找到 `s1` 和 `s2` 不同的第一个位置。如果使用该位置的字符，`ciCharLess`\
  \ 返回 `true`，那么 `lexicographical_compare` 也返回 `true`：如果在字符不同的第一个位置，来自第一个字符串的字符在第二个字符串的对应字符之前，则第一个字符串在第二个字符串之前。与\
  \ `strcmp` 类似，`lexicographical_compare` 将两个等值范围视为相等的，因此它对此类范围返回 `false`：第一个范围*并不*在第二个范围之前。同样与\
  \ `strcmp` 类似，如果第一个范围在发现对应值的差异之前就结束，`lexicographical_compare` 返回 `true`：前缀位于其作为前缀的任何范围之前。\n\
  \n关于 `mismatch` 和 `lexicographical_compare` 的话就足够了。虽然我在书中关注的是可移植性，但如果我不提到不区分大小的字符串比较函数作为标准\
  \ C 库的非标准扩展广泛可用，我就失职了。它们通常命名为 `stricmp` 或 `strcmpi`，而且对国际化的支持通常不如我们在本节（Item）中开发的函数。如果你愿意牺牲一些可移植性，知道你的字符串从不包含嵌入空字符，并且不在意国际化，你可能会发现实现不区分大小字符串比较最简单的方法完全不使用\
  \ STL。相反，它将两个字符串都转换为 `const char*` 指针（参见 Item 16），然后对指针使用 `stricmp` 或 `strcmpi`：\n\
  \n点击此处查看代码图像\n\n```cpp\nint ciStringCompare(const string& s1, const string& s2)\n\
  {\n    return stricmp(s1.c_str(), s2.c_str()); // 函数名同\n} // 你的系统可能\n// 没有 stricmp\n\
  ```\n\n某些人可能认为这是一种黑科技（hack），但 `stricmp`/`strcmpi` 针对精确执行某一件事进行了优化，在处理长字符串时运行速度通常比通用算法\
  \ `mismatch` 和 `lexicographical_compare` *快得多*。如果这对你来说是一个重要的考虑因素，你可能并不在乎用标准的 STL\
  \ 算法换取非标准的 C 函数。有时，使用 STL 最有效的方法是意识到其他方法更为优越。\n\n### Item 36：理解 `copy_if` 的正确实现\n\
  \nSTL 趣味有趣的方面之一是，尽管有 11 个名称中包含“copy”的算法，\n\n点击此处查看代码图像\n\n```\ncopy copy_backward\n\
  replace_copy reverse_copy\nreplace_copy_if unique_copy\nremove_copy rotate_copy\n\
  remove_copy_if partial_sort_copy\nuninitialized_copy\n```\n\n但没有哪一个是 `copy_if`。这意味着你可以\
  \ `replace_copy_if`，可以使用 `remove_copy_if`，可以同时使用 `copy_backward` 和 `reverse_copy`，但如果你只想拷贝范围内满足某个谓词的元素，你只能自为了。\n\
  \n例如，假设你有一个函数来判断 `Widget` 是否有缺陷：\n\n```cpp\nbool isDefective(const Widget& w);\n\
  ```\n\n并且你想将 vector 中所有缺陷的 `Widgets` 写入 `cerr`。如果存在 `copy_if`，你可以简单地这样做：\n\n点击此处查看代码图像\n\
  \n```cpp\nvector<Widget> widgets;\n...\ncopy_if(widgets.begin(), widgets.end(),\
  \ // *这无法编译；\nostream_iterator<Widget>(cerr, \"\\n\"), // *STL 中没有 copy_if*\nisDefective);\
  \ // *在 STL 中*\n```\n\n讽刺的是，`copy_if` 是原始惠尔-惠特 STL 的一部分，它是现在标准 C++ 库中 STL 的基础。在那些偶尔让历史变得有趣的怪癖中，在将\
  \ HP STL 简化为适合标准化的规模的过程中，`copy_if` 是被遗弃在剪辑室的内容之一。\n\n在《C++ 编程语言》[7] 中，Stroustrup\
  \ 提到编写 `copy_if` 是轻而易举的，他是对的，但这并不意味着写出正确的琐事（trivial）也一定容易。例如，这里有一个看起来合理的 `copy_if`：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<Widget> widgets;\n...\ncopy_if(widgets.begin(), widgets.end(),\
  \ // *这无法编译；*\nostream_iterator<Widget>(cerr, \"\\n\"), // *STL 中没有 copy_if*\nisDefective);\
  \ // *在 STL 中*\n```\n\n等等，提供的文本逻辑流上有些重复。让我们重新对齐叙述流：\n\n在《C++ 编程语言》[7] 中，Stroustrup\
  \ 提到编写 `copy_if` 是轻而易举的，他是对的，但这并不意味着写出正确的琐事也一定容易。例如，这里有一个看起来合理的 `copy_if`：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename InputIterator,\ntypename OutputIterator,\ntypename Predicate>\n\
  OutputIterator copy_if(InputIterator begin,\nInputIterator end,\nOutputIterator\
  \ destBegin,\nPredicate p)\n{\n    while (begin != end) {\n        if (p(*begin))\
  \ *destBegin++ = *begin;\n        ++begin;\n    }\n    return destBegin;\n}\n```\n\
  （注：此处根据示例要求，对原文中重复的逻辑进行了整合处理，确保译文文贯流畅。）\n\n在《C++ 编程语言》[7] 中，Stroustrup 提到编写 `copy_if`\
  \ 是轻而易举的，他是对的，但这并不意味着写出正确的琐事也一定容易。例如，这里有一个看起来合理的 `copy_if`：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename InputIterator,\ntypename OutputIterator,\ntypename Predicate>\n\
  OutputIterator copy_if(InputIterator begin,\nInputIterator end,\nOutputIterator\
  \ destBegin,\nPredicate p)\n{\n    while (begin != end) {\n        if (p(*begin))\
  \ *destBegin++ = *begin;\n        ++begin;\n    }\n    return destBegin;\n}\n```\n\
  \n考虑到 `copy_if` 是多有用，加上 STL 程序员倾向于期望它存在的这一事实，有理由将 `copy_if`——正确的那一个——放入你的本地 STL\
  \ 相关工具库并在并在的地方使用它。\n\n### Item 37：使用 `accumulate` 或 `for_each` 总结范围\n\n有时你需要将整个范围浓缩为单个数字，或者更广泛地说，一个对象。对于常用的信息，存在特殊用途算法来完成这项工作。例如，`count`\
  \ 告诉你范围内有多少个特定值的元素，而 `count_if` 告诉你有多少元素满足谓词。范围内的最小值和最大值可以通过 `min_element` 和 `max_element`\
  \ 获取。\n\n\n\n然而，有时你需要以某种自定义的方式对一个范围进行总结，在这种情况下，你需要比 `count`、`count_if`、`min_element`\
  \ 或 `max_element` 更灵活的工具。例如，你可能想要容器中字符串长度之和。你可能想要一组数字的乘积。你可能想要一组点的平均坐标。在这些每一种情况下，你都需要*总结*一个范围，但你需要能够定义你想要的总结结果。这并不是问题，STL\
  \ 已经为你准备好了算法。它被称为 `accumulate`。你可能并不熟悉 `accumulate`，因为与大多数算法不同，它并不在 `<algorithm>`\
  \ 头文件中。相反，它位于 `<numeric>` 中，与另外三个“数值算法”在一起。（另外三个是 `inner_product`、`adjacent_difference`\
  \ 和 `partial_sum`。）\n\n和许多算法一样，`accumulate` 以两种形式存在。接受迭代器和一个初始值的形式会返回初始值加上迭代器所界定的范围内值之和：\n\
  \n点击此处查看代码图片\n\n```\nlist<double> ld; // 创建一个列表并放入\n\n... // 一些 doubles \n\ndouble\
  \ sum = accumulate(ld.begin(), ld.end(), 0.0); // 计算它们的和，\n\n// 从 0.0 开始\n```\n\n\
  在这个示例中，注意初始值被指定为 `0.0` 而不是简单的 `0`。这很重要。`0.0` 的类型是 `double`，因此 `accumulate` 在内部使用一个类型为\
  \ `double` 的变量来存储它正在计算的和。如果调用写成这样：\n\n点击此处查看代码图片\n\n```\ndouble sum = accumulate(ld.begin(),\
  \ ld.end(), 0 ); // 计算它们的和，\n\n// 从 0 开始；*这*\n\n// 是不正确的！\n```\n\n初始值将是 `int 0`，因此\
  \ `accumulate` 在内部将使用一个 `int` 来存储它正在计算的值。那个 `int` 最终将成为 `accumulate` 的返回值，并用于初始化变量\
  \ `sum`。代码可以编译并运行，但 `sum` 的值将是错误的。它含有的不是一个 `double` 列表的真实和，而是将所有 `double` 相加的结果，但在每次相加后都将结果转换为\
  \ `int`。\n\n`accumulate` 只需要输入迭代器，因此你即使配合 `istream_iterator` 和 `istreambuf_iterator`\
  \ 可以使用它（参见 Item 29）：\n\n点击此处查看代码图片\n\n```\ncout << \"The sum of the ints on the\
  \ standard input is \" // 打印标准输入中 ints 的\n\n<< accumulate(istream_iterator<int>(cin),\
  \ // cin 中的 ints\n\nistream_iterator<int>(),\n\n0);\n```\n\n正是 `accumulate` 的这种默认行为导致它被标记为数值算法。但当\
  \ `accumulate` 以另一种形式使用（即接受一个初始总结值和一个任意总结函数的形式）时，它就变得通用得多。\n\n作为一个例子，考虑如何使用 `accumulate`\
  \ 计算容器中字符串长度之和。为了计算这个和，`accumulate` 需要知道两件事。首先，如上所述，它必须知道起始和。在我们的例子中，它是零。其次，它必须知道在每次看到新字符串时如何更新这个和。为了做到这一点，我们编写一个函数，接受目前为止的和和新字符串并返回更新后的和：\n\
  \n点击此处查看代码图片\n\n```\nstring::size_type // 信息见下文\n\nstringLengthSum(string::size_type\
  \ sumSoFar, // 在 string::size_type 上\n\nconst string& s)\n\n{\n\nreturn sumSoFar\
  \ + s.size();\n}\n```\n\n该函数的体揭示了正在发生的事情是非常浅显的，但你可能会发现自己被 `string::size_type` 的表象所困住。不要让那样的发生。每个标准\
  \ STL 容器都有一个名为 `size_type` 的类型定义，它是容器用于计数事物的类型。例如，这就是容器的 `size` 函数返回的类型。对于所有标准容器，`size_type`\
  \ 必须是 `size_t`，但在理论上，非标准的 STL 兼容容器可能会使用不同的类型作为 `size_type`（尽管我很难想象它们为什么想这样做）。对于标准容器，你可以将\
  \ `Container::size_type` 视为编写 `size_t` 的一种高级写法。\n\n`stringLengthSum` 是 `accumulate`\
  \ 所处理的总结函数的代表性。它接受目前为止范围的总结值以及范围的下一个元素，并返回新的总结值。通常情况下，这意味着函数将接受不同类型的参数。这正是它所做的。目前为止的总结（已看到的字符串长度之和）类型为\
  \ `string::size_type`，而正在检查的元素类型是 `string`。正如通常一样，这里的返回类型与第一个参数的类型相同。我们可以这样配合 `accumulate`\
  \ 使用 `stringLengthSum`：\n\n点击此处查看代码图片\n\n```\nset<string> ss; // 创建字符串容器，\n\n...\n\
  \nstring::size_type lengthSum = // 设置 lengthSum\n\naccumulate(ss.begin(), ss.end(),\
  \ // 对于 ss 的\n\nstatic_cast<string::size_type>(0), stringLengthSum);\n```\n\n很巧妙对吧？计算一组数字的乘积甚至更容易，因为我们使用了标准的\
  \ `multipl` 仿函数。这里唯一的棘手之处在于记得使用一个（作为 `float`，而不是 `int`！）作为初始值。如果我们使用零作为起始值，结果将始终为零，因为零乘以任何数都是零，对吧？\n\
  \n我们的最后一个例子稍微有点雄勃。它涉及到找到一组点的平均值，其中点看起来像这样：\n\n点击此处查看代码图片\n\n```\nstruct Point {\n\
  \nPoint(double initX, double initY): x(initX), y(initY) {}\n\ndouble x, y;\n\n};\n\
  ```\n\n总结函数将是一个名为 `PointAverage` 的对象，但在查看 `PointAverage` 之前，让我们看看它在 `accumulate`\
  \ 中的用法：\n\n点击此处查看代码图片\n\n```\nlist<Point> lp; // 创建点列表\n\n...\n\nPoint avg = //\
  \ 平均 lp 中的点\n\naccumulate(lp.begin(), lp.end(),\n\nPoint(0, 0), PointAverage());\n\
  ```\n\n简单直接，正如我们喜欢的那样。在这种情况下，初始总结值是一个位于原点的 `Point` 对象，我们只需要记住在计算范围的平均值时不要考虑该点。\n\
  \n`PointAverage` 通过跟踪它看到的点的数量，以及它们的 `x` 和 `y` 分量的和来工作。每当它被调用时，都会更新这些值并返回到为止点的平均坐标。由于它为范围内的每个点被调用一次，它将\
  \ `x` 和 `y` 的和除以范围内的点数；传递给 `accumulate` 的初始值被忽略了，它应该是这样的：\n\n点击此处查看代码图片\n\n```\n\
  class PointAverage: public binary_function<Point, Point, Point> { // 参见 Item 40\n\
  \npublic:\n\nPointAverage(): numPoints(0), xSum(0), ySum(0) {}\n\nconst Point operator()(const\
  \ Point& avgSoFar, const Point& p)\n\n{\n\n++numPoints;\n\nxSum += p.x;\n\nySum\
  \ += p.y;\n\nreturn Point(xSum/numPoints, ySum/numPoints);\n}\n\nprivate:\n\nsize_t\
  \ numPoints;\n\ndouble xSum;\n\ndouble ySum;\n\n};\n```\n\n\n\n这种写法运行良好，而且仅仅是因为我有时会和一群极度疯狂的人打交道（其中许多人就在标准化委员会中），我才能预见到\
  \ STL 实现在何种情况下可能会失败。尽管如此，`PointAverage` 违反了标准中 `26.4.1` 节第 2 段的规定，正如你可能记得的那样，该规定禁止传递给\
  \ `accumulate` 的函数产生副作用。对成员变量 `numPoints`、`xSum` 和 `ySum` 的修改构成了副作用，因此，从技术上来说，我刚刚向你展示的代码产生的是未定义的结果。在实践中，很难想象它会无法运行，但当我写这些文字时，我周围环绕着一群咄咄逼人的法律专家，所以我不得不对这件事的细则说明得清清楚楚。\n\
  \n没关系，因为这给了我一个提到 `for_each` 的机会，它是另一个可以用于汇总范围的算法，而且它不受 `accumulate` 所受限限制的约束。与 `accumulate`\
  \ 一样，`for_each` 接受一个范围和一个函数（通常是函数对象），并在范围内的每个元素上调用该函数，但传递给 `for_each` 的函数只接收单个参数（当前范围元素），并且\
  \ `for_each` 在完成后会返回它的函数。（实际上，它返回的是该函数的*拷贝*——参见 Item 38 ）。重要的是，传递给 `for_each`（以及稍后返回的）函数*可能*具有副作用。\n\
  \n忽略副作用问题，`for_each` 与 `accumulate` 主要在两个方面不同。首先，`accumulate` 的名字暗示该算法会产生范围的汇总。`for_each`\
  \ 听起来像是是你只是想对范围内的每个元素做些什么，当然，这正是该算法的主要应用。使用 `for_each` 来汇总范围是合法的，但它没有 `accumulate`\
  \ 那么清晰。\n\n其次，`accumulate` 直接返回我们想要的汇总结果，而 `for_each` 返回一个函数对象，我们必须从这个对象中提取出我们需要的汇总信息。在\
  \ C++ 术语中，这意味着我们必须为仿函数类添加一个成员函数，以便我们获取所追求的汇总信息。\n\n这里是最后一个示例，这次使用 `for_each` 代替\
  \ `accumulate`：\n\n点击此处查看代码图像\n\n```cpp\nstruct Point { ... }; // 同前文\n\nclass PointAverage:\n\
  \npublic unary _function<Point, void > { // 参见 Item 40\n\npublic:\n\n    PointAverage():\
  \ numPoints(0), xSum(0), ySum(0) {}\n\n    void operator()(const Point& p )\n  \
  \  {\n        ++numPoints;\n        xSum += p.x;\n        ySum += p.y;\n    }\n\n\
  \    Point result() const\n    {\n        return Point(xSum/numPoints, ySum/numPoints);\n\
  \    }\n\nprivate:\n\n    size_t numPoints;\n    double xSum;\n    double ySum;\n\
  };\n\nlist<Point> lp;\n\n...\n\nPoint avg = for_each (lp.begin(), lp.end(), PointAverage()).result()\
  \ ;\n```\n\n从个人而言，我更喜欢用 `accumulate` 进行汇总，因为我认为它最清晰地表达了发生了什么，但 `for_each` 也可以，而且副作用问题并不像困扰\
  \ `accumulate` 那样困扰 `for_each`。这两个算法都可以汇总范围。使用最适合你的那一个。\n\n你可能会奇怪，为什么 `for_each`\
  \ 的函数参数允许有副作用，而 `accumulate` 的却不允许。这是一个深刻的问题，直击 STL 的核心。遗憾的是，亲爱的读者，有些谜团注定要留在我们的认知范围之外。`accumulate`\
  \ 和 `for_each` 之间的差异是什么？我还没有听过任何令人信的解释。\n\n## 第 6 章 仿函数、仿函数类、函数等\n\n无论你喜不不喜欢，函数和类函数对象——*仿函数*——贯穿于\
  \ STL 之中。关联容器使用它们来保持元素的顺序，某些算法（例如 `find_if`）使用它们来控制行为，另一些算法（例如 `for_each` 和 `transform`）没有它们就毫无意义，而像\
  \ `not1` 和 `bind2nd` 这样的适配器则积极地产生它们。\n\n是的，在 STL 的任何何处看，你都能看到仿函数和仿函数类。包括在你的源代码中。如果你不知道如何编写良好的仿函数，就不可能有效利用\
  \ STL。既然如此，本章的大部分内容都致力于解释如何让你的仿函数按照 STL 预期的方式运行。然而，有一个章节关注的是不同的主题，这个主题一定能吸引那些好奇为什么要在代码中充斥\
  \ `ptr_fun`、`mem_fun` 和 `mem_fun_ref` 的人。如果你喜欢，可以从那个条目（Item 41）开始，但请不要停于此。一旦你理解了这些函数，你还需要后续章节中的信息，以确保你的仿函数能够与它们以及\
  \ STL 的其他部分正常工作。\n\n### Item 38: 为值传递设计仿函数类\n\nC 语言和 C++ 都不允许将函数作为参数传递。相反，你必须传递函数指针。例如，这是标准库\
  \ `qsort` 的声明：\n\n```cpp\nvoid qsort(void *base, size_t nmemb, size_t size, int\
  \ (*cmpfcn)(const void*, const void*);\n```\n\nItem 46 解释了为什么 `sort` 算法通常比 `qsort`\
  \ 函数更好，但这不是问题所在。问题在于 `qsort` 的参数 `cmpfcn`（一个函数指针）是从调用处拷贝（即按值传递）的。这代表了 C 和 C++ 遵循的规则，即函数指针按值传递。\n\
  \nSTL 仿函数是模拟函数指针的，因此 STL 的约定是，函数对象在传递给函数时也是按值传递（即拷贝）。这通过标准对 `for_each` 的声明得到了最好的证明，该算法既按值接受又返回一个函数对象：\n\
  \n```cpp\ntemplate<class InputIterator, class Function>\nFunction for_each(InputIterator\
  \ first, InputIterator last, Function f);\n```\n\n事实上，值传递的情况并非如此无不可击，因为 `for_each`\
  \ 的调用者可以在调用点显式指定参数类型。例如，以下代码将导致 `for_each` 按引用传递并返回其仿函数：\n\n```cpp\nclass DoSomething:\
  \ public unary_function<int, void> {\npublic:\n    void operator()(int x) { ...\
  \ }\n...\n};\n\ntypedef deque<int>::iterator DequeIntIter;\ndeque<int> di;\n...\n\
  DoSomething d;\n...\nfor_each<DequeIntIter, DoSomething&>(di.begin(), di.end(),\
  \ d);\n```\n\n然而，STL 的用户几乎从不这样做，而且某些 STL 算法的某些实现如果仿函数按引用传递，将无法编译。在本条目的剩余部分中，我将假设仿对象总是按值传递的。在实践中，这几乎总是如此。\n\
  \n\n\n由于函数对象是通过值传递和返回的，因此你有责任确保你的函数对象在以这种方式传递（即被复制）时表现良好。这意味着了两点：首先，你的函数对象需要很小。否则，拷贝它们的开销将变得太大。其次，你的函数对象必须是\
  \ `monomorphic`（单态的，即非多态的）——它们绝不能使用虚函数。这是因为按值传递给基类类型参数的派生类对象会遭受“切片问题”（slicing problem）：在在复制过程中，它们的派生部分会被移除。（关于切片问题如何影响你对\
  \ STL 使用的另一个示例，请参阅 Item 3。）\n\n当然，效率非常重要，避免切片问题也同样重要，但并不是所有的仿函数都是小的，也不是所有的都是单态的。函数对象优于普通函数的优势之一是，仿函数可以包含你需要的任何状态。某些函数对象天生就是庞大的，因此能够像传递那些“消瘦型”副本一样轻松地将此类仿函数传递给\
  \ STL 算法是非常重要的。\n\n禁止多态仿函数同样是不现实的。C++ 支持继承层次结构和动态绑定，这些特性在设计仿函数类时的用途与其他任何地方一样有用。没有继承的仿函数类就像是……嗯，就像没有了“++”的\
  \ C++。肯定有一种方法让函数对象既是大的和/或多态的，同时仍允许它们与 STL 中盛行的“按值传递仿函数”的约定兼容。\n\n这是有的。将你想放入仿函数类的数据和/或多态性移动到另一个不同的类中。然后给你的仿函数类提供一个指向这个新类的指针。例如，如果你想创建一个包含大量数据的多态仿函数类，\n\
  \n点击此处查看代码\n\n```\ntemplate<typename T>\nclass BPFC: // BPFC = \"大多态仿函数类\"\npublic\
  \ unary_function<T, void> { // Item 40 解释了这一点\n// base class\nprivate:\n    Widget\
  \ w; // 此类包含大量数据，\n    int x; // 所以按值传递效率很低\n... // to pass it by value\npublic:\n\
  \    virtual void operator()(const T& val) const; // 这是一个虚函数，\n... // 所以切片会很\n};\n\
  ```\n\n创建一个小的、单态类，它包含一个指向实现类的指针，并将所有数据和虚函数放在实现类中：\n\n点击此处查看代码\n\n```\ntemplate<typename\
  \ T> // 新实现类\nclass BPFCImpl: // 用于修改后的 BPFC\npublic unary_function<T, void> {\n\
  private:\n    Widget w; // 原本在 BPFC 中的所有数据\n    int x; // 现在都在这里\n...\n    virtual\
  \ ~BPFCImpl(); // 多态类需要虚析构函数\n    virtual void operator()(const T& val) const;\n\
  \    friend class BPFC<T>; // 让 BPFC 访问这些数据\n};\n\ntemplate<typename T>\nclass BPFC:\
  \ // 小的、单态版本的 BPFC\npublic unary_function<T, void> {\nprivate:\n    BPFCImpl<T>\
  \ *pImpl; // 这是 BPFC 的唯一数据\npublic:\n    void operator()(const T& val) const //\
  \ 现在是非虚的；\n    { // 它将转发给 BPFCImpl\n        pImpl->operator()(val);\n    }\n...\n\
  };\n```\n\n`BPFC::operator()` 的实现示例说明了所有 `BPFC` 虚函数是如何实现的：它们调用了 `BPFCImpl` 中真正虚的对应项。结果是一个仿函数类（`BPFC`），它既小又是单态的，但可以访问大量状态并以多态方式运行。\n\
  \n我在这里略过了许多细节，因为我勾勒出的基本技术在 C++ 圈内广为人知的。《*Effective C++》在 Item 34 中讨论了它。在 Gamma *et\
  \ al.* 编写的《Design Patterns》 [[6 ] 中，这被称为“桥接模式”。Sutter 在他的《Exceptional C++》中将其称为“Pimpl\
  \ 惯用法” [8 ]。\n\n从 STL 的角度来看，需要记住的主要点是，使用这种技术的仿函数类必须以合理的方式支持拷贝。如果你是上面 `BPFC` 的作者，你必须确保它的拷贝构造函数对它指向的\
  \ `BPFCImpl` 对象采取了合理的操作。也许最简单的方法是对进行引用计数，使用类似 Boost 的 `shared_ptr` 的工具，你可以在 Item\
  \ 50 中读到关于它的内容。\n\n事实上，对于本节而言，你*唯一*需要担心的是 `BPFC` 拷贝构造函数的行为，因为函数对象在传递给 STL 函数或从 STL\
  \ 函数返回时，总是会被复制的——记住吗？是按值传递。这意味着两点：让它们变小，让它们保持单态。\n\n### Item 39: 使谓词成为纯函数\n\n我不想对你们这样做，但我们必须从一段简短的词汇开始。\n\
  \n-   *谓词*（predicate）是一个返回 `bool`（或可以转换为 `bool` 的类型）的函数。谓词在 STL 中被广泛使用。要概述排序算法，请参阅\
  \ Item 31 。\n-   *纯函数*（pure function）是一个其返回值仅取决于其参数的函数。在 C++ 中，纯函数查询的所有数据要么是传入的，要么在函数的生命周期内是常量。如果一个纯函数查询了在调用之间可能会变化的数据，那么使用不同的参数调用函数可能会产生不同的结果，这将违背纯函数的定义。\n\
  -   *谓词类*（predicate class）是一种仿函数类，其 `operator()` 函数是一个谓词，即它的 `operator()` 返回 `true`\
  \ 或 `false`（或可以转换为 `true` 或 `false` 的类型）。正如你预期的，在 STL 任何需要谓词的地方，它都会接受真实的谓词或谓词类对象。\n\
  \n这些应该足够清楚“使谓词成为纯函数”意味着什么。我需要做的就是说服你这个建议是有据可的。为了理解为什么这样做，假设你违反了这一约束。考虑以下（设计不当的）谓词类。无论传递什么参数，它恰好只返回\
  \ `true` 一次：即被调用第三次时。其余时间它返回 `false` 。\n\n```\nclass BadPredicate: // 信息请参阅 Item\
  \ 40\npublic unary_function<Widget, bool> {\npublic:\n    BadPredicate(): timesCalled(0)\
  \ {} // 将 timesCalled 初始化为 0\n    bool operator()(const Widget&)\n    {\n      \
  \  return ++timesCalled == 3;\n    }\nprivate:\n    size_t timesCalled;\n};\n```\n\
  \n假设我们使用这个类从 `vector<Widget>` 中删除第三个 `Widget`：\n\n\n\n\n\n点击此处查看代码图片\n\n```cpp\n\
  vector<Widget> vw; // create vector and put some\n\n... // Widgets into it\n\nvw.erase(remove_if(vw.begin(),\
  \ // eliminate the third Widget;\n\nvw.end(), // see Item 32 for info on how\n\n\
  BadPredicate()) , // erase and remove_if relate\n\nvw.end());\n```\n\n这段代码看起来相当合合理，但在许多\
  \ STL 实现中，它不仅会删除 `vw` 中的第三个元素，还会删除第六个元素！\n\n为了理解为什么会发生这种情况，查看 `remove_if` 通常是如何实现的将很有帮助。请记住，`remove_if`\
  \ 并不*必须*以这种方式实现。\n\n点击此处查看代码图片\n\n```cpp\ntemplate <typename FwdIterator, typename\
  \ Predicate>\n\nFwdIterator remove_if(FwdIterator begin, FwdIterator end, Predicate\
  \ p )\n\n{\n\nbegin = find_if(begin, end, p );\n\nif (begin == end) return begin;\n\
  \nelse {\n\nFwdIterator next = begin;\n\nreturn remove_copy_if(++next, end, begin,\
  \ p );\n\n}\n\n}\n```\n\n这段代码的细节并不重要，但请注意谓词 `p` 首先被传递给 `find_if`，稍后又传递给 `remove_copy_if`。在两种情况下，`p`\
  \ 都是按值传递——即被*拷贝*到这些算法中。（从技术上讲，这并不一定如此，但在实践中，它*确实如此*。详情请参阅 Item 38 。）\n\n对 `remove_if`\
  \ 的初始调用（客户端代码中想要删除 `vw` 中第三个元素的那个调用）创建了一个匿名的 `BadPredicate` 对象，其内部成员 `timesCalled`\
  \ 被设置为零。该对象（在 `remove_if` 内部被称为 `p`）随后被拷贝到 `find_if`，因此 `find_if` 也接收到了 `timesCalled`\
  \ 值为 0 的 `BadPredicate` 对象。`find_if` “调用”该对象直到它返回 `true`，因此它调用了三次。`find_if` 然后将控制权返回给\
  \ `remove_if`。`remove_if` 继续执行并最终调用 `remove_copy_if`，将 `p` 的另一个拷贝作为谓词传递。但 `p` 的\
  \ `timesCalled` 成员仍然是 0！`find_if` 从未调用过 `p`，它调用的只是 `p` 的*拷贝*。结果 `remove_copy_if`\
  \ 第三次调用其谓词时，它也会返回 `true`。这就是为什么 `remove_if` 最终会从 `vw` 中删除两个 Widget 而不是仅仅一个。\n\n\
  防止自己掉入这个语言陷阱的最简单方法是在谓词类中将你的 `operator()` 函数声明为 `const`。如果你这样做，编译器将不会允许你修改任何类数据成员：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass BadPredicate:\n\npublic unary_function<Widget, bool>\
  \ {\n\npublic:\nbool operator()(const Widget&) const\n\n{\n\nreturn ++timesCalled\
  \ == 3; // error! can't change local data\n\n} // in a const member function\n\n\
  ...\n\n};\n```\n\n由于这是防止我们刚刚检查的问题的一种非常直接的方法，我几乎将本条命名为“在谓词类中使 `operator() const`”。但这样做还不够。即使是\
  \ `const` 成员函数也可以访问 `mutable` 数据成员、非 `const` 本地 `static` 对象、非 `const` 类 `static`\
  \ 对象、命名空间作用域下的非 `const` 对象以及非 `const` 全局对象。设计良好的谓词类确保其 `operator()` 函数也不依赖于这些类型的对象。在谓词类中声明\
  \ `operator() const` 对于正确行为是*必要*的，但它并不是*充分*的。一个良好的 `operator()` 确实是 `const`，但不仅如此。它还是一个纯函数。\n\
  \n在本条的前面，我提到在任何 STL 期望谓词函数的地方，它都会接受真实函数或谓词类对象。这两个方向上都是如此。在任何 STL 接受谓词类对象的地方，谓词函数（可能被\
  \ `ptr_fun` 修改过——参阅 Item 41 ）也同样受到欢迎。我们现在理解谓词类中的 `operator()` 函数应该是纯函数，因此这个限制也扩展到了谓词函数。这个函数和从\
  \ `BadPredicate` 类生成的对象一样是一个糟糕的谓词：\n\n点击此处查看代码图片\n\n```cpp\nbool anotherBadPredicate(const\
  \ Widget&, const Widget&)\n\n{\n\nstatic int timesCalled = 0; // No! No! No! No!\
  \ No! No! No!\n\nreturn ++timesCalled == 3; // Predicates should be pure functions,\n\
  \n} // and pure functions have no state\n```\n\n无论你如何编写谓词，它们都应该始终是纯函数。\n\n### Item\
  \ 40: 使函数器类具有可适应性\n\n假设我有一个 `Widget*` 列表，以及一个函数来判断这样的指针是否有趣：\n\n```cpp\nlist<Widget*>\
  \ ptrs;\nbool isInteresting(const Widget&);\n```\n\n如果我想找到列表中第一个指向有趣的指针，这很容易：\n\n\
  ```cpp\nlist<Widget*>::iterator i = find_if(ptrs.begin(), ptrs.end(), isInteresting);\n\
  ```\n\nif (i != ptrs.end()) { ... }\n\n然而，如果我想找到第一个*不*有趣的指针，显而易的方法无法编译：\n\n```cpp\n\
  list<Widget*>::iterator i = find_if(ptrs.begin(), ptrs.end(), not1(isInteresting));\n\
  ```\n\n相反，我必须在应用 `not1` 之前对 `isInteresting` 应用 `ptr_fun`：\n\n```cpp\nlist<Widget*>::iterator\
  \ i = find_if(ptrs.begin(), ptrs.end(), not1(ptr_fun(isInteresting)));\n``` （等待，逻辑是：）\n\
  \n这导致了一些问题。*为什么*我必须在应用 `not1` 之前对 `isInteresting` 应用 `ptr_fun`？`ptr_fun` 为我做了什么，它又是让上面的代码工作的？\n\
  \n答案有些令人惊讶。`ptr_fun` 所做的仅仅是让某些类型定义可用。仅此而已。这些类型定义是 `not1` 要求的，这就是为什么对 `ptr_fun` 应用\
  \ `not1` 是有效的，但对 `isInteresting` 应用 `not1` 则不行。作为一个低级函数指针，`isInteresting` 缺乏这些类型定义。\n\
  \n`not1` 不是 STL 中唯一提出要求的组件。四个函数适配器（`not1`、`not2`、`bind1st` 和 `bind2nd` ）都需要某些类型定义，其他编写的非标准\
  \ 适配器也是如此（例如来自 SGI 和 Boost 的——参阅 Item 50 ）。提供必要的类型定义的函数对象被称为*可适应的*，而缺乏这些类型定义的函数对象则不可适应。可适应的函数对象可以在不可适应的函数对象更多的上下文中使用，因此尽可能让你的函数对象具有可适应性。这不需要付出任何代价，但可以为你的函数类的客户端带来巨大的便利。\n\
  \n我知道，我知道，我一直在故弄玄虚，不断提到“某些类型定义”而不告诉你们是什么。所这些类型定义是 `argument_type`、`first_argument_type`、`second_argument_type`\
  \ 和 `result_type`，但事实并非那么简单，因为不同类型的函数类被预期提供这些名称的不同子集。坦诚地说，除非你正在编写自己的适配器（这是一个书中未涵盖的话题），否则你不需要了解任何这些类型定义。这是因为提供这些定义的传统方法是自一个基类，或者更准确地说，一个基结构体。对于\
  \ `operator()` 接收一个参数的函数类，继承的结构体是 `std::unary_function` 。对于 `operator()` 接收两个参数的函数类，继承的结构体是\
  \ `std::binary_function` 。\n\n\n\n\n嗯，某种程度上是。`unary_function` 和 `binary_function`\
  \ 是模板，因此你不能直接继承它们。相反，你必须继承自它们生成的结构体，这要求你指定一些类型参数。对于 `unary_function`，你必须指定泛函数类中\
  \ `operator()` 接受的参数类型，以及它的返回类型。对于 `binary_function`，你需要指定三个类型：你的 `operator()` 的第一个和第二个参数的类型，以及\
  \ `operator()` 的返回类型。\n\n这里有两个示例：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\
  class MeetsThreshold: public std::unary_function<Widget, bool> {\nprivate:\n   \
  \ const T threshold;\npublic:\n    MeetsThreshold(const T& threshold);\n    bool\
  \ operator()(const Widget&) const;\n    ...\n};\n\nstruct WidgetNameCompare: public\
  \ std::binary_function<Widget, Widget, bool> {\n    bool operator()(const Widget&\
  \ lhs, const Widget& rhs) const;\n};\n```\n\n在这两种情况下，请注意传递给 `unary_function` 或 `binary_function`\
  \ 的类型与泛函数类 `operator()` 接受和返回的类型是相同的，尽管 `operator()` 的返回类型作为最后一个参数传递给 `unary_function`\
  \ 或 `binary_function` 这一点有点奇怪。\n\n你可能已经注意到 `MeetsThreshold` 是一个类，而 `WidgetNameCompare`\
  \ 是一个结构体。`MeetsThreshold` 有内部状态（它的 `threshold` 数据成员），而类是封装此类信息的逻辑方式。`WidgetNameCompare`\
  \ 没有状态，因此没有必要将任何内容设为私有。那些所有内容都是公开的泛函数类的作者通常声明结构体而不是类，可能没有其他原因，仅仅是为了避免在基类和 `operator()`\
  \ 函数前面输入“`public ””。将此类泛函数声明为类还是结构体完全完全取决于个人风格。如果你仍在完善自己的个人风格并想效仿专业人士，请注意，STL 内部的无状态泛函数类（例如\
  \ `less<T>`、`plus<T>` 等）通常被写成结构体。\n\n再次查看 `WidgetNameCompare`：\n\n点击此处查看代码图像\n\n\
  ```cpp\nstruct WidgetNameCompare:\npublic std::binary_function<Widget , Widget ,\
  \ bool> {\n    bool operator()(const Widget& lhs, const Widget& rhs) const;\n};\n\
  ```\n\n尽管 `operator()` 的参数类型是 `const Widget&`，但传递给 `binary_function` 的类型是 `Widget`。通常情况下，传递给\
  \ `unary_function` 或 `binary_function` 的非指针类型会剥离 `const` 和引用。（不要问为什么。这些原因既不是特别好，也不特别有趣。如果你非常想知道，就写一些不剥离它们的程序，然后分析产生的编译器诊断信息。如果这样做之后，你*仍然*对此感兴趣，请访问\
  \ [boost.org](http://boost.org)（查看第 50 条）并查看他们关于调用特征（call traits）和函数对象适配器的工作。）\n\
  \n当 `operator()` 接受指针参数时，规则发生了变化。这里有一个类似于 `WidgetNameCompare` 的结构体，但它与 `Widget*`\
  \ 指针工作：\n\n点击此处查看代码图像\n\n```cpp\nstruct PtrWidgetNameCompare:\npublic std::binary_function<const\
  \ Widget* , const Widget* , bool> {\n    bool operator()(const Widget* lhs, const\
  \ Widget* rhs) const;\n};\n```\n\n在这里，传递给 `binary_function` 的类型与 `operator()` 接受的类型*相同*。对于接受或返回指针的泛函数类，通用规则是向\
  \ `unary_function` 或 `binary_function` 传递 `operator()` 接受或返回的任何类型。\n\n不要忘记所有 `unary_function`\
  \ 和 `binary_function` 基类胡言乱语的根本原因。这些类提供了函数对象适配器所需的类型定义（typedefs），因此继承这些类可以产生可适配的函数对象。这让我们能够执行诸这样的操作：\n\
  \n点击此处查看代码图像\n\n```cpp\nlist<Widget> widgets;\n...\nlist<Widget>::reverse_iterator\
  \ i1 = // 找到最后一个 widget\nfind_if(widgets.rbegin(), widgets.rend(), // 它不满足\nnot1(\
  \ MeetsThreshold<int>(10)) ); // 10 的阈值\n//（无论那是什么意思）\n\nWidget w( *构造参数* );\nlist<Widget>::iterator\
  \ i2 = // 找到第一个 widget\nfind_if(widgets.begin(), widgets.end(), // 在 w 之前的第一个\n\
  bind2nd( WidgetNameCompare(), w) ); // 由 WidgetNameCompare 定义的// 排序顺序\n```\n\n如果我们没有让泛函数类继承自\
  \ `unary_function` 或 `binary_function`，这两个示例都将无法编译，因为 `not1` 和 `bind2nd` 均仅适用于可适配的函数对象。\n\
  \nSTL 函数对象是基于 C++ 函数进行建模的，而一个 C++ 函数只有一组参数类型和一个返回类型。结果，STL 隐式地假设每个泛函数类只有一个 `operator()`\
  \ 函数，并且只有一组参数和返回类型。\n\n### 第 41 条：理解 `ptr_fun`、`mem_function` 和 `mem_fun_ref` 的原因\n\
  \n这些 `ptr_fun` / `mem_function` / `mem_fun_ref` 到底是怎么回事？有时你必须使用这些函数，有时又不需要，它们到底是做什么的？它们似乎只是呆呆在那里，毫无意义地像不合身的的衣服一样挂在那儿。它们写起来不愉快，读起来很烦，而且难以理解。这些是\
  \ STL 遗留物的其他示例（如第 10 条和第 18 条中描述的那些），还是某些空闲过多且幽默感扭曲的标准委员会成员强加给我们的某种语法笑话？\n\n冷静点。这些名字起得并不好，但\
  \ `ptr_fun`、`mem_function` 和 `mem_fun_ref` 承担着重要的工作。就语法笑玩笑来说，这些函数的主要任务之一是掩盖 C++\
  \ 固有的不一致性。\n\n如果我有一个函数 `f` 和一个对象 `x`，我想在 `x` 上调用 `f`，并且我不在 `x` 的成员函数内部，C++ 为我提供了三种不同的调用语法：\n\
  \n点击此处查看代码图像\n\n```cpp\nf(x); // 语法 #1：当 f 是非函数时\nx.f(); // 语法 #2：当 f 是成员函数时\np->f();\
  \ // 语法 #3：当 f 是成员函数时\n```\n\n现在，假设有一个可以测试 `Widget` 的函数，\n\n点击此处查看代码图像\n\n```cpp\n\
  void test(Widget& w); // 测试 w，如果不通过则标记为“失败”\n\nvector<Widget> vw; // vw 保存 widgets\n\
  ```\n\n为了测试 `vw` 中的每个 `Widget`，我们可以用显而见的方式使用 `for_each`：\n\n```cpp\nfor_each(vw.begin(),\
  \ vw.end(), test); // 调用 #1（编译通过）\n```\n\n\n\n但想象一下，如果 `test` 是 `Widget` 的成员函数而不是非成员函数，也就是说，`Widget`\
  \ 支持自测试：\n\n点击此处查看代码图像\n\n```cpp\nclass Widget {\npublic:\n\n...\n\nvoid test();\
  \ // 执行自测试；将 *this*\n\n... // 如果未通过，则标记为“失败”\n};\n```\n\n在一个理想完美的世界里，我应该也能够使用 `for_each`\
  \ 对 `vw` 中的每个对象调用 `Widget::test`：\n\n点击此处查看代码图像\n\n```cpp\nfor_each(vw.begin(),\
  \ vw.end(),\n&Widget::test); // 调用 #2（* won't compile * 无法编译 *）\n```\n\n事实上，如果世界真的是完美的，我应该也能使用\
  \ `for_each` 对一个包含 `Widget*` 指针的容器调用 `Widget::test`：\n\n点击此处查看代码图像\n\n```cpp\nlist<Widget*>\
  \ lpw; // lpw 保存指向 widgets 的指针\n\nfor_each(lpw.begin(), lpw.end(),\n&Widget::test);\
  \ // 调用 #3（* also won't compile * 同样无法编译 *）\n```\n\n但请看在这个完美的世界里必须发生什么。在调用 #1 的\
  \ `for_each` 函数内部，我们正用一个对象调用非成员函数，因此我们必须使用语法 #1。在调用 #2 的 `for_each` 函数内部，我们必须使用语法\
  \ #2，因为我们既有一个对象又有一个成员函数。而在调用 #3 的 `for_each` 函数内部，我们需要使用语法 #3，因为我们处理的是一个成员函数和一个指向对象的指针。因此，我们需要三个不同版本的\
  \ `for_each`，那这个世界该有多完美呢？\n\n在我们所拥有的世界里，我们只有一个版本的 `for_each`。想象它的实现并不难：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename InputIterator, typename Function>\nFunction for_each(InputIterator\
  \ begin, InputIterator end, Function f)\n{\nwhile (begin != end) f( *begin++) ;\n\
  }\n```\n\n在这里，我强调了 `for_each` 在调用时使用了语法 #1。这是 STL 中的一个通用惯例：函数和函数对象始终使用非成员函数的语法形式进行调用。这解释了为什么调用\
  \ #1 可以编译，而调用 #2 和 #3 不行。这是因为 STL 算法（包括 `for_each`）硬编码了语法 #1，而只有调用 #1 与该语法兼容。\n\n\
  也许现在已经清楚为什么 `mem_fun` 和 `mem_fun_ref` 存在了。它们让成员函数（通常必须使用语法 #2 或 #3 调用）能够使用语法 #1\
  \ 进行调用。\n\n`mem_fun` 和 `mem_fun_ref` 实现此点的方法很简单，尽管如果你看一眼其中一个函数的声明，情况会更清晰。它们本质上是函数模板，并且存在\
  \ `mem_fun` 和 `mem_fun_ref` 模板的多个变体，对应于不同的参数数量以及所适配的成员函数的 `const` 属性（或缺乏该属性）。看到一个声明就足以理解它们是如何组合在一起的：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename R, typename C> // mem_fun 的声明用于\nmem_fun_t<R,C>\
  \ // 非 const 成员函数\nmem_fun (R (C::*pmf)()); // 不接受参数。C 是\n// 类，R 是被指向的成员函数的\n//\
  \ 返回类型\n```\n\n`mem_fun` 接收一个成员函数指针 `pmf`，并返回一个类型为 `mem_fun_t` 的对象。这是一个仿函数类，它持有成员函数指针并提供了一个\
  \ `operator()`，该操作符在传递给 `operator()` 的对象上调用被指向的成员函数。例如，在这段代码中，\n\n点击此处查看代码图像\n\n\
  ```cpp\nlist<Widget*> lpw; // 同上\n...\nfor_each(lpw.begin(), lpw.end(),\nmem_fun(\
  \ &Widget::test) ); // 现在可以编译了\n```\n\n`for_each` 接收一个类型为 `mem_fun_t` 的对象，该对象持有指向\
  \ `Widget::test` 的指针。对于 `lpw` 中的每个 `Widget*` 指针，`for_each` 使用语法 #1 “调用” `mem_fun_t`\
  \ 对象，该对象立即使用语法 #3 在 `Widget*` 指针上调用 `Widget::test`。\n\n总的来说，`mem_fun` 将语法 #3（`Widget::test`\
  \ 与 `Widget*` 指针配合使用所需的）适配为语法 #1（`for_each` 使用的语法）。因此，像 `mem_fun_t` 这样的类被称为函数对象适配器并不奇怪。当你得知与上述完全类似的，`mem_fun_ref`\
  \ 也是这样，这应该让你感到意外。`mem_fun` 和 `mem_fun_ref` 更多的是让 STL 组件可以使用单一语法来调用。它们提供了重要的类型定义，就像\
  \ `ptr_fun` 产生对象一样（`ptr_fun` 产生）。\n\n对于 `ptr_fun` 的一种替代策略是仅在迫迫的情况下使用它。如果你在需要类型定义时省略了它，编译器将拒绝你的代码。\n\
  \n`mem_fun` 和 `mem_fun_ref` 的情况从根本上不同。当你将成员函数传递给 STL 组件时，必须使用它们，因为除了提供类型定义（这可能是必要的）之外，它们还将成员函数的调用语法适配为\
  \ STL 处使用的语法。如果你不使用它们传递成员函数指针，你的代码将无法编译。\n\n剩下的只有成员函数适配器的名称了，在这里，我们终于有了一个真正的 STL\
  \ 遗迹。当这些适配器的需求首次变得明显时，编写 STL 的人员关注的是指针容器。（考虑到 Item 7、20 和 33 中描述的此类容器的缺点，这可能令人惊讶，但请记住指针容器支持多态。）他们需要一个成员函数的适配器，因此选择了\
  \ `mem_fun`。后来他们才发现对象容器需要不同的适配器，于是就凑出了 `mem_fun_ref` 这个名字。不，这并不优雅，但这种事确实会发生。\n\n\
  ### Item 42：确保 `less<T>` 意味着 `operator<`\n\n正如所有熟悉 `Widget` 的人们所知，`Widget` 有重量和最大速度：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Widget {\npublic:\n\n...\n```\n\n\n\n\n```cpp\nsize_t\
  \ weight() const;\n\nsize_t maxSpeed() const;\n\n...\n\n};\n```\n\n众所周知的是，`Widget`\
  \ 的自然排序方式是按重量。`Widget` 的 `operator<` 也反映了这一点：\n\n点击此处查看代码图像\n\n```cpp\nbool operator<(const\
  \ Widget& lhs, const Widget& rhs)\n{\n    return lhs.weight() < rhs.weight();\n\
  }\n```\n\n但假设我们想创建一个 `multiset<Widget>`，其中 `Widget` 按最大速度排序。我们知道 `multiset<Widget>`\
  \ 的默认比较函数是 `less<Widget>`，并且知道 `less<Widget>` 默认是通过调用 `Widget` 的 `operator<` 来执行工作的。既然如此，要获得一个按最大速度排序的\
  \ `multiset<Widget>`，一种显然的方法是通过特化 `less<Widget>` 来断开 `less<Widget>` 与 `operator<`\
  \ 之间的联系，使其只查看 `Widget` 的最大速度：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<> // 这是一个特化\nstruct\
  \ std::less<Widget>: // 针对 Widget 的 std::less;\npublic // 这也是一个非常糟糕的主意\nstd::binary_function<Widget,\n\
  Widget, // 详情请参见 Item 40\nbool> { // 在此基类上\nbool operator()(const Widget& lhs, const\
  \ Widget& rhs) const\n{\n    return lhs.maxSpeed() < rhs.maxSpeed();\n}\n};\n```\n\
  \n这看起来既不明智，也确实不明智，但它可能并非你所认为的原因之所以不明智。它竟然能通过编译这让你感到惊讶吗？许多程序员指出，上述不仅仅是一个模板的特化，它还是\
  \ `std` 命名空间中模板的特化。“`std` 不应该是神圣的，仅供库实现者保留且是普通程序员无法触及的吗？”他们问道。“编译器不应该拒绝这种篡改 C++\
  \ 不朽者运行机制的尝试吗？”\n\n作为一个一般原则，尝试修改 `std` 中的组件确实是被禁止的（而且这样做通常会将你带入未定义行为领域），但在某些情况下，允许进行小改。具体来说，允许程序员为用户定义的类型特化\
  \ `std` 中的模板。几乎在情况下，都有优于特化 `std` 模板的替代方案，但在少数情况下，这是合理的做法。例如，智能指针类的作者通常希望他们的类在排序时表现得像内置指针，因此看到针对智能指针类型的\
  \ `std::less` 特化并不稀奇。例如，以下内容就是 Boost 库中 `shared_ptr` 的一部分，这是一种你可以在 Item 7 和 50 中阅读介绍的智能指针：\n\
  \n点击此处查看代码图像\n\n```cpp\nnamespace std {\ntemplate<typename T> // 这是对 std::less 的特化\n\
  struct less< boost::shared_ptr<T> >: // 针对 boost::shared_ptr<T>\npublic // (boost\
  \ 是一个命名空间)\nbinary_function<boost::shared_ptr<T>,\nboost::shared_ptr<T>, // 这是常规的\n\
  bool> { // 基类（参见 Item 40 ）\nbool operator()(const boost::shared_ptr<T>& a,\nconst\
  \ boost::shared_ptr<T>& b) const\n{\n    return less<T*>()(a.get(),b.get()); //\
  \ shared_ptr::get 返回\n} // shared_ptr 对象中的\n// 内置指针\n};\n}\n```\n\n这并不合理，而且并没有带来任何惊喜，因为这个\
  \ `less` 的特化仅仅确保了排序智能指针的行为与排序它们的内置兄弟相同。遗憾的是，我们对 `Widget` 尝试性的 `less` 特化确实*带来了惊喜。\n\
  \nC++ 程序员的某些假设是可以原谅的。例如，他们假设拷贝构造函数会复制。（正如 Item 8 证明，不遵守这一约定会导致令人惊讶的行为）。他们假设获取对象的地址会产生指向该对象的指针。（转向\
  \ Item 18 了解当这不成立时会发生什么）。他们假设像 `bind1st` 和 `not2` 这样的适配器可以应用于函数对象。（Item 40 解释了当情况不时不是如何出错的）。他们假设\
  \ `operator+` 是加法（`string` 除外，但使用“+”表示字符串拼接的历史悠久），`operator-` 是减法，而 `operator==`\
  \ 是比较。而且他们假设使用 `less` 等同于使用 `operator<`。\n\n`operator<` 不仅仅是实现 `less` 的默认方式，它是*程序员期望\
  \ `less` 所做的事情*。让 `less` 执行 `operator<` 之外的事情是对程序员预期的无端理由的违背。它违背了所谓的“最小惊讶原则”。它是冷酷的。它是卑劣的。不要通过玩弄\
  \ `less` 的定义来误导所有那些程序员。如果你使用 `less`（显式或隐式），请确保它意味着 `operator<`。如果你想用其他标准对对象进行排序，创建一个*不*命名为\
  \ `less` 的特殊函数。真的这么简单。\n\n## 第 7 章：使用 STL 编程\n\n将 STL 总结为由容器、迭代器、算法和函数对象组成是传统的做法，但使用\
  \ STL*编程*远不止于此。使用 STL 编程是知道何时使用循环、何时使用算法、以及何时使用容器成员函数。知道何时 `equal_range` 是比 `lower_bound`\
  \ 更好的搜索方式，知道何时 `lower_bound` 比 `find` 更优，以及何时 `find` 胜过 `equal_range`。知道如何通过用仿函数代替函数来提高算法性能。知道如何避免不可移植或难以理解的代码。甚至知道如何阅读长达数千个字符的编译器错误信息。并且知道关于\
  \ STL 文档、STL 扩展、甚至完整 STL 实现的互联网资源。\n\n是的，使用 STL 编程涉及许多知识。本章为你提供了大部分所需的知识。\n\n###\
  \ Item 43: 优先使用算法调用而不是手写循环\n\n\n\n\n\n每个算法都至少需要一对迭代器，用于指定一个对象范围，并在该范围内执行某些操作。例如，`min_element`\
  \ 寻找范围内的最小值，而 `accumulate` 则汇总整个范围的某些信息（参见 条目 37 ）），`partition` 则将范围内的所有元素分为满足和不满足某些准则的两部分（参见\
  \ 条目 31）。为了让算法执行工作，它们必须检查所传入范围内的每一个对象，而它们执行的方式正如你预期的那样：从范围的开始循环到末尾。某些算法（如 `find`\
  \ 和 `find_if`）可能会在完成遍历之前返回，但即使是这些算法内部也包含一个循环。毕竟，即使是 `find` 和 `find_if` 在得出它们要找的内容不存在之前，也必须查看范围内的每一个元素。\n\
  \n因此，从内部来看，算法就是循环。此外，STL 算法的广泛性意味着，许多你可能自然而然编写成循环的任务，也可以使用算法来编写。例如，如果你有一个支持重绘的 `Widget`\
  \ 类，\n\n```cpp\nclass Widget {\npublic:\n...\nvoid redraw() const;\n...\n};\n```\n\
  \n并且你想重绘 `list` 中所有的 `Widget`，你可以使用循环来实现，如下：\n\n点击此处查看代码图片\n\n```cpp\nlist<Widget>\
  \ lw;\n...\nfor (list<Widget>::iterator i = lw.begin(); i != lw.end(); ++i) {\n\
  \    i->redraw();\n}\n```\n\n但你也可以使用 `for_each` 算法来实现：\n\n点击此处查看代码图片\n\n```cpp\n\
  for_each(lw.begin(), lw.end(), // 请参见 条目 41\nmem_fun_ref(&Widget::redraw)); // 关于\
  \ mem_fun_ref\n```\n\n对于许多 C++ 程序员来说，编写循环比调用算法更自然，而阅读循环比理解 `mem_fun_ref` 以及获取 `Widget::redraw`\
  \ 的地址更舒服。然而，本条目认为调用算法是更优的。事实上，本条目认为，调用算法通常比任何手写的循环都更优。为什么呢？\n\n有三个原因：\n\n- **效率**：算法通常比程序员编写的循环更高效。\n\
  - **正确性**：编写循环比调用算法更容易出现错误。\n- **可维护性**：算法调用产生的代码通常比对应的显式循环更清晰、更直观。\n\n本条目的剩余部分将阐述使用算法的理由。\n\
  \n从效率的角度来看，算法可以通过三种方式胜过显式循环，其中两个主要的，一个是次要的。次要的方法涉及消除冗计算。再次看看我们刚才看到的循环：\n\n点击此处查看代码图片\n\
  \n```cpp\nfor (list<Widget>::iterator i = lw.begin(); i != lw.end(); ++i) {\n  \
  \  i->redraw();\n}\n```\n\n我高亮了循环的终止测试，以强调每次循环时，`i` 都会与 `lw.end()` 进行比较。这意味着每次循环时，都会调用函数\
  \ `list::end`。但我们不需要调用多次 `end`，因为我们没有修改该列表。调用一次 `end` 就足够了，而且如果我们再次查看算法调用，我们会发现\
  \ `end` 恰好评估了多少次：\n\n```cpp\nfor_each(lw.begin(), lw.end(), // 此调用恰好评估了一次\nmem_fun_ref(&Widget::redraw));\
  \ // lw.end()\n```\n\n公平地说，STL 实现者知道 `begin` 和 `end`（以及类似的函数，如 `size`）被频繁使用，因此他们很可能为了最大效率而设计这些函数。他们几乎会对它们进行内联（inline）处理并努力编写代码，使得大多数编译器能够通过将结果提升到像上面那样的循环之外避免重复计算。然而，经验表明，实现者并不总是能成功，当他们没有成功时，避免重复计算就足以让算法比手写的循环具有性能优势。\n\
  \n但这只是次要的效率论点。第一个主要论点是，库实现者可以利用他们对容器实现的了解，来优化遍历，这是任何库用户都无法做到的。例如，`deque` 中的对象通常（在内部）存储在一个或多个固定大小的数组中。这些数组的基于指针的遍历比基于迭代器的遍历更快，但只有库实现者可以使用基于指针的遍历，因为只有他们知道内部数组的大小以及如何从一个数组移动到下一个。某些\
  \ STL 包含了考虑 `deque` 内部数据结构的算法实现，此类实现已知比“的”算法实现快 20% 以上。\n\n重点不在于 STL 实现是针对 `deque`（或其他任何特定容器类型）进行了优化，而是实现者对这些实现的了解比你多，并且他们可以利用这一点。如果你为了自己的循环而放弃算法调用，你就放弃了从任何特定实现的优化中获益的机会。\n\
  \n第二个主要的效率论点是，所有最简单的 STL 算法使用了更复杂的计算机算法——有时比普通程序员能想出的任何东西都要复杂得多。如果效率论点没有说服你，也许你更倾向于基于正确性的诉求。编写循环时最棘手的问题之一是确保你使用的迭代器（a）是有效的，且\
  \ (b) 指向你想要的地方。例如，假设你有一个数组（可能是由于遗留 API——参见 条目 16 ），你想取每个数组元素，给它加 41，然后将其插入 `deque`\
  \ 的头部。编写自己的循环，你可能会写出这样的（这是 条目 16 中示例的变体）：\n\n点击此处查看代码图片\n\n```cpp\n// C API：此函数接收一个最多包含\
  \ arraySize 个\n// double 的数组指针并向其写入数据。它返回写入的 double 数量。\nsize_t fillArray(double\
  \ *pArray, size_t arraySize);\n\ndouble data[maxNumDoubles]; // 创建可能的大小的数组\ndeque<double>\
  \ d; // 创建 deque，将\n... // 数据放入其中\nsize_t numDoubles = fillArray(data, maxNumDoubles);\
  \ // 从 API 获取数组数据\nfor (size_t i = 0; i < numDoubles; ++i) { // 对于 data 中的每个 i，\n\
  \    d.insert(d.begin(), data[i] + 41); // 将 data[i]+41 插入到\n} // d 的头部；这行代码有一个\
  \ bug！\n```\n\n这段代码是可以运行的，只要你对新插入元素的顺序与 `data` 中对应元素的顺序反相反的结果感到满意即可。因为每次插入位置都是 `d.begin()`，最后一个插入的元素将位于\
  \ `deque` 的前端！\n\n如果这不是你想要的（承认吧，确实不是），你可能会想这样修复它：\n\n点击此处查看代码图片\n\n```cpp\ndeque<double>::iterator\
  \ insertLocation = d.begin(); // 记住 d 的\n// 开始迭代器\nfor (size_t i = 0; i < numDoubles;\
  \ ++i) { // 插入 data[i]+41\n    d.insert(insertLocation++ , data[i] + 41); // 在 insertLocation\
  \ 处，然后\n} // 递增\n```\n\n\n\n\n\n```cpp\n// insertLocation; *this*\n\n// *code is\
  \ also buggy!*\n```\n\n这看起来像是一个双赢，因为它不仅增加了指定插入位置的迭代器，还消除了在每次循环中都调用 `begin` 的需要；这消除了我们之前讨论过的微小效率损失。遗憾的是，这种方法遇到了另一个问题：它会产生未定义定义的行为。每当调用\
  \ `deque::insert` 时，`deque` 中的所有迭代器都会失效，这包括 `insertLocation`。在第一次调用 `insert` 之后，`insertLocation`\
  \ 就失效了，随后的循环迭代将直接进入“迷失之地（looneyland）”。\n\n一旦弄清楚这个问题（可能需要借助 STLport 调试模式的帮助，该模式在\
  \ Item 50 中描述），你可能会写如下代码：\n\n点击此处查看代码图像\n\n```cpp\ndeque<double>::iterator insertLocation\
  \ =\n\nd.begin(); // 与之前一样\n\nfor (size_t i = 0; i < numDoubles; ++i) { // 更新 insertLocation\n\
  \ninsertLocation = // 每次 insert 是\n\nd.insert(insertLocation , data[i] + 41); //\
  \ 调用以保持\n\n++insertLocation; // 迭代器有效，然后\n\n} // 增加它\n```\n\n这段代码最终实现了你的目标，但想想为了达到这里你付出了多少工作！将其与以下\
  \ `transform` 调用进行对比：\n\n点击此处查看代码图像\n\n```cpp\ntransform(data, data + numDoubles,\
  \ // 拷贝所有元素\n\ninserter(d, d.begin()), // 从 data 拷贝到 d 的头部\n\nbind2nd(plus<double>(),\
  \ 41)); // 的 d，为每个元素加 41\n```\n\n`bind2nd(plus<double>(), 41)` 可能会需要你花费几分钟才能写对（特别是如果你不经常使用\
  \ STL 的 binders 的话），但你唯一的迭代器相关的担心就是指定源范围的开始和结束（这从不是问题），以及确保使用 `inserter` 作为目标范围的起始位置（参见\
  \ Item 30）。在实践中，确定源和目标范围的正确初始迭代器通常是简单的，或者至少比确保循环体不会意外失效你需要继续使用的迭代器要容易得多。\n\n这个例子代表了一类难以正确编写的循环，因为你必须时刻警惕那些被错误操作或在用完之前就已失效的迭代器。要看另一个关于无意迭代器失效如何导致麻烦的示例，请参阅\
  \ Item 9，该章节描述了编写调用 `erase` 的循环时涉及的微妙之处。\n\n鉴于使用失效的迭代器会导致未定义行为，而且未定义行为有一种在开发和测试期间不显现的糟糕坏习，那么既然没必要冒险，为什么要冒这个险呢？将迭代器交给算法，让*它们*去担心迭代器操作的各种变数吧。\n\
  \n我已经解释了为什么算法可以比手写的循环更高效，并且描述了为什么此类循环必须应对算法可以避免的迭代器相关重重困难。如果运气好，你现在已经是算法的信徒了。然而运气是无常的，在我得出结论之前，我倾向于一种更有的信念。因此，让我们转向代码清晰度的问题。从长远来看，最好的软件是最清晰的软件，是最容易理解的软件，是最容易增强、维护和调整以适应新情况的软件。尽管人们对循环很熟悉，算法在这场长期竞争中具有优势。\n\
  \n它们优势的关键在于已知词汇的力量。STL 中有 70 个算法名称——如果考虑到重载，总共有超过 100 种不同的函数模板。每种算法都执行某些定义良好的任务，而*要求专业的\
  \ C++ 程序员知道（或能够查阅）每个算法的作用是合理的*。因此，当一个程序员看到一个 `transform` 调用时，该程序员会意识到某个函数被应用到了范围内的每个对象，并且这些调用的结果正被写入某处。当程序员看到\
  \ `replace_if` 调用时，他或她知道范围内所有满足某些谓词的对象正在被修改。当程序员遇到 `partition` 的调用时，他或她理解范围内的对象正在被移动，以便所有满足谓词的对象被聚集在一起（参见\
  \ Item 31）。STL 算法名称传递了大量的语义信息，这使得它们比任何随机循环都更加清晰。\n\n当你看到 `for`、`while` 或 `do` 时，你只知道将出现某种循环。为了获得关于该循环作用的哪怕是最细微的想法，你也必须检查它。算法并非如此。一旦你看到算法调用，光凭名称就勾勒出了它作用的轮廓。当然，要确切理解将发生什么，你必须检查传递给算法的参数，但这比试图推测通用循环结构的意图通常要少得多。\n\
  \n简单来说，算法名称暗示了它们的作用。“`for`”、“`while` 和“`do`”并没有。事实上，对于 C++ 的任何组件都是如此。毫无疑问，你可以自己编写\
  \ `strlen`、`memset` 或 `bsearch`。为什么不呢？因为(1) 有人已经写过了，所以你没必要这样做；(2) 它们是标准的，所以大家都知道它们的作用；(3)\
  \ 你怀疑库实现者知道一些你不知道的技巧。正如你不会自己写 `strlen` 等一样，为 STL 中存在的功能编写循环是没有意义的。算法名称比裸循环更有意义，这是事实，但在迭代过程中指定做什么使用循环比算法更清晰。例如，假设你想识别向量中大于\
  \ `x` 且小于 `y` 的第一个元素。以下是使用循环实现它的方法：\n\n点击此处查看代码图像\n\n```cpp\nvector<int> v;\nint\
  \ x, y;\n...\nvector<int>::iterator i = v.begin(); // 从 v.begin() 迭代直到\nfor( ; i\
  \ != v.end(); ++i) { // 适当的值或\nif (*i > x && *i < y) break;\n}\n... // i 现在指向该值或等于\
  \ v.end()\n```\n\n可以将相同的逻辑传递给 `find_if`，但这需要使用非标准的对象适配器，如 SGI 的 `compose2`（参见 Item\
  \ 50）：\n\n点击此处查看代码图像\n\n```cpp\nvector<int>::iterator i =\nfind_if(v.begin(), v.end(),\
  \ // 找到第一个值 *val*\n\ncompose2(logical_and<bool>(), // 其中“与”逻辑\n\nbind2nd(greater<int>(),\
  \ x), // *val > x 和\n\nbind2nd(less<int>(), y))); // *val < y\n\n为真\n```\n\n即使这没有使用非标准组件，许多程序员也会反对它远不如循环清晰，我不得不承认对这种观点表示同情（参见\
  \ Item 47）。\n\n通过将测试逻辑移动到独立的仿器类中，可以让 `find_if` 调用不再那么令人生畏：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T>\nclass BetweenValues:\n\npublic unary_function<T, bool> { //\
  \ 参见 Item 40\n\npublic:\n\nBetweenValues(const T& lowValue,\n\nconst T& highValue)\
  \ // 让构造函数保存\n```\n\n\n\n\n\n```cpp\n: lowVal(lowValue), highVal(highValue) // 数值应介于\n\
  \n{}\n\nbool operator()(const T& val) const // 返回是否\n\n{ // val 介于\n\n    return\
  \ val > lowVal && val < highVal; // 保存的值\n}\n\nprivate:\n\nT lowVal;\n\nT highVal;\n\
  \n};\n```\n\n...\n\n```cpp\nvector<int>::iterator i = find_if(v.begin(), v.end(),\
  \ BetweenValues<int>(x, y));\n```\n\n但这也有它的缺点。首先，创建 `BetweenValues` 模板比编写循环体要费力得多。数数行数就知道了：循环体：一行；`BetweenValues`\
  \ 模板：十四行。这个比例并不理想。其次，`find_if` 正在查找内容的细节现在在物理上与调用处分离开来。要真正理解对 `find_if` 的调用，必须查找\
  \ `BetweenValues` 的定义，但 `BetweenValues` 必须定义在包含 `find_if` 用的函数外部。如果你尝试像这样在包含 `find_if`\
  \ 调用的函数内部声明 `BetweenValues`：\n\n点击此处查看代码图像\n\n```cpp\n{ // 函数开始\n\n...\n\ntemplate\
  \ <typename T>\nclass BetweenValues: public unary_function<T, bool> { ... };\n\n\
  vector<int>::iterator i = find_if(v.begin(), v.end(), BetweenValues<int>(x, y));\n\
  \n...\n\n} // 函数结束\n```\n\n你会发现它无法编译，因为模板不能在函数内部声明。如果你尝试通过将 `BetweenValues` 变成一个类而不是模板来避免这一限制：\n\
  \n点击此处查看代码图像\n\n```cpp\n{ // 函数开始\n\n...\n\nclass BetweenValues: public unary_function<int,\
  \ bool> { ... };\n\nvector<int>::iterator i = find_if(v.begin(), v.end(), BetweenValues(x,\
  \ y));\n\n...\n\n} // 函数结束\n```\n\n你会发现自己依然是无济于事，因为定义在函数内部的类被称为局部类，而局部类类型不能绑定到模板类型参数（例如\
  \ `find_if` 所获取的函数对象的类型）。尽管看起来很遗憾，但函数对象类和函数对象类模板是不允许定义在函数内部的，无论这样做有多方便。\n\n在算法调用与手写循环的持续斗争中，代码清晰性的底线在于你需要在循环内部做什么。如果你需要做某些算法已经完成的事情，或者你需要做一些与算法执行的操作非常相似的事情，那么算法调用更清晰。如果你需要一个执行相当简单操作的循环，但如果使用算法就需要复杂的绑定器（binders）和适配器（adapters）的混乱缠绕，或者需要一个单独的函数对象类，那么你可能直接写循环更好。最后，如果你需要在循环内部执行相当长且复杂的操作，天平会向算法倾斜，因为长而复杂的计算通常应该移动到单独函数中。一旦你将循环体移动到单独函数，你几乎可以找到一种方法将该函数传递给算法（通常是\
  \ `for_each`），使得生成的代码既直接又直观。\n\n如果你同意这一节——即算法调用通常优于手写循环，如果你也同意第 5 条——即成员函数优于迭代调用单元素成员函数的循环，那么就会得出一个有趣的结论：使用\
  \ STL 编写的良好的 C++ 程序包含的循环远少于不使用 STL 的等效程序。这是一好事。每当我们可以将 `for`、`while` 和 `do` 等低级词汇替换为\
  \ `insert`、`find` 和 `for_each` 等高层术语时，我们就提高了软件的抽象层次，从而使其更容易编写、撰写文档、增强和维护。\n\n##\
  \ 第 44 条：优先使用成员函数而非同名的算法\n\n某些容器具有与 STL 算法同名的成员函数。关联容器提供了 `count`、`find`、`lower_bound`、`upper_bound`\
  \ 和 `equal_range`，而 `list` 提供了 `remove`、`remove_if`、`unique`、`sort`、`merge` 和 `reverse`。大多数情况下，你会想要使用成员函数而不是算法。原因有两个：第一，成员函数速度更快。其次，它们与容器（尤其是关联容器）的集成得更好。\n\
  \n让我们从 `find_if` 正在查找的内容开始，假设你有一个关联容器，并且你想找到 727 的首次出现。这里是两种显而易见的方法：点击此处查看代码图像\n\
  \n```cpp\nset<int> s; // 创建集合，放入 1,000,000 个值\n\nset<int>::iterator i = s.find(727);\
  \ // 使用成员函数\nif (i != s.end()) ... // 函数\n\nvector<int>::iterator i = find_if(s.begin(),\
  \ s.end(), BetweenValues<int>(x, y));\n```\n\n成员函数 `find` 以对数时间运行，因此无论 727 是否在集合中，`set::find`\
  \ 最只需要 40 次比较，而对于大多数搜索只需要 20 次。相比之下，`find` 算法以线性时间运行，因此如果集合中没有 727，它将执行 1,000,000\
  \ 次比较。即使 727 在集合中，该算法平均也会执行 500,000 次比较。因此效率得分为：\n\n成员函数 `find`：约 40（最坏情况）到 20（平均）\n\
  \n算法 `find`：1,000,000（最坏情况）到 500,000（平均）\n\n正如高尔夫一样，低分者胜，正如你所见，这场比赛并不悬殊。\n\n我对成员\
  \ `find` 所需的比较次数必须谨慎，因为这部分取决于容器的实现。大多数实现使用红黑树，这是一种最多偏移两倍的平衡树。在这些实现中，搜索一个包含百万个值的集合的最大比较次数为\
  \ 38 次，但对于大多数搜索只需要 22 次。基于完美平衡树的实现永远不需要超过 21 次比较，但在实践中，这种完美平衡树的整体性能劣于红黑树。这就是为什么大多数实现使用红黑树。\n\
  \n效率不是成员和算法 `find` 之间的唯一区别。正如第 19 条](#text00050.html_ch03lev1sec1）所示，STL 算法通过检查相等性来确定两个对象具有相同的值，而关联容器使用等价性作为它们的“相同性”测试。因此，`find`\
  \ 算法使用相等性搜索 727，而 `find` 成员函数使用等价性搜索。相等性与等价性之间的差异可能是搜索成功与失败的区别。例如，第 19 条](#text00050.html_ch03lev1sec1）展示了使用\
  \ `find` 算法在关联容器中查找内容可能会失败，即使相应的 `find` 成员函数搜索会成功。因此，当你处理关联容器时，你应该优先使用 `find`、`count`、`lower_bound`\
  \ 等的成员形式，而不是它们的算法同名。\n\n\n\n\n这种差异在处理 `map` 和 `multimap` 时尤为明显，因为这些容器存储的是 `pair`\
  \ 对象，但它们的成员函数只查看每个 `pair` 的键（key）部分。因此，`count` 成员函数只计算匹配键的对（当然，“匹配”是通过测试等价性确定的）；每个\
  \ `pair` 的值（value）部分被忽略。成员函数 `find`、`lower_bound`、`upper_bound` 和 `equal_range`\
  \ 的行为也类似。然而，如果你使用 `count` 算法，它将根据 (a) 等价性和 (b) `pair` 的两个分量来查找匹配项；`find`、`lower_bound`\
  \ 等执行的是相同的操作。要让算法只查看 `pair` 的键部分，你必须按照 第 23 项 中描述的步骤来操作（这也允许你将相等性测试替换为等价性测试）。\n\n\
  另一方面，如果你真的关心效率，你可能会认为 第 23 项 的复杂操作，结合 第 34 项 的对数时间查找算法，是为了性能提升所付出的出的代价。话虽如此，如果你真的关心效率，你还会考虑\
  \ 第 25 项 中描述的非标准哈希容器，尽管在那里你将再次面临相等性和等价性之间的区别。\n\n那么，对于标准关联容器，选择与算法同名的成员函数而非算法具有以下几个优点。首先，你获得的是对数时间性能而非线性时间性能。其次，你使用等价性来确定两个值是否“相同”，这是关联容器的自然定义。第三，在处理\
  \ `map` 和 `multimap` 时，你自动只处理键值，而不是处理 (键, 值) 对。这三者合一的优势使得倾向于使用成员函数的理由变得非常不可撼动。\n\
  \n因此，让我们继续讨论与 STL 算法同名的 `list` 成员函数。在这里，故事几乎完全关于效率。`list` 特化的每个算法（`remove`、`remove_if`、`unique`、`sort`、`merge`\
  \ 和 `reverse`）都会拷贝对象，而 `list` 特有的版本不拷贝任何内容；它们只是操纵连接列表节点的指针。算法与成员函数的算法复杂度是相同的，但在操作指针比拷贝对象开销小的假设下，`list`\
  \ 版本的这些函数应该提供更好的性能。\n\n重要的是记住，`list` 成员函数的行为往往与它们对应的算法版本不同。正如 第 32 项 所解释的，如果你真的想从容器中删除对象，调用算法\
  \ `remove`、`remove_if` 和 `unique` 之后必须跟调用 `erase`，但 `list` 的 `remove`、`remove_if`\
  \ 和 `unique` 成员函数确实可以直接删除了元素；不需要随后调用 `erase`。\n\n`sort` 算法与 `list` 的 `sort` 函数之间的一个显著区别是，前者不能应用于\
  \ `list`。由于 `list` 的迭代器仅是双向迭代器，因此不能传递给 `sort`。`merge` 算法的行为与 `list` 的 `merge` 之间也存在差异。算法不允许修改其源范围，但\
  \ `list::merge` 总是会修改它所工作的列表。\n\n所以就是这样。当要在 STL 算法或同名的容器成员函数之间做出选择时，你应该优选成员函数。它几乎肯定更有效率，而且可能与容器的通常行为结合得更好。\n\
  \n### 第 45 项：区分 `count`、`find`、`binary_search`、`lower_bound`、`upper_bound` 和 `equal_range`\n\
  \n你想查找某个东西，你有一个容器，或者你有一组迭代器标定了你认为它所在的一个范围。你如何进行搜索？你的箭袋里装满了利箭：`count`、`count_if`、`find`、`find_if`、`binary_search`、`lower_bound`、`upper_bound`\
  \ 和 `equal_range`。抉结，抉结！你如何选择？\n\n很简单。你选择一个快速又简单的方法。越快越简单越好。\n\n目前，我们假设你有一对指定搜索范围的迭代器。稍后，我们将考虑拥有容器而非范围的情况。\n\
  \n在选择搜索策略时，很大程度上取决于你的迭代器是否定义了一个排序范围。如果是，你可以通过 `binary_search`、`lower_bound`、`upper_bound`\
  \ 和 `equal_range` 获得快速（通常是对数时间——参见 第 34 项）查找。如果迭代器没有标定排序范围，你就限于线性时间算法 `count`、`count_if`、`find`\
  \ 和 `find_if`。在下文中，将忽略 `count` 和 `find` 的 `_if` 变体，正如忽略带有谓词的 `binary_search`、`lower_bound`、`upper_bound`\
  \ 和 `equal_range` 变体。无论你是依赖默认搜索谓词还是指定自己的谓词，选择搜索算法的考虑因素都是。\n\n如果你有一个未排序范围，你的选择是 `count`\
  \ 或 `find`。它们回答的问题略有不同，因此值得仔细观察。`count` 回答问题：“该值在那里吗？如果是，有多少个副本？”而 `find` 回答问题：“它在那儿吗？如果是，它在哪里？”\n\
  \n假设你只想知道某个特殊的 `Widget` 值 `w` 是否在某个 `list` 中。使用 `count`，代码如下：\n\n```cpp\nlist<Widget>\
  \ lw; // Widget 列表\n\nWidget w; // 特殊的 Widget 值\n\n...\n\nif (count (lw.begin(),\
  \ lw.end(), w)) {\n    ... // w 在 lw 中\n} else {\n    ... // 不在\n}\n```\n\n这展示了一种常见的惯用法：使用\
  \ `count` 作为存在性测试。`count` 返回 0 或正数，因此我们依赖非零值到 `true` 以及零到 `false` 的转换。可以认为，更显式地说明我们在做什么会更清晰：\n\
  \n```cpp\nif (count(lw.begin(), lw.end(), w) != 0)\n```\n\n有些程序员确实这样写，但像示例那样依赖隐式转换也很常见。\n\
  \n与原始代码相比，使用 `find` 稍微复杂，因为你必须将 `find` 的返回值与列表的结束迭代器进行比较：\n\n```cpp\nif (find (lw.begin(),\
  \ lw.end(), w) != lw.end() ) {\n    ...\n} else {\n    ...\n}\n```\n\n对于存在性测试，`count`\
  \ 的惯用法代码稍微简单。但同时，当搜索成功时，它的效率较低，因为 `find` 在找到匹配项后就会停止，而 `count` 必须一直到范围结束寻找匹配项。对于大多数程序员来说，`find`\
  \ 在效率上的优势足以补偿使用复杂性的微增。\n\n通常，知道一个值是否在范围内是不够的。相反，你可能想要范围内具有该值的第一个对象。例如，你可能想打印该对象，想在它前面插入东西，或者想删除它（关于迭代时删除的指导，请参见\
  \ 第 9 项）。当你不仅需要知道是否存在，还需要知道是哪个对象（或对象）拥有该值时，你需要 `find`：\n\n```cpp\nlist<Widget>::iterator\
  \ i = find (lw.begin(), lw.end(), w);\n\nif (i != lw.end()) {\n    ... // 找到了，i\
  \ 指向第一个\n} else {\n    ... // 未找到\n}\n```\n\n\n\n\n对于有序范围，你还有其他选择，而且你绝对想要使用它们。`count`\
  \ 和 `find` 运行在线性时间内，但针对有序范围的搜索算法（`binary_search`、`lower_bound`、`upper_bound` 和 `equal_range`）运行在对数时间内。\n\
  \n从无序范围到有序范围的转变导致了另一个转变：从使用相等性（equality）来判断两个值是否相同变为使用等价性（equivalence）。Item 19 包含了关于相等性与等价性的论述，所以我在这里不再重复它。相反，我只需说明\
  \ `count` 和 `find` 算法都使用相等性进行搜索，而 `binary_search`、`lower_bound`、`upper_bound` 和\
  \ `equal_range` 则采用等价性。\n\n要测试有序范围中是否存在某个值，请使用 `binary_search`。与标准 C 库（以及标准 C++\
  \ 库）中的 `bsearch` 不同，`binary_search` 只返回一个 `bool`：是否找到了该值。`binary_search` 回答的是“它在那里吗？”这个问题，它的答案是“是”或“否”。如果你需要更多信息，你需要不同的算法。\n\
  \n这里有一个 `binary_search` 应用于有序 `vector` 的示例。（你可以在 Item 23 中阅读关于有序 vector 的优点。）\n\n\
  点击此处查看代码图像\n\n```cpp\nvector<Widget> vw; // 创建 vector，将\n... // 数据放入其中，并排序\nsort(vw.begin(),\
  \ vw.end()); // 数据\nWidget w; // 要搜索的值\n...\nif (binary_search (vw.begin(), vw.end(),\
  \ w)) {\n    ... // w 在 vw 中\n} else {\n    ... // 它不在其中\n}\n```\n\n如果你有一个有序范围，并且你的问题是“它在那里吗？如果是的话，它在哪里？”那么你需要\
  \ `equal_range`，但你可能认为你想要的是 `lower_bound`。我们很快会讨论 `equal_range`，但首先，让我们看看 `lower_bound`\
  \ 如何作为一种在范围内确定值位置的方法。\n\n当你要求 `lower_bound` 查找一个值时，它会返回一个指向该值的第一个副本的迭代器（如果找到），或者指向该值的合适插入位置的迭代器（如果未找到）。因此`lower_bound`\
  \ 回答的问题是：“它在那里？如果是的话，第一个副本在哪里？如果不在，它应该放在哪里？”就像 `find` 一样，`lower_bound` 的结果必须经过测试，以检查它是否指向你正在寻找的值。与\
  \ `find` 不同，你不能仅仅将 `lower_bound` 的返回值与结束迭代器（end）进行比较。相反，你必须测试 `lower_bound` 识别的对象，以确定那是否是你想要的值。\n\
  \n许多程序员这样使用 `lower_bound`：\n\n点击此处查看代码图像\n\n```cpp\nvector<Widget>::iterator i =\
  \ lower_bound (vw.begin(), vw.end(), w);\nif (i != vw.end() && *i == w) { // 确保\
  \ i 指向一个对象；\n    // 确保该对象具有\n    // 正确的值；*这里有一个 bug！*\n    ... // 找到了值，i 指向\n  \
  \  // 具有该值的第一个对象\n} else {\n    ... // 未找到\n}\n```\n\n这在大多数情况下都是作用的，但它并不真正正确。再次观察判断是否找到了所需值的测试代码：\n\
  \n```cpp\nif (i != vw.end() && *i == w ) ...\n```\n\n这是一个*相等性*测试，但 `lower_bound`\
  \ 使用的是*等价性*进行搜索。在大多数情况下，等价性和相等性的测试会产生相同的结果，但 Item 19 证明了要构出相等性和等价性产生不同的情况并不困难。在这些情况下，上面的代码是错误的。\n\
  \n为了正确处理，你必须检查从 `lower_bound` 返回的迭代器是否指向一个值与你搜索的值等价的对象。你可以手动执行这一点（Item 19 展示了如何做，且\
  \ Item 24 提供了何时这样做值得的示例），但这可能会变得复杂，因为你必须确保使用与 `lower_bound` 使用的相同的比较函数。通常情况下，那可能是一个任意函数（或函数对象）。如果你向\
  \ `lower_bound` 传递了一个比较函数，你就必须确保在你的手写等价性测试中使用相同的比较函数。*那*意味着如果你更改了传递给 `lower_bound`\
  \ 的比较函数，你就必须在你的等价性检查中做出相应的更改。保持比较函数的同步并不是什么火箭科学，但它是另一件需要记住的事情，我怀疑你已经有很多需要记在心的事情了。\n\
  \n有一种更简单的方法：使用 `equal_range`。`equal_range` 返回一个迭代器*对*，第一个等同于 `lower_bound` 返回的迭代器，第二个等同于\
  \ `upper_bound` 返回的迭代器（即越过范围的最后一个）。对于相等性和等价性产生相同结果类型，`equal_range` 承担了 `find` 和\
  \ `count` 的工作。\n\n关于 `equal_range` 的返回值有两个重要的观察点。首先，如果两个迭代器相同，说明范围为空；未找到该值。为了使用\
  \ `equal_range` 来回答“它在那里吗？”这个问题，可以这样用：\n\n点击此处查看代码图像\n\n```cpp\ntypedef vector<Widget>::iterator\
  \ VWIter;\ntypedef pair<VWIter, VWIter> VWIterPair;\nvector<Widget> vw; // 创建 vector，将\n\
  ... // 数据放入其中，并排序\nsort(vw.begin(), vw.end());\nVWIterPair p = equal_range (vw.begin(),\
  \ vw.end(), w);\nif (p.first != p.second) { // 如果 equal_range 没有返回\n空范围\n    ...\
  \ // 找到了，p.first 指向\n// 第一个，p.second 指向\n// 最后一个之后\n} else {\n    ...\n```\n\n关于\
  \ `equal_range` 返回值的第二个注意事项是，迭代器之间的距离是范围内等价于目标的对象的数量。例如，为了打印有多少个 `Widget`，你可以这样做：\n\
  \n点击此处查看代码图像\n\n```cpp\nVWIterPair p = equal_range(vw.begin(), vw.end(), w);\ncout\
  \ << \"There are \" << distance(p.first, p.second)\n<< \" elements in vw equivalent\
  \ to w.\";\n```\n\n到目前为止，我们的讨论假设我们要在范围内搜索一个值，但有时我们感兴趣的是找到范围内的*位置*。例如，假设我们有一个 `Timestamp`\
  \ 类和一个 `Timestamp` 的 `vector`，其排序使得旧的时间戳靠前：\n\n点击此处查看代码图像\n\n```cpp\nclass Timestamp\
  \ { ... };\nbool operator<(const Timestamp& lhs, // 返回 lhs 是否\nconst Timestamp&\
  \ rhs); // 在时间上小于 rhs\nvector<Timestamp> vt; // 创建 vector，填充\n... // 数据，排序使得旧的\n\
  // 时间先于新的\nsort(vt.begin(), vt.end());\n```\n\n现在假设我们有一个特殊的时间戳 `ageLimit`，我们想要从\
  \ `vt` 中删除所有比 `ageLimit` 更旧的时间戳。在这种情况下，我们不想在 `vt` 中搜索等价于 `ageLimit` 的 `Timestamp`，因为可能没有具有精确值的元素。相反，我们需要找到\
  \ `vt` 中的一个*位置*：第一个不比 `ageLimit` 更旧的元素。这简直再简单不过了，因为 `lower_bound` 将精确提供我们所需要的：\n\
  \n点击此处查看代码图像\n\n```cpp\nTimestamp ageLimit;\n...\nvt.erase(vt.begin(), lower_bound\
  \ (vt.begin(), // 从 vt 中消除所有\nvt.end(), // 先于\nageLimit's 值的对象));\n```\n\n\n\n\n\
  \n如果我们的需求发生细微变化，想要消除所有旧于或等于 `ageLimit` 的时间戳，那么我们需要找到第一个比 `ageLimit` *年轻*的时间戳的位置。这正是\
  \ `upper_bound` 的量身定制的任务：\n\n点击此处查看代码图片\n\n```cpp\nvt.erase(vt.begin(), upper_bound\
  \ (vt.begin(), // 从 vt 中删除所有\n\nvt.end(), // 早于\n\nageLimit)); // 或等于\n\n// ageLimit\
  \ 值的对象\n```\n\n如果你想将元素插入到一个已排序的范围内，使得具有等值值的对象按照它们被插入的顺序存储，那么 `upper_bound` 同样有用。例如，我们可能有一个按名称排序的\
  \ `Person` 对象 `list`，其中对象是按名称排序的：\n\n点击此处查看代码图片\n\n```cpp\nclass Person {\n\npublic:\n\
  \n...\n\nconst string& name() const;\n\n...\n};\n\nstruct PersonNameLess:\n\npublic\
  \ binary_function<Person, Person, bool> { // 参见 项目 40\n\nbool operator()(const Person&\
  \ lhs, const Person& rhs) const\n\n{\n\nreturn lhs.name() < rhs.name();\n\n}\n};\n\
  \nlist<Person> lp;\n\n...\n\nlp.sort(PersonNameLess()); // 使用\n\n// PersonNameLess\
  \ 排序 lp\n```\n\n为了保持列表按照我们期望的方式进行排序（按名称排序，等值名称按其插入顺序存储），我们可以使用 `upper_bound` 来指定插入位置：\n\
  \n点击此处查看代码图片\n\n```cpp\nPerson newPerson;\n\n...\n\nlp.insert( upper_bound (lp.begin(),\
  \ // 在 lp 中最后一个\n\nlp.end(), // 对象之后插入 newPerson\n\nnewPerson, // 该对象早于或等于\n\nPersonNameLess()),\
  \ // 等于\n\nnewPerson); // newPerson\n```\n\n这种方法运行良好且非常方便，但重要的是不要被对 `upper_bound`\
  \ 的这种用法误导，认为我们正在以对数时间魔法般地查找 `list` 中的插入位置。我们并没有这样做。项目 34 解释说，由于我们处理的是 `list`，查找需要线性时间，但它只执行了对数次数的比较。\n\
  \n到此为止，我们只考虑了拥有一对定义搜索范围的迭代器的情况。通常你拥有的是容器而不是范围。在这种情况下，你必须区分序列容器和关联容器。对于标准序列容器（`vector`、`string`、`deque`\
  \ 和 `list`），你应该遵循我们在本项目中概述的建议，使用容器的 `begin` 和 `end` 迭代器来界定范围。\n\n标准关联容器（`set`、`multiset`、`map`\
  \ 和 `multimap`）的情况有所不同，因为它们提供了搜索成员函数，这些函数通常是 STL 算法更好的选择。项目 44 详细说明了为什么它们是更好的选择，但简而言之，是因为它们更快且行为更自然。幸运的是，这些成员函数的名称通常与相应的算法相同，因此当上述讨论建议你选择名为\
  \ `count`、`find`、`equal_range`、`lower_bound` 或 `upper_bound` 的算法时，在搜索关联容器时，只需选择同名的成员函数即可。`binary_search`\
  \ 需要不同的策略，因为没有与该算法对应的成员函数。若要测试 `set` 或 `map` 中是否存在某个值，请使用 `count` 将其作为成员性测试的惯用方法：\n\
  \n点击此处查看代码图片\n\n```cpp\nset<Widget> s; // 创建集合，并将数据放入其中\n\n...\n\nWidget w; // w\
  \ 仍持有要查找的值\n\n...\n\nif (s.count(w) ) {\n\n... // 存在等于 w 的值\n} else {\n\n... //\
  \ 不存在该值\n}\n```\n\n测试 `multiset` 或 `multimap` 中是否存在某个值，`find` 通常优于 `count`，因为 `find`\
  \ 在找到一个具有所需值的对象后就可以停止，而 `count` 在最坏的情况下必须检查容器中的每个对象。（在处理 `set` 和 `map` 时这不是问题，因为\
  \ `set` 不允许重复值，而 `map` 不允许重复键。）\n\n然而，`count` 在关联容器中计数的作用是稳固的。特别是，它比调用 `equal_range`\
  \ 并对结果迭代器应用 `distance` 是更好的选择。首先，它更清晰：`count` 意味着“计数”。其次，它更容易；不需要创建一个对并将其分量传递给 `distance`。第三，它可能稍微快一点。\n\
  \n考虑到我们在本项目中考虑的所有内容，我们处于什么位置？下表说明了一切。\n\n![image](img/Image00071.jpg)\n\n在总结如何处理排序范围的列中，总结了如何处理排序范围的方法。`equal_range`\
  \ 出现的频率可能会令人惊讶。在排序范围的第二行中，`equal_range` 以对数时间运行，而 `find` 需要线性时间。对于 `multiset` 和\
  \ `multimap`，如果存在多个值，`find` 无法识别第一个值。对于 `set` 和 `map`，`upper_bound` 是一个常见的选择。如果你确实需要找到给定值的第一个对象，你将希望使用\
  \ `lower_bound`，并且你需要手动执行 项目 19\n\n```cpp\nvector<double> v;\n\n...\n\nsort(v.begin(),\
  \ v.end(), greater<double>());\n```\n\n如果你担心抽象代价，你可能会决定放弃函数对象而转而使用真实函数，一个不仅是真实的，还是\
  \ `inline` 的函数：\n\n点击此处查看代码图片\n\n```cpp\ninline\n\nbool doubleGreater(double d1,\
  \ double d2)\n\n{\n\nreturn d1 > d2;\n\n}\n\n...\n```\n\n\n\n\n\n```cpp\nsort(v.begin(),\
  \ v.end(), doubleGreater);\n```\n\n有趣的是，如果你比较这两个 `sort` 调用的性能（一个使用 `greater<double>`，另一个使用\
  \ `doubleGreater`），你几乎肯定会发现使用 `greater<double>` 的那一个更快。例如，我在四个不同的 STL 平台上对一个包含一百万个\
  \ `double` 的 `vector` 执行了两次 `sort` 调用并计时，每个平台都设置了针对速度的优化，而使用 `greater<double>` 的版本每次都更快。最坏的情况下，它快了\
  \ 50%，最好的情况下快了 160%。所谓的抽象开销也就于此了。\n\n这种行为的解释非常简单：内联（inlining）。如果一个函数对象的 `operator()`\
  \ 函数被声明为内联（通过 `inline` 显式声明，或通过在类定义中定义来隐式声明），那么该函数的体对编译器是可见的，大多数编译器在实例化所调用的算法时都会乐意地内联该函数。在上面的示例中，`greater<double>::operator()`\
  \ 是内联函数，因此编译器在实例化 `sort` 时会对其进行内联展开。结果是 `sort` 包含零函数调用，编译器能够对这种通常无法尝试的无调用代码进行优化。（有关内联与编译器优化之间相互作用的讨论，请参阅\
  \ *Effective C++* 的 Item 33 以及 Bulka 和 Mayhew 的 *Efficient C++* 的第 8–10 章 [10]。）\n\
  \n使用 `doubleGreater` 运行 `sort` 的情况则有所不同。为了看到它的不同之处，我们必须记住，并不存在将函数作为参数传递给另一个函数的情况。当我们尝试将函数作为参数传递时，编译器静静地将函数转换为指向该函数的*指针*，我们实际传递的是这个指针。因此，以下调用\n\
  \n```cpp\nsort(v.begin(), v.end(), doubleGreater);\n```\n\n并没有将 `doubleGreater`\
  \ 传递给 `sort`，而是传递了指向 `doubleGreater` 的指针。当实例化 `sort` 时，生成的函数声明如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nvoid sort(vector<double>::iterator first, // 范围开始\nvector<double>::iterator\
  \ last, // 范围结束\nbool (*comp)(double, double) ); // 比较函数\n```\n\n由于 `comp` 是一个函数指针，每次在\
  \ `sort` 内部使用它时，编译器都会进行间接函数调用——即通过指针的调用。大多数编译器不会尝试对通过函数指针调用的函数内联，即使像本例一样，这些函数已经被声明为\
  \ `inline` 且优化看起来显而易见。为什么呢？可能因为编译器供应商从未觉得实现这种优化是值得的。你必须对编译器供应商表示一点同情。他们有大量的需求，而且无法完成所有事情。但这并不意味着你应该停止向他们提出这种请求。\n\
  \n函数指针参数会阻碍内联，这一事实解释了长期编写 C 的程序员往往难以置信的一个观察：在速度方面，C++ 的 `sort` 几乎总是让 C 的 `qsort`\
  \ 感到尴尬。当然，C++ 有函数模板和类模板来实例化，并且有外观奇怪的 `operator()` 函数来调用，而 C 只需要简单的函数调用，但所有这些 C++\
  \ 的“开销”在编译期间都被吸收了。运行时，`sort` 对其比较函数进行内联调用（假设比较函数已声明为 `inline` 且其体在编译期间可用），而 `qsort`\
  \ 通过指针调用其比较函数。最终结果是 `sort` 运行更快。在我对一百万个 double 的 `vector` 进行测试中，它快了高达 670%，但不要听我的，你自己试一试。很容易验证，当将函数对象和真实函数作为算法参数比较时，存在抽象*红利*。\n\
  \n倾向于使用函数对象而非函数作为算法参数的另一个原因与效率无关。它与让你的程序能够编译有关。由于某种原因，STL 平台拒绝完全有效的代码并不罕见，可能是由于编译器或库的缺陷，或者两者都有。例如，一个广泛使用的\
  \ STL 平台拒绝了以下（有效的）代码来向 `cout` 打印 set 中每个字符串的长度：\n\n点击此处查看代码图像\n\n```cpp\nset<string>\
  \ s;\n...\ntransform(s.begin(), s.end(),\nostream_iterator<string::size_type>(cout,\
  \ \"\\n\"),\nmem_fun_ref(&string::size));\n```\n\n问题的原因是这个特定的 STL 平台在处理 `const`\
  \ 成员函数（如 `string::size`）时存在 bug。解决办法是使用函数对象：\n\n点击此处查看代码图像\n\n```cpp\nstruct StringSize:\n\
  public unary_function<string, string::size_type> { // 查看 Item 40\nstring::size_type\
  \ operator()(const string& s) const\n{\nreturn s.size();\n}\n};\n\ntransform(s.begin(),\
  \ s.end(),\nostream_iterator<string::size_type>(cout, \"\\n\"),\nStringSize());\n\
  ```\n\n问题的原因是这个特定的 STL 平台在处理 `const` 成员函数（如 `string::size`）时存在 bug。解决办法是使用函数对象。换句话说，创建仿函数\
  \ `StringSize` 不仅仅可以在每个将 `mem_fun_ref(&string::size)` 传递给 `transform` 的 STL 平台上通过编译，它还有助于对\
  \ `string::size` 调内内，这也可能导致性能的提升。\n\n倾向于使用函数对象而非函数的另一个原因是它们可以帮助你避免微妙的语言陷阱。偶尔，看起来合理的源代码会因为合法但晦涩的原因被编译器拒绝。例如，在某些情况下，函数模板实例化的名称并不等同于函数的名称。这里就是这样一种情况：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename FPType>\nFPType average(FPType val1, FPType\
  \ val2)\n{\nreturn (val1 + val2) / 2;\n}\n\ntemplate<typename InputIter1, typename\
  \ InputIter2>\nvoid writeAverages(InputIter1 begin1, InputIter1 end1, InputIter2\
  \ begin2, ostream& s)\n{\ntransform(begin1, end1, begin2,\nostream_iterator<typename\
  \ iterator_traits<InputIter1>::value_type>(s, \"\\n\"),\naverage<typename iterator_traits<InputIter1>::value_type>);\n\
  }\n```\n\n许多编译器接受这段代码，但 C++ 标准似乎禁止这样做。理由是理论上可能存在另一个名为 `average` 接受单个类型参数的函数模板。如果存在，表达式\
  \ `average<typename iterator_traits<InputIter1>::value_type>` 就会产生歧义，因为不清楚应该实例化哪个模板。在这个特定的示例中，并没有歧义，但某些编译器仍然拒绝这段代码，而且它们被允许那样做。无论如何，2003\
  \ 年 10 月，标准化委员会明确了这段代码应该是有效的。这一决定要等到下一个版本的 C++ 标准被采用后才会正式生效（预计为 2009 年），但编译器供应商可能会更早实施修订后的规则。解决问题的方法是退到函数对象：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename FPType>\nstruct Average:\npublic binary_function<FPType,\
  \ FPType, FPType> { // 查看 Item 40\nFPType operator()(FPType val1, FPType val2) const\n\
  {\nreturn average(val1, val2);\n}\n};\n```\n\n\n\n\n\n```cpp\nInputIter2 begin2,\
  \ ostream& s)\n{\n    transform(\n        begin1, end1, begin2,\n        ostream_iterator<typename\
  \ iterator_traits<InputIter1>::value_type>(s, \"\\n\"),\n        Average<typename\
  \ iterator_traits<InputIter1>::value_type>()\n    );\n}\n```\n\n每个编译器应该接受这段修改后的代码。此外，`transform`\
  \ 内部对 `Average::operator()` 的调用是可以内联的，这对于上述 `average` 的实例化是不可能的，因为 `average` 是一个函数模板，而不是函数*对象*。\n\
  \n因此，作为算法参数的函数对象提供的不仅仅更高的效率。在让代码编译方面它们也更健壮。当然，真正的函数很有用，但在有效的 STL 编程中，函数对象通常更有用。\n\
  \n### 条目 47：避免产生只写代码\n\n假设你有一个 `vector<int>`，你想删除 vector 中所有值小于 `x` 且出现在最后一个至少大于\
  \ `y` 的值之后的元素。以下代码会立刻跳入你的脑海吗？\n\n点击此处查看代码图片\n\n```cpp\nvector<int> v;\nint x, y;\n\
  ...\nv.erase(\n    remove_if(find_if(v.rbegin(), v.rend(),\n    bind2nd(greater_equal<int>(),\
  \ y)).base(),\n    v.end(),\n    bind2nd(less<int>(), x)),\n    v.end());\n```\n\
  \n一条语句，任务搞定。清晰且直观。没问题，对吧？\n\n嗯，让我们退后一步考虑一下。这在你看来是合理的、可维护的代码吗？“不！”大多数 C++ 程序员尖叫道，声音里充满了恐惧和厌恶。“是！”少数人尖叫道，带着显而易见的喜悦。问题就在于此。一个程序员对表现力纯洁性的愿景，在另一个程序员看来可能是来自地狱的恶魔信件。\n\
  \n在我看来，上面的代码有两个值得担忧的原因。首先，它是函数调用的“鼠窝”。为了让你明白我的意思，这里是同一个语句，但将所有函数名都替换成了 `f*n`，每个\
  \ `n` 对应一个函数：\n\n```cpp\nv.f1(f2(f3(v.f4(), v.f5(), f6(f7(), y)).f8(), v.f9(), f6(f10(),\
  \ x)), v.f9());\n```\n\n这看起来不自然地复杂，因为我移除了原始示例中的缩进，但我认为可以说，任何涉及 10 个不同函数的 12 次函数调用的语句，大多数\
  \ C++ 软件开发者都会认为是过度的。在 Scheme 等函数式语言中长大的程序员可能会有不同，，根据我的经验，大多数在看原始代码时眼睛都不眨一下的程序员都具有深厚的函数式编程背景。大多数\
  \ C++ 程序员缺乏这种背景，因此除非你的同事精通深度嵌套函数调用的方法，否则像上面 `erase` 调用这样的代码几乎肯定会困惑下一个被迫理解你所写内容的人。\n\
  \n这段代码的第二个缺点是需要深厚的 STL 背景知识才能理解它。它使用了不那么常见的 `find` 和 `remove` 的 `_if` 形式，它使用了反向迭代器（参见条目\
  \ 26），它将 `reverse_iterator` 转换为 `iterator`（参见条目 28），它使用了 `bind2nd`，它创建了匿名函数对象，并采用了\
  \ `erase-remove` 惯用法（参见条目 32）。经验丰富的 STL 程序员可以轻松地接受这种组合，但多得 C++ 开发者在还没看上一口之前就会眼花了。如果你的同事精通\
  \ STL 技巧，那么在一条语句中使用 `erase`、`remove_if`、`find_if`、`base` 和 `bind2nd` 可能没问题，但如果你希望你的代码能让更主流背景的\
  \ C++ 程序员理解，我鼓励你将其拆解为更容易消化的块。\n\n这是你可以采取的一种方法。（注释不仅仅是为了这本书。我也会把它们写在代码里。）\n\n点击此处查看代码图片\n\
  \n```cpp\ntypedef vector<int>::iterator VecIntIter;\n\n// 初始化 rangeBegin 指向最后一个\n\
  // 大于等于 y 的值之后的元素。如果没有这样的\n// 值，则将 rangeBegin 初始化为 v.begin()。如果该值的最后一次\n// 是 v 中的最后一个元素，则将\
  \ rangeBegin 初始化为 v.end()。\nVecIntIter rangeBegin = find_if(v.rbegin(), v.rend(),\n\
  bind2nd(greater_equal<int>(), y)).base();\n\n// 从 rangeBegin 到 v.end()删除所有值小于 x\
  \ 的元素\nv.erase(remove_if(rangeBegin, v.end(), bind2nd(less<int>(), x)), v.end());\n\
  ```\n\n这仍然可能会困惑一些人，因为它依赖对 `erase-remove` 惯用法的理解，但在代码中的注释和良好的 STL 参考书之间（..\n\n\n\n\
  \n\n软件工程中有一句真理：代码被阅读的次数远多于编写的次数。同样确定，软件在维护上花费的时间远多于开发时间。无法被阅读和理解的软件就无法维护，而无法维护的软件几乎没有存在的价值。你对\
  \ STL 使用得越频繁，对它就越熟悉，也就越倾向于嵌套函数调用并随手创建函数对象。这本身没有错，但务要记住，你今天编写的代码在未来的某一天会被某人阅读——可能是你自己。为那一天做好准备吧。\n\
  \n使用 STL，没错。要用好它，要高效地使用。但要避免产生“只写不读”的代码。从长远来看，这种代码一点也不高效。\n\n### 第 48 条：始终 `#include`\
  \ 适当头文件\n\nSTL 编程中的微小挫败感之一是，很容易编写出在某个平台上可以通过编译，但在其他平台上需要额外 `#include` 指令的软件。这种烦恼源于：C++\
  \ 标准（与 C 标准不同）没有规定标准头文件必须或可以被其他标准头文件 `#include`。由于存在这种灵活性，不同的实现者选择了不同的做法。\n\n为了让你对这在实践中意味着什么有个直观感受，有一天我对五个\
  \ STL 平台（我们称之为 A、B、C、D 和 E），花了一点时间向它们投一些测试程序，看看我可以省略哪些标准头文件仍然获得成功编译。这间接告诉我哪些头文件\
  \ `#include` 了其他头文件。我的发现如下：\n\n- 在 A 和 C 上，`<vector> #include` 了 `<string>`。\n-\
  \ 在 C 上，`<algorithm> #include` 了 `<string>`。\n- 在 C 和 D 上，`<iostream> #include`\
  \ 了 `<iterator>`。\n- 在 D 上，`<iostream> #include` 了 `<string>` 和 `<vector>`。\n- 在\
  \ D 和 E 上，`<string> #include` 了 `<algorithm>`。\n- 在五个实现中，`<set> #include` 了 `<functional>`。\n\
  \n除了 `<set> #include` `<functional>` 情况之外，我没有找到让缺失头文件的程序通过实现 B 的。根据墨菲定律，你总会在 A、C、D\
  \ 或 E 这样的平台上开发，而总是要迁移到 B 这样的平台，尤其是当迁移压力最大而完成时间最少的时候。理所当然。\n\n但不要因为你的迁移烦恼归怪你的编译器或库实现。如果你缺少了必要的头文件，那是你的错。每当你引用\
  \ `std` 命名空间的元素时，你就有责任 `#include` 适当的头文件。如果你省略了它们，你的代码可能仍然编译，但你仍然缺少必要的头文件，其他 STL\
  \ 平台可能会理所当然地拒绝你的代码。\n\n为了帮助你记住需要，这里是每个标准 STL 相关头文件中内容的简要总结：\n\n- 几乎所有的容器都定义在同名的头文件中，例如\
  \ `vector` 定义在 `<vector>` 中，`list` 定义在 `<list>` 中，以此此类推。例外是 `<set>` 和 `<map>`。`<set>`\
  \ 同时定义了 `set` 和 `multiset`，`<map>` 同时定义了 `map` 和 `multimap`。\n- 除了四个算法外，所有算法都定义在\
  \ `<algorithm>` 中。例外是 `accumulate`、`inner_product`、`adjacent_difference` 和 `partial_sum`。这些算法定义在\
  \ `<numeric>` 中。\n- 特殊类型的迭代器，包括 `istream_iterator` 和 `istreambuf_iterator`（见第 29\
  \ 条），定义在 `<iterator>` 中。\n- 标准函数对象（例如 `less<T>`）和函数对象适配器（例如 `not1`、`bind2nd`）定义在\
  \ `<functional>` 中。\n\n每当你使用头文件中的任何组件时，请确保提供相应的 `#include` 指令，即使你的开发平台允许你跳过它。你的勤将在将在发现迁移到不同平台时，通过减少压力获得回报。\n\
  \n### 第 49 条：学会解读 STL 相关的编译器诊断信息\n\n定义特定大小的 `vector` 是完全合法的，\n\n```cpp\nvector<int>\
  \ v(10); // 创建一个大小为 10 的 vector\n```\n\n并且 `string` 的行为非常像 `vector`，所以你可能期望能够这样做：\n\
  \n```cpp\nstring s(10); // 尝试创建一个大小为 10 的 string\n```\n\n这无法通过编译。没有接受 `int` 参数的\
  \ `string` 构造函数。我的一个 STL 平台这样告诉我：\n\n```cpp\nexample.cpp(20) : error C2664: '__thiscall\
  \ std::basic_string<char,struct\nstd::char_traits<char>,class std::allocator<char>\n\
  >::std::basic_string<char,struct std::char_traits<char>,class\nstd::allocator<char>\
  \ >(const class std::allocator<char> &)' : cannot convert\nparameter 1 from 'const\
  \ int' to 'const class std::allocator<char> &'\nReason: cannot convert from 'const\
  \ int' to 'const class std::allocator<char>'\n```\n\n没有构造函数接受源类型，或者构造函数重载解析存在义。这不奇妙吗？消息的第一部分看起来像是一只猫在键盘上走过，第二部分神秘地引用了源代码中提到的分配器，而第三部分则说构造函数调用是错误的。第三部分当然是准确的，但让我们关注注意力放在“\
  \ feline”的结果上，因为它代表了你经常看到的诊断。\n\n实际上，`string` 并不是类，它是一个 `typedef`。具体来说，它是以下类型的定义：\n\
  \n```cpp\nbasic_string<char, traits<char>, allocator<char> >\n```\n\n`string` 的\
  \ C++ 概念与上面编译器诊断中使用的非常接近，但不同编译器使用的不同。我使用的另一个 STL 平台以这种方式引用 `string`：\n\n```cpp\n\
  basic_string<char,string_char_traits<char>,__default_alloc_template<false,0> >\n\
  ```\n\n名称 `string_char_traits` 和 `__default_alloc_template` 不是标准的，但生活如此。某些 STL 实现偏离了标准。大多数编译器引用\
  \ `basic_string` 类型（少数编译器足够在诊断中使用 `string` 名称）。通常，此类诊断会明确指出 `basic_string`（以及相关的辅助模板\
  \ `char_traits` 和 `allocator`）位于 `std` 命名空间中，因此看到 `string` 产生这种类型并不常见：\n\n```cpp\n\
  std::basic_string<char, std::char_traits<char>, std::allocator<char> >\n```\n\n\
  这与上面编译器诊断中使用的非常接近，但不同编译器使用的不同。无论编译器诊断如何引用 `string` 类型，将诊断还原为有意义的内容的技术都是：全局将 `basic_string`\
  \ 乱码替换为文本“`string`”。如果你使用命令行编译器，通常用用 `sed` 程序或 `perl`、`python` 或 `ruby` 等脚本语言轻松做到。在上面的例子中，我们全局将\n\
  \nstd::basic_string<char,struct std::char_traits<char>,class std::allocator<char>\
  \ >\n\n替换为 `string`，我们得到：\n\n```cpp\nexample.cpp(20) : error C2664: '__thiscall\
  \ string::string(const class\nstd::allocator<char> &)' : cannot convert parameter\
  \ 1 from 'const int' to\n'const class std::allocator<char> &'\n```\n\n\n\n\n这清楚地表明（或者至少更清楚了）问题出在传递给\
  \ `string` 构造函数的参数类型上。尽管仍然存在对 `allocator<char>` 的神秘引用，但你很容易查阅 `string` 的构造函数形式，并发现并不存在一个只接受大小的构造函数。\n\
  \n顺便说一下，对分配器出现神秘引用的原因是，每个标准容器都有一个只接受分配器的构造函数。对于 `string` 来说，它是三个可以带一个参数调用的构造函数之一，但由于某种原因，编译器认为你正尝试调用的是那个接受分配器的版本。编译器判断错了，导致诊断信息也具有误导性。没办法吧。\n\
  \n至于那个只接受分配器的构造函数，请不要使用它。该构造函数很容易导致类型相同但分配器不等价的容器。通常情况下，这很糟糕。非常糟糕。要找出原因，请参阅第 11\
  \ 条。\n\n现在让我们处理一个更具挑战性的诊断信息。假设你正在实现一个电子邮件程序，允许用户通过昵号而不是电子邮件地址来引用他人。例如，这样的程序可以使“The\
  \ Big Cheese”成为美国总统电子邮件的同义词（恰好是 president@whitehouse.gov）。该程序可能会使用一个从昵称到电子邮件地址的\
  \ map，并可能提供一个成员函数 `showEmailAddress` 来显示与给定昵称关联的电子邮件地址：\n\n点击此处查看代码图片\n\n```cpp\n\
  class NiftyEmailProgram {\nprivate:\n    typedef map<string, string> NicknameMap;\n\
  \    NicknameMap nicknames; // map from nicknames to-// email addresses\npublic:\n\
  \    ...\n    void showEmailAddress(const string& nickname) const;\n};\n```\n\n\
  在 `showEmailAddress` ，你需要找到特定昵称关联的 map 项，因此可能会这样写：\n\n点击此处查看代码图片\n\n```cpp\nvoid\
  \ NiftyEmailProgram::showEmailAddress(const string& nickname) const\n{\n    ...\n\
  \    NicknameMap::iterator i = nicknames.find(nickname);\n    if (i != nicknames.end())\
  \ ...\n    ...\n}\n```\n\n编译器不喜欢这种做法，而且这很有道理，但原因并不显而易见。为了帮助你弄清楚，这里有一个 STL 平台热心提供的输出：\n\
  \n点击此处查看代码图片\n\n```cpp\nexample.cpp(17) : error C2440: 'initializing' : cannot convert\
  \ from 'class std::_Tree<class\nstd::basic_string<char,struct std::char_traits<char>,class\
  \ std::allocator<char> >,struct\nstd::pair<class std::basic_string<char,struct std::char_traits<char>,class\n\
  std::allocator<char> > const ,class std::basic_string<char,struct\nstd::char_traits<char>,class\
  \ std::allocator<char> > >,struct std::map<class\nstd::basic_string<char,struct\
  \ std::char_traits<char>,class std::allocator<char> >,class\nstd::basic_string<char,struct\
  \ std::char_traits<char>,class std::allocator<char> >,struct\nstd::less<class std::basic_string<char,struct\
  \ std::char_traits<char>,class\nstd::allocator<char> > >,class std::allocator<class\
  \ std::basic_string<char,struct\nstd::char_traits<char>,class std::allocator<char>\
  \ > > >::_Kfn,struct std::less<class\nstd::basic_string<char,struct std::char_traits<char>,class\n\
  std::allocator<char> > >,class\nstd::allocator<class std::basic_string<char,struct\n\
  std::char_traits<char>,class\nstd::allocator<char> > > >::const_iterator' to 'class\
  \ std::_Tree<class\nstd::basic_string<char,struct std::char_traits<char>,class std::allocator<char>\
  \ >,struct\nstd::pair<class std::basic_string<char,struct std::char_traits<char>,class\n\
  std::allocator<char> > const ,class std::basic_string<char,struct\nstd::char_traits<char>,class\
  \ std::allocator<char> > >,struct std::map<class\nstd::basic_string<char,struct\
  \ std::char_traits<char>,class std::allocator<char> >,class\nstd::basic_string<char,struct\
  \ std::char_traits<char>,class std::allocator<char> >,struct\nstd::less<class std::basic_string<char,struct\
  \ std::char_traits<char>,class\nstd::allocator<char> > >,class std::allocator<class\
  \ std::basic_string<char,struct\nstd::char_traits<char>,class\nstd::allocator<char>\
  \ > > >::_Kfn,struct std::less<class\nstd::basic_string<char,struct std::char_traits<char>,class\n\
  std::allocator<char> > >,class\nstd::allocator<class std::basic_string<char,struct\n\
  std::char_traits<char>,class\nstd::allocator<char> > > >::const_iterator'\n```\n\
  \n\n\n这条信息更短了，但并没有更清晰。我们需要对 `_Tree` 做些处理。由于 `_Tree` 是一个特定实现的模板，了解其模板参数含义的唯一方法是阅读源代码，而且在非必要的情况下，没有理由去翻找特定实现的源码。让我们尝试简单地将传递给\
  \ `_Tree` 的所有内容替换为 `SOMETHING`，看看得到什么。结果是这样的：\n\n```cpp\nexample.cpp(17) : error\
  \ C2440: 'initializing' : cannot convert from 'class\nstd::_Tree<SOMETHING>::const_iterator'\
  \ to 'class\nstd::_Tree<SOMETHING>::iterator'\nNo constructor could take the source\
  \ type, or constructor overload\nresolution was ambiguous\n```\n\n这是我们可以着手的内容。编译器正在抱怨我们正试图将某种\
  \ `const_iterator` 转换为 `iterator`，这显然违反了 `const` 正确性。让我们再次看看这段有问题的代码，我高亮了引起编译器愤怒的那行：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass NiftyEmailProgram {\nprivate:\n    typedef map<string,\
  \ string> NicknameMap;\n    NicknameMap nicknames;\npublic:\n    ...\n    void showEmailAddress(const\
  \ string& nickname) const;\n};\n\nvoid NiftyEmailProgram::showEmailAddress(const\
  \ string& nickname) const\n{\n    ...\n    NicknameMap::iterator i = nicknames.find(nickname);\n\
  \    if (i != nicknames.end()) ...\n    ...\n}\n```\n\n唯一合理的解释是，我们正试图用 `map::find`\
  \ 返回的 `const_iterator` 来初始化 `i`（它是一个 `iterator`）。这看起来很奇怪，因为我们是在 `nicknames` 上调用的\
  \ `find`，而 `nicknames` 是一个非 `const` 对象。因此 `find` 应该返回一个非 `const`迭代器。\n\n再看。是的，`nicknames`\
  \ 被声明为非 `const map`，但 `showEmailAddress` 是一个 `const` 成员函数，而在 `const` 成员函数内部，类的所有非静态数据成员都会变成\
  \ `const`！在 `showEmailAddress` 内部，`nicknames` *确实*是一个 `const map`。突然间，错误信息变得合理了。我们正试图为一个我们承诺过不修改的\
  \ map 生成一个 `iterator`。要解决这个问题，我们要么让 `i` 变成 `const_iterator`，要么让 `showEmailAddress`\
  \ 变成一个非 `const` 成员函数。这两个解决方案可能都比弄清错误信息的含义要简单。\n\n在本节中，我展示了通过文本替换来降低错误信息的复杂性，但一旦你练习了一段时间，你大多数时候都能在脑中完成这些替换。我不是音乐家（我连打开收音机都有困难），但我听优秀的音乐家可以一眼看谱几个小节；他们不需要看单个音符。丰富的\
  \ STL 程序员也会培养出类似的技能。他们可以在内部将像 `std::basic_string<char,struct std::char_traits<char>,class\
  \ std::allocator<char> >` 这样的内容翻译为 `string`，而无需思考。你也会具备这种技能，但在那之前，请记住你几乎总是可以通过将长的模板类型名称替换为更短的助记符，将编译器诊断简化为可以理解的内容。在很多情况下，你只需要将\
  \ `typedef` 展开替换为你已经在使用的 `typedef` 名称即可。这就是我们在将 `std::map<class string,class string,struct\
  \ std::less<class string >,class std::allocator<class string > >` 替换为 `NicknameMap`\
  \ 时所做的。\n\n这里是其他可以帮助你理解 STL 相关信息的提示：\n\n- 对于 `vector` 和 `string`，迭代器有时是指针，如果你在迭代器上犯了错，编译器可能会引用指针类型。例如，如果你的源代码引用了\
  \ `double`iterator`，有时会提到 `double*`。（注意的是当你使用的是 STLport 实现且运行调试模式时。在这种情况下，`vector`\
  \ 和 `string` 迭代器一定是指针。关于 STLport 及其调试模式的更多信息，请参阅第 50 节。）提到 `back_insert_iterator`、`front_insert_iterator`\
  \ 或 `insert_iterator` 通常意味着你在调用 `back_inserter`、`front_inserter` 或 `inserter` 时犯了错。（`back_inserter`\
  \ 返回一个 `back_insert_iterator` 类型的对象，`front_inserter` 返回一个 `front_insert_iterator`\
  \ 类型的对象，而 `inserter` 返回一个 `insert_iterator` 类型的对象。关于这些插入器的使用信息，请参阅第 30 节。）如果你没有调用这些函数，那么你调用的某个函数（直接或间接地）调用了它们。\n\
  \n- 同样，如果你收到提到 `binder1st` 或 `binder2nd` 的消息，你可能在使用 `bind1st` 或 `bind2nd` 时犯了错。（`bind1st`\
  \ 返回一个 `binder1st` 类型的对象，`bind2nd` 返回一个 `binder2nd` 类型的对象。）\n\n- 输出迭代器（例如 `ostream_iterator`,\
  \ `ostreambuf_iterator`）负责输出或插入，如果在这些迭代器类型上犯了错，你可能会收到关于某个从未见过的赋值运算符的消息。为了让你明白我的意思，尝试编译这段代码：\n\
  \n```cpp\nvector<string*> v;\ncopy(v.begin(), v.end(), ostream_iterator<string>(cout,\
  \ \"\\n\"));\n```\n\n- 如果你收到的错误信息源自 STL 算法实现的内部（即导致产生错误的源代码位于 `<algorithm>` 中），那么你尝试与该算法使用的类型可能存在问题。例如，你可能传递了分类错误的迭代器。要查看此类错误是如何报告的，可以通过向编译器喂送以下代码来学习（并娱乐）一下：\n\
  \n```cpp\nlist<int>::iterator i1, i2; // 将双向迭代器传递给\n// 需要随机访问迭代器的算法\nsort(i1, i2);\n\
  ```\n\n\n\n\nSGI 的 STL 网站位居首位，这并非偶然。它为 STL 的每一个组件都提供了详尽的文档。对于许多程序员来说，无论他们使用哪种 STL\
  \ 平台，这个网站都是他们的在线参考手册。（这些参考文档由 Matt Austern 编写，他后来在自己的著作 *Generic Programming and\
  \ the STL* [4 ] 中对其进行了扩展和润色。）这里的内容不仅涵盖了 STL 组件本身。例如，《Effective STL》对 STL 容器线程安全性的讨论（参见\
  \ 第 12 节 ）就是基于 SGI STL 网站对该主题的处理方法。\n\nSGI 网站还为 STL 程序员提供了其他东西：一个可以免费下载的 STL 实现。该实现仅被移植到了少数编译器，但\
  \ SGI 分发版也是广泛移植的 STLport 分发版的基础，稍后我将对其进行详细介绍。此外，SGI 的 STL 实现提供了许多非标准组件，这些组件可以让 STL\
  \ 编程变得更加强大、灵活且有趣。其中最主要的包括以下：\n\n- **哈希关联容器** `hash_set`、`hash_multiset`、`hash_map`\
  \ 和 `hash_multimap`。关于这些容器的更多信息，请参见 第 25 节 。\n\n- **单链表容器** `slist`。它的实现方式正如你想象的那样，迭代器指向你预期的列表节点。遗憾的是，这使得实现\
  \ `insert` 和 `erase` 成员函数的代价变得非常高昂，因为这两个操作都需要调整迭代器所指向节点*前一个* 节点的 `next` 指针。在双向链表（例如标准的\
  \ `list` 容器）中，这不是问题，但在单链表中，“向回”移动一个节点是一个线性时间操作。对于 SGI 的 `slist`，`insert` 和 `erase`\
  \ 消耗的是线性时间而非常数时间，这是一个相当缺点。SGI 通过非标准（但是常数时间的）成员函数 `insert_after` 和 `erase_after`\
  \ 解决了这个问题。SGI 提到：\n\n> 如果你发现 `insert_after` 和 `erase_after` 不能满足你的需求，并且你经常需要在列表中间使用\
  \ `insert` 和 `erase`，那么你应该使用 `list` 而不是 `slist` 。\n\nDinkumware 也提供了一个名为 `slist`\
  \ 的单链表容器，但它使用了不同的迭代器实现，保留了 `insert` 和 `erase` 的常数性能。关于 Dinkumware 的更多信息，请参考 附录 B\
  \ 。\n\n- **用于极大字符串的 `string`-类容器**。该容器被称为 `rope`，因为绳子是一种重型字符串，难道你没发现吗？SGI 是这样描述\
  \ `rope` 的：\n\n> Ropes 是一种可扩展的字符串实现：它们专为涉及字符串整体的高效操作而设计。赋值、拼接和子串提取等操作所需的时间与字符串长度几乎无关。与\
  \ C 字符串不同，rope 是非常长字符串（如编辑缓冲区或邮件信息）的合理表示。\n\n在底层，`rope` 被实现为引用计数子字符串的树，每个子字符串都存储为\
  \ `char` 数组。`rope` 接口的一个有趣方面是 `begin` 和 `end` 成员函数始终返回 `const_iterator`。这是为了劝阻客户端执行修改单个字符的操作。此类操作是非常昂贵的的。`rope`\
  \ 针对涉及整个字符串的操作（例如上述赋值、拼接和提取子串）进行了优化；而单字符操作的性能较差。\n\n- **各种非标准函数对象和适配器**。原始的 HP STL\
  \ 实现包含了比标准 C++ 更多的函数对象类。在老牌 STL 黑客中，最令他们遗念的两个类是 `select1st` 和 `select2nd`，因为它们在处理\
  \ `map` 和 `multimap` 时非常有用。给定一个 `pair`，`select1st` 返回其第一个分量，`select2nd` 返回其第二个分量。这些非标准函数对象类模板可以如下使用：\n\
  \n点击此处查看代码图片\n\n```cpp\nmap<int, string> m;\n\n...\n\n// 将 map 的所有 key 写入 cout\n\
  transform(m.begin(), m.end(),\nostream_iterator<int>(cout, \"\\n\"),\nselect1st<map<int,\
  \ string>::value_type>() );\n\n// 创建一个 vector 并 map 中的所有值拷贝到其中\nvector<string> v;\n\
  transform(m.begin(), m.end(), back_inserter(v),\nselect2nd<map<int, string>::value_type>()\
  \ );\n```\n\n如你所见，`select1st` 和 `select2nd` 让你能够在可能需要自己编写循环的地方轻松调用算法（参见 第 43 节 ），但如果你使用了这些函数对象，它们是非标准的这一事实让你面临编写不可移植且不可维护代码的指责（参见\
  \ 第 47 节 ）。\n\nSGI 的其他非标准函数对象包括 `identity`、`project1st`、`project2nd`、`compose1`\
  \ 和 `compose2`。要了解这些的作用，你必须访问网站。到目前，我希望已经清楚访问 SGI 网站是非常值得的。\n\nSGI 的库实现超出了 STL。他们的目标是开发\
  \ C++ 库的完整实现，除了继承自 C 的。（SGI 假设你已经有了标准 C 库。）结果，SGI 另一个值得下载的是 iostream 库实现。正如你所料，该实现与\
  \ SGI 的 STL 集成良好，但其性能优于许多 iostream 实现。\n\n#### STLport 网站\n\nSTLport 的主要卖点是它提供了一个修改过的\
  \ SGI STL 实现（包括 iostream 等），已移植到 20 多个编译器。与 SGI 库一样，STLport 是免费提供的。如果你正在编写必须在多个平台上运行的代码，通过标准化\
  \ STLport 实现并使用它，可能会省去大量的麻烦。\n\nSTLport 对 SGI 代码库的大部分修改专注于提高可移植性，但我知道它的 STL 还提供了“调试模式”来帮助检测对\
  \ STL 的不当使用——这些使用可以通过编译会导致未定义的运行时行为。例如 第 30 节 使用这个例子讨论了越界容器边界的常见错误：\n\n点击此处查看代码图片\n\
  \n```cpp\nint transmogrify(int x); // 该函数从 x\n\n// 产生一个新值\n\nvector<int> values;\n\
  \n... // 将数据放入 values\n\nvector<int> results;\n\ntransform(values.begin(), values.end(),\
  \ // 这将尝试写入\n\nresults.end(), // 超越 results 的结束！\n\ntransmogrify);\n```\n\n这段代码可以通过编译，但在运行时会产生未定义的结果。如果你运气好，在调用\
  \ `transform` 内部会发生可怕的事情，调试问题将相对直接。如果你运气不好，`transform` 的调用会破坏你地址空间中的某些数据，但你直到以后才会发现。那时，确定内存损坏的原因将是——该说呢呢——*挑战性的*\
  \ 。\n\n\n\n\nSTLport 的调试模式几乎消除了这一挑战。当执行上述对 `transform` 的调用时，会生成以下消息（假设 STLport 安装在\
  \ `C:\\STLport` 目录下）：\n\n```\nC:\\STLport\\stlport\\stl\\debug\\_iterator.h:265\
  \ STL assertion failure :\n_Dereferenceable(*this)\n```\n\n程序随后会停止，因为 STLport 调试模式在遇到使用错误时会调用\
  \ `abort`。如果你更倾向于抛出异常而不是终止，可以配置 STLport 以按照你的方式进行操作。\n\n诚然，上面的错误信息并不像理想中那样清晰，而且报告的文件和行号对应的是内部\
  \ STL 断言的位置，而不是调用 `transform` 的那行代码，这很遗憾，但这仍然比直接跳过 `transform` 的调用，然后试图找出为什么你的数据结构损坏了要好得多。有了\
  \ STLport 的调试模式，你只需要启动调试器并回溯调用堆栈回到你编写的代码中，然后确定你哪里做错了。找到产生问题的源源代码通常不是问题。\n\nSTLport\
  \ 的调试模式可以检测多种常见错误，包括向算法传递无效范围、尝试从空容器中读取、将一个容器的迭代器作为第二个容器成员函数的参数等。它通过让迭代器及其容器相互跟踪来实现这一魔术。给定两个迭代器，因此可以检查它们是否来自同一个容器，并且当容器被修改时，可以使适当的迭代器集合失效。\n\
  \n由于 STLport 在调试模式下使用了特殊的迭代器实现，`vector` 和 `string` 的迭代器是类对象而不是原始指针。因此，使用 STLport\
  \ 并在调试模式下编译是确保没有人在处理这些容器类型的指针和迭代器区别时粗心大意的好方法。单是此点就足够让你尝试一下 STLport 的调试模式了。\n\n##\
  \ Boost 网站\n\n1997 年，当导致 C++ 国际标准的进程敲响终场钟时，一些人对他们提倡的库功能没有被录入而感到失望。这些人中有些人就是委员会的成员，因此他们着手在第二轮标准化期间为标准库的添加奠定基础。结果就是\
  \ Boost，一个网站，其使命是“提供免费的、经过同行评审的 C++ 库。重点是与 C++ 标准库良好协作的可移植库。”这一使命背后有一个动机：\n\n> 只要一个库在某种程度上成为“既有实践”，有人在未来标准化中提出它的可能性就会增加。将库提交给\
  \ [Boost.org](http://Boost.org) 是建立既有实践的一种方式……\n\n换句话说，Boost 将自己作为一种筛选机制，帮助在涉及标准\
  \ C++ 库的潜在添加项时“去伪存真”。这是一项值得的服务，我们都应该感激之。\n\n另一个值得感激的原因是你在 Boost 中发现的库集合。我不会尝试在这里描述它们所有的，这很大程度上是因为由于当你读到这些文字时，无疑已经添加了新的库。然而，对于\
  \ STL 用户来说，有两类库特别相关。第一类是智能指针库，其特点是 `shared_ptr`，这是一种引用计数智能指针的模板，与标准库的 `auto_ptr`\
  \ 不同，它可以被安全地存储在 STL 容器中（参见 第 8 条 ）。Boost 的智能指针库还提供了 `shared_array`，这是一种用于动态分配数组的引用计数智能指针，但\
  \ 第 13 条 认为动态分配数组优于 `vector` 和 `string`，我希望你觉得它的论点很有说服力。\n\nBoost 对 STL 粉丝的第二个吸引力是大量与\
  \ STL 相关的函数对象及其设施。这些库对 STL 函数对象和适配器背后的思想进行了重新设计和重新实现，结果消除了许多人为限制标准函数对象实用性的限制。作为此类限制的例子，你会发现如果你尝试使用\
  \ `bind2nd` 配合 `mem_fun` 或 `mem_fun_ref`（参见 第 41 条 ）将对象绑定到成员函数的参数，且该成员函数通过引用获取其参数，那么你的代码可能无法编译。如果你尝试将\
  \ `not1` 或 `not2` 配合 `ptr_fun` 以及一个声明引用参数的函数，也会发现同样的情况。两种情况下的原因都是在模板实例化期间，大多数 STL\
  \ 平台会生成一个引用的引用，而引用的引用在 C++ 中是不合法的。（标准化委员会正在考虑修改标准以解决这个问题。）这里是一个所谓的“引用的引用问题”的示例：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Widget {\npublic:\n...\nint readStream(istream& stream);\
  \ // readStream 通过\n... // 引用获取参数\n}; // \nvector<Widget*> vw;\n...\nfor_each( //\
  \ 大多数 STL 平台\nvw.begin(), vw.end(), // 尝试生成一个\nbind2nd (mem_fun (&Widget::readStream),\
  \ cin) // 引用的引用\n); // 调用；此类代码\n// 将无法编译\n```\n\nBoost 的函数对象避免了这个问题或其他问题，此外它们扩展了函数对象的表达能力。\n\
  \n如果你对函数的潜力感兴趣并想进一步探索，请立即前往 Boost。如果你厌恶函数对象并认为它们的存在仅仅是为了安抚少数由 Lisp 辩护者转变为 C++ 程序员的人，无论如何也请前往\
  \ Boost。Boost 的函数对象库非常重要，但它们只占了在该网站上能找到的内容的一小部分。\n\n## 参考文献\n\n下的大多数出版物在书中被引用，尽管许多引用仅出现在致谢中。未引用的出版物使用项目符号而非编号。\n\
  \n考虑到互联网 URL 的不稳定性，我在将它们包含在参考文献之前犹豫了。最后，我决定，即使一个 URL 在你尝试时已经失效，知道文档曾经存在于何处应该帮助你在不同的\
  \ URL 找到它。\n\n### 我写的\n\n[1] Scott Meyers, *Effective C++: 50 Specific Ways to Improve\
