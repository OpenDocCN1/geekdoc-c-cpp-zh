  - Gerd Hoeren\n- Jeff Jackson\n- Nancy L. Urbano\n\n### **人物**\n\nKathy Reed 负责了我的编程启蒙；她真的不该忍受像我这样的孩子。当我还没有任何记录时，Donald\
  \ French 就对我开发和展示 C++ 材料的能力充满信心。他还向我介绍了我在 Addison-Wesley 的编辑 John Wait，这一举我将永远不忘。Beaver\
  \ Ridge 的“三剑客”——Jayni Besaw、Lorri Fields 和 Beth McKee——在我写书的间隙为我提供了数不尽的娱乐。\n\n我的妻子\
  \ Nancy L. Urbano 在我写书、继续写书、一直写书期间忍受了我、忍受了我忍了我。她听过多少次我说等书写完我们就去做那些事？现在书写完了，我们会去做的。她令我惊讶。我爱她。\n\
  \n最后，我必须感谢我们的小狗 Persephone，她的存在永远地改变了我们的世界。没有她，这本书会完成得更快，睡眠剥夺也更少，但也会少很多幽默调剂。\n\n\
  ## **引言**\n\n对于 C++ 程序员来说，这是一个令人振奋的时代。尽管 C++ 面世不到十年，但它已成为几乎所有主要计算平台上系统编程的首选语言。面临挑战性编程问题的公司和个人越来越多地接受这种语言，而那些不使用\
  \ C++ 的人面临的问题通常是*何时*开始，而不是*是否*。C++ 的标准化已经完成，其配套库的广度和深度既掩盖又涵盖了 C 语言，使得人们可以在不牺牲移植性或无需从零实现常用算法和数据结构的情况下，编写丰富且复杂的程序。C++\
  \ 编译器不断涌现，它们提供的功能不断扩展，生成的代码质量也在不断提高。用于 C++ 开发的工具和环境日益丰富、强大和健壮。商业库几乎消除了在许多应用领域编写代码的需求。\n\
  \n\n\n\n\n随着语言的成熟以及我们对它经验的增加，我们对相关信息的需求也发生了变化。在 1990 年，人们想知道 C++*是什么*。到 1992 年，他们想知道*如何*让它运行起来。现在，C++\
  \ 程序员提出了更高层次的问题：我该如何设计软件以适应未来的需求？如何在不牺牲代码正确性或不增加使用难度的前提下，提高代码的效率？我该如何实现语言没有直接支持的复杂功能？\n\
  \n在本书中，我回答了这些以及许多类似的问题。\n\n本书展示了如何设计和实现*更有效*的 C++ 软件：它们更有可能表现得正确；在面对异常时更健壮；更高效；更具可移植性；能更好地利用语言特性；能更优雅地适应变化；在混合语言环境中运行更好；更容易正确地使用；更难被错误地使用。简而言之，就是*更更好*的软件。\n\
  \n书中的内容分为 35 个项目（Items）。每个项目总结了 C++ 编程社区对特定主题的积累智慧。大多数项目以指南的形式出现，每条指南随附的说明描述了为什么存在该指南、如果你不遵循会发生什么，以及在什么情况下即使违反指南也是有意义的。\n\
  \n项目分为几类。有些涉及特定的语言特性，特别是你可能较少经验的新特性。例如，项目 9 到 15 专门讨论异常。其他项目则解释了如何结合语言特性以实现更高层次的目标。例如，项目\
  \ 25 到 31 描述了如何限制对象的数量或位置、如何创建对多一个对象类型起起“虚拟”作用的函数、如何创建“智能指针”等。还有其他项目涉及更宽泛的话题；项目\
  \ 16 到 24 关注效率。无论特定项目的主题是什么，每个项目对该主题都采取了务不虚虚的方法。在*More Effective C++*中，你将学习如何*更有效地使用*C++。构成大多数\
  \ C++ 教籍大部分内容的语言特性描述，在书中仅作为背景信息。\n\n这种方法的意义是，在阅读本书之前，你应该已经熟悉 C++。我默认你理解类、保护级别、虚函数和非虚函数等，并假设你已经熟悉模板和异常背后的概念。同时，我不要求你成为语言专家，因此在探究\
  \ C++ 较不为人知的角落时，我总是会解释发生了什么。\n\n## *More Effective C++* 中的 C++\n\n我在本书中描述的 C++ 是\
  \ 1998 年 C++ 国际标准所规范的语言。这意味着我可能会使用一些你的编译器尚未支持的特性。别担心。我假设你拥有的唯一“新”特性是模板，而模板现在几乎随处可用。我也使用了异常，但这种用法很大程度上局限于\
  \ 项目 9 到 15，这些项目专门用于讨论异常。如果你无法使用提供异常的编译器，那没关系。这不会影响你利用书中其他部分内容的能力。此外，即使你不支持异常，也应该阅读\
  \ 项目 9 到 15，因为这些项目研究了你在任何情况下都需要理解的问题。\n\n我承认，仅仅因为委员会批准了某个特性或认可了某种实践，并不能保证该特性出现在当前的编译器中，或者该实践适用于现有环境。当面对理论（委员会所说的）与实践（实际有效的）之间存在差异时，我会两者都讨论，尽管我更倾向于有效的方法。正因为我讨论了两者，当你的编译器逐渐符合标准时，这本书将为你提供帮助。它将教你如何使用现有的结构来近似你的编译器尚未支持的语言特性，并在决定将变通方案转换为新支持的特性时，它将为你提供指导。\n\
  \n注意，我提到的是你的*编译器*——复数。不同的编译器对标准的近似实现不相同，因此我鼓励你至少在两个编译器下开发代码。这样做有助于你避免无意中依赖于某个厂商的专有语言扩展或其对标准的误读。它还将帮助你远离编译器技术的最前沿，例如仅由一个厂商支持的新特性。此类特性通常实现得很糟糕（有\
  \ bug 或运行缓慢——往往两者兼有），并且在引入之初，C++ 社区缺乏经验来就如何使用它们提供建议。开路可能令人兴奋，但当你的目标是产生可靠的代码时，最好的方法通常是让别人先试水，再跳进去。\n\
  \n在书中你会看到两种你可能不熟悉的结构。它们都是较晚期的语言扩展。某些编译器支持它们，但如果你的编译器不支持，你可以轻松地用已有的特性来近似它们。\n\n第一个结构是\
  \ `bool` 类型，其值为关键字 `true` 和 `false`。如果你的编译器还没有实现 `bool`，有两种方法可以近似它。其中一种是使用全局枚举：\n\
  \n```cpp\nenum bool { false, true };\n```\n\n这允许你根据 `bool` 或 `int` 来重载函数，但它的缺点是内置比较运算符（如\
  \ `==`、`<` 等）仍然返回 `int`。结果是下面的代码将不会按预期运行：\n\n点击此处查看代码图像\n\n```cpp\nvoid f(int);\n\
  \nvoid f(bool);\n\nint x, y;\n\n...\n\nf( x < y ); // 调用 f(int)，但本应调用 f(bool)\n\
  ```\n\n因此，枚举近似可能会导致代码提交给支持 `bool` 的编译器时发生变化。\n\n另一种方法是为 `bool` 使用 `typedef` 并为 `true`\
  \ 和 `false` 使用常量对象：\n\n```cpp\ntypedef int bool;\n\nconst bool false = 0;\n\nconst\
  \ bool true = 1;\n```\n\n这兼容 C 和 C++ 的传统语义，且使用这种近似方法的程序移植到支持 `bool` 的编译器时行为不会改变。缺点是在重载函数时无法区分\
  \ `bool` 和 `int`。两种近似都是合理的。选择适合你情况的一种。\n\n第二个结构实际上是结构，即转换形式 `static_cast`、`const_cast`、`dynamic_cast`\
  \ 和 `reinterpret_cast`。如果你不熟悉这些转换，你可能需要转向项目 2 并详细阅读它们。它们的功能比它们所取代的 C 风格转换要得多，而且做得更好。每当我需要进行转换时，我在书中中使用这些新的转换形式。\n\
  \n\n\n\nC++ 的内容不仅是语言本身，还包括标准库。在可能的情况下，我使用标准的 `string` 类型而不是原始的 `char*` 指针，我也鼓励你这么这样做。`string`\
  \ 对象的处理难度并不比基于 `char*` 的字符串大，而且它们可以让你免于大部分关于内存管理的烦恼。此外，如果抛出异常，`string` 对象更不容易发生内存泄漏（参见第\
  \ 9 条 和 第 10 条）。一个实现良好的 `string` 类型在效率竞争中完全可以与 `char*` 等效物相抗，甚至可能表现更好。（若需了解这可能的原因，请参见第\
  \ 29 条。）如果你无法使用标准 `string` 类型的实现，你几乎肯定可以使用*某些*类似于 `string` 的类。使用它吧。几乎任何东西都比原始的 `char*`\
  \ 好。\n\n只要可能，我就会使用标准库中的数据结构。这些数据结构源自标准模板库（即“STL”——参见第 35 条）。STL 包含了 bitset、vector、list、queue、stack、map、set\
  \ 等，你应该优先使用这些标准化的数据结构，而不是你可能想编写的临时替代品。你的编译器可能没有内置 STL，但不要让这阻碍你使用它。感谢 Silicon Graphics\
  \ 公司，你可以从 SGI STL 网站下载一个适用于许多编译器的免费版本：[`http://www.sgi.com/tech/stl/`](http://www.sgi.com/tech/stl/)。\n\
  \n如果你目前正在使用一个算法和数据结构库并且对其很满意，那么没必要因为它是“标准的”就去切换到 STL。然而，如果你在使用 STL 组件和从零编写自己的代码之间做出选择，你应该倾向于使用\
  \ STL。还记得代码复用吗？STL（以及标准库的其他部分）有很多非常值得复用的代码。\n\n## 约定与术语\n\n在书中每当我提到继承，指的都是公共继承。如果我指的不是公共继承，我会明确说明。在绘制继承层次结构时，我通过从派生类指向基类的箭头来描绘基-派生关系。例如，这里是第\
  \ 31 条 中的一个层次结构：\n\n![image](img/Image00019.jpg)\n\n这种表示法与我在《Effective C++》第一版（但不是第二版）中采用的约定相反。现在我深信，大多数\
  \ C++ 实践者绘制的是从派生类指向基类的继承箭头，我很乐意效仿。在类图中，抽象类（例如 `GameObject`）被涂了阴影，而具体类（例如 `SpaceShip`）是不带阴影的。\n\
  \n继承产生了两种不同类型的指针和引用：*静态类型*和*动态类型*。指针或引用的静态类型是它的*声明*类型。动态类型由它实际上*引用*的对象的类型决定。以下是基于上述类的几个示例：\n\
  \n点击此处查看代码图像\n\n```\nGameObject *pgo = // pgo 的静态类型是\n\nnew SpaceShip; // GameObject*,动态\n\
  \n// 类型是 SpaceShip*\n\nAsteroid *pa = new Asteroid; // pa 的静态类型是\n\n// Asteroid*.\
  \ 它的\n\n// 动态类型也是\n\npgo = pa; // pgo 的静态类型是\n\n// （并且始终）\n\n// GameObject*. 它的\n\
  \n// 动态类型现在是\n\n// Asteroid*\n\nGameObject& rgo = *pa; // rgo 的静态类型是\n// GameObject，动态\n\
  \n// 类型是 Asteroid\n```\n\n这些示例展示了一种我喜欢的命名约定。`pgo` 是指向 `GameObject` 的指针；`pa` 是指向\
  \ `Asteroid` 的指针；`rgo` 是指向 `GameObject` 的引用。我经常以此方式构造指针和引用的名称。\n\n我最喜欢的两个参数名是 `lhs`\
  \ 和 `rhs`，分别是“左侧”（left-hand side）和“右侧”（right-hand side）的缩写。为了理解这些名字的原理，考虑一个表示有理数的类：\n\
  \n```\nclass Rational { ... };\n```\n\n如果我想写一个函数来比较两个 `Rational` 对象，我会这样声明它：\n\n\
  ```\nbool operator==(const Rational& lhs, const Rational& rhs);\n```\n\n这就能让我写出这样的代码：\n\
  \n```\nRational r1, r2;\n\n...\n\nif (r1 == r2) ...\n```\n\n在 `operator==` 的调用内部，`r1`\
  \ 出现在 `==` 的左侧并绑定到 `lhs`，而 `r2` 出现在 `==` 的右侧并绑定到 `rhs`。\n\n我使用的其他缩写还包括用于“构造函数”的\
  \ *ctor*、用于“析构函数”的 *dtor* 以及 C++ 支持运行时类型识别的 *RTTI*（其中 `dynamic_cast` 是最常用的组件）。\n\
  \n当你分配了内存但未能释放时，就会产生内存泄漏。内存泄漏在 C 和 C++ 中都会发生，但在 C++ 中，内存泄漏的不只是内存。这是因为 C++ 会自动调用构造函数，而构造函数可能会分配资源。例如，考虑这段代码：\n\
  \n点击此处查看代码图像\n\n```\nclass Widget { ... }; // 某些类 无论是什么\n\nWidget *pw = new SpaceShip;\
  \ // GameObject*,动态\n```\n\n这段代码泄漏了内存，因为 `Widget` 从未被删除。为了强调 C++ 中的内存泄漏往往泄漏其他资源，我通常称为*资源泄漏*（例如文件描述符、信号量、句柄等）。\n\
  \n你在书中看不到很多内联函数。这并不是因为我不喜欢内联。相反，我相信内联函数是 C++ 的一个重要特性。然而，判断一个函数是否应该内联的标准可能是复杂的、微妙的取决于平台的。因此，除非我有关于内联的要点，否则我避免使用内联。当你在《Effective\
  \ C++》中看到非内联函数时，并不意味着认为将该函数声明为 `inline` 是个坏主意，只是内联的决定跟我讨论的内容无关。\n\n某些 C++ 特性被标准化委员会*废用*了。这些特性被计划从语言中移除，因为已经添加了新特性可以实现废用特性的功能，而且做得更好。在书中，我识别了废用构造并解释了哪些特性取代了它们。你应该尽量避免废用特性，但不必对其使用过度担心。为了维护客户的后兼容性，编译器供应商可能会支持废用特性很多年。\n\
  \n\n\n\n在讨论类或函数模板以及从它们生成的类或函数时，我保留了对模板与其实例化之间的区别进行不严谨的权利。例如，如果 `Array` 是一个带有类型参数\
  \ `T` 的类模板，我可能会将模板的某个特定实例化称为 `Array`，尽管 `Array<T>` 实际上是类的名称。同样，如果 `swap` 是一个带有类型参数\
  \ `T` 的函数模板，我可能会将某个实例化称为 `swap` 而不是 `swap<T>`。在这种简写方式可能导致歧义的情况下，我会在引用模板实例化时带上模板参数。\n\
  \n## 报告错误、提出建议、获取书籍更新\n\n我已尽力使这本书尽可能准确、易读且实用，但我知道它还有改进空间。如果你发现任何种类的错误——技术上的、语法上的、拼写上的，或其他任何——请告诉我。我将尝试在书的后续印刷中纠正这些错误；如果你是第一个报告错误的人，我将乐意将你的名字加入书的致谢中。如果你有其他的改进建议，我也非常欢迎。\n\
