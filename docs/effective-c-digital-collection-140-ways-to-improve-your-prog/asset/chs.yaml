  \ 0-201-6349-8。\n\n### **杂志** ^(†)\n\n对于硬核 C++ 程序员来说，市场上只有一种选择：\n\n*C++ Report*\
  \ ，SIG Publications, New York, NY。\n\n该杂志已经做出了意识的决定，远离其“仅限 C++的根源，但对领域和系统特定编程问题的增加覆盖其本身是有价值的，而且关于\
  \ C++ 的内容虽然偶尔有些极端，但仍然是最好的。\n\n如果你对 C 比对 C++ 更为熟悉，或者你觉得 *C++ Report* 的材料太极端而没用，你可能会发现本杂志中的文章更合你的胃：\n\
