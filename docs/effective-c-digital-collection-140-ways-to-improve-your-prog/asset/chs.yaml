  \nItem 16 解释了，`vector` 并不总是。） 类似的 `insert` 都会失效，因为 Item 16 解释了，除非你使用的容器中失效。   `insert`\
  \  失效失效，ItemItem 16  解释了，除非你使用的容器中失效。 类似的 `insert` 都会失效，因为 Item 16 解释了，除非你使用的容器中失效。\
  \ \n\n（由于原文后半部分存在严重的文本重复，译文已根据指令进行去重处理，仅保留核心语义逻辑。）\n\n\n\n如果你觉得 `typedef` 的封装特性对你来说毫无意义，你可能仍然会欣赏它们能节省的工作，特别是对于迭代器类型。例如，如果你有一个类型为如下的对象\n\
  \n点击此处查看代码图像\n\n```cpp\nmap<string,\nvector<Widget>::iterator,\nCIStringCompare>\
  \ // CIStringCompare 是“不区分大小\n// 的字符串比较；”\n\n// Item 19 描述了它\n```\n\n并且你想使用 `const_iterator`\
  \ 遍历这个 map，你真的想再多写几遍 `map<string, vector<Widget>::iterator, CIStringCompare>::const_iterator`\
  \ 吗？当你使用了一段时间的 STL 后，你就会发现 `typedef` 是你的朋友。\n\n`typedef` 仅仅是某种其他类型的别名，因此它提供的封装纯粹是词法上的。`typedef`\
  \ 不会阻止客户端执行（或依赖）任何他们原本无法执行（或无法依赖）的操作。如果你想限制客户端接触你所做的容器选择，你需要更强大的武器。你需要 `classes`。\n\
  \n为了限制在用一种容器类型替换另一种容器类型时可能需要修改的代码，请将容器隐藏在类中，并限制通过类接口可见的容器特定信息。例如，如果你需要创建一个客户列表，不要直接使用\
  \ `list`。相反，创建一个 `CustomerList` 类，并将 `list` 隐藏在它的私有部分：\n\n点击此处查看代码图像\n\n```cpp\n\
  class CustomerList {\nprivate:\n    typedef list<Customer> CustomerContainer;\n\
  \    typedef CustomerContainer::iterator CCIterator;\n    CustomerContainer customers;\n\
  public: // 限制通过此接口可见的\n... // list 特定的信息\n}; // 接口\n```\n\n起初，这可能看起来很愚蠢。毕竟一个客户列表就是一个\
  \ `list`，对吧？嗯，也许吧。后来你可能会发现你不需要像预想的那样频繁在列表中间插入或删除客户，但你确实需要快速识别前 20% 的客户——这项任务是 `nth_element`\
  \ 算法量身定制的（参见 Item 31）。但 `nth_element` 要求随机访问迭代器。它无法用于 `list`。在这种情况下，你的客户“列表”可能实现为\
  \ `vector` 或 `deque` 更好。\n\n当你考虑这种更改时，你仍然需要检查每个 `CustomerList` 成员函数和每个 `friend`，查看它们将如何受到影响（在性能以及迭代器/指针/引用失效等方面），但如果你在封装\
  \ `CustomerList` 的实现细节方面做得足够好，那么对 `CustomerList` 客户端的影响将应该是很小的。*你*无法编写与容器无关的代码，但*它们*也许可以。\n\
  \n### Item 3: 使容器中对象的拷贝变得廉价且正确\n\n容器持有对象，但并不是持有你提供给它们的那些对象。相反，当你向容器添加一个对象时（例如通过\
  \ `insert` 或 `push_back` 等），进入容器的是你指定的对象的*拷贝*。\n\n一旦对象进入容器，它被进一步拷贝的情况并不罕见。如果你向 `vector`、`string`\
  \ 或 `deque` 中 `insert` 某些东西或从从中 `erase` 某些东西，现有的容器元素通常会被移动（拷贝）多次（参见 Items 5 和 14）。如果你使用任何排序算法（参见\
  \ Item 31）；`next_permutation` 或 `previous_permutation`；`remove`、`unique` 或它们的同类算法（参见\
  \ Item 32）；`rotate` 或 `reverse` 等，对象将被移动（拷贝）多次。是的，拷贝对象是 STL 的方式。\n\n你可能对所有这些拷贝是如何完成的感兴趣。这很简单。对象是通过使用它的拷贝成员函数拷贝的，特别是它的*拷贝*构造函数和它的*拷贝*赋值运算符。（起得很巧妙的名字，不是吧？）对于像\
  \ `Widget` 这样的用户自定义类，这些函数传统上声明如下：\n\n点击此处查看代码图像\n\n```cpp\nclass Widget {\npublic:\n\
  ...\n    Widget(const Widget&); // 拷贝构造函数\n    Widget& operator=(const Widget&);\
  \ // 拷贝赋值运算符\n...\n};\n```\n\n一如既往，如果你没有自己声明这些函数，编译器会为你声明。也如既往，内置类型（例如 `int`、指针等）的拷贝是通过简单地拷贝底层位来实现。（关于拷贝构造函数和赋值运算符的细节，请咨询任何关于\
  \ C++ 的入门书籍。在《Effective C++》中，Items 11 和 27 关注于这些函数的行为。）\n\n在所有这些拷贝发生之后，这种做法的动机现在应该很明确了。如果拷贝对象是昂贵的，将此类对象放入容器可能会成为瓶颈。由于所有这些拷贝的发生，这现在应该很清晰。此外，如果对于某些对象“拷贝”具有不寻常含义，将对象放入容器将不可避免地导致麻烦。\n\
  \n在存在继承的情况下，当然，拷贝会导致切片（slicing）。也就是说，如果你创建一个基类对象的容器并尝试从中插入派生类对象，对象的派生性将消失，因为对象是通过基类构造函数拷贝到容器的：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<Widget> vw;\n\nclass SpecialWidget: // SpecialWidget\
  \ 继承自\nWidget { ... };\n\nSpecialWidget sw;\n\nvw.push_back(sw); // sw 作为基类对象拷贝\n\
  ```\n\n切片问题表明，将派生类插入基类对象容器几乎总是错误的。如果你希望结果像派生类对象（例如调用派生类函数），它总是是错误的。（关于切片的更多背景，请咨询《Effective\
  \ C++》，Item 22 。关于 STL 中的另一个示例，请参见 Item 38。）\n\n为了在避免这些头疼问题的同时规避效率、正确性和切片问题，使拷贝变得高效、正确且对切片问题免疫的一种简单方法是创建*指针*的容器而不是对象的容器。也就是说，不是创建一个\
  \ `Widget` 容器，而是创建一个 `Widget*` 容器。拷贝指针很快，结果总是如你所期的（拷贝位位），指针拷贝时不会切片。不幸的是，指针容器有它们与\
  \ STL 相关的头疼问题。你可以在 Items 7 和 33 中阅读它们。当你寻求避免这些头疼问题的同时解决效率、正确性和切片担忧时，你可能会发现智能指针容器是一个很有吸引力的选项。要了解更多关于该选项的信息，请看\
  \ Item 7 。\n\n如果这一切听起来像 STL 在疯狂拷贝，请再想一下。是的，STL 进行了大量的拷贝，但它通常设计为避免*不必要的*拷贝。事实上，它通常设计为避免*不必要地创建*对象。将这与\
  \ C 语言 C++ 唯一的内置容器——低微的数组的行为进行对比：\n\n点击此处查看代码图像\n\n```cpp\nWidget w[maxNumWidgets];\
  \ // 创建一个大小为 maxNumWidgets 的数组\n\n// Widgets，默认构造每一个\n```\n\n\n\n这会构造 `maxNumWidgets\
  \ Widget` 对象，即使我们通常只预期使用其中几个，或者我们预期会立即用从其他地方（例如文件）获取的值来覆盖每个默认构造的函数值。通过使用 STL 而不是数组，我们可以使用一个需要时会自动增长的\
  \ `vector`：\n\n点击此处查看代码图片\n\n```cpp\nvector<Widget> vw; // 创建一个包含零 Widget 的 vector\n\
  \n// 对象将根据需要进行扩展\n```\n\n我们也可以创建一个空的 `vector`，它包含足够的空间来容纳 `maxNumWidgets` 个 `Widget`，但还没有构造任何\
  \ `Widget`：\n\n点击此处查看代码图片\n\n```cpp\nvector<Widget> vw;\n\nvw.reserve(maxNumWidgets);\
  \ // 关于 reserve 的细节请参阅 Item 14\n```\n\n与数组相比，STL 容器要文明得多。它们只根据你要求的数量创建对象（通过拷贝），只有在你指示它们执行时才执行，并且只有在你说明它们应该这样做时才使用默认构造函数。是的，STL\
  \ 容器会进行拷贝，是的，你确实理解这一点，但不要忽视这样一个事实：它们仍然是比数组的一大进步。\n\n### Item 4：调用 `empty` 而不是检查\
  \ `size()` 是否为零\n\n对于任何容器 `c`，编写\n\n\n\n```cpp\nif (c.size() == 0) ...\n```\n\n\
  本质上等同于编写\n\n```cpp\nif (c.empty()) ...\n```\n\n既然如此，你可能会疑惑为什么一种构造方式优于另一种，特别是考虑到\
  \ `empty` 通常被实现为一个内联函数，它简单地返回 `size` 是否返回 0。\n\n你应该倾向于使用 `empty` 构造，原因很简单：对于所有标准容器，`empty`\
  \ 都是常数时间操作，但对于某些 `list` 实现，`size` 可能需要线性时间。\n\n但是什么让 `list` 变得如此麻烦呢？为什么它不能同样提供常数时间的\
  \ `size` ？答案在很大程度上取决于 `list` 独特的拼接（splice）函数的范围形式。考虑这段代码：\n\n点击此处查看代码图片\n\n```cpp\n\
  list<int> list1;\nlist<int> list2;\n...\n\nlist1.splice( // 移动 list2 中的所有节点\n  \
  \  list1.end(), list2, // 从第一次出现处\n    find(list2.begin(), list2.end(), 5), // 5\
  \ 到最后一个\n    find(list2.rbegin(), list2.rend(), 10).base() // 10 出现处到\n); // list1\
  \ 的结尾。关于 \"base()\" 调用的信息请参阅 Item 28\n```\n\n除非 `list2` 在 5 之后的某个地方包含 10，否则这段代码将无法工作，但让我们假设这不是问题。相反，让我们关注这个问题：在拼接之后，`list1`\
  \ 中有多少个元素？显然，拼接后的 `list1` 元素数量与拼接之前一样，加上拼接进它的元素数量。但拼接了多少个元素呢？数量等于 `find(list2.begin(),\
  \ list2.end(), 5)` 和 `find(list2.rbegin(), list2.rend(), 10).base()` 定义范围内的元素数量。好吧，那是多少呢？如果不遍历该范围并计数，就无办法知道。问题就在于此。\n\
  \n假设你负责实现 `list`。`list` 不仅仅是任何容器，它是一个*标准*容器，所以你知道你的类将被广泛使用。你自然地希望你的实现尽可能高效。你认为客户通常想知道\
  \ `list` 中包含多少个元素，所以你希望让 `size` 成为一个常数时间操作。因此，你希望设计 `list` 使其始终知道自己包含多少个元素。\n\n\
  同时，你知道在所有标准容器中，只有 `list` 提供了在不拷贝任何数据的情况下将元素从一个地方移动到另一个地方的能力。你推断，许多 `list` 客户端选择\
  \ `list` 正是因为因为它提供了高效率的拼接。他们知道从一个列表到另一个列表拼接一个范围可以在常数时间内完成，而你知道他们知道这一点，所以你完全想要满足他们对\
  \ `splice` 是常数时间成员函数的预期。\n\n这让你陷入了困境。如果 `size` 是一个常数时间操作，则每个 `list` 成员函数必须更新其所操作列表的大小。这包括\
  \ `splice`。但 `splice` 的范围版本更新其所修改列表大小的唯一方法是让它计算被拼接的元素数量，而这将阻止它实现你对*它*所需的常数时间性能。如果你消除了\
  \ `splice` 范围形式更新其所修改列表大小的要求，`splice` 可以被变为常数时间，但那时 `size` 就变成了一个线性时间操作。通常情况下，它必须遍历整个数据结构来查看包含多少个元素。无论你如何看待，某个东西——`size`\
  \ 还是 `splice` 的范围形式——必须做出妥协。两者可以是常数时间，但不能兼得。不同的实现以不同的方式解决这种冲突，取决于作者优先考虑哪一个。\n\n\
  ### Item 5：优先使用范围成员函数而非单元素等效函数\n\n快！给定两个 `vector` `v1` 和 `v2`，让 `v1` 的内容与 `v2` 的后部分相同的简单方法是什么？当\
  \ `v2` 拥有奇数个元素时，不要纠结“一半”的定义，只需做出合理的。\n\n时间到！如果你的答案是\n\n```cpp\nv1.assign(v2.begin()\
  \ + v2.size() / 2, v2.end());\n```\n\n或者类似的，你将获得满分并获得星星。如果你的答案涉及多个语句，但没有使用任何类型的循环，你将获得接近满，但没有星星。如果你的答案涉及循环，你还有改进空间，如果你的答案涉及多个循环，那么，我们只能说你真的需要这本书。\n\
  \n顺便说一下，如果你对这个问题的*答案*的反应包含了“哈？”，请仔细注意，因为你将学习一些有用的知识。测试的设计是为了两件事。首先，它提供了一个机会提醒你 `assign`\
  \ 成员函数的存在，这是一个被许多程序员忽视的便利工具。它适用于所有序列容器（`vector`、`string`、`deque` 和 `list`）。每当你需要完全替换容器的内容时，都应该考虑赋值。如果你只是将一个容器拷贝到另一个相同类型的容器，`operator=`\
  \ 是赋值函数的首选，但正如本示例所示，当你想给容器一组全新的值时，`assign` 可用的，但 `operator=` 无法实现你想要的。\n\n测试的第二个理由是为了演示为什么范围成员函数优于它们的单元素替代方案。*范围成员函数*是一种像\
  \ STL 算法一样使用两个迭代器参数来指定要执行某些操作的元素范围的成员函数。如果不使用范围成员函数来解决本项开头的问题，你将编写一个显式的循环，可能如下：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```cpp\nvector<Widget> v1, v2; // assume v1 and v2 are vectors\n\
  \n// of Widgets\n\n...\n\nv1.clear();\n\nfor (vector<Widget>::const_iterator ci\
  \ = v2.begin() + v2.size() / 2;\nci != v2.end();\n++ci)\nv1.push_back(*ci);\n```\n\
  \nItem 43 详细探讨了为什么你应该尝试避免编写显式循环，但你不需要阅读那个条目就能看出，编写这段代码比调用 `assign` 要费量得多。正如我们很快将看到的，这个循环恰恰也造成了效率上的惩罚，但我们稍后会再讨论这个问题。\n\
  \n避免循环的一种方法是遵循 Item 43 的建议，改用算法：\n\n```cpp\nv1.clear();\n\ncopy(v2.begin() + v2.size()\
  \ / 2, v2.end(), back_inserter(v1));\n```\n\n编写这段代码仍然比调用 `assign` 要麻烦。此外，尽管这段代码中没有循环，但在\
  \ `copy` 内部确实存在一个循环（参见 Item 43）。结果是，效率惩罚依然存在。我会在下面再次讨论这一点。在此，我想简要地插一句话：几乎所有使用插入迭代器指定目标范围（即通过\
  \ `inserter`、`back_inserter` 或 `front_inserter`）的 `copy` 用法，都可以——*应该*——替换为对范围成员函数的调用。例如，对\
  \ `copy` 的调用可以替换为 `insert` 的范围版本：\n\n```cpp\nv1.insert(v1.end(), v2.begin() + v2.size()\
  \ / 2, v2.end());\n```\n\n这比调用 `copy` 需要的字符稍少，但它更直接地表达了正在发生什么：数据正在被插入 `v1` 中。`copy`\
  \ 的调用也表达了这一点，但没那么直接。它把重点放在了错误的地方。这件事的有趣之处不在于元素正在被复制，而在于 `v1` 正在增加新数据。`insert` 成员函数让这一点清晰可见。`copy`\
  \ 的使用模糊了这一点。元素被复制这件事本身并不有趣，因为 STL 的构建就是基于元素会被复制的假设。复制对于 STL 来说是如此基础，它是书中 Item 3\
  \ 的主题！\n\n太多的 STL 程序员过度使用 `copy`，所以我刚刚给出的建议值得重复：几乎所有使用插入迭代器指定目标范围的 `copy` 用法都应该替换为对范围成员函数的调用。\n\
  \n回到我们的 `assign` 示例，我们已经确定了两个选择范围成员函数而非单元素对应版本的原因：\n\n*   使用范围成员函数编写代码通常更省力。\n*\
  \   范围成员函数倾向于产生更清晰、更直观的代码。\n\n简而言之，范围成员函数产生的代码更容易编写、也更容易理解。这有什么不好的？\n\n唉，有些人会将这些论点归结为编程风格问题，而开发者争论风格问题的热忱丝不亚于争论哪种才是“唯一真编辑器”（好像这还有什么疑问一样。是\
  \ Emacs。）。如果能有一个更通用的标准来确定范围成员函数优于单元素版本的优越性，将非常有帮助。对于标准序列容器，我们有一个标准：效率。在处理标准序列容器时，与实现相同目的范围成员函数相比，单元素成员函数对内存分配器的要求更高，更频繁地复制对象，并且/或者执行冗余操作。\n\
  \n例如，假设你想将一个 `int` 数组拷贝到 `vector` 的头部。（数据可能在数组而不是 `vector` 中，因为数据来自旧的 C API。关于混合\
  \ STL 容器和 C API 时产生的问题，请参见 Item 16）。使用 `vector` 的范围 `insert` 函数，这简直轻而易举：\n\n```cpp\n\
  int data[numValues]; // assume numValues is\n// defined elsewhere\n\nvector<int>\
  \ v;\n\n...\n\nv.insert(v.begin(), data, data + numValues); // 将 data 中的 int \n\
  // 插入到 v 的头部\n```\n\n如果在显式循环中使用迭代调用 `insert`，它看起来可能如下：\n\n```cpp\nvector<int>::iterator\
  \ insertLoc(v.begin());\n\nfor (int i = 0; i < numValues; ++i) {\n    insertLoc\
  \ = v.insert(insertLoc, data[i]);\n    ++insertLoc;\n}\n```\n\n注意我们必须小心保存 `insert`\
  \ 的返回值以便下一次循环迭代，然后增加返回的迭代器。如果我们不在每次插入后都更新 `insertLoc`，就会有两个问题。首先，第一次之后的所有循环迭代都会产生未定义行为，因为每次\
  \ `insert` 调用都会使 `insertLoc`。其次，即使 `insertLoc` 保持有效，我们总会在 vector 的头部插入（即 `v.begin()`），结果就是拷贝到\
  \ `v` 中的 `int` 顺序将是反的。\n\n如果我们遵循 Item 43 的做法，将循环替换为 `copy` 调用，会得到类似这样的：\n\n```cpp\n\
  copy(data, data + numValues, inserter(v, v.begin()));\n```\n\n当 `copy` 模板实例化后，基于\
  \ `copy` 的代码和使用显式循环的代码几乎完全相同，因此为了进行效率分析，我们将关注显式循环，同时记住该分析对于采用 `copy` 的同样同样。观察显式循环有助于理解效率损失从何而来。是的，那是“损失”，复数，因为使用单元素版本\
  \ `insert` 的代码会对你征收多达三种不同的性能税，而如果你使用范围版本，这些你都不需要交。\n\n第一种税是由不函数调用组成的。向 `v` 中逐个插入\
  \ `numValues` 个元素自然会产生 `numValues` 次 `insert` 调用。使用范围版本的 `insert`，你只需支付一次函数调用，节省了\
  \ `numValues-1` 次调用。当然，内联可能会让你免于这项税，但反之，它也可能不会。唯独一点是肯定的。使用范围版本的 `insert`，你绝对不会交它。\n\
  \n\n\n\n内联并不能让你免受第二种税收，即将 `v` 中现有元素低效地移动到其最终插入后位置的代价。每当调用 `insert` 向 `v` 添加新值时，插入点之上的每个元素都必须移动一个位置以为新元素留出空间。因此，位置\
  \ `p` 处的元素必须移动到位置 `p+1`，依此类推。在我们的示例中，我们向 `v` 的头部插入 `numValues` 个元素。这意味着 `v` 中在插入之前的每个元素都将总共向上移动\
  \ `numValues` 个位置。但每次调用 `insert` 时每个元素只向上移动一个位置，因此每个元素总共会被移动 `numValues` 次。如果 `v`\
  \ 在插入前有 `n` 个元素，总共将发生 `n` * `numValues` 次 次移动。在这个示例中，`v` 持有 `int`，因此每次移动可能都会归结为一次\
  \ `memmove` 的调用；但如果 `v` 持有如 `Widget` 类的用户定义类型，则每次移动都会导致对该类型赋值运算符或拷贝构造函数的调用。（大部分调用将针对赋值运算符，但每当向量中的最后一个元素移动时，该移动将通过调用元素的拷贝构造函数完成。）因此，在一般情况下，向持有\
  \ `n` 个元素的 `vector<Widget>` 头部逐个插入 `numValues` 个新对象会产生 `n` * `numValues` 次函数调用的代价：(`n`\
  \ - 1)*`numValues` 次 `Widget` 赋值运算符调用和 `numValues` 次 `Widget` 拷贝构造函数调用。即使这些调用被内联了，你仍然在执行移动\
  \ `v` 中元素 `numValues` 次的工作。\n\n相比之下，标准要求范围 `insert` 函数直接将容器的现有元素移动到它们的最终位置，即每个元素的移动代价为一次移动。总代价是\
  \ `n` 次移动，`numValues` 次调用容器中对象类型的拷贝构造函数，剩余的调用该类型的赋值运算符。与单元素 `insert` 策略相比，范围 `insert`\
  \ 减少了 `n` * (`numValues` -1) 次移动。花点时间思考一下：这意味着如果 `numValues` 是 100，范围形式的 `insert`\
  \ 执行的移动次数比重复调用单元素形式 `insert` 的代码少了 99%！\n\n在我继续讨论单元素成员函数相对于其范围对应函数的第三种效率代价之前，我有一个微小的修正。我在上一段中写的是事实，且完全不虚假，但它并不是全部的真相。只有当范围\
  \ `insert` 函数能够在不丢失位置的情况下确定两个迭代器之间的距离时，它才能通过单次移动将元素移动到其最终位置。这几乎总是可能的，因为所有前向迭代器都提供此功能，而前向迭代器几乎无处不在。标准容器的所有迭代器都提供前向迭代器功能。非标准哈希容器的迭代器也是如此（参见项目\
  \ 25）。作为数组迭代器的指针也提供此类功能。事实上，唯一不提供前向迭代能力的标准迭代器是输入迭代器和输出迭代器。因此，我上面写的所有都是正确的，除非传递给\
  \ `insert` 范围形式的迭代器是输入迭代器（例如 `istream_iterator`——参见项目 6）。仅在这种情况下，范围 `insert` 才被允许一次一次地将元素移动到其最终位置，如果它是这样实现的，那么它在元素移动次数方面的优势就不复存在了。（对于输出迭代器，这个问题不会出现，因为输出迭代器不能用于指定\
  \ `insert` 的范围）。\n\n对那些愚蠢地使用重复单元素插入而不是单次范围插入的人所征取的最后一项性能税与内存分配有关，尽管它也有一个糟糕的拷贝侧面影响。正如项目\
  \ 14 所解释的，当你尝试向一个内存已满的 vector 插入元素时，vector 会分配容量更大的新内存，将其元素从旧内存拷贝到新内存，销毁旧内存中的元素，并释放旧内存。然后它再添加正在插入的元素。项目\
  \ 14 解释解释了，vector 的实现每次在耗尽内存时都会以某些倍数因子增加其容量，因此插入 `numValues` 个新元素通常会导致新内存的分配次数与\
  \ `numValues` 的对数成比例。因此在一个增长率为 1.5 的 vector 中逐个插入 1000 个元素，可能会导致 18 次新分配 ^(†)（包括它们现有的元素拷贝）。相比之下（而且意料之中），范围插入可以在开始插入内容之前计算出它需要多少新内存（假设给定的是前向迭代器），因此它不需要重新分配\
  \ `vector` 的底层内存超过一次。你可以想象，这种节省是非常可的。\n\n我刚刚进行的分析是针对 `vector` 的，同样的推理也适用于 `string`。对于\
  \ `deque`，推理类似，但 `deque` 管理内存的方式与 `vector` 和 `string` 不同，因此关于重复分配的论点并不适用。然而，关于不必要地多次移动元素的论点通常适用，关于函数调用次数的观察也是如此。\n\
  \n在标准序列容器中，只剩下 `list`，但在这里，使用 `insert` 的范围形式比单元素形式也有性能优势。当然，关于重复调用的论点仍然有效，但由于链表的工作方式，拷贝和内存分配问题不会出现。相反，出现了一个新问题：对某些节点的\
  \ `next` 和 `prev` 指针进行重复赋值。\n\n每当向链表添加元素时，持有该元素的列表节点必须设置其 `next` 和 `prev` 指针，而且新节点之前的节点（我们称之为\
  \ B，代表“之前”）必须设置其 `next` 指针，新节点之后的节点（我们称之为 A，代表“之后”）必须设置其 `prev` 指针：\n\n当通过 `list`\
  \ 的单元素 `insert` 逐个添加一系列新节点时，除了最后一个新节点外，每个节点都会两次设置 `next` 指针，一次指向 A，第二次指向在其之后插入元素。每向前插入一个新节点，A\
  \ 都会将其 `prev` 指针指向该新节点。如果在 A 之前插入 `numValues` 个节点，插入节点的 `next` 指针将进行 `numValues`\
  \ -1 次多余赋值，A 的 `prev` 指针也将进行 `numValues` -1 次多余赋值。总而言之，那是 2*(`numValues` -1) 次不必要的指针赋值。指针赋值当然是廉价的，但如果不需要，为什么要为此付出代价呢？\n\
  \n到现在应该很清楚你不需要，而规避这种代价的关键在于使用 `list` 范围形式的 `insert`。因为该函数知道最终将插入多少节点，所以它可以避免多余的指针赋值，对每个指针仅进行一次赋值，将其设置为正确的插入后值。\n\
  \n\n\n对于标准序列容器，在选择单元素插入和范围插入之间做出选择时，涉及的远不仅仅是编程风格问题。对于关联容器，效率方面的优势则较难断定，尽管重复调用单元素\
  \ `insert` 带来的额外函数调用开销问题仍然存在。此外，某些特殊的范围插入也可能为关联容器带来优化的可能性，但据我所知，这类优化目前仅存在于理论。当你读到这里时，当然，理论可能已经变成了实践，因此向关联容器进行范围插入可能确实比重复的单元素插入更高效。而且，它们的效率绝不会*更低*，所以你倾向于使用它们并无损失。\n\
  \n即使不考虑效率这一因素，事实仍然是：使用范围成员函数在编写代码时需要的字数更少，而且生成的代码更易理解，从而增强了你软件的长期可维护性。单这两个特征就足以说服你倾向于使用范围成员函数。效率上的优势仅仅是一个额外奖励。\n\
  \n关于范围成员函数的魅力，我已经啰嗦了这么多，现在为你总结一下它们是恰恰合适的。知道哪些成员函数支持范围，可以让你更容易发现使用它们的机会。在下方的签名中，参数类型\
  \ `iterator` 字面上的意思是容器的迭代器类型，即 `container`::`iterator`。相反，参数类型 `InputIterator` 意味着任何输入迭代器都是可以的。\n\
  \n- **范围构造。** 所有标准容器都提供这种形式的构造函数：\n\n```cpp\ncontainer :: container (InputIterator\
  \ begin, // 范围开始\nInputIterator end); // 范围结束\n```\n\n当传递给此构造函数的迭代器是 `istream_iterator`\
  \ 或 `istreambuf_iterator` 时（参见第 29 项），你可能会遇到 C++ 最令人惊讶的解析，这种解析会导致你的编译器将此构造结构解释为函数声明，而不是新容器对象的定义。第\
  \ 6 节 会告诉你关于该解析你需要的一切信息，包括如何击败它。\n\n- **范围插入。** 所有标准序列容器都提供这种形式的 `insert`：\n\n点击此处查看代码图片\n\
  \n```cpp\nvoid container ::insert(iterator position, // 插入范围的位置\nInputIterator begin,\
  \ // 要插入的范围开始\nInputIterator end); // 要插入的范围结束\n```\n\n关联容器使用其比较函数来确定元素存放的位置，因此它们提供了一个省略位置参数的签名：\n\
  \n```cpp\nvoid container ::insert(InputIterator begin, InputIterator end);\n```\n\
  \n在寻找用范围版本替换单元素 `insert` 方法时，不要忘记某些单元素变体通过采用不同的函数名来伪装自己。例如，`push_front` 和 `push_back`\
  \ 均用于向容器中插入单元素，尽管它们没有命名为 `insert`。如果你看到一个循环调用 `push_front` 或 `push_back`，或者看到诸如\
  \ `copy` 的算法被传递了 `front_inserter` 或 `back_inserter` 作为参数，你就发现了一个范围形式的 `insert` 可能是更优策略的地方。\n\
  \n- **范围删除。** 每个标准容器都提供范围形式的 `erase`，但序列容器和关联容器的返回类型有所不同。序列容器提供：\n\n```cpp\niterator\
  \ container ::erase(iterator begin, iterator end);\n```\n\n而关联容器提供的则是：\n\n```cpp\n\
  void container ::erase(iterator begin, iterator end);\n```\n\n为什么会有区别？这种说法是，让关联容器版本的\
  \ `erase` 返回一个迭代器（指向被删除元素之后的元素）会产生不可接受的性能开销。我是许多认为这种说法是伪善的观点之一，但标准说标准就是标准，而标准说明的是，序列容器和关联容器版本的\
  \ `erase` 具有不同的返回类型。\n\n本节对 `insert` 的大部分效率分析在 `erase` 中也有类似的类比。重复调用单元素 `erase`\
  \ 的函数调用次数仍然大于单次调用范围 `erase`。当使用单元素 `erase` 时，元素值必须逐个位置向其最终位置移动，而范围 `erase` 可以在一次移动中将它们移动到最终位置。\n\
  \n关于 `vector` 和 `string` 的 `insert` 有一个不适用于 `erase` 的论点涉及到重复分配。（当然，对于 `erase` 来说，涉及到重复的*释放*。）这是因为\
  \ `vector` 和 `string` 的内存会自动增长以容纳新元素，当元素数量减少时，它不会自动收缩。（第 17 项 描述了你如何减少 `vector`\
  \ 或 `string` 持有的无必要内存。）\n\n范围 `erase` 一个特别重要的表现是 `erase-remove` 习惯。你可以在第 32 项 中读到关于它的一切。\n\
  \n- **范围赋值。** 正如在本节开头提到的，所有标准序列容器都提供范围形式的 `assign`：\n\n```cpp\nvoid container ::assign(InputIterator\
  \ begin, InputIterator end);\n```\n\n所以你有了三个倾向于范围成员函数而非其单元素对应版本的充分理由。范围成员函数更容易编写，它们能更清晰地表达你的意图，并表现出更高的性能。\n\
  \n### 第 6 项：警惕 C++ 最令人头疼的解析\n\n假设你有一个 `int` 文件，并你想将它们拷贝到 `list` 中。这看起来是一个合理的方法：点击此处查看代码图片\n\
  \n```cpp\nifstream dataFile(\"ints.dat\");\nlist<int> data(istream_iterator<int>(dataFile)),\
  \ // 警告！这不起作用\n```\n\n这段代码可以通过编译，但在运行时，它什么都不会做。它不会从文件中读取任何数据。它甚至不会创建一个 `list`。那是因为第二个语句并没有声明\
  \ `list`，也没有调用构造函数。它所做的是……嗯，它所做的太奇怪了，我不敢直接告诉你，因为你不会相信我的。相反，我必须一点一点地给出这个解释。你坐好了吗？如果没有，你可能想找周围找把椅子……\n\
  \n我们从基础知识开始。这一行声明了一个函数 `f`，它接收一个 `double` 并返回一个 `int`：\n\n```cpp\nint f(double d);\n\
  ```\n\n接下来这一行做了相同的事情。参数名 `d` 周围的括号是多余的且会被忽略：\n\n```cpp\nint f(double (d)); // 与上面相同；d\
  \ 的括号被忽略\n```\n\n下面的行声明相同的函数。它只是省略了参数名：\n\n```cpp\nint f(double); // 与上面相同；参数名被省略\n\
  ```\n\n这三种声明形式你应该已经熟悉，尽管在参数名周围加括号可能对你来说是新的。（在不久前，这对我也是新的。）\n\n我们现在来看另外三个函数声明。第一个声明了一个函数\
  \ `g`，它接收一个参数，该参数是一个指向不接受任何参数并返回 `double` 的函数的指针：\n\n```cpp\nint g(double (*pf)());\n\
  ```\n\n这里另一种相同说法。唯一的区别是 `pf` 使用非指针语法声明（这种语法在 C 和 C++ 中均有效）：\n\n```cpp\nint g(double\
  \ pf()); // 与上面相同；pf 隐式为指针\n```\n\n\n\n一如既常，参数名可以省略，因此这里是 `g` 的第三种声明，它消除了 `pf` 这个名字：\n\
  \n```cpp\nint g(double ()); // 与上述相同；省略了参数名\n```\n\n请注意*参数名周围*的括号（例如 `f` 的第二个声明中的\
  \ `d`）与*独立存在*的括号（如本例所示）之间的区别。参数名周围的括号会被忽略，但独立存在的括号表示参数列表的存在；它们预示着一个本身是函数指针的参数。\n\
  \n在通过这些关于 `f` 和 `g` 的声明热了筋身体后，我们准备好检查本节开头的代码了。它再次出现：\n\n```cpp\nlist<int> data(istream_iterator<int>(dataFile),\n\
  istream_iterator<int>());\n```\n\n做好心理准备。这声明了一个*函数* `data`，其返回类型为 `list<int>`。函数\
  \ `data` 接收两个参数：\n\n- 第一个参数名为 `dataFile`。它的类型是 `istream_iterator<int>`。`dataFile`\
  \ 周围的括号是多余的，会被忽略。\n- 第二个参数没有名字。它的类型是一个指向不接受任何参数并返回 `istream_iterator<int>` 的函数的指针。\n\
  \n很惊人，对吧？但这符合 C++ 中的一条通用规则，该规则说：几乎任何可以被解析为函数声明的内容都会被解析为声明。如果你编写 C++ 有了一段时间，你几乎肯定遇到过这条规则的另一种表现。你见过这种错误多少次了？\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Widget { ... }; // 假设 Widget 有默认构造函数\n\nWidget w();\
  \ // 噢糟糕...\n```\n\n这并没有声明一个名为 `w` 的 `Widget` 对象，而是声明了一个名为 `w` 的函数，它不接受任何参数并返回一个\
  \ `Widget`。学会识别这种*失误*是 C++ 程序员的一项真正入入仪式。\n\n这些都很有趣（以它们自己扭曲的方式），但它们并没有帮助我们表达想说的话，即一个\
  \ `list<int>` 对象应该用文件的内容进行初始化。现在我们知道了需要击败什么样的解析方式，这就很容易表达了。在形式参数声明周围加上括号是不合法的，但在函数调用的参数周围加上括号是合法的，因此通过添加一对括号，我们强制编译器按照我们的方式来看待问题：\n\
  \n点击此处查看代码图像\n\n```cpp\nlist<int> data((istream_iterator<int>(dataFile)), // 注意新的括号\n\
  istream_iterator<int>()); // 包围第一个参数\n// 用于 list 的构造函数\n```\n\n这是声明 `data` 的正确方式，鉴于\
  \ `istream_iterator` 和范围构造函数的实用性（再次，参见 Item 5），知道如何这样做是值得的。\n\n遗憾的是，目前并不是所有的编译器本身都知道这一点。在我测试的几个编译器中，几乎有一半拒绝接受\
  \ `data` 的声明，除非它是*错误地*声明在没有额外括号的情况下声明的！为了安抚此类编译器，你可以翻个白眼，使用我费力解释过的那个错误的 `data` 声明，但这样做既不可移植的，也是短视的。毕竟，目前解析错误的编译器将来肯定会在未来纠正它，对吧？（当然！）\n\
  \n更好的解决方案是跳出 `data` 声明中匿名 `istream_iterator` 对象的流行用法，简单地为这些迭代器命名。以下代码在任何地方都能运行：\n\
  \n点击此处查看代码图像\n\n```cpp\nifstream dataFile(\"ints.dat\");\nistream_iterator<int>\
  \ dataBegin(dataFile);\nistream_iterator<int> dataEnd;\nlist<int> data(dataBegin,\
  \ dataEnd);\n```\n\n这种对命名迭代器对象的使用与常见的 STL 编程风格相反，但你可能认为，为了让代码对编译器和处理代码的人都没有歧义，这个代价是值得的。\n\
  \n### Item 7：使用 `new` 分配的指针容器时，记住在容器销毁之前 `delete` 指针\n\nSTL 中的容器非常智能。它们为正向和反向遍历提供迭代器（通过\
  \ `begin`、`end`、`rbegin` 等）；它们告诉你自己包含什么种类型的对象（通过它们的 `value_type` 类型定义）；在插入和删除期间，它们会处理任何必要的内存管理；它们会报告持有的对象数量以及最多可能包含的数量（分别通过\
  \ `size` 和 `max_size`）；而且，当它们（容器）本身销毁时，它们会自动销毁持有的每个对象。\n\n考虑到这些聪明的容器，许多程序员停止担心清理自己的工作。嘿，他们想道，它们的容器会替他们担。在很多情况下，他们是对的，但当容器持有用\
  \ `new` 分配的对象的*指针*时，他们的想法就不够对了。当然，指针容器在它（容器）销毁时会销毁它包含的每个元素，但指针的“析构函数”是一个空操作！它绝不会调用\
  \ `delete`。\n\n结果，以下代码直接导致了资源泄漏：\n\n点击此处查看代码图像\n\n```cpp\nvoid doSomething()\n{\n\
  vector<Widget*> vwp;\nfor (int i = 0; i < SOME_NUMBER; ++i)\n    vwp.push_back(new\
  \ Widget);\n} // Widget 泄漏了！\n```\n\n当 `vwp` 离开作用域时，`vwp` 的每个元素都会销毁，但这并没有改变从未使用\
  \ `delete` 的事实。这种删除是你的责任，而不是容器的。\n\n通常，你希望它们被删除。在这种情况下，让它发生很容易：\n\n点击此处查看代码图像\n\n\
  ```cpp\nvoid doSomething()\n{\nvector<Widget*> vwp;\nfor(vector<Widget*>::iterator\
  \ i = vwp.begin(); i != vwp.end(); ++i)\n    delete *i;\n}\n```\n\n这可以工作，但前提是你对“工作”并不挑剔。一个问题是，新的\
  \ `for` 循环做了 `for_each` 做的事，但它没有 `for_each` 那么（参见 Item 43）。另一个问题是代码不是异常安全的。如果在填充\
  \ `vwp` 与你执行删除之间抛出了异常，你又泄漏了资源。幸运的是，这两个问题都可以克服。\n\n要将你的类似 `for_each` 的循环转换为真正的 `for_each`，你需要将\
  \ `delete` 转换为函数对象。这是小孩子的游戏，假设你有一个喜欢玩 STL 的孩子：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T>\nstruct DeleteObject: // Item 40 描述了为什么\npublic unary_function<const T*, void>\
  \ { // 这里有继承\n    void operator()(const T* ptr) const\n    {\n        delete ptr;\n\
  \    }\n};\n```\n\n现在你可以这样做：\n\n点击此处查看代码图像\n\n```cpp\nvoid doSomething()\n{\n  \
  \  vector<Widget*> vwp;\n    ... // 与上 same\n    for_each(vwp.begin(), vwp.end(),\
  \ DeleteObject<Widget>());\n}\n```\n\n遗憾的是，这让你必须指定 `DeleteObject` 将删除的对象类型（在本例中为\
  \ `Widget`）。这很烦人。`vwp` 是一个 `vector<Widget*>`，所以*当然* `DeleteObject` 将删除 `Widget*`\
  \ 指针！笨蛋！这种冗余不仅仅是烦人，因为它可能导致难以追踪的错误。假设例如，有人不明智地决定继承 `string`：\n\n```cpp\nclass SpecialString:\
  \ public string { ... };\n```\n\n\n\n\n从一开始这样做是有风险的，因为 `string` 和所有标准 STL 容器一样，缺乏虚析构函数，而公然继承自一个没有虚析构函数的类是\
  \ C++ 中的大忌忌。（详情请参阅任何一本良好的 C++ 书籍。在 *Effective C++* 中，应该查看的是 第 14 条 。）尽管如此，仍然有人会做这种事，所以让我们考虑以下代码的行为如何：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid doSomething()\n{\n    deque<SpecialString*> dssp;\n\
  \    ...\n    for_each(dssp.begin(), dssp.end(), // 未定义行为！通过基类\n    DeleteObject<string>());\
  \ // 删除一个// 派生对象\n} // 类指针处没有\n// 虚析构函数\n```\n\n请注意 `dssp` 被声明为持有 `SpecialString*`\
  \ 指针，但 `for_each` 循环的作者告诉 `DeleteObject` 它将删除 `string*` 指针。很容易理解这种错误是如何产生的。`SpecialString`\
  \ 无疑表现得非常像 `string`，所以如果客户端偶尔忘记了他们在使用 `SpecialString` 而不是 `string`，是可以被原谅的。\n\n\
  我们可以通过让编译器推导出传递给 `DeleteObject::operator()` 的指针类型，来消除这种错误（并减少 `DeleteObject` 客户端所需的击键次数）。我们只需要将模板化从\
  \ `DeleteObject` 移动到它的 `operator()` 中：\n\n点击此处查看代码图像\n\n```cpp\nstruct DeleteObject\
  \ { // 模板化和基\n// 此处删除了类\ntemplate<typename T> // 此处添加了模板化\nvoid operator()(const\
  \ T* ptr) const\n{\n    delete ptr;\n}\n};\n```\n\n编译器知道传递给 `DeleteObject::operator()`\
  \ 的指针类型，因此我们让它们自动实例化一个接受该类型指针的 `operator()`。这种类型推导的缺点是让我们放弃了让 `DeleteObject` 具有适应性的能力（参见\
  \ 第 40 条 ).考虑到 `DeleteObject` 的设计用途，很难想象这会成为什么问题。\n\n使用这个新版本的 `DeleteObject`，`SpecialString`\
  \ 客户端的代码看起来如下：\n\n点击此处查看代码图像\n\n```cpp\nvoid doSomething()\n{\n    deque<SpecialString*>\
  \ dssp;\n    ...\n    for_each(dssp.begin(), dssp.end(),\n    DeleteObject() );\
  \ // 啊！定义良好的行为！\n}\n```\n\n简单直观且类型安全，正是我们喜欢的样子。\n\n但仍然不是异常安全的。如果在 `SpecialString`\
  \ 对象被 `new` 出来之后但在调用 `for_each` 之前抛出异常，就会发生内存泄漏灾难（Leakapalooza）。这个问题可以通过多种方式解决，但最简单的可能是将指针容器替换为*智能指针*容器，通常是引用计数的指针。（如果你不熟悉智能指针的概念，你应该可以在任何一本中级或高级\
  \ C++ 书籍中找到描述。在 *More Effective C++* 中，相关材料位于 第 28 条 .）\n\nSTL 本身不包含引用计数智能指针，而编写一个好的指针——一个始终正确工作的指针——足够复杂，以至于除非必要，否则你不想这样做。我在\
  \ 1996 年的 *More Effective C++* 中发表了引用计数智能指针的代码，尽管它基于已有的智能指针实现并提交给经验开发人员进行了广泛的出版前审查，但多年来仍不断收到小批有效的\
  \ bug 报告。引用计数智能指针失败的微妙方式多得令人惊叹。（详情请参阅 *More Effective C++* 的勘误列表 [28]。）\n\n幸运的是，你不需要编写自己的智能指针，因为经过证明的实现并不难找。一种实现就是\
  \ Boost 库中的 `shared_ptr`（参见 第 50 条）。有了 Boost 的 `shared_ptr`，本节的示例可以重写如下：\n\n点击此处查看代码图像\n\
  \n```cpp\nvoid doSomething()\n{\n    typedef boost::shared_ptr<Widget> SPW; // 使用\
  \ shared_ptr\n    vector<SPW> vwp;\n    for (int i = 0; i < MAGIC_NUMBER; ++i)\n\
  \    vwp.push_back(SPW(new Widget)); // 创建一个 SPW\n    ... // 使用 vwp\n} // 即使上方抛出异常，\n\
  //  true 发生泄漏\n```\n\n你*绝不要*被误导认为可以通过创建 `auto_ptr` 容器来安排指针自动删除。这是一个可怕的想法。\n\n###\
  \ 第 8 条：不要创建 `auto_ptr` 容器\n\n坦率地说，这一条不应该出现在 *Effective STL* 中。`auto_ptr` 容器（COAPs）是被禁止的。尝试使用它们的代码不应该通过编译。C++\
  \ 标准委员会付出了巨大的努力来确保这种情况发生。(†)我不需要对 COAPs 说什么，因为你的编译器对它们有很多话要说，而且全都是负面的。\n\n不幸的是，许多程序员使用未能拒绝\
  \ COAPs 的平台。更不幸，许多程序员在 COAPs 中看到了解决随指针容器常见的内存泄漏问题的简单、直观且高效的解决方案。结果，许多程序员被诱惑使用 COAPs，尽管这本该是不可能的。\n\
  \n但也许你并不是那种可移植性的心态。如果是那样，请允许我提醒你一下拷贝 `auto_ptr` 的独特（某些人认为是怪异的）定义。\n\n\n\n\n当你复制一个\
  \ `auto_ptr` 时，`auto_ptr` 所指向的对象的所有权会转移到复制的 `auto_ptr` 中，而被复制的 `auto_ptr` 将被设置为\
  \ `NULL`。你读得没错：*复制一个 `auto_ptr` 就同于改变了它的值*：\n\n点击此处查看代码图片\n\n```cpp\nauto_ptr<Widget>\
  \ pw1(new Widget); // pw1 指向一个 Widget\n\nauto_ptr<Widget> pw2(pw1); // pw2 指向 pw1\
  \ 指向的 Widget;\n\n// pw1 被设置为 NULL。(Widget 的\n// 所有权从 pw1 转移\n// 到 pw2。)\n\npw1 =\
  \ pw2; // pw1 现在再次指向该 Widget\n//             ; pw2 被设置为 NULL\n```\n\n这确实非常不寻常，也许很有趣，但你（作为\
  \ STL 的用户）之所以关心这一点，是因为它会导致一些*非常*惊讶的行为。例如，考虑这段看起来无害的代码，它创建了一个 `auto_ptr<Widget>`\
  \ 向量，然后使用一个比较所指向的 `Widget` 值的函数对其进行排序：\n\n点击此处查看代码图片\n\n```cpp\nbool widgetAPCompare(const\
  \ auto_ptr<Widget>& lhs,\nconst auto_ptr<Widget>& rhs)\n{\n    return *lhs < *rhs;\
  \ // 对于这个例子，假设\n} // Widgets 存在 operator< 运算符\n\nvector<auto_ptr<Widget> > widgets;\
  \ // 创建一个向量然后填充它\n... // 使用指向 Widgets 的 auto_ptr;\n\n// 记住这不\n// *应该*通过编译！\nsort(widgets.begin(),\
  \ widgets.end(), // 对向量进行排序\nwidgetAPCompare);\n```\n\n这里的一切看起来都是合理的，而且从概念上讲，一切*确实*是合理的，但结果可能并不完全合理。例如，在排序过程中，`widgets`\
  \ 中的一个或多个 `auto_ptr` 可能会被设置为 `NULL`。对向量进行排序可能会改变它的内容！理解这是如何发生的是非常值得的。\n\n这可能是因为实现\
  \ `sort` 的一种方法——事实证明这是一种常用方法——是使用快速排序算法的变体。快速排序的细节不需要我们关心，但基本思想是：为了对容器进行排序，选择容器中的某个元素作为“枢轴元素”，然后对大于和小于或等于枢轴元素的值进行递归排序。在\
  \ `sort` 内部，这种方法可能如下：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<class RandomAccessIterator,\
  \ // 这个声明用于\nclass Compare> // sort 直接复制\nvoid sort(RandomAccessIterator first,\
  \ // 拷贝自标准库\nRandomAccessIterator last,\nCompare comp)\n{\n    // 这个类型别定义在下文中描述\n\
  \    typedef typename iterator_traits<RandomAccessIterator>::value_type\n    ElementType;\n\
  \    RandomAccessIterator i;\n    ... // 让 i 指向枢轴元素\n    ElementType pivotValue(*i);\
  \ // 将枢轴元素拷贝到\n    // 本地临时变量中；参见\n    // 下文讨论\n    ... // 完成剩余的排序工作\n}\n```\n\n\
  除非你是 STL 源代码的资深读者，否则这看起来可能令人敬畏，但其实并没有那么糟糕。唯一棘手的部分是对 `iterator_traits<RandomAccessIterator>::value_type`\
  \ 的引用，这只是 STL 指代传递 `sort` 的迭代器所指向的对象类型的 Fancy 方法。（当我们引用 `iterator_traits<RandomAccessIterator>::value_type`\
  \ 时，必须在它前面加上 `typename`，因为它是依赖于模板参数的类型名称，在这种情况下是 `RandomAccessIterator`。有关此 `typename`\
  \ 用法的更多信息，请参第 7 页。）\n\n上述代码中问题的语句是这一句：\n\n```cpp\nElementType pivotValue(*i);\n\
  ```\n\n因为它将正在排序范围内的一个元素拷贝到了本地临时对象中。在我们的情况下，该元素是一个 `auto_ptr<Widget>`，因此这种拷贝行为会静默地将被拷贝的\
  \ `auto_ptr`——即向量中的那个——设置为 `NULL`。此外，当 `pivotValue` 超作用域时，它会自动删除它指向的 `Widget`。当\
  \ `sort` 调用返回时，向量的内容已经改变，且至少有一个 `Widget` 被删除。可能有多个向量元素被设置为 `NULL` 且多个 `Widget` 被删除，因为快速排序是一个递归算法，所以它很可能在递归的每一层都拷贝了枢轴元素。\n\
  \n这是一个容易掉入的糟糕陷阱，这就是为什么标准化委员会尽力确保你不应该掉入其中。那么，请代表你对他们的工作表示感谢，即永远不要创建 `auto_ptr` 容器，即使你的\
  \ STL 平台允许这样做。\n\n如果你的目标是一个智能指针容器，这并不意味着你没路了。智能指针容器是可以的，并且第 50 项 描述了你可以在哪里找到与 STL\
  \ 容器契合良好的智能指针。只是 `auto_ptr` 并不是这样一种智能指针。\n\n### 第 9 项：谨慎选择删除\n\n假设你有一个持有 `int` 的标准容器\
  \ `c`，你想删除 `c` 中的所有特定值；实现这一任务的方法因容器而异。对于连续容器（`vector`、`deque` 或 `string`——参见第 32\
  \ 项），最佳方法是 `erase-remove` 惯用法：\n\n```cpp\nc.erase(remove(c.begin(), c.end(), value),\
  \ c.end()); // 对于 vector,\n// string 或 deque\n```\n\n这种方法也适用于 `list`，但正如第 44 项 所解释的，`list`\
  \ 的成员函数更高效：\n\n点击此处查看代码图片\n\n```cpp\nc.remove(value); // 当 c 是 list 时使用成员函数\n```\n\
  \n当 `c` 是关联容器（即 `set`、`multiset`、`map` 或 `multimap`）时，使用任何名为 `remove` 的都是完全错误的。这些容器没有名为\
  \ `remove` 的成员函数，使用该算法可能会覆盖容器值。（有关此类损坏，请咨询第 22 项 ，它也解释了为什么在 `map` 和 `multimap` 上尝试使用无法通过编译，而在\
  \ `set` 和 `multiset` 上尝试使用可能无法通过编译。）\n\n不，对于关联容器，处理问题的正确方法是调用 `erase`：\n\n点击此处查看代码图片\n\
  \n```cpp\nc.erase(value); // 当 c 是标准\n// 关联容器时，成员函数是\n// 最佳方法\n```\n\n这不仅做了正确的事，而且对于\
  \ `set` 和 `map` 只需要对数时间，对于 `multiset` 和 `multimap` ，则与指定值的元素数量成线性时间。（基于 `remove`\
  \ 的技术需要与容器元素数量成线性时间。）此外，关联容器 `erase` 成员函数的优势在于基于等价性而非相等性，这一区别的重要性在第 19 项 中有所解释。\n\
  \n现在，让我们稍微修改一下问题。不再是删除 `c` 中具有特定值的每个对象，而是消除每一个以下谓词（参见第 39 项 ）返回 `true` 的对象：\n\n\
  ```cpp\nbool badValue(int x); // 返回 x 是否“坏值”\n```\n\n对于序列容器（`vector`、`string`、`deque`\
  \ 和 `list` ），我们只需要将每个 `remove` 的使用替换为 `remove_if`，就完成了。\n\n\n\n\n\n点击此处查看代码图像\n\n\
  ```cpp\nc.erase(remove_if (c.begin(), c.end(), badValue), c.end()); // this is the\
  \ best way to get rid of objects\n// where badValue \n// returns true when c is\n\
  // a vector, string, or\n// deque\n\nc.remove_if (badValue); // this is the best\
  \ way to get rid of\n// objects where badValue returns\n// true when c is a list\n\
  ```\n\n对于标准关联容器，情况并不那么简单。解决这个问题有两种方法：一种代码更容易编写，另一种效率更高。较简单但效率较低的方案使用 `remove_copy_if`\
  \ 将我们想要的值拷贝到一个新容器中，然后用 `swap` 原容器的内容与新容器交换：\n\n点击此处查看代码图像\n\n```cpp\nAssocContainer\
  \ <int> c; // c is now one of the\n... // standard associative\n// containers\n\
  AssocContainer <int> goodValues; // temporary container\n// to hold unremoved\n\
  // values\nremove_copy_if (c.begin(), c.end(), // copy desired values from c to\n\
  inserter(goodValues, goodValues.end()), // goodValues\nbadValue);\nc.swap (goodValues);\
  \ // swap the contents of c and goodValues\n```\n\n这种方法的缺点是它涉及到拷贝所有未被删除的元素，这种拷贝成本可能超过了我们愿意支付的代价。\n\
  \n我们可以通过直接从原始容器中删除元素来避免这笔开销。然而，由于关联容器没有提供类似于 `remove_if` 的成员函数，我们必须编写一个循环来遍历 `c`\
  \ 中的元素，并在过程中删除元素。\n\n概念\n\n从概念上讲，这个任务是简单的，事实上，代码也很简单。遗憾的是，能够工作的代码往往不是脑海中第一个出来的代码。例如，这是许多程序员首先想到的方案：\n\
  \n点击此处查看代码图像\n\n```cpp\nAssocContainer <int> c;\n...\nfor ( AssocContainer <int>::iterator\
  \ i = c.begin(); // clear, straightforward, and buggy code to\ni != c.end(); //\
  \ erase every element in c where badValue\n++i) { // returns true; don't do this!\n\
  if (badValue(*i)) c.erase(i); \n} // don't do this!\n```\n\n唉，这会导致未定义行为。当容器的元素被\
  \ `erase` 掉时，所有指向该元素的迭代器都会失效。一旦 `c.erase(i)` 返回，`i` 就失效了。这对这个循环来说是个坏消息，因为在 `erase`\
  \ 返回后，`i` 会通过 `for` 循环的 `++i` 部分增加。\n\n为了避免这个问题，我们必须确保在调用 `erase` 之前已经有一个指向 `c`\
  \ 下一个元素的迭代器。最简单的方法是在调用时对 `i` 使用后置自增：\n\n点击此处查看代码图像\n\n```cpp\nAssocContainer <int>\
  \ c;\n...\nfor ( AssocContainer <int>::iterator i = c.begin(); // the 3rd part of\
  \ the for loop is empty; i is now\ni != c.end(); /* nothing */ ) { // incremented\
  \ below\nif (badValue(*i)) c.erase(i++ ); // for bad values, pass the current i\
  \ to erase and increment i as a side effect\nelse ++i ; // for good values, just\
  \ increment i\n} // this approach to erase works\n```\n\n这种调用 `erase` 的方法是有效的，因为表达式\
  \ `i++` 的值是 `i` 的旧值，但作为副作用，`i` 被增加了。因此，我们将 `i` 的旧值（未自增的值）传递给 `erase`，但在 `erase`\
  \ 开始执行之前，我们也增加了 `i` 本身。这正是我们想要的。正如我所说，代码很简单，它并不是大多数程序员第一次尝试时想出来的。\n\n现在让我们进一步完善这个问题。不仅要删除每个\
  \ `badValue` 返回 `true` 的元素，还希望在每次删除元素时向日志文件写入一条消息。\n\n对于关联容器，这再简单不过了，因为只需要对我们刚刚开发的循环进行细微的修改：\n\
  \n点击此处查看代码图像\n\n```cpp\nofstream logFile; // log file to write to\nAssocContainer\
  \ <int> c;\n...\nfor ( AssocContainer <int>::iterator i = c.begin(); i != c.end();\
  \ ) { // loop conditions are the same as before\nif (badValue(*i)) {\nlogFile <<\
  \ \"Erasing \" << *i << '\\n'; // write log file\nc.erase(i++); // erase element\n\
  }\nelse ++i;\n}\n```\n\n现在给我们麻烦的是 `vector`、`string` 和 `deque`。我们不能再使用 `erase-remove`\
  \ 惯用了，因为没有办法让 `erase-remove` 惯用法在关联容器上工作。然而，由于关联容器没有提供类似于 `remove_if` 的成员函数，我们必须编写一个循环来遍历\
  \ `c` 中的元素，并在过程中删除元素。\n\n\n\n\n正如你所看到的，有效地删除容器元素不仅仅是调用 `erase`那么简单。处理此问题的最佳方法取决于你如何识别要删除哪些对象、它们存储的容器类型，以及你在删除它们时想要做什么（如果有任何操作的话）。只要你足够小心并遵循本节（Item）中的建议，就不会遇到任何问题。如果你不小心，就可能会产生效率不必要低下或导致未定义行为的代码。\n\
  \n### 第 10 节：注意分配器的约定和限制\n\n分配器（Allocators）非常奇怪。它们最初被开发为一种内存模型的抽象，目的是让库开发者能够忽略某些\
  \ 16 位操作系统（即 DOS 及其邪恶的产物）中 `near`（近端）和 `far`（远端）指针的区别，但这种努力失败了。分配器的设计是为了便于开发作为完整对象的内存管理器，但事实证明这种方法导致了\
  \ STL 部分部分的效率下降。为了避免这些效率损耗，C++ 标准委员会在标准中增加了一些表述，削弱了分配器作为对象的地位，但同时表达了希望它们在操作过程中不会丧失效能。\n\
  \n事实不仅如此。像 `operator new` 和 `operator new[]` 一样，STL 分配器负责分配（和释放）原始内存，但分配器的客户端接口与\
  \ `operator new`、`operator new[]` 甚至 `malloc` 几乎没有任何相似之处。最后（可能最令人惊讶的是），大多数标准容器*从不向*它们关联分配器请求内存。从不。最终结果就是分配器……嗯，分配器非常奇怪。\n\
  \n当然，这不是它们的错，而且无论如何，这并不意味着它们没用。然而，在我解释分配器有什么用之前（那是 第 11 节 的主题），我需要先解释它们在哪些方面没用。有很多事情分配器*看起来*可以做但实际上做不到，在你尝试开始玩耍之前，了解该领域的边界至关重要。如果你这样做，肯定会受伤。此外，关于分配器的真相如此奇特，仅仅是总结它本身就既具有启发性又有趣。至少我希望是这样。\n\
  \n对分配器的限制列表从它们对指针和引用的遗留类型定义（typedefs）开始。正如我提到的，分配器最初被构想为内存模型的抽象，因此让分配器为它们定义的内存模型提供指针和引用的类型定义是有意义的。在\
  \ C++ 标准中，类型为 `T` 的对象的默认分配器（巧妙地称为 `allocator<T>`）提供了 `allocator<T>::pointer` 和 `allocator<T>::reference`\
  \ 类型定义，并且期望用户定义的分配器也会提供这些类型定义。\n\n老练的 C++ 高手会立即意识到这很可疑，因为在 C++ 中没有办法伪造引用。这样做需要重载\
  \ `operator`（即“点运算符”）的能力，而这是不允许的。此外，创建行为像引用一样的对象是使用*代理对象*（proxy objects）的范例，而代理对象会导致一系列问题。（其中一个问题引申了\
  \ 第 18 节）。关于代理对象的全面讨论，请参阅《More Effective C++》的第 30 节，你可以在那里读到它们何时有效，以及何时不有效。）\n\n\
  在 STL 分配器的情况下，导致指针和引用类型定义失效的并不是代理对象的任何技术缺陷，而是标准明确允许库实现者假设每个分配器的 `pointer` 类型定义都是\
  \ `T*` 的同义词，且每个分配器的 `reference` 类型定义等同于 `T&`。没错，库实现者可以忽略这些类型定义并直接使用原始指针和引用！所以，即使你通过某种方法写出一个成功提供新指针和引用类型的分配器，它也没有任何用，因为你正在使用的\
  \ STL 实现可以自由忽略你的类型定义。很酷，对吧？\n\n当你赞叹标准化中的这一怪癖时，我将介绍另一个。分配器是对象，这意味着它们可以有成员函数、嵌套类型和类型定义（如\
  \ `pointer` 和 `reference` 等），但标准规定，STL 的实现被允许假设相同类型的分配器对象是等价的，并且始终比较相等。随口来说，这听起来并不那么糟糕，而且有充分的理由。考虑这段代码：\n\
  \n```cpp\ntemplate<typename T> // 一个用户定义的分配器\n\nclass SpecialAllocator { ... };\
  \ // 模板\n\ntypedef SpecialAllocator<Widget> SAW; // SAW = \"用于 Widget 的特殊分配器\"\n\
  \nlist<Widget, SAW> L1;\n\nlist<Widget, SAW> L2;\n\n...\n\nL1.splice(L1.begin(),\
  \ L2); // 将 L2 的节点移动到\n// L1 的前面\n```\n\n回想当 `list` 元素从一个 `list` 拼接到另一个 `list` 时，没有任何被复制。相反，调整了几个指针，原本在一个\
  \ `list` 中的节点发现自己位于另一个 `list` 中。这使得 splice 操作既快速又异常安全。在上面的示例中，splice 之前位于 `L2` 中的节点在\
  \ splice 之后位于 `L1` 中。当 `L1` 被销毁时，当然，它必须销毁所有节点（并释放它们的内存），因为它现在包含了原本属于 `L2` 的节点，`L1`\
  \ 的分配器必须释放这些由 `L2` 分配的节点。现在应该清楚为什么标准允许 STL 实现者假设相同类型的分配器是等价的。如果不能这样假设，splice 操作的实现将更加困难且效率低下。（splice\
  \ 操作的存在也影响 STL 的其他部分。另一个例子，请参见第 4 节。）\n\n这些都很好，但你越是思考，就越会意识到，STL 实现可以假设相同类型的分配器是等价的这一限制是多么严酷。这意味着可移植分配器对象——即在不同\
  \ STL 实现下都能正常工作的分配器——可能没有状态。让我们明确这一点：这意味着*可移植分配器可能不能有任何非静态数据成员*，至少不能有任何影响其行为的成员。没有。全无。这意味着，例如，你不能有一个从一个堆分配内存的\
  \ `SpecialAllocator<int>` 和另一个从另一个堆分配内存的 `SpecialAllocator<int>`。这样的分配器是不等价的，并且存在某些\
  \ STL 实现，尝试使用这两种分配器会导致运行时数据结构损坏。\n\n注意这是一个*运行时*问题。带有状态的分配器编译完全没问题。只是它们的运行方式可能不像你预期的那样。确保给定类型的所有分配器等价的责任是你的。不要指望编译器在你违反这一约束时发出警告。\n\
  \n为了对标准委员会公平，我应该指出，在允许 STL 实现者假设相同类型的分配器等价的文本之后，它确实包含了以下陈述：\n\n鼓励实现者提供……支持非等价实例的库。在此类实现中，……分配器实例比较不等等时，容器和算法的语义是由实现决定的。\n\
  \n\n\n\n\n这是一个很棒的观点，但作为一个正在考虑开发带状态的自定义分配器的 STL 用户，这段话对你来说几乎毫无帮助。只有在满足以下的情况下，你才能利用这段声明：(1)\
  \ 你知道你正在使用的 STL 实现支持不等价分配器（inequivalent allocators），(2) 你愿意深入研究它们的文档，以确定“非相等”分配器的实现定义行为对你来说可以接受，以及\
  \ (3) 你不担心将代码移植到某些 STL 实现中，因为这些实现可能会利用标准明确赋予它们的的自由度。简而言之，这一段——对于那些执意要看的人来说，就是 `20.1.5`\
  \ 节的第 5 段——是标准对分配器的“我有一个梦想”演讲。在那个梦想变成共同现实之前，关注移植性的程序员将把自己限制在无状态的自定义分配器上。\n\n我之前提到过，分配器就像\
  \ `operator new`，因为它们都分配原始内存，但它们的接口是不同的。如果你查看最常见的 `operator new` 和 `allocator<T>::allocate`\
  \ 的声明，这一点就会显而易见：\n\n点击此处查看代码图像\n\n```\nvoid* operator new(size_t bytes);\n\npointer\
  \ allocator<T>::allocate(size_type numObjects);\n\n// 记得 \"pointer\" 是一个类型定义\n//\
  \ 它几乎总是 T*\n```\n\n两者都接受一个指定要分配多少内存的参数，但在 `operator new` 的情况下，该参数指定的是特定的字节数；而在 `allocator<T>::allocate`\
  \ 的情况下，它指定的是内存中要容纳多少个 `T` 对象。例如，在 `sizeof(int) == 4` 的平台上，你需要足够的内存来容纳一个 `int`，你会向\
  \ `operator new` 传递 4，但你会向 `allocator<int>::allocate` 传递 1。（在 `operator new` 中，该参数的类型是\
  \ `size_t`，而在 `allocate` 中，它是 `allocator<T>::size_type`。在两种情况下，它都是无符号整数类型，而且 `allocator<T>::size_type`\
  \ 通常是 `size_t` 的类型定义。）这种差异并没有“错”，但 `operator new` 和 `allocator<T>::allocate` 之间不一致的约定使得将自定义版本\
  \ `operator new` 的经验应用到自定义分配器的开发过程中变得复杂。\n\n`operator new` 和 `allocator<T>::allocate`\
  \ 的返回类型也不同。`operator new` 返回一个 `void*`，这是 C++ 表示未初始化内存指针的传统方式。`allocator<T>::allocate`\
  \ 返回一个 `T*`（通过 `pointer` 类型定义），这不仅是非传统的，而且是预谋的欺诈。从 `allocator<T>::allocate` 返回的指针并不指向一个\
  \ `T` 对象，因为还没有任何 `T` 被构造！STL 中隐含的预期是，`allocator<T>::allocate` 的调用者最终会在它返回的内存中构造一个或多个\
  \ `T` 对象（可能通过 `allocator<T>::construct`、通过 `uninitialized_fill`，或者通过对 `raw_storage_iterator`s\
  \ 的某种应用），尽管在 `vector::reserve` 或 `string::reserve` 的情况下，这可能永远不会发生（参见 Item 14）。`operator\
  \ new` 和 `allocator<T>::allocate` 返回类型之间的差异表明了未初始化内存概念模型的改变，这再次使得将关于实现 `operator\
  \ new` 的知识应用到自定义分配器的开发变得更加困难。\n\n这把我们带 STL 分配器的最后一个奇特之处：大多数标准容器从未对它们实例化时使用的分配器进行过单次调用。这里有两个例子：\n\
  \n点击此处查看代码图像\n\n```\nlist<int> L; // 等同于 list<int, allocator<int> >;\n\n// allocator<int>\
  \ 从未被要求\n// 分配内存！\n\nset<Widget, SAW> s; // 记得 SAW 是\n// SpecialAllocator<Widget>\
  \ 的类型定义；SAW\n// 永远不会分配内存！\n```\n\n这种奇特性对于 `list` 和所有的标准关联容器（`set`、`multiset`、`map`\
  \ 和 `multimap`）都是如此。这是因为这些是基于节点的容器，即基于每当存储一个值时都动态分配一个新节点的数据结构的容器。在 `list` 的情况下，节点是列表节点。在标准关联容器的情况下，节点通常是树节点，因为标准关联容器通常实现为平衡二叉搜索树。\n\
  \n思考一下 `list<T>` 可能是如何实现的。列表本身由节点组成，每个节点都包含一个 `T` 对象以及指向列表中上一个节点和后一个节点的指针：\n\n点击此处查看代码图像\n\
  \n```\ntemplate<typename T, // 可能的列表\ntypename Allocator = allocator<T> > // 实现\n\
  class list {\nprivate:\n    Allocator alloc; // 用于类型为 T 的对象的分配器\n    struct ListNode\
  \ { // 链表中的节点\n        T data;\n        ListNode *prev;\n        ListNode *next;\n\
  \    };\n...\n};\n```\n\n当向列表添加一个新节点时，我们需要从用于 `T` 对象的分配器（称为 `Allocator`）获取用于 `ListNode`\
  \ 对象的分配器。我们拥有的用于 `T` 的分配器类型是模板参数 `Allocator`。如此，用于 `ListNode` 的分配器类型就是：\n\n`Allocator::rebind<ListNode>::other`\n\
  \n跟我在这里。每个分配器模板 `A`（例如 `std::allocator`、`SpecialAllocator` 等）都被预期有一个名为 `rebind`\
  \ 的嵌套结构体模板。`rebind` 接受一个类型参数 `U`，并仅定义了一个类型定义 `other`。`other` 仅仅是 `A<U>` 的一个名称。结果是\
  \ `list<T>` 可以通过 `Allocator::rebind<ListNode>::other` 从它的 `T` 分配器获取对应的 `ListNode`\
  \ 分配器。\n\n这对你来说可能理解，也可能不。（如果你盯着看足够久，你就会理解，但你可能需要盯着很久。我知道我是这样的。）作为一个可能编写自定义分配器的 STL\
  \ 用户，你并不真的需要它是它是工作的。你需要的是，如果你选择编写分配器并与标准容器一起使用，你的分配器必须提供 `rebind` 模板，因为标准容器假设它会那里。（为了调试之目的，了解为什么基于节点的\
  \ `T` 对象容器从不向用于 `T` 对象的分配器请求内存也是有帮助的。）\n\n哈利雅！我们终于结束了对分配器特殊性的检查。因此，让我们总结一下如果你以后想编写自定义分配器需要记住的事情。\n\
  \n\n\n\n\n-   将你的分配器实现为模板，模板参数 `T` 表示你正在分配内存的对象类型。\n-   提供 `pointer` 和 `reference`\
  \ 类型别定义，但始终让 `pointer` 为 `T*` 且 `reference` 为 `T&`。\n-   永远不要为你的分配器提供每个对象的状态。通常情况下，分配器不应该有非静态数据成员。\n\
  -   记住，分配器的 `allocate` 成员函数传递的是所需的*对象*数量，而不是所需的字节数。还请记住，这些函数返回的是 `T*` 指针（通过 `pointer`\
  \ 类型定义），尽管此时还没有构造任何 `T` 对象。\n-   务必提供标准容器所依赖的嵌套 `rebind` 模板。\n\n编写自定义分配器，需要做的大部分工作是复制大量的样板代码，然后对几个成员函数进行调整，特别是\
  \ `allocate` 和 `deallocate`。与其从零开始编写样板代码，我建议你先从 Josuttis 的示例分配器网页 [23 ] 中的代码，或者\
  \ Austern 的文章“分配器有什么用？” [24 ] 中开始。\n\n一旦你消化了本节中的信息，你将了解到很多关于分配器*不能*做什么的知识，但这可能不是你想知道的。相反，你可能更想知道分配器*可以*做什么。这本身就是一个丰富的话题，我称之为“第\
  \ 11 条”。\n\n### 第 11 条：理解自定义分配器的合法用途\n\n所以，你通过基准测试、性能分析和实验得出结论：默认的 STL 内存管理器（即 `allocator<T>`）对于你的\
  \ STL 需求来说太慢了、浪费内存或遭受了严重的碎片化，而你确定自己可以做得更好。或者，你发现 `allocator<T>` 为了线程安全采取了预防措施，但你只对单线程执行感兴趣，并且不想为不需要的同步开销支付代价。或者你知道某些容器中的对象通常会被一起使用，因此你想将它们放置在特殊的堆中，以最大化引用局部性。或者你想设置一个对应共享内存的唯一堆，然后将一个或多个容器放入该内存中，以便其他进程共享。恭喜你！这些场景都对应于自定义分配器非常适合该问题的情况。\n\
  \n例如，假设你有一个模仿 `malloc` 和 `free` 的特殊例程，用于管理共享内存堆：\n\n```cpp\nvoid* mallocShared(size_t\
  \ bytesNeeded);\nvoid freeShared(void *ptr);\n```\n\n并且你想让 STL 容器的内容放入该共享内存中。没问题：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass SharedMemoryAllocator {\npublic:\n\
  ...\n    pointer allocate(size_type numObjects, const void *localityHint = 0)\n\
  \    {\n        return static_cast<pointer>(mallocShared(numObjects * sizeof(T)));\n\
  \    }\n    void deallocate(pointer ptrToMemory, size_type numObjects)\n    {\n\
  \        freeShared(ptrToMemory);\n    }\n...\n};\n```\n\n关于 `pointer` 类型以及 `allocate`\
  \ 内部的类型转换和乘法操作，请参阅 第 10 条。\n\n你可以这样使用 `SharedMemoryAllocator`：\n\n点击此处查看代码图片\n\n\
  ```cpp\n// 便利类型别定义\ntypedef vector<double, SharedMemoryAllocator<double> > SharedDoubleVec;\n\
  ...\n{ // 开始某个代码块\n...\n    SharedDoubleVec v; // 创建一个元素\n    // 位于共享内存中的 vector\n\
  ...\n} // 结束代码块\n```\n\n`v` 定义旁边注释的用词非常重要。`v` 使用了 `SharedMemoryAllocator`，因此 `v`\
  \ 分配存储其元素的内存将来自共享内存。然而，`v` 本身（包括它所有的数据成员）几乎*不会*被放置在共享内存中。`v` 只是一个普通的基于栈的对象，因此它将位于运行时系统用于所有普通栈栈对象的内存中。那几乎从不是共享内存。要将\
  \ `v` 的内容和 `v` 本身都放入共享内存，你必须像这样操作：\n\n点击此处查看代码图片\n\n```cpp\nvoid *pVectorMemory\
  \ = // 分配足够的共享\nmallocShared(sizeof(SharedDoubleVec)); // 内存来存放\n// SharedDoubleVec\
  \ 对象\nSharedDoubleVec *pv = // 使用“placement new”\nnew (pVectorMemory) SharedDoubleVec;\
  \ // 在内存中\n// 创建 SharedDoubleVec\n// 对象；\n// 见下文\n... // 使用该对象（通过 pv）\npv->~SharedDoubleVec();\
  \ // 销毁共享\n//内存中的对象\nfreeShared(pVectorMemory); // 释放初始\n// 共享内存块\n```\n\n我希望注释解释了它的工作原理。从根本上说，你获取一些共享内存，然后在其中构造一些使用共享内存的\
  \ `vector`。当你用完 `vector` 时，调用它的析构函数，然后释放 vector 占据的内存。代码并不特别复杂，但比仅仅声明一个局部变量要要求得多。如果你不熟悉\
  \ `placement new`，你喜欢的 C++ 教书应该能为你介绍它。在这个示例中，你无疑注意到 `mallocShared` 可能会返回空指针的可能性。作为分配器效用性的第二个示例，假设你有两个堆，由类\
  \ `Heap1` 和 `Heap2` 标识。每个堆类都有用于分配和释放内存的静态成员函数：\n\n点击此处查看代码图片\n\n```cpp\nclass Heap1\
  \ {\npublic:\n...\n    static void* alloc(size_t numBytes, const void *memoryToBeNear);\n\
  \    static void dealloc(void *ptr);\n...\n};\nclass Heap2 { ... }; // 相同的 alloc/dealloc\
  \ 接口\n```\n\n进一步假设你想将 STL 容器的内容放在不同的堆中。同样，没问题。首先，你写一个使用 `Heap1` 和 `Heap2` 类进行实际内存管理的分配器：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T, typename Heap>\nclass SpecificHeapAllocator\
  \ {\npublic:\n...\n    pointer allocate(size_type numObjects, const void *localityHint\
  \ = 0)\n    {\n        return static_cast<pointer>(Heap::alloc(numObjects * sizeof(T),\n\
  localityHint));\n    }\n    void deallocate(pointer ptrToMemory, size_type numObjects)\n\
  \    {\n        Heap::dealloc(ptrToMemory);\n    }\n...\n};\n```\n\n然后你使用 `SpecificHeapAllocator`\
  \ 将容器的元素聚集在一起：\n\n点击此处查看代码图片\n\n```cpp\nvector<int, SpecificHeapAllocator<int, Heap1>\
  \ > v; // 将 v 和\nset<int, SpecificHeapAllocator<int, Heap1> > s; // s 的元素放在\n//\
  \ Heap1\nlist<Widget, SpecificHeapAllocator<Widget, Heap2> > L; // 将 L 和\nmap<int,\
  \ string, less<int>, // m 的元素放在\nSpecificHeapAllocator<pair<const int, string>,\
  \ // Heap2\nHeap2> > m;\n```\n\n在这个示例中，`Heap1` 和 `Heap2` 是*类型*而不是对象，这一点非常重要。STL\
  \ 提供了一种语法，使用相同类型的不同分配器对象来初始化不同的 STL 容器，但我不会向你展示它。这是因为如果 `Heap1` 和 `Heap2` 是*对象*而不是类型，它们将是不等效的分配器，从而违反了第\
  \ 10 条中详细说明的分配器等效性约束。\n\n\n\n\n正如这些示例所示，分配器在许多场景中都是非常有用的。只要你遵守“相同类型的分配器必须等效”这一限制，你使用自定义分配器来控制通用内存管理策略、聚类关系，以及共享内存和其他特殊堆的使用就不会遇到任何问题。\n\
  \n## 事项 12：对 STL 容器的线程安全保持合理的预期\n\n标准 C++ 的世界相当封闭且老旧。在这个小众的世界里，所有可执行文件都是静态链接的。既没有内存映射文件，也没有共享内存。没有窗口系统、没有网络、没有数据库，也没有其他进程。因此，当你发现标准中对线程只字未未提时，你不应该感到惊讶。那么，你对\
  \ STL 线程安全的第一个预期应该是：它会随实现的不同而异。\n\n当然，多线程程序随处可见，因此大多数 STL 厂商都努力让他们的实现在多线程环境中良好运行。然而，即使他们做得很好，很大一部分负担仍然落在你的肩上，理解这一点至关重要。STL\
  \ 厂商在缓解你的多线程痛苦方面所能做的程度是有限的，你需要知道这具体是什么。\n\nSTL 容器多线程支持的黄金标准（也是大多数厂商的愿景）由 SGI 定义并发布在他们的\
  \ STL 网站上 [21 ]。本质上，它表示从实现中你可以获得的最高期望如下：\n\n*   **多个读取是安全的。** 多个线程可以同时读取单个容器的内容，并且这将正常工作。自然地，在读取期间不能有任何写入者对容器进行操作。\n\
  *   **对不同容器的多个写入是安全的。** 多个线程可以同时写入不同的容器。\n\n仅此如此，让我明确一点：这是你能够*希望*的，而不是你能够*预期*的。某些实现提供了这些保证，但某些则没有。\n\
  \n编写多线程代码是困难的，许多程序员希望 STL 实现是开箱即完全线程安全的。如果是那样的话，程序员可能希望不需要自己去关注并发控制。这无疑是一个非常方便的状态，但要实现它也非常困难。考虑以下库可能尝试实现这种全面容器线程安全的几种方法：\n\
  \n*   在每次调用其成员函数期间锁定容器。\n*   在它返回的每个迭代器的生命周期内锁定容器（例如，通过调用 `begin()` 或 `end()`）。\n\
  *   在在该容器上调用的每个算法执行期间锁定容器。（这实际上没有意义，因为正如 事项 32 所解释的，算法没有办法识别它们正在操作的容器。尽管如此，我们在这里还会检查这个选项，因为即使它是可能的，看到它为什么行不通也具有启发性。）\n\
  \n现在考虑以下代码。它在 `vector<int>` 中搜索值 5 的第一次出现，如果找到了，则将该值改为 0。\n\n点击此处查看代码图像\n\n```cpp\n\
  vector<int> v;\n\n...\n\nvector<int>::iterator first5(find(v.begin(), v.end(), 5));\
  \ // 第 1 行\nif (first5 != v.end()) { // 第 2 行\n    *first5 = 0; // 第 3 行\n}\n```\n\
  \n在多线程环境中，另一个线程可能会在第 1 行完成后立即修改 `v` 中的数据。如果发生这种情况，那么第 2 行中对 `first5` 与 `v.end` 的测试将毫无意义，因为\
  \ `v` 的值已经与第 1 行结束时的值不同了。事实上，这种测试可能会产生未定义的结果，因为另一个线程可能在第 1 行和第 2 行之间介入并使 `first5`\
  \ 失效，例如通过执行插入导致 vector 重新分配其底层内存。（这将导致 vector 的迭代器失效。有关这种重新分配行为的细节，请参阅 事项 14 ）。同样，第\
  \ 3 行对 `*first5` 的赋值是不安全的，因为另一个线程可能会在第 2 行和第 3 行之间执行，导致 `first5` 失效，例如通过删除它所指向的元素（或至少是*曾经*指向的元素）。\n\
  \n上述列出的所有锁定方法都无法防止这些问题。第 1 行中对 `begin()` 和 `end()` 的调用返回太快，无法提供任何帮助，它们生成的迭代器只持续到该行的结束，而\
  \ `find` 也在在该行结束时返回。\n\n为了让上述代码是线程安全的，`v` 必须从第 1 行到第 3 行一直保持锁定状态，很难想象 STL 实现如何自动推断出这一点。考虑到同步原语（例如信号量、互斥锁等）通常的高成本，更难以想象实现如何在不对那些*预先*知道——即以这种方式*设计*——在第\
  \ 1-3 行期间最多只有一个线程访问 `v` 的程序施加重大性能惩罚的情况下做到这一点。\n\n这些考虑解释了为什么你不能预期任何 STL 实现能让你的线程烦恼消失。相反，你必须手动接管同步。在这些场景中，你可能像这样做：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<int> v;\n\n...\n\nlock(v);\nvector<int>::iterator\
  \ first5(find(v.begin(), v.end(), 5));\nif (first5 != v.end()) { // 现在是安全的\n   \
  \ *first5 = 0;\n}\nunlock(v);\n```\n\n另一种更面向对象的解决方案创建一个 `Lock` 类，在构造函数中获取互斥锁，并在析构函数中释放它，从而确保对\
  \ `lock()` 的调用都有对应的 `unlock()` 调用。这种类（实际上是一个类模板）的本质如下：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename Container> // 类的骨架模板\nclass Lock { // 获取和释放互斥锁\npublic: // 对于容器；许多细节已省略\n\
  \    Lock(const Container& container)\n        : c(container)\n    {\n        lockFor(c);\
  \ // 在构造函数中获取互斥锁\n    }\n    ~Lock()\n    {\n        unlockFor(c); // 在析构函数中释放\n\
  \    }\n\nprivate:\n    const Container& c;\n};\n```\n\n使用类（如 `Lock`）管理资源（如互斥锁）生命周期的想法通常被称为*资源获取初始化*，你可以在任何全面的\
  \ C++ 教书中读到它。一个很好的起点是 Stroustrup 的《C++ 语言》[7 ]，因为是 Stroustrup 推广了这种惯用法，但你也可以参考《Effective\
  \ C++》中的 事项 9 。无论你咨询哪种来源，请记住上面的 `Lock` 被精简到了最核心。一个工业级的版本需要许多增强，但这种完善与 STL 无关。此外，这个极简的\
  \ `Lock` 足够让我们看到如何将其应用到我们考虑的示例中了：\n\n点击此处查看代码图像\n\n```cpp\nvector<int> v;\n\n...\n\
  \n{ // 创建新块\n    Lock<vector<int> > lock(v); // 获取互斥锁\n    vector<int>::iterator\
  \ first5(find(v.begin(), v.end(), 5));\n    if (first5 != v.end()) {\n        *first5\
  \ = 0;\n    }\n} // 结束块，自动\n\n// 释放互斥锁\n```\n\n\n\n由于 `Lock` 对象在 `Lock` 的析构函数中释放了容器的互斥锁，因此在应该释放互斥锁时立即销毁\
  \ `Lock` 是关重要的。为了实现这一点，我们创建一个新的块来定义 `Lock`，并在不再需要互斥锁时立即关闭该块。这听起来似乎只是将调用 `releaseMutexFor`\
  \ 的需求替换了关闭新代码块的需求，但这并不是一个准确的评估。如果我们忘记为 `Lock` 创建一个新的代码块，互斥锁仍然会被释放，但发生的时间可能比预期的要晚——即当控制权到达外层块的末尾时。如果我们忘记调用\
  \ `releaseMutexFor`，则永远不会释放互斥锁。\n\n此外，基于 `Lock` 的方法在存在异常时是健壮的。C++ 保证如果抛出异常，局部对象会被销毁，因此即使在我们在使用\
  \ `Lock` 对象期间抛出异常，`Lock` 也会释放其互斥锁。如果我们依赖手动调用 `getMutexFor` 和 `releaseMutexFor`，那么在调用\
  \ `getMutexFor` 之后但在调用 `releaseMutexFor` 之前抛出异常时，我们就永远无法放弃互斥锁。\n\n异常和资源管理确实很重要，但它们不是本节的主题。本节讨论的是\
  \ STL 中的线程安全。涉及到线程安全和 STL 容器时，你可以希望库的实现允许在一个容器上有多个读取者，以及在不同的容器上有多个写入者。你*不能*希望库能消除手动并发控制的需求，而且你完全无法*依赖*任何线程支持。\n\
  \n# 第 2 章 `vector` 和 `string`\n\n所有的 STL 容器都是很有用的，但如果你像大多数 C++ 程序员一样，你会发现自己使用 `vector`\
  \ 和 `string` 的频率比使用它们的同类高得多。这是预料之中的。`vector` 和 `string` 的设计是为了取代大多数数组的应用，而数组如此有用，以至于出现在从\
  \ COBOL 到 Java 的每种成功编程语言中。\n\n本章的章节从多个角度涵盖了 `vector` 和 `string`。我们首先讨论了为什么放弃数组是值得的，然后查看提高\
  \ `vector` 和 `string` 性能的方法，识别 `string` 实现中的重要差异，检查如何将 `vector` 和 `string` 数据传递给只理解\
  \ C 语言的 API，并学习如何消除过多的内存分配。最后，我们对一个具有启发性的异常——`vector<bool>`（那个不能不能的小型 vector）进行了检查。\n\
  \n本章的每一节都将帮助你利用 STL 中这两个最有用的容器并精炼它们的应用。等我们完成学习后，你将知道如何让它们更好地为你服务。\n\n### 第 13 节：优先使用\
  \ `vector` 和 `string` 代替动态分配的数组\n\n当你决定使用 `new` 进行动态分配的那刻，你就承担了以下责任：\n\n1. 你必须确保稍后会有人\
  \ `delete` 这一次分配。如果没有随后的 `delete`，你的 `new` 将导致资源泄漏。\n2. 你必须确保使用了正确形式的 `delete`。对于单个对象的分配，必须使用“`delete`”。对于数组分配，则需要“`delete\
  \ []`”。如果使用了错误的 `delete` 形式，结果将是未定义的。在某些平台上，程序将在运行时崩溃。在另一些一些平台上，它会静默地错误向前运行，在此过程中可能会泄漏资源并损坏内存。\n\
  3. 你必须确保 `delete` 恰好被使用一次。如果一个分配被删除了多次，结果同样是未定义的。\n\n这是一组相当沉重的责任，我不理解在没有必要的情况下你为什么要想要去承担它们。得益于\
  \ `vector` 和 `string`，这种需求在现在几乎不再像以前那样频繁了。\n\n每当你发现自己准备动态分配一个数组时（即计划编写“`new T[...]``”）时，你都应该考虑使用\
  \ `vector` 或 `string` 代替。（通常情况下，当 `T` 是字符类型时使用 `string`，当它不是字符类型时使用 `vector`，尽管在本节的后半部分，我们会遇到一种\
  \ `vector<char>` 可能是一个合理设计选择的情况。）`vector` 和 `string` 消除了上述负担，因为它们自己管理内存。随着元素被添加到这些容器中，它们的内存会随之增长，而当\
  \ `vector` 或 `string` 被销毁时，它的析构函数会自动销毁容器中的元素并释放持有这些元素的内存。\n\n此外，`vector` 和 `string`\
  \ 是完整的 STL 序列容器，因此它们为你提供了一整套适用于此类容器的 STL 算法库。诚然，数组也可以与 STL 算法一起使用，但数组没有提供 `begin`、`end`\
  \ 和 `size` 等成员函数，也没有像 `iterator`、`reverse_iterator` 或 `value_type` 这样的嵌套类型定义。当然，`char*`\
  \ 指针几乎无法与 `string` 提供的许多专用成员函数相竞争。你与 STL 打交道越越多，对内置数组的眼光就越是挑剔。\n\n如果你担心必须继续支持的旧代码（这些代码全部基于数组），请放松，尽管如此也使用\
  \ `vector` 和 `string` 吧。第 16 节展示了将 `vector` 和 `string` 中的数据传递给期望数组的 API 是多么简单，因此与旧代码的集成通常不是问题。\n\
  \n坦率地说，我能想到用 `vector` 或 `string` 代替动态分配数组的唯一一种合理的担忧，而且这只适用于 `string`。许多 `string`\
  \ 实现内部采用了引用计数（参见第 15 节），这种策略消除了不必要的内存分配和字符拷贝，并能提高性能。事实上，通过引用计数优化 `string` 被如此重视，C++\
  \ 标准委员会采取了特定措施来确保其有效性。\n\n遗憾的是，一个程序员的优化可能是另一个程序员的退化，如果你在多线程环境中使用引用计数的 `string`，你可能会发现避免分配和拷贝所节省的时间被后台并发控制所花费的时间所淹没。如果你在多线程环境中使用引用计数的\
  \ `string`，那么留意由于支持线程安全而产生的性能问题是有意义的。\n\n要确定你是否在使用引用计数的 `string` 实现，最简单的方法是查阅库文档。由于引用计数被视为优化，供应商通常将其作为一项特性来宣传。另一种方法是查看库中\
  \ `string` 实现的源码。我不建议尝试通过库源码来解决问题，但有时这是获取你所需知识的唯一途径。如果你选择这种方法，请记住 `string` 是 `basic_string<char>`\
  \ 的 `typedef`（`wstring` 是 `basic_string<wchar_t>` 的 `typedef`），因此你真正想要查看的是模板 `basic_string`。最容易检查的可能是该类的拷贝构造函数。查看它是否在某处递了引用计数。如果是，`string`\
  \ 就是引用计数的。如果不是，要么 `string` 不是引用计数的，要么是你读错代码了。咳。\n\n\n\n如果你可用的 `string` 实现是基于引用计数的，并且你运行在一个多线程环境中，此时你已经确定\
  \ `string` 的引用计数支持是一个性能问题，那么你至少有三个合理的选择，其中任何一个都不涉及放弃 STL。首先，检查你的库实现是否允许禁用引用计数，这通常通过更改预处理器变量的值来实现。当然，这是不可移植的，但考虑到涉及的工作量，这值得调查。其次，寻找或开发一种不使用引用计数的替代\
  \ `string` 实现（或部分实现）。第三，考虑使用 `vector<char>` 代替 `string`。`vector` 的实现不被允许进行引用计数，因此不会出现隐藏的多线程性能问题。当然，如果你切换到\
  \ `vector<char>`，你将放弃 `string`  那些华丽的成员函数，但这些功能大部分其实可以通过 STL 算法实现，所以你与其说是放弃了功能，不如说是用一种语法替换了另一种语法。\n\
  \n这一切的结论非常简单。如果你在动态分配数组，你可能承担了比你需要更多的工作。为了减轻负担，请使用 `vector` 或 `string`。\n\n### 事项\
  \ 14：使用 `reserve` 避免不必要的重新分配\n\nSTL 容器最奇妙的特性之一是它们会自动增长以容纳你放入的大量数据，只要你没有超过它们的最大尺寸。（要发现这个最大值，只需调用命名恰当的\
  \ `max_size` 成员函数。）对于 `vector` 和 `string`，增长是通过在需要更多空间时执行等同于 `realloc`的操作完成的。这种类似于\
  \ `realloc`的操作包含四个部分：\n\n1. 分配一块新内存，其大小是容器当前容量的倍数。在大多数实现中，`vector` 和 `string` 的容量每次增长\
  \ 1.5 到 2 倍之间。\n2. 将所有元素从容器的旧内存拷贝到新内存中。\n3. 销毁旧内存中的对象。\n4. 释放旧内存。\n\n考虑到所有的分配、释放、拷贝和销毁，得知这些步骤可能是昂贵的并不应该让你感到惊讶。自然地，你不希望比需要时更频繁地执行它们。如果你觉得这听起来并不理所当然，那么当你考虑到每当这些步骤发生时，指向\
  \ `vector` 或 `string` 的所有迭代器、指针和引用都会失效，也许你就会觉得如此了。这意味着向 `vector` 或 `string` 插入元素的简单操作可能还需要更新其他使用了正在扩展的\
  \ `vector` 或 `string` 迭代器、指针或引用的数据结构。\n\n`reserve` 成员函数允许你尽可能地减少必须执行的重新分配次数，从而避免重新分配的代价以及迭代器/指针/引用的失效。不过在我解释\
  \ `reserve` 如何做到这一点之前，让我简要回顾四个有时会被混淆的相互相关的成员函数。在标准容器中，只有 `vector` 和 `string` 提供了所有的函数。\n\
  \n- `size()` 告诉容器中有多少元素。它*没有*告诉容器为它持有的元素分配了多少内存。\n- `capacity()` 告诉容器在已分配的内存中可以容纳多少元素。这是容器在该内存中可以容纳的**总元素数**，而不是它还能容纳**多少**元素。如果你想知道\
  \ `vector` 或 `string` 有多少未空闲内存，必须从 `capacity()` 中减去 `size()`。如果 `size` 和 `capacity`\
  \ 返回相同的值，则容器中没有空隙，下一次插入（通过 `insert` 或 `push_back` 等）将触发上述的重新分配步骤。\n- `resize(Container::size_type\
  \ n)` 强制容器将其持有的元素数量改为 `n`。在调用 `resize` 后，`size` 将返回 `n`。如果 `n` 小于当前大小，容器末尾的元素将被销毁。如果\
  \ `n` 大于当前大小，则会在容器末尾添加新元素，要么通过拷贝默认构造的元素来实现，要么通过通过额外参数拷贝你提供的对象来实现。如果 `n` 大于当前容量，则在添加元素之前将发生重新分配。\n\
  - `reserve(Container::size_type n)` 强制容器将其容量至少更改为 `n`，前提是 `n` 不小于当前大小。这通常会强制重新分配，因为容量需要增加。（如果\
  \ `n` 小于当前容量，`vector` 会忽略该调用并什么都不做。`string` *可能会*将其容量减少到 `size()` 和 `n` 之间的最大值，但\
  \ `string` 的大小绝对保持不变。根据我的经验，使用 `reserve` 来修剪 `string` 的多余容量通常不如使用“交换技巧”（the swap\
  \ trick）成功，那是事项 17 的主题。）注意，调用 `reserve` 永远不会改变容器元素的数量（即其大小）。\n\n这段回顾应该让你清楚，每当需要插入元素且容器容量不足时，就会发生重新分配（包括其的内存分配和释放、对象拷贝和销毁，以及迭代器、指针和引用的失效）。因此，避免重新分配的关键是使用\
  \ `reserve` 尽早将容器的容量设置为足够大的值，理想情况下是在容器构造后立即设置。\n\n例如，假设你想创建一个包含 1 到 1000 值的 `vector<int>`。如果不使用\
  \ `reserve`，你可能会这样做：\n\n```cpp\nvector<int> v;\nfor (int i = 1; i <= 1000; ++i)\
  \ v.push_back(i);\n```\n\n这段代码通常会导致 2 次到 18 次重新分配。将代码修改为使用 `reserve` 则得到：\n\n```cpp\n\
  vector<int> v;\nv.reserve(1000);\nfor (int i = 1; i <= 1000; ++i) v.push_back(i);\n\
  ```\n\n这应该导致 0 次重新分配。\n\n`size` 和 `capacity` 之间的关系使得我们能够预测插入何时会导致 `vector` 或 `string`\
  \ 执行重新分配，反过来，这使得能够预测插入何时会导致容器迭代器、指针和引用失效。例如，给定以下代码：\n\n```cpp\nstring s;\n...\n\
  if (s.size() < s.capacity()) {\n    s.push_back('x');\n}\n```\n\n`push_back` 的调用不会使迭代器（指向\
  \ `s` 末尾的迭代器除外）、指针或引用的失效。如果代码不是执行 `push_back`，而是在字符串的任意位置执行 `insert`，我们仍然保证不会发生重新分配，但根据伴随\
  \ `string` 插入的迭代器失效的常规规则，从插入点到字符串末尾的所有迭代器/指针/引用都会失效。\n\n\n\n\n# 项目 15：注意 `string`\
  \ 实现的差异\n\nBjarne Stroustrup 曾经写过一篇标题奇特的文章，“堆叠猫的十六种方法” [27 ]。事实证明，实现 `string` 的方法几乎同样多。作为经验丰富且老练的软件工程师，我们理应应该对“实现细节”嗤之以鼻，但如果爱因斯坦说得对——上帝在细节之中，那么现实就要求我们有时必须深入钻研细节。即使细节本身并不重要，对它们略有了解也能让我们有足够的把握来确保它们确实无关紧要。\n\
  \n例如，一个 `string` 对象的大小有多大？换句话说，`sizeof(string)` 返回什么值？如果你密切关注内存消耗，并正考虑用原始 `char*`\
  \ 指针替换为 `string` 对象，这可能是一个重要的问题。\n\n关于 `sizeof(string)` 的消息是“很有趣的”，如果你关心空间问题，这几乎肯定是你最不想听到的消息。虽然发现\
  \ `string` 大小与 `char*` 指针相等的实现并不罕见，但也很容易找到每个 `string` 大小是指针七倍的实现。为什么会有这种差异？要理解这一点，我们必须知道\
  \ `string` 可能存储什么数据，以及它可能决定将数据存储在哪里。\n\n几乎每个 `string` 实现都包含以下信息：\n\n- 字符串的**大小**（size），即它包含的字符数。\n\
  - 存储字符串字符的内存的**容量**（capacity）。关于字符串大小和容量差异的审查，请参见项目 14 。\n- 字符串的**值**（value），即构成字符串的字符。\n\
  \n此外，`string` 可能还会持有：\n\n- 它的**分配器**（allocator）的副本。若要解释为什么这个字段是可选的，请参阅项目 10 并阅读关于分配器的奇特规则。\n\
  \n依赖引用计数的 `string` 实现还包含：\n\n- 值的**引用计数**（reference count）。\n\n不同的 `string` 实现以不同的方式将这些信息组合在一起。为了说明我的意思，我将向你展示四种不同\
  \ `string` 实现所使用的数据结构。这些选择并没有特殊之处，它们都来自常用的 STL 实现。它们恰好是在我检查的前四个库中的 `string` 实现。\n\
  \n## 实现 A\n\n在实现 A 中，每个 `string` 对象都包含其分配器的副本、字符串的大小、其容量，以及一个指向动态分配缓冲区的指针，该缓冲区同时包含引用计数（“`RefCnt`”）和字符串的值。在这一实现中，使用默认分配器的\
  \ `string` 对象的大小是指针的四倍。如果使用自定义分配器，`string` 对象的大小会比分配器对象大出约分配器对象的大小：\n\n![image](img/Image00056.gif)\n\
  \n**实现 A**\n\n## 实现 B\n\n实现 B 的 `string` 对象的大小与指针相同，因为它们除了指向一个结构体的指针外，一无一物。同样，这假设使用了默认分配器。与实现\
  \ A 一样，如果使用自定义分配器，`string` 对象的大小将增加约分配器对象的大小。在此实现中，得益于此处存在但实现 A 中不存在的优化，使用默认分配器不需要额外空间。\n\
  \nB 的 `string` 指向的对象包含字符串的大小、容量和引用计数，以及一个指向持有字符串值的动态分配缓冲区的指针。该对象还包含一些与多线程系统并发控制相关的额外数据。此类数据不在我们的考虑范围内，因此我仅将数据结构的那部分标记为“其他：”。\n\
  \n![image](img/Image00057.gif)\n\n**实现 B**\n\n“其他”框比其他框大，因为我是按比例绘制这些框的。如果一个框的大小是另一个框的二倍，那么较大的框使用的字节数就是较小框的两倍。在实现\
  \ B 中，并发控制数据的大小是指针的六倍。\n\n## 实现 C\n\n实现 C 下的 `string` 对象始终指针的大小，但这个指针指向一个动态分配的缓冲区，其中包含了与字符串相关的所有内容：大小、容量、引用计数和值。它没有每个对象的分配器支持。缓冲区还包含了一些关于值的可共享性的数据，我们在这里不会考虑这个主题，因此我将其标记为“X”。（如果你对为什么引用计数的值最初可能不可共享感兴趣，请参阅\
  \ *More Effective C++* 中的项目 29。）\n\n![image](img/Image00058.gif)\n\n**实现 C**\n\n\
  ## 实现 D\n\n实现 D 的 `string` 对象的大小是指针的七倍（仍假设使用默认分配器）。这种实现没有采用引用计数，但每个 `string` 都包含一个内部缓冲区，足以表示最多\
  \ 15 个字符的字符串值。因此，短字符串可以完全存储在 `string` 对象内部，这种特征被称为“短字符串优化”（small string optimization）。当\
  \ `string` 的容量超过 15 时，缓冲区的开头被用指向动态分配内存的指针，而字符串的值位于该内存中：\n\n![image](img/Image00059.gif)\n\
  \n**实现 D**\n\n这些图不仅证明了我能看懂源码并画图。它们还能让你推断出在如下语句中创建 `string`：\n\n点击此处查看代码图像\n\n```cpp\n\
  string s(\"Perse\"); // 我们狗的名字叫 Persephone，但我们\n// 通常叫她 Perse。访问她的网站\n// http://www.aristeia.com/Perse/\n\
  ```\n\n在实现 D 下将产生零次动态分配，在实现 A 和 C 下产生一次，在实现 B 下产生两次（指向 `string` 对象的一次，指向该对象的字符缓冲区一次）。如果你担心动态分配和释放内存的次数，或者担心随这些分配产生的内存开销，你可能想避开实现\
  \ B。另一方面，实现 B 的数据结构包含了对多线程系统并发控制的特定支持，这可能比 A 或 C 更符合你的需求，无论动态分配次数如何。（实现 D 不需要特殊的多线程支持，因为它没有使用引用计数。关于线程与引用计数字符串交互的更多信息，请参见项目\
  \ 13 。关于 STL 容器在线程支持方面你可以合理期待的信息，请参阅项目 12。）\n\n在基于引用计数的设计中，`string` 对象之外的所有内容都可以被多个\
  \ `string` 共享（如果它们具有相同的值），因此我们从图中观察到的另一点是，实现 A 提供的共享比 B 或 C 少。特别是，实现 B 和 C 可以共享字符串的大小和容量，从而可能减少存储这些数据的摊均每个对象的成本。有趣的是，实现\
  \ C 无法支持每个对象的分配器，这意味着它是唯一可以共享分配器的实现：所有的 `string` 必须使用同一个分配器！（再次，有关分配器规则的细节，请参阅项目\
  \ 10。）实现 D 不在 `string` 对象之间共享任何数据。\n\n\n\n\n\n`string` 行为中有一个你无法从图中完全推断出的有趣方面，就是关于短字符串内存分配的策略。某些实现拒绝为少于特定数量字符的分配内存，实现\
  \ A 和 D 就在其中。再次查看这条语句：\n\n```\nstring s(\"Perse\"); // s 是一个大小为 5 的字符串\n```\n\n\
  实现 A 的最小分配大小为 32 个字符，因此尽管在所有实现中 `s` 的大小都是 5，但在实现 A 下，它的容量是 31。（第 32 个字符推测留给了末尾空字符，从而使得\
  \ `c_str` 成员函数的更容易实现。）实现 D 的最小缓冲区大小为 16，包括了末尾空字符的空间，因此在实现 D 下，`s` 的容量是 15。当然，实现\
  \ D 在这方面的独特之处在于，容量小于 16 的 `string` s 的内存包含在 `string` 对象内部。实现 B 没有最小分配，在实现 B 下，`s`\
  \ 的容量是 7。（我不知道为什么不是 6 或 5。我没有仔细阅读源代码，抱歉。）\n\n我希望你们很清楚，如果你预计会有大量的短字符串，并且满足以下（1）你的发布环境内存非常小，或（2）你关注引用局部性并希望尽可能将字符串聚类在尽可能少的内存页上，那么各种实现对最小分配的策略可能对你非常重要。\n\
  \n显然，`string` 的实现自由度比初看看起来要多得多，同样显然，不同的实现者以不同的方式利用了这种设计的灵活性。让我们总结一下这些变化的之处：\n\n\
  - `string` 值可能采用引用计数，也可能不。默认情况下，许多实现使用引用计数，但它们通常提供一种关闭它的方法，通常通过预处理器宏实现。条目 13 给出了你可能想要关闭它的特定条件示例，但你可能也因为其他原因而这么做。例如，引用计数只有在字符串频繁复制时才有帮助，而某些应用程序复制字符串的频率并不高，不足以抵消其开销。\n\
  - `string` 对象的大小范围可能从 `char*` 指针大小的一倍到至少七倍不等。\n- 创建一个新的字符串值可能需要零、一次或两次动态分配。\n- `string`\
  \ 对象可能共享或不共享字符串大小和容量的信息。\n- `string` s 可能支持也可能不支持每个对象的分配器。\n- 不同的实现对于字符缓冲器的最小分配有不同的策略。\n\
  \n现在，不要误会我的意思。我认为 `string` 是标准库中最重要的组件之一，我鼓励你尽可能多使用它。例如，条目 13 专门解释了为什么你应该用 `string`\
  \ 代替动态分配的字符数组。同时，如果你想有效利用 STL，你需要意识到 `string` 实现的变异性，特别是当你编写的代码必须运行在不同的 STL 平台上，并且面临严苛的性能要求时。\n\
  \n此外，`string` 在概念上似乎是如此简单。谁能想到它的实现竟然是如此有趣的呢？\n\n### 条目 16：如何将 `vector` 和 `string`\
  \ 数据传递给遗留 API\n\n自 C++ 在 1998 年标准化以来，C++ 精英们在试图引导程序员放弃数组并转向 `vector` 方面一直并不含蓄。他们试图让开发者从\
  \ `char*` 指针转向 `string` 对象方面也同样直白。这些改变有充分的理由，包括消除常见的编程错误（见 条目 13）以及充分利用 STL 算法的能力（例如，见\
  \ 条目 31）。\n\n尽管如此，障碍依然存在，最常见的障碍之一是遗留 C API 使用的是数组和 `char*` 指针而不是 `vector` 和 `string`\
  \ 对象。这些 API 将存在很长时间，如果我们想有效使用 STL，就必须与之和解。\n\n幸运的是，这很容易。如果你有一个 `vector v`，并且你需要一个指向\
  \ `v` 中数据的、可以视为数组的指针，只需使用 `&v[0]`。对于 `string s`，相应的咒语简单就是 `s.c_str()`。但请继续阅读。正如广告中的小字经常指出的，存在某些限制。\n\
  \n假设\n\n```\nvector<int> v;\n```\n\n表达式 `v[0]` 返回 vector 中第一个元素的引用，因此 `&v[0]` 是指向该第一个元素的指针。`vector`\
  \ 中的元素受 C++ 标准限制存储在连续内存中，就像数组一样，因此如果我们想将 `v` 传递给类似这样的 C API\n\n```\nvoid doSomething(const\
  \ int* pInts, size_t numInts);\n```\n\n我们可以这样做：\n\n```\ndoSomething(&v[0], v.size());\n\
  ```\n\n也许吧。可能吧。唯一的症结在于如果 `v` 为空。如果是的话，`v.size()` 为 0，而 `&v[0]` 产生指向不存在内容的指针。这不好。更安全的调用代码方式是：\n\
  \n```\nif (!v.empty()) {\n    doSomething(&v[0], v.size());\n}\n```\n\n如果你混入了错误的圈子，可能会遇到一些道谱的人，他们会告诉你使用\
  \ `v.begin()` 而不是 `&v[0]`，因为（这些可恶的生物会告诉你）`begin` 返回的是一个指向 `vector` 的迭代器。这通常是对的，但正如\
  \ 条目 50 所示，事实并不总是如此，你永远不要依赖它。`begin` 的返回类型是迭代器而不是指针，当你需要指向 `vector` 的指针时，永远不要使用\
  \ `begin`。如果你出于某种原因执意要输入 `v.begin()`，就输入 `&*v.begin()`，因为这将产生与 `&v[0]` 相同的指针，尽管这对你的打字员来说更费力，对那些试图理解你代码的人来说更晦涩。坦率地说，如果你和那些让你用\
  \ `v.begin()` 代替 `&v[0]` 的人在一起，你需要重新考虑你的社交圈。\n\n获取容器数据指针的方法对于 `vector` 有效但对于 `string`\
  \ 并不可靠，因为 (1) `string s` 的数据不保证存储在单一连续内存块中，(2) `string` 的内部表示不保证以空字符结尾。这解释了 `string`\
  \ 成员函数 `c_str` 的存在，它返回一个专为 C 语言设计的字符串值指针。因此，我们可以这样将字符串 `s` 传递给这个函数\n\n```\nvoid\
  \ doSomething(const char *pString);\n```\n\n```\ndoSomething(s.c_str());\n```\n\n\
  即使字符串长度为零，这仍然有效。在这种情况下，`c_str` 将返回一个指向空字符的指针。如果字符串包含嵌入空字符，它也有效。但如果是，`doSomething`\
  \ 可能会将第一个嵌入空字符解释为字符串的结束。`string` 对象不在乎是否包含空字符，但基于 `char*` 的 C API 在意。\n\n\n\n\n\
  在这两种情况下，所传递的指针都是指向 `const` 的指针。`vector` 或 `string` 数据被传递给一个仅对其进行 `read`（读取）而非修改的\
  \ API。这是目前最安全的做法。对于 `string` 来说，这是唯一的办法，因为无法保证 `c_str` 返回的是指向字符串数据内部表示的指针；它返回的可能是指向字符串数据的不可修改\
  \ `copy`（副本）的指针，该副本已为 C API 提供了正确的格式。（如果这让你对效率问题感到后背发凉并产生警觉，请放心，这种警觉可能是多余的。我不知道有任何现代库实现利用了这种这种余地。）\n\
  \n对于 `vector`，你拥有更大的灵活性。如果你将 `v` 传递给一个会修改 `v` 元素的 C API，这通常是可以的，但被调用的程序不能尝试更改 `vector`\
  \ 中元素的数量。例如，它不能尝试在 `vector` 的未使用容量中“创建”新元素。如果这样做，`v` 将在内部变得不自，，因为它将不再知道自己正确的大小。`v.size()`\
  \ 将产生错误的结果。如果被调用的程序尝试向一个大小和容量（参见 Item 14 )）相同的 `vector` 添加数据，可能会发生极其糟糕的事情。我甚至不想去想象它们。它们实在太可怕了。\n\
  \n你注意到我在上一段话的“that’s typically okay”这句话中使用了“typically”（通常）这个词吗？你当然注意到了。某些 `vector`\
  \ 对其数据有额外的约束，如果你将 `vector` 传递给一个修改其数据的 API，你必须确保这些额外约束继续满足。例如，Item 23 解释了排序的 `vector`\
  \ 经常可以作为关联容器的可行替代方案，但对于此类 `vector` 来说，保持排序很重要。如果你将一个排序的 `vector` 传递给可能修改其数据的 API，你需要考虑到在调用返回后该\
  \ `vector` 可能不再是有序的。\n\n如果你有一个想通过 C API 的元素来初始化 `vector`，你可以利用 `vector` 和数组之间底层布局的兼容性，通过向\
  \ API 传递 `vector` 元素的存储空间来实现：\n\n点击此处查看代码图片\n\n```cpp\n// C API: 此函数接收一个最多包含 arraySize\
  \ 个\n// double 的数组指针，并向其写入数据。它返回写入的 double 数量，\n// 该数量永远不超过 arraySize。\nsize_t fillArray(double\
  \ *pArray, size_t arraySize);\n\nvector<double> vd(maxNumDoubles); // 创建一个大小\n//\
  \ 为 maxNumDoubles 的 vector\nvd.resize(fillArray(&vd[0], vd.size())); // 让 fillArray\
  \ 将数据\n// 写入 vd，然后根据 fillArray 写入的\n// 元素数量重调整 vd 的大小\n```\n\n 这种技术仅对 `vector` 有效，因为只有\
  \ `vector` 保证具有与数组相同的底层内存布局。然而，如果你想用 C API 的数据初始化 `string`，可以很容易地做到。只需让 API 将数据放入\
  \ `vector<char>` 中，然后将数据从 `vector` 拷贝到 `string` 即可：\n\n点击此处查看代码图片\n\n```cpp\n//\
  \ C API: 此函数接收一个最多包含 arraySize 个\n// char 的数组指针，并向其写入数据。它返回写入的 char 数量，\n// 该数量永远不超过\
  \ arraySize。\nsize_t fillString(char *pArray, size_t arraySize);\n\nvector<char>\
  \ vc(maxNumChars); // 创建一个大小\n// 为 maxNumChars 的 vector\nsize_t charsWritten = fillString(&vc[0],\
  \ vc.size()); // 让 fillString 将\n// 写入 vc\nstring s(vc.begin(), vc.begin()+charsWritten);\
  \ // 通过范围构造函数\n// 将数据从 vc 拷贝到 s\n// (参见 Item 5)\n```\n\n事实上，让 C API 将数据放入 `vector`\
  \ 然后将数据拷贝到你真正想要的 STL 容器中的想法始终有效：\n\n点击此处查看代码图片\n\n```cpp\nsize_t fillArray(double\
  \ *pArray, size_t arraySize); // 同上\nvector<double> vd(maxNumDoubles); // 同上\nvd.resize(fillArray(&vd[0],\
  \ vd.size()));\ndeque<double> d(vd.begin(), vd.end()); // 将数据拷贝到\n// deque\nlist<double>\
  \ l(vd.begin(), vd.end()); // 将数据拷贝到 list\nset<double> s(vd.begin(), vd.end());\
  \ // 将数据拷贝到 set\n```\n\n此外，这暗示了 `vector` 或 `string` 的 STL 容器如何将数据传递给 C API。只需将每个容器的数据拷贝到\
  \ `vector` 中，然后将其传递给 API：\n\n点击此处查看代码图片\n\n```cpp\nvoid doSomething(const int* pInts,\
  \ size_t numInts); // 示例签名\n\nvector<int> intSet; // 将填充\n... // 填充 intSet\nvector<int>\
  \ v(intSet.begin(), intSet.end()); // 将数据拷贝到\n// vector\ndoSomething(&v[0], v.size());\
  \ // 传递给\n```\n\n### Item 17: 使用 swap 技巧修剪多余容量\n\n为了避免让 `vector` 保留它不再需要的内存，你希望有一种方法将其容量从最大值减少到当前需要的大小。这种容量的减少通常被称为“收缩适应”（shrink\
  \ to fit）。收缩适应编程起来很容易，但代码——该怎么说呢——不那么直观。让我展示给你看，然后解释它是如何工作的。\n\n这是修剪你的 `contestants`\
  \ vector 多余容量的方法：\n\n```cpp\nvector<Contestant>(contestants.begin(), contestants.end()).swap(contestants);\n\
  ```\n\n表达式 `vector<Contestant>(contestants.begin(), contestants.end())` 创建了一个 `contestants`\
  \ 副本的临时 vector；`vector` 的范围构造函数（参见 Item 5）完成了工作。生成的临时 vector 没有多余容量。然后我们将临时 vector\
  \ 中的数据与 `contestants` 中的数据进行 `swap`。当我们完成时，`contestants` 拥有临时 vector 修剪后的容量，而临时\
  \ vector 持有了原在 `contestants` 中的膨胀容量。在此时（语句结束时），临时 vector 被销毁，从而释放了 `contestants`\
  \ 以前使用的内存。漂亮！收缩适应。\n\n同样的技巧也适用于 `string` s：\n\n```cpp\nstring s;\n... // 使 s 变大，删除大部分\n\
  // 字符\nstring(s.begin(), s.end()).swap(s); // 对 s 执行“收缩适应”\n```\n\n\n\n[content]\n\
  现在，语言警察要求我告知你，并没有保证这种技术能够真正消除多余的容量。实现者可以根据意愿为 `vector` 和 `string` 分配多余容量，而且有时它们确实想这样做。例如，它们可能有一个永远不会低于它的最小容量，或者它们可能将\
  \ `vector` 或 `string` 的容量限制为 2 的幂。（根据我的经验，这种异常在 `string` 的实现中比在 `vector` 的实现中更常见。参见\
  \ Item 15。）因此，这种“收缩以适应尺寸”（shrink-to-fit）的方法并不真正意味着“将容量减到最小”，而是意味着“在容器当前大小的基础上，将容量减到该实现愿意提供的最小值”。然而，除非切换到\
  \ STL 的其他实现，否则你所做的极限如此，所以当你考虑到对 `vector` 和 `string` 进行“收缩以适应尺寸”时，请记住“`swap` 技巧”。\n\
  \n顺便提一下，`swap` 技巧的变体既可以用于清除容器，也可以将其容量降低到你的实现提供的最小值。你只需要与一个默认构造的临时 `vector` 或 `string`\
  \ 进行交换即可：\n\n点击此处查看代码图像\n\n```cpp\nvector<Contestant> v;\nstring s;\n... // use\
  \ v and s\n\nvector<Contestant>().swap(v); // clear v 并最小化其容量\nstring() .swap(s);\
  \ // clear s 并最小化其容量\n```\n\n### Item 18: 避免使用 `vector<bool>`\n\n作为一个 STL 容器，`vector<bool>`\
  \ 真的只有两个问题。首先，它不是一个 STL 容器。其次，它不存储 `bool`。除外，没有什么可以反对的。\n\n一个对象并不会因为有人说它是 STL 容器就变成\
  \ STL 容器。只有当它满足 C++ 标准第 23.1 节中规定的所有容器要求时，它才成为 STL 容器。其中一项要求是，如果 `c` 是类型为 `T` 的对象的容器且\
  \ `c` 支持 `operator[]`，则以下代码必须编译：\n\n点击此处查看代码图像\n\n```cpp\nT *p = &c[0]; // 用 operator[]\
  \ 返回的 \n// 地址初始化一个 T*\n```\n\n换句话说，如果你使用 `operator[]` 来获取 `Container<T>` 中的其中一个\
  \ `T` 对象，你就可以通过获取其地址来获得该对象的指针。（这假设 `T` 没有被别扭反地重载 `operator&`。）如果 `vector<bool>`\
  \ 要成为一个容器，那么这段代码必须编译：\n\n点击此处查看代码图像\n\n```cpp\nvector<bool> v;\nbool *pb = &v[0];\
  \ // 用 vector<bool>::operator[] 返回的 \n// 地址初始化一个 bool*\n```\n\n但它不会编译。它之所以不会编译，是因为\
  \ `vector<bool>` 是一个伪容器，它包含的不是真正的 `bool`，而是为了节省空间而设计的 `bool` 的紧凑表示。在典型的实现中，存储在“`vector”中的每个“`bool`”占据一个位（bit），一个\
  \ 8 位字节持有八个“`bool`”。在内部，`vector<bool>` 使用位域的等价物来表示它假装持有的 `bool`。\n\n与 `bool` 一样，位域只表示两种可能的值，但真正的\
  \ `bool` 和伪装成 `bool` 的位域之间存在着重要的区别。你可以创建一个指向真实 `bool` 的指针，但禁止创建指向单个位的指针。\n\n对单个位的引用也是被禁止的，这为\
  \ `vector<bool>` 接口的设计带来了问题，因为 `vector<T>::operator[]` 的返回类型本应该是 `T&`。如果 `vector<bool>`\
  \ 真的持有 `bool`，这就不是问题了，但因为它并没有持有，`vector<bool>::operator[]` 需要以某种方式返回一个对位的引用，而并没有这种东西。\n\
  \n为了解决这个困难，`vector<bool>::operator[]` 返回了一个*行为类似于*位引用的对象，即所谓的*代理对象*（proxy object）。使用\
  \ STL 不需要理解代理对象，但它们是种值得了解的 C++ 技术。关于它们的详细信息，请参阅《More Effective C++》中的 Item 30 以及\
  \ Gamma 等人的著作《Design Patterns》中的“Proxy”章节 [6 ]。剥离到核心部分，`vector<bool>` 看起来像这样：\n\n\
  点击此处查看代码图像\n\n```cpp\ntemplate <typename Allocator>\nvector<bool, Allocator> {\n\
  public:\n    class reference { ... }; // 用于生成代理的类\n    // 对单个位的引用\n    reference\
  \ operator[](size_type n); // operator[] 返回一个代理\n    ...\n};\n```\n\n现在清楚为什么这段代码不会编译了：\n\
  \n点击此处查看代码图像\n\n```cpp\nvector<bool> v;\nbool *pb = &v[0]; // 用 vector<bool>::operator[]\
  \ 返回的 \n// 地址初始化一个 bool*\n```\n[/content]\n\n\n\n现在，让我来讨论那个失败的伟大实验，它留下的残留物是 STL\
  \ 非容器 `vector<bool>`。我之前提到过，代理对象在 C++ 软件开发中通常很有用。C++ 标准化委员会的成员们深清楚这一点，因此他们决定开发 `vector<bool>`，以此作为\
  \ STL 如何支持元素通过代理访问的容器的演示。他们推认为，通过在标准中包含这个示例，可以为实践者实现他们自己的基于代理的容器提供一个现成的参考。\n\n遗憾的是，他们发现无法创建一个满足所有\
  \ STL 容器要求的基于代理的容器。然而，由于某种原因或另一种原因，他们开发这种容器的失败尝试仍然被保留在了标准中。人们可以推测 `vector<bool>`\
  \ 为什么被保留下来，但从实践上来说，这并不重要。重要的是此点：`vector<bool>` 并不满足 STL 容器的要求；你最好不要使用它；而 `deque<bool>`\
  \ 和 `bitset` 是替代数据结构，它们几乎肯定能满足你对 `vector<bool>` 所承诺的功能的需求。\n\n# 第 3 章 关联容器\n\n就像电影《绿野仙踪》中的彩虹马一样，关联容器是不同颜色的生物。诚然，它们与顺序容器共享许多特征，但在许多基本方面与它们不同。例如，它们会自动保持排序；它们通过等价性（equivalence）而不是相等性（equality）的视角来看待其内容；`set`\
  \ 和 `map` 拒绝重复项；`map` 和 `multimap` 通常忽略它们所包含的每个对象的一半内容。是的，关联容器确实是容器，但如果你原谅我将 `vector`\
  \ 和 `string` 比作堪萨斯州，那么我们绝对不在堪萨斯州了。\n\n在接下来的章节中，我解释了“等价性”这一关键概念，描述了对比较函数的一个重要限制，说明了为指针关联容器编写自定义比较函数的必要性，讨论了关键\
  \ `const` 特性的官方和实用两方面，并提供了关于提高关联容器效率的建议。\n\n在章节结束处，我检查了 STL 缺乏基于哈表的容器，并调查了两种常见的（非标准）实现。尽管\
  \ STL 本身没有提供哈希表，但你不需要自己编写或无计可用。高质量的实现随处可见。\n\n## Item 19：理解相等性和等价性之间的区别\n\nSTL 中充斥着对对象进行比较，以检查它们是否具有相同的值。例如，当你要求\
  \ `find` 在范围内查找具有特定值的第一个对象时，`find` 必须能够比较两个对象，以查看一个值是否与另一个值相同。同样，当你尝试向 `set` `insert`\
  \ 一个新元素时，`set::insert` 必须能够判断该元素的值是否已经在 `set` 中。\n\n`find` 算法和 `set` 的 `insert`\
  \ 成员函数是许多必须判断两个值是否相同的函数的代表。然而，它们以不同的方式执行此操作。`find` 对“相同”的定义是*相等性*（equality*），它基于\
  \ `operator==`。`set::insert` 对“相同”的定义是*等价性*（equivalence*），它通常基于 `operator<`。因为这些是不同的定义，可能出现这种情况：一个定义规定两个对象具有相同的值，而另一个定义却规定它们没有。因此，如果你想有效利用\
  \ STL，就必须理解相等性和等价性之间的区别。\n\n在操作上，相等性的概念基于 `operator==`。如果表达式 `x == y` 返回真，则 `x`\
  \ 和 `y` 具有相等的值，否则没有。这相当直接，但很有用记住，仅仅因为 `x` 和 `y` 具有相等的值并不意味着它们的所有数据成员具有相等的值。例如，我们可能有一个\
  \ `Widget` 类，它在内部具有相等的数据成员：\n\n```cpp\nclass Widget {\npublic:\n    int id;\n  \
  \  bool operator==(const Widget& rhs) const {\n        return id == rhs.id;\n  \
  \  }\nprivate:\n    int other_data;\n};\n```\n\n操作上，相等性的概念基于 `operator==`。如果表达式\
