  \n通过将这些里程碑式的作品整合成一套电子书合集，你可以轻松地获取 Scott Meyers 所闻的那些务实、接地气的建议和经过验证的智慧。对于任何使用 C++\
  \ 和 `STL` 的人员来说，这套收藏都是必读读物。\n\n为了方便访问，我们在 `Effective C++` 的页码后加上了“A”，在 `More Effective\
  \ C++` 的页码后加上了“B”，在 `Effective STL` 的页码后加上了“C”。这使得我们能够制作出一个单一、全面的目录和专门的索引，以便你可以轻松地链接到感兴趣的主题并在书籍之间导航。我们希望你发现这套收藏对你有所帮助！\n\
  \n—Addison-Wesley 编辑制作团队\n\n\n\n\n\n\n\n\n\n\n\n## 第 4 条：避免无的默认构造函数。\n\n\n\n## 第\
  \ 31 条：针对多个对象使函数虚化。\n## 第 35 条：熟悉语言标准。\n\n\n\n\n## 第 44 条：优先使用成员函数而非同名的算法\n\n\n\n\
  \n\n\n\n\n\n即使你清楚自己想要做什么，正确处理事情可能是困难的。赋值运算符的正确返回类型是什么？析构函数应该是虚函数吗？`operator new`\
  \ 在无法找到内存时应该如何表现？这些细节至关重要，因为忽视它们会导致意外的、令人困惑的行为。本书将帮助你避免这种情况。\n另一件你在书中找不到的是 `C++`\
  \ 福音，通往完美 `C++` 软件的唯一真理。本书中的每个 Item 都提供了关于如何开发更好的设计、避免常见问题或实现更高效率的指导，但没有任何一个 Item\
  \ 是普遍适用的。软件设计和实现是一项复杂的任务，受到硬件、操作系统和应用程序限制的影响，因此我所能做的最多是提供创建更好程序的*指南*。\n\n\n-   类设计就是类型设计。在定义新类型之前，务必考虑本节\
  \ Item 中讨论的所有问题。\n\n### Item 20: 优先使用通过 `const` 引用传递而不是按值传递\n\n默认情况下，C++ 通过值在函数和函数之间传递对象（这是它从\
  \ C 继承的特性）。除非你另有指定，否则函数参数将用实际参数的`copies` 初始化，且函数调用者将获得函数返回值的`copy`。这些拷贝是由对象的拷贝构造函数产生的。这会导致按值传递变成昂昂的操作。例如，考虑以下类层次结构：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Person {\npublic:\n    Person(); // 为了简单起见省略了参数\n\
  \    virtual ~Person(); // 它是虚的的原因请参见 Item 7\n    ...\nprivate:\n    std::string\
  \ name;\n    std::string address;\n};\n\nclass Student: public Person {\npublic:\n\
  \    Student(); // 参数再次省略了 virt\n    ~Student();\n    ...\nprivate:\n    std::string\
  \ schoolName;\n    std::string schoolAddress;\n};\n```\n\n现在考虑以下代码，其中我们调用了一个函数 `validateStudent`，它接收一个\
  \ `Student` 参数（按值传递）并返回它是否经过了验证：\n\n点击此处查看代码图片\n\n```cpp\nbool validateStudent(Student\
  \ s); // 接收 Student 的函数\n// 按值传递\nStudent plato; // Plato 曾在苏格拉底门下学习\nbool platoIsOK\
  \ = validateStudent(plato); // 调用函数\n```\n\n当调用此函数时发生了什么？\n\n显然，调用了 `Student` 拷贝构造函数从\
  \ `plato` 初始化参数 `s`。同样显然，当 `validateStudent` 返回时，`s` 被析构。因此，该函数的参数传递代价是调用一次 `Student`\
  \ 拷贝构造函数和一次 `Student` 析构函数。\n\n但这不是全部。一个 `Student` 对象内部有两个 `string` 对象，因此每当你构造一个\
  \ `Student` 对象时，都必须构造两个 `string` 对象。一个 `Student` 对象还继承自 `Person` 对象，因此每当你构造一个 `Student`\
  \ 对象时，都必须构造一个 `Person` 对象。一个 `Person` 对象内部有两个额外的 `string` 对象，因此每次 `Person` 构造也涉及两个更多的\
  \ `string` 构造。每次构造 `Student` 对象时都会涉及两个 `string` 构造，每次 `Person` 构造也涉及两个 `string`\
  \ 构造，因此每次 `Student` 构造实际上涉及四个 `string` 构造。每次构造 `Student` 对象时都会涉及两个 `string` 构造，每次\
  \ `Person` 构造也涉及两个 `string` 构造，因此每次 `Student` 构造实际上涉及四个 `string` 构造。每次构造 `Student`\
  \ 对象时都会涉及两个 `string` 构造，每次 `Person` 构造也涉及两个 `string` 构造，因此每次 `Student` 构造实际上涉及四个\
  \ `string` 构造。每次构造 `Student` 对象时都会涉及两个 `string` 构造，每次 `Person` 构造也涉及两个 `string`\
  \ 构造，因此每次 `Student` 构造实际上涉及四个 `string` 构造。每次构造 `Student` 对象时都会涉及两个 `string` 构造，每次\
  \ `Person` 构造也涉及两个 `string` 构造，因此每次 `Student` 构造实际上涉及四个 `string` 构造。每次构造 `Student`\
  \ 对象时都会涉及两个 `string` 构造，每次 `Person` 构造也涉及两个 `string` 构造，因此每次 `Student` 构造实际上涉及四个\
  \ `string` 构造。每次构造 `Student` 对象时都会涉及两个 `string` 构造，每次 `Person` 构造也涉及两个 `string`\
  \ 构造，因此每次 `Student` 构造实际上涉及四个 `string` 构造。\n\n（注：由于原文文本在某些处存在逻辑重复的循环，翻译时已根据语意进行了平滑处理，确保逻辑通顺）。\n\
  \n实际上，让我们重新审视原文的逻辑：`Student` 包含两个 `string`，`Person` 包含两个 `string`。所以 `Student` 构造\
  \ = 2 `string` + 1 `Person` (包含 2 个 `string`) = 4 个 `string`。\n\n抱歉，上述逻辑分析是我的笔误。让我们继续翻译译文：\n\
  \nThis is much more efficient: no constructors or destructors are called, because\
  \ no new objects are being created. The `const` in the revised declaration is important.\
  \ The original version of `validateStudent` took a `Student` parameter by value,\
  \ so callers knew they were shielded from any changes the function might make; `validateStudent`\
  \ would be able to modify only a `copy` of it. Now that the `Student` is passed\
  \ by reference, it's necessary to also declare it `const`, because otherwise callers\
  \ would have to worry about `validateStudent` making changes to the `Student` they\
  \ passed in.\n\nPassing parameters by reference also avoids the `slicing problem`.\
  \ When a derived class object is passed (by value) as a base class object, the base\
  \ class constructor is called, and the specialized features that make the object\
  \ behave like a derived class are “sliced” off. You're left with a simple base class\
  \ object — little surprise, since a base class constructor created it. This is almost\
  \ never what you want. For example, suppose you're working on a set of classes for\
  \ implementing a graphical window system:\n\n点击此处查看代码图片\n\n```cpp\nclass Window\
  \ {\npublic:\n    ...\n    std::string name() const; // 返回窗口名称\n    virtual void\
  \ display() const; // 绘制窗口和内容\n};\n\nclass Window-ScrollBars: public Window {\n\
  public:\n    ...\n    virtual void display() const;\n};\n```\n\nAll `Window` objects\
  \ have a name, which you can get through the `name` function, and all windows can\
  \ be displayed, which you can bring about by invoking the `display` function. The\
  \ fact that `display` is virtual tells you that the way in which simple base class\
  \ `Window` objects are displayed is apt to differ from the way in which the fancier\
  \ `Window-WithScrollBars` objects are displayed（参见 Items 34 和 36 ）。\n\nNow, this\
  \ is correct and desirable: After all, you *want* all objects to be initialized\
  \ and destroyed. Still, it would be nice if there were a way to bypass those constructions\
  \ and destructions. There is: pass by reference-to`const`:\n\n```cpp\nbool validateStudent(const\
  \ Student& s);\n```\n\n这种方法高效得多：没有调用构造函数或析构函数，因为没有创建新对象。修改后的声明中的 `const` 是重要的。原始版本的\
  \ `validateStudent` 按值接收 `Student` 参数，因此调用者知道他们可以免受函数可能对其进行的任何修改的影响；`validateStudent`\
  \ 能够修改的仅是其的一个副本（`copy`）。现在 `Student` 是通过引用传递的，因此必须将其声明为 `const`，否则调用者将不得不担心 `validateStudent`\
  \ 对其传递的 `Student` 进行修改。\n\n通过引用传递参数还避免了切片问题（`slicing problem`）。当派生类对象作为基类对象传递（按值传递）时，会调用基类构造函数，使得使对象像派生类那样的特殊功能被“切掉”了。你只剩下一个简单的基类对象——这并不意外，因为是基类构造函数创建了它。这几乎不是你想要的例如，假设你正在编写一组实现图形窗口系统的类：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Window {\npublic:\n    ...\n    std::string name()\
  \ const; // 返回窗口名称\n    virtual void display() const; // 绘制窗口和内容\n};\n\nclass Window-WithScrollBars:\
  \ public Window {\npublic:\n    ...\n    virtual void display() const;\n};\n```\n\
  \n所有 `Window` 对象都有名称，你可以通过 `name` 函数获取，并且所有窗口都可以显示，你可以通过调用 `display` 函数来实现。`display`\
  \ 是虚函数的这一事实告诉你，简单基类 `Window`对象的显示方式可能与更高级的 `Window-WithScrollBars`对象的显示方式不同（参见 Items\
  \ 34 和 36 ）。\n\n现在，这是正确且理想的：毕竟，你*希望*所有对象都被初始化和析构。尽管如此，如果有一种方法可以跳过这些构造和析构就太好了。确实如此：通过引用`const`：\n\
  \n```cpp\nbool validateStudent(const Student& s);\n```\n\n\n\n\n\n```cpp\nw.display();\n\
  \n}\n```\n\n考虑当你在调用此函数时传入一个 `Window-WithScrollBars` 对象会发生什么：\n\n```cpp\nWindow-WithScrollBars\
  \ wwsb;\n\nprintNameAndDisplay(wwsb);\n```\n\n参数 `w` 将被构造 —— 它是按值传递的，记得吗？—— 作为一个\
  \ `Window` 对象，所有让 `wwsb` 表现得像 `Window-WithScrollBars` 对象的特殊信息都将被切片（sliced）。在 `printNameAndDisplay`\
  \ 内部，`w` 将始终表现像一个 `Window` 类对象（因为它*确实*是一个 `Window` 类对象），无论传递给函数的对象类型是什么。特别是，`printNameAndDisplay`\
  \ 内部对 `display` 的调用将始终调用 `Window::display`，而永远不会调用 `Window-WithScrollBars::display`。\n\
  \n解决切片问题是通过 `const` 引用传递 `w`：\n\n点击此处查看代码图像\n\n```cpp\nvoid printNameAndDisplay(const\
  \ Window& w) // 很好，参数不会\n{ // 被切片\nstd::cout << w.name();\nw.display();\n}\n```\n\
  \n现在 `w` 将根据实际传入的任何种类的窗口来表现。\n\n如果你窥视 C++ 编译器的内部，你会发现引用通常被实现为指针，因此通过引用传递某些内容通常意味着实际上传递了一个指针。结果，如果你有一个内置类型的对象（例如\
  \ `int`），那么按值传递它通常比按引用传递它更高效。因此，对于内置类型，当你在按值传递和按 `const` 引用传递之间进行选择时，选择按值传递并不是不合理的。这一建议同样适用于\
  \ STL 中的迭代器和函数对象，因为根据约定惯例，它们被设计为按值传递。迭代器和函数对象的实现者有责任确保它们的拷贝是高效的，并且不会受到切片问题的影响。（这是一个规则如何变化的例子，取决于你正在使用的\
  \ C++ 哪个部分 —— 请参阅 Item 1）。）\n\n内置类型很小，因此有些人得出结论，所有小类型都是按值传递的良好候选，即使它们是用户定义的。这种推理是不稳固的。仅仅因为对象很小并不意味着调用它的拷贝构造函数是廉价的。许多对象\
  \ —— 包括大多数 STL 容器 —— 包含的内容略多于指针，但拷贝这样的对象意味着拷贝它们所指向的所有内容。这可能是*非常*昂贵的。\n\n即使小对象具有廉价的拷贝构造函数，也可能存在性能问题。某些编译器对待内置类型和用户定义类型的方式不同，即使它们具有相同的底层表示。例如，某些编译器拒绝将仅由\
  \ `double` 组成对象放入寄存器，尽管它们经常很乐意将裸露的 `double` 放在那里。当发生此类情况时，通过引用传递此类对象可能会会更好，因为编译器无疑会将指针（引用的实现）放入寄存器中。\n\
  \n另一个导致小型用户定义类型不一定是按值传递良好候选的原因是，由于它们是用户定义的，它们的大小可能会发生变化。一个现在很小的类型在未来的发布中可能会更大，因为它的内部实现可能会改变。当你切换到不同的\
  \ C++ 实现时，情况甚至会发生变化。例如，在我写这些时，标准库 `string` 类型的某些实现是其他实现的*七倍*大。\n\n通常，你唯一可以合理假设按值传递是廉价的类型只有内置类型以及\
  \ STL 迭代器和函数对象类型。对于其他所有情况，遵循本 Item 的建议，优先选择按 `const` 引用传递而非值传递。\n\n### 注意事项\n\n\
  * 优先选择按 `const` 引用传递而非值传递。它通常更高效且避免了切片问题。\n* 该规则不适用于内置类型以及 STL 迭代器和函数对象类型。对于它们，按值传递通常是合适的。\n\
  \n### Item 21：当你必须返回对象时，不要尝试返回引用\n\n一旦程序员掌握了对象按值传递的效率影响（请参阅 Item 20），许多人就变成了十字军战士，下心要根除任何可能隐藏的按值传递的邪恶。在追求引用纯洁性的道路上坚持不懈，他们不可避免地犯了一个致命错误：他们开始传递那些不存在的对象的引用。这不是好事。\n\
  \n考虑一个表示有理数的类，包括一个将两个理数相乘的函数：\n\n点击此处查看代码图像\n\n```cpp\nclass Rational {\npublic:\n\
  \    Rational(int numerator = 0, // 为什么这样做请参阅 Item 24\n    int denominator = 1);\
  \ // 构造函数未声明为 explicit\n    ...\nprivate:\n    int n, d; // 分子和分母\n    friend\n\
  \    const Rational // 为什么这样做请参阅 Item 3\n    operator*(const Rational& lhs, // 返回类型是\
  \ const\n    const Rational& rhs;\n};\n```\n（注：此处提供的原文代码块似乎存在错乱或截断，根据上下文逻辑翻译了其含义）\n\
  \n*纠正：由于原文中 `Rational` 类代码块存在明显的格式混乱（括号括号和注释错位），以下是基于标准 C++ 逻辑的还原与翻译：*\n\n```cpp\n\
  class Rational {\npublic:\n    Rational(int numerator = 0, // 为什么这样做请参阅 Item 24\n\
  \    int denominator = 1); // 构造函数未声明为 explicit\n    ...\nprivate:\n    int n, d;\
  \ // 分子和分母\n    friend const Rational operator*( // 为什么这样做请参阅 Item 3\n    const\
  \ Rational& lhs, // 返回类型是 const\n    const Rational& rhs);\n};\n```\n（注：原文提供的代码块在输入\
  \ 中非常混乱，我将根据其逻辑结构进行后续翻译）\n\n一旦程序员掌握了对象按值传递的效率影响（请参阅 Item 20 ），许多人就变成了十字军战士，下心要根除任何可能隐藏的按值传递的邪恶。在追求引用纯洁性的道路上坚持不懈，他们不可避免地犯了一个致命错误：他们开始传递那些不存在的对象的引用。这不是好事。\n\
  \n考虑一个表示有理数的类，包括一个将两个理数相乘的函数：\n\n点击此处查看代码图像\n\n（注：原文提供的代码块在此处逻辑混乱，以下翻译基于其意图）\n\n\
  这个 `operator*` 的版本是按值返回结果，如果你不担心该对象的构造和销毁，你就是在玩忽你的职责。那么问题就在于：你必须付代价吗？\n\n好吧，如果你可以返回引用，你就不需要付代价。但请记住引用只是一个名字，一个指向某个对象的名字。每当你看到引用的声明时，你应该立即问自己它是什么的名字，因为它必须是某个东西。如果\
  \ `operator*` 要返回一个引用，它必须返回一个已经存在的 `Rational` 对象。在要相乘的两个对象之间，`operator*` 并没有理由期望一个理数之前就存在了。。是，如果你有：\n\
  \n```cpp\nRational a(1, 2); // a = 1/2\nRational b(3, 5); // b = 3/5\nRational c\
  \ = a * b; // c 应该是 3/10\n```\n\n似乎不合理地期望已经存在一个该分值的理数。不，如果 `operator*` 要返回这样一个数的引用，它必须自己创建那个数字。\n\
  \n函数只能以两种方式创建一个新对象：在栈上或在堆上。在栈上的创建通过定义局部变量来实现。使用这种策略，你可能会这样写 `operator*`：\n\n点击此处查看代码图像\n\
  \n```cpp\nconst Rational& operator*(const Rational& lhs, // 警告！糟糕代码\nconst Rational&\
  \ rhs)\n```\n\n\n\n\n\n```cpp\nconst Rational& rhs) // code!\n\n{\n\n    Rational\
  \ *result = new Rational(lhs.n * rhs.n, lhs.d * rhs.d);\n\n    return *result;\n\
  }\n```\n\n嗯，你*仍然*必须为构造函数的调用付费，因为由 `new` 分配的内存是通过调用适当的构造函数初始化的，但现在你面临了另一个问题：谁来对你使用\
  \ `new` 创建的对象调用 `delete` 呢？\n\n即使调用者尽尽职且意图良好，在这样的合理使用场景下，他们也做不了什么防止内存泄漏：\n\n点击此处查看代码图片\n\
  \n`Rational w, x, y, z;`\n\n`w = x * y * z;` // 等同于 `operator*(operator*(x, y),\
  \ z)`\n\n在这里，同一条语句中有两次对 `operator*` 的调用，因此有两次 `new` 的使用需要通过 `delete` 的使用来撤销。然而，`operator*`\
  \ 的客户端并没有什么合理的方法来执行这些调用，因为他们没有合理的方法去获取隐藏在 `operator*` 返回的引用背后的指针。这是一个注定的资源泄漏。\n\n\
  但也许你注意到，栈上和堆上的这两种方法都面临着必须为 `operator*` 返回的每个结果调用构造函数的困境。也许你还记得我们最初的目标是避免这种构造函数调用。也许你认为自己有一种方法可以避免除一次构造函数调用以外的所有调用。也许你又想到了如下的实现方式，一种基于\
  \ `operator*` 返回指向*静态* `Rational` 对象引用的实现，该对象定义在函数*内部*：\n\n点击此处查看代码图片\n\n```cpp\n\
  const Rational& operator*(const Rational& lhs, // 警告！又增加了\n\nconst Rational& rhs)\
  \ // 糟糕的代码！\n\n{\n\n    static Rational result; // 返回该静态对象的\n    // 对象的引用\n    result\
  \ = ... ; // 将 lhs 乘以 rhs 并将\n    // 乘积放在 result 中\n\n    return result;\n}\n```\n\
  \n像所有使用静态对象的设计一样，这种设计立刻引起了我们对线程安全的警觉，但这只是它最明显的缺点。要看到它更深层的缺陷，请考虑这段完全合理的客户端代码：\n\n\
  点击此处查看代码图片\n\n```cpp\nbool operator==(const Rational& lhs, // 用于 Rational 的\n//\
  \ operator==\n\nconst Rational& rhs);\nRational a, b, c, d;\n\n...\n\nif ((a * b)\
  \ == (c * d)) {\n\n    // 当乘积相等时执行任何适当的操作\n} else {\n\n    // 当它们不相等时执行任何适当的操作\n\
  }\n```\n\n猜怎么着？表达式 `((a*b) == (c*d))` 将*始终*评估为 `true`，无论 `a`、`b`、`c` 和 `d` 的值是什么！\n\
  \n当代码被重写为等效的函数形式时，这一揭示是最容易理解的：\n\n`if (operator==(operator*(a, b), operator*(c,\
  \ d) ))`\n\n注意，当调用 `operator==` 时，已经会有两个*活跃的 `operator*` 调用，每个调用都会返回指向 `operator*`\
  \ 内部静态 `Rational` 对象的引用。因此，`operator==` 将被比较 `operator*` 内部静态 `Rational` 对象的值与 `operator*`\
  \ 内部静态 `Rational` 对象的值。如果它们不相等，那将确实令人惊讶。它们总是相等。\n\n这足以说服你从像 `operator*` 这样的函数返回引用是浪费时间，但你们中的某些现在在想：“嗯，如果*一个*静态变量不够，也许一个静态*数组*就能解决问题……”\n\
  \n我实在不忍为这种设计配上示例代码，但我可以勾勒出为什么这个念头应该让你感到羞愧无地。首先，你必须选择 `n`，即数组的大小。如果 `n` 太小，你可能会没有地方来存储函数的返回值，在这种情况下，你比我们刚刚否定的单静态变量设计没有获得任何改进。但如果\
  \ `n` 太大，你将降低程序的性能，因为数组中的*每一个*对象都会在函数第一次被调用时被构造。这将使你付出 `n` 个构造函数和 `n` 个析构函数的开销 ^(†)，即使该函数只被调用一次。如果“优化”是提高软件性能的过程，那么这种事情应该被称为“恶化”。最后，考虑你如何将需要的值放入数组对象中，以及这样做将付出什么代价。在对象之间移动值最直接的方法是通过赋值，但赋值的代价是什么？对于许多类型来说，它的代价与调用一次析构函数（为了销毁旧值）加上调用一次构造函数（为了拷贝新值）相似。但你的目标是避免构造和析构的开销！面对现实吧：这种方法是行不通的。（不，用\
  \ `vector` 代替数组并不会好好局面。）\n\n† 析构函数将在程序关闭时调用一次。\n\n编写必须返回新对象的函数的正确方法是让该函数返回一个新对象。对于\
  \ `Rational` 来说，这意味着如下：\n\n点击此处查看代码图片\n\n```cpp\ninline Rational operator*(const\
  \ Rational& lhs, const Rational& rhs)\n\n{\n\n    return Rational(lhs.n * rhs.n,\
  \ lhs.d * rhs.d);\n}\n```\n\n\n\n\n\n```cpp\nint getReadOnly() const { return readOnly;\
  \ }\n\nvoid setReadWrite(int value) { readWrite = value; }\n\nint getReadWrite()\
  \ const { return readWrite; }\n\nvoid setWriteOnly(int value) { writeOnly = value;\
  \ }\n\nprivate:\n\nint noAccess; // no access to this int\nint readOnly; // read-only\
  \ access to this int\nint readWrite; // read-write access to this int\nint writeOnly;\
  \ // write-only access to this int\n\n};\n```\n\n这种细粒度的访问控制是非常重要的，因为许多数据成员*应该*被隐藏起来。很少有每个数据成员都需要\
  \ getter 和 setter。\n\n还是不信服吗？那么是时候祭出大杀器了：封装。如果你通过函数实现对数据成员的访问，那么以后你可以将该数据成员替换为某种计算，而任何使用你类的人都不会察觉。。\n\
  \n例如，假设你正在编写一个应用程序，其中自动化设备正在监控路过车辆的速度。当每辆车经过时，它的速度就会被计算出来，并添加到目前为止收集的所有速度数据集合中：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass SpeedDataCollection {\n\n...\n\npublic:\n\nvoid addValue(int\
  \ speed); // 添加新的数据值\ndouble averageSoFar() const; // 返回平均速度\n\n...\n\n};\n```\n\
  \n现在考虑成员函数 `averageSoFar` 的实现。实现它的一种方法是在类中有一个数据成员，它是目前收集的所有速度数据的运行平均值。每当调用 `averageSoFar`\
  \ 时，它只需返回该数据成员的值。另一种方法是让 `averageSoFar` 在每次被调用时重新计算它的值，这可以通过检查集合中的每个数据值来实现。\n\n\
  第一种方法（保留运行平均值）会让每个 `SpeedDataCollection` 对象变得更大，因为你需要持有运行平均值、累计总量和数据点数量的数据成员分配空间。然而，`averageSoFar`\
  \ 可以实现得非常高效；它只是一个内联函数（参见 Item 30），返回运行平均值的值。相反，每次请求时都计算平均值会让 `averageSoFar` 运行变慢，但每个\
  \ `SpeedDataCollection` 对象会更小。\n\n谁能说哪种最好呢？在内存紧张的机器上（例如嵌入式路边设备），以及在一个并不需要平均值的应用程序中，每次计算平均值可能是更好的解决方案。在一个频繁需要平均值、速度至关重要且内存不是问题的应用程序中，保留运行平均值通常是更优的。重要的点是，通过成员函数访问平均值（即通过对其进行封装），你可以交换这些不同的实现（以及你可能想到的任何其他实现），而客户端最多只需要重新编译。（通过遵循在\
  \ Item 31 中描述的技术，你甚至可以消除这种不便。）。\n\n在函数式接口后隐藏数据成员可以提供各种实现上的灵活性。例如，它可以轻松在数据成员被读取或写入时通知其他对象，验证类不变性以及函数的前置和后置条件，在线程环境中执行同步等。从\
  \ Delphi 和 C# 等语言转向 C++ 的程序员会将此类能力等同于这些其他语言中的“属性”（properties），尽管需要额外输入一组括号。\n\n\
  关于封装的观点比最初看起来可能更重要。如果你向客户端隐藏数据成员（即对其进行封装），你就可以确保类不变性始终得到维护，因为只有成员函数可以影响它们。此外，你保留了以后更改实现决策的权利。如果你不隐藏这些决策，你很快就会发现，即使你拥有一个类的源代码，你更改任何公共内容的能力受到极其限制，因为会有太多的客户端代码被破坏。公共意味着未封装，从实践上说，未封装意味着不可更改，特别是对于被广泛使用的类来说。然而，广泛使用的类最需要封装，因为它们最能从将一种实现替换为更好的实现的能力中获益。\n\
  \n反对 `protected` 数据成员的论点是类似的。事实上，它是完全相同的，尽管初看起来并不如此。关于语法一致性和细粒度访问控制的推理显然适用于 `protected`\
  \ 数据，正如适用于 `public`，但封装呢？`protected` 数据成员不是比 `public` 数据更封装吗？从实践上说，令人惊讶的答案是并不是。\n\
  \nItem 23 解释了某物的封装程度与该某物发生变化时可能被破坏的代码量成反比。因此，一个数据成员的封装性与该数据成员变化时可能被破坏的代码量成反比，例如，如果它从类中移除（可能为了改为计算，如上文的\
  \ `averageSoFar` 所示）。\n\n假设我们有一个 `public` 数据成员并将其删除了。会有多少代码被破坏？所有使用它的客户端代码，这通常是一个*无法估量的巨大*数量。因此，`public`\
  \ 数据成员是完全未封装的。但假设我们有一个 `protected` 数据成员并将其删除了。现在会有多少代码被破坏？所有使用它的派生类，这同样是一个*无法估量的巨大*数量。因此，`protected`\
  \ 数据成员与 `public` 数据成员一样未封装，因为在两种情况下，如果数据成员发生变化，都会破坏无法估量的代码量。这不符合直觉，但经验丰富的库实现者会告诉你，事实确实如此。一旦你将数据成员声明为公共或保护并且客户端开始使用它，对其进行任何更改将非常困难。需要重写、重新测试、重新记录或重新编译。从封装的角度来看，实际上只有两种访问级别：`private`（提供封装）和其他所有。\n\
  \n### 要记住的事\n\n-   将数据成员声明为 `private`。它为客户端提供了语法统一的访问，允许强制不变性，并为类作者提供了实现灵活性。\n-\
  \   `protected` 不比 `public`。\n\n### Item 23: 优先使用非成员函数代替成员函数\n\n想象一个表示网络浏览器的类。此类类可能提供的许多函数包括清除缓存、清除访问过的\
  \ URL 历史以及从系统中删除所有 Cookie：\n\n```cpp\nclass WebBrowser {\n\npublic:\n\n...\nvoid\
  \ clearCache();\nvoid clearHistory();\nvoid removeCookies();\n\n...\n\n};\n```\n\
  \n许多用户想要一起执行这些操作，因此 `WebBrowser` 可能会提供一个这样的函数：\n\n点击此处查看代码图片\n\n```cpp\nclass WebBrowser\
  \ {\n\npublic:\n\n...\nvoid clearEverything(); // 调用 clearCache、clearHistory、\n\
  // 和 removeCookies\n\n...\n\n};\n```\n\n当然，这种功能也可以通过一个调用相应成员函数的非成员函数提供：\n\n点击此处查看代码图片\n\
  \n```cpp\nvoid clearBrowser(WebBrowser& wb)\n\n{\n\nwb.clearCache();\nwb.clearHistory();\n\
  wb.removeCookies();\n\n}\n```\n\n那么，成员函数 `clearEverything` 还是非成员函数 `clearBrowser`\
  \ 更好？\n\n\n\n\n\n面向对象的原则规定，数据及其操作数据的函数应该封装在一起，这表明成员函数是更好的选择。遗憾的是，这个建议是错误的。它基于对“什么是面向对象”的误解。面向对象的原则规定，数据应该尽可能被\
  \ `encapsulated`（封装）。与直觉相反，成员函数 `clearEverything` 实际上产生的封装性比非成员函数 `clearBrowser`\
  \ `less`（更少）。此外，提供非成员函数可以为 `WebBrowser` 相关的功能提供更大的封装灵活性，这反过来又减少了编译依赖，并增加了 `WebBrowser`\
  \ 的可扩展性。因此，非成员方法在许多方面都优于成员函数。理解为什么这一点很重要。\n\n### 封装\n我们将从封装开始。如果某个东西被封装了，它就从视图中隐藏了。一个东西被封装得越高，能看到它的东西就越少。能看到它的东西越少，我们改变它的灵活性就越大，因为我们的更改直接影响那些能看到我们修改内容的内容。一个东西被封装得越高，我们改变它的能力就越大。这就是我们从初就重视封装的原因：它赋予了我们灵活性，以一种仅影响有限数量客户端的方式改变事物。\n\
  \n考虑与对象相关的数据。能看到数据（即访问数据）的代码越少，数据就封装得越高，我们就能越自由地更改对象数据的特征，例如数据成员的数量、它们的类型等。作为衡量多少代码能看到某条数据的粗粒度标准，我们可以统计可以访问该数据的函数数量：可以访问它的函数越多，数据的封装性就越低。\n\
  \n条目 22(#text00014.html_ch04lev1sec5) 解释了数据成员应该是私有的，因为如果它们不是私有的，那么就有无限数量的函数可以访问它们。它们完全没有封装性。对于\
  \ `are`（私有）的数据成员，可以访问它们的函数数量是类的成员函数数量加上朋友函数数量，因为只有成员和朋友有权访问私有成员。在成员函数（不仅可以访问类的私有数据，还可以访问私有函数、枚举、类型定义等）和非成员非友元函数（无法访问这些任何内容）之间提供相同功能的情况下进行选择，产生更大封装性的选择是非成员非友元函数，因为它没有增加可以访问类私有部分的函数数量。这解释了为什么\
  \ `clearBrowser`（非成员非友元函数）优于 `clearEverything`（成员函数）：它在 `WebBrowser` 类中产生了更大的封装性。\n\
  \n此时，有两点值得注意。第一，这种推理适用于非成员 `non-friend`（非友元）函数。友元对类私有成员的访问权限与成员函数相同，因此对封装的影响也相同。从封装的角度来看，选择不在成员函数和非成员函数之间，而是在成员函数和非成员非友元函数之间。（当然，封装不是唯一的观点。条目\
  \ 24(#text00014.html_ch04lev1sec7) 解释了当涉及隐式类型转换时，选择 `is` 在成员函数和非成员函数之间。）\n\n第二点点是，仅仅因为封装的考虑要求一个函数是某个类的非成员，并不意味着它不能是另一个类的成员。这对于习惯了所有函数\
  \ `must`（必须）位于类中的语言（例如 Eiffel、Java、C# 等）的程序员来说，可能是一种微小的安慰。例如，我们可以将 `clearBrowser`\
  \ 成为某些工具类的静态成员函数。只要它不是 `WebBrowser` 的一部分（或其友元），它就不会影响 `WebBrowser` 私有成员的封装。\n\n\
  ### 命名空间\n在 C++ 中，更自然的方法是将 `clearBrowser` 成为与 `WebBrowser` 相同命名空间中的非成员函数：\n\n```cpp\n\
  namespace WebBrowserStuff {\n\nclass WebBrowser { ... };\n\nvoid clearBrowser(WebBrowser&\
  \ wb);\n\n...\n\n}\n```\n\n然而，这种方法的优点不仅在于自然，因为命名空间与类不同，可以跨多个源文件。这很重要，因为像 `clearBrowser`\
  \ 这样的函数是 `convenience functions`（便利函数）。它们既不是成员也不是友元，对 `WebBrowser` 没有特殊的访问权限，因此它们无法提供\
  \ `WebBrowser` 客户端无法通过其他方式获得的功能。例如，如果 `clearBrowser` 不存在，客户端可以自己调用 `clearCache`、`clearHistory`\
  \ 和 `removeCookies`。\n\n像 `WebBrowser` 这样的类有很多便利函数，有些与书签有关，有些与打印有关，还有的与 cookie 管理有关。作为一般规则，大多数客户端只对这些便利函数集的某些感兴趣。一个对书签相关便利函数感兴趣的客户端，没有理由在编译上依赖于例如\
  \ cookie 相关的便利函数。将它们分离的方法方法是在头文件中声明书签相关的便利函数，在另一个头文件中声明 cookie 相关的便利函数，在第三个头文件中声明打印相关的便利函数，依此类推：\n\
  \n```cpp\n// 头文件 \"webbrowser.h\" — WebBrowser 类本身的头文件\n// 以及“核心”WebBrowser 相关功能\n\
  namespace WebBrowserStuff {\n\nclass WebBrowser { ... };\n\n... // \"core\" 相关功能，例如\n\
  // 几乎所有客户端需要的\n// 非成员函数\n\n\n\n``````cpp\n// 头文件 \"webbrowserbookmarks.h\"\nnamespace\
  \ WebBrowserStuff {\n\n... // 书签相关的便利\n}\n```\n\n```cpp\n// 头文件 \"webbrowsercookies.h\"\
  \nnamespace WebBrowserStuff {\n\n... // Cookie 相关的便利\n}\n```\n\n注意这正是标准 C++ 库组织方式。与其有一个包含\
  \ `std` 命名空间中所有内容的单一 `<C++StandardLibrary>` 头文件，不如几十个头文件（例如 `<vector>`、`<algorithm>`、`<memory>`\
  \ 等），每个头文件声明了 `std` 中的 `some`（部分）功能。只使用 `vector` 相关功能的客户端不需要 `#include <memory>`；不使用\
  \ `list` 的客户端不需要 `#include <list>`。这允许客户端仅对它们实际使用的系统部分产生编译依赖。（请参见条目 31(#text00015.html_ch05lev1sec6)\
  \ 有关减少编译依赖的其他方法的讨论。）当功能源自类的成员函数时，以这种方式进行功能划分是不可能的的，因为一个类必须完整地定义；它不能被拆分成碎片。\n\n\n\
  \n\n\n将所有的便利函数放在多个头文件中——但处于同一个命名空间——也意味着客户端可以轻松 `extend` 便利函数的集合。他们需要做的就是在命名空间中添加更多非成员非友函数。例如，如果一个\
  \ `WebBrowser` 客户端决定编写与下载图像相关的便利函数，他或她只需要创建一个新的头文件，并在 `WebBrowserStuff` 命名空间中包含这些函数的声明即可。现在，新函数就像所有其他便利函数一样可用且集成了。这是类无法提供的另一个特性，因为类定义对客户端的扩展是封闭的。诚然，客户端可以派生新类，但派生类无法访问基类中封装的（即\
  \ `private`）成员，因此这种“扩展功能”处于二等地位。此外，如 Item 7 条 所解释的那样，并不是所有类都被设计为基类。\n\n### 需要记住的物品\n\
  \n-   优先使用非成员非友函数代替成员函数。这样做可以增加封装性、封装灵活性和功能扩展性。\n\n## 第 24 条：当类型转换适用于所有参数时，声明非成员函数\n\
  \n我在本书的介绍中提到，让类支持隐式类型转换通常是一个坏主意。当然，这个规则是有例外的，最常见的例外就是创建数值类型时。例如，如果你正在设计一个表示有理数的类，允许从整数到有理数的隐式转换似乎并不合理。它完全不比\
  \ C++ 内置的从 `int` 到 `double` 的转换合理（而且比 C++ 内置的从 `double` 到 `int` 的转换要合理得多）。如此，你可能会这样开始你的\
  \ `Rational` 类：\n\n```cpp\nclass Rational {\npublic:\n    Rational(int numerator\
  \ = 0, // 构造函数特意没有使用 explicit；\n    int denominator = 1); // 允许隐式的 int 到 Rational\
  \ 的转换\n    int numerator() const; // 对分子的访问器\n    int denominator() const; // 分母——参见\
  \ Item 22 条\nprivate:\n    ...\n};\n```\n\n你知道你想支持加法、乘法等算术运算，但不确定应该通过成员函数、非成员函数，或者可能是友非成员函数来实现它们。你的直觉告诉你是，当你犹豫不决时，应该面向对象。你知道，例如，有理数的乘法与\
  \ `Rational` 类有关，因此在 `Rational` 类内部为有理数实现 `operator*` 似乎是自然的。与直觉相反的是，Item 23 条 认为，将函数放在与其相关的类内部的想法有时与面向对象的原则\
  \ `contrary`，但让我们先把它置一边，研究一下将 `operator*` 改为 `Rational` 的成员函数的想法：\n\n```cpp\nclass\
  \ Rational {\npublic:\n    ...\n    const Rational operator*(const Rational& rhs)\
  \ const;\n};\n```\n\n（如果你不确定为什么这个函数这样声明——返回一个按值的 `const` 结果，但以 `const` 引用作为参数——请查阅\
  \ Item 3 条、20 条 和 21 条。）\n\n这种设计让你能够轻松地相乘有理数：\n\n```cpp\nRational oneEighth(1, 8);\n\
  Rational oneHalf(1, 2);\nRational result = oneHalf * oneEighth; // 可以\nresult =\
  \ result * oneEighth; // 可以\n```\n\n但你并不满意。你还想支持混合模式操作，例如 `Rational` 可以与 `int` 相乘。毕竟，没有什么事情比两个数字相乘更自然了，即使它们恰好是不同类型的数字。\n\
  \n然而，当你尝试进行混合模式算术时，你会发现它只有一半时间有效：\n\n```cpp\nresult = oneHalf * 2; // 可以\nresult\
  \ = 2 * oneHalf; // 错误！\n```\n\n这是一个不吉的征兆。记得吗，乘法应该是交换律？当你将最后两个示例重写为等效函数的形式时，问题的根源变得显而易见了：\n\
  \n```cpp\nresult = oneHalf.operator*(2); // 可以\nresult = 2.operator*(oneHalf); //\
  \ 错误！\n```\n\n对象 `oneHalf` 是包含 `operator*` 的类的实例，因此编译器会调用该函数。然而，整数 2 没有关联的类，因此没有\
  \ `operator*` 成员函数。编译器还会寻找非成员 `operator*`（即命名空间或全局作用域内的），以便可以像这样调用：\n\n```cpp\n\
  result = operator*(2, oneHalf); // 错误！\n```\n\n但在这个例子中，没有接受 `int` 和 `Rational` 的非成员\
  \ `operator*`，因此搜索失败了。\n\n再次查看那个成功的调用。为什么 2 在一个位置可以，而在另一个位置不行？发生的是隐式转换。编译器知道你正在传递一个\
  \ `int` 且该函数需要一个 `Rational`，因此它们可以通过调用 `Rational` 构造函数来变出一个合适的 `Rational`。\n\n```cpp\n\
  Rational temp(2); // 从 2 创建 Rational 对象\nresult = oneHalf * temp; // 等于 oneHalf.operator*(temp);\n\
  ```\n\n当然，如果 `Rational` 的构造函数是 `explicit` 的，这两个语句都无法编译：\n\n```cpp\nresult = oneHalf\
  \ * 2; // 错误！（使用 explicit 构造函数）\nresult = 2 * oneHalf; // 同样的错误（相同的问题）\n```\n\n\
  这将不支持混合模式算术，但至少两个语句的行为是一致的。\n\n然而，你的目标是既要一致性又要支持混合模式算术，即上述语句都能编译。这让我们回到了那两个语句，以及为什么即使\
  \ `Rational` 的构造函数不是 `explicit`，一个可以编译而另一个不能：\n\n```cpp\nresult = oneHalf * 2; //\
  \ 可以（非 explicit 构造函数）\nresult = 2 * oneHalf; // 错误！（即使是非 explicit 构造函数）\n```\n\n\
  事实证明，参数*只有在位于参数列表中时*才适用于隐式转换。对应于调用成员函数的隐式参数（即 `this` 指向的对象）*永远不允许*隐式转换。这就是为什么第一个调用可以编译而第二个不能。\n\
  \n然而，你仍然想支持混合模式算术，现在方法可能已经清晰了：将 `operator*` 改为非成员函数，从而允许编译器对*所有*参数执行隐式类型转换：\n\n\
  ```cpp\nclass Rational {\n    ... // 不包含 operator*\n};\n\nconst Rational operator*(const\
  \ Rational& lhs, // 现在是非成员\nconst Rational& rhs) // 函数\n{\n    return Rational(lhs.numerator()\
  \ * rhs.numerator(),\n    lhs.denominator() * rhs.denominator());\n}\n```\n\n```cpp\n\
  Rational oneFourth(1, 4);\nRational result;\nresult = oneFourth * 2; // 可以\nresult\
  \ = 2 * oneFourth; // 耶，它成功了！\n```\n\n这无疑是故事的一个圆满结局，但有一个挥之不去的忧虑。是否应该让 `operator*`\
  \ 成为 `Rational` 类的友元？\n\n\n\n\n在这种情况下，答案是否定的，因为 `operator*` 可以完全通过 `Rational` 的公共接口来实现。上面的代码展示了实现它的一种方法。这引出了一个重要的观察：成员函数的反面是**非成员**函数（non-member\
  \ function），而不是友元函数（friend function）。太多的 C++ 程序员认为，如果一个函数与某个类相关且不应该是成员函数（例如，由于需要对所有参数进行类型转换），那么它应该是友元函数。这个例子证明了这种推理是有缺陷的。只要你可以避免友元函数，就应该这样做，因为就像现实生活中一样，朋友带来的麻烦往往比他们的价值要大。当然，有时友谊关系是必要的，但事实是，仅仅因为一个函数不应该是成员函数，并不意味着它自动应该是友元函数。\n\
  \n本节（Item）包含了真理，唯有真理，但它不是全部。当你从面向对象的 C++ 跨越到模板 C++（参见 Item 1 )）并将 `Rational` 设为类模板而不是类时，会有新的问题需要考虑，新的解决方法，以及一些意外的设计影响。这些问题、解决办法和影响是\
  \ Item 46 的主题。\n\n### 需要记住的\n\n- 如果你需要对函数的所有参数进行类型转换（包括本应由 `this` 指针指向的参数），则该函数必须是非成员函数。\n\
  \n### Item 25: 考虑对非抛异常 `swap` 的支持\n\n`swap` 是一个有趣的函数。它最初作为 STL 的引入，后来已成为异常安全编程的支柱（参见\
  \ Item 29 ）以及处理自赋值可能性的常用机制（参见 Item 11 )）。由于 `swap` 非常实用，正确地实现它至关重要，但随其极其重要性而来的是一系列特殊的复杂性。在本节中，我们将探索它们是什么以及如何处理它们。\n\
  \n`swap` 两个对象的值就是让它们互相交换的值。默认情况下，交换是通过标准的 `swap` 算法实现的。它的典型实现正如你所预期的：\n\n点击此处查看代码\n\
  \n```cpp\nnamespace std {\n\ntemplate<typename T> // std::swap 的典型实现;\n\nvoid swap(T&\
  \ a, T& b) // 交换 a 和 b 的值\n\n{\n\nT temp(a);\n\na = b;\n\nb = temp;\n\n}\n\n}\n\
  ```\n\n只要你的类型支持拷贝（通过拷贝构造函数和拷贝赋值运算符），默认的 `swap` 实现就能让你的类型对象进行交换，而无需你做任何特殊工作来支持它。\n\
  \n然而，默认的 `swap` 实现可能让你并不兴奋。它涉及到三个对象的拷贝：从 `a` 到 `temp`，从 `b` 到 `a`，以及从 `temp` 到 `b`。对于某些类型，这些拷贝并不是真正必要的。对于此类类型，默认的\
  \ `swap` 会让你从快车道进入慢车道。\n\n在这些类型中，最重要的是那些指向包含实际数据的其他类型的指针。这种设计方法的常见表现是“pimpl 句式”（指向实现的指针——参见\
  \ Item 31 ）。采用这种设计的 `Widget` 类可能如下所示：\n\n点击此处查看代码\n\n```cpp\nclass WidgetImpl {\
  \ // 用于 Widget 数据的类;\n\npublic: // 细节并不重要\n\n...\n\nprivate:\n\nint a, b, c; //\
  \ 可能有大量数据 —\n\nstd::vector<double> v; // 拷贝代价很大！\n\n...\n\n};\n\nclass Widget {\
  \ // 使用 pimpl 句式的类\n\npublic:\n\nWidget(const Widget& rhs);\n\nWidget& operator=(const\
  \ Widget& rhs) // 为了拷贝一个 Widget，拷贝它的\n\n{ // WidgetImpl 对象。对于\n\n... // 实现细节\n\n\
  *pImpl = *(rhs.pImpl); // 通用的 operator=，\n\n... // 参见 Items 10 , 11 , 以及 12 .\n\n\
  }\n\n...\n\nprivate:\n\nWidgetImpl *pImpl; // 指向此对象的指针\n}; // Widget 的数据\n```\n\n\
  要交换两个 `Widget` 对象的值，我们实际上需要做的是交换它们的 `pImpl` 指针，但默认的 `swap` 算法并不知道。相反，它不仅会拷贝三个 `Widget`，还会拷贝三个\
  \ `WidgetImpl` 对象。非常低效。毫无趣味。\n\n我们想做的是告诉 `std::swap`，当 `Widget` 对象被交换时，执行交换的方法是交换它们内部的\
  \ `pImpl` 指针。有一种方法可以完全说明这一点：为 `Widget` 特化 `std::swap`。这里是基本思想，尽管这种形式还无法编译：\n\n点击此处查看代码\n\
  \n```cpp\nnamespace std {\n\ntemplate<> // 为 Widget 特化\n\nvoid swap(Widget& a, Widget&\
  \ b) // 交换内部 pImpl 指针\n\n{\n\nWidgetImpl* temp = a.pImpl;\na.pImpl = b.pImpl;\n\
  b.pImpl = temp;\n\n}\n```\n等，提供的文本在末尾截断了。让我准确地格式化提供的文本。\n\n\n\n\n```cpp\nWidget<T>&\
  \ b) // \"swap\"), but see below for\n\n{ a.swap(b); } // why this isn't valid code\n\
  \n}\n```\n\n通常情况下，重载函数模板是可以接受的，但 `std` 是一个特殊的命名空间，管理它的规则也是特殊的。在 `std` 中对模板进行完全特化是允许的，但向\
  \ `std` 中添加 `new` 模板（或类、函数或任何其他内容）是不允许的。`std` 的内容完全由 C++ 标准委员会决定，我们被禁止扩充那些他们认为应该存在于那里的内容。诚然，遗憾的是，这种禁令的形式可能会让你感到沮丧。跨越这条界线的程序几乎肯定可以编译并运行，但它们的行为是未定义的。如果你希望你的软件具有可预测的行为，就不要向\
  \ `std` 中添加新内容。\n\n那么该怎么办呢？我们仍然需要一种方法让其他人调用 `swap` 并获取我们更高效的特定于模板的版本。答案很简单。我们仍然声明一个非成员\
  \ `swap` 来调用成员函数 `swap`，我们只是不再将该非成员声明为 `std::swap` 的特化或重载。例如，如果我们所有与 `Widget` 相关的功能都在\
  \ `WidgetStuff` 命名空间中，它看起来像这样：\n\n```cpp\nnamespace WidgetStuff {\n\n... // 模板化的\
  \ WidgetImpl 等。\n\ntemplate<typename T> // 如前所示，包括 swap\n\nclass Widget { ... };\
  \ // 成员函数\n\n...\n\ntemplate<typename T> // 非成员 swap 函数;\n\nvoid swap(Widget<T>&\
  \ a, // 不属于 std 命名空间\n\nWidget<T>& b)\n\n{\n\na.swap(b);\n\n}\n\n}\n```\n\n现在，如果在任何地方的代码对两个\
  \ `Widget` 对象调用 `swap`，C++ 的名称查找规则（特别是称为“参数依赖查找” `argument-dependent lookup` 或 `Koenig\
  \ lookup` 的规则）将在 `WidgetStuff` 中找到特定于 `Widget` 的版本。这正是我们想要的。\n\n这种方法对于类和类模板同样有效，所以看起来我们应该一直使用它。但遗憾的是，为类对\
  \ `std::swap` 进行特化是有原因的（我稍后会描述），所以如果你希望在尽可能多的范围内调用你的类特定的 `swap` 版本（你确实是这样），你需要在与你的类相同的命名空间中写一个非成员版本，并为\
  \ `std::swap` 写一个特化。\n\n顺便说一下，如果你没有使用命名空间，上述一切仍然适用（即你仍然需要一个调用成员 `swap` 的非成员 `swap`），但你为什么要用所有的类、模板、函数、枚举、枚举常量和类型定义名来填满全局命名空间呢？你难道一点分寸感都没有吗？\n\
  \n我目前为止写的所有内容都与 `swap` 的作者有关，但从调用者的角度来看也非常情况。假设你正在编写一个函数模板，在其中你需要交换两个对象的值：\n\n```cpp\n\
  template<typename T>\n\nvoid doSomething(T& obj1, T& obj2)\n\n{\n\n...\n\nswap(obj1,\
  \ obj2);\n\n...\n\n}\n```\n\n这应该调用哪一个 `swap`？是 `std` 中的通用版本（你已经知道它存在），`std` 中通用版本的特化（它可能存在也可能不存在），还是特定于\
  \ `T` 的版本（它可能存在也可能不存在，并且可能在某个命名空间中，但绝对不应该在 `std` 中）？你想要的是如果存在特定于 `T` 的版本就调用它，如果没有，则退回到\
  \ `std` 中的通用版本。以下是实现你愿望的方法：\n\n```cpp\ntemplate<typename T>\n\nvoid doSomething(T&\
  \ obj1, T& obj2)\n\n{\n\nusing std::swap; // 在此函数中使用 std::swap\n\n...\n\nswap(obj1,\
  \ obj2); // 为类型为 T 的对象调用最佳的 swap\n\n...\n\n}\n```\n\n当编译器看到对 `swap` 的调用时，它们会搜索要调用的正确\
  \ `swap`。C++ 的名称查找规则确保这将找到全局作用域或与类型 `T` 相同命名空间中的任何特定于 `T` 的 `swap`。（例如，如果 `T` 是\
  \ `WidgetStuff` 命名空间中的 `Widget`，编译器将使用参数依赖查找在 `WidgetStuff` 中寻找 `swap`）。如果不存在特定于\
  \ `T` 的 `swap`，得益于 `using` 声明使得 `std::swap` 在此函数中可见，编译器将使用 `std` 中的 `swap`。尽管如此，编译器也会倾向于使用\
  \ `std::swap` 的特定于 `T` 的特化而不是通用模板，所以如果 `std::swap` 已经为 `T` 特化，将使用特化版本。\n\n因此，调用正确的\
  \ `swap` 是很容易的。唯一需要小心的是不要对调用进行限定，因为这会影响 C++ 确定要调用的函数。例如，如果你这样写对 `swap` 的调用：\n\n\
  ```cpp\nstd::swap(obj1, obj2); // 调用 swap 的错误方式\n```\n\n你将强制编译器只考虑 `std` 中的 `swap`（包括任何模板特化），从而消除了获取在其他地方定义的更合适的特定于\
  \ `T` 版本的可能性。\n\n到此，我们讨论了默认的 `swap`、成员 `swap`、非成员 `swap`、`std::swap` 的特化以及对 `swap`\
  \ 的调用，让我们总结一下这种情况吧。\n\n首先，如果 `swap` 的默认实现为你的类或模板提供了可以接受的效率，你什么都不需要做。\n\n其次，如果 `swap`\
  \ 的默认实现效率不高（这通常意味着你的类或模板使用了某种 pimpl 变体），执行以下操作：\n\n1. 提供一个公共 `swap` 成员函数来高效地交换值。由于我稍后会解释的原因，此函数永远不抛出异常。\n\
  2. 在与类相同的命名空间中提供一个非成员 `swap`。让它调用你的 `swap` 成员函数。\n3. 如果你在编写类（而不是模板），为你的类特化 `std::swap`。\n\
  \n最后，如果你调用 `swap`，请确保包含一个 `using` 声明使 `std::swap` 在函数中可见，然后在不带命名空间限定的情况下调用 `swap`。\n\
  \n唯一的遗留问题是我要求 `swap` 的成员版本永远不抛出异常。这是因为 `swap` 最有用的应用之一是帮助类（类模板）提供强异常保证。[第 29 项](#text0015.html_ch05lev1sec4）提供了所有细节，但该技术基于\
  \ `swap` 成员版本不抛出异常的假设。这个约束仅适用于成员版本！它不适用于非成员版本，因为 `swap` 的默认版本基于拷贝构造和拷贝赋值，而通常这两个函数都是允许抛出异常的。当你编写自定义的\
  \ `swap` 版本时，你通常提供的不仅仅是交换值的有效方法，还提供了一种不抛出异常的方法。作为一个一般规则，这两个 `swap` 特性是并随存在的，因为非常高效的\
  \ `swap` 几乎总是基于内置类型的操作（例如 pimpl 模式底层的指针），而内置类型的操作不会抛出异常。\n\n### 需要记住的事\n\n• 当 `std::swap`\
  \ 对于你的类型效率不高时，提供一个 `swap` 成员函数。确保你的 `swap` 不抛出异常。\n\n• 如果你提供了成员 `swap`，请在相同的命名空间中也提供一个非成员\
  \ `swap`。让它调用 `swap` 成员函数。\n\n• 如果你在编写类（而不是模板），也为你的类特化 `std::swap`。\n\n\n\n\n- 当调用\
  \ `swap` 时，对 `std::swap` 使用 `using` 声明，然后在不带命名空间限定符的情况下调用 `swap`。\n- 为用户定义的类型对 `std`\
  \ 模板进行完全特化是可以的，但千万不要尝试向 `std` 添加完全全新的内容。\n\n![](img/348871.jpg)\n\n## 5. 实现\n\n\
  在大多数情况下，为你的类（以及类模板）编写合适的定义以及为你的函数（以及函数模板）编写合适的声明，是这场战斗的大头。一旦你正确完成了这些工作，相应的实现很大程度上是直观的。尽管如此，仍有一些事情需要注意。过早定义变量可能会拖慢性能。过度使用类型转换（casts）会导致代码运行缓慢、难以维护并隐藏着细微的错误。返回对象内部构造的句柄会破坏封装，并给客户端留下悬挂句柄。未能考虑异常的影响会导致资源泄漏和数据结构损坏。过度的内联（inline）会导致代码膨胀。过度耦合会导致编译时间长到无法接受。\n\
  \n所有这些问题都是可以避免的。本章解释了如何做到。\n\n### Item 26: 尽可能推迟变量的定义。\n\n每当你定义一个带有构造函数或析构函数的类型变量时，当控制流到达变量定义处，你就会产生构造成本；当变量离开作用域时，你就会产生析构成本。未使用的变量也存在成本，因此你希望尽可能避免它们。\n\
  \n你可能认为你从没有定义过未使用的变量，但你可能需要重新考虑。考虑以下函数，如果密码足够长，它返回密码的加密版本。如果密码太短，该函数将抛出一个 `logic_error`\
  \ 类型的异常，该异常定义在标准 C++ 库中（参见 Item 54 ):\n\n点击此处查看代码图像\n\n```cpp\n// 此函数过早定义了变量 \"\
  encrypted\"\n\nstd::string encryptPassword(const std::string& password)\n{\n  using\
  \ namespace std;\n  string encrypted;\n  if (password.length() < MinimumPasswordLength)\
  \ {\n    throw logic_error(\"Password is too short\");\n  }\n  ... // 执行任何必要的操作，将密码的\n\
  \  // 加密版本放入 encrypted 中\n  return encrypted;\n}\n```\n\n对象 `encrypted` 在此函数中并不是*完全*未使用的，但如果抛出异常，它就是未使用的。这意味着，即使\
  \ `encryptPassword` 抛出异常，你也会为 `encrypted` 的构造和析构付出代价。因此，最好推迟 `encrypted` 的定义，直到你*确定*自己会需要它：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 此函数推迟了 encrypted 的定义，直到真正需要时\n\nstd::string encryptPassword(const\
  \ std::string& password)\n{\n  using namespace std;\n  if (password.length() < MinimumPasswordLength)\
  \ {\n    throw logic_error(\"Password is too short\");\n  }\n  string encrypted;\n\
  \  ... // 执行任何必要的操作，将密码的\n  // 加密版本放入 encrypted 中\n  return encrypted;\n}\n```\n\
  \n这段代码仍然不像可能的那么紧凑，因为 `encrypted` 在定义时没有任何初始化参数。这意味着将使用其默认构造函数。在许多情况下，你对对象执行的第一件事就是给它某个值，通常通过赋值来实现。Item\
  \ 4 解释了为什么默认构造一个对象然后对其赋值，比用你真正想要的值对其进行初始化效率要低。这种分析也适用于这里。例如，假设 `encryptPassword`\
  \ 的困难部分在这个函数中执行的：\n\n```cpp\nvoid encrypt(std::string& s); // 原地加密 s\n```\n\n那么\
  \ `encryptPassword` 可以这样实现，尽管这并不是最好的方法：\n\n点击此处查看代码图像\n\n```cpp\n// 此函数推迟了 encrypted\
  \ 的定义，直到\n// 有必要时，但它仍然是没必要的低效的\n\nstd::string encryptPassword(const std::string&\
  \ password)\n{\n  ... // 如上导入 std 并检查长度\n  string encrypted; // 默认构造 encrypted\n\
  \  encrypted = password; // 赋值给 encrypted\n  encrypt(encrypted);\n  return encrypted;\n\
  }\n```\n\n更优的方法是使用 `password` 初始化 `encrypted`，从而跳过无意义且可能昂贵的默认构造：\n\n点击此处查看代码图像\n\
  \n```cpp\n// 最后，是定义和初始化 encrypted 的最佳方法\n\nstd::string encryptPassword(const std::string&\
  \ password)\n{\n  ... // 导入 std 并检查长度\n  string encrypted(password); // 通过拷贝定义并初始化\n\
  \  // 构造函数\n  encrypt(encrypted);\n  return encrypted;\n}\n```\n\n这暗示了本 Item 标题中“尽可能”的真正含义。你不仅应该推迟变量的定义直到你必须使用该变量之前，还应该尝试推迟定义，直到你有它的初始化参数为止。通过这样做，你避免了对不需要对象的构造和析构，并避免了不必要的默认构造。此外，对于只在循环内部使用的变量，是在循环外定义它并在每次迭代中赋值更好，还是在循环内定义它更好？也就是说，哪种通用结构更好？\n\
  \n### 记住这些事项\n\n- 尽可能推迟变量的定义。这增加了程序的清晰度并提高了程序的效率。\n\n### Item 27: 最小化类型转换。\n\nC++\
  \ 的规则设计用于保证类型错误是不可能的。理论上，如果你的程序编译通过，它就没有尝试对任何对象执行任何不安全或无意义的操作。这是一个非常有价值的保证。你不希望轻易放弃它。\n\
  \n遗憾的是，类型转换（casts）破坏了类型系统。这可能导致各种问题，有些容易识别，有些极其微妙。如果你是从 C、Java 或 C# 进入 C++ 的，请注意，因为转换在那些语言中比\
  \ C++ 更需要且不危险。但 C++ 不是 C。不是 Java。不是 C#。在这个语言中，转换是你希望非常谨慎对待的功能。\n\n让我们从回顾转换语法开始，因为通常有不同的方式编写同一个转换。C\
  \ 风格的转换如下：\n\n```cpp\n(T) expression // 将表达式转换为类型 T\n```\n\n\n\n# 函数式类型转换\n\n函数式类型转换使用以下语法：\n\
  \n```cpp\nT(expression ) // 将表达式转换为类型 T\n```\n\n这些形式在意义上没有区别；完全取决于你把括号放在哪里。我将这两种形式称为“旧式类型转换”（`old-style\
  \ casts`）。\n\n# 新式类型转换\n\nC++ 还提供了四种新的类型转换形式（通常称为`新式`或`C++ 风格`类型转换）：\n\n```cpp\n\
  const_cast< T>( expression )\ndynamic_cast< T>( expression )\nreinterpret_cast<\
  \ T>( expression )\nstatic_cast< T>( expression )\n```\n\n每种转换都有独特的用途：\n\n*   `const_cast`\
  \ 通常用于去掉对象的 `const` 属性。它是 C++ 风格类型转换中唯一可以实现此操作的。\n*   `dynamic_cast` 主要用于执行“安全向下转换”（safe\
  \ downcasting），即在继承层次结构中确定对象是否为特定类型。它是唯一无法使用旧式语法执行的类型转换。它也是唯一可能产生显著运行时开销的转换。（稍后我会提供相关细节。）\n\
  *   `reinterpret_cast` 用于低级转换，这种转换会产生依赖于实现（即不可移植的）的结果，例如将指针转换为 `int`。在低级代码之外，此类转换应该是极少见的。我在书中仅用过了一次，且仅是在讨论如何为原始内存编写调试分配器时（参见第\
  \ 50 条）。\n*   `static_cast` 可用于强制隐式转换（例如将非 `const` 对象转换为 `const` 对象（如第 3 条）、将 `int`\
  \ 转换为 `double` 等）。它还可用于许多此类转换的反向操作（例如，将 `void*` 指针转换为类型指针，将指向基类的指针转换为指向派生类的指针），但它不能将\
  \ `const` 对象转换为非 `const` 对象。（只有 `const_cast` 可以做到这一点。）\n\n旧式类型转换仍然有效，但新形式更为优越。首先，它们在代码中更容易被识别（无论是对于人类还是像\
  \ `grep` 这样的工具），从而简化了寻找代码中违背类型系统位置的过程。其次，每种转换的用途更加具体，使得编译器能够诊断用法错误。例如，如果你尝试使用除 `const_cast`\
  \ 以外的新式转换来去掉 `const` 属性，你的代码将无法编译。\n\n# 使用旧式类型转换\n\n我使用旧式类型转换的唯一一次大约是我需要调用一个 `explicit`\
  \ 构造函数将对象传递给函数时。例如：\n\n点击此处查看代码图像\n\n```cpp\nclass Widget {\npublic:\n    explicit\
  \ Widget(int size);\n    ...\n};\n\nvoid doSomeWork(const Widget& w);\ndoSomeWork(Widget(15)\
  \ ); // 从 int 创建 Widget\n// 使用函数式转换\ndoSomeWork(static_cast<Widget>(15) ); // 从\
  \ int 创建 Widget\n// 使用 C++ 风格转换\n```\n\n由于某种原因，刻意的对象创建“感觉”并不像是一个类型转换，因此在这种情况下，我可能会使用函数式转换而不是\
  \ `static_cast`。（它们在这里的作用完全相同：创建一个临时的 `Widget` 对象并传递给 `doSomeWork`。）但话又回来，当你编写会导致核心转储（core\
  \ dump）的代码时，通常觉得很合理，所以也许你最好忽略感觉，一直使用新式转换。\n\n# 类型转换的开销\n\n许多程序员认为类型转换仅仅告诉编译器将一种类型视为另一种类型，但这种想法是错误的。任何类型的类型转换（无论是通过转换显式执行，还是通过编译器隐式执行）通常会导致在运行时执行的代码。例如，在下面的代码段中，\n\
  \n点击此处查看代码图像\n\n```cpp\nint x, y;\n...\ndouble d = static_cast<double>(x)/y; //\
  \ 将 x 除以 y，但使用\n// 浮点除法\n```\n\n将 `int x` 转换为 `double` 几乎肯定会生成代码，因为在大多数架构上，`int`\
  \ 的底层表示与 `double` 不同。这可能并不令人意外，但这个例子可能会让你大开眼界：\n\n点击此处查看代码图像\n\n```cpp\nclass Base\
  \ { ... };\nclass Derived: public Base { ... };\nDerived d;\nBase *pb = &d; // 隐式转换\
  \ Derived* ⇒ Base*\n```\n\n在这里，我们只是创建一个指向派生类对象的基类指针，但有时，两个指针的值是不相同的。在这种情况下，会在*运行时*对\
  \ `Derived*` 指针应用偏移量，以获得正确的 `Base*` 指针值。\n\n最后一个例子说明，单个对象（例如，`Derived` 类型的对象）可能有多个地址（例如，当被\
  \ `Base*` 指针指向时的地址和当被 `Derived*` 指针指向时的地址）。这在 C 中不会发生。在 Java 中不会发生。在 C# 中不会发生。它在\
  \ C++ 中*确实*会发生。事实上，当使用多继承时，它几乎总是发生，但在单继承下也可能发生。其他方面，这意味着你通常应该避免对 C++ 中的事物布局做假设。\n\
  \n# 虚函数与类型转换\n\n类型转换的一个有趣点是，你很容易写出看起来正确（在其他语言中可能是正确的）但实际上错误的代码。例如，许多应用程序框架要求派生类中的虚函数实现调用其基类对应的实现。假设我们有一个\
  \ `Window` 基类和一个 `SpecialWindow` 派生类，它们都定义了虚函数 `onResize`。这里有一种实现方法看起来是正确的，但实际上不是：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Window { // 基类\npublic:\n    virtual void onResize()\
  \ { ... } // 基类 onResize 实现\n\n;\n\nclass SpecialWindow: public Window { // 派生类\n\
  public:\n    virtual void onResize() { // 派生类 onResize 实现\n        static_cast<Window>(*this)\
  \ .onResize(); // 将 *this 转换为 Window\n        // 然后调用其 onResize;\n        // 这不起作用！\n\
  \        ... // 执行 SpecialWindow-\n    } // 特有内容\n    ...;\n};\n```\n\n我在代码中突出了类型转换。（这是一个新式转换，但使用旧式转换不会改变任何结果）。正如你预期的，代码将\
  \ `*this` 转换为 `Window`。因此，随后的 `onResize` 调用调用了 `Window::onResize` 。你可能不会预期的是，它并没有在当前对象上调用该函数！相反，转换创建了\
  \ `*this` 基类部分的新、临时*副本*，然后在副本上调用了 `onResize`！上面的代码并没有在当前对象上调用 `Window::onResize`\
  \ 然后对其执行 `SpecialWindow` 的特有操作——它是在对当前对象的基类部分的副本上调用 `Window::onResize`，然后对当前对象执行\
  \ `SpecialWindow` 的特有操作。如果 `Window::onResize` 修改了当前对象（由于 `onResize` 是非 `const` 成员函数，这种可能性并不低），当前对象不会被修改。相反，该对象的*副本*会被修改。\n\
  \n\n\n\n解决方案是消除类型转换，将其替换为你真正想要表达的内容。你并不想欺骗编译器将 `*this` 视为基类对象；你想要的是在当前对象上调用基类版本的\
  \ `onResize`。所以请这样做：\n\n点击此处查看代码图片\n\n```cpp\nclass SpecialWindow: public Window\
  \ {\npublic:\n    virtual void onResize() {\n        Window::onResize(); // 调用 Window::onResize\n\
  \        ... // 针对 *this\n    }\n...\n};\n```\n\n这个示例还说明，如果你发现自己想要进行类型转换，说明你处理问题的方法可能不对。当你想要使用\
  \ `dynamic_cast` 时，情况尤其如此。\n\n在深入探讨 `dynamic_cast` 的设计影响之前，值得注意的是，许多 `dynamic_cast`\
  \ 的实现可能非常慢。例如，至少有一种常见的实现部分基于对类名的的字符串比较。如果你在一个深度为四层的单继承层次体系中对对象执行 `dynamic_cast`，那么在这样的实现下，每次\
  \ `dynamic_cast` 可能会花费你多达四次 `strcmp` 调用来比较类名。更深的层次结构或使用多继承的层次结构代价会更高。某些实现之所以这样做是有原因的（它们与支持动态链接有关）。尽管如此，除了对一般的类型转换保持警惕外，你还应该特别警惕性能敏感代码中的\
  \ `dynamic_cast`。\n\n`dynamic_cast` 的需求通常是因为你想对一个你认为是派生类对象的对象执行派生类操作，但你只有一个指向基类的指针或引用可以操作该对象。避免这个问题通有两种通用方法。\n\
  \n首先，使用存储指针的容器（通常是智能指针——参见 Item 13）来直接存储派生类对象的指针，从而消除了通过基类接口操作此类对象的需要。例如，在我们的 `Window`/`SpecialWindow`\
  \ 层次结构中，只有 `SpecialWindow` 支持闪烁，与其与其这样做：\n\n点击此处查看代码图片\n\n```cpp\nclass Window {\
  \ ... };\n\nclass SpecialWindow: public Window {\npublic:\n    void blink();\n \
  \   ...\n};\n\ntypedef // 参见 Item 13 获取信息\nstd::vector<std::tr1::shared_ptr<Window>\
  \ > VPW; // 针对 tr1::shared_ptr\nVPW winPtrs;\n...\nfor (VPW::iterator iter = winPtrs.begin();\
  \ // 不理想的代码：\n     iter != winPtrs.end(); // 使用了 dynamic_cast\n     ++iter) {\n\
  \    if (SpecialWindow *psw = dynamic_cast <SpecialWindow*>(iter->get()))\n    \
  \    psw->blink();\n    }\n```\n\n不如尝试这样做：\n\n点击此处查看代码图片\n\n```cpp\ntypedef std::vector<std::tr1::shared_ptr<SpecialWindow>\
  \ > VPSW ;\nVPSW winPtrs;\n...\nfor (VPSW ::iterator iter = winPtrs.begin(); //\
  \ 更好的代码：使用了\n     iter != winPtrs.end(); // 没有 dynamic_cast\n     ++iter)\n(* iter)\
  \ ->blink();\n```\n\n当然，这种方法不会允许你在同一个容器中存储指向所有可能的 `Window` 派生类的指针。为了处理不同类型的窗口，你可能需要多个类型安全的容器。\n\
  \n另一种允许你通过基类接口操作所有可能的 `Window` 派生类的方法，是在基类中提供虚函数，让你完成所需的操作。例如，尽管只有 `SpecialWindow`\
  \ 可以闪烁，但在基类中声明该函数是有意义的，并提供一个什么都不做的默认实现：\n\n点击此处查看代码图片\n\n```cpp\nclass Window {\n\
  public:\n    virtual void blink() {} // 默认实现为空操作；\n    ... // 参见 Item 34 原因\n};\
  \ // 默认实现可能是一个坏主意\n\nclass SpecialWindow: public Window {\npublic:\n    virtual\
  \ void blink() { ... }; // 在这个类中，blink\n    ... // 执行某些操作\n};\n\ntypedef std::vector<std::tr1::shared_ptr<Window>\
  \ > VPW;\nVPW winPtrs; // 容器持有（指向）所有可能的 ... // Window 类型\nfor (VPW::iterator iter\
  \ = winPtrs.begin();\n     iter != winPtrs.end();\n     ++iter) // 注意缺少了\n    (*iter)->blink();\
  \ // dynamic_cast\n```\n\n这两种方法——使用类型安全的容器或将虚函数向上移动层次结构——都不是普遍通适的，但在许多情况下，它们为 `dynamic_cast`\
  \ 提供了一种可行的替代方案。当这些方法可行时，你应该拥抱它们。\n\n你绝对想要避免的是一种涉及级联 `dynamic_cast` 的设计，即任何看起来像这样的代码：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Window { ... };\n... // 派生类在这里定义\ntypedef std::vector<std::tr1::shared_ptr<Window>\
  \ > VPW;\nVPW winPtrs;\nfor (VPW::iterator iter = winPtrs.begin();\n     iter !=\
  \ winPtrs.end();\n     ++iter) {\n    if (SpecialWindow *psw = dynamic_cast <SpecialWindow*>(iter->get()))\n\
  \        psw->blink();\n    else if (SpecialWindow *psw2 = dynamic_cast <SpecialWindow*>(iter->get()))\n\
  \        psw2->blink();\n    else if (SpecialWindow *psw3 = dynamic_cast <SpecialWindow*>(iter->get()))\n\
  \        psw3->blink();\n}\n```\n\n这种 C++ 代码臃肿且缓慢，而且脆弱，因为每当 `Window` 类变化时，此类代码都需要更新。（例如，添加了新类时）。良好的\
  \ C++ 很少使用转换，但通常无法消除它们。\n\n### 注意事项\n\n- 尽可能避免转换，特别是性能敏感代码中的 `dynamic_cast`。如果设计需要转换，尽量将其隐藏在函数内部。客户端可以调用函数，而不是在自己的代码中放置转换。\n\
  - 优先使用 C++ 风格的转换而非旧式转换。它们更容易识别，并且更明确了它们要做什么。\n\n### Item 28：避免返回对象内部句柄\n\n假设你正在开发一个涉及矩形的应用程序。每个矩形可以用其左上角和右下角来表示。为了让\
  \ `Rectangle` 对象保持紧凑，你可能会决定定义边界的点不在 `Rectangle` 内部存储，而是存储在 `Rectangle` 指向的辅助结构体中：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Point { // 表示点的类\npublic:\n    Point(int x, int y);\n\
  \    ...\n    void setX(int newVal);\n    void setY(int newVal);\n    ...\n};\n\n\
  struct RectData { // 矩形的点数据\n    Point ulhc; // ulhc = 左上角\n    Point lrhc; // lrhc\
  \ = 右下角\n};\n\nclass Rectangle {\n...\nprivate:\n    std::tr1::shared_ptr<RectData>\
  \ pData; // 参见 Item 13 获取相关信息\n}; // tr1::shared_ptr\n```\n\n由于 `Rectangle` 客户端需要确定矩形的边界，该类提供了\
  \ `upperLeft` 和 `lowerRight` 函数。然而，`Point` 是一个自定义类型，因此，考虑到 Item 20 关于“按引用传递自定义类型通常比按值传递更高效”的观察，这些函数返回底层\
  \ `Point` 对象的引用：\n\n点击此处查看代码图片\n\n```cpp\nclass Rectangle {\npublic:\n    ...\n\
  \    Point& upperLeft() const { return pData->ulhc; }\n};\n```\n\n\n\n\n```cpp\n\
  Point& lowerRight() const { return pData->lrhc; }\n\n...\n\n};\n```\n\n这种设计可以编译通过，但它是错误的。事实上，它是自相矛盾的。一方面，`upperLeft`\
  \ 和 `lowerRight` 被声明为 `const` 成员函数，因为它们的设计初衷仅是为客户端提供获取 `Rectangle` 的点的方法，而不是让客户端修改\
  \ `Rectangle`（参见 Item 3 ）。另一方面，这两个函数都返回了指向私有内部数据的引用——调用者可以使用这些引用来修改这些内部数据！例如：\n\n\
  点击查看代码图像\n\n```cpp\nPoint coord1(0, 0);\n\nPoint coord2(100, 100);\n\nconst Rectangle\
  \ rec(coord1, coord2); // rec 是一个从\n\n// (0, 0) 到 (100, 100) 的 const 矩形\n\nrec.upperLeft().setX(50);\
  \ // 现在 rec 变为从\n\n// (50 , 0) 到 (100, 100)!\n```\n\n在这里，注意 `upperLeft` 的调用者如何能够使用返回的指向\
  \ `rec`  `Point` 数据成员的引用来修改该成员。但 `rec` 本应该是 `const` 的！\n\n这立即引出了两个教训。首先，数据成员的封装程度取决于返回其引用的访问权限最高的函数。在这种情况下，尽管\
  \ `ulhc` 和 `lrhc` 应该是其所属 `Rectangle` 的私有的，但它们实际上是公开的，因为公共函数 `upperLeft` 和 `lowerRight`\
  \ 返回了指向它们的引用。其次，如果一个 `const` 成员函数返回指向存储在对象外部的数据的引用，那么函数的调用者就可以修改该数据。（这只是位常量（bitwise\
  \ constness）局限性的副作用——参见 Item 3 。）\n\n我们所做的一切都涉及成员函数返回引用，但如果它们返回指针或迭代器，由于相同的原因，同样的问题仍然存在。引用、指针和迭代器都是*句柄*（获取其他对象的方式），返回对象内部的句柄始终存在着破坏对象封装的风险。正如我们所看到的，它还可能导致\
  \ `const` 成员函数允许对象的状态被修改。\n\n我们通常将对象的“内部”视为其数据成员，但对普通公众不可访问的成员函数（即受保护的或私有的函数）也是对象内部的一部分。因此，不返回指向它们的句柄是有关重要的。这意味着你永远不要让成员函数返回指向一个访问权限较低的成员函数的指针。如果你这样做，有效的访问级别将是那个访问权限更高的函数的级别，因为客户端可以获取指向该低访问权限函数的指针，然后通过该指针调用该函数。\n\
  \n然而，返回指向成员函数指针的函数并不常见，所以让我们重新关注到 `Rectangle` 类及其 `upperLeft` 和 `lowerRight` 成员函数上。我们为这些函数识别出的两个问题都可以通过简单地在它们的返回类型上应用\
  \ `const` 来消除：\n\n点击查看代码图像\n\n```cpp\nclass Rectangle {\n\npublic:\n\n...\n\nconst\
  \ Point& upperLeft() const { return pData->ulhc; }\n\nconst Point& lowerRight()\
  \ const { return pData->lrhc; }\n\n...\n\n};\n```\n\n通过这种改进后的设计，客户端可以读取定义矩形的 `Point`\
  \ s，但它们不能写入它们。这意味着将 `upperLeft` 和 `lowerRight` 声明为 `const` 不再是一个谎言，因为它们不再允许调用者修改对象的状态。至于封装问题，我们一直意图让客户端看到组成\
  \ `Rectangle` 的 `Point` s，因此这是对封装的一种刻意的放宽。更重要的是，这是一种*受限的*放松：这些函数仅授予了读访问权限。写访问权限仍然被禁止。\n\
  \n尽管如此，`upperLeft` 和 `lowerRight` 仍然返回指向对象内部的句柄，这在其他方面也可能导致问题。特别是，它可能导致*悬空句柄*（dangling\
  \ handles）：指向已不存在的对象的部分的句柄。此类消失对象的最常见来源是函数的返回值。例如，考虑一个以矩形形式返回 GUI 对象边界框的函数：\n\n\
  点击查看代码图像\n\n```cpp\nclass GUIObject { ... };\n\nconst Rectangle // 返回一个按值\nboundingBox(const\
  \ GUIObject& obj); // Rectangle；参见 Item 3 为什么\n\n// 返回类型是 const\n```\n\n现在考虑客户端可能如何使用此函数：\n\
  \n点击查看代码图像\n\n```cpp\nGUIObject *pgo; // 使 pgo 指向\n\n... // 某些 GUIObject\n\nconst\
  \ Point *pUpperLeft = // 获取一个指向其\n\n&(boundingBox(*pgo) .upperLeft()); // 边界框的\n\
  \n// 左上点\n```\n\n`boundingBox` 的调用将返回一个临时 `Rectangle` 对象。`upperLeft` 随后在该对象上调用，并返回其内部部分的引用，具体来说，是组成它的\
  \ `Point` 之一。目前为止还好，但我们还没有结束，因为在创建它的语句结束时，*temp* 将被毁，这会导致 `pUpperLeft` 指向一个不存在的对象！这就是为什么返回内部句柄的函数是危险的。无论它是指针、引用还是迭代器，重要的是一旦句柄返回，你就面临着句柄生存超过对象的风险。\n\
  \n这并不意味着你*永远不应该有一个返回句柄的成员函数。有时你必须这样做。例如，`operator[]` 允许你从 `string` 和 `vector` 中提取单个元素，这些\
  \ `operator[]` 通过返回容器中的数据（参见 Item 3 ）工作——这些数据在容器本身销毁时会被释放。尽管如此，这种函数是异常而非常规。\n\n\
  ### 注意事项\n\n- 避免返回对象内部的句柄（引用、指针、迭代器）。不返回句柄有助于封装，有助于 `const` 成员函数表现得像 `const`。\n\n\
  ### Item 29: 追求异常安全的代码。\n\n异常安全就像怀孕……但请先放下这个问题。在完成求婚之前，我们无法真正讨论繁殖。\n\n假设我们有一个表示带背景图像菜单的类。该类被设计用于线程环境，因此它有一个用于并发控制的互斥锁：\n\
  \n点击查看代码图像\n\n```cpp\nclass PrettyMenu {\n\npublic:\n\n...\n\nvoid changeBackground(std::istream&\
  \ imgSrc); // 改变背景\n\n... // \n\nprivate:\n\nMutex mutex; // 此对象的互斥锁\n\nImage *bgImage;\
  \ // 当前背景图像\n\nint imageChanges; // 图像改变的次数\n\n};\n```\n\n考虑 `PrettyMenu` 函数 `changeBackground`\
  \ 的可能实现：\n\n点击查看代码图像\n\n```cpp\nvoid PrettyMenu::changeBackground(std::istream&\
  \ imgSrc)\n\n{\n\nlock(&mutex); // 获取互斥锁（如 Item 14 ）\n\ndelete bgImage; // 丢弃旧背景\n\
  \n++imageChanges; // 更新图像改变计数\n\nbgImage = new Image(imgSrc); // 安装新背景\n\nunlock(&mutex);\
  \ // 释放互斥锁\n\n}\n```\n\n\n\n\n从异常安全的角度来看，这个函数的糟糕程度可以说是极点了。异常安全有两个要求，而这个函数一个都不满足。\n\
  \n当抛出异常时，异常安全的函数应该：\n\n-   **不泄漏资源。** 上面的代码没有通过这项测试，因为如果“`new Image(imgSrc)` ” 表达式抛出异常，对\
  \ `unlock` 的调用将永远不会执行，互斥锁会被永久锁定。\n-   **不允许数据结构被损坏。** 如果“`new Image(imgSrc)` ” 抛出异常，`bgImage`\
  \ 将指向一个已被删除的对象。此外，尽管并没有真正安装新图像，但 `imageChanges` 已经自增。（另一方面，旧的图像确实被删除了，所以我想你也可以辩称图像已经已经被“更改”了。）\n\
  \n解决资源泄露问题很容易的，因为 第 13 条 解释了如何使用对象来管理资源，而 第 14 条 引入了 `Lock` 类，作为一种确保互斥锁被及时释放的方法：\n\
  \n点击此处查看代码图像\n\n```cpp\nvoid PrettyMenu::changeBackground(std::istream& imgSrc)\n\
  {\n  Lock ml(&mutex); // 来自 第 14 条 ：获取互斥锁\n  // 并确保稍后释放\n\n  delete bgImage;\n\n\
  \  ++imageChanges;\n\n  bgImage = new Image(imgSrc);\n}\n```\n\n像 `Lock` 这样的资源管理类最大的优点之一是它们通常会让函数变得更短。看，对\
  \ `unlock` 的调用不再需要了吗？作为一个通用规则，代码越少代码越好，因为在更改时出错的机会越少，被误解的也越少。\n\n解决了资源泄露问题后，我们可以转向转向数据结构损坏的问题。在这里我们面临选择，但在做出选择之前，我们必须面对定义这些选择的术语。\n\
  \n异常安全的函数提供三种保证之一：\n\n-   提供**基本保证**的函数承诺：如果抛出异常，程序中的所有内容都将保持有效状态。没有对象或数据结构被损坏，且所有对象都处于内部一致的状态（例如，所有类不变性都得到满足）。然而，程序的确切状态可能是不可预测的。例如，我们可以编写\
  \ `changeBackground`，使得如果抛出异常，`PrettyMenu` 对象可能继续保留旧的背景图像，也可能是某个默认背景图像，但客户端无法预测是哪一个。（要查明，他们可能需要调用某个成员函数来告诉他们当前的背景图像是什么。）\n\
  -   提供**强保证**的函数承诺：如果抛出异常，程序的状态将保持不变。对此类函数的调用在某种意义上是*原子性*，这意味着如果它们成功了，就是完全成功；如果它们失败了，程序状态就像它们从未被调用过一样。\n\
  \n处理提供强保证的函数比处理只提供基本保证函数要容易，因为在调用提供强保证的函数后，只有两种可能的程序状态：函数成功执行后的预期状态，或者函数调用时存在的状态。相比之下，如果对一个只提供基本保证的函数调用产生异常，程序可能处于*任何*有效状态。\n\
  -   提供**不抛出保证**的函数承诺永不抛出异常，因为它们总是执行它们承诺要做的事。对内置类型（例如 `int` 变量、指针等）的所有操作都是不抛异常的（即提供不抛出保证）。这是异常安全代码的关键构建模块。\n\
  \n假设具有空异常说明符的函数是不抛出的似乎是合理的，但并不一定如此。例如，考虑这个函数：\n\n```cpp\nint doSomething() throw()\
  \ ; // 注意空的异常说明符\n```\n\n这并不意味着 `doSomething` 永远不会抛出异常；它表示*如果* `doSomething` 抛出了异常，那就是严重错误，并且应该调用\
  \ `unexpected` 函数。^(†) 事实上，`doSomething` 可能根本没有提供任何异常保证。函数的声明（包括它的异常说明符，如果有的话）并不能告诉你函数是否正确、可移植或高效，它无法告诉你该函数提供了哪种（如果有的话）异常安全保证。所有这些特征都取决于函数的实现，而不是它的声明。\n\
  \n异常安全代码必须提供上述三种保证之一。如果不是，它就不是异常安全的。因此，选择在于决定为你编写的每个函数提供哪种保证。除了处理异常不安全的遗留代码（我们将在本条稍后讨论），否则只有当你的需求分析专家小组确定你的应用程序需要泄漏资源并在损坏的数据结构上运行时，不提供任何异常安全保证才应该是一个选项。\n\
  \n作为一个通用规则，尽可能提供范围内尽可能强的保证。从异常安全的角度来看，不抛异常函数是完美的，但如果不调用可能抛异常的函数，很难离开 C++ 中的 C 部分。任何使用动态分配内存（例如所有\
  \ STL 容器）通常都会抛出 `bad_alloc` 异常。\n\n在 `changeBackground` 的情况下，*几乎*提供强保证并不困难。首先，我们将\
  \ `PrettyMenu` 的数据成员 `bgImage` 的类型从内置 `Image*` 指针改为 第 13 条 中描述的智能指针。坦率地说，仅仅从防止资源泄露的角度来看，这是一个好主意。它帮助我们提供强异常安全保证，进一步证明了使用对象（如智能指针）管理资源\
  \ 第 13 条 的观点是设计的基础。在下面的代码中，我展示了使用 `tr1::shared_ptr`，因为它在拷贝时的直观行为通常优于 `auto_ptr`。\n\
  \n其次，我们重新排列了 `changeBackground` 中的语句顺序，以便在更改图像之前不增加 `imageChanges`。作为一个通用规则，在事情实际发生之前不更改对象的状态来指示已发生是一个良好的策略。\n\
  \n以下是生成的代码：\n\n点击此处查看代码图像\n\n```cpp\nclass PrettyMenu {\n  ...\n  std::tr1::shared_ptr<Image>\
  \ bgImage;\n  ...\n};\n\nvoid PrettyMenu::changeBackground(std::istream& imgSrc)\n\
  {\n  Lock ml(&mutex);\n  bgImage.reset(new Image(imgSrc)); // 将 bgImage 的内部\n  //\
  \ 指针替换为 \"new Image\" 表达式的结果\n  ++imageChanges;\n}\n```\n\n\n\n正如我所说，那两处更改*几乎*足以让\
  \ `changeBackground` 提供强异常安全保证了。症结在哪里呢？是参数 `imgSrc`。如果 `Image` 构造函数抛出异常，输入流的读取标记可能已经移动，而这种移动将变成一个对程序其他部分可见的状态更改。在\
  \ `changeBackground` 解决这个问题之前，它仅提供基础的异常安全保证。\n\n然而，让我们先抛开这个问题不谈，假设 `changeBackground`\
  \ 确实提供了强保证。（我坚信你能想出办法来实现这一点，也许通过将其参数类型从 `istream` 更改为包含图像数据的文件名。）有一种通用的设计策略通常能导致强保证，熟悉这种策略非常重要。这种策略被称为“拷贝并交换”（copy\
  \ and swap）。从原则上讲，它非常简单：为你想要修改的对象创建一个副本，然后在该副本上进行所有需要的更改。如果任何修改操作抛出异常，原始对象将保持不变。在所有更改都成功完成后，通过一个不会抛出异常的操作将修改后的对象与原始对象进行交换。\n\
  \n这通常通过将“真实”对象中的所有对象相关数据放入一个单独的实现对象来实现，然后给真实对象一个指向该实现对象的指针。这通常被称为“pimpl 模式”（pimpl\
  \ idiom），[Item 31] 对其进行了详细描述。对于 `PrettyMenu`，它通常看起来像这样：\n\n```cpp\nstruct PMImpl\
  \ { // PMImpl = \"PrettyMenu\n    std::tr1::shared_ptr<Image> bgImage; // Impl.\"\
  ; 详见下文\n    int imageChanges; // 为什么是一个结构体\n};\n\nclass PrettyMenu {\n//...\nprivate:\n\
  \    Mutex mutex;\n    std::tr1::shared_ptr<PMImpl> pImpl;\n};\n\nvoid PrettyMenu::changeBackground(std::istream&\
  \ imgSrc)\n{\n    using std::swap; // 参见 [Item 25]\n    Lock ml(&mutex); // 获取锁\n\
  \    std::tr1::shared_ptr<PMImpl> // 拷贝对象数据\n    pNew(new PMImpl(*pImpl));\n   \
  \ pNew->bgImage.reset(new Image(imgSrc)); // 修改副本\n    ++pNew->imageChanges;\n \
  \   swap(pImpl, pNew); // 将新的\n    // 数据交换到位\n} // 释放锁\n```\n\n在这个示例中，我选择将 `PMImpl`\
  \ 设为结构体而不是类，因为 `pImpl` 是私有的，确保了 `PrettyMenu` 数据的封装性。将 `PMImpl` 设为类至少一样好，虽然稍微不方便一些。（这还能避开面向对象纯洁主义者的干扰。）如果需要，可以将\
  \ `PMImpl` 嵌套在 `PrettyMenu` 内部，但这类打包问题与编写异常安全代码无关，而这正是我们关心的。\n\n拷贝并 `swap` 的策略是对对象状态进行“全有全无”更改的极佳方法，但通常来说，它不能保证整个函数是强异常安全的。为了理解原因，考虑\
  \ `changeBackground` 的抽象 `someFunc`，它使用了拷贝并交换，但包含了对另外两个函数 `f1` 和 `f2` 的调用：\n\n```cpp\n\
  void someFunc()\n{\n    ... // 拷贝本地状态\n    f1();\n    f2();\n    ... // 将修改后的状态交换到位\n\
  }\n```\n\n显而易见，如果 `f1` 或 `f2` 不具备强异常安全，那么 `someFunc` 很难是强异常安全的。例如，假设 `f1` 仅提供基础保证。为了让\
  \ `someFunc` 提供强保证，它必须编写代码在调用 `f1` 之前确定整个程序的状态，捕获 `f1` 的所有异常，然后恢复原始状态。\n\n如果 `f1`\
  \ 和 `f2` *都是*强异常安全的，情况其实并不好过。毕竟，如果 `f1` 运行完成，程序状态可能已经发生了任意变化，因此如果此时 `f2` 抛出异常，程序的状态就与调用\
  \ `someFunc` 时的不同了，即使 `f2` 并没有改变任何东西。\n\n问题在于副作用。只要函数只在本地状态上操作（例如 `someFunc` 只影响其被调用的对象的状态），提供强保证就相对容易。当函数对非本地数据产生副作用时，情况就会困难得多。例如，如果调用\
  \ `f1` 的副作用之一是修改了数据库，那么要让 `someFunc` 强异常安全将非常困难。通常，没有办法可以撤销已经提交的数据库修改；其他数据库客户端可能已经看到了数据库的新状态。\n\
  \n此类问题会阻碍你为函数提供强保证，即使你想这么做。另一个问题是效率。拷贝并交换的核心思想是修改对象状态的副本，然后通过一个不会抛出异常的操作将修改后的数据与原始数据交换。这需要为每个对象创建一个副本，这会消耗你可能无法的时间和空间。强保证是非常理想的，在可行时你应该提供它，但它并非\
  \ 100% 的情况下都是可行的。\n\n当不可行时，你必须提供基础保证。在实践中，你可能会发现某些函数可以提供强保证，但效率或复杂性的代价会使其在许多函数中无法实现。只要你在可行的情况下为提供强保证付出了合理的努力，那么当你只提供基础保证时，没有人应该有立场批评你。\n\
  \n如果你编写了一个完全不提供异常保证的函数，情况就不同了，因为在这一方面，假设你有罪是合理的。你*应该*编写异常安全的代码。但你可能有一个强有力的辩护。再次考虑调用\
  \ `f1` 和 `f2` 的 `someFunc` 实现。假设 `f2` 不提供任何安全保证，甚至连基础保证都没有。这意味着如果 `f2` 抛出异常，程序在\
  \ `f2` 内部可能泄漏了资源。这意味着 `f2` 可能损坏了数据结构，例如排序数组可能不再排序，从一个数据结构传输到另一个数据结构的对象可能丢失等。`someFunc`\
  \ 没有办法补偿这些问题。如果 `someFunc` 调用的函数不提供异常保证，`someFunc` 本身无法提供任何保证。\n\n这让我回到了怀孕。一个女性要么怀孕，要么没有。不存在部分怀孕。同样，软件系统要么是异常安全的，要么不是。不存在部分异常安全的系统。如果一个系统即使只有一个函数不是异常安全的，那么整个系统就不是异常安全的，因为调用那一个函数可能会导致资源泄漏和数据结构损坏。遗憾的是，许多\
  \ C++ 遗留代码在编写时没有考虑异常安全性，因此现在的许多系统并不是异常安全的。它们包含了以异常不的方式编写的代码。\n\n\n\n\n## 引言\n\n\
  没有理由维持这种现状。在编写新代码或修改现有代码时，请仔细考虑如何让它具有异常安全性（exception-safe）。从使用对象来管理资源开始。（再次，参见第\
  \ 13 条）。这可以防止资源泄漏。接下来，确定对于你编写的每个函数，三类异常安全保证中的哪一种是你在实践中可以提供的最强保证；只有在调用遗留代码迫使你别无选择时，才接受不提供任何保证。记录你的决策，既为了你函数的客户端，也为了未来的维护者。函数的异常安全保证是其接口的可见部分，因此你应该像选择函数接口的其他所有方面一样，谨慎地选择它。\n\
  \n四十年前，充斥着 `goto` 的代码被认为是良好的做法。现在，我们致力于编写结构化的控制流。二十年前，全局可访问的数据被认为是良好的做法。现在，我们致力于封装数据。十年前，在不考虑异常影响的情况下编写函数被认为是良好的做法。现在，我们致力于编写具有异常安全的代码。\n\
  \n时间流逝。我们成长。我们学习。\n\n## 需要记忆的\n\n- 异常安全的函数即使在抛出异常时也不会泄漏资源，也不会允许数据结构被损坏。此类函数提供基础（basic）、强（strong）或不抛出（nothrow）保证。\n\
  - 强保证通常可以通过拷贝并交换（copy-and-`swap`）来实现，但强保证对于所有函数都不是现实。\n- 函数提供的保证通常不会强于它所调用的函数中的弱保证。\n\
  \n## 第 30 条：理解内联（inlining）的本质。\n\n内联函数 —— 多么棒的主意！它们看起来像函数，用起来也像函数，它们比宏好得多（参见第 2\
  \ 条），而且你可以直接调用它们而无需产生函数调用的开销。你还有什么要求的呢？\n\n你实际得到的比想象的要多，因为避免函数调用开销只是故事的一部分。编译器优化通常是针对缺乏函数调用的代码段设计的，因此当你内联一个函数时，你可能允许编译器对函数体执行特定上下文的优化。大多数编译器永远不会对“分离的（outlined）”函数调用执行此类优化。\n\
  \n在编程中，正如在生活中一样，没有免费的午餐，内联函数也不例外。内联背后的思想是用该函数的每次调用替换为其代码体，不需要统计学博士学位就能看出，这可能会增加你的对象代码体积。在内存有限的机器上，过度热的内联可能导致程序大到超出了可用空间。即使有虚拟内存，内联引起的代码膨胀也可能导致额外的分页、指令缓存命中率的降低，以及随之而来的性能惩罚。\n\
  \n另一方面，如果一个内联函数体非常短，为函数体生成的代码可能比为函数调用生成的代码更小。如果是这样，内联函数实际上可能导致更小的对象代码和更高的指令缓存命中率！\n\
  \n请记住，`inline` 是向编译器提出的请求，而不是命令。请求可以隐式或显式地给出。隐式方式是在类定义内部定义函数：\n\n点击此处查看代码图\n\n```cpp\n\
  class Person {\npublic:\n    ...\n    int age() const { return theAge; } // 一个隐式内联请求：age\
  \ 是\n    ... // 定义在类定义中\nprivate:\n    int theAge;\n};\n```\n\n此类函数通常是成员函数，但第 46\
  \ 条解释了友元函数也可以定义在类内部。当它们定义时，也被隐式地声明为内联。\n\n显式声明内联函数的方法是在定义之前加上 `inline` 关键字。例如，这是标准\
  \ `max` 模板（来自 `<algorithm>`）的实现方式：\n\n点击此处查看代码图\n\n```cpp\ntemplate<typename T>\
  \ // 显式内联\ninline const T& std::max(const T& a, const T& b) // 请求：std::max 是\n{\
  \ return a < b ? b : a; } // 由 \"inline\" 前置\n```\n\n`max` 是模板这一事实引出了一个观察：内联函数和模板通常都定义在头文件中。这导致一些程序员得出结论：函数模板必须是内联的。这个结论既无效又可能有害，值得稍微研究一下。\n\
  \n内联函数通常必须在头文件中，因为大多数构建环境在编译期间进行内联。为了用被调用函数的体替换函数调用，编译器必须知道该函数的样貌。（某些构建环境可以在链接期间进行内联，少数环境——例如基于\
  \ `.NET` 通用语言基础设施 CLI 的托管环境—— 实际上可以在运行时进行内联。然而，此类环境是例外，而非规律。大多数 C++ 程序的内联是编译时的活动。）\n\
  \n模板通常在头文件中，因为编译器需要知道模板的样貌以便在使用时实例化它。（再次，这并非普遍的。某些构建环境在链接期间执行模板实例化。然而，编译时实例化更为常见。）\n\
  \n模板实例化与内联是独立的。如果你正在编写模板，并且认为从该模板实例化的所有函数都应该是内联的，请将模板声明为 `inline`；上面的 `std::max`\
  \ 实现就是这样做。但如果你编写的是你不需要内联的函数的模板，请避免将模板声明为内联（无论是显式还是隐式）。内联是有成本的，你不希望在没有预见的情况下承担这些成本。\n\
  \n在在此之前，让我们完成这一观察：`inline` 是一个编译器可能会忽略的请求。大多数编译器拒绝内联它们认为过于复杂的函数（例如包含循环或递归的函数），而且所有简单的虚函数调用都违背内联。后者的观察不应该意外。`virtual`\
  \ 意味着“等到运行时确定调用哪个函数”，而 `inline` 意味着“在执行前将调用点替换为被调用函数”。如果编译器不知道将调用哪个函数，你很难责怪它们拒绝内联函数体。\n\
  \n这一切归结为一点：给定的内联函数是否实际被内联，取决于你使用的构建环境——主要取决于编译器。坦率地说，如果编译器未能内联你请求执行的函数（参见第 53 条\
  \ ），大多数编译器的诊断级别会产生警告。\n\n有时即使编译器完全愿意内联函数，它们也会为内联函数生成函数体。例如，如果你的程序获取了内联函数的地址，编译器通常必须为其生成一个分离的函数体。如何获得一个不存在的函数指针呢？结合编译器通常不跨函数指针调用进行内联的的事实，这意味着对内联函数的调用可能会内联，也可能不会，取决于调用的方式：\n\
  \n点击此处查看代码图\n\n```cpp\ninline void f() {...} // 假设编译器愿意内联 f 的调用\n\nvoid (*pf)()\
  \ = f; // pf 指向 f\n```\n\n\n\n\n\n```cpp\nf(); // 此调用将被内联，因为它是“普通”调用\n\npf(); //\
  \ 此调用可能不会被内联，因为它是通过\n\n// 函数指针调用的\n```\n\n即使你从不使用函数指针，未内联的内联函数的“幽影”也可能困扰着你，因为程序员并不是唯一请求函数指针的人。有时编译器会生成构造函数和析构函数的函数外拷贝，以便能够获取这些函数的指针，从而在数组中对象的构造和析毁期间使用。\n\
  \n事实上，构造函数和析构函数作为内联候选者的状况往往比表面观察所显示的要更糟糕。例如，考虑下面的 `Derived` 类的构造函数：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Base {\n\npublic:\n\n...\n\nprivate:\nstd::string bm1, bm2; // 基类成员\
  \ 1 和 2\n};\n\nclass Derived: public Base {\n\npublic:\nDerived() {} // Derived\
  \ 的构造函数是空的——真的如此吗？\n\n...\n\nprivate:\nstd::string dm1, dm2, dm3; // 派类成员 1–3\n\
  };\n```\n\n这个构造函数看起来是内联的极佳候选，因为它不包含任何代码。但外观具有欺骗性。\n\nC++ 对对象创建和销毁时发生的情况提供了各种保证。例如，当你使用\
  \ `new` 时，你动态创建的对象会自动通过其构造函数进行初始化；当你使用 `delete` 时，相应的析构函数会被调用。当你创建一个对象时，该对象中的每个基类和每个数据成员都会自动构造，当对象被销毁时，关于析毁的反向过程会自动发生。如果在对象构造过程中抛出异常，对象中已经完全构造的任何部分将自动销毁。在所有这些场景中，C++\
  \ 规定了*必须*发生什么，但没有规定*如何*发生。这取决于编译器的实现者，但很显然，这些事情并不会自动发生。你的程序中必须有某些代码来让这些事情发生，而这些代码——由编译器编写并在编译期间插入你的程序中的代码——必须有一个去处。有时它们最终会出现在构造函数和析构函数中，因此我们可以想象实现为上述所谓的空的\
  \ `Derived` 构造函数生成等同于以下代码：\n\n点击此处查看代码图像\n\n```cpp\nDerived::Derived() // 概念性实现\n\
  \n{ // “空” Derived 构造函数\n\nBase::Base(); // 初始化 Base 部分\n\ntry { dm1.std::string::string();\
  \ } // 尝试构造 dm1\n\ncatch (...) { // 如果抛出异常，\n\nBase::~Base(); // 销毁基类部分并\n\nthrow;\
  \ // 传播异常\n\n}\n\ntry { dm2.std::string::string(); } // 尝试构造 dm2\n\ncatch(...) {\
  \ // 如果抛出异常，\n\ndm1.std::string::~string(); // 销毁 dm1，\n\nBase::~Base(); // 销毁基类部分，并\n\
  \nthrow; // 传播异常\n\n}\n\ntry { dm3.std::string::string(); } // 构造 dm3\n\ncatch(...)\
  \ { // 如果抛出异常，\n\ndm2.std::string::~string(); // 销毁 dm2，\n\ndm1.std::string::~string();\
  \ // 销毁 dm1，\n\nBase::~Base(); // 销毁基类部分，并\n\nthrow; // 传播异常\n\n}\n\n}\n```\n\n\
  这段代码并不代表真实编译器的输出，因为真实的编译器以更复杂的方式处理异常。尽管如此，它准确地反映了 `Derived` “空”构造函数必须提供的行为。无论编译器的异常实现有多么复杂，`Derived`\
  \ 的构造函数至少必须调用其数据成员和基类的构造函数，而这些调用（其本身可能被内联）可能会影响其内联的吸引力。\n\n同样的推理也适用于 `Base` 构造函数，因此如果它被内联，插入到它的所有代码也会插入到\
  \ `Derived` 构造函数中（通过 `Derived` 构造函数对 `Base` 构造函数的调用）。如果 `string` 构造函数恰好也被内联了，`Derived`\
  \ 构造函数将获得该函数代码的*五份拷贝*，对应于 `Derived` 对象中五个字符串中的每一个（它继承的两个加上自己声明的三个）。可能现在已经清楚了为什么是否内联\
  \ `Derived` 的构造函数不是一个显而易见的决定了。类似的考虑也适用于 `Derived` 的析构函数，无论如何，它都必须确保由 `Derived` 构造函数初始化的所有对象被正确销毁。\n\
  \n库的设计者必须评估声明函数为 `inline` 的影响，因为无法对库中客户端可见的内联函数提供二进制升级。换句话说，如果 `f` 是库中的一个内联函数，库的客户端会将\
  \ `f` 的体体编译到它们的应用程序中。如果库的实现者以后决定更改 `f`，所有使用过 `f` 的客户端都必须重新编译。这通常是不愿面对的。另一方面，如果 `f`\
  \ 是一个非内联函数，对 `f` 的修改只需要客户端重新链接。这比重新编译的负担要轻得多，而且如果包含函数的库是动态链接的，这种负担可能以一种对客户端完全透明的方式被吸收。\n\
  \n出于程序开发的目的，记住所有这些考虑是非常重要的，但从编码的实用角度来看，有一个事实主了所有其他因素：大多数调试器在处理内联函数方面存在困难。这并不是什么大发现。你如何在一个不存在的函数中设置断点？虽然某些构建环境支持调试内联函数，但许多环境在调试模式中会禁用内联。\n\
  \n这导致了一个确定哪些函数应该声明为内联、哪些不应该的逻辑策略。起初不要内联任何内容，至少将内联限制在必须内联的（参见项目 46）或真正简单的函数上（例如 135\
  \ 页的 Person::age）。通过谨慎使用内联，你方便了调试，也将内联放在了正确的位置：手动优化。不要忘记经验规定的典型程序 80%的时间运行在 20%的代码上。这是一个重要的规则，因为它提醒你，作为软件开发人员的目标是识别出能够提高性能的\
  \ 20%代码。你可以不断内联并调整函数，但除非你关注的是*正确的*函数，否则都是徒用功。\n\n### 注意事项\n\n- 将大多数内联限制在小型、频繁调用的函数。这有助于调试和二进制升级，最小化潜在的膨胀，并增加程序加速的机会。\n\
  - 不要因为函数模板出现在头文件中就将其声明为 `inline`。\n\n### 第 31 项：最小化文件之间的编译依赖\n\n于是你进入 C++ 程序，对一个类的实现做了一个微小的修改。注意，不是修改类的接口，只是实现；只是私有部分。然后你重新构建程序，认为这个过程只需要几秒钟。毕竟，只有一个类被修改了。你点击构建或输入\
  \ `make`（或类似的命令），你惊讶了，随后恼了，因为你发现整个*世界*都在重新编译和重新链接！你难道不喜欢这种情况发生吗？\n\n问题在于 C++ 在分离接口和实现方面做得并不好。类定义不仅指定了类的接口，还规定了相当多的实现细节。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Person {\n\npublic:\n\nPerson(const std::string& name,\
  \ const Date& birthday,\n\nconst Address& addr);\n\nstd::string name() const;\n\n\
  std::string birthDate() const;\n\nstd::string address() const;\n\n...\n\nprivate:\n\
  ```\n\n\n\n\n\n```cpp\nstd::string theName; // 实现细节\n\nDate theBirthDate; // 实现细节\n\
  \nAddress theAddress; // 实现细节\n\n};\n```\n\n在这里，如果无法访问 `Person` 实现所使用的类的定义（即 `string`、`Date`\
  \ 和 `Address`），那么 `Person` 类就无法通过编译。这些定义通常通过 `#include` 指令提供，因此在定义 `Person` 类的文件中，你可能会发现类似这样的内容：\n\
  \n```cpp\n#include <string>\n#include \"date.h\"\n#include \"address.h\"\n```\n\n\
  遗憾的是，这在定义 `Person` 的文件和这些头文件之间建立了编译依赖关系。如果这些头文件中的任何一个发生了变化，或者如果它们所依赖的任何头文件发生了变化，包含\
  \ `Person` 类的文件必须重新编译，任何使用 `Person` 的文件也是如此。这种级联编译依赖已经给无数项目带来过巨大的痛苦。\n\n你可能会奇怪，为什么\
  \ C++ 坚持要将类的实现细节写在类定义中？例如，为什么你不能通过这种方式定义 `Person`，即单独指定类的实现细节？\n\n点击此处查看代码图片\n\n\
  ```cpp\nnamespace std {\nclass string; // 前向声明（一个错误的\n\n} // 定义——见下文）\n\nclass Date;\
  \ // 前向声明\nclass Address; // 前向声明\n\nclass Person {\npublic:\n    Person(const std::string&\
  \ name, const Date& birthday, const Address& addr);\n    std::string name() const;\n\
  \    std::string birthDate() const;\n    std::string address() const;\n    ...\n\
  };\n```\n\n如果那是可能的话，`Person` 的调用者只有在类接口发生变化时才需要重新编译。\n\n这个想法有两个问题。首先，`string` 并不是一个类，它是一个类型定义（对应\
  \ `basic_string<char>`）。因此，对 `string` 的前向声明是不正确的。正确的前向声明要复杂得多，因为它涉及到额外的模板。然而，这并不重要，因为你不应该尝试手动声明标准库的一部分。相反，只需使用正确的\
  \ `#include` 即可。标准头文件不太可能成为编译瓶颈，特别是当你的构建环境允许你利用预编译头文件时。如果解析标准头文件确实是一个问题，你可能需要更改你的接口设计，以避免使用会导致不必要的\
  \ `#include` 的标准库部分。\n\n前向声明所有内容的第二个（也是更重要的）困难在于，编译器在编译期间需要知道对象的大小。考虑：\n\n点击此处查看代码图片\n\
  \n```cpp\nint main()\n{\n    int x; // 定义一个 int\n    Person p( params ); // 定义一个\
  \ Person\n    ...\n}\n```\n\n当编译器看到 `x` 的定义时，它们知道必须分配足够的空间（通常在栈上）来容纳一个 `int`。这没问题。每个编译器都知道\
  \ `int` 有多大。当编译器看到 `p` 的定义时，它们知道必须为一个 `Person` 分配足够的空间，但它们如何能知道一个 `Person` 对象有多大呢？它们获取该信息的唯一方法是查阅类定义，但如果类定义省略实现细节是合法的，编译器又如何知道分配多少空间呢？\n\
  \n这个问题在 Smalltalk 和 Java 等语言中并不会出现，因为在这些语言中定义对象时，编译器只分配容纳指向对象的 `pointer` 的空间。也就是说，它们处理上述代码的方式就像写成这样一样：\n\
  \n点击此处查看代码图片\n\n```cpp\nint main()\n{\n    int x; // 定义一个 int\n    Person *p; //\
  \ 定义一个指向 Person 的指针\n    ...\n}\n```\n\n这当然是合法的 C++，所以你可以自己玩玩这种“在指针后隐藏对象实现”的游戏。对于\
  \ `Person`，实现这样做的一种方法是将其拆分为两个类：一个只提供接口，另一个实现该接口。如果实现类命名为 `PersonImpl`，那么 `Person`\
  \ 的定义如下：\n\n点击此处查看代码图片\n\n```cpp\n#include <string> // 标准库组件\n// 不应该被前向声明\n#include\
  \ <memory> // 用于 tr1::shared_ptr；见下文\n\nclass PersonImpl; // Person 实现类的前向声明。\n\
  class Date; // 使用的类的前向声明\nclass Address; // Person 接口\n\nclass Person {\npublic:\n\
  \    Person(const std::string& name, const Date& birthday, const Address& addr);\n\
  \    std::string name() const;\n    std::string birthDate() const;\n    std::string\
  \ address() const;\n    ...\nprivate: // 指向实现的指针；\n    std::tr1::shared_ptr<PersonImpl>\
  \ pImpl; // 参见 第 13 条\n}; // std::tr1::shared_ptr\n```\n\n在这里，主类（`Person`）的数据成员除了一个指针外什么都不包含（这里是一个\
  \ `tr1::shared_ptr` —— 参见 第 13 条）。这种设计通常被称为 `pimpl` 句式。在这种类中，指针的名字通常是 `pImpl`，如上所示。通过这种设计，`Person`\
  \ 的调用者与日期、地址和人的细节解耦。因为他们看不到 `Person` 的细节，调用者不需要重新编译。这是接口与实现的真正分离。\n\n这种分离的关键是将对`定义`\
  \ 的依赖替换为`声明`。这就是最小化编译依赖的本质：尽可能让你的头文件自给自足，在不可行的，依赖其他文件的声明而不是定义。其他一切都源于这一设计策略。因此：\n\
  \n-   **当可以使用引用和指针时避免使用对象。** 你只需要类型的声明即可定义该类型的引用和指针。定义类型的 `objects` 需要该类型的定义。\n\
  -   **尽可能依赖类声明而不是类定义。** 注意，在声明使用该类的函数时，永远不需要类定义，即使该函数按值传递或返回该类类型：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Date; // 类声明\nDate today(); // ——不需要定义\nvoid clearAppointments(Date\
  \ d); // 不需要 Date\n```\n\n当然，按值传递通常是一个坏主意（参见 第 20 条），但如果你由于某些原因发现自己在使用，仍然没有理由引入不必要的编译依赖。\n\
  \n在不定义 `Date` 的情况下声明 `today` 和 `clearAppointments` 的能力可能会让你惊讶，但它看起来并不那么奇怪。如果有人 `call`\
  \ 了这些函数，`Date` 的定义在调用之前已经被看过了。你可能会问，为什么要费心声明没人调用的函数？很简单。并不是*没有人*调用它们，而是*不是所有人*都会调用它们。\n\
  \n\n\n\n\n## 为声明和定义提供单独的头文件。\n\n为了方便遵守上述指南，头文件需要成对出现：一个用于声明，另一个用于定义。当然，这些文件必须保持一致。如果某个某处更改了声明，那么在两个文件中都必须进行更改。因此，库客户端应该始终\
  \ `#include` 声明文件，而不是自己对其进行前向声明，而库作者应该提供这两个头文件。例如，想要声明 `today` 和 `clearAppointments`\
  \ 的 `Date` 客户端不应该像上面那样手动前向声明 `Date`。相反，它应该 `#include` 相应的声明头文件：\n\n点击此处查看代码图像\n\n\
  ```cpp\n#include \"datefwd.h\" // 声明（但未定义）类 Date 的头文件\n\nDate today(); // 如之前\n\n\
  void clearAppointments(Date d);\n```\n\n仅包含声明的头文件 `datefwd.h` 的命名基于标准 C++ 库中的头文件\
  \ `<iosfwd>`（参见 Item 54）。`<iosfwd>` 包含了 iostream 组件的声明，其对应的定义在几个不同的头文件中，包括 `<sstream>`、`<streambuf>`、`<fstream>`\
  \ 和 `<iostream>`。\n\n`<iosfwd>` 还有另一个教育意义，那就是为了明确本 Item 中的建议不仅适用于模板，也适用于非模板。尽管 Item\
  \ 30 解释了在许多构建环境中，模板定义通常位于头文件中，但某些构建环境允许模板定义位于非头文件，，因此为模板提供仅包含声明的头文件仍然是有意义的。`<iosfwd>`\
  \ 就是其中一个头文件。\n\nC++ 还提供了 `export` 关键字，允许将模板声明与模板定义分离。遗憾的是，编译器对 `export` 的支持非常有限，而现实世界中对\
  \ `export` 的经验更为匮乏。因此，现在说 `export` 将有效的 C++ 编程中扮演什么作用还为过早。\n\n## 处理类（Handle classes）\n\
  \n采用 pimpl 句类的如 `Person` 等类通常被称为 **Handle 类**。如果你好奇这类类实际上是如何执行操作的，一种方法是将它们的所有函数调用转发到相应的实现类，并让这些类执行实际工作。例如，这里是\
  \ `Person` 的两个成员函数的可能实现方式：\n\n点击此处查看代码图像\n\n```cpp\n#include \"Person.h\" // 我们正在实现\
  \ Person 类，\n\n// 所以我们必须 #include 它的类定义\n\n#include \"PersonImpl.h\" // 我们也必须 #include\
  \ PersonImpl 的类\n\n// 定义，否则我们无法调用\n\n// 它的成员函数；注意\n\n// PersonImpl 有与 Person 完全相同的公共\n\
  \n// 成员函数——它们的\n\n// 接口是相同的\n\nPerson::Person(const std::string& name, const Date&\
  \ birthday,\n\nconst Address& addr)\n: pImpl(new PersonImpl(name, birthday, addr))\n\
  {}\n\nstd::string Person::name() const\n{\n\nreturn pImpl->name();\n}\n```\n\n注意\
  \ `Person` 构造函数是如何调用 `PersonImpl` 构造函数的（通过使用 `new` ——参见 Item 16 ）以及 `Person::name`\
  \ 是如何调用 `PersonImpl::name` 的。这是重要的。将 `Person` 变成 Handle 类并没有改变 `Person` 的功能，它只是改变了实现功能的方式。\n\
  \n## 接口类（Interface classes）\n\nHandle 类方法的替代方案是将 `Person` 变为一种特殊的抽象基类，称为 **接口类**。此类类的目的是为派生类指定一个接口（参见\
  \ Item 34）。因此，它通常没有数据成员、没有构造函数、有一个虚析构函数（参见 Item 7）以及一组指定接口的纯虚函数。\n\n接口类类似于 Java\
  \ 和 .NET 的接口，但 C++ 并没有像 Java 和 .NET 那样对接口类施加限制。例如，Java 和 .NET 都不允许在接口中包含数据成员或函数实现，但\
  \ C++ 对这两者都不禁止。C++ 更大的灵活性可能是很有用的。正如 Item 36 解释的，层次结构中所有类的非虚函数实现应该是相同的，因此将此类函数实现为声明这些函数的接口类的一部分是有意义的。\n\
  \n\n\n一个用于 `Person` 的接口类可能像这样：\n\n点击此处查看代码图像\n\n```cpp\nclass Person {\n\npublic:\n\
  \nvirtual ~Person();\n\nvirtual std::string name() const = 0;\n\nvirtual std::string\
  \ birthDate() const = 0;\n\nvirtual std::string address() const = 0;\n\n...\n\n\
  };\n```\n\n该类的客户端必须基于 `Person` 指针和引用进行编程，因为无法实例化包含纯虚函数的类。（不过，可以实例化派生自 `Person` 的类——参见下文。）与\
  \ Handle 类的客户端一样，除非接口类的接口被修改，否则接口类的客户端不需要重新编译。接口类的客户端必须有一种创建新对象的方法。它们通常通过调用接口类内部的\
  \ `static` 函数来实现：\n\n点击此处查看代码图像\n\n```cpp\nclass Person {\n\npublic:\n\n...\n\n\
  static std::tr1::shared_ptr<Person> create (const std::string& name,\n\nconst Date&\
  \ birthday,\n\nconst Address& addr);\n\n...\n\n};\n```\n\n客户端这样使用它们：\n\n点击此处查看代码图像\n\
  \n```cpp\nstd::string name;\n\nDate dateOfBirth;\n\nAddress address;\n\n...\n\n\
  // 创建一个支持 Person 接口的对象\nstd::tr1::shared_ptr<Person> pp(Person::create(name, dateOfBirth,\
  \ address) );\n\n...\n\nstd::cout << pp->name() // 通过接口使用\n// 对象\n<< \" was born\
  \ on \"\n<< pp->birthDate()\n<< \" and now lives at \"\n\n<< pp->address(); // 对象在\
  \ pp\n\n// fact 作用域时自动删除——参见 Item 13\n\n```cpp\nclass RealPerson: public Person\
  \ {\n\npublic:\n\nRealPerson(const std::string& name, const Date& birthday,\n\n\
  const Address& addr)\n\n: theName(name), theBirthDate(birthday), theAddress(addr)\n\
  \n{}\n\nvirtual ~RealPerson() {}\n\nstd::string name() const; // 这些函数的实现\n\nstd::string\
  \ birthDate() const; // 函数未显示，但\n//很容易想象\n\nstd::string address() const;\n\nprivate:\n\
  \nstd::string theName;\n\nDate theBirthDate;\n\nAddress theAddress;\n\n};\n```\n\
  \n有了 `RealPerson`，编写 `Person::create` 确实轻而易举：\n\n点击此处查看代码图像\n\n```cpp\nstd::tr1::shared_ptr<Person>\
  \ Person::create(const std::string& name,\n\nconst Date& birthday,\n\nconst Address&\
  \ addr)\n\n{\n\nreturn std::tr1::shared_ptr<Person>(new RealPerson(name, birthday,\
  \ addr));\n\n}\n```\n\n\n\n\n\n`Person::create` 一个更切实际的实现会创建不同类型的派生类对象，这取决于额外函数参数的值、从文件或数据库读取的数据、环境变量等。\n\
  \n`RealPerson` 展示了实现接口类（Interface class）的两种最常见机制之一：它从接口类（`Person`）继承其接口规范，然后实现接口中的函数。实现接口类的第二种方法涉及多重继承，这个主题在条目\
  \ 40 中被探讨过。\n\n句柄类（Handle classes）和接口类将接口与实现解耦，从而减少了文件之间的编译依赖。尽管你心存疑虑，但我知道你正在等待那些细则条款。你喃喃自语道：“这些花招到底要我付出什么代价？”答案是计算机科学中常有的那个：它让你在运行时牺牲了一些速度，并且每个对象都会增加一些额外的内存。\n\
  \n在句柄类的情况下，成员函数必须通过实现指针来访问对象的数据。这使得每次访问都增加了一层间接。而且你必须将此实现指针的大小加到存储每个对象所需的内存中。最后，实现指针必须初始化（在句柄类的构造函数中）以指向一个动态分配的实现对象，因此你会产生动态内存分配（以及随后的释放）所固有的开销，以及遇到\
  \ `bad_alloc`（内存溢出）异常的可能性。\n\n对于接口类，每次函数调用都是虚函数，因此你每次进行函数调用时都要支付间接跳转的代价（参见条目 7）。此外，派生自接口类的对象必须包含一个虚表指针（再次参见条目\
  \ 7）。取决于接口类是否是对象虚函数的唯一来源，该指针可能会增加存储对象所需的内存。\n\n最后，句柄类和接口类无法从内联函数中获得太多收益。[条目 30](#text00015.html_ch05lev1sec5）解释了为什么函数体通常必须在头文件中才能内联，但句柄类和接口类的专门设计是为了隐藏函数体等实现细节。\n\
  \n然而，仅仅因为句柄类和接口类伴有代价就对其不屑顾是一个严重的错误。虚函数也是如此，你并不想放弃它们，对吧？（如果是这样，你就读错书了。）相反，请考虑以进化的方式使用这些技术。在开发期间使用句柄类和接口类，以在实现更改时减少对客户端的影响。当证明速度和/或大小的差异足以证明类与类之间的耦合增加时，将句柄类和接口类替换为具体类以供生产使用。\n\
  \n### 注意事项\n\n- 最小化编译依赖的核心思想是依赖声明而非定义。基于这一思想的两种方法是句柄类和接口类。\n- 库头文件应该以完整的形式和仅声明的形式存在。这无论是否涉及模板都适用。\n\
  \n## 6. 继承与面向对象设计\n\n面向对象编程（OOP）已经流行了近二十年时间，所以你可能对继承、派生和虚函数的概念有些经验。即使你只用 C 语言编程过，也一定没有逃过\
  \ OOP 的热潮。\n\n尽管如此，C++ 中的 OOP 可能与你习惯的有所不同。继承可以是单继承或多重继承，每个继承关系可以是公有的、保护的或私有的。每个关系也可以是虚的或非虚的。然后是成员函数的选项：虚的？非虚的？纯虚的？以及与其他语言特征的交互。默认参数值如何与虚函数相互作用？继承如何影响\
  \ C++ 的名称查找规则？设计选项又是怎样的？如果一个类的行为需要被修改，虚函数是实现这一点的最佳方法吗？\n\n本章理清了这一切。此外，我将解释 C++ 中不同特征的真正*意味着*什么——当你使用特定的构造结构时，你真正在是在*表达*了什么。例如，公有继承意味着“是一个（is-a）”，如果你试图让它代表其他任何意思，就会遇到麻烦。同样，虚函数意味着“接口必须被继承”，而非虚函数意味着“接口和实现都必须被继承”。未能区分这些含义给\
  \ C++ 程序员带来了相当大的困扰。\n\n如果你理解了 C++ 各种特征的含义，你会发现你对 OOP 的观点会发生变化。它不再是一项区分语言特征的练习，而变成决定你想要对软件系统表达什么的问题。一旦你知道你想表达什么，翻译成\
  \ C++ 并不十分困难。\n\n### 条目 32: 确保公有继承符合“是一个”模型。\n\n在 William Dement 的书《有人必须清醒，有人必须睡觉》（*Some\
  \ Must Watch While Some Must Sleep*, W. H. Freeman and Company, 1974）中，他讲述了一个试图在学生脑海中固定他课程最重要的教训的故事。他告诉班级，据称英国普通学生记住的历史最多只比哈斯廷斯战役发生在\
  \ 1066 年。Dement 强调，如果一个孩子几乎什么都不记得，那么他或她至少记得 1066 这个日期。对于*他*课程的学生来说，Dement 接着说，只有几个核心信息，其中有趣的是，安眠药会导致失眠这一事实。他恳求学生即使忘记了其他一切，也要记住这些关键事实，他在整个学期中反复提到这些基本原则。\n\
  \n课程结束时，期末考试最后一个问题是：“写下一个你一生都会记得的课程内容。”当 Dement 改卷时，他震惊了。几乎每个人写的都是“1066”。\n\n因此，我带着极大的忧虑向你们宣布\
  \ C++ 面向对象编程中最重要的规则：公有继承意味着“是一个（is-a）”。将这条规则记在心中。\n\n如果你写类 `D`（派生类）公地继承类 `B`（基类），你是在告诉\
  \ C++ 编译器（以及代码的人类读者）每个类型 `D` 的对象也是类型 `B` 的对象，但*反之不然*。你表示 `B` 代表比 `D` 更通的概念，`D` 代表比\
  \ `B` 更专门的概念。你断言，在任何可以使用类型 `B` 对象的地方，都可以同样使用类型 `D` 对象，因为每个类型 `D` 的对象*都是*类型 `B` 的对象。另一方面，如果你需要一个类型\
  \ `D` 的对象，类型 `B` 的对象并不行：每个 `D` 都是 `B`，但反之不然。\n\n\n\n\n\n在 C++ 领域中，任何期望 `Person`\
  \ 类型参数（或指向 `Person` 的指针或对 `Person` 的引用）的函数也会接受 `Student` 对象（或指向 `Student` 的指针或对\
  \ `Student` 的引用）：\n\n点击此处查看代码\n\n```cpp\nvoid eat(const Person& p); // 任何人都可以吃\n\
  \nvoid study(const Student& s); // 只有学生学习\n\nPerson p; // p 是一个 Person\n\nStudent\
  \ s; // s 是一个 Student\n\neat(p); // 正常，p 是一个 Person\n\neat(s); // 正常，s 是一个 Student，\n\
  \n// 因为 Student 也是（is-a）Person\n\nstudy(s); // 正常\n\nstudy(p); // 错误！p 不是 Student\n\
  ```\n\n这仅适用于 `public` 继承。只有当 `Student` 公共派自 `Person` 时，C++ 的行为才会像我描述的那样。私有继承意味着完全不同的意思（参见\
  \ Item 39），而保护继承的含义直到今天仍让我无法领会。\n\n公共继承与“是（is-a）”之间的等效性听起来很简单，但有时你的直觉会误导你。例如，企鹅是鸟类是事实，而鸟类会飞也是事实。如果我们天真地尝试在\
  \ C++ 中表达这一点，我们的努力结果是：\n\n点击此处查看代码\n\n```cpp\nclass Bird {\npublic:\n    virtual\
  \ void fly(); // 鸟类会飞\n...\n};\n\nclass Penguin: public Bird { // 企鹅是鸟类\n...\n};\n\
  ```\n\n突然我们陷入了麻烦，因为这个层级结构表示企鹅会飞，而我们知道这并非事实。发生了什么？\n\n在这种情况下，我们是某种不精确语言——英语——的受害者。当我们说“鸟类会飞”时，我们并不是指*所有*类型的鸟类都会飞，而是指通常而言，鸟类具有飞行的能力。如果我们能更精确一些，就会意识到存在几种类型的不会飞的鸟，并会得出以下能更好地模拟现实的层级结构：\n\
  \n点击此处查看代码\n\n```cpp\nclass Bird {\n... // 没有声明 fly 函数\n};\n\nclass FlyingBird:\
  \ public Bird {\npublic:\n    virtual void fly();\n...\n};\n\nclass Penguin: public\
  \ Bird {\n... // 没有声明 fly 函数\n};\n```\n\n这个层级结构比原始设计要忠实于我们真实所知的事实得多。\n\n然而，我们关于这些鸟类的问题还没完结，因为对于某些软件系统，可能没有必要区分会飞和不会飞的鸟。如果你的应用程序与喙和翅膀密切有关，而与飞行无关，那么原始的双类层级结构可能非常令人满意。这简单地反映了一个事实：对于所有软件，不存在理想的设计。最好的设计取决于系统现在和未来的预期。如果你的应用程序对飞行一无所知，并且预计未来也不会有任何相关，那么不区分会飞和不会飞的鸟可能是一个完全有效的决策。事实上，这可能比区分两者的设计更好，因为这种区分在你试图建模的世界中是不存在的。\n\
  \n对于如何处理我所说的“所有鸟类都会飞，企鹅是鸟，企鹅不会飞，哎呀”问题，还有另一种流派。观点是重新定义企鹅的 `fly` 函数，使其产生运行时错误：\n\n\
  点击此处查看代码\n\n```cpp\nvoid error(const std::string& msg); // 定义在别处\n\nclass Penguin:\
  \ public Bird {\npublic:\n    virtual void fly() { error(\"尝试让企鹅飞!\"); }\n...\n\
  };\n```\n\n重要的是，要意识到这表达的意思与你可能想的不同。这*不是*在说：“企鹅不会飞。”它说的是：“企鹅会飞，但对它们来说尝试这样做是一个错误。”\n\
  \n你如何区分它们呢？从检测错误的时间点来看。“企鹅不会飞”这一指令可以由编译器强制执行，但“企鹅尝试飞是一个错误”这一规则的违反只能在运行时检测到。\n\n\
  要表达“企鹅不会飞——*此止*”这一约束，你必须确保没有为 `Penguin` 对象定义这样的函数：\n\n点击此处查看代码\n\n```cpp\nclass\
  \ Bird {\n... // 没有声明 fly 函数\n};\n\nclass Penguin: public Bird {\n... // 没有声明 fly\
  \ 函数\n};\n```\n\n如果你现在尝试让企鹅飞，编译器会因你的越界行为而斥备你：\n\n```cpp\nPenguin p;\np.fly(); //\
  \ 错误！\n```\n\n这与你采用产生运行时错误的方法所得到的行为非常不同。用那种方法，编译器对 `p.fly` 的调用不发一言。Item 18 解释了良好的接口可以防止无效代码编译，因此你应该倾向于在编译期间就拒绝企鹅飞行尝试的设计，而不是只在运行时检测到它们的设计。\n\
  \n也许你会承认，你的鸟类学直觉可能有些欠缺。\n\n\n\n\n不要因为你多年来培养的软件直觉在面对面向对象设计时失效而感到苦恼。那些知识仍然很有价值，但现在你已经将“继承”加入了了你的设计方案武器库中，你必须用新的见解来增强你的直觉，以指导你正确应用继承。久而久之，`Penguin`\
  \ 继承自 `Bird` 或 `Square` 继承自 `Rectangle` 的这种概念，将让你产生就像现在当有人给你展示一个长达几页的函数时那种奇怪的感觉。这可能是处理此类问题的正确方法，只是不太可能发生。\n\
  \n“是一个”（is-a）关系并不是类之间唯一存在的关系。另外两种常见的类关系是“有一个”（has-a）和“基于……实现”（is-implemented-in-terms-of）。这些关系在项目\
  \ 38 和项目 39 中进行了讨论。C++ 设计因为其中一种其他重要关系被错误地建模为“是一个”而导致出错并不罕见，所以你应该确保理解这些关系之间的差异，并知道在\
  \ C++ 中如何对对每种关系进行建模。\n\n### 注意事项\n\n*   公有继承意味着“是一个”。所有适用于基类的内容也必须适用于派生类，因为每个派生类对象都是基类对象。\n\
  \n### 项目 33：避免隐藏继承的名称\n\n莎士比亚对名字有一套执着。“名字又算什么呢？”他问道，“玫瑰换个名字，香气依然芬芳。”这位诗人还写道，“谁若偷走了我的名声……真的让我变得贫穷了。”没错。这引出了我们讨论\
  \ C++ 中的继承名称。\n\n这个问题实际上与继承无关。它与作用域有关。我们都知道，在像这样的代码中，\n\n点击此处查看代码图像\n\n```cpp\n\
  int x; // 全局变量\n\nvoid someFunc()\n{\n    double x; // 局部变量\n    std::cin >> x ;\
  \ // 为局部 x 读取一个新值\n}\n```\n\n读取到 `x` 的语句指的是局部变量 `x` 而不是全局变量 `x`，因为内部作用域中的名称会隐藏（“遮蔽”）外部作用域中的名称。我们可以这样视觉化这种作用域情况：\n\
  \n![images](img/Image00007.gif)\n\n当编译器处于 `someFunc` 的作用域内并遇到名称 `x` 时，它们会在局部作用域中查找是否有同名的东西。由于存在，它们永远不会检查任何其他作用域。在这种情况下，`someFunc`\
  \ 里的 `x` 类型是 `double`，而全局的 `x` 类型是 `int`，但这并不重要。C++ 的名称隐藏规则正是这样做的：隐藏名称。无论这些名称对应的是相同类型还是不同类型并不重要。在这种情况下，一个名为\
  \ `x` 的 `double` 隐藏了一个名为 `x` 的 `int`。\n\n现在引入继承。我们知道，当我们派生类成员函数内部并引用基类中的某些内容（例如成员函数、类型定义或数据成员）时，编译器可以找到我们引用的内容，因为派生类继承了在基类中声明的内容。其实的工作原理是，派生类的作用域嵌套在它的基类作用域之内。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Base {\nprivate:\n    int x;\npublic:\n    virtual\
  \ void mf1() = 0;\n    virtual void mf2();\n    void mf3();\n    ...\n};\n\nclass\
  \ Derived: public Base {\npublic:\n    virtual void mf1();\n    void mf4();\n  \
  \  ...\n};\n```\n\n![images](img/Image00008.gif)\n\n这个示例包含了公有和私有名称的混合，以及数据成员和成员函数的名称。成员函数包括纯虚函数、简单（非纯）虚函数和非虚函数。这样做是为了强调我们谈论的是名称。该示例也可以包含类型名称，例如枚举、嵌套类和类型定义（typedef）。在这次讨论中，唯一重要的是它们是名称。它们是“什么的”的名称是无关紧要的。示例使用了单继承，但一旦你理解了单继承下发生了什么，就可以很容易地预判\
  \ C++ 在多重继承下的行为。\n\n假设派生类中的 `mf4` 部分实现如下：\n\n```cpp\nvoid Derived::mf4()\n{\n  \
  \  ...\n    mf2();\n    ...\n}\n```\n\n当编译器在此处看到名称 `mf2` 时，它们必须弄清楚它指的是什么。它们通过在作用域中搜索名为\
  \ `mf2` 的声明来实现这一点。首先，它们查找局部作用域（即 `mf4` 的作用域），但没有找到任何名为 `mf2` 的声明。然后它们查找包含它的作用域，即\
  \ `Derived` 类的作用域。它们仍然没有找到名为 `mf2` 的东西，因此移动到下一个包含作用域，即基类的作用域。在它们那里找到了名为 `mf2` 的东西，于是搜索停止。如果\
  \ `Base` 中没有 `mf2`，搜索将继续，首先到包含 `Derived` 的命名空间（如果有的话），最后到全局作用域。\n\n我刚才描述的过程是准确的，但它并不是对\
  \ C++ 如何查找名称的全面描述。我们的目标并不是知道如何查找。然而，我们的目标是了解足够的查找规则，以避免意外。让我们再次考虑之前的例子，只是这次我们为 `Derived`\
  \ 添加了 `mf1` 和 `mf3`，正如项目 36 解释的，`Derived` 对 `mf3` 的声明——一个非虚函数——使得这种设计非常可疑，但为了理解可见性，我们需要足够的信息。\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Base {\nprivate:\n    int x;\npublic:\n    virtual\
  \ void mf1() = 0;\n    virtual void mf1(int);\n    virtual void mf2();\n    void\
  \ mf3();\n    void mf3(double);\n    ...\n};\n\nclass Derived: public Base {\npublic:\n\
  \    virtual void mf1();\n    void mf3();\n    void mf4();\n```\n\n这种代码让每个 C++ 程序员在第一次遇到它时感到惊讶。作用域隐藏规则没有改变，因此基类中名为\
  \ `mf1` 和 `mf3` 的函数被派生类中名为 `mf1` 和 `mf3` 的函数隐藏了。从查找的角度来看，`Base::mf1` 和 `Base::mf3`\
  \ 不再被 `Derived` 继承。\n\n点击此处查看代码图像\n\n```cpp\nDerived d;\nint x;\n...\nd.mf1(); //\
  \ 正确，调用 Derived::mf1\nd.mf1(x); // 错误！Derived::mf1 隐藏了 Base::mf1\nd.mf2(); // 正确，调用\
  \ Base::mf2\nd.mf3(); // 正确，调用 Derived::mf3\nd.mf3(x); // 错误！Derived::mf3 隐藏了 Base::mf3\n\
  ```\n\n如所示，尽管基类和派生类中的函数类型不同，这种情况仍然适用，而且无论函数是虚函数还是非虚函数都适用。正如在项目的开头，`someFunc` 函数中的\
  \ `double x` 隐藏了全局作用域的 `int x`，这里 `Derived` 中的函数 `mf3` 隐藏了一个类型不同的 `Base` 函数 `mf3`。\n\
  \n这种行为背后的原理是为了防止你在库或应用程序框架中创建新的派生类时，意外中继承远远基类的重载。不幸的是，你通常*想要*继承这些重载。事实上，如果你使用公有继承却没有继承这些重载，你就违反了基类和派生类之间的“是一个”关系，而项目\
  \ 32 解释了这种关系是公有继承的基础。既然如此，你几乎总是想要覆盖 C++ 对继承名称的默认隐藏。\n\n你通过*`using` 声明*来实现：\n\n点击此处查看代码图像\n\
  \n```cpp\nclass Derived: public Base {\npublic:\n    using Base::mf1; // 使 Base\
  \ 中所有名为 mf1 和 mf3 的内容可用\n};\n```\n\n\n\n\n```cpp\nusing Base::mf3; // visible (and\
  \ public) in Derived's scope\n\nvirtual void mf1();\n\nvoid mf3();\n\nvoid mf4();\n\
  \n...\n\n};\n```\n\n![images](img/Image00010.gif)\n\nNow inheritance will work as\
  \ expected:\n\n```cpp\nDerived d;\n\nint x;\n\n...\n\nd.mf1(); // still fine, still\
  \ calls Derived::mf1\nd.mf1(x); // now okay, calls Base::mf1\nd.mf2(); // still\
  \ fine, still calls Base::mf2\nd.mf3(); // fine, calls Derived::mf3\nd.mf3(x); //\
  \ now okay, calls Base::mf3\n```\n\nThis means that if you inherit from a base class\
  \ with overloaded functions and you want to redefine or override only some of them,\
  \ you need to include a `using` declaration for each name you'd otherwise be hiding.\
  \ If you don't, some of the names you'd like to inherit will be hidden.\n\nIt's\
  \ conceivable that you sometimes won't want to inherit all the functions from your\
  \ base classes. Under public inheritance, this should never be the case, because,\
  \ again, it violates public inheritance's is-a relationship between base and derived\
  \ classes. (That's why the `using` declarations above are in the public part of\
  \ the derived class: names that are public in a base class should also be public\
  \ in a publicly derived class.) Under private inheritance (see Item 39 ), however,\
  \ it can make sense. For example, suppose `Derived` privately inherits from `Base`,\
  \ and the only version of `mf1` that `Derived` wants to inherit is the one taking\
  \ no parameters. A `using` declaration won't do the trick here, because a `using`\
  \ declaration makes all inherited functions with a given name visible in the the\
  \ derived class. No, this is a case for a different technique, namely a simple forwarding\
  \ function:\n\nClick here to view code image\n\n```cpp\nclass Base {\n\npublic:\n\
  \nvirtual void mf1() = 0;\n\nvirtual void mf1(int);\n\n... // as before\n\n};\n\n\
  class Derived: private Base {\n\npublic:\n\nvirtual void mf1() // forwarding function;\
  \ implicitly\n\n{ Base::mf1(); } // inline (see Item 30 ) For info\n\n... // function,\
  \ see item 34. )\n\n};\n```\n\n```cpp\nDerived d;\n\nint x;\n\nd.mf1(); // fine,\
  \ calls Derived::mf1\nd.mf1(x); // error! Base::mf1() is hidden\n```\n\nAnother\
  \ use for inline forwarding functions is to work around ancient compilers that (incorrectly)\
  \ don't support `using` declarations to import inherited names into the scope of\
  \ a derived class.\n\nThat's the whole story on inheritance and name hiding, but\
  \ when inheritance is combined with templates, an entirely different form of the\
  \ “inherited names are hidden” issue arises. For all the angle-bracket-demarcated\
  \ details, see Item 43.\n\n### Things to Remember\n\n- Names in derived classes\
  \ hide names in base classes. Under public inheritance, this is never desirable.\n\
  - To make hidden names visible again, employ `using` declarations or forwarding\
  \ functions.\n\n### Item 34: Differentiate between inheritance of interface and\
  \ inheritance of implementation\n\nThe seemingly straightforward notion of (public)\
  \ inheritance turns out, upon closer examination, to be composed of two separable\
  \ parts: inheritance of function interfaces and inheritance of function implementations.\
  \ The difference between these two kinds of inheritance corresponds exactly to the\
  \ difference between function declarations and function definitions discussed in\
  \ the Introduction to this book.\n\nAs a class designer, you sometimes want derived\
  \ classes to inherit only the interface (declaration) of a member function. Sometimes\
  \ you want derived classes to inherit both a function's interface and implementation,\
  \ but you want to allow them to override the implementation they inherit. And sometimes\
  \ you want derived classes to inherit a function's interface and implementation\
  \ without allowing them to override anything.\n\nTo get a better feel for the differences\
  \ among these options, consider a class hierarchy for representing geometric shapes\
  \ in a graphics application:\n\nClick here to view code image\n\n```cpp\nclass Shape\
  \ {\n\npublic:\n\nvirtual void draw() const = 0;\n\nvirtual void error(const std::string&\
  \ msg);\n\nint objectID() const;\n\n...\n\n};\n\nclass Rectangle: public Shape {\
  \ ... };\n\nclass Ellipse: public Shape { ... };\n```\n\n`Shape` is an abstract\
  \ class; its pure virtual function `draw` marks it as such. As a result, clients\
  \ cannot create instances of the `Shape` class, only of classes derived from it.\
  \ Nonetheless, `Shape` exerts a strong influence on all classes that (publicly)\
  \ inherit from it, because:\n\n- Member function interfaces are always inherited.\
  \ As explained in Item 32, public inheritance means is-a, so anything that is true\
  \ of a base class must also be true of its derived classes. Hence, if a function\
  \ applies to a class, it must also apply to its derived classes.\n\nThree functions\
  \ are declared in the `Shape` class. The first, `draw`, draws the current object\
  \ on an implicit display. The second, `error`, is called when an error needs to\
  \ be reported. The third, `objectID`, returns a unique integer identifier. Each\
  \ function is declared in a different way: `draw` is a pure virtual function; `error`\
  \ is a simple virtual function; `objectID` is a non-virtual function. What are the\
  \ implications of these declarations?\n\nConsider first the pure virtual function\
  \ `draw`:\n\n```cpp\nclass Shape {\n\npublic:\n\nvirtual void draw() const = 0;\n\
  \n...\n\n};\n```\n\nThe two most salient features of pure virtual functions are\
  \ that they must be redeclared by any concrete class that inherits them, and they\
  \ typically have no definition in abstract classes. Put these two characteristics\
  \ together, and you realize that:\n\n- The purpose of declaring a pure virtual function\
  \ is to have derived classes inherit a only.\n\nThis makes perfect sense for the\
  \ `Shape::draw` function, because it is a reasonable demand that all `Shape` objects\
  \ be `draw` able, but the `Shape` class can provide no default implementation for\
  \ that function. The algorithm for drawing an ellipse is very different the the\
  \ algorithm for a a rectangle for for example.\n\nIncidentally, it is to to provide\
  \ a definition for pure virtual function. That is, you could provide an implementation\
  \ for `Shape::draw`, and C++ wouldn't complain, but the only way to call it would\
  \ be to qualify the call with the class name:\n\nClick here to view code image\n\
  \n```cpp\nShape *ps = new Shape; // error! Shape is abstract\n\nShape *ps1 = new\
  \ Rectangle; // fine\nps1->draw(); // calls Rectangle::draw\n\nShape *ps2 = new\
  \ Ellipse; // fine\nps2->draw(); // calls Ellipse::draw\n\nps1->Shape::draw(); //\
  \ calls Shape::draw\n\nps2->Shape::draw(); // calls Shape::draw\n```\n\nAside from\
  \ helping you impress fellow programmers at cocktail parties, knowledge of this\
  \ feature is generally of limited utility. As you'll see below, however, it can\
  \ be employed as a mechanism for providing a safer-than-usual default implementation\
  \ for simple (impure) virtual functions.\n\nThe story behind simple virtual functions\
  \ is a bit different from that behind pure virtuals. As usual, derived classes inherit\
  \ the interface of the function, but simple virtual functions provide an implementation\
  \ that derived classes may override. If you think about this for a minute, you'll\
  \ realize that:\n\n- The purpose of declaring a simple virtual function is to have\
  \ derived classes inherit a interface as well as a default implementation.\n\nConsider\
  \ the case of `Shape::error`:\n\nClick here to view code image\n\n```cpp\nclass\
  \ Shape {\n\npublic:\n\nvirtual void error(const std::string& msg) ;\n\n...\n\n\
  };\n```\n\n\n\n接口规定每个类都必须支持一个在遇到错误时被调用的函数，但每个类可以自由地以其认为合适的方式来处理错误。如果一个类不想进行任何特殊处理，它可以简单地退回到\
  \ `Shape` 类提供的默认错误处理。也就是说，`Shape::error` 的声明是在告诉派生类的设计者们：“你们必须支持一个 `error` 函数，但如果你不想写自己的版本，可以退回到\
  \ `Shape` 类中的默认版本。”\n\n事实证明，允许简单的虚函数同时指定函数接口和默认实现可能是危险的。为了理解为什么，请考虑一个 XYZ 航空的飞机层级结构。XYZ\
  \ 只有两种飞机：`Model A` 和 `Model B`，并且它们的飞行方式完全相同。因此，XYZ 设计了以下层级结构：\n\n点击查看代码图片\n\n```cpp\n\
  class Airport { ... }; // 代表机场\n\nclass Airplane {\n\npublic:\n    virtual void\
  \ fly(const Airport& destination);\n    ...\n};\n\nvoid Airplane::fly(const Airport&\
  \ destination)\n{\n    // 将飞机飞往给定目的地的默认代码\n}\n\nclass ModelA: public Airplane {\
  \ ... };\nclass ModelB: public Airplane { ... };\n```\n\n为了表达所有飞机都必须支持 `fly` 函数，并考虑到不同型号的飞机在原则上可能需要不同的\
  \ `fly` 实现，因此 `Airplane::fly` 被声明为虚函数。然而，为了避免在 `ModelA` 和 `ModelB` 类中编写相同的代码，默认的飞行行为被作为\
  \ `Airplane::fly` 的主体提供，`ModelA` 和 `ModelB` 都继承了它。\n\n这是一个经典的面向对象设计。两个类共享一个共同特征（它们实现\
  \ `fly` 的方式），因此将共同特征移动到基类中，并由这两个类继承。这种设计使共同特征显式化，避免了代码重复，便于未来的扩展增强，并减轻了长期维护——这些都是面向对象技术备受推崇的原因。XYZ\
  \ 航空应该为此感到自豪。\n\n现在假设 XYZ 业务蒸蒸日上，决定收购一种新型飞机——`Model C`。`Model C` 在某些方面与 `Model A`\
  \ 和 `Model B` 不同。特别是，它的飞行方式不同。\n\nXYZ 的程序员向层级结构中添加了 `Model C` 类，但由于急于让新型号投入使用，他们忘记了重新定义\
  \ `fly` 函数：\n\n点击查看代码图片\n\n```cpp\nclass ModelC: public Airplane {\n    ... // 没有声明\
  \ fly 函数\n};\n```\n\n那么，在他们的代码中，他们有了类似下面的内容：\n\n点击查看代码图片\n\n```cpp\nAirport PDX(...);\
  \ // PDX 是我家附近的机场\n\nAirplane *pa = new ModelC;\n\n...\n\npa->fly(PDX); // 调用了 Airplane::fly!\n\
  ```\n\n这是一场灾难：程序正试图像对待 `ModelA` 或 `ModelB` 一样飞行一个 `ModelC` 对象。这并不是那种能让旅客产生信任的行为。\n\
  \n这里的问题不在于 `Airplane::fly` 具有默认行为，而在于 `ModelC` 在没有显式表示其想要这种该行为的情况下，却被允许继承了该行为。幸运的是，要为派生类提供默认行为很容易，但除非他们要求，否则不提供给他们。诀窍在于切断虚函数的*接口*与其默认*实现*之间的连接。这里有一种实现方法：\n\
  \n点击查看代码图片\n\n```cpp\nclass Airplane {\n\npublic:\n    virtual void fly(const Airport&\
  \ destination) = 0 ;\n    ...\n\nprotected:\n    void defaultFly(const Airport&\
  \ destination);\n};\n\nvoid Airplane::defaultFly(const Airport& destination)\n{\n\
  \    // 将飞机飞往给定目的地的默认代码\n}\n```\n\n注意 `Airplane::fly` 是如何变成一个*纯*虚函数的。这提供了飞行的接口。默认实现也存在于\
  \ `Airplane` 类中，但现在它以一个独立函数 `defaultFly` 的形式存在。想要使用默认行为的 `ModelA` 和 `ModelB` 等类只需在它们的\
  \ `fly` 函数体内部对 `defaultFly` 进行内联调用即可（有关内联和虚函数之间交互的信息，请参阅 Item 30）：\n\n点击查看代码图片\n\
  \n```cpp\nclass ModelA: public Airplane {\n\npublic:\n    virtual void fly(const\
  \ Airport& destination)\n    { defaultFly(destination); }\n    ...\n};\n\nclass\
  \ ModelB: public Airplane {\n\npublic:\n    virtual void fly(const Airport& destination)\n\
  \    { defaultFly(destination); }\n    ...\n};\n```\n\n对于 `ModelC` 类，不存在无意中继承错误\
  \ `fly` 实现的可能性，因为 `Airplane` 中的纯虚函数迫使 `ModelC` 提供它自己的 `fly` 版本。\n\n点击查看代码图片\n\n\
  ```cpp\nclass ModelC: public Airplane {\n\npublic:\n    virtual void fly(const Airport&\
  \ destination);\n    ...\n};\n\nvoid ModelC::fly(const Airport& destination)\n{\n\
  \    // 将 ModelC 飞机飞往给定目的地的代码\n}\n```\n\n这种方案并非无懈可击（程序员可能会让自己陷入麻烦），但它比原始设计更可靠。至于\
  \ `Airplane::defaultFly`，它是受保护的，因为它确实是 `Airplane` 及其派生类的实现细节。使用飞机的客户端只关心它们可以飞行，而不关心如何实现。\n\
  \n同样重要的是，`Airplane::defaultFly` 是一个*非虚*函数。这是因为任何派生类都不应该重定义这个函数，这一点在 Item 36 中讨论。如果\
  \ `defaultFly` 是虚函数，你就会遇到一个循环问题：如果某个派生类在应该重定义时忘记了 `defaultFly` 怎么办？\n\n有些人反对使用不同的函数来提供接口和默认实现，比如\
  \ `fly` 和 `defaultFly`。首先，他们指出，这会让类命名空间充斥大量相关的函数名。然而，他们仍然认为接口和实现应该是分离的。他们如何解决这个看似矛盾的问题呢？利用纯虚函数必须在具体的派生类中重新声明这一事实，但它们也可以有自己的实现。以下是\
  \ `Airplane` 层级结构如何利用定义纯虚函数的方法：\n\n点击查看代码图片\n\n```cpp\nclass Airplane {\n\npublic:\n\
  \    virtual void fly(const Airport& destination) = 0 ;\n    ...\n};\n\nvoid Airplane::fly(const\
  \ Airport& destination) // 一个纯虚函数的实现\n\n{\n    // 将飞机飞往给定目的地的默认代码\n}\n\nclass ModelA:\
  \ public Airplane {\n\npublic:\n    virtual void fly(const Airport& destination)\n\
  \    { Airplane::fly (destination); }\n    ...\n};\n\nclass ModelB: public Airplane\
  \ {\n\npublic:\n    virtual void fly(const Airport& destination)\n    { Airplane::fly\
  \ (destination); }\n    ...\n};\n\nclass ModelC: public Airplane {\n\npublic:\n\
  \    virtual void fly(const Airport& destination);\n    ...\n};\n\nvoid ModelC::fly(const\
  \ Airport& destination)\n{\n    // 将 ModelC 飞机飞往给定目的地的代码\n}\n```\n\n\n\n\n这种设计与之前的几乎完全相同，只是纯虚函数\
  \ `Airplane::fly` 的体取代了独立函数 `Airplane::defaultFly`。从本质上说，`fly` 被拆分成了两个基本组成部分。它的声明指定了它的接口（派生类*必须*使用），而它的定义指定了它的默认行为（派生类*可以*使用，但仅当它们显式请求时才使用）。然而，在合并\
  \ `fly` 和 `defaultFly` 时，你失去了为这两个函数提供不同保护级别的能力：以前受保护的代码（通过包含在 `defaultFly` 中）现在变成了公共的（因为它们现在位于\
  \ `fly` 中）。\n\n最后，我们来看 `Shape` 的非虚函数 `objectID`：\n\n```cpp\nclass Shape {\npublic:\n\
  int objectID() const;\n...\n};\n```\n\n当一个成员函数是非虚的时，它按理不应该在派生类中表现出不同的行为。事实上，非虚成员函数指定了一个*跨特化版本的不不变性*（invariant\
  \ over specialization），因为它标识了某种无论派生类变得多么特化，都不应该改变的行为。因此，\n\n- 声明非虚函数的目的是让派生类继承一个函数*接口以及强制性的实现*。\n\
  \n你可以将 `Shape::objectID` 的声明理解为：“每一个 `Shape` 对象都有一个可以产生对象标识符的函数，而且该对象标识符总是以相同的方式计算的。这种方式由\
  \ `Shape::objectID` 的定义决定，任何派生类都不应该尝试改变它的实现方式。”由于非虚函数标识了跨特化版本的*不不变性*，因此它不应该在派生类中被重新定义，这一点在\
  \ Item 36 中进行了详细讨论。\n\n纯虚函数、简单虚函数和非虚函数声明之间的差异，允许你精确地指定你希望派生类继承的内容：它们分别是仅接口、接口和默认实现，或接口和强制实现。由于这些不同类型的声明意味着从根本上不同的含义，你在声明成员函数时必须在它们之间仔细选择。如果你这样做，就应该避免缺乏经验的类设计师经常犯的两个常见错误。\n\
  \n第一个错误是将所有函数声明为非虚的。这为派生类中的特化没有留下空间；非虚析构函数特别有问题问题（参见 Item 7）。当然，设计一个不打算作为基类的类是完全合理的。在这种情况下，一组完全是非虚的成员函数是合适的。然而，很多时候，此类类的声明要么是因为不知道虚函数和非虚函数之间的区别，要么是因为对虚函数的性能开销有无根据的担忧。事实是，几乎任何要用作基类的类都将拥有虚函数（再次，参见\
  \ Item 7）。\n\n如果你担心虚函数的代价，请允许我引入基于经验的 80-20 原则（另见 Item 30），该法则指出，在一个典型的程序中， 80%\
  \ 的运行时间将花费在执行 20% 的代码上。这条规则很重要，因为这意味着平均而言，你 80% 的函数调用可以是虚函数，而不会对程序的整体性能产生任何微可检测的影响。在你由于担心是否负担得起虚函数代价而愁白头发之前，请采取一个简单的预防措施，确保你正专注于程序中那可能真正产生差异的\
  \ 20% 的代码。\n\n另一个常见问题是将*所有*成员函数都声明为虚函数。有时这是正确的做法——参考 Item 31 中的接口类。然而，这也可以是一个缺乏立场立场的类设计师的标志。某些函数*不应该*在派生类中被重新定义，每当出现这种情况时，你就必须通过将这些函数设为非虚来明确这一点。如果人们只需花时间重新定义你所有的函数，那么假装你的类可以满足所有人的所有需求将对谁都没有好处。如果你有一个跨特化版本的不不变性，不要害怕说出来！\n\
  \n### 需要记忆的事\n\n- 接口的继承与实现的继承不同。在公有继承下，派生类总是继承基类的接口。\n- 纯虚函数指定仅接口的继承。\n- 简单（非纯）虚函数指定接口的继承加上默认实现的继承。\n\
  - 非虚函数指定接口的继承加上强制实现的继承。\n\n### Item 35: 考虑虚函数的替代方案\n\n假设你正在开发一款视频游戏，并为游戏中的角色设计一个层次结构。由于你的游戏属于“砍草放荒”类型，角色受伤或处于健康状况下降状态并不罕见。因此，你决定提供一个成员函数\
  \ `healthValue`，它返回一个表示角色健康状况的整数。由于不同的角色可能以不同的方式计算健康值，将 `healthValue` 声明为虚似乎是设计这些内容的明显方法：\n\
  \n点击此处查看代码图\n\n```cpp\nclass GameCharacter {\npublic:\nvirtual int healthValue()\
  \ const ; // 返回角色健康评分；\n... // 派生类可以重新定义此\n};\n```\n\n`healthValue` 没有声明为纯虚，表明存在计算健康的默认算法（参见\
  \ Item 34）。这确实是设计的明显方法，在某种意义上，这正是它的弱点。因为这种设计太明显了，你可能对其替代方案进行充分考虑。为了帮助你跳出对象设计的窠臼，让我们考虑解决此问题的其他方法。\n\
  \n### 通过非虚接口实现模板方法模式\n\n我们从一种有趣的观点开始，该观点认为虚函数几乎应该是私有的。这种学派的追随者建议，更好的设计是保留 `healthValue`\
  \ 为公共成员函数，但将其变为非虚，并让它调用私有的虚函数来执行实际工作，例如 `doHealthValue`：\n\n点击此处查看代码图\n\n```cpp\n\
  class GameCharacter {\npublic:\nint healthValue() const // 派生类不重新定义\n{ // 此——参见\
  \ Item 36\n... // “之前”的操作——见下文\nint retVal = doHealthValue(); // 执行实际工作\n... //\
  \ “之后”的操作——见下文\nreturn retVal;\n}\n...\nprivate:\nvirtual int doHealthValue() const\
  \ // 派生类可以重新定义此\n{\n... // 计算健康的默认算法\n} // 健康状况\n};\n```\n\n在这段代码（以及本 Item 的其余部分）中，我是在类定义中显示成员函数的体。正如\
  \ Item 30 所解释的，这隐式地将它们声明为 `inline`。我这样显示代码仅仅是为了更容易观察发生的情况。我描述的设计与内联决策无关，因此不要认为成员函数定义在类内部是有意义的。它并不是。\n\
  \n\n\n\n\n这种基础设计——让客户端通过公共非虚成员函数间接调用私有虚函数——被称为`非虚接口 (NVI) 惯用法`。它是更通用的设计模式“模板方法（Template\
  \ Method）”的一种特殊体现（遗憾的是，该模式与 C++ 模板毫无关系）。我将非虚函数（例如 `healthValue`）称为虚函数的`包装器（wrapper）`。\n\
  \nNVI 惯用法的一个优势可以通过代码中的“do 'before' stuff（执行前工作）”和“do 'after' stuff（执行后工作）”注释看出来。这些注释标识了保证在执行实际工作的虚函数之前和之后调用的代码段。这意味着包装器确保了在调用虚函数之前设置了适当的上下文，并在调用结束后清理了上下文。例如，“之前”的工作可以包括锁定互斥量、记录日志条目、验证类不变性和函数前置条件是否满足等。“其后”的工作可以包括解锁互斥量、验证函数后置条件、重新验证类不变性等。如果你让客户端直接调用虚函数，实际上并没有什么好的方法可以做到这一点。\n\
  \n你可能已经想过，NVI 惯用法涉及派生类重新定义私有虚函数——重新定义它们无法调用的函数！这里并没有设计上的矛盾。重新定义虚函数规定了*如何*执行某事，而调用虚函数则规定了*何时*执行某事。这些关注点是独立的。NVI\
  \ 惯用法允许派生类重新定义虚函数，从而让它们对功能实现的*方式*拥有控制权，但基类保留了决定*何时*调用该函数的权利。初看起来这可能很奇怪，但 C++ 关于派生类可以重新定义继承的私有虚函数的规则是完全合理的。\n\
  \n在 NVI 惯用法下，虚函数并不严格要求是私有的。在某些类层次结构中，期望派生类对虚函数的实现调用其基类的对应项（例如第 120 页 上的示例），为了让此类调用合法，虚函数必须是保护的（protected）而不是私有的。有时虚函数甚至必须是公共的（例如多态基类中的析构函数——参见\
  \ 第 7 节），但那时 NVI 惯用法就无法真正应用了。\n\n### 通过函数指针实现策略模式\n\nNVI 惯用法是公共虚函数的一种有趣的替代方案，但从设计的角度来看，它无非是面子工程。毕竟，我们仍然在使用虚函数来计算每个角色的生命值。一个更具戏剧的设计断言应该是：计算角色的生命值与角色的类型无关——这种计算完全不需要是角色的一部分。例如，我们可以要求每个角色的构造函数都传递一个指向健康计算函数的指针，并调用该函数来执行实际计算：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass GameCharacter; // 前向声明\n\n// 用于默认健康计算算法的函数\n\nint\
  \ defaultHealthCalc(const GameCharacter& gc);\n\nclass GameCharacter {\n\npublic:\n\
  \ntypedef int (*HealthCalcFunc)(const GameCharacter&);\nexplicit GameCharacter(HealthCalcFunc\
  \ hcf = defaultHealthCalc )\n: healthFunc(hcf)\n{}\n\nint healthValue() const\n\n\
  { return healthFunc(*this) ; }\n\n...\n\nprivate:\n\nHealthCalcFunc healthFunc;\n\
  \n};\n```\n\n这种方法是另一个常用设计模式——策略（Strategy）的简单应用。与 `GameCharacter` 层次结构中基于虚函数的方法相比，它提供了一些有趣的活性：\n\
  \n- 相同类型角色的不同实例可以不同的健康计算函数。例如：\n\n点击此处查看代码图像\n\n```cpp\nclass EvilBadGuy: public\
  \ GameCharacter {\n\npublic:\n\nexplicit EvilBadGuy(HealthCalcFunc hcf = defaultHealthCalc)\n\
  : GameCharacter(hcf)\n{ ... }\n\n...\n\n};\n\nint loseHealthQuickly(const GameCharacter&);\
  \ // 健康计算\n\nint loseHealthSlowly(const GameCharacter&); // 具有不同\n\n// 行为的函数\n\n\
  EvilBadGuy ebg1 (loseHealthQuickly); // 同一类型的角-\n\nEvilBadGuy ebg2 (loseHealthSlowly);\
  \ // 士具有不同\n\n// 健康相关的\n\n// 行为\n```\n\n- 特定角色的健康计算函数可以在运行时更改。例如，`GameCharacter`\
  \ 可以提供一个成员函数 `setHealthCalculator`，允许替换当前的健康计算函数。\n\n另一方面，健康计算函数不再是 `GameCharacter`\
  \ 层次结构的成员函数这一事实，意味着它对正在计算健康的对象的内部部分没有特殊的访问权限。例如，`defaultHealthCalc`无法访问 `EvilBadGuy`\
  \ 的非公共部分。如果角色的生命值可以完全根据通过角色公共接口可用的信息来计算，那么这不是问题；但如果准确的健康计算需要非公共信息，它就是问题。事实上，当你将类内部的功能（例如通过成员函数）替换为类外的等效功能（例如通过非成员非友函数，或通过另一个类的非友成员函数）时，任何时候都存在这种潜在问题。这个问题将在本节的剩余部分中一直存在，因为我们将考虑的所有其他设计替代方案都涉及类外函数的使用。通常情况下，要解决非成员函数访问类私有部分的需求，只能削弱类的封装性。例如，该类可以将非成员函数声明为友（`friend`），或者为其原本隐藏的部分提供公共访问器函数。使用函数指针代替虚函数的优势（例如每个对象的健康计算函数以及在运行时更改此类函数的能力）是否能抵消对\
  \ `GameCharacter` 封装性的可能需求，需要根据具体设计来决定。\n\n### 通过 `tr1::function` 实现策略模式\n\n一旦你习惯了模板及其隐式接口的使用（参见\
  \ 第 41 节），基于函数指针的方法看起来相当固定。为什么健康计算器必须是一个函数而不是一个像函数一样的东西（例如函数对象）？如果它必须是函数，为什么不能是成员函数？为什么它必须返回\
  \ `int` 而不是任何可以转换为 `int` 的类型？\n\n如果我们将函数指针（如 `healthFunc`）的使用替换为 `tr1::function`\
  \ 类型的对象，这些限制就消失了。正如 第 54 节 所解释的，此类对象可以持有任何可调用实体（即函数指针、函数对象或成员函数指针），其签名与预期兼容。这是我们刚刚看到的设计，这次使用了\
  \ `tr1::function`：\n\n点击此处查看代码图像\n\n```cpp\nclass GameCharacter; // 同上\n\nint defaultHealthCalc(const\
  \ GameCharacter& gc); // 同上\n\nclass GameCharacter {\n\npublic:\n\n// HealthCalcFunc\
  \ 是任何可以与 GameCharacter 兼容类型进行\n// 调用并返回任何与 int 兼容类型的可调用实体；详见见下文\ntypedef std::tr1::function<int\
  \ (const GameCharacter&)> HealthCalcFunc;\n\nexplicit GameCharacter(HealthCalcFunc\
  \ hcf = defaultHealthCalc )\n: healthFunc(hcf)\n{}\n\nint healthValue() const\n\n\
  { return healthFunc(*this); }\n\n...\n\nprivate:\n\nHealthCalcFunc healthFunc;\n\
  \n};\n```\n\n\n\n\n正如你所见，`HealthCalcFunc` 是 `tr1::function` 的实例化类型定义。这意味着它的行为类似于一个通用的函数指针类型。仔细观察\
  \ `HealthCalcFunc` 是什么类型的类型定义：\n\n```cpp\nstd::tr1::function<int (const GameCharacter&)\
  \ >\n```\n\n在这里，我高亮了该 `tr1::function` 实例的“目标签名”。该目标签名是“接受一个 `const GameCharacter&`\
  \ 并返回一个 `int` 的函数”。这种 `tr1::function` 类型的对象（即 `HealthCalcFunc` 类型的对象）可以持有任何与目标签名兼容的可调用实体。兼容意味着\
  \ `const GameCharacter&` 要么是、要么可以转换为该实体的参数的类型，且该实体的返回类型要么是、要么可以隐式转换为 `int`。\n\n\
  与我们上次看到的设计（`GameCharacter` 持有一个指向函数的指针）相比，这种设计几乎是相同的。唯一的区别是 `GameCharacter` 现在持有一个\
  \ `tr1::function` 对象——一个*通用*函数指针。这种变化非常微小，以至于我甚至称它是无关紧要的，但结果是客户端现在在指定健康计算函数时拥有惊人的灵活性：\n\
  \n点击此处查看代码图片\n\n```cpp\nshort calcHealth(const GameCharacter&); // health calculation\n\
  \n// function; note\n\n// non-int return type\n\nstruct HealthCalculator { // 用于健康的类\n\
  \nint operator()(const GameCharacter&) const // calculation function\n\n{ ... }\
  \ // objects\n\n};\n\nclass GameLevel {\n\npublic:\n\nfloat health(const GameCharacter&)\
  \ const; // health calculation\n\n... // mem function; note\n\n}; // non-int return\
  \ type\n\nclass EvilBadGuy: public GameCharacter { // 如之前一样\n\n...\n\n};\n\nclass\
  \ EyeCandyCharacter: public GameCharacter { // 另一个字符\n\n... // type; 假设相同\n\n};\
  \ // 构造函数同于\n\n// EvilBadGuy\nEvilBadGuy ebg1(calcHealth); // 使用函数的字符\n\n// health\
  \ calculation\n// function\nEyeCandyCharacter ecc1(HealthCalculator() ); // 使用对象的字符\n\
  \n// health calculation\n// function object\nGameLevel currentLevel;\n...\n\nEvilBadGuy\
  \ ebg2( // 使用函数的字符\n\nstd::tr1::bind(&GameLevel::health , // health calculation\n\
  \ncurrentLevel, // member function;\n\n_1 ) // 详情见下文\n\n);\n```\n\n就个人而言，我觉得 `tr1::function`\
  \ 让你能做的事情太神奇了，它让我全身颤栗。如果你没有感到颤栗，可能是因为你正盯着 `ebg2` 的定义，疑惑 `tr1::bind` 的调用是怎么回事。请允许我解释一下。\n\
  \n我们想表达，为了计算 `ebg2` 的健康评分，应该使用 `GameLevel` 类中的 `health` 成员函数。现在，`GameLevel::health`\
  \ 是一个声明接收一个参数（`GameCharacter` 的引用）的函数，但它实际上接收两个，因为它还会接收一个隐式的 `GameLevel` 参数——即 `this`\
  \ 指向的那个。然而，`GameCharacter` 的健康计算函数只接受一个参数：要计算健康的 `GameCharacter`。如果我们要用 `GameLevel::health`\
  \ 来计算 `ebg2` 的健康，我们以某种方式“适配”它，使其不再接受两个参数（一个 `GameCharacter` 和一个 `GameLevel`），而是只接受一个（一个\
  \ `GameCharacter`）。在这个示例中，我们总是想使用 `currentLevel` 作为计算 `ebg2` 健康时的 `GameLevel` 对象，因此我们将\
  \ `currentLevel`“绑定”为 `GameLevel` 对象，以便每次调用 `GameLevel::health` 计算 `ebg2` 的健康时使用。这就是\
  \ `tr1::bind` 调的作用：它指定了 `ebg2` 的健康计算函数应该始终使用 `currentLevel` 作为 `GameLevel` 对象。\n\
  \n我跳过了关于 `tr1::bind` 用的许多细节，因为这些细节并不会带来太大的启发，而且会分散我想表达的核心观点的注意力：通过使用 `tr1::function`\
  \ 而不是函数指针，我们允许客户端在计算角色健康时使用*任何兼容的可调用实体*。这难道不酷吗？\n\n### “经典”策略模式\n\n如果你更热衷于设计模式而不是\
  \ C++ 的酷炫特性，那么策略模式的一种更传统方法是将健康计算函数作为一个独立的健康计算层级结构中的虚成员函数。生成的层级结构设计如下：\n\n![images](img/Image00011.gif)\n\
  \n如果你不熟悉 UML 表示，这仅仅表示 `GameCharacter` 是一个继承层级的根，其中 `EvilBadGuy` 和 `EyeCandyCharacter`\
  \ 是派生类；`HealthCalcFunc` 是另一个继承层级的根，派生类为 `SlowHealthLoser` 和 `FastHealthLoser`；每个\
  \ `GameCharacter` 类型的对象都包含一个指向 `HealthCalcFunc` 层级中对象的指针。\n\n这是对应的代码骨架：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass GameCharacter; // 前向声明\n\nclass HealthCalcFunc {\n\npublic:\n\n\
  ...\n\nvirtual int calc(const GameCharacter& gc) const\n\n{ ... }\n\n...\n\n};\n\
  \nHealthCalcFunc defaultHealthCalc;\n\nclass GameCharacter {\n\npublic:\n\nexplicit\
  \ GameCharacter(HealthCalcFunc *phcf = &defaultHealthCalc)\n: pCalc(phcf)\n{}\n\n\
  int healthValue() const\n\n{ return pCalc->calc(*this); }\n\n...\n\nprivate:\n\n\
  HealthCalcFunc *pCalc;\n\n};\n```\n\n这种方法对于熟悉策略模式的人来说是容易识别的，而且通过向 `HealthCalcFunc`\
  \ 层级添加派生类，就可以调整健康算法。\n\n### 总结\n\n本节的核心建议是在为你要的问题寻找设计时，考虑虚函数的替代方案。这里是对我们过的替代方案的快速回顾：\n\
  \n- 使用**非虚接口**（NVI 模式），这是模板方法模式的一种形式，封装了可访问的虚成员函数。\n- 使用**函数指针成员变量**替换虚函数，这是策略模式的精简版实现。\n\
  - 使用**`tr1::function` 成员变量**替换虚函数，从而允许任何与你需求签名兼容的可调用实体。这同样是策略模式的一种形式。\n- 将一个层级结构中的虚函数替换为**另一个层级结构中的虚函数**。这是策略模式的传统实现。\n\
  \n这个列表并不是虚函数替代方案的穷尽，但它足以说服你*存在*替代方案。此外，它们的优缺点对比清楚地说明了你*应该*考虑它们。\n\n避免陷入面向对象设计道路的条车里，偶尔用力转一下方向盘。还有许多其他道路值得花时间去研究。\n\
  \n### 需要记住的事项\n\n- 虚函数的替代方案包括 NVI 模式和各种形式的策略模式。\n- 将功能从成员函数移动到类外的缺点是，成员函数无法访问类的私有成员。\n\
  - `tr1::function` 对象的作用类似于通用函数指针。此类对象支持所有与给定签名兼容的可调用实体。\n\n### Item 36：永远不要重定义继承的非虚函数\n\
  \n假设我告诉你类 `D` 公共派自类 `B`，并且类 `B` 中定义了一个公共成员函数 `mf`。`mf` 的参数和返回值并不重要，所以我们就假设它们都是 `void`\
  \ 。换句话说，我是这样的：\n\n```cpp\nclass B {\n\npublic:\n\nvoid mf();\n\n...\n\n};\n\nclass\
  \ D: public B { ... };\n```\n\n即使我们不知道 `B`、`D` 或 `mf` 的任何信息，给定一个类型为 `D` 的对象 `x`，\n\
  \n```cpp\nD x; // x 是一个类型为 D 的对象\n```\n\n\n\n如果下面的情况与这种情况不同，你可能会感到非常惊讶：\n\n点击此处查看图片\n\
  \n```cpp\nB *pB = &x; // get pointer to x\n\npB->mf(); // call mf through pointer\n\
  ```\n\n这里的“这种”指的是：\n\n点击此处查看图片\n\n```cpp\nD *pD = &x; // get pointer to x\n\npD->mf();\
  \ // call mf through pointer\n```\n\n这是因为在上述两种情况下，你都是在对象 `x` 上调用成员函数 `mf`。由于在两种情况下调用的都是同一个函数和同一个对象，它们的行为应该是一致的，对吧？\n\
  \n没错，本应该是这样的。但事实可能并非如此。特别是当 `mf`是非虚函数且 `D` 定义了它自己的 `mf` 版本时，情况就会变成这样：\n\n点击此处查看图片\n\
  \n```cpp\nclass D: public B {\npublic:\n    void mf(); // hides B::mf; see Item\
  \ 33\n    ...\n};\n\npB->mf(); // calls B::mf\n\npD->mf(); // calls D::mf\n```\n\
  \n这种双面行为的原因是，非*虚函数*（如 `B::mf` 和 `D::mf`）是静态绑定的（参见 Item 37）。这意味着由于 `pB` 被声明为指向 `B`\
  \ 的指针类型，通过 `pB` 调用的非虚函数*总是*是为类 `B`定义的那些，即使 `pB` 指向的是一个派生自 `B` 的类的对象（如本例所示）。\n\n\
  相反，*虚函数*函数是动态绑定的（再次参见 Item 37），所以它们不会遇到这个问题。如果 `mf` 是一个虚函数，那么通过 `pB` 或 `pD` 调用 `mf`\
  \ 都会导致调用 `D::mf`，因为 `pB` 和 `pD` *真正*指向的是一个类型为 `D` 的对象。\n\n如果你正在编写类 `D` 并重新定义继承自类\
  \ `B` 的非虚函数 `mf`，那么 `D` 对象可能会表现出不一致的行为。特别是，当调用 `mf` 时，任何给定的 `D` 对象可能表现得像 `B` 也像\
  \ `D`，而决定因素与对象本身无关，而是取决于指向它的指针的声明类型。引用也表现出与指针同样困惑的行为。\n\n但这仅仅是一个务实的论点。我知道，你真正想要的是某种关于不重定义继承的非虚函数的理论证明依据。我很乐意为你提供。\n\
  \nItem 32 解释了公有继承意味着“是一个（is-a）”，而 Item 34 描述了为什么在类中声明非虚函数会为该类建立一个跨特化的不变性（invariant\
  \ over specialization）。如果你将这些观察应用于类 `B` 和 `D` 以及非虚成员函数 `B::mf`，那么：\n\n* 所有适用于 `B`\
  \ 对象的规则也适用于 `D` 对象，因为每个 `D` 对象都是一个 `B` 对象；\n* 派生自 `B` 的类必须同时继承 `mf` 的接口*和*实现，因为\
  \ `mf` 在 `B` 中是非虚的。\n\n现在，如果 `D` 重新定义了 `mf`，那么你的设计中就存在矛盾。如果 `D` *真的*需要以不同于 `B` 的方式实现\
  \ `mf`，并且每个 `B` 对象——无论如何特化——*真的*必须使用 `B` 的 `mf` 实现，那么“每个 `D` 都是一个 `B`”这一说法就不成立了。在这种情况下，`D`\
  \ 不应该公有继承自 `B`。另一方面，如果 `D` *真的*必须公有继承自 `B`，并且 `D` *真的*需要以不同于 `B` 的方式实现 `mf`，那么“`mf`\
  \ 反映了 `B` 跨特化的不变性”这一说法就不成立了。在这种情况下，`mf` 应该是虚函数。最后，如果每个 `D` *真的*都是一个 `B`，并且 `mf`\
  \ *真的*对应于 `B` 跨特化的不变性，那么 `D` 就不可能真的需要重新定义 `mf`，它也不应该尝试这样做。\n\n无论哪种论点适用，都必须有所妥协，而在任何情况下，这种妥协都不是禁止重新定义继承的非虚函数。\n\
  \n如果阅读这一 Item 让你感到*熟悉（déjà vu）*，可能是因为你已经读过 Item 7，它解释了为什么多态基类中的析构函数应该是虚函数。如果你违反了这一准则（即如果你在多态基类中声明了一个非虚析构函数），你也将违反了这一准则，因为派生类将不可避免地重新定义一个继承的非虚函数：基类的析构函数。即使……（原文此处截断）\n\
  \n*(注：提供的文本在结尾似乎有重复/截断；我已根据您的规则对提供的内容进行了逻辑格式化处理。）)*\n\n\n\n这些都是老生常调了，我知道；你一定理解虚函数。转折出现在当你考虑带有默认参数值的虚函数时，因为正如我上面说的，虚函数是动态绑定的，而默认参数是静态绑定的。这意味着你最终可能会调用一个定义在`派生类`中的虚函数，但使用的却是来自`基类`的默认参数值：\n\
  \n```cpp\npr->draw(); // 调用了 Rectangle::draw(Shape::Red)!\n```\n\n在这种情况下，`pr` 的动态类型是\
  \ `Rectangle*`，所以调用了 `Rectangle` 的虚函数，正如你预期的的一样。在 `Rectangle::draw` 中，默认参数值是 `Green`。然而，由于\
  \ `pr` 的静态类型是 `Shape*`，该函数调用的默认参数值来自于 `Shape` 类，而不是 `Rectangle` 类！结果是调用了一个由 `Shape`\
  \ 类和 `Rectangle` 类中的 `draw` 声明构成的奇异且几乎肯定是意料之外的组合。\n\n`ps`、`pc` 和 `pr` 是指针这一事实在 particular\
  \ 中无关紧。如果它们是引用，问题依然存在。唯一重要的点是 `draw` 是一个虚函数，且它的一个默认参数值在派生类中被重新定义了。\n\n为什么 C++ 坚持要以这种反常的方式运行？答案与运行时效率有关。如果默认参数值是动态绑定的，编译器将必须想办法在运行时确定虚函数参数的适当默认值，这比目前在编译期间确定它们的机制要慢得多且复杂得多。这个决定是为了倾向于速度和实现的简单性而做的，结果就是你现在享受的是高效的执行行为，但如果你不听从本条款的建议，这种行为将是困惑的。\n\
  \n这固然很好，但看看如果你尝试既遵循这条规则，又为基类和派生类的用户提供默认参数值，会发生什么：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ Shape {\npublic:\n    enum ShapeColor { Red, Green, Blue };\n    virtual void\
  \ draw(ShapeColor color = Red ) const = 0;\n...\n};\n\nclass Rectangle: public Shape\
  \ {\npublic:\n    virtual void draw(ShapeColor color = Red ) const;\n...\n};\n```\n\
  \n哦呀，代码重复。更糟糕的是，带有依赖关系的代码重复：如果在 `Shape` 中更改了默认参数值，所有重复该值的派生类也必须随之更改。否则，它们最终将重新定义一个继承而来的默认参数值。该怎么办？\n\
  \n当你难以让一个虚函数按照你想要的方式工作时，考虑替代设计是明智的，而条目 35 充满了虚函数的替代方案。其中一种替代方案是`非虚接口惯用法`（NVI 惯用法）：在基类中有一个公有的非虚函数，该函数调用一个派生类可以被重新定义的私有虚函数。在这里，我们让非虚函数指定默认参数，而让虚函数执行实际工作：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Shape {\npublic:\n    enum ShapeColor { Red, Green,\
  \ Blue };\n    void draw(ShapeColor color = Red) const // 现在是非虚的\n    {\n      \
  \  doDraw(color); // 调用了虚函数\n    }\n...\nprivate:\n    virtual void doDraw(ShapeColor\
  \ color) const = 0; // 实际工作在\n}; // 在此函数中完成\n\nclass Rectangle: public Shape {\n\
  public:\n...\nprivate:\n    virtual void doDraw (ShapeColor color) const; // 注意缺少\n\
  ... // 默认参数值。\n};\n```\n\n由于非虚函数永远不应该被派生类重写（参见条目 36），这种设计明确了 `draw` 的 `color` 参数的默认值应该始终是\
  \ `Red`。\n\n### 需要记住的事\n\n\n\n-   永远不要重新定义继承的默认参数值，因为默认参数值是静态绑定的，而虚函数——你唯一应该覆盖的函数——是动态绑定的。\n\
  \n### 条目 38：通过组合实现“拥有”或“基于...实现”\n\n`组合`（`Composition`）是当一种类型的对象包含另一种类型的对象时，类型之间产生的关系。例如：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Address { ... }; // 某人的住所\nclass PhoneNumber { ...\
  \ };\nclass Person {\npublic:\n...\nprivate:\n    std::string name; // 组合对象\n  \
  \  Address address; // 也是\n    PhoneNumber voiceNumber; // 也是\n    PhoneNumber faxNumber;\
  \ // 也是\n};\n```\n\n在这个示例中，`Person` 对象由 `string`、`Address` 和 `PhoneNumber` 对象组成。在程序员中，`组合`一词有许多同义词。它也被称为`分层（layering）、包含（containment）、聚合（aggregation）和嵌入（embedding）`。\n\
  \n条目 32 解释了公继承意味着“是”。组合也有含义。实际上，它有两层含义。组合意味着要么是“拥有”，要么“基于...实现”。这是因为你在软件中处理的是两个不同的领域。你程序中的某些对象对应于你所建模世界中的事物。你程序中的某些对象对应于你所建模世界中的事物，例如人、车辆、视频帧。这些对象属于应用领域。其他对象是纯粹的实现制品，例如缓冲区、互斥锁、搜索树。这些对象对应于你的实现领域。当组合发生在应用领域之间时，它表示“拥有”关系。当它发生在实现领域时，它表示基于...实现。上面的\
  \ `Person` 类演示了“拥有”关系。一个 `Person` 对象拥有名字、地址、电话和传真。你不会说人*是*名字或人*是*地址。你会说人*拥有*名字并*拥有*地址。大多数人对这种区别不大，因此“是”和“拥有”之间的混淆并不常见。\n\
  \n稍微困难的是“是”和“基于...实现”的区别。例如，假设你需要一个表示小对象集合的模板，即不重复的集合。因为重用是件好事，你的第一直觉是使用标准库的 `set`\
  \ 模板。既然有了现成的模板，为什么要写一个新的呢？\n\n遗憾的是，`set` 的实现通常每个元素会有三个指针的开销。这是因为 `set` 通常实现为平衡搜索树，这使得它们能够保证对数的查找、插入和删除。当速度比空间更重要时，这是一个合理的设计，但事实证明对于你的应用来说，空间比速度更重要。因此，标准库的\
  \ `set` 对你提供了错误的权衡。看来你最终还是需要编写自己的模板。\n\n\n\n目前一切看起来都正常，但实际上存在相当严重的问题。正如 Item 32\
  \ 所解释的，如果 `D` 是 `B`（is-a），那么对于 `B` 的所有特性也适用于 `D`。然而，`list` 对象可能包含重复项，因此如果将值 3051\
  \ 插入 `list<int>` 两次，该列表将包含两个 3051 的副本。相比之下，`Set` 可能不包含重复项，因此如果将值 3051 插入 `Set<int>`\
  \ 两次，该集合只包含一个该值的副本。因此，说 `Set` 是 `list`（is-a）是不准确的，因为某些适用于 `list` 对象的属性并不适用于 `Set`\
  \ 对象。\n\n由于这两个类之间的关系不是“is-a”，因此公有继承是建模这种关系的错误方法。正确的方法是意识到 `Set` 对象可以基于 `list` 对象来实现\
  \ de：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<class T> // 使用 list 实现 Set 的正确方法\n\nclass\
  \ Set {\n\npublic:\nbool member(const T& item) const;\nvoid insert(const T& item);\n\
  void remove(const T& item);\nstd::size_t size() const;\n\nprivate:\nstd::list<T>\
  \ rep; // Set 数据的表示\n};\n```\n\n`Set` 的成员函数可以很大程度上依赖 `list` 以及标准库其他部分提供的功能，因此只要你熟悉\
  \ STL 编程的基础知识，实现起来就是非常直接的：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nbool Set<T>::member(const\
  \ T& item) const\n{\n    return std::find(rep.begin(), rep.end(), item) != rep.end();\n\
  }\n\ntemplate<typename T>\nvoid Set<T>::insert(const T& item)\n{\n    if (!member(item))\
  \ rep.push_back(item);\n}\n\ntemplate<typename T>\nvoid Set<T>::remove(const T&\
  \ item)\n{\n    typename std::list<T>::iterator it = // 参见 Item 42 获取信息\n    std::find(rep.begin(),\
  \ rep.end(), item); // 这里的 \"typename\"\n    if (it != rep.end()) rep.erase(it);\n\
  }\n\ntemplate<typename T>\nstd::size_t Set<T>::size() const\n{\n    return rep.size();\n\
  }\n```\n\n这些函数足够简单，可以作为内联（inlining）的合理候选，尽管我知道你在做出任何定的内联决定之前，想先回顾 Item 30 中的讨论。\n\
  \n有人可能会认为，如果 `Set` 遵循 STL 容器约定，其接口将更符合 Item 18 的告诫，即设计易于正确使用且难以错误使用的接口。但在此处遵循这些约定将需要向\
  \ `Set` 中添加大量内容，这会模糊它与 `list` 之间的关系。由于这种关系是本条目的重点，我们将牺牲 STL 兼容性来换教学上的清晰度。此外，关于 `Set`\
  \ 接口的细枝节不应掩盖 `Set` 中不争疑的正确之处：它与 `list` 之间的关系。这种关系不是 is-a（尽管最初看起来可能是），而是“基于……实现”（is-implemented-in-terms-of）。\n\
  \n### 需要记住的物品\n\n- 组合（Composition）的含义与公有继承的完全不同。\n- 在应用领域中，组合意味着“拥有”（has-a）。在实现领域中，它意味着“基于……实现”（is-implemented-in-terms-of）。\n\
  \n### Item 39: 审慎使用私有继承\n\nItem 32 证明了 C++ 将公有继承视为一种 is-a 关系。它通过展示这一点来实现：当编译器给定一个\
  \ `Student` 类公有继承自 `Person` 类的层次结构时，当函数调用成功需要时，它会隐式地将 `Student` 转换为 `Person`。值得重复该示例的一部分，但使用私有继承代替公有继承：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Person { ... };\nclass Student: private Person { ...\
  \ }; // 继承现在是私有的\n\nvoid eat(const Person& p); // 任何人都可以\nvoid study(const Student&\
  \ s); // 只有学生可以学习\n\nPerson p; // p 是一个 Person\nStudent s; // s 是一个 Student\n\n\
  eat(p); // 没问题，p 是一个 Person\neat(s); // 错误！Student 不是 Person\n```\n\n显然，私有继承并不意味着\
  \ is-a。那么它意味着什么呢？\n\n“哇！”你说道，“在我们讨论含义之前，让我们先看看行为。私有继承的行为是怎样的？” 嗯，你刚刚在操作中看到的指导私有继承的第一条规则：与公有继承相反，编译器通常不会将派生类对象（如\
  \ `Student`）转换为基类对象。第二条规则是，基类的保护成员将变为派生类的私有成员，即使它们在基类中是保护的。这引出了含义。私有继承意味着“基于……实现”（is-implemented-in-terms-of）。\n\
  \n私有继承意味着“基于……实现”这一事实有点令人不安，因为 Item 38 指出组合可能意味着相同的意思。你该如何在它们之间做出选择呢？答案很简单：只要可能就使用组合，在必须使用的情况下使用私有继承。什么时候必须使用呢？主要是当保护成员和/或虚函数出现时，尽管也有一个由于空间考虑可能使天平倾向于私有继承的边缘情况。我们稍后会考虑这个边缘情况。毕竟，这只是边缘情况。\n\
  \n假设我们正在开发一个涉及 `Widget` 的应用程序，并且决定需要更好地了解 `Widget` 是如何使用的。例如，我们不仅想知道 `Widget` 成员函数被调用的频率，还想知道调用比例如何随时间变化。具有不同执行阶段的程序在不同阶段会有不同的行为特征。例如，编译器在解析阶段使用的函数与在优化和代码生成阶段使用的函数大不相同。\n\
  \n我们决定修改 `Widget` 类以跟踪每个成员函数被调用的次数。在运行时，我们将定期检查这些信息，可能结合每个 `Widget` 的值以及我们认为有用的其他数据。为了实现这一功能，我们需要设置某种定时器，以便我们知道何时该收集统计数据。\n\
  \n倾向于重用现有代码而非新代码，我们在实用工具箱中翻找，并幸运发现了以下类：\n\n点击此处查看代码图像\n\n```cpp\nclass Timer {\n\
  public:\nexplicit Timer(int tickFrequency);\nvirtual void onTick() const; // 每次计时时自动调用\n\
  \n...\n};\n```\n\n这正是我们需要的。`Timer` 对象可以配置为我们所需的任何频率进行计时，每次计时，它都会调用一个虚函数。我们可以重新定义该虚函数，让它检查当前\
  \ `Widget` 世界的状态。完美！\n\n\n\n\n为了让 `Widget` 能够重新定义 `Timer` 中的虚函数，`Widget` 必须继承自 `Timer`。但在这种情况下，公继承是不合适的。`Widget`\
  \ 是一个 `Timer` 并不是事实。`Widget` 的调用者不应该能够在 `Widget` 上调用 `onTick`，因为这并不是概念上 `Widget`\
  \ 接口的一部分。允许这种函数调用会使调用者错误地使用 `Widget` 接口，这显然违反了 Item 18 中“使接口易于正确使用且难以错误使用”的建议。在这里，公继承不是一个有效选项。\n\
  \n因此，我们采用私有继承：\n\n点击此处查看代码图片\n\n```cpp\nclass Widget: private Timer {\nprivate:\n\
  \    virtual void onTick() const; // 查看 Widget 使用数据，等\n    ...\n};\n```\n\n由于私有继承，`Timer`\
  \ 的公共 `onTick` 函数在 `Widget` 中变为私有，我们在重新声明它时也保持了私有。同样，将 `onTick` 放在公共接口中会误导调用者认为他们可以调用它，这会违反\
  \ Item 18。\n\n这是一个很好的设计，但值得注意的是，私有继承并非严格必须。如果我们下意使用组合，我们也可以这样做。我们只需要在 `Widget` 内部声明一个私有嵌套类，该类公继承自\
  \ `Timer`，在其中重新定义 `onTick`，并在 `Widget` 内部放置一个该类型的对象。以下是该方法的草图：\n\n点击此处查看代码图片\n\n\
  ```cpp\nclass Widget {\nprivate:\n    class WidgetTimer: public Timer {\n    public:\n\
  \        virtual void onTick() const;\n        ...\n    };\n    WidgetTimer timer;\n\
  \    ...\n};\n```\n\n![images](img/Image00013.gif)\n\n这种设计比仅使用私有继承的设计要复杂，因为它同时涉及了（公有的）继承和组合，并且引入了一个新类（`WidgetTimer`）。老实说，我展示它主要是为了提醒你，解决设计问题的方法不止一种，而且训练自己考虑多种方法是值得的（另见\
  \ Item 35）。尽管如此，我想到了两个你可能更倾向于使用公继承加组合而非私有继承的理由。\n\n**第一**，你可能希望设计 `Widget` 以允许派生类，但同时也可能想防止派生类重新定义\
  \ `onTick`。如果 `Widget` 继承自 `Timer`，这是不可能的，即使继承是私有的也是如此。（回想 Item 35，派生类即使不被允许调用虚函数，也可以重新定义它们。）但如果\
  \ `WidgetTimer` 在 `Widget` 中是私有的且继承自 `Timer`，那么 `Widget` 的派生类无法访问 `WidgetTimer`，因此无法继承它或重新定义其虚函数。如果你用过\
  \ Java 或 C#，并怀念防止派生类重新定义虚函数的能力（即 Java 的 `final` 方法和 C# 的 `sealed` 方法），现在你已经知道如何在\
  \ C++ 中近似实现这种行为了。\n\n**第二**，你可能希望尽量减少 `Widget` 的编译依赖。如果 `Widget` 继承自 `Timer`，那么在编译\
  \ `Widget` 时必须让 `Timer` 的定义可用，因此定义 `Widget` 的文件可能需要 `#include Timer.h`。另一方面，如果将\
  \ `WidgetTimer` 移出 `Widget` 且 `Widget` 只包含一个指向 `WidgetTimer` 的指针，那么 `Widget` 只需对\
  \ `WidgetTimer` 类进行简单声明即可；它不需要 `#include` 任何与 `Timer` 相关的内容。对于大型系统，这种解耦是非常重要的。（关于减少编译依赖的细节，请参阅\
  \ Item 31。）\n\n我之前提到过，私有继承主要用于当潜在的派生类想要访问潜在基类的保护部分，或者想要重新定义其一个或多个虚函数，但类之间的概念关系是“通过……实现”（is-implemented-in-terms-of）而非“是”（is-a）。然而，我也提到过涉及空间优化的边缘情况，这可能会让你倾向于使用私有继承而非组合。\n\
  \n这个边缘情况确实棘手：它仅适用于当你处理一个不包含数据的类时。这种类没有非静态数据成员；没有虚函数（因为此类函数的存在会为每个对象添加 `vptr` ——\
  \ 参见 Item 7）；且没有虚基类（因为此类基类也会产生尺寸开销 —— 参见 Item 40 ）。从概念上说，这种*空类*的对象不应该占用任何空间，因为没有需要存储的每个对象的数据。然而，C++\
  \ 规定空立对象必须具有非零大小是出于技术原因，所以如果你这样做：\n\n点击此处查看代码图片\n\n```cpp\nclass Empty {}; // 没有数据，所以\
  \ Empty 对象\n\nclass HoldsAnInt { // 需要内存\nprivate:\n    int x;\n    Empty e; //\
  \ 成员需要内存\n};\n```\n\n你会发现 `sizeof(HoldsAnInt) > sizeof(int)`；因为对齐要求（参见 Item 50 ）可能会导致编译器为\
  \ `HoldsAnInt` 这样的类添加填充，因此 `HoldsAnInt` 的大小可能会增加到容纳第二个 `int` 的程度。（在我测试的所有编译器中都是如此。）这种限制并不适用于派生对象的基类部分，因为它们不是空立的。如果你*继承*\
  \ `Empty` 而不是包含该类型的对象：\n\n```cpp\nclass HoldsAnInt: private Empty {\nprivate:\n\
  \    int x;\n};\n```\n\n你几乎可以确定 `sizeof(HoldsAnInt) == sizeof(int)`。这被称为空基优化（EBO），我测试的所有编译器都实现了它。如果你是一个对空间的库开发者，EBO\
  \ 是值得知道的。值得注意的是，EBO 在单继承下通常是可行的。由于 C++ 对象布局的规则通常意味着 EBO 不能应用于具有多个基类的派生类。\n\n在实践中，“空”类并不是真的空的。虽然它们从没有非静态数据成员，但通常包含类型定义、枚举、静态数据成员或非虚函数。STL\
  \ 有许多技术上是空的类，包含了有成员（通常是类型定义），包括基类 `unary_function` 和 `binary_function`，自定义函数对象通常继承自这些类。得益于\
  \ EBO 的广泛实现，这种继承很少增加继承类的大小。\n\n尽管如此，让我们回到基础。大多数类都不是空的，因此 EBO 很少是私有继承的正当理由。此外，绝大多数继承对应于“is-a”，那是公继承的工作，而不是私有继承。组合和私有继承都意味着“通过……实现”，但组合更易于理解，所以只要可能就应该使用它。\n\
  \n\n\n当你处理两个之间没有“自自”（is-a）关系的类时，如果其中一个类需要访问另一个类的保护成员，或者需要重新定义其一个或多个虚函数，那么私有继承可能是一种合理的设计策略。即使在这种情况下，我们也看到，公继承和组合的混合通常也能产生你想要的行为，尽管设计复杂性更大。审慎地（`judiciously`）私有继承意味着在考虑了所有替代方案后，它是表达软件中两个类之间关系的最佳方式。\n\
  \n### 需要记住的\n\n- 私有继承意味着“用……实现”（`is-implemented-in-terms of`）。它通常优于组合，但当派生类需要访问基类的保护成员，或需要重新定义继承的虚函数时，它是有意义的。\n\
  - 与组合不同，私有继承可以启用空基类优化（empty base optimization）。这对于力求最小对象大小的库开发者来说可能是重要的。\n\n###\
  \ Item 40：审慎地使用多重继承\n\n涉及到多继承（`MI`）时，C++ 社区很大程度上分为两个阵营。一个阵营认为，如果单继承（`SI`）是好的，那么多重继承一定更好。另一个阵营认为，单继承是好的，但多重继承并不值得麻烦。在本节中，我们的首要目标是理解对\
  \ `MI` 问题的两种观点。\n\n首先要认识的一点是，当 `MI` 进入设计领域时，可能会从多个基类继承相同的名称（例如，函数、类型定义等）。这引入了新的歧义机会。例如：\n\
  \n点击此处查看代码图片\n\n```cpp\nclass BorrowableItem { // 库允许你借用的东西\n\npublic:\n\nvoid checkOut\
  \ (); // 从图书馆借出该物品\n\n...\n};\n\nclass ElectronicGadget {\nprivate:\nbool checkOut\
  \ () const; // 执行自检，返回结果\n... // 测试成功\n};\n\nclass MP3Player: // 注意这里的 MI\n\npublic\
  \ BorrowableItem , // (有些库会借出 MP3 播放器)\n\npublic ElectronicGadget\n{ ... }; // 类定义并不重要\n\
  \nMP3Player mp;\n\nmp.checkOut (); // 歧义！哪一个 checkOut?\n```\n\n注意，在这个示例中，对 `checkOut`\
  \ 的调用是歧义的，尽管两个函数中只有一个是可以访问的（`checkOut` 在 `BorrowableItem` 中是公有的，但在 `ElectronicGadget`\
  \ 中是私有的）。符合 C++ 解析重载函数调用的规则：在确定函数是否可用之前，C++ 首先识别与调用最匹配的函数。它只在找到最佳匹配函数后才检查可访问性。在这种情况下，名称\
  \ `checkOut` 在名称查找期间是歧义的，因此既没有发生函数重载解析，也没有进行最佳匹配确定。因此，从没有检查 `ElectronicGadget::checkOut`\
  \ 的访问性。\n\n要解决歧义，你必须指定调用哪个基类的函数：\n\n```cpp\nmp.BorrowableItem:: checkOut(); // 哦，那个\
  \ checkOut...\n```\n\n也可以尝试显式调用 `ElectronicGadget::checkOut`，但这样歧义错误会被“你正尝试调用私有成员函数”的错误所取代。\n\
  \n多继承仅意味着继承自多个基类，但在具有高级基类的层次结构中发现 `MI` 也并不罕见。这会导致所谓的“致命多继承菱形”（deadly MI diamond）\n\
  \n点击此处查看代码图片\n\n```cpp\nclass File { ... };\n\nclass InputFile: public File { ...\
  \ };\n\nclass OutputFile: public File { ... };\n\nclass IOFile: public InputFile,\n\
  \npublic OutputFile\n{ ... };\n```\n\n![images](img/Image00014.gif)\n\n当你在基类和派生类之间拥有多条路径的继承层次结构（例如上面的\
  \ `File` 和 `IOFile` 之间，它们通过 `InputFile` 和 `OutputFile` 路径），你就必须面对这个问题：你是否希望基类中的数据成员在每个路径中都被复制。例如，假设\
  \ `File` 类有一个数据成员 `fileName`。`IOFile` 应该拥有多少个该字段的拷贝？一方面，它从它的每个基类中继承了一个拷贝，这表明 `IOFile`\
  \ 应该有两个 `fileName` 数据成员。另一方面，简单的逻辑告诉我们，一个 `IOFile` 对象只有一个文件名，因此它通过两个基类继承的 `fileName`\
  \ 字段不应该被复制。\n\nC++ 对此争论不持立场。它乐于支持两种方案，尽管它的默认是执行复制。如果这不是你想要的，你必须将带有数据的类（即 `File`）变为虚基类（`virtual\
  \ base class`）。要做到这一点，所有直接继承自它的类都使用虚继承（`virtual inheritance`）：\n\n点击此处查看代码图片\n\n\
  ```cpp\nclass File { ... };\n\nclass InputFile: virtual public File { ... };\n\n\
  class OutputFile: virtual public File { ... };\n\nclass IOFile: public InputFile,\n\
  \npublic OutputFile\n{ ... };\n```\n\n![images](img/Image00015.gif)\n\n标准 C++ 包含一个类似的\
  \ `MI` 层次结构，只是类是类模板，且名称为 `basic_ios`、`basic_istream`、`basic_ostream` 和 `basic_iostream`而不是\
  \ `File`、`InputFile`、`OutputFile` 和 `IOFile`。\n\n`IPerson` 客户端必须基于 `IPerson` 指针和引用编程，因为抽象类不能实例化。为了创建可以作为\
  \ `IPerson` 对象操作的对象，`IPerson` 客户端使用工厂函数（再次，参见 Item 31 ）来实例化派自 `IPerson` 的具体类：\n\n\
  \n\n\n\n点击此处查看代码图像\n\n```cpp\n// 根据唯一的数据库 ID 创建 Person 对象的工厂函数；\n\n// 参见 Item 18\
  \ 了解为什么返回类型不是裸指针\nstd::tr1::shared_ptr<IPerson> makePerson(DatabaseID personIdentifier);\n\
  \n// 从用户处获取数据库 ID 的函数\nDatabaseID askUserForDatabaseID();\n\nDatabaseID id(askUserForDatabaseID());\n\
  \nstd::tr1::shared_ptr<IPerson> pp(makePerson(id)); // 创建一个对象\n\n// 支持\n// IPerson\
  \ 接口\n... // 通过\n// IPerson 的成员\n// 函数操作 *pp\n```\n\n但是 `makePerson` 又是如何创建它所返回的指针所指向的对象的呢？显然，必须有一个派生自\
  \ `IPerson` 的具体类可以被 `makePerson` 实例化。\n\n假设这个类 own 为 `CPerson`。作为一个具体类，`CPerson`\
  \ 必须为它继承自 `IPerson` 的纯虚函数提供实现。它可以从头开始编写这些函数，但最好利用现有的、已经完成了大部分或全部所需的组件。例如，假设一个旧的特定于的类\
  \ `PersonInfo` 提供了 `CPerson` 所需的核心：\n\n点击此处查看代码图像\n\n```cpp\nclass PersonInfo {\n\
  public:\n    explicit PersonInfo(DatabaseID pid);\n    virtual ~PersonInfo();\n\
  \    virtual const char * theName() const;\n    virtual const char * theBirthDate()\
  \ const;\n    ...\nprivate:\n    virtual const char * valueDelimOpen() const; //\
  \ 参见\n    virtual const char * valueDelimClose() const; // 下文\n    ...\n};\n```\n\
  \n你可以看出这是一个旧类，因为它的成员函数返回的是 `const char*` 而不是 `string` 对象。尽管如此，如果合适的话，为什么不用它呢？该类成员函数的命名暗示了结果可能会非常合用。\n\
  \n你发现 `PersonInfo` 的设计是为了方便以各种格式打印数据库字段，每个字段值的开始和结束由特殊字符串分隔。默认情况下，字段值的开启和结束分隔符是方括号，因此字段值“Ring-tailed\
  \ Lemur”将按如下格式化：\n\n[Ring-tailed Lemur]\n\n考虑到 `PersonInfo` 的客户端并不总是想要方括号，虚函数 `valueDelimOpen`\
  \ 和 `valueDelimClose` 允许派生类指定它们自己的开启和结束分隔符字符串。`PersonInfo` 成员函数的实现调用这些虚函数，为它们返回的值添加适当的分隔符。以\
  \ `PersonInfo::theName` 为例，代码如下：\n\n点击此处查看代码图像\n\n```cpp\nconst char * PersonInfo::valueDelimOpen()\
  \ const\n{\n    return \"[\"; // 默认开启分隔符\n}\n\nconst char * PersonInfo::valueDelimClose()\
  \ const\n{\n    return \"]\"; // 默认结束分隔符\n}\n\nconst char * PersonInfo::theName()\
  \ const\n{\n    // 为返回值预留缓冲区；因为它是\n    // 静态的，它会自动初始化为零\n    static char value[Max_Formatted_Field_Value_Length];\n\
  \    // 写入开启分隔符\n    std::strcpy(value, valueDelimOpen());\n    // 将此对象的名称字段添加到\
  \ value 字符串中（小心\n    // 避免缓冲区溢出！）\n    // 写入结束分隔符\n    std::strcat(value, valueDelimClose());\n\
  \    return value;\n}\n```\n\n人们可能会质疑 `PersonInfo::theName` 过时的设计（特别是使用固定大小的静态缓冲区，这种做法极会导致溢出和线程问题\
  \ —— 另见 Item 21），但让我们抛开这些问题，转而关注这一点：`theName` 调用 `valueDelimOpen` 来生成它将返回的字符串的开启分隔符，然后生成名称值本身，最后调用\
  \ `valueDelimClose`。由于 `valueDelimOpen` 和 `valueDelimClose` 是虚函数，`theName` 返回的结果不仅取决于\
  \ `PersonInfo`，还取决于派生自 `PersonInfo` 的类。\n\n作为 `CPerson` 的实现者，这是一个好消息，因为在查阅 `IPerson`\
  \ 文档的细节时，你发现 `name` 和 `birthDate` 要求返回未修饰的值，即不允许有任何分隔符。也就是说，如果一个人名叫 Homer，对该人的 `name`\
  \ 函数调用应该返回“Homer”，而不是“[Homer]”。\n\n`CPerson` 和 `PersonInfo` 之间的关系是 `PersonInfo`\
  \ 恰好拥有一些可以使 `CPerson` 实现更简单的函数。仅此而已。因此，它们的关系是“基于……实现”（is-implemented-in-terms-of），我们知道这可以通过两种方式来表示：通过组合（参见\
  \ Item 38）和通过私有继承（参见 Item 39）。Item 39 指出组合通常是首选方法，但在需要重定义虚函数时，继承是必要的。在这种情况下，`CPerson`\
  \ 需要重定义 `valueDelimOpen` 和 `valueDelimClose`。\n\n在 UML 中，设计如下：\n\n![images](img/Image0016.gif)\n\
  \n这个示例证明了 MI 可以既有用又易于理解。\n\n归结底，多重继承只是面向对象工具箱中的另一种工具。与单继承相比，它通常用起来更复杂、理解更困难，因此如果你有一个与\
  \ MI 设计或等效的 SI 设计，那么 SI 设计几乎总是更优的。如果你唯一想出的设计涉及 MI，你应该再仔细思考 —— 几乎总有某种*方法可以让 SI 发挥作用。同时，MI\
  \ 有时是解决问题最清晰、最易维护、最合理的方法。在那种情况下，不要害怕使用它。只需确保谨慎使用即可。\n\n### 需要记住的事\n\n• 多重继承比单继承更复杂。它可能会导致新的歧义问题以及对虚继承的需求。\n\
  \n\n\n\n\n-   虚函数继承在尺寸、速度以及初始化和赋值的复杂度上会带来代价。当虚基类没有数据成员时，它最为实用。\n-   多重继承确实有其合理的用途。一种场景是将来自接口类（Interface）的公有继承与一个辅助实现的类的私有继承相结合。\n\
  \n# 7. 模板与泛型编程\n\nC++ 模板的最初动机非常简单：为了能够创建如 `vector`、`list` 和 `map` 这样类型安全的容器。然而，随着使用模板的人越来越多，他们发现自己可以用模板做的事情也变得越来越广泛。容器固然很好，但泛型编程——即编写与所操作对象类型无关的代码的能力——则更好。STL\
  \ 算法（如 `for_each`、`find` 和 `merge`）就是这种编程方式的示例。最终，人们发现 C++ 模板机制本身是图灵完备的：它可以被用于计算任何可计算的值。这导致了模板元编程：创建在\
  \ C++ 编译器内部执行并在编译完成后停止运行的程序。如今，容器仅仅是 C++ 模板大餐中的一小部分。尽管模板的应用非常广泛，但所有基于模板的编程都基于一组核心思想。这些思想正是本章的重点。\n\
  \n本章不会让你成为模板编程专家，但它会让你成为更优秀的程序员。它还将为你提供所需的信息，让你根据需要扩展模板编程的边界。\n\n## 条 41：理解隐式接口和编译时多态\n\
  \n面向对象编程的世界围绕着*显式*接口和*运行时*多态展开。例如，给定如下所示（无意义的）类：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ Widget {\npublic:\nWidget();\nvirtual ~Widget();\nvirtual std::size_t size() const;\n\
  virtual void normalize();\nvoid swap(Widget& other); // 查看 Item 25\n...\n};\n```\n\
  \n以及这个（同样无意义的）函数：\n\n点击此处查看代码图像\n\n```cpp\nvoid doProcessing(Widget& w)\n{\n   \
  \ if (w.size() > 10 && w != someNastyWidget) {\n        Widget temp(w);\n      \
  \  temp.normalize();\n        temp.swap(w);\n    }\n}\n```\n\n我们可以对 `doProcessing`\
  \ 中的 `w` 如下：\n\n-   因为 `w` 被声明为 `Widget` 类型，所以 `w` 必须支持 `Widget` 接口。我们可以在源码中查找该接口（例如\
  \ `Widget` 的 `.h` 文件）来查看它的具体样貌，因此我称之为*显式接口*——一个在源代码中显式可见的接口。\n-   因为 `Widget` 的某些成员函数是虚函数，`w`\
  \ 对这些函数的调用将表现出*运行时多态*：具体调用的函数将根据 `w` 的动态类型在运行时确定（参见 Item 37）。\n\n模板与泛型编程的世界则完全不同。在那个世界里，显式接口和运行时多态依然存在，但它们不再那么重要。相反，*隐式接口*和*编译时多态*占据了前沿。要了解这是如何的，请看我们将\
  \ `doProcessing` 从函数转变为函数模板时发生了什么：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\
  void doProcessing(T & w)\n{\n    if (w.size() > 10 && w != someNastyWidget) {\n\
  \        T temp(w);\n        temp.normalize();\n        temp.swap(w);\n    }\n}\n\
  ```\n\n现在我们对 `doProcessing` 中的 `w` 说些什么？\n\n-   `w` 必须支持的接口是由模板中对 `w` 执行的操作决定的。在这个例中，看起来\
  \ `w` 的类型（`T`）必须支持 `size`、`normalize` 和 `swap` 成员函数；支持拷贝构造函数（用于创建 `temp`）；以及不不等的比较（用于与\
  \ `someNastyWidget` 比较）。我们很快会发现这并不完全准确，但目前来说已经足够了。重要的是，为了使模板编译而必须有效的表达式集合，就是 `T`\
  \ 必须支持的*隐式接口*。\n-   涉及 `w` 的函数调用（如 `operator>` 和 `operator!=`）可能涉及实例化模板以使这些调用成功。这种实例化发生在编译期间。由于使用不同的模板参数实例化函数模板会导致调用不同的函数，这被称为*编译时多态*。\n\
  \n即使你从未用过模板，也应该熟悉运行时多态和编译时多态之间的区别，因为这类似于确定一组重载函数中应该调用哪一个的过程（在编译期间完成）与虚函数调用的动态绑定（在运行时完成）之间的区别。然而，显式接口与隐式接口之间的区别对于模板来说是新的，值得进一步仔细研究。\n\
  \n显式接口通常由函数签名组成，即函数名、参数类型、返回类型等。例如 `Widget` 类的公有接口：\n\n点击此处查看代码图像\n\n```cpp\nclass\
  \ Widget {\npublic:\nWidget();\nvirtual ~Widget();\nvirtual std::size_t size() const;\n\
  virtual void normalize();\nvoid swap(Widget& other);\n};\n```\n\n由构造函数、析构函数以及 `size`、`normalize`\
  \ 和 `swap` 函数组成，以及参数类型、返回类型和 `const`。（参见 Item 5 关于数据私有化的建议，尽管在本例中并没有。）\n\n隐式接口完全不同。它不是基于函数签，而是由*表达式*组成的。再次看\
  \ `doProcessing` 开头的条件：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nvoid doProcessing(T\
  \ & w)\n{\n    if (w.size() > 10 && w != someNastyWidget) {\n        ...\n    }\n\
  }\n```\n\n`T`（`w` 的类型）的隐式接口似乎具有以下约束：\n\n- 它必须提供一个返回整数值的 `size` 成员函数。\n- 它必须支持一个比较两个\
  \ `T` 类型对象的 `operator!=` 函数。（在这里我们假设 `someNastyWidget` 是 `T` 类型）。\n\n由于运算符重载的可能性，这些约束都不需要满足。是的，`T`\
  \ 必须支持 `size` 成员函数，尽管值得提到该函数可能从基类继承。但这个成员函数不需要返回整数类型。它甚至不需要返回数值类型。事实上，它甚至不需要返回一个定义了\
  \ `operator>` 的类型！它只需要返回一个可以与 `int` 对应的某种类型 `X` 对象（因为 10 是 `int` 类型）。`operator>`\
  \ 不需要接受类型 `X` 的参数，因为它可以接受类型 `Y` 的参数，只要存在从类型 `X` 的对象到类型 `Y` 对象的隐式转换，且这样做是可以的！\n\n\
  同样地，并没有要求 `T` 支持 `operator!=`，因为 `operator!=` 接受一个类型 `X` 的对象和一个类型 `Y` 的对象也是同样可以接受的。只要\
  \ `T` 可以转换为 `X` 且 `someNastyWidget` 的类型可以转换为 `Y`，对 `operator!=` 的调用就是有效的。\n\n（作为顺便提一下，此分析没有考虑到重载\
  \ `operator&&` 的可能性，这会将上述表达式的含义从逻辑与变为可能完全不同的内容。）\n\n\n\n\n大多数人在第一次以这种方式思考隐式接口（implicit\
  \ interfaces）时都会感到头疼，但其实不需要吃阿司林。隐式接口仅仅由一组有效表达式组成。这些表达式本身看起来可能复杂，但它们施加的约束通常非常直观。例如，给定以下条件：\n\
  \n```\nif (w.size() > 10 && w != someNastyWidget) ...\n```\n\n很难对函数 `size`、`operator>`、`operator&&`\
  \ 或 `operator!=` 的约束说太多什么，但很容易识别出整个表达式的约束。`if` 语句的条件部分必须是一个布尔表达式，因此无论涉及的确切类型是什么，无论\
  \ `w.size() > 10 && w != someNastyWidget` 产生什么结果，它必须与 `bool` 兼容。这是模板 `doProcessing`\
  \ 对其类型参数 `T` 施加的隐式接口的一部分。`doProcessing` 需要接口的其他部分是：对拷贝构造函数、`normalize` 和 `swap`\
  \ 的调用对于类型为 `T` 的对象必须有效。\n\n施加在模板参数上的隐式接口与施加在类对象上的显式接口一样真实，并且两者在编译期间都会检查。正如你不能用与其类提供的显式接口矛盾的方式使用对象（代码将无法编译）一样，你不能在模板中使用一个对象，除非该对象支持模板所要求的隐式接口（同样，代码将无法编译）。\n\
  \n### 需要记住的\n\n- 类和模板都支持接口和多态性。\n- 对于类，接口是显式的，并以函数签名为中心。多态性在运行时通过虚函数实现。\n- 对于模板参数，接口是隐式的，并基于有效表达式。多态性在编译期间通过模板实例化和函数重载解析实现。\n\
  \n### 第 42 条条：理解 `typename` 的两种含义\n\n问题：在以下模板声明中，`class` 和 `typename` 有什么区别？\n\n\
  点击此处查看代码图片\n\n```\ntemplate<class T> class Widget; // 使用了 \"class\"\n\ntemplate<typename\
  \ T> class Widget; // 使用了 \"typename\"\n```\n\n答案：没有区别。在声明模板类型参数时，`class` 和 `typename`\
  \ 的含义完全相同。有些程序员始终一直使用 `class`，因为更容易输入。另一些人（包括我）更倾向于使用 `typename`，因为它暗示该参数不一定是一个类类型。少数开发者在允许任何类型时使用\
  \ `typename`，并将 `class` 留给只有用户定义类型才被接受的情况。但从 C++ 的角度来看，在声明模板参数时，`class` 和 `typename`\
  \ 的含义完全相同。\n\n然而，C++ 并不总是将 `class` 和 `typename` 视为等效的。有时你必须使用 `typename`。要理解何时使用，我们必须谈谈模板中可以引用的两种名称。\n\
  \n假设我们有一个函数模板，它接收一个 STL 兼容的容器，该容器装有可以赋值给 `int` 的对象。进一步假设该函数只是打印其第二个元素的值。这是一个以愚蠢方式实现的愚蠢函数，正如我下面写的那样，它甚至不应该通过编译，但请忽略这些问题——我的疯狂是有章法的：\n\
  \n点击此处查看代码图片\n\n```\ntemplate<typename C> // 打印第 2 个元素\nvoid print2nd(const C& container)\
  \ // container;\n{ // 这不是合法的 C++！\nif (container.size() >= 2) {\n    C::const_iterator\
  \ iter (container.begin()); // 获取第一个元素的迭代器\n    ++iter; // 将 iter 移动到第二个元素\n   \
  \ int value = *iter; // 将该元素拷贝为 int\n    std::cout << value; // 打印 int\n}\n}\n```\n\
  \n我高亮了该函数中的两个局部变量，`iter` 和 `value`。`iter` 的类型是 `C::const_iterator`，这是一个依赖于模板参数 `C`\
  \ 的类型。模板中依赖于模板参数的名称被称为*依赖名称*（dependent names）。当一个依赖名称嵌套在类内部时，我称其为*嵌套依赖名称*（nested\
  \ dependent name）。`C::const_iterator` 是一个嵌套依赖名称。事实上，它是一个*嵌套依赖类型名称*（nested dependent\
  \ type name），即引用一个类型的嵌套依赖名称。\n\n`print2nd` 中的另一个局部变量 `value` 的类型为 `int`。`int` 是一个不依赖于任何模板参数的名称。此类名称被称为*非依赖名称*（non-dependent\
  \ names）（我不知道为什么它们不被称为独立名称。如果像我一样你觉得“非依赖”这个词是不可理喻的，我表示同情，但“非依赖”确实是这类名称的术语，所以请和我一样，翻个白眼并接受现实吧。）\n\
  \n嵌套依赖名称可能会导致解析困难。例如，假设我们通过这样开始让 `print2nd` 更加愚蠢：\n\n```\ntemplate<typename C>\n\
  void print2nd(const C& container)\n{\n    C::const_iterator * x;\n    ...\n}\n```\n\
  \n这看起来像我们正在声明 `x` 为一个指向 `C::const_iterator` 指针的局部变量。但它之所以看起来这样，是因为我们“知道” `C::const_iterator`\
  \ 是一个类型。但如果 `C::const_iterator` 不是一个类型呢？如果 `C` 有一个名为 `const_iterator` 的静态成员呢？在这种情况下，上面的代码并不是声明一个局部变量，而是\
  \ `C::const_iterator` 与 `x` 的乘法！在 `C` 还不确定之前，C++ 解析器无法知道 `const_iterator` 是否为类型，默认情况下，嵌套依赖名称*不是*类型，除非你告诉它。（稍后会提到这个规则的例外。）考虑到这一点，再次查看\
  \ `print2nd` 的开头：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename C>\nvoid print2nd(const\
  \ C& container)\n{\n    if (container.size() >= 2) {\n        C::const_iterator\
  \ iter(container.begin()); // 假设它不是类型\n        ...\n    }\n}\n```\n\n现在应该清楚为什么这不是合法的\
  \ C++ 了。`iter` 的声明只有在 `C::const_iterator` 是类型时才有意义，但我们还没有告诉 C++ 它是，而 C++ 假设它不是。为了纠正这种局面，我们必须告诉\
  \ C++ `C::const_iterator` 是一个类型。我们通过在它前面立即加上 `typename` 来：\n\n点击此处查看代码图片\n\n```cpp\n\
  template<typename C> // 这是合法的 C++\nvoid print2nd(const C& container)\n{\n    if\
  \ (container.size() >= 2) {\n        typename C::const_iterator iter(container.begin());\n\
  \        ...\n    }\n}\n```\n\n通用规则很简单：当你在模板中引用嵌套依赖类型名称时，必须紧跟一个 `typename` 单词。（再次，我稍后会描述一个例外。）\n\
  \n`typename` 应该仅标识嵌套依赖类型名称；其他名称不应该有它。例如，这里有一个接收容器以及该容器的迭代器的函数模板：\n\n点击此处查看代码图片\n\
  \n```cpp\ntemplate<typename C> // 允许 typename（和 class 一样）\nvoid f(const C & container,\
  \ // 不允许 typename\ntypename C::iterator iter); // 需要 typename\n```\n\n`C` 不是嵌套依赖类型名称（它没有嵌套在任何依赖于模板参数的内容中），因此声明\
  \ `container` 时其前面不能有 `typename`，但 `C::iterator` 是嵌套依赖类型名称，因此要求在其前面有 `typename`。\n\
  \n\n\n\n\n“`typename` 必须在嵌套依赖类型名称之前”这一规则的例外是：在基类列表中的或作为成员初始化列表中的基类标识符时，`typename`\
  \ 不得置在嵌套依赖类型名称之前。例如：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Derived:\
  \ public Base<T>::Nested { // 基类列表：此处省略 typename\npublic: // 允许\nexplicit Derived(int\
  \ x)\n: Base<T>::Nested (x) // 成员初始化列表中的基类标识符\n{ // 初始化列表：不允许使用 typename\ntypename\
  \ Base<T>::Nested temp; // 嵌套依赖类型的使用\n... // 名称不在基类列表中，或\n} // 作为基类标识符（位于）中\n...\
  \ // 成员初始化列表中：必须使用 typename\n};\n```\n\n``````\n\n这种不一致性令人烦恼，但一旦你积累了一些经验，你几乎就察觉不到了。\n\
  \n让我们来看最后一个 `typename` 示例，因为它代表了你在实际代码中会看到的某些东西。假设我们正在编写一个接受迭代器的函数模板，并且我们想为迭代器所指向的对象创建一个本地副本\
  \ `temp`。我们可以这样这样做：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename IterT>\nvoid workWithIterator(IterT\
  \ iter)\n{\n    typename std::iterator_traits<IterT>::value_type temp(*iter);\n\
  \    ...\n}\n```\n\n```\n\n不要被 `std::iterator_traits<IterT>::value_type` 吓到。这只是对标准特征类（traits\
  \ class）的使用（参见 条目 47 ），它是 C++ 中表示“`IterT` 类型对象所指向内容的类型”的方式。该语句声明了一个与 `IterT` 对象所指向的类型相同的局部变量（`temp`），并用\
  \ `iter` 所指向的对象初始化了 `temp`。如果 `IterT` 是 `vector<int>::iterator`，`temp` 的类型就是 `int`。如果\
  \ `IterT` 是 `list<string>::iterator`，`temp` 的类型就是 `string`。因为 `std::iterator_traits<IterT>::value_type`\
  \ 是一个嵌套依赖类型名称（`value_type` 嵌套在 `iterator_traits<IterT>` 内部，且 `IterT` 是模板参数），我们必须在它前面加上\
  \ `typename`。\n\n如果你认为 `std::iterator_traits<IterT>::value_type` 并不愉快，想象一下输入它会是什么感觉。如果你和大多数程序员一样，一想到要输入超过一次念头都是可怕的，所以你会想要创建一个\
  \ `typedef`。对于像 `value_type` 这样的特征成员名（关于特征类的信息，请再次参见 条目 47），常见的惯例是 `typedef` 名称与特征成员名相同，因此这种局部\
  \ `typedef` 通常按如下方式定义：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename IterT>\nvoid workWithIterator(IterT\
  \ iter)\n{\n    typedef typename std::iterator_traits<IterT>::value_type value_type;\n\
  \    value_type temp(*iter);\n    ...\n}\n```\n\n```\n\n许多程序员发现“`typedef typename`”这种并列写法最初很突兀，但一旦你习惯了，很快就能适应。虽然阅读\
  \ `std::iterator_traits<IterT>::value_type` 并不那么舒服，但请记住它的用法。此处抱歉，此处翻译逻辑出现了重复，请忽略下方）_\
  \ 重新理解的 `value_type` \n\n译文：\n\n[content]\n\n“`typename` 必须在嵌套依赖类型名称之前”这一规则的例外是：在基类列表中的或作为成员初始化列表中的基类标识符时，`typename`\
  \ 不得置在嵌套依赖类型名称之前。例如：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Derived:\
  \ public Base<T>::Nested { // 基类列表：此处省略 typename\npublic: // 允许\nexplicit Derived(int\
  \ x)\n: Base<T>::Nested (x) // 成员初始化列表中的基类标识符\n{ // 初始化列表：不允许使用 typename\ntypename\
  \ Base<T>::Nested temp; // 嵌套依赖类型的使用\n... // 名称不在基类列表中，或\n} // 作为基类标识符（位于）中\n...\
  \ // 成员初始化列表中：必须使用 typename\n};\n```\n\n``````\n\n这种不一致性令人烦恼，但一旦你积累了一些经验，你几乎就察觉不到了。\n\
  \n让我们来看最后一个 `typename` 示例，因为它代表了你在实际代码中会看到的某些东西。假设我们正在编写一个接受迭代器的函数模板，并且我们想为迭代器所指向的对象创建一个本地副本\
  \ `temp`。我们可以这样这样做：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename IterT>\nvoid workWithIterator(IterT\
  \ iter)\n{\n    typename std::iterator_traits<IterT>::value_type temp(*iter);\n\
  \    ...\n}\n```\n\n```\n\n不要被 `std::iterator_traits<IterT>::value_type` 吓到。这只是对标准特征类（traits\
  \ class）的使用（参见 条目 47 ），它是 C++ 中表示“`IterT` 类型对象所指向内容的类型”的方式。该语句声明了一个与 `IterT` 对象所指向的类型相同的局部变量（`temp`），并用\
  \ `iter` 所指向的对象初始化了 `temp`。如果 `IterT` 是 `vector<int>::iterator`，`temp` 的类型就是 `int`。如果\
  \ `IterT` 是 `list<string>::iterator`，`temp` 的类型就是 `string`。因为 `std::iterator_traits<IterT>::value_type`\
  \ 是一个嵌套依赖类型名称（`value_type` 嵌套在 `iterator_traits<IterT>` 内部，且 `IterT` 是模板参数），我们必须在它前面加上\
  \ `typename`。\n\n如果你认为阅读 `std::iterator_traits<IterT>::value_type` 并不愉快，想象一下输入它会是什么感觉。如果你和大多数程序员一样，一想到要输入超过一次念头都是可怕的，所以你会想要创建一个\
  \ `typedef`。对于像 `value_type` 这样的特征成员名（关于特征类的信息，请再次参见 条目 47），常见的惯例是 `typedef` 名称与特征成员名相同，因此这种局部\
  \ `typedef` 通常按如下方式定义：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename IterT>\nvoid workWithIterator(IterT\
  \ iter)\n{\n    typedef typename std::iterator_traits<IterT>::value_type value_type;\n\
  \    value_type temp(*iter);\n    ...\n}\n```\n\n```\n\n许多程序员发现“`typedef typename`”这种并列写法最初很突兀，但一旦你习惯了，很快就能适应。虽然阅读\
  \ `std::iterator_traits<IterT>::value_type` 并不那么舒服，但请记住它的用法。（*注：此处原文文本似乎出现了部分重复和乱码，翻译时已根据语境进行平滑处理，以确保逻辑通顺*）\n\
  \n\n\n\n\n注意此类定义开头的 `template <>` 语法。它表示这既不是一个模板，也不是一个独立的类。相反，它是 `MsgSender` 模板的一个特化版本，用于模板参数为\
  \ `CompanyZ` 的情况。这被称为*完全模板特化*（total template specialization）：模板 `MsgSender` 针对类型\
  \ `CompanyZ` 特化，并且这种特化是*完全的* ——一旦类型参数被定义为 `CompanyZ`，模板参数的其他任何方面都不能发生变化。\n\n既然 `MsgSender`\
  \ 已经针对 `CompanyZ` 特化，再次考虑派生类 `LoggingMsgSender`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ Company>\nclass LoggingMsgSender: public MsgSender<Company> {\npublic:\n...\n\
  void sendClearMsg(const MsgInfo& info)\n{\n    write \"before sending\" info to\
  \ the log;\n    sendClear(info); // if Company == CompanyZ,\n    // this function\
  \ doesn't exist!\n    write \"after sending\" info to the log;\n}\n...\n};\n```\n\
  \n如注释所示，当基类为 `MsgSender<CompanyZ>` 时，这段代码是没有意义的，因为该类并没有提供 `sendClear` 函数。这就是为什么\
  \ C++ 拒绝该调用的原因：它意识到基类模板可能是被特化的，而且这种特化版本可能不提供与通用模板相同的接口。因此，它通常拒绝在模板化的基类中查找继承的名称。在某种意义上，当我们从面向对象的\
  \ C++ 切换到模板 C++ 时（参见 Item 1），继承机制就停止工作了。\n\n要重新启动它，我们必须以某种方式禁用 C++ 的“不要在模板化的基类中查找”的行为。有三种方法可以实现。第一，你可以在调用基类函数前加上\
  \ `this->`：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename Company>\nclass LoggingMsgSender:\
  \ public MsgSender<Company> {\npublic:\n...\nvoid sendClearMsg(const MsgInfo& info)\n\
  {\n    write \"before sending\" info to the log;\n    this-> sendClear(info); //\
  \ okay, assumes that\n    // sendClear will be inherited\n    write \"after sending\"\
  \ info to the log;\n}\n...\n};\n```\n\n第二，你可以使用 `using` 声明，如果你读过 Item 33，这个解决方案应该让你觉得很熟悉。那条\
  \ Item 解释了 `using` 声明如何将隐藏的基类名称带到派生类的作用域中。因此，我们可以这样写 `sendClearMsg`：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename Company>\nclass LoggingMsgSender: public MsgSender<Company>\
  \ {\npublic:\nusing MsgSender<Company>::sendClear; // tell compilers to assume\n\
  ... // that sendClear is in the\n// base class\nvoid sendClearMsg(const MsgInfo&\
  \ info)\n{\n    ...\n    sendClear(info); // okay, assumes that\n    ... // sendClear\
  \ will be inherited\n}\n...\n};\n```\n\n（尽管 `using` 声明在此处和 Item 33 中均有效，但要解决的问题是不同的。在这里，情况不是基类名称被派生类名称隐藏了，而是编译器除非我们告诉它否则不会搜索基类作用域。）\n\
  \n让代码通过编译的最后一种方法是显式指定被调用的函数在基类中：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename Company>\n\
  class LoggingMsgSender: public MsgSender<Company> {\npublic:\n...\nvoid sendClearMsg(const\
  \ MsgInfo& info)\n{\n    ...\n    MsgSender<Company>:: sendClear(info); // okay,\
  \ assumes that\n    ... // sendClear will be\n} // inherited\n...\n};\n```\n\n这通常是解决问题最理想的方法，因为如果被调用的函数是虚函数，显式限定将关闭虚绑定行为。\n\
  \n从名称可见性的角度来看，这些方法的作用是相同的：它们向编译器承诺，基类模板的任何后续特化都将支持通用模板提供的接口。这种承诺是编译器在解析如 `LoggingMsgSender`\
  \ 类的派生类模板时所需要的，但如果事实证明该承诺是毫无根据的，真相将在后续编译期间显现。例如，如果源代码后包含以下内容，\n\n点击此处查看代码图像\n\n\
  ```cpp\nLoggingMsgSender<CompanyZ> zMsgSender;\nMsgInfo msgData;\n... // put info\
  \ in msgData\nzMsgSender.sendClearMsg(msgData); // error! won't compile\n```\n\n\
  对 `sendClearMsg` 的调用无法编译，因为此时编译器知道基类是模板特化版本 `MsgSender<CompanyZ>`，并且知道该类没有提供 `sendClearMsg`\
  \ 尝试调用的 `sendClear` 函数。\n\n从根本上说，问题在于编译器是在早期（解析派生类模板时）还是后期（实例化时）诊断无效的引用。C++ 的策略倾向于尽早诊断，这就是为什么它不对基类的内容做任何假设。\n\
  \n### 需要记忆的事\n\n- 在派生类模板中，通过 `this->`、`using` 声明或基类限定来引用基类名称。\n\n### Item 44: 从模板中提取参数无关的代码\n\
  \n- 模板是节省时间和避免代码重复的绝佳方法。与其编写 20 个带有成员函数的相似类，不如编写一个类模板，让编译器去实例化。（类模板的成员函数只有在使用时才会被实例化。）函数模板同样如此。与其编写多个函数，不如写一个函数模板让编译器完成剩余工作。科技不是很棒吗？\n\
  \n- 是的，好吧……如果不小心，使用模板会导致*代码膨胀*（code bloat）：产生重复代码、数据或两者的二进制文件。结果源代码看起来精简，但机器代码却臃肿。臃肿并不流行，所以你需要知道如何避免这种膨胀。\n\
  \n- 你的主要工具的名字很有气——共性与变异分析（commonality and variability analysis），但这个想法并不复杂。即使你从未写过模板，你也经常进行这种分析。\n\
  \n- 当你在编写函数并发现其部分实现与另一个函数的实现基本相同时，你会直接复制代码吗？当然不。你把这两个函数的公共部分提取出来，放入第三个函数中，让原来的两个函数调用它。也就是说，你分析这两个函数找到公共和变异部分，将公共部分移动到新函数，并将变异部分留在原函数中。同样，当你编写一个类并发现它的某些部分与另一个类相同时，你不会复制公共部分。相反，你将公共部分移动到一个新类，然后通过继承或组合（参见\
  \ Item 32、38 和 39 ）来让原始类访问这些公共特性。原始类中不同的部分——变异部分——保留在原处。\n\n\n\n\n在编写模板时，你会进行同样的分析，并以相同的方式避免重复，但这里有一个不同之处。在非模板代码中，重复是显式的：你可以*看到*两个函数或两个类之间存在重复。在模板代码中，重复是隐式的：模板源代码只有一份拷贝，因此你必须训练自己去感知当模板被多次实例化时可能发生的重复。\n\
  \n例如，假设你想为一种固定大小的方阵编写一个模板，该方阵除支持其他功能外，还支持矩阵求逆。\n\n点击此此处查看代码图像\n\n```cpp\ntemplate<typename\
  \ T, // 用于 n x n 矩阵的模板\nstd::size_t n> // 类型为 T 的对象；信息请见下文\nclass SquareMatrix {\
  \ // 关于 size_t 参数\n\npublic:\n...\nvoid invert(); // 原地求逆矩阵\n};\n```\n\n此此模板接受一个类型参数\
  \ `T`，但同时也接受一个 `size_t` 类型的参数——一个*非类型参数*。非类型参数比类型参数少见，但它们是完全合法的，而且正如本例所示，它们可以非常自然。\n\
  \n现在考虑这段代码：\n\n点击此此处查看代码图像\n\n```cpp\nSquareMatrix<double, 5> sm1;\n...\nsm1.invert();\
  \ // 调用 SquareMatrix<double, 5>::invert\n\nSquareMatrix<double, 10> sm2;\n...\n\
  sm2.invert (); // 调用 SquareMatrix<double, 10>::invert\n```\n\n这里将实例化两个 `invert`\
  \ 的拷贝。这两个函数将是不相同的，因为其中一个处理 5×5 矩阵，另一个处理 10 ×10 矩阵，但除了常量 `5` 和 `10` 之外，这两个函数是相同的。这是模板引发代码膨胀（code\
  \ bloat）的一种经典方式。\n\n如果你看到两个函数，除了一个版本使用 `5` 而另一个版本使用 `10` 之外，它们的字符上完全相同，你会做什么？你的直觉是创建一个接受值作为参数的函数版本，然后用\
  \ `5` 或 `10` 调用该参数化函数，而不是重复代码。你的直觉非常准确！这里是为 `SquareMatrix` 实现此点的第一次尝试：\n\n点击此此处查看代码图像\n\
  \n```cpp\ntemplate<typename T> // 与大小无关的基类\nclass SquareMatrixBase { // 方阵\n\nprotected:\n\
  ...\nvoid invert(std::size_t matrixSize); // 求给定大小的矩阵\n...\n} ;\n\ntemplate<typename\
  \ T, std::size_t n>\nclass SquareMatrix: private SquareMatrixBase<T> {\nprivate:\n\
  using SquareMatrixBase<T>::invert; // 使基类版本的 invert\n// 在此类中可见；参见 项 33\n// 和 项 43\n\
  public:\n...\nvoid invert() { this->invert(n); } // 对基类进行内联调用\n}; // invert 的版本\n\
  ```\n\n如你所示，`invert` 的参数化版本位于基类 `SquareMatrixBase` 中。与 `SquareMatrix` 类似，`SquareMatrixBase`\
  \ 也是一个模板，但与 `SquareMatrix` 不同，它只对矩阵对象的类型模板化，而不对矩阵的大小。因此，所有持有特定类型对象的矩阵将共享同一个 `SquareMatrixBase`\
  \ 类。它们将共享该类 `invert` 的一个拷贝。\n\n`SquareMatrixBase::invert` 旨在让派生类避免代码重复，因此它是 `protected`\
  \ 而不是 `public`。调用它的额外代价应为零，因为派生类的 `invert` 使用内联函数调用基类版本。（`inline` 是隐式的——参见 项 30）。另请注意，`SquareMatrix`\
  \ 和 `SquareMatrixBase` 之间的继承是 `private` 的。这准确反映了事实：基类的存在仅仅是为了方便派生类的实现，而不是为了表达 `SquareMatrix`\
  \ 和 `SquareMatrixBase` 之间概念上的“是一个”（is-a）关系。（关于私有继承的信息，请参见 项 39）。\n\n到目前为止一切良好，但我们还有一个尚未解决的棘手问题。`SquareMatrixBase::invert`\
  \ 如何知道对什么数据进行操作？它通过参数知道矩阵的大小，但它如何知道特定矩阵的数据在哪里呢？推测只有派生类知道。派生类如何将此信息传递给基类，以便基类执行求逆操作？\n\
  \n一种可能性是在 `SquareMatrixBase::invert` 中添加另一个参数，也许是一个指向矩阵数据内存块起始位置的指针。这行得通，但极可能 `invert`\
  \ 并不是 `SquareMatrix` 中唯一可以以大小无关的方式编写并移动 `SquareMatrixBase` 的函数。如果有多个这样的函数，它们都需要一种方法来找到存储矩阵值的内存。我们可以为所有这些函数添加一个额外参数，但这样会反复向\
  \ `SquareMatrixBase` 提供相同的信息。这似乎是不合理的。\n\n另一种方法是让 `SquareMatrixBase` 存储指向矩阵数据的指针。既然它已经存储了该指针，顺便把大小也存进去。结果的设计如下：\n\
  \n点击此此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass SquareMatrixBase {\nprotected:\n\
  SquareMatrixBase(std::size_t n, T *pMem) : size(n), pData(pMem) {}\nvoid setDataPtr(T\
  \ *ptr) { pData = ptr; }\n\nprivate:\nstd::size_t size; // 大\nT *pData;\n};\n```\n\
  \n这让派生类决定如何分配内存。某些实现可能会将数据直接存储在 `SquareMatrix` 对象内部：\n\n点击此此处查看代码图像\n\n```cpp\n\
  template<typename T, std::size_t n>\nclass SquareMatrix: private SquareMatrixBase<T>\
  \ {\npublic:\nSquareMatrix() : SquareMatrixBase<T>(n, data) // 设置基类大小\n// 和指向矩阵值的指针\n\
  {\n...\nprivate:\nT data[n*n]; // 矩阵\n};\n```\n\n此类类型的对象不需要动态分配，但对象本身可能很大。另一种方法是将每个矩阵的数据放在堆上：\n\
  \n点击此此处查看代码图像\n\n```cpp\ntemplate<typename T, std::size_t n>\nclass SquareMatrix:\
  \ private SquareMatrixBase<T> {\npublic:\nSquareMatrix() : SquareMatrixBase<T>(n,\
  \ 0) // 设置基类数据为空\npData(new T[n*n]) // 分配矩阵内存\n{\nthis->setDataPtr(pData.get());\
  \ // 保存指向矩阵值的指针\n}\n...\nprivate:\nboost::scoped_array<T> pData; // 参见 项 13 关于 boost::scoped_array\
  \ 的信息\n};\n```\n\n无论数据存储在哪里，从膨胀的角度来看，关键结果是现在 `SquareMatrix` 的许多甚至所有成员函数都可以变为非内联基类版本的简单调用，这些版本被所有持有相同类型数据的矩阵共享，无论其大小如何。同时，不同大小的\
  \ `SquareMatrix` 对象是不同的类型，因此即使例如 `SquareMatrix<double, 5>` 和 `SquareMatrix<double,\
  \ 10>` 对象使用相同的 `SquareMatrixBase<double>` 成员函数，也没有机会将 `SquareMatrix<double, 5>`\
  \ 对象传递给期望 `SquareMatrix<double, 10>` 的函数。很棒，对吧？\n\n很棒，是的，但并非免费。硬编码了矩阵大小的 `invert`\
  \ 版本生成的代码可能比将大小作为函数参数或存储在对象中的共享版本更好。例如，在特定大小的版本中，大小是编译时常量，因此可以进行常量传播等优化，包括将其折叠为生成指令中的立即数操作。这在大小无关的版本中是无法实现的。\n\
  \n\n\n另一方面，针对多个矩阵尺寸只保留一个版本的 `invert` 可以减小可执行文件的大小，这可能会减少程序的运行集大小（working set size），并提高指令缓存的引用局部性。这些因素可能使程序运行得更快，其影响超过了在特定尺寸版本的\
  \ `invert` 中丢失的任何优化。哪种影响占主导地位？唯一的方法是两种方法都尝试一下，并在你的特定平台和代表性数据集上观察其行为。\n\n另一个效率考虑因素是对象的大小。如果你不小心，将与尺寸无关的移动移动基类中可能会增加每个对象的总体大小。例如，在我刚才展示的代码中，每个\
  \ `SquareMatrix` 对象都包含一个指向 `SquareMatrixBase` 类中数据的指针，尽管每个派生类已经有方法获取该数据。这使得每个 `SquareMatrix`\
  \ 对象的大小至少增加了一个指针的大小。可以修改设计以使这些指针变得不再必要，但再次，这存在权衡。例如，让基类存储一个指向矩阵数据的 `protected` 指针会导致在\
  \ 第 22 节 中描述的封装性丧失。它还会导致资源管理的复杂性：如果基类存储了指向矩阵数据的指针，但该数据可能是动态分配的，也可能是物理存储在派生类对象内部的（正如我们看到的），如何确定该指针应该被删除？这些问题是有答案的，但你越试图变得复杂，事情就会变得越复杂。在某个时刻，少量的代码复制看起来像是一种慈悲。\n\
  \n本节仅讨论了非类型模板参数导致的膨胀，但类型参数也会导致膨胀。例如，在许多平台上，`int` 和 `long` 具有相同的二进制表示，因此例如 `vector<int>`\
  \ 和 `vector<long>` 的成员函数很可能是相同的 —— 这正是膨胀的定义。某些链接器会合并相同的函数实现，但另一些链接器则不会，这意味着某些在 `int`\
  \ 和 `long` 上都实例化的某些模板在某些环境中可能会导致代码膨胀。同样，在大多数平台上，所有指针类型都具有相同的二进制表示，因此持有指针类型的模板（例如\
  \ `list<int*>`、`list<const int*>`、`list<SquareMatrix<long, 3>*>` 等）通常能够为每个成员函数使用单一的底层实现。通常，这意味着通过调用处理无类型指针（即\
  \ `void*` 指针）的函数，来实现与强类型指针（即 `T*` 指针）配对的的成员函数实现。标准 C++ 库的某些实现对 `vector`、`deque`\
  \ 和 `list` 等模板就是这样做的。如果你担心模板中出现代码膨胀，你可能希望编写执行相同事情的模板。\n\n### 注意事项\n\n- 模板会生成多个类和多个函数，因此任何不依赖于模板参数的模板代码都会导致膨胀。\n\
  - 非类型模板参数导致的膨胀通常可以通过模板参数替换为函数参数或类数据成员来消除。\n- 类型参数导致的膨胀可以通过为具有相同二进制表示的实例化类型共享实现来减少。\n\
  \n### 第 45 节：使用成员函数模板来接受“所有兼容类型”。\n\n智能指针是行为上非常像指针的对象，但增加了指针不提供的功能。例如，第 13 节解释了如何使用标准的\
  \ `auto_ptr` 和 `tr1::shared_ptr` 在正确的时间自动删除堆上的资源。STL 容器的迭代器几乎总是智能指针；你当然不能期望通过使用\
  \ `++` 将内置指针从链表中的一个节点移动到下一个节点，但对于 `list::iterator` 这是可以的。\n\n真实指针处理得很好的事情之一是支持隐式转换。派生类指针隐式转换为基类指针，非\
  \ `const` 对象的指针转换为 `const` 对象的指针，依此类推。例如，考虑在三级层次结构中可能发生的某些转换：\n\n点击此处查看代码图像\n\n\
  ```cpp\nclass Top { ... };\nclass Middle: public Top { ... };\nclass Bottom: public\
  \ Middle { ... };\n\nTop *pt1 = new Middle; // convert Middle* ⇒Top*\nTop *pt2 =\
  \ new Bottom; // convert Bottom* ⇒Top*\nconst Top *pct2 = pt1; // convert Top* ⇒\
  \ const Top*\n```\n\n在用户自定义的智能指针类中模拟此类转换是棘手的。我们需要以下代码才能通过编译：\n\n点击此处查看代码图像\n\n```cpp\n\
  template<typename T>\nclass SmartPtr {\npublic: // 智能指针通常\nexplicit SmartPtr(T *realPtr);\
  \ // 由内置指针初始化\n...\n};\n\nSmartPtr<Top> pt1 = // convert SmartPtr<Middle> ⇒\nSmartPtr<Middle>(new\
  \ Middle); // SmartPtr<Top>\nSmartPtr<Top> pt2 = // convert SmartPtr<Bottom> ⇒\n\
  SmartPtr<Bottom>(new Bottom); // SmartPtr<Top>\nSmartPtr<const Top> pct2 = pt1;\
  \ // convert SmartPtr<Top> ⇒\n// SmartPtr<const Top>\n```\n\n同一个模板的不同实例化之间没有固有的内在联系，因此编译器将\
  \ `SmartPtr<Middle>` 和 `SmartPtr<Top>` 视为完全不同的类，它们之间的关系不亚 `vector<float>` 和 `Widget`。为了获得我们想要的\
  \ `SmartPtr` 类之间的转换，我们必须显式地为它们编程。在上面的智能指针示例中，每条语句都创建一个新的智能指针对象，因此目前我们重点关注如何编写我们需要的智能指针构造函数。一个关键观察是，没有办法直接写出我们需要的构造函数。在上面的层次结构中，我们可以从\
  \ `SmartPtr<Middle>` 或 `SmartPtr<Bottom>` 构建一个 `SmartPtr<Top>`，但如果将来扩展了层次结构，`SmartPtr<Top>`\
  \ 对象将能够从其他指针类型构造。例如，如果我们以后添加了\n\n```cpp\nclass BelowBottom: public Bottom { ...\
  \ };\n```\n\n我们需要支持从 `SmartPtr<BelowBottom>` 创建 `SmartPtr<Top>` 对象，而且我们显然不希望修改 `SmartPtr`\
  \ 模板来实现。\n\n从原则上说，我们需要的构造函数数量是无限的。由于模板可以实例化生成无限数量的函数，似乎我们不需要 `SmartPtr` 的构造函数*函数*，我们需要一个构造函数*模板*。这类模板是*成员函数模板*（通常称为*成员模板*）——生成类成员函数的模板：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass SmartPtr {\npublic:\ntemplate<typename\
  \ U> // 成员模板\nSmartPtr(const SmartPtr<U>& other); // 用于“泛型\n拷贝构造函数”\n...\n};\n```\n\
  \n这表示对于每个类型 `T` 和每个类型 `U`，都可以从 `SmartPtr<U>` 创建 `SmartPtr<T>`，因为 `SmartPtr<T>` 有一个接受\
  \ `SmartPtr<U>` 参数的构造函数。这样的构造函数有时被称为*泛型拷贝构造函数*。\n\n上面的泛型构造函数没有声明为 `explicit`。这是故意为之。内置指针类型之间的类型转换（例如从派生类到基类指针）是隐式的且不需要强制类型转换，因此智能指针模拟这种行为是合理的。在模板化的构造函数上省略\
  \ `explicit` 正好实现了这一点。\n\n\n\n正如前面所述，`SmartPtr` 的泛型拷贝构造函数提供的功能超出了我们的需求。是的，我们希望能够从\
  \ `SmartPtr<Bottom>` 创建 `SmartPtr<Top>`，但我们不希望从 `SmartPtr<Top>` 创建 `SmartPtr<Bottom>`，因为这违背了公继承的含义（参见\
  \ Item 32 ）。我们也不希望能够从 `SmartPtr<double>` 创建 `SmartPtr<int>`，因为不存在从 `int*` 到 `double*`\
  \ 的对应隐式转换。通过某种方式，我们必须对该成员模板将生成的成员函数群进行精简。\n\n假设 `SmartPtr` 遵循 `auto_ptr` 和 `tr1::shared_ptr`\
  \ 的做法，提供一个 `get` 成员函数来返回智能指针对象持有的内置指针的拷贝（参见 Item 15 ），我们可以利用构造函数模板的实现将转换限制为我们需要的类型：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass SmartPtr {\npublic:\ntemplate<typename\
  \ U>\nSmartPtr(const SmartPtr<U>& other) // 初始化此处持有的指针\n: heldPtr(other.get()) {\
  \ ... } // 使用 other 持有的指针\nT* get() const { return heldPtr; }\n...\nprivate: //\
  \ 持有的内置指针\nT *heldPtr; // 由 SmartPtr 持有\n};\n```\n\n我们使用成员初始化列表将 `SmartPtr<T>` 的类型为\
  \ `T*` 的数据成员初始化为 `SmartPtr<U>` 持有的类型为 `U*` 的指针。只有当存在从 `U*` 指针到 `T*` 指针的隐式转换时，代码才能通过编译，这正是我们所想要的。最终效果是\
  \ `SmartPtr<T>` 现在有了一个泛型拷贝构造函数，该构造函数只有在传递兼容类型的参数时才会编译。\n\n成员函数模板的用处不仅限于构造函数。它们的另一个常见作用是支持赋值。例如，TR1\
  \ 的 `shared_ptr`（再次参见 Item 13 ）支持从所有兼容的内置指针、`tr1::shared_ptr`、`auto_ptr` 和 `tr1::weak_ptr`\
  \ 构建（参见 Item 54 ），并支持从这些除 `tr1::weak_ptr` 以外的所有类型进行赋值。以下是 TR1 关于 `tr1::shared_ptr`\
  \ 规范的片段，包括它在声明模板参数时倾向于使用 `class` 而非 `typename`。（如 Item 42 所解释的，在此语境下它们的意思完全相同。）\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<class T> class shared_ptr {\npublic:\ntemplate<class\
  \ Y> // 从...构造\nexplicit shared_ptr(Y * p); // 任何兼容的\ntemplate<class Y> // 内置指针、\n\
  shared_ptr(shared_ptr<Y> const& r); // shared_ptr,\ntemplate<class Y> // weak_ptr,\
  \ 或\nexplicit shared_ptr(weak_ptr<Y> const& r); // auto_ptr\ntemplate<class Y>\n\
  explicit shared_ptr(auto_ptr<Y>& r);\ntemplate<class Y> // 从...赋值\nshared_ptr& operator=(shared_ptr<Y>\
  \ const& r); // 任何兼容的\ntemplate<class Y> // shared_ptr 或\nshared_ptr& operator=(auto_ptr<Y>&\
  \ r); // auto_ptr\n...\n};\n```\n\n所有这些构造函数都是 `explicit` 的，泛型拷贝构造函数除外。这意味着从一种类型的\
  \ `shared_ptr` 到另一种类型的隐式转换是允许的，但不允许从内置指针或其他智能指针类型进行*隐式*转换。（*显式*转换——例如通过强制类型转换——是可以的。）同样有趣的是，传递给\
  \ `tr1::shared_ptr` 构造函数和赋值运算符的 `auto_ptr` 并没有被声明为 `const`，这与传递 `tr1::shared_ptr`\
  \ 和 `tr1::weak_ptr` 的方式形成对比。这是由于 `auto_ptr` 在被拷贝时会被独立修改的结果（参见 Item 13 ）。\n\n成员函数模板是非常棒的东西，但它们并没有改变语言的基本规则。Item\
  \ 5 解释说，编译器可能生成的四个成员函数中的两个是拷贝构造函数和拷贝赋值运算符。`tr1::shared_ptr` 声明了一个泛型拷贝构造函数，显然，当类型\
  \ `T` 和 `Y` 相同时，泛型拷贝构造函数可以实例化以创建“正常”的拷贝构造函数。那么，编译器会为 `tr1::shared_ptr` 生成拷贝构造函数吗，还是当一个\
  \ `tr1::shared_ptr` 对象……会实例化泛型拷贝构造函数模板\n\n### 注意事项\n- 使用成员函数模板生成接受所有类型的函数。\n- 如果你声明了泛型构造或赋值，你仍然需要声明普通的拷贝构造函数和赋值运算符。\n\
  \n### 第 46 ：在需要转换时定义非成员函数\nItem 24 解释了为什么只有非成员函数适用于隐式转换，并以 `Rational` 类的 `operator*`\
  \ 函数作为示例。我建议在继续之前熟悉该示例，因为本节对 Item 24 的示例进行了扩展：它将 `Rational` 和 `operator*` 都模板化了：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T>\nclass Rational {\npublic:\nRational(const\
  \ T& numerator = 0, // 参见 Item 20 为什么参数按引用传递\nconst T& denominator = 1);\nconst\
  \ T numerator() const; // 参见 Item 28 为什么返回值仍按值传递\nconst T denominator() const;\n\
  ... // Item 3 为什么它们是 const\n};\n```\n\n``````cpp\ntemplate<typename T>\nconst Rational<T>\
  \ operator*(const Rational<T> & lhs,\nconst Rational<T> & rhs)\n{ ... }\n```\n\n\
  正如 Item 24 中，我们希望支持混合运算，所以我们希望下面的代码能够编译。我们预计它会通过，因为我们使用的是在 Item 24 中可以运行的代码。唯一的区别是\
  \ `Rational` 和运算符 `*` 现在是模板了：\n\n点击此处查看代码图片\n\n```cpp\nRational<int> oneHalf(1,\
  \ 2); // 这个示例来自 Item 24 \n// 只是 Rational 现在是模板\nRational<int> result = oneHalf *\
  \ 2; // 错误！无法编译\n```\n\n\n\n这种无法编译的现象表明，模板化的 `Rational` 与非模板版本之间存在不同之处，事实确实如此。在第\
  \ 24 条 中，编译器知道我们尝试调用哪个函数（接收两个 `Rational` 对象的 `operator*`），但在这里，编译器*并不知道*我们想要调用哪个函数。相反，它们正试图*弄出*应该从名为\
  \ `operator*` 的模板中实例化（即创建）哪个函数。它们知道应该实例化一个名为 `operator*` 的函数，该函数接收两个类型为 `Rational<T>`\
  \ 的参数，但为了实例化，它们必须弄清楚 `T` 是什么。问题在于，它们做不到。\n\n在尝试推导 `T` 时，它们查看了传递给 `operator*` 调用的参数的类型。在这种情况下，这些类型是\
  \ `Rational<int>`（`oneHalf` 的类型）和 `int`（2 的类型）。每个参数都是被单独考虑的。\n\n使用 `oneHalf` 进行推导是很的。`operator*`\
  \ 的第一个参数声明为 `Rational<T>` 类型，而传递给 `operator*` 的第一个参数（`oneHalf`）类型为 `Rational<int>`，因此\
  \ `T` 必须是 `int`。遗憾的是，另一个参数的推导并不那么简单。`operator*` 的第二个参数声明为 `Rational<T>` 类型，但传递给\
  \ `operator*` 的第二个参数（2）类型为 `int`。在这种情况下，编译器如何弄清楚 `T` 是什么？你可能希望它们使用 `Rational<int>`\
  \ 的非 `explicit` 构造函数将 2 转换为 `Rational<int>`，从而允许它们推导出 `T` 是 `int`，但它们并没有这样做。它们没有这样做，是因为在模板参数推导期间，*永远不会*考虑隐式类型转换函数。永远不会。这种转换会在函数调用期间使用，是的，但在你调用函数之前，你必须知道存在哪些函数。为了知道这一点，你需要推导出相关函数模板的参数类型（这样你就可以实例化相应的函数）。但通过构造函数调用进行的隐式类型转换在模板参数推导期间是不被考虑的。第\
  \ 24 条 不涉及模板，因此模板参数推导不是问题。既然我们现在进入了 C++ 的模板部分（参见第 1 条），这就是首要问题。\n\n我们可以利用模板类中的 `friend`\
  \ 声明可以引用特定函数这一事实，减轻编译器模板参数推导的挑战。这意味着类 `Rational<T>` 可以将针对 `Rational<T>` 的 `operator*`\
  \ 声明为友元函数。类模板不依赖于模板参数推导（该过程仅适用于函数模板），因此在实例化类 `Rational<T>` 的时候，`T` 总是已知的。这使得 `Rational<T>`\
  \ 类将相应的 `operator*` 函数声明为友元变得简单：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\n\
  class Rational {\npublic:\n...\nfriend // 声明 operator*\nconst Rational operator*(const\
  \ Rational& lhs, // 函数（详情见\nconst Rational& rhs); // 下文）\n};\n\ntemplate<typename\
  \ T> // 定义 operator*\n* Rational<T> operator*(const Rational<T>& lhs, // 函数\nconst\
  \ Rational<T>& rhs)\n{ ... }\n```\n\n现在，我们对 `operator*` 的混合模式调用将可以通过编译，因为当对象 `oneHalf`\
  \ 被声明为 `Rational<int>` 类型时，类 `Rational<int>` 被实例化，作为该过程的一部分，接收 `Rational<int>` 参数的友元函数\
  \ `operator*` 被自动声明。作为一个已声明的*函数*（而不是函数*模板*），编译器在调用它时可以使用隐式转换函数（如 `Rational` 的非 `explicit`\
  \ 构造函数），这就是它们让混合模式调用成功的方法。\n\n唉，在这个语境下，“成功”是一个有趣的词，因为尽管代码可以编译，但它无法链接。我们稍后会处理这个问题，但首先我想提一下在\
  \ `Rational` 内部声明 `operator*` 使用的语法。\n\n在类模板内部，模板名称可以作为模板及其参数的简写，因此在 `Rational<T>`\
  \ 内部，我们只需要写 `Rational` 而不是 `Rational<T>`。这在这个例子中只为我们节省几个字符，但当有多个参数或较长的参数名称时，它既可以节省打字量，又能让生成的代码更清晰。我提到这一点是因为\
  \ `operator*` 被声明为接收并返回 `Rational` 对象，而不是 `Rational<T>` 对象。像这样声明 `operator*` 同样有效：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename T>\nclass Rational {\npublic:\n...\nfriend\n\
  const Rational<T> operator*(const Rational<T> & lhs,\nconst Rational<T>& rhs);\n\
  ...\n};\n```\n\n然而，使用简写形式更简单（也更常见）。\n\n现在回到链接问题。混合模式代码可以编译，因为当对象 `oneHalf` 被声明为\
  \ `Rational<int>` 类型时，类 `Rational<int>` 被实例化，编译器知道我们想要调用一个接收 `Rational<int>` 的特定函数（`operator*`），但该函数在\
  \ `Rational` 内部只被*声明*而没有定义。如果我们自己在 `Rational` 模板内部声明一个函数（即我们所做的），我们就有负责定义该函数。让类外部提供\
  \ `operator*` 的定义是我们的意图，但情况并非如此。\n\n最可行的方法是将 `operator*` 的函数体合并到它的声明中：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename T>\nclass Rational {\npublic:\n...\nfriend const Rational\
  \ operator*(const Rational& lhs, const Rational& rhs)\n{ return Rational(lhs.numerator()\
  \ * rhs.numerator(), // 示例\nlhs.denominator() * rhs.denominator()); } // 译文（示例逻辑）\n\
  };\n```\n\n确实，这符合预期：混合模式调用 `operator*` 现在可以编译、链接并运行。万岁！\n\n关于这种技术的一个有趣的观察是，友元的使用与访问类的非公有部分无关。为了让所有参数的类型转换成为可能，我们需要非成员函数（第\
  \ 24 条 仍然适用）；并且为了自动实例化正确的函数，我们需要在类内部声明该函数。在类内部声明非成员函数的唯一方法是将其变为友元。这就是我们所做的。不传统吗？是的。有效吗？毫无疑问。正如第\
  \ 30 条 所解释的，类内部定义的函数被隐式声明为 `inline`，这包括像 `operator*` 这样的友元函数。你可以通过让 `operator*`\
  \ 只调用外部定义的辅助函数来减少此类 `inline` 声明的影响。在本条目的示例中，这样做并没有意义，因为 `operator*` 已经实现为单行函数，但对于更复杂的函数体，这可能是必要的。值得看一看“让友元调用辅助函数”的方法。\n\
  \n`Rational` 是模板这一意味着辅助函数通常也是模板，因此定义 `Rational` 的头文件中的代码通常如下：\n\n点击此处查看代码图像\n\n\
  ```cpp\ntemplate<typename T> class Rational; // 声明\n\n// Rational\n\n// 模板\ntemplate<typename\
  \ T> // 声明\nconst Rational<T> doMultiply(const Rational<T>& lhs, // 辅助函数\nconst\
  \ Rational<T>& rhs); // 模板\n\ntemplate<typename T>\nclass Rational {\npublic:\n\
  ...\nfriend\nconst Rational<T> operator*(const Rational<T>& lhs,\nconst Rational<T>&\
  \ rhs) // 让友元\n{ return doMultiply(lhs, rhs); } // 调用辅助函数\n\n...\n};\n```\n\n\n\n\
  许多编译器本质上强制你将所有模板定义都放在头文件中，因此你可能也需要在你的头文件中定义 `doMultiply`。（如 Item 30 解释的那样，这样的模板不需要是内联的。）它看起来像这样：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename T> // 定义\n\nconst Rational<T> doMultiply(const\
  \ Rational<T>& lhs, // 辅助函数\n\nconst Rational<T>& rhs) // 模板位于\n\n{ // 头文件中，\n\n\
  return Rational<T>(lhs.numerator() * rhs.numerator(), // 如果必要\n\nlhs.denominator()\
  \ * rhs.denominator());\n}\n```\n\n当然，作为一个模板，`doMultiply` 不会支持混合模式乘法，但它不需要支持。它只会被\
  \ `operator*` 调用，而 `operator*` *确实*支持混合模式操作！本质上，`operator*` 函数支持确保两个 `Rational`\
  \ 对象正在进行乘法所需要的任何类型转换，然后它将这两个对象传递给 `doMultiply` 模板的一个适当实例化以执行实际乘法。协同工作的效果，不是吗？\n\n\
  ### 注意事项\n\n- 当编写一个提供与模板相关的、对所有参数支持隐式类型转换的类模板时，请将这些函数定义为类模板内部的友元。\n\n### Item 47：使用特类类获取关于类型的信息\n\
  \nSTL 主要由用于容器、迭代器和算法的模板组成，但它也有几个实用型模板。其中一个就叫做 `advance`。`advance` 将指定的迭代器移动指定的距离：\n\
  \n点击此处查看代码图片\n\n```cpp\ntemplate<typename IterT, typename DistT> // 移动 iter d 个单位\n\
  \nvoid advance(IterT& iter, DistT d); // 前进；如果 d < 0，\n\n// 则向后移动 iter\n```\n\n\
  从概念上讲，`advance` 只是执行了 `iter += d`，但 `advance` 不能以此方式实现，因为只有随机访问迭代器支持 `+=` 操作。功能较弱的迭代器类型必须通过迭代应用\
  \ `++` 或 `-- d` 次来实现 `advance`。\n\n嗯，你不记得你的 STL 迭代器分类了吗？没问题，我们来做一个简短的复。迭代器分为五类，对应于它们支持的操作。*输入迭代器*只能向前移动，一次只能移动一步，只能读取它们指向的内容，且只能读取一次它们所指向的内容。它们是以指向输入文件的读取指针为原型的；C++\
  \ 库的 `istream_iterator` 都是这一类的代表。*输出迭代器*与此类似，但针对的是输出：它们只能向前移动，一次只能移动一步，只能写入它们指向的内容，且只能写入一次。它们是以指向输出文件的写入指针为原型的；`ostream_iterator`\
  \ 则是这一类的典范。这两种是功能最弱的迭代器类别。由于输入和输出迭代器只能向前移动，且最多读取或写入一次它们指向的内容，它们只适用于单遍算法。\n\n一种更强大的迭代器类别是*前向迭代器*。这种迭代器可以做输入和输出迭代器能做的一切事情，外加它们可以多次读取或写入它们指向的内容。这使得它们适用于多遍算法。STL\
  \ 没有提供单链表，但某些库提供一种（通常称为 `slist`），指向此类容器的迭代器就是前向迭代器。指向 TR1 哈希容器（参见 Item 54）的迭代器也可能属于前向类。\n\
  \n*双向迭代器*在前向迭代器的基础上增加了向后移动的能力。STL 中 `list` 的迭代器属于这一类，`set`、`multiset`、`map` 和 `multimap`\
  \ 的迭代器也是如此。\n\n最强大的迭代器类别是*随机访问迭代器*。这类迭代器在双向迭代器的基础上增加了“迭代器算术”的能力，即在常时间内向前或向跳转任意距离。这种算术类似于指针算术，这并不意外，因为随机访问迭代器是以内置指针为原型的，而内置指针可以作为随机访问迭代器。`vector`、`deque`\
  \ 和 `string` 的迭代器都是随机访问迭代器。\n\n对于五种迭代器类别，C++ 在标准库中有一个“标记结构体”（tag struct）用于标识它们：\n\
  \n点击此处查看代码图片\n\n```cpp\nstruct input_iterator_tag {};\n\nstruct output_iterator_tag\
  \ {};\n\nstruct forward_iterator_tag : public input_iterator_tag {};\n\nstruct bidirectional_iterator_tag\
  \ : public forward_iterator_tag {};\n\nstruct random_access_iterator_tag : public\
  \ bidirectional_iterator_tag {};\n```\n\n这些结构体之间的继承关系是有效的“是一个”（is-a）关系（参见 Item 32）：确实，所有前向迭代器也是输入迭代器，等等。我们很快就会看到这种继承的用处。\n\
  \n但回到 `advance`。考虑到不同的迭代器能力，实现 `advance` 的一种方法是使用最小公分数的策略，通过循环迭代地增加或减少迭代器。然而，那种方法将需要线性时间。随机访问迭代器支持常时间，我们希望在它们存在时利用这种能力。我们真正想实现的\
  \ `advance` 如下：\n\n点击此处查看代码图片\n\n```cpp\ntemplate<typename IterT, typename DistT>\n\
  \nvoid advance(IterT& iter, DistT d)\n{\n\nif ( iter 是随机访问迭代器 ) {\n\niter += d;\
  \ // 使用迭代器算术\n\n} // 用于随机访问迭代\n\nelse {\n\nif (d >= 0) { while (d--) ++iter; } //\
  \ 使用迭代调用\n\nelse { while (d++) --iter; } // 用于其他\n\n} // 迭代类别\n```\n\n这要求能够确定 `iter`\
  \ 是否为随机访问迭代器，这反过来要求它的类型 `IterT` 是一个随机访问迭代器。换句话说，我们需要获取关于类型的信息。这正是 traits 让我们做的：它们允许你在编译期间获取关于类型的信息。\n\
  \nTraits 不是 C++ 中的关键字或预定义构造；它们是一种技术以及 C++ 程序员遵循的惯例。对该技术提出的要求之一是，它对内置类型必须像对用户定义类型一样有效。由于\
  \ traits 必须适用于内置类型，这意味着像在类型内部嵌套信息是不行的，因为没有方法在指针内部嵌套信息。因此，类型的 traits 信息必须在类型外部。标准做法是将其放入一个模板和该模板的一个或多个特化中。迭代器，标准库中的模板名为\
  \ `iterator_traits`：\n\n```cpp\ntemplate<typename IterT> // 关于迭代器类型的模板\n\nstruct\
  \ iterator_traits; // 迭代器类型\n```\n\n正如你所见，`iterator_traits` 是一个结构体。惯惯，traits 总是作为结构体实现。另一个惯例是实现\
  \ traits 的结构体被称为——我不是在编造——traits *类*（traits classes）。\n\n`iterator_traits` 的工作方式是对于每个类型\
  \ `IterT`，在结构体 `iterator_traits<IterT>` 中声明一个名为 `iterator_category` 的类型定义。这个类型定义标识了\
  \ `IterT` 的迭代器类别。\n\n\n\n\n`iterator_traits` 通过两个部分实现了这一功能。首先，它要求任何用户定义的迭代器类型必须包含一个名为\
  \ `iterator_category` 的嵌套类型定义，用于标识适当的标记结构体（tag struct）。例如，`deque` 的迭代器是随机访问的，因此\
  \ `deque` 迭代器的类看起来像这样：\n\n点击此处查看代码图像\n\n```cpp\ntemplate < ... > // 省略了模板参数\n\n\
  class deque {\npublic:\n    class iterator {\n    public:\n        typedef random_access_iterator_tag\
  \ iterator_category;\n        ...\n    };\n    ...\n};\n```\n\n然而，`list` 的迭代器是双向的，因此它们将如下所示工作：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate < ... >\nclass list {\npublic:\n    class iterator\
  \ {\n    public:\n        typedef bidirectional_iterator_tag iterator_category;\n\
  \        ...\n    };\n    ...\n};\n```\n\n`iterator_traits` 只是简单地返回迭代器类中的嵌套类型定义：\n\
  \n点击此处查看代码图像\n\n```cpp\n// 类型 IterT 的 iterator_category 取决于 IterT 声明的内容；\n// 关于使用\
  \ \"typedef typename\" 的信息，请参见 Item 42\n\ntemplate<typename IterT>\nstruct iterator_traits\
  \ {\n    typedef typename IterT::iterator_category iterator_category;\n    ...\n\
  };\n```\n\n这对于用户定义的类型非常有效，但对于指针类型的迭代器则完全不起作用，因为不存在带有嵌套类型定义的指针。`iterator_traits`\
  \ 实现的第二部分处理了指针类型的迭代器。\n\n为了支持此类迭代器，`iterator_traits` 为指针类型提供了部分模板特化。指针充当了随机访问迭代器，因此这就是\
  \ `iterator_traits` 为它们指定的类别：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<typename T> // 部分模板特化\n\
  struct iterator_traits<T* > // 用于内置指针类型\n{\n    typedef random_access_iterator_tag\
  \ iterator_category;\n    ...\n};\n```\n\n到此时，你已经知道如何设计和实现一个特征类（traits class）：\n\
  \n- 识别你想要提供的关于类型信息（例如，对于迭代器，它们的迭代器类别）。\n- 选择一个名称来标识这些信息（例如 `iterator_category`）。\n\
  - 提供一个模板和一组特化版本（例如 `iterator_traits`），其中包含你想要支持的类型的信息。\n\n给定 `iterator_traits` ——\
  \ 实际上是 `std::iterator_traits`，因为它是 C++ 标准库的一部分 —— 我们可以完善 `advance` 的伪代码：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename IterT, typename DistT>\nvoid advance(IterT& iter, DistT\
  \ d)\n{\n    if (typeid (typename std::iterator_traits<IterT>::iterator_category)\
  \ ==\n    typeid (std::random_access_iterator_tag ))\n    ...\n}\n```\n\n尽管这看起来很有前景，但它并不是我们想要的。其一在于，它会导致编译问题，我们将在\
  \ Item 48 中探讨这一点；现在，有一个更根本的问题需要考虑。`IterT` 的类型在编译期间是知的，因此 `iterator_traits<IterT>::iterator_category`\
  \ 也可以在编译期间确定。然而，`if` 语句是在运行时求值的（除非你的优化器足够巧妙可以将其消除）。为什么要对可以在编译期间完成的事情放在运行时执行呢？这浪费了时间（字面上的），并导致我们的可执行文件膨。\n\
  \n我们真正想要的是一种在编译期间求值的类型条件结构（即 `if...else` 语句）。碰巧，C++ 已经有办法获得这种行为。这被称为重载。\n\n当你重载某个函数\
  \ `f` 时，你为不同的重载指定不同的参数类型。当你调用 `f` 时，编译器根据你传递的参数选择最佳重载。编译器本质上在说：“如果这个重载与传入的内容最匹配，则调用这个\
  \ `f`；如果另一个重载最匹配，则调用它；如果第三个最匹配，则调用它，”以此此类推。看到了吗？一种类型的编译时条件结构。为了让 `advance` 按照我们想要的方式工作，我们要做的只是创建多个重载函数版本，其中包含\
  \ `advance` 的“核心内容”，并声明每个版本接受不同类型的 `iterator_category` 对象。我用 `doAdvance` 来命名这些函数：\n\
  \n点击此处查看代码图像\n\n```cpp\ntemplate<typename IterT, typename DistT> // 使用此实现用于\nvoid\
  \ doAdvance(IterT& iter, DistT d, // 随机访问\nstd::random_access_iterator_tag ) //\
  \ 迭代器\n{\n    iter += d;\n}\n\ntemplate<typename IterT, typename DistT> // 使用此实现用于\n\
  void doAdvance(IterT& iter, DistT d, // 双向\nbidirectional_iterator_tag )\n{\n  \
  \  if (d >= 0) { ++iter; }\n    else { --iter; }\n}\n\ntemplate<typename IterT,\
  \ typename DistT> // 使用此实现用于\nvoid doAdvance(IterT& iter, DistT d, // 输入\niterator_tag\
  \ )\n{\n    if (d < 0 ) {\n        throw std::out_of_range(\"Negative distance\"\
  );\n    }\n    while (d--) ++iter;\n}\n```\n\n\n\n\nTR1（参见 Item 54 ）引入了一系列新的特征类，它们提供了关于类型的信息，包括\
  \ `is_fundamental<T>`（`T` 是否为内置类型）、`is_array<T>`（`T` 是否为数组类型）以及 `is_base_of<T1,\
  \ T2>`（`T1` 是否等于 `T2` 或为 `T2` 的基类）。总之，TR1 为标准 C++ 增加了 50 多个特征类。\n\n### 注意事项\n\n\
  *   特性类（Traits classes）在编译期间提供了类型信息。它们使用模板和模板特化来实现。\n*   结合函数重载，特性类使得对类型进行编译时 `if...else`\
  \ 测试成为可能。\n\n### Item 48：注意模板元编程\n\n模板元编程（TMP）是编写在编译期间执行的基于模板的 C++ 程序的过程。思考一下：一个模板元程序是用\
  \ C++ 编写的、在*C++ 编译器内部*执行运行的程序。当一个 TMP 程序运行结束时，它的输出——从模板实例化的 C++ 源代码片段——将像往一样被编译。\n\
  \n如果你觉得这完全是不可思议，那么你考虑得不够深。\n\nC++ 并不是为模板元编程设计的，但自 20 世纪 90 年代初发现 TMP 以来，它已被证明非常有用，语言及其标准库可能会添加扩展以使\
  \ TMP 变得更容易。是的，TMP 是被发现的，而不是发明的。TMP 的底层特征是在模板被引入 C++ 时引入的。所需要的只是有人注意到如何以巧妙且意想不到的方式来使用它们。\n\
  \nTMP 有两个巨大的优势。首先，它让一些原本困难或无法实现的事情变得简单。其次，由于模板元程序在 C++ 编译期间执行，它们可以将工作从运行时转移到编译时。其结果之一是某些通常在运行时检测的错误可以在编译期间发现。另一个结果是，使用\
  \ TMP 的 C++ 程序在几乎每个方面都更高效：更小的可执行文件、更短的运行时间、更低的内存需求。（然而，将工作从运行时转移到编译时的代价是编译时间增加。使用\
  \ TMP 的程序编译时间可能比它们的非 TMP 对应程序*得多*。）\n\n考虑在第 228 页引入的 STL `advance` 的伪代码。（那在 Item\
  \ 47 中。你可能现在就读那个 Item，因为在本 Item 中，我假设你已经熟悉该章节的内容。）正如第 228 页所示，我强调了代码的伪代码部分：\n\n\
  点击此处查看代码图像\n\n```cpp\ntemplate<typename IterT, typename DistT>\n\nvoid advance(IterT&\
  \ iter, DistT d)\n{\n  if ( iter is a random access iterator ) {\n    iter += d;\
  \ // 使用迭代器算术\n  } // 随机访问迭代器\n  else {\n    if (d >= 0) { while (d--) ++iter; }\
  \ // 使用迭代调用\n    else { while (d++) --iter; } // 其他迭代器使用 ++ 或 --\n  } // 迭代器分类\n\
  }\n```\n\n我们可以使用 `typeid` 让伪代码真实。这产生了一种解决此问题的“正常”C++ 方法——一种所有工作都在运行时完成的方法：\n\n点击此处查看代码图像\n\
  \n```cpp\ntemplate<typename IterT, typename DistT>\n\nvoid advance(IterT& iter,\
  \ DistT d)\n{\n  if (typeid( typename std::iterator_traits<IterT>::iterator_category)\
  \ ==\n  typeid( std::random_access_iterator_tag) ) {\n    iter += d; // 使用迭代器算术\n\
  \  } // 随机访问迭代器\n  else {\n    if (d >= 0) { while (d--) ++iter; } // 使用迭代调用\n \
  \   else { while (d++) --iter; } // 其他迭代器使用 ++ 或 --\n  } // 迭代器分类\n}\n```\n\nItem\
  \ 47 注意到这种基于 `typeid` 的方法比使用特性的方法效率低，因为使用这种方法，(1) 类型测试发生在运行时而非编译期间，并且 (2) 执行运行时类型测试的代码必须存在于可执行文件中。事实上，这个例子展示了\
  \ TMP 如何比“正常”的 C++ 程序更高效，因为特性方法*就是* TMP。记住，特性允许对类型进行编译时 `if...else` 计算。\n\n我早些提到过，某些事情在\
  \ TMP 中比在“正常”C++ 中更容易，`advance` 也是其中的一个例子。Item 47 提到基于 `typeid` 的 `advance` 实现可能会导致编译问题，这里有一个发生这种情况的例子：\n\
  \n点击此处查看代码图像\n\n```cpp\nstd::list<int>::iterator iter;\n...\nadvance(iter, 10);\
  \ // 将 iter 向移动 10 个元素；\n// 无法编译，因为：\ntemplate<typename IterT, typename DistT>\n\
  \nvoid advance(IterT& iter, DistT d)\n{\n  if (typeid( typename std::iterator_traits<IterT>::iterator_category)\
  \ ==\n  typeid( std::random_access_iterator_tag) ) {\n    iter += d; // 使用迭代器算术\n\
  \  } // 随机访问迭代器\n  else {\n    if (d >= 0) { while (d--) ++iter; } // 使用迭代调用\n \
  \   else { while (d++) --iter; } // 其他迭代器使用 ++ 或 --\n  } // 迭代器分类\n}\n```\n\nItem\
  \ 47 注意到这种基于 `typeid` 的方法比使用特性的方法效率低，因为使用这种方法，(1) 类型测试发生在运行时而非编译期间，并且 (2) 执行运行时类型测试的代码必须存在于可执行文件中。事实上，这个例子展示了\
  \ TMP 如何比“正常”的 C++ 程序更高效，因为特性方法*就是* TMP。记住，特性允许对类型进行编译时 `if...else` 计算。\n\n我之前提到过，某些事情在\
  \ TMP 中比在“正常”C++ 中更容易，`advance` 也是其中的一个例子。Item 47 提到基于 `typeid` 的 `advance` 实现可能会导致编译问题，这里有一个发生这种情况的例子：\n\
  \n点击此处查看代码图像\n\n```cpp\n（此处代码重复，已按要求省略）\n```\n\nTMP 已证明是图灵完备的，这意味着它强大到可以计算任何。使用\
  \ TMP，你可以声明变量、执行循环、编写和调用函数等。但这些构造与“正常”C++ 非常不同。例如，Item 47 展示了 TMP 中的 `if...else`\
  \ 条件是如何通过模板和模板特化实现的。但那是汇编级别的 TMP。TMP 库（例如 Boost 的 MPL ——参见 Item 55 ）提供了更高级的语法，尽管这不是你会误以为是“正常”C++。\n\
  \n为了进一步了解 TMP 中是如何运作的，让我们看看循环。TMP 没有真正的循环结构，因此循环的效果通过递归实现。（如果你不熟悉递归，你需要在进入 TMP 之前解决这个问题。它很大程度上是一门函数式语言，递归之函数式语言就像电视之美国流行文化：不可分割。）即便如此，递归也不是那种，因为\
  \ TMP 循环并不涉及递归函数调用，而是涉及递归*模板实例化*。\n\nTMP 的“你好世界”程序是在编译期间计算阶乘。这不是一个非常有趣的程序，但正如“你好世界”，作为语言介绍都很有帮助。TMP\
  \ 阶乘计算通过递归模板实例化演示了循环。它还演示了在 TMP 中创建和使用变量的一种。看：\n\n点击此处查看代码图像\n\n```cpp\ntemplate<unsigned\
  \ n> // 通用情况：值的定义\nstruct Factorial { // Factorial<n> 是 n 乘以\n// Factorial<n-1>\
  \ 的值\n  enum { value = n * Factorial<n-1>::value };\n};\n\ntemplate<> // 特殊情况：值的定义\n\
  struct Factorial<0> { // Factorial<0> 是 1\n  enum { value = 1 };\n};\n```\n\n\n\n\
  \n给定这个模板元程序（实际上只是一个单一的模板元函数 `Factorial`），你可以通过引用 `Factorial<n>::value` 来获取 `factorial(n)`\
  \ 的值。\n\n代码中的循环部分发生在模板实例化 `Factorial<n>` 引用模板实例化 `Factorial<n-1>` 的地方。像所有良好的递归一样，有一个特殊情况会导致递归终止。在这里，它就是模板特化\
  \ `Factorial<0>`。\n\n`Factorial` 模板的每个实例化都是一个 `struct`，并且每个 `struct` 都使用枚举黑客技巧（enum\
  \ hack，参见 Item 2 ）来声明一个名为 `value` 的 TMP 变量。`value` 存储了阶乘计算的当前值。如果 TMP 有真正的循环结构，`value`\
  \ 将在每次循环时时被更新。由于 TMP 使用递归模板实例化来代替循环，每个实例化都获得自己的 `value` 副本，并且每个副本都拥有了其在“循环”中对应位置的正确值。\n\
  \n你可以这样使用 `Factorial`：\n\n点击此处查看代码图像\n\n```cpp\nint main()\n{\n    std::cout <<\
  \ Factorial<5>::value; // 输出 120\n    std::cout << Factorial<10>::value; // 输出 3628800\n\
  }\n```\n\n如果你觉得这比冰淇淋还要酷，那么你已经具备了模板元程序员的潜质。如果这些模板、特化、递归实例化、枚举黑客技巧以及输入如 `Factorial<n>-1>::value`\
  \ 等内容让你起了一皮疙瘩，那么，你是一个非常普通的 C++ 程序员。\n\n当然，`Factorial` 展示 TMP 用处的程度正如“hello world”展示任何传统编程语言的用途一样。要理解为什么\
  \ TMP 值得学习，更好地了解它能实现什么是非常重要的。这里有三个例子：\n\n- **确保维度单位的正确性。** 在科学和工程应用中，确保维度单位（例如质量、距离、时间等）正确组合至关重要。例如，将表示质量的变量赋值给表示速度的变量是错误的，但将距离变量除以时间变量并将结果赋值给速度变量则是没问题的。使用\
  \ TMP，可以确保（在编译期间）程序中所有的维度单位组合都是正确的，无论计算有多复杂。（这是 TMP 如何用于早期错误检测的示例。）这种 TMP 用法的一个有趣方面是它可以支持分数的维度指数。这要求这些分数在*编译期间*进行约分，以便编译器能够确认（例如）单位\
  \ time ^(1/2) 等于 time ^(4/8)。\n\n- **优化矩阵运算。** Item 21 解释了某些函数（包括 `operator*`）必须返回新对象，Item\
  \ 44 了 `SquareMatrix` 类，因此考虑以下代码：\n\n点击此处查看代码图像\n\n```cpp\ntypedef SquareMatrix<double,\
  \ 10000> BigMatrix;\nBigMatrix m1, m2, m3, m4, m5; // 创建矩阵并\n... // 给它们赋值\nBigMatrix\
  \ result = m1 * m2 * m3 * m4 * m5; // 计算它们的积\n```\n\n以“正常”方式计算 `result` 需要创建四个临时矩阵，每个矩阵对应每次调用\
  \ `operator*` 的结果。此外，独立的乘法操作会生成一组对矩阵元素的四四层循环。使用一种与 TMP 相关的高级模板技术——*表达式模板*（expression\
  \ templates），可以消除临时变量并合并循环，而无需更改上述客户端代码的语法。生成的软件使用的内存更少，运行速度快得多。\n\n- **生成自定义设计模式实现。**\
  \ 像策略模式（Strategy，参见 Item 35)）、观察者模式（Observer）、访问者模式（Visitor）等设计模式可以用多种方式实现。使用一种基于\
  \ TMP 的技术——*策略设计*（policy-based design），可以创建表示独立设计选择（“策略”）的模板，这些模板可以以任意方式组合，产生具有自定义行为的模式实现。例如，这种技术已用于允许实现智能指针行为策略的少量模板生成（在编译期间）任何*数百种*不同的智能指针类型。将该技术扩展到设计模式和智能指针等编程产物之外，它是所谓的*生成式编程*（generative\
  \ programming）的基础。\n\nTMP 并不适合所有人。它的语法并不直观，而且工具支持很薄弱。（模板元程序的调试器？哈！）作为一种直到最近才被发现的“偶然”语言，TMP\
  \ 的编程规范仍然具有某种程度的实验性。尽管如此，通过将工作从运行时转移到编译时所带来的效率提升是令人深刻的，而且表达在运行时难以或无法实现的行为也极具吸引力。\n\
  \nTMP 的支持正在上升。C++ 的下一个版本可能会对其提供显式支持，而 TR1 已经支持了（参见 Item 54 ）。关于该主题的书籍开始出现，网络上的 TMP\
  \ 信息也变得越来越丰富。TMP 可能永远不会成为主流，但对于某些程序员——特别是库开发者来说——它几乎是一门必修课。\n\n### 注意事项\n\n- 模板元编程可以将工作从运行时转移到编译时，从而实现早期的错误检测和更高的运行时性能。\n\
  - TMP 可用于根据策略生成自定义代码，也可以避免生成不适用于类型的代码。\n\n## 8. 自定义 new 和 delete\n\n在如今拥有内置垃圾回收的计算环境中（如\
  \ Java 和 .NET），C++ 手动内存管理方法看起来有些过时。然而，许多开发应用程序的开发者选择 C++ 是因为它允许他们手动管理内存。此类开发者会研究软件的内存使用特征，并调整他们的分配和释放例，以为他们构建的系统提供最佳性能（时间和空间）。\n\
  \n这需要理解 C++ 内存管理例的行为，这正是本章的重点。游戏中的两个主要角色是分配和释放例（`operator new` 和 `operator delete`），new-handler\
  \ 是在 `operator new` 无法满足内存请求时调用的。\n\n多线程环境下的内存管理面临单线程系统中不存在的挑战，因为堆和 new-handler\
  \ 都是可修改的全局资源，受到可能干扰线程系统的竞态条件的影响。本章中的许多 Item 都提到了可修改静态数据的使用，这总是让感知线程的程序员保持高度警惕。如果没有适当的同步、无锁算法或防止并发访问的仔细设计，调用内存例很容易导致堆管理数据结构损坏。我不会反复提醒你这种危险，我在这里提一次，并假设你在本章其余部分中一直记住这一点。\n\
  \n另外一点需要记住的是，`operator new` 和 `operator delete` 仅适用于单个对象的分配。数组的内存由 `operator new[]`\
  \ 分配并由 `operator delete[]` 释放（在两种情况下，请注意函数名中的“`[] ” 部分）。除非另有说明，我关于 `operator new`\
  \ 和 `operator delete` 的所有内容也适用于 `operator new[]` 和 `operator delete[]`。\n\n\n\n\n\
  最后，请注意 STL 容器的堆内存是由容器的分配器对象管理的，而不是直接通过 `new` 和 `delete`。既然如此，本章将不再涉及 STL 分配器。\n\n\
  ### 事项 49：理解 new-handler 的行为\n\n当 `operator new` 无法满足内存分配请求时，它会抛出一个异常。在很久以前，它返回一个空指针，某些较旧的编译器仍然这样做。你仍然可以获得旧的行为（某种程度上），但我会将该讨论推迟到本事项的最后。\n\
  \n在 `operator new` 响应无法满足的内存请求抛出异常之前，它会调用一个由客户端指定的错误处理函数，称为 `new-handler`。（这并不完全准确。`operator\
  \ new` 实际执行的操作要复杂得多。细节请参阅 Item 51）。要指定内存溢出处理函数，客户端调用 `set_new_handler`，这是一个在 `<new>`\
  \ 中声明的标准库函数：\n\n点击此处查看代码图像\n\n```cpp\nnamespace std {\n\ntypedef void (*new_handler)();\n\
  \nnew_handler set_new_handler (new_handler p) throw();\n\n}\n```\n\n如你所见，`new_handler`\
  \ 是一个指向不接受参数也不返回值的函数的指针类型定义，而 `set_new_handler` 是一个接受并返回 `new_handler` 的函数。（`set_new_handler`\
  \ 声明末尾的 `throw()` 是异常规范。它本质上表示该函数不会抛出任何异常，尽管事实要有趣得多。细节请参阅 Item 29。）\n\n`set_new_handler`\
  \ 的参数是一个指向 `operator new` 在无法分配请求内存时应调用的函数的指针。`set_new_handler` 的返回值是在在调用 `set_new_handler`\
  \ 之前用于该目的生效的函数指针。\n\n你可以这样使用 `set_new_handler`：\n\n点击此处查看代码图像\n\n```cpp\n// 如果 operator\
  \ new 无法分配足够的内存时要调用的函数\n\nvoid outOfMem()\n{\n\nstd::cerr << \"Unable to satisfy\
  \ request for memory\\n\";\n\nstd::abort();\n}\n\nint main()\n{\n\nstd::set_new_handler\
  \ (outOfMem);\n\nint *pBigDataArray = new int[100000000L];\n\n...\n\n}\n```\n\n\
  如果 `operator new` 无法为 100,000,000 个整数分配空间，将调用 `outOfMem`，程序将在发出错误消息后终止。（顺便说，考虑一下如果在向\
  \ `cerr` 写错误消息的过程中必须动态分配内存会发生什么……）\n\n当 `operator new` 无法满足内存请求时，它会反复调用 `new-handler`\
  \ 函数直到找到足够的内存。导致这些重复调的代码在 Item 51 中所示，但这种高层描述已足够得出：一个良好的 `new-handler` 函数必须执行以下操作之一：\n\
  \n-   **提供更多内存。** 这可能允许 `operator new` 内部的下一次内存分配尝试成功。实现此策略的一种方法是在程序启动时分配一大块内存，然后在第一次调用\
  \ `new-handler` 时将其释放出来供程序使用。\n-   **安装一个不同的 `new-handler`。** 如果当前的 `new-handler`\
  \ 无法提供更多内存，它可能知道另一个可以提供的不同的 `new-handler`。如果是这样，当前的 `new-handler` 可以通过调用 `set_new_handler`\
  \ 在其位置安装另一个 `new-handler`。当 `operator new` 下次调用 `new-handler` 函数时，它将获取最近安装的那个。（该主题的一个变体是让\
  \ `new-handler` 修改自己的行为，以便在下次被调用时执行不同的操作。实现这一目标的方法之一是让 `new-handler` 修改影响 `new-handler`\
  \ 行为的静态、命名空间特定或全局数据。）\n-   **卸载 `new-handler`**，即向 `set_new_handler` 传递空指针。在没有安装\
  \ `new-handler` 的情况下，当内存分配失败时，`operator new` 将抛出异常。\n-   **抛出类型**为 `bad_alloc` 或某些派自\
  \ `bad_alloc` 的类型的异常。\n-   **不返回**，通常通过调用 `abort` 或 `exit` 实现。\n\n这些选择为你实现新的 `new-handlers`\
  \ 提供了相当大的灵活性。\n\n\n\n\n# 3. 如果全局 `operator new` 能够为 `Widget` 对象分配足够的内存，`Widget`\
  \ 的 `operator new` 将返回一个指向所分配内存的指针。管理全局 new-handler 的对象的析构函数会自动将全局 new-handler 恢复到调用\
  \ `Widget` 的 `operator new` 之前的状态。\n\n下面是在 C++ 中实现上述所有操作逻辑的方法。我们将从资源处理类开始，它仅包含基础的\
  \ RAII 操作：在构造函数期间获取资源，并在析构函数期间释放资源（参见 Item 13 ））：\n\n点击此处查看代码图片\n\n```cpp\nclass\
  \ NewHandlerHolder {\npublic:\n    explicit NewHandlerHolder(std::new_handler nh)\
  \ // 获取当前\n    : handler(nh) {} // new-handler\n    ~NewHandlerHolder() // 释放它\n\
  \    { std::set_new_handler(handler); }\n\nprivate:\n    std::new_handler handler;\
  \ // 记住它\n    NewHandlerHolder(const NewHandlerHolder&); // 防止拷贝\n    NewHandlerHolder&\
  \ // (参见 Item 14 )\n    operator=(const NewHandlerHolder&);\n};\n```\n\n这使得 `Widget`\
  \ 的 `operator new` 实现变得非常简单：\n\n点击此处查看代码图片\n\n```cpp\nvoid* Widget::operator new(std::size_t\
  \ size) throw(std::bad_alloc)\n{\n    NewHandlerHolder // 安装 Widget 的\n    h(std::set_new_handler(currentHandler));\
  \ // new-handler\n    return ::operator new(size); // 分配内存\n    // 或抛出异常\n} // 恢复全局\n\
  // new-handler\n```\n\n`Widget` 的客户端像这样使用其处理内存的能力：\n\n点击此处查看代码图片\n\n```cpp\nvoid\
  \ outOfMem(); // 如果为 Widget 对象\n// 内存分配失败时调用的函数声明\nWidget::set_new_handler(outOfMem);\
  \ // 将 outOfMem 设置为 Widget 的\n// 处理函数\nWidget *pw1 = new Widget; // 如果内存分配\n// 失败，调用\
  \ outOfMem\nstd::string *ps = new std::string; // 如果内存分配失败，\n// 调用全局内存处理\n// 函数（如果存在的话）\n\
  Widget::set_new_handler(0); // 将 Widget 特有的\n// 处理函数设置为\n// 无（即 null）\nWidget *pw2\
  \ = new Widget; // 如果内存分配失败，立即\n// 抛出异常。（Widget 类\n// 没有新的内存处理函数。）\n```\n\n无论类是哪种类，实现此方案的代码都是相同的，因此一个合理的目标是在其他地方复用它。实现此点的的一种简单方法是创建一个“混入式（mixin-style）”基类，即一个设计用于允许派生类继承某个特定能力的基类——在本例中，是设置类特定\
  \ new-handler 的能力。然后将基类转换为模板，这样你就能为每个继承的类获得一份不同的类数据副本。\n\n该设计的基类部分允许派生类继承它们所有需要的\
  \ `set_new_handler` 和 `operator new` 函数，而设计的模板部分确保每个继承类都获得一个不同的 `currentHandler`\
  \ 数据成员。这听起来有点复杂，但代码看起来非常令人亲切。事实上，唯一的真实区别是现在它可以被任何需要它的类使用：\n\n点击此处查看代码图片\n\n```cpp\n\
  template<typename T> // “混入式”基类用于\nclass NewHandlerSupport{ // 类特定的 set_new_handler\n\
  public: // 支持\n    static std::new_handler set_new_handler(std::new_handler p) throw();\n\
  \    static void* operator new(std::size_t size) throw(std::bad_alloc);\n    ...\
  \ // op. new 的其他版本 —\n// 参见 Item 52\nprivate:\n    static std::new_handler currentHandler;\n\
  };\n\ntemplate<typename T>\nstd::new_handler\nNewHandlerSupport<T>::set_new_handler(std::new_handler\
  \ p) throw()\n{\n    std::new_handler oldHandler = currentHandler;\n    currentHandler\
  \ = p;\n    return oldHandler;\n}\n\ntemplate<typename T>\nvoid* NewHandlerSupport<T>::operator\
  \ new(std::size_t size)\nthrow(std::bad_alloc)\n{\n    NewHandlerHolder h(std::set_new_handler(currentHandler));\n\
  \    return ::operator new(size);\n}\n// 这将每个 currentHandler 初始化为 null\ntemplate<typename\
  \ T>\nstd::new_handler NewHandlerSupport<T>::currentHandler = 0;\n```\n\n有了这个类模板，为\
  \ `Widget` 添加 `set_new_handler` 支持非常简单：`Widget` 只需要继承自 `NewHandlerSupport<Widget>`。（这看起来可能很奇怪，但我将在下文中详细解释到底发生了什么。）\n\
  \n点击此处查看代码图片\n\n```cpp\nclass Widget: public NewHandlerSupport<Widget> {\n... //\
  \ 像之前\n}; // set_new_handler\n```\n\n但也许你仍在担心 `Widget` 继承自 `NewHandlerSupport<Widget>`？如果是这样，当你注意到模板机制为每个继承类自动生成一个\
  \ `currentHandler` 静态成员时，你的担心可能会加剧。对于继承自 `NewHandlerSupport` 模板化基类的 `Widget`，不要担心这种概念让你感到困惑。它最初对每个人都有这种影响。然而，它是一个非常实用的技术，它有一个名字，尽管这个名字在人们第一次看到它时并不自然。它被称为**奇异递归模板模式**（CRTP）。\n\
  \n在某处，我发表过一篇文章建议更好的名字应该是“为我做”，因为当 `Widget` 继承自 `NewHandlerSupport<Widget>` 时，它实际上是在说“我是\
  \ `Widget`，我想继承 `NewHandlerSupport`。”没有人使用我建议的名字（甚至我也没有），但将 CRTP 视为一种“为我做”的方式有助于你理解模板化继承在做什么。\n\
  \n像 `NewHandlerSupport` 这样的模板很容易为需要它的类添加类特定的 new-handler。然而，混入式继承不可避免地会导致多继承的主题，在走上这条路径之前，你可能想阅读\
  \ Item 40 。\n\n在 1993 年之前，C++ 要求 `operator new` 在无法分配请求内存时返回 null。现在 `operator new`\
  \ 被规定为抛出 `bad_alloc` 异常，但大量的 C++ 代码在编译器开始支持修订后的规范之前编写好了。C++ 标准委员会不想放弃测试空的代码库，因此他们提供了\
  \ `operator new` 的替代形式，以提供传统的“失败返回空”行为。这些形式被称为“非抛异常（nothrow）”形式，部分是因为它们在单元 `new`\
  \ 的地方使用了 `nothrow` 对象（定义在 `<new>` 头文件中）：\n\n点击此处查看代码图片\n\n```cpp\nclass Widget {\
  \ ... };\n\nWidget *pw1 = new Widget; // 如果分配失败则抛出 bad_alloc\nif (pw1 == 0) ...\
  \ // 这个测试必须失败\n\nWidget *pw2 =new (std::nothrow) Widget; // 如果为 Widget\n// 分配失败则返回\
  \ 0\nif (pw2 == 0) ... // 这个测试可能成功\n```\n\n\n\n\nNothrow `new` 对异常的保证并没有初初看起来看起来那么靠谱。在表达式\
  \ \"`new (std::nothrow) Widget`”中，发生了两件事。首先，调用了 `operator new` 的非异常（nothrow）版本来为\
  \ `Widget` 对象分配足够的内存。如果分配失败，`operator new` 将返回空指针，正如广告宣传的那样。然而，如果分配成功，就会调用 `Widget`\
  \ 构造函数，而在那时，一切都不可控了。`Widget` 构造函数可以做任何它想做的事。它可能会自己 `new` 一些内存，如果这样做，它并不限于使用非异常的\
  \ `new`。尽管在 \"`new (std::nothrow) Widget`”中的 `operator new` 调用不会抛出异常，但 `Widget`\
  \ 构造函数可能会。如果抛出异常，异常将像常一样传播。结论是？使用 `nothrow new` 只能保证 `operator new` 不抛出异常，而不是保证像\
  \ \"`new (std::nothrow) Widget`”这样的表达式永远不会产生异常。在大多数情况下，你永远不需要 `nothrow new`。\n\n\
  无论你使用的是“正常”的（即抛出异常的）`new` 还是它那个有点残缺的非异常兄弟，理解新句柄处理程序（new-handler）的行为都是重要的，因为两种形式都会用到它。\n\
  \n### 需要记忆的项\n\n- `set_new_handler` 允许你指定一个函数，当内存分配请求无法满足时会被调用。\n- Nothrow `new`\
  \ 的用处有限，因为它只适用于内存分配；相关的构造函数调用仍可能抛出异常。\n\n### 事项 50：理解在何时替换 `new` 和 `delete` 有意义\n\
  \n让我们暂时回到基础。为什么人们最初想替换编译器提供的 `operator new` 或 `operator delete` 版本呢？这里有三个最常见的原因：\n\
  \n- **为了检测使用错误。** 未能 `delete` 由 `new` 分配的内存会导致内存泄漏。对 `new` 分配的内存使用多次 `delete` 会导致未定义行为。如果\
  \ `operator new` 维护着一个已分配地址的列表，而 `operator delete` 从列表中移除地址，就很容易检测到此类使用错误。同样，各种编程错误可能导致数据溢出（写入已分配块末尾之后）和欠出（写入已分配块起始之前）。自定义的\
  \ `operator new` 可以分配块，以便在客户端可用的内存前后留出放置已知模式（“签名”）的空间。`operator delete` 可以检查这些签名是否完完好好。如果不再完好，说明在块的生命周期内发生了溢出或欠出，`operator\
  \ delete` 可以记录这一事实以及违规指针的值。\n\n- **为了提高效率。** 编译器自带的 `operator new` 和 `operator delete`\
  \ 版本是为通用用途设计的。它们必须被长时间运行的程序（例如 Web 服务器）接受，同时也必须被执行时间小于一秒的程序接受。它们必须处理对大块内存、小块内存以及两者混合的系列请求。它们必须适应各种分配模式，从在程序运行期间持续存在的少数块的动态分配，到大量短命对象的持续分配和释放。它们必须担心堆碎片化问题，这一过程如果不加控制，最终会导致即使空闲内存分布在许多小块中，也无法满足对大块的请求。鉴于对内存的需求，编译器自带的\
  \ `operator new` 和 `operator delete` 采取中庸策略并不意外。它们对所有人来说运行得尚可，但对任何人都不是最优的。如果你对程序的动态使用模式有良好的理解，你通常会发现自定义的\
  \ `operator new` 和 `operator delete` 版本性能优于默认版本。我所说的“优于”是指它们运行更快——有时快好几个数量级——而且它们需要的内存更少——多达减少\
  \ 50%。对于某些（尽管不是所有）应用来说，将内置的 `new` 和 `delete` 替换为自定义版本是获得显著改进的一种简单方法。\n\n- **为了收集使用统计数据。**\
  \ 在开始编写自定义 `new` 和 `delete` 之前，收集有关软件如何使用动态内存的信息是明智的。分配块大小的分布是怎样的？它们生存期的分布是怎样的？它们倾向于以\
  \ FIFO（先进先出）顺序、LIFO（后进先出）顺序还是接近随机的顺序分配和释放？使用模式会随时间变化吗？例如，你的软件在执行的不同阶段是否有不同的分配/释放模式？在任何时刻使用的动态分配内存最大是多少（即其“高水位”）？自定义的\
  \ `operator new` 和 `operator delete` 版本可以轻松收集这类信息。从概念上讲，编写自定义的 `operator new` 其实很简单。例如，这里有一个全局\
  \ `operator new` 的快速实现，它有助于检测欠出和溢出。它有很多小问题，但我们稍后会考虑这些。\n\n```cpp\nstatic const int\
  \ signature = 0xDEADBEEF;\ntypedef unsigned char Byte;\n// 此代码有几个缺陷——见下文\nvoid*\
  \ operator new(std::size_t size) throw(std::bad_alloc)\n{\n    using namespace std;\n\
  \    size_t realSize = size + 2 * sizeof(int); // 增加请求的大小，以便 2//签名也能放入内部\n    void\
  \ *pMem = malloc(realSize); // 调用 malloc 获取实际\n    if (!pMem) throw bad_alloc();\
  \ // \n    // 在内存的前后部分写入签名\n    *(static_cast<int*>(pMem)) = signature;\n    *(reinterpret_cast<int*>(static_cast<Byte*>(pMem)+realSize-sizeof(int)))\
  \ = signature;\n    // 返回第一个签名之后的内存指针\n    return static_cast<Byte*>(pMem) + sizeof(int);\n\
  }\n```\n\n这个 `operator new` 的大部分缺陷在于它没有遵循该函数的 C++ 惯例。例如，事项 51 解释了所有 `operator new`\
  \ 都应该包含一个调用新句柄函数的循环，但这一个没有。然而，事项 51 专门讨论这些惯例，所以在这里我忽略它们。现在我想关注一个更微妙的问题：对齐。\n\n许多计算机架构要求特定类型的数据放置在内存的特定地址上。例如，某些架构可能要求指针出现在\
  \ 4 的倍数的地址上（即 4 字节对齐），或 `double` 必须出现在 8 的倍数的地址上（即 8 字节对齐）。未能遵循此类约束可能会导致运行时硬件异常。其他架构较为宽松，但如果满足了对齐偏好，可能会获得更好的性能。例如，在\
  \ Intel x86 架构上，`double` 可以对齐在任何字节边界，但如果它们是 8 字节对齐，访问速度会快得多。\n\n\n\n\n对齐在这里是非常相关的，因为\
  \ C++ 要求所有 `operator new` 返回的指针必须对于任何数据类型来说都是适当对齐的。`malloc` 同样遵循这一要求，因此让 `operator\
  \ new` 返回它从 `malloc` 获取的指针是安全的。然而，在上面的 `operator new` 中，我们返回的并不是从 `malloc` 获取的指针，而是从\
  \ `malloc` 获取的指针偏移了一个 `int` 大小后的指针。这并不能保证是安全的！如果客户端调用 `operator new` 来为一个 `double`\
  \ 获取足够的内存（或者，如果我们正在写 `operator new[]` 来获取一个 `double` 数组），而我们运行的机器上 `int` 是 4 字节但\
  \ `double` 要求 8 字节对齐，那么我们可能就会返回一个对齐不当的指针。这可能导致程序崩溃，也可能只是让它运行得更慢。无论何种，这可能都不是我们的初衷。\n\
  \n像对齐这样的细节，是区分专业级内存管理器与那些由忙于处理其他任务的程序员随手凑出来的内存管理器的关键。编写一个“几乎能用”的自定义内存管理器很容易。编写一个“运行良好”的则困难得多。作为一条一般原则，除非万必要，否则建议你不要尝试。\n\
  \n在很多情况下，你不需要这样做。某些编译器提供了开关，可以在其内存管理函数中启用调试和日志功能。快速浏览一下编译器的文档可能就能让你消除考虑编写 `new`\
  \ 和 `delete` 的需求。在许多平台上，商业产品可以替代编译器自带的内存管理函数。为了利用它们增强的功能和（推测）提升的性能，你所做的就是重新链接。（当然，你还得买它们。）\n\
  \n另一个选项是开源内存管理器。它们适用于许多平台，因此你可以下载并尝试这些。其中一个开源分配器是 Boost 提供的 `Pool` 库（参见条目 55）。`Pool`\
  \ 库提供了为自定义内存管理最有帮助的常见场景之一进行调优的分配器：分配大量的小对象。许多 C++ 书籍（包括本书的早先版本）都展示了高性能小对象分配器的代码，但它们通常忽略了可移植性、对齐考虑、线程安全等这些讨厌的细节。真正的库代码往往要健壮得多。即使你决定自己写\
  \ `new` 和 `delete`，查看开源版本也可能让你洞察到那些区分了“几乎可用”与“真正可用”的、易被忽视的细节。（鉴于对齐是这类细节之一，值得注意的是\
  \ `TR1`（参见条目 54）包含了发现特定类型对齐要求的支持。）\n\n本条目的的主题是了解何时全局或按类替换 `new` 和 `delete` 的默认版本是有意义的。我们现在可以比以前更详细地总结这些情况了。\n\
  \n* **为了检测使用错误**（如上文）。\n* **为了收集动态分配内存使用的统计信息**（同样如上文）。\n* **提高分配和释放速度。** 通用分配器通常（尽管并非总是）比自定义版本慢得多，特别是当自定义版本是为特定类型的对象设计的。类特定的分配器是固定大小分配器的一个应用实例，例如\
  \ Boost 的 `Pool` 库提供的分配器。如果你的应用程序是单线程的，但你编译器的默认内存管理例程是线程安全的，你可能通过编写线程不安全的分配器来获得可衡量的速度提升。当然，在得出\
  \ `operator new` 和 `operator delete` 值得加速的结论之前，务必对你的程序进行性能分析，以确认这些函数确实是瓶颈。\n* **减少默认内存管理的空间开销。**\
  \ 通用内存管理器通常（尽管并非总是）不仅比自定义版本慢，而且通常占用更多内存。这是因为它们通常会对每个分配的块产生一些开销。针对小对象调优的分配器（如 Boost\
  \ `Pool` 库中的）本质上消除了这种开销。\n* **为了补偿默认分配器的次优对齐。** 正如我之前提到的，在 x86 架构上，当 `double` 8\
  \ 字节对齐时访问最快。遗憾的是，某些编译器自带的 `operator new`并不保证 `double` 动态分配的 8 字节对齐。在这种情况下，将默认的 `operator\
  \ new` 替换为保证 8 字节对齐的版本可以大幅提高程序性能。\n* **将相关对象聚集在一起。** 如果你知道特定的数据结构通常一起使用，并且希望在处理数据时尽可能减少页错误频率，那么为这些数据结构创建一个单独的堆以便它们尽可能聚集在最少页面上将是有意义的。`new`\
  \ 和 `delete` 的放置版本（参见条目 52）可以实现这种聚集。\n* **为了获得非常规的行为。** 有时，你希望 `operator` `new`\
  \ 和 `delete` 执行一些编译器提供的版本不具备的功能。例如，你可能希望在共享内存中分配和释放块，但只有一个 C API 可用于管理该内存。编写自定义的\
  \ `new` 和 `delete`（可能是放置版本——再次参见条目 52））可以让你为 C API 套上外壳。作为另一个例子，你可能会编写自定义的 `operator\
  \ delete`，将释放的内存置零以增加数据的安全性。\n\n### 注意事项\n\n* 编写 `new` 和 `delete` 有很多理由，包括提高性能、调试使用错误以及收集使用信息。\n\
  \n### 条目 51：编写 `new` 和 `delete` 时遵循约定\n\n条目 50 解释了你可能想要编写自己的 `operator new` 和 `operator\
  \ delete` 版本，但它没有解释这样做时必须遵循的约定。这些规则并不难遵循，但有些不符合直觉，因此了解它们非常重要。\n\n我们将从 `operator\
  \ new` 开始。实现符合规范的 `operator new` 需要正确的返回值、在内存不足时调用新处理函数（参见条目 49））并做好应对无内存请求的准备。\n\
  \n`operator new` 的返回值很容易。如果你能提供请求的内存，就返回它的指针。如果不能，就遵循条目 49 中的规则并抛出 `bad_alloc` 异常。\n\
  \n然而，这并非那么简单，因为 `operator new` 实际上会尝试多次分配内存，每次失败后调用新处理函数。这里的假设是新处理函数可能能够做某些事情释放内存。只有当新处理函数的指针为空时，`operator\
  \ new` 才会抛出异常。\n\n奇怪的是，C++ 要求即使请求 0 字节，`operator new` 也要返回一个合法的指针。（要求这种看似奇怪的行为简化了语言其他地方的情况。）就如此，非成员\
  \ `operator new` 的伪代码所示：\n```\n\n\n\n\n\n点击此处查看代码图像\n\n```cpp\nvoid * operator new(std::size_t\
  \ size) throw(std::bad_alloc)\n{ // your operator new might\n    using namespace\
  \ std; // take additional params\n    if (size == 0) { // handle 0-byte requests\n\
  \        size = 1; // by treating them as\n    } // 1-byte requests\n    while (true)\
  \ {\n        attempt to allocate size bytes;\n        if (the allocation was successful\
  \ )\n            return (a pointer to the memory );\n        // allocation was unsuccessful;\
  \ find out what the\n        // current new-handling function is (see below)\n \
  \       new_handler globalHandler = set_new_handler(0);\n        set_new_handler(globalHandler);\n\
  \        if (globalHandler) (*globalHandler)();\n        else throw std::bad_alloc();\n\
  \    }\n}\n```\n\n将对 0 字节的请求处理为对 1 字节的请求这种技巧看起来有些滑头，但它简单、合法且有效，而且你到底预预期会被请求 0 字节多少次呢？\n\
  \n你可能还会对伪代码中将新-处理函数指针置为空，然后立即将其重置为原来的值感到怀疑。遗憾的是，没有办法直接获取新-处理函数指针，因此你必须调用 `set_new_handler`\
  \ 来确定它是什么。这种方法很粗糙，是的，但也有效，至少对于单线程代码是如此。在多线程环境中，你可能需要某种锁来安全地操作新-处理函数背后的（全局）数据结构。\n\
  \n项目 49 提到 `operator new` 包含一个无限循环，上面的代码显式地展示了该循环；“`while (true)` ” 已经是无限的极致了。退出循环的唯一方法是成功分配内存，或者新-处理函数执行了\
  \ 项目 49 中描述的任务之一：提供更多内存、安装不同的 new-handler、卸载 new-handler、抛出 `bad_alloc` 或其派生异常，或者无法返回。现在应该清楚为什么\
  \ new-handler 必须执行这些操作之一了。如果它没有，`operator new` 内部的循环将永远不会终止。\n\n许多人意识到 `operator\
  \ new` 成员函数会被派生类继承。这可能会导致一些有趣的复杂问题。在上面的 `operator new` 伪代码中，注意该函数尝试分配 `size` 字节（除非\
  \ `size` 为 0）。这完全合逻辑，因为那是传递给函数的参数。然而，如 项目 50 所解释的，编写自定义内存管理器的常见原因之一是为*特定*类的对象优化分配，而不是为某个类或其任何派生类。也就是说，给定一个类\
  \ `X` 的 `operator new`，该函数的行为通常是针对大小为 `sizeof(X)` 的对象调优的——不更大也不更小。然而，由于继承的存在，基类中的\
  \ `operator new` 可能会被调用为派生类对象分配内存：\n\n点击此处查看代码图像\n\n```cpp\nclass Base {\npublic:\n\
  \    static void* operator new(std::size_t size) throw(std::bad_alloc);\n    ...\n\
  };\n\nclass Derived: public Base // Derived doesn't declare\n{ ... }; // operator\
  \ new\n\nDerived *p = new Derived ; // calls Base::operator new!\n```\n\n如果 `Base`\
  \ 的类特定的 `operator new` 并非设计用于应对这种情况——而且很可能它并没有那样设计——那么它处理这种情况的最佳方法是将请求“错误”数量内存的调用交给标准的\
  \ `operator new`，如下所示：\n\n点击此处查看代码图像\n\n```cpp\nvoid * Base::operator new(std::size_t\
  \ size) throw(std::bad_alloc)\n{\n    if (size != sizeof(Base)) // if size is \"\
  wrong,\"\n        return ::operator new(size); // have standard operator\n    //\
  \ new handle the request\n    ... // otherwise handle\n    // the request here\n\
  }\n```\n\n“等一下！”我听到你大喊道，“你忘记检查 `size` 为 0 的这种病态但确实可能发生的情况！”实际上，我没有忘记，而且请在大喊时停止使用连字符。测试仍然在那里，它只是整合到了对\
  \ `size` 与 `sizeof(Base)` 的测试中。C++ 的工作方式有些神秘，其中一种方式就是规定所有独立对象的大小都是非零的（参见 项目 39）。根据定义，`sizeof(Base)`\
  \ 永远不会为 0，所以如果 `size` 为 0，请求将转发给 `::operator new`，而合理地处理该请求将成为该函数的职责。\n\n如果你想按类控制数组的内存分配，你需要实现\
  \ `operator new` 的数组特定版本：`operator new[]`。（如果你决定写 `operator new[]`，记住你不知道对象有多大，因为基类的\
  \ `operator new[]` 可能会为派生类对象分配内存，而派生类对象比基类大。因此，传递给 `operator new[]` 的 `size_t` 可能大于\
  \ `sizeof(Base)`。其次，如 项目 16 解释的，动态分配数组可能包含额外的空间来存储数量。）\n\n所以，编写 `operator new` 需要遵循的约定非常多。对于\
  \ `operator delete`，情况要简单得多。你只需要记住 C++ 保证删除空指针是安全的，所以你需要遵守这一保证。这里是非成员函数 `operator\
  \ delete` 的伪代码：\n\n点击此处查看代码图像\n\n```cpp\nvoid operator delete(void *rawMemory) throw()\n\
  {\n    if (rawMemory == 0) return; // do nothing if the\n    // pointer is being\
  \ deleted\n    deallocate the memory pointed to by rawMemory;\n}\n```\n\n该函数的成员版本也很简单，只需检查被删除内容的大小。假设你的类特定的\
  \ `operator new` 将错误的请求转发给 `::operator new`，你也必须错误的删除请求转发给 `::operator delete`：\n\
  \n点击此处查看代码图像\n\n```cpp\nclass Base { // 与之前一样，但现在\npublic:\n    static void* operator\
  \ new(std::size_t size) throw(std::bad_alloc);\n    static void operator delete(void\
  \ *rawMemory, std::size_t size) throw();\n    ...\n};\n\nvoid Base::operator delete(void\
  \ *rawMemory, std::size_t size) throw()\n{\n    if (rawMemory == 0) return; // check\
  \ for null\n    if (size != sizeof(Base)) { // if size is \"wrong,\"\n        ::operator\
  \ delete(rawMemory); // have standard operator\n        return; // delete handle\
  \ the request\n    }\n    deallocate the memory pointed to by rawMemory;\n    return;\n\
  }\n```\n\n\n\n\n\n- `operator new` 应该包含一个尝试分配内存的无限循环，如果无法满足内存请求，应该调用 `new-handler`，并且应该处理零字节的请求。类特定的版本应该处理比预期更大的块的请求。\n\
  - `operator delete` 如果传递的指针为空，则应该什么都不做。类特定的版本应该处理比预期更大的内存块。\n\n### 第 52 条：如果你写了放置\
  \ `new`，就写一个放置 `delete`\n\n放置 `new`（placement `new`）和放置 `delete`（placement `delete`）并不是\
  \ C++ 植物园中最常见的家伙，所以如果你对它们不熟悉也不担心。相反，回想第 16 条和第 17 条的内容，当你编写如下的 `new` 表达式时，\n\n```cpp\n\
  Widget *pw = new Widget;\n```\n\n会调用两个函数：一个调用 `operator new` 来分配内存，另一个调用 `Widget`\
  \ 的默认构造函数。\n\n假设第一个调用成功了，但第二个调用导致抛出异常。在这种情况下，第 1 步执行的内存分配必须被撤销。否则就会导致内存泄漏。客户端代码无法释放内存，因为如果\
  \ `Widget` 构造函数抛出异常，`pw` 永远不会被赋值。客户端将无法获取本应该释放的内存指针。因此，撤销第 1 步的责任必须由 C++ 运行时系统承担。\n\
  \n运行时系统乐意调用与第 1 步中调用的 `operator new` 版本对应的 `operator delete`，但只有当它知道哪一个 `operator\
  \ delete`——可能有很多个——是正确的调用目标时才能这样做。如果你处理的是具有正常签名的 `new` 和 `delete` 版本，这个问题就不存在，因为正常的\
  \ `operator new`，\n\n```cpp\nvoid* operator new(std::size_t) throw(std::bad_alloc);\n\
  ```\n\n对应于正常的 `operator delete`：\n\n点击此处查看代码图片\n\n```cpp\nvoid operator delete(void\
  \ *rawMemory) throw(); // 正常签名\n\n// 在全局作用域下\n\nvoid operator delete(void *rawMemory,\
  \ // 典型的正常\nstd::size_t size) throw(); // 类\n// 作用域内的签名\n```\n\n当你只使用 `new` 和 `delete`\
  \ 的正常形式时，运行时系统可以轻松找到知道如何撤销 `new` 所执行操作的 `delete`。然而，当你开始声明非正常形式的 `operator new`\
  \ 时——即带有额外参数的形式——这种“哪个 `delete` 对应哪个 `new`”的问题就会出现。\n\n例如，假设你写了一个类特定的 `operator\
  \ new`，它要求指定一个 `ostream` 用来记录分配信息，同时你又写了一个正的、类特定的 `operator delete`：\n\n点击此处查看代码图片\n\
  \n```cpp\nclass Widget {\npublic:\n...\n    static void* operator new(std::size_t\
  \ size, // 非正常的\n    std::ostream& logStream) // new 形式\n    throw(std::bad_alloc);\n\
  \    static void operator delete(void *pMemory, // 正常的类-\n    std::size_t size)\
  \ throw(); // 特定 delete\n    // 形式\n...\n};\n```\n\n这种设计是有问题的，但在我们看到原因之前，我们需要先进行一次简短的术语绕行。\n\
  \n当一个 `operator new` 函数带有额外的参数（除了强制性的 `size_t` 参数外）时，该函数被称为 `new` 的*放置（（placement）*版本。因此，上面的\
  \ `operator new` 就是一个放置版本。一个特别有用的放置 `new` 是接收一个指针来指定对象应该在哪里构造的那个。那个 `operator new`\
  \ 看起来如下：\n\n点击此处查看代码图片\n\n```cpp\nvoid* operator new(std::size_t, void *pMemory\
  \ ) throw(); // \"放置\n// new\"\n```\n\n这个版本的 `new` 是 C++ 标准库的一部分，只要你 `#include <new>`\
  \ 就可以访问它。除其他外，这个 `new` 用在 `vector` 内部，用于在 vector 的未使用容量中创建对象。它也是*原始的*放置 `new`。事实上，它就是这样被命名的：作为*放置\
  \ `new`*。这意味着“放置 `new`”这个术语被重载了。大多数时候人们谈论放置 `new` 时，指的是这个特定的函数，即接收单个类型为 `void*`\
  \ 额外参数的 `operator new`。较少的情况下，他们指的是任何带有额外参数的 `operator new` 版本。上下文通常会消除任何歧义，但理解“放置\
  \ `new`”这个通用术语意味着任何带有额外参数的 `new` 版本是重要的，因为“放置 `delete`”（我们稍后会遇到）直接派源于它。\n\n但让我们回到\
  \ `Widget` 类的定义，就是我说过设计是有问题的那个。困难之处在于，这个类将引起微妙的内存泄漏。考虑这段客户端代码，它在动态创建 `Widget` 时将分配信息记录到\
  \ `cerr`：\n\n点击此处查看代码图片\n\n```cpp\nWidget *pw = new (std::cerr) Widget; // 之前一样，但这次不会泄漏了\n\
  // 如果 Widget\n// 构造函数抛出异常\n```\n\n再次，如果内存分配成功且 `Widget` 构造函数抛出异常，运行时系统负责撤销 `operator\
  \ new` 执行的分配。然而，运行时系统实际上无法理解被调用的 `operator new` 版本是如何工作的，因此它无法撤销分配。相反，运行时系统会寻找一个与\
  \ `operator new` 具有相同数量和类型额外参数的 `operator delete` 版本，如果它找到了，它就会调用那一个。在这种情况下，`operator\
  \ new` 接收一个类型为 `ostream&` 的额外参数，因此对应的 `operator delete` 将具有这样的签名：\n\n```cpp\nvoid\
  \ operator delete(void*, std::ostream& ) throw();\n```\n\n与 `new` 的放置版本类似，带有额外参数的\
  \ `operator delete` 版本被称为*放置 `delete`（placement `delete`'s）*。在这种情况下，`Widget` 没有声明放置版本的\
  \ `operator delete`，因此运行时系统不知道如何撤销调用放置 `new` 所执行的操作。结果是它什么也没做。在这个例子中，如果 `Widget`\
  \ 构造函数抛出异常，*不会调用 operator delete*。\n\n这个规则很简单：如果带有额外参数的 `operator new` 没有相同额外参数的\
  \ `operator delete` 匹配，那么当 `new` 的内存分配需要撤销时，就不会调用 `operator delete`。为了消除上述代码中的内存泄漏，`Widget`\
  \ 需要声明一个与放置 `new` 对应的放置 `delete`：\n\n点击此处查看代码图片\n\n```cpp\nclass Widget {\npublic:\n\
  ...\n    static void* operator new(std::size_t size, std::ostream& logStream)\n\
  \    throw(std::bad_alloc);\n    static void operator delete(void *pMemory) throw();\n\
  \    static void operator delete(void *pMemory, std::ostream& logStream)\n    throw();\n\
  ...\n};\n```\n\n有了这个更改，如果该语句中的 `Widget` 构造函数抛出异常，\n\n```cpp\nWidget *pw = new (std::cerr)\
  \ Widget;\n```\n\n对应的放置 `delete` 将被自动调用，这允许 `Widget` 确保没有内存泄漏。\n\n\n\n\n\n这意味着，为了防止所有与\
  \ `new` 的定位版本（placement versions）相关的内存泄漏，你必须同时提供普通的 `operator delete`（用于构造过程中没有抛出异常的情况）以及一个接受与\
  \ `operator new` 相同额外参数的定位版本（用于抛出异常的情况）。这样做，你就再也不会为那些微妙的内存泄漏失眠了。嗯，至少不会为*这些*微妙的内存泄漏失眠了。\n\
  \n顺便提一下，由于成员函数名称会隐藏外部作用域中同名的函数（参见 Item 33 ），你需要小心，避免让类特有的 `new` 隐藏了客户端期望的其它 `new`（包括普通版本）。例如，如果你有一个基类只声明了\
  \ `operator new` 的定位版本，客户端会发现他们无法使用 `new` 的普通形式：\n\n点击此处查看代码图片\n\n```cpp\nclass\
  \ Base {\npublic:\n...\n    static void* operator new(std::size_t size, // 此 new\
  \ 隐藏了\n    std::ostream& logStream) // 普通\n    throw(std::bad_alloc); // 全局形式\n\
  ...\n};\n\nBase *pb = new Base; // 错误！operator new 的\n// 普通形式被隐藏\nBase *pb = new\
  \ (std::cerr) Base; // 好的，调用了 Base 的\n// 定位 new\n```\n\n同样，派生类中的 `operator new`\
  \ 会同时隐藏全局和继承的 `operator new` 版本：\n\n点击此处查看代码图片\n\n```cpp\nclass Derived: public\
  \ Base { // 继承自上面的 Base\npublic:\n...\n    static void* operator new(std::size_t\
  \ size) // 重定义了普通的\n// new 形式\n    throw(std::bad_alloc);\n};\n\nDerived *pd = new\
  \ (std::clog) Derived; // 错误！Base 的定位\n// new 被隐藏了\nDerived *pd = new Derived; //\
  \ 好的，调用了 Derived 的\n// operator new\n```\n\nItem 33 详尽地讨论了这种隐藏行为，但出于编写分配函数的目的，你需要记住的是，默认情况下，C++\
  \ 在全局作用域下提供了以下形式的 `operator new`：\n\n点击此处查看代码图片\n\n```cpp\nvoid* operator new(std::size_t)\
  \ throw(std::bad_alloc); // 普通 new\nvoid* operator new(std::size_t, void*) throw();\
  \ // 定位 new\nvoid* operator new(std::size_t, const std::nothrow_t&) throw(); //\
  \ nothrow new — 参见 Item 49\n```\n\n如果你在类中声明了任何 `operator new`，你将隐藏所有这些标准形式。除非你刻意阻止客户端使用这些形式，否则请确保在提供任何自定义\
  \ `operator new` 形式的同时，也让这些标准形式可用。当然，对于你提供的每一个 `operator new`，务必也要提供相应的 `operator\
  \ delete`。如果你希望这些函数按照通常的方式运行，只需让你的类特定版本调用全局版本即可。一种简单的方法是创建一个包含所有 `new` 和 `delete`\
  \ 普通形式的基类：\n\n点击此处查看代码图片\n\n```cpp\nclass StandardNewDeleteForms {\npublic:\n//\
  \ normal new/delete\n    static void* operator new(std::size_t size) throw(std::bad_alloc)\n\
  \    { return ::operator new(size); }\n    static void operator delete(void *pMemory)\
  \ throw()\n    { ::operator delete(pMemory); }\n// placement new/delete\n    static\
  \ void* operator new(std::size_t size, void *ptr) throw()\n    { return ::operator\
  \ new(size, ptr); }\n    static void operator delete(void *pMemory, void *ptr) throw()\n\
  \    { returnoperator delete(pMemory, ptr); }\n// nothrow new/delete\n    static\
  \ void* operator new(std::size_t size, const std::nothrow_t& nt) throw()\n    {\
  \ return ::operator new(size, nt); }\n    static void operator delete(void *pMemory,\
  \ const std::nothrow_t&) throw()\n    { ::operator delete(pMemory); }\n};\n```\n\
  \n想要用自定义形式增强标准形式的客户端，随后可以使用继承和 `using` 声明（参见 Item 33 ）来获取标准形式：\n\n点击此处查看代码图片\n\n\
  ```cpp\nclass Widget: public StandardNewDeleteForms { // 继承标准形式\npublic:\n    using\
  \ StandardNewDeleteForms::operator new; // 让这些\n    using StandardNewDeleteForms::operator\
  \ delete; // 形式可见\n    static void* operator new(std::size_t size, // 添加一个自定义的\n\
  \    std::ostream& logStream) // 定位 new\n    throw(std::bad_alloc);\n    static\
  \ void operator delete(void *pMemory, // 添加相应的\n    std::ostream& logStream) //\
  \ 定位 delete\n    throw();\n...\n};\n```\n\n### 需要记住的事\n\n- 当你编写定位版本的 `operator new`\
  \ 时，请确保编写相应的定位版本 `operator delete`。如果不这样做，程序可能会出现微妙的内存泄漏。\n- 当你声明 `new` 和 `delete`\
  \ 的定位版本时，请确保不要无意中隐藏了它们的普通版本。\n\n## 9. 杂杂\n\n欢迎来到这个性的性的杂杂”章节。这里只有三个 Item，但不要被它们数量之少或不起眼的设置所误导。它们很重要。\n\
  \n第一个 Item 强调编译器警告不容小视，至少如果你希望你的软件运行正常的话。第二个 Item 概述了 C++ 标准库的内容，包括 TR1 中引入的重要新功能。最后，最后一个\
  \ Item 提供了 Boost 的概述，这可能是最重要的通用型 C++ 相关网站。在没有这些 Item 信息的情况下编写有效的 C++ 软件，往好了说是一场艰苦的战斗。\n\
  \n### Item 53：注意编译器警告\n\n许多程序员经常无视编译器警告。毕竟，如果问题严重，它应该是一个错误，不是吗？这种想法在其他语言中可能相对无害，但在\
  \ C++ 中，大可以认为编译器编写者对情况的理解比你更透彻。例如，这里有一个每个人都会犯的错误：\n\n```cpp\nclass B {\npublic:\n\
  \    virtual void f() const;\n};\n\nclass D: public B {\npublic:\n    virtual void\
  \ f();\n};\n```\n\n这里的意图是让 `D::f` 重新定义虚函数 `B::f`，但有一个错误：在 `B` 中，`f` 是 `const` 成员函数，但在\
  \ `D` 中它不是 `const`。我认识的一个编译器对此这样说：\n\nwarning: D::f() 隐藏了虚函数 B::f()\n\n\n\n\n\n\
  - 不要依赖编译器警告，因为不同的编译器警告的内容各异。迁移到新编译器可能会消除你已经习惯的警告信息。\n\n### 事项 54：熟悉标准库，包括 TR1\n\n\
  C++ 的标准——即定义该语言及其库的文档——已于 1998 年通过。2003 年，发布了一次小小的“错误修复”更新。然而，标准化委员会仍在继续工作，并预计在\
  \ 2008 年左右发布“版本 2.0”的 C++ 标准。由于对该日期的存在不确定性，这解释了为什么人们通常将 C++ 的下一个版本称为“C++0x”——即 200x\
  \ 版本的 C++。\n\nC++0x 可能会包含一些有趣的新语言特性，但大多数新的 C++ 功能将以标准库新增项的形式出现。我们已经知道部分新库功能将是什么，因为它们已在一份名为\
  \ `TR1`（来自 C++ 库工作组的“技术报告 1”）的文档中进行了规范。标准化委员会保留在 `TR1` 功能正式载入 C++0x 之前对其进行修改的权利，但不太可能发生重大变化。从所有意义上来说，`TR1`\
  \ 预示着 C++ 新版本的开始——我们可以称之为标准 C++ 1.1。如果不熟悉 `TR1` 功能，你就无法成为一名高效的 C++ 程序员，因为这些功能对几乎每种库和应用程序都是一种助力。\n\
  \n在调研 `TR1` 的内容之前，回顾一下 C++98 规范的标准 C++ 库的主要部分是值得的：\n\n- **标准模板库** (`STL`)，包括容器（`vector`、`string`、`map`\
  \ 等）；迭代器；算法（`find`、`sort`、`transform` 等）；函数对象（`less`、`greater` 等）；以及各种容器和函数对象适配器（`stack`、`priority_queue`、`mem_fun`、`not1`\
  \ 等）。\n- **输入流**，包括对自定义缓冲、国际化 IO 以及预定义对象 `cin`、`cout`、`cerr` 和 `clog` 的支持。\n- **国际化支持**，包括支持多个活动区域（locales）。`wchar_t`（通常每个字符\
  \ 16 位）和 `wstring`（`wchar_t` 的 `string`）等类型便于与 Unicode 进行工作。\n- **数值处理支持**，包括复数（`complex`）和纯值数组（`valarray`）的模板。\n\
  - **异常层次结构**，包括基类 `exception`、其派生类 `logic_error` 和 `runtime_error` 以及各种继承自这些类的类。\n\
  - **C89 标准库**。1989 C 标准库中的所有内容也都在 C++ 中。\n\n如果你对上述任何内容都陌生，我建议你抽出一些高质量的时间查阅你最喜欢的\
  \ C++ 参考书来纠正这一局面。\n\n`TR1` 规范了 14 个新组件（即库功能单元）。它们都在 `std` 命名空间中，更精确地说，在嵌套命名空间 `tr1`\
  \ 中。因此，`TR1` 组件 `shared_ptr`（见下文）的全称为 `std::tr1::shared_ptr`。在本书中，我在讨论标准库组件时习惯上省略\
  \ `std::`，但我总会在 `TR1` 组件前加上 `tr1::`。\n\n本书展示了以下 `TR1` 组件的示例：\n\n- **智能指针** `tr1::shared_ptr`\
  \ 和 `tr1::weak_ptr`。`tr1::shared_ptr` 的行为类似于内置指针，但它们会记录有多少个 `tr1::shared_ptr` 指向一个对象。这被称为引用计数。当最后一个此类指针被销毁时（即对象的引用计数变为\
  \ 0 时），该对象会被自动删除。这在防止无环数据结构中的内存泄漏方面效果良好，但如果两个或多个对象包含 `tr1::shared_ptr` 导致形成循环，该循环可能会使每个对象的引用计数保持在零，即使所有指向该循环的外部指针都已销毁（即这组对象整体无法访问）。这就是\
  \ `tr1::weak_ptr` 派上用场的地方。`tr1::weak_ptr` 设计用于在无环的基于 `tr1::shared_ptr` 的数据结构充引发循环的指针。`tr1::weak_ptr`\
  \ 不参与引用计数。当指向对象的最后一个 `tr1::shared_ptr` 被销毁时，对象会被删除，即使 `tr1::weak_ptr` 仍然指向那里。然而，此类\
  \ `tr1::weak_ptr` 会被自动标记为无效。\n\n`tr1::shared_ptr` 可能是 `TR1` 中实用的组件。我在书中多次使用它，包括在\
  \ 事项 13 中，我在那里解释了它为什么如此重要。（书中没有包含 `tr1::weak_ptr` 的用法，抱歉。）\n\n- **tr1::function**，它使得表示任何与目标签名一致的可调用实体（即任何函数或函数对象）成为可能。如果我们想能够注册一个接收\
  \ `int` 并返回 `string` 的回调函数，我们可以这样做：\n\n```\ntr1::function<string(int)> func;\n```\n\
  \n- **tr1::bind**，它实现了 STL 绑定器 `bind1` 和 `bind2` 的所有功能，并包含更多。与非 TR1 之前的绑定器不同，`tr1::bind`\
  \ 可以处理 `const` 和非 `const` 成员函数。与非 TR1 之前的绑定器不同，`tr1::bind` 支持引用传递参数。与非 TR1 之前的绑定器不同，`tr1::bind`\
  \ 直接处理函数指针，因此无需在调用 `tr1::bind` 之前使用 `ptr_fun`、`mem_fun` 或 `mem_fun_ref`。简单来说，`tr1::bind`\
  \ 是一个比前代更好的第二代绑定机制。我在 事项 35 中展示了它的示例。\n\n将剩下的 `TR1` 组件分为组。第一组提供了独立的功能：\n\n- **哈希表**，用于实现集合、多集、映射和多映射。每个新容器的接口都参考了其对应的标准版本模型。TR1\
  \ 哈希表最令人惊讶的是它们的名称：`tr1::unordered_set`、`tr1::unordered_multiset`、`tr1::unordered_map`\
  \ 和 `tr1::unordered_multimap`。这些名称强调了与 `set`、`multiset`、`map` 或 `multimap` 的内容不同，TR1\
  \ 哈希容器中的元素没有规律的顺序。\n- **正则表达式**，包括对字符串进行基于正则表达式的搜索和替换操作、在匹配项之间对字符串进行迭代等功能。\n- **元组**，是标准库中已有的\
  \ `pair` 模板的精妙推广。然而，`pair` 对象只能持有两个对象，而 `tr1::tuple` 对象可以持有任意数量的对象。外籍 Python 和 Eiffel\
  \ 程序员们，高兴吧！你们故乡的一小部分已成为 C++ 的一部分。\n\n\n\n\n\n- `tr1::array`，本质上是一个“STL 化”的数组，即支持\
  \ `begin` 和 `end` 等成员函数的数组。`tr1::array` 的大小在编译期间固定；该对象不使用动态内存。\n- `tr1::mem_fn`，一种在语法上统一适配成员函数指针的方法。就像\
  \ `tr1::bind` 包含并扩展了 C++98 `bind1st` 和 `bind2nd` 的功能一样，`tr1::mem_fn` 也包含并扩展了 C++98\
  \ `mem_fun` 和 `mem_fun_ref` 的功能。\n- `tr1::reference_wrapper`，一种让引用行为更像对象的机制。除此外，这使得创建看似持有引用的容器成为可能。（实际上，容器只能持有对象或指针。）\n\
  - **随机数生成**设施，功能远优于 C++ 继承自 C 标准库的 `rand` 函数。\n- **数学特殊函数**，包括拉格尔多项式、塞尔函数、完全椭圆积分等。\n\
  - **C99 兼容性扩展**，一组旨在将许多新的 C99 特性引入 C++ 的函数和模板。\n\n第二组 TR1 组件由对更复杂的模板编程技术的支持组成，包括模板元编程（参见\
  \ Item 48 ））：\n\n- **类型特征（Type traits）**，一组特质类（参见 Item 47 )），用于提供类型的编译时信息。给定类型 `T`，TR1\
  \ 的类型特征可以揭示 `T` 是否为内置类型、是否提供虚析构函数、是否为空空类（参见 Item 39 ）、是否可以隐式转换为其他类型 `U` 等等信息。TR1\
  \ 的类型特征还可以揭示类型的适当对齐方式，对于编写自定义内存分配函数的程序员来说这是一个关键信息（参见 Item 50 ）。\n- `tr1::result_of`，一个用于推断函数调用返回类型的模板。在编写模板时，能够引用从函数（模板）返回的对象的类型通常很重要，但返回类型可能以复杂的方式取决于函数的参数类型。`tr1::result_of`\
  \ 让引用函数返回类型变得简单。`tr1::result_of` 在 TR1 自身的多个地方都被使用。\n\n尽管 TR1 中某些组件（特别是 `tr1::bind`\
  \ 和 `tr1::mem_fn`）的功能包含了某些预 TR1 组件的功能，但 TR1 是标准库的纯新增。没有一个 TR1 组件替换了现有组件，因此使用预 TR1\
  \ 构造编写的遗留代码仍然有效。\n\nTR1 本身只是一份文档。^(†) 要利用它所指定的功能，你需要实现这些功能的代码。最终，这些代码将随编译器一起发布，但当我\
  \ 2005 年写这些内容时，很有可能如果你在你的标准库实现中寻找 TR1 组件，至少会有某些是缺失的。幸运的是，在其他地方也可以寻找：TR1 中的 14 个组件有\
  \ 10 个是基于 Boost 提供的免费库（参见 Item 55 ），所以它是 TR1 类功能的极佳资源。我之所以说“类 TR1”，是因为虽然许多 TR1 功能是基于\
  \ Boost 库的，但在某些地方 Boost 的功能目前尚未完全符合 TR1 规范。\n\n如果你想使用 Boost 的类 TR1 库作为临时替代方案，直到编译器发布它们自己的\
  \ TR1 实现：\n\n```cpp\nnamespace std {\nnamespace tr1 = ::boost;\n}\n```\n\n- 主要的标准\
  \ C++ 库功能包括 STL、iostreams 和 locales（区域设置）。它还包含了 C89 标准库。\n- TR1 增加了对智能指针（例如 `tr1::shared_ptr`）、泛化函数指针（`tr1::function`）、基于哈希的容器、正则表达式以及其他\
  \ 10 个组件的支持。\n- TR1 本身只是一个规范。要利用 TR1，你需要一个实现。TR1 实现的一个来源是 Boost。\n\n### 注意事项\n\n\
  - 主要的标准 C++ 库功能包括 STL、iostreams 和 locales（区域设置）。它还包含了 C89 标准库。\n- TR1 增加了对智能指针（例如\
  \ `tr1::shared_ptr`）、泛化函数指针（`tr1::function`）、基于哈希的容器、正则表达式以及其他 10 个组件的支持。\n- TR1\
  \ 本身只是一个规范。要利用 TR1，你需要一个实现。TR1 实现的一个来源是 Boost。\n\n### Item 55: 熟悉 Boost\n\n当然，有很多\
  \ C++ 组织和网站，但 Boost 拥有两点其他组织无法比拟的优势。首先，它与 C++ 标准委员会有着与、密切且富有影响力的关系。Boost 由委员会成员创立，Boost\
  \ 成员与委员会成员之间持续存在着强重叠。此外，Boost 一直以来的目标之一是作为可以添加到标准 C++ 中的功能的测试场。这种关系的结果之一是，在 TR1\
  \ 引入 C++ 的 14 个新库（参见 Item 54 ）中，超过二之二是基于 Boost 完成的工作。\n\nBoost 的第二个特殊特性是其接受库的流程。它是基于公共评审的。如果你想向\
  \ Boost 贡献一个库，首先要在 Boost 开发者邮件列表发帖，以衡量对该库的兴趣并启动对你工作的初步审查过程。至此开启了一个被网站总结为“讨论、完善、重新提交。重复直到满意。”的循环。\n\
  \n\n\n\n最后，你决定你的库已经准备好进行正式提交了。评审经理会确认你的库是否符合 Boost 的最低要求。例如，它必须在至少两个编译器下编译（以证明名义上的移植性），并且你必须证明该库可以在接受的许可下提供（例如，该库必须允许免费的商业和非商业使用）。然后，你的提交将交给\
  \ Boost 社区进行官方评审。\n\n在评审期间，志愿者会审阅你的库材料（例如源代码、设计文档、用户文档等），并考虑诸如以下的问题：\n\n• 设计和实现得如何？\n\
  • 代码在不同编译器和操作系统之间具有可移植性吗？\n• 该库对其目标受众（即在该库所解决的领域工作的人）可能有用吗？\n• 文档是否清晰、完整且准确？\n\n\
  这些意见会发布在 Boost 邮件列表中，因此评审人员和其他人可以查看并回应彼此的评论。评审期结束后，评审经理将决定你的库是被接受、有条件接受还是被拒绝。\n\n\
  同行评审很好地将编写糟糕的库排除在 Boost 之外，但它们也能帮助库作者了解在构建工业级跨平台库的设计、实现和文档时需要考虑的因素。许多库在被宣布值得接受之前，需要经过多次官方评审。\n\
  \nBoost 包含几十个库，并不断添加新库。有时，某些库也会删除，通常是因为它们的功能被提供更强大功能或更好设计的新库所取代（例如更灵活或更高效的库）。\n\n\
  这些库在规模和范围上差异很大。在极端情况下是一些概念上只需要几行代码的库（但在添加了对错误处理和移植性的支持后，代码通常会长得多）。其中一个这样的库是 `Conversion`，它提供了更安全或更方便的转换运算符。例如，它的\
  \ `numeric_cast` 函数如果在将数值从一种类型转换为另一种类型时会导致溢出、下溢或类似的问题，它会抛出异常；而 `lexical_cast` 则让任何支持\
  \ `operator<<` 的类型转换为字符串成为可能——这对于诊断、日志等非常有用。\n\n在另一个极端是提供如此强大功能的库，甚至为它们编写了整整的书。这些包括\
  \ `Boost Graph Library`（用于对任意图结构进行编程）和 `Boost MPL Library`（“元编程库”）。\n\nBoost 的系列库涵盖了极其丰富的主题，分为十多个通用类别。这些类别包括：​​\n\
  \n• **字符串和文本处理**，包括用于类型安全的类 `printf` 格式输出的库、正则表达式（TR1 中类似功能的实现——参见项目 54 )）以及分词和解析的库。\n\
  \n• **容器**，包括具有类似 STL 接口的固定大小数组的库（参见项目 54 )）、可变大小位集和多维数组。\n\n• **函数对象和高阶编程**，包括几个作为\
  \ TR1 功能基础的库。一个非常有趣的库是 Lambda 库，它让即时创建函数对象变得如此简单，以至于你可能都没有意识到自己在做什么：\n\n```\nusing\
  \ namespace boost::lambda; // 使用 boost::lambda\n\n// 可见的功能\n\nstd::vector<int> v;\n\
  \n...\n\nstd::for_each(v.begin(), v.end(), // 对于 v 中的每个元素 x\n\nstd::cout << _1 [*]\
  \ 2 + 10 << \"\\n\" ); // 打印 x[*] 2+10;\n\n// \"_1\" 是 Lambda\n// 库的占位符\n// 代表当前元素\n\
  ```\n\n• **泛型编程**，包括大量的特质类（traits classes）（有关特性的信息参见项目 47）。\n\n• **模板元编程**（TMP —\
  \ 参见项目 48 ），包括一个用于编译时断言的库以及 Boost MPL Library。MPL 的巧妙之处之一是支持类似 STL 的编译时实体数据结构，例如类型：\n\
  \n```cpp\n// 创建一个包含三种类型的类列表编译时容器（float、\n// double 和 long double），并将容器命名为 \"floats\"\
  \ntypedef boost::mpl::list<float, double, long double> floats;\n\n// 创建一个新的新的编译时类型列表，由\
  \ \"floats\" 中的类型加上\n// 插入前面的 \"int\" 组成；将新容器命名为 \"types\"\ntypedef boost::mpl::push_front<floats,\
  \ int>::type types;\n```\n\n此类类型容器（通常被称为类型列表 typelists，尽管它们也可以基于 `mpl::vector` 以及\
  \ `mpl::list`）为各种强大且重要的 TMP 应用开启了大门。\n\n• **数学和数值**，包括用于有理数；八元数和四元数的库；最大公约数和最小公倍数的计算；以及随机数（另一个影响了\
  \ TR1 相关功能的库）。\n\n• **正确性和测试**，包括形式化隐式模板接口的库（参见项目 41 ）以及促进测试优先编程的库。\n\n• **数据结构**，包括类型安全的联合体（即存储“任何”类型）的库以及导致相应\
  \ TR1 的元组库。\n\n• **跨语言支持**，包括允许 C++ 和 Python 无缝互操作的库。\n\n• **内存**，包括用于高性能固定大小分配器的\
  \ Pool 库（参见项目 50 ）以及各种智能指针（包括但不限于 TR1 中的智能指针——参见项目 13 ）。其中一个非 TR1 的智能指针是 `scoped_array`，一种用于动态分配数组的类似\
  \ `auto_ptr` 的智能指针；项目 44 显示了一个示例用法。\n\n• **杂项**，包括用于 CRC 检查、日期时间处理以及遍历系统的库。\n\n\
  记住，这些只是你在 Boost 中找到的库的一部分。这并不是详尽列表。Boost 提供了许多功能的库，但并没有涵盖整个编程领域。例如，目前没有 GUI 开发的库，也没有与数据库通信的库。至少在我写这些时是这样。当你读到这里时，可能已经有了。唯一确定的方法就是检查。我建议你现在就去：[`boost.org`](http://boost.org)。即使你没有找到你需要的内容，你一定能在那里发现一些东西。\n\
  \n### 要记住的事情\n\n• Boost 是一个开发免费、开源、同行评审的 C++ 库的社区和网站。Boost 在 C++ 标准化方面发挥着重要作用。\n\
  • Boost 提供了许多 TR1 组件的实现，但它提供了许多其他库。\n\n## A. Beyond Effective C++\n\n*Effective\
  \ C++ 涵盖了我认为对实践 C++ 程序员最重要的通用准则，但如果你对提高效率的更多方法感兴趣，我鼓励你查看我的其他 C++ 书籍，*More Effective\
  \ C++ 和 *Effective STL。\n\n*More Effective C++ 涵盖额外的编程指南，并对效率和异常处理等主题进行了深入探讨。它还描述了重要的\
  \ C++ 编程技术，如智能指针、引用计数和代理对象。\n\n\n\n\n`Effective STL` 是一本以指南为向的书，类似于 `Effective C++`，但它专注于如何有效使用标准模板库（STL）。\n\
  \n这两本书的目录总结如下所示。\n\n## `More Effective C++` 目录\n\n## 基础\n- Item 1: 区分指针和引用\n- Item\
  \ 2: 优先使用 C++ 风格的类型转换\n- Item 3: 永远不要对数组进行多态处理\n- Item 4: 避免无的默认构造函数\n\n## 运算符\n\
  - Item 5: 警惕用户定义的转换函数\n- Item 6: 区分递增和递减运算符的前缀和后缀形式\n- Item 7: 永远不要重载 `&&`、`||`\
  \ 或 `,\n- Item 8: 理解 `new` 和 `delete` 的不同含义\n\n## 异常\n- Item 9: 使用析构函数防止资源泄漏\n-\
  \ Item 10: 在构造函数中防止资源泄漏\n- Item 11: 防止异常抛出析构函数\n- Item 12: 理解抛出异常与传递参数或调用虚函数的区别\n\
  - Item 13: 通过引用捕获异常\n- Item 14: 审慎使用异常规范\n- Item 15: 理解异常处理的成本\n\n### 效率\n- Item\
  \ 16: 记住 80/20 法则\n- Item 17: 考虑使用懒性求\n- Item 18: 分摊预期计算的成本\n- Item 19: 理解临时对象的来源\n\
  - Item 20: 促进返回值优化\n- Item 21: 通过重载来避免隐式类型转换\n- Item 22: 考虑使用 `op=` 代替独立的 `op`\n\
  - Item 23: 考虑替代库\n- Item 24: 理解虚函数、多重继承、虚基类和 RTTI 的成本\n\n### 技巧\n- Item 25: 将构造函数和非成员函数虚化\n\
  - Item 26: 限制类对象的数量\n- Item 27: 要求或禁止堆内存对象\n- Item 28: 智能指针\n- Item 29: 引用计数\n-\
  \ Item 30: 代理类\n- Item 31: 使函数相对于多个对象具有虚属性\n\n### 杂项\n- Item 32: 为未来编写程序\n- Item\
  \ 33: 使非叶子类变为抽象类\n- Item 34: 理解如何在同一程序中结合 C++ 和 C\n- Item 35: 熟悉语言标准\n\n## `Effective\
  \ STL` 目录\n\n### 第 1 章：容器\n- Item 1: 小心选择容器。\n- Item 2: 警惕容器无关代码的幻象。\n- Item 3:\
  \ 为容器中的对象使拷贝廉价且正确。\n- Item 4: 使用 `empty()` 而不是检查 `size()` 是否为零。\n- Item 5: 优先使用范围函数而非单元素对应函数。\n\
  - Item 6: 警惕 C++ 最令人困惑的解析。\n- Item 7: 使用 `new` 指针容器时，记住在容器销毁前 `delete` 掉指针。\n- Item\
  \ 8: 永远不要创建 `auto_ptr` 容器。\n- Item 9: 在删除操作中仔细选择。\n- Item 10: 注意分配器的约定和限制。\n- Item\
  \ 11: 理解自定义分配器的合法用途。\n- Item 12: 对 STL 容器的线程安全要有合理的预期。\n\n### 第 2 章：`vector` 和 `string`\n\
  - Item 13: 优先使用 `vector` 和 `string` 代替动态分配数组。\n- Item 14: 使用 `reserve` 避免重新分配。\n\
  - Item 15: 注意 `string` 实现的区别。\n- Item 16: 了解如何将 `vector` 和 `string` 数据传递给旧 API。\n\
  - Item 17: 使用“`swap` 技巧”修剪多余的容量。\n- Item 18: 避免使用 `vector<bool>`。\n\n### 第 3 章：关联容器\n\
  - Item 19: 理解相等（equality）和等价（equivalence）的区别。\n- Item 20: 为指针关联容器指定比较类型。\n- Item\
  \ 21: 始终让比较函数在值相等时返回 `false`。\n- Item 22: 避免在 `set` 和 `multiset` 中原地修改键。\n- Item\
  \ 23: 考虑用排序后的 `vector` 替换关联容器。\n- Item 24: 当效率很重要时，在 `map::operator[]` 和 `map::insert`\
  \ 之间仔细选择。\n- Item 25: 熟悉非标准的哈希容器。\n\n### 第 4 章：迭代器\n- Item 26: 优先使用 `iterator` 而非\
  \ `const_iterator`、`reverse_iterator` 和 `const_reverse_iterator`。\n- Item 27: 使用\
  \ `distance` 和 `advance` 将容器的 `const_iterator` 转换为 `iterator`。\n- Item 28: 理解如何使用\
  \ `reverse_iterator` 的基础 `iterator`。\n- Item 29: 逐字符输入考虑使用 `istreambuf_iterator`。\n\
  \n### 第 5 章：算法\n- Item 30: 确保目标范围足够大。\n- Item 31: 了解你的排序选项。\n- Item 32: 如果真的想删除某些内容，通过\
  \ `erase` 跟进类 `remove` 算法。\n- Item 33: 警惕对指针容器使用类 `remove` 算法。\n- Item 34: 注意哪些算法期望排序后的范围。\n\
  - Item 35: 通过 `mismatch` 或 `lexicographical_compare` 实现简单的不区分大小字符串比较。\n- Item 36:\
  \ 理解 `copy_if` 的正确实现。\n- Item 37: 使用 `accumulate` 或 `for_each` 总结范围。\n\n### 第 6\
  \ 章：仿函数、仿函数类、函数等\n- Item 38: 设计用于值传递的仿函数类。\n- Item 39: 使谓词成为纯函数。\n- Item 40: 使仿函数类可适配。\n\
  - Item 41: 理解 `ptr_fun`、`mem_fun` 和 `mem_fun_ref` 的原因。\n\n\n\n\n\n## 第 42 条：确保 `less<T>`\
  \ 意味着 `operator<` 。\n\n## 第 7 章：使用 STL 编程\n\n- 第 43 条：优先使用算法调用而非手写的循环。\n- 第 44 条：优先使用成员函数而非同名的算法。\n\
  - 第 45 条：区分 `count`、`find`、`binary_search`、`lower_bound`、`upper_bound` 和 `equal_range`。\n\
  - 第 46 条：考虑使用函数对象而非函数作为算法参数。\n- 第 47 条：避免只写代码。\n- 第 48 条：始终 `#include` 直接头文件。\n\
  - 第 49 条：学会解读 STL 相关的编译器诊断信息。\n- 第 50 条：熟悉 STL 相关的网站。\n\n## B. 第二版与第三版之间的条目映射\n\n\
  这《Effective C++》第三版在许多方面与第二版不同，最显著的区别是它包含了大量新信息。然而，第二版的大部分内容保留在第三版中，尽管通常是以修改后的形式和位置存在。在随后的页面表格中，我展示了第二版条目中的信息可以在第三版的何处找到，反之亦然。\n\
  \n这些表格显示的是信息的映射而非文本。例如，第二版第 39 条中的思想（“避免在继承层次结构中向下类型转换”）现在位于当前版本的第 27 条（“最小化类型转换”）中，尽管第三版中该条目的文本和示例完全全新的。一个更极端的例子涉及第二版的第\
  \ 18 条（“力求完整且的类接口”）。该条目的主要结论之一是：对于不需要特殊访问类非公有部分的潜在成员函数，通常应该是非成员函数。在第三版中，通过不同的（更强有力的）推理得到了相同的结果，因此第二版的第\
  \ 18 条映射到第三版的第 23 条（“优先使用非成员非友函数而非成员函数”），尽管这两个条目之间唯一的共同点可能就是它们的结论。\n\n![images](img/Image00017.jpg)\n\
