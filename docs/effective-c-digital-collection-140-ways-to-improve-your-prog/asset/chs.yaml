  \ 仍然是更可移植的结构。\n\n\n\n\n\n# 高效 STL\n\n## 提高标准模板库使用的 50 种具体方法\n### Scott Meyers\n\n\
  1996 年 7 月，ISO/ANSI 标准委员会宣布，命名的对象和未命名的对象都可以通过返回值优化（return value optimization）进行优化。\n\
  \n至少理论上应该是这样。但遗憾的是，某些编译器会将 `T(lhs)` 视为一种 `cast`，以移除 `lhs` 的 `const` 属性，然后将 `rhs`\
  \ 加到 `lhs` 中并返回修改后 `lhs` 的引用！在依赖上述描述的行为之前，请务必测试您的编译器。\n\n### 技巧\n\n1996 年 7 月，ISO/ANSI\
  \ 标准委员会将内联函数的默认链接（性（linkage）更改为 `external`（外部），因此我在这里描述的问题已经解决，至少在纸面上是如此。然而，您的编译器可能尚未符合标准，因此最好的办法仍然是避免使用带有静态数据的内联函数。\n\
  \n从那以后，我深信基于签名的技巧几乎是无一失的。有关细节请参阅 `http://www.aristeia.com/BookErrata/M27Comments.html`。\n\
  \n标准 C++ 库中的 `string` 类型（见第 35 项）使用了方案二和方案三的结合。非 `const` `operator[]` 返回的引用保证在下一次可能修改字符串的函数调用之前是有效的。之后，使用该引用（或其所引用的字符）将产生未定义的结果。这使得每当调用可能修改字符串的函数时，字符串的共享标记（shareability\
  \ flag）都可以重置为 `true`。\n\n事实证明这并非如此可靠。C++ 标准没有规定 `type_info::name` 的返回值，不同的实现行为也不同。一种更优的设计是使用一个封装\
  \ `type_info` 对象的容器友好型类，例如 Andrei Alexandrescu 的 `TypeInfo` 类，该类在其著作 *Modern C++\
  \ Design*（Addison Wesley, 2001）的第 2.8 节中描述。\n\n## 推荐阅读\n\n截至 2008 年 1 月，这两本杂志都已停刊。目前没有专注于\
  \ C++ 的广泛发行纸质出版物。\n\n## `auto_ptr` 的实现\n\n这主要是因为 `auto_ptr` 的规范多年来一直是一个不断变化的目标。最终规范直到\
  \ 1997 年 11 月才被采用。有关细节请参阅本书的 WWW 和 FTP 站点上的 `auto_ptr` 信息（见第 8B 页）。注意，此处描述的 `auto_ptr`\
