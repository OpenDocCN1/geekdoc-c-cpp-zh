  - 3. 如果全局 `operator new` 能够为 `Widget` 对象分配足够的内存，`Widget` 的 `operator new` 将返回一个指向所分配内存的指针。管理全局
    new-handler 的对象的析构函数会自动将全局 new-handler 恢复到调用 `Widget` 的 `operator new` 之前的状态。
    (注：此处层级可能错误)
