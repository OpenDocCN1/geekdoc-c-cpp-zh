    \ portion of this chapter explains this concept—properly referred to as an array—from\
    \ both its singular and multidimensional perspectives. The second portion of this\
    \ chapter introduces another powerful concept known as the pointer and several\
    \ other keywords and processing commands (including predefined array/string functions\
    \ and data stream manipulations). I've also included two games that end this chapter,\
    \ which allow for the application of these techniques from the perspective of\
    \ the game programmer. The game will be developed using our basic object-oriented\
    \ model, including many of the generically written subroutines listed in the previous\
    \ chapters. There are also several traditional concepts intermixed in this chapter\
    \ including bubble sorting, array searches, and calculations of mean, median,\
    \ mode, and range. (Note: Chapter 5 also offers some intermediate array and string\
    \ examples that involve an extended knowledge of classes).\n\n# Arrays\n\nArrays\
    \ are referenced values associated with the collective heap. They are instances\
    \ of the Base Class Library and thus considered objects, which also makes them\
    \ subject to the automatic garbage collector. In their simplest form, they can\
    \ be thought of as a collection"
