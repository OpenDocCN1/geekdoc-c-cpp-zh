  md: "# TimedEvent.cs\n\nTimedEvent.cs is a class representing a timer; it is used\
    \ to monitor events based on a set number of processing cycles. It can monitor\
    \ that an event happens a set number of times, etc. Deriving from this class and\
    \ overriding the Tick() method can allow for custom behavior (see Example 5.75).\n\
    \n# Example 5.75. TimedEvent.cs\n\n```\n```csharp\nusing System;\n\nnamespace\
    \ GameClasses {\n    public delegate void TickHandler(TimedEvent e, Object payload);\n\
    \n    public class TimedEvent {\n        // Member fields\n        public int\
    \ ticks;\n        public int tickCounter;\n        public bool isCountdown;\n\
    \        public bool isActive;\n        public TickHandler remoteHandler;\n  \
    \      public object payload;\n\n        public TimedEvent() {\n            ticks\
    \ = 0;\n            isCountdown = false;\n            SetTickHandler(new TickHandler(DoNothing));\n\
    \        }\n\n        public TimedEvent(TickHandler handler) {\n            SetTickHandler(handler);\n\
    \        }\n\n        public TimedEvent(int numTicks, TickHandler handler) {\n\
    \            SetCountdown(numTicks);\n            SetTickHandler(handler);\n \
    \       }\n\n        public void SetTickHandler(TickHandler handler) {\n     \
    \       remoteHandler = handler;\n        }\n    }\n```\n```"
