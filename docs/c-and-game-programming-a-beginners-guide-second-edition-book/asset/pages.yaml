    \ were class references. If no values are assigned to these references, then the\
    \ initial point would be zero and each new component would automatically increment\
    \ by one. However, we can also short step this process by beginning at some arbitrary\
    \ point, or individually declaring each value (see Example B.20).\n\n# Example\
    \ B.20.\n\n```\nclass Appendix_B {\n    public enum Months {Jan = 1, Feb, Mar,\
    \ Apr,\n        May, Jun, Jul, Aug, Sep, Oct, Nov, Dec}\n    public enum Day {AprilFools\
    \ = 1, Birthday = 16,\n        XMas = 25, Feb29 = 29, NYeve = 31}\n    public\
    \ enum Year {Year2 = 2002, Year3, LeapYear}\n    static void Main() {}\n```"
