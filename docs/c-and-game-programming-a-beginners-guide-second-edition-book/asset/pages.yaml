  md: '# ## Compiling and Executing


    While the theories of proper compilation and execution were outlined in the previous
    sections, we still haven''t established a practical method for the implementation
    of our applications. Before our programs can be executed either with or without
    an external .Net environment, they must first go through a process known as compilation.
    Hence, to start, you''ll need a computer program known as a compiler. I recommend
    Microsoft''s C# .Net in any of its packaged standards (trial, standard, professional,
    or enterprise). I''ve also included simple step-by-step instructions on how to
    set up those compilers.


