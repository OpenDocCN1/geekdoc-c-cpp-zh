    > > **Defining a Block:**

    > >

    > > A block (opening and closing brackets {}), although technically identical
    to a compound statement, can in fact refer to any set of brackets placed anywhere
    in a program. For example, the main program is enclosed by opening and closing
    brackets but is not considered as a compound statement. Blocks allow programmers
    to separate special sections of code, opening up new ways to use local variables,
    or enclose certain code including confining subroutines (discussed later in this
    chapter). When a block is nested within another block, the outer block is considered
    global to the inner block, just as code written outside of the main program is
    considered global to the program. Global and local concepts are very important
    when working with C# and will be discussed in greater detail throughout this text.


    # ## Converting from C++ to C#


    While many of us may remember the older C and C++ I/O notations, it is safe to
    assume that not everyone reading this text can do so without some type of reference.
    This section defines the C/C++ commands that were replaced by our Write and WriteLine
    extensions. When the older commands are encountered, the trick is to replace them
    with the appropriate combination of extensions and formatting strings.


    The `printf` and `cout` functions are alternatives to the Write and WriteLine
    commands, and the `scanf` and `cin` functions are alternatives to the Read and
    ReadLine commands. Like our Reads and Writes, these functions are not keywords,
    but instead they are added commands linked by the older included file structure
    (see Chapter 1). The included file that controlled these commands were `<stdio>`
    (written as `#include <cstdio>` and `#include <stdio.h>`) and `iostream` (written
    as `#include <iostream>` and `#include <iostream.h>`); `<stdio.h>` actually reaches
    back to the original C language. Printf, and for that matter scanf, have the most
    in common with C#''s notation, which becomes obvious when comparing them directly.
    For an extended list of `printf` / `scanf` notation, see Table 2.4.'
