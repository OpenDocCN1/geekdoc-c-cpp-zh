- pgno: 515
  md: '# Appendix H: Algorithms


    I''d like to take a moment to demonstrate a more explicit version of an algorithm.
    Here, every detail must be documented and made as vivid as possible, with no assumptions
    placed on the part of the programmer(s). Reasonable timelines should be developed
    with additional exit strategies placed on optional material and research. A text
    outline, drawings, and even some suggestive coding could be included with this
    model, but it should remain only a model.


    # Introduction


    Pawns is a game I developed back in the late 1980s as an alternative to a traditional
    Chess game. It resembles Chess down to its very last detail, but there''s one
    key difference: In my version, the players are no longer considered to be the
    Kings and instead are forced to choose alternative persona. They can select their
    own Queen, a Rook, Bishop, Knight, or any of their pawns, but if their player
    is captured, they''re captured, meaning that the game is over and the other player
    wins. Thus, the true purpose of the game is not to capture the King, but instead
    to attempt to capture the other player''s piece. Both sides should try their best
    to avoid revealing their identities, but at the same time they must defend the
    King and play the traditional game.


    # Basic Rules


    The game is played on an eight by eight checkered board with all sixty-four squares
    open for play (see Figure H.1). Two players, one lighter and the other darker,
    rotate between moves with the lighter player beginning the game.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_515_0.png)


    Figure H.1.'
  merge: -1
  img_proc: true
- pgno: 516
  md: 'Each player begins with sixteen characters: one King, one Queen, two Rooks,
    two Bishops, two Knights and eight Pawns. The players are lined up on opposite
    sides of the board with the lighter side placing its right-hand, or King-side
    Rook, on a lighter square. The arrangement of the key pieces is from left to right
    and is listed as follows: Queen-side Rook, Queen-side Knight, Queen-side Bishop,
    The Queen, The King, King-side Bishop, King-side Knight, and King-side Rook. The
    Pawns are then placed in the squares directly in front of them with their positions
    defining their identities, i.e., Queen-Rook''s Pawn, Queen-Knight''s Pawn, Queen-Bishop''s
    Pawn, Queen''s Pawn, King''s Pawn, King-Bishop''s Pawn, King-Knight Pawn, King-Rook''s
    Pawn. The darker side mirrors these positions (see Figure H.2). Note: The Queen''s
    of each side should be lined up vertically with the lighter Queen placed on a
    lighter square and the darker Queen placed on a darker square.


    # Figure

    H.2.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_516_0.png)


    Each player is only allowed one move per turn; no two pieces may occupy the same
    square at any one time; and a player can only capture pieces form the opponent''s
    side. Once a piece is captured, the attacking piece takes that square and the
    turn is complete. At the beginning of the game, each player is instructed to secretly
    choose a piece from their own set of characters which will represent them. The
    King is not considered a valid choice, nor are any of the opponent''s pieces;
    if a player fails to select a valid character, he automatically forfeits the game.


    Once the game is in play, it can only be terminated by one of six situations:
    1) A player''s chosen piece is captured, which immediately ends the game giving
    the win to the player that captured the piece; 2) A King is placed in checkmate,
    which also immediately terminates the game, but this time it is considered to
    be a draw; 3) A player cannot'
  merge: -1
  img_proc: true
- pgno: 517
  md: 'move any piece without placing his king in check, which would count as a draw;
    4) A player resigns, forfeiting the game, with the win going to the remaining
    player. 5) Both players agree to withdraw (in this case, the player who was ahead
    wins the game). 6) All players on either side have been captured except for King
    and the player''s choice—the game is then considered a victory for the player
    with the fewest pieces.


    # The King


    Each piece has its own set of movements. Beginning with the King, we find that
    he is subject to several limitations and one key exception: The King is only able
    to step a distance of one space, but he can move in any direction (see Figure
    H.3). He is not able to step onto a square controlled by his enemy, nor can he
    remain on a square that his enemy has taken control over; this second situation
    is known as checking the King.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_517_0.png)


    Figure H.3.


    If the King is placed in check, there are three potential solutions: 1) He can
    move to an alternative space, assuming there is one that is available that doesn''t
    break the rules listed above; 2) He or another same-side piece can capture the
    opposing piece, assuming this move can be done without leaving the King in any
    additional checks; and 3) It may be possible to block the opposing player''s line
    of attack, by placing a lesser piece between the King and his opponent. It is
    against the rules to cause a check by moving one''s own pieces if they inadvertently
    reveal a check. However, if an opponent can open a path by removing one of his
    own obstacles, it would be considered legal, or what is called a revealed check.
    If two or more piece are threatening the King (a double check) this second choice
    will be'
  merge: -1
  img_proc: true
- pgno: 518
  md: 'negated. Also, if the King is unable to relieve any and/or all checks he is
    considered to be checkmated and the game is terminated.


    A key exception to the King''s one-step rule is when he exercises his right to
    castle. Castling is a special maneuver wherein two pieces are actually displaced.
    First, the King is allowed to jump two spaces to either side, and the appropriate
    Rook is placed on the other side of him. This means that the rook will literally
    jump over the King (see Figures H.4 and H.5). There are several restrictions that
    may inhibit the maneuver:


    +   1. This must be the King''s first move;

    +   2. All spaces between the Rook and the King must be free of any pieces;

    +   3. The King must not be in check, and he must not pass or move onto a square
    that is controlled by the opponent''s side.


    Figure H.4.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_518_0.png)


    Figure H.5.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_518_1.png)'
  merge: -1
  img_proc: true
- pgno: 519
  md: '# The Queen


    The Queen is considered to be the strongest piece on the board because of her
    wide range of motion. She is capable of traveling across the entire board in one
    step, and can move vertically, horizontally, and diagonally (limited to only one
    direction per move). The Queen’s only obstacles are the other pieces, since she
    cannot leap or skip over occupied squares (see Figure H.6).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_519_0.png)


    Figure H.6.


    # The Rook


    The Rook is the next strongest piece after the Queen. It is capable of traveling
    across the entire board in one step, and is capable of both vertical and horizontal
    movements (limited to only one direction per move). The Rook cannot leap or skip
    over occupied squares (see Figure H.7).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_519_1.png)


    Figure H.7.'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# The Bishop


    The Bishop is capable of traveling across the entire board in one step, but is
    only capable of diagonal movement (limited to only one direction per move). The
    Bishop cannot leap or skip over occupied squares (see Figure H.8).


    Figure

    H.8.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_520_0.png)


    # The Knight


    The Knight is considered equivalent in strength to the Bishop. It is, however,
    the only piece that can both change directions while in play and jump over the
    other characters. It moves in what can be described as an "L" shaped pattern,
    i.e., one to two squares in any direction followed by one to two squares on a
    left or right angle (for a total of three squares—see Figure H.9).


    Figure

    H.9.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_520_1.png)'
  merge: -1
  img_proc: true
- pgno: 521
  md: '# The Pawn


    The Pawn can only move forward, straight, and diagonally to capture an opponent''s
    piece. The Pawn is only allowed one step per move, except on his first move, when
    he has the option of moving up to two steps (see Figures H.10 and H.11).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_521_0.png)


    Figure H.10.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_521_1.png)


    Figure H.11.


    Pawns also hold a special right to capture other Pawns. This special case is known
    as the "en Passant," but two conditions must be upheld: 1) The capturing Pawn
    must be on the fifth rank (ranks counted from their players side); and 2) The
    opponents Pawn must exercise his initial two-step option. The adjacent Pawn can
    then step diagonally onto the unoccupied square and take the opponent''s Pawn.
    This special right can only be executed immediately after the two-step advance.
    Also, if a Pawn reaches the other end of the board,'
  merge: -1
  img_proc: true
- pgno: 522
  md: 'he is then promoted; this can be to any one of the other ranking players—a
    Queen, Rook, Bishop, or Knight (see Figures H.12 and H.13).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_522_0.png)


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_522_1.png)'
