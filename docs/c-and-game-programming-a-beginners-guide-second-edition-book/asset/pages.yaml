  md: '![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_185_0.png)


    # Diagram 3.4 The Paddle


    **Paddle Tennis GDI+:** The GDI+ version of Paddle Tennis uses two basic shapes,
    the `FillRectangle` and the `FillEllipse`. The rectangle is used to create both
    the net and the players (the coding for the net is identical to the Windows Forms
    version). The players are constructed using a simple format, brush color, x-coordinate,
    y-coordinate, width, and height. All colors need to be declared before being referenced,
    as in `Brush WhiteBrush = new (Color.White);`, etc. The x- and y-coordinates are
    governed by the object references, as in `this.X` and `this.Y`, for whichever
    instance to which they are declared. The `Scale` component is a constant that
    is used to control the size; in this case, the value is 25, so the width is 12
    and the height 25, giving the paddle a rectangle shape.


    The ellipse, used to represent the ball, is written in the same manner, as was
    the rectangle; the color is entered first, followed by the x- and y-coordinates,
    the width, and then the height.


    # Adding Sounds Using Windows Multimedia


    Another important aspect to game programming is the use of sounds. Sounds can
    be used to enhance the overall quality of our games, and for other minor tasks
    such as system notifications, popup ads, and virus alerts. While the recording
    of our sounds won''t be handled through the .Net compiler, the storage for such
    sounds should be made part of any current project or at least as part of a central
    media base. There are two factors involved in declaring sounds: the Windows reference,
    and the executing statements (see Examples 3.27).'
  merge: -1
  img_proc: true
