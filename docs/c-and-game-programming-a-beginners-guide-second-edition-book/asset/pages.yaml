    him some limitation. After all, we cannot have him wandering off now, can we?
    The code used to stop our character''s excess motion is actually quite simple,
    just a switch statement, and some incrementing and decrementing operators. These
    statements will probably seem a bit complex and possibly confusing, but that''s
    because we''re also using them as part of both our user-defined and class-based
    methods (just remember that the principles are basically the same). If you feel
    you need a little bit more of an explanation, just have a look at the next example.
    Here, we''re looking at a method that is included as part of our first character-based
    class. When we declare an object such as Player1, Player2, or even the ball, we''ll
    gain access to that method. Now, when we want to test for those parameters, we''ll
    simply call that method by writing it out as: OurObject.DeflectPlayers (), OurObject.DeflectBall.
    Alternatively, we may want to read a value such as OurObject.Vector.ReadValue
    (), or with the key-'
