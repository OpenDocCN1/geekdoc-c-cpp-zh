    # ## Things to Remember


    +   1. An array is an aggregated set of variables that are of the same data type.
    They are linked by their location in memory and can be accessed either individually
    (by their subscripts) or as a whole (when a terminating value "\0" is assigned).

    +   2. Array subscripts can be either literal constants or variables declared
    as constants. Dynamic arrays allow for standard variables, but once declared,
    the array''s size must not be altered.

    +   3. Arrays can be passed as elements (as in array[x]), or as whole arrays (as
    in array).

    +   4. Multidimensional arrays list their rows first and then their columns.

    +   5. Linear searches compare data in a consecutive order beginning with one
    element and moving to the next, while binary searches short cut that process by
    repeatedly dividing the total by two and then searching the final nondivisible
    portion.'
