- pgno: 423
  md: "# The Keyword sealed\n\nOccasionally, we'll want to prevent other programmers\
    \ from overriding our mission critical methods. This can be done through the use\
    \ of the sealed modifier. Once a class is sealed it can no longer be inherited,\
    \ hence it cannot be overridden or altered in any other way; for this reason,\
    \ we cannot use sealed with the abstract modifier. Refer back to the structures\
    \ we learned about at the start of this chapter and note that they were also implicitly\
    \ sealed, thus they cannot be inherited (see Example 5.59).\n\n# Example 5.59.\
    \ The keyword sealed.\n\n```\n```csharp\nusing System;\nusing System.IO;\n\nnamespace\
    \ Chapter5 {\n    sealed class BankAccount {\n        public decimal InterestRate;\n\
    \        public decimal LoanRate;\n\n        // Default Constructor\n        public\
    \ BankAccount() {\n            InterestRate = .03M;\n            LoanRate = .13M;\n\
    \        }\n\n        // Overloaded Constructor\n        public BankAccount(decimal\
    \ IRate, decimal LoanRate) {\n            InterestRate = .03M;\n            LoanRate\
    \ = .13M;\n        }\n    }\n\n    class Class1 {\n        static void Main()\
    \ {\n            BankAccount account = new BankAccount ();\n        }\n    }\n\
    }\n```\n```"
