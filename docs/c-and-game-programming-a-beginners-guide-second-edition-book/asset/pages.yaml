    | 1. (True && True) | Complete evaluation | True + True = True |

    | 2. (True && False) | Complete evaluation | True + False = False |

    | 3. (False && True) | Short circuit evaluation | False + Test Skipped = False
    |

    | 4. (False && False) | Short circuit evaluation | False + Test Skipped = False
    |

    | 5. (True || True) | Short circuit evaluation | True + Test Skipped = True |

    | 6. (True || False) | Short circuit evaluation | True + Test Skipped = True |

    | 7. (False || True) | Complete evaluation | False + True = True |

    | 8. (False || False) | Complete evaluation | False + False = False |


    # Table 2.5. True and false determinations.


    As you can see, Tests 1 and 2 required complete evaluation because neither outcome
    could be determined without the second evaluation. This is not the case when using
    short circuit or partial comparison reasoning (as shown in Tests 3-8). In such
    cases, the decision to label the comparison as true or false would be done without
    the second test, and would thus save us the time and trouble of the second comparison.
    In addition, we can use this partial comparison to safeguard against runtime errors
    such as dividing by zero—see Example 2.26.


    # Example 2.26. A partial comparison used to safeguard runtime errors.


