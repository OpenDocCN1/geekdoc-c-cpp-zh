    \ This new standard produces an error rather than a warning upon any attempt to\
    \ access that unassigned memory location. The decision to change was based primarily\
    \ on the need to offset the abundance of minor errors found when those unassigned\
    \ values were represented by random data access. Understandably, if we do not\
    \ filter out those random value, our results become unpredictable and subsequently\
    \ useless in any matter of importance. Keep in mind that we have been properly\
    \ declaring and initializing variables throughout this text. Moreover, in our\
    \ last few examples, we even expanded upon the methods used to assign those variables.\
    \ However, the most practical of all the methods is to include an assignment statement\
    \ at the moment of declaration, thereby removing any chance of error (see Example\
