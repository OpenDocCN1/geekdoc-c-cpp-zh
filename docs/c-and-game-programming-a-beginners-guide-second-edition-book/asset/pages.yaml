    ```\n\n# An Introduction to Polymorphism\n\nPolymorphism (also known as overloading)\
    \ occurs when any reference has a closely matching, but not identical definition.\
    \ These secondary, or substitute functions, while not technically required, generally\
    \ tend to stay within the confines of the first function's purpose. If an overloading\
    \ function were to be altered to a degree that promoted a completely new definition,\
    \ then overloading would not be necessary. While overloading functions do share\
    \ the same referencing title, their definitions must differ in arrangement by\
    \ at least one transferring data type. The use of these differing access points\
    \ guides the compiler to the correct (overloading) function. Since more than one\
    \ possible referencing point exists, there is also an increased chance of miscalling\
    \ that function, thus creating a runtime error. Examples 2.45 and 2.46 give alternate\
    \ functions that can produce the same results, but only one is actually performing\
    \ correctly."
