- pgno: 22
  md: 'recommended that you do eventually work through those games in order to apply
    some of the more advanced concepts on object-oriented programming and .Net design.


    # Getting Help from the Author


    Since this book is meant to teach one of the vast and often expanding C languages,
    I felt that it was necessary to include a continuously updated e-mail forum and
    internet newsletter, that is, a forum that will include any new or improved features,
    including programming errors and ways to fix problems. I’d also like to encourage
    all beginner programmers by generating a list of web sites, source coding (including
    arcade style clones), and any other new developments. To register for your FREE
    internet newsletter, or to write in with a problem or request, please address
    your email to Plague@iwon.com.


    # The Student Perspective


    This book was written from the perspective of the student. Every attempt was made
    to move the reader along in a logical and progressive manner. Nearly every keyword
    and command has a working (live code) example, and when necessary, the reader
    is presented with a list of background information and troubleshooting sections
    that are usually covered by an instructor or gained in some previous programming
    language.


    There are several sections that cover the secondary steps of programming such
    as C# to Windows setups, compiler setups, and topics on game coding. The game
    coding, while considered trivial by many instructors, is one of the most effective
    ways of demonstrating C#’s object-oriented potential. Each new game is constructed
    with the intent of maximizing the use of coding studied in that chapter. The games,
    while entertaining, also force the reader to press beyond simple logic and answer
    questions that are not staged or limited to simple text based outputs.


    The chapters follow an almost evolutionary pattern that begins with the basics
    of C# and progresses through the techniques of structured, modular, and Object-Oriented
    Programming (OOP), with the last section obviously concluding with the latest
    advances in Microsoft’s .Net architecture. Both our text concepts and the games
    developed are part of that evolution, which primarily defines which games can
    and will be developed with the keywords and commands available.'
