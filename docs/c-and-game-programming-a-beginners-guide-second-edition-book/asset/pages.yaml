  md: "# The Keyword *base*\n\nAs we continue to work with inherited classes, we find\
    \ ourselves running into the problem of redundant member references or repeated\
    \ name use. This wouldn't normally create a problem, unless we also ran into the\
    \ special circumstance of needing to reference the original base member from within\
    \ an inherited class. The solution is fairly simple, achieved by applying a *base\
    \ reference indicator*, or delineated member identifier, as shown in Example 5.39.\n\
    \n> Base references can be used with all aspects of an inheriting class, but their\
    \ referencing methods cannot include a static modifier.\n\n![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_399_0.png)\n\
    \n# Example 5.39. The keyword base.\n\n```\n```csharp\nusing System;\n\nnamespace\
    \ Chapter5 {\n    public class BaseClass {\n        protected short Width, Length;\n\
    \n        public BaseClass() { }\n\n        public BaseClass(short w, short l)\
    \ {\n            Width = w;\n            Length = l;\n        }\n\n        public\
    \ static void ReadWidth(BaseClass X) {\n            Console.WriteLine(X.Width);\n\
    \        }\n        public static void ReadLength(BaseClass X) {\n           \
    \ Console.WriteLine(X.Length);\n        }\n```\n```"
