    \ characters can be transferred to string references using simple quotation marks,\
    \ these expressions can also be made literal by first noting them with the @ symbol\
    \ (see Example B.60).\n\n# Example B.60.\n\n```\n```\nclass Appendix_B {\n   \
    \ static void Main() {\n        string MyDog = \"Brownie\";\n    }\n}\n```\n```\n\
    \n# struct\n\nStructures (struct) are user-defined data types that allow for groupings\
    \ of similar or related data that do not have a single base data type. These groups\
    \ can include all the basic value data-types as well as a list of methods used\
    \ to manipulate those values. The data types declared inside a structure are referred\
    \ to as the structure's members (or fields), while their declarations are referred\
    \ to as its instances. The correlations between these internal values and structures\
    \ are usually guided by some common theme or purpose. A structure is made up of\
    \ the keyword struct, the structure's tag (or name); a list of the fields (written\
    \ as declared members); and a list of possible methods used to manipulate that\
    \ data. Structures are generally contained within a single block placed inside\
    \ our referencing namespace, but as shown in Example B.61, they can also be used\
    \ to invoke the main method."
