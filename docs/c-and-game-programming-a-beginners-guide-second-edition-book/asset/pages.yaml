  md: "# # Passing Arrays to Functions\n\nIn addition to using arrays inside of user-defined\
    \ functions, we can also pass their values either as elements or in their entirety.\
    \ The techniques for doing so are similar to passing standard arguments, but a\
    \ few minor changes should be noted. The first type we'll look at are the elements\
    \ themselves, since they require the least amount of alteration (see Example 4.9).\n\
    \n# ## Example 4.9. Passing the elements of an array.\n\n```\n```csharp\nusing\
    \ System;\n\nnamespace Chapter4 {\n    class Class1 {\n        static void Main()\
    \ {\n            string input;\n            int[] children_ages = new int[20];\n\
    \n            for (int counter = 0; counter < children_ages.Length; counter++)\
    \ {\n                Console.WriteLine(\"Enter student {0}'s age:\", (counter+1));\n\
    \                input = Console.ReadLine();\n                children_ages[counter]\
    \ = int.Parse(input);\n                Ageism(children_ages[counter]);\n     \
    \       }\n        }\n\n        static void Ageism(int tester) {\n           \
    \ if (tester > 6)\n                Console.WriteLine(\"Your child is to old.\\\
    n\");\n        }\n    }\n}\n```\n```\n\n> We can also pass arrays containing literal\
    \ constants, such as ages [0], ages [1], and ages [2], etc.\n\nWe can also reapply\
    \ this program using a call-by-reference marker as shown in Example 4.10."
