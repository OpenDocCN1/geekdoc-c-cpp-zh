- pgno: 180
  md: '# A Few Minor Details:

    Scores, Speed Settings, and Additional Graphics


    Now that we’ve plotted the characters’ motions, including our boundaries and patterns
    of deflection, and since we’ve already put together a working example of both
    the players and their ball, it would seem that there would be little else to do
    but to put all these pieces together and call it a game. This, unfortunately,
    is not the case, since there are still several issues that need to be addressed.
    For example, we’ll need a way to implement our players’ scores and a way to terminate
    the game when a player reaches a certain score. In addition, we’ll also need to
    discuss adjusting the ball’s speed, adding in the net, and controlling the serve.
    Not to worry, these are all relatively simple issues and we’ll get back to the
    fun stuff momentarily.


    # Keeping score


    Optimally, in order to maximize the reuse of our program’s coding, we’ll have
    to declare most of our variables as members of a class. These members will normally
    be stored as private members, thus, we’ll also have to create member functions
    (also known as methods) to access these values. Methods are usually referenced
    in pairs: one to store the data and another to retrieve it. At this level, however,
    we won’t worry too much about the details used to create these classes, and instead
    we’ll focus on how to use them. The two key references that control the players’
    scores are assignments and increments (see Example 3.17).


    # Example 3.17. Keeping score—step one.


    ```

    playerL.score = 0;

    playerR.score = 0;

    int score1 = playerL.score;

    int score2 = playerR.score;

    ```


    We also want to create overloaded versions of our incrementing and decrementing
    operators, which, of course, will be used to alter the players’ scores (see Example
    3.18).


    # Example 3.18. Keeping score—step two.


    ```

    playerL.score++;

    playerL.score--;

    playerR.score++;

    playerR.score--;

    ```'
