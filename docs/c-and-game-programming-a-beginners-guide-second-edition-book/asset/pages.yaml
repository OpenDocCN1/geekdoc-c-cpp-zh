  md: "+   4. While loops do not require a semicolon, but do-while loops do (as in\
    \ `do...while (something);`).\n+   \n+   5. Most compilers don’t recognize names\
    \ beyond the first thirty characters so be careful with long names that are too\
    \ similar.\n+   \n+   6. Leaving off a closing bracket usually causes several\
    \ errors. In addition, forgetting to delete an excess bracket usually causes an\
    \ unexpected error.\n+   \n+   7. Forgetting to terminate a While loop is a prime\
    \ example of a logical/runtime error. The program does everything it’s told to\
    \ do, but that causes it to become stuck. The solution is simply to cancel the\
    \ program either with a Ctrl-C or by closing the executable window with the mouse\
    \ and then rewriting the loop to include an event that will end it at the right\
    \ time. This type of error is most commonly called an *infinite loop error*.\n\
    +   \n+   8. All values should be initialized before any information is taken\
    \ from them, not doing so will result in a *corrupted data error*.\n+   \n+  \
    \ 9. Of course, you still can’t divide by zero, so don’t even try it. However,\
    \ if you fear that occasionally your data might equal zero, you’ll need to test\
    \ for that result and work around it. This can be done in many ways, but the easiest\
    \ is with the `if` statement (think about short-circuiting).\n+   \n+   10. You\
    \ cannot increment or decrement a complex variable. For example, you wouldn’t\
    \ be able to increment the sum of two numbers, e.g., `[(x+5)++]`.\n+   \n+   11.\
    \ One of the most common errors is to mistakenly reverse a less than or greater\
    \ than symbol from inside a loop’s termination sequence, causing the comparison\
    \ to never find its match: this is a typographical error that creates a runtime\
    \ error (an infinite loop).\n+   \n+   12. Did you place a semicolon at the end\
    \ of the first line of an `if` statement, `for` statement, or `switch` statement?\
    \ Doing so would indicate to the compiler that these lines are blank or null and\
    \ your block or single statement would not be viewed as part of that sequence.\n\
    +   \n+   13. Remember, from inside a function’s definition, you must declare\
    \ each data type individually as in `int one, int two`; attempting to include\
    \ them just with a comma results in a compiling error."
