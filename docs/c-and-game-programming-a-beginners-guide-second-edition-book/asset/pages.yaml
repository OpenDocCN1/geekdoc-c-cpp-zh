    # # Artificial Intelligence: Evasion


    The previous section on artificial intelligence explained the basic concepts of
    tracking and random motions, but we left out another concept commonly known as
    evasion. Evasion, in coding terms, is simply the reverse of tracking. Here, rather
    than moving closer to an object, our opponent''s characters are told to avoid
    it, thus creating the illusion of intelligently driven tactics. We''ll need to
    include a fourth function that allows for weapons fire; these functions are listed
    as Examples 3.61–3.64.'
