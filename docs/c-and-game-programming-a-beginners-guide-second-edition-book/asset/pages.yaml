  md: '# Introducing DirectX


    > The marble not yet carved can hold the form of every thought the greatest artist
    has.

    > —Michelangelo


    Managed DirectX is an alternative Application Programming Interface (API), developed
    by Microsoft, to handle the higher demands of graphic and sound programming found
    in today''s applications. Managed DirectX allows for direct access to video, sound,
    and input devices to include video cards, sounds cards, keyboards, mice, and joysticks.
    There are several components that make up Managed DirectX, including Direct3D,
    Draw, Input, Play, Sound, AudioVideoPlayback, Diagnostics, and Security, but for
    this introductory chapter, we''ll limit ourselves to the concepts and techniques
    relating to DirectDraw, Sound, and Input. We''ll also use this chapter to introduce
    several game algorithms and the concepts of character development, animation,
    collision detection, and artificial intelligence, as well as techniques to display
    both hand-drawn and rendered graphic. The benefits to using Managed DirectX include
    the elimination of the Component Object Model (COM) interoperability layer, which
    decreases code size while improving performance.


    Inside DirectX:

    DirectX gains its speed by bypassing the standard Window''s API, there are two
    underlying layers that interface with DirectX: the HAL (Hardware Abstract Layer),
    which interfaces directly with our hardware, and the HEL (Hardware'
  merge: -1
  img_proc: true
- pgno: 154
  md: '> Emulation Layer), which serves as a secondary interface. When our hardware
    does not support a certain feature or function, specific device support is given
    as a product of a Globally Unique Identifier or GUID. The advantages of using
    manufacture-composed device drivers include hardware-independence, increased performance,
    and complete access to special features and functions (see Diagram 3.1).


