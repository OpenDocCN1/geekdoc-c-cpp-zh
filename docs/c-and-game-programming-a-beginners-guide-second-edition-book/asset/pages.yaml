- pgno: 421
  md: "# The Keyword lock\n\nA lock is a temporary, mutual exclusion used to ensure\
    \ that multiple threads do not inadvertently access the same section of coding.\
    \ The specified object, must, of course, be a reference type. If the object is\
    \ a static variable, or if the critical section occurs in a static method, then\
    \ the given class' expression will usually relate to a protected instance of a\
    \ variable or type of class. Expressions are written as: lock (expression), executable\
    \ block, with the expression representing the reference type, and the statement\
    \ block representing the critical section to be protected (see Example 5.57)\n\
    \n# Example 5.57. The keyword lock.\n\n```\nusing System;\nusing System.Threading;\n\
    \nnamespace Chapter5 {\n    class MyName {\n        private string name;\n   \
    \     protected MyName(string fn) {this.name = fn;}\n        protected string\
    \ TestName(string fn) {\n            if (fn == \"Sal\") {\n                throw\
    \ new Exception(\"Welcome Home!\");\n            }\n        }\n\n        lock\
    \ (this) {\n            if (fn != null) {\n                return (\"nice to meet\
    \ you\" + this.name);\n            }\n        }\n        return \"The End\";\n\
    \    }\n\n    protected void YourName() {\n        Console.WriteLine(\"What is\
    \ your name?\");\n        string input = Console.ReadLine();\n        TestName(input);\n\
    \    }\n\n    static protected Thread[] test = new Thread[2];\n\n    public static\
    \ void Main() {\n        MyName FirstName = new MyName(\"Salvatore\");\n    }\n\
    }\n```"
  merge: -1
  img_proc: true
