  md: "The if-else statement works in basically the same manner as the if statement.\n\
    The term else implies “in all other cases,” or an “everything else here” type\
    \ situation.\nThis ability to alter the direction of our programs is effectively\
    \ defined as a programming\ntechnique. if-else, however, is still limited to two\
    \ directions, of which the second is\nnonspecific. To specify the second direction\
    \ or multiple paths, we would have to use the\nthird type of if statement known\
    \ as the else-if statement.\n\n# The else-if Statement\n\nElse-if, like else is\
    \ a dependent or secondary extension to the original if state-\nment. Yet else-if\
    \ definitely adds something new to the table. Since else-if must\nbe added after\
    \ an if statement, we'll alter the previous program once again, this\ntime giving\
