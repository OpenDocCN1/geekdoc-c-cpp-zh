  md: "# and, or, and not\n\nThere are three decision operators: and (written as &&),\
    \ or (written as ||), and not (written as !). Of these, and (&&) and or (||) are\
    \ used to combine if and else-if statements while the third operator not (!),\
    \ is used to reverse our comparison's outcomes, the operators && and || inside\
    \ the parenthetical structure of if statements (see Table 2.2). By adding an &&\
    \ or a || we can reduce wasteful and repetitive if statements. Example 2.9 shows\
    \ how the || operator can turn two ifs and six commands into one if and three\
    \ commands.\n\n| No. | Description |\n|---|---|\n| 1. | and (&&) meaning \"both\
    \ must be true for the statement to be true\"<br>if (variable1 > variable2 &&\
    \ variable2 == variable3)<br>// 20 > 10 and 10 = 10 |\n| 2. | or (||) meaning\
    \ \"only one needs to be true for the statement to be true\"<br>if (variable1\
    \ == variable2 || variable2 < variable3)<br>// 20 = 20 or 20 < 10 |\n| 3. | not\
    \ (!) meaning \"makes true statements false and false statements true\"<br>if\
    \ !(1 == 1)   // if 1 = 1 then not (true) or false<br>if !(1 == 2)   // if 1 =\
    \ 2 then not (false) or true |\n\n# Table 2.2. The and, or, and not operators\n\
    \n# Example 2.9. Reducing if statements by using the or operator.\n\n```\n```csharp\n\
