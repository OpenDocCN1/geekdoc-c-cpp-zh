- pgno: 17
  md: '# Preface


    This is an introductory textbook that covers Microsoft''s C# and game programming
    at the same time with a unique combination of traditional source coding and game
    programming techniques. Written in accordance with ECMA (European Computer Manufacturers''
    Association) certification standards, its purpose is to bring to the student everything
    taught in a traditional first semester classroom without the traditional first
    semester boredom. This book would also serve well as a second semester tutorial
    on object-oriented programming and the .Net Base Class Library. Whether you''re
    a beginner just trying to learn the C# language or an experienced programmer trying
    to find your way into the .Net programming environment (not to mention the Microsoft
    Visual Studio series), *C# and Game Programming* is the book for you.


    # How to Use this Book


    When I designed this book, I knew it had to serve two purposes: The first being
    to teach the C# language in a fun, yet practical, context, and the second to introduce
    the novice programmer to the more advanced concepts of object-oriented programming
    and .Net design. I accomplished both of these tasks by first designing a traditional
    programming text and then adding in several programming examples that simulate
    the old arcade style games of the late 1970s and early 1980s. While the games
    are enjoyable and do motivate study, their true purpose is found in their collective
    relationship to object-oriented principles. As with the game programming portions,
    the order of the traditional source coding is designed to emphasize an easy flow
    and a simple approach to programming. Nevertheless, do not interpret that to mean
    that this text won''t be a handful. The material should take several months to
    complete with its Base Class Libraries serving as an invaluable source for further
    study.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# What You''ll Need


    The graphics and sound portions of this text are based on the Windows XP (Home
    or Professional) and 2000/ME operating systems. C# as a whole will potentially
    be available on any number of operating systems, including UNIX, Linux, IBM''s
    OS/2, BeX OS, Apple-Macintosh X, and Alpha''s OpenVMS.¹ The basic requirements
    for learning the C# language include a computer and a .Net level compiler. However,
    due to current restrictions, you''ll also need to run your compiler under either
    Windows XP, 2000/NT, or ME. The hardware requirements listed to run Microsoft''s
    .Net 1.1/2.0 beta include a Pentium II Class PC with a minimum of 233 MHz, 64
    megabytes of RAM, 1.5 gigabytes of free hard drive space, 4x Speed CD-ROM, and
    a SVGA monitor. Additional components required and/or referred to in this book
    include a mouse, sound card (with speakers), and (optional) modem—see your compiler''s
    manual for additional restrictions and/or requirements.


    # What I Used


    The programs written for this text are developed with the understanding that not
    everyone can afford the very best in technologies. The compilers referenced include
    a list of student, beta, and trial editions, with the more advanced coding progressing
    into the standard and professional versions. Again, the compilers were installed
    under several Windows environments including Window''s XP through NT. I also used
    a host of hardware configurations ranging from AMD & Intel''s latest to a few
    much older AMD and Cyrix type machines.


    # About the CD-ROM


    The companion CD-ROM included with this book covers the source code (programming
    text) and several previously compiled programs, all labeled and listed in the
    order discussed in the text. Each set of programs is placed in a folder titled
    after its chapter (as in Chapter 1, Chapter 2, etc.). In addition, I have included
    an assortment of games, all meant to aid in your learning and productivity. To
    load the source codes off the CD-ROM just follow the instructions listed on the
    next page.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'To load and use the source code that accompanies this book:


    +   1. Create a new directory and/or subdirectory. This will be used to store
    the programs from the CD-ROM and the programs you create on your own. Name your
    folder and note where you place it (in the C drive, D drive, etc.), including
    which subdirectory and/or subdirectories you chose to place it under. If you use
    the default, you’ll more than likely find your lost files under: `C:\\Documents
    and settings\\YourUserName\\My Documents\\Visual Studio Projects\\ProjectsNameHere`.

    +   2. Make sure your compiler is installed and working properly.

    +   3. Load and make active the C# compiler. Close any and all nonessential windows
    (this includes the C# tour box). Closing unnecessary background programs will
    also help to speed up your system.

    +   4. Insert the CD-ROM into the appropriate drive.

    +   5. Select “Open” from the C# compiler’s file menu (see Screen Shot 1).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_19_0.png)


    +   6. From the “Open” Windows menu, select the folder titled “Source” and then
    the appropriate subfolder(s). The subfolder titled “MSNET” contains all of the
    source code for the Microsoft .Net compiler(s)² (see Screen Shots 2 and 3).'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_20_0.png)


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_20_1.png)


    7. Select “Save As” from that file’s menu and save it to the directory you created
    in Step 1 (see Screen Shot 4).


