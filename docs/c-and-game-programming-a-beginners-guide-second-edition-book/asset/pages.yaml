    > Note

    > C# includes a localized reference when dealing with variables declared as part
    of the for loop. Thus any secondary for loops using the same variable name would
    also have to be redeclared. This differs from C++, which only asks for a second
    declaration if the variable falls out of scope.


    You also should have noticed that our first array didn''t have any individual
    values, i.e., the elements of the first dimension were actually only the first
    element of each of the secondary arrays. This is usually described as an array
    of arrays, but that tends to confuse people. The best way to think about it is
    as a set of single arrays listed together in a single column as demonstrated in
    Example 4.13.


