  md: "# The is Operator\n\nAs we move into the use of interfaces, we'll need to test\
    \ objects for compatibility errors. These tests can be done most efficiently with\
    \ the is operator. The keyword is, then, is a practical expression used to determine\
    \ if an object included at runtime is compatible with a given type. The is operator\
    \ will then evaluate to true if both of the following conditions are met: The\
    \ expression must not return a null value, and the expression can be cast to type\
    \ (meaning that the expression will not throw an exception).\n\n![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_420_0.png)\n\
    \n> > A compile-time warning will also be issued if the expression is always shown\
    \ to be either true or false, and the is operator cannot be overloaded (see Example\
    \ 5.56).\n\n# Example 5.56. The is operator.\n\n```\n```csharp\nusing System;\n\
    \nnamespace Chapter5 {\n    class TestClass {\n        /* Empty */\n    }\n\n\
    \    public class Class1 {\n        public static void Test(object ob) {\n   \
    \         TestClass test;\n\n            if (ob is TestClass) {\n            \
    \    test = (TestClass)ob;\n                Console.WriteLine(\"True\");\n   \
    \         }\n            else {\n                Console.WriteLine(\"false\");\n\
    \            }\n        }\n\n        public static void Main() {\n           \
    \ TestClass TC = new TestClass();\n            Test(TC);\n        }\n    }\n}\n\
    ```\n```"
  merge: -1
