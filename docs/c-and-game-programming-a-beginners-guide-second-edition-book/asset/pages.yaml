  md: '14. Remember C# requires that all case statements conclude with a break reference.


    15. Remember the `out` statement replaces the `ref` statement when defining calls-by-reference.


    Things to Remember


    1. *If* statements are used with limited comparisons, while *switch* statements
    are used in multiple cases.

    2. A compound statement is a set of statements that are contained between braces.

    3. Mathematical shortcuts should only be used if they make things simpler to read.
    (Note: Some compilers will convert these shortcuts into faster running code.)

    4. `System.Console.Write`, and using `System;` with `Console.Write` do exactly
    the same thing.

    5. The *while* loop test and then runs its first cycle, whereas the *do-while*
    loop runs first and tests after running its first cycle.

    6. You''ll have to remember everything about predefined and user-defined functions.
    The best way to remember them is through practice, so I''ll include as many as
    I can—the rest you''ll have to practice on your own.

    7. Remember C# doesn''t require function prototypes or included files.

    8. Calls-by-reference can completely replace global variables.

    9. Overloaded functions must not contain the same arrangement of passing variables.

    10. Recursion means nothing more than repeating the same function from within
    that function.

    11. When writing a statement that stretches over a single line try to break it
    up. Break at a comma or other marking to make the split easier to read.'
