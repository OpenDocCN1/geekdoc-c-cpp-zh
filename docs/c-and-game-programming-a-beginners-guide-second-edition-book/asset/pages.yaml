    \ {/* * /}\n}\n```\n\n# goto\n\nThe goto statement is probably the most picked-on\
    \ of all the keywords. Its use is consider poor programming habit, yet somehow\
    \ it manages to endure. Its fault lies in its ability to transgress order; the\
    \ C# help files even mark it as useful way of getting out of nested statements,\
    \ but, of course, that would be breaking the rules. Still, there is at least one\
    \ practical reason for using the goto statement in C#, which is to allow for artificial\
    \ drops when dealing with switch statements. Remember C# no longer allows us to\
    \ drop between switch statements that contain executable statements, so goto makes\
    \ a good fix. C#'s goto also has some limitations, including not being able to\
    \ jump into localized block or between classes, nor should it be used to alter\
    \ our try-catch blocks (see Example B.30).\n\n# Example B.30.\n\n```\nclass Appendix\
    \ B {\n    static void Main() {\n        char Character = '1';\n        switch\
    \ (Character) {\n            case '1':\n                goto case2;\n        \
    \        break;\n            case '2':\n                case2:\n             \
    \   goto case3;\n                break;\n            case '3':\n             \
    \   case3:\n                break;\n        }\n    }\n}\n```\n\n# if\n\nThe if\
    \ statement is a conditional statement that tests an expression or set of expressions\
    \ and executes a statement or block of statements when that expression is found\
    \ to be true (see Example B.31)."
