  md: '# # Type Casting: Explicit Conversions


    Before we jump into user-defined functions, let’s cover one additional topic that
    actually allows the conversion of numeric data into other various sized data types
    without those annoying warnings about truncation and undue data loss. Remember
    that in Chapter 1 we covered implicit conversions, which generally fell under
    the category of smaller to larger transfers of data. *Type casting* is an explicit
    conversion and is used for conversion from smaller to larger to protect against
    calculating errors, or larger to smaller to redefine those parameters when a value’s
    precision overshadows its requirement (see Text Examples 1 and 2). In either case,
    the action of declaring an explicit conversion notifies the compiler of our intention
    and automatically reassigns those variables.


    # Text Example 1:


    When a value is larger than is required for practical purposes, that value can
    be truncated to save space or to refine the final displayed statement, e.g., $10.012
    becoming $10.01, the amount owed.


    # Text Example 2:


    When an irrational number is the result doing integer mathematics, the value is
    always truncated to an integer value. This will happen regardless of the assigned
    variables data type and without regard for the truncating variables true value.
    For example, in the equation 9 divided by 2, the real quotient should be 4.5,
    but after truncating, using rules of integer division, we are left with the value
    of 4. Although incorrect, this is the value passed to the variable, even if that
    variable is of a floating-point data type. The simplest way to correct this is
    to make at least one of the values a real number, for example 9.0/2 equals 4.5.
    However, the problem here is that this type of change only works for literal constants
    and not for variables that hold integer data (as in x = 9, y = 2, x/y yielding
    4). A more creative solution would be to use type casting. Type casting, as explained
    above, allows us to convert both literal constants and variables by using data
    type conversions, e.g., *(double)*9 or *double*(9) (see Example 2.30).


    # Example 2.30. Type casting.


