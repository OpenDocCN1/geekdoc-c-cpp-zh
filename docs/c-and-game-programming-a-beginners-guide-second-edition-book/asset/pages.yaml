  md: "# # Building Game Classes\n\nAs with previous games, our next two also rely\
    \ on a set of classes, their instances, and a host of methods that manipulate\
    \ data to produce what we see as our cyber creations. These instances and their\
    \ components were constructed using the knowledge base gathered in this chapter,\
    \ it is therefore prudent to discuss these techniques here. The first class that\
    \ we’ll discuss is a key component in all the games; it was used to create the\
    \ characters, their weapons, and nearly all of the objects that appeared on the\
    \ screen.\n\n# ## Game Classes—AnimatedImage.cs\n\nThe class named AnimatedImage\
    \ will be used to control our characters, including their appearance, movements,\
    \ and limitations. Preceding this class we’ll include a set of System references;\
    \ these are required by several of the methods included in the next few sections.\
    \ It is always necessary to wrap our classes inside of a clearly marked namespace,\
    \ in this case the namespace Games. Then, we’ll declare some fields and create\
    \ our constructors (notice how essential constructor overloading becomes with\
    \ regard to multiple setups—see AnimatedImage.cs in the Game Classes folder on\
    \ the CD-ROM).\n\n# ### Example 5.61. AnimatedImage.cs\n\n```\n```\n/* AnimatedImage.cs:\
    \ Contains the AnimatedImage class, which is a\n* generic class capable of holding\
    \ and doing animation logic for\n* an image. You can sub-class this object to\
    \ customize its behavior.\n*/\n\nusing System;\nusing System.Drawing;\n\nnamespace\
