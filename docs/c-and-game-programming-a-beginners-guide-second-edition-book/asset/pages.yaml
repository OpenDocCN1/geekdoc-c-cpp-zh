  md: "# Appendix F: Graphics\n\nWindows Forms has provided us with several methods\
    \ used to produce everything from the basic shapes to some intricate designs.\
    \ Here, I'll introduce some of the alternative drawing tools and many of the techniques\
    \ associated with the color references.\n\n# Points & Size\n\nThe first aspect\
    \ to drawing is the point reference, which describes the locations that delineate\
    \ shapes. A point is declared using the Cartesian coordinate system (the x, y\
    \ coordinate system), where x is the horizontal position and y is the vertical\
    \ position as in Point(int x, int y). Once our points are defined, we'll then\
    \ need to include a size reference, which also relies on an x, y scheme—Size(int\
    \ x, int y). Both point and Size can be referenced as individual objects or as\
    \ part of a specific shape (see Example F.1).\n\n# Example F.1.\n\n```\nusing\
    \ System;\nusing System.Drawing;\nusing System.Windows.Forms;\nnamespace Appendix_F\
    \ {\n    public class Form1 : System.Windows.Forms.Form {\n        public Form1()\
    \ {}\n        protected override void OnPaint(PaintEventArgs e) {\n          \
    \  Point point = new Point(10, 15);\n            Size size = new Size(15, 200);\n\
    \            Brush GreenBrush = new SolidBrush (Color.Green);\n            Graphics\
    \ MyText = e.Graphics;\n            Font Normal = new Font (\"Times New Roman\"\
    , 14, FontStyle.Bold);\n            MyText.DrawString(\"TEST\", Normal, GreenBrush,\n\
    \                new Rectangle(point, size));\n            MyText.DrawString(\"\
    TEST\", Normal, GreenBrush,\n                new Rectangle(new Point(50, 15),\
    \ new Size(15, 200));\n        }\n        static void Main() {\n            Application.Run(new\
    \ Form1());\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 508
  md: "> PointF and SizeF are used to indicate floating point values, which are necessary\
    \ when drawing with pixels.\n\n# Brushes & Pens\n\nWe can also use what are known\
    \ as brushes and pens to enhance graphics and text-supported displays. Brushes\
    \ and pens are declared and accessed in basically the same manner, with brushes\
    \ being used for text and to fill, rather than to draw shapes. Brushes are also\
    \ abstract by definition and hence cannot be instantiated. There are, however,\
    \ five derived classes used to create different types of brushes: HatchBrush,\
    \ LinearGradientBrush, PathGradientBrush, SolidBrush, and TextureBrush. Pen is\
    \ also derived from the abstract brush class; it can be written to take advantage\
    \ of all five of the derived classes, but it has a constant color rather than\
    \ a gradient. For our purposes, we'll want to look at how to declare and reference\
    \ both the basic SolidBrush and the pen (see Example F.2).\n\n# Example F.2.\n\
    \n```\nusing System;\nusing System.Drawing;\nusing System.Windows.Forms;\nnamespace\
    \ Appendix F {\n    public class Form1 : System.Windows.Forms.Form {\n       \
    \ public Form1() {}\n        protected override void OnPaint(PaintEventArgs e)\
    \ {\n            Graphics Figures = this.CreateGraphics();\n            Brush\
