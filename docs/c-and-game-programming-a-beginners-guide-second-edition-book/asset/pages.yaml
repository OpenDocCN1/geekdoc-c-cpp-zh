    # Displaying Graphics Using DirectDraw


    The Hardware Acceleration Layer (HAL) is comprised of a host of sub-HAL components,
    these components reflect the different aspects of DirectX e.g., DDHAL (DirectDraw
    Hardware Acceleration Layer), DIHAL (DirectInput Acceleration Layer), DSHAL (DirectSound
    Acceleration Layer), etc. DirectDraw as its name implies allows for direct or
    near direct access to our video hardware. The DDHAL can be built into the display
    driver or included as a Dynamic Link Library (DLL). We as programmers do not interface
    directly with the DDHAL; rather our requests are delegated through the DirectDraw
    component (see Diagram 3.3).


