    # The Data Type `void`


    As previously mentioned, void is a data type that holds no data. It thus serves
    the purpose of telling the compiler that a variable or returning function requires
    no data, which is logical since the ending of the main function is also the ending
    of the program, and there would be no program to receive information. The data
    type void is also most commonly associated with user-defined functions that reference
