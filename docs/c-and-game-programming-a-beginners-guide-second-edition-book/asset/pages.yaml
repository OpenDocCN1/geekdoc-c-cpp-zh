  md: "subject, but don't let the simplicity of these references fool you—programming\
    \ for artificial intelligence can be surprisingly thought provoking, tactically\
    \ tricky, and well worth the time it will take to master. To begin, we'll focus\
    \ on the key points needed to complete this game: a model of tracking and random\
    \ motion.\n\n# Tracking\n\nTracking, as its name implies, is the ability to keep\
    \ track of, or follow, a moving character as it travels across a predefined area.\
    \ This is accomplished by an independent portion of programming, a subroutine,\
    \ that can either implement position changes or send that information to a secondary\
    \ subroutine. The coding used to track an object resembles the coding used to\
    \ implement our characters' movements. The only difference is that it is implemented\
    \ by the computer's judgment, for example, when a comparison “says” that the tracked\
    \ object is higher or lower, allowing it to adjust its position. Unfortunately,\
    \ this technique has one fault, which is that the computer cannot make mistakes,\
    \ and that breaks the primary rule of humanistic realism. Luckily, we can overcome\
    \ this need for perfection by adding in random events, hence the necessity of\
    \ applying these techniques in unison.\n\n# Random Motion\n\nIn the last two chapters,\
    \ we've used random numbers several times to create new information and to dynamically\
    \ change the results of otherwise predictable behaviors. This process is also\
    \ very useful when attempting to break the monotony of projected movements and\
    \ is the primary source of new input used by our artificial characters. The one\
    \ key twist that makes this procedure a bit different is that we'll use that random\
    \ input to reduce the artificial players' ability to seek the projectile. The\
    \ idea behind this maneuver is to increase the level of error, and hence, the\
    \ playability of the game (see Examples 3.37 and 3.38).\n\n# Example 3.37. Tennis\
    \ AI left player.\n\n```\n```\n// Left player artificial intelligence\npublic\
    \ void TennisAIPlayerL() {\n    // if ball active move left player\n    if(theBall.isActive\
    \ == true) {\n        switch(theBall.direction) {\n```\n```"
