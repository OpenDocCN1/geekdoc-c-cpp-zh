  md: '# Assignment Statements


    One other aspect of the above examples remains to be explained, namely, the equal
    sign (also known as the *assignment operator*). Quite obviously, using an equal
    sign means to make the variable equal to whatever number we assign, and is therefore
    known as an *assignment statement*. This works equally well for assigning a variable
    to a literal constant or a referenced variable (as demonstrated in Example 1.26).


    # Example 1.26. Using the equal sign assignment operator.


    ```

    number_shown = x + 1;

    // Arithmetic will be explained later in this chapter

    ```


    Unlike mathematical expressions, assignment statements are always formulated with
    the receiving variable positioned to the left. Example 1.26, although similar
    to an algebraic expression, does not involve any inference of data. In fact, an
    unreferenced or undefined variable used to assign such a value would result in
    the minimum of a compiler warning (see Example 1.27).


    # Example 1.27. Compiler warning resulting from an undefined variable.


    ```

    int n, x = 2, y;

    // Any variable assigned to another

    // variable must by requirement be

    // assigned a value itself, before

    // that secondary assignment can occur.

    n = y + 1;

    // variable referenced without being assigned a value.

    ```


    # Type Compatibility: Implicit Conversions


    Before we begin to combine numbers in the form of equations, we have to make sure
    that their data types are compatible. Numeric data types, as you remember, were
    byte, short, int, long, float, double, and decimal. The best way to calculate
    and assign these data types is to use their matching data types (for example;
    *short* to *short*, *float* to *float*,'
