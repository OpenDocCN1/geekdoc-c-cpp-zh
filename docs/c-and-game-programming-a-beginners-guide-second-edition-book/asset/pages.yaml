  md: "# Overloading Unary Operators\n\nThere are several rather practical manipulations\
    \ that involve overloading unary operators. One such example would include the\
    \ use of the not operator. This unary operator could be used to simultaneously\
    \ access a Boolean component while inverting its stored value. Other useful modifiers\
    \ are the incrementing and decrementing operators, and the negative notation;\
    \ inserted in front of a class component's value, they are often used to indicate\
    \ a reverse in direction and/or an implied mathematical reference (Example 5.31\
    \ explores the implementation of these concepts).\n\n# Example 5.31. Overloading\
    \ unary operators.\n\n```\nusing System;\n\nnamespace Chapter5 {\n    public class\
    \ Television {\n        public bool Power;\n        public short Channel;\n\n\
    \        public Television() {\n            this.Channel = 2;\n            this.Power\
    \ = false;\n        }\n\n        public static bool operator !(Television TV)\
    \ {\n            return(!TV.Power);\n        }\n\n        public static Television\
    \ operator ++(Television TV) {\n            TV.Channel++;\n            return(TV);\n\
    \        }\n\n        public static Television operator --(Television TV) {\n\
    \            TV.Channel--;\n            return(TV);\n        }\n\n        static\
    \ void Main() {\n            Television TV = new Television();\n            if\
    \ (!TV)\n                Console.Write(\"The TV is not turned on. \\n\");\n```"
