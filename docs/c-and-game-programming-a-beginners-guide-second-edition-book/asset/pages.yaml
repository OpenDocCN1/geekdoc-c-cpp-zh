    \ of system and user-defined namespaces including a namespace is not equivalent\
    \ to including a file, as was done in C++. Here, we'll only be notifying the compiler\
    \ of where to find the references written in shorthand. User-defined namespaces\
    \ are accessed in exactly the same manner as the system type (see Example B.73).\n\
    \n# Example B.73.\n\n```\nusing System;\nclass Appendix_B {\n    static void Main()\
    \ {}\n}\n```\n\n# virtual\n\nThe keyword virtual denotes a modifier that sets\
    \ a method of a base class so that it can be overridden in a derived class. When\
    \ a virtual function is referenced, it searches for an overriding method."
