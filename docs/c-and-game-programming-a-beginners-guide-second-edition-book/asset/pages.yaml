- pgno: 333
  md: "# Object-Oriented Design\n\n> *If I have seen farther than others, it is because\
    \ I was standing on the shoulders of giants.*\n> \n> -Isaac Newton\n\nThis chapter\
    \ begins with several sections that define and detail the many attributes of the\
    \ collective data type known as the structure. This aggregated data type includes\
    \ several options that aid in the removal of literal limitations, and thus help\
    \ us to further our move into object-oriented programming. Once the basics of\
    \ these simpler concepts are committed to memory, we’ll want to progress onto\
    \ the extended topics using classes. Classes, while not meant to totally replace\
    \ structures, do allow for a greater level of control, which includes the use\
    \ of reference types. The second portion of this chapter will also offer several\
    \ new keywords and operators whose potential can only be reached through class\
    \ manipulations. Finally, we’ll conclude with the underlying classes used to power\
    \ all the games, and I’ve thrown in two additional games that add a few final\
    \ touches.\n\n# Structures\n\n*Structures* are user-defined data types that allow\
    \ for groupings of similar or related data that do not have a single base data\
    \ type. These groups can include all the basic value data types, as well as a\
    \ list of methods used to manipulate those values. The data types declared inside\
    \ a structure are referred to as the structure’s *members* (or *fields*), while\
    \ their declarations are referred to as its *instances*. The correlations between\
    \ these internal values and"
  merge: -1
  img_proc: true
- pgno: 334
  md: "our structures are usually guided by some common theme or purpose. A structure\
    \ is made up of the keyword `struct`, the structure's tag (or name), a list of\
    \ the fields (written as declared members), and a list of possible methods used\
    \ to manipulate that data. Structures are generally contained within a single\
    \ block placed inside our referencing namespace, but as shown below, they can\
    \ also be used to invoke our main method (see Example 5.1).\n\n![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_334_0.png)\n\
    \n> > While the use of a C++ style terminating semicolon is allowed, it is not\
    \ required when working with C#.\n\n# **Example 5.1. A simple structure.**\n\n\
    ```\n    using System;\n\n    namespace Chapter5 {\n        struct BankAccount\
    \ {\n            string first_name;\n            string last_name;\n         \
    \   long account_number;\n            decimal Checking;\n            decimal Savings;\n\
    \            short pin_number;\n\n            static void Main() {\n         \
    \       BankAccount Balance;\n                Balance.account_number = 1234;\n\
    \n                Console.WriteLine(Balance.account_number);\n            }\n\
    \        }\n    }\n```\n\n# **Declaring and Assigning Fields**\n\n*Fields* are\
    \ not declared and assigned values directly; rather, they are declared as objects\
    \ through the use of instances and are assigned as a combination of those instances\
    \ and their referencing points. The combination of terms is marked by a connecting\
    \ dot as the member selection operator (.), which is necessary because fields\
    \ are essentially generalized variables that can be used for multiple purposes.\
    \ Thus, the use of assignment state-"
  merge: -1
