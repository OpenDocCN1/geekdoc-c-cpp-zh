    # Writing an Algorithm


    After brainstorming, choosing characters, and plotting their motions, the next
    logical step is to weave those images into a program document or algorithm. An
    algorithm, as introduced in Chapter 1, is an abstract, yet detailed, list of everything
    that needs to occur inside of a program. Since this is only a quick look at algorithms,
    and since there are still several programming aspects that haven''t been explained,
    once again we won''t worry too much about completely defining all the details
    that make up this program. Eventually, however, when our programs actually necessitate
    an algorithmic breakdown, we''ll include all such details (see Example 3.5).


