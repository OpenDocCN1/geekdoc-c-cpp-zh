    simplest coding possible, but with the added criteria that it is generic in nature.
    Remember, the higher the level of abstraction, the greater the level of reusability.


    # ## Game 1—Paddle Tennis


    For our first game, we''ll deliberately keep things simple with three objects,
    one background image, and an area of a single screen. We''ll also restrict our
    motion and keep the physics to a minimum, which leaves us with the obvious choices
    of twin tennis players and a simple tennis ball. We can create a net using simple
    graphics, and of course, we''ll include basic sounds for the racket, ball, and
    cheers of the crowd, but again, all of these steps should be done in the proper
    order, beginning with the creation of an outline...


    # ## Brainstorming


    Brainstorming is the first creative step. It''s nothing more than throwing out
    ideas, but it''s also the foundation for everything that follows. Example 3.1
    shows what we might write if we were planning to create a sports game like Paddle
    Tennis.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_156_0.png)


    **Example 3.1. Brainstorming Paddle Tennis.**


    +   1. The game should have two players. One placed on the right, the other on
    the left.

    +   2. There should be a net that divides the screen vertically.

    +   3. The players should move freely, up, down, left, and right, but they should
    not be allowed to leave the screen or cross over to the other player''s side.

    +   4. There is a ball that bounces around, which the players can hit back and
    forth, with the upper and lower limits used to simulate the ground.'
