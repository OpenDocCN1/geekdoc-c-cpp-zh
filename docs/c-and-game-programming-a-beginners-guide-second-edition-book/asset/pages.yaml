  md: '# Example 4.30. Mapping Memory.


    Computers allocate a certain amount of Random Access Memory (RAM) to each variable
    declared inside of a program. This memory is actually part of a computer''s hardware,
    and is reused and/or overwritten every time we run a new program. The methods
    used to store variables and the exact locations in memory of those variables are
    irrelevant to us as programmers, and will be left to books related to computer
    operating systems and hardware. Our understanding of how and where data is placed
    will have to be on an abstract scale. This therefore includes an imaginary point
    of reference that we can build upon to access and alter any arrays or strings
    of data declared in our programs.


    First off, let''s assume that we''ve just declared and initialized a character
    array or string to the values A, B, C, D, and E. We know that the strings'' positions
    will reflect our points (as in zero equals A, one equals B and two equals C, etc.),
    but we don''t know how this will relate to the computer''s placement of that data.
    If we then reason that the computer places the first component A in some arbitrary
    location (say memory location 1000), using the basic form of 1 byte per character,
    we can deduce that the location 1001 would hold the value B, location 1002 would
    hold C, and so on. From this, we can also graph a map of the locations:


    | Memory Location | Referencing Array | Value in Memory |

    |---|---|---|

    | [1000] = | array[0] = | A |

    | [1001] = | array[1] = | B |

    | [1002] = | array[2] = | C |

    | [1003] = | array[3] = | D |

    | [1004] = | array[4] = | E |

    | [1005] = | array[5] = | \0 |'
