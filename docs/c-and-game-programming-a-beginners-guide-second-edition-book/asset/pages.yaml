  md: '# Introducing Object-Oriented Programming


    In order to understand the concepts behind the development of object-oriented
    programming, we must first discuss the principles behind its predecessors, such
    as top-down design, structured programming, and modular programming. Top-down
    design is a linear approach to programming where you start at the top and work
    your way down, whereas structured programming is more of a systematic approach
    to problem solving based primarily on the idea of dividio et vinco (divide and
    conquer). This process allowed the programmer to develop larger and more complex
    programs, but it did not initially allow for reuse without modification. Structured
    programming complements top-down design and lead to a concept known as generic
    coding. The combined power of structured programming and generic coding also allowed
    for the restringing of functions to solve additional problems. Modular programming
    developed as an expansion to structured programming, allows for the linkage of
    files and generally coded subprograms, but this too fell short of meeting the
    demands placed on today’s programmers.


    Object-oriented programming is both a collection of the above techniques and a
    progression from object-based programs to object-driven programs. Generally written
    structure, and then classes, became the emphasis, and objects became the guiding
    tool used by most programmers. Classes took on a new approach that included friend
    and member functions (and now what is referred to as methods) to create a generic
    framework that can be applied to a multitude of tasks. Inheritance was developed
    along with a slew of new methodologies and concepts. In this new framework, variables
    are often replaced by class members and functions by methods. While the coding
    that defines these objects won’t actually be discussed until Chapter 5, the practical
    applications that allow for their use will be implemented here. This is possible
    though the use of the black box method applied to both members and methods (again,
    see Chapter 5 for details).


    # Adding Files to Our Projects


    To properly implement the previous program, we must first transfer its supplemental
    files to the appropriate main or subdirectory. This can be done through a simple
    copy and paste procedure as explained below.'
  merge: -1
