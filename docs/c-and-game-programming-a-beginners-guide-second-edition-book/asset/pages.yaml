  md: '+   12. Always use a standard predefined function when possible; they speed
    up programming tasks and increase program portability.

    +   13. The goal of any good programmer is to write code that can be reused in
    several projects. Don’t waste time rewriting the same code.

    +   14. When using `if-else` statements try to place the most common occurrence
    first; this will speed up your program by moving you to the right info faster.

