- pgno: 173
  md: 'Our second step is to animate our first character. This is done through a combination
    of the OnPaint and OnKeyDown commands. Once again, we''ll use the incrementing
    operator to change the characters'' position, but this time we''ll also need to
    include the decrementing operator for reversing that motion (remember both of
    those examples are bundled within our first class, AnimatedImage.cs—see Chapter
    5 for details). We''ll use the arrow keys to control our characters (see Example
    3.9 on the CD-ROM).


    > The player''s input is the data gathered by the OnKeyDown command. This is translated
    into movements by the computer and allows us to change the direction of the character.
    The player''s x and y components indicate the player''s current position. The
    initial settings place our first character at about eye level, but to the right
    of the screen (as in the accompanying sketch).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_173_0.png)


    # DirectInput: the Keyboard


    In the last section, we introduced the concept of data input through the keyboard.
    Our first gaming model (Example 3.8 on the CD-ROM) included the GDI+ function
    OnKeyDown (KeyEventArgs e), which Windows periodically references as users'' input
    is detected. Our OnKeyDown function also included a reference to e.KeyCode, the
    Key Event Argument Key Code, which allowed us to read and respond to the input
    provided by our users. The GDI+ model thus offers us the simplest way to derive
    our users'' intentions while still confining us to a single function. DirectInput,
    in contrast, forces us to take a more global approach.'
