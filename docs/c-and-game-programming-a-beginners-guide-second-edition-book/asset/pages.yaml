    \n# Searching Arrays\n\nThere are two basic types of searches that are useful\
    \ and relate directly to data stored in an array. The first is the *linear search*,\
    \ which, as its name implies, is a consecutive comparison that tests each element\
    \ until the correct information is found. This is a very common and particularly\
    \ useful search algorithm, especially when dealing with random or unrelated data\
    \ that cannot be sorted. The second, also considered the more efficient search,\
    \ is the *binary search*. This search divides and compares two criteria, where\
    \ the total value is divided into two sets and the irrelevant set is discarded.\
    \ This process is repeated as many times as possible before reverting back to\
    \ a basic linear search. Both searches are considered effective, but the binary\
    \ search is preferred when dealing with longer, sortable data streams that require\
    \ repeated searches (see Examples 4.20 and 4.21). The binary search also requires\
    \ that the data be presorted; the presorted data can also be stored as a secondary\
    \ file, thus, eliminating the need for continuous resorting.\n\n# Example 4.20.\
    \ Linear search (finding a number in an array).\n\n```\n```csharp\nusing System;\n\
    \nnamespace Chapter4 {\n    class Class1 {\n        static void Main() {\n   \
    \         string input;\n            const int array_size = 100;\n```\n```"
