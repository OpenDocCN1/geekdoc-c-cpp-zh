    \   Ageism(ref childrens_ages[counter]);\n\n                if (childrens_ages[counter]\
    \ > 6)\n                    Console.WriteLine(\"Your child is to old.\\n\");\n\
    \            }\n        }\n\n        static void Ageism (ref int tester) {\n \
    \           Console.WriteLine(tester); // we're all too old\n            tester\
    \ = 7;\n        }\n    }\n}\n```\n```\n\nThe procedure for passing an entire argument\
    \ differs somewhat from the method used to pass a single element. For example,\
    \ the initial identifying brackets are not required when sending those values,\
    \ but they are essential to the receiving statement (see Example 4.11). In C++,\
    \ it was also important to include a secondary reference that included the array’s\
    \ size; however, this is no longer the case since an array’s length can always\
    \ be found using the *length* extension (included as a method that is accessible\
    \ by all properly declared arrays)."
