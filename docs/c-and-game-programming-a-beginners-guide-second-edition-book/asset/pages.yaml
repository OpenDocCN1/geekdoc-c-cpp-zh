    \ (simple_array, array_size);\n        }\n\n        static void BubbleSort (int[]\
    \ my_array, short size) {\n            int temp = 0;\n            Console.WriteLine(\"\
    \\nRandom numbers inputted in this order\");\n\n            for (int i = 0; i\
    \ < size; i++)\n                Console.WriteLine(\"{0}  \", my_array[i]);\n \
    \           for (int i = 0; i < size; i++)\n                for (int j = 0; j\
    \ < size-1; j++)\n                    if (my_array[j] > my_array[j+1]) {\n   \
    \                     temp = my_array[j];\n```"
