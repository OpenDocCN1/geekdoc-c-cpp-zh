  md: '+   5. The ball can increase in size when it''s moving closer to the net, thus
    simulating a 3D environment.

    +   6. When one player misses the ball, the other player should get a point and/or
    win the serve.

    +   7. The game should start with a simple menu that allows players to select
    the type of game, e.g., two players, one player, or demo mode. (Note: One player
    and demo modes mean that we''ll have to write some simple artificial intelligence
    coding).

    +   8. The game should also allow our players to quit at any time via the ESC
    key. Asking the players if they''re sure they want to quit before actually ending
    the program could also be an option.

    +   9. The game should be colorful with a blue background, yellow net and two
    brightly dressed characters (it would be best if the tennis ball actually looked
    like a tennis ball).

    +   10. The game should also have sounds when the ball hits the ground (edges
    of the screen) and/or the players. There should also be a cheer from the unseen
    viewers when a player scores.

    +   11. You may also want to put in a timer that automatically starts the demo
    mode if nothing happens for, say, two minutes. Finally, the game should reset
    itself to allow for repeated play.


    # ## Drawing Characters


    Now that we have a general idea of what we''ll need pictorially, we''ll have to
    convert those ideas into actual illustrations, and then we''ll have the fun task
    of figuring out how those images are going to be manipulated. The actual designs
    aren''t really that important, but the steps used to access and complete those
    designs are. The first step then is to familiarize ourselves with how the graphic
