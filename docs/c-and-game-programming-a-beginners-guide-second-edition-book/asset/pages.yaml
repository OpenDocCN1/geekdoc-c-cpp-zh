- pgno: 169
  md: 'Managed DirectDraw is the simpler of two graphical components used in Managed
    DirectX; the other Direct3D also includes two-dimensional application, offering
    support for textures, increases speed, and alpha blending, etc. (see Chapter 5
    for details).


    To include DirectDraw we’ll need to follow several steps. The first is to add
    the declaration `private Microsoft.DirectX.DirectDraw.Device draw = null;`. Here,
    the word draw could be replaced with any variable name; examples include Draw,
    ScreenDisplay, device, the variable begins with a null value, but is later assigned
    as `draw = new Microsoft.DirectX.DirectDraw.Device();`. Next, we’ll declare the
    primary and secondary surfaces; the primary surface is the screen area used by
    the program, the secondary surface is a buffered surface, which is switched with
    the primary surface after all character surfaces are included. The variable name
    primary is commonly used to represent the primary surface e.g., `private Surface
    primary = null;` The secondary surface is common dubbed offscreen or backbuffer,
    character surfaces often include descriptive names as in `private Surface PlayerLDraw
    = null;`. Another essential part to creating our primary and secondary surfaces
    is the concept of clipping. Clipping simply means to delete any graphics that
    go beyond the defined area. For example, through clipping, our little tennis player
    would not be allowed to sneak off the screen and find his way into Atari’s pong.
    Using the variable name clip is very common as in `private Clipper clip = null;`
    Here, we’ll also define our area as in a simple rectangle, again the name destination
    is common among DirectX programmers e.g., `private Rectangle destination = new
    Rectangle();`. Now that we have our preliminaries in order, we’ll want to build
    a CreateSurface function. This function is the setting for our description, primary,
    and clipper values as well as a crux for our bitmap references. Once all the components
    are in place, it becomes a simple matter of setting the coordinates of the surface
    and referencing the bitmap (see CD-ROM’s Example 3.8).


    > > Example 3.8 implements a simple try-block exception handler (Exception Handling
    is explained in Chapter 5), this is done to avoid the WasStillDrawException, which
    can occur when flipping between buffered and primary graphics, as well as the
    DirectXException, which can occur when a character moves off screen. Both exceptions
    are considered insignificant and do not exist in Direct3D. Alternatively, we could
    have used a Microsoft.DirectX.DirectXException.IgnoreExceptions();


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_169_0.png)'
  merge: -1
