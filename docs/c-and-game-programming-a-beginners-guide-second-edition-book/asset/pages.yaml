  md: 'If a character takes up 2 bytes per element, their memory locations would be
    listed as


    | Memory Location | Referencing Array | Value in Memory |

    |---|---|---|

    | [1000 – 1001] = | array[0] = | 1 |

    | [1002 – 1003] = | array[1] = | 2 |

    | [1004 – 1005] = | array[2] = | 3 |

    | [1006 – 1007] = | array[3] = | 4 |

    | [1008 – 1009] = | array[4] = | 5 |


    In addition, if a data type takes up 4 bytes per element, it would produce a larger
    span or cluster of data.


    | Memory Location | Referencing Array | Value in Memory |

    |---|---|---|

    | [1000 – 1003] = | array[0] = | 1 |

    | [1004 – 1007] = | array[1] = | 2 |

    | [1008 – 1011] = | array[2] = | 3 |

    | [1012 – 1015] = | array[3] = | 4 |

    | [1016 – 1019] = | array[4] = | 5 |


    Further, this could continue on and on at least up to 64 bits (the 128-bit machines
    are not quite ready yet). Data that takes up 8 bytes is equivalent to:


    | Memory Location | Referencing Array | Value in Memory |

    |---|---|---|

    | [1000 – 1007] = | array[0] = | 1 |

    | [1008 – 1015] = | array[1] = | 2 |

    | [1016 – 1023] = | array[2] = | 3 |

    | [1024 – 1031] = | array[3] = | 4 |

    | [1032 – 1039] = | array[4] = | 5 |'
