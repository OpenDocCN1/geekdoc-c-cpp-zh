- pgno: 219
  md: '# DirectDraw: Lines


    The simplest image to draw is undoubtedly the straight line. Here, only two points
    are required, P₁ (x₁, y₁) and P₂ (x₂, y₂) (as defined by the Cartesian coordinate
    system). A straight line is created when these two points are connected. Straight
    lines can be both horizontal and vertical; they require ColorFill and ForeColor
    references, as well as a call to DrawLine (int x, int y, int x, int y); Diagonal
    lines can also be created using DrawLine, but if the line is asymmetrical it will
    appear coarse or jagged. In such a case, a solution known as anti-aliasing is
    used. Anti-aliasing is a smoothing technique, based on shading, which is used
    to reduce sharpness. To the artist this would mean applying softer shades, shadows
    that follow the line; to the programmer this includes implementing new techniques
    (GDI+ offers SmoothingMode and PixelOffsetMode). As for DirectDraw, a more hands-on
    approach is required (see Example 3.57 and Example 3.58 on the CD-ROM).


    # Example 3.57. Lines display.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_219_0.png)


    # DirectDraw: Shapes


    DirectDraw has only two basic shapes, the rectangle, and the ellipse. The rectangle
    is referred to as a DrawBox, while the ellipse has three references DrawCircle,
    DrawEllipse, and DrawRoundedBox. Here, ColorFill can be used with DrawBox to create
    solid rectangles (see Example 3.59 and Example 3.60 on the CD-ROM).'
