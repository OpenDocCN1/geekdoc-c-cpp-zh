- pgno: 143
  md: '# Inline Functions


    Another interesting thing about C# is its automatic use of `inline functions`,
    which are functions that are inserted into every line that requires its reference.
    That is, rather than having the function reference search out the function at
    runtime, the function is compiled into that line of coding. This speeds up the
    program, but it also increases the code size. The biggest problem with “inlining”
    in C/C++ was that it was only a request and not an order, so the compiler could
    refuse to do it. The majority of compilers (and this includes the Microsoft’s
    Visual C++ series) won’t inline a recursive function, nor will they allow functions
    that are referred to through pointers (see Chapter 4 for information on pointers).
    The C/C++ keyword `inline` is not required in C#, and thus falls under the list
    of antiquated coding. Note: Microsoft versions of both C and C++ also included
    two variations on the inline command, (`__inline` and `__forceinline`); these
    keywords also have no place in C#.


    # Troubleshooting


    It’s time for another deep breath and a bit of problem solving. Remember that
    if you don’t find the answers here they might have been explained in the last
    troubleshooting section (see Chapter 1). First, let’s look at the problem from
    a logical standpoint; let’s assume that you’ve worked, successfully, with all
    of the programs listed in the last chapter. If so, then any problems would have
    to relate to syntax. Question: do errors occur at compilation? Try resetting the
    warning level to a lower setting; did those errors become warnings? Perhaps you
    had a syntax error; look for errors caused by using the wrong symbols in your
    comparisons. If there are no compiling errors, but the program’s data is still
    producing incorrect output, try looking for reversed symbols, typographical errors,
    or incomplete coding errors.


    # Common Errors, Problems, and Pitfalls


    +   1. Symbol combinations such as `==`, `!=`, and `>=` cannot be written with
    spaces between them (`= =`, `! =`). incorrect and should always be avoided even
    if the program seems to work.

    +   2. Do not confuse `=` with `==`. Remember `=` is used to assign a value and
    `==` is used to compare two values.

    +   3. Attempting to use a single equal sign inside an `if` statement will result
    in an error.'
