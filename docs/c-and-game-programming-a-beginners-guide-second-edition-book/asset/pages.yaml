    \    }\n}\n```\n\n# Passing Variables: Calls-By-Value\n\nThe call-by-value type\
    \ mechanism is a mechanism used to transfer data between methods that does not\
    \ allow for continued access to the original fields. The data is then considered\
    \ to be a value type, which is appropriately stored on the \"stack\"—the computer's\
    \ temporary memory—and will be removed, or \"popped off,\" when that method is\
    \ terminated. Again, the changes in these secondary variables will not affect\
    \ the original fields, nor will there be deletions. The call-by-value formal parameters\
    \ refer to the variables referenced from inside user-defined functions as demonstrated\
    \ in Example 2.40 (a simple example that finds the square root of a number)."
