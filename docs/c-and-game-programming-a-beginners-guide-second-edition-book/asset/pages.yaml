  md: "# Assigning Instances\n\nOnce two or more instances are declared by the same\
    \ class, the values of those instances can be passed using the assignment statement;\
    \ for example, account1 = account2; // where BankAccount account1, account2; In\
    \ Example 5.23, the values from account2 are passed to account1 (this process\
    \ is commonly referred to as a memberwise copy). It is worth noting that restrictions\
    \ in systems implementations can potentially cause errors when dealing with dynamically\
    \ allocated storage.\n\n# Example 5.23. Memberwise copy—assigning instances.\n\
    \n```\nusing System;\nusing System.IO;\n\nnamespace Chapter5 {\n    class BankAccount\
    \ {\n        public decimal InterestRate;\n        public decimal LoanRate;\n\n\
    \        public BankAccount() {\n            InterestRate = .03M;\n          \
    \  LoanRate = .13M;\n        }\n\n        public BankAccount(decimal IRate) {\n\
    \            InterestRate = .03M;\n            LoanRate = .13M;\n        }\n\n\
    \        public BankAccount(decimal IRate, decimal LoanRate) {\n            InterestRate\
    \ = .03M;\n            LoanRate = .13M;\n        }\n    }\n\n    class Class1\
    \ {\n        static void Main() {\n            BankAccount account = new BankAccount();\n\
    \            BankAccount account1 = new BankAccount();\n            BankAccount\
    \ account2 = new BankAccount(23);\n\n```"
