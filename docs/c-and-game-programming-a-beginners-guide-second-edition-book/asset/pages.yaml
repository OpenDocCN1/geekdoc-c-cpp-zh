    # From Strings to Streams: System.IO


    In addition to storing and retrieving simple character strings, we can also widen
    our perspective by beginning to access and write to files via our floppy and hard
    drives. The use of file manipulations also includes the addition of a second reference,
    System.IO, which enables the use of two key file-related methods: StreamReader
    and StreamWriter. These methods, as their names imply, allow us to read and write
    to those files. The files in question need to be opened and closed separately,
    that is, one reference is used to identify the file as a storage device and one
    to retrieve that data. As with many of the object-based functions, our data streams
    also offer a host of member accessible functions that will be explored as we uncover
    the Base Class Library. The correct procedure for accessing these methods always
    includes an opening statement, a reading or writing to statement, and the closing
    method (see Table 4.5). Note that forgetting to close these files will produce
    a runtime error.'
