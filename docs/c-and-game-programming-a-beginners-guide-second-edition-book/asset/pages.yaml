  md: "> **Note**\n> \n> We could also have replaced that user-defined function with\
    \ the predefined function `Math.Sqrt()`.\n\n# ## Writing Functions as Black Boxes\n\
    \nThe *black box theory* is simply a concept that stresses the idea that most,\
    \ if not all, functions should be thought of as independent or self-containing\
    \ subprograms. It also reasons that the coding used to construct such a function\
    \ does not need to be studied or known by a programmer who only wants to invoke\
    \ that function. Thus, the only information needed to access a function is the\
    \ proper passing variables and the knowledge of what would be returned by the\
    \ function. This is analogous to being able to drive a car, but not knowing how\
    \ to repair the engine. This is actually the norm in C#, since all predefined\
    \ functions are black boxes to most programmers and the idea of enhancing them\
    \ would literally force us to open them up and redesign them to some new standard\
    \ (which unfortunately is usually necessary in game programming). Of course, if\
    \ you were to write your own user-defined functions, you'd certainly know how\
    \ each one of them worked.\n\nCreating a black box style function requires or\
    \ restricts us to the use of encapsulated controls. This, of course, means that\
    \ you must avoid using global variables and that you must include comments with\
    \ every prototype to alert any other programmer to the variable settings and to\
    \ their results. In addition, you should keep in mind that in later chapters,\
    \ we'll be both reading and writing to user-defined functions from separate files,\
    \ thus creating a real need for detailed comments explaining what these different\
    \ function calls do.\n\n> **Applying the black box approach to Example 2.40**\n\
    > \n> Let's assume that you didn't really understand the second portion of the\
    \ last example, but you used the square root function anyway. While it is a bit\
    \ disheartening to the mathematician in me, this will not affect the way the program\
    \ executes that data, and in fact, actually makes my point. If however, that coding\
    \ piqued your interest then here's a quick overview of the mathematics (see Example\
    \ 2.41)."
