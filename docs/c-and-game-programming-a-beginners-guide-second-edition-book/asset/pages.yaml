  md: "# Program Walkthrough\n\nThe first thing we do is declare the variable Quit\
    \ and initialize it. We'll use \"no\" as its initial value (note: \"no\" has no\
    \ real meaning to the program). Next, we'll set up a while loop that compares\
    \ the value of Quit to \"yes\" and makes the loop comparison true only when Quit's\
    \ value does not equal \"yes.\" We then ask the user from inside the compound\
    \ statement whether he or she wishes to end the loop. The user's input is then\
    \ stored in the variable Quit; the loop will continue to repeat until the user\
    \ enters \"yes.\" Then, the last statement \"Program complete!\" will be executed\
    \ and the program will terminate.\n\nAs with counting loops, user input loops\
    \ can be made nearly infinite if you forget to tell the user how to end them (which,\
    \ of course, should be avoided). For the third type of termination, we'll have\
    \ to introduce the keyword break. break, as its name implies, terminates any enclosed\
    \ loop or conditional statement. Example 2.14 demonstrates this final while termination\
    \ technique.\n\n# Example 2.14. Hey, you broke my while loop!\n\n```\n```csharp\n\
    using System;\n\nnamespace Chapter2 {\n    class Class1 {\n        static void\
    \ Main() {\n            string Quit = \"no\";\n\n            while (Quit != \"\
    yes\") {    // breaks loop\n                break;\n                Console.Write\
    \ (\"\\n Would you like to end this loop? \");\n                Quit = Console.ReadLine\
    \ ();\n            }\n\n            Console.WriteLine (\"Program complete!\\n\"\
    );\n        }\n    }\n}\n```\n```\n\nWhen break is executed, it simply breaks\
    \ the loop and moves down to the next statement, skipping the remaining loop statements,\
    \ and the while loop is considered complete."
