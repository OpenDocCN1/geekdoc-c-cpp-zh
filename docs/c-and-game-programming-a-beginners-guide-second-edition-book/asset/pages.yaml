  md: "Following this same line of reasoning, we might mistakenly conclude that privately\
    \ passed inherited classes are only accessible through internal use as with predicate\
    \ and/or other unity type functions. However, this is not the case, since all\
    \ the techniques used to access a standard yet privately controlled class are\
    \ also available from within the derived class. Once a need for a privately inherited\
    \ class is established, the correct approach is to create a set of member functions\
    \ that relies on indirect access, thus creating a relay from the inherited to\
    \ base functions, hence the Set methods.\n\nThe keyword virtual is a modifier\
    \ that sets a method of a base class so that it can be overridden in a derived\
    \ class. When a virtual function is referenced it searches for an overriding method.\
    \ Overriding, as explained above, forces the compiler to accept a secondary version\
    \ of that function as related to a secondary/inherited class. The polymorphic\
    \ effect is accomplished at runtime (known as late binding) rather then at compilation\
    \ (known as early binding), as was the case with operator and member style overloading.\
    \ virtual functions are declared using the standard member's declaration preceded\
    \ by the keyword virtual. Neither constructors or friend functions can be accessed\
    \ using this method, but virtual destructors are allowed (see Example 5.37). In\
    \ contrast to the definition of an overloading function, a function that is overridden\
    \ must include an identical list of parameters.\n\n> Inherited classes that do\
    \ not include properly overwritten virtual functions are then subject to the default\
    \ virtual functions included in their base classes. If a multilevel inherited\
    \ class cannot find a properly declared virtual function, it may mistakenly revert\
    \ through each inherited class until an appropriate function is found.\n\n![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_391_0.png)\n\
