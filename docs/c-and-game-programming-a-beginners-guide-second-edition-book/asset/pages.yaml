  md: "# Inheriting Constructors and Destructors\n\nAs explained in earlier sections,\
    \ an I is a member function often used to initialize objects as pertaining to\
    \ the values presented in their declarations, or thereby calculated as part of\
    \ that class. The initialization is done automatically (at the moment of declaration),\
    \ with reference to one of possibly several overloading constructor references.\
    \ Once an inherited class is introduced, this initialization is compounded with\
    \ the need for both a base class initialization and an inherited class initialization.\
    \ Base class constructors, however, are not inherited by derived classes, and\
    \ thus do not need to be overloaded or overridden. The order of derivation with\
    \ regards to a constructor of an inherited class is always linked from the base\
    \ class to the derived class, with the reverse order for the destructor ( from\
    \ the derived class to the base class).\n\n# private versus protected Inheritance\n\
    \nEarlier in this chapter private and protected members seemed almost interchangeable.\
    \ That is, each protected against unauthorized referencing, granting access to\
    \ only the properly labeled member functions; they allowed for predicate/utility\
    \ member functions; and they both seemed to work well with the nested and inherited\
    \ classes. The uniqueness of the protected class became evident when attempting\
    \ to access a private member variable from inside an inherited class (review Examples\
    \ 5.33 and 5.34). In these differing cases, we found that the protected modifier\
    \ acted much more like the public modifier than its private counterpart, in that\
    \ it enabled public access to the inherited class while still enforcing its rule\
