- pgno: 454
  md: 'Windowed mode, false for full screen mode), while SwapEffect is used to control
    buffer behavior. SwapEffect.Copy, SwapEffect.Discard, and SwapEffect.Flip are
    used to copy, discard, and flip, respectively. Flip creates an extra backbuffer,
    while Copy requires that we set our back buffers to one; Discard simply discards
    the buffer''s content.


    Device also includes the methods Clear and Present. Present is the simpler of
    the two, with no arguments, and is used to present our graphics to the screen.
    Clear includes a minimum of four parameters: ClearFlags, Color, float zdepth,
    and int stencil. For the time being we''ll limit these setting to their most basic
    levels: (ClearFlags.Target, Color.Empty, 0.0f, 0). We''ll also need to build a
    Windows application, adding the references DirectX, DirectX.Direct3D, and Direct3DX.
    (Note that we do not include the phrase using Microsoft.DirectX.Direct3D; see
    Example 5.80 on the CD-ROM.)


    # Displaying 2D Images using Direct3D


    As with DirectDraw, Direct3D uses a simple Draw command to display its images,
    however, the Direct3D''s version of the Draw command requires seven arguments
    namely the spriteTexture, sprite, textureSize, scaling, rotation, transition,
    and color. The first three arguments pertain to the body of the bitmap, with spriteTexture
    referencing the actual loaded image or bitmap file (*.bmp), sprite is used to
    link our bitmap to the Device class, and textureSize is used to set the size of
    that texture. Scaling then dictates the size of the rendered image, with rotationCenter,
    rotation, and translation relating to the characters position (translation places
    the image using Cartesian coordinates), color, quite obviously, dictates the images
    color.


    Here we''ll also want to introduce the methods used to contain our drawing function,
    appropriately termed BeginScene ( ); EndScene ( ); These can be built into a user-defined
    graphics call or as part of the OnPaint reference (see Example 5.81 on the CD-ROM).


    # Direct3D''s 2D Animation—Basics


    Image position is controlled by the translation coordinates x, y, and potentially
    z. Adding or subtracting from these values, in essence, creates movement. This
    movement, however, should not be considered true animation, but rather only a
    simple form of displacement. To'
