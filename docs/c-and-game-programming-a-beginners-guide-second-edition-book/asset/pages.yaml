- pgno: 260
  md: "the standard variable). This variable, unlike a “constant,” can be adjusted\
    \ to virtually any value both at compile time and during execution. While the\
    \ definition of the C# array is far more dynamic than that of the C++ or C version,\
    \ it is still a constant parameter that cannot be changed while the program is\
    \ in motion. We can, however, set up arrays to include dynamically calculated\
    \ assessments that occur at runtime using a nonconstant integer variable type.\
    \ Again, this is fairly similar to the method used to create dynamic arrays under\
    \ Native C++, with the coding actually matching the basic C# references.\n\nThe\
    \ most inconvenient aspect of declaring an array is in its requirement of a constant\
    \ variable, or literal constant, which always forces the programmer to make a\
    \ guestimation that can lead to arrays that are either too small (making them\
    \ incapable of the task) or oversized (unnecessarily tying up much needed system\
    \ resources). The solution to both of these problems lies in the use of dynamic\
    \ arrays. Dynamic arrays, as the term implies, are arrays that do not require\
    \ predetermined constants at declaration, but they do require a constant size\
    \ once that value is assigned, which is almost the same thing, but it does offer\
    \ up a few new options.\n\nSince C# always uses the new keyword to declare its\
    \ arrays, we won’t actually have to change the way we reference those values to\
    \ make them dynamic. In addition, since the .Net structure offers a managed heap,\
    \ we won’t need to refer to a deallocating method (as was done with the word delete\
    \ in C++). We should, however, at least formally define the word new. The keyword\
    \ allows us to declare dynamic arrays using standard variables, which are then\
    \ referenced from inside the heap. The heap is a special area of memory reserved\
    \ for dynamic arrays, reference variables, etc. To assign an array’s parameters,\
    \ simply follow the format listed in Example 4.22 (char my_array = new char [array_size];).\n\
    \n# Example 4.22. Dynamic arrays.\n\n```\nusing System;\n\nnamespace Chapter4\
    \ {\n    class Class1 {\n        static void Main() {\n            string input;\n\
    \            int array_size;\n\n            Console.Write(\"How many students\
    \ in the classroom? \");\n            input = Console.ReadLine();\n          \
    \  array_size = int.Parse(input);\n```"
