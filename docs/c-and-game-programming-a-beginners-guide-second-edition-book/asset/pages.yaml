- pgno: 203
  md: '# Paddle Tennis: Putting It All Together


    Our final construct is built using the namespace Games and will include references
    to classes and techniques taught throughout this text. This version of Paddle
    Tennis requires DirectX 9 or higher; Chapter 3 includes four versions of this
    game (Forms, GDI+, DirectX, and DirectX with GDI+). (See the CD-ROM for details).
    GameClasses is a common utility used to define all aspects of our characters movement,
    including boundaries, sounds, and life span (see Example 3.39/Tennis.C# on the
    CD-ROM).


    > > **Note**

    > >

    > > `MEDIA_ROOT` is an abbreviated reference used to find the location of our
    graphic and sound files. `\media\` refers to a subfolder listed with each game.
    The hardwired version reads `@"C:\C# and Game Programming DirectXEdition\Chapter3\Tennis.C#\TennisDX9.C#\Media\";`.


    # Bonus Games


    Before jumping back into the thick of C#, I thought you might enjoy crunching
    out a few more games. This will provide an opportunity to introduce a few more
    topics and some time to improve upon our initial techniques. For this second game,
    I''ll assume that you''ve already mastered the techniques presented earlier and
    that you''d prefer a shorter review. I will, however, still take the time to mimic
    the creation of the game and to give a realistic view of how one might go about
    developing it (keeping everything in real time, of course).


    # Game 2—Space Fighters


    Our second game, Space Fighters, although simple, does include several techniques
    that you should find useful. We’ll begin by jotting down a quick list of thoughts,
    a.k.a. brainstorming, and we’ll take a few moments to develop our characters.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Example 3.40. Brainstorming Space Fighters.


    +   1. The game should have two players that will appear as spaceships.

    +   2. Again, one player will be placed on the right and the other on the left.
    The game starts the moment it’s loaded.

    +   3. The players’ movements should be two-dimensional with respect to the screen,
    but they should also include diagonal movements.

    +   4. The ships should have a thrust, but not a brake or reverse, allowing momentum
    to carry them forward.

    +   5. The two ships will have weapons, or at least one weapon, namely a missile
    that can be fired at its opponent. But to keep things simple, the missiles won’t
    be able to injure their own ship.

    +   6. Again, we’ll set up a menu option for one or two players, and we’ll add
    in some AI for a one-player option.

    +   7. We’ll use a black background with stars randomly placed across it. The
    stars will be smaller versions of our sun.

    +   8. The ships should have contrasting colors—those colors will also represent
    the color of their weapons.

    +   9. The ships should make sounds including a thrust, weapon’s fire, and an
    explosion when hit.

    +   10. The ships should not be able to fire when dead, nor should they be able
    to get hit.

    +   11. Set the game to end once a player gets, say, five kills. Also, if a player
    is killed by crashing into the sun, he will lose a point.

    +   12. Players will have to restart after they die.

    +   13. We’ll include a command that allows players to revive their damaged ships;
    these controls can double as hyperspace mode, allowing active ships to randomly
    travel through unseen dimensions, reappearing on some other portion of the screen
    (including appearing inside the sun and/or on top of the other ship).'
  merge: -1
  img_proc: true
