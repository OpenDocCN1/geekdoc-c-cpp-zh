  md: "# ulong\n\nThe keyword ulong denotes a unsigned 64-bit integral type used to\
    \ store values ranging from 0 to 18,446,744,073,709,551,615 (see Example B.69).\n\
    \n# Example B.69.\n\n```\nclass Appendix_B {\n    static void Main() {\n     \
    \   ulong Number1 = 1;\n    }\n}\n```\n\n# unchecked\n\nThe keyword unchecked\
    \ is used to block the Solution Explorer\\Configuration Properties\\ Build \\\
    \ Check for an arithmetic overflow/underflow true statement. This statement is\
    \ false by default, but if we were to change this default and then attempt to\
    \ break the barriers of our designated type, we could block the error with the\
    \ unchecked statement (see Example B.70).\n\n# Example B.70.\n\n```\nclass Appendix_B\
    \ {\n    static void Main () {\n        byte Max255 = 255;\n        unchecked\
    \ {Max255 += 1 ;}\n    }\n}\n```\n\n# unsafe\n\nThe keyword unsafe denotes a change\
    \ in settings to unsafe mode. The unsafe feature was developed to aid in bridging\
    \ the gap between C++ and C# programming, allowing us to use time tested techniques\
    \ that are not officially permitted under C#'s safe mode (see Example B.72). In\
    \ addition to including the keyword unsafe to our coding, we must also change\
    \ the compiler's settings in Configuration Manager (see Chapter 1—Sizeof and Unsafe\
    \ Coding for details)."
