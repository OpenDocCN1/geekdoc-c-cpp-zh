    \    } catch () {\n        // some more code\n    }\n```\n\n# **Example 3.84.\
    \ The ignore exception.**\n\n```\n`Microsoft.DirectX.DirectXException.IgnoreExceptions();`\n\
    ```\n\n# **DirectInput**\n\nThe most detrimental error caused in DirectInput is\
    \ a crash when the computer cannot find your joystick. If you've included the\
    \ if (joystick == null) {return;} statement, then this error should have been\
    \ averted. Therefore, if you're still having trouble, the problem is probably\
    \ more along the lines of not being able to get our input devices to work. Let's\
    \ begin with the joystick.\n\n# **The Joystick**\n\nRemember that I cautioned\
    \ you about the State setting, as in State.X and State.Y. The range here could\
    \ be off; you should try manipulating the input range itself, perhaps setting\
    \ it to 0, 1. Here you'd be looking for a response in either direction; again,\
    \ if you get one response, you'll be able to find the others.\n\nAnother possibility\
    \ is that you've improperly setup your bitmap; does it move with the keyboard?\
    \ If not, can you set it to move on a for-loop? Check for a changing variable\
    \ or an invalidating statement. Does the joystick's input include an invalidating\
    \ statement? Do the pre-assembled programs work with the joystick? How about a\
    \ third party game? If you're using a special type of joystick, like a steering\
    \ wheel or multiple joysticks, try replacing them with a simple two-button pad.\
    \ (For additional possibilities read this section's portion on the keyboard.)\n\
    \n# **The Keyboard**\n\nHere you're far more likely to have forgotten something.\
    \ A missing command: did you forget to include a Keyboard.Start ();? Did you include\
    \ the timer coding? Remember that the key states began with the lowest setting\
    \ and worked their way through to the top; did you start the search at a different\
    \ point? Also, check the obvious; did you forget to include an invalidating reference?\
    \ (For additional possibilities read this section's portion on the joystick.)"
