  md: "# Example 4.10. Calls-by-reference in arrays.\n\n```\n```csharp\nusing System;\n\
    \nnamespace Chapter4 {\n    class Class1 {\n        static void Main() {\n   \
    \         string input;\n            int[] childrens_ages = new int[20];\n\n \
