    \ This line may compile, but it will surely fail on execution\n            int\
    \ NotHappy = (int)MrBox;\n        }\n    }\n}\n```\n\n# Introduction to User-Defined\
    \ Functions\n\nWhat are *user-defined functions?* Simply put, they are subprograms\
    \ (subroutines or secondary methods) linked to a main or secondary method and\
    \ subsequently used to carry out a list of tasks when that method requests it.\
    \ They can receive information from other functions (including the main method)\
    \ and they can send information back to their referencing function. They are both\
    \ commands (like the predefined functions) and lines code used to implement those\
    \ commands, which we create as programmers. Technically, everything placed inside\
    \ a user-defined function could just as well have been left inside its main method,\
    \ but in professional programs, this would lead to confusion and a very large\
    \ and cluttered main method. In addition, there are many techniques that can be\
    \ applied to user-defined functions (including *calls-by-references, overloading,*\
    \ and *recursion*), all of which can be applied repeatedly rather than asking\
    \ the programmer to repeat that coding over and over again in a single linear\
    \ method. To start, we'll begin with the simpler functions and then expand on\
    \ these topics one section at a time."
