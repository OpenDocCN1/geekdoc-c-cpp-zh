    # Formatting Strings


    In addition to being able to display simple text layouts using the `Write` and
    `WriteLine` commands, we can also format text to give our programs a more controlled
    output. This works especially well when dealing with variables. A single numeric
    value indicates a reference to the appropriate variable: `{0}`, `{1}`, and `{2}`
    reference the first, second, and third variables, respectively. Moreover, we can
    also apply right and left justifications by inserting a secondary control sequence
    for example, inserting a positive number, as in `{0, 6}`, denotes a shift to the
    right, in this case 6 spaces, whereas the insertion of a negative control sequence
    results in a left-handed shift: `{0, -3}` would move the cursor three spaces to
    the left.


