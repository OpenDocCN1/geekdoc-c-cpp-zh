- pgno: 467
  md: "# class\n\nClasses are an advanced data type, a few levels beyond a simple\
    \ byte, but not too dissimilar. They are similar to arrays, yet they're capable\
    \ of holding tasks and multiple data types (more formally known as tags, fields,\
    \ methods, etc.). They are called as instances (which also can be thought of as\
    \ variables) that hold multiple bits of information. Classes are limited and/or\
    \ enhanced by modifiers, and can be inherited (see Example B.11).\n\n# Example\
    \ B.11.\n\n```\nclass Appendix_B {\n    static void Main() {}\n}\n```\n\n# const\n\
    \nThe keyword constant (const) notifies the compiler of its unchanging nature\
    \ and allows it to optimize that appropriate values (see Example B.12).\n\n# Example\
    \ B.12.\n\n```\nclass Appendix_B {\n    static void Main() {\n        const int\
    \ OurVariable = 1;\n    }\n}\n```\n\n# continue\n\nContinue, like break, shortcuts\
    \ its iterations, but rather than ending the loop, it merely brings the loop back\
    \ to the top. The loop continues on with a new iteration and everything else continues\
    \ accordingly (see Example B.13).\n\n# Example B.13.\n\n```\nclass Appendix_B\
    \ {\n    static void Main() {\n        while (true) {\n            continue;\n\
    \        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 468
  md: "# ### decimal\n\nDecimal is a 128-bit data type that stores rational and irrational\
    \ numbers with a range listed from 1.0 × 10<sup>-28</sup> to 7.9 × 10<sup>28</sup>.\
    \ Its precision level is between 28–29 significant digits, which makes it suitable\
    \ for nearly all monetary calculations (see Example B.14).\n\n# #### Example B.14.\n\
    \n```\n~~~csharp\nclass Appendix_B {\n    static void Main() {\n        decimal\
    \ Number1, Number2;\n        Number1 = 1.0M;\n        Number2 = 1.1m;\n    }\n\
    }\n~~~\n```\n\n# ### default\n\nDefault is usually placed at the end of a switch\
    \ statement, thus allowing the execution of selected statements based on the fact\
    \ that they do not match any of the previous values (see Example B.15).\n\n# ####\
    \ Example B.15.\n\n```\n~~~csharp\nusing System;\nclass Appendix_B {\n    static\
    \ void Main() {\n        int byNumber = Console.Read();\n        switch (byNumber)\
    \ {\n            default:\n                break;\n        }\n    }\n}\n~~~\n\
    ```\n\n# ### delegate\n\nA delegate's definition includes a public access reference,\
    \ the keyword delegate, the delegate's identity (also following the standard rules\
    \ of naming), a data type reference, and its set of parameters. Delegates are\
    \ most commonly used to handle events (See Example B.16)."
  merge: -1
