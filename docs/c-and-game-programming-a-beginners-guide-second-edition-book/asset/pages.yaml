  md: "caused by moving between files. This keyword is primarily used to convey global\
    \ references, and are usually of the object data types (as are structures and\
    \ classes).\n\nStatic variables are specialized local variables that are not physically\
    \ discarded with their function’s termination, but instead are stored and reapplied\
    \ to those functions if and when they are recalled. There are many practical instances\
    \ when this added flexibility becomes important, and it helps us to remove any\
    \ further need for global variables.\n\n# String Basics\n\nThe principles behind\
    \ arrays and pointers should reveal that characters can be combined to total much\
    \ more than the sum of their parts. One simple use of this collection is simply\
    \ to make a sentence such as:\n\n```\nchar array[] = {'T', 'h', 'i', 's', ' ',\
    \ 'i', 's', ' ', 'a', ' ',\n                't', 'h', 'e', ' ', 's', 'i', 'm',\
    \ 'p', 'l', 'e', 's', 't',\n                'a', 'r', 'r', 'a', 'y', ' ', 'o',\
    \ 'f', ' ', 'd', 'a', 't', 'a',\n                's', ' ', 'a', 'n', 'd', ' ',\
    \ 'a', 'r', 'r', 'a', 'y', 's'};\n```\n\n![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_285_0.png)\n\
    \nA slightly less obvious choice would be to include that string as an array of\
    \ characters, i.e., “This is a string of data.” Of course, we’ve already seen\
    \ that either of these cases can be used as output (Console.Write (String1) and\
    \ Console.Write (Array1[index]);). However, it might not be as obvious to think\
    \ of modifying these processes to include the passing of arguments and/or the\
    \ ability to store data.\n\nA literal collection of characters, or a string, can\
    \ be passed to a function using the same process as a standard array. This string\
    \ argument requires a defined parameter (formally referred to as a string parameter),\
    \ which is equivalent to an array’s parameter. The string will be listed in quotations,\
    \ e.g., MyString (“This is a string of data”). The literal string will be stored\
    \ as a string value: static void MyString (string String1) {/* our string function\
    \ */}. In addition, since strings handle literal constants differently than arrays,\
    \ we will not suffer the effects of automatic truncation when attempting to add\
    \ characters that include whitespaces. This should also remind us of the getline\
    \ function used in C++, as in cin.getline (array, array_size), wherein we were\
    \ able to avoid such truncations."
