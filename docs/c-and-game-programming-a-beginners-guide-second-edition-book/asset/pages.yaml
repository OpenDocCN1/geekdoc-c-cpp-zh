    # The Semicolon


    When the compiler detects a semicolon (;), it knows that the command line has
    ended and that it should move to the next set of instructions. This is especially
    important when dealing with commands that are often written in varying sizes or
    those that extend over more than one line. Having such a requirement also limits
    or restricts the potential for overlapping errors found during compilation. The
    semicolon is always placed at the end of a complete statement and is always used
    to signal the end of that statement. Commands that do not require a semicolon
    often do not terminate until the end of a particular section or set of commands.
    Some programming commands do not terminate until the program itself ends, and
    hence, do not require a semicolon.


    # Whitespaces


    *Whitespaces* are simply blank spaces used to separate coding terms. Variable
    names as well as keywords require these separations, but in many other cases,
    these whitespaces are just ignored. It is, however, important to remember that
    these spaces do not indicate the end of a line, terminations of any coding, or
    any other such control. You should be careful not to abuse this ability to separate
    commands and lines (abuse would be any instance where such spacing causes visual
    confusion on the part of the programmer).


    # Preprocessor Directives


    If you have ever worked with either C or C++, you’re probably wondering when we’ll
    talk about preprocessor directives, since it was through the use of those directives
    that were given access to the bulk of what was known as the runtime libraries.
    If you’ve never heard of preprocessor directives or the terms included and/or
    header files, then here’s a quick bit of history.'
  merge: -1
  img_proc: true
- pgno: 47
  md: "Included files (listed as `#include <filename>`) were simple communiqués that\
    \ allowed the addition of specialized files to programs. In effect, they mean\
    \ “include this,” with “this” being whichever header file followed. The pound\
    \ symbol was always placed in front of the included statement, which allowed the\
    \ compiler to identify it. The files accessed were essentially little side programs\
    \ that usually did something useful like print words to the screen, or even to\
    \ the printer. Included statements and the functions that they linked to our programs\
    \ were essential to programming in C and C++. However, this is no longer the case,\
    \ since C# has eliminated the need for such references and instead uses an object-oriented\
    \ approach. This approach is actually what defines the .Net architecture and what\
    \ is meant by the Base Class Libraries (not to worry, all of these topics will\
    \ be explained in greater detail later in this text).\n\n> **Note for C++ Programmers:**\n\
    > \n> While it may appear that the `using` and `#include` statements are of similar\
    \ design, that assumption is incorrect. In fact, the key purpose of the `using`\
    \ feature is merely to allow for abbreviated class name references.\n\n![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_47_0.png)\n\
    \n# Indenting\n\nIndenting is a simple way to keep your programs looking neat\
    \ and organized. Indenting has been shown in all of the examples, and simply means\
    \ to set commands several spaces inward from the first line of a segment, which\
    \ is done to indicate that they are part of that segment. When a line is not indented,\
    \ it can mean that it is not part of the segment. Indenting, while easier on the\
    \ eyes, has only a cosmetic effect on source coding and will not affect the computer’s/compiler’s\
    \ view of the material.\n\n# Naming Variables\n\nRegardless of the language, the\
    \ simplest method of storing and/or manipulating generalized data has always been\
    \ the use of variables. A variable is used by programs to store and retrieve both\
    \ character and numeric data. While we’ll save the technical/coding portions for\
    \ the next few sections, we’ll want to at least understand the naming procedures\
    \ before moving forward. There are three basic rules when naming variables:"
