- pgno: 21
  md: 'Your program is now linked to that directory. You can remove the CD-ROM from
    its drive (remember to repeat these steps for each program as needed). To edit
    the source code and/or to proceed with compiling, see the instructions listed
    in Chapter 1.


    # How to Read this Book


    This book is written for everyone wanting to learn the C# language in a fun yet
    practical context. The book is broken up to accommodate three skill levels.


    **Part 1: Programming Basics** covers the most fundamental portions, including
    programming history, how to setup your compiler, and algorithms. It also introduces
    critical material on the .Net framework, data types, input and output commands,
    legacy coding, the Base Class Library, comparisons and loops, switch statements,
    type casting, boxing and unboxing, and method manipulations (arguments, polymorphism,
    and recursion).


    **Part 2: Game Programming Basics** also covers very basic concepts—namely single
    and multidimensional arrays, pointers (under unsafe mode), string functions, and
    streams—but eventually leads the reader out of the novice stage. Other key topics
    include an introduction to object-oriented programming, using Window’s applications
    for graphics and sounds, and realtime game programming techniques. Seasoned C/C++
    programmers can usually jump in at this level, using the earlier portions as a
    convenient point of reference.


    **Part 3: Object-Oriented Programming** begins with structures, but quickly migrates
    into classes and the principles behind object-oriented programming. Fields, methods,
    and operator overloading are discussed early on, with inheritance, virtual functions,
    delegates, and exception handling expanding our capabilities. Here, we’ll also
    expand upon the principles of the .Net environment, including reflection, threads,
    synchronization, CLS (Common Language Specifications) complaints, language specifications,
    and a further study of the Base Class Library.


    This book can also be used by anyone taking C# in a standard college course. Thus,
    the text covers topics such as bubble sorting, search algorithms, and most teachers’
    favorite, default settings (although I personally prefer using parenthetical expressions).


    In addition to following the book from chapter to chapter, you could also reroute
    your studies to include alternate paths or approaches. One such example would
    be to proceed from Chapter 2 straight to Chapter 4, since the gaming portions
    might not interest you. Alternatively, you could skip some of the more difficult
    gaming concepts listed in Chapters 3–5 and then return to that material after
    finishing the traditional studies. It is, however,'
  merge: -1
