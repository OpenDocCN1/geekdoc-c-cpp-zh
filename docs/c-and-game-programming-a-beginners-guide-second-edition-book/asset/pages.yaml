    experience.


    # Things to Remember


    +   1. Game programming starts with an idea; first you brainstorm and then you
    refine. Use diagrams and an algorithm as necessary.

    +   2. Always list algorithms in English, not code—you won''t always know what
    language you''ll need to use for the program.

    +   3. Use top-down design to simplify your tasks and write your code in modules
    so that they can be reused.'
