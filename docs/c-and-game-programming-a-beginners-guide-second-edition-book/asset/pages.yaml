  md: "# Nesting Overloaded Operators\n\nAnother interesting feature that we will\
    \ want to exploit is the ability to include overloaded operators as part of a\
    \ subclass or nested class. This allows for several distinct manipulations, which\
    \ include the ability to reference specific functions and/or specific object references\
    \ from within our main class. For example, if we were to write the program in\
    \ Example 5.30 to include two independent classes, we would not be able to reference\
    \ both classes' sets of objects interdependently, which would force us to do most\
    \ of our calculation externally. This would also require us to revise the nested\
    \ class' private members to be included as public references, which would work\
    \ against our ultimate goal of complete encapsulation (see Example 5.30).\n\n\
    # Example 5.30. Nesting overloaded operators.\n\n```\nusing System;\n\nnamespace\
    \ Chapter5 {\n    public class PeriodicTable {\n        public class Atoms {\n\
    \            public string Symbol;\n            public int Number;\n         \
    \   public decimal Weight;\n\n            public Atoms() {}\n\n            public\
    \ Atoms(string Symbol, int Number, decimal Weight) {\n                this.Symbol\
    \ = Symbol;\n                this.Number = Number;\n                this.Weight\
    \ = Weight;\n            }\n\n            public static bool operator == (PeriodicTable.Atoms\
    \ NE,\n                Atoms At) {\n                return (NE.Weight == At.Weight);\n\
    \            }\n\n            public static bool operator != (PeriodicTable.Atoms\
    \ NE,\n                Atoms At) {\n                return (NE.Weight != At.Weight);\n\
    \            }\n        }\n    }\n```"
