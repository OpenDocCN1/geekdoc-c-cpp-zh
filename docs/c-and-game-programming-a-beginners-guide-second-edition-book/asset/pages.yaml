- pgno: 465
  md: "# byte\n\nByte is an unsigned 8-bit integral data type that stores whole numbers\
    \ with a range from 0 to 255 (see Example B.6).\n\n# Example B.6.\n\n```\nclass\
    \ Appendix_B {\n    static void Main() {\n        byte Number = 100;\n    }\n\
    }\n```\n\n# case\n\nThe keyword case is written and used multiple times from within\
    \ the switch statement. Each case statement holds a numeric or character value\
    \ for comparison. If the value held by a case statement matches the value read\
    \ by the switch statement, then everything following that case statement will\
    \ be executed (see Example B.7).\n\n# Example B.7.\n\n```\nclass Appendix_B {\n\
    \    static void Main() {\n        char test = 'A';\n        switch (test) {\n\
    \            case 'A':\n                break;\n        }\n    }\n}\n```\n\n#\
    \ catch\n\nThe catch statement is part of the try block, and is used to literally\
    \ catch and then possibly repair a program when an exception is thrown. Its clauses\
    \ can include system exceptions, user-defined material, and/or a blank or generalized\
    \ catch. Note that a try block normally includes multiple catch statements, with\
    \ the most specific statements listed first and the blank or general statement\
    \ placed in the furthest position. Failure to list catches in that order may result\
    \ in a less specific catch being executed. It is also possible to rethrow an exception\
    \ from within the catch statement (see Example B.8)."
  merge: -1
