    # Game 6—Ground Assault


    Ground Assault is a combination of all the previous games, as well as several
    of the classes we just discussed. Once again, we need to lay out a simple plan,
    develop some characters, weapons, and include a line of movement—this time, I
    think we''ll even develop a few walls.


    # Brainstorming


    Since the premise of Ground Assault is that the aliens from the last game actually
    landed, we should start there. First, we''ll redesign the aliens to include whole
    bodies (the better for attacking on foot, my dear). Second, we''ll want to redesign
    our hero so that he''s not always looking up. As I stated just a moment ago, we''ll
    also develop some walls, which will be used to stop the missiles and force our
    characters to work a little for their kills.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_455_0.png)


    # Example 5.83. Brainstorming Ground Assault


    +   1. Redesign characters to include bodies, also, use only one character from
    each color group.

    +   2. Redesign the hero so that he''s not looking up, and give him the ability
    to turn in all four directions.

    +   3. Redesign the missiles to include all eight directions.

    +   4. Add four walls that are repositioned after each new level (set up the first
    pattern to repeat after you complete the fourth).

    +   5. Give the walls a distinct color.

    +   6. Give the hero three lives.

    +   7. Have him score a set number of points for killing each alien.'
