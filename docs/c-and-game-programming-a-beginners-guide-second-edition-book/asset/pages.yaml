    \ with multidimensional arrays (see the next section).\n\n# Multidimensional Arrays\n\
    \n*Multidimensional arrays* (also known as *multiple subscript arrays*) are arrays\
    \ specifically declared to hold more than one set of values. These values are\
    \ usually linked in a way that makes viewing them simpler than just writing them\
    \ as independent variables or singular arrays. They are initialized in the same\
    \ manner as standard arrays, only with the addition of a few more brackets. The\
    \ practicality of using multidimensional arrays varies from project to project,\
    \ but in general, they tend to drain the system resources and are usually computed\
    \ slower than standard arrays; thus, anything over four dimensions should be avoided\
    \ (see Example 4.12).\n\n# Example 4.12. Multidimensional arrays.\n\n```\nusing\
    \ System;\n\nnamespace Chapter4 {\n    class Class1 {\n        static void Main()\
    \ {\n            string input;\n            char[,] students_grades = new char[5,\
    \ 5];\n\n            for (int i = 0; i < 5; i++) {\n                Console.WriteLine(\"\
    Enter student {0}'s grades \"\n                    + \"from first to last:\",\
    \ (i+1));\n                for (int j = 0; j < 5; j++) {\n                   \
    \ input = Console.ReadLine();\n                    students_grades[i, j] = char.Parse(input);\n\
    \                }\n            }\n\n            Console.Write (\"Your input was\"\
    );\n            for (int i = 0; i < 5; i++) {\n                for (int j = 0;\
