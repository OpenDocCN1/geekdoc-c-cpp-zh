- pgno: 497
  md: "# Appendix C: Accessors\n\n# get & set\n\nThe get and set accessors aren't\
    \ officially keywords, rather, they are parameterless methods named to match certain\
    \ fields and used in classes and interfaces that hold a body of executable data\
    \ pertaining to the storage and retrieval of those fields. Their executable statements\
    \ may include calculations, conversions, and a large host of other tasks, but\
    \ their underlying purpose must include reading or recording to those properties.\
    \ The body of an accessor is considered equivalent to a method although they do\
    \ not include identity signatures. The get accessor returns a value and may be\
    \ set to throw a value when needed; in contrast, the set accessor is always set\
    \ to void. The keyword value is also used as an implicit parameter with setting\
    \ fields, thus it takes on the value of any passed variables. The get and set\
    \ accessors always share the same user-defined name, thus they cannot exist in\
    \ the same base class. It is then considered natural to place the set accessor\
    \ in the base class with the get accessor listed in the nest derived class. It\
    \ is also important to remember that the value retrieved by the get property is\
    \ for reference only, while the value recorded in the set property is write only\
    \ (see Example C.1).\n\n# Example C.1.\n\n```\nnamespace Appendix_C {\n    public\
    \ class BaseClass {\n        public short width;\n        protected BaseClass()\
    \ {}\n        public short Width {set{width = value;}}\n    }\n    public class\
    \ DerivedClass : BaseClass {\n        protected DerivedClass() {}\n        public\
    \ new short Width {get{return(width);}}\n        static void Main() {}\n    }\n\
    }\n```\n\n# value\n\nvalue types are implicit fields declared as part of a methods\
    \ signature, and are referenced as if they were actual fields. They have the same\
    \ limitations and abilities associated with a field of their declared type and\
    \ should be treated as such (see Example C.2)."
  merge: -1
  img_proc: true
