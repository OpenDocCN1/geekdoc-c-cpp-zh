  md: "# Pointer Variables\n\nPointer variables, like all other types of variables,\
    \ need to be declared, but because they require a location to point to, they also\
    \ need to be assigned before they can be referenced. Pointers are also limited,\
    \ like standard variables, by their data types and rules of naming. Thus, it stands\
    \ to reason that pointers declared as integers can only point to standard variables\
    \ that were also declared as integers, doubles with doubles, floats to floats,\
    \ and characters to characters. The one key visual difference when declaring pointers\
    \ is the insertion of the asterisk symbol (*), which is placed in front of the\
    \ data type's reference. This asterisk tells the compiler that this data type\
    \ is actually intended to declare pointer variables. The asterisk, in this case,\
    \ is referred to as the dereferencing operator, and the variable is referred to\
    \ as the dereference variable. The second step is to assign the pointer; this\
    \ is done by making the pointer equal to the standard variable. An ampersand symbol\
    \ (&) must precede the standard variable (ampersands are referred to as address\
    \ operators). Remember, a pointer that has not been assigned has nothing to point\
    \ to, and cannot be used (see Example 4.25). Note: There is also a void data type\
    \ pointer, which is a generalized pointer that can be linked to any of the other\
    \ data types. Void pointer data types are discussed later in this chapter.\n\n\
    # Example 4.25. Pointers.\n\n```\nusing System;\n\nnamespace Chapter4 {\n    class\
    \ Class1 {\n        static unsafe void Main() {\n            int* pointer1;\n\
    \            int variable1 = 1;\n            float* pointer2;\n            float\
    \ variable2 = 2.0f;\n            double *pointer3;\n            double variable3\
    \ = 3.01;\n            char *pointer4;\n            char variable4 = 'A';\n\n\
    \            pointer1 = &variable1;\n            pointer2 = &variable2;\n    \
    \        pointer3 = &variable3;\n            pointer4 = &variable4;\n        }\n\
    \    }\n}\n```"
