  md: 'character as a number. This type of error will not be detected by the compiler
    and will almost always produce a program prone to problems and crashes, or one
    which will just not run.


    The third type of error is a logic error, which could also be called the poor
    planning error. Examples of this type include telling the computer to subtract
    when you meant for it to add, or telling it to skip a line when you wanted it
    to print. Not thinking out the problem and/or not writing out an algorithm usually
    causes this type of error. Logic errors, like runtime errors, won''t usually show
    up when you''re compiling, but they''re sure to show up at some point. The best
    way to detect a problem of this nature is to rerun the program for several situations
    and, if possible, to recheck the results against a secondary source.


    The fourth type of error, described as a linking error, occurs when data is missing,
    faulty, or just unavailable at the time of compilation. If your program compiles
    without errors, but there are errors when you build/rebuild it, then you''ve more
    than likely made a mistake setting up your program. If your compiler is not mentioned
    in this chapter, you must consult your user manual to find the problem. If you''re
    using Microsoft Visual Studio .Net 2004 or any of the earlier versions, repeating
    the aforementioned procedures should solve your problem.


