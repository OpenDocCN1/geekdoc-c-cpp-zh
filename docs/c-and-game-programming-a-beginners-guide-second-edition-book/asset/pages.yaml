- pgno: 469
  md: "# Example B.16.\n\n```\npublic delegate void TryDelegate();\npublic class Appendix_B\
    \ {\n    static void Main() {\n        TryDelegate();\n    }\n    public static\
    \ void TryDelegate() {}\n}\n```\n\n# do\n\nDo, as part of the do-while combination,\
    \ allows for the execution of a set of statements, or block. This block will execute\
    \ indefinitely, terminating only when a false expression is found. Do-while loops\
    \ begin by executing their blocks, then they test and repeat, guaranteeing at\
    \ least one execution before the process is terminated (see Example B.17).\n\n\
    # Example B.17.\n\n```\nclass Appendix_B {\n    static void Main() {\n       \
    \ do {}\n        while (true);\n    }\n}\n```\n\n# double\n\nDouble is a 64-bit\
    \ data type used to store floating point values ranging from ±5.0 × 10³²⁴ to ±1.7\
    \ × 10³⁰⁸, its precision level is 15–16 digits (see Example B.18).\n\n# Example\
    \ B.18.\n\n```\nclass Appendix_B {\n    static void Main() {\n        double Number1,\
    \ Number2;\n        Number1 = 1.0;\n        Number2 = 1.1;\n    }\n}\n```"
