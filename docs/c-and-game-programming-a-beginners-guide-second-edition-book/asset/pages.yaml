- pgno: 27
  md: '# C# from the Beginning 1


    > "Everything should be made as simple as possible, but not simpler."

    > —Albert Einstein


    This chapter covers the basic aspects of the C# language including its history,
    compilers, algorithms, variables, and the use of the Base Class Library. Each
    section is designed to facilitate a quick and easy introduction and to ensure
    a strong foundation in programming and problem solving. Special attention was
    placed on what a new programmer needs to know and/or might be confused about;
    the sections can, however, be covered quickly. There are a few sections set aside
    to cover history and theory, but the core of this chapter is about programming.
    Two sections promote good programming habits and there is a section on runtime,
    programming, and compiler errors (recommended reading even if you don''t get into
    trouble). If you''ve skimmed the lessons, you know that this first chapter doesn''t
    include any games, but don''t let that fool you. All of the concepts covered here
    are just as important for games as they are for business and/or math related topics.


    # An Overview of the C# Language


    C# is a high- or mid-level programming language (and just in case you didn''t
    know, a programming language is the collection of words, phrases, and syntax rules
    used to communicate with the computer). Although there are many high-level programming
    languages (BASIC, JAVA, FORTRAN, Pascal, Lisp, ADA, Modula-2 and Logo), few have'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'reached the popularity of the original C and C++ languages. C and C++ have
    been used to create everything from operating systems and word processing packages
    to compilers for other high-level languages. C and C++ have been the programming
    languages of choice for more than 50 percent of all programming applications,
    and with their advances in object-oriented programming and Internet applications,
    both Managed C++ and C# are sure to fuel the popularity of C languages well into
    this new millennium.


    # A Little History on the Cs


    C was developed in the 1970s by Dennis Ritchie while he worked at AT&T Bell Laboratories.
    Before C, there was a language called B developed by Ken Thompson. While there
    was an A language, B was actually developed from Basic Combined Programming Language
    (BCPL), which was developed from a combination of two other languages, namely
    CPL and Algol60. C++’s object-oriented portions are attributed to still another
    language known as Simula67. CPL begot BCPL; BCPL begot B; B begot C; C begot C++;
    and C++ begot C#. In 1979, Bjarne Stroustrup (also at AT&T Bell Laboratories)
    developed the first version of C++ to be an enhanced version of the C language
    (initially referred to as C with classes). C++ was significantly enhanced with
    the addition of the Standard Template Library (STL) developed by Alexander Stepanov
    and Meng Lee at Hewlett-Packard. The STL was based heavily on previous work done
    by both Stepanov and Musser, from Rensselaer Polytechnic Institute.


    Both C and C++ spread quickly in power and use, but eventually all the added features
    and expansions lead to incompatibilities and frustrations. Two standards were
    created, first with the American National Standards Institute (ANSI) C standard
    of 1983, and then the American National Standards for Systems Information and
    International Standards Organization (ISO) C/C++ standards of 1998 (Note: C was
    also updated in this second standard). The 1998 ANSI/ISO standard is generally
    referred to as Native C++, while Microsoft’s .Net Extensions are known as Managed
    C++. C# was also standardized with its first release under what is known as the
    2001/2002 ECMA certified standard.


    C# was developed by a team of Microsoft programmers led by chief architect Anders
    Hejlsberg. It is intended to supplement the development of applications required
    for both stream users and intranet/internet programmers alike. C# is definitely
    one of the most sophisticated languages ever developed, and similar to the entire
    .Net architecture, it will alter the way programmers think about programming for
    many years to come.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Hejlsberg was also responsible for the development of Microsoft''s Visual J++,
    Turbo Pascal, and Delphi, for which he finally received the Dr. Dobb''s Journal
    Award for Excellence in Programming early in 2001. For further information on
    the history of Turbo Pascal, Visual J++, and the Dr. Dobb''s Journal Award, you
    should consult your local library… now let''s get back to business.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_29_0.png)


    As you can see, C# evolved from the simpler languages.

    Hey, I thought it was created by a programmer.


    # What is the .Net Framework?


    The .Net framework is a multitasking, class-based programming library and interface
    that allows for both the interoperable exchange and execution of data. As a library,
    the .Net base classes are as powerful as the traditional Windows API function
    set, but have the added advantage of being completely object-oriented. Object-oriented
    programming (as explained throughout this book) is a practical method used to
    develop programs that promotes both the reusability and reliability of code. The
    .Net runtime (also known as the Common Language Runtime or CLR) serves as a shell
    or intermediate environment that assists the operating system with program execution(s).


    The .Net framework also allows for program interoperability, requiring a Common
    Type System (CTS) governed through the Intermediate Language commonly known as
    Microsoft''s Intermediate Language (MSIL) and/or the Common Intermediate Language
    (CIL). Intermediate Language should not be confused with Java''s interpreted byte-type
    coding, which does not have the ability to be compiled. Microsoft has also developed
    a secondary type of compilation known as JIT (just in time) compilations. Under
    JIT, programs are not only installed into our systems, but the code is optimized
    for the processor. In addition, JIT compilation shortcuts the basic startup time
    by limiting compilation to only the required portions, which also improves overall
    performance.


    The .Net architecture also offers some interesting advantages, including memory
    management (also known as garbage collection) and zero-impact installation. Garbage
    collection (stemming from Java) is a systematic approach to eliminating previously
    allocated memory'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'that is no longer being referenced. While garbage collection diminishes the
    programmer’s power to control memory deallocation, it does help to prevent dangerous
    memory leaks, and saves the programmer additional time that would normally be
    spent implementing destructors. Likewise, zero-impact installation has been developed
    to save the programmer and consumer many hours of frustration by eliminating the
    errors caused by faulty versioning. Under normal Windows operation, a typical
    *.dll* type file would be included as part of a centralized reference, which in
    turn would make it subject to deletion whenever a new version is installed. If
    that new version is not entirely backward compatible, then the replacement file
    can cause the program to fail. With zero-impact installation, alternate versions
    of otherwise identical files can exist side by side, thereby eliminating this
    problem.


    In addition, .Net offers increased code security, application domain restrictions,
    strong typing, and namespacing. The increase in security allows the consumer to
    control the level of access granted to any single program, with MSIL also determining
    the level of access requested by a program before its execution (This may help
    to prevent some unscrupulous programmers from damaging our files.). *Application
    domain restrictions* prevent memory conflicts between interrelated applications
    through the use of *virtual memory barriers*, which are barriers that restrict
    access, but do not impose processor delays. (This process is controlled through
    MSIL.) *Strong typing*, also governed by MSIL, requires that we specifically state
    data types, thus preventing ambiguous runtime errors; unfortunately, this also
    prevents us from using templates (excluded from the C# programming language).
    Finally, *namespacing*, originally designed to prevent Native C++ naming conflicts,
    is now a requirement of the .Net architecture, wherein all types must be defined
    with either an explicit or a global namespace.


    # Managed Code and Assemblies


    *Managed code* is the term used to define the coding implemented under the .Net
    framework, while the terms *native* and *unmanaged code* are used to indicate
    coding that bypasses this new architecture and is implemented directly through
    the Windows API. *Assemblies* are units in which managed coding is stored. Assemblies
    also contain information packets referred to as *metadata*: metadata packets keep
    track of an assembly’s contents including its objects, methods, and types. Shared
    assemblies are stored in a central area referred to as the assembly’s *cache*.
    Metadata packets are stored in an area inside these assemblies known as the *manifest*.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Algorithms


    Before we can jump into writing programs, we''ll have to learn a little bit about
    designing them. The first step in designing a program is writing its algorithm.
    Writing an algorithm is not the same as writing a program; it doesn''t require
    the use of a computer language, or even a computer. An algorithm can be applied
    to any task or set of tasks. Writing down directions is probably one of the most
    common examples of an algorithm; recipes, diets, and math solutions are others.
    Some beginner programmers don''t understand the need for algorithms, believing
    instead that they can plan their programs as they go, or after completing the
    introductory part of their coding. However, such programming styles often lead
    to hazards such as additional time spent problem solving and/or more time spent
    rewriting code to incorporate each new idea or feature. Thus, it is always best
    to start with an algorithm. Therefore, I''ve included an outline of the algorithm
    used to write a C++ version of the first arcade style game taught in Chapter 3—Paddle
    Tennis (see Example 3.5).


    # Example 1.1. Abbreviated Algorithm for Paddle Tennis.


    +   1. Create a viable Windows handle accessible through the Windows console settings.

    +   2. Write a function to draw the player''s characters.

    +   3. Include a function that paints/clears the screen.

    +   4. Define most of the variables as a member of a single class, with the most
    notable exception being the color settings.

    +   5. Set the variables/member, setting the ball to a random direction.

    +   6. Create a while-loop that ends when the game ends.


    Inside the while loop


    +   7. Write a function that removes our residual images using a combination of
    calls to blank characters and/or a full-blown clear screen function.

    +   8. Set the colors: Since these colors never change, this can be done from
    either the do-while or internal while loop.

    +   9. Display the players, ball, and the scores (0 to 0 as we start).'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   10. Write a function that reads the players input from the keyboard.

    +   11. Write a function to propel the ball.

    +   12. Write a function to limit the area in which the players can traverse.

    +   13. Include sounds when the ball bounces

    +   14. Check to see if the ball and player have collided (see Collision Detection:
    The Ball in Motion). The ball should bounce off the player.

    +   15. If the ball gets to the end of the screen and the player is not there,
    give the other player a point. Now, reset the ball.

    +   16. Repeat the loop until either player scores a specified number.

    +   17. Ask player(s) if they want to play again. Remember a good game loop should
    always allow the player(s) the option of playing again.

    +   18. End or repeat game.


    If this seems a bit long, keep in mind that the actual Paddle Tennis subroutines
    are part of a program that is more than 100 pages long, and even the simplest
    professionally designed program will tend to run over a 1000 pages. Algorithms
    do not have to include complete sentences, have correct grammar, or even need
    to be entirely in English. Yet, having something that you can actually read and
    that lists the steps to the solution is important. Further, when writing an algorithm
    shared by others, never assume that they can read something written in C#; after
    all, they might be planning to write the program in another language such as VISUAL
    BASIC, managed C++, or just plain old-fashioned C.


    # The .Net Compiler


    A traditional compiler translates higher-level languages into the machine''s own
    language, appropriately named Machine Language. Programmers developed higher-level
    languages such as C and C++ to bridge the gap between human languages and the
    computer''s binary code of ones and zeroes. As difficult as C# and other high-level
    languages seem, their difficulty doesn''t compare to the complexity of trying
    to'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'understand the endless rolls of ones and zeroes, such as 01010011 00010100
    00011101, found in machine language. In addition to machine language, there is
    also a low-level language known as Assembly Language, which serves as an intermediary
    between C and that binary code. However, the advent of C# and the .Net framework
    replaced this concept.


    The new way of thinking about compilation is to break it into two steps: The first
    step is, a conversion to MSIL, which allows for both the construction and testing
    of our products from within the compiler''s simulated environment. The second
    step, JIT compilation, isn''t implemented until the moment of execution, hence
    the name just in time. With this new form of compiling, Microsoft has been able
    to implement several new features, including role-type and code-type based security,
    memory type safety, and interoperability. Role-type and code-type based security
    relate to a program''s base of identity and the level of access granted to that
    code. If an unauthorized program attempts to access/alter any other application
    without MSILs express permission, the execution of that program is not allowed.
    The same is true for type safety; if the MSIL environment detected that any newly
    executed program will cause a memory address conflict, that program is also denied
    system access. In addition, this new method opens up our coding to an entirely
    new level of code interoperability; with it, we can intermix between objects written
    in different languages, step between references, and even use those objects as
    inheriting classes. There is also the potential for reflective comparisons with
    respect to both interoperable and internal files (See later chapters for details.).


    > **Common Language Specifications:** While the .Net framework is designed to
    promote language interoperability, the use of the C# language does not guarantee
    that level of interaction. We can, however, make C# CLS compliant with what are
    generally only minor adjustments to our overall method of programming. For example,
    we must adjust our programs to avoid the use of unsafe coding (specifically, pointer
    notation). In addition, we must avoid the use of some data types, namely `sbyte`,
    `ushort`, `uint`, and `ulong`. Finally, we''ll have to restrict our naming practices
    to avoid conflicts with Visual Basic''s inability to distinguish between upper
    and lower case settings (e.g., `Class1` and `class1`).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_33_0.png)'
  merge: -1
  img_proc: true
