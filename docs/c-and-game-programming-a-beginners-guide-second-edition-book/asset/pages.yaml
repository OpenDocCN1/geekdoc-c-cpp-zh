  md: "# Keyboard Input\n\nThe Read and ReadLine commands, as their names imply, allow\
    \ us to input information from the keyboard. Both statements are written as console\
    \ methods, similar to the Write commands, the difference being that they are used\
    \ to extract information rather than project it. The basic Read command is only\
    \ capable of storing single character inputs (see Example 1.38). The ReadLine\
    \ method, in contrast, can input virtually all data types. Doing so, however,\
    \ requires a parse conversion reference that is linked to the appropriate data\
    \ type, with string as the default setting. Parse, like the ReadLine and WriteLine,\
    \ is not actually a keyword, but rather a referencing method available through\
    \ the .Net architecture via the \"system\" reference.\n\n# Example 1.38. The Read\
    \ command.\n\n```\nusing System;\n\nnamespace Chapter1 {\n    class Class1 {\n\
    \        static void Main() {\n            char character;\n            int integer;\n\
    \n            Console.WriteLine(\"Enter a number here: \");\n            integer\
    \ = Console.Read();\n            character = (char) integer;\n            Console.WriteLine(\"\
    And the number you entered is \"\n                + character);\n        }\n \
    \   }\n}\n```\n\n> Program Walkthrough\n> \n> Like all of the previous programs,\
    \ this one begins with a comment describing its purpose. The .Net system is referenced,\
    \ and the void data type declares the main function. The first statement prints\
    \ the text line \"Enter a number here.\" Now the ReadLine function waits for the\
    \ user to input a number. When a number is entered, the program will store this\
    \ information into the variable my_number. The program will then reprint its value\
    \ after the words \"The number you entered is.\" This process can be repeated\
    \ for any of the real number data types, as well as the character data type—see\
    \ Example 1.39."
