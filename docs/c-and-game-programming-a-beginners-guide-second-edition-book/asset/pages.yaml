- pgno: 383
  md: "```\nTV++;\nTV--;\n}\n}\n```\n\n# Introducing Inheritance\n\nIt is through\
    \ the use of *inherited classes*, their virtual functions, and the methods and\
    \ fields used to construct those classes that transforms this definition from\
    \ abstraction to a tangible coding methodology. The theory behind object-oriented\
    \ programming embraces three key principles: encapsulation, inheritance, and polymorphism.\
    \ It is natural, then, to include in those principles, a generic reusability and\
    \ a hierarchical structure.\n\n*Inheritance* is the ability of a specialized,\
    \ or *derived*, class to appropriate the coding included in an abstract or base\
    \ class. This appropriation allows for the readministration of the base class'\
    \ attributes without the cost of redevelopment and testing usually found when\
    \ attempting to expand upon a previously developed component. Hence, a derived\
    \ class is a combination of its unique coding and that of the linked coding. Once\
    \ a derived class is established, it too becomes subject to other derived classes,\
