  md: "```\npublic Rectangle getRectangle() {\n    return(rect);\n}\n```\n\n# Introducing\
    \ Direct3D\n\nManaged Direct3D is a low-level graphics application/programming\
    \ interface used to render two- and three-dimensional images for static and animated\
    \ projects relating to both basic and graphically intense programs. Managed Direct3D\
    \ takes advantage of hardware acceleration to produce high-quality real time graphics,\
    \ while requiring only a minimal amount of down time relating to the learning\
    \ curve as compared to the pervious versions of DirectX. The Managed Direct3D's\
    \ namespace includes nearly 300 classes, structures, enumerations, and delegates,\
    \ each of which includes a large set of members, properties, and fields. Fortunately,\
    \ most applications require only a few common references, usually beginning with\
    \ the device class (see Direct3D's Device Class for details).\n\n# Direct3D's\
    \ Device Class\n\nThe device class includes three constructors, of which only\
    \ one is used in Managed DirectX: `public Device(int adapter, DeviceType deviceType,\
    \ Control renderWindow, CreateFlags behaviorFlags, PresentParameters [] presentationParameters);`\
    \ The first parameter, *adapter*, refers to the physical device referenced by\
    \ the computer with a unique adapter identifier (note that zero indicates the\
    \ default). The *deviceType* include *Hardware*, *Reference*, and *Software*.\
    \ *Hardware* refers to direct access, while *Reference* refers to emulation. (Emulation\
    \ is required when the hardware does not support the requested feature.) The *Reference*\
    \ rasterizer is much slower and requires that all users have the SDK installed;\
    \ hence, it should only be used for debugging. There is also a custom *Software*\
    \ rasterizer, which has limited availability. The *behaviorFlags* (behaviorFlags.SoftwareVertexProcessing)\
    \ control the device's behavior, specifying our processing unit, e.g., the CPU\
    \ and GPU. (The GPU offers the best performance; again, this depends on hardware\
    \ availability). The constructor *presentationParameters* is used to control presentation,\
    \ which includes two key members: *Windowed* and *SwapEffect*. The Windowed member\
    \ (a Boolean type) is used to determine the window's status (true for"
