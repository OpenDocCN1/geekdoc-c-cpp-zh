    \  Triangle(Instance);\n}\n}\n}\n```\n```\n\n# Overriding and Virtual Methods\n\
    \nIn addition to overloading a function (i.e., changing the signature or parameters\
    \ of that function), we can also override a function so as to force the compiler\
    \ to accept a secondary version of that function. As its name implies, the keyword\
    \ override is used to override members inherited from a base class. These inherited\
    \ methods must have matching signatures and be either virtual, abstract, or previously\
    \ overridden. Overriding also allows us to manipulate a program’s data so as to\
    \ give it the illusion of consistency or to save the trouble of revising a new\
    \ method’s parameters. The secondary version of the function is the obvious choice,\
    \ as our instance was declared as part of that inherited class. On a cautionary\
    \ note, it should also be mentioned that if any overriding functions also reference\
    \ their base version (as is commonly done with privately inherited classes), that\
    \ function’s reference will be diverted back to the inherited function (we can\
    \ also return access to the original method via the base command)."
