  md: "# override\n\nIn addition to being able to overload a function (for example,\
    \ to change the signature or parameters of that function), we can also override\
    \ a function so as to force the compiler to accept a secondary version of that\
    \ function. As its name implies, the keyword `override` is used to override members\
    \ inherited from a base class. These inherited methods must have matching signatures\
    \ and be either virtual, abstract, or previously overridden. This technique also\
    \ allows us to manipulate that program’s data so as to give it the illusion of\
    \ consistency, or to save us the trouble of revising our previous class. The secondary\
    \ version, then, becomes the obvious choice, as our instance was declared as part\
    \ of that inherited class (see Example B.46). On a cautionary note, it should\
    \ also be mentioned that if an overriding function had also referenced its base\
    \ version (as is commonly done with privately inherited classes), that function’s\
    \ reference would then be diverted back to the inherited function. Note that we\
    \ can also return access to the original method via the base command.\n\n# Example\
    \ B.46.\n\n```\nnamespace Appendix_B {\n    public class Area {\n        public\
    \ Area() { }\n        public virtual void CalculateArea() { }\n    }\n    public\
    \ class Parallelogram: Area {\n        override public void CalculateArea() {\
    \ }\n        static void Main() { }\n    }\n}\n```\n\n# params\n\nThe keyword\
    \ params is used to pass an array of any object type without explicitly declaring\
    \ that data as an array. Only one object may be passed as a params per declaration,\
    \ and any other declaration must precede that statement (see Example B.47)."
