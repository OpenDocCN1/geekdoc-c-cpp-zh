- pgno: 174
  md: 'As part of creating a DirectInput keyboard reference, we’ll need to include
    a device assignment. Device assignments are generally listed as private class
    members. We’ll also want to include a timer reference, for example:


    ```

    using Microsoft.DirectX.DirectInput;


    private Microsoft.DirectX.DirectInput.Device keyboard = null;

    private System.Windows.Forms.Timer Keyboard;

    ```


    Next we will need to include a reference to that timer, as well as an event handler:


    ```

    this.Keyboard = new System.Windows.Forms.Timer (this.components);

    this.Keyboard.Tick += new System.EventHandler (this.Keyboard_Tick);

    ```


    Remembering to include our actually Keyboard_Tick function and the reference,
    we use:


    ```

    Keyboard.Start ();

    ```


    Finally, we’ll need to test this sequence (see Example 3.10 on the CD-ROM).


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_174_0.png)


    > While the background color used to create the tennis ball bitmap is blue, the
    `ColorKey colorkey = new ColorKey ();` and `BallDraw.SetColorKey (ColorKeyFlags.SourceDraw,
    colorKey);` commands along with the `buffer.ColorFill (Color.Blue);` actually
    allow us to reuse that drawing with alternate background colors.


    # Erasing Residual Images


    Erasing residual images is an important step in the creation of the illusion of
    animations; each character must be erased before its temporal counterpart can
    be displayed. This process is usually handled through the invalidation of a rectangle
    or defined area. The actual work or process is handled by Windows, but the referencing
    of that system is done from within our programs. Surprisingly enough, we’ve already
    included an invalidation reference, which is almost plugged in without thought.
    Yet there should also be a set of cautions'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'that come with this reference, since the overuse of invalidating commands will
    cause undue flickering and possibly make our games unplayable. For an intermediate
    reference, we''ll also want to *localize* our rectangles, which will reduce overall
    flickering (this will become especially important when working with more complex
    games).


    Our third step, although slightly out of phase with our algorithm, will be to
    demonstrate these techniques. This task could be accomplished in a number of ways,
    but to get the best results (as little flickering as possible), we''ll have to
    use our invalidation command sparingly, and thus we''ll only call that command
    when a change in imagery is absolutely necessary. For example, if the ball is
    active we''ll have to call it, and if a player moves to a new position we''ll
    have to call it, but if the ball is in motion and the player moves, only the predominating
    ball movement needs to invalidate the screen, since the entire screen will still
    be updated.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_175_0.png)


    Remember, the source code is included on the CD-ROM.


    # Collision Detection: The Players'' Boundaries


