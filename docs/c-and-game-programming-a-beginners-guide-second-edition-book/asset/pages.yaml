- pgno: 459
  md: '# Troubleshooting


    If you''ve gotten the previous programs to run, but are having trouble with these
    new ones, then the problem must be in the setup. Try going back over the steps
    and repeating steps from the earlier games. You might also want to try including
    all the classes as part of the same file. If the combined file runs correctly
    then there must be something wrong with the way you''re setting up the secondary
    files.


    # Questions


    +   1. Build a simple structure and reference it from the main method. Then, using
    public fields, rebuild that structure as a class.

    +   2. From Question 2, convert that class'' public fields into protected fields
    (build as many secondary methods as you need to get the job done).

    +   3. From Question 3, convert those fields into private members. (Hint: You
    may need to add additional methods.)

    +   4. Write a class that allows for both overloaded arithmetic and comparison
    operators.

    +   5. Write a simple public, nested class, and then replace that nested class
    with an inherited class.


    # Assignments


    Now that you have a working knowledge of the C# language and a basic grasp of
    game programming, it''s time that you attempt to develop your own games. First,
    try developing an eighth game that ties into the classes already developed (Note:
    No new classes should be added). Next, try developing your own set of classes,
    possibly with two new games, and then one more game where you are again not allowed
    to alter those classes (in the second test, however, you may opt to build additional
    inherited classes).


    # Conclusion


    So, you''ve mastered the games, and in doing so, have mastered both C# and the
    concept of object-oriented programming. You might now be wondering, “What is next—where
    do I go from here?” Or more importantly, “How can I turn these new found skills
    into a paying'
