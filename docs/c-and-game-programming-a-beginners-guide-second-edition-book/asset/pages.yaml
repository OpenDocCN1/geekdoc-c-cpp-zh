    \ design faster and more convenient (see Example 1.5).\n\n# Example 1.5. XML commands.\n\
    \n```\nusing System;\n\nnamespace Chapter1 {\n    /// Place your XML tags here\n\
    \    /// ...\n    class Class1 {\n        static void Main () {\n            /*\
    \ this is still a do nothing program */\n        }\n    }\n}\n```\n\n# Screen\
    \ Output\n\nNow that we have the basics of writing a do-nothing program, let's\
