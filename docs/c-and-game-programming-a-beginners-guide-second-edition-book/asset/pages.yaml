- pgno: 235
  md: '# The Mouse


    Again, with the mouse you''re more than likely to have forgotten something. Forgetting
    to include the Mouse.Start () and/or Mouse.Tick are the most common errors. Another
    problem with DirectInput''s mouse is that it tends to override the other input
    device, hence, the need for mouse inquiries (see DirectInput: the Mouse for details).


    # DirectSound


    DirectSound cannot play compressed audio data. This is compounded by the fact
    that DirectSound does not test for faulty audio data. This issue is best solved
    by testing the wave files used with your game. Replacing a questionable file with
    a known good file usually helps in identifying the problem. The try-catch block
    can also be used, but this tends too merely hide the problem. Other problems include
    corrupt or missing wave files.


    # Common Errors, Problems, and Pitfalls


    +   1. If the games are compiling, but you get a runtime error and/or you only
    detect the default sound, your references are probably not to the appropriate
    directory. For example, if you''ve copied the games to your D:\ drive, then the
    C:\ listings would all be in error. Make sure all the bitmaps, wav files and classes
    are not only included as part of your project, but also referenced at the appropriate
    locations.

    +   2. Check to make sure your files are listed with the appropriate directory.
    For example, the games listed in the text are clearly marked as coming from the
    C:\ drive under the subfolder Games.Net, while the CD-ROM versions are marked
    as SourceCode\.

    +   3. Are you using Microsoft Visual C# version 7?

    +      - If your answer is yes, see Question 2.

    +      - If your answer is no, try looking up any errors or warnings in your compiler''s
    help menu.

    +   4. Can you get any of the animation test programs to work?

    +      - If your answer is yes, see Question 3.'
