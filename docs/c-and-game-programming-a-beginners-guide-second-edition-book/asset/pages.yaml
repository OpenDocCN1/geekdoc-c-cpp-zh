  md: '# # Troubleshooting


    Here we are again, back in troubleshoot. This time, however, we''re more like
    seasoned veterans, working through the details of games that seemed foreign to
    us just a few weeks ago. We''ve built the standard games, we modified them once,
    twice, a third time maybe, and now we''re just trying to figure out the end pieces.
    Sure, there''s obviously something wrong, but try looking at it another way—look
    how far we''ve come. Moreover, if it takes a few more days to reach that next
    level, well then, that''s what it takes.


    > > If however, you happen to be a skimmer, someone who is not already familiar
    with C#, then I''d recommend that you stop, go back, and do the work that it takes
    to get here. There''s really no point in struggling through the problems of DirectX
    if you haven''t already mastered the safer, yet equally rich, coding presented
    under GDI+. Remember, much of the gaming structures are identical, so you might
    as well learn them under the simpler format.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_233_0.png)


    The problems and solutions found in this section are exclusively for DirectX 9.0,
    listed under the categories of Installing, DirectDraw, DirectInput, and DirectSound.
    If you have any other compiling or troubleshooting questions, please see the troubleshooting
    sections in the last two chapters.


    When installing DirectX, it''s important to remember to uninstall the previous
    or even the same version of DirectX before installing either a new compiler or
    a new SDK. Installing the SDK without first removing the old version will result
    in a bad installation.


    DirectDraw''s errors seem to center around the bitmap. First, if you attempt to
    load any file type other than bitmap, you''ll have an error. Second, if the program
    fails to find the designated bitmap, you''ll have an error. Third, if the program
    attempts to display the bitmap anywhere but inside its designated area, you''ll
    have an error. Fourth, if your program attempts to display a bitmap before the
    last bitmap was drawn, you''ll have an error. Of course, the first two errors
    are physical in nature (a moved file, a mistyped format); it''s actually only
    the second two that can be remedied through code manipulation. Here, we''ll have
    two choices: 1) to include a try-catch block to bypass the exception or 2) to
    use an ignore exception (see Examples 3.83 and 3.84).'
