  md: "# # Animation\n\nAnimation is the illusion of movement based on a number of\
    \ elements, which include a change in background, a change in character appearance,\
    \ and the actual physical displacement of an object. This section, thus, is intended\
    \ to review animation not just from the standpoint of Cartesian coordinates, but\
    \ also from the viewpoint of the generic method. The method `Animate()` will be\
    \ included as part of the AnimatedImage class. As a generic class/method, AnimatedImage\
    \ and its component Animate will be/have been retrievable by all our games. The\
    \ expression using GameClasses is what makes these components useable.\n\n`Animate`\
    \ is a virtual public method that does not return a type. The method includes\
    \ a switch statement using North, South, East, and West to indicate Up, Down,\
    \ Left, and Right. Southeast, Southwest, Northeast, and Northwest allow for diagonal\
    \ movements.\n\n# ## Example 5.62. Animate objects\n\nHere, we’ll want to create\
    \ our first method—notice how the name `Animate()` conveys its meaning. Of course,\
    \ it’s really just a simple set of value manipulations controlled by a switch\
    \ statement, but by placing it inside a class, we dramatically increase its potential.\n\
    \n```\n```java\n// Animate() performs all position movements on the object.\n\
    virtual public void Animate() {\n    switch(direction) {\n        case SOUTHWEST:\n\
    \            this.imagePosX -= animationStep;\n            this.imagePosY += animationStep;\n\
    \            break;\n        case SOUTH:\n            this.imagePosY += animationStep;\n\
    \            break;\n        case SOUTHEAST:\n            this.imagePosX += animationStep;\n\
    \            this.imagePosY += animationStep;\n            break;\n```\n\n```"
