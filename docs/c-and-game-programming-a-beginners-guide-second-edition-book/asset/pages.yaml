    # Three-Dimensional Sound


    Most people are inherently familiar with monophony or monophonic sound (the reproduction
    of sound through the use of a single transmission path), as well as stereophony
    or stereophonic sound (the recording and transmission of sound using multiple
    channels). Many are also becoming acquainted with three-dimensional sound and
    surround sound systems. Thus, DirectX or the DirectSound API has been equipped
    with methods used to simulate three-dimensional space. The two key methods are
    Buffer3D and Control3D, used to manipulate the source as well as the position
    and orientation, respectively. It is important to remember that while Buffer3D
    controls the 3D settings, we''ll still be relying on the original buffer to control
    our play settings (see Table 4.6).'
