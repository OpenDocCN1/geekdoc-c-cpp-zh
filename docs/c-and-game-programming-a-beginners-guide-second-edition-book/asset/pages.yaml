- pgno: 48
  md: '+   1. Variables consist of only letters, numbers, and the underscore symbol.

    +   2. Variables must always start with a letter or the underscore symbol. (Note:
    Underscores and coded prefixes are usually reserved by large projects and companies).

    +   3. Variables cannot have the same name as a reserved word or keyword (see
    Table 1.2 for a complete list of keywords). It is possible to use the special
    @ symbol to override this limitation as in @char, but this is usually unnecessary.


    In addition to these variable rules, there are also some good naming practices
    that should be followed.


    # Naming suggestions


    +   1. Give the variable a descriptive name such as player_1, ball, or joystick2;
    descriptive names reduce the likelihood of confusion.

    +   2. Use a consistent style when writing variables, such as alien_1 and alien_2
    or Alien_1 and Alien_2. Do not randomly mix upper and lower case letters as in
    AliEN_1, AliEn_1. C#, like both C and C++, is a case sensitive language—it reads
    uppercase and lowercase letters as different symbols, and thus, these randomly
    named variables will not be read as the same value.

    +   3. To remain consistent, you can adopt one of two styles: Humpback, which
    capitalizes the first letter of each word (PlayerOne); and Camel (also known as
    Pascal), which capitalizes the first letter of interior words, but not the initial
    letter (playerOne). These notations are the standard for most companies, including
    Microsoft.

    +   4. C and C++ also follow a special naming procedure known as Hungarian Notation.
    This notation involves giving data types beginning letters that identify their
    declared types. Since C# uses an object based method, the practicality of using
    Hungarian Notation is limited. However, for backward compatibility and historical
    purposes, it is helpful to have a knowledge of this notation (see the Hungarian
    Section later in this Chapter).'
