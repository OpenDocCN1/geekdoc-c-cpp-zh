  md: "# # Introducing Recursion\n\nA *recursive function* is a user-defined function\
    \ that contains one or more odd iterations caused by the unusual placement of\
    \ a secondary call to that function. The position or placement of this secondary\
    \ function call is considered unusual or at least a special topic because it invokes\
    \ a function from within that function. That is to say, when the programmers created\
    \ the function, they included it in a call to itself that causes that function\
    \ to loop repeatedly, or at least multiple times. (Note: This would also mean\
    \ that it would have to return to itself multiple times before returning to the\
    \ main or calling function). The reasons for manipulating a function in this manner\
    \ are diverse and at times confusing, but ultimately, the coding for such examples\
    \ is quite simple, as shown in Example 2.47. Note the recursive function used\
    \ to test our horseracing program earlier in this chapter.\n\n# ### Example 2.47.\
    \ Recursion.\n\n```\n```csharp\nusing System;\n\nnamespace Chapter2 {\n    class\
    \ Class1 {\n        static void Main() {\n            Password();\n        }\n\
    \n        static void Password() {\n            string input;\n            int\
    \ password;\n\n            Console.WriteLine(\"\\n Enter Your Access Code Now:\
    \ \");\n            input = Console.ReadLine();\n            password = int.Parse(input);\n\
    \            if (password == 1024) {\n                Console.WriteLine(\"\\n\
    \ Access Granted\");\n                return;\n            } else\n          \
    \      Password();\n        }\n    }\n}\n```\n```"
