  md: '# # Drawing with DirectDraw


    > > In Chapters 5, we take an extended look at the properties associated with
    the Direct3D and GDI+ drawing tools. This section is meant to introduce a limited
    set of DirectDraw methods used to create fonts, lines, curves, and shapes, which
    will aid in creating rendered versions of our first set of games.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_218_0.png)


    DirectDraw provides us with several methods used to produce everything from basic
    shapes to some intricate designs. Here, I’ll introduce some of the alternative
    drawing tools and many of the techniques associated with rendered graphics. (For
    information on rendered graphics using Direct3D, see Chapter 5.)


    # ## DirectDraw: Text


    Before we begin to draw, first we’ll want to learn to write. This is done using
    three simple references, namely ColorFill, ForeColor, and DrawText. ColorFill
    is used to paint the background, while ForeColor and DrawText are used to paint
    and display text, respectively. Failing to assign a ForeColor or assigning a single
    color to both ForeColor and ColorFill will result in undetectable text. The DrawText
    method includes four parameters: int X, int Y, String, and draw at last position
    (a Boolean type), where X and Y are Cartesian coordinates, String is the content
    to be display, and the last parameter, draw at last position, is set to false,
    as it is superfluous (see Example 3.55 and Example 3.56 on the CD-ROM).


    # Example 3.55. Text display.


    ![](img/bdd7d3d10cc8dfc1d71aaaf7003fc32b_218_1.png)'
