  md: "# Appendix E: Displaying Message Boxes\n\nMessage boxes are predefined dialog\
    \ boxes that are used to send and receive simple data streams between the user\
    \ and the program. These messages may include titles, comments, and buttons that\
    \ allow for a short list of responses, such as yes, no, ok, and cancel (see Examples\
    \ E.1–E.17).\n\n# Example E.1. The message box.\n\n```\n```csharp\nusing System;\n\
    using System.Drawing;\nusing System.Collections;\nusing System.ComponentModel;\n\
    using System.Windows.Forms;\nusing System.Data;\nusing System.IO;\nusing System.Runtime.InteropServices;\n\
    \nnamespace Appendix_E {\n    public class Form1 : System.Windows.Forms.Form {\n\
    \        [DllImport(\"winmm.dll\")]\n        public static extern long PlaySound(String\
    \ lpszName,\n            long hModule, long dwFlags);\n\n        public Form1()\
    \ {\n            MessageBox.Show(\"Place message here\");\n        }\n\n     \
    \   [STAThread]\n        static void Main() {\n            Application.Run(new\
    \ Form1());\n        }\n\n        private void Form1_Load(object sender, System.EventArgs\
    \ e) {}\n    }\n}\n```\n```\n\nWe can also reuse this program to test the rest\
    \ of the message box references— please insert those changes as necessary."
  merge: -1
  img_proc: true
