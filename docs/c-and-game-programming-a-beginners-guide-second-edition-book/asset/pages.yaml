  md: "# Example B.74.\n\n```\nnamespace Appendix_B {\n    public class Area {\n \
    \       public Area() {}\n        public virtual void CalculateArea() {}\n   \
    \ }\n    public class Parallelogram : Area {\n        public Parallelogram() {}\n\
    \        override public void CalculateArea() {}\n    }\n    static void Main()\
    \ {}\n}\n```\n\n# void\n\nVoid is a data type that holds no data, thus, serves\
    \ the purpose of telling the compiler that no data will be required by this variable\
    \ or returning function. This is logical, since the ending of the main function\
    \ is also the ending of the program and there would be no program to which information\
    \ could be sent. Void is also most commonly associated with user-defined functions\
    \ that use reference-variables (explained in Chapter 2) and generalized pointers-variables\
    \ (explained in Chapter 4). Unlike the other data types, Void does not take a\
    \ position in memory, therefore, we won't need to measure its size in bytes.\n\
    \n# Example B.75.\n\n```\nclass Appendix_B {\n    static void Main(){}\n}\n```\n\
    \n# volatile\n\nThe keyword volatile is used to denote a variable that cannot\
    \ be optimized, which is usually due to some unpredictable change or reference\
    \ made to it, frequently from an outside source such as the operating system or\
    \ hardware device (see Example B.76).\n\n# Example B.76.\n\n```\nclass Appendix_B\
    \ {\n    public volatile char variable3 = 'A';\n    static void Main(){}\n}\n\
    ```"
