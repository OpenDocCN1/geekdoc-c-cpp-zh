    \ program will display the message \"Hello, world!\" However, since this book\
    \ emphasizes game programming, what could be more appropriate then \"Game Over?\"\
    \ (see Example 1.6).\n\n# Example 1.6. Screen output 1.\n\n```\nusing System;\n\
    \nnamespace Chapter1 {\n    class Class1 {\n        static void Main () {\n  \
    \          Console.Write (\"Game Over!\\n\");\n        }\n    }\n}\n```"
