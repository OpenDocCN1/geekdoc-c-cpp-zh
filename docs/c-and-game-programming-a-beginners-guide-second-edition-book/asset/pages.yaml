- pgno: 424
  md: "# The Keyword stackalloc\n\nThe keyword stackalloc, which is short for stack\
    \ allocating, is used to allocate blocks of memory referenced from a stack (this\
    \ should not be confused with the heap as explained previously). The addresses\
    \ of these blocks are fixed/pinned, so they are not subject to random garbage\
    \ collection, their termination linked only to the completion of those methods.\
    \ A stack allocating reference is written to include three key terms: *unmanaged\
    \ type*, the *pointer name*, and the *integral expression* (see Example 5.60).\n\
    \n# Example 5.60. The keyword stackalloc.\n\n```\n```csharp\nusing System;\n\n\
    namespace Chapter5 {\n    class Class1 {\n        public static unsafe void Main()\
    \ {\n            int* pointer1 = stackalloc int[3];\n            pointer1[0] =\
    \ 1;\n            pointer1[1] = 2;\n            pointer1[2] = 3;\n\n         \
    \   for (int i = 0; i < 3; i++)\n                Console.WriteLine(pointer1[i]);\n\
    \        }\n    }\n}\n```\n```\n\n# Metafiles Defined\n\nMetafiles are defined\
    \ as a collection of graphic functions written in the form of a binary record.\
    \ Graphic functions include lines, curves, and areas, as well as text. Metafiles\
    \ include specifications for coordinates, brushes, pens, and embedded bitmaps.\
    \ Metafiles have the advantage of scalability without degradation, require less\
    \ memory, and have a greater degree of device independence. Metafiles can also\
    \ be converted into bitmaps, which can greatly reduce rendering time, though this\
    \ will cause a loss in resolution. Files saved as metafiles are called DrawStrings\
    \ and are referenced with the file extensions .emf (Enhanced Metafiles) and .wmf\
    \ (Windows Metafiles). Metafiles are accessed using the standard format, e.g.,\
    \ Image PlayerL = Image.FromFile (\"..\\\\..\\\\Player1.emf\"); and Image PlayerR\
    \ = Image.FromFile (\"..\\\\..\\\\Player2.wmf\");."
