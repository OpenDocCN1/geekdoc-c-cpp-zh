    \   }\n            Console.WriteLine();\n        }\n    }\n}\n```\n\n# Overloading\
    \ Member Functions\n\n*Overloading* occurs whenever two or more user-defined functions\
    \ are referenced using a single definition. To avoid conflicts, however, definitions\
    \ must differ by at least one passing argument. Logically, if two functions were\
    \ similar enough to warrant the same name, and if their arguments were identical,\
    \ then efforts should be taken to unify those functions. Here I've listed two\
    \ examples, one to demonstrate how to implement two similar, but overloaded functions,\
    \ and the other to demonstrate how to avoid unnecessary overloads (see Examples\
    \ 5.17 and 5.18)."
