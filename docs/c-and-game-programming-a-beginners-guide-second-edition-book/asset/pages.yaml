    # Example 1.2 Explained


    C# uses several data types, including integers, real numbers, characters, and
    void. Void, for all practical purposes, means without a type. Moreover, since
    the main function doesn''t usually require a data type, void is the simplest to
    use. Data types such as int, float, double, char, and void are explained in detail
    later in this chapter.


    The commands static void Main (string [] args) and static void Main () are most
    commonly referred to when indicating the main method. The main method serves as
    the controller to the rest of the program. In these beginning stages, we''ll write
    all commands inside of the main method, but later, as our programs advance, we''ll
    migrate to other subprograms that will do specific tasks. The main method will
    then serve as a controller to these subprograms. Writing programs in this manner
    is akin to an older method of programming known as structured programming, which
    is a very important part of both C and Native C++ that the object-oriented approach
    will eventually surpass.


    The opening and closing braces (also known as a block) simply mark the beginning
    and ending of the program''s environment. The computer recognizes these symbols
    as markers telling it where to start and where to end. Without such markers, programs
    would not know which coding belonged to which method. Each block, then, indicates
    a subenvironment, whereas the namespace''s exterior block represents the global
    environment (Note: Comments are explained in the next section).'
  merge: -1
  img_proc: true
- pgno: 39
  md: "# Comments\n\nComments are nothing more than system notes, usually written\
    \ by a programmer, to mark or explain a certain passage that may not seem as obvious\
    \ to us at a later date. For example, we might mention that the main method ends\
    \ with a particular brace or that we need to alter or repair a line or two to\
    \ increase system performance. Examples 1.3 and 1.4 demonstrate the general use\
    \ of single and multiple line comments, while Example 1.5 demonstrates a third\
    \ type of pseudo-comment that is part of C#'s ability to manipulate internet resources.\n\
    \n# Example 1.3. Single line comments.\n\n```\nusing System;\nnamespace Chapter1\
    \ {\n    class Class1 {\n        static void Main () { // Main method\n      \
    \      // Begin executable statements\n        } // End main method\n    }\n}\n\
    ```\n\n# Example 1.4. Multiple line comments.\n\n```\n/* Longer comments (comments\
    \ spanning two lines or more) are\n * often set aside with these special markers.\n\
    \ * Comments are ignored by the compiler and thus\n * do not affect the program's\
    \ speed. */\nusing System;\nnamespace Chapter1 {\n    class Class1 {\n       \
    \ static void Main () { /* Main method */\n            /* Put something here please!\
    \ */\n        } /* End main method */\n    }\n}\n```"
  merge: -1
  img_proc: true
