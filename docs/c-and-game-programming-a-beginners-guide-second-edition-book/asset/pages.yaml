    \ 6);\n        ReadWidth(Instance);\n        ReadLength(Instance);\n        DisplayArea(Instance);\n\
    \    }\n}\n```\n\n# Inheritance versus Composition\n\nInheritance and composition\
    \ describe two similar but distinct types of references. Composition is formed\
    \ under a \"has a\" standard. In other words, a shared class \"has a\" relationship\
    \ with a linking class. In contrast, the base component of an inherited class\
    \ doesn't just \"have a\" relationship with its derived class, but instead, rather,\
    \ the derived class \"is an\" object of the base class. This relationship transcends\
    \ the objects in question and speaks to the very nature of the components. For\
    \ example, if we were to say that we had a horse and carriage, it would imply\
    \ that the horse was needed to pull that carriage. The carriage, then, \"has a\"\
    \ relationship connecting its use with the horse. Yet, if we were to say that\
    \ the carriage was made out of wood, it would be understood that the wood \"is\
    \ a\" part of the carriage, just as the base class becomes a part of the inherited\
    \ class."
