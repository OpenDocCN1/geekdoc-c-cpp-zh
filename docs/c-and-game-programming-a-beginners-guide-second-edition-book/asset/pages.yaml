  md: "# Compound if Statements\n\nA compound statement is a group of statements combined\
    \ into a bundle enclosed by a pair of braces. A compound if statement is an if\
    \ statement that executes this bundle as if it were a single action. The proper\
    \ way to write a compound statement is demonstrated in Example 2.7. (Note: Either\
    \ else or else-if could still be used simply by placing those keywords at the\
    \ end of the compound statement.)\n\n# Example 2.7. A compound if statement.\n\
    \n```\n```csharp\nusing System;\n\nnamespace Chapter2 {\n    class Class1 {\n\
    \        static void Main() {\n            string input;\n            float MyNumber;\n\
    \n            Console.WriteLine(\"How old are you? \");\n            input = Console.ReadLine();\n\
    \            MyNumber = float.Parse(input);\n\n            if (MyNumber >= 18)\
    \ {  // compound statement\n                Console.WriteLine(\"\\n You're an\
    \ adult\");\n                Console.WriteLine(\"You can vote\\n\");\n       \
    \     } else\n                Console.WriteLine(\"\\n Your turn will come\");\n\
    \        }\n    }\n}\n```\n```\n\nThe rules guiding the execution of compound\
    \ if statements are simple. When the if statement is true, all the statements\
    \ inside the compound statement are executed, and when the if statement is false,\
    \ all the statements are ignored. This may not seem like much when discussing\
    \ a compound statement made up of only two lines, but imagine dealing with compound\
    \ statements of over two hundred lines. Many C# commands can be placed inside\
    \ of these compound statements including other if statements, but we'll leave\
    \ such matters to the sections ahead. The else and else-if statements can also\
    \ use compound statements, as demonstrated in Example 2.8. Notice how important\
    \ it becomes to comments when programs become longer and more complicated."
