  md: "# ## DirectInput: The Mouse\n\nHere, we'll want to replace the GDI+ mouse model\
    \ with the DirectInput version. As with the DirectX Keyboard, the DirectX Mouse\
    \ requires several initializing steps before the actual mouse function can be\
    \ accessed. Set up includes a device assignment and timer reference, as well as\
    \ two Boolean references, namely MouseInquire and MouseOverride.\n\n```\n```csharp\n\
    // DirectInput\nprivate Microsoft.DirectX.DirectInput.Device mouse = null;\n...\n\
    private System.Windows.Forms.Timer Mouse;\nbool MouseOverride = false;\nbool MouseInquire\
    \ = false;\n```\n```\n\nMouseInquire and MouseOverride are user-defined variables;\
    \ their purpose is to test for mouse accessibility on the part of the user, the\
    \ user's options being to disable the mouse when joystick or even keyboard play\
    \ is desired. We use MouseInquire to make our inquirer and MouseOverride to retain\
    \ the choice made by the player, e.g.:\n\n```\n```csharp\nif (!MouseInquire) {\n\
    \    DialogResult result = MessageBox.Show (this,\n        \"Do you want to enable\
    \ the mouse?\",\n        \"Mouse Detected\", MessageBoxButtons.YesNo,\n      \
    \  MessageBoxIcon.Question, MessageBoxDefaultButton.Button1,\n        MessageBoxOptions.RightAlign);\n\
    \n    MouseInquire = true;\n    if (result == DialogResult.Yes) {\n        MouseOverride\
    \ = true;\n    }\n}\n```\n```\n\nThe mouse also requires a timer and event-handling\
    \ references, as well as a start up call:\n\n```\n```csharp\nthis.Mouse = new\
    \ System.Windows.Forms.Timer (this.components);\nthis.Mouse.Tick += new System.EventHandler\
    \ (this.Mouse_Tick);\n\nMouse.Start ();\n```\n```\n\nExample 3.30 replaces Example\
    \ 3.29 for our DirectX version of the game."
