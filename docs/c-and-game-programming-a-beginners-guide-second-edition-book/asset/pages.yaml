  md: "# Creating Infinite Space\n\nAnother visual illusion or type of motion that\
    \ will be handled by the AnimatedImage class can be thought of as repeating or\
    \ infinite space. With the method WrapInBox, we can tell the computer to teleport\
    \ our character from one end of the screen to the next. Since the character is\
    \ not deflected, a sense of continuous movement is created. WrapInBox will still\
    \ rely on the parameters included with constraintBox.X and constraintBox.Y. The\
    \ character's height and width are also important to these calculations as a final\
    \ position of our character is based on the constraintBox position, the constraintBox\
    \ measure, and the image's size (see Example 3.52 in Chapter 3).\n\n# Other Types\
    \ of Deflection\n\nIn addition to barriers and limitations, we can also create\
    \ methods that simply change the direction of our characters. The method ReverseDirection\
    \ does just what its name implies, changing north to south, etc. (see Example\
    \ 5.67). RotateDirection (listed in Chapter 3) allows us to read the current direction\
    \ of the character and adjusts it using a numbering system from one through eight.\
    \ The numbers one through eight reflect the basic north, northeast, east, southeast,\
    \ etc. directions found in the other methods.\n\n# Example 5.67. ReverseDirection.\n\
    \n```\n// Take whatever direction you are going and go the\n// opposite direction\n\
    virtual public void ReverseDirection() {\n    switch (direction) {\n        case\
    \ SOUTHWEST:\n            direction = NORTHEAST;\n            break;\n       \
    \ case SOUTH:\n            direction = NORTH;\n            break;\n        case\
    \ SOUTHEAST:\n            direction = NORTHWEST;\n            break;\n```"
