    \ scrutiny does not need to be assigned before it can be passed as a referenced\
    \ variable. This is usually the case when dealing with values that wouldn't otherwise\
    \ have a meaningful value before the appropriate functions can be executed. Since\
    \ an out value is also a referenced value, this keyword negates the need for the\
    \ second reference (ref) (see Example B.45).\n\n# Example B.45.\n\n```\nusing\
    \ System;\nclass Appendix_B {\n    static void Main() {\n        int iNumber1;\n\
    \        TheRace (out iNumber1);\n    }\n\n    static void TheRace(out int Num)\
