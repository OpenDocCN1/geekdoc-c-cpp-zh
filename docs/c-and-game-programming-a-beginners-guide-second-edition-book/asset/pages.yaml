  md: "# # Writing Our First User-Defined Function\n\nWriting a user-defined function\
    \ isn't different from writing a main function. In fact, if you compared the two,\
    \ you'd find that the underlying rules are basically the same. One key advantage\
    \ when declaring user-defined functions is their flexibility in descriptive naming,\
    \ which gives the programmer an instant, if not complete, description of what\
    \ the function will do. Microsoft's Hungarian notation and Camel notation, along\
    \ with the simple rules of variable naming (all discussed in Chapter 1) are what\
    \ we'll use when declaring our user-defined functions. Our first example demonstrates\
    \ how a simple function is written. You should use this example to compare the\
    \ two types of functions, e.g., Main () versus OurFunction () (see Example 2.32).\n\
    \n# ### Example 2.32. Our first function call.\n\n```\n```csharp\nusing System;\n\
    \nnamespace Chapter2 {\n    class Class1 {\n        static void OurFunction()\
    \ {\n            /* This is a do nothing function */\n        }\n\n        static\
    \ void Main () {\n            OurFunction();\n        }\n    }\n}\n```\n```\n\n\
    > > Referencing a user-defined function is not unlike referencing a predefined\
    \ function.\n\nAlthough this program is similar to the do-nothing programs of\
    \ Chapter 1, it still represents a true user-defined function. From here, we could\
    \ have inserted a slue of information including declared variables, predefined\
    \ functions, loops, and switch statement. Still, it's best if we hold off on some\
    \ of these at least until we've completely defined user-defined function. The\
    \ next few"
