    To install DirectX simply download Microsoft''s SDK (Software Development Kit),
    available free from Microsoft. You can find detailed instructions on the CD included
    with this book. You''ll be prompted with two choices, Debug and Release; both
    are adequate for our purposes. DirectX is linked to our files using one of two
    methods; the first is to create a standard Windows Application, loading the DirectX
    components from the "Add Reference" menu (see Appendix I). Second, we can create
    our projects using the DirectX 9 Visual C# Wizard, selecting "DirectDraw," "Audio,"
    and "DirectInput." Note that Windows inserts a certain level of base coding; while
    this coding can be a useful starting point, for study purposes, we''ll delete
    all pre-generated code and begin from scratch (See Screen Shot 3.0).'
