- pgno: 489
  md: "Note that while the use of a C++ style terminating semicolon is allowed, it\
    \ is not required when working with C#.\n\n# Example B.61.\n\n```\nstruct Appendix_B\
    \ {\n    static void Main() {}\n}\n```\n\n# switch\n\nThe switch statement, like\
    \ the if and else-if statements, is used to execute a statement or set of statements\
    \ that equal the variable's value. However, unlike the if and else-if statements,\
    \ the switch statement doesn't use comparison operators; instead, it simply reads\
    \ the value of the variable and attempts to direct the program to the proper channel.\
    \ A second keyword, case, is also used in this process. The keyword case is written\
    \ and used multiple times from within the switch statement. Each case statement\
    \ holds a numeric or character value for comparison. If the value held by a case\
    \ statement matches the value read by the switch statement, then everything following\
    \ that case statement will be executed.\n\n# Example B.62.\n\n```\nclass Appendix_B\
    \ {\n    static void Main() {\n        int Grades = 1;\n        switch (Grades)\
    \ {\n            case 1:\n                break;\n            default:\n     \
    \           break;\n        }\n    }\n}\n```\n\n# this\n\nThe keyword this is\
    \ a specialized reference signature used to indicate the referencing object of\
    \ a passing class; in other words, it is a longhand version for the otherwise\
    \ abbreviated member. While the this reference is implied, its definitions can\
    \ become ambiguous and should be included to prevent this error (see Example B.63)."
