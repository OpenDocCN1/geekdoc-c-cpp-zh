  md: "# ## Overloading Constructors\n\nConstructors can be overloaded in numerous\
    \ ways. Again, these functions will be automatically referenced when the appropriate\
    \ instances are declared, and again, their arguments will determine the accessible\
    \ function. One such class revision might include a secondary constructor that\
    \ gives a special rate to some depositors and a third that determines an alternate\
    \ rate for both their savings and loans (see Example 5.22).\n\n# ### Example 5.22.\
    \ Overloading constructors.\n\n```\n```csharp\nusing System;\nusing System.IO;\n\
    \nnamespace Chapter5 {\n    class BankAccount {\n        public decimal InterestRate;\n\
    \        public decimal LoanRate;\n\n        // Default Constructor\n        public\
    \ BankAccount() {\n            InterestRate = .03M; LoanRate = .13M;\n       \
    \ }\n\n        // Overloaded Constructor\n        public BankAccount(decimal IRate)\
    \ {\n            InterestRate = .03M;\n            LoanRate = .13M;\n        }\n\
    \n        // Overloaded Constructor\n        public BankAccount(decimal IRate,\
    \ decimal LoanRate) {\n            InterestRate = .03M;\n            LoanRate\
    \ = .13M;\n        }\n    }\n\n    class Class1 {\n        static void Main()\
    \ {\n            BankAccount account = new BankAccount();\n        }\n    }\n\
    }\n```\n```"
