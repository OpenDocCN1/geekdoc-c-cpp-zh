    types is an option. The safest data conversions always involve converting from
    smaller to larger data types, e.g., short to int, int to long, long to float,
    and float to double, or any of the smaller to larger types (see Table 1.3 for
    data type sizes). Any other type of conversion may result in the loss of data
    and/or a calculation error. Since float, double, and decimal are all floating
    point values, you may not notice a problem when preparing your algorithm (that''s
    not to say there wouldn''t be a problem, just that you might not notice it). The
    worst type of intermixing would be from floating point to integer, which would
    be allowed under native C/C++, but C# demands that any integration between our
    data types is strictly regulated. That said, many programmers still write programs
    that involve the intermixing of these larger to smaller data types relying on
    compiler defaults to calculate them in their favor.


