    +   4. Include a function that paints the stars and the screen black.

    +   5. Again, we’ll want to access our variables as class members listed in an
    additional subprogram.

    +   6. Set the variables/members including paths.


    Inside the while loop:


    +   7. Write a function that removes all residual images using a combination of
    calls to blank characters and the paint star function.

    +   8. Set the colors remembering to change the color for each vessel. Each change
    in color will require its own declaration.

    +   9. Display all characters.

    +   10. We’ll still need to animate our weapon—this time we’ll use all eight directions
    (see Example 3.44).

    +   11. Our limits will no longer stop the characters; instead we’ll wrap their
    movements around the screen. Projecting our characters to the opposite side means
    that we won’t have to alter their paths.

    +   12. There are four sounds associated with this game—Hit.wav (used when a player
    dies), Fire.wav (used to represent weapon fire), Gravity.wav (used to emphasise
