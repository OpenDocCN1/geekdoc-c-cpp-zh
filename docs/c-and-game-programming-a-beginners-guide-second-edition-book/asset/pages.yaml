  md: "# The Data Types character and string\n\nThe character (char) and string data\
    \ types are declared and assigned in the same manner as the numeric variables,\
    \ the main difference being that they allow for the storage of characters rather\
    \ than numeric information. Technically, numbers are also included in this list\
    \ of characters, but their values are not equivalent to their numeric counterparts.\
    \ Character variables are declared using the keyword char, and can be assigned\
    \ through user input and/or as a part of a declaration/assignment. They are only\
    \ capable of holding a single character value, and are assigned using single quotation\
    \ marks.\n\nStrings, in contrast, allow for multiple character storage. A host\
    \ of words, or sentences, can be placed inside of a single string variable. Strings\
    \ can also take input from outside sources, including direct input, stored files,\
    \ etc. They are assigned using double quotation marks (see Example 1.24). Traditionally,\
    \ the character data type consumed the smallest amount of system RAM (8 bits);\
    \ however, this changed with the introduction of the new Unicode standard (16\
    \ bits). The change represents a move to a universal character base that includes\
    \ most of the world's languages, which is, of course, an important part of international\
    \ commerce (Unicode is explained in more detail in Chapter 3).\n\n# Example 1.24.\
    \ The character and string data types.\n\n```\nusing System;\n\nnamespace Chapter1\
    \ {\n    class Class1 {\n        static void Main() {\n            char Symbol;\n\
    \            string Sentence;\n            Symbol = 'A';\n            Sentence\
    \ = \"This is a string.\";\n\n            Console.WriteLine(\"The first letter\
    \ in the alphabet is \"\n                + Symbol + \".\");\n            Console.WriteLine(Sentence);\n\
    \        }\n    }\n}\n```"
