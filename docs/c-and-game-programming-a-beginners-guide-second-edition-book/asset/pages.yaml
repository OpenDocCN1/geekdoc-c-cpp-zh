    \ 3);\n            Figures.FillRectangle(RedBrush, 10, 10, 25, 25);\n        \
    \    Figures.DrawRectangle(BluePen, 20, 20, 25, 25);\n        }\n        static\
    \ void Main() {\n            Application.Run(new Form1());\n        }\n    }\n\
    }\n```\n\n> The second value associated with the pen statement, Pen(Color, int),\
