  md: "# else\n\nElse is the first logical extension to the questioning if statement:\
    \ It adds an additional line of reasoning and an additional path for programs\
    \ to follow. Else cannot be used independently, yet it links easily to the tail\
    \ end of the if statement (see Example B.19).\n\n# Example B.19.\n\n```\nusing\
    \ System;\nclass Appendix_B {\n    static void Main() {\n        double Answer\
    \ = double.Parse(Console.ReadLine());\n        if (Answer == 5)\n            Console.WriteLine\
    \ (\"\\n That is correct!\\n\");\n        else\n            Console.WriteLine(\"\
    \\n Wrong!!!\\n\");\n    }\n}\n```\n\n# enum\n\nThe enumerator (enum) is a basic\
