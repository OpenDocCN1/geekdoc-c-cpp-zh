    # Variable Scope\n\n*Local variables* are variables declared inside the main or\
    \ subsequent methods. Their values are not known beyond the limitations of their\
    \ block. Programmers who wish to transfer data from one block to another must\
    \ do so using a referencing function. There are generally two types of passing\
    \ variables: *calls-by-mechanism*, where information is merely passed to new variables,\
    \ and *calls-by-reference*, which allow the programmer to alter the original memory\
    \ locations. Local variables, as well as their secondary counterparts, can be\
    \ passed and repassed endlessly, so limitations are minimized. In addition, user-defined\
    \ functions have the ability to return data to the main or other calling functions.\n\
    \nC# doesn't actually allow for truly global variables, but the word global can\
    \ be used to distinguish between localized and inclusive variables within a single\
    \ method or class. *Global variables* allow for the exchange of data, but do not\
    \ require a passing variable (see Example 2.34)."
