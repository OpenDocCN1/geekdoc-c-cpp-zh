- pgno: 466
  md: "# Example B.8.\n\n```\npublic class Appendix_B {\n    static void Main() {\n\
    \        try {}\n        catch {}\n    }\n}\n```\n\n# char\n\nThe character reference\
    \ (char), is used to declare 16-bit unicode characters that have ranges from U+0000\
    \ to U+ffff. Unicode characters are 16-bit characters used to represent nearly\
    \ all of the known languages as well as most, if not all, of the traditional mathematical\
    \ and literary symbols. Char is also used to represent combined values such as\
    \ hexadecimal codes and escape sequences (see Example B.9).\n\n# Example B.9.\n\
    \n```\nclass Appendix_B {\n    static void Main() {\n        char Symbol = 'A';\n\
    \    }\n}\n```\n\n# checked\n\nChecked is used to monitor both operators and statements\
    \ for numeric overflow errors as they occur in integral-type arithmetic operations\
    \ and conversions (see Example B.10).\n\n# Example B.10.\n\n```\nclass Appendix_B\
    \ {\n    static void Main() {\n        byte Max255 = 254;\n        checked{Max255++;}\n\
    \    }\n}\n```"
