  md: "be acceptable for a real program. This section therefore shows us how to repeat\
    \ a program, or portions of a program, in a repeating cycle or loop. The first\
    \ type of loop we’ll examine uses the keyword `while`; in C# it is called the\
    \ while loop. The while loop can be set up to repeat and/or terminate in several\
    \ different ways: the most common include using a predetermined count (as in to\
    \ repeat an iteration five times then end); using the user’s input (and by request);\
    \ and a termination command (a command that short-steps or breaks the loop—we’ll\
    \ learn about these shortly).\n\nA while loop compares most directly to a compound\
    \ if statement. while, like if, is written first, followed by a comparison operator\
    \ and then a set of compound statements. When while is true, all the statements\
    \ between its brackets will be executed, and when it is false, all of its statements\
    \ will be skipped. while, unlike if, will not terminate when the last statement\
    \ is executed. Rather, if it is required, it will then execute the compound statement\
    \ again. This process repeats indefinitely, ending only when something is altered\
    \ to cause the comparison to become false or other special steps are taken to\
    \ reroute the computer’s line of execution. The techniques for terminating a while\
    \ loop are thus just as important conceptually as the keyword while. Example 2.12\
    \ demonstrates a limited or predetermined type of while loop; this example terminates\
    \ when the variable test at a value greater than four.\n\n# Example 2.12. A while\
    \ loop limited to five passes.\n\n```\n```csharp\nusing System;\n\nnamespace Chapter2\n\
    {\n    class Class1\n    {\n        static void Main()  {\n            int iCounter_1\
    \ = 0;\n\n            while (iCounter_1 < 5)  {   // while loop\n            \
    \    Console.WriteLine(iCounter_1++);\n            }\n\n            Console.WriteLine(\"\
    Program complete!\\\\n\");\n        }\n    }\n}\n```\n```"
