  \n> `NULL` 和,NULL\n\n# 来自 Big Nerd 的更多...\n\nBig Nerd Ranch 的存在是为了开阔学生和客户的眼界。无论我们是在培训人才还是为公司开发移动战略，我们的核心理念贯穿于一切之中。\n\
  \n## Big Nerd 的故事\n\nBig Nerd Ranch 是 CEO Aaron Hillegass 的创意，自 2001 年成立以来，该园区已接待了\
  \ 2000 多名学生。在过去的十年里，我们有机会与苹果、三星、诺基亚、谷歌、洛斯阿拉莫实验室和 Adobe 等顶级公司合作，帮助他们实现编程目标。我们的软件工程师团队是行业内顶尖的，这体现在我们的工作中。我们为客户开发了数十种灵活解决方案。\n\
  \n## 帽子背后的故事\n\n2001 年，Big Nerd Ranch 创始人 Aaron Hillegass 在 WWDC（开发者大会）推广 Big Nerd\
  \ 品牌。由于没有钱买昂贵的展位，Aaron 戴了一顶大牛仔帽在向潜在学生和客户发放 Big Nerd 材料时吸引注意力。一周后，我们获得了第一个大客户，从那时牛仔帽就成了\
  \ Big Nerd 品牌的代名词。\n\n## 新园区 - 2012 年开放\n\n为了不断完善学生体验，Big Nerd Ranch 正在建立自己的设施。新园区距离亚特兰大机场仅\
  \ 20 分钟车程，将成为一个学习中心，包含了 Aaron Hillegass 对技术教育的愿景，拥有先进教室、精致餐饮和健身设施。\n\n## 培训：达到 Nerd\
  \ 境界\n\n自 2001 年以来，Big Nerd Ranch 一直在静修环境中提供由专家导师教授的密集计算机编程课程。我们认为学生在我们的园区里蓬勃成长。课程、住宿和用餐都在同一栋建筑内进行，让你自由地与编程伙伴和导师学习、编码和讨论。在\
  \ Big Nerd Ranch，我们负责细节；你唯一的工作就是学习。\n\n### 我们的老师\n\n我们的老师是各自领域的领袖。他们对所教的技术有深入的理解，并拥有丰富的开发经验，使他们能够解决你作为开发者会遇到的问题。Big\
  \ Nerd Ranch 的导师提供了必要的知识结合和卓越的教学技能，使我们的学生离开园区时技能大大提升。\n\n### Big Nerd 方式\n\n我们开发了“Big\
  \ Nerd Ranch 方法”。这种方法论指导着我们课程的开发和呈现。风格轻松但专注，简短的讲座后是实操练习，旨在让你对所学习的每项技术都有即时、相关的理解。\n\
  \n### 你的园区之旅\n\n一次费用涵盖学费、餐饮、住宿以及往返机场的交通。在 Big Nerd Ranch，我们通过在佐治亚亚特兰大和德国法兰克福的安静舒适环境中提供课程，消除了标准企业培训固有的干扰。\n\
  \n### 可用课程\n\n*   高级 Mac OS X\n*   Android\n*   入门 Cocoa\n*   入门 iOS (iPhone/iPad)\n\
  *   入门 Ruby on Rails\n*   西班牙语 Cocoa 跨境班\n*   Cocoa I\n*   Cocoa II\n*   iOS 跨境班\n\
  *   Django\n*   iOS (iPhone/iPad)\n*   OpenGL\n*   Python 掌握 精通\n*   Ruby on Rails\
  \ I\n*   Ruby on Rails II\n\n## 上门培训：我们的 Nerd，你的地点\n\n通过我们的上门培训计划，你可以以经济且方便的方式让我们著名的课程来到你那里。我们的专家导师将通过新鲜、参与感强且无障碍的实教学支持帮助你的团队进步。\n\
  \n\n\n\n\n*   课后导师指导可以为您的团队在处理极具挑战性的项目时提供支持。\n\n### 价格负担能力\n\n*   无需为所有员工安排飞机、火车和汽车行程；我们的技术专家（Nerds）会直接上门服务。\n\
  *   可培训多达 22 名学生，价格比公开注册培训相比有大幅折扣。\n\n### Nerd 专业知识\n\n*   我们的讲师在教学和编程方面都拥有丰富经验。他们通过将实战经验引入您的团队，超越了理论层面。\n\
  *   现场培训包括课后联系我们的技术专家、访问我们广阔的校友网络以及我们的 Big Nerd Ranch 论坛。学习支持不会因为课程的结束而停止。\n\n对于您的现场培训，我们提供一名讲师、所有\
  \ Big Nerd Ranch 版权课程材料、礼品、结证书以及访问我们广泛校友网络的权限。您则需要提供教室布置、所有学生使用的电脑及相关设备、一台投影仪和一个投影幕。\n\
  \n## 咨询：在公司内部及现场实现 Nerdvana\n\n当您与 Big Nerd Ranch 签署合同时，我们将与您直接合作，将您的需求转化为全面的桌面和/或移动解决方案。我们的开发者和设计师一直创造着\
  \ iPhone App Store 中最引人注目的应用程序。\n\n### 管理哲学\n\nBig Nerd Ranch 全方位地管理每位客户的关系。我们的目标是从项目启动到完成全过程中对客户进行沟通和教育，并最终帮助他们在其利基市场中获得竞争优势。\n\
  \n### 项目策略\n\n我们对所有项目估算都采取注重细节的方法。我们将与您合作定义策略、指明产品供应，然后将它们构建成独立的软件。\n\n### 我们的流程\n\
