  In hexadecimal, x is %lx.\\n\", x);\n    return 0;\n}\n\n### 整数运算\n\n算术运算符 `+`、`-`\
  \ 和 `*` 的工作符合预期。它们也有符合你预期的优先级规则：`*` 在 `+` 或 `-` 之前求值。在 `main.c` 中，用计算替换之前的代码：\n\n\
  #include <stdio.h>\nint main (int argc, const char * argv[])\n{\n    printf(\"3\
