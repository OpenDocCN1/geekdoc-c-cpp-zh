  \n\n## if/else\n\n编程中一个重要的思想是根据情况采取不同的行动。订单中的所有计费字段都已填写了吗？如果是，启用提交（Submit）按钮。玩家还有剩余生命吗？如果是，继续游戏。如果没有，显示坟墓的图片并播放悲伤的音乐。\n\
  \n这种行为使用 `if` 和 `else` 实现，它们的语法如下：\n```c\nif (conditional) {\n    // 如果条件为真，则执行此代码\n\
  } else {\n}\n```\n\n在本章中你将不会创建一个项目。相反，请根据你在最后两章中学到的知识仔细考虑这些代码示例。\n\n\n```c\nfloat\
  \ truckWeight = 34563.8;\n// 它在限制之内吗？\nif (truckWeight < 40000.0) {\n} else {\n\
  \    printf(\"It is a heavy truck\\n\");\n}\n```\n\n\n\n```c\n     printf(\"Truck\
  \ weight is not within legal range.\\n\");\n     printf(\"Impound truck.\\n\");\n\
  ```\n\n为什么？想象一下如果你删除了大括号。\n\n```c\nBOOL isNotLegal = !((truckWeight > 0.0) && (truckWeight\
  \ <  40000.0));\n     printf(\"Truck weight is not within legal range.\\n\");\n\
  \     printf(\"Impound truck.\\n\");\n```\n\n这段代码会让你在卡车司机中非常不受欢迎。在这种情况下，无论重量如何，每辆卡车都会被扣押。当编译器在条件后没有找到大括号时，只有下一条语句被视为\
  \ `if` 结构的一部分。因此，第二条语句始终会被执行。（第二条语句的缩进又是呢？虽然缩进对于人类阅读代码非常有帮助，但对编译器来说没有任何意义。）\n##\
  \ else if\n\n如果你有两种以上的可能性怎么办？你可以使用 `else if` 逐个对它们进行测试。例如，想象一辆卡车属于三种重量类别之一：浮空型、轻型和重型。\n\
  \n```c\n     printf(\"A floating truck\\n\");\n} else if (truckWeight < 40000.0)\
  \ {\n     printf(\"A light truck\\n\");\n} else {\n     printf(\"A heavy truck\\\
  n\");\n```\n\n你可以根据需要拥有任意数量 `else if` 子句。它们将按照出现的顺序逐一测试，直到其中一个评估为真。“按照它们出现的顺序”这一点非常重要。请务必排列你的条件顺序，以防止出现误报。例如，如果你交换了上面示例中的前两个测试，你将永远找不到浮空型卡车，因为浮空型卡车也是轻型卡车。最后的\
  \ `else` 子句是可选的，但当你想要捕获所有不满足之前条件的情况时，它是很有用的。\n\n\n在实际开发中，你经常使用 `if` 和 `else` 来给实例变量赋值，这并并不罕见。例如，你可能会有以下代码：\n\
  \n```c\nint minutesPerPound;\n     minutesPerPound = 15;\nelse\n     minutesPerPound\
  \ = 20;\n```\n\n\n```c\nint minutesPerPound = isBoneless ? 15 : 20;\n```\n\n\n如果你觉得这种写法很奇怪，继续使用\
  \ `if` 和 `else` 也没有什么问题。我怀疑，随着时间的推移，你会接受三元运算符，作为一种进行条件赋值的简洁方式。更重要的是，你将看到其他程序员使用它，而理解你所看到的内容是件好事！\n\
  \n## 挑战\n\n\n```c\nint i = 20;\nint j = 25;\nint k = ( i > j ) ? 10 : 5;\n     printf(\"\
  The first expression is true.\");\n} else if ( j > i ) { // 第二个表达式\n     printf(\"\
  The second expression is true.\");\n} else {\n     printf(\"Neither expression is\
  \ true.\");\n```\n\n控制台会打印什么？\n\n# 5\n## 函数\n\n在第 3 章 中，我引入了变量的概念：与数据块关联的名字。函数是一个与代码块关联的名字。你可以将信息传递给\
  \ `function`。你可以让 `function` 执行代码。你可以让 `function` 向你返回信息。\n\n函数是编程的基础，所以本章有很多内容——三个新项目、新工具和许多新思想。让我们从一个演示函数用途的练习开始。\n\
  ### 我应该何时使用函数？\n\n假设你正在编写一个程序来祝贺学生完成 Big Nerd Ranch 的课程。在担心从数据库中检索学生列表或在精美的 Big\
  \ Nerd Ranch 纸张上打印证书之前，你想先实验一下打印在证书上的信息。\n\n为了进行这个实验，创建一个新项目：一个名为 `ClassCertificates`\
  \ 的 C 命令行工具。\n编写此程序时，你的第一个想法可能是：\n\n```c\nint main (int argc, const char * argv[])\n\
  {\n     printf(\"Mark has done as much Cocoa Programming as I could fit into 5 days\\\
  n\");\n```\n\n重复 `printf` 中的所有内容会让你感到苦吗？如果是这样，你就具备了优秀程序员的特质。\n\n### 我如何编写和使用函数？\n\
  现在你已经意识到你需要一个 `function`，并且需要写一个。打开 `ClassCertificates` 项目中的 `main.c`，并在 `main`\
  \ 之前添加新函数。将此函数命名为 `congratStudent`。\n\n```c\n#include <stdio.h>\nvoid congratulateStudent(char\
  \ *student, char *course, int numDays)\n{\n}\n```\n\n编辑 `main` 以使用你的新函数：\n\n```c\n\
  {\n     congratulateStudent(\"Mark\", \"Cocoa\", 5);\n     congratulateStudent(\"\
  Bo\", \"Objective-C\", 2);\n     congratulateStudent(\"Mike\", \"Python\", 5);\n\
  \     congratulateStudent(\"Ted\", \"iOS\", 5);\n}\n```\n\n编译并运行程序。你可能会得到一个带有小黄色三角形和内部感叹号标记的警告。Xcode\
  \ 中的警告不会阻止程序的运行；它只是引起了你对可能问题的注意。警告文本位于代码右侧。这个警告内容类似于 `No previous prototype for\
  \ function 'congratStudent'`。暂时忽略这个警告，我们会在本节末尾回来讨论。\n\n\n- `Mark has done as much\
  \ Cocoa Programming as I could fit into 5 days.`\n- `Bo has done as much Objective-C\
  \ Programming as I could fit into 2 days.`\n- `Mike has done as much Python Programming\
  \ as I could fit into 5 days.`\n- `Ted has done as much iOS Programming as I could\
  \ fit into 5 days.`\n\n\n函数名称左侧的 `void` 是什么？它是函数返回信息的类型。当你没有任何信息要返回时，使用 `void` 关键字。我们将在章稍些时候详细讨论返回。\n\
  \n\n\n\n你还在 `main` 中使用了或调用了你的新函数。当你调用 `congratulateStudent` 时，你向它传递了值。传递给函数的值被称为参数（arguments）。参数的值随后会被赋值给对应的参数名称（parameter\
  \ name）。该参数名称可以在函数内部作为变量使用，包含传入的值。\n\n让我们具体来看。在第一次调用 `congratulateStudent` 时，你传递了三个参数：`\"\
  Mark\", \"Cocoa\", 5`。\n\ncongratulateStudent(\"Mark\", \"Cocoa\", 5);\n```\n\n\
  现在，我们重点关注第三个参数。当 `5` 被传递给 `congratulateStudent` 时，它会被赋值给第三个参数 `numDays`。参数和形参按照它们出现的顺序进行匹配。它们的类型也必须相同（或非常接近）。在这里，`5`\
  \ 是一个整数值，而 `numDays` 的类型是 `int`。很好。\n\n现在，当 `congratulateStudent` 在函数内部使用或引用 `numDays`\
  \ 变量时，它的值将是 `5`。你可以看到 `numDays` 在分号之前被引用了。最后，你可以通过查看输出的第一行来证明这一切都正常工作，它正确地显示了天数。\n\
  回想我们最初提出的那个包含大量重复输入的 `ClassCertificates` 版本。使用函数的意义是什么？是为了节省输入量吗？是的，但这绝对不是全部。它还为了错误检查。你输入的越少，计算机处理得越多，出现拼写错误的机会就越少。此外，如果你写错了函数名，`Xcode`\
  \ 会提醒你，但 `Xcode` 并不知道你是否写错了文本内容。\n\n编写函数的另一个好处是可重用性。现在你已经写了这个实用的函数，你可以在另一个程序中使用它。修改起来也更简单了。你只需要在一个地方调整祝贺语句的措辞，它就会在所有地方生效。\n\
  \n函数的最后一个好处是，如果出现了“漏洞”（bug），你可以修复那一个函数，突然所有调用它的地方都会开始正常工作。将代码划分成函数使其更容易理解和维护。\n\
  现在回到你代码中的那个警告。在某处声明函数而在另一个地方定义它是非常常见的。声明函数只是警告编译器即将有一个特定名称的函数。定义函数才是你描述应该执行的步骤的地方。在这个练习中，你实际上在同一个地方声明并定义了函数。因为这并不常见，所以如果你的函数没有提前声明，`Xcode`\
  \ 就会发出警告。\n\n在本书中构建的任何项目中，忽略这个警告都是可以的。你也可以花时间禁用它。要这样做，请选择 `ClassCertificates` 目标（target），它是项目导航器顶部的项目。在编辑器窗格中，选择\
  \ `Build Settings` 选项卡下的 `All`。滚动查看不同的构建设置并找到 `Missing Function Prototypes` 设置。将此设置更改为\
  \ `No`。\n\n 5.1 禁用 Missing Function Prototypes 警告\n![Disabling Missing Function\
  \ Prototypes warning](img/00011.jpg)\n\n## 函数如何协同工作\n\n程序是函数的集合。当你运行程序时，这些函数会从硬盘复制到内存中，处理器找到名为\
  \ `main` 的函数并执行它。\n\n\n图 5.2 食谱卡片\n\n![Recipe cards](img/00012.jpg)\n\n\n当你准备调味面包屑时，停止执行“烤鸡肉”卡片。当面包屑准备好后，继续执行“烤鸡肉”卡片。\n\
  \n同样，`main` 函数会停止执行并“阻塞”，直到它调用的函数执行完毕。为了看到这种情况，我们将调用一个 `sleep` 函数，它的作用只是等待几秒。在你的\
  \ `main` 函数中，添加对 `sleep` 的调用。\n\nint main (int argc, const char * argv[])\n{\n \
  \   congratulateStudent(\"Mark\", \"Cocoa\", 5);\n    sleep(2);\n    congratulateStudent(\"\
  Bo\", \"Objective-C\", 2);\n    congratulateStudent(\"Mike\", \"PHP and PostgreSQL\"\
  , 5);\n    sleep(2);\n    congratulateStudent(\"Ted\", \"iOS\", 5);\n    return\
  \ 0;\n}\n\n编译并运行程序。（现在忽略关于隐式声明的警告。）你应该能看到每条祝贺消息之间看到 2 秒的暂停。这是因为 `main` 函数会停止运行，直到\
  \ `sleep` 函数完成睡眠。\n\n注意，当你调用一个函数时，你使用它的名称和一对用于参数的括号。因此，当我们谈论函数时，通常会包含一对空括号。从现在起，我们在谈论函数时将说\
  \ `main()`。\n\n\n\n想象一下，你正在制作一份“烤鸡”的食谱。在你的厨房里，所有的食谱都有自己专属黑板，所以你已经准备好了一个用于“烤鸡”食谱的黑板。现在，当你调用“调味面包屑”食谱时，你需要一个新的黑板。你打算把它放在哪里呢？就放在“烤鸡”食黑板的正上方。毕竟，你为了制作“调味面包屑”而暂停了“烤鸡”的执行。在“调味面包屑”完成且帧被丢弃之前，你不需要“烤鸡”的帧。你现在拥有的是一栈帧。\n\
  \n图 5.3 栈中的两个黑板\n![栈中的两个黑板](img/00013.jpg)\n\n程序员们常说：“当一个函数被调用时，它的帧会在栈的顶端创建。当函数执行完毕时，它的帧会从栈中弹出并被销毁。”\n\
  \n让我们通过在一个假设的程序中加入 `showCookTimeForTurkey()`，来更仔细地观察栈的工作原理：\n```c\nvoid showCookTimeForTurkey(int\
  \ pounds)\n{\n    int necessaryMinutes = 15 + 15 * pounds;\n}\n\nint main(int argc,\
  \ const char * argv[])\n{\n    int totalWeight = 10;\n    int turkeyWeight = totalWeight\
  \ - gibletsWeight;\n    showCookTimeForTurkey(turkeyWeight);\n    return 0;\n}\n\
  \n回想 `main()` 总是第一个执行的。`main()` 调用 `showCookTimeForTurkey()`，后者开始执行。那么，在 `pounds`\
  \ 乘以 15 之后，这个程序的栈是什么样子的？\n\n图 5.4 栈上的两个帧\n\n\n栈始终是后进先出的（LIFO）。这意味着，`showCookTimeForTurkey()`\
  \ 在 `main()` 从栈中弹出其帧之前，先将其帧从栈中弹出。\n\n注意，`pounds` 作为 `showCookTimeForTurkey()` 的唯一参数，它是帧的一部分。记住，参数是一个局部变量，它被赋值了对应实参数的值。在这个例子中，值为\
  \ `9` 的变量 `turkeyWeight` 被作为参数传递给 `showCookTimeForTurkey()`。然后该值被赋值给参数 `pounds`\
  \ 并复制到函数的帧中。\n\n\n函数可以调用自己吗？你当然可以！我们称之为递归。有一首臭名无臭的歌曲叫《99 瓶啤酒》。创建一个名为 `BeerSong`\
  \ 的新 C 命令行工具。打开 `main.c` 并添加一个函数来写出这首歌的词，然后在 `main()` 中启动它：\n\n```c\nvoid singTheSong(int\
  \ numberOfBottles)\n{\n    if (numberOfBottles == 0) {\n        printf(\"There are\
  \ simply no more bottles of beer on the wall.\\n\");\n        printf(\"%d bottles\
  \ of beer on the wall. %d bottles of beer.\\n\",\n               numberOfBottles,\
  \ numberOfBottles);\n        int oneFewer = numberOfBottles - 1;\n        printf(\"\
  Take one down, pass it around, %d bottles of beer on the wall.\\n\",\n        singTheSong(oneFewer);\
  \ // 这个函数调用了自己！\n        printf(\"Put a bottle in the recycling, %d empty bottles\
  \ in the bin.\\n\",\n               numberOfBottles);\n    }\n} \n{\n    singTheSong(99);\n\
  \    return 0;\n}\n\n构建并运行程序。输出如下：\n\n`99 bottles of beer on the wall. 99 bottles\
  \ of beer.`\n`Take one down, pass it around, 98 bottles of beer on the wall.`\n\
  `Take one down, pass it around, 97 bottles of beer on the wall.`\n`97 bottles of\
  \ beer on the wall. 97 bottles of beer.`\n`…`\n`1 bottles of beer on the wall. 1\
  \ bottles of beer.`\n`Take one down, pass it around, 0 bottles of beer on the wall.`\n\
  \n（注：提供的文本末尾包含几处重复/碎片化的句子，这些似乎是源代码中的痕迹或错误。我保留了上述提供的递归示例的核心逻辑。）\n\n## 理解栈与调试\n\n\n\
  注意，`pounds` 作为 `showCookTimeForTurkey()` 的唯一参数，它是帧的一部分。记住，参数是一个局部变量，它被赋值了对应实参数的值。在这个例子中，值为\
  \ `9` 的变量 `turkeyWeight` 被作为参数传递给 `showCookTimeForTurkey()`。然后该值被赋值给参数 `pounds`\
  \ 并复制到函数的帧中。\n\n（注：源文件中提供的剩余文本中包含了关于 Xcode UI 元素的大量重复和碎片化句子。根据保留核心内容和移除冗余行的指令，优先考虑了功能性解释。）\n\
  \n\n我们刚刚在这里快速查看了调试器，以演示栈帧（frames）是如何工作的。然而，当你的程序运行结果不符合预期，且你需要查看实际发生了什么时，使用调试器设置断点并浏览程序栈中的栈帧将将会非常有帮助。\n\
  \n## return\n许多函数在完成执行时会返回一个值。你可以通过函数名之前的类型知道该函数将返回什么类型的数据。（如果函数不返回任何内容，它的返回类型为\
  \ `void`。）\n\n创建一个名为 `Degrees` 的新 C 命令行工具。在 `main.c` 中，在 `main()` 之前添加一个将温度从摄氏转换为华氏的函数。然后更新\
  \ `main()` 来调用这个新函数。\n\n```c\n\nfloat fahrenheitFromCelsius(float cel)\n{\n    float\
  \ fahr = cel * 1.8 + 32.0;\n    printf(\"%f Celsius is %f Fahrenheit\\n\", cel,\
  \ fahr);\n    return fahr;\n}\nint main(int argc, const char * argv[])\n{\n    float\
  \ freezeInC = 0;\n    float freezeInF = fahrenheitFromCelsius(freezeInC);\n    printf(\"\
  Water freezes at %f degrees Fahrenheit\\n\", freezeInF);\n}\n```\n\n看我们是如何获取 `fahrenheitFromCelsius()`\
  \ 的返回值并将其赋值给类型为 `float` 的变量 `freezeInF` 的？很酷，对吧？\n\n\n```c\nfloat average(float\
  \ a, float b)\n{\n    return (a + b)/2.0;\n}\n```\n\n如果你调用了这个函数，`printf()` 的调用将永远不会执行。\n\
  那么，一个自然产生的问题是：“我们为什么要总是从 `main()` 返回 0？”当你向系统返回 `0` 时，你是在说“一切正常”。如果你是因为发生了某些错误而终止程序，你将返回\
  \ `1`。\n\n这看起来可能与 `if` 语句中 `0` 和 `1` 的工作方式相矛盾；因为 `1` 是真，而 `0` 是假，人们自然地会认为 `1` 代表成功，`0`\
  \ 代表失败。所以把 `main()` 想象成返回一个错误报告。在这种情况下，`0` 是好消息！成功就是没有错误。\n\n\n```c\n#include <stdio.h>\n\
  #include <stdlib.h>\nfloat fahrenheitFromCelsius(float cel)\n{\n    float fahr =\
  \ cel * 1.8 + 32.0;\n    printf(\"%f Celsius is %f Fahrenheit\\n\", cel, fahr);\n\
  \    return fahr;\n\nint main(int argc, const char * argv[])\n{\n    float freezeInC\
  \ = 0;\n    printf(\"Water freezes at %f degrees Fahrenheit\\n\", freezeInF);\n\
