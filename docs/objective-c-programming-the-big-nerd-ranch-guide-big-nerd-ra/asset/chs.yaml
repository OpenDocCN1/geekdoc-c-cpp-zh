  n` 代表换行符。\n现在让我们回到数字。\n\n## 整数\n\n\n为了解决这些不同的问题，整数变量有不同的尺寸。整数变量具有特定位数的位可以在其中编码数字，变量位数越高，它能存储的数字就越大。典型尺寸有：8\
  \ 位、16 位、32 位和 64 位。\n\n同样，某些问题需要负数，而另一些则不需要。因此，整数类型有符号（signed）和无符号（unsigned）之。\n\
  无符号 8 位数可以存储 0 到 255 之间的任何整数。我是怎么得出的？`2⁸ = 256` 种可能的数字。我们选择从 0 开始。\n\n有符号 64 位数可以存储\
