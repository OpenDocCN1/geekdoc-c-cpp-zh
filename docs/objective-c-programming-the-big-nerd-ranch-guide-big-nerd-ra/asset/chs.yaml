  \n# 17 你的第一个类\n\n到目前为止，你只使用过 Apple 创建的类。现在你可以编写自己的类了。请记住，类通过两种方式来描述对象：\n\n- 类实现的方法（包括实例方法和类方法）\n\
  - 类中每个实例的实例变量\n\n你将编写一个 `Person` 类，类似于你在第 10 章中编写的 `struct Person`。你的类将定义在两个文件中：`Person.h`\
  \ 和 `Person.m`。`Person.h` 被称为头文件或接口文件，包含实例变量和方法的声明。`Person.m` 被称为实现文件。这是你编写每个方法的步骤或实现方法的地方。\n\
  \n创建一个新项目：名为 BMITime 的 Foundation 命令行工具。\n\n要创建一个新类，选择 File → New → New File....。在左侧的\
  \ Mac OS X 部分，选择 Cocoa 并选择 Objective-C class 模板。将你的类命名为 `Person` 并将其设为 `NSObject`\
  \ 的子类。最后，确保勾选了 BMITime target 并点击 Save。\n\n注意，新类文件 `Person.h` 和 `Person.m` 现在出现在项目导航器中。打开\
  \ `Person.h`。声明两个实例变量和三个实例方法：\n\n```\n#import <Foundation/Foundation.h>\n\n// Person\
  \ 类继承了 NSObject 类定义的所有实例变量\n// 和方法\n@interface Person : NSObject\n{\n    // 它有两个实例变量\n\
  \    float heightInMeters;\n    int weightInKilos;\n}\n// 你可以使用这些方法设置那些实例变量\n- (void)setHeightInMeters:(float)h;\n\
  - (void)setWeightInKilos:(int)w;\n// 此方法计算体质指数\n- (float)bodyMassIndex;\n@end\n\
  ```\n\n注意你在大括号内部声明了实例变量，并在变量之后、大括号之外声明了方法。\n\n对于编译器来说，这段代码表示：“我正在定义一个名为 `Person`\
  \ 的新类，它拥有 `NSObject` 类的所有方法和实例变量。此外，我添加了两个新的实例变量：一个名为 `heightInMeters` 的 `float`\
  \ 和一个名为 `weightInKilos` 的 `int`。我还将添加三个实例方法，它们将在 `Person.m` 中实现。”\n\n注意 `setHeightInMeters:`\
  \ 期望一个 `float` 参数且没有返回值，`setWeightInKilos:` 期望一个 `int` 参数且没有返回值，而 `bodyMassIndex`\
  \ 不接受参数并返回一个 `float`。\n\n现在打开 `Person.m`。删除任何现有方法并实现你声明的方法：\n\n```\n#import \"Person.h\"\
  \n\n@implementation Person\n\n- (void)setHeightInMeters:(float)h\n{\n    heightInMeters\
  \ = h;\n}\n- (void)setWeightInKilos:(int)w\n{\n    weightInKilos = w;\n}\n- (float)bodyMassIndex\n\
  {\n    return weightInKilos / (heightInMeters * heightInMeters);\n}\n\n@end\n```\n\
  \n注意 Xcode 为你导入了 `Person.h`。另请注意，你实现的方法名称必须与头文件中声明的名称完全匹配。在 Xcode 中，这很容易；当你开始在实现文件中输入方法名时，Xcode\
  \ 会建议你已经声明的方法名称。\n\n现在你已经实现了在 `Person.h` 中声明的所有方法，你的类已经完整了。编辑 `main.m` 来练练手：\n\n\
  ```\n#import <Foundation/Foundation.h>\n#import \"Person.h\"\n\nint main(int argc,\
  \ const char * argv[])\n{\n    @autoreleasepool {\n        // 创建 Person 的实例\n  \
  \      Person *person = [[Person alloc] init];\n        // 给实例变量赋值\n        [person\
  \ setWeightInKilos:96];\n        [person setHeightInMeters:1.8];\n        // 调用\
  \ bodyMassIndex 方法\n        float bmi = [person bodyMassIndex];\n        NSLog(@\"\
  person (%d, %f) has a BMI of %f\", [person weightInKilos], [person heightInMeters],\
  \ bmi);\n    }\n    return 0;\n}\n```\n\n![NSMutableArray 的声明](img/00047.jpg)\n\n\
  *(注：源码中关于实现说明的部分存在重复/碎片化的文本；我已根据提供的代码块清理了逻辑流。）*\n\n\n\n\nObjective-C 程序员经常调用访问器方法（accessor\
  \ methods）。Apple 决定为调用访问器方法创建一个快捷方式。这个快捷方式让这两行代码变得完全相同：\n\n```\np = [x fido];\n\
  ```\n\n```\np = x.fido;\n```\n\n它还让这两行代码变得完全相同：\n\n```\n[x setFido:3];\n```\n\n\
  ```\nx.fido = 3;\n```\n\n这种使用点号（.）而不是方括号的形式被称为点表示法（dot notation）。\n\n我避免使用点表示。我觉得它掩盖了正在发送消息（message）的事实，而且与我们在系统中发送其他任何消息的方式不一致。欢迎使用点表示法，但在本书的其他地方都不会出现。\n\
  \n## Properties（属性）\n\n注意，我们在 `Person` 类中的大部分代码都用于编写访问器方法。Apple 创建了一种方便的方法来简化访问器方法的编写，称为\
  \ `properties`（属性）。通过属性，你可以在一行内同时声明 setter 和 getter 方法。\n\n在 `Person.h` 中，用 `@property`\
  \ 结构替换 setter 和 getter 方法的声明：\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  \n@interface Person : NSObject\n{\n    float heightInMeters;\n    int weightInKilos;\n\
  }\n\n@property float heightInMeters;\n@property int weightInKilos;\n\n- (float)bodyMassIndex;\n\
  @end\n```\n\n通过这次编辑，你并没有改变这个类。你只是使用了一种更简洁的语法。\n\n现在，看看 `Person.m` 文件。它充满了简单且可预测的访问器方法。在你的访问器没有特殊功能的情况下，你只需要告诉编译器根据每个\
  \ `@property` 声明合成默认的访问器方法。删除访问器并用调用 `@synthesize` 来替换：\n\n```objectivec\n#import\
  \ \"Person.h\"\n\n@implementation Person\n@synthesize heightInMeters, weightInKilos;\n\
  - (float)bodyMassIndex\n{\n    return weightInKilos / (heightInMeters * heightInMeters);\n\
  }\n@end\n```\n\n编译并运行程序。一切运行起来应该和之前一样，但代码要简单得多且更容易维护。\n\n## self\n\n在任何方法内部，你都可以访问隐式局部变量\
  \ `self`。`self` 是指向正在运行方法的对象的指针。它用于对象向自己发送消息的场景。例如，许多 Objective-C 程序员对访问器方法非常“虔诚；除了使用访问器方法外，他们永远不会读取或写入实例变量。更新你的\
  \ `bodyMassIndex` 方法来取悦这些纯主义者：\n\n```objectivec\n- (float)bodyMassIndex\n{\n   \
  \ float h = [self heightInMeters];\n    return [self weightInKilos] / (h * h);\n\
  }\n```\n\n在这里，`Person` 的实例向自己发送了两个消息 `heightInMeters` 和 `weightInKilos`，以获取其实例变量的值。\n\
  \n你也可以将 `self` 作为参数传递，让其他对象知道当前对象在哪里。例如，你的 `Person` 类可能有一个方法 `addYourselfToArray:`，它看起来如下：\n\
  \n```objectivec\n- (void)addYourselfToArray:(NSMutableArray *)theArray\n{\n    [theArray\
  \ addObject:self];\n}\n```\n\n在这里，你使用 `self` 告诉数组 `Person` 实例所在的位置。它字面意思就是它的地址。\n\
  \n## Multiple files（多文件）\n\n注意，你的项目现在有两个文件中包含可执行代码：`main.m` 和 `Person.m`。（`Person.h`\
  \ 是类的声明，但里面没有可执行代码）。当你构建项目时，这些文件会被分别编译，然后链接在一起。在现实项目中，一个项目由数百个 C 和 Objective-C 代码文件组成并不罕见。\n\
  \n你还可以链接代码库。例如，你可能会找到一个非常棒的库来解析来自数字望远镜的数据。如果你的程序需要此功能，你将编译该库并添加到项目中。当 Xcode 构建你的程序时，它会链接该库中定义的所有函数和类。\n\
  \n## Challenge（挑战）\n\n创建一个新的 Foundation 命令行工具名为 `Stocks`。然后创建一个名为 `StockHolding`\
  \ 的类来表示你购买的股票。它将是 `NSObject` 的子类。对于实例变量，它将有两个名为 `purchaseSharePrice` 和 `currentSharePrice`\
  \ 的 `float` 以及一个名为 `numberOfShares` 的 `int`。为实例变量创建访问器方法。再创建两个实例方法：\n\n```objectivec\n\
  - (float)costInDollars;  // purchaseSharePrice * numberOfShares\n- (float)valueInDollars;\
  \ // currentSharePrice * numberOfShares\n```\n\n在 `main()` 中，用三个 `StockHolding`\
  \ 实例填充数组。然后遍历数组并打印每个实例的值。\n\n图 17.2 一个 StockHolding 对象的数组\n\n![An array of StockHolding\
  \ objects](img/00049.jpg)\n\n## Inheritance（继承）\n\n当你创建 `Person` 类时，你将其声明为 `NSObject`\
  \ 的子类。这意味着 `Person` 的每一个实例都将拥有在 `NSObject` 中定义的实例变量和方法，以及在 `Person` 中定义的实例变量和方法。我们说\
  \ `Person` 继承了 `NSObject` 的实例变量和方法。在这一节中，我们将深入探讨一下继承。\n\n打开项目并创建一个新文件：`Employee`，它是\
  \ `Person` 的子类。\n\n图 18.1 你认识的一些类的继承图\n\n![Inheritance diagram of some you know](img/0050.jpg)\n\
  \n在 `Employee.h` 中，声明该类：\n\n```objectivec\n#import \"Person.h\"\n\n@interface Employee\
  \ : Person\n{\n    int employeeID;\n}\n\n@property int employeeID;\n@end\n```\n\n\
  在 `Employee.m` 中，合成访问器：\n\n```objectivec\n#import \"Employee.h\"\n\n@implementation\
  \ Employee\n@synthesize employeeID;\n@end\n```\n\n现在你有一个新的 `Employee` 类，它拥有 `Person`\
  \ 的所有实例变量以及一个新的实例变量 `employeeID`。`Employee` 的实例将响应 `Person` 的所有消息。因为 `Person` 继承自\
  \ `NSObject`，`Employee` 也继承了 `NSObject` 的所有实例变量和方法。\n\n图 18.2 BMI 对象图\n\n![Object\
  \ diagram for BMI](img/0051.jpg)\n\n假设你向一个对象发送消息 `fido`。为了响应此消息，对象使用 `isa` 指针找到它的类并询问：“你有一个名为\
  \ `fido` 的实例方法吗？”如果类有一个名为 `fido` 的方法，它就会被执行。如果该类没有 `fido` 方法，它会询问父类：“你有一个名为 `fido`\
  \ 的实例方法吗？”并沿着链向上寻找名为 `fido` 的方法。当找到该方法或到达链的顶端时，搜索停止。在链的顶端，`NSObject` 说：“不，没有 `fido`。”然后你会收到一条类似“此\
  \ `Employee` 实例不响应选择 `fido`”的错误消息。\n\n尝试一下。打开 `main.m` 并向 `Person` 实例发送一个它无法理解的消息：\n\
  \n```objectivec\nint main(int argc, const char * argv[])\n{\n    @autoreleasepool\
  \ {\n        // 创建 Person 的实例\n        id person = [[Person alloc] init];\n    \
  \    // 给实例变量赋予有趣的值\n        [person setWeightInKilos:96];\n        [person setHeightInMeters:1.8];\n\
  \        // 调用 bodyMassIndex 方法\n        float bmi = [person bodyMassIndex];\n \
  \       NSLog(@\"person (%d, %f) 的 BMI 为 %f\", (int)[person weightInKilos], [person\
  \ heightInMeters], bmi);\n    }\n}\n```\n\n\n\n\n```objc\n            [person weightInKilos],\
  \ [person heightInMeters], bmi);\n\n[person count];\n     }\nreturn 0;\n}\n```\n\
  \n编译并运行程序。（忽略编译器的警告，因为这是你故意这么做的。在大多数情况下，如果你看到这个警告，你应该关注它！）你应该能在控制台中看到一个记录的运行时异常：\n\
  \n```\n*** Terminating app due to uncaught exception 'NSInvalidArgumentException',\n\
  \     reason: '-[Person count]: unrecognized selector sent to instance 0x100108de0'\n\
  ```\n\n在检查异常后，在继续操作之前删除有问题的那行代码。\n\n你已经创建了这个新的 `Employee` 类，但还没有使用它。修改 `main.m`\
  \ 以使用 `Employee`：\n\n```objc\n#import <Foundation/Foundation.h>\n#import \"Employee.h\"\
  \n\nint main(int argc, const char * argv[])\n{\n    @autoreleasepool {\n       \
  \ // 创建一个 Person 实例\n        Person *person = [[Employee alloc] init];\n       \
  \ // 给实例变量赋予有趣的值\n        [person setWeightInKilos:96];\n        [person setHeightInMeters:1.8];\n\
  \        // 调用 bodyMassIndex 方法\n        float bmi = [person bodyMassIndex];\n \
  \       NSLog(@\"person (%d, %f) has a BMI of %f\",\n              [person weightInKilos],\
  \ [person heightInMeters], bmi);\n    }\n    return 0;\n}\n```\n\n注意你的 `person`\
  \ 变量仍然声明为指向 `Person` 的指针。认为这会导致问题吗？编译并运行程序，你会发现你的程序仍然运行良好。这是因为员工（employee）是人的一种——它可以做人能做的任何事情。也就是说，在程序期望\
  \ `Person` 实例的任何地方我们都可以使用 `Employee` 实例。\n\n然而，现在你将使用一个 `Employee` 特有的方法，因此你必须更改指针变量的：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n#import \"Employee.h\"\n\nint main(int\
  \ argc, const char * argv[])\n{\n    @autoreleasepool {\n        // 创建一个 Person\
  \ 实例\n        Employee *person = [[Employee alloc] init];\n        // 给实例变量赋予有趣的值\n\
  \        [person setWeightInKilos:96];\n        [person setHeightInMeters:1.8];\n\
  \        [person setEmployeeID:15];\n        // 调用 bodyMassIndex 方法\n        float\
  \ bmi = [person bodyMassIndex];\n        NSLog(@\"Employee %d has a BMI of %f\"\
  , [person employeeID], bmi);\n    }\n    return 0;\n}\n```\n\n## 覆盖方法 (Overriding\
  \ methods)\n\n回顾一下，当发送消息时，对该名称方法的搜索从对象的类开始，并沿着继承层次向上进行。找到的第一个实现就是执行的实现。因此，你可以用自定义实现来覆盖继承的方法。例如，假设你决定员工的体质量指数始终为\
  \ 19。在这种情况下，你可能会重写 `Employee` 中的 `bodyMassIndex` 方法。打开 `Employee.m` 并进行操作：\n\n```objc\n\
  #import \"Employee.h\"\n@implementation Employee\n@synthesize employeeID;\n- (float)bodyMassIndex\n\
  {\n    return 19.0;\n}\n@end\n```\n\n编译并运行程序，注意你对 `bodyMassIndex` 的新实现是执行的那个——而不是来自\
  \ `Person` 的实现。\n\n注意你在 `Employee.m` 中实现了 `bodyMassIndex`，但没有在 `Employee.h` 中声明它。在头文件中声明方法会发布该方法，以便其他类的实例可以调用它。然而，因为\
  \ `Employee` 继承自 `Person`，所有人已经知道 `Employee` 实例拥有 `bodyMassIndex` 方法了。没有必要再次发布它。\n\
  \n## super\n\n如果你决定所有员工都自动获得 10% 的折扣会怎样呢？要做到这一点，你使用 `super`：\n\n```objc\n#import\
  \ \"Employee.h\"\n@implementation Employee\n@synthesize employeeID;\n- (float)bodyMassIndex\n\
  {\n    float bmi = [super bodyMassIndex];\n    return bmi * 0.9;\n}\n@end\n```\n\
  \n## 挑战 (Challenge)\n\n这个挑战基于上一章。创建一个名为 `ForeignHolding` 的 `Employee` 的子类。给 `ForeignHolding`\
  \ 添加一个额外的实例变量：`conversionRate`，它的类型为 `float`。在 `main()` 中添加几个 `ForeignHolding` 的实例。\n\
  \n## 19 对象实例变量 (Object Instance Variables)\n\n到目前为止，在类中声明的实例变量都是 `int` 或 `float`\
  \ 等简单类型。实例变量指向其他对象的指针要常见得多。对象变量指向另一个对象并描述两者之间的关系。通常，实例变量分为三类：\n\n- **对象类型属性 (Object-type\
  \ attributes)**：指向一个类值对象（如 `NSString` 或 `NSNumber`）的指针。例如，员工的姓将是一个 `NSString`。因此，`Employee`\
  \ 的实例将有一个指向 `NSString` 指针的实例变量。\n- **一对一关系 (To-one relationships)**：指向单个复杂对象的指针。例如，一个员工可能有一个配偶。因此，`Employee`\
  \ 的实例将有一个指向 `Person` 指针的实例变量。\n- **一对多关系 (To-many relationships)**：指向集合类实例的指针，例如\
  \ `NSMutableArray`。（我们将在第 21 章看到其他集合的例子。）例如，一个员工可能有孩子。在这种情况下，`Employee` 的实例将有一个指向\
  \ `NSMutableArray` 指针的实例变量。该 `NSMutableArray` 将持有一个或多个 `Person` 对象的指针。\n\n（注意，在上面的列表中，我提到“一个\
  \ `NSString`”。`NSString` 是类类，但“一个 `NSString`”是 `NSString` 实例的缩写。这种用法有点困惑，但非常常见，所以习惯它是好的。）\n\
  \n`Employee` 实例变量的声明如下：\n\n```objc\n@interface Employee : Person\n{\n    int employeeID;\n\
  \    NSString *lastName;\n    Person *spouse;\n    NSMutableArray *children;\n}\n\
  ```\n\n\n\n\n\n*   一个对象可以承担多个角色。例如，员工的配偶很可能也被列为孩子的紧急联系人：\n\n    图 19.2 一个对象，多个角色\n\
  \    ![一个对象，多个角色](img/00054.jpg)\n\n*   你最终会产生许多不同的对象并占用程序的内存。你需要让正在使用的对象保持存在，但你希望那些必要的对象被释放（将它们的内存归还堆），以便它们的内存可以被重用。重用内存可以使你的程序内存占用尽可能小，这会让你的整个电脑运行起来更加敏捷。在移动设备（如\
  \ iPhone）上，如果你的程序内存占用过大，操作系统将杀掉你的程序。\n\n## 对象所有权与 ARC\n\n为了管理这些问题，我们引入了“对象所有权”的概念。当一个对象有一个对象实例变量时，拥有该指针的对象被认为拥有它所指向的对象。\n\
  \n从另一个角度来看，对象知道自己当前有多少个所有者。例如，在上面的图中，`Person` 的实例有三个所有者：`Employee` 对象和两个 `Child`\
  \ 对象。当一个对象的所有者数量为零时，它认为再也没有人需要它了，并会释放自己。\n\n每个对象的所有者计数由自动引用计数（Automatic Reference\
  \ Counting）处理。`ARC` 是 Objective-C 的一项最新开发。在 Xcode 4.2 之前，我们手动管理所有权，并花费了大量精力。（关于手动引用计数及其工作原理的更多信息，请参见第\
  \ 20 章的最后章节。不过，本书中的所有代码都假设你正在使用 `ARC`。）\n\n让我们扩展 `BMITime` 项目来查看所有权在实践中是如何工作的。公司跟踪资产发放给了哪些员工并不是稀常的事。我们将创建一个\
  \ `Asset` 类，每个 `Employee` 将拥有一个包含他或她资产的数组。\n\n    图 19.3 员工与资产\n    ![员工与资产](img/00055.jpg)\n\
  \n这通常被称为“父子”关系：父对象（`Employee` 的实例）拥有一组子对象（一个包含 `Asset` 对象的 `NSMutableArray`）。\n\n\
  ### 创建 Asset 类\n\n创建一个新文件：NSObject 的 Objective-C 子类。将其命名为 `Asset`。打开 `Asset.h` 并声明两个实例变量和两个属性：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n\n@interface Asset : NSObject\n{\n\
  \    NSString *label;\n    unsigned int resaleValue;\n}\n@property (strong) NSString\
  \ *label;\n@property unsigned int resaleValue;\n@end\n```\n\n注意 `label` 属性声明中的 `strong`\
  \ 修饰符。它表示：“这是一个指向对象的指针，我声称对该对象拥有所有权。”（我们将在第 20 章中讨论该属性属性的其他选项。）\n\n记住，当一个对象没有任何所有者时，它会被销毁。当一个对象正在被释放时，它会收到\
  \ `dealloc` 消息。（每个对象都从 `NSObject` 继承 `dealloc` 方法。）你将重写 `dealloc`，以便你可以看到 `Asset`\
  \ 实例何时被释放。\n\n为了明确是哪一个特定的 `Asset` 实例被释放，你还将实现另一个 `NSObject` 方法 `description`。该方法返回一个字符串，作为该类实例的有用描述。对于\
  \ `Asset`，你将让 `description` 返回一个包含实例 `label` 和 `resaleValue` 的字符串。\n\n打开 `Asset.m`。为你的实例变量合成访问器（accessors），然后重写\
  \ `description` 和 `dealloc`。\n\n```objc\n#import \"Asset.h\"\n\n@implementation\
  \ Asset\n@synthesize label, resaleValue;\n- (NSString *)description\n{\n    return\
  \ [NSString stringWithFormat:@\"<%@: $%d >\",\n              [self label], [self\
  \ resaleValue]];\n}\n- (void)dealloc\n{\n    NSLog(@\"deallocating %@\", self);\n\
  } \n@end\n```\n\n注意上述代码中格式字符串中的 `%@` 令牌。该令牌会被向相应变量发送 `description` 消息的结果所替换（该变量必须是对象的指针，以便接收此消息）。\n\
  \n尝试构建你目前的内容，看看在输入时是否犯任何错误。你可以使用快捷键 `Command-B` 在不运行程序的情况下构建程序。这对于在不花时间运行程序的情况下测试代码，或者当你知道程序还没准备好运行时非常有用。此外，在做出更改后进行构建是一个好主意，这样如果你引入了语法错误，可以立即发现并修复它。如果你等待，就不会那么确定了。\n\
  \n### 为 Employee 添加一对多关系\n\n为了在 `Employee` 中建立一对多关系（to-many relationship），你需要一个变量来存放集合。在\
  \ `Employee.h` 中，添加：\n\n```objc\n#import \"Person.h\"\n@class Asset;\n\n@interface\
  \ Employee : Person\n{\n    int employeeID;\n    NSMutableArray *assets;\n}\n@property\
  \ int employeeID;\n- (void)addAssets:(Asset *)a;\n- (unsigned int)valueOfAssets;\n\
  @end\n```\n\n注意 `@class Asset` 编译器有一个名为 `Asset` 的类，而不需要完整的定义，这可以加快编译。\n\n现在将注意力转向\
  \ `Employee.m`。对于一对多关系，你需要创建一个集合（一个数组）。\n\n```objc\n#import \"Employee.h\"\n#import\
  \ \"Asset.h\"\n\n@implementation Employee\n@synthesize employeeID;\n- (void)addAssets:(Asset\
  \ *)a\n{\n    if (!assets) {\n        assets = [[NSMutableArray alloc] init];\n\
  \    }\n    [assets addObject:a];\n}\n- (unsigned int)valueOfAssets\n{\n    unsigned\
  \ int sum = 0;\n    for (Asset *a in assets) {\n        sum += [a resaleValue];\n\
  \    }\n    return sum;\n}\n\n- (float)bodyMassIndex\n{\n    float normalBMI = [super\
  \ bodyMassIndex];\n    return normalBMI * 0.9;\n}\n\n- (NSString *)description\n\
  {\n    return [NSString stringWithFormat:@\"<Employee %d: $%d in assets>\",\n  \
  \            [self employeeID], [self valueOfAssets]];\n}\n\n- (void)dealloc\n{\n\
  \    NSLog(@\"deallocating %@\", self);\n} \n\n@end\n```\n\n\n\n现在，你需要创建一些资产并将它们分配给员工。编辑\
  \ `main.m`：\n\n```objc\n#import <Foundation/Foundation.h>\n#import \"Employee.h\"\
  \n#import \"Asset.h\"\n\nint main(int argc, const char * argv[])\n{\n    @autoreleasepool\
  \ {\n        // 创建一个 Employee 对象数组\n        NSMutableArray *employees = [[NSMutableArray\
  \ alloc] init];\n        for (int i = 0; i < 10; i++) {\n            // 创建 Employee\
  \ 实例\n            Employee *person = [[Employee alloc] init];\n            // 给实例变量赋予有趣的值\n\
  \            [person setWeightInKilos:90 + i];\n            [person setHeightInMeters:1.8\
  \ - i/10.0];\n            [person setEmployeeID:i];\n            // 将员工放入 employees\
  \ 数组\n            [employees addObject:person];\n        }\n        // 创建 10 个资产\n\
  \        for (int i = 0; i < 10; i++) {\n            // 创建一个资产\n            Asset\
  \ *asset = [[Asset alloc] init];\n            // 给它起一个有趣的标签\n            NSString\
  \ *currentLabel = [NSString stringWithFormat:@\"Laptop %d\", i];\n            [asset\
  \ setLabel:currentLabel];\n            [asset setResaleValue:i * 17];\n        \
  \    // 获取 0 到 9 之间的随机数\n            NSUInteger randomIndex = random() % [employees\
  \ count];\n            // 找到该员工\n            Employee *randomEmployee = [employees\
  \ objectAtIndex:randomIndex];\n            // 将资产分配给该员工\n            [randomEmployee\
  \ addAssetsObject:asset];\n        }\n        NSLog(@\"Employees: %@\", employees);\n\
  \        NSLog(@\"放弃一个员工的所有权\");\n        [employees removeObjectAtIndex:5];\n \
  \       NSLog(@\"放弃数组的所有权\");\n        employees = nil;\n    }\n    return 0;\n\
  }\n```\n\n编译并运行程序。你将看到类似下面的内容：\n\n```\nEmployees: (\n  \"<Employee 0: $0 in assets>\"\
  ,\n  \"<Employee 1: $153 in assets>\",\n  \"<Employee 2: $119 in assets>\",\n  \"\
  <Employee 3: $68 in assets>\",\n  \"<Employee 4: $0 in assets>\",\n  \"<Employee\
  \ 5: $136 in assets>\",\n  \"<Employee 6: $119 in assets>\",\n  \"<Employee 7: $34\
  \ in assets>\",\n  \"<Employee 8: $0 in assets>\",\n  \"<Employee 9: $136 in assets>\"\
  \n)\nGiving up ownership of one employee\ndeallocating <Employee 5: $136 in assets>\n\
  deallocating <Laptop 3: $51 >\ndeallocating <Laptop 5: $85  >\nGiving up ownership\
  \ of array\ndeallocating <Employee 0: $0 in assets>\ndeallocating <Employee 1: $153\
  \ in assets>\ndeallocating <Laptop 9: $153 >\n…\ndeallocating <Employee 9: $136\
  \ in assets>\ndeallocing <Laptop 8: $136 >\n```\n\n当员工 `#5` 从数组中移除时，它会被释放（deallocated），因为它没有所有者。。，它的资产也会被释放，因为它们没有所有者。（你必须相信我：被释放的资产的标签（`NSString`\
  \ 实例）在没有所有者后也会被释放。）\n\n当 `employees` 被置为 `nil` 时，数组不再拥有所有者。因此它被释放，这会引发更大规模的内存清理和释放链反应，突然间，没有任何一个……都消失了。\n\
  \n## 内存泄漏\n当我们一起使用 `Asset` 和 `Employee` 类时，如何确保这两种关系是一致的呢？例如，一个 `Asset` 应该知道是哪个\
  \ `Employee` 持有它。\n\n在 `Asset.h` 中，添加一个指向 `Employee` 的指针：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \nclass Employee;\n\n@interface Asset : NSObject\n@property (nonatomic, retain)\
  \ NSString *label;\n@property (nonatomic, assign) int resaleValue;\n@property (nonatomic,\
  \ retain) Employee *employee;\n@end\n```\n\n在 `Asset.m` 中，扩展 `description` 方法：\n\
  \n```objc\n#import \"Asset.h\"\n#import \"Employee.h\"\n\n@implementation Asset\n\
  \n- (NSString *)description {\n    return [NSString stringWithFormat:@\"%@: $%d\
  \ in assets\", self.label, self.resaleValue];\n}\n\n@end\n```\n\n等等，如果我们在 `Asset`\
  \ 中对 `employee` 指针使用 `retain`，而 `Employee` 对 `assets` 数组使用 `retain`，就会导致循环引用（retain\
  \ cycle）。为了修复这个问题，我们应该在 `Asset` 中对 `employee` 指针使用 `weak`。\n\n在 `Employee.h` 中：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n\nclass Asset;\n\n@interface Employee\
  \ : NSObject\n@property (nonatomic, assign) int weightInKilos;\n@property (nonatomic,\
  \ assign) double heightInMeters;\n@property (nonatomic, assign) int employeeID;\n\
  @property (nonatomic, retain) NSMutableArray *assets;\n@end\n```\n\n在 `Employee.m`\
  \ 中，扩展 `addAssetsObject:` 方法：\n\n```objc\n#import \"Employee.h\"\n#import \"Asset.h\"\
  \n\n@implementation Employee\n\n- (instancetype)init {\n    self = [super init];\n\
  \    if (self) {\n        _assets = [[NSMutableArray alloc] init];\n    }\n    return\
  \ self;\n}\n\n- (void)addAssetsObject:(Asset *)asset {\n    if (!_assets) {\n  \
  \      _assets = [[NSMutableArray alloc] init];\n    }\n    [_assets addObject:asset];\n\
  \    [asset setEmployee:self];\n}\n\n- (void)setWeightInKilos:(int)weight { _weightInKilos\
  \ = weight; }\n- (void)setHeightInMeters:(double)height { _heightInMeters = height;\
  \ }\n- (void)setEmployeeID:(int)id { _employeeID = id; }\n\n@end\n```\n\n我最喜欢的 Bug\
  \ 之一：让两个访问器自动调用对方。这会导致无限循环：`addAssetsObject:` 调用 `setHolder:`，后者调用 `addAssetsObject:`，以此……\n\
  \n\n\n\n资产（Asset）拥有员工（Employee），员工拥有资产数组，而资产数组又拥有资产。这种所有权循环创建了一个垃圾孤岛。这些对象本应该被释放以释放内存，但它们并没有被释放。这被称为引用循环（retain\
  \ cycle）。引用循环是内存泄漏的非常常见来源。\n\n要在你的程序中找到引用循环，可以使用 Apple 的性能分析工具 `Instruments`。当你对程序进行性能分析时，会在程序运行时对其进行监控，以查看代码和系统在后台发生了什么。然而，你的程序运行和退出的速度非常快。为了给你留出性能分析的时间，请在\
  \ `main()` 函数的末尾添加一百秒的 `sleep()`：\n\n```objc\n     ...\n     }\nsleep(100);\n  \
  \   return 0;\n}\n```\n\n在 Xcode 中，选择菜单栏中的 `Product` → `Profile`。`Instruments` 将启动。当出现可能的性能分析工具列表时，选择\
  \ `Leaks`：\n\n图 20.2 选择性能分析器\n![选择性能分析器](img/00057.jpg)\n\n随着程序的运行，你可以浏览各项状态。在窗口左侧你有两个工具可以选择（图\
  \ 20.3）。点击 `Allocations` 工具将让你看到堆中已分配的所有内容的条形图：\n\n图 20.3 Allocations 工具\n![Allocations\
  \ 工具](img/00058.jpg)\n\n例如，你可以看到有 10 个 `Asset` 实例仍然存在于你的堆中。\n\n要寻找引用循环，请切换到 `Leaks`\
  \ 工具并从表格上方菜单栏选择 `Cycles` 视图。选择一个特定的循环来查看其对象图：\n\n图 20.4 Leaks 工具\n![Leaks 工具](img/00059.jpg)\n\
  \n## 弱引用 (Weak references)\n\n如何修复引用循环？使用弱引用（weak reference）。弱引用是一个不隐式表示所有权的指针。为了修复我们的引用循环，资产不应该拥有它的持有者。编辑\
  \ `Asset.h` 使 `holder` 成为一个弱引用：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  @class Employee;\n@interface Asset : NSObject\n{\n    NSString *label;\n__weak Employee\
  \ *holder;\n    unsigned int resaleValue;\n}\n@property (strong) NSString *label;\n\
  @property (weak) Employee *holder;\n@property unsigned int resaleValue;\n@end\n\
  ```\n\n编译并运行程序。注意，所有对象现在都被正确地释放了。\n\n在父子关系中，防止此类引用循环的通用规则是父对象拥有孩子，但孩子应该拥有父对象。\n\n\
  ## 弱引用置零（Zeroing of weak references）\n\n为了看到弱引用的作用，让我们添加另一个数组。如果我们想要一个所有资产的数组——即使是尚未分配给特定员工的资产？我们可以在创建资产时将它们添加到数组中。在\
  \ `main.m` 中添加几行代码：\n\n```objc\n#import <Foundation/Foundation.h>\n#import \"Employee.h\"\
  \n#import \"Asset.h\"\n\nint main(int argc, const char * argv[])\n{\n    @autoreleasepool\
  \ {\n        // 创建 Employee 对象数组\n        NSMutableArray *employees = [[NSMutableArray\
  \ alloc] init];\n        for (int i = 0; i < 10; i++) {\n            // 创建 Employee\
  \ 实例\n            Employee *person = [[Employee alloc] init];\n            // 给实例变量赋予有趣的值\n\
  \            [person setWeightInKilos:90 + i];\n            [person setHeightInMeters:1.8\
  \ - i/10.0];\n            [person setEmployeeID:i];\n            // 将员工放入 employees\
  \ 数组\n            [employees addObject:person];\n        }\n        NSMutableArray\
  \ *allAssets = [[NSMutableArray alloc] init];\n        // 创建 10 个资产\n        for\
  \ (int i = 0; i < 10; i++) {\n            // 创建一个资产\n            Asset *asset =\
  \ [[Asset alloc] init];\n            // 给它一个标签\n            NSString *currentLabel\
  \ = [NSString stringWithFormat:@\"Laptop %d\", i];\n            [asset setLabel:currentLabel];\n\
  \            [asset setResaleValue:i * 17];\n            // 获取一个 0 到 9 之间的随机数\n\
  \            NSUInteger randomIndex = random() % [employees count];\n          \
  \  // 找到该员工\n            Employee *randomEmployee = [employees objectAtIndex:randomIndex];\n\
  \            // 将资产分配给员工\n            [randomEmployee addAssets:asset];\n      \
  \      [allAssets addObject:asset];\n        }\n        NSLog(@\"Employees: %@\"\
  , employees);\n        NSLog(@\"Giving up ownership of one employee\");\n      \
  \  [employees removeObjectAtIndex:5];\n        NSLog(@\"allAssets: %@\", allAssets);\n\
  \        NSLog(@\"Giving up ownership of arrays\");\n        allAssets = nil;\n\
  \        employees = nil;\n    }\n    sleep(100);\n    return 0;\n}\n```\n\n在编译和运行程序之前，思考一下你期望输出是什么样子。你会看到\
  \ `allAssets` 数组的内容——在 Employee #5 被释放之后。此时，Employee #5 的资产状态将会是什么？这些资产失去了一个所有者（Employee\
  \ #5），但它们仍然被 `allAssets` 拥有，因此它们不会被释放。\n\n之前由 Employee #5 拥有的资产的 `holder` 又是怎样的呢？当弱引用指向的对象被释放时，指针变量将被置零（或设置为\
  \ `nil`）。因此，Employee #5 的资产不会被释放，它们的 `holder` 变量将自动被设置为 `nil`。\n\n现在编译并运行程序并检查你的输出：\n\
  \n```\nEmployees: (\n    \"Employee 0: $0 in assets\",\n    ...\n    \"Employee\
  \ 9: $136 in assets\"\n)\nGiving up ownership of one employee\ndeallocating <Employee\
  \ 5: $136 in assets>\nallAssets: (\n    \"Laptop 0: $0, assigned to <Employee 3:\
  \ $68 in assets>\",\n    \"Laptop 1: $17, assigned to <Employee 6: $119 in assets>\"\
  ,\n    \"Laptop 2: $34, assigned to <Employee 7: $34 in assets>\",\n    \"Laptop\
  \ 3: $51 unassigned>\",\n    \"Laptop 4: $68, assigned to <Employee 3: $68 in assets>\"\
  ,\n    \"Laptop 5: $85 unassigned>\",\n    \"Laptop 6: $102, assigned to <Employee\
  \ 6: $119 in assets>\",\n    \"Laptop 7: $119, assigned to <Employee 2: $119 in\
  \ assets>\",\n    \"Laptop 8: $136, assigned to <Employee 9: $136 in assets>\",\n\
  \    \"Laptop 9: $153, assigned to <Employee 1: $153 in assets>\"\n)\nGiving up\
  \ ownership of arrays\ndeallocing <Laptop 3: $51 unassigned>\n...\ndeallocing <Laptop\
  \ 8: $136 unassigned>\n```\n\n## 给好奇的读者：手动引用计数与 ARC\n\n正如在第 19 章开头提到的，在自动引用计数（ARC）引入\
  \ Objective-C 之前，我们使用手动引用计数来计数。在手动引用计数中，所有权的变化发生在你向对象发送递减或增加引用计数的消息时。\n\n`[anObject\
  \ release]; // anObject 失去一个所有者`\n\n`[anObject retain]; // anObject 获得一个所有者`\n\n\
  你主要会在访问器方法中（新值被保留，旧值被释放）以及 `dealloc` 方法中（之前保留的对象被释放）看到这类调用。`Asset` 的 `setHolder:`\
  \ 方法看起来应该是这样的：\n\n```objc\n- (void)setHolder:(Employee *)newEmp\n{\n    [newEmp\
  \ retain];\n    [holder release];\n    holder = newEmp;\n}\n```\n\n`dealloc` 方法看起来如下：\n\
  \n```objc\n- (void)dealloc\n{\n    [label release];\n    [holder release];\n   \
  \ [super dealloc];\n}\n```\n\n`description` 方法又是怎样的？它创建并返回一个字符串。`Asset` 应该拥有它的所有权吗？这并不合理；资产正在交付它创建的字符串。当你\
  \ `autorelease` 一个对象时，你是在将其标记为未来将发送 `release`。在 ARC 之前，`Asset` 的 `description` 方法看起来如下：\n\
  \n```objc\n- (NSString *)description\n{\n```\n\n\n\n\n```objc\nNSString *result\
  \ = [[NSString alloc] initWithFormat:@\"<%@: $%d >\",\n                        \
  \                       [self label], [self resaleValue]];\n[result autorelease];\n\
  return result;\n}\n```\n\n它何时会被发送 `release` 消息？当当前的 autorelease 池被清空时：\n\n```objc\n\
  // 创建 autorelease 池\nNSAutoreleasePool *arp = [[NSAutoreleasePool alloc] init];\n\
  Asset *asset = [[Asset alloc] init];\nNSString *d = [asset description];\n// d 指向的字符串在\
  \ autorelease 池中\n[arp drain]; // 字符串被发送 release 消息\n```\n\nARC 会自动使用 autorelease\
  \ 池，但你必须手动创建并清空该池。在 ARC 出现时，我们还获得了一种创建 autorelease 池的新语法。上面的代码现在看起来像是这样：\n\n```objc\n\
  // 创建 autorelease 池\n@autoreleasepool {\n    Asset *asset = [[Asset alloc] init];\n\
  \    NSString *d = [asset description];\n    // d 指向的字符串在 autorelease 池中\n} // 池被清空了\n\
  ```\n\n### 引用计数规则\n\n有一组所有 Objective-C 程序员都遵循的内存管理约定。如果你使用 ARC，它会在后台为你遵循这些约定。\n\n\
  在这些规则中，我使用“你”来表示“你当前正在处理的某个类的实例”。这是一种很有同理心的形式：你想象你自己就是正在编写的那个对象。因此，“如果你保留（retain）了这个字符串，它将不会被释放”实际上意味着“如果你当前正在处理的类的实例保留了该字符串，它将不会被释放”。\n\
  \n以下是这些规则。（实现细节在括号中。）\n\n*   如果你使用名称以 `alloc` 或 `new` 开头或包含 `copy` 的方法创建对象，那么你就拥有了它的所有权。（也就是说，假设新对象的引用计数为\
  \ 1 且不在 autorelease 池中）。当你不再需要该对象时，你有责任释放（release）它。这里列了一些传达所有权的常用方法：`alloc`（其后通常会紧跟一个\
  \ `init` 方法）、`copy` 和 `mutableCopy`。\n*   通过任何其他方式创建的对象都不属于你。（也就是说，假设它的引用计数为 1 已经在\
  \ autorelease 池中，因此在 autorelease 池被清空之前，除非被保留（retain），否则注定会被释放。）\n*   如果你没有一个对象并想确保它的持续存在，通过向它发送\
  \ `retain` 消息来获取所有权。（这会增加引用计数。）\n*   当你拥有一个对象并且不再需要它时，向它发送 `release` 或 `autorelease`\
  \ 消息。（`release` 会立即减少引用计数。`autorelease` 会导致在 autorelease 池被清空时发送 `release` 消息。）\n\
  *   只要一个对象至少有一个所有者，它就会继续存在。（当它的引用计数变为零时，它会被接收到 `dealloc` 消息。）\n\n理解内存管理的技巧之一是**局部思考（think\
  \ locally）**。`Asset` 类不需要知道任何其他同样关心其 `label` 的对象的信息。只要 `Asset` 实例保留了它想要保留的对象，你就不会遇到任何问题。初学这种语言的程序员有时会犯尝试跟踪整个应用程序中对象的错误。不要这样做。如果你遵循这些规则并始终从类的局部角度进行思考，你永远不需要担心应用程序的其他部分对某个对象做了什么。\n\
  \n遵循所有权的思想，现在就很清楚为什么你需要在 `description` 方法中对字符串进行 autorelease 了：员工对象创建了这个字符串，但它不想拥有它。它想把它送出去。\n\
  \n# 21\n\n## 集合类\n\n你已经使用了两个集合类：`NSArray` 及其子类 `NSMutableArray`。正如你所知，数组包含一个指向其他对象的指针集合。指针是有序的，因此你使用索引（整数）来访问集合中的对象。在本章中，我们将深入研究数组，并查看其他集合类：`NSSet`/`NSMutableSet`\
  \ 以及 `NSDictionary`/`NSMutableDictionary`。\n\n## NSArray/NSMutableArray\n\n当你向数组添加对象时，数组声称拥有该对象的所有权。当你从数组中移除对象时，数组会放弃所有权。打开\
  \ BMITime，看看你是如何使用 `employees` 数组的。忽略所有其他内容，你会看到这样的代码：\n\n```objc\n// 创建一个 Employee\
  \ 对象数组\nNSMutableArray *employees = [[NSMutableArray alloc] init];\nfor (int i =\
  \ 0; i < 10; i++) {\n    // 创建 Employee 实例\n    Employee *person = [[Employee alloc]\
  \ init];\n    // 将员工放入数组\n    [employees addObject:person];\n}\n[employees removeObject:5];\n\
  ```\n\n你通常使用 `alloc`/`init` 创建可变数组。例如，你可以这样写：\n\n```objc\nNSMutableArray *employees\
  \ = [NSMutableArray array];\n```\n\n注意，`addObject:` 方法将对象添加到末尾。`NSMutableArray`\
  \ 会根据需要进行增长。\n\n### 不变对象\n\n当你创建一个 `NSArray` 实例时，你将所有对象分配给它。这通常看起来像：\n\n```objc\n\
  NSArray *colors = [NSArray array:@\"Orange\", \"Yellow\", nil];\n```\n\n末尾的 `nil`\
  \ 是你告诉方法停止的方式。大多数初学者对 `NSArray` 的存在感到惊讶。为什么会有人想要一个不可变的列表呢？原因有两个：\n\n*   你不信任与你合作的人。也就是说，你想让他们看一个数组，但不想让他们改变它。一种更温和的方法是给他们\
  \ `NSMutableArray`，但告诉他们它是 `NSArray`。例如，想象以下这个方法：\n\n```objc\n// 返回一个包含 30 个奇数的数组\n\
  - (NSArray *)odds {\n    NSMutableArray *odds = [[NSMutableArray alloc] init];\n\
  \    int i = 1;\n    while ([odds count] < 30) {\n        [odds addObject:[NSNumber\
  \ numberWithInt:i]];\n        i += 2;\n    }\n    return odds;\n}\n```\n\n任何调用此方法的人都假设它返回一个不可变的\
  \ `NSArray`。如果调用者尝试从返回的对象添加或删除项目，编译器将发出严厉的警告——尽管它实际上是一个 `NSMutableArray` 实例。\n\n\
  *   另一个原因是性能：不变对象永远不需要复制。对于可变对象，你可能会创建一个私有副本，以便你知道系统中的其他代码不会在你的脚下更改它。这对于不变对象来说是不必要的。事实上，虽然\
  \ `NSMutableArray` 的 `copy` 方法会创建自己的新副本并返回新数组的指针，但 `NSArray` 的 `copy` 方法什么都不做——它只是返回指向自身的指针。\n\
  \n结果是，不变对象在 Objective-C 编程中非常常见。在 Foundation 中，许多类都会创建不可变实例：`NSArray`、`NSString`、`NSAttributedString`、`NSData`、`NSCharacterSet`、`NSDictionary`、`NSSet`、`NSIndexSet`\
  \ 和 `NSURLRequest`。所有这些类都有可变子类：`NSMutableArray`、`NSMutableString`、`NSMutableAttributedString`\
  \ 等。`NSDate` 和 `NSNumber` 则是不变的，并且没有可变子类。\n\n### 排序\n\n排序数组有多种方法，但最常见的方法是使用排序描述符数组。`NSMutableArray`\
  \ 有以下方法：\n\n`- (void)sortUsingDescriptors:(NSArray *)sortDescriptors;`\n\n\n\n\n\
  该参数是一个 `NSSortDescriptor` 对象的数组。排序描述符（sort descriptor）包含了数组中所包含对象的属性名称，以及该属性应该按升序还是降序排序。我们为什么要传递一个排序描述符数组呢？想象一下，你说：“按姓氏升序排序这个医生列表。”如果两个医生的姓氏相同怎么办？你可以指定：“按姓氏升序排序，如果姓氏相同，则按名字升序排序，如果姓和名都相同，则按邮政编码排序。”\n\
  \n图 21.1 按 lastName 排序，然后是 firstName，最后是 zipCode\n\n![按 lastName 排序，然后是 firstName，最后是\
  \ zipCode](img/00060.jpg)\n\n排序的属性可以是任何实例变量，可以是对象任何方法的返回值。\n\n让我们回到 BMITime 项目查看实际中的排序。在\
  \ `main()` 中，在记录 `employees` 数组之前，按 `valueOfAssets` 对其进行排序。如果两个员工持有价值相同的资产，则按 `employeeID`\
  \ 对它们排序。编辑 `main.m`：\n\n```objective-c\n      }      NSSortDescriptor *voa = [NSSortDescriptor\
  \ sortDescriptorWithKey:@\"valueOfAssets\"\n                                   \
  \                        ascending:YES];\n      NSSortDescriptor *ei = [NSSortDescriptor\
  \ sortDescriptorWithKey:@\"employeeID\"\n                                      \
  \                      ascending:YES];\n      [employees sortUsingDescriptors:[NSArray\
  \ arrayWithObjects:voa, ei, nil]];\n      NSLog(@\"Employees: %@\", employees);\n\
  ```\n\n编译并运行程序。你应该能看到员工列表顺序正确：\n\n```\nEmployees: (\n  \"<Employee 0: $0 in assets>\"\
  ,\n  \"<Employee 4: $0 in assets>\",\n  \"<Employee 8: $0 in assets>\",\n  \"<Employee\
  \ 7: $34 in assets>\",\n  \"<Employee 3: $68 in assets>\",\n  \"<Employee 2: $119\
  \ in assets>\",\n  \"<Employee 6: $119 in assets>\",\n  \"<Employee 5: $136 in assets>\"\
  ,\n  \"<Employee 9: $136 in assets>\",\n  \"<Employee 1: $153 in assets>\")\n```\n\
  \n### 过滤 (Filtering)\n\n有一个名为 `NSPredicate` 的类。谓词（predicate）包含一个可能为真的陈述，例如“`employeeID`\
  \ 大于 75。” `NSMutableArray` 有一个方便的方法可以丢弃所有不符合谓词的对象：\n\n```objective-c\n- (void)filterUsingPredicate:(NSPredicate\
  \ *)predicate;\n```\n\n`NSArray` 有一个方法可以创建一个新数组，其中包含所有符合谓词的对象\n\n```objective-c\n\
  - (NSArray *)filteredArrayUsingPredicate:(NSPredicate *)predicate;\n```\n\n假设你正准备收回给所有目前持有总价值超过\
  \ $70 资产的员工的资产。在 `main.m` 附近添加代码：\n\n```objective-c\n          [employees removeObjectAtIndex:5];\n\
  \          NSLog(@\"allAssets: %@\", allAssets);\nNSPredicate *predicate = [NSPredicate\
  \ predicateWithFormat:\n                                                   @\"holder.valueOfAssets\
  \ > 70\"];\n          NSArray *toBeReclaimed = [allAssets filteredArrayUsingPredicate:predicate];\n\
  \          NSLog(@\"toBeReclaimed: %@\", toBeReclaimed);\n          toBeReclaimed\
  \ = nil;\n          NSLog(@\"Giving up ownership of arrays\");\n          allAssets\
  \ = nil;\n          employees = nil;\n      }\n  return 0;\n}\n```\n\n编译并运行程序。你应该看到一个资产列表：\n\
  \n```\ntoBeReclaimed: (\n  \"<Laptop 1: $17, assigned to <Employee 6: $119>\",\n\
  \  \"<Laptop 3: $51, assigned to <Employee 5: $136>\",\n  \"<Laptop 5: $85, assigned\
  \ to <Employee 5: $136>\",\n  \"<Laptop 6: $102, assigned to <Employee 6: $119>\"\
  ,\n  \"<Laptop 8: $136, assigned to <Employee 9: $136>\",\n  \"<Laptop 9: $153,\
  \ assigned to <Employee 1: $153>\")\n```\n\n用于创建谓词的格式字符串可以非常复杂。如果你进行了大量的过滤操作，请确保阅读\
  \ Apple 的 `Predicate Guide`（谓词指南）。\n\n### NSSet/NSMutableSet\n\n`set`（集合）是一个没有顺序概念的集合，特定的对象在集合中只能出现一次。集合主要用于回答“它是否存在？”这个问题。例如，你可能有一组不适当的\
  \ URL。在向孩子显示任何页面之前，你想快速检查该 URL 是否在集合中。集合处理此操作极快。员工的资产没有固有的顺序，而且资产不应该在同一个 `assets`\
  \ 集合中出现两次。修改你的程序，对 `assets` 关系使用 `NSMutableSet` 代替 `NSMutableArray`。\n\n图 21.2 使用\
  \ NSMutableSet 处理 assets\n\n![使用 NSMutableSet 处理 assets](img/0061.jpg)\n\n在 `Employee.h`\
  \ 中，更改变量的声明：\n\n```objective-c\n#import \"Person.h\"\n@class Asset;\n@interface\
  \ Employee : Person\n{\n    int employeeID;\n    NSMutableSet *assets;\n}\n@property\
  \ int employeeID;\n- (void)addAssetsObject:(Asset *)a;\n- (unsigned int)valueOfAssets;\n\
  @end\n```\n\n在 `Employee.m` 中，创建正确类的实例：\n\n```objective-c\n- (void)addAssetsObject:(Asset\
  \ *)a\n{\n    if (!assets) {\n        assets = [[NSMutableSet alloc] init];\n  \
  \  }\n    [assets addObject:a];\n    [a setHolder:self];\n}\n```\n\n编译并运行程序。它的功能应该相同。你不能通过索引访问集合中的对象，因为集合没有顺序概念。相反，你所做的只能问“这里有其中之一吗？”\
  \ `NSSet` 有一个方法：\n\n```objective-c\n- (BOOL)containsObject:(id)x;\n```\n\n当你向集合发送此消息时，它会遍历它的对象集合，寻找与\
  \ `x` 相等的对象。如果找到了，它返回 `YES`；否则返回 `NO`。这引出了一个相当深奥的问题：相等意味着什么？`NSObject` 类定义了一个名为\
  \ `isEqual:` 的方法。要检查两个对象是否相等，你使用 `isEqual:` 方法：\n\n```objective-c\nif ([myDoctor\
  \ isEqual:yourTennisPartner]) {\n    NSLog(@\"my doctor is equal to your tennis\
  \ partner\");\n}\n```\n\n`NSObject` 的 `isEqual:` 定义如下：\n\n```objective-c\n- (BOOL)isEqual:(id)other\n\
  {\n    return (self == other);\n}\n```\n\n因此，如果你没有重写 `isEqual:`，代码段等同于：\n\n```objective-c\n\
  if (myDoctor == yourTennisPartner) {\n    NSLog(@\"my doctor is equal to your tennis\
  \ partner\");\n}\n```\n\n有些类重写了 `isEqual:`。例如，在 `NSString` 中，重写了 `isEqual:` 来比较字符。对于这些类，相等和相同是有区别的。假设我们有两个字符串指针：\n\
  \n```objective-c\nNSString *x = ...\nNSString *y = ...\n```\n\n`x` 和 `y` 如果它们指向完全相同的地址，则是相同的。`x`\
  \ 和 `y` 如果它们指向的字符串包含相同的字母，则是相等的。因此，相同的对象总是相等的。相同的对象并不总是相同的。这种差异重要吗？是的。例如 `NSMutableArray`\
  \ 有两个方法：\n\n```objective-c\n- (NSUInteger)indexOfObject:(id)anObject;\n- (NSUInteger)indexOfObjectIdenticalTo:(id)anObject;\n\
  ```\n\n第一个方法询问每个对象“`isEqual:anObject`?”第二个方法询问每个对象“`== anObject`?”\n\n### NSDictionary/NSMutableDictionary\n\
  \n如你所知，数组通过数字索引；很容易问“给我第 10 个对象。”字典通过字符串索引；很容易问“给我存储在 `favoriteColor` 键下的对象。”更准确地说，字典是键值对的集合。键通常是字符串，而值可以是任何类型的对象。这些键值对不按特定顺序保持。\n\
  \n让我们创建一个高管字典。键将是高管职位，值将是 `Employee` 的实例。第一个员工将放在 `@\"CEO\"` 键下；第二个放在 `@\"CTO\"\
  ` 键下。修改你的 `main.m` 创建并填充 `NSMutableDictionary`。然后，打印出高管字典。最后，将字典的指针设置为 `nil`，这样你就可以看到字典被释放了。\n\
  \n\n\n\n\n```objectivec\n// 创建一个 Employee 对象数组\nNSMutableArray *employees = [[NSMutableArray\
  \ alloc] init];\n\n// 创建一个高管字典\nNSMutableDictionary *executives = [[NSMutableDictionary\
  \ alloc] init];\nfor (int i = 0; i < 10; i++) {\n    // 创建 Employee 实例\n    Employee\
  \ *person = [[Employee alloc] init];\n    // 给实例变量赋予有趣的值\n    [person setWeightInKilos:90\
  \ + i];\n    [person setHeightInMeters:1.8 - i/10.0];\n    [person setEmployeeID:i];\n\
  \    // 将员工放入 employees 数组\n    [employees addObject:person];\n    // 这是第一个员工吗？\n\
  \    if (i == 0) {\n        [executives setObject:person forKey:@\"CEO\"];\n   \
  \ }\n    // 这是第二个员工吗？\n    if (i == 1) {\n        [executives setObject:person forKey:@\"\
  CTO\"];\n    }\n}\n…\nNSLog(@\"allAssets: %@\", allAssets);\nNSLog(@\"executives:\
  \ %@\", executives);\nexecutives = nil;\nNSPredicate *predicate = [NSPredicate predicateWithFormat:@\"\
  holder.valueOfAssets > 70\"];\nNSArray *toBeReclaimed = [allAssets filteredArrayUsingPredicate:predicate];\n\
  NSLog(@\"toBeReclaimed: %@\", toBeReclaimed);\ntoBeReclaimed = nil;\nNSLog(@\"释放数组的所有权\"\
  );\nallAssets = nil;\nemployees = nil;\n}\nreturn 0;\n}\n```\n\n编译并运行程序。高管字典应该将其打印出来：\n\
  \n```objectivec\nexecutives = {\n    CEO = \"<Employee 0: $0 in assets>\";\n   \
  \ CTO = \"<Employee 1: $153 in assets>\";\n}\n```\n\n图 21.3  NSMutableDictionary\
  \ 中的两个 Employee 实例\n\n![NSMutableDictionary 中的两个 Employee 实例](img/00062.jpg)\n\n\
  ## C 原始类型\n\n本章涵盖的集合只持有对象。如果你想要一个 `float`、`int` 或结构体指针的集合怎么办？你可以将常见的 C 原始类型封装在对象中。有两个类专门为此目的设计的。`NSNumber`\
  \ 持有 C 数字类型。`NSValue` 可以持有指针和某些类型的 `struct`（结构体）。\n\n例如，如果你想将数字 4 和 5.6 放入数组中，你会使用\
  \ `NSNumber`：\n\n```objectivec\nNSMutableArray *numList = [[NSMutableArray alloc]\
  \ init];\n[numList addObject:[NSNumber numberWithInt:4]];\n[numList addObject:[NSNumber\
  \ numberWithFloat:5.6]];\n```\n\n## 集合与 nil\n\n你不允许向我们介绍过的任何集合类中添加 `nil`。如果你需要将“空无”的概念（`nil`）放入集合中怎么办？有一个叫做\
  \ `NSNull` 的类。`NSNull` 只有一个实例，它是一个代表“空无”的对象。这里有一个例子。\n\n```objectivec\nNSMutableArray\
  \ *hotel = [[NSMutableArray alloc] init];\n// 一层是大堂\n[hotel addObject:lobby];\n\
  // 二层是泳池\n[hotel addObject:pool];\n// 三层尚未建成\n[hotel addObject:[NSNull null]];\n\
  // 四层是卧室\n[hotel addObject:bedrooms];\n```\n\n## 挑战\n\n探索 `NSArray`、`NSMutableArray`、`NSDictionary`\
  \ 和 `NSMutableDictionary` 的参考页面。你每天都会用到这些类。\n\n## 常量\n\n我们花费了很多时间讨论变量，正如其名所示，它们在程序运行过程中会改变值。然而，有些信息是不改变的。我们称这些为常量，Objective-C\
  \ 程序员定义常量有两种常用的常用方法：`#define` 和全局变量。\n\n在 Xcode 中，创建一个名为 Constants 的新行内工具（Line Tool）。在标准\
  \ C 库中，常量使用 `#define` 预处理器指令定义。标准库的数学部分声明在 `math.h` 文件中。那里定义的常量之一是 `M_PI`。在 `main.m`\
  \ 中使用它：\n\n```objectivec\n#import <Foundation/Foundation.h>\nint main (int argc,\
  \ const char * argv[])\n{\n    @autoreleasepool {\n        // 在字面量中使用，用于任意字符\n \
  \       NSLog(\"%f\", M_PI);\n    }\n    return 0;\n}\n```\n\n当你编译并运行它时，你应该会看到：`π\
  \ is 3.14159`\n\n要查看定义，在编辑器中 Command-点击 `M_PI`。它将带你跳转到 `math.h` 中的以下行：\n\n```c\n\
  #define M_PI 3.1415926535897932384626433832795028\n```\n\n## 预处理器指令\n\n编译 C、C++\
  \ 或 Objective-C 代码文件分两个阶段完成。首先，预处理器会处理该文件。预处理器的输出然后进入编译器。预处理器指令以 `#` 开头，最流行的三个是\
  \ `#include`、`#import` 和 `#define`。\n\n## #include 和 #import\n\n`#include` 和 `#import`\
  \ 本质上做的是相同的事情：请求预处理器读取一个文件并将其添加到输出中。通常，你包含的是一个声明文件（`.h` 文件），这些声明被编译器用来理解它正在编译的代码。\n\
  \n`#include` 和 `#import` 之间有什么区别？`#import` 确保预处理器只包含文件一次。`#include` 则允许你多次包含同一个文件。C\
  \ 程序员倾向于使用 `#include`。\n\n当指定要包含的文件名时，可以使用引号或角括号。引号表示文件在项目目录。角括号表示文件在预处理器知道的标准位置中。这里有两个\
  \ `#import` 的示例：\n\n```objectivec\n// 包含我写的头文件\n#import \"PetStore.h\"\n\n// 包含\
  \ LDAP 库\n#import <ldap.h>\n```\n\n在项目中，以前会在每个文件中包含一组头文件。这会导致文件开头变得杂乱并使编译变慢。为了让更方便且编译更快，大多数\
  \ Xcode 项目都有一个预编译并包含的所有文件。在你的 Constants 项目中，这个文件被称为 `Constants-pch`。\n\n那么，`math.h`\
  \ 中的常量是如何被引入 `main.m` 的？你的 `main.m` 文件有这一行：\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  ```\n\n`Foundation.h` 文件有这一行：\n\n```objectivec\n#include <CoreFoundation/CoreFoundation.h>\n\
  ```\n\n`CoreFoundation.h` 文件有这一行：\n\n```objectivec\n#include <math.h>\n```\n\n##\
  \ #define\n\n`#define` 告诉预处理器，“每当你遇到 A，就将其替换为 B”。再次查看来自 `math.h` 的那行：\n\n```c\n\
  #define M_PI 3.1415926535897932384626433832795028\n```\n\n在 `#define` 指令中，你只需用空格分隔两个部分（标记和它的替换内容）。\n\
  \n`#define` 实际上可以用来制作类似函数。在 `main.m` 中，打印两个数字中较大的：\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  int main (int argc, const char * argv[])\n{\n    @autoreleasepool {\n        NSLog(\"\
  %d is larger\", MAX(10, 12));\n    }\n    return 0;\n}\n```\n\n`MAX` 不是函数；它是一个 `#define`。`MAX`\
  \ 最基础的 C 版本是：\n\n```c\n#define MAX(A,B) ((A) > (B) ? (A) : (B))\n```\n\n所以，当编译器看到你刚刚添加的行时，它看起来像这样：\n\
  \n```objectivec\nNSLog(\"%d is larger\", ((10) > (12) ? (10) : (12)));\n```\n\n\n\
  \n\n让我们向程序中添加一些内容来解释。首先，有一个名为 `NSLocale` 的类，它存储了关于不同地理位置的信息。你可以获取用户当前区域（locale）的实例，然后向它提问。例如，如果你想知道用户所在地区使用的货币是什么，你可以这样询问：\n\
  \n```objectivec\n#import <Foundation/Foundation.h>\n\nint main (int argc, const\
  \ char * argv[])\n{\n    @autoreleasepool {\n        NSLog(@\"\\u03c0 is %f\", M_PI);\n\
  \        NSLog(@\"%d is larger\", MAX(10, 12));\n        NSLocale *here = [NSLocale\
  \ currentLocale];\n        NSString *currency = [here objectForKey:@\"currency\"\
  ];\n        NSLog(@\"Money is %@\", currency);\n    }\n    return 0;\n}\n```\n\n\
  编译并运行它。根据你所在的位置，你应该能看到类似的内容：\n\n`Money is USD`\n\n但是，如果你将键名误写为 `@\"Kuruncy\"`，你将得不到任何返回。为了防止这个问题，Foundation\
  \ 框架定义了一个名为 `NSLocaleCurrencyCode` 的全局变量。它写起来并不更简单，但如果你真的写错了，编译器会报错。此外，Xcode 中的代码补全对全局变量有效，但对字符串常量\
  \ `@\"currency\"` 则无效。将你的代码改为使用该常量：\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, const char * argv[])\n{\n    @autoreleasepool {\n        NSLog(@\"\
  \\u03c0 is %f\", M_PI);\n        NSLog(@\"%d is larger\", MAX(10, 12));\n      \
  \  NSLocale *here = [NSLocale currentLocale];\n        NSString *currency = [here\
  \ objectForKey:@\"NSLocaleCurrencyCode\"];\n        NSLog(@\"Money is %@\", currency);\n\
  \    }\n    return 0;\n}\n```\n\n在编写 `NSLocale` 类时，这个全局变量出现在两个地方。在 `NSLocale.h`\
  \ 中，该变量的声明大致如下：\n\n```objectivec\nextern NSString const *NSLocaleCurrencyCode;\n\
  ```\n\n`const` 意味着该指针在程序的整个生命周期内不会改变。`extern` 意味着“我保证它存在，但它将在另一个文件中定义”。果然，在 `NSLocale.m`\
  \ 文件中，有这样的一行：\n\n```objectivec\nNSString const *NSLocaleCurrencyCode = @\"currency\"\
  ;\n```\n\n### enum\n\n你通常需要定义一组常量。例如，假设你正在开发一个有五档的搅拌机：搅拌（Stir）、切碎（Chop）、乳化（Liquefy）、脉冲（Pulse）和碎冰（Ice\
  \ Crush）。你的 `Blender` 类有一个名为 `setSpeed:` 的方法。如果类型指示只允许这五种速度中的一种，那是最好的。为了做到，你会定义一个枚举：\n\
  \n```objectivec\nenum BlenderSpeed {\n    BlenderSpeedStir = 1,\n    BlenderSpeedChop\
  \ = 2,\n    BlenderSpeedLiquify = 5,\n    BlenderSpeedPulse = 9,\n    BlenderSpeedIceCrush\
  \ = 15\n};\n\n@interface Blender : NSObject\n{\n    // speed 必须是五种速度之一\n    enum\
  \ BlenderSpeed speed;\n}\n\n// setSpeed: 期望五种速度中的之一\n- (void)setSpeed:(enum BlenderSpeed)x;\n\
  @end\n```\n\n开发者厌倦了输入 `enum BlenderSpeed`，因此他们经常使用 `typedef` 为其创建一个简写形式：\n\n```objectivec\n\
  typedef enum  {\n    BlenderSpeedStir = 1,\n    BlenderSpeedChop = 2,\n    BlenderSpeedLiquify\
  \ = 5,\n    BlenderSpeedPulse = 9,\n    BlenderSpeedIceCrush = 15\n} BlenderSpeed;\n\
  \n@interface Blender : NSObject\n{\n    // speed 必须是五种速度之一\n    BlenderSpeed speed;\n\
  }\n\n// setSpeed: 期望五种速度中的之一\n- (void)setSpeed:(BlenderSpeed)x;\n@end\n```\n\n通常你并不在乎这五种速度代表什么数字——只在乎它们彼此是不相同的。你可以省略这些值，编译器会为你生成值：\n\
  \n```objectivec\ntypedef enum {\n    BlenderSpeedStir,\n    BlenderSpeedChop,\n\
  \    BlenderSpeedLiquify,\n    BlenderSpeedPulse,\n    BlenderSpeedIceCrush\n} BlenderSpeed;\n\
  ```\n\n### #define vs 全局变量\n\n既然你可以使用 `#define` 或全局变量（包括 `enum`）来定义常量，为什么 Objective-C\
  \ 程序员倾向于使用全局变量呢？在某些情况下，全局变量具有性能优势。例如，如果你始终使用全局变量，可以使用 `==` 代替 `isEqual:` 来比较字符串（且算术运算更快）。此外，当你在调试器中时，全局变量更容易处理。你应该使用全局变量和\
  \ `enum` 来定义常量，而不是使用 `#define`。\n\n# 23 使用 NSString 和 NSData 写入文件\n\nFoundation\
  \ 框架为开发者提供了几种读取文件和写入文件的方法。在本章中，你将尝试其中几种。\n\n## 将 NSString 写入文件\n\n首先，让我们看看如何将 `NSString`\
  \ 的内容放入文件中。当你将字符串写入文件时，需要指定你正在使用的编码格式。字符串编码描述了每个字符如何被存储为字节数组。`ASCII` 是一种字符串编码，它将字母‘A’定义为存储为\
  \ `01000001`。在 `UTF16` 中，字母‘A’存储为 `0000000001000001`。Foundation 框架支持大约 20 种不同的字符串编码。`UTF`\
  \ 有两种形式：`UTF16`（每个字符使用两个或多个字节）和 `UTF8`（前 128 个字符使用一个字节，其他字符使用两个或更多字节）。对于大多数用途，UTF-8\
  \ 是一个很好的选择。\n\n创建一个新项目：名为 `Stringz` 的 Foundation 工具。在 `main()` 中，使用 `NSString` 类的方法创建一个字符串并将其写入文件系统：\n\
  \n```objectivec\n#import <Foundation/Foundation.h>\n\nint main (int argc, const\
  \ char * argv[])\n{\n    @autoreleasepool {\n        NSMutableString *str = [[NSMutableString\
  \ alloc] init];\n        for (int i = 0; i < 10; i++) {\n            [str appendString:@\"\
  Aaron is cool!\\n\"];\n        }\n        [str writeToFile:@\"/tmp/cool.txt\"\n\
  \               atomically:YES\n               encoding:NSUTF8StringEncoding\n \
  \                 error:NULL];\n        NSLog(@\"done writing /tmp/cool.txt\");\n\
  \    }\n    return 0;\n}\n```\n\n该程序创建一个可以使用任何文本编辑器读取和编辑的文件。`/tmp/cool.txt` 字符串被称为文件路径。文件路径可以是绝对的或相对的：绝对路径以代表根目录的\
  \ `/` 开头，而相对路径从程序的工作目录开始。相对路径不以 `/` 开头。在 Objective-C 编程中，你会发现我们几乎使用绝对路径，因为我们通常不知道程序的工作目录在哪里。\n\
  \n## NSError\n\n可以想象，将字符串写入文件时可能会发生各种问题。例如，用户可能对文件所在的目录没有写入权限。或者目录根本不存在。或者磁盘满了。对于这些可能无法完成的情况，方法除了返回成功或失败的布尔值外，还需要一种方式来返回错误的描述。\n\
  \n回想一下第 9 章，当你需要函数返回返回值之外的其他内容时，可以使用引用传递。你向函数（或方法）传递变量的引用，其可以在其中直接存储或操作该值。引用就是该变量的内存地址。\n\
  \n对于错误处理，许多方法通过引用接收 `NSError` 指针。为上面的示例添加错误处理：\n\n```objectivec\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, const char * argv[])\n{\n    @autoreleasepool {\n        NSMutableString\
  \ *str = [[NSMutableString alloc] init];\n        for (int i = 0; i < 10; i++) {\n\
  \            [str appendString:@\"Aaron is cool!\\n\"];\n        }\n        // 声明一个\
  \ NSError 对象的指针，但不要实例化它。\n        // 只有在确实发生错误时，才会创建 NSError 实例。\n        NSError\
  \ *error;\n    }\n}\n```\n\n\n\n\n```objc\nNSError *error = nil;\n// 通过引用传递 NSError\
  \ 指针给 NSString 方法\nBOOL success = [str writeToFile:@\"/tmp/cool.txt\"\n        \
  \                  atomically:YES\n                              encoding:NSUTF8StringEncoding\n\
  \                              error:&error];\n// 测试返回的 BOOL，如果写入失败则查询 NSError\n\
  if (success) {\n    NSLog(@\"done writing /tmp/cool.txt\");\n} else {\n    NSLog(@\"\
  writing /tmp/cool.txt failed: %@\", [error localizedDescription]);\n}\n}\nreturn\
  \ 0;\n}\n```\n\n编译并运行它。现在修改代码，为 `write` 方法传递一个不存在的文件路径，例如 `@\"/too/darned/bad.txt\"\
  `。你应该会得到一个友好的错误信息。\n\n请注意，在这段代码中声明了一个指向 `NSError` 实例的指针，但你并没有创建或实例化一个 `NSError`\
  \ 对象并赋值给该指针。\n\n为什么呢？你希望在没有错误时避免创建一个不必要的错误对象。如果发生错误，`writeToFile:atomically:encoding:error:`\
  \ 将负责创建一个新的 `NSError` 实例，然后修改你声明的 `error` 指针以使其指向新的错误对象。然后你就可以通过你的 `error` 指针询问该对象发生了什么问题。\n\
  \n这种对 `NSError` 的条件性创建要求你传递 `error` 的引用（`&error`），因为此时还没有对象可以传递。然而，与你在 第 9 章 中传递基础\
  \ C 变量的引用不同，在这里你传递的是一个指针变量的地址。本质上，你传递的是另一个地址的地址（该地址可能会变成一个 `NSError` 对象的地址）。\n\n\
  为了回顾我们在 第 9 章 中关于国际间谍战的类比，你可能会告诉你的间谍：“如果发生任何问题，请写一份完整的报告（体积太大，无法放入钢管中），并把它藏在图书馆的一本书里。我需要知道你把它藏在哪里了，所以请把书的索书号放在钢管里。”也就是说，你正在给间谍一个位置，让她可以在那里存放她创建的错误报告的地址。\n\
  \n以下是 `NSString` 类中 `writeToFile:atomically:encoding:error:` 的声明：\n\n```objc\n-\
  \ (BOOL)writeToFile:(NSString *)path\n         atomically:(BOOL)useAuxiliaryFile\n\
  \             encoding:(NSStringEncoding)enc\n             error:(NSError **)error\n\
  ```\n\n注意这个双星号。当你调用此方法时，你提供的是一个指向 `NSError` 实例的指针的指针。\n\n通过引用传递 `NSError` 的方法总是返回一个指示是否发生错误的值。例如，此方法在发生错误时会返回\
  \ `NO`。在返回结果指示发生错误之前，切不要尝试访问 `NSError`；如果 `NSError` 对象实际上不存在，尝试访问它将导致你的程序崩溃。\n\n\
  ## 使用 NSString 读取文件\n\n将文件读取到字符串非常相似：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, const char * argv[]) {\n    @autoreleasepool {\n        NSError\
  \ *error = nil;\n        NSString *str = [[NSString alloc] initWithContentsOfFile:@\"\
  /etc/resolv.conf\"\n                                                           encoding:NSASCIIStringEncoding\n\
  \                                                           error:&error];\n   \
  \     if (!str) {\n            NSLog(@\"read failed: %@\", [error localizedDescription]);\n\
  \        } else {\n            NSLog(@\"resolv.conf looks like this: %@\", str);\n\
  \        }\n    }\n    return 0;\n}\n```\n\n## 将 NSData 对象写入文件\n\n`NSData` 对象表示字节缓冲区。例如，如果你从一个\
  \ `URL` 获取某些数据，你就会得到一个 `NSData` 实例。你可以请求 `NSData` 将自己写入文件。创建一个名为 `ImageFetch` 的新命令行工具，从网站获取图像并存到\
  \ `NSData` 实例中。然后请求 `NSData` 将它的字节缓冲区写入文件：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  int main (int argc, const char * argv[]) {\n    @autoreleasepool {\n        NSURL\
  \ *url = [NSURL URLWithString:@\"http://www.google.com/images/logos/ps_logo2.png\"\
  ];\n        NSURLRequest *request = [NSURLRequest requestWithURL:url];\n       \
  \ NSError *error = nil;\n        NSData *data = [NSURLConnection sendSynchronousRequest:request\n\
  \                               returningResponse:NULL\n                       \
  \                        error:&error];\n        if (!data) {\n            NSLog(@\"\
  fetch failed: %@\", [error localizedDescription]);\n            return 1;\n    \
  \    }\n        NSLog(@\"The file is %lu bytes\", [data length]);\n        BOOL\
  \ written = [data writeToFile:@\"tmp/google.png\"\n                            \
  \    options:0\n                                error:&error];\n        if (!written)\
  \ {\n            NSLog(@\"write failed: %@\", [error localizedDescription]);\n \
  \           return 1;\n        }\n        NSLog(@\"Success!\");\n    }\n    return\
  \ 0;\n}\n```\n\n编译并运行该程序。在“预览”（Preview）中打开生成的图像。\n\n注意 `writeToFile:options:error:`\
  \ 方法接收一个表示保存过程中使用的选项数字。最常用的选项是 `NSDataWritingAtomic`。假设你已经获取了一张图像，正在用新版本替换它。在写入新图像时，断电了。半写的文件没用的。在半写的文件比没有文件更糟的情况下，你可以让写入变为原子性的。添加此选项：\n\
  \n```objc\nNSLog(@\"The file is %lu bytes\", [data length]);\nBOOL written = [data\
  \ writeToFile:@\"tmp/google.png\"\n                          options:NSDataWritingAtomic\n\
  \                          error:&error];\nif (!written) {\n    NSLog(@\"write failed:\
  \ %@\", [error localizedDescription]);\n    return 1;\n}\n```\n\n现在，数据将写入一个临时文件，并在写入完成后该文件将被重命名。这样，你要么得到完整的文件，要么什么都没有。\n\
  \n## 从文件读取 NSData\n\n你也可以从文件内容创建 `NSData` 实例。为你的程序添加两行代码：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  int main (int argc, const char * argv[]) {\n    @autoreleasepool {\n        NSURL\
  \ *url = [NSURL URLWithString:@\"http://www.google.com/images/logos/ps_logo2.png\"\
  ];\n        NSURLRequest *request = [NSURLRequest requestWithURL:url];\n       \
  \ NSError *error = nil;\n        // 这将阻塞直到获取到数据\n        NSData *data = [NSURLConnection\
  \ sendSynchronousRequest:request\n                               returningResponse:NULL\n\
  \                                               error:&error];\n        if (!data)\
  \ {\n            NSLog(@\"fetch failed: %@\", [error localizedDescription]);\n \
  \           return 1;\n        }\n        NSLog(@\"The file is %lu bytes\", [data\
  \ length]);\n        BOOL written = [data writeToFile:@\"tmp/google.png\"\n    \
  \                          options:NSDataWritingAtomic\n                       \
  \       error:&error];\n        if (!written) {\n            NSLog(@\"write failed:\
  \ %@\", [error localizedDescription]);\n            return 1;\n        }\n     \
  \   NSLog(@\"Success!\");\n        NSData *readData = [NSData dataWithContentsOfFile:@\"\
  tmp/google.png\"];\n        NSLog(@\"The file read from the disk has %lu bytes\"\
  , [readData length]);\n    }\n    return 0;\n}\n```\n\n\n\n\n到目前为止，你的代码一直是老大。它向标准的\
  \ Foundation 对象（如 `NSString` 和 `NSArray` 的实例）发送消息，并告诉它们要做什么。到目前为止，你的程序都在几毫秒内运行并退出。\n\
  \n你一直过着一种甜蜜而简单的生活。在现实世界中，应用程序会运行几个小时，你的对象则是是从用户、时钟、网络等涌入的事件流的奴隶。\n\n在真实的应用程序中，需要一个对象来等待鼠标移动、触摸事件、定时器和网络活动等事件。在\
  \ Mac OS 和 iOS 上，这个对象是 `NSRunLoop` 的实例。运行循环停在那里等待，当某些事情发生时，它会向另一个对象发送消息。\n\n我们说，当某些事情发生时，运行循环会触发一个回调（callback）。对于\
  \ Objective-C 程序员来说，回调有三种表现形式。（由于这些是非常通用的概念，我将使用 `x` 来代表发生的“某个特定事情”。我将在接后的章节中补充细节。）\n\
  \n*   **目标-动作（Target-action）**：在等待开始之前，你说：“当 `x` 发生时，向那个特定对象发送这条特定的消息。”接收消息的对象是目标（target）。消息的选择器（selector）是动作（action）。\n\
  *   **辅助对象（Helper objects）**：在等待开始之前，你说：“这里有一个符合你协议的辅助对象。当事情发生时，向它发送消息。”（关于协议的更多信息，请参见第\
  \ 25 章。）辅助对象通常被称为代理（delegates）或数据源（data sources）。\n*   **通知（Notifications）**：有一个名为通知中心的对象。在等待开始之前，你说通知中心：“这个对象正在等待这类通知。当其中一个通知到达时，向该对象发送这条消息。”当\
  \ `x` 发生时，一个对象向通知中心发布通知，中心再将其转发给你的对象。\n\n在本章中，你将实现所有类型的回调，并学习在什么情况下应该使用哪种。\n\n##\
  \ 目标-动作 (Target-action)\n\n定时器（Timers）使用目标-动作机制。你创建一个带有延迟、目标和动作的定时器。在延迟结束后后，定时器会向其目标发送动作消息。\n\
  \n你将创建一个带有运行循环和定时器的程序。每隔两秒，定时器就会向其目标发送动作消息。你将创建一个类，该类的实例将作为目标。\n\n图 24.1 `Logger`\
  \ 是 `NSTimer` 的目标\n\n![Logger is the target of the NSTimer](img/00063.jpg)\n\n在\
  \ Xcode 中，创建一个新项目：一个名为 `Callbacks` 的 Foundation 命令行工具（Command Line Tool）。为了玩玩，首先只需获取一个运行循环并让它运行起来。编辑\
  \ `main.m`：\n\n```objc\n#import <Foundation/Foundation.h>\n\nint main (int argc,\
  \ const char * argv[])\n{\n  @autoreleasepool {\n    [[NSRunLoop currentRunLoop]\
  \ run];\n  }\n  return 0;\n}\n```\n\n编译并运行程序。注意 `run` 方法永远不会返回。运行循环处于无限循环中，等待某些事情发生。你需要终止程序。（选择\
  \ Product → Stop。）\n\n现在，你将创建一个自定义类来作为定时器的目标。创建一个新文件：一个名为 `Logger` 的派自 `NSObject`\
  \ 的 Objective-C 类。（记得，要进入类模板，选择 File → New → New File....）在 `Logger.h` 中，声明动作方法：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n@interface Logger : NSObject\n- (void)sayOuch:(NSTimer\
  \ *)t;\n@end\n```\n\n注意，动作方法接收一个参数 ——发送动作消息的对象。在这种情况下，它是定时器对象。\n\n在 `Logger.m` 中实现一个简单的\
  \ `sayOuch:` 方法：\n\n```objc\n#import \"Logger.h\"\n@implementation Logger\n- (void)sayOuch:(NSTimer\
  \ *)t\n{\n  NSLog(@\"Ouch!\");\n}\n@end\n```\n\n此时，我们需要简短地转个弯讨论一下选择器（selectors）。记住，当你向一个对象发送消息时，会询问该对象的类是否有一个具有同名的方法。搜索会沿着继承层级向上进行，直到某个类回答“是的，我有同名的方法”为止。\n\
  \n图 24.2 查找具有正确名称的方法\n\n![The search for a method with the right name](img/00064.jpg)\n\
  \n你可以想象，这种搜索必须非常、非常地完成。如果我们使用方法的实际名称（可能很长），方法查找将非常缓慢。为了加快速度，编译器会为它遇到的每个方法名分配一个唯一的数字。在运行时，我们使用该数字而不是方法名。\n\
  \n图 24.3 它的真实工作原理\n\n![How it really works](img/00065.jpg)\n\n这个代表特定方法名称的唯一数字被称为选择器（selector）。要创建一个向我们的\
  \ `Logger` 发送 `sayOuch:` 消息的定时器，你必须要求编译器查找它的选择器。这是通过 `@selector` 指令完成的。在 `main.m`\
  \ 中，创建 `Logger` 的实例并将其设为 `NSTimer` 实例的目标。将动作设置为 `sayOuch:` 的选择器。\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\n#import \"Logger.h\"\nint main (int argc, const char\
  \ * argv[])\n{\n  @autoreleasepool {\n    Logger *logger = [[Logger alloc] init];\n\
  \    NSTimer *timer = [NSTimer scheduledTimerWithInterval:2.0\n                \
  \                     target:logger\n                                   selector:@selector(sayOuch:)\n\
  \                                    userInfo:nil\n                            \
  \         repeats:YES];\n    [[NSRunLoop currentRunLoop] run];\n  }\n  return 0;\n\
  }\n```\n\n编译并运行程序。（你会得到未使用变量的警告。）你应该每两秒在控制台上看到一次 `Ouch!`。注意冒号是选择器的一部分。\n\n再次查看编译警告。它在说：“嘿，你创建了变量\
  \ `timer` 但没有使用它。”在某些情况下，如此处，你需要标记变量为未使用。现在加上它。\n\n```objc\n__unused NSTimer *timer\
  \ = [NSTimer scheduledTimerWithInterval:2.0\n                                  \
  \                          target:logger\n                                     \
  \                      selector:@selector(sayOuch:)\n                          \
  \                                  userInfo:nil\n                              \
  \                               repeats:YES];\n```\n\n再次编译，警告应该消失了。\n\n## 辅助对象\n\
  \n定时器非常简单。它们只只一件事：：触发。因此，目标-动作是一个很好的选择。许多简单的用户界面控件（如按钮和滑块）也使用目标-动作机制。那么更复杂的情况呢？\n\
  \n在第 23 章中，你使用 `NSURLConnection` 方法从服务器获取数据。它运行良好，但该方法有两个问题：\n\n*   它在等待所有数据到达时阻塞主线程。如果你在真实的应用程序中使用此方法，在获取数据期间用户界面将变得无响应。\n\
  *   如果服务器要求用户名和密码，它没有办法进行回调。\n\n由于这些原因，我们通常异步使用 `NSURLConnection`。也就是说，我们启动获取，然后在数据到达、服务器要求凭据或获取失败时等待回调。\n\
  \n你如何获取这些回调？你为 `NSURLConnection` 提供一个辅助对象。当事情发生时，连接向辅助对象发送消息。什么消息？编写 `NSURLConnection`\
  \ 的人编写了一个协议 —— 一个方法方法列表，辅助对象可以实现。这里是该协议中的一些方法：\n\n\n\n\n```objc\n- (NSURLRequest\
  \ *)connection:(NSURLConnection *)c\n             willSendRequest:(NSURLRequest\
  \ *)req\n             redirectResponse:(NSURLResponse *)res;\n\n- (void)connection:(NSURLConnection\
  \ *)sender\n  didReceiveAuthenticationChallenge:(NSAuthenticationChallenge *)ch;\n\
  \n- (void)connection:(NSURLConnection *)sender\n  didReceiveData:(NSData *)data;\n\
  \n- (void)connectionDidFinishLoading:(NSURLConnection *)sender;\n\n- (void)connection:(NSURLConnection\
  \ *)sender didFailWithError:(NSError *)error;\n\n- (NSCachedURLResponse *)connection:(NSURLConnection\
  \ *)sender\n                   willCacheResponse:(NSCachedURLResponse *)cachedResponse;\n\
  ```\n\n如你所见，`NSURLConnection` 的功能比 `NSTimer` 要丰富得多。现在，你将创建一个实现了这些方法部分或全部的对象，然后将该对象作为它的辅助对象引入\
  \ `NSURLConnection`。特别是，`NSURLConnection` 有一个名为 `delegate` 的指针。\n\n图 24.4 Logger\
  \ 是 NSURLConnection 的代理\n\n![Logger 是 NSURLConnection 的代理](img/00066.jpg)\n\n在 `main()`\
  \ 中，创建一个 `NSURLConnection` 并将 `Logger` 实例设为它的代理：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  #import \"Logger.h\"\n\nint main (int argc, const char * argv[])\n{\n  @autoreleasepool\
  \ {\n    Logger *logger = [[Logger alloc] init];\n    NSURL *url = [NSURL URLWithString:\n\
  @\"http://www.gutenberg.org/cache/epub/205/pg205.txt\"];\n    NSURLRequest *request\
  \ = [NSURLRequest requestWithURL:url];\n    __unused NSURLConnection *fetchConn\n\
  \                                    = [[NSURLConnection alloc] initWithRequest:request\n\
  \                                                                        delegate:logger\n\
  \                                                                startImmediately:YES];\n\
  \    __unused NSTimer *timer\n                                    = [NSTimer scheduledTimerWithTimeInterval:2.0\n\
  \                                                                          target:logger\n\
  \                                                                    selector:@selector(sayOuch:)\n\
  \                                                                   userInfo:nil\n\
  \                                                                repeats:YES];\n\
  \    [[NSRLoop currentRunLoop] run];\n  }\n  return 0;\n}\n```\n\n`Logger` 实例需要一个\
  \ `NSMutableData` 实例来存储到达的字节。在 `Logger.h` 中添加一个实例变量：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  @interface Logger : NSObject {\n  NSMutableData *incomingData;\n}\n- (void)sayOuch:(NSTimer\
  \ *)t;\n@end\n```\n\n现在在 `Logger.m` 中实现一些代理方法：\n\n```objc\n#import \"Logger.h\"\n\
  @implementation Logger\n\n- (void)sayOuch:(NSTimer *)t\n{\n  NSLog(@\"Ouch!\");\n\
  }\n// 每当有一块数据到达时调用\n- (void)connection:(NSURLConnection *)connection\n  didReceiveData:(NSData\
  \ *)data\n{\n  NSLog(@\"received %lu\", [data length]);\n  // 如果不存在，则创建一个可变数据对象\n\
  \  if (!incomingData) {\n    incomingData = [[NSMutableData alloc] init];\n  }\n\
  \  [incomingData appendData:data];\n}\n// 当最后块数据处理完毕时调用\n- (void)connectionDidFinishLoading:(NSURLConnection\
  \ *)connection\n{\n  NSLog(@\"Got it!\");\n  NSString *string = [[NSString alloc]\
  \ initWithData:incomingData\n                                           encoding:NSUTFStringEncoding];\n\
  \  incomingData = nil;\n  NSLog(@\"string has %lu characters\", [string length]);\n\
  \  // 取消下一行的注释以查看整个文件\n  // NSLog(@\"The whole string is %@\", string);\n}\n// 如果获取失败调用\n\
  - (void)connection:(NSURLConnection *)connection\n  didFailWithError:(NSError *)error\n\
  {\n  NSLog(@\"connection failed: %@\", error localizedDescription]);\n  incomingData\
  \ = nil;\n}\n@end\n```\n\n注意，你并没有实现协议中的所有方法——只需你关心的那些。构建并运行程序。你应该看到数据以合理的分块从 Web\
  \ 服务器传。最终，代理会收到获取完成的通知。到目前为止，回调的规则如下：向一个对象发送一个回调时，Apple 使用目标-动作（target-action）机制。向一个对象发送一组回调时，Apple\
  \ 使用带有协议的辅助对象。（我们将在下一节中详细讨论协议。）这些辅助对象通常被称为 `delegate`（代理）或 `data source`（数据源）。\n\
  \n如果回调需要发送到多个对象怎么办？\n\n## 通知\n\n当用户在 Mac 上更改时区时，程序中的许多对象可能都想知道更改已经发生。它们每一个都可以注册通知中心（notification\
  \ center）的观察者。当时区更改时，通知 `NSSystemTimeZoneDidChangeNotification` 将发布到中心，中心将将其转发给所有相关的观察者。\n\
  \n在 `main.m` 中，注册 `Logger` 实例以便在区更改时接收通知：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  #import \"Logger.h\"\n\nint main (int argc, const char * argv[])\n{\n  @autoreleasepool\
  \ {\n    Logger *logger = [[Logger alloc] init];\n    [[NSNotificationCenter defaultCenter]\n\
  \                     addObserver:logger\n                        selector:@selector(zoneChange:)\n\
  \                          name:NSSystemTimeZoneDidChangeNotification\n        \
  \                  object:nil];\n    NSURL *url = [NSURL URLWithString:\n@\"http://www.gutenberg.org/cache/epub/205/pg205.txt\"\
  ];\n    NSURLRequest *request = [NSURLRequest requestWithURL:url];\n    __unused\
  \ NSURLConnection *fetchConn\n                                    = [[NSURLConnection\
  \ alloc] initWithRequest:request\n                                             \
  \                           delegate:logger\n                                  \
  \                              startImmediately:YES];\n    __unused NSTimer *timer\n\
  \                                    = [NSTimer scheduledTimerWithTimeInterval:2.0\n\
  \                                                                          target:logger\n\
  \                                                                    selector:@selector(sayOuch:)\n\
  \                                                                   userInfo:nil\n\
  \                                                                repeats:YES];\n\
  \    [[NSRLoop currentRunLoop] run];\n  }\n  return 0;\n}\n```\n\n\n\n\n```objective-c\n\
  [[NSNotificationCenter defaultCenter] removeObserver:self];\n}\n```\n\n* 对象不拥有它们的代理（delegate）或数据源（data\
  \ sources）。如果你创建了一个作为代理或数据源的对象，你的对象应该在它的 `dealloc` 方法中“辞职”：\n\n```objective-c\n\
  - (void)dealloc\n{\n    [windowThatBossesMeAround setDelegate:nil];\n    [tableViewThatBegsForData\
  \ setDataSource:nil];\n}\n```\n\n* 对象不拥有其目标（targets）。如果你创建了一个作为目标的对象，你的对象应该在它的 `dealloc`\
  \ 方法中将目标指针置零：\n\n```objective-c\n- (void)dealloc\n{\n    [buttonThatKeepsSendingMeMessages\
  \ setTarget:nil];\n}\n```\n\n这些问题在当前程序中都不存在，因为你的 `Logger` 对象在程序结束之前不会被释放。（另外，纯属巧合的是，在这个练习中，我使用了两个记录详尽的规则例外：`NSURLConnection`\
  \ 拥有它的代理，而 `NSTimer` 拥有它的目标。）\n\n# 25 协议 (Protocols)\n\n此时，我需要谈论一个稍微抽象的概念。曾有人说过：“记住‘你是谁’和‘你做什么’的区别是非常重要的。”对象也是如此：对象的类与它在工作系统中的角色是不同的。例如，一个对象可以是\
  \ `NSMutableArray` 的实例，但它在应用程序中的角色可能是待运行的打印任务队列。\n\n就像“数组作为打印队列”的例子一样，非常棒的类比它们在任何特定应用程序中可能的角色要通用得多。因此，该类的实例可以用多种不同的方式使用。\n\
  \n我们讨论过如何指定一个类。可以指定一个角色吗？在某种程度上，我们可以使用 `@protocol` 结构来指定一个角色。\n\n例如，在一个 iOS 应用程序中，你经常在\
  \ `UITableView` 实例中显示数据。然而，`UITableView` 对象并不包含它所显示的数据；它必须从另一个源获取数据。你必须告诉它：“这里有一个满足你数据源角色的对象。”\n\
  \n图 25.1 UITableView 数据源\n\n![UITableView datasource](img/00067.jpg)\n\n创建 `UITableView`\
  \ 类的开发者是如何指定 `UITableView` 数据源角色的？他创建了一个协议（protocol）。协议是一个方法声明列表。有些方法是强制要求的（required），有些是可选的（optional）。如果你的对象要履行该角色，它必须实现强制要求的方法，并可以选择实现可选的方法。\n\
  \n`UITableView` 的数据源协议名为 `UITableViewDataSource`，这里是它的定义（注释是我写的）：\n\n```objective-c\n\
  // 就像类一样，协议可以继承其他协议。\n// 此协议继承自 NSObject 协议\n@protocol UITableViewDataSource <NSObject>\n\
  // 任何表视图数据源必须实现以下方法\n@required\n// 表视图有多个节(sections)，每个节可以有若干行(rows)\n- (NSInteger)tableView:(UITableView\
  \ *)tv numberOfRowsInSection:(NSInteger)section;\n// 这个索引路径包含两个整数（一个节和一个行号）\n//\
  \ 表视图的 cell 是用户在该节/行中看到的内容\n- (UITableViewCell *)tableView:(UITableView *)tv\n \
  \     cellForRowAtIndexPath:(NSIndexPath *)ip;\n// 这些方法由表视图数据源实现（也可以不实现）\n@optional\n\
  // 如果数据源没有实现此方法，表视图将只有一个节\n- (NSInteger)numberOfSectionsInTableView:(UITableView\
  \ *)tv;\n// 行可以被删除和移动\n- (BOOL)tableView:(UITableView *)tv canEditRowAtIndexPath:(NSIndexPath\
  \ *)ip;\n- (BOOL)tableView:(UITableView *)tv canMoveRowAtIndexPath:(NSIndexPath\
  \ *)ip;\n- (void)tableView:(UITableView *)tv\n  commitEditingStyle:(UITableViewCellEditingStyle)editingStyle\n\
  \  forRowAtIndexPath:(NSIndexPath *)ip;\n- (void)tableView:(UITableView *)tv\n \
  \ moveRowAtIndexPath:(NSIndexPath *)sourceIndexPath\n        toIndexPath:(NSIndexPath\
  \ *)destinationIndexPath;\n// 为了节省墨水纸，我省略了一些可选方法的声明。\n@end\n```\n\n（与类一样，协议在 Apple\
  \ 的开发者文档中也有参考页面，你可以搜索并浏览它们以查看协议包含的方法。）\n\n当你创建一个类来履行 `UITableView` 数据源的角色时，你需要在头文件中显式地写道：“此类遵循\
  \ `UITableViewDataSource` 协议”。它看起来像这样：\n\n```objective-c\n@interface TerrificViewController\
  \ : UIViewController <UITableViewDataSource>\n...\n@end\n```\n\n也就是说，“`TerrificViewController`\
  \ 是 `UIViewController` 的子类，并遵循 `UITableViewDataSource` 协议。”\n\n如果你的类遵循多个协议，请在角括号内列出它们：\n\
  \n```objective-c\n@interface TerrificViewController : UIViewController\n       <UITableViewDataSource,\
  \ UITableViewDelegate, UITextFieldDelegate>\n```\n\n然后，在 `TerrificController.m`\
  \ 文件中，你需要实现每个协议中的强制要求方法。如果你忘记实现其中一个强制要求的方法，你将收到编译器的严厉警告。\n\n你还将浏览可选方法，并挑选出你想要实现的方法。如果你实现了它们，它们将在适当的时间被自动调用。\n\
  \n最后注一点：在[第 24 章]的 Callbacks 程序中，你将 `Logger` 实例设为了 `NSURLConnection` 对象的代理。但你没有在\
  \ `Logger.h` 中声明 `Logger` 遵循某个协议。在编写本文时，`NSURLConnection` 代理还没有正式的协议。如果这种情况发生了变化，我将不会感到意外。（如果在构建\
  \ Callbacks 时收到了类似“此对象未遵循 NSURLConnectionDelegate 协议”的警告，说明这种情况发生了。）\n\n# 26 属性列表\
  \ (Property Lists)\n\n有时你需要计算机和人类都能读取的文件格式。例如，假设你想在一个文件中保留你的股票组合的描述。当你添加新股票时，如果能够手动编辑该文件将是极好的。但对于你的程序来说，能够读取它可能很有用。面对这个问题，Objective-C\
  \ 程序员使用了属性列表。\n\n属性列表是以下任何内容的组合：\n\n* `NSArray`\n* `NSDictionary`\n* `NSString`\n\
  * `NSData`\n* `NSDate`\n* `NSNumber`（整数、浮点数或布尔值）\n\n例如，字典数组就是一个属性列表（或简称“P-list”）。\n\
  \n读取和将属性列表写入文件非常简单。在 Xcode 中，创建一个名为 `stock` 的命令行工具项目并添加以下代码：\n\n```objective-c\n\
  #import <Foundation/Foundation.h>\n\nint main(int argc, const char * argv[])\n{\n\
  \    @autorepool {\n        NSMutableArray *stocks = [[NSMutableArray alloc] init];\n\
  \        NSMutableDictionary *stock;\n        stock = [NSMutableDictionary dictionary];\n\
  \        [stock setObject:@\"AAPL\" forKey:@\"symbol\"];\n        [stock setObject:[NSNumber\
  \ numberWithInt:200] forKey:@\"shares\"];\n        [stocks addObject:stock];\n \
  \       stock = [NSMutableDictionary dictionary];\n        [stock setObject:@\"\
  GOOG\" forKey:@\"symbol\"];\n        [stock setObject:[NSNumber numberWithInt:160]\
  \ forKey:@\"shares\"];\n        [stocks addObject:stock];\n        [stocks writeToFile:@\"\
  /tmp/stocks.plist\" atomically:YES];\n    }\n    return 0;\n}\n```\n\n（注意我重用了了 `stock`\
  \ 指针。我用它指向第一个字典，然后又指向第二个。）\n\n图 26.1 字典数组\n\n![An array of dictionaries](img/00068.jpg)\n\
  \n当你运行程序时，你会得到一个 `stocks.plist` 文件。如果你用文本编辑器打开它，它看起来像这样：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC\n```\n\n\n\n\n\n```xml\n<!DOCTYPE\
  \ plist PUBLIC \"-////Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
  >\n<plist version=\"1.0\">\n<array>\n    <dict>\n        <key>shares</key>\n   \
  \     <integer>200</integer>\n        <key>symbol</key>\n        <string>AAPL</string>\n\
  \    </dict>\n    <dict>\n        <key>shares</key>\n        <integer>160</integer>\n\
  \        <key>symbol</key>\n        <string>GOOG</string>\n    </dict>\n</array>\n\
  </plist>\n```\n\n不错，对吧？人类可读。XML。一行代码。\n\n如果你发现自己正在手动创建属性列表（property lists），你应该知道\
  \ `Xcode` 有一个专门用于属性列表的内置编辑器。\n\n现在加上读取该文件的代码：\n\n```objc\nint main(int argc, const\
  \ char * argv[])\n{\n    @autoreleasepool {\n        NSMutableArray *stocks = [[NSMutableArray\
  \ alloc] init];\n        NSMutableDictionary *stock;\n        stock = [NSMutableDictionary\
  \ dictionary];\n        [stock setObject:@\"AAPL\"\n                   forKey:@\"\
  symbol\"];\n        [stock setObject:[NSNumber numberWithInt:200]\n            \
  \       forKey:@\"shares\"];\n        [stocks addObject:stock];\n        stock =\
  \ [NSMutableDictionary dictionary];\n        [stock setObject:@\"GOOG\"\n      \
  \             forKey:@\"symbol\"];\n        [stock setObject:[NSNumber numberWithInt:160]\n\
  \                   forKey:@\"shares\"];\n        [stocks addObject:stock];\n  \
  \      [stocks writeToFile:@\"/tmp/stocks.plist\"\n                  atomically:YES];\n\
  \        NSArray *stockList = [NSArray arrayWithContentsOfFile:@\"/tmp/stocks.plist\"\
  ];\n        for (NSDictionary *d in stockList) {\n            NSLog(@\"I have %@\
  \ shares of %@\",\n                  [d objectForKey:@\"shares\"], [d objectForKey:@\"\
  symbol\"]);\n        }\n    }\n    return 0;\n}\n```\n\n编译并运行程序。\n\n## 挑战\n\n编写一个工具创建一个包含所有\
  \ 8 类型的属性列表：数组、字典、字符串、数据、日期、整数、浮点数、布尔值。\n\n# 第四部分\n\n## 事件驱动型应用程序\n\n这就是我们一直追求的目标，也是你阅读这本书的原因——编写\
  \ iOS 和 Cocoa 应用程序。在接下来的章节中，你将体验到应用程序开发。你的应用程序将拥有 GUI（图形用户界面），并且它们是事件驱动的。\n\n在命令行程序中，你执行程序，然后它会运行自己的逻辑直到完成。事件驱动型应用程序则不同。它启动后开始一个运行循环来等待事件。当事件发生时，应用程序会立即行动，执行方法、发送消息等。\n\
  \n首先，你将编写一个 iOS 应用程序，然后是一个类似的 Cocoa 应用程序。Cocoa 是 Apple 编写系列框架，你用它在 Mac 上编写应用程序。你已经熟悉了这些框架之一——`Foundation`。\n\
  \n要编写 iOS 应用，你需要使用另一组名为 `Cocoa Touch` 的框架。Cocoa 和 Cocoa Touch 有一些共同的框架，如 `Foundation`。其他的则特定于某个平台。\n\
  \n# 27\n\n## 你的第一个 iOS 应用程序\n\n在本章中，你将创建一个 iOS 应用程序：一个名为 `iTahDoodle` 的简单待办事项列表应用，它将数据存储在属性列表中。完成后，`iTahDoodle`\
  \ 看起来如下所示。\n\n图 27.1 完整的 iTahDoodle \n\n![Complete iTahDoodle application](img/00069.jpg)\n\
  \n所有的 iOS 应用程序都是事件驱动的应用程序。运行循环等待事件。等待中的应用程序随后会对用户（如点击按钮）或系统（如低内存警告）生成的事件做出响应。\n\n\
  #### 开始使用 iTahDoodle\n\n在 `Xcode` 中，选择 File → New → New Project....。在 iOS 栏目下（而不是\
  \ Mac OS X 栏目），点击 `Application`。在出现的模板选项中，选择 `Empty Application`。\n\n图 27.2 创建一个新的\
  \ iOS 应用程序\n\n![Creating a new iOS Application](img/00070.jpg)\n\n`Xcode` 的项目模板是为了让你的工作更轻松。它们包含了可以加速开发的样板代码。然而，在这里我们特意选择了\
  \ `Empty Application` 模板，这是你可以获得的最接近空白的模板。在此时允许 `Xcode` 生成过多的样板代码会产生干扰。\n\n在 `Xcode`\
  \ 中，选择 File → New → New Project....。在 iOS 栏目下（而不是 Mac OS X 栏目），点击 `Application`。在出现的模板选项中，选择\
  \ `Empty Application`。\n\n`Xcode` 的项目模板是为了让你的工作更轻松。它们包含了可以加速开发的样板代码。然而，在这里我们特意选择了\
  \ `Empty Application` 模板，这是你可以获得的最接近空白的模板。在此时允许 `Xcode` 生成过多的样板代码会产生干扰。\n\n在 `Xcode`\
  \ 中，选择 File → New → New Project....。在 iOS 栏目下（而不是 Mac OS X 栏目），点击 `Application`。在出现的模板选项中，选择\
  \ `Empty Application`。\n\n`Xcode` 的项目模板是为了让你的工作更轻松。它们包含了可以加速开发的样板代码。然而，在这里我们特意选择了\
  \ `Empty Application` 模板，这是你可以获得的最接近空白的模板。在此时允许 `Xcode` 生成过多的样板代码会产生干扰。\n\n（注：原文中存在大量重复段落，译文已按要求去重，仅保留一次。）\n\
  \n\n\n\n从实例变量的声明中看出，`iTahDoodle`应用程序将包含至少四个额外的对象。然而，在处理这些对象之前，你将编写一个 C 函数。在 Objective-C\
  \ 中，我们通常通过方法（methods）而不是函数完成工作。因此，当我们在 Objective-C 应用程序中使用 C 函数时，通常将其称为“辅助”（helper）函数。\n\
  \n`iTahDoodle` 将用户的任务存储为属性列表（property list）——即一个 XML 文件。因此，你需要一种方法在应用程序运行时获取该文件的位置。你将编写一个\
  \ C 函数，以 `NSString` 的形式返回该文件路径。\n\n要向你的应用程序添加辅助函数，你首先需要在 `BNRAppDelegate.h` 中声明它。\n\
  \n```objc\n#import <UIKit/UIKit.h>\n\n// 声明一个辅助函数，我们将用它来获取\n// 磁盘上保存待办事项列表的位置路径\n\
  NSString *docPath(void);\n\n@interface BNRAppDelegate : UIResponder <UIApplicationDelegate>\n\
  {\n    UITableView *taskTable;\n    UITextField *taskField;\n    UIButton *insertButton;\n\
  \    NSMutableArray *tasks;\n}\n\n- (void)addTask:(id)sender;\n@property (strong,\
  \ nonatomic) UIWindow *window;\n@end\n```\n\n注意你在类声明上方声明了 `docPath()`。这是因为尽管 `docPath()`\
  \ 是在 `BNRAppDelegate.h` 文件中定义的，但它并不是 `BNRAppDelegate` 类的一部分。事实上，这个函数可以在 `iTahDoodle`\
  \ 项目中拥有自己的一对文件。然而，由于 `iTahDoodle` 中只有一个这样的辅助函数，为了保持简单，我们将其放在 app delegate 的类文件中。\n\
  \n现在打开 `BNRAppDelegate.m` 并实现你的辅助函数。同样，由于 `docPath()` 并不是类的一部分，请在 `#import` 之后、`@implementation`\
  \ 行之前（即类实现开始的地方）实现它。\n\n```objc\n#import \"BNRAppDelegate.h\"\n\n// 获取存储在磁盘上的待办事项数据的路径辅助函数\n\
  NSString *docPath()\n{\n    NSArray *pathList = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,\
  \ NSUserDomainMask, YES);\n    return [[pathList objectAtIndex:0] stringByAppendingPathComponent:@\"\
  data.td\"];\n}\n\n@implementation\n```\n\n`docPath()` 函数调用了另一个 C 函数 `NSSearchPathForDirectoriesInDomains()`。该函数搜索匹配特定标准的目录并返回这些目录数组。不用担心这些参数是什么；在你编写的几乎所有\
  \ iOS 应用程序中，你将传入完全相同的三个参数，并返回一个恰好包含一个元素的数组。（如果你对它的工作原理感兴趣，你可以在开发者文档的“基础函数参考”（Foundation\
  \ Functions Reference）中找到 `NSSearchPathForDirectoriesInDomains()`。）\n\n## iTahDoodle\
  \ 中的对象\n\n现在我们可以回到对象上了。你已经了解构成 `iTahDoodle` 应用程序的五个对象。这里有一个 `BNRAppDelegate` 实例，该对象指向其他四个对象的指针：`UITableView`、`UITextField`、`UIButton`\
  \ 和 `NSMutableArray` 的实例。\n\n图 27.4 iTahDoodle 的对象图\n\n![iTahDoodle 的对象图](img/00072.jpg)\n\
  \n在我们继续配置和连接这些对象之前，让我们先来了解一些关于对象及其之间关系的理论知识。\n\n## 模型-视图-控制器 (Model-View-Controller)\n\
  \n模型-视图-控制器，或 MVC，是一种设计模式，其核心思想是：你创建的任何类都应该属于三个工作类别之一：模型、视图或控制器。以下是分工的详解：\n\n* \
  \  **模型（Models）** 负责存储数据并让其他对象可以使用。模型不了解用户界面，也不了解如何在屏幕上绘制自己；它们的唯一目的是持有和管理数据。`NSString`、`NSDate`\
  \ 和 `NSArray` 都是传统的模型对象。在 `iTahDoodle` 中，到目前为止你的唯一模型对象是存储任务的 `NSMutableArray`。然而，每个单独的任务将由\
  \ `NSString` 实例来描述，这些也是模型对象。\n*   **视图（Views）** 是应用程序的视觉元素。视图知道如何在屏幕上绘制自己以及如何响应用户输入。视图不知道它们所显示的实际数据，也不知道数据是如何结构和存储的。`UIView`\
  \ 及其各种子类（包括 `UIWindow`）是视图对象的示例。在 `iTahDoodle` 中，你的视图对象是 `UITableView`、`UITextView`\
  \ 和 `UIButton` 的实例。一个简单的规则是：如果你能看到它，它就是视图。\n*   **控制器（Controllers）** 执行连接和驱动应用程序不同部分所需的逻辑逻辑。它们处理事件并协调应用程序中的其他对象。控制器是任何应用程序的主力军。虽然\
  \ `BNRAppDelegate` 是 `iTahDoodle` 中唯一的控制器，但复杂的应用程序将有许多控制器来协调模型和视图对象。图 27.5 显示了响应用户事件（如点击按钮）时对象之间的控制流。注意，模型和视图之间互不通信；控制器稳稳地坐在中间，接收来自某些对象的消息并分发给其他对象。\n\
  \n不要低估 MVC 模式所代表的职责分工至关重要。大多数 Cocoa 和 Touch API 都是用 MVC 编写的，你自己的代码也应该是。现在，让我们回到我们的控制器——`BNRAppDelegate`\
  \ 实例。\n\n## 应用程序代理 (The application delegate)\n\n当 iOS 应用程序首次启动时，会有大量的后台设置工作。在这个阶段，会创建一个\
  \ `UIApplication` 实例来控制应用程序的状态并作为与操作系统的桥梁。`BNRAppDelegate` 的实例也会被创建并设置为 `UIApplication`\
  \ 实例的 `delegate`（这解释了“app delegate”名称的由来）。\n\n在应用程序启动期间，它尚未准备好处理工作或输入。当这种情况发生变化时，`UIApplication`\
  \ 实例会向代理发送 `application:didFinishLaunching:` 消息。这个方法非常重要。你需要将所有在用户交互应用程序之前需要发生或到位的操作放在这里。\n\
  \n在 `iTahDoodle` 中，我们在该方法要做之一是找到属性列表并将其加载到数组中。在 `BNRAppDelegate.m` 中，已经有一个 `application:didFinishLaunching:`\
  \ 方法的存根。找到它并将括号之间的代码替换为以下内容：\n\n```objc\n#pragma mark - Application delegate callbacks\n\
  \n- (BOOL)application:(UIApplication *)application\ndidFinishLaunchingWithOptions:(NSDictionary\
  \ *)launchOptions\n{\n    // 尝试从存储在磁盘上的数组加载现有的待办事项数据集。\n    NSArray *plist = [NSArray\
  \ arrayWithContentsOfFile:docPath()];\n    if (plist) {\n        // 如果可用数据集，将其拷贝到我们的实例变量。\n\
  \        tasks = [plist mutableCopy];\n    } else {\n        // 否则，创建一个空的来开始。\n\
  \        tasks = [[NSMutableArray alloc] init];\n    }\n    return YES;\n}\n```\n\
  \n\n\n\n\n你是否对代码开头的 `#pragma mark` 感到好奇？Objective-C 程序员经常使用此构造在类内部对方法进行分组。`Xcode`\
  \ 也能识别它。在编辑器顶部的导航栏上，找到 `BNRAppDelegate.m` 右侧的项。（目前，该项可能显示为 `@implementation AppDelegate`，这取决于你的光标在代码中的位置。）点击此项，`Xcode`\
  \ 将向你显示该文件中的位置列表。你可以点击列表中的任何位置以跳转到代码的对应位置。注意，你新添加的 `pragma mark` 会出现在此列表中。当一个类中有很多很多方法时，这非常有用。\n\
  \n## 设置视图\n\n在应用程序准备就绪之前，我们还需要需要做的另一件事是设置我们的视图对象。这包括创建它们、配置它们以及将它们放置在屏幕上。听起来很有道理，对吧？用户无法点击不存在或不在屏幕上的按钮。\n\
  \n在 `iTahDoodle` 中，你将在 `application:didFinishLaunchingWithOptions:` 中通过编程的方式来设置视图。还有一种用于设置视图的可视化“拖放”工具，我们将在下一章中使用它。\n\
  \n我应该提醒你，这里是代码开始变得密集的地方。在屏幕上创建和显示视图的详细语法是专门关于 iOS 应用程序编程书籍的主题。在输入代码时，尝试理解其发生的大致过程。你创建每个对象，然后通过设置它的某些属性来配置它。接下来，将配置好的视图对象作为窗口对象的子视图添加进去，最后，将窗口放置在屏幕上。\n\
  \n```objc\n#pragma mark - Application delegate callbacks\n\n- (BOOL)application:(UIApplication\
  \ *)application\ndidFinishLaunchingWithOptions:(NSDictionary *)launchOptions\n{\n\
  \     // 尝试从存储在磁盘的数组加载现有的待事项数据集。\n     NSArray *plist = [NSArray arrayWithContentsOfFile:docPath()];\n\
  \     if (plist) {\n         // 如果可用，将其拷贝到我们的实例变量中。\n         tasks = [plist mutableCopy];\n\
  \     } else {\n         // 否则，仅创建一个空的以便我们开始。\n         tasks = [[NSMutableArray\
  \ alloc] init];\n     }\n     // 创建并配置 UIWindow 实例\n     // CGRect 是一个包含起点 (x,y)\
  \ 和大小 (width,height) 的结构体\n     CGRect windowFrame = [[UIScreen mainScreen] bounds];\n\
  \     UIWindow *theWindow = [[UIWindow alloc] initWithFrame:windowFrame];\n    \
  \ [self setWindow:theWindow];\n     // 定义三个 UI 元素的矩形框\n     // CGRectMake() 从 (x,\
  \ y, width, height) 创建一个 CGRect\n     CGRect tableFrame = CGRectMake(0, 80, 320,\
  \ 380);\n     CGRect fieldFrame = CGRectMake(20, 40, 200, 31);\n     CGRect buttonFrame\
  \ = CGRectMake(228, 40, 72, 31);\n     // 创建并配置表格视图\n     taskTable = [[UITableView\
  \ alloc] initWithFrame:tableFrame\n                                            \
  \ style:UITableViewStylePlain];\n     [taskTable setSeparatorStyle:UITableViewCellSeparatorStyleNone];\n\
  \     // 创建并配置用于输入新任务的文本字段\n     taskField = [[UITextField alloc] initWithFrame:fieldFrame];\n\
  \     [taskField setBorderStyle:UITextBorderStyleRoundedRect];\n     [taskField\
  \ setPlaceholder:@\"Type a task, tap Insert\"];\n     // 创建并配置圆矩形 Insert 按钮\n  \
  \   insertButton = [UIButton buttonWithType:UIButtonTypeRoundedRect];\n     [insertButton\
  \ setFrame:buttonFrame];\n     // 按钮使用目标/动作回调进行工作\n     // 配置 Insert 按钮的动作以调用此对象的\
  \ -addTask: 方法\n     [insertButton addTarget:self\n                       action:@selector(addTask:)\n\
  \             forControlEvents:UIControlTouchUpInside];\n     // 给按钮设置标题\n     [insertButton\
  \ setTitle:@\"Insert\"\n                forState:UIControlState];\n     // 将我们的\
  \ UI 元素添加到窗口\n     [self window] addSubview:taskTable];\n     [self window] addSubview:taskField];\n\
  \     [self window] addSubview:insertButton];\n     // 完成窗口并将其显示在屏幕上\n     [self\
  \ window] setBackgroundColor:[UIColor whiteColor]];\n     [self window] makeKeyAndVisible;\n\
  \     return YES;\n}\n```\n\n### 在模拟器上运行\n\n现在你已经设置好了视图，我们可以编译应用程序来查看它们的外观。在 `Xcode`\
  \ 中，找到 Run 按钮附近的 `Scheme` 下拉菜单。选择 `iPhone 5` 作为最新版本的 iOS 模拟器：\n\n图 27.6 Scheme 选择器\n\
  \n编译并运行应用程序。你会收到来自编译器的警告，说你还没有实现 `addTask:`。暂时忽略它；稍后你会实现 `addTask:`。\n\n模拟器允许你在桌面上运行\
  \ Cocoa Touch 应用程序。这是一种查看你的程序在设备上运行时应该什么样以及如何运行的快速方便的方法。你可以看到在 `application:didFinishLaunching:`\
  \ 中设置并布局的视图，但它们现在还不能做任何事情。事实上，点击 Insert 按钮会导致应用程序崩溃，因为按钮的动作方法 `addTask:` 尚未实现。（这就是编译器警告你的原因之一。）\n\
  \n图 27.7 iTahDoodle 对象图\n\n## 连接表格视图\n\n你在屏幕上有了一个表格视图，但它完全不知道应该显示什么。作为一个视图对象，表格视图本身不包含任何实际数据。它需要一个对象作为其数据源。在\
  \ `iTahDoodle` 中，表格视图的数据源将是 `BNRAppDelegate` 实例。\n\n在 `BNRAppDelegate.m` 中，更新 `application:didFinishLaunchingWithOptions:`\
  \ 向表格视图发送消息，使 `BNRAppDelegate` 成为其数据源：\n\n```objc\n// 创建并配置表格视图\ntaskTable = [[UITableView\
  \ alloc] initWithFrame:tableFrame\n                                            \
  \ style:UITableViewStylePlain];\n[taskTable setSeparatorStyle:UITableViewCellSeparatorStyleNone];\n\
  // 将此对象设置为数据源\n[taskTable setDataSource:self];\n// 创建并配置用于输入新任务的文本字段\ntaskField\
  \ = [[UITextField alloc] initWithFrame:fieldFrame];\n```\n\n为了让表格视图的数据源工作，它必须实现\
  \ `UITableViewDataSource` 协议中的方法。首先，更新 `BNRAppDelegate.h` 以声明 `BNRAppDelegate` 遵循该协议：\n\
  \n```objc\n@interface BNRAppDelegate : UIResponder\n<UIApplicationDelegate, UITableViewDataSource>\n\
  {\n    UITableView *taskTable;\n    UITextField *taskField;\n    UIButton *insertButton;\n\
  \    NSMutableArray *tasks;\n}\n- (void)addTask:(id)sender;\n```\n\n`UITableViewDataSource`\
  \ 协议有两个 `BNRAppDelegate` 现在必须实现的方法。至少，表格视图的数据源必须准备好告诉表格视图给定分区中有多少行，以及给定行中的单元格应该是什么样的。\n\
  \n相应实现回调：\n\n```objc\n#pragma mark - 表格视图管理\n\n- (NSInteger)tableView:(UITableView\
  \ *)tableView\nnumberOfRowsInSection:(NSInteger)section\n{\n   // 因为此表格视图只有一个分区，\n\
  \   // 它的行数等于我们 tasks 数组中的项数\n   return [tasks count];\n}\n\n- (UITableViewCell\
  \ *)tableView:(UITableView *)tableView\n       cellForRowAtIndexPath:(NSIndexPath\
  \ *)indexPath\n{\n   // 为了提高性能，我们会重新配置内存中已滑出屏幕的单元格\n   // 并带有新内容交回，而不是总是创建新单元格。\n\
  \   // 首先，我们检查是否有可供复用的单元格。\n```\n\n\n\n\n```objc\nUITableViewCell *c = [taskTable\
  \ dequeueReusableCellWithIdentifier:@\"Cell\"];\n\nif (!c) {\n    // ...并且在没有可用单元格时才分配一个新的\n\
  \    c = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault\n  \
  \                                  reuseIdentifier:@\"Cell\"];\n}\n// 然后我们根据模型对象（重）配置单元格，\n\
  // 在此例中我们的 todoItems 数组\nNSString *item = [tasks objectAtIndex:[indexPath row]];\n\
  [[c textLabel] setText:item];\n//并将配置好的单元格返回给表视图\nreturn c;\n}\n```\n\n要测试该应用程序，请直接在\
  \ `application:didFinishLaunchingWithOptions:` 顶部的数组中添加一些数据。\n\n```objc\n- (BOOL)application:(UIApplication\
  \ *)application\ndidFinishLaunchingWithOptions:(NSDictionary *)launchOptions\n{\n\
  \    // 尝试从存储在磁盘的数组加载现有的待办事项数据集。\n    NSArray *plist = [NSArray arrayWithContentsOfFile:docPath()];\n\
  \    if (plist) {\n        // 如果可用数据集，则将其拷贝到我们的实例变量中。\n        tasks = [plist mutableCopy];\n\
  \    } else {\n        // 否则，创建一个空数组开始。\n        tasks = [[NSMutableArray alloc]\
  \ init];\n    }\n    // tasks 是否为空？\n    if ([tasks count] == 0) {\n        // 在其中放入一些字符串\n\
  \        [tasks addObject:@\"Walk the dogs\"];\n        [tasks addObject:@\"Feed\
  \ the hogs\"];\n        [tasks addObject:@\"Chop the logs\"];\n    }\n    // 创建并配置\
  \ UIWindow 实例\n    CGRect windowFrame = [[UIScreen mainScreen] bounds];\n    UIWindow\
  \ *theWindow = [[UIWindow alloc] initWithFrame:windowFrame];\n    [self setWindow:theWindow];\n\
  \    ...\n}\n```\n\n图 27.8 iTahDoodle 的完整对象图\n\n![iTahDoodle 的完整对象图](img/00076.jpg)\n\
  \n编译并运行应用程序。表视图应该显示你的测试数据。尽管如此，你仍然无法添加新任务。再次冲锋！\n\n## 添加新任务\n\n当你在 `application:didFinishLaunchingWithOptions:`\
  \ 中创建 `UIButton` 实例时，你为它提供了一个目标/动作对：\n\n```objc\n[insertButton addTarget:self\n\
  \                 action:@selector(addTask:)\n             forControlEvents:UIControlEventTouchUpInside];\n\
  ```\n\n目标是 `self`，动作是 `addTask:`。因此，插入按钮向 `BNRAppDelegate` 发送 `addTask:` 消息。因此，我们需要在\
  \ `BNRAppDelegate.m` 中实现 `addTask:` 方法。\n\n```objc\n- (void)addTask:(id)sender\n\
  {\n    // 获取待办事项\n    NSString *t = [taskField text];\n    // 如果 taskField 为空，则在此退出\n\
  \    if ([t isEqualToString:@\"\"]) {\n        return;\n    }\n    // 将其添加到我们的工作数组\n\
  \    [tasks addObject:t];\n    // 刷新表视图以便新项目显示\n    [taskTable reloadData];\n  \
  \  // 并清空文本字段\n    [taskField setText:@\"\"];\n    // 隐藏键盘\n    [taskField resignFirstResponder];\n\
  }\n```\n\n什么是 `UITableViewCell`？它是一个代表 `UITableView` 中单行的视图。什么是 `UITableView`？它是一个显示数据列表的视图。什么是\
  \ `dataSource`？它是为 `UITableView` 提供数据的对象。什么是 `delegate`？它是处理来自 `UITableView` 事件的对象。什么是\
  \ `dequeueReusableCellWithIdentifier:`？它是一个用于重用已滑出屏幕的单元格的方法。什么是 `identifier`？它是一个用于标识单元格类型的字符串。什么是\
  \ `textLabel`？它是一个在 `UITableViewCell` 中显示文本的标签。什么是 `setText:`？它是一个用于设置 `UILabel`\
  \ 文本的方法。什么是 `indexPath`？它是一个表示项目在 `UITableView` 中位置的对象。什么是 `row`？它是一个返回行索引的属性。什么是\
  \ `tasks` ？它是一个包含待办事项的数组。\n\n\n\n\n打开 `BNRDocument.h` 并添加一个方法和两个实例变量：`todoItems`\
  \ 将是一个可变的字符串数组，而 `itemTableView` 将是一个指向 `NSTableView` 对象的指针，该对象将显示 `todoItems` 中的字符串。此外，声明\
  \ `BNRDocument` 遵循 `NSTableViewDataSource` 协议。\n\n```\n#import <Cocoa/Cocoa.h>\n\
  \n@interface BNRDocument : NSDocument <NSTableViewDataSource>\n\n{\n   NSMutableArray\
  \ *todoItems;\n  IBOutletIBOutlet NSTableView *itemTableView;\n}\n\n- (IBAction)createNewItem:(id)sender;\n\
  \n@end\n```\n\n注意，没有为“插入”（Insert）按钮设置实例变量。但是，该按钮有一个动作——`createNewItem:` 方法。\n\n\
  在上一章中，按钮动作的目标是应用程序代理类的实例 `BNRAppDelegate`。基于文档的应用程序没有应用程序代理对象，相反，它是围绕 `NSDocument`\
  \ 的子类构建的。对于 TahDoodle 来说，该类就是 `BNRDocument`。\n\n在基于文档的应用程序中，用户可以同时打开多个文档对象的实例。因此，当\
  \ TahDoodle 运行时，你可以有多个 `BNRDocument` 实例（多个待办事项列表）。每个实例将有自己的表格视图、按钮、任务数组和窗口。每个实例将独立于其他实例来响应消息，并且每个实例都将是自己的按钮的目标。\n\
  \n在你输入的声明中，还有两个新术语：`IBOutlet` 和 `IBAction`。这些告诉 Xcode：“这是一个指针（`IBOutlet`）或动作方法（`IBAction`），开发者将使用\
  \ Interface Builder（接口生成器）来连接它们，而不是通过代码连接。”\n\n## 预览 Interface Builder\n\n在项目导航器中，找到并选择一个名为\
  \ `BNRDocument.xib` 的文件。当你从项目导航器中选择以 `.xib`（XML Interface 生成器文档）结尾的文件时，Interface\
  \ Builder 会出现在编辑器窗格中，显示一个布局网格。\n\n现在，布局网格上只有一个视图对象——一个窗口对象。它是 `NSWindow` 的实例，稍后我们将向它添加其他视图对象。\n\
  \n现在，在 Xcode 窗口的右上角，点击右侧的“View”（视图）按钮以显示“Utilities”（工具箱）。在 Utilities 的顶部，点击 ![A\
  \ look at Interface Builder](img/00079.jpg) 按钮显示检查器。\n\n检查器被细分为不同的检查器。在本章中，你将使用属性（attributes）、尺寸（size）和连接（connections）检查器。\n\
  \n图 28.3 属性、尺寸和连接检查器\n\n![Attributes, size, and connections inspectors](img/00080.jpg)\n\
  \n在 Utilities 窗格的底部，检查器下方是库（library），它也被分为多个标签页。选择 ![Attributes, size, and connections\
  \ inspectors](img/00081.jpg) 按钮显示对象库。此库列出了 Interface Builder 识别的所有不同对象类型列表，你可以在这里获取界面元素，并将它们拖放到窗口对象上。\n\
  \n库的底部是一个搜索字段。输入 `table` 来过滤对象列表。第一项 `Table View`（表格视图）代表 `NSTableView` 类的实例。你可以点击它来查看详情。\n\
  \n## 编辑 BNRDocument.xib\n\n从对象库中拖一个 `NSTableView` 实例到窗口对象上。调整表格的大小以填充窗口的大部分，但在底部为按钮留出空间。\n\
  \n图 28.4 添加一个 NSTableView\n\n![Adding an NSTableView](img/00082.jpg)\n\n注意，当对象的边缘靠近窗口或其他对象的边缘时，它们会自动对齐到指南线（guides）。这些指南线根据\
  \ Apple 的《人机交互指南》（HIG）对齐视图对象。这些是任何开发者在为 Mac 设计用户界面时应该遵循的规则。iPhone 和 iPad 也有相应的 HIG。你可以在开发者文档中找到所有的\
  \ HIG。\n\n现在，你将在属性检查器中设置表格视图的一些属性。通常情况下，你点击布局网格上的一个对象，检查器就会切换上下文向你显示该对象的属性。获取 `NSTableView`\
  \ 实例的属性要棘手一些。你拖到窗口上的表格视图对象实际上是一个嵌套对象的集合：一个 `NSScrollView`、一个 `NSTableView` 以及一个或多个\
  \ `NSTableColumn` 实例。要获取此集合中的特定对象，请在按住 Control 和 Shift 键的同时点击表格视图。你将看到光标下的对象列表，从那里你可以选择你真正感兴趣的对象。选择\
  \ `NSTableView`。\n\n图 28.5 从堆栈中选择视图\n\n![Selecting a view from a stack](img/00083.jpg)\n\
  \n在属性检查器中，将表格视图设置为一列。然后，回到编辑器，选择表格视图的头部，并将单独的一列调整大小以充满整个表格视图的宽度。\n\n图 28.6 调整列宽\n\
  \n![Resizing columns](img/00084.jpg)\n\n你已经很好地调整了视图的大小，但当用户调整应用程序窗口大会发生什么？你可以让表格视图随窗口缩放。实际上，你将让包含表格视图的滚动视图随窗口缩放。在表格视图上\
  \ Control-Shift-点击，并从列表中选择 `NSScrollView`。在检查器窗格的顶部，点击 ![Resizing columns](img/00085.jpg)\
  \ 按钮显示尺寸检查器。找到名为“Autizing”（自动布局）部分。\n\nAutizing 部分包含自动布局掩——它让你配置所选视图在其父视图缩放时如何反应。视图像类一样存在层级结构中。`NSScrollView`\
  \ 的父视图是 `NSWindow` 的实例。\n\n开启一个 ![Resizing columns](img/00085.jpg) 弹簧（spring）允许所选视图在其父视图扩展时沿指定方向扩展。开启一个支撑（strut）会将所选视图固定在其父视图的指定边缘上。幸运的是，自动布局掩码旁边有一个方便的动画，可以让你预览弹簧和支撑组合对所选视图产生的影响。\n\
  \n在自动布局掩码中设置四个支撑和两个弹簧。这将滚动视图的四边固定在窗口相应的边缘，并允许滚动视图（以及表格视图）在水平和垂直方向扩展。\n\n图 28.7 设置自动布局掩码\n\
  \n![Setting the autosizing mask](img/00086.jpg)\n\n现在离开表格转向按钮。回到对象库。找到并拖一个 `NSButton`\
  \ 实例到窗口对象上。你可以选择库列出的任何按钮样式；圆角按钮（Rounded Rect Button）是经典的。一旦将按钮拖到窗口上，你可以双击按钮文本并输入来更改标签。将其设置为“Insert”（插入）按钮。\n\
  \n最后，在尺寸检查器中，使用自动布局掩码将按钮固定在窗口的左下角并保持当前大小。\n\n图 28.8 插入按钮的自动布局掩码\n\n![Autosize mask\
  \ for Insert button](img/00087.jpg)\n\n所以你已经创建了 TahDoodle 需要的两个视图对象：一个 `NSTableView`\
  \ 和一个 `NSButton`。你还配置了这些对象。你设置了表格的列数并设置了按钮标题。你还确保了它们在窗口缩放时能够相应调整大小和位置。\n\n图 28.9\
  \ 已配置的 BNRDocument.xib\n\n![BNRDocument.xib with views configured](img/00088.jpg)\n\
  \n当你双击 `NSButton` 并输入标题时，你所做的与上一章中添加这行代码的操作是相同的：\n\n```\n   [insertButton setTitle:@\"\
  Insert\"]\n```\n\n\n\n\n\n```objectivec\nforState:UIControlStateNormal];\n```\n\n\
  那么，你什么时候该使用 Interface Builder，什么时候该通过代码设置视图呢？在简单的情况下，两种方法都可行。我们本可以使用 XIB 来构建 iTahDoodle\
  \ 的界面。但总的来说，用户界面越复杂，使用 Interface Builder 就越有意义。\n\n（现在你对 Xcode 有了更多了解，请看看书末尾的抽出的卡片。这张卡片包含了在\
  \ Xcode 之间进行导航的键盘快捷键。它们有很多呢！当你继续学习 Xcode 时，请使用这张卡片寻找可以节省你时间和点击次数的快捷键。）\n\n## 创建连接\n\
  \n创建和配置视图并不是你在 Interface Builder 中能做的所有事情。你还可以将这些视图对象连接（或“接线”）到你的应用程序代码中。特别是，你可以设置目标-动作对（target-action\
  \ pairs）并分配指针。\n\n布局网格左侧是“占位符”（placeholders）和对象的列表。这被称为文档大纲（document outline）。（如果你只看到一堆没有标签的图标，点击\
  \ `![建立连接](img/00089.jpg)` 按钮显示展开后的列表。）\n\n图 28.10 最小化和展开的文档大纲\n\n![最小化和展开的文档大纲](img/00090.jpg)\n\
  \n在文档大纲的占位符部分下找到 `File's Owner`。占位符代表一个特定的对象，该对象在运行时才能指定。`File's Owner` 代表将加载此 XIB\
  \ 作为其用户界面的任何对象。在你的情况下，`File's Owner` 代表 `BNRDocument` 的实例。\n\n现在选择编辑器中的 `Insert`\
  \ 按钮，并按 Control 键拖动到 `File's Owner`。\n\n图 28.11 建立连接\n\n![建立连接](img/00091.jpg)\n\
  \n当你释放鼠标按钮时，会弹出一个小窗口，显示你可以建立的可用连接。选择 `createNewItem:` 作为按钮触发的动作。\n\n图 28.12 选择动作\n\
  \n![选择动作](img/00092.jpg)\n\n你现在已经配置好了目标-动作对。这等同于 iTahDoodle 中的以下代码。\n\n```objectivec\n\
  [insertButton addTarget:self\n                 action:@selector(addTask:)\n   forControlEvents:UIControlEventTouchUpInside];\n\
  ```\n\n接下来，连接 `BNRDocument` 的 `itemTableView` 输出口。从 `File's Owner`（代表 `BNRDocument`）按\
  \ Control 键拖动到 `NSTableView` 并释放。为此出口选择唯一的选项：`itemTableView`。\n\n图 28.13 建立更多连接\n\
  \n![建立更多连接](img/00093.jpg)\n\n最后，在表格视图上 Control-Shift-点击，并从列表中选择 `NSTableView`。然后从表格视图\
  \ Control 键拖动到 `File's Owner`，并在连接中选择 `dataSource`。\n\n图 28.14 连接表格视图的数据源\n\n![连接表格视图的数据源](img/0094.jpg)\n\
  \n所以，你到底做了什么？你分配了指针。`BNRDocument` 类声明了一个指向 `NSTableView` 的指针。你指示 Interface Builder，你希望这个指针指向你拖入窗口的特定\
  \ `NSTableView` 实例。同样，表格视图也有自己的几个指针，比如 `dataSource`。你指示 Interface Builder 将表格视图的\
  \ `dataSource` 指针指向 `BNRDocument`。这等同于你在 iTahDoodle 中通过代码设置表格视图的数据源：\n\n```objectivec\n\
  [taskTable setDataSource:self];\n```\n\n当你输入 `IBOutlet` 和 `IBAction` 关键字时，你是在为 Interface\
  \ Builder 标记这些输出（outlets）和动作（actions），告诉它：“嘿！当我尝试连接指针时，请确保把它放进列表里！”当你编写代码时，Interface\
  \ Builder 会扫描 `IBOutlet` 和 `IBAction` 关键字，以便它知道你可能想要建立哪些连接。\n\n以下是实际定义：\n\n```\n\
  #define Action void\n#define IBOutlet\n```\n\n从 `#define` 中知道，`IBAction` 在编译器看到它之前会被替换为\
  \ `void`，而 `IBOutlet` 会消失。因此，在编译时，所有的 `IBOutlet` 关键字都会被移除（留下的输出）。`IBAction` 关键字被替换为\
  \ `void`，因为用户界面的动作预计不会有返回值。\n\n注意，你不需要像创建界面时那样分配基于 XIB 的用户界面元素。它们在 XIB 加载时会自动分配内存。\n\
  \n最后，记住按钮没有指针。这是因为一个对象需要它需要发送消息的对象的实例变量。按钮需要向 `BNRDocument` 发送消息，这就是为什么我们连接了它的动作。然而，`BNRDocument`\
  \ 不需要向按钮发送消息，所以它不需要指向按钮的指针。\n\n## 回顾 MVC\n\n现在你已经布局了用户界面，让我们来看这个项目的对象图：\n\n图 28.15\
  \ TahDoodle 的对象图\n\n![TahDoodle 的对象图](img/095.jpg)\n\n`NSDocument` 是 `BNRDocument`\
  \ 继承的父类，是一个有趣的家伙。初看之下，它似乎像是一个模型对象。但如果你查询 `NSDocument` 的类引用，你会发现它更像是一个控制器而不是其他任何。`NSDocument`\
  \ 协调各种与磁盘相关的活动，并直接连接到负责输入的视图。当你创建 `NSDocument` 子类 `BNRDocument` 时，你添加了指向真实对象的指针（一个\
  \ `NSMutableArray`）。\n\n## 编辑 BNRDocument.m\n\n现在你已经创建、配置并连接了应用程序的用户界面，是时候回到代码编写了。点击项目导航中的\
  \ `BNRDocument.m` 重新打开它，并实现 `createNewItem:`。\n\n```objectivec\n#import \"BNRDocument.h\"\
  \n\n@implementation BNRDocument\n\n#pragma mark - NSDocument Overrides\n- (NSString\
  \ *)windowNibName\n{\n  return @\"BNRDocument\";\n}\n\n#pragma mark - Actions\n\
  - (IBAction)createNewItem:(id)sender\n{\n  // 如果还没有数组，创建一个来存储新任务\n  if (!todoItems)\
  \ {\n      todoItems = [NSMutableArray array];\n  }\n  [todoItems addObject:@\"\
  New Item\"];\n  // -reloadData 告诉表格视图刷新并询问其数据源\n  // （在本例中就是这个 BNRDocument 对象）要显示的数据\n\
  \  [itemTableView reloadData];\n  // -updateChangeCount: 告诉应用程序是否有未保存的更改。NSChangeDone\
  \ 标记为已保存\n  [self updateChangeCount:NSChangeDone];\n}\n\n现在实现表格视图数据源方法（由 `NSTableViewDataSource`\
  \ 协议定义）：\n\n#pragma mark Data Source Methods\n- (NSInteger)numberOfRowsInTableView:(NSTableView\
  \ *)tv\n{\n  // 此表格视图用于显示 todoItems，\n  // 所以表格视图中的条目数量将与数组中的对象数量相同。\n  return [todoItems\
  \ count];\n}\n\n- (id)tableView:(NSTableView *)tableView\n      objectValueForTableColumn:(NSTableColumn\
  \ *)tableColumn\n                        row:(NSInteger)row\n{\n  // 从 todoItems\
  \ 中返回与表格视图想要显示的单元格对应的项\n  return [todoItems objectAtIndex:row];\n}\n\n- (void)tableView:(NSTableView\
  \ *)tableView\n      setObjectValue:(id)object\n      forTableColumn:(NSTableColumn\
  \ *)tableColumn\n                   row:(NSInteger)row\n{\n  // 当用户在表格视图上更改待办事项时，\n\
  \  // 更新 todoItems 数组\n  [todoItems replaceObjectAtIndex:row withObject:object];\n\
  \  // 然后标记文档为有未保存的更改。\n  [self updateChangeCount:NSChangeDone];\n}\n\n@end\n```\n\
  \n\n\n\n\n编译并运行程序。`TahDoodle` 将显示在屏幕上，你可以在其上添加和更改待办事项。然而，目前缺失的一个重大功能是无法保存和重新打开待办列表。为了实现这一功能，你需要重写继承自\
  \ `BNRDocument` 超类 `NSDocument` 的以下方法：\n\n```objectivec\n- (NSData *)dataOfType:(NSString\
  \ *)typeName\n                  error:(NSError **)outError\n{\n  // 当文档正在保存时，会调用此方法\n\
  \  // 我们预期向调用者交付一个封装了我们数据的 NSData 对象\n  // 这样就可以将其写入磁盘\n  // 如果数组为空，我们现在写入一个空数组\n\
  \  if (!todoItems) {\n      todoItems = [NSMutableArray array];\n  }\n  // 将 todoItems\
  \ 数组打包成 NSData 对象\n  NSData *data = [NSPropertyListSerialization\n             \
  \                       dataWithPropertyList:todoItems\n                       \
  \                     format:NSPropertyListXMLFormat_v1_0\n                    \
  \                      options:NSPropertyListMutableContainers\n               \
  \                                error:outError];\n  // 返回我们新打包的 NSData 对象\n  return\
  \ data;\n}\n\n- (BOOL)readFromData:(NSData *)data\n               ofType:(NSString\
  \ *)typeName\n                error:(NSError **)outError\n{\n  // 当文档正在加载时，会调用此方法\n\
  \  // 我们接收一个 NSData 对象，并预期从中提取我们的数据\n  // 提取我们的 todoItems\n  todoItems = [NSPropertyListSerialization\
  \ propertyListWithData:data\n                                                  \
  \ options:0\n                                            format:NULL\n         \
  \                                      error:outError];\n  // 根据上述调用的成功与否返回成功结果\n\
  \  return (todoItems != nil);\n}\n```\n\n注意，这是你第一次实现一个接收 `NSError**` 参数的方法。在这种情况下，我们仅仅是返回了由\
  \ `propertyListWithData:options:format:error:` 生成的 `NSError`，但根据失败的性质，你也可以创建并返回一个新的\
  \ `NSError`。\n\n再次构建编译并运行应用程序。现在你就可以保存和加载任务列表了。\n\n## 挑战\n\n- 添加一个“删除已选项目”按钮。\n\
  - 在开发者文档中查找 `NSError` 类引用，并按照章节末尾提到的，在保存和加载时创建返回新的 `NSError` 实例。\n\n# 第五部分 高级 Objective-C\n\
  \n你现在已经拥有足够的 Objective-C 知识来开始 iOS 或 Cocoa 开发。但不要急着离开。接下来的章节将对你作为 Objective-C 程序员第一年将非常有用的技术和概念进行温和讨论。\n\
  \n# 29\n\n在 `NSObject` 类中，有一个名为 `init` 的方法。在对象分配内存后，你向新实例发送 `init` 消息，以便它可以初始化实例变量。因此，`alloc`\
  \ 为对象创建空间，而 `init` 让对象准备好工作。使用 `init` 的写法如下：\n\n```objectivec\nNSMutableArray *things\
  \ = [[NSMutableArray alloc] init];\n```\n\n注意，`init` 是一个返回已初始化对象地址的实例方法。它是 `NSObject`\
  \ 的初始化器。本章介绍如何编写初始化器。\n\n## init 方法\n\n创建一个新项目：名为 `Appliances` 的 Foundation 命令行工具。在这个程序中，你将两个类：`Appliance`\
  \ 和 `OwnedAppliance`（`Appliance` 的子类）。`Appliance` 的实例将有一个 `productName` 和 `voltage`。`OwnedAppliance`\
  \ 的实例还将拥有其所有者的名称。\n\n图 29.1 Appliance 及其子类 OwnedAppliance\n\n创建一个新文件：名为 `Appliance`\
  \ 的 `NSObject` 子类。在 `Appliance.h` 中，为 `productName` 和 `voltage` 创建实例变量和属性声明：\n\n\
  ```objectivec\n#import <Foundation/Foundation.h>\n\n@interface Appliance : NSObject\
  \ {\nNSString *productName;\nint voltage;\n\n@property (copy) NSString *productName;\n\
  @property int voltage;\n\n@end\n```\n（我们将在第 30 章讨论 `copy` 属性限定。）\n\n在 `Appliance.m`\
  \ 中，对化属性以为实例变量创建访问器方法：\n\n```objectivec\n#import \"Appliance.h\"\n\n@implementation\
  \ Appliance\n@synthesize productName, voltage;\n...\n```\n\n你可以这样创建一个 `Appliance`\
  \ 实例：\n\n```objectivec\nAppliance *a = [[Appliance alloc] init];\n```\n\n注意，由于 `Appliance`\
  \ 没有实现 `init` 方法，它将执行在 `NSObject` 中定义的 `init` 方法。当这种情况发生时，所有特定于 `Appliance` 的实例变量都将被清零。因此，`Appliance`\
  \ 新实例的 `productName` 将为 `nil`，`voltage` 将为 0。\n\n## 基础 init 方法\n\n在某些情况下，为实例变量设置初始值为零可能运行良好。但在其他情况下，你需要你的类实例在诞生时，其实例变量已初始化为非零值。\n\
  \n假设每个 `Appliance` 实例在开始生命时电压应为 120。在 `Appliance.m` 中，通过添加新的 `init` 实现来重写 `NSObject`\
  \ 的 `init` 方法：\n\n```objectivec\n- (id)init\n{\n  // 调用 NSObject 的 init 方法\n  self\
  \ = [super init];\n  // 给 voltage 一个初始值\n  voltage = 120;\n  // 返回指向该对象的指针\n  return\
  \ self;\n}\n```\n\n\n\n\n\n```objc\n// Give voltage a starting value\n[self setVoltage:120];\n\
  }\nreturn self;\n}\n```\n\n在大多数情况下，并没有理由非要选择其中一种方法而非方法，但这确实是一个很好的争论点。这种论点是这样的：支持直接赋值的人说：“你不能在\
  \ `init` 方法中使用访问器方法！访问器假设对象已经准备好工作了，而对象在 `init` 方法完成之前是没准备就绪的。”然后支持访问器方法的人会说：“噢，得了。在现实世界中，这几乎不是问题。我的访问器方法可能在为我处理其他事情。当我设置该变量时，我都会使用访问器方法。”实际上，在大多数情况下，这两种方法都是有效的。\n\
  \n## 带参数的 init 方法\n\n有时，如果没有调用它的方法提供的信息，对象就无法正确初始化。例如，想象一个电器如果没有名称就无法工作（`nil` 是不算数的）。在这种情况下，你需要能够向初始化器传递一个名称以便使用。\n\
  \n你无法通过 `init` 做到这一点，因为现在到将来，`init` 都没有参数。因此，你必须创建一个新的初始化方法。然后，当另一个方法创建 `Appliance`\
  \ 实例时，它看起来如下：\n\n```objc\nAppliance *a = [[Appliance alloc] initWithProductName:@\"\
  Toaster\"];\n```\n\n`Appliance` 的新初始化方法是 `initWithProductName:`，它接受一个 `NSString`\
  \ 作为参数。在 `Appliance.h` 中声明这个新方法：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \n@interface Appliance : NSObject {\n    NSString *productName;\n    int voltage;\n\
  }\n\n@property (copy) NSString *productName;\n@property int voltage;\n\n- (id)initWithProductName:(NSString\
  \ *)pn;\n@end\n```\n\n在 `Appliance.m` 中，找到 `init` 的实现。将方法重改为 `initWithProductName:`\
  \ 并使用传入的值设置 `productName`。\n\n```objc\n- (id)initWithProductName:(NSString *)pn\n\
  {\n    // 调用 NSObject 的 init 方法\n    self = [super init];\n    // 是否返回了非 nil 对象？\n\
  \    if (self) {\n        // 设置产品名称\n        [self setProductName:pn];\n       \
  \ // 给电压一个初始值\n        [self setVoltage:120];\n    }\n    return self;\n}\n```\n\
  \n在继续之前，构建项目以确保语法正确。\n\n现在你可以使用给定的名称创建 `Appliance` 实例了。然而，如果你将 `Appliance.h` 和 `Appliance.m`\
  \ 交给另一个程序员，她可能没有意识到她需要调用 `initWithProductName:`。如果她用最常见的方式创建 `Appliance` 实例怎么办？\n\
  \n```objc\nAppliance *a = [[Appliance alloc] init];\n```\n\n这并不是不合理的行为。作为 `NSObject`\
  \ 的子类，`Appliance` 实例被认为可以执行 `NSObject` 实例可以做的任何事情。而 `NSObject` 的实例会响应 `init` 消息。然而，这在这里产生了一个问题，因为上面的代码创建的\
  \ `Appliance` 实例的产品名称为 `nil`，电压为 0。而我们之前决定，每个 `Appliance` 实例都需要 120 的电压和一个实际名称才能正常工作。你该如何防止这种情况的发生呢？\n\
  \n解决方案很简单。在 `Appliance.m` 中，添加一个 `init` 方法，使用默认名称调用 `initWithProductName:`。\n\n\
  ```objc\n- (id)init\n{\n    return [self initWithProductName:@\"Unknown\"];\n}\n\
  ```\n\n注意，这个新重写的 `init` 并没有做什么——它只是调用了 `initWithProductName:` 方法，该方法完成了大部分工作。\n\n\
  为了测试你的两个初始化器，你需要一个 `description` 方法。在 `Appliance.m` 中实现 `description`：\n\n```objc\n\
  - (NSString *)description\n{\n    return [NSString stringWithFormat:@\"<%@: %d volts>\"\
  , productName, voltage];\n}\n```\n\n现在，在 `main.m` 中，运行一下这个类：\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\n#import \"Appliance.h\"\n\nint main (int argc, const\
  \ char * argv[])\n{\n    @autoreleasepool {\n        Appliance *a = [[Appliance\
  \ alloc] init];\n        NSLog(@\"a is %@\", a);\n        [a setProductName:@\"\
  Washing Machine\"];\n        [a setVoltage:120];\n        NSLog(@\"a is %@\", a);\n\
  \    }\n    return 0;\n}\n```\n\n\n\n\n注意图 29.3 显示每个类都有一个指定的初始化器。该初始化器是该类的指定初始化器。`init`\
  \ 是 `NSObject` 的指定初始化器，`initWithProductName:` 是 `Appliance` 的指定初始化器，而 `initWithProductName:firstOwnerName:`\
  \ 是 `OwnedAppliance` 的指定初始化器。一个类只有一个指定初始化方法。如果类有其他初始化器，那么这些初始化器的实现必须调用（直接或间接地）指定初始化器。因此，指定初始化器起到漏斗的作用。\n\
  \n当你创建一个指定初始化器名称与其父类指定初始化器不同的类时（正如你在 `Appliance` 和 `OwnedAppliance` 中做的那样），你有责任在头文件中对其进行说明。在\
  \ `Appliance.h` 中添加相应的注释：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface\
  \ Appliance : NSObject {\n    NSString *productName;\n    int voltage;\n}\n\n@property\
  \ (copy) NSString *productName;\n@property int voltage;\n\n// 指定初始化器\n- (id)initWithProductName:(NSString\
  \ *)pn;\n@end\n```\n\n在 `OwnedAppliance.h` 中：\n\n```objc\n#import \"Appliance.h\"\
  \n\n@interface OwnedAppliance : Appliance {\n    NSMutableSet *ownerNames;\n}\n\n\
  // 指定初始化器\n- (id)initWithProductName:(NSString *)pn\n        firstOwnerName:(NSString\
  \ *)n;\n- (void)addOwnerNamesObject:(NSString *)n;\n- (void)removeOwnerNamesObject:(NSString\
  \ *)n;\n@end\n```\n\n因此，Objective-C 程序员在编写初始化器时遵循以下规则：\n\n- 如果一个类有多个初始化器，只有一个执行实际工作。该方法被称为指定初始化器。所有其他初始化器应该直接或间接地调用指定初始化器。\n\
  - 如果你的类的指定初始化器名称与父类的指定初始化器不同，你必须重写父类的指定初始化器，以便初始化实例变量。\n- 如果你有多个初始化器，请在头文件中明确说明哪一个是指定初始化器。\n\
  \n## 致命方法\n\n偶尔，你可以重写父类的指定初始化器。假设你正在创建一个名为 `WallSafe` 的 `NSObject` 子类，它的指定初始化器是\
  \ `initWithCode:`。然而，为 `initWithCode` 设置默认值对于你的应用程序来说是可以接受的。\n\n那么怎么办？`WallSafe`\
  \ 的实例仍然响应 `init` 消息。有人这样做：\n\n```objc\nWallSafe *ws = [[WallSafe alloc]\n```\n\n\
  最好的做法是重写指定初始化器，告知开发者他们犯错了以及如何修复：\n\n```objc\n- (id)init\n{\n```\n\n## 属性 属性\n\n\
  在上一节中，你创建了一个名为 `Appliance` 的类，它有两个属性：`productName` 和 `voltage`。让我们看看这些属性是如何工作的。\n\
  \n在 `Appliance.h` 中，你声明了两个实例变量来存储数据：\n\n```objc\n{\n    NSString *productName;\n\
  \    int voltage;\n}\n```\n\n你还声明了访问器方法。你使用了 `@property` 构造：\n\n```objc\n@property\
  \ (copy) NSString *productName;\n@property int voltage;\n```\n\n在 `Appliance.m`\
  \ 中，你可以显式地实现访问器方法：\n\n```objc\n- (void)setProductName:(NSString *)s\n{\n    productName\
  \ = [s copy];\n}\n\n- (NSString *)productName\n{\n    return productName;\n}\n\n\
  - (void)setVoltage:(int)x\n{\n    voltage = x;\n}\n\n- (int)voltage\n{\n    return\
  \ voltage;\n}\n```\n\n## 属性属性\n\n现在让我们详细查看你可以用于控制访问器创建方式的不同属性。\n\n### 可变性\n\n属性可以声明为\
  \ `readwrite` 或 `readonly`。默认值是 `readwrite`，这意味着会同时创建 setter 和 getter。如果你不需要 setter\
  \ 方法，可以将属性标记为 `readonly`：\n\n```objc\n@property (readonly) int voltage;\n```\n\n\
  ### 周期修饰符\n\n属性可以声明为 `unsafe_retained`、`strong`、`weak` 或 `copy`。此选项决定了 setter 如何处理内存管理。\n\
  \n`unsafe_retained` 是默认且最简单的：它只是将传入的值赋值给属性。想象这个声明：\n\n```objc\n@property (unsafe_retained)\
  \ int averageScore;\n```\n\n这将产生一个几乎等同于以下内容的 setter 方法：\n\n```objc\n- (void)setAverageScore:(int)d\n\
  {\n    averageScore = d;\n}\n```\n\n在 `Appliance` 中，`voltage` 是一个不安全的未保留的属性。对于持有非对象的属性，你将始终使用\
  \ `unsafe_retained`。`strong` 正如你在第 20 节中所学的，它会确保对传入的对象保留一个强引用。它还会放弃对旧对象的所有权（如果它还有其他所有者，则会被销毁）。对于持有对象的属性，你通常会使用\
  \ `strong`。\n\n`weak` 并不意味着对指向的对象拥有所有权。它会合成一个 setter，将属性设置为传入的对象。如果该对象被销毁，属性将设置为\
  \ `nil`。（请注意，如果指针是 `unsafe_retained` 且它指向的对象被销毁，你将拥有一个“悬空指针”。向悬空指针发送消息通常会导致程序崩溃。）\n\
  \n`copy` 会对传入对象的副本创建一个强引用。但这里有一个细节大多数人都误解了：\n\n#### copy\n\n`copy` 选项会创建对象的副本，然后将指针指向该副本。想象你有一个如下的属性声明和定义：\n\
  \n```objc\n@property (copy) NSString *lastName;\n@synthesize lastName;\n```\n\n\
  生成的 setter 方法看起来大致如下：\n\n```objc\n- (void)setLastName:(NSString *)d\n{\n    lastName\
  \ = [d copy];\n}\n```\n\n`copy` 属性的使用适用于具有可变子类的对象类型。例如，`NSString` 有一个名为 `NSMutableString`\
  \ 的子类。你可以想象 `setLastName:` 方法可能会接收到一个可变字符串：\n\n```objc\n// 创建一个可变字符串\nNSMutableString\
  \ *x = [[NSMutableString alloc] initWithString:\"Ono\"];\n// 将其传递给 setLastName:\n\
  [myObj setLastName:x];\n```\n\n\n\n\n```objc\n// 'copy' prevents this from changing\
  \ the lastName\n[x appendString:@\" Lennon\"];\n```\n\n如果传入的对象是不可变的，`copy` 会怎样？为一个不可变对象创建副本似乎是浪费的。`copy`\
  \ 方法只是调用 `copyWithZone:` 并传递 `nil` 作为参数。例如，在 `NSString` 中，`copyWithZone:` 方法被重写为如下：\n\
  \n```objc\n- (id)copyWithZone:(NSZone *)z\n{\n    return self;\n}\n```\n\n也就是说，它根本没有创建副本。（注意，`NSZone`\
  \ 和通用的内存区域已是 Cocoa 编程中几乎被废弃的遗留特征，因此我们在这里不会深入探讨它们。不过，`copyWithZone:` 仍然具有一些用途，并且尚未被完全淘汰。）\n\
  \n对于那些提供可变和不可变两个版本的对象，`copy` 方法返回一个不可变的副本。例如，`NSMutableString` 有一个 `copy` 方法，它返回一个\
  \ `NSString` 实例。如果你希望副本是一个可变对象，请使用 `mutableCopy` 方法。\n\n并没有名为 `mutableCopy` 的属性生命周期限定符。如果你希望你的\
  \ setter 方法将属性设置为对象的可变副本，你必须自己实现该 setter，以便对传入的对象调用 `mutableCopy` 方法。例如，在 `OwnedAppliance`\
  \ 中，你可能会创建一个 `setOwnerNames:` 方法：\n\n```objc\n- (void)setOwnerNames:(NSSet *)newNames\n\
  {\n    ownerNames = [newNames mutableCopy];\n}\n```\n\n## 关于拷贝的更多信息\n\n大多数 Objective-C\
  \ 类根本没有 `copyWithZone:` 方法。Objective-C 程序员创建的次数比你想象的要少。\n\n奇的是，`copy` 和 `mutableCopy`\
  \ 方法在 `NSObject` 中的定义如下：\n\n```objc\n- (id)copy\n{\n    return [self copyWithZone:NULL];\n\
  }\n\n- (id)mutableCopy\n{\n    return [self mutableCopyWithZone:NULL];\n}\n```\n\
  \n因此，如果你有像下面这样的代码：\n\n```objc\nAppliance *b = [[Appliance alloc] init];\nAppliance\
  \ *c = [b copy];\n```\n\n你将得到如下错误信息：\n\n```\n-[Appliance copyWithZone:]: unrecognized\
  \ selector sent to instance 0x100110130\n```\n\n## 关于 atomic 与 nonatomic 的建议\n\n\
  这是一本编程入门书籍，`atomic`/`nonatomic` 选项涉及一个相对高级的主题，即多线程。以下是你需要的：`nonatomic` 选项会让你的 setter\
  \ 方法运行得稍微快一点。如果你查看 Apple UIKit 的头文件，每个属性都被标记为 `nonatomic`。你也应该将你的属性设为 `nonatomic`。\n\
  \n（我向每个人提供这个建议。然而，在每个群体中，总有人知道恰好多到让人讨厌。那个人会说：“但是当我让我的 App 使用多线程时，我需要 atomic setter\
  \ 方法提供的保护。”而我应该说：“我不认为你很快就会写多线程代码。即使你写了，我认为 atomic setter 方法也不会起上什么帮助。”但我真正想说的是：“好吧，那么你就让你的\
  \ setter 保持 atomic 吧。”因为你不能告诉别人他们还没准备好听的话。）\n\n在 `Appliance.h` 中，将你的访问器设为非原子：\n\n\
  ```objc\n@property (copy, nonatomic) NSString *productName;\n@property (nonatomic)\
  \ int voltage;\n```\n\n遗憾的是，此时属性的默认值是 `atomic`，所以你必须进行此更改。\n\n## 键值编码 (Key-value\
  \ coding)\n\n键值编码是使用名称来读取和设置属性的能力。键值编码方法定义在 `NSObject` 中，因此每个对象都具有这种能力。\n\n打开 `main.m`\
  \ 并找到这一行：\n\n```objc\n[a setProductName:@\"Washing Machine\"];\n```\n\n重写该行以使用键值编码：\n\
  \n```objc\n[a setValue:@\"Washing Machine\" forKey:@\"productName\"];\n```\n\n在这种情况下，在\
  \ `NSObject` 中定义的 `setValue:forKey:` 方法将寻找名为 `setProductName:` 的 setter 方法。如果该对象没有\
  \ `setProductName:` 方法，它将直接访问实例变量。\n\n你也可以使用键值编码读取变量的值。在 `main.m` 中添加一行打印产品名称：\n\
  \n```objc\nint main (int argc, const char * argv[])\n{\n    @autorelease {\n   \
  \     Appliance *a = [[Appliance alloc] init];\n        NSLog(@\"a is %@\", a);\n\
  \        [a setValue:@\"Washing Machine\" forKey:@\"productName\"];\n        [a\
  \ setVoltage:240];\n        NSLog(@\"a is %@\", a);\n        NSLog(@\"the product\
  \ name is %@\", [a valueForKey:@\"productName\"]);\n    }\n    return 0;\n}\n```\n\
  \n\n\n\n创建一个名为 `VowelCounter` 的新 Foundation 命令行工具。然后创建一个新的 Objective-C 分类（category）文件。将分类命名为\
  \ `VowelCounting` 并将其成为 `NSString` 的一个分类。\n\n现在打开 `NSString+VowelCounting.h` 并声明你想要添加到\
  \ `NSString` 类中的方法：\n\n```objc\n#import <Foundation/Foundation.h>\n\n@interface\
  \ NSString (VowelCounting)\n\n- (int)vowelCount;\n\n@end\n```\n\n现在在 `NSString+VowelCount.m`\
  \ 中实现该方法：\n\n```objc\n#import \"NSString+VowelCounting.h\"\n\n@implementation NSString\
  \ (VowelCounting)\n\n- (int)vowelCount\n{\n    NSCharacterSet *charSet =\n     \
  \        [NSCharacterSet characterSetWithCharactersInString:@\"aeiouyAEIOUY\"];\n\
  \    NSUInteger count = [self length];\n    int sum = 0;\n    for (int i = 0; i\
  \ < count; i++) {\n        unichar c = [self characterAtIndex:i];\n        if ([charSet\
  \ characterIsMember:c]) {\n            sum++;\n        }\n    }\n    return sum;\n\
  }\n\n@end\n```\n\n现在在 `main.m` 中使用新方法：\n\n```objc\n#import <Foundation/Foundation.h>\n\
  #import \"NSString+VowelCounting.h\"\n\nint main (int argc, const char * argv[])\n\
  {\n    @autorelease {\n        NSString *string = @\"Hello, World!\";\n        NSLog(@\"\
  %@ has %d vowels\", string, [string vowelCount]);\n    }\n    return 0;\n}\n```\n\
  \n编译并运行程序。很不错，对吧？事实证明分类是非常有用的。\n\n需要注意的是，只有这个程序拥有该分类。如果你想在另一个程序中使用该方法，必须将该文件添加到你的项目中，并在构建该程序时编译该分类。\n\
  \n# 32 块（Blocks）\n\n在第 24 章 中，你学习了回调机制、委托（delegation）和通知（notifications）。回调允许其他对象响应事件并调用你对象中的方法。虽然这些方法完全可行，但它们会打乱代码的结构。你为了清晰而希望靠在一起的程序部分，通常并不会靠在一起。\n\
  \n例如，在第 24 章的回调程序中，你添加了代码，在用户时区更改时注册你的对象以接收通知，并在接收到此通知时触发 `zoneChange:`。但现在我正在读你的代码，对这个\
  \ `zoneChange:` 方法在被触发时做了什么感到好奇，所以我去寻找该方法的实现。在回调示例中，注册对象接收通知的代码和被触发的方法实现是紧挨着的，但你可以想象，在一个更大、更复杂的应用程序中，这两部分代码可能相隔数百行。\n\
  \nMac OS X 10.6 和 iOS 4 引入了一种名为“块”（blocks）的新功能。Objective-C block 就像一段 C 函数那样的代码块，但它可以像数据一样被传递。我们很快就会看到它是如何让相关代码保持在一起的。\n\
  \nBlocks 和 block 语法绝对是高级 Objective-C 主题，起初可能会让人困惑。然而，Apple 的 API 越来越多地使用 block。在本章中，我们将逐步几个简单的示例，以便你在实际工作中遇到\
  \ block 时做好准备。\n\n如果你有其他编程语言的背景，你可能知道 block 称为匿名函数、闭包（closures）或 lambdas。如果你熟悉函数指针，block\
  \ 看起来可能很相似，但你很快就会发现，正确使用 block 可以写出比函数指针更优雅的代码。\n\n## 定义 blocks\n\n这是一个 block：\n\
  \n```objc\n^{\n    NSLog(@\"I'm a log statement within a block!\");\n}\n```\n\n\
  它看起来像一个函数，但它使用的是脱字符符号（`^`）而不是函数名。脱字符符号将这段代码标识为 block。同样，像函数一样，block 可以接受参数：\n\n\
  ```objc\n^(double dividend, double divisor) {\n    double quotient = dividend /\
  \ divisor;\n    return quotient;\n}\n```\n\n这个 block 接受两个 double 作为参数。block 也可以有，但我们稍后会回到这个问题。\n\
  \n这些 block 有名字吗？还没有。这些 block 是值，就像数字 5 是一个值一样。为了通过名字访问 block，我们必须将其赋值给一个 block 变量。\n\
  \n## 使用 blocks\n\n为了看到它是如何工作的，我们将直接进入代码环节。在这次练习中，你将使用一个 block 来移除数组中每个字符串的所有元音字母。\n\
