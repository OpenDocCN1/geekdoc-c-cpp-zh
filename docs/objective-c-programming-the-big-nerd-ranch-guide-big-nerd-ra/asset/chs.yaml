  \n## 你与这本书\n\n\n虽然也有类似的书，但这一本是你应该读的。为什么？教人们如何为 iOS 和 Mac 编写应用程序已经多年，我已经确定了你在旅程现阶段需要了解的知识。我一直在努力捕捉这些知识，并摒弃了其他所有无关的内容。\n\
  \n\n\n\n\n汇编语言极其冗长繁琐且依赖于特定的 CPU（因为你最新的 iMac 的大脑可能与你那台心爱的、用旧了的 PowerBook 的大脑完全大不相同）。换句话说，如果你想在不同类型的计算机上运行程序，你就需要重写汇编代码。\n\
  \n为了编写出可以轻松从一种类型的计算机移动到另一种类型计算机的代码，我们开发了“高级语言”。通过高级语言，你不需要考虑特定的 CPU，而是可以用通用的方式表达指令，然后一个程序（称为编译器）会将该代码转换为高度优化的、特定于\
  \ CPU 的机器码。这些语言之一就是 C 语言。C 程序员用 C 语言编写代码，然后 C 编译器将 C 代码转换为机器码。\n\n\nObjective-C\
  \ 语言基于 C，但它增加了对面向对象编程的支持。Objective-C 是编写 Apple iOS 和 Mac OS 操作系统应用程序的编程语言。\n\n\n\
  在书中，你将学习足够的 C 和 Objective-C 编程语言知识，以学会为 Mac 或 iOS 设备开发应用程序。\n\n为什么我要先教你 C 语言？每一个有效的\
  \ Objective-C 程序员都需要对 C 有相当深入的理解。此外，许多在 Objective-C 中看起来复杂的想法在 C 中都有非常简单的根源。我经常会用\
  \ C 引入一个概念，然后引导你并在 Objective-C 中掌握同一个概念。\n本书的设计初衷是在 Mac 面前阅读。你将读到关于概念的解释，并进行说明这些概念的动手操作实验。这些实验不是可选的。如果你不完成它们，就无法真正理解这本书。学习编程最好的方法就是输入代码、犯错、修复错误，并从物理上熟悉语言的模式。仅仅阅读代码和在理论上理解概念对你和你的技能帮助不大。\n\
  \n为了进行更多练习，每章末都有名为 `Challenges`（挑战）的练习。这些练习提供了额外的练习，并将让你对刚刚学的内容更有信心。我强烈建议你尽可能完成所有的\
  \ `Challenges`。\n你会在某些章节的结尾看到名为 `For the More Curious`（致好奇者）的部分。这些是对章节涵盖主题的更深入的解释。它们对于你的目标并不是绝对必要的，但我希望你会发现它们有趣且有用。\n\
  \n\n如果你学会盲打，你会发现这本书以及整个编程过程会愉快得多。盲打不仅速度快得多，还能让你看屏幕和书，而不是看键盘。这让你在错误发生时更容易捕捉到它们。这项技能将在你的整个职业生涯中受益匪浅。\n\
  \n\n通过开始本书，你决定成为一名程序员。你应该知道自己签署了什么。\n程序员的生活大部分时候是一场无休止的斗争。在不断变化的技术格局中解决问题意味着程序员始终在学习新事物。在这种情况下，“学习新事物”是“与自己的无知作战”的委说法。即使程序员正在使用熟悉的技术，有时我们创建的软件也极其复杂，仅仅理解哪里出了问题往往就需要一整天的时间。\n\
  \n如果你写代码，你就会挣扎。大多数专业程序员学会了一小时又小时、日复一日地挣扎，而不会感到（太）沮丧。这是另一项让你受益的技能。如果你对程序员的生活和现代软件项目感兴趣，我强烈推荐\
  \ Scott Rosenberg 的著作《Dreaming in Code》（代码中的梦想）。\n\n现在是时候投入并编写你的第一个程序了。\n\n现在我们知道了本书的结构，是时候看看为\
  \ Mac 以及 iPhone 和 iPad 编程是如何运作的。为了做到，你将：\n\n*   安装 Apple 开发工具\n*   使用这些工具创建一个简单的项目\n\
  *   探索如何使用这些工具来确保我们的项目运行\n\n在本章结束时，你将成功地为 Mac 编写你的第一个程序。\n\n\n为了为 Mac OS（Macintosh）或\
  \ iOS（iPhone 和 iPad）编写应用程序，你将使用 Apple 的开发工具。你可以从 `http://developer.apple.com/` 下载这些工具，或从\
  \ Mac App Store 购买。\n\n安装工具后，在硬盘的根目录下找到 `/Developer` 文件夹。该文件夹包含了为 Mac OS 桌面和 iOS\
  \ 移动设备开发应用程序所需的内容。\n\n我们在书中的工作几乎完全通过一个应用程序进行——Xcode，它位于 `/Developer/Applications`。（将\
  \ Xcode 图标拖到 Dock 栏是一个好主意，你会频繁使用它。）\n\n\nXcode 是 Apple 的集成开发环境（IDE）。这意味着编写、构建和运行新应用程序所需的所有内容都在\
  \ Xcode 中。\n\n\n某些程序没有图形界面并在后台运行几天；我们称这些为守护进程（daemons）。守护进程听起来很可怕，但其实并不是。你现在 Mac\
  \ 上可能有大约 60 个守护进程在运行。它们正等在那里，希望能够派上用场。例如，运行在你系统上的守护进程之一被称为 `pboard`。当你执行复制和粘贴时，`pboard`\
  \ 守护进程会持有你正在复制的数据。\n\n某些程序没有图形界面并在终端中运行一段时间；我们称这些为命令行工具（command-line tools）。在书中，你将主要编写命令行工具，以关注编程核心，而不受创建和管理用户界面的干扰。\n\
  现在我们将使用 Xcode 创建一个简单的命令行工具，以便你看到这一切是如何运作的。\n\n当你编写程序时，你会创建并编辑一组文件。Xcode 在一个项目中跟踪这些文件。启动\
  \ Xcode。从 File 菜单选择 New，然后选择 New Project…。\n\n\n\n![Choosing template](img/00001.jpg)\n\
  \n点击 Next 。\n\n\n\n\n\n![选择选项](img/00002.jpg)\n\n点击 `Next` 按钮。\n现在选择你将创建项目目录的文件夹。你不需要用于版本控制的仓库，所以可以取消勾选该框。最后，点击\
  \ `Create` 按钮。\n\n在接下来的几个章节中，你将反复创建这种类型的项目。在将来，我将直接说：“创建一个名为 `program-name-here`\
  \ 的新 C 命令行工具”，以让你按照相同的顺序操作。\n\n\n\n创建项目后，你将看到一个窗口，它显示了 `AGoodStart` 将是如何生成的。\n\n\
  \n![AGoodStart 项目首次视图](img/00003.jpg)\n\n此窗口包含了许多细节，例如哪些版本的 Mac OS X 可以运行你的应用程序、编译你编写的代码时使用的配置，以及应用于你项目中的任何本地化设置。但让我们暂时忽略这些细节，找到一个简单的起点来开始工作。\n\
  在左侧面板的顶部，找到名为 `main.c` 的文件并点击它。（如果你没有看到 `main.c`，点击标记为 `AGoodStart` 文件夹旁边的三角形以展开其内容。）\n\
  \n\n![在 AGoodStart 组中寻找 main.c](img/00004.jpg)\n\n\n```c\n#include <stdio.h>\nint\
  \ main (int argc, const char * argv[]) {\n    // 在此处插入代码...\n    return 0;\n}\n\
  ```\n\n\n* 注释会被计算机忽略，但程序员使用它们来记录我们编写的代码。你试图解决的编程问题越复杂，注释就越能帮助记录你是如何解决它的。当你在几个月后回到工作中，看着遗忘的代码，并心想：“我确定这个解决方案很棒，但我完全不记得它是如何运行的。”时，这种注释就变得尤为重要。\n\
  \n在 C 和 Objective-C 中，有两种方法区分注释和代码：\n* 如果你在行代码的开头放置 `//`，那么从这些斜杠到该行结束的所有内容都被视为注释。你可以在“在此处插入代码...”中看到这种用法。\n\
  * 如果你有更详细的备注，可以使用 `/*` 和 `*/` 来标记跨越多行的注释的开始和结束。\n\n这些标记注释的规则是 C 语法的一部分。语法是规定在特定语言中必须如何编写代码的规则集。这些规则非常具体，如果你未能遵守这些规则，你的程序将无法运行。\n\
  \n\n幸运的是，Xcode 有方法警告你这类错误。事实上，作为程序员，你面临的首要挑战之一就是解释当出现问题时 Xcode 告诉了你的信息，然后修复你的错误。随着本书的进行，你将看到\
  \ Xcode 对常见错误的一些响应。\n\n让我们对 `main.c` 做一些更改。首先，我们需要腾出空间。找到标记 `main` 函数开始和结束的大括号 `{`\
  \ 和 `}`。然后删除中间的所有内容。\n\n现在更新 `main.c` 看起来像下面的代码。你将在 `main` 函数中添加一条注释、两行代码和另一条注释。现在，如果你你不理解输入的内容，请不要担心。想法是先开始。你还有整本书的时间来学习这一切的含义。\n\
  \n#include <stdio.h>\nint main (int argc, const char * argv[]) {\n    // 输出小说的开头\n\
  \    printf(\"It was the best of times.\\n\");\n    printf(\"It was the worst of\
  \ times.\\n\");\n    /* 那样真的好吗？\n       也许它需要重写。 */\n}\n```\n\n（注意，你需要输入的新代码以**粗字体**显示。未加粗的代码是已经存在的代码。这是我们在本书其余部分将使用的约定。）\n\
  \n\n\n\n\n\n（当你在使用这段代码或未来编写的任何代码遇到构建失败时，不要感到沮丧。犯错和纠错有助于你理解自己在做什么。事实上，这实际上比运气好第一次就成功要好得多。）\n\
  \n一旦构建成功，在日志导航器顶部找到标记为 `Debug` AGoodStart 的项。点击此项以显示程序最近运行的日志。\n\n\n```\nGNU gdb\
  \ 6.3.50-20050815 (Apple version gdb-1705) (Tue Jul  5 07:36:45 UTC 2011)\nCopyright\
  \ 2004 Free Software Foundation, Inc.\nGDB is free software, covered by the GNU\
  \ General Public License, and you are\nwelcome to change it and/or distribute copies\
  \ of it under certain conditions.\nThere is absolutely no warranty for GDB. Type\
  \ \"show warranty\" for details.\nThis GDB was configured as \"x86_64-apple-darwin\"\
  .tty /dev/ttys001\n[Switching to process 2723 thread 0x0]\nIt was the best of times.\n\
  It was the worst of times.\n```\n（在我写这些文字时，Apple 正在开发一种名为 `LLDB` 的新调试器。它最终将取代当前的调试器\
  \ `GDB`。如果你没有看到所有的 `GDB` 信息，这意味着 `LLDB` 现在是 `Xcode` 的标准调试器了。未来一定是一个极佳的地方；我羡慕你们。）\n\
  \n\n现在你已经构建并运行了程序，让我们来内部观察吧。程序是函数的集合。函数是处理器要执行的一系列操作列表。每个函数都有一个名称，你刚刚编写的函数名为 `main`。还有另一个函数——`printf`。你没有写这个函数，但你确实使用了它。（我们将在第\
  \ 5 章中找出 `printf` 来自何。）\n\n对于程序员来说，编写一个函数非常像写食谱：“慢慢搅拌一夸水直到它煮开。然后加入一杯面粉。趁热上菜。”\n\n\
  \n图 2.5 一张名为“烤鸡”的食谱卡\n\n![一张名为“烤鸡”的食谱卡](img/00009.jpg)\n\nBetty Crocker 的烹饪指令是英语。在本书的第一部分，你的函数将用\
  \ C 语言编写。然而，计算机处理器期望的是机器码指令。我们如何到达那里呢？\n当你用 C 编写程序时（这对你来说相对愉快），编译器会将你的程序函数转换为机器码（这对处理器来说既愉快又高效）。编译器本身是一个程序，当你按下运行按钮时，由\
  \ `Xcode` 运行。编译程序等同于构建程序，我们将交替使用这些术。\n\n当你运行程序时，编译后的函数会从硬盘拷贝到内存中，处理器执行名为 `main`\
  \ 的函数。`main` 函数通常会调用其他函数。例如，你的 `main` 函数调用了 `printf` 函数。（关于函数如何相互作用的更多信息，我们将在第 5\
  \ 章中看到。）\n\n\n到此为止，你可能已经处理了几种挫败：安装问题、拼写错误以及大量的新词汇。也许你到目前为止做的一切都没有任何意义。这完全是正常。\n\n\
  在我写这些文字时，我的儿子 Otto 六岁了。Otto 每天都会感到好几次困惑。他不断尝试吸收那些不符合他现有心理支架的知识。困惑发生得如此频繁，以至于它并不真的困扰他。他从未停下来想：“为什么这这么难懂？我应该把这本书扔掉吗？”\n\
  \n随着年龄增长，我们感到困惑的情况少得多——不是因为我们无所不知，而是因为我们倾向于避开那些让我们迷茫的事情。例如，读一本历史书是非常愉快的，因为我们获得了一些可以挂在现有心理支架上的知识点。这是易学。\n\
  \n\n学习编写程序也是困难学习。你会时不时感到困惑。\n\n\n在这些章节中，我们将探索编程的基础概念。我们将从程序的结构方式以及它如何处理数据开始。\n\n\
  \n继续上一章的食谱比喻，有时厨师会留一块黑板来存储数据。例如，在拆火鸡时，他注意到一个写着“14.2”的标签。在扔掉包装之前，他会在黑板上写下 `weight\
  \ = 14.2`。然后，在把火鸡放入烤箱之前，他会参考重量计算烹饪时间（每磅 15 分钟）。\n\n\n![使用黑板跟踪数据](img/00010.jpg)\n\
  \n在执行期间，程序经常需要存储将要使用的数据的地方。一个数据可以存放的地方被称为变量。每个变量都有一个名称（如 `cookingTime`）和一个类型（如数字）。此外，当程序执行时，变量将有一个值（如\
  \ 228.0）。\n\n\n\n```c\nfloat weight;\n```\n\n\n在 C 中，你必须声明每个变量的类型有两个：\n\n*   类型让编译器检查你的工作并提醒你可能的错误或问题。例如，假设你有一个存储文本的类型。如果你请求它的对数，编译器会告诉你类似“请求该变量的对数毫无意义”的内容。\n\
  *   告诉编译器为该变量留出内存空间（多少字节）。\n\n以下是常用类型的概览。我们将在后面的章节中详细介绍每种类型。\n| `short`, `int`,\
  \ `long` |\n| `float`, `double` |\n| `char` |\n| pointers（指针） |\n| `struct` |\n\
  这些是 C 程序员每天使用的类型。仅仅这五个简单概念能捕捉如此复杂的想法，真是令人惊讶。\n\n\n\n\n\n现在创建一个新项目（File` → `New`\
  \ → `New Project...`）。此项目将是一个名为 `Turkey` 的 C 命令行工具（Command Line Tool）。\n\n在项目导航器中，找到该项目的\
  \ `main.c` 文件并打开它。编辑 `main.c` 使与以下代码匹配。\n\n#include <stdio.h>\n\nint main (int argc,\
  \ const char * argv[])\n{\n    // 声明一个类型为 float 的变量 'weight'\n    float weight;\n\
  \    // 给该变量赋一个数字\n    // 打印给用户\n    printf(\"The turkey weighs %f.\\n\", weight);\n\
  \    // 声明另一个类型为 float 的变量\n    float cookingTime;\n    // 计算烹饪时间并存储变量中\n    //\
  \ 在此情况下，'*' 表示 '乘以'\n    // 将结果打印给用户\n    printf(\"Cook it for %f minutes.\\n\"\
  , cookingTime);\n    // 结束函数并指示成功\n    return 0;\n}\n```\n编译并运行程序。你可以点击 Xcode 窗口左角的\
