  \ const char * argv[])\n{\n    printf(\"Aaron is Cool\\n\");\n    // ... (重复很多次)\n\
  \    return 0;\n}\n\n等等，原文显示的是：\n```c\n    printf(\"Aaron is Cool\\n\");\n    printf(\"\
  Aaron is Cool\\n\");\n    // ... 依此类推\n    return 0;}\n```\n\n\n### while 循环\n\n\
  我们将使用的第一个循环是 `while` 循环。`while` 循环的工作方式类似于 `if` 结构，但在条件成立时重复执行。修改代码使其看起来像这样：\n```c\n\
  #include <stdio.h>\nint main(int argc, const char * argv[])\n{\n    while (i < 12)\
  \ {\n        printf(\"%d. Aaron is Cool\\n\", i);\n        i++;\n    }\n}\n```\n\
  \n\n### for 循环\n\n`while` 循环是一种通用的结构，但 C 程序员经常使用 `for` 循环：\n```c\nfor (初始化; 条件;\
  \ 步进) {\n    代码\n}\n\n将程序使用 `for` 循环：\n\n```c\nint main(int argc, const char * argv[])\n\
  {\n    for (int i = 0; i < 12; i++) {\n        printf(\"%d. Aaron is Cool\\n\",\
  \ i);\n    return 0;\n}\n```\n\n\n有时需要在循环内部停止循环执行。例如，假设你想遍历整数寻找数字 `x`，使得 `x + 90\
  \ = x²`。你的计划是遍历 0 到 11，找到解决方案时跳出循环。修改代码：\n\n```c\nint main(int argc, const char\
  \ * argv[])\n{\n    int i;\n    for (i = 0; i < 12; i++) {\n        if (i + 90 ==\
  \ i * i) {\n            break;\n        }\n    }\n    return 0;\n}\n```\n\n\n`Checking\
  \ i = 0`\n`Checking i = 1`\n`Checking i = 2`\n`Checking i = 3`\n`Checking i = 5`\n\
  `Checking i = 6`\n`Checking i = 7`\n`Checking i = 8`\n`Checking i = 10`\n`The answer\
  \ is 10.`\n\n注意当调用 `break` 时，执行会直接跳转到代码块的结束。\n### continue\n\n有时你会发现自己在代码块的中间，需要说：“忘记这次循环执行的剩余部分，并开始下一次循环。”这是通过\
  \ `continue` 命令实现的。例如，如果你非常确定没有 3 的倍数满足该方程，你会如何避免浪费宝的时间去检查那些数字？\n\n\n\n\n```c\n\n\
  int main(int argc, const char * argv[])\n{\n    int i;\n        if (i % 3 == 0)\
  \ {\n            continue;\n        }\n        printf(\"Checking i = %d\\n\", i);\n\
  \        if (i + 90 == i * i) {\n        }\n    }\n    printf(\"The answer is %d.\\\
  n\", i);\n    return 0;\n```\n\n编译并运行它：\n\nChecking i = 1\nChecking i = 2\nChecking\
  \ i = 4\nChecking i = 5\nChecking i = 8\nChecking i = 10\nThe answer is 10.\n```\n\
  图 7.4 continue\n\n![continue](img/00025.jpg)\n\n## do-while 循环\n酷的孩子们都不用 `do-while`\
  \ 循环，但为了完整性，这里介绍一下它。`do-while` 循环在执行代码块之前不会检查表达式。因此，它确保代码块至少被执行一次。如果你重写原来的练习以使用\
  \ `do-while` 循环，它看起来像这样：\n\n```c\nint main(int argc, const char * argv[])\n    int\
  \ i = 0;\n    do {\n        printf(\"%d. Aaron is Cool\\n\", i);\n        i++;\n\
  \    return 0;\n}\n```\n\n注意末尾的分号。这是因为与其他循环不同，`do-while` 循环实际上是一个很长的语句：\n`do { 某些\
  \ } while ( 其他某些保持 true );`\n\n这是这个 `do-while` 循环的流程图：\n\n\n![do-while loop](img/00026.jpg)\n\
  \n## 挑战\n编写一个程序，从 99 开始倒数 3 直到 0，并打印每个数字。但是，如果数字能被 5 整除，还应该打印单词“Found one!”。因此，输出应该像这样：\n\
  \n```\n99\n93\n90\nFound one!\n87\n0\nFound one!\n```\n\n# 8 地址与指针\n你的计算机的核心是一个处理器（中央处理单元或\
  \ `CPU`）和一片巨大的开关海洋（随机存取内存或 `RAM`），这些开关可以由处理器开启或关闭。我们说一个开关持有一个位（bit）的信息。你经常会看到 1\
  \ 表示“开启”，0 表示“关闭”。\n\n这八个开关组成一个字节（byte）信息。处理器可以获取这些开关的状态，对这些位进行操作，并将结果存储在另一组开关中。例如，处理器可能会从这里获取一个字节，从那里获取另一个字节，将它们相加，并将结果存储在其他地方的地方。\n\
  \n\n![Memory and the CPU](img/00027.jpg)\n\n内存是有编号的，我们通常讨论特定数据字节的地址。当人们谈论 32 位 `CPU`\
  \ 或 64 位 `CPU` 时，他们通常是在讨论地址有多大。64 位 `CPU` 处理的内存比 32 位 `CPU` 多得多。\n## 获取地址\n\n在 Xcode\
  \ 中，创建一个新项目：一个名为 `Addresses` 的 C 命令行工具。\n\n变量的地址是内存中存储该变量值的位置。要获取变量的地址，你使用 `&` 运算符：\n\
  ```c\n#include <stdio.h>\n\nint main(int argc, const char * argv[])\n    int i =\
  \ 17;\n    printf(\"i stores its value at %p\\n\", &i);\n    return 0;\n}\n\n注意\
  \ `%p` 令牌。这是可以用内存地址替换的令牌。编译并运行程序。你会看到类似的内容：\n\n`i stores its value at 0xbffff738`\n\
  \n\n在计算机中，一切都存储在内存中，因此一切都有地址。例如，一个函数开始于某个特定地址。要获取该地址，你只需要使用函数名：\n\n```c\n{\n   \
  \ int i = 17;\n    printf(\"i stores its value at %p\\n\", &i);\n    printf(\"this\
  \ function starts at %p\\n\", main);\n}\n```\n\n编译并运行程序。\n\n\n如果你想在变量中存储一个地址怎么办？你可以把它放进一个大小合适的无符号整数中，但如果你在给该变量指定类型时更加具体，编译器将帮助你捕获错误。例如，如果你想要一个名为\
  \ `ptr` 的变量，它持有可以找到 `float` 的地址，你可以这样声明它：\n\n```c\n```\n\n我们说 `ptr` 是一个指向 `float`\
  \ 指针的变量。它不存储 `float` 的值；它指向一个可能存储 `float` 的地址。\n\n\n```c\nint main(int argc, const\
  \ char * argv[])\n{\n    int i = 17;\n    return 0;\n}\n```\n\n\n如果你有一个地址，可以使用 `*`\
  \ 运算符获取存储在那的数据。注意 `*` 的两种用法。第一种是在声明处：\n\n```c\n{\n    int i = 17;\n    int *addressOfI\
  \ = &i;\n    printf(\"i stores its value at %p\\n\", addressOfI);\n    printf(\"\
  this function starts at %p\\n\", main);\n}\n```\n\n第二种是在读取数据处：\n```c\nint main(int\
  \ argc, const char * argv[])\n{\n    int i = 17;\n    printf(\"i stores its value\
  \ at %p\\n\", addressOfI);\n    printf(\"this function starts at %p\\n\", main);\n\
  \    printf(\"the value is %d\\n\", *addressOfI);\n    return 0;\n```\n\n等等，让我们看看解引的示例：\n\
