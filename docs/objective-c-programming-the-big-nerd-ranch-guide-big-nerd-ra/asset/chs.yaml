  \ Mac 和 iOS 开发者告知发生错误的各种方式。\n*   **示例代码 (Sample Code)**：这些是小型、完整的项目，展示了 Apple 如何期望使用其技术。例如，有一个\
  \ WeatherMap 项目展示了如何在 iOS 地图视图上创建自定义注释。\n*   **发布说明 (Release Notes)**：每当 Mac OS\
  \ 或 iOS 发布新版本时，都会附带一组发布说明。发布说明告诉开发者自上版本以来发生了什么。\n*   **技术备注、文章、编码教程和技术问答 (Technical\
  \ notes, Articles, Coding How-to’s, and Technical Q&As)**：这些是针对特定问题的短篇文档。\n\n你可以浏览文档，但内容非常多。通常情况下，你会通过搜索访问文档。\n\
  \n## 参考页面 (Reference pages)\n\n在 Organizer 左侧面板的顶部，点击 !![参考页面](img/00039.jpg) 按钮调出搜索面板。在搜索框中输入\
