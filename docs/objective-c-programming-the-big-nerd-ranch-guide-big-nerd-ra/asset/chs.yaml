  ```c\n#include <stdio.h>\nint main (int argc, const char * argv[])\n{\n    printf(\"\
  3 * 3 + 5 * 2 = %d\\n\", 19);\n    return 0;\n}\n```\n\n\n如果你认为“11 除以 3 等于 3 余 2”，这其实是合理的。余数通常很有价值。取模运算符\
  \ `%` 类似于 `/`，但它返回余数而不是商：\n\n```c\nint main (int argc, const char * argv[])\n{\n\
  \    printf(\"3 * 3 + 5 * 2 = %d\\n\", 3 * 3 + 5 * 2);\n    printf(\"11 / 3 = %d\
  \ remainder of %d \\n\", 11 / 3, 11 % 3);\n}\n```\n\n如果你想得到 `3.6667` 呢？使用强制转换运算符将\
  \ `int` 转换为 `float`。强制转换是你放在想要转换变量左侧的类型。在进行除法之前，将分母转换为 `float`：\n```c\nint main\
  \ (int argc, const char * argv[])\n{\n    printf(\"3 * 3 + 5 * 2 = %d\\n\", 3 *\
  \ 3 + 5 * 2);\n    printf(\"11 / 3.0 = %f\\n\", 11 / (float)3);\n    return 0;\n\
  }\n```\n现在，将执行浮点除法而不是整数除法，你会得到 `3.6667`。整数与浮点除法的规则如下：只有当分子和分母都是整数类型时才是整数除法。如果其中一个是浮点数，则执行浮点除法。\n\
  \n#### 运算符简写\n\n\n```c\nint x = 5;\nx = x + 1; // x 现在是 6\n\nC 程序员经常进行此类操作，因此创建了可以在不需要赋值的情况下改变变量值的运算符。例如，你可以使用递增运算符\
  \ `++` 将 `x` 中存储的值增加 1：\n\n```c\nx++; // x 现在是 6\n```\n\n还有一个递减运算符 `--`，它将值减 1：\n\
  ```c\nint x = 5;\nx--; // x 现在是 4\n```\n如果你想让 `x` 增加 5 而不仅仅是 1 呢？你可以使用加法赋值：\n\n\
  ```c\nint x = 5;\nx = x + 5; // x 现在是 10\n\n但这个也有简写：\n\n```c\nx += 5; // x 现在是 10\n\
  ```\n\n\n你可以将第二行理解为“将 `x + 5` 的值赋值给 `x`”。除了 `+=` 外，还有 `-=`、`*=`、`/=` 和 `%=`。\n\n\
  要获取 `int` 的绝对值，你需要使用函数而不是运算符。该函数是 `abs()`。如果你想获取 `long` 的绝对值，请使用 `labs()`。这两个函数都声明在\
  \ `stdlib.h` 中中：\n\n#include <stdio.h>\n#include <stdlib.h>\n\nint main (int argc,\
  \ const char * argv[])\n{\n    printf(\"11 / 3 = %d remainder of %d \\n\", 11 /\
  \ 3, 11 % 3);\n    printf(\"11 / 3.0 = %f\\n\", 11 / (float)3);\n    printf(\"The\
  \ absolute value of -5 is %d\\n\", abs(-5));\n    return 0;\n```\n\n## 浮点数\n\n\n\
  与整数一样，浮点数也有几种大小。与整数不同，浮点数总是有符号的：\n\n```c\ndouble h;      // 64 位\nlong double i;\
  \ // 128 位\n```\n\n### 显示浮点数的标记\n`printf()` 也可以显示浮点数，最常用的标记是 `%f` 和 `%e`。在 `main.c`\
  \ 中，替换与整数相关的代码：\n\n```c\nint main (int argc, const char * argv[])\n    double y\
  \ = 12345.6789;\n    printf(\"y is %f\\n\", y);\n    printf(\"y is %e\\n\", y);\
  \ \n    return 0;\n}\n\n当你编译并运行它时，你应该看到：\n\n`y is 12345.678900`\n\n因此 `%f` 使用普通的十进制计数法，而\
  \ `%e` 使用科学计数法。\n\n注意 `%f` 目前显示小数点后 6 位。这通常有点多。通过修改标记将其限制为两位：\n```c\nint main (int\
  \ argc, const char * argv[])\n{\n    double y = 12345.6789;\n    printf(\"y is %.2f\\\
  n\", y);\n    return 0;\n}\n```\n\n\n`y is 12345.68`\n`y is 1.23e+04`\n\n\n运算符 `+`、`-`、`*`\
  \ 和 `/` 的行为完全如你预期的一样。如果你将进行大量的数学计算，你需要数学库。在 Mac 上打开终端（Terminal）应用并输入 `man math`。你将获得关于数学库中所有内容的精彩摘要：三角函数、舍入、幂、平方根和立方根等。\n\
  \n如果你在代码中使用了任何这些数学函数，请务必在该文件的顶部包含数学库头文件：\n```c\n#include <math.h>\n```\n\n\n## 挑战\n\
  \n使用数学库！在 `main.c` 中添加代码显示 1 弧度的正弦值。显示保留三小数位的数字。\n# 7 循环\n\n在 Xcode 中，再次创建一个新项目：名为\
