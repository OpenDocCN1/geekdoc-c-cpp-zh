  \n在第 24 章 中，你学习了回调机制、委托（delegation）和通知（notifications）。回调允许其他对象响应事件并调用你对象中的方法。虽然这些方法完全可行，但它们会打乱代码的结构。你为了清晰而希望靠在一起的程序部分，通常并不会靠在一起。\n\
