  \ 的意思是：“解引用结构指针 `p` 并获取名为 `weightInKilos` 的成员。”\n\n\n# 第三部分\n\n## Objective-C 与\
  \ Foundation\n现在，你已经了解了程序、函数、变量和数据类型的基础知识，已经准备好学习 Objective-C 了。目前我们将继续使用命令行程序，以便将重点放在编程的核心要素上。\n\
  \n所有的 Objective-C 编程都是通过 Foundation 框架完成的。框架是你用于编写程序的类库。那么什么是类？这就是我们首先要讨论的……\n\n\
  # 12\n## 对象\n\n许多计算机语言都有“对象”的概念。对象类似于结构体，因为它持有数据。然而，与结构体不同，对象还包含一组作用于这些数据的函数。要触发其中一个函数，你需要向对象发送一条消息。用准确的术语来说，由消息触发的函数被称为“方法”。\n\
  \n\n对象本质上是非常“活跃”的。它们会工作，并发送和接收关于它们正在执行的工作的消息。一个复杂的 Objective-C 程序可能同时在内存中拥有数百个对象，它们互相发送消息。\n\
  \n类描述了一种特定类型的对象。这种描述包含了方法和实例变量，该类型的对象在其中存储数据。你请求一个类在堆上为你创建一个该类型的对象。我们称生成的对象为该类的“实例”。\n\
  例如，iPhone 自带了许多类，其中之一是 `CLLocation`。你可以请求 `CLLocation` 类创建一个 `CLLocation` 实例。在这个\
  \ `CLLocation` 对象内部有几个实例变量，用于保存位置数据，如经度、纬度和高度。该对象还有几个方法。例如，你可以询问一个 `CLLocation`\
  \ 实例距离另一个 `CLLocation` 对象有多远。\n\n#### 创建并使用你的第一个对象\n\n\n图 12.1 创建一个 Foundation 命令行工具\n\
  \n![创建一个 Foundation 命令行工具](img/00033.jpg)\n\n\n```objc\n#import <Foundation/Foundation.h>\n\
  int main (int argc, const char * argv[])\n{\n    @autoreleasepool {\n        NSDate\
  \ *now = [NSDate date];\n    }\n    return 0;\n}\n```\n漂亮！这是你的第一次发送消息。你向 `NSDate`\
  \ 类发送了 `date` 消息。`date` 方法请求 `NSDate` 类创建一个 `NSDate` 实例，将其初始化为当前日期/时间，并返回新对象的起始地址。然后你将返回的地址存储在变量\
  \ `now` 中。这个变量是一个指向 `NSDate` 对象的指针。\n\n`NSLog()` 是一个 Objective-C 函数，与 `printf()`\
  \ 相似；它接受一个格式字符串，将 `%` 标记替换为实际值，并将结果写入控制台。然而，它的格式字符串始终以 `@` 开头，且结尾不需要 `\\n`。\n\n\
  构建并运行程序。你应该看到类似的内容：\n`2011-08-05 11:53:54.366 TimeAfterTime[4862:707] The new date\
  \ lives at 0x100114dc0`\n\n与 `printf()` 不同，`NSLog()` 在输出前会加上日期、时间、程序名称和进程 ID。从现在起，当我显示\
  \ `NSLog()` 的输出时，我会跳过这些数据——页面太窄了。\n\n\n```objc\n#import <Foundation/Foundation.h>\n\
  \nint main (int argc, const char * argv[])\n    @autoreleasepool {\n        NSDate\
  \ *now = [NSDate date];\n        NSLog(@\"@\", now);\n    }\n}\n```\n\n你应该看到类似的内容：\n\
  `2011-08-05 11:53:54.366 TimeAfterTime[4862:707] 2011-08-05 11:53:54 +0000`\n###\
  \ 消息的剖析\n\n消息发送总是被方括号包围，并且至少包含两个部分：\n\n*   要触发的方法名称\n\n消息发送（类似于函数调用）也可以带有参数。让我们来看一个例子：\n\
  \n#import <Foundation/Foundation.h>\n\nint main (int argc, const char * argv[])\n\
  {\n    @autoreleasepool {\n        NSLog(@\"@\", now);\n        double seconds =\
  \ [now timeIntervalSince1970];\n        NSLog(@\"It has %f seconds since the start\
  \ of 1970.\", seconds);\n    }\n}\n```\n\n`NSDate` 代表一个特定的日期时间。`NSDate` 的实例可以告诉你它与\
  \ 1970 年 1 月 1 日凌晨 12:00 (GMT) 之间的差值（秒），通过向它发送 `timeIntervalSince1970` 消息来实现。\n\
  现在假设你需要一个新的对象——比你现有的对象晚 100,000 秒。`NSDate` 类有一个方法 `dateAddingInterval:`。你可以向它发送这个消息来获取新日期。使用代码：\n\
  \n```objc\n#import <Foundation/Foundation.h>\n\n{\n    @autoreleasepool {\n    \
  \    NSDate *now = [NSDate date];\n        NSLog(@\"@\", now);\n        NSLog(@\"\
  In 100,000 seconds it will %@\", later);\n    }\n    return 0;\n}\n\n在消息发送 `[now\
  \ dateAddingInterval:100000]` 中，\n\n*   `now` 是接收消息对象的指针（也称为“接收者”）\n*   `dateAddingInterval:`\
  \ 是方法名（也称为“选择器”）\n\n图 12.2 消息发送\n\n![消息发送](img/0034.jpg)\n#### 内存中的对象\n\n这是一个对象图。变量\
  \ `now` 和 `later` 是 `main()` 函数栈帧的一部分。它们指向 `NSDate` 对象，如箭头所示。\n\n图 12.3 TimeAfterTime\
  \ 的对象图\n![TimeAfterTime 的对象图](img/0035.jpg)\n\n你到为止只看到了一个类：`NSDate`。事实上，iOS 和 Mac\
  \ OS X 附带了数百个类。我们将在后续章节中处理一些更常见的类。\n\n\n在声明用于持有对象的指针时，大多数情况下你会指定指针所指向的对象的类：\n\n\
  `NSDate *expiration;`\n\n\n\n然而，你通常需要一种方法创建一个指针，而不需要确切知道指针将指向什么种类型的对象。在这种情况下，我们使用类型\
  \ `id` 来表示“指向某种 Objective-C 对象的指针”。以下是使用它时的样子：\n\n```objc\n```\n\n注意，在这个声明中没有星号。`id`\
  \ 隐含了星号。\n\n\n## 挑战\n\n使用两个 `NSDate` 实例来计算你活了多少秒。提示：这里是如何从年、月、日等创建一个新的日期对象的：\n\n\
  NSDateComponents *comps = [[NSDateComponents alloc] init];\n[comps setYear:1969];\n\
  [comps setMonth:4];\n[comps setDay:30];\n[comps setMinute:10];\n[comps setSecond:0];\n\
  NSCalendar *g = [[NSCalendar alloc] initWithCalendarIdentifier:NSGregorianCalendar];\n\
  NSDate *dateOfBirth = [g dateFromComponents:comps];\n```\n要获取两个 `NSDate` 实例之间的秒数，请使用方法\
  \ `timeIntervalSinceDate:`。\n\n```objc\ndouble d = [laterDate timeIntervalSinceDate:earlierDate];\n\
  \n# 13\n\n更多消息\n\n\n```objc\nNSDate *now = [NSDate date];\n```\n\n\n```objc\ndouble\
  \ seconds = [now timeIntervalSince1970];\n```\n我们说 `timeIntervalSince1970` 是一个**实例方法\"\
  。你通过向类的实例发送消息来导致该方法的执行。`timeIntervalSince1970` 方法返回一个 `double`。\n\n```objc\nNSDate\
  \ *later = [now dateByAddingTimeInterval:100000];\n```\n`dateByAddingTimeInterval:`\
  \ 是另一个实例方法。该方法接受一个参数。你可以通过方法名中的冒号判断出来。该方法也返回一个指向 `NSDate` 实例的指针。\n\n## 嵌套消息发送\n\n\
  有一个类方法 `alloc`，它返回一个指向需要初始化的新对象的指针。该指针随后被用于向新对象发送消息 `init`。使用 `alloc` 和 `init` 是\
  \ Objective-C 中创建对象最常用的方法。一种良好的做法（也是 Apple 认可的方法）是通过嵌套消息发送，在一行代码中发送这两条消息：\n```objc\n\
  [[NSDate alloc] init];\n```\n\n\n`init` 返回一个指向新对象的指针（这几乎总是来自 `alloc` 方法的指针），因此我们可以使用\
  \ `init` 的返回值进行赋值。通过更改以下行，在代码中尝试这些嵌套消息：\n\n```objc\nNSDate *now = [NSDate date];\n\
  \n改为\n\n```objc\nNSDate *now = [[NSDate alloc] init];\n\n#### 多参数\n\n某些方法接受多个参数。例如，`NSDate`\
  \ 对象并不知道当前是月的第几天。如果你需要这些信息，将使用 `NSCalendar` 对象。可以告诉你每月第几日的 `NSCalendar` 方法接受三个参数。创建一个\
  \ `NSCalendar` 对象并在 `main.m` 中使用它：\n\n#import <Foundation/Foundation.h>\n\nint main\
  \ (int argc, const char * argv[])\n{\n        NSDate *now = [[NSDate alloc] init];\n\
  \        NSLog(@\"The date is %@\", now);\n        double seconds = [now timeIntervalSince1970];\n\
  \        NSLog(@\"It has been %f seconds since the start of 1970.\", seconds);\n\
  \        NSDate *later = [now dateByAddingTimeInterval:100000];\n        NSCalendar\
  \ *cal = [NSCalendar currentCalendar];\n        NSUInteger day = [cal ordinalityOfUnit:NSDayCalendarUnit\n\
  \                                             inUnit:NSMonthCalendarUnit\n     \
  \                                       forDate:now];\n        NSLog(@\"This is\
  \ day %lu of the month\", day);\n    return 0;\n}\n```\n\n\n\n\n\n要获取字符串中的字符数，你可以使用\
  \ `length` 方法：\n```objc\nNSUInteger charCount = [x length];\n```\n\n你可以使用 `isEqual:`\
  \ 方法来检查两个字符串是否相等：\n```objc\nif ([lament isEqual:x])\n    NSLog(@\"%@ and %@ are\
  \ equal\", lament, x);\n```\n\n\n```c\nchar *lament = \"Why me!?\";\nchar *x;\n\
  size_t charCount = strlen(x);\nif (strcmp(lament, x) == 0)\n    printf(\"%s and\
  \ %s are equal\\n\", lament, x);\nfree(x);\n```\n我们将在第 34 章 中讨论 C 字符串。但每当你有选择时，请使用\
  \ `NSString` 对象 own 替 C 字符串。`NSString` 类有许多方法旨在让你的生活更轻松。此外，`NSString`（基于 UNICODE\
  \ 标准）非常擅长存储地球上任何语言的文本。特殊字符？没问题。从右向左读的文本？不用。\n\n## 挑战\n\n有一个名为 `NSHost` 的类，它包含关于你计算机的信息。要获取\
  \ `NSHost` 实例，你可以使用 `NSHost` 类方法 `currentHost`。该方法返回一个指向 `NSHost` 对象的指针：\n```objc\n\
  + (NSHost *)currentHost\n```\n\n\n```objc\n- (NSString *)localizedName\n```\n\n\n\
  # 15 NSArray\n\n和 `NSString` 类似，`NSArray` 是 Objective-C 程序员经常使用的另一个类。`NSArray` 的实例包含一个指向其他对象的指针列表。例如，假设你想创建一个包含三个\
  \ `NSDate` 对象的列表，然后遍历列表并打印每个日期。\n\n\n```objc\n#import <Foundation/Foundation.h>\n\
  int main(int argc, const char * argv[])\n{\n        // 创建三个 NSDate 对象\n        NSDate\
  \ *now = [NSDate date];\n        NSDate *tomorrow = [now dateByAddingTimeInterval:24.0\
  \ * 60.0 * 60.0];\n        NSDate *yesterday = [now dateByAddingTimeInterval:-24.0\
  \ * 60.0 * 60.0];\n        // 创建包含所有三个对象的数组 (nil 结束列表)\n        // 有几个日期？\n    \
  \    NSLog(@\"There are %lu dates\", [dateList count]);\n        // 打印其中几个\n   \
  \     NSLog(@\"The first date is %@\", [dateList objectAtIndex:0]);\n    }\n   \
  \ return 0;\n}\n```\n\n\n- `count` 返回数组中的项数\n- `objectAtIndex:` 返回数组在参数指定的索引处存储的指针。\n\
  \n数组是有序的，你通过索引访问数组中的项。数组是从 0 开始的：第一个项存储在索引 0，第二个项存储在索引 1，依此类推。因此，如果 `count` 方法说数组中有\
  \ 100 个项目，你可以你可以使用 `objectAtIndex:` 请求索引从 0 到 99 的对象。\n图 15.1 是你的程序的对象图。注意 `NSArray`\
  \ 的实例有指向 `NSDate` 对象的指针。\n\n图 15.1 DateList 的对象图\n![DateList 的对象图](img/0036.jpg)\n\
  因此，如果你想通过循环来处理并处理数组中的每个项（或“遍历数组”），你可以创建一个 `for` 循环。编辑 `main.m`：\n\n```objc\n#import\
  \ <Foundation/Foundation.h>\nint main(int argc, const char * argv[])\n    @autoreleasepool\
  \ {\n        // 创建三个 NSDate 对象\n        NSDate *now = [NSDate date];\n        NSDate\
  \ *tomorrow = [now dateByAddingTimeInterval:24.0 * 60.0 * 60.0];\n        NSDate\
  \ *yesterday = [now dateByAddingTimeInterval:-24.0 * 60.0 * 60.0];\n        NSArray\
  \ *dateList = [NSArray arrayWithObjects:now, tomorrow, nil];\n        UInteger dateCount\
  \ = [dateList count];\n        for (int i = 0; i < dateCount; i++) {\n         \
  \   NSDate *d = [dateList objectAtIndex:i];\n            NSLog(@\"Here is a date:\
  \ %@\", d);\n    }\n    return 0;\n}\n```\n程序员们这样做这样做，以至于他们为 `for` 循环增加了一个特殊的扩展用于遍历数组。修改代码以使用这种机制：\n\
  \n```objc\n#import <Foundation/Foundation.h>\nint main(int argc, const char * argv[])\n\
  \    @autoreleasepool {\n        // 创建三个 NSDate 对象\n        NSDate *now = [NSDate\
  \ date];\n        NSDate *tomorrow = [now dateByAddingTimeInterval:24.0 * 60.0 *\
  \ 60.0];\n        NSDate *yesterday = [now dateByAddingTimeInterval:-24.0 * 60.0\
  \ * 60.0];\n        NSArray *dateList = [NSArray arrayWithObjects:now, tomorrow,\
  \ nil];\n        for (NSDate *d in dateList) {\n            NSLog(@\"Here is a date:\
  \ %@\", d);\n        }\n    }\n}\n```\n\n这种类型的循环被称为快速遍历，它是遍历数组项的一种极其高效的方式。有一个限制：你可以在遍历数组时不能添加或删除项。\n\
  \n\n数组有两种口味：\n\n- `NSArray` 实例创建时带有指针列表。你永远无法从该数组中添加或移除指针。\n- `NSMutableArray` 实例与\
  \ `NSArray` 类似，但你可以添加和移除指针。（`NSMutableArray` 是 `NSArray` 的子类。更多信息见第 18 章）\n修改你的示例以使用\
  \ `NSMutableArray` 实例以及该类的方法：\n\n```objc\n#import <Foundation/Foundation.h>\n{\n\
  \    @autoreleasepool {\n        // 创建三个 NSDate 对象\n        NSDate *now = [NSDate\
  \ date];\n        NSDate *tomorrow = [now dateByAddingTimeInterval:24.0 * 60.0 *\
  \ 60.0];\n        // 创建一个空数组\n        NSMutableArray *dateList = [NSMutableArray\
  \ array];\n        // 将日期添加到数组\n        [dateList addObject:now];\n        [dateList\
  \ addObject:tomorrow];\n        [dateList insertObject:yesterday atIndex:0];\n \
  \       for (NSDate *d in dateList) {\n            NSLog(@\"Here is a date: %@\"\
  , d);\n        }\n        // 移除昨天\n        NSLog(@\"Now the first date is %@\",\
  \ [dateList objectAtIndex:0]);\n    }\n    return 0;\n}\n```\n## 挑战\n\n创建一个名为 Groceries\
  \ 的 Foundation 命令行工具。从创建一个空的 `NSMutableArray` 对象开始。然后向数组中添加几个杂货之类的物品（你也需要创建这些物品）。最后，使用快速遍历打印出你的购物列表。\n\
  \n下一个挑战确实，嗯，更具挑战性。请通读以下程序，它会寻找包含两个相邻 A 的常见专名。\n\n```objc\n#import <Foundation/Foundation.h>\n\
  int main (int argc, const char * argv[])\n{\n    @autoreleasepool {\n        //\
  \ 将一个文件读取为巨大的字符串（忽略错误的可能性）\n        NSString *nameString = [NSString stringWithContentsOfFile:@\"\
  /usr/share/dict/propernames\" encoding:NSUTF8StringEncoding];\n    }\n}\n```\n\n\
  \n\n\n```objc\nerror:NULL];\n\n// Break it into an array of strings\nNSArray *names\
  \ = [nameString componentsSeparatedByString:@\"\\n\"];\n\n// Go through the array\
  \ one string at a time\nfor (NSString *n in names) {\n    // Look for the string\
  \ \"aa\" in a case-insensitive manner\n    NSRange r = [n rangeOfString:@\"AA\"\
  \ options:NSCaseInsensitiveSearch];\n    // Was it found?\n    if (r.location !=\
  \ NSNotFound) {\n        NSLog(@\"%@\", n);\n    }\n}\nreturn 0;\n}\n```\n\n`/usr/share/dict/propernames`\
  \ 文件包含常见的专有名词。`/usr/share/dict/words` 文件包含普通单词（不是专有名词）。现在，根据上面的代码编写一个程序，找出既是专有名词又是普通单词的词。例如，“Glen”是一个男的名字，而“glen”狭狭的山谷。\n\
  \n当计算机对字符串进行排序时，通常会认为大写字母在小写字母之前。要进行不区分大小写的比较，请使用 `caseInsensitiveCompare:` 方法。\n\
  \n```objc\nNSString *a = @\"ABC\";\nNSString *b = @\"abc\";\n\nif ([a caseInsensitiveCompare:b]\
  \ == NSOrderedSame) {\n    NSLog(@\"a and b are equal\");\n}\n\nif ([a caseInsensitiveCompare:b]\
  \ == NSOrderedAscending) {\n    NSLog(@\"a comes before b\");\n}\n\nif ([a caseInsensitiveCompare:b]\
  \ == NSOrderedDescending) {\n    NSLog(@\"b comes before a\");\n}\n```\n\n在本次挑战中，使用\
  \ `caseInsensitiveCompare:` 来验证“Glen”和“glen”是等价的。\n\n# 16 开发者文档\n\n在上一章中，我为你提供了一些关于\
  \ `NSArray` 类的有用知识。当你开始在没有我的指导下编程时（包括完成本书中的`Challenges`时），你需要自己寻找这些知识。这正是 Apple\
  \ 文档派用用场。\n\n要在 Xcode 中查看文档，请打开 Organizer（点击 Xcode 窗口右上角的 !![开发者文档](img/00037.jpg)\
