    # ## Chapter 8: Object-Oriented Programming in Ruby


    In this chapter, we''ll delve into the core principles of object-oriented programming
    (OOP) using Ruby. Object-oriented programming is a powerful paradigm that allows
    you to create structured, modular, and reusable code. We''ll cover the concepts
    of classes, objects, inheritance, encapsulation, and polymorphism, providing you
    with practical examples to enhance your understanding.


    ### Classes and Objects


    At the heart of object-oriented programming are classes and objects. A class defines
    a blueprint for creating objects, while an object is an instance of a class.


    #### Defining a Class


    You define a class using the `class` keyword.


    ```ruby


    class Person


    def initialize(name, age)


    @name = name


    @age = age


    end


    end


    ```


    In this example, we define a `Person` class with an `initialize` method that sets
    the `name` and `age` instance variables.


    #### Creating Objects


    You create objects from a class using the `new` method.


    ```ruby


    person1 = Person.new("Alice", 25)


    person2 = Person.new("Bob", 30)


    ```


    #### Instance Variables


    Instance variables (prefixed with `@`) hold the state of an object.


    ```ruby


    class Person


    def initialize(name, age)


    @name = name


    @age = age


    end


    end


    person = Person.new("Alice", 25)


    puts "#{person.name} is #{person.age} years old."


    ```


    ### Inheritance


    Inheritance allows you to create a new class based on an existing one, inheriting
    its attributes and behaviors. The new class is called a subclass, and the existing
    class is the superclass.


    ```ruby


    class Student < Person


    def initialize(name, age, grade)


    super(name, age)


    @grade = grade


    end


    end


    ```


    In this example, the `Student` class inherits from the `Person` class. The `super`
    keyword is used to call the superclass''s `initialize` method.


    ### Encapsulation


    Encapsulation involves bundling data (attributes) and methods (behaviors) that
    operate on that data within a single unit.


    ```ruby


    class BankAccount


    def initialize(balance)


    @balance = balance


    end


    def deposit(amount)


    @balance += amount


    end


    def withdraw(amount)


    if @balance >= amount


    @balance -= amount


    else


    puts "Insufficient funds."


    end


    end


    end


    ```


    In this example, the `BankAccount` class encapsulates the `balance`, `deposit`,
    and `withdraw` methods.


    ### Polymorphism


    Polymorphism allows objects of different classes to be treated as objects of a
    common superclass.


    ```ruby


    class Shape


    def area


    raise NotImplementedError, "Subclasses must implement this method."


    end


    end


    class Circle < Shape


    def initialize(radius)


    @radius = radius


    end


    def area


    Math::PI * @radius**2


    end


    end


    class Rectangle < Shape


    def initialize(width, height)


    @width = width


    @height = height


    end


    def area


    @width * @height


    end


    end


    ```


    In this example, `Circle` and `Rectangle` are subclasses of `Shape`, and they
    both implement the `area` method. This demonstrates polymorphism, as objects of
    different classes can be treated as `Shape` objects.


    ### Examples


    Let''s see how object-oriented programming works with practical examples:


    #### Example 1: Creating and Using Classes


    ```ruby


    class Car


    def initialize(make, model)


    @make = make


    @model = model


    end


    def drive


    puts "#{@make} #{@model} is driving."


    end


    end


    car1 = Car.new("Toyota", "Camry")


    car2 = Car.new("Honda", "Civic")


    car1.drive


    car2.drive


    ```


    #### Example 2: Inheriting and Extending Classes


    ```ruby


    class Animal


    def speak


    raise NotImplementedError, "Subclasses must implement this method."


    end


    end


    class Dog < Animal


    def speak


    puts "Woof!"


    end


    end


    class Cat < Animal


    def speak


    puts "Meow!"


    end


    end


    dog = Dog.new


    cat = Cat.new


    dog.speak


    cat.speak


    ```


    ### Conclusion


    Object-oriented programming is a powerful paradigm that enables you to create
    structured, modular, and reusable code. In this chapter, we''ve explored the concepts
    of classes, objects, inheritance, encapsulation, and polymorphism in Ruby. By
    understanding and applying these principles, you can design and build complex
    applications in a more organized and efficient manner. Object-oriented programming
    encourages modular design, code reuse, and maintainability, which are crucial
    skills for any programmer.


    # ## Chapter 9: Error Handling and Exceptions


    In this chapter, we''ll explore the importance of error handling and how to manage
    exceptions in Ruby. Exception handling is crucial for writing robust and reliable
    code that gracefully handles unexpected situations and prevents crashes. We''ll
    cover the basics of exceptions, how to raise and rescue them, and provide practical
    examples to enhance your understanding.


    ### Understanding Exceptions


    In programming, an exception is an event that occurs during the execution of a
    program that disrupts the normal flow of instructions. These events can be caused
    by various reasons, such as invalid inputs, unexpected behaviors, or external
    factors.


    Ruby provides a built-in mechanism to handle exceptions, ensuring that your program
    doesn''t come to a halt when unexpected errors occur.


    ### Raising Exceptions


    You can explicitly raise exceptions using the `raise` keyword. This is useful
    when you want to signal an exceptional condition in your code.'
