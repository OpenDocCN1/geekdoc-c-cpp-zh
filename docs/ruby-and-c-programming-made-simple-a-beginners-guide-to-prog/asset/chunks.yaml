  trans: "\n\n除了条件语句和循环外，如 `break` 和 `continue` 等控制流语句为循环内部的执行流提供了额外的控制。\n\n`break`\
    \ 语句用于终止当前循环并继续执行循环之外的语句。它在某些条件下提前退出循环非常有用。这里有一个示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  for (int i = 0; i < 5; i++) {\n    if (i == 3) {\n      break;\n\
    \    }\n    std::cout << \"Count: \" << i << std::endl;\n  }\n  return 0;\n}\n\
    ```\n\n在这个示例中，`for` 循环遍历 `i` 从 0 到 4 的值。然而，当 `i` 变为 3 时，遇到了 `break` 语句，循环随终止。因此，只显示了计数\
    \ 0、1 和 2。\n\n`continue` 语句用于跳过当前迭代的剩余部分，并继续循环的下一次迭代。当我们想要根据特定条件跳过某些迭代时，它非常有用。这里有一个示例：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n  for (int i = 0; i < 5; i++) {\n\
    \    if (i == 2) {\n      continue;\n    }\n    std::cout << \"Count: \" << i\
    \ << std::endl;\n  }\n  return 0;\n}\n```\n\n在这个示例中，当 `i` 变为 2 时，遇到了 `continue`\
    \ 语句，跳过了该迭代中下方的代码。因此，计数 2 被跳过了，剩余的计数 0、1、3 和 4 被显示出来。\n\n## 结论\n\n在本章中，我们探索了 C++\
    \ 中的控制流和决策结构。我们学习了诸如 `if-else` 语句等条件语句，它允许我们根据某些条件执行不同的代码块。我们还探索了循环，包括用于在条件为真时重复代码块的\
