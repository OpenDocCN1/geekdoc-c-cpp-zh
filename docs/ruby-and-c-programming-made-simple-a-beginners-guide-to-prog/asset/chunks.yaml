    double area = rect1.calculateArea();    // 访问并调用 ''calculateArea'' 方法


    std::cout << "Area: " << area << std::endl;

    ```


    在这个示例中，我们使用点运算符 `.` 访问了 `rect1` 对象的属性并为它们赋值。我们还调用了 `calculateArea()` 方法来计算矩形的面积。


    ## 构造函数与析构函数


    构造函数和析构函数是类中特殊的成员函数，分别在对象创建和销毁时自动调用。


    构造函数用于初始化对象的属性并执行任何必要的设置。它的名称与类相同，且声明时没有返回类型。这是一个示例：


    ```cpp

    class Rectangle {

    public:

    double length;

    double width;


    // 构造函数

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }

    };

    ```


    在这个示例中，我们为 `Rectangle` 类定义了一个构造函数，它接受两个参数 `len` 和 `wid`，用于初始化 `length` 和 `width`
    属性。


    析构函数用于在对象销毁之前清理资源并执行任何必要的最终处理。它的名称与类相同，但前面有一个波浪号 (`~`)，且声明时没有参数。这是一个示例：


    ```cpp

    class Rectangle {

    public:

    double length;

    double width;


    // 构造函数

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }


    // 析构函数

    ~Rectangle() {

    // 在此处编写清理代码

    }

    };

    ```


    在这个示例中，我们为 `Rectangle` 类添加了一个析构函数。析构函数可以释放任何动态分配的内存或执行其他清理任务。


    ## 封装与数据隐藏


    面向对象编程（OOP）的核心原则之一封装，它将数据和相关功能打包到单个单元（类）中。封装允许数据被隐藏或防止从类外部直接访问和操作。数据的访问通过方法（如
    getter 和 setter）来控制。


    这是一个演示封装和数据隐藏的示例：


    ```cpp

    class BankAccount {

    private:

    std::string accountNumber;

    double balance;


    public:

    // accountNumber 的 getter

    std::string getAccountNumber() {

    return accountNumber;

    }


    // balance 的 setter

    void setBalance(double amount) {

    if (amount >= 0) {

    balance = amount;

    }

    }

    };

    ```


    在这个示例中，`accountNumber` 属性被标记为 `private`，防止了从类外部直接访问它。提供了 `getAccountNumber()`
    方法作为公共 getter 来访问账号。同样，`balance` 属性被标记为 `private`，并提供了 `setBalance()` 方法作为公共 setter
    来控制 `balance` 属性的访问和验证。


    ## 继承


    继承机制允许一个类继承另一个类的属性和行为。被继承的类被称为基类或父类，而继承它的类被称为派生类或子类。继承促进了代码重用并允许创建类层次结构。


    这是一个继承的示例：


    ```cpp

    class Shape {

    public:

    virtual double calculateArea() = 0;

    };


    class Rectangle : public Shape {

    public:

    double length;

    double width;

    double calculateArea() override {

    return length * width;

    }

    };

    ```


    在这个示例中，我们有一个名为 `Shape` 的基类，它定义了一个纯虚方法 `calculateArea()`。`Rectangle` 类使用 `public`
    访问修符派自 `Shape` 类。它重写了 `calculateArea()` 方法，为计算矩形面积提供了特定的实现。


    ## 多态


    多态允许不同类的对象被视为共同基类的对象。多态允许使用单一接口来表示多个类。它使得编写的代码可以处理不同类型的对象，而无需知道它们的具体类型。


    这是一个演示多态的示例：


    ```cpp

    class Shape {

    public:

    virtual double calculateArea() = 0;

    };


    class Rectangle : public Shape {

    public:

    double length;

    double width;

    double calculateArea() override {

    return length * width;

    }

    };


    class Circle : public Shape {

    public:

    double radius;

    double calculateArea() override {

    return 3.14 * radius * radius;

    }

    };


    void printArea(Shape* shape) {

    std::cout << "Area: " << shape->calculateArea() << std::endl;

    }


    int main() {

    Rectangle rect;

    rect.length = 5.0;

    rect.width = 3.0;

    Circle circle;

    circle.radius = 4.0;

    printArea(&rect);

    printArea(&circle);

    return 0;

    }

    ```


    在这个示例中，我们有一个带有纯虚方法 `calculateArea()` 的基类 `Shape`。`Rectangle` 和 `Circle` 类派自 `Shape`
    类，并提供了它们各自的 `calculateArea()` 方法实现。`printArea()` 函数接收一个指向 `Shape` 对象的指针并调用它的 `calculateArea()`
    方法，演示了多态行为。


    ## 结论


    在本章中，我们探索了 C++ 中的面向对象编程（OOP）概念。我们学习了类和对象、成员访问以及构造函数和析构函数的概念。我们还探索了封装与数据隐藏、继承以及多态。通过理解和应用
    OOP 概念，你可以设计并实现结构良好的代码。


