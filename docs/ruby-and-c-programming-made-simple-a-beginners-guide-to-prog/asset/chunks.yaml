  raw: '# ## Chapter 5: Control Structures: Conditionals and Loops


    In this chapter, we''ll explore the powerful control structures that Ruby offers
    to manipulate the flow of your programs. Understanding conditionals and loops
    is essential for creating dynamic and responsive applications. We''ll cover if
    statements, case statements, while loops, for loops, and provide practical examples
    to solidify your understanding.


    ### Conditional Statements


    Conditional statements allow your program to make decisions and execute different
    blocks of code based on certain conditions. The most common conditional statement
    is the `if` statement.


    #### If Statement


    The `if` statement executes a block of code if a given condition is true.


    ```ruby


    temperature = 25


    if temperature > 30


    puts "It''s hot outside!"


    elsif temperature > 20


    puts "It''s warm outside."


    else


    puts "It''s cool outside."


    end


    ```


    #### Case Statement


    The `case` statement provides a way to compare a value against multiple possible
    matches.


    ```ruby


    day = "Wednesday"


    case day


    when "Monday"


    puts "Start of the week"


    when "Wednesday"


    puts "Middle of the week"


    when "Friday"


    puts "End of the week"


    else


    puts "Other days"


    end


    ```


    ### Loops


    Loops enable you to repeat a block of code multiple times. They are essential
    for automating repetitive tasks and processing collections of data.


    #### While Loop


    The `while` loop continues executing a block of code as long as a given condition
    is true.


    ```ruby


    counter = 1


    while counter <= 5 do


    puts "Count: #{counter}"


    counter += 1


    end


    ```


    #### For Loop


    The `for` loop iterates through a range or a collection.


    ```ruby


    for i in 1..5 do


    puts "Number: #{i}"


    end


    ```


    ### Iterating through Collections


    Ruby provides convenient ways to iterate through arrays and hashes.


    #### Array Iteration


    ```ruby


    fruits = ["apple", "banana", "orange"]


    fruits.each do |fruit|


    puts "Fruit: #{fruit}"


    end


    ```


    #### Hash Iteration


    ```ruby


    person = { "name" => "John", "age" => 30, "city" => "New York" }


    person.each do |key, value|


    puts "#{key}: #{value}"


    end


    ```


    ### Break and Next


    In loops, you can use the `break` statement to exit the loop prematurely and the
    `next` statement to skip the current iteration and proceed to the next one.


    ```ruby


    for i in 1..10 do


    if i == 5


    break


    elsif i % 2 == 0


    next


    end


    puts "Number: #{i}"


    end


    ```


    ### Examples


    Let''s explore some examples to see these control structures in action:


    #### Example 1: Using a Loop to Calculate Factorials


    ```ruby


    number = 5


    factorial = 1


    while number > 1 do


    factorial *= number


    number -= 1


    end


    puts "Factorial: #{factorial}"


    ```


    #### Example 2: Checking Grading Criteria


    ```ruby


    score = 85


    if score >= 90


    puts "A"


    elsif score >= 80


    puts "B"


    elsif score >= 70


    puts "C"


    else


    puts "F"


    end


    ```


    #### Example 3: Iterating through an Array


    ```ruby


    numbers = [1, 3, 5, 7, 9]


    numbers.each do |num|


    puts "Square of #{num}: #{num * num}"


    end


    ```


    ### Conclusion


    Control structures such as conditionals and loops are essential tools in your
    programming toolkit. They allow you to create dynamic, responsive, and efficient
    programs. In this chapter, we''ve explored `if` and `case` statements for making
    decisions and `while` and `for` loops for iterating through code. By understanding
    and practicing these control structures, you''re well on your way to building
    more complex and interactive Ruby programs. In the next chapter, we''ll delve
    into functions and methods, which will enable you to encapsulate and reuse code
    effectively.


    # ## Chapter 6: Functions and Methods


    In this chapter, we''ll dive into the world of functions and methods in Ruby.
    Functions and methods are essential for organizing your code, making it modular,
    and promoting reusability. We''ll explore how to define, call, and work with functions
    and methods, providing you with practical examples to solidify your understanding.


    ### Functions vs. Methods


    In Ruby, functions are often referred to as methods. While the terms are used
    interchangeably, there''s a slight distinction. Methods are associated with objects,
    while functions are not. In other words, methods are functions that are associated
    with a particular object or data type.


    ### Defining Methods


    Defining a method involves specifying its name, parameters, and the code block
    it should execute.


    ```ruby


    def greet(name)


    puts "Hello, #{name}!"


    end


    ```


    In this example, we define a method named `greet` that takes a parameter `name`.
    When the method is called, it will print a greeting message with the provided
    name.


    ### Calling Methods


    Calling a method involves using its name and providing the required arguments.


    ```ruby


    greet("Alice")


    ```


    This call to the `greet` method will print "Hello, Alice!"


    ### Return Values


    Methods can also return values using the `return` keyword.


    ```ruby


    def add(a, b)


    return a + b


    end


    result = add(5, 3)


    puts "Sum: #{result}"


    ```


    The method `add` takes two parameters, adds them, and returns the result. The
    returned value is stored in the `result` variable and then printed.


    ### Default Parameters


    You can provide default values for method parameters.


    ```ruby


    def welcome(name = "Guest")


    puts "Welcome, #{name}!"


    end


    welcome("Alice")


    welcome


    ```


    The method `welcome` has a default parameter value of "Guest." If no argument
    is provided, it uses the default value.


    ### Variadic Methods


    Ruby supports variadic methods, which can accept a variable number of arguments.


    ```ruby


    def sum(*numbers)


    total = 0


    numbers.each do |num|


    total += num


    end


    return total


    end


    result = sum(1, 2, 3, 4)


    puts "Total: #{result}"


    ```


    The method `sum` accepts any number of arguments and calculates their sum.


    ### Example: Building a Calculator


    Let''s put our knowledge to work with an example: building a simple calculator.


    ```ruby


    def add(a, b)


    return a + b


    end


    def subtract(a, b)


    return a - b


    end


    def multiply(a, b)


    return a * b


    end


    def divide(a, b)


    if b == 0


    return "Cannot divide by zero"


    else


    return a / b


    end


    end


    puts "Enter two numbers:"


    num1 = gets.to_f


    num2 = gets.to_f


    puts "Select operation: (+, -, *, /)"


    operation = gets.chomp


    case operation


    when "+"


    result = add(num1, num2)


    when "-"


    result = subtract(num1, num2)


    when "*"


    result = multiply(num1, num2)


    when "/"


    result = divide(num1, num2)


    else


    result = "Invalid operation"


    end


    puts "Result: #{result}"


    ```


    In this example, we define four methods for basic arithmetic operations and then
    build a calculator that takes user input for numbers and operation, and then performs
    the desired operation.


    ### Conclusion


    Functions and methods are essential components of any programming language. In
    this chapter, we''ve explored how to define, call, and work with methods in Ruby.
    By using methods, you can organize your code, make it more modular, and promote
    reusability. You''ve also learned about return values, default parameters, and
    variadic methods. With this knowledge, you can start creating more complex and
    organized programs.


    # ## Chapter 7: Arrays and Hashes


    In this chapter, we''ll explore two essential data structures in Ruby: arrays
    and hashes. Arrays allow you to store ordered collections of items, while hashes
    enable you to store key-value pairs for efficient data retrieval. We''ll delve
    into how to work with arrays and hashes, perform common operations, and provide
    practical examples to solidify your understanding.


    ### Arrays


    Arrays are collections of items, where each item has an index indicating its position
    in the array. Arrays are versatile and can store elements of any data type.


    #### Creating Arrays


    You can create an array using square brackets and separating elements with commas.


    ```ruby


    fruits = ["apple", "banana", "orange"]


    ```


    #### Accessing Array Elements


    You can access elements using their index.


    ```ruby


    first_fruit = fruits[0]


    second_fruit = fruits[1]


    ```


