    \n多态通常通过指向基基类的指针或引用来实现。这里有一个示例：\n\n```cpp\nShape* shapePtr;\nShape& shapeRef;\n\
    Rectangle rect(5, 3);\nCircle circle(4);\nshapePtr = &rect;\nshapeRef = circle;\n\
    int area = shapePtr->calculateArea();\n```\n\n在这个示例中，我们声明了一个类型为 `Shape` 的指针 `shapePtr`\
    \ 和引用 `shapeRef`。然后，我们创建了派生类 `Rectangle` 和 `Circle` 的对象。我们可以将 `Rectangle` 对象的地址赋值给\
    \ `shapePtr`，并将 `Circle` 对象赋值给 `shapeRef`。我们可以使用指针 `shapePtr` 调 `calculateArea()`\
    \ 方法，这展示了多态行为。\n\n### 虚拟函数\n\n为了实现多态，我们在基类中使用虚拟函数。虚拟函数在基类中用 `virtual` 关键字声明，并可以在派生类中被重写。这里有一个示例：\n\
    \n```cpp\nclass Shape {\npublic:\n    virtual int calculateArea() {\n        return\
    \ 0;\n    }\n};\n\nclass Rectangle : public Shape {\npublic:\n    int calculateArea()\
    \ override {\n        return width * height;\n    }\n};\n\nclass Circle : public\
    \ Shape {\npublic:\n    int calculateArea() override {\n        return 3.14 *\
    \ radius * radius;\n    }\n};\n```\n\n在这个示例中，`Shape` 类声明了一个虚拟的 `calculateArea()`\
    \ 方法。派生类 `Rectangle` 和 `Circle` 重写了该方法以提供它们特定的实现。当通过基类的指针或引用调用该方法时，将调用相应的派生类实现。\n\
    \n### 纯虚拟函数\n\n纯虚拟是在基类中没有实现的虚拟函数。它使用 `virtual` 关键字后跟 `= 0` 来声明。纯虚拟函数使基类成为抽象类，派生类必须重写它们。这里有一个示例：\n\
    \n```cpp\nclass Shape {\npublic:\n    virtual int calculateArea() = 0;\n};\n```\n\
    \n在这个示例中，`Shape` 类声明了一个纯虚拟的 `calculateArea()` 方法。由于它没有实现，我们无法创建 `Shape` 类的对象。然而，我们可以创建派生类的对象并使用它们对方法的特定实现。\n\
    \n## 结论\n\n继承和多态是面向对象编程的强大特性。继承允许我们基于现有类创建新类，促进了代码的重用和扩展性。多态使得不同类型的对象可以被视为公共基类对象，提供了灵活性和抽象。\n\
    \n通过利用继承和多态，我们可以设计并实现更模块化、可维护且灵活的代码。它们是面向对象编程中的核心概念，在构建复杂的软件系统中起着至关重要的作用。\n\n\
    # 第 12 章：文件处理\n\n在本章中，我们将探索 C++ 中的文件处理。文件处理允许我们从文件中读取数据、向文件中写入数据以及操作文件。文件为数据提供了持久存储介质，使我们能够在程序执行周期之外存储信息。\n\
    \n## 打开和关闭文件\n\n要执行文件操作，我们需要首先打开文件。C++ 提供了 `fstream` 库，其中包含 `ifstream` 和 `ofstream`\
    \ 类分别用于读取和写入文件。这里有一个示例：\n\n```cpp\n#include <fstream>\nint main() {\n    std::ofstream\
    \ outputFile;\n    outputFile.open(\"example.txt\"); // 打开文件\n    // 文件操作\n  \
    \  outputFile.close(); // 关闭文件\n    return 0;\n}\n```\n\n在这个示例中，我们创建了一个名为 `outputFile`\
    \ 的 `ofstream` 对象并打开了 `example.txt`。在执行文件操作后，我们关闭了文件。\n\n## 向文件写入\n\n要向文件中写入数据，我们使用输出流\
    \ (`ofstream`) 和插入运算符 `<<` 来写入文件。这里有一个示例：\n\n```cpp\n#include <fstream>\nint main()\
    \ {\n    std::ofstream outputFile;\n    outputFile.open(\"example.txt\"); // 打开文件\n\
    \    outputFile << \"Hello World!\" << std::endl; // 写入数据\n    outputFile.close();\
    \ // 关闭文件\n    return 0;\n}\n```\n\n在这个示例中，我们打开 `example.txt` 并使用 `<<` 运算符写入 \"\
    Hello World!\"。最后，我们关闭文件。\n\n## 从文件中读取\n\n要从文件中读取数据，我们使用输入流 (`ifstream`) 和提取运算符\
    \ `>>` 来读取文件。这里有一个示例：\n\n```cpp\n#include <fstream>\n#include <iostream>\n#include\
    \ <string>\nint main() {\n    std::ifstream inputFile;\n    inputFile.open(\"\
    example.txt\"); // 打开文件\n    std::string line;\n    while (std::getline(inputFile,\
    \ line)) { // 读取数据\n        std::cout << line << std::endl; // 输出数据\n    }\n \
    \   inputFile.close(); // 关闭文件\n    return 0;\n}\n```\n\n在这个示例中，我们打开 `example.txt`\
    \ 并使用 `getline` 逐行读取数据。\n\n## 错误处理\n\n在处理文件时，处理潜在的错误至关重要。我们可以检查文件的状态以确保操作成功。这里有一个示例：\n\
    \n```cpp\n#include <fstream>\n#include <iostream>\n#include <string>\nint main()\
    \ {\n    std::ifstream inputFile;\n    inputFile.open(\"example.txt\"); // 打开文件\n\
    \    if (inputFile.is_open()) { // 检查是否打开\n        std::string line;\n       \
    \ while (std::getline(inputFile, line)) { // 读取数据\n            std::cout << line\
    \ << std::endl; // 输出数据\n        }\n        inputFile.close(); // 关闭文件\n    }\
    \ else {\n        std::cout << \"无法打开文件。\" << std::endl;\n    }\n    return 0;\n\
    }\n```\n\n在这个示例中，我们使用 `is_open()` 方法检查文件是否成功打开。如果打开，则进行读取。\n\n## 文件模式\n\n在打开文件时，我们可以根据需要指定不同的文件模式。常用的模式包括：\n\
    \n- `std::ios::in`: 以读模式打开。\n- `std::ios::out`: 以写模式打开。\n- `std::ios::app`: 在文件末尾追加数据。\n\
    - `std::ios::binary`: 以二进制模式打开。\n- `std::ios::ate`: 打开时移动到文件末尾。\n\n文件模式可以使用按位或运算符\
    \ (`|`) 组合。这里有一个示例：\n\n```cpp\n#include <fstream>\nint main() {\n    std::ofstream\
    \ outputFile;\n    outputFile.open(\"example.txt\", std::ios::out | std::ios::app);\
    \ // 以写入和追加模式打开\n    outputFile << \"Hello World!\" << std::endl; // 写入数据\n  \
