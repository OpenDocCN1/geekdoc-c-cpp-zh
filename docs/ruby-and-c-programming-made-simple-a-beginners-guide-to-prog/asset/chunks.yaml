    job\"] = \"Engineer\" # Adding a new key-value pair\nperson[\"age\"] = 31 # Updating\
    \ an existing value\n```\n\n#### Iterating through Hashes\n\nYou can iterate through\
    \ hashes using methods like `each` to access both keys and values.\n\n```ruby\n\
    person.each do |key, value|\n  puts \"#{key}: #{value}\"\nend\n```\n\n### Combining\
    \ Arrays and Hashes\n\nYou can create complex data structures by combining arrays\
    \ and hashes.\n\n```ruby\nstudents = [\n  { \"name\" => \"Alice\", \"age\" =>\
