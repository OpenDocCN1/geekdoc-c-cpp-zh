    puts \"Uppercase Name: #{uppercase_name}\"\n```\n\n### 示例 3：创建和操作数组\n\n```ruby\n\
    fruits = [\"apple\", \"banana\", \"orange\"]\nfruits.push(\"grape\")\nfruits.pop\n\
    puts \"Fruits: #{fruits}\"\n```\n\n## 结\n\n变量和数据类型是任何编程语言的基础，Ruby 也例外。在本章中，我们探索了变量的概念和核心数据类型，包括字符串、数字、布尔值、数组和哈希。通过理解如何处理这些基础元素，你现在准备好开始构建更复杂的动态程序。在下一章中，我们将仔细查看控制结构，它们允许你做出决策并控制代码的流。\n"
- fmt: "\n# Chapter 5: Control Structures: Conditionals and Loops\n\nIn this chapter,\
    \ we'll explore the powerful control structures that Ruby offers to manipulate\
    \ the flow of your programs. Understanding conditionals and loops is essential\
    \ for creating dynamic and responsive applications. We'll cover `if` statements,\
    \ `case` statements, `while` loops, `for` loops, and provide practical examples\
    \ to solidify your understanding.\n\n### Conditional Statements\n\nConditional\
    \ statements allow your program to make decisions and execute different blocks\
    \ of code based on certain conditions. The most common conditional statement is\
