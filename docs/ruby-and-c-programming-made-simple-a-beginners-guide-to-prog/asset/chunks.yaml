    ## Constructors and Destructors


    Constructors and destructors are special member functions of a class that are
    automatically called when objects are created and destroyed, respectively.


    A constructor is used to initialize the object''s attributes and perform any necessary
    setup. It has the same name as the class and is declared without a return type.
    Here''s an example:


    ```cpp

    class Rectangle {

    public:

    double length;

    double width;


    // Constructor

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }

    };

    ```


    In this example, we define a constructor for the `Rectangle` class that takes
    two parameters, `len` and `wid`, to initialize the `length` and `width` attributes.


    A destructor is used to clean up resources and perform any necessary finalization
    before an object is destroyed. It has the same name as the class preceded by a
    tilde (`~`) and is declared without parameters. Here''s an example:


    ```cpp

    class Rectangle {

    public:

    double length;

    double width;


    // Constructor

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }


    // Destructor

    ~Rectangle() {

    // Cleanup code here

    }

    };

    ```


    In this example, we add a destructor to the `Rectangle` class. The destructor
    can be used to release any dynamically allocated memory or perform any other cleanup
    tasks.


    ## Encapsulation and Data Hiding


    One of the key principles of OOP is encapsulation, which involves bundling data
    and related functionality into a single unit (a class). Encapsulation allows for
    the data to be hidden or protected from direct access and manipulation from outside
    the class. Access to the data is controlled through methods, such as getters and
    setters.


    Here''s an example that demonstrates encapsulation and data hiding:


    ```cpp

    class BankAccount {

    private:

    std::string accountNumber;

    double balance;


    public:

    // Getter for accountNumber

    std::string getAccountNumber() {

    return accountNumber;

    }


    // Setter for balance

    void setBalance(double amount) {

    if (amount >= 0) {

    balance = amount;

    }

    }

    };

    ```


    In this example, the `accountNumber` attribute is marked as `private`, preventing
    direct access to it from outside the class. The `getAccountNumber()` method is
    provided as a public getter to access the account number. Similarly, the `balance`
    attribute is marked as `private`, and the `setBalance()` method is provided as
    a public setter to control access and validation of the `balance` attribute.


    ## Inheritance


    Inheritance is a mechanism that allows a class to inherit the properties and behaviors
    of another class. The class being inherited from is called the base class or parent
    class, while the class inheriting from it is called the derived class or child
    class. Inheritance promotes code reuse and allows for the creation of class hierarchies.


    Here''s an example of inheritance:


    ```cpp

    class Shape {

    public:

    virtual double calculateArea() = 0;

    };


    class Rectangle : public Shape {

    public:

    double length;

    double width;

    double calculateArea() override {

    return length * width;

    }

    };

    ```


    In this example, we have a base class named `Shape` that defines a pure virtual
    method `calculateArea()`. The `Rectangle` class is derived from the `Shape` class
    using the `public` access specifier. It overrides the `calculateArea()` method
    to provide the specific implementation for calculating the area of a rectangle.


    ## Polymorphism


    Polymorphism is the ability of objects of different classes to be treated as objects
    of a common base class. Polymorphism allows for the use of a single interface
    to represent multiple classes. It enables code to be written that can work with
    objects of different types without needing to know their specific types.


    Here''s an example that demonstrates polymorphism:


    ```cpp

    class Shape {

    public:

    virtual double calculateArea() = 0;

    };


    class Rectangle : public Shape {

    public:

    double length;

    double width;

    double calculateArea() override {

    return length * width;

    }

    };


    class Circle : public Shape {

    public:

    double radius;

    double calculateArea() override {

    return 3.14 * radius * radius;

    }

    };


    void printArea(Shape* shape) {

    std::cout << "Area: " << shape->calculateArea() << std::endl;

    }


    int main() {

    Rectangle rect;

    rect.length = 5.0;

    rect.width = 3.0;

    Circle circle;

    circle.radius = 4.0;

    printArea(&rect);

    printArea(&circle);

    return 0;

    }

    ```


    In this example, we have a base class `Shape` with a pure virtual method `calculateArea()`.
    The `Rectangle` and `Circle` classes are derived from the `Shape` class and provide
    their own implementations of the `calculateArea()` method. The `printArea()` function
    takes a pointer to a `Shape` object and calls its `calculateArea()` method, demonstrating
    polymorphic behavior.


    ## Conclusion


