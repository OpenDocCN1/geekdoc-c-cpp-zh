    \ 第 4 章：运算符与表达式\n\n在第 3 章中，我们探索了 C++ 中的变量和数据类型。在本章中，我们将深入学习运算符和表达式。运算符允许我们对变量和值执行各种操作，而表达式将变量、值和运算符结合形成有意义的计算。\n\
