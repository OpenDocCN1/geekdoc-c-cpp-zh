    \n# 第 4 章：变量与数据类型\n\n在本章中，我们将深入探索 Ruby 中变量和数据类型的世界。理解如何处理变量和不同的数据类型是编写高效且动态程序的基础。我们将涵盖变量的概念，详细介绍核心数据类型，并提供实际示例来巩固你的理解。\n\
