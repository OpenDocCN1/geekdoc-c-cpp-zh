    - **Controller:** Manages the flow of data between the model and view.


    ### Creating a Simple Web Application


    Let''s create a simple web application that displays a list of items using Ruby
    on Rails.


    1\. Generate a Controller: Use the command `rails generate controller items` to
    generate a controller named "Items."


    2\. Define an Action: In the generated controller file, define an action that
    retrieves a list of items and sends them to the view.


    3\. Create a View: Create a view file that displays the list of items.


    4\. Define Routes: Set up routes to map URLs to controller actions.


    5\. Run the Application: Start the development server and access the application
    in a web browser.


    ### Handling Forms and User Input


    Web applications often involve user input through forms. Rails provides tools
    to simplify form handling.


    Let''s create a form that allows users to add new items to the list.


    1\. Generate a Model: Use the command `rails generate model item name:string`
    to generate a model for items with a "name" attribute.


    2\. Run Migrations: Run `rails db:migrate` to apply the model changes to the database.


    3\. Create a Form: In the view, create a form that collects user input for adding
    new items.


    4\. Handle Form Submission: In the controller, define an action to handle the
    form submission and create new items.


    ### Working with Databases


    Rails integrates seamlessly with databases, making it easy to store and retrieve
    data.


    1\. Configure Database: Configure the database connection in the `config/database.yml`
    file.


    2\. Create Records: Use the model to create records in the database.


    3\. Query Records: Use ActiveRecord (Rails'' ORM) to query and manipulate data.


    ### Examples


    Let''s apply our knowledge with practical examples:


    #### Example 1: Displaying a List of Articles


    Create a web application that displays a list of articles using Rails.


    ```ruby


    # Generate a controller


    rails generate controller articles


    # Define an action in the controller


    def index


    @articles = Article.all


    end


    ```


    ```html+erb


    <!-- Create a view to display articles -->


    <% @articles.each do |article| %>


    <h2><%= article.title %></h2>


    <p><%= article.content %></p>


    <% end %>


    ```


    #### Example 2: Creating a Blog Post


    Create a form that allows users to create new blog posts.


    ```ruby


    # Generate a model


    rails generate model Post title:string content:text


    # Define a form in the view


    <%= form_for @post do |f| %>


    <div class="field">


    <%= f.label :title %>


    <%= f.text_field :title %>


    </div>


    <div class="field">


    <%= f.label :content %>


    <%= f.text_area :content %>


    </div>


    <%= f.submit %>


    <% end %>


    ```


    ```ruby


    # Handle form submission in the controller


    def create


    @post = Post.new(post_params)


    if @post.save


    redirect_to @post


    else


    render ''new''


    end


    end


    private


    def post_params


    params.require(:post).permit(:title, :content)


    end


    ```


    ### Conclusion


    Web development with Ruby opens up a world of possibilities for creating dynamic,
    interactive, and feature-rich web applications. In this chapter, we''ve introduced
    the basics of web development using Ruby on Rails, including setting up the environment,
    creating controllers, handling forms, working with databases, and following the
    MVC architecture. Ruby on Rails provides a productive and developer-friendly framework
    for building modern web applications. By combining your Ruby skills with web development,
    you can create applications that have a real impact on users'' lives and experiences.


    # ## Chapter 12: Introduction to Ruby on Rails


    In this chapter, we''ll take a comprehensive look at Ruby on Rails, often referred
    to simply as Rails. Ruby on Rails is a powerful web development framework that
    follows the principles of convention over configuration and don''t repeat yourself
    (DRY). It enables developers to build robust, scalable, and maintainable web applications
    efficiently. We''ll explore the key concepts of Rails, its structure, and provide
    practical examples to solidify your understanding.


    ### What is Ruby on Rails?


    Ruby on Rails, commonly known as Rails, is an open-source web application framework
    written in the Ruby programming language. It was created by David Heinemeier Hansson
    and released in 2004\. Rails is designed to make web development easier and more
    productive by emphasizing sensible defaults, reducing repetitive tasks, and promoting
    best practices.


    ### Key Concepts of Rails


    Rails is built around several key concepts that contribute to its effectiveness
    and popularity:


    1\. **Convention over Configuration (CoC):** Rails follows the principle that
    sensible defaults and conventions are used to reduce the need for explicit configuration.
    This promotes consistency and speeds up development.


    2\. **Don''t Repeat Yourself (DRY):** Rails encourages the elimination of redundant
    code and logic. This leads to cleaner, more maintainable codebases.


    3\. **Model-View-Controller (MVC):** Rails adopts the MVC architecture to separate
    the application into three components: models (data and logic), views (user interface),
    and controllers (handling requests and interactions).


    4\. **RESTful Routing:** Rails encourages the use of Representational State Transfer
    (REST) principles for designing clean and consistent URLs and routes.


    5\. **Active Record:** Active Record is Rails'' object-relational mapping (ORM)
    layer that allows you to work with databases using Ruby objects.


    ### Setting Up a Rails Application


    To get started with Rails, you need to set up your development environment and
    create a new Rails application. Here''s an overview of the process:


    1\. **Install Ruby and Rails:** Make sure you have Ruby and Rails installed on
    your system. You can install Rails using the command `gem install rails`.


    2\. **Create a New Application:** Use the `rails new` command to create a new
    Rails application. For example, `rails new MyApp` creates an application named
    "MyApp."


    3\. **Run the Server:** Navigate to the application directory (`cd MyApp`) and
    use the command `rails server` to start the development server. By default, the
    application will be accessible at `http://localhost:3000`.


    ### The Structure of a Rails Application


    A typical Rails application has a well-defined structure that reflects its MVC
    architecture:


    - **app:** Contains subdirectories for models, views, and controllers.


    - **config:** Includes configuration files for the application, such as routes,
    database settings, and environment-specific configurations.


    - **db:** Houses database-related files, including migrations and the schema.


    - **public:** Holds static assets like images, stylesheets, and JavaScript files.


    - **test:** Contains unit tests and functional tests.


    - **Gemfile:** Lists the gems and dependencies used by the application.


    ### Creating a Simple Rails Application


    Let''s create a simple Rails application that displays a welcome message on the
    homepage.


    1\. **Generate a Controller:** Use the command `rails generate controller Welcome
    index` to generate a controller named "Welcome" with an "index" action.


    2\. **Define the Action:** In the generated controller file (`app/controllers/welcome_controller.rb`),
    define the `index` action to render a view.


    3\. **Create the View:** Create a view file (`app/views/welcome/index.html.erb`)
    that displays the welcome message.


    4\. **Start the Server:** Run the command `rails server` and access the application
    at `http://localhost:3000/welcome/index`.


    ### Handling Routes


    Routes define how URLs map to controller actions. Rails uses a routing file (`config/routes.rb`)
    to manage routes.


    ```ruby


    # config/routes.rb


    Rails.application.routes.draw do


    get ''welcome/index''


    root ''welcome#index''


    end


    ```'
