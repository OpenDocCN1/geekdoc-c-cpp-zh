    as `break` and `continue` provide additional control over the flow of execution
    within loops.


    The `break` statement is used to terminate the current loop and continue with
    the next statement outside the loop. It can be useful for prematurely exiting
    a loop under certain conditions. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    if (i == 3) {


    break;


    }


    std::cout << "Count: " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `for` loop iterates over the values of `i` from 0 to 4\.
    However, when `i` becomes 3, the `break` statement is encountered, terminating
    the loop. As a result, only the counts 0, 1, and 2 are displayed.


    The `continue` statement is used to skip the rest of the current iteration and
    continue with the next iteration of the loop. It is useful when we want to skip
    certain iterations based on specific conditions. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    if (i == 2) {


    continue;


    }


    std::cout << "Count: " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, when `i` becomes 2, the `continue` statement is encountered,
    skipping the code below it for that iteration. As a result, the count 2 is skipped,
    and the remaining counts 0, 1, 3, and 4 are displayed.


    ## Conclusion


    In this chapter, we explored control flow and decision-making structures in C++.
    We learned about conditional statements such as the `if-else` statement, which
    allows us to execute different blocks of code based on certain conditions. We
    also explored loops, including the `while` loop for repeating a block of code
    as long as a condition is true, and the `for` loop for iterating over a range
    of values or performing a specific number of iterations.


    Additionally, we covered control flow statements such


    as `break` and `continue`, which provide additional control over the flow of execution
    within loops. These statements allow us to terminate a loop prematurely or skip
    certain iterations based on specific conditions.


    By understanding and utilizing control flow and decision-making structures, you
    can create more dynamic and interactive programs in C++. You can control the flow
    of execution, make decisions based on user input or other conditions, and repeat
    code as needed.


    # Chapter 6: Arrays and Strings


    In Chapter 5, we explored control flow and decision-making structures in C++.
    In this chapter, we will delve into arrays and strings, two fundamental concepts
    that allow us to work with collections of elements efficiently.


    ## Arrays


    An array is a data structure that allows us to store multiple elements of the
    same data type in a contiguous memory block. Each element in an array is accessed
    using an index, which represents its position within the array. Arrays provide
    a convenient way to work with a collection of related data.


    ### Declaring and Accessing Arrays


    To declare an array in C++, we specify the data type of the elements followed
    by the array name and the size of the array in square brackets. Here''s an example:


    ```cpp


    int numbers[5];     // Declaration of an integer array named ''numbers'' with
    a size of 5


    ```


    Once declared, we can access individual elements of the array using their indices.
    The index of the first element is 0, the index of the second element is 1, and
    so on. Here''s an example:


    ```cpp


    int numbers[5];     // Declaration of an integer array named ''numbers'' with
    a size of 5


    numbers[0] = 10;    // Assigning the value 10 to the first element of ''numbers''


    numbers[1] = 20;    // Assigning the value 20 to the second element of ''numbers''


    numbers[2] = 30;    // Assigning the value 30 to the third element of ''numbers''


    ```


    We can also initialize an array during declaration using an initializer list.
    Here''s an example:


    ```cpp


    int numbers[] = {10, 20, 30, 40, 50};    // Declaration and initialization of
    an integer array ''numbers''


    ```


    ### Accessing Array Elements


    To access elements of an array, we use the array name followed by the index in
    square brackets. Here''s an example:


    ```cpp


    int numbers[] = {10, 20, 30, 40, 50};


    std::cout << numbers[0] << std::endl;    // Accessing and printing the value of
    the first element


    std::cout << numbers[2] << std::endl;    // Accessing and printing the value of
    the third element


    ```


    In this example, the values of the first and third elements of the `numbers` array
    are printed to the console.


    ### Array Size and Bounds


    The size of an array, which determines the number of elements it can hold, is
    specified during declaration. It is important to note that array indices start
    from 0 and go up to `size - 1`, where `size` represents the number of elements
    in the array. Accessing elements outside this range can result in undefined behavior
    and should be avoided.


    To obtain the size of an array, we can use the `sizeof` operator. Here''s an example:


    ```cpp


    int numbers[] = {10, 20, 30, 40, 50};


    int size = sizeof(numbers) / sizeof(numbers[0]);    // Calculating the size of
    the ''numbers'' array


    std::cout << "Size of ''numbers'' array: " << size << std::endl;


    ```


    In this example, the size of the `numbers` array is calculated by dividing the
    total size of the array by the size of a single element. The result is then displayed.


    ### Multidimensional Arrays


    C++ also supports multidimensional arrays, which are arrays of arrays. Multidimensional
    arrays can be used to represent matrices, tables, or any other data structure
    with multiple dimensions. Here''s an example of a two-dimensional array:


    ```cpp


    int matrix[3][3];    // Declaration of a 2D array named ''matrix'' with dimensions
    3x3


    ```


    To access elements of a multidimensional array, we use multiple indices. Here''s
    an example:


    ```cpp


    int matrix[3][3];


    matrix[0][0] = 1;   // Assigning the value 1 to the element at row 0, column 0


    matrix[1][2] = 3;   // Assigning the value 3 to the element at row 1, column 2


    ```


    ### Strings


    In C++, strings are represented as arrays of characters. A string is a sequence
    of characters enclosed in double quotes (" "). C++ provides the `string` class
    in the `<string>` header to work with strings efficiently.


    Here''s an example of declaring and initializing a string:


    ```cpp


    #include <iostream>


    #include <string>


    int main() {


    std::string greeting = "Hello, world!";    // Declaration and initialization of
    a string


    std::cout << greeting << std::endl;        // Printing the string to the console


    return 0;


    }


    ```


    In this example, the `greeting` string is declared and initialized with the value
    "Hello, world!". The string is then printed to the console using `std::cout`.


    ### String Operations


    C++ provides a variety of operations to manipulate and work with strings. Here
    are some commonly used string operations:


    - Concatenation: Strings can be concatenated using the `+` operator or the `+=`
    compound assignment operator. Here''s an example:


    ```cpp


    std::string


    firstName = "John";


    std::string lastName = "Doe";


    std::string fullName = firstName + " " + lastName;    // Concatenating strings


    std::cout << "Full name: " << fullName << std::endl;


    ```


    - Length: The `length()` or `size()` member functions can be used to obtain the
    length of a string. Here''s an example:


    ```cpp


    std::string message = "Hello, world!";


    int length = message.length();    // Getting the length of the string


    std::cout << "Length of the string: " << length << std::endl;


    ```


    - Accessing Characters: Individual characters of a string can be accessed using
    the array-like indexing notation. Here''s an example:


    ```cpp


    std::string message = "Hello, world!";


    char firstCharacter = message[0];    // Accessing the first character


    char lastCharacter = message[message.length() - 1];    // Accessing the last character


    std::cout << "First character: " << firstCharacter << std::endl;


    std::cout << "Last character: " << lastCharacter << std::endl;


    ```'
