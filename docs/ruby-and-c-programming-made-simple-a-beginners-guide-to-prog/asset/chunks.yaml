    ## 类和对象


    类是一个蓝图或模板，定义了对象的属性（特征）和行为（方法）。对象是类的实例，代表一个具有自身状态和行为的特定实体。类提供将数据和相关功能封装到单一单元的方法。


    ### 类的声明与定义


