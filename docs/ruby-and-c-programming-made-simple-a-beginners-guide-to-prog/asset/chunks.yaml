    ### Encapsulation and Data Hiding


    Encapsulation is a key principle of OOP that involves bundling data and related
    functionality into a single unit (a class). It allows for data hiding, where the
    internal details of a class are kept hidden from external access. Access to the
    data is controlled through methods, such as getters and setters.


    Here''s an example that demonstrates encapsulation and data hiding:


    ```cpp


    class BankAccount {


    private:


    std::string accountNumber;


    double balance;


    public:


    // Getter for accountNumber


    std::string getAccountNumber() {


    return accountNumber;


    }


    // Setter for balance


    void setBalance(double amount) {


    if (amount >= 0) {


    balance = amount;


    }


    }


    };


    ```


    In this example, the `accountNumber` attribute is marked as private, preventing
    direct access to it from outside the class. The `getAccountNumber()` method is
    provided as a public getter to access the account number. Similarly, the `balance`
    attribute is marked as private, and the `setBalance()` method is provided as a
    public setter to control access and validation of the balance attribute.


    ### Member Functions


    Member functions are methods defined within a class. They encapsulate the behavior
    and operations associated with the class. Member functions can access and manipulate
    the attributes of an object.


    ### Static Members


    Static members are class members that


    are shared by all instances of a class. They are independent of specific objects
    and exist even if no objects of the class are created. Static members can be accessed
    using the class name, without the need for object instantiation.


    ```cpp


    class Circle {


    public:


    static constexpr double PI = 3.14159;


    static double calculateArea(double radius) {


    return PI * radius * radius;


    }


    };


    ```


    In this example, `PI` is a static member of the `Circle` class. It is shared by
    all objects of the class and can be accessed using the class name (`Circle::PI`).
    The `calculateArea()` method is also declared as static and can be called using
    the class name (`Circle::calculateArea()`).


    ### Friend Functions


    Friend functions are functions that are not members of a class but have access
    to its private and protected members. They can be declared as friends inside a
    class to grant them special access privileges.


    ```cpp


    class Rectangle {


    private:


    double length;


    double width;


    public:


    Rectangle(double len, double wid) {


    length = len;


    width = wid;


    }


    friend double calculateDiagonal(const Rectangle& rect);


    };


    double calculateDiagonal(const Rectangle& rect) {


    return std::sqrt(rect.length * rect.length + rect.width * rect.width);


    }


    ```


    In this example, the `calculateDiagonal()` function is declared as a friend of
    the `Rectangle` class. It can access the private attributes of `Rectangle` objects,
    allowing it to calculate the diagonal length.


    ## Conclusion


    In this chapter, we explored classes and objects in C++. Classes serve as blueprints
    or templates that define the properties and behaviors of objects. Objects are
    instances of classes that have their own state and behavior. We learned how to
    declare and define classes, create objects, access class members, and use constructors
    and destructors.


    We also discussed encapsulation and data hiding, which promote data security and
    controlled access through getters and setters. Additionally, we explored static
    members, which are shared by all instances of a class, and friend functions, which
    have special access to the private and protected members of a class.


    By mastering classes and objects, you can design and implement well-structured
    and reusable code, promoting code modularity and maintainability.


    In the next chapter, we will delve into more advanced topics, including inheritance,
    polymorphism, and abstraction. Stay tuned as we expand our understanding of OOP
    in C++.


    # Chapter 11: Inheritance and Polymorphism


    Inheritance and polymorphism are two fundamental concepts in object-oriented programming
    (OOP). They allow for code reuse, extensibility, and the ability to work with
    objects of different types through a common interface. In this chapter, we will
    explore inheritance and polymorphism in C++.


    ## Inheritance


    Inheritance is a mechanism that allows a class to inherit properties (attributes
    and methods) from another class. The class being inherited from is called the
    base class or superclass, and the class inheriting from it is called the derived
    class or subclass.


    ### Base and Derived Classes


    To establish an inheritance relationship, we use the `class` keyword followed
    by the name of the derived class, a colon, and the access specifier (`public`,
    `protected`, or `private`) followed by the base class. Here''s an example:


    ```cpp


    class Shape {


    protected:


    int width;


    int height;


    public:


    Shape(int w, int h) {


    width = w;


    height = h;


    }


    int calculateArea() {


    return width * height;


    }


    };


    class Rectangle : public Shape {


    public:


    Rectangle(int w, int h) : Shape(w, h) {


    // Constructor body


    }


    };


    ```


    In this example, we have a base class `Shape` with attributes `width` and `height`
    and a method `calculateArea()`. The derived class `Rectangle` inherits from `Shape`
    using the `public` access specifier. The constructor of `Rectangle` invokes the
    constructor of `Shape` using the initialization list.


    ### Access Specifiers in Inheritance


    Inheritance introduces three access specifiers: `public`, `protected`, and `private`.
    These specifiers determine the accessibility of the inherited members in the derived
    class:


    - `public`: Inherited members are accessible as public members in the derived
    class.


    - `protected`: Inherited members are accessible as protected members in the derived
    class.


    - `private`: Inherited members are inaccessible in the derived class.


    The choice of access specifier depends on the desired level of encapsulation and
    data hiding.


