    \n# 第 8 章：Ruby 中的面向对象编程\n\n在本章中，我们将深入研究使用 Ruby 进行面向对象编程 (OOP) 的核心原理。面向对象编程是一种强大的范式，允许你创建结构化、模块化且可重用的代码。我们将涵盖类、对象、继承、封装和多态等概念，并提供实际示例来增强你的理解。\n\
