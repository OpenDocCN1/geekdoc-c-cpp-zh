    \n# 第 3 章：Ruby 语法基础\n\n在本章中，我们将深入探讨 Ruby 语法的基础构建块。理解这些基础知识至关重要，因为它们是你进入 Ruby 编程世界的基础。我们将涵盖变量、数据类型、操作符和控制结构，并提供清晰的解释和示例，以确保你能够彻底掌握这些概念。\n\
