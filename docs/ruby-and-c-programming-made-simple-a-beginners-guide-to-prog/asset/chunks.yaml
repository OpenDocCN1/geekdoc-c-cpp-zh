  trans: "\n在这个示例中，我们以读写模式打开了 `\"example.txt\"` 文件。我们使用 `seekg()` 方法并配合 `std::ios::end`\
    \ 参数将获取指针移动到文件末尾。\n\n## 总结\n\n在本章中，我们探索了 C++ 中的文件处理。我们学习了如何打开和关闭文件、向文件写入数据以及从文件中读取数据。我们看到了从文件中读写文本、处理错误以及使用不同文件模式的示例。此外，我们讨论了文件指针及其在文件操作中的作用。\n\
    \n文件处理对于各种需要数据持久化或与外部数据源交互的应用程序至关重要。理解文件处理允许我们有效地处理文件并操作存储在其中的数据。\n\n# 第 13 章：异常处理\n\
    \n异常处理是 C++ 中一种强大的机制，允许我们处理并从程序执行过程中发生的意外情况或错误。它提供了一种结构化的方式来捕获和处理异常，确保程序不会意外终止。\n\
    \n## 异常处理简介\n\n在 C++ 中，异常是表示异常状态（如运行时错误或意外事件）的对象或值。当发生异常状态时，可以使用 `throw` 语句将其“抛出”。`throw`\
    \ 语句会将控制权转移到可以处理该异常的异常处理器。\n\n处理异常的过程涉及三个关键组件：\n\n1. **抛出异常**：当发生异常状态时，我们使用 `throw`\
    \ 语句抛出一个异常。\n2. **捕获异常**：我们定义异常处理器来捕获并处理特定类型的异常。这是通过 `try` 和 `catch` 块实现的。\n3.\
    \ **处理异常**：在 `catch` 块中，我们指定捕获到特定类型异常时要执行的操作。这允许我们从错误中恢复或采取适当的。\n\n## 异常处理的语法\n\
    \nC++ 异常处理语法涉及 `try`、`catch` 和 `throw` 语句的使用：\n\n```cpp\ntry {\n    // 可能抛出异常的代码\n\
    } catch (ExceptionType1 ex1) {\n    // ExceptionType1 的处理器\n} catch (ExceptionType2\
    \ ex2) {\n    // ExceptionType2 的处理器\n} catch (...) {\n    // 任何其他异常的处理器\n}\n\
    ```\n\n在上述语法中：\n\n- `try` 块封装可能抛出异常的代码。\n- `catch` 块指定了特定类型异常的处理器。异常类型在括号内指定。\n\
    - 最后一个 `catch` 块中的 `...` 表示任何未被显式捕获的其他异常类型。\n\n当在 `try` 块内抛出异常时，程序流将根据抛出的异常类型转移到相应的\
    \ `catch` 块。\n\n## 处理标准异常\n\nC++ 提供了一组标准异常类，表示常见的异常类型。这些类定义在 `<stdexcept>` 头文件中。以下是一些常用的标准异常类：\n\
    \n- `std::exception`：所有标准异常的基类。它提供了一个 `what()` 方法，返回描述性的错误信息。\n- `std::runtime_error`：表示在运行时发生的错误，例如逻辑错误或资源失败。\n\
    - `std::logic_error`：表示由于代码逻辑错误引起的错误，例如无效参数或函数使用不当。\n- `std::out_of_range`：表示访问有效范围之外元素时发生的错误，例如索引越界。\n\
    \n```cpp\n#include <iostream>\n#include <stdexcept>\n\nint divide(int a, int b)\
    \ {\n    if (b == 0) {\n        throw std::runtime_error(\"Division by zero!\"\
    );\n    }\n    return a / b;\n}\n\nint main() {\n    try {\n        int result\
    \ = divide(10, 0);\n        std::cout << \"Result: \" << result << std::endl;\n\
    \    } catch (const std::runtime_error& e) {\n        std::cerr << \"Runtime error:\
    \ \" << e.what() << std::endl;\n    } catch (const std::exception& e) {\n    \
    \    std::cerr << \"General error: \" << e.what() << std::endl;\n    }\n    return\
    \ 0;\n}\n```\n\n在此示例中，`divide()` 除除两个数。如果 `b` 为零，它会抛出 `std::runtime_error`。在 `main()`\
    \ 中，我们捕获该异常并进行适当处理。\n\n## 创建自定义异常\n\n除了使用标准异常，我们还可以通过派生 `std::exception` 创建自己的自定义异常。自定义异常允许我们提供有关异常状态的额外信息。\n\
    \n这是一个演示自定义异常使用的示例：\n\n```cpp\n#include <iostream>\n#include <stdexcept>\n\nclass\
    \ MyException : public std::exception {\npublic:\n    const char* what() const\
    \ noexcept override {\n        return \"Custom Exception: Something went wrong!\"\
    ;\n    }\n};\n\nvoid process() {\n    throw MyException();\n}\n\nint main() {\n\
    \    try {\n        process();\n    } catch (const std::exception& e) {\n    \
    \    std::cout << \"Exception caught: \" << e.what() << std::endl;\n    }\n  \
    \  return 0;\n}\n```\n\n在此示例中，我们定义了继承自 `std::exception` 的 `MyException` 类并重写了\
    \ `what()` 方法。`process()` 函数抛出了一个 `MyException` 实例。\n\n## 异常处理最佳实践\n\n在处理异常处理时，请记住以下最佳实践：\n\
    \n- **捕获特定异常**：捕获特定类型的异常以进行适当处理。这允许进行针对性的错误处理并对程序流进行更好的控制。\n- **通过引用捕获异常**：通过引用捕获异常（`const\
    \ std::exception&`），以确保对象的正确析构并避免对象切片（object slicing）。\n- **在合适的层级处理异常**：在程序可以有效地从错误中恢复或采取必要措施的层级处理异常。避免过早或过晚捕获异常。\n\
    - **谨慎使用异常规范**：异常规范（`throw()` 或 `noexcept`）限制了函数可以抛出的异常类型。但在现代 C++ 中通常不建议使用，因为它们会干扰灵活性错误报告。\n\
    - **清理资源**：当发生异常时，确保清理已获取的资源（例如内存、文件句柄），以避免资源泄漏。\n\n# 第 14 章：模板与标准模板库 (STL)\n\n\
    模板和标准模板库 (STL) 是 C++ 的强大功能，增强了代码的可重用性并提供了一系列有用的数据结构和算法。在本章中，我们将探索模板和 STL，并学习如何在程序中使用它们。\n\
    \n## 模板\n\nC++ 模板允许泛型编程，我们能够编写适用于不同数据类型的代码，而无需为每个类型重复代码。模板提供了一种定义可以操作多种类型的类或函数的方法，这些类型被称为模板参数。\n\
    \n### 函数模板\n\n"
- fmt: "\nFunction templates allow us to create generic functions that can operate\
    \ on different types. The syntax for a function template includes the `template`\
    \ keyword followed by the template parameter(s) in angle brackets (`<>`). Here's\
    \ an example:\n\n```cpp\ntemplate <typename T>\nT add(T a, T b) {\n  return a\
    \ + b;\n}\n```\n\nIn this example, we define a function template `add()` that\
    \ takes two arguments of type `T` and returns their sum. The `T` is a placeholder\
    \ for the actual type that will be used when the function is called.\n\nWe can\
    \ call the `add()` function template with different types, and the compiler generates\
    \ the appropriate code for each type:\n\n```cpp\nint result1 = add(3, 4);    \
    \  // Calling add() with int arguments\ndouble result2 = add(2.5, 1.5); // Calling\
    \ add() with double arguments\n```\n\n### Class Templates\n\nClass templates allow\
    \ us to create generic classes that can work with different types. The syntax\
    \ for a class template is similar to that of a regular class, with the template\
    \ parameter(s) specified in angle brackets (`<>`). Here's an example:\n\n```cpp\n\
    template <typename T>\nclass Stack {\nprivate:\n  std::vector<T> elements;\npublic:\n\
    \  void push(const T& value) {\n    elements.push_back(value);\n  }\n  void pop()\
    \ {\n    elements.pop_back();\n  }\n  T top() const {\n    return elements.back();\n\
    \  }\n  bool empty() const {\n    return elements.empty();\n  }\n};\n```\n\nIn\
    \ this example, we define a class template `Stack` that represents a stack data\
    \ structure. The elements of the stack are stored in a `std::vector` container,\
    \ which is a part of the STL.\n\nWe can create instances of the `Stack` class\
    \ template for different types:\n\n```cpp\nStack<int> intStack;      // Stack\
    \ of integers\nStack<double> doubleStack; // Stack of doubles\nintStack.push(42);\n\
    doubleStack.push(3.14);\n```\n\n### Template Specialization\n\nTemplate specialization\
    \ allows us to provide a specialized implementation for specific types. It enables\
    \ us to customize the behavior of a template for specific cases. Here's an example\
    \ of template specialization for the `add()` function template:\n\n```cpp\ntemplate\
    \ <>\nstd::string add(std::string a, std::string b) {\n  return a + \" \" + b;\n\
