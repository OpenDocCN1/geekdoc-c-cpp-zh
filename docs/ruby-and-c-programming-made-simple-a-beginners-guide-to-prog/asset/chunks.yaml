    ### Rescuing Exceptions\n\nTo handle exceptions and prevent your program from\
    \ crashing, you can use the `begin`, `rescue`, and `end` keywords.\n\n```ruby\n\
    begin\n  result = divide(10, 0)\nrescue ZeroDivisionError => e\n  puts \"Error:\
    \ #{e.message}\"\nend\n```\n\nIn this example, the program tries to call the `divide`\
    \ method with a denominator of zero. Since this would raise a `ZeroDivisionError`,\
    \ the program rescues the exception and prints an error message.\n\n### Ensuring\
    \ Cleanup with Ensure\n\nYou can use the `ensure` block to ensure that certain\
    \ code runs regardless of whether an exception was raised or not.\n\n```ruby\n\
    begin\n  file = File.open(\"example.txt\")\n  # Perform operations on the file\n\
    rescue Errno::ENOENT => e\n  puts \"Error: File not found - #{e.message}\"\nensure\n\
    \  file.close if file\nend\n```\n\nIn this example, the `ensure` block ensures\
    \ that the `file` is closed even if an exception occurs.\n\n### Custom Exceptions\n\
    \nYou can create custom exceptions by subclassing the `StandardError` class.\n\
    \n```ruby\nclass CustomError < StandardError\n  def initialize(message)\n    super(message)\n\
    \  end\nend\n\ndef perform_action\n  raise CustomError, \"Something went wrong\"\
    \nend\n```\n\nIn this example, the `CustomError` class is defined by inheriting\
    \ from `StandardError`, and the `perform_action` method raises this custom exception.\n\
    \n### Handling Multiple Exceptions\n\nYou can handle multiple exceptions using\
    \ multiple `rescue` blocks or by listing them in a single block.\n\n```ruby\n\
