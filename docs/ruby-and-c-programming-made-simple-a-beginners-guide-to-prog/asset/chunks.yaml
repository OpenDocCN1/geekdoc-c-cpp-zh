    ## Input and Output Operations


    Input and output (I/O) operations are crucial for interacting with the user and
    displaying information. C++ provides the `iostream` library, which contains the
    necessary functions and objects for performing I/O operations.


    To use the `iostream` library, we include the `<iostream>` header at the beginning
    of our program:


    ```cpp


    #include <iostream>


    ```


    Let''s explore two essential I/O operations: output using `std::cout` and input
    using `std::cin`.


    ### Output using `std::cout`


    The `std::cout` object is used to display output to the console. We can use it
    to print messages, variable values, or any other information.


    Here''s an example that displays a greeting message:


    ```cpp


    #include <iostream>


    int main() {


    std::cout << "Welcome to C++ Programming!" << std::endl;


    return 0;


    }


    ```


    In the above code, the message "Welcome to C++ Programming!" is passed to `std::cout`
    using the insertion operator (`<<`). The `std::endl` manipulator is used to insert
    a newline character and flush the output stream.


    ### Input using `std::cin`


    The `std::cin` object allows us to receive input from the user. We can use it
    to store user-entered values into variables.


    Here''s an example that prompts the user to enter their age and stores it in the
    `age` variable:


    ```cpp


    #include <iostream>


    int main() {


    int age;


    std::cout << "Enter your age: ";


    std::cin >> age;


    std::cout << "Your age is: " << age << std::endl;


    return 0;


    }


    ```


    In the above code, the `std::cin` object is used with the extraction operator
    (`>>`) to receive the user''s input and store it in the `age` variable. The entered
    age is then displayed using `std::cout`.


    ## Basic Arithmetic Operations


    C++ provides several arithmetic operators for performing basic mathematical calculations.
    Let''s explore some commonly used operators:


    - Addition (`+`): Adds two values together.


    - Subtraction (`-`): Subtracts one value from another.


    - Multiplication (`*`): Multiplies two values.


    - Division (`/`): Divides one value by another.


    - Modulo (`%`): Returns the remainder of a division operation.


    Here''s an example that demonstrates the use of these operators:


    ```cpp


    #include <iostream>


    int main() {


    int a = 10;


    int b = 5;


    int sum = a + b;            // Addition


    int difference = a - b;     // Subtraction


    int product = a * b;        // Multiplication


    int quotient = a / b;       // Division


    int remainder = a % b;      // Modulo


    std::cout << "Sum: " << sum << std::endl;


    std::cout << "Difference: " << difference << std::endl;


    std::cout << "Product: " << product << std::endl;


    std::cout << "Quotient: " << quotient << std::endl;


    std::cout << "Remainder: " << remainder << std::endl;


    return 0;


    }


    ```


    In the above code, the variables `a` and `b` hold the values 10 and 5, respectively.
    The arithmetic operators are used to perform addition, subtraction, multiplication,
    division, and modulo operations. The results are then displayed using `std::cout`.


    ## Conclusion


    In this chapter, we explored the fundamentals of C++ programming. We learned about
    variables and data types, including integers, floating-point numbers, characters,
    and booleans. Additionally, we discovered how to perform input/output operations
    using `std::cout` and `std::cin` for displaying messages and receiving user input.


    Furthermore, we explored basic arithmetic operations using operators such as addition,
    subtraction, multiplication, division, and modulo. These operations enable us
    to perform mathematical calculations within our programs.


    Now that you have a solid understanding of these fundamental concepts, you are
    ready to explore more advanced topics in the upcoming chapters. Stay tuned as
    we dive deeper into the world of C++ programming and expand your programming skills!


    # Chapter 3: Variables and Data Types


    In Chapter 2, we briefly touched upon variables and data types in C++. In this
    chapter, we will delve deeper into these concepts and explore various data types
    available in the language. Understanding variables and data types is essential
    for effectively managing and manipulating data within a program.


    ## Variables in C++


    In C++, variables are used to store and manipulate data. Before we can use a variable,
    we need to declare it, specifying its data type and name. C++ supports a wide
    range of data types, each suited for specific kinds of data.


    ### Declaration and Initialization


    To declare a variable, we specify its data type followed by its name. Here''s
    an example:


    ```cpp


    int age;        // Declaration of an integer variable named ''age''


    float pi;       // Declaration of a floating-point variable named ''pi''


    char grade;     // Declaration of a character variable named ''grade''


    bool isValid;   // Declaration of a boolean variable named ''isValid''


    ```


    Once declared, we can assign a value to the variable using the assignment operator
    (`=`). For example:


    ```cpp


    age = 25;           // Assigning the value 25 to the ''age'' variable


    pi = 3.14159;       // Assigning the value 3.14159 to the ''pi'' variable


    grade = ''A'';        // Assigning the character ''A'' to the ''grade'' variable


    isValid = true;     // Assigning the boolean value ''true'' to the ''isValid''
    variable


    ```


    Alternatively, we can combine the declaration and assignment in a single step:


    ```cpp


    int score = 100;            // Declaration and assignment of an integer variable
    named ''score''


    double temperature = 98.6;  // Declaration and assignment of a double variable
    named ''temperature''


    char symbol = ''$'';          // Declaration and assignment of a character variable
    named ''symbol''


    bool isReady = false;       // Declaration and assignment of a boolean variable
    named ''isReady''


    ```


    ### Variable Names and Conventions


    When choosing variable names, it is important to follow certain conventions to
    ensure code readability and maintainability. Here are some common conventions:


    - Variable names should be descriptive and meaningful. For example, instead of
    using `x` or `a`, use names like `age`, `score`, or `isValid`.


    - Variable names should start with a lowercase letter. If the name consists of
    multiple words, we can use camel case or underscores to separate them. For example,
    `studentName`, `temperatureInCelsius`, or `is_valid`.


    - Avoid using reserved keywords as variable names. C++ has a set of reserved keywords
    that have predefined meanings in the language. Examples of reserved keywords include
    `int`, `float`, `char`, `bool`, and others.


    ### Scope and Lifetime of Variables


    Variables have a scope and lifetime within a program. The scope of a variable
    determines the portion of the program where the variable is accessible. The lifetime
    of a variable defines the duration for which the variable exists in memory.


    In C++, variables can have local scope or global scope. Local variables are defined
    within a specific block or function and are accessible only within that block
    or function. Global variables, on the other hand, are declared outside of any
    function and can be accessed from any part of the program.'
