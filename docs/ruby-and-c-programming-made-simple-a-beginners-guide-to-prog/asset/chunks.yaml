    \n```ruby\nis_raining = true\nis_sunny = false\n```\n\n## Operators\n\nRuby provides\
    \ various operators to perform operations on data:\n\n### Arithmetic Operators\n\
    \n```ruby\nsum = 10 + 5\ndifference = 20 - 8\nproduct = 4 * 6\nquotient = 15 /\
