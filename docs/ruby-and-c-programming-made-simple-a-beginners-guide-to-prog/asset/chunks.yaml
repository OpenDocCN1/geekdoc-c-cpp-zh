    \ such as `break` and `continue` provide additional control over the flow of execution\
    \ within loops.\n\nThe `break` statement is used to terminate the current loop\
    \ and continue with the next statement outside the loop. It can be useful for\
    \ prematurely exiting a loop under certain conditions. Here's an example:\n\n\
    ```cpp\n#include <iostream>\n\nint main() {\n  for (int i = 0; i < 5; i++) {\n\
    \    if (i == 3) {\n      break;\n    }\n    std::cout << \"Count: \" << i <<\
    \ std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example, the `for` loop iterates\
    \ over the values of `i` from 0 to 4. However, when `i` becomes 3, the `break`\
    \ statement is encountered, terminating the loop. As a result, only the counts\
    \ 0, 1, and 2 are displayed.\n\nThe `continue` statement is used to skip the rest\
    \ of the current iteration and continue with the next iteration of the loop. It\
    \ is useful when we want to skip certain iterations based on specific conditions.\
    \ Here's an example:\n\n```cpp\n#include <iostream>\n\nint main() {\n  for (int\
    \ i = 0; i < 5; i++) {\n    if (i == 2) {\n      continue;\n    }\n    std::cout\
    \ << \"Count: \" << i << std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example,\
    \ when `i` becomes 2, the `continue` statement is encountered, skipping the code\
