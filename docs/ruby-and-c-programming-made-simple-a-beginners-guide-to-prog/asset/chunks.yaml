    as objects of a common base class. It allows us to write code that can work with
    objects of different types without needing to know their specific types.


    ### Pointers and References to Base Class


    Polymorphism is often achieved using pointers or references to the base class.
    Here''s an example:


    ```cpp


    Shape* shapePtr;


    Shape& shapeRef;


    Rectangle rect(5, 3);


    Circle circle(4);


    shapePtr = &rect;


    shapeRef = circle;


    int area = shapePtr->calculateArea();


    ```


    In this example, we declare a pointer `shapePtr` and a reference `shapeRef` of
    type `Shape`. We then create objects of the derived classes `Rectangle` and `Circle`.
    We can assign the address of the `Rectangle` object to `shapePtr` and assign the
    `Circle` object to `shapeRef`. We can call the `calculateArea()` method using
    the pointer `shapePtr`, which demonstrates polymorphic behavior.


    ### Virtual Functions


    To enable polymorphism, we use virtual functions in the base class. A virtual
    function is declared in the base class with the `virtual` keyword and can be overridden
    in derived classes. Here''s an example:


    ```cpp


    class Shape {


    public:


    virtual int calculateArea() {


    return 0;


    }


    };


    class Rectangle : public Shape {


    public:


    int calculateArea() override {


    return width * height;


    }


    };


    class Circle : public Shape {


    public:


    int calculateArea() override {


    return 3.14 * radius * radius;


    }


    };


    ```


    In this example, the `Shape` class declares a virtual `calculateArea()` method.
    The derived classes `Rectangle` and `Circle` override this method to provide their
    specific implementations. When the method is called through a pointer or reference
    of the base class, the appropriate derived class implementation is invoked.


    ### Pure Virtual Functions


    A pure virtual function is a virtual function that has no implementation in the
    base class. It is declared using the `virtual` keyword followed by `= 0`. Pure
    virtual functions make the base class abstract, and derived classes must override
    them. Here''s an example:


    ```cpp


    class Shape {


    public:


    virtual int calculateArea() = 0;


    };


    ```


    In this example, the `Shape` class declares a pure virtual `calculateArea()` method.
    Since it has no implementation, we cannot create objects of the `Shape` class.
    However, we can create objects of derived classes and use their specific implementations
    of the method.


    ## Conclusion


    Inheritance and polymorphism are powerful features of object-oriented programming.
    Inheritance allows us to create new classes based on existing ones, promoting
    code reuse and extensibility. Polymorphism enables objects of different types
    to be treated as objects of a common base class, providing flexibility and abstraction.


    By leveraging inheritance and polymorphism, we can design and implement more modular,
    maintainable, and flexible code. They are essential concepts in object-oriented
    programming and play a crucial role in building complex software systems.


    # Chapter 12: File Handling


    In this chapter, we will explore file handling in C++. File handling allows us
    to read data from files, write data to files, and manipulate files. Files provide
    a persistent storage medium for data, enabling us to store information beyond
    the lifetime of a program''s execution.


    ## Opening and Closing Files


    To perform file operations, we need to open the file first. C++ provides the `fstream`
    library, which includes the `ifstream` and `ofstream` classes for reading and
    writing files, respectively. Here''s an example:


    ```cpp


    #include <fstream>


    int main() {


    std::ofstream outputFile;


    outputFile.open("example.txt");  // Open a file for writing


    // File operations


    outputFile.close();  // Close the file


    return 0;


    }


    ```


    In this example, we create an `ofstream` object named `outputFile` and open a
    file named "example.txt" for writing using the `open()` method. After performing
    file operations, we close the file using the `close()` method.


    ## Writing to a File


    To write data to a file, we use the output file stream (`ofstream`) and the insertion
    operator (`<<`) to write data to the file. Here''s an example:


    ```cpp


    #include <fstream>


    int main() {


    std::ofstream outputFile;


    outputFile.open("example.txt");  // Open a file for writing


    outputFile << "Hello, World!" << std::endl;  // Write data to the file


    outputFile.close();  // Close the file


    return 0;


    }


    ```


    In this example, we open the file "example.txt" for writing and use the `<<` operator
    to write the string "Hello, World!" to the file. The `std::endl` manipulator is
    used to insert a newline after the text. Finally, we close the file using the
    `close()` method.


    ## Reading from a File


    To read data from a file, we use the input file stream (`ifstream`) and the extraction
    operator (`>>`) to read data from the file. Here''s an example:


    ```cpp


    #include <fstream>


    #include <iostream>


    #include <string>


    int main() {


    std::ifstream inputFile;


    inputFile.open("example.txt");  // Open a file for reading


    std::string line;


    while (std::getline(inputFile, line)) {  // Read data from the file line by line


    std::cout << line << std::endl;  // Print the read data


    }


    inputFile.close();  // Close the file


    return 0;


    }


    ```


    In this example, we open the file "example.txt" for reading using the `open()`
    method. We read data from the file line by line using `std::getline()`, which
    reads a line from the file and stores it in the `line` variable. We then print
    the read data using `std::cout`. Finally, we close the file using the `close()`
    method.


    ## Error Handling


    When working with files, it is essential to handle potential errors. We can check
    the status of the file stream to ensure that file operations are successful. Here''s
    an example:


    ```cpp


    #include <fstream>


    #include <iostream>


    #include <string>


    int main() {


    std::ifstream inputFile;


    inputFile.open("example.txt");  // Open a file for reading


    if (inputFile.is_open()) {


    std::string line;


    while (std::getline(inputFile, line)) {  // Read data from the file line by line


    std::cout << line << std::endl;  // Print the read data


    }


    inputFile.close();  // Close the file


    } else {


    std::cout << "Failed to open the file." << std::endl;


    }


    return 0;


    }


    ```


    In this example, we use the `is_open()` method to check if the file was successfully
    opened. If the file is open, we proceed with reading and printing the data. Otherwise,
    we display an error message.


    ## File Modes


    When opening a file, we can specify different file modes based on our requirements.
    The common file modes include:


    - `std::ios::in`: Open the file for reading.


    - `std::ios::out`: Open the file for writing.


    - `std::ios::app`: Append data to the end of an existing file.


    - `std::ios::binary`: Open the file in binary mode.


    - `std::ios::ate`: Set the initial position of the file pointer to the end of
    the file.


    File modes can be combined using the binary OR operator (`|`). Here''s an example:


    ```cpp


    #include <fstream>


    int main() {


    std::ofstream outputFile;


    outputFile.open("example.txt", std::ios::out | std::ios::app);  // Open a file
    for writing and append data to it


    // File operations


    outputFile.close();  // Close the file


    return 0;


    }


    ```


    In this example, we open the file "example.txt" for writing and append data to
    it using the `std::ios::out | std::ios::app` file mode.


    ## File Pointers


    File pointers keep track of the current position in a file during reading or writing
    operations. The current position determines where the next operation will occur.
    The file pointer can be adjusted using the `seekg()` and `seekp()` methods. Here''s
    an example:


    ```cpp


    #include <fstream>


    int main() {


    std::fstream file;


    file.open("example.txt", std::ios::in | std::ios::out);  // Open a file for reading
    and writing


    file.seekg(0, std::ios::end);  // Move the get pointer to the end of the file


    // File operations


    file.close();  // Close the file


    return 0;


    }


    ```'
