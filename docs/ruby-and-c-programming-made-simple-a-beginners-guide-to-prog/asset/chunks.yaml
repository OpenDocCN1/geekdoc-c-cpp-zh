    In this example, the `divide` method raises a `ZeroDivisionError` if the denominator
    is zero.


    ### Rescuing Exceptions


    To handle exceptions and prevent your program from crashing, you can use the `begin`,
    `rescue`, and `end` keywords.


    ```ruby


    begin


    result = divide(10, 0)


    rescue ZeroDivisionError => e


    puts "Error: #{e.message}"


    end


    ```


    In this example, the program tries to call the `divide` method with a denominator
    of zero. Since this would raise a `ZeroDivisionError`, the program rescues the
    exception and prints an error message.


    ### Ensuring Cleanup with Ensure


    You can use the `ensure` block to ensure that certain code runs regardless of
    whether an exception was raised or not.


    ```ruby


    begin


    file = File.open("example.txt")


    # Perform operations on the file


    rescue Errno::ENOENT => e


    puts "Error: File not found - #{e.message}"


    ensure


    file.close if file


    end


    ```


    In this example, the `ensure` block ensures that the `file` is closed even if
    an exception occurs.


    ### Custom Exceptions


    You can create custom exceptions by subclassing the `StandardError` class.


    ```ruby


    class CustomError < StandardError


    def initialize(message)


    super(message)


    end


    end


    def perform_action


    raise CustomError, "Something went wrong"


    end


    ```


    In this example, the `CustomError` class is defined by inheriting from `StandardError`,
    and the `perform_action` method raises this custom exception.


    ### Handling Multiple Exceptions


    You can handle multiple exceptions using multiple `rescue` blocks or by listing
    them in a single block.


    ```ruby


    begin


    perform_action


    rescue CustomError => ce


    puts "Custom Error: #{ce.message}"


    rescue ZeroDivisionError => zde


    puts "Zero Division Error: #{zde.message}"


    rescue StandardError => se


    puts "Standard Error: #{se.message}"


    end


    ```


    ### Examples


    Let''s explore some practical examples to understand error handling better:


    #### Example 1: Handling Zero Division


    ```ruby


    def safe_divide(a, b)


    begin


    result = a / b


    rescue ZeroDivisionError => zde


    puts "Error: #{zde.message}"


    end


    end


    safe_divide(10, 0)


    ```


    #### Example 2: Reading a File


    ```ruby


    begin


    file = File.open("example.txt")


    content = file.read


    puts "File Content: #{content}"


    rescue Errno::ENOENT => e


    puts "Error: File not found - #{e.message}"


    ensure


    file.close if file


    end


    ```


    ### Conclusion


    Error handling and exception management are crucial aspects of writing reliable
    and robust programs. In this chapter, we''ve explored how to raise and rescue
    exceptions in Ruby, ensuring that your code can gracefully handle unexpected situations.
    By using `begin`, `rescue`, and `ensure` blocks, you can build programs that handle
    errors gracefully and continue functioning even when exceptions occur. Exception
    handling is an essential skill for any programmer, as it ensures that your applications
    are more resilient and user-friendly.


    # ## Chapter 10: Working with Files and Input/Output (I/O)


    In this chapter, we''ll dive into the world of working with files and input/output
    (I/O) operations in Ruby. Handling files is a fundamental skill for many programming
    tasks, such as reading data from files, writing data to files, and interacting
    with external resources. We''ll cover file modes, reading and writing files, and
    provide practical examples to enhance your understanding.


    ### File Modes


    Ruby provides different modes for working with files, allowing you to perform
    various operations. Here are some common modes:


    - `"r"`: Read-only mode (default).


    - `"w"`: Write-only mode. Creates a new file or truncates an existing file.


    - `"a"`: Append mode. Creates a new file or appends to an existing file.


    - `"r+"`: Read and write mode.


    - `"w+"`: Read and write mode. Creates a new file or truncates an existing file.


    - `"a+"`: Read and write mode. Creates a new file or appends to an existing file.


    ### Reading Files


    You can read data from a file using the `File.open` method.


    ```ruby


    file = File.open("example.txt", "r")


    content = file.read


    file.close


    puts "File Content: #{content}"


    ```


    In this example, the `"r"` mode indicates that the file should be opened for reading.
    The `read` method reads the entire content of the file.


    ### Writing to Files


    You can write data to a file using the `File.open` method with the `"w"` mode.


    ```ruby


    file = File.open("output.txt", "w")


    file.puts "Hello, world!"


    file.close


    ```


    In this example, the `"w"` mode indicates that the file should be opened for writing.
    The `puts` method writes the specified content to the file.


    ### Appending to Files


    You can append data to an existing file using the `"a"` mode.


    ```ruby


    file = File.open("log.txt", "a")


    file.puts "Log entry: Something happened."


    file.close


    ```


    In this example, the `"a"` mode indicates that the file should be opened for appending.
    The `puts` method appends the log entry to the file.


    ### Reading and Writing Files Simultaneously


    You can open a file in read-write mode using `"r+"`, `"w+"`, or `"a+"`.


    ```ruby


    file = File.open("data.txt", "r+")


    content = file.read


    file.puts "Additional data."


    file.close


    ```


    In this example, the `"r+"` mode opens the file for both reading and writing.
    The `read` method reads the existing content, and the `puts` method appends additional
    data.


    ### Examples


    Let''s apply our knowledge with practical examples:


    #### Example 1: Reading and Displaying a File


    ```ruby


    file = File.open("story.txt", "r")


    content = file.read


    file.close


    puts "Story:"


    puts content


    ```


    #### Example 2: Writing a List to a File


    ```ruby


    items = ["Apple", "Banana", "Orange", "Grape"]


    file = File.open("grocery_list.txt", "w")


    items.each do |item|


    file.puts item


    end


    file.close


    ```


    ### Conclusion


    Working with files and performing input/output (I/O) operations is a fundamental
    skill in programming. In this chapter, we''ve explored file modes, reading and
    writing files, and appending to files in Ruby. By understanding how to interact
    with files, you can create programs that manipulate data stored in external resources,
    handle data persistence, and perform various tasks involving input and output.
    Whether you''re working with text files, log files, configuration files, or any
    other type of file, the concepts covered in this chapter are essential for many
    programming tasks.


    # ## Chapter 11: Web Development with Ruby


    In this chapter, we''ll explore the world of web development using Ruby. Ruby
    offers a variety of frameworks and tools that enable you to build dynamic and
    interactive web applications. We''ll cover the basics of web development, introduce
    the popular Ruby on Rails framework, and provide practical examples to enhance
    your understanding.


    ### Introduction to Web Development


    Web development involves creating websites and web applications that are accessible
    via web browsers. This process encompasses both the frontend (user interface)
    and backend (server-side logic) components.


    ### Ruby on the Web


    Ruby''s popularity in web development can be attributed to its elegant syntax,
    developer-friendly environment, and powerful frameworks. One of the most notable
    frameworks is Ruby on Rails (often referred to as Rails), which follows the principles
    of convention over configuration and don''t repeat yourself (DRY).


    ### Getting Started with Ruby on Rails


    To start building web applications with Ruby on Rails, you need to set up the
    environment and install Rails. Here''s a high-level overview of the process:


    1\. Install Ruby: Download and install Ruby if it''s not already installed on
    your system.


    2\. Install Rails: Use the command `gem install rails` to install the Rails gem.


    3\. Create a New Rails Application: Use the command `rails new myapp` to create
    a new Rails application named "myapp."


    4\. Run the Application: Navigate to the application directory and use the command
    `rails server` to start the development server.'
