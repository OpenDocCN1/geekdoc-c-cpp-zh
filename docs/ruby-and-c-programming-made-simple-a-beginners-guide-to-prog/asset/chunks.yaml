    \ 关键字定义一个类。\n\n```ruby\nclass Person\n  def initialize(name, age)\n    @name =\
    \ name\n    @age = age\n  end\nend\n```\n\n在这个示例中，我们定义了一个 `Person` 类，它有一个 `initialize`\
    \ 方法用于设置 `name` 和 `age` 实例变量。\n\n#### 创建对象\n\n你使用 `new` 方法从类创建对象。\n\n```ruby\n\
    person1 = Person.new(\"Alice\", 25)\nperson2 = Person.new(\"Bob\", 30)\n```\n\n\
    #### 实例变量\n\n实例变量（以 `@` 前缀）持有对象的状态。\n\n```ruby\nclass Person\n  def initialize(name,\
    \ age)\n    @name = name\n    @age = age\n  end\nend\nperson = Person.new(\"Alice\"\
    , 25)\nputs \"#{person.name} is #{person.age} years old.\"\n```\n\n### 继承\n\n\
    继承允许你基于现有类创建一个新类，并继承它的属性和行为。新类被称为子类，现有类被称为父类。\n\n```ruby\nclass Student < Person\n\
    \  def initialize(name, age, grade)\n    super(name, age)\n    @grade = grade\n\
    \  end\nend\n```\n\n在这个示例中，`Student` 类继承自 `Person` 类。`super` 关键字用于调用父类的 `initialize`\
    \ 方法。\n\n### 封装\n\n封装涉及将数据（属性）和操作该数据的方法（行为）封装在单一单元中。\n\n```ruby\nclass BankAccount\n\
    \  def initialize(name, age)\n    @name = name\n    @age = age\n  end\n  def deposit(amount)\n\
    \    @balance += amount\n  end\n  def withdraw(amount)\n    if @balance >= amount\n\
    \      @balance -= amount\n    else\n      puts \"Insufficient funds.\"\n    end\n\
    \  end\nend\n```\n\n在这个示例中，`BankAccount` 类封装了 `deposit` 和 `withdraw` 方法。\n\n###\
    \ 多态\n\n多态允许不同类的对象通过共享的接口被视为公共父类的对象。\n\n```ruby\nclass Shape\n  def area\n   \
    \ raise NotImplementedError, \"Subclasses must implement this method.\"\n  end\n\
    end\n\nclass Circle < Shape\n  def initialize(radius)\n    @radius = radius\n\
    \  end\n  def area\n    Math::PI * @radius**2\n  end\nend\n\nclass Rectangle <\
    \ Shape\n  def initialize(width, height)\n    @width = width\n    @height = height\n\
    \  end\n  def area\n    @width * @height\n  end\nend\n```\n\n在这个示例中，`Circle` 和\
    \ `Rectangle` 都是 `Shape` 的子类，并且它们都实现了 `area` 方法。\n\n### 示例\n\n让我们通过一些实际示例来应用我们的知识：\n\
    \n#### 示例 1：创建和使用类\n\n```ruby\nclass Car\n  def initialize(make, model)\n    @make\
    \ = make\n    @model = model\n  end\n  def drive\n    puts \"#{@make} #{@model}\
    \ is driving.\"\n  end\nend\n\ncar1 = Car.new(\"Toyota\", \"Camry\")\ncar2 = Car.new(\"\
    Honda\", \"Civic\")\ncar1.drive\ncar2.drive\n```\n\n#### 示例 2：继承和扩展类\n\n```ruby\n\
    class Animal\n  def speak\n    raise NotImplementedError, \"Subclasses must implement\
    \ this method.\"\n  end\nend\n\nclass Dog < Animal\n  def speak\n    puts \"Woof!\"\
    \n  end\nend\n\nclass Cat < Animal\n  def speak\n    puts \"Meow!\"\n  end\nend\n\
    \ndog = Dog.new\ncat = Cat.new\ndog.speak\ncat.speak\n```\n\n### 结论\n\n面向对象编程是一种强大的范式，使能够创建结构化、模块化且可重用的代码。在本章中，我们探索了\
    \ Ruby 中的类、对象、继承、封装和多态概念。通过理解并应用这些原则，你可以更有组织地设计和构建复杂的应用程序。\n\n# 第 9 章：错误处理与异常\n\
    \n在本章中，我们将探索错误处理的重要性以及如何在 Ruby 中管理异常。异常处理对于编写健壮且可靠的代码至关重要，它可以优雅地处理意外情况并防止崩溃。我们将涵盖异常的基础知识、如何抛出和恢复异常，并提供实际示例来增强理解。\n\
    \n### 理解异常\n\n在编程中，异常是在程序执行期间发生的破坏指令执行流的事件。这些事件可能由各种原因引起，例如无效输入、意外行为或外部因素。\n\n\
    Ruby 提供了内置的异常处理机制，确保程序在发生意外错误时不会停止。\n\n### 抛出异常\n\n你可以使用 `raise` 关键字显式抛出异常。这在你想要代码中信号一个异常情况时非常有用。\n"
