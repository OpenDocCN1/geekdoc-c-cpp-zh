    pi = 3.14159;       // Assigning the value 3.14159 to the 'pi' variable\ngrade\
    \ = 'A';        // Assigning the character 'A' to the 'grade' variable\nisValid\
    \ = true;     // Assigning the boolean value 'true' to the 'isValid' variable\n\
    ```\n\nWe can also combine the declaration and assignment in a single step:\n\n\
    ```cpp\nint score = 100;            // Declaration and assignment of an integer\
    \ variable named 'score'\ndouble temperature = 98.6;  // Declaration and assignment\
    \ of a double variable named 'temperature'\nchar symbol = '$';          // Declaration\
    \ and assignment of a character variable named 'symbol'\nbool isReady = false;\
    \       // Declaration and assignment of a boolean variable named 'isReady'\n\
    ```\n\n# Input and Output Operations\n\nInput and output (I/O) operations are\
    \ crucial for interacting with the user and displaying information. C++ provides\
    \ the `iostream` library, which contains the necessary functions and objects for\
    \ performing I/O operations.\n\nTo use the `iostream` library, we include the\
    \ `<iostream>` header at the beginning of our program:\n\n```cpp\n#include <iostream>\n\
    ```\n\nLet's explore two essential I/O operations: output using `std::cout` and\
    \ input using `std::cin`.\n\n### Output using `std::cout`\n\nThe `std::cout` object\
    \ is used to display output to the console. We can use it to print messages, variable\
    \ values, or any other information.\n\nHere's an example that displays a greeting\
    \ message:\n\n```cpp\n#include <iostream>\n\nint main() {\n    std::cout << \"\
    Welcome to C++ Programming!\" << std::endl;\n    return 0;\n}\n```\n\nIn the above\
    \ code, the message \"Welcome to C++ Programming!\" is passed to `std::cout` using\
    \ the insertion operator (`<<`). The `std::endl` manipulator is used to insert\
    \ a newline character and flush the output stream.\n\n### Input using `std::cin`\n\
    \nThe `std::cin` object allows us to receive input from the user. We can use it\
    \ to store user-entered values into variables.\n\nHere's an example that prompts\
    \ the user to enter their age and stores it in the `age` variable:\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    int age;\n    std::cout << \"Enter your\
    \ age: \";\n    std::cin >> age;\n    std::cout << \"Your age is: \" << age <<\
    \ std::endl;\n    return 0;\n}\n```\n\nIn the above code, the `std::cin` object\
