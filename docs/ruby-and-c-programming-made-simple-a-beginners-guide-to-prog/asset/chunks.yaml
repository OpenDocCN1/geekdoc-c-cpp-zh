    # ## Chapter 15: Beyond the Basics: Advanced Ruby Concepts


    In this chapter, we''ll explore advanced concepts in Ruby that go beyond the basics,
    enabling you to write more elegant, powerful, and flexible code. We''ll dive into
    metaprogramming, design patterns, and other advanced techniques that can take
    your Ruby programming skills to the next level. Let''s delve into these concepts
    with practical examples to solidify your understanding.


    ### Metaprogramming


    Metaprogramming is a technique in which a program can modify or generate its own
    code. Ruby''s dynamic nature and reflective capabilities make it a great language
    for metaprogramming. Let''s explore a few metaprogramming concepts.


    #### Method Missing


    The `method_missing` method is invoked when a method is called that doesn''t exist.
    It can be used to define dynamic methods.


    ```ruby


    class DynamicMethods


    def method_missing(name, *args)


    if name.to_s.start_with?("hello_")


    puts "Hello, #{name.to_s.split(''_'').last.capitalize}!"


    else


    super


    end


    end


    end


    obj = DynamicMethods.new


    obj.hello_world


    obj.hello_john


    ```


    #### Define Method


    You can dynamically define methods using the `define_method` method.


    ```ruby


    class DynamicMethods


    define_method :greet do |name|


    puts "Hello, #{name}!"


    end


    end


    obj = DynamicMethods.new


    obj.greet("Alice")


    ```


    ### Design Patterns


    Design patterns are reusable solutions to common problems in software design.
    Let''s explore a couple of design patterns commonly used in Ruby.


    #### Singleton Pattern


    The Singleton pattern ensures that a class has only one instance and provides
    a global point of access to that instance.


    ```ruby


    require ''singleton''


    class SingletonClass


    include Singleton


    def some_method


    puts "This is a singleton method."


    end


    end


    instance1 = SingletonClass.instance


    instance2 = SingletonClass.instance


    p instance1 == instance2  # Output: true


    ```


    #### Observer Pattern


    The Observer pattern defines a one-to-many dependency between objects so that
    when one object changes state, all its dependents are notified and updated.


    ```ruby


    module Observable


    def add_observer(observer)


    @observers ||= []


    @observers << observer


    end


    def remove_observer(observer)


    @observers.delete(observer)


    end


    def notify_observers(message)


    @observers.each { |observer| observer.update(message) }


    end


    end


    class ConcreteObservable


    include Observable


    def do_something


    notify_observers("Something was done.")


    end


    end


    class ConcreteObserver


    def update(message)


    puts "Observer received: #{message}"


    end


    end


    observable = ConcreteObservable.new


    observer1 = ConcreteObserver.new


    observer2 = ConcreteObserver.new


    observable.add_observer(observer1)


    observable.add_observer(observer2)


    observable.do_something


    ```


    ### Functional Programming


    Ruby supports functional programming paradigms, which involve treating computation
    as the evaluation of mathematical functions. This leads to concise and expressive
    code.


    #### Map and Reduce


    Ruby''s `map` and `reduce` methods are powerful functional programming tools.


    ```ruby


    numbers = [1, 2, 3, 4, 5]


    squared_numbers = numbers.map { |num| num * num }


    sum = numbers.reduce(0) { |sum, num| sum + num }


    p squared_numbers  # Output: [1, 4, 9, 16, 25]


    p sum  # Output: 15


    ```


    ### Conclusion


    In this chapter, we''ve explored advanced concepts in Ruby that go beyond the
    basics, including metaprogramming, design patterns, and functional programming
    techniques. These advanced concepts empower you to write more flexible, elegant,
    and efficient code, enhancing your programming capabilities. Metaprogramming enables
    your code to modify and generate other code, while design patterns provide reusable
    solutions to common problems in software design. Functional programming techniques,
    on the other hand, allow you to approach problems from a mathematical and functional
    perspective, resulting in concise and expressive code. By incorporating these
    advanced concepts into your programming toolkit, you can tackle complex challenges
    and create software that is not only effective but also maintainable and scalable.


