  trans: "\n\n# 第 12 章：Ruby on Rails 简介\n\n在本章中，我们将全面介绍 Ruby on Rails，它通常简称为 `Rails`。Ruby\
    \ on Rails 是一个强大的 Web 开发框架，遵循“约定优于配置”（convention over configuration）和“不要重复自己”（DRY）原则。它让开发者能够高效地构建健、可扩展且可维护的\
    \ Web 应用。我们将探索 `Rails` 的核心概念、结构，并提供实践示例来巩你的理解。\n\n## 什么是 Ruby on Rails？\n\nRuby\
    \ on Rails，简称 `Rails`，是一个用 Ruby 编程语言编写的开源 Web 框架。它由 David Heinemeier Hansson 创建于\
    \ 2004 年发布。`Rails` 的设计目标是通过强调合理的默认值、减少重复性任务以及推广最佳实践，使 Web 开发变得更简单、更高效。\n\n## Rails\
    \ 的核心概念\n\n`Rails` 围绕几个核心概念构建，这些概念有助于它的有效性和流行：\n\n1. **约定优于配置 (CoC):** `Rails`\
    \ 遵循以下原则：使用合理的默认值和约定来减少对显式配置的需求。这促进了一致性并加快了开发。\n2. **不要重复自己 (DRY):** `Rails` 鼓励消除冗余代码和逻辑。这导致了更整、更易维护的代码库。\n\
    3. **模型-视图-控制器 (MVC):** `Rails` 采用 MVC 架构将应用程序分为三个部分：模型（数据和逻辑）、视图（用户界面）和控制器（处理请求和交互）。\n\
    4. **RESTful 路由:** `Rails` 鼓励使用表述状态转移 (REST) 原则设计清晰且一致的 URL 和路由。\n5. **Active\
    \ Record:** Active Record 是 Rails 的对象关系映射 (ORM) 层，允许你使用 Ruby 对象与数据库进行交互。\n\n##\
    \ 设置 Rails 应用\n\n要开始使用 `Rails`，你需要设置开发环境并创建一个新应用。以下是流程的概述：\n\n1. **安装 Ruby 和 Rails:**\
    \ 确保你的系统中已安装了 Ruby 和 `Rails`。你可以使用命令 `gem install rails` 来安装 `Rails`。\n2. **创建新应用:**\
    \ 使用 `rails new` 命令创建一个新的 Rails 应用。例如，`rails new MyApp` 会创建一个名为 \"MyApp\" 的应用。\n\
    3. **运行服务器:** 进入应用程序目录 (`cd MyApp`) 并使用命令 `rails server` 启动开发服务器。默认情况下，该应用可以通过\
    \ `http://localhost:3000` 访问。\n\n## Rails 应用的结构\n\n典型的 Rails 应用具有定义良好的结构，反映了其\
    \ MVC 架构：\n\n- **app:** 包含模型、视图和控制器的子目录。\n- **config:** 包含应用的配置文件，如路由、数据库设置和特定环境的配置。\n\
    - **db:** 存放数据库相关文件，包括迁移 (migrations) 和模式 (schema)。\n- **public:** 静态资源，如图像、样式表和\
    \ JavaScript 文件。\n- **test:** 包含单元测试和功能测试。\n- **Gemfile:** 列出应用程序使用的 gems 和依赖。\n\
    \n## Rails 中的 MVC 架构\n\nRuby on Rails 遵循模型-视图-控制器 (MVC) 架构，将应用程序分为三个主要组件：\n\n\
    - **Model (模型):** 代表应用程序的数据和业务逻辑。\n- **View (视图):** 处理呈现和用户界面。\n- **Controller\
    \ (控制器):** 管理模型和视图之间的数据流。\n\n### 创建简单的 Web 应用\n\n让我们使用 Ruby on Rails 创建一个显示项目列表的简单\
    \ Web 应用。\n\n1. **生成控制器:** 使用命令 `rails generate controller items` 生成一个名为 \"Items\"\
    \ 的控制器。\n2. **定义动作 (Action):** 在生成的控制器文件中定义一个获取项目列表并发送到视图的动作。\n3. **创建视图:** 创建显示项目列表的视图文件。\n\
    4. **定义路由:** 设置路由将 URL 映射到控制器的动作。\n5. **运行应用:** 启动开发服务器并在浏览器中访问该应用。\n\n### 处理表单和用户输入\n\
    \nWeb 应用通常通过表单涉及用户输入。Rails 提供了简化表单处理的工具。\n\n让我们创建一个允许用户向列表添加新项目的表单。\n\n1. **生成模型:**\
    \ 使用命令 `rails generate model item name:string` 为带有 \"name\" 属性的项目生成一个模型。\n2. **运行迁移:**\
    \ 运行 `rails db:migrate` 将模型更改应用于数据库。\n3. **创建表单:** 在视图中创建一个收集用户输入以添加新项目的表单。\n\
    4. **处理表单提交:** 在控制器中定义一个动作来处理表单提交并创建新项目。\n\n### 与数据库交互\n\nRails 与数据库无缝集成，使得存储和检索数据变得简单。\n\
    \n1. **配置数据库:** 在 `config/database.yml` 文件中配置数据库连接。\n2. **创建记录:** 使用模型在数据库中创建记录。\n\
    3. **查询记录:** 使用 `ActiveRecord` 查询数据。\n\n## 示例\n\n让我们通过实践示例应用这些知识：\n\n### 示例 1：显示文章列表\n\
    \n使用 Rails 创建一个显示文章列表的 Web 应用。\n\n```ruby\n# 生成控制器\nrails generate controller\
    \ articles\n\n# 在控制器中定义动作\ndef index\n  @articles = Article.all\nend\n```\n\n\
    ```html+erb\n<!-- 创建显示文章的视图\n<% @articles.each do |article| %>\n  <h2><%= article.title\
    \ %></h2>\n  <p><%= article.content %></p>\n<% end %>\n```\n\n### 示例 2：创建博客文章\n\
    \n创建一个允许用户创建博客文章的表单。\n\n```ruby\n# 生成模型\nrails generate model Post title:string\
    \ content:text\n\n# 在视图定义表单\n<%= form_for @post do |f| %>\n  <div class=\"field\"\
    >\n    <%= f.label :title %>\n    <%= f.text_field :title %>\n  </div>\n  <div\
    \ class=\"field\">\n    <%= f.label :content %>\n    <%= f.text_area :content\
    \ %>\n  </div>\n  <%= f.submit %>\n<% end %>\n```\n\n```ruby\n# 在控制器中处理表单提交\n\
    def create\n  @post = Post.new(post_params)\n  if @post.save\n    redirect_to\
    \ @post\n  else\n    render 'new'\n  end\nend\n\nprivate\n\ndef post_params\n\
    \  params.require(:post).permit(:title, :content)\nend\n```\n\n## 总结\n\n使用 Ruby\
    \ 进行 Web 开发为创建动态、交互和功能丰富的 Web 应用开启了无限可能。在本章中，我们介绍了使用 Ruby on Rails 进行 Web 开发的基础，包括设置环境、创建控制器、处理表单、与数据库交互以及遵循\
    \ MVC 架构。Ruby on Rails 为构建现代 Web 应用提供了一个高效且对友的框架。通过将你的 Ruby 技能与 Web 开发相结合，你可以创建对用户生活和体验产生真实影响的应用程序。\n\
    \n"
