  trans: "\n\n# 第 5 章：控制结构：条件判断与循环\n\n在本章，我们将探索 Ruby 提供的强大的控制结构，用于操作程序的执行流。理解条件判断和循环对于创建动态且响应迅速的应用程序至关重要。我们将涵盖\
    \ `if` 语句、`case` 语句、`while` 循环、`for` 循环，并提供实用示例来巩你的理解。\n\n### 条件语句\n\n条件语句允许你的程序根据某些条件做出决策并执行不同的代码块。最常见的条件语句是\
    \ `if` 语句。\n\n#### If 语句\n\n当给定条件为真时，`if` 语句执行一个代码块。\n\n```ruby\ntemperature =\
    \ 25\n\nif temperature > 30\n  puts \"It's hot outside!\"\nelsif temperature >\
    \ 20\n  puts \"It's warm outside.\"\nelse\n  puts \"It's cool outside.\"\nend\n\
    ```\n\n#### Case 语句\n\n`case` 语句提供了一种将其与多个可能的匹配项进行比较的方法。\n\n```ruby\nday = \"\
    Wednesday\"\n\ncase day\nwhen \"Monday\"\n  puts \"Start of the week\"\nwhen \"\
    Wednesday\"\n  puts \"Middle of the week\"\nwhen \"Friday\"\n  puts \"End of the\
    \ week\"\nelse\n  puts \"Other days\"\nend\n```\n\n### 循环\n\n循环允许你多次重复一个代码块。它们对于自动化重复性任务和处理数据集合至关重要。\n\
    \n#### While 循环\n\n只要给定条件为真，`while` 循环就会继续执行一个代码块。\n\n```ruby\ncounter = 1\n\n\
    while counter <= 5 do\n  puts \"Count: #{counter}\"\n  counter += 1\nend\n```\n\
    \n#### For 循环\n\n`for` 循环遍历范围或集合。\n\n```ruby\nfor i in 1..5 do\n  puts \"Number:\
    \ #{i}\"\nend\n```\n\n### 遍历集合\n\nRuby 提供了方便的方法来遍历数组（Array）和哈希（Hash）。\n\n####\
    \ 数组迭代\n\n```ruby\nfruits = [\"apple\", \"banana\", \"orange\"]\n\nfruits.each\
    \ do |fruit|\n  puts \"Fruit: #{fruit}\"\nend\n```\n\n#### 哈希迭代\n\n```ruby\nperson\
    \ = { \"name\" => \"John\", \"age\" => 30, \"city\" => \"New York\" }\n\nperson.each\
    \ do |key, value|\n  puts \"#{key}: #{value}\"\nend\n```\n\n### Break 和 Next\n\
    \n在循环中，你可以使用 `break` 语句提前退出循环，并使用 `next` 语句跳过当前迭代并进入下一次。\n\n```ruby\nfor i in\
    \ 1..10 do\n  if i == 5\n    break\n  elsif i % 2 == 0\n    next\n  end\n  puts\
    \ \"Number: #{i}\"\nend\n```\n\n### 示例\n\n让我们探索一些示例来查看这些控制结构的实际运行：\n\n#### 示例\
    \ 1：使用循环计算阶乘\n\n```ruby\nnumber = 5\nfactorial = 1\n\nwhile number > 1 do\n  factorial\
    \ *= number\n  number -= 1\nend\n\nputs \"Factorial: #{factorial}\"\n```\n\n####\
    \ 示例 2：检查评分标准\n\n```ruby\nscore = 85\n\nif score >= 90\n  puts \"A\"\nelsif score\
    \ >= 80\n  puts \"B\"\nelsif score >= 70\n  puts \"C\"\nelse\n  puts \"F\"\nend\n\
    ```\n\n#### 示例 3：遍历数组\n\n```ruby\nnumbers = [1, 3, 5, 7, 9]\n\nnumbers.each do\
    \ |num|\n  puts \"Square of #{num}: #{num * num}\"\nend\n```\n\n### 总结\n\n条件判断和循环等控制结构是你编程工具箱中不可或缺的工具。它们允许你创建动态、响应且高效的程序。在本章中，我们探索了用于决策的\
    \ `if` 和 `case` 语句，以及用于迭代的 `while` 和 `for` 循环。通过理解和练习这些控制结构，你正朝着构建更复杂交互式的 Ruby\
    \ 程序前进。在下一章中，我们将深入研究函数和方法，这将使你能够有效地封装和重用代码。\n\n# 第 6 章：函数与方法\n\n在本章中，我们将深入探索 Ruby\
    \ 函数和方法的世界。函数和方法对于组织代码、使其模块化以及提高重用性至关重要。我们将探索如何定义、调用和使用函数与方法，并提供实用示例来巩你的理解。\n\n\
    ### 函数与方法\n\n在 Ruby 中，函数通常被称为方法。虽然这两个术语互换使用，但存在细微的区别。方法与对象相关，而函数不是。换句话说，方法是与特定对象或数据类型相关的函数。\n\
    \n### 定义方法\n\n定义方法涉及指定其名称、参数以及它应该执行的代码块。\n\n```ruby\ndef greet(name)\n  puts \"\
    Hello, #{name}!\"\nend\n```\n\n在这个示例中，我们定义了一个名为 `greet` 的方法，它接受一个参数 `name`。当调用该方法时，它将打印带有提供的名称的欢迎消息。\n\
    \n 调用方法\n\n调用方法涉及使用其名称并提供必要的参数。\n\n```ruby\ngreet(\"Alice\")\n```\n\n对 `greet`\
    \ 方法的这次调用将打印 \"Hello, Alice!\"\n\n### 返回值\n\n方法可以使用 `return` 关键字返回值。\n\n```ruby\n\
    def add(a, b)\n  return a + b\nend\n\nresult = add(5, 3)\nputs \"Sum: #{result}\"\
    \n```\n\n### 默认参数\n\n你可以为参数提供默认值。\n\n```ruby\ndef greet(name = \"Guest\")\n  puts\
    \ \"Hello, #{name}!\"\nend\n```\n\n如果在调用 `greet` 时没有提供参数，它将打印 \"Hello, Guest!\"\
    。如果提供了 \"Alice\"，它将打印 \"Hello, Alice!\"。\n\n### 可变参数方法\n\nRuby 支持可变参数，它们可以接受任意数量的参数。\n\
    \n```ruby\ndef sum(*numbers)\n  total = 0\n  numbers.each do |num|\n    total\
    \ += num\n  end\n  return total\nend\n\nresult = sum(1, 2, 3, 4)\nputs \"Total:\
    \ #{result}\"\n```\n\n`sum` 方法接受任意数量的参数并计算它们的和。\n\n### 示例：构建计算器\n\n让我们把知识应用于示例：构建一个计算器。\n\
    \n```ruby\ndef add(a, b)\n  return a + b\nend\n\ndef subtract(a, b)\n  return\
    \ a - b\nend\n\ndef multiply(a, b)\n  return a * b\nend\n\ndef divide(a, b)\n\
    \  if b == 0\n    return \"Cannot divide by zero\"\n  else\n    return a / b\n\
    \  end\nend\n\nputs \"Enter two numbers:\"\nnum1 = gets.to_f\nnum2 = gets.to_f\n\
    puts \"Select operation (+, -, *, /)\"\noperation = gets.chomp\n\ncase operation\n\
    when \"+\"\n  result = add(num1, num2)\nwhen \"-\"\n  result = subtract(num1,\
    \ num2)\nwhen \"*\"\n  result = multiply(num1, num2)\nwhen \"/\"\n  result = divide(num1,\
    \ num2)\nelse\n  result = \"Invalid operation\"\nend\n\nputs \"Result: #{result}\"\
    \n```\n\n在这个示例中，我们定义了四个算运算方法，然后构建了一个接收用户数字和操作并执行相应操作的计算器。\n\n### 总结\n\n函数和方法是任何编程语言的核心组件。在本章中，我们探索了如何在\
    \ Ruby 中定义、调用和使用方法。你还学习了返回值、默认参数和可变参数方法。有了这些知识，你可以开始创建更复杂的程序。\n\n# 第 7 章：数组与哈希\n\
    \n在本章中，我们将探索 Ruby 中两个重要的数据结构：数组（Array）和哈希（Hash）。数组允许你存储有序的项集合，而哈希允许你存储键值对以进行高效的数据检索。我们将深入研究如何操作数组和哈希，执行常用操作，并提供实用示例来巩你的理解。\n\
    \n### 数组\n\n数组是项的集合，每个项都有一个指示其在数组位置的索引。数组非常灵活，可以存储任何数据类型的元素。\n\n#### 创建数组\n\n\
    你可以使用方括号并用逗号分隔元素来创建一个数组。\n\n```ruby\nfruits = [\"apple\", \"banana\", \"orange\"\
    ]\n```\n\n#### 访问数组元素\n\n你可以使用索引访问元素。\n\n```ruby\nfirst_fruit = fruits[0]\nsecond_fruit\
    \ = fruits[1]\n```\n\n#### 添加和删除元素\n\n"
