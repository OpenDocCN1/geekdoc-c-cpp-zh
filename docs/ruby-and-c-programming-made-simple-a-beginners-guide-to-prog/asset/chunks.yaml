    ## 逻辑运算符\n\n逻辑运算符用于组合多个条件。C++ 提供了以下逻辑运算符：\n\n- 逻辑与 (`&&`): 当两个条件都为真时返回 `true`。\n\
    - 逻辑或 (`||`): 当至少一个条件为真时返回 `true`。\n- 逻辑非 (`!`): 反转条件的结果。\n\n让我们一个演示逻辑运算符的示例：\n\
