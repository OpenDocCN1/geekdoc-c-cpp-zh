    \ += 1\nend\nputs \"Word Count:\"\nword_count.each do |word, count|\n  puts \"\
    #{word}: #{count}\"\nend\n```\n\n### Conclusion\n\nArrays and hashes are fundamental\
    \ data structures in Ruby that allow you to store and manage collections of data\
    \ efficiently. In this chapter, we've explored how to create, access, add, remove,\
    \ and iterate through arrays and hashes. By understanding how to work with these\
    \ data structures, you're equipped to handle a wide range of data organization\
    \ tasks in your programs.\n\n# Chapter 8: Object-Oriented Programming in Ruby\n\
    \nIn this chapter, we'll delve into the core principles of object-oriented programming\
    \ (OOP) using Ruby. Object-oriented programming is a powerful paradigm that allows\
    \ you to create structured, modular, and reusable code. We'll cover the concepts\
    \ of classes, objects, inheritance, encapsulation, and polymorphism, providing\
    \ you with practical examples to enhance your understanding.\n\n### Classes and\
    \ Objects\n\nAt the heart of object-oriented programming are classes and objects.\
    \ A class defines a blueprint for creating objects, while an object is an instance\
    \ of a class.\n\n#### Defining a Class\n\nYou define a class using the `class`\
    \ keyword.\n\n```ruby\nclass Person\n  def initialize(name, age)\n    @name =\
    \ name\n    @age = age\n  end\nend\n```\n\nIn this example, we define a `Person`\
    \ class with an `initialize` method that sets the `name` and `age` instance variables.\n\
    \n#### Creating Objects\n\nYou create objects from a class using the `new` method.\n\
    \n```ruby\nperson1 = Person.new(\"Alice\", 25)\nperson2 = Person.new(\"Bob\",\
    \ 30)\n```\n\n#### Instance Variables\n\nInstance variables (prefixed with `@`)\
    \ hold the state of an object.\n\n```ruby\nclass Person\n  def initialize(name,\
    \ age)\n    @name = name\n    @age = age\n  end\nend\nperson = Person.new(\"Alice\"\
    , 25)\nputs \"#{person.name} is #{person.age} years old.\"\n```\n\n### Inheritance\n\
    \nInheritance allows you to create a new class based on an existing one, inheriting\
    \ its attributes and behaviors. The new class is called a subclass, and the existing\
    \ class is the superclass.\n\n```ruby\nclass Student < Person\n  def initialize(name,\
    \ age, grade)\n    super(name, age)\n    @grade = grade\n  end\nend\n```\n\nIn\
    \ this example, the `Student` class inherits from the `Person` class. The `super`\
    \ keyword is used to call the superclass's `initialize` method.\n\n### Encapsulation\n\
    \nEncapsulation involves bundling data (attributes) and methods (behaviors) that\
    \ operate on that data within a single unit.\n\n```ruby\nclass BankAccount\n \
    \ def initialize(name, age)\n    @name = name\n    @age = age\n  end\n  def deposit(amount)\n\
    \    @balance += amount\n  end\n  def withdraw(amount)\n    if @balance >= amount\n\
    \      @balance -= amount\n    else\n      puts \"Insufficient funds.\"\n    end\n\
    \  end\nend\n```\n\nIn this example, the `BankAccount` class encapsulates the\
    \ `deposit` and `withdraw` methods.\n\n### Polymorphism\n\nPolymorphism allows\
    \ objects of different classes to be treated as objects of a common superclass\
    \ through a shared interface.\n\n```ruby\nclass Shape\n  def area\n    raise NotImplementedError,\
    \ \"Subclasses must implement this method.\"\n  end\nend\n\nclass Circle < Shape\n\
    \  def initialize(radius)\n    @radius = radius\n  end\n  def area\n    Math::PI\
    \ * @radius**2\n  end\nend\n\nclass Rectangle < Shape\n  def initialize(width,\
    \ height)\n    @width = width\n    @height = height\n  end\n  def area\n    @width\
    \ * @height\n  end\nend\n```\n\nIn this example, `Circle` and `Rectangle` are\
    \ subclasses of `Shape`, and they both implement the `area` method.\n\n### Examples\n\
    \nLet's apply our knowledge with some practical examples:\n\n#### Example 1: Creating\
    \ and Using Classes\n\n```ruby\nclass Car\n  def initialize(make, model)\n   \
    \ @make = make\n    @model = model\n  end\n  def drive\n    puts \"#{@make} #{@model}\
    \ is driving.\"\n  end\nend\n\ncar1 = Car.new(\"Toyota\", \"Camry\")\ncar2 = Car.new(\"\
    Honda\", \"Civic\")\ncar1.drive\ncar2.drive\n```\n\n#### Example 2: Inheriting\
    \ and Extending Classes\n\n```ruby\nclass Animal\n  def speak\n    raise NotImplementedError,\
    \ \"Subclasses must implement this method.\"\n  end\nend\n\nclass Dog < Animal\n\
    \  def speak\n    puts \"Woof!\"\n  end\nend\n\nclass Cat < Animal\n  def speak\n\
    \    puts \"Meow!\"\n  end\nend\n\ndog = Dog.new\ncat = Cat.new\ndog.speak\ncat.speak\n\
    ```\n\n### Conclusion\n\nObject-oriented programming is a powerful paradigm that\
    \ enables you to create structured, modular, and reusable code. In this chapter,\
    \ we've explored the concepts of classes, objects, inheritance, encapsulation,\
    \ and polymorphism in Ruby. By understanding and applying these principles, you\
    \ can design and build complex applications in a more organized and efficient\
    \ manner.\n\n# Chapter 9: Error Handling and Exceptions\n\nIn this chapter, we'll\
    \ explore the importance of error handling and how to manage exceptions in Ruby.\
    \ Exception handling is crucial for writing robust and reliable code that gracefully\
    \ handles unexpected situations and prevents crashes. We'll cover the basics of\
    \ exceptions, how to raise and rescue them, and provide practical examples to\
    \ enhance your understanding.\n\n### Understanding Exceptions\n\nIn programming,\
    \ an exception is an event that occurs during the execution of a program that\
    \ disrupts the normal flow of instructions. These events can be caused by various\
    \ reasons, such as invalid inputs, unexpected behaviors, or external factors.\n\
    \nRuby provides a built-in mechanism to handle exceptions, ensuring that your\
    \ program doesn't come to a halt when unexpected errors occur.\n\n### Raising\
    \ Exceptions\n\nYou can explicitly raise exceptions using the `raise` keyword.\
    \ This is useful when you want to signal an exceptional condition in your code.\n"
