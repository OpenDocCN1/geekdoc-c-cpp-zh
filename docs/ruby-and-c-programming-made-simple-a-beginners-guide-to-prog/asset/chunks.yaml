    \ {\n    // Function body\n    std::cout << \"Hello from thread!\" << std::endl;\n\
    }\n\nint main() {\n    std::thread t(threadFunction);\n    // Main thread continues\
    \ execution\n    t.join(); // Wait for the thread to finish\n    return 0;\n}\n\
    ```\n\nIn this example, we define a function `threadFunction()` that represents\
    \ the code to be executed in a separate thread. We create a `std::thread` object\
    \ `t` that executes the `threadFunction()`. The main thread continues its execution\
    \ while the new thread runs concurrently. We use `t.join()` to wait for the thread\
    \ to finish before exiting the program.\n\n## Lambda Expressions\n\nLambda expressions\
    \ are a concise way to define anonymous functions in C++. They allow us to create\
    \ functions on the fly without explicitly defining a named function. Lambda expressions\
    \ are particularly useful when working with algorithms or in situations where\
    \ a function needs to be passed as an argument.\n\nHere's an example that demonstrates\
    \ the usage of lambda expressions:\n\n```cpp\n#include <iostream>\n#include <vector>\n\
    #include <algorithm>\n\nint main() {\n    std::vector<int> numbers = {1, 2, 3,\
    \ 4, 5};\n    int count = std::count_if(numbers.begin(), numbers.end(), [](int\
    \ x) {\n        return x % 2 == 0;\n    });\n    std::cout << \"Count: \" << count\
    \ << std::endl;\n    return 0;\n}\n```\n\nIn this example, we use a lambda expression\
    \ as the third argument to the `std::count_if()` algorithm. The lambda expression\
    \ checks if a number is even (`x % 2 == 0`) and returns `true` or `false` accordingly.\
    \ The `std::count_if()` algorithm counts the number of elements that satisfy the\
    \ condition.\n\n## Move Semantics\n\nMove semantics is a feature introduced in\
    \ C++11 that allows for the efficient transfer of resources (such as memory) from\
    \ one object to another without unnecessary copying. Move semantics are particularly\
    \ useful when working with large objects or when performance optimization is crucial.\n\
    \nMove semantics are enabled by the use of move constructors and move assignment\
    \ operators. A move constructor is a special constructor that takes an rvalue\
    \ reference (`T&&`) and efficiently transfers the resources from the source object\
    \ to the new object. A move assignment operator is a special assignment operator\
    \ that performs a similar resource transfer.\n\nHere's an example that demonstrates\
    \ move semantics:\n\n```cpp\nclass MyObject {\npublic:\n    // Move constructor\n\
    \    MyObject(MyObject&& other) {\n        // Transfer resources from 'other'\
    \ to 'this'\n        // ...\n    }\n    // Move assignment operator\n    MyObject&\
    \ operator=(MyObject&& other) {\n        if (this != &other) {\n            //\
    \ Transfer resources from 'other' to 'this'\n            // ...\n        }\n \
    \       return *this;\n    }\n};\n\nint main() {\n    MyObject obj1;\n    // Perform\
    \ move operation\n    MyObject obj2 = std::move(obj1);\n    return 0;\n}\n```\n\
    \nIn this example, we define a move constructor and a move assignment operator\
    \ for the `MyObject` class. We use the `std::move()` function to indicate that\
