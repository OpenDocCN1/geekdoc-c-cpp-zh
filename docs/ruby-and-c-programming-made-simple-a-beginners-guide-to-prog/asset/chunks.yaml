    In Chapter 7, we explored functions and modular programming in C++. In this chapter,
    we will delve into pointers and dynamic memory allocation. Pointers allow us to
    store memory addresses and manipulate memory directly, while dynamic memory allocation
    enables us to allocate and deallocate memory at runtime.


