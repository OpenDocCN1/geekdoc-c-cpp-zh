  raw: 'Function templates allow us to create generic functions that can operate on
    different types. The syntax for a function template includes the `template` keyword
    followed by the template parameter(s) in angle brackets (`<>`). Here''s an example:


    ```cpp


    template <typename T>


    T add(T a, T b) {


    return a + b;


    }


    ```


    In this example, we define a function template `add()` that takes two arguments
    of type `T` and returns their sum. The `T` is a placeholder for the actual type
    that will be used when the function is called.


    We can call the `add()` function template with different types, and the compiler
    generates the appropriate code for each type:


    ```cpp


    int result1 = add(3, 4);        // Calling add() with int arguments


    double result2 = add(2.5, 1.5); // Calling add() with double arguments


    ```


    ### Class Templates


    Class templates allow us to create generic classes that can work with different
    types. The syntax for a class template is similar to that of a regular class,
    with the template parameter(s) specified in angle brackets (`<>`). Here''s an
    example:


    ```cpp


    template <typename T>


    class Stack {


    private:


    std::vector<T> elements;


    public:


    void push(const T& value) {


    elements.push_back(value);


    }


    void pop() {


    elements.pop_back();


    }


    T top() const {


    return elements.back();


    }


    bool empty() const {


    return elements.empty();


    }


    };


    ```


    In this example, we define a class template `Stack` that represents a stack data
    structure. The elements of the stack are stored in a `std::vector` container,
    which is a part of the STL.


    We can create instances of the `Stack` class template for different types:


    ```cpp


    Stack<int> intStack;       // Stack of integers


    Stack<double> doubleStack; // Stack of doubles


    intStack.push(42);


    doubleStack.push(3.14);


    ```


    ### Template Specialization


    Template specialization allows us to provide a specialized implementation for
    specific types. It enables us to customize the behavior of a template for specific
    cases. Here''s an example of template specialization for the `add()` function
    template:


    ```cpp


    template <>


    std::string add(std::string a, std::string b) {


    return a + " " + b;


    }


    ```


    In this example, we specialize the `add()` function template for the `std::string`
    type. The specialized version concatenates two strings with a space in between.


    ## Standard Template Library (STL)


    The Standard Template Library (STL) is a library of generic data structures and
    algorithms provided by C++. It offers a collection of containers, iterators, algorithms,
    and function objects, making it easier to write efficient and reusable code.


    ### Containers


    The STL provides various container classes that store collections of elements.
    Some commonly used containers include:


    - `std::vector`: A dynamic array that grows automatically as elements are added.


    - `std::list`: A doubly-linked list.


    - `std::deque`: A double-ended queue.


    - `std::set`: A container that stores unique elements in a sorted order.


    - `std::map`: An associative container that stores key-value pairs.


    ### Iterators


    Iterators provide a way to traverse the elements of a container. They act as generalized
    pointers and allow us to access the elements sequentially. STL offers different
    types of iterators, including:


    - `std::begin()` and `std::end()`: Returns iterators pointing to the beginning
    and past-the-end positions of a container.


    - `std::advance()`: Moves an iterator a specified number of positions.


    - `std::next()`: Returns the iterator that follows a given iterator.


    - `std::prev()`: Returns the iterator that precedes a given iterator.


    ### Algorithms


    STL provides a wide range of algorithms that operate on containers. These algorithms
    perform various operations, such as searching, sorting, modifying, and manipulating
    elements. Some commonly used algorithms include:


    - `std::sort()`: Sorts the elements of a container.


    - `std::find()`: Searches for a value in a container.


    - `std::count()`: Counts the occurrences of a value in a container.


    - `std::transform()`: Applies a function to each element of a container.


    - `std::accumulate()`: Calculates the sum of the elements in a container.


    ### Function Objects


    Function objects (also known as functors) are objects that behave like functions.
    They are often used as arguments to algorithms to define custom operations on
    elements. Function objects can be defined as classes or by using lambda expressions.


    ```cpp


    struct Square {


    int operator()(int x) const {


    return x * x;


    }


    };


    std::vector<int> numbers = {1, 2, 3, 4, 5};


    // Using a function object


    std::transform(numbers.begin(), numbers.end(), numbers.begin(), Square());


    // Using a lambda expression


    std::transform(numbers.begin(), numbers.end(), numbers.begin(), [](int x) { return
    x * x; });


    ```


    In this example, we define a function object `Square` that squares an integer.
    We then use the `std::transform()` algorithm to apply the `Square` function object
    to each element of the `numbers` vector. Alternatively, we can use a lambda expression
    to achieve the same result.


    ## Conclusion


    Templates and the Standard Template Library (STL) are powerful features of C++
    that promote code reusability, generic programming, and efficient algorithms.
    Templates allow us to create generic functions and classes that can operate on
    multiple types. The STL provides a collection of containers, iterators, algorithms,
    and function objects, making it easier to write efficient and reusable code.


    In this chapter, we explored function templates, class templates, template specialization,
    and the key components of the STL. We also touched upon containers, iterators,
    algorithms, and function objects provided by the STL.


    By leveraging templates and the STL, we can write generic, efficient, and reusable
    code in C++. They are essential tools for modern C++ development.


    # Chapter 15: Advanced Topics in C++ Programming


    In this final chapter, we will explore some advanced topics in C++ programming
    that can further enhance our skills and allow us to write more efficient and sophisticated
    code. We will delve into topics such as smart pointers, multithreading, lambda
    expressions, and move semantics.


    ## Smart Pointers


    Smart pointers are a powerful feature of C++ that provide automatic memory management,
    reducing the risk of memory leaks and dangling pointers. They are objects that
    act like pointers but have additional capabilities, such as automatic deallocation
    of memory when it is no longer needed.


    C++ provides three types of smart pointers:


    - `std::unique_ptr`: Represents exclusive ownership of a dynamically allocated
    object. It ensures that only one `std::unique_ptr` can own the object, and when
    the owner is destroyed, the object is automatically deleted.


    - `std::shared_ptr`: Represents shared ownership of a dynamically allocated object.
    It allows multiple `std::shared_ptr` objects to point to the same object, and
    the object is deleted only when the last `std::shared_ptr` owning it is destroyed.


    - `std::weak_ptr`: Represents a non-owning reference to an object managed by a
    `std::shared_ptr`. It allows accessing the object without affecting its reference
    count.


    Here''s an example that demonstrates the usage of `std::unique_ptr`:


    ```cpp


    #include <memory>


    class MyClass {


    public:


    void someFunction() {


    // Function body


    }


    };


    int main() {


    std::unique_ptr<MyClass> ptr(new MyClass());


    ptr->someFunction();


    return 0;


    }


    ```


    In this example, we create a `std::unique_ptr` named `ptr` that owns a dynamically
    allocated `MyClass` object. We can access the object''s member function using
    the arrow (`->`) operator.


    ## Multithreading


    Multithreading is the ability of a program to execute multiple threads concurrently.
    It allows tasks to run in parallel and can greatly improve performance and responsiveness
    in certain scenarios. C++ provides a multithreading library that supports concurrent
    execution of threads.


