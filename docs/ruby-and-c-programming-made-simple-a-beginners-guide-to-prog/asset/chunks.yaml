    \ outside.\"\nelse\n  puts \"It's cool outside.\"\nend\n```\n\n#### Case Statement\n\
    \nThe `case` statement provides a way to compare a value against multiple possible\
    \ matches.\n\n```ruby\nday = \"Wednesday\"\n\ncase day\nwhen \"Monday\"\n  puts\
    \ \"Start of the week\"\nwhen \"Wednesday\"\n  puts \"Middle of the week\"\nwhen\
    \ \"Friday\"\n  puts \"End of the week\"\nelse\n  puts \"Other days\"\nend\n```\n\
    \n### Loops\n\nLoops enable you to repeat a block of code multiple times. They\
    \ are essential for automating repetitive tasks and processing collections of\
    \ data.\n\n#### While Loop\n\nThe `while` loop continues executing a block of\
    \ code as long as a given condition is true.\n\n```ruby\ncounter = 1\n\nwhile\
    \ counter <= 5 do\n  puts \"Count: #{counter}\"\n  counter += 1\nend\n```\n\n\
    #### For Loop\n\nThe `for` loop iterates through a range or a collection.\n\n\
    ```ruby\nfor i in 1..5 do\n  puts \"Number: #{i}\"\nend\n```\n\n### Iterating\
    \ through Collections\n\nRuby provides convenient ways to iterate through arrays\
    \ and hashes.\n\n#### Array Iteration\n\n```ruby\nfruits = [\"apple\", \"banana\"\
    , \"orange\"]\n\nfruits.each do |fruit|\n  puts \"Fruit: #{fruit}\"\nend\n```\n\
    \n#### Hash Iteration\n\n```ruby\nperson = { \"name\" => \"John\", \"age\" =>\
    \ 30, \"city\" => \"New York\" }\n\nperson.each do |key, value|\n  puts \"#{key}:\
    \ #{value}\"\nend\n```\n\n### Break and Next\n\nIn loops, you can use the `break`\
    \ statement to exit the loop prematurely and the `next` statement to skip the\
    \ current iteration and proceed to the next one.\n\n```ruby\nfor i in 1..10 do\n\
    \  if i == 5\n    break\n  elsif i % 2 == 0\n    next\n  end\n  puts \"Number:\
    \ #{i}\"\nend\n```\n\n### Examples\n\nLet's explore some examples to see these\
    \ control structures in action:\n\n#### Example 1: Using a Loop to Calculate Factorials\n\
    \n```ruby\nnumber = 5\nfactorial = 1\n\nwhile number > 1 do\n  factorial *= number\n\
    \  number -= 1\nend\n\nputs \"Factorial: #{factorial}\"\n```\n\n#### Example 2:\
    \ Checking Grading Criteria\n\n```ruby\nscore = 85\n\nif score >= 90\n  puts \"\
    A\"\nelsif score >= 80\n  puts \"B\"\nelsif score >= 70\n  puts \"C\"\nelse\n\
    \  puts \"F\"\nend\n```\n\n#### Example 3: Iterating through an Array\n\n```ruby\n\
    numbers = [1, 3, 5, 7, 9]\n\nnumbers.each do |num|\n  puts \"Square of #{num}:\
    \ #{num * num}\"\nend\n```\n\n### Conclusion\n\nControl structures such as conditionals\
