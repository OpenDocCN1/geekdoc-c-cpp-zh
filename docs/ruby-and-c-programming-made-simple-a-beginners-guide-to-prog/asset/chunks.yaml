    # ## Chapter 3: Basics of Ruby Syntax


    In this chapter, we''ll dive into the fundamental building blocks of Ruby syntax.
    Understanding these basics is essential as they form the foundation of your journey
    into the world of Ruby programming. We''ll cover variables, data types, operators,
    and control structures with clear explanations and examples to ensure you grasp
    these concepts thoroughly.


    ### Variables and Naming Conventions


    Variables in Ruby are used to store and manipulate data. A variable''s name can
    consist of letters, digits, underscores, and must start with a lowercase letter
    or underscore. Ruby is case-sensitive, so `my_variable` and `My_Variable` are
    treated as different variables.


    ```ruby


    name = "Alice"


    age = 25


    ```


    ### Data Types


    Ruby has several core data types:


    #### Strings


    Strings represent textual data and are enclosed in either single or double quotes.


    ```ruby


    greeting = "Hello, Ruby!"


    ```


    #### Numbers


    Ruby supports both integers and floating-point numbers.


    ```ruby


    count = 10


    pi = 3.14


    ```


    #### Booleans


    Booleans represent true or false values.


    ```ruby


    is_raining = true


    is_sunny = false


    ```


    ### Operators


    Ruby provides various operators to perform operations on data:


    #### Arithmetic Operators


    ```ruby


    sum = 10 + 5


    difference = 20 - 8


    product = 4 * 6


    quotient = 15 / 3


    ```


    #### Comparison Operators


    ```ruby


    greater_than = 10 > 5


    less_than = 3 < 7


    equal_to = 8 == 8


    not_equal = 5 != 10


    ```


    #### Logical Operators


    ```ruby


    and_operator = true && false


    or_operator = true || false


    not_operator = !true


    ```


    ### Control Structures


    Control structures enable you to control the flow of your program:


    #### Conditional Statements (if, elsif, else)


    ```ruby


    if temperature > 30


    puts "It''s hot outside!"


    elsif temperature > 20


    puts "It''s warm outside."


    else


    puts "It''s cool outside."


    end


    ```


    #### Loops (while, for)


    ##### While Loop


    ```ruby


    counter = 1


    while counter <= 5 do


    puts "Count: #{counter}"


    counter += 1


    end


    ```


    ##### For Loop


    ```ruby


    for i in 1..5 do


    puts "Number: #{i}"


    end


    ```


    #### Arrays


    Arrays are ordered collections of items.


    ```ruby


    fruits = ["apple", "banana", "orange"]


    ```


    #### Hashes


    Hashes store key-value pairs.


    ```ruby


    person = { "name" => "John", "age" => 30, "city" => "New York" }


    ```


    ### Examples


    Let''s put these concepts into action with some examples:


    #### Example 1: Calculating Area


    ```ruby


    length = 5


    width = 3


    area = length * width


    puts "The area is: #{area}"


    ```


    #### Example 2: Checking Eligibility


    ```ruby


    age = 17


    if age >= 18


    puts "You are eligible to vote."


    else


    puts "You are not eligible to vote yet."


    end


    ```


    #### Example 3: Looping through an Array


    ```ruby


    colors = ["red", "green", "blue", "yellow"]


    for color in colors do


    puts "Color: #{color}"


    end


    ```


    ### Conclusion


    In this chapter, we''ve explored the basics of Ruby syntax, including variables,
    data types, operators, and control structures. These concepts are the building
    blocks of any Ruby program, and mastering them is essential for your programming
    journey. Practice writing code and experiment with different examples to solidify
    your understanding.


    # ## Chapter 4: Variables and Data Types


    In this chapter, we''ll delve deeper into the world of variables and data types
    in Ruby. Understanding how to work with variables and different data types is
    fundamental to writing effective and dynamic programs. We''ll cover the concept
    of variables, explore the core data types in detail, and provide practical examples
    to solidify your understanding.


    ### Variables


    Variables are like containers that hold different types of data. They allow you
    to store and manipulate values, making your programs dynamic and adaptable. In
    Ruby, variables are dynamically typed, meaning you don''t need to explicitly declare
    the data type when defining a variable.


    #### Variable Assignment


    To assign a value to a variable, use the assignment operator `=`.


    ```ruby


    name = "Alice"


    age = 25


    ```


    #### Naming Conventions


    Ruby follows specific naming conventions for variables:


    - Variable names must start with a lowercase letter or an underscore.


    - They can consist of letters, digits, and underscores.


    - Ruby is case-sensitive, so `my_variable` and `My_Variable` are different variables.


    ### Core Data Types


    Ruby has several core data types that you''ll frequently encounter in your programming
    journey. Let''s explore them in detail.


    #### Strings


    Strings are used to represent textual data and are enclosed in either single or
    double quotes.


    ```ruby


    greeting = "Hello, Ruby!"


    ```


    You can manipulate strings using various methods:


    ```ruby


    name = "Alice"


    greeting = "Hello, #{name}" # String interpolation


    length = greeting.length


    uppercase = greeting.upcase


    ```


    #### Numbers


    Ruby supports both integers and floating-point numbers.


    ```ruby


    count = 10


    pi = 3.14


    ```


    You can perform arithmetic operations on numbers:


    ```ruby


    sum = count + 5


    difference = pi - 1.14


    product = 4 * 6


    quotient = 15 / 3


    ```


    #### Booleans


    Booleans represent true or false values and are essential for making decisions
    in your code.


    ```ruby


    is_raining = true


    is_sunny = false


    ```


    You often use comparison operators to work with booleans:


    ```ruby


    greater_than = 10 > 5


    less_than = 3 < 7


    equal_to = 8 == 8


    not_equal = 5 != 10


    ```


    #### Arrays


    Arrays are ordered collections of items. They can contain different data types,
    and their index starts from 0.


    ```ruby


    fruits = ["apple", "banana", "orange"]


    ```


    You can access elements and perform various operations on arrays:


    ```ruby


    first_fruit = fruits[0]


    fruits.push("grape") # Adding an element


    fruits.pop # Removing the last element


    ```


    #### Hashes


    Hashes store key-value pairs, allowing you to associate data with meaningful labels.


    ```ruby


    person = { "name" => "John", "age" => 30, "city" => "New York" }


    ```


    Accessing and manipulating hashes:


    ```ruby


    person["name"] # Accessing value by key


    person["job"] = "Engineer" # Adding a new key-value pair


    person.delete("age") # Removing a key-value pair


    ```


    ### Examples


    Let''s apply our knowledge with some practical examples:


    #### Example 1: Using Variables to Calculate Area


    ```ruby


    length = 5


    width = 3


    area = length * width


    puts "The area is: #{area}"


    ```


    #### Example 2: Working with Strings


    ```ruby


    name = "Alice"


    greeting = "Hello, #{name}!"


    uppercase_name = name.upcase


    puts greeting


    puts "Uppercase Name: #{uppercase_name}"


    ```


    #### Example 3: Creating and Manipulating Arrays


    ```ruby


    fruits = ["apple", "banana", "orange"]


    fruits.push("grape")


    fruits.pop


    puts "Fruits: #{fruits}"


    ```


    ### Conclusion


    Variables and data types are the foundation of any programming language, and Ruby
    is no exception. In this chapter, we''ve explored the concept of variables and
    the core data types, including strings, numbers, booleans, arrays, and hashes.
    By understanding how to work with these fundamental elements, you''re now equipped
    to start building more complex and dynamic programs. In the next chapter, we''ll
    take a closer look at control structures, which allow you to make decisions and
    control the flow of your code.'
