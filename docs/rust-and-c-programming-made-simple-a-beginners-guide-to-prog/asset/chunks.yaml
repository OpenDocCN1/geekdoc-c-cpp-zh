    # Chapter 11: Inheritance and Polymorphism


    Inheritance and polymorphism are two fundamental concepts in object-oriented programming
    (OOP). They allow for code reuse, extensibility, and the ability to work with
    objects of different types through a common interface. In this chapter, we will
    explore inheritance and polymorphism in C++.


    ## Inheritance


    Inheritance is a mechanism that allows a class to inherit properties (attributes
    and methods) from another class. The class being inherited from is called the
    base class or superclass, and the class inheriting from it is called the derived
    class or subclass.


    ### Base and Derived Classes


    To establish an inheritance relationship, we use the `class` keyword followed
    by the name of the derived class, a colon, and the access specifier (`public`,
    `protected`, or `private`) followed by the base class. Here''s an example:


    ```cpp

    class Shape {

    protected:

    int width;

    int height;

    public:

    Shape(int w, int h) {

    width = w;

    height = h;

    }

    int calculateArea() {

    return width * height;

    }

    };


    class Rectangle : public Shape {

    public:

    Rectangle(int w, int h) : Shape(w, h) {

    // Constructor body

    }

    };

    ```


    In this example, we have a base class `Shape` with attributes `width` and `height`
    and a method `calculateArea()`. The derived class `Rectangle` inherits from `Shape`
    using the `public` access specifier. The constructor of `Rectangle` invokes the
    constructor of `Shape` using the initialization list.


    ### Access Specifiers in Inheritance


    Inheritance introduces three access specifiers: `public`, `protected`, and `private`.
    These specifiers determine the accessibility of the inherited members in the derived
    class:


    - `public`: Inherited members are accessible as public members in the derived
    class.

    - `protected`: Inherited members are accessible as protected members in the derived
    class.

    - `private`: Inherited members are inaccessible in the derived class.


    The choice of access specifier depends on the desired level of encapsulation and
    data hiding.


    ## Polymorphism


    Polymorphism is the ability of objects of different classes to be treated as objects
    of a common base class. It allows us to write code that can work with objects
    of different types without needing to know their specific types.


    ### Pointers and References to Base Class


    Polymorphism is often achieved using pointers or references to the base class.
    Here''s an example:


    ```cpp

    Shape* shapePtr;

    Shape& shapeRef;

    Rectangle rect(5, 3);

    Circle circle(4);


    shapePtr = &rect;

    shapeRef = circle;

    int area = shapePtr->calculateArea();

    ```


    In this example, we declare a pointer `shapePtr` and a reference `shapeRef` of
    type `Shape`. We then create objects of the derived classes `Rectangle` and `Circle`.
    We can assign the address of the `Rectangle` object to `shapePtr` and assign the
    `Circle` object to `shapeRef`. We can call the `calculateArea()` method using
    the pointer `shapePtr`, which demonstrates polymorphic behavior.


