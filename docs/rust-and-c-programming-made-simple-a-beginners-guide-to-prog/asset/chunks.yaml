  trans: "\n异常处理是 C++ 中一种强大的机制，允许我们处理并从程序执行过程中发生的意外情况或错误中恢复。它提供了一种结构化的方式来捕获和处理异常，确保程序不会突然终止。\n\
    \n## 异常处理简介\n\n在 C++ 中，异常是表示异常状态（如运行时错误或意外事件）的对象或值。当发生异常状态时，可以使用 `throw` 语句将其“抛出（throw）”。`throw`\
    \ 语句会将控制权转移给可以处理该异常的异常处理器。\n\n处理异常的过程涉及三个关键部分：\n\n1. **抛出异常**：当异常状态发生时，我们使用 `throw`\
    \ 语句抛出一个异常。\n2. **捕获异常**：我们定义异常处理器来捕获并处理特定类型的异常。这是通过 `try` 和 `catch` 块实现的。\n3.\
    \ **处理异常**：在 `catch` 块中，我们指定当捕获到特定类型异常时要采取的操作。这允许我们从错误中优雅地恢复或采取适当措施。\n\n## 异常处理的语法\n\
    \nC++ 异常处理的语法涉及 `try`、`catch` 和 `throw` 语句的使用：\n\n```cpp\ntry {\n    // 可能会抛出异常的代码\n\
    } catch (ExceptionType1 ex1) {\n    //  ExceptionType1 的处理器\n} catch (ExceptionType2\
    \ ex2) {\n    //  ExceptionType2 的处理器\n} catch (...) {\n    // 任何其他异常的处理器\n}\n\
    ```\n\n在此语法中：\n\n- `try` 块封装可能抛出异常的代码。\n- `catch` 块指定了特定类型异常的处理器。异常类型在括号内指定。\n\
    - 最后 `catch` 块中的 `...` 代表任何未被显式捕获的其它异常类型。\n\n当 `try` 块内抛出异常时，程序流根据抛出的异常类型转移到相应的\
    \ `catch` 块。\n\n## 处理标准异常\n\nC++ 提供了一系列标准异常类，表示常见类型的异常。这些类定义在 `<stdexcept>` 头文件中。以下是一些常用的标准异常类：\n\
    \n- `std::exception`：所有标准异常的基类。它提供一个 `what()` 方法，返回一个描述性的错误消息。\n- `std::runtime_error`：表示运行时发生的错误，例如逻辑错误或资源失败。\n\
    - `std::logic_error`：表示由于代码中的逻辑错误导致的错误，例如无效参数或函数使用不当。\n- `std::out_of_range`：表示访问有效范围之外元素时发生的错误，例如索引越界。\n\
    \n以下是一个使用标准异常处理异常的示例：\n\n```cpp\n#include <iostream>\n#include <stdexcept>\n\n\
    int divide(int a, int b) {\n    if (b == 0) {\n        throw std::runtime_error(\"\
    Division by zero!\");\n    }\n    return a / b;\n}\n\nint main() {\n    try {\n\
    \        int result = divide(10, 0);\n        std::cout << \"Result: \" << result\
    \ << std::endl;\n    } catch (const std::exception& ex) {\n        std::cout <<\
    \ \"Exception caught: \" << ex.what() << std::endl;\n    }\n    return 0;\n}\n\
    ```\n\n在这个示例中，`divide()` 函数除以两个数字。如果除数（`b`）为零，则抛出一个 `std::runtime_error` 异常。在\
    \ `main()` 函数中，我们使用 `try` 块来捕获类型为 `std::exception` 或其派生类的任何异常。捕获到的异常在 `catch`\
    \ 块中处理，我们使用 `what()` 方法打印错误消息。\n\n## 创建自定义异常\n\n除了使用标准异常外，我们还可以通过派生 `std::exception`\
    \ 或其派生类来创建自定义的异常类。自定义异常允许我们表示特定应用程序错误，并提供关于异常状态的信息。\n\n以下是一个创建和使用自定义异常的示例：\n\n\
    ```cpp\n#include <iostream>\n#include <stdexcept>\n\nclass MyException : public\
    \ std::exception {\npublic:\n    const char* what() const noexcept override {\n\
    \        return \"Custom Exception: Something went wrong!\";\n    }\n};\n\nvoid\
    \ process() {\n    throw MyException();\n}\n\nint main() {\n    try {\n      \
    \  process();\n    } catch (const std::exception& ex) {\n        std::cout <<\
    \ \"Exception caught: \" << ex.what() << std::endl;\n    }\n    return 0;\n}\n\
    ```\n\n在这个示例中，我们定义了一个派生自 `std::exception` 的自定义异常类 `MyException`。我们重写了 `what()`\
    \ 方法以提供自定义错误消息。`process()` 函数抛出了 `MyException` 实例。在 `main()` 函数中，我们捕获类型为 `std::exception`\
    \ 或其派生类的任何异常并进行相应处理。\n\n## 异常处理最佳实践\n\n在 C++ 中处理异常处理时，请记住以下最佳实践：\n\n- **捕获特定异常**：捕获特定类型的异常以进行适当处理。这允许进行针对性的错误处理并更好地控制程序流。\n\
    - **按引用捕获异常**：通过引用捕获异常（`const std::exception&`）以确保对象的正确析构并避免对象切割（object slicing）。\n\
    - **在合适的级别处理异常**：在程序可以有效从错误中恢复或采取必要措施的级别处理异常。避免在程序中过早或过晚捕获异常。\n- **谨慎使用异常规范**：异常规范（`throw()`\
    \ 或 `noexcept`）限制了函数可以抛出的异常类型。然而，在现代 C++ 中通常不建议使用，因为它们会干扰灵活性。\n- **清理资源**：当异常发生时，确保清理任何资源（例如内存、文件句柄）以避免资源泄漏。\n\
    \n## 总结\n\n异常处理是 C++ 中一种强大的机制，允许我们处理并从程序执行过程中发生的意外情况或错误中恢复。通过使用 `try`、`catch`\
    \ 和 `throw` 语句，我们可以创建健壮且容错的程序。\n\n在本章中，我们探讨了异常处理的基础知识，包括抛出异常、捕获异常和处理标准异常。我们还学习了如何创建自定义异常来表示应用程序错误。通过遵循最佳实践，我们可以有效地处理异常并构建更可靠的软件。\n"
- fmt: "\n# Templates\n\nClass templates allow us to create generic classes that can\
    \ work with different types. The syntax for a class template is similar to that\
    \ of a regular class, with the template parameter(s) specified in angle brackets\
    \ (`<>`). Here's an example:\n\n```cpp\ntemplate <typename T>\nclass Stack {\n\
    private:\n  std::vector<T> elements;\npublic:\n  void push(const T& value) {\n\
    \    elements.push_back(value);\n  }\n  void pop() {\n    elements.pop_back();\n\
    \  }\n  T top() const {\n    return elements.back();\n  }\n  bool empty() const\
    \ {\n    return elements.empty();\n  }\n};\n```\n\nIn this example, we define\
    \ a class template `Stack` that represents a stack data structure. The elements\
    \ of the stack are stored in a `std::vector` container, which is a part of the\
    \ STL.\n\nWe can create instances of the `Stack` class template for different\
    \ types:\n\n```cpp\nStack<int> intStack;      // Stack of integers\nStack<double>\
    \ doubleStack; // Stack of doubles\nintStack.push(42);\ndoubleStack.push(3.14);\n\
    ```\n\n## Template Specialization\n\nTemplate specialization allows us to provide\
