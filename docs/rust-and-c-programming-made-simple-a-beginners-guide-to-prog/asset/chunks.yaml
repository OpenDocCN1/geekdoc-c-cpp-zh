    # Chapter 2: Getting Started with C++


    In Chapter 1, we explored the basics of C++ programming and wrote our first "Hello,
    World!" program. Now, let''s delve deeper into the language and learn how to work
    with variables, input/output operations, and basic arithmetic.


    ## Variables and Data Types


    Variables are essential components of any programming language, including C++.
    They are used to store and manipulate data during program execution. Before we
    can use a variable, we must declare it, specifying its data type and name.


    C++ supports various data types, including integers, floating-point numbers, characters,
    and booleans. Here are some commonly used data types:


    - `int`: Represents integers (whole numbers) such as -3, 0, and 42.


    - `float` and `double`: Represent floating-point numbers (decimal numbers) such
    as 3.14 and 2.71828.


    - `char`: Represents individual characters such as ''A'', ''b'', and ''$''.


    - `bool`: Represents boolean values (`true` or `false`).


    To declare a variable, we specify its data type followed by its name. Here''s
    an example:


    ```cpp


    int age;        // Declaration of an integer variable named ''age''


    float pi;       // Declaration of a floating-point variable named ''pi''


    char grade;     // Declaration of a character variable named ''grade''


    bool isValid;   // Declaration of a boolean variable named ''isValid''


    ```


    Once declared, we can assign values to variables using the assignment operator
    (`=`). For example:


    ```cpp


    age = 25;           // Assigning the value 25 to the ''age'' variable


    pi = 3.14159;       // Assigning the value 3.14159 to the ''pi'' variable


    grade = ''A'';        // Assigning the character ''A'' to the ''grade'' variable


    isValid = true;     // Assigning the boolean value ''true'' to the ''isValid''
    variable


    ```


    We can also combine the declaration and assignment in a single step:


    ```cpp


    int score = 100;            // Declaration and assignment of an integer variable
    named ''score''


    double temperature = 98.6;  // Declaration and assignment of a double variable
    named ''temperature''


    char symbol = ''$'';          // Declaration and assignment of a character variable
    named ''symbol''


    bool isReady = false;       // Declaration and assignment of a boolean variable
    named ''isReady''


    ```


