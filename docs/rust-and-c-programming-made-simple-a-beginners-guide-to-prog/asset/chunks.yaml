    \ It provides a `what()` method that returns a descriptive error message.\n- `std::runtime_error`:\
    \ Represents errors that occur during runtime, such as logical errors or resource\
    \ failures.\n- `std::logic_error`: Represents errors that occur due to logical\
    \ mistakes in the code, such as invalid arguments or incorrect use of functions.\n\
