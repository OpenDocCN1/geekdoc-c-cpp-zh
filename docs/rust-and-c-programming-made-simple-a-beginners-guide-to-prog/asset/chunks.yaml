    # ## 7.1 Understanding Concurrency and Parallelism


    Before we dive into Rust''s concurrency features, let''s clarify the concepts
    of concurrency and parallelism.


    Concurrency is the ability of a program to execute multiple tasks simultaneously,
    regardless of the physical number of CPU cores. Concurrency allows tasks to overlap
