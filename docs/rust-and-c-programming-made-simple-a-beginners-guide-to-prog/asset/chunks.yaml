    # 第 11 章：继承与多态


    继承和多态是面向对象编程（OOP）中的两个基本概念。它们允许代码重用、扩展，以及通过通用接口与不同类型的对象交互的能力。在本章中，我们将探索 C++ 中的继承和多态。


    ## 继承


    继承是一种允许类从另一个类继承属性（属性和方法）的机制。被继承的类称为基类（base class）或超类，继承它的类称为派生类（derived class）或子类。


    ### 基类与派生类


    要建立继承关系，我们使用 `class` 关键字后跟派生类的名称、冒号、访问限定符（`public`、`protected` 或 `private`），最后是基类。这里有一个示例：


    ```cpp

    class Shape {

    protected:

    int width;

    int height;

    public:

    Shape(int w, int h) {

    width = w;

    height = h;

    }

    int calculateArea() {

    return width * height;

    }

    };


    class Rectangle : public Shape {

    public:

    Rectangle(int w, int h) : Shape(w, h) {

    // Constructor body

    }

    };

    ```


    在这个用例中，我们有一个基类 `Shape`，包含属性 `width` 和 `height` 以及一个方法 `calculateArea()`。派生类 `Rectangle`
    使用 `public` 访问限定符继承自 `Shape`。`Rectangle` 的构造函数通过初始化列表调用了 `Shape` 的构造函数。


    ### 继承中的访问限定符


    继承引入了三个访问限定符：`public`、`protected` 和 `private`。这些限定符决定了继承成员在派生类中的可见性：


    - `public`：继承的成员在派生类中作为公共成员可见。

    - `protected`：继承的成员在派生类中作为保护成员可见。

    - `private`：派生类中不可访问。


    访问限定符的选择取决于所需的封装和数据隐藏程度。


    ## 多态


    多态是将不同类的对象视为公共基类对象的能力。它允许我们编写处理不同类型对象的代码，而无需知道它们的具体类型。


    ### 基类指针和引用


    多态通常通过基类指针或引用来实现。这里有一个示例：


    ```cpp

    Shape* shapePtr;

    Shape& shapeRef;

    Rectangle rect(5, 3);

    Circle circle(4);


    shapePtr = &rect;

    shapeRef = circle;

    int area = shapePtr->calculateArea();

    ```


    在这个用例中，我们声明了 `Shape` 类型的指针 `shapePtr` 和引用 `shapeRef`。然后我们创建了派生类 `Rectangle` 和
    `Circle` 的对象。我们可以将 `Rectangle` 对象的地址赋予 `shapePtr`，并将 `Circle` 对象赋值给 `shapeRef`。我们使用指针
    `shapePtr` 调用 `calculateArea()` 方法，这展示了多态行为。


