    ## Dynamic Memory Allocation


    Dynamic memory allocation allows us to allocate and deallocate memory at runtime.
    It enables us to create data structures of varying sizes and use memory efficiently.


    ### Allocating Memory: new and delete Operators


    To allocate memory dynamically, we use the `new` operator followed by the data
    type of the object we want to allocate. Here''s an example:


    ```cpp


    int* ptr = new int;    // Dynamic allocation of an integer variable


    *ptr = 10;    // Assigning a value to the dynamically allocated integer


    std::cout << "Value: " << *ptr << std::endl;    // Accessing the value through
    the pointer


    delete ptr;    // Deallocating the dynamically allocated memory


    ```


    In this example, the `new` operator is used to dynamically allocate an integer
    variable. The value 10 is assigned to the allocated memory, and it is accessed
    through the pointer. After using the dynamically allocated memory, it is deallocated
    using the `delete` operator to free the memory.


    ### Allocating Memory for Arrays


    We can also dynamically allocate memory for arrays. Here''s an example:


    ```cpp


    int size;


    std::cout << "Enter the size of the array: ";


    std::cin >> size;


    int* numbers = new int[size];    // Dynamic allocation of an integer array


    // Accessing and manipulating elements of the dynamically allocated array


    for (int i = 0; i < size; i++) {


    numbers[i] = i * 10;


    }


    // Printing the elements of the dynamically allocated array


    for (int i = 0; i < size; i++) {


    std::cout << "Element at index " << i << ": " << numbers[i] << std::endl;


    }


    delete[] numbers;    // Deallocating the dynamically allocated memory for the
    array


    ```


