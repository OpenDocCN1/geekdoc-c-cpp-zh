    In the `main` function, we handle the result of `process_file` using a `match`
    expression. If the result is `Ok`, we print a success message. If the result is
    `Err`, we print the custom error message.


    # ## 9.3 Propagating Errors with the ? Operator


    One of the strengths of Rust''s error handling mechanism is the ability to propagate
    errors using the `?` operator. The `?` operator can be used in functions that
    return `Result` to automatically propagate errors from functions called within
    the current function.


    Let''s see an example that demonstrates error propagation using the `?` operator:


    ```rust


    use std::fs;


    fn read_and_write_file(source: &str, destination: &str) -> Result<(), std::io::Error>
    {


    let contents = fs::read_to_string(source)?;


    fs::write(destination, contents)?;


    Ok(())


    }


    fn main() {


    match read_and_write_file("source.txt", "destination.txt") {


    Ok(()) => println!("File copied successfully"),


    Err(error) => eprintln!("Error copying file: {}", error),


    }


    }


    ```


    In this example, we define a function `read_and_write_file` that reads the contents
    of a source file and writes them to a destination file. Both file operations can
    potentially fail and return `Result`.


    By using the `?` operator, any error that occurs during the file operations is
    automatically propagated back to the caller. If an error occurs during `fs::read_to_string`
    or `fs::write`, the `Err` value is returned, and the function exits early.


    In the `main` function, we handle the result of `read_and_write_file` using a
    `match` expression. If the result is `Ok`, we print a success message. If the
    result is `Err`, we print the error message.


    ## Conclusion


    In this chapter, we explored Rust''s error handling features, which allow us to
    deal with unexpected situations effectively. We learned about the `Result` and
    `Option` types and how they enable explicit error handling in Rust. We also saw
    how to create custom error types and propagate errors using the `?` operator.


