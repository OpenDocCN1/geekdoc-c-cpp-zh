    \ std::endl;\n```\n\n- Length: The `length()` or `size()` member functions can\
    \ be used to obtain the length of a string. Here's an example:\n\n```cpp\nstd::string\
    \ message = \"Hello, world!\";\nint length = message.length();\nstd::cout << \"\
    Length of the string: \" << length << std::endl;\n```\n\n- Accessing Characters:\
    \ Individual characters of a string can be accessed using the array-like indexing\
    \ notation. Here's an example:\n\n```cpp\nstd::string message = \"Hello, world!\"\
    ;\nchar firstCharacter = message[0];\nchar lastCharacter = message[message.length()\
    \ - 1];\nstd::cout << \"First character: \" << firstCharacter << std::endl;\n\
    std::cout << \"Last character: \" << lastCharacter << std::endl;\n```\n\n- Substrings:\
    \ Substrings can be extracted from a string using the `substr()` member function.\
