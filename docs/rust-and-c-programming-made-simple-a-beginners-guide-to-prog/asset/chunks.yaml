    # Chapter 7: Functions and Modular Programming


    In Chapter 6, we explored arrays and strings in C++. In this chapter, we will
    dive into functions and modular programming. Functions allow us to break down
    complex programs into smaller, manageable pieces of code, making our programs
    more organized, modular, and reusable.


    ## Functions


    A function is a named block of code that performs a specific task or a set of
    related tasks. Functions provide a way to modularize our code by encapsulating
    a series of statements into a single unit. They promote code reuse, readability,
    and maintainability.


    ### Function Declaration and Definition


    To define a function in C++, we provide the function''s signature, which includes
    its return type, name, and any parameters it accepts. The function''s body contains
    the statements to be executed when the function is called. Here''s an example
    of a function declaration and definition:


    ```cpp


    // Function declaration


    int addNumbers(int a, int b);


    // Function definition


    int addNumbers(int a, int b) {


    int sum = a + b;


    return sum;


    }


    ```


    In this example, we declare and define a function named `addNumbers` that takes
    two integer parameters `a` and `b` and returns an integer value. The function
    calculates the sum of `a` and `b` and returns the result using the `return` statement.


    ### Function Call


    To use a function, we need to call it by its name and provide the required arguments,
    if any. Here''s an example of calling the `addNumbers` function:


    ```cpp


    int result = addNumbers(5, 3);


    ```


    In this example, the `addNumbers` function is called with the arguments 5 and
    3\. The return value of the function, which is the sum of the two numbers, is
    stored in the `result` variable.


    ### Function Parameters


    Function parameters allow us to pass values into a function. Parameters act as
    variables within the function''s scope, and their values can be used during the
    execution of the function. Here''s an example:


    ```cpp


    int multiplyNumbers(int a, int b) {


    int product = a * b;


    return product;


    }


    ```


    In this example, the `multiplyNumbers` function takes two integer parameters `a`
    and `b`. It calculates the product of `a` and `b` and returns the result.


    ### Function Return Types


    The return type of a function specifies the type of value the function returns.
    It can be any valid data type, including fundamental types, user-defined types,
    or even `void` if the function doesn''t return a value. Here''s an example:


    ```cpp


    void greet() {


    std::cout << "Hello, world!" << std::endl;


    }


    ```


    In this example, the `greet` function has a return type of `void`, indicating
    that it doesn''t return a value. It simply prints "Hello, world!" to the console.


    ### Function Overloading


    Function overloading allows us to define multiple functions with the same name
    but different parameter lists. C++ determines which function to call based on
    the arguments provided during the function call. Here''s an example:


    ```cpp


    int square(int number) {


    return number * number;


    }


    double square(double number) {


    return number * number;


    }


    ```


    In this example, we define two `square` functions. One takes an integer parameter,
    and the other takes a double parameter. The appropriate function is called based
    on the data type of the argument provided.


    ## Modular Programming


    Modular programming is an approach that emphasizes breaking down a program into
    modular, self-contained units called modules or functions. Each function performs
    a specific task and can be developed, tested, and maintained independently. This
    modular structure promotes code reuse, scalability, and maintainability.


    ### Benefits of Modular Programming


    Modular programming offers several benefits:


    - **Code Reusability**: Functions can be reused in multiple parts of a program,
    reducing code duplication and promoting efficiency.


    - **Readability**: Breaking down a program into functions makes the code more
    readable and understandable. Functions provide descriptive names that convey their
    purpose and functionality.


    - **Ease of Maintenance**: With modular programming, modifying or fixing bugs
    in a program becomes easier. Changes can be made to individual functions without
    affecting other parts of the program.


    - **Scalability**: New functions can be added or existing functions can be modified
    without affecting the rest of the program. This allows for easy expansion and
    scalability.


    ### Example: Modular Programming with Functions


    Let''s consider an example where we want to calculate the area and perimeter of
    a rectangle. We can modularize the program by defining separate functions for
    each task:


    ```cpp


    #include <iostream>


