    # Chapter 4: Operators and Expressions


    In Chapter 3, we explored variables and data types in C++. In this chapter, we
    will dive into operators and expressions. Operators allow us to perform various
    operations on variables and values, while expressions combine variables, values,
    and operators to form meaningful computations.


    ## Arithmetic Operators


    Arithmetic operators are used to perform basic mathematical calculations. C++
    provides the following arithmetic operators:


    - Addition (`+`): Adds two values together.


    - Subtraction (`-`): Subtracts one value from another.


    - Multiplication (`*`): Multiplies two values.


    - Division (`/`): Divides one value by another.


    - Modulo (`%`): Returns the remainder of a division operation.


    Let''s explore these operators with examples:


    ```cpp


    #include <iostream>


    int main() {


    int a = 10;


    int b = 3;


    int sum = a + b;            // Addition


    int difference = a - b;     // Subtraction


    int product = a * b;        // Multiplication


    int quotient = a / b;       // Division


    int remainder = a % b;      // Modulo


    std::cout << "Sum: " << sum << std::endl;


    std::cout << "Difference: " << difference << std::endl;


    std::cout << "Product: " << product << std::endl;


    std::cout << "Quotient: " << quotient << std::endl;


    std::cout << "Remainder: " << remainder << std::endl;


    return 0;


    }


    ```


    In the above code, the variables `a` and `b` hold the values 10 and 3, respectively.
    The arithmetic operators are used to perform addition, subtraction, multiplication,
    division, and modulo operations. The results are then displayed using `std::cout`.


    ## Relational Operators


    Relational operators are used to compare values and determine the relationship
    between them. C++ provides the following relational operators:


    - Equal to (`==`): Checks if two values are equal.


    - Not equal to (`!=`): Checks if two values are not equal.


    - Greater than (`>`): Checks if one value is greater than another.


    - Less than (`<`): Checks if one value is less than another.


    - Greater than or equal to (`>=`): Checks if one value is greater than or equal
    to another.


    - Less than or equal to (`<=`): Checks if one value is less than or equal to another.


    Here''s an example that demonstrates the use of relational operators:


    ```cpp


    #include <iostream>


    int main() {


    int a = 5;


    int b = 10;


    bool isEqual = (a == b);             // Equal to


    bool isNotEqual = (a != b);          // Not equal to


    bool isGreaterThan = (a > b);        // Greater than


    bool isLessThan = (a < b);           // Less than


    bool isGreaterThanOrEqual = (a >= b);// Greater than or equal to


    bool isLessThanOrEqual = (a <= b);   // Less than or equal to


    std::cout << "Is equal: " << isEqual << std::endl;


    std::cout << "Is not equal: " << isNotEqual << std::endl;


    std::cout << "Is greater than: " << isGreaterThan << std::endl;


    std::cout << "Is less than: " << isLessThan << std::endl;


    std::cout << "Is greater than or equal to: " << isGreaterThanOrEqual << std::endl;


    std::cout << "Is less than or equal to: " << isLessThanOrEqual << std::endl;


    return 0;


    }


    ```


    In the above code, the variables `a` and `b` hold the values 5 and 10, respectively.
    The relational operators are used to compare these values and assign the results
    to boolean variables. The boolean values are then displayed using `std::cout`.


    ## Logical Operators


    Logical operators are used to combine multiple conditions and perform logical
    operations. C++ provides the following logical operators:


    - Logical AND (`&&`): Returns `true` if both conditions are true.


    - Logical OR (`||`): Returns `true` if at least one condition is true.


    - Logical NOT (`!`): Inverts the result of a condition.


    Let''s see an example that demonstrates the use of logical operators:


    ```cpp


    #include <iostream>


    int main() {


    int age = 25;


    bool hasLicense = true;


    bool isEligible = (age >= 18) && hasLicense;       // Logical AND


    bool canDrive = (age >= 18) || hasLicense;         // Logical OR


    bool cannotDrive = !canDrive;                      // Logical NOT


    std::cout << "Is eligible: " << isEligible << std::endl;


    std::cout << "Can drive: " << canDrive << std::endl;


    std::cout << "Cannot drive: " << cannotDrive << std::endl;


    return 0;


    }


    ```


    In the above code, the variables `age` and `hasLicense` represent an individual''s
    age and whether they possess a valid license. The logical operators are used to
    combine these conditions and assign the results to boolean variables. The boolean
    values are then displayed using `std::cout`.


    ## Assignment Operators


    Assignment operators are used to assign values to variables. C++ provides various
    assignment operators, including the basic assignment operator (`=`) and compound
    assignment operators (`+=`, `-=`, `*=`, `/=`, and `%=`).


    Here''s an example that demonstrates the use of assignment operators:


    ```cpp


    #include <iostream>


    int main() {


    int a = 5;


    a += 3;     // Equivalent to: a = a + 3;


    a -= 2;     // Equivalent to: a = a - 2;


    a *= 4;     // Equivalent to: a = a * 4;


    a /= 2;     // Equivalent to: a = a / 2;


    a %= 3;     // Equivalent to: a = a % 3;


    std::cout << "Updated value of ''a'': " << a << std::endl;


    return 0;


    }


    ```


    In the above code, the variable `a` initially holds the value 5\. The compound
    assignment operators are used to modify the value of `a` by performing arithmetic
    operations and assigning the results back to `a`. The updated value of `a` is
    then displayed using `std::cout`.


    ## Precedence and Associativity of Operators


    Operators in C++ have different levels of precedence and associativity, which
    determine the order of evaluation when multiple operators are present in an expression.
    It is essential to understand operator precedence to write expressions that produce
    the desired results.'
