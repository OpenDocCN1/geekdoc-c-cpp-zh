    # Chapter 10: Testing Your Rust Code: Ensuring Reliability


    In Chapter 9, we explored Rust''s error handling features and learned how to handle
    unexpected situations effectively. Now, let''s turn our attention to testing.
    Testing is a critical part of software development as it helps ensure the reliability
    and correctness of our code. Rust provides robust testing capabilities that allow
    us to write automated tests and validate the behavior of our code. In this chapter,
    we will delve into Rust''s testing framework and learn how to write tests for
    our Rust projects.


    # ## 10.1 Writing Unit Tests in Rust


    Rust''s testing framework provides support for writing unit tests, which are focused
    tests that verify the behavior of individual units or components of our code.
    Unit tests are isolated from the rest of the codebase and allow us to test specific
    functions, methods, or modules in isolation.


    To write a unit test in Rust, we use the `#[cfg(test)]` attribute to indicate
    that the code is part of the test suite. We then write test functions annotated
    with the `#[test]` attribute. These functions contain assertions that verify the
    expected behavior of the code being tested.


    Let''s see an example that demonstrates how to write unit tests in Rust:


    ```rust


    fn add(a: i32, b: i32) -> i32 {


    a + b


    }


    #[cfg(test)]


    mod tests {


    use super::*;


    #[test]


    fn test_add() {


    assert_eq!(add(2, 2), 4);


    assert_eq!(add(-1, 5), 4);


    assert_eq!(add(10, -3), 7);


    }


    }


    ```


    In this example, we define a simple function `add` that takes two integers and
    returns their sum. In the `tests` module, we write a unit test function `test_add`
    that asserts the expected results of the `add` function using the `assert_eq!`
    macro.


    To run the tests, we can use the `cargo test` command in our project directory.
    This command will automatically discover and execute all the unit tests defined
    in our codebase.


