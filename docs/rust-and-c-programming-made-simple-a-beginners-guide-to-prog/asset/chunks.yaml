  raw: 'Data persistence involves storing and retrieving data in a way that allows
    it to be accessed and used beyond the lifetime of a program. There are several
    options available for data persistence in Rust, ranging from relational databases
    to NoSQL databases, and from file systems to key-value stores. The choice of data
    persistence technique depends on factors like data structure, query requirements,
    scalability, and performance.


    # ## 15.2 Working with Databases in Rust


    Databases provide a structured and efficient way to store and retrieve data. Rust
    has a rich ecosystem of database libraries that allow us to interact with various
    databases, both relational and NoSQL. Let''s explore two popular Rust database
    libraries: `diesel` and `mongodb`.


    # ### 15.2.1 Using Diesel with Relational Databases


    `diesel` is a popular Rust library for interacting with relational databases.
    It provides a type-safe query builder and an Object-Relational Mapping (ORM) system,
    making it easier to work with databases in a Rust idiomatic way. Here''s an example
    that demonstrates how to use `diesel` with a PostgreSQL database:


    ```rust


    use diesel::prelude::*;


    use diesel::pg::PgConnection;


    use dotenv::dotenv;


    use std::env;


    #[derive(Queryable)]


    struct User {


    id: i32,


    name: String,


    email: String,


    }


    fn main() {


    dotenv().ok();


    let database_url = env::var("DATABASE_URL").expect("DATABASE_URL must be set");


    let conn = PgConnection::establish(&database_url).expect("Failed to connect to
    database");


    let results = users


    .filter(name.eq("Alice"))


    .limit(5)


    .load::<User>(&conn)


    .expect("Failed to load users");


    for user in results {


    println!("ID: {}, Name: {}, Email: {}", user.id, user.name, user.email);


    }


    }


    ```


    In this example, we connect to a PostgreSQL database using the `PgConnection`
    type from `diesel`. We define a `User` struct and use the `Queryable` trait to
    map the table columns to the struct fields. We then perform a query to fetch users
    named "Alice" and print their details.


    # ### 15.2.2 Using MongoDB with Rust


    MongoDB is a popular NoSQL database that provides flexible document storage. Rust
    has excellent support for MongoDB through the `mongodb` crate. Here''s an example
    that demonstrates how to use `mongodb` to interact with a MongoDB database:


    ```rust


    use mongodb::{bson::doc, options::ClientOptions, Client};


    #[derive(Debug, Deserialize, Serialize)]


    struct User {


    id: i32,


    name: String,


    email: String,


    }


    #[tokio::main]


    async fn main() {


    let client_options = ClientOptions::parse("mongodb://localhost:27017").await.unwrap();


    let client = Client::with_options(client_options).unwrap();


    let db = client.database("mydb");


    let collection = db.collection::<User>("users");


    let filter = doc! { "name": "Alice" };


    let result = collection.find_one(filter, None).await.unwrap();


    match result {


    Some(user) => {


    println!("User: {:?}", user);


    }


    None => {


    println!("User not found.");


    }


    }


    }


    ```


    In this example, we establish a connection to a local MongoDB instance using the
    `ClientOptions` and `Client` types from `mongodb`. We access a database named
    "mydb" and a collection named "users". We perform a query to find a user with
    the name "Alice" and print the user''s details if found.


    # ## 15.3 Working with File Systems in Rust


    In addition to databases, Rust provides powerful tools for working with file systems.
    We can create, read, update, and delete files and directories using Rust''s standard
    library and various crates. Let''s see an example that demonstrates file I/O operations
    in Rust:


    ```rust


    use std::fs::File;


    use std::io::{Read, Write};


    fn main() {


    let mut file = File::create("data.txt").expect("Failed to create file");


    file.write_all(b"Hello, Rust!").expect("Failed to write to file");


    let mut contents = String::new();


    let mut file = File::open("data.txt").expect("Failed to open file");


    file.read_to_string(&mut contents).expect("Failed to read from file");


    println!("File contents: {}", contents);


    }


    ```


    In this example, we create a new file named "data.txt" and write the text "Hello,
    Rust!" to it. We then open the file, read its contents into a string, and print
    the contents.


    ## Conclusion


    In this chapter, we explored data persistence in Rust. We learned how to work
    with databases using libraries like `diesel` and `mongodb`, allowing us to interact
    with relational and NoSQL databases. We also saw how to perform file I/O operations
    using Rust''s standard library. With the knowledge gained from this chapter, you
    can build applications that store and retrieve data efficiently and reliably.


    Congratulations! You have now completed the journey of learning Rust programming
    from the basics to data persistence. Rust''s strong guarantees, performance, and
    safety make it an excellent choice for a wide range of applications. Keep practicing
    and exploring new areas of Rust to become a proficient Rust programmer. Happy
    coding!


