- fmt: "\nInput and output (I/O) operations are crucial for interacting with the user\
    \ and displaying information. C++ provides the `iostream` library, which contains\
    \ the necessary functions and objects for performing I/O operations.\n\nTo use\
    \ the `iostream` library, we include the `<iostream>` header at the beginning\
    \ of our program:\n\n```cpp\n#include <iostream>\n```\n\nLet's explore two essential\
    \ I/O operations: output using `std::cout` and input using `std::cin`.\n\n###\
    \ Output using `std::cout`\n\nThe `std::cout` object is used to display output\
    \ to the console. We can use it to print messages, variable values, or any other\
    \ information.\n\nHere's an example that displays a greeting message:\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    std::cout << \"Welcome to C++ Programming!\"\
    \ << std::endl;\n    return 0;\n}\n```\n\nIn the above code, the message \"Welcome\
    \ to C++ Programming!\" is passed to `std::cout` using the insertion operator\
    \ (`<<`). The `std::endl` manipulator is used to insert a newline character and\
    \ flush the output stream.\n\n### Input using `std::cin`\n\nThe `std::cin` object\
    \ allows us to receive input from the user. We can use it to store user-entered\
    \ values into variables.\n\nHere's an example that prompts the user to enter their\
    \ age and stores it in the `age` variable:\n\n```cpp\n#include <iostream>\n\n\
    int main() {\n    int age;\n    std::cout << \"Enter your age: \";\n    std::cin\
    \ >> age;\n    std::cout << \"Your age is: \" << age << std::endl;\n    return\
    \ 0;\n}\n```\n\nIn the above code, the `std::cin` object is used with the extraction\
    \ operator (`>>`) to receive the user's input and store it in the `age` variable.\
    \ The entered age is then displayed using `std::cout`.\n\n## Basic Arithmetic\
    \ Operations\n\nC++ provides several arithmetic operators for performing basic\
    \ mathematical calculations. Let's explore some commonly used operators:\n\n-\
    \ Addition (`+`): Adds two values together.\n- Subtraction (`-`): Subtracts one\
    \ value from another.\n- Multiplication (`*`): Multiplies two values.\n- Division\
    \ (`/`): Divides one value by another.\n- Modulo (`%`): Returns the remainder\
