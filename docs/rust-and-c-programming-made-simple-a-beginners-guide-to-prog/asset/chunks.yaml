    if (amount >= 0) {

    balance = amount;

    }

    }

    };

    ```


    In this example, the `accountNumber` attribute is marked as `private`, preventing
    direct access to it from outside the class. The `getAccountNumber()` method is
    provided as a public getter to access the account number. Similarly, the `balance`
    attribute is marked as `private`, and the `setBalance()` method is provided as
    a public setter to control access and validation of the balance attribute.


    ### Member Functions


    Member functions are methods defined within a class. They encapsulate the behavior
    and operations associated with the class. Member functions can access and manipulate
    the attributes of an object.


    ### Static Members


    Static members are class members that are shared by all instances of a class.
    They are independent of specific objects and exist even if no objects of the class
    are created. Static members can be accessed using the class name, without the
    need for object instantiation.


    ```cpp

    class Circle {

    public:

    static constexpr double PI = 3.14159;

    static double calculateArea(double radius) {

    return PI * radius * radius;

    }

    };

    ```


    In this example, `PI` is a static member of the `Circle` class. It is shared by
    all objects of the class and can be accessed using the class name (`Circle::PI`).
    The `calculateArea()` method is also declared as static and can be called using
    the class name (`Circle::calculateArea()`).


    ### Friend Functions


    Friend functions are functions that are not members of a class but have access
    to its private and protected members. They can be declared as friends inside a
    class to grant them special access privileges.


    ```cpp

    class Rectangle {

    private:

    double length;

    double width;

    public:

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }

    friend double calculateDiagonal(const Rectangle& rect);

    };


    double calculateDiagonal(const Rectangle& rect) {

    return std::sqrt(rect.length * rect.length + rect.width * rect.width);

    }

    ```


    In this example, the `calculateDiagonal()` function is declared as a friend of
    the `Rectangle` class. It can access the private attributes of `Rectangle` objects,
    allowing it to calculate the diagonal length.


