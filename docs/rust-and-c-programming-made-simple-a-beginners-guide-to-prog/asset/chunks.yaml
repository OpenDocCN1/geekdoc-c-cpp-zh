    \n### 纯虚函数\n\n纯虚函数是一种在基类中没有实现的虚拟函数。它使用 `virtual` 关键字后跟 `= 0` 来声明。纯虚函数使基类成为抽象类，派生类必须重写它们。这是一个示例：\n\
