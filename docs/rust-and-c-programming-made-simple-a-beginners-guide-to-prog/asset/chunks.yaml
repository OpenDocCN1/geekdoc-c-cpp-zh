    developers to write efficient and scalable concurrent programs.


    # ## 7.2 Threads: Lightweight Units of Execution


    In Rust, concurrency is primarily achieved through the use of threads. A thread
    represents a lightweight unit of execution that can run concurrently with other
    threads within the same program.


    Let''s see an example that demonstrates how to create and work with threads in
    Rust:


    ```rust


    use std::thread;


    fn main() {


    let thread_handle = thread::spawn(|| {


    // Code to be executed in the new thread


    for i in 1..=5 {


    println!("Thread: {}", i);


    thread::sleep(std::time::Duration::from_millis(500));


    }


    });


    // Code to be executed in the main thread


    for i in 1..=5 {


    println!("Main thread: {}", i);


    thread::sleep(std::time::Duration::from_millis(500));


    }


    // Wait for the spawned thread to finish


    thread_handle.join().expect("Failed to join the thread.");


    }


    ```


    In this example, we use the `thread::spawn` function to create a new thread and
    pass it a closure containing the code to be executed in that thread. The closure
    contains a loop that prints numbers from 1 to 5 with a delay of 500 milliseconds
    between each iteration.


    In the main thread, we also have a similar loop that prints numbers from 1 to
    5\. Both the main thread and the spawned thread execute concurrently, printing
    their respective numbers.


    To ensure that the main thread waits for the spawned thread to finish before exiting,
    we use the `thread_handle.join()` method, which blocks the main thread until the
    spawned thread completes.


    # ## 7.3 Shared Memory Concurrency with Mutexes


    When multiple threads share access to the same data, it can lead to race conditions
    and data races, which can result in undefined behavior. Rust''s ownership and
    borrowing system help mitigate these issues, but sometimes we need to share mutable
    data between threads.


    Rust provides a synchronization primitive called a Mutex (short for mutual exclusion)
    to safely share mutable data between multiple threads. A Mutex ensures that only
    one thread can access the data at a time, preventing data races.


    Let''s see an example that demonstrates the usage of Mutex:


    ```rust


    use std::sync::Mutex;


    use std::thread;


    fn main() {


    let counter = Mutex::new(0);


    let mut handles = vec![];


    for _ in 0..5 {


    let handle = thread::spawn(move || {


    let mut num = counter.lock().unwrap();


    *num += 1;


    });


    handles.push(handle);


    }


    for handle in handles {


    handle.join().unwrap();


    }


    println!("Counter: {}", *counter.lock().unwrap());


    }


    ```


    In this example, we create a Mutex named `counter` that wraps an integer value
    initialized to 0\. We then spawn five threads, each of which acquires the lock
    on the `counter` Mutex, increments the counter by 1, and releases the lock.


    To access the data protected by the Mutex, we use the `lock` method, which returns
    a smart pointer called `MutexGuard`. The `MutexGuard` allows mutable access to
    the data and automatically releases the lock when it goes out of scope.


    After joining all the spawned threads, we print the final value of the counter
    by acquiring the lock on the `counter` Mutex again.


    # ## 7.4 Message Passing Concurrency with Channels


    In addition to shared memory concurrency with Mutexes, Rust provides another powerful
    concurrency mechanism called channels. Channels allow communication between threads
    by sending and receiving messages.


    Let''s see an example that demonstrates the usage of channels for message passing:


    ```rust


    use std::sync::mpsc;


    use std::thread;


    fn main() {


    let (sender, receiver) = mpsc::channel();


    let handle = thread::spawn(move || {


    let message = receiver.recv().unwrap();


    println!("Received message: {}", message);


    });


    let message = "Hello, concurrency!";


    sender.send(message.to_owned()).unwrap();


    handle.join().unwrap();


    }


    ```


    In this example, we create a channel using the `mpsc::channel` function, which
    returns two endpoints: a sender and a receiver. The sender can be used to send
    messages, while the receiver can be used to receive messages.'
