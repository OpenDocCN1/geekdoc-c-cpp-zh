    \ color = \"red\";\nmatch color {\n    \"red\" => println!(\"是红色的.\"),\n    \"\
    green\" => println!(\"是绿色的.\"),\n    \"blue\" => println!(\"是蓝色的.\"),\n    _ =>\
    \ println!(\"颜色未知.\"),\n}\n```\n\n在这个示例中，我们将 `color` 的值与不同的模式进行匹配并执行相应的代码块。\n\n\
    ## 3.2 循环：重复执行\n\n循环允许我们重复代码块直到满足特定条件。Rust 提供了多种循环构造，包括 `loop`、`while` 和 `for`。让我们探索每一个。\n\
    \n### 3.2.1 `loop` 循环\n\nRust 中的 `loop` 循环允许我们无限地重复代码块，直到显式跳出。这是 `loop` 循环的基本语法：\n\
    \n```rust\nloop {\n    // 无限重复的代码\n    // 用于退出循环的跳转条件\n}\n```\n\n让我们来看一个例子：\n\n\
    ```rust\nlet mut count = 0;\nloop {\n    println!(\"计数: {}\", count);\n    count\
    \ += 1;\n    if count == 5 {\n        break;\n    }\n}\n```\n\n在这个示例中，我们声明了一个可变变量\
