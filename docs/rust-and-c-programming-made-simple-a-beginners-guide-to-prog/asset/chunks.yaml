    \        }\n    });\n\n    // 在主线程中执行的代码\n    for i in 1..=5 {\n        println!(\"\
    Main thread: {}\", i);\n        thread::sleep(std::time::Duration::from_millis(500));\n\
    \    }\n\n    // 等待创建的线程完成\n    thread_handle.join().expect(\"Failed to join the\
