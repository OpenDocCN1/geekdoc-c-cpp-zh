    \ 提供了两种主要的浮点数类型：\n\n- `float`: 用于存储单精度浮点数，约有 6-7 位有效数字。\n- `double`: 用于存储双精度浮点数，约有\
    \ 15 位有效数字。\n\n示例：\n\n```cpp\nfloat pi = 3.14159f;\ndouble average = 85.5321;\n\
    ```\n\n### 字符类型\n\n字符类型用于存储单个字符。C++ 提供了两种字符类型：\n\n- `char`: 用于存储单个字符。\n- `wchar_t`:\
    \ 用于存储宽字符，它可以表示更广泛的字符范围，包括非 ASCII 字符集的字符。\n\n示例：\n\n```cpp\nchar grade = 'A';\n\
    wchar_t euroSymbol = L'€';\n```\n\n### 布尔类型\n\n布尔类型用于表示逻辑值。它可以有两个可能的值：`true` 或\
    \ `false`。\n\n示例：\n\n```cpp\nbool isValid = true;\nbool isReady = false;\n```\n\
    \n## 结论\n\n在本章中，我们探索了 C++ 中的变量和数据类型。我们学习了变量的声明和初始化，以及命名规范和变量作用域。理解如何操作变量以及选择合适的数据类型是编写高效\
    \ C++ 程序的基础基础。\n\n我们还探索了一些常用的数据类型，包括整数、浮点数、字符和布尔值。每种数据类型都有其特定的用途和使用场景，使我们能够有效地处理不同类型的数据。\n\
    \n在你继续 C++ 编程之旅时，请记住选择合适的变量名和为数据选择正确数据类型的重要性。这些实践将有助于代码的清晰度、可读性和维护性。\n\n# 第 4\
    \ 章：运算符与表达式\n\n在第 3 章中，我们探索了 C++ 中的变量和数据类型。在本章中，我们将深入研究运算符和表达式。运算符允许我们对变量和值执行各种操作，而表达式将变量、值和运算符结合起来形成有意义的计算。\n\
    \n## 算术运算符\n\n算术运算符用于执行基础数学计算。C++ 提供了以下算术运算符：\n\n- 加 (`+`): 将两个值相加。\n- 减 (`-`):\
    \ 从一个值减去另一个。\n- 乘 (`*`): 将两个值相乘。\n- 除 (`/`): 将一个值除以另一个值。\n- 取模 (`%`): 返回除法运算的余数。\n\
    \n让我们通过示例来探索这些运算符：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int a =\
    \ 10;\n    int b = 3;\n    int sum = a + b;             // 加\n    int difference\
    \ = a - b;      // 减\n    int product = a * b;         // 乘\n    int quotient\
    \ = a / b;         // 除\n    int remainder = a % b;       // 取模\n    std::cout\
    \ << \"Sum: \" << sum << std::endl;\n    std::cout << \"Difference: \" << difference\
    \ << std::endl;\n    std::cout << \"Product: \" << product << std::endl;\n   \
    \ std::cout << \"Quotient: \" << quotient << std::endl;\n    std::cout << \"Remainder:\
    \ \" << remainder << std::endl;\n    return 0;\n}\n```\n\n在上面的代码中，变量 `a` 和 `b`\
    \ 分别持有值 10 和 3。算术运算符用于执行加、减、乘、除和取模运算。然后使用 `std::cout` 显示结果。\n\n## 关系运算符\n\n关系运算符用于比较两个值并确定它们之间的关系。C++\
    \ 提供了以下关系运算符：\n\n- 等于 (`==`): 检查两个值是否相等。\n- 不等于 (`!=`): 检查两个值是否不等。\n- 大于 (`>`):\
    \ 检查一个值是否大于另一个值。\n- 小于 (`<`): 检查一个值是否小于另一个值。\n- 大于等于 (`>=`): 检查一个值是否大于等于另一个值。\n\
    - 小于等于 (`<=`): 检查一个值是否小于等于另一个值。\n\n这是一个演示关系运算符使用的示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int a = 5;\n    int b = 10;\n    bool isEqual = (a == b);\n\
    \    bool isNotEqual = (a != b);\n    bool isGreater = (a > b);\n    bool isLess\
    \ = (a < b);\n    bool isGreaterOrEqual = (a >= b);\n    bool isLessOrEqual =\
    \ (a <= b);\n    return 0;\n}\n```\n*（等待，提供的关系运算符示例文本有些混乱，我已经根据原文意图清理了逻辑）*\n\n\
    ## 逻辑运算符\n\n逻辑运算符用于组合多个条件。C++ 提供了以下逻辑运算符：\n\n- 逻辑与 (`&&`): 如果两个条件都为真，则返回 `true`。\n\
    - 逻辑或 (`||`): 如果至少有一个条件为真，则返回 `true`。\n- 逻辑非 (`!`): 反转条件的结果。\n\n来看一个演示逻辑运算符使用的示例：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int age = 25;\n    bool hasLicense\
    \ = true;\n    bool isEligible = (age >= 18) && hasLicense;\n    bool canDrive\
    \ = (age >= 16) || hasLicense;\n    bool cannotDrive = !hasLicense;\n    return\
    \ 0;\n}\n```\n\n## 赋值运算符\n\n赋值运算符用于给变量赋值。C++ 提供了各种赋值运算符，包括基础赋值运算符 (`=`）和复合赋值运算符（`+=`,\
    \ `-=`, `*=`, `/=` 和 `%=`）。\n\n这是一个演示赋值运算符使用的示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int a = 5;\n    a += 3; // 等于 a = a + 3\n    a -= 2; // 等于\
    \ a = a - 2\n    a *= 4; // 等于 a = a * 4\n    a /= 2; // 等于 a = a / 2\n    a %=\
    \ 3; // 等于 a = a % 3\n    std::cout << \"Updated value of 'a': \" << a << std::endl;\n\
    \    return 0;\n}\n```\n\n## 运算符的优先级和结合性\n\nC++ 中的运算符具有不同的优先级和结合性，这决定了当表达式中存在多个运算符时的求值顺序。理解运算符优先级对于编写产生预期结果的表达式至关重要。\n\
    \n"
- fmt: "\nHere's a table showing the precedence and associativity of some common operators\
    \ in C++, from highest to lowest precedence:\n\n| Operators | Description | Associativity\
    \ |\n| :--- | :--- | :--- |\n| `()` | Parentheses | Left to right |\n| `++`, `--`\
    \ | Postfix increment, decrement | Left to right |\n| `++`, `--` | Prefix increment,\
    \ decrement | Right to left |\n| `+`, `-` | Unary plus, minus | Right to left\
    \ |\n| `!`, `~` | Logical and bitwise negation | Right to left |\n| `*`, `/`,\
    \ `%` | Multiplication, division, modulo | Left to right |\n| `+`, `-` | Addition,\
    \ subtraction | Left to right |\n| `<<`, `>>` | Bitwise left shift, right shift\
    \ | Left to right |\n| `<`, `<=`, `>=`, `>=` | Relational operators | Left to\
    \ right |\n| `==`, `!=` | Equality operators | Left to right |\n| `&` | Bitwise\
    \ AND | Left to right |\n| `^` | Bitwise XOR | Left to right |\n| `\\|` | Bitwise\
    \ OR | Left to right |\n| `&&` | Logical AND | Left to right |\n| `\\|` | Logical\
    \ OR | Left to right |\n| `=` | Assignment | Right to left |\n| `+=`, `-=`, `*=`,\
    \ `/=`, `%=` | Compound assignment | Right to left |\n\nTo override the default\
    \ precedence and ensure a specific order of evaluation, parentheses can be used\
    \ to group expressions.\n\n## Conclusion\n\nIn this chapter, we operators and\
    \ expressions in C++. We learned about arithmetic operators for performing mathematical\
    \ calculations, relational operators for comparing values, logical operators for\
    \ combining conditions, and assignment operators for assigning values to variables.\n\
    \nUnderstanding operators and expressions is crucial for writing effective and\
    \ meaningful code in C++. By utilizing the appropriate operators and understanding\
    \ their precedence and associativity, we can perform complex computations and\
    \ make decisions within our programs.\n\nAs you continue your journey in C++ programming,\
    \ keep in mind the different types of operators available to you and their respective\
    \ uses. The mastery of operators and expressions will greatly enhance your ability\
    \ to solve problems and create robust applications.\n\n# Chapter 5: Control Flow\
    \ and Decision Making\n\nIn Chapter 4, we explored operators and expressions in\
    \ C++. In this chapter, we will delve into control flow and decision-making structures.\
    \ Control flow allows us to determine the order in which statements are executed,\
    \ while decision-making structures enable us to make choices and execute different\
    \ blocks of code based on certain conditions.\n\n## Conditional Statements: If-Else\n\
    \nConditional statements in C++ allow us to execute specific blocks of code based\
    \ on certain conditions. The most commonly used conditional statement is the `if-else`\
    \ statement. Here's the basic syntax:\n\n```cpp\nif (condition) {\n    // Code\
    \ to be executed if the condition is true\n} else {\n    // Code to be executed\
    \ if the condition is false\n}\n```\n\nLet's see an example:\n\n```cpp\n#include\
    \ <iostream>\nint main() {\n    int age;\n    std::cout << \"Enter your age: \"\
    ;\n    std::cin >> age;\n    if (age >= 18) {\n        std::cout << \"You are\
    \ eligible to vote.\" << std::endl;\n    } else {\n        std::cout << \"You\
    \ are not eligible to vote.\" << std::endl;\n    }\n    return 0;\n}\n```\n\n\
    In the above code, the user's age is stored in the `age` variable. The `if-else`\
    \ statement checks if the age is greater than or equal to `18`. If the condition\
    \ is true, the message \"You are eligible to vote\" is displayed. Otherwise, the\
    \ message \"You are not eligible to vote\" is displayed.\n\nConditional statements\
    \ can also be nested, allowing for more complex decision-making. Here's an example:\n\
    \n```cpp\n#include <iostream>\nint main() {\n    int score;\n    std::cout <<\
    \ \"Enter your score: \";\n    std::cin >> score;\n    if (score >= 90) {\n  \
    \      std::cout << \"Excellent!\" << std::endl;\n    } else if (score >= 80)\
    \ {\n        std::cout << \"Good!\" << std::endl;\n    } else {\n        std::cout\
    \ << \"Keep practicing!\" << std::endl;\n    }\n    return 0;\n}\n```\n\n## Loops:\
    \ While and For\n\nLoops in C++ allow us to repeat a block of code multiple times.\
    \ There are two commonly used structures: `while` and `for`.\n\n### While Loop\n\
    \nThe `while` loop executes a block of code as long as a specified condition is\
    \ true. Here's the basic syntax:\n\n```cpp\nwhile (condition) {\n    // Code to\
    \ be executed\n}\n```\n\nLet's see an example:\n\n```cpp\n#include <iostream>\n\
    int main() {\n    int count = 0;\n    while (count < 5) {\n        std::cout <<\
    \ \"Count: \" << count << std::endl;\n        count++;\n    }\n    return 0;\n\
    }\n```\n\n### For Loop\n\nThe `for` loop is another type of loop that allows us\
    \ to iterate over a range or perform a specific number of iterations. Here's the\
    \ basic syntax:\n\n```cpp\nfor (initialization; condition; increment/decrement)\
    \ {\n    // Code to be executed\n}\n```\n\nLet's see an example:\n\n```cpp\n#include\
    \ <iostream>\nint main() {\n    for (int i = 0; i < 5; i++) {\n        std::cout\
    \ << \"Count: \" << i << std::endl;\n    }\n    return 0;\n}\n```\n\n## Control\
    \ Flow Statements: Break and Continue\n\nIn addition to conditional statements\
    \ and loops, control flow statements such as `break` and `continue` provide additional\
    \ control over the flow of execution within loops.\n\n### Break\n\nThe `break`\
    \ statement is used to terminate the current loop and continue with the next statement\
    \ outside the loop. It can be useful for prematurely exiting a loop under certain\
    \ conditions. Here's an example:\n\n```cpp\n#include <iostream>\nint main() {\n\
    \    for (int i = 0; i < 5; i++) {\n        if (i == 3) {\n            break;\n\
    \        }\n        std::cout << \"Count: \" << i << std::endl;\n    }\n    return\
    \ 0;\n}\n```\n\nIn this example, the `for` loop iterates over the values of `i`\
    \ from 0 to 4. However, when `i` becomes 3, the `break` statement is encountered,\
    \ terminating the loop. As a result, only the counts 0, 1, and 2 are displayed.\n\
    \n### Continue\n\nThe `continue` statement is used to skip the rest of the current\
