    \ `std::advance()`: 将迭代器移动指定数量的位置。\n- `std::next()`: 返回紧跟给定迭代器的迭代器。\n- `std::prev()`:\
    \ 返回在给定迭代器之前的迭代器。\n\n## 算法\n\nSTL 提供了许多在容器上操作的算法。这些算法执行各种操作，如搜索、排序、修改和处理元素。一些常用的算法包括：\n\
    \n- `std::sort()`: 对容器中的元素进行排序。\n- `std::find()`: 在容器中搜索某个值。\n- `std::count()`:\
    \ 统计某个值在容器中出现的次数。\n- `std::transform()`: 对容器中的每个元素应用函数。\n- `std::accumulate()`:\
    \ 计算容器中元素的和。\n\n## 函数对象\n\n函数对象（也称为仿函数）是行为像函数的对象。它们通常用作算法的参数，用于对元素定义自定义操作。函数对象可以定义为类，也可以使用\
    \ lambda 表达式。\n\n```cpp\nstruct Square {\n  int operator()(int x) const {\n  \
    \  return x * x;\n  }\n};\nstd::vector<int> numbers = {1, 2, 3, 4, 5};\n// 使用函数对象\n\
