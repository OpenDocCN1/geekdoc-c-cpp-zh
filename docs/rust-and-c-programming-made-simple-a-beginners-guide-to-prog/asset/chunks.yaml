    ## Pointers


    A pointer is a variable that stores the memory address of another variable. By
    using pointers, we can indirectly access and manipulate data stored in memory.
    Pointers provide flexibility and efficiency in memory management.


    ### Declaring and Initializing Pointers


    To declare a pointer in C++, we use the asterisk (*) symbol before the pointer
    variable name. Here''s an example:


    ```cpp


    int* ptr;    // Declaration of an integer pointer


    ```


    To initialize a pointer, we assign it the address of another variable using the
    address-of operator (&). Here''s an example:


    ```cpp


    int number = 10;    // Declaration and initialization of an integer variable


    int* ptr = &number;    // Initialization of the pointer with the address of ''number''


    ```


    In this example, the pointer `ptr` is initialized with the memory address of the
    `number` variable using the address-of operator (&).


