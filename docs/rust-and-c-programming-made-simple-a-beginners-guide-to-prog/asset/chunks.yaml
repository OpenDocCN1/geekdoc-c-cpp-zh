    \n# 结论\n\n模板和标准模板库 (STL) 是 C++ 的强大特性，促进了代码重用、泛型编程和高效算法。模板允许我们创建可以操作多种类型的泛型函数和类。STL\
    \ 提供了一系列容器、迭代器、算法和函数对象，使得编写高效且可重用的代码变得更容易。\n\n在本章中，我们探索了函数模板、类模板、模板特化以及 STL 的核心组件。我们还接触了\
    \ STL 提供的容器、迭代器、算法和函数对象。\n\n通过利用模板和 STL，我们可以在 C++ 中编写通用、高效且重用的代码。它们是现代 C++ 开发的重要工具。\n\
    \n# 第 15 章：C++ 编程高级主题\n\n在最后一章中，我们将探索 C++ 编程中的一些高级主题，这些主题可以进一步增强我们的技能，并允许我们编写更高效、复杂的代码。我们将深入研究智能指针、多线程、lambda\
    \ 表达式和移动语义等主题。\n\n## 智能指针\n\n智能指针是 C++ 的一项强大特性，提供了自动内存管理，减少了内存泄漏风险。它们行为像指针，但具有额外的功能，例如在不需要时自动释放内存。\n\
    \nC++ 提供了三种智能指针：\n\n- `unique_ptr`: 表示动态分配对象的独占所有。它确保只有一个 `unique_ptr` 可以拥有该对象，当所有者销毁时，对象会被自动删除。\n\
    - `shared_ptr`: 表示动态分配对象的共享所有。它允许多个 `shared_ptr` 对象指向同一个对象，只有当最后一个拥有对象的 `shared_ptr`\
    \ 销毁时，对象才会被删除。\n- `weak_ptr`: 表示由 `shared_ptr` 管理对象的非所有权引用。它允许访问对象而不影响其引用计数。\n\
    \n这里是一个使用 `unique_ptr` 的示例：\n\n```cpp\n#include <memory>\nclass MyClass {\npublic:\n\
    \  void someFunction() {\n    // 函数体\n  }\n};\nint main() {\n  std::unique_ptr<MyClass>\
    \ ptr(new MyClass());\n  ptr->someFunction();\n  return 0;\n}\n```\n\n在这个示例中，我们创建了一个名为\
    \ `ptr` 的 `unique_ptr`，指向一个动态分配的 `MyClass` 对象。我们使用箭头 (`->`) 操作访问对象的成员函数。\n\n##\
    \ 多线程\n\n多线程是程序并发执行多个线程的能力。它允许任务并行运行并在某些场景下极大提高性能和响应速度。C++ 提供了一个支持线程并发执行的多线程库。\n\
    \n这里是使用 C++ 线程的示例：\n\n```cpp\n#include <iostream>\n#include <thread>\nvoid threadFunction()\
    \ {\n  // 函数体\n  std::cout << \"Hello from thread!\" << std::endl;\n}\nint main()\
    \ {\n  std::thread t(threadFunction);\n  // 主线程继续执行\n  t.join(); // 等待线程完成\n \
    \ return 0;\n}\n```\n\n在这个示例中，我们定义了一个函数 `threadFunction()`，代表要在单独线程中执行的代码。我们创建了一个\
    \ `std::thread` 对象 `t` 来执行 `threadFunction()`。在新的线程并发运行时，主线程继续其执行。我们使用 `t.join()`\
    \ 在退出程序前等待该线程完成。\n\n"
- fmt: "\nLambda expressions are a concise way to define anonymous functions in C++.\
    \ They allow us to create functions on the fly without explicitly defining a named\
    \ function. Lambda expressions are particularly useful when working with algorithms\
    \ or in situations where a function needs to be passed as an argument.\n\nHere's\
    \ an example that demonstrates the usage of lambda expressions:\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n#include <algorithm>\n\nint main() {\n    std::vector<int>\
    \ numbers = {1, 2, 3, 4, 5};\n    int count = std::count_if(numbers.begin(), numbers.end(),\
    \ [](int x) {\n        return x % 2 == 0;\n    });\n    std::cout << \"Count:\
    \ \" << count << std::endl;\n    return 0;\n}\n```\n\nIn this example, we use\
    \ a lambda expression as the third argument to the `std::count_if()` algorithm.\
    \ The lambda expression checks if a number is even (`x % 2 == 0`) and returns\
    \ `true` or `false` accordingly. The `std::count_if()` algorithm counts the number\
    \ of elements that satisfy the condition.\n\n## Move Semantics\n\nMove semantics\
    \ is a feature introduced in C++11 that allows for the efficient transfer of resources\
    \ (such as memory) from one object to another without unnecessary copying. Move\
    \ semantics are particularly useful when working with large objects or when performance\
    \ optimization is crucial.\n\nMove semantics are enabled by the use of move constructors\
    \ and move assignment operators. A move constructor is a special constructor that\
    \ takes an rvalue reference (`T&&`) and efficiently transfers the resources from\
    \ the source object to the new object. A move assignment operator is a special\
    \ assignment operator that performs a similar resource transfer.\n\nHere's an\
    \ example that demonstrates move semantics:\n\n```cpp\nclass MyObject {\npublic:\n\
    \    // Move constructor\n    MyObject(MyObject&& other) {\n        // Transfer\
    \ resources from 'other' to 'this'\n        // ...\n    }\n    // Move assignment\
    \ operator\n    MyObject& operator=(MyObject&& other) {\n        if (this != &other)\
    \ {\n            // Transfer resources from 'other' to 'this'\n            //\
    \ ...\n        }\n        return *this;\n    }\n};\n\nint main() {\n    MyObject\
    \ obj1;\n    // Perform move operation\n    MyObject obj2 = std::move(obj1);\n\
    \    return 0;\n}\n```\n\nIn this example, we define a move constructor and a\
    \ move assignment operator for the `MyObject` class. We use the `std::move()`\
