    # 第 10 章：类与对象


    在第 9 章中，我们深入探讨了 C++ 中的面向对象编程（OOP）概念。在本章中，我们将更详细地探索类和对象。类是 OOP 的基本构建模块，而对象是类的实例。理解类和对象对于创建健壮且组织良好的至关重要。


    ## 类


    类是一个蓝图或模板，定义了对象的属性（数据）和行为（方法）。它将数据和相关功能封装在一个单元中。类代表了抽象概念。


    ### 类的声明与定义


    在 C++ 中，声明一个类使用 `class` 关键字后跟类名。


    ```cpp

    class Rectangle {


    public:

    double length;

    double width;

    // Constructor

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }

    };

    ```


    在这个示例中，我们为 `Rectangle` 类定义了一个构造函数，它接受两个参数 `len` 和 `wid`，用于初始化 `length` 和 `width`
    属性。


    析构函数用于在对象销毁之前清理资源并执行任何必要的最终处理。它的名称与类相同，前面加一个波浪号 (`~`)，且声明时不带参数。这是一个示例：


    ```cpp

    class Rectangle {


    public:

    double length;

    double width;

    // Constructor

    Rectangle(double len, double wid) {

    length = len;

    width = wid;

    }

    // Destructor

    ~Rectangle() {

    // Cleanup code here

    }

    };

    ```


    在这个示例中，我们为 `Rectangle` 类添加了一个析构函数。析构函数可以用于释放任何动态分配的内存或执行任何其他清理任务。


    ### 封装与数据隐藏


    OOP 的核心原则之一是封装，它将数据和相关功能封装在一个单元（类）中。封装允许数据被隐藏或防止从类外部直接访问和操作。对数据的访问通过方法（例如 getter
    和 setter）来控制。


    这是一个演示封装和数据隐藏的示例：


    ```cpp

    class BankAccount {


    private:

    std::string accountNumber;

    double balance;

    public:

    // Getter for accountNumber

    std::string getAccountNumber() {

    return accountNumber;

    }

    // Setter for balance

    void setBalance(double amount) {

    if (amount >= 0) {

    balance = amount;

    }

    }

    };

    ```


    在这个示例中，`accountNumber` 属性被标记为 `private`，防止从类外部直接访问它。提供了 `getAccountNumber()` 方法作为公共
    getter 来访问账号。同样，`balance` 属性被标记为 `private`，并提供了 `setBalance()` 方法作为公共 setter 来控制对
    `balance` 属性的访问和验证。


    ### 继承


    继承是一种允许类继承另一个类的属性和行为的机制。被继承的类被称为基类或父类，而继承它的类被称为派生类或子类。继承促进了代码复用，并允许创建类体系。


    这是一个继承的示例：


    ```cpp

    class Shape {


    public:

    virtual double calculateArea() = 0;

    };

    class Rectangle : public Shape {


    public:

    double length;

    double width;

    double calculateArea() override {

    return length * width;

    }

    };

    ```


    在这个示例中，我们有一个名为 `Shape` 的基类，它定义了一个纯虚方法 `calculateArea()`。`Rectangle` 类使用 `public`
    访问限定符派自 `Shape` 类。它重写了 `calculateArea()` 方法，为计算矩形面积提供了特定的实现。


    ### 多态


    多态是允许不同类的对象被视为共同基类对象的能力。多态允许使用单一接口来表示多个类。它使得编写可以处理不同类型对象代码，而不需要知道它们的具体类型。


    这是一个演示多态的示例：


    ```cpp

    class Shape {


    public:

    virtual double calculateArea() = 0;

    };

    class Rectangle : public Shape {


    public:

    double length;

    double width;

    double calculateArea() override {

    return length * width;

    }

    };

    class Circle : public Shape {


    public:

    double radius;

    double calculateArea() override {

    return 3.14 * radius * radius;

    }

    };

    void printArea(Shape* shape) {

    std::cout << "Area: " << shape->calculateArea() << std::endl;

    }

    int main() {

    Rectangle rect;

    rect.length = 5.0;

    rect.width = 3.0;

    Circle circle;

    circle.radius = 4.0;

    printArea(&rect);

    printArea(&circle);

    return 0;

    }

    ```


    在这个示例中，我们有一个带有纯虚方法 `calculateArea()` 的基类 `Shape`。`Rectangle` 和 `Circle` 类派自 `Shape`
    类，并提供了它们各自的 `calculateArea()` 方法实现。`printArea()` 函数接收一个 `Shape` 对象的指针并调用其 `calculateArea()`
    方法，演示了多态行为。


