    \ 用于存储更长的整数，范围约为 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。\n\n示例：\n\
    \n```cpp\nint score = 100;\nshort numStudents = 25;\nlong population = 789456123;\n\
