    # Chapter 6: Exploring the Standard Library: Powerful Tools at Your Fingertips


    In Chapter 5, we discussed error handling in Rust and learned how to handle and
    manage both recoverable and unrecoverable errors. Now, let''s dive into Rust''s
    standard library, a treasure trove of pre-defined types, data structures, and
    utilities that can significantly simplify and enhance our programming experience.
    In this chapter, we will explore some of the key components of the standard library
    and learn how to leverage them to build more efficient and feature-rich Rust programs.


    # ## 6.1 The Standard Library: An Overview


    Rust''s standard library, also known as `std`, is the foundation of Rust programming.
    It provides a vast collection of modules, each offering various functionalities
    and abstractions. These modules cover a wide range of areas, including collections,
    I/O operations, concurrency, networking, and more.


    To use the standard library, we need to include the appropriate module by adding
    the following line at the beginning of our code:


    ```rust


    use std::*;


    ```


    By using the wildcard `*`, we import all the modules from the standard library,
    making their functionalities accessible in our code.


    # ## 6.2 Collections: Vec, String, HashMap, and More


    The standard library provides a set of powerful collection types that are widely
    used in Rust programs. Let''s take a look at a few of these collections and their
    functionalities.


    # ### 6.2.1 Vec: Dynamic Array


    The `Vec<T>` type, short for vector, is a dynamic array that can grow or shrink
    based on the number of elements it contains. It provides various methods to manipulate
    and access the elements of the array.


    Here''s an example that demonstrates the usage of `Vec`:


    ```rust


    let mut numbers: Vec<i32> = Vec::new();


    numbers.push(10);


    numbers.push(20);


    numbers.push(30);


    println!("{:?}", numbers);


    ```


    In this example, we create a new empty `Vec` named `numbers`. We then use the
    `push` method to add three integers to the vector. Finally, we print the contents
    of the vector using the `println!` macro.


    # ### 6.2.2 String: Dynamic String


    The `String` type is a dynamically growable string in Rust. It provides various
    methods to manipulate and process strings efficiently.


    Here''s an example that demonstrates the usage of `String`:


    ```rust


    let mut message: String = String::new();


    message.push_str("Hello, ");


    message.push_str("world!");


    println!("{}", message);


    ```


    In this example, we create an empty `String` named `message`. We then use the
    `push_str` method to append two string literals to the `message` string. Finally,
    we print the contents of the `message` string using the `println!` macro.


    # ### 6.2.3 HashMap: Key-Value Store


    The `HashMap<K, V>` type is an associative array that stores a collection of key-value
    pairs. It provides efficient lookup, insertion, and deletion of elements based
    on their keys.


    Here''s an example that demonstrates the usage of `HashMap`:


    ```rust


    use std::collections::HashMap;


    let mut scores: HashMap<String, i32> = HashMap::new();


    scores.insert(String::from("Alice"), 90);


    scores.insert(String::from("Bob"), 80);


    scores.insert(String::from("Charlie"), 95);


    println!("{:?}", scores);


    ```'
