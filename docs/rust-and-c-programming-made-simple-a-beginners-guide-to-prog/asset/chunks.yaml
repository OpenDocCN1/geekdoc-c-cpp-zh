    \ \"Exception caught: \" << ex.what() << std::endl;\n    }\n    return 0;\n}\n\
    ```\n\nIn this example, we define a custom exception class `MyException` derived\
    \ from `std::exception`. We override the `what()` method to provide a custom error\
    \ message. The `process()` function throws an instance of `MyException`. In the\
    \ `main()` function, we catch any exceptions of type `std::exception` or its derived\
    \ classes and handle them accordingly.\n\n## Exception Handling Best Practices\n\
    \nHere are some best practices to keep in mind when working with exception handling\
    \ in C++:\n\n- **Catch specific exceptions**: Catch specific types of exceptions\
    \ to handle them appropriately. This allows for targeted error handling and better\
    \ control over the program flow.\n- **Catch exceptions by reference**: Catch exceptions\
    \ by reference (`const std::exception&`) to ensure proper object destruction and\
    \ avoid object slicing.\n- **Handle exceptions at an appropriate level**: Handle\
    \ exceptions at a level where the program can effectively recover from errors\
    \ or take necessary actions. Avoid catching exceptions too early or too late in\
