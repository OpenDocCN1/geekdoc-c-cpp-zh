    ## 循环：While 和 For\n\nC++ 中的循环允许我们多次执行某块块。有两种常用的结构：`while` 和 `for`。\n\n### While\
    \ 循环\n\n`while` 循环在指定的条件为真时会一直执行代码块。其基本语法如下：\n\n```cpp\nwhile (condition) {\n\
