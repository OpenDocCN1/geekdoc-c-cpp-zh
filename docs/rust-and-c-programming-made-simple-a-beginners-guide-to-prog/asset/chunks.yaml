    error handling in each calling function. Let''s see an example:


    ```rust


    use std::fs::File;


    use std::io::Read;


    fn read_file_contents(file_path: &str) -> Result<String, std::io::Error> {


    let mut file = File::open(file_path)?;


    let mut contents = String::new();


    file.read_to_string(&mut contents)?;


    Ok(contents)


    }


    fn main() {


    let result = read_file_contents("example.txt");


    match result {


    Ok(contents) => println!("File contents: {}", contents),


    Err(error) => panic!(error),


    }


    }


    ```


    In this example, we define a function named `read_file_contents` that takes a
    file path as a parameter and returns a `Result<String, std::io::Error>`. Inside
    the function, we use the `?` operator to propagate any errors that occur during
    file opening or reading. In the `main` function, we call `read_file_contents("example.txt")`
    and handle the `Result` using a `match` statement.


    # ## 5.4 Recovering from Errors with `Result` Methods


    The `Result` type provides several useful methods for working with errors. These
    methods allow us to perform different operations based on whether the result is
    `Ok` or `Err`. Some common methods include `map`, `and_then`, and `unwrap_or`.


    Let''s see an example that demonstrates the use of `Result` methods:


    ```rust


    fn divide(x: i32, y: i32) -> Result<i32, String> {


    if y == 0 {


    Err(String::from("Cannot divide by zero."))


    } else {


    Ok(x / y)


    }


    }


    fn main() {


    let result = divide(10, 2);


    let squared = result.map(|value| value * value);


    let final_result = squared.and_then(|value| {


    if value < 50 {


    Ok(value)


    } else {


    Err(String::from("Result is too large."))


    }


    });


    println!("Final result: {:?}", final_result.unwrap_or(0));


    }


    ```


    In this example, we define a function named `divide` that returns a `Result<i32,
    String>`. In the `main` function, we call `divide(10, 2)` and use the `map` method
    to square the result. Then, we use the `and_then` method to check if the squared
    value is less than 50\. If it is, we return `Ok`; otherwise, we return `Err`.
    Finally, we use the `unwrap_or` method to handle the result, printing the final
    result or a default value of 0 if an error occurred.


    ## Conclusion


    In this chapter, we explored error handling in Rust, an essential aspect of writing
    reliable and robust programs. We learned about the `Result` type and the `panic!`
    macro for handling recoverable and unrecoverable errors. We also discovered how
    to propagate errors using the `?` operator and work with errors using `Result`
    methods.


