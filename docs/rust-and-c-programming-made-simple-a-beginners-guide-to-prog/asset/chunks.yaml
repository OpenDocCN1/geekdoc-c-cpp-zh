    # Chapter 4: Functions: Modular and Reusable Code


    In Chapter 3, we explored control flow statements in Rust. Now, let''s take our
    programming skills to the next level by understanding functions. Functions allow
    us to organize our code into reusable and modular blocks, making our programs
    more maintainable and efficient. In this chapter, we will delve into the world
    of functions in Rust and learn how to define, call, and work with them effectively.


    # ## 4.1 Defining Functions


    In Rust, functions are defined using the `fn` keyword followed by the function
    name, parentheses for the parameters, and a return type. Here''s the basic syntax
    of a function definition:


    ```rust


    fn function_name(parameter1: Type1, parameter2: Type2) -> ReturnType {


    // Code to execute


    // Optional return statement


    }


    ```


    Let''s look at an example:


    ```rust


    fn greet(name: &str) {


    println!("Hello, {}!", name);


    }


    ```


    In this example, we define a function named `greet` that takes a parameter `name`
    of type `&str` (a string slice). The function body consists of a single statement
    that prints a greeting message to the console.


    # ## 4.2 Calling Functions


    Once we''ve defined a function, we can call it from other parts of our program.
    To call a function, we use the function name followed by parentheses, passing
    in the necessary arguments. Here''s an example of calling the `greet` function
    we defined earlier:


    ```rust


    greet("Alice");


    ```


    In this example, we call the `greet` function and pass the argument `"Alice"`.
    The function executes its code and prints the greeting message.


    # ## 4.3 Function Parameters and Return Types


    Functions in Rust can have parameters and return values. Parameters allow us to
    pass values into a function, while return types specify the type of value the
    function will return (if any). Let''s look at an example:


    ```rust


    fn add_numbers(a: i32, b: i32) -> i32 {


    let sum = a + b;


    sum // Implicit return statement


    }


    ```


    In this example, we define a function named `add_numbers` that takes two parameters
    `a` and `b`, both of type `i32` (32-bit signed integers). The function body calculates
    the sum of `a` and `b` and assigns it to the `sum` variable. Finally, the function
    implicitly returns the value of `sum` as the result.


    # ## 4.4 Function Overloading and Default Parameters


    Rust does not support function overloading in the traditional sense, where multiple
    functions have the same name but different parameter lists. However, we can achieve
    similar functionality using Rust''s feature called "traits" and "generic functions."
    It allows us to define functions that can operate on different types, providing
    flexibility and code reuse.


    Rust also does not have built-in support for default function parameters. However,
    we can emulate this behavior by using function overloading with traits and generic
    functions. By defining multiple functions with different parameter lists, we can
    create variations of the same function with default values for certain parameters.


    # ## 4.5 Function Visibility


    By default, functions in Rust are private and can only be accessed from within
    the same module. If we want to make a function accessible from outside the module,
    we can use the `pub` keyword to declare it as public.


    ```rust


    pub fn public_function() {


    // Code to execute


    }


    ```


    In this example, we define a function named `public_function` and declare it as
    public using the `pub` keyword. This allows other modules to access and call this
    function.


    # ## 4.6 Function Documentation


    Documentation is crucial for writing clear and understandable code. In Rust, we
    can add documentation comments to our functions using the `///` syntax. Let''s
    see an example:


    ```rust


    /// Greets the specified person.


    ///


    /// # Arguments


    ///


    /// * `name` - The name of the person.


    ///


    /// # Examples


    ///


    /// ```


    /// greet("Alice");


    /// ```


    fn greet(name: &str) {


    println!("Hello, {}!", name);


    }


    ```


    In this example, we add documentation comments to the `greet` function, describing
    its purpose, arguments, and providing examples. Documentation comments help other
    developers understand how to use our functions correctly.


    ## Conclusion


    In this chapter, we explored functions in Rust, a powerful tool for organizing
    code into reusable and modular blocks. We learned how to define functions, pass
    parameters, and return values. We also discussed function overloading, default
    parameters, visibility, and documentation.


    In the next chapter, we will explore error handling in Rust, a crucial aspect
    of writing robust and reliable programs. Get ready to dive into the world of Rust''s
    error handling mechanisms!


    # Chapter 5: Error Handling: Dealing with Exceptions


    In Chapter 4, we explored functions in Rust, which allow us to organize our code
    into reusable and modular blocks. Now, it''s time to tackle a crucial aspect of
    writing reliable programs: error handling. Errors are inevitable in software development,
    and Rust provides robust mechanisms for handling and managing them. In this chapter,
    we will delve into the world of error handling in Rust and learn how to handle,
    propagate, and recover from errors effectively.


    # ## 5.1 Understanding Errors in Rust


    In Rust, errors can occur due to various reasons, such as invalid inputs, file
    I/O failures, network issues, or unexpected conditions. Errors can be classified
    into two main categories: recoverable and unrecoverable errors.


    # ### 5.1.1 Recoverable Errors


    Recoverable errors, also known as "expected errors," are errors that a program
    can reasonably recover from. For example, if a file is not found, a program can
    display an error message and prompt the user to provide a valid file path. In
    Rust, recoverable errors are represented using the `Result<T, E>` type, where
    `T` is the type of the expected value, and `E` is the type of the error.


