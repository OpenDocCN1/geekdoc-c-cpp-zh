    \    }\n    return 0;\n}\n```\n\nIn this example, the `divide()` function divides\
    \ two numbers. If the divisor (`b`) is zero, a `std::runtime_error` exception\
    \ is thrown. In the `main()` function, we use a `try` block to catch any exceptions\
    \ of type `std::exception` or its derived classes. The caught exception is then\
    \ handled in the `catch` block, where we print the error message using the `what()`\
    \ method.\n\n## Creating Custom Exceptions\n\nApart from using standard exceptions,\
