    \ function is declared in the base class with the `virtual` keyword and can be\
    \ overridden in derived classes. Here's an example:\n\n```cpp\nclass Shape {\n\
    public:\n    virtual int calculateArea() {\n        return 0;\n    }\n};\n\nclass\
    \ Rectangle : public Shape {\npublic:\n    int calculateArea() override {\n  \
    \      return width * height;\n    }\n};\n\nclass Circle : public Shape {\npublic:\n\
    \    int calculateArea() override {\n        return 3.14 * radius * radius;\n\
    \    }\n};\n```\n\nIn this example, the `Shape` class declares a virtual `calculateArea()`\
    \ method. The derived classes `Rectangle` and `Circle` override this method to\
    \ provide their specific implementations. When the method is called through a\
    \ pointer or reference of the base class, the appropriate derived class implementation\
    \ is invoked.\n\n### Pure Virtual Functions\n\nA pure virtual function is a virtual\
    \ function that has no implementation in the base class. It is declared using\
    \ the `virtual` keyword followed by `= 0`. Pure virtual functions make the base\
    \ class abstract, and derived classes must override them. Here's an example:\n\
    \n```cpp\nclass Shape {\npublic:\n    virtual int calculateArea() = 0;\n};\n```\n\
    \nIn this example, the `Shape` class declares a pure `calculateArea()` method.\
    \ Since it has no implementation, we cannot create objects of the `Shape` class.\
    \ However, we can create objects of derived classes and use their specific implementations\
