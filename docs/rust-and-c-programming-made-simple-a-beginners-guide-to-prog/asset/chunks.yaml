    # ### 3.2.2 The `while` Loop


    The `while` loop in Rust allows us to repeat a block of code as long as a certain
    condition is true. Here''s the basic syntax of a `while` loop:


    ```rust


    while condition {


    // Code to repeat as long as the condition is true


    }


    ```


    Let''s see an example:


    ```rust


    let mut countdown = 10;


    while countdown > 0 {


    println!("Countdown: {}", countdown);


    countdown -= 1;


    }


    ```


    In this example, we declare a mutable variable named `countdown` and initialize
    it to 10\. The `while` loop prints the value of `countdown` and decrements it
    by 1 until it becomes 0.


    # ### 3.2.3 The `for` Loop


    The `for` loop in Rust allows us to iterate over a collection or a range of values.
    It simplifies the process of iterating and performing operations on each element.
    Here''s the basic syntax of a `for` loop:


    ```rust


    for element in collection {


    // Code to execute for each element


    }


    ```


    Let''s look at an example:


    ```rust


    let numbers = [1, 2, 3, 4, 5];


    for number in numbers.iter() {


    println!("Number: {}", number);


    }


    ```


    In this example, we have an array named `numbers` containing integers. The `for`
    loop iterates over each element in the array and prints its value.


