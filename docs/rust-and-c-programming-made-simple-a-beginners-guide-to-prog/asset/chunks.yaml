    # Chapter 8: Networking: Building Networked Applications


    In Chapter 7, we explored Rust''s concurrency features and learned how to write
    concurrent programs using threads, mutexes, and channels. Now, let''s dive into
    the world of networking in Rust. Rust provides robust networking capabilities,
    making it possible to build networked applications that communicate over various
    protocols. In this chapter, we will explore Rust''s networking APIs and learn
    how to develop networked applications.


    # ## 8.1 Understanding Networking Basics


    Before we dive into Rust''s networking APIs, let''s review some networking basics.
    Networking involves the communication between different devices over a network.
    This communication typically occurs through protocols such as TCP (Transmission
    Control Protocol) and UDP (User Datagram Protocol).


    TCP provides reliable, ordered, and error-checked delivery of data packets. It
    establishes a connection between two devices and ensures that data is delivered
    in the correct order without any loss or corruption.


    UDP, on the other hand, is a connectionless protocol that offers fast and lightweight
    transmission of data packets. It does not provide guarantees regarding order or
    reliability but is often used in scenarios where low latency is crucial, such
    as real-time streaming or gaming.


    Rust''s networking APIs allow us to work with both TCP and UDP, enabling us to
    build a wide range of networked applications.


    # ## 8.2 TCP Networking: Establishing Connections


    TCP networking in Rust involves establishing connections between client and server
    applications. The client initiates a connection request, and the server accepts
    the connection, allowing bidirectional communication.


    Let''s see an example that demonstrates a simple TCP client-server interaction
    in Rust:


    ```rust


    use std::io::{Read, Write};


    use std::net::{TcpListener, TcpStream};


    fn main() {


    // Server


    let listener = TcpListener::bind("127.0.0.1:8080").expect("Failed to bind");


    for stream in listener.incoming() {


    match stream {


    Ok(mut stream) => {


    let mut buffer = [0; 1024];


    stream.read(&mut buffer).expect("Failed to read from stream");


    let message = String::from_utf8_lossy(&buffer).to_string();


    println!("Received message from client: {}", message);


    let response = "Hello from server!";


    stream.write(response.as_bytes()).expect("Failed to write to stream");


    }


    Err(e) => {


    eprintln!("Failed to establish connection: {}", e);


    }


    }


    }


    // Client


    let mut stream = TcpStream::connect("127.0.0.1:8080").expect("Failed to connect
    to server");


    let message = "Hello from client!";


    stream.write(message.as_bytes()).expect("Failed to write to stream");


    let mut response = String::new();


    stream.read_to_string(&mut response).expect("Failed to read from stream");


    println!("Received response from server: {}", response);


    }


    ```


    In this example, we have both a server and a client. The server listens for incoming
    connections on IP address 127.0.0.1 (localhost) and port 8080 using the `TcpListener::bind`
    function.


    When a client connects to the server, the server accepts the connection, reads
    a message from the client, prints it to the console, and sends a response back
    to the client.


    On the client side, we use the `TcpStream::connect` function to establish a connection
    with the server. We then write a message to the server and read the response from
    the server.


    # ## 8.3 UDP Networking: Lightweight Communication


    UDP networking in Rust allows lightweight communication between devices without
    establishing a connection. UDP is often used in scenarios where low latency and
    quick data transmission are essential.


    Let''s see an example that demonstrates a simple UDP client-server interaction
    in Rust:


    ```rust


    use std::net::UdpSocket;


    fn main() {


    // Server


    let server_socket = UdpSocket::bind("127.0.0.1:8888").expect("Failed to bind");


    let mut buffer = [0; 1024];


    let (size, client_address) = server_socket


    .recv_from(&mut buffer)


    .expect("Failed to receive from client");


    let message = String::from_utf8_lossy(&buffer[..size]).to_string();


    println!("Received message from client: {}", message);


    let response = "Hello from server!";


    server_socket


    .send_to(response.as_bytes(), client_address)


    .expect("Failed to send response to client");


    // Client


    let client_socket = UdpSocket::bind("127.0.0.1:0").expect("Failed to bind");


    let server_address = "127.0.0.1:8888";


    let message = "Hello from client!";


    client_socket


    .send_to(message.as_bytes(), server_address)


    .expect("Failed to send to server");


    let mut buffer = [0; 1024];


    let (size, _) = client_socket


    .recv_from(&mut buffer)


    .expect("Failed to receive from server");


    let response = String::from_utf8_lossy(&buffer[..size]).to_string();


    println!("Received response from server: {}", response);


    }


    ```


    In this example, we have a server and a client communicating over UDP. The server
    binds to IP address 127.0.0.1 (localhost) and port 8888 using the `UdpSocket::bind`
    function.


    The server receives a message from the client, prints it to the console, and sends
    a response back to the client using the `recv_from` and `send_to` methods.


    On the client side, we bind the client socket to IP address 127.0.0.1 and a random
    available port using `UdpSocket::bind`. We then send a message to the server and
    receive the response using the `send_to` and `recv_from` methods.


    ## Conclusion


