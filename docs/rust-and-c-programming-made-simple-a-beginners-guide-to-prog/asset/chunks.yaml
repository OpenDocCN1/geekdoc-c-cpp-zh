    ### Encapsulation and Data Hiding


    Encapsulation is a key principle of OOP that involves bundling data and related
    functionality into a single unit (a class). It allows for data hiding, where the
    internal details of a class are kept hidden from external access. Access to the
    data is controlled through methods, such as getters and setters.


    Here''s an example that demonstrates encapsulation and data hiding:


    ```cpp

    class BankAccount {

    private:

    std::string accountNumber;

    double balance;

    public:

    // Getter for accountNumber

    std::string getAccountNumber() {

    return accountNumber;

    }

    // Setter for balance

