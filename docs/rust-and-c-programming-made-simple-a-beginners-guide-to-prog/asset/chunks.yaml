    \n## 总结\n\n在本章中，我们探索了 Rust 变量和数据类型的基础。我们学习了如何声明变量、处理不同的数据类型并理解 Rust 的类型推断。变量和数据类型对于编写健壮可靠的程序至关重要。\n\
