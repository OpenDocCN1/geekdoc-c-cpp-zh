    # ## 14.1 Introduction to Networking in Rust


    Networking is a fundamental aspect of modern software development, enabling communication
    and data exchange between different systems. Rust provides a rich ecosystem of
    networking libraries and APIs that facilitate network programming.


    Rust''s networking libraries cover a wide range of networking protocols, including
    TCP, UDP, HTTP, WebSockets, and more. These libraries provide abstractions and
    tools to handle network communication effectively, ensuring security, reliability,
    and performance.


    # ## 14.2 TCP Communication with Rust


    TCP (Transmission Control Protocol) is a reliable, connection-oriented protocol
    widely used for communication between applications over networks. Rust provides
    several libraries and abstractions to work with TCP communication.


    Let''s see an example that demonstrates how to establish a TCP connection and
    exchange data using the `std::net` module:


    ```rust


    use std::io::{Read, Write};


    use std::net::{TcpListener, TcpStream};


    fn main() {


    // TCP server


    let listener = TcpListener::bind("127.0.0.1:8080").expect("Failed to bind address");


    for stream in listener.incoming() {


    match stream {


    Ok(mut stream) => {


    // Handle client connection


    let mut buffer = [0; 1024];


    stream.read(&mut buffer).expect("Failed to read from stream");


    println!("Received data: {:?}", &buffer);


    let response = "Hello from the server!";


    stream.write(response.as_bytes()).expect("Failed to write to stream");


    }


    Err(e) => {


    println!("Error: {}", e);


    }


    }


    }


    }


    ```


    In this example, we create a TCP server using the `TcpListener` type and bind
    it to the address `127.0.0.1:8080`. We accept incoming client connections using
    the `incoming` method, which returns an iterator of `TcpStream` instances representing
    client connections. Inside the loop, we handle each client connection by reading
    data from the stream and writing a response.


    # ## 14.3 UDP Communication with Rust


    UDP (User Datagram Protocol) is a lightweight, connectionless protocol that provides
    fast and unreliable communication. Rust provides libraries and abstractions to
    work with UDP communication, allowing us to build applications that leverage UDP
    for network communication.


    Let''s see an example that demonstrates how to send and receive UDP packets using
    the `std::net` module:


    ```rust


    use std::net::{UdpSocket, SocketAddr};


    fn main() {


    // UDP server


    let socket = UdpSocket::bind("127.0.0.1:8080").expect("Failed to bind address");


    let mut buffer = [0; 1024];


    loop {


    match socket.recv_from(&mut buffer) {


    Ok((size, src_addr)) => {


    println!("Received data from {}: {:?}", src_addr, &buffer[..size]);


    let response = "Hello from the server!";


    socket.send_to(response.as_bytes(), &src_addr).expect("Failed to send data");


    }


    Err(e) => {


    println!("Error: {}", e);


    }


    }


    }


    }


    ```


    In this example, we create a UDP server using the `


    UdpSocket` type and bind it to the address `127.0.0.1:8080`. We continuously listen
    for incoming UDP packets using the `recv_from` method, which returns the size
    of the received data and the source address. We then process the received data
    and send a response back to the client using the `send_to` method.


    # ## 14.4 HTTP Communication with Rust


    HTTP (Hypertext Transfer Protocol) is the foundation of communication on the World
    Wide Web. Rust provides powerful libraries and frameworks for handling HTTP communication,
    enabling us to build web servers, REST APIs, and web applications.


    One of the popular libraries for HTTP communication in Rust is `hyper`. Let''s
    see an example that demonstrates how to use `hyper` to build a simple HTTP server:


    ```rust


    use hyper::service::{make_service_fn, service_fn};


    use hyper::{Body, Request, Response, Server};


    async fn handle_request(req: Request<Body>) -> Result<Response<Body>, hyper::Error>
    {


    // Handle the request and return a response


    let response = Response::new(Body::from("Hello from the server!"));


    Ok(response)


    }


    #[tokio::main]


    async fn main() {


    let addr = ([127, 0, 0, 1], 8080).into();


    let make_svc = make_service_fn(|_conn| {


    async {


    Ok::<_, hyper::Error>(service_fn(handle_request))


    }


    });


    let server = Server::bind(&addr).serve(make_svc);


    if let Err(e) = server.await {


    eprintln!("Server error: {}", e);


    }


    }


    ```


    In this example, we define the `handle_request` function that takes an HTTP request
    and returns an HTTP response. We use `hyper` to create an HTTP server by providing
    a `make_service_fn` that returns a service that handles each incoming request.
    The server listens on the address `127.0.0.1:8080` and serves the requests using
    the `handle_request` function.


    ## Conclusion


    In this chapter, we explored networking in Rust. We learned about TCP and UDP
    communication, as well as HTTP communication using libraries like `hyper`. Rust''s
    networking ecosystem provides powerful tools and abstractions for building networked
    applications, allowing us to create reliable, performant, and secure systems.


