- "# 基础汉语 - 读写练习册：中文汉字初学者者的练习册（包含音频下载及可打印闪卡）\n\n\n#### 关于 TUTTLE\n“连接东西方的书籍”\n\nTuttle\
  \ Publishing 的核心使命是创作通过一页将人们联系在一起的书籍。Tuttle 于 1832 年创立于美国佛蒙特州拉特兰的一个新英格兰小镇。我们的基本价值观至今一如那时一样坚定——即出版顶级的书籍，向英语世界介绍亚洲的国家和人民。如今世界变得越来越狭小，亚洲的经济、文化和政治影响力不断扩大，但对这一多元地区进行有意义对话和获取信息的需求比所未有。自\
  \ 1948 年以来，Tuttle 一直亚洲文化、艺术、美食、语言和文学书籍出版领域的领导者。我们的作者和摄影师屡获殊，Tuttle 出版了涵盖从武术到纸工艺等主题的数千本书。欢迎您访问\
  \ [www.tuttlepublishing.com](http://www.tuttlepublishing.com) 探索关于亚洲的丰富信息。\n\n![图片](img/2a.jpg)\n\
  \n## 附加材料\n随附 CD-ROM 中的附加材料也可以下载。\n\n### 如何下载本书书的附加材料：\n1. 您必须连接网络。\n2. 在网络浏览器中输入以下\
  \ URL：\n[`www.tuttlepublishing.com/basic-mandarin-chinese-reading-writing-practice-book-downloadable-cd-content`](http://www.tuttlepublishing.com/basic-mandarin-chinese-reading-writing-practice-book-downloadable-cd-content)\n\
  \n如需支持，请邮件至 `info@tuttlepublishing.com`。\n\n## 给学习者的说明\n在学习中文时，练习固然是必不可少的。本练习册为您练习和磨练书面中文提供了许多选择，并设计用于配合教材\
  \ `Basic Mandarin Chinese Reading & Writing` 及其配套读物 `Basic Mandarin Chinese Speaking\
  \ & Listening` 和 `Basic Mandarin Chinese Speaking & Listening Practice Book` 一起。然而，无论您使用哪种教材或课程来学习中文，本练习册都可以用于磨练读读写能力。\n\
  \n以下是《基础普通汉语读写练习册》的一些特别之处：\n\n> • 本练习册的设计使其既可以在老师指导的课堂上使用，也可以供独立学习者自主学习。\n> • 本书中同时教授并练习简体和繁体字。这意味着学生可以学习其中一种或两种字体，而无需购买另一本书；同时教师也可以灵活地开展混合教学，让一些学生读写一种字体，而另一些学生读写另一种。\n\
  > • 本练习册提供了汉字练习字。\n\n\n\n\n\n最后，我要感谢 1993 年至 2010 年间威廉姆斯学院基础汉语班的学生，感谢他们的指正、建议、鼓励和启发。\n\
