- fmt: "\nLast but not least, I wish to thank the students in the Basic Chinese classes\
    \ at Williams College from 1993 through 2010 for their corrections, suggestions,\
    \ encouragement, and inspiration.\n\nCornelius C. Kubler\nDepartment of Asian\
    \ Studies\nWilliams College\nWilliamstown, Massachusetts, USA\n\n# Contents\n\n\
    - [A Note to the Learner]\n- [Acknowledgments]\n- [How to Use These Materials]\n\
    - [1. Character Practice Sheets]\n- [2. Reading and Writing Exercises]\n- [3.\
    \ Translation Exercises]\n- [4. Flash Cards (288 double-sided cards) Bonus Material\n\
    \  - [Unit A: Numbers, Personal Names, and Place Names]\n  - [Unit B: People,\
    \ Places, Streets, and Roads]\n  - [Unit 1: Greetings and Useful Phrases]\n  -\
    \ [Unit 2: Introductions]\n  - [Unit 3: Numbers, Dates, Time, and Money (I)]\n\
    \  - [Unit 4: Numbers, Dates, Time, and Money (II)]\n  - [Unit 5: Locating Persons,\
    \ Places, and Things]\n  - [Unit 6: Biographical Information (I)]\n  - [Unit 7:\
    \ Biographical Information (II)]\n  - [Unit 8: Getting Around Beijing (I)]\n \
    \ - [Unit 9: Getting Around Beijing (II)]\n  - [Unit 10: Weather]\n  See Bonus\
    \ Material Audio!\n\n## How to Use These Materials\n\nBasic Mandarin Chinese Reading\
    \ & Writing Practice Book is the workbook designed to accompany the textbook `Basic\
    \ Mandarin Chinese Reading & Writing`. It offers you a wide variety of activities\
    \ for both in- and out-of-class learning, to help you reinforce and “activize”\
    \ your learning of the new characters, vocabulary, grammar, and related material\
    \ introduced in the textbook.\n\nThe pages of this workbook have been perforated\
    \ to facilitate their removal for correction by an instructor (or by a tutor or\
    \ native-speaking friend, in the case of independent learners), and then may be\
    \ kept in a binder for reference.\n\n## 1. Character Practice Sheets\n\nThe first\
    \ section of Basic Mandarin Chinese Reading & Writing Practice Book consists of\
    \ character practice sheets for all the new characters in units `A`, `B`, and\
    \ `1–10` for you to study, fill out, and hand in to your instructor or mentor\
    \ for correction and comments. A sheet with the six characters for a lesson in\
    \ simplified form always comes first, followed by a sheet with the same six characters\
    \ in traditional form on the back side of the page. We recommend that you eventually\
    \ learn to recognize both types of characters, though it’s sufficient if you learn\
    \ how to write only one type.\n\nBeing able to handwrite characters is important\
    \ not only for writing but also for reading, since if you can write a character\
    \ correctly from memory, you’re more likely to be able to recognize it and distinguish\
    \ it from other similar characters. Later on in your study of Chinese, you’ll\
    \ also want to learn how to process Chinese characters using computers, but we\
    \ feel it’s important for beginning students to have experience in writing characters\
    \ by hand.\n\nOn the practice sheets, there are two kinds of model characters\
    \ for your reference. To the left, in the large boxes, are large versions of each\
    \ character with small Arabic numbers indicating the order and direction of the\
    \ strokes. Note that the location of each number indicates where that stroke begins.\
    \ Then, to the right of the large characters, in the smaller boxes, there is a\
    \ stroke-by-stroke build-up of each character which further clarifies the stroke\
    \ order. The purpose of the handwritten characters is not to serve as examples\
    \ of calligraphy, but rather to instruct learners in accurate and legible handwriting\
    \ of the characters, as written with pen or pencil by ordinary Chinese writers\
    \ today.\n\nBe sure to follow the correct stroke order and direction. If you don’t,\
    \ your characters will not only not look right, but you might have difficulty\
    \ in using dictionaries, since these are traditionally based on the number of\
    \ strokes in characters or character components. The accuracy of handwriting recognition\
    \ software might also be affected if strokes are written in the wrong order and\
    \ direction. And if you’re not familiar with correct stroke order, you may in\
    \ the future have problems reading and writing Chinese cursive script, since which\
    \ strokes can be connected and which cannot is closely related to the order and\
    \ direction of the individual strokes.\n\nBeginning with the first empty box after\
    \ the end of the stroke-by-stroke build-up, you should write the entire character\
    \ in each empty box until all the boxes for that character have been filled. Write\
    \ slowly and carefully, referring back often to the stroke direction and stroke\
    \ order of the models. We recommend that you use either number `2` pencil or black\
    \ or blue pen. As you write each character, say its pronunciation out loud and\
    \ think of the meaning. You’ll probably want to have your textbook open for reference.\
    \ Many learners find it helpful to write the Pinyin and basic English meaning\
    \ of each character to the left of the large character on the practice sheets.\n\
    \nEven though there is an agreed upon stroke order for the majority of characters,\
    \ there exists a small number of characters that have common stroke orders, e.g.,\
    \ `方`. For the sake of consistency, in the case of simplified characters we follow\
    \ the stroke order promulgated by the Working Committee on National Language and\
    \ Script and published in Beijing by Yuwen Chubanshe as `现代汉语通用字笔规范5th printing\
    \ 1999`. In the case of traditional characters, we follow the stroke order promulgated\
    \ by the Committee on the Promotion of Mandarin and published in Taipei by the\
    \ Ministry of Education as `常用國字標準筆順手冊3rd revised printing 2008`.\n\n## 2. Reading\
    \ and Writing Exercises\n\nThis book includes two pages of reading and writing\
    \ exercises for each of the four parts of every unit of Basic Mandarin Chinese\
    \ Reading & Writing. The first section of the reading and writing exercises consists\
    \ of three phrases or sentences for dictation. You should listen to the corresponding\
    \ section of the included disc and transcribe what you hear into Chinese characters.\
    \ Since this is for practice and not a test, you’re encouraged to listen as many\
    \ times as you wish and, when needed, to consult your textbook or its glossaries.\n\
    \nBeginning with Unit `1`, the second section of the reading and writing exercises\
    \ includes four questions that you should answer in Chinese characters. The first\
    \ two questions are always based on portions of the corresponding lesson in Basic\
    \ Mandarin Chinese Reading & Writing, to which you should refer as you answer\
    \ the questions, while the last two questions are addressed to you, the learner,\
    \ and may be answered any way you wish.\n\nThe last section of the reading and\
    \ writing exercises includes a wide variety of exercises involving scrambled sentences,\
    \ dialog completion, fill-in the blank, answering questions, word study, map reading,\
    \ converting written style to spoken style, distinguishing different usages of\
    \ characters, punctuating sentences, stroke order, radicals, and phonetics, as\
    \ well as a number of exercises based on printed realia from mainland China, Taiwan,\
    \ and Hong Kong.\n\n## 3. Translation Exercises\n\nTen phrases or sentences for\
    \ translation from English to Chinese have been included for each unit of Basic\
    \ Mandarin Chinese Reading & Writing. The purpose of the translation exercises\
    \ is to provide you with additional practice in writing the characters, using\
    \ the grammar patterns, and practicing the important vocabulary of the unit, and\
    \ to serve as a check of mastery over the material. Completing the translation\
    \ exercises will be helpful to you in reviewing for the unit tests.\n"
  raw: 'Last but not least, I wish to thank the students in the Basic Chinese classes
    at Williams College from 1993 through 2010 for their corrections, suggestions,
    encouragement, and inspiration.


    Cornelius C. Kubler


    Department of Asian Studies


    Williams College


    Williamstown, Massachusetts, USA


    Contents


    [A Note to the Learner](#A_Note.xhtml_heading_id_2)


    [Acknowledgments](#Acknowledgments.xhtml_heading_id_2)


    [How to Use These Materials](#How_to_Use.xhtml_heading_id_2)


    [1. Character Practice Sheets](#Part1.xhtml_heading_id_2)


    [2. Reading and Writing Exercises](#Part2.xhtml_heading_id_2)


    [3. Translation Exercises](#Part3.xhtml_heading_id_2)


    4\. Flash Cards (288 double-sided cards) Bonus Material


    Includes practice materials for these 12 topics:


    [Unit A: Numbers, Personal Names, and Place Names](#Part1.xhtml_heading_id_3)


    [Unit B: People, Places, Streets, and Roads](#Part1.xhtml_heading_id_4)


    [Unit 1: Greetings and Useful Phrases](#Part1.xhtml_heading_id_5)


    [Unit 2: Introductions](#Part1.xhtml_heading_id_6)


    [Unit 3: Numbers, Dates, Time, and Money (I)](#Part1.xhtml_heading_id_7)


    [Unit 4: Numbers, Dates, Time, and Money (II)](#Part1.xhtml_heading_id_8)


    [Unit 5: Locating Persons, Places, and Things](#Part1.xhtml_heading_id_9)


    [Unit 6: Biographical Information (I)](#Part1.xhtml_heading_id_10)


    [Unit 7: Biographical Information (II)](#Part1.xhtml_heading_id_11)


    [Unit 8: Getting Around Beijing (I)](#Part1.xhtml_heading_id_12)


    [Unit 9: Getting Around Beijing (II)](#Part1.xhtml_heading_id_13)


    [Unit 10: Weather](#Part1.xhtml_heading_id_14)


    See Bonus Material Audio!


    How to Use These Materials


    Basic Mandarin Chinese Reading & Writing Practice Book is the workbook designed
    to accompany the textbook Basic Mandarin Chinese Reading & Writing. It offers
    you a wide variety of activities for both in- and out-of-class learning, to help
    you reinforce and “activize” your learning of the new characters, vocabulary,
    grammar, and related material introduced in the textbook.


    The pages of this workbook have been perforated to facilitate their removal for
    correction by an instructor (or by a tutor or native-speaking friend, in the case
    of independent learners), and then may be kept in a binder for reference.


    Character Practice Sheets


    The first section of Basic Mandarin Chinese Reading & Writing Practice Book consists
    of character practice sheets for all the new characters in units A, B, and 1–10
    for you to study, fill out, and hand in to your instructor or mentor for correction
    and comments. A sheet with the six characters for a lesson in simplified form
    always comes first, followed by a sheet with the same six characters in traditional
    form on the back side of the page. We recommend that you eventually learn to recognize
    both types of characters, though it’s sufficient if you learn how to write only
    one type.


    Being able to handwrite characters is important not only for writing but also
    for reading, since if you can write a character correctly from memory, you’re
    more likely to be able to recognize it and distinguish it from other similar characters.
    Later on in your study of Chinese, you’ll also want to learn how to process Chinese
    characters using computers, but we feel it’s important for beginning students
    to have experience in writing characters by hand.


    On the practice sheets, there are two kinds of model characters for your reference.
    To the left, in the large boxes, are large versions of each character with small
    Arabic numbers indicating the order and direction of the strokes. Note that the
    location of each number indicates where that stroke begins. Then, to the right
    of the large characters, in the smaller boxes, there is a stroke-by-stroke build-up
    of each character which further clarifies the stroke order. The purpose of the
    handwritten characters is not to serve as examples of calligraphy, but rather
    to instruct learners in accurate and legible handwriting of the characters, as
    written with pen or pencil by ordinary Chinese writers today.


    Be sure to follow the correct stroke order and direction. If you don’t, your characters
    will not only not look right, but you might have difficulty in using dictionaries,
    since these are traditionally based on the number of strokes in characters or
    character components. The accuracy of handwriting recognition software might also
    be affected if strokes are written in the wrong order and direction. And if you’re
    not familiar with correct stroke order, you may in the future have problems reading
    and writing Chinese cursive script, since which strokes can be connected and which
    cannot is closely related to the order and direction of the individual strokes.


    Beginning with the first empty box after the end of the stroke-by-stroke build-up,
    you should write the entire character in each empty box until all the boxes for
    that character have been filled. Write slowly and carefully, referring back often
    to the stroke direction and stroke order of the models. We recommend that you
    use either number 2 pencil or black or blue pen. As you write each character,
    say its pronunciation out loud and think of the meaning. You’ll probably want
    to have your textbook open for reference. Many learners find it helpful to write
    the Pinyin and basic English meaning of each character to the left of the large
    character on the practice sheets.


    Even though there is an agreed upon stroke order for the majority of characters,
    there exists a small number of characters that have common alternate stroke orders,
    e.g., 方. For the sake of consistency, in the case of simplified characters we
    follow the stroke order promulgated by the Working Committee on National Language
    and Script and published in Beijing by Yuwen Chubanshe as 现代汉语通用字笔顺规范 (5th printing
    1999). In the case of traditional characters, we follow the stroke order promulgated
    by the Committee on the Promotion of Mandarin and published in Taipei by the Ministry
    of Education as 常用國字標準字筆順手冊 (3rd revised printing 2008).


    Reading and Writing Exercises


    This book includes two pages of reading and writing exercises for each of the
    four parts of every unit of Basic Mandarin Chinese Reading & Writing. The first
    section of the reading and writing exercises consists of three phrases or sentences
    for dictation.^([*](#How_to_Use.xhtml_pg1_1)) You should listen to the corresponding
    section of the included disc and transcribe what you hear into Chinese characters.
    Since this is for practice and not a test, you’re encouraged to listen as many
    times as you wish and, when needed, to consult your textbook or its glossaries.


    Beginning with Unit 1, the second section of the reading and writing exercises
    includes four questions that you should answer in Chinese characters. The first
    two questions are always based on portions of the corresponding lesson in Basic
    Mandarin Chinese Reading & Writing, to which you should refer as you answer the
    questions, while the last two questions are addressed to you, the learner, and
    may be answered any way you wish.


    The last section of the reading and writing exercises includes a wide variety
    of exercises involving scrambled sentences, dialog completion, fill-in-the blank,
    answering questions, word study, map reading, converting written style to spoken
    style, distinguishing different usages of characters, punctuating sentences, stroke
    order, radicals, and phonetics, as well as a number of exercises based on printed
    realia from mainland China, Taiwan, and Hong Kong.


    Translation Exercises


    Ten phrases or sentences for translation from English to Chinese have been included
    for each unit of Basic Mandarin Chinese Reading & Writing. The purpose of the
    translation exercises is to provide you with additional practice in writing the
    characters, using the grammar patterns, and practicing the important vocabulary
    of the unit, and to serve as a check of mastery over the material. Completing
    the translation exercises will be helpful to you in reviewing for the unit tests.'
