    (8) 对不起﹐我今天没带 _____ 片。 (對不起，我今天沒帶 _____ 片。) [ 名 明 ]


    (9) 我很高 _____ 能来这儿学中文。 (我很高 _____ 能來這兒學中文。) [ 姓 兴(興) ]


    (10) 从北京到长城要几个 _____ 头？(從北京到長城要幾個 _____ 頭？) [ 中 钟(鐘) ]


    (11) 住北京饭店一天得多少 _____？(住北京飯店一天得多少 _____？) [ 前 钱(錢) ]


