  trans: "\n\n最后，我要感谢 1993 年至 2010 年间威廉姆斯学院基础汉语班的学生，感谢他们的指正、建议、鼓励和启发。\n\nCornelius\
    \ C. Kubler\n亚洲研究系\n威廉姆斯学院\n马萨诸塞州，威廉斯斯顿，美国\n\n# 目录\n\n- [给学习者的说明]\n- [致谢]\n- [如何使用这些材料]\n\
    - [1. 汉字练习字帖]\n- [2. 读写练习]\n- [3. 翻译练习]\n- [4. 闪卡（288 张双面卡）补充材料\n  - [A 单元：数字、人名和地名]\n\
    \  - [B 单元：人物、地点、街道和道路]\n  - [第 1 单元：问候与常用短语]\n  - [第 2 单元：自我介绍]\n  - [第 3 单元：数字、日期、时间和金钱\
    \ (I)]\n  - [第 4 单元：数字、日期、时间和金钱 (II)]\n  - [第 5 单元：人物、地点和物品的位置]\n  - [第 6 单元：个人信息\
    \ (I)]\n  - [第 7 单元：个人信息 (II)]\n  - [第 8 单元：在北京出行 (I)]\n  - [第 9 单元：在北京出行 (II)]\n\
    \  - [第 10 单元：天气]\n  查看补充材料音频！\n\n## 如何使用这些材料\n\n《基础汉语读写练习本》是专为配合《基础汉语读写》教材教材而设计的练习本。它为学生提供了丰富的活动，涵盖课内和课外学习，帮助你强化并“激活”你对教材中介绍的新汉字、词汇、语法及相关材料的学习。\n\
    \n本练习本的页面均有易撕孔，方便学生将其交给教师（对于自主学习者，可以交给家教或母语朋友）取下进行批改，之后可以存放在活页夹中参考。\n\n## 1. 汉字练习字帖\n\
    \n《基础汉语读写练习本》的第一部分由 `A`、`B` 以及 `1–10` 单元中所有新汉字的练习字帖组成，供你学习、填写并提交给教师或导师进行批改和提供意见。每课的第一张字帖始终是该课六个字的简体字形式，页面的背面是相同六个字的繁体字字帖。我们建议你最终学会识别这两种类型的字，尽管如果你只学会写其中一种也足够了。\n\
    \n能够手写汉字不仅对写作很重要，对阅读也同样，因为如果你能从记忆中正确地写出一个字，你更有可能识别出它并将其与其他相似字区分开来。在随后的汉语学习中，你可能还会学习如何使用电脑处理汉字，但我们认为对于初学者来说，拥有手写汉字的经验是非常重要的。\n\
    \n在练习字帖上，有两种模范字供你参考。左侧的大框内是每个汉字的放大版，并配有小阿拉伯数字表示笔顺和方向。请注意，每个数字的位置表示该笔画的起始点。然后，在大字字的右侧的小框内，有每个汉字的逐笔拆解过程，这进一步阐明了笔顺。手写字的目的不是作为书法范例，而是为了指导学习者准确、易读地书写汉字，就像今天中国书写者用钢笔或铅笔写的那样。\n\
    \n务必遵循正确的笔顺和方向。如果不这样做，你的字不仅看起来不正确，而且在查字典时可能会遇到困难，因为字典传统上是基于汉字的笔画数或偏部的。如果笔画的顺序和方向错误，手写识别软件的准确性也可能受到影响。如果你不熟悉正确的笔顺，未来在阅读和书写中文草书可能会遇到问题，因为哪些笔画可以连接哪些不能连接与单个笔画的顺序和方向密切相关。\n\
    \n从逐笔拆解后的第一个空框开始，你应该在每个空框内写下整个字，直到填满该字的所有框。写的时候要慢且仔细，经常参考模范字的笔画方向和笔顺。我们建议你使用 `2`\
    \ 号铅笔或黑笔、蓝笔。在写每个字时，大声读出它的读音并思考它的意义。你可能需要打开教材参考。许多学习者发现，在练习帖的大字左侧写下每个字的拼音和基础英语含义很有帮助。\n\
    \n尽管大多数字都有公认的笔顺，但仍少数字存在常见的笔顺，例如 `方`。为了保持一致性，在简体字方面，我们遵循国家语言文字工作委员会公布、语文出版社在上海出版的《现代汉语通用字笔规范（第\
    \ 5 版，1999 年）》。在繁体字方面，我们遵循汉语推广委员会公布、教育部在台北出版的《常用国字标准笔顺手册（第 3 修订版，2008 年）》。\n\n\
    ## 2. 读写练习\n\n本书为《基础汉语读写》每个单元四个部分中的每一部分提供了两页读写练习。读写练习的第一部分包含三个用于听写的短语或句子。你应该听随带的光盘相应的章节，并将听到的内容写成汉字。由于这是练习而非考试，我们鼓励你根据需要多次听写，并在需要时查阅教材或词汇表。\n\
    \n从第 `1` 单元开始，读写练习的第二部分包含四个需要用汉字回答的问题。前两个问题始终基于《基础汉语读写》相应课程的内容，你在回答问题时应参考教材，而最后两个问题是针对你这位学习者的，可以以任何你喜欢的方式。\n\
    \n读写练习的最后一部分包含了多种练习，涉及连序成句、对话完成、填空、回答问题、词汇学习、地图阅读、书面语向口语转换、汉字用法辨析、标点符号、笔顺、偏旁和语音，以及若干基于中国大陆、台湾和香港印刷实物的练习。\n\
    \n## 3. 翻译练习\n\n《基础汉语读写》每个单元都包含了十个从英语翻译成中文的短语或句子。翻译练习的目的是为你提供书写汉字、使用语法结构和练习单元重要词汇的额外机会，并作为掌握程度的检查。完成翻译练习对你复习单元测试非常有帮助。\n\
    \n"
