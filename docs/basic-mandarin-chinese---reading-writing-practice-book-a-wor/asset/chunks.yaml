    ## ABOUT TUTTLE

    “Books to Span the East and West”


    Our core mission at Tuttle Publishing is to create books which bring people together
    one page at a time. Tuttle was founded in 1832 in the small New England town of
    Rutland, Vermont (USA). Our fundamental values remain as strong today as they
    were then—to publish best-in-class books informing the English-speaking world
    about the countries and peoples of Asia. The world has become a smaller place
    today and Asia’s economic, cultural and political influence has expanded, yet
    the need for meaningful dialogue and information about this diverse region has
    never been greater. Since 1948, Tuttle has been a leader in publishing books on
    the cultures, arts, cuisines, languages and literatures of Asia. Our authors and
    photographers have won numerous awards and Tuttle has published thousands of books
    on subjects ranging from martial arts to paper crafts. We welcome you to explore
    the wealth of information available on Asia at [www.tuttlepublishing.com](http://www.tuttlepublishing.com).


    ![Image](Images/2a.jpg)


    ## Bonus Material

    The Bonus Material from the enclosed CD-ROM may also be Downloaded.


    ### How to Download the Bonus Material of this Book.

    1. You must have an internet connection.

    2. Type the URL below into to your web browser.

    [http://www.tuttlepublishing.com/basic-mandarin-chinese-reading-writing-practice-book-downloadable-cd-content](http://www.tuttlepublishing.com/basic-mandarin-chinese-reading-writing-practice-book-downloadable-cd-content)


    For support email us at `info@tuttlepublishing.com`.


    ## A Note to the Learner

    When it comes to learning Chinese, practice is essential, of course. This workbook
    offers you many options for practicing and polishing your written Chinese, and
    was designed to be used in conjunction with the textbook `Basic Mandarin Chinese
    Reading & Writing` as well as its companion volumes `Basic Mandarin Chinese Speaking
    & Listening` and `Basic Mandarin Chinese Speaking & Listening Practice Book`.
    However, this workbook may be used to hone reading and writing skills no matter
    which textbook or course you’re using to learn Chinese.


    These are some of the special features of Basic Mandarin Chinese Reading & Writing
    Practice Book:


    > • This workbook has been designed so it can be used either in a class with an
    instructor or by independent learners working on their own.

    > • Both simplified and traditional characters are taught and practiced in the
    same volume. This means students can learn either or both kinds of characters
    without having to purchase another book; and instructors have the flexibility
    to teach a combined class where some students read and write one type of characters
    and other students the other type.

    > • This workbook provides character practice sheets.

