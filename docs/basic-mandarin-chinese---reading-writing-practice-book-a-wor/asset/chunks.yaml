    句子应翻译成中文，并在句子下方的空白处使用正确的标点符号。翻译练习中的英文在某些地方故意显得有些生硬，以引导你做出正确的中文翻译。在某些情况下，英文句子内部或之后添加了额外的说明（例如：为了礼貌或使用/不使用某些词汇）。如果你忘记了某个英文单词或语法模式的中文对应词，可以查阅《基础汉语读写》和《基础汉语口听说》书末的各种词汇表和索引。


    建议教师在相应单元的测试之前批改翻译练习题并交还给学生，以便及时发现并解决遗留问题。学生应该仔细学习教师的批改意见，确保理解错误的原因，并将修改后的练习题存档以备日后参考。


    # 闪卡


    闪卡是记忆的极佳辅助。它们基于间隔复习原理，即逐渐增加每次正确回忆信息之间的时间间隔。我们建议你无论去哪里，都随身携带几十张《基础汉语读写练习册》中的闪卡。利用排队、坐公交车或课课前的“碎片”时间来学习闪卡。你可以看着汉字的一面，测试自己对汉字的读音和含义；也可以看着英文面，尝试以此还原出正确的读音和汉字。你的目标应该是识别出那些你仍有困难的字和词，并将它们从大集中取出进行专门学习。


    《基础汉语读写》配有闪卡。这包括纸质闪卡，每张对应 288 个新字中的一个。纸质卡的正面是汉字（简体和繁体），背面是拼音和英文。每课的新字以及用这些字编写的单独单词都包含在闪卡中。每张卡片双面的左下角标有单元和部分编号，右下角是该字在课程中的编号。由于页面限制并为了控制成本，纸质闪卡包含在附的光盘中，用户根据需要自行打印。打印闪卡时应小心——先打印所有带汉字的页面，然后在另一面打印带拼音和英文的页面，最后用切纸刀或剪刀将每页的八张闪卡剪开。


    - *如何听写练习的脚本包含在教师指南中。


