    The sentences should be translated into Chinese characters with correct punctuation
    in the blank space that has been left under each sentence. The English in the
    translation exercises is in some places purposely somewhat stilted, to guide you
    toward the correct Chinese translation. In certain cases, additional instructions
    have been added in parentheses within or after the English sentence, for example,
    to be polite or to use or not use certain words. If you’ve forgotten the Chinese
    equivalent for an English word or grammar pattern, you can consult the various
    glossaries and indices in the back of Basic Mandarin Chinese Reading & Writing
    and Basic Mandarin Chinese Speaking & Listening.


    It’s recommended that the instructor correct and return the translation exercises
    to students before the test on the corresponding unit, so that any remaining problems
    can be identified and addressed in a timely manner. Students should carefully
    study the instructor’s corrections, making sure they understand the reason for
    any errors, and then file the corrected exercises for later reference.


    # Flash Cards


    Flash cards are an excellent aid in memorization. They work based on the principle
    of spaced repetition, that is, gradually increasing the interval between each
    time that you recall information correctly. We recommend that you take along a
    couple of dozen flash cards from Basic Mandarin Chinese Reading & Writing Practice
    Book wherever you go. Use “empty” time you spend waiting in line, on a bus, or
    before classes begin to study the flash cards. You can look at the character side
    and test yourself on the pronunciation and meaning of the characters, or you can
    look at the English side and try to reconstruct from that the correct pronunciation
    and characters. Your goal should be to identify those characters and words you
    still have problems with and remove them from the larger set for special study.


    Flash cards are available for Basic Mandarin Chinese Reading & Writing. This consists
    of traditional paper flash cards, one card for each of the 288 new characters.
    The paper flash cards have been designed with Chinese characters (simplified and
    traditional) on one side, and Pinyin and English on the other side. Both the new
    characters of each lesson and the individual words written with those characters
    are included on the flash cards. In the lower left-hand corner on both sides of
    every card are given the unit and part number, while in the lower right-hand corner
    is given the number of the character in this course. Due to page limitations and
    in an effort to control costs, the paper flash cards have been included on the
    enclosed disc for users to print out themselves as needed. The flash cards should
    be carefully printed—first all the pages with Chinese characters, then, on the
    other side, the pages with Pinyin and English, after which each page of eight
    flash cards can be cut apart with a paper cutter or scissors.


    - [*](#How_to_Use.xhtml_pga1_1) Scripts for the dictation exercises are included
    in the Instructor’s Guide.


