    ### C. Choose the Right Homonym!


    Many characters are homonyms, i.e., have the same pronunciation but different
    meanings. Even native writers sometimes mix them up, especially when writing via
    computer. From the choices given in brackets after each sentence below, choose
    the right homonym and write it in the blank.


