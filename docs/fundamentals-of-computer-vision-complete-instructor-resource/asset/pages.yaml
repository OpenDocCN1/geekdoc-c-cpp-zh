    # 7.4 The Distance Transform


    A very important application of morphological operations is the distance transform
    (DT). The DT may be defined in several ways, but we will present a simple one
    here. The distance transform is an iconic representation of an image, in which
    each pixel in the DT contains the distance of the corresponding pixel in the input
    image from some feature. Most often, the feature is an edge. In this case, the
    distance from a pixel to an edge is defined as the distance to the closest edge
    point. In this section, the boundary of region R is denoted by the set of points
    $\partial R$. Figure 7.13 illustrates the DT of both the interior and exterior
    of a region whose boundary is known.


    Depending on the distance measure used, there are different versions of the DT.
    The Euclidean DT is described by


    ```

    $$ DT(\mathbf{x}) = \min_{y \in \partial R} \| \mathbf{x} - \mathbf{y} \| $$ (7.29)

    ```


    where x and y are 2-vectors of coordinates.


    The distance transform that results from some DT algorithm is dependent on the
    definition of distance, of neighbor, and the details of the algorithm. Clearly,
    the transform shown in Figure 7.13 does not provide the Euclidean distance from
    each pixel to the nearest boundary point.


    # 7.4.1 Computing the DT Using Iterative Nearest Neighbor


    To start off, the initial condition of the iterative process is that $DT(\mathbf{x})
    = 0$ for $\mathbf{x} \in \partial R$. That is, the DT at the boundary pixels of
    the region is set to 0. Then at iteration 1, look at each pixel and determine
    if it has a neighbor that has a label of 0. If so, label it with a 1. Do'
