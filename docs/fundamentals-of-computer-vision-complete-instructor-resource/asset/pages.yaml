    to the cosine of the angle between the surface normal vector and the illumination
    vector, a Lambertian reflectance model:


    ```

    \(R(x, y) = r_a \mathbf{N}_i \cdot \mathbf{n}\) (12.80)

    ```


    where \(\mathbf{N}_i\) is a unit vector\(^9\) in the direction of light source
    \(i\), and \(\mathbf{n}\) is the unit normal to the surface. If we are fortunate
