  md: '# 11 Representing and Matching Scenes


    > One of these things is not like the other:

    > - Sesame Street


    # 11.1 Introduction


    In this chapter rather than matching regions that we did in Chapter 10, we consider
    issues associated with matching scenes.

    Matching at this level establishes an interpretation. That is, it puts two representations

    into correspondence:


    +   - (Section 11.2) In this section, both representations may be of the same
    form. For example, correlation matches an observed image with a template, an approach
    called template matching. Eigenimages are also a representation for images that
    use the concepts of principal components to match images.

    +   - (Section 11.3) When matching scenes, we don''t really want to match every
    single pixel, but only doing matching at points that are "interesting." This requires
    a definition for interest points.

    +   - (Sections 11.4, 11.5, and 11.6) Once the interest points are identified,
    these sections develop three methods, SIFT, SKS, and HoG, for describing the neighborhood
    of the interest points using descriptors and then matching those descriptors.

    +   - (Section 11.7) If the scene is represented abstractly, by nodes in graphs,
    methods are provided for matching graphs.

    +   - (Sections 11.8 and 11.9) In these sections, two other matching methods,
    including deformable templates, are described.


    As we investigate matching scenes, or components of scenes, a new word is introduced,
    descriptor. This word denotes a representation for a local neighborhood in a scene,
    a neighborhood of perhaps 200 pixels, larger than the kernels we have thought
    about, but smaller than templates. The terms kernels, templates, and descriptors,
    while they do connote size to some extent, are really describing how this local
    representation is used, as the reader will see.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 11.2 Matching Iconic Representations


    # 11.2.1 Matching Templates to Scenes


    Recall that an iconic representation of an image is an image, e.g., a smaller
    image, an image that is not blurred, etc. In this section, we need to match two
    images.


    A template is a representation for an image (or sub-image) that is itself an image,
    but almost always smaller than the original. A template is typically moved around
    the target image until a location is found that maximizes some match function.
    The most obvious such function is the sum squared error, sometimes referred to
    as the sum-squared difference (SSD),


    \( SSD(x, y) = \left( \sum_{u=1}^N \sum_{v=1}^N (f(x+u, y+v) - T(u, v)) \right)^2
    \, , \) (11.1)


    which provides a measure of how well the template (T) matches the image (f) at
    point x, y, assuming the template is N x N. If we expand the square and carry
    the summation through, we find1


    \( SSD(x, y) = \sum_{u, v} f^2(x+u, y+v) - 2 \sum_{u, v} f(x+u, y+v) T(u, v) +
    \sum_{u, v} T^2(u, v). \) (11.2)


    In this equation, the template indices are denoted as ranging from 1 to N. However,
    the origin of the template could be arbitrarily defined to be in the center of
    the template, and in that case, the template indices could have negative values
    without any loss of generality.


    Let''s look at these terms: The first term is the sum of the squared image brightness
    values at the point of application. It says nothing about how well the image matches
    the template (although it IS dependent on the image). The third term is simply
    the sum of the squared elements of the template, and is a constant, no matter
    where the template is applied. The second term, containing both the image and
    the template, is the key to matching, and that term is the correlation.


    We have seen correlation many times in this book. For example, an edge detector
    actually looks like an edge, a fact that a kernel operator detects using correlation.
    Correlation occurs over and over again. Due to the image dependency in the first
    term of Eq. 11.2, the use of maximum of correlation for matching isn''t quite
    the same as minimizing the SSD, and that difference can cause problems and require
    normalization.


    # Normalized Correlation


    To make correlations less sensitive to variations in lighting they may be normalized
    by modifying both the image and the template by:


    +   - Computing the mean of the image in the region under the template, denoted
    \(\hat{f}(x, y)\).

    +   - Computing the mean of all the points in the template, denoted \(\hat{T}\).'
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   • Computing the variances


    ```

    S_1 = \sum_{x,y} [f(x,y) - \hat{f}]^2 \quad (11.3)

    S_2 = \sum_{u,v} [T(u,v) - \hat{T}]^2 \quad (11.4)

    ```


    where the sums are over the area of the templates. Note that \(\hat{f}\) is parameterized
    by (x, y) because it changes as the location of the template is changed.


    +   • Then the normalized correlation becomes


    ```

    \frac{\sum_{u,v} [f(x+u, y+v) - \hat{f}][T(u,v) - \hat{T}]}{S_1 S_2}

    ```


    # 11.2.2 Point Matching


    If an image is considered to be just a set of points with known distances between
    each other, one may approach the problem by assuming a 3D model of the object,
    and finding the transformation from 3D to 2D that best describes the observation.
    These techniques are beyond the scope of this book, but the reader who needs this
    information can refer to [11.51] and [11.3]. However, the possible applications
    of matching point clouds could include comparing two shapes returned by a sparse
    range camera. We will discuss this in Chapter 12.


    # 11.2.3 Eigenimages


    Suppose you are given a set of p images, f_1, f_2, ..., f_p, and you are faced
    with the question: Which of these images is most representative of the set? You
    could use the mathematics from section 10.3.1 to accomplish this as follows:


    +   1. Construct a set of vectors {g_1, g_2, ..., g_p}: where each g_i is the
    lexicographic representation of the corresponding image minus the average image:
    g_i = f_i - \bar{f}.

    +   2. Calculate the covariance matrix, K, of this set by the same methods you
    learned in section 10.3.1.

    +   3. Use eigenvalue techniques to obtain the eigenvectors and eigenvalues of
    K.

    +   4. Suppose that among the eigenvalues, the first k values are much larger
    than the others. Then the corresponding eigenvectors (eigenimages), e_i, i = 1,
    ..., k, play the role of principal components. Just a few of these may suffice
    to reconstruct the original image without losing too much information.

    +   5. Project each image onto the principal eigenvectors by constructing a matrix
    with those eigenvectors as columns, [e_1, e_2, ..., e_k]. w_i^T = g_i^T [e_1,
    e_2, ..., e_k]. (11.5)


    Then, e_j is the j-th eigenimage, and w_i^T is a k-dimensional vector, containing
    the projection coefficient of the original image onto each eigenimage.'
