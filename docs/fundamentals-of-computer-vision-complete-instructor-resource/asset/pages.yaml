- pgno: 100
  md: '+   • We made use of the linearity of kernel operators to interchange the role
    of blur and differentiation to construct kernels. We used the constrained optimization
    and Lagrange multipliers to solve this problem.


    Edge detection using derivative kernels, although effective, still suffers from
    many potential problems. In later chapters, we will discuss some more advanced
    algorithms to further improve the performance of edge detection.


    For example, after we have chosen the very best operators to estimate derivatives,
    the best thresholds and the best estimates of edge position, there might still
    remain a set of pixels, marked as probably part of an edge. If those positions
    are adjacent, one could “walk” from one pixel to the next, eventually circumnavigating
    a region. However, the points are unlikely to be connected the way we would like
    them to be. Some points may be missing due to blur, noise, or partial occlusion.
    There are many ways to approach this problem, including parametric transforms,
    which will be discussed in detail later in this book (Chapter 9).


    To take another example, apply a Gaussian low-pass filter and then search for
    a zero in the (second) derivative could accurately (to sub-pixel resolution) find
    the exact location of the edge, but only if the edge is straight [5.29]. If the
    edge is curved, errors are introduced. In addition, all the methods cited or described
    in this chapter perform signal processing in a direction normal to the edge [5.17].
    In order to better locate the actual edge, in Chapter 8, we will discuss advanced
    algorithms, which are more effective in locating curved edges through optimization.
    This improves edge detection over simple thresholding of the derivative.


    We will wrap up this chapter by raising yet another issue in edge detection. Suppose
    we wish to ask a question like “is there an edge at orientation \(\theta\) at
    this point?” How might we construct a kernel that is specifically sensitive to
    edges at \(\theta\)? A straightforward approach [5.12] is to construct a weighted
    sum of the two Gaussian first derivative kernels, \(G_x\) and \(G_y\), using a
    weighting something like


    ```

    \(G_\theta = G_x \cos \theta + G_y \sin \theta\) (5.45)

    ```


    Could you calculate that orientation selectivity? What is the smallest angular
    difference you could detect with a \(3 \times 3\) kernel determined in this way?
    However, unless quite large kernels are used, the kernels obtained in this way
    have rather poor orientation selectivity. In the event we wish to differentiate
    across scale, the problem is even worse, since a scale-space representation is
    normally computed rather coarsely, to minimize computation time. Do you have a
    solution? If interested, we recommend the work by Perona [5.27] that provides
    an approach to solving these problems.


    The authors are grateful to Bilge Karacali and Rajeev Ramanath for their assistance
    in producing the images used in this chapter.


