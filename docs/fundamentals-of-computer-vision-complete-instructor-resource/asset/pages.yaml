    and cutting. A merging algorithm starts with the image graph initially containing
    no edges, and then adds edges to produce connected components. When thinking of
    pixels as nodes in the image graph, rather than referring to them as "pixel nodes,"
    "pixel vertices," or other similar terminology, we simply continue to refer to
    them as "pixels."'
