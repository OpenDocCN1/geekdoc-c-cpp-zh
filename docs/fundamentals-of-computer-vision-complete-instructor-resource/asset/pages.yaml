  md: 'We ask that you take the following three equations on faith until you take
    another math course. Any curve, \(\theta(s)\) must satisfy the following three
    equations if the curve is closed:


    ```

    \(\Phi_1(\theta) \equiv \frac{1}{2\pi} \int_0^{2\pi} \theta(s) ds = \pi\)


    \(\Phi_2(\theta) \equiv \int_0^{2\pi} \sin \theta(s) ds = 0\)


    \(\Phi_3(\theta) \equiv \int_0^{2\pi} \cos \theta(s) ds = 0.\)


    (10.86)

    ```


    We begin to think now of the set of closed curves in the plane as being a manifold,
    and begin to use the term “manifold” where we really mean the manifold of closed
    curves in the plane.


    Suppose we have two closed curves \(\alpha(s)\) and \(b(s)\). If we think of them
    as vectors, then by definition they lie on the manifold. Each of those curves
    consists of an infinite number of points, and we can still think of it as an ordered
    list of scalars, a vector. A straight line could be drawn between any two such
    points. Question: is every intermediate point also a closed curve? To find points
    on a straight line between two points¹ is pretty easy, as follows:


    Call the first vector \(A\) and the second vector \(B\). Assuming \(s\) was fairly
    finely sampled, these vectors could have dimensions around a thousand or so. The
    point


    ```

    \(C = \alpha A + (1 - \alpha) B\)


    (10.87)

    ```


    is a point on the straight line (a Euclidean straight line) between \(A\) and
    \(B\) if \(0 \le \alpha \le 1\). So just let \(\alpha\) range from 0 to 1 and
    you will generate intermediate vectors that lie on the straight line between \(A\)
    and \(B\). The lower set of curves in Figure 10.24 illustrates this, and clearly,
    the intermediate points are not closed curves. Given one of these intermediate
    points, say \(\theta\), we need to find the projection of that point onto the
    manifold. Here, “projection” will simply mean finding the point on the manifold
    closest to the point of interest. We approach this by finding a small step in
    the direction of the manifold. Let that step be named \(h(s)\), and we add it
    to \(\theta(s)\) at each value of \(s\).


    ```

    \(\Phi_1(\theta + h) = \frac{1}{2\pi} \int_0^{2\pi} (\theta(s) + h(s)) ds = \Phi_1
    + \frac{1}{2\pi} \int_0^{2\pi} h(s) ds\) (10.88)


    \(\Phi_2(\theta + h) = \int_0^{2\pi} (\cos(\theta(s) + h(s)) ds\) (10.89)


    \(\Phi_3(\theta + h) = \int_0^{2\pi} (\sin(\theta(s) + h(s)) ds.\) (10.90)

    ```


    ¹ Since a vector of dimension \(d\) represents a single point in a \(d\)-dimensional
    space, we use the words vector and point interchangeably here.'
