    # 8.7 Graph Cuts: Segmentation Based on Graph Theory


    In this section, you will discover another reason for knowing the literature in
    graph theory. If one can determine an objective function suitably defined on an
    image graph, then the graph theory literature provides algorithms for optimizing
    this objective function.


    Represent the image by a graph (the *image graph* of Section 4.2.5), in which
    the pixels are the nodes and edges exist between nodes if the pixels are neighbors.
    A weight $w_{ij}$ is assigned to the edge between nodes $i$ and $j$. The weights
    could be scalars that measure how similar the two nodes are. Let $S_1$ and $S_2$
    be two sets of nodes. A *cut* between $S_1$ and $S_2$ is a collection of edges
    that, if removed, would separate the two sets into separate components of the
    graph, that is $S_1 \cap S_2 = \emptyset$.


    The weight of the cut, $cut(S_1, S_2)$ is the sum of the weights of the edges
    that are cut. To find an optimal cut, we might seek to find the cut with minimal
    weight. However, this simple concept won’t work in general without modification
    because it could produce cuts surrounding a single pixel. Instead, some sort of
    normalization is needed.


    Let the entire graph be denoted by $V = S_1 \cup S_2$, with the understanding
    that sets $S_1$ and $S_2$ are disjoint ($S_1 \cap S_2 = \emptyset$). Then a normalized
    cut, can be defined by an objective function


    $N(S_1, S_2) = \frac{cut(S_1, S_2)}{W_1 + cut(S_1, S_2)} + \frac{cut(S_1, S_2)}{W_2
    + cut(S_1, S_2)}$ (8.62)


    where $W_1$ is the sum of all the weights within region $S_1$, $W_1 = \sum w_{ij},
    i \in S_1, j \in S_1$. $W_2$ is similarly defined.


    Now, the problem: finding the optimal normalized cut is in general an NP-complete
    problem. That is, there is no algorithm currently known that can find the optimal
    cut in less than exponential time. There are many approaches to this problem [8.54,
    8.46, 8.36, 8.52].


    To illustrate the idea, we will summarize the approach of Boykov and Funka-Lea
    [8.8]. This method uses graph cuts to find the optimal foreground-background segmentation
    of an image. First, the image graph described in section 4.2.5 is augmented by
    adding two “terminal” nodes, $s$ and $t$. Any pixel will with a connection to
    $s$ will be considered foreground and any pixel with connection to $t$ will be
    considered background. Initially, both connections will be there. The graph is
    augmented to change the set of nodes $V$ to $v = V \cup \{s, t\}$ and the set
    of edges $E = \{(p_i, p_j)\}$ is augmented to become $\xi = E \cup \{(p_i, s),
    (p_i, t)\} \forall i$. A pictorial representation of this augmented graph after
    a cut is given in Figure 8.35. It will be convenient to also define $S$ as the
    set of pixels with an edge to $s$ and $T$ as the set of pixels with an edge to
    $t$. Initially, $S = T$, and the algorithm will cut edges until $S \cap T = \emptyset$.


    # 8.7.1 An Objective Function


    Use of this graph for segmentation requires a complete cut. Such a cut $C$ is
    the set of all edges that are cut, including edges between pixels and edges between
    pixels and terminals. A complete cut must have each pixel be connected to either
    $s$ or $t$, but not to both. The'
