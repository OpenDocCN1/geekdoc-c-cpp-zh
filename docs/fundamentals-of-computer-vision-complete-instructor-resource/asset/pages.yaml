  md: 'where \(\mathbf{h} = [h_1, h_2, \dots, h_2]^T\), and similarly


    \(d\Phi_2 = \langle -\sin(\theta), \mathbf{h} \rangle\)

    \(d\Phi_3 = \langle \cos(\theta), \mathbf{h} \rangle\)


    These three equations can be written as a matrix-vector product, as


    \(d\Phi(\mathbf{h}) = J\mathbf{h}\) (10.94)


    where the Jacobian matrix \(J\) is found by expanding the three inner products:


    \(J = \begin{bmatrix} \frac{1}{2\pi} & \frac{1}{2\pi} & \cdots & \frac{1}{2\pi}
    \\ -\sin(\theta_1) & -\sin(\theta_2) & \cdots & -\sin(\theta_d) \\ -\cos(\theta_1)
    & -\cos(\theta_2) & \cdots & -\cos(\theta_d) \end{bmatrix}.\) (10.95)


    Before we get too lost in the math, let''s remember where we are and what we are
    doing. We are at a point \(\theta\) in the \(d\)-dimensional space. At this point,
    we can evaluate the vector \(\Phi\), and if that is not equal to \([\pi, 0, 0]^T\),
    we are not on the manifold. We take a small step, by adding \(\mathbf{h}\) to
    \(\theta\), (remember, \(\mathbf{h}\) is a vector), and we would like that step
    to take us closer to the manifold; but we don''t know what small step, \(\mathbf{h}\),
    would do that.


    Define the residual, to be the difference between where we want to be and where
    we are, to be \(\mathbf{r}\),


    \(\mathbf{r} = \begin{bmatrix} \pi \\ 0 \\ 0 \end{bmatrix} - \Phi\) (10.96)


    and try to find a value of \(\mathbf{h}\) for which \(J\mathbf{h}\) will be close
    to \(\mathbf{r}\). In addition, we want the smallest \(\mathbf{h}\) that will
    do the job.


    Like we have seen before, simply minimizing \(J\mathbf{h} - \mathbf{r}\) won''t
    work because it can be minimized by useless things like \(\mathbf{h} = 0\). Therefore
    let''s insist on making \(\mathbf{h}\) satisfy \(J\mathbf{h} - \mathbf{r} = 0\),
    and then define a Lagrangian:


    \(L = \frac{1}{2}\mathbf{h}^T\mathbf{h} + \Lambda^T(J\mathbf{h} - \mathbf{r})
    = \frac{1}{2}\mathbf{h}^T\mathbf{h} + \Lambda^T J \mathbf{h} - \Lambda^T \mathbf{r}.\)
    (10.97)


    By minimizing this for \(\mathbf{h}\), we will have a step that will take us at
    least close to the manifold. Differentiate with respect to \(\mathbf{h}\), and
    set to zero:


    \(\mathbf{h} = -J^T \Lambda.\) (10.98)


    Now we have two equations involving \(J\) and \(\mathbf{h}\):


    \(J\mathbf{h} = \mathbf{r}\) (10.99)

    \(\mathbf{h} = -J^T \Lambda.\) (10.100)


    Solving this for \(\mathbf{h}\) looks pretty easy: just use Eq. 10.99 and solve
    it for \(\mathbf{h}\) using the pseudoinverse (recall section 12.6.4) as follows:


    \(J\mathbf{h} = \mathbf{r}\)

    \(J^T J\mathbf{h} = J^T \mathbf{r}\)

    \(\mathbf{h} = (J^T J)^{-1} J^T \mathbf{r}.\)


