    # 10.7.5 Projecting onto the Manifold of Closed Curves


    In this subsection, an illustration of the philosophy, the approach presented
    in [10.18] is followed. We will describe curves as continuous functions and also
    as very long vectors, and we will discuss (as we did earlier) how to go back and
    forth between the representations.


    Two ways present themselves for representing curves.


    **In a function space** A single function, θ(s), where s is the usual arc length
    and θ is the angle the tangent to the curve makes with the x axis.


    **In a discrete vector space** A curve is a list of all the points around the
    curve. In this discrete form, s is uniformly sampled, and so θ(s) denotes the
    operation of traveling a distance Δs in the direction θ. Now instead of a continuous
    function, the curve is a high-dimensionality (e.g., 256 elements, not infinity)
    vector.


    When thinking of a curve as a function, we denote the curve by θ(s), where θ is
    the direction of the tangent at point s.


    When thinking of a curve as a vector, we denote it by a boldface symbol, such
    as θ. Since these vectors have an infinite number of elements (until we quantify
    them), the two representations are really the same.


    We begin by using the continuous form.'
