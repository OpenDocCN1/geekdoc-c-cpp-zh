    # Digresion: The Adjacency Paradox


    In Figure 4.6, the foreground pixels are shown in black and the background in
    white. We have learned about 4-connected and 8-connectedness. Let’s apply what
    we have learned. The foreground in this image is a ring, perhaps a very-low-resolution
    image of a washer. Is this ring closed? That is, can we start at one point and
    walk around the ring without retracing our steps, passing only from one pixel
    to a connected neighbor? (Incidentally, we just defined a property of connectivity
    called a path – see section 4.2.5.) If we can walk all the way around this region
    like that, we say the region is closed. Use 4-connectedness. Is it closed? If
    you said no, good! In a 4-connected system, we cannot get from pixel a to pixel
    b. If it is not closed, it must be open. Right? If it is open, the inside and
    outside must be connected, right? But, using a 4-connected definition, the inside
    and outside are separate regions – a contradiction!


    ![](img/5f95dd954ac63cc68119f6f48ca99e18_60_1.png)


    Figure 4.6 The adjacency paradox.'
