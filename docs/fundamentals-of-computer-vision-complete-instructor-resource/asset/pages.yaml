    Ultimately, the Computer Vision problem is not going to be solved by one program,
    one algorithm, or one set of mathematical collections. Ultimately, its solution
    will depend on the ability to build systems that integrate a collection of specialized
    programs. The jury is still out on how to accomplish this and only a few authors
    have undertaken this formidable task. For example, Grosso and Tistarelli [11.18]
    combine stereopsis and motion. Bilbro and Snyder [11.4] fuse luminance and range
    to improve the quality of the range imagery, and Pankanti and Jain [11.38] fuse
    stereo, shading, and relaxation labeling. Zhu and Yuille [11.53] incorporate the
    MDL approach, including active contours and region growing, into a unified look
    at segmentation.


    We omitted a discussion of Artificial Neural Networks (ANNs) from this book because
    the discipline of ANNs is so wide it simply cannot not fit. The student is strongly
    encouraged to augment his/her understanding in Computer Vision by taking courses
    in Statistical Pattern Recognition (first) and then Artificial Neural Networks.
    There are numerous textbooks discussing use of neural networks for matching applications
    [11.19, 11.17].


    The recent development of Deep Learning has largely advanced the state-of-the-art
    in representation and recognition. In the deep learning network, a set of features
    are automatically derived from the raw inputs as compared to the “engineered”
    features extracted using techniques discussed in Chapter 10 and this chapter.
    Gonzalez and Woods, in their latest edition of the Digital Image Processing book
    [11.15] have a thorough discussion on this matter. The most recent paper by LeCun,
    Bengio, and Hinton, published at the Nature Magazine [11.29] and the most recent
    book by Goodfellow, Bengio and Courville [11.16] are both good starting points
    for studying deep learning.


