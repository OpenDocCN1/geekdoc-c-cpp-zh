    relative to the first camera, still pointing in the same direction. The second
    projection matrix is found by constructing a matrix


    ```

    \(P_2 = K R_2 [I - \mathbf{c}_2].\) (12.13)

    ```


    Since there is no rotation here, \(R_2 = \begin{bmatrix} 1 & 0 & 0 \\ 0 & 1 &
    0 \\ 0 & 0 & 1 \end{bmatrix}\). Substituting into Eq. 12.13,


    ```

    \(P_2 = \begin{bmatrix} 10 & 0 & 0 & 0 \\ 0 & 10 & 0 & 0 \\ 0 & 0 & 1 & 0 \end{bmatrix}
    \begin{bmatrix} 1 & 0 & 0 & -100 \\ 0 & 1 & 0 & 0 \\ 0 & 0 & 1 & 0 \end{bmatrix}\)
    (12.14)

    ```


    and


    ```

    \(P_2 = \begin{bmatrix} 10 & 0 & 0 & -1000 \\ 0 & 10 & 0 & 0 \\ 0 & 0 & 1 & 0
    \end{bmatrix},\) (12.15)

    ```


