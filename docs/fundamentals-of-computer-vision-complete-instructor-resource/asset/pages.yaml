  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_269_0.png)


    Figure 10.22 A boundary with only nine points. The points may be listed as ordered
    pairs, using Cartesian (x, y), or polar (ρ, θ). If the sample points are equally
    spaced in arc length (they are not, in this drawing), following the idea of “go
    one step (of distance 1.0), turn through angle θi, and continue”. Following this
    convention, the list of coordinates is simply a list of the turning angles, scalars.


    As discussed in section 10.2, rotation in 2D is accomplished by multiplying each
    point by a rotation matrix,


    ```

    \(\begin{bmatrix} x''(s) \\ y''(s) \end{bmatrix} = \begin{bmatrix} \cos \theta
    & -\sin \theta \\ \sin \theta & \cos \theta \end{bmatrix} \begin{bmatrix} x(s)
    \\ y(s) \end{bmatrix}\)

    ```


    Rotation matrices like this have the property that their columns are orthonormal
    vectors, and they are referred to as “orthonormal transformations”. We refer to
    the collection of such rotations as the “Special Orthogonal group,” SO(n), where
    n refers to the dimension of the operator. In the cases described in this section,
    we consider n = 2.


    There is another group of possible operations that can be applied to a boundary
    without changing the shape. This involves moving the starting point and is called
    the “re-parameterization group,” D. The re-parameterization group also includes
    the possibility that the parameter may vary in its speed as it moves around the
    curve, but we are going to ignore that possibility here.


    Now we have, for any single shape, an infinity of possible versions, all of which
    are in some sense equivalent. Since we are using the concept of vectors to represent
    each shape, and since the conditions of section 3.2.2 are easily shown to be true,
    we have defined a vector space.


