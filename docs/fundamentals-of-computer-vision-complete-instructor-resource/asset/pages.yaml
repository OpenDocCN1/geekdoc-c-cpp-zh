  md: '**Use the model to match an image** By scanning over the image, find the point
    that is most consistent with the model. That point will be the best match for
    the reference point of this model. This is accomplished by computing


    $A_C(\mathbf{x}) = \frac{1}{Z} \sum_k m(||\mathbf{x} - \mathbf{x}_k||, \mathbf{v}_k)$
    (10.73)


    at every point x, where $\mathbf{v}_k$ is a feature vector describing one point.


    In this book, SKS appears in two forms. In this section, a model is developed
    for contours of regions, and in section 11.15, the same philosophy is used to
    build a descriptor for a local area around an interest point.


    # Modeling Contours with SKS


    We consider a two-dimensional shape characterized by its outline. In fact, since
    the object being recognized is really just a 1D curve embedded in the plane, it
    is really a one-dimensional problem.


    Let a shape be defined by a curve in the plane, $\alpha(s) = [x(s), y(s)]^T$ parameterized
    by arc length, $s$. Then, we construct a function to be used as a shape model:


    $m(\rho, \kappa) = \int_s \delta(\rho - \rho(s))\delta(\kappa - \kappa(s)) ds$
    (10.74)


    where $\rho$ denotes the Euclidean distance from the point $s$ on the curve to
    a special reference point called $\Omega$. $\Omega = [\Omega_x, \Omega_y]^T$ is
    an arbitrary point in the plane. Once chosen, $\Omega$ must be held constant for
    the duration of the model building process.


    $\kappa(s)$ in principal denotes any measurement or vector of measurements of
    the curve at point $s$. Curvature is suggested here, because it is invariant to
    translation and rotation.


    In practice, the delta function is approximated to a Gaussian,


    $\delta(\xi) \approx \frac{1}{\sqrt{2\pi}\sigma} \exp \left( - \frac{\xi^2}{2\sigma^2}
    \right)$ (10.75)


    which will provide additional averaging of noise.


    Thus, a point $a, b$ in the model is a measure of the likelihood that in this
    model, one may find a point that has curvature of $b$ and is a distance $a$ from
    the reference point.


    In order to actually implement the integral of Eq. 10.74, the integral must, of
