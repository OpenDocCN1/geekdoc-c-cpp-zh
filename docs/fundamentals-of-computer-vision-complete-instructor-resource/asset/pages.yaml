  md: '# 3.2.9 Singular Value Decomposition


    While eigendecomposition is restricted to square matrices, SVD can be applied
    to any matrix. SVD decomposes a matrix \(A\) into the product of three matrices:


    ```

    \( A = U D V^T, \)

    (3.29)

    ```


    where \(U\) and \(V\) are orthonormal matrices, and \(D\) is diagonal with values
    on the diagonal sorted from largest to smallest.


    To understand what this means, suppose you had a machine that could compute a
    matrix decomposition just as described in Eq. 3.29, and consider using it to decompose
    \(A\). Now, since \(A = U D V^T\), we know that \(A^T = V D U^T\). Multiplying
    \(A\) on the right by \(A^T\) produces \(A A^T = U D V^T V D U^T\), but since
    \(V\) is orthonormal, \(V^T V = I\), and \(A A^T\) may be written as


    ```

    \( A A^T = U D^2 U^T, \)

    (3.30)

    ```


    and the columns of \(U\) (see Eq. 3.27) will be the eigenvectors of \(A A^T\).
    Similarly, one can show that the columns of \(V\) will be the eigenvectors of
    \(A^T A\). \(D\) will be a diagonal matrix with the square root of the eigenvalues
    of \(A^T A\) on the diagonal sorted in descending order.8


    The diagonal elements of \(D\) are referred to as the singular values of \(A\),
    so the singular values of \(A\) are the square roots of the eigenvalues of \(A
    A^T\).


    This observation tells us one way to compute the SVD: use eigendecomposition.
    But more important: eigendecomposition can only be applied to square matrices,
    and both \(A A^T\) and \(A^T A\) are square, for ANY matrix \(A\).


    Now suppose our problem is to find the null space of a \(3 \times 3\) matrix that
    is of rank 2, just like the problem in section 3.2.3. Using the same original
    matrix, we compute


    ```

    \( A A^T = \begin{bmatrix} 77 & 32 & 64 \\ 32 & 14 & 28 \\ 64 & 28 & 56 \end{bmatrix}
    , \quad A^T A = \begin{bmatrix} 21 & 30 & 39 \\ 30 & 45 & 60 \\ 39 & 60 & 81 \end{bmatrix}
    . \)

    (3.31)

    ```


    Decomposing \(A A^T\) using eigendecomposition, we find


    ```

    \( A A^T = \begin{bmatrix} 0.7242 & -0.6896 & -0.0000 \\ 0.3084 & 0.3239 & 0.8944
    \\ 0.6168 & 0.6477 & -0.4472 \end{bmatrix} \begin{bmatrix} 145.1397 & 0 & 0 \\
    0 & 1.8603 & 0 \\ 0 & 0 & -0.0000 \end{bmatrix} \times \begin{bmatrix} 0.7242
    & 0.3084 & 0.6168 \\ -0.6896 & 0.3239 & 0.6477 \\ -0.0000 & 0.8944 & -0.4472 \end{bmatrix}
    . \)

    (3.32)

    ```


    8 All numerical packages that compute SVD do this type of sorting'
