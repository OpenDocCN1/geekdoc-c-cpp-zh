    # On the Direction of the Arguments: Convolution and Correlation


    Let''s restate two important equations: First the equation for a kernel operator,
    recopied from Eq. 5.2, and then the equation for two-dimensional, discrete convolution.²


    ```

    g(x, y) = \sum_\alpha \sum_\beta f(x + \alpha, y + \beta)h(\alpha, \beta) (5.4)

    ```


    ```

    g(x, y) = \sum_\alpha \sum_\beta f(x - \alpha, y - \beta)h(\alpha, \beta) (5.5)

    ```


    The observant student will have noticed a discrepancy in order between the two
    equations above. In formal convolution, as given by the lower equation, the arguments
    reverse: the right-most pixel of the kernel (e.g., h_1 in Figure 5.1) is multiplied
    by the left-most pixel in the corresponding region of the image (e.g., f_1 in
    Figure 5.1). However, in the upper equation, we think of "placing" the kernel
    down over the image and multiplying corresponding pixels. If we multiply corresponding
    pixels, left-left and right-right, we have correlation, and this is usually what
    is meant by a _kernel operator_. There is, unfortunately, a misnomer in much of
    the literature – both are sometimes called "convolution". We advise the student
    to watch for this. In many publications, the term "convolution" is used when "sum
    of products" is meant. In order to avoid confusion, in this book, we will usually
    avoid the use of the word "convolution" unless we really do mean the application
    of the lower equation, and instead use the term "kernel operator", or "correlation",
    when that is what we mean. Note that if the kernel is symmetric (e.g., [1 2 1]),
    correlation and convolution give the same result.


