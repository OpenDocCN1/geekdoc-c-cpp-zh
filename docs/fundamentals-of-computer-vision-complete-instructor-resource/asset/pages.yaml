  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_322_0.png)


    Figure 12.2 y is the height on the focal plane, and f is the distance from the
    focal plane to the focal point. Y is the height of the object being photographed,
    and Z is the distance from the camera.


    the focal plane is the principal axis, and the principal axis intersects the focal
    plane at the principal point, which is usually chosen as the origin of the 2D
    camera coordinate system. This distance from the focal point to the principal
    point is the focal length, f.


    The point where the ray from X to O intersects the imaging plane has coordinates
    x = [x y 1], which may be determined by knowing the focal length, f, and X, by
    using similar triangles. (See Figure 12.2). In that image, we note that


    ```

    \frac{y}{f} = \frac{Y}{Z} \Rightarrow y = f\frac{Y}{Z} \text{ and } \frac{x}{f}
    = \frac{X}{Z} \Rightarrow x = f\frac{X}{Z} \tag{12.2} \tag{12.3}

    ```


    We have already mentioned that in homogeneous coordinates, \(\begin{bmatrix} \alpha
    x \\ \alpha y \\ \alpha \end{bmatrix} = \begin{bmatrix} x \\ y \\ 1 \end{bmatrix}\).
    We can now define a matrix that relates 2D to 3D, using


    ```

    \begin{bmatrix} x \\ y \\ 1 \end{bmatrix} = \begin{bmatrix} fX/Z \\ fY/Z \\ 1
    \end{bmatrix} = \begin{bmatrix} fX \\ fY \\ Z \end{bmatrix} = \begin{bmatrix}
    f & 0 & 0 & 0 \\ 0 & f & 0 & 0 \\ 0 & 0 & 1 & 0 \end{bmatrix} \begin{bmatrix}
    X \\ Y \\ Z \\ 1 \end{bmatrix} \tag{12.4}

    ```


    Since we are using homogeneous coordinates, the vector \([fX \ fY \ Z]^T\) may
    be divided by its third element to find the “real” coordinates on the image plane
    where the 3-space point is projected, \(\mathbf{x} = [fX/Z \ fY/Z \ 1]^T\). This
    leads to a simple linear relationship between points in the image and points in
