    model of the projective camera, a point in space with coordinates (X, Y, Z) is
    projected onto a point on the image plane with coordinates (x, y). The camera
    origin, in turn, is related to the world origin by the projection matrix, which
    describes the camera, the position of the camera, and the direction of the camera.


    a four-dimensional space of which conventional 3-space is a subspace. A point
    in 3-space relates to its corresponding point in projective 4-space by (for some
    scalar w)


    ```

    \begin{bmatrix} X \\ Y \\ Z \\ \end{bmatrix} \Leftrightarrow \begin{bmatrix} Xw
    \\ Yw \\ Zw \\ w \\ \end{bmatrix} .

    ```


    The mapping from 3- to 4-space is one-many, but two cases are especially interesting:
    If w = 1 we have the particularly simple case where the first three elements of
    the projective space representation are equal to the Euclidean representation.
    The other especially interesting case is the (infinite) set of points where w
    = 0. These are called “points at infinity.” One of the powers of the projective
    representation is the fact that infinitely-distant points may be conveniently
    represented. The use of a 3-vector augmented by a 1 is often referred to by the
    term “homogeneous coordinates,” as we saw in Chapter 10.


    # 12.2.2 The Projective Camera


    Most cameras can be modelled with a fairly simple model, the “projective camera,”
    which is illustrated in Figure 12.1. Some particular point in the world, X = [X
    Y Z 1]ᵀ, is projected onto the focal plane¹ by rays that pass through the imaging
    plane, and meet at the camera center, O, also referred to as the focal point.
    The ray from the focal point perpendicular to


    ¹ We will often refer to the focal plane as the imaging plane.'
