- pgno: 215
  md: '# # 9 Parametric Transforms


    > > Supposing I was on the other side of the glass, wouldn''t the orange still
    be in my right hand?

    > > - Lewis Carroll


    # ## 9.1 Introduction


    Suppose you are tasked with the problem of finding the straight lines in the image
    shown in Figure 9.1. If only one straight line were present in the image, straight
    line fitting could be used to determine the parameters of the curve. But there
    are two straight line segments here. If we could segment this image first, then
    we could fit each segment separately – yes, this is a segmentation problem, of
    a sort.


    Another approach to the solution of the problem of inferring large-scale properties
    from local measurements is the use of parametric transformations. In this approach,
    we assume that the object for which we are searching in the image may be described
    by a mathematical expression, which in turn is represented by a set of parameters.
    For example, a straight line may be written in slope-intercept form:


    ```

    y = ax + b, (9.1)

    ```


    where a and b are the parameters describing the line and relating the variables
    x and y. Our approach is as follows: given a set of points (or other features),
    all of which satisfy the same equation, we will find the parameters of that equation.
    In a sense, this is the same as fitting a curve to a set of points, but as we
    will discover, the parametric transform approach allows us to find multiple curves,
    without knowing a priori which point belongs to which curve. That is, parametric
    transforms reverse the roles of variables and parameters.


    In this chapter, we begin this study by considering the special cases of finding
    straight lines, circles, and ellipses. We then extend the discussion to finding
    arbitrary shapes:


    +   - (Section 9.2) The first such technique, the Hough transform, identifies
    separate straight lines in images. This section also discusses the computational
    complexity issue of this approach. Parametric transforms can take considerable
    time because, for every point of interest, a function must be plotted. However,
    it is possible to speed up this process by making use of image information such
    as image gradients. That is, we can trade off computation in image space for computation
    in parameter space.


    +   - (Section 9.3) The search for circles in noisy images allows us to discover
    that functions with more than two parameters can be handled in a variety of ways,
    including simply increasing the dimensionality of the problem.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_216_0.png)


    Figure 9.1 An image that is the output from an edge detector. The human can immediately
    discern that this boundary consists of two straight segments. Library name: work.png


    +   - (Section 9.4) An ellipse in arbitrary orientation has six parameters, and
    following the simple parametric transform philosophy would require a six-dimensional
    search space. However, this section illustrates how to use geometric relationships
    to find ellipses using a much smaller search space.

    +   - (Section 9.5) The Generalized Hough Transform illustrates methods for using
    the philosophy of this section to recognize shapes that are not parameterizable.

    +   - (Section 9.6) All the methods in this chapter make use of locating peaks
    in a transform space. It isn’t sufficient to just identify local maxima. This
    section addresses how to find those peaks reliably.


    At the end of this chapter, we also discuss how to find 3D shapes in range images
    (section 9.7) and correspondences in stereopsis (section 9.8) using parametric
    transform-based techniques.


    # 9.2 The Hough Transform


    First, let us prove an illustrative theorem.


    Definition: Given a point in R^d, and a parameterized expression defining a curve
    in that space, the parametric transform of that point is the curve that results
    from treating the point as a constant and the parameters as variables.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_217_0.png)


    **Figure 9.2** The intersection of two curves in the parameter space.


    For example, the parametric transform of Eq. 9.1 produces


    ```

    b = y - xa

    ```


    which is itself a straight line in the 2-space < a, b >. Given the point x = 3,
    y = 5, then the parametric transform is the line in the < a, b > space, b = 5
    - 3a .


    **Theorem:** If n points in a 2-space are colinear, all the parametric transforms
    corresponding to those points, using the form b = y - xa, intersect at a common
    point in the space < a, b >.


    _Proof._ Suppose n points {(x1, y1), (x2, y2), ... (xn, yn)} all satisfy the same
    equation


    ```

    y = a_0 x + b_0

    ```


    Consider two of those points, (xi, yi) and (xj, yj). The parametric transforms
    of the points are the curves (which happen to be straight lines)


    ```

    b = yi - xi a

    b = yj - xj a

    ```


    The intersection of those two curves in a, b is illustrated in Figure 9.2. Solving
    the two equations of Eq. 9.4 simultaneously results in


    ```

    yj - yi = (xj - xi)a

    ```


    and therefore a = (yj - yi) / (xj - xi) as long as xj != xi. We substitute a into
    Eq. 9.4 to find b,


    ```

    b = yi - xi (yj - yi) / (xj - xi)

    ```


    and we have the a and b values where the two curves intersect. However, we also
    know from Eq. 9.3 that all the x''s and y''s satisfy the same curve. By substituting
    Eq. 9.3 into Eq. 9.6, we obtain


    ```

    b = (a0 xi + b0) - xi ((a0 xj + b0) - (a0 xi + b0)) / (xj - xi)

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_218_0.png)


    Figure 9.3 In the \(\rho, \theta\) representation of a line, \(\rho\) is the perpendicular
    distance of the line from the origin, and \(\theta\) is the angle made with the
    x axis. Note that if the line represents a brightness edge, at any point along
    the line, the direction of the gradient is normal to the line.


    which simplifies to


    \(b = (a_0 x_i + b_0) - x_i a_0 = b_0.\) (9.8)


    Similarly,


    \(a = \frac{y_j - y_i}{x_j - x_i} = \frac{(a_0 x_j + b_0) - (a_0 x_i + b_0)}{x_j
    - x_i} = a_0.\) (9.9)


    Thus, for any two points along the straight line parameterized by \(a_0\) and
    \(b_0\), their parametric transforms intersect at the point \(a = a_0\), and \(b
    = b_0\). Since the transforms of any two points intersect at that one point, all
    such transforms intersect at that common point. QED.


    Review of concept: Each POINT in the image produces a CURVE (possibly straight)
    in the parameter space. If the points all lie on a straight line in the image,
    the corresponding curves will intersect at a common point in the parameter space.
    Got that? Now, on to the next problem.


    # 9.2.1 The Problem with Vertical Lines


    What about vertical lines? Then the parameter \(a\) goes to infinity. This is
    not good. Perhaps we need a new form for the equation of a straight line. Here
    is a good one:


    \(\rho = x \cos \theta + y \sin \theta.\) (9.10)


    Pick a value of \(\rho\) and \(\theta\), and then the set of points \(\{(x_i,
    y_i)\}\) that satisfy Eq. 9.10 can be shown to be a straight line. There is a
    geometric interpretation of this equation that is illustrated in Figure 9.3.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_219_0.png)


    Figure 9.4 Three lines plotted through an accumulator array. The lines themselves
    are illustrated. Each accumulator is incremented whenever a line passes through
    that accumulator. Note that the vertical axis is \(\rho\) and the horizontal axis
    is \(\theta\).


    This representation of a straight line has a number of advantages. Unlike the
    use of the slope, both of these parameters are bounded: \(\rho\) can be no larger
    than the largest diagonal of the image, and \(\theta\) need be no larger than
    \(2\pi\). A line at any angle may be represented without singularity.


    The use of this parameterization of a straight line solves one of the problems
    that confronts us, the possibility of infinite slopes. The other problem is the
    calculation of intersections.


    # 9.2.2 How to Find Intersections – Accumulator Arrays


    In the parameter space, it is not feasible to find all intersections of all curves
    and then to determine which of those are close together. Instead, we make use
    of the concept of an _accumulator array_. To create an accumulator array, we make
    an image, say 360 columns by 512 rows. We initialize each of the array elements
    to zero. It is often convenient to think of this array as an image, and from now
    on, we will refer to the elements of this special image as accumulators. Figure
    9.4 illustrates plotting three straight lines through a very small accumulator
    array using the following algorithm:


    ```

    For each point \((x_i, y_i)\) in the edge image,

    1. for all values of \(\theta\) compute \(\rho\).

    2. at the point \(\rho, \theta\) in the accumulator array, increase the value
    at that point by 1.

    ```


    This algorithm results in multiple increments of those accumulators corresponding
    to intersections being increased more often. Thus the peaks in the accumulator
    array correspond to multiple intersections, and hence to proper parameter choices.
    Figure 9.5 illustrates an image with two straight edges and the corresponding
    Hough transform where the brightness of each pixel is the value of an accumulator.
    To understand why there are four intersections for two lines, consider that when
    one starts calculating \(\rho\) while varying \(\theta\), one will find points
    with negative \(\rho\). Rather than testing negative values and reflecting, it
    is faster to simply allow \(\rho\) to be negative; which makes the accumulator
    twice as big. With the larger range, including \(0 \rightarrow 350^\circ\) and
