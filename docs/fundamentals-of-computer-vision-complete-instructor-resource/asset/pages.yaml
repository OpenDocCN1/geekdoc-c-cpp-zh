    You will observe that usually (for all practical purposes) one of the images is
    “small” compared to the other. That is, in the example above,


    #A >> #B . (7.5)


    When this is the case, we refer to the smaller image B, as the structuring element
    (s.e.). Observe that all images (whether data images or structuring elements)
    are based on coordinate systems, and coordinates can go positive or negative.
    The special pixel located at (0,0) is referred to as the origin.


    We will frequently use structuring elements, and will often make use of the origin.
    All the points in an s.e. are relative to some origin, but it is important to
    note that the origin is not necessarily in the s.e. For example, consider the
    s.e. {(1,0),(0,1),(-1,0),(0,-1)} that has four points, none of which are (0,0).


    Figure 7.1 illustrates a binary image, its dilation, and its erosion using the
    following structuring element:


