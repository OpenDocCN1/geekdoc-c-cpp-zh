    trick, of course, is how to find the optimal such cut. Two issues must be resolved:
    first, “what does optimal mean here?” and second, “how do we find the best such
    cut?”


    An objective function will be proposed below, following [8.8]. For this, we define
    a set of costs, penalties for bad decisions. We then seek to make good decisions
    by minimizing the total cost.


    The objective function first codifies what we know about the two regions, s and
    t, (object and background). Presuming we have some information about object pixels
    and background pixels, we could describe what we know about a pixel assuming one
    of those two choices by using conditional probabilities. That is, we could use
    the probability that pixel p has brightness f_p given that it belongs to foreground,
    Pr(f_p | foreground) and similarly Pr(f_p | background). We must modify this objective
    slightly, since we are seeking a minimum at the best choice, and the probability
    has a maximum at the best choice, so we might try a negative log-likelihood, such
    as


    ```

    R_p(foreground) = -ln Pr(f_p | foreground)

    R_p(background) = -ln Pr(f_p | background).

    ```


    In addition to how well each pixel matches its assigned region, the objective
    function must also codify the differences between pixels. Define B(p, q) to be
    the cost of making an error in deciding to cut (or not cut) an edge. If there
    is a strong brightness difference between those two pixels, and we choose to not
    cut, the penalty should be high.


    Similarly, a high penalty should result if the two have similar brightnesses but
    we choose to cut. One representation of similarity would be our familiar function:


    ```

    B(p, q) = exp \left( - \frac{(f_p - f_q)^2}{2\sigma^2} \right),

    ```'
