  md: 'In the second case, our approach might be to figure out some scalar function
    that will be minimal if the conditions are what we are seeking. For example, suppose
    we chose an objective function something like


    ```

    H(C) = \int_{inside(C)} |f(x, y) - \hat{f}| dx dy + \int_{outside(C)} |f(x, y)
    - \tilde{f}| dx dy \quad (3.37)

    ```


    where C is the (unknown) contour, \(\hat{f}\) is the average brightness inside
    the contour, and \(\tilde{f}\) is the average brightness outside the contour.
    Finding the C that minimizes this objective function would certainly divide the
    image into the inside and outside nicely. Of course, we don''t know C, \(\hat{f}\),
    or \(\tilde{f}\). So we just created a new problem: given the objective function,
    how do we minimize it?


    In the next subsection we illustrate some simple, general methods to begin to
    think about function minimization. The topic of function minimization will come
    up again in section 6.5.1, where minimization will be used to smooth an image
    while preserving sharp edges; in section 5.4.2, where minimization will find good
    ways to detect edges; and in section 10.3.2, where it will be used to fit lines,
    just to mention a few.


    # 3.3.1 Gradient Descent


    The most straightforward way to minimize a function\(^{11}\) is to set its derivative
    to zero:


    ```

    \nabla H(\mathbf{x}) = 0, \quad (3.38)

    ```


    where \(\nabla\) is the gradient operator. Eq. 3.38 results in a set of equations,
    one for each element of \(\mathbf{x}\), which must be solved simultaneously.


    ```

    \begin{cases} \frac{\partial}{\partial x_1} H(\mathbf{x}) = 0 \\ \frac{\partial}{\partial
    x_2} H(\mathbf{x}) = 0 \\ \vdots \\ \frac{\partial}{\partial x_d} H(\mathbf{x})
    = 0. \end{cases} \quad (3.39)

    ```


    Such an approach is practical only if the system of Eq. 3.39 is solvable. This
    may be true if \(d=1\), or if \(H\) is at most quadratic in \(\mathbf{x}\).


    **Exercise 3.1.** Find the vector \(\mathbf{x} = [x_1, x_2, x_3]^\text{T}\) that
    minimizes


    ```

    H = a x_1^2 + b x_1 + c x_2^2 + d x_3^2

    ```


    where \(a, b, c,\) and \(d,\) are known constants.'
