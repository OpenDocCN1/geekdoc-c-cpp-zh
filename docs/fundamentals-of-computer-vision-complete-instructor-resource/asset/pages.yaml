  md: 'It is common to define a submatrix of the projection matrix as one that involves
    only properties of the camera, and to call it the *camera calibration matrix*,
    K.


    ```

    \(\mathbf{K} = \left[ \begin{array}{ c c c } f & 0 & d_x \\ 0 & f & d_y \\ 0 &
    0 & 1 \end{array} \right] .\) (12.7)

    ```


    It is important to emphasize that \(d_x\) and \(d_y\) only refer to the location
    of the image origin relative to the principal point.\(^2\) They are not the \(x-y\)
    coordinates of the camera in space. Therefore K only characterizes properties
    of the camera itself, not where it is located or which way it is pointing. Therefore
    the elements of K are often referred to as *intrinsic parameters*. The definition
    of K also allows us to write Eq. 12.5 in a different way:


    ```

    \(\mathbf{x} = \mathbf{K}[\mathbf{I} | \mathbf{0}]\mathbf{X} .\) (12.8)

    ```


    Using this notation, K is a 3 x 3 matrix. \([I | 0]\) is a single 3 x 4 matrix
    composed of a matrix, \(I\), and a vector \(\mathbf{0}\). \(I\) is the 3 x 3 identity
    matrix, and \(\mathbf{0}\) is a 3 x 1 vector of all zeros, producing a 3 x 4 matrix.
    We say that the 3 x 4 matrix is produced by *concatenating* \(I\) and \(\mathbf{0}\).


    # 12.2.3 Coordinate systems


    Look at Figure 12.1. Imagine you are standing on the Z axis in front of the camera,
    looking at the camera. From that perspective, the X axis goes off to your right,
    as does the x axis. The y axis goes up, and the Z axis goes right through you
    (not very comfortable is it?). Curl the fingers of your right hand from the X
    axis to the Y axis. Notice that your right thumb points in the direction of the
    Z axis, and you recognize that this is a right-hand coordinate system. If you
    were to walk behind the camera and look at these coordinates, you would see the
    X going off to your left, but these would STILL be the correct coordinates. Don''t
    be confused by thinking you are standing behind the camera.


    # Moving the Camera


    The matrix \(\mathbf{P} = \mathbf{K}[\mathbf{I} | \mathbf{0}]\) tells how to relate
    a point in space to a point on the focal plane of a camera *at the origin*. But
    suppose the camera moves? Suppose it both rotates in 3-space and its origin is
    translated. We can include that information in the projection matrix.


    Before we can derive the modified projection matrix, we need to understand the
    issues concerning rotation of a camera. Figure 12.3 illustrates rotation of a
    camera about Y so the X - Z plane is shown. In that figure, no translation is
    shown. The coordinate system \(\psi_1 = [X_1, Y_1, Z_1]^T\) is the original coordinate
    frame, and that system/camera is then rotated to create a second system \(\psi_2
    = [X_2, Y_2, Z_2]^T\). Of course, you can''t see the Y axis in that figure because
    it goes into the paper.


    In Figure 12.3, the camera has been clearly rotated, and about the Y axis. But
    in which way?


    \(^2\) Remember: Right now, the origin of the camera and the origin of the world
    are the same. This is called *central projection*. That is about to change.'
