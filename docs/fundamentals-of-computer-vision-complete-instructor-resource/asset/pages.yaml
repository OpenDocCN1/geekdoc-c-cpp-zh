    # 11.3.2 The SIFT Interest Operator


    The Scale Invariant Feature Transform (SIFT) is one of the best-known and most
    highly cited algorithms in the Computer Vision literature. Two versions of it
    exist. [11.31, 11.32]; the second is described here:


    The interest operator used in SIFT bears many similarities to the Harris-Laplace,
    and it also operates over a Gaussian scale space. There are, however, some important
    differences, but before we can explore those, we need to take a closer look at
    scale space.


    When the derivative of a Gaussian convolution is used to find edges in an image,
    the user must recognize that the form of the Gaussian involves a variable, \(\sigma\),
    which affects the performance of the algorithm. For example, consider Figure 11.4
    that illustrates the same image viewed at two different scales. In order to find
    edges of objects at different scales, the scale, \(\sigma\), of the edge finder
    must be appropriate.


    A scale space could be used. The scale space used in SIFT [11.31], is a compromise
    between a pyramid and a block scale space (such as the one illustrated in Figure
    5.13). This new configuration uses the concept of an *octave*, a set of images
    with different scales, but the same size, over which the scale doubles. Once the
    scale is doubled, the original image is subsampled, 2:1 in each direction, an
    operation equivalent to doubling the scale, and another octave is computed at
    this reduced size. This is illustrated in Figure 11.5. The advantage of this approach
    is computational efficiency. That is, after subsampling, processing the next octave
    takes only 1/4 the time. In the example of Figure 11.5, the octave contains images
    blurred with scales of 0.707, 1.0, 1.414. 2.0, and 2.83. Thus we have one octave,
    with scales varying from 1 to 2, plus an image with lower scale, and one with
    higher scale. These extra images are needed because they will be used in computing
    the Difference of Gaussians scale space.'
