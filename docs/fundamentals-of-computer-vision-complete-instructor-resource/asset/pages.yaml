- pgno: 368
  md: '# Appendix A Support Vector Machines


    In Chapter 1 of this book, we distinguished between *Pattern Recognition* and
    *Computer Vision*. Computer Vision systems make measurements on images, and Pattern
    Recognition systems accept measurements as inputs and make decisions.


    There is a problem with these definitions. At the time of publication of this
    book, many Computer Vision experts are working on the problem of *Object Recognition*,
    assigning a label to an object (e.g., bicycle or car) in a scene that is cluttered
    with other objects and background. Making such a decision is clearly a pattern
    recognition problem, but most research in this area is published in the Computer
    Vision literature.


    Support Vector Machines (SVMs) are systems that accept a set of measurements from
    two classes, $I_1 = \{x_1 \ x_{12} \ ...\}$ and $I_2 = \{x_1 \ x_{22} \ ...\}$.
    Having gained information from those two sets, then given an unknown x, the SVM
    can decide whether x belongs to class 1 or class 2. Such a machine is clearly
    a pattern classifier, and their operation is also taught in pattern recognition
    books.


    Nevertheless, the SVM is often used in solving computer vision problems like object
    recognition, and the inputs are usually measurements from image feature measurement
    systems like HoG''s (see section 11.6). You, the student reading this book, are
    likely to meet people who are working on state-of-the-art systems (or at least
    reading about them). Since you should know at least a bit about these systems,
    we will introduce you to the basic concepts.


    Support Vector Machines are pattern classifiers based on the concept of minimizing
    structural risk, which were first introduced by Vapnik [A.7]. They provide performance
    superior to most other pattern classification methods when the classification
    problem is to distinguish between two classes.


    # A.1 Derivation of the Support Vector Machine


    Assume the problem may be described by asking to which of two classes an unknown
    vector belongs, and suppose two training sets are provided, each consisting of
    examples from one of the classes. Further assume the two classes are separable
    by a linear hypersurface.


    The feature space is to be divided by a hyperplane into two regions, in which
    the examples of the training sets are separated. Define the distance from the
    closest point in class 1 to the hyperplane as $d_1$. Similarly let $d_2$ be the
    distance from the closest point in class 2 to the hyperplane. The *margin* is
    defined as $d_1 + d_2$. Instead of accepting any hyperplane that divides the region
    space, we seek the hyperplane that maximizes the margin.'
