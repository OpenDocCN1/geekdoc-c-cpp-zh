    You can probably see the blur in the zoomed image, resulting from the smaller
    image (lower scale being interpolated to a larger image). Thus, we see a relationship
    between blur and scale. In scale space, as we will discuss in section 5.6, zooming
    in produces a smaller viewing area, with more detail – smaller scale, whereas
    zooming out produces a larger viewing area, but individual image features consist
    of fewer pixels, effectively blurred – larger scale. So one meaning of “scale”
    is the degree of blur, and a second is the relative size of the feature. Several
    additional details of this simple idea will come up later in this book.


    # 5.5 Edge Detection


    Edges are areas in the image where the brightness changes suddenly; where the
    derivative (or more correctly, some derivative) has a large magnitude. A common
    way to find edges is to start by applying the derivative kernels on the image.
    We can categorize edges as step, roof, or ramp [5.19], as illustrated in Figure
    5.9.


    We have already seen (twice) how application of a kernel such as that of Eq. 5.10
    approximates the partial derivative with respect to x. Similarly, the kernels
    of Eq. 5.30 estimate \(\frac{\partial f}{\partial y}\). Depending on which direction
    you have chosen as positive y, you may select the left kernel (positive y is pointing
    down) or the right kernel (positive y is pointing up).


    \(h_y = \frac{1}{6} \begin{bmatrix} -1 & -1 & -1 \\ 0 & 0 & 0 \\ 1 & 1 & 1 \end{bmatrix}
    \text{ or } \frac{1}{6} \begin{bmatrix} 1 & 1 & 1 \\ 0 & 0 & 0 \\ -1 & -1 & -1
    \end{bmatrix} \quad (5.30)\)'
