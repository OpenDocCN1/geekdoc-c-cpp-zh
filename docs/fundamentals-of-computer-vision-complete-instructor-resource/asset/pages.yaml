  md: '# 10.7.1 A Shape in Two Dimensions


    A shape may be thought of as a property of the boundary of a region in an image.
    For that reason, we will often interchangeably use the words "contour," "boundary,"
    and "curve." A shape in 2D can be considered a vector-valued function of arc length,
    s. Thus, in the familiar Cartesian coordinates, a curve in the plane may be written
    as the vector function \(\alpha(s) = \begin{bmatrix} x(s) \\ y(s) \end{bmatrix}\)
    where \(0 \le s < 2\pi\). Limiting s to lie between 0 and a constant value such
    as \(2\pi\) forces the perimeter of any shape to be the same, thus providing invariance
    to scale changes. The concepts we are about to introduce are not restricted to
    curves in the plane, as we can easily write \(\alpha(s) = [x(s) \ y(s) \ z(s)]^T\),
    for a curve in 3-space (think of a straightened coathanger).


    Using s as the parameter of the curve is convenient because at every point, the
    first derivative of \(\alpha\) is the tangent to the curve at that point.


    ```

    \( T = \frac{d\alpha}{ds}, \quad (10.78) \)

    ```


    and the second derivative is the normal, which is normally\(^{10}\) defined as
    a unit vector:


    ```

    \( N = \frac{\frac{dT}{ds}}{||\frac{dT}{ds}||}, \quad (10.79) \)

    ```


    Finally, the cross product of those two is the binormal,


    ```

    \( B = T \times N. \quad (10.80) \)

    ```


    Since all three vectors, Tangent, Normal, and Binormal, are mutually orthogonal,
    they define a particular coordinate frame, the Frenet frame. The three vectors
    and their derivatives are also related proportionally, by


    ```

    \(\frac{dT}{ds} = \kappa N \quad (10.81)\)

    ```


    ```

    \(\frac{dN}{ds} = -\kappa T + \tau B \quad (10.82)\)

    ```


    ```

    \(\frac{dB}{ds} = -\tau N. \quad (10.83)\)

    ```


    where \(\kappa\) is the curvature (yes, this is the same curvature we referred
    to earlier), and \(\tau\) is the torsion. You can think of the torsion as the
    twisting of the Frenet frame when it follows a nonplanar curve.


    Other representations for curves may also be used: For example, as we discussed
    in section 10.4.4, instead of an ordered list of coordinate pairs, we could consider
    each point as a complex number, \(x + iy\), which allows us to think of the points
    as scalars. Or, we could consider the direction of the tangent - the angle the
    tangent makes with the \(x\) axis, or the direction the normal makes. The tangent
    angle, \(\theta_h(s)\) is particularly convenient, and is used


    10 Yes, that pun is deliberate.'
