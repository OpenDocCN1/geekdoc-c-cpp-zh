- pgno: 83
  md: '# 5.5.1 The Canny Edge Detector


    As you may have guessed, there are approaches to finding edges in images other
    than simply thresholding a derivative. We want to know the location of the edge
    more precisely than simple gradient thresholds reveal. Tagare and deFigueiredo
    [5.28] (see also [5.2]) generalize the process of edge detection as


    +   1. The input is convolved with a filter that smoothly differentiates the input
    and produces high values at and near the location of the edge. The output g(x)
    is the sum of the differentiated step edge and noise.

    +   2. A decision mechanism isolates regions where the output of the filter is
    significantly higher than that due to noise.

    +   3. A mechanism identifies the zero crossing in the derivative of g(x) in the
    isolated region and declares it to be the location of the edge.


    Two methods that have acquired a substantial reputation in this area are the so
    called “Canny edge detector” [5.6] and the “facet model” [5.11]. Here, we only
    describe the Canny edge detector.


    This edge detection algorithm begins with finding estimates of the gradient magnitude
    at each point. Canny uses 2 × 2 rather than 3 × 3 kernels as we have used, but
    it does not affect the philosophy of the approach. Once we have estimates of the
    two partial derivatives, we use Eqs. 5.33 and 5.34 to calculate the magnitude
    and direction of the gradient, producing two images, M(x, y) and Θ(x, y). We now
    have a result that easily identifies the pixels where the magnitude of the gradient
    is large. That is not sufficient, however, as we now need to thin the magnitude
    array, leaving only points that are maxima, creating a new image N(x, y). This
    process is called nonmaxima suppression (NMS).


    NMS may be accomplished in a number of ways. The essential idea, however, is as
    follows. First, initialize N(x, y) to M(x, y). Then, at each point, (x, y), look
    one pixel in the direction of the gradient and one pixel in the reverse direction.
    If M(x, y) (the point in question) is not the maximum of these three, set its
    value in N(x, y) to zero. Otherwise, the value of N is unchanged.


    After NMS, we have edges that are properly located and are only one pixel wide.
    These new edges, however, still suffer from the problems we identified earlier
    – extra edge points due to noise (false hits) and missing edge points due either
    to blur or to noise (false misses). Some improvement can be gained by using a
    dual-threshold approach. Two thresholds are used, τ1 and τ2, where τ2 is significantly
    larger than τ1. Application of these two different thresholds to N(x, y) produces
    two binary edge images, denoted T1 and T2, respectively. Since T1 was created
    using a lower threshold, it will contain more false hits than T2. Points in T2
    are therefore considered to be parts of true edges. Connected points in T2 are
    copied to the output edge image. When the end of an edge is found, points are
    sought in T1 that could be continuations of the edge. The continuation is extended
    until it connects with another T2 edge point, or no connected T1 points are found.


    6 This is sometimes written using the plural, nonmaxima suppression. The expression
    is ambiguous. It could be a suppression of every point that is not a maximum,
    or suppression of all points that are not maxima. We choose to use the singular.'
