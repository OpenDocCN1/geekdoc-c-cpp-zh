- pgno: 356
  md: '# Fitting the Quadric


    We begin with a version of the quadric equation that has been normalized by dividing
    by the constant term:


    $ax^2 + by^2 + cz^2 + fyz + gzx + hxy + px + qy + rz + 1 = 0.$ (12.98)


    For some particular point $(x_i, y_i, z_i)$ define the vectors:


    $\mathbf{x}_i = \begin{bmatrix} x_i^2 \\ y_i^2 \\ z_i^2 \\ y_i z_i \\ z x_i \\
    x_i y_i \\ x_i \\ y_i \\ z_i \end{bmatrix} \text{ and } \mathbf{a} = \begin{bmatrix}
    a \\ b \\ c \\ f \\ g \\ h \\ p \\ q \\ r \end{bmatrix} .$


    Construct a matrix $X$ from the set of points $\mathbf{x}$ by making each $\mathbf{x}_i$
    a column of $X$. Now, $X$ is a matrix of 9 rows and $n$ columns, where $n$ is
    the number of points we measure. If each point (each column of $X$) actually lies
    on the surface defined by $\mathbf{a}$, then


    $X^T \mathbf{a} + [\mathbf{1}] = [\mathbf{0}]$ (12.99)


    where $[\mathbf{1}]$ and $[\mathbf{0}]$ are $n$-vectors of ones and zeros, respectively.


    or


    $X^T \mathbf{a} = -[\mathbf{1}].$ (12.100)


    Now, we may use the pseudoinverse to find the mean-squared estimate of $\mathbf{a}$


    $\hat{\mathbf{a}} = (X X^T)^{-1} X^T [-\mathbf{1}]$ (12.101)


    Rewriting Eq. 12.101 to show dimensions, we see


    $\hat{\mathbf{a}}_{9 \times 1} = (X_{9 \times n} X_{n \times 9}^T)^{-1}_{9 \times
    9} X_{9 \times n} [-\mathbf{1}]_{n \times 1}$ (12.102)


    which requires only the solution of a $9 \times 9$ inverse to find the coefficients
    that describe this quadric. Furthermore this method allows use of an overdetermined
    system of equations and a minimum squared error solution.


    # Determining the Geometry


    From range or other surface data, the quadric coefficients may be determined by
    methods such as those in the previous section. Given the coefficients, the type
    of quadric may be determined by the following method. (Note that here we define
    the $yz$, $zx$, and $xy$ terms using an additional coefficient of 2. This is just
    to make the matrix of Eq. 12.104 work out conveniently. Otherwise, the 2''s will
    not be there.$^{11}$)'
  merge: -1
  img_proc: true
- pgno: 357
  md: "+   1. If there is a constant term, $d$, divide by the constant, redefining\
    \ the other coefficients (e.g., $a = \\frac{a}{d}$), resulting in a form of the\
    \ quadric equation in which the constant term is unity:\n+   \n+   $$ax^2 + by^2\
    \ + cz^2 + 2fyz + 2gzx + 2hxy + px + qy + rz + 1 = 0. \\quad (12.103)$$\n\nThis\
    \ equation can then be written in the following form\n\n$$[x \\ y \\ z \\ 1] \\\
    begin{bmatrix} a & h & g & p \\\\ h & b & f & q \\\\ g & f & c & r \\\\ 0 & 0\
    \ & 0 & 1 \\end{bmatrix} \\begin{bmatrix} x \\\\ y \\\\ z \\\\ 1 \\end{bmatrix}\
    \ = 0. \\quad (12.104)$$\n\n+   2. Consider the upper left $3 \\times 3$ submatrix.\
    \ Obtain its three eigenvalues, $\\lambda_1, \\lambda_2, \\text{and } \\lambda_3$.\
    \ Then find the reciprocal of each that is nonzero, $r_1 = \\frac{1}{\\lambda_1},\
    \ r_2 = \\frac{1}{\\lambda_2}, \\text{and } r_3 = \\frac{1}{\\lambda_3}$.\n+ \
    \  3. At least one reciprocal must be positive to have a real surface.\n+   4.\
    \ If exactly one is positive then the surface is a hyperboloid of two sheets.\n\
    +   5. If exactly two are positive, then it is a hyperboloid of one sheet.\n+\
    \   6. If all three are positive, it is an ellipsoid, and the square roots of\
    \ $r_1, r_2, r_3$ are the major axes of the ellipsoid.\n+   7. Otherwise the distance\
    \ between the foci of hyperboloids is determined by the magnitudes of the $r$'s.\n\
    \n# 12.7.3 Fitting Ellipses and Ellipsoids\n\nAlthough this section discusses\
    \ fitting surfaces, we have introduced the concept of algebraic distance, and\
    \ this is an appropriate place to consider again the simpler case of fitting ellipses\
    \ to curve data, as well as the three-dimensional extension to fitting ellipsoids.\
    \ An ellipse is described by the general equation for a conic section:\n\n$$ax^2\
    \ + hxy + cy^2 + dx + ey + f = 0. \\quad (12.105)$$\n\nThis implicit form describes\
    \ not only ellipses, but lines, hyperbolas, parabolas, and circles. To guarantee\
    \ that the resulting curve is an ellipse we must also ensure that it satisfies\n\
    \n$$b^2 - 4ac < 0. \\quad (12.106)$$\n\nSatisfying this constraint produces an\
    \ optimization problem that is nonlinear. Instead, we could use residuals to find\
    \ the coefficients $a - f$ exactly as was done in the previous section.\n\nFollowing\
    \ this approach provides a solution that works reasonably well but tends to fit\
    \ of low curvature with hyperbolic arcs rather than with ellipses. Similar difficulties\
    \ occur when attempting to fit ellipsoids to range data. See Wang [12.54], Rosin\
    \ and West [12.36], and Fitzgibbon et al. [12.9] for more details.\n\nThere is\
    \ a fast and easy solution to finding ellipses, which works well if neither end\
    \ of the major axis is occluded, which we already discussed in Section 9.4, and\
    \ another method by Lei and Wong [12.58], which uses accumulators in a powerful\
    \ way."
