    We see that these two sequences differ only in the first (DC) term. They therefore
    represent two encodings of the same boundary that differ only by a translation.
    This example is oversimplified, because in reality, the sequence will be a set
    of complex numbers, not real numbers as illustrated, but the concepts are identical.


    # Practical Considerations in Using Fourier Descriptors


    How we represent the movement from one boundary point to another is critical.
    Simply using a 4-neighbor chain code produces poor results. Use of an eight-neighbor
    code reduces the error by 40 to 80%, but is still not as good as one would prefer.
    A superior method is to resample the boundary (see Sec. 10.6) so the pixels along
    the boundary are equally spaced.


