    Figure 7.10 The function of grayscale closing to remove noise is illustrated in
    one dimension. Here, the structuring element is represented by a horizontal line
    that is placed at every position where it will fit above the brightness function.
    The function is then not allowed to be lower than the s.e. This process clips
    off small negative excursions of the signal while leaving the larger portions
    of the signal unchanged.


    # Grayscale Opening and Closing


    Opening and closing are defined as they were in the previous section, using the
    results from dilation and erosion.


    One of the principal applications of grayscale morphology is to remove noise.
    Figure 7.10 illustrates what grayscale closing does in one dimension. (The same
    thing happens in 2D, it''s just harder to visualize.) The structuring element
    may be thought of as a fixed-length horizontal line that moves along the image
    brightness function seeking lower and lower positions until it hits a spot where
    it touches the brightness function on both sides. The brightness at which this
    happens becomes the lowest value of the brightness function, as illustrated in
    the lower figure.


    From the previous discussion, we see that there is no requirement for the region
    to be binary any more. However, in this formulation, the s.e. must be flat. That
    requirement is relaxed in the next section.


