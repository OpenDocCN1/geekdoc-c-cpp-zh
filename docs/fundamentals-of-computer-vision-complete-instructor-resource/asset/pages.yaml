- pgno: 337
  md: 'get the equation


    ```

    c_1 = u_2 v_3 - u_3 v_2 = 0 + 0 + 0 - w''xh_4 - w''yh_5 - w''wh_6 + y''xh_7 +
    y''yh_8 + y''wh_9.

    (12.45)

    ```


    Once written in this form, we recognize that the first element of the cross product
    can be written as an inner product, and setting that equal to zero, we get an
    equation,


    ```

    c_1 = [0 0 0 -w''x -w''y -w''w y''x y''y y''w] \cdot \mathbf{h} = 0.

    (12.46)

    ```


    However, we don''t actually have nine degrees of freedom in this problem, since
    the same equation will hold true no matter how we scale the images. This leaves
    us free to choose a same value for one element of \(\mathbf{h}\). The usual convention
    is to choose \(h_9 = 1\). Doing so gives us a constant value to put on the right-hand
    side, producing


    ```

    [0 0 0 -w''x -w''y -w''w y''x y''y y''w] \cdot \mathbf{h} = -y''w.

    (12.47)

    ```


    Similarly, the second element of the cross product produces an equation


    ```

    [xw'' yw'' ww'' 0 0 0 -xx'' -xy'' -xx''] \cdot \mathbf{h} = -wx''.

    ```


    From these two equations, we now develop an algorithm:


    For each correspondence, \(x_i, y_i \Longleftrightarrow X''_i, Y''_i\) construct
    this \(2 \times 8\) matrix.


    ```

    \(\begin{bmatrix} 0 & 0 & 0 & -x_i & -y_i & -1 & x_i y''_i & y_i y''_i \\ x_i
    & y_i & 1 & 0 & 0 & 0 & -x_i x''_i & -y_i x''_i \end{bmatrix}\).

    ```


    Supposing that you found \(n\) correspondences, stack the \(2 \times 8\) matrices
    to form a \(2n \times 8\) matrix. Call that matrix \(A\).


    For each correspondence, construct the \(2 \times 1\) vector


    ```

    \(\begin{bmatrix} -y''_i \\ x''_i \end{bmatrix}\).

    ```


    Stack these vectors to product a \(2n \times 1\) vector named \(\mathbf{D}\),
    satisfying


    ```

    A^T \mathbf{h} = \mathbf{D}.

    (12.48)

    ```


    Compute the vector \(\mathbf{h}\) using


    ```

    \mathbf{h} = (A^T A)^{-1} A^T D.

    ```


    The previous equation is rewritten explicitly showing matrix/vector sizes:


    ```

    \mathbf{h}_{8 \times 1} = (A_{8 \times 2n}^T A_{2n \times 8})^{-1} A_{8 \times
    2n}^T D_{2n \times 1}.

    ```


    Note that this requires inversion of an \(8 \times 8\) matrix.'
