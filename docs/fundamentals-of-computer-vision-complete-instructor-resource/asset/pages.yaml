    that a non-differentiable function may be approximated by a differentiable one,
    was the source of the revival of field of neural networks research.


    # 1.4.2 Visual Perception


    You already know that images are formed on the retina by light. The electrical
    signals generated by light sensors pass through the optic nerve, the lateral geniculate
    nucleus (LGN), and terminate in the visual cortex, a large area in the back of
    the brain, as shown in Figure 1.5. The visual cortex may actually be divided into
    several sections, V1 (or primary), V2, V3, V4, and V5. Images receive different
    processing in different areas. The visual cortex is also referred to as the *striate
    cortex* because it appears to have long, fairly straight bands (Figure 1.6).


    The visual cortex is *retinotopic*. That is, a particular cell in the visual cortex
    fires when a particular light sensor in the retina is stimulated, and furthermore,
    if two points in the retina are close together, then the corresponding points
    in the visual cortex are also close together.


    Mathematical modeling of neurons encountered the area of vision in 1962 with the
    work of Hubel and Wiesel in [1.1]. These two neurophysiologists took mammals (initially
    cats,'
