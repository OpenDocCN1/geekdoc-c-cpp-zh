    The first term $H_n$ is called the noise term, and the second term $H_p$, the
    prior term.


    What does minimizing H mean? We haven''t chosen a form for $\Gamma$ yet, but just
    looking at the noise term, we notice that it is zero when $\mathbf{f} = \mathbf{g}$,
    and since both numerator and denominator are positive, we can''t get any smaller
    than zero. Although we started this derivation thinking about probabilities and
    Gaussian densities, suddenly we have the result that the minimizing $\mathbf{f}$
    will resemble the measurement $\mathbf{g}$. This certainly makes intuitive sense.


    From the noise term, we already have one requirement to fulfill, that the optimizing
    $\mathbf{f}$ resemble the measurement $\mathbf{g}$. We use the prior to make the
    optimizing $\mathbf{f}$ have other properties that we may choose. First, observe
    that since we are seeking an $\mathbf{f}$ that minimizes $H$, anything that makes
    $H$ large is not likely to be chosen. What if we chose something like


    ```

    \(\Gamma(f_i) = (f_i - f_{i+1})^2\)

    ```


    With this $\Gamma$, images with a lot of points where the pixel-to-pixel difference
    is large are not likely to be chosen. We say such points are penalized. Could
    we find an image that minimizes this prior term? Certainly. Any image where the
    pixel-to-pixel difference is zero would minimize it. Unfortunately, such images
    are not very interesting.


    It''s actually even worse! The term $(f_i - f_{i+1})^2$ is quadratic in the pixel-to-pixel
    difference, so it penalizes larger difference even more! But what if it is an
    edge with a large pixel-to-pixel difference? Using this prior would choose an
    $\mathbf{f}$ that blurs edges.


    We need a term that is small for small differences, grows (perhaps quadratically)
    with increasing noise, but at some point stops getting larger. Such a function
    would penalize edges no more than the highest levels of noise. Such a function
    is shown on the left of Figure 6.10. The problem with that function is that it
    is discontinuous, and therefore not differentiable, and we will need differentiation
    later in this section. The function on the right of that same figure however satisfies
    the same desires, and is continuous. It is simply the negation of a Gaussian.


    Using the negative of a Gaussian as the $\Gamma$ function, the objective function
    takes on another form:


    ```

    \(H = \sum_i \frac{(g_i - f_i)^2}{2\sigma^2} - \beta \sum_i \exp(-(f_i - f_{i+1})^2)\)

    ```'
