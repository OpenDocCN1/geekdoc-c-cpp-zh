    # 7.5 Applications in Edge Linking


    This section presents an application, closing gaps in edges (or edge linking),
    which combines the use of the distance transform with dilation and erosion to
    illustrate the power of such methods.


    In section 7.2.4, you learned that closing could sometimes be used to close gaps.
    That suggests a simple algorithm:


    +   - Dilate the boundary pixels with a structuring element on the order of the
    size of the gap.

    +   - Erode the resulting close boundary by the same s.e.


    Unfortunately, this won''t work very well in real life. The erosion process, in
    general, does not know precisely when to stop, and when erosion runs too long,
    it may create new gaps, defeating the purpose.


    There is another method, using _thinning_. Thinning algorithms perform operations
    similar to erosion [7.1] but do not break connectivity (create gaps). The resulting
    collection of points is similar to a _skeleton_, which we will discuss in section
    10.4.5. The weakness of the thinning algorithms mentioned above is that they do
    not remember where the boundary was originally. In the following few paragraphs,
    we show how to use the Distance Transform to accomplish that, and will compare
    the results with thinning.


