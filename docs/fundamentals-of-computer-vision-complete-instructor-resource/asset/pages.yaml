- pgno: 121
  md: 'where \(\beta = \frac{b}{\sqrt{2\tau^2}}\), and \(b\) is a weight that can
    set to emphasize the importance of the prior vs. the noise terms. Now, we recognize
    \((f_i - f_{i+1})^2\) as a spatial derivative, and rewrite the objective function,
    taking into account the fact that we have two spatial derivatives, which are evaluated
    at pixel \(i\):


    ```

    \(H = \sum_i \frac{(g_i - f_i)^2}{2\sigma^2} - \beta \sum_i \exp \left( - \left(
    \left( \frac{\partial f}{\partial x} \right)^2 + \left( \frac{\partial f}{\partial
    y} \right)^2 \right) \right)_i.\) (6.22)

    ```


    Finally, we recognize that we need to add a denominator to the argument of the
    derivative to keep the argument within reasonable bounds:


    ```

    \(H = \sum_i \frac{(g_i - f_i)^2}{2\sigma^2} - \beta \sum_i \exp \left( - \frac{
    \left( \frac{\partial f}{\partial x} \right)^2 + \left( \frac{\partial f}{\partial
    y} \right)^2 }{2\tau^2} \right).\) (6.23)

    ```


    Now we have an objective function that will produce a smooth image when we find
    an **f** that minimizes it. Minimization will require differentiation. To compute
    the derivative of \(H\) with respect to the elements of **f**, we make one final
    modification to Eq. 6.23. We replace the exponential of a sum with the sum of
    the exponentials. Mathematically, this is a completely different function, yet
    both prior terms are minimized by a piecewise-constant image, and the second version
    is significantly easier to work with:


    ```

    \(H = \sum_i \frac{(g_i - f_i)^2}{2\sigma^2} - \beta \sum_i \left( \exp \left(
    - \frac{ \left( \frac{\partial f}{\partial x} \right)^2 }{2\tau^2} \right) + \exp
    \left( - \frac{ \left( \frac{\partial f}{\partial y} \right)^2 }{2\tau^2} \right)
    \right).\) (6.24)

    ```


    We begin the process of finding the gradient of \(H\) by replacing the partial
    derivatives with convolutions indicating how they will be computed.


    ```

    \(H = \sum_i \frac{(g_i - f_i)^2}{2\sigma^2} - \beta \sum_i \left\{ \exp \left(
    - \frac{ (f \otimes h_x)^2 }{2\tau^2} \right) + \exp \left( - \frac{ (f \otimes
    h_y)^2 }{2\tau^2} \right) \right\}.\) (6.25)

    ```


    where \(h_x\) and \(h_y\) are kernels that estimate derivatives in the \(x\) and
    \(y\) directions, respectively.


    To minimize the objective function, we use gradient descent, which was covered
    in section 3.3.1. Gradient descent requires a way to find \(\frac{\partial H}{\partial
    f_i}\) for every pixel, say pixel \(i\). The gradient of Eq. 6.25 for pixel \(f_i\)
    is


    ```

    \(\frac{\partial H}{\partial f_i} = \frac{(f_i - g_i)}{\sigma^2} + \beta \left(
    \frac{1}{\tau^2} \left( (f \otimes h_x) \exp \left( - \frac{ (f \otimes h_x)^2
    }{2\tau^2} \right) \right) \otimes h_{rev} \right)|_{f_i} + \beta \left( \frac{1}{\tau^2}
    \left( (f \otimes h_y) \exp \left( - \frac{ (f \otimes h_y)^2 }{2\tau^2} \right)
    \right) \otimes h_{rev} \right)|_{f_i}\) (6.26)

    ```


    where the reverse of the kernel \(h_{rev}\) is a flip of kernel \(h\) up to down,
    left to right. For example,


    If \(h = \begin{matrix} h_{-1,-1} & h_{-1,0} & h_{-1,1} \\ h_{0,-1} & h_{0,0}
    & h_{0,1} \\ h_{1,-1} & h_{1,0} & h_{1,1} \end{matrix}\), then \(h_{rev} = \begin{matrix}
    h_{1,1} & h_{1,0} & h_{1,-1} \\ h_{0,1} & h_{0,0} & h_{0,-1} \\ h_{-1,1} & h_{-1,0}
    & h_{-1,-1} \end{matrix}\).


    This form of the gradient is derived in Appendix B.'
