- pgno: 127
  md: 'An example of ill-conditioning [6.15] is as follows: Consider the two-variable
    linear system described by a matrix A, an unknown image f, and a measurement g,
    where


    ```

    g = Af  A = [ 1 1 ; 1 1.01 ]  f = [f1 f2]^T  g = [1 1]^T .

    ```


    This inverse problem has solution f1 = 1, f2 = 0. Now, suppose the measurement,
    g, is corrupted by noise, producing g = [1 1.01]^T. Then, the solution to the
    inverse problem is f1 = 0, f2 = 1. A trivially small change in the measured data
    caused a dramatic change in the solution.


    A rigorous exploration into the nature of ill-conditioned problems is outside
    the scope of this book, but the student should be aware that many inverse problems
    are ill-conditioned. In particular, determining the input to a system with noise
    by using only the output of the system is frequently ill-conditioned.


    There are many ways to approach these ill-conditioned restoration problems. They
    all share a common structure: regularization. Generally speaking, any regularization
    method tries to find a related well-posed problem whose solution approximates
    the solution to the original ill-conditioned problem [6.20]. One of the more common
    regularization methods is to add an additional term to the objective function
    that limits the nature of the solution. In some problems, this might be a constraint,
    and in some terms a penalty. As we progress through the book, the difference between
    a penalty and a constraint will become clear. In this chapter, we see a penalty:
    the unknown image should be smooth, and resemble the measurement; otherwise, a
    penalty will be imposed. More recently developed penalty terms for denoising purpose
    include the total variation [6.25] and the nonlocal means [6.9]. In later chapters,
    we will make use of a constraint, e.g., a vector MUST be a unit vector.


    # ## 6.6 Equivalent Algorithms


    In this section, you will learn the surprising result that using diffusion for
    noise removal and the MFA algorithm we have discussed are really the same algorithm.
    Use of diffusion results from thinking about the problem as a process, in this
    case diffusion. MFA results from thinking about the problem as finding the minimum
    of some objective function.


    For purposes of this derivation, only derivatives in the x-direction are considered
    and only the prior term is considered. This will be generalized to two dimensions
    after we complete the derivation. Rewrite the prior term as


    ```

    H_p(f) = \frac{-b}{\sqrt{2\pi}\tau} \sum_i \exp \left( - \frac{(f \otimes r)_i^2}{2\tau^2}
    \right) . \quad (6.33)

    ```


    The notation (f \otimes r), means the result of applying a kernel r to the image
    f at point i. The kernel may be chosen to emphasize problem-dependent image characteristics.
    This general form was used earlier to remove noise from piecewise-constant and
    piecewise-linear images.'
