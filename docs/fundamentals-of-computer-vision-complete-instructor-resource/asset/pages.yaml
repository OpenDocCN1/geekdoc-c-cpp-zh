    # ## 5.6 Scale Space


    In section 5.4.6, we briefly introduced the concept of scale. Here, we elaborate
    on the process of constructing a scale space as well as some important properties
    of scale space. “Scale Space” is an extension to the concept of image pyramids,
    first used in picture processing by Kelly [5.18] and later extended in a number
    of ways (see [5.5, 5.7, 5.26, 5.27] and many others).


    # ### 5.6.1 Pyramids


    In a pyramid, a series of representations of the same image are generated, each
    created by a 2:1 subsampling (or averaging) of the image at the next higher level
    (Figure 5.10).


    In Figure 5.11, a Gaussian pyramid is illustrated. It is generated by blurring
    each level with a Gaussian prior to 2:1 subsampling. An interesting question should
    arise as you look at this figure. Could you, from all the data in this pyramid,
    reconstruct the original image? The answer is “No, because at each level, you
    are throwing away high frequency information.”


    Although the Gaussian pyramid alone does not contain sufficient information to
    reconstruct the original image, we could construct a second pyramid to provide
    the additional information. To do that, we use a Laplacian pyramid, constructed
    by computing a similar representation of the image using the Laplacian operator.
    That process preserves the high frequency information. This is illustrated in
    Figure 5.12. Combining the two pyramid representations allows reconstruction of
    the original image.'
