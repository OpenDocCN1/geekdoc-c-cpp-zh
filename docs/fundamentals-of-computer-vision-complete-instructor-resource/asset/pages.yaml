    # 9.2.3 Reducing Computational Complexity Using Gradient


    The computational complexity of parametric transforms can be quite high. The Hough
    transform is sometimes referred to as the “coffee transform,” because for many
    years one could command a computer to perform a Hough transform, and then drink
    an entire cup of coffee before it finished. For example, suppose we are performing
    a Hough transform in which the size of the image is \(512 \times 512\), and we
    wish an angular resolution of one degree. Our accumulator array is thus \((512
    \times 2\sqrt{2}) \times 360\) (since \(\rho\) can be positive or negative). The
    iteration consists of calculating \(\rho\) for each value of \(\theta\), so we
    can calculate and increase 360 accumulators for each edge pixel in the image.


    One way to reduce the computation is to observe that the edge points in the image
    are often the output of some gradient operator, and if we have both the magnitude
    and direction of that gradient, we can make use of that information to reduce
    the computational complexity. To see this, refer to Figure 9.3. If we know the
    gradient at a point, we know the direction of the edge, and we therefore know
    \(\theta\). Thus, we need only to compute one value of \(\theta\), instead of
    360 of them, and we need to increment only one accumulator – a 360:1 speed-up.
    Not bad!


