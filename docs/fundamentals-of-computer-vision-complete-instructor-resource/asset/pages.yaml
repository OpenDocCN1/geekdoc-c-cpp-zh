    # 10.7.2 A Closed Boundary as a Vector


    A sampled boundary with, say, 100 samples, may be written as a 100-dimensional
    vector. Figure 10.22 illustrates a boundary with nine points. So with 100 points,
    we have a 100-dimensional vector. No problem. A thousand points? Still no problem.
    What if we consider the boundary as continuous instead of sampled? It is perfectly
    OK to continue to think of it as a vector, but as \(s\) ranges from 0 to \(2\pi\),
    it takes on an infinite number of different values and the representation of the
    curve becomes an infinite-dimensional vector. We call those “functions.” We can’t
    write it out as a table, but we probably didn’t want to write out the 1000-dimensional
    one either. As we did in Chapter 3, we simply use the functional notation.


    But there is more than one infinity that confronts us. Not only is each contour
    represented by an infinite-dimensional vector, there could be an infinity of them.
    Think of a single curve, like the one illustrated in Figure 10.22. You could rotate
    that curve about some point of interest (e.g., its center of gravity), and in
    so doing create an infinity of new curves, one for each possible rotation.'
