    without needing the camera matrices, and allowing for a few, small errors.


    # 12.3 Shape from Motion – Range from Two Unknown Cameras


    In the previous section, we knew where the cameras were and how they were pointed.
    In this section, we relax those requirements, and replace them with the requirement
    for a reasonable number of good correspondences.


    Notice that most mammals have two eyes, and therefore, one would suspect they
    are using that dual information to infer something about the three-dimensional
    world. This suspicion is reinforced by the work of Julesz, who showed [12.20]
    that random dot stereograms could be used to construct an image that looked totally
    like random noise unless viewed from just the right distance, but with proper
    viewing, the same images appear to have depth.


    The trick to such perception makes use of _correspondence_ between the two eyes;
    that is, that an area appears so similar to both eyes that both may consider it
    the same. Given a correspondence, the brain can compute an estimate of the 3D
    position of that area. We pursue that idea rigorously below.


    # 12.3.1 Stereopsis and the Correspondence Problem


    Suppose we have two cameras viewing the same scene and we do not know the camera
    poses.<sup>5</sup> We do, however, have an operator that is capable of saying
    “this point in image 1 looks like that point in image 2.” That is, we have an
    operator that can solve the correspondence problem, but not always correctly.


    As in the previous section, homogeneous coordinates are used to approach this
    problem. That is, the 2-vector [x y]<sup>T</sup> is represented by the 3-vector
    [x y 1]. Further, we will be dealing with lines in the plane with parameters _a_,
    _b_ and _c_, such that the equation for a line becomes


    ```

    \( l^\mathsf{T} x = 0 \) (12.19)

    ```


    where l = [a b c]<sup>T</sup> and x = [x, y, 1]<sup>T</sup>.


    Now here is an interesting fact: if point **x**<sub>l</sub> in the left-hand image
    and point **x**<sub>r</sub> in the right-hand image really do correspond, then
    there exists a matrix _F_ that satisfies


    ```

    \( x_k^\mathsf{T} F x_k = 0 \). (12.20)

    ```


    Furthermore, if there are a lot of points in the left-hand image **x**<sub>l<sub>i</sub></sub>
    and a lot of corresponding points **x**<sub>r<sub>i</sub></sub> in the right-hand
    image, the _same_ matrix _F_ satisfies **x**<sub>l<sub>i</sub></sub>_F_**x**<sub>r<sub>i</sub></sub>
    = 0, for all _i_. The


    <sup>5</sup> “Pose” is a set of 6 numbers, including position (x, y, z) and orientation
    (roll, pitch, yaw) in 3-space.'
