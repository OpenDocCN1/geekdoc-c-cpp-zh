    be futile to attempt to establish a global threshold. A dramatic example of this
    effect can be seen in an image of a rectilinear grid, in which the "uniform" white
    varies significantly over the surface.


    Effects such as vignetting are quite predictable and easy to correct. It is more
    difficult, however, to predict and correct effects of nonuniform illumination,
    such as sunlight through a window, which changes radically over the day. Since
    a single threshold cannot provide acceptable performance, we must choose local
    thresholds. The most common approach is called *block thresholding*, in which
    the picture is partitioned into rectangular blocks and different thresholds are
    used on each block. Typical block sizes are 32 × 32 or 64 × 64 or 512 × 512 images.
    The block is first analyzed and a threshold is chosen; then that block of the
    image is thresholded using the results of the analysis. In more sophisticated
    (but slower) versions of block thresholding, the block is analyzed and the threshold
    computed. Then that threshold is applied only to the single pixel at the center
    of the block. The block is then moved over one pixel, and the process is repeated.


