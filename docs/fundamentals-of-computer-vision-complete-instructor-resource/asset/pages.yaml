  md: 'You saw the diffusion equation


    \(\frac{\partial f}{\partial t} = \kappa(\nabla(c\nabla f))\) (6.41)


    previously in section 6.4. Observe that this is identical to Eq. 6.40 when the
    conductivity, c, is replaced by the exponential.


    If image brightness is thought of as heat and allowed to diffuse over time (iterations),
    the result smoothes out noise, and if c is properly computed, edges can be preserved
    as well. We already saw Variable Conductance Difusion (VCD) [6.12, 6.21, 6.23]
    in section 6.4.4, which is this exact algorithm.


    By Eq. 6.40, we have shown the equivalence of MAP and VCD, provided that MAP is
    performed without using the noise term. This equivalence provides for the union
    of two schools of thought concerning image analysis: The optimization school considers
    the properties that an image ought to have. It then sets up an optimization problem
    whose solution is the desired image. One might also call this the restoration
    school. The process school is more concerned with determining which spatial analysis
    methods to apply. Adaptive filtering, diffusion, template matching, etc. are more
    concerned with the process itself than with what that process does to some hypothetical
    “energy function” of the image. The results shown in this section demonstrate
    that these two schools are not just philosophically equivalent. At least for this
    particular form of edge-preserving smoothing, they are precisely equivalent.


    The student may ask, “At least from the figures, it appears that VCD does not
    work as well as MAP, but how can that be, if they are equivalent?” The answer
    is that the above equivalence considers only the prior term of the MAP objective
    function. Addition of the noise term adds the desire to not only be smooth with
    sharp edges, but also to resemble the original. Nordström [6.21] also observed
    a similarity between diffusion techniques and regularization (optimization) methods.
    He notes that “the anisotropic diffusion method does not seek an optimal solution
    of any kind.” Nordström then proceeds to “unify” from the original outlook quite
    different methods of regularization and anisotropic diffusion.” He proceeds quite
    elegantly and precisely to derive a cost function whose behavior is an anisotropic
    diffusion, in a similar manner to the derivation presented here. Nordström also
    argues for the necessity of adding a “stabilizing cost” to “restrict the space
    of possible estimated image functions.” At this point the reader should not be
    surprised to learn that the form of the stabilized cost is


    \(\sum_i (f_i - g_i)^2\) (6.42)


    which we showed in Eq. 6.19 to be a measure of the effect of Gaussian noise in
    a blur-free imaging system. Thus we see that Biased Anisotropic Diffusion (BAD)
    [6.21] may be thought of as a maximum a posteriori restoration of an image. This
    observation now permits researchers in VCD/BAD to consider use of different stabilizing
    costs, if they have additional information concerning the noise generation process.'
