    # 8.3 Clustering: Segmentation Based on Color Similarity


    In this section you will learn a very powerful and general tool, clustering. In
    section 8.2, we mainly discussed the thresholding technique applied to grayscale
    images. When there are multiple spectral bands (e.g., the three-band color images),
    we can certainly apply thresholding on each individual band and then use some
    fusion approach to combine segmentation results from individual bands. In this
    section, we describe another way to produce a segmentation of a color image, and
    also use this opportunity to teach clustering.


    Figure 8.9 illustrates a street in the village of Appledore in North Devon, UK
    where several houses painted with different colors are shown. In order to segment
    the houses of different colors, one intuitive approach is to find regions of similar
    colors. That is, we can represent each house by a cluster of similar-colored pixels,
    and represent the cluster by a single color. One might ask: “How many colors are
    in this picture?” A first attempt at answering this question would be to reason
    that the color image contains 8 bits of red, 8 bits of green, and 8 bits of blue.
    Therefore, there would be 2^24 = 16, 777, 216 different colors. But a bit of meditation
    leads one to realize there are only 1296 x 864 = 1, 119, 744 pixels in this 1296
    x 864 image, and therefore there really cannot be more than 1,119,744 different
    colors in the image.


    But how many colors are really needed? Is there a way to use even fewer? These
    questions are addressed next.


    This application gives us the opportunity to learn about clustering, or unsupervised
    learning. The clustering method described below readily produces the desired color
    partition.


    # 8.3.1 K-means Clustering


    There are many ways to do clustering. Stuart Lloyd developed what later became
    known as the k-means algorithm in 1957, but did not publish it in the open literature
    until 1982 [8.32, 8.33]. Interestingly, decades later, k-means is still one of
    the most popular clustering algorithms.'
