    In Eq. 3.56, the symbols _a_ and _b_ represent events, e.g., the rolling of a
    six. Pr(_b_) is the probability of such an event occurring, and Pr(_a_|_b_) is
    the conditional probability of event _a_ occurring, given that event _b_ has occurred.


