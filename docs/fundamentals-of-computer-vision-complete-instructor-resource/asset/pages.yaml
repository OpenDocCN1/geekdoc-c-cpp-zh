    # 8.4.1 A Recursive Approach


    This algorithm implements region growing by using a pushdown stack on which to
    temporarily keep the coordinates of pixels in the region. It produces a label
    image, L(x, y), from an image f(x, y). L is initialized to all zeros.


    +   1. Find an unlabeled black pixel; that is, L(x, y) = 0. Choose a new label
    number for this region, call it N. If all pixels have been labeled, stop.

    +   2. L(x, y) <- N.

    +   3. If f(x - 1, y) is black and L(x - 1, y) = 0, set L(x - 1, y) <- N and push
    the coordinate pair (x - 1, y) onto the stack.

    +   If f(x + 1, y) is black and L(x + 1, y) = 0, set L(x + 1, y) <- N and push
    (x + 1, y) onto the stack.

    +   If f(x, y - 1) is black and L(x, y - 1) = 0, set L(x, y - 1) <- N and push
    (x, y - 1) onto the stack.

    +   If f(x, y + 1) is black and L(x, y + 1) = 0, set L(x, y + 1) <- N and push
    (x, y + 1) onto the stack.

    +   4. Choose a new (x, y) by popping the stack.

    +   5. If the stack is empty, increment N and go to 1, else go to 2.


    This labeling operation results in a set of connected regions, each assigned a
    unique label number. Note that this example assumes a 4-neighbor adjacency. To
    find the region to which any given pixel belongs, the computer has only to interrogate
    the corresponding location in the L memory and read the region number.


    # Example: Applying Region Growing


    The algorithm described here is called Region Growing because it identifies which
    pixels belong to a particular region one pixel at a time, effectively “growing”
    the region in the label image. In Figure 8.16 a 6 x 6 array of pixels is shown.
    Assume the initial value of < x, y > is < 4, 5 >. We apply the above algorithm
    and show the contents of the stack and L each time step 3 is executed. Let the
    initial value of N be 1. In the figures below, row and column numbers are shaded
    with gray.


    Here, we illustrate the concept of connectivity by defining that two pixels are
    CONNECTED if they are the same brightness and the Manhattan distance between them
    is 1.'
