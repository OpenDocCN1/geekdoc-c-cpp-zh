    # 5.4 Derivative Estimation


    Since the derivative is probably the most common linear operator, in this section
    we discuss four different ways to estimate derivatives. First, we describe an
    intuitive approach that uses the definition of the derivative to generate kernel
    operators. This is followed by a formal derivation of solving derivative kernels
    by function fitting. Based on vector representation of images, we introduce the
    concept of basis vectors and discuss some special basis vectors that describe
    edge-like characteristics. Finally, we elaborate on the method of constructing
    kernels by taking derivatives of special blurring kernels, making use of the linearity
    of kernel operators.


    # 5.4.1 Using Kernels to Estimate Derivatives


    Let us examine this concept via an example – approximating the spatial derivatives
    of the image, \(\frac{\partial f}{\partial x}\) and \(\frac{\partial f}{\partial
    y}\). We recall from some dimly remembered calculus class,


    ```

    \(\frac{\partial f}{\partial x} = \lim_{\Delta x \to 0} \frac{f(x + \Delta x)
    - f(x)}{\Delta x}\) (5.7)

