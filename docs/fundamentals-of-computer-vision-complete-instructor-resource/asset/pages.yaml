  md: '# 5.4.5 Other Higher Order Derivatives


    We have just seen how second or third derivatives may be computed using derivatives
    of Gaussians. Since the topic has come up, and you will need to know the terminology
    later, we define here two scalar operators that depend on the second derivatives:
    the Laplacian and the quadratic variation.


    The Laplacian of brightness at a point (x, y) is


    \(\frac{\partial^2 f}{\partial x^2} + \frac{\partial^2 f}{\partial y^2}\)


    whereas the quadratic variation (QV) of brightness is


    \(\left(\frac{\partial^2 f}{\partial x^2}\right)^2 + \left(\frac{\partial^2 f}{\partial
    y^2}\right)^2 + 2\left(\frac{\partial^2 f}{\partial x \partial y}\right)^2\)


    The Laplacian may be approximated by several kernels, including the following
    three commonly used ones


    | 0 | 1 | 0 | | 1 | 1 | 1 | | -1 | 2 | -1 |

    |---|---|---|---|---|---|---|---|---|---|---|

    | 1 | -4 | 1 | | 1 | -8 | 1 | | 2 | -4 | 2 |

    | 0 | 1 | 0 | | 1 | 1 | 1 | | -1 | 2 | -1 |


    and the quadratic variation can be estimated by three partial second derivative
    kernels,


    \(\Delta_{xx} = \frac{1}{6} \begin{bmatrix} 0 & 0 & 0 \\ 1 & -2 & 1 \\ 0 & 0 &
    0 \end{bmatrix}, \Delta_{yy} = \frac{1}{6} \begin{bmatrix} 0 & 1 & 0 \\ 0 & -2
    & 0 \\ 0 & 1 & 0 \end{bmatrix}, \Delta_{xy} = 2 \begin{bmatrix} -0.25 & 0 & 0.25
    \\ 0 & 0 & 0 \\ 0.25 & 0 & -0.25 \end{bmatrix}\)


    Note that the Laplacian as illustrated in Eq. 5.28 is a 2D isotropic kernel, meaning
    that it does not have direction, as only one kernel is used.


    The third kernel in Eq. 5.29 is frequently referred to as the cross term because
    it involves both x and y. The importance of the third (cross) term depends on
    the problem being solved.


    To see this, consider Figure 5.7, which illustrates the application of the Quadratic
    Variation without and with the cross term. The strength of the operator in the
    lefmost image, which was computed without the cross term, varies significantly
    as a function of edge orientation. The center image, however, uses all three terms
    in the QV, and has an almost perfectly uniform strength. Some students will realize
    that if \(\frac{\partial^2 f}{\partial x^2}\) and \(\frac{\partial^2 f}{\partial
    y^2}\) are in fact a basis for the second-order derivative space, then their sum
    should be invariant to gradient direction. Unfortunately, those basis terms are
    squared and then added, not just added, and the nonlinearity of the square introduces
    strength variations that require the cross term to compensate.


