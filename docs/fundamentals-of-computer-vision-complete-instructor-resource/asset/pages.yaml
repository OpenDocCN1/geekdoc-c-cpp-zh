  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_24_0.png)


    Figure 1.6 The visual cortex, when stained appropriately, seems to be divided
    into long bands. From [1.7].


    and later monkeys) and implanted electronic probes so small that the firing of
    single neurons could be detected. With this capability, they made some amazing
    discoveries.3


    The first discovery is that there is a correspondence between certain cells in
    the cortex and the presence of, not just light, but edges in the retina. Even
    more interesting, there are cells in the cortex that respond when edges of a certain
    orientation are present in a particular place in the retina!


    Every cortical cell that fires in this way is said to have a receptive field,
    which consists of all the light receptors that, when stimulated, have some direct
    effect on this cortical cell. The simplest receptive fields, actually found in
    the retinal ganglial cells, are called “center-on” cells, illustrated in Figure
    1.7, which fire when the center of the receptive field is stimulated and the surrounding
    is not. More interesting cells in the cortex have been found to fire when the
    center is stimulated by an edge with a particular orientation. That there are
    cells that behave in this way motivates the use of kernel operators in Chapter
    5 of this book. Also found are cells that respond to motion of edges.


    Another observation by Hubel and Wiesel is that the cortex has bands of neurons
    that receive input from the left eye, and each of these bands borders a band that
    receives input from the right eye. This suggests that the wiring of the cortex
    performs some of the computations required for humans to perceive depth.


    Finally, later exploration of brain physiology has shown that as one moves from
    the primary visual cortex, to V2, V3, and further, the receptive fields seem to
    grow, suggesting a hierarchical architecture with several layers of computation
    and interconnection.


    There is a great deal of debate and research going on in visual perception currently,
    and this field can be expected to continue to be very active for many years.


    3 Yes, they did receive a Nobel prize in 1981.'
