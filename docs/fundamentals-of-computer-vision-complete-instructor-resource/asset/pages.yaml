- pgno: 119
  md: 'The next step is to find a form for the conditional probability. We start with
    a model for the distortion process. We assume the image is only distorted by additive
    noise at every pixel:


    \(g_i = f_i + n_i\) (6.12)


    so


    \(n_i = g_i - f_i\) . (6.13)


    For a single pixel, assume the noise is Gaussian and


    \(P(g_i|f_i) = P(g_i - f_i) = P(n_i) = \frac{1}{\sqrt{2\pi}\sigma} \exp \left(
    - \frac{(g_i - f_i)^2}{2\sigma^2} \right)\) . (6.14)


    Assuming that the noise added to one pixel is statistically independent of the
    noise added to all other pixels allows us to write


    \(P(\mathbf{g}|\mathbf{f}) = \prod_i \frac{1}{\sqrt{2\pi}\sigma} \exp \left( -
    \frac{(g_i - f_i)^2}{2\sigma^2} \right)\) . (6.15)


    We are free to use almost anything for the prior, as long as it makes sense, but
    it is extremely convenient to use some sort of product, since we will be taking
    logs in the next equation. However there is also theoretical justification, based
    on the theory of Markov Random Fields (MRF) [6.5, 6.14]. In an MRF, the probability
    that a pixel has a particular value does depend on the values of its neighbors,
    which in turn depend on their neighbors, just as you learned for Markov random
    processes [6.4, 6.11, 6.17]. For now, let''s just choose a form for the prior:


    \(P(\mathbf{f}) = \prod_i \exp(-\Gamma(f_i))\) , (6.16)


    where \(\Gamma\) is some function of the neighborhood of pixel \(i\). A little
    later, we will choose a form for \(\Gamma\).


    So the function we want to maximize is


    \(\prod_i \frac{1}{\sqrt{2\pi}\sigma} \exp \left( - \frac{(g_i - f_i)^2}{2\sigma^2}
    \right) \prod_i \exp(-\Gamma(f_i))\) . (6.17)


    An expression involving products and exponentials strongly suggests using a logarithm,
    and doing so produces a new objective, now called \(H\):


    \(H = \sum_i \log \left( \frac{1}{\sqrt{2\pi}\sigma} \right) - \sum_i \frac{(g_i
    - f_i)^2}{2\sigma^2} - \sum_i \Gamma(f_i)\) (6.18)


    The first term in Eq. 6.18 is not dependent on either of the images, so we can
    ignore it for purposes of optimization. Next, we switch from seeking an image
    \(\mathbf{f}\) that maximizes a probability to seeking an \(\mathbf{f}\) that
    minimizes the objective function by simply changing the signs.


    \(H = \sum_i \frac{(g_i - f_i)^2}{2\sigma^2} + \sum_i \Gamma(f_i)\) . (6.19)'
