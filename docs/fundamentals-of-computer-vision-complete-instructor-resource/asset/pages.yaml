    # 10.3.3 Groups


    This section covers a bit more terminology of transformations, moving from linear
    transformations to more general types.


    As we discuss a bit more about the theory of transformations, one particular transformation,
    rotation in the plane, will be used as an example, as its properties are easy
    to visualize. Recall from section 10.2 that a rotation of a point in 2-space may
    be easily computed by a 2 x 2 matrix. This collection of such 2 x 2 matrices that
    rotations is named SO(2), the special orthogonal group in two dimensions. The
    columns of these matrices, when considered as vectors, are orthogonal, and the
    determinant is 1.0.


    A group, in mathematics, is a set of transformations that satisfy four properties:


    **Identity** The transformation that takes any member of the set to itself must
    itself be in the set. In SO(2), the transformation \(\begin{bmatrix} 1 & 0 \\
    0 & 1 \end{bmatrix}\) does this.


    **Inverse** If a transform is in the set, its inverse must also be in the set.
    For example, if \(\begin{bmatrix} 0.866 & .5 \\ -.5 & 0.866 \end{bmatrix}\) is
    in the set of transformations, then \(\begin{bmatrix} 0.866 & -.5 \\ .5 & 0.866
    \end{bmatrix}\) must also be in the set.


    **Associative** Let A, B, and C be transformations in the set, and let D be the
    composition \(D = B \circ C\), and \(E = A \circ B\), where \(\circ\) here denotes
    matrix multiplication. Then the following relation must hold: \(A \circ D = E
    \circ C\).


    Said another way, \(A \circ (B \circ C) = (A \circ B) \circ C\), that has the
    form of the familiar associative property. Here, since SO(2) is a linear group,
    the composition of transforms, \(\circ\), may be computed by simple matrix multiplication.


    **Closure** If A and B are in the set, then \(A \circ B\) is in the group. For
    example if \(A = \begin{bmatrix} 0.866 & 0.5 \\ -0.5 & 0.866 \end{bmatrix}\) and
    \(B = \begin{bmatrix} 0.9397 & -0.3420 \\ 0.3420 & 0.9397 \end{bmatrix}\), then
    \(A \circ B = \begin{bmatrix} 0.9848 & 0.1737 \\ -0.1737 & 0.9848 \end{bmatrix}\),
    and \(A \circ B\) is also an element of the group.


