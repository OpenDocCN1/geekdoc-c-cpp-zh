    # ## 4.2.5 Graphical Representations (A Graph)


    A graph is a relational data structure. It consists of data elements, referred
    to as vertices, or nodes and relationships between vertices, referred to as edges.


    Graphs may be completely described by sets. The set of vertices is a set of “interesting
    things,” and the edges may be described by a set of ordered pairs. For example,
    let G = < V, E > represent a graph, where the vertex set


    ```

    V = {a, b, c, d, e, f, g, h}

    ```


