  md: '# ## 10.8 Conclusion


    In this chapter, several features were defined that could be used to quantify
    the shape of a region. Some, like the moments, are easy measurements to make.
    Others, such as the diameter or the convex discrepancy, require development of
    fairly sophisticated algorithms to avoid long computation time. There have also
    been some efforts in automatic learning of shape descriptors [10.40].


    Invariance to various linear transformations is essential in the design of robust
    shape descriptors. Studies of signal processing in the mammalian visual cortex
    [10.32] have suggested that images are represented in the cortex after being subjected
    to a log-polar transformation, and that invariance may be provided in this way
    [10.31][10.39]. Other transformations [10.37] may provide equivalent or superior
    representations in computer applications.


    One topic of significant interest that is not covered in this chapter is how a
    shape may change in time. For example, consider the analysis of the gait of a
    walking individual. This requires not only shape analysis, but analysis of how
    the shape is changing. A paper by Veeraraghavan et al. [10.38] presents this topic
    clearly, and thoroughly.


    Optimization methods came up quite a few times in this chapter:


    +   - In section 10.3.2, a derivation is presented that finds the straight line
    that best fits a set of points, in the sense that the sum of perpendicular distances
    is minimized. To accomplish that, we were required to use constrained minimization
    with Lagrange multipliers.

    +   - Constrained optimization was again used to find the best basis vectors when
    doing principal components.

    +   - The shape context requires a solution to the Linear Assignment Problem.

    +   - Both CSS and SKS search over relatively small search spaces for maxima.


