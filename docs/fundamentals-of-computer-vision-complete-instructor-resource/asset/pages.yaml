    +   - The degree of a node is the number of edges coming into that node.

    +   - A path between nodes v0 and v1 is a sequence of nodes, v0, v1, ..., vl such
    that there exists an edge between vi and vi+1 for i = 0, 1, ..., l - 1.

    +   - A graph is connected if there exists a path between any two nodes.

    +   - A clique (remember this word, you will see it again) is a subgraph in which
    there exists an edge between any two nodes.

    +   - A tree is a graph that contains no loops. Tree representations have found
    application in image compression, image coding, and any application in which there
    is a hierarchical relation between data elements.


    Graphs will show up several times in this book, as a means for describing relationships
    between regions and in segmentation. One application of graph representation is
    as follows: Every pixel is considered as a node in a graph. Edges may or may not
    exist between adjacent pixels. If an edge exists, then the two pixels lie in the
    same connected component of the graph. Consider the graph in Figure 4.2. This
    graph has 8 vertices, 8 edges, and two connected components. That is, there is
    a path along edges from a to d, or b to c, or f to h, etc. But there is no path
    from a to f.


    The concept of connected components is easily related to pixels by defining a
    "label image", an iconic representation, isomorphic to the original image, in
    which each pixel contains the index/label information of the component to which
    it belongs. With this definition, we see that the image in Figure 4.3 contains
    two connected components (labeled 2 and 3) in addition to the background (labeled
    1 and 4), as shown in Figure 4.4.


