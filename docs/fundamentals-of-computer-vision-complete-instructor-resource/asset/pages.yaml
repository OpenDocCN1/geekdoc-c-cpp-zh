    # 10.6.4 The SKS Model


    The problem of making global decisions from a collection of local measurements
    is considered one of the fundamental problems of machine intelligence in general
    and computer vision in particular. This section provides a general approach [10.22]
    to the problem in the image analysis domain, describing a general methodology
    for recognizing shapes in images. The strategy begins by making local measurements
    at salient points in an image. The information from those local measurements is
    then fused using a strategy reminiscent of the Hough transform.


    The method, called the SKS (Simple K-Space) algorithm, can be shown to be invariant
    to rotation in the camera plane, translation, and scale change, and very robust
    to partial occlusion and local variations in image brightness.


    The algorithm was developed under the constraint that all operations must be reasonably
    computed by a biological neural network, characterized by:


    +   • lots of memory

    +   • simple computations

    +   • low accuracy of those operations

    +   • a great deal of parallelism.'
