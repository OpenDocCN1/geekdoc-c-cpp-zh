    # 6.5.4 Ill-Conditioned Inverse Problems and Regularization


    A problem $\mathbf{g} = D(f)$ is said [6.13] to be well-posed if


    +   \- For each $\mathbf{g}$, a solution, $\mathbf{f}$, exists

    +   \- The solution is unique

    +   \- The solution $\mathbf{f}$ continuously depends on the data $\mathbf{g}$.


    If these three conditions do not all hold, the problem is said to be “ill-conditioned”
    or “ill-posed.” Conditioning of a mathematical problem is measured by the sensitivity
    of output to changes in input. For a well-conditioned problem, a small change
    of input does not affect the output much, while for an ill-conditioned problem,
    a small change of input can change the output a great deal.'
