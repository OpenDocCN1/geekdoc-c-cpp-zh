    # ## 8.8 Segmentation Using MFA


    In section 6.5.2 you learned how to apply the mean field annealing (MFA) algorithm
    to recover an image that


    +   1. resembles the original image and

    +   2. has regions that are uniform in brightness but have sharp edges. We called
    that “piecewise-constant.”


    Suppose we use the piecewise-constant prior of that section, and run the MFA algorithm
    until the temperature is very low. Recall that as temperature gets low, the solution
    approaches more and more closely the best solution that satisfies the prior. Thus,
    by the simple strategy of running the MFA algorithm long enough, we get a binary
    solution – a segmentation.


    Figure 8.37 illustrates the application of this method to segmentation of a very
    noisy, blurred image with very few, discernible edges. The four toes of the lion
    are segmented into areas of uniform brightness that are then labeled using connected
    components to identify them using different colors.


