  img_proc: true
- pgno: 359
  md: '# Self-occlusion


    Range images, one might think, already contain a complete description of three-dimensional
    shape, but, of course, you cannot see the entire surface in one image [12.17].
    A tough problem is how to integrate several range images to form one description
    of a three-dimensional object [12.42].


    Even though you may have segmented surfaces with some success, those segmentations
    are almost never perfectly correct. One might think that the equations describing
    the intersection of space curves would be straightforward to find. After all,
    you have the equations of the surfaces whose intersections determine the edges.
    Just calculate the intersection! Alas, it is never quite that easy. The problems
    occur when you have vertices, the intersections of edges: the trilinear or multilinear
    intersection points. Those equations you just derived never intersect precisely
    at a point. Hoover et al. [12.17] addresses this problem, and extends the solution
    to nonvisible surfaces.


