  md: 'which simplifies to


    ```

    m_{12} + I_1 m_{25} - I_2 m_{15} = 0. (12.72)

    ```


    Similarly divide by m_{15} and produce two independent equations:


    ```

    i_{i2} + I_1 i_{25} - I_2 = 0

    i_{i3} + I_1 i_{35} - I_3 = 0. (12.73)

    ```


    If we have the 2D invariants we have two equations for the 3D invariants. The
    two equations of Eq. 12.73 do not, unfortunately, completely determine the three
    3D invariants. Still those two equations determine a space line in the 3-space
    of the I’s.


    How do we use an idea like this? Given a 3D model of an object, and any five points,
    four of which are not coplanar, we can find I_1, I_2, and I_3, a set of three
    scalars, which define a point in a 3D space that we will call the “model space.”
    To perform recognition, we first extract from the 2D image, (generally several)
    5-tuples of feature points and from them construct the 2D invariants. Each 5-tuple
    gives rise to two equations in I_1, I_2 (Eq. 12.73) space, that is, a straight
    line in the 3D invariant space. If a 5-tuple in the 2D image is a projection of
    some 5-tuple in 3D, then the line so obtained will pass through the single point
    representing the model. If we have a different projection of those five points,
    we get a different straight line, but it still passes through the model point.


    Implementing this for real-world scenes is slightly more complicated than this
    description because one must actually make use of projective geometry rather than
    assuming orthogonal projections. Other complications arise in determining a suitable
    way to choose 5-tuples, and a means for dealing with the fact that the line may
    “almost” pass through the point. Weiss and Ray [12.56] address these issues. This
    approach, we might point out, also provides a solution to the correspondence problem.


    # 12.5 Controlling the Lighting – Range from One Camera and a Light


    There are two principal ways to acquire a dense range image by controlling the
    lighting: using time of flight, and using structured illumination.


