    # 11.4 SIFT


    The SIFT descriptor is a vector describing the neighborhood of the interest point.
    It is based on gradients, and therefore retains reduced sensitivity to illumination
    variations. Furthermore the descriptor is developed in scale space.


    # 11.4.1 The SIFT Descriptor


    The gradients and orientations are sampled in the neighborhood of the interest
    point and then weighted by a Gaussian centered at the interest point and with
    σ equal to the dominant scale. A 16 x 16 array of samples is extracted. The dominant
    direction is subtracted from each of the 256 orientations in order to create a
    set of direction measurements all relative to a local coordinate system defined
    by the dominant orientation. For each of the 4 x 4 subregions, orientation histograms
    are constructed, as illustrated in Figure 11.8. Each histogram is constructed
    to have 8 bins (see section 8.2.2). These histograms are then smoothed. Finally,
    with one histogram for each of 16 subregions, a descriptor contains 4 x 4 x 8
    elements.


    # 11.4.2 Matching Neighborhoods with SIFT Descriptors


    The SIFT descriptor is a single vector of length 128 that describes a small region
    in the vicinity of an interest point. That descriptor is constructed from gradients,
    and therefore is less sensitive to variations in lighting than a descriptor based
    on just brightness. Furthermore the descriptor is invariant to scale, translation,
    and rotation.


    Since the descriptor is a simple vector of length 128, matching a region in one
    image to a region in another image can be accomplished by nothing more complicated
    than comparing two vectors – minimum distance classification as described in section
    10.5.2.'
