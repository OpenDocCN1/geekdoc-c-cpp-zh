    # 12.6.1 Shape from Shading


    *Shape from Shading* was first introduced by Horn [12.18], who argued that some
    knowledge of how light is generated, reflected, and observed could substantially
    improve the performance of Computer Vision systems. Consider Figure 12.15, and
    assume you know


    +   - a law governing how light is scattered

    +   - the albedo (how the surface is painted/colored) of the surface

    +   - the direction to the light source

    +   - the direction to the observer

    +   - the measured brightness of the pixel


    Then the first objective is to obtain the surface normal. Once surface normals
    are known, it will become possible to actually determine the surface, z(x, y).


    The surface normal vector may be written as \mathbf{n} = \frac{\mathbf{r}}{|\mathbf{r}|},
    where the direction vector \mathbf{r} = [\frac{\partial z}{\partial x}, \frac{\partial
    z}{\partial y}, 1]^T. In most shape-from-shading literature, the partial derivatives
    are abbreviated using: $p = \frac{\partial z}{\partial x}, q = \frac{\partial
    z}{\partial y}$.'
