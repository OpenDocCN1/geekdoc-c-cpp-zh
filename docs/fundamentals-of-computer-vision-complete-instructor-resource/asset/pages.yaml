    # Invariance to Scale Change


    Suppose a region is zoomed by moving it closer to the camera. As discussed in
    section 5.4.6, this change is referred to as a _scale change_. Then the points
    after the change (assuming the scale change in the x and y directions are the
    same) are related to the points before the change by the relationship


    ```

    \(\begin{bmatrix} x'' \\ y'' \end{bmatrix} = \begin{bmatrix} \alpha & 0 \\ 0 &
    \alpha \end{bmatrix} \begin{bmatrix} x \\ y \end{bmatrix}.\)

    ```


    Invariance to scale can be accomplished by normalization as follows: When an image
    is scaled by \(\alpha\), the central moment becomes


    ```

    \(\eta_{pq} = \iint (\alpha x)^p (\alpha y)^q d(\alpha x) d(\alpha y) = \alpha^{p+q+2}
    \mu_{pq}.\)

    ```


    To find \(\alpha\), we require that the area of the scaled region, that is \(\eta_{00}\),
    always be one. In that case, \(\eta_{00} = \alpha^2 \mu_{00} = 1\), and therefore,
    \(\alpha = \mu_{00}^{-1/2}\). Substituting that into Eq. 10.54,


    ```

    \(\eta_{pq} = \alpha^{p+q+2} \mu_{pq} = (\mu_{00}^{-1/2})^{p+q+2} \mu_{pq}.\)

    ```


    Finally the normalized central moment can be written as


    ```

    \(\eta_{pq} = \frac{\mu_{pq}}{\mu_{00}^\gamma}\)

    ```


    where \(\gamma = \frac{p+q+2}{2}\) will lead to moments invariant to translation
    and scale changes.


