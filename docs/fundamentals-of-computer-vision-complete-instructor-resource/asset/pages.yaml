    As you have concluded by now, there are many algorithms and variations on algorithms
    for segmentation. But which is the best? We need an algorithm to evaluate the
    quality of segmentations. But which is the best such evaluation algorithm? We
    need an algorithm that evaluates the quality of evaluation algorithms that ...
    help? Are we getting into the halting problem!)


    Nevertheless, there are several approaches to evaluating segmentation quality.
    Since one result of a segmentation is edges, you could indirectly infer segmentation
    quality by measuring edge positions. Pratt [8.39] provides one such algorithm.


    Hoover et al. [8.25] proposed the following formalism for comparing the quality
    of a machine-segmented (MS) image using a human-segmented ground-truth (GT) image
    as the “gold standard.” Let M and G denote the MS and GT images respectively;
    let Mi (i = 1, ..., m) denote a patch in M; and let Gj (j = 1, ..., m) denote
    a region in G. |R| will denote the number of pixels in region R. Let Oj be the
    number of pixels that belong to both patch i in the MS image and region j in the
    GT image. Finally, let T be a threshold, 0.5 < T ≤ 1.0.


    There are five different segmentation results that may be obtained, only one of
    which is correct. They are defined as follows:


    +   1. A correct classification occurs when Oj ≥ T |M| and Oj ≥ T |G|.


    +   2. Oversegmentation occurs when a region in the GT image is broken into several
    patches in the MS image.


    +   3. Undersegmentation occurs when pixels in distinct regions in the GT image
    are identified as belonging to the same patch in the MS image. The definition
    is isomorphic to the definition of oversegmentation with the two images reversed.'
