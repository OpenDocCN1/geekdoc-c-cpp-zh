    in the continuous domain and sampled later. Consider a curve parametrized by arc
    length \(s\), and \(s\) is set to lie in the range \(0 \le s \le 1\), to provide
    scale invariance, then


    ```

    \(C(s) = [x(s), y(s)]^T.\)

    (10.63)

    ```'
