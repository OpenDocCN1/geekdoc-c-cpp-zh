  md: '+   • Associative property: Dilation is also associative, which means we can
    group images in a dilation in any way we choose without changing the result.

    +   \((A \oplus B) \oplus C = A \oplus (B \oplus C)\). (7.9)


    +   • Distributive property: This property says that in an expression where we
    need to dilate an image that is the union of two images, we can dilate first and
    then take the union. In another word, the dilation can be distributed over all
    the terms inside the parentheses. That is,

    +   \(A \oplus (B \cup C) = (A \oplus B) \cup (A \oplus C)\). (7.10)


    +   • Increasing property: If \(A \subseteq B\), then

    +   \(A \oplus K \subseteq B \oplus K\). (7.11)

    +   for any s.e. K. When this property holds, we say the operator is increasing.


    +   • Extensive and anti-extensive properties: If we say an operator is extensive,
    we mean that applying this operator to a set, A, produces an answer that contains
    A. If the s.e. contains the origin (that is, element (0,0)), dilation is extensive:

    +   \(A \oplus K \supseteq A, \text{if } (0, 0) \in K\) (7.12)


    As you might guess, erosion has some extensive properties as well: that is, erosion
    is “anti-extensive”, if \((0, 0) \in K\), then \(A \ominus K \subseteq A\), where
    \((0, 0)\) indicates the element at the origin.


    +   • Duality: Duality is similar to DeMorgan''s laws: it relates set complement,
    dilation, and erosion.

    +   \((A \oplus B)^c = A^c \ominus \tilde{B}\)

    +   \((A \ominus B)^c = A^c \oplus \tilde{B}\) (7.13)


    where the superscript c denotes set complement.


    +   • Other properties of erosion:

    +   \(A \ominus (B \oplus C) = (A \ominus B) \ominus C\) (7.14)

    +   \((A \cup B) \ominus C \supseteq (A \ominus C) \cup (B \ominus C)\) (7.15)

    +   \(A \ominus (B \cap C) \supseteq (A \ominus B) \cup (A \ominus C)\) (7.16)

    +   \(A \ominus (B \ominus C) = (A \ominus B) \oplus C\) (7.17)


    A cautionary note: You cannot do cancellation with morphological operators because
    dilation and erosion are not inverses of each other. For example: if \(A = (B
    \ominus C)\), and we dilute both sides by C, we would get \(A \oplus C = (B \ominus
    C) \oplus C\). If dilation and erosion were inverses of each other, the RHS would
    be just B. However, the RHS is in fact erosion of B by C and not simply B. We
    will explain the opening operator next.


