    # 3.2.2 Vector Spaces


    A vector space is a set of vectors and two operations, * and +, which are defined
    on those vectors. Furthermore for a set to be a vector space, it must satisfy
    the following two conditions:


    +   * If \( v_1 \) and \( v_2 \) are elements of a vector space named, say, \(
    V \), then \( v_1 + v_2 \) is also in \( V \).

    +   * If \( v_1 \) is an element of a vector space named, say, \( V \), and \(
    \alpha \) is a scalar defined consistent with \( V \), then \( \alpha v_1 \in
    V \).


    The property mentioned above has a name, *closure*. We say a vector space is *closed*
    under vector addition and scalar multiplication.


    The only vector spaces that usually concern us are those in which the vectors
    are composed of real numbers, using the familiar addition and multiplication of
    real numbers. However, so you can understand these concepts a bit more clearly,
    let’s construct a finite vector space.


    # An Example Vector Space


    Define a set of symbols \( S = \{a, b, c, d\} \) and two operations on those symbols
    named * and +. Since we only have four symbols, we get to define the operations
    with tables as illustrated in Table 3.1.


    Define a set \( V \) consisting of all the vectors of length 2, using the scalars
    in \( S \). Let’s see if the combination of \( V \) and the two operations defined
    above could be a vector space:


    Here are two vectors from \( V \), let’s add them:


    \( \begin{bmatrix} a \\ b \end{bmatrix} + \begin{bmatrix} c \\ d \end{bmatrix}
    = \begin{bmatrix} c \\ b \end{bmatrix} \). (3.5)'
