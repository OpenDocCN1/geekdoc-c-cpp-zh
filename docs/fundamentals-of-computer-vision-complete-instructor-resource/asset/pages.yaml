- pgno: 32
  md: '# ## 3.2.1 Vectors


    Vectors are always considered to be column vectors. If we need to write one horizontally
    for the purpose of saving space in a document, we use transpose notation. For
    example, we denote a vector that consists of three scalar elements as:


    $$ \mathbf{x} = [x_1 \ x_2 \ x_3]^T = \begin{bmatrix} x_1 \\ x_2 \\ x_3 \end{bmatrix}
    . $$


    # ## The Inner Product


    The inner product of two vectors is a scalar, \(c = x^T y\). Its value is the
    sum of products of the corresponding elements of the two vectors:


    $$ x^T y = \sum_i x_i y_i . $$


    You will also sometimes see the notation \(< x, y >\) used for inner product.
    We do not like this because it looks as an expected value of a random variable.
    One sometimes also sees the “dot product” notation \(x \cdot y\) for inner product.


    The magnitude of a vector is \(|\mathbf{x}| = \sqrt{\mathbf{x}^T \mathbf{x}}\).
    If \(|\mathbf{x}| = 1\), \(\mathbf{x}\) is said to be a unit vector. If \(\mathbf{x}^T
    \mathbf{y} = 0\), then \(\mathbf{x}\) and \(\mathbf{y}\) are orthogonal. If \(\mathbf{x}\)
    and \(\mathbf{y}\) are orthogonal unit vectors, they are orthonormal.


    # ## The Outer Product


    While the inner product of two vectors generates a scalar, the outer product generates
    a matrix.


    The outer product of two vectors is a matrix, \(\mathbf{x} \otimes \mathbf{y}
    = \mathbf{x} \mathbf{y}^T\). Each element of this matrix can be written as \((\mathbf{x}
    \mathbf{y}^T)_{ij} = x_i y_j\). For example, suppose \(\mathbf{x}\) is of 2 dimensions
    and \(\mathbf{y}\) is of 3 dimensions, then these two vectors is a matrix of dimension
    \(2 \times 3\),


    $$ \mathbf{x} \otimes \mathbf{y} = \begin{bmatrix} x_1 \\ x_2 \end{bmatrix} [y_1
    \ y_2 \ y_3] = \begin{bmatrix} x_1 y_1 & x_1 y_2 & x_1 y_3 \\ x_2 y_1 & x_2 y_2
    & x_2 y_3 \end{bmatrix} . $$


    The outer product is also sometimes called the tensor product.


    # ## The Cross Product


    There is yet another product operation between vectors, the cross product, which
    returns a vector. This again contrasts the inner product that returns a scalar
    and the outer product that returns a matrix.


    Given a vector \(\mathbf{x} = [x_1 \ x_2 \ x_3]^T\), we define the matrix


    $$ [\mathbf{x}]_\times = \begin{bmatrix} 0 & -x_3 & x_2 \\ x_3 & 0 & -x_1 \\ -x_2
    & x_1 & 0 \end{bmatrix} . \quad (3.1) $$'
