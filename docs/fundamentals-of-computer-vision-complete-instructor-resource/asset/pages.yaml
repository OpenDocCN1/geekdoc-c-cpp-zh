    # 9.9 Conclusion


    In this chapter, the concept of parametric transforms was introduced in the form
    of the Hough transform and its descendents, all of which use accumulator arrays.
    An accumulator array allows for easy detection of consistency, since “things”
    that are consistent all add to the same accumulator cell, or at least to nearby
    accumulator cells. By constructing the accumulator array by adding hypotheses,
    we also gain a measure of noise immunity, since inconsistent solutions tend not
    to contribute to the globally consistent solution.


    The term “Hough transform” is really a misnomer when applied to finding circles,
    ellipses, etc. Only the original work by Hough [9.4] to find straight lines should
    really be referred to by the term. However, many authors have come to use the
    term “Hough transform” when they really mean “parametric transform”. The exception
    to this is the Generalized Hough Transform [9.1], which has no parameters except
    the properties of the curve itself.


    Since curvature represents rates of change of normal direction, the Gauss map
    can be related back to curvature. The invertibility of the Gauss map and invariance
    under rotation and translation are discussed in more detail in [9.5]. The map
    also finds application in identifying the vanishing points in an image [9.6].


    Clustering, mentioned in this chapter as a way to find peaks in the accumulator
    and in section 8.3 as a way to group colors, is a general and powerful tool. For
    example, McLean and Kotturi [9.7] use one version of clustering [9.3] to locate
    the vanishing points in an image.


    The topics listed in this chapter do not include all applications of accumulator
    methods. However the literature provides a variety of examples such as finding
    parabolas [9.10].


