    The VCD algorithm is summarized as follows:


    +   **VCD Algorithm**

    +   * Compute c(x, y) using Eq. 6.10, or a similar equation, and store it as an
    image so you can look at it during debugging.

    +   * For every pixel, compute the change in that pixel using Eq. 6.8. Save those
    values as an image so you can view them. If you have a bug, it will probably show
    up as zeros in this image.

    +   * Multiply each pixel in the change image by a small number, e.g., \alpha
    = 0.01.

    +   * Add the result of the multiplication to the current value of f to get the
    next value of f.

    +   * The algorithm may be expressed as a single equation is f(x, y) <- f(x, y)
    + 0.01\nabla(c(x, y)\nabla f(x, y)).


    In Figure 6.7 (middle column) results of running VCD on the three test images
    are illustrated. The algorithm has produced regions with reduced noise and sharp
    edges. It has modified the clutter substantially. The middle column of Figure
    6.8 illustrates the results using random color maps.


    One of the problems with VCD is that it is difficult to find a good stopping point
    without modifying the algorithm. Allowing it to run for too long produces a result
    such as Figure 6.9.'
