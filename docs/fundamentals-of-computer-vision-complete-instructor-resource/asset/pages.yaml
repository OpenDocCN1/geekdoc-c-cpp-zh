    Unlike the k-means algorithm, mean shift does not assume prior knowledge of the
    number of clusters, due to the nonparametric nature of the algorithm. The number
    of modes automatically indicates the number of clusters. In addition, since mean
    shift is based on density estimation, it can work on arbitrarily shaped clusters.


    The key parameter in the mean shift algorithm is the so-called window size, h,
    that specifies the radius or size of the window/kernel function. The mean value
    is calculated within each window. The window size determines, indirectly, the
    distance between clusters. Hence instead of having to predefine the number of
    clusters as in the k-means algorithm, the mean shift algorithm automatically yields
    the clustering results based on the specified window size. The mean shift algorithm
    is described in Figure 8.14.


    Cheng [8.16] showed that if one uses a Gaussian kernel instead of a flat one,
    the mean shift procedure is equivalent to a gradient ascent process, making clustering
    analysis a deterministic problem of finding a fixed point of mean shift that characterizes
    the data.


