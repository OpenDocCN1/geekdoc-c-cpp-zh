    # ## 10.6.2 The Shape Context


    The Shape Context [10.5] [10.6] algorithm for matching 2D shapes was introduced
    by Belongie et al. in [10.4]. As illustrated in Figure 10.17, given a contour
    C, represented as an ordered set of points, C = {C1, C2, ... CN}, let P ∈ C. For
    any element of C, we can compute the vector from that point to P, and thus can
    construct an ordered set of such vectors, ΔP = (P - C1, P - C2, ... P - CN). The
    elements of ΔP are converted to log-polar coordinates and coarsely quantized,
    and then a two-dimensional histogram is constructed, defining the shape context
    of point P:


    \(h(P, \theta, r) = \sum_j \delta(\theta - \theta_j, r - r_j) \quad j = 1, \dots,
    N, \quad (10.60)\)


    where the \(\delta\) denotes the Kronecker delta:


    \(\delta(x, y) = \begin{cases} 1 & \text{if } x = 0 \text{ and } y = 0 \\ 0 &
    \text{otherwise} \end{cases}\)


    The histogram is simply a count of how many times each particular (angle, log-distance)
    pair occurs on this contour. Since the histogram is of a fixed size, in this case,
    60 bins, we may index it with a single index and denote it by h(P, k). We refer
    to h(P, k) as the shape context of point P in curve C.


    Clearly, the choice of a reasonable resolution for the histogram depends on N.


    The shape context for a particular contour is the collection of the shape contexts
    of all the points in that contour.


    In the absence of occlusion, the shape context may be made invariant to similarity
    transforms [10.4]. Invariance to translation is automatic, since the Shape Context
    only uses relative distances and angles. Invariance to scale is accomplished by
    dividing all distances \(\Delta_P\) by the median of all such distances in the
    shape. Since a log-polar system is used, the calculation used is actually a subtraction
    of logs.


    5 In [10.6] the histogram has 12 equally spaced angle bins and 5 equally spaced
    log-radius bins.'
