    \(\epsilon(m) = E \left\{ \sum_{i=m+1}^d \sum_{j=m+1}^d (y_i - \alpha_i) \mathbf{b}_i^T
    (y_j - \alpha_j) \mathbf{b}_j \right\}\) (10.17)


    \(= E \left\{ \sum_{i=m+1}^d \sum_{j=m+1}^d (y_i - \alpha_i)(y_j - \alpha_j) \mathbf{b}_i^T
    \mathbf{b}_j \right\}\) (10.18)


    noting that \( y_i \) is a scalar, and recalling Eq. 10.10, this becomes


    \(\epsilon(m) = \sum_{i=m+1}^d E \{(y_i - \alpha_i)^2\}.\) (10.19)


    To find the optimal choice for \( \alpha_i \), minimize with respect to \( \alpha_i
    \)


    \(\frac{\partial \epsilon}{\partial \alpha_i} = \frac{\partial}{\partial \alpha_i}
    E \{(y_i - \alpha_i)^2\} = E \{-2(y_i - \alpha_i)\},\) (10.20)


    which can be set to zero, resulting in


    \(\alpha_i = E(y_i) = \mathbf{b}_i^T E\{\mathbf{x}\}.\) (10.21)


    So, we should replace those elements of y that we do not measure by their expected
