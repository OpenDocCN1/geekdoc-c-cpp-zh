  md: '# 3.3.3 Simulated Annealing


    We will base much of the following discussion of minimization techniques on an
    algorithm known as “simulated annealing” (SA), which proceeds below as Algorithm
    3.1. (See the book by Aarts and van Laarhoven for more detail [3.4].)


    ```

    Algorithm 3.1: Simulated annealing.

    Data: Choose (at random) an initial value of x, and an initial value of T > 0.

    Result: x̂ that minimizes H.

    1 while T > Tmin do

    2     Generate a point y which is a “neighbor” of x. (The exact definition of
    “neighbor” will be discussed soon.);

    3     if H(y) < H(x) then

    4         Replace x with y;

    5         also denoted as “accepting y”

    6     end

    7     else

    8         Compute Py = exp(−(H(y)−H(x))/T);

    9         if Py ≥ R then

    10            Replace x with y, where R is a random number uniformly distributed
    between 0 and 1;

    11        end

    12    end

    13    Decrease T slightly;

    end

    ```


    Simulated annealing is most easily understood in the context of combinatorial
    optimization. In this case, one definition of a “neighbor” of a vector x is another
    vector y, such that only one of the elements of x is changed (discretely) to create
    y.12 Thus, if x is binary and of dimension d, one may choose a neighbor y = x
    ⊕ z, where z is a binary vector in which exactly one element is non-zero, and
    that element is chosen at random, and ⊕ represents exclusive OR.


    In lines 3 through 5 of the algorithm, we perform a descent. Thus we “always fall
    down hill.”


    In lines 7 through 10, we provide a mechanism for sometimes making uphill moves.
    Initially, we ignore the parameter T and note that if y represents an uphill move,
    the probability of accepting y is proportional to exp(−(H(y) − H(x))). Thus, uphill
    moves can occur, but are exponentially less likely to occur as the size of the
    uphill move becomes larger. The likelihood of an uphill move is, however, strongly
    influenced by T. Consider the case that T is very large. Then (H(y)−H(x))/T ≤
    1 and Py ≈ 1. Thus, all moves will be accepted. As T is gradually reduced, uphill
    moves become gradually less likely until for low values of T (T << (H(y) − H(x)),
    such moves are essentially impossible.'
