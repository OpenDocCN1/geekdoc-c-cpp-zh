    # ## 3.3.2 Local vs. Global Minima


    Gradient descent suffers from a serious problem: its solution is strongly dependent
    on the starting point. If started in a "valley," it will find the bottom of that
    valley. We have no assurance that this particular minimum is the lowest, or "global,"
    minimum.


    Before continuing, we will find it useful to distinguish two kinds of nonlinear
    optimization problems:


    +   **Combinatorial optimization.** In this case, the variables have discrete
    values, typically 0 and 1. With **x** consisting of _d_ binary-valued variables,
    2_<sup>d</sup>_ possible values exist for **x**. Minimization of _H_(**x**) then
    (in principle) consists of simply generating each possible value for **x** and
    consequently of _H_(**x**), and choosing the minimum. Such "exhaustive search"
    is in general not practical due to the exponential explosion of possible values.
    We will find that simulated annealing provides an excellent approach to solving
    combinatorial optimization problems.


    +   **Image optimization.** Images have a particular property: Each pixel is influenced
    only by its local neighborhood (this will be explained in more detail later);
    however, the pixel values are continuously valued, and there are typically many
    thousand such variables. We will find that mean field annealing is appropriate
    for the solution of these problems. See more discussion of mean field annealing
    in section 6.5.3.'
