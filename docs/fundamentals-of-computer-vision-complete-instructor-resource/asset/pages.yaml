    # 8.6 Watersheds: Segmentation Based on Brightness Surface


    In this section, you will learn to think about moving up and down the brightness
    surface as water would move. We continue to consider the brightness function f(x,
    y) as if f represented vertical distance, and the brightness image is thought
    of as a surface.


    Suppose we pour water onto that surface. Water runs downhill, and (assuming it
    isn''t absorbed or evaporated) will eventually come to rest at some place that
    is a minimum of local elevation. In a digital (sampled and quantized) image, such
    a minimum is not necessarily a single pixel. It could be a set of neighboring
    pixels, all of which have the same brightness. We call that final, lowest set
    of points a drain. In general, there are many drains in an image. Given a single
    point (x, y) on the surface, place a single drop of water on the surface at that
    point, and follow it until it comes to rest at some drain. The collection of all
    surface points that flow to a single drain, say drain i, is referred to as the
    basin or catchment basin associated with that drain.


    Some surprising problems occur when attempting to use basins to segment images.
    First, from a single point, water will flow in the direction of steepest slope,
    but it is certainly possible that there might be equal, steepest slopes in more
    than one direction. So the problem of tracking where that one drop of water flows
    could be challenging and have high computational complexity. But, instead of following
    water as it flows down, let''s instead start at the drain, and find all the neighboring
    points that definitely flow into that drain. That calculation can be done locally.
    Then, we find the points that drain into those points, etc.


