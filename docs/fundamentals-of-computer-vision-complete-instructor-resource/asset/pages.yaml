  md: 'Then, the edge strength is described by the two numbers \(\frac{\partial f}{\partial
    x} = a, \frac{\partial f}{\partial y} = b\). The rate of change of brightness
    at the point, \((x, y)\), is represented by the gradient vector


    ```

    \(\nabla f = \begin{bmatrix} \frac{\partial f}{\partial x} \\ \frac{\partial f}{\partial
    y} \end{bmatrix}^T = [a \ b]^T.\) (5.13)

    ```


    The approach followed here is to find a, b, and c given some noisy, blurred measurement
    of f, and the assumption of Eq. 5.12. To find those parameters, first observe
    that Eq. 5.12 may be written as f(x, y) = a^T x where the vectors a and x are
    a^T = [a b c] and x^T = [x y 1].


    Suppose we have measured brightness values g(x, y) at a collection of points \(\chi
    \subset \mathbb{Z} \times \mathbb{Z}\) (Z is the set of integers) in the image.
    Over that set of points, we seek the plane that best fits the data. To accomplish
    this objective, write the error as a sum-squared error function of the measurement,
    g(x, y), and the (currently unknown) function f(x, y).


    ```

    \(E = \sum_x (f(x, y) - g(x, y))^2 = \sum_x (\mathbf{a}^T \mathbf{x} - g(x, y))^2.\)

    ```


    Expanding the square and eliminating the functional notation for simplicity, we
    find


    ```

    \(E = \sum_x (\mathbf{a}^T \mathbf{x})(\mathbf{a}^T \mathbf{x}) - 2\mathbf{a}^T
    \mathbf{xg} + g^2.\)

    ```


    Remembering that for vectors a and x, a^T x = x^T a, and taking the summation
    through, we have


    ```

    \(E = \sum \mathbf{a}^T \mathbf{x} \mathbf{x}^T \mathbf{a} - 2 \sum \mathbf{a}^T
    \mathbf{xg} + \sum g^2 = \mathbf{a}^T \left( \sum \mathbf{x} \mathbf{x}^T \right)
    \mathbf{a} - 2\mathbf{a}^T \sum \mathbf{xg} + \sum g^2.\)

    ```


    Now we wish to find the a (the parameters of the plane) that minimizes E; so we
    may take derivatives and set the result to zero. (This is the derivative of a
    scalar with respect to a vector, so the result must be a vector.) We obtain


    ```

    \(\frac{dE}{d\mathbf{a}} = 2\mathbf{a}^T \left( \sum \mathbf{x} \mathbf{x}^T \right)
    - 2 \sum \mathbf{xg} = 0.\) (5.14)

    ```


    Let''s call \(\sum \mathbf{x} \mathbf{x}^T = S\) (it is the "scatter matrix")
    and see what Eq. 5.14 means: consider a neighborhood \(\chi\) that is symmetric
    about the origin. In that neighborhood, suppose x and y only take on values of
    -1, 0, and 1. Then


    ```

    \(S = \sum \mathbf{x} \mathbf{x}^T = \sum \begin{bmatrix} x \\ y \\ 1 \end{bmatrix}
    [x \ y \ 1] = \begin{bmatrix} \sum x^2 & \sum xy & \sum x \\ \sum xy & \sum y^2
    & \sum y \\ \sum x & \sum y & \sum 1 \end{bmatrix}\)

    ```


    which, for the neighborhood described, is


    ```

    \(\begin{bmatrix} 6 & 0 & 0 \\ 0 & 6 & 0 \\ 0 & 0 & 9 \end{bmatrix}.\)

    ```


    If you do not see where those values came from, note that the positive direction
    for y is down.'
