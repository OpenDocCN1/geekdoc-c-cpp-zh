  md: 'more than three measurements. We believe that measurements are not perfect
    and there is some advantage to taking additional ones. First, define a vector
    \(\mathbf{R} = [R_1 R_2 \dots R_k]^T\). Define an objective function \(E\) that
    incorporates the desire to find an optimal solution:


    ```

    \(\displaystyle E = \sum_{i=1}^k (\mathbf{R}_i - \mathbf{N}\mathbf{n})^2.\) (12.87)

    ```


    Using each of the \(\mathbf{R}_i\) as a column, construct a matrix denoted \(R\).
    Then we have


    ```

    \(\displaystyle E = (\mathbf{R} - \mathbf{Nn})^T(\mathbf{R} - \mathbf{Nn}).\)
    (12.88)

    ```


    Expand the product


    ```

    \(\displaystyle E = R^T R - 2\mathbf{n}^T N^T R + \mathbf{n}^T N^T N \mathbf{n}.\)
    (12.89)

    ```


    We wish to find the surface normal vector \(\mathbf{n}\) that minimizes this sum-squared
    difference \(E\), so we differentiate \(E\) with respect to \(\mathbf{n}\).


    ```

    \(\displaystyle \nabla_{\mathbf{n}} E = -2\mathbf{n}^T R + 2N^T N \mathbf{n}\)
    (12.90)

    ```


    and setting the gradient to zero we have


    ```

    \(\displaystyle N^T N \mathbf{n} = N^T R\) (12.91)

    ```


    or


    ```

    \(\displaystyle \mathbf{n} = (N^T N)^{-1} N^T R.\) (12.92)

    ```


    (In case you have not recognized it yet, the pseudoinverse just appeared). That
    was a lot of work. Let''s see if there is an easier way:


    Go back to Eq. 12.83, again omitting the \(r_0\) for clarity, and multiply both
    sides by \(N^T\).


    ```

    \(\displaystyle N^T R = N^T N \mathbf{n}.\) (12.93)

    ```


    Multiply both sides by \((N^T N)^{-1}\) and we find the same result as Eq. 12.92.


    So why did we go to so much trouble – all the work of Eqs. 12.87 through 12.91
    seems like a waste. We have now demonstrated to you that multiplying by the pseudoinverse
    \((N^T N)^{-1} N^T\) produces the minimum squared error estimate of an overdetermined
    linear system. That is a significant result, important in the case of photometric
    stereo, and in many other applications as well.


