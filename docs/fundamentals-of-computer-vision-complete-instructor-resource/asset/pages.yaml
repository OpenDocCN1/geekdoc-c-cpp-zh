    # 11.7.3 Springs and Templates


    Another approach to the matching problem is provided by the Springs and Templates
    philosophy [11.14]. This is a hybrid model-matching paradigm that involves both
    graph- structured matching and template matching. The model is a set of rigid
    “templates” connected by “springs” that characterize how much deformation must
    be applied to the model to make it match the image. Figure 11.17 illustrates this
    concept using a simple model of a human face. Specific features such as eyes are
    matched by iconic methods such as template matching. However, in order to match
    an entire face, distances between the best matching locations of templates are
    also recorded. A match is then based on minimizing a total cost, as follows.


    ```

    Cost = \sum_{d \in templates} TemplateCost(d, F(d))

    + \sum_{d,e \notin xref} SpringCost(F(d), F(e)) + \sum_{c \in missing} MissingCost(c).
    (11.24)

    ```'
