    # ## 9.4 Finding Ellipses


    Only if the major axis of the ellipse is horizontal does an ellipse satisfy the
    equation


    ```

    \(\frac{x^2}{\alpha^2} + \frac{y^2}{\beta^2} = 1, \quad \alpha > \beta\) (9.14)

    ```


    where \(\alpha\) and \(\beta\) are scalars. A similar equation results if the
    major axis is vertical, but for all other rotations of the ellipse relative to
    the coordinate axes, only an equation of the form


    ```

    \(ax^2 + cy^2 + bxy + dx + ey + f = 0\) (9.15)

    ```


    is sufficient. But this is the equation of a general conic, and is not constrained
    to be an ellipse. One could add the constraint, \(b^2 - 4ac < 0\), but adding
    this constraint would complicate the fitting process into a much more difficult
    problem. Instead, Xie and Ji [9.11] provide a simple algorithm for finding ellipses
    that uses an accumulator-based philosophy.


    The algorithm proceeds by choosing two points to be the major axis of an ellipse,
    and then looking for consistency to determine that this pair is in fact the major
    axis.


    Figure 9.8 illustrates the geometric features of an ellipse. Examination of that
    figure reveals that knowledge of the major axis and its end points also determines
    the center and the orientation, leaving only the length of the minor axis to be
    determined. The following algorithm outlines the method:


    +   1. Set parameters Mm and MM, the minimum and maximum major axis length, as
    well as nm and nM, the minimum and maximum minor axis length.


