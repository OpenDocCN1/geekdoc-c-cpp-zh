    proper brightness levels over many iterations. The kernel also needs to be symmetric.
    That essentially defines the second derivative of a Gaussian. The most reasonable
    set of values close to those given, which satisfy symmetry and summation to zero
    are $\{1, 2, 1\}$. However, this does not teach us very much. Let''s look at a
    $5 \times 1$ kernel and see if we can learn a bit more. We require:


    +   - the elements of the kernel should approximate the values of the appropriate
    derivative of a Gaussian as closely as possible;

    +   - the elements must sum to zero for a derivative kernel;

    +   - the kernel should be symmetric about its center, unless you want to do special
    processing.


    We can calculate the elements of a 5-element one-dimensional Gaussian, and if
    we do so, assuming $\sigma = \frac{1}{\sqrt{3}}$, for $x = \{-2, -1, 0, 1, 2\}$,
    we get $\{0.0565, 0.2251, -2.0730, 0.9251, 0.0565\}$. Unfortunately, those numbers
    do not sum up to zero. It is important that the kernel values sum to zero, but
    not quite so important that the actual values be precise. So what do we do in
    a case like this? We use constrained optimization. One strategy is to set up a
    problem to find a function that yields these values as closely as possible, but
    that integrates to zero. For more complex problems, the authors use Interopt [5.4],
    to solve numerical optimization problems, but you can solve this problem without
    using numerical methods. This is accomplished as follows. First, understand the
    problem (presented for the case of 5 points given above): We wish to find five
    numbers as close as possible to $\{0.0565, 0.9251, -2.0730, 0.9251, 0.0565\}$
    that satisfy the constraint that the five sum to zero. Due to symmetry, we actually
    only have three numbers, which we will denote $[a, b, c]$. For notational convenience,
    introduce three constants $\alpha = 0.0565, \beta = 0.9251,$ and $\gamma = -2.073$.


    Thus, to find $a, b,$ and $c$ that resemble these numbers, we write the MSE form
    for the sum


    ```

    $H_a(a, b, c) = 2(a - \alpha)^2 + 2(b - \beta)^2 + (c - \gamma)^2.$ (5.22)

    ```


    and minimizing $H_a$ will produce $a, b,$ and $c$ that are close to $\alpha, \beta,$
    and $\gamma$. In order to further satisfy the "sum to zero" requirement of the
    kernel values, we need to add a constraint to $H_a$ that requires $2a + 2b + c
    = 0$.


    Using the concept of Lagrange multipliers, we can find the best choice of $a,
    b,$ and $c$, by minimizing a different objective function


    ```

    $H(a, b, c) = 2(a - \alpha)^2 + 2(b - \beta)^2 + (c - \gamma)^2 + \lambda(2a +
    2b + c).$ (5.23)

    ```'
