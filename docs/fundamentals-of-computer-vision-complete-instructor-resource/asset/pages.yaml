  md: 'The resulting algorithm uses accumulator arrays to search for consistency in
    shape recognition.


    We begin with some definitions:


    **Object** An object, to SKS, is anything in an image that we need to recognize.
    It could be the shape of a silhouette or the boundary of a region, if the application
    is to recognize objects by their silhouette. It could also be the neighborhood
    of an interest point, if the application is to find correspondences such as SIFT
    (see section 11.4) or a point on a boundary curve as described in this section.
    It could even be a complex scene made up of a number of features (e.g., a statue).
    In this chapter, we will describe the application to determining and matching
    a boundary of a region.


    **Feature point** Every object is made up of one or many feature points. The boundary
    of a silhouette consists of points. Not every point is necessarily a feature point,
    and those that are not do not enter into the algorithm. A feature point in an
    image could be an interest point, to be described in section 11.5 or a point where
    the boundary changes sign.


    **Property list** Each feature point has a list of properties. On the contour
    of a silhouette, a property might be the curvature of the contour at the feature
    point. In an image of a region, a property list might include the curvature and
    hue of the curve at that point. In an image analysis application, properties of
    the feature point might be the same as the features of the neighborhood. We use
    the symbol v for the property list, written as a vector. The one exception to
    this is when the property list has a single element, usually curvature \(\kappa\),
    and in that case the symbol for the scalar (e.g., \(\kappa\)) is used rather than
    v.


    **Reference point** The object being recognized usually has a single reference
    point.9 The distance from the reference is denoted by the symbol \(\rho\). The
    reference point is usually chosen to be the center of gravity of the region.


    In SKS, the general philosophy is as follows:


    **Make a model.** Construct a model that has the form


    ```

    m(\rho, v) = \frac{1}{Z} \sum_{i=1}^n \delta(\rho - \rho_i) \delta(||v - v_i||),
    \quad (10.71)

    ```


    where the Kronecker delta \(\delta(x) = \begin{cases} 1 & \text{if } x = 0 \\
    0 & \text{otherwise} \end{cases}\) . Such a model simply counts the number of
    times a point with property v occurs at the distance \(\rho\) from the reference
    point. Suitably normalized, this count can approximate a probability. To allow
    for noise and errors in measurement, the model equation may be modified, allowing
    the delta functions to be replaced by Gaussians.


    ```

    m(\rho, v) = \frac{1}{Z} \sum_{i=1}^n \exp \left( - \frac{(\rho - \rho_i)^2}{2\sigma_\rho^2}
    \right) \exp \left( - \frac{||v - v_i||^2}{2\sigma_v^2} \right) \quad (10.72)

    ```


    where Z is the normalization, discussed later.


    9 If partial occlusion can occur, then multiple reference points may be used.'
