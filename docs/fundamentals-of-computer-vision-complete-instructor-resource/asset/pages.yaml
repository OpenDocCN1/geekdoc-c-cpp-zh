  md: 'Some important (and often forgotten) properties: If \(A\) and \(B\) are conformable,
    then


    \((AB)^T = B^T A^T\) (3.13)


    and


    \((AB)^{-1} = B^{-1} A^{-1}\) (3.14)


    if \(A\) and \(B\) are invertible at all.


    A couple of other useful properties related to determinant (det) and trace (tr)
    are


    \(\det(AB) = \det(BA) \quad \text{and} \quad \text{tr}(AB) = \text{tr}(BA)\)


    which is only true, of course, if \(A\) and \(B\) are square.


    # Orthonormal Transformation


    If a matrix \(A\) satisfies


    \(AA^T = A^T A = I\) (3.15)


    then obviously, the transpose of the matrix is the inverse as well, and \(A\)
    is said to be an orthonormal transformation (OT), which will correspond geometrically
    to a rotation. If \(A\) is a \(d \times d\) orthonormal transformation, then the
    columns of \(A\) are orthonormal, linearly independent, and form a basis spanning
    the space of \(\Re^d\). For \(\Re^3\), three convenient OTs are the rotations
    about the Cartesian axes (assuming the right-handed coordinate system\*) with
    \(\theta\) being the rotation angle defined in the counterclockwise direction.


    \(R_x = \begin{bmatrix} 1 & 0 & 0 \\ 0 & \cos \theta & -\sin \theta \\ 0 & \sin
    \theta & \cos \theta \end{bmatrix}, R_y = \begin{bmatrix} \cos \theta & 0 & \sin
    \theta \\ 0 & 1 & 0 \\ -\sin \theta & 0 & \cos \theta \end{bmatrix}, R_z = \begin{bmatrix}
    \cos \theta & -\sin \theta & 0 \\ \sin \theta & \cos \theta & 0 \\ 0 & 0 & 1 \end{bmatrix}\)
    (3.16)


    Suppose \(R\) is an OT, and \(\mathbf{y} = R\mathbf{x}\), then both \(\mathbf{x}\)
    and \(\mathbf{y}\) have the same magnitude:


    \(|\mathbf{y}| = |\mathbf{x}|\) (3.17)


    Although the three rotation matrices in Eq. 3.16 share some common characteristics,
    i.e., there are always a column of zeros and a single 1 as well as a row of zeros
    and a single 1, these characteristics are not the necessary condition to make
    a rotation matrix. In fact, rotation matrices share two interesting properties:


    +   - the product of two rotation matrices (i.e., OT) is a rotation matrix, and


    +   - any OT can be considered a rotation matrix, where the rotation is about
    some axis.


    In the following, we show an example that well demonstrates the above two properties.


    3 We assume you know the meanings of transpose, inverse, determinant, and trace.
    If you do not, you should not be taking this course.


    4 Right-handed coordinate system indicates that the axis about which the rotation
    (indicated by circling the fingers) occurs points toward the observer.'
