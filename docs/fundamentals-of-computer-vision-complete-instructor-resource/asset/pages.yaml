    second die does not depend at all on what is rolled with die number 1.


    Independence of events is an important implication. It means that the joint probability
    of the two events is equal to the product of their individual probabilities, and
    the conditional probabilities:


    ```

    Pr(a, b) = Pr(a|b)Pr(b) = Pr(a)Pr(b) = Pr(b|a)Pr(a). (3.56)

