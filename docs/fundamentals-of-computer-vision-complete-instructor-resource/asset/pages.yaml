- pgno: 233
  md: '# # 10 Representing and Matching Shape


    > > Shape is what is left when the effects associated with translation, scaling,
    and rotation are filtered away.

    > > – David Kendall


    # ## 10.1 Introduction


    In this chapter, we assume a successful segmentation, and explore the question
    of characterization of the resulting regions. We begin by considering two-dimensional
    regions that are denoted by each pixel in the region having value 1 and all background
    pixels having value 0. We assume only one region is processed at a time, since
    in studying segmentation, we learned how to realize these assumptions.


    When thinking about shapes, and measures for shapes, it is important to keep in
    mind that certain measures may have invariance properties. That is, a measure
    may remain the same if the object is (for example) rotated. Consider the height
    of a person in a picture – if the camera rotates, the apparent height of the person
    will change, unless, of course, the person rotates with the camera.


    The common transformations considered in this chapter are those described by some
    linear operation on the shape matrix, discussed in section 4.2.3.


    In the remainder of this chapter, we will be constantly thinking about operations
    that exhibit various invariances, and can be used to match shapes of regions.


    +   - (Section 10.2) To understand invariances, we must first understand the deformations
    that may alter the shape of a region, and most of those can be described by matrix
    operations.

    +   - (Section 10.3) One particularly important matrix is the covariance matrix
    of the distribution of points in a region, since the eigenvalues and eigenvectors
    of that matrix describe shape in a very robust way.

    +   - (Section 10.4) In this section, we introduce some important features used
    to describe a region. We start from some simple properties of a region like perimeter,
    diameter, and thinness. We then extend the discussion to some invariant features
    (to various linear transformations) like moments, chain codes, Fourier descriptors,
    and the medial axis.

    +   - (Section 10.5) Since, in earlier sections, we have represented the regions
    by sets of numbers called features, in this section, we discuss how to match such
    sets of numbers.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - (Section 10.6) From the boundary of a homogeneous region, the shape is
    determined. In this section, four different approaches to describing and matching
    boundaries are discussed. These descriptors represent more general methods for
    describing shapes at a more abstract level.

    +   - (Section 10.7) A boundary could be written as a long vector, and so may
    be thought of as a point in a very high dimensional space. This provides yet another
    way to match and to interpolate shapes. In this section, the concept is introduced
    and demonstrated as a method to interpolate between shapes.


    # 10.2 Linear Transformations


    One important topic in this chapter is invariance to various types of linear transformations
    on regions. That is, consider all the pixels on the boundary as we did in creating
    the shape matrix, and write the x, y coordinates of each pixel as a 2-vector,
    and then operate on that set of vectors. In general, no distinction needs to be
    made (here) between whether we are thinking of the entire region or just its boundary.


    # 10.2.1 Rigid Body Motions


    The first transformations of interest are the orthogonal transformations such
    as $R_Z = \begin{bmatrix} \cos \theta & -\sin \theta \\ \sin \theta & \cos \theta
    \end{bmatrix}$, which operate on the coordinates of the pixels in a region to
    produce new coordinate pairs. For example, $\begin{bmatrix} x'' \\ y'' \end{bmatrix}
    = R_Z \begin{bmatrix} x \\ y \end{bmatrix}$ where $R_Z$ is as defined above, represents
    a rotation about the Z axis, defined to the axis normal to the image plane. Given
    a region $s$, we can easily construct its shape matrix, which we denote by $S$,
    in which each column contains the x, y coordinates of a pixel in the region. For
    example, suppose the region $s = \{(1, 2), (3, 4), (1, 3), (2, 3)\}$, then the
    corresponding coordinate matrix $S$ is $S = \begin{bmatrix} 1 & 3 & 1 & 2 \\ 2
    & 4 & 3 & 3 \end{bmatrix}$. We can apply an orthogonal transformation such as
    a rotation, to the entire region by matrix multiplication


    ```

    $$ S'' = \begin{bmatrix} \cos \theta & -\sin \theta \\ \sin \theta & \cos \theta
    \end{bmatrix} \begin{bmatrix} 1 & 3 & 1 & 2 \\ 2 & 4 & 3 & 3 \end{bmatrix} $$

    ```


    That works wonderfully well for rotations, but how can we include translation
    in this formalism?


    The first way to add translation is to rotate first, using a 2 x 2 rotation and
    then add the translation, that is


    ```

    $$ S'' = R S + \begin{bmatrix} dx \\ dy \end{bmatrix} \quad (10.1) $$

    ```


    and this works fine, but it requires two operations, a matrix multiplication and
    an addition. Wouldn''t it be nice if it could be done in a single matrix multiplication?'
