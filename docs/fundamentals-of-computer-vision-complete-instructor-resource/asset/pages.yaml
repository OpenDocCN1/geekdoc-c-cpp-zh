    axis through an angle \(\theta\), a rotation described by


    ```

    \(\tilde{R} = \begin{bmatrix} \cos \theta & 0 & \sin \theta \\ 0 & 1 & 0 \\ -\sin
    \theta & 0 & \cos \theta \end{bmatrix}.\) (12.16)

    ```


