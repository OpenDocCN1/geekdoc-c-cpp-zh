  md: '# 2 Writing Programs to Process Images


    > Computer Science is not about computers any more than astronomy is about telescopes.

    > - E.W Dijkstra


    # 2.1 Introduction


    One may take two approaches to writing software for image analysis, depending
    on what one is required to optimize. One may write in a style that optimizes/minimizes
    programmer time, or one may write to minimize computer time. In this course, computer
    time will not be a concern (at least not usually), but your time will be far more
    valuable. For that reason, we want to follow a programming philosophy that produces
    correct, operational code in a minimal amount of programmer time. The programming
    assignments in this book are specified to be written in C or C++, rather than
    in MATLAB or JAVA. This is a conscious and deliberate decision. MATLAB in particular
    hides many of the details of data structures and data manipulation from the user.
    Most of the time, that’s a good thing. However, in the course of teaching variations
    of this course for many years, the authors have found that many of those details
    are precisely the details that students need to grasp in order to effectively
    understand what image processing (particularly at the pixel level) is all about.


    In this book, at least initially, we want the students to write code that works
    at the pixel level, so they come to understand what the computer is really doing.
    Later in the course, the student will slowly move up in levels of abstraction.
    We point the reader to [2.2, 2.1] for texts that emphasize the use of MATLAB.


