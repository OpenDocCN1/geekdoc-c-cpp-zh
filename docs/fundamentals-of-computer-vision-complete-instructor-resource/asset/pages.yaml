    # ## 12.4.1 Disparity


    Suppose, we have just one camera, but something in the scene moves, or, that single
    camera moves. From the information in the two images, we might identify the moving
    object, track it over time, and possibly recognize it. If the camera itself is
    moving, then it is possible to predict time-to-collision or camera motion. Begin
    with the case of a stationary camera and a single moving object:


    Assume that a solution to the correspondence problem exists for this data. Collect
    two images, \(f_1\) and \(f_2\), which were taken at different times. At each
    pixel \(\mathbf{x}_2 = [x_2, y_2]^T\) in the second image, determine the corresponding
    point, \(\mathbf{x}_1 = [x_1, y_1]^T\) in the first image, if it has one. Then,
    the *disparity vector* is \(\mathbf{x}_2 - \mathbf{x}_1\). If a set of correspondences
    is found, and the disparity vectors drawn as arrows, one might get an image like
    Figure 12.11.


    In Figure 12.11, the disparity resulting from forward camera motion is observed.
    If sufficient correspondences are present, disparity fields like these can be
    analyzed to determine motion of the camera.


    A special case of disparity occurs when two identical cameras are aligned to have
    parallel axes, as illustrated in Figure 12.4. In this case, the only motion is
    horizontal displacement, and that is a scalar. That scalar, in turn may be viewed
    as a brightness in a *disparity image* in which brighter things are closer. Figure
    12.12 illustrates this. Similar results are obtained by moving the camera in a
    straight line perpendicular to the camera axis.


    # ## 12.4.2 Matching Geometric Invariants


    This section presents a special case of matching, one that demonstrates the power
    of the determinant, an operation that has a remarkable degree of invariance to
    image motions. We illustrate the power of determinants and their invariant properties.


    An *invariant* is a property, measurement, or operation whose output does not
    change if the input undergoes a certain class of transformation. As an example,
    consider a matrix'
