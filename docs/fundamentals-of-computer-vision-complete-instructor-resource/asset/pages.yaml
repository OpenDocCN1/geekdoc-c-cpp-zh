- pgno: 342
  md: 'Choose a set of five feature points \(\{\mathbf{X}_1, \mathbf{X}_2, \mathbf{X}_3,
    \mathbf{X}_4, \mathbf{X}_5\}\) from the 3D model, at least four of which are noncoplanar.
    It only requires four linearly independent vectors to span a 4-space.\(^6\) Therefore,
    since five points cannot be linearly independent, one of them can be written as
    a linear combination of the others. Choose point 5.


    \(\mathbf{X}_5 = a\mathbf{X}_1 + b\mathbf{X}_2 + c\mathbf{X}_3 + d\mathbf{X}_4.\)
    (12.49)


    For each of the five points, we construct matrices with four columns, using the
    points as columns, and using as a subscript, the index of the point we omitted.
    Since the determinant of a matrix of points is invariant to rigid body motions\(^7\)
    we will use determinants, and write the determinant that is constructed from any
    four of the five points, using the same subscript notation:


    \(M_1 = |\mathbf{X}_2 \mathbf{X}_3 \mathbf{X}_4 \mathbf{X}_5|.\) (12.50)


    Replace \(X_3\) with its expansion from Eq. 12.49.


    \(M_1 = |\mathbf{X}_2 \mathbf{X}_3 \mathbf{X}_4 (a\mathbf{X}_1 + b\mathbf{X}_2
    + c\mathbf{X}_3 + d\mathbf{X}_4)|.\) (12.51)


    Making use of a frequently-forgotten property of determinants called the “distributive
    rule for columns,” and the fact that multiplying a single column of a matrix by
    a scalar multiplies the determinant by the same amount, we substitute the form
    for \(\mathbf{X}_3\) from Eq. 12.49 into Eq. 12.50, deriving


    \(M_1 = a|\mathbf{X}_2 \mathbf{X}_1 \mathbf{X}_3 \mathbf{X}_4| + b|\mathbf{X}_2
    \mathbf{X}_2 \mathbf{X}_3 \mathbf{X}_4| + c|\mathbf{X}_2 \mathbf{X}_3 \mathbf{X}_3
    \mathbf{X}_4| + d|\mathbf{X}_2 \mathbf{X}_4 \mathbf{X}_3 \mathbf{X}_4|.\) (12.52)


    This can be simplified by observing that the determinant of a matrix that has
    two identical columns is zero:


    \(M_1 = a|\mathbf{X}_2 \mathbf{X}_1 \mathbf{X}_3 \mathbf{X}_4|.\) (12.53)


    This can be simplified even more by observing that if you interchange two columns,
    you flip the sign of the determinant.


    \(M_1 = (-a)|\mathbf{X}_1 \mathbf{X}_2 \mathbf{X}_3 \mathbf{X}_4| = (a)|\mathbf{X}_1
    \mathbf{X}_2 \mathbf{X}_3 \mathbf{X}_4| = (-a)|\mathbf{X}_1 \mathbf{X}_2 \mathbf{X}_3
    \mathbf{X}_4|.\) (12.54)


    So


    \(M_1 = -aM_5.\) (12.55)


    Similarly


    +   - \(M_2 = bM_5\) (12.56)

    +   - \(M_3 = -cM_5\) (12.57)

    +   - \(M_4 = dM_5\) (12.58)


    From this, we can write an expression for the coefficients in Eq. 12.49:


    \(a = -\frac{M_1}{M_5} \quad b = \frac{M_2}{M_5} \quad c = -\frac{M_3}{M_5} \quad
    d = \frac{M_4}{M_5}.\) (12.59)


    \(^6\) Review spanning a space in section 10.3.1.


    \(^7\) In fact, absolute invariants of linear forms are always ratios of powers
    of determinants [12.14].'
