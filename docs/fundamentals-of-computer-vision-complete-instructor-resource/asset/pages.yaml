  md: 'where \(\sigma\) is some measure of image noise. This is large (approaching
    1.0) when the brightnesses are similar, and we should NOT cut this edge.


    In addition to edges between pixels, we must consider edges between a pixel and
    a terminal node, the cost of \((p, s)\) and \((p, t)\). Remembering that we are
    considering the cost of a bad decision, simply use \(R_p(background)\) for the
    cost of \((p, s)\) and \(R_p(foreground)\) for the cost of \((p, t)\).


    To arrive at a single scalar to use as the objective function, define a vector
    \(A\) (for "assignment") with individual elements \(A_r\), one such element for
    each pixel. Each element of \(A\), \(A_p\), determines a binary assignment for
    pixel \(p\):


    ```

    \(A_p = \begin{cases} 0 & background \\ 1 & foreground \end{cases}\)

    ```


    and from Eq. 8.64, we can interpret \(B\) as meaning:


    ```

    \(B = \begin{cases} 0 & \text{if the two pixels have very different brightnesses.}
    \\ 1 & \text{if the two pixels have very similar brightnesses.} \end{cases}\)

    ```


    Thus, we seek the value of \(A\) that minimizes


    ```

    \(E(A) = \sum_p R_p(A_p) + \sum_{p,q} \delta(p,q)B(p,q) \quad (8.65)\)

    ```


    where \(\delta(p,q) = \begin{cases} 1 & \text{if } A_p \neq A_q \\ 0 & \text{if
    } A_p = A_q \end{cases}\). If the two pixels are labeled differently (\(\delta
    = 1\)), then they contribute to the error if their brightnesses are similar. The
    function \(\delta : Z \times Z \rightarrow \mathbb{R}\) incorporates our intuition
    that edges that join pixels with large differences in brightness should be edge
    pixels.


    # 8.7.2 Solving the Objective Function


    Minimization of this objective function is a combinatorial optimization problem,
    in which we must find the value of \(A\) that makes \(E\) minimal.


    The expression *feasible cut* is defined as follows: A cut is feasible if (1)
    for every pixel, the cut severs either the link to \(s\) or \(t\), but not both;
    and (2) for each edge \((p, q)\) that is cut, \(p\) and \(q\) have links to different
    terminals.


    It is possible to relate the process of finding the optimal \(\hat{A} = argmin_A
    E(A)\) to the problem of finding the optimal feasible cut \(\hat{C}\). Specifically,
    it is possible to show that the labeling of pixels (the value of \(A_p\)) resulting
    from the optimal cut will be the optimal labeling.


    Thus instead of finding the optimal labeling by combinatorial search, we can seek
    the optimal cut of the graph and get the same result. There are a number of algorithms
    in the graph theory literature for finding optimal cuts. These are discussed and
    evaluated in [8,9]. We will not pursue this further here because it will lead
    us away from Computer Vision and into Graph Theory.'
