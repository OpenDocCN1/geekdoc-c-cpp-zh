  md: 'Use of such globals is poor programming practice, and arguably causes more
    bugs than anything else in all of programming. Good structured programming practice
    requires that everything a subroutine needs to know is included in its argument
    list!


    Following these simple programming guidelines will allow you to write general-purpose
    code more easily and efficiently, and with fewer bugs. As you become more skilled
    you can take advantage of the pointer manipulation capabilities to increase the
    run speed of your programs if this is needed later.


    Adding some space (e.g., a blank line) between different segments of your code
    also improves readability. We emphasize the importance of the comments. However,
    do not add too many comments, since that will break the flow of your code. In
    general, you should add a block comment at the top of each function implementation,
    including descriptions of what the function does, who wrote this function, how
    to call this function, and what the function returns. You should also add a description
    for each variable declaration.


    # 2.4 Especially Important Points for Computer Vision


    If you are taking the time to read this section, you are several days of labor
    ahead of your friends. They will make the common errors described here, and take
    a very long time to find them. So here are a few things to avoid.


    +   - If you read in an image, using almost any image read function, you will
    be reading a data set composed of integers, 8 bits each, and therefore having
    values which range from 0 to 255. Remember that.

    +   - The fact of the last bullet causes problems because with 8-bit integers,
    250 + 8 = 2 and 3 - 5 = 254.

    +   - If you read in an image, immediately convert it to float. Do all your operations
    in float. This includes brightness scaling. Don''t convert back to integer until
    just before you write the output image. MATLAB does this. Everything is a floating
    point number unless you work hard to create integers.


    # 2.5 Image Analysis Software Toolkits


    There are numerous basic computing functions that the instructor may feel are
    not relevant to students in a Computer Vision class, e.g., using images with different
    data types (float is particularly important), compressing data in files, representing
    3D, 4D, or color images, etc. For these capabilities, it may be convenient to
    make use of an Image Analysis toolkit of some sort. There are at least two that
    the authors have used that serve this need: OpenCV and IFS. We use IFS (image
    file system) partly because we developed it, and partly because we think it has
    superior capabilities. The IFS system is described in Appendix C along with some
    example programs.


    1 C+ users be careful: The variables of a class are available to any method in
    that class and it is very easy to write methods which have side-effects which
    are hard to debug. This is exactly what we are trying to avoid with a no globals
    policy.'
