  md: 'The algorithm described here is one of many examples of MAP algorithms, which
    may be used for image restoration as well as noise removal.


    # 6.5.2 Selecting a Prior Term


    Some insight can be gleaned by writing the prior of Eq. 6.21 in a slightly more
    general way, that is,


    ```

    \Gamma(f) = -\frac{1}{\tau} \exp \left( - \frac{(\Delta(f))_i^2}{2\tau^2} \right)
    \quad (6.27)

    ```


    where the term \((\Delta(f))_i\) denotes some function of the (unknown) image
    \(f\) at pixel \(i\). What kind of image minimizes this term? Let''s look at what
    this expression means:


    The minus sign\(^3\) in front of the prior term requires that, to minimize the
    function, we must find the image that causes the exponential to be maximized.
    To determine what kind of image maximizes an exponential, look at the argument
    of the exponential. Observe the minus sign and note that both numerator and denominator
    are squared, and therefore always positive. Thus, the argument of the exponential
    is always negative. The value of an argument that is always negative and causes
    the exponential to be maximal is zero. Thus, to maximize the exponential, choose
    any image \(f\) which causes \(\Delta(f)\) to be zero. Maximizing the exponential,
    in turn, minimizes the objective function.


    What do we conclude from this? For any function \(\Delta(f)\), the \(f\) that
    causes \(\Delta(f)\) to be zero is the \(f\) that the prior term will seek. This
    observation gives us a lot of freedom of design. We can choose the function \(\Delta(f)\)
    to produce the type of solution we seek.


    # Example: Piecewise-Constant Images


    Consider this form for the prior


    ```

    \Lambda(f) = \left( \frac{\partial f}{\partial x} \right)^2 + \left( \frac{\partial
    f}{\partial y} \right)^2 \quad (6.28)

    ```


    In order for this term to be zero, both partial derivatives must be zero. The
    only type of surface that satisfies this condition is one that does not vary in
    either direction – flat, or flat almost everywhere. To see why the solution is
    piecewise-constant rather than completely constant, you need to recognize that
    the total function being minimized is the sum of both the prior and the noise
    terms. The prior term seeks a constant solution, but the noise term seeks a solution
    that is faithful to the measurement. The optimal solution to this problem is a
    solution that is flat in segments, as illustrated in one dimension in red in Figure
    6.11.


    The function \(\Delta(f)\) is nonzero only in the vicinity of points where \(f\)
    undergoes an abrupt change – an edge. To see more clearly what this produces,
    consider the extension to continuous functions. If it is continuous, then the
    summation in Eq. 6.27 becomes an integral. The argument of the integral is nonzero
    at only a small number of points (referred to as a set of measure zero), which
    is insignificant compared to the rest of the integral.


    \(^3\) Most errors are made in implementing this algorithm by dropping minus signs!'
