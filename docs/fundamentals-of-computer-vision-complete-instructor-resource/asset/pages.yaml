- pgno: 235
  md: 'This can be accomplished by augmenting the rotation matrices by adding a row
    and a column, all zeros except for a 1 in the lower right corner. With this new
    definition, a rotation has this form:


    ```

    \(\begin{bmatrix} \cos \theta & -\sin \theta & 0 \\ \sin \theta & \cos \theta
    & 0 \\ 0 & 0 & 1 \end{bmatrix}\)

    ```


    The definition of a point is also augmented by adding a 1 in the third position,
    so the coordinate pair (x, y) in this new notation becomes \(\begin{bmatrix} y
    \\ 1 \end{bmatrix}\).


    Now, translation and rotation can be combined into a single matrix representation
    (called a homogeneous transformation matrix). This is accomplished by changing
    the third column to include the translation. For example, to rotate a point about
    the origin by an amount \(\theta\), and then translate it by an amount dx in the
    x direction and dy in the y direction, we perform the matrix multiplication


    ```

    \(\mathbf{x}'' = \begin{bmatrix} \cos \theta & -\sin \theta & dx \\ \sin \theta
    & \cos \theta & dy \\ 0 & 0 & 1 \end{bmatrix} \begin{bmatrix} x \\ y \\ 1 \end{bmatrix}
    \quad (10.2)\)

    ```


    Thus, it is possible to represent rotation in the viewing plane (about the z axis)
    and translation in that plane by a single matrix multiplication. All the transformations
    mentioned above are elements of a class of transformations called isometries,
    which are characterized by the fact that they may move an object around, but they
    do not change its shape or its size. These are sometimes also referred to as rigid
    body motions.


    # 10.2.2 Affine Transformations


    If we generalize the idea of a rigid body motion just a bit, to allow the object
    to also become larger, we get similarity transformations.1 A similarity transform
    allows scale change (e.g., zoom).


    But what can we do, if anything, to represent rotations out of the camera plane?
    To answer this, we need to define an affine transformation. An affine transformation
    of the 2-vector \(\mathbf{x} = [x, y]^T\) produces the 2-vector \(\mathbf{x}''
    = [x'', y'']^T\) where


    ```

    \(\mathbf{x}'' = \mathbf{Ax} + \mathbf{b}, \quad (10.3)\)

    ```


    and **b** is likewise a 2-vector. This looks just like the similarity transformations
    mentioned above, except that we do not require the matrix **A** to be orthonormal,
    only nonsingular. An affine transformation may distort the shape of a region.
    For example, shear may result from an affine transformation, as illustrated in
    Figure 10.1.


    As you probably recognize, rotation of a planar object out of the field of view
    is equivalent to an affine transformation of that object. This gives us a (very
    limited) way to think about rotation out of the field of view. If an object is
    nearly planar, and the rotation out of the field of view is small, that is, nothing
    gets occluded, the projection of this 3D motion onto the viewing plane can be
    approximated as a 2D affine transformation. For example,'
