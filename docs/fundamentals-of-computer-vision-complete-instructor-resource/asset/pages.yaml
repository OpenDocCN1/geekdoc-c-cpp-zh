    4-connected neighborhood definition produces DT in which the distance from a point
    to the boundary is the Manhattan distance.


    # 7.4.2 Computing the DT Using Binary Morphological Operators


    One may estimate the DT using conventional morphological operations: Let us suppose
    we want the distance from a point x to the outside edge of an object. To accomplish
    that, repetitively erode the image, using some “appropriate” structuring element
    (usually round and centered at zero). Each time a pixel disappears, record the
    iteration at which that pixel vanished. Store the iteration number in the corresponding
    pixel of the DT. Pretty simple, isn’t it? That method does not quite give the
    Euclidean distance, but it serves well for many purposes. Huang and Mitchell [7.3]
    showed how to obtain the Euclidean distance transform using grayscale morphology,
    and Breu et al. [7.2] showed how to compute the Euclidean DT in linear time. For
    a structuring element that is strictly convex, the points go in the direction
    of the normal to the boundary of the region being eroded [7.6].


    # 7.4.3 Computing the DT Using a Mask


    Computing the distance transform may be accomplished by iterative application
    of a mask, such as the one illustrated in Figure 7.14. At iteration m, the distance
    transform is updated using the following equation,


    ```

    \(D^m(x, y) = \min_{k,l \in T} (D^{m-1}(x+k, y+l) + T(k,l)) \quad (7.30)\)

    ```


    A more detailed explanation follows: first, the distance transform, D(x, y), is
    initialized to a special symbol denoting “infinity” at every non-edge point, \(D^0(x,
    y) = \infty, \forall(x, y) \notin \partial R\), and to zero at every edge point
    \(D^0(x, y) = 0, \forall(x, y) \in \partial R\). Then, application of the mask
    starts at the upper left corner of the image, placing the origin of the mask over
    the (1,1) pixel of the image, and applying Eq. 7.30 to calculate a new value for
    the DT at (1,1). In the example of Figure 7.15, the DT is illustrated with infinities
    for non-edge points, and zeros for edge points. The origin of the mask in Figure
    7.14 is applied (or overlaid) on the pixel with shaded area. The application of
    Eq. 7.30 produces \(\min(1 + 0, 1 + \infty)\) for the distance transform value
    in the pixel with the shaded area.'
