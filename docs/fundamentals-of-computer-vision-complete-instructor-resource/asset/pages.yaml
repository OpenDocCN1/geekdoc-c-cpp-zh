- pgno: 18
  md: '# # 1 Computer Vision, Some Definitions, and Some History


    > > No object is mysterious. The mystery is your eye.

    > > – Elizabeth Bowen


    # ## 1.1 Introduction


    There are two fundamentally different philosophies concerning understanding the
    brain. (1) Understand the brain first. If we can understand how the brain works,
    we can build smart machines. (2) Using any technique we can think of, make a smart
    machine. If we can accomplish that, it will give us some hints about how the brain
    works. This book is all about the second approach, although it draws from current
    understanding of biological computing. In this chapter, however, we define a few
    terms, introduce the greater local-global problem, and then give a very brief
    introduction to the function of the mammalian brain.


    +   - (Section 1.2) From signal and systems perspective, we describe the differences
    between Computer Vision and some other closely related fields of studies, including,
    e.g., image processing and pattern recognition.

    +   - (Section 1.3) Since almost all problems in Computer Vision involve the issue
    of localness versus globalness, we briefly explain the “local-global” problem
    and the “consistency” principle used to solve this problem.

    +   - (Section 1.4) Computer Vision is deep-rooted in biological vision. Therefore,
    in this section, we discuss the biological motivation of Computer Vision and some
    amazing discoveries from the study of the human visual system.


    # ## 1.2 Some Definitions


    Computer Vision is the process whereby a machine, usually a digital computer,
    automatically processes an image and reports “what is in the image.” That is,
    it recognizes the content of the image. For example, the content may be a machined
    part, and the objective may be not only to locate the part but to inspect it as
    well.


    Students tend to get confused by other terms that often appear in the literature,
    such as Image Processing, Machine Vision, Image Understanding, and Pattern Recognition.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_19_0.png)


    Figure 1.1 A Computer Vision system accepts an input that is an image and produces
    a number of measurements extracted from the image. These measurements are called
    features and are provided to a pattern recognition system that makes a decision
    about the object or objects being imaged.


    We can divide the entire process of Image Processing into Low-Level Image Processing
    and High-Level Image Processing. If we interpret these processes from signal and
    systems perspective, it is more clear to describe their difference and similarity
    from the format of input/output of the system. When a Low-Level Image Processing
    system processes an input image, the output is still an image, but a somewhat
    different image. For example, it may be an image with noise removed, an image
    that does not take as much storage space as the input image, an image that is
    sharper than the input image, etc. Although low-level image processing does not
    give information about the object being imaged, it is likely to be necessary,
    as it enables the higher-level algorithms to work properly.


    The terms Machine Vision, Image Understanding, and High-Level Image Processing
    are often used to denote Computer Vision. They are processes that operate on an
    input image, but the output is not an image anymore; instead, it is an interpretation
    of the image.


    Pattern Recognition indicates an essential component of a Computer Vision system
    with the input being a description of the image (e.g., features that describe
    the object in the image) in a structured format (e.g., a vector) and the output
    being a recognition result based on those input descriptions. Hence, for the process
    of Pattern Recognition, neither the input nor the output is an image.


    Figure 1.1 illustrates one interpretation of a Computer Vision system. The decision
    of what an object is, its class, is made by a Pattern Recognition (PR) system.
    The decision made by the Pattern Recognition system is based on measurements made
    on the input. These measurements are called features. For example, the PR system
    must decide whether an object is an ax or a hatchet, and it receives as input
    the length of the handle and the mass of the head. If the length of the handle
    is to be determined from an image, the system that makes that determination is
    a Computer Vision system.


    So a Computer Vision system makes measurements in an image and reports those measurements
    to a pattern recognition system. If the Computer Vision system is sophisticated
    and returns “number of elephants in the room = 1,” the PR system may have nothing
    to do.


    There are exceptions to the definitions we just presented. Probably the best current
    example is the current research in deep learning. These systems use neural-motivated
    computing structures to identify specific objects in an image. One could argue
    that these systems are'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'pattern classifiers, but the problems they solve are clearly Computer Vision
    problems, so it would also be appropriate to classify them as Computer Vision
    systems [1.4].


    # 1.3 The Local-Global Problem


    Almost all problems in Computer Vision can be described as different versions
    of the “local-global” or “gestalt” problem. We describe it through two examples:


    The first is the old parable of the blind men and the elephant: “blind men were
    asked to determine what an elephant looked like by feeling different parts of
    the elephant’s body. The blind man who feels a leg says the elephant is like a
    pillar; the one who feels the tail says the elephant is like a rope; the one who
    feels the trunk says the elephant is like a tree branch; the one who feels the
    ear says the elephant is like a hand fan; the one who feels the belly says the
    elephant is like a wall; and the one who feels the tusk says the elephant is like
    a solid pipe.”1


    There is a visual example of the same story: Find a magazine with an interesting
    cover, and cut a piece of blank paper roughly twice the height and width of the
    magazine. Cut a small (1 or 2 cm diameter) hole in the center of the sheet and
    lay the paper down, covering the magazine. Now, find a friend who has not previously
    seen the magazine. Allow him/her to move the paper in any way at all, but constrained
    to only expose the magazine cover through the hole. Ask your friend to describe
    the cover. Chances are, you will get a description that is totally incorrect.


    This is what we ask computers to do: make local measurements (e.g., gradients)
    all over the image, and somehow the computer infers from all those local measurements
    that the image is a picture of an elephant.2


    Partial solutions to this problem are many and varied, a number of which are presented
    in this book. Most of them make use of consistency. That is, if the computer can
    discover that a number of measurements are consistent in some way, it may be able
    to infer the aspect of the global image that causes that consistency.


    As you go through the material, keep in mind how what you are reading can be used
    to solve this greater problem.


    # 1.4 Biological Vision


    Biological computation (neurons) and biological vision (using those neurons) is
    the inspiration of Computer Vision. Since the start of Computer Vision as a discipline,
    there have been attempts to measure biological vision and model it in computers.
    Over the history of Computer Vision, many techniques have been developed to make
    use of biologically motivated models. In recent years new techniques such as deep
    learning have become popular, and those methods owe their form to early works
    in biological vision.


    1 From Wikipedia.


    2 We are asking the computer to solve a gestalt problem, discovering the identity
    of the content of an image from lots of locally distributed measurements.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_21_0.png)


    Figure 1.2 The biological neuron has many inputs (i.e., dendrites), each weighted,
    and a single output (i.e., axon), which may divide and go to several places.


    # 1.4.1 The Biological Motivation


    First, we consider the biological neuron, as illustrated in Figure 1.2. The dendrites
    are tiny fibers that carry signals to the neuron cell body. The cell body serves
    to integrate (over dendrite inputs and time) the inputs from those dendrites.
    This integration process is actually the accumulation of charge in the form of
    positive ions. When a sufficient amount of charge has accumulated, the cell membrane
    breaks down, allowing a massive ionic flow that propagates down the single output
    of the cell, the axon. Axons may be quite long, even as long as over 10 cm. This
    propagation of ion flow is referred to as an action potential. Information is
    encoded by the rate of occurrence of action potentials. A typical action potential
    has an amplitude in the tens of millivolts and a duration in the milliseconds.


    Output/input signal transitions occur where an axon impinges on a dendrite or
    on a cell body. Such a junction is called a synaptic junction. As electrical charges
    move down an axon, they cause the release of a neurotransmitter chemical across
    the synaptic junction. As many as 1,000 synapses may provide input to a single
    neuron.


    Figure 1.3 illustrates graphically two axons making connection to a single cell
    body through two different sized synapses. Neurotransmitters are chemicals released
    from the axon into the synaptic junction, and they may encourage the cell to fire
    (excitatory'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_22_0.png)


    synapses) or inhibit cell firing (inhibitor neurotransmitters at inhibitory synapses).
    In the figure, the larger synapse, A, is capable of releasing more neurotransmitter
    and therefore exerting more influence on the postsynaptic neuron. Changes in the
    ability of synapses to transmit signals appear to be one form of what we call
    memory. The influence of presynaptic neurons on postsynaptic neurons may be modelled
    as plus or minus sign on weights to a summer. It has been estimated that an adult
    nervous system possesses 10^10 neurons. With 1,000 synapses per neuron, and 8
    bits of storage per synapse (actually, synapses are not that precise... 5 bits
    is more likely), we come up with 10 terabytes of storage in your brain! So use
    it! Read the remainder of this chapter and beyond!


    The neuron may be modeled mathematically with a sum-of-products followed by a
    nonlinearity, as illustrated in Figure 1.4. Therefore, the equation of the neuron
    can be written as


    y_q = S_q \left( \sum_i x_i w_{iq} \right) (1.1)


    where i and q are the indices for inputs and neurons, respectively, and S_q is
    the nonlinear function. The nonlinearity S_q has the form of a sigmoid (having
    the shape of the letter “S”). A common sigmoid is the logistic function S(x) =
    1 / (1 + e^-x), where a controls the slope of the sigmoid in its center.


