    # ## 11.9 Deformable Templates


    Recall deformable contours (snakes) from section 8.5. If we think of the region
    surrounded by a snake, rather than the snake itself, we realize we have a region
    whose shape can be deformed, and thus have invented “deformable templates”. Objects
    can be tracked utilizing a philosophy that allows for deformation of the template[11.52].
    In addition, the concepts of deformable templates may be useful in image database
    access. For example, Bimbo and Pala [11.5] compare shapes in the image with a
    user-drawn sketch, an “iconic index”, which is a type of deformable template.


    The best matching template is written as


    $$\Phi(s) = \tau(s) + \theta(s),$$ (11.29)


    where s is (normalized) arc length, \(\tau\) is the template as stored in the
    database, and \(\theta(s)\) is the deformation required to make this particular
    template match a sequence of boundary points in the image being accessed. We emphasize
    that \(\theta(s)\) is the *difference* between the original and the deformed template.
    The image in the database that best matches the template is the image that minimizes
    “the difference between the original and the deformed template.” This can be achieved
    by minimizing


    $$E = \int_0^1 \left( \alpha \left[ \left( \frac{d^2 \theta_x}{ds^2} \right)^2
    + \left( \frac{d^2 \theta_y}{ds^2} \right)^2 \right] + \beta \left[ \left( \frac{d^2
    \theta_x}{ds^2} \right)^2 + \left( \frac{d^2 \theta_y}{ds^2} \right)^2 \right]
    - L(\phi(s)) \right) ds$$ (11.30)


    where the first term represents how much the template had to be strained to fit
    the object, the second term represents the energy spent to bend the template,
    and the third term represents a measure of the gradient of the image (not the
    template) at the point \(\phi(s)\). This is thus a deformable templates problem.
    The optimization problem may be solved numerically [11.5].


