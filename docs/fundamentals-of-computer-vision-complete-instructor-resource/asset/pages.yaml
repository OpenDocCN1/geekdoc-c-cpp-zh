  md: 'One more: if f(x) is scalar-valued, the matrix of second derivatives


    ```

    \frac{d^2 f}{d\mathbf{x}^2} = \begin{bmatrix} \frac{\partial^2 f}{\partial x_1^2}
    & \frac{\partial^2 f}{\partial x_1 \partial x_2} & \cdots & \frac{\partial^2 f}{\partial
    x_1 \partial x_d} \\ \vdots & \vdots & \ddots & \vdots \\ \frac{\partial^2 f}{\partial
    x_d \partial x_1} & \frac{\partial^2 f}{\partial x_d \partial x_2} & \cdots &
    \frac{\partial^2 f}{\partial x_d^2} \end{bmatrix},

    ```


    is called the Hessian.


    Here, we introduce a new notation, a vector containing only operators,


    ```

    \nabla = \begin{bmatrix} \frac{\partial}{\partial x_1} & \frac{\partial}{\partial
    x_2} & \cdots & \frac{\partial}{\partial x_d} \end{bmatrix}^T.

    ```


    It is important to note that this is an operator, not a vector. We will do linear
    algebra sorts of things with it, but by itself, it has no value, not even really
    any meaning – it must be applied to something to have any meaning. For most of
    this book, we will deal with two-dimensional images, and with the two-dimensional
    form of this operator,


    ```

    \nabla = \begin{bmatrix} \frac{\partial}{\partial x} & \frac{\partial}{\partial
    y} \end{bmatrix}^T.

    ```


    Apply this operator to a scalar, f, and we get a vector that does have meaning,
    the gradient of f:


    ```

    \nabla f = \begin{bmatrix} \frac{\partial f}{\partial x} & \frac{\partial f}{\partial
    y} \end{bmatrix}^T.

    ```


    Similarly, if f is a vector, we may define the divergence using the inner (dot)
    product (in all the following definitions, only the two-dimensional form of the
    ∇ operator defined in Eq. 3.21 is used. However, remember that the same concepts
    apply to operators of arbitrary dimension):


    ```

    div \mathbf{f} = \nabla \mathbf{f} = \begin{bmatrix} \frac{\partial}{\partial
    x} & \frac{\partial}{\partial y} \end{bmatrix} \begin{bmatrix} f_1 \\ f_2 \end{bmatrix}
    = \frac{\partial f_1}{\partial x} + \frac{\partial f_2}{\partial y}.

    ```


    We will also have opportunity to use the outer product of the ∇ operator with
    a matrix, which is the Jacobian:


    ```

    \nabla \times \mathbf{f} = \begin{bmatrix} \frac{\partial}{\partial x} \\ \frac{\partial}{\partial
    y} \end{bmatrix} [f_1 \quad f_2] = \begin{bmatrix} \frac{\partial f_1}{\partial
    x} & \frac{\partial f_1}{\partial y} \\ \frac{\partial f_2}{\partial x} & \frac{\partial
    f_2}{\partial y} \end{bmatrix}.

    ```


    # 3.2.7 Eigenvalues and Eigenvectors


    If matrix A and vector x are conformable, then one may write the characteristic
    equation


    ```

    A\mathbf{x} = \lambda \mathbf{x}, \lambda \in \Re.

    ```


    Since Ax is a linear operation, A may be considered as a transformation that maps
    x onto itself with only a change in length. There may be more than one eigenvalue,
    λ, which satisfies Eq. 3.26. For x ∈ ℝ^d, A will have exactly d eigenvalues (which
    are not, however, necessarily distinct). These may be found by solving det(A −
    λI) = 0. (But for d > 2, we do not recommend this method. Use a numerical package
    instead.)


    6 “Eigen-.” is the German prefix meaning “principal” or “most important.” These
    are not named for Mr. Eigen.'
