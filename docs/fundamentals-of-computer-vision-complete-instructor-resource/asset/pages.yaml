  md: 'To find this epipole, we just observe that \(\mathbf{e}''\) is in the left
    null space of \(F\). You might think this is a problem until you realize that
    \(F\) has rank 2. Thus, when you find the null space of \(F^\top\) (see section
    3.2.3) and use the observation that the third element of \(\mathbf{e}''\) is equal
    to one, you realize that there is just one element in the null space, except of
    course, for the zero vector and all scalar multiples of \(\mathbf{e}''\). Therefore
    we can find \(\mathbf{e}''\) from the left null space of \(F\), and we can find
    the camera matrices from that.


    # 12.3.4 Stereopsis from Camera Matrices


    Given two cameras with camera matrices \(P_l\) and \(P_r\), those matrices provide
    two vector equations:


    ```

    \(\mathbf{x}_l = P_l \mathbf{X}, \quad \mathbf{x}_r = P_r \mathbf{X}.\)

    ```


    Writing either of these equations out for some matrix \(P\),


    ```

    \(\begin{bmatrix} x \\ y \\ z \end{bmatrix} = \begin{bmatrix} P_{11} & P_{12}
    & P_{13} & P_{14} \\ P_{21} & P_{22} & P_{23} & P_{24} \\ P_{31} & P_{32} & P_{33}
    & P_{34} \end{bmatrix} \begin{bmatrix} X \\ Y \\ Z \\ 1 \end{bmatrix}.\)

    ```


    Recall from Eq. 3.3 that the cross product of a vector with itself is zero. We
    use this fact, observing that \(\mathbf{x} = P \mathbf{X}\) implies \(\mathbf{x}
    \times P \mathbf{X} = 0\), where \(\times\) is the cross product.


    Define \(P_i\) to be the \(i^{th}\) row of \(P\). This will be a 3-element row
    vector. In the next equation, an inner product will be performed between each
    of the rows of the \(P\) matrix with \(\mathbf{X}\). Since these vectors are row
    vectors, no transpose will be required.


    The cross product produces


    ```

    \([y\mathbf{P}_3 - \mathbf{P}_2]\mathbf{X} = 0\)

    \([(x\mathbf{P}_3 - \mathbf{P}_1)]\mathbf{X} = 0\)

    \([x\mathbf{P}_2 - y\mathbf{P}_1]\mathbf{X} = 0.\)

    ```


    To assist the student in understanding the notation, we expand the first line
    of Eq. (12.34)


    ```

    \((yP_{31} - P_{11})X + (yP_{32} - P_{22})Y + (yP_{33} - P_{23})Z + yP_{34} -
    P_{24} = 0.\)

    ```


    Because it is equal to zero, we may reverse the sign of the middle term of Eq.
    12.34.


    Consider the linear independence of the three equations in Eq. (12.34). Multiply
    the first equation by \(x\), the second by \(y\), and add them. Since that produces
    the third equation, we recognize that these are not linearly independent. Since
    it provides no additional information, drop the third equation, leaving the two
    equations:


    ```

    \([y\mathbf{P}_3 - \mathbf{P}_2]\mathbf{X} = 0\)

    \([x\mathbf{P}_3 - \mathbf{P}_1]\mathbf{X} = 0.\)

    ```'
