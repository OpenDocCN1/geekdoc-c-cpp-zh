  md: '# # 4 Images: Representation and Creation


    > Computers are useless. They can only give us answers.

    > – Pablo Picasso


    # ## 4.1 Introduction


    Since you have already had a course in image processing, it should not be necessary
    to describe how images are formed. Representations, however, are another matter.
    This chapter discusses various image representation schemes as well as a way of
    treating images as surfaces.


    +   • (Section 4.2) In this section, we discuss mathematical representations both
    for the information contained in an image and for the ways in which images are
    stored and manipulated in a digital machine.


    +   • (Section 4.3) In this section, we introduce a way of thinking about images
    – as surfaces with varying height – which we will find to be a powerful way to
    describe both the properties of images as well as operations on those images.


    # ## 4.2 Image Representations


    In this section, several ways to represent the information in an image are discussed.
    These representations include: iconic, functional, linear, probabilistic, and
    graphical representations. Note that in a digital image, the first dimension is
    columns and the second is rows. In a 3D digital image, the dimensions are columns,
    rows, and frames.


    # ### 4.2.1 Iconic Representations (An Image)


    An iconic representation of the information in an image is an image. Yeah, right;
    and a rose is a rose is a rose. When you see what we mean by functional, linear,
    and relational representations, you will realize we need a word for a representation
    that is itself a picture. In the following, we briefly describe 2D, 3D, and range
    images.


    +   • 2D images: The familiar 2D image is the brightness image, also called luminance
    image. These include photographs; the things you are used to calling “images”
    or “pictures.”


    1 “Iconic” comes from the Greek word meaning picture.'
