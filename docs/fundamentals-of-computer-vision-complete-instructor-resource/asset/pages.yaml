- pgno: 87
  md: '+   • A signal at a coarser level should contain less structure than a signal
    at a finer level. If one considers the number of local extrema as a measure of
    smoothness, then the number of extrema should not increase as we go to coarser
    scale. This property is called scale-space causality.


    +   • All representations should be generated by applications of a kernel operator
    to the original image.


    The last property is certainly debatable, since it formally requires a linear,
    space-invariant operator. One interesting approach to scale space that violates
    this requirement is to produce a scale space by using grayscale morphological
    smoothing with larger and larger structuring elements [5.15]. You could use scale
    space concepts to represent texture or even a probability density function, in
    which case your scale-space representation becomes a clustering algorithm [5.21].
    We will see applications of scale representations as we proceed through the course.


    One of the most interesting aspects of scale space representations is the behavior
    of our old friend, the Gaussian. The second derivative of the Gaussian (in two
    dimensions, the Laplacian of Gaussian: LOG) has been shown [5.24] to have some
    very nice properties when used as a kernel. The zero crossings of the LOG are
    good indicators of the location of an edge.


    # Scale Space Causality


    One might ask, “Is the Gaussian the best smoothing operator to use to develop
    a kernel like this?” Said another way: we want a kernel whose second derivative
    never generates a new zero crossing as we move to larger scale. In fact, we could
    state this desire in the following more general form:


    Let our concept of a “feature” be a point where some operator has an extreme,
    either maximum or minimum. The concept of scale-space causality says that as scale
    increases, as images become more blurred, new features are never created. The
    Gaussian is the only kernel (linear operator) with this property [5.2, 5.3].


    This idea of scale-space causality is shown in the following example. Figure 5.14
    illustrates the brightness profile along a single line from an image, and the
    scale space created by blurring that single line with one-dimensional Gaussians
    of increasing variance. In Figure 5.15, we see the Laplacian of the Gaussian,
    and the points where the Laplacian changes sign. The features in this example,
    the zero-crossings (which are good candidates for edges) are indicated in the
    right image. Observe that as scale increases, new feature points (in this case,
    zero-crossings) are never created. As we go from top (low scale) to bottom (high
    scale), some features disappear, but no new ones are created.


    One obvious application of this idea is to identify the important edges in the
    image first. We can do that by going up in scale, finding those few edges, and
    then tracking them down to lower scale.


    # 5.7 So How Do People Do It?


    Two neurophysiologists, David Hubel and Thorsten Wiesel [5.13, 5.14], stuck some
    electrodes in the brains – specifically the visual cortex – first of cats and
    later of monkeys.'
