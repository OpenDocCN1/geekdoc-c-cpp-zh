    processed pixel-by-pixel in a raster scan. In order to manipulate an image, two-
    or three-nested loops is the most commonly used programming structure, as shown
    in Figures 2.1 and 2.2.


    In these examples, we use two or three integers (row, col, and frame) as the indices
    to the row, column, and frame of the image. By increasing row, col, and frame
    with a step'
