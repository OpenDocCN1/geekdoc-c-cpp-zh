    connected components to do segmentation by setting a local difference (the R of
    Eq. 8.19) and not allowing two pixels with greater difference than this to be
    in the same region. However, since this is a local operation, it is subject to
    “leaking.” That is, if a region changes brightness sufficiently slowly, background
    and foreground may be inadvertently merged. If, however, R(p, q) is defined to
    require equal brightness, then connected components will produce a segmentation.
    Leaking can be prevented by simply defining


    ```

    R(p, q) = \begin{cases} TRUE & \text{if } |f(p) - f(q)| < \text{a sufficiently
    small threshold} \\ FALSE & \text{otherwise.} \end{cases} (8.67)

    ```


    The snake problem fits perfectly into the MAP philosophy, and simulated annealing
    (SA) can be used [8.50]. However, the search neighborhood is problematic. That
    is, as we have discussed, SA is guaranteed to find the state that globally minimizes
    a set of states. However, the set of states must be sampled in order for SA to
    work. In [8.50], an existing contour is used as a starting point, and at each
    iteration, the only states sampled are contours within one pixel of the current
    contour, and from that set a minimum is chosen. The resultant contour is the best
    contour of the set sampled, but not necessarily the best contour from the entire
    region of interest.


    The minimization problem for snakes in two dimensions is solvable using dynamic
    programming [8.24].


    Baswarth et al. [8.3] provides a reasonable literature survey of the literature
    in Active Contours.


    The idea of using level sets for adaptive contours was first proposed by Sethian
    [8.44, 8.45]. Malladi [8.34] extended this by observing that there are advantages
    of considering only a set of points near the current contour. Taubin [8.51] uses
    the concept of a level set implicitly in fitting piecewise-linear curves. Kimmel,
    Amir, and Bruckstein [8.28] demonstrate that level sets may be used for other
    things, such as finding the shortest path on a surface.


    Not all algorithms that use a deformable contour philosophy follow the strategies
    described in section 8.5. For example, Lai and Chin [8.30] describe a variation
    that treats the contour points as a sequence of random variables, which may therefore
    be described by a Markov process, and optimized using MAP strategies.


    Watersheds are interesting, and can be used to produce complete segmentations
    with different basins identified.


    The interested reader may refer to an excellent survey/tutorial on watersheds
    by Roerdink and Meijster [8.42] for additional details. Another excellent tutorial
    is available on the Web at http://cmm.ensmp.fr/~beucher/wtshed.html.


    Graph cuts find optimal segmentations. In principle, these will be superior to
    the cuts produced by connected components, since the user has control of the objective
    function and the optimization is global. However, some versions of graph cuts
    require prior information defining foreground and background. Therefore, they
    cannot segment images with homogeneous regions of different brightness, which
    using connected components and a very small threshold in Eq. 8.67 can accomplish.'
  merge: -1
  img_proc: true
