    # 3.2.5 Linear Transformations


    A linear transformation, A, is simply a matrix. Suppose A is m × d. If applied
    to a vector x ∈ ℜ^d, y = Ax then y ∈ ℜ^m. So A took a vector from one vector space,
    ℜ^d, and produced a vector in ℜ^m. If that vector y could have been produced by
    applying A to one and only one vector in ℜ^d, then A is said to be one-to-one.
    Now suppose that there are no vectors in ℜ^m that cannot be produced by applying
    A to some vector in ℜ^d; in that case, A is said to be onto. If A is one-to-one
    and onto, then A^-1 exists. Two matrices A and B are conformable if the matrix
    multiplication C = AB makes sense.'
