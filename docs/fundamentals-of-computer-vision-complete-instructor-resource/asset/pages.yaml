    # An Example of Using Association Graphs to Match a Scene to a Model


    In Figure 11.14 LEFT we illustrate an observation in which a segmentation error,
    oversegmentation, has occurred. That is, regions B and C are actually part of
    the same region, but due to some measurement or algorithmic error, have been labeled
    as two separate regions. In this example, the unary predicates are labels spherical,
    cylindrical, and planar. Regions A and 1 are spherical, while B, C, D, 2, and
    3 are cylindrical. The only candidates for matches are those with the same predicate.
    So only A can match 1 and the only node of the association graph containing A
    will be (A,1).


    We now construct a graph in which all candidate matches are the nodes. We then
    have the nodes of the association graph, as illustrated in Figure 11.14. To fill
    in the edges of the association graph, use is made of the concept of consistency.


    Here is the challenge: Identify what it means to be consistent – determine r(i,
    λ, j, λ''), or in this example, determine r(1, A, 4, 2, B), where compatibility
    function r has the same meaning as described in Eq. 11.19 above. It is often easier
    to do this by determining what is NOT consistent, always a problem-dependent decision.
    Here, we define any two labelings as consistent if they do not involve the same
    region. Some example consistencies for this example are


    ```

    r(1, A, 4, 2, B) = 1

    r(2, B, 2, C) = -1

    r(2, B, 3, B) = -1

    ```


    The second line of Eq. 11.22 says that patch B in the image could not be region
    2 in the model while simultaneously, patch C in the image is the same region.
    In both examples, inconsistencies are really based on the assumption that the
    segmenter is working correctly.


    However, one could allow the segmenter to fail. In that case, new edges are added
    to the association graph, because new relationships are now consistent. For example,
    we could add r(3, C, 3, D) = 1 now, since we believe that two patches, C and D,
    could both be part of the same regions (the segmenter can fail by oversegmentation),
    however, r(2, D, 3, D) = -1 still holds because we still believe the segmenter
    will not merge patches (fail by undersegmentation). Allowing for oversegmentation
    produces the association graph of Figure 11.15.


    Note4 one other type of inconsistency that could be used to prevent an edge from
    being constructed: 3D and 3B are not connected since B and D do not border. That
    is, we believe that if the segmentation fails by oversegmentation, the segmenter
    will not introduce an entire new patch between the two. The example of Figure
    11.15 does not consider this possibility. We must emphasize that how you develop
    these rules is totally problem-dependent!


    4 Association graphs are a kind of consistent labeling.'
