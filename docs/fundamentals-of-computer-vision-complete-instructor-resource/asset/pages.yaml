    # The Laplacian


    It is important to understand a few important characteristics of the Laplacian
    operator before implementing it. The Laplacian is the sum of the second derivatives,
    but, as has been mentioned often, we can''t actually take a derivative, we can
    only estimate a derivative. Normally, we convolve with the sampled second partial
    derivatives of a Gaussian, and the scale of the Gaussian is important. The process
    of using the Laplacian of a Gaussian to create a kernel is referred to as the
    Laplacian of a Gaussian operator or LoG. Recall from section 5.4.6 that the scale
    (standard deviation) of the Gaussian used to formulate the kernel, the size of
    that kernel in pixels, and the scale of the features being sought are all related.


    Thus, the Laplacian should be computed using the scale for the particular level
    of scale space being considered. If the scale of the feature is unknown, then
    the Laplacian may be applied to each level of a scale space. As one does this
    at each point, an extreme of the LoG will indicate the scale that is best for
    that point in that image.'
