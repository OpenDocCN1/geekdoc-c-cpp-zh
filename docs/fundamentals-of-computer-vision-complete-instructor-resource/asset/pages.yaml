    # 10.4.5 The Medial Axis


    In two dimensions, the medial axis (also sometimes referred to as the skeleton
    of a region is defined as the locus of the centers of maximal circles. A maximal
    circle is the largest circle that can be located at a given point in the region.
    Let''s say that a bit more carefully (we all need to learn how to use mathematics
    to make our wording precise): Maximal circles touch the region boundary at at
    least 2 points, such that no circle points are outside the region.


    Any point on the medial axis can be shown to be a local maximum of a distance
    transform (DT). A point with DT values of k is a local maximum if none of its
    neighbors has a greater value. Figure 10.12 (left) repeats Figure 7.13. The set
    of local maxima of this distance transform is illustrated on the right.


    Examples of use of the medial axis are illustrated in Figure 10.13. Another way
    to think about the medial axis is as the minimum of an electrostatic potential
    field. This approach is relatively easy to develop if the boundary happens to
    be straight lines, or in three dimensions, planes [10.8]. See [10.11] for additional
    algorithms to efficiently compute the medial axis.


    # Relating the Medial Axis and Ridges


    The medial axis is defined only for binary images, or at least only for images
    in which each region may be represented by its boundary. The ridge (recall section
    4.3.3), however, is defined for grayscale images. We can relate these two characterizations
    using the following strategy: Use a scale-space representation of the image. That
    is, blur the binary image. This process turns the binary image into a gray-scale
    image. Now find the ridge. Start with the ridge at high scale (lots of blur).
    This is your initial estimate of the medial axis. Now, reduce the scale slightly
    and see what new ridges appear. Add them to your estimate. Continue this process
    over varying scales. See Pizer et al. [10.29] for more details on this philosophy,
    which is called the Intensity Axis of Symmetry.'
