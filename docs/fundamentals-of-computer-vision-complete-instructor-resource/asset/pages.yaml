    The term \(\mathbf{x}_t\) describes the change in the boundary points with respect
    to time. Since we are free to choose this, we choose the motion to be in the direction
    normal to the contour. The normal vector is determined from the gradient:


    ```

    \nabla_x \psi = \left[ \frac{\partial \psi}{\partial x} \quad \frac{\partial \psi}{\partial
    y} \right]^T.

