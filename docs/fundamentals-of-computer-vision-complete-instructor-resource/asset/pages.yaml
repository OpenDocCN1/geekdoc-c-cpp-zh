    (10.13)


    The error that has been introduced by using some arbitrary constants, the \( \alpha
    \)’s of Eq. 10.13, rather than the elements of y, is given by


    \(\Delta \mathbf{x} = \mathbf{x} - \hat{\mathbf{x}} = \mathbf{x} - \sum_{i=1}^m
    y_i \mathbf{b}_i - \sum_{i=m+1}^d \alpha_i \mathbf{b}_i.\) (10.14)


    but since


