    \(\phi_{jk} = \phi_k - \Theta_j\)


    Note that the features are differences in orientations, and those differences
    are invariant to rotation (assuming the dominant orientation is computed correctly).


    Using as arguments the distance from the reference point, \(\rho\), and the direction
    of local gradient, \(\phi\), the SKS model for a neighborhood, say neighborhood
    \(j\), is


    \(m_j(\rho, \phi) = \sum_{k=1}^K \left[ \exp \left( - \frac{(\rho - \rho_k)^2}{2\sigma_\rho^2}
    \right) \exp \left( - \frac{(\phi - \phi_k)^2}{2\sigma_\phi^2} \right) \right],
    \quad (11.15)\)


    The sum is taken over all the points in the neighborhood. Observe that this is
    almost identical to the form used in the representation of a boundary of a regions,
    in Eq. 10.12.


    The description of the SKS algorithm here presents only two measurements, \(\rho\)
    and \(\phi_{jk}\). However, one could easily envision other measurements that
    might be made to characterize the points in the neighborhood (e.g. color). Adding
    additional measurements is easily accommodated by allowing the scalar \(\phi_{jk}\)
    to be replaced by a vector \(v_{jk}\). The model at the feature point \(j\) is
    therefore more generally given by:


    \(m_j(\rho, v) = \sum_{k=1}^K \left[ \exp \left( - \frac{(\rho - \rho_k)^2}{2\sigma_\rho^2}
    \right) \exp \left( - \frac{||v - v_k||^2}{2\sigma_v^2} \right) \right] \quad
    (11.16)\)


    The summation in Eq. 11.16, may be replaced in some instances by a \(max\) operation.
    Although this changes the intuition of the model, it also works as well as and
    sometimes better than the summation.


    The model \(m_j(\rho, v)\) for neighborhood \(j\) can be viewed as a function
    that estimates the closeness of a given feature vector, \(v\), to all the feature
    vectors around the interest point \(j\). The model function can also be precomputed
    and stored as a lookup table that considerably speeds up the matching process.


    Equation 11.16 is still simplified a bit, because the elements of the vector \(v\)
    will almost always have different variances. For this reason, in general, a covariance
    representation is required such as:


    \(m_j(\rho, v) = \sum_{k=1}^K \left[ \exp \left( - \frac{(\rho - \rho_k)^2}{2\sigma_\rho^2}
    \right) \exp \left( - \frac{v^T K^{-1} v}{2\sigma_v^2} \right) \right] \quad (11.17)\)


    where \(K\) here is the covariance of the vector of measurements \(v\).


