  md: '# Appendix B How to Differentiate a Function Containing a Kernel Operator


    The function of Eq. 6.25 is complicated by involving a sum over all the pixels
    and by the use of convolution that creates terms involving more than one pixel
    at a time. This Appendix discusses the differentiation of such an expression.
    The material is placed in an appendix because it is not essential to understanding
    the concepts of noise removal, but is important for those who must implement software.


    In previous discussions, the effects of blur were excluded and noise was assumed
    to be the only source of distortion. In this section, the results derived in chapter
    6 are extended and include blur in the formation of the measured image, g, such
    that the noise terms can be written as Eq. B.1. We will illustrate differentiation
    of the prior and the noise terms as if both contained convolutions. First, we
    illustrate how to differentiate a function containing a kernel operator (or a
    blur operator).


    \(\sum_i ((f \otimes h) - g_i)^2\) (B.1)


    Taking a one-dimensional example, assume \(f_i\) is a pixel from the original
    (unknown) image, \(g_i\) is a pixel from the measured image, and \(h\) is the
    horizontal blur kernel with a finite kernel size 5, as shown below:


    ![](img/5f95dd954ac63cc68119f6f48ca99e18_374_0.png)


    Here, the derivative of the noise term with respect to \(f\) in Eq. B.1, which
    is required in order to use gradient descent, is examined in detail. We will make
    use of the fact that we are taking a partial derivative of a summation. Therefore,
    any term in the sum that does not involve the denominator of the partial derivative
    will be zero.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_375_0.png)


    Figure B.1 The reverse kernel in the derivation of the noise term.


    First write out all the terms involving a pixel (let''s pick \(f_4\)) at which
    a measurement (\(g_4\)) was made in the noise term \(H_\alpha\) above


    ```

    \(E_4 = ((f \otimes h)_2 - g_2)^2 + ((f \otimes h)_3 - g_3)^2 + ((f \otimes h)_4
    - g_4)^2\) (B.2)

    \(+ ((f \otimes h)_5 - g_5)^2 + ((f \otimes h)_6 - g_6)^2\)

    \(= (f h_{-2} + f h_{-1} + f h_0 + f h_1 + f h_2 - g_2)^2\)

    \(+ (f h_{-2} + f h_{-1} + f h_0 + f h_1 + f h_2 - g_3)^2\)

    \(+ (f h_{-2} + f h_{-1} + f h_0 + f h_1 + f h_2 - g_4)^2\)

    \(+ (f h_{-2} + f h_{-1} + f h_0 + f h_1 + f h_2 - g_5)^2\)

    \(+ (f h_{-2} + f h_{-1} + f h_0 + f h_1 + f h_2 - g_6)^2\)

    ```


    where \((f \otimes h)\), denotes the application of kernel \(h\) to image \(f\)
    with the origin of \(h\) (in this case, the center) located at pixel \(f_r\).


    The derivative of \(H_\alpha\) with respect to pixel \(f_4\) can then be derived
    as:


    ```

    \(\frac{\partial H_\alpha}{\partial f_4} = 2((f \otimes h)_2 - g_2)h_2 + 2((f
    \otimes h)_3 - g_3)h_1 + 2((f \otimes h)_4 - g_4)h_0\)

    \(+ 2((f \otimes h)_5 - g_5)h_{-1} + 2((f \otimes h)_6 - g_6)h_{-2}\) (B.3)

    \(\frac{\partial H_\alpha}{\partial f_4} = ((f \otimes h) - g) \otimes h_{rev})|_{f_4}\)
    (B.4)

    ```


    where the reverse of the kernel \(h\), \(h_{rev} = [h_2 | h_1 | h_0 | h_{-1} |
    h_{-2}]\), and \((f \otimes h - g)\) is computed at all points. The application
    of \(h_{rev}\) is illustrated more clearly in Figure B.1 where we assume \(n_i
    = ((f \otimes h) - g)\). The application of the reverse kernel with a two-dimensional
    image follows the same rule as that in the one-dimensional case. Equation B.5
    shows a \(3 \times 3\) kernel function (\(h\)) and the corresponding reverse kernel
    \(h_{rev}\).


    ```

    \(h = \left[ \begin{array}{ c c c } h_{-1,-1} & h_{-1,0} & h_{-1,1} \\ h_{0,-1}
    & h_{0,0} & h_{0,1} \\ h_{1,-1} & h_{1,0} & h_{1,1} \end{array} \right] , h_{rev}
    = \left[ \begin{array}{ c c c } h_{1,1} & h_{1,0} & h_{1,-1} \\ h_{0,1} & h_{0,0}
    & h_{0,-1} \\ h_{-1,1} & h_{-1,0} & h_{-1,-1} \end{array} \right]\) (B.5)

    ```'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'Thus, the general form of differentiation when a kernel function is involved
    is as follows: Let \(\Lambda(f \otimes h)\) be some differentiable function. The
    derivative with respect to \(f\) is


    ```

    \(\frac{\partial}{\partial f} \Lambda(f \otimes h) = (\Lambda''(f \otimes h))
    \otimes h_{rev}\) (B.6)

    ```


    where \(\Lambda''(\xi) = \frac{\partial}{\partial \xi} \Lambda(\xi)\).


    Besides the noise term, the prior term can also contain a kernel operator. Recall
    that the prior energy function models the neighborhood operation and thus can
    be represented as a kernel operation with the kernel selected dependent on the
    properties of the image. We illustrate the gradient using the following prior:


    ```

    \(H_p = - \sum_r \exp(-(f \otimes r)^2)\) (B.7)

    ```


    ```

    \(\frac{\partial H_p}{\partial f} = [2(f \otimes r) \exp(-(f \otimes r)^2)] \otimes
    r_{rev}\) (B.8)

    ```


    Recall that the derivative of the prior, \(\frac{\delta H}{\delta f}\), is itself
    an image, and that image is derived by applying \(r\) to \(f\), multiplying (pixel
    by pixel) with the exponential to produce another image, and applying the reverse
    of \(r\) to that image.'
  merge: -1
  img_proc: true
