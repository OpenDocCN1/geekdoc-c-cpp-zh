- pgno: 306
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_306_0.png)


    Figure 11.17 A springs-and-templates model of a face. The degree of stretching
    or compressing of a spring quantifies the degree of mislocation of the template.
    Not all springs are shown in this figure.


    In Eq. 11.24, $d$ is a template and $F(d)$ is the point in the image where that
    template is applied. TemplateCost is therefore a function indicating how well
    a particular template matches the image when applied at its best matching point.
    SpringCost is a measure of how much the model must be distorted (the springs stretched)
    to apply those particular templates at those particular locations. Finally, it
    may be that not every template can be located – in some images, the left eye may
    not be visible – and a cost may be imposed for things missing. All these costs
    are empirically determined. However, once they are determined, it becomes relatively
    easy to determine how well any given image matches any given model.


    There is one significant problem with spring matching: the number of elements
    matched affects the magnitude of the cost. It is possible that there may be many
    small and truly insignificant errors. Nonetheless, these errors are summed and,
    because there are many, may sum to a large numerical error value. Such an image
    might be compared with an image that has only one error, but that error might
    be huge and obvious. Simply comparing errors may give intuitively incorrect results.


    This is a problem that is not unique to Springs and Templates. The usual solution
    is to normalize the calculations, using a technique such as


    ```

    cost = \frac{SpringCost (\text{unary and binary})}{Total number of springs} +
    \frac{constant}{Total number of references matched} \quad (11.25)

    ```


    Though Springs and Templates serves as a wonderful example for illustrating both
    the need for normalization, and for combining methods, it has been supplanted
    by other, more sophisticated methods, which are mentioned in the following sections.


