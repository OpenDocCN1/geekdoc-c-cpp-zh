    # 10.4.2 Moments


    The moments of a shape are easily calculated, and as we shall see, can be made
    robust to similarity transforms. A moment of order $p + q$ may be defined on a
    region as


    $m_{pq} = \int x^p y^q f(x,y) dx dy$ (10.50)


    where the integral is over the entire region, not just the boundary. If the function
    $f$ is 1 inside the region and 0 outside, the area of the region is then $m_{00}$,
    and we find that the center of gravity is


    $m_x = \frac{m_{10}}{m_{00}}, m_y = \frac{m_{01}}{m_{00}}$. (10.51)


    # Invariance to Translation


    Although the results of Eqs. 10.50 and 10.51 are totally dependent on the coordinate
    system in which the measurements are made, it is possible to derive a set of moment-like
    measurements that are invariant to translation to the center of gravity.


    $\mu_{pq} = \int (x - m_x)^p (y - m_y)^q f(x,y) dx dy$. (10.52)


    These are called the *central moments*.


    Since the central moments are calculated relative to the center of the region,
    the central moments are obviously invariant to translation.'
