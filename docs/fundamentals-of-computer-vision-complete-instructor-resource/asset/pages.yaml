  md: '# Fundamentals of Computer Vision


    Computer vision has widespread and growing application including robotics, autonomous
    vehicles, medical imaging and diagnosis, surveillance, video analysis, and even
    tracking for sports analysis. This book equips the reader with crucial mathematical
    and algorithmic tools to develop a thorough understanding of the underlying components
    of any complete computer vision system and to design such systems. These components
    include identifying local features such as corners or edges in the presence of
    noise, edge-preserving smoothing, connected component labeling, stereopsis, thresholding,
    clustering, segmentation, and describing and matching both shapes and scenes.


    The extensive examples include photographs of faces, cartoons, animal footprints,
    and angiograms. Each chapter concludes with homework exercises and suggested projects.


    Intended for advanced undergraduate and beginning graduate students, the text
    will also be of use to practitioners and researchers in a range of applications.


    **Wesley E. Snyder** is Professor Emeritus of Electrical and Computer Engineering
    at North Carolina State University. He was previously a professor at the Bowman
    Gray School of Medicine and worked at the GE Corporate Research and Development
    Center, NASA Langley Research Center, and the West German Air and Space Agency
    (DLR). He has published 179 research papers and was chosen as an Outstanding Engineering
    Educator in North Carolina in 1993. He was made fellow of the IEEE, Gladdon Fellow
    (University of Western Australia), and Fellow of the American Institute of Medical
    and Biomedical Engineering.


    **Hairong Qi** is the Gonzalez Family Professor of Electrical Engineering and
    Computer Science at the University of Tennessee, Knoxville. Her research interests
    include collaborative signal and image processing, hyperspectral imaging, and
    bioinformatics. She is the recipient of an NSF CAREER Award, numerous best paper
    awards at international conferences, and was awarded the highest impact paper
    from the IEEE Geoscience and Remote Sensing Society in 2012.'
