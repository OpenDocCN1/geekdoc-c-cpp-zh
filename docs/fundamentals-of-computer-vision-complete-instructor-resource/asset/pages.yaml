- pgno: 208
  md: '+   4. A missed classification occurs when a region in the GT image is neither
    correctly segmented nor is part of an oversegmentation or an undersegmentation.


    +   5. A noise classification is identical to a missed classification except that
    the region is really a patch in the MS image.


    In the case of range imagery, two segmentations can be further compared by computing
    the normal vectors to the GT region and the corresponding MS patch and then finding
    the absolute value of the angle between these two vectors. With these definitions,
    we can evaluate the quality of a segmentation of a range image by counting correct
    or erroneous segmentations, and measuring total angle error. By plotting these
    measures vs. T and comparing these plots, a measure of segmenter performance may
    be determined.


    Hoover et al. [8.25] used this approach to do a thorough evaluation of the quality
    of four different range image segmentation algorithms.


    A simpler algorithm is the Jaccard similarity index [8.27]: Let $S_1$ be the area
    of the region returned by the segmentation process, and let $S_2$ be the same
    measure returned by a human expert. Then


    ```

    $J(S_1, S_2) = \frac{S_1 \cap S_2}{S_1 \cup S_2}.$ (8.66)

    ```


    At the International Conference on Computer Vision and Pattern Recognition (CVPR),
    2004, David Martin [8.35] presented an excellent tutorial entitled “Evaluating
    Segmentation,” which was primarily focussed on graph-based algorithms, but is
    also a good tutorial on evaluating segmentation quality.


    # 8.10 Conclusion


    In this chapter, we used the concepts of consistency to identify the components
    of a region. In section 8.2, if all pixels are the same brightness, they are defined
    to be in the same region. Some additional processing is generally needed when
    analyzing histograms (Chow and Kaneko [8.17]; Rosenfeld and Kak [8.43]. Trier
    and Jain [8.53] explain and experimentally compare several such methods).


    The use of various optimization methods is a dominant theme in this chapter. For
    example, in section 8.2.2 we used an optimization method, minimum squared error,
    to find the best threshold. In section 8.5, we obtained a closed boundary using
    the philosophy of active contours, by specifying a problem-specific objective
    function and finding the boundary that minimizes that function. Any appropriate
    minimization technique could be used.


    So what does one use? Of course, the answer is always “it depends.” It depends
    on your problem.


    If you have a problem in which the data is already binarized (partitioned into
    background and foreground), and you need to know which pixels belong to which
    object, then connected components is the tool of choice. In that case, if you
    have one (x, y) pair that you know to be in the region of interest, you may use
    region growing starting at that point; or if you happen to have a version of the
    iterative connected components algorithm that is easy to use (as the authors do),
    just run it on the entire image (it won’t take long), and then see which region
    contains the pixel of interest.'
