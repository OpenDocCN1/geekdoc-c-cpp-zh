    between 0 and 255. A derivation that assumes nothing can be brighter than 255
    can produce interesting results, as with 255 + 2 = 1. More subtle assumptions
    are also around, for example, a relationship may be linear if the second camera
    is a rotation of the first, but not if rotations and translations are combined.


    Also be aware that numerical methods such as inverse problems may be surprisingly
    sensitive to small errors. Learn the meaning of ill-conditioned. As we discussed
    in Chapter 6, ill-conditioned systems require special treatment.


    **Choose Performance Metrics** In the next step, you will need to test your algorithm
    on some images. Wouldn’t you love to say, “My algorithm works better than any
    other on this data!” But what do you mean works better? You need to decide (possibly
    even before you begin the work) how you will evaluate the results. What is good
    performance? How can you measure it? How can you compare it?


    **Test Your Idea on a Synthetic Image** If you completed the project assignments
    of Chapter 5, you already simulated an ideal image. Then, you corrupted that image
    with blur and noise. This sort of simulation allows you to test your algorithms
    under the most favorable conditions. If your algorithm doesn’t work on synthetic
    images, it almost certainly won’t work on real images, which have unknown and
    unmeasured distortions.


    **Test Your Idea on a Phantom** A phantom is a real image, but it contains features
    that have been very carefully measured. The lead-hole images that you may have
    analyzed in the homeworks of Chapter 9 are of holes drilled with high precision
    in a circuit board. Since you know with great precision the parameters of the
    object being imaged, these images represent a type of phantom, and your algorithm
    should return precise answers when it determines the radius of those holes.


    Medical physicists calibrating x-ray machines also use a type of phantom, in the
    form of a block of plastic or wax with very tiny wires embedded in the wax. These
    wires will be visible only if the x-ray machine is working optimally.


    **Determine the Answer to “What Is Truth?”** You probably can’t find the definitive
    answer to this ancient question, but you can and must test your algorithm on real
    examples. To do that, you must determine some definition for how well your'
