    image as in Figure 7.6 but a grayscale s.e. For example, when x = (1, 4),


    ```

    f ⊕ k)(x) = max{f(1, 4) - (0, 0) + k(0, 0), f(1, 4) - (0, 1) + k(0, 1)}

    = max[15, 2] = 15;

    ```


    similarly,


    ```

    f ⊖ k)(x) = min{f(1, 4) + (0, 0) - k(0, 0), f(1, 4) + (0, 1) - k(0, 1)}

    = min[10, -2] = -2.

    ```


    Figure 7.11 illustrates one reason for the fact that grayscale structuring elements
    are seldom used – they can produce negative values. Of course, these are easily
    dealt with by, for example, setting negative pixels to zero. Still, it is easier
    to understand and design flat structuring elements.


    There is one other variation that could be added to grayscale morphology at this
    point: allow the coordinates x and s to be continuous. That variation is not pursued
    in this introductory book.'
