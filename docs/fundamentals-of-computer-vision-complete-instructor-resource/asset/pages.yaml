  md: 'The simplest generalization of the algorithm above is to allow a more general
    definition of “connected to.” That is, in the description above, foreground pixels
    were all black. If we allow grayscale pixels, we could simply define “connected
    to” with a predicate like


    |f(x) - f(y)| > R => CONNECTED(x, y), (8.19)


    or, a more complex measure could be used, for example, pixel color. This region-growing
    algorithm is just one of several strategies for performing connected component
    analysis. Other strategies exist that are faster than the one described, including
    one that runs at raster scan rates [8.49].


    # 8.4.2 An Iterative Approach


    Because the region-growing technique described above always results in closed
    regions, it is usually preferable to other segmentation techniques that are based
    on edge detection or line fitting. Numerous variations and applications of the
    basic region-growing technique have been proposed [8.11, 8.22]. Although region
    growing has proved to be an integral part of Computer Vision, it is not well suited
    for real-time application. This has prompted the consideration of alternative,
    faster, more hardware-specific methods of region partitioning.


    This section presents an alternative algorithm that also produces closed regions.
    This algorithm is functionally identical to recursive region growing in that it
    returns a set of labeled pixels, meeting the adjacency and similarity criteria.
    This method was first published [8.49] as a graph manipulation method based on
    the graph theoretic concepts of “union-find.” It is attractive because it runs
    at video rates when implemented by special-purpose hardware [8.48]. In addition,
    the algorithm will produce the label image “on the fly” with a single pass over
    the data. This result is achieved by using the concept of a content-addressable
    memory. This memory may be a physical piece of hardware or a lookup-table-driven
    access method in simulation software.


    This algorithm is based on the concept of equivalence relationships between the
    pixels of an image. Equivalency is defined here as follows: Two pixels a and b
    are defined to be equivalent (denoted R(a, b)) if they belong to the same region
    of an image. This relationship can be shown to be reflexive (R(a, a)), symmetric
    (R(a, b) => R(b, a)), and transitive (R(a, b) /\ R(b, c) => R(a, c)); which makes
    it an equivalence relation. The transitive property of an equivalence relation
    enables all pixels in a region to be determined by considering only local adjacency
    properties. In this algorithm, the fact that belonging to the same region is transitive
    allows inference.


    As in the previous section, a label image named L will hold the label for a region.
    The label memory is initialized to 0, as a counter named N. In addition, an array
    M is created and is interpreted as meaning: if M[i] = k, then label i is equivalent
    to label k. Following this interpretation, if M is initialized by ∀i, M[i] = i,
    implying that no two labels are equivalent initially. Pixels are labeled top-to-bottom,
    left-to-right, in a raster scan order. A foreground pixel i is compared to the
    pixel above and the pixel to its left. Three scenarios can occur:


    +   1. If neither pixel is labeled, which means they are background pixels, and
    the current pixel is the start of a new region, increase N by 1, and assign N
    as the label for pixel i.'
