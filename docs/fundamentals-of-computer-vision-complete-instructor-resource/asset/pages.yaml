- pgno: 16
  md: '# Part I


    # Preliminaries


    In this part of the book, we start getting ready to do Computer Vision (CV). First,
    we briefly introduce biological vision and the biological motivation of Computer
    Vision. This is followed by a chapter describing how to write computer programs
    to process images. We then provide a chapter of math. The emphasis in that chapter
    is linear algebra, as that is the mathematical discipline most used in CV. We
    also touch briefly on probability and function minimization.


    After we have the human prepared by taking the prerequisites and reviewing the
    math, we need for that human to know what an image actually is. It turns out that
    the word “image” has a number of different meanings in different contexts, and
    Chapter 4 discusses them.'
  merge: -1
  img_proc: true
