  md: '# 12.6.3 Shape from Surface Normals


    Suppose we have the two partial derivatives, \(\frac{\partial z}{\partial x}\)
    and \(\frac{\partial z}{\partial y}\); we have the derivative of \(z\) and we
    want \(z\) – some calculus professor somewhere said we should integrate. Let’s
    try to do that. Since the objective of this book is to illustrate simple principles
    and not go into sophisticated math any more than necessary, we present a simple
    strategy here. No, it’s not the best, but it should illustrate the principles.


    +   1. Start with x = 0 and y = 0

    +   2. Set pixel (x, y) to zero.

    +   3. Range over values of y

    +      (a) range over values of x

    +          • set z(x, y) <- z(x - 1, y) + p(x - 1, y).

    +      (b) increment y and set x to zero.

    +      (c) set z(x, y) <- z(x, y - 1) + q(x, y - 1)


    Observe that the algorithm above is going through the image in a raster scanning
    way, incrementing z by p at every point first, and then doing one increment by
    q per line. There are other ways to walk through the image, other paths to take.
    If it should turn out that we get the same image z no matter which path we take,
    we say that this is an integrable function. In order to be integrable, a function
    should be continuous and differentiable.


    Many papers and Horn’s classic text [12.18] address approaches for solving various
    special cases of the shape from shading problem. A paper by Zhang [12.61] surveys
    the field between Horn’s book and 1999. (Remember, Eq. 12.78 is itself a special
    case – it assumes the brightness does not depend on the observation angle). In
    the following, we discuss another special case, photometric stereo.


