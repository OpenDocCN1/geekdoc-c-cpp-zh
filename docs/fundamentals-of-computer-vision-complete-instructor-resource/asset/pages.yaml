  md: '# Moving the Contour without Using Image Edges


    In this subsection you will learn the concepts underlying the Chan-Vese algorithm,
    one of the most effective current methods for active contour-based segmentation.
    You will also get more exposure to the process of converting between continuous
    and discrete mathematics.


    While most algorithms have names that describe what they do, the algorithm described
    here is named for the authors, Chan and Vese, probably because “Segmentation by
    maximizing the difference between two regions” is too hard to say. At the time
    of this writing, extensions of the Chan-Vese algorithm provide some of the very
    best segmentations, competing with some graph-based methods that will be discussed
    later in this chapter. The Chan-Vese algorithm uses level set approaches to find
    the contour that divides the image into two regions that are maximally different.
    It is important to realize that these regions are not required to be connected.
    Since the algorithm does not rely on image gradient, it can successfully detect
    objects whose boundaries are not necessarily defined by edges.


    Here, we present the same example application that was in the original paper by
    Chan and Vese [8.13]. There are many papers applicable to the student that extend
    the Chan-Vese algorithm [8.12, 8.18, 8.1, 8.2], just to mention a few.


    Philosophically, Chan-Vese segmentation chooses an objective function that describes
    the difference in brightness between the outside and inside of the contour. The
    version discussed here assumes the algorithm is finding a contour that separates
    two relatively homogeneous regions, denoted background and foreground. As we did
    in section 8.5.1 the derivation begins using continuous mathematics and concludes
    using finite differences. Consider the following function:


    \( F(C) = \int_{inside C} (f(x, y) - \mu_1)^2 dxdy + \int_{outside C} (f(x, y)
    - \mu_2)^2 dxdy, \quad (8.47) \)


    where \(\mu_1\) is the mean brightness inside the contour and \(\mu_2\) is the
    mean brightness outside the contour.


    \( F(C) \) will be small if the two regions are close to homogeneous, one precisely
    enclosed by the contour, and the other totally outside the contour. Finding the
    best such contour \( C \) is the objective of the optimization.


    One problem with this objective function can be identified before proceeding further:
    The contour that optimizes this function is not constrained to be smooth, so it
    may sharply curve and deform to match the two regions precisely. We modify \(
    F(C) \) by adding a regularizing term to encourage a smooth contour – simply minimizing
    the length of the contour.


    \( F(C) = a \, \text{Length}(C) + \int_{inside C} (f(x, y) - \mu_1)^2 dxdy + \int_{outside
    C} (f(x, y) - \mu_2)^2 dxdy, \quad (8.48) \)


    where \(\alpha\) is a constant scaling the relative importance of the length of
    the contour compared to the difference in region statistics.


    This problem can be readily converted to a level set problem by defining the function
    \(\psi(x, y)\) as we did previously. For convenience, we denote the set of points
    inside the contour'
