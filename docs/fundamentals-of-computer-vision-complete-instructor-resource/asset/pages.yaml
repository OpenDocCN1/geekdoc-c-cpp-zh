    # 7.3.3 Grayscale Morphology Using Set Operations


    While the definitions in sections 7.3.1–7.3.2 are straightforward and easy to
    implement, another way to define grayscale morphological operations allows the
    use of the binary morphology operations. To accomplish that, a new concept, the
    umbra, is defined:


    The umbra, U(f), of a two-dimensional grayscale image f is the set of all ordered
    triples, (x, y, U), which satisfy 0 <= U <= f(x, y). If we think of f as being
    continuously valued, then U(f) is an infinite set. To make morphological operations
    feasible, f is assumed to be quantized to M values.


    To illustrate the concept of umbra, let f be one-dimensional and the pixel value
    at the corresponding coordinate is


    ```

    f(x) = [1, 2, 3, 1, 2, 3, 3] .

    ```


    f is shown as a brightness function in Figure 7.12.


    In Figure 7.12, the heavy black line represents f, and the umbra is the shaded
    area under f. Following this figure, the heavy black line is the TOP of the umbra.
    The umbra is a set of ordered pairs:


    +   U(f) = {(0, 0), (1, 1), (1, 2), (2, 1), (2, 2), (2, 3), (3, 1), (4, 1), (4,
    2),

    +   (5, 1), (5, 2), (5, 3), (6, 1), (6, 2), (6, 3)}.


    Here''s the trick: Although the gray-level image is no longer binary (and therefore
    not representable by set membership, the umbra does have the properties of a set.
    Therefore, it is possible to define the dilation of a grayscale image f by a grayscale
    s.e., k, using the binary dilation operation as


    ```

    f(x, y) \oplus k(x, y) = TOP(U(f) \oplus U(k))       (7.26)

    ```


    and erosion is similarly defined. Furthermore, grayscale opening and closing can
    be defined in terms of grayscale dilation and erosion.


    Generalizing this concept to two-dimensional images, the umbra becomes three-dimensional,
    a set of triples


    ```

    U(f(x, y)) = {((x, y, z) | (z <= f(x, y))} .       (7.27)

    ```'
