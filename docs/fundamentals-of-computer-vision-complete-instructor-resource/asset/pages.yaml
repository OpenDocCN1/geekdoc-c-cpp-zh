- pgno: 367
  md: 'algorithm is performing, and that requires a definition of what correct performance
    is. For example, in medical imaging, you might decide that if three expert radiologists
    agree, their collective judgement is correct by definition. You get to choose
    the definition, but to publish your results, you have to defend your decision.


    **Thoroughly Test Your Algorithm** You will need to run many tests. Evaluate your
    algorithm as a function of multiple image distortions, such as the amount of additive
    noise, the diversity of test examples, etc. When it fails, learn what makes it
    fail.


    The list of topics above isn''t complete. We didn''t include techniques on how
    to avoid letting frustration get you down.


    In this book, we have introduced a few very important principles. When you encounter
    a real problem, you can use the principles you have mastered here to help you
    grasp the nature of the problem and how hard it might be to solve. Then, you can
    move on to more detailed literature that will provide more, but narrower direction.
    For example, the “bible” of multi-camera image analysis is a 400-page book [13.1],
    which covers in great detail the topics to which we provide an introduction in
    sections 12.2–12.3.


    We hope that the introduction given in this book makes your life a bit easier
    as you move into this exciting field!

    W.E.S. and H.Q.


