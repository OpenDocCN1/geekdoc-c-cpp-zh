  img_proc: true
- pgno: 369
  md: 'Given an unknown feature vector x, project this sample onto some unit vector
    $\phi$, and make a decision using the following rule:


    ```

    decide class 1 if $\phi^T x - q > 0$ otherwise decide class 2, (A.1)

    ```


    where $q$ is a scalar constant. Let $x_1$ and $x_2$ denote points in class 1 and
    class 2 respectively. Since we are seeking the points closest to the decision
    hyperplane, we seek $x_1$ and $x_2$ such that their projections onto $\phi$ are
    as close together as possible, while still being on the correct side. That is,
    we seek points $x_1$ and $x_2$ such that with minimal positive $\rho$,


    ```

    $\phi^T x_1 = q + \rho$

    $\phi^T x_2 = q - \rho$. (A.2)

    ```


    Define $I_i$ to be the set of training examples from class $i$. For any point
    $x$ in $I_i$, $\phi^T x - q > \rho$, and for any such point in $I_2$, $\phi^T
    x - q < -\rho$. We need to find two things: (1) a pair of points, one in each
    class, which are as close together as possible. We will call these points *support
    vectors*; and (2) a vector onto which to project the support vectors so that their
    projections are maximally far apart. We solve this problem as follows:


    Recall that $\phi$ was a unit vector. It is thus equal to some other vector in
    the same direction divided by its magnitude, $\phi = \frac{w}{||w||}$. We will
    find one such vector, with certain properties that will be introduced shortly.
    For now, let $x_1$ denote any point in $I_1$, not necessarily a support vector,
    and similarly for $x_2$. Then


    ```

    $\frac{w}{||w||} x_1 - q \ge \rho$

    $\frac{w}{||w||} x_2 - q \le \rho$ (A.3)

    ```


    which leads to


    ```

    $w^T x_1 - q / ||w|| \ge \rho ||w||$

    $w^T x_2 - q / ||w|| \le \rho ||w||$. (A.4)

    ```


    Define $b = -q ||w||$, and constrain $w$ by requiring that its magnitude satisfy:


    ```

    $||w|| = \frac{1}{\rho}$. (A.5)

    ```


    Now we have two equations that describe behavior for any points in class 1 or
    class 2:


    ```

    $w^T x_1 + b \ge 1$

    $w^T x_2 + b \le 1$. (A.6)

    ```


    We seek the line that maximizes the margin, $\rho$, as illustrated in Figures
    A.1. Eq. A.5 shows that this is the same as finding the projection vector $w$
    whose magnitude is minimal. That is, we seek the $w$ that minimizes $w^T w$. We
    have seen the derivative of a quadratic form before, and we know that the null
    vector would minimize this, providing a trivial and useless solution. Some constraints
    are needed.


    Define a label $y_i$ for the point $x_i$ as,


    ```

    $y_i = \begin{cases} 1 & \text{if } x_i \in I_1 \\ -1 & \text{if } x_i \in I_2.
    \end{cases} (A.7)$

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_370_0.png)


    **Figure A.1** LEFT: A poor choice of the dividing line is illustrated. The sets
    of squares and circles are linearly separable, but this line passes very close
    to points in each class. The support vectors are circled. RIGHT: A better choice
    of the dividing line is illustrated. This line passes as far as possible from
    any point in the two classes, producing a larger margin.


    Using that definition of $y_i$, consider the expression $y_i(w^T x_i + b)$. This
    will always be greater than or equal to 1, regardless of the class of $x_i$. This
    can be used as a constraint, and our minimization problem becomes: find the w
    that minimizes $w^T w$ such that $y_i(w^T x_i + b) \ge 1$. This can be accomplished
    by setting up the following constrained optimization problem:


    $L = w^T w - \sum_{i=1}^l \lambda_i(w^T x_i + b - 1)$ (A.8)


    where $l$ is the number of the samples in the training set.


    Take the partial derivative with respect to w,


    $\frac{\partial L}{\partial w} = w - \sum \lambda_i x_i y_i.$ (A.9)


    Setting this to zero produces


    $w = \sum \lambda_i x_i y_i.$ (A.10)


    Take the derivative with respect to b,


    $\frac{\partial L}{\partial b} = - \sum \lambda_i y_i.$ (A.11)


    The equation for L becomes


    $L = \frac{1}{2} \sum_i \sum_j \lambda_i \lambda_j y_i y_j x_i^T x_j - \sum_i
    \sum_j \lambda_i \lambda_j y_i y_j x_i^T x_j - b \sum_i \lambda_i y_i + \sum_i
    \lambda_i.$ (A.12)


    The first and second terms are the same except for the 1/2. The third term is
    zero. Defining a matrix $A$ by $A_{ij} = [y_i y_j x_i^T x_j]^T$ allows $L$ to
    be written in a matrix form


    $L = - \frac{1}{2} \Lambda^T A \Lambda + 1^T \Lambda$ (A.13)


    where 1 denotes a vector of all ones.'
