  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_89_0.png)


    Figure 5.16 A two-dimensional Gabor filter. Note that the positive/negative response
    looks a lot like the fourth derivative of a Gaussian.


    The Gabor is the product of a Gaussian and a sinusoid, where the Gaussian provides
    center weighting, and the sinusoid provides sensitivity to edges.


    Despite all the parameters, the Gabor is relatively easy to use. It has gained
    popularity for three reasons. First, evidence from biology suggests the Gabor
    is a relatively good representative for the response of neurons in the visual
    cortex to edges in an image. Second, the Gabor is relatively easy to use as a
    directional derivative operator with parameterizable orientation. Furthermore,
    the selection of parameters allows the user to specify not only the scale but
    also the type of edge/line that the filter selects.


    The Gabor filter, applied to a point, x, y, in an image, computes


    ```

    \( x'' = x \cos \theta + y \sin \theta \quad (5.37) \)


    \( y'' = -x \sin \theta + y \cos \theta \quad (5.38) \)


    \( g(x, y; \lambda, \theta, \psi, \sigma, \gamma) = \exp \left( - \frac{x''^2
    + y''^2}{2\sigma^2} \right) \cos \left( 2\pi \frac{x''}{\lambda} + \psi \right)
    \quad (5.39) \)

    ```


    where the normal to the parallel stripes has the angle \(\theta\), \(\lambda\)
    is the variable that determines the wavelength of the sinusoid, \(\gamma\) is
    the aspect ratio (the ratio of length to width of the operator), \(\psi\) is the
    phase, \(\sigma\) is the standard deviation of the Gaussian (the scale).


    If you are using the IFS library, the Gabor is implemented by using the IFS function
    f1Gabor.


    Figure 5.16 illustrates a Gabor filter.


    The Gabor filter, described in this way (you can choose to use complex exponentials
    instead of a cosine), has considerable flexibility. For example, if \(\psi = 0\),
    the cosine is centered at the origin, and we produce a filter that looks (in 1D)
    very similar to the top curve in Figure 5.17. This filter looks almost exactly
    like \(-\frac{d^2f}{dx^2}\) and could be considered a fourth derivative operator,
    or a line detector, since a line is simply two edges back-to-back. If, however,
    \(\psi = \frac{\pi}{2}\), the cosine turns into a sine, and we have a rising step
    edge detector. Similarly, \(\psi = -\frac{\pi}{2}\) will produce a falling edge
    detector.


    The exponential factor of Eq. 5.39 is a two-dimensional Gaussian whose isophotes
    form ellipses with major and minor axes aligned with the x and y axes.


    The following interesting observations have been made [5.20] regarding the values
    of the parameters in Eq. 5.39, when those parameters are actually measured in
    living organisms:


    +   * The aspect ratio, \(\gamma\), of the ellipse is 2:1.'
