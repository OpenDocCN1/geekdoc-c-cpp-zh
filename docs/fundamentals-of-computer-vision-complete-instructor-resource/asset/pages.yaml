    # 5.4.4 A Kernel as a Sampled Differentiable Function


    In Assignment 5.2, you are asked to construct a 5 x 5 derivative kernel by fitting
    a plane using the method derived in section 5.4.2. If you did it correctly, the
    kernel values increase as they are farther from the center. Does that make sense?
    Why should data points farther away from the point where we are estimating the
    derivative contribute more heavily to the estimate? Wrong! It is an artifact of
    the assumption we made that all the pixels fit the same plane. They obviously
    don''t.


    Here is a better way – weight the center pixel more heavily. You already saw this
    – the Sobel operator, Eq. 5.11 does it. But now, let''s get a bit more rigorous.
    Let''s blur the image by applying a kernel that is bigger in the middle and then
    differentiate. We have lots of choices for a kernel like that, e.g., a triangle
    or a Gaussian, but thorough research [5.25] has shown that a Gaussian works best
    for this sort of thing. We can write this process as


    ```

    g_* \approx \frac{\partial(g \otimes h)}{\partial x},

    ```


    where g is the measured image, h is a Gaussian, and g* will be our new derivative
    estimate image. Now, a crucial point from linear systems theory: For linear operators
    D, and \(\otimes\),


    ```

    D(g \otimes h) = D(h) \otimes g. (5.16)

    ```


    Equation 5.16 means we do not have to do blurring in one step and differentiation
    in the next; instead, we can pre-compute the derivative of the blur kernel and
    simply apply the resultant kernel.


    Let''s see if we can remember how to take a derivative of a 2D Gaussian. (Did
    you forget it is a 2D function?)


    A d-dimensional multivariate Gaussian has the general form


    ```

    \frac{1}{(2\pi)^{d/2}|K|^{1/2}} \exp \left( - \frac{[\mathbf{x} - \mu]^T K^{-1}
    [\mathbf{x} - \mu]}{2} \right) (5.17)

    ```


    where K is the covariance matrix, |K| is its determinant, and \(\mu\) is the mean
    vector. Since we want a Gaussian centered at the origin \(\mu = 0\), and since
    we have no reason to prefer one direction over another, we choose K to be diagonal
    (isotropic):


    ```

    K = \begin{bmatrix} \sigma^2 & 0 \\ 0 & \sigma^2 \end{bmatrix} = \sigma^2 I. (5.18)

    ```


    For two dimensions, Eq. 5.17 simplifies to


    ```

    h(x, y) = \frac{1}{2\pi\sigma^2} \exp \left( - \frac{[x \ y]^T [x \ y]}{2\sigma^2}
    \right) = \frac{1}{2\pi\sigma^2} \exp \left( - \frac{x^2 + y^2}{2\sigma^2} \right)
    (5.19)

    ```


    and


    ```

    \frac{\partial h(x, y)}{\partial x} = \frac{-x}{2\pi\sigma^4} \exp \left( - \frac{x^2
    + y^2}{2\sigma^2} \right). (5.20)

    ```'
