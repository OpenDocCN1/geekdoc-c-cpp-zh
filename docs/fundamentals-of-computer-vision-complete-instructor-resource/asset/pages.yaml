  md: '$S_2$ turns out to have eigenvalues of 0.0, 6.0, and 10, and a principal eigenvector
    of $[-0.707 \ 0.0 \ 0.707]^T$.


    Suppose $\mu$ is one of the eigenvectors of $G^T G$. That is, $\mu$ is a vector
    that satisfies


    ```

    $G^T G \mu = \lambda \mu.$ (11.7)

    ```


    Here''s the trick: multiply on both sides of Eq. 11.7 by $G$ to obtain


    ```

    $GG^T(G\mu) = \lambda(G\mu).$ (11.8)

    ```


    for some constant $\lambda$, and we notice that $G\mu$, is an eigenvector of $GG^T$.
    Since the size of $GG^T$ is dramatically larger than the size of $G^T G$, we obtain
    a similarly dramatic decrease in complexity in the process of determining the
    eigenvectors.


    Continuing the example, multiplying $G$ by the principal eigenvector produces


    ```

    $G\mu = \begin{bmatrix} -2 & 1 & 1 \\ 0 & -1 & 1 \\ 1 & 1 & -2 \\ 1 & -1 & 0 \end{bmatrix}
    \begin{bmatrix} -0.707 \\ 0.0 \\ 0.707 \end{bmatrix} = \begin{bmatrix} 2.12 \\
    0.707 \\ -2.121 \\ -0.707 \end{bmatrix}.$

    ```


    Normalization of this vector to make it a unit vector gives $[.6708 \ .2236 \
    -.6708 \ - .2236]^T$.


    Now, if you haven''t already done so, crank up MATLAB and see what the eigenvectors
    of $GG^T$ are.


    Thus, if $e_i$''s are the eigenvectors of $S$, we can obtain them using simple
    linear algebra. Of course, we can''t find all of them. Since $G$ is $mn \times
    p$, and $p \ll mn$, the rank of $GG^T$ will be at most $p$, and so only $p$ of
    the eigenvalues will be nonzero.


    So you have a tool for evaluating sets of images, and matching images to their
    eigenimages. Now, we move on to defining and matching “interesting” regions of
    images.


    # 11.3 Interest Operators


    An interest operator is an operator that returns a high value at those points
    in an image that are “interesting.” There are many such operators, dating back
    to Moravec’s [11.34] work in 1980. Here, we will study just two, the Harris-Laplace
    operator, and the SIFT interest operator.


    # 11.3.1 The Harris-Laplace Operator


    What is an interesting point in an image? It is certainly not a point at which
    there is no change in any direction! How about a point on a line or an edge? At
    such a point, locally, there is a specific direction in which brightness changes
    maximally and another direction in which the change in minimal – somewhat more
    interesting. But what about a corner? As shown in Figure 11.1(c), there is a strong
    change in brightness in multiple directions.


    So a corner would be an interesting point. But how do we turn these observations
    into a useful algorithm? Moravec, mentioned above, did it by taking a small square
    window e.g. $3 \times 3$ and extracting those 9 pixels. He then compared them
    with the $3 \times 3$ window'
