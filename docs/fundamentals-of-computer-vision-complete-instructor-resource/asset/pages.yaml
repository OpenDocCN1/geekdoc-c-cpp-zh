    x 128 pixels. One way to compute those pixels is: for every 4 x 4 square block
    of pixels in the original image, produce a single pixel in the smaller image.
    Simply averaging of the 16 original pixels produces an image in which the information
    is blurred, but the new image is small, as illustrated in the center of Figure
    5.8. But, suppose your customer insists that the lower resolution image, which
