    a sphere (see Figure 10.23). Yet, if the sphere is big enough, or the triangle
    small enough, the difference between the sum of the interior angles and 180 degrees
    becomes vanishingly small. Furthermore, the process through which it becomes vanishingly
    small is smooth. A sphere thus has a "locally Euclidean" geometry. Any surface
    with such a property is called a "manifold." We thus refer to C as the manifold
    of possible closed curves, and will not attempt to prove the Euclidean nature
