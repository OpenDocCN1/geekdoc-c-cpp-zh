    # ## 8.2 Thresholding: Segmentation Based on Brightness Alone


    In this section, you will learn how, using brightness alone, to partition an image
    into regions. You will learn that there are several ways to do this, and see one
    example using minimization to fit two or more Gaussians to a histogram.


    In applications where specific gray values of regions are not important, one can
    segment a picture into “foreground” (or “objects”) and “background” by simply
    choosing a threshold in brightness. Any region whose brightness is above the threshold
    is denoted as a foreground object and all regions below the threshold are denoted
    as background (or, depending on the problem, vice versa).


    Ways to choose thresholds range from the trivially simple to the very sophisticated.
    As the sophistication of the technique increases, performance improves, but at
    the cost of increased computation.


    # ### 8.2.1 The Local Nature of Thresholding


    A single threshold is almost never satisfactory for an entire image. It is nearly
    always the local contrast between object and background that contains the relevant
    information. Since camera sensitivity frequently drops off from the center of
    the picture to the edges due to effects such as lens vignetting or nonuniform
    illumination as shown in Figure 8.3, it may'
