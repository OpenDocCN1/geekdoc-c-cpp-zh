    # 10.2.3 Norms and Metrics


    In the previous paragraph, the word “distance” occurs. Although one usually thinks
    that “distance” means “Euclidean distance,” in this book, this word is used many
    times and in many forms. For that reason, we should be just a bit more rigorous
    about exactly what the concept means. The Euclidean distance (for example) is
    a type of measure called a “metric.”


    Any metric $m(a, b)$ in a $d$-dimensional space has the following properties:
    $m : \mathbb{R}^d \times \mathbb{R}^d \rightarrow \mathbb{R}$


    +   - $\forall_{a,b} m(a, b) \ge 0$ nonnegativity

    +   - $\forall_a m(a, a) = 0$ identity

    +   - $\forall_{a,b} m(a, b) = m(b, a)$ symmetry

    +   - $\forall_{a,b,c} m(a, b) + m(b, c) \ge m(a, c)$ triangle inequality


    We will have several opportunities to examine metrics in later chapters.


    Frequently, we will also find ourselves using the term *norm*, usually in the
    context of the norm of a vector or of a matrix. Usually, the norm operation is
    denoted by the presence of two vertical bars on each side of the vector, as in
    $||\mathbf{x}||$. However, you may encounter the notation of a single vertical
    bar, (as an absolute value) being used as a norm. If $||\cdot||$ is a scalar measure
    of a vector, it is a norm if it has the following properties, for any vectors
    $\mathbf{x}$ and $\mathbf{y}$ and any scalar $\alpha$:


    ```

    if $\mathbf{x} \neq 0$ then $||\mathbf{x}|| > 0$,

    $||\alpha \mathbf{x} + \mathbf{y}|| \le ||\mathbf{x}|| + ||\mathbf{y}||$.

    ```


    We frequently use the term *p-norm*, where $p$ is some integer. The *p-norm* of
    a vector $\mathbf{x}$ is defined by the sum $(\sum_k |x_k|^p)^{1/p}$. Here are
    some common examples:


    +   - $L_0$ **norm** This is simply the number of elements in the vector.

    +   - $L_1$ **norm** $\sum_k |x_k|$. Here $x_k$ is the $i^{th}$ element of the
    vector, and the vertical bar is the absolute value of the element. If the vector
    is resulted from the difference of two vectors, this norm is called the *city
    block distance* because it is the distance you would walk if you could not cut
    across a block. It is also (for the same reason) sometimes called the *Manhattan
    distance*. Figure 10.3 illustrates an application of the Manhattan distance.

    +   - $L_2$ **norm** $\sqrt{\sum_k |x_k|^2}$. This is the usual definition of
    the magnitude of a vector, and is equal to $\sqrt{\mathbf{x}^T \mathbf{x}}$. If
    the vector resulted from the difference of two vectors, this norm is called the
    *Euclidean distance*.

    +   - $L_\infty$ **norm** $(\sum_k |x_k|^\infty)^{1/\infty}$. Obviously, you can''t
    take something to the infinity power, but as $p$ gets larger, $|x_k|^p$ becomes
    dominated by the largest element. Therefore, the L-infinity norm is simply the
    maximum.'
