    # 10.4.3 Chain Codes


    A chain code is a feature describing the boundary of a region. In a chain code,
    a walk around a region is represented by a sequence of numbers, all between 0
    and 7 (if using eight directions) or between 0 and 3 (if using four directions),
    designating the direction of each step. The eight and four cardinal directions
    are defined as illustrated in Figure 10.10. The boundary of a region may then
    be represented by a string of single digits. A more compact representation utilizes
    superscripts whenever a direction is repeated. For example, 001212776660 could
    be written 0^2 12^1 27^2 6^4 0, and illustrates the boundary shown in Figure 10.11.
    The ability to describe boundaries with a sequence of symbols plays a significant
    role in the discipline known as syntactic pattern recognition, and appears in
    the Computer Vision literature. Such a representation allows recognition of shapes
    using principles from compiler theory.


