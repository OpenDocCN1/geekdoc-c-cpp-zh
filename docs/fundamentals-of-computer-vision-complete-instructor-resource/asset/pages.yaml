- pgno: 184
  md: 'ordered points is first placed around the region of interest. The set of points
    then evolves to a new position based on energy minimization. The final contour
    of the object can be obtained by interpolation. An animation of the contour as
    it searches for boundary points reminds the viewer of the movements of a snake,
    hence these boundaries are often referred to as “snakes.” In level set methods,
    on the other hand, a function that represents a smooth surface is first determined.
    This function is then evolved according to some partial differential equation.
    The final contour of the object is given by the zero level set of that function.


    # 8.5.1 Snakes: Discrete and Continuous


    A snake is an ordered set of points in the plane, \(\mathbf{x}_i = [x_i \quad
    y_i]^T\), which constitutes the boundary curve around some area of interest. Following
    this approach, the boundary moves to reduce an energy:


    \(E = E_I + E_E, \tag{8.20}\)


    where the internal energy (\(E_I\)) characterizes the snake itself, and the external
    energy (\(E_E\)) characterizes the image at the points where the snake is currently
    located. We will illustrate two approaches to the use of snakes to segment images:
    discrete snakes and continuous snakes. The former is straightforward and easy
    to grasp. The latter is slightly more complex, and also is somewhat more general.


    # The Discrete Snake


    The internal energy, \(E_I\), measures the degree of bending along the contour,
    the size of the curve, etc., but in particular, the internal energy does not depend
    on the image. The exact form of the internal energy is application-dependent,
    but the following form was originally used:


    \(E_I = \sum_i \alpha ||\mathbf{x}_i - \mathbf{x}_{i-1}|| + \beta ||\mathbf{x}_{i-1}
    - 2\mathbf{x}_i + \mathbf{x}_{i+1}||. \tag{8.21}\)


    Minimizing the first term, that is, finding a set of snake points that makes \(\sum
    \alpha ||\mathbf{x}_i - \mathbf{x}_{i-1}||\) as small as possible, produces a
    curve where the snake points are close together. If \(\beta = 0\), the snake will
    collapse to a single point (if there is no external energy).


    To understand the second term, look at Figure 5.5, which is the second derivative
    of a Gaussian. Note that it is strongly negative in the middle. Now compare that
    to the coefficients inside the second term of Eq. 8.21. You can see that the second
    term in the internal energy roughly estimates the second derivative. Therefore,
    it will be minimized by a straight line, or at least one that curves slowly. Thus
    the curve that minimizes the second term will have little bending.


    We can choose many forms for external energy. The basic idea is, we don’t want
    the snake to move if the local image gradient is high. This could be implemented
    by choosing a form as simple as


    \(E_E = - \sum_i \exp \left[ (f_x(\mathbf{x}_i))^2 + (f_y(\mathbf{x}_i))^2 \right].
    \tag{8.22}\)'
