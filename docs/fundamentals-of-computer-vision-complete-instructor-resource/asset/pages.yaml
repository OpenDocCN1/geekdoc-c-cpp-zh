  md: '# ## 7.2 Binary Morphology


    In this section, we first introduce two basic morphological operators, dilation
    and erosion. We then define opening and closing, two operators that are developed
    based on dilation and erosion. We also discuss interesting properties of these
    operators and their applications in solving computer vision problems.


    # ### 7.2.1 Dilation


    First, we present the intuitive definition: the dilation of an image is that same
    image with all the foreground regions made just a little bit bigger.


    Initially, we consider only binary images with foreground pixels having brightness
    1 and background 0. With this definition, the foreground may be considered as
    a set of ordered pairs of the coordinates of each foreground pixel in the image.
    For example


    ```

    A = {(4, 6), (6, 6), (5, 4), (4, 2), (5, 2), (6, 2)} . (7.1)

