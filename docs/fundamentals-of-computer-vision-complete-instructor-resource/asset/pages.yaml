    # Positive Definite


    A matrix \( A \) is positive definite if


    ```

    \( y = x^T A x > 0, \forall x \in \Re^d, x \neq 0 \).

    ```


    A matrix \( A \) is positive semidefinite if


    ```

    \( y = x^T A x \ge 0, \forall x \in \Re^d, x \neq 0 \).

    ```


    \( x^T A x \) is called a quadratic form. Since the quadratic form always returns
    a scalar, a positive definite or a positive semidefinite matrix is always square.


    # 3.2.6 Derivatives and Derivative Operators


    The derivative of a quadratic form is particularly useful:


    ```

    \( \frac{d}{dx}(x^T A x) = (A + A^T)x \).

    ```


    Since we mentioned derivatives, we will mention a couple of other vector calculus
    things:


    Suppose \( f(\mathbf{x}) \) is a scalar function of \( \mathbf{x}, \mathbf{x}
    \in \Re^d \), then


    ```

    \( \frac{df}{d\mathbf{x}} = \left[ \frac{\partial f}{\partial x_1} \frac{\partial
    f}{\partial x_2} \dots \frac{\partial f}{\partial x_d} \right]^T, \quad (3.18)
    \).

    ```


    and is called the gradient. This will be often used when we talk about edges in
    images, and \( f(\mathbf{x}) \) will be the brightness as a function of the two
    spatial directions. If \( f(\mathbf{x}) \) is vector-valued, then the derivative
    is a matrix


    ```

    \( \frac{d\mathbf{f}}{d\mathbf{x}} = \begin{bmatrix} \frac{\partial f_1}{\partial
    x_1} & \frac{\partial f_1}{\partial x_2} & \dots & \frac{\partial f_1}{\partial
    x_d} \\ \vdots & \vdots & \ddots & \vdots \\ \frac{\partial f_d}{\partial x_1}
    & \frac{\partial f_d}{\partial x_2} & \dots & \frac{\partial f_d}{\partial x_d}
    \end{bmatrix}, \quad (3.19) \).

    ```


    and is called the Jacobian.'
