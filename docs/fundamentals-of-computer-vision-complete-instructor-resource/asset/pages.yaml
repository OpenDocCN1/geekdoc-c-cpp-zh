    # 5.2 Linear Operators


    An operator D(f) that operates on one image, f, to produce a second image, g,
    is said to be linear if


    ```

    g = D(\alpha f_1 + \beta f_2) = \alpha D(f_1) + \beta D(f_2), (5.1)

    ```


    where f1 and f2 are images, \alpha and \beta are scalar multipliers. In the case
    that f is sampled, as digital images are, many authors choose to write f as a
    matrix, fij, instead of the functional notation f(x, y). However, we prefer the
    x, y notation, for reasons that shall become apparent later. We will also find
    it more convenient to use a single subscript fi at several points later, but for
    now, let''s stick with f(x, y) and remember that x and y take on only a small
    range of integer values, e.g., 0 < x < 511.


    Think about a one-dimensional image named f with five pixels and another one-dimensional
    image, which we will call a kernel named h with three pixels, as illustrated in
    Figure 5.1. If we place the kernel down so that its center, pixel h0, is over
    some particular pixel of f, say f2, we get g2 = f1 h-1 + f2 h0 + f3 h1, which
    is a sum of products of elements of the kernel and elements of the image.


    With that understanding, consider the common application to two-dimensional images.
    The general form of sum of products is calculated as follows,


    ```

    g(x, y) = \sum_a \sum_\beta f(x + \alpha, y + \beta) h(\alpha, \beta). (5.2)

    ```


    To better capture the essence of Eq. 5.2, let us write h as a 3 x 3 grid of numbers.
    Remember, y = 0 is at the TOP of the image and y goes up as you go down in the
    image1. Now imagine placing this grid down on top of the image so that the center
    of the grid is directly over pixel f(x, y). Then each h value in the grid is multiplied
    by the corresponding point in the image. We will refer to the grid of h values
    henceforth as a "kernel." Assume for now that \alpha and \beta take on only the
    values -1, 0, and 1, as shown in Figure 5.2. In this case, Eq. 5.2 expands to
    Eq. 5.3, a process we will come to call application of a 3 x 3 kernel.


    ```

    g(x, y) = f(x - 1, y - 1)h(-1, -1) + f(x, y - 1)h(0, -1) + f(x + 1, y - 1)h(1,
    -1) + f(x - 1, y)h(-1, 0) + f(x, y)h(0, 0) + f(x + 1, y)h(1, 0) + f(x - 1, y +
    1)h(-1, 1) + f(x, y + 1)h(0, 1) + f(x + 1, y + 1)h(1, 1) (5.3)

    ```


    1 Note the order of the arguments here, x (column) and y (row). Sometimes the
    reverse convention is followed.'
