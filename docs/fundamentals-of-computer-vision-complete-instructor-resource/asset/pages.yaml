- pgno: 371
  md: 'Finding the vector of Lagrange multipliers ( \(\Lambda\) ) that minimizes \(L\)
    is a quadratic optimization problem. There are several numerical packages available
    that perform such operations. Once we have the set of Lagrange multipliers, the
    optimal projection vector is found by Eq. A.10, which we observe requires a summation
    over all the elements of the training set. To find the \(b\) that minimizes \(L\),
    we need to make use of the Kuhn-Tucker [A.3] conditions:


    \(\lambda_i(y_i(w^T x_i + b) - 1) = 0 \text{ for all } i\) (A.14)


    In principle, Eq. A.14 may be solved for \(b\) using any \(i\), but it is numerically
    better to use an average. Similarly, we note the dimension of \(A\) is the same
    as the number of samples in the training set. Thus, unless some “filtering” is
    done on the training set prior to building the SVM, the computational complexity
    can be substantial.


    # ## A.2 Nonlinear Support Vector Machines


    Instead of dealing with the actual samples, consider applying a nonlinear transformation
    that produces a vector of higher dimension, \(y_i = \Theta(x_i)\). For example,
    if \(\mathbf{x} = [x_1 \ x_2]^T\) is of dimension 2, \(\mathbf{y}\) could be defined
    by


    \(\mathbf{y} = [x_1^2 \ x_2^2 \ \sqrt{2}x_1x_2 \ x_1 \ x_2 \ 1]^T\) (A.15)


    which is of dimension 6. This increase in dimension does not destroy the capability
    of the classifier. Indeed, SVMs seem to cope well with having more unknowns than
    samples in the training sets.


    An expansion of the form described in Eq. A.15 increases the dimensionality of
    the space, and increases the likelihood that the classes will be linearly separable
    in the higher dimensional space (for reasons beyond the scope of this brief explanation).
    It also provides a simple mechanism for incorporating nonlinear mixtures of the
    information from the measurements. The polynomial form of Eq. A.15 is but one
    way of expanding the dimensionality of the measurement vector. A more interesting
    collection of ways comes to mind when one looks at Eq. A.13 and observes that
    to compute the optimal separating hyperplane, one does not need to know the vectors
    themselves, but only the scalars that result from computing all possible inner
    products. Thus, we do not need to map each vector to a high-dimensionality space
    and then take the inner product of those vectors if we can figure out ahead of
    time what those inner products should be.


    # ## A.3 Kernels and Inner Products


    We seek the best separating hyperplane in the higher dimensional space defined
    by \(\mathbf{y}_i = \Theta(\mathbf{x}_i), \Theta: (R^d \rightarrow R^m)\) where
    \(m > d\). Then, the equation for the elements of \(A\) becomes functions of the
    inner products of these new vectors \(A = [y_i y_j^T \Theta(\mathbf{x}_i) \Theta(\mathbf{x}_j)]\).
    For notational convenience (and to lead to a really clever result), define a kernel
    operator, \(K(\mathbf{x}_i, \mathbf{x}_j)\), which takes into account both the
    nonlinear transformation, \(\Theta\), and the inner product. Instead of asking
    “what nonlinear operator should I use,” let’s ask a different question: “Given
    a particular kernel, is there any chance it represents the combination of a'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'nonlinear operator and an inner product?” The amazing answer is “yes, under
    certain conditions that is true.” These conditions are known as Mercer’s conditions:
    Given a kernel function \( K(\mathbf{a}, \mathbf{b}) \) of two vector-valued arguments,
    if for any \( g(\mathbf{x}) \) that has finite energy,¹ then \( \int K(\mathbf{a},
    \mathbf{b})g(\mathbf{a})g(\mathbf{b})d\mathbf{a}d\mathbf{b} \ge 0 \), and there
    exists a mapping \( \Phi \) and a decomposition of \( K \) of the form


    ```

    \( K(\mathbf{a}, \mathbf{b}) = \psi_i(\mathbf{a})\psi_i(\mathbf{b}). \) (A.16)

    ```


    In Eq. A.16, the subscript \( i \) denotes the \( i^{th} \) element of the vector-valued
    function \( \psi \). Thus, that expression represents an inner product. Notice
    that Mercer’s conditions simply state that if \( K \) satisfies these conditions,
    then \( K \) may be decomposed into an inner product of two instances of a function
    \( \psi \). They do not say what \( \psi \) is, nor do they say what the dimensionality
    of \( \psi \) is. But that’s OK. We do not have to know. In fact, the vector \(
    \psi \) may have infinite dimensionality. That’s still OK.


    One kernel that is known to satisfy Mercer’s conditions and that is very popular
    in the SVM literature is the radial basis function


    ```

    \( K(\mathbf{a}, \mathbf{b}) = \exp \left( - \frac{(\mathbf{a} - \mathbf{b})^T(\mathbf{a}
    - \mathbf{b})}{2\sigma^2} \right). \) (A.17)

    ```


    In the literature, Support Vector Machines have been applied to problems such
    as face recognition [A.6], bird recognition [A.10], general object recognition
    [A.2] breast cancer detection [A.1], and many others. In comparative analyses
    in the literature, they have empirically been shown to outperform classical classification
    tools such as neural networks and nearest neighbor rules [A.5, A.8, A.9]. Interestingly,
    in a comparison with a classifier based on hyperspectral data, an SVM-based classifier
    using multispectral data (derived from the original hyperspectral data by filtering)
    performed better than classifiers based on the original data [A.4].


    # Bibliography


    +   [A.1] P. S. Bradley, U. M. Fayyad, and O. L. Mangasarian. Mathematical programming
    for data mining: Formulations and challenges. INFORMS Journal on Computing, 11(3),
    1999.


    +   [A.2] P. Felzenszwalb, R. Girshick, D. McAllester, and D. Ramanan. Object
    detection with discriminatively trained part based models. IEEE Trans Pattern
    Anal Mach Intell., 32(9), 2010.


    +   [A.3] R. Fletcher. Practical Methods of Optimization. Wiley, 1987.


    +   [A.4] B. Karacaali and W. Snyder. On-the-fly multispectral automatic target
    recognition. In Combat Identification Systems Conference, Jun 2002.


    +   [A.5] D. Li, S. M. R. Azimi, and D. J. Dobeck. Comparison of different neural
    network classification paradigms for underwater target discrimination. In Proceedings
    of SPIE, Detection and Remediation Technologies for Mines and Minelike Targets
    V, volume 4038, pages 334–345, 2000.


    +   [A.6] E. Osuna, R. Freund, and F. Girosi. Training support vector machines:
    an application to face detection. In Proceedings of CVPR’97, Jun 1997.


    +   [A.7] V. Vapnik. The Nature of Statistical Learning Theory. Springer, 1995.


    ¹ \( \int g_2(\mathbf{y}) d\mathbf{y} \) is finite).'
