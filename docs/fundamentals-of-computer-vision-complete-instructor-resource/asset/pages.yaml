    $$ M = \begin{bmatrix} 1 & 2 & 3 \\ 4 & 1 & 3 \\ 1 & 1 & 1 \end{bmatrix} $$


    The matrix $M$ has determinant $|M| = 5.0$.


    Now, rotate all three points about the $z$ axis by rotation of $\pi/4$ and then
    translate all the points by (2,4) using a homogenous transform matrix:


    $$ M'' = \begin{bmatrix} 0.7071 & -0.7071 & 2 \\ 0.7071 & 0.7071 & 4 \\ 0 & 0
    & 1 \end{bmatrix} \begin{bmatrix} 1 & 2 & 3 \\ 4 & 1 & 3 \\ 1 & 1 & 1 \end{bmatrix}
    $$


    and of determinant of $M''$ will be 5.0, just as it was before the motion. This
    is a property of determinants, and demonstrates one example in which the determinant
    is invariant to isometries.


    Clearly, relationships exist between measurements in the 2D image and points in
    3D space, and we should seek such relationships that are invariants.


    This section introduces the concept of invariants using the work of Weiss and
    Ray [12.56] that relates invariants in three dimensions to invariants in two dimensions.


    We start with simply finding a set of numbers that are invariant. The approach
    will be to find five points in the 3D model and calculate from them some properties
    that uniquely characterize them in an invariant way. Then, we will find five points
    in the image and determine which model they best match.'
