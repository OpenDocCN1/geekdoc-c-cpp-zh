    # 8.5 Segmentation Using Active Contours


    In this section, you will learn how to segment regions by first assuming a contour,
    e.g., a circle outside the region, and then letting that contour move until it
    stops when it encounters the region. The concept of active contours was originally
    developed to address the fact that any edge detection algorithm will fail on some
    images, because in certain areas of the image, the edge simply does not exist.
    For example, Figure 8.20 illustrates a human heart imaged using nuclear medicine.
    In certain cardiology studies it is necessary to estimate the volume of blood
    in the left ventricle. The volume measurement process is performed as follows:


    A radioactive drug is introduced into the blood stream, and an image is made that
    reflects the radiation at each point. The brightness at a point is a measure of
    the integral in a direction perpendicular to the imaging plane of the amount of
    blood in the area subtended by that pixel. The volume of blood within the ventricle
    can thus be calculated by summing the brightness over the area of the ventricle.
    Of course, this requires an accurate segmentation of the ventricle boundary, a
    problem made difficult by the fact that there is essentially no contrast in the
    upper left corner of the ventricle. This occurs because radiation from other sources
    behind the ventricle (superior and inferior vena cava, etc.) contributes to blur
    out the contrast. Thus, a technique is required that can bridge these rather large
    gaps.


