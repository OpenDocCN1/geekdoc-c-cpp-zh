  md: '# Part IV


    # The 2D Image in a 3D World


    We humans and our computers live in a three-dimensional world, but our eyes see
    only projection of that world onto our two-dimensional retinas. We correct for
    that projection just a bit by using stereo vision. Somehow our eye-brain system
    knows how to infer a degree of depth by using two images together.

    Of course, our eye-brain system can be fooled.

    In this part of the book, we provide the student with basic tools and understanding
    of this phenomenon.


    ![](img/5f95dd954ac63cc68119f6f48ca99e18_316_0.png)'
