    # 3.3 Introduction To Function Minimization


    Minimization of functions is a pervasive element of engineering: One is always
    trying to find the set of parameters that minimizes some function of those parameters.
    Notationally, we state the problem as: Find the vector \( \hat{\mathbf{x}} \)
    that produces a minimum of some function \( H(\mathbf{x}) \):


    ```

    \( \hat{H} = \min_{\mathbf{x}} H(\mathbf{x}) \) (3.35)

    ```


    where \( \mathbf{x} \) is some \( d \)-dimensional parameter vector, and \( H
    \) is a scalar function of \( \mathbf{x} \), often referred to as an *objective
    function*. We denote the \( \mathbf{x} \) that results in the minimal \( H \)
    as \( \hat{\mathbf{x}} \)


    ```

    \( \hat{\mathbf{x}} = \arg \min_{\mathbf{x}} H(\mathbf{x}) . \) (3.36)

    ```


    There are two distinct reasons for learning how to minimize a function:


    +   - We may need to find a way to perform some process that has a minimal cost,
    minimal run time, minimal programming difficulty, etc.

    +   - We may need to solve some problem that we don''t (immediately) know how
    to solve. For example, we might seek to draw a contour in an image that separates
    dark areas from light areas with the additional desire that the regions should
    be as smooth as possible.


    9 In this book, essentially every computer vision topic will be discussed in terms
    of some sort of minimization, so get used to it!'
