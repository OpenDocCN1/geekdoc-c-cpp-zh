    Figure 11.18 Boundary of an object. Points where the sign of the curvature changes
    are marked. Figure redrawn from [11.22].


    The first step is to identify feature points that are relatively distinctive.
    Then the algorithm will make use of relationships between these points. Points
    on the boundary of a region where the curvature of the boundary changes sign meet
    this requirement, as illustrated in Figure 11.18.


    This example derivation was first described by Shapiro and Brady [11.46] who use
    eigenvector methods as follows:


    As in the original Springs and Templates formulation, we are finding which of
    a collection of feature point sets best matches one particular set. Let \(d_{ij}\)
    be the Euclidean distance between feature points \(x_i\) and \(x_j\), and construct
    a matrix of weights


    \(H = H_{ij}, \text{ where } H_{ij} = \exp \left( - \frac{d_{ij}}{2\sigma^2} \right).\)
    (11.26)


    The matrix \(H\) is diagonalized using eigendecomposition into the product of
    three matrices


    \(H = E \Lambda E^T.\) (11.27)


    Let us assume the rows and columns of \(E\) and \(\Lambda\) are sorted so that
    the eigenvalues are sorted along the diagonal in decreasing size. We think of
    each row of \(E\) as a feature vector, denoted \(\mathbf{F}_i\). Thus \(E = \begin{bmatrix}
    \mathbf{F}_1 \\ \vdots \\ \mathbf{F}_n \end{bmatrix}\).


    Suppose we have two images, \(f_1\) and \(f_2\), and then suppose \(f_1\) has
    \(m\) feature points while \(f_2\) has \(n\) feature points, and suppose \(m <
    n\). Then by treating each set of feature points independently, we have \(H_1
    = E_1 \Lambda_1 E_1^T\) for image \(f_1\), and \(H_2 = E_2 \Lambda_2 E_2^T\) for
    image \(f_2\). Since the images have different numbers of points, the matrices
    \(H_1\) and \(H_2\) have different numbers of eigenvalues. We therefore choose
    to use only the most significant \(k\) features for comparison purposes.


    It is important that the directions of the eigenvectors to be matched be consistent,
    but changing the sign does not affect the orthonormality. We choose \(E_1\) as
    a reference and then orient the axes of \(E_2\) by choosing the direction that
    best aligns the two sets of feature vectors. See [11.46] for details. After aligning
    the axes, a matrix \(Z\) characterizing the match between image 1 and image 2
    is defined by


    \(Z_{ij} = (\mathbf{F}_{i1} - \mathbf{F}_{P})^T (\mathbf{F}_{i1} - \mathbf{F}_{P2}).\)
    (11.28)


    The best matches are indicated by the elements of \(Z\) that are the smallest
    in their row and column.'
