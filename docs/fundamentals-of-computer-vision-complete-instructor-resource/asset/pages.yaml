  md: 'The derivation above referred to an arbitrary matrix P. To do stereopsis, we
    use Eq. 12.35 substituting P_l for P, and again for P_r, to produce a system of
    four equations:


    ```

    [vP13 - P12] X = 0

    [vP13 - P11] X = 0

    [vP13 - P12] X = 0

    [vP13 - P11] X = 0

    ```


    Now we have four equations in three unknowns, and Eq. 12.36 may be rewritten as
    a matrix-vector product:


    ```

    AX = 0.

    ```


    X may be found ([12.15], page 90) as the eigenvector corresponding to the smallest
    eigenvalue of A^T A.


    # 12.3.5 A Fundamental Ambiguity


    Everything we have done in this chapter since section 12.3 has been based on the
    observation that it is difficult to measure camera pose to the accuracy one would
    like. So we have used correspondences to find both the projection matrices and
    the 3D spatial points. We haven''t actually measured anything. To see where this
    could get us in trouble, think about the following rather basic equation that
    you have seen before:


    ```

    x = PX.

    ```


    By finding correspondences, we found a matrix P, and, for many of the interesting
    points in the image, x_i, we have found the corresponding spatial point X_i. We
    can write Eq. 12.38 as


    ```

    x = PIX.

    ```


    where I is the 4 x 4 identity matrix. Now let H be any invertible 4 x 4 matrix.
    We can replace I by HH^-1, producing


    ```

    x = PHH^-1 X = (PH)(H^-1 X).

    ```


    We now notice that PH can be thought of as a camera matrix, and H^-1 X can be
    thought of as a spatial point. These also satisfy the conditions of Eq. 12.38.


    There are really an infinite number of matrix/point pairs that can satisfy the
    conditions. To truly solve the shape from motion problem, we need some actual
    measurement; otherwise, we cannot tell the difference between a toy tank up close
    and a real tank further away.


    There are several approaches to solving this triangulation problem. The methods
    of solution already discussed are appropriate to this problem as well. The reader
    is referred to [12.15] for additional detail.'
