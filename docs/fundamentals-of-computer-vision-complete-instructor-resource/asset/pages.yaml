    for the vector of coefficients.


    However, the implicit form can be used to make the following observation: If the
    point [x_i, y_i, z_i]^T is on the surface described by the parameter vector [a,
    b, c, f, g, h, p, q, r, d]^T, then S(x_i, y_i, z_i) should be exactly zero.


    When we substitute an actual x, y, z value into the equation for a particular
    quadric it is likely that the value of S will not be precisely zero. The value
    of S is known as the residual. We use the fact that the residual should be zero
    if the data and the coefficients agree in order to develop an algorithm for finding
    the coefficients, which is sometimes known as minimizing the squared residual,
    and sometimes as minimizing the algebraic distance.


    The coefficients may be found by minimizing E = \sum(S(x_i, y_i, z_i))^2. In some
    cases, this gives good results, but it is not really what we want. We really should
    be minimizing some distance metric, for example the Euclidean distance from the
    point to the surface (this is known as the geometric distance [12.47] to the surface).
    This often turns out to be algebraically intractable. (To implement this, see
    [12.51] for important details.) Although methods based on the algebraic distance
    work relatively well most of the time, they can certainly fail. Any distance measure
    we use should have the following properties [12.27]: (1) the measure should be
    zero whenever the true (Euclidean, geometric) distance is zero (the algebraic
    distance accomplishes this); (2) at the sample points, the derivatives with respect
    to the parameters are the same for the true distance and the measure.


    In the next subsection, the quadric is fit to a set of data.'
