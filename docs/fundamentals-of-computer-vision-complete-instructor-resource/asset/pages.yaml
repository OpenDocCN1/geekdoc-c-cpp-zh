  img_proc: true
- pgno: 116
  md: '# 6.4.2 Simulation of a PDE


    How, then, does one simulate a PDE? For this PDE, which has the change with respect
    to time on the left, it''s really easy. Just think of the equation in discrete
    time and write, for pixel i,


    \(\frac{\Delta f_i(x,t)}{\Delta t} = \frac{\partial}{\partial x} \left[ c \frac{\partial
    f(x,t)}{\partial x} \right]_i, \quad (6.7)\)


    and then let \(\Delta t\) be the time it takes for one iteration through the program.
    You already know how to approximate the right-hand side. The left-hand side is
    the change at each iteration. So, as mentioned above, compute the right-hand side
    and add that to \(f\) in each iteration.


    # 6.4.3 The Diffusion Equation in Two Dimensions


    Equation 6.7 provides a way to continuously smooth a one-dimensional function.
    The previous description can be generalized to two dimensions by using the vector
    gradient as follows. (Remember, the vector gradient operator in two dimensions
    is \(\nabla = \left[ \frac{\partial}{\partial x} \quad \frac{\partial}{\partial
    y} \right]^T\)).


    \(\frac{\partial f_i}{\partial t} \approx \alpha (\nabla^T(c\nabla f))|_i, \quad
    (6.8)\)


    which would be simulated in the same way. The multiplicative scalar \(\alpha\)
    is a result of the fact that we aren''t really using infinitesimal derivatives.
    Choose \(\alpha\) to be a small positive constant, like 0.01 when you actually
    implement this. This will be discussed in more detail when we consider gradient
    descent.


    # 6.4.4 Variable Conductance Diffusion (VCD)


    The problem with simulating the diffusion equation is, of course, that it blurs
    everything. It takes out noise and it takes out edges. This problem can be fixed
    by considering the scalar c.


    First, let c be a scalar function of position, c(x, y). To smooth, expect at edges,
    let c(x, y) be small if (x, y) is an edge pixel. If c(x, y) is small (in the heat
    transfer analogy, little heat flows, and in the image, little smoothing occurs.
    If, on the other hand, c(x, y) is large, then much smoothing is allowed in the
    vicinity of pixel (x, y). VCD then implements an operation that after repetition
    produces a nearly piecewise uniform result. It only smoothes between edges, thus
    preserving those edges.


    Since c is a function of space, it cannot be factored out of Eq. 6.5 to produce
    a nice second derivative on the right. But what form should c take? It can be
    any function of space that is close to zero in areas where the image is very "busy."2
    One possible form is:


    \(c(x, y) = \exp(-\Lambda(f(x, y))) \quad (6.9)\)


    where \(\Lambda(f(x, y))\) is some measure of how strong the edges are in the
    vicinity of (x, y). The choice of a particular form for c is problem-dependent,
    but when the edge is strong, \(\Lambda\) should be large, so that the exponential
    is near zero, and there is no blurring. If there are no


    2 That is, the intensity values of the pixels vary significantly.'
