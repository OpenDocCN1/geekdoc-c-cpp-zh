  md: '![](img/5f95dd954ac63cc68119f6f48ca99e18_51_0.png)


    Figure 3.6 The probability distribution of Figure 3.5, showing the probability
    of rolling two dice to get a number LESS than x. Note that the curve is steeper
    at the more likely numbers.


    Another well-formed question would be, “What is the probability that a man’s height
    is between x and x + Δx?” Such a question is easily answered in terms of the density
    function:


    ```

    Pr(x ≤ h < x + Δx) = Pr(h < x + Δx) - Pr(h < x) = P(x + Δx) - P(x)

    ```


    Dividing by Δx and taking the limit as Δx → 0, we see that we may define the *probability
    density function* as the derivative of the distribution function:


    ```

    p(x) = \frac{d}{dx}P(x) (3.58)

    ```


    where p(x) has all the properties that we desire. It is well defined for continuously
    valued measurements and it has a maximum value for those values of the measurement
    that are intuitively most likely. Furthermore,


    ```

    \int_{-\infty}^{\infty} p(x)dx = 1 (3.59)

    ```


    which we must require, since **some** value will certainly occur.'
