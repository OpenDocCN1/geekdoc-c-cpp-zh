    When thinking about grayscale morphology, it is sometimes helpful to think of
    images as triples, consisting of the x coordinate, the y coordinate, and the brightness.
    For example, the triple (3, 4, 5) states that the pixel at x = 3, y = 4 has brightness
    5.


    Figure 7.5 illustrates two structuring elements, showing the difference between
    flat and nonflat structuring elements.


    # 7.3.1 Grayscale Images Using Flat Structuring Elements


    A structuring element is defined as flat if it has a constant height (usually
    1) at every point. Using a flat s.e. provides some simplification that allows
    the student to make the transition to true grayscale morphology. The basic morphological
    operations of dilation and erosion are described in this section. Opening and
    Closing can be determined using Eqs. 7.18 and 7.19, as before.


    Because the images are grayscale, it becomes awkward to use set concepts to describe
    images, and we usually revert to function notation. (Note: it is possible to do
    these operations using set operations, and we describe these in section 7.3.3).


    The coordinates of a point in the image will be denoted by a vector x or similar
    boldfaced symbol. Using this notation, it becomes easy to think about morphological
    operations in 3 or higher dimensional spaces. Similarly, the coordinates of a
    point in the structuring element will be denoted by the vector s.


    Now, we need a notation for describing the result of dilation in a functional
    way. This can easily be accomplished by using the operation as the name of the
    function. For example, the result of dilating image f by structuring element k,
    as a function of position x is simply $(f \oplus k)(x)$. There are other notations
    in the literature, such as \(\delta_k^f(f)\), but we prefer this one.


    # Grayscale Dilation


    The dilation of a grayscale image by a flat s.e. can be defined as


    ```

    $(f \oplus k)(x) = \max_{s \in k} \{ f(x - s) \} . \quad (7.21)$

    ```


    Observe that Eq. 7.21 makes no reference to the brightness of the structuring
    element, only the coordinates. Therefore, if this equation is used, it is the
    same as having a flat structuring element, and only the shape of the s.e. matters,
    not its brightness.


    Before we continue, look at Eq. 7.21$^3$ and, as we did in section 7.2, interpret
    what it means in the context of binary images and binary structuring elements.
    s is the coordinate


    $^3$ Remember: x is a coordinate in the image, s is a coordinate in the s.e.'
