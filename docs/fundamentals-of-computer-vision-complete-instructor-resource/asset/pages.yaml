    The histogram h(f) of an image f(x, y) is a function of the permissible intensity
    values. In a typical imaging system, intensity takes on values between zero (black)
    and 255 (white). A graph that shows, for each gray level, the number of times
    that level occurs in the image is called the histogram of the image. Illustrated
    in Figure 8.5 is a histogram of a checkerboard under reasonably uniform illumination.


    Often, instead of using individual brightness values that answer the question
    “How many pixels have brightness 35?”, a histogram is set up to answer the question
    “How many pixels have brightness between 35 and 55?” In this case, the horizontal
    axis of the histogram is broken into segments called bins. There might, for example,
    be only 64 bins in an image with brightness ranging from 0 to 255, and all brightnesses
    in one bin (say, 33 to 36) would be considered the same. Modifying a histogram
    in this way is called rebinning, and is needed when the number of samples is small.
    For example, suppose you wanted a histogram of the grades in the Computer Vision
    class, but there are only 30 students. Assuming all the grades are between 50
    and 100, it is likely that most bins will contain either zero or one sample. To
    get a useful histogram, we could break the 50–100 range into ten bins of five
    points each. With only ten bins, distinct peaks might be visible. If not, then
    another rebinning might be required.


    If the histogram h(f) is divided by the number of pixels in the image, we arrive
    at a function that has all the properties of a discrete probability. Henceforth,
    when we use the notation h(f), we assume that division has been done, and think
    of the histogram as a probability function.


    Figure 8.5 illustrates the same checkerboard as Figure 8.3. Two distinct peaks
    are present, one at gray level 100, and one at gray level 200. With the exception
    of noise pixels, almost every point in the image belongs to one of these regions.
    A good threshold, then, is anywhere between the two peaks.'
