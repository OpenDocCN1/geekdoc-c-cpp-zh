  md: '# # 7 Mathematical Morphology


    > > I think the universe is pure geometry – basically, a beautiful shape twisting
    around and dancing over space-time. – Antony Garrett Lisi


    # ## 7.1 Introduction


    In this chapter, a study of shape begins. Throughout the remainder of this book
    we will continue to look at shape in many different ways. Here, the topic is introduced
    at the pixel level, providing some simple, local operations that modify shapes,
    changing connectivity, and providing nonlinear ways to treat noise.


    +   - (Section 7.2) Binary morphology changes the shape of binary objects. We
    define the two basic morphological operators, dilation and erosion, on the basis
    of which two other operators, opening and closing, can be derived. We also discuss
    some interesting properties of these morphological operators and their applications
    in noise removal and edge linking.

    +   - (Section 7.3) We extend the discussion to grayscale morphology and define
    the dilation and erosion operations when the objects are not described in binary
    values. We progress from grayscale morphology using flat structuring elements
    to the use of grayscale structuring elements.

    +   - (Section 7.4) As one of the most important applications of morphological
    operations, we discuss the distance transform (DT) and different ways to compute
    the DT.


    Morphological operations may be considered as either the result of set operations,
    or the result of composition of functions. Both these approaches are described
    in this chapter, in order to provide the student with the insight to see similarities
    and suitability. We will find that set-theoretic ways of thinking about morphology
    are most appropriate for binary images, and functional notation is more convenient
    for grayscale images. In section 7.5, an application example of combining dilation,
    erosion, and distance transform for the purpose of edge linking is provided to
    illustrate the power of these operations.


    1 That is, analogous to set intersection and union.'
