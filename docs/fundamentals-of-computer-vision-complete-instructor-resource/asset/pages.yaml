  md: "# Finding Minima\n\nHere, we address a seemingly simple issue, finding local\
    \ minima in an image. It would appear obvious: just look for pixels that have\
    \ a lower value than all their neighbors. However, in a quantized image, it is\
    \ possible for two adjacent pixels to have the same brightness. Thus, we must\
    \ redefine a minimum as follows:\n\n**Definition:** a *minimum* is a connected\
    \ set of pixels, $R$, all with the same brightness, in which no pixel has any\
    \ immediate neighbors of lesser brightness. That is,\n\n$R = \\{p | f(p) \\le\
    \ f(q), \\eta \\in \\eta(p)\\}.$\n\nwhere $\\eta(p)$ denotes the local neighborhood\
    \ of $p$. $\\eta(p)$ may be defined using 4- or 8-neighborhoods in 2D images and\
    \ 6-, 8-, or 26-neighbors in 3D.\n\nGiven the definition, it would still seem\
    \ simple to find minima. Just find all regions that are all the same brightness,\
    \ but have outer boundary pixels that are minima of their immediate neighborhoods.\
    \ Unfortunately, it isn't all that simple, because it requires a solution to the\
    \ connected components problem.\n\nInstead, let's think of it in sort of a brute-force\
    \ way:\n\nStart with two images, as in our discussion of connected components,\
    \ a brightness image, $f$ and a label image $L$. Initialize all elements of $L$\
    \ to COULDBE, meaning that this pixel might be an element of a minimum. Then use\
    \ the following pseudocode algorithm:\n\n```\nfor (p = 0; p < NumberOfPixels)\n\
    \    if (L(p) != NOTAMIN)\n    {\n        for q in the immediate neighborhood\
    \ of p\n        {\n            if ((f(p) > f(q) ) L(p) <-- NOTAMIN\n         \
    \   if (f(p) == f(q) && L(q) == NOTAMIN) L(p) <-- NOTAMIN\n        }\n    }\n\
    ```\n\nOne pass of this algorithm produces a label image that has pixels marked\
    \ as “Cannot be a Minimum” (NOTAMIN) or as “unknown” (COULDBE).\n\nA few iterations\
    \ of the same algorithm, applied to successive label images, will converge to\
    \ a real minima.\n\nThe surprising part of this extremely simple algorithm is\
    \ how quickly it converges. The iterations stop as soon as no pixels are relabeled\
    \ from COULDBE to NOTAMIN. The graph in Figure 8.32 shows the number of pixels\
    \ marked as COULDBE during multiple iterations of the algorithm running on (blue)\
    \ a simple 128 x 128 image, and (red) a 141 x 141 image with a great deal more\
    \ complexity (a lion footprint in sand). From the figure, we observe that finding\
    \ all minima in a simple 128 x 128 image requires only four passes through the\
    \ data, and a very complex, noisy 141 x 141 image with a lot of clutter requires\
    \ only ten passes."
