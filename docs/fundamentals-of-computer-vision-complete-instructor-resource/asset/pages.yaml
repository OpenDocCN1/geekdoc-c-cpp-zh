    # 6.2.2 The 2D Case


    In two dimensions, we use a two-dimensional Gaussian approximation like


    | 1 | 2 | 1 |

    |---|---|---|

    | 2 | 4 | 2 |

    | 1 | 2 | 1 |


    Such a kernel simply blurs the image. Indeed, that will reduce noise in the image,
    but it will also blur the edges and seriously degrade the image quality. Therefore,
    we will need to find a method that reduces the noise, but still results in sharp
    edges. Such an algorithm is called edge-preserving smoothing. However, before
    we think about edge-preserving smoothing, we need to understand simply smoothing
    first.


    Convolution'' with a Gaussian blurs an image very effectively, but raises the
    question “what is the best choice of \(\sigma\)?” For convenience, we repeat the
    equation for a 2D Gaussian, Eq. 5.19:


    ```

    \(h(x, y) = \frac{1}{2\pi\sigma^2} \exp \left( - \frac{[x \ y][x \ y]^T}{2\sigma^2}
    \right) = \frac{1}{2\pi\sigma^2} \exp \left( - \frac{x^2 + y^2}{2\sigma^2} \right)\)
    (6.2)

    ```


    To get more blur, just make \(\sigma\) larger. But, making \(\sigma\) larger will
    require a larger kernel, since the kernel size is usually chosen to be 2 or 3
    \(\sigma\), which in turn causes additional problems at image boundaries and requires
    more compute time.


    In Figure 6.2, a one-dimensional impulse is illustrated, as well as two blurs
    of that impulse. Recall that all three curves integrate to the same value.


    1 Note that in this chapter, we use the term “convolution” to actually indicate
    the “sum-of-product” operator. Since the Gaussian kernel is symmetric, convolution
    here is actually equivalent to correlation.'
