    # 7.2.2 Erosion


    The erosion operator is defined to be a sort of inverse of dilation. It is not
    a formal inverse because dilation followed by erosion does not necessarily produce
    the original image. In fact, this is one of the most powerful aspects of morphological
    operations.


    ```

    $A \ominus B = \{a \mid (a + b) \in A \text{ for every } (a \in A, b \in B)\}$

    ```


    which can be written in terms of translations by


    ```

    $A \ominus B = \bigcap_{b \in B} A_b.$

    ```


