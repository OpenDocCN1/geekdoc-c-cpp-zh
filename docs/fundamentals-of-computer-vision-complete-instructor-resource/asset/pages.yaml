    As illustrated in Figure 12.6, a single point in one image can correspond to any
    of a set of points, which lie on a straight line, in the other image. The line
    is referred to as the epipolar line of x, as illustrated in Figure 12.7.


    F is called the fundamental matrix, and it may be estimated using the “eight point
    algorithm” [12.1], which will be briefly discussed in the next section. However,
    there is a problem: It takes 8 correspondences to estimate F. If we choose 8 at
    random, there is a fair likelihood that one of them is wrong. If one estimate
    is wrong, then F is probably wrong, so we can’t use it to test which correspondences
    are true. It sounds like we are doomed, doesn’t it?


    Following is one approach: Start by finding a large (significantly more than 8)
    set of possible correspondences, (remember, a correspondence is two ordered triples
    of coordinates, a triple x_l = [x_l, y_l, 1]^T from the left image and a triple
    x_r = [x_r, y_r, 1]^T from the right image). Denote the set of possible correspondences
    S_c.


    +   1. From S_c, choose 8 possible correspondences at random.

    +   2. From those 8 correspondences, calculate an estimate of F. (See section
    12.3.2.)

    +   3. Identify the inliers. Inliers are correspondences that come very close
    to satisfying Eq. 12.20. We determine them by the following:

    +   (a) Find both epipolar lines. The epipolar line corresponding to x_l we denote
    as l_l and the epipolar line corresponding to x_r we denote as l_r. Remember from
    Eq. 12.19 that a line is a 3-vector. We can easily find the epipolar lines using


    ```

    l_l = F x_r,       (12.21)

    l_r = F x_l,       (12.22)

    ```'
