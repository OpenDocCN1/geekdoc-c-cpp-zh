    # 11.7.2 Relaxation Labeling


    Using association graphs, one is constrained to integer values of the r function,
    corresponding to values of either “is consistent with” or “is not consistent with”.
    In this section, we generalize this idea to provide a continuous degree of consistency.
    Because of the iterative algorithm used, this form of consistent labeling is known
    as relaxation labeling. Begin by defining confidence in a labeling as $P_s(\lambda),
    P: \mathbb{R} \to [0, 1]$. Here, confidence is interpreted to mean the confidence
    that the label $\lambda$ is correct for object $x$.


    Now given a set of objects $X = \{x_1, x_2, \dots, x_n\}$, and a set of labels
    for those objects, $\Lambda = \{\lambda_1, \lambda_2, \dots, \lambda_m\}$, define
    a label update operation as


    ```

    $P_i^{k+1}(\lambda) = \frac{P_i^k[1+q_i^k(\lambda)]}{\sum_j P_j^k(\lambda_j)[1+q_j^k(\lambda_j)]}$
    (11.22)

    ```


    where $k$ is the iteration number. The sum is over all possible labels for object
    $x_i$. $q_i$ is a measure of how consistent labeling $x_i$ as $\lambda$ is with
    all possible labelings of all objects. The denominator is a normalization to ensure
    $P$ stays between zero and one.


    The formula for $q(\cdot)$ is)


    ```

    $q_i^{k+1}(\lambda) = \sum_j C_{ij} \left[ \sum_l r(i, \lambda, j, \lambda_l)
    P_j^k(\lambda_l) \right].$ (11.23)

    ```


    Notice in Eq. 11.23 that the consistency function $r$ is multiplied by the strength
    of the labeling being considered. Therefore a labeling with low confidence does
    not affect the result very much, although it may be very consistent. The term
    $C_{ij}$ quantifies the impact of object $i$ on object $j$. That is, suppose those
    two objects are far apart in the image. Then, it'
