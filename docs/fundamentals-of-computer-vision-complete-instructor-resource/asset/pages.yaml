  md: "# ## 6.7 Conclusion\n\nIn this chapter we have, among other things, presented\
    \ three approaches to the same problem: edge-preserving smoothing. Our purpose\
    \ was to use this as an opportunity to teach three different philosophies of solving\
    \ problems in Computer Vision: (1) develop an ad hoc “good idea” into an effective\
    \ algorithm, (2) pose the problem as the solution to a differential equation,\
    \ or (3) pose the problem as a minimization. With proper choice of parameters,\
    \ the three methods produce similar results. MAP was shown to perform better,\
    \ but that is because MAP not only smooths the image; it also maintains fidelity\
    \ to the original image. It is often easier to pose Computer Vision problems as\
    \ solutions to optimization problems.\n\nThe strategy of bilateral filtering first\
    \ appeared in the literature 1995 in a paper [6.1] by Aurich and Weule, but the\
    \ term “bilateral filtering” did not appear until 1998 [6.26]. It has been used\
    \ in applications such as noise removal [6.2, 6.3, 6.19], image motion analysis\
    \ [6.27], and many others. The authors of this book used it in converting from\
    \ the image representation in digital cameras to conventional color, a process\
    \ called demosaicking [6.24].\n\nOptimization methods are so pervasive in this\
    \ chapter that the chapter title could almost be “image optimization.” We set\
    \ up an objective function, a function of the measured image and the (unknown)\
    \ true image and find the (unknown) true image that minimizes the objective function.\
    \ Two terms were introduced: a noise term, which depends on the measurement; and\
    \ a prior term, which depends only on the true image. The “true” image is then\
    \ determined by finding the image that minimizes the objective function. A variety\
    \ of minimization techniques could be used. In this chapter, we use gradient descent\
