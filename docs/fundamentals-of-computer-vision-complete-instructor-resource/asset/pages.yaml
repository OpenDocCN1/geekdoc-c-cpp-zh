    Expectation Maximization is an iterative algorithm with two phases. In the first
    phase, usually called the “E-step,” an objective that describes the system is
    set up, and posed as an expected value. In the second phase, the “M-step,” the
    parameters that optimize that expected value are found. Then the process iterates.


    The derivation for the EM approach to solving GMM problems in this section follows
    form and order of [8.15], but here, only one-dimensional Gaussians are used.


    Given n samples y1, y2, ..., yn, from the sum of K Gaussians, we need to estimate
    Ak, μk, and σk for k = 1, ..., K. Define


    ```

    \(\psi(y|\mu, \sigma) = \frac{1}{\sqrt{2\pi}\sigma} \exp\left(-\frac{(y-\mu)^2}{2\sigma^2}\right)\)
    (8.5)

    ```


    and using \(\psi\), define \(\gamma_{ij}^m\) to be an estimate of the probability
    that the ith sample belongs to the jth Gaussian at the mth iteration:


    ```

    \(\gamma_{ij}^m = \frac{A_j^m \psi(y_i|\mu_j^m, \sigma_j^m)}{\sum_{k=1}^K A_k^m
    \psi(y_i|\mu_k^m, \sigma_k^m)}\) (8.6)

    ```'
