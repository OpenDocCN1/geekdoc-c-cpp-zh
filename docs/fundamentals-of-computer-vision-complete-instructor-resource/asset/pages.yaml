    # Example: Piecewise-Planar Images


    Consider


    ```

    \(\Lambda^2(f) = \left(\frac{\partial^2 f}{\partial x^2}\right)^2 + \left(\frac{\partial^2
    f}{\partial y^2}\right)^2 + 2 \left(\frac{\partial^2 f}{\partial x \partial y}\right)^2
    .\) (6.29)

    ```


    What does this do? What kind of function has a zero for all its second derivatives?
    The answer is a plane. Thus, using this form for \(\Lambda(f)\) will produce an
    image that is locally planar, but still maintains fidelity to the data - a piecewise-planar
    image. Another alternative operator that is also based on the second derivative
    is the Laplacian: \(\frac{\partial^2 f}{\partial x^2} + \frac{\partial^2 f}{\partial
    y^2}\). We saw both of these back in Chapter 5.


    You might ask your instructor, “Breaking a brightness image into piecewise-linear
    segments is the same as assuming the actual surfaces are planar, right?” The answer
    would probably be “Yes, except for variations in lighting, reflectance, and albedo.”
    Ignoring that, you charge on, saying “But real surfaces aren’t all planar.” The
    answer to your concern is two-fold: First is the trivial and useless observation
    that all surfaces are planar - you just have to examine a sufficiently small region.
    But second, you should realize that you will never run the algorithm long enough
    to converge to a perfect piecewise-linear solution, but only far enough to get
    sufficient smoothing.


    A one-dimensional example of a piecewise linear estimate is shown in orange in
    Figure 6.11.


    4 This is the quadratic variation. The Laplacian also involves second derivatives.
    Ask yourself how it differs from the quadratic variation.'
