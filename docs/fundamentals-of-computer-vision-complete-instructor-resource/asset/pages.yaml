  md: 'Subgraph isomorphism is the most straightforward matching method. First, we
    define isomorphic. Let G1 = <V1, E1> be a graph that consists of a set of vertices,
    V1 and a set of edges E1. Also, let G2 = <V2, E2>, be a graph that consists of
    a set of vertices, V2 and a set of edges E2. Then G1 and G2 are isomorphic if
    there exists a function f(v) that maps nodes in G1 to nodes in G2. That is, if
    v'' = f(v), for v in G1 then v'' in G2, and f will be injective (one-to-one).
    Further, if edge(v1, v2) = E1, then edge(f(v1), f(v2)) ∈ E2.


    The subgraph isomorphism problem is: Given a pair of non-isomorphic graphs, G1
    and G2, is there a subgraph S = <s, e > of G1 that is isomorphic to G2?


    Unfortunately, the subgraph isomorphism problem is NP-complete; that is, all known
    algorithms to solve it are exponential in complexity. Nonetheless, for small problems,
    subgraph isomorphism can be a powerful tool.


    Three other approaches are described here: association graphs, relaxation labeling,
    and spring-loaded templates. These are methods that will produce matchings on
    hybrid representations, that is, those that are fundamentally graph-based but
    include image information.


    Matching is often the same as labeling. That is, we seek to pose matching as a
    pairwise matching of the elements of a set. That is what will be illustrated here.


    Suppose we have a set of objects. Objects may be regions in an image, cars on
    a street, or anything else. It is important, however, to label each object. The
    label for an object could be the class it is in (flanges and gaskets), the region
    in a model that best matches the object region in the image, or any of a variety
    of other, similar problems. In most labeling problems, however, we wish to simultaneously
    label a set of objects.


    Let us consider the consistency of labeling. For example the consistency of labeling
    object 1 as lion with labeling object 2 as antelope. If the only information we
    have is the distance between objects 1 and 2, we can say that labeling is consistent
    if object 1 and object 2 are far apart. If however, the two objects are close
    together, we would speculate that labeling object 1 as a lion would not be consistent
    with labeling object 2 as an antelope, for the simple reason that lions and antelope
    are seldom found close together (except for a few instances that usually turn
    out poorly for the antelope).


    To formalize this, assume we have a set of objects, A, a set of labels Λ and a
    set of consistency functions: r : A x Λ x A x Λ → [-1, 1]. When the value of r
    is close to 1.0, the labeling is defined to be consistent, and when the value
    is -1, inconsistent. Zero is interpreted to simply mean no information is available.
    Thus the value of the consistency function


    r(λ, λ1, y, λ2)                                          (11.19)


    in an example application might be


    r(x, 1, y, 2) = 0.98,                                         (11.20)


    and can be interpreted as meaning we have high confidence that labeling region
    1 as x is consistent with labeling region 2 as y.


    A "labeling" of a set of objects assigns a label to each member of the set of
    objects.'
