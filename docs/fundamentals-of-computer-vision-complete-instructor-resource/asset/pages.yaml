- pgno: 358
  md: '# 12.8 Conclusion


    Many papers have been written that extract three-dimensional shape from various
    sources: from silhouettes [12.23, 12.24, 12.26, 12.30, 12.62]; from images of
    specular reflectors [12.37]; from three orthogonal projections (x-ray projections)
    [12.48], making use of the assumption that objects tend to have orthogonality
    [12.12], or symmetry [12.10]. Ultimately, in all these algorithms one must address
    the question of visibility [12.50]. That is, in any particular image, not every
    part of every surface is visible to the camera, since occlusion may occur.


    How you fit a function to data also depends on the nature of the noise or corruption
    to the data. If the noise is additive, zero-mean Gaussian (which is what we almost
    always assume) then the minimum vertical distance (Minimizing the Sum-Squared
    Error) or the minimal normal distance (which we called eigenvector line fitting)
    methods work well.


    If the noise is not Gaussian, then other methods are more appropriate. For example,
    nuclear medicine images are corrupted primarily by counting (Poisson) noise. Such
    a noise differs from Gaussian in two important ways: it is never negative, and
    it is signal dependent. Well away from zero, Poisson noise may be reasonably modeled
    by additive Gaussian with a variance equal to the signal. Other sensors produce
    other types of noise. Stewart [12.43] considers the case of inliers and outliers,
    but assumes that the bad data are randomly distributed over the dynamic range
    of the sensor. That is, the noise is not additive.


    Given one segmentation, should you merge two adjacent regions? If they are adjacent
    and satisfy the same equation to within some noise measure, they should be merged.
    Many flavors of this philosophy exist: [12.5, 12.22, 12.25, 12.38]. Other relevant
    papers on fitting surfaces include [12.2, 12.55, 12.59].


    One is also faced with the issue of what surface measurements to use as a basis
    for segmentation. Curvature would appear to be particularly attractive since the
    measurement curvature is invariant to viewpoint. However, “curvature estimates”
    are very sensitive to quantization noise [12.53] since they are based on second
    derivatives.


    # Generalized Cylinders (GC)


    A cylinder may be described as a circle that translates along a straight line
    in space, with the plane of the circle perpendicular to the line. Now, suppose
    that the line is allowed to bend in space, in fact to become an arbitrary space
    curve, parameterized by arc length, s. Then, the line becomes a vector function
    of s, t(s), y(s), z(s). Next, allow the radius of the circle to vary with the
    point along the curve, R = R(s), and you have some idea of what a generalized
    cylinder is [12.4, 12.11, 12.13, 12.40, 12.41, 12.60]. However, the concepts of
    GC’s are more general even than described above. The object translated does not
    have to be a circle, it can be any 2D shape.


    If we can fit GC’s to regions, we can then use the vector function of the line
    and the radius function as features to describe the shape of the region. However,
    there are significant challenges to fitting GC’s to images. We will not pursue
    the GC idea any further in this book.'
