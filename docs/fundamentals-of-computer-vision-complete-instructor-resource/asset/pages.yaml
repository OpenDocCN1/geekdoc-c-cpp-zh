    # 5.8.3 Discussion


    The five functions discussed in this section, 1 x 3, Sobel, 5 x 5, Derivative
    of a Gaussian, and the Gabor, have many similarities. They can all be used to
    estimate the two derivatives from which the edge angle is determined. The best
    performer is the derivative of a Gaussian, especially with large \(\sigma\).


    But scale is a problem. With the derivative of a Gaussian, Figure 5.28 demonstrates
    essentially perfect performance. But how big must that kernel be? The function
    flDoG uses a kernel that goes out 3\(\sigma\) in order to accurately determine
    the value. For a \(\sigma\) of 6, this produces a kernel that is 37 x 37!


    Remember that in most Computer Vision applications you want to find local features.
    A feature such as an edge that is straight for 37 pixels is, in most applications,
    a very large feature. Such a large kernel is therefore useful only for very large
    scale images. If \(\sigma\) = 2, reasonably good performance is obtained using
    just a 5 x 5 kernel.


    # 5.9 Conclusion


    In this chapter, we have looked at several ways to derive kernel operators that,
    when applied to images, result in strong responses for types of edges.


    +   - We applied the definition of the derivative.

    +   - We fit an analytic function to a surface, by minimizing the sum squared
    error.

    +   - We converted subimages into vectors, and projected those vectors onto special
    basis vectors that described edge-like characteristics.'
