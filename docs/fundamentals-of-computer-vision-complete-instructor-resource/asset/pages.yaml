    # 9.6 Finding the Peaks


    The peaks of the accumulator array are, ideally, at or near the true parameter
    values, but in general they may be displaced by noise in the original data. There
    are several ways to approach this problem, including some sophisticated methods
    [9.2, 9.9] and some simple ones.


    In the simple problem where there should be a single peak, it is often sufficient
    to look for a single maximum. However, as we learned in Chapter 5, kernel operators
    don''t estimate directions very accurately. Furthermore, as a consequence of sampling
    and noise, image points aren''t precisely where we think they are. Therefore,
    the lines drawn in the accumulator don''t intersect precisely and make perfect,
    sharp peaks. Such peaks tend to be "bumpy;" a single peak may be multimodal. Some
    simple blur is usually sufficient to smooth the bumps and produce a single local
    maximum. However, smoothing is not always sufficient. Figure 9.10 illustrates
    a close-up of a typical accumulator "peak" that is seen here to not be a single
    peak at all.


    A strategy for the problem where more than one significant peak could occur is
    as follows:


    +   1. Search the accumulator for local maxima over a threshold in height.

    +   2. If two of these maxima are "close" to each other, combine them.

    +   3. Go to step 1 until no significant new peaks are found.


    The general multi-peak problem is fundamentally a clustering problem [9.2], so
    any algorithm that does clustering well is also good at peak finding.


    As was discussed in Chapter 8, clustering is the process of finding natural groupings
