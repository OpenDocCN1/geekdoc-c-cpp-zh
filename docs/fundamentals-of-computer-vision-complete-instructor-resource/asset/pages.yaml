    # 3.2.3 Null Spaces


    The null space of a matrix, A, is the set of all vectors, x which satisfy


    ```

    Ax = 0, (3.6)

    ```


    where 0 is the vector of all zeros. This is accomplished by first doing row reduction.
    We provide an example here, to remind the student of how to do row reduction:
    Let


    ```

    A = \begin{bmatrix} 4 & 5 & 6 \\ 1 & 2 & 3 \\ 2 & 4 & 6 \end{bmatrix}. (3.7)

    ```


    The first step is to divide the first row by the 1,1 element to make that element
    equal to one. Recall that if the 1,1 element is zero, you need to swap rows.


    ```

    A = \begin{bmatrix} 1 & 5/4 & 3/2 \\ 1 & 2 & 3 \\ 2 & 4 & 6 \end{bmatrix}.

    ```


    Now multiply the first row by -1 times the 2,1 element, and add it to the second
    row, replacing the second row. Also perform the same operation on the third row,
