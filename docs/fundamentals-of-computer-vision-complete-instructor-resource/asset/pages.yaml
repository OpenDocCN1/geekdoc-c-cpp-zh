  md: 'to encounter people who deal with coding all the time. It will prove to be
    useful to have a grasp of some of the more basic concepts.


    +   1. Locate the image specified by your instructor. Let''s call that image XXX512.
    Verify that it is indeed 512 x 512. If it is not 512 x 512, then first write a
    program that will pad it out to that size.


    +   2. Write a program that will take a two-dimensional n x n image and produce
    an image, of the same data type, which is n / 2 x n / 2. The program name should
    be ShrinkByTwo and called by


    ```

    ShrinkByTwo inimg outimg

    ```


    The program should not simply take every other pixel. Instead, each pixel of the
    output image should be constructed by averaging the corresponding four pixels
    in the input image. Note the requirement that the output image be of the same
    type as the input. Use your program to create XXX256, XXX128, XXX64, and XXX32.
    Don''t bother with going below a 32 x 32 image. Turn in your program and a print
    of your images.


    +   3. Write a subroutine to zoom an image. It should have the following calling
    convention:


    ```

    ZoomByTwo(inimg, outimg)

    ```


    The calling program is responsible for creating, reading, etc. of the images.
    The subroutine simply fills outing with a zoomed version of inimg. Use any algorithm
    you wish to fill in the missing pixels. (We recommend that the missing pixels
    be some average of the input pixels.)


    Before we can proceed, we need to consider a "pyramid coder". When you ran ShrinkByTwo,
    the set of images you produced is the pyramid representation of XXX512. In a pyramid
    coder, the objective is to use the pyramid representation to transmit as little
    information as possible over the channel. Here is the idea: First, transmit all
    of XXX32. Then, both the transmitter and receiver run ZoomByTwo to create a zoomed
    version of XXX32, something like


    ```

    ZoomByTwo(XXX32,a64prime)

    ```


    When we created XXX32 from XXX64, we threw away some information, and we cannot
    easily get it back, so a64prime will not be identical to XXX64. If, however, ZoomByTwo
    (which in the image coding literature, is called the "predictor") is pretty good,
    the difference between a64prime and XXX64 will be small (small in value that is,
    it is still 64 x 64). Therefore, compute diff64, the difference between a64prime
    and XXX64. If the predictor were perfect, the resultant difference would be a
    64 x 64 image of all zeros, which could be coded in some clever way (by run-length
    encoding for example), and transmitted with very few bits. Let us now transmit
    diff64 to the receiver. By simply adding diff64 to the version of a64prime generated
    at the receiver, we can correct the errors made by the predictor, and we now have
    a correct version of XXX64 at the receiver, but all we transmitted was diff64.
    Clever, aren''t we?'
