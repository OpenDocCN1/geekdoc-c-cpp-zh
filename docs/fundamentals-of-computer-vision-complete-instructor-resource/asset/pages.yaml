    are provided, since everything else can be derived from those.


    The dilation of a grayscale image by a grayscale s.e. is accomplished by a very
    small extension to Eq. 7.21. We allow the s.e. to have nonbinary values.


    ```

    $(f \oplus k)(x) = \max_{s \in k} [f(x - s) + k(s)] . \quad (7.24)$

    ```'
