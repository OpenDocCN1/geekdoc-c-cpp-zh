  md: '# 4.3.1 The Gradient


    Consider the value of f(x, y) as a surface in space, then the ordered triple (x,
    y, f(x, y)) describes this surface. For every point, (x, y), there is a corresponding
    value in the third dimension. It is important to observe that there is just one
    such f value for any (x, y) pair. If you draw a straight line in the x, y plane
    and ask yourself, "How does f(x, y) change as I move along this line in x, y?",
    the question you have asked is the same as "What is the directional derivative
    at the point x, y along this particular direction?"


    There is one special direction, the one that will maximize magnitude of the directional
    derivative, and we call it the gradient. The gradient vector has the special,
    very simple form: G(x, y) = [∂f/∂x, ∂f/∂y]^T.


    One characteristic of gradients sometimes confuses students. The gradient is a
    2-vector. It lies in the x, y plane. When you take a step in the direction of
    the gradient, you are moving in the direction in the plane (not uphill, out of
    the plane) such that f will rise as steeply as possible.


    # 4.3.2 Isophotes


    Consider the set of all points satisfying f(x, y) = C for some constant C. If
    f represents brightness, then all the pixels in this set of points have the same
    brightness. We therefore refer to this set as an isophote, or a level set.


    > **Theorem:** At any image point, (x, y), the isophote passing through that point
    is perpendicular to the gradient. The proof is a homework.


    # 4.3.3 Ridges


    Think about a surface in space, written as z(x, y). Now, z does not represent
    brightness, but elevation. We could easily think about it as a mountain. If we
    draw a geological contour map of this mountain, the lines in the map are lines
    of equal elevation. However, if we think of "elevation" denoting brightness, then
    the contour lines are isophotes. Stand at a point on this "mountain" and look
    in the direction the gradient is pointing, as in Figure 4.8; the direction you
    are looking is the way you would go to undertake the steepest ascent.


    Note that the direction of the gradient is the steepest direction at that particular
    point. It does not necessarily point at the peak.


    Let''s climb this mountain by taking small steps in the direction of the local
    gradient.2 What happens at the ridge line? How would you know you were on a ridge?
    How can you describe this process mathematically?


    Think about taking steps in the direction of the gradient. Your steps are generally
    in the same direction until you reach the ridge; then, the direction radically
    shifts. So, one useful definition of a ridge is the focus of points that are **local
    maxima of the rate of change of gradient direction**. That is, we need to find
    the points where |∂v/∂η| is maximized. Here, v


