  md: 'In conclusion, you can choose any function for the argument of the exponential
    that you wish, as long as the image you want is produced by setting that argument
    to zero. Some more general properties of prior models have been presented by Li
    [6.18]: As a function of the local image gradient \(\Lambda\), a prior should


    +   1. be continuous in its first derivative,

    +   2. be even (\(h(\Lambda) = h(-\Lambda)\)),

    +   3. be positive \(h(\Lambda) > 0\),

    +   4. have a negative derivative for positive argument \(h(\Lambda) < 0\) for
    \(\Lambda > 0\), and

    +   5. go to a constant in the limit \(\lim_{\Lambda \to \infty} |h(\Lambda)|
    = C\).


    Interestingly, Yi and Chelberg [6.28] observe that second-order priors require
    a great deal more computation than first-order priors, and that first-order priors
    can be made approximately invariant. However, in our own experiments, we have
    found that the increased flexibility provided by second order priors outweighs
    the computational penalty imposed by their use.


    # 6.5.3 MAP Algorithm Implementation and Mean Field Annealing (MFA)


    The implementation details of the MAP algorithm are listed in Figure 6.12 on page
    110: Implementing the MAP algorithm based on gradient descent often suffers from
    local minima, as discussed in section 3.3.2. This can be improved by adding _annealing_.
    Mean Field Annealing (MFA) is a technique for finding a good minimum of complex
    functions that typically have many minima. The mean field approximation of statistical
    mechanics allows a continuous representation of the energy states of a collection
    of particles. In the same sense, MFA approximates the stochastic algorithm called
    “simulated annealing” (SA). SA has been shown to converge in probability to the
    global minimum, even for non-convex problems [6.11]. Because SA also takes an
    unacceptably long time to converge, a number of techniques have been derived to
    accomplish speed-ups [6.16]; MFA is one of those techniques.


    Adding annealing to the previous algorithm gives us one more capability that distinguishes
    it from other MAP methods, the ability to avoid most local minima. The “magic”
    is all in the use of the parameter \(\tau\) in Eq. 6.27. Figure 6.12 is the entire
    modified algorithm, after the gradient of the objective function, \(\nabla_\tau(H(f))\),
    has been found analytically.


    The details of why this process of annealing avoids local minima are described
    elsewhere [6.6, 6.7, 6.8], but this process results from the analogy to simulated
    annealing [6.10] (see section 3.3.3).


    Let’s see what the words in quotes in the MFA algorithm on page 110 mean.


    Consider what happens if \(\tau_{init}\) is large. A large \(\tau\) will cause
    the argument of the exponential to be close to zero, and the value of the exponential
    itself to be approximately one. But that value is itself divided by \(\tau\),
    so that when \(\tau\) is large, the value of the prior is on the order of \(1/\tau\);
    and if \(\tau\) is a big number, then the prior is insignificant relative to the
    noise term. We can see that \(\tau\) is initially “large” by choosing \(\tau_{init}\)
    to be larger than, say, twice the average value of the numerator,


    ```

    \(\tau_{init} = 2 < |f \otimes r| >.\) (6.30)

    ```'
