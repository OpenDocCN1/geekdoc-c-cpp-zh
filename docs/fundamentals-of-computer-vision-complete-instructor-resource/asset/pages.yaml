    # 7.4.4 Computing the DT Using the Voronoi Diagram


    In later sections of this book, we will be concerned with the junctions between
    regions and the relationships between adjacent regions. We will occasionally need
    to consider relationships between regions that do not actually touch. For this,
    the concept of the Voronoi diagram will be useful. We introduce it here because
    of the similarities it shares with the distance transform.


    Consider the image illustrated in Figure 7.19. In that image, several regions
    are indicated in gray, inside the white circle. For any region, i, the Voronoi
    domain of that region is the set of points such that those points are closer to
    points in that region than to points in any other region:


    ```

    V_i = { x | d(x, p_i) < d(x, p_j), ∀(j ≠ i) } (7.31)

    ```


