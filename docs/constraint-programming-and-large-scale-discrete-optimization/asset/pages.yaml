    PCSP as defined in Def. 2.1 is one of the most general kinds of constraint problems
    complying with the demands of the well known branch-and-bound search. These algorithms
    can deal with all kinds of preference as long as they provide a sufficient criterion
    to prefer an assignment to another as given by the partial ordering. In contrast,
    frameworks for representing real worlds are rather required than representation
    as general as possible. Thus, constraint representations of nurse rostering using
    a special class of the PCSP framework called hierarchical constraint satisfaction
    (HCSP) [Mey97a, Mey97b] is inspired by constraint hierarchies [BF92].


    The importance of a constraint $c$ is determined according to two properties:
    A priority index $p$ groups all constraints into hierarchy levels 0 to $\hat{p}$.
    Each constraint $c$ is considered to be more important than all constraints in
    the hierarchy levels $p+1, \dots, \hat{p}$ together. Hierarchy levels may be considered
    as a categorical degree of a constraint''s importance. $\omega_c$ provides a positive
    real number as a constraint weight or penalty to each constraint $c$. This weight
    represents the relative importance of two constraints which are of the same hierarchy
    level. The weight of a constraint is a gradual measure of importance.


    More formally, both properties define a preference according to the following:


    DEFINITION 2.2. A hierarchical CSP $P = (X, D, C, var, \varphi, p, \omega)$ with
    $0 \leq p \leq \hat{p}$ is defined as a PCSP $(X, D, C, var, \varphi, \succ_p)$
    where the preference relation $C'' \succ C''''$ between two sets of constraints
    $C'', C'''' \subseteq C$ follows from the priorities $p$ and the weights $\omega$
    of the constraints. Let \omega(C'', p) = \sum_{c \in C'', p_c=p} \omega_c$ be
    the sum of weights of constraint $C''$ in hierarchy level $p$.


    $C'' \succ C''''$ iff $\omega(C'', p) > \omega(C'''', p)$ or $(p+1) \leq \hat{p}$
    and $\omega(C'', p) = \omega(C'''', p)$ and $C'' \succ_{p+1} C''''$.


    This definition simplifies a procedure that compares two sets of constraints hierarchy
    level by hierarchy level according to the sum of weights. The first part of the
    definition of $\succ_p$ determines preference according to hierarchy-level $p$.
