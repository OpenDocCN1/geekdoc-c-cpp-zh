    how many shifts will be required to cover a bus schedule without constructing
    a driver schedule, and this offers a way of producing good estimates for even
    large schedules very quickly.


    It should be emphasised that selecting 70% of the relief opportunities at random
    does not give the same quality of results. Choosing relief opportunities during
    the peaks increasing the number of shifts required, and if the random selection
    is biased against the opportunities falling in the peak, there is a danger that
    there will be pieces of work which cannot be covered by any legal shift, and no
    schedule can be formed. In selecting relief opportunities, it is essential that
    consideration how potential shifts can be linked together, as one driver takes
    a mealbreak and the bus hands over to another driver.


    The methods we have described find partial driver schedules to cover the morning
    and evening parts of the vehicle schedule, and these partial schedules are at
    least good that several of them together indicate where TRACS II consider changing
    drivers. However, we have no plans to develop a constraint programming approach
    to finding complete driver schedules. Finding a single morning schedule and a
    single evening schedule and linking them together to cover the entire day using
    the minimum number of shifts would be much more complex than simply choosing a
    selection of relief opportunities.


    Furthermore, TRACS II and its predecessor IMPACS have been shown to be robust
    and easily adapt to the scheduling conditions of different public transport operators.
    This is mainly because, in the covering (or partitioning) approach to driver scheduling,
    the generation of shifts is entirely separated from the process of selecting the
    shifts to form a schedule. However, if we encounter a new scheduling rule, only
    the shift generation part will be changed, which is relatively straightforward.
    Some of these scheduling rules can be quite complex; for instance, we recently
    compiled driver schedules for a bus company where the maximum driving time without
    a break depends on the bus route that the driver is working on: on some routes
    the maximum is five and a half hours, whereas others it is four hours. Even where
    the rules are not unusual, differences in the pattern of bus provision throughout
    the day can mean that the crucial factors determining the efficiency of driver
    schedules can be different for different companies. For instance, in many places,
    it is most important to ensure that the morning and evening peaks are covered
    efficiently, and there tends to be a surplus of drivers between the peaks; in
    other places, although coverage of the peaks is important, it is essential, but
    not easy, to ensure that shifts starting before the morning peak can hand over
    to shifts which will then work until the bus returns to the garage in the late
    evening. Provided that the required shifts have been generated, these variations
    do not present a problem for TRACS II. We believe that any method which constructs
    possible shifts at the same time fitting them together to form the driver schedule
    would need considerable modification to adapt it to different bus companies''
    conditions, and that this would be a difficulty for a pure constraint programming
    approach extending the methods described.


