  md: '# 6.2. Design activity.


    The design activity concerns the extraction of problem structural features and
    the building of one or multiple model(s) of the problem (subproblems). The features
    will help characterize the algorithm to build. As opposed to the conceptual model,
    the design model is dependent on the technology. Just as the conceptual model
    is an intermediate step between the user requirements and the modelling, the design
    work acts as a preliminary step to the programming activity. It clearly depends
    on the LSCO team''s knowledge about the different optimization paradigms, and
    their experience in problem modelling and matching algorithm characteristics.


    Furthermore, in the context of a multi-paradigm framework, the design activity
    is particularly necessary since we do not assume any specific modelling framework
    nor optimization technology. New issues arise and need to be considered like decomposition
    of the problem, characterization of the (hybrid) algorithm to build. Indeed, if
    we consider mainly the constraint programming activity, the focus would be on
    the design of a CSP model. The issues would deal with the selection of the design
    variables. The formulation, the choice of powerful heuristics and search methods.
    Similarly, if we would consider the MIP framework. The focus would be on the design
    of the matrix model, ie finding the right formulation of the constraints that
    would lead to a matrix that best exploits the integrity constraints, etc. But,
    we are opening our technological evolution to a multi-paradigm framework. Thus,
    there are no restrictions to the choice of model and algorithms apart from the
    ones by the problem itself. This is very important for tackling LSCO applications,
    since it allows us to focus on formulating the real world, instead of simplifying
    it so it suits our modelling language/framework/experience.


    Thus one of the main roles of the methodology for this activity, is to provide
    guidance for the LSCO team to study the problem structure and properties from
    different perspectives. This will allow the LSCO team to select the paradigm or
    hybridization of paradigms which will make the best use of problem features (in
    terms of pruning and search power). For this purpose, we propose the following
    iterative process for the design activity that focuses on the main tasks:


    +   - Finding algorithmic flavors


    +   - Designing model(s) of the LSCO problem


    +   - Ensuring that the model and algorithm form a good couple


    The last item illustrates the strong dependency which exists between a design
    model and the algorithm. A full evaluation of the mapping might only be possible
    after doing some programming. This would require some tuning and adjusting of
    both the model and the algorithm (this is the validation task). The process is
    presented in Figure 6.


    Once the tuning/adjusting is completed (for the current state), a Problem Solution
    Document is what describes the design model of the problem and a characterization
    of the algorithm. One could argue that we do not need a design activity, and that
    we could proceed directly from the problem definition to the programming activity.
    This might hold for paradigms which are supported by very expressive modelling
    languages (e.g. CHIP), and this will certainly be true of our days we are purely
    declarative.⁸ However, from a software engineering


    > ⁸ A declarative language, ideally allows one to declare or state "what" the
    problem is, without specifying "how" it should be solved.'
