  md: '# CONSTRAINT PROGRAMMING PRE-PROCESSOR FOR DRIVER SCHEDULING 135


    A cover of a set $I = \{1, 2, ..., m\}$ is defined as follows: if $P = \{P_1,
    P_2, ..., P_n\}$ where each $P_j$ is a subset of $I$ for $j \in \{1, 2, ..., n\}$,
    a subset $J^*$ of $J$ is a cover of $I$ if $\cup_{j \in J^*} P_j = I$. In addition,
    the subsets $P_j$ for $j \in J^*$ are mutually exclusive, $J^*$ is a partition
    of $I$.


    If a cost $c_j$ is associated with every $j \in J$, the set covering problem is
    to find a cover of minimum cost. The problem can be expressed as the linear programming
    problem:


    ```

    $$\min \sum_{j=1}^n c_j x_j$$

    ```


    ```

    $$(1) \quad \text{subject to} \quad \sum_{j=1}^n a_{ij}x_j \ge 1 \quad \text{for
    } i = 1, 2, ..., m$$

    ```


    and $x_j = 1$ or $0$ for $j = 1, 2, ..., n$ where $x_j = 1$ if $j$ is in the cover,
    0 otherwise, and $a_{ij} = 1$ if $i \in P_j$, 0 otherwise.


    As a formulation of the driver scheduling problem, the elements of the set $I$
    correspond to pieces of work, and $J$ corresponds to the generated shifts. The
    coefficients $a_{ij}$ form a 0-1 matrix where the 1''s in the $j^{th}$ column
    indicate the pieces of work covered by $j$, so that $a_{ij} = 1$ if the $j^{th}$
    shift covers the $i^{th}$ piece of work. The variable $x_j = 1$ if the $j^{th}$
    shift is in the schedule, 0 otherwise, and $c_j$ is the cost associated with the
    $j^{th}$ shift. The constraints (1) represent the fact that each piece of work
    must be covered by at least one shift of:


    The TRACS II formulation has in addition a small number of side constraints


    ```

    $$\sum_{j \in J} x_j \ge l_k \quad \text{for } J_k \subseteq J$$

    ```


    where $l_k$ is an lower or upper limit on the number of shifts of a particular
    class, or the total number of shifts if $J_k = J$. For instance, it is common
    to have a constraint limiting the number of split shifts.


    The cost of a shift, in TRACS II, is made up of a number of components, including
    a large constant term, the paid time for this shift, and various penalties to
    discourage the use of certain kinds of shifts. Overall, the result is to minimizing
    the number of shifts in the driver schedule the principal objective; the secondary
    objective is to minimize the total time, while avoiding undesirable shifts.


    The resulting problem is a 0-1 LP which can be solved by relaxing the $x_j$ variables
    to take fractional values between 0 and 1. This LP can be efficiently solved and
    gives a lower bound on the cost of the optimal solution. An integer solution is
    derived from the LP optimum by a branch-and-bound process.


    It might be thought that set partitioning would be a better model of the problem
    than set covering, since we are in the end assign exactly one driver to each piece
    of work. However, in many large driver scheduling problems, it would be impractical
    to generate all possible shifts. We have to be selective in order to'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'reduce the shifts generated to a manageable number. (Currently, TRACS II can
    handle up to 100,000 shifts, in a large problem the total number of possible shifts
    will be far more than that.) We typically restrict the formation of a longer shift
    covering the same work at little or no cost. However, such shifts may be required
    for a setting solution in order to allow the shifts to fit together. By allowing
    over-cover, we avoid the risk that there is no solution at all. There is always
    a set covering, provided that at least one shift has been generated every piece
    of work, except possibly if the side constraints, as an upper limit on the number
    of shifts, cannot be met. If there is over-cover in the solution found, it can
    be removed in a final editing stage. Partitioning has, however, been successfully
    used for many years to model air crew scheduling problems (e.g. [HP92]), which
    are superbly very similar to bus driver scheduling problems.


    # 3. The Development of TRACS II


    Two of the present authors were responsible for implementing one of the first
    major driver scheduling systems, IMPACS [Smi88, SW88]. IMPACS was installed for
    London Transport buses in 1984, and is still used in London. It was subsequently
    extended and installed for Greater Manchester Transport in 1985 [WS88], and in
    modified forms for many other organizations over the next few years.


    Since 1990 the Scheduling and Constraint Management Group of the University of
    Leeds has built on its experience to develop systems for train driver scheduling.
    This problem is more complex than bus driver scheduling. For example, there may
    be depots, serving overlapping areas of the rail network; drivers from a particular
    depot may only serve certain sections of track and may be restricted in the types
    of locomotive they may drive; journeys are more complex; shifts operate on a larger
    number of blocks. This work has led to the TRACS II system [KKPW99] which has
    been used for about a dozen British train operating companies.


    Throughout the development of TRACS II it was tested not on rail driver problems,
    but also on bus and tram driver problems, in order to ensure that the new system
    would be widely applicable. It has now been installed as part of a bus and driver
    scheduling system for medium sized British bus company, and is undergoing extensive
    testing by one of the U.K.’s major groups. Like IMPACS, TRACS II is based on a
    set covering approach, but it takes advantage of many more recent developments,
    and is capable of speedily handling much larger problems than IMPACS.


    TRACS II may be considered to encompass three major and several minor processes.
    First, a large number (perhaps 100,000) of potential driver shifts are generated,
    all satisfying legal and locally negotiated requirements. Second, a heuristic
    process sieves out shifts which, after comparison with other potential shifts,
    are unlikely to contribute to a good solution. It is sometimes useful to generate
    several sets of potential shifts according to different sets of rules; this allows
    split shifts to be generated separately, tighter rules to be applied to shifts
    on more than two buses, and so on. These sets will then be merged after sieving.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# CONSTRAINT PROGRAMMING PRE-PROCESSOR FOR DRIVER SCHEDULING 137


    The third process is a specialised integer linear programming (ILP) suite to solve
    the set covering problem, as described in section 2. The ILP, which can handle
    problems of up to 100,000 potential shifts, use a column generation approach [FP98,
    FP99] to solve the relaxed linear program by a specialised branch and bound process
    similar to that of IMPACS [Smi88]. Currently, the branch and bound search is terminated
    if no integer solution is found after the investigation of 500 nodes.


    TRACS II has proved successful for all problem instances to which it has been
    applied. However, some very large instances had to be decomposed and solved in
    stages, while others had to be run several times with different parameters before
    a solution could be found within 500 nodes. The largest instance successfully
    solved without decomposition over 1200 constraints representing of bus work, but
    instances as small as 700 constraints have had to be run several times, a time-consuming
    and frustrating process.


    The complexity of an ILP depends on the number of constraints in the problem and
    second on the number of variables. In a set formulation of driver scheduling,
    the complexity depends on the number of relief opportunities. The relief opportunities
    defines the pieces of work to be covered, and each piece of work gives a constraint.
    Indirectly, the number of potential shifts rises exponentially with the number
    of pieces of work, the number of relief opportunities affects the number of variables,
    in the ILP. At the present usual of reducing the size of large problems is to
    reduce the number of shifts generated by tightening soft constraints, governing
    such things as the minimum work of a shift or the maximum meal-break length. However,
    this may lead to good solutions being overlooked, and is not always sufficient
    without drastic sieving of out.


    A method of determining in advance that some relief opportunities need not be
    considered therefore would be very useful in reducing the number of constraints.
    This would allow TRACS II to tackle larger problems than it can at present. The
    original IMPACS, which was restricted to 350 constraints because of the limited
    computer power of the time, used a heuristic which selected only relief opportunities
    to be used in the generation of potential shifts. After the determination of suitable
    controlling parameters, this worked well in the London and Manchester contexts.
    However, when new situations encountered it proved impossible to devise parameter
    settings which would work for every problem instance arising from a particular
    client, and there was a tendency for clients to bypass the selection process and
    instead to tighten the generation constraints or decompose unnecessarily. The
    remainder of this paper describes the use of constraint programming to select
    a subset of relief opportunities to be used by TRACS II. Results are very promising;
    the set covering problem has fewer pieces of work, and fewer shifts, resulting
    in much shorter solution times, without degradation in the quality of the solution.


    Currently, research at Leeds is proceeding on a number of fronts to determine
    new ways of tackling some or all of the driver scheduling problem, for example
    by genetic algorithms [KKW99]. However, current indications are that solution
    of a set covering by a specialised ILP will remain an important part of the whole
    process for the foreseeable future.'
