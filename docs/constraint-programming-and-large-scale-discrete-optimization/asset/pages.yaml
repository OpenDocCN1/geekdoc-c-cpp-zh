  md: '# Guided Local Search Joins the Elite in Discrete Optimisation


    Christos Voudouris and Edward Tsang


    ABSTRACT. Developed from Constraint Satisfaction as well as Operations Research
    ideas, Guided Local Search (GLS) and Fast Local Search (FLS) are novel meta-heuristic
    search methods for constraint satisfaction and optimization. GLS sits on top of
    other local search algorithms. The basic principle of GLS is to penalise when
    a local search algorithm settles in a local optimum. Using penalties is an idea
    used in Operations Research before. The necessity of GLS is in the way that features
    are selected and penalised. GLS and FLS have been applied to a non-trivial number
    of satisfiability and optimisation problems and achieved remarkable results. One
    of their most outstanding achievements is in the well-studied travelling salesman
    problem, in which they obtained results as good as, if not better than the state-of-the-art
    algorithms. In this paper, we shall outline the GLS and FLS algorithms and describe
    their discrete optimisation applications.


    # # 1. Introduction


    Constraint satisfaction [Ts93, FM94, MS98] is a very general problem that can
    be used in many real life applications. Due to its generality, research effort
    has been spent in this area in recent years. This has led to technological breakthroughs
    as well as commercial exploration. Sound commercially available systems have been
    built, e.g. ILOG Solver [Pug95], CHIP [Sim95], Eclipse [LWR95] and Prolog IV [C090].
    Constraint programming is now a multi-million pound business; see [Cra93, Wal96,
    ZF94] for some of their applications.


    Many real life constraint optimisation problems are hard to solve using systematic
    search methods. In recent years, stochastic methods have received great attention
    [FDG+95]. This paper describes the results of a research programme, which has
    led to successful applications of stochastic constraint satisfaction techniques
    to optimisation.


    # # 2. Constraint satisfaction related to discrete optimisation


    Many problems involve constraint satisfaction. A constraint satisfaction problem
    (CSP) comprises three elements:


    (Z, D, C)


    2000 Mathematics Subject Classification. Primary 68T20, 90C27, 90C59.'
