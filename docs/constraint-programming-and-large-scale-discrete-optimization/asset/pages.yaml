  md: '# 2.2. Internal Structures.


    Many successful applications of local search gain their power from sophisticated
    updates of the inconsistency information rather than recomputations from scratch.
    For this purpose, additional structures often have to be maintained. In the case
    of the PERMUTATION constraint, three lists can be used as additional supports:
    list $l_a$ with the ordered values of bag A, $l_x$ with the values of X by their
    current assignments, and $l_i$ with the ith element being the distance between
    the ith value of $l_a$ and the value of the ith variable of $l_x$. The costs of
    the PERMUTATION constraint can be computed by using the values of $l_c$.


    For PERMUTATION<1, 4, 7, 3->, {A, B, C, D}> and a current assignment of A=2, B=6,
    C=2 the structures are constructed in the following way:


    ```

    $l_a = [1, 3, 4, 7]

    $l_x = [A(2), C(2), B(6), D(7)]$

    $l_c = [1, 2, |3-2|, |4-6|=1, |7-7|=0]$

    $Permutation\_costs = 1+1+2+0=4$

    ```


    Note that by varying all global constraints involving this variable must be called
    to update their internal structures. For the PERMUTATION constraint, there must
    be a reordering of the variable $l_i$ with a corresponding update of $l_c$ and
    the resulting cost sum. For example, if B changes from 6 to 9,


    ```

    $l_a = [1,3,4,7]

    $l_x = [A(2), C(2), D(9)]$

    $l_c = [1,1,|4-7|=3,|7-9|=2]

    $Permutation\_costs = 4+(-2+3)+(-0+2)=7$

    ```


    # 2.3. Improvement Heuristics. What is a good heuristic for building the successor
    state may depend on the other constraints involved as well as on the current state
    of the search. Thus, a global constraint should provide various heuristics, e.g.,
    with a complete revision of the violated variables, one with a minimal change
    of just one variable, one with a randomized successor selection, and one with
    random walks.


    For the PERMUTATION constraint, the list $l_i$ gives us quantified information
    about the variables violation of the constraint. A heuristic with a cautious strategy
    can reset only one variable—to the highest element in $l_c$—to the corresponding
    value of $l_a$. Following the last assignment of A=2, B=9, C=2 and D=7, the variable
    D would be changed to:


    ```

    $l_c = [1,1,3,2]

    $l_a = [1,3,4,7]

    $l_x = [A(2), C(2), D(4), B(9)]$

    $Permutation\_costs = 7+(-3+0)=4$

    ```


    The range of heuristics to be applied to a specific problem should be customizable
    by the user. During search, a constraint-internal function has to decide on the
    concrete heuristic to be applied. This decision can be taken at random, or subject
    to learning mechanisms.'
