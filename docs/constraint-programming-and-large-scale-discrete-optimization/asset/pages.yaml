    In ORBIS Dienstplan, this problem has been tackled dividing the implementation
    into a general constraint processing part and a domain specific part concerned
    with representation, database programming, and graphical user interfaces. This
    paper reports on the first part that resulted in a constraint library providing
    a variety of generic search algorithms that work on the same constraint representations.
    This constraint library is motivated by the following idea on the development
    process: At first, the developer of an application represents the problem as a
    constraint problem. Then, he or she chooses from a variety of search algorithms
    and heuristics to let the computer solve the problem. This system design separates
    the representation clearly from search control strategies. All chosen algorithms
    and heuristics may be replaced at any time during the life cycle of the application.


    The constraint library provides implementations of several techniques for constraint
    processing a bounded search with constraint propagation [FW92], mincon [MJPL92],
    mincon-retry, and mincon-walk [Wal96]. If generic search strategies fail to solve
    the problem, the developer can define local search strategies where a set of variables
    is determined according to the constraints which are violated these variables
    are then optimized by use of a B&B algorithm. Hence, the developer has to find
    a program to determine critical regions in a preliminary solution of the problem
    where changes lead to an overall improvement in the solution''s quality. This
    kind of application specific search control has the key for implementing the above-mentioned
    rostering system. At least in this application, such search procedures proved
    to be both: sufficiently effective to hard run-time requirements and robust enough
    to solve all instances of the nurse rostering problem that resulted from the different
    installations of the ORBIS - Dienstplan system.


    The resulting system has two drawbacks:


    +   - Working time accounts and attendance of the crew are optimized only in a
