    One reason why the TRACS II running time is reduced by far more than the percentage
    of relief opportunities deleted is finding an integer solution to be easier. The
    bulk of the time taken to solve the constraint problem, and the greatest source
    of variability in running times, is finding an integer solution by branch and
    bound, once a non-integer LP solution has been found. The more frequent the relief
    opportunities are, the more scope there for complex patterns of overlapping shifts
    in this LP optimal solution, and the harder it is to resolve these overlaps to
    give an integer solution. Conversely, reversing a proportion of the relief opportunities
    makes finding integer solutions easier; in fact, of the four individual runs represented
    in Table 2, the LP optimum was already an integer solution, so that further searching
    was required.


    # 6. Conclusions


    The results presented in the last section demonstrate that using constraint programming
    to select relief opportunities for use by TRACS II can greatly reduce the time
    to produce a schedule, and to find an integer solution, while increasing the cost
    of the schedule very little, if at all. The running time for the most difficult
    problems can be cut by more than 60%, even when more than 70% of the original
    relief opportunities are kept. The decrease is partly due to the fact that the
    ILP has few constraints and variables, but also reducing the frequency of relief
    opportunities by deleting some of them makes integer solutions easier.


    A larger proportion of the relief opportunities in the morning and evening can
    be rejected than the proportion used for Table 2, with a corresponding decrease
    in solution time, and only a slight increase in the chance of a suboptimal solution.
    Although this might not be acceptable when finding a schedule intended for operation,
    it would be useful when exploring different scenarios, when many different schedules
    are required quickly. It is very difficult to get an accurate estimate of'
