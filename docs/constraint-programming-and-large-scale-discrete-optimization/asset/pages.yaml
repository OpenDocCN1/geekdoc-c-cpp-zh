  md: 'VLSI design. We focus on complex problems so-called Large Scale Combinatorial
    Optimization problems (LSCOs). Even though the maturity in optimization techniques
    has prompted the development of powerful modelling and programming languages,
    a high level of experience and expertise is still required to tackle LSCOs. The
    reason lies in the nature of LSCOs:


    +   - Real world problems which do not fit into well-defined categories. There
    is no efficient solution publicized in the research literature which would apply
    to them and take into account their unique features (e.g. multiple decision criteria,
    user-defined constraints)


    +   - Large scale problems, characterized by large sets of data, variables and
    constraints. Existing algorithms do not always scale up, some decomposition aspects
    must be considered (e.g. problem structure, hybrid models, co-operation between
    solvers)


    +   - Computationally difficult problems, i.e. NP-hard problems whose solving
    requires any know-how and experience.


    From a technological point of view, three main paradigms have shown to contribute
    to the construction of powerful optimization algorithms: Operational Research
    (OR), Constraint Programming (CP), and stochastic search methods. Each paradigm
    provides its own forms of support to ensure the formulation and tackling of combinatorial
    optimization problems. In many cases, the application can be solved efficiently
    thanks to the availability of increasingly powerful modelling and optimization
    tools and to the progress in research, particularly in results that respect the
    hybridization of solvers. Hybridization is the process of integrating multiple
    solvers from different paradigms to solve large scale and complex problems intuitively,
    hybridization of solvers serves better by exploiting LSCO structural features
    (i.e. using each solver when it is most appropriate). Modelling/programming CP
    languages provide some support for hybrid modelling and solving (e.g. global constraints!,
    integration of hybrid algorithms). However, upstream from the programming activity,
    a lot of design work is required to identify the structural features of an LSCO,
    investigate technical or efficiency needs for a problem decomposition, There is
    little guidance in the literature on how to design hybrid models and algorithms
    efficiently. The proposed methodology addresses the design of LSCO models from
    a multi-paradigm perspective.


    From a software development point of view, LSCO projects resemble any IT project
    and their lifecycle is quite similar. As F. P. Brooks says in [Bro95]:


    The challenge and the mission are to find real solutions to problems on actual
    schedules with available resources.


    However, due to the computational complexity of LSCO problems and the expertise
    required to tackle them, the success of an IT project comprises specific issues.
    A main component of the work presented in this paper consists of identifying these
    issues and providing methodological guidance (methods, processes, do''s and don''ts)
    to tackle them in the best possible way. Little research has been pursued on this
    topic. One main reason is that the development of LSCO applications is fairly
    recent (80s). The research discipline on


