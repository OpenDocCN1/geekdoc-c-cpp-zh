    GLS and FLS have been applied to a number of discrete optimisation problems. They
    have been applied to the Radio Link Frequency Assignment Problem (RLFAP) [TL95,
    MPR98] and British Telecom''s work frequency scheduling problem (WFS) [Bak93,
    AAU95].


    In the RFLP, the task is to assign frequencies to communication channels satisfying
    constraints that prevent interference. In some RLAPS, the goal combined with FLS
    reported the best results when it was published [VT96]. And significantly improved
    results were reported in a recent NATO Symposium on Frequency Assignment [VT98].
    In particular, for the 25 publicly available RFAP instances, GLS managed to find
    the best solution in 18 of them, the best known solution in 5 and found a marginally
    inferior solution in 2 of the instances. Note here, that the best solutions have
