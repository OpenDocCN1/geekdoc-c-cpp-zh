- img_proc: true
  md: '# CONSTRAINT PROGRAMMING PRE-PROCESSOR FOR DRIVER SCHEDULING 141


    this block, choosing any one of the possible values randomly, but with a bias
    against any pattern using a relief opportunity falling during the peak. A meal-break
    chain will start at the first relief opportunity specified in the chosen pattern.


    +   * the block currently being considered, the earliest relief opportunity with
    either Next or Prev not assigned.


    +   (1) If the Next variable is not assigned, assign it a value. A non-zero value
    is chosen probabilistically from those available in the domain, with a bias towards
    the relief opportunities giving the shorter-break. Two cases might occur:


    +   (a) the chosen value is one of the special values, i.e. 1200 or 1500. Effectively,
    this chain has terminated, and a new chain is started going back to the first
    step.


    +   (b) the value of the Prev variable for this specific relief opportunity before
    noon is automatically assigned. The pattern variable for the corresponding block,
    if it does not already have a value, will be assigned one containing this time.
    If the Next variable for this relief opportunity is not already bound, a randomly-chosen
    value is assigned to it as before, forming another link in the chain, and this
    step can be repeated until the chain terminates.


    +   (2) If the Next variable is bound, Prev is unbound, assign the value of -1
    (indicating the start of a shift) to the Prev variable.


    During this process, the search may have to backtrack, most commonly because a
    Next variable originally had the value 1500 in its domain. This cannot happen
    if the variable stretch of work ending at the relief opportunity satisfies the
    conditions for the first stretch of a split shift and there is no limit on the
    number of shift shifts that can be included in the schedule, or that limit has
    not yet been reached. However, there are many occasions on which not all of these
    conditions hold. In that case, the next relief opportunity in the shift must fall
    within narrow limits specified by the minimum and maximum meal-break. Next variables
    tend to compete for the same following relief opportunities, and if one of them
    is assigned a value it may be that another loses its remaining possible value.


    The search backtracks chronologically, the default search algorithm provided by
    ILG Solver. This means that in practice, the number of variables involved, only
    the most recent choices can be reconsidered within a reasonable time. The program
    has a time limit after which it must restart; because of the random choices made
    during search, the new search will develop differently and is unlikely to run
    into the same difficulty. The time limit is a parameter, usually set at 15 seconds.
    In practice, most problems are solved in one or two seconds and the time limit
    is rarely reached; it is very unusual for a solution not to be found on the second
    attempt. The total time to find a partial solution is minimal compared to the
    time taken by TRACS to find a complete schedule, and is therefore acceptable for
    a preprocessing step. Gomes, Salmon and Kautz [GSK98] similarly describe a strategy
    of randomisation with restarting to avoid occasional long searches in solving
    constraint satisfaction problems.'
