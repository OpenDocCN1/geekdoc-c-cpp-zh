  md: '# A Constraint-Based Approach to Satellite Scheduling


    ABSTRACT. Satellite scheduling, like all scheduling, is the problem of mapping
    tasks (observation, communication, downlink, control maneuvers, etc.) to resources
    (sensor satellites, relay satellites, ground stations, etc.). Through our work
    on satellite scheduling problems, we have encountered many different constraints
    that are particular to the satellite-scheduling domain. In this paper, we will
    introduce the satellite mission-operation scheduling problem, describing the problem
    constraints that are peculiar to satellite scheduling, and then present the constraint-based
    modeling and heuristic methods that we have used to address these problems.


    # 1. Introduction


    In general, satellite scheduling is the problem of mapping tasks (observations,
    communications, downlinks, control maneuvers, etc.) to resources (sensor satellites,
    relay satellites, ground stations, etc.). Satellite scheduling problems differ
    from traditional scheduling problems in several ways. Perhaps the most obvious
    difference between satellite scheduling and traditional scheduling problems is
    the fact that some of the resources (i.e., the satellites) are orbiting the Earth.
    This places an additional set of constraints on when a task can be executed, in
    particular because the satellite resources are only available to perform certain
    tasks in specific orbit times. In addition, satellite scheduling problems require
    accurate modeling of task setup times, which can differ depending on the order
    in which tasks are performed.


    Satellite-scheduling problems often involve periodic tasks, variable length tasks,
    and tasks that can be preempted. In addition, satellite-scheduling problems are
    usually constrained. Thus, satellite scheduling is usually viewed as a constraint-optimization
    problem (i.e., find the best possible set of tasks to schedule) rather than a
    constraint-satisfaction problem (i.e., find a solution that satisfies the constraints
    for all tasks).


    Although the term satellite scheduling has been applied to many different aspects
    of a satellite''s operation (e.g., design planning, launch control, lifecycle,
    etc.), we will focus on scheduling mission operations, namely the day-to-day activities
    of an operational satellite. Mission operation activities include payload'
  merge: -1
  pgno: 112
- img_proc: true
  md: '(e.g., using a sensor on the satellite to collect data), bus operations (e.g.,
    maintaining the health and status of the vehicle) and communications operations
    (e.g., transmitting data between satellites to the ground and receiving information
    or commands from a ground station).


    Our work has addressed three general types of satellite missions: broadcast, telecommunications,
    and remote sensing, although a single satellite may encompass more than one. Broadcast
    satellites (e.g. DirectTV, PrimeStar, etc.) are typically geostationary (e.g.,
    they remain fixed above a single point on the earths surface), and are often used
    to broadcast to a large number of receivers. The satellites are geostationary
    to allow for fixed position ground-bound antenna. Telecommunication satellites
    (e.g., Telesdic, TDRS, etc.) relay information back and forth between ground stations
    (e.g., mobile phones, communications antenna). Historically, telecommunications
    have also been geostationary, but there has been a recent trend towards constellations
    of medium- or low-earth orbits (e.g., Iridium). Telecommunication scheduling problems
    are complicated by the fact that communications between a satellite and the ground
    can pass through multiple relay satellites.


    The mission of remote sensing satellites is to collect data and transmit the data
    to earth. With the exception of weather satellites (e.g., GOES), remote sensing
    satellites (e.g., Landsat, Hubble.) typically reside in non-geationary orbits,
    and consequently the ground area visible to the satellite changes over time. Visibility
    windows affect the availability of satellites to perform tasks. In addition to
    visibility windows, other events can directly impact the availability of a resource.
    For example, a satellite ground station may be unavailable for maintenance. Any
    satellite scheduling system must consider these events when building a schedule.


    When it is not possible to satisfy all requests for satellite operations, a priority
    system is typically used to choose which tasks to schedule. One possibility is
    for each task to assign a priority, and then a user defined objective function
    to compare the relative merit of different partial schedules. In this case, satellite
    scheduling becomes a partial constraint satisfaction or constraint optimization
    problem [FW92]. The goal for this class of problems is to find the subset of scheduling
    tasks maximizes maximizes the objective function while satisfying the constraints.


    This paper is organized as follows. Section 2 contains an overview of constraintbased
    scheduling, a satellite scheduling problem as an example. This allows us to introduce
    some satellite scheduling terminology. Section 3 describes satellite scheduling
    in detail including a discussion of periodic tasks, preemptive tasks, and priority-based
    optimization. Section 4 describes our general approach to satellite scheduling,
    including some discussion of our approach to satellite specific scheduling challenges.
    The last two sections discuss related work and future work.


    # 2. Constraint-Based Satellite Scheduling


    Satellite scheduling involves assigning a resource (or set of resources), a start
    time, and duration to each task in a way that satisfies the constraints on the
    tasks and resources. We view this scheduling as a class of Constraint Satisfaction
    Problems (CSPs), or Constraint Optimization Problems when only a subset of the
    tasks can be assigned. A CSP is typically defined as a set of variables, a set
    of values for the variables, and a set of constraints on the values that can be
    assigned'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# A CONSTRAINT-BASED APPROACH TO SATELLITE SCHEDULING


    to variables. Our basic approach can be described by two high-level steps: first
    model the satellite scheduling problem as a CSP, and then find the best solution
    given the available time, where best is defined relative to a user-supplied objective
    function. We require that all solutions, partial or complete, be feasible. We
    use the term feasible to refer to schedules that satisfy all constraints on tasks
    and resources. A partial schedule that only contains a subset of the tasks is
    feasible if all constraints on the scheduled tasks are satisfied.


    We model-scheduling problems using four basic objects: tasks, resources, events
    and constraints. The constraints are the activities and operations to be performed.
    Resources are the people, satellites, sensors, communication channels, which are
    required to accomplish tasks. Events are used to capture domain-specific occurrences
    that restrict when tasks can be scheduled (e.g., satellite visibility windows).
    There are further restrictions on what can be scheduled that are either due to
    interactions with other tasks or to resource capacity and availability.


    A task is scheduled by assigning it a resource, start time and duration that satisfy
    all of the relevant constraints. A task requires more than one resource (e.g.,
    a downlink task requires a satellite antenna and a ground station antenna) will
    need to have more than one resource assigned to it. More formally, a scheduled
    task is a:


    (task, resource set, start time, duration)


    When more than one resource can be used to satisfy a satellite resource requirements,
    the scheduler must choose between these alternative resources. In cases where
    there are no resource choices for a task, the scheduling problem is reduced to
    finding an execution time and duration for each task. When the tasks are fixed
    duration, the scheduling problem is further reduced to finding an execution time
    for each task.


    There are three types of satellite scheduling constraints: task constraints, resource
    constraints and event constraints. Task constraints are between tasks. for example,
    a user may require two observation tasks to occur at the same time. Another example
    is a download operation, which can only occur after the data collection task has
    been completed. In addition, there are logical constraints between tasks, such
    as a requirement that one observation tasks be performed, but not both.


    Resources also constrain the set of acceptable resources. In the first place,
    resources have specific capabilities. For instance, a task to take an infrared
    image cannot be performed by a satellite that doesn''t have an infrared sensor.
    In addition, a satellite with a single sensor can only take one image at a time.
    A resource can either be required during the execution of a task (e.g., a sensor,
    communication channel, or continue to be required past the completion of the task
    (e.g., fuel spent during maneuvers and on-board memory storage). For renewable
    resources, such as on-board memory, tasks (e.g., downlink) can be used to replenish
    the resource capacity. For non-renewable resource such as fuel for satellite maneuvers,
    there are no replenishing tasks, so we model this as a resource requirement that
    continues indefinitely past the end of the task execution.


    Other resources in addition to satellites must also be considered. Satellites
    in this case, each sensor is a different resource. Satellites also have multiple
    communications channels, each'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# JOSEPH C. PEMBERTON AND FLAVIUS GALIBER, III


    with a different bandwidth. Ground stations have antennae and personnel that are
    important resources as well.


    Event constraints are used to describe time windows in which a task can be executed.
    In satellite scheduling, event constraints result from the fact that satellites
    must be able to see a ground location to perform a task. Event constraints can
    also be specified by users (e.g., a satellite status check must occur between
    23:00 and 24:00 day).


    Now that we have described the components of a satellite-scheduling problem, let''s
    consider an example satellite-scheduling task:


    EXAMPLE 2.1. Satellite S downlink to ground station G for 2 minutes between 23:05
    and 23:27.


    The task here is to perform a downlink activity, and the task duration is 2 minutes.
    The resources are satellite S and ground station G. The event window is from 23:05
    to 23:27, which contains constraints when the task can be scheduled. In addition,
    this task is further constrained by the requirement that it can only be scheduled
    in a window where satellite S can see ground station G and when both satellite
    S and ground station G are available.


    # 3. Characteristics of Satellite Scheduling


    In this section, we describe several characteristics of satellite scheduling problems
    and briefly discuss their impact on the scheduling task.


    Event Windows. As mentioned in the previous section, the fact that some of the
    resources orbit imposes an additional set of constraints on the scheduling task.
    In order for a satellite to perform a task (e.g., collect data, download, etc.),
    it must first be able to see the target. The satellite''s orbit characteristics
    and the satellite and ground sensor and antennae capabilities determine the times
    that a satellite is able to see its targets. Detailed orbit propagation models
    are used to convert current satellite position and velocity information into a
    set of time-ordered positions of the satellite. The position of the satellite
    over time is combined with sensor and antenna models to determine the visibility
    of the satellite to its target. For tasks that require more than one satellite
    or for which there are resource options, the set of task-resource event windows
    must be combined to create additional constraints on scheduling the task.


    Alternate Resources. In job-scheduling, oftentimes a task can be completed by
    more than one resource. We refer to the set of resources that can be used to satisfy
    a task resource requirement as a set of alternate resources. Alternate resources
    because of the fact that no two satellites can share the same identical orbit
    and no two different ground stations share exactly the same ground position, alternate
    resources are not transparently interchangeable. This is possibly true at some
    level of job-scheduling (e.g., if the exact physical location of the machine impacts
    the actual execution time). The only completely interchangeable resources are
    ground-based resources that are not position dependent (e.g., support staff, post-processing
    computers, etc.) and perhaps geostationary satellites with nearly identical coverage
    areas.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# A CONSTRAINT-BASED APPROACH TO SATELLITE SCHEDULING


    As an example, consider a downlink operation that requires the use of one of relay
    satellites and a specific ground station. If satellite A is unavailable when it
    is in view of ground station G and G is available, we cannot simply substitute
    satellite B because it may not be able to see G from its current position. This
    impacts the search we. If there is an event constraint that keeps satellite B
    by satisfying a downlink, then we do not want to backtrack over satellite B to
    search for a way to make it available for the downlink. In short, satellite B''s
    availability is dictated by an event constraint that cannot be changed by backtracking.
    Thus, alternate results in satellite scheduling provide a different set of challenges
    in traditional job-shop scheduling.


    Periodic Tasks. Periodic tasks are common in satellite scheduling problems. Common
    periodic tasks include maintenance checks, collected data, and periodic collection
    over a specific region. Periodic downlink and maintenance tasks are tied to specific
    satellites, whereas periodic collection or communications tasks are not necessarily
    tied to a specific satellite. Periodic tasks can be tied to time or event based.
    An example of a time-based periodic task is:


    EXAMPLE 3.1. Ground location L must be observed for 4 minutes every 12 hours.


    An example of an event-based periodic task is:


    EXAMPLE 3.2. Satellite S must downlink to ground station G for 2 minutes every
    time it can view the ground station.


    These two types of periodic tasks can be viewed as shorthand for regular tasks.
    Added difficulty occurs when the periodic task is specified relative to the execution
    of other tasks. Consider the following periodic task:


    EXAMPLE 3.3. Ground location L must be observed periodically for 10 minutes with
    a maximum of 10 hours separation between observations.


    In this example, the added difficulty comes from the fact that the number of observation
    tasks is not known in advance, but instead depends on how other tasks are scheduled.


    Preemptive Tasks. Some tasks can be preempted (i.e., their execution can be stopped
    and restarted). An example of a preemptive task is:


    EXAMPLE 3.4. Ground location L must be observed for a total of 15 minutes during
    the next 2 hours.


    Preemptive tasks can be split into a set of subtasks with shorter durations that
    sum up to the original duration, although the typical objective is to find a schedule
    with the fewest possible preemptive subtasks. Typically, the subtasks that make
    up a preemptive task can be scheduled on alternate resources. Preemptive tasks
    have a minimum duration for subtasks, which gives an upper bound on the number
    of possible subtasks.


    Having preemptive tasks complicates the scheduling problem in two ways. First,
    the scheduler doesn''t know the optimal duration for a preemptive subtask (see
    variable length tasks below). The second complication is that the scheduler must
    decide how many subtasks to create.'
