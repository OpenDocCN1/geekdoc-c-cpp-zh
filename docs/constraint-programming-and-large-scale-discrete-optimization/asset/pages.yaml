    found by the preprocessor, the proportion of relief opportunities available to
    TRACS II is more than 70%. Nevertheless, the time taken to find a schedule is
    often reduced by more than 30%. This is particularly noticeable for the largest
    schedule (UMAE) where selecting relief opportunities in both the morning and the
