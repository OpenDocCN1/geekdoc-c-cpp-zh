  md: '# GUIDED LOCAL SEARCH JOINS THE ELITE IN DISCRETE OPTIMISATION


    is an indication of whether s exhibits feature i:


    (5.2) $\quad I_i(s) = 1$ if $s$ exhibits feature $i$; $0$ otherwise.


    When a local search settles in a local minimum, the penalty of some of the features
    associated with this local minimum is increased (to be explained below). This
    has the effect of changing the objective function (which defines the “landscape”
    of local search) and driving the search towards other candidate solutions. The
    key to the effectiveness of GLS is in the way that penalties are imposed.


    Our intention is to penalise ‘unfavourable features’ when a local search settles
    in a minimum. The feature that has high cost affects the overall cost. Another
    factor that should be considered is the current penalty value of such feature.
    We define the utility of penalising feature $i$, $util_i$, under a local minimum
    $s$, as follows:


    (5.3) $\quad util_i(s) = I_i(s) * c_i/(1 + p_i)$


    (5.4) $\quad p_i = p_i + 1$


    By taking the cost and penalty into selecting the feature to penalise, we are
    distributing the search effort in the search space. Candidate solutions which
    exhibit good features, i.e. features involving lower cost, will be given more
    effort in the search since good features will be penalised frequently. On the
    other hand, candidate solutions which exhibit bad features, i.e. features involving
    higher cost, will be given less effort in the search since bad features will be
    penalised more frequently. The idea of distributing effort, which plays an important
    role in the success of GLS was inspired by ideas in Operations Research and in
    particular the Theory of Search area, e.g. see [**Koo57**] and [**Sto83**]. We
    shall describe the general GLS procedure:


    Procedure GLS (input: an objective function $g$; a local search strategy $L$;
    and their costs; parameter $\lambda$)


    +   - Generate a starting candidate solution randomly or heuristically;

    - Initialise all penalty values ($p_i$) to 0;

    - Repeat the following until a termination condition (e.g. a maximum number of
    iterations or time limit) has been reached:

    - Perform local search (using $L$) according to the function $h$ (which is $g$
    plus the penalty values, as defined in 5.1 above) until a local minimum $M$ has
    been reached;

    - For each feature $i$ which is exhibited in $M$ compute $util_i = c_i/(1+p_i)$

    - Penalise every feature $i$ such that $util$ is maximum: $p_i = p_i + 1$;n- Return
    the best candidate solution found so far according to the objective function $g$.'
