  md: '# USING GLOBAL CONSTRAINTS FOR LOCAL SEARCH


    For the overall cost function, which is handled by the global search control,
    problem-specific coefficients can be introduced to weight the constraints'' subjective
    costs, as a constraint''s importance may be different in different contexts (see
    also Section 5.3).


    Conventional local search methods make a successor decision on the basis of a
    calculation of the neighborhood states'' costs. These calculations might be quite
    costly to compute within the global constraint framework, but the current constraints''
    costs can serve as an excellent compensation for this. The goal is to minimize
    the constraints'' costs and as the global constraints should know how to resolve
    the conflicts by themselves, it is a straightforward matter to select constraints
    according to their current inconsistency.


    The selection of the global constraint that is to improve the current state can
    be enhanced by various meta-heuristics to avoid local minima and plateaus, ranging
    from a simple choice of unsatisfied constraints to more elaborate techniques including
    learning, tab lists, etc. Some of these are demonstrated in the following section''s
    case study. The global search control module should support a variety of methods
    that can be applied in a user-specified way (as the flexible black box [KS98]).
    By integrating global search-state parameters for the constraints'' improvement
    procedures, e.g., a simulated-annealing-like temperature, anytime improvement
    depending on the current search situation can be achieved. In addition, it is
    possible to introduce higher-level coordination mechanisms between constraints
    to minimize violations of multi-constraint variables. If knowledge is available
    about these interface areas, it may be sufficient to introduce redundant global
    constraints to cover these areas. Nevertheless, the overhead of coordination mechanisms
    may pay off in some cases.


    # 5. A Case Study: Dynamic Job-Shop Scheduling


    As an example of the application of local search with global constraints, we look
    at the dynamic-job-shop scheduling problem.


    The problem of solving dynamic job-shop scheduling by local search has been addressed
    in numerous research papers (see VAL94 for a survey), but there are few experiments
    dealing with dynamic aspects of job-addition/removal are also rare. This is a
    pity since dynamics and partial satisfaction are very realistic problem features
    and local search approaches can bring their advantages to bear in these domains
    particularly. Unlike refinement/global search, local search is not normally affected
    by modifications of the search space because of its local focus, and it supports
    integration of partial satisfaction because it has an inherent cost function that
    is iteratively improved toward full satisfaction/optimization.


    As in traditional $n x m$ job-shop scheduling, there are $n$ jobs in a schedule,
    each of having $m$ tasks with fixed durations. All tasks of a job are connected
    via $m-1$ distance inequalities involving start or end point of two tasks. For
    compliance with the scheduling horizon $h$, there is in addition linear distance
    inequality $task_{end} \le h$ for each task. Each task has to be processed on
    a specific machine, and each of the $o$ machines can process only one task at
    a time. Every $p$ microseconds of computation time, one job is removed from the
    schedule and a new job must be added. The tasks of the new job are randomly distributed
    within the scheduling horizon.'
