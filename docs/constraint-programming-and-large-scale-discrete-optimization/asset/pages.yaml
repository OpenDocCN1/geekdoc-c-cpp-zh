  md: '# 140 BARBARA M. SMITH, COLIN J. LAYFIELD, AND ANTONY WREN


    necessary, TRACS II is allowed to do it: because we combine solutions to the give
    of relief opportunities available to TRACS II, more than two internal relief opportunities
    will be selected on many blocks.


    (2) For each relief opportunity before noon on any block, a ''next'' variable
    is defined. $Next_{(i,t)}$ indicates what shift ending of work on block $i$ at
    time $t$ does next. If the driver finishing this shift and taking a meal-break
    could then over block $j$ at time $t''$, the pair $(j, t'')$ will be in the domain
    of $Next_{(i,t)}$. The set of possible values for this variable depends on the
    minimum and maximum length of meal-break. If time $t$ is close to noon, then the
    driver finishing at time $t$ might next after a bus after noon, and we are not
    interested in this stage in what happens after noon, a dummy time of 1201 is used
    to indicate this. Similarly, if it possible that a first of split shift be finishing
    at time $t$, a dummy time of 1500 is used to indicate that the next thing the
    driver might be the second shift of a split shift. Finally, this relief opportunity
    might not be used at all to change drivers, or it might be used as the end of
    the shift, in which case the driver does nothing; a special value of 0 represents


    (3) For each relief opportunity before noon on any block, a ''previous'' variable
    is defined. $Prev_{(i,t)}$ indicates what starting of work on block $i$ did previously.
    The domains of these variables are similar to those of the Next variables; the
    values are for the most part pairs $(j, t'')$ where $t''$ is a valid meal-break.
    A value of 0 means that the relief opportunity is not used to change drivers;
    a value of -1 means a shift is starting.


    There is no direct representation of the shifts in this formulation, but they
    can clearly be reconstructed from either the Next or the Prev variables.


    Constraints are needed to keep the Next, Prev and pattern variables mutually consistent,
    for instance:


    +   - if $Next_{(i,t)} = (j, t'')$ then $Prev_{(j,t'')} = (i, t)$

    - if it is not a member of the pattern variable for block $i$, then $Next_{(i,t)}
    = 0$ and $Prev_{(i,t)} = 0$


    In addition, there are rules governing how shifts can be formed, including:


    +   - Sign-on and sign-off times.

    - Minimum/Maximum meal-break.

    - Minimum/Maximum stretch length.

    - Early start on bus split shifts.


    Many of these rules come from the bus company''s labour agreement. Others, such
    as minimum length and maximum meal-break, are unlikely to be specified, but are
    required to avoid obviously inefficient shifts.


    # 4.3. Search Strategy. The problem of finding valid assignments to the Next,
    Prev and pattern variables is solved using ILOG Solver. We use a search strategy
    which focuses on the formation of meal-break chains. An element of random choice
    is built into the strategy, so that we can find many different ways of solving
    the problem. The strategy is described in more detail in [LSW99]; only an outline
    is given here, showing how a meal-break chain is formed.


    The major steps in forming a meal-break chain are:


    +   - choose the block containing the earliest relief opportunity with an unbound
    Next or Prev variable. Assign a value to the pattern variable for'
