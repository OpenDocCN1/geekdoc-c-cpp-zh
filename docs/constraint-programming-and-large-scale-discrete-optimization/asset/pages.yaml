    split shifts which can be included in a driver schedule is often limited by agreement.


    # 4.2. Problem Formulation. Three sets of constrained variables are defined to
    represent the scheduling problem as a constraint satisfaction problem:


    +   (1) For each block, define a pattern variable specifying the possible ways
    in which this block can be partitioned into sets of work allocated to different
    shifts, up to noon. Each possible value is a set of ''internal'' relief opportunities
    (i.e. the start or end of a block, which are automatically selected). For instance,
    in Figure 1, the domain of the pattern for Bus 1 might be {{0725, 0925}, {0725,
    1025}, {1025}, {0925, 1025}, {0925}, {1025}}, provided that stretches of work
    only one hour are allowed. As we do not allow any block to be split into more
    than three stretches of work before noon. This rarely happens in driver schedules,
    but if'
