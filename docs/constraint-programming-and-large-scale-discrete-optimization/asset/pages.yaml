  md: '# 5.2. Application Notes. The SCP was modeled using a coopering solvers approach.
    It was implemented with ILOG Solver and Planner that two identical formulations
    were maintained for however, each had its specific duty. ILOG Solver was used
    to manage the local search strategies, with Planner managed the linear constraints.
    In addition, communication of variable bounds was automatically carried out by
    the engines. Each allowed to help the other solve its problem. This is similar
    to the cooperating solvers approach in [DB].


    The application used a small amount of reductions by column domination rules as
    defined in [Beasley1]. The goal was not to get the maximum number of reductions.
    Instead, it was to obtain a more manageable problem quickly. In addition, during
    preprocessing, a global upper bound was obtained by using a progressive round-off
    algorithm. For more information on progressive round-off [MT2].


    The application was implemented with the MT-BFWS. The priority queue was ordered
    by the lower bounds of the nodes, which were simply their linear relaxations given
    by Planner. Two distinct branching strategies were used for the different expansion
    methods. The backtracking expansion method used one criterion for selecting the
    variable that was closest to .50, i.e. the "most fractional variable". The breath-first
    expansion used two criteria. First, the first 10% of the most fractional variables
    are chosen and from the highest cost was chosen. If there was a tie on cost, the
    "most fractional variable" from the two chosen. Other ties were arbitrarily broken.
    The intuition behind this branching strategy is that hardest decisions are choosing
    which of the higher costing columns should be equal to one. since those columns
    will more dramatically increase the objective. Thus, we should try to make the
    hardest decisions first.


