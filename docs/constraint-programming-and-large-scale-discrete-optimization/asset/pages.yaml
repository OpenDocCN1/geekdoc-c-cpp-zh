  md: '# USING GLOBAL CONSTRAINTS FOR LOCAL SEARCH


    # 8. Related Work and Conclusion


    Many publications focus on problem-specific local search solutions. Improved efficiency
    is the main goal, generality often being disregarded. This paper has demonstrated
    a way of combining local search with the constraint programming framework. The
    modular structure of the constraints makes it easy to reuse, and extend problem
    descriptions.


    Other authors have tackled the problem of combining local search with frameworks
    on a more general level, too. This includes on Boolean problems like GSAT [GU92,
    LM92] and Waksat [SK96], the processing of linear-Boolean constraint problems
    [Wal7], and approaches for CSPs coalition forming [HT95] and the well-known min-conflicts
    heuristic [MJPL92] with its extension and generalization by [DTWZ94]. The most
    important difference between our work and these approaches is the ability of the
    global constraints to exploit domain-specific information by including constraint-specific
    search control and representation knowledge. In contrast to low-level constraint
    approaches, which correspond rather to SAT- or OR-based approaches, the use of
    higher-level constraints is more in keeping with the basic intentions of constraint
    programming. Fine-grained constraints allow a wide range application, but the
    low-level problem decomposition deprives the search process of most of the domain-specific
    knowledge.


    The results of the presented case study indicate that the global constraint approach''s
    revision of a current state on a more general level with an inclusion of domain-specific
    knowledge makes the search resistant to getting caught in local optima or plateaus.
    Techniques like random walks or tab lists, either worsened or failed to improve
    the search behavior. The only useful technique was randomization, though this
    was true for some decision points only, the advantage decreasing with the inclusion
    of stronger knowledge.


    The concept of global constraints was originally used for refinement search (e.g.,
    [Pe94, PL95]). Transferring it to a local search context makes it possible to
    get an efficient and declarative handler on local search, while preserving its
    features reusability and maintenance.


    Further work will include concepts to temporarily focus the search on problem
    aspects and methods to apply case-based reasoning within global constraints. More
    detailed information on the EXCALIBUR project is available at: http://www.ai-center.com/projects/excalibur/


