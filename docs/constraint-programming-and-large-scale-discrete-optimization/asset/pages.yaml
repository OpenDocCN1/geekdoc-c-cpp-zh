  md: '# LSCO: METHODOLOGICAL VIEWPOINT


    software development methodology for LSCO problems is an area still in its formative
    stages. In [CFGG95], Chamard et al. summarize the lessons learnt during the CHIC
    project on building a Constraint Logic Programming (CLP) methodology. This pioneering
    work focused on issues rather specific to CLP and provides practical guidelines
    for modelling and solving constraint optimization problems in CLP. In the CHIC-2
    project, our objectives were to pursue the work further by extending its agenda
    and include 1) latest research in optimization technology (i.e. the multi-paradigm
    perspective) and 2) to consider the software engineering aspects as well. We are
    not aware of any other work in this discipline.


    1.2. A practical approach. The methodology evolved over three years and was designed
    by a consortium of industrial and academic partners with expertise in: Operational
    Research (Euro-Decision), constraint programming (Bouygues, IC-Par), stochastic
    search (NTUA, Renault), and project management (IC, Renault). The industrial experience
    and technical expertise of the partners in the different optimization paradigms
    brought a rich and diverse knowledge to the consortium, which allowed us to approach
    the development and management of LSCO projects from complementary angles. In
    we incrementally refined and evaluated the methodology by tackling four industrial
    applications (construction scheduling, flow shop, generic car sequencing, energy
    trading). The application work was organized so that each problem was undertaken
    by three different methods where each partner would utilize their expertise (in
    a given paradigm) and seek for the best results (e.g. optimality, efficiency)
    often based on co-operation of solvers. This distributed approach had a tremendous
    input to the methodology work, and evaluation. It allowed us in particular to:


    +   - Step back the academic exercise of solving benchmark problems


    +   - Identify and assess management issues specific to LSCO applications


    +   - Assess the complexity of scoping and specifying LSCO problems, and provide
    measures to capture and validate user requirements


    +   - Test the soundness of a model and improve the quality of solutions by developing
    approaches (models and algorithms) in parallel.


    All difficulties we encountered and the experience we gained in this collaborative
    work, have driven the development of the CHIC-2 methodology and later on its testing.
    In this document we give an overview of the methodology. More specifically, we
    address the issues we have identified as specific to LSCOs, and present guidance
    to tackle them adequately. The methodology is publicly available on the following
    website:


    http://www.icparc.ic.ac.uk/chic2/chic2_methodology/


    1.3. Content. The paper is structured as follows. Section 2 will summarize the
    different optimization paradigms and their current forms of guidance to tackle
    LSCOs. Section 3 introduces the concept of software methodology and the LSCO issues
    we will consider. Sections 4 to 6 present the core elements of the CHIC-2 methodology
    which include specific management issues, and a detailed description of our approach
    to the development of LSCO solutions from a multi-paradigm perspective. A final
    conclusion is presented in section 7.


    > Constraint Handling in Industry and Commerce, Esprit Project.'
