- img_proc: true
  md: '# RICHARD J. WALLACE AND EUGENE C. FREUDER


    strategy is here to discover specialized constraints that restrict search more
    effectively. Smith, Layfield and Wren discuss the use of constraint programming
    in connection with bus driver scheduling. Here, constraint programming is used
    in a preprocessing step that filters out components that are unlikely to lead
    to good solutions; the remaining components are passed to an integer programming
    solver that determines a complete schedule using a set covering approach.


    In recent years the importance of systematizing the development of applications
    for large scale discrete optimization has been recognized, especially since there
    are several paradigms, including constraint programming, for representing such
    problems. Gervet describes the main results of the CHIC-2 project, whose purpose
    was to develop guidelines for building such systems within a multi-paradigm setting
    which allows for hybridization of problem solving strategies.


    # 4. Acknowledgements


    We would like to acknowledge Andre Boris, who first invited the senior author
    to organize this workshop as part of the DIMACS Special Year on Large Scale Discrete
    Optimization. We would like to thank the following people for serving as program
    committee members: Alain Colauer, James Crawford, Reina Decker. Thom Fruhirth,
    Henry Kautz, Jean-Louis Lasse, Claude Le Pape, Ken McAulon, P. Darandang Nayak,
    Gilles Pessant, Barry Richards, Thom Schiex, Siem Bert, Helmut Smits, Gert Molka,
    Karl Tretloff, Edvard Swann, Pascal Van Hentry, Didier Vergamin, Christos Voudoudaris,
    and Brian Williams. We would also like to thank those from the above list who
    served as reviewers for this volume. And we would like to express our gratitude
    to the DIMACS Center at Rutgers University, in particular Pat Savoy. Sarah Donnelly
    and Christine Hough, for their efforts in preparing materials for this workshop
    and for managing all of many logical problems that this workshop entails.


    # References


    +   [Bak97] K. R. Baker, Elements of sequencing and scheduling, Dartmouth College,
