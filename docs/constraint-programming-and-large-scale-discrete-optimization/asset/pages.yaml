  pgno: 66
- img_proc: true
  md: '# FABIAN ZABATTA


    Therefore, nodes use larger amounts of memory are not problematic. Hence, the
    trade-off of using more memory to produce quicker results was ideal for the MT-FWBS.


    For simplicity, we begin by discussing the search as a single threaded application.
    The algorithm begins by placing the root node in the priority queue and then creating
    a thread. The method of node expansion and the control of the search is determined
    by the size of the queue. If the size of the queue is within a given limit, the
    thread expands the queue in a breath-first fashion, creating the children of the
    node. If these newly created nodes are feasible and do not violate any bounds,
    they are inserted into the priority queue. However, if the size of the queue exceeds
    the given limit, the thread will not expand a node by normal means. Instead, the
    thread will use chronological backtracking to fully expand the queue. Once fully
    expanded and bounds updated (if required), reducing the size of the queue. The
    queue no longer consideration to a controllable size while ensuring that any of
    the best nodes will be expanded. The process terminates after the thread terminates.
    The thread terminates when the queue is empty or when the node on the queue has
    a lower bound greater than equal to the current best solution.


    To perform the algorithm in parallel threads are required. The Dynamic Thread
    Creation scheme [ZY2] can be easily adapted for this purpose. The parallel version
    begins like the sequential version, with only one thread. However, during the
    expansion of a queue, if the number of concurrently executing threads is less
    than the active limit (see 3.2), the thread creates a new thread and assigns it
    the expansion of half the children, using variable-based partitioning. This is
    true for both methods of node expansion. The threads then continue in the same
    manner, removing the best nodes from the queue and expanding to the size of the
    queue. In addition, all threads are functionally equivalent, and thus can create
    other threads if the number of concurrently executing threads is less than the
    active limit. A thread terminates when the queue is empty or when the best node
    of the queue has a lower bound greater than equal to the current best solution.
    The process terminates when all threads terminate.


    # 4.2. Applications. The MT-FWBS is applicable to optimization problems that have
    a heuristic for measuring bounds, since these bounds will be used to order nodes
    in the priority queue. The accuracy of the heuristic will directly affect the
    performance of the overall algorithm. Clearly, a more accurate heuristic will
    provide better performance. Another consideration is using the MT-FWBS in the
    branching strategies that create a smaller number of child nodes (level) have
    better performance than branching strategies that create a larger number of child
    nodes. Experiments have shown that branching strategies that create many child
    nodes cause the priority queue to grow at a faster rate. This fills the priority
    queue with nodes that are relatively high promising nodes. Consequently, the priority
    queue fills up, the search will switch to backtracking to reduce the size of the
    priority queue. However, after the queue size is reduced, it will again quickly
    fill up, since the branching strategy creates many child nodes. As a result, the
    overall search will spend more time backtracking than performing best-first node
    expansions. This makes the overall search perform'
