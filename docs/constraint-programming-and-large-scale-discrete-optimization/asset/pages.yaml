  md: 'DIMACS Series in Discrete Mathematics

    and Theoretical Computer Science

    Volume 57, 2001


    # # Using Global Constraints for Local Search


    Alexander Naryek


    ABSTRACT. Conventional ways of using local search are difficult to generalize.
    Increased efficiency is the only goal, generality often being disregarded. This
    is manifested in the highly monolithic encodings of complex problems and the application
    of highly specific satisfaction methods.


    Other approaches tackle the general constraint programming framework as a starting
    point and try to introduce local search methods for constraint satisfaction. These
    methods often fail because they have only a very limited view of the unknown search-space
    structure.


    The present paper overcomes the drawbacks of these two approaches by using global
    constraints. The use of global constraints for local search allows us to revise
    a current state on a more global level with domain-specific knowledge, while preserving
    features like reliability and maintenance. The proposed strategy is demonstrated
    on a dynamic job-shop scheduling problem.


    # # 1. Introduction


    The use of local search has become very popular in recent years as applications
    have begun to tackle complex real-world optimization problems for which complete
    (refinement) search methods are still not powerful enough. Problem domains with
    nontrivial optimization functions, large problems, short computation time limits,
    partial constraint satisfaction, dynamic constraint satisfaction and only limited
    demands on optimality are promising candidates for local search.


    Local search performs a search by iteratively changing the initial assignment
    of variables. In each iteration, a neighborhood of potential successor states
    is generated. The quality of the neighborhood states can be computed by a cost
    function. This information is used by the successor choice criterion to determine
    the successor state.


    Conventional ways of using local search are difficult to generalize. Increased
    efficiency is the only goal, generality often being disregarded. It is quite common
    to define highly sophisticated and problem-tailed representations with specialized
    neighborhoods and successor selection methods (see [Aarts97] for examples).


    2000 Mathematics Subject Classification. 90C27; 68T20.

    This work is supported by the German Research Foundation (DFG), NICOSY, Cross-platform
    Research Germany (CPR) and Conitec Dataservices GmbH.


