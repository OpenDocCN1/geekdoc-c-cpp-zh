    6. Susceptibility to Local Minima and Plateaus

    Unlike low-level CSP-based representations, global constraints enable the search
    to be conducted in a more informed way. A measure for this is the susceptibility
    to getting caught in local minima and on plateaus. This is investigated in the
    following subsections.


    6.1. Random. The previous test runs had randomization at all choice options. This
    is a common technique to leave local minima and plateaus. However, randomization
    need not always have a positive effect. Figure 12 shows choice variants, where
    $N$ means choosing the subject with the highest inconsistency, and $R$ means a
    choice with a probability of the subject''s being chosen that is proportional
    to the subject''s inconsistency. The letters $g$, $m$ and $t$ indicate the choice
    points: $g$ the global search constraint''s control selection, $m$ the first interval
    of the ARC''s improvement heuristic, and $t$ the relation choice of the TCs''
    improvement heuristic (see Fig. 7).


    For the first phase (Fig. 12, top graph) of the search, the quality of the strategies
    can be more or less ordered according to their amount of randomization, the nonrandomized
    $NgNmnNt$ version clearly being the best. The superiority of nonrandomized strategies
    is not surprising, as local minima and plateaus are less probable in the early
    phase. The $Ng$ component are the most important part. Strategies with an $Rg$
    component are nearly always worse, even in the later phases of the search (middle
    and bottom graphs).'
