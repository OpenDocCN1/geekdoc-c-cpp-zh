  pgno: 148
- img_proc: true
  md: '# 4. Relief Opportunity Selection


    A large extent, if we decide relief opportunities will be used to change drivers,
    the driver schedule is itself determined by those decisions. If, some of the available
    relief times are to be rejected, this must be done with care, and with the construction
    of the driver schedule in mind.


    We have taken the approach of using constraint programming to construct drivers
    covering part of the day: this can be done very well. Several alternative partial
    schedules, for the same period of the day, are found. In each partial schedule,
    the relief opportunities which have been used to change drivers are a small subset
    of the relief opportunities available in that part of the bus schedule. We form
    the union of the subsets from the alternative partial schedules and delete any
    other relief opportunity in that part of the day from the bus schedule passed
    to TRACS II. Hence TRACS II can only form shifts which change drivers at relief
    opportunities used in the partial schedules by constraint programming. Otherwise,
    TRACS II runs in its usual way; it generates possible shifts using only the selected
    opportunities, and selects the driver schedule only from those shifts. In the
    following, we shall only describe the work on selecting relief opportunities;
    selecting relief opportunities in the evening is in an exactly analogous way.


    In order to select a useful set of relief opportunities for TRACS II in the morning,
    we use constraint programming to find a way of covering all the work in the bus
    schedule up to noon, using legal shifts. We do not insist that the number of shifts
    is minimized, but indirectly the conditions which have to be obeyed and the way
    in which the schedule is constructed ensures that an efficient schedule is found.


    # 4.1. Meal-break Chains.


    Rather than primarily thinking of the driver schedule as partitioning the blocks
    into shifts, we focus instead on how one driver hands a bus to another. Often,
    a hand-over occurs when one driver is finishing work on a bus to take a meal-break,
    and the bus is taken over by another driver finishing their meal-break. The first
    driver, returning to work following the meal-break, may similarly take over a
    bus from a driver to take a meal-break. This process continuing a meal-break chain.
    For instance, shift S1 takes over Bus 2 from shift S2; S2 takes over Bus 3 from
    shift S3, and so on, until shift S5 takes over Bus 6 from shift S6. We have a
    chain of meal-breaks starting at 1025 on Bus 1 and finishing at 1225 on Bus 6.
    These chains are shown in Figure 2. Forming that meal-break chains allows the
    shifts to fit together efficiently. In Figure 1, all the work up to 1235, on all
    buses is covered by seven drivers. We need an extra shift (in this case S7) to
    take over when the first shift in a chain takes a meal-break, unless the bus is
    returned to the depot at that time. If the meal-break were longer than 30 minutes,
    we should need two meal-break chains in the morning (for instance, 1025 → 1125
    and 1055 → 1155 → 1255) and consequently eight shifts would be required to cover
    all the morning work, rather than seven. Forming meal-break chains in the shifts
    covering the morning is a good approach to finding a good set of relief opportunities
    in this part of the day, and will ensure that TRACS II has available at least
    one good way of covering the morning work.'
  merge: -1
