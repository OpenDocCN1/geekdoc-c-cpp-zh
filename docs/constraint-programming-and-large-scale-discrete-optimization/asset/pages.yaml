  md: 'tabu moves and neighbourhood function for TS, selection, crossover and mutation
    operators for GA).


    The main drawback of designing iterative improvement techniques is that they cannot
    guarantee that an optimal solution if it exists, although in some cases it can
    be shown that the optimization algorithm will asymptotically converge to a global
    optimum. On the other hand, they can provide good trade-off results (i.e. solutions
    in little CPU time) for very large LSCOs where other methods fail. A lot of research
    and experimental work is focusing on stochastic methods where the main technical
    issues are the choice of neighborhood functions, acceptable configurations and
    data structures to store each state. To ease the modelling and lighten the weight
    of handling complex data structures, some recent work has focused on designing
    a modelling language for local search techniques ([MHv97]).


    # 2.4. Summary. The existing forms of guidance to tackle LSCOs remain mostly technical,
    and driven by the paradigm at hand. They consist of:


    +   1. Case studies: Designing efficient algorithms for specific problem categories:
    e.g. heuristics techniques for CSPs, Polyhedral cuts for MIP, tuning parameters
    for stochastic techniques


    +   2. Modelling guidelines: Mapping models to algorithms; e.g. adequate formulation
    in CSPs, MIP models and matrices property in MIP


    +   3. Implementation support: Easing the tackling of LSCOs by embedding powerful
    algorithms into programming languages, and providing facilities in CSP languages
    (high level modelling, global constraints, support for hybridization), algebraic
    modelling languages, modelling languages for local search.


    Given the level of maturity of the three paradigms we have presented, and considering
    the important role they play in LSCO applications, a logical step forward is to
    offer forms of technical guidance for a multi-paradigm technology. Support for
    hybrid modelling and solving is provided by some CP programming languages. However,
    upstream from the programming activity more guidance is needed as new issues arise
    at the design level: problem decomposition, algorithm characterization, integration
    of hybrid models, co-operation of solvers. Addressing design of LSCOs from a multi-paradigm
    perspective is a core element of the CHIC-2 methodology. Another key element is
    to provide forms of guidance for the development and management aspects of optimization
    projects.


    # 3. An engineering perspective


    As mentioned in the introduction, our goal is not only to consider the development
    of LSCO solutions from a multi-paradigm perspective, but also to consider the
    software engineering aspect of LSCO projects. In this respect, we have investigated
    several software engineering methodologies and have identified some features of
    LSCO problems which cannot be dealt with efficiently by such approaches. Our objective
    is to provide guidance for a dedicated approach that treats these issues.


    First, let us recall general aspects of software engineering methodologies, their
    purpose and the different trends that are evident today.


    # 3.1. Software engineering methodologies. A software engineering methodology
    provides a framework of engineering methods and processes to develop software.
    Most existing methodologies are scoped for specific roles (project'
