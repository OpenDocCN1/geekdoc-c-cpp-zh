    best-first with backtracking search. The idea behind the best-feature is to expand
    the nodes that are most likely to lead to an optimal solution. However, this requires
    the use of a queue for node storage and thus makes quite limitation. The MT-FWBS
    accounts for memory by using backtracking to control the size of the queue. Specifically,
    when the queue grows to a certain size, nodes are no longer expanded in a best-first
    manner. Instead, they are expanded using backtracking. Thereafter, when the size
    of the queue is reduced, the MTFWBS reverts to a best-first search. The benefit
    of this design is that many of the best nodes will be expanded while controlling
    the memory requirements of the search.


    # 4.1. Implementation. The MT-FWBS uses a concurrent priority queue implemented
    with a heap [HMPS] to store nodes.


    In general, the order in which the nodes are arranged is determined by whether
    the objective is a minimization or maximization function. Again to fix ideas,
    we assume a minimization problem. In this case, the nodes are arranged in ascending
    order to a given heuristic evaluation function. The use of a queue to store nodes
    requires the concurrence of nodes. Section 3.7.1 provides two methods for this.
    However, through experimentation we have discovered that the best performance
    of the MT-FWBS is achieved by using explicit node representation. We attribute
    the success to two key factors of the MT-FWBS. First, global optimization requires
    a great deal of computational power and efficiency, Thus, execution time for the
    creation and copying of nodes must be minimum. Clearly, explicit node representation
    is better in this regard. Secondly, the MT-FWBS incorporates backtracking to control
    the size of the priority queue.'
