  md: '# LSCO-A METHODOLOGICAL VIEWPOINT


    solution methods, however it still focuses on CSP models (e.g. binary CSP, discrete
    CSP, SAT) solved by constraint satisfaction techniques, and does not yet consider
    hybrid models and algorithms from all paradigms (e.g. [Bv98]).


    2.2. The Operational Research paradigm. The Operational Research (OR) paradigm
    is more mature and already provides a lot of guidance for modelling combinatorial
    optimization problems and make them to powerful algorithms. Of particular interest
    to us is the framework of integer or mixed integer combinatorial optimization
    (for core knowledge [GN72, NW88]). OR techniques used to solve Mixed Integer Programming
    (MIP) methods make use of special algorithms and search methods. Special purpose
    algorithms like flow algorithms, are of great importance in handling LSCO since
    flow problems frequently arise as subproblems. They can also be more efficient
    than generic algorithms.


    Search algorithms such as branch and bound consist of iterating two steps: 1)
    solving a relaxation of an MIP problem using linear programming methods (e.g.
    the Simplex method [Dan63]), 2) splitting the problem into subproblems where a
    constraint is added. Very efficient implementations of the Simplex algorithm are
    available in the market [CPL94], and can handle thousands of variables and constraints.
    Branch and bound algorithms have been very successful in solving large instances
    of MIP problems however, the efficiency of such algorithms can vary according
    problem instances since they do not exploit the problem structure. Research focuses
    on improving search algorithms and studying the structure of the solution set
    to derive new constraints that would approximate this set as close as possible.
    The latter ones are usually more powerful through cutting planes (e.g. [Gom63])
    and polyhedral cuts. They are more difficult to compute (for core knowledge [NW88]).


    Thus the modelling of a discrete combinatorial optimization problem is essential
    component to its efficient solving. Some guidance is provided to design the mathematical
    programming model by means of case studies (surveys in [Gr093, Wil94]). Also there
    is a growing number of algebraic modelling languages to use the formulation of
    LSCO models fed to LP/MIP solvers (such GAMS [BM82], AMPL [FGK93], XPRESS-MP [Da97]).
    The weak point is the scarcity of works that integrates mathematical programming
    models with other paradigms like constraint programming, even though they could
    be seen as complementary.


    2.3. The stochastic search paradigm. A third paradigm for be used in solving LSCOs
    is based on stochastic search methods, including Simulated Annealing (SA), Tabu
    Search (ST) [KGV83, Glo89, GL97], and Genetic Algorithms (GA) [Gol89]. This paradigm
    differs from the previous in two sense that the methods require few restrictions
    on the nature of the problem. Stochastic search methods are iterative improvement
    techniques which explore a space of complete solutions. The first solution is
    obtained by modifying one or few of the assignments. At each step of the optimization
    process, the current solution is replaced by one of its neighbours. GAs work on
    a population of solutions. Tuning the selection of appropriate parameters is very
    much case-studied (e.g. temperature and cooling function for SA, list'
