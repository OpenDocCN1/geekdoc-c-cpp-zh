    that are identical as far as the physical reality of the problem is concerned.
    We can exploit this idea to minimize the size of the search space.


    If we reduce the domains of these variables by introducing a supplementary constraint,
    such as order, or by imposing a special feature on these variables, then we can
    markedly reduce the size of the search space. For instance, suppose that we want
    to solve $x + y = z$, where $x$ and $y$ have the same initial domain. In this
    case, we can add the constraint $x \leq y$ and solve the new problem. From the
    solutions of this problem we can build all the solutions of the initial problem.


    Detecting some hidden symmetries and finding a way to avoid them is certainly
    one of the main problems of modelization.


    In sports problems, we will see that it is possible to remove some nonobvious
    symmetries in an efficient way when we want to determine the minimum number of
    breaks.


    # 2.2. Implicit constraints. An implicit constraint makes explicit a property
    that satisfies any solution.


    Since constraint programming decreases the search space by reducing the domains
    of variables, it is obviously important to express all necessary constraints.
    In some cases, it is also a good idea to introduce implicit constraints to reduce
    the size of the search space by supplementary domain reductions.


    The introduction of implicit constraints does not change the nature of the solution
    but can slow down the propagation process. However, this slowing may be negligible
    in certain problems when it is compared with the efficiency gained from reducing
    the size of the search space obtained by the filtering algorithms.


    Here is a good example of the uselessness of implicit constraint. Suppose we want
    to solve a constraint network involving 100 variables with the same domain, $\{0,
    1, 2, 3, 4\}$. The constraints are: at most 0 must be at least five variables.
    The filtering algorithm associated with each of these constraints achieves consistency.
    In this case, this algorithm corresponds to the idea: "if $a$ is assigned to $k
    < 5$ variables and there are only $5 - k$ variables that are not instantiated,
    assign $a$ to all these variables". Suppose that the variable-value ordering of
    choosing the variable with the domain of the minimum size and the first value
    in the domain (the classical minimum ordering). 95 variable will be instantiated
    to 0 before detecting an inconsistency. When 94 variables are instantiated to
    0, all the filtering algorithms remove no value. So even, it is clear that at
    most $100 - 4 \times 5 = 80$ variables can be instantiated with 0. With. If we
    add this implicit constraint, we will avoid $5^{14}$ constraints! Moreover, we
    can add a more sophisticated implied constraint which states that the number of
    uninstantiated variables must be satisfied simultaneously the first initial constraints.


    In sports scheduling we will will see that the number of breaks is always an even
    number. The introduction of such an implicit constraint speeds up the search for
    the minimal solution.


    # 2.3. Global constraints. A global constraint $C$ is a constraint involving a
    set of other constraints, such that the filtering algorithm associated with $C$
    is more powerful than the conjunction of each constraint in $C$ separately.'
