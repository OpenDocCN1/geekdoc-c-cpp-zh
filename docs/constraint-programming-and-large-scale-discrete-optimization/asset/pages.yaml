  md: '# Introduction to DIMACS Workshop on Constraint Programming and Large Scale
    Discrete Optimization


    Richard J. Wallace and Eugene C. Freuder


    # 1. The Workshop


    The Workshop on Constraint Programming and Large Scale Discrete Optimization was
    held at the DIMACS center at Rutgers University on September 14-17, 1998, as part
    of the DIMACS Special Year on Large Scale Discrete Optimization. The purpose of
    this workshop was to bring together researchers currently working on the application
    of constraint programming techniques to challenging problems in the area of combinatorial
    optimization. An attempt was made to attract people from the operations research
    as well as the constraints community, in order to foster cross-fertilization between
    these two active areas of research.


    A call for papers in the spring of 1998 resulted in a number of individual contributions
    that were presented at the workshop along with talks by invited speakers. The
    contributors included people in industry as well as academia, since this area
    of research is currently the focus of intense interest in parts of the business
    world. (Abstracts of many of the papers presented at the workshop can be found
    at the DIMACS web site http://www.dimacs.rutgers.edu/under/shops/ConstraintProg/abstracts.html.)
    After the workshop, some of these papers were submitted for possible inclusion
    in the present volume. After review by authorities in the field as well as the
    editors, papers selected for inclusion were revised and resubmitted. The present
    volume contains these revised, referred papers.


    # 2. Large Scale Discrete Optimization and Constraint Programming


    The study of discrete optimization problems is comprised of several, sometimes
    overlapping streams, of which constraint programming is perhaps the latest. The
    constraint satisfaction paradigm, from which constraint programming is derived,
    first emerged in the field of artificial intelligence (AI), a considerably later
    date than classical mathematical programming techniques. In the seventies investigators
    in the field of artificial intelligence first noted that the problems in many
    AI domains, such as machine vision and expert-level problem solving, could be
    represented by a very simple formalism that came to be known as the constraint'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'satisfaction or consistent labeling problem. In this paradigm, the basic elements
    of the problem are represented as a set of variables, each of which can be assigned
    a value drawn from some set, called the domain of variables. The latter set is
    often finite, and can be heterogeneous and disordered. Values (or labels) are
    chosen that are consistent with constraints among variables. To do most work involves
    solving using techniques for achieving partial consistency among subsets of variable-value
    pairs, combined with enumerative techniques, depth-first backtracking search (cf.
    [Tsa93][MS98]).


    This paradigm became prominent during the eighties. The decade of the eighties
    also saw the emergence of constraint programming languages and software development
    environments, as extensions of logic programming as exemplified by [Hen88]. The
    rapid development of the field continued into the nineties, until at the middle
    of the decade it became the most ‘popular’ area in AI in terms of papers presented
    at major conferences. This decade also saw the establishment of the ‘Principles
    and Practice of Constraint Programming’ conference, which has been held annually
    since 1995, and a specialty journal for this field, the ‘Constraints Journal’.


    During the eighties the field of constraint satisfaction also first to break up
    operations research and its allied disciplines, especially in the field of production
    scheduling. However, it was not until the following decade that each of these
    areas became cognizant of the other, and began to face the issues raised by the
    existence of a rival approach to constrained optimization.


    The major strategy from operations research for handling discrete optimization
    problems is integer programming, which dates from the late 50s, although it has
    undergone substantial improvements in the following decades. This work has led
    to a rich set of techniques and abstract problem types (cf. [NW88]). In addition
    to the study of significant application areas, such as production scheduling and
    routing transportation problems, often under the rubric of operations management,
    has given rise to numerous specialized forms of systematic enumeration, as well
    as to heuristic, approximation techniques that produce good but not necessarily
    optimal solutions (see, e.g., [Bak97][LLKS90]).


    What we can now call the classical constraint satisfaction did not contain an
    explicit concept of optimality, which was so concerned with feasibility, with
    finding solutions that satisfied all the stipulated constraints. In the nineties,
    the paradigm was extended to discrete optimization problems. The basic approach
    was to valuations to components of the CSP: the resulting problems can be solved
    with forms of search that combine branch and bound with classical constraint satisfaction
    techniques, or by local search. Some key papers in this area as well as most recent
    work can be found in the collection, [JMF96].


    With the direct comparisons of constraint and integer programming approaches,
    it becomes clear that there are problems where each approach is markedly superior.
    Generally, the constraint programming paradigm tends to give a more compact and
    perspicuous representation of the problem than IP, which, in turn, can result
    in a search procedure that is better tailored to a given problem. On the other
    hand, in cases where integer programming entails extensive relaxations, it'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# INTRODUCTION


    can be more efficient. As a result of these findings, there has been considerable
    interest in combining the two approaches in the form of hybrid algorithms, in
    addition to specifying the conditions under which each approach is superior. In
    addition, attempts have been made to provide unifying frameworks [BK98][HOTK99].
    Several examples of these trends have been met with the papers in this volume.


    The eighties and nineties saw the emergence of local search as a general strategy
    for handling both constraint satisfaction and constrained optimization problems.
    Continued research on these techniques, once again has led to an analysis of the
    relative strengths of local search as a vis implicit enumeration, as well as to
    hybrid procedures. The present volume contains examples of both developments.


    # 3. The Papers


    The present volume presents a selection of papers that illustrate some of the
    directions that constraint programming has taken in the past few years, and some
    of the directions that it may have headed. It, therefore, gives a précis of state-of-the-art
    research in this field, touching on many of the important issues that are emerging
    from this work, and giving an idea of major current trends. We have grouped these
    papers under three categories: general techniques, scheduling applications, and
    software methodology.


    In many areas of discrete optimization, local search methods have been successfully
    applied, and continues to be an active area of work. This approach is presented
    in the present volume. Voudoris and Tsang review their work on guided local search,
    which they have applied to the Traveling Sales Problem as well as other discrete
    optimization problems. Nayrek presents a new approach to local search, which uses
    global constraints to reflect problem structure, and to serve as the basis for
    problem-specific strategies. Meyer (whose paper appears in the section on scheduling)
    discusses a method for combining local search with exhaustive subproblems; his
    work also explores the use of abstraction techniques to simplify search.


    Another general approach that has not received much attention in this area as
    it probably should is the parallelization of search. Zabatta discusses the issues
    involved in multithreaded constraint programming, describes a new search strategy
    that combines parallel best-first and backtrack approaches, and applies this strategy
    to the set covering problem.


    As pointed out in the last section, a major field of application of large scale
    discrete optimization as well as constraint programming in particular has been
    scheduling problems. At present, this is a burgeoning field with a variety of
    applications, as indicated by the contributions to this volume. Meyer treats a
    problem of employee scheduling, by assigning nurses to shifts in a hospital ward.
    This work builds on earlier work of the author that deals with constraint preferences;
    here, these ideas are extended to incorporate fuzzy constraints that are to model
    global characteristics as overtime speed. Pember and Galiber discuss various facets
    of mission scheduling on orbiting satellites that distinguish it from other kinds
    of scheduling that effectively handle these problems. Robins works on basic problems
    in scheduling, in particular, minimizing the number of “breaks”, or successive
    home or away games, in the schedule for a sports league. A critical


    3'
