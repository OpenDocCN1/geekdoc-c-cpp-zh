    # 5. EMPIRICAL RESULTS


    We tested the MT-BFWBS on the classic Set Covering Problem. Section 5.1 describes
    the problem, 5.2 discusses implications, and 5.3 details the benchmarks and reports
    results.


    5.1. The Set Covering Problem. The Set Covering Problem (SCP) is a well-known
    and studied problem. It is the problem of covering the rows of a m-column, zero-one
    matrix, $A_{ij}$, by a subset of the columns at a minimal cost. The density of
    an instance of the SCP, is defined as the percentage of ones in the matrix $A_{ij}$.
    The problem can be formally defined as follows:


    Let:

    $x_j = 1$ if $x_j$ is in the solution.

    $x_j = 0$ otherwise.

    $c_j =$ the cost of column $j$.


    then the problem is to minimize


    ```

    (5.1)   \sum_{j=1}^n c_j x_j

    ```


    subject to


    ```

    (5.2)   \sum_{j=1}^n A_{ij} x_j \geq 1   i = 1, \dots, m

    ```


    ```

    $x_j \in {0, 1}   j = 1, \dots, n$

    ```


    (5.3) Constraint 5.2 ensures that each row is at least covered by one column and
    5.3 is the integrity constraint. If the inequality in 5.2 is changed to an equality,
    the resulting problem is called the Set Partitioning Problem. If in the SCP of
    the columns are equal then the SCP becomes a special case known as the unicost
    SCP. We will only consider the general case where costs may differ.


    The SCP has many real applications that include crew scheduling [Rubin], facilities
    location [TSRB], and Boolean expression simplification [Breuer]. Although easy
    to formulate, solving an instance of problem is not trivial. In fact the SCP is
    NP-hard []. Various methods have been proposed for solving the problem, including
    exact methods and heuristics. Most of the early algorithms proposed were exact
    methods based on various branch and bound techniques, and improvements on such
    methods by obtaining tighter bounds. However, we are unaware of any solution method
    that has included the use of constraint programming.'
