    Individuals have different choices to produce offspring depending on their "fitness".
    Applied to optimisation, fitness is measured by the objective GAs have been applied
    to constraint satisfaction [ERR94, RER95] and demonstrated promising results in
    discrete optimisation [WT94, WT95].


    Guided Genetic Algorithm (GGA) is a hybrid of GA and GLS. It can be seen as a
    GA with GLS to bring it out of premature convergence (this situation resembles
    a local optimum situation for local search methods). In particular, if no progress
    has been made after a number of iterations (this is a parameter to GGA), GLS modifies
    the function (which is the objective function) by penalties. GA will then use
    the modified fitness function in future generations. The penalties are also introduced
    by cross crossover and mutation in GA - genes that are involved in more penalties
    are more susceptible to changes by these two GA operators. Others allow GGA to
    be more focused in its search.


    On the other hand, GGA can generally be seen as a number of GLS searches from
    starting points in parallel, exchanging material in a GA manner. The difference
    is that only one set of penalties is used in GGA where parallel GLS would have
    one independent set of penalties per run. Besides, learning in GGA is more selective
    than GLS: the updating of penalties is only based on the best chromosome at point
    of penal.


    GGA has been found to be robust, in the sense that solutions found by GGA were
    as good as GLS (not surprising, as GGA was built upon GLS), but costs fall into
    a narrower range [Leu99]. GGA has been applied to the Process Configuration Problem
    [LT97, LT98], General Assignment Problem [LT98a] and the Radio Link Frequency
    Assignment Problem [LTar] with excellent results. Details of GGA and its applications
    will be reported in another occasion.


