  md: '# 4.4. Three-bus Shifts. Although we have so far described the construction
    of shifts which work on exactly two buses, driver commonly include some shifts
    working on two (or sometimes more) buses. These shifts have usually only one-break;
    the others are much shorter breaks, only to allow time for the driver to transfer
    from one to the other. Such shifts are undesirable, because the additional breaks
    are paid in the same way as driving, they are sometimes necessary to cover awkward
    pieces of time. We considered incorporating the formation of three-bus shifts
    into the partial schedules, but this would have complicated the problem considerably.
    Allowing shifts to work on three buses increases the number of possibilities hugely,
    so that would have been necessary to define when they are required; the existing
    restrictions, for instance allowing at most three shifts to work on any bus, would
    have to be relaxed. In fact, it turned out to be unnecessary to include three-bus
    shifts in the relief opportunity selection phase; experiments have shown that
    selecting relief opportunities using only two-buses, with a shorter minimum length
    than usual, and then allowing TRACS II to form three bus shifts using these relief
    opportunities, gives good results. Allowing a set of relief opportunities from
    any one CSP solution may only provide suitable opportunities for two-bus shifts,
    when several are combined, there in practice sufficient scope for three-bus shifts
    to be formed.


    Occasionally, shifts working on four vehicles are required for efficient schedules
    (although this is much more common in driver scheduling); an example is given
    in section 5. Again, allowing shifts to work on four buses increases the number
    of potential shifts enormously.




    4.5. Selecting Evening Relief Opportunities. The profile of buses on the road
    at different times of day for a typical week-day schedule is not symmetrical.
    The morning peak occurs shortly after most buses have started running, whereas
    the evening peak occurs several hours before normal bus services finish in the
    late evening. The morning peak is typically covered by drivers whose shifts started
    by taking a bus from the depot, who will not take a meal-break until the peak
    is over. The evening peak on the other hand is covered by drivers who are coming
    to the end of their shift and by drivers who have just started their shift and
    will take a meal-break after the peak and then work until the late evening, when
    they return their bus to the depot.




    Nevertheless, we have found that the methods developed for relief opportunities
    in the morning can be applied in the evening as well, simply by working backwards
    in time from the end of the day. Making that the shifts covering the early part
    of the day link up with those covering the later part of the day, if relief opportunities
    are selected from both periods, is left up to TRACS II. The time between 1200
    and 1500 (depending on when the buses return to the depot in the late evening)
    acts as a kind of buffer zone in which all the relief opportunities are kept,
    to allow these to be made. As demonstrated in the next section, selecting relief
    opportunities in this way in both the morning and the evening parts of the schedule
    gives better results, in terms of a reduction in running time with little or no
    increase in solution cost, than selecting from either part.'
