    then this suggests changing the labeling of $x$ in A $x- 0$ recommends to preserve
    the current labeling of $x$ in A. Assignment $A''$ is likely to indicate a promising
    region for improving the solution of the original problem $\mathcal{P}$. These
    regions for an overall improvement are called global revisions.


