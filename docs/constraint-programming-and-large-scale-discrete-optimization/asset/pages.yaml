    > PROPOSITION 4.1. For each pair of consecutive periods $j$ and $j+1$, let $Bp$
    be the variable that counts the number of breaks for the pair of consecutive periods.
    Then, $j=1, \dots, n-2$: $\#Bp$ is even.


    PROOF. Consider two consecutive periods $j$ and $j+1$. Let $p$ be the number of
    home games of these two consecutive periods and $q$ be the number of away breaks.
    Suppose that $p \neq q$. Without loss of generality, we can consider $p > q$.
    When a team plays a home game, its opponent plays an away game, in each period
    there are $n/2$ home games and $n/2$ away games. Then, $j/2-q$ away games have
    to be defined in that no new breaks appear. The result can be obtained if $n/2-q$
    home games are available in period $j+1$, but $p > q$, this means that $n/2-p
    < n/2-q$. Thus, the number of remaining games in period $j+1$ is not sufficient.
    Hence, $p=q$ and $\#Bp=p-q=2p$ is even.


    > PROPOSITION 4.2. $\#B$ is even.


    PROOF. $\#B = \sum_{j=1}^{n-2} \#Bp$, and each $\#Bp$ is even, so $\#B$ is even.


