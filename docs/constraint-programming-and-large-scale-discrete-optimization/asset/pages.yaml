    # 5. Discussion


    In real-life applications it is often impossible to have a solution that satisfies
    all the constraints. In this case, a certain function must be minimized. Often,
    this function includes the number of breaks. So our study can be used to compute
    a minimum bound of this function. Moreover, we have presented a lot of constraints
    that cannot be violated for any sports scheduling problem. Thus, these constraints
    should be useful in practice. Some new constraints should also be defined when
    some other information is available. For instance, if no consecutive breaks are
    allowed, Proposition 1 can be extended to deal with this condition.


    When the teams are instantiated, we suggest the following implicit constraint:


    +   - for each period every team plays.

    For each period $j$, an constraint involving the $O_{ij}$ variables for $i=1,...,n$
    is defined. This constraint if often redundant. (This is the case for the problem
    we have studied.) However, we think that it can greatly help the resolution of
    certain instances where only games are already defined.


    # 6. Conclusion


    In this paper, we have shown the importance of constraint programming for solving
    a large scale optimization problem, the minimization of the number of breaks in
    a sports scheduling problem. First, we introduced a model that solves a polynomial
    problem in polynomial time with constraint programming. This shows that constraint
    programming is also an efficient technique for solving easy instances. Then, we
    studied a modification of the original problem which is hard to solve. The introduction
    of useful ad-hoc constraints should be used to improve the resolution of complex
    real-life applications.


