    # 3.2. Multithreaded Performance. The performance gain that is attainable by multithreading
    a CP application is dependant on many factors. These include how the workload
    is distributed, the amount of parallel overhead, and parallel search anomalies
    [LS]. Although little can be done about parallel search anomalies, the goal of
    a load management scheme is to partition the workload in a way that processor
    utilization will be high and overhead from parallelization will be low. In addition,
    high processor utilization come from time spent on the original workload, not
    spent partitioning or managing the workload. This leads to an important issue.
    How many threads should be used for parallelization? [ZY1] it was shown to obtain
    a theoretical maximum speedup on a particular machine the number of threads used
    should be equal to the number of processors of the machine. This effect creates
    one thread for each processor. Therefore, using fewer threads results in poorer
    utilization and using more threads results in additional overhead context switches.
    With that stated, the next issue that arises is how to divide the workload among
    threads. Work schemes fall into two categories, static and dynamic. A static strategy
    divides the workload before beginning execution. Each thread has a disjoint part
    of work to perform. After it has performed its task, the thread terminates. This
    type of scheme has the benefit of requiring little synchronization among and minimal
    computational overhead for making the computation parallel. However, search tree
    anomalies can lead to load imbalances and consequently poor performance. Another
    option is to divide the workload dynamically so that a thread with no work can
    obtain work from a busy thread. This is often referred to as dynamic load balancing.
    Dynamic load balancing strategies exist and can be easily adapted for multithreading.
    We discuss in-depth. For our purposes we use the Dynamic Thread Creation scheme
    [ZY2]. The scheme controls the number of concurrently executing threads via an
    imposed limit called the active thread (ATL). Dynamic Creation ensures that the
    ATL is never exceeded and that whenever the number of concurrently executing threads
    is less than the ATL, an executing thread can partition its current workload by
    creating a new thread. When a thread has finished its assigned workload, it terminates.
    It should be noted to achieve the maximum performance from parallelization the
    ATL should be set to the number of processors.


