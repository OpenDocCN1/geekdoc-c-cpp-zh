  md: '# USING GLOBAL CONSTRAINTS FOR LOCAL SEARCH


    5.1.1. Global Action Resource Constraints. An ARC is connected to a set of pairs
    P and two variables c and h. A pair of the set P, (sᵢ, eᵢ), represents a task
    i that uses the machine/resource. The starting time of a task i is represented
    by the variable sᵢ and the end of the task by the variable eᵢ. The ARC''s role
    is to prevent overlapping tasks. For each discrete point of time from c to h,
    the number of assigned tasks - 1 is added to the inconsistency if there is an
    assignment of more than one task at this time. The constraint can affect the tasks''
    temporal distribution by changing the variables sᵢ/eᵢ.


    ARC''s basic internal structures are a set of task objects and multiple-linked
    list of temporal intervals. A task object contains references to the start variable,
    the end variable and its intervals. The intervals split the time from c to h into
    maximum parts that each interval has the same task assignment for its duration
    (see Fig. 4). Overl mapped to the intervals, and the inconsistency of an interval
    is computed by the overlaps by the interval''s length. Links to an interval''s
    task objects are also stored. The ARC''s total inconsistency is the sum of the
    intervals'' inconsistencies.


    ![](img/c20b6a5053a472f27c2d36f581c5c428_28_0.png)


    FIGURE 4. ARC''s Internal Structures


    The ARC''s basic heuristic (ARC-H1) selects an inconsistent interval (iₜ; see
    selection a) of Figure 5 with a choice probability that is proportional to the
    interval''s inconsistency. For example, if the intervals A to E have inconsistencies
    of Acosts = 10, Bcosts = 12, Ccosts = 10, Dcosts = 0 and Ecosts = 4, the choice
    of being chosen is 27.8% for B, 27.8% for C, 0% for D and 11.1% for E.


    Then, one of the interval''s tasks (t₁) is chosen at random. The task''s start
    variable is shifted to the beginning of an interval i₂, a choice probability for
    the interval being proportional to its length times task-number with respect to
    the interval i₁. Only intervals with fewer tasks than the i₁''s (without the task
    t₁) are considered for this decision, and the maximum length of the intervals
    considered for the multiplication is that of the task t.


    5.1.2. Global Task Constraints. A constraint manages a set of temporal relations
    between a job''s tasks (see Fig. 6). Each relation involves links to two decision
    variables V₁ and V₂, a constant c and a comparator ⋄ ∈{<, <=,>} where V₁ ⋋ V₂
    + c. The inconsistency of a relation is given by the minimal distance for one
    of the variables required to satisfy the relation. The TC''s total inconsistency
    is the sum of the relations'' inconsistencies.'
