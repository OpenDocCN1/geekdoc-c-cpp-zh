  md: 'The goal is to find a concrete begin/end for all currently active tasks, such
    that the inconsistency of the constraints is as low as possible. To compare different
    algorithms, the inconsistency can be displayed over time (see Fig. 3; peaks occur
    on job removal/addition) and the average inconsistency can be computed.


    ![](img/c20b6a5053a472f27c2d36f581c5c428_27_0.png)


    FIGURE 3. A Test Run Example


    The measurement of inconsistency is done in the following way:


    +   * For each discrete point of time from 0 to a on each machine, the number
    of assigned tasks - 1 is added to the inconsistency if there is an assignment
    of more than one task.

    * For each linear inequality that is unsatisfied, the minimal shift distance for
    one of the inequality variables required to satisfy the inequality is added to
    the inconsistency.


    The initial state for the test runs is computed by the iterative addition of n
    jobs, with p microseconds of computation time each addition, which is used for
    improvement iterations.


    The following parameters were used for the test runs throughout our experiments:
    The tasks'' duration is plus a random value of -99 to +100. 40% of a job''s tasks
    require the same machine as another of the job''s tasks. The jobs'' inequalities
    consist of 20% equations and 80% real inequalities. The inequalities involve a
    shift constant, which is plus a random value of -99 to +100.


    # 5.1. Realization. The dynamic job-shop scheduling problem was encoded according
    the global constraint concept³. There are two types of global constraints:


    +   * RESOURCE CONSTRAINTS (ARCs) for the nonoverlap of tasks that require the
    same machine

    * TASK CONSTRAINTS (TCs) for the temporal ordering relations between tasks within
    a job


    Decomposition into these types of constraints is done because of the strong dependencies
    among the variables and the manifold reuse possible. Resource constraints that
    hinder a temporal overlap of activities/assignments are needed in many applications


    > ³The implementation was done in ObjectC.'
