  md: '# Multithreaded Constraint Programming: A Hybrid Approach


    Fabian Zabatta


    ABSTRACT. Constraint programming is a powerful and robust technology for modeling
    and solving difficult combinatorial problems. However, as problems grow larger
    in scale and complexity, they become increasingly difficult to solve and their
    execution times can exhibit ordinate growth. One solution is multithreaded parallelization.
    Multithreaded parallelization can greatly improve performance, not only increasing
    the size of solvable problems but also improving solutions that were previously
    limited by time. Presented is a hybrid approach to application multithreaded constraint
    programming. This approach breaks away from the traditional scheme of chronological
    backtracking with constraint programming by using threads to perform a parallel
    search that combines a best-first approach with chronological backtracking. We
    illustrate the effectiveness of the approach on the Set Covering Problem and report
    empirical results of several large problem instances.


    # # 1. INTRODUCTION


    Constraint programming (CP) is a declarative programming technique that has grown
    from the collaboration of several research communities including Artificial Intelligence,
    Computational Logic, Programming Languages, and Operations Research. It has become
    an software technology for modeling and solving difficult combinatorial problems.
    Constraint programming has been successfully applied to numerous applications
    such as job shop scheduling [NA], portfolio selection [WZ], production planning
    [Lemke], robot programming [Pai], sports league scheduling [Henz] [MTw1], and
    various other Artificial Intelligence and Operations Research applications. Its
    highly declarative nature and its powerful solving methods have led to its commercial
    success. Several well known companies such as British Airways, Chrysler, Long
    Island Lighting Company, JD Edwards and Whirlpool use constraint programming to
    manage several aspects of consulting business [LOG-OPT] [Wallace].


    2000 Mathematics Subject Classification. Primary 65K10; Secondary 68N19. Many
    thanks to Ken McAloon, Richard Wallace, and the reviewers whose comments were
    invaluable. This research was supported by ORN grant N0014-96-1-1057.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 1.1. Background. Constraint programming is a technique that separates problem
    modeling from problem solving. This helps ensure that the problem to be solved
    is precisely defined. In addition, this separation can simplify the revision or
    the extension of the CP application when the corresponding problem changes and
    also allows one to alternate between different solution approaches without changing
    the model.


    In constraint programming, a problem is modeled in terms of its unknowns. This
    is usually accomplished by defining a set of decision variables and a set of constraints.
    A decision variable is a pair {X, D} where X is a variable (symbol) and D is its
    domain, defined to be its range of possible values. A bound variable is one whose
    domain contains only one value, and thus the decision variable is fixed and equal
    to the value. An unbound decision variable is one whose domain contains more than
    one value. Thus, it is a variable that has not been solved. A constraint is a
    relation that restricts the possible values of decision variables. To be precise,
    constrain on k decision variables X1,...,Xk a relation R(X1,...,Xk) D1...k where
    Di is the domain of Xi for i = 1,...,k.


    A constraint satisfaction problem (CSP) is given by a set of decision variables
    and constraints. If a CP requires the optimization of an objective, it is called
    a constraint satisfaction optimization problem (CSOP). A feasible solution or
    simply a solution to a CSP is an assignment to the given decision variables with
    values from their respective domains that satisfies the given constraints. Formally,
    a csp with n variables X1,...,Xn and m constraints R1,...,Rm solution is a mapping
    f(Xi) -> di, di ∈ Di is the domain of Xi, for i = 1,...,n, such that for each
    j, Rj(f(X1),...,f(Xn)) holds.


    In constraint programming, each constraint R of a CSP is considered a subproblem
    and techniques are developed for handling frequently encountered constraints.
    With each constraint is associated a domain reduction algorithm that removes values
    that are not feasible from the domains of decision variables that occur in the
    constraint. In addition, communication is facilitated among the constraints to
    improve efficiency. The basic method used, called constraint propagation, links
    the constraints through their shared variables to provide a level of consistency,
    a degree to which infeasible values are explicitly excluded by constraints. This
    is accomplished achieved by systematically reducing the domains of the decision
    variables whenever there is an implication regarding the values of a constraint.
    It is important to note that in the case where the domains of the decision variables
    are finite, constraint propagation will always reach a point where no further
    domain reduction is possible. This is called a fixed point. Furthermore, the domains
    of decision variables are always reduced in the same way regardless of the order
    that the constraints are considered. Therefore, the same fixed point will always
    be reached.


    In most cases, efficiency reasons, constraint propagation is not meant to detect
    all inconsistencies. First, therefore, not all consequences of posted constraints
    can be deduced. Secondly, there can be instances where a CP application can have
    more than one solution. These two cases can lead to situations where the domains
    of decision variables can contain more than one value even after constraint propagation
    has reached a fixed point. Thus, a search must be employed to choose values for
    variables and eliminate inconsistencies. To accomplish this, the search'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# MULTITHREADED CONSTRAINT PROGRAMMING: A HYBRID APPROACH


    reduce the domain of each decision variable it has a cardinality of one, while
    ensuring that all of the constraints are satisfied.


    In the case of CP applications have variables with continuous domains and linear
    constraints, simplex based methods such as Linear Programming (LP) and Mixed Integer
    Programming (MIP) are used [Dantzig]. In this case, the solving engine is often
    referred to as a linear solver. Several systems such as Prolog III [Colmera],
    [CLP(R)] [JM], [DVSAGB], 2LP [MT1], and the ILOG Optimization System (ILOG Planner)
    [ILOG-OPT] [ILOG-Plan] incorporate a linear solver. From the standpoint of constraint
    programming, the techniques of MIP and LP are special cases of the general CP
    framework. They provide the means to obtain efficient solutions for a specific
    context. Yet, solvers share many of the same attributes with finite domains. For
    example, both require search for the use of logical constraints and integer variables.
    In addition, the preprocessing in MIP called tightening is a form of domain reduction.


    In cases, a given type of solver is best suited for a specific class of problems.
    There exist problems with many varying attributes such that no specific solver
    is best suited. In these cases, different solvers may be used in operation to
    form what is known as cooperating solvers [da da Silva] [MTW2 [RW]]. For most,
    industrial problems involve a mix of linear constraints, logical constraints,
    and competing preferences and objectives. In these cases, a finite domain solver
    could be used in conjunction with a continuous domain solver such as a linear
    programming library. The finite domain solver can handle the logical constraints
    and search strategies while the linear programming library handles the linear
    constraints. In addition, communication can be facilitated between the solvers
    thus improving bounds, strengthening constraints, and ultimately resulting solutions.
    The power of cooperating solvers is becoming increasingly recognized. How it grows
    its way into industrial tools such as the ILOG Optimization System, where cooperating
    solvers are internally embedded.


    # 1.2. Performance. Although powerful and robust, constraint programming is not
    a panacea. As problems grow larger in size and complexity, they become harder
    and harder to solve. What''s more, their execution times can exhibit innate growth.
    For some cases, such as in real time systems, a large execution time is unacceptable
    and for some large problems solving can become impractical or even impossible.
    In these cases, constraint programming is often abandoned for heuristic methods
    or restricted by a limit on the execution time. In both cases, two outcomes are
    possible. Either solutions are found, resulting in the best solution within the
    limit being returned or no solution is found, resulting at best, in a case of
    optimization problems, limiting execution time or using heuristic methods may
    forgo optimal solutions. Although non-optimal solutions are acceptable for some
    situations, there are instances where businesses or whole industries could save
    millions in costs by obtaining an optimal solution. Thus, for some cases obtaining
    an optimal solution can be very attractive. Furthermore, limiting execution time
    or using heuristic methods can cause convergence to become non-deterministic.
    Therefore, methods to decrease execution time are important.


    # 1.3. Parallel Enhancement. Constraint programming relies on searches. In most
    cases, a large portion of the execution time of a constraint program is result'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# FABIAN ZABATTA


    of search time. Thus, improvements of search performance can greatly improve overall
    performance. In some instances, effective problem modeling and the use of appropriate
    solving techniques for the given problem can improve search performance. However,
    for many complex problems, search time can still be unacceptably long. One method
    to overcome this is through parallelization. Parallelization can lead to several
    performance benefits, including:


    **Speed:** The parallelization of a CP application may lead to a significant performance
    gain over its sequential counterpart. For example, using two processors for an
    application, instead of one, may decrease the execution time by a factor of two.


    **Large Scale:** Large problem instances that are impractical to solve sequentially
    have a greater probability of being solved using the additional computing power
    provided by parallelization. In addition, parallelization may also provide a method
    to optimize larger problem instances than sequential optimization.


    **Improved Heuristics:** Heuristic solutions that were limited by time may be
    improved by parallelization. For example, consider a CP application with the requirement
    that a solution must be returned within a fixed time limit. In this case, we will
    accept the best solution returned within the time limit. If we parallelize this
    application, the best solution found within the time limit, may be significantly
    better than the best returned if the application was executed sequentially. In
    fact, by making the application parallel we may ultimately optimize the solution.


    **Responsiveness:** In systems that require solutions in real-time or pseudo real-time,
    parallelism is the only way to achieve acceptable performance. For example, consider
    a chain management application where a customer places orders through the Internet.
    The goal of the application is to see if and how the order can be met, and return
    an answer to the customer in a timely fashion. In this case, parallelization can
    improve the rate at which a response is returned to the customer and increase
    customer satisfaction.


    Until recently, multipcessing required a substantial financial investment in hardware
    and software. The mammoth multiprocessing machines of the past cost millions to
    buy and sometimes, even more to maintain. This is no longer the case. Computing
    technology is improving at a remarkable pace. What''s more, as hardware such as
    processors and memory have increased in performance, their prices have decreased.
    This has created new standards for computing models and performance, especially
    in the multiprocessor arena. As recently as a few years ago, a high performance
    multiprocessor cost over $100,000, now cost under $12,000 [ZY1]. Today, one design
    is the symmetric multiprocessing architecture. A symmetric multiprocessing architecture
    is a tightly coupled multiprocessor system, where processors share a single copy
    of the operating system and resources that usually include a common bus, memory,
    and I/O system. The term "symmetric" refers to the fact that processors in the
    system are functionally equivalent and each can perform any task. In order to
    exploit symmetric multiprocessors, mainstream operating systems such as Windows
    NT and Solaris have incorporated thread architectures. Threads are the basic entities
    to which'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# MULTITHREADED CONSTRAINT PROGRAMMING: A HYBRID APPROACH 45


    the operating system allocates processor time. A process can contain one or more
    threads. Each thread has its own context, it shares the same address space and
    resources, as open files, timers and signals, with other threads of the same process.
    This design permits threads to function independently while keeping cohesion among
    the threads of the same process. This creates many benefits:


    Inexpensive: As a result of sharing resources, the time to create a thread is
    5 to 30 times faster than creating a new process and the time to perform a context
    switch between two threads of the same process is faster than performing a context
    switch between two different processes [SunSoft].


    Overlap Processing: Since each thread has its own context each can be separately
    dispatched and scheduled by the operating system kernel to execute on a processor.
    Therefore, a process can have one or more units overlap. For example, one thread
    could continue execution while another is blocked by an IO request or synchronization
    lock.


    Concurrent Execution: On a multiprocessor machine, a process can have threads
    execute concurrently on different processors. Thus, a computation can be made
    parallel to achieve speed over its counterpart. Communication: Sharing the same
    address space allows threads of the same process to easily communicate using shared
    memory.


    A sequential process can be made parallel by partitioning it among several threads
    and executing it on a multiprocessor. Since each thread of the process can execute
    independently, the operating system can schedule the threads on different processors
    and parallelism can be achieved. Thus, threads can be used on a multiprocessor
    machine to enhance the performance of constraint programming through parallelism.


    # 1.4. Past Parallel Research. Constraint programming having been an active area
    of research with several themes. One, constraint programming [SR], is based on
    the idea of having concurrent agents communicate through a shared set of variables
    and constraints. This research originated from concurrent logic programming and
    was generalized to constraint programming by [Maher] and Saraswat. Concurrent
    constraint programming has given rise to new languages such as cc(FD) [VSD] and
    Oz [HSW], in addition to formal specification through concurrent semantics [DRKP]
    [SRP] [MRS] [MR]. However, the focus of concurrent constraint programming has
    been on the expressiveness of modeling independent events, not application performance.
    Another theme of parallel programming has been increasing performance. Early research
    such as [LBD] [VanHen] [Atay] tried to increase application performance by hard
    coding parallelism in their respective tools. The benefit of this design is that
    the hard coding shields the application programmer from the complexities of parallelism.
    However, the abstraction comes at a cost. It does not allow the programmer to
