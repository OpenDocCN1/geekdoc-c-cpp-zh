    process is called propagation. Also, the variables and the values assigned to
    the variables are chosen by following what we call a variable-ordering. These
    orderings can be complex and dynamic. (That is, the next variable or value we
    try corresponds to the variable or value which satisfies a given criteria.)


    Constraint programming offers a wide range of predefined constraints. The predefined
    constraints greatly clarify the problem, problem representation, and the problem
    solution. Constraint programming also allows the definition of new constraints
    and the filtering algorithms associated with them. This is particularly useful
    to represent a particular statement of the problem.


    Usually, in constraint programming, a branch and bound algorithm is used to solve
    optimization problems. The solver we used performs a depth-first search and bound
    algorithm.


    We have used ILOG Solver 4.3 on Windows NT in all of our experiments. The computer
    we used is based on a Pentium Pro 200MHz.


    # 2. What is a good model in constraint programming?


    Obviously, a good model is one that leads to an efficient resolution of a given
    problem. However, we can give some basic ideas inside a good model. A good model
    deals with four important notions of constraint programming:


    +   - symmetries

    - implicit constraints

    - global constraints

    - pertinent and redundant constraints


    2.1. Symmetries. The complexity of a problem can often be reduced by detecting
    intrinsic symmetries. Parts of the search space can then be safely ignored. When
    two or more variables have identical characteristics, it is pointless to differentiate
    them artificially. Identical characteristics can be viewed as the satisfaction
    of the following:


    +   - the initial domains of these variables are identical

    - these variables are subject to the same constraints

    - the variables can be permuted without changing the statement of the problem


    In this case, there is really no point in examining all the possible solutions
    for variables and their values. In fact, the permutations give rise to sets of
    solutions'
