    Unlike constraint methods that derive information only from the constraint graph
    of a problem, the proposed search for global revisions also takes the extensions
    of the specified constraints into account. Hence, this method is able to deal
    with large arity constraints, e.g global constraints. Because of its declarative
    representation as a CSP, any search algorithm may be used to derive information
    on possible improvements from the abstraction.


    After presenting a small theory on local and global revisions, an efficient implementation
    for the local revision of the approx constraint is described as an example for
    the problem of declarative search control knowledge in constraint libraries. Finally,
    this section describes the kind of search for global revisions that has been used
    in our benchmark tests on nurse registering problems.


    # 4.1. A Small Theory on Local and Global Revisions. In order to reason about
    critical regions in an assignment to all variables, we require a formal description
    of regions by diff-tuples according to Fig. 10.


    DEFINITION 4.1. Let $A_0$ and $A_1$ be assignments to the variables in a set $X''$.
    Then $diff(A_0, A_1)$ denotes an assignment to the variables in $X''$ such that


    ```

    $x \in X'' : diff(A_0, A_1) \downarrow x = \begin{cases} 0 & \text{if } A_0 \downarrow=A_1
    \ 1 & \text{otherwise.} \end{cases}$

    ```


    Hence, $diff(A_0, A_1)$ is a 0/1-tuple which indicates variables with different
    assignments in $A_0$ and $A_1$. These diff-tuples are used to represent global
    revisions. In the following, $A''$ with an optional index denotes assignments
    representing revisions.


    DEFINITION 4.2. The set of global revisions for assignment $A_0$ respecting FCSPCP
    is defined as $\{diff(A_0, A_1) : V_P(A_0) > V_P(A_1)\}$.


    Consequently, each diff-tuple that is a global revision indicates an improvement
    in the quality of assignment $A_0$.


    The information that we derive global revisions comes from an abstraction of the
    constraints in the original problem — the sets of revisions.


    DEFINITION 4.3. Let $A_0$ be an assignment of values from $D$ to the variables
    in $X$ and $c$ be a constraint in the original problem. The degree of constraint
    violation


    ```

    $\varphi_c^{A_0}(A'') = \min(\varphi_c(A_1) \mid A_0 \downarrow var_c, A_1) =
    A''$

    ```


    is called to represent a fuzzy set of local revisions for $A$ representing $c$.'
