    # 2.1. The Constraint Formalism.


    Constraint satisfaction problems concern the assignment of values to variables
    satisfying a number of constraints. If all assignments to the variables violate
    some of the constraints, the problem is called to over-constrained. Many nurse
    rostering problems are over-constrained: Hence, the goal of a rostering system
    is to find a roster that only violates the least important constraints. As a consequence,
    the problem specification has to define the relative importance of constraints.
    This may be done introducing a preference ordering > on sets of constraints [Mey97b,
    Mew98] where the relation C'' > C'''' between two sets of constraints C'' and
    C'''' indicates that C'' is more important than C''. A solution to such problem
    violates a set of constraints that is as small as possible according to the preference
    ordering. The following definition of a partial constraint satisfaction problem
    (PCSP) reflects this.


    DEFINITION 2.1. A PCSP is a tuple P = <X, D, C, var, ϕ> where X is a set of indices
    representing variables, D is a set of values which can be assigned to the variables,
    and C is a set of indices representing constraints. var_c ⊆ X for each constraint
    c ∈ C the set of local variables. The degree ϕ_c of violating constraint c defines
    whether an assignment A to all local variables var_c satisfies or violates the
    constraint. ϕ_c(A) = 0 means that A satisfies constraint c. ϕ_c(A) = 1 indicates
    that A violates the constraint. Finally, > defines a partial ordering on sets
    of constraints with C'' > C'''' implies C'' > C'''' for each pair of constraint
    sets C'', C'''' ⊆ C.


