    **Variable Length Tasks.** When satellite-scheduling problems have tasks with
    variable duration, a satellite scheduling system must decide the durations for
    these tasks in addition to their start times and resource assignments. This complicates
    the scheduling problem because the scheduler must choose between scheduling more
    time for a task that has met its minimum duration and trying to schedule a different
    task. An example of a variable length task is:


