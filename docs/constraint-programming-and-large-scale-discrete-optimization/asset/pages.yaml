    # 3.1. Thread Safety.


    Multithreaded constraint programming places a restriction on the type of constraint
    programming tool that can be used for multithreaded applications. In order to
    write a multithreaded application using a given constraint programming tool, the
    tool must be thread-safe. A tool is said to be thread-safe when the provided functions
    may be called by more than one thread at a time without requiring any other action
    on the caller''s part. The issue of thread-safety arises from the use of shared
    resources among threads, the most common being shared memory. Since the threads
    of the same process can access the same memory locations, the use of shared data
    poses a threat to data integrity, the implementers of CP tools must ensure that
    data integrity is preserved under concurrent execution. There are two basic solutions
    for providing thread-safe functions. The first method is not to use global data,
    instead require data to be passed as arguments to the provided functions. The
    other method is to use global data in conjunction with synchronization variables
    to protect the integrity of the data. A detailed discussion of this can be found
    in [Muller], where 2PL was made thread-safe by using a combination of methods.


    Implementers of CP tools can go further than thread-safety. There is a notion
    of multithreaded-safety or MT-safety as provided by some of the standard C and
    C++ libraries. MT-safety expands on thread-safety by supporting a "reasonable"
    level of concurrency. An example of an MT-safe function is Solaris malloc; it
    allows multiple threads to acquire memory concurrently with very little blocking.
    Many commercial tools such as the ILOG Optimization Suite provide a thread-safe'
