  md: '# A Constraint Programming Pre-processor for a Bus Driver Scheduling System


    Barbara M. Smith, Colin J. Layfield, and Anthony Wren


    ABSTRACT. In urban bus operations, scheduling the drivers is the next stage after
    allocating buses to the timetabled journeys to produce a set of bus workers. Driver
    scheduling involves constructing a set of shifts that every bus is assigned a
    driver; the number of shifts is minimized; and each shift obeys the agreed rules
    on matters such as driving time, minimum break, and so on. The driver scheduling
    problem can be modeled using integer linear programming, as a set covering problem.
    TRACS II is a bus and driver scheduling system using this approach which has been
    developed at the University of Leeds; earlier systems from which it has been developed
    in use in the U.K. bus industry since 1984. A very large number of possible shifts
    (currently to 100000) are generated, and a subset covering all the work is selected
    to form the driver schedule. The set covering approach has proved to be easily
    adaptable to widely different conditions and produces very good results.


    The complexity of the covering problem depends to a large extent on the number
    of relief opportunities the bus schedule. A relief opportunity occurs when a bus
    is scheduled to a point where the driver can hand over the bus to another driver.
    The more relief opportunities, the pieces of work to be covered, and the more
    possible shifts can be generated; the more constraints and variables are there
    in the set covering problem.


    The aim of the work described here is to use constraint programming for TRACS
    II. A subset of the relief opportunities is selected, and the shifts generated
    in TRACS II can use only these opportunities to change drivers. A good selection
    of relief opportunities will drastically reduce the size of the subset covering
    problem while preserving the quality of its solution.


    The selection is done using constraint programming to find several possible ways
    of covering the morning part of the bus schedule; a random element ensures that
    different ways of covering the work are explored on each run. The relief opportunities
    used to change drivers in any of the partial schedules are passed to TRACS II,
    which can then change drivers at one of these opportunities. Otherwise, TRACS
    II runs in the normal mode. Reducing the number of relief opportunities in this
    way reduces the total time taken to produce a schedule by more than 75% in some
    cases. The schedules produced have the same number of shifts as those generated
    from the full set of relief opportunities, and the cost of the schedules is increased
    slightly, if at all.


    > 1991 Mathematics Subject Classification. 68T20 68T35; Secondary 90B35 90B50.
    This work is supported by EPSRC grant/K79024.'
