    into a scheduling problem may require as much effort and attention as the scheduler.


    In the future, we will continue to investigate different methods for modeling
    the satellite scheduling problem domain. We are actively developing and evaluating
    different methods. We also plan to continue exploring the peculiarities of satellite
    scheduling through a more formal analysis of the problem domain. Finally, we are
    developing a set of test problems and objectives to support empirical studies.


