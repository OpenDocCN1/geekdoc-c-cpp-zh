  md: '# NURSE ROSTERING CONSTRAINT SATISFACTION


    # 5. Conclusion


    This paper introduced into lessons that we have learned from developing a commercial
    nurse rostering system ORBIS · Dienstplan, where the scheduling problem is represented
    as a HCSP. This system applies a local algorithm that divides the improvement
    step into two stages:


    +   (1) Detect a region (set of variables) in the current solution to optimize
    the labels.

    (2) Optimize the labels in that region by an exhaustive optimization algorithm.


    A similar division of the improvement step occurs e.g. in LDS [HG95], the EFLOOP
    algorithm [YOH94], and the Russian Doll algorithm [VLS96]. LDS may be seen as
    a search by iterative improvement that enumerates all regions by size. The EFLOOP
    algorithm uses information from the constraint graph to guide the search for the
    region. However, scheduling problems — especially in nurse rostering — often contain
    constraints of large arity. On these problems, the constraint graph cannot provide
    useful information without considering the extension of the constraints. The Russian
    Doll algorithm uses a hard wired strategy for exploring regions in a constraint
    problem. It starts with one of the smallest regions in the problem and continues
    with one of the smallest overlapping regions until the whole problem is concerned.
    This procedure enumerates overlapping regions in a fixed order to exploit search
    results derived from the smaller regions to searching the larger region. However,
    this algorithm is obviously hardly applicable to large optimization problems.


    ORBIS · Dienstplan uses application heuristics to detect critical regions in a
    given schedule that takes knowledge on the complete model of nurse rostering into
    account [997a]. These heuristics turned out to be effective and robust enough
    to enable the installation of this system to several hospitals without changes
    in the search algorithm.


    Certain deficiencies of the current system motivated the original contributions
    of this paper. Fuzzy constraints have been introduced into the HCSP-formalism
    to attack certain optimization tasks within nurse rostering problems. In contrast
    to well known approaches to fuzzy constraints [DFP93, DFP94, Gue94], the resulting
    formalism intends to enable the representation of cardinality, costs, and balances
    rather than extending the applicability of consistency processing techniques.
    Consequently, combining the membership of fuzzy constraints is not restricted
    to idempotent combinators like min and max. The proposed formalism may be used
    to reach cumulative costs.


    The second lesson concerns the detection of critical regions in a schedule. The
    paper presented a small theory on the abstraction of a constraint problems that
    enables the detection of critical regions in a preliminary solution. This abstraction
    method has been lifted from concerning only crisp constraints [998] to the case
    of fuzzy constraints. The nurse rostering example'
