  md: '# LSCO:A METHODOLOGICAL VIEWPOINT


    CHIC-2 guidelines for program testing. The main concerns when testing LSCO programs
    are correctness, robustness and efficiency of the program. However, from an application
    point of view, we also need to evaluate the program significance with respect
    to the client requirements. We propose a set of testing guidelines, which essentially
    consist of:


    +   - Two forms of test (well-defined versus prospective projects). For well-defined
    projects, use real input data and compare the produced results with the customer''s
    outputs. For prospective projects, provide solutions to the customer to be evaluated
    on the user site.

    - Two approaches for one LSCO. In practice it has been shown useful to consider
    two different implementations for an LSCO. The two approaches can differ in their
    models and in the techniques used to build the algorithms. We strongly encourage
    the use of different paradigms. This allows the LSCO team to test the correctness
    of the design model with respect to the problem definition, and possibly identify
    errors that lie in the formulation of the problem (which have not been identified
    in the design activity). Even though this can be consuming (in the short term),
    in the end it ensures that the problem definition and the design models are coherent
    with each other; and at the same time that quality solutions are produced. Two
    members of the LSCO team can carry parallel implementations.


    +   - An evaluation of solution quality. The degree of optimality may not be the
    main concern in some LSCO applications. The customer is also interested in the
    CPU time, and the memory usage. So it is important to measure the average performance
    considering all criteria and check the customer''s preferences.


    Examples of multiple approaches for one LSCO such as inventory management and
    the energy trading applications can be found respectively in [RKCP97, CK98] and
    [Ger97, GCM99], as well as in the user guide.


    CHIC-2 guidelines for program debugging: Overview. If the testing procedure fails,
    the programs need to be debug requiring some revisions of the model and algorithm.
    Of course, many iterations between test and debug can occur and one should be
    ready to change the code significantly. We provide a set of "tools and tricks"
    to debug LSCO programs independently of the programming/modelling language at
    hand. Examples of tricks are:


    +   - The importance of using a graphical visualization of the searching process
    and the outputs. This can facilitate the reading of the results, help in understanding
    what went wrong, and also discuss with the customer and identify core errors.
    Many CP languages such as OZ Explorer, provide means to visualize the search space.

    - To use scaled down examples, in order to analyze by hand the results in the
    middle of the search

    - To instrument the program to trace the key points.


    More detailed guidance on each aspect can be found on the browser.


    # 7. Conclusion and future work


    In this article we have presented an overview of the CHIC-2 methodology. The work
    focused on identifying and tackling the specific aspects of LSCO projects from'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# CARMEN GERVET


    a multi-paradigm and engineering approach. We have proposed dedicated means to
    deal with the computational difficulty, complex technology and risky nature of
    LSCO projects. These include in particular:


    +   1. Risk driven processes as part of the development model to develop LSCO
    solutions in a real world environment.

    2. A tripartite structure for each development activity which includes a local
    validation of the outcomes (documents, programs)

    3. A conceptual model as part of problem definition

    4. A multi-paradigm approach in the design and programming activities


    Any work on methodology is an ongoing work. However, we believe this constitutes
    a first step towards a generic approach for tackling LSCO applications that reduces
    the risks encountered in such projects, and the level of expertise required. The
    methodology is used by all partners of the CHIC-2 consortium. The user guide is
    publicly available at http://www.ipcar.ic.ac.uk/chic2/


