    depend on the objective function and the impact of the choice on other tasks in
    the schedule.


    There are other resources, and constraints that are peculiar to satellite scheduling
    and that impact the complexity of the underlying scheduling problem. The examples
    presented in this paper are not exhaustive; rather they are intended to be an
    introduction to the satellite-scheduling problem domain.'
