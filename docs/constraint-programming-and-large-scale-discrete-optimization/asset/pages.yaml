  md: '# Project management


    Project management is essentially about people and processes. Due to the computational
    complexity of LSCO projects, there are often two levels of project management:
    1) one for the solo LSCO component, 2) and one for the global software development
    (including the engineering of the database and GUI work). The second one comprises
    standard software engineering issues is not specific to our concerns and will
    not be addressed here. The management we address in this article are: LSCO team
    structure; development model and risk management.


    # 4.1. LSCO team structure. The LSCO team is responsible for the development of
    the LSCO component. Its size depends obviously on the dimensions of the project.
    However, since the building of the LSCO component does not require many parallel
    tasks or heterogeneous skills, the LSCO team is preferably small. Experience has
    shown that there are some key structural factors to the construction of a good
    LSCO team. Figure 1 recalls the main ones [Ger98]. Others can be found in [Bro95],
    where Broooks discusses the building of teams for IT projects.


    | I | The team is small (3-4 people) |

    |---|---|

    | II | A chief designer handles the development | The chief designer is the main
    architect who is an expert in LSCO algorithms and models, but most of all is glue
    among the different developers. He listens to his colleagues and involves them
    in his decisions. He continues to the development |

    | III | A manager is the interface between the development team and the customer
    | The manager also knows about the technology but essentially he has the business
    knowledge to tackle projects and deal with the customer (contracts, deadlines,
    ...). |

    | IV | One or two developers who work very closely with the chief designer | The
    developers need to have a good degree of knowledge is the optimization paradigms
    and preferably some domain knowledge in the problem at hand |


    FIGURE 1. LSCO Team Structure


    Note that when there is not much need for parallel actions, the smaller the team,
    the less likely are the risks of misunderstandings and bad communication. For
    the same reasons, it is important to minimize the number of interfaces between
    the LSCO team and the customer team (including the end-users), since they would
    already tend to use "working languages" making comprehension more difficult (application
    domain language versus technical language).


    4.2. Development model. A development model or lifecycle structures the life of
    a project in terms of high levels. Each stage is built towards the completion
    of well-defined objectives that measure the degree of advancement in terms of
    milestones (contractual agreements with the property owner), and deliverables
    (e.g. written documents, prototypes, software). General IT project lifecycles
    broadly follow two models: the waterfall or the spiral model [Boe88]. The waterfall'
  merge: -1
