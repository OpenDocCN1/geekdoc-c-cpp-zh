    HSPs are related to lexicographic CSPs as they have been introduced by Schiez
    [BFM*96, SFV95]. In contrast to lexicographic CSPs, the CSP framework allows two
    constraints to the same hierarchy level but different weights. Our practical experience
    showed that this property is useful to distinguish the categorical and the gradual
    aspect of a constraint''s importance.


    Although the definition of HSPs presented here does not seem to be easily understandable,
