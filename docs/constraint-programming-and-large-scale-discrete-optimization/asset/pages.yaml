  md: '[AK89, Dav87, OvG89] and Tabu Search [Glo89, Glo90, GL97] have been proposed.


    # 3.2. Example of hill-climbing: the travelling salesman problem.

    t travelling salesman problem (TSP) is a well-known optimisation problem. Given
    a number of cities and the distances between them, the task is to find a tour
    (i.e. closed path) which visits each city exactly once and it is of minimum length.


    One way to hill-climb on a TSP with n cities is to represent a candidate solution
    by a sequence of n variables where i represents the i-th city to be visited in
    the tour. For example, a tour through 10 cities may:


    ```

    1 4 5 8 2 7 6 9 3 10

    ```


    The objective function is the total distance travelled in a given tour. One simple
    but reasonably effective neighbourhood function is defined by the 2-Opt move [Joh90].
    Effectively what the 2-Opt move does is to pick a sub-sequence and reverse the
    order of the cities. For example by applying 2-Opt between the 4th to 8th city
    in the above tour, the result will be:


    ```

    1 4 5 9 6 7 2 8 3 10

    ```


    In other words, the sub-sequence 8-2-7-6-9 is reversed. This qualifies to be accepted
    by hill-climbing if the total travelling distance incurred is shorter than in
    the previous tour. When neighbours are ''better'' than the previous tour, one
    may choose a random one. Alternatively, heuristics may be applied to select among
    the qualified neighbours. For example the steepest descent heuristic will select
    the neighbour that incurs the least travelling distance


    # 4. Fast Local Search (FLS)


    One factor, which limits the efficiency of a hill-climbing algorithm, is the size
    of the neighbourhood. If there are many neighbours to consider, then if the search
    takes many steps to reach a local optimum, and/or each evaluation of the objective
    function requires a nontrivial amount of computation, then the search could be
    costly. [Ben92] presented the approximate 2-Opt move to reduce the neighbourhood
    size of 2-Opt in TSP. We generalised this to a method that we call Fast Local
    Search (FLS). The intention is to use heuristics that enable hill-climbing to
    ignore neighbours that are unlikely to lead to fruitful-climbing in order to improve
    the efficiency of the search.


    Here we use the TSP to demonstrate how FLS applies to the 2-Opt neighbourhood.
    An activation bit is associated with each city in the tour. All activation bits
    are switched on at the start of the search. Only cities with an activation bit
    will be examined to determine if an improvement can be made. When examining a
    city, we look for 2-Opts which remove one of the edges adjacent to this city.
    If no improving move is found, the city bis switched off. It will only be switched
    on under two conditions


    +   1 if a 2-Opt move makes in which results changing an edge adjacent to the
    city.


    +   2 if there is a feature that is penalised (to be explained when we introduce
    GLS later).'
