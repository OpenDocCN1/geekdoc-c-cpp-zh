    # 5. Related Work


    The work presented in this paper is based on the experience that we have gained
    while developing and applying GREAS Application Framework to satellite-scheduling
    programs over the last seven years. Our general approach is based on the constraint-based
    scheduling of Fox et al. (e.g., [FS90] and [CS95]). Since our scheduling framework
    is built on top of ILOG Solver [Ii08], we have directly benefited from their constraint
    propagation methods.


    Others have suggested different approaches to observation-scheduling methods.
    In particular, several researchers at NASA Research Center (e.g., [MPL90], [DBS94]
    and [BME97]) have investigated different methods for scheduling observations from
    both ground-based and space-based telescopes. The problem that they had differs
    from our problem in that they break up the scheduling problem by nights, and then
    to generate a nightly schedule that maximizes the overall quality over many days
    or weeks. They have developed a dynamic priority-weighting scheme that increases
    the chances that a missed task will be processed on subsequent nights.


    Verfallie et al. (BVAABB96], [LV97], [VLS96] and [SFV95]) have looked at the problem
    of scheduling imaging tasks for the Spot5 satellite. They present results that
    compare depth-first branch-and-bound and a variant Russian Doll Search to a greedy
    local and tabu search on satellite imaging problems. These problems are a special
    case of the general satellite scheduling problem described in this paper because
    the tasks have a fixed time start. This means that the scheduler simply to decide
    which tasks to schedule rather than when to schedule them. Although this reduces
    the problem space, finding optimal solutions is still NP-hard.


    We are sure that other approaches to satellite scheduling exist, although the
    presentation of this work is very limited by the proprietary nature of the satellite
    industry.


    # 6. Summary and Future Work


    We have presented the satellite mission operations scheduling problem and discussed
    some problem features that are particular to satellite scheduling. We also described
    our general approach to satellite scheduling and our methods for handling these
    satellite-specific problem features. Our initial efforts have been incorporated
    into our commercial satellite-scheduling tool (GREAS). We are currently developing
    metrics for measuring the relative performance of our models and search algorithms,
    and we are actively investigating new models and search techniques to improve
    the performance of our scheduler.


    In general, the satellite scheduling problem definition depends heavily on how
    the mission operations are modeled. A high fidelity model will produce many tasks
    to schedule whereas a low fidelity model may require constraints that are more'
