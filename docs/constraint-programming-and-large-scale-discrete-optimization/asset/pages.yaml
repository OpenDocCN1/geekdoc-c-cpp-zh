  md: '# Large Scale Combinatorial Optimization:

    A Methodological Viewpoint


    Carmen GERVET


    In this article, the author describes the results of a collaborative European
    project work with partners from Bouygues, Euro-Decision, ICL, IC-Par, NTUA, and
    Renault.


    ABSTRACT. The industrial and commercial worlds are increasingly competitive, requiring
    companies to be more productive and responsive to market changes (e.g. globalisation
    and privatisation). As a consequence, there is a strong need for solutions to
    large scale optimization problems, in domains such as production scheduling, transport,
    finance and network management. This means that more experts in constraint programming
    and optimization technology are required to develop adequate software. Given the
    computational complexity of Large Scale Combinatorial Optimization problems, a
    key question is how to help/guide the tackling of LSCO problems in industry. Optimization
    technology central to the Operational Research community, has evolved and reached
    a level of maturity. Emerging in the 50s with new paradigms such as constraint
    programming and stochastic search techniques. There is a practical need, i.e.
    efficiency, scalability and tractability, to integrate techniques from the different
    paradigms. This adds complexity to the design of LSCO models and solutions.


    Various forms of guidance are available in the literature therein (1) case studies
    that may power tools to solve instances, and (2) visualization and programming
    tools that enable the modelling and solving of LSCOs. However, there is little
    guidance to address the process of building applications for new LSCO problems
    (independent of any language). This article gives an overview of the CHIC-2 methodology
    which aims at filling a gap in this direction. In particular, we describe some
    management issues specific to LSCOs such as risk management and team structures,
    and focus on the technical development guidance for scoping, designing and implementing
    LSCO applications. The design part in particular views the modelling of LSCOs
    from a multi-paradigm perspective.


    # 1. Background and motivation


    1.1. Introduction. The original work on methodology has been motivated by the
    growing use of the constraint programming technology to develop applications for
    real world combinatorial problems like car sequencing, timetabling,


    > 1991 Mathematics Subject Classification. Primary 90C27 65K10; Secondary 68T20.
    This work has been supported by the CEC in the ESPRIT project 22165, Creating
    Building solution in Industry and Commerce (CHIC-2). The authors wish to thank
    the anonymous reviewers for their helpful reviews, and Richard Wallace for his
    detailed and most valuable comments.'
