    generally preferred sequences of shifts — but not to control the deployment of
    nurses in certain shift types.


    Each of the diagrams presents an average on 10 problems that differed according
    some randomly chosen parameters: Deviation in working time accounts and demanded
    crew attendance, etc. The sample runs considered a 6-shifts model with one early
    shift, one late shift, one night shift and three day-turns (T1, T2, T2) where
    T1 demands 10 hours of working time and a T2 and a T3 cover exactly the same period
    of time than T1.


    The diagrams of Fig. 14 present the decrease in the importance of constraint violations.
    Since the constraint model of rostering constraint hierarchies, violations have
    been converted into a real number in such a way that w in hierarchy level i turns
    into a number (1 + w). wi+1 is the sum of weights in level i + 1. The natural
    order of these numbers is isomorphic to > over the converted constraints violations.


    Compared to the commercial system, both algorithms require a long time to achieve
    a first improvement. This is because in the tests of Fig. 14, both algorithms
