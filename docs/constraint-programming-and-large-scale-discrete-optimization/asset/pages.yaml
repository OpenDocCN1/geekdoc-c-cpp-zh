    # 3. Minimization of the number of breaks


    In such problem we are given $n$ teams and $n-1$ periods, and for each period

    each team has to play a home or an away game against another team, such

    that every team plays every other team exactly once during all the periods. A

    break for a team is defined to be two consecutive home matches or two consecutive

    away matches.


    # 3.1. A first model. From the definition of the problem some variables are\defined:


    +   - For each period, each team has to play a game against another team.

    So, for team $i$, $n-1$ variables are defined. $O_{ij}$ are the variables corre-

    spponding to the position of team $i$ at period $j$. Then $O_{ij} = k$ means

    that team $i$ plays team $k$ in period $j$. (This is the $j^{th}$ match of team
    $i$).

    Initially, the domain of any variable $O_{ij}$ contains all the teams of $i$).

    These variables are called placed variables


    +   - For each team, each team has to play a home or an away game.

    For each team $i$ and for each period $j$ a 0-1 variable $P_{ij}$ is defined.

    By convention, 0 corresponds to an away game and 1 to a home game.

    PP_{ij} = 0$ means team $i$ will have an away game during period $j$.

    These variables are called placed variables


    +   - A break for a team is defined to be two consecutive home matches or two

    consecutive away matches.

    For each team and for each consecutive periods, a 0-1 variable

    B_{ij} is defined. $B_{ij} = 1$ means team $i$ has a break involving the

    games played during periods $j$ and $j+1$. These variables are called break

    variables. For each team there are $n-2$ break variables. A break due

    to the presence of two consecutive home games is called a home break.

    A break due to the presence of two consecutive away games is called an

    away break.


    The objective, that is, the variable to minimize, is $\#B$. This is the

    variable that counts the total number of breaks for the schedule.


    The constraints of the problem can be represented as follows:


    +   - Every team plays every other team exactly once during all the periods.

    For each team $i$, an alldiff constraint involving the $O_{ij}$ variables for
    $j

    = 1,\dots,n$ is defined.'
