  md: '# CHRISTOS VOUDROIS AND EDWARD TSANG


    In the general case, FLS works in the following way. A large neighbourhood is
    broken down into a number of small sub-neighbourhoods. In the example above, each
    sub-neighbourhood was defined by the set of possible 2-Opts which remove one of
    the edges adjacent to a city. An activation is attached to each of the sub-neighbourhoods.
    In the beginning of the search, all sub-neighbourhoods are active. If a sub-neighbourhood
    is examined and does not contain any improving move found it activates. Otherwise,
    it remains active and the move is performed. Depending on the move performed,
    a number of other sub-neighbourhoods are also activated. In particular, we activate
    all the sub-neighbourhoods where we expect other improving moves to appear as
    a result of the changes made by the move just performed. As the solution improves
    the proceeds with fewer and fewer sub-neighbourhoods being active until all the
    sub-neighbourhood bits turn to 0.


    The overall procedure could be many times faster than conventional search. The
    setting/clearing scheme encourages chains of moves that improve specific parts
    of the overall solution. As the solution becomes better the process is scaling
    down, examining fewer moves and saving enormous amounts of time, which would otherwise
    be spent, on examining bad moves.


    The danger of ignoring certain neighbours is that improvements may be missed.
    The hope is that the gain out-weighs the loss. We found that FLS combined extremely
    with GLS.


    # 5. Guided Local Search (GLS)


    Guided local search (GLS) is a meta-heuristic algorithm that enables (like simulated
    annealing and tabu search) hill-climbing to escape local optima [V97]. The basic
    idea is to augment the objective function with penalties, which directs search
    away from local optima. GLS was built upon our experience in a connectionist method
    called GENET (for "Generic Network" [WT91, TW92, DTWZ94]) as well as penalty and
    search theory ideas from Operations Research [Koo57, Stoa83, Lue84]. In the following,
    we present the basic GLS algorithm for the minimization case but it is not difficult
    to see how it can be applied to maximisation problems too.


    GLS is an algorithm for modifying the behaviour of local search. To apply one,
    has to define features for the candidate solutions. For example, in the travelling
    salesman problem, a feature could be "whether the candidate travels immediately
    from city A to B" (i.e. edge).


    GLS associates to each feature a cost and penalty parameter. The costs normally
    take their values from the objective function. For example, in the salesman problem,
    the cost of the above feature is the distance between cities A and B (i.e. edge
    length). The penalties are initialized to 0 and will only be increased when local
    search reaches a local minimum. This will be elaborated below.


    ```

    h(s) = g(s) + \lambda \sum(p_i \cdot I_i(s))

    ```


    where s is a candidate solution, \lambda is a parameter to the GLS algorithm,
    i ranges over the features, p_i is the penalty for feature i (all p_i are initialized
    to 0) and I_i'
  merge: -1
  pgno: 43
