  md: "# 4.3. Enumeration of Global Revisions.\n\nThe basic idea for applying these\
    \ results is to search the original problem by algorithm iterative-improvement\
    \ according to Fig. 4 controlled by a search of the abstraction. Therefore, iterative-improvement\
    \ calls a function critical-region that computes the set of variables describing\
    \ the next step of repair. Algorithm iterative-improvement exits if this set is\
    \ empty.\n\nOn smaller problems, the abstraction can be searched by a slightly\
    \ modified variant of the B&B that terminates search after finding a solution\
    \ better than a certain demand $\beta$ and is able to restart search at the particular\
    \ branch of the search tree that has been visited on the previous termination\
    \ on demand. This algorithm is used by a version of critical-region like the following:\n\
    \n+   1. A new abstraction has to be used either find-critical-region is called\
    \ for the first time or the previous step of repair has been successful, i.e.\
    \ a new preliminary solution has been found.\n2. Use the modified B&B to restart\
    \ search of the abstraction for the next assignment $A'$ with $v_P(A') > v_P(A)\
    \ \\dots$ \n3. In this case, build a new constraint problem representing the abstraction\
    \ and add some constraints to control the search. For instance, to improve small\
    \ critical regions before larger ones like LDS as a hard constraint that requires\
    \ the number of ones in solutions to the abstraction to be equal to 1.\n4. The\
    \ next repair step considers only the variables that have been labeled with a\
    \ one in the abstraction. Consequently, bounds on the number of ones in the abstraction\
    \ are also bounds on the size of the region that is searched by the next improvement\
    \ step.\n5. Use the modified B&B to restart search of the abstraction for the\
    \ next assignment $A'$ with $v_P(A') > v_P(A')$. Hence, the modified B&B runs\
    \ with demand $\beta - v_P(A')$.\n6. If this search succeeded with a solution\
    \ $A'$ then return the set of all indices for variables that $A'$ labels with\
    \ 1 and terminate.\n7. If the search has not returned a solution\n* Increase the\
    \ size of the critical regions to look for if possible by a relaxation of the\
    \ hard constraint on the number of ones in a solution to the abstraction or go\
    \ to 2.\n* If this procedure has already searched for a critical region comprising\
    \ the whole problem then return an empty set and terminate.\n\nThis technique\
    \ called enumeration of global revisions (EGR) is guaranteed to terminate and\
    \ can prove the optimality of a returned solution [Me97b, May98]. Combined with\
    \ iterative-improvement as described in Fig. 4, this procedure implements LDS-like\
    \ search scheme where constraint propagation in the abstraction is used to skip\
    \ futile improvement steps and explore promising regions first. Users of the rostering\
    \ system are allowed to interrupt search at any time to modify the best found\
