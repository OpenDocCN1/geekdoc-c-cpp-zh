  md: '# LSCO-A: METHODOLOGICAL VIEWPOINT


    model tends to show the evolution of a project from a contractual point by a sequence
    of stages, while the spiral model is more driven by iterative processes usually
    used for complex and ill-defined decision problems. Each has its strengths and
    weaknesses [PL90]. The waterfall approach is a rather formal method broadly used
    among business developers while the spiral approach is more popular among ADE
    specialists (Aerospace, Defense and Engineering). Whatever company development
    model is, our experience shows that it is crucial to introduce iterative development
    processes to control risks related to ill-defined problems, technical complexity,
    etc. A spiral model does not require much revisions to tackle LSCO applications,
    if one uses the common waterfall approach it should be adapted as follows. The
    idea is to use a two-phase approach which can be structured around 7 stages as
    shown in Figure 2: an exploration phase (stages 1/2/3), and an integration phase
    (stages 5/6/7).


    | LSCO Project Stages | Deliverables | Objectives |

    | :--- | :--- | :--- |


    ![](img/c20b6a5053a472f27c2d36f581c5c428_170_0.png)


    FIGURE 2. LSCO Project Lifecycle


    The exploration phase aims at ensuring technical feasibility by focusing on prospective
