    # 3. Fuzzy Constraints in the Nurse Scheduling Domain


    In section 2.2, we identified opportunities to improve the currently constraint
    model by the introduction of fuzzy constraints. In contrast to crisp constraints,
    fuzzy constraints may be violated by a degree smaller than one but larger than
    zero. Hence, these constraints are mostly more or less violated. The well known
    approaches to fuzzy constraints [DFP93, DFP94, Gue94] consider only the maximal
    degree of constraint violation within a constraint problem. If a single constraint
    cannot be satisfied to a certain degree ϕ then satisfaction of other constraints
    to a degree better than ϕ becomes irrelevant (the so-called “drowning-effect”).
    Contrarily, we applied a different approach that considers fuzzy constraints as
    abbreviations of occasionally very crisp constraints in the HCSP framework.


    This section firstly presents the definition of fuzzy sets and fuzzy relations
    and introduces the framework of hierarchical fuzzy CSPs. The second part of this
    section is about searching HFCSPs by the algorithms presented in section 2.3.
    This part finally describes propagation of the fuzzy constraints that have been
    nested in section 2.2 to improve the constraint model for nurse rostering.


    # 3.1. Fuzzy Sets as Representation of Conflicts. Instead of distinguishing elements
    from non-elements, a fuzzy set S assigns a so-called membership μ to each of its
    elements.


    DEFINITION 3.1. Let D’ be a classical (crisp) set, then a fuzzy set D in D’ is
    defined by the ordered pair (μ, D’), where μD : D’ → [0;1] is called the membership
    function. It maps all values d  ∈ D’ to a membership degree μD(d). The membership
    of the union and the intersection of two fuzzy sets D<sub>1</sub> and D<sub>2</sub>
    in D'' are defined as


    ```

    μ_{D1}∪_{D2}(d) = max(μ_{D1}(d), μ_{D2}(d)),

    μ_{D1}∩_{D2}(d) = min(μ_{D1}(d), μ_{D2}(d)).

    ```


    Set inclusion is defined by D<sub>1</sub> ⊆ D<sub>2</sub> iff D<sub>1</sub> ∪
    D<sub>2</sub> = D<sub>2</sub>.'
