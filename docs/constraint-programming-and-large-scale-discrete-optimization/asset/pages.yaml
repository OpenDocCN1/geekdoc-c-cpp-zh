    # 4. Our Approach


    Our general approach to solving satellite-scheduling problems is to first create
    a model of the tasks, resources, events, and constraints, and then search for
    a solution using heuristic-search with constraint propagation. We have implemented
    a system called GREAS (Generic Resource, Event, and Activity Scheduler [Pac97]),
    based on this general approach.


    The modeling step involves translating the satellite-scheduling problem into a
