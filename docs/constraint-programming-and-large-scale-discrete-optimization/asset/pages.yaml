  md: '# 30 CHRISTODS VOOUARD AND EDWARD TSANG


    where Z is a finite set of variables: D is a function that maps every x in Z to
    a set of objects (any type), which is called the domain of x. Most research in
    constraint satisfaction deals with discrete and finite domains. Z is a set of
    constraints, which may take any form, which restricts the variables that may take
    simultaneously. The task is to assign one value to each variable satisfying all
    the constraints [Tsa93]. Constraint satisfaction is a general problem, which has
    been applied to a wide variety of domains [FM94, Wal98].


    In many constraint satisfaction problems, some solutions are "better" than others,
    where "better" is defined by some domain-dependent objective function. The task
    in such problems is to find the optimal (minimum or maximum) solution. In other
    problems, constraints are classified as hard and soft constraints. Hard constraints
    are not to be violated in any case. Soft constraints can be violated at certain
    costs, assigning different values to variables may result in different utilities.
    The task is to minimise the cost of soft constraints or maximise the utility of
    assignments while satisfying all the hard constraints. Finite constraint satisfaction
    problems are basically discrete optimisation problems traditionally studied in
    Operations Research. There has been cross-fertilisation between the two fields.
    The work described in this paper started from constraint satisfaction and benefited
    from ideas in Operations Research.


    # 3. Background: Hill-climbing


    3.1. Basic Principles of Hill-climbing. Due to its combinatorial nature, many
    real life constraint optimisation problems are hard to solve using complete methods
    as branch & bound [LW66, Hai71, RND77]. One way to combine the combinatorial optimisation
    problem is to sacrifice completeness. Some of the best methods that use this strategy
    are local search methods, the basic form of which is referred to as hill-climbing.


    To perform hill-climbing, one must define the following:


    +   (a) a representation for candidate solutions;

    (b) an objective function: given any candidate solution, this returns a numerical
    value. The problem is seen as an optimisation problem according to this objective
    function (which is to be minimised or maximised);

    (c) a neighbourhood function which maps every solution x (often called a state)
    to a set of other solutions (which are called neighbours of x). In other words,
    the domain of the neighbourhood function is the set of all candidate solutions,
    S. Its range is the power of S.


    Hill-climbing works as follows: starting from a candidate solution, which may
    be randomly or heuristically generated, the search moves to a neighbour which
    is better according to the objective function (in a minimisation problem, a better
    neighbour is one which is mapped to a lower value by the objective function).
    The search terminates if no better neighbour can be found, or resources run out
    (e.g. limited time budget). The whole process can be repeated from different starting
    points.


    One of the main problems with hill-climbing is that it may settle in local optima
    - solutions that are better than all their neighbours but not necessarily the
    best for the problem. To overcome this, methods such as Simulated Annealing'
  merge: -1
  pgno: 41
