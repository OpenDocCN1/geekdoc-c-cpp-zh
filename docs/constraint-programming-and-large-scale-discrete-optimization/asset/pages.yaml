    # 4. Global Search Control


    As described above, global constraints have integrated heuristics to enable them
    to choose a successor state on their own. On top of the constraints, there must
    be a mechanism that combines the constraints'' cost contributions to the overall
    cost function and a regulation determining which constraint is allowed to select
    the successor state for a current iteration. This is the job of the global search
    control. The components'' interplay is outlined in Figure 2.


    ![](img/c20b6a5053a472f27c2d36f581c5c428_25_0.png)


    FIGURE 2. Local Search with Global Constraints


    The global search control serves as a general manager, where variables and constraints
    can dock on and off in a plug-and-play manner. This provides a simple mechanism
    for tackling problems with dynamic changes. For an addition of a new variable,
    the variable to be added must already be instantiated. For an addition of a constraint,
    the constraint''s inclusion of a variable must be announced to the variable to
    allow the constraint''s updating in the case of value changes.'
