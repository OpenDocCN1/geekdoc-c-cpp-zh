  md: '# 6.2. Random Walks


    Random walks are random moves in the search space that disregard the change of
    the cost function value. The idea is that the search is retracted from hopeless
    situations (like local minima) from time to time. Unlike restarts, random walks
    remain within the area of the current state.


    Random walks can be included by introducing a second improvement heuristic for
    each constraint that makes a random variation of a random variable. Figure 13
    shows the results for different probabilities for the random variation heuristics
    to be chosen. It is obvious that random walks generally cause a deterioration
    in the results. At points there is a cross-over: the more random walks, the more
    inconsistency.


    ![](img/c20b6a5053a472f27c2d36f581c5c428_35_0.png)


    FIGURE 13. Random Walks


    # 6.3. Tabu Lists.


    Figure 14 shows experiments using a tabu list for the global search control''s
    constraint selection (based on tabu search [Glo89]). Each selected constraint
    is stored in a first-in-first-out list and blocked for another selection as long
    as it is a member of the list.


    Applying tabu lists proves absolutely pointless. Even for the nonrandomized NgNmNt
    version, it makes no difference (results for other randomization variants are
    similar).


    # 7. Extending the Constraints


    The constraints'' improvement heuristics can be created in various ways. The effect
    of heuristics with stronger domain knowledge and the inclusion of more ag-heuristics
    are studied in the following subsections.


    # 7.1. More Knowledge.


    The experiments in Section 6 showed that the ARC''s heuristic is not very powerful.
    It would seem advisable to consider other heuristics. For example, tasks should
    obviously be packed tightly on a machine. The following ARC-H2 heuristic supports
    this feature. ARC-H2 is very similar to ARC-H1, it makes the selection of the
    second interval in a different way: for the new position of the task, only two
    shifts are possible, the task either at the beginning of the task''s predecessor
    interval or ending at the end of the task''s successor interval. The interval
    with less tasks is chosen.'
