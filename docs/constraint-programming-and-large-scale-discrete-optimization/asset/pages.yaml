  md: '# 2. Optimization technologies


    2.1. The Constraint Programming paradigm. The Constraint Programming (CP) paradigm
    emerged from the Artificial Intelligence field to extend logic languages to deal
    with combinatorial search problems modelled as Constraint Satisfaction Problems
    (CSPs) [Mac77]. Typical examples are scheduling, warehouse location, disjunctive
    scheduling and cutting stock problems. This was initially achieved by embedding
    and integrating the CSP model and consistency techniques [Mon74, MF85] into the
    logic programming [Kow74, CKC83] (the chip system [vH87, Dsea88)). Today, the
    logic component of such languages is understood in the sense of allowing declarative
    statements of nondeterministic programs, where the modelling of the problem is
    meant to be independent of optimization problems, search procedures have been
    introduced in CP languages and hybridized with propagation techniques (e.g. the
    branch and bound algorithm and its variants [GM84]).


    The success of CP in the late 80s prompted the development of new CP languages,
    but also raised the question of its limitations. When addressing LSCOS, scaling
    and efficiency, scalability and tractability. It appeared clearly that constraint
    propagation coupled with variants of the branch and bound was not the “magic”
    answer to large scale problems. Components of LSCOS could be solved efficiently
    and optimally by special-purpose algorithms. Also, local methods were often found
    to reach sub-optimal but good quality solutions more quickly. Thus, there was
    a practical necessity to hybrid propagation methods with other constraint handling
    and search algorithms. Usually seen as a competitor, the OR field needs to enhance
    the CP framework are being fulfilled at the level of CP languages which provide
    new facilities:


    +   - High level languages (e.g. ECL/PS [IC-90], CLAIRE, CHIP)

    - Debugging features (e.g. PROLOG IV [BTV95])

    - Global constraints (e.g. CHIP[BC94], ILOG SCHEDULE [ILO97])

    - Search heuristics (e.g. CLAIRE)

    - Support for solver hybridization (e.g. ECL/PS).


    Research progress on solver hybridization has proved to improve the tackling of
    complex applications, in terms of efficiency, scalability and tractability. Intuitively,
    it tends to solve large and complex problems efficiently by exploiting LSCO structural
    features (i.e. using each solver when it is most appropriate).

    The number of hybrid solutions that can be found in the literature is growing
    [CL95, CL97, RW98, RWH99, ESW00] to name a few). Hybridization has allowed us
    to tackle new applications with improved quality of results. However, the extended
    set of modelling facilities and the availability of new solvers increase the expertise
    level required to tackle LSCO applications. We need to go through large manuals,
    learn about related paradigms, and most importantly open our minds to new forms
    of models for LSCO problems. Some research work is being carried out to better
    understand the role of problem formulation with respect to


    > Constraint Handling In Prolog. Hybridization is the process of integrating multiple
    solvers from different paradigms to build a single algorithm.'
