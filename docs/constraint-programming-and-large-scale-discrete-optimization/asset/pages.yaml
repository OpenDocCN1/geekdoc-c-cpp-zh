    # 1. Introduction


    Planning of urban bus operations involves several stages, starting with assessment
    of passenger demand, construction of the route (line) network, calculation of
    journey durations, decisions on vehicle types, determination of service frequencies,
    specification of departure times from terminal points, and allocation of vehicles
    to journeys. Many of these procedures are interdependent; for example, vehicle
    size, service frequency and departure times have to be determined so as allow
    efficient use of equipment and provided, while maintaining suitable service spacing
    between overlapping lines and sometimes provided good transfer opportunities.


    The result of the above processes is a bus schedule, which will specify the work
    to be covered by each vehicle of a day. Many different terms are used in different
    places for the scheduled work of a vehicle. We shall call the work of a vehicle
    between its leaving and returning to a depot a block. At the start of a block,
    the bus will normally run empty to the start point of its timet journey. There
    will then follow a sequence of scheduled journeys, which may be back and forth
    on a line, or may include changes of line. Sometimes a bus may be scheduled to
    run empty from the end point of one journey to the start point of the next. Specification
    of a block will normally identify the vehicle type to be assigned, the departure
    time from the depot, the departure and arrival points and times of each journey
    (and possibly intermediate points and times), and the return time to a depot.
    Every bus will be based at a particular depot, but sometimes, particularly when
    rural or interurban services are operated, buses may start and finish their work
    at different depots.


    Every block carries an identifying code, but this does not identify the vehicle
    to be assigned to the work on any particular day, which will depend on availability.
    When bus returns to the depot during the day (for example after the morning peak),
    the block will normally terminate at that stage; a different block identifier
    will be used for later starting, and the planner does not have to know whether
    the same vehicle will be used on two successive blocks.


    In some bus operations, the vehicle and the driver are scheduled together, as
    a single unit; when the driver comes to the end of the shift, for instance, or
    he drives the bus back to the depot and leaves it there. In most bus companies,
    however, the vehicles and drivers are scheduled separately, and this is the case
    considered. A vehicle may be in operation from the morning until late at night,
    whereas each driver may work for up to five hours without a break. This break
    is made by scheduling another driver to take over the bus whereas the incumbent
    driver has to leave to take a meal-break or finish his shift. In such circumstances,
    there might be theory advantages in planning the allocation of drivers concurrently
    with vehicle scheduling, but in practice the vehicle schedule is usually constructed
    and agreed in advance of driver scheduling. Further, the complexities of the scheduling
    processes are such that simultaneous scheduling of vehicles and drivers has only
    been possible in relatively simple, usually rural or interurban, situations. Normally
    drivers are restricted to vehicles from their home depot, so even if a bus scheduling
    process has tackled several depots simultaneously, these will be treated as...


    The vehicle schedule is the input to the driver scheduling process. Clearly, every
    bus must have a driver at all times when it is moving; usually it must have a
    driver while it is idle at a terminus. Drivers may be changed only at certain'
