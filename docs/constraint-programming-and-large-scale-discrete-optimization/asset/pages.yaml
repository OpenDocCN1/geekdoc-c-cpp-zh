    # 5. Risk management


    LSCO projects are risky because they are computationally difficult to solve and
    are not always well-defined (e.g. complex objective functions, hard and soft constraints,
    ill-defined data). Thus risk management plays a key role to minimize damages of
    project delays and failure. The objective is to reduce uncertainties by proactively-analyzing
    the risks and identifying counter measures to control them. There are three main
    categories of risks handled in project management methodologies:


    +   - Organizational (project planning, relations with the customer, political
    factors)

    - Financial (project cost and resource plan)

    - Technical (ill-defined problems, computational complexity, maturity of the technology).


    In this article we focus on the assessment and control of LSCO related risks which
    are essentially critical. Technical risks depend on two main factors: 1) the type
    of problem we are dealing with (e.g. well-defined versus ill-defined), 2) the
    complexity of the solution methods one intends to use. Depending on the degree
    of innovation of the project and the technology used, the level of risk will vary
    considerably. As an LSCO becomes increasingly complex (more innovative, less well-scoped)
    and the solution methods needed are less mature (e.g. new algorithms, hybrid methods),
    the level of risk grows.


    # 5.1. Risk driven processes. Each of the seven stages of the waterfall model
    described is commonly characterized by its objectives, inputs, outputs, internal
    processes and development activities. For complex projects like 3/4/5 the risk
    exposure can be high (e.g. ill-defined problems, technical decomposition required,
    efficiency requirements), we propose risk driven processes as a means of controlling
    the technical risks associated with the complex stages of ill-defined LSCO it
    comprises a set of technical activities (problem definition, design and programming),
    followed by a risk analysis and a decision making process. The analysis work evaluates
    the risks associated with the project. To help in the risk analysis, we propose
    a set of risk scenarios against which risks can be assessed and decisions can
    be made. A set of such scenarios is presented in the following section.


    The decision process can be either to go forward (risks reduced or minimized),
    or even to drop out of the project (to many unsolvable risks). One can drop out
    of an LSCO


    > A risk can be defined by 1) a degree of uncertainty regarding the occurrence
    of an event, 2) negative effect if the event takes place [HK98].'
