  md: '# ALEXANDER NAREYEK


    From a software engineering point of view, this is not a good idea. Integrating
    complex, heterogeneous problems in a monolithic system hinders the system''s reuse,
    extension and modification.


    Other approaches take the general constraint programming framework as starting
    point to introduce local search methods for constraint satisfaction. Problems
    are formulated in a framework of variables, domains and constraints. A constraint
    satisfaction problem (CSP) consists of


    +   - a set of variables $x = \{x_1, \dots, x_n\}$

    - where each variable is associated with a domain $d_i, \dots, d_n$

    - and a set of constraints $c = \{c_1, \dots, c_m\}$ over these variables.


    The domains can be symbols or as numbers. Continuous or discrete (e.g., "door",
    "13", "65"). Constraints are relations between variables (e.g., $x_o$ is a function
    of $x_j$; $x_n < x_i < x^*$). Constraint satisfaction is the search for a variable
    assignment that satisfies the constraints. Constraint optimization requires an
    additional function that assigns a quality value to a solution and tries to find
    a solution that maximizes this value. Through the use of CSP formulations, local
    search acquires a general application-independent framework.


    CSP formulations using local search approaches typically involve only basic constraint
    types, e.g., linear inequalities or binary constraints. The problem with this
    kind of formulation is mostly lost by the necessary translation of the problem
    to this low-level formulation. Domainspecific knowledge about appropriate representations
    and search control is only available at a higher level and cannot be considered.
    Consequently, these methods frequently fail because they have only a very limited
    view of the unknown search-space


    This paper attempts to overcome the drawbacks of these two local search approaches—problem-tailed
    and general low-level—by using global constraints for local search allows us to
    revise the current state on a more global level with domain-specific knowledge,
    while preserving features likeusability and maintenance. The proposed strategy
    is demonstrated on a dynamic job-scheduling problem.


    Local search techniques provide a solution at any time, the quality of the solution
    being subject to constant improvement. This anytime feature makes it worth evaluating
    the whole solution process, not just the final. To have a measure for the utility
    of intermediate stages as well, we can extend the CSP formulation to weighted
    CSPs (WSPs). In WSPs, constraints have associated costs, to minimize on the constraint
    variables'' assignments. The goal is to minimize the total sum of costs, which
    provides us with a useful cost function for local search. A value of zero for
    the costs means total satisfaction. The graded consistency measure makes it possible
    to extend the applicability of the concept to over-constrained systems and real-time
    reasoning.


    # 2. Global Constraints


    Constraint satisfaction has traditionally been tackled by refinement search (domain-reduction
    techniques), which faced similar problems of exploiting high-level knowledge.
    The success of commercial tools like the ILOG Scheduler [LeP94] can


    > The term inconsistency is used below as a synonym for costs.'
