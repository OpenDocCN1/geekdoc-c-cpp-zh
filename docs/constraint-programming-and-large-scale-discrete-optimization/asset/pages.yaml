    recognition of critical regions in a given schedule (cf. section 2.3). This success
    raised the question: Is it possible to determine heuristics of this kind automatically
    from a constraint model. Such a method has two advantages:


    +   * A constraint library that enables the automatic detection of critical regions
    in preliminary solutions frees the user of the library from dealing with search
    control.

    * A search procedure that uses such method adopts itself automatically to changes
    in the constraint problem.


