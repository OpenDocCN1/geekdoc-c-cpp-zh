  md: '# Appendix A. Risk scenarios in LSCO project development


    The following table presents a sample of the risk scenarios, consequences and
    countermeasures we have identified. It is mainly addressed to the LSCO team can
    bring useful information to the customer as well.


    | | | |

    |---|---|---|n| 1 | Customer has no previous experience of LSCO projects or other
    IT projects of similar size and complexity | The customer abandons the project
    during or after Stage 3 | At Stage 2, the LSCO team must ensure that the sponsor
    fully understands the future stages of the LSCO project lifecycle, the work to
    be done, illustrated by examples of similar projects which have been successfully
    completed. Ideally by an expert within the organisation for the project. |

    | 2 | The duplicate prototypes highlight major problems with the solution and
    the customer believes it is not progressing | The customer abandons the project
    during Stage 3 or 4 of the lifecycle | Risk analysis carried out in Stages 3 &
    4 of the lifecycle, ensure that failure of initial prototypes and contingency
    plans are made. |

    | 3 | Users change their needs - functionality is added or altered | A unsatisfactory
    solution cannot be achieved | User requirements must be documented and agreed
    before commencing any designs or prototyping activities which do not change the
    project nature can be agreed at Stage 2 |

    | 4 | The data is not available or usable for the optimisation tool | No optimization
    can be performed without real data and the project is cancelled | Start as early
    as Stage 2 to provide some initial data sets during Stage 3 |

    | 5 | The customer expects or promised high optimisation percentage (%) but the
    actual result is much worse (lower %) | User is dissatisfied - the application
    is not the most efficient one | Do not raise the customer''s expectations too
    high during Stage 3 of the lifecycle - be realistic about expected gains, taking
    into account the possible limitations of the optimisation techniques used. |

    | 6 | The LSCO team is specialised in one optimisation tool or type of problem
    | The solution design may not be robust to changes in user requirements, leading
    to lack of commitment | Ensure that an LSCO team with a wide experience of different
    types of projects and optimization techniques is used. Sub-contract part of the
    project to an external supplier. |

    | 7 | The proposed design is fully unoptimised optimisation system (black-box)
    | No efficient design of a solution can be prepared | Use prototypes and graphical
    visualisation to help the customer in its choices. |

    | 8 | The proposed results are very different from conventional or manual ones
    | The customer does not trust the application or does not want to apply the results
    due to important changes it requires | Introduce in model option constraints that
    allow to control the distance between the proposed solution and the conventional
    ones. The customer will then progressively approach the system.'
  merge: -1
