  md: '# Foreword


    The Workshop on Constraint Programming and Large Scale Discrete Optimization was
    held at the DIMACS Center at Rutgers University in Piscataway, NJ on September
    14–17, 1998. We would like to express our appreciation to Eugene Freuder and Richard
    Wallace for their efforts to organize and plan this successful conference.


    The workshop was part of the Special Year on Large Scale Optimization. We extend
    our thanks to Endre Boros, William Pulleblank, Michael Trick, Robert Vanderbilt,
    and Vijay Vazirani for their work as special year organizers.


    Constraint programming has become a major tool of discrete optimization and is
    of great interest to industry. The workshop brought together researchers working
    on optimization as well as those working on industrial applications. The volume
    on the application of constraint programming methods to problems of combinatorial
    optimization consists of papers arising from the workshop and illustrating some
    of the major trends in the field of constraint programming, emphasizing general
    techniques, scheduling applications, and software methodology.


    DIMACS gratefully acknowledges the generous support that makes these programs
    possible. The National Science Foundation, through its Science and Technology
    Centers at Rutgers, Princeton, AT&T Labs-Research, Bell Labs, NEC DIMACS''s partners
    at Rutgers, Princeton, AT&T Labs-Research, Bell Labs, NEC Research Institute,
    and Telcordia Technologies supported the special year.


    Fred S. Roberts

    Director


    Robert Sedgewwick

    Co-Director for Princeton'
