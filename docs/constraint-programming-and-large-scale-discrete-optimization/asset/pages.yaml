  md: '# LSCO:A METHODOLOGICAL VIEWPOINT


    ![](img/c20b6a5053a472f27c2d36f581c5c428_176_0.png)


    FIGURE 5. LSCO Conceptual Model Structure


    Each of the four concepts is common to any optimization paradigm: Inputs consist
    of the different entities and data required for the problem (resources, contract
    profiles, warehouses..) with their specifics and arities. Outputs are the solution
    elements the problem owner is looking for. At this stage they are independent
    of the decision variables that will be used to model the problem. Constraints
    are all the company policies that state the problem whether they will be fully
    satisfied (hard) or must be satisfied (soft). Finally, decision criteria are all
    the functions that contribute to defining the ideal solution. At this stage they
    need not to be combined into a single objective function.


    By extracting these technical components from the problem definition activity,
    we wish the LSCO team to make sure that:


    +   - They fully understand the customer''s problem from LSCO perspective. This
    will avoid misunderstandings from occurring during the design and programming
    activities.


    +   - They have identified potential ambiguities in the user requirements (e.g.
    fuzzy statements like ''in most cases'', ''maybe''). In situations, the LSCO team
    can come back to the user and ask for refinement of terms before going ahead with
    the design and programming activities.


    +   - They are not influenced or biased by any form of design model. The conceptual
    model should remain independent of any modelling framework and solution methods.
    One of its roles is to prevent the LSCO team from approximating the user requirements
    and simplifying them that they “fit” the modelling language at hand.


    Another advantage of the conceptual model, is that it can help the customer to
    better understand the LSCO team views and addresses the LSCO problem.


    Documentation. The information captured during the problem definition activity
    is written in a document to validate by the LSCO and customer team. A layout of
    the problem definition document we propose, which will be maintained and updated
    all throughout the project life is depicted in Appendix B.'
