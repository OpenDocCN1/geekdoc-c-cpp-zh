  pgno: 21
- img_proc: true
  md: '# USING GLOBAL CONSTRAINTS FOR LOCAL SEARCH


    be ascribed mainly to their use of so-called global constraints. Régin [Rég98]
    defines a global constraint as a substitute for a set of lower-level constraints,
    such that a more powerful data-reduction algorithm can be applied. Using global
    constraints, constraint solvers can attain an enormous speedup and real-world
    application requirements can be satisfied.


    For example, the alifferent (V) constraint is a global constraint that forces
    all included variables of the set V to different values. A formulation by lower-level
    constraints would include inequality constraints for all possible variable of
    the set V. But the application of the global constraint with a specific representation
    and satisfaction methods can yield much better performance (e.g., by a demo-observed
    array representation [PL95].


    The notion of global local search can support local approaches as well. It transferred
    to a local search context in the following subsections.


    # 2.1. Global Constraints from a Local Search Perspective.


    The central issue in local search is the transition from one state to the successor
    state. As it is uncertain what kind of change improves a current state, lots of
    neighbor states are usually analyzed. There are no general rules here, the kind
    of neighborhood and successor selection being a heuristic method.


    The heuristic already implies the existence of some domain knowledge for guidance.
    The heuristics of conventional search mechanisms for CSPs, like GSAT [Gu92, SLM92],
    can only explore knowledge about their representation''s special low-level structure,
    thus power to cope with self-defined complications instead of being able to incorporate
    higher-level domain knowledge. It is well known that there is a strong relationship
    between problem''s representation and its computability, and it remains unclear
    what kind of problems these low-level standardized representation approaches are
    suited. Consequently, there is not enough information locally available to direct
    the search [MJPL92]. Larger domains than the binary ones normally used exacerbate
    the problem because information about qualitative differences is not directly
    available.


    The concept of global constraints can help remedy this situation. To this end,
    we extend the notion of a global constraint:


    A global constraint is a substitute for a set of lower-level constraints, additional
    domain knowledge allowing the application of specialized data representations
    and algorithms to guide and accelerate search.


    A global constraint must feature a start function to construct its initial structures
    and inconsistency, an improvement procedure for determining a promising successor
    state, and an update function for its internal structures and the constraint''s
    cost contribution in change of variables.


    Heuristics for building neighbors and for selecting a successor can be directly
    encapsulated in the global constraints, where available. This is illustrated in
    the following sections using an example of a global constraint PERMUTATION. The
    global constraint PERMUTATION(A, X) to ensure that the variables of set X are
    a permutation of the values of bag A. The costs of the constraint are to be determined
    by the minimal of the distances of the variables'' current values to a valid assignment.'
