  md: 'It is worth pointing out that a variation in the penalties that are managed
    could make the difference to the effectiveness of guided local search. For example,
    selecting the features to penalise at random, applying excessive penalties, or
    using a different utility function than the one described above may result in
    much inferior results as our own experience suggests.


    Combining GLS with FLS presented in the previous section is straightforward. The
    key idea is to associate features with sub-neighbours. The associations to be
    made are that for each feature we know sub-neighbours contain moves that remove
    the feature from the solution. In the beginning, FLS is left to reach a local
    minimum (all the bits to 0). GLS penalises one or more features as explained above.
    The sub-neighbours, which are associated to the penalised features only, have
    their bits set to 1 and FLS is run again to reach a new local minimum. This process
    is repeated until a termination condition for GLS is satisfied. After the first
    run of FLS, all subsequent runs examine moves, which are associated to the penalised
    features trying to remove them from the working solution. In the TSP example where
    edges are penalised, we will set to 1 the bits of the cities at the edge of(s)
    penalised. As a result, FLS will focus on 2-Opt moves which try to remove the
    penalised edge(s) speeding up significantly the GLS procedure.


