    of the underlying concept without any problems during the work on ORBIS Dienstplan
    system.


    # 2.2. The Constraint Model. The first task in representing nurse rostering as
    a CSP is the identification of constraint variables and their domains. In our
    representation, a constraint variable is generated for each nurse on each day.
    Each of these variables has the set of working and idle shifts as its domain.
    This straight forward representation of a roster complies perfectly with the demand
    to assign a shift to each nurse on each day.


    Each variable has to be labeled with the shift the nurse has to serve at that
    particular day. At the moment, most hospitals still use a threeshift model with
    one early-morning F1, one late-shift S1 and one night-shift N1. Sometimes, a day-turn
    T1 shift is used to ensure a larger crew when most of the work is to be done.
    Due to pressure and the deficiency of qualified and experienced personnel has
    been recently recognized that working times must be more flexible and efficient.
    A reasonable and promising solution seems to be the introduction of additional
    overlapping shifts (e.g. six or nine shift model) with less working hours. Hence,
    the set of used working shifts varies from hospital to hospital and the system
    is required to integrate new types of shifts flexibly. These new shifts can be
    scheduled in a way, that overlapping hours occur during workintensive periods.
    Additionally, some kinds of idle shifts (— and *) as holidays UL have to be scheduled.
    Each of these particular shifts differ in start or end time, effect on the working
    time accounts and costs. For a ward with 15 to 40 nurses and a planning period
    of one month this representation is a constraint problem of 450 to 1200 variables
    each having a domain of around 10 or more shifts. Figure 1 gives an impression
    of the representation showing a portion of a roster.'
