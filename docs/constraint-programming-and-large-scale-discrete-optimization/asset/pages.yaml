    Jean-Charles Régin


    ABSTRACT. This paper aims to show the effectiveness of constraint programming
    for minimizing the number of breaks in sports scheduling problems. We consider
    single round-robin problems with an even number of teams. In such a problem we
    are given $n$ teams and $n-1$ periods, and for each period team has to play either
    a home or an away game against another team that every team plays every other
    team exactly once during the periods. A break for a team is defined to be two
    consecutive home matches or two consecutive away matches. For this problem, it
    has been proven by Schroeder that the minimal number of breaks is $n-2$. We propose
    a model using constraint programming that has the capacity to prove this result.
    For 20 teams this takes a more 0.61 s and for 60 teams it still takes less than
    one minute. The main reason for this is the use of several global constraints
    with powerful filtering algorithms are associated.

    Mover, this model is well-adapted to solve some variations of the problem in which
    new constraints are added as such: for each team the initial of away and home
    matches has to be balanced, it is forbidden to have two consecutive breaks, etc.
    We are also able to find and prove the minimal number of breaks for some given
    timetables of teams


