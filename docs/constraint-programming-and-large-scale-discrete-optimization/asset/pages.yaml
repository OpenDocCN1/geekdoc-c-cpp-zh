    This preemptive task can be broken down into one and four subtasks. Our current
    approach is to create all subtasks with the following set of restrictions. The
    first task must be scheduled before the second task is scheduled, the second before
    the third, etc. The minimum execution times for each subtask is initially to the
    minimum duration. The start time of each subtask is constrained to be after the
    end time of its preceding subtask. Finally, the subtask execution times must be
    greater than or equal to the minimum task duration and less than equal to the
    total duration (i.e., 2 hours). The subtasks are then scheduled during.


    For some problems, the number of preemptive subtasks is too large to find a schedule
    in a reasonable amount of time. In these cases, we employ an iterative approach
    where the number of preemptive subtasks is initially small, and then increased,
    systematically, until a complete schedule is found or until the time available
    to optimize the schedule is exhausted.


    Renewable Resources. With preemptive and periodic tasks, the problem with renewable
    resources is determining how many resource-renewal tasks to perform. Using the
    optimal number of resource-renewal tasks depends on the scheduling for the tasks
    that consume the resources, we have investigated several different heuristics
    to address this problem.


    One method starts with the minimum number of resource-renewal tasks for each renewable
    resource and attempts to find a complete feasible schedule, while keeping track
    of the best partial solution. If no schedule is found, the number of resource-renewal
    tasks is increased for each renewable resource and the scheduling is repeated.
    This process is repeated until a complete solution is found (if one exists) or
    until the available scheduling time is consumed, at which the best possible partial
    schedule is returned.


    A second method is to initially generate a reasonable number of renewal tasks,
    and then search for a feasible schedule that uses as few of the resourcerenewal
    tasks as possible. A third approach is to require the user to specify the number
    of resource-renewal tasks that need to be scheduled, and return a schedule that
    satisfies as many of the other tasks as possible. We have used all three of these
    approaches with some degree of satisfaction, and are considering other potential
    solutions to this problem.


