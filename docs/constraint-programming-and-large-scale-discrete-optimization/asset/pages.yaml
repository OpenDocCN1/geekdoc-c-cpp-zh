    The most significant results of GLS and FLS are in their application to the travelling
    salesman problem (TSP). The Lin-Kernighan algorithm (LK) is a specialised algorithm
    for TSP and its variants have been perceived as cheap for this problem LK73, Joh90,
    MO96. We tested GLS+FLS+2Opt against LK and variants of LK (which use the double
    bridge move) [Joh90] in a set of benchmarks from the public TSP library [Rei91].
    We gained a amount of time (we tested 5 minutes and 30 minutes on a Dec Alpha
    3000/600), GLS+FLS+2Opt also out-performed Simulated Annealing [JAMS89], Tabu
    Search [Kho94] and hybrid Genetic Algorithm [FM96] methods based on LK. One must
    be cautious when interpreting empirical results as they could be affected by factors,
    including implementation issues [Hoo95]. But given that the TSP is extensively
    developed problem, it takes something special for an algorithm to have a performance
    comparable if not better to that of the champions. It must be emphasised that
    LK is specialised for TSP but GLS and FLS are much simpler general-purpose algorithms,
    which require only a fraction of the programming effort to implement the specialised
    methods. Details of GLS+FLS applied to the TSP can be found in [VT99].


    GLS has also been developed for general optimization problems to illustrate that
    artificial features can be defined for problems which the objective function suggests
    no obvious features. Results show that, as expected, GLS spends its effort across
    solution depending on their quality (measured by the objective function). Besides,
    GLS consistently found solutions in a landscape with many local options [Vou98].


    The research group at University of Essex are currently attempting to gain more
