  raw: "The key idea is to take a 64bit unsigned integer ![](images/00016.jpeg)and\
    \ represent it with a list of bytes. For each byte seven bits are used for storing\
    \ the integers with variable length encoding. In addition the most significant\
    \ bit is the continuation bit and it is used to signal whether or not we need\
    \ an additional byte for encoding n.  For example: if the number is less than\
    \ ![](images/00061.jpeg) , we need only one byte where the most significant bit\
    \ it set to 0\\. Otherwise if the number is less than ![](images/00062.jpeg) ,\
    \ we need two bytes where the first byte has the continuation bit set to 1 and\
    \ the second byte has the continuation bit set to 0\\. This representation is\
    \ used for saving space when implementing an inverted index[[2]](#part0000.html__ftn2),\
    \ a data structure frequently used by search engines. The inverted index is similar\
    \ to the analytical index used to memorize the page where a word occurs in a book.\
    \ The crucial intuition is to store the difference between two consecutive pages\
    \ for each word and adopt a variable length encoding in order to save space.\n\
    \n## Code\n\nvoid encodeContinuationBit(__int64  n,\n\nstd::vector<unsigned  short>\
    \ & encode)\n\n{\n\n __int64 x = n;\n\n unsigned  short e;\n\n if (!x) encode.push_back(0);\n\
    \n while (x)\n\n {\n\n               e = x & 127;\n\n                           \
    \ x >>= 7;\n\n  if (x)\n\n                             e |= (1 << 7);\n\n  encode.push_back(e);\n\
    \n }\n\n}\n\n# 26.  Represent an integer with variable length encoding using gamma\
    \ encoding\n\n## Solution\n\nGamma encoding is another variable length encoding\
    \ for integers[[3]](#part0000.html__ftn3). The number ![](images/00025.jpeg) is\
    \ represented with ![](images/00063.jpeg) bits. The integer is separated into\
    \ two parts. The former is the highest power of 2 not greater than x  (say ![](images/00064.jpeg)\
    \ and it is represented in unary with log(x) bits set to 0 followed by a 1\\.\
    \ The latter is the remaining binary digit representing ![](images/00065.jpeg).\n\
    \n## Code\n\nvoid gammaEncoding(unsigned  int  x)\n\n{\n\n int i;\n\n unsigned\
    \ lenOfX = 0;\n\n for (i = x; i > 1; i >>= 1) // floor(log2(x))\n\n              \
    \ lenOfX++;\n\n for (i = lenOfX; i > 0; --i)\n\n std::cout << '0';\n\n std::cout\
    \ << '1';\n\n x -= (1 << lenOfX); // reminder\n\n for (i = 1 << (lenOfX -1); i\
    \ > 0; i >>= 1)\n\n if (x & i)\n\n               std::cout << 1;\n\n else\n\n\
    \               std::cout << 0;\n\n}\n\n# 27.  Represent an integer with variable\
    \ length encoding using delta encoding\n\n## Solution\n\nDelta encoding is another\
    \ variable length encoding for integers[[4]](#part0000.html__ftn4). The number\
    \ ![](images/00025.jpeg) is represented with ![](images/00066.jpeg) bits. The\
    \ integer is separated into two parts. The former one is the highest power of\
    \ 2 not greater than x  (say ![](images/00064.jpeg) and it is represented by encoding\
    \ the number ![](images/00067.jpeg) with gamma encoding. The latter one is the\
    \ remaining binary digit representing ![](images/00065.jpeg).\n\n## Code\n\nvoid\
    \ deltaEncoding(unsigned  int  x)\n\n{\n\n int len = 0, lengthOfLen = 0, i;\n\n\
    \ for (int i = x; i > 0; i >>= 1) // 1+floor(log2(num))\n\n               len++;\n\
    \n for (int i = len; i > 1; i >>= 1) // floor(log2(len))\n\n               lengthOfLen++;\n\
    \n for (int i = lengthOfLen; i > 0; --i)\n\n               std::cout << 0;\n\n\
    \ for (int i = lengthOfLen; i >= 0; --i)\n\n               std::cout << ((len\
    \ >> i) & 1);\n\n for (int i = len - 2; i >= 0; i--)\n\n               std::cout\
    \ << ((x >> i) & 1);\n\n}\n\n# 28.  Compute the average with no division\n\n##\
    \ Solution\n\nThis problem solves a bug in binary search and merge sort reported\
    \ in 2006 more than 60 years after the first binary search algorithm has been\
    \ published.[[5]](#part0000.html__ftn5) Binary search is typically implemented\
    \ as it follows:\n\nint binSearch(int  a[], unsigned  int  size, int  key) {\n\
    \n int low = 0;\n\n int high = size;\n\n while (low <= high) {\n\n  int mid =\
    \ (low + high) / 2;\n\n  int midVal = a[mid];\n\n  if (midVal < key)\n\n              \
    \               low = mid + 1;\n\n  else  if (midVal > key)\n\n              \
    \               high = mid - 1;\n\n  else\n\n  return mid; // key found\n\n }\n\
    \n return -(low + 1); // key not found.\n\n}\n\nand the bug is in the line  int\
    \ ![](images/00068.jpeg); since the sum overflow to a negative value if the sum\
    \ of ![](images/00069.jpeg) and ![](images/00070.jpeg)is greater than the maximum\
    \ positive int value ![](images/00071.jpeg). In C and C++ this causes an array\
    \ index out of bounds with unpredictable results. In other languages this situation\
    \ will throw and exception. The solution is to compute:\n\n![](images/00072.jpeg)\n\
    \nIt is quite amazing to think that it took more than 60 years to detect a bug\
    \ in a piece of code so commonly used in the industry and studied by generations\
    \ of students and academics!!\n\nABOUT THE AUTHOR\n\nAn experienced data mining\
    \ engineer, passionate about technology and innovation in consumers’ space. Interested\
    \ in search and machine learning on massive dataset with a particular focus on\
    \ query analysis, suggestions, entities, personalization, freshness and universal\
    \ ranking. Antonio Gullì has worked in small startups, medium (Ask.com, Tiscali)\
    \ and large corporations (Microsoft). His carrier path is about mixing industry\
