    \ = sum / 10;\n    res[i] = (char)sum % 10 + '0';\n  }\n  if (carry)\n    res\
    \ = '1' + res;\n  return res;\n}\n```\n\n# 24. Generate all the bit patterns from\
    \ 0 to ![](images/0055.jpeg) such that successive patterns differ by one bit.\n\
    \n## Solution\nThose patterns are named Gray code after the inventor Frank Gray[1](#part000.html__ftn1).\
