  trans: "\n\n![](img/0007.jpeg)\n\n# C++ 求解位运算面试题集\n\nAntonio Gulli\n\nCopyright\
    \ © 2014 Antonio Gulli\n保留所有权利。\n\nISBN:\nISBN-13:\n\n位运算篇是系列 25 章关于算法、问题解决和 C++\
    \ 编程章节中的第三部分。\n\n## 献辞\n\n给我的第二个孩子 Leonardo。\n希望你一生都保持好奇心和活力。\n\n## 致谢\n\n感谢 Antonio\
    \ Savona 的代码审查\n\n## 目录\n\n- 1. 给定一个无符号整数，交换奇偶位置的比特位 的所有比特模式，使得相邻模式之间仅差一个位](#\n\
    - 解决方案`，我们要交换位置![](img/0003.jpeg) 的比特。为了选择偶数位，我们可以与 `0AAAAAAAA` 进行与与运算，这是一个偶数位为\
    \ 1 的 32 位数（`0xA` 是十进制 10，二进制为 `1010`）。对于选择奇数位，我们可以与位掩码 `0x55555555` 进行与运算，这是一个所有位均为\
    \ 1 的数（`0x5` 是十进制 5，二进制为 `0101`）。然后我们需要向左（或向右）移动一位，并将两个结果进行或运算。\n\n### 代码\n\n\
    ```cpp\nunsigned int swapBits(unsigned int x) {\n    unsigned int evenBits = x\
    \ & 0AAAAAAAA;\n    unsigned int oddBits = x & 0x55555555;\n    evenBits >>= 1;\n\
    \    oddBits <<= 1;\n    return (evenBits | oddBits);\n}\n```\n\n## 2. 打印无符号整数的二进制表示\n\
    \n### 解决方案\n\n一个简单的解决方案是将![](img/0005.jpeg)` 比特与数字![](img/0006.jpeg)` 进行与运算。\n\
    \n### 代码\n\n```cpp\nvoid bin(unsigned n) {\n    for (unsigned int i = 1 << 31;\
    \ i > 0; i = i >> 1) {\n        if (n & i) std::cout << 1;\n        else std::cout\
    \ << 0;\n    }\n}\n```\n\n## 3. 判断一个无符号数是否为 2 的幂\n\n### 解决方案\n\n假设该数非零。如果它是 2\
    \ 的幂，那么唯一的置 1 比特位于位置![](img/0007.jpeg)。在这种情况下我们减去 1，因此 ![](img/0008.jpeg) 左的所有位都会被置零。因此，一个正数![](img/0009.jpeg)是\
    \ 2 的幂当且仅当 ![](img/0010.jpeg) 为 0。注意这种检查仅适用于 ![](img/0011.jpeg)。\n\n```cpp\nbool\
    \ isPowerOfTwo(unsigned n) {\n    return n && (!(n & (n - 1)));\n}\n```\n\n##\
    \ 4. 将第 i 位置 1\n\n### 解决方案\n\n对于给定的数字 `n`，我们可以通过表达式![](img/0012.jpeg) 将第 i 位置\
    \ 1。\n\n## 5. 将第 i 位置 0\n\n### 解决方案\n\n对于给定的数字 `n`，我们可以通过表达式![](img/0013.jpeg)\
    \ 将第 i 位置 0。\n\n## 6. 反转第 i 位\n\n### 解决方案\n\n对于给定的数字 `n`，我们可以通过表达式![](img/0014.jpeg)\
    \ 反转第 i 位。\n\n## 7. 给定一个只有一个比特 1 的无符号数，找到该位的位置\n\n### 解决方案\n\n如果只有一个比特被置 1，那么该数必须是\
    \ 2 的幂。为了识别所设置的位置，我们可以将该数与合适的位掩码进行与运算。\n\n"
- fmt: "\n```cpp\n unsigned int i = 1, pos = 1;\n\n while (!(i & n))\n {\n       \
    \      i = i << 1;\n             ++pos;\n }\n\n return pos;\n}\n```\n\n## Solution\n\
    \nAnother solution is using the logarithm for returning the position of the only\
    \ bit set in the given unsigned ![](images/00009.jpeg). The code returns -1 if\
    \ ![](images/00009.jpeg) is not a power of 2.\n\n## Code\n\n```cpp\nint findPosition2(unsigned\
    \ int n)\n{\n if (n & (n - 1))\n  return -1;\n return (unsigned int)(log((double)n)\
    \ / log(2.0)) + 1;\n}\n```\n\n## Solution\n\nYet another solution runs in ![](images/00015.jpeg).\
    \ The key intuition is to perform a logarithmic binary search on the log ![](images/00016.jpeg)bits\
    \ used for representing the unsigned int ![](images/00009.jpeg).\n\n## Code\n\n\
    ```cpp\nint findPosition3(unsigned int n)\n{\n if (n & (n - 1))\n  return -1;\n\
    \ if (n == 1 << 31)\n  return 32;\n unsigned int position = 16;\n unsigned int\
    \ half = 1 << 15;\n unsigned int stride = 16;\n while (1)\n {\n  if (n == half)\n\
    \  return position;\n  else if (n > half)\n             {\n  n = n >> stride;\n\
    \                              position = position + (stride >> 1);\n        \
    \     }\n  else\n             {\n  n = n & ((1 << stride) - 1);\n            \
    \                  position = position - (stride >> 1);\n             }\n  half\
    \ = half >> (stride >> 1);\n  stride >>= 1;\n }\n return position;\n}\n```\n\n\
    # 8. Count the number of bits set in an unsigned number\n\n## Solution\n\nWe can\
    \ simply loop and count the bits with complexity![](images/00017.jpeg), where\
    \ ![](images/00016.jpeg)is the number of bits in the unsigned.\n\n## Code\n\n\
    ```cpp\nunsigned int countBits(unsigned int n)\n{\n unsigned int count = 0;\n\
    \ while (n)\n {\n count += n & 1;\n  n >>= 1;\n }\n return count;\n}\n```\n\n\
    ## Solution for sparse bitmaps\n\nThis solution works better for sparse unsigned\
    \ s because it runs in a time proportional to the number of bits set to 1. The\
    \ line `n &= (n – 1)` sets the rightmost 1 in the bitmap to 0.\n\n## Code\n\n\
    ```cpp\nunsigned int countBitsSparse(unsigned int n)\n{\n unsigned int count =\
    \ 0;\n while (n)\n {\n                   count++;\n  n &= (n - 1);\n }\n return\
    \ count;\n}\n```\n\n## Solution for dense bitmaps\n\nThis solution works better\
    \ for dense bitmaps because it runs in a time proportional to the number of bits\
    \ set to 0. First you must toggle all the bits and then subtract the numbers of\
    \ the set bits from ![](images/00018.jpeg). The line `n &= (n – 1)` sets the rightmost\
    \ 1 in the bitmap to 0.\n\n## Code\n\n```cpp\nunsigned int countBitsDense(unsigned\
    \ int n)\n{\n unsigned int count = 8 * sizeof(unsigned int);\n n = ~n;\n while\
    \ (n)\n {\n                   count--;\n  n &= (n - 1);\n }\n return count;\n\
    }\n```\n\n## Solution for 32bit integers\n\nThis solution works better for unsigned\
    \ 32 bits integers. Here you use an additional lookup table containing the number\
    \ of 1s enclosed in the binary representation of the 8 bit ![](images/00019.jpeg)\
    \ number. Using pre-computed lookup tables is a commonly adopted trick for speeding\
    \ up lookup tables.\n\n## Code\n\n```cpp\nstatic int bitInChar[256];\nvoid fillBitsInChar()\n\
    {\n for (unsigned int i = 0; i < 256; ++i)\n              bitInChar[i] = countBits(i);\n\
    }\nunsigned int countBitsConstant32Bits(unsigned int n)\n{\n return bitInChar[n\
    \ & 0xffu] +\n              bitInChar[(n >> 8) & 0xffu] +\n              bitInChar[(n\
    \ >> 16) & 0xffu] +\n              bitInChar[(n >> 24) & 0xffu];\n}\n```\n\n#\
    \ 9. Add two numbers without arithmetic operators\n\n## Solution\n\nWe can use\
    \ XOR for adding two bits and the AND operator for computing the carry. In the\
    \ code we also implemented subtract.\n\n## Code\n\n```cpp\nint add(int x, int\
    \ y)\n{\n while (y != 0)\n {\n  int carry = x & y;\n  x = x ^ y;\n  y = carry\
    \ << 1;\n }\n return x;\n}\nint negate(int x) {\n return add(~x, 1);\n}\nint subtract(int\
