    \      n &= n - 1;\n    }\n    std::cout << \",\";\n  }\n}\n```\n\n# 23. Add two\
    \ decimal strings representing two integers\n\n## Solution\nThe two strings can\
    \ represent very large integers. The algorithm used for summing the value is the\
    \ one taught at primary school.\n\n## Code\n```cpp\nint padDecimalStrings(std::string\
    \ &str1, std::string &str2)\n{\n  int len1 = str1.size();\n  int len2 = str2.size();\n\
    \  if (len1 < len2)\n  {\n    str1.insert(0, len2 - len1, '0');\n    return len2;\n\
    \  }\n  else if (len1 > len2)\n    str2.insert(0, len1 - len2, '0');\n  return\
    \ len1;\n}\n\nstd::string addDecimalStrings(std::string s1, std::string s2)\n\
    {\n  int len = padDecimalStrings(s1, s2);\n  int b1, b2, sum, carry = 0;\n  std::string\
    \ res;\n  res.resize(len);\n  for (int i = len - 1; i >= 0; i--)\n  {\n    b1\
