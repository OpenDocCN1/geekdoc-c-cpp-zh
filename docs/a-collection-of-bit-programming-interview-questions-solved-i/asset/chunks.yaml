    \n# 25. 使用连续位用变长编码表示无符号整数\n\n## 解决方案\n\n"
- fmt: "\nThe key idea is to take a 64bit unsigned integer ![](images/00016.jpeg)and\
    \ represent it with a list of bytes. For each byte seven bits are used for storing\
    \ the integers with variable length encoding. In addition the most significant\
    \ bit is the continuation bit and it is used to signal whether or not we need\
    \ an additional byte for encoding `n`. For example: if the number is less than\
    \ ![](images/00061.jpeg), we need only one byte where the most significant bit\
    \ it set to 0\\. Otherwise if the number is less than ![](images/00062.jpeg),\
    \ we need two bytes where the first byte has the continuation bit set to 1 and\
    \ the second byte has the continuation bit set to 0\\. This representation is\
    \ used for saving space when implementing an inverted index[[2]](#part0000.html__ftn2),\
    \ a data structure frequently used by search engines. The inverted index is similar\
    \ to the analytical index used to memorize the page where a word occurs in a book.\
    \ The crucial intuition is to store the difference between two consecutive pages\
    \ for each word and adopt a variable length encoding in order to save space.\n\
    \n## Code\n\n```cpp\nvoid encodeContinuationBit(__int64 n, std::vector<unsigned\
    \ short> & encode)\n{\n  __int64 x = n;\n  unsigned short e;\n  if (!x) encode.push_back(0);\n\
    \  while (x)\n  {\n    e = x & 127;\n    x >>= 7;\n    if (x)\n      e |= (1 <<\
    \ 7);\n    encode.push_back(e);\n  }\n}\n```\n\n# 26. Represent an integer with\
    \ variable length encoding using gamma encoding\n\n## Solution\n\nGamma encoding\
    \ is another variable length encoding for integers[[3]](#part0000.html__ftn3).\
    \ The number ![](images/00025.jpeg) is represented with ![](images/00063.jpeg)\
    \ bits. The integer is separated into two parts. The former is the highest power\
    \ of 2 not greater than `x` (say ![](images/00064.jpeg) and it is represented\
    \ in unary with `log(x)` bits set to 0 followed by a 1\\. The latter is the remaining\
    \ binary digit representing ![](images/00065.jpeg).\n\n## Code\n\n```cpp\nvoid\
    \ gammaEncoding(unsigned int x)\n{\n  int i;\n  unsigned lenOfX = 0;\n  for (i\
    \ = x; i > 1; i >>= 1) // floor(log2(x))\n    lenOfX++;\n  for (i = lenOfX; i\
    \ > 0; --i)\n    std::cout << '0';\n  std::cout << '1';\n  x -= (1 << lenOfX);\
    \ // reminder\n  for (i = 1 << (lenOfX - 1); i > 0; i >>= 1)\n    if (x & i)\n\
    \      std::cout << 1;\n    else\n      std::cout << 0;\n}\n```\n\n# 27. Represent\
    \ an integer with variable length encoding using delta encoding\n\n## Solution\n\
    \nDelta encoding is another variable length encoding for integers[[4]](#part0000.html__ftn4).\
    \ The number ![](images/00025.jpeg) is represented with ![](images/00066.jpeg)\
    \ bits. The integer is separated into two parts. The former one is the highest\
    \ power of 2 not greater than `x` (say ![](images/00064.jpeg) and it is represented\
    \ by encoding the number ![](images/00067.jpeg) with gamma encoding. The latter\
    \ one is the remaining binary digit representing ![](images/00065.jpeg).\n\n##\
    \ Code\n\n```cpp\nvoid deltaEncoding(unsigned int x)\n{\n  int len = 0, lengthOfLen\
    \ = 0, i;\n  for (int i = x; i > 0; i >>= 1) // 1+floor(log2(num))\n    len++;\n\
    \  for (int i = len; i > 1; i >>= 1) // floor(log2(len))\n    lengthOfLen++;\n\
    \  for (int i = lengthOfLen; i > 0; --i)\n    std::cout << 0;\n  for (int i =\
    \ lengthOfLen; i >= 0; --i)\n    std::cout << 0;\n  for (int i = len - 2; i >=\
    \ 0; --i)\n    std::cout << (x >> i);\n}\n```\n\n# 28. Compute the average with\
    \ no division\n\n## Solution\n\nThis solves a bug in binary search reported [[5]](#part0000.html__ftn5)\
    \ more than 60 years after binary search is typically implemented as follows:\n\
    \n```cpp\nint binSearch(int a[], unsigned int size, int key) {\n  int low = 0;\n\
    \  int high = size;\n  while (low <= high) {\n    int mid = (low + high) / 2;\n\
    \    int midVal = a[mid];\n    if (midVal < key)\n      low = mid + 1;\n    else\
    \ if (midVal > key)\n      high = mid - 1;\n    else\n      return mid; // key\
    \ found\n  }\n  return -(low + 1); // key not found\n}\n```\n\nThe bug is in the\
    \ line ![](images/0068.jpeg) since the sum of ![](images/0069.jpeg) and ![](images/0070.jpeg)\
    \ is greater than the maximum `int` value ![](images/0071.jpeg). In C and C++\
    \ this causes an array index of bounds with unpredictable results. In other languages\
    \ this will throw an exception. The solution is to compute ![](images/0072.jpeg).\n\
    \nABOUT THE AUTHOR\n\nAn experienced data mining engineer, passionate about technology\
    \ and innovation in consumers’ space. Interested in search and machine learning\
    \ on massive dataset with a particular focus on query analysis, suggestions, entities,\
    \ freshness and universal ranking. Antonio Gullì has worked in small startups,\
    \ medium (Ask.com, Tiscali) and large corporations (Microsoft). His carrier path\
    \ is about mixing industry with academic experience.\n\n“Nowadays, you must have\
