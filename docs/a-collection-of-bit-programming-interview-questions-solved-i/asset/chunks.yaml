    ## 1. Given an unsigned int, swap the bits in odd and even positions\n\n### Solution\n\
    \nAssume that an `unsigned int` is `![](images/0002.jpeg)` and that we swap the\
    \ bits in position![](images/0003.jpeg)`. In order to select the even bits we\
    \ can AND with `0AAAAAAAA`, which is a 32 bit number with even bits set (`0xA`\
    \ is decimal 10, `1010` in binary). For selecting the odd bits we can AND with\
    \ bitmask `0x55555555`, which is a number with all bits set (`0x5` is decimal\
    \ 5, `0101` in binary). Then we need to shift left (respectively right) one position\
    \ and OR the two results.\n\n### Code\n\n```cpp\nunsigned int swapBits(unsigned\
    \ int x) {\n    unsigned int evenBits = x & 0AAAAAAAA;\n    unsigned int oddBits\
    \ = x & 0x55555555;\n    evenBits >>= 1;\n    oddBits <<= 1;\n    return (evenBits\
    \ | oddBits);\n}\n```\n\n## 2. Print the binary representation of an unsigned\
    \ int\n\n### Solution\n\nAn easy solution is to AND the![](images/0005.jpeg)`\
    \ bit with the number![](images/0006.jpeg)`.\n\n### Code\n\n```cpp\nvoid bin(unsigned\
    \ n) {\n    for (unsigned int i = 1 << 31; i > 0; i = i >> 1) {\n        if (n\
    \ & i) std::cout << 1;\n        else std::cout << 0;\n    }\n}\n```\n\n## 3. Compute\
    \ whether or not an unsigned number is a power of two\n\n### Solution\n\nSuppose\
    \ that the number is nonzero. If it is a power of two, than the only bit set is\
    \ in position![](images/0007.jpeg)`. In this case we subtract 1, so all the bits\
    \ at the left of ![](images/0008.jpeg)will be unset. Therefore a positive number![](images/0009.jpeg)is\
    \ a power of 2 if and only if ![](images/0010.jpeg) is 0. Note that this check\
    \ only works if ![](images/0011.jpeg)`.\n\n```cpp\nbool isPowerOfTwo(unsigned\
    \ n) {\n    return n && (!(n & (n - 1)));\n}\n```\n\n## 4. Set the i-th bit\n\n\
    ### Solution\n\nFor a given number `n` we can set the `i`-th bit with the expression\
    \ ![](images/0012.jpeg)`.\n\n## 5. Unset the i-th bit\n\n### Solution\n\nFor a\
    \ given number `n` we can unset the `i`-th bit with the expression ![](images/0013.jpeg)`.\n\
    \n## 6. Toggle the i-th bit\n\n### Solution\n\nFor a given number `n` we can toggle\
    \ the `i`-th bit with the expression ![](images/0014.jpeg)`.\n\n## 7. Given an\
    \ unsigned number with only one bit set, find the position of this bit\n\n###\
    \ Solution\n\nIf there is only one bit set, then the number must be a power of\
    \ two. For identifying the position set we can AND the number with an appropriate\
    \ bitmask.\n"
