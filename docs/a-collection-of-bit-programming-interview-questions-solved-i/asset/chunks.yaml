    \ 中的每个元素前面加上 0。然后将 ![](img/0072.jpeg) 反转，并在每个元素前面加上 1。作为最后一步，将这两个中间列表拼接以创建新的 ![](img/0073.jpeg)。这个过程重复直到我们生成\
    \ ![](img/0074.jpeg)。\n\n## 代码\n```cpp\nvoid gray(unsigned int n)\n{\n  if (n\
