    ## Code\n```cpp\nvoid swap(unsigned int & i, unsigned int & j)\n{\n  i ^= j;\n\
    \  j ^= i;\n  i ^= j;\n}\n```\n\n# 18. Swap bit i and j in a 64 bit number\n\n\
    ## Solution\nIf ![](images/00023.jpeg) is equal to ![](images/00039.jpeg), no\
    \ swap is required. We need to swap ![](images/00023.jpeg) and ![](images/00040.jpeg)\
    \ if those two bits are different, which means that they are XOR’d to 1. If they\
    \ are different, then there are only two cases possible: (0, 1) and (1, 0) and\
    \ for those a XOR with 1 will swap the result. If the two bits are different,\
    \ then their XOR is 0 and for any number ![](images/00041.jpeg). Those observations\
    \ are implemented in the code below.\n\n## Code\n```cpp\nint swapBits(int n, unsigned\
    \ int i, unsigned int j)\n{\n  if (i == j)\n    return n;\n  int xor = ((n >>\
    \ i) ^ (n >> j)) & 1;\n  return n ^ (xor << i) ^ (xor << j);\n}\n```\n\n# 19.\
    \ Reverse the order of bits in an unsigned integer\n\n## Solution\nWe simply apply\
    \ the function used for swapping bits. First solution re-use the code defined\
    \ for a previous exercise, while the second one manipulates bits directly.\n\n\
    ## Code\n```cpp\nunsigned int reverse(unsigned int n)\n{\n  unsigned numBits =\
    \ sizeof(unsigned int) * 8;\n  unsigned halfBits = numBits >> 1;\n  for (unsigned\
    \ int i = 0; i < halfBits; ++i)\n    n = swapBits(n, i, numBits - i - 1);\n  return\
    \ n;\n}\n\nunsigned int mirror(unsigned int n)\n{\n  for (unsigned int i = 0;\
    \ i <= 15; i++)\n  {\n    n = (n & (0xffffffff - (1 << i) - (1 << (31 - i))))\
    \ |\n        ((n & (1 << i)) << (31 - i * 2)) |\n        ((n & (1 << (31 - i)))\
    \ >> (31 - i * 2));\n  }\n  return n;\n}\n```\n\n# 20. Convert an integer to a\
    \ string and a string to an integer\n\n## Solution\nFor a base 10 integer ![](images/00036.jpeg)\
    \ we know that we can get the last digit with the operation ![](images/00042.jpeg)\
    \ and that we can right shift the number with ![](images/00043.jpeg). Also the\
    \ ASCII character for the digit ![](images/00044.jpeg) is ![](images/00045.jpeg).\
    \ If the number is negative, we need to prepend character ‘-’.\n\n## Code\n```cpp\n\
    std::string toString(int n)\n{\n  if (n == 0) return \"0\";\n  std::string result;\n\
    \  result.reserve(10);\n  if (n < 0)\n  {\n    n = -n;\n    result.push_back('-');\n\
    \  }\n  for (int i = log10(n); i >= 0; i--)\n    result.push_back('0' + (n / (int)pow(10,\
    \ i)) % 10);\n  return result;\n}\n\nint toInt(const std::string & s)\n{\n  if\
    \ (s.empty()) return 0;\n  const bool negative = (s[0] == '-') ? true : false;\n\
    \  int result = 0;\n  for (unsigned int i = (negative ? 1 : 0); i < s.size();\
    \ ++i)\n  {\n    if (isdigit(s[i]))\n      result = result * 10 + s[i] - '0';\n\
    \  }\n  return (negative) ? -result : result;\n}\n```\n\n# 21. Convert a number\
    \ from base b1 to b2\n\n## Solution\nWe can generalize the solution presented\
    \ in previous exercise. The idea is to convert from base ![](images/0046.jpeg)\
    \ into decimal and from decimal into base ![](images/0047.jpeg).\n\n## Code\n\
    ```cpp\nstd::string convertFromToBase(const std::string & s, unsigned int b1,\
    \ unsigned int b2)\n{\n  if (s.empty()) return s;\n  bool negative = (s[0] ==\
    \ '-');\n  int n = 0, reminder;\n  for (unsigned int i = (negative ? 1 : 0); i\
    \ < s.size(); ++i)\n    n = n * b1 + (isdigit(s[i]) ? s[i] - '0' : s[i] - 'A'\
    \ + 10);\n  std::string result;\n  while (n)\n  {\n    reminder = n % b2;\n  \
    \  result.push_back(reminder >= 10 ? 'A' + reminder - 10 : '0' + reminder);\n\
    \    n /= b2;\n  }\n  if (negative)\n    result.push_back('-');\n  reverse(result.begin(),\
    \ result.end());\n  return result;\n}\n```\n\n# 22. Given a set S, compute the\
    \ powerset of S\n\n## Solution\nThe powerset of ![](images/0048.jpeg) is the set\
    \ of all subsets of S. For instance given the set ![](images/0049.jpeg), the powerset\
    \ is ![](images/0050.jpeg). If we represent the presence (absence) of ![](images/0019.jpeg)\
    \ element in ![](images/0048.jpeg) with a bit set to 1 (respectively, 0), then\
    \ we can build the powerset by generating all the bitmasks from 0 to ![](images/0052.jpeg)\
    \ where ![](images/0009.jpeg) is the size of ![](images/0053.jpeg). Note that\
    \ the position of the ![](images/0019.jpeg) bit is given by ![](images/0054.jpeg).\n\
    \n## Code\n```cpp\nvoid powerSet(const std::vector<char> & set)\n{\n  for (unsigned\
    \ int i = 0; i < (1 << set.size()); ++i)\n  {\n    unsigned int n = i;\n    while\
