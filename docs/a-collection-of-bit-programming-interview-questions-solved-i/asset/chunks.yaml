  trans: "\n核心思想是将一个 64 位无符号整数 ![](img/00016.jpeg) 用字节列表来表示。对于每个字节，使用 7 位来存储具有变长编码的整数。此外，最高位（most\
    \ significant bit）是延续位（continuation bit），用于指示我们是否需要额外的字节来对 `n` 进行编码。例如：如果数字小于\
    \ ![](img/00061.jpeg)，我们只需要一个字节，其最高位被置为 0。否则，如果数字小于 ![](img/00062.jpeg)，我们需要两个字节，第一个字节的延续位置为\
    \ 1，而第二个字节的延续位置为 0。这种表示法用于在实现倒排索引[[2]](#part0000.html__ftn2)时节省空间，倒排索引是搜索引擎频繁使用的数据结构。倒排索引类似于用于记录书中某个单词出现页码的分析索引。其关键的直觉是存储每个单词两个连续页之间的差值，并采用变长编码来节省空间。\n\
    \n## Code\n\n```cpp\nvoid encodeContinuationBit(__int64 n, std::vector<unsigned\
    \ short> & encode)\n{\n  __int64 x = n;\n  unsigned short e;\n  if (!x) encode.push_back(0);\n\
    \  while (x)\n  {\n    e = x & 127;\n    x >>= 7;\n    if (x)\n      e |= (1 <<\
    \ 7);\n    encode.push_back(e);\n  }\n}\n```\n\n# 26. 使用 gamma 编码用变长编码表示整数\n\n\
    ## Solution\n\nGamma 编码是另一种整数的变长编码[[3]](#part0000.html__ftn3)。数字 ![](img/00025.jpeg)\
    \ 用 ![](img/00063.jpeg) 位表示。该整数分为两部分：前部分是不大于 `x` 的最大 2 的幂（假设为 ![](img/00064.jpeg)），用一一编码表示，即\
    \ `log(x)` 位置为 0，后面跟一个 1。后部分是表示 ![](img/00065.jpeg) 的剩余二进制位。\n\n## Code\n\n```cpp\n\
    void gammaEncoding(unsigned int x)\n{\n  int i;\n  unsigned lenOfX = 0;\n  for\
    \ (i = x; i > 1; i >>= 1) // floor(log2(x))\n    lenOfX++;\n  for (i = lenOfX;\
    \ i > 0; --i)\n    std::cout << '0';\n  std::cout << '1';\n  x -= (1 << lenOfX);\
    \ // reminder\n  for (i = 1 << (lenOfX - 1); i > 0; i >>= 1)\n    if (x & i)\n\
    \      std::cout << 1;\n    else\n      std::cout << 0;\n}\n```\n\n# 27. 使用 delta\
    \ 编码用变长编码表示整数\n\n## Solution\n\nDelta 编码是另一种整数的变长编码[[4]](#part0000.html__ftn4)。数字\
    \ ![](img/00025.jpeg) 用 ![](img/00066.jpeg) 位表示。该整数分为两部分：前部分是不大于 `x` 的最大 2 的幂（假设为\
    \ ![](img/00064.jpeg)），通过对 gamma 编码数字 ![](img/00067.jpeg) 来表示。后部分是表示 ![](img/00065.jpeg)\
    \ 的剩余二进制位。\n\n## Code\n\n```cpp\nvoid deltaEncoding(unsigned int x)\n{\n  int\
    \ len = 0, lengthOfLen = 0, i;\n  for (int i = x; i > 0; i >>= 1) // 1+floor(log2(num))\n\
    \    len++;\n  for (int i = len; i > 1; i >>= 1) // floor(log2(len))\n    lengthOfLen++;\n\
    \  for (int i = lengthOfLen; i > 0; --i)\n    std::cout << 0;\n  for (int i =\
    \ lengthOfLen; i >= 0; --i)\n    std::cout << 0;\n  for (int i = len - 2; i >=\
    \ 0; --i)\n    std::cout << (x >> i);\n}\n```\n\n# 28. 无除法计算平均值\n\n## Solution\n\
    \n这解决了一个在二分查找实现 60 多年后才报告的 [[5]](#part0000.html__ftn5) Bug，通常实现方式如下：\n\n```cpp\n\
    int binSearch(int a[], unsigned int size, int key) {\n  int low = 0;\n  int high\
    \ = size;\n  while (low <= high) {\n    int mid = (low + high) / 2;\n    int midVal\
    \ = a[mid];\n    if (midVal < key)\n      low = mid + 1;\n    else if (midVal\
    \ > key)\n      high = mid - 1;\n    else\n      return mid; // key found\n  }\n\
    \  return -(low + 1); // key not found\n}\n```\n\n错误出现在 ![](img/0068.jpeg) 这一行，因为\
    \ ![](img/0069.jpeg) 和 ![](img/0070.jpeg) 之和大于 `int` 的最大值 ![](img/0071.jpeg)。在\
    \ C 和 C++ 中这会导致数组索引越界并产生不可预的结果。在其他语言中这会抛出异常。解决方案是计算 ![](img/0072.jpeg)。\n\n关于作者\n\
    \n一位经验丰富的数据挖掘工程师，对消费者领域的技术和创新充满热情。对海量数据集上的搜索和机器学习感兴趣，特别是查询分析、建议、实体、新鲜度和通用排名。Antonio\
    \ Gull 曾在小型、中型公司（Ask.com, Tiscali）以及大型企业（Microsoft）工作过。他的职业生涯是将工业界与学术经验相结合。\n\n\
    “如今，你必须具备研究能力和解决问题的态度。”\n\n* *\n\n[[1]](#part0000.html__ftn1) [http://en.wikipedia.org/wiki/Gray_code]\n\
    [[2]](#part0000.html__ftn2) [http://en.wikipedia.org/wiki/Inverted_index]\n[[3]](#part0000.html__ftn3)\
    \ [http://nlp.stanford.edu/IR-book/html/htmledition/gamma-codes-1.html]\n[[4]](#part0000.html__ftn4)\
    \ [http://nlp.stanford.edu/IR-book/html/htmledition/gamma-codes-1.html]\n[[5]](#part0000.html__ftn5)\
    \ [http://googleresearch.blogspot.co.uk/2006/06/extra-extra-read-all-about-it-nearly.html]\n"
