  \ 0; i = i >> 1) {\n        if (n & i) std::cout << 1;\n        else std::cout <<\
  \ 0;\n    }\n}\n```\n\n## 3. 判断一个无符号数是否为 2 的幂\n\n### 解决方案\n\n假设该数非零。如果它是 2 的幂，那么唯一的置\
  \ 1 比特位于位置![](img/0007.jpeg)。在这种情况下我们减去 1，因此 ![](img/0008.jpeg) 左的所有位都会被置零。因此，一个正数![](img/0009.jpeg)是\
  \ 2 的幂当且仅当 ![](img/0010.jpeg) 为 0。注意这种检查仅适用于 ![](img/0011.jpeg)。\n\n```cpp\nbool\
  \ isPowerOfTwo(unsigned n) {\n    return n && (!(n & (n - 1)));\n}\n```\n\n## 4.\
