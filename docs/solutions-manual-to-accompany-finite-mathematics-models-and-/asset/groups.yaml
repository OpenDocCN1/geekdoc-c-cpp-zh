    练习 1.2


    11. “时间”和“机器价值”的有序数对分别为 (0, 75,000) 和 (9, 21,000)。斜率为

    $m = \frac{21,000 - 75,000}{9 - 0} = \frac{-54,000}{9} = -6000$。y 轴截距为初始购买价格，$75,000。模拟线性折旧的方程为
    $V(t) = -6000t + 75,000$，其中 $V(t)$ 是时间 $t$ 时的机器价值。


    13. （加仑，英里）的有序数对为 (7, 245) 和 (12, 420)。

    斜率为 $\frac{420 - 245}{12 - 7} = \frac{175}{5} = 35$，对应于 $x$ 加仑和英里。

    使用其中任意一个点通过点斜式公式。

    因此，$y - 245 = 35(x - 7)$ 或 $y = 35x$。


    15. 总成本包括固定成本和变动成本。固定成本是月租（$1100）。变动成本是 $5x$，其中 $x$ 是每月产量。因此，总成本 $C(x) = 1100
    + 5x$。


    17. a) 在这里，固定成本为每天 $50，变动成本为每英里 $0.30。租用一天汽车花费 $50，还需在此加上里程费用。成本为 $C(x) = 50 +
    0.30x$。


    b) 如果一个人有 $110 用于租赁，求解旅行距离的方程为 $110 = 50 + 0.30x$。

    求解得出：


    $60 = 0.30x$

    $\frac{60}{0.30} = x$

    $200 = x$


    此人可以用 $110 租车并行驶 200 英里。


    19. 由于 $R$ 是 $C$ 的函数，有序数对为 $(C, R)$。

    两个有序数对为 (70, 84) 和 (40, 48)。斜率为 $48 - 84 = \frac{36 - 6}{40 - 70} = \frac{30}{-30}$。使用其中任意一个点结合斜率得到
    $R - 84 = (6/5)(C - 70)$ 或 $R = (6/5)C$。


    # 8 线性方程与数学概念


    ## 练习 1.3


    - 1. 有序对必须满足每个方程才能成为该方程组的解。


    - a) 2(3) + 1 = 7 是成立的，但 3 + 1 = 5 不成立。因此，3, 1) 不是该方程组的解。


    - b) 2(2) + 3 = 7 是成立的，2 + 3 = 5 也是的。因此，2, 3) 是该方程组的解。


    - c) 2(4) + 1 = 7 是成立的，但 4 + (-1) = 5 不成立。因此，4, -1) 不是该方程组的解。


    - 3. a) y = (-1/3)x + (8/3) 和 y = -x + 6，m1 = -1/3 且 m2 = -1。由于斜率不同，这是一个相方程组。


    - b) y = (-1/2)x + (7/2) 和 y = (-1/2)x + (7/2)。由于斜率和截距都相同，这两个方程是同一条直线。这是一个相关方程组。


    - c) y = (-3/2)x + (7/2) 和 y = (-3/2)x + 5。在这里，斜率平行且截距不同。这些直线是不相容的。


    - 5. 每个方程组的图像和解为：


    ![](img/eacc066221ab5a84d2e4c7c136743e03_15_0.png)


    ![](img/eacc066221ab5a84d2e4c7c136743e03_15_1.png)


    ![](img/eacc066221ab5a84d2e4c7c136743e03_15_2.png)


    - 7. 给定 $x = 3$ 并代入第二个方程得到

    $3 + 3y = 9, 3y = 6$，且 $y = 2$。有序对解为 $(3, 2)$。


    b) 使用 $y - 2 = 0, y = 2$。代入第二个方程得到 $x + 3(2) = 9, x + 6 = 9$，且 $x = 3$。有序对解为 $(3,
    2)$。


    c) 第二个方程已经解出了 $y$，代入第一个方程 $x + (-x + 3) = 5$ 或 $3 = 5$。这是错误的，所以该方程组是不相容的且无解。


    - 9. 在这里，只需直接相加两个方程即可消去 $x$。


    ```

    $$-x + 2y = 5

    x + y = 4

    3y = 9$ 或 $y = 3$

    ```


    接下来，使用 $y = 3$ 确定 $x = 1$。有序对解为 $(1, 3)$。


    b) 在这里，通过将第二个方程乘以 3 可以消去 $y$。方程组重写为：


    ```

    $$-4x + 3y = 35

    6x - 3y$

    ```


    两个方程相加得到 $10x = 50$，即 $x = 5$。使用这个 $x$ 的值得到 $y$ 也是 $5$。（通过原方程检查 $(5, 5)$。）


    c) 第二个方程必须先重写为标准形式 $ax + by = c$，所以求解的方程组为：


    ```

    $-x + 4y = 13

    4x - 2y = 10

    ```


    将第一个方程乘以 $-4$ 可以消去方程组中的 $x$。


    ```

    $-4x - 16y = -52

    4x - 2y = 10

    -14y = -42$ 或 $y = 3$

    ```


    使用 $y = 3$，确定 $x = 1$。（通过原方程检查解 $(1, 3)$）。


    ![](img/eacc066221ab5a84d2e4c7c136743e03_16_0.png)


    d) 将第一个方程重写为标准形式并乘以 2 以消去 $x$，得到：


    ```

    -2x + 2y = 8

    2x + 3y = 12

    5y = 20 或 y = 4

    ```


    如果 y = 4，x = 0，在原方程中检查 (0, 4) 是解。


    - 11. 让 $x$ 代表饼干盒的数量，$y$ 代表糖果盒的数量。求解的方程组为：


    ```

    x + y = 240

    4x + 5y = 900

    ```


    - 13. 让 $x$ = 普通油加仑，$y$ = 高级油加仑。求解的方程组（使用代入法或消元法）：


    ```

    x + y = 100

    0.87x + 0.93y = 92

    ```


    - 15. 市场均衡发生在 $q$ 约为 30，$y$ 约为 260 时。使用代入法 $2q + 320 = 500$ 得到正确的解。


    ![](img/eacc066221ab5a84d2e4c7c136743e03_17_0.png)


