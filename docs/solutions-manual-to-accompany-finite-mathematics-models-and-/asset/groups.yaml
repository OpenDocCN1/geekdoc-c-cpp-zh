    45. $B = 1321 + (0.3433)(20000) = 1321 + 6866 = 8187$.


    # EXERCISES 1.2


    1. Setting $y = 0$ determines the $x$-intercept and setting $x = 0$ determines
    the $y$-intercept.


    a) $5x - 3y = 15$ $x$-intercept 3, $y$-intercept $-5$

    b) $y = 4x - 5$ $x$-intercept $5/4$, $y$-intercept $-5$

    c) $2x + 3y = 24$ $x$-intercept 12, $y$-intercept 8

    d) $9x - y = 18$ $x$-intercept 2, $y$-intercept $-18$

    e) $x = 4$ $x$-intercept 4, no $y$-intercept (vertical line)

    f) $y = -2$ no $x$-intercept (horizontal line), $y$-intercept -2


    3. The slope is $m = \frac{y_2 - y_1}{x_2 - x_1}$.


    a) $(3, 6)$ and $(-1, 4)$ $m = \frac{4 - 6}{-1 - 3} = \frac{-2}{-4} = \frac{1}{2}$

    b) $(1, 6)$ and $(2, 11)$ $m = \frac{11 - 6}{2 - 1} = \frac{5}{1} = 5$

    c) $(6, 3)$ and $(12, 7)$ $m = \frac{7 - 3}{12 - 6} = \frac{4}{6} = \frac{2}{3}$

    d) $(2, 3)$ and $(2, 7)$ $m = \frac{7 - 3}{2 - 2} = \frac{4}{0} = undefined$

    e) $(2, 6)$ and $(5, 6)$ $m = \frac{6 - 6}{5 - 2} = \frac{0}{3} = 0$

    f) $(5/3, 2/3)$ and $(10/3, 1)$ $m = \frac{1 - 2/3}{10/3 - 5/3} = \frac{1/3}{5/3}
    = \frac{1}{5}$


    5. a) $x$-intercept 5/2 and $y$-intercept

    b) $x$-intercept 4 and no $y$-intercept

    c) $x$-intercept 5 and $y$-intercept 3

    d) $x$-intercept 7 and $y$-intercept 2


    7. a) $y = (5/3)x + 2$ and $5x - 3y = 10$; the slope of the first line is 5/3.
    Solving for y in the second equation $y = (5/3)x - (10/3)$. This slope is also
    5/3. The slopes are (5/3) so the lines are parallel.

    b) $6x+2y = 4$ and $y = \frac{1}{3}x + 1$. The slope of the second line is easily
    determined (line in slope intercept form) as 1/3. Again, solve for y in the first
    equation to determine $y = -3x + 2$. The slope is -3. The slopes are negative
    reciprocals; the lines are perpendicular.

    c) $2x - 3y = 6$ and $4x - 6y = 15$. Solving for y in each equation, one determines
    that $y = (2/3)x - 2$ and $y = (2/3)x - (5/2)$. These lines have the same slope
    (and different intercepts) making them parallel.

