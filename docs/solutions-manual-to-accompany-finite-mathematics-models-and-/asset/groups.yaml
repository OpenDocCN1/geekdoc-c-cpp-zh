    # CHAPTER 1

    # LINEAR EQUATIONS AND MATHEMATICAL CONCEPTS


    # EXERCISES 1.1


    1. $3x + 1 = 4x - 5$

    $1 = x - 5$

    $x = 6$ conditional equation


    2. $5(x + 1) + 2(x - 1) = 7x + 6$

    $5x + 5 + 2x - 2 = 7x + 6$

    $7x + 3 = 7x + 6$ contradiction


    3. $4(x + 3) = 2(2x + 5)$

    $4x + 12 = 4x + 10$ contradiction


    7. $5x - 3 = 17$

    $5x = 20$

    $x = 4$


    9. $2x = 4x - 10$

    $2x - 4x = -10$

    $-2x = -10$

    $x = 5$


    11. $4x - 5 = 6x - 7$

    $-5 + 7 = 6x - 4x$

    $2 = 2x$

    $1 = x$


    13. $0.6x = 30$

    $x = 30/0.60 = 50$


    15. $2/3 = (4/5)x - (1/3)$ multiply by 15 to eliminate fractions

    $1(2/3) = 15 \{(4/5)x - (1/3)\}$

    $10 = 12x - 5$

    $15 = 12x$

    $5/4 = x$


    17. $5(x - 4) = 2x + 3(x - 7)$

    $5x - 20 = 2x + 3x - 21$

    $5x - 20 = 5x - 21$

    No solution


    19. $3s - 4 = 2s + 6$

    $s - 4 = 6$

    $s = 10$


    21. $7t + 2 = 4t + 11$

    $7t - 4t = 11 - 2$

    $3t = 9$

    $t = 3$


    23. $4(x + 1) + 2(x - 3) = 7(x - 1)$

    $4x + 4 + 2x - 6 = 7x - 7$

    $6x - 2 = 7x - 7$

    $5 = x$


    25. $\frac{x+8}{2x-5} = 2$ multiply by $2x - 5$ to eliminate the fraction

    $(x+8) = 2(2x-5)$

    $x + 8 = 4x - 10$

    $18 = 3x$

    $x = 6$ (Check the result. Multiplication by a factor such as $2x-5$ can introduce
    an extraneous solution.)


    27. $8 - \{4(x - 4)\} = 3(x - 4)$

    $8 - 4x + 16 = 3x - 12$

    $24 - 4x = 3x - 12$

    $36 = 7x$

    $x = 36/7$


    29. $6x - 3y = 9$ for $x$

    $6x = 3y + 9$

    $x = \frac{3y+9}{6} = \frac{y+3}{2}$


    31. $3x + 5y = 15$ for $y$

    $5y = 15 - 3x$

    $y = \frac{15-3x}{5} = 3 - \frac{3}{5}x$


    33. $V = L - \frac{3}{5}x$ for $x$

    $\frac{3}{5}x = L - V$

    $x = \frac{5}{3}(L - V)$


    35. $Z = Y - \frac{3}{5}x$ for $x$

    $\frac{3}{5}x = Y - Z$

    $x = \frac{5}{3}(Y - Z)$


    37. Let $x = 300$ down, she owes $\$1000$. Therefore, $x = 200$ is the monthly
    installment. The consumption function is $C(x) = 0.75x + b$. The slope is the
    marginal propensity to consume. $C(x) = 0.75x + b$ yields $b = 9.5$.


    39. $C(x) = 0.75x + b$. The disposable income, $x = 2$, yields $11 = 0.75(2) +
    b$.

    $11 = 1.5 + b$

    $b = 9.5$.


