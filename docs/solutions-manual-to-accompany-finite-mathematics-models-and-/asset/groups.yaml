    = $(F_4)^2 + 2F_4F_5 + (F_5)^2$

    = $(F_4 + F_5)^2 = (F_6)^2$.

    ```


    Continuing in this manner, the squaring rectangles assertion can be verified.

    Suppose that $n=2$, then $\Phi^2 = F_2\Phi + F_1 = \Phi + 1$, as verified in the
    previous exercise.

    $\Phi^3 = (\Phi^2)\Phi = (\Phi+1)\Phi = \Phi^2+\Phi = (\Phi+1)+\Phi = 2\Phi+1$,
    and since $F_3=2$ and $F_2=1$ so $\Phi^3 = F_3\Phi + F_2$. Next,

    $\Phi^4 = (\Phi^3)\Phi = (2\Phi+1)\Phi = 2\Phi^2+\Phi = 2(\Phi+1)+\Phi = 3\Phi+2$
    and since $F_4=3$ and $F_3=2$, one has $\Phi^4 = F_4\Phi + F_3$. Continuing

    can be shown that $\Phi^n = F_n\Phi + F_{n-1}$.


