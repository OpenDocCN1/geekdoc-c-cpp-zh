    Likewise, $A \cap B$ is region I and $B \cap A$, verifying the commutative property
    for intersections of sets.

    Using the Venn diagram with two overlapping circles to establish the associative
    properties, one has


    ```

    $A \cup (B \cup C) = \{I, II, III, V\} \cup \{I, II, III, IV, VI, VII\}$$

    = \{I, II, III, IV, V, VII\}$$

    $(A \cup B) \cup C = \{I, II, III, IV, V\} \cup \{I, III, IV, VII\}$$

    = \{I, II, III, IV, V, VI, VII\}$$

    $A \cap (B \cap C) = \{I, II, III\} \cap \{I, IV\} = \{I\}$$

    $(A \cap B) \cap C = \{I, II\} \cap \{I, III, IV, VII\} = \{I\}$

    ```


    To establish the distributive properties, one has


    ```

    $A \cup (B \cap C) = (A \cup B) \cap (A \cup C)$$

    $\{I, II, III, V\} \cup \{I, IV\}$$

    = \{I, II, III, IV, V, VI\} \cap \{I, II, III, IV, VII\}$$

    $\{I, II, III, IV, V\} = \{I, II, III, IV\}$

    ```


    and


    ```

    $A \cap (B \cup C) = (A \cap B) \cup (A \cap C)$$

    $\{I, II, III, V\} \cap \{I, III, IV, VI, VII\} = \{I, II\} \cup \{I, III\}$$

    $\{I, III\} = \{I, II, III\}$

