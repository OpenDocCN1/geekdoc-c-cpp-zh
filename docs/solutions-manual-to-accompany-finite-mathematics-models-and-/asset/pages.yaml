  md: '# LINEAR EQUATIONS AND MATHEMATICAL CONCEPTS


    59. Using logarithms, $10^{3x-1} = 100,100$ is written as

    $\log_{10}10^{3x-1} = \log_{10}100,100$. This yields $3x - 1 = \log_{10}100,100$.

