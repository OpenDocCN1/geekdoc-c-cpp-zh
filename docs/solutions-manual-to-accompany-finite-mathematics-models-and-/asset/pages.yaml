  md: '7. Given $x = 3$ and substituting in the second equation yields

    $3 + 3y = 9, 3y = 6$, and $y = 2$. The ordered pair solution is $(3, 2)$.


    b) Using, $y - 2 = 0, y = 2$. Substituting into the second equation yields $x
    + 3(2) = 9, x + 6 = 9$, and $x = 3$. The ordered pair solution is $(3, 2)$.


    c) The second equation, already solved for $y$, substituted in the first equation
    $x + (-x + 3) = 5$ or $3 = 5$. This is false, so the system is inconsistent and
    has no solution.


    9. Here, $x$ can be eliminated by simply adding the two equations as written.


    ```

    $$-x + 2y = 5

    x + y = 4

    3y = 9$ or $y = 3$

    ```


    Next, use $y = 3$ to determine $x = 1$. The ordered pair solution is $(1, 3)$.


    b) Here, $y$ can be eliminated by multiplying the second equation by 3. The system
    is rewritten as


    ```

    $$-4x + 3y = 35

    6x - 3y = 15$

    ```


    Adding the two equations yields $10x = 50$ or $x = 5$. Using this value for $x$
    yields that $y$ is also $5$. (Check the solution in the original equation to see
    that $(5, 5)$ is correct.)


    c) The second equation must first be rewritten in standard form $ax + by = c$,
    so the system to solve is


    ```

    $$-x + 4y = 13

    4x - 2y = 10$

    ```


    Multiplying the first equation by $-4$ will allow $x$ to be eliminated from the
    system.


    ```

    $$-4x - 16y = -52

    4x + 2y = 10

    -14y = -42$ or $y = 3$

    ```


    Using $y = 3$, it is determined that $x = 1$. (Check the solution in the original
    system to verify the solution $(1, 3)$).


