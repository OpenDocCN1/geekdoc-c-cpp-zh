  {\ncharacter.stopFalling(block.top);\n}\nelse if (character.getHead().intersects(block))\n\
  {\ncharacter.stopJump();\n}\n}\n// 等我们学习了粒子效果后，在这里添加更多碰撞检测\n\n// 角色的脚是否碰到了火或水？ //\
  \ 如果是，则启动粒子效果\n\n// 确保这是我们第一次检测到这一点 // 通过检查效果是否已经在运行\n\nif (!m_PS.running())\n{\n\
  if (m_ArrayLevel[y][x] == 2 || m_ArrayLevel[y][x] == 3) { if (character.getFeet().intersects(block))\
  \ {\n// 设置位置并启动粒子系统 m_PS.emitParticles(character.getCenter()); }\n\n}\n}\n\n// 角色是否到达了目标？\
