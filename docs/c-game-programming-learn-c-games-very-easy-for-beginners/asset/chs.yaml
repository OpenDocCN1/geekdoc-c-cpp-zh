  \ Studio\\Projects\\TWL\\TWL\\shaders` 文件夹。\n\n现在我们有了一个新项目，以及整个项目所需的所有资源，我们可以讨论将如何组织游戏引擎代码。\n\
  \n# 组织 Thomas Was Late 代码\n\n到目前为止，这两个项目中一个非常显著的问题是代码变得非常冗长且难以管理。OOP（面向对象编程）允许我们将项目拆分为逻辑清晰且于管理的块，称为类。\n\
  \n通过引入 `Engine` 类，我们将对该项目代码的可管理性进行重大改进。除了其他函数外，`Engine` 类将三个私有函数。它们是 `input`、`update`\
  \ 和 `draw`。这听起来非常熟悉。每个函数都将包含之前全部在 `main` 函数中的代码块。每个函数都将分别位于自己的代码文件中，即 `Input.cpp`、`Update.cpp`\
  \ 和 `Draw.cpp`。\n\n`Engine` 类中还有一个公共函数，可以通过 `Engine` 实例调用。该函数运行后将负责在游戏的每一帧中调用一次\
  \ `input`、`update` 和 `draw`：\n\n![](img/image00289.jpeg)\n\n此外，由于我们已经将游戏引擎的主要部分抽象到\
  \ `Engine` 类，我们还可以将许多变量从 `main` 移动并使其成为 `Engine` 的成员。启动我们的游戏引擎只需要创建一个 `Engine` 实例并调用其\
  \ `run` 函数。这里是极其简单的 `main` 函数的预览：\n\n```cpp\nint main()\n{\n    // 声明一个 Engine 实例\n\
  \    Engine engine; \n    // 启动引擎\n    engine.run();\n    // 当引擎停止时按通常方式退出\n   \
  \ return 0;\n}\n```\n\n### 提示\n\n先不要添加上述代码。\n\n为了让我们的代码更具可管理可读性，我们还将把大任务（如加载关卡和碰撞检测）的责任抽象到分离的函数（在单独的代码文件中）。这两个函数是\
  \ `loadLevel` 和 `detectCollisions`。我们还将编写其他函数来处理 Thomas Was Late 项目的一些新功能。我们将在它们出现时进行详细介绍。\n\
  \n为了进一步利用 OOP，我们将把游戏特定区域责任完全委托给新类。你可能记得在之前的项目中，声音和 HUD 的代码非常长。我们将构建 `SoundManager`\
  \ 和 `HUD` 类来以更整洁的方式处理这些方面。它们具体如何工作将在我们实现它们时深入探讨。\n\n游戏关卡本身比之前的游戏深入得多，因此我们还将编写一个\
  \ `LevelManager` 类。\n\n正如你所预期的，可用角色也将用类来制作。然而对于这个项目，我们将学习更多的 C++ 并实现一个具有 Thomas\
  \ 和 Bob 所有共同功能的 `PlayableCharacter` 类，然后是 `Thomas` 和 `Bob` 类，这些类将继承这些共同功能，并实现它们独特的函数和能力。这可能并不意料地被称为\
  \ `inheritance`（继承）。我将在接下来的第 13 章*高级 OOP、继承与多态*中详细介绍继承。\n\n\n\n\n我们还将实现许多其他类来执行特定的职责。例如，我们将使用粒子系统制作一些酷炫的爆炸效果。你可能猜到，为了实现这一点，我们将编写一个\
  \ `Particle` 类和一个 `ParticleSystem` 类。所有这些类都将作为 `Engine` 类的成员实例。通过这种方法可以从游戏引擎访问游戏的所有功能，同时将细节封装在适当的类中。\n\
  \n在继续查看构建 `Engine` 类实际代码之前，最后需要提到的一点是，我们将不做任何修改，直接复用 `TextureHolder` 类，这是我们之前为“僵尸竞技场（Zombie\
  \ Arena）”游戏讨论并编写的类。\n\n# 构建游戏引擎\n\n正如之前的讨论所建议，我们将编写一个名为 `Engine` 的类，它将控制并把《Thomas\
  \ Was Late》游戏中的不同部分结合在一起。\n\n我们要做的第一件事是将上一个项目中的 `TextureHolder` 类引入本项目中。\n\n## 复用\
  \ TextureHolder 类\n\n为“僵尸竞技场”游戏讨论并编写的 `TextureHolder` 类在这个项目中也会很有用。虽然可以从上一个项目直接添加文件（`TextureHolder.h`\
  \ 和 `TextureHolder.cpp`），而无需重新编码或重新创建文件，但我不想假设你没有直接跳到这个项目。以下是简短的说明，以及创建 `TextureHolder`\
  \ 类的完整代码列表。如果你想了解该类或代码的详细解释，请参阅第 8 章，*指针、标准模板库与纹理管理*。\n\n### 提示\n\n如果你完成了上一个项目并*确实*想添加“僵尸竞技场”项目中的该类，只需执行以下操作：在**解决方案管理器（Solution\
  \ Explorer）**窗口中，右键点击**头文件（Header Files）**并选择`添加 (Add)` | `现有项... (Existing Item...)`。浏览到上项目的\
  \ `TextureHolder.h` 并选择它。在**解决方案管理器**窗口中，右键点击**源文件（Source Files）**并选择`添加 (Add)`\
  \ | `现有项... (Existing Item...)`。浏览到上项目的 `TextureHolder.cpp` 并选择它。你现在可以在此项目中使用 `TextureHolder`\
  \ 类。请注意，项目之间是共享文件的，任何更改都将在两个项目中生效。\n\n要从零开始创建 `TextureHolder` 类，在**解决方案管理器**中右键点击**头文件**并选择`添加\
  \ (Add)` | `新建项... (New Item...)`。在**添加新项**窗口中，选中（通过左键点击）**头文件 (.h)**，然后在**名称（Name）**字段中输入\
  \ `TextureHolder.h`。最后，点击**添加（Add）**按钮。\n\n将以下代码添加到 `TextureHolder.h`：\n\n```cpp\n\
  \ #pragma once\n\n#ifndef TEXTURE_HOLDER_H\n#define TEXTURE_HOLDER_H\n\n#include\
  \ <SFML/Graphics.hpp>\n#include <map>\n\nclass TextureHolder {\n\nprivate:\n\n//\
  \ 一个来自 STL 的 map 容器，\n// 用于存放相关的 String 和 Texture 键对\nstd::map<std::string, sf::Texture>\
  \ m_Textures;\n\n// 与类本身类型相同的指针 // 唯一的实例\nstatic TextureHolder* m_s_Instance;\n\n\
  public:\n\nTextureHolder();\n\nstatic sf::Texture& GetTexture(std::string const&\
  \ filename); \n};\n\n#endif\n```\n\n在**解决方案管理器**中右键点击**源文件**并选择`添加 (Add)` | `新建项...\
  \ (New Item...)`。在**添加新项**窗口中，选中（通过左键点击）**C++ 文件 (.cpp)**，然后在**名称（Name）**字段中输入 `TextureHolder.cpp`。最后，点击**添加（Add）**按钮。\n\
  \n将以下代码添加到 `TextureHolder.cpp`：\n\n```cpp\n #include \"stdafx.h\"\n\n#include \"\
  TextureHolder.h\"\n\n#include <assert.h>\n\nusing namespace sf;\n\nusing namespace\
  \ std;\n\nTextureHolder* TextureHolder::m_s_Instance = nullptr;\n\nTextureHolder::TextureHolder()\n\
  {\nassert(m_s_Instance == nullptr); m_s_Instance = this;\n}\n\nsf::Texture& TextureHolder::GetTexture(std::string\
  \ const& filename)\n{\n// 使用 m_S_Instance 获取 m_Textures 的引用\nauto& m = m_s_Instance->m_Textures;\n\
  // auto 等同于 map<string, Texture>\n// 创建一个迭代器来保存键值对 (kvp) // 使用传入的文件名搜索所需的 kvp\n\
  auto keyValuePair = m.find(filename);\n// auto 等同于 map<string, Texture>::iterator\n\
  // 我们找到匹配项了吗？if (keyValuePair != m.end()) {\n// 是\n// 返回纹理，\n// kvp 的第二个部分，即纹理\n\
  return keyValuePair->second;\n}\nelse\n{\n// 未找到文件名\n// 使用文件名创建一个新的键对\nauto& texture\
  \ = m[filename];\n// 按通常方式从文件加载纹理\ntexture.loadFromFile(filename); \n// 将纹理返回给调用代码\n\
  return texture;\n}\n}\n```\n\n我们现在可以继续编写 `Engine` 类了。\n\n## 编写 Engine.h\n\n照常，我们将从头文件开始，它包含了函数声明和成员变量。注意，我们在整个项目中反复访问此文件以添加更多函数和成员变量。目前，我们只添加此阶段所需的代码。\n\
  \n在**解决方案管理器**中右键点击**头文件**并选择`添加 (Add)` | `新建项... (New Item...)`。在**添加新项**窗口中，选中（通过左键点击）**头文件\
  \ (.h)**，然后在**名称（Name）**字段中输入 `Engine.h`。最后，点击**添加（Add）**按钮。我们现在准备好编写 `Engine` 类的头文件了。\n\
  \n添加以下成员变量以及函数声明。其中许多我们已经在其他项目中见过，有些我们已经在*构建 Thomas Was Late* 代码部分中讨论过。请注意函数和变量的名称，以及它们是私有的还是公共的。将以下代码添加到\
  \ `Engine.h` 文件中，然后我们来讨论：\n\n```cpp\n #pragma once\n\n#include <SFML/Graphics.hpp>\n\
  \n#include \"TextureHolder.h\"\n\nusing namespace sf;\n\nclass Engine\n{\n\nprivate:\n\
  \n// 纹理持有器\nTextureHolder th;\n\nconst int TILE_SIZE = 50;\n\nconst int VERTS_IN_QUAD\
  \ = 4;\n\n// 向下推力的力\nconst int GRAVITY = 300;\n\n// 一个普通的渲染窗口\nRenderWindow m_Window;\n\
  \n// 主视图 View\nView m_MainView; View m_LeftView; View m_RightView;\n\n// 背景的三个视图\n\
  View m_BGMainView;\n\nView m_BGLeftView;\n\nView m_BGRightView;\n\nView m_HudView;\n\
  \n// 用于背景的精灵类和纹理\nSprite m_BackgroundSprite;\n\nTexture m_BackgroundTexture;\n\n\
  // 游戏是否正在运行？ bool m_Playing = false;\n\n// 角色 1 或 2 是否是当前焦点？ bool m_Character1 =\
  \ true;\n\n// 以全屏模式启动 bool m_SplitScreen = false;\n\n// 当前关卡剩余多少时间 float m_TimeRemaining\
  \ = 10;\n\nTime m_GameTimeTotal;\n\n// 是否需要新关卡/第一关卡？ bool m_NewLevelRequired = true;\n\
  \n// 内部使用的私有函数 void input();\n\nvoid update(float dtAsSeconds);\n\nvoid draw();\n\
  \npublic:\n\n// Engine 构造函数 Engine();\n\n}; \n\n// Run 将调用所有私有函数 void run();\n```\n\
  \n\n\n前三个 `View` 对象分别用于全屏视图，以及游戏的左右分屏视图。我们还为这三个视图中的每一个都准备了一个独立的 `SFML View` 对象，用于在后面绘制背景。最后一个\
  \ `View` 对象 `m_HudView` 将绘制在其他六个视图的相应组合之上，用于显示分数、剩余时间以及给玩家的任何消息。拥有七个不同的 `View` 对象可能意味着很复杂，但随着章节的进行，当你看到我们如何处理它们时，你会它们非常简单。在本章结束之前，我们将解决整个分屏/全屏的难题。\n\
  \n### 精形 `m_BackgroundSprite` 和 纹理 `m_BackgroundTexture`\n\n不出所料，这种 SFML `Sprite`\
  \ 和 `Texture` 的组合将用于显示和持有来自图形资源文件夹的背景图。\n\n`m_Playing`: 这个 `Boolean` 变量将告知游戏引擎关是否已经开始（通过按下\
  \ `Enter` 键）。一旦开始游戏，玩家没有暂停游戏的选择。\n\n`m_Character1`: 当屏幕处于全屏模式时，它应该居于托马斯 (`m_Character1\
  \ = true`) 还是鲍 (`m_Character1 = false`) 的中心？初始它被初始化为 `true`，以托马斯为中心。\n\n`m_SplitScreen`:\
  \ 游戏当前是否以分屏模式运行？我们将使用这个变量来决定具体如何使用几步前声明的所有 `View` 对象。\n\n`m_TimeRemaining` 变量: 这个\
  \ `float` 变量持有到达当前关卡目标剩余的时间。在之前的代码中，为了测试，它设置为 10，直到我们实际上为每个关卡设置特定的时间。\n\n`m_GameTimeTotal`\
  \ 变量: 这个变量是一个 `SFML Time` 对象。它记录了游戏运行了。\n\n`m_NewLevelRequired` `Boolean` 变量: 这个变量检查玩家是否刚刚完成或失败了一个关卡。我们可以用它触发加载下一个关卡或重启当前关卡。\n\
  \n### input 函数\n\n`input` 函数将处理玩家的所有输入，在游戏中，这些输入完全来自键盘。乍一看，它似乎直接处理所有键盘输入。然而，在游戏中，我们将直接在\
  \ `Thomas` 和 `Bob` 类中处理直接影响托马斯或鲍的键盘输入。我们将调用 `input` 函数，该函数将直接处理如退出、切换到分屏以及任何其他键盘输入。\n\
  \n### update 函数\n\n`update` 函数将完成我们之前在 `main` 函数的 `update` 部分所做的工作。我们还将从 `update`\
  \ 函数调用其他函数以保持代码的组织性。如果你回看代码，你会发现它接收一个 `float` 参数，该参数持有自上一帧以来经过的秒数分数。当然，这正是我们更新所有游戏对象所需要的。\n\
  \n### draw 函数\n\n`draw` 函数将包含以前在项目中位于 `main` 函数绘图部分的所有代码。然而，当我们查看使用 SFML 绘图的其他方法时，会有一些绘制代码不会保留在这个函数中。当我们在学习第\
  \ 16 章 *扩展 SFML 类、粒子系统和着色器* 的时候，我们将看到这些新代码。\n\n现在让我们过一遍所有的公共函数：\n\n### Engine 构造函数函数\n\
  \n正如我们预期的那样，该函数会在我们第一次声明 `Engine` 实例时被调用。它将完成该类的所有设置和初始化。稍后在我们编写 `Engine.cpp` 文件时，我们将看到具体的内容。\n\
  \n### run 函数\n\n这是我们需要调用的唯一公共函数。它将触发 `input`、`update` 和 `draw` 的执行，它们将完成所有工作。\n\n\
  接下来，我们将看到所有函数的定义以及一些变量的运行。\n\n## 编写 Engine.cpp\n\n在我们之前所有的类中，我们将所有的函数定义都放在 `.cpp`\
  \ 文件中，并以类名名前缀。由于我们项目的目标是让代码更易于，我们正在采取稍微不同的方法。\n\n在 `Engine.cpp` 文件中，我们将放入构造函数 (`Engine`)\
  \ 和公共函数 `run`。其余所有函数将放在它们自己的 `.cpp` 文件中，名称将清楚说明哪个函数放在哪里。只要我们在所有包含 `Engine` 类函数定义的文件顶部添加适当的包含指令（`#include\
  \ \"Engine.h\"`），这对编译器来说就没有问题。\n\n让我们从编写 `Engine` 并在 `Engine.cpp` 中运行它开始。在 `Solution\
  \ Explorer` 中右键点击 `Source Files` 并选择 `Add` | `New Item...`。在 `Add New Item` 窗口中，选中（左单击）`C++\
  \ File (.cpp)`，然后在 `Name` 字段中输入 `Engine.cpp`。最后，点击 `Add` 按钮。我们现在准备好为 `Engine` 类编写\
  \ `.cpp` 文件了。\n\n## 编写 Engine 类构造函数定义\n\n该函数的代码将放在我们最近创建的 `Engine.cpp` 文件中。\n\n\
  添加以下代码然后我们可以讨论它：\n\n```cpp\n#include \"stdafx.h\"\n#include \"Engine.h\"\n\nEngine::Engine()\n\
  {\n    // 获取屏幕分辨率\n    // 并创建一个 SFML 窗口和视图\n    Vector2f resolution;\n    resolution.x\
  \ = VideoMode::getDesktopMode().width;\n    resolution.y = VideoMode::getDesktopMode().height;\n\
  \    m_Window.create(VideoMode(resolution.x, resolution.y), \"Thomas was late\"\
  , Style::Fullscreen);\n\n    // 初始化全屏视图\n    m_MainView.setSize(resolution);\n \
  \   m_HudView.reset(FloatRect(0, 0, resolution.x, resolution.y));\n\n    // 初始化分屏视图\n\
  \    m_LeftView.setViewport(FloatRect(0.001f, 0.001f, 0.498f, 0.998f));\n    m_RightView.setViewport(FloatRect(0.5f,\
  \ 0.001f, 0.499f, 0.998f));\n    m_BGLeftView.setViewport(FloatRect(0.001f, 0.001f,\
  \ 0.498f, 0.998f));\n    m_BGRightView.setViewport(FloatRect(0.5f, 0.001f, 0.499f,\
  \ 0.998f));\n\n    m_BackgroundTexture = TextureHolder::GetTexture(\"graphics/background.png\"\
  );\n\n    // 将精形与纹理关联\n    m_BackgroundSprite.setTexture(m_BackgroundTexture);\n\
  }\n```\n\n很多代码我们之前见过过了。例如，有获取屏幕分辨率以及创建 RenderWindow 的常规代码。在之前代码的末尾，我们使用了现在熟悉的代码来加载纹理并将其分配给\
  \ Sprite。在这种情况下，我们正在加载 `background.png` 纹理并将其赋值给 `m_BackgroundSprite`。\n\n中间的代码，即四次调用\
  \ `setViewport` 的部分，需要一些解释。`setViewport` 函数将屏幕的一部分分配给 SFML View 对象。然而，它不是使用像素坐标工作。它是使用比例工作的。其中“1”代表整个屏幕（宽度或高度），每次调用\
  \ `setViewport` 的前两个值是起始位置（水平，然后是垂直），最后两个值是结束位置。\n\n注意 `m_LeftView` 和 `m_BGLeftView`\
  \ 被放置在完全相同的位置，从屏幕的最左侧（0.001）开始，在距离中心两千分之一处（0.498）结束。\n\n而 `m_RightView` 和 `m_BGRightView`\
  \ 也处于完全相同的位置，从前两个对象的左侧（0.5）开始，一直延伸到屏幕的最右侧（0.998）。\n\n此外，所有视图在屏幕的顶部和底部留下了细微的间隙。当我们在白色背景的屏幕上绘制这些\
  \ View 对象时，它将产生在屏幕两侧之间有一条细白线来分割屏幕的效果，同时边缘带有一圈细的白色边框。\n\n我尝试通过下面的图表表示这种效果：\n\n![](img/image00290.jpeg)\n\
  \n最好的理解方式是完成本章，运行代码并看到它的运行。\n\n## 编写 run 函数定义\n\n\n\n\n\n此函数的代码将放在我们最近创建的 `Engine.cpp`\
  \ 文件中。\n\n在之前的构造函数代码之后添加以下代码：\n\n```cpp\nvoid Engine::run()\n{\n    // Timing Clock\
  \ clock;\n    while (m_Window.isOpen()) {\n        Time dt = clock.restart();\n\
  \        // 更新总游戏时间\n        m_GameTimeTotal += dt;\n        // 将增量时间转换为小数\n   \
  \     float dtAsSeconds = dt.asSeconds();\n        // 按顺序调用游戏循环的每个部分 \n        update(dtAsSeconds);\n\
  \        draw(); \n    }\n}\n```\n\n`run` 函数是我们引擎的核心——它初始化了所有其他部分。首先，我们声明一个 `Clock`\
  \ 对象。接下来，我们有了熟悉的 `while(window.isOpen())` 循环，它创建了游戏循环。在这个 循环内部，我们执行了以下操作：\n\n1.\
  \ 重启时钟并将上一次循环所需保存在 `dt` 中。\n2. 在 `m_GameTimeTotal` 中跟踪总时间。\n3. 声明并初始化一个浮点数，表示上一帧期间经过的秒分数。\n\
  4. 调用 `input`。\n5. 调用 `update` 并传入经过的时间（`dtAsSeconds`）。\n6. 调用 `draw`。\n\n这一切看起来应该非常熟悉。新奇之处在于它被封装在了\
  \ `run` 函数中。\n\n## 编写输入函数定义\n\n如之前所述，此函数的代码将放在它自己的文件中，因为它比构造函数或 `run` 函数更详尽。我们将使用\
  \ `#include \"Engine.h\"` 并在函数签名前加上 `Engine::`，以确保编译器感知我们的意图。\n\n在**解决方案管理器**中右键点击**源文件**，并选择**添加**\
  \ | **新建项...**。在**添加新建项**窗口中，高亮（通过左键）**C++ 文件 (.cpp)**，然后在**名称** 字段中输入 `Input.cpp`。最后，点击**添加**\
  \ 按钮。我们现在准备好编写输入函数了。\n\n添加以下代码：\n\n```cpp\nvoid Engine::input() {\n    Event event;\n\
  \    while (m_Window.pollEvent(event)) {\n        if (event.type == Event::KeyPressed)\
  \ {\n            // 处理玩家退出\n            if (Keyboard::isKeyPressed(Keyboard::Escape))\
  \ {\n                m_Window.close();\n            }\n            // 处理玩家开始游戏\n\
  \            if (Keyboard::isKeyPressed(Keyboard::Return)) {\n                m_Playing\
  \ = true;\n            }\n            // 在 Thomas 和 Bob 之间切换\n            if (Keyboard::isKeyPressed(Keyboard::Q))\
  \ { \n                m_Character1 = !m_Character1;\n            }\n           \
  \ // 在全屏和分屏之间切换\n            if (Keyboard::isKeyPressed(Keyboard::E)) {\n      \
  \          m_SplitScreen = !m_SplitScreen;\n            }\n        }\n    }\n}\n\
  ```\n\n与之前的项目一样，我们每帧都会检查 `RenderWindow` 事件队列。同样，正如我们之前做的那样，我们使用 `if (Keyboard::isKeyPressed(Keyboard::E))`\
  \ 检测特定的按键。在我们刚刚添加的代码中最相关的是这些按键的实际作用：\n\n像常一样，`Esc` 键关闭窗口，游戏将退出。`Enter` 键将 `m_Playing`\
  \ 设置为 `true`，最终这将产生启动关卡的效果。\n\n`Q` 键在 `m_Character1` 的 `true` 和 `false` 之间切换值。此键仅在全屏模式下有效。它将在\
  \ Thomas 和 Bob 作为主 `View` 中心之间进行切换。`E` 键在 `m_SplitScreen` 的 `true` 和 `false` 之间切换。这将产生全屏和分屏视图之间切换的效果。\n\
  \n大部分键盘功能将在本结束时完全可用。我们正接近能够运行自己的游戏引擎了。接下来，让我们编写 `update` 函数。\n\n## 编写 update 函数定义\n\
  \n如之前所述，此函数的代码将放在它自己的文件中，因为它比构造函数或 `run` 函数更详尽。我们将使用 `#include \"Engine.h\"` 并在函数签名前加上\
  \ `Engine::`，以确保编译器感知我们的意图。\n\n在**解决方案管理器**中右键点击**源文件**，并选择**添加** | **新建项...**。在**添加新建项**窗口中，高亮（通过左键）**C++\
  \ 文件 (.cpp)**，然后在**名称** 字段中输入 `Update.cpp`。最后，点击**添加** 按钮。我们现在准备好为 `update` 函数编写一些代码了。\n\
  \n在 `Update.cpp` 文件中添加以下代码来实现 `update` 函数：\n\n```cpp\n#include \"stdafx.h\"\n#include\
  \ \"Engine.h\"\n#include <SFML/Graphics.hpp>\n#include <sstream>\n\nusing namespace\
  \ sf;\n\nvoid Engine::update(float dtAsSeconds) {\n    if (m_Playing) {\n      \
  \  // 计时玩家剩余的时间\n        m_TimeRemaining -= dtAsSeconds;\n        // Thomas 和 Bob\
  \ 的时间用完了吗？\n        if (m_TimeRemaining <= 0) { \n            m_NewLevelRequired\
  \ = true;\n        }\n    } // End if playing\n}\n```\n\n首先，注意 `update` 函数接收上一帧花费的时间作为参数。这对于\
  \ `update` 函数履行其作用来说是至关重要的。\n\n前面的代码在现阶段没有实现任何可见的视觉。它建立了我们后续章节所需的结构。它从 `m_TimeRemaining`\
  \ 中减去上一帧花费的时间。它检查时间是否已经耗尽，如果是，它会将 `m_NewLevelRequired` 设置为 `true`。所有这些代码都封装在一个 `if`\
  \ 语句中，只有当 `m_Playing` 为 `true` 时才执行。这是因为，与之前的项目一样，我们不希望在游戏未开始时时间推进和对象更新。\n\n随着项目的进行，我们在此代码的基础上继续构建。\n\
  \n## 编写 draw 函数定义\n\n如之前所述，此函数的代码将放在它自己的文件中，因为它比构造函数或 `run` 函数更详尽。我们将使用 `#include\
  \ \"Engine.h\"` 并在函数签名前加上 `Engine::`，以确保编译器感知我们的意图。\n\n在**解决方案管理器**中右键点击**源文件**，并选择**添加**\
  \ | **新建项...**。在**添加新建项**窗口中，高亮（通过左键）**C++ 文件 (.cpp)**，然后在**名称** 字段中输入 `Draw.cpp`。最后，点击**添加**\
  \ 按钮。我们现在准备好为 `draw` 函数添加一些代码。\n\n在 `Draw.cpp` 文件中添加以下代码来实现 `draw` 函数：\n\n```cpp\n\
  #include \"stdafx.h\"\n#include \"Engine.h\"\n\nvoid Engine::draw() {\n    // 擦除上一帧\n\
  \    m_Window.clear(Color::White);\n    if (!m_SplitScreen) {\n        // 切换到背景视图\n\
  \        m_Window.setView(m_BGView); // 绘制背景\n        m_Window.draw(m_BackgroundSprite);\
  \ // 切换到 m_MainView\n        m_Window.setView(m_MainView);\n    } else {\n     \
  \   // 分屏视图激活\n        // 首先绘制 Thomas 侧的屏幕\n        m_Window.setView(m_BGLeftView);\
  \ // 绘制背景\n        m_Window.draw(m_BackgroundSprite); // 切换到 m_LeftView\n      \
  \  m_Window.setView(m_LeftView);\n        // 现在绘制 Bob 侧的屏幕\n        m_Window.setView(m_BGRightView);\
  \ // 绘制背景\n        m_Window.draw(m_BackgroundSprite); // 切换到 m_RightView\n     \
  \   m_Window.setView(m_RightView);\n    }\n    // 绘制 HUD\n    m_Window.setView(m_HudView);\n\
  \    // 显示我们刚刚绘制的所有内容\n    m_Window.display();\n}\n```\n\n在前面的代码中，没有我们以前见过的内容。代码开始时，像常一样通过清除屏幕。在这个项目中，我们用白色清除屏幕。新奇之处在于不同的绘制选项通过一个条件隔离开，该条件检查屏幕当前是分屏还是全屏：\n\
  \n```cpp\nif (!m_SplitScreen) {\n} else {\n}\n```\n\n如果屏幕没有分屏，我们在背景视图（`m_BGView`）中绘制背景精灵，然后切换到主全屏视图（`m_MainView`）。注意，此时此刻我们实际上没有在\
  \ `m_MainView` 中进行任何绘制。\n\n相反，如果屏幕是分屏，则执行 `else` 块，我们在 `m_BGLeftView` 中绘制屏幕左侧的背景精灵，然后切换到\
  \ `m_LeftView`。\n\n然后，仍然在 `else` 块中，我们在 `m_BGRightView` 中绘制屏幕右侧的背景精灵，然后切换到 `m_RightView`。\n\
  \n\n\n\n与三个最重要的函数中的另外两个（输入、更新）一样，我们将经常回到 `draw` 函数这里。我们将为游戏添加需要绘制的新元素。你会注意到，每当我们这样做时，都会会在主部分、左侧部分和右侧部分的每个部分中添加代码。\n\
  \n让我们快速回顾一下 `Engine` 类，然后就可以启动它。\n\n## 到目前为止的 Engine 类\n\n我们已经实现的是将原本在 `main` 函数中的所有代码抽象到\
  \ `input`、`update` 和 `draw` 函数中。这些函数的持续循环以及定时控制都是由 `run` 函数处理的。\n\n考虑在 Visual Studio\
  \ 中保持打开 `Input.cpp`、`Update.cpp` 和 `Draw.cpp` 标签页，或许按顺序排列，如下幅截图所示：\n\n![](img/image00291.jpeg)\n\
  \n在整个项目过程中，我们将反复访问这些函数中的每一个，以添加更多代码。现在我们已经有了 `Engine` 类的基本结构和功能，可以在 `main` 函数中创建它的实例并看到它的运行。\n\
  \n# 编写 main 函数\n\n让我们将 `HelloSFML.cpp` 文件重命名为 `Main.cpp`。在 `Solution Explorer`（解决方案资源管理器）中右键点击\
  \ `HelloSFML` 文件并选择 `Rename`。将名称改为 `Main.cpp`。这将包含我们的 `main` 函数以及实例化 `Engine` 类的代码。\n\
  \n在 `Main.cpp` 中添加以下代码：\n\n```cpp\n#include \"stdafx.h\"\n#include \"Engine.h\"\n\
  \nint main()\n{\n    // 声明 Engine 实例 Engine engine; \n    // 启动引擎 VRRrrrrmmm engine.run();\n\
  \    // 引擎停止时按通常退出 return 0;\n}\n```\n\n我们做的只是为 `Engine` 类添加一个包含指令，声明 `Engine` 实例，然后调用它的\
  \ `run` 函数。一切都将由 `Engine` 类处理，直到玩家退出，执行流返回 `main` 并执行 `return 0` 语句。\n\n这很简单。现在我们可以运行游戏并看到空白背景（无论是全屏还是分屏模式），它最终将包含所有的动作。\n\
  \n这里是目前的游戏状态，在全屏模式下，仅显示背景：\n\n![](img/image00292.jpeg)\n\n现在按下 `E` 键，你会看到屏幕整齐地分成两半，准备好进行分屏合作游戏：\n\
  \n![](img/image00293.jpeg) 这里是一些你脑中可能产生的问题。\n\n## 第 13 章 高级 OOP – 继承与多态\n\n在本章中，我们将通过学习继承和多态这两个稍微高级的概念来进一步扩展我们对\
  \ OOP 的知识。然后，我们就能够使用这些新知识来实现游戏中的主角角色 Thomas 和 Bob。以下是本章将更详细涵盖的内容：\n\n- 如何使用继承来扩展和修改类？\n\
  - 通过使用多态将类的对象处理为多于一种类型的类\n- 抽象类以及为什么设计从不被实例化的类实际上是很有用的\n- 构建一个抽象的 `PlayableCharacter`\
  \ 类\n- 将继承应用于 Thomas 类和 Bob 类\n- 将 Thomas 和 Bob 添加到游戏项目中\n\n### 继承\n\n我们已经看到了如何通过实例化/创建来自\
  \ SFML 库类的对象来利用他人的工作成果。但整个 OOP 的东西远比这要深得多。\n\n如果有一个类包含了大量有用的功能，但又不是我们想要的呢？在这种情况下，我们可以从另一个类继承。正如字面意思一样，继承意味着我们可以利用其他类的所有特性和优点（包括封装），同时专门针对我们的特定情况进一步精炼或扩展代码。在这个项目中，我们将继承并扩展一些\
  \ SFML 类。我们也会对自己的类这样做。\n\n让我们来看一些使用继承的代码\n\n## 扩展类\n\n在考虑到所有这些的情况下，让我们来看一个示例类，看看我们如何扩展它，仅仅是为了看看语法，并作为第一步。\n\
  \n首先，我们定义一个要继承的类。这与我们创建其他任何类的方式没有区别。看一眼这个假设的 `Soldier` 类声明：\n\n```cpp\nclass Soldier\n\
  {\nprivate:\n    // 士兵可以承受多少伤害\n    int m_Health;\n    int m_Armour;\n    int m_Range;\n\
  \    int m_ShotPower;\n\npublic:\n    void setHealth(int h); \n    void setArmour(int\
  \ a); \n    void setRange(int r); \n    void setShotPower(int p); \n};\n```\n\n\
  在之前的代码中，我们定义了一个 `Soldier` 类。它有四个私有变量 `m_Health`、`m_Armour`、`m_Range` 和 `m_ShotPower`。它有四个公共函数\
  \ `setHealth`、`setArmour`、`setRange` 和 `setShotPower`。我们不需要看到函数的定义，它们将只需初始化名称所暗示的相应变量。\n\
  \n我们也可以想象，一个完全实现的 `Soldier` 类会比这要深入得多。它可能会有如 `shoot`、`goProne` 等函数。如果我们在 SFML 项目中实现一个\
  \ `Soldier` 类，它可能会有一个 `Sprite` 对象，以及 `update` 和 `getPostion` 函数。\n\n这里展示的简单场景适合学习继承。现在让我们来看一些新东西，实际上继承自\
  \ `Soldier` 类。看这段代码，特别是高亮部分：\n\n```cpp\nclass Sniper : public Soldier\n{\npublic:\
  \ \n    // 适用于 Sniper 的构造函数\n    Sniper::Sniper();\n};\n```\n\n通过在 `Sniper` 类声明中添加\
  \ `: public Soldier`，`Sniper` 继承自 `Soldier`。但这到底意味着什么？`Sniper` 是一个 `Soldier`。它拥有\
  \ `Soldier` 的所有变量和函数。然而，继承不仅仅于此。\n\n同时注意在之前的代码中，我们声明了一个 `Sniper` 构造函数。这个构造函数是 `Sniper`\
  \ 特有的。我们不仅继承了 `Soldier`，还扩展了 `Soldier`。`Soldier` 类的所有功能（定义）都由 `Soldier` 类处理，但 `Sniper`\
  \ 构造函数的定义必须由 `Sniper` 类处理。\n\n这就是假设的 `Sniper` 构造函数定义的样子：\n\n```cpp\n// 在 Sniper.cpp\
  \ 中\nSniper::Sniper()\n{\n    setHealth(10); \n    setArmour(10); \n    setRange(1000);\
  \ \n    setShotPower(100);\n}\n```\n\n我们可以编写许多其他自 `Soldier` 的类，例如 `Commando` 和 `Infantryman`。每个类都具有相同的变量和函数，但每个类也可以有一个独特的构造函数，以根据类型初始化这些变量。`Commando`\
  \ 可能有非常高的 `m_Health` 和 `m_ShotPower`，但 `m_Range` 极小。`Infantryman` 可能介于 `Commando`\
  \ 和 `Sniper` 之间，每个变量的值都中等。\n\n## Tip\n\n如果 OOP 已经足够好用，我们现在还可以模拟现实世界的对象，包括它们的层次结构。我们通过子类化、扩展和继承其他类来实现。\n\
  \n我们在这里可能学习的术语是，被扩展的类称为超类（super-class），而继承自超类的类称为子类（sub-class）。我们也可以称其为父类和子类。\n\n\
  ## Tip\n\n你提到 `protected` 吗？是的。有一个用于类变量和函数的访问饰符叫做 `protected`。你可以认为 `protected`\
  \ 变量位于公共和私有之间。以下是访问饰符的快速总结，以及关于 `protected` 饰符的更多详细信息：\n\n\n\n\n\n公共变量和函数可以被任何人访问和使用。私有变量和函数只能由类的内部代码访问/使用。这有助于封装，当我们需要访问/更改私有变量时，可以提供公共的\
  \ getter 和 setter 函数（例如 `getSprite` 等）。如果我们扩展了一个具有私有变量和函数的类，那么该子类`cannot`直接访问父类的私有数据。\n\
  \n受保护变量和函数与私有变量几乎相同。它们不能被类的实例直接访问/使用。然而，它们`can`被声明所在类的任何扩展类直接使用。因此它们就像是私有的，但子类除外。\n\
  \n为了完全理解受保护变量和函数的含义以及它们如何有用，让我们先看另一个主题，然后观察它们的实际运行。\n\n### 多态\n\n`Polymorphism`\
  \ 允许我们编写对试图操作的类型依赖程度较低的代码。这可以使我们的代码更清晰、更高效。多态意味着不同的形式。如果我们编写代码的对象可以是不止一种类型，那么我们就可以利用这一点。\n\
  \n### 注意事项\n\n多态对我们意味着什么？简化为最基本的定义，多态就是：任何子类都可以作为使用父类的代码的一部分。这意味着我们可以编写更简单、更易理解的代码，而且更容易修改或更改。此外，我们可以为父类编写代码，并依赖于这样一个事实：无论被子类多少次，在某些参数范围内，代码仍然可以工作。\n\
  \n让我们讨论一个例子。\n\n假设我们想使用多态来帮助编写一个动物园管理游戏，我们必须给动物喂食并照顾它们的需求。我们可能想要一个如 `feed` 的函数。我们可能还希望将\
  \ `Animal` 的实例传递到 `feed` 函数中。\n\n当然，动物园有很多种动物——狮子 Lion、`Elephant` 和三趾懒懒 ThreeToedSloth。根据我们对\
  \ C++ 继承的新知识，编写一个 `Animal` 类并让所有不同类型的动物继承自它是有意义的。\n\n如果我们想写一个函数（`feed`），可以将 `Lion`、`Elephant`\
  \ 和 `ThreeToedSloth` 作为参数传入，这似乎我们需要为每种类型的 `Animal` 都写一个 `feed` 函数。然而，我们可以编写具有多态返回类型和参数的多态函数。看看这里这个假设的\
  \ `feed` 函数的定义：\n\n```cpp\nvoid feed(Animal& a)\n{\na.decreaseHunger(); }\n```\n\
  \n前面的函数将 `Animal` 引用作为参数，这意味着任何从扩展 `Animal` 的类构建的对象都可以传递给它。\n\n因此，你今天可以编写代码，并在的一周、一个月或一年后创建另一个子类，同样的函数和数据结构将仍然有效。此外，我们还可以为子类强制执行一套规则，规定它们可以做什么、不能做什么，以及如何做。因此，一个阶段的良好设计可以影响其他阶段。\n\
  \n但我们真的想实例化一个真实的 `Animal` 吗？\n\n# 抽象类 - 虚函数和纯虚函数\n\n`abstract class` 是无法实例化的类，因此无法变成对象。\n\
  \n### 提示\n\n我们在这里可能想要学习的术语是 `concrete` 类（具体类）。`concrete class` 是任何不是抽象的类。换句话说，我们目前为止编写的所有类都是具体类，可以实例化为可用的对象。\n\
  \n那么，它是永远不会被使用的代码吗？但这就像是付钱让建筑师设计房子，却从不盖房子！\n\n如果我们或者类的设计者想强制用户在使用该类之前继承它，他们可以将类设为\
  \ `abstract`（抽象的）。这样，我们就无法从它创建对象；因此，我们必须先扩展它并从子类创建对象。\n\n要这样做，我们可以将函数设为 `pure virtual`（纯虚）且不提供任何定义。那么该函数必须在任何扩展它的类中被\
  \ `overridden`（重写）。\n\n让我们看一个例子；这会有帮助。我们通过添加一个纯虚函数来使类抽象，比如这个抽象的 `Animal` 类，它只能执行\
  \ `makeNoise` 这个通用动作：\n\n```cpp\nClass Animal\nprivate:\n    // 这里有私有内容\npublic:\n\
  \    void virtual makeNoise() = 0;\n    // 这里有更多公共内容\n};\n```\n\n如你所示，我们在函数声明之前添加了\
  \ C++ 关键字 `virtual`，在之后添加了 `= 0`。现在，任何扩展/继承自 `Animal` 的类必须重写 `makeNoise` 函数。这可能是有意义，因为不同类型的动物发出的声音类型非常不同。我们可能假设任何扩展\
  \ `Animal` 类的人足够聪明，能注意到 `Animal` 类不能发出声音，并且他们需要处理它，但如果他们没有注意到呢？关键在于，通过创建一个纯虚函数，我们保证了他们这样做，因为他们必须这样做。\n\
  \n抽象类也很有用，因为有时我们希望一个类可以作为多态类型使用，但我们需要保证它永远不能作为对象使用。例如，`Animal` 本身并没有真正的意义。我们不谈论动物；我们谈论动物的种类。我们不会说：“噢，看那只可爱、毛茸茸的白色动物！”或“昨天我们去宠物店买了一只动物和一个动物床”。它只是太……呃，太抽象了。\n\
  \n因此，抽象类就像是一个 `template`（模板），供任何扩展它（继承自它）的类使用。如果我们正在构建一个类似《工业帝国》类型的游戏，玩家管理企业及其员工，我们可能想要一个\
  \ `Worker` 类，例如，并扩展它来创建 `Miner`、`Steelworker`、`OfficeWorker`，当然当然，还有 `Programmer`。但一个普通的\
  \ `Worker` 到底在做什么呢？我们为什么要去实例化它呢？\n\n答案是我们不想实例化它，但我们可能想将其作为多态类型，这样我们可以在函数之间传递多个 `Worker`\
  \ 子类，并拥有可以持有所有类型员工的数据结构。\n\n所有纯虚函数都必须由扩展包含该纯虚函数的父类的类重写。这意味着抽象类可以提供一些在所有子类中可用的常用功能。例如，`Worker`\
  \ 类可能有 `m_AnnualSalary`、`m_Productivity` 和 `m_Age` 成员变量。它可能还有 `getPayCheck` 函数，该函数不是纯虚的且在所有子类中都是相同的，但它可能有一个\
  \ `doWork` 函数，它是纯虚的且必须重写，因为所有不同类型的 `Worker` `doWork` 的方式非常不同。\n\n### 注意事项\n\n顺便说，`virtual`\
  \ 与纯虚不同，它是 `optionally overridden`（可选重写）的函数。声明虚函数的方法与纯虚相同，但去掉结尾的 `= 0`。在当前的游戏项目中，我们将使用纯虚函数。\n\
  \n如果这些关于虚、纯虚或抽象的内容任何不清楚，使用它们可能是理解它们的最好方法。\n\n# 构建 PlayableCharacter\n\n现在我们知道了关于继承、多态和纯虚函数的基础知识，我们将把它们投入使用。我们将构建一个\
  \ `PlayableCharacter` 类，它拥有我们游戏中任何角色需要的大部分功能。它将有一个纯虚函数 `handleInput`。由于 `handleInput`\
  \ 函数在子类中需要有很大不同，所以这是很合理的。\n\n由于 `PlayableCharacter` 将有一个纯虚函数，它将是一个抽象类，且无法创建它的对象。随后，我们将构建\
  \ `Thomas` 和 `Bob` 类，它们将继承自 `PlayableCharacter`，实现纯虚函数的定义，并允许我们在游戏中实例化 `Bob` 和 `Thomas`\
  \ 对象。\n\n\n\n\n\n## PlayableCharacter.h\n\n和往常一样，在创建一个类时，我们将从包含成员变量和函数声明的头文件开始。不同之处在于在这个类中，我们将声明一些\
  \ `protected` 成员变量。请记住，`protected` 变量可以像 `Public` 变量一样被继承该类的类使用。\n\n在 `Solution\
  \ Explorer` 中右键点击 `Header Files` 并选择 `Add` | `New Item...`。在 `Add New Item` 窗口中，通过左键点击选中\
  \ `Header File (.h)`，然后在 `Name` 字段中输入 `PlayableCharacter.h`。最后，点击 `Add` 按钮。我们现在准备好为\
  \ `PlayableCharacter` 类编写头文件了。\n\n我们将分三个部分添加并讨论 `PlayableCharacter.h`文件的内容。首先是 `protected`\
  \ 部分，然后是 `private`，最后是 `public`。\n\n在 `PlayableCharacter.h` 文件中添加所示代码：\n\n```cpp\n\
  #pragma once\n\n#include <SFML/Graphics.hpp>\n\nusing namespace sf;\n\n class PlayableCharacter\n\
  \n{\n\nprotected:\n\n// 当然，我们需要一个精灵\n\nSprite m_Sprite;\n// 跳跃持续多长时间\n\nfloat m_JumpDuration;\n\
  \n// 角色是否正在跳跃或落下 bool m_IsJumping;\n\nbool m_IsFalling; \n\n// 角色当前正在哪个方向移动 bool\
  \ m_LeftPressed;\n\nbool m_RightPressed;\n\n// 此跳跃已经持续了多久 float m_TimeThisJump;\n\
  \n// 玩家是否刚刚启动跳跃 bool m_JustJumped = false;\n\n// 接下来是私有变量和函数\n```\n\n我们在刚刚编写的代码中首先要注意的是，，所有变量都是\
  \ `protected` 的。这意味着当我们扩展该类时，我们编写的所有变量对扩展它的类都是可见。我们将用 `Thomas` 和 `Bob` 类来扩展这个类。\n\
  \n除了 `protected` 访问说明符外，之前的代码没有新奇或复杂的地方。然而，值得注意一些细节。这样随着我们的进展，将很容易理解该类是如何工作的。让我们一个一个地过这些\
  \ `protected` 变量。\n\n我们有一个可以预料的 `Sprite` `m_Sprite`。我们有一个名为 `m_JumpDuration` 的 `float`，它将存储代表角色能够跳跃时间的值。值越大，角色就能跳得越远/越高。\n\
  \n接下来，我们有一个布尔值 `m_IsJumping`，当角色正在跳跃时它为 `true`，否则为 `false`。这对于确保角色在空中不能跳跃很有用。\n\n\
  `m_IsFalling` 变量的作用与 `m_IsJumping` 类似。知道角色何时掉落将很有用。\n\n接下来，我们有两个布尔值，如果角色的左或右键盘键当前被按下，它们将为\
  \ `true`。这些取决于角色（Thomas 使用 `A` 和 `D`，Bob 使用 `Left` 和 `Right` 方向键）。我们将如何响应这些布尔值将在\
  \ `Thomas` 和 `Bob` 类中看到。\n\n`m_TimeThisJump` `float` 变量在 `m_IsJumping` 为 `true`\
  \ 的每一帧都会更新。这样我们就可以知道何时达到了 `m_JumpDuration`。\n\n最后一个 `protected` 变量是布尔值 `m_JustJumped`。如果在当前帧启动了跳跃，它将为\
  \ `true`。这对于知道何时播放跳跃音效很有用。\n\n接下来，在 `PlayableCharacter.h` 文件中添加以下`private`变量：\n\n\
  ```cpp\n private:\n\n// 重力是多少\n\nfloat m_Gravity;\n// 角色速度有多快 float m_Speed = 400;\n\
  \n// 玩家在哪里 Vector2f m_Position;\n\n// 角色的各个身体部位在哪里? FloatRect m_Feet;\n\nFloatRect\
  \ m_Head;\n\nFloatRect m_Right;\n\nFloatRect m_Left; \n\n// 以及一个纹理 Texture m_Texture;\n\
  \n// 接下来是我们所有的公共函数\n```\n\n在之前的代码中，我们有一些有趣的`private`变量。请记住，这些变量只能被 `PlayableCharacter`\
  \ 类中的代码直接访问。`Thomas` 和 `Bob` 类无法直接访问它们。\n\n`m_Gravity` 变量将存储角色每秒掉落的像素数。`m_Speed`\
  \ 变量将存储角色每秒向左或右移动的像素数。\n\n`Vector2f` 变量 `m_Position` 是角色中心所在世界（而非屏幕）的位置。\n\n接下来的四个\
  \ `FloatRect` 对象值得讨论。当我们在 `Zombie Arena` 游戏中进行碰撞检测时，我们只是检查两个 `FloatRect` 对象是否相交。每个\
  \ `FloatRect` 对象代表整个角色、一个拾取物品或子弹。对于非矩形形状的对象（僵尸和玩家），这有点不准确。\n\n在这个游戏中，我们需要更精确。`m_Feet`、`m_Head`、`m_Right`\
  \ 和 `m_Left` `FloatRect` 对象将角色身体不同部分的坐标。这些坐标将在每一帧中更新。\n\n通过这些坐标，我们能够准确地判断角色何时落在平台上、在跳跃期间撞头或与侧面的瓷砖擦肩。\n\
  \n最后，我们有 `Texture`。`Texture` 是 `private` 的，因为它没有被 `Thomas` 或 `Bob` 类直接使用；但正如我们看到的，`Sprite`\
  \ 是 `protected` 的，因为它被直接使用了。\n\n现在向 `PlayableCharacter.h` 文件添加所有`public`函数，然后我们将讨论它们：\n\
  \n```cpp\npublic:\n\nvoid spawn(Vector2f startPosition, float gravity);\n\n // 这是一个纯虚函数\n\
  \nbool virtual handleInput() = 0;\n\n// 此类现在是抽象类，不能实例化\n// 玩家在哪里\n\nFloatRect getPosition();\n\
  \n// 代表精灵不同部分\n// 位置的矩形\n\nFloatRect getFeet(); \n\nFloatRect getHead(); FloatRect\
  \ getRight(); FloatRect getLeft();\n\n// 向调用代码发送精灵的副本 main Sprite getSprite();\n\
  \n// 让角色站稳 void stopFalling(float position); void stopRight(float position); void\
  \ stopLeft(float position); void stopJump(); \n\n// 角色的中心在哪里 Vector2f getCenter();\n\
  \n// 我们每帧调用一次此函数 void update(float elapsedTime);\n\n}; 类类的结束\n```\n\n### 函数声明\n\n\
  让我们讨论一下刚刚添加的每个函数声明。这将使得编写它们的定义变得更容易遵循。\n\n`spawn` 函数接收一个名为 `startPosition` 的 `Vector2f`\
  \ 和一个名为 `gravity` 的 `float`。正如名称所示，`startPosition` 将是角色开始的关卡坐标，`gravity` 将是角色掉落的每秒像素数。\n\
  \n`bool virtual handleInput() = 0` 显然是我们的纯虚函数。由于 `PlayableCharacter` 有此函数，任何扩展它的类如果想实例化它，必须为此函数提供定义。因此，当我们几分钟后为\
  \ `PlayableCharacter` 编写所有函数定义时，我们不会为 `handleInput` 提供定义。在 `Thomas` 和 `Bob` 类中自然需要定义。\n\
  \n`getPosition` 函数返回一个代表整个角色位置的 `FloatRect`。\n\n`getFeet()` 函数以及 `getHead`、`getRight`\
  \ 和 `getLeft()` 各自返回一个 `FloatRect`，代表角色身体特定部分的位置。这正是我们详细碰撞检测所需要的。\n\n`getSprite`\
  \ 函数像往常一样，向调用代码返回 `m_Sprite` 的副本。\n\n`stopFalling`、`stopRight`、`stopLeft` 和 `stopJump`\
  \ 函数接收单个 `float` 值，函数将使用该值重新定位角色，并停止其穿过实体瓷砖行走或跳跃。`getCenter` 函数返回一个 `Vector2f` 给调用代码，让其确切知道角色的中心在哪里。这个值存储在\
  \ `m_Position` 中。我们将看到它被 `Engine` 类用于将适当的 `View` 居于适当的角色周围。\n\n\n\n\n我们之前见过很多次 update\
  \ 函数，和往常一样，它接受一个浮点数参数，即当前帧所花费的秒数。然而，这个 update 函数需要比之前的 update 函数（来自其他项目）执行更多工作。它需要处理跳跃，以及更新代表头、脚、左边和右边的\
  \ `FloatRect` 对象。\n\n现在我们可以编写所有函数的定义了，当然，`handleInput` 除外。\n\n## 编写 PlayableCharacter.cpp\n\
  \n在`解决方案管理器`中右键点击`源文件`并选择`添加` | `新建项...`。在`添加新建项`窗口中，选中（通过左键点击）`C++ 文件 (.cpp)`，然后在`名称`\
  \ 字段中输入 `PlayableCharacter.cpp`。最后，点击`添加` 按钮。我们现在准备好为 `PlayableCharacter` 类编写 `.cpp`\
  \ 文件了。\n\n我们将代码和讨论分为若干部分。首先，添加包含包含指令和 `spawn` 函数的定义：\n\n```cpp\n#include \"stdafx.h\"\
  \n\n#include \"PlayableCharacter.h\"\n\nvoid PlayableCharacter::spawn(Vector2f startPosition,\
  \ float gravity)\n{\n    // 将玩家放在起始点 m_Position.x = startPosition.x;\n    m_Position.y\
  \ = startPosition.y; \n    // 初始化重力 m_Gravity = gravity;\n    // 将精灵移动到位置 m_Sprite.setPosition(m_Position);\n\
  }\n```\n\n`spawn` 函数使用传入的位置初始化 `m_Position`，并初始化 `m_Gravity`。最后一行代码将 `m_Sprite`\
  \ 移动到它的起始位置。\n\n接下来，在紧接上述代码之后添加 `update` 函数的定义：\n\n```cpp\nvoid PlayableCharacter::update(float\
  \ elapsedTime) {\n    if (m_RightPressed) {\n        m_Position.x += m_Speed * elapsedTime;\
  \ \n    }\n    if (m_LeftPressed)\n    {\n        m_Position.x -= m_Speed * elapsedTime;\n\
  \    }\n    // 处理跳跃\n    if (m_IsJumping) {\n        // 更新跳跃持续了多久 m_TimeThisJump\
  \ += elapsedTime;\n        // 检查跳跃是否正在向上\n        if (m_TimeThisJump < m_JumpDuration)\
  \ {\n            // 以两倍重力向上移动\n            m_Position.y -= m_Gravity * 2 * elapsedTime;\
  \ \n        }\n        else\n        {\n            m_IsJumping = false; m_IsFalling\
  \ = true;\n        }\n    }\n    // 应用重力\n    if (m_IsFalling) {\n        m_Position.y\
  \ += m_Gravity * elapsedTime; \n    }\n    // 更新所有部位的矩形\n    FloatRect r = getPosition();\n\
  \    // 头\n    m_Head.left = r.left;\n    m_Head.top = r.top + (r.height * .3);\
  \ m_Head.width = r.width;\n    m_Head.height = 1;\n    // 脚\n    m_Feet.left = r.left\
  \ + 3;\n    m_Feet.top = r.top + r.height - 1; m_Feet.width = r.width - 6; m_Feet.height\
  \ = 1;\n    // 右侧\n    m_Right.left = r.left + r.width - 2; m_Right.top = r.top\
  \ + r.height * .35; m_Right.width = 1;\n    m_Right.height = r.height * .3;\n  \
  \  // 左侧\n    m_Left.left = r.left;\n    m_Left.top = r.top + r.height * .5; m_Left.width\
  \ = 1;\n    m_Left.height = r.height * .3; \n    // 将精灵移动到位置 m_Sprite.setPosition(m_Position);\n\
  }\n```\n\n代码的前两部分检查 `m_RightPressed` 或 `m_LeftPressed` 是否为真。如果其中之一为真，则使用与之前项目相同的公式（经过时间乘以速度）来改变\
  \ `m_Position`。\n\n接下来，我们查看角色当前是否正在执行跳跃。我们通过 `if(m_IsJumping)` 知道这一点。如果这个 `if` 语句为真，代码将执行以下步骤如下：\n\
  \n1.  用 `elapsedTime` 更新 `m_TimeThisJump`。\n2.  检查 `m_TimeThisJump` 是否仍小于 `m_JumpDuration`。如果是，则通过两倍重力乘以经过的时间改变\
  \ `m_Position` 的 y 坐标。\n3.  在 `m_TimeThisJump` 不小于 `m_JumpDuration` 时执行的 `else`\
  \ 子句中，将 `m_Falling` 设置为 `true`。此操作将在下一步看到。此外，`m_Jumping` 被设置为 `false`。这防止了我们刚刚讨论的代码执行，因为\
  \ `if(m_IsJumping)` 现在为假了。\n\n`if(m_IsFalling)` 块每帧将 `m_Position` 向移动。它使用 `m_Gravity`\
  \ 的当前值和经过的时间进行移动。\n\n以下代码（几乎是剩余的所有代码）相对于整个精灵的当前位置更新角色的部位。请查看下面的图，了解代码如何计算角色虚拟头、脚、左侧和右侧的计算：\n\
  \n![](img/image00294.jpeg)\n\n最后一行代码使用 `setPosition` 函数在 `update` 函数的所有可能情况之后，将精灵移动到其正确位置。\n\
  \n现在，在紧接之前的代码之后添加 `getPosition`、`getCenter`、`getFeet`、`getHead`、`getLeft`、`getRight`\
  \ 和 `getSprite` 函数的定义：\n\n```cpp\nFloatRect PlayableCharacter::getPosition()\n{\n\
  \    return m_Sprite.getGlobalBounds();\n}\n\nVector2f PlayableCharacter::getCenter()\n\
  {\n    return Vector2f(\n        m_Position.x + m_Sprite.getGlobalBounds().width\
  \ / 2, m_Position.y + m_Sprite.getGlobalBounds().height / 2 );\n}\n\nFloatRect PlayableCharacter::getFeet()\n\
  {\n    return m_Feet;\n}\n\nFloatRect PlayableCharacter::getHead()\n{\n    return\
  \ m_Head;\n}\n\nFloatRect PlayableCharacter::getLeft()\n{\n    return m_Left;\n\
  }\n\nFloatRect PlayableCharacter::getRight()\n{\n    return m_Right;\n} \n\nSprite\
  \ PlayableCharacter::getSprite() {\n    return m_Sprite; \n}\n```\n\n`getPosition`\
  \ 函数返回一个封装整个精灵的 `FloatRect`，而 `getCenter` 返回一个包含精灵中心的 `Vector2f`。注意，我们将精灵的高度和宽度除以二以便动态地得出这个结果。这是因为\
  \ Thomas 和 Bob 的身高不同。\n\n`getFeet`、`getHead`、`getLeft` 和 `getRight` 函数返回我们在 `update`\
  \ 函数中每帧更新的角色部位的 `FloatRect` 对象。我们将在下一章中编写使用这些函数的**碰撞检测代码**。\n\n`getSprite` 函数像往常一样，返回\
  \ `m_Sprite` 的副本。\n\n最后，为 `PlayableCharacter` 类添加 `stopFalling`、`stopRight`、`stopLeft`\
  \ 和 `stopJump` 函数的定义。在紧接之前的代码之后执行：\n\n```cpp\nvoid PlayableCharacter::stopFalling(float\
  \ position) {\n    m_Position.y = position - getPosition().height; m_Sprite.setPosition(m_Position);\n\
  \    m_IsFalling = false;\n}\n\nvoid PlayableCharacter::stopRight(float position)\
  \ {\n    m_Position.x = position - m_Sprite.getGlobalBounds().width; m_Sprite.setPosition(m_Position);\n\
  }\n\nvoid PlayableCharacter::stopLeft(float position) {\n    m_Position.x = position\
  \ + m_Sprite.getGlobalBounds().width; m_Sprite.setPosition(m_Position);\n} \n\n\
  void PlayableCharacter::stopJump() {\n    // 提前停止跳跃 m_IsJumping = false;\n    m_IsFalling\
  \ = true; \n}\n```\n\n之前的每个函数都接收一个值作为参数，用于重新定位精灵的顶部、底部、左侧或右侧。这些值具体是什么以及如何获得将在下一章看到。之前的每个函数还重新定位了精灵。\n\
  \n最后一个函数是 `stopJump` 函数，它也将用于碰撞检测。它为 `m_IsJumping` 和 `m_IsFalling` 设置了必要的值以结束跳跃。\n\
  \n## 构建 Thomas 和 Bob 类\n\n现在我们要真正使用继承了。我们将为 Thomas 和 Bob 分别构建一个类。它们都将继承自我们刚刚编写的\
  \ `PlayableCharacter` 类。它们将拥有 `PlayableCharacter` 类的所有功能，包括直接访问其保护变量。我们还将为纯虚函数 `handleInput`\
  \ 添加定义。你会发现 Thomas 和 Bob 的 `handleInput` 函数是不同的。\n\n### 编写 Thomas.h\n\n在`解决方案管理器`中右键点击`头文件`并选择`添加\
  \ | 新建项...`。在`添加新建项`窗口中，选中（通过左键点击）`头文件 (.h)`，然后在`名称` 字段中输入 `Thomas.h`。最后，点击`添加`\
  \ 按钮。我们现在准备好为 Thomas 类编写头文件。现在将此代码添加到 `Thomas.h` 类中：\n\n```cpp\n#pragma once\n\n\
  #include \"PlayableCharacter.h\"\n\nclass Thomas : public PlayableCharacter\n{\n\
  public:\n    // 一个 Thomas 特有的构造函数\n    Thomas::Thomas();\n};\n```\n\n\n\n\n```cpp\n\
  // Thomas 的重写输入处理器\n\nbool virtual handleInput();\n\n};\n```\n\n之前的代码非常简洁。我们可以看到我们有一个构造函数，并且将实现纯虚函数\
  \ `handleInput`，所以现在就来实现它吧。\n\n## 编写 Thomas.cpp\n\n在 `Solution Explorer`（解决方案资源管理器）中右键点击\
  \ `Source Files`，选择 `Add` | `New Item...`。在 `Add New Item` 窗口中，左键点击高亮 `C++ File`\
  \ (.cpp)，然后在 `Name` 字段中输入 `Thomas.cpp`。最后，点击 `Add` 按钮。我们现在准备好为 `Thomas` 类编写 `.cpp`\
  \ 文件了。\n\n在 `Thomas.cpp` 文件中添加 `Thomas` 构造函数，如下代码所示：\n\n```cpp\n#include \"stdafx.h\"\
  \n#include \"Thomas.h\"\n#include \"TextureHolder.h\"\n\nThomas::Thomas() {\n  \
  \  // 将纹理与精灵对象关联\n    m_Sprite = Sprite(TextureHolder::GetTexture(\"graphics/thomas.png\"\
  )); \n    m_JumpDuration = .45; \n}\n```\n\n我们所做的只是加载 `thomas.png` 图形，并将跳跃持续（`m_JumpDuration`）设置为\
  \ `.45`（大约半秒）。\n\n添加 `handleInput` 函数的定义，如下代码所示：\n\n```cpp\n// 一个虚函数\nbool Thomas::handleInput()\
  \ {\n    m_JustJumped = false;\n    if (Keyboard::isKeyPressed(Keyboard::W)) {\n\
  \        // 如果没有在跳跃则开始跳跃\n        // 但仅当站在方块上（未掉落）时\n        if (!m_IsJumping &&\
  \ !m_IsFalling) {\n            m_IsJumping = true; \n            m_TimeThisJump\
  \ = 0; \n            m_JustJumped = true;\n        }\n    }\n    else {\n      \
  \  m_IsJumping = false; \n        m_IsFalling = true;\n    }\n\n    if (Keyboard::isKeyPressed(Keyboard::A))\
  \ {\n        m_LeftPressed = true; \n    }\n    else {\n        m_LeftPressed =\
  \ false; \n    }\n\n    if (Keyboard::isKeyPressed(Keyboard::D)) {\n        m_RightPressed\
  \ = true;\n    }\n    else {\n        m_RightPressed = false;\n    } \n    return\
  \ m_JustJumped; \n}\n```\n\n这段代码看起来非常熟悉。我们正在使用 SFML 的 `isKeyPressed` 函数来检查是否按了 `W`、`A`\
  \ 或 `D` 键。\n\n当按下 `W` 时，玩家尝试跳跃。代码随后使用 `if(!m_IsJumping && !m_IsFalling)` 代码，该代码检查角色是否没有在跳跃且也没有在掉落。当这两个测试都为真时，`m_IsJumping`\
  \ 被设置为 `true`，`m_TimeThisJump` 设置为零，且 `m_JustJumped` 被设置为 `true`。\n\n当上述两个测试都不为真时，将执行\
  \ `else` 子句，并将 `m_Jumping` 设置为 `false`，`m_IsFalling` 设置为 `true`。\n\n按下 `A` 和 `D`\
  \ 键的处理非常简单，只需将 `m_LeftPressed` 和/或 `m_RightPressed` 设置为 `true` 或 `false` 即可。`update`\
  \ 函数现在能够处理角色的移动。\n\n函数中的最后一行代码返回 `m_JustJumped` 的值。这将让调用代码知道是否播放跳跃音效。\n\n我们现在将编写\
  \ `Bob` 类，尽管它与 `Thomas` 类几乎相同，但它有不同的跳跃能力、不同的纹理（Texture），并使用键盘上不同的键。\n\n## 编写 Bob.h\n\
  \n`Bob` 类结构与 `Thomas` 类相同。它继承自 `PlayableCharacter`，有一个构造函数，并提供了 `handleInput` 函数的定义。与\
  \ `Thomas` 相比的区别在于，我们以不同的方式初始化 `Bob` 的一些成员变量，处理输入的方式（在 `handleInput` 函数中）也不同。让我们编写该类并查看细节。\n\
  \n在 `Solution Explorer` 中右键点击 `Header Files`，选择 `Add` | `New Item...`。在 `Add New\
  \ Item` 窗口中，左键点击高亮 `Header File (.h)`，然后在 `Name` 字段中输入 `Bob.h`。最后，点击 `Add` 按钮。我们现在准备好为\
  \ `Bob` 类编写头文件了。\n\n在 `Bob.h` 文件中添加以下代码：\n\n```cpp\n#pragma once\n#include \"PlayableCharacter.h\"\
  \n\nclass Bob : public PlayableCharacter {\npublic: \n    // Bob 特有的构造函数\n    Bob::Bob();\n\
  \    // Bob 的重写输入处理器\n    bool virtual handleInput();\n};\n```\n\n之前的代码与 `Thomas.h`\
  \ 文件相同，除了类名，因此构造函数名也不同。\n\n## 编写 Bob.cpp\n\n在 `Solution Explorer` 中右键点击 `Source\
  \ Files`，选择 `Add` | `New Item...`。在 `Add New Item` 窗口中，左键点击高亮 `C++ File (.cpp)`，然后在\
  \ `Name` 字段中输入 `Thomas.cpp`（注：此处原文误为 Thomas.cpp，逻辑应为 Bob.cpp）。最后，点击 `Add` 按钮。我们现在准备好为\
