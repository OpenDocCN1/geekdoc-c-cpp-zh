  \ 0.998f));\n  m_BGLeftView.setViewport(\n  FloatRect(0.001f, 0.001f, 0.498f, 0.998f));\n\
  \  m_BGRightView.setViewport(\n  FloatRect(0.5f, 0.001f, 0.499f, 0.998f));\n\n \
  \ // 这块显卡支持着色器吗？if (!sf::Shader::isAvailable()) { \n  // 该时候换台 PC m_Window.close();\n\
