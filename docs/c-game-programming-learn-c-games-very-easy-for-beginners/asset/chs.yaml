  \n![](img/image00305.jpeg)\n\n现在来介绍一些新东西。\n\n## OpenGL、着色器与 GLSL\n\n开放图形库 (**OpenGL**)\
  \ 是一个处理 2D 和 3D 图形的编程库。OpenGL 运行在所有主要的桌面操作系统上，还有一个适用于移动设备的版本，OpenGL ES。\n\nOpenGL\
  \ 最初发布于 1992 年。在二十多年里，它得到了不断的完善和改进。此外，显卡制造商设计其硬件以使其与 OpenGL 良好工作。告诉你这些并不是为了上历史课，而是为了解释：尝试改进\
  \ OpenGL 并在桌面 2D（以及 3D）游戏中使用它是一个愚蠢的行为，特别是当你想要让游戏不仅运行在 Windows 上时，它是显而易见的选择。我们已经在用\
  \ OpenGL，因为 SFML 使用了 OpenGL。着色器运行在 GPU 本身上的程序，所以让我们接下来了解更多关于它们的信息。\n\n## 可编程流水线与着色器\n\
  \n通过 OpenGL，我们可以访问所谓的**可编程流水线**。我们可以通过 `RenderWindow.draw` 函数每帧发送我们的图形进行绘制。我们还可以在调用绘制函数后，编写运行在\
  \ GPU 上的代码，这些代码能够独立地操作每一个像素。这是一个非常强大的功能。\n\n这些运行在 GPU 上的额外代码被称为**着色器程序** (shader\
  \ program)。我们可以编写代码，在所谓的**顶点着色器** (vertex shader) 中处理图形的几何形状（位置）。我们还可以编写代码在被称为**片段着色器**\
  \ (fragment shader) 的代码中单独处理每一个像素的外观。\n\n尽管我们不会深入探索着色器，但我们将使用 GLSL 编写一些着色器代码，并将领略其提供的可能性。\n\
  \n在 OpenGL 中，一切都是点、线或三角形。此外，我们还可以为这些基础几何形状附加颜色和纹理，并且还可以组合这些元素来创建我们在今天现代游戏中看到的复杂图形。这些元素统称为**图元**\
  \ (primitives)。我们可以通过 SFML 图元和 `VertexArray`，以及我们见过的 `Sprite` 和 `Shape` 类访问 OpenGL\
  \ 图元。\n\n除了图元之外，OpenGL 还使用矩阵。矩阵是用于执行算术运算的方法和结构。这种算术运算可以从极其简单的高中水平计算（移动/平移坐标）到非常复杂的（执行更高级的数学运算），例如将我们的游戏世界坐标转换为\
  \ OpenGL 可以使用的屏幕坐标。幸运的是，这种复杂性正是 SFML 在背后为我们处理的。\n\n\n\n\nGLSL 本身是一门独立的语言，它有自己的类型，并且可以声明和利用这些类型的变量。此外，我们还可以从\
  \ C++ 代码与着色器程序的变量进行交互。\n\n### 提示\n\n如果你觉得进一步了解可编程图形流水线和着色器的强大之处实在太令人兴奋，以至于不想留到明天，那么我强烈推荐\
  \ Jacobo Rodrguez 编写的《GLSL Essentials》：\n\nhttps://www.packtpub.com/hardware-and-creative/glsl-essentials。这本书探索了桌面端的\
  \ OpenGL 着色器，对于任何具备良好 C++ 编程知识并愿意学习新语言的读者来说，它非常易读。\n\n正如我们将要看到的，GLSL 的语法与 C++ 有一些相似之处。\n\
  \n## 编写片段着色器\n\n以下是 `shaders` 文件夹中 `rippleShader.frag` 文件的代码。你不需要编写这段代码，因为它已经在第\
  \ 12 章 *抽象与代码管理——更好地利用面向对象编程* 中添加的资源中了：\n\n```glsl\n // attributes from vertShader.vert\n\
  varying vec4 vColor;\nvarying vec2 vTexCoord;\n// uniforms\nuniform sampler2D uTexture;\n\
  uniform float uTime;\nvoid main() {\nfloat coef = sin(gl_FragCoord.y * 0.1 + 1 *\
  \ uTime); vTexCoord.y += coef * 0.03;\ngl_FragColor = vColor * texture2D(uTexture,\
  \ vTexCoord); \n}\n```\n\n前四行（不包括注释）是片段着色器将使用的变量。然而，它们并不是普通变量。我们看到的第一个类型是 `varying`。这些是在两个着色器作用域内都有效的变量。接下来，我们有\
  \ `uniform` 变量。这些变量可以直接从我们的 C++ 代码进行操作。我们很快就会看到如何做到。\n\n除了 `varying` 和 `uniform`\
  \ 类型外，每个变量都有一个更常规的类型，定义了实际的数据：\n\n- `vec4` 是一个带有四个值的向量\n- `vec2` 是一个带有两个值的向量\n-\
  \ `sampler2d` 将存储一个纹理\n- `float` 就像 C++ 中的 `float` 一样\n\n`main` 函数内部的代码是实际执行的内容。如果你仔细观察\
  \ `main` 中的代码，你会看到每个变量的使用情况。这段代码的具体作用超出了本书的范围。总之，纹理坐标（`vTexCoord`）和像素/片段的颜色（`glFragColor`）是通过许多数学函数和操作处理的。记住，这会在绘制调用涉及的每一个像素上、在我们游戏的每一帧中执行。此外，请注意\
  \ `uTime` 在每一帧都会以不同的值传入。正如我们很快将看到的，结果将是一个波纹效果。\n\n## 编写顶点着色器\n\n以下是 `vertShader.vert`\
  \ 文件的代码。你不需要编写这段代码，因为它已经在第 12 章 抽象与代码管理——更好地利用面向对象编程中添加的资源中了：\n\n```glsl\n//varying\
  \ \"out\" variables to be used in the fragment shader\nvarying vec4 vColor;\nvarying\
  \ vec2 vTexCoord;\nvoid main() {\n vColor = gl_Color;\n vTexCoord = (gl_TextureMatrix[0]\
  \ * gl_MultiTexCoord0).xy;\n gl_Position = gl_ModelViewProjectionMatrix * gl_Vertex;\n\
  }\n```\n\n首先，注意这两个 `varying` 变量。这些正是我们在片段着色器中操作过的变量。在 `main` 函数中，代码处理了每一个顶点的位置。代码的运行原理超出了本书的范围，但背后有一些非常深入的数学计算，如果你对此感兴趣，那么探索\
  \ GLSL 将非常迷人（参见上一个提示）。\n\n现在我们有两个着色器（一个片段和一个和一个顶点）。我们可以在游戏中使用它们。\n\n## 在 Engine\
  \ 类中添加着色器\n\n打开 `Engine.h` 文件。添加高亮的代码行，该行为 `Engine` 类添加了一个名为 `m_RippleShader` 的\
  \ SFML `Shader` 实例：\n\n```cpp\n // Three views for the background\nView m_BGMainView;\n\
  View m_BGLeftView;\nView m_BGRightView;\nView m_HudView;\n// Declare a sprite and\
  \ a Texture for the background Sprite m_BackgroundSprite;\nTexture m_BackgroundTexture;\
  \ \n// Declare a shader for the background\nShader m_RippleShader;\n// 游戏是否正在运行?\n\
  bool m_Playing = false;\n// 角色 1 或 2 是否当前焦点？\nbool m_Character1 = true;\n```\n\n\
  引擎对象及其所有函数现在都可以访问 `m_RippleShader`。注意，一个 SFML `Shader` 对象将由两个着色器代码文件组成。\n\n"
