  \n## 检测碰撞\n\n我们只需要知道游戏中的某些对象何时碰到其他特定对象。然后我们可以以适当的方式对该事件做出响应。在我们的类中，我们已经添加了在对象碰撞时调用的函数。它们如下：\n\
  \n- `Player` 类有一个 `hit` 函数。当僵尸碰撞玩家时，我们会调用它。\n- `Zombie` 类有一个 `hit` 函数。当子弹碰撞僵尸时，我们会调用它。\n\
  - `Pickup` 类有一个 `gotIt` 函数。当玩家碰撞拾品时，我们会调用它。\n\n如有必要，请回看以复习这些函数是如何作用的。我们现在需要做的只是检测碰撞并调用相应的函数。我们将使用\
  \ `矩形相交`（rectangle intersection）来检测碰撞。这种碰撞检测非常直观（特别是使用 SFML 时）。我们可以想象在要测试碰撞的对象周围画一个想象的矩形——我们可以称之为\
  \ `hitbox`（碰撞盒）或 `bounding rectangle`（边界矩形），然后测试它们是否相交。如果交，我们就发生了碰撞：\n\n![](img/image00280.jpeg)\n\
  \n正如从上一张图片看到的，这并不完美。但在这种情况下足够了。要实现这种方法，我们只需要使用两个对象碰撞的 x 和 y 坐标来测试相交性。\n\n测试两个矩形相交的代码看起来如下所示。不要使用以下代码。它仅供演示：\n\
  \n```cpp\nif(objectA.getPosition().right > objectB.getPosition().left && objectA.getPosition().left\
  \ < objectB.getPosition().right )\n{\n    // objectA 在 x 轴上与敌人相交\n    // 但它们可能高度不同\n\
  \    if(objectA.getPosition().top < objectB.getPosition().bottom && objectA.getPosition().bottom\
  \ > objectB.getPosition().top ) {\n        // objectA 在 y 轴上也与 objectB 相交 // 检测到碰撞\n\
  \    }\n}\n```\n\n\n\n\n然而，我们不需要编写这段代码。我们将使用 `SFML` 的 `intersects` 函数，它作用于 `FloatRect`\
  \ 对象。回想或查看之前的 `Zombie`、`Player`、`Bullet` 和 `Pickup` 类，它们都有一个 `getPosition` 函数，用于返回对象当前位置的\
  \ `FloatRect`。我们将看到如何结合使用 `getPosition` 和 `intersects` 来完成所有的碰撞检测。\n\n我们将通过三个代码部分来这个问题，这部分代码将相互衔接，并且都将位于游戏引擎更新部分的末尾。\n\
  \n在每一帧，我们需要知道以下三个问题的答案：\n\n僵尸是否被击中了？\n\n玩家是否被僵尸触碰了？\n\n玩家是否碰到了拾品？\n\n首先，让我们为 `score`\
  \ 和 `hisore` 再添加两个变量。然后我们可以在僵尸被击杀时更改它们。添加以下代码：\n\n```cpp\n // 创建几个拾品\nPickup healthPickup(1);\n\
  \nPickup ammoPickup(2);\n\n// 关于游戏的变量 int score = 0; int hiScore = 0; \n\n// 主游戏循环\
  \ while (window.isOpen()) 现在让我们开始检测僵尸是否与子弹碰撞。\n```\n\n## 僵尸是否被击中了？\n\n以下代码看起来可能复杂，但当我们逐行执行时，会发现它其实并不是我们没见过的东西。在每帧更新拾品的调用之后添加以下代码。然后我们可以过一遍：\n\
  \n```cpp\n // 更新拾品\nhealthPickup.update(dtAsSeconds);\n\nammoPickup.update(dtAsSeconds);\n\
  \n// 碰撞检测\n// 有没有僵尸被击中？\nfor (int i = 0; i < 100; i++)\n{\nfor (int j = 0; j < numZombies;\
