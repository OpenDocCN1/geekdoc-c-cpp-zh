  \ 10%。\n\n# 第 16 章 扩展 SFML 类、粒子系统和着色器\n\n在最后一章中，我们将探索扩展他人类的 C++ 概念。具体来说，我们将查看 SFML\
  \ 的 `Drawable` 类以及将其作为我们自己类基类的好处。我们还将触及 OpenGL 着色器的话题，并看看使用另一种语言 `OpenGL Shading\
  \ Language` (`GLSL`) 编写代码（它可以可以直接在显卡上运行）如何实现原本无法实现的流畅图形效果。一如既常，我们还将利用新技能和知识来增强当前项目。\n\
  \n以下是我们将顺序涵盖的主题列表：\n\n- SFML Drawable 类\n- 构建粒子系统\n- OpenGL 着色器和 GLSL\n- 在 Thomas\
  \ Was Late 游戏中使用着色器\n\n# SFML Drawable 类\n\n`Drawable` 类只有一个函数。它也没有任何变量。此外，它唯一的函数是纯虚函数。这意味着如果我们继承自\
  \ `Drawable`，就必须实现它那唯一的函数。这样做的目的（你可能记得在第 12 章 *抽象与代码管理——更好地利用 OOP* 中提到过这一点）是，我们就可以将继承自\
  \ `drawable` 的类用作多态类型。简单来说，任何 SFML 允许我们对 `Drawable` 对象执行的操作，我们都能在继承自它的类上执行。唯一的要求是，我们必须为纯虚函数\
  \ `draw` 提供定义。\n\n某些继承自 `Drawable` 的类已经包含了 `Sprite` 和 `VertexArray`（等）。每当我们使用 `Sprite`\
  \ 或 `VertexArray` 时，我们都会将它们传递给 `RenderWindow` 类的 `draw` 函数。\n\n我们之所以能够绘制书中绘制的每一个对象，是因为它们都继承自\
  \ `Drawable`。我们可以利用这一知识来让自己处于优位。\n\n我们可以让任何喜欢的对象继承自 `Drawable`，只要我们实现了纯虚的 `draw`\
  \ 函数。这也是一个直接的过程。一个自 `Drawable` 的假设 `SpaceShip` 类的头文件如下：\n\n```cpp\nclass SpaceShip\
  \ : public Drawable {\nprivate:\n    Sprite m_Sprite;\n    // 更多私有成员\npublic:\n\
  \    virtual void draw(RenderTarget& target, RenderStates states) const;\n    //\
  \ 更多公共成员\n};\n```\n\n在之前的代码中，我们可以看到纯虚函数 `draw` 和一个 `Sprite`。注意，在类外部没有方法访问私有的 `Sprite`，甚至没有\
  \ `getSprite` 函数！\n\n`SpaceShip.cpp` 文件将看起来像下面：\n\n```cpp\nvoid SpaceShip::SpaceShip\
  \ {\n    // 设置宇宙飞器\n}\nvoid SpaceShip::draw(RenderTarget& target, RenderStates states)\
  \ const\n{\n    target.draw(m_Sprite, states);\n}\n// 其他任何函数\n```\n\n在之前的代码中，注意\
  \ `draw` 函数的简单实现。这些参数超出了本书的范围。只需注意 `target` 参数用于调用 `draw` 并传入 `m_Sprite` 以及另一个参数\
  \ `states`。\n\n### 提示\n\n虽然不需要理解这些参数就能充分利用 `Drawable`，但在本书的语境下，你可能会对此感兴趣。你可以在 SFML\
  \ 网站上阅读更多关于 SFML `Drawable` 类的信息：http://www.sfml-dev.org/tutorials/2.3/graphics-vertex-array.php#creatingan-sfml-like-entity\n\
  \n在主游戏循环中，我们现在可以将 `SpaceShip` 实例视为 `Sprite` 或任何其他继承自 `Drawable` 的类：\n\n```cpp\n\
  SpaceShip m_SpaceShip;\n//在此创建其他对象 // ...\n// 在 draw 函数中 // 清除最后一帧\nm_Window.clear(Color::Black);\n\
  // 绘制宇宙飞器 m_Window.draw(m_SpaceShip); // 此处更多绘制\n// ...\n// 显示我们刚刚绘制的所有内容 m_Window.display();\n\
  ```\n\n正因为 `SpaceShip` 是一个 `Drawable`，我们才能像对待 `Sprite` 或 `VertexArray` 一样对待它，而且由于我们重写了纯虚\
  \ `draw` 函数，一切都按照我们的预期运行。让我们看看将绘制代码封装到游戏对象的另一种方法。\n\n## 继承 Drawable 的替代方案\n\n也可以通过在我们类内部实现自己的函数将所有的绘制功能保留在要绘制对象的类中，可能如下所示：\n\
  \n```cpp\nvoid drawThisObject(RenderWindow window)\n{\n    window.draw(m_Sprite)\n\
  } \n```\n\n之前的代码假设 `m_Sprite` 代表我们正在绘制的当前类的视觉外观，正如在本项目及之前的项目中一直是这样。假设包含 `drawThisObject`\
  \ 函数的类实例名为 `playerHero`，并且进一步假设我们有一个名为 `m_Window` 的 `RenderWindow` 实例，我们就可以用以下代码从主游戏循环绘制对象：\n\
  \n```cpp\nplayerHero.draw(m_Window);\n```\n\n在这一解决方案中，我们将 `RenderWindow`, `m_Window`\
  \ 作为参数传入 `drawThisObject` 函数。`drawThisObject` 函数然后使用 `RenderWindow` 来绘制 `Sprite`,\
  \ `m_Sprite`。\n\n这种解决方案看起来确实比扩展 `Drawable` 更简单。我们之所以按照建议的方式（扩展 `Drawable`）做事，对于这个项目本身其实并没有什么好处。我们之所以很快就能用这种方法绘制出酷的爆炸，是因为这是一个值得学习的技术。\n\
  \n## 为什么继承 Drawable 是最好的？\n\n通过本书中完成的每个项目，我们学习了更多关于游戏、C++ 和 SFML 的知识。从一个游戏到下一个游戏，我们可能最大的改进在于代码结构——我们使用的编程模式。\n\
  \n如果本书还有第四个项目，我们可以进一步。遗憾没有，但请考虑以下改进代码的想法。\n\n假设我们游戏中的每个对象都派生自单一、简单的抽象基类。我们将其命名为\
  \ `GameObject`。`GameObject` 可能具有 `getPosition` 等具体函数。它可能有一个纯虚的 `update` 函数（因为每个对象的更新方式不同）。此外，考虑到\
  \ `GameObject` 继承自 `Drawable`。\n\n现在看这个假设的代码：\n\n```cpp\nvector<GameObject> m_GameObjects;\n\
  ```\n\n\n\n\n```cpp\n// 初始化所有游戏对象的代码\n\n// 包括瓦片、角色、敌人、子弹和其他任何\n\n// 在 update 函数中\n\
  \nfor (i = m_GameObjects.begin(); i != m_GameObjects.end(); i++) {\n    (*i).update(elapsedTime);\n\
  }\n\n// 搞定！\n\n// 在 draw 函数中 // 清除上一帧 m_Window.clear(Color::Black);\n\nfor (i =\
  \ m_GameObjects.begin(); i != m_GameObjects.end(); i++) {\n    // 显示我们刚刚绘制的所有内容\
  \ m_Window.display();\n\n    // 搞定！ \n    m_Window.draw(*i);\n}\n```\n\n与这个最终项目相比，之前的代码在封装性、代码可管理性和优雅性方面有了质的飞跃。然而，如果你观察之前的代码，你会发现其中还有一些未解决的问题，例如碰撞检测应该放在什么位置。尽管如此，希望你能看到，要精通\
  \ C++，进一步的研究（通过构建大量游戏）是必要的。\n\n尽管我们不会以这种方式实现整个游戏，但我们将看到如何设计一个 `ParticleSystem` 类并将其直接传递给\
  \ `m_Window.draw(m_MyParticleSystemInstance)`。\n\n# 构建粒子系统\n\n在开始编写代码之前，确切知道我们正尝试实现什么会有帮助。请看下面的截图：\n\
  \n![](img/image00304.jpeg)\n\n这是纯色背景上粒子效果的截图。我们将在游戏中使用这种效果。\n\n我们实现效果的方法如下：\n\n\
  1. 在选定的像素位置生成 1,000 个点（粒子），一个接一个地叠在一起。\n2. 在游戏的每一帧中，让这 1,000 个粒子中的每一个以预定的但随机的速度和角度向外移动。\n\
  3. 重复步骤二秒钟，然后让粒子消失。\n\n我们将使用 `VertexArray` 来绘制所有的点，并使用 `Point` 原始类型在视觉上表示每个粒子。此外，我们将继承自\
  \ `Drawable`，以便我们的粒子系统可以处理自身的绘制。\n\n## 编写 Particle 类\n\n`Particle` 类将是一个简单的类，仅代表\
  \ 1,000 个粒子中的一个。让我们开始编写代码吧。\n\n## 编写 Particle.h\n\n在**解决方案管理器**中右键点击**头文件**并选择**添加**\
  \ | **新建项...**。在**新建项**窗口中，高亮显示（通过左键点击）**头文件** (.h)，然后在**名称**字段中输入 `Particle.h`。最后，点击**添加**按钮。我们现在准备好为\
  \ `Particle` 类编写头文件代码代码了。\n\n在 `Particle.h` 文件中添加以下代码：\n\n```cpp\n#pragma once\n\
  \n#include <SFML/Graphics.hpp>\n\nusing namespace sf;\n\n class Particle\n{\n\n\
  private: \nVector2f m_Position;\nVector2f m_Velocity;\n\npublic:\nParticle(Vector2f\
  \ direction);\nvoid update(float dt);\nvoid setPosition(Vector2f position);\nVector2f\
  \ getPosition();\n};\n```\n\n在前面的代码中，有两个 `Vector2f` 对象。一个将代表粒子的水平和垂直坐标，另一个将代表水平和垂直速度。\n\
  \n### 注意\n\n当你在多个方向上都有变化率（速度）时，组合后的值也定义了一个方向。这被称为**速度 (velocity)**；因此，`Vector2f`\
  \ 被命名为 `m_Velocity`。\n\n我们还有几个公共函数。首先是构造函数。它接收一个 `Vector2f`，用于让粒子知道它将具有方向/速度。这意味着是由系统而不是粒子本身来选择速度的。\n\
  \n接下来是 `update` 函数，它接收上一帧花费的时间。我们将用它来精确地按正确的量移动粒子。\n\n最后两个函数 `setPosition` 和 `getPosition`\
  \ 分别用于将粒子移动到指定位置并获取其位置。所有这些函数在我们编写代码时将变得完全有意义。\n\n## 编写 Particle.cpp 文件\n\n在**解决方案管理器**中右键点击**源文件**并选择**添加**\
  \ | **新建项...**。在**新建项**窗口中，高亮显示（通过左键点击）**C++ 文件** (.cpp)，然后在**名称**字段中输入 `Particle.cpp`。最后，点击**添加**按钮。我们现在准备好为\
  \ `Particle` 类编写 .cpp 文件了。\n\n在 `Particle.cpp` 中添加以下代码：\n\n```cpp\n#include \"stdafx.h\"\
  \ #include \"Particle.h\"\n\nParticle::Particle(Vector2f direction) {\n\n // 确定方向\
  \ //m_Velocity = direction; m_Velocity.x = direction.x; m_Velocity.y = direction.y;\n\
  \n}\n\nvoid Particle::update(float dtAsSeconds) {\n\n// 移动粒子\nm_Position += m_Velocity\
  \ * dtAsSeconds;\n\n}\n\nvoid Particle::setPosition(Vector2f position) {\n\nm_Position\
  \ = position;\n\n}\n\nVector2f Particle::getPosition()\n{\n\nreturn m_Position;\n\
  } \n```\n\n这些函数都使用了我们之前见过的概念。构造函数使用传入的 `Vector2f` 对象设置 `m_Velocity.x` 和 `m_Velocity.y`\
  \ 的值。\n\n`update` 函数通过将 `m_Velocity` 乘以经过的时间 (`dtAsSeconds`) 来移动粒子的水平和垂直位置。注意，为了实现这一点，我们简单地将两个\
  \ `Vector2f` 对象相加即可。不需要对 `x` 和 `y` 成员分别进行计算。\n\n如之前所述，`setPosition` 函数使用传入的值初始化\
  \ `m_Position` 对象。`getPosition` 函数将 `m_Position` 返回给调用代码。\n\n我们现在有了一个功能完备的 `Particle`\
  \ 类。接下来，我们将编写一个 `ParticleSystem` 类来生成和控制粒子。\n\n## 编写 ParticleSystem 类\n\n`ParticleSystem`\
  \ 类为我们的粒子效果承担大部分工作。我们将在 Engine 类中创建该类的实例。\n\n## 编写 ParticleSystem.h\n\n在**解决方案管理器**中右键点击**头文件**并选择**添加**\
  \ | **新建项...**。在**新建项**窗口中，高亮显示（通过左键点击）**头文件** (.h)，然后在**名称**字段中输入 `ParticleSystem.h`。最后，点击**添加**按钮。我们现在准备好为\
  \ `ParticleSystem` 类编写头文件代码。\n\n在 `ParticleSystem.h` 中添加 `ParticleSystem` 类的代码：\n\
  \n```cpp\n#pragma once\n\n#include <SFML/Graphics.hpp> #include \"Particle.h\"\n\
  \nusing namespace sf; using namespace std;\n\nclass ParticleSystem : public Drawable\
  \ {\n\nprivate:\n\nvector<Particle> m_Particles; VertexArray m_Vertices; float m_Duration;\n\
  \nbool m_IsRunning = false;\n\npublic:\n\nvirtual void draw(RenderTarget& target,\
  \ RenderStates states) const;\nvoid init(int count);\nvoid emitParticles(Vector2f\
  \ position); void update(float elapsed);\n\nbool running();\n\n};\n```\n\n让我们逐一分析这些。首先，注意我们正在继承自\
  \ `Drawable`。这正是我们能够将 `ParticleSystem` 实例传递给 `m_Window.draw` 的原因，因为 `ParticleSystem`\
  \ 是 `Drawable`。\n\n有一个名为 `m_Particles` 的 vector，类型为 `Particle`。这个 vector 将持有每一个\
  \ `Particle` 实例。接下来我们有一个名为 `m_Vertices` 的 `VertexArray`。这将用于以大量的 `Point` 原始类型绘制所有粒子。float\
  \ `m_Duration` 是每个效果持续的时间。我们将在构造函数中初始化它。布尔变量 `m_IsRunning` 将用于指示粒子系统当前是否正在使用。\n\n\
  接下来，在公共部分，我们有一个纯虚函数 `draw`，我们将很快实现它，以处理当我们将实例传递给 `m_Window.draw` 时发生的情况。\n\n`init`\
  \ 函数将准备 `VertexArray` 和 vector。它还将初始化所有的 `Particle` 对象（由 vector 持）的速度和初始位置。\n\n\
  `update` 函数将遍历 vector 中的每一个 `Particle` 实例并调用它们各自的更新函数。\n\n`running` 函数提供了访问 `m_IsRunning`\
  \ 变量的接口，以便游戏引擎查询 `ParticleSystem` 是否正在使用。\n\n让我们编写函数定义，看看 `ParticleSystem` 内部发生了什么。\n\
  \n\n\n\n在 `Solution Explorer`（解决方案管理器）中右键点击 `Source Files`，并选择 `Add` | `New Item...`。在\
  \ `Add New Item` 窗口中，点击（左键单击）高亮 `C++ File (.cpp)`，然后在名称 `Name` 字段中输入 `ParticleSystem.cpp`。最后，点击\
  \ `Add` 按钮。我们现在准备好为 `ParticleSystem` 类编写 `.cpp` 文件了。\n\n我们将此文件分为五个部分，以便更好地进行编码和讨论。按照所示添加第一部分代码：\n\
  \n```cpp\n#include \"stdafx.h\"\n\n#include <SFML/Graphics.hpp>\n\n#include \"ParticleSystem.h\"\
  \n\nusing namespace sf; using namespace std;\n\nvoid ParticleSystem::init(int numParticles)\
  \ {\n\n  m_Vertices.setPrimitiveType(Points); m_Vertices.resize(numParticles);\n\
  \n  // 创建粒子\n\n  for (int i = 0; i < numParticles; i++) {\n\n    srand(time(0) +\
  \ i);\n\n    float angle = (rand() % 360) * 3.14f / 180.f; float speed = (rand()\
  \ % 600) + 600.f; \n\n    Vector2f direction;\n\n    direction = Vector2f(cos(angle)\
  \ * speed, sin(angle) * speed);\n\n    m_Particles.push_back(Particle(direction));\n\
  \n  } }\n```\n\n在包含必要的头文件后，我们有了 `init` 函数的定义。我们调用 `setPrimitiveType` 并传入 `Points`\
  \ 作为参数，以便 `m_VertexArray` 知道它将处理什么种类型的原始基形。我们使用 `numParticles` 调整 `m_Vertices` 的大小，该值是在调用\
  \ `init` 函数时传入的。\n\n`for` 循环为 `speed` 和 `angle` 创建随机值。然后它使用三角函数将这些值转换为向量，并存储在 `Vector2f`\
  \ 类型 `direction` 中。\n\n### 提示\n如果你想了解更多关于三角函数（`cos`、`sin` 和 `tan`）如何将角度和速度转换为向量，可以查看系列文章：http://gamecodeschool.com/essentials/calculating-heading-in2d-games-using-trigonometric-functions-part-1/\n\
  \n`for` 循环（以及 `init` 函数）中发生的最后一件事是将向量传递给 `Particle` 构造函数。新的 `Particle` 实例使用 `push_back`\
  \ 函数存储在 `m_Particles` 中。因此，调用值为 `1000` 的 `init` 意味着我们有一千个带有随机速度的 `Particle` 实例，它们被储存在\
  \ `m_Particles` 中正等待爆发！\n\n接下来，向 `ParticleSystem.cpp` 中添加 `update` 函数：\n\n```cpp\n\
  void ParticleSystem::update(float dt) {\n\n  m_Duration -= dt;\n\n  vector<Particle>::iterator\
  \ i; int currentVertex = 0;\n\n  for (i = m_Particles.begin(); i != m_Particles.end();\
  \ i++) {\n\n    // 更新顶点数组\n\n    m_Vertices[currentVertex].position = (*i).getPosition();\n\
  \n    // 移动粒子 (*i).update(dt);\n\n    // 移动到下一个顶点 currentVertex++;\n  }\n\n  if\
  \ (m_Duration < 0)\n  {\n    m_IsRunning = false;\n  } \n}\n```\n\n`update` 函数比初看起来看起来要简单。首先，`m_Duration`\
  \ 减去了了传入的时间 `dt`。这样我们就能知道两秒钟何时结束。声明了一个向量迭代器 `i` 用于操作 `m_Particles`。\n\n`for` 循环遍历\
  \ `m_Particles` 中的每一个 `Particle` 实例。对于每一个实例，它都会调用其 `update` 函数并传入 `dt`。每个粒子都会更新自己的位置。在粒子完成自更新后，通过使用粒子的\
  \ `getPosition` 函数更新 `m_Vertices` 中对应的顶点。在每次循环结束时，`for` 循环的 `currentVertex` 会加 1，为下一个顶点做准备准备。\n\
  \n在 `for` 循环完成后，`if(m_Duration < 0)` 检查是否该关闭特效了。如果已经过了两秒，`m_IsRunning` 将设置为 `false`。\n\
  \n接下来，添加 `emitParticles` 函数：\n\n```cpp\nvoid ParticleSystem::emitParticles(Vector2f\
  \ startPosition) {\n\n  m_IsRunning = true; m_Duration = 2;\n\n  for (i = m_Particles.begin();\
  \ i != m_Particles.end(); i++)\n  {\n    m_Vertices[currentVertex].color = Color::Yellow;\
  \ (*i).setPosition(startPosition); \n\n    vector<Particle>::iterator i; int currentVertex\
  \ = 0;\n\n    currentVertex++; \n  }\n}\n```\n\n这是我们将用来启动粒子系统运行的函数。正如预期的那样，我们将 `m_IsRunning`\
  \ 设置为 `true` 并将 `m_Duration` 设置为 `2`。我们声明了一个迭代器 `i` 来遍历 `m_Particles` 中所有的 `Particle`\
  \ 对象，然后在 `for` 循环中执行该操作。\n\n在 `for` 循环内部，我们将顶点数组中的每个粒子设置为黄色，并将每个位置设置为作为参数传入的 `startPosition`。记住，每个粒子的生命周期始于完全相同的位置，但它们被分配了不同的速度。\n\
  \n接下来，添加纯虚函数 `draw` 的定义：\n\n```cpp\nvoid ParticleSystem::draw(RenderTarget& target,\
  \ RenderStates states) const\n{ \n  target.draw(m_Vertices, states);\n}\n```\n\n\
  在之前的代码中，我们简单地使用 `target` 调用 `draw`，并传入 `m_Vertices` 和 `states`。这与在本章之前讨论 `Drawable`\
  \ 时的情况完全一样，只不过我们传入的是我们的 `VertexArray`，它持有 1,000 个点原始基形，而不是假设的飞船 `Sprite`。\n\n最后，添加\
  \ `running` 函数：\n\n```cpp\nbool ParticleSystem::running()\n{\n  return m_IsRunning;\n\
  }\n```\n\n`running` 函数是一个简单的 getter 函数，返回 `m_IsRunning` 的值。我们将看到这在哪里有助于确定粒子系统的当前状态。\n\
  \n## 使用 ParticleSystem\n让我们的粒子系统运行起来非常简单，特别是我们继承了 `Drawable`。\n\n### 在 Engine 类中添加\
  \ ParticleSystem 对象\n打开 `Engine.h` 并添加一个 `ParticleSystem` 对象，如下所示高亮代码所示：\n\n```cpp\n\
  #pragma once\n\n#include <SFML/Graphics.hpp>\n\n#include \"TextureHolder.h\"\n\n\
