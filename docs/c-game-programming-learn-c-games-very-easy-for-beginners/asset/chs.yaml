  );\n  // 将精灵与纹理关联\n  m_BackgroundSprite.setTexture(m_BackgroundTexture); // 加载背景顶点数组的纹理\n\
  \  m_TextureTiles = TextureHolder::GetTexture(\n  \"graphics/tiles_sheet.png\");\n\
  \n  // 初始化粒子系统 m_PS.init(1000);\n} // 构造函数结束\n```\n\n`VertexArray` 和 `Particle`\
  \ 实例已准备就绪。\n\n### 每帧更新粒子系统\n打开 `Update.cpp` 文件并添加以下高亮代码。它可以放在 `update` 函数的末尾：\n\n\
  ```cpp\n // 每 m_TargetFramesPerHUDUpdate 帧更新 HUD 如果 (m_FramesSinceLastHUDUpdate\
  \ > m_TargetFramesPerHUDUpdate) {\n  // 更新游戏 HUD 字符串流 ssTime; stringstream ssLevel;\n\
  \n  // 更新时间文本\n  ssTime << (int)m_TimeRemaining; m_Hud.setTime(ssTime.str());\n\n\
  \  // 更新等级文本\n  ssLevel << \"Level:\" << m_LM.getCurrentLevel(); m_Hud.setLevel(ssLevel.str());\n\
  \n  m_FramesSinceLastHUDUpdate = 0; }\n\n  // 更新粒子 如果 (m_PS.running()) { \n  m_PS.update(dtAsSeconds);\
  \ }\n\n} // update 函数结束\n```\n\n\n\n之前的代码中需要的只是调用 `update`。注意，它被包装在一个检查中，以确保系统当前正在运行。如果系统没有运行，更新它也就没有意义。\n\
  \n## 启动粒子系统\n\n打开 `DetectCollisions.cpp` 文件，其中包含 `detectCollisions` 函数。当我们最初在第 15\
  \ 章*构建可玩关卡与碰撞检测*中编写代码时，我们已经在里面留了一行注释。\n\n根据上下文确定正确的位置，并添加如下所示的高亮代码：\n\n```cpp\n\
  \ // 角色是否与普通方块碰撞\n\nif (m_ArrayLevel[y][x] == 1)\n\n{\nif (character.getRight().intersects(block))\n\
  {\ncharacter.stopRight(block.left);\n}\nelse if (character.getLeft().intersects(block))\n\
