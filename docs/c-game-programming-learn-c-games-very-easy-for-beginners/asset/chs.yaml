  // 绘制 bob\nm_Window.draw(m_Bob.getSprite());\n// 绘制粒子系统 如果 (m_PS.running())\n{\n\
  m_Window.draw(m_PS); }\n}\n// 绘制 HUD\n// 切换到 m_HudView\nm_Window.setView(m_HudView);\
  \ m_Window.draw(m_Hud.getLevel()); m_Window.draw(m_Hud.getTime()); if (!m_Playing)\n\
  { \nm_Window.draw(m_Hud.getMessage()); }\n// 显示我们刚刚绘制的所有内容 m_Window.display();\n\
