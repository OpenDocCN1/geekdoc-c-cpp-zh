  \n如果当前子弹和僵尸发生了碰撞，我们就采取以下几个步骤：\n\n1. 使用此代码停止子弹：`bullets[i].stop();`\n2. 通过调用其 `hit`\
  \ 函数注册当前僵尸的命中。注意 `hit` 函数返回一个布尔值，让调用代码知道僵尸是否死亡。这在下面的代码行所示：`// 注册命中并判断是否击杀 if (zombies[j].hit())\
