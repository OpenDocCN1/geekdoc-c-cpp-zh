  \n# 第 11 章：音效、文件 I/O 以及完成游戏\n\n我们快要完成了。这个简短的章节将演示我们如何使用 C++ 标准库轻松操作硬盘上存储的文件，我们还将添加音效。当然，我们知道如何添加音效，但我们将具体讨论在代码的哪个位置调用\
  \ `play`。我们还把处理一些遗留问题，以使游戏变得完整。\n\n在本章中，我们将学习以下主题：\n- 保存和加载最高分\n- 添加音效\n- 允许玩家升级\n\
  - 创建永无止境的多个波次\n\n## 保存和加载最高分\n\n文件 I/O（即输入/输出）是一个相当技术性的课题。对我们来说的是，由于它是编程中非常常见的需求，有一个库可以为我们处理所有的复杂性。就像为我们的\
  \ HUD 拼接字符串一样，是**标准库**（Standard Library）通过 `fstream` 必要的功能。\n\n首先，我们以包含 `sstream`\
  \ 的相同包含 `fstream`：\n\n```cpp\n#include \"stdafx.h\"\n#include <sstream>\n#include\
  \ <fstream>\n#include <SFML/Graphics.hpp>\n#include \"ZombieArena.h\"\n#include\
  \ \"Player.h\"\n#include \"TextureHolder.h\"\n#include \"Bullet.h\"\n#include \"\
  Pickup.h\"\n\nusing namespace sf;\n```\n\n现在，在 `ZombieArena/ZombieArena` 文件夹中创建一个名为\
  \ `gamedata` 的新文件夹。接着，在此文件夹中右键并创建一个名为 `scores.txt` 的新文件。我们将在这个文件中保存玩家的最高分。你可以打开文件并为其添加一个分数。如果你这样做，请确保分数足够低，这样我们就可以轻松测试超过该分数是否会导致新分数的加入。完成后务必关闭文件，否则游戏将无法访问它。\n\
  \n在下一个代码中，我们创建了一个名为 `InputFile` 的 `ifstream` 对象，并将刚刚创建的文件夹和文件作为参数传递给它的构造函数。\n\n\
  `if(InputFile.is_open())` 代码检查文件是否存在并已准备好读取。然后我们将文件内容放入 `hiScore` 并关闭文件。添加以下高亮代码：\n\
  \n```cpp\n// 分数\nText scoreText;\nscoreText.setFont(font);\nscoreText.setCharacterSize(55);\
  \ scoreText.setFillColor(Color::White); scoreText.setPosition(20, 0);\n\n// 从文本文件加载最高分\n\
  std::ifstream inputFile(\"gamedata/scores.txt\"); \nif (inputFile.is_open())\n{\n\
  \    inputFile >> hiScore; \n    inputFile.close();\n}\n\n// 最高分\nText hiScoreText;\n\
  hiScoreText.setFont(font);\nhiScoreText.setCharacterSize(55); hiScoreText.setFillColor(Color::White);\
  \ hiScoreText.setPosition(1400, 0); \nstd::stringstream s;\ns << \"Hi Score:\" <<\
  \ hiScore;\nhiScoreText.setString(s.str()); \n```\n\n现在我们处理保存可能的新最高分。在处理玩家健康值小于或等于零的块中，我们创建了一个名为\
  \ `outputFile` 的 `ofstream` 对象，将 `hiScore` 的值写入文本文件，然后关闭文件：\n\n```cpp\n// 僵尸碰到了玩家\n\
  for (int i = 0; i < numZombies; i++)\n{\n    if (player.getPosition().intersects(zombies[i].getPosition())\
  \ && zombies[i].isAlive())\n    {\n        if (player.hit(gameTimeTotal)) {\n  \
  \          // 稍后这里还有更多内容\n        }\n        if (player.getHealth() <= 0) {\n  \
  \          state = State::GAME_OVER;\n            std::ofstream outputFile(\"gamedata/scores.txt\"\
  ); \n            outputFile << hiScore;\n            outputFile.close();\n     \
  \   }\n    }\n} // 玩家触碰结束\n```\n\n你可以玩游戏，你的最高分将被保存。退出游戏并注意如果你再次玩，你的最高分仍然在那里。让我们制造点噪音吧。\n\
  \n## 准备音效\n\n在这一节中，我们将创建所有需要的 `SoundBuffer` 和 `Sound` 对象，以便为游戏添加一系列音效。\n\n首先添加必要的\
  \ SFML 包含文件：\n\n```cpp\n#include \"stdafx.h\"\n#include <sstream>\n#include <fstream>\n\
  #include <SFML/Graphics.hpp>\n#include <SFML/Audio.hpp>\n#include \"ZombieArena.h\"\
  \n#include \"Player.h\"\n#include \"TextureHolder.h\"\n#include \"Bullet.h\"\n#include\
  \ \"Pickup.h\"\n```\n\n现在继续添加七个 `SoundBuffer` 和 `Sound` 对象，加载并准备我们在第 6 章：*面向对象编程、类和\
  \ SFML Views* 中准备的七个声音文件：\n\n```cpp\n// 我们上一次更新 HUD 是什么时候\nint framesSinceLastHUDUpdate\
  \ = 0;\n\n// 上次更新的时间\nTime timeSinceLastUpdate;\n\n// 每隔多少帧我们应该更新一次 HUD\nint fpsMeasurementFrameInterval\
  \ = 1000;\n\n// 准备击中音效\nSoundBuffer hitBuffer;\nhitBuffer.loadFromFile(\"sound/hit.wav\"\
  ); \nSound hit;\nhit.setBuffer(hitBuffer);\n\n// 准备溅血音效\nSoundBuffer splatBuffer;\n\
  splatBuffer.loadFromFile(\"sound/splat.wav\"); \nsf::Sound splat;\nsplat.setBuffer(splatBuffer);\n\
  \n// 准备射击音效\nSoundBuffer shootBuffer;\nshootBuffer.loadFromFile(\"sound/shoot.wav\"\
  ); \nSound shoot;\nshoot.setBuffer(shootBuffer);\n\n// 准备装弹音效\nSoundBuffer reloadBuffer;\n\
  reloadBuffer.loadFromFile(\"sound/reload.wav\"); \nSound reload;\nreload.setBuffer(reloadBuffer);\n\
  \n// 准备失败音效\nSoundBuffer reloadFailedBuffer;\nreloadFailedBuffer.loadFromFile(\"\
  sound/reload_failed.wav\"); \nSound reloadFailed;\nreloadFailed.setBuffer(reloadFailedBuffer);\n\
  \n// 准备强化音效\nSoundBuffer powerupBuffer;\n```\n\n\n\n\n\n```cpp\npowerupBuffer.loadFromFile(\"\
  sound/powerup.wav\"); Sound powerup;\n\npowerup.setBuffer(powerupBuffer);\n\n//\
  \ 准备拾取音\n\nSoundBuffer pickupBuffer;\n\npickupBuffer.loadFromFile(\"sound/pickup.wav\"\
  ); Sound pickup;\n\npickup.setBuffer(pickupBuffer); \n\n// 主游戏循环 while (window.isOpen())\n\
  ```\n\n现在，七种音效已经准备就绪。我们只需要确定在代码中将每个 `play` 函数的调用放在什么位置即可。\n\n# 升级\n\n我们将添加的后续代码将允许玩家在波次之间进行升级。由于我们之前已经做了一些工作，实现这一目标非常简单。\n\
  \n在处理玩家输入的 `LEVELING_UP` 状态中添加高亮的代码：\n\n```cpp\n// 处理 LEVELING_UP 状态\n\nif (state\
