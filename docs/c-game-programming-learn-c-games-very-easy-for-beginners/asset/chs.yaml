  我们将在接下来的章节中添加一些可以交互的可玩关卡。\n\n# 第 14 章。构建可玩关卡与碰撞检测\n\n这一章可能是整个项目中最有成就感的章节之一。原因是，在本章结束时，我们将拥有一个可以运行的游戏。尽管还会有一些功能需要实现（声音、粒子特效、HUD\
  \ 和着色器效果），但 Bob 和 Thomas 将能够跑步、跳跃并探索世界。此外，你只需通过在文本文件中创建平台和障碍物，就可以创建几乎任何大小或复杂度的自定义关卡设计。\n\
  \n我们将通过在本章中涵盖以下主题来实现这一切：\n\n- 探索如何在文本文件中设计关卡\n- 构建一个 `LevelManager` 类，它将从文本文件中加载关卡，将它们转换为游戏可以使用的数据，并跟踪关卡细节（如出生位置、当前关卡和允许的时间限制）\n\
  - 更新游戏引擎以使用 `LevelManager`\n- 编写一个多态函数来处理 Bob 和 Thomas 的碰撞检测\n\n# 设计一些关卡\n\n还记得我们在第\
  \ 12 章 *抽象与代码管理 - 更好地利用 OOP* 中介绍的精灵图吗？这里再次显示它，并用数字进行了标注，这些数字代表了我们构建关卡时将要使用的每个瓷块（tile）：\n\
