  ZombieArena\\ZombieArena\\fonts`。现在是时候学习更多 `C++` 了，我们可以开始为僵尸竞技编写代码了。\n\n### OOP\n\
  \nOOP 是一种我们可以认为几乎是标准的编码编程范式。确实存在非 OOP 的编码方式，甚至还有一些非 OOP 的游戏编程语言和库。然而，从零开始（正如本书这样做），没有理由采用任何其他方式。当\
  \ OOP 的优势变得显而易见时，你将永远不再回头。\n\nOOP 将：\n\n- 使我们的代码更容易管理、更改或更新\n- 使我们的代码编写得更快更可靠\n\
  - 能够轻松使用他人的代码（如 SFML）\n\n我们已经看到第三个优势的应用了。让我们通过引入一个需要解决的问题来观察前两个优势。我们面临的问题是当前项目的复杂性。让我们只考虑单个僵尸以及为了让它在游戏中运行我们需要什么：\n\
  \n- 水平和和垂直位置\n- 大小\n- 它面对的方向\n- 每个类型僵尸的不同纹理\n- 精灵图（Sprites）\n- 每个类型僵尸的不同速度\n- 每个类型僵尸的不同生命值\n\
  - 跟踪每个僵尸的类型\n- 碰撞检测数据\n- 智能（追逐玩家）\n- 僵尸是活着的还是死的？\n\n\n\n\n这个列表建议了类中的许多个变量！我们可能需要管理这些变量，以及所有的\
  \ OOP 特性。那么，复杂性呢？到最后，所有的 OOP 让这种复杂性变得容易管理。\n\n幸运的是，处理复杂性并不是一个新问题，C++ 从一开始就是为了解决这类问题而设计的。\n\
  \n## 什么是 OOP？\n\nOOP 是一种编程方法，它将我们的需求拆解为比整体更易管理的区块。\n\n每个区块都是自的，并且可以被其他程序复用，同时与其他区块一起工作。\n\
  \n这些区块就是我们所说的对象。当我们设计并编写对象时，我们使用一个 `class`（类）。\n\n### 提示\n\n类可以被看作对象的蓝图。\n\n我们实现一个类的过程，这被称为\
  \ `instance`（实例化）。你不能直接在蓝图上生活，但你可以根据它建造一栋真正的房子。当我们设计游戏时，我们经常会编写这样的类。\n\n### 提示\n\
  \nOOP 是一种处理问题的方法，定义了最佳实践。\n\nOOP 的三个核心原则是`封装`、`多态`和`继承`。这听起来可能很复杂，但实际上，一步步来，它是非常直观的。\n\
  \n## 封装\n\n封装意味着保护你的代码内部免受使用它的代码的干扰。你可以通过只允许你选择的变量和函数被访问来实现这一点。这意味着，只要暴露出来的部分保持不变，你的代码就可以随时进行更新、扩展或改进，而不会影响使用它的程序。\n\
  \n作为一个例子，有了适当封装，即使 SFML 团队需要更新 `Sprite` 类的工作方式也没有关系。只要函数签名保持不变，我们在更新之前编写的代码在更新后仍然可以工作。\n\
  \n### 多态\n\n多态允许我们编写不那么依赖于我们要操作的类型的代码。这会让我们的代码更清晰、更高效。多态意味着不同的形式。如果我们编写的对象可以是多种类型，那么我们就可以利用这一点。在这里，多态听起来可能有点像黑魔法。我们将在第\
  \ 12 章“抽象与代码管理——更好地使用 OOP”中使用多态。\n\n那时一切都将变得更加清晰。\n\n### 继承\n\n就像听起来一样，继承意味着我们可以利用其他类的所有功能和优点（包括封装和多态），同时针对我们的情况对其代码进行进一步完善。我们将在第\
  \ 12 章“抽象与代码管理——更好地使用 OOP”中使用继承。\n\n## 为什么这样做？\n\n当编写得当时，所有这些 OOP 允许你添加新功能，而无需过多担心它们与现有功能的交互作用。当你不得不更改一个类时，它的自包含（封装）特性意味着对程序的其他部分影响更小，甚至没有影响。\n\
  \n你可以使用他人的代码（例如 SFML 类），而无需知道甚至关心它们内部是如何工作的。\n\nOOP 以及它的扩展 SFML 允许你编写使用复杂概念的游戏，例如：多个摄像头、多人游戏、OpenGL、定向音频等。这一切都不需要费吹灰之力。\n\
  \n使用继承，你可以创建一个类的多个相似但不同的版本，而无需从头开始编写类。\n\n由于多态，你仍然可以使用为原始对象设计的函数来你的新对象。\n\n这一切其实都是说得通的。而且正如我们所知，C++\
  \ 从一开始就考虑了所有的 OOP 特性。\n\n### 提示\n\n除了成功的决心外，OOP 和制作游戏（或任何其他类型的应用）成功的最终关键在于规划和设计。帮助你写出优秀代码的不仅仅是了解所有的\
  \ C++、SFML 和 OOP 主题，而是将所有这些知识应用于编写结构和设计良好的代码。书中的代码以适合在游戏背景下学习各种 C++ 主题的顺序和方式呈现。构建代码的艺术和科学被称为`设计模式`。随着代码变得越来越长越来越复杂，有效使用设计模式将变得越来越重要。好消息是，我们不需要自己发明这些设计模式。随着项目变得复杂，我们需要学习它们。关于设计模式的更多内容将在最后一章介绍。在这个项目中，我们将学习并使用基础类和封装，而在最终项目中，我们将变得更胆大，使用继承、多态和其他\
  \ OOP 相关的技术。\n\n\n\n请注意，所有变量都在以 `private:` 关键字开头的代码段中。浏览一下之前的示例代码，你会发现类代码体被分为两个部分：\n\
  \n```cpp\nprivate:\n\n#### 这里有更多代码\n\npublic:\n\n// 这里有更多代码\n```\n\n`public` 和 `private`\
  \ 关键字控制着类的封装性。任何标记为 `private` 的内容都不能被类实例或对象的的用户直接访问。如果你正在为他人设计一个类，你不希望他们能够随心所欲地修改任何内容。\n\
  \n这意味着我们的四个成员变量无法被 `main` 函数中的游戏引擎直接访问。它们可以通过类的代码进行间接访问。对于 `m_Length` 和 `m_Height`\
  \ 变量，只要我们不需要更改挡板的大小，这是完全可以接受的。然而，`m_XPosition` 和 `m_YPosition` 成员变量确实需要被访问，否则我们到底该如何移动挡板呢？\n\
  \n这个问题在代码的 `public:` 部分通过以下方式解决：\n\n```cpp\nvoid moveRight(); void moveLeft();\n\
  ```\n\n该类提供了两个 `public` 函数，它们可以配合 `Paddle` 类型的对象使用。当我们看到这些函数的定义后，就能确切看到这些函数是如何操作私有变量的。\n\
  \n总结一下，我们有一组无法访问（私有的）变量，它们无法在 `main` 函数中使用。这是好事，因为封装使得我们的代码更不容易出错且更易维护。然后我们通过提供两个公共函数来对\
  \ `m_XPosition` 和 `m_YPosition` 变量进行间接访问，解决了移动挡板的问题。\n\n`main` 中的代码可以调用这些函数，但函数内部的代码精确控制了变量是如何被更改的。\n\
  \n让我们来看函数定义。\n\n## 类函数定义\n\n我们在书中编写的函数定义将全部放在与类和函数声明分开的文件中。我们将使用与类同名且以 `.cpp` 为扩展名的文件。因此，在我们假设的示例中，接下来的代码将放在名为\
  \ `Paddle.cpp` 的文件中。看看这个包含一个新概念的简单代码：\n\n```cpp\n#include \"stdx.h\"\n#include \"\
  Paddle.h\"\n\nvoid Paddle::moveRight()\n{\n// 将挡板向右移动一个像素\nm_XPosition++;\n}\n\n\
  void Paddle::moveLeft() {\n// 将挡板向左移动一个像素\nm_XPosition--;\n}\n```\n\n首先要说明的是，我们必须使用包含指令来包含来自\
  \ `Paddle.h` 的类和函数声明。我们在这里看到的新概念是使用作用域解析运算符 `::`。由于这些函数属于一个类，我们必须在函数名前名前加上类名和 `::`\
  \ 来编写签名。即 `Paddle::moveLeft()` 和 `Paddle::moveRight`。\n\n实际上，我们之前已经简要见过作用域解析运算符。每当我们声明一个类的对象且之前没有使用过\
  \ `using namespace...` 时，我们可以像这样将函数定义和声明放在同一个文件中：\n\n```cpp\nclass Paddle {\nprivate:\n\
  // 挡板的长度\nint m_Length = 100;\n// 挡板的高度\nint m_Height = 10;\n// x 轴上的位置\nint m_XPosition;\n\
  // x 轴上的位置\nint m_YPosition;\n\npublic:\nvoid Paddle::moveRight() {\n// 将挡板向右移动一个像素\n\
  m_XPosition++;\n}\n\nvoid Paddle::moveLeft() {\n// 将挡板向左移动一个像素\nm_XPosition--;\n\
  }\n};\n```\n\n然而，当我们的类变得很长时（正如我们的 `Arena` 类将会变成那样），将函数定义分离到它们自己的文件中会更有组织。此外，头文件被认为是公共的，如果其他人要使用我们编写的代码，它们通常被用于文档目的。\n\
  \n## 使用类的实例\n\n尽管我们看到了所有与类相关的代码，但我们实际上还没有使用过这个类。我们已经知道如何做到这一点，因为我们已经多次使用过 SFML。首先，我们这样创建一个\
  \ `Paddle` 实例：\n\n```cpp\nPaddle paddle;\n```\n\n`paddle` 对象拥有在 `Paddle.h` 中声明的所有变量。我们只是不能直接访问它们。但是，我们可以使用它的公共函数来移动挡板，如下：\n\
  \n```cpp\npaddle.moveLeft();\n```\n\n或者这样：\n\n```cpp\npaddle.moveRight();\n```\n\
  \n记住 `paddle` 是一个 `Paddle` 类型，因此它拥有所有可用的成员变量和函数。我们可以在以后某个日期决定让游戏支持多人游戏。在 `main`\
  \ 函数中，我们可以更改代码来拥有两个挡板，如下：\n\n```cpp\nPaddle paddle;\nPaddle paddle2;\n```\n\n意识到每一个\
  \ `Paddle` 实例都是独立的对象，拥有自己的一组变量，这是极其重要的。\n\n## 构造函数和 getter 函数\n\n简单的 `Paddle` 示例是介绍类基础的好方法。类可以像\
  \ `Paddle` 一样简单简短，也可以更长、更复杂，并自身包含其他对象。在制作游戏时，假设的 `Paddle` 类中缺少了一个至关重要的东西。对于这些私有成员变量和公共函数来说可能还好，但我们将如何绘制任何东西呢？我们的\
  \ `Paddle` 挡板还需要精灵（sprite）和纹理（texture）。我们可以完全像在 main 中包含它们一样，在类中包含其他对象。\n\n### 提示\n\
  \n这是 `Paddle.h` 代码中 `private:` 部分的更新版本，它包含了一个 `Sprite` 成员和一个 `Texture` 成员。注意，该文件还需要相关的\
  \ SFML 包含指令才能编译代码。\n\n```cpp\nprivate:\n// 挡板的长度\nint m_Length = 100;\n// 挡板的高度\n\
  int m_Height = 10;\n// x 轴上的位置\nint m_XPosition;\n// x 轴上的位置\nint m_YPosition;\n\
  // 当然，我们需要一个精灵\nSprite m_Sprite;\n// 以及一个纹理\nTexture m_Texture;\n```\n\n新问题紧随其。如果\
  \ `m_Sprite` 和 `m_Texture` 是 `private` 的，那么我们到底如何在 `main` 函数中绘制它们呢？我们需要提供一个允许访问\
  \ `m_Sprite` 的函数以便它可以被绘制。仔细查看 `Paddle.h` 公共部分新的函数声明。\n\n```cpp\npublic:\nvoid moveRight();\n\
  void moveLeft();\n// 向 main 发送精灵副本\nSprite getSprite();\n```\n\n之前的代码声明了一个名为 `getSprite`\
  \ 的函数。需要注意的是 `getSprite` 返回的是一个 `Sprite` 对象。我们很快就会看到 `getSprite` 的定义。如果你思维敏锐，还会注意到在任何时候我们都没有加载过纹理，也没有调用过\
  \ `m_Sprite.setTexture(m_Texture)` 来将纹理与精灵关联。\n\n当类被编码时，编译器会创建一个特殊的函数。我们会在代码中没有看到这个函数，但它确实在那里。它被称为构造函数。当我们需要编写一些代码来准备对象以供使用时，构造函数通常是这样做的好地方。当我们希望构造函数执行除实例化之外的其他操作时，我们必须替换编译器提供的默认（不可见的）构造函数。\n\
  \n首先，我们提供一个构造函数声明。注意构造函数没有返回类型，甚至没有 `void`。同样注意，我们可以立即看出它是构造函数，因为函数名与类名 `Paddle`\
  \ 相同。\n\n```cpp\npublic:\n// 构造函数 Paddle();\nvoid moveRight(); void moveLeft();\n\
  // 向 main 发送精灵副本 Sprite getSprite();\n```\n\n接下来的代码显示 `Paddle.cpp` 中的新函数定义（`getSprite`\
  \ 和构造函数 `Paddle`）：\n\n```cpp\n// 构造函数 Paddle::Paddle() {\n// 代码假设 paddle.png 是一个真实的图像\
  \ m_Texture.loadFromFile(\"graphics/paddle.png\");\n// 将纹理与精灵关联 m_Sprite.setTexture(m_Texture);\
  \ }\n\n// 向 main 返回精灵副本 Sprite Paddle::getSprite()\n{ \n\nreturn m_Sprite; }\n```\n\
  \n\n\n在之前的代码中，我们使用构造函数 `Paddle` 来加载纹理并将其与精灵关联。请记住，该函数是在声明类型为 `Paddle` 的对象时被调用的。具体来说，当执行代码\
  \ `Paddle paddle` 时，构造函数就会被调用。\n\n在 `getSprite` 函数中，只有一行代码用于向调用代码返回 `m_Sprite` 的副本。\n\
  \n我们还可以在构造函数中为对象进行其他的设置工作，并在构建第一个真正的类时也会这样做。\n\n如果你想确切地看到 `getSprite` 函数是如何被使用的，那么\
  \ `main` 函数中的代码看起来像这样：\n\n```cpp\nwindow.draw(paddle.getSprite());\n```\n\n上一行代码假设我们有一个名为\
  \ `window` 的 SFML `RenderWindow` 对象。由于 `getSprite` 返回的是一个类型为 `Sprite` 的对象，上一行代码的作用与该精灵在\
  \ `main` 中声明完全相同。现在，我们有了一个封装良好的类，它可以通过它的公共函数提供受控制的访问。\n\n## 在代码中来跳转\n\n我发现，当我阅读那些在代码文件中来回跳跃的书籍时，往往很难准确跟上正在发生什么。以下是假设的\
  \ `Paddle.h` 和 `Paddle.cpp` 的完整列表，以便了解所有上下文。在继续之前，请务必学习它们：\n\n### Paddle.h\n\n```cpp\n\
  #pragma once\n\n#include <SFML/Graphics.hpp>\n\nusing namespace sf;\n\nclass Paddle\n\
  {\nprivate:\n    // 乒乓球拍的长度 int m_Length = 100;\n    // 乒乓球拍的高度 int m_Height = 10;\n\
  \    // x 轴上的位置 int m_XPosition; \n    // y 轴上的位置 int m_YPosition;\n    // 当然我们需要一个精灵\
  \ Sprite m_Sprite;\n    // 还需要一个纹理 Texture m_Texture;\n\npublic:\n    // 构造函数 Paddle();\n\
  \    void moveRight(); void moveLeft();\n    // 向 main 发送精灵的副本 Sprite getSprite();\
  \ \n};\n```\n\n### Paddle.cpp\n\n```cpp\n#include \"stdafx.h\" \n#include \"Paddle.h\"\
  \n\n// 构造函数 Paddle::Paddle() {\n// 代码假设 paddle.png 是一个真实的图像 m_Texture.loadFromFile(\"\
  graphics/paddle.png\");\n// 将纹理与精灵关联 m_Sprite.setTexture(m_Texture); }\n\n// 向 main\
  \ 返回精灵的副本 Sprite Paddle::getSprite()\n{\n    return m_Sprite; \n}\n\nvoid Paddle::moveRight()\
  \ {\n    // 将球拍向右移动一个像素 m_XPosition ++;\n}\n\nvoid Paddle::moveLeft() {\n    //\
  \ 将球拍向左移动一个像素 m_XPosition--;\n} \n\n在本书的剩余部分中，我们将不断地回到类和面向对象编程（OOP）。不过，现在我们有了足够的信息来开始为僵尸竞技场（Zombie\
  \ Arena）游戏构建第一个真正的类了。\n\n## 构建玩家——第一个类\n\n让我们思考一下 `Player` 类需要做什么。该类需要知道自己移动有多快、当前位于游戏世界的哪个位置，以及它有多少健康值。由于\
  \ `Player` 类在玩家眼中被表述为一个 2D 图形字符，因此该类既需要一个 `Sprite` 也需要一个 `Texture` 对象。\n\n此外，尽管目前可能并不显而易见，但我们的\
  \ `Player` 类也将受益于了解游戏运行整体环境的一些细节。这些细节包括屏幕分辨率、组成竞技场的磁格大小以及当前竞技场的总尺寸。\n\n由于 `Player`\
  \ 类将全权负责每帧更新自己，因此它需要知道玩家在任何时刻的意图。例如，玩家当前正按住某个键盘方向键吗？或者玩家当前正按住多个键盘方向键？用于确定 `W`、`A`、`S`\
  \ 和 `D` 键状态的布尔变量将是必重要的。\n\n显然，我们在新类中需要相当大量的变量。在学习了关于 OOP 的所有知识后，我们会将所有这些变量设为私有（private）。这意味着我们必须在适当的情况下从\
  \ `main` 函数提供访问。\n\n我们将使用大量的获取访问器函数（getter functions）以及其他一些函数来设置我们的对象。这些函数非常多；该类中实际上有\
  \ 21 个函数。起初这可能看起来有些困难，但我们将遍历所有的函数，并发现大多数函数只是在设置或获取其中一个私有变量。\n\n只有少数相当深入的函数，例如 `update`（它每帧都会从\
  \ `main` 函数调用一次）和 `spawn`（它将处理某些私有变量的初始化）。然而，正如我们将看到的，它们并没有什么复杂的，而且它们都将得到详细描述。\n\
  \n继续下去的最佳方法是编写头文件。这将让我们有机会看到所有的私有变量并检查所有的函数签名。密切关注返回值和参数类型，这将使得理解函数定义中的代码变得容易。\n\
  \n## 编写 Player 类头文件\n\n在**Solution Explorer**（解决方案管理器）中的**Header Files**（头文件）上**右键点击**，并选择\
  \ **Add** | **New Item...**。在**Add New Item**窗口中，选中（通过左键点击）**Header File ([.h])**，然后在\
  \ `Name` 字段中输入 `Player.h`。最后，点击**Add**按钮。我们现在准备好为我们的第一个类编写头文件了。\n\n通过添加声明（包括起始和结束的大括号，后跟一个分号）开始编写\
  \ `Player` 类：\n\n```cpp\n#pragma once\n\n#include <SFML/Graphics.hpp>\n\nusing namespace\
  \ sf;\n\nclass Player {\n\n};\n```\n\n现在，让我们添加所有的成员变量。根据我们已经讨论的内容，看看你是否能看出它们每一个的作用。我们将逐一介绍它们：\n\
  \n```cpp\nclass Player\n{\nprivate:\n    const float START_SPEED = 200;\n    const\
  \ float START_HEALTH = 100;\n    // Vector2f m_Position 在哪里;\n    // 当然我们需要一个精灵\
  \ Sprite m_Sprite;\n    // 以及一个纹理 !!请关注此处!! Texture m_Texture;\n    // 屏幕分辨率是多少\
  \ Vector2f m_Resolution;\n    // 当前竞技场的大小是多少 IntRect m_Arena;\n    // 竞技场的每个磁格有多大\
  \ int m_TileSize;\n    // 玩家当前向哪个方向移动 bool m_UpPressed;\n    bool m_DownPressed;\n\
  \    bool m_LeftPressed;\n    bool m_RightPressed;\n    // 玩家有多少健康值？int m_Health;\n\
  \    // 玩家的最大健康值是多少 int m_MaxHealth;\n    // 玩家上次被击是什么时候 Time m_LastHit;\n    //\
  \ 每秒像素速度 float m_Speed;\n\n    // 接下来是所有的公共函数 };\n\n\n之前的代码声明了我们所有的成员变量。有些是普通变量，另一些本身就是对象。注意它们都在类的\
  \ `private:` 部分，因此在类外部无法直接访问。\n\n此外注意，我们使用命名约定，在所有非常量变量名前加上 `m_` 前缀。`m_` 前缀会在我们编写函数定义时提醒我们它们是成员变量，并且与我们在某些函数中创建的局部变量区分来，同时也与函数参数区分来。\n\
  \n所有变量的用途都是显而易见的，例如 `m_Position`、`m_Texture` 和 `m_Sprite`，它们用于玩家当前的位置、纹理和精灵。此外，每个变量（或变量组）都经过了注释，以使其用途一目了然。\n\
  \n然而，究竟为什么需要它们以及它们被使用的上下文可能并不显而易见。例如，`m_LastHit` 是一个 `Time` 对象，用于记录玩家上次受到僵尸击中的时间。我们对\
  \ `m_LastHit` 的用途是显而易见的，但同时，并不清楚我们可能需要这些信息。\n\n当我们组合出游戏的其余部分时，每个变量的上下文将变得更加清晰。现在的重要的是熟悉这些名称和类型，以便顺利跟随项目的剩余部分。\n\
  \n\n\n你不需要记忆变量名和类型，因为我们会在使用它们时讨论所有的代码。你确实需要花时间查看它们，并对它们稍加熟悉。此外，随着我们的进行，如果任何地方看起来不清楚，回头查看这个头文件可能是值得的。\n\
  \n现在我们可以添加一整长一个函数列表。添加以下所有高亮代码，并尝试推断它们的所有作用。密切关注每个函数的返回值、参数和名称。这是理解我们将在项目剩余部分中编写的代码的关键。它们告诉了我们关于每个函数的什么信息？添加以下高亮代码，然后我们将进行检查：\n\
  \n// 接下来是我们所有的公共函数\n\npublic:\n\nPlayer();\n\nvoid spawn(IntRect arena, Vector2f\
  \ resolution, int tileSize);\n\n// 在每局游戏结束时调用此函数\n\nvoid resetPlayerStats();\n\n\
  // 处理玩家被僵尸击中\n\nbool hit(Time timeHit);\n\n// 玩家上次被击中是多久以前\n\nTime getLastHitTime();\n\
  \n// 玩家在哪里\n\nFloatRect getPosition();\n\n// 玩家中心在哪里 Vector2f getCenter();\n\n//\
  \ 玩家面向哪个角度 float getRotation();\n\n// 向主 Sprite 发送 sprite 的副本 getSprite();\n\n//\
  \ 接下来的四个函数移动玩家 void moveLeft();\n\nvoid moveRight();\n\nvoid moveUp();\n\nvoid moveDown();\n\
  \n// 停止玩家在特定方向移动 void stopLeft();\n\nvoid stopRight();\n\nvoid stopUp();\n\nvoid\
  \ stopDown();\n\n// 我们每帧调用一次此函数 void update(float elapsedTime, Vector2i mousePosition);\n\
  \n// 给玩家提供速度加速 void upgradeSpeed();\n\n// 给玩家一些血量 void upgradeHealth();\n\n// 增加玩家可以拥有的最大血量\
  \ increaseHealthLevel(int amount);\n\n// 玩家当前有多少血量？ int getHealth();\n\n};\n\n首先注意，所有函数都是公共的（public）。这意味着我们可以通过类的实例从\
  \ `main` 函数中调用所有这些函数，代码如下：\n\n`player.getSprite();`.\n\n假设 `player` 是 `Player` 类的一个完全设置妥的实例，之前的代码将返回\
  \ `m_Sprite` 的副本。将此代码放入实际上下文中，我们可以在 `main` 函数中编写如下代码：\n\n`window.draw(player.getSprite());`\n\
  \n之前的代码将在正确的位置绘制玩家图形，就像该 sprite 直接在 `main` 函数中声明一样。这就像我们之前对假设的 `Paddle` 类所做的一样。\n\
  \n在进入相应的 .cpp 文件中实现（编写定义）这些函数之前，让我们逐一仔细观察每一个：\n\n`void spawn(IntRect arena, Vector2f\
  \ resolution, int tileSize)`：此函数的作用正如其名。它将准备好对象供使用，包括将其放在起始位置（生成）。注意它不返回任何数据，但它有三个参数。它接收一个名为\
  \ `arena` 的 `IntRect`（将是当前关卡的大小和位置），一个包含屏幕分辨率的 `Vector2f` 以及一个持有背景瓦片大小的 `int`。\n\
  \n`void resetPlayerStats`：一旦我们赋予玩家在波次之间升级的能力，我们可能需要当他们死亡时能够移除并重置那些能力。\n\n`Time getLastHitTime()`：此函数只做一件事，返回玩家上次被僵尸击中的时间。我们在检测碰撞时使用此函数，它将使能够确保确保不会因为与僵尸接触而频繁受罚。\n\
  \n`FloatRect getPosition()` ：此函数返回一个 `FloatRect`，描述包含玩家图形的矩形的水平和垂直浮点坐标。这对于碰撞检测再次有用。\n\
  \n`Vector2f getCenter()` ：这与 `getPosition()` 稍不同，因为它是一个 `Vector2f`，且仅包含玩家图形正中心的\
  \ X 和 Y 位置。\n\n`float getRotation()`：`main` 中的代码有时需要知道玩家当前面向哪个方向（角度）。三点钟方向为零度并顺时针增加。\n\
  \n`Sprite getSprite()`：如前所述，此函数返回代表玩家的 sprite 的副本。\n\n`void moveLeft()`, `...Right()`,\
  \ `...Up()`, `...Down()`：这四个函数没有返回值或参数。它们将从 `main` 函数调用，然后 `Player` 类就可以在一个或多个 `W`、`A`、`S`\
  \ 和 `D` 键按下时采取行动。\n\n`void stopLeft()`, `...Right()`, `...Up()`, `...Down()`：这四个函数没有返回值或参数。它们将从\
  \ `main` 函数调用，然后 `Player` 类就可以在一个或多个 `W`、`A`、`S` 和 `D` 键释放时采取行动。\n\n`void update(float\
  \ elapsedTime, Vector2i mousePosition)` ：这将是整个类中唯一较长的函数。它每帧从 `main` 调用一次。它将执行所有必要的操作以确保玩家对象的数据更新，以便碰撞检测和绘制。注意它不返回数据，但接收自上一帧的流逝时间，以及一个\
  \ `Vector2i`（这将持有鼠标指针或准星的水平和垂直屏幕位置）。\n\n### 提示\n\n注意这些是整数屏幕坐标，区别于浮点世界坐标。\n\n`void\
  \ upgradeSpeed()`：一个可以在玩家选择让玩家更快时，从升级界面调用的函数。\n\n`void upgradeHealth()`：另一个可以在玩家选择让玩家更强（更多血量）时，从升级界面调用的函数。\n\
  \n`void increaseHealthLevel(int amount)`：与之前的函数有一个细微但重要的区别，后者将增加玩家拥有的血量，直到达到当前设置的最大值。此函数将在玩家捡起血包时使用。\n\
  \n`int getHealth()`：由于血量水平是动态的，我们需要能够在任何给定时刻确定玩家有多少血量。此函数返回一个持有该值的 `int`。与变量一样，现在每个函数的用途应该是显而易见的。同样，与变量一样，使用其中一些函数的原因和精确语境将随着我们项目的进行而显现出来。\n\
  \n### 提示\n\n你不需要记忆函数名、返回类型或参数，因为我们会在使用它们时讨论所有的代码。你确实需要花时间查看它们，以及之前的解释，并对它们稍加熟悉。此外，随着我们的进行，如果任何地方看起来不清楚，回头查看这个头文件可能是值得的。\n\
  \n现在我们可以进入函数的核心部分——定义。\n\n## 编写 Player 类的函数定义\n\n我们终于可以开始编写执行类工作的代码了。\n\n在 **Solution\
  \ Explorer** 中对 **Source Files** **右键点击**，并选择 **Add | New Item...**。在 **Add New\
  \ Item** 窗口中，高亮（通过**左点击**）**C++ File** (.cpp)，然后在 **Name** 字段中输入 Player.cpp。最后，点击\
  \ **Add** 按钮。我们现在准备好为我们的第一个类编写 .cpp 文件了。\n\n以下是必要的包含指令，随后是构造函数的定义。记住，构造函数会在我们第一次实例化类型为\
  \ `Player`的对象时被调用。将此代码添加到 Player.cpp 文件中，然后我们可以仔细观察它：\n\n```cpp\n#include \"stdafx.h\"\
