  \ directory for solution`（为解决方案创建目录）选项。现在点击 `OK`。\n4. 现在我们需要将 SFML `.dll` 文件复制到主项目目录。我的主项目目录是\
  \ `D:\\Visual Studio Stuff\\Projects\\TWL\\TWL`。这是由上一步创建的文件夹。如果你将 Projects 文件夹放在其他地方，请执行此操作。我们需要复制到项目文件夹的文件位于你的\
  \ `SFML\\bin` 文件夹。打开这两个位置的窗口并高亮所需的 `.dll` 文件。\n5. 现在将高亮的文件复制并粘贴到项目文件夹中。\n\n项目现在准备就绪。\n\
  \n\n\n\n\n除了我们预期的图形、声音和字体外，此游戏还有两种新的资源类型。它们是关卡设计文件和 GLSL 着色器程序。让我们分别了解它们。\n\n##\
  \ 游戏关卡设计\n\n关卡都在文本文件中创建。通过使用数字 0 到 3，我们可以构建挑战玩家的关卡设计。所有的关卡设计都在与其他资源相同目录下的 `levels`\
  \ 文件夹中。现在可以随意查看，但我们将在第 14 章*构建可用关卡与碰撞检测*中详细介绍。\n\n除了这些关卡设计资源，我们还有一种特殊的图形资源，称为着色器（shaders）。\n\
  \n## GLSL 着色器\n\n着色器是用 `GLSL`（图形库着色语言）编写的程序。不用担心需要学习另一种语言，因为我们不需要太深入就能利用着色器。着色器是特殊的，因为它们是完整的程序，独立于我们的\
  \ C++ 代码，由 GPU 每一帧执行。事实上，其中一些着色器程序每一帧的每个像素点都会运行！我们将在第 16 章*扩展 SFML 类、粒子系统和着色器*中了解更多细节。如果你等不及了，可以查看下载包中\
  \ `Chapter12/shaders` 文件夹下的文件。\n\n## 图形资源详析\n\n图形资源构成了游戏场景的部分。看看这些图形资源，你应该很清楚它们将在游戏的什么位置被使用：\n\
  \n![](img/image00288.jpeg)\n\n如果 `tiles_sheet` 图形上的瓦片看起来与游戏截图略有不同，这是因为它们是部分透明的，透出来的背景略微改变了它们。如果背景图形与游戏截图中的实际背景完全不同，那是因为我们将编写的着色器程序将操纵每一帧的每一个像素，以创建一种“熔融”效果。\n\
  \n## 音频资源详析\n\n声音文件均为 `.wav` 格式。这些文件包含了我们在游戏某些事件中播放的音效。如下：\n\n`fallinfire.wav`:当玩家头部进入火中且没有逃生机会时播放的声音。\n\
  \n`fallinwater.wav`:水的最终效果与火相同：死亡。这个音效通知玩家需要从关卡开始重新开始。\n\n`fire1.wav`:此音效以单声道录制。它将根据玩家与火瓦片的距离，以不同的音量播放，并根据玩家位于火瓦片的左侧还是右侧从不同的扬声器播放。显然，我们需要学习更多技巧来实现此功能。\n\
  \n`jump.wav`:玩家跳跃时悦耳的（略微可预判的）欢叫声。\n\n`reachgoal.wav`:当玩家（或多个玩家）将两个角色（Thomas 和 Bob）都带到目标瓦片时悦耳的胜利声。\n\
  \n音效非常直观，你可以轻松地创建自己的。如果你打算替换 `fire1.wav` 文件，请确保将你的声音以单声道（而非立体声）格式保存。原因将在第 15 章*声音空间化与\
