  {\n\n// 处理 WASD 键的按下和释放 if (Keyboard::isKeyPressed(Keyboard::W))\n\n{\n\nplayer.moveUp();\
  \ }\n\nelse {\n\nplayer.stopUp();\n\n}\n\nif (Keyboard::isKeyPressed(Keyboard::S))\
  \ {\n\nplayer.moveDown(); }\n\nelse\n\n{\n\nplayer.stopDown();\n\n}\n\nif (Keyboard::isKeyPressed(Keyboard::A))\
  \ {\n\nplayer.moveLeft(); }\n\nelse\n\n{\n\nplayer.stopLeft();\n\n}\n\nif (Keyboard::isKeyPressed(Keyboard::D))\
  \ {\n\nplayer.moveRight(); }\n\nelse\n\n{ \n\nplayer.stopRight(); }\n\n}// 游戏期间处理\
  \ WASD\n\n}// 结束游戏循环\n```\n\n在上一段代码中，我们首先测试玩家是否按了 `Esc` 键。如果按下，游戏窗口将关闭。\n\n接下来，在一个大的\
  \ `if(state == State::PLAYING)` 块内，我们按轮检查 `W`、`A`、`S` 和 `D` 键。如果某个键被按下，我们就调用相应的\
  \ `player.move...` 函数。如果没有按下，我们就调用相关的 `player.stop...` 函数。\n\n这段代码确保了在每一帧中，玩家对象都会根据具体哪些\
  \ `W`、`A`、`S`、`D` 键被按下以及未被按下进行更新。`player.move...` 和 `player.stop...` 函数将信息存储在成员布尔变量（`m_LeftPressed`、`m_RightPressed`、`m_UpPressed`\
