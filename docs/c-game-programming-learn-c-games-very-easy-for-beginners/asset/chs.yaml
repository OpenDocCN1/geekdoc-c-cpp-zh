  \  // 创建一个粒子系统\n  ParticleSystem m_PS;\n\n  // Thomas 和他的朋友 Bob\n  Thomas m_Thomas;\n\
  \  Bob m_Bob; \n```\n\n接下来，初始化系统。\n\n### 初始化 ParticleSystem\n打开 `Engine.cpp` 文件，并在\
