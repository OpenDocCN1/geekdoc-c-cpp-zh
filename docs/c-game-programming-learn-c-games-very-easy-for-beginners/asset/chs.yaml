  \n// 增加射击频率\nfireRate++;\n\nstate = State::PLAYING;\n}\n\nif (event.key.code ==\
  \ Keyboard::Num2) {\n\n// 增加弹匣大小\nclipSize += clipSize; \nstate = State::PLAYING;\n\
  }\n\nif (event.key.code == Keyboard::Num3) {\n\n// 增加生命值\nplayer.upgradeHealth();\
  \ \nstate = State::PLAYING;\n}\n\nif (event.key.code == Keyboard::Num4) {\n\n//\
