  \    // 绘制 thomas\n    m_Window.draw(m_Thomas.getSprite());\n    // 绘制 bob\n   \
  \ m_Window.draw(m_Bob.getSprite());\n  }\n\n  // 绘制 HUD\n  // 切换到 m_HudView\n  m_Window.setView(m_HudView);\n\
  \  // 显示我们刚刚绘制的所有内容\n  m_Window.display();\n}\n```\n\n注意我们需要为所有的屏幕选项（全屏、左侧和右侧）绘制\
  \ `VertexArray`。\n\n现在你可以运行游戏了。遗憾的是，Thomas 和 Bob 直接掉过了我们精心设计的平台。由于这个原因，我们无法尝试通过关卡并挑战时间。\n\
  \n## 碰撞检测\n\n我们将使用矩形相交和 `sf::intersects` 函数来处理碰撞检测。在这个项目中不同之处在于，我们将碰撞检测代码抽象到自己的函数中，正如我们所见的，Thomas\
  \ 和 Bob 有多个矩形（`m_Head`、`m_Feet`、`m_Left`、`m_Right`）需要我们检查碰撞。\n\n## 编写 `detectCollisions`\
  \ 函数\n\n为了清楚起见，此函数是 `Engine` 类的一部分。打开 `Engine.h` 文件并添加名为 `detectCollisions` 的函数声明。在下面的代码段中高亮显示：\n\
  \n```cpp\n// 仅供内部使用的私有函数\nvoid input();\nvoid update(float dtAsSeconds);\nvoid draw();\n\
  \n// 加载新关卡\nvoid loadLevel();\n\n// Run 将调用所有私有函数\nbool detectCollisions(PlayableCharacter&\
  \ character);\n\npublic:\n  // Engine 构造函数\n  Engine();\n```\n\n从签名可以看出 `detectCollision`\
  \ 函数接受一个多态参数 `PlayerCharacter` 对象。正如我们所，`PlayerCharacter` 是抽象的，永远无法实例化。然而，我们通过 `Thomas`\
  \ 和 `Bob` 类继承了它。我们能够将 `m_Thomas` 或 `m_Bob` 传递给 `detectCollisions`。\n\n在 `Solution\
  \ Explorer` 中右键点击 `Source Files` 并选择 `Add` | `New Item...`。在 `Add New Item` 窗口中，高亮（左键点击）`C++\
  \ File (.cpp)`，然后在 `Name` 字段中输入 `DetectCollisions.cpp`。最后，点击 `Add` 按钮。我们现在准备好编写\
  \ `detectCollisions` 函数了。\n\n将以下代码添加到 `DetectCollisions.cpp`。注意这只是该函数的第一部分：\n\n\
  ```cpp\n#include \"stdafx.h\"\n#include \"Engine.h\"\n\nbool Engine::detectCollisions(PlayableCharacter&\
  \ character) {\n  bool reachedGoal = false;\n\n  // 为他的所有部分创建一个矩形\n  FloatRect detectionZone\
  \ = character.getPosition();\n\n  // 创建一个 FloatRect 来测试每个块\n  FloatRect block;\n\
  \  block.width = TILE_SIZE;\n  block.height = TILE_SIZE;\n\n  // 在 thomas 周建立一个区域以检测碰撞\n\
  \  int startX = (int)(detectionZone.left / TILE_SIZE) - 1;\n  int startY = (int)(detectionZone.top\
  \ / TILE_SIZE) - 1;\n  int endX = (int)(detectionZone.left / TILE_SIZE) + 2;\n\n\
  \  // Thomas 相当高，所以在垂直方向上检查几块砖\n  int endY = (int)(detectionZone.top / TILE_SIZE)\
  \ + 3;\n\n  // 确保我们不测试低于零的位置\n  // 或者高于数组末尾的位置\n  if (startX < 0) startX = 0;\n\
  \  if (startY < 0) startY = 0;\n  if (endX >= m_LM.getLevelSize().x) endX = m_LM.getLevelSize().x;\n\
  \  if (endY >= m_LM.getLevelSize().y) endY = m_LM.getLevelSize().y;\n}\n```\n\n\n\
  \n\n接下来，我们将看到如何使用 `detectionZone`。我们初始化四个 `int` 变量：`startX`、`startY`、`endX` 和 `endY`，通过将\
  \ `detectionZone` 周围的区域扩大几个区块来实现。在随后的四个 `if` 语句中，我们确保不会对不存在的瓦格尝试碰撞检测。我们通过确保检查的位置永远不会小于零或大于\
  \ `getLevelSize().x` 或 `.y` 返回的值，来实现这一点。\n\n之前所有的代码的作用是创建一个用于进行碰撞检测的区域。对于距离角色几百或几千像素的方块进行碰撞检测是没有意义的。此外，如果我们尝试在数组位置不存在的地方（小于零或大于\
  \ `getLevelSize()...`）进行碰撞检测，游戏将会崩溃。\n\n接下来，添加以下代码来处理玩家掉出地图的情况：\n\n```cpp\n// 角色是否掉出了地图？\n\
  \nFloatRect level(0, 0, m_LM.getLevelSize().x * TILE_SIZE, m_LM.getLevelSize().y\
  \ * TILE_SIZE);\n\nif (!character.getPosition().intersects(level)) {\n    // respawn\
  \ the character\n    character.spawn(m_LM.getStartPosition(), GRAVITY);\n}\n```\n\
  \n角色若要停止掉落，它必须与平台碰撞。因此，如果玩家移动到地图之外（没有平台的地方），它将持续掉落。之前的代码检查角色是否*不*与 `FloatRect`（即\
  \ `level`）相交。如果不相交，说明它已经掉出了地图，`spawn` 函数会将它送回起始位置。\n\n添加以下这段相当庞大的代码，然后我们将详细介绍它的功能：\n\
  \n```cpp\n// 遍历所有的本地方块\nfor (int x = startX; x < endX; x++)\n{\n    for (int y =\
  \ startY; y < endY; y++) {\n        block.left = x * TILE_SIZE; block.top = y *\
  \ TILE_SIZE;\n\n        // 初始化当前方块的起始位置\n        // 角色是否被烧伤或溺水了？ // 使用头部，因为这允许他下沉一点\n\
  \        if (m_ArrayLevel[y][x] == 2 || m_ArrayLevel[y][x] == 3)\n        {\n  \
  \          if (character.getHead().intersects(block)) {\n                character.spawn(m_LM.getStartPosition(),\
  \ GRAVITY);\n                // 应该播放什么声音？\n                if (m_ArrayLevel[y][x]\
  \ == 2) // 火，哎哟！\n                    // 播放声音\n                }\n             \
  \   else // 水 {\n                    // 播放声音\n                }\n            }\n\
  \        }\n\n        // 角色是否与普通方块碰撞\n        if (m_ArrayLevel[y][x] == 1)\n   \
  \     {\n            if (character.getRight().intersects(block)) {\n           \
  \     character.stopRight(block.left);\n            }\n            else if (character.getLeft().intersects(block))\
  \ {\n                character.stopLeft(block.left);\n            }\n          \
  \  if (character.getFeet().intersects(block)) {\n                character.stopFalling(block.top);\n\
  \            } else if (character.getHead().intersects(block)) {\n             \
  \   character.stopJump();\n            }\n        }\n\n        // 在我们学习了粒子效果后，这里会有更多的碰撞检测\n\
  \        // 角色是否到达了目标？\n        if (m_ArrayLevel[y][x] == 4)\n        {\n      \
  \      // 角色已到达目标\n            reachedGoal = true;\n        }\n    }\n}\n```\n\n\
  之前的代码使用了相同的技术完成了三件事。它遍历了 `startX`、`endX` 以及 `startY`、`endY` 之间所有的值。对于每次循环，它检查并执行了以下操作：\n\
  \n1. **角色是否烧伤或溺水了？** 代码 `if (m_ArrayLevel[y][x] == 2 || m_ArrayLevel[y][x] == 3)`\
  \ 决定正在检查的位置是否为火源或水瓦格。如果角色的头部与其中一个瓦格相交，玩家将重新生成。我们还编写了一个空的 `if…else` 块，为后续章节添加声音做准备。\n\
  \n2. **角色是否触碰了普通瓦格？** 代码 `if (m_ArrayLevel[y][x] == 1)` 决定正在检查的位置是否包含普通瓦格。如果它与代表角色不同身体部分的任何矩形相交，就会调用相应的函数（`stopRight`、`stopLeft`、`stopFalling`\
  \ 和 `stopJump`）。\n\n传递给这些函数的每个值以及函数如何使用该值来重新定位角色是非常微妙的。虽然没有必要仔细检查这些值就能理解代码，但你可能想查看一下传入的值，然后回阅上一章节中\
  \ `PlayableCharacter` 类的相应函数。这将帮助你确切地理解正在发生什么。\n\n3. **角色是否触碰了目标瓦格？** 这通过代码 `if\
  \ (m_ArrayLevel[y][x] == 4)` 确定。我们所做的是将 `reachedGoal` 设置为 `true`。`Engine` 类的 `update`\
  \ 函数将跟踪两个角色（`Thomas` 和 `Bob`）是否同时到达了目标。我们稍后就会在 `update` 中编写这段代码。\n\n在 `detectCollisions`\
  \ 函数中添加最后一行代码：\n\n```cpp\n// 完成，返回是否可能需要新关卡\nreturn reachedGoal;\n```\n\n上一行代码返回\
  \ `reachedGoal`，以便调用它的代码在两个角色同时到达目标时能够进行跟踪并做出响应。\n\n我们现在需要做的是每帧为每个角色调用一次 `detectCollision`\
  \ 函数。在 `Update.cpp` 文件的 `if(m_Playing)` 代码块中添加以下高亮代码：\n\n```cpp\nif (m_Playing)\
  \ {\n    // 更新 Thomas\n    m_Thomas.update(dtAsSeconds);\n\n    // 更新 Bob\n    m_Bob.update(dtAsSeconds);\n\
  \n    // 检测碰撞并查看角色\n    // 是否到达了目标瓦格\n    // if 条件的后部分仅在 thomas 触摸家园瓦格时执行\n    if\
  \ (detectCollisions(m_Thomas) && detectCollisions(m_Bob)) {\n        // 需要新关卡\n\
  \        m_NewLevelRequired = true; // 播放到达目标的声音\n    }\n    else {\n        //\
  \ 运行 bob 的碰撞检测\n        detectCollisions(m_Bob);\n    }\n\n    // 计时玩家剩余的时间\n  \
  \  m_TimeRemaining -= dtAsSeconds;\n\n    // Thomas 和 Bob 是否超时了？\n    if (m_TimeRemaining\
  \ <= 0) {\n        m_NewLevelRequired = true;\n    }\n} // if playing 结束\n```\n\n\
  之前的代码调用了 `detectCollision` 函数并检查 `Bob` 和 `Thomas` 是否同时到达了目标。如果是，则通过将 `m_NewLevelRequired`\
  \ 设置为 `true` 来准备下一个关卡。\n\n你可以运行游戏并在平台上行走。你可以到达目标并开始新关卡。此外，第一次跳跃键（W 或向上箭头）将可以使用。如果你到达目标，将加载下一个关卡。如果你到达了最后一个关卡的目标，将加载第一关卡，且时间限制减少\
  \ 10%。当然，目前没有关于时间或当前关卡的视觉反馈，因为我们还没有构建 HUD。我们将在下一章节中构建它。\n\n然而，许多关卡需要 Thomas 和 Bob\
  \ 团队合作。具体来说，Thomas 和 Bob 需要能够爬到对方的头上。\n\n## **更多碰撞检测**\n\n在你在 `Update.cpp` 文件中添加的上一个代码之后，在\
  \ `if (m_Playing)` 部分添加此代码：\n\n```cpp\nif (m_Playing) {\n    // 更新 Thomas\n    m_Thomas.update(dtAsSeconds);\n\
  \n    // 更新 Bob\n    m_Bob.update(dtAsSeconds);\n\n    // 检测碰撞并查看角色\n    // 是否到达了目标瓦格\n\
  \    // if 条件的后部分仅在 thomas 触摸家园瓦格时执行\n    if (detectCollisions(m_Thomas) && detectCollisions(m_Bob))\
  \ {\n        // 需要新关卡\n        m_NewLevelRequired = true; // 播放到达目标的声音\n    }\n\
  \    else {\n        // 运行 bob 的碰撞检测\n        detectCollisions(m_Bob);\n    }\n\n\
  \    // 让 bob 和 thomas 在对方的头上跳跃\n    if (m_Bob.getFeet().intersects(m_Thomas.getHead()))\
  \ {\n        m_Bob.stopFalling(m_Thomas.getHead().top);\n    }\n    else if (m_Thomas.getFeet().intersects(m_Bob.getHead()))\
  \ {\n        m_Thomas.stopFalling(m_Bob.getHead().top);\n    }\n\n    // 计时玩家剩余的时间\n\
  \    m_TimeRemaining -= dtAsSeconds;\n}\n```\n\n\n\n我们将按照以下顺序完成任务：\n\n- 什么是空间化？\n\
  - SFML 如何处理空间化\n- 构建 SoundManager 类\n- 部署发射器（Emitters）\n- 使用 SoundManager 类\n- 构建\
  \ HUD 类\n- 使用 HUD 类\n\n# 什么是空间化？\n\n空间化（Spatialization）是指使物体相对于其所在或所处的空间的行为。在日常生活中，自然世界中的一切在默认情况下都是空间化的。如果一辆摩托车从左向右疾驰而，我们会听到声音从一侧由微弱变得响亮，随着它的经过，声音在另一只耳朵中变得更加明显，然后再次消失在远方。如果我们某天早上醒来，发现世界不再具有空间化特征，那将非常奇怪。\n\
  \n如果我们能让视频游戏更接近现实世界，玩家就能获得更好的沉浸感。如果玩家能从远处隐约听到它们的声音，并且随着它们靠近，那种非人类的哀嚎从某个方向越来越大，那么我们的丧尸游戏将会有趣得多。\n\
  \n空间化的数学原理可能非常复杂，这是显而易见的。我们如何根据声音来源的方向以及玩家（声音听者）到发声物体（发射器）的距离，来计算特定扬声器中声音有多大呢？\n\
  \n幸运的是，SFML 为我们处理了所有复杂的工作。我们只需要熟悉几个技术术语，就可以开始使用 SFML 对我们的音效进行空间化处理。\n\n## 发射器、衰减和听者\n\
  \n为了让 SFML 执行其工作所需的信息，我们需要注意一些信息。我们需要知道声音在游戏世界中的来源。这个声音来源被称为 `emitter`（发射器）。在游戏中，发射器可以是一个丧尸、一辆车，或者在我们目前的项目中，是一个火源瓷格。我们已经在跟踪游戏中对象的位置了，因此为\
  \ SFML 提供发射器位置将非常简单。\n\n下一个我们需要注意的因素是 `attenuation`（衰减）。衰减是波退化的速率。你可以将这一陈述简化并针对声音进行具体化，即：衰减是音量减小的速度快慢。这在技术上并不精确，但对于本章的目的来说，这是一个足够好的描述。\n\
  \n我们需要考虑的最后一个因素是 `listener`（听者）。当 SFML 对声音进行空间化时，它是相对于哪里进行空间化的呢？在大多数游戏中，逻辑做法是使用玩家角色。在我们的游戏中，我们将使用托马斯（Thomas）。\n\
  \n# SFML 如何处理空间化\n\nSFML 拥有许多函数允许我们处理发射器、衰减和听者。让我们假设性地查看这些函数，然后我们将编写代码来真正为我们的项目添加空间化声音。\n\
  \n我们可以像经常做的那样，设置一个准备好播放的音效：\n\n```cpp\n// 按照通常方式声明 SoundBuffer\nSoundBuffer zombieBuffer;\n\
  \n// 按照通常声明 Sound 对象\nSound zombieSound;\n\n// 像经常做的那样从文件加载声音\nzombieBuffer.loadFromFile(\"\
  sound/zombie_growl.wav\"); // 将 Sound 对象与 Buffer 关联\nzombieSound.setBuffer(zombieBuffer);\n\
  ```\n\n我们可以使用 `setPosition` 函数设置发射器的位置，如下代码所示：\n\n```cpp\n// 设置发射器的水平和垂直位置 // 在这种情况下，发射器是一个丧尸\n\
  // 在 Zombie Arena 项目中，我们本可以使用 // getPosition().x 和 getPosition().y\n// 这些值是任意的\n\
  float x = 500;\nfloat y = 500;\n\nzombieSound.setPosition(x, y, 0.0f);\n```\n\n\
  正如前一段代码注释中所建议的，具体如何获取发射器的坐标可能取决于游戏的类型。如之前的代码所示，这在 Zombie Arena 项目中将非常简单。在我们项目中设置位置时，我们将面临一些需要克服的挑战。\n\
  \n可以使用以下代码设置衰减水平：\n\n```cpp\nzombieSound.setAttenuation(15);\n```\n\n实际的衰减水平可能有一点模糊。你希望玩家获得的效果可能与用于根据衰减随距离减小音量的精确科学公式不同。获得正确的衰减水平通常通过实验来实现。通常情况下，衰减级别越高，声音水平降低到静的速度就越快。\n\
  \n此外，你可能想在发射器周围设置一个区域，在该区域内音量完全不衰减。如果超出该范围不再适用，或者你有大量的声源且不想过度使用该功能，你可以这样做。为此，我们可以使用\
  \ `setMinimumDistance` 函数，如下所示：\n\n```cpp\nzombieSound.setMinDistance(150);\n```\n\
  \n通过上一行代码，直到听者距离发射器 150 像素/单位远时，衰减才会开始计算。\n\nSFML 库中其他实用的函数包括 `setLoop` 函数。当传入 `true`\
  \ 作为参数时，该函数将告诉 SFML 循环播放声音，如下代码所示：\n\n```cpp\nzombieSound.setLoop(true);\n```\n\n\
  声音将继续播放，直到我们用以下代码将其停止：\n\n```cpp\nzombieSound.stop();\n```\n\n每偶尔，我们想要知道声音的状态（播放中或停止）。我们可以通过\
  \ `getStatus` 函数实现这一点，如下代码所示：\n\n```cpp\nif (zombieSound.getStatus() == Sound::Status::Stopped)\
  \ {\n    // 声音没有在播放 // 在此处执行任何操作\n}\n\nif (zombieSound.getStatus() == Sound::Status::Playing)\
  \ {\n    // 声音正在播放 // 在此处执行任何操作 \n}\n```\n\n在使用 SFML 进行声音空间化时，我们还需要涵盖的最后一个方面是。听者在哪里？我们可以通过以下代码设置听者的位置：\n\
  \n```cpp\n// 听者在哪里？\n// 我们如何获取 x 和 y 的值取决于游戏\n// 在 Zombie Arena 游戏或 Thomas Was Late\
  \ 游戏中 // 我们可以使用 getPosition()\nListener::setPosition(m_Thomas.getPosition().x, m_Thomas.getPosition().y,\
  \ 0.0f);\n```\n\n前面的代码将使所有声音相对于该位置播放。这正是我们远处的火源咆哮或进来的丧尸声音所需的，但对于跳跃等普通音效来说，这是一个问题。我们可以开始处理玩家位置的发射器，但\
  \ SFML 为我们简化了事情。每当我们播放*普通*声音时，只需调用 `setRelativeToListener`，如下代码所示，然后以目前一直采用的方式播放声音。以下是我们可能播放的*普通*的、非空间化的跳跃音效：\n\
  \n```cpp\njumpSound.setRelativeToListener(true);\njumpSound.play();\n```\n\n我们在播放任何空间化声音之前，只需要再次调用\
  \ `Listener::setPosition` 即可。\n\n我们现在有了丰富的 SFML 声音函数库，准备好真正制造一些空间化的噪音了。\n\n# 构建\
  \ SoundManager 类\n\n你可能记得在上一个项目中，所有的声音代码占据了大量的代码。现在考虑到有了空间化，代码将会变得更长。为了保持代码的可维护性，我们将编写一个类来管理所有音效的播放。此外，为了帮助我们进行空间化，我们还将在\
  \ `Engine` 类中添加一个函数，但我们将在章节稍后的部分再讨论它。\n\n## 编写 SoundManager.h\n\n让我们从编写和检查头文件开始。\n\
  \n在**解决方案管理器**（Solution Explorer）中右键点击**头文件**（Header Files）并选择**添加**（Add）|**新建项...**（New\
  \ Item...）。在**新建项**窗口中，左单击高亮**头文件 (.h)**，然后在**名称**（Name）字段中输入 `SoundManager.h`。最后，点击**添加**按钮。我们现在准备好为编写头文件了\n\
  \n\n\n\n`SoundManager` 类。\n\n添加并检查以下代码：\n\n```cpp\n#pragma once\n\n#include <SFML/Audio.hpp>\n\
  \nusing namespace sf;\n\nclass SoundManager\n{\nprivate:\n    // 缓冲区\n    SoundBuffer\
  \ m_FireBuffer; SoundBuffer m_FallInFireBuffer; SoundBuffer m_FallInWaterBuffer;\
  \ SoundBuffer m_JumpBuffer; SoundBuffer m_ReachGoalBuffer;\n    // 声音对象\n    Sound\
  \ m_Fire1Sound;\n    Sound m_Fire2Sound;\n    Sound m_Fire3Sound;\n    Sound m_FallInFireSound;\
  \ Sound m_FallInWaterSound; Sound m_JumpSound;\n    Sound m_ReachGoalSound;\n  \
  \  // 我们接下来应该使用哪一个声音，火 1、2 还是 3\n    int m_NextSound = 1;\n\npublic:\n    SoundManager();\
  \ void playFire(Vector2f emitterLocation, Vector2f listenerLocation);\n    void\
  \ playFallInFire(); void playFallInWater(); void playJump();\n    void playReachGoal();\
  \ \n};\n```\n\n我们刚刚添加的代码中没有什么特别复杂的。有五个 `SoundBuffer` 对象和八个 `Sound` 对象。其中三个 `Sound`\
  \ 对象将播放同一个 `SoundBuffer`。这解释了为什么 `Sound`/`SoundBuffer` 对象的数量不同。这样做是为了我们可以同时播放多个具有不同空间化参数的轰鸣音效。\n\
  \n注意这里有一个变量 `m_NextSound`，它将帮助我们跟踪在这些可能同时播放的声音中，下一个应该使用哪一个。\n\n有一个构造函数 `SoundManager`，我们在其中设置所有的音效，还有五个函数用于播放这些音效。其中四个函数简单地播放普通音效，代码会非常简单。\n\
  \n其中一个函数 `playFire` 将处理空间化音效，内容会深入一些。注意 `playFire` 函数的参数。它接收一个 `Vector2f`（即发射器的位置）和第二个\
  \ `Vector2f`（即监听器的位置）。\n\n## 编写 SoundManager.cpp 文件\n\n现在我们可以编写函数定义了。构造函数和 `playFire`\
  \ 函数包含相当大量的代码，我们将分别查看它们。其他函数很短很简单，我们将一次性处理。\n\n在“解决方案管理器”（`Solution Explorer`）中右键点击“源文件”（`Source\
  \ Files`），选择“添加”（`Add`） | “新建项...”（`New Item...`）。在“添加新建项”窗口中，左键点击选中 `C++ 文件 (.cpp)`，然后在“名称”字段中输入\
  \ `SoundManager.cpp`。最后，点击“添加”按钮。我们现在准备好为 `SoundManager` 类编写 .cpp 文件了。\n\n## 编写构造函数\n\
  \n在 `SoundManager.cpp` 中添加以下用于包含包含指令和构造函数的代码：\n\n```cpp\n#include \"stdafx.h\"\n\
  #include \"SoundManager.h\"\n#include <SFML/Audio.hpp>\n\nusing namespace sf;\n\n\
  SoundManager::SoundManager()\n{\n    // 将声音加载到缓冲区\n    m_FireBuffer.loadFromFile(\"\
  sound/fire1.wav\");\n    m_FallInFireBuffer.loadFromFile(\"sound/fallinfire.wav\"\
  ); m_FallInWaterBuffer.loadFromFile(\"sound/fallinwater.wav\"); m_JumpBuffer.loadFromFile(\"\
  sound/jump.wav\");\n    m_ReachGoalBuffer.loadFromFile(\"sound/reachgoal.wav\");\
  \ // 当玩家距离 50 像素时声音为全音量\n    float minDistance = 150;\n\n    // 随着玩家远离，声音会逐渐减小\n\
  \    float attenuation = 15;\n\n    // 将声音与缓冲区关联\n    m_Fire1Sound.setBuffer(m_FireBuffer);\n\
  \    m_Fire2Sound.setBuffer(m_FireBuffer);\n    m_Fire3Sound.setBuffer(m_FireBuffer);\n\
  \    m_FallInFireSound.setBuffer(m_FallInFireBuffer); m_FallInWaterSound.setBuffer(m_FallInWaterBuffer);\
  \ m_JumpSound.setBuffer(m_JumpBuffer);\n    m_ReachGoalSound.setBuffer(m_ReachGoalBuffer);\n\
  \n    // 设置所有的衰减级别\n    m_Fire1Sound.setAttenuation(attenuation); m_Fire2Sound.setAttenuation(attenuation);\
  \ m_Fire3Sound.setAttenuation(attenuation);\n\n    // 设置所有的最小距离级别\n    m_Fire1Sound.setMinDistance(minDistance);\
  \ m_Fire2Sound.setMinDistance(minDistance); m_Fire3Sound.setMinDistance(minDistance);\n\
  \n    // 循环所有火声 // 当它们播放时\n    m_Fire1Sound.setLoop(true); m_Fire2Sound.setLoop(true);\
  \ m_Fire3Sound.setLoop(true); \n}\n```\n\n在之前的代码中，我们将五个声音文件加载到五个 `SoundBuffer` 对象中。接下来，我们将八个\
  \ `Sound` 对象与其中一个 `SoundBuffer` 对象关联。注意 `m_Fire1Sound`、`m_Fire2Sound` 和 `m_Fire3Sound`\
  \ 都将从同一个 `SoundBuffer` `m_FireBuffer` 播放。\n\n接下来，我们为三个火声设置了衰减和最小距离。\n\n### 提示\n\n\
  `150` 和 `15` 的值是通过实验得出的。一旦游戏运行，我鼓励你通过更改这些值来实验，并观察（或者说听听）差异。\n\n最后，对于构造函数，我们对每个与火相关的\
  \ `Sound` 对象使用了 `setLoop` 函数。现在当我们调用 `play` 时，它们将连续播放。\n\n## 编写 playFire 函数\n\n\
  添加如下所示的 `playFire` 函数，然后我们可以讨论它：\n\n```cpp\nvoid SoundManager::playFire(Vector2f\
  \ emitterLocation, Vector2f listenerLocation) {\n    // 监听器在哪里？Thomas。\n    Listener::setPosition(listenerLocation.x,\
  \ listenerLocation.y, 0.0f);\n    switch(m_NextSound) {\n        case 1:\n     \
  \       // 定位/移动声源\n            m_Fire1Sound.setPosition(emitterLocation.x, emitterLocation.y,\
  \ 0.0f);\n            if (m_Fire1Sound.getStatus() == Sound::Status::Stopped) {\n\
  \                // 如果声音没有播放，则播放\n                m_Fire1Sound.play();\n       \
  \     }\n            break;\n        case 2:\n            // 对第二个声音执行与之前相同的操作\n\
  \            m_Fire2Sound.setPosition(emitterLocation.x, emitterLocation.y, 0.0f);\n\
  \            if (m_Fire2Sound.getStatus() == Sound::Status::Stopped) {\n       \
  \         m_Fire2Sound.play();\n            }\n            break;\n        case\
  \ 3: // 对第三个声音执行与之前相同的操作 \n            m_Fire3Sound.setPosition(emitterLocation.x,\
  \ emitterLocation.y, 0.0f);\n            if (m_Fire3Sound.getStatus() == Sound::Status::Stopped)\
  \ {\n                m_Fire3Sound.play();\n            }\n            break;\n \
  \   }\n    // 递到下一个火声 \n    m_NextSound++;\n    // 当第三个声音启动后，返回 1\n    if (m_NextSound\
  \ > 3) { \n        m_NextSound = 1; \n    }\n}\n```\n\n我们做的第一件事是调用 `Listener::setPosition`\
  \ 并根据传入参数的 `Vector2f` 设置监听器的位置。\n\n接下来，代码根据 `m_NextSound` 的值进入 `switch` 块。每个 `case`\
  \ 语句执行的是完全相同的操作，但针对的是 `m_Fire1Sound`、`m_Fire2Sound` 或 `m_Fire3Sound` 之一。\n\n在每个\
  \ `case` 块中，我们使用传入的参数通过 `setPosition` 函数设置发射器的位置。每个 `case` 块中的下部分部分代码检查声音当前是否处于停止状态，如果是，则播放声音。我们很快就会看到如何得出传入此函数的发射器和监听器的位置。\n\
  \n`playFire` 函数的最后部分递增 `m_NextSound`，并确保它根据 `switch` 块的要求只能等于 1、2 或 3。\n\n## 编写\
  \ SoundManager 的其余函数\n\n添加这四个简单的函数：\n\n```cpp\nvoid SoundManager::playFallInFire()\
  \ {\n    m_FallInFireSound.setRelativeToListener(true); m_FallInFireSound.play();\n\
  }\n\nvoid SoundManager::playFallInWater() {\n    m_FallInWaterSound.setRelativeToListener(true);\
  \ m_FallInWaterSound.play();\n}\n\nvoid SoundManager::playJump() {\n    m_JumpSound.setRelativeToListener(true);\
  \ m_JumpSound.play();\n}\n\nvoid SoundManager::playReachGoal() {\n    m_ReachGoalSound.setRelativeToListener(true);\
  \ m_ReachGoalSound.play();\n}\n```\n\n`playFallInFire`、`playFallInWater` 和 `playReachGoal`\
  \ 函数只做了两件事。首先，它们都调用了 `setRelativeToListener`，使得音效没有经过空间化，使音效变为普通的而非方向性的，然后它们对相应的\
  \ `Sound` 对象调用了 `play`。\n\n`SoundManager` 类编写完毕。现在我们可以在 `Engine` 类中使用它。\n\n## 将\
  \ SoundManager 添加到游戏引擎\n\n打开 `Engine.h` 文件并添加一个新 `SoundManager` 类的实例，如下所示高亮代码：\n\
  \n```cpp\n#pragma once\n\n#include <SFML/Graphics.hpp>\n#include \"TextureHolder.h\"\
  \n#include \"Thomas.h\"\n#include \"Bob.h\"\n#include \"LevelManager.h\"\n#include\
  \ \"SoundManager.h\"\n\nusing namespace sf;\n```\n\n\n\n\n\n```cpp\nclass Engine\n\
  {\nprivate:\n    // 纹理持有者\n    TextureHolder th;\n    // Thomas 和他的朋友 Bob\n    Thomas\
  \ m_Thomas;\n    Bob m_Bob;\n    // 管理所有关级的类\n    LevelManager m_LM;\n    // 创建声音管理器\n\
  \    SoundManager m_SM;\n    const int TILE_SIZE = 50;\n    const int VERTS_IN_QUAD\
  \ = 4;\n};\n```\n\n此时，我们可以使用 `m_SM` 来调用各种 `play...` 函数。遗憾的是，仍然还有一些工作需要完成，以管理发射器（火源块）的位置。\n\
  \n# 填充声音发射器\n\n打开 `Engine.h` 文件，为 `populateEmitters` 函数添加一个新原型，并添加一个新的包含 `Vector2f`\
  \ 对象的 STL 向量：\n\n...\n...\n...\n\n// Run 将调用所有私有函数\nbool detectCollisions(PlayableCharacter&\
  \ character);\n\n// 创建一个发射声音最佳位置向量\nvoid populateEmitters(vector <Vector2f>& vSoundEmitters,\
  \ int arrayLevel);\n\n// 用于火发射器位置的 Vector2f 向量\nvector <Vector2f> m_FireEmitters;\n\
  \npublic: ... ... ...\n\n`populateEmitters` 函数接收 `Vector2f` 对象向量作为参数，以及一个 `int`\
  \ 指针（二维数组）。该向量将存储关卡中每个发射器的位置，而数组是我们的二维数组，它包含了关级的布局。\n\n## 编写 populateEmitters 函数\n\
  \n`populateEmitters` 函数的作用是扫描 `arrayLevel` 的所有元素，并决定在哪里放置发射器。它将其结果存储在 `m_FireEmitters`\
  \ 中。\n\n在 **Solution Explorer** 中右键点击 **Source Files** 并选择 **Add** | **New Item...**。在\
  \ **Add New Item** 窗口中，（通过左点击）选中 **C++ File** (.cpp)，然后在 **Name** 字段中输入 `PopulateEmitters.cpp`。最后，点击\
  \ **Add** 按钮。现在我们可以编写新函数 `populateEmitters` 代码了。\n\n添加全部代码；请确保在阅读代码的同时研究它，然后我们就可以讨论它：\n\
  \n```cpp\n#include \"stdafx.h\"\n#include \"Engine.h\"\nusing namespace sf;\nusing\
  \ namespace std;\n\nvoid Engine::populateEmitters(vector <Vector2f>& vSoundEmitters,\
  \ int arrayLevel)\n{\n    // 确保向量是空的\n    vSoundEmitters.empty();\n    // 跟踪上一个发射器以免产生过多的\n\
  \    FloatRect previousEmitter;\n    // 在关级中寻找火\n    for (int x = 0; x < (int)m_LM.getLevelSize().x;\
  \ x++) {\n        for (int y = 0; y < (int)m_LM.getLevelSize().y; y++) {\n     \
  \       if (arrayLevel[y][x] == 2)// 存在火 {\n                if (!FloatRect(x * TILE_SIZE,\
  \ y * TILE_SIZE, TILE_SIZE, TILE_SIZE).intersects(previousEmitter)) {\n        \
  \            // 添加此发射器的坐标\n                    vSoundEmitters.push_back(Vector2f(x\
  \ * TILE_SIZE, y * TILE_SIZE));\n                    // 跳过任何火块，以免让新的发射器与这一个太近\n\
  \                    previousEmitter.left = x * TILE_SIZE;\n                   \
  \ previousEmitter.top = y * TILE_SIZE;\n                    previousEmitter.width\
  \ = TILE_SIZE;\n                    previousEmitter.height = TILE_SIZE;\n      \
  \          }\n            }\n        }\n    }\n    return;\n}\n```\n\n某些代码乍看可能很复杂。理解我们用来选择发射器位置的技巧会使其变得简单。在我们的关卡中，通常会有大块的火块。在我设计的其中一个关卡中，有超过\
  \ 30 个火块聚集在一起。代码确保在给定的矩形内只有一个发射器。这个矩形存储在 `previousEmitter` 中，大小为 300 像素乘以 300 像素（`TILE_SIZE\
  \ * 6`）。代码设置了一个嵌套的 for 循环遍历 `arrayLevel` 以寻找火块。当它发现一个时，它确保它与 `previousEmitter` 不相交。只有这样，它才会使用\
  \ `push_back` 函数向 `vSoundEmitters` 添加另一个发射器。在此之后，它还会更新 `previousEmitter` 以避免获得聚集的声音发射器。让我们制造一些噪音吧。\n\
  \n# 播放声音\n\n打开 `Level.cpp` 文件，并按照如下代码所示添加新 `populateEmitters` 函数的调用：\n\n```cpp\n\
  void Engine::loadLevel()\n{\n    m_Playing = false;\n    // 删除之前分配的内存\n    for (int\
  \ i = 0; i < m_LM.getLevelSize().y; i++) {\n        delete[] m_ArrayLevel[i];\n\
  \    }\n    delete[] m_ArrayLevel;\n    // 加载带有地图的下一个二维数组并重新填充顶点数组\n    m_ArrayLevel\
  \ = m_LM.nextLevel(mLevel);\n    // 准备声音发射器\n    populateEmitters(m_FireEmitters,\
  \ m_ArrayLevel);\n    // 这个新的时间限制有多长\n    m_TimeRemaining = m_LM.getTimeLimit();\n\
  \    // 生成 Thomas 和 Bob\n    m_Thomas.spawn(m_LM.getStartPosition(), GRAVITY);\n\
  \    m_Bob.spawn(m_LM.getStartPosition(), GRAVITY);\n    // 确保这段代码不会再次运行\n    m_NewLevelRequired\
  \ = false;\n}\n```\n\n第一个要添加的声音是跳跃声。你可能记得键盘处理代码在 `Bob` 和 `Thomas` 类的纯虚函数中，当成功启动跳跃时，`handleInput`\
  \ 函数返回 `true`。\n\n打开 `Input.cpp` 文件，添加高亮的代码行，以便 `Thomas` 或 `Bob` 成功开始跳跃时播放跳跃声：\n\
  \n```cpp\n// 处理针对 Thomas 的输入\nif (m_Thomas.handleInput())\n{\n    // 播放跳跃声\n   \
  \ m_SM.playJump();\n}\n// 处理针对 Bob 的输入\nif (m_Bob.handleInput())\n{\n    // 播放跳跃声\n\
  \    m_SM.playJump();\n}\n```\n\n打开 `Update.cpp` 文件，添加高亮的代码行，当 `Thomas` 和 `Bob`\
  \ 同时到达当前关级目标时播放成功音：\n\n```cpp\n// 检测碰撞并查看角色是否已到达目标\n// if 条件的第二部分仅在 thomas 触摸家点块时执行\n\
  if (detectCollisions(m_Thomas) && detectCollisions(m_Bob)) {\n    // 需要新关级\n   \
  \ m_NewLevelRequired = true;\n    // 播放到达目标的声音\n    m_SM.playReachGoal();\n}\nelse\
  \ {\n    // 运行 bob 的碰撞检测\n    detectCollisions(m_Bob);\n}\n```\n\n在 `Update.cpp`\
  \ 文件中，我们还将添加代码遍历 `m_FireEmitters` 向量，并决定何时需要调用 `SoundManager` 类的 `playFire` 函数。\n\
  \n仔细观察新高亮代码周围的少量上下文。将此代码添加到完全正确的位置是关重要的：\n\n```cpp\n// if 结束\n// 检查是否需要播放火声\nvector<Vector2f>::iterator\
  \ it;\n// 遍历 Vector2f 对象向量\nfor (it = m_FireEmitters.begin(); it != m_FireEmitters.end();\
  \ it++)\n{\n    // 这个发射器在哪里？\n    // 将位置存储在 pos 中\n    float posX = (*it).x;\n \
  \   float posY = (*it).y;\n    // 发射器在玩家附近吗？\n    // 在发射器周围创建一个 500 像素的矩形\n    FloatRect\
  \ localRect(posX - 250, posY - 250, 500, 500);\n    // 玩家在 localRect 内部吗？\n    if\
  \ (m_Thomas.getPosition().intersects(localRect)) {\n        // 播放声音并传入位置\n     \
  \   m_SM.playFire(Vector2f(posX, posY), m_Thomas.getCenter());\n    }\n}\n```\n\n\
  之前的代码有点像声音碰撞检测。每当 Thomas 留在火发射器周围的 500x500 像素矩形内时，`playFire` 函数就会被调用，传入发射器和 Thomas\
  \ 的坐标。`playFire` 函数完成其余工作，并触发一个空间化的、循环音效。\n\n打开 `DetectCollisions.cpp` 文件，找到合适的位置，并按所示添加高亮代码。这两行高亮代码在角色掉入水块或火块时触发音效播放：\n\
  \n```cpp\n// 角色被烧伤或溺水了吗？\n// 使用头部，因为这允许他沉入一点，如果 (m_ArrayLevel[y][x] == 2 || m_ArrayLevel[y][x]\
  \ == 3) {\n    if (character.getHead().intersects(block)) {\n        character.spawn(m_LM.getStartPosition(),\
  \ GRAVITY);\n        // 应该播放什么声音？\n        if (m_ArrayLevel[y][x] == 2)// 火，哎！{\n\
  \            // 播放声音\n            m_SM.playFallInFire();\n        }\n        else\
  \ // 水 {\n            // 播放声音\n            m_SM.playFallInWater();\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n玩游戏将让你能够听到所有的声音，包括在靠近火源瓦块时酷炫的空间化效果。\n\n## HUD 类\n\n`HUD`\
  \ 类非常简单，与书中其他两个项目相比并没有什么不同之处。我们要做的不同之处是，将所有代码封装在一个新的 `HUD` 类中。如果我们将所有的 `Font`、`Text`\
  \ 和其他变量声明为这个新类的成员，我们就可以在构造函数中初始化它们，并为它们的所有值提供访问器函数（getter functions）。这可以保持 `Engine`\
  \ 类免受大量的声明和初始化代码的影响。\n\n## 编写 HUD.h\n\n首先，我们将编写 `HUD.h` 文件，包含所有的成员变量和函数声明。在**解决方案管理器**（Solution\
  \ Explorer）中右键点击**头文件**，并选择**添加 | 新项...**。在**添加新项**窗口中，用左键点击高亮**头文件** (.h)，然后在**名称**\
  \ 字段中输入 `HUD.h`。最后，点击**添加** 按钮。我们现在准备好为 `HUD` 类编写头文件了。\n\n将以下代码添加到 `HUD.h` 中：\n\n\
  ```cpp\n#pragma once\n\n#include <SFML/Graphics.hpp>\n\nusing namespace sf;\n\n\
  \ class Hud\n{\nprivate:\n    Font m_Font;\n    Text m_StartText; Text m_TimeText;\
  \ Text m_LevelText;\n\npublic:\n    Hud();\n    Text getMessage(); Text getLevel();\
  \ Text getTime(); \n    void setLevel(String text); void setTime(String text); \n\
  };\n```\n\n在前面的代码中，我们添加了一个 `Font` 实例和三个 `Text` 实例。`Text` 对象将用于显示提示用户开始的消息、剩余时间以及当前关卡编号。\n\
  \n公共函数更有趣。首先是构造函数，大部分代码将放在那里。构造函数将初始化 `Font` 和 `Text` 对象，并根据当前屏幕分辨率将它们放置在屏幕相应位置。\n\
  \n三个访问器函数 `getMessage`、`getLevel` 和 `getTime` 将向调用代码返回一个 `Text` 对象，以便将其绘制到屏幕上。\n\
  \n`setLevel` 和 `setTime` 函数将分别用于更新 `m_LevelText` 和 `m_TimeText` 中显示的文本。\n\n现在我们可以为刚刚概述的所有函数编写定义了。\n\
