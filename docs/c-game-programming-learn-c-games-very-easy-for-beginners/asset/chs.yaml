  graphics/player.png\"); m_Sprite.setTexture(m_Texture);\n\n// 设置 sprite 的原点为中心，\
  \ // 为了平滑旋转\n```\n\n\n\n\n```cpp\nm_Sprite.setOrigin(25, 25); \n}\n```\n\n在构造函数中（当然，它的名称与\
  \ `class` 相同且没有返回值），我们编写代码来开始设置 `Player` 对象以备使用。\n\n为了绝对清晰起见：这段代码将在我们在主函数中编写以下代码时运行：\n\
  \n```cpp\nPlayer player;\n```\n\n先不要添加上面的那行代码。\n\n我们要做的只是从相关的常量初始化 `m_Speed`、`m_Health`\
  \ 和 `m_MaxHealth`。然后，我们将玩家图形加载到 `m_Texture` 中，将 `m_Texture` 与 `m_Sprite` 关联，并将 `m_Sprite`\
  \ 的原点设置为中心点 (25, 25)。\n\n### 提示\n\n注意这个晦涩的注释 `// !!Watch this space!!`，这表示我们将会回来处理纹理的加载以及关于它的一些重要问题。一旦我们发现了问题并学到了更多\
  \ C++++，我们最终会改变处理这种纹理的方式。我们将在第 8 章 **指针、标准模板库与纹理管理** 中这样做。\n\n接下来，我们将编写 `spawn`\
  \ 函数。我们只会创建一个 `Player` 类的一个实例。然而，我们需要在每一波敌人出现时将其生成到当前关卡中。这就是 `spawn` 函数为我们处理的工作。将以下代码添加到\
  \ `Player.cpp` 文件中。务必检查细节并阅读注释：\n\n```cpp\nvoid Player::spawn(IntRect arena, Vector2f\
  \ resolution, int tileSize)\n{\n// 将玩家放在竞技场的中心 m_Position。\nm_Position.x = arena.width\
  \ / 2;\nm_Position.y = arena.height / 2;\n\n// 将竞技场的详细信息拷贝到玩家的 m_Arena 中。\nm_Arena.left\
  \ = arena.left;\nm_Arena.width = arena.width;\nm_Arena.top = arena.top;\nm_Arena.height\
  \ = arena.height;\n\n// 记住这个竞技场中网格的大小 m_TileSize = tileSize;\n\n// 存储分辨率以备后用 m_Resolution.x\
  \ = resolution.x;\nm_Resolution.y = resolution.y; \n}\n```\n\n之前的代码首先将 `m_Position.x`\
  \ 和 `m_Position.y` 值初始化为传入的 `arena` 高宽的一半。这样做的效果是将玩家移动到关卡的中心，无论其大小如何。\n\n接下来，我们将传入的\
  \ `arena` 的所有坐标和维度拷贝到相同类型的成员对象 `m_Arena` 中。由于当前竞技场的尺寸和坐标细节使用非常频繁，因此这样做是有意义的。我们现在可以使用\
  \ `m_Arena` 执行诸如确保玩家不能穿墙墙等任务。此外，为了同样的目的，我们将传入的 `tileSize` 拷贝到成员变量 `m_TileSize`。我们将在\
  \ `update` 函数中看到 `m_Arena` 和 `m_TileSize` 的作用。\n\n最后两行代码将屏幕分辨率从 `Vector2f, resolution`（它是\
  \ `spawn` 的参数）拷贝到 `m_Resolution`（它是 `Player` 的成员变量）。\n\n现在添加非常简单的 `resetPlayerStats`\
  \ 函数。当玩家死亡时，我们将使用它来重置他们可能使用过的任何升级：\n\n```cpp\nvoid Player::resetPlayerStats()\n\
  {\nm_Speed = START_SPEED; m_Health = START_HEALTH; m_MaxHealth = START_HEALTH;\n\
  }\n```\n\n在我们几乎完成项目之前，我们不会编写实际调用 `resetPlayerStats` 函数的代码，但它已经在那里了，以备不时之。\n\n在接下来的代码中，我们将增加两个函数。它们将处理玩家被僵尸击中发生的情况。我们可以调用\
  \ `player.hit()` 并传入当前的游戏时间。我们还可以通过调用 `player.getLastHitTime()` 来查询玩家上次被击中的时间。这些函数具体有什么用在我们有一些僵尸时就会显而易见！\n\
  \n将这两个新函数添加到 `Player.cpp` 文件中，然后我们将更仔细地观察 C++：\n\n```cpp\nTime Player::getLastHitTime()\n\
  {\nreturn m_LastHit;\n}\n\nbool Player::hit(Time timeHit)\n{\nif (timeHit.asMilliseconds()\
  \ - m_LastHit.asMilliseconds() > 200)\n{\nm_LastHit = timeHit; m_Health -= 10;\n\
  return true;\n}\nelse\n{\nreturn false; } \n}\n```\n\n`getLastHitTime` 的代码非常简单。返回存储在\
  \ `m_LastHit` 中的任何值即可。\n\n`hit` 函数则稍微深入且更细致。首先，`if` 语句检查传入的时间是否比 `m_LastHit` 存储的时间晚\
  \ 200 毫秒。如果是，则更新 `m_LastHit` 为传入的时间，并从 `m_Health` 当前值中扣去 10。该 if 语句的最后一行代码是 `return\
  \ true`。注意 `else` 分句只是向调用代码返回 `false`。\n\n该函数的整体效果是玩家每秒最多减少五次生命。记住我们的游戏循环每秒可能会运行数千次。在这种情况下，如果没有限制，僵尸只需要与玩家接触一秒就会扣数万点生命值。`hit`\
  \ 函数控制并限制了这种情况发生。它还通过返回 `true` 或 `false` 让调用代码知道是否注册了新的击中（或没有）。\n\n这段代码意味着我们将在主函数检测僵尸和玩家之间的碰撞。然后我们调用\
  \ `player.hit()` 来决定是否扣除任何生命值。\n\n接下来，我们将为 `Player` 类实现一组 getter 函数（get 方法）。它们使我们能够将数据整齐地封装在\
  \ `Player` 类中，同时让它们的值对主函数可用。\n\n在上一个代码块之后添加以下代码，我们将讨论每个函数的具体作用：\n\n```cpp\nFloatRect\
  \ Player::getPosition()\n{\nreturn m_Sprite.getGlobalBounds();\n}\n\nVector2f Player::getCenter()\n\
  {\nreturn m_Position;\n}\n\nfloat Player::getRotation()\n{\nreturn m_Sprite.getRotation();\n\
  }\n\nSprite Player::getSprite()\n{\nreturn m_Sprite; \n}\n\nint Player::getHealth()\
  \ { \nreturn m_Health; \n}\n```\n\n之前的代码非常简单。之前的五个函数中的每一个都返回我们的一个成员变量的值。仔细观察每个函数并熟悉哪个函数返回哪个值。\n\
  \n接下来的八个短函数允许键盘控制（我们将从 main 中使用）更改我们 `Player` 类型对象中包含的数据。将代码添加到 `Player.cpp` 文件中，然后我将总结它是如何工作的：\n\
  \n```cpp\nvoid Player::moveLeft()\n{\nm_LeftPressed = true;\n}\n\nvoid Player::moveRight()\n\
  {\nm_RightPressed = true;\n}\n\nvoid Player::moveUp()\n{\nm_UpPressed = true;\n\
  }\n\nvoid Player::moveDown()\n{\nm_DownPressed = true;\n}\n\nvoid Player::stopLeft()\n\
  {\nm_LeftPressed = false;\n}\n\nvoid Player::stopRight()\n{\nm_RightPressed = false;\
  \ \n}\n\nvoid Player::stopUp() {\nm_UpPressed = false; \n}\n\nvoid Player::stopDown()\n\
  {\nm_DownPressed = false;\n} \n```\n\n之前的代码有四个函数（`moveLeft`、`moveRight`、`moveUp`、`moveDown`），它们将相关的布尔变量（`m_LeftPressed`、`m_RightPressed`、`m_UpPressed`、`m_DownPressed`）设置为\
  \ true。另外四个函数（`stopLeft`、`stopRight`、`stopUp`、`stopDown`）相反，并将相同的布尔变量设置为 false。`Player`\
  \ 类实例现在可以知道哪些 `W`、`A`、`S` 和 `D` 键被按下，哪些没有。\n\n下一个函数是执行所有繁苦工作的那个。`update` 函数将在游戏循环的每一帧中被调用一次。添加以下代码，然后我们将详细检查它。如果你跟了之前的八个函数，并记得我们如何为\
  \ **Timber!!!** 项目制作云的动画，你可能会发现以下大部分代码非常易于理解：\n\n```cpp\nvoid Player::update(float\
  \ elapsedTime, Vector2i mousePosition) {\nif (m_UpPressed) {\nm_Position.y -= m_Speed\
  \ * elapsedTime; \n}\n\nif (m_DownPressed)\n{\nm_Position.y += m_Speed * elapsedTime;\n\
  }\n\nif (m_RightPressed) {\nm_Position.x += m_Speed * elapsedTime; \n}\n\nif (m_LeftPressed)\n\
  {\nm_Position.x -= m_Speed * elapsedTime;\n}\n\nm_Sprite.setPosition(m_Position);\n\
  \n// 将玩家留在竞技场内\nif (m_Position.x > m_Arena.width - m_TileSize) {\n```\n\n\n\n\n\n\
  ```cpp\nm_Position.x = m_Arena.width - m_TileSize; }\n\nif (m_Position.x < m_Arena.left\
  \ + m_TileSize)\n{\n  m_Position.x = m_Arena.left + m_TileSize;\n}\n\nif (m_Position.y\
  \ > m_Arena.height - m_TileSize)\n{\n  m_Position.y = m_Arena.height - m_TileSize;\n\
  }\n\nif (m_Position.y < m_Arena.top + m_TileSize)\n{\n  m_Position.y = m_Arena.top\
  \ + m_TileSize;\n}\n\n// 计算玩家面对的角度\nfloat angle = (atan2(mousePosition.y - m_Resolution.y\
  \ / 2, mousePosition.x - m_Resolution.x / 2)\n* 180) / 3.141; \n\nm_Sprite.setRotation(angle);\
  \ }\n```\n\n上述代码的第一部分负责移动玩家精灵。这四个 `if` 语句检查与移动相关的布尔变量（`m_LeftPressed`、`m_RightPressed`、`m_UpPressed`、`m_DownPressed`）哪些为真，并相应地更改\
  \ `m_Position.x` 和 `m_Position.y`。计算移动量的公式与 Timber!!! 项目使用的相同：`位置 (+ 或 -) 速度 * 流逝时间`。\n\
  \n在这四个 `if` 语句之后，调用了 `m_Sprite.setPosition` 并传入 `m_Position`。此时，精灵已经根据该帧调整了精确的位移。\n\
  \n接下来的四个 `if` 语句检查 `m_Position.x` 或 `m_Position.y` 是否超出了当前竞技场的任何边缘。记住，当前竞技场的边界在\
  \ `spawn` 函数中存储在 `m_Arena` 中。让我们按顺序来看这四个 `if` 语句中的第一个来理解它们：\n\n```cpp\nif (m_Position.x\
  \ > m_Arena.width - m_TileSize)\n{\n  m_Position.x = m_Arena.width - m_TileSize;\n\
  } \n```\n\n之前的代码测试了 `m_position.x` 是否大于 `m_Arena.width` 减去元素的大小（`m_TileSize`）。正如我们在创建背景图形时将看到的，此计算将检测玩家是否进入墙壁。\n\
  \n当 `if` 语句为真时，使用计算结果 `m_Arena.width - m_TileSize` 初始化 `m_Position.x`。这使得玩家图形的中心无法越过右墙的边缘。紧随我们讨论的语句之后的三个\
  \ `if` 语句对其他三面墙执行相同的操作。\n\n最后两行代码计算并设置了玩家精灵旋转（面向）的角度。这行代码看起来可能有点复杂，但它仅仅是在一个经过测试的三角函数中使用交叉准星的位置（`mousePosition.x`\
  \ 和 `mousePosition.y`）和屏幕中心（`m_Resolution.x` 和 `m_Resolution.y`）。\n\n`atan` 如何使用这些坐标以及\
  \ `Pi`（`3.141`）非常复杂，这就是为什么它被封装成一个方便我们使用的函数。如果你想更详细地探索三角函数，可以在 `http://www.cplusplus.com/reference/cmath/`\
  \ 查看。`Player` 类的最后三个函数分别让玩家速度提高了 20%，生命增加了 20%，并根据传入的增加玩家的生命值。\n\n将此代码添加到 `Player.cpp`\
  \ 文件的末尾，我们将进行详细观察：\n\n```cpp\nvoid Player::upgradeSpeed()\n{\n  // 20% 速度升级\n  m_Speed\
  \ += (START_SPEED * .2);\n}\n\nvoid Player::upgradeHealth() {\n  // 20% 最大生命值升级\n\
  \  m_MaxHealth += (START_HEALTH * .2);\n}\n\nvoid Player::increaseHealthLevel(int\
  \ amount) {\n  m_Health += amount;\n  // 但不能超过最大值 (m_Health > m_MaxHealth) { \n\
  \  m_Health = m_MaxHealth; }\n}\n```\n\n在之前的代码中，`upgradeSpeed` 和 `upgradeHealth`\
  \ 函数分别增加了存储在 `m_Speed` 和 `m_MaxHealth` 中的值。通过将初始值乘以 `0.2` 并加到当前值上，数值增加了 20%。当玩家在关级之间选择想要改进的角色属性时，这些函数将从\
  \ `main` 函数中调用。\n\n`increaseHealthLevel` 接收来自 `main` 的 `amount` 参数的 `int` 值。这个 `int`\
  \ 值将由我们在第 9 章*碰撞检测、拾取物与子弹* 中编写的 `Pickup` 类提供。`m_Health` 成员变量增加了传入的值。然而，对于玩家来说有一个陷阱。`if`\
  \ 语句检查 `m_Health` 是否超过了 `m_MaxHealth`，如果是，则将其设置为 `m_MaxHealth`。这意味着玩家不能简单地通过拾取获得无限生命。相反，他们必须仔细平衡在关级之间选择的升级。\n\
  \n当然，在我们实例化它并将其投入游戏循环工作之前，我们的 `Player` 类实际上无法执行任何操作。在此之前，让我们来看一下“游戏相机”的概念。\n\n#\
  \ 使用 SFML View 控制游戏相机\n\n在我看来，SFML 的 `View` 类是最优雅的类之一。如果你在读完这本书后不使用任何媒体或游戏库制作游戏，你将真的会注意到\
  \ `View` 的缺失。\n\n`View` 类允许我们认为游戏是发生在它自己的世界中，拥有自己的属性。我什么意思？当我们创建一个游戏时，我们通常在尝试创建一个虚拟世界。这个虚拟世界很少（如果说的话）以像素衡量，而且该世界也很少与玩家显示器的像素数量完全相同。我们需要一种方法来抽象我们正在构建的虚拟世界，以便它可以是我们喜欢的任何尺寸或形状。\n\
  \n另一种思考 `SFML View` 的方式是将其视为玩家查看我们虚拟世界部分的相机。大多数游戏将有多个相机或世界视图。例如，考虑一个分屏游戏，两个玩家可以在同一个世界的不同部分、不同的时间出现。或者考虑一个游戏，屏幕上有一个小区域代表整个游戏世界，但处于非常高的水平或缩放状态，就像小地图。\n\
  \n即使我们的游戏比之前的两个例子简单得多，不需要分屏或小地图，我们可能也想创建一个比运行它的屏幕更大的世界。这在《Zombie Arena》中确实是如此。如果我们不断移动游戏相机来显示虚拟世界的不同部分（通常是跟踪玩家），HUD（平视显示）会发生什么？如果我们绘制了分数和其他屏幕上的\
  \ HUD 信息，然后通过滚动世界来跟随玩家，那么分数将相对于该相机移动。\n\nSFML `View` 类轻松实现了所有这些功能，并用非常直观的代码解决了这个问题。诀窍是为每一个相机创建一个\
  \ `View` 实例。也许为小地图创建一个 `View`，为滚动的游戏世界创建一个 `View`，然后为 HUD 创建一个 `View`。\n\n`View`\
  \ 的实例可以根据需要移动、调整大小和定位。因此，跟随游戏的主 `View` 可以跟踪玩家，小地图视图可以保持在固定的缩放状态的小角落，而 HUD 可以覆盖整个屏幕，尽管主视图可以随处移动。\n\
  \n让我们来看看使用 `View` 实例的代码。\n\n在我看来，SFML 的 `View` 类是最优雅的类之一。如果你在读完这本书后不使用任何媒体或游戏库制作游戏，你将真的会注意到\
