  // 在竞技场中心生成玩家\nplayer.spawn(arena, resolution, tileSize);\n\n// 配置拾取物\nhealthPickup.setArena(arena);\
  \ ammoPickup.setArena(arena);\n\n// 创建僵尸群\nnumZombies = 5 * wave;\n\n// 释放之前分配的内存（如果存在）\n\
  delete[] zombies;\nzombies = createHorde(numZombies, arena);\n\nnumZombiesAlive\
  \ = numZombies; \n\n// 播放升级音效\npowerup.play();\n\n// 重置时钟以防止帧跳变\nclock.restart();\n\
  \n}\n// 结束 LEVELING up\n```\n\n之前的代码从增加 `wave` 变量开始。然后修改了代码，使僵尸的数量和竞技场的大小相对于 `wave`\
  \ 的新值。最后，我们添加了对 `powerup.play()` 的调用，以播放升级音效。\n\n# 重启游戏\n\n我们已经通过 `wave` 变量的值确定了竞技场的大小和僵尸的数量。我们必须在每个新游戏开始时将弹药、枪、波次和分数重置为零。在游戏循环的事件处理部分找到以下代码，并添加高亮的代码：\n\
  \n```cpp\n// 在 GAME_OVER 状态下开始新游戏\n\nelse if (event.key.code == Keyboard::Return\
  \ &&\nstate == State::GAME_OVER)\n{\nstate = State::LEVELING_UP; \nwave = 0;\nscore\
  \ = 0;\n\n// 为下一次游戏准备枪和弹药\ncurrentBullet = 0;\nbulletsSpare = 24;\nbulletsInClip\
  \ = 6;\nclipSize = 6;\nfireRate = 1; \n\n// 重置玩家统计数据\nplayer.resetPlayerStats();\
  \ \n}\n```\n\n现在我们可以开始玩游戏了，玩家会变得越来越强大，僵尸会在不断扩大的竞技场内变得越来越多，直到他死亡，然后一切都会重新开始。\n\n\
  # 播放剩余音效\n\n现在我们将添加 `play` 函数的剩余调用。我们将逐一处理每一个调用，因为准确确定它们所处的位置对于在正确的时刻播放它们至关重要。\n\
  \n## 在玩家装弹时添加音效\n\n在三个地方添加高亮的代码，以便在玩家按下 `R` 键尝试装弹时，播放相应的装弹音效或装弹失败音效：\n\n```cpp\n\
  if (state == State::PLAYING)\n{\n// 装弹\nif (event.key.code == Keyboard::R) {\nif\
  \ (bulletsSpare >= clipSize) {\n// 弹药充足。装弹。\nbulletsInClip = clipSize; \nbulletsSpare\
  \ -= clipSize;\nreload.play();\n}\nelse if (bulletsSpare > 0)\n{\n// 只剩少量弹药\nbulletsInClip\
  \ = bulletsSpare; \nbulletsSpare = 0; \nreload.play();\n}\nelse\n{\n// 很快就会更多了？！\n\
  reloadFailed.play();\n}\n}\n}\n```\n\n## 制作射击声\n\n在处理玩家点击左鼠标键的代码末尾，添加高亮的 `shoot.play()`\
  \ 调用：\n\n```cpp\n// 发射子弹\nif (sf::Mouse::isButtonPressed(sf::Mouse::Left)) {\nif\
  \ (gameTimeTotal.asMilliseconds()\n- lastPressed.asMilliseconds()\n> 1000 / fireRate\
  \ && bulletsInClip > 0)\n{\n// 将玩家和准星的中心\n// 传递给 shoot 函数\nbullets[currentBullet].shoot(\n\
  player.getCenter().x, player.getCenter().y, mouseWorldPosition.x, mouseWorldPosition.y);\n\
  \ncurrentBullet++;\nif (currentBullet > 99) {\ncurrentBullet = 0;\n}\nlastPressed\
  \ = gameTimeTotal; \n\nshoot.play();\nbulletsInClip--; \n}\n// 结束发射子弹\n```\n\n##\
  \ 玩家被击时播放声音\n\n在下一段代码中，我们将 `hit.play` 的调用封装在一个测试中，检查 `player.hit` 函数是否返回真。记住 `player.hit`\
  \ 函数会测试在过去的 100 毫秒内是否记录了击中。这将产生快速、重复的砰砰声的效果，但不会快到让声音融合成一种噪音。\n\n如此处高亮，添加 `hit.play`\
  \ 的调用：\n\n```cpp\n// 是否有僵尸碰到了玩家\nfor (int i = 0; i < numZombies; i++)\n{\nif (player.getPosition().intersects\n\
  (zombies[i].getPosition()) && zombies[i].isAlive())\n{\nif (player.hit(gameTimeTotal))\
  \ {\n// 稍后这里会有\nhit.play();\n}\nif (player.getHealth() <= 0) {\nstate = State::GAME_OVER;\n\
  std::ofstream OutputFile(\"gamedata/scores.txt\"); \nOutputFile << hiScore;\nOutputFile.close();\
  \ \n}\n}\n}\n// 结束玩家碰到\n```\n\n## 获得拾取物时播放声音\n\n当玩家捡起健康拾取时，我们将播放普通的拾取声，但当玩家获得弹药拾取时，我们将播放装弹音效。\n\
  \n在适当的碰撞检测代码中，如此处高亮，添加两个播放声音的调用：\n\n```cpp\n// 玩家碰到健康拾取\nif (player.getPosition().intersects\n\
  (healthPickup.getPosition()) && healthPickup.isSpawned()) {\nplayer.increaseHealthLevel(healthPickup.gotIt());\n\
  \n// 播放声音\npickup.play();\n}\n\n// 玩家碰到弹药拾取\nif (player.getPosition().intersects\n\
  (ammoPickup.getPosition()) && ammoPickup.isSpawned()) {\nbulletsSpare += ammoPickup.gotIt();\n\
  \n// 播放声音\nreload.play(); \n```\n\n## 僵尸被射中时制作啪嗒声\n\n在检测子弹与僵尸碰撞的代码段末尾添加 `splat.play`\
  \ 调用：\n\n```cpp\n// 是否有僵尸被射中？\nfor (int i = 0; i < 100; i++)\n{\nfor (int j = 0;\
  \ j < numZombies; j++) {\nif (bullets[i].isInFlight() && zombies[j].isAlive())\n\
  {\nif (bullets[i].getPosition().intersects\n(zombies[j].getPosition()))\n{\n// 停止子弹\n\
  bullets[i].stop();\n// 注册击中并查看是否击杀\nif (zombies[j].hit()) {\n// 不仅是击中也是击杀\nscore\
  \ += 10;\nif (score >= hiScore) {\nhiScore = score;\n} \n\nnumZombiesAlive--;\n\n\
  // 当所有僵尸死亡时（再次）\nif (numZombiesAlive == 0) {\nstate = State::LEVELING_UP;\n}\n\n\
  }\n}\n}\n```\n\n\n\n\n\n```\n// Make a splat sound splat.play();\n\n} }\n\n// End\
  \ zombie being shot\n```\n\n你现在可以运行完成的游戏了，并观察僵尸数量和竞技场如何随着每一波攻击而增加。请仔细选择你的升级选项：![](img/image.jpg)恭喜！\n\
  \n# 第 12 章 抽象与代码管理 – 更好地利用 OOP\n\n在本章中，我们将首次预览本书的终极项目。该项目将包含高级功能，例如定向音频，声音会根据玩家的位置从扬声器传出。它还将包含分屏协作游戏模式。此外，该项目将引入\
  \ `Shaders`（着色器）的概念，这是用另一种语言编写并直接运行在显卡上的程序。到第 16 章 *扩展 SFML 类、粒子系统和着色器* 结束时，你将构建出一个类似于热门经典游戏\
  \ `Thomas Was Alone` 风格的全功能多人平台跳游戏。\n\n本章的重点将是启动项目——特别是探索如何组织代码以更好地利用 OOP（面向对象编程）。我们将涵盖以下主题：\n\
  \n- 最终项目 `Thomas Was Late` 的介绍，包括游戏特性和项目资源\n- 详细讨论与之前的项目相比，我们将如何改进代码结构\n- 编写 `Thomas\
  \ Was Late` 游戏引擎\n- 实现分屏功能\n- `Thomas Was Late` 游戏\n\n## Thomas Was Late\n\n此时，如果你还没有看的话，我建议你去\
  \ http://store.steampowered.com/app/220780/ 看一遍 `Thomas Was Alone` 的视频。注意它那非常简单但极具美感的画面。视频还展示了各种游戏挑战，例如利用角色的不同属性（身高、跳跃高度、力量等）。为了在保持游戏简单的同时不失挑战性，我们的谜题功能将比\
  \ `Thomas Was Alone` 少，但增加了一个额外的挑战：创造出两名玩家协作玩的需求。为了确保游戏不会简单，我们还将让玩家与时间赛跑，这就是为什么我们的游戏\
  \ own Thomas Was Late（托马迟到了）。\n\n## Thomas Was Late 的特性\n\n我们的游戏无法与尝试模仿的那部杰作相比，但它将有一系列令人兴奋的游戏特性：\n\
  \n- 一个根据关卡挑战合适的时间倒计时的时钟。\n- 火坑会根据玩家的位置发出咆哮声，如果玩家掉入，则会在起点重生。水坑具有相同的效果，但没有定向音效。\n\
  - 协作游戏模式——两名玩家都必须在规定时间内让他们的角色到达终点。他们经常需要合作，例如，身材较矮、跳跃高度较低的 Bob 需要站在他朋友（Thomas）的头上。\n\
  - 玩家可以在全屏和分屏之间切换选项，这样他就可以尝试自己控制两个角色。每个关卡都将从文本文件中设计并加载。这使得设计多样化且大量的关卡变得非常容易。\n\n\
  看一眼这张带注释的游戏截图，可以看到一些特性的运行效果以及组成游戏的组件/资源：![](img/image.jpg)让我们来看看这些特性，并再多描述几个：\n\n\
  截图显示了一个简单的 HUD（平视显示器），详细列出了关卡编号以及玩家失败并重新开始关卡前的剩余秒数。\n\n你也可以清楚地看到运行中的分屏协作。记住，这是可选的。单个玩家可以全屏模式独自承担游戏，并在\
  \ Thomas 和 Bob 之间切换摄像焦点。虽然在截图中显示得不清楚（尤其是打印出来后），但当一个角色死亡时，他会像星形爆炸/烟花般的粒子效果一样爆炸。\n\
  \n水和火块可以策略性地放置，使关卡变得有趣，并迫使角色之间合作。更多内容将在第 14 章 *构建可玩关卡与碰撞检测* 中介绍。\n\n注意 Thomas 和\
  \ Bob——他们不仅身高不同，而且跳跃能力也有显著差异。这意味着 Bob 在进行大跳跃时依赖 Thomas，而关卡的设计可以迫使 Thomas 采取一条避免\
  \ Bob 撞头的路线。\n\n此外，火块会发出咆哮声。这些声音相对于 Thomas 的位置。它们不仅是方向性的（会从左或或右扬声器传出），而且随着 Thomas\
  \ 靠近或远离光源而变大或变小。最后，在带注释的截图，你可以看到背景。如果你将它与 `background.png` 文件（在本章稍后显示）对比，你会发现非常不同。我们将在第\
  \ 16 章 *扩展 SFML 类、粒子系统和着色器* 中使用 OpenGL 着色器来实现背景中移动的——几乎像泡泡的效果。\n\n所有这些特性都值得多几张截图，以便我们在编写\
