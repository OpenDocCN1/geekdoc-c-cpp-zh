  \n![](img/image00272.jpeg)这比以前容易得多。\n\n# 开始编写主游戏循环\n\n如你所见，上一段代码的最后部分是游戏循环 `while(window.isOpen()){}`。我们现在关注的正是这里。具体来说，我们将编写游戏循环的输入处理部分。\n\
  \n接下来我们要添加的代码非常长。它并不复杂，我们几分钟后会详细检查它。\n\n将以下代码所示的高亮代码添加到主游戏循环中：\n\n```cpp\n // 主游戏循环\n\
  \nwhile (window.isOpen())\n\n{\n\n/*\n\n************ 处理输入 ************ */\n\n//\
  \ 通过轮询 Event 事件来处理事件 Event event;\n\nwhile (window.pollEvent(event)) {\n\nif (event.type\
  \ == Event::KeyPressed) {\n\n// 游戏期间暂停游戏\n\nif (event.key.code == Keyboard::Return\
  \ && state == State::PLAYING)\n\n{\n\nstate = State::PAUSED;\n\n}\n\n// 暂停时重启\n\n\
  else if (event.key.code == Keyboard::Return && state == State::PAUSED)\n\n{\n\n\
  else if (event.key.code == Keyboard::Return && state == State::GAME_OVER)\n\n{\n\
  \nstate = State::LEVELING_UP;\n\n}\n\nif (state == State::PLAYING)\n\n{\n\n}\n\n\
  }\n\n}// 结束事件轮询\n\n state = State::PLAYING;\n\n// 重置时钟以防止帧跳变 clock.restart(); \n\
  \n}\n\n// 在 GAME_OVER 状态下开始新游戏\n\n}// 结束游戏循环\n```\n\n在上一段代码中，我们实例化了一个 `Event` 类型的对象。我们将像在\
  \ Timber!!! 项目中那样使用 `event` 来轮询系统事件。为了做到这一点，我们将上一个代码块中的剩余代码封装在一个条件为 `window.pollEvent(event)`\
  \ 的 `while` 循环中。这将使其在每一帧中持续循环，直到没有更多需要处理的事件为止。\n\n在这个 `while` 循环内部，我们处理感兴趣的事件。首先，我们测试\
  \ `Event::KeyPressed` 事件。如果游戏在 `PLAYING` 状态下按下 `Enter` 键，我们将状态切换到 `PAUSED`。\n\n\
  如果游戏在 `PAUSED` 状态下按下 `Enter` 键，我们将状态切换到 `PLAYING` 并重启时钟。在从 `PAUSED` 切换到 `PLAYING`\
  \ 之后重启时钟的原因是，当游戏暂停时，流逝的时间仍在累积。如果我们不重启时钟，我们所有的对象在更新位置时将就像这一帧花费了很长时间一样。随着我们完善该文件的其余代码，这一点会变得更加明显。\n\
  \n然后我们有一个 `else if` 测试，来检查在游戏处于 `GAME_OVER` 状态下是否按了 `Enter` 键。如果是，`state` 将更改为 `LEVELING_UP`。\n\
  \n### 注意\n\n请注意 `GAME_OVER` 状态是显示主屏幕的状态。因此，`GAME_OVER` 状态是玩家刚刚死亡后的状态，也是玩家首次运行应用时的状态。玩家每局游戏的第一件事就是选择一个属性进行改进（升级）。\n\
  \n在上一段代码中，有一个最后的 `if` 条件来测试 `state` 是否为 `PLAYING`。这个 `if` 块是空的，我们将在整个项目中向其中添加代码。\n\
  \n### 提示\n\n由于我们在整个项目中向此文件的许多不同部分添加代码，因此花时间理解游戏可能处于的不同状态以及我们在何处处理它们是值得的。在适当的时候折叠和展开不同的\
  \ `if`、`else` 和 `while` 块也将非常有益。\n\n请花些时间彻底熟悉我们刚刚编写的 `while`、`if` 和 `else if` 块。我们将经常回过它们。\n\
  \n接下来，紧接上一段代码之后且仍在游戏循环内部，并在仍在处理输入时，添加这段高亮代码。注意已有的代码（未高亮部分），它精确地显示了新代码所在的位置：\n\n\
  ```cpp\n}// 结束事件轮询\n\n // 处理玩家退出\n\nif (Keyboard::isKeyPressed(Keyboard::Escape))\n\
