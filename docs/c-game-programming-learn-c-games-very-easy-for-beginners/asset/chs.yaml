  \n## 生成 Thomas 和 Bob\n\n随着项目的进展，我们需要在几个不同的地方调用 `Thomas` 和 `Bob` 对象的 `spawn` 函数。显而易见的是，我们需要在新关卡开始时生成这两个角色。在接下来的章节中，随着我们在关卡开始时需要执行的任务数量增加，我们将编写一个\
