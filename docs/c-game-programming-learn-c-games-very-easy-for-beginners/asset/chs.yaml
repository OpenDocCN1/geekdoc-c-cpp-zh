  healthBar.setFillColor(Color::Red); \nhealthBar.setPosition(450, 980); \n\n// 主游戏循环\n\
  while (window.isOpen()) \n```\n\n之前的代码非常简单，没什么新内容。它基本上是创建了一大堆 SFML `Text` 对象。我们为它们分配了颜色和大小，然后使用之前见过的函数格式化了它们的位置。\n\
  \n最需要注意的是，我们创建了另一个名为 `hudView` 的 `View` 对象，并初始化它以适应屏幕分辨率。\n\n正如我们所看到的，主视图对象会随着玩家移动而滚动。相比之下，我们永远不会移动\
  \ `hudView`。这样做的结果是，只要我们在绘制 HUD 元素之前切换到此视图，就能产生一种效果：让游戏世界在下方滚动，而玩家的 HUD 保持静止。\n\n\
  ### 提示\n\n打个比方，你可以想象在电视屏幕上覆盖一张写有字字的透明塑料薄膜。电视会照常显示移动的画面，而塑料薄膜上的文字无论下方发生了什么，都会保持在原位置。\n\
  \n然而，需要注意的下一点是，高分并没有以任何有意义的方式进行设置。我们需要等到下一章，届时我们将调查文件输入/输出，以保存和取回高分。\n\n另一个值得注意的点是，我们声明并初始化了一个名为\
  \ `healthBar` 的 `RectangleShape`，它将作为玩家剩余血量的视觉表示。它的工作方式与上一个项目中的时间条几乎完全相同，当然，它代表的是血量而不是时间。\n\
  \n在之前的代码中，有一个名为 `ammoIcon` 的新精灵，它为我们要在屏幕左下角绘制的弹药和弹匣统计数据提供了背景。\n\n尽管我们刚刚添加的大量代码并没有新意或技术上的复杂之处，但请务必熟悉细节，特别是变量名，以便本章其余部分更容易跟进。\n\
  \n### 每帧更新 HUD\n\n正如你所预期的，我们将在代码的更新部分更新 HUD 变量。然而，我们不会每帧都这样做。其原因是，这是没有必要的，而且会减慢我们的游戏循环。\n\
  \n例如，考虑玩家杀死一只僵尸并获得一些额外分数的情况。持有分数的 `Text` 对象是在千分之一、百分之一还是十分之一秒内更新并不重要。玩家察觉不到任何区别。这意味着我们不需要每帧都重建用于\
  \ `Text` 对象的字符串。\n\n所以我们可以跟踪 HUD 更新之间的时间，添加以下变量：\n\n```cpp\n// 我们上次更新 HUD 是什么时候\n\
  int framesSinceLastUpdate = 0;\n\n// 我们希望间隔多少帧（帧）更新 HUD\nint fpsMeasurementInterval\
  \ = 1000;\n```\n\n// 主游戏循环\nwhile (window.isOpen())\n\n在之前的代码中，我们有变量来跟踪自上次更新 HUD\
  \ 经过的帧数，以及以帧为单位的更新间隔。\n\n现在我们可以使用这些新变量并每帧更新 HUD。然而，直到我们在下一章开始操作如 `wave` 等变量之前，我们不会看到所有的\
  \ HUD 元素发生变化。\n\n在游戏循环的更新部分添加高亮代码，如下：\n\n```cpp\n// 玩家是否碰到了弹药\nif (player.getPosition().intersects(ammoPickup.getPosition())\
  \ && ammoPickup.isSpawned()) {\n    bulletsSpare += ammoPickup.gotIt(); \n}\n\n\
  // 设置血条的大小\nhealthBar.setSize(Vector2f(player.getHealth() * 3, 50)); // 增加距离上次的帧数\n\
  framesSinceLastUpdate++;\n\n// 每隔 fpsMeasurementInterval 帧重新计算\nif (framesSinceLastUpdate\
  \ > fpsMeasurementInterval) {\n    // 更新游戏 HUD \n    std::stringstream ssAmmo;\n\
  \    std::stringstream ssScore;\n    std::stringstream ssHiScore; \n    std::stringstream\
  \ ssWave;\n    std::stringstream ssZombiesAlive;\n\n    // 更新弹药文本\n    ssAmmo <<\
  \ bulletsInClip << \"/\" << bulletsSpare; \n    ammoText.setString(ssAmmo.str());\n\
  \n    // 更新分数文本\n    ssScore << \"Score:\" << score; \n    scoreText.setString(ssScore.str());\n\
  \n    // 更新高分文本\n    ssHiScore << \"Hi Score:\" << hiScore; \n    hiScoreText.setString(ssHiScore.str());\n\
  \n    // 更新波次\n    ssWave << \"Wave:\" << wave;\n    waveNumberText.setString(ssWave.str());\n\
  \n    // 更新剩余僵尸数量\n    ssZombiesAlive << \"Zombies:\" << numZombiesAlive; \n   \
  \ zombiesRemainingText.setString(ssZombiesAlive.str()); \n\n    framesSinceLastUpdate\
  \ = 0;\n} // HUD 更新结束\n} // 更新场景结束\n```\n\n\n\n\n\n接下来，我们启动一个 `if` 块来测试 `framesSinceLastHUDUpdate`\
  \ 是否大于我们的偏好间隔，该间隔存储在 `fpsMeasurementFrameInterval` 中。\n\n在这个 `if` 块内部是所有操作发生的地方。首先，我们为每个需要设置到\
  \ `Text` 对象的字符串声明一个字符串流对象（string stream）。\n\n然后我们依次使用这些字符串流对象，并使用 `setString` 函数将结果设置到相应的\
  \ `Text` 对象。\n\n最后，在退出 `if` 块之前，将 `framesSinceLastHUDUpdate` 设置回零，以便计数能够重新开始。\n\n\
  现在，当我们重绘场景时，新值将出现在玩家的 HUD 中。\n\n# 绘制 HUD、主界面和升级界面\n\n接下来三个代码块中的所有代码都位于游戏循环的绘制阶段。我们所做的就是在主游戏循环的绘制部分，在适当的状态下绘制相应的\
  \ `Text` 对象即可。\n\n在 `PLAYING` 状态下，添加以下高亮代码：\n\n```cpp\n//绘制准准星\nwindow.draw(spriteCrosshair);\n\
  \n// 切换到 HUD 视图\nwindow.setView(hudView);\n\n// 绘制所有 HUD 元素\nwindow.draw(spriteAmmoIcon);\n\
  window.draw(ammoText);\nwindow.draw(scoreText);\nwindow.draw(hiScoreText);\nwindow.draw(healthBar);\n\
  window.draw(waveNumberText);\nwindow.draw(zombiesRemainingText);\n```\n\n```cpp\n\
  if (state == State::LEVELING_UP) {}\n```\n\n在上一个代码块中需要注意的关键点是我们将视图切换到 HUD 视图。这会导致所有内容都在我们在\
  \ HUD 每个元素上赋予的精确屏幕位置上进行绘制。它们永远不会移动。\n\n在 `LEVELING_UP` 状态下，添加以下高亮代码：\n\n```cpp\n\
  if (state == State::LEVELING_UP)\n{\n    window.draw(spriteGameOver); window.draw(levelUpText);\n\
  }\n```\n\n在 `PAUSED` 状态下，添加以下高亮代码：\n\n```cpp\nif (state == State::PAUSED)\n{\n \
  \   window.draw(pausedText);\n}\n```\n\n在 `GAME_OVER` 状态下，添加以下高亮代码：\n\n```cpp\n\
  if (state == State::GAME_OVER)\n{\n    window.draw(spriteGameOver); window.draw(gameOverText);\
  \ window.draw(scoreText); window.draw(hiScoreText);\n}\n```\n\n现在我们可以运行游戏，并在游戏过程中看到\
  \ HUD 的更新。\n\n![](img/image00281.jpeg)\n\n这显示了主界面/游戏结束界面上的**最高分**和分数：\n\n![](img/image00282.jpeg)\n\
