  \ == Keyboard::Num5) { \n// 升级拾取\nhealthPickup.upgrade(); \nstate = State::PLAYING;\n\
  }\n\nif (event.key.code == Keyboard::Num6) {\n\n// 升级拾取\nammoPickup.upgrade(); \n\
  state = State::PLAYING;\n} \n\nif (state == State::PLAYING) {\n```\n\n现在玩家每清除一波僵尸后就可以升级。然而，我们还无法增加僵尸的数量或关卡的大小。\n\
  \n在 `LEVELING_UP` 状态的下一部分，就在我们刚刚添加的代码之后，修改状态从 `LEVELING_UP` 变为 `PLAYING` 时运行的代码。\n\
  \n这里是完整的代码。我高亮了新添加或稍作修改的行。\n\n添加或修改高亮的代码：\n\n```cpp\nif (event.key.code == Keyboard::Num6)\
  \ {\n\nammoPickup.upgrade(); state = State::PLAYING;\n}\n\nif (state == State::PLAYING)\
  \ {\n\n// 增加波次数\nwave++;\n\n// 准备关卡\n// 我们稍后会修改这两行\narena.width = 500 * wave;\n\
  arena.height = 500 * wave;\n\narena.left = 0; arena.top = 0;\n\n// 通过引用传递顶点数组\n\
