  首先，代码检查粒子系统是否已经在运行。如果没有运行，它会检查当前正在检查的瓦格是否为水瓦格或火瓦格。如果是其中一种，它会检查角色的脚是否接触。当这些每个 `if`\
  \ 语句都为真时，通过调用 `emitParticles` 函数启动粒子系统，并将角色的中心位置作为起始效果的坐标。\n\n## 绘制粒子系统\n\n这是最棒的部分。看绘制\
  \ `ParticleSystem` 有多简单。在检查粒子系统实际上正在运行后，我们将我们的实例直接传递给 `m_Window.draw` 函数。\n\n打开\
