  \n![](img/image00259.jpeg)\n\n### 提示\n\n所有这些对云和蜜蜂的处理看起来有点重复吗？我们将看到如何节省大量的输入工作并使我们的代码更具读性。在\
  \ C++ 中，有方法处理同种类型变量或对象的多个实例。这些被称为**数组（arrays）**，我们将在第 4 章：*循环、数组、Switch、枚举和函数 -\
  \ 实现游戏机制*中学习它们。在项目结束时，一旦我们学习了数组，我们将讨论如何改进我们的云代码。\n\n查看一些与本章主题相关的常见问题。\n\n### FAQ\n\
  \n**Q) 为什么我们要在蜜蜂到达 -100 时将其设置为非活动状态？为什么不直接设为 0 ，因为 0 是窗口的左侧？**\n\n**A)** 蜜蜂的图像宽度为\
  \ 60 像素，原点位于左上角像素。因此，当蜜蜂以原点 `x` 等于零的位置绘制时，整个蜜蜂图像仍然在屏幕上供玩家看到。等待它到达 `-100`，我们可以确保它绝对已经离开了玩家的视野。\n\
  \n**Q) 我怎么知道我的游戏循环有多快？**\n\n**A)** 为了测量这一点，我们还需要学习更多内容。我们将在第 5 章：碰撞、声音和结束条件 - 让游戏可玩中，添加测量和显示当前帧率的能力。\n\
  \n### 总结\n\n在本章中，我们学习了变量是内存中一个命名的存储位置，其中我们可以存储特定类型的值。类型包括 `int`、`float`、`double`、`bool`、`String`\
  \ 和 `char`。\n\n我们可以声明并初始化所需的所有变量来存储游戏数据。一旦有了变量，可以使用算术运算符和赋值运算符对它们进行操作，并在逻辑运算符测试中使用它们。结合\
  \ `if` 和 `else` 关键字使用，我们可以根据游戏中的当前情况对代码进行分支。利用所有这些新知识，我们制作了一些云和蜜蜂的动画。在下一章中，我们将继续使用这些技能添加抬头显示器\
  \ (HUD)，并为玩家添加更多输入选项，以及通过时间条视觉化表示时间。\n\n# 第 3 章. C++ 字符串、SFML 时间、玩家输入和 HUD\n\n在本章中，我们将花费大约一半的时间学习如何处理文本将其显示在屏幕上，另一半时间查看计时以及视觉时间条如何为游戏营造紧迫感。\n\
  \n我们将涵盖以下主题：\n- 暂停和重启游戏\n- C++ 字符串\n- SFML Text 和 SFML 字体类\n- 为 Timber!!! 添加 HUD\n\
  - 为 Timber!!! 添加时间条\n\n## 暂停和重启游戏\n\n随着我们在接下来的三章中继续开发游戏，代码显然会变得越来越长。所以，现在似乎是考虑未来并为我们的代码添加更多结构的好时机。我们将添加这种结构来赋予暂停和重启游戏的能力。\n\
  \n我们将添加代码，使得游戏首次运行时它将处于暂停状态。玩家可以按下 `Enter` 键启动游戏。然后游戏将运行，直到玩家被压扁或时间耗尽。此时，游戏将暂停并等待玩家按下\
  \ `Enter` 键再次重启。\n\n让我们一步步完成设置。首先，在游戏循环之外声明一个新的 `bool` 变量 `paused`，并将其初始化为 `true`：\n\
  \n```cpp\n// 控制时间的变量\nClock clock;\n\n// 跟踪游戏是否正在运行\nbool paused = true;\n```\n\n\
  ```cpp\nwhile (window.isOpen())\n{\n /*****************************************\
  \ 处理玩家输入\n**************************************** */ \n```\n\n现在，每当游戏运行时，我们都有一个\
  \ `true` 的变量 `paused`。接下来，我们将添加另一个 `if` 语句，其表达式将检查 `Enter` 键是否正在被按下。如果正在按下，它会将 `paused`\
  \ 设置为 `false`。在我们之前的其他键盘处理代码之后添加这段高亮代码：\n\n```cpp\n /*****************************************\
  \ 处理玩家输入\n**************************************** */\nif (Keyboard::isKeyPressed(Keyboard::Escape))\n\
  {\n    window.close();\n}\n\n// 启动游戏\nif (Keyboard::isKeyPressed(Keyboard::Return))\
  \ {\n    paused = false;\n}\n```\n\n```cpp\n/*****************************************\
  \ 更新场景\n**************************************** */\n```\n\n现在我们有一个名为 `paused` 的\
  \ `bool` 变量，它初始为 `true`但在玩家按下 `Enter` 键时变为 `false`。此时，我们必须根据 `paused` 的当前任何值让我们的游戏循环做出相应的响应。\n\
  \n我们将这样进行。我们将整个更新部分的代码（包括我们在上一章编写的移动蜜蜂和云的代码）封装在一个 `if` 语句中。\n\n注意，在下一个代码中，`if` 块只有在\
  \ `paused` 不等于 `true` 时才会执行。换句话说，当游戏暂停时，它不会移动/更新。\n\n\n\n这正是我们想要的。仔细观察添加新 `if` 语句的准确位置以及其对应的合大括号\
  \ `{...}`。如果将它们放在错误的位置，程序将无法按预期运行。添加高亮的代码来包裹代码的更新部分，注意接下来显示的上下文。我在几行中添加了 `...` 来表示隐藏的代码。显然\
  \ `...` 并不是真实的代码，不应该添加到游戏中。你可以通过周围未高亮的代码来确定新代码（高亮部分）的起始和结束：\n\n```cpp\n/*\n\n****************************************\n\
  \n更新场景\n\n****************************************\n\n*/\n\nif (!paused) {\n\n \
  \   // 测量时间\n\n    ... ... ...\n\n    // 云是否到达屏幕的右边缘？\n    if (spriteCloud3.getPosition().x\
  \ > 1920)\n    {\n        // 设置准备在下一帧成为一个全新的云 cloud3Active = false;\n    }\n\n}\
  \ // End if(!paused)\n```\n\n```cpp\n/*\n\n****************************************\
  \ 绘制场景\n\n**************************************** */ \n```\n\n注意，当你放置新 `if` 块的结束大括号时，Visual\
  \ Studio 会整齐地调整所有缩进，以保持代码整洁。现在你可以运行游戏，在按下 `Enter` 键之前，一切将保持静态。现在可以开始为我们的游戏添加功能了，我们只需要记住当玩家死亡或时间耗尽时，我们需要将\
  \ `paused` 设置为 `true`。\n\n在上一节中，我们初步接触了 C++ 字符串。我们需要学习更多关于它们的知识，以便实现玩家的 HUD。\n\n\
  ### C++ 字符串\n\n在上一节中，我们简要提到了字符串，并了解到字符串可以包含从单个字符到一整本书的任何字母数字数据。我们还没有查看字符串的声明、初始化或操作。现在我们来做这些吧。\n\
  \n### 声明字符串\n\n声明字符串变量非常简单。我们写出类型，然后是名称：\n\n```cpp\nString levelName;\nString playerName;\n\
  ```\n\n一旦声明了字符串，我们就可以给它赋值。\n\n### 给字符串赋值\n\n给字符串赋值就像给普通变量赋值一样，我们只需要写下名称，然后是赋值运算符，最后是值：\n\
  \n```cpp\nlevelName = \"Dastardly Cave\";\nplayerName = \"John Carmack\";\n```\n\
  \n注意值需要包含在引号中。和普通变量一样，我们也可以在一行内完成声明和赋值：\n\n```cpp\nString score = \"Score = 0\"\
  ;\nString message = \"GAME OVER!!\";\n```\n\n这就是我们如何更改字符串变量的方法。\n\n### 操作字符串\n\n\
  我们可以使用 `#include <sstream>` 指令来为字符串提供一些额外的功能。`sstream` 类允许我们把一些字符串组合在一起。当我们这样做时，这被称为**拼接**：\n\
  \n```cpp\nString part1 = \"Hello \";\nString part2 = \"World\";\nsstream ss;\nss\
  \ << part1 << part2;\n// ss 现在持有 \"Hello World\"\n```\n\n除了使用 `sstream` 对象外，字符串变量甚至可以与不同类型的变量进行拼接。接这段代码开始揭示字符串可能对我们非常有用：\n\
  \n```cpp\nString scoreText = \"Score = \";\nint score = 0;\n// 代码后后部分\nscore ++;\n\
  sstream ss;\nss << scoreText << score;\n// ss 现在持有 \"Score = 1\" \n```\n\n### 提示\n\
  \n`<<` 运算符是一个位运算符运算符。然而，C++ 允许你在类的上下文中编写自己的类并重写特定运算符的作用。`sstream` 类正是这样做，使得 `<<`\
  \ 运算符以现在的方式工作。复杂性隐藏在类中。我们可以使用它的功能而无需担心它是如何工作的。如果你觉得好奇，可以在这里阅读运算符重载：http://www.tutorialspoint.com/cplusplus/cpp_overloading.htm。你不需要更多信息来继续项目。\n\
  \n现在我们掌握了 C++ 字符串的基础知识，以及如何使用 `sstream`，我们可以看到如何使用一些 SFML 类在屏幕上显示它们。\n\n# SFML 文本与字体\n\
  \n在实际向游戏添加代码之前，让我们通过假设代码简要讨论 `Text` 和 `Font` 类。\n\n在屏幕上绘制文本的第一步是拥有字体。在第一章中，我们将字体文件添加到了项目文件夹。现在我们可以将字体加载到\
  \ SFML `Font` 对象中备用。\n\n实现该操作的代码如下：\n\n```cpp\nFont font;\nfont.loadFromFile(\"\
  myfont.ttf\");\n```\n\n在之前的代码中，我们首先声明 `Font` 对象，然后加载实际的字体文件。注意 `myfont.ttf` 是一个假设的字体，我们可以使用项目文件夹中的任何字体。\n\
  \n一旦加载了字体，我们需要一个 SFML `Text` 对象：\n\n```cpp\nText myText;\n```\n\n现在我们可以配置我们的 `Text`\
  \ 对象。这包括大小、颜色、在屏幕上的位置、保存消息的字符串，当然还有将其与我们的 `font` 对象关联：\n\n```cpp\n// 分配实际消息\nmyText.setString(\"\
  Press Enter to start!\");\n// 分配大小\nmyText.setCharacterSize(75);\n// 选择颜色\nmyText.setFillColor(Color::White);\n\
  // 将字体设置为我们的 Text 对象\nmyText.setFont(font);\n```\n\n让我们为 Timber!!! 添加一个 HUD 吧\n\n\
  ### 添加分数和消息\n\n现在我们有了足够的关于字符串、SFML `Text` 和 SFML `Font` 的知识来开始实现 HUD 了。\n\n我们需要做的下一步一件事是在代码顶部添加另一个指令。正如我们学到的，sstream\
  \ 提供了一些非常实用的功能，可以将字符串和其他类型组合成一个字符串。（等等，让我们重新读一下源码：这里的源文本稍微有点乱）。\n\n实际上，我们需要做的下一步一件事是在文件顶部添加另一个指令。添加以下行高亮代码：\n\
  \n```cpp\n#include \"stdx.h\"\n#include <sstream>\n#include <SFML/Graphics.hpp>\n\
  \nusing namespace sf;\n\nint main()\n{\n```\n\n接下来我们将设置 SFML `Text` 对象。其中一个将包含一条消息，我们会根据游戏状态改变，另一个将持有分数并需要定期更新。\n\
  \n声明 `Text` 和 `Font` 对象的后续代码加载字体，将字体分配给 `Text` 对象，然后添加字符串、颜色和大小。这看起来和上一节很眼熟。此外，我们添加了一个名为\
  \ `score` 的新 `int` 变量，我们可以操作它来存储玩家的分数。\n\n```cpp\n// 跟踪游戏是否运行\nbool paused = true;\n\
  \n// 绘制一些文本\nint score = 0;\nsf::Text messageText;\nsf::Text scoreText;\n\n// 我们需要选择一个字体\n\
  Font font;\nfont.loadFromFile(\"fonts/KOMIKAP_.ttf\");\n\n// 将字体设置为我们的消息\nmessageText.setFont(font);\n\
  scoreText.setFont(font);\n\n// 分配实际消息\nmessageText.setString(\"Press Enter to start!\"\
  );\nscoreText.setString(\"Score = 0\");\n\n// 让它变得很大\nmessageText.setCharacterSize(75);\n\
  scoreText.setCharacterSize(100);\n\n// 选择颜色\nmessageText.setFillColor(Color::White);\n\
  scoreText.setFillColor(Color::White);\n```\n\n### 提示\n\n记住，如果你在第 1 章：C++, SFML,\
  \ Visual Studio, 开始第一个游戏中选择了 `KOMIKAP_.ttf` 以外的字体，你将需要更改代码的该部分以匹配 Visual Studio\
  \ Stuff/Projects/Timber/fonts 文件夹中的 `.ttf` 文件。\n\n添加高亮代码，我们就可以准备好更新 HUD 了：\n\n```cpp\n\
  while (window.isOpen()) {\n\n/*\n\n**************************************** 处理玩家输入\n\
  \n**************************************** \n```\n\n接下来的代码看起来可能有点混乱，甚至复杂。然而，当你稍微拆分一下，它其实非常直接。检查并添加新代码，然后我们将过一遍：\n\
  \n```cpp\n// 设置文本位置\nFloatRect textRect = messageText.getLocalBounds();\nmessageText.setOrigin(textRect.left\
  \ + textRect.width / 2.0f,\ntextRect.top +\ntextRect.height / 2.0f);\nmessageText.setPosition(1920\
  \ / 2.0f, 1080 / 2.0f);\n\nscoreText.setPosition(20, 20);\n```\n\n\n\n我们有两个 `Text`\
  \ 类型的对象将要显示在屏幕上。我们希望将 `scoreText` 放置在左上角，并留一点边距。这并不是挑战；我们只需使用 `scoreText.setPosition(20,\
  \ 20)` 即可将其放置在左上角，水平和垂直方向都有 20 个像素的边距。\n\n然而，放置 `messageText` 并不那么简单。我们想把它放置在屏幕的正中央。起初这似乎不是问题，但随后我们记得我们绘制的所有内容的原点都是左上角。因此，如果我们简单地将屏幕宽度和高度除以二并将结果用于\
  \ `messageText.setPosition...`，那么文本的左上角将位于屏幕中心，而文本会向右侧杂乱地延伸。\n\n我们需要一种方法，将 `messageText`\
  \ 的中心设置为屏幕的中心。你刚刚添加的那段看起来有点凌乱的代码将 `messageText` 的原点重新设置为它的中心。为了方便起见，这里再次给出当前讨论的代码：\n\
  \n```cpp\n// Position the text\nFloatRect textRect = messageText.getLocalBounds();\n\
  messageText.setOrigin(textRect.left + textRect.width / 2.0f,\ntextRect.top + textRect.height\
  \ / 2.0f);\n```\n\n首先，在这段代码中，我们声明了一个类型为 `FloatRect` 的新对象，称为 `textRect`。正如名称所示，FloatRect`\
  \ 对象包含一个带有浮点坐标的矩形。\n\n然后，代码使用 `messageText.getLocalBounds` 函数来初始化 `textRect`，使用包裹\
  \ `messageText` 的矩形的坐标。\n\n下一行代码跨越四行（因为它非常长），使用 `messageText.setOrigin` 函数将原点（我们绘制的点）更改为\
  \ `textRect` 的中心。当然，`textRect` 包含一个矩形，它正好匹配包裹 `messageText` 的坐标。然后，执行接下来的行代码：\n\n\
  ```cpp\nmessageText.setPosition(1920 / 2.0f, 1080 / 2.0f);\n```\n\n现在，`messageText`\
  \ 将整齐地放置在屏幕的正中央。每当我们更改 `messageText` 的文本时，我们都会使用这段完全代码，因为更改消息会改变 `messageText` 的大小，所以它的原点需要重新计算。\n\
  \n接下来，我们声明了一个类型为 `stringstream` 的对象对象 `ss`。注意，我们使用了包含命名空间在全名称 `std::stringstream`。我们可以通过在代码文件顶部添加\
  \ `using namespace std` 来避免这种语法。但是，我们没有这样做，因为我们很少使用它。看看这段代码并将其添加到游戏中，然后我们可以更详细地讨论。由于我们只想在游戏未暂停时执行这段代码，请确保像所示将其与其它代码一起添加到\
  \ `if(!paused)` 块中内部：\n\n```cpp\nelse {\n    spriteCloud3.setPosition(\n       \
  \ spriteCloud3.getPosition().x + (cloud3Speed * dt.asSeconds()), spriteCloud3.getPosition().y);\n\
  \    // Has the cloud reached the right hand edge of the screen?\n    if (spriteCloud3.getPosition().x\
  \ > 1920)\n    {\n        // Set it up ready to be a whole new cloud next frame\
  \ cloud3Active = false;\n    }\n}\n// Update the score text\nstd::stringstream ss;\
  \ ss << \"Score = \" << score; scoreText.setString(ss.str());\n// End if(!paused)\n\
  ```\n\n### 绘制场景\n\n我们使用 `ss` 和 `<<` 运算符提供的特殊功能，该运算符将变量连接到 `stringstream` 中。因此，代码\
  \ `ss << \"Score = \" << score` 的效果是创建一个包含 \"Score = \" 和 `score` 的任何值的字符串，并将它们连接在一起。例如，当游戏首次启动时，`score`\
  \ 等于零，因此 `ss` 将持有值 \"Score = 0\"。如果 `score` 发生变化，`ss` 将每帧进行适应。\n\n下一行代码只需将 `ss`\
  \ 中包含的字符串显示/设置到 `scoreText`。\n\n```cpp\nscoreText.setString(ss.str());\n```\n\n\
  现在准备好绘制到屏幕上了。\n\n接下来的代码绘制了两个 `Text` 对象（`scoreText` 和 `messageText`），但注意绘制 `messageText`\
  \ 的代码被封装在一个 `if` 语句中。这个 `if` 语句导致 `messageText` 只在游戏暂停时才绘制。\n\n添加接下来显示的高亮代码：\n\n\
  ```cpp\n// Now draw the insect\nwindow.draw(spriteBee);\n// Draw the score\nwindow.draw(scoreText);\n\
  if (paused)\n{ \n    // Draw our message\n    window.draw(messageText); \n}\n//\
  \ Show everything we just drew\nwindow.display();\n```\n\n我们现在可以运行游戏并看到我们的 HUD 画在屏幕上了。你将看到\
  \ `SCORE = 0` 和 `PRESS ENTER TO START!` 消息。后者会在你按下 `Enter` 键时消失。\n\n![](img/image0026.jpeg)\n\
  \n如果你想看到分数的更新，在 `while(window.isOpen)` 循环的任何地方添加一行临时代码 `score ++`。如果你添加了这行临时代码，你将看到分数增加得很快，非常快！\n\
  \n![](img/image00261.jpeg)\n\n如果你添加了临时代码 `score ++`，请务必在继续之前将其删除。\n\n# 添加时间条\n\n\
  由于时间是游戏中一个至关重要的机制，因此让玩家意识到它的存在是必要的。他需要知道分配的六秒钟是否即将耗尽。当游戏接近结束时，这会带给他一种紧迫感；如果他表现得足够好以维持或增加剩余时间，则会带给他一种成就感。\n\
  \n在屏幕上绘制剩余秒数并不是一种易读的方式（当专注于树枝时），也不是一种实现目标的特别有趣的方法。\n\n我们需要一个时间条。我们的时间条将是一个简单的红色矩形，显著地显示在屏幕上。它开始会很宽，但随着时间的流逝而迅速缩小。当玩家的剩余时间降为零时，时间条将完全消失。\n\
  \n在添加时间条的同时，我们将添加必要的代码来跟踪玩家的剩余时间，并在其耗尽时做出响应。让我们一步步进行。\n\n找到早之前的 `Clock clock;` 声明并添加高亮代码：\n\
  \n```cpp\n// Variables to control time itself\nClock clock;\n// Time bar\nRectangleShape\
  \ timeBar;\nfloat timeBarStartWidth = 400;\nfloat timeBarHeight = 80;\ntimeBar.setSize(Vector2f(timeBarStartWidth,\
  \ timeBarHeight)); timeBar.setFillColor(Color::Red);\ntimeBar.setPosition((1920\
  \ / 2) - timeBarStartWidth / 2, 980);\nTime gameTimeTotal;\nfloat timeRemaining\
  \ = 6.0f;\nfloat timeBarPerSecond = timeBarStartWidth / timeRemaining;\n// Track\
  \ whether the game is running bool paused = true;\n```\n\n首先，我们声明了一个类型为 `RectangleShape`\
  \ 的对象并称之为 `timeBar`。`RectangleShape` 是一个 SFML 类，非常适合绘制简单的矩形。\n\n接下来，我们添加几个浮点变量 `timeBarStartWidth`\
  \ 和 `timeBarHeight`。我们分别将它们初始化为 400 和 80。这些变量将帮助我们跟踪每帧绘制 `timeBar` 需要的大小。\n\n接下来，我们使用\
  \ `timeBar.setSize` 函数设置 `timeBar` 的大小。我们并没有直接传入新的浮点变量。首先，我们创建一个 `Vector2f` 的新对象。然而，这里的不同之处在于我们没有给新对象命名。我们只需用两个浮点变量初始化它，并将其直接传递给\
  \ `setSize` 函数。\n\n`Vector2f` 是包含两个浮点变量的类。它还具有书中将介绍的其他功能。\n\n之后，我们将 `timeBar` 涂成红色。在之前的代码中，我们对\
  \ `timeBar` 做的最后一件事是设置它的位置。y 坐标完全直观，但我们设置 x 坐标的方式稍显复杂。这里是再次计算公式：\n\n(1920 / 2) -\
  \ timeBarStartWidth / 2\n\n代码首先将 1920 除以 2。然后将 `timeBarStartWidth` 除以 2。最后从前者中减去后者。\n\
  \n结果使得 `timeBar` 在屏幕上水平居中。\n\n我们讨论的最后三行代码声明了一个名为 `gameTimeTotal` 的新 `Time` 对象，一个新的浮点数\
  \ `timeRemaining`，它是\n\n\n\n初始化为 6，还有一个听起来很奇怪的浮点数 `timeBarWidthPerSecond`，我们稍后会进一步讨论。\n\
  \n`timeBarWidthPerSecond` 变量初始化为 `timeBarStartWidth` 除以 `timeRemaining`。结果正好是 `timeBar`\
  \ 在游戏每秒钟需要缩短的像素量。当我们在每一帧中调整 `timeBar` 大一时，这将非常有用。\n\n显然，每当玩家开始新游戏时，我们需要重置剩余时间。执行此操作的逻辑位置是按下\
  \ `Enter` 键。我们可以同时将分数置为零。现在通过添加以下高亮代码来实现：\n\n```cpp\n // Start the game\nif (Keyboard::isKeyPressed(Keyboard::Return))\n\
  {\n    paused = false;\n    // Reset the time and the score score = 0;\n    timeRemaining\
  \ = 5;\n}\n```\n\n现在，每一帧我们必须减少剩余时间并相应地调整 `timeBar` 的大小。如下所示，在更新部分添加以下高亮代码：\n\n```cpp\n\
  /*\n****************************************\nUpdate the scene\n****************************************\n\
  */\nif (!paused)\n{\n    // Measure time\n    Time dt = clock.restart();\n    //\
  \ Subtract from the amount of time remaining timeRemaining -= dt.asSeconds();\n\
  \    // size up the time bar\n    timeBar.setSize(Vector2f(timeBarWidthPerSecond\
  \ * timeRemaining, timeBarHeight));\n\n    // Set up the bee\n    if (!beeActive)\
  \ {\n        // How fast is the bee\n        srand((int)time(0) * 10);\n       \
  \ beeSpeed = (rand() % 200) + 200;\n        // How high is the bee\n        srand((int)time(0)\
  \ * 10);\n        float height = (rand() % 1350) + 500; \n        spriteBee.setPosition(2000,\
  \ height); \n        beeActive = true; \n    }\n    else\n// Move the bee\n}\n```\n\
  \n首先，我们通过这段代码减去了上一帧执行所需的时间，从而减少了玩家剩余的时间：\n`timeRemaining -= dt.asSeconds();`\n\n\
  然后，我们通过以下代码调整了 `timeBar` 的大小：\n`timeBar.setSize(Vector2f(timeBarWidthPerSecond *\
  \ timeRemaining, timeBarHeight));`\n\n`Vector2F` 的 `x` 值用 `timebarWidthPerSecond`\
  \ 乘以 `timeRemaining` 进行初始化。这根据玩家剩余的时间长度生成了完全正确的宽度。高度保持不变，`timeBarHeight` 在没有任何处理的情况下直接使用。\n\
  \n当然，我们必须检测时间何时耗尽。目前，我们只需检测时间是否耗尽、暂停游戏并更改 `messageText` 的文本。稍后我们将在这里做更多工作。在我们之前添加的代码之后添加这段高亮代码，我们将详细查看它：\n\
  \n```cpp\n// Measure time\nTime dt = clock.restart();\n// Subtract from the amount\
  \ of time remaining timeRemaining -= dt.asSeconds();\n// resize up the time bar\n\
  timeBar.setSize(Vector2f(timeBarWidthPerSecond * timeRemaining, timeBarHeight));\n\
  \n if (timeRemaining <= 0.0f) {\n    // Pause the game paused = true;\n    // Change\
  \ the message shown to the player messageText.setString(\"Out of time!!\");\n  \
  \  //Reposition the text based on its new size FloatRect textRect = messageText.getLocalBounds();\
  \ \n    messageText.setOrigin(textRect.left + textRect.width / 2.0f, textRect.top\
  \ + textRect.height / 2.0f);\n    messageText.setPosition(1920 / 2.0f, 1080 / 2.0f);\
  \ \n}\n\n// Set up the bee\nif (!beeActive) {\n    // How fast is the bee\n    srand((int)time(0)\
  \ * 10);\n    beeSpeed = (rand() % 200) + 200;\n    // How high is the bee\n   \
  \ srand((int)time(0) * 10);\n    float height = (rand() % 1350) + 500; \n    spriteBee.setPosition(2000,\
  \ height); \n    beeActive = true; \n}\nelse\n// Move the bee\n```\n\n逐步跳过之前的代码：\n\
  \n首先，我们使用 `if(timeRemaining <= 0.0f)` 测试时间是否耗尽。\n\n然后，我们将 `paused` 设置为 `true`，这样这将是我们代码更新部分的最后一次执行（直到玩家再次按下\
  \ `Enter`）。然后，我们更改 `messageText` 的消息，计算其新中心并将其设置为原点，然后将其放置在屏幕中央。\n\n最后，对于这部分代码，我们需要绘制\
  \ `timeBar`。这段代码中没有我们以前见过很多次的新内容。只需注意，我们在树之后绘制 `timeBar`，所以它是可见的。添加以下高亮代码来绘制时间条：\n\
  \n```cpp\n// Draw the score\nwindow.draw(scoreText);\n// Draw the timebar\nwindow.draw(timeBar);\n\
  \n if (paused)\n{\n    // Draw our message\n    window.draw(messageText);\n} \n\n\
  // Show everything we just drew window.display();\n```\n\n现在你可以运行游戏了。按下 `Enter`\
  \ 开始，观察时间条平滑地消失直到消失。\n\n![](img/image00262.jpeg)游戏随后会暂停，并出现 **OUT OF TIME!!** 消息。\n\
  \n![](img/image00263.jpeg)当然，你可以再次按下 Enter 让整个过程从头开始运行。\n\n# 第 4 章 循环、数组、Switch、枚举和函数\
  \ – 实现游戏机制\n\n这一章的 C++ 信息可能比书中任何其他章节都多。它充满了基础概念，将极大地提高我们的理解。它还将开始阐明我们一直稍微跳过的一些模糊区域，例如函数和游戏循环。\n\
  \n一旦我们探索了一整系列 C++ 语言的必要知识，我们将利用所学的一切来让主游戏机制——树枝移动起来。到本章结束时，我们已经准备好进入最后阶段并完成 Timber!!!\
  \ 了！\n\n我们将学习以下主题：\n- 循环\n- 数组\n- 使用 switch 进行决策\n- 枚举\n- 函数入门\n- 创建并移动树枝\n\n##\
  \ 循环\n\n在编程中，我们经常需要多次执行某件事。到目前为止我们看到的的最明显的例子就是我们的游戏循环。剥离所有代码后，我们的游戏循环看起来如下：\n\n\
  ```cpp\nwhile (window.isOpen())\n{\n}\n```\n\n循环有几种不同的类型，我们将查看最常用的。这种循环的正确术语是 `while`\
  \ 循环。\n\n### while 循环\n\n`while` 循环非常直观。回想 `if` 语句及其求值为真或否的表达式。我们可以在 `while` 循环的条件表达式中使用完全相同的运算符和变量组合。\n\
  \n与 `if` 语句一样，如果表达式为真，代码就会执行。然而，比较 `while` 循环的区别在于，内部的 C++ 代码将继续执行，直到条件为假。看这段代码：\n\
  \n```cpp\nint numberOfZombies = 100;\n\nwhile(numberOfZombies > 0) {\n    // Player\
  \ 杀死一个僵尸 numberOfZombies--; \n    // numberOfZombies 在每次通过循环时都会减少 \n}\n// numberOfZbies\
  \ 不再大于 0\n```\n\n这就是在之前的代码中发生的情况。在 `while` 循环之外，声明了 `int numberOfZombies` 并初始化为\
  \ `100`。然后 `while` 循环开始。它的条件表达式是 `numberOfZombies > 0`。因此，`while` 循环将继续循环其体内的代码，直到该条件求值为假。这意味着上面的代码将执行\
  \ 100 次。\n\n在循环的第一次通过中，`numberOfZombies` 等于 `100`，然后是 `99`、`98` 等以此此类推。但一旦 `numberOfOmbies`\
  \ 等于零，它显然就不再大于零了。然后代码将跳出 `while` 循环并在闭大括号之后继续运行。\n\n就像 `if` 语句一样，`while` 循环可能一次都不执行执行。看这个：\n\
  \n```cpp\nint availableCoins = 10;\n\nwhile(availableCoins > 10) {\n    // 这里有更多代码。\n\
  \    // 除非 availableCoins 大于 10，否则不会运行\n} \n```\n\n此外，表达式的复杂性或循环体中可以放置的代码量没有限制。考虑这个游戏循环的假设变体：\n\
  \n```cpp\nint playerLives = 3;\nint alienShips = 10;\n\nwhile(playerLives !=0 &&\
  \ alienShips !=0 )\n{\n    // 处理输入 // 更新场景 // 绘制场景\n} \n\n// 当 playerLives 或 alienShips\
  \ 等于 0 时在此处继续\n```\n\n\n\n之前的 `while` 循环将一直执行，直到 `playerLives` 或 `alienShips` 等于零。一旦这两个其中一个条件满足，表达式将求结果为\
  \ `false`，程序将从 `while` 循环后的第一行代码继续执行。\n\n值得注意的是，一旦进入循环体，它至少会完成一次，即使表达式在执行过程中变为 `false`\
  \ 也是如此，因为在代码尝试开始下一次循环之前，它不会再次进行测试。例如：\n\n```cpp\nint x = 1;\n\nwhile(x > 0)\n{\n\
  \ x--;\n// x is now 0 so the condition is false // But this line still runs\n//\
  \ and this one \n// and me! }\n// Now I'm done!\n```\n\n之前的循环体将执行一次。我们也可以设置一个无限运行的\
  \ `while` 循环，这不而喻地被称为死循环。这里是一个示例：\n\n```cpp\nint y = 0;\n\nwhile(true)\n {\ny++;\
  \ // Bigger... Bigger...\n} \n```\n\n如果你觉得上面的循环很困惑，只需从字面意思理解它。当条件为 `true` 时，循环就会执行。那么，`true`\
  \ 永远是 `true`，因此它会一直执行。\n\n## 跳出 while 循环\n\n我们可能会使用无限循环，以便在循环体内部决定何时退出循环，而不是在表达式中决定。当我们准备好离开循环体时，通过使用\
  \ `break` 关键字来实现。它看起来可能是这样的：\n\n```cpp\nint z = 0;\n\n while(true)\n{\nz++; // Bigger...\
  \ Bigger... break; // No you're not \n// Code doesn't reach here }\n```\n\n你可能也已经猜到，我们可以将任何\
  \ C++ 决策工具（如 `if`、`else` 以及我们很快就会学到的另一个工具 `switch`）结合到我们的 `while` 循环和其他循环类型中。考虑这个示例：\n\
  \n```cpp\nint x = 0;\nint max = 10;\n\nwhile(true) {\nx++; // Bigger... Bigger...\n\
  \nif(x == max)\n {\nbreak;\n} // No you're not \n// code reaches here only until\
  \ x = 10 }\n```\n\n我们可以花很长时间来研究 C++ `while` 循环的各种排列，但在某些时候我们想回到制作游戏上。所以，让我们转向另一种类型的循环。\n\
  \n### for 循环\n\n`for` 循环的语法比 `while` 循环稍微复杂一点，因为设置它需要三个部分。先看代码，然后我们来拆解它：\n\n```cpp\n\
  for(int x = 0; x < 100; x ++)\n{\n// Something that needs to happen 100 times goes\
  \ here }\n```\n\n以下是 `for` 循环条件所有部分的作用。\n\n`for(声明和初始化; 条件; 迭代前的变化)`\n\n为了进一步说明，这里有一个表格解释了在之前的\
  \ `for` 循环示例中出现的三个关键部分。\n\n| 部分 | 描述 |\n| :--- | :--- |\n| 声明和初始化 | 我们创建一个新的 `int`\
  \ 变量 `i` 并将其初始化为 0 |\n| 条件 | 与其他循环一样，它指的是循环执行前必须为真的条件 |\n| 每次通过循环后的变化 | 在示例中，`x\
  \ ++` 意味着每次通过时 `x` 都会增加/递增 1 |\n\n我们可以改变 `for` 循环来完成更多事情。这里是另一个从 10 开始倒数的简单示例：\n\
  \n```cpp\nfor(int i = 10; i > 0; i--)\n{\n// countdown }\n// blast off\n```\n\n\
  `for` 循环接管了初始化、条件求值和控制变量。我们将在本章后续部分的游戏中使用 `for` 循环。\n\n## 数组\n\n如果说变量是一个可以存储特定类型值（如\
  \ `int`、`float` 或 `char`）的盒子，那么我们可以将数组看作一整排盒子。这排盒子可以是几乎任何大小和类型，包括类对象。然而，所有的盒子必须是相同类型。\n\
  \n### 提示\n\n一旦我们在最终项目中学习了更多高级的 C++，在每个盒子中必须使用相同类型的局限性在某种程度上是可以规避的。\n\n这个数组似乎对我们第\
  \ 2 章：*变量、运算符与决策 - 动画精灵* 中的云很有用。那么，我们该如何创建和使用数组呢？\n\n### 声明数组\n\n我们可以这样声明一个 `int`\
  \ 类型变量的数组：\n\n```cpp\nint someInts[10];\n```\n\n现在我们有一个名为 `someInts` 的数组，它可以存储十个\
  \ `int` 值。然而，目前它是空的。\n\n### 初始化数组元素\n\n要向数组元素中添加值，我们可以使用已经熟悉的语法类型，并结合一些新语法，即数组表示法。在接下来的代码中，我们将\
  \ 99 存储在数组的第一个元素：\n\n```cpp\nsomeInts[0] = 99;\n```\n\n要在第二个元素处存储值 999，我们写这段代码：\n\
  \n```cpp\nsomeInts[1] = 999;\n```\n\n我们可以如下所示在最后一个元素处存储值 3：\n\n```cpp\nsomeInts[9]\
  \ = 3;\n```\n\n注意，数组的元素始终从零开始，一直到数组大小减 1。与普通变量类似，我们可以操作数组中存储的值。唯一的区别是我们将使用数组表示法来这样做，尽管我们的数组有一个名称\
  \ `someInts`，但单个元素没有名称。\n\n在接下来的代码中，我们将第一个和第二个元素相加，并将答案存储在第三个元素中：\n\n```cpp\nsomeInts[2]\
  \ = someInts[0] + someInts[1];\n```\n\n数组还可以与普通变量无缝交互，如下例所示：\n\n```cpp\nint a =\
  \ 9999;\nsomeInts[4] = a;\n```\n\n## 快速初始化数组元素\n\n我们可以像这个示例一样使用 `float` 数组快速向元素添加值：\n\
  \n```cpp\nfloat myFloatingPointArray[3] {3.14f, 1.63f, 99.0f};\n```\n\n现在值 3.14、1.63\
  \ 和 99.0 分别存储在第一、第二和第三位置。记住，当使用数组表示法访问这些值时，我们将使用 `[0]`、`[1]` 和 `[2]`。\n\n初始化数组元素的方法。这个稍微抽象的示例展示了使用\
  \ `for` 循环将 0 到 9 的值放入 `uselessArray` 数组中：\n\n```cpp\nfor(int i = 0; i < 10; i++)\n\
  {\n uselessArray[i] = i;\n}\n```\n\n代码假设 `uslessArray` 之前已经初始化以包含至少 10 个 `int` 变量。\n\
  \n## 那么这些数组对我们的游戏到底起什么作用？\n\n我们可以在任何可以使用普通变量的地方使用数组。例如，它们可以用于表达式，如下所示：\n\n```cpp\n\
  // someArray[] 已声明并初始化了 9999 个值\nfor(int i = 0; i < 9999; i++)\n{\n// 对数组中的每个项目进行某些操作\n\
  }\n```\n\n数组在游戏代码中最大的好处在本节的开头已经提到过。数组可以持有对象（类的实例）。假设我们有一个 `Zombie` 类，并且想存储大量的僵尸。我们可以像这个假设的示例那样做：\n\
  \n```cpp\nZombie horde [5] {zombie1, zombie2, zombie3}; // etc...\n```\n\n`horde`\
  \ 数组现在持有大量的 `Zombie` 类实例。每一个每一个都是独立的、活着的（某种意义上）、呼吸的且自主决定的 `Zombie` 对象。然后我们可以遍历 `horde`\
  \ 数组，在每次通过游戏循环时，移动僵尸，检查它们的头部是否被斧头命中，或者它们是否成功抓住了玩家。\n\n\n\n\n当我们根据一组清晰的可能结果列表做出决策，且该列表不涉及复杂的组合或宽范围的数值时，`switch`\
  \ 通常是最佳选择。如下代码所示，我们开始一个 `switch` 决策：\n\n```cpp\nswitch(expression)\n{\n// More code\
  \ here }\n```\n\n在上一个示例中，`expression` 可以是一个实际的表达式，也可以仅仅是一个变量。然后，在大括号内部，我们可以根据表达式的结果或变量的值来做出决策。我们使用\
  \ `case` 和 `break` 关键字来实现这一点：\n\n```cpp\ncase x:\n//code to for x break;\ncase y:\n\
  //code for y break;\n```\n\n你可以从上面的抽象示例中看到，每个 `case` 表示一个可能的结果，而每个 `break` 表示该 `case`\
  \ 的结束以及执行离开 `switch` 块的点。\n\n我们还可以选择性地使用不带值的 `default` 关键字，以便在没有任何 `case` 语句评估为真时运行某些代码。这是一个示例：\n\
  \n```cpp\ndefault: // Look no value\n// Do something here if no other case statements\
  \ are true break;\n```\n\n作为 `switch` 的最后一个且不那么抽象的示例，考虑一个复文字冒险游戏，玩家输入字母如 'n'、'e'、's'\
  \ 或 'w' 来向北、东、南、西移动。可以使用 switch 块来处理玩家的每种可能输入，如下例：\n\n```cpp\n// get input from\
  \ user in a char called command\nswitch(command){\n case 'n':\n// Handle move here\
  \ break;\ncase 'e':\n// Handle move here break;\ncase 's':\n// Handle move here\
  \ break;\ncase 'w':\n// Handle move here break;\n// more possible cases\ndefault:\n\
  // Ask the player to try again break; \n}\n```\n\n理解我们所学的关于 `switch` 所有内容的最佳方式是将将其与其他正在学习的新概念一起付诸实践。\n\
  \n# 类枚举 (Class enumerations)\n\n枚举是逻辑集合中所有可能值的列表。C++ 枚举是列举事物的一种极方法。例如，如果我们的游戏使用的变量只能处于特定范围的值，并且这些值在逻辑上可以形成一个集合或组，那么使用枚举可能是合适的。它们会让你的代码更清晰且更不容易出错。\n\
  \n在 C++ 中，声明一个类枚举使用两个关键字 `enum` 和 `class` 组合使用，后面跟着枚举的名称，然后是枚举可以包含的值，封装在一对大括号 `{...}`\
  \ 中。\n\n作为一个示例，查看这个枚举声明。注意，惯例是将枚举中的所有可能值都写为大写：\n\n```cpp\nenum class zombieTypes\
  \ {REGULAR, RUNNER, CRAWLER, SPITTER, BLOATER };\n```\n\n注意，此时，我们还没有声明 `zombieType`\
  \ 的任何实例，只是该类型本身。如果这听起来很奇怪，可以这样想：SFML 创建了 `Sprite`、`RectangleShape` 和 `RenderWindow`\
  \ 类，但要使用这些任何一个类，我们必须声明该类的对象/实例。\n\n此时，我们创建了一个名为 `zombieTypes` 的新类型，但我们没有它的实例。那么让我们现在创建它们吧：\n\
  \n```cpp\nzombieType dave = zombieTypes::CRAWLER;\nzombieType angela = zombieTypes::SPITTER\n\
  zombieType jose = zombieTypes::BLOATER \n```\n\n/*\n僵尸是虚构生物，与真人的任何相似之处完全属巧合\n*/\n\
  \n接下来是我们将很快添加到 Timber!!! 中的代码类型预告。我们想要跟踪分支或玩家位于树的哪一侧，因此声明一个名为 `side` 的枚举，如下例所示：\n\
  \n```cpp\nenum class side { LEFT, RIGHT, NONE };\n```\n\n我们可以如下所示将玩家放在左侧：\n\n```cpp\n\
  // The player starts on the left\nside playerSide = side::LEFT;\n```\n\n我们可以让分支位置数组（数组从零开始）的第四层完全没有分支，如下：\n\
  \n```cpp\nbranchPositions[3] = side::NONE;\n```\n\n我们也可以在表达式中使用枚举：\n\n```cpp\nif(branchPositions[5]\
  \ == playerSide)\n{\n// 最矮的分支与玩家同一侧 // 被扁了！！\n}\n```\n\n我们将查看另一个重要的 C++ 主题，然后回到编写游戏代码中。\n\
  \n## 函数入门 (Getting started with functions)\n\n那么 C++ 函数到底是什么？函数是变量、表达式和控制流语句（循环和分支）的集合。事实上，到目前为止我们在书中学过的任何代码都可以用于函数。我们编写的函数的第一部分被称为签名\
  \ (signature)。这是一个函数签名的示例：\n\n`public void bombPlayer(int power, int direction)`\n\
  \n如果你添加一对开启和关闭的大括号 `{}` 以及一些函数实际执行的代码，那么我们有一个完整的函数，即定义：\n\n```cpp\nvoid shootLazers(int\
  \ power, int direction)\n{\n// ZAPP!\n}\n```\n\n然后我们可以在代码的另一个部分使用我们的新函数，如下：\n\n\
  ```cpp\n// Attack the player\nbombPlayer(50, 180) // 执行函数中的代码 // 我又回来了 - 函数结束后代码从这里继续执行\n\
  ```\n\n当我们使用函数时，我们说是在**调用** (call) 它。在我们调用 `bombPlayer` 的点上，程序的执行跳转到该函数内部的代码中。函数将一直运行直到到达结束或被要求返回。然后代码将从函数调用后的第一行继续运行。我们已经在使用\
  \ SFML 提供的函数了。这里的不同之处在于，我们将学习编写和调用我们自己的函数。\n\n这是函数的另一个示例，包含了让函数返回到调用它的代码的代码：\n\n\
  ```cpp\nint addAToB(int a, int b)\n{\nint answer = a + b; return answer; \n}\n```\n\
  \n使用上述函数的调用可能如下：\n\n```cpp\nint myAnswer = addAToB(2, 4);\n```\n\n显然，我们不需要编写函数来将两个变量相加，但这个示例有助于我们进一步深入了解函数的原理。首先，我们传入值\
  \ `2` 和 `4`。在函数签名中，值 `2` 被赋值给 `int a`，值 `4` 被赋值给 `int b`。\n\n在函数体内，变量 `a` 和 `b`\
  \ 被相加并用于初始化新变量 `int answer`。`return answer;` 这一行正是这样做。它将存储在 `answer` 中的值返回给调用代码，导致\
  \ `myAnswer` 用值 `6` 初始化。注意上面示例中的每个函数签名略有不同。这是因为 C++ 函数签名非常灵活，允许我们构建确切需要的函数。\n\n\
  函数签名具体如何定义必须如何调用函数，以及函数是否/如何必须返回值，值得进一步讨论。让我们为签名的每个部分取一个名称，以便我们将其拆解并学习它们。\n\n这是一个用正式、技术术语描述其部分的函数签名：\n\
  \n`返回类型 | 函数名称 | (参数)`\n\n以下是我们可以用于这些部分的几个示例：\n- **返回类型**：`bool`、`float`、`int` 等，或任何\
  \ C++ 类型或表达式\n- **函数名称**：`bombPlayer`、`shootLazers`、`setCoordinates`、`addAToB` 等\n\
  - **参数**：`(int number, bool hitDetected)`、`(int x, int y)`、`(float a, float b)`\n\
  \n现在让我们逐查看每个部分。\n\n## 函数返回类型 (Function return types)\n\n返回类型，顾其名，是从函数返回给调用代码的值类型：\n\
  \n```cpp\nint addAToB(int a, int b)\n{\nint answer = a + b; return answer;\n}\n\
  ```\n\n在我们之前稍微有点无味但实用的 `addAtoB` 示例中，签名中的返回类型是 `int`。函数 `addAToB` 向调用它的代码发送或返回一个可以放入\
  \ `int` 变量的值。返回类型可以是我们目前为止见过的任何 C++ 类型，或者是我们尚未见过的类型之一。\n\n\n\n\n\n然而，函数并不一定需要返回值。在这种情况下，签名必须使用\
  \ `void` 关键字作为返回类型。当使用 `void` 关键字时，函数体内部不能尝试返回值，否则会导致错误。但是，它可以使用不带值的 `return` 关键字。以下是一些合法的返回类型与\
  \ `return` 关键字使用的组合示例：\n\n```cpp\nvoid doWhatever()\n{\n  // 我们的代码\n  // 我已经结束了返回到调用代码的操作\
  \ // 这里不需要 return \n}\n```\n\n另一种可能性如下：\n\n```cpp\nvoid doSomethigCool()\n{\n  //\
  \ 我们的代码 // 只要我不尝试添加一个返回值，我就可以这样做； \n}\n```\n\n接下来的代码为我们提供了更多可能的函数示例。请务必阅读注释以及代码：\n\
  \n```cpp\nvoid doYetAnotherThing()\n{\n  // 一些代码\n  if(someCondition) {\n    //\
  \ 如果 someCondition 为真，则返回调用处 // 在函数体结束之前\n    return;\n  }\n  // 可能执行也可能不执行的更多代码\n\
  \  return;\n  // 既然我处于函数体的底部 // 且返回类型是 void，\n  // 我其实没必要这样做，但我想这样做可以 // 明确函数已经结束了。\n\
  }\n\nbool detectCollision(Ship a, Ship b) {\n  // 检测是否发生了碰撞 如果(collision)\n  {\n\
  \    // 砰！！！ 返回 true; }\n  }\n  else\n  {\n    // 错过了\n    return false;\n  } \n\
  }\n```\n\n上面的最后一个函数示例 `detectCollision` 让我们窥见了我们 C++ 代码的未来，并展示了我们也可以将用户定义的类型（称为对象）传递给函数并对其进行计算。\n\
  \n我们可以按顺序调用上面的每个函数：\n\n```cpp\n // 好，该调用某些函数了\ndoWhatever();\ndoSomethingCool();\n\
  doYetAnotherThing();\n\nif (detectCollision(milleniumFalcon, lukesXWing)) {\n  //\
  \ 绝地武士完蛋了！\n  // 但总有莉娅。//除非她在千年夺夺号上？\n}\nelse\n{\n  // 活到下一次战斗\n} \n// 从这里继续代码\n\
  ```\n\n不要担心 `detectCollision` 函数中看起来奇奇怪怪的语法，我们很快就会看到这样的真实代码。简单来说，我们正将返回值（true 或\
  \ false）直接作为 `if` 语句中的表达式。\n\n### 函数名\n\n当我们设计自己的函数时，函数名几乎可以是任何内容。但最好使用单词（通常是动词）来清晰地解释函数将执行什么。例如，看这个函数：\n\
  \n```cpp\nvoid functionaroonieboonie(int blibbityblob, float floppyfloatything)\n\
  { \n  // 代码在此处\n}\n```\n\n上面的写法是完全合法的并且可以运行，但以下这些函数名称要清晰得多：\n\n```cpp\nvoid doSomeVerySpecificTask()\n\
  {\n  // 代码在此处\n}\n\nvoid getMySpaceShipHealth()\n{\n  // 代码在此处\n}\n\nvoid startNewGame()\n\
  {\n  // 代码在此处\n}\n```\n\n接下来，让我们仔细观察我们如何与函数共享某些值。\n\n### 函数参数\n\n我们知道函数可以向调用代码返回结果。如果我们需要从调用代码向函数共享一些数据值该呢？参数允许我们与函数共享值。实际上，在查看返回类型时我们已经见过参数的示例了。我们将更仔细地查看这个同一个示例：\n\
  \n```cpp\nint addAToB(int a, int b)\n{\n  int answer = a + b; return answer;\n}\n\
  ```\n\n在上面，参数是 `int a` 和 `int b`。注意，在函数体的的第一行中，我们使用 `a + b` 就像它们已经是声明并初始化的变量一样。嗯，因为它们确实是。函数签名中的参数是它们的声明，而调用函数的代码初始化了它们。\n\
  \n### 提示\n\n### 重要术语说明\n\n注意，我们将函数签名括号内（`int a, int b`）的变量称为**参数 (parameters)**。当我们从调用代码向函数传递值时，这些值被称为**实参\
  \ (arguments)**。当参数到达时，它们被称为参数，并用于初始化真实的、可用的变量：`int returnedAnswer = addAToB(10,5);`\n\
  \n此外，正如我们在之前的示例中部分看到的，我们并不非要在参数中只使用 `int`。我们可以使用任何 C++ 类型。我们也可以根据需要使用任意数量的参数来解决问题，但将参数列表保持尽可能短且易于管理是一个良好的习惯。正如我们在未来的章节中将看到的，在这个入门教程中我们遗留了一些更酷的函数用法，以便我们在进一步探讨函数主题之前学习相关的\
  \ C++ 概念。\n\n### 函数体\n\n函数体是我们一直通过类似 `// code here`、`// some code` 之类的注释在避开的部分。但实际上，我们已经切切在这里要做什么！到目前为止学过的任何\
  \ C++ 代码都可以在函数体内运行。\n\n## 函数声明\n\n我们已经看到了如何编写函数，也看到了如何调用函数。然而，为了让它们工作，我们还需要做一件事。所有函数都必须有一个**声明\
  \ (prototypes)**。声明是让编译器意识到我们的函数的机制；没有声明，整个游戏将无法编译。幸运的是，声明非常简单。\n\n我们可以简单地重复函数的签名，后面跟一个分号。需要注意的是，声明必须在尝试调用或定义函数之前出现。因此，一个完全可运行函数的最简单示例如下：\n\
  \n```cpp\n // 声明\n// 注意分号\nint addAToB(int a, int b);\n\nint main()\n{\n  // 调用函数\n\
  \  // 将结果存储在 answer 中 int answer = addAToB(2,2);\n  // 在定义之前调用\n  // 但因为有声明，这是没关系的\n\
  \  // 退出 main return 0;\n} // main 结束\n\n// 函数定义 addAToB(int a, int b) {\n\nreturn\
  \ a + b; }\n```\n\n之前的代码演示了：声明在 `main` 函数之前；使用函数的调用正如我们预期的那样，在 `main` 函数内部；定义在 `main`\
  \ 函数之后。\n\n### 注意\n\n注意，当定义发生在函数使用之前，我们可以省略函数声明并直接进入定义。然而，随着我们的代码变得越来越长并分布在多个文件中，这种情况几乎永远不会发生。我们将一直使用独立的声明和定义。\n\
  \n让我们看看如何保持函数的组织良好洁。\n\n### 组织函数\n\n非常值得指出，如果我们有多个函数，特别是当这些函数相当长时，我们的 `.cpp` 文件将迅速变得难以处理。这违背了函数设计初衷的部分目标。我们在下一个项目中看到的解决方案是，我们可以将所有的函数声明添加到我们自己的头文件（`.hpp`\
  \ 或 `.h`）中。然后我们可以在另一个 `.cpp` 文件中编写所有的函数，然后在主 `.cpp` 文件中简单地添加另一个 `#include...` 指令。通过这种方式，我们可以使用任何数量的函数，而无需将它们的任何代码（声明或定义）添加到主代码文件中。\n\
  \n## 函数陷阱！\n\n关于函数的另一个讨论点是**作用域 (scope)**。如果在函数中声明变量（无论是直接还是作为参数之一），那么该变量在函数外部是不可用/见的。此外，任何在函数外部声明的变量都无法在函数内部被看到/使用。\n\
  \n我们在函数代码和调用代码之间共享值的方法是通过参数/实参以及返回值。\n\n当一个变量因来自另一个函数而不可用时，我们称其**超出作用域 (out of scope)**。当它可用且可操作时，我们称它**在作用域内\
  \ (in scope)**。\n\n\n\n\n实际上，在 C++ 中，在任何代码块内声明的变量，其作用域仅限于该块内！这包括循环和 if 块。在 `main`\
  \ 顶部声明的变量在整个 `main` 范围内都有效。在游戏循环中声明的变量其作用域仅限于游戏循环内，依此类推。在函数或其他块内声明的变量被称为 `local`（局部）变量。我们写的代码越多，这一点就越有意义。每当我们在代码中遇到关于作用域的问题时，我都会进行讨论以确保清楚这一点。在下一节中将会出现这样一个问题。而且还有一些更多的\
  \ C++ 基础知识会进一步揭示这个问题，它们被称为 `references`（引用）和 `pointers`（指针），我们分别将在第 7 章：*C++ 引用、精灵图与顶点数组*和第\
  \ 8 章：*指针、标准模板库与纹理管理*中学习它们。\n\n## 关于函数的结语 - 暂时\n\n关于函数，我们还可以学非常多，但目前对它的了解已经足够实现游戏的下一个部分了。如果参数、签名、定义等技术术语还没有完全理解，也不要担心。当我们开始使用它们时，这些概念会变得更加清晰。\n\
  \n## 关于函数的最终结语 - 暂时\n\n你可能已经注意到，我们在调用函数（尤其是 SFML 函数）时，是在对象名之后、函数名之前加上一个句点，如下例所示：\n\
  \n```cpp\nspriteBee.setPosition...\nwindow.draw...\n// 等\n```\n\n然而，在我们整个关于函数的讨论中，我们是在没有任何对象的情况下调用函数的。我们可以将函数作为类的一部分，也可以简单地作为一个独立函数。当我们把函数作为类的一部分编写时，我们需要该类的对象来调用该函数；而当我们有一个独立函数时，则不需要。\n\
  \n我们将在稍后编写一个独立函数，并从第 6 章开始编写带有函数的类：*面向对象编程、类与 SFML 视图*。我们目前为止关于函数的所有知识在这两种情况下都是适用的。\n\
  \n# 延展分支\n\n接下来，正如我在过去十七页中一直承诺的那样，我们将使用所有新的 C++ 技术在我们的树上绘制并移动一些分支。\n\n将此代码添加到 `main`\
  \ 函数之外。为了绝对清楚，我的指的是放在代码 `int main()` 之前：\n\n```cpp\n#include \"stdafx.h\"\n#include\
  \ <sstream>\n#include <SFML/Graphics.hpp>\nusing namespace sf;\n\n// 函数声明\nvoid\
  \ updateBranches(int seed);\nconst int NUM_BRANCHES = 6;\nSprite branches[NUM_BRANCHES];\n\
  \n// 玩家/分支在哪里？\n// 左或右\nenum class side { LEFT, RIGHT, NONE };\nside branchPositions[NUM_BRANCHES];\
  \ \n\nint main()\n{\n```\n\n通过这段新代码，我们实现了很多事情：\n\n首先，我们为一个名为 `updateBranches` 的函数写了一个函数原型。我们可以看到它没有返回值（`void`），并且接受一个名为\
  \ `seed` 的 `int` 参数。我们很快就会编写函数的定义，然后就能看到它的具体作用。接下来，我们声明了一个名为 `NUM_BRANCHES` 的常量\
  \ `int` 并将其初始化为 `6`。树上会有六个移动的分支，我们很快就会看到 `NUM_BRANCHES` 如何对我们有用。\n\n随后，我们声明了一个名为\
  \ `branches` 的 `Sprite` 对象数组，可以容纳六个 `Sprites`。\n\n之后，我们声明了一个名为 `side` 的新枚举，带有三个可能的值：`LEFT`、`RIGHT`\
  \ 和 `NONE`。这将在我们代码中的几处用于描述单个分支以及玩家的位置。\n\n最后，在之前的新代码中，我们初始化了一个类型为 `side` 的数组，大小为\
  \ `NUM_BRANCHES`（`6`）。为了清楚这实现了什么：我们将有一个名为 `branchPositions` 的数组，其中有六个值。这些值中的每一个类型都是\
  \ `side` 类型，可以是 `LEFT`、`RIGHT` 或 `NONE`。\n\n### 注意\n\n当然，你真正想知道的是，为什么这个常量、两个数组和枚举是在\
  \ `main` 函数之外声明的。通过将它们声明在 `main` 之上，它们现在具有全局作用域。或者换句话说，这个常量、两个数组和枚举在整个游戏范围内都有作用域。这意味着我们可以在\
  \ `main` 函数和 `updateBranches` 函数的任何地方访问并使用它们。注意，将所有变量尽可能地设为实际使用处的局部变量是一种良好的做法。将一切都设为全局变量似乎很有用，但这会导致代码难以阅读且容易出错。\n\
  \n## 准备分支\n\n现在我们将准备这六个 `Sprite` 对象并将它们加载到 `branches` 数组中。在我们的游戏循环之前添加高亮代码：\n\n\
  ```cpp\n// 设置文本\nFloatRect textRect = messageText.getLocalBounds();\nmessageText.setOrigin(textRect.left\
  \ + textRect.width / 2.0f,\ntextRect.top + textRect.height / 2.0f);\nmessageText.setPosition(1920\
  \ / 2.0f, 1080 / 2.0f);\nscoreText.setPosition(20, 20);\n\n// 准备 6 个分支\nTexture\
  \ textureBranch;\ntextureBranch.loadFromFile(\"graphics/branch.png\");\n\n// 为每个分支精灵设置纹理\n\
  for (int i = 0; i < NUM_BRANCHES; i++)\n{\n    branches[i].setTexture(textureBranch);\n\
  \    branches[i].setPosition(-2000, -2000);\n    // 设置精灵的原点为中心\n    // 这样我们就可以旋转它\n\
  \    branches[i].setOrigin(220, 20);\n}\n\nwhile (window.isOpen())\n```\n\n之前的代码没有使用任何新概念。首先，我们声明了一个\
  \ SFML `Texture` 对象并将 `branch.png` 图形加载其中。\n\n接下来，我们创建了一个 `for` 循环，将 `i` 设置为零，并在每次循环中将\
  \ `i` 加一，直到 `i` 不再小于 `NUM_BRANCHES`。这正是因为 `NUM_BRANCHES` 是 6，且 `branches` 数组的位置索引是从\
  \ 0 到 5。\n\n在循环内部，我们使用 `setTexture` 为 `branches` 数组中的每个 `Sprite` 设置 `Texture`，然后使用\
  \ `setPosition` 将隐藏在屏幕外。最后，我们使用 `setOrigin` 将原点（绘制时所在的点）设置为精灵的中心。很快，我们将旋转这些精灵，原点在中心意味着它们将旋转得非常自然，而不会导致精灵移位。\n\
  \n## 每帧更新分支精灵\n\n在接下来的代码中，我们根据精灵在 `branches` 数组中的位置以及 `branchPositions` 数组中 `side`\
  \ 的值，设置数组中所有精灵的位置。添加高亮代码并尝试理解它，然后我们就可以详细分析：\n\n```cpp\n// 更新分数文本\nstd::stringstream\
  \ ss;\nss << \"Score: \" << score;\nscoreText.setString(ss.str());\n\n// 更新分支精灵\n\
  for (int i = 0; i < NUM_BRANCHES; i++) {\n    float height = i * 150;\n    if (branchPositions[i]\
  \ == side::LEFT) {\n        // 将精灵移动到左侧\n        branches[i].setPosition(610, height);\n\
  \        // 反向翻转精灵\n        branches[i].setRotation(180);\n    }\n    else if (branchPositions[i]\
  \ == side::RIGHT) {\n        // 将精灵移动到右侧\n        branches[i].setPosition(1330,\
  \ height);\n        // 将旋转设为正常\n        branches[i].setRotation(0);\n    }\n   \
  \ else {\n        // 隐藏分支\n        branches[i].setPosition(3000, height);\n    }\n\
  }\n} // if(!paused) 结束\n\n绘制场景\n\n**************************************** \n\n\
  /*\n\n****************************************\n\n我们刚刚添加的代码是一个大的 `for` 循环，它将 `i`\
  \ 设置为零，每次循环时将 `i` 加 1，直到 `i` 不再小于 6。\n\n在 `for` 循环内部，一个名为 `height` 的新 `float` 变量设置为\
  \ `i * 150`。这意味着第一个分支的高度为 0，第二个为 150，第六个为 750。\n\n接下来，我们有一个 `if` 和 `else` 块的结构。看这个剥离代码后的结构：\n\
  \n```cpp\nif()\n{\n}\nelse if()\n{\n}\nelse\n{\n}\n```\n\n\n\n第一个 `if` 使用 `branchPositions`\
  \ 数组来判断当前分支是否在左侧。如果是，它会将 `branches` 数组中对应的 `Sprite` 设置在屏幕上的某个位置，该位置适用于左侧（610 像素），并能适应当前的高度。然后，它会将该精灵翻转\
  \ 180 度，因为 `branch.png` 图形默认是向右侧悬挂的。\n\n`else if` 仅在分支不在左侧时执行。它使用相同的方法来判断它是否在右侧。如果是，则将分支绘制在右侧（1330\
  \ 像素）。然后将精灵的旋转角度设置为 0 度，以防它之前曾是 180 度。如果 `x` 坐标看起来有点奇怪，请记住，我们将分支精灵的起始点设置在了它们的中心点上。\n\
  \n最后的 `else` 正确地假设当前的 `branchPosition` 必须为 `NONE`，并将分支隐藏在 3000 像素处的屏幕外。\n\n到此为止，我们的树分支已经就位，准备好进行绘制了。\n\
  \n## 绘制分支\n\n在这里，我们使用另一个 `for` 循环，从 0 到 5 遍历整个 `branches` 数组并绘制每个分支精灵。添加以下高亮代码：\n\
  \n```cpp\n // 绘制云\nwindow.draw(spriteCloud1);\nwindow.draw(spriteCloud2);\nwindow.draw(spriteCloud3);\n\
  \n// 绘制分支\nfor (int i = 0; i < NUM_BRANCHES; i++)\n{ \n    window.draw(branches[i]);\n\
  }\n\n// 绘制树\nwindow.draw(spriteTree);\n```\n\n当然，我们还没有编写实际移动所有分支的函数。一旦我们写了该函数，我们还需要确定在何时以及如何调用它。让我们先解决第一个问题并编写该函数。\n\
  \n## 移动分支\n\n我们已经在主函数上方添加了函数原型。现在我们编写该函数的实际定义，它会在每次被调用时将所有分支向下移动一个位置。我们将分两部分编写这个函数，以便更容易观察正在发生什么。\n\
  \n在主函数的右大括号之后添加 `updateBranches` 函数的第一部分：\n\n```cpp\n // 函数定义\nvoid updateBranches(int\
  \ seed)\n{\n// 将所有分支向下移动一个位置对于 (int j = NUM_BRANCHES-1; j > 0; j--) { \n    branchPositions[j]\
  \ = branchPositions[j - 1]; \n}\n}\n```\n\n在函数的第一个部分中，`branchPositions[j] = branchPositions[j\
  \ - 1]` 将分支向下移动。代码中注意注意的点是，我们将位置 4 的分支移动到 3，然后将位置 3 的分支移动到 2，以此此类推。\n\n为了处理这些逻辑，我们在\
  \ `updateBranches` 函数中添加以下代码：\n\n```cpp\nvoid updateBranches(int seed)\n{\n// 将所有分支向下移动\n\
  for (int j = NUM_BRANCHES-1; j > 0; j--) { \n    branchPositions[j] = branchPositions[j\
  \ - 1]; \n}\n\n// 生成新分支\nint r = rand(seed) % 5;\nswitch (r)\n{\n    case 0:\n \
  \       branchPositions[0] = side::LEFT;\n        break;\n    case 1:\n        branchPositions[0]\
  \ = side::RIGHT;\n        break;\n    default:\n        branchPositions[0] = side::NONE;\n\
  \        break;\n}\n```\n\n\n\n\n```cpp\nfloat logSpeedX = 1000;\nfloat logSpeedY\
  \ = -1500;\n```\n\n现在我们可以画出我们所有的新精灵图了。\n\n# 绘制玩家和其他精灵图\n\n在添加用于移动玩家和使用所有新精灵图的代码之前，让我们先画出它们。这样，当我们添加代码来更新/移动精灵图时，我们就能看到发生了什么。添加高亮的代码来绘制四个精灵图：\n\
  \n```cpp\n// 绘制树\nwindow.draw(spriteTree);\n\n// 绘制玩家\nwindow.draw(spritePlayer);\n\
  \n// 绘制斧头\nwindow.draw(spriteAxe);\n\n// 绘制原木\nwindow.draw(spriteLog);\n\n// 绘制墓碑\n\
  window.draw(spriteRIP);\n\n// 绘制蜜蜂\nwindow.draw(spriteBee);\n```\n\n运行游戏，你将在场景中看到我们新的精灵图。![](img/image0265.jpeg)我们现在非常接近一个可以运行的游戏了。\n\
  \n# 处理玩家输入\n\n许多不同的事情都取决于玩家的移动，例如何时显示斧头、何时开始播放原木动画，以及何时移动所有的树枝。为玩家设置键盘处理是有合理的。一旦完成，我们就可以把上述所有功能放入代码的同一部分。让我们思考一下如何检测键盘按键。在每一帧中，我们都测试特定键是否被按下。如果是，我们就采取操作。如果按下\
  \ `Esc` 键，我们就退出游戏；如果按下 `Enter` 键，我们就重启游戏。到目前为止，这已经足够满足我们的需求。\n\n然而，当我们尝试处理砍树时，这种方法存在一个问题。这个问题一直存在，只是直到现在才显现出来。取决于你的电脑性能如何，游戏循环每秒可能会执行数千次。在按住键期间的每一次循环中，它都会被检测到，并执行相关代码。\n\
  \n实际上，每当你按下 `Enter` 重启游戏时，你很可能重启了远多于一百次。这是因为即使是最短暂的按下也会持续一秒钟的很大比例。注意，时间条没有移动。这是因为游戏每秒被重启了数百次甚至数千次。\n\
  \n如果我们不对玩家砍树使用不同的方法，仅仅尝试一次砍击就会在几秒钟的一分之一内让整棵树倒下。我们需要更巧妙的方法。我们将允许玩家砍击；当他砍击时，禁用检测按键的代码。然后我们将检测玩家何时移开按键，然后重新启用按键检测。以下是清晰列出的步骤：\n\
  \n1. 等待玩家使用左键或右键砍树木。\n2. 当玩家砍击时，禁用按键检测。\n3. 等待玩家移开按键。\n4. 重新启用砍击检测。\n5. 从步骤 1 重复。\n\
  \n这听起来可能很复杂，但在 SFML 的帮助下它将非常简单。让我们现在开始实现，一步一步来。添加高亮的代码来声明 `bool` 变量 `acceptInput`，它将用于确定何时何时监听砍击，何时忽略它们：\n\
  \n```cpp\nfloat logSpeedX = 1000;\nfloat logSpeedY = -1500;\n\n// 控制玩家输入\nbool acceptInput\
  \ = false;\n\nwhile (window.isOpen())\n{\n```\n\n现在我们已经设置好了布尔值，可以进入下一步了。\n\n# 处理新游戏的设置\n\
  \n现在我们准备好处理砍击了，在开始新游戏的 `if` 块中添加高亮的代码：\n\n```cpp\n/*\n****************************************\n\
  处理玩家输入\n****************************************\n*/\nif (Keyboard::isKeyPressed(Keyboard::Escape))\n\
  {\n    window.close();\n}\n\n// 开始游戏\nif (Keyboard::isKeyPressed(Keyboard::Return))\n\
  {\n    paused = false;\n    // 重置时间和分值\n    score = 0;\n    timeRemaining = 6;\n\
  \    // 让所有树枝消失\n    for (int i = 1; i < NUM_BRANCHES; i++) {\n        branchPositions[i]\
  \ = side::NONE;\n    }\n    // 确保墓碑被隐藏\n    spriteRIP.setPosition(675, 2000);\n\
  \    // 将玩家移动到位置\n    spritePlayer.setPosition(580, 720);\n    acceptInput = true;\n\
  }\n```\n\n```cpp\n/*\n****************************************\n更新场景\n****************************************\n\
  */\n```\n\n在之前的代码中，我们使用 `for` 循环来设置没有树枝的树。这对玩家来说是公平的，因为如果游戏开始时头顶正上方有一个树枝，这会被认为是不公平的。然后我们只需将墓碑移出屏幕，并将玩家移动到左侧的起始位置。这段新代码最后的一件事是将\
  \ `acceptInput` 设置为 true。我们现在准备好接收砍击按键了。\n\n# 检测玩家砍击\n\n现在我们可以准备处理左、右方向键的按下了。添加这个简单的\
  \ `if` 块，它只在 `acceptInput` 为 true 时执行：\n\n```cpp\n// 开始游戏\nif (Keyboard::isKeyPressed(Keyboard::Return))\n\
  {\n    paused = false;\n    // 重置时间和分值\n    score = 0;\n    timeRemaining = 5;\n\
  \    // 让所有树枝消失\n    for (int i = 1; i < NUM_BRANCHES; i++) {\n        branchPositions[i]\
  \ = side::NONE;\n    }\n    // 确保墓碑被隐藏\n    spriteRIP.setPosition(675, 2000);\n\
  \    // 将玩家移动到位置\n    spritePlayer.setPosition(580, 720);\n    acceptInput = true;\n\
  }\n```\n\n```cpp\n// 封装玩家控制以 // 确保我们正在接受输入\nif (acceptInput)\n{\n    // 此有更多代码...\n\
  }\n```\n\n```cpp\n/*\n****************************************\n更新场景\n****************************************\n\
  */\n```\n\n现在，在我们刚刚编写的 `if` 块内部，添加高亮的代码来处理玩家按下右键时的情况：\n\n```cpp\n// 封装玩家控制以 // 确保我们正在接受输入\n\
  if (Keyboard::isKeyPressed(Keyboard::Right)) {\n    playerSide = side::RIGHT;\n\
  \    score++;\n    // 增加剩余时间\n    timeRemaining += (2 / score) + .15;\n    spriteAxe.setPosition(AXE_POSITION_RIGHT,\
  \ spriteAxe.getPosition().y);\n    spritePlayer.setPosition(1200, 720);\n    updateBranches(score);\n\
  \    logActive = true;\n    acceptInput = false;\n}\n```\n\n```cpp\n// 封装玩家控制以 //\
  \ 确保我们正在接受输入\nif (Keyboard::isKeyPressed(Keyboard::Left)) {\n    playerSide = side::LEFT;\n\
  \    score++;\n    // 增加剩余时间\n    timeRemaining += (2 / score) + .15;\n    spriteAxe.setPosition(AXE_POSITION_LEFT,\
  \ spriteAxe.getPosition().y);\n    spritePlayer.setPosition(1200, 720);\n    updateBranches(score);\n\
  \    logActive = true;\n    acceptInput = false;\n}\n```\n\n\n\n\n最后，`acceptInput`\
  \ 被设置为 `false`。此时，玩家无法再进行砍树动作了。我们已经解决了按键检测过于频繁的问题，很快我们将看到如何重新启用砍树功能。\n\n现在，在我们刚刚编写的\
  \ `if(acceptInput)` 块中，添加高亮的代码来处理玩家按下键盘上的左方向键（`←`）时发生的情况：\n\n```cpp\n// Handle the\
  \ left cursor key\nif (Keyboard::isKeyPressed(Keyboard::Left)) {\n    // 确保玩家在左侧\
  \ \n    playerSide = side::LEFT;\n    score++; // 增加剩余时间量\n    timeRemaining +=\
  \ (2 / score) + .15;\n    spriteAxe.setPosition(AXE_POSITION_LEFT, spriteAxe.getPosition().y);\n\
  \    spritePlayer.setPosition(580, 720);\n    // 更新树枝\n    updateBranches(score);\n\
  \    // 设置原木飞出\n    spriteLog.setPosition(810, 720); \n    logSpeedX = 5000;\n \
  \   logActive = true; \n    acceptInput = false; \n}\n```\n\n之前的代码与处理右侧砍树的代码相同，区别在于精灵的位置不同，且\
  \ `logSpeedX` 变量被设置为正值，这样原木就会向右侧快速飞去。\n\n## 检测按键释放\n\n为了让上述操作在第一次砍树之后继续有效，我们需要检测玩家释放按键的时，并将\
  \ `acceptInput` 设置回 `true`。\n\n这与我们目前看到的按键处理略有不同。SFML 有两种检测玩家键盘输入的方法。第一种我们已经见过了，它是动态且即时的，正是我们对按键按下做出响应所所需的。\n\
  \n接下来的代码使用了另一种方法。*将*以下高亮代码输入到“Handle the players input”部分的顶部，然后我们来逐一分析：\n\n```cpp\n\
  /*\n****************************************\nHandle the players input\n****************************************\n\
  */\nEvent event;\n\nwhile (window.pollEvent(event))\n{\n    if (event.type == Event::KeyReleased\
  \ && !paused) {\n        // 再次监听按键按下\n        acceptInput = true; \n        // 隐藏斧头\n\
  \        spriteAxe.setPosition(2000, spriteAxe.getPosition().y); \n    }\n}\n\n\
  if (Keyboard::isKeyPressed(Keyboard::Escape)) {\n    window.close(); \n}\n```\n\n\
  首先，我们声明了一个类型为 `Event` 的对象 `event`。然后我们调用 `window.pollEvent` 函数，并传入我们的新对象 `event`。`pollEvent`\
  \ 函数将数据放入 `event` 对象中，它描述了一个操作系统事件。这可以是按键按下、按键释放、鼠标移动、鼠标点击、控制器动作，或者窗口本身发生的事情（例如调整大小等）。\n\
  \n我们之所以将代码封装在 `while` 循环中，是因为队列中可能存储了许多事件。`window.pollEvent` 函数会将它们一个一个加载到 `event`\
  \ 中。在每次循环中，如果我们对当前事件感兴趣就会进行检查，如果是的话就会做出响应。当 `window.pollEvent` 返回 `false` 时，意味着队列中不再有事件，`while`\
  \ 循环将退出。\n\n当按键被释放且游戏未暂停时，`if` 条件 `event.type == Event::KeyReleased && !paused`\
  \ 为 `true`。\n\n在 `if` 块内部，我们将 `acceptInput` 设置回 `true` 并将斧头精灵移到屏幕外。\n\n现在你可以运行游戏，并注视着移动的树木、挥动的斧头和动画玩家了。然而，它并不会压死玩家，而且原木在砍倒后也需要移动。\n\
  \n## 被砍倒的原木和斧头的动画\n\n当玩家砍树时，`logActive` 被设置为 `true`，因此我们可以将代码封装在一个仅在 `logActive`\
  \ 为 `true` 时执行的块中。此外，每次砍树都会将 `logSpeedX` 设置为正或负数，这样原木就能向正确的方向离开树飞而去。\n\n在我们更新树枝精灵之后，添加以下高亮代码：\n\
  \n```cpp\n// update the branch sprites\nfor (int i = 0; i < NUM_BRANCHES; i++)\n\
  {\n    float height = i * 150;\n    if (branchPositions[i] == side::LEFT) {\n  \
  \      // 将精灵移动到左侧 \n        branches[i].setPosition(610, height);\n        // 反转精灵方向\n\
  \        branches[i].setRotation(180);\n    }\n    else if (branchPositions[i] ==\
  \ side::RIGHT)\n    {\n        // 将精灵移动到右侧\n        branches[i].setPosition(1330,\
  \ height);\n        // 反转精灵方向\n        branches[i].setRotation(0);\n    }\n    else\
  \ {\n        // 隐藏树枝\n        branches[i].setPosition(3000, height); \n    }\n}\n\
  \n// 处理飞行的原木 \nif (logActive)\n{\n    spriteLog.setPosition(\n        spriteLog.getPosition().x\
  \ + (logSpeedX * dt.asSeconds()),\n        spriteLog.getPosition().y + (logSpeedY\
  \ * dt.asSeconds()));\n    // 原木是否到达右侧边缘？ \n    if (spriteLog.getPosition().x <\
  \ -100 || spriteLog.getPosition().x > 2000)\n    {\n        // 设置好在下一帧准备一个全新的原木\n\
  \        logActive = false;\n        spriteLog.setPosition(810, 720);\n    }\n}\
  \ // End if(!paused)\n```\n\n```cpp\n/*\n****************************************\
  \ Draw the scene\n**************************************** */ \n```\n\n该代码通过 `getPosition()`\
  \ 获取精灵当前的 `x` 和 `y` 位置，然后分别使用 `logSpeedX` 和 `logSpeedY` 乘以 `dt.asSeconds()` 来对其进行累加。\n\
  \n在每帧移动原木后，代码使用一个 `if` 块来检查精灵是否从左侧或右侧消失在视之外。如果是，原木将移回起点，为下一次砍树做准备。\n\n# 处理死亡\n\n\
  每个游戏都得有一个糟糕的结局，要么是玩家时间耗尽（我们已经处理过了），要么是被树枝压死。\n\n检测玩家是否被压死非常简单。我们唯一想知道的是 `branchPositions`\
  \ 数组中的最后一个树枝是否等于 `playerSide`。如果是，玩家就死了。\n\n添加检测此情况的高亮代码，我们将讨论玩家被压死时所做的一切：\n\n```cpp\n\
  if (branchPositions[5] == playerSide) {\n    // 死亡\n    paused = true;\n    acceptInput\
  \ = false;\n    // 绘制墓碑\n    spriteRIP.setPosition(525, 760);\n    // 隐藏玩家\n   \
  \ spritePlayer.setPosition(2000, 660);\n    // 修改消息文本\n    messageText.setString(\"\
  SQUISHED!!\");\n    // 在屏幕上居中\n    FloatRect textRect = messageText.getLocalBounds();\n\
  \    messageText.setOrigin(textRect.left + textRect.width / 2.0f,\n            \
  \              textRect.top + textRect.height / 2.0f);\n    messageText.setPosition(1920\
  \ / 2.0f, 1080 / 2.0f);\n}\n```\n\n这张图片显示了玩家的最终得分和墓碑，以及 **SQUISHED** 消息。(Images/image00267.jpeg)还有一个问题。难道是我一个人的感觉吗，这里有点安静？\n\
  \n 简单的音效\n\n\n\n\n\n我们将添加三个声音。每个声音将在特定的游戏事件时播放：当玩家砍树时，播放一个简单的“咚”声；当玩家时间不足时，播放一个沉闷的失败声；当玩家被压死时，播放一个复古的破碎声。\n\
  \n### SFML 音效是如何工作的？\n\nSFML 使用两个不同的类来播放音效。第一个类是 `SoundBuffer` 类。该类用于存储来自声音文件的实际音频数据。`SoundBuffer`\
  \ 负责将 `.wav` 文件加载到电脑的内存（RAM）中，并转换为无需任何进一步解码工作即可播放的格式。\n\n稍后，当我们编写音效代码时，会发现，一旦我们有了一个存储了声音的\
  \ `SoundBuffer` 对象，我们就会创建另一个类型为 `Sound` 的对象。然后，我们可以将此 `Sound` 对象与 `SoundBuffer`\
  \ 对象关联。接着，在代码的适当时刻，我们就可以调用相应 `Sound` 对象的 `play` 函数。\n\n### 何时播放声音\n\n我们很快就会看到的，加载和播放声音的\
  \ C++ 代码非常简单。然而，我们需要考虑的是何时调用 `play` 函数。在代码的哪个位置放置播放函数的调用？以下是我们想要实现的一些功能：\n\n* 砍树声可以通过左键和右方向键的按下事件来调用\n\
  * 死亡声可以在检测到树木压到玩家的 `if` 块中播放\n* 时间不足声可以在检测到 `timeRemaining` 小于零的 `if` 块中播放\n\n现在我们可以编写声音代码了。\n\
  \n### 添加声音代码\n\n首先，我们添加另一个 `#include` 指令，以使 SFML 相关的类可用。添加以下高亮代码：\n\n```cpp\n#include\
  \ \"stdafx.h\"\n#include <sstream>\n#include <SFML/Graphics.hpp>\n#include <SFML/Audio.hpp>\
  \ \n```\n\nusing namespace sf;\n\n现在我们声明三个不同的 `SoundBuffer` 对象，将三个不同的声音文件加载到它们中，并将三个\
  \ `Sound` 类型的对象与相关的 `SoundBuffer` 对象关联。添加以下高亮代码：\n\n```cpp\n// 控制玩家输入\nbool acceptInput\
  \ = false;\n\n// 准备声音\nSoundBuffer chopBuffer;\nchopBuffer.loadFromFile(\"sound/chop.wav\"\
  );\nSound chop;\nchop.setBuffer(chopBuffer);\n\nSoundBuffer deathBuffer;\ndeathBuffer.loadFromFile(\"\
  sound/death.wav\");\nSound death;\ndeath.setBuffer(deathBuffer);\n\n// 时间不足\nSoundBuffer\
  \ ootBuffer;\nootBuffer.loadFromFile(\"sound/out_of_time.wav\");\nSound outOfTime;\n\
  outOfTime.setBuffer(ootBuffer); \n```\n\nwhile (window.isOpen())\n{\n现在我们可以播放第一个音效了。在检测玩家按下左方向键的\
  \ `if` 块旁边添加所示的单行代码：\n\n```cpp\n// 封装玩家控制以 // 确保我们正在接受输入\nif (acceptInput)\n{\n\
  \    // 接下来这里更多代码...\n    // 首先处理按下右方向键\n    if (Keyboard::isKeyPressed(Keyboard::Right))\
  \ {\n        // 确保玩家在右侧\n        side = side::RIGHT;\n        score++;\n       \
  \ timeRemaining += (2 / score) + .15;\n        spriteAxe.setPosition(AXE_POSITION_RIGHT,\
  \ spriteAxe.getPosition().y);\n        spritePlayer.setPosition(1120, 660);\n  \
  \      // 更新树枝\n        updateBranches(score);\n        // 设置木头向左飞行\n        spriteLog.setPosition(800,\
  \ 600);\n        logSpeedX = -5000;\n        logActive = true; \n        acceptInput\
  \ = false;\n\n        // 播放砍树声\n        chop.play();\n    }\n}\n```\n\n### 提示\n\n\
  在下一个以 `if (Keyboard::isKeyPressed(Keyboard::Left))` 开始的代码块末尾添加完全的代码，以便玩家在树的左侧砍树时产生砍树声。\n\
  \n找到处理玩家时间不足的代码，并添加下所示的高亮代码以播放时间不足相关的音效：\n\n```cpp\nif (timeRemaining <= 0.f) {\n\
  \    // 暂停游戏\n    paused = true;\n    // 更改给玩家显示的消息\n    messageText.setString(\"\
  Out of time!!\");\n    // 根据新大小重新定位文本\n    FloatRect textRect = messageText.getLocalBounds();\n\
  \    messageText.setOrigin(textRect.left + textRect.width / 2.0f,\n    textRect.top\
  \ + textRect.height / 2.0f); \n    messageText.setPosition(1920 / 2.0f, 1080 / 2.0f);\n\
  \n    // 播放时间不足声\n    outOfTime.play();\n}\n```\n\n最后，为了在玩家被压死时播放死亡声，在底部树枝与玩家位于同一侧执行的\
  \ `if` 块中添加高亮代码：\n\n```cpp\n// 玩家是否被树枝压到\nif (branchPositions[5] == playerSide)\n\
  {\n    // 死亡\n    paused = true;\n    acceptInput = false; \n    // 绘制墓碑\n    spriteRIP.setPosition(675,\
  \ 660);\n    // 隐藏玩家\n    spritePlayer.setPosition(2000, 660);\n    messageText.setString(\"\
  SQUISHED!!\");\n    FloatRect textRect = messageText.getLocalBounds();\n    messageText.setOrigin(textRect.left\
  \ + textRect.width / 2.0f,\n    textRect.top + textRect.height / 2.0f);\n    messageText.setPosition(1920\
  \ / 2.0f, 1080 / 2.0f);\n\n    // 播放死亡声\n    death.play();\n}\n```\n\n搞定！我们完成了第一个游戏。在进入第二个项目之前，让我们来讨论一些可能的改进。\n\
