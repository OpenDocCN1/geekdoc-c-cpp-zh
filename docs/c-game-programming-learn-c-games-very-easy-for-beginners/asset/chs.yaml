  \ 设置为 `50`、将所有信息传递给 `player.spawn` 并重启 `clock`。\n\n现在我们有了一个实际生成的玩家对象，它能够感知环境并对按键做出响应。我们现在可以在每次循环通过时更新场景。\n\
