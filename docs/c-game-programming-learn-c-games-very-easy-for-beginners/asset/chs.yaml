  \ Bob 行走的平台\n- 瓷块 2 是火地块，瓷块 3 是水地块\n- 瓷块 4 你可能需要看得很仔细才能看到它。它有一个白色的正方形轮廓。这是 Thomas\
  \ 和 Bob 必须一起到达的关卡目标。\n\n在我们讨论关卡设计时，请记住这张截图。\n\n我们将这些瓷块数字的组合输入文本文件来设计布局。一个示例会有帮助：\n\
