  - `shoot.wav`: 射击声\n- `splat.wav`: 僵尸被子弹击中的声音\n\n## 将资源添加到项目\n\n一旦你决定了将使用哪些资源，就是将它们添加到项目中的时候。接下来的说明假设你正在使用书中提供的资源：\n\
