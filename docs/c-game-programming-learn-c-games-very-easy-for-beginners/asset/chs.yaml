  \ score += 10;\nif (score >= hiScore)\n{\nhiScore = score;\n}\nnumZombiesAlive--;\n\
  // 当所有僵尸都死亡时（再次）if (numZombiesAlive == 0)\n{\n\n}\n}// 僵尸被击中的结束 \nstate = State::LEVELING_UP;\
  \ }\n}\n}\n}\n```\n\n在下一节中，我们将再次看到所有的僵尸和子弹碰撞检测代码。我们将分步进行以便讨论。首先，注意嵌套 `for` 循环的结构（去掉了代码内容），如下：\n\
  \n```cpp\n // 碰撞检测\n// 有没有僵尸被击中？\nfor (int i = 0; i < 100; i++)\n{\nfor (int j =\
  \ 0; j < numZombies; j++) {\n... ... ...\n}\n} \n```\n\n代码会遍历每一个僵尸（0 到 < `numZombies`）的每一个子弹（0\
