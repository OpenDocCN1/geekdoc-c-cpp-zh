  1111111111000111111222222221111133111111111411\n0000000000000000001222222221000133100000001110\n\
  0000000000000000001222222221000133100000000000\n0000000000000000001222222221000133100000000000\n\
  000000000000000000111111111100011110000000000000\n```\n\n之前的代码对应的关卡布局如下：\n\n![](img/image00299.jpeg)\n\
  \n注意，为了得到上一个截图所示的视图，我必须缩小 `View`。此外，截图经过了裁剪。关卡的实际开始部分看起来像下面的截图：\n\n![](img/image00300.jpeg)\n\
  \n向你展示这些截图的作用有两点。首先，你可以看到如何使用简单且免费的文本编辑器快速构建关卡设计。\n\n### 提示\n\n只需确保你使用等宽字体，这样所有数字的大小都相同。这使得关卡设计变得容易得多。\n\
  \n其次，截图展示了设计的游戏性方面。从关卡的左侧到右侧，Thomas 和 Bob 首先需要跳过一个小洞，否则他们会掉进死亡（重新生成）。然后他们有一大片火区域需要穿越。对于\
  \ Bob 来说，跳过那么多瓷块实际上是不可能的。玩家需要合作才能解决方案。Bob 越过火地块的唯一方法是站在 Thomas 的头顶并从那里跳起，如下截图所示：\n\
  \n![](img/image00301.jpeg)\n\n之后到达目标并进入下一关就非常简单了。\n\n### 提示\n\n我强烈鼓励你完成这一章，然后花些时间设计你自己的关卡。\n\
  \n我包含了一些关卡设计来帮助你开始。它们位于第 12 章中添加到项目的 `levels` 文件夹中，*抽象与代码管理 - 更好地利用 OOP*。\n\n接下来是游戏的一些缩小视图，以及一张关卡设计代码的截图。代码截图可能比复制实际文本内容更有用。如果你确实想看代码，只需打开\
  \ `levels` 文件夹中的文件即可。\n\n代码看起来是这样的：\n\n这是之前的代码将产生的关卡布局：\n\n![](img/image00302.jpeg)\n\
  这个关卡我在第 12 章 *抽象与代码管理 - 更好地利用 OOP* 中提到的“信心一跃”关卡：\n\n我强调了平台，因为它们在缩小后的截图中并不清晰：\n\n\
  ![](img/image00303.jpeg)\n\n提供的设计非常简单。然而，游戏引擎能够处理非常大的设计。你可以自由发挥想象力，并构建一些非常大且难以完成的关卡。\n\
  \n当然，在我们学习如何加载它们并将文本转换为可玩关卡之前，这些设计将不会产生任何作用。此外，在我们实现碰撞检测之前，无法站在任何平台上。\n\n首先，让我们处理关卡设计的加载。\n\
  \n# 构建 LevelManager 类\n\n我们需要几个阶段的代码来让我们的关卡设计工作。我们将完成的第一工作是编写 `LevelManager` 头文件。这将允许我们查看并讨论\
  \ `LevelManager` 类中的成员变量和函数。\n\n接下来，我们将编写 `LevelManager.cpp` 文件，其中将包含所有的函数定义。由于这是一个长文件，我们将它分成几个部分进行编写和讨论。\n\
  \n一旦 `LevelManager` 类完成，我们把其实例添加到游戏引擎（`Engine` 类）中。我们还会为 `Engine` 类添加一个新函数 `loadLevel`，我们可以在需要新关卡时从\
  \ `update` 函数调用它。`loadLevel` 函数不仅会使用 `LevelManager` 实例加载相应的关卡，还会处理玩家角色生成和准备时钟等方面。\n\
  \n正如已经提到的，让我们通过编写 `LevelManager.h` 文件来概览 `LevelManager`。\n\n## 编写 LevelManager.h\n\
  \n在解决方案管理器中右键点击**头文件**并选择**添加** | **新建项...**。在**添加新建项**窗口中，选中（左单击）**头文件（**.h**)**，然后在**名称**字段中输入\
  \ `LevelManager.h`。最后，点击**添加**按钮。我们现在准备好编写 `LevelManager` 类的头文件了。\n\n添加以下包含指令和私有变量，然后我们将讨论它们：\n\
  \n```cpp\n#pragma once\n\n #include <SFML/Graphics.hpp>\n\nusing namespace sf;\n\
  \nusing namespace std;\n\nclass LevelManager\n\n{\n\nprivate:\n\nVector2i m_LevelSize;\
  \ Vector2f m_StartPosition; float m_TimeModifier = 1; float m_BaseTimeLimit = 0;\
  \ int m_CurrentLevel = 0; const int NUM_LEVELS = 4; \n\n// 公共声明放在在这里\n```\n\n\n\
  代码声明了 `Vector2i m_LevelSize` 来存储两个整数值，这两个值将存储当前地图包含水平和垂直网格的数量。`Vector2f m_StartPosition`\
  \ 包含了 Bob 和 Thomas 应该生成的世界坐标。请注意，这不是一个与 `m_LevelSize` 单位相关的网格位置，而是关卡中的水平和垂直像素位置。\n\
  \n`m_TimeModifier` 成员变量是一个浮点数，将用于乘以当前关卡的可用时间。我们想要这样做的原因是，通过改变（减少）这个值，当玩家每次尝试同一个关卡时都会缩短可用时间。例如，如果玩家第一次尝试第\
  \ 1 关获得 60 秒，那么 60 乘以 1 显然是 60。当玩家完成所有关卡并第二次回到第 1 关时，`m_TimeModifier` 将减少 10%。然后，当可用时间乘以\
  \ 0.9 时，玩家的可用时间变为 54 秒。这比 60 秒少了 10%。游戏将变得越来越难。\n\n浮点变量 `m_BaseTimeLimit` 存储了我们刚刚讨论的原始、未修改的时间限制。\n\
  \n你可能已经猜到 `m_CurrentLevel` 将存储当前正在玩的关卡编号。\n\n常量 `int NUM_LEVELS` 将被用于标记何时适合再次回到第\
  \ 1 关并减少 `m_TimeModifier` 的值。\n\n现在，添加以下公共变量和函数声明：\n\n```cpp\npublic:\n\nconst int\
  \ TILE_SIZE = 50;\n\nconst int VERTS_IN_QUAD = 4;\n\nfloat getTimeLimit();\n\nVector2f\
  \ getStartPosition();\n\nint** nextLevel(VertexArray& rVaLevel);\n\nVector2i getLevelSize();\n\
  \nint getCurrentLevel();\n\n};\n```\n\n在之前的代码中，有两个常量 `int` 成员。`TILE_SIZE` 是一个实用的常量，提醒我们精灵表中的每个网格宽五十\
  \ 像素、高五十 像素。`VERTS_IN_QUAD` 是一个实用的常量，让我们对 `VertexArray` 的操作更不容易出错。事实上，一个四边形（quad）有四个顶点。现在我们不会忘记它了。\n\
  \n`getTimeLimit`、`getStartPosition`、`getLevelSize` 和 `getCurrentLevel` 函数是简单的 getter\
  \ 函数，它们返回我们在之前的代码块中声明的私有成员变量的当前值。\n\n值得密切关注的函数是 `nextLevel`。该函数接收一个 `VertexArray`\
  \ 引用，就像我们在 Zombie Arena 游戏中使用的那样。该函数可以对 `VertexArray` 进行操作，所有的更改都会反映在调用代码的 `VertexArray`\
  \ 中。`nextLevel` 函数返回一个指向指针的指针，这意味着我们可以返回一个指向 `int` 值二维数组第一个元素的地址。我们将构建一个 `int` 值的二维数组，用于表示每个关卡的布局。当然，这些\
  \ `int` 值将从关卡设计文本文件中读取。\n\n## 编写 LevelManager.cpp 文件\n\n在**解决方案管理器**（Solution Explorer）中右键点击**源文件**（Source\
  \ Files），选择**添加** | **新建项...**。在**新建项**窗口中，点击（通过左键点击）高亮 **C++ 文件 (.cpp)**，然后在**名称**\
  \ 字段中输入 `LevelManager.cpp`。最后，点击**添加** 按钮。我们现在准备好为 `LevelManager` 类编写 .cpp 文件了。\n\
  \n由于这是一个相当长的类，我们将将其分成六部分进行讨论。前五部分将涵盖 `nextLevel` 函数，第六部分涵盖其余部分。\n\n添加以下包含指令和 `nextLevel`\
  \ 函数的第一部分（共五部分）：\n\n```cpp\n#include \"stdafx.h\"\n\n#include <SFML/Graphics.hpp>\n\
  \n#include <SFML/Audio.hpp>\n\n#include \"TextureHolder.h\"\n\n#include <sstream>\n\
  \n#include <fstream>\n\n#include \"LevelManager.h\"\n\nusing namespace sf; using\
  \ namespace std;\n\nint** LevelManager::nextLevel(VertexArray& rVaLevel) {\n\nm_LevelSize.x\
  \ = 0; m_LevelSize.y = 0;\n\n// 获取下一个关卡\n\nm_CurrentLevel++;\n\nif (m_CurrentLevel\
  \ > NUM_LEVELS) {\n\nm_CurrentLevel = 1; m_TimeModifier -= .1f;\n\n}\n\nswitch (m_CurrentLevel)\n\
  {\ncase 1:\n\nlevelToLoad = \"levels/level1.txt\"; m_StartPosition.x = 100;\n\n\
  m_StartPosition.y = 100;\n\nm_BaseTimeLimit = 30.0f;\nbreak;\n\ncase 2:\n\nlevelToLoad\
  \ = \"levels/level2.txt\"; m_StartPosition.x = 100;\nm_StartPosition.y = 3600;\n\
  m_BaseTimeLimit = 100.0f;\nbreak;\n\ncase 3:\n\nlevelToLoad = \"levels/level3.txt\"\
  ; m_StartPosition.x = 1250;\nm_StartPosition.y = 0;\nm_BaseTimeLimit = 30.0f;\n\
  break;\n\ncase 4:\n\nlevelToLoad = \"levels/level4.txt\"; m_StartPosition.x = 50;\n\
  m_StartPosition.y = 200;\nm_BaseTimeLimit = 50.0f;\nbreak; \n\n}// 结束 switch\n```\n\
  \n在包含指令之后，代码将 `m_LevelSize.x` 和 `m_LevelSize.y` 初始化为零。\n\n接下来，`m_CurrentLevel` 加\
  \ 。随后的 `if` 语句检查 `m_CurrentLevel` 是否大于 `NUM_LEVELS`。如果是，则将 `m_CurrentLevel` 设置回\
  \ 1 并将 `m_TimeModifier` 减少 `.1f`，以缩短所有关卡的允许时间。\n\n代码随后根据 `m_CurrentLevel` 的值进行切换。每个\
  \ `case` 语句初始化文本文件的名称，该文件包含了关卡设计以及 Thomas 和 Bob 的起始位置，以及 `m_BaseTimeLimit`，即该关卡未修改的时间限制。\n\
  \n### 提示\n\n如果你设计了自己的关卡，请在此处添加 `case` 语句和相应的值。此外，编辑 `LevelManager.h` 文件中的 `NUM_LEVELS`\
  \ 常量。\n\n现在按照所示添加 `nextLevel` 函数的第二部分。紧接之前的代码之后添加代码。在添加代码的同时研究代码，以便我们讨论：\n\n```cpp\n\
  ifstream inputFile(levelToLoad);\n\nstring s;\n\n // 统计文件的行数\n\nwhile (getline(inputFile,\
  \ s))\n{ \n\n++m_LevelSize.y;\n\n}\n\n// 存储行的长度\n\nm_LevelSize.x = s.length();\n\
  ```\n\n在刚才编写的（第二部分）代码中，我们声明了一个名为 `inputFile` 的 `ifstream` 对象，它打开了指向 `levelToLoad`\
  \ 中的文件名的流。\n\n代码使用 `getline` 遍历文件的每一行，但没有记录其任何内容。它所做的只是通过增加 `m_LevelSize.y` 来计算行数。在\
  \ `for` 循环之后，关卡的宽度使用 `s.length` 保存在 `m_LevelSize.x` 中。这意味着所有行的长度必须相同，否则我们将遇到麻烦。\n\
  \n到此为止，我们已经知道并将当前关卡的长度和宽度保存在 `m_LevelSize` 中。\n\n现在按照所示添加 `nextLevel` 函数的第三部分。紧接之前的代码之后添加代码。在添加代码的同时研究代码，以便我们讨论：\n\
  \n```cpp\n // 回到文件的开头\n\ninputFile.clear();\n\ninputFile.seekg(0, ios::beg);\n\n\
  // 准备存储文件中 int 值的二维数组 int** arrayLevel = new int*[m_LevelSize.y];\n\nfor (int i\
  \ = 0; i < m_LevelSize.y; ++i)\n\n{ \n\n// 在每个数组元素中添加新数组 arrayLevel[i] = new int[m_LevelSize.x];\
  \ }\n```\n\n首先，我们使用 `clear` 函数清除 `inputFile`。带有参数 `0`, `ios::beg` 的 `seekg` 函数将流重置到第一个字符之前。\n\
  \n接下来，我们声明了一个指向指针的指针 `arrayLevel`。注意这是使用 `new` 关键字在自由存储/堆上完成的。一旦我们初始化了这个二维数组，我们就可以将其地址返回给调用代码，它将一直持续直到我们删除它或游戏关闭。\n\
  \n`for` 从 0 运行到 `m_LevelSize.y -1`。在每次迭代中，它在堆上添加与 `m_LevelSize.x` 值匹配的 `int` 值数组。我们现在有一个完美配置（针对当前关卡）的二维数组。唯一的问题是它是空的。\n\
  \n现在按照所示添加 `nextLevel` 函数的第四部分。紧接之前的代码之后添加代码。在添加代码的同时研究代码，以便我们讨论：\n\n```cpp\n //\
  \ 遍历文件并将所有值存储在二维数组中\n\nstring row;\n\nint y = 0;\n\nwhile (inputFile >> row)\n{\n\
  ```\n\n\n\n\n```cpp\nfor (int x = 0; x < row.length(); x++) { \n    const char val\
  \ = row[x]; \n    arrayLevel[y][x] = atoi(&val); \n}\ny++; }\n\n// 关闭文件 \ninputFile.close();\n\
  ```\n\n首先，代码初始化了一个名为 `row` 的字符串，它每次将存储关卡设计的一行。我们还声明并初始化了一个名为 `y` 的 `int` 变量，帮助我们计算行数。\n\
  \n`while` 循环反复执行，直到 `inputFile` 超过最后一行。在 `while` 循环内部有一个 `for` 循环，它会遍历当前行的每个字符，并将其存储在二维数组\
  \ `arrayLevel` 中。注意，我们通过 `arrayLevel[y][x] =` 准确访问了二维数组中正确的元素。`atoi` 函数将 `char val`\
  \ 转换为 `int`。\n\n这是必要的，因为我们拥有的是 `int` 类型的二维数组，而不是 `char` 类型。\n\n现在如所示添加 `nextLevel`\
  \ 函数的第五部分。将代码紧接在之前的代码之后。在添加代码的同时请仔细研究，以便我们进行讨论：\n\n```cpp\n// 我们正在使用什么原始类型？\nrVaLevel.setPrimitiveType(Quads);\n\
  \n// 设置顶点数组的大小\nrVaLevel.resize(m_LevelSize.x * m_LevelSize.y * VERTS_IN_QUAD);\n\
  \n// 从顶点数组开始开始\nint currentVertex = 0;\n\nfor (int x = 0; x < m_LevelSize.x; x++)\
  \ {\n    for (int y = 0; y < m_LevelSize.y; y++) {\n        // 为当前四边形中的每个顶点\n  \
  \      rVaLevel[currentVertex + 0].position = Vector2f(x * TILE_SIZE, y * TILE_SIZE);\n\
  \        rVaLevel[currentVertex + 1].position = Vector2f((x * TILE_SIZE) + TILE_SIZE,\
  \ y * TILE_SIZE);\n        rVaLevel[currentVertex + 2].position = Vector2f((x *\
  \ TILE_SIZE) + TILE_SIZE, (y * TILE_SIZE) + TILE_SIZE);\n        rVaLevel[currentVertex\
  \ + 3].position = Vector2f((x * TILE_SIZE), (y * TILE_SIZE) + TILE_SIZE); \n\n \
  \       // 我们应该使用精灵集中的哪一个瓦块\n        int verticalOffset = arrayLevel[y][x] * TILE_SIZE;\n\
  \n        rVaLevel[currentVertex + 0].texCoords = Vector2f(0, 0 + verticalOffset);\n\
  \        rVaLevel[currentVertex + 1].texCoords = Vector2f(TILE_SIZE, 0 + verticalOffset);\n\
  \        rVaLevel[currentVertex + 2].texCoords = Vector2f(TILE_SIZE, TILE_SIZE +\
  \ verticalOffset);\n        rVaLevel[currentVertex + 3].texCoords = Vector2f(0,\
  \ TILE_SIZE + verticalOffset);\n\n        // 为下四个顶点准备位置\n        currentVertex =\
  \ currentVertex + VERTS_IN_QUAD; \n    }\n}\n\nreturn arrayLevel;\n} // nextLevel\
  \ 函数结束\n```\n\n尽管这是我们为 `nextLevel` 分的五个部分中最长的一段代码，但它也是最直观的。这是因为我们在 Zombie Arena\
  \ 项目中见过非常相似的代码。发生的情况是，嵌套的 `for` 循环从零循环到关卡的宽度和高度。对于数组中的每个位置，四个顶点被放入 `VertexArray`\
  \ 中，并从精灵集中分配四个纹理坐标。顶点的位置和纹理坐标使用变量 `currentVertex`、常量 `TILE_SIZE` 和常量 `VERTS_IN_QUAD`\
  \ 进行计算。在内层 `for` 循环的每次结束时，`currentVertex` 增加 `VERTS_IN_QUAD`，顺利地移动到下一个瓦块。\n\n关于这个\
  \ `VertexArray` 需要记住的重要点是，它是通过引用传递给 `nextLevel` 的。因此，`VertexArray` 在调用代码中是可。我们将在\
  \ `Engine` 类代码中调用 `nextLevel`。\n\n一旦该函数被调用，`Engine` 类将拥有一个 `VertexArray` 来图形化地表示关卡，以及一个\
  \ `int` 值的二维数组，作为关卡中所有平台和障碍的数值表示。\n\n`LevelManager` 的其余函数都是简单的 get 函数（getter），但请花时间熟悉哪个函数返回哪个\
  \ `private` 值。从 `LevelManager` 类中添加剩余的函数：\n\n```cpp\nVector2i LevelManager::getLevelSize()\
  \ {\n    return m_LevelSize;\n}\n\nint LevelManager::getCurrentLevel() {\n    return\
  \ m_CurrentLevel;\n}\n\nfloat LevelManager::getTimeLimit() {\n    return m_BaseTimeLimit\
  \ * m_TimeModifier;\n}\n\nVector2f LevelManager::getStartPosition() { \n    return\
  \ m_StartPosition; \n}\n```\n\n现在 `LevelManager` 类已经完成，我们可以开始使用它。我们将在 `Engine` 类中编写另一个函数来实现它。\n\
