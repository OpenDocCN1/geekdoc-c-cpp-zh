  \ 超过（打破）最高分，则更改 `hiScore`\n- 将 `numZombiesAlive` 减一\n- 检查所有僵尸是否已死亡（`numZombiesAlive\
  \ == 0`），如果是，将状态更改为 `LEVELING_UP`\n\n这是我们刚刚讨论的 `if(zombies[j].hit())` 内部的代码块：\n\n\
  ```cpp\n // 不仅仅是命中也是击杀\nscore += 10;\nif (score >= hiScore)\n{\nhiScore = score;\
  \ }\nnumZombiesAlive--;\n// 当所有僵尸都死亡时（再次）if (numZombiesAlive == 0)\n{ \nstate =\
  \ State::LEVELING_UP; }\n```\n\n僵尸和子弹已经处理完毕。你可以运行游戏并看到血迹。当然，在我们在下一章实现 HUD 之前，你是看不到分数的。\n\
  \n## 玩家是否被僵尸触碰了？\n\n这段代码比僵尸和子弹的碰撞检测要短且简单。在我们编写之前的代码之后添加显示的代码：\n\n```cpp\n}// 僵尸被击中的结束\n\
