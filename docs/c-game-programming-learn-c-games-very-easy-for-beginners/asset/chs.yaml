  \ \nif (spriteCloud1.getPosition().x > 1920)\n{ \n    // 设置好在下一帧成为全新的云 \n    cloud1Active\
  \ = false;\n}\n```\n\n/*\n**************************************** 绘制场景\n****************************************\
  \ */ \n\n现在我们知道该做什么了，可以为第二和第三朵云复制相同的代码。在第一朵云代码之后，添加这段处理第二第三朵云的高亮代码：\n\n...\n\n```cpp\n\
