  \ Studio 以及开始第一个游戏\n\n欢迎来到《C++ 游戏编程入门》。我不会浪费你的时间，直接让你开启使用 C++ 和 `OpenGL` 驱动的 `SFML`\
  \ 为 PC 编写优秀游戏的旅程。\n\n这是一个相当沉重的第一章，但我们将学习所需的所有内容，以便让我们第一个游戏的第一部分运行起来。以下是本章将涵盖的内容：\n\
  \n- 了解我们将构建的游戏\n- 学习一些 C++++\n- 探索 SFML 及其与 C++ 的关系\n- 查看 Visual Studio 软件，我们将在整书中使用它\n\
  - 设置游戏开发环境\n- 创建可复用的项目模板，这将节省大量时间。为第一个游戏项目 Timber!!! 进行计划和准备\n- 编写书中的第一段 C++ 代码，并制作一个绘制背景的可运行游戏\n\
  \n### 游戏\n我们将逐步学习超快速的 C++ 语言的基础知识，然后将这些新知识付诸实践，因此为我们正在构建的三个游戏添加酷的功能应该是相当容易的\n\n\
  > 提示\n> 如果你在本章的任何内容上遇到困难，请查看章节末尾附近的“处理错误与常见问题”部分。\n\n这些是我们书中的三个项目：\n\n### Timber!!!\n\
  第一个游戏是一个令人上瘾、节奏快的游戏，它是非常成功的 Timberman 的克隆版，可以在 http://store.steampowered.com/app/398710/\
  \ 找到。我们的游戏 Timber!!! 将带我们学习所有的 C++ 基础知识。以下是完成完成后我们游戏版本的样子。\n\n![](img/image00238.jpeg)\n\
  \n### Zombie Arena\n接下来，我们将构建一个疯狂的僵尸射击游戏，类似于 9000 Zombies，可以在 http://store.steampowered.com/app/273500/\
  \ 找到。玩家将拥有一把机枪，并击击不断增长的僵尸潮。这一切都将在一个随机生成的滚动世界中进行。为了实现这一点，我们将学习面向对象编程以及它如何使我们能够拥有易于编写和维护的大型代码库（大量代码）。\n\
  \n### Thomas was Late\n第三个游戏将是一个时尚且具有挑战性的益谜平台游戏，可以作为单机和合作游戏。它基于非常热门的游戏 Thomas was\
  \ Alone，可以在 http://store.steampowered.com/app/220780/ 找到。预计将学习如粒子效果、OpenGL 着色器和分屏合作等酷的话题。\n\
  \n![](img/image00240.jpeg)\n\n如果你现在想玩任何游戏，可以从 Runnable Games 文件夹中的下载包中运行。只需双击相应的\
  \ .exe 文件即可。注意，在该文件夹中，你可以运行完成的游戏，也可以运行任何章节中部分完成的游戏。\n\n## 认识 C++\n\n你可能会问，为什么要用\
  \ C++ 了？C++ 速度很快，非常快。之所以这样是因为我们编写的代码被直接翻译成机器可执行指令。这些指令构成了游戏。可执行游戏包含在一个 .exe 文件中，玩家只需双击即可运行。\n\
  \n这个过程有几个步骤。首先，**预处理器**会检查是否有其他代码需要包含在我们的代码中，并在必要时添加它。接下来，所有代码由编译器程序编译成**目标文件**。最后，第三个程序（**链接器**）将所有目标文件连接成可执行文件，这就是我们的游戏。\n\
  \n\n\n\n\n此外，C++ 既非常成熟，又极跟时代。C++ 是一种`object oriented programming`（`OOP`）语言，这意味着我们可以用一种经过证明的方法来编写和组织代码，使我们的游戏高效且易于管理。这种做法的优点以及必要性将随着我们本书的深入而显现出来。\n\
  \n我提到的其他大部分代码都是 SFML，我们稍后就会了解到更多关于 SFML 的知识。刚才提到的预处理器、编译器和链接器程序都是 Visual Studio\
  \ `Integrated Development Environment`（`IDE`）的一部分。\n\n### Microsoft Visual Studio\n\
  \nVisual Studio 隐藏了预处理、编译和链接的复杂性。它将这一切整合在一个按键操作中。此外，它为我们提供了一个流畅的用户界面，供我们输入代码并管理将成为大量代码文件以及其他项目资源。虽然有花费数百美元的\
  \ Visual Studio 高版本，但我们能够使用免费的 Express 版本构建我们的三个游戏。\n\n## SFML\n\n`Simple Fast Media\
  \ Library`（`SFML`）并不是唯一用于游戏和多媒体的 C++ 库。虽然有理由使用其他库，但对我来说，SFML 每次似乎都是最佳选择。首先，它是使用面向对象的\
  \ C++ 编写的。这种方法的优点非常多。随着你阅读此本书，你将体验到其中大部分优点。\n\nSFML 非常易于上手，因此对于初学者来说是一个很好的选择。同时，如果你是专业人士，它也具有构建最高质量\
  \ 2D 游戏的潜力。因此，初学者可以使用 SFML 开始，而不必担心随着经验增长而需要重新学习新的语言/库。\n\n也许最大的优点是，大多数现代 C++ 编程都使用\
  \ OOP。我读过的每一本 C++ 初学者指南都会使用并教授 OOP。事实上，OOP 是几乎所有语言编程的未来（也是现在）。所以，如果你是从零开始学习 C++\
  \ 的，又何要用其他方式呢？\n\nSFML 针对你在 2D 游戏中可能想做的任何操作都提供了相应的模块（代码）。SFML 使用 `OpenGL` 工作，`OpenGL`\
  \ 也可以制作 3D 游戏。当你希望游戏运行在多个平台上时，`OpenGL` 是游戏领域事实上的免费可用图形库。当你使用 SFML 时，你就自动在使用 `OpenGL`\
  \ 了。\n\nSFML 大幅简化了：\n- 2D 图形和动画，包括滚动的游戏世界。\n- 音效和音乐播放，包括高质量的定向音效。\n- 在线多人功能\n- 相同的代码可以在所有主要的桌面操作系统上编译和链接，很快也可以在移动端运行！\n\
  \n广泛的研究表明，还没有发现比这更适合构建 PC 2D 游戏的方法，即使对于专家开发者也是如此，特别是如果你是一个初学者并想在有趣的游戏环境中学习 C++ 的话。\n\
  \n### 设置开发环境\n\n现在你对我们将如何制作这些游戏有了进一步的了解，是时候设置开发环境以便我们开始编写代码了。\n\n### 那么 Mac 和 Linux\
  \ 呢？\n\n我们制作的游戏可以构建并在 Windows、Mac 和 Linux 上运行！我们使用的代码在每个版本中都是相同的。然而，每个版本确实需要在其目标平台上进行编译和链接，而\
  \ Visual Studio 无法为 Mac 和 Linux 提供帮助。\n\n如果说这本书完全适用于 Mac 和 Linux 用户（尤其是完全的初学者），那可能是不够公平的。不过，我想，如果你是一个热心的\
  \ Mac 或 Linux 用户，并且对你的操作系统很熟悉，那么你将的绝大多数额外挑战将出现在开发环境、SFML 以及第一个项目的初始设置中。\n\n为此，我非常推荐以下教程，它们可能会替代接下来的\
  \ 10 页（大约），直到“规划 Timber !!!”章节，届时这本书再次适用于所有的操作系统。\n\n对于 Linux，请阅读此链接获取概述：`http://www.sfmldev.org/tutorials/2.0/start-linux.php`。\n\
  对于 Linux，请阅读此获取步骤指导：`http://en.sfmldev.org/forums/index.php?topic=9808.0`。\n在 Mac\
  \ 上，请阅读此教程以及链接的文章：`http://www.edparrish.net/common/sfml-.osx.html`。\n\n### 在桌上安装\
  \ Visual Studio Express 2015\n\n安装 Visual Studio 几乎就像下载文件并点击几个按钮一样简单。然而，如果我们仔细仔细过一遍具体的执行方法，将对我们很有帮助。因此，我将一步步介绍安装过程。\n\
  \nMicrosoft Visual Studio 网站显示你需要 5 GB 的硬盘空间。然而，根据经验，我建议你至少需要 10 GB 的空闲空间。此外，这些数字略显模糊。如果你计划在副硬盘上安装它，你仍然需要在主硬盘上至少留出\
  \ 5 GB，因为无论你选择将 Visual Studio 安装在哪里，它都需要这个空间。\n\n### 注意事项\n\n总结一下这种模糊的情况：如果你打算将\
  \ Visual Studio 安装在主硬盘上，那么主硬盘上拥有完整的 10 GB 空间是关重要的。另一方面，确保主硬盘上有 5 GB，同时副硬盘上有 10 GB。\n\
  \n1. 你首先需要一个 Microsoft 账户。如果你有 Hotmail 或 MSN 邮箱地址，你已经有一个了。如果没有，你可以注册一个免费的：`https://login.live.com/`。\n\
  2. 访问此链接：`https://www.visualstudio.com/en-us/downloads/download-vs.aspx`。点击 `Visual\
  \ Studio 2015`，然后点击 `Express 2015 for desktop`，然后点击 `Downloads` 按钮。下面的截图显示三个点击位置：\n\
  ```\nImages/image00241.jpg\n```\n3. 等待短暂下载完成后运行下载的文件。现在你只需要按照屏幕上的指示操作。但请注意你选择安装\
  \ Visual Studio 的文件夹。如果你想和我操作得完全一样，请在你偏好的硬盘上创建一个名为 `Visual Studio 2015` 的新文件夹并安装在此。\n\
  4. 当你看到下一个屏幕时，点击 `Launch` 并输入你的 Microsoft 账户登录详情。\n```\nImages/image00242.jpg\n\
  ```\n现在我们可以转向 SFML 了。\n\n### 设置 SFML\n\n这个简短教程将引导你下载 SFML 文件，使我们能够包含库中的功能。此外，我们将看到如何使用\
  \ SFML DLL 文件，它们将使我们编译后的对象代码与 SFML 一起运行：\n\n1. 访问 SFML 网站上的此链接：`http://www.sfmldev.org/download.php`。点击所示所示\
  \ `Latest stable version` 按钮。\n```\nImages/image00243.jpg\n```\n2. 当你阅读此指南时，最新版本几乎肯定已经更改了。只要你正确执行下一步，这并不重要。我们要下载适用于\
  \ `Visual C++ 2014` 的 32 位版本。这听起来可能违反直觉，因为我们刚刚安装了 Visual Studio 2015，而且你可能（最常见的情况下）有一台\
  \ 64 位的 PC。我们选择此下载的原因是因为 Visual C++ 2014 是 Visual Studio 2015 的一部分（Visual Studio\
  \ 提供的不仅仅是 C++），我们将以 32 位构建游戏，以便它们可以在 32 位和 64 位的机器上运行。明确一下，点击以下下载：\n```\nImages/image00244.jpg\n\
  ```\n\n\n\n\n3. 下载完成后，请在安装 Visual Studio 的同一驱动器根目录下创建一个文件夹，并命名为 `SFML`。同时，在安装 Visual\
  \ Studio 的驱动器根目录下也创建另一个文件夹，命名为 `Visual Studio Stuff`。我们将所有与 Visual Studio 相关的内容都存储在这里，所以\
  \ `Visual Studio Stuff` 似乎是个不错的名字。为了清晰起见，这里是我执行完此步骤后硬盘的状况：\n\n4. 显然，截图高亮显示的三个文件夹之间你拥有的文件夹可能与我的完全不同。现在我们已经为即将创建的所有项目做好准备了，在\
  \ `Visual Studio Stuff` 内部创建一个新文件夹。将新文件夹命名为 `Projects`。\n\n5. 最后，解压 SFML 下载包。在桌面上执行此操作。解压完成后，你可以删除\
  \ zip 文件夹。你的桌面上只会剩下一个文件夹。它的名称将反映你下载的 SFML 版本。我的文件夹名为 `SFML-2.3.2-windowsvc14-32-bit`。你的文件名可能反映更近的版本。双击此文件夹查看内容，然后再次双击进入下一个文件夹（我的叫\
  \ `SFML-2.3.2`）。接下来的截图显示了当我选中整个 `SFML-2.3.2` 文件夹内容时的样子。你的应该也一样。\n\n6. 如上一张截图所示，复制此文件夹的所有内容，并将所有内容粘贴/拖到你在步骤\
  \ 3 中创建的 `SFML` 文件夹中。在本书书的剩余部分，我将简单地把该文件夹称为你的 SFML 文件夹。\n\n现在我们准备好在 Visual Studio\
  \ 中开始 C++ 和 SFML 了。\n\n### 创建可用的项目模板\n\n由于设置项目是一个相当繁琐的过程，我们将创建一个项目并将其保存为 Visual\
  \ Studio 模板。这将在我们每次开始一个新游戏时节省大量工作。所以，如果你觉得接下来的教程有点枯燥，请放心，你永远再也不需要这样做了：\n\n1. 启动\
  \ Visual Studio，在**新建项目**（New Project）窗口中，点击 `Visual C++` 旁的小下拉箭头显示更多选项，然后点击 `Win32,`，并点击\
  \ `Win32 Console Application`。你可以在下一张截图看到所有这些选择。\n\n![](img/image00245.jpeg)\n\n\
  2. 现在，在**新建项目**窗口的底部，在 `Name:` 字段中输入 `HelloSFML`。\n\n3. 接下来，浏览到我们在上一个教程中创建的 `Visual\
  \ Studio Stuff\\Projects\\` 文件夹。这将是我们所有项目文件存放的位置。所有模板都基于实际项目。因此，我们将有一个名为 `HelloSFML`\
  \ 的项目，但我们对它做的唯一事情是用它创建一个模板。\n\n4. 完成上述步骤后，点击**确定**（OK）。下一张截图显示了**应用程序设置**（Application\
  \ Settings）窗口。勾选**控制应用程序**（Console application）框，并按所示保留其他选项。\n\n![](img/image00246.jpeg)\n\
  \n5. 点击**完成**（Finish），Visual Studio 将创建新项目。\n\n6. 接下来，我们将添加一些复杂且重要的项目设置。这是辛苦的部分，但由于我们要创建一个模板，所以只需要做一次。我们需要做的是告诉\
  \ Visual Studio，或者更具体地告诉 Visual Studio 部分的代码编译器，去哪里寻找来自 SFML 的特殊类型代码文件。我指的这种特殊类型文件是头文件（header\
  \ file）。头文件是定义 SFML 代码格式的文件。这样当我们使用 SFML 代码时，编译器就如何如何处理它。注意，头文件与主源代码文件不同，它们包含在扩展名为\
  \ `.hpp` 的文件中（当我们最终在第二个项目中开始添加自己的头文件时，这一切会变得更加清晰）。此外，我们需要告诉 Visual Studio 在哪里可以找到\
  \ SFML 库文件。从 Visual Studio 主菜单选择 `Project | HelloSFML properties`。\n\n7. 在生成的 **HelloSFML\
  \ 属性页**（HelloSFML Property Pages）窗口中，执行下一张截图所示标记的步骤。\n\n8. 从 `Configuration:` 下拉菜单中选择**所有配置**（All\
  \ Configurations）。\n\n9. 从左侧菜单选择 `C/C++` 然后是**常规**（General）。\n\n10. 找到**附加包含目录**（Additional\
  \ Include Directories）编辑框，输入你的 SFML 文件夹所在的驱动器号，后接 `\\SFML\\include`。如果你将 SFML 文件夹位于\
  \ D 盘，要输入的完整路径如截图所示：`D:\\SFML\\include`。如果你将 SFML 安装在不同的驱动器，请更改你的路径。\n\n![](img/image00247.jpeg)\n\
  \n11. 点击**应用**（Apply）以保存目前的所有配置。\n\n12. 现在，仍在同一窗口中，执行接下来的步骤，再次如下一张截图所示标记。选择 `链接器`（Linker）然后是**常规**（General）。\n\
  \n13. 找到**附加库目录**（Additional Library Directories）编辑框，输入你的 SFML 文件夹所在的驱动器号，后接 `\\\
  SFML\\lib`。如果你将 SFML 文件夹位于 D 盘，要输入的完整路径如截图所示为 `D:\\SFML\\lib`。如果你将 SFML 安装在不同的驱动器，请更改你的路径。\n\
  \n14. 点击**应用**（Apply）以保存目前的所有配置。\n\n15. 最后在此阶段，仍在同一窗口中，执行这些步骤，再次参考下一张截图。将 `Configuration:`\
  \ 下拉菜单(1) 切换到 `Debug`，因为我们将在 Debug 模式下运行和测试游戏。\n\n16. 选择 `链接器`（Linker）然后是**输入**（Input）。\n\
  \n17. 找到**附加依赖**（Additional Dependencies）编辑框 (3) 并点击其右侧。现在复制并粘贴/输入以下内容：\n```\nsfml-graphics.lib;sfml-window.lib;sfml-system.lib;sfml-network.lib;sfml-audio.lib\n\
  ```\n\n18. 点击**确定**（OK）。\n\n19. 让我们为 HelloSFML 项目创建一个模板，这样我们就再也不需要完成这个有点枯燥的任务了。创建项目模板非常简单。在\
  \ Visual Studio 中选择 `File | Export Template...`（文件 | 导出模板...）。然后在**导出模板向导**（Export\
  \ Template Wizard）窗口中，确保选择了**项目模板**（Project template）选项，然后在**从哪个项目要创建模板**（From which\
  \ project do you want to create a template）选项中选择 `HelloSFML` 项目。\n\n20. 点击**下一步**（Next）然后点击**完成**（Finish）。呼，就是这样！下次我们创建项目时，我会教你如何从这个模板来创建。现在让我们构建\
  \ Timber 吧！！！\n\n## 规划 Timber！！！\n\n每当你做一个游戏时，最好用纸笔开始。如果你不知道游戏在屏幕上具体如何运作，又怎么用代码来实现它呢？\n\
  \n### 小贴士\n\n此时，如果你还没有这样做，我建议你去看看 Timberman 运行的视频，这样你就能看到我们的目标是什么。如果你觉得预算可以负担得，就买一份来玩玩。它在\
  \ Steam 上经常促销不到 1 美元。\n\nhttp://store.steampowered.com/app/398710/\n\n定义游戏性的游戏特性和对象被称为**机制**（mechanics）。游戏的基本机制是：\n\
  \n- 时间始终在耗尽。\n- 通过砍树获得更多时间。\n- 砍树会导致树枝掉落。\n- 玩家必须避开掉下的树枝。\n- 重复此过程，直到时间耗尽或玩家被压扁。\n\
  \n要求你在现阶段规划 C++ 代码显然有点傻。这当然是这本 C++ 初学者指南的第一章。然而，我们可以查看一下我们将要使用的所有资源，以及让我们的 C++ 按照我们的意愿运行所需的概览。\n\
  \n看一张带有注释的游戏截图：\n\n![](img/image00248.jpeg)你可以看到我们拥有以下功能：\n\n\n\n\n\n**玩家当前得分：**\
  \ 玩家每砍一次木头，就会获得一分。他可以使用左箭头或右箭头来砍击木头。\n\n**玩家角色：** 玩家每次砍击时，都会移动或停留在树的同一侧。因此，玩家必须小心选择在向一侧砍击。当玩家砍击时，玩家角色手中会出现一个简单的斧头图形。\n\
  \n**不断缩短的时间条：** 玩家每次砍击，不断缩短的时间条就会增加一小段时间。\n\n**致命树枝：** 玩家砍得越快，获得的时间就越多，但树枝向下向下移动的速度也越快，因此被压扁的可能性越大。树枝随机生成在树顶，并随着每次砍击向下移动。当玩家被压扁时（这种情况经常发生），会出现一个墓碑的图形。\n\
  \n**被砍掉的木头：** 当玩家砍击时，一个被砍掉的木头图形会飞离玩家。\n\n画面上有三朵浮云会以随机的高度和速度漂浮，还有一只只负责飞来飞去的蜜蜂。这一切发生在一个漂亮的背景上。\n\
  \n简而言之，玩家必须疯狂砍击以得分并避免时间耗尽。作为一个略带反讽但有趣的后果，他砍得越快，被压扁的可能性就越大。\n\n我们现在知道了游戏的外观、如何玩，以及游戏机制背后的动力。我们可以开始构建它了。\n\
  \n## 从模板创建项目\n\n创建新项目现在变得极其简单。只需在 Visual Studio 中遵循这些直观的步骤即可：\n\n1. 从主菜单选择 `File`（文件）\
  \ | `New Project`（新建项目）。\n2. 确保左侧菜单中选择了 `Visual C++`，然后从显示的选项列表中选择 `HelloSFML`。接下来的截图会让这一点变得清晰。\n\
  \n![](img/image0024.jpeg)\n3. 在 `Name:` 字段中输入 `Timber`并确保勾选了 `Create directory for\
  \ solution`（为解决方案创建目录）选项。点击 `OK`。\n4. 现在我们需要将 SFML 的 `.dll` 文件复制到主项目目录。我的主项目目录是\
  \ `D:\\Visual Studio Stuff\\Projects\\Timber\\Timber`。它是 Visual Studio 在上一步中创建的。如果你将\
  \ Projects 文件夹放在其他地方，请在该处执行此步骤。我们需要复制到项目文件夹中的文件位于你的 `SFML\\bin` 文件夹中。为这两个位置各打开一个窗口，并像下一张截图左侧所示突出所需的文件。\n\
  \n![](img/image00250.jpeg)\n5. 现在将突出显示的文件粘贴到上一个截图右侧的项目文件夹中。\n\n项目现在已设置好并准备就绪。你将能够看到接下来的截图所示的屏幕。我对截图进行了注释，以便你开始熟悉\
  \ Visual Studio。我们很快会回到这些区域以及其他区域。\n\n![](img/image00251.jpeg)\n\n你的布局可能与截图略有不同，因为\
  \ Visual Studio 的窗口像大多数应用程序一样是可以自定义的。花点时间找到右侧的 `Solution Explorer`（解决方案资源管理器）窗口，并调整其内容清晰可见，就像上一个截图所示。\n\
  \n我们很快就会回到这里开始编码。\n\n## 项目资产\n\n资产是你制作游戏时需要的任何东西。在我们的案例中，资产包括：\n\n- 用于屏幕文字的字体\n\
  - 针对不同动作的音效，如砍击、死亡和时间耗尽\n- 角色、背景、树枝和其他游戏对象的图形\n\n游戏所需的所有图形和声音都包含在下载包中。你可以分别在 `Chapter\
  \ 1/graphics` 和 `Chapter 1/sound` 文件夹中找到。\n\n所需的字体未提供。这是我想避免在许可方面任何可能的歧义。这不会引起问题，因为我会向你展示具体在何处以及如何选择和下载字体。\n\
  \n虽然我会提供资产本身或获取这些资产的信息，但你可能喜欢自己创建并获取它们。\n\n### 外包资产\n\n有很多网站允许你聘用艺术家、音频工程师甚至程序员。其中最大的网站之一是\
  \ `www.upwork.com`。你可以免费加入该网站并发布你的任务。你需要对你的需求编写清晰的说明，并说明你准备支付的金额。然后，你可能会收到一些优秀的承包者竞标完成这项工作。请注意，有很多不合格的承包者，他们的工作可能会令人失望，但如果你选择得当，你很可能会找到一个胜任、热情且极具性价比的人员或公司来完成工作。\n\
  \n### 制作自己的音效\n\n可以从 `www.freesound.org` 等网站免费下载音效，但如果你销售游戏，许可证通常不允许你使用它们。另一个选项是使用来自\
  \ `www.bfxr.net` 的名为 `BFXR` 的开源软件，它可以帮助你生成许多不同的音效，你可以保留它们并随心所欲地使用。\n\n### 将资产添加到项目\n\
  \n一旦你决定了将使用哪些资产，就是将它们添加到项目中的时候了。接下来的说明假设你正在使用书籍下载包中提供的所有资产。如果你使用自己的资产，只需使用完全相同的文件名将相应的音频或图形文件替换为你自己的即可。\n\
  \n1. 浏览到 Visual `D:\\Visual Studio Stuff\\Projects\\Timber\\Timber`。\n2. 在此文件夹内创建三个新文件夹并命名为\
  \ `graphics`、`sound` 和 `fonts`。\n3. 从下载包将 `Chapter 1/graphics` 的所有内容复制到 `D:\\Visual\
  \ Studio Stuff\\Projects\\Timber\\Timber`。\n4. 从下载包将 `Chapter 1/sound` 的所有内容复制到\
  \ `D:\\Visual Studio Stuff\\Projects\\Timber\\Timber`。\n5. 现在在浏览器中访问 `http://www.1001freefonts.com/komika_poster.font`\
  \ 并下载 Komika 字体。\n6. 解压下载的内容，并将 `KOMIKAP_.ttf` 文件添加到 `D:\\Visual Studio Stuff\\\
  Projects\\Timber\\Timber\\fonts` 文件夹。\n\n让我们看看这些资产，特别是图形，以便我们更好地可视化在 C++ 代码中使用它们时发生了什么。\n\
  \n### 探索资产\n\n图形资产构成了我们游戏屏幕的各个部分。查看这些图形，你应该知道它们在游戏的何处使用。\n\n![](img/image0252.jpeg)\n\
  \n音频文件均为 `.wav` 格式。这些是我们在游戏特定事件中播放的文件。它们都是使用 `BFXR` 生成的。它们是：\n\n- `chop.wav`: 声音类似于斧头（复古斧头）砍树的声音\n\
  - `death.wav`: 一种类似于复古失败的声音\n- `out_of_time.wav`: 当玩家因时间耗尽而播放，而不是被压扁时\n\n## 理解屏幕和内部坐标\n\
  \n在继续实际的 C++ 编码之前，让我们谈谈坐标。我们在显示器上看到的所有图像由像素组成。像素是微小的光点，组合成我们看到的图像。\n\n有许多不同的显示器分辨率，但例如，一个典型的游戏显示器水平可能有\
  \ 1920 个像素，垂直可能有 1080 个像素。\n\n像素从屏幕左上角开始编号。正如下一个图所示，我们的 1920 x 1080 示例在水平 (x) 轴上从\
  \ 0 数到 1919，在垂直 (y) 轴上从 0 数到 1079。\n\n![](img/image0253.jpeg)\n\n\n\n\n因此，可以通过 x\
  \ 和 y 坐标确定特定的精确的屏幕位置。我们通过在屏幕上的特定位置绘制背景、角色、子弹和文本等游戏对象来创建游戏。这些位置是由像素坐标确定的。请看下面这个假设的示例，展示我们如何在屏幕的大致中心坐标处进行绘图。对于\
  \ 1920 x 1080 的屏幕，该位置将是 960, 540。\n\n![](img/image00254.jpeg)\n\n除了屏幕坐标外，我们的游戏对象也各自拥有一套类似的坐标系。与屏幕坐标系一样，它们的\
  \ `internal` 或 `local` 坐标也从左上角的 0,0 开始。\n\n从上一张截图中可以看到，角色的 0,0 被绘制在屏幕的 960, 540\
  \ 处。\n\n视觉化的 2D 游戏对象，例如角色或可能的僵尸，被称为 `sprite`（精灵）。sprite 通常由图像文件制成。所有 sprite 都有一个所谓的\
  \ `origin`（原点）。\n\n如果在屏幕的特定位置绘制一个 sprite，原点将位于该特定位置。sprite 的 0,0 坐标就是原点。下一张截图演示了这一点。\n\
  \n![](img/image00255.jpeg)\n\n这就是为什么在显示角色绘制到屏幕的截图，尽管我们在中心位置 (960, 540) 绘制了图像，但它看起来又偏右又偏下了一些。\n\
  \n在进行第一个项目中，我们只需要记住它的工作原理即可。\n\n请注意，在现实世界中，玩家有非常多种屏幕分辨率，我们的游戏需要尽可能地兼容这些分辨率。在第二个项目中，我们将看到如何让游戏动态地适应几乎任何分辨率。在第一个项目中，我们需要假设屏幕分辨率为\
  \ 1920 x 1080。如果你的屏幕与此不同，请不要担心，因为我为 Timber!!! 游戏的每一章都提供了一套单独的代码。这些代码文件几乎完全相同，只是在开头附近添加和交换了几行代码。如果你使用的是较低分辨率的屏幕，只需按照书中假设为\
  \ 1920 x 1080 分辨率的代码操作即可，在尝试游戏时，你可以根据情况从第 1 到第 5 章的低分辨率文件夹中复制并粘贴代码文件。事实上，一旦在第一章中添加了额外的行，无论你的屏幕分辨率如何，其余所有代码将是相同的。为了方便起见，我为每一章都提供了低分辨率代码。我们将在第二个项目中讨论这几行代码如何发挥魔法（缩放屏幕）。另一种代码可以在低至\
  \ 960 x 540 的辨率下运行，因此在几乎任何 PC 或笔记本电脑上都能良好。\n\n现在我们可以编写第一段 C++ 代码了，很快就能看到它的运行。\n\n\
  ## 开始编写游戏代码\n\n如果还没有打开 Visual Studio，请打开它；在 Visual Studio 主窗口的 `Recent` 列表中左键点击，打开\
  \ Timber 项目（如果尚未打开）。\n\n我们要做的第一件事是重命名主代码文件。它目前命名为 `HelloSFML.cpp`，将其重命名为更合适的 `Timber.cpp`。`.cpp`\
  \ 代表 C 加加。\n\n1. 在右侧找到 `Solution Explorer`（解决方案管理器）窗口。\n2. 在 `Source Files` 文件夹下找到\
  \ `HelloSFML.cpp` 文件。\n3. 右键点击 `HelloSFML.cpp` 并选择 `Rename`（重命名）。\n4. 将文件名编辑为 `Timber.cpp`\
  \ 并按 `Enter`。\n\n在代码窗口中进行一些微调，使代码与下面显示的完全相同。你可以像使用任何文本编辑器或文字处理程序一样进行操作；如果你愿意，甚至可以复制粘贴。在完成微调后，我们来讨论它们：\n\
  \n```cpp\n // Include important C++ libraries here\n\n#include \"stdafx.h\"\n\n\
  int main()\n\n{ \n\nreturn 0;\n\n}\n```\n\n这个简单的 C++ 程序是一个很好的起点。让我们逐行查看它。\n\n###\
  \ 使用注释使代码更清晰\n\n如你所见，唯一需要更改的代码是最顶部的一点点。第一行代码是：\n\n`// Include important C++ libraries\
  \ here`\n\n任何以 `//` 开头的代码行都是注释，编译器会忽略它们。因此，这行代码不起任何作用。它被用来留出我们日后回来查看代码时可能发现有用的信息。注释在行尾处结束，因此下一行的任何内容都不是注释的一部分。还有另一种类型的注释被称为\
  \ `multi-line`（多行）或 `c-style`（C 风格）注释，可以用于编写占据超过单行的注释。我们将在本章稍些时候看到其中一些。在整书中，我将留下数百条注释来帮助提供上下文并进一步解释代码。\n\
  \n### 包含 Windows 基础要素\n\n现在你已经知道注释的作用，你可能已经能猜出下一行代码的作用。它再次出现在：\n\n`#include \"stdafx.h\"\
  `\n\n`#include` 指令告诉 Visual Studio 在编译之前包含或添加另一个文件的内容。这样做的效果是，当我们运行程序时，某些不是我们自己编写的其他代码将成为程序的一部分。这种从其他文件中代码到我们代码中的过程被称为\
  \ `pre-processing`（预处理），可能意不意外，它是由一个被称为 `pre-processor`（预处理器）的东西执行的。文件扩展名 `.h` 代表头文件（header\
  \ file）。\n\n你可能在想这段代码会做什么？`stdafx.h` 文件本身包含了更多 `#include` 指令。它向我们的程序中添加了在 Windows\
  \ 上运行程序所需的所有代码。我们永远不需要查看这个文件，完全不需要担心里面有什么。我们只需要在我们制作每个游戏顶部添加这行代码即可。\n\n更重要且与我们更相关的、也是值得讨论\
  \ `#include` 指令的原因是，我们将在代码文件的顶部添加更多的 `#include` 指令。这是为了包含我们将使用并花费精力去理解的代码。\n\n我们将包含的主要文件是\
  \ SFML 头文件，它们让我们能够访问所有酷炫的游戏编码功能。我们还将使用 `#include` 来访问 `C++ Standard Library`（C++\
  \ 标准库）头文件。这些头文件让我们能够访问 C++ 语言的核心功能。\n\n已经过了两行了，让我们继续。\n\n### 主函数\n\n我们在代码中看到的下一行是：\n\
  \n`int main()`\n\n代码 `int` 是众所周知的 `type`（类型）。C++ 有许多类型，它们代表不同类型的数据。`int` 是一个 `integer`（整数）或全数。先记住这个点，我们稍后会回来讨论它。\n\
  \n`main()` 代码部分是紧随其代码段的名称。这段代码被标记在左大括号 `{` 和下一个右大括号 `}` 之间。\n\n因此，这些大括号 `{...}`\
  \ 之间的所有内容都是 `main` 的一部分。我们将这样的代码段称为 `function`（函数）。\n\n每个 C++ 程序都有一个 `main` 函数，它是整个程序执行（运行）开始的地方。随着书的进行，最终我们的游戏将会有许多代码文件。然而，永远只会有一个\
  \ `main` 函数，无论我们写什么代码，我们的游戏始终从 `main` 函数左大括号内的第一行代码开始执行。\n\n现在，不要担心跟随函数名 `()` 的那些奇怪括号。我们将在第\
  \ 4 章：*循环、数组、Switch、枚举和函数*——*实现游戏机制*中进一步讨论它们，到那时我们将以一个全新且更有趣的角度来审视函数。\n\n### 展示与语法\n\
  \n再次查看我们的整个 Main 函数：\n\n```cpp\nint main()\n\n {\n\nreturn 0;\n\n}\n```\n\n\n\n\
  我们可以看到 `Main` 内部只有一行代码，`return 0;`。在继续探索这行代码的作用之前，让我们先看看它的呈现方式。这很有用，因为可以帮助我们准备编写易于阅读且能与其他代码部分区分开的代码。\n\
  \n首先注意到 `return 0;` 向右缩进了一个制表符（tab）。这清楚地标记了它是 `main` 函数内部的。随着代码长度的增加，我们将发现对代码进行缩进和留白对于保持可读性至关重要。\n\
  \n接下来，注意行尾的标点符号。分号 `;` 告诉编译器指令结束，紧随其后的任何内容都是一条新指令。我们将由分号终止的指令称为“语句”（statement）。\n\
  \n请注意，编译器不在乎你是否在分号和下一个语句之间留了换行，甚至留了一个空格。然而，如果不为每个语句都开启新行，将导致代码极其难以阅读，而完全遗漏分号将导致语法错误，使得游戏无法编译或运行。\n\
  \n在一起的一段代码，通常通过其缩进与其他部分保持一致来表示，被称为一个“块”（block）。\n\n既然你已经熟悉了 `main` 函数的概念、缩进代码以保持整洁以及在每个语句末加上分号，我们就可以继续去寻找\
  \ `return 0;` 语句究竟是做什么的。\n\n### 从函数返回值\n\n实际上，在我们游戏的语境下，`return 0;` 几乎什么都没做。然而，这个概念是非常重要的。当我们使用\
  \ `return` 关键字时（无论是单独使用还是后跟一个值），它都是指令程序执行跳转/回到最初启动该函数的代码处。\n\n通常，启动函数的代码将是代码中其他地方另一个函数。但在情况下，是操作系统启动了\
  \ `main` 函数。因此，当执行 `return 0;` 这一行时，`main` 函数退出，整个程序结束。\n\n由于我们在 `return` 关键字后有一个\
  \ `0`，该值也会发送给操作系统。我们可以将 0 改为其他值，返回的也将是那个值。\n\n我们说启动函数的代码“调用”（calls）了该函数，而该函数“返回”（returns）了值。\n\
  \n你现在不需要完全掌握所有这些函数的信息。在这里介绍一下是有帮助的。在继续之前，关于函数还有最后一点。还记得 `int Main()` 中的 `int` 吗？它告诉编译器从\
  \ `Main` 返回的值类型必须是 `int`（整数/全数）。我们可以返回任何符合 `int` 定义的值。例如 `0`、`1`、`999`、`6358` 等。如果我们尝试返回一个不是\
  \ `int` 的东西，比如 `12.76`，那么代码将无法编译，游戏也无法运行。\n\n函数可以返回许多不同类型，包括我们自己发明的类型！然而，那种类型必须以我们刚刚看到的方式让编译器感知。\n\
  \n这些关于函数的背景信息将使我们接下来的进展更加顺畅。\n\n### 运行游戏\n\n现在实际上可以运行游戏了。点击 Visual Studio 快速启动栏中的\
  \ `Local Windows Debugger` 按钮，或者你可以使用 `F5` 快捷键。\n\n![](img/image00256.jpeg)\n\n\
  你只会看到黑屏闪烁一下。这个闪烁是 C++ 控制台，我们可以用它来调试我们的游戏。目前我们不需要这样做。正在发生的情况是我们的程序正在启动，从 `Main` 的第一行执行（当然是\
  \ `return 0;`），然后立即退出并回到操作系统。\n\n### 使用 SFML 打开窗口\n\n现在让我们添加一些代码。后续代码将打开一个 Timber!!!\
  \ 最终运行的窗口。该窗口将是 1920 像素宽、1080 像素高，并且为全屏模式（无边框或标题）。\n\n将下方高亮的新代码输入现有代码中，然后我们对其进行检查。在你输入（或复制粘贴）时，尝试弄清楚正在发生什么：\n\
  \n```cpp\n// 在此处包含重要的 C++ 库\n\n#include \"stdafx.h\"\n#include <SFML/Graphics.hpp>\n\
  \n// 使用 \"using namespace\" 让代码编写更简单\n\nusing namespace sf;\n\nint main()\n{\n //\
  \ 创建视频模式对象\nVideoMode vm(1920, 1080);\n// 为游戏创建并打开窗口 \nRenderWindow window(vm, \"\
  Timber!!!\", Style::Fullscreen);\n\nreturn 0; \n}\n```\n\n## #-包含 SFML 特性\n\n我们在新代码中注意到的第一点是另一个（尽管略有不同）#include`\
  \ 指令。`#include <SFML/Graphics.hpp>` 告诉预处理器包含我们在设置项目时创建的 `SFML` 文件夹中的 `Graphics.hpp`\
  \ 文件内容。\n\n所以这行代码作用是添加上述文件的代码，使我们能够访问 SFML 的某些功能。具体如何实现这一点，在我们开始编写自己的独立代码文件并使用 `#include`\
  \ 使用它们时将变得更加清晰。\n\n### 注意事项\n\n如果你好奇预处理器指令之间的区别，即文件名包含在这样的 `<filename.hpp>` 和 `\"\
  filename.h\"` 中，`<...>` 用于包含我们文件夹结构中的文件，例如 SFML 文件或我们编写的任何内容。`\"...\"` 用于 Visual\
  \ Studio 自带的文件。此外，`.hpp` 文件扩展名只是更面向 C++ 的 `.h` 文件，后者更像是 C 风格的扩展名。两种样式和两种文件扩展名最终的效果完全相同，并在我们的游戏中都能良好运行。\n\
  \n目前重要的是，我们有 SFML 提供的一系列新功能可供使用。下一行新代码是 `using namespace sf;`。我们将在几行之后回来讨论这一行的作用。\n\
  \n## OOP、类、对象\n\n随着书籍的深入，我们将更充分地讨论 OOP、类和对象。以下是简要介绍，以便我们理解正在发生的情况。\n\n我们已经知道 OOP\
  \ 代表面向对象编程（object-oriented programming）。OOP 是一种编程范式，一种编码方式。OOP 在全球编程界、几乎每种语言中都被公认为是编写代码的最佳（如果不是唯一的）专业方式。\n\
  \nOOP 引入了许多编码概念，但所有这些概念的基础都是“类”（classes）和“对象”（objects）。当我们编写代码时，只要可能，我们希望编写可重用的代码。我们实现这一点的方法是将代码结构化为一个`class`（class）。我们将在第\
  \ 6 章：*面向对象编程、类与 SFML 视图*中学习如何这样做。\n\n目前关于类我们只需要知道，一旦我们编写了 `class`，我们并不仅仅是将该代码作为游戏的一部分执行，而是从该\
  \ `class` 中创建可用的对象。\n\n例如，如果我们想要一百个僵尸“非玩家角色 (NPCs)”，我们可以仔细地设计并编写一个名为 `Zombie` 的类，然后从这一个类中创建任意数量的僵尸对象。每一个僵尸对象都具有相同的功能和内部数据类型，但每个僵尸对象都是独立且不同的实体。\n\
  \n进一步扩展这个假设的僵尸例子，但不显示 `Zombie` 类的任何代码，我们可能会基于 `Zombie` 类创建一个新对象：\n\n```cpp\nZombie\
  \ z1;\n```\n\n对象 `z1` 现在是一个完全编码且功能完备的 `Zombie` 对象。我们可以这样做：\n\n```cpp\nZombie z2;\
  \ Zombie z3; Zombie z4; Zombie z5;\n```\n\n\n\n我们现在有了五个独立的僵尸，但它们都基于一个经过精心编写的类（class）。在回到刚刚编写的代码之前，让我们再进一步一步。我们的僵尸既可以包含行为（由函数定义），也可以包含可能代表诸如僵尸血量、速度、位置或移动方向等的数据。例如，我们可以编写\
  \ `Zombie` 类以便使用我们的僵尸对象，可能如下所示：\n\n```cpp\nz1.attack(player);\nz2.growl();\nz3.headExplode();\n\
  ```\n\n### 注意事项\n再次提醒，目前所有这些僵尸代码都是假设性的。不要在 Visual Studio 中输入这些代码；它们只会产生一堆错误。\n\n\
  我们将设计这个类，以便能够以最合适的方式使用数据和行为来适应我们的游戏目标。例如，我们可以设计该类，以便在创建每个僵尸对象时，为该对象的数据赋值。\n\n也许我们需要在创建每个僵尸时，为它们分配一个唯一的名称和以米/秒为的速度。对\
  \ `Zombie` 类进行仔细的编码可以让我们写出这样的代码：\n\n```cpp\n // Dave 在感染前是一个 100 米奥运冠军 // 他的移动速度是每秒\
  \ 10 米\nZombie z1(\"Dave\", 10);\n\n// Gill 在感染前双条腿都被吃掉了 // 她以每秒 0.01 米的速度拖行\nZombie\
  \ z2(\"Gill\", .01); \n```\n\n关键点在于，类具有几乎无限的灵活性，一旦我们编写了类，就可以通过从它们创建对象来使用它们。正是通过类以及我们从类中创建的对象，我们才能利用\
  \ SFML 的力量。是的，我们还将编写自己的类，包括一个 `Zombie` 类。\n\n让我们回到刚刚编写的真实代码。\n\n### 使用命名空间 sf\n\
  在我们继续仔细观察 `VideoMode` 和 `RenderWindow` 之前（正如你可能猜到的，它们是 SFML 提供的类），我们将学习学习 `using\
  \ namespace sf;` 这行代码的作用。\n\n当我们创建一个类时，我们是在一个命名空间（namespace）中创建它的。这样做是为了将我们的类与其他编写的类区分开来。考虑\
  \ `VideoMode` 类，在 Windows 这样的环境中，完全可能已经有人写了一个名为 `VideoMode` 的类。通过使用命名空间，我们以及 SFML\
  \ 的程序员可以确保类的名称永远不会冲突。\n\n使用 `VideoMode` 类的完整方式如下：\n\n`sf::VideoMode...`\n\n`using\
  \ namespace sf;` 代码允许我们省略代码中任何地方的 `sf::` 前缀。如果没有它，光是这个简单的游戏就有 100 多个 `sf::` 实例了。它也让我们的代码更易读、也更简短。\n\
  \n### SFML VideoMode 和 RenderWindow\n在 `Main` 函数内部，我们现在有两个新的注释和两行新的实际代码。第一行实际代码是：\n\
  \n```cpp\nVideoMode vm(1920, 1080);\n```\n\n这段代码从 `VideoMode` 类创建了一个名为 `vm` 的对象，并设置了\
  \ `1920` 和 `1080` 这两个内部值。这些值代表玩家屏幕的分辨率。\n\n下一行代码是：\n\n```cpp\nRenderWindow window(vm,\
  \ \"Timber!!!\", Style::Fullscreen);\n```\n\n在上一行代码中，我们正在从 SFML 提供的类 `RenderWindow`\
  \ 创建一个名为 `window` 的新对象。此外，我们还在我们的窗口对象内部设置了一些值。\n\n首先，`vm` 对象被用于初始化窗口的一部分。起初这可能看起来很困惑。但请记住，类可以像其创建者所希望的那样多样和灵活。而且是的，某些类可以包含其他类。\n\
  \n### 提示\n在目前阶段，没有必要完全理解它是如何运作的，只要你理解这个概念即可。我们编写一个类，然后从该类创建可用的对象。这就像建筑师可能会画一张蓝图。你当然不能把所有的家具、孩子和狗都搬进蓝图里；但你可以根据蓝图建造一栋房子（或许多栋房子）。在这个类比中，类就像是蓝图，而对象就像是房子。\n\
  \n接下来，我们使用值 `Timber!!!` 给窗口命名。我们使用使用预定义值 `Style::FullScreen` 让我们的窗口对象设为全屏模式。\n\n\
  ### 提示\n`Style::FullScreen` 是 SFML 中定义的一个值。它的用处是让我们不需要记住内部代码中用于表示全屏的整数数字。这种值的编程术语称为常量（constant）。常量以及它们在\
  \ C++ 中的近亲——变量将在下一章中介绍。\n\n让我们看看我们的窗口对象运行起来。\n\n### 运行游戏\n此时你可以再次运行游戏了。你会看到一个较大的黑屏闪烁一下然后消失。这就是我们刚刚编写的\
  \ `1920 x 1080` 全屏窗口。遗憾，仍然发生的情况是我们的程序启动，从 `Main` 的第一行开始执行，创建了酷的新窗口，然后返回 `0;` 并立即退出回到操作系统。\n\
  \n## 主游戏循环\n我们需要一种方法让程序保持运行，直到玩家想要退出。同时，随着我们 `Timber!!!` 的进展，我们应该清楚地标记出代码不同部分将放在哪里。此外，如果我们阻止游戏退出，最好为玩家提供一个他们准备好时退出的方法。否则，游戏将永远进行！\n\
  \n将高亮的代码添加到现有代码中，然后我们将进行检查并讨论：\n\n```cpp\nint main()\n{\n    // 创建视频模式 VideoMode\
  \ vm(1920, 1080);\n    // 为游戏创建并打开窗口\n    RenderWindow window(vm, \"Timber!!!\"\
  , Style::Fullscreen);\n\n    while (window.isOpen()) {\n        /*\n        ****************************************\n\
  \        处理玩家输入\n        ****************************************\n        */\n\
  \        if (Keyboard::isKeyPressed(Keyboard::Escape)) {\n            window.close();\n\
  \        }\n\n        /*\n        ****************************************\n   \
  \     更新场景\n        ****************************************\n        */\n     \
  \   window.clear();\n\n        /*\n        ****************************************\n\
  \        绘制场景\n        ****************************************\n        */\n  \
  \      // 绘制我们的游戏场景\n        window.display();\n    }\n\n    return 0; }\n```\n\n\
  ### while 循环\n在新代码中看到的第一个内容是：\n\n```cpp\nwhile (window.isOpen())\n{\n```\n\n在新代码中看到的最后内容是右括号\
  \ `}`。我们创建了一个 `while` 循环。`while` 循环左括号 `{` 和右括号 `}` 之间的所有内容将反复执行，可能无限。仔细观察 `while`\
  \ 循环括号内的 `(...)`，如下：\n\n`while (window.isOpen())`\n\n这段代码的完整解释将等到我们在第四章“循环、数组、switch、枚举和函数——实现游戏机制”中讨论。现在重要的是，当窗口被设置为关闭时，代码的执行将跳出\
  \ `while` 循环并进入下一语句。具体如何关闭窗口很快就会介绍。\n\n下一条语句当然是 `return 0;`，它结束了我们的游戏。我们现在知道我们的\
  \ `while` 循环将不断旋转，重复执行内部的代码，直到我们的窗口对象被设置为关闭。\n\n### C 风格代码注释\n在 `while` 循环内部，我们看到了看起来有点像\
  \ ASCII 艺术的内容：\n\n```cpp\n/*\n****************************************\n处理玩家输入\n\
  ****************************************\n*/\n```\n\n### 注意事项\nASCII 艺术是一种小众但有趣的用计算机文本创建图像的方法。你可以在这里阅读更多信息：https://en.wikipedia.org/wiki/ASCII_art\
  \ .\n\n\n\n\n之前的代码只是另一种类型的注释。这种类型的注释被称为 C 风格注释。注释以 `/*` 开始，以 `*/` 结束。其之间的任何内容仅供参考，不会被编译。我使用了这段略显详尽的文字，是为了绝对明确地说明我们在代码文件的这部分中要做什么。当然，你现在可以推断出随后的任何代码都将与处理玩家输入有关。\n\
  \n跳过几行代码，你将看到我们有另一个 C 风格注释，宣布在代码的该部分，我们将更新场景。\n\n跳转到下一个 C 风格注释，就一而易见我们将在何何处绘制所有的图形了。\n\
  \n## 输入、更新、绘制、循环\n\n尽管第一个项目使用了最简单版本的游戏循环，但每个游戏在代码中都需要这些阶段：\n\n1. 获取玩家输入（如果有）。\n\
  2. 根据人工智能、物理学或玩家输入等因素更新场景。\n3. 绘制当前场景。\n4. 以足够快的速率重复上述操作，创建一个流畅且动态的游戏世界。\n\n现在，让我们看看在游戏循环中实际执行操作的代码。\n\
  \n### 检测按键按下\n\n首先，在标记为 `Handle the player's input` 的部分中，我们有以下代码：\n\n```cpp\nif\
  \ (Keyboard::isKeyPressed(Keyboard::Escape))\n{\n    window.close();\n}\n```\n\n\
  这段代码检查 `Escape` 键当前是否被按下。如果是，高亮的代码将使用 `window` 对象关闭自己。现在，下一次 `while` 循环开始时，它将看到\
  \ `window` 对象已关闭，并跳转到 `while` 循环结束大括号 `}` 之后的代码，随后游戏将退出。我们将在第 2 章：变量、运算符与决策——动画精灵》中更详细地讨论\
  \ `if` 语句。\n\n## 清除和绘制场景\n\n目前 `Update the scene` 部分还没有代码，所以让我们移动到 `Draw the scene`\
  \ 部分。我们做的第一件事是使用以下代码擦除上一帧动画：\n\n```cpp\nwindow.clear();\n```\n\n我们现在要做的是绘制游戏中的每一个对象。然而，目前我们还没有任何游戏对象。下一行代码是：\n\
  \n```cpp\nwindow.display();\n```\n\n当我们绘制所有的游戏对象时，我们是将它们绘制到一个准备好显示的隐藏表面上。`window.display()`\
  \ 代码将显示表面从之前的表面切换到新更新的（之前隐藏的）表面。这样，玩家永远不会看到绘制过程，因为表面表面已经添加了所有的精灵。它还保证了场景在翻转之前是完整的。这防止了被称为“撕裂”的图形故障。这个过程被称为双缓冲。\n\
  \n此外，请注意所有这些绘制和清除功能都是使用我们的 `window` 对象执行的，该对象是从 `SFML RenderWindow` 类创建的。\n\n###\
  \ 运行游戏\n\n运行游戏，你将得到一个空白的全屏窗口，它会一直存在直到你按下键盘上的 `Esc` 键。\n\n### 绘制游戏背景\n\n最后我们将在游戏中看到一些真实的图形。我们需要做的是创建一个\
  \ `sprite`（精灵）。我们将创建的第一个精灵将是游戏背景。然后我们可以在清除窗口和显示/翻转窗口之间绘制它。\n\n## 使用纹理准备精灵\n\n`SFML\
  \ RenderWindow` 类允许我们创建 `window` 对象来处理我们游戏窗口所需的所有功能。现在我们将探索另外两个 SFML 类，它们将负责将精灵绘制到屏幕上。这些类中的一个（意不意外地）被称为\
  \ `Sprite`（精灵）。另一个类被称为 `Texture`（纹理）。纹理是存储在图形处理器单元（GPU）内存中的图形。\n\n由 `Sprite` 类创建的对象需要一个由\
  \ `Texture` 类创建的对象才能以图像形式显示自己。添加以下高亮代码。也尝试推断一下发生了什么。然后我们将逐行进行说明：\n\n```cpp\nint\
  \ main()\n{\n    // 创建一个视频模式对象\n    VideoMode vm(1920, 1080); \n    // 为游戏创建并打开窗口\n\
  \    RenderWindow window(vm, \"Timber!!!\", Style::Fullscreen);\n\n    // 创建纹理以在\
  \ GPU 上存储图形\n    Texture textureBackground;\n    // 将图形加载到纹理中\n    textureBackground.loadFromFile(\"\
  graphics/background.png\");\n    // 创建精灵\n    Sprite spriteBackground;\n    // 将纹理附加到精灵上\n\
  \    spriteBackground.setTexture(textureBackground);\n    // 设置 spriteBackground\
  \ 覆盖屏幕\n    spriteBackground.setPosition(0,0);\n\n    while (window.isOpen()) {\n\
  \        // ...\n    }\n}\n```\n\n首先，我们从 SFML 的 `Texture` 类创建一个名为 `textureBackground`\
  \ 的对象。\n\n```cpp\nTexture textureBackground;\n```\n\n一旦完成，我们就可以使用 `textureBackground`\
  \ 对象从我们的图形文件夹加载图形到 `textureBackground` 中，如下：`textureBackground.loadFromFile(\"graphics/background.png\"\
  )`。\n\n### 提示\n\n我们只需要指定 `graphics/background`，因为路径是相对于我们创建文件夹并添加图片的 Visual Studio\
  \ 工作目录的。\n\n接下来，我们使用这段代码从 SFML 的 `Sprite` 类创建一个名为 `spriteBackground` 的对象：\n\n```cpp\n\
  Sprite spriteBackground;\n```\n\n然后，我们可以将纹理对象 `textureBackground` 与 `Sprite` 对象\
  \ `spriteBackground` 关联起来，如下：\n\n`spriteBackground.setTexture(textureBackground)`\n\
  \n最后，我们在 `window` 对象中将 `spriteBackground` 放置在坐标 `0,0`：\n\n`spriteBackground.setPosition(0,0)`\n\
  \n由于文件夹中的 `background.png` 图形宽 1920 像素，高 1080 像素，它将完美填充整个屏幕。请注意，这一行代码并没有实际显示精灵。它只是设置了它的位置以备显示。\n\
  \n对象 `spriteBackground` 现在可以用于显示背景图形。当然，你可能非常好奇为什么我们要以如此复杂的方式这样做。是因为显卡和 OpenGL 的工作方式。\n\
  \n纹理占用显存，而这种内存是有限资源。此外，将图形加载到 GPU 内存的过程非常慢。慢到你无法看到它的发生，或者不会让你的电脑在发生时明显变慢，但慢到让你不能在每一帧都执行它。因此，将实际纹理\
  \ `textureBackground` 与我们在游戏循环期间操作的代码分离是有用的。\n\n正如当我们开始移动图形时将会看到的，我们将使用 `sprite`\
  \ 这样做。任何由 `Texture` 类创建的对象都会愉快地待在 GPU 上，等待关联的 `Sprite` 对象告诉它们在何处显示。在后的项目中，我们还将多个不同的\
  \ `Sprite` 对象复用同一个 `Texture` 对象，从而高效利用显存。\n\n总结：\n- 纹理加载到 GPU 非常慢\n- 一旦在 GPU 上，访问非常快\n\
  - 我们将精灵与纹理关联\n- 我们操作精灵的位置和朝向（通常在 Update the scene 部分）\n- 我们绘制精灵对象，它反过来又了与其关联的纹理（通常在\
  \ Draw the scene 部分）。\n\n所以我们现在只需要使用由我们的 `window` 对象提供的双缓冲系统来绘制我们新的 `Sprite` 对象（`spriteBackground`），我们就应该能看到游戏实际运行了。\n\
  \n## 双缓冲背景精灵\n\n最后，我们需要在游戏循环的适当位置绘制该精灵以及与其关联的纹理。\n\n### 提示\n\n注意，当我展示来自同一个代码块的代码时，我没有添加缩进，因为这可以减少书中文字换行的次数。缩进是隐含的。请检查下载包中的代码文件以查看完整的缩进使用情况。\n\
  \n添加高亮代码：\n\n```cpp\n /*\n\n****************************************\n\nDraw the\
  \ scene\n */\n```\n\n\n\n\n```cpp\n****************************************\n\n\
  */ \n\n// 清除上一次运行帧的所有内容\n\nwindow.clear();\n\n// 在此处绘制我们的游戏场景\n\nwindow.draw(spriteBackground);\n\
  \n// 显示我们刚刚绘制的所有内容\n\nwindow.display();\n```\n\n这行新代码简单地使用 `window` 对象在清空显示和显示新绘制的场景之间绘制\
  \ `spriteBackground` 对象。\n\n### 运行游戏\n\n现在运行程序，你将看到我们正在开发一个真实游戏的第一个迹象。\n\n![](img/image00257.jpeg)它目前的状态可能无法通过\
  \ Steam 的审核（Greenlit），但至少我们正处于正确的道路上！\n\n让我们看看在本章中以及随着书籍的进行，可能会出现哪些问题。\n\n## 处理错误\n\
  \n在你制作的每一个项目中，总会有问题和错误，这是肯定的！问题越棘手，解决它时就越有成就感。当经过几个小时的挣扎后，一个新的游戏功能终于焕发生机时，它会带来真正的快感。如果没有这种挣扎，过程会变得没那么价值。\n\
  \n在本书的某些地方你可能会遇到一些困难。保持冷静，相信你能够克服它，然后开始工作。\n\n记住，无论你遇到什么问题，你极不可能是世界上第一个遇到这个相同问题的人。想一个简洁的句子来描述你的问题或错误，然后将其输入\
  \ Google。你会惊讶于别人已经以多快、多准确且多频繁的速度为你解决了你的问题。\n\n话虽如此，如果你正苦于让第一章运行起来，这里有几点提示（这里玩了双关梗；请参见第\
  \ 8 章：指针、标准模板库和纹理管理）可以帮助你入门。\n\n### 配置错误\n\n在本章中产生问题的最可能是配置错误。正如你在设置 Visual Studio、SFML、项目模板以及项目本身的过程中可能注意到的，有大量的文件名、文件夹和设置需要完全准确无误。仅仅一个错误的设置就可能导致许多错误中的一种，而文本并没有说清楚具体到底出了什么问题。\n\
  \n如果你在“创建可重用模板”部分无法让带黑字的空项目运行起来，那么重新开始该部分可能会更容易。确保所有的文件名和文件夹都适用于你的特定设置，然后运行代码中最简单的部分（屏幕闪烁黑色然后关闭的部分）。如果你能达到这一阶段，那么配置可能不是问题所在。\n\
  \n### 编译错误\n\n编译错误可能是我们今后遇到的最常见的错误。检查你的代码是否与我的完全一致，特别是行尾的分号，以及类名和对象名中大小写的细微变化。如果其他方法都失败了，请在下载包中打开代码文件并复制粘贴。虽然书中确实可能存在代码拼写错误，但代码文件是根据实际运行的项目制作的——它们绝对可以工作！\n\
  \n### 链接错误\n\n链接错误最可能是由于缺少 SFML `.dll` 文件引起的。你在“从模板创建项目”部分中是否已将所有文件都复制到了项目文件夹中？\n\
  \n### Bug\n\nBug 是当你的代码运行了，但不符合你的预期时发生的情况。调试其实很有趣。你消灭的 Bug 越多，你的游戏就越好，你一天的工作就越满意。解决\
  \ Bug 的诀窍是尽早发现它们！为了做到，我建议每次实现新功能时都运行并玩玩游戏。越早发现 Bug，原因就越容易留在脑海中。在本书中，我们将在每一个可能的阶段运行代码查看结果。\n\
  \n## 第 2 章 变量、运算符与决策 – 精灵动画\n\n在本章中，我们将在屏幕上进行更多的绘制，为了实现这一点，我们需要学习一些 C++ 的基础知识。\n\
  \n以下是内容：\n\n- 学习关于 C++ 变量的所有知识\n- 查看如何操作存储在变量中的值\n- 添加一个静态树，供玩家砍伐\n- 绘制并动画蜜蜂和三朵云\n\
  \n## C++ 变量\n\n变量是我们的 C++ 游戏存储和操作值的方式。如果我们想知道玩家有多少血量，我们需要一个变量。也许你想知道当前波次还剩下多少僵尸？那也是变量。如果你需要记住获得特定高分的玩家名字，你猜对了，我们需要为此准备一个变量。游戏结束了还是仍在进行？是的，那也是变量。\n\
  \n变量是内存位置的命名标识符。所以我们可能会将一个变量命名为 `numberOfZombies`，该变量可以指向内存中的一个位置，存储代表当前波次剩余僵尸数量的值。\n\
  \n计算机系统访问内存位置的方式是复杂的。编程语言使用变量来提供一种人类友好的方式来管理内存中的数据。\n\n我们对变量的简短讨论意味着存在不同类型的变量。\n\
  \n### 变量类型\n\nC++ 变量类型非常多（见下一个关于变量的提示）。花一整章来讨论它们也是轻而易举。下面是书中最常用的类型表格。我们将查看如何实际使用每种变量类型。\n\
  \n| 类型 | 值示例 | 解释 |\n| :--- | :--- | :--- |\n| Int | -42, 0, 1, 9826 等。 | 整数整数。\
  \ |\n| Float | -1.26f, 5.8999996f, 10128.3f | 精度可达 7 位的浮点值。 |\n| Double | 925.83920655234,\
  \ 1859876.94872535 | 精度可达 15 位的浮点值。 |\n| Char | a, b, c, 1, 2, 3（总共 128 个符号，包括 ?,\
  \ ~, # 等...） | ASCII 表中的任何符号（见下一个关于变量的提示）。 |\n| Bool | True 或 false | Bool 代表布尔值，只能是真或假。\
  \ |\n| String | Hello everyone! I am a string. | 从单个字母或数字到可能是一整本书的任何文本值。 |\n\n必须告诉编译器变量是什么类型，以便它为其分配正确数量的内存。对于你使用的每个变量，使用最佳且合适的类型是一个良好的习惯。但在实践中，你通常可以通过提升变量（promotion）来解决问题。也许你只需要五位有效数字的浮点数？如果你将其存储为\
  \ `double`，编译器不会抱怨。然而，如果你尝试将 `float` 或 `double` 存储在 `int` 中，它将更改/转换该值以适应 `int`。随着书籍的进行，我会明确每种情况下应该使用的最佳变量类型，我们还会看到几次故意在变量类型之间转换/强制转换的实例。\n\
  \n表格中值得注意的几个额外细节包括所有浮点值旁的 `f` 后缀。这个 `f` 告诉编译器该值是 `float` 类型而不是 `double`。没有 `f` 前缀的浮点值被假定为双。更多信息请见下一个关于变量的提示。\n\
  \n如之前提到的，还有更多类型。如果你想了解更多关于类型的知识，请看下一个关于变量的提示。\n\n### 常量\n\n有时我们需要确保一个值永远无法被更改。为了实现这一点，可以使用\
  \ `const` 关键字声明并初始化一个常量：\n\n```cpp\nconst float PI = 3.141f;\n\nconst int PLANETS_IN_SOLAR_SYSTEM\
  \ = 8;\n\nconst int NUMBER_OF_ENEMIES = 2000;\n```\n\n习惯上将常量全部大大写。之前的常量的值永远无法更改。我们将在第\
  \ 4 章 *循环、数组、switch、枚举与实现游戏机制的函数* 中看到常量的应用。\n\n### 自定义类型\n\n\n\n\n\n用户定义类型比我们刚刚看到的类型要高级得多。当我们谈论\
  \ C++ 中的用户定义类型时，我们通常指的是类（classes）。我们在上一章中简要地讨论了类及其相关对象。我们可以在单独的文件编写代码，有时是在两个单独的文件中。通过这些文件，我们将能够对它们进行声明、初始化和使用。我们将如何定义/创建自己的类型留到第\
  \ 6 章：*面向对象编程、类与 SFML 视图*。\n\n## 变量的声明与初始化\n\n到目前为止，我们知道变量用于存储游戏运行所需的数据/值。例如，一个变量可以代表玩家拥有的生命值或玩家的名字。我们还知道这些变量可以代表许多不同类型的数值，如\
  \ `int`、`float`、`bool` 等。当然，我们还没有看到的是实际上该如何使用变量。\n\n创建和准备一个新变量有两个阶段。这两个阶段被称为 `declaration`（声明）和\
  \ `initialization`（初始化）。\n\n### 声明变量\n\n我们可以像这样在 C++ 中声明变量：\n\n```cpp\n// 玩家的分数是多少？\n\
  int playerScore;\n\n// 玩家的首字母是什么\nchar playerInitial;\n\n// pi 的值是多少\nfloat valuePi;\n\
  \n// 玩家是活着还是死了？\nbool isAlive;\n```\n\n### 初始化变量\n\n现在我们已经用有意义的名字声明了变量，可以使用适当的值初始化这些相同的变量，如下：\n\
  \n```cpp\nplayerScore = 0;\nplayerInitial = 'J';\nvaluePi = 3.141f;\nisAlive = true;\n\
  ```\n\n### 一步完成声明与初始化\n\n在方便的情况下，我们可以声明和初始化步骤合并为一个：\n\n```cpp\nint playerScore =\
  \ 0;\nchar playerInitial = 'J';\nfloat valuePi = 3.141f;\nbool isAlive = true;\n\
  ```\n\n### 提示\n\n**变量提示** 正如承诺，这里有关于变量的提示。如果你想查看 C++ 类型的完整列表，请检查此网页：http://www.tutorialspoint.com/cplusplus/cpp_data_types.htm。如果你想对\
  \ float、double 和 f 后缀进行更深入的讨论，请阅读这里：http://www.cplusplus.com/forum/beginner/24483/。如果你想了解\
  \ ASCII 字符编码的细节，这里有一些更多信息：http://www.cplusplus.com/doc/ascii/。注意，这些链接是为好奇的读者提供的，我们讨论的内容已经足够继续了。\n\
  \n### 声明和初始化用户定义类型\n\n我们已经见过如何声明和初始化一些 SFML 定义类型的示例。因为我们创建/定义这些类型（类）的方式非常灵活，因此声明和初始化它们的方式也非常多样。这里是上一章中关于声明和初始化用户定义类型的几个提醒。\n\
  \n创建一个类型为 `VideoMode` 的对象，命名为 `vm`，并用两个 int 值 `1920` 和 `1080` 初始化它：\n\n```cpp\n\
  // 创建一个视频模式对象\nVideoMode vm(1920, 1080);\n```\n\n创建一个类型为 `Texture` 的对象，命名为 `textureBackground`\
  \ 但不进行初始化：\n\n```cpp\n// 创建一个在 GPU 上持有图形的纹理\nTexture textureBackground;\n```\n\n\
  注意，尽管我们没有建议用任何特定值来初始化 `textureBackground`，但某些变量可能会在内部被设置。一个对象在此时是否需要/有提供初始化值的选项完全取决于类的代码编写方式，并且几乎是无限灵活的。这进一步预示了当我们开始编写自己的类时将会有一些复杂性。幸运的是，这意味着我们拥有巨大的力量来设计自己的类型/类，让它们正是我们制作游戏所需的！将这种巨大的灵活性加入到\
  \ SFML 设计的类中，我们游戏的潜力几乎是无限的。\n\n在本章中，我们还将看到 SFML 提供的其他几个用户创建的类型/类，在整本书中会有更多。\n\n\
  ## 操作变量\n\n此时，我们确清楚地知道变量是什么、主要类型以及如何声明和初始化它们，但我们仍然对它们做不了什么。我们需要操作变量，对它们进行加、减、乘、除并对其进行测试。\n\
  \n首先，我们将处理如何操作它们，稍后我们将查看如何以及为什么要测试它们。\n\n### C++ 算术运算符和赋值运算符\n\n为了操作变量，C++ 有了一系列\
  \ `arithmetic operators`（算术运算符）和 `assignment operators`（赋值运算符）。幸运的是，大多数算术和赋值运算符的使用非常直观，而那些不直观的也很容易解释。为了开始，让我们看看算术运算符表，然后是我们在书中经常使用的赋值运算符表：\n\
  \n| 算术运算符 | 说明 |\n| :--- | :--- |\n| `+` | 加法运算符可以将两个变量或值相加。 |\n| `-` | 减法运算符可以从另一个变量或值中减去一个变量或值的值。\
  \ |\n| `*` | 乘法运算符可以乘以变量和值。 |\n| `/` | 除法运算符可以除以变量和值。 |\n| `%` | 取模运算符将一个值或变量除以另一个值或变量以得到操作的余数。\
  \ |\n\n现在是赋值运算符：\n\n| 赋值运算符 | 说明 |\n| :--- | :--- |\n| `=` | 我们已经见过这个了。它是*唯一的*赋值运算符。我们用它来初始化/设置变量的值。\
  \ |\n| `+=` | 将右侧的值加到左侧变量上。 |\n| `-=` | 从左侧变量中减去右侧的值。 |\n| `*=` | 左侧变量乘以右侧的值。 |\n\
  | `/=` | 左侧变量除以右侧的值。 |\n| `++` | **递增** 运算符；变量加 1 |\n| `--` | **递减** 运算符；变量减 1 |\n\
  \n### 注意\n\n从技术来说，除了 `=`、`--` 和 `++` 之外的所有上述运算符被称为 `compound assignment operators`（复合赋值运算符），因为它们包含多个运算符。\n\
  \n现在我们已经看到了大量的算术和赋值运算符，我们实际上通过组合运算符、变量和值形成 `expressions`（表达式），来看到如何操作变量。\n\n###\
  \ 使用表达式完成任务\n\n`Expressions` 是变量、运算符和值的组合。使用表达式我们可以得到结果。此外，正如我们很快看到的，我们可以在测试中使用表达式。这些测试可以用来决定我们的代码下一步应该做什么。首先，让我们看看在游戏代码中可能会看到的一些简单表达式：\n\
  \n```cpp\n// 玩家获得新高分\nhiScore = score;\n\n// 将分数设置为 100\nscore = 100;\n```\n\n看一看结合赋值运算符使用的加法运算符：\n\
  \n```cpp\n// 当射中外星人时增加分数\nscore = aliensShot + wavesCleared;\n\n// 在当前分数的基础上加 100\n\
  score = score + 100;\n```\n\n注意，在运算符的同侧使用同一个变量是完全可以的。\n\n看一看结合赋值运算符的减法运算符。这段代码将减法运算符右侧的值减去左侧的值。它通常与赋值运算符结合使用，例如：\n\
  \n```cpp\n// 噢，失去了一个生命\nlives = lives - 1;\n\n// 游戏结束时剩余多少外星人\naliensRemaining =\
  \ aliensTotal - aliensDestroyed;\n```\n\n这就是我们可能使用除法运算符的方式。这段代码将左侧除除以右侧。同样，它通常配合赋值运算符使用，如下：\n\
  \n```cpp\n// 根据剑等级降低剩余生命值\nhitPoints = hitPoints / swordLevel;\n\n// 回收方块时给玩家一些回报\n\
  recycledValueOfBlock = originalValue / .9f;\n```\n\n\n\n显然，在之前的示例中，变量 `recycledValueOfBlock`\
  \ 必须是 `float` 类型，才能准确地存储像这样的计算结果。\n\n出乎意料的是，我们可以这样使用乘法运算符：\n\n```cpp\n// 结果等于 100\n\
  answer = 10 * 10;\n```\n\n或者\n\n```cpp\n// biggerAnswer 等于 100\nbiggerAnswer = 10\
  \ * 10;\n```\n\n### 注意\n\n顺便提一下，你是否好奇过 C++ 的名字是怎么来的？C++ 是 C 语言的扩展版。它的发明者 Bjarne\
  \ Stroustrup 最初叫它 C with classes，但后来名字演变了。如果你感兴趣，可以阅读 C++ 的故事：http://www.cplus.com/info/。\n\
  \n现在，让我们来看看递增运算符的作用。这是一种给游戏变量值加 1 的非常简洁的方法。\n\n看这段代码：\n\n```cpp\n// 给 myVariable\
  \ 加上 1\nmyVariable = myVariable + 1;\n```\n\n它的结果与此代码相同：\n\n```cpp\n// 更加简洁和快速\n\
  myVariable ++;\n```\n\n递减运算符——正如你猜的——是一种从某个值中减去 1 的非常简洁的方法：\n\n```cpp\n// 从 playerHealth\
  \ 中减去 1\nplayerHealth = playerHealth -1;\n```\n\n它与此代码相同：\n\n```cpp\nplayerHealth\
  \ --\n```\n\n让我们看看更多运算符的作用，然后就可以回到构建游戏了：\n\n```cpp\n// 将变量乘以 10 并将结果赋值回\nsomeVariable\
  \ *= 10;\n// someVariable 现在等于 100\n\n// 将 someVariable 除以 5 并将结果赋值回\nsomeVariable\
  \ /= 5;\n// someVariable 现在等于 20\n\n// 给 someVariable 加上 3 并将结果赋值回\nsomeVariable\
  \ += 3;\n// someVariable 现在等于 23\n\n// 从 someVariable 中减去 25 并将结果赋值回\nsomeVariable\
  \ -= 25;\n// someVariable 现在等于 -2\n```\n\n现在是时候为我们的游戏添加更多精灵（sprites）了。\n\n## 添加云、树和蜜蜂\n\
  \n我们将添加一棵树。这将会非常简单，因为树是不移动的。我们将使用上一章节绘制背景时完全相同的步骤。\n\n### 准备树\n\n添加以下高亮代码。注意我们已经写代码，这应该帮助你识别在设置背景位置之后、main\
  \ 循环开始之前的新代码。我们将回顾添加它后实际发生的情况：\n\n```cpp\nint main()\n{\n// 创建视频模式对象\nVideoMode\
  \ vm(1920, 1080);\n// 为游戏创建一个窗口\nRenderWindow window(vm, \"Timber!!!\", Style::Fullscreen);\n\
  // 创建存储在 GPU 上的纹理\nTexture textureBackground;\n// 加载图形到纹理\ntextureBackground.loadFromFile(\"\
  graphics/background.png\");\n// 创建精灵\nSprite spriteBackground;\n// 将纹理附加到精灵\nspriteBackground.setTexture(textureBackground);\n\
  // 设置精灵覆盖屏幕\nspriteBackground.setPosition(0, 0);\n\n// 创建树的精灵\nTexture textureTree;\n\
  textureTree.loadFromFile(\"graphics/tree.png\");\nSprite spriteTree;\nspriteTree.setTexture(textureTree);\n\
  spriteTree.setPosition(810, 0); \n\nwhile (window.isOpen()) {\n```\n\n我们刚刚添加的五行代码（不包括注释）执行了以下操作：\n\
  \n首先，我们创建一个类型为 `Texture` 的对象 `textureTree`。接下来，我们从 `tree.png` 图文件中加载图形。\n\n接着，我们创建一个类型为\
  \ `Sprite` 的对象 `spriteTree`。现在我们将 `textureTree` 与 `spriteTree` 关联。每当绘制 `spriteTree`\
  \ 时，它都会显示 `textureTree` 纹理，这是一个树图形。最后，我们使用 x 轴 `810` 和 y 轴 `0` 设置树的位置。\n\n让我们继续蜜蜂对象，它的处理方式几乎相同。\n\
  \n### 准备蜜蜂\n\n这段代码与树的代码之间的差异很小但很重要。由于蜜蜂需要移动，我们还声明了两个相关的变量。在所示位置添加高亮代码，看看你是否能看出使用\
  \ `beeActive` 和 `beeSpeed` 变量：\n\n```cpp\n// 树的精灵\nTexture textureTree;\ntextureTree.loadFromFile(\"\
  graphics/tree.png\");\nSprite spriteTree;\nspriteTree.setTexture(textureTree);\n\
  spriteTree.setPosition(810, 0);\n\n// 准备蜜蜂\nTexture textureBee;\ntextureBee.loadFromFile(\"\
  graphics/bee.png\");\nSprite spriteBee;\nspriteBee.setTexture(textureBee);\nspriteBee.setPosition(0,\
  \ 800);\n\n// 蜜蜂正在移动吗？\nbool beeActive = false;\n// 蜜蜂飞得有多快\nfloat beeSpeed = 0.0f;\n\
  \nwhile (window.isOpen())\n```\n\n我们以创建背景和树完全相同的方式创建一个蜜蜂。我们使用一个 `Texture` 和一个 `Sprite`并将两者关联。注意，在之前的蜜蜂代码中，有一些我们没见过的新代码。有一个\
  \ `bool` 变量用于判断蜜蜂是否激活。记住，`bool` 变量可以是 `true` 或 `false`。目前我们将 `beeActive` 初始化为 `false`。\n\
  \n接下来，我们声明了一个名为 `beeSpeed` 的新 `float` 变量。这将存储蜜蜂飞过屏幕的速度（像素/秒）。\n\n很快我们将看到如何使用这两个新变量来移动蜜蜂。在之前，让我们以几乎相同的方式设置一些云。\n\
  \n### 准备云\n\n添加接下来所示的高亮代码。学习新代码并尝试弄清楚它将做什么：\n\n```cpp\n// 准备蜜蜂\nTexture textureBee;\n\
  textureBee.loadFromFile(\"graphics/bee.png\");\nSprite spriteBee;\nspriteBee.setTexture(textureBee);\n\
  spriteBee.setPosition(0, 800);\n\n// 蜜蜂正在移动吗？\nbool beeActive = false;\n// 蜜蜂飞得有多快\n\
  float beeSpeed = 0.0f;\n\n// 从 1 个纹理制作 3 个云精灵\nTexture textureCloud;\n// 加载 1 个新纹理\n\
  textureCloud.loadFromFile(\"graphics/cloud.png\");\n\n// 相同纹理的 3 个精灵\nSprite spriteCloud1;\n\
  Sprite spriteCloud2;\nSprite spriteCloud3;\nspriteCloud1.setTexture(textureCloud);\n\
  spriteCloud2.setTexture(textureCloud);\nspriteCloud3.setTexture(textureCloud);\n\
  \n// 将云放在屏幕外\nspriteCloud1.setPosition(0, 0);\nspriteCloud2.setPosition(0, 250);\n\
  spriteCloud3.setPosition(0, 500);\n\n// 云在屏幕上吗？\nbool cloud1Active = false;\nbool\
  \ cloud2Active = false;\nbool cloud3Active = false;\n\n// 每个云的速度有多快？\nfloat cloud1Speed\
  \ = 0.0f;\nfloat cloud2Speed = 0.0f; float cloud3Speed = 0.0f; \n\nwhile (window.isOpen())\
  \ {\n```\n\n我们刚刚添加的代码中，唯一看起来有点奇怪的是我们只有一个类型为 `Texture` 的对象。多个 `Sprite` 对象共享一个纹理是完全正常的。一旦\
  \ `Texture` 存储在 GPU 内存中，就可以非常快速地与 `Sprite` 对象关联。只有 `loadFromFile` 代码中的初始图形加载是一个相对较慢的操作。当然，如果我们想要三种形状不同的云，那么就需要三个纹理。\n\
  \n除了这个微小的纹理问题外，我们刚刚添加的代码与蜜蜂相比没有新内容。区别在于有三个云精灵、三个判断每个云是否激活的 `bool` 变量以及三个存储每个云速度的\
  \ `float` 变量。\n\n### 绘制树、蜜蜂和云\n\n最后，我们通过在绘制部分添加这些高亮代码将它们全部绘制到屏幕上：\n\n```cpp\n /*\n\
  ****************************************\n绘制场景\n****************************************\n\
  */\n\n// 清除上一帧的所有内容\nwindow.clear();\n\n// 在此处绘制我们的游戏场景\nwindow.draw(spriteBackground);\n\
  \n// 绘制云\nwindow.draw(spriteCloud1);\nwindow.draw(spriteCloud2);\nwindow.draw(spriteCloud3);\
  \ \n\n// 绘制树\nwindow.draw(spriteTree);\n\n// 绘制昆虫\nwindow.draw(spriteBee);\n\n//\
  \ 显示我们刚刚绘制的所有内容\nwindow.display();\n```\n\n\n\n\n绘制三朵云、蜜蜂和树的方法与绘制背景的方法完全相同。然而，请注意我们在屏幕上绘制不同对象的顺序。我们必须在绘制背景之后绘制所有图形，否则它们会被覆盖；我们必须在绘制树之前绘制云，否则它们看起来会漂浮在树前面，显得有点奇怪。蜜蜂在树的前面或后面看起来都可以。我选择在树的前面绘制蜜蜂，这样它就可以尝试分散伐木工的注意力，就像真实的蜜蜂可能会的那样。\n\
  \n运行 `Timber!!!` 并敬畏地看着那棵树、三朵云和一只蜜蜂，它们什么都不做！它们看起来像是在排队比赛，而蜜蜂在往后走。\n\n![](img/image00258.jpeg)\n\
  \n利用我们对运算符的了解，我们可以尝试移动刚刚添加的图形，但存在几个问题。首先，真实的云和蜜蜂移动方式是非均匀的均匀运动的。它们没有固定的速度或位置。虽然它们的位置和速度由风速或蜜蜂有多急等因素决定，但对于普通观察者来说，它们的路径和速度看起来是随机的。\n\
  \n## 随机数\n\n随机数在游戏中有许多用途。也许你可以用它们来决定玩家发到的是什么种牌，或者从敌人健康值中扣除一定范围内的多少伤害。正如所暗示的，我们将使用随机数来决定蜜蜂和云的起始位置和速度。\n\
  \n### 在 C++ 中生成随机数\n\n为了生成随机数，我们需要使用更多的 C++ 函数，确切地说是多两个。先不要向游戏添加任何代码。让我们通过一些假设的代码来看其语法和所需的步骤。\n\
  \n计算机实际上无法选出随机数。它们只能通过算法/计算来选取一个看起来是随机的数字。为了让这个算法不不断返回相同的值，我们必须对随机数生成器进行**种子**设定。种子可以是任何整数，尽管每次当你需要唯一的随机数时，必须使用不同的种子。看看这段代码，它为随机数生成器设定：\n\
  \n```cpp\n// 使用时间为随机数生成器\nsrand((int)time(0));\n```\n\n上面的代码使用 `time` 函数从电脑获取时间，如下\
  \ `time(0)`。对 `time` 函数的调用作为值传递给 `srand` 函数。结果是使用当前时间作为种子。\n\n之前的代码看起来稍微复杂一点，是因为使用了看起来不寻常的\
  \ `(int)` 语法。它的作用是将 `time` 返回的值转换/强制转换为 `int`。在在这种情况下，这是 `srand` 函数要求的。\n\n### 注意\n\
  \n从一种类型到另一种类型的转换被称为类型转换（cast）。\n\n所以，总结来说，上一行代码发生了以下情况：\n\n- 使用 `time` 获取时间\n- 将其转换为\
  \ `int` 类型\n- 将此结果发送给 `srand`，从而为随机数生成器设定种子\n\n时间无疑始终在变化。这使得 `time` 函数成为设定随机数生成器种子的极佳方法。然而，思考一下如果多次设定随机数生成器，且速度快到让时间返回相同的值，会发生什么？我们在动画云时将看到并解决这个问题。\n\
  \n在现阶段，我们可以创建一个范围内的随机数，并将其保存到变量中供以后使用：\n\n```cpp\n// 获取随机数并将其保存到名为 number 的变量中\n\
  int number = (rand() % 100);\n```\n\n注意给 `number` 赋值的这种奇怪方式。通过使用取模运算符 `%` 和值 `100`，我们是在要求将\
  \ `rand()` 返回的数字除以 `100` 后的余数。当你除以 100 时，可能的最大余数是 99。最小可能是 0。因此，之前的代码将生成一个 0 到 99\
  \ 之间的数字（包含边界）。这些知识对于为我们的蜜蜂和云生成随机速度和起始位置非常有用。\n\n我们很快就会做这一点，但首先我们需要学习如何在 C++ 中做决策。\n\
  \n### 使用 if 和 else 决策\n\nC++ 的 `if` 和 `else` 关键字使我们能够做出决策。实际上，我们在上一章已经看到过 `if` 的作用了，当时我们在每一帧中检测玩家是否按了\
  \ Esc 键：\n\n```cpp\nif (Keyboard::isKeyPressed(Keyboard::Escape))\n{\n    window.close();\n\
  }\n```\n\n到目前为止，我们已经看到了如何使用算术运算符和赋值运算符来创建表达式。现在我们可以看到一些新的运算符。\n\n### 逻辑运算符\n\n逻辑运算符将通过构建可以测试真或假值的表达式来帮助我们做决策。起初，这看起来可能非常有限，不足以应对高级\
  \ PC 游戏可能需要的类型选择。一旦我们深入研究，就会发现实际上只需要几个逻辑运算符，就可以完成我们所需的所有决策。\n\n这里是最实用的逻辑运算符表格。看看它们以及相关的示例，然后我们将看到如何使用它们。\n\
  \n| 逻辑运算符 | 名称和示例 |\n| :--- | :--- |\n| `==` | **比较运算符**用于测试相等性，结果为真或假。例如，`(10 ==\
  \ 9)` 这样的表达式为假。10 显然不等于 9。 |\n| `!` | 这是逻辑**非** (NOT) 运算符。表达式 `(! (2 + 2 == 5))`\
  \ 为真，因为 `2 + 2 == 5`。 |\n| `!=` | 这是另一个比较运算符，但与相等运算符不同。它测试某值是否**不等于**。例如，`(10 !=\
  \ 9)` 为真。10 不等于 9。 |\n| `>` | 另一个比较运算符 - 实际上还有几个。它测试某值是否大于另一个值。表达式 `(10 > 9)` 为真。\
  \ |\n| `<` | 你猜对了。它测试值小于。表达式 `(10 < 9)` 为假。 |\n| `>=` | 该运算符测试一个值是否大于或等于另一个值，如果其中一个为真，结果即为真。例如，`(10\
  \ >= 9)` 为真。表达式 `(10 >= 10)` 也为真。 |\n| `<=` | 与上一个运算符类似，这个测试两个条件，但这次是小于等于。表达式 `(10\
  \ <= 9)` 为假。表达式 `(10 <= 10)` 为真。 |\n| `&&` | 该运算符被称为逻辑**与** (AND)。它测试表达式的两个或多个独立部分，只有当两个部分都为真时，结果才为真。逻辑与通常与其他运算符结合使用以构建复杂的测试。表达式\
  \ `((10 > 9) && (10 < 11))` 为真，因为两部分都为，所以表达式为真。表达式 `((10 > 9) && (10 < 9))` 为假，因为表达式中只有一个部分为真，另一个为假。\
  \ |\n| `||` | 该运算符称为逻辑**或** (OR)，它与逻辑与一样，只是表达式的两个或多个部分中至少有一个为真，表达式就为真。让我们看看上面使用的最后一个示例，但将\
  \ `&&` 替换为 `||`。表达式 `((10 > 9) || (10 < 9))` 现在为真，因为表达式的一个部分为真。 |\n\n### C++ if\
  \ and else\n\n让我们之前的示例不那么抽象。认识一下 C++ `if` 关键字。我们将使用 `if` 和一些运算符，结合一个小故事来演示它们的用法。\n\
  \n船长快要死了，由于知道剩下的部下没有什么经验，他决定写一个 C++ 程序来传达他死后的最后命令。部队必须守住桥的一侧以等待援军。\n\n船长想要确保他的部队理解的第一条命令是：\n\
  \n 如果他们过桥，射击他们！\n\n\n\n\n\n“如果他们过桥，就射击他们！”\n\n那么，我们该如何在 C++ 中模拟这种情况呢？我们需要一个布尔类型的变量：`isComingOverBridge`。接下来的代码假设\
  \ `isComingOverBridge` 变量已经声明并初始化为 `true` 或 `false`。\n\n我们可以这样使用 `if`：\n\n```cpp\n\
  if(isComingOverBridge)\n{\n    // 射击他们\n}\n```\n\n如果 `isComingOverBridge` 变量等于 `true`，则左大括号括号\
  \ `{...}` 内部的代码将执行。如果不是，程序将继续从 `if` 块之后运行，而不会执行其中的代码。\n\n### 或者尝试这种方法\n\n长官还想告诉他的部队，如果敌人没有过桥，就留在原地。\n\
  \n现在我们可以引入另一个 C++ 关键字：`else`。当我们想在 `if` 条件不为 `true` 时显式地执行某些操作时，可以使用 `else`。\n\n\
  例如，为了在敌人没有过桥时让部队留在原地，我们可以写下这段代码：\n\n```cpp\nif(isComingOverBridge)\n{\n    // 射击他们\n\
  }\nelse\n{\n    // 留在原地\n}\n```\n\n长官随后意识到问题并没有像他最初想的那么简单。如果敌人过桥了，但人数太多怎么办？他的小队会被击溃并屠杀。于是，他想出了这段代码（这次我们还会使用一些变量）：\n\
  \n```cpp\nbool isComingOverBridge;\nint enemyTroops;\nint friendlyTroops;\n\n//\
  \ 初始化之前的变量，无论用什么方法\n// 现在处理 if\nif(isComingOverBridge && friendlyTroops > enemyTroops)\
  \ { \n    // 射击他们\n}\nelse if(isComingOverBridge && friendlyTroops < enemyTroops)\
  \ {\n    // 炸毁桥 \n}\nelse {\n    // 留在原地 \n}\n```\n\n上述代码有三种可能的执行路径。第一种是敌人正在过桥，且友军人数较多：\n\
  \n`if(isComingOverBridge && friendlyTroops > enemyTroops)`\n\n第二种是敌人正在过桥，但人数多于友军：\n\
  \n`else if(isComingOveBridge && friendlyTroops < enemyTroops)`\n\n第三也是最后一种可能的结果，即当上述两种都不成立时执行的结果，由不带\
  \ `if` 条件的最后一个 `else` 捕获。\n\n### 读者挑战\n\n你能发现上述代码中的一个缺陷吗？这个缺陷可能会让一群没有经验的士兵陷入完全的混乱中。敌人和友军人数完全相等的可能性没有被显式处理，因此将由最后的\
  \ `else` 处理。最后的 `else` 是为了在没有敌人时准备的。我想任何一个有自尊的长官都会希望他的部队在这种情况下进行战斗。他可以修改第一个 `if`\
  \ 语句来适应这种可能性：\n\n`if(isComingOverBridge && friendlyTroops >= enemyTroops)`\n\n最后，长官的最后一个担心是，如果敌人挥着白降旗过桥并并立即被屠杀，那么他的士兵最终会变成战争罪犯。所需的\
  \ C++ 代码是显而易见的。使用 `wavingWhiteFlag` 布尔变量，他写了这样一个测试：\n\n```cpp\nif (wavingWhiteFlag)\
  \ {\n    // 俘虏 \n}\n```\n\n但将这段代码放在哪里的问题就不那么明确了。最后，长官选择了以下嵌套方案，并将对 `wavingWhiteFlag`\
  \ 的测试改为逻辑非（NOT），如下：\n\n```cpp\nif (!wavingWhiteFlag)\n{\n    // 没有投降，所以检查其他所有\n\
  \    if(isComingOverTheBridge && friendlyTroops >= enemyTroops) {\n        // 射击他们\
  \ \n    }\n    else if(isComingOverTheBridge && friendlyTroops < enemyTroops)\n\
  \    {\n        // 炸毁桥 \n    }\n    else\n    {\n        // 这是第一个 if 的 else // 俘虏\n\
  \        { \n            // 留在原地\n        }\n    }\n}\n```\n\n这说明我们可以将 `if` 和 `else`\
  \ 语句嵌套在一起，以创建非常深入且详细的决策。\n\n我们可以继续使用 `if` 和 `else` 越来越复杂的决策，但我们所看到的对于入门来说已经足够了。可能值得指出，通常解决一个问题有多种方法。正确的方法通常是以后最清晰、最简单的方式解决问题。\n\
  \n我们正接近掌握动画化云朵和蜜蜂所需的所有 C++ 知识。我们还有一个最后的动画问题需要讨论，然后我们就可以回到游戏了。\n\n### 时机\n\n在我们移动蜜蜂和云朵之前，我们需要考虑时机。正如我们所知，主游戏循环会反复执行，直到玩家按下\
  \ `Esc` 键。\n\n我们还学到 C++ 和 SFML 异常快速。事实上，我那台旧笔记本电脑执行一个简单的游戏循环（如当前的这个）大约是每秒五千次。\n\n\
  ### 帧率问题\n\n让我们考虑蜜蜂的速度。为了讨论，我们可以假装我们要以每秒 200 像素的速度移动它。在宽度为 1920 像素的屏幕上，跨越整个宽度大约需要\
  \ 10 秒，因为 `10 x 200` 等于 2000（接近 1920）。\n\n此外，我们知道可以使用 `setPosition(...,...)` 为我们的任何精灵（sprite）定位。我们只需要将\
  \ x 和 y 坐标放入括号中。\n\n除了设置精灵的位置，我们还可以**获取**（get）精灵的位置。例如，获取蜜蜂的水平 x 坐标，我们将使用这段代码：\n\
  \n```cpp\nint currentPosition = spriteBee.getPosition().x;\n```\n\n除了设置精灵的位置，我们还可以**获取**（get）精灵的位置。例如，获取蜜蜂的水平\
  \ x 坐标，我们将使用这段代码：\n\n`int currentPosition = spriteBee.getPosition().x;`\n\n蜜蜂当前的\
  \ `x` 坐标现在存储在 `currentPosition` 中。要让蜜蜂右移动，我们可以将 200 除以 5000 的相应分数加到 `currentPosition`，如下：\n\
  \n`currentPosition += 200/5000;`\n\n帧率可能并不总是恒。蜜蜂看起来可能是在间歇性地冲过屏幕。当然，我们希望游戏的观众更广泛，而不仅仅是我的笔记本电脑！每台\
  \ PC 的帧率都会变化，至少略有不同。如果你有一台非常旧的 PC，蜜蜂看起来像被铅压着；如果你有最新的游戏设备，它将像一只模糊的涡轮蜜蜂。\n\n幸运的是，这个问题对于每个游戏都是一样的，而\
  \ SFML 提供了一个解决方案。理解解决方案最简单的方法就是实现它。\n\n### SFML 帧率解决方案\n\n我们现在测量并使用帧率来控制我们的游戏。要开始实现，请在主游戏循环之前添加此代码：\n\
  \n```cpp\n// 每朵云移动有多快？\nfloat cloud1Speed = 0;\nfloat cloud2Speed = 0;\nfloat cloud3Speed\
  \ = 0;\n\n// 控制时间本身的变量\nClock clock;\n```\n\n在主游戏中，我们添加以下代码：\n\n```cpp\nwhile (window.isOpen())\n\
  {\n```\n\n在之前的代码中，我们声明了一个 `Clock` 类型的对象并将其命名为 `clock`。类名大写字母开头，对象名称（我们实际使用的）以小写字母开头。对象名称是任意的，但对于钟来说，`clock`是一个合适的名字。我们很快就会在这里添加更多与时间相关的变量。\n\
  \n现在，在游戏代码的更新部分添加这段高亮代码：\n\n```cpp\n// 测量时间\nTime dt = clock.restart();\n```\n\n\
  ```cpp\n/*\n****************************************\n更新场景\n****************************************\n\
  */\n```\n\n```cpp\n/*\n****************************************\n绘制场景\n****************************************\n\
  */\n```\n\n\n\n正如你所预期的那样，`clock.restart()` 函数会重启时钟。我们希望在每一帧都重启时钟，这样我们就可以计算每一帧所花费的时间。此外，它还会返回自我们上次重启时钟以来流逝的时间。\n\
  \n结果是，在之前的代码中，我们声明了一个类型为 `Time` 的对象并命名为 `dt`，用它来存储 `clock.restart()` 函数返回的值。\n\n\
  现在，我们有了一个名为 `dt` 的 `Time` 对象，它保存了自我们上次更新场景并重启时钟以来流逝的时间。也许你已经看出接下来的发展了。\n\n让我们为游戏添加一些代码，然后看看我们可以用\
  \ `dt` 做什么。\n\n### Note\n`dt` 代表 **delta time**（增量时间），即两次更新之间的时间。\n\n## 移动云朵和蜜蜂\n\
  让我们利用自上一帧以来的流逝时间为蜜蜂和云朵注入生命。这将解决在不同电脑上保持一致帧率率的问题。\n\n### 赋予蜜蜂生命\n我们想做的第一件事是将蜜蜂设置在特定的高度和速度。我们只希望在蜜蜂非激活状态下这样做。因此，我们将接下来的代码封装在一个\
  \ if 块中。检查并添加高亮的代码，然后我们来进行讨论：\n\n```cpp\n/*\n****************************************\n\
  Update the scene\n****************************************\n*/\n\n// Measure time\n\
  Time dt = clock.restart();\n\n// Setup the bee\nif (!beeActive)\n{\n// 蜜蜂有多快\nsrand((int)time(0));\n\
  beeSpeed = (rand() % 200) + 200;\n// 蜜蜂有多高\nsrand((int)time(0) * 10);\nfloat height\
  \ = (rand() % 500) + 500;\nspriteBee.setPosition(2000, height);\nbeeActive = true;\n\
  }\n\n/*\n****************************************\nDraw the scene\n****************************************\n\
  */\n```\n\n现在，如果蜜蜂不是激活状态（就像游戏刚开始时一样），`if(!beeActive)` 将为真，上面的代码将按以下顺序执行这些操作：\n1.\
  \ 种子随机数生成器\n2. 获取一个 199 到 399 之间的随机数，并将结果赋值给 `beeSpeed`\n3. 再次种子随机数生成器\n4. 获取一个\
  \ 499 到 999 之间的随机数，并将结果赋值给一个新的浮点型变量 `height`\n5. 将蜜蜂的位置设置为 x 轴上的 2000（刚好在屏幕右侧之外）以及\
  \ y 轴上等于任意的高度\n6. 将 `beeActive` 设置为真\n\n### Note\n注意，`height` 变量是我们在游戏循环内部声明的第一个变量。此外，由于它是在\
  \ if 块内部声明的，因此在 if 块外部实际上是“不可见”的。这对于我们的使用没有问题，因为一旦我们设置了蜜蜂的高度，就不再需要它了。这种影响变量的现象被称为**作用域**（scope）。我们将在第四章：*循环、数组、Switch、枚举和函数\
  \ - 实现游戏机制*中更深入地探索它。\n\n如果我们运行游戏，蜜蜂实际上还不会发生任何变化，但现在蜜蜂处于激活状态了，我们可以编写一些当 `beeActive`\
  \ 为真时运行的代码。添加以下高亮代码，正如你所看到的，只要 `beeActive` 为真，它就会执行。这是因为在 `if(!beeActive)` 块之后紧跟着一个\
  \ `else`：\n\n```cpp\n// Set up the bee\nif (!beeActive) {\n    // 蜜蜂有多快\n    srand((int)time(0));\n\
  \    beeSpeed = (rand() % 200) + 200;\n}\nelse\n    // 移动蜜蜂\n    {\n        // 蜜蜂有多高\n\
  \        srand((int)time(0) * 10);\n        float height = (rand() % 1350) + 500;\n\
  \        spriteBee.setPosition(2000, height);\n        beeActive = true;\n\n   \
  \     spriteBee.setPosition(\n            spriteBee.getPosition().x - (beeSpeed\
  \ * dt.asSeconds()), \n            spriteBee.getPosition().y\n        );\n\n   \
  \     // 蜜蜂是否到达了屏幕的右边缘？ \n        if (spriteBee.getPosition().x < -100)\n      \
  \  {\n            // 设置准备好在下一帧变成全新的云朵\n            beeActive = false;\n        }\n\
  \    }\n```\n\n```cpp\n/*\n**************************************** Draw the scene\n\
  ******************************** */\n```\n\n在 `else` 块中，发生了以下情况。根据以下标准改变蜜蜂的位置。`setPosition`\
  \ 函数使用 `getPosition` 函数获取蜜蜂的当前 x 坐标。然后它在那个坐标上加上 `beeSpeed * dt.asSeconds()`。\n\n\
  `beeSpeed` 变量的值是每秒像素数，是在上一个 if 块中随机赋值的。`dt.asSeconds()` 的值是 1 的一个分数，代表动画的上一帧花费了多长时间。\n\
  \n假设蜜蜂当前的 x 坐标为 1000。现在假设一台相当基础的电脑每秒循环 5000 帧。这意味着 `dt.asSeconds()` 将是 0.0002。进一步假设\
  \ `beeSpeed` 被设置为最大值 399 像素/秒。那么，确定 `setPosition` 使用的 x 坐标值的代码可以这样解释：\n`1000 - 0.0002\
  \ * 399`\n\n因此，蜜蜂在 x 轴上的新位置将是 999.9202。我们可以看到蜜蜂正在非常平滑地向左漂移，然后回到右侧。\n\n## Tip\n当然，真正的蜜蜂会停留很久，并在你试图集中注意力看树时骚扰你。我们将在下一个项目中制作更聪明的角色。\n\
  \n## 吹动云朵\n我们想做的第一件事是在特定的高度和速度设置云朵。我们只希望在云朵非激活状态下这样做。因此，我们将接下来的代码封装在一个 if 块中。在刚刚为蜜蜂添加的代码之后，检查并添加高亮的代码，然后我们来进行讨论。它与我们为蜜蜂使用的代码几乎相同：\n\
  \n```cpp\n// Manage the clouds\n// Cloud 1\nif (!cloud1Active)\n{\n    // 云朵有多快\n\
  \    srand((int)time(0) * 10);\n    cloud1Speed = (rand() % 200);\n    // 云朵有多高\n\
  \    srand((int)time(0) * 10);\n    float height = (rand() % 150);\n    spriteCloud1.setPosition(-200,\
  \ height);\n    cloud1Active = true;\n}\n```\n\n我们刚刚添加的代码与蜜蜂代码之间的唯一区别是我们在处理不同的精灵图（sprite），并为随机数使用了不同的范围。此外，我们对\
  \ `time(0)` 返回的结果乘以 10，这样我们就能保证为每朵云都获得一个不同的种子。当我们接下来编写其他云朵的移动代码时，你会看到我们分别使用了 `*20`\
  \ 和 `*30`。\n\n\n\n\n现在我们可以在云激活时采取行动了。我们将在 `else` 块中执行此操作。与 `if` 块一样，代码与蜜蜂的代码相同，只是所有代码都运行在云上而不是蜜蜂上：\n\
  \n```cpp\n // 管理云\nif (!cloud1Active)\n{\n    // 云移动有多快\n    srand((int)time(0)\
