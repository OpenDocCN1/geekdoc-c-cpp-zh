    \ 3.3 Relative Risk Regression Models\n\nDue to the popularity of the Cox model\
    \ (Cox, 1972) in modern survival analysis, proportional hazards models (also known\
    \ as relative risk or relative hazard models) have prevailed. These models assume\
    \ that covariates have a multiplicative effect on the hazard for an event, and\
    \ they are formulated as\n\n```\n$h_i(t \\mid w_i) = \\lim_{dt \\to 0} \\frac{Pr(t\
    \ \\leq T^* < t + dt \\mid T^* \\geq t, w_i)}{dt} \\n= h_0(t)\\exp(\\gamma^T w_i),\
    \ $\n```\n\nwhere $w_i^T = (w_{i1}, \\dots, w_{ip})$ denotes the vector of covariates\
    \ that are assumed to be associated with the hazard of each subject, and $\\gamma$\
    \ denotes the corresponding vector of regression coefficients. Function $h_0(t)$\
    \ is called *baseline hazard* function and corresponds to the baseline risk function\
    \ of a subject that has $\\gamma^T w_i = 0$. Depending on whether the baseline\
    \ risk function has a constant scale parameter, $\\gamma^T w_i$ may or may not\
    \ include an intercept $\\gamma_0$. Writing (3.6) in the log scale,\n\n```\n$log\
    \ h_i(t \\mid w_i) = log h_0(t) + \\gamma_1 w_{i1} + \\gamma_2 w_{i2} + \\dots\
    \ + \\gamma_p w_{ip},\n```\n\nwe observe that the regression coefficient $\\gamma_j$,\
    \ for predictor $w_j$, denotes the change in the log hazard at any fixed time\
    \ $t$ if $w_j$ is increased by one unit while all other predictors are held. Analogously,\
    \ $\\exp(\\gamma_j)$ denotes the ratio of hazards for one unit change in $w_{ij}$\
    \ at any time $t$. In general, the ratio of hazards for a subject $i$ with covariate\
    \ $w_i$ compared to subject $k$ with covariate $w_k$ is\n\n```\n$h_i(t \\mid w_i)\
    \ / h_k(t \\mid w_k) = \\exp(\\gamma^T (w_i - w_k)).$\n```\n\nAs noted in Section\
    \ 3.1, one of the implications of censoring is inferences may be sensitive to\
    \ misspecification of the distribution of the event"
