    # 7.4.2 Discrimination Measures for Survival Outcomes


    To extend the definitions of sensitivity and specificity from the binary setting
    presented in the previous section to survival data, we view an event as a time-dependent
    binary outcome, taking the value 0 for all the time points prior to the event
    and the value 1 afterwards. In fact, this representation of survival outcomes
    is equivalent to the count representation of time-to-event outcomes $N_i(t) =
    I(t \geq T_i^*)$, introduced in Section 3.5. The time-dependent nature of the
    binary outcome $N_i(t)$ allows for several potential definitions of sensitivity
    and specificity depending on the manner subjects are classified as either ''cases''
    or ''controls'' at any particular time $t$. A taxonomy of the different possibilities
    we have available in this context has been proposed by Heagerty and Zheng (2005).
    Focusing on a scalar marker $y_i$ that is used as a predictor for an event, the
    three main families of accuracy measures are


    +   1. Cumulative Sensitivity / Dynamic Specificity:

    $$TP_i^*(c) : Pr(y_i > c | T_i^* \leq t), \quad \text{and}$$

    1-FP_i^*(c) : Pr(y_i \leq c | T_i^* > t).$$


    Under these definitions at any fixed time, the entire population is classified
    as either a case or a control on the basis of their event status at time $t$.
    In addition, each subject plays the role of a control for times $t < T_i^*$; but
    contributes as a case for later times $t \geq T_i^*$.


    +   2. Incident Sensitivity / Static Specificity:

    $$TP_i^*(c) : Pr(y_i > c | T_i^* = t), \quad \text{and}$$

    1-FP_i^*(c) : Pr(y_i \leq c | T_i^* > t).$$


    These definitions have been adopted by Etzioni et al. (1999) and Slate and Turnbull
    (2000), and that each subject does not change status and is classified as either
    a case or a control. Cases are stratified according to the time the event occurs,
    and controls are defined as those subjects who are event free through a fixed
    follow-up period (0, i).


    +   3. Incident Sensitivity / Dynamic Specificity:

    $$TP_i^*(c) : Pr(y_i > c | T_i^* = t), \quad \text{and}$$

    1-FP_i^*(c) : Pr(y_i \leq c | T_i^* > t).$$


    Under this approach a subject can play the role of a control for all'
