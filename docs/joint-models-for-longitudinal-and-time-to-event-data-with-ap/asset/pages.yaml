    tion and accumulated biomarker levels) to produce predictions of medically relevant
    outcomes, gain a better understanding of the disease dynamics, and ultimately
    make the most optimal decision at that time. When new information is recorded,
    physicians would be interested in updating these predictions, and therefore proceed
    in a time dynamic manner.


    When good predictions are of interest, it would be useful to combine all available
    information we have for a patient in order to account for the biological interrelations
    between the outcomes. In the PBC dataset for example, it is clear from the definition
    of the biomarkers that they measure different aspects of liver functioning. Thus,
    if we were to base predictions on one of those markers and ignore the others,
    we would discard valuable information. This would unavoidably imply that we would
    not reach the maximum of the predictive capability that we could have achieved
    all biomarkers simultaneously combined. It is evident, therefore, that a modeling
    approach that combines all markers in a single model is advantageous because it
    utilizes all available information. The added value of combining markers for prediction
    has been empirically illustrated by Fieuws et al. (2008) who noted that predictions
    of graft failure in a kidney transplant study based on a joint model using recorded
    biomarkers of kidney functioning substantially outperformed the separate analysis
    per marker.


