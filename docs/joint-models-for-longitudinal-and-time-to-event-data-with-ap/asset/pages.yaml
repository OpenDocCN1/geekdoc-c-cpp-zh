  md: '# Joint Models for Longitudinal and Survival Data


    baseline measurement. The model takes the form:


    ```

    $y_i(t) = m_i(t) + \varepsilon_i(t)\n\n$\beta_0 + \beta_1Predns_i + \beta_2t +
    \beta_3TO_i + \beta_4\{Predns_i \times t}$\nn\n$\beta_5\{Predns_i \times TO_i}
    + b_{i0} + b_{i1}t + \varepsilon_i(t)$,

    ```


    where Predns denotes the dummy variable for prednisone treatment group, and TO
    is the dummy variable for the baseline measurement. The R code to fit the model
    is


    ```

    > prothrob$t0 <- as.numeric(prothrob$time == 0)\n\n> lmeFitBsp.pro <- lme(pro
    ~ treat * (time + t0), random ~ time | id, data = prothrob)

    ```


    For the survival submodel we include as a time-independent covariate treatment,
    and as-dependent the true underlying profile of the prothrombin index estimated
    from the longitudinal model, i.e.,


    ```

    $h_i(t) = h_0(t)\exp\{\gamma Predns_i + am_i(t)\}$

    ```


    which is fitted in R the code:


    ```

    > coxFit.pro <- coxph(Surv(Time, death) ~ treat, data = prothros, x = TRUE)

    ```


    We fit the joint model assuming a piecewise-constant baseline risk function $h_0(t)$
    with six knots placed at equally spaced percentiles of the observed events:


    ```

    > jointFitBsp.pro <- jointModel(lmeFitBsp.pro, coxFit.pro, timeVar = "time", method
    = "piecewise-PH-GH")

    ```


