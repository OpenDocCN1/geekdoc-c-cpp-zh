  md: "# Extensions of the Standard Joint Model\n\nTo incorporate these terms in our\
    \ analysis, we take advantage of the functionality provided by the derivForm and\
    \ interact arguments of jointModel(). More specifically, to include term m'(t)\
    \ in the linear predictors of the cause-specific hazards models, we use option\
    \ \"both\" for the parameterization argument, and provide the list that specifies\
    \ the fixed- and random-effects of m'(t) in the derivForm argument. This list\
    \ contains:\n\n```\n> dform <- list(fixed = I(2*year) * drug, indFixed = 3:6,\n\
    \   random = I(2*year), indRandom = 2:3)\n```\n\nAdditionally specify that the\
    \ effect of the slope trajectory is different for the two failure types we add\
    \ the component slope in the list provided in the interact argument. Similar to\
