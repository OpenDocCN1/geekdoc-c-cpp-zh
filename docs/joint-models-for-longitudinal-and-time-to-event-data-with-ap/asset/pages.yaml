    # 6.2 Dropout and Residuals


    The previous section introduced the basic types of residuals plots that are routinely
    used to validate the assumptions behind mixed models and relative risk models
    when these are separately fitted. Even though the same type of diagnostic plots
    can be easily constructed to inspect the fit of joint models, a problem is that
    the reference distribution of the longitudinal process is affected by the dropout
    caused by the occurrence of events. In particular, as we have discussed in Section
    4.6, when a patient experiences the event of interest this corresponds to a discontinuation
    of the collection of longitudinal information because either follow-up measurements
    can no longer be collected or their distribution changes after the event occurred
    and are considered irrelevant. As we have seen in Section 4., the dropout mechanism
    implied by joint models is of nonrandom nature, that is, it corresponds to a missing
    not at random mechanism (see Section 2.3.1). The implication of the nonrandom
    nature of the dropout mechanism is that the observed data, upon which the residuals
    are calculated, do not constitute a random sample of the target population (Verbeke
    et al., 2008; Fitzmaurice et al., 2004, Section 14.2). This in implies that residual
    plots based on the observed data alone can be misleading because these residuals
    should not be expected to ex'
