    where $N_i(t)$ is the counting process denoting the number of events for subject
    $i$ by time $t$, $R_i(t) = 1$ if subject $i$ is at risk at time $t$, and $R_i(t)
    = 0$ otherwise, $\hat{m}_i(t) = x_i^T(t)\beta + z_i^T(t)\tilde{b}_i$, and $\hat{h}_0(t)$
    denotes the estimated baseline risk. The idea behind these residuals is based
    on the Doob-Meyer decomposition of a process to a compensator plus a martingale
    process, which can be seen, in a broad sense, the classical statistical decomposition
    in which the data are described by a model noise. Thus, the martingale process
    can be seen as the equivalent of the residual term in the standard statistical
    decomposition. In plain terms, the residual $r_i^{tm}(t)$ can be viewed as the
    difference between the observed number of events for the $ith$ subject by time
    $t$, and the expected number of events by the same time based on the fitted model.
    The theoretical framework behind the use of martingales to investigate the fit
    of relative risk models has been provided by Barlow and Prentice (1988) and Therneau
    et al. (1990). The main use of these residuals is for a direct identification
