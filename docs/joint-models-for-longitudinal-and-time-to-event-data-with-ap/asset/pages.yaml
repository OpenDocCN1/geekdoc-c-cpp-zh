  md: 'Often the motivation behind building a statistical model is to provide predictions
    for an outcome of interest. In this chapter we illustrate how fitted joint models
    can be used to provide individualized predictions for the survival and longitudinal
    outcomes. An important characteristic of the setting we consider here is that
    these predictions have a dynamic nature, that is, as time progresses additional
    information is recorded for the patient, and therefore their predictions can be
    updated utilizing the new information. To assess the quality of these predictions
    we present discrimination measures based on Receiver Operating Characteristic
    (ROC) methodology.


    # 7.1 Dynamic Predictions of Survival Probabilities


    # 7.1.1 Definition


    We first turn our attention to predictions of survival probabilities. In particular,
    for a specific patient and at a specific time point during follow-up, we would
    like to utilize all available information we have at hand (including both baseline
    information and accumulated levels) to produce predictions of survival probabilities.
    Access to this information will enable physicians to gain a better understanding
    of the disease dynamics, and ultimately take the most optimal decision at that
    specific time point. Due to current trends in'
  merge: -1
