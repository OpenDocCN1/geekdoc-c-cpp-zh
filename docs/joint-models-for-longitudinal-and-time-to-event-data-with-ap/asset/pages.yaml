    Each row in the output table corresponds to a Wald test for all the parameters
    involving that specific term. Thus, the first row that contains the results for
    the time variable, corresponds to testing whether terms involving time are significantly
    different from zero, which in turn corresponds to the set of hypotheses given
    above. The result indicates a quite strong overall effect. For testing more general
    set of hypotheses, we can retain (4.16) as:


    ```

    $H_0 : L\theta = 0 \quad \quad H_a : L\theta \neq 0$,

    ```


    where L specifies the linear combination of coefficients we would like to test.
    For instance, to test whether the covariates in the survival model contribute
    something in explaining the variability in the risk for death of the advanced
    AIDS patients, i.e., to test the global null hypothesis:


    ```

    $H_0 : \quad \quad \gamma = \alpha = 0\nH_a : \quad \quad \gamma \neq 0 \text{
    or } \alpha \neq 0$,

    ```


    we specify that we are interested only in the parameters of the survival model,
    and that L is the identity matrix of appropriate dimensions:


    +   > anova(jointFit.aids, process = "Event", L = diag(2))

    Wald Tests Table


    # User-defined Contrasts Matrix


    ```

    Chisq df Pr(|Chi|)

    L67.3251 2 < 1e-04

    ```


    A problem with the Wald test for testing the fixed effects in the classical linear
    model is that it is based on standard errors which underestimate the true variability
    in $\beta$ because they do not take into account the variability introduced by
    estimating the variance components, i.e., the covariance matrix from the random
    effects (Dempster et al., 1981). For this reason, typically an approximate $F$
    distribution with appropriate degrees of freedom is used in place of the standard
    chi-squared distribution that the Wald test assumes. In joint models this problem
    can be exaggerated we do not ignore the fact that we estimate the variance components,
    but also that we need to estimate the survival process. Asymptotically, we expect
    that the Wald statistic will follow the chi-squared distribution, but in finite
    samples there has not been much work in the joining literature to investigate
    its properties. Therefore, it is generally advisable to prefer likelihood ratio
    tests even though they are more computationally expensive.


    The likelihood ratio test is also implemented by function an() by supplying arguments
    as two fitted joint models, with the first one being the model under the null
    hypothesis. As an illustration we are testing for the treatment effect in the
    risk for death. The Wald test included in the output of the summary() function
    indicated there is non-negligible difference'
