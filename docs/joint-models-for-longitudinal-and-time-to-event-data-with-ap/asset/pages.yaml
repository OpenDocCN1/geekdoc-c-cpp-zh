    If the event is death, it expresses the probability that death occurs after $t$,
    that is the probability of surviving time $t$. Assuming that $T^*$ is continuous,
    the survival function is defined as


    ```

    $S(t) = \Pr(T^* > t) = \int_{t}^{\infty} p(s) \ ds,$$

    ```


    When $p(\cdot)$ denotes the corresponding probability density function. The survival
    function is nonincreasing as $t$ increases, with $S(t=0)$ always equal to one.
    Another function that plays a prominent role in survival analysis is the hazard
    function. This describes the instantaneous risk for an event in the time interval
    $[t, t+dt]$ provided survival up to $t$, and is defined as


    ```

    $h(t) = \lim_{dt\to0} \frac{\Pr(T^* \leq t+dt | T^* \geq t)}{dt}, \quad t > 0.$

    ```


    Due to its definition, $h(\cdot)$ is also called the instantaneous risk function
    or simply risk function. The survival can also be expressed in terms of the risk
    function as


    ```

    $S(t) = \exp{-\H(t)\} = \exp{-\int_{0}^{t} h(s) \ds\}, \quad (3.1)

    ```


    where $\H$ is known as the cumulative risk (or cumulative hazard) function that
    describes the accumulated risk up until time $t$. Function $\H(t)$ also can be
    interpreted as the expected number of events to be observed by time $t$.


    When we are interested in estimating these two functions or any other characteristic
    of the event distribution, from a random sample at hand, censoring must be taken
    into account. In particular, let $T_i$ denote the observed event time for subject
    $i$, defined as the minimum of the true event time and the censoring time $C_i$.
    We also introduce the event indicator $\delta_i = (T_i \leq C_i)$ that takes the
    value 1 if the observed event time corresponds to a true event time and 0 otherwise,
    where $I(\cdot)$ denotes the indicator function. In general, in survival analysis,
    we are also estimating characteristics of the distribution of $T_i^*$ using only
    the available information, i.e., $\{T_i, \delta_i\}$. We discuss the estimation
    of the survival function has been proposed by Kaplan and Meier (1958). This is
    a nonparametric estimator that does not make any assumptions for the underlying
    distribution of the failure times. To introduce this estimator, let $t_1, \dots,
    t_k$ denote the unique event times in the sample at hand. Using the law of total
    probability, the probability of surviving any time point $t$ can be written as
    the product of the conditional probabilities:


    ```

    $\Pr(T^* > t) = \Pr(T^* > t | T^* > t-1) \times \Pr(T^* > t-1 | T^* > t-2) \times
    \dots$

    ```


    To estimate survival probabilities at each unique event time, we utilize the above
    expansion, and in the calculation of the conditional probabilities, we account
    for censoring by suitably adjusting the number of subjects at risk'
