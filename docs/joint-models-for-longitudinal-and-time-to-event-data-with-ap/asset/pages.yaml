    The counting process formulation of the Cox model is a quite general formulation
    that not only allows for time-dependent covariates but also for truncation, multiple
    time scales, multiple events per subject and various forms of case-cohort models,
    among others (Therneau and Grambsch, 2000). However, despite this flexibility
    the extended Cox model is not appropriate when the time-dependent covariates are
    of endogenous nature. This is because the extended Cox model assumes that time-dependent
    covariates are predictable, measured without error, and have their complete path
    specified. The particular way the Cox model handles time-dependent covariates
    under the counting processes formulation is illustrated in Figure 3.2. More, time-dependent
    covariates are assumed to change value at the follow-up visits and remain constant
    between visits. The model postulates that the hazard for an event, at any time
    point t, is associated with the extrapolated value of the covariate at the same
    time point. It is evident that this step-function approximation is unrealistic
    for many endogenous covariates, such as biomarkers. For example, in the analysis
    for Liver Cirrhosis dataset presented, it is not reasonable to assume that the
