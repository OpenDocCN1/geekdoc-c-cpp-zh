    #  5.4 Latent Class Joint Models


    Another class of joint models related to the stratified joint model presented
    in Section 5.3, is the latent class joint model (Prousst-Lima et al., 2009; Lin
    et al., 2004, 2002). The motivation behind this type of joint models is also to
    account for possible heterogeneity in the population. However, and contrary to
    the stratified joint model, latent class joint models assume that the subpopulations
    that constitute the population are *latent*, thus that heterogeneity is not captured
    by any of the observed covariates.


    To define latent class joint models, we assume that there are $G$ subpopulations
    that constitute our original population and we introduce the unobserved class
    indicator $c_i = 1, \dots, G$ that denotes the class membership of the $i^{th}$
    subject. These models work under the following set of conditional independence
    assumptions:


    ```

    $p(T_i, \delta_i, y_i | c_i = g, b_i; \theta) = p(T_i, \delta_i | c_i = g; \theta)
    p(y_i | c_i = g, b_i; \theta), \text{ and}\\np(y_i | c_i = g, b_i; \theta) = \prod_{j}
    p(y_{ij}(t_{ij}) | c_i = g, b_i; \theta).\n$$

    ```


    In particular, these models assume that the correlations between the repeated
    measurements in the longitudinal outcome are captured by the random effects $b_i$,
    whereas the association between the event time and longitudinal processes is explained
    by the latent class joint model $c_i$. The use of two latent components is advantageous
    from the point of view that it allows for more flexible association structures
    compared to the classical joint model that assumes the same set of random effects
    $b_i$ to account for both types of association (see Sec-'
  merge: -1
