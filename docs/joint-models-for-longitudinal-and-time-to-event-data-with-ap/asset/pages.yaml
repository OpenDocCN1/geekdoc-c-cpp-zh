    # Analysis of Event Time Data


    This chapter introduces basic concepts for the analysis of survival data and the
    class of relative risk models that constitute the second building block of joint
    models for longitudinal and event time data. Special attention is given to the
    handling of time-dependent covariates. In particular, we present the two types
    of time-varying covariates (i.e., endogenous and exogenous), and explain when
    a joint model for the covariate process and the risk for an event is required
    to provide valid inferences.


    # 3.1 Features of Event Time Data


    The primary aim of many studies is to analyze the time until a prespecified event
    of interest occurs. In these settings, the response variable is the time until
    that event, which is often called failure time, survival time, or event time.
    Survival analysis is most heavily used in clinical and epidemiological studies,
    in which the event may be death, the appearance of a tumor, the development of
    some disease, recurrence of a disease, conception, or cessation of smoking. However,
    event times also are frequently encountered in other disciplines. For example,
    in sociology we could be interested in the duration of a first marriage, in marketing
    the length of subscription to a newspaper or a magazine, and in industry the time
    a component of machine operates without any failures. In the past, the study of
    survival data has focused on estimating the probability of survival, and simple
    group comparisons of the survival distributions'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Joint Models for Longitudinal and Survival Data


    of experimental subjects under different conditions. In recent years, focus has
    mainly turned to the statistical modeling of survival data. The advantages of
    regression models used in survival analysis are numerous. Multiple independent
    prognostic factors can be analyzed simultaneously, treatment differences can be
    assessed while adjusting for heterogeneity and imbalances in baseline characteristics,
    and predictions can become better.


    When it comes to the statistical analysis of failure times, the first feature
    that must be taken into account is the shape of their distribution. In particular,
    due to the fact that event times must be positive, they very often have skewed
    of distribution. Thus, statistical methods that rely on normality are not directly
    applicable, and if used for survival data, may produce invalid results. This problem,
    however, can be easily overcome in many occasions by working with a suitable transformation
    of the event times, such as the algorithm or the square root. The most important
    characteristic that distinguishes survival analysis from other areas in statistics
    is censoring. The defining feature of censored data is that the event of interest
    is not fully observed on all subjects under study. The implications are twofold.
    First, standard statistical tools, such as the sample average and standard deviation,
    the t-test, and linear regression cannot be used because we assume that we have
    complete information, and therefore produce biased estimates of the distribution
    of event times and related quantities. Second, inferences can be more sensitive
    to a misspecification of the distribution of survival times compared to complete
    data. The analysis of censored data depends on the nature of the censoring mechanism
    describes how censoring occurs. A classification of censoring mechanisms is with
    regard to the relative positioning on the time axis of censoring and true event
    times. In particular, we have the following categorization:


    **Right censoring:** For a subset of the subjects under study, the event of interest
    is only known to occur after a certain time point. For example, a subject may
    reach the end of the study without having experienced the event of interest (Type
    I censoring), or the study may be terminated after a prespecified number of events
    has been recorded and, not all subjects had an event when the study was closed
    (Type II censoring) or a subject may move away from the study area and not be
    available to continue (random censoring). In all these examples for some of the
    subjects under study it is known that their event times took place after the last
    time point they have been observed.


    **Left censoring:** For a subset of the subjects under study, the event of interest
    is only known to occur before a certain time point. A typical example of left
    censoring is the age at which first grade children are able to spell their name.
    Some children are able to do so before the first grade, but when exactly is not
    precisely known.


    **Interval censoring:** For a subset of the subjects under study, the event of'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Analysis of Event Time Data


    interest is only known to occur between two certain time points. Interval censoring
    typically occurs in studies in which interest lies in the time to onset of a disease.
    For example, HIV-infected patients are periodically tested for the onset of AIDS.
    When a patient is found positive, what is actually known is that this patient
    developed the disease at some point in between the pre-last and last visits.


    Interval censoring is the most general type of censoring because in fact includes
    both right and left censoring when the upper or lower limits of the interval that
    contains the true failure time is infinity or zero, respectively.


    A second classification of censoring mechanisms has to do with whether or not
    the probability of a subject being censored depends on the failure process. More
    specifically, we have:


    **Informative censoring:** When a subject withdraws from the study directly to
    the expected failure time, for example, because of a worsening of prognosis. To
    put it more, a censoring mechanism is informative if at any time $t$, the failure
    rates that apply to the subject in the study are different from those that apply
    to subjects who have dropped out of the study. In a sense, informative censoring
    is similar in spirit to the MNAR missing data mechanism in longitudinal studies
    introduced in Section 2.3.1.


    **Noninformative censoring:** When a subject withdraws from the study for reasons
    not related to her prognosis, but it can depend on covariates. Making the same
    analogy with longitudinal studies, noninformative censoring corresponds to a MCAR
    missing data mechanism.


    Depending on the type of censoring mechanism, different inference procedures should
    be followed. With respect to the first categorization, the majority of the literature
    has focused on methods that can handle right censored data because these are the
    most frequently encountered. With respect to the second categorization, and when
    the censoring mechanism is informative, unfortunately, very few things can be
    done. Similarly to the MNAR missing data mechanism in longitudinal studies, the
    problem is that the observed data does not contain enough information to describe
    the censoring mechanism. Therefore, unless external information is provided, the
    possibilities for a meaningful analysis in these cases are rather limited. Due
    to these complications, the majority of the literature has focused on methods
    for noninformatively censored data. In this book we will only consider noninformative
    right censoring.


    # 3.2 Basic Functions in Survival Analysis


    Let $T^*$ denote the random variable of failure times under study. The function
    that is primarily used to describe the distribution of $T^*$ is the survival function.'
