    To complete the specification of (4.1) we need to discuss the choice for the baseline
    risk function $h_0(\cdot)$. As we have seen in Chapter 3, in standard survival
    analysis it is customary to leave $h_0(\cdot)$ completely unspecified in order
    to avoid the risk of misspecifying the distribution of survival times. However,
    within the joint modeling framework and we will explain later in Section 4.3.3,
    it turns out that following such a route may lead to an underestimation of the
    standard errors of the parameter estimates (Hsieh et al., 2006). To avoid such
    problems we will need explicitly define $h_0(\cdot)$. A standard option is to
    use a risk function corresponding to a known parametric distribution. In the survival
    analysis context, typically used distributions include the Weibull, the log-normal
    and the Gamma. Alternatively, and more preferably, we can opt for a parametric
    flexible specification of the baseline risk function. Several approaches have
    been proposed in the literature to flexibly model the baseline risk function.
    In instance, Whitemore and Killer (1986) use step-functions and linear splines
    to obtain a non-parametric estimate of the risk function, Rosenberg (1995) utilized
    a B-splines approximation, and Herndon and Harrell (1996) restricted cubic splines.
    Two simple options that work quite satisfactorily in practice are the piecewise-constant
    and regression splines approaches. Under the piecewise-constant model, the baseline
    risk function takes:


    ```

    $h_0(t) = \sum_{q=1}^{Q} \xi_q I(v_{q-1} < t \leq v_q), \quad (4.3)$

