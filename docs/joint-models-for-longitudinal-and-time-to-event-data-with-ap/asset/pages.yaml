    # 7.4 Prospective Accuracy for Joint Models


    The previous section demonstrated that different features of the marker process
    may be more strongly associated with the risk for an event than others. Information
    criteria, such as the AIC and BIC, can be useful when interest is in the overall
    predictive ability of the joint model encompassing both the longitudinal and survival
    parts. However, often the focus may primarily be in determining how good the longitudinal
    marker is in predicting this outcome. The answer to this question has received
    a lot of attention in the literature, where two main lines of research have emerged.
    The first focuses on calibration measures and how well the model predict the observed
    data (Graf et al., 1999; Scheper and Henderson, 2000; Henderson et al., 2002;
    Gerds and Schumacher, 2006), and the second focusing on discrimination measures
    and how well the model can discriminate between patients who will experience the
    event in a short time frame, from patients who will experience it in a later time
    (Harrel et al., 1982; Heagerty et al., 2000; Heagerty and Zheng, 2005; Antolini
    et al., 2005; Pencena et al., 2008). In this section we focus on the latter favour
    of measures, and we rely on a Receiver Operating Characteristic (ROC) approach
    to assess'
  merge: -1
  pgno: 210
- img_proc: true
