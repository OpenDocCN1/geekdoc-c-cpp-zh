    Even though the simplicity of the random-intercepts model is appealing, it poses
    the unrealistic restriction that the correlation between repeated measurements
    remain constant over time. Intuitively, we would expect measurements that are
    further apart in time to be less correlated than measurements taken at subsequent
    time points. An extension that allows for a more flexible specification of the
    covariance structure is the random-intercepts and random-slopes model:


    > $y_{ij} = \beta_0 + \beta_{1i}t_{ij} + b_{i1}t_{ij} + \varepsilon_{ij},$

    $$b_i \sim N(0, D), \quad \varepsilon_{ij} \sim N(0, \sigma^2),$


    with $b_i = (b_{i0}, b_{i1})$. This model introduces additional random terms,
    and assumes that the rate of change in the CD4 cell count is different from patient
    to patient. This graphical representation is given in the right panel of Figure
    2.2. To fit this model with lme(), we specify in the random argument a formula
    that includes the time variable (the intercept is always included by default):


    ```

    > lmeFit.slp <- lme(CD4 ~ obstime, random = ~ obstime | patient, data = aids)

    > summary(lmeFit.slp)

    ```'
