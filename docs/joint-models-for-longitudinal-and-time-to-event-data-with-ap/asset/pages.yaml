  md: "# Joint Models for Longitudinal and Survival Data\n\nmedical practice towards\
    \ personalized medicine, the prominent role such individualized predictions can\
    \ play in that respect, there has recently been a lot of interest within the joint\
    \ modeling framework on this front (Rizopoulou, Proust-Lama and Taylor, 2009;\
    \ Yu et al., 2008; Garre et al., 2008).\n\nTo make it more, based on a joint model\
    \ fixed in a random sample $D_n = \\{T_i, \\delta_i, y_i; i = 1, \\dots, n\\}$,\
    \ we are interested in predicting survival probabilities for a new subject $i$\
    \ that has provided a set of longitudinal measurements $Y_i(t) = \\{y_i(s); 0\
    \ \\le s \\le t_i\\}$, and has a vector of covariates $W_i$. As we have seen in\
    \ Section 3.4, an important characteristic of the endogenous nature of $y_i(t)$\
    \ is that it is directly related to the failure mechanism, that is, providing\
    \ longitudinal measurements up to $t$, in implies survival up to this time point.\
    \ Hence, it is more relevant to focus on the conditional probability of surviving\
    \ time $u > t$ given up to $t$, i.e.,\n\n```\n$$\\pi_i(u \\mid t) = Pr(T_i^* \\\
    ge u \\mid T_i^* > t, Y_i(t), W_i, D_n; \\theta^*), \\quad t > 0, \\quad (7.1)$\n\
    ```\n\nwhere $\theta^*$ denotes the true parameter values. From its definition\
    \ note that $\\pi_i(u \\mid t)$ has a dynamic nature. That is, when new information\
    \ will be recorded for the patient at time $t' > t$, we can update these predictions\
    \ and obtain $\\pi_i(u \\mid t')$, and therefore proceed in a time dynamic manner.\n\
    \n# 7.1.2 Estimation\n\nThe estimation of the subject-specific conditional survival\
    \ probabilities takes full advantage of the conditional independence assumptions\
    \ used to define the joint model. Namely, under condition (4.7) we observe that\
