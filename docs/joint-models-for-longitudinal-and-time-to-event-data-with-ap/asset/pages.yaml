- img_proc: true
  md: "# Joint Models for Longitudinal and Survival Data\n\n# 7.4.5 Estimation under\
    \ the Joint Modeling Framework\n\nThe estimation of sensitivity, specificity,\
    \ and the AUC in the binary setting described in Section 7.4.1 can be simply based\
    \ on the calculation of the respective frequencies in the observed sample. For\
    \ example, the sensitivity can be estimated as the proportion of subjects in the\
    \ sample with $y_i > c$ from the subjects who were diseased. In the survival context,\
    \ however, estimation of the prospective accuracy measures is complicated by censoring.\
    \ In particular, note that these measures were defined with respect to the true\
    \ event time variable $T^*i$. However, when we are interested in, say sensitivity\
    \ at a specific time point $t$, and a subject was censored at $t' < t$, then we\
    \ do not know her status at $t$, and therefore cannot be classified as case nor\
    \ control. This means that we cannot simply count the number of cases and controls\
    \ in the sample at hand for any prediction rules, as in the binary setting, but\
    \ we rather need to estimate the bivariate distribution of the true events and\
    \ the longitudinal measurements $\\{T^*i, y_i\\}$. In respect, the joint modeling\
    \ framework is greatly advantageous because it provides a complete specification\
    \ for this distribution. That is, with joint models we can simultaneously account\
    \ for both censoring and the endogenous nature of the longitudinal outcome, and\
    \ in addition, we can also easily adjust for any baseline covariates affecting\
    \ the risk for an event by introducing them in design matrix $W$ of the survival\
    \ model.\n\nFor ease of exposition, we will only focus on the estimation of sensitivity\
    \ in an analogous manner. Since we will follow a similar approach as in Sections\
    \ 7.1 and 7.2, and derive an appropriate simulation scheme to produce a Monte\
    \ Carlo estimate of sensitivity and its standard error. More specifically, we\
    \ observe that (7.14) is written as (condition on covariates is omitted from the\
    \ following notation):\n\n```\n$Pr{P^*_i(t, k, c) | T^*i > t, T^*i \\in (t, t+\\\
    Delta t]; \\theta^*\\}$\n```\n\n```\n$= \\frac{Pr\\{P^*_i(t, k, c), T^*i \\in\
    \ (t, t+\\Delta t) | T^*i > t; \\theta^*\\}}{1 - Pr\\{T^*i > t + \\Delta t | T^*i\
    \ > t; \\theta^*\\}} \\quad (7.18)$\n```\n\nwhere $\theta^*$, as before, denotes\
    \ the true parameter values. Under assumptions (4.7) and (4.8), and the joint\
    \ model's definition, we can obtain further simplifications for the numerator\
    \ and denominator. In particular, the numerator takes form\n\n```\n$Pr{P^*_i(t,\
    \ k, c), T^*i \\in (t, t+\\Delta t] | T^*i > t; \\theta^*\\}$\n```\n\n```\n$=\
    \ \\int Pr\\{P^*_i(t, k, c), T^*i \\in (t, t+\\Delta t] | T^*i > t, b_i; \\theta^*\\\
    } p(b_i | T^*i > t; \\theta^*) db_i\\n= \\int Pr\\{P^*_i(t, k, c) | b_i; T^*i\
    \ \\in (t, t+\\Delta t] | T^*i > t, b_i; \\theta^*\\} \\times p(b_i | T^*i > t;\
    \ \\theta^*) db_i, \\quad (7.19)$\n```"
