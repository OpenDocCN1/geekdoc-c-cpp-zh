    # 1.3.3 Complex Hypothesis Testing


    Combinations of the previous two types of research questions are also often of
    interest. A typical example of this setting constitutes the evaluation of surrogate
    markers. In particular, for chronic conditions, as PBC, we could be interested
    to assess treatment efficacy using the short-term longitudinal serum bilirubin
    measurements instead of the survival endpoint, which is to ascertain. Prentice
    (1989) set three conditions for surrogate: (I) treatment must have an effect on
    patient survival; (II) treatment must have an effect on the marker, i.e., serum
    bilirubin; and (III) the effect of treatment should manifest through the marker,
    i.e., the risk for death given specific marker trajectory should be independent
    of treatment. It is evident that conditions (I) and (II) we need to separate models
    for the survival and longitudinal outcomes each containing treatment as a predictor.
    However, to check (III) a model for the survival outcome that conditions on both
    treatment and serum bilirubin is required itself. Given the characteristics of
    serum bilirubin as an endogenous time-dependent covariate explained above, joint
    models provide a flexible modeling framework to determine whether treatment has
    an effect on survival after accounting for serum bilirubin.


    A similar type of analysis is required when we are interested in simultaneously
    testing the effect of a baseline covariate in several outcomes. For instance,
    continuing on the same example mentioned above, serum bilirubin may not be a good
    biomarker in describing disease progression, and therefore treatment may still
    have influence on patient survival, even continuing on serum bilirubin. In this
    situation we could extend our analysis, and include additional biomarkers of disease
    progression, such as spiders and hematology. Interest could be then in testing
    for the effect of treatment in all markers simultaneously or testing for the association
    of one specific marker with the risk for death after correcting for the other
    markers. It is evident that in order to perform such tests we need a modeling
    approach that can flexibly capture the interrelationships between these outcomes.


    # 1.3.4 Prediction


    Statistical models are also often built to provide predictions of patient-related
    outcomes. In particular, due to current trends in medical practice towards personalized
    medicine, models that can provide subject-specific predictions of high quality
    can prove to be quite valuable. In practice, for a specific patient and at a specific
    time point during follow-up, physicians would like to utilize all available information
    they have at hand (including both baseline informa'
