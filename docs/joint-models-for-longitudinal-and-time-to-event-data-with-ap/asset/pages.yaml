  md: '# Joint Models for Longitudinal and Survival Data


    To illustrate the use of lme(), we perform a mixed analysis to describe the evolution
    in time of the square root CD4 cell count of the patients in the AIDS dataset.
    This dataset is available in R as the data frame aids in package JM (Rizopoulos,
    2012b) and can be loaded using the command


    ```

    > data(aids, package = "JM")

    ```


    We should note that in order to fit a mixed model using function lme() the data
    needs to be arranged in the so-called long format, which means measurements of
    each patient are stored in multiple lines. The AIDS dataset is already organized
    in this format; for example, the longitudinal responses for the first two patients
    are in the first seven lines:


    ```

    > aids[$patient %in% c(1,2), c("patient", "CD4", "obstime")\)]

    ```


    | patient | CD4 | obstime |

    |---|---|---|

    | 1 | 10.677078 | 0 |

    | 2 | 8.426150 | 6 |

    | 3 | 9.433981 | 12 |

    | 4 | 6.324555 | 0 |

    | 5 | 8.124038 | 6 |

    | 6 | 4.582576 | 12 |

    | 7 | 5.000000 | 18 |


    Column CD4 contains the square CD4 cell count measurements, and column obstime
    the time points at which the longitudinal response was recorded. We start our
    analysis with a simple linear mixed model that assumes a linear evolution in time
    and includes a single random effect term for each patient:


    This model postulates that the square root CD4 cell counts of all patients have
    the same evolution in time, but the patients differ at baseline, i.e., each patient
    has her own intercept with some patients starting with a higher CD4 count and
    with lower. This special type of linear mixed model is the random-intercept model,
    and its graphical presentation is provided in the left panel of Figure 2.2. The
    syntax of lme() is based on two arguments, named fixed and random, which R forms
    used to specify the fixed- and random-effects parts of the model (for more information
    on the details of R formulas, the reader is referred to Appendix A). For the formula
    in the random argument, the user should also specify the name of the grouping


    > ²If the dataset is in the wide format with the measurements of each patient
    stored in multiple columns, it can be transformed to the long format using either
    function reshape() from the stats package or from the reshape package (Wickham,
    2007).'
