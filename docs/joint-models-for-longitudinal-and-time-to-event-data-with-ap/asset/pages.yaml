    \ \\sim \\mathcal{N}(0, \\sigma^2), \\end{aligned}$ $$ (6.1)$\n\nand are defined\
    \ as:\n\n> $r_i^{ys}(t) = \\{y_i(t) - x_i^\top(t)\\hat{\beta} - z_i^\top(t)\\\
    hat{b}_i\\}$$ (6.2)$\n\nwith corresponding standardized version\n\n> $r_i^{yss}(t)\
    \ = \\{y_i(t) - x_i^\top(t)\\hat{\beta} - z_i^\top(t)\\hat{b}_i\\}/\\hat{\\sigma},$\n\
    \nwhere, as before, $\\hat{\beta}$ and $\\hat{\\sigma}$ denote the MLEs, and $bi$\
    \ the empirical Bayes estimates for the random effects. These residuals predict\
    \ the conditional errors $\\varepsilon_i(t)$, and can be used for checking the\
    \ homoscedasticity and normality-assumptions. On the other hand, the marginal\
    \ residuals focus on the marginal model for $y_i$ implied by the hierarchical\
