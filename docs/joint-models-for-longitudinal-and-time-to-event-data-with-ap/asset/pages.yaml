  md: '# Chapter 1


    # Introduction


    # 1.1 Goals


    In follow-up studies different types of outcomes are typically collected for each
    sample unit, which may include several longitudinally measured responses, and
    the time until an event of particular interest occurs. The research questions
    of interest in such studies often require the separate analysis of the recorded
    outcomes, but in many occasions interest may also lie in studying their association
    structure. A frequently encountered example of the latter case can be found in
    biomarker research, where many clinical studies are designed to identify biomarkers
    with strong prognostic capabilities for event time-comes. Standard examples include
    among others, human immunodeficiency virus (HIV) research in which interest lies
    in the association between CD4 cell counts or viral load and the time to Acquired
    immune deficiency syndrome (AIDS), liver cirrhosis studies that investigate the
    association between serum bilirubin and the time to death, and prostate cancer
    studies in which interest lies in the association between prostate-specific antigen
    (PSA) levels and the time to the development of prostate cancer. An important
    characteristic of these medical conditions is their dynamic nature. That is, the
    rate of progression is not only different from patient to patient but also dynamically
    changes in time for the same patient. Thus, the true potential of a biomarker
    in describing disease progression and its association with survival can only be
    revealed when repeated evaluations of the marker are considered in the analysis.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Joint Models for Longitudinal and Survival Data


    To address research questions involving the association structure between repeated
    measures and event times, a class of statistical models has been developed as
    joint models for longitudinal and time-to-event data. Currently, the study of
    these models constitutes an active area of statistics research that has received
    a lot of attention in the recent years. In particular, the early work on joint
    modeling approaches with application by Self and Pattan (1992) and DeGruttulla
    and Tu (1994), and the seminal papers by Faucett and Thomas (1996) and Welfands
    and Tsiatis (1997) who introduced what nowadays be called the standard joint model,
    there has been an explosion of developments in this field. Numerous papers have
    appeared proposing several extensions of the standard joint model including, others,
    the flexible modeling of longitudinal trajectories, the incorporation of latent
    classes to account for population heterogeneity, the consideration of multiple
    longitudinal markers, modeling multiple failure times, and the calculation of
    dynamic predictions and accuracy measures.


    The primary goal of this book is to provide a comprehensive introduction to this
    joint modeling framework. In particular, we will focus on the type of research
    questions they attempt to answer and the circumstances under which these models
    are appropriate to answer these questions. We will explain which are the key assumptions
    behind them, and how they can be optimally utilized to extract relevant information
    from the data. An additional aim of this book is to promote the use of these models
    in everyday statistical practice. To this end, (almost) all the theoretical material
    covered in the text is illustrated in real data examples using package JM (Rizopoulos,
    2012b, 2010) developed for the R software environment for statistical computing
    and graphics (R Development Core Team, 2012).


    # 1.2 Motivating Biliary Cirrhosis Data


    # 1.2.1 Primary Biliary Cirrhosis Data


    Primary biliary cirrhosis (PBC) is a chronic, fatal, but rare liver disease characterized
    by inflammatory destruction of the small bile ducts within the liver, which eventually
    leads to cirrhosis of the liver. The dataset we consider here comes from a study
    conducted by the Mayo Clinic from 1974 to 1984 (Murtaugh et al., 1994) that includes
    312 patients, 158 randomized to D-penicillin and 154 to placebo. The outcome of
    primary interest was patient survival and whether this could be prolonged by D-penicillin.
    In addition, we have information on baseline covariates (e.g., age at baseline,
    gender, etc.), and follow-up measurements for several biomarkers. These included,
    among others, serum bilirubin, the presence of spiders (blood vessel malformations
    in the skin) and hepatomegaly (enlarged liver). Here we will focus on the serum
    bilirubin level which is considered a strong indicator of'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    3


    ![](img/80066d15916b0c0be59c2a53b0550327_19_0.png)


    Figure 1.1: Smooth longitudinal profiles of 16 subjects from the PBC dataset.
    The solid line represents the fit of the loess smoother.


    disease progression, and, in particular, we are interested in the association
    of this marker with survival. The original clinical protocol for these patients
    specified visits at six months, one year, and annually thereafter. However, due
    to death and censoring, patients made on average 6.2 visits (st.dev.3.8 visits),
    resulting in a total of 1945 observations of serum bilirubin. By the end of the
    study 140 patients had died, 29 received a transplant, and 143 were still alive.
    Figure 1.1 shows smoothed longitudinal profiles of the log serum bilirubin for
    a sample of patients, from which it can be many of these profiles are nonlinear
    in time.


    # 1.2.2 AIDS Data


