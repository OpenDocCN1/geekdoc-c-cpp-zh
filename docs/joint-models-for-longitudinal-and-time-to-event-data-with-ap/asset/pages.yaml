  md: '# Joint Models for Longitudinal and Survival Data


    dimensionality of the random effects vector is considerably increased when the
    number of longitudinal outcomes Q is moderate to large. The problem is even further
    exacerbated when, in some of the outcomes, the subject-specific longitudinal profiles
    are nonlinear requiring even higher-dimensional random effects vectors. Multivariate
    joint models of this type have been considered by Rizopoulos and Ghosh (2011),
    Chi and Ibrahim (2006), Brown et al. (2005), and Lin et al. (2002) among others.


    An alternative approach that reduces the computational burden has been proposed
    by Proust-Lima et al. (2009). These authors postulated a multivariate joint model
    in which the longitudinal outcomes are considered as realizations of a single
    latent process $\Lambda_i(t)$, which is defined in continuous time and represents
    the common unobserved factor that drives the observed longitudinal trajectories.
    More specifically, the model form


    ```

    $$\Lambda_i(t) = x_i(t)\beta + z_i(t)b_i$$

    $$g_q\{E(y_{iq}(t)|b_i)\} = \Lambda_i(t) + u_{iq}$$

    ```


    with $y_{it}(t)$ belonging to the exponential family and $b_i \sim \mathcal{N}(0,
    D)$, as before. The extra random $u_{iq}$ are assumed normally distributed with
    mean zero and variance $\sigma^2_q$, independent of $b_i$, i.e., $\text{cov}(u_{iq},
    u_{iq''}) = 0$ for $q,q'' = 1,\dots,Q$ with $q \neq q''$. These subject-and-marker
    specific random-intercept terms represent interindividual variability not accounted
    for by the common latent structure $\Lambda_i(t)$ for both the association between
    the outcomes and $u_{iq}$''s for the extra correlation in the repeated measurements
    of each outcome. Another way to view these two sets of random effects is that
    $b_i$''s account for both the association... and the correlation in the repeated
    measurements of outcome $q$ not captured by $b_i$. The advantage of the latent
    process approach is that only a single random effect $u_{iq}$ is added for each
    of the $Q$ outcomes, thus keeping the dimensionality of the random effects vectors
    relatively low, and making this model computationally feasible. On the other hand,
    the disadvantage is that the postulated association structure between the outcomes
    is much restrictive because only a single set of random effects $b_i$ is used
    to explain the interrelations between them.'
