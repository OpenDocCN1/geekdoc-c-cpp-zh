    Contrary to the stratified Cox model with no direct estimate of the importance
    of the strata is produced, in the stratified risk model with a spline-approximated
    baseline risk function it is possible to utilize a formal statistical inference
    procedure to test whether improves the fit of the model. This is because in the
    spline approach we use a flexible yet parametric model to estimate the baseline
    hazard, whereas the Cox model is left completely unspecified. The only requirement
    for such a statistical test to be valid is the knots for the B-spline approximation
    of the log baseline risk function should be the same across strata, which is the
    default in package **JM**. A likelihood ratio test can be performed by fitting
    the unstratified model, and comparing it with the stratified one using anova().
    To perform the corresponding Wald test, **wald.strata()** can be used that directly
    controls the appropriate contrasts:


