    # A.2 Simple Manipulations


    # A.2.1 Basic R Objects


    The basic data objects in R are vectors, with the two main types being numeric
    vectors holding quantitative information and character vectors holding qualitative
    information. Vectors can be defined by means of the c() function; for example,
    the syntax defines a numeric vector of six elements


    ```

    > x <- c(1, 3, 5, 7, 2, NA)

    ```


    ```

    > x

    ```


    The NA stands for ‘not available’ and is the missing data identifier in R. The
    symbol "-" is the assignment operator and is used to store the result of function
    c() in the object x. A character vector can be similarly defined using the c()
    function, but the entries need to be input within quotes (either single or double):


    ```

    > y <- c("male", "male", "female")

    ```


    ```

    > y

    ```


    ```

    [1] "male" "male" "female"

    ```


    An additional type of objects used to specify a discrete grouping of components
    of others whose length are the factors. These are defined using the factor(),
    e.g.,


    ```

    > f <- factor(c(1,2,2,1,1,2), levels = c(1,2,3),

    labels = c("apple", "orange", "banana")

    ```


    ```

    [1] orange orange apple apple banana

    Levels: apple orange banana

    ```


    In this example we define a categorical grouping of the input numeric vector c(1,2,2,1,1,2)
    identified by the value of the levels, with labels specified by the labels argument.
    Note that even though there is occurrence of value 3 corresponding to the level
    ‘banana’, the factor object f is explicitly to include this possibility.


    Vectors can also be organized to a rectangular format and defining in that way
    matrices of appropriate dimensions. The basic functions to create matrices'
