  md: '# Longitudinal Data Analysis


    nal responses. Before discussing in more detail how biases problems may arise,
    we first need to introduce additional terminology that allow us to place formal
    conditions on the missing value mechanism and determine how this mechanism may
    influence subsequent inferences. In general, we assume that each subject $i$ in
    the study is designed to be measured at occasions $j=1, \dots, n_i$, meaning that
    for this subject, we expect to collect the vector of measurements $y_i = (y_{i1},
    \dots, y_{in_i})^T$. To distinguish between the response measurements we actually
    collected from the ones we have planned to collect, we introduce the missing data
    indicator defined as:


    ```

    $r_{ij} = \begin{cases} 1 & \text{if } y_{ij} \text{ is observed} \ 0 & \text{otherwise.}
    \end{cases}$

    ```


    Therefore, we obtain a partition of the complete response vector $y_i$ into two
    subvectors, the observed data subvector $y_i''$ containing $y_{ij}$ for which
    $r_{ij}=1$, and the missing data subvector $y_i^m$ containing the remaining components.
    The vector $r_i = (r_{i1}, \dots, r_{in_i})$ and the process generating $r_i$
    are referred to as the missing data process.


    When missingness is restricted to dropout or attrition, the missing data indicator
    $r_i$ is always of the form $(1, \dots, 1, 0, \dots, 0)$, and therefore can be
    replaced by the scalar variable $r_i^d$, defined as


    ```

    $r_i^d = 1 + \sum_{j=1}^{n_i} r_{ij}$.

    ```


    For an incomplete sequence, $r_i^d$ denotes the occasion at which dropout occurs,
