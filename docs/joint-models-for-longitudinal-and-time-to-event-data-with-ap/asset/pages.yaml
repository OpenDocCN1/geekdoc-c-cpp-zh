    \ given by the expression:\n\n```\n$$p(y_i) = \\int p(y_i \\mid b_i) p(b_i) \\\
    \ db_i.$\n```\n\nTaking advantage of the fact that the random effects enter linearly\
    \ in the specification of the conditional mean $E(y_i \\mid b_i)$, and both the\
    \ distribution of the longitudinal responses given the random effects $\\{y_i\
    \ \\mid b_i\\}$ and the distribution of the random effects $b_i$ are normal, the\
    \ above integral has a closed-form solution, and leads to an $n_i$-dimensional\
    \ normal distribution with mean $X_i\\beta$ and variance-covariance matrix $V_i\
    \ = Z_iZ_i^T + \\sigma^2 I_{n_i}$. Therefore, assuming independence across subjects,\
    \ the log-likelihood of a linear mixed model takes this form\n\n```\n$$\\ell(\\\
    theta) = \\sum_{i=1}^n \\log p(y_i; \\theta) \\\\n = \\sum_{i=1}^n \\log p(y_i\
    \ \\mid b_i; \\beta, \\sigma^2) p(b_i; \\theta_b) \\ db_i, \\quad (2.2)$\n```\n\
    \nwhere $\theta$ denotes the full parameter vector decomposed into the subvectors\
    \ $\theta^T =(\\beta^T, \\sigma^2, \\theta_b^T)$, with $\theta_b = \\text{vech}(D)$,\
    \ and\n\n```\n$$p(y_i; \\theta) = (2\\pi)^{-n_i/2}|V_i|^{-1/2} \\exp\\{-\\frac{1}{2}(y_i\
    \ - X_i\\beta)^T V_i^{-1}(y_i - X_i\\beta)\\},\\$$\n```\n\nwith $|A|$ denoting\
    \ the determinant of the square matrix $A$. If we assume that $V_i$ is known,\
    \ then the maximum likelihood estimator of the fixed-effects vector $\\beta$,\
    \ obtained by maximizing (2.2) conditional on the parameters in $V_i$, and corresponds\
    \ to the generalized least squares estimator:\n\n```\n$$\\hat{\\beta} =(\\sum_{i=1}^n\
    \ X_i^T V_i^{-1} X_i)^{-1} \\sum_{i=1}^n X_i^T V_i^{-1} y_i. \\quad (2.3)$\n```\n\
    \nWhen $V_i$ is not known, but an estimate of this matrix is available, then we\
    \ can estimate $\\beta$ using expression (2.3), in which $V_i$ is replaced by\
    \ $V_i$. To obtain an estimate for $V_i$, we can again employ the maximum likelihood\
    \ method, and maximize the log-likelihood $\\ell(\\theta_b, \\sigma^2)$ for a\
    \ given value of $\\beta$. As it is known from standard maximum likelihood theory,\
    \ and under certain regularity conditions, the maximum likelihood estimate of\
    \ $V_i$ will be asymptotically unbiased. However, in small samples, the ML estimate\
    \ of $V_i$ will be biased. This is, in fact, the same phenomenon encountered in\
    \ simple linear regression, where the maximum likelihood estimate of the error\
    \ variance, defined as:\n\n```\n$$\\hat{\\sigma}^2 = \\frac{\\sum_{i=1}^n (y_i\
    \ - x_i^T\\beta)^2}{n},$$\n```"
