    percentiles of the follow-up times, **TypeOpRR** denotes the dummy variable for
    the root replacement type of operation, and we also control for the age of the
    patients at baseline. To fit this model in R we use function `ns()` from package
    `splines` that generates the basis matrix for the cubic splines. The corresponding
    syntax is


    ```

    lmeFit.av <- lme(sqrt(AoGradient) ~ ns(time, 3) * TypeOp + Age, data = AoVal,
    random = list(id = pDiag(form = ns(time, 3))))

    ```


    The formulation in the **random** argument in the call to `lme()` specifies a
    diagonal covariance matrix for the random effects $b_i = (b_{i0}, \dots, b_{i3})$.
    For the survival part we fit a simple Cox model in which we include only the type
    of operation as a covariate, i.e.,


    > $h_i(t | M_i(t), w_i) = h_0(t)\exp{\gamma TypeOpRR_i + \alpha m_i(t)\}$


    and we fit it in R using


    ```

    coxFit.av <- coxph(Surv(Time, death) ~ TypeOp, data = AoValv.id, x = TRUE)

    ```


    Based on the fitted linear mixed and Cox models we fit the corresponding joint
    model, setting also the verbose to TRUE,


    ```

    jointFit.av <- jointModel(lmeFit.av, coxFit.av, timeVar = "time", method = "piecewise-PH-aGH",
    verbose = TRUE)

    ```'
