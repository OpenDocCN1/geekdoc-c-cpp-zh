  md: '# A Brief Introduction to R


    in R are the matrix(), rbind() cbind() functions. The first one takes as input
    a vector and transforms to a matrix by giving it a dimension attribute, whereas
    the latter two bind together row-wise or column-wise order, respectively, vectors
    of the same length. The following syntax illustrates the use of these functions
    by constructing a matrix with elements the integers from one nine (to automatically
    create this sequence of integers we use the ":" function):


    ```

    matrix(1:9, nrow = 3, ncol = 3)

    [[1], [2], [3]

    [1] 1 4 7

    [2] 2 5 8

    [3] 3 6 9

    cbind(1:3, 4:6, 7:9)

    [[1], [2], [3]

    [1] 1 4 7

    [2] 2 5 8

    [3] 3 6 9

    ```


    Both functions produce exactly the same output, but in the first case we have
    a vector of nine elements, which is organized in a 3 × 3 matrix, whereas in the
    second case we bind together in column-wise order three vectors with three elements
    each. We observe that by default matrix() organizes the elements of the input
    vector in a column-wise order. This can be overwritten using the by.row argument
    of function.


    A defining characteristic of the previously defined vectors and matrices is that
    all of their elements need be of the same type, that is, we cannot have a vector
    where its first element is numeric and the second one is a character. A more flexible
    type of R objects that overcomes this constraint are lists, which are defined
    using list() function. For instance, the following syntax defines a list with
    four elements, two of type numeric, at positions one and three, and two of type
    character at positions two and four:


    ```

    > L <- list(1, "a", 2, "b")

    > L

    [[1]]

    [1] 1

    [[2]]

    [1] "a"

    [[3]]

    [1] 2

    [[4]]

    [1] "b"

    ```


    A special type of lists are the data frames, which constitute the fundamental
    data structure used most by R’s modeling software. Similar to lists, data'
