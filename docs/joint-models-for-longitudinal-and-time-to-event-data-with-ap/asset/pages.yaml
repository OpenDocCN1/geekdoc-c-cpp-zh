  md: "# Joint Models for Longitudinal and Time-to-Event Data 67\n\nFrom a practical\
    \ point of view the high dimensionality of the parameter vector may result in\
    \ numerical complications in the calculation and inversion of the Hessian matrix\
    \ required to produce standard errors. For this reason estimation of standard\
    \ errors is typically based on a profile likelihood approach. That is, $l_p(\b\
    eta, \\sigma, \\gamma, \\alpha, \\hat{h}_0(\beta, \\sigma, \\gamma, \\alpha))$,\
    \ where $\\hat{h}_0(\beta, \\sigma, \\gamma, \\alpha)$ denotes the nonparametric\
    \ metric likelihood estimator of $h_0(t)$ as a function of the parameters. In\
    \ order for profile likelihood asymptotics to work, this nonparametric metric\
    \ likelihood estimator should not depend on $h_0(t)$ (Hsieh et al., 2006). Unfortunately,\
    \ however, this is not the case in joint models because this estimator uses random\
    \ effects. In practice, the following estimator from the M-step of the EM algorithm\
    \ is typically used:\n\n```\n$$\\dot{h}_0(t) = \\sum_{i=1}^n \\sum_{j=1}^n h_i(T_i\
    \ \\ge t) \\exp{\\{\\hat{\\gamma}^\\intercal w_j + \\hat{a}_mj(t, b)\\} p(b_i\
    \ | T_i, \\delta_i, y_i)\\}$\n```\n\nwhich, as can be seen, remains a function\
    \ of $h_0(t)$ through the posterior distribution of the random effects $p(b_i\
