    # 3.5 Extended Cox Model


    The Cox model presented in Section 3.3 can be extended to handle exogenous time-dependent
    covariates using the counting process formulation in detail by Andersen and Gill
    (1982) and presented in greater detail in Fleming and Harrington (1991) and Andersen
    et al. (1993). The intuitive idea behind this formulation of the Cox model is
    to think occurrence of events as the realization of a very slow Poisson process.
    In counting process notation, the event process for subject i is written as {Ni(t),
    Ri(t)}, with Ni(t) denoting the number of events for subject i by time t, and
    Ri(t) is a left continuous risk process with Ri(t) = 1 if subject is at risk at
    time t, and Ri(t) = 0 otherwise. Extended Cox model (also known as the Anderson-Gill
    model) is written as


    ```

    h_i(t | Y_i(t), w_i) = h_0(t)R_i(t)\exp{\gamma^T w_i + \alpha y_i(t)},    (3.11)

    ```


    where, in (3.6), w_i denotes a vector of baseline covariates, such as fixed or
    randomized treatment, and y_i(t) denotes a vector of time-dependent covariates.
    The interpretation of the regression coefficients \alpha is exactly the same as
    for \gamma. In particular, assuming for simplicity that there is only one single
    time-dependent covariate, then at any particular time point t, \exp(\alpha) denotes
    the relative increase in the risk for an event at time t that results from one
    unit increase in y_i(t) at the same time point. Moreover, note that since'
