    there is a small but significant difference in the risk for death between the
    two treatments, whereas the BIC chooses the more parsimonious joint model with
    no treatment effect in the survival submodel. Therefore, these criteria should
    be considered as rules of thumb to discriminate between two (non-nested) statistical
    models.


    An additional important issue arises when we are interested in testing whether
    an extra random effect should be included in the joint model. In fact it corresponds
    to increasing the dimensionality of the random effects design D with extra variance
    components. In this case the model under the null hypothesis is obtained by setting
    some of the elements of D to zero in the full model. At least one of these elements
    is always in the diagonal of D (i.e., a variance parameter), meaning that the
    null parameters are set to a value on the boundary of their parameter space. The
    problem under this setting is that the classical maximum likelihood asymptotic
    arguments do not apply to boundary cases. In particular, some work on this topic
    in the linear mixed framework by Stam and Lee (1994) following the results of
    Self and Liang (1987), and later by Verbeke and Molenberg (2007) has shown that
    all three tests statistics see above do not follow the chi² distribution over
    the null. As an alternative, it has been suggested to use mixtures of chi-squared
    distributions with appropriately chosen degrees of freedom. However, Greven et
    al. (2008) have demonstrated that this choice could be conservative in some settings,
    and they have instead proposed a simulation-based approach to approximate the
    distribution of the likelihood ratio statistic under the null. Within the joint
    modeling framework there has not much work about this issue. As a practical guideline
    we would suggest using a higher type I error rate, e.g., 10 to 15%, to guarantee
    that we do not oversimplify the random-effects structure of the posed joint model.


