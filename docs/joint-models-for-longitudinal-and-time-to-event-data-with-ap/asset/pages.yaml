  md: '# Typographical Conventions


    R language objects are printed in a monospaced **typewriter** font. Code that
    could be interactively entered at the R command line is formatted as:


    > x <- 5


    where > denotes the R-command line and everything else is the user should enter.
    In addition, R expressions that do not fit in a single line will be appropriately
    indented like:


    ```

    > jointModel(lmeFit, coxFit, timeVar = "time'',

    method = "weibull-PH-aGH", parameterization = "both")

    ```


    When referring to a function in the main text, it will be formatted in a typewriter
    font and will have parentheses around the function name, e.g., jointModel(). Similarly,
    function arguments and value specified for these arguments will also be formatted
    in a typewriter font, but with no parentheses at the end, e.g., method = "weibull-PH-aGH".


    To save space, some of the R output has been edited. Omission of complete lines
    is indexed by


    ... some blank lines have been removed without indication.


    # Acknowledgements


    Many pieces of the work presented in this monograph are based on joint research
    with Geert Verbeke and Geert Molenberghs, with whom it has been my great pleasure
    to collaborate. I would also like to thank Emmanuel Lesaffre for useful discussions
    on joint modeling topics, and for creating a stimulating work environment. Special
    thanks also goes to all of **JM** whose input has greatly benefited the development
    of the package.


    With regard to this book in particular, I would like to thank the anonymous reviewers
    for valuable feedback on earlier versions of the manuscript, and John Kimmel at
    Chapman and Hall/CRC for his help and support during the whole production process.
    This monograph was written using Friedrich Leisch''s *Sweeave* package, the $\LaTeX$
    document preparation system, and, of course, R.


    Dimitris Rizopoulos

    Rotterdam, April 2012'
