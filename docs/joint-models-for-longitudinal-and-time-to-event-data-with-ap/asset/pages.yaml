  md: '# Appendix C


    # Structure of the JM Package


    In this appendix we give an overview of the main functions in package **JM**.
    Even though we describe the main usage of these functions, we purposely not provide
    all of their respective arguments because on future versions of the package some
    of these may change and/or additional arguments may be introduced. The definite
    reference for their syntax and output is the online manual of the package.


    # C.1 Methods for Standard Generic Functions


    The main fitting function of package **JM** is function `jointModel()` that fits
    a wide variety of joint models for longitudinal and event time data. The two main
    arguments of this function are an object of class `lme` representing a linear
    mixed-effects model fitted using function `lme()` from package **nlme**, and an
    object of class `coxph` representing a Cox proportional hazards model fitted using
    function `coxph()` from package **survival**. In the call to `coxph()` it is required
    to set the option x = TRUE in order the design matrix of the Cox model to be included
    in the model object, but it is also advisable to set the option model = TRUE such
    that the entire model frame (and not only the design matrix) is returned. In addition,
    the user needs to specify the `timeVar` argument, which is the name of the time
    variable in the linear mixed model. The `method` argument controls the type of
    survival submodel and the'
  merge: -1
  pgno: 251
