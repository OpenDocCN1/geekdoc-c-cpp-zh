  md: '# Chapter 5


    # Extensions of the Standard Joint Model


    This chapter presents several extensions of the standard joint model introduced
    in Chapter 4. These include several families of parameterizations for the association
    structure between the longitudinal and event outcomes, incorporating exogenous
    time-dependent covariates and stratification factors (either observed or latent),
    replacing relative risk models by accelerated failure time models, and joint models
    for multiple failure times and multiple longitudinal responses. Even though we
    attempt a comprehensive presentation of most of the extensions that have been
    proposed in the literature for joint models, we should mention that we only present
    in greater detail the developments that are currently available in R.


    # 5.1 Parameterizations


    In the standard joint model, introduced in the previous chapter, it is assumed
    that the risk for an event at a particular time point $t$ depends on the true
    level of the longitudinal marker at the same time point. The strength of the association
    between the current level of the marker is captured by the parameter $\alpha$.
    Even though this is a very intuitively appealing parameterization with a clear
    interpretation for $\alpha$, it is not realistic to expect that this parameterization
    will always be the most appropriate in expressing the'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Joint Models for Longitudinal and Survival Data


    correct relationship between the two processes. This is enforced by the fact that,
    general, time-dependent covariates can be much more challenging to handle than
    baseline covariates. In particular, the choice of the functional form of a time-dependent
    covariate is usually not self-evident, and it may substantially influence the
    derived results. For instance, considering only the current value of a time-varying
    covariate to be associated with the risk for an event, may miss more complex forms
    of association with the longitudinal marker and the survival outcome or lead to
    etiologically incorrect conclusions (Vacek, 1997). For a more detailed discussion
    of these issues, we refer to Fisher and Lin (1999) and Wolkwitz et al. (2010).


    In this section we present several alternative parameterizations that extend the
    standard parameterization (4.1) in different ways. These different parameterizations
    can be seen as special cases of the following general formulation of the association
    structure between the longitudinal marker and the risk for an event:


    ```

    $h_i(t) = h_0(t) \exp[\gamma^T w_{i1} + f\{m_i(t-c), b_i, w_{i2}\}], \quad (5.1)$

    ```


    where $f(\)$ is a function of the true level of the marker $m_i(t)$, of the random
    effects $b_i$, and extra covariates $w_{i2}$. Under this general formulation $a$
    can potentially denote a vector of association parameters rather than a simple
    scalar as in (4.1).


    # 5.1.1 Interaction Effects


    The standard parameterization (4.1) assumes that the effect of the true level
    of the marker is the same in all subgroups of the target population. This is evidently
    a strong assumption that may not be when the marker behaves differently for different
    subgroups of subjects. A straightforward extension to handle such situations is
    to include in the linear predictor of the relative risk model interaction terms
    of the baseline covariates of interest, i.e.,


    ```

    $h_i(t) = h_0(t) \exp[\gamma^T w_{i1} + \alpha^T \{w_{i2} \times m_i(t}\}], \quad
    (5.2)$

    ```


    where, $w_{i1}$ is used to accommodate the direct effects of baseline covariate
    to the risk for an event, and $w_{i2}$ contains interaction terms that expand
    the association of $m_i(t)$ in different subgroups in the data. When $w_{i2}$
    contains only the constant term, i.e., $w_{i2} = 1$, then (5.2) reduces to the
    standard parameterization (4.1).


    To illustrate how such a model could be fitted in R, we investigate for the PBC
    dataset whether the strength of the association between the true level of serum
    bilirubin and the risk is different for patients with and without hepatomegaly.
    In particular, for the longitudinal outcome we assume a linear mixed model with
    quadratic equations in each point with different effects per treatment:


    ```

    $y_i(t) = \beta_0 + \beta_1 D\text{-pnc}_i + \beta_2 t + \beta_3 t^2 + \beta_4
    \{D\text{-pnc}_i \times t\} + \beta_5 \{D\text{-pnc}_i \times t^2\} \n + b_{i0}
    + b_{i1}t + b_{i2}t^2 + \epsilon_i(t),$

    ```'
