  md: '# Chapter 6


    # Joint Model Diagnostics


    The previous chapters have focused on different formulations and several extensions
    of joint models. However, when it comes to using these models in practice, a prerequisite
    step is to validate the model''s assumptions. The standard tools to assess these
    assumptions are residual plots. Properties and features of residuals, when longitudinal
    and survival outcomes are separately modeled, have been extensively studied in
    the literature. However, this topic has not received much attention in the joint
    modeling literature, with the only exception being the conditional residuals of
    Dobson and Henderson (2003) and the multiple imputation residuals of Rizopoulos
    et al. (2010). In this chapter we present different types of residuals for the
    longitudinal and event time outcomes, and we provide a thorough discussion of
    the implications of the nonrandom dropout caused by the occurrence of events.


    # 6.1 Residuals for Joint Models


    # 6.1.1 Residuals for the Longitudinal Part


    In the standard linear mixed-effects model, two types of residuals are often used,
    namely the subject-specific (conditional) residuals, and the marginal (population
    averaged) residuals (see e.g., Nobre and Singer, 2007; Verbeke and Molenberghs,
    2000). The subject-specific residuals aim to validate the'
  merge: -1
  pgno: 161
