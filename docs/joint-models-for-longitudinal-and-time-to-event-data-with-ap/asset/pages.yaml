  md: '# Joint Models for Longitudinal and Survival Data


    numerical integration method. For a more detailed presentation of the different
    options for the method argument, the reader is referred to Section 4.2.


    Function jointModel() returns an R list of "jointModel", for which there are $3
    methods defined for several of the standard generic functions in R.


    Functions print() and summary() return the results of a fitted joint model.


    The former function only prints the estimated parameters for the longitudinal
    and survival submodels, whereas the latter provides a more detailed output, including
    summary statistics for the dataset used to fit the model and Wald tests for the
    regression coefficients of the two submodels.


    Function coef(), fixef() extract the estimated coefficients for the two submodels
    from a fitted joint model. For the survival process provide the same output, but
    for the longitudinal model, the former returns the subject-specific regression
    coefficients (i.e., the fixed effects plus their corresponding random effects
    estimates), whereas the latter only returns the estimated effects.


    Function ranf() computes the empirical Bayes estimates for the random effects
    for each subject. These may be the mean or the mode of the posterior distribution
    of the random effects given the observed data. The function also computes estimates
    for the dispersion of the random effects, with available options the posterior
    variance and the inverse Hessian matrix (calculated as the second order derivative
    of the log posterior with respect to the random effects). Examples using this
    function can be found in Section 4.5.


    Function vcov() extracts the estimated variance-covariance matrix of the maximum
    likelihood estimates. An example using this function can be found in Section 4.4.1.


    Functions fitted() and residuals() compute several kind of fitted values and residuals,
    respectively, for the two outcomes. For the longitudinal submodel, subject-specific
    and marginal fitted values and residuals are available. In addition, for the longitudinal
    submodel, function residuals() can be used to compute the multiply-imputed functions
    that account for missing dropout. For the relative risk submodel, function fitted()
    can be used to return the marginal or subject-specific estimates of survival,
    cumulative hazard, and log cumulative hazard functions, whereas function residuals()
    computes the martingale and Cox-Snell residuals. Examples using this function
    can be found in Sections 6.1.1, 6.1.2, and.


    Function anova() computes Wald and likelihood ratio tests (LRT) based on fitted
    joint models. When a single joint model object is supplied,'
