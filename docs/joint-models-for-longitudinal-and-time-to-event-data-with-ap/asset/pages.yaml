    In all the above types of research questions we have focused on explicit outcomes.
    However, as mentioned earlier, in longitudinal studies more often than not implicit
    outcomes are also generated and their appropriate handling is required even though
    they are not the outcomes of primary interest. In particular, in the presence
    of implicit outcomes, and before proceeding in the analysis of interest one must
    carefully consider the nature of the probabilistic mechanism generating the implicit
    outcome(s) (missing data and/or visit times) because it can greatly determine
    how the analysis should be adjusted in order to obtain valid inferences.


    # 1.4 Overview


    Chapters 2 and 3 aim at introducing the building blocks of joint models, namely
    linear mixed-effects models for longitudinal data and relative risk models for
    survival data. In particular, in Chapter 2 we discuss the complications arising
    in the analysis of longitudinal responses, and we introduce the linear mixed-effects
    model as a flexible modeling framework to handle correlated data. We refer to
    estimation and inference, and then focus on the problem of missing data that is
    frequently encountered in longitudinal studies. We define'
