  md: '# Joint Models for Longitudinal and Survival Data


    is not achieved switches to a quasi-Newton algorithm until convergence is attained.
    Available quasi-Newton algorithms are the BFGS of optim() (Nash, 1990), and the
    PORT routines of nminb() (Gay, 1990). Initial values for the parameters are taken
    from the linear mixed and survival models that are supplied as the first two arguments
    in jointModel(). During the EM iterations convergence is declared whenever either
    of the following criteria is satisfied:


    ```

    max{|\theta^{(it)} - \theta^{(it-1)}| / |\theta^{(it-1)} + e_1|} < e_2,

    \ell(\theta^{(it)}) - \ell(\theta^{(it-1)}) < e_3

    ```


    where $\theta^{(it)}$ denotes the parameters at the ith iteration, $\ell(\theta)
    = \sum_i \log p(T_i, \delta_i, y_i; \theta)$. Commonly used values for $e_1$ and
    $e_2$ are about $10^{-3}$ or $10^{-4}$, and $e_3$ is by default set to sqrt(.Machine$eps),
    which is about $10^{-8}$. During the quasi-Newton iterations, only the latter
    is used. A finer control of the optimization process is provided via the control
    argument of jointModel(). This specifies, among others, the number of EM iterations
    (argument iter. EM), and quasi-Newton iterations (argument iter. qN), the type
    of quasi-Newton algorithm (argument optimizer), the tolerance values for the convergence
    criteria (arguments tol1, tol2 and tol3 for e1, e2 respectively), and the type
    of numerical derivative that calculates the Hessian matrix based on the score
    vector (i.e., forward or central difference approximation – arguments numerDeriv
    and eps.Hes).


    Changing the default values for these arguments can be easily achieved by directly
    including the control arguments in the call to jointModel(). For example, to refit
    the joint model to the AIDS dataset, presented in Section 4.2, using 80 EM iterations,
    with a stricter tolerance, and using the central difference approximation to calculate
    standard errors, the following syntax was used:


    ```

    > jointFit.airs <- jointModel(lmeFit.airs, coxFit.airs,

    timeVar = "obstime", method = "piecewise-PH-aGH", iter.EM = 80,

    tol3 = 1e-09, numerDeriv = "cd", eps.Hes = 1e-04

    ```


    The last argument eps.Hes holds the step-size length in the difference approximation.


