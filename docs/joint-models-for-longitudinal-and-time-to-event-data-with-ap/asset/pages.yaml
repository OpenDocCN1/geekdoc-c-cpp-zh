  md: "# Joint Models for Longitudinal and Survival Data\n\npredictions are calculated\
    \ by default chosen as a regular sequence of length 25 from $t$ (the last available\
    \ measurement of the subject) to $t_{max} + \\epsilon$ where $t_{max}$ denotes\
    \ the largest follow-up time in the sample and $\\epsilon$ is a small number.^3\
    \ However, by setting returnData to TRUE, the output of predict() is the data\
    \ frame sampled in newdata augmented with lines for each subject with their predictions\
    \ at time $u$. The last line of the forloop adds an extra column to data frame\
    \ returned by predict(), denoting the last follow-up time $t$ at which a longitudinal\
    \ response has been recorded.\n\nTo visualize the resulting estimates we collect\
    \ all the results in a single data frame using code\n\n```\n> longPreds.all <-\
    \ do.call(rbind, longPreds)\n> longPreds.all$FollowUp <- with(longPreds.all, factor(FollowUp,\n\
    \  labels = paste(\"Follow-up time:\", unique(FollowUp)))\n```\n\nThe second line\
    \ transforms FollowUp, which holds the available time point, to a factor with\
    \ suitable levels. Using this data frame the following code produces the plot\
    \ of the dynamic predictions of the longitudinal outcome:\n\n```\n> xyplot(pred\
    \ + loc + up ~ year | data = longPreds.all,\n  lty = c(1, 2), type = \"1\", as.table\
    \ = TRUE,\n  xlab = \"Time\", ylab = \"Predicted log serum bilirubin\")\n```\n\
    \nA more elaborate version of this plot is shown in Figure 7.5.^4 As expected,\
    \ we observe that the width of the predictions intervals increases as time progresses,\
    \ indicating that we have much stronger faith on predictions shortly after the\
    \ last available longitudinal measurement. An important feature of these prediction\
