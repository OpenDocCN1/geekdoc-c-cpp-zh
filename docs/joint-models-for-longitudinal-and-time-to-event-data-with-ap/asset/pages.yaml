  md: '# Joint Model Diagnostics 167


    The next steps are very similar to those in Section 6.3.1. In particular, setting
    MI to TRUE in the call to residuals() implements the multiple-imputation simulation
    scheme for random times described above. In order for residuals() to simulate
    future time for the patients who dropped out, we need to provide the fitted Weibull
    frailty model as the argument points. Moreover, for some internal computations,
    it is required to add an extra attribute to WeibFra the name of the variable that
    corresponds to $y_i(t_{k_i-1})$, which in our case is prev.y: this is achieved
    with the code


