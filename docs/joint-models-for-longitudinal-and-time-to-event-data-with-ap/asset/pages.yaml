  md: "# Joint Models for Longitudinal and Survival Data\n\nIn argument init we provide\
    \ the named list with initial values for the parameters of the joint model, we\
    \ set the control argument only to TRUE (i.e., do not proceed to the quasi-Newton\
    \ algorithm if converge is not attained), and we also set the control argument\
    \ iter to zero. To extract the corresponding blocks of the Hessian matrix and\
    \ calculate the ISNI, we use the commands:\n\n```\n> H <- ISNI$Hessian\n> H.inv\
    \ <- solve(H)\n> pBetas <- head(group(\"V.\", colnames(H), fixed = TRUE, -1)\n\
    > pAlpha <- which(colnames(H) == \"T.alpha\")\n> isni <- (H.inv[pBetas, pBetas]\
    \ %*% H[pBetas, pAlpha])\n> se.betas <- cbind(ISNI = isni, RISK = isni/se.betas,\
    \ 3)\n```\n\n| | ISNI | RISK |\n| (Intercept) | 0.096 | 0.433 |\n| obstime | -0.207\
    \ | -9.965 |\n| obstime:drugdii | -0.064 | -2.168 |\n\nThe first two lines extract\
    \ the Hessian matrix from the joint model and compute its inverse, the third and\
    \ fourth lines compute vector indexes for the rows of the Hessian matrix that\
    \ correspond to $\beta$ and $\\alpha$, respectively, and the fifth line in the\
    \ output is the relative ISNI, which is the ISNI divided by the estimated standard\
    \ error for $\\hat{\beta}(0)$ under the linear mixed model, i.e., under MAR. This\
    \ relative index has been proposed by Troxel et al. (2004) in order to allow for\
    \ an easy comparison of the magnitude of the expected sensitivity for each parameter.\
