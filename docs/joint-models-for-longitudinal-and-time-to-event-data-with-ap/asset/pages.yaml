    $$p(T_i, \delta_i, y_i \mid b_i; \theta) = p(T_i, \delta_i \mid b_i; \theta) p(y_i
    \mid b_i; \theta),$$

    ```


    ```

    $$p(y_i \mid b_i; \theta) = \prod_{q} p(y_{iq} \mid b_{iq}; \theta_q), \text{and}$$$

    ```


    ```

    $$p(y_iq \mid b_{iq}; \theta_q) = \prod_{j} p\{y_{ij} \mid b_{ij}; \theta_q\},$$

    ```


    where $y_i^T = (y_{i1}, \dots, y_{iq}^T), y_{iq}^T$ and $b_i^T = (b_{i1}, \dots,
    b_{iq}^T)$. The complete vector of random effects $b_i$ is assumed to follow a
    multivariate normal distribution with mean zero and general covariance $D$. The
    linear predictor of the relative risk model for the survival process is similarly
    extended to accommodate for all longitudinal outcomes, i.e.,


    ```

    $$h_i(t) = h_0(t) \exp[\gamma_i^T w_i + \sum_{q} f_q(m_{iq}(t-c), b_{iq}, w_{i2q};
