  md: "# Prediction and Accuracy in Joint Models\n\ntrajectories:\n\n```\n$y_i(t)\
    \ = m_i(t) + \\varepsilon_i(t)\\n= (\beta_0 + b_{0i}) + (\beta_k + b_{ik})^\t\
    op B(t, 4) + \\varepsilon_i(t)$.$\n```\n\nRelative risks models (I–III) assume\
    \ that the risk for the composite event at time $t$ depends on the true level\
    \ of log serum bilirubin at the same time, slope of the true trajectory at $t$,\
    \ or on the true level and the slope at $t$, respectively. Similarly, models (IV–VI)\
    \ assume the same type of relationships, but also include the interaction terms\
    \ between the true level of the marker/or the slope of the trajectory with the\
    \ dummy variable of abnormal prothrombin time at baseline.\n\nBefore proceeding\
    \ in fitting these models in R, we first need to derive the expression for the\
    \ derivative $m_i'(t)$ under the B-splines representation for $m_i(t)$. From standard\
    \ B-spline theory it is known that this derivative can also be written in terms\
    \ of B-splines basis functions (Derck, 1993, 1.3.2). In particular, rewriting\
