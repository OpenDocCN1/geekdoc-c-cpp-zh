    the different missing data mechanisms and explain under which circumstances the
    linear mixed model provides valid inferences.


    Chapter 3 starts by explaining the special features of event time data, such as
    censoring and truncation, and how they complicate the analysis of such data. Next,
    we introduce relative risk models and in particular the Cox model. As in Chapter
    2, we briefly refer to censoring, partial and full likelihood, and inference.
    In the final section we focus on time-dependent covariates. More specifically,
    we provide the definitions of endogenous and exogenous time-dependent covariates,
    and we discuss under which settings the extended (time-dependent) Cox model provides
    valid inferences.


    Chapter 4 introduces the basics of the joint modeling framework. In particular,
    continuing from the end of Chapter 3, we motivate joint models first from the
    survival point of view as a modeling framework to handle time-dependent covariates.
    We introduce the standard joint model, discuss the assumptions behind it, and
    present maximum likelihood estimation. Following, we make the connection with
    the missing data framework presented in Chapter 2, and additionally motivate joint
    models as models that can handle nonrandom dropout.


    In Chapter 5 we explore several extensions of the standard joint model. Extensions
    for the survival part include different types of parameterizations between the
    longitudinal and survival outcomes, stratified relative risk models, handling
    of multiple failure times, and the consideration of accelerated failure time models.
    With respect to the longitudinal part we first present joint models with categorical
    longitudinal markers, and then we extend to multivariate joint models with multiple
    longitudinal outcomes. Finally, as an alternative to the standard joint model
    we present the latent class joint model, which assumes the association between
    the longitudinal and event time processes is due to the existence of latent heterogeneity
    in the population.


    In Chapter 6 we present several diagnostic tools to assess the assumptions behind
    joint models based on residuals. We focus on types of residuals for the survival
    and longitudinal parts, respectively, and special attention is given on how these
    residuals can be affected by the nonrandom dropout induced by the occurrence of
    events. In addition, we also refer to misspecification of the random-effects distribution
    and how this affects the derived inferences.


    Chapter 7 focuses on prediction and discrimination. More specifically, we illustrate
    how joint models can be used to estimate survival probabilities for the event
    time outcome and predictions for the longitudinal outcome, and illustrate how
    these are dynamically updated as additional information is collected for each
    subject. Next, we turn our attention to prospective measures for the longitudinal
