    # 5.1.3 Time-Dependent slopes Parameterization


    In the previous parameterizations we have assumed that the risk for an event depends
    on either the current or a previous value of the longitudinal marker. However,
    for each patient the marker follows a trajectory in time, it is also reasonable
    to consider parameterizations that allow the risk for an event to also depend
    on other features of this trajectory. A parameterization of this type has been
    considered by Ye et al. (2008b) who postulated a joint model in which the risk
    depends on both the current true value of the trajectory and the slope of the
    true trajectory at time $t$. A graphical representation of this parameterization
    is given in Figure 5.1. More, the relative risk survival model takes the form


    ```

    $h_i(t) = h_0(t)\exp{\gamma^T w_i + \alpha_1 m_i(t) + \alpha_2 m_i''(t)}\}, \quad
    (5.4)$

