    note that all extensions we have seen before are also, in principle, applicable
    for multivariate joint models.


    Estimation of the multivariate joint model proceeds by maximizing the corresponding
    log-likelihood function, which is very similar in form to the one presented in
    Section 5.7.2 for categorical longitudinal responses. In fact, the only difference
    is the density for the longitudinal part under the the multivariate model takes
    the form:


    ```

    $$p(y_i \mid b_i; \theta) = \exp\left[ \sum_{q=1}^{Q} \sum_{j=1}^{n_{iq}} y_{ij}w_{iq}(b_{iq})
    - c_q\{w_{iq}(b_{iq})\}\right] / a_q(\varphi_q), \n -d_q(y_{iq}, \varphi_q)$$$

    ```


    where we explicitly denote that $c_q(\cdot), d_q(\cdot)$ define the respective
    member of the exponential family depend on $q$, implying that we can simultaneously
    handle both continuous and categorical longitudinal responses.


    Even though the from a univariate to a multivariate joint model is relatively
    straightforward, the main practical problem in fitting multivariate joint models
    is their computational complexity due to the requirement for numerical integration
    with respect to the random effects. In particular, since we assume a different
    set of random effects per outcome, it is evident that the'
