    times. Under the relative risk model (3.6), the distributional assumptions for
    $T_i^*$ are hidden in the specification of the baseline hazard function. For example,
    when $T_i^*$ follows the Weibull distribution, the baseline hazard function takes
    the form $h_0(t) = \phi t^{\gamma_*-1}$. In this estimation of all model parameters,
    the regression coefficients $\gamma$ and the parameters in the specification of
    $h_0(t)$ are obtained by maximizing the corresponding log-likelihood function
    (3.5). Cox (1972) showed that estimation of the primary parameters of interest,
    namely $\gamma$, can be alternatively based on the partial log-likelihood scores:


    ```

    $pl(\gamma) = \sum_{i=1}^n \delta_i \left[ \gamma^{T_i} w_i - \log\left\ \sum_{T_j
    \ge T_i} \exp(\gamma^{T_j})\right\ \right], \quad (3.7)$

    ```


    does not require specification of $h_0(*)$, that is, without having to specify
    the distribution of $T_i^*$. The relative risk model (3.6) with an unspecified
    baseline risk function is a semiparametric model that does not make any assumption
    for the distribution of the event times, but that the covariates act multiplicatively
    on the hazard rate. Intuitively, the partial likelihood can be considered as a
    measure of how well the model can order the patients with respect to their survival
    time. Even though this is not equivalent to a full log-likelihood (3.5), it can
    be treated as such. In particular, the maximum likelihood estimators are found
    by solving the partial log-likelihood equations:


    ```

    $$\frac{\partial pl(\gamma)}{\partial \gamma} = \sum_{i=1}^n \delta_i \left\ w_i
    - \frac{\sum_{T_j \ge T_i} w_j \exp(\gamma^{T_j})}{\sum_{T_j \ge T_i} \exp(\gamma^{T_j})}\right
    \right\ = 0.$

    ```


    The solution $\gamma$ is consistent and asymptotically normally distributed with
    mean $\gamma^0$, the true parameter vector, and variance $E[I(\gamma^0)]^{-1}$,
    the inverse of the expected information matrix corresponding to (3.7). Due to
    the fact that the expectation requires knowledge of the censoring distribution,
    standard errors are typically estimated using the observed information $I({\gamma)}^{-1}$,
    where


    ```

    $I(\gamma) = -\sum_{i=1}^n \frac{\partial^2 pl(\gamma)}{\partial \gamma^T \partial
    \gamma}|_{\gamma=\gamma}$

    ```


    For a thorough discussion of the relative efficiency of the maximum likelihood
    estimator with respect to that of a maximum likelihood estimator, in which $h_0(*)$
    is specified to certain unknown parameters, we refer to Kalbisch and Prentice
    (2002, Section 5.9).


