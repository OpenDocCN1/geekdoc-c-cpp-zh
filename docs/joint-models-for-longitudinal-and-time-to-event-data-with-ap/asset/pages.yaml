    # 4.3.3 Standard Errors with an Unspecified Baseline Risk Function\n\nAs we have\
    \ discussed in Chapter 3, the great advantage of the Cox model in standard survival\
    \ analysis is that the partial likelihood can be used to estimate the regression\
    \ coefficients of a relative risk model. This means that standard errors and inference\
    \ for the regression coefficients of the (extended) Cox model enjoy asymptotic\
    \ properties similar to those of asymptotic maximum likelihood theory, without\
    \ having to specify an appropriate baseline risk function (Andersen and Gill,\
    \ 1982).\n\nUnfortunately, under the joint modeling framework this feature is\
    \ not carried out (Hsieh et al., 2006). Due to the use of random effects, and\
    \ as we have seen in Section 4.3.2, estimation of joint models can no longer be\
    \ based on the partial likelihood alone and full likelihood approach must be employed.\
    \ When we define a model with an unspecified baseline risk function for the survival\
    \ subplot, the calculation of the likelihood is based on nonparametric maximum\
    \ likelihood arguments under which the unspecified incidence function $H_0(t)\
    \ = \\int_0^t h_0(s) ds$ is replaced by a step function with jumps at the unique\
    \ event times (van Vaart, 1998). Under this setting it is evident that the parameter\
    \ vector $\\theta$ is typically of high dimension because it also contains the\
    \ high-dimensional subvector $h_0(t)$."
