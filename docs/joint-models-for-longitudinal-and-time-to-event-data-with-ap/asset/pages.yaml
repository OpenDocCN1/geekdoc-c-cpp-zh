- img_proc: true
  md: "# Prediction and Accuracy in Joint Models 201\n\nthe probability that their\
    \ marker levels are concordant with their event times,\ni.e.,\n\n```\n$C_h = \\\
    Pr(y_i > y_j \\mid T_i^* < T_j^*). \\quad (7.16)$\n```\n\nThis global accuracy\
    \ summary index is, in fact, related to the time-dependent ROC curves presented\
    \ in Section 7.4.2. In particular, this Heagarty and Zheng (2005) have shown that\
    \ the $C_h$ index (7.16) can be equivalently derived as a weighted average of\
    \ AUCs from the incidence/dynamic definitions of sensitivity and specificity,\
    \ respectively. More specifically, they showed that\n\n```\n$C_h = \\int_0^{\\\
    infty} \\text{AUC}_t u(t) dt, \\quad (7.17)$\n```\n\nwhere $\\text{AUC}_t = \\\
    Pr(y_i > y_j \\mid T_i^*, T_j^* > t)$ and $u(t) = 2 \\cdot p(t) \\cdot S(t)$.\
    \ This equivalent of the $C_h$ index opens the possibility for a family of global\
    \ concordance summary measures, which are based on alternative specifications\
    \ of the AUC and the weight function $u(t)$. For example, concordance discrimination\
    \ indices for time-dependent markers can be constructed using appropriate definitions\
    \ of the AUC (Antolini et al., 2005). Following this approach, Rizopoulos (2011)\
    \ proposed a dynamic discrimination index based on the AUC derived from (7.14)\
    \ and (7.15), namely:\n\n```\n$C_{dyn}^{\\Delta t} = \\int_0^{\\Delta t} \\text{AUC}_t\
    \ u(t) dt,$\n```\n\nwith\n\n```\n$u(t) = \\Pr(T_i^* > t) / \\int \\Pr(T_i^* >\
    \ t) dt,$\n```\n\nwhere $\\Pr(T_i^* > t)$ is the marginal survival probability.\
    \ The choice for this weight function was made on the grounds of accounting for\
    \ the fact that not all time points contribute equally to the comparison because\
    \ at later time points less subjects to be available. Other weight functions $u(t)$\
    \ may be utilized to define alternative versions of the dynamic discrimination\
    \ index $C_{dyn}^{\\Delta t}$, and the optimal choice in that regard remains an\
    \ open question.\n\nIn practice we would typically restrict our attention to a\
    \ fixed follow-up period $(0, \\tau)$. In this case the $C_{dyn}^{\\Delta t}$\
    \ index can be modified to account for finite follow-up:\n\n```\n$[C_{dyn}^{\\\
    Delta t}]^\\tau = \\int_0^{\\tau} \\text{AUC}_t u^\\tau(t) dt,$\n```\n\nwhere\
    \ $u^\\tau(t) = u(t)/\\int_0^{\\tau} u(t) dt$. $[C_{dyn}^{\\Delta t}]^\tau$ will\
    \ still be connected to the probability that the predictions for a random pair\
    \ of subjects are concordant with their outcomes, but given that the smaller event\
    \ time occurs within the interval $(0, \\tau)$."
