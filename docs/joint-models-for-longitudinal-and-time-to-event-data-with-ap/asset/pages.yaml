  md: "# Extensions of the Standard Joint Model\n\nplaces different weights at different\
    \ time points:\n\n```\n$h_i(t) = h_0(t)\\exp{\\{\\gamma^T w_i + \\alpha \\int_0^t\
    \ \\var(t-s)m_i(s)ds\\}, \\quad (5.6)$\n```\n\nwhere $\\varpi(\\cdot)$ denotes\
    \ the weight function. A possible family of functions with this property would\
    \ place smaller weights on points further in the past. One possible family is\
    \ probability density functions of known parametric distributions, such as the\
    \ normal, the Student-$t$, and the logistic. The scale parameter in these densities\
    \ and also the degrees of freedom parameter in the Student-$t$ density can be\
    \ utilized to tune the relative weights of more recent marker values compared\
    \ to older ones. Parameterization (5.6) has a direct connection with the concept\
    \ of weighted cumulative exposure discussed by Breslow et al. (1983) and Thomas\
    \ (1988).\n\nAs an illustration, we update the cumulative effect analysis for\
    \ the PBC dataset and use weight function the standard normal density, i.e., $\\\
    varpi(x) = \\exp(-x^2)/\\sqrt{2\\pi}$. By setting the variance of the normal density\
    \ to one, $\\varpi(t)$ allows that the most recent months of the log serum bilirubin\
    \ history are associated with the risk for death. The specification of $m_i(t)$\
    \ in the longitudinal model assumes a second-order degree polynomial for the time\
    \ effect, in both the fixed- and random-effects parts. Thus, to construct the\
    \ weighted cumulative effect, we require to evaluate integrals of the form:\n\n\
    ```\n$\\int_0^t s^3 \\varpi(t-s) ds = (1/\\sqrt{2\\pi}) \\int_0^t s^3 \\exp\\\
    {--(t-s)^2\\} ds$\n```\n\nfor $j=0, 1, 2$. Due to the fact that these integrals\
    \ do not have closed-form solutions for $j > 0$, we will use the build-in function\
    \ integrate() in R to approximate them numerically. This function is based on\
    \ the Gauss-Kronrod rule we have seen earlier in the definition of the survival\
    \ function (42). Similar to the unweighted analysis, we will need to define appropriate\
    \ formulas for the fixed- and random-effects part, which will be supplied by the\
    \ `derivForm` argument of `jointModel()`. As an initial step, we define the function\
    \ `g()` that calculates the required integrals using integrate:\n\n```\ng <- function\
    \ (u, pow = 0) {\n  f <- function (t)\n    integrate(function (s) s^pow* dnorm(t\
    \ - s), 0, t)$value\n  supply(u, t)\n}\n```\n\nThe supply() statement in the last\
    \ line is used to vectorize g() with respect to its first argument, i.e., to make\
    \ g() when `u` is a vector. Following, using `g()` we define the fixed and random\
    \ parts of the weighted cumulative effect and fit the corresponding joint model"
