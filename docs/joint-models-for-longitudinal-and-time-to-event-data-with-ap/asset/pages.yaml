    \ b_i, \\theta)\\} p db_i, \\quad (7.2)$\n```\n\nwhere $S_i(-)$, as before, denotes\
    \ the survival function, and furthermore we explicitly note that the longitudinal\
    \ history $M_i(-)$, as approximated by the linear mixed-effects model, is a function\
    \ of both the random effects and the parameters.\n\nBased on (7.2) we can derive\
    \ a first-order estimate of $\\pi_i(u \\mid t)$ using the"
