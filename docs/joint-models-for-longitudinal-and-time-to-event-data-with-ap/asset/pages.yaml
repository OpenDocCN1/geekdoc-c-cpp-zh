    \ The main idea behind these criteria is to compare two models based on their\
    \ maximized log-likelihood value, but to penalize for the use of too many parameters.\
    \ The two commonly used information criteria are Akaike's Information Criterion\
    \ (AIC: Akaike, 1974) and the Bayesian Information Criterion (BIC: Schwarz, 1978).\
    \ These are included in the output of the anova() and summary() functions, and\
    \ are defined as\n\n```\nAIC = -2(ℓ) + 2npar\nBIC = -2(ℓ) + npar log(n)\n```\n\
    \nwhere npar denotes the number of parameters in the model. Under these definitions\
    \ ‘smaller is better’. That is, if we are using either AIC or BIC to compare two\
    \ models for the same data, we prefer the model with the lowest value for the\
    \ corresponding criterion. The choice between the two criteria can be an issue\
    \ since they do not always agree in practice. AIC tends to select more elaborate\
    \ models than BIC due to the fact that the latter penalizes much more heavily\
    \ for the complexity of the model. Note that this is also the case for the test\
    \ for a treatment effect in the survival process in the AIDS dataset presented\
    \ above. In particular, both the AIC and the likelihood ratio test indicate that"
