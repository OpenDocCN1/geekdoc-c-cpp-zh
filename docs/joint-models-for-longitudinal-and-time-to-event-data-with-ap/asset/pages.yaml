  md: '# Extensions of the Standard Joint Model


    could include studying several biomarkers but also multiple failure times. Here
    we focus on the association between a single endogenous time-dependent covariate
    and time to types of failure (the consideration of multiple biomarkers is deferred
    to Section 5.8). For example, in all previous analyses of the PBC dataset, we
    have considered the association between serum bilirubin and the risk for the composite
    event, death or transplantation, whatever comes first. However, it could also
    be of to distinguish between the events, and investigate how covariates affect
    the risk for transplantation separately from how they affect the risk for death.
    Of the traditional types of analysis in such settings is the cause-specific hazard
    regression, which postulates relative risk models for each of the covariates (Putter
    et al., 2007). When only baseline and exogenous time-dependent covariates need
    to be considered in an analysis, we can separate Cox models for each case, treating
    failure from the other case as censored observations. Whereas, when there is interest
    in the association between endogenous covariates and the risk for each of the
    covariates, a joint modeling approach should be utilized. In particular, joint
    models of this type have been studied by Elshaf et al. (2008), Williamson et al.
    (2008), Hu et al. (2009), and Huang et al. (2011).


    To handle different failure types we need to extend the notation for the survival
    process. In particular, assuming $K$ different cases of failure, we let $T_{i1},
    \dots, T_{IK}$ denote the true failure times for each one of them. The observed
    data for the $i$th subject of the observed event time $T_i = \min(T_{i1}, \dots,
    T_{iK})$, with $C_i$ denoting the censoring, and the event indicator values $\delta_i
    \in \{0, 1, \dots, K\}$, with 0 representing to censoring, and $1, \dots, K$ to
    the competing events. For each of the $K$ cases, and as mentioned above, we postulate
    the standard relative risk model


    ```

    $h_{ik}(t) = h_{0k}(t)\exp{\gamma_k^T w_i + \alpha_k m_{ik}(t)},$ \quad (5.12)

    ```


    which includes the effects of the baseline covariates $w_i$, and the current value
    of the longitudinal marker $m_{ik}(t)$. The specification of the joint model is
    completed by positing a suitable mixed-effects model for the observed longitudinal
    $y_i(t)$. Estimation of such joint models is based on exactly the same principles
    as for joint models with a single failure type. The only difference is in the
    construction of the likelihood for the event process. In particular this takes
    the form:


    ```

    $p(T_i, \delta_i | b_i; \theta_i, \beta) = \prod_{k=1}^K [h_{0k}(T_i)\exp{\gamma_k^T
    w_i + \alpha_k m_{ik}(T_i)}]^{(\delta_i=k)}\n\times \exp{-\sum_{k=1}^K h_{0k}(s)\exp{\gamma_k^T
    w_i + \alpha_k m_{ik}(s)} ds\}$ \quad (5.13)

    ```


    From a computational point of view, this part of the likelihood can be more easily
    calculated by transforming the data in the competing risk format'
