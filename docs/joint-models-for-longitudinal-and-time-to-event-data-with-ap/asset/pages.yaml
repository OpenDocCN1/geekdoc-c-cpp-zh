    TABLE 5.2: Log-likelihood and information criteria values for four latent class
    joint models fitted to the AIDS dataset with an increasing number of latent classes


    | Classes | logLik | AIC | BIC |

    | 2 | -4253.37 | 8554.75 | 8654.26 |

    | 3 | -4217.66 | 8505.32 | 8650.44 |

    | 4 | -4193.15 | 2478.30 | 8669.03 |

    | 5 | -4187.27 | 8488.53 | 8724.87 |


    Finally, in the latent membership multinomial model we assume that the prior probability
    of each patient belonging to a certain class depends on treatment,


    $Pr(c_i = g) = \frac{\exp(\lambda_{0g} + \lambda_{1g}ddI_i)}{\sum_{g=1} \exp(\lambda_{0g}
    + \lambda_{1g}ddI_i)}$


    We fitted four joint models with two, three, four and five classes, respectively.
    The AIC and BIC values are given in Table 5.2. We observe a quite strong disagreement
    between the two criteria. Namely, the AIC decreases steadily as the number of
    classes increases and favors the five class model, while the optimal model according
    to BIC is the three class model. Empirical studies in the literature have illustrated
    that the BIC often suggests the model with the correct number of latent subgroups
    (Proust-Lima et al., 2009; Lin et al., 2004). Following this recommendation we
    choose the model with three latent classes. The corresponding syntax to fit this
    model is


    ```

    > aidsLC <- aids[c("patient", "CD4", "obstime", "drug", "Time", "death")]

    > aidsLC$drug <- c(aidsLC$drug) - 1

    > aidsLC <- aidsLC[complete.cases(aidsLC),]

    > lcjmFit.aids <- JointCmm(fixed = CD4 ~ obstime + drug,

    \t\tmixture = ~ obstime + random = ~ obstime,

    \t\tclassb = ~ drug, subject = "patient", ng = 3, data = aids,

    \t\tsurvival = Surv(Time, death) ~ mixture(drug),

    \t\thazard = ~ "6-quant-piecewise", hazardtype = ~ "Specific")


    > summary(lcjmFit.aids)

    ```'
