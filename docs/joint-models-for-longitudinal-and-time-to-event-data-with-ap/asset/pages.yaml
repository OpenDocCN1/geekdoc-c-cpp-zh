  md: "# Joint Models for Longitudinal and Time-to-Event Data 79\n\nor a Wald Test,\
    \ with the test statistic defined as\n\n> $W = (\\hat{\theta} - \theta_0)^T \\\
    mathcal{I}(\\hat{\theta}) (\\hat{\theta} - \theta_0)$\n\nUnder the null hypothesis,\
    \ the asymptotic distribution of each of these tests is a chi-squared distribution\
    \ on $p$ degrees of freedom, with $p$ denoting the number of parameters being\
    \ tested. For a single parameter $\theta_j$ the Wald test is equivalent to $(\\\
    hat{\theta}_j-\theta_0)/s(\\hat{\theta}_j)$, under which the null follows an asymptotic\
    \ normal distribution. These test statistics are approximately low-order Taylor\
    \ series expansion of each other, and they are asymptotically equivalent. However,\
    \ in practice, when we are dealing with finite samples, they usually differ. In\
    \ this case, the likelihood ratio test is generally considered the most reliable\
    \ and the Wald test least reliable. The score and Wald test require fitting the\
    \ model only under the null and alternative hypotheses, respectively, whereas\
    \ the likelihood ratio test requires to fit the joint model under both hypothesis,\
    \ and thus it is more computationally expensive. If there is missing data in the\
    \ variable we are interested to test for, then the score test will be more efficient\
    \ since it requires fitting the model only under the null and avoids a case-wise\
    \ deletion of missing values (i.e., excluding subjects who have a missing value\
    \ in the variable of interest).\n\nIn the modeling process summary() function\
    \ also contains the Univariate Wald tests for testing whether each of the fixed\
    \ effects $\\beta$ in the longitudinal submodel, and the regression coefficients\
    \ $\\gamma\\u2227$ and the association parameter $\\alpha$ in the survival submodel\
    \ are statistically different from zero. If a general hypothesis is of interest,\
    \ the multivariate Wald test defined above could be used. For instance, for the\
    \ joint model fitted to the AIDS dataset, we would like to test whether the overall\
    \ effect in the longitudinal process is different from zero. This corresponds\
    \ to the following set of hypotheses:\n\n> $H_0: \\quad \\beta_1 = \beta_2 = 0$\n\
    $H_a: \\quad \\beta_1 \\neq 0 \\text{ or } \\beta_2 \\neq 0$,\n\nwhere $\\beta_1$\
    \ is the coefficient of the time effect, and $\beta_2$ the coefficient of the\
    \ interaction effect between time and treatment. Wald tests for joint models are\
    \ performed using function anova(). In this call we specify that we only need\
