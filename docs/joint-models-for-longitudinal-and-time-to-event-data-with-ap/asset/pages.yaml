    # 3.6 Further Reading


    The aim of this chapter is to present a brief introduction in the special characteristics
    of failure time data, and the basic statistical tools that have been developed
    in the literature for their analysis. However, this introduction was not intended
    to be at any exhaustive. There are many excellent texts in the literature that
    go into more depth regarding different aspects of survival data. In particular,
    Cox and Oaks (1984), Kalbfleisch and Prentice (2002), Lawless (2002), and Klein
    and Moeschberger (2003) explain in detail the special features of event time data,
    such as censoring and truncation, and present in detail and with examples the
    different statistical tools that are currently available for their analyses. A
    more theoretical treatment of the Cox model using point processes and martingales
    is given by Fleming and Harrington (1991), Andersen et al. (1993), and Aalen et
    al. (2008), while a practical point of view with primary focus in model building
    and model testing techniques, and their implementation in standard software is
    taken by Thneau and Grambsch (2000), Harrell (2001, Chapters 16-20), and Tableman
    and Kim (2003). Hougaard (2000) presents several methods'
