  md: '# Joint Models for Longitudinal and Survival Data


    $y_i^m$ is easily dropped. Thus, even if some subjects have intermittently missing
    responses, the likelihood of a joint model is easily obtained without requiring
    integration with respect to the missing responses. This is in contrast to the
    other two standard modeling frameworks for handling missing data. In particular,
    in the case of intermittent missing data and under both the selection and pattern
    mixture models framework cumbersome computations are required to evaluate the
    likelihood (Jansen and Molenberghs, 2008; Troxel et al., 1998, Troxel et al.,
    1998).


    # 4.7 Sensitivity Analysis under Joint Models


    A practical problem in the handling of missing data in longitudinal outcomes is
    the fact that the observed data cannot distinguish between a MAR and a MNAR mechanism.
    In fact, Molenberghs et al. (2008) have shown that every MNAR model has a MAR
    counterpart that provides exactly the same fit to the data (i.e., the same likelihood
    value), though inferences may be substantially different between the two models.
    This in practice means that identification of the nonignorability parameter(s)
    in any MNAR model is implicitly provided through sensitivity analysis. Therefore,
    the only pragmatic approach to investigate the impact of violation of any of these
    assumptions is only via a sensitivity analysis (Diggle et al., 2007; Jansen et
    al., 2006; Little and Rubin, 2002; Kenward, 1998; Copas and Li, 1997; Diggle and
    Kenward, 1994).


    Traditionally, the first step of a sensitivity analysis in the missing data-text
    is to compare the results of the postulated MNAR model with the results under
    the corresponding MAR model. In this setting we mean comparing the results of
    the joint model with the results of the longitudinal submodel (that are valid
    under MAR). We illustrate this first step of the sensitivity analysis for the
    AIDS dataset used in Section 4.2. The results under the linear mixed model we
    used to fit the joint model are


    ```

    > summary(lmeFit.aids)

