  md: "# Joint Models for Longitudinal and Survival Data\n\nis known to be biased.\
    \ This bias arises because the ML estimate of $\\sigma^2$ has not taken into account\
    \ the fact that $\beta$ is estimated from the data as well. An unbiased estimator\
    \ is obtained by dividing the residual of squares with $n-p$ (the residual degrees\
    \ of freedom), i.e.,\n\n```\n$$\\sigma^2 = \\frac{\\sum(y_i - x_i^\top\\hat{\\\
    beta})^2}{n-p}$\n```\n\nwhere $p$ denotes the dimensionality of the covariate\
    \ $x_i$. To address the same problem of maximum likelihood estimation, but in\
    \ the more general case of multivariate regression when estimating matrix $V_i$,\
    \ the theory of restricted maximum likelihood (REML) has been developed (Harville,\
    \ 1974). The main idea behind REML estimation is to separate the part of the data\
    \ used in the estimation of $V_i$ from the part used for the estimation of $\b\
    eta$. In other words, the fundamental idea in REML estimation of $V_i$ is to eliminate\
    \ $\beta$ from the likelihood so it is defined only in terms of $V_i$. REML estimation\
    \ proceeds by maximizing the slightly modified-likelihood function:\n\n```\n$$\\\
    ell(\\theta_b, \\sigma^2) = -\\frac{n}{2}\\log(2\\pi) + \\frac{1}{2}\\log\\sum_{i=1}^n\
    \ X_i^\top X_i - \\frac{1}{2}\\log\\sum_{i=1}^n X_i^\top V_i^{-1} X_i$.$\\n$-\
    \ \\frac{1}{2}\\sum_{i=1}^n \\log|V_i| + (y_i - X_i\\hat{\\beta})^\top V_i^{-1}(y_i\
    \ - X_i\\hat{\\beta})$\\n$\\npropto -\\frac{1}{2}\\sum_{i=1}^n \\log|V_i| - \\\
    frac{1}{2}\\sum_{i=1}^n (y_i - X_i\\hat{\\beta})^\top V_i^{-1}(y_i - X_i\\hat{\\\
    beta})$$\\n$- \\frac{1}{2}\\log\\sum_{i=1}^n X_i^\top V_i^{-1} X_i,$\n```\n\n\
    where $\\hat{\beta}$ is given by (2.3). The estimate $\\hat{V}_i$ obtained by\
    \ maximizing modified-likelihood corrects for the fact that $\beta$ also has been\
    \ estimated. Contrary to the estimator of $\beta$, neither the maximum likelihood\
    \ nor the restricted maximum likelihood estimator for the unique parameters in\
    \ $V_i$ can be written, in general, in closed form. Hence to obtain $V_i$, a numerical\
    \ optimization routine is required. Two frequently used algorithms are the Expectation-Maximization\
    \ (Dempster et al., 1977), and Newton-Rapson algorithms (Lange, 2004), whose implementation\
    \ for linear mixed-effects models can be found in Laird and Ware (1982), and Lindstrom\
    \ and Bates (1988).\n\nStandard errors for the fixed-effects regression coefficients\
    \ can be directly obtained by calculating the variance of the generalized least\
    \ squares estimator"
