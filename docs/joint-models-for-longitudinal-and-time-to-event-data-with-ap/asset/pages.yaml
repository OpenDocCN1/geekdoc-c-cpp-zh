  md: "# Joint Model Diagnostics\n\nnoninformative assumeativeness for the visiting\
    \ process can be formulated as\n\n```\n$p(u_{ik} | u_{i2}, \\dots, u_{i,k-1},\
    \ Y_i; \\theta_v) = p(u_{ik} | u_{i2}, \\dots, u_{i,k-1}, y(t_1), \\dots, y(t_{k-1});\
    \ \\theta_v), \\quad (6.9)$\n```\n\nwhere $\theta_v$ is the vector parameterizing\
    \ the visiting process density, and $\\{\\theta, \\theta_v\\}$ have disjoint parameter\
    \ spaces. To formulate a for the visiting process, we need to account for the\
    \ fact that the visiting times $u_{i2}^{\\dots u_{in}$ of each subject are correlated.\
    \ In multivariate survival data there are many families of models, namely marginal\
    \ models and conditional/frailty models (Hougaard, 2000; Therneau and Grambsch,\
    \ 2000). Marginal models are based on a similar idea as the generalized estimating\
    \ equations approach of Liang and Zebra (1986), which entails fitting an ordinary\
    \ Cox model to the multivariate data treating them as independent (i.e., ignoring\
    \ the correlation), and then adjust the standard errors using a sandwich-type\
    \ of estimator. On the other hand, conditional models explain the correlation\
    \ using latent variables. Similar to mixed models, we make a conditional independence\
    \ assumption that states the multivariate survival responses are independent given\
    \ the frailty term. Therefore, frailty models require the specification of both\
    \ a model for the multivariate survival responses conditional on the frailty term,\
    \ and appropriate distributional assumptions for the frailty term (Duchateau and\
    \ Janssen, 2008).\n\nFor our purposes, and because we want to provide a full specification\
    \ the conditional distribution $p(u_{ik} | u_{2}, \\dots, u_{i,k-1}, y(t_1), \\\
    dots, y(t_{k-1}); \\theta_v)$, and therefore a conditional model is more appropriate.\
    \ In particular, we use a Weibull model with a multiplicative frailty distribution,\
    \ defined as:\n\n```\n$\\lambda(u_{ik} | x_{vi}) = \\lambda_0(u_{ik}) \\exp(\\\
    gamma_i^T x_{vi}), \\quad \\omega_i \\sim \\Gamma(\\sigma_{\\omega}, \\sigma_{\\\
    omega}), \\quad (6.10)$\n```\n\nwhere $\\lambda()$ is the risk function on the\
    \ frailty term $\\omega_i$, $x_{vi}$ denotes the covariate vector that may contain\
    \ a functional form of the observed longitudinal responses $y(t_1), \\dots, y(t_{k-1})$;\
    \ $\\gamma_i$ is the vector of regression coefficients, and $\\sigma_{\\omega}^{-1}$\
    \ is the unknown variance of $\\omega_i$. The Weibull baseline risk function is\
    \ given by $\\lambda(u_{ik}) = \\phi u_{ik}^{\\psi-1}$, with $\\phi, \\psi > 0$.\
    \ Our choice for this model is motivated not only by its flexibility and simplicity,\
    \ but also by the fact that the posterior distribution of the frailty term, given\
    \ the observed data, is of standard form (Sahu et al., 1997), which as will be\
    \ shown below, facilitates simulation.\n\nSimilarly to Section 6.3.1, we assume\
    \ that both the joint model and the visiting process (6.10) have been fitted to\
    \ the data in hand, and that the maximum likelihood estimates $\\hat{\theta}$\
    \ and $\\hat{\theta}_v$, and their corresponding asymptotic covariance matrices,\
    \ $var(\\hat{\theta})$ and $var(\\hat{\theta}_v)$, respectively, have been obtained.\
    \ Let $t_{max}$ denote the end of the study, and $\\delta_{vik}$ the event indicator\
    \ corresponding to $u_{ik}$. Furthermore, taking into consideration the noninformative\
    \ assumption of (6.9), the elapsed visit time $u_{i,n+1}$ can be simulated"
