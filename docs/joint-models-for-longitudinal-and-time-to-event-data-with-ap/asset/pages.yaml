    # 5.5.2 Recurrent Events


    In the previous section we focused on the association between a longitudinal marker
    and different failure types. A similar setting emerges however when we are interested
    in a single event that may occur several times for each subject. For example,
    in the AIDS study, introduced in Section 1.2.2, patients provided CD4 cell counts,
    but they were also checked for the occurrence of opportunistic diseases. In this
    setting we may conjecture that higher CD4 cell counts are associated with a lower
    risk for opportunistic diseases, and in turn, that higher CD4 cell counts and
    a lower risk of opportunistic disease are associated with a lower risk for death.
    To statistically validate this hypothesis it is required to postulate a model
    that relates the three outcomes, namely the occurrence of opportunistic diseases,
    death, and the CD4 cell count. Other situation where we may be account for recurrent
    events in our analysis is encountered when the visiting process is informative.
    In particular, as we have noted in Section 4.3, the joint modelling analyses we
    have performed based on the assumption that the time elapsed between the visits
    of the patients may only depend on the observed longitudinal.., this assumption
    may be violated in practice, for instance, patients in a severe disease visit
    the hospital more often than patients in a mild stage. In this case, and even
    when we may primarily interested in the terminating event, it would be required
    to model the visiting process in order to obtain valid results. Detailed descriptions
    of the different modeling approaches for the analysis of recurrent event time
