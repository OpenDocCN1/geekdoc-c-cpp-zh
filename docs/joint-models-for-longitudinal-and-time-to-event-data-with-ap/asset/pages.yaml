  md: '# Extensions of the Standard Joint Model


    predictor of the cause-specific relative risk models, using status2 as the event
    variable, and calculating the sum of the rows corresponding to the ith subject.


    As an illustration, we fit a joint model to the PBC dataset, treating transplantation
    and death as competing events. For the longitudinal bilirubin responses we assume
    the linear mixed-effects model of Section 5.1.1 with quadratic equations in each
    patient with different average per treatment group:


    ```

    $y_i(t) = \beta_0 + \beta_1 D\text{-}pnc_i + \beta_2 t + \beta_3 t^2 + \beta_4\{D\text{-}pnc_i
    \times t\} + \beta_5\{D\text{-}pnc_i \times t^2\}\n b_{i0} + b_{i1}t + b_{i2}t^2
    + \epsilon_i(t)$.

    ```


    The call to lme.pbc <- to fit this model


    +   > lmeFit.pbc <- lme(log(serBililir) - drug * (year + I(year^2)), random =
    year + I(year^2) | id, data = pbc2


    For the event process assume the cause-specific relative risks models:


    ```

    $h_{i1}(t) = h_{01}(t)\exp{\gamma_{11}D\text{-}pnc_i + \gamma_{12}Age + \alpha_1
    m_i(t)}\nh_{i2}(t) = h_{02}(t)\exp{(\gamma_{21} + \gamma_{22})D\text{-}pnc_i +
    (\gamma_{12} + \gamma_{22})Age_i}\n +(\alpha_1 + \alpha_2)m_i(t)$.

    ```


    Using this formulation parameters $\gamma_{11}$, $\gamma_{12}$ and $\alpha_1$
    denote the effects of transplantation, age, and log bilirubin, respectively, on
    the risk of transplantation, and $\gamma_{21}$, $\gamma_{22}$ and $\alpha_2$ denote
    the additional effects of age and log bilirubin, respectively, on the risk of
    death. For example, $\gamma_{21}=0$ means that the hazard ratio for treatment
    is the same for both transplantation and death. Using dataset pbc2.idCR fit the
    corresponding Cox regressions by including the interaction terms of age and treatment
    with variables, including it as a stratification variable using strata():


    +   > coxFit.pbc <- coxph(Surv(years, status2) ~ (drug + age) * CR + strata(CR),
    data = pbc2.idCR, x = TRUE


