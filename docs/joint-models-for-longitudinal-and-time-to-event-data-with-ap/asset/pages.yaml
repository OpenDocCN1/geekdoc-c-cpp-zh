    \ only the observed information. In the E-step we compute the expected value of\
    \ the complete data log-likelihood:\n\n```\n$Q(\\theta \\| \\theta^{(it)}) = E[\\\
    log p(y;\\theta) \\| y^o;\\theta^{(it)})]$\\n$$\nint \\log p(y^m,\\theta^o) p(y^m\
    \ \\| y^o;\\theta^{(it)}) dy^m,\n```\n\nand in the M-step we update the parameters\
    \ by\n\n```\n$\\theta^{(it+1)} = \\arg\\max Q(\\theta \\| \\theta^{(it)})$\n```\n\
    \nOne of the great advantages of the EM algorithm is its numerical stability.\
    \ In particular, as it has been shown by Dempster et al. (1977), at each iteration\
    \ the EM algorithm leads to an increase of the data log-likelihood, i.e., $\\\
    log p(y^o;\\theta^{(it+1)}) \\geq \\log p(y^o;\\theta^{(it)})$, and avoids overshooting\
    \ or undershooting the maximum of the likelihood along its direction of search.\
    \ However, an important drawback of the EM is its slow rate of convergence in\
    \ a neighborhood of the maximum point. This directly reflects the amount of missing\
