    # 6.3.2 Random Visit Times


    The multiple imputation scheme presented in Section 6.3.1 assumes that visit times
    were prescribed by the protocol and all patients adhere to them. However, in observational
    studies the time points at which the longitudinal measurements are taken are not
    fixed by design but rather determined by the physician or even the patients themselves.
    This may even occur in randomized studies, by the protocol, have visit times.
    For the PBC dataset and during the first two years of follow-up, measurements
    of serum bilirubin were taken at baseline; 0.5, 1, and 2 years, with little variability,
    however, in the latter years the variability in the visit times increased considerably.
    Under the noninformatativity assumption mentioned in Section 4.3.2, and that the
    joint model is correctly specified, the visiting process can be ignored without
    influencing the asymptotic properties of the maximum likelihood estimators.


    However, the possibility of random visit times complicates the of multiple imputations,
    presented in Section 6.3.1. In particular, the time points when the $i$th subject
    was supposed to provide measures after the observed event $T_i$ are not available,
    and thus the corresponding rows $x_i^t_{(ij)}$ and $z_i^t_{(ij)}$, for $t_ij \ge
    T_i$, of the design matrices $X_i$ and $Z_i$, respectively, cannot be specified.
    This issue cannot be overcome by a naive approach of imputing $y_i^*$ at arbitrary
    fixed time points because it may contaminate the residuals plots by producing
    either too or too few residuals in specific ranges of the data where there are
    few observations. An alternative approach is to fit a suitable model for the visiting
    process and use to simulate future visit times for each individual. Formally,
    we assume, without loss of generality, that all subjects have at least one measurement
    and let $u_{ik}(k=2, \dots, n_i)$ denote the time elapsed between $k-1$ and visit
    $k$ for the $i$th subject. Also $Y_i^*$ denote the complete longitudinal response
    vector, that is all longitudinal responses that would have been observed for subject
    $i$ by time $t$, if she had not dropped out. Under these definitions, the'
