    ```


    The interpretation of parameter $\alpha1$ remains the same as in the standard
    parameterization (4.1). Parameter $\alpha2$ measures how strongly is associated
    with the value of the slope of the true longitudinal trajectory at time $t$ with
    the risk for an event at the same time point, provided that $m_i(t)$ remains constant.
