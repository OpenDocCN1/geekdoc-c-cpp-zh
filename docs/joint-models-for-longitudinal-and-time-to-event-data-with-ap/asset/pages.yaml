  md: '# Appendix B


    # The EM Algorithm for Joint Models


    In this appendix we provide the technical details behind the EM algorithm that
    is used to maximize the log-likelihood of joint models. For the remainder of this
    appendix it is assumed that the reader is familiar with the contents of Section
    4.3.2.


    # B.1 A Short Description of the EM Algorithm


    The Expectation-Maximization (EM) algorithm is a very general algorithm for maximum
    likelihood estimation in incomplete-data problems. The range of problems that
    can be attacked by the EM is remarkably broad, and includes problems that are
    not usually considered to involve missing data. The intuitive idea behind the
    EM algorithm is that the log-likelihood corresponding to the complete data is
    typically much simpler to maximize, often in close form. To take advantage of
    this feature, the algorithm has two steps: the Expectation (E) step and the Maximization
    (M) step. In the E-step we fix the missing data and we replace, in fact, the log-likelihood
    of the observed data with a surrogate function. This surrogate function is then
    maximized in the M-step. However, the price we pay for this simplification is
    that the EM algorithm is iterative the reconstruction of the missing data in the
    E-step is bound to be slightly wrong if the parameters do not already equal to
    their maximum likelihood estimates.


    In a nutshell each EM algorithm proceeds as follows: Let $Y$ denote'
