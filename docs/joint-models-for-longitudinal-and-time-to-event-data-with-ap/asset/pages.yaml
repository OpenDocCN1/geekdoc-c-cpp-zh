    Nevertheless, note that $D$ needs to be a valid, positive definite, covariance
    matrix, any random-effects structure will always imply positive marginal correlations.


    # 2.3 Missing Data in Longitudinal Studies


    A major challenge for the analysis of longitudinal data is the problem of missing
    data. Although longitudinal studies are designed to collect data on every subject
    in the sample at a set of prespecified follow-up times, it is often'
