- img_proc: true
  md: '# Joint Models for Longitudinal and Survival Data


    local maxima, and it is therefore recommended to refit the number of times using
    different sets of initial values and investigate convergence. It is evident that
    this problem in fact almost nullifies the computational advantage of having to
    numerically approximate integrals because refitting the model, even simpler than
    fitting the classical joint model, remains a computationally demanding task. This
    problem is also enhanced by the fact that the appropriate number of latent classes
    is not known a priori. Thus, it is required to fit several models with an increasing
    number of classes, and statistically choose which model provides the best fit
    to the data. This choice is typically based on information criteria.


    An additional issue with latent class joint models is the interpretability regarding
    the association structure is not straightforward. In particular, under the latent
    class formation there is no set of parameters that directly quantifies the strength
    of the association between the longitudinal outcome and the risk of an event,
    which in many cases is of primary subject-matter interest. Thus, this type of
    joint models are particularly useful when interest is in recovering latent heterogeneity
    in the target population, but not when direct interest is in providing any easy
    interpretation between the association mechanism of the two processes.


    In R latent class joint models are fitted using function Jointlmm() from package
    lcmm (Proust-Lima et al., 2011). Contrary to function linear-effects and survival
    models, function Jointlmm requires separate formula arguments that specify the
    different parts of the model. In particular, arguments fixed and random accept
    the formulas that define the fixed- and random-effects parts of the longitudinal
    submodel, and argument survival accepts the formula that specifies the survival
    submodel. The model for the baseline risk function is specified in argument hazard
    and its dependence on the latent classes by argument hazardtype. The last two
    formulas are classmb that specifies the latent predictor of the multinomial model
    in (5.11), and mixture specifies which components of the fixed effects in the
    longitudinal model are assumed to be depended on ci. Finally, using argument we
    specify that we want to fit a joint model with two classes. As an illustration
    we perform a joint model analysis of the AIDS dataset. The longitudinal part we
    include in the fixed part the main effect of time and treatment and in the random
    part intercepts and slopes:


    ```

    $y_i(t) \mid c_i = g = \beta_{0g} + \beta_{1g}t + \beta_{2g}ddI_i + b_{0i} + b_{1i}t
    + \varepsilon_i(t)$.$

    ```


    We assume that both covariates in the fixed part are dependent. The survival submodel
    we assume latent class baseline risk function and treatment effect,


    ```

    $h_i(t \mid c_i = g) = h_{0g}(\exp(\gamma_{g}ddI_i))$.$

    ```


    The class-specific baseline risk functions are assumed piecewise-constant with
    six knots placed at the corresponding percentiles of event times distribution.'
