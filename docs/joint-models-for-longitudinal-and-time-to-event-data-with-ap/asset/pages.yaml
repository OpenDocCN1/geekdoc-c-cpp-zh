    A standard example of an exogenous covariate is the time of the day or the season
    of the year. For instance, seasonal patterns have been recognized in suicides
    attempts, with higher occurrence encountered during the winter months. Another
    example of exogenous covariates are those whose complete path is predetermined
    from the beginning of the study. For example, in some studies there is interest
    in comparing treatment strategies in which the treatment dose is adjusted according
    to predetermined criteria. Yet another type of exogenous covariates are stochastic
    processes that are external to the subjects under study. For instance, the levels
    of environmental factors, such as air pollution, may be associated with the frequency
    of asthma attacks. In all of these examples it is clear that the value of these
    covariates at any point t is not affected by the true failure time, and therefore
    (3.9) is satisfied. By external covariates, and under condition (3.8) or (3.9),
    we can directly define the survival function conditional on the covariate path,
    using its relation to the hazard function, i.e.,


    ```

    $S_i(t | Y_i(t)) = Pr(T_i^* > t | Y_i(t))$$

    $$\= exp\left\{-\int_0^t h_i(s | Y_i(s)) ds\right\}.$$

