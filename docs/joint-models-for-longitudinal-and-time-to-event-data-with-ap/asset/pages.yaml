    4.3.2). Under the above conditional independence assumptions, a general definition
    of the latent class joint model involves the following submodels:


    ```

    $$h_i(t \mid c_i = g) \= h_{0g}(t) \exp(\gamma_g^T w_i),$

    $

    $$y_i(t \mid c_i = g) \= x_i^T(t)\beta_g + z_i^T(t)b_{ig} + \varepsilon_i(t),
    \varepsilon_i(t) \sim \mathcal{N}(0, \sigma^2), (5.11)$$

    $

    $$Pr(c_i = g) \= \exp(\lambda_g^T u_i) / \sum_{l=1}^G \exp(\lambda_l^T u_i),$$

    ```


    where we postulate that patients in latent groups have different longitudinal
    evolutions and risks for an event. The last equation specifies a multinomial submodel
    for the latent class membership probabilities, with $u_i$ denoting the vector
    of covariates associated with these probabilities with a corresponding vector
    of regression coefficients $\lambda^T = (\lambda_1^T, \dots, \lambda_G^T)$, with
    $\lambda_G = 0$ for identifiability. The random effects $b_{ig} \sim \mathcal{N}(\mu_g,
    \sigma_g^2 D)$ are also assumed to be latent-class specific, for computational
    stability, the covariance matrix is typically assumed to depend on $c_i$ only
    via the variance parameter $\sigma_g^2$.


    An advantageous benefit of the above specification of the latent class joint model
    is that the log-likelihood under this model takes the following form:


    ```

    $$\ell(\theta) = \sum_{i=1}^n \log \sum_{g=1}^G Pr(c_i = g; \theta) h_i(T_i \mid
    c_i = g; \theta)^{\delta_{ig}} S_i(T_i \mid c_i = g; \theta)$$\n$\n$\times \int
    [\prod p(y_{ij}(t_{ij}) \mid c_i = g, b_i; \theta)] p(b_i \mid c_i = g; \theta)
    db_i$\n$\n = \sum_{i=1}^n \log \sum_{g=1}^G Pr(c_i = g; \theta) h_i(T_i \mid c_i
    = g; \theta)^{\delta_{ig}} S_i(T_i \mid c_i = g; \theta)$$\n$\n \times p(y_i \mid
    c_i = g; \theta),$$

    ```


    which is much more tractable to compute compared to the classical joint model
    because it does not require numerical integration neither for the calculation
    of the survival function as in (4.2) nor for the calculation of the likelihood
    as in (4.9). In particular, the former integral in the definition of the survival
    function has a closed-form (depending, however, also on the model for the baseline
    risk function) because it does not involve any time-dependent components of the
    longitudinal process, and the latter integral with to the random effects also
    has a closed-form solution because it only entails the conditional longitudinal
    model $p(y_i \mid c_i = g, b_i)$, which as we have seen in Section 2.2.1, under
    the normality assumption for both components leads to a multivariate Gaussian
    distribution. However, an issue with latent class joint models is that the log-likelihood
    may have multiple'
