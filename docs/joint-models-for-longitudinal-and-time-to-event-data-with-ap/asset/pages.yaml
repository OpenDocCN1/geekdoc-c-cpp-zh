    fit these models have focused on two-stage methods. In particular, Self and Pawitan
    (1992) proposed a joint model with a relative risk submodel of the form (4.1)
    with an unspecified baseline risk function $h_0(t)$, and with the term $\exp\{am_i(t)\}$
    replaced by $[1+am_i(t)]$, such that the model would be linear in the random effects
    $b.$. The authors proposed to estimate this joint model using a two-step inferential
    approach, which at step one the random effects are estimated using a least-squares
    approach, and at step two these estimates are used to impute appropriate values
    of $m_i(t)$ that are substituted in the classical partial likelihood of the Cox
    model. Tsiatis et al. (1995) also developed a two-stage approach to estimate the
    joint model that combines (4.1) with (4.5), but without linearizing the hazard.
    In particular, for each unique event they proposed to replace in the partial likelihood
    contribution the term $m_i(t)|Y_i(t), T_i \ge t)$. For any time $t$, this estimate
    can be obtained by fitting the corresponding mixed model using the observed responses
    up to time $t$ from all the subjects at risk at $t$, and using the empirical Bayes
    estimates of the random effect $b_i$ to calculate the best unbiased predictor
    of $m_i(t)$.


    Even these approaches are relatively easy to implement with standard software,
    in instances they produce biased results. This has been shown with a series of
    simulations studies by Dafni and Tsiatis (1998), Tsiatis and Davidian (2001),
    Ye et al. (2008b), and Sweeting and Thompson (2011). For this reason instead of
    relying on approximations, the literature for this type of joint models has primarily
    focused on likelihood approaches that eliminate this bias.


    # 4.3.2 Joint Likelihood Formulation


    The main estimation method has been proposed for joint models is (semiparametric)
    maximum likelihood (Wulfsohn and Tsiatis, 1997; Henderson et al., 2000; Hsieh
    et al., 2006). The asymptotic properties of the semiparametric maximum likelihood
    estimators under an unspecified baseline risk function have been investigated
    by Zheng and Cai (2005). Bayesian estimation of joint models using MCMC techniques
    has been considered by Hanson et al. (2011), Chi and Ibrahim (2006), Brown and
    Ibrahim (2006), Xu and Zeger (2001), Wang and Taylor (2001), among others. Moreover,
    Tsiatis and Davidian (2001) have proposed a conditional score approach in which
    the random effects are treated as nuisance parameters, and they developed a set
    of unbiased estimating equations that yields consistent and asymptotically normal
    estimators.


    We give here basics of the maximum likelihood method for joint models as one of
    the more traditional approaches. The maximum likelihood estimates are derived
    as methods of the log-likelihood function corresponding to the joint distribution
    of the observed outcomes $\{T_i, \delta_i, y_i\}$. To define this joint distribution
    we will assume that the vector of time-independent random effects $b_i$ underlies
    both the longitudinal and survival processes. This means that'
