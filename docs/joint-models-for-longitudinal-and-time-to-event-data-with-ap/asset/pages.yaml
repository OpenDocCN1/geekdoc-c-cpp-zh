    research. Following Verbeke and Molenberghs (2000) and Molenberghs and Verbeke
    (2005), the generic correlated data encompasses several multivariate data structures,
    such as clustered data, repeated measurements, longitudinal data, and spatially
    correlated data. Our focus in this chapter is on longitudinal data, which can
    be broadly defined as the data resulting from the observations of subjects (e.g.,
    human beings, animals, or laboratory samples) that are measured repeatedly over
    time. Such data are frequently encountered in health sciences where longitudinal
    studies play a prominent role in enhancing our understanding of the development
    and persistence of disease. The distinguishing feature of longitudinal studies
    is that they permit the direct assessment of changes in the response variable
    over time, by measuring'
