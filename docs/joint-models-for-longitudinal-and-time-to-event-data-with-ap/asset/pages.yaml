    joint model for continuous longitudinal responses presented in Chapter 4. The
    interpretation for association parameters $\alpha$ under the different parameterizations
    remains the same as it was explained in Sections 5.1.1–5.1.5. For instance, for
    the current-value parameterization,


    ```

    $fm_i(t-c), b_i, w_{i2}; \alpha) = am_i(t),

