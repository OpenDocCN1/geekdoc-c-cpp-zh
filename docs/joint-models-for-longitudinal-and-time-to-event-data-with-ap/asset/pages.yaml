    > $AUC = \int_{0}^{1} ROC(p) \, dp.$


    A more intuitive interpretation of the AUC is provided by the equivalent formulation
    (Hanley and McNeil, 1982):


    $AUC = Pr(y_i > y_j \mid d_i = 1, d_j = 0). \quad (7.13)$


    This postulates that for any random pair $\{i, j\}$ of ''comparable'' subjects
    (i.e., whose status can be ranked, such as the one being diseased and the other
