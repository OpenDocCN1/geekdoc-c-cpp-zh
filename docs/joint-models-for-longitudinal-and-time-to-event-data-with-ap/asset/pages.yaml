    # 3.4 Time-Dependent Covariates


    In the relative risk model introduced that the hazard depends only on covariates
    whose value is constant during follow-up, such as at baseline, sex, randomized
    treatment, etc. However, in many studies it may be of interest to investigate
    whether time-dependent covariates are associated with the risk for an event. These
    could include, among others, environmental factors, biochemical and clinical parameters
    measured during follow-up, and adjustments to treatment dose.


    Before we explain how such covariates are handled in practice, we should distinguish
    between two different categories of time-dependent covariates, namely, external
    or exogenous covariates and internal and endogenous covariates. The reason why
    it is important to distinguish between time-varying covariates as an exogenous
    one. To introduce these two types of covariates, let y_i(t) denote the covariate
    vector at time t for subject i, and Y_i(t) = {y_i(s), 0 \le s \le t} denote the
    covariate history up to t. Following Kalbelfisch and Prentice (2002, Section 6.3),
    the formal definition of exogenous covariates requires them to satisfy the following


    ```

    $Pr\{s \le T_i^* < s + ds | T_i^* \ge s, Y_i(s)\\n= Pr\{s \le T_i^* < s + ds |
    T_i^* \ge s, Y_i(t)\},\quadquad (3.8)$

    ```


    for all s, t that $0 \le s \le t, and ds \to$ 0. An equivalent definition is


    ```

    $Pr\{Y_i(t) | Y_i(s), T_i^* \ge s\\} \ge Pr\{Y_i(t) | Y_i(s), T_i^* = s\},\quad
    s \le t,\quad (3.9)$

    ```


    which formalizes the idea that y_i(·) is associated with the risk of failures
    over time, but its future path up to any t > s is not affected by the occurrence
    of failure at time s. In particular, an exogenous covariate is a predictable process,
    meaning that its value at any time t is known infinitesimally before'
