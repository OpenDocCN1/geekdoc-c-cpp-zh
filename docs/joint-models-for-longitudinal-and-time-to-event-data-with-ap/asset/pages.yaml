  md: '# Joint Models for Longitudinal and Survival Data


    # 4.3.7 Convergence Problems


    We have seen in the previous two sections that fitting joint models for longitudinal
    and survival data requires a combination of double numerical integration and optimization.
    These requirements make joint models computationally and numerically much more
    demanding compared to separate analysis per outcome. This implies that in some
    occasions we may experience convergence problems. Function jointModel() attempts
    to make reasonable choices for default control arguments (e.g., number of quadrature
    points, number of iterations, tolerances, etc.), but these are not guaranteed
    to work in all datasets. Thus, joint models should also develop a general intuition
    on how to fine-tune the optimization procedure, by subtly changing the default
    values of the algorithm, in order to succeed in fitting the joint model(s) of
    interest in ‘difficult’ datasets. In that respect, jointModel() has the control
    argument verbose, which, if set to TRUE, the optimization path towards the maximum
    is printed on the screen. This argument can be used to spot a potential divergence
    of the algorithm early on, and therefore stop it and re-initiate with different
    defaults. In the majority of cases, the most helpful changes are changing the
    states (using init of jointModel()), increasing the number of EM iterations, and
    choosing other locations for the knots in the piecewise-constant or spline-based
    baseline functions.


    As an example of the usefulness of the verbose argument, we can elaborate the
    joint model for the Aortic Valve data. In particular, it can be seen from Figure
    4.2, some of the patients in the dataset showed non own evolutions in their aortic
    gradient values. Following the recommendations of Section 4.1.2 and in order to
    capture the nonlinear subject-specific evolutions, we postulate a flexible linear
    mixed-effects model that expands the time effect into B-splines basis matrix.
    The specification of this model is as follows:


    ```

    $y_i(t) = m_i(t) + \varepsilon_i(t)\n\n(\beta_0 + b_{i0}) + (\beta_1 + b_{i1})B_n(t,
    \lambda_1) + (\beta_2 + b_{i2})B_n(t, \lambda_2)\n\n+(\beta_3 + b_{i3})B_n(t,
    \lambda_3) + \beta_4{B_n(t, \lambda_1) \times Type0pRRR\}\n\n+\beta_5{B_n(t, \lambda_2)
    \times Type0pRRR\} + \beta_6{B_n(t, \lambda_3) \times Type0pRRR\}\n\n+\beta_7Age_i
    + \beta_8Type0pRRR + \varepsilon_i(t)$

    ```


    where $\{B_n(t, \lambda_k); k = 1, 2, 3\}$ denotes a B-spline basis matrix for
    a natural cubic spline of time with two internal knots placed at the 33.3% and
    66.7%'
