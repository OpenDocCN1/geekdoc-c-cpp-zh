    hat{\theta}, \\hat{var}(\\hat{\theta}))$. This assumption, combined with (6.7)\
    \ and (6.8), suggests the following simulation scheme:\n\n```\nS1: Draw $\theta^{(l)}\
    \ \\sim \\mathcal{N}\\{\\hat{\theta}, \\hat{var}(\\hat{\theta})\\$.\n\nS2: Draw\
