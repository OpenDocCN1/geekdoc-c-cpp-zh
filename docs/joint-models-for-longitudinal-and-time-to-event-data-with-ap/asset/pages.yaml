    # 5.1.4 Cumulative Effects Parameterization


    A common characteristic of all parameterizations we have seen so far is they assume
    the risk for an event at a specific time depends on features of the longitudinal
    trajectory at only a single time point. That is, from the entire history of the
    true marker levels $M_i(t)=m_i(s), 0 \leq s < t$, the risk at time $t$ is typically
    assumed to depend on either the marker on the same time point $m_i(t)$ or in a
    previous time point $m_i(t-c)$, if lagged effects are considered as. Several authors
    have argued that this assumption is not always realistic, and in many cases we
    may benefit by allowing the risk to depend on a more elaborate function of the
    longitudinal marker history (Sylvestre and Abrahamowicz, 2009; Hauptmann et al.,
    2000; Vacek, 1997).


    One approach that allows the whole history of the marker is to be associated with
    the hazard for an event is to include in the linear predictor of the relative
    risk submodel the integral of the longitudinal trajectory, representing the cumulative
    effect of the longitudinal outcome up to time $t$. A graphical representation
    of this parameterization is given in Figure 5.2. More specifically, the survival
    submodel takes the form


    ```

    $h_i(t) = h_0(t)\exp{\{\gamma^T w_i + \alpha \int_{0}^{t} m_i(s) ds\}, \quad (5.5)$

    ```


    where for any particular time $t$, $\alpha$ measures the strength of the association
    between the risk for an event at time $t$ and the area under the longitudinal
    trajectory up to the same time $t$, with the area under the longitudinal trajectory
    regarded as a suitable summary of the whole trajectory.


    To fit a joint model under this parameterization, we can exploit the flexibility
    provided by the derivForm argument of jointModel() for the specification of an
    extra marker term to be added in the linear predictor of the survival submodel.
    In particular, instead of specifying the R formulas to define the'
