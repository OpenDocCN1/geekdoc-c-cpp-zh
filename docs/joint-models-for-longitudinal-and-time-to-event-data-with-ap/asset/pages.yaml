    # 4.6 Connection with the Missing Data Framework


    So we have motivated joint models from a survival point of view, namely as a modeling
    framework to handle error-prone time-dependent covariates. We now turn our attention
    to the setting where the longitudinal outcome is of primary interest. In this
    case, occurrence of an event for a patient usually corresponds to a discontinuation
    of her longitudinal process. This is because either follow-up measurements can
    no longer be collected or their distribution changes after the event occurred
    and therefore considered non-relevant. Thus, under this setting it is evident
    that we can draw a direct connection between joint models and the missing data
    framework introduced in Section 2.3.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Joint Models for Longitudinal and Survival Data


    We should mention here that in clinical studies in which the terminating event
    is death, it may not be conceptually reasonable to consider the values of the
    longitudinal outcome after the event time (Kurland and Heagerty, 2005; Kurland
    et al., 2009). However, we should also note that even if we have even defined
    a mixed model (4.5) for the observed longitudinal responses, the joint model implicitly
    makes assumptions for the ''complete'' longitudinal response vector, including
    observations that would have been collected after the event or censoring. To illustrate
    this more clearly, we define for each subject the observed and missing part of
    the longitudinal response vector. The observed part $y_i^o = \{y(t_{ij}) : t_{ij}
    < T_i^*, j = 1, \dots, n_i^*\}$ consists of all observed measurements of the $i$th
    subject before the event time, whereas the missing part $y_i^m = \{y(t_{ij}) :
    t_{ij} \ge T_i^*, j = 1, \dots, n_i''\}$ contains the longitudinal measurements
    that would have been taken until the end of the study, had the event not occurred.
    Under these definitions, we can derive the dropout mechanism, which is the conditional
    distribution of the time-to-dropout given the complete vector of longitudinal
    responses. In particular, we obtain


    ```

    $p(T_i^* | y_i^o, y_i^m; \theta) = \int p(T_i^* | b_i, y_i^o, y_i^m; \theta) db_i\n=
    \int p(T_i^* | b_i, y_i^o, y_i^m; \theta) p(b_i | y_i^o, y_i^m; \theta) db_i\n=
    \int p(T_i^* | b_i) p(b_i | y_i^o, y_i^m; \theta) db_i, (4.20)$

    ```


    where the simplification in the last line is due to the conditional independence
    assumption (4.7). We observe that the time-to-dropout depends on $y_i^m$ through
    the posterior distribution of the random effects $b_i | y_i^o, y_i^m; \theta)$,
    which means that joint models correspond to a MINAR missing data mechanism. A
    closer inspection of (4.20) reveals that the key component behind the attrition
    mechanism in joint models is the random effects $b_i$. More specifically, and
    as we have seen, under the joint model


    ```

    ${\{ny_i(t) = x_i^*(t)\beta + z_i^*(t)b_i + \varepsilon_i(t)\

    h_0(t) = h_0(t)\exp[\gamma^T w_i + \alpha\{x_i^*(t) + z_i^*(t)b_i]\}$

    ```


    the survival and longitudinal models share the same random effects. Due to this
    joint models belong to the class of shared-parameter models, introduced in Section
    2.3.2 (Wu and Carroll, 1988; Wu and Bailey, 1989; Folimann and Wu, 1995; Vonesh
    et al., 2006). Under a random-effects structure (i.e., random intercepts and random
    slopes), this missing data mechanism implies that subjects who show steep increases
    in their longitudinal profiles may be more (or less) to drop out.


    A relevant issue here is the connection of the association parameter $\alpha$
    with the type of the missing data mechanism. In particular, a null value for $\alpha$
    corresponds to a MCAR missing data mechanism, because once conditioned upon'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Joint Models for Longitudinal and Time-to-Event Data


    available covariates, the dropout process does not depend on either missing or
    observed longitudinal responses. Moreover, since under $\alpha=0$ the parameters
    in the two submodels are distinct, the joint probability of the dropout and longitudinal
    processes can be factorized as:


    ```

    $p(T_i, \delta_i, y_i; \theta) = p(T_i, \delta_i; \theta_b) p(y_i; \theta_y, \theta_b)\\

    = p(T_i, \delta_i; \theta_b) \int p(y_i | b_i; \theta_y) p(b_i; \theta_b) db_i$

    ```


    implying that the parameters in the two submodels can be separately estimated.
    Nonetheless, because we have adopted a full likelihood approach, the estimated
    parameters from maximizing the log-likelihood of the longitudinal process $\ell(\theta_y)
    = \sum_i \log p(y_i; \theta_y)$, will also be valid under a MAR missing data mechanism,
    i.e., under the hypothesis that dropout depends on the observed responses only.
    Thus, while strictly speaking $\alpha=0$ corresponds to a MCAR mechanism, the
    parameter estimates that we obtain will be valid under MAR. As a side note, we
    should also mention that, in practice, a discontinuation of the data collection
    for the longitudinal process occurs when a subject leaves the study because of
    censoring. However, in the formulation of the likelihood function of joint models,
    we have assumed that the censoring mechanism may depend on the observed history
    of longitudinal responses and covariates, but is independent of future longitudinal
    outcomes. Under this assumption, censoring corresponds to a MAR missing data mechanism.


    An additional feature of the shared-parameter models framework is that these models
    can easily handle intermittent missingness and attrition. To see how this is achieved,
    we write the observed log-likelihood over the complete data model $\{y_i^n, y_i^m\}$
    for the longitudinal outcome:


    ```

    $\ell(\theta) = \sum_{i=1}^n \log p(T_i, \delta_i, y_i^n, y_i^m; \theta) dy_i^m\

    = \sum_{i=1}^n \log p(T_i, \delta_i, y_i^n, y_i^m | b_i; \theta) p(b_i; \theta)
    db_i\

    = \sum_{i=1}^n \log p(T_i, \delta_i | b_i; \theta) \{ \int p(y_i^n, y_i^m | b_i;
    \theta_y) dy_i^m \ p(b_i; \theta) db_i\

    = \sum_{i=1}^n \log p(T_i, \delta_i | b_i; \theta) p(y_i^m | b_i; \theta_b) p(b_i;
    \theta) db_b..

    ```


    Under the first conditional independence assumption (4.7) we obtain that the missing
    longitudinal responses $y_i^m$ are only involved in the density of the longitudinal
    submodel. Moreover, under the second conditional independence assumption (4.8)
    the longitudinal responses conditionally on the random effects are independent
