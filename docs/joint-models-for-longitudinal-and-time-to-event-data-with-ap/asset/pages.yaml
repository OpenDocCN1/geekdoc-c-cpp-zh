    issue dictated by the analyst''s belief about the "true" underlying biological
    mechanism that generates the data. In particular, (4.5) points out the trajectory
    followed by a subject throughout time is dictated by the time-independent random
    effects $b_i$ alone. This implies that the shape of the longitudinal profile of
    each subject is an inherent characteristic of this subject that is constant in
    time. On the other hand, (4.6) includes both a serial correlation stochastic term
    and random effects attempts to more precisely capture the features of the longitudinal
    trajectory by allowing the subject-specific trends to vary in time. We should
    note that because the random-effects and a stochastic serial correlation process
    attempt to appropriate the marginal correlation in the data, there is a contest
    for information between the two approaches. For instance, if we have postulated
    a linear mixed model with random-intercepts and random-slopes structure and there
    is excess correlation not adequately captured, extending this model by either
    including the serial correlation term or considering a more elaborate random-effects
    structure (e.g., splines in the design matrix $Z_i(t)$) could produce practically
    indistinguishable fits to the data. Therefore, even though it seem intuitively
    appealing to use both random-effects and serial correlation structures, it is
    advisable to opt for either of them. Computationally the random-effects approach
    is easier to implement in practice because it only requires an appropriate specification
    of the random-effects design matrix $Z_i(t)$.


