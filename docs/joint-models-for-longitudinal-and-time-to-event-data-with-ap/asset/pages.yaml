  md: "# Joint Models for Longitudinal and Survival Data\n\nTherefore, combining Equations\
    \ (7.19), (7.20) and (7.21), and calculating their expectation with respect to\
    \ the asymptotic posterior distribution of the parameters $\\{\theta \\mid D_n\\\
    } \\sim \\mathcal{N}(\\theta, \\hat{var}(\\theta)),$, we arrive at the following\
    \ simulation scheme:\n\n+   - S1: Draw $\\theta^{(l)} \\sim \\mathcal{N}(\\theta,\
    \ \\hat{var}(\\theta))$.\\n- S2: Draw $\\mathcal{Y}_i^{(l)}(t) \\sim \\mathcal{N}(X_i\
    \ b_i^{(l)} + Z_i b_i^{(l-1)}, [\\sigma^{(l)}^2])$.\\n- S3: Draw $b_i^{(l)} \\\
    sim \\{b_i \\mid T_i^* > t, \\mathcal{Y}_i^{(l)}(t), \\theta^{(l)}\\}$.\\n- S4:\
    \ Compute $\\mathcal{E}_1(b_i^{(l)}, \\theta^{(l)})$ and $\\mathcal{E}_2(b_i^{(l)})$.\n\
    \nSteps 1–4 are repeated $l = 1, \\dots, L$ times, where $L$ denotes the number\
    \ of Monte Carlo samples. As Before, Step 1 is used to account for the variability\
