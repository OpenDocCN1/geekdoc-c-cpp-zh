  md: "# Joint Models for Longitudinal and Survival Data\n\nThis is justified from\
    \ the standard relationship (Tierney and Kadane, 1986):\n\n$$\\tilde{b}_i^{(t)}\
    \ = \\hat{b}_i^{(t)} + O([n_i(t)])$\n\nthat holds under sufficient smoothness\
    \ of $p(b \\mid T_i^* > t, \\mathcal{Y}_i(t); \\theta)$, and in time $n_i(t)$\
    \ denotes the mean of longitudinal responses for subject $i$ by time $t$. As we\
    \ have also noted in Section 4.5, the mean and the mode of the posterior distribution\
    \ of the random effects are typically very close, and we also expect negligible\
    \ differences between the two aforementioned estimators of $\\omega_i(u \\ t)$.\
    \ For practical purposes, we prefer estimator (7.10), because the mode is usually\
    \ a better location measure than the mean, especially when the distribution is\
    \ skewed. Nevertheless, obtaining the standard error of either of the two estimators\
    \ is very difficult because $\\hat{b}_i^{(t)}$ and \\\tilde{b}_i^{(t)}$ are nonlinear\
    \ functions of $\\theta$ that cannot be written in closed form. To overcome this\
    \ we use a simple Monte Carlo approach as in Section 7.1.2. In particular, combining\
    \ (7.8) with (7.9), and assuming again that the sample size is sufficiently large\
    \ that $\\{\\theta \\mid D_n\\}$ can be well approximated by a normal distribution\
    \ centered at the MLEs $\\hat{\\theta}$ and variance-covariance matrix inverse\
    \ of the observed information matrix $\\hat{\\mathcal{I}}(\\hat{\\theta})^{-1}$,\
    \ , we obtain the following simulation scheme:\n\n| S1: Draw $\\theta^{(t)} \\\
    sim N(\\{\\hat{\\theta}, \\hat{var}(\\theta)}\\})$ | |\n| S2: Draw $b_i^{(t)}\
    \ \\sim \\{b_i \\mid T_i^* > t, \\mathcal{Y}_i(t), \\theta^{(t)}\\}$ | |\n| S3:\
    \ Compute $\\omega_i^{(t)}(u \\mid t) = x_i^{\\top}(u)\\beta(t) + z_i^{\\top}(u)b_i^{(t)}$\
    \ |\n\nSteps 1 and 2 are exactly the same as in the simulation scheme of Section\
    \ 7.1.2, and are used to account for the variability in $\\hat{\\theta}$ and $\\\
    hat{b}_i^{(t)}$, respectively. Using the simulated values for the parameters and\
    \ the random effects, Step 3 entails the calculation of the predicted value for\
    \ unobserved longitudinal outcome $y_i(u)$. The corresponding 95% pointwise confidence\
    \ intervals can be obtained from 2.5% and 97.5% percentiles of $\\omega_i^{(t)}(u\
    \ \\mid t), l=1,...,L$. An advantageous feature of the above simulation scheme\
    \ is that it can be easily modified to produce prediction intervals. More specifically,\
    \ instead of setting $\\omega_i^{(t)}(u \\mid t)$ to the realization of the subject-specific\
    \ mean, we simulate a value from the corresponding normal distribution, i.e.,\
    \ $\\omega_i^{(t)}(u \\mid t) \\sim N\\{x_i^{\\top}(u)\\beta(t) + z_i^{\\top}(u)b_i^{(t)},\
    \ [\\sigma^{(i)}]^2\\}$.\n\nFurthermore, note that, similar to Section 7.1.2,\
    \ we can also alternatively"
