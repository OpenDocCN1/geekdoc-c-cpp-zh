    \ each subject, $l=1, \\dots, L$ times, where $L$ denotes the number of imputations.\
    \ Steps 1 and 2 account for the uncertainties in the parameter and empirical Bayes\
    \ estimates, respectively, whereas Step 3 imputes the missing longitudinal residuals.\
    \ Steps 1 and 3 are straightforward to perform since they require sampling from\
    \ a multivariate normal distribution; on the contrary, the posterior distribution\
    \ for the random effects given the observed data in Step 2 is of a non-standard\
    \ form, and thus a sophisticated approach is required to sample from. Rizopoulos\
    \ et al. (2010) proposed to use a Metropolis-Hastings algorithm with independent\
    \ proposals from a multivariate $t$ distribution centered at the empirical Bayes\
    \ estimates $\\hat{b}_i$, with scale matrix $\\varb(b)$, and four degrees of freedom.\
    \ A similar approach has been used by Booth and Hober (1999) to simulate from\
    \ the posterior distribution of the random effects in the generalized linear mixed\
    \ models. In the joint modeling framework, the justification for a multivariate\
    \ $t$ proposal is twofold. First, Rizopoulos et al. (2008) have shown that, as\
    \ $n_i$ increases, the leading term of the posterior distribution of the random\
    \ effects is the logarithm of the distribution of the linear mixed model $\\log\
    \ p(y_i \\mid b_i; \\beta^{(0)}) = \\sum_j \\log p(y_{ij} \\mid b_i)$, which is\
    \ quadratic in $b_i$ and resembles that of a multivariate normal distribution,\
    \ and second, for small $n_i$, the heavier tails of the $t$ distribution ensure\
    \ sufficient coverage. The simulated $y_i^{(m)}(t_{ij})$ values together with\
    \ $y_i^o$ can be used to calculate residuals according to (6.2) or (6.4). A key\
    \ advantage of the multiply-imputed residuals is that they inherit the properties\
    \ of the complete data model. This facilitates common graphical checks without\
    \ requiring formal derivation of the reference distribution of the observed residuals.\
