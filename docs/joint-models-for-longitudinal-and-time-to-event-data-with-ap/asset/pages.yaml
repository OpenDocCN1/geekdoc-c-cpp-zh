  md: "# Extensions of the Standard Joint Model\n\n# 5.3 Stratified Relative Risk\
    \ Models\n\nIn many real examples it is not realistic to assume that the sample\
    \ at hand comes from a homogeneous population. For instance, in multicenter clinical\
    \ trials the different centers are expected to have different baseline functions\
    \ due to varying populations and referral patterns. A standard extension of relative\
    \ risk models that handles such settings is to allow for multiple strata. In particular,\
    \ patients are assumed to be divided into different strata, with each stratum\
    \ having its own baseline hazard function, but common values for the regressions\
    \ coefficients $\\gamma$ and $\\alpha$. Under a stratified model, the risk for\
    \ patient $i$ belonging to stratum $k$ is given by\n\n```\n$h_{0k}(t) = h_{0k}(t)\\\
    exp{\\gamma^{\\top}w_i + \\alpha m_i(t)}, \\quad (5.9)$\n```\n\nwith $h_{0k}$\
    \ denoting the baseline hazard function for stratum $k$. Joint models with a stratified\
    \ relative submodel are available in package JM under the B-spline-approximated\
    \ baseline risk function (4.4). A joint model for the PBC dataset, with a stratified\
    \ submodel accounting to the presence or absence of hepatomegaly, is fitted\n\n\
    ```\n> lmeFit.pbc <- lme(logSerBil) ~ drug * (year + I(year^2)),\n random = ~\
    \ year + I(year^2) | id, data = pbc2\n```\n\n```\n> coxFit2.pbc <- coxh(Surv(years,\
