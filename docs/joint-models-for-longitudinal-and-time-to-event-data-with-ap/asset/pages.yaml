    # 1.3 Inferential Objectives in Longitudinal Studies


    It is evident from the previous section that in longitudinal studies typically
    a wealth of information is recorded for each patient, and interest often lies
    in complex associations between these different pieces of information. Before
    discussing in more detail possible interrelationships that could be of interest
    in a longitudinal setting, we will first make a distinction between two types
    of outcomes recorded in these studies. First, we will call explicit outcomes the
    outcomes that are explicitly specified in the study protocol to be recorded during
    follow-up. For example, in the PBC study these include the information on the
    patients, and the longitudinal measurements of biomarkers. The second kind of
    outcomes, which we call implicit outcomes, are the outcomes that are not of direct
    interest but nonetheless complicate the analysis of the explicit. A characteristic
    example is missing data. In particular, even according to the protocol patients
    are typically required to appear at the study center(s) at prespecified occasions
    to provide information, this is rarely done in practice. Patients often miss some
    of their visits or may completely drop out from the study for a variety of reasons.
    For instance, as we saw in the AIDS dataset, out of the 2335 measured patients,
    1405 were actually recorded, leading to 39.8% of missing responses. Another example
    of an implicit outcome, closely related to the missing, is the visiting process,
    which is defined as the mechanism (stochastic or deterministic) that generates
    the time points at which longitudinal measurements are collected (Lipsitz et al.,
    2002). Random visit times are more encountered in observational studies where
    the time points at which the longitudinal measurements are not fixed by design
    but rather determined by the physician or even the patients themselves. Nonetheless,
    random visit times may occur in randomized studies that have been pre-specified
