    # 5.6 Accelerated Failure Time Models


    An alternative modeling framework for event time data when the proportionality
    assumption in (4.1) fails is the accelerated failure time (AFT) models. These
    model specify that predictors act multiplicatively on the failure time or additively
    on the log failure time. The idea is that predictors alter the rate at which a
    subject proceeds along the axis, i.e., accelerate or decelerate the time of failure
    (Kalbfleisch and Prentice, 2002). AFT models are typically defined as


    ```

    $log T_i^* = \gamma^T w_i + \sigma_i \varepsilon_{ti}, \quad (5.15)$

    ```


    where $\sigma_i$ is a scale parameter and $\varepsilon_{ti}$ is assumed to follow
    a specific distribution. Parameter $\gamma_j$ denotes the change in the expected
    log failure time for a unit change in the covariate $w_{ij}$. Equivalently, a
    unit change in $w_{ij}$ increases the failure time by a factor of $\exp(\gamma_j)$.
    Standard options for the distribution of the error terms $\varepsilon_{ti}$ are
    the normal, Student’s-t, and the extreme value distribution. The last option corresponds
    to a Weibull distribution for $T_i^*$, which is the only distribution (together
    with its special case, the exponential) that accepts both a relative risk and
    an AFT model formulation.


    In order to incorporate time-dependent covariates within this framework, we let
    $S_0$ denote an continuously baseline survival function, and we follow the formulation
    of Cox and Oakes (1984, Section 5.2) that postulates


    ```

    $$\int_0^{T_i^*} \exp{\gamma^T w + \alpha(s)} ds \sim S_0.$

    ```


    This can be rephrased in terms of the rate function for subject $i$ as


    ```

    $h_i(t | M_i(t), w_i) = h_0(V_i(t))exp{\gamma^T w_i + \alpha_i(t)}, \quadquad
    (5.16)$

    ```


    with


    ```

    $V_i(t) = \int_0^t \exp{\gamma^T w_i + \alpha_i(s)} ds.$

    ```


    Similar to (4.1), the baseline risk function $h_0(\cdot)$ can be assumed of a
    specific parametric form or modeled flexibly. An important difference of (5.16)
    compared to (4.1) is that for the entire covariate history $M_i(t)$ is assumed
    to influence the subject-specific risk $h_i(t)$ $h_0(\cdot)$ is evaluated at $V_i(t)$.
    An issue when introducing time-varying covariates in AFT models is that interpretation
    becomes more complicated because parameter $\alpha$ is involved in both terms
    in the right-hand side of (5.16). In particular, the survival function for a subject
    with covariate history $M_i(t)$ is $S_i(t | M_i(t)) = S_0(V_i(t))$, which means
    that this subject ages on an accelerated schedule $V_i(t)$ compared to $S_0$;
    for more information we refer to Cox and Oakes (1984, Section 5.2). Within the
    joint modeling framework, accelerated failure time models have been discussed
    by Tseng et al. (2005).'
