    of the covariate at $t \ge s$, which has a direct implication violation of the
    endurance condition (3.9). Moreover, a consequence of identity (3.10) is that,
    contrary to exogenous covariates, the hazard function, defined before as not directly
    related to a survival path. That is, the functions


    ```

    $h_i(t | Y_i(t)) = \lim_{dt \to 0} Pr\{T_i^* < t+dt | T_i^* \ge t, Y_i(t)\}/dt,$$

    ```


    ```

    $S_i(t | Y_i(t)) = exp\left\{-\int_0^t h_i(s | Y_i(s)) ds\right\} \quad and \quad
    p(t | Y_i(t)) = \frac{h_i(t | Y_i(t))}{S_i(t | Y_i(t))},.$

    ```'
