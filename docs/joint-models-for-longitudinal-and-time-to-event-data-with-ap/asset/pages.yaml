    # 1.3.1 Effect of Covariates on a Single Outcome


    The most common type of research questions in medical studies, in general, is
    to estimate or test for the effect of a set of covariates in some outcomes of
    interest. For example, for the AIDS patients we would like to know whether ddi
    improves the survival rates, or whether there is a difference in the average longitudinal
    profiles of the CD4 cell counts between males and females. The answer to such
    questions requires one to postulate a suitable statistical model that relates
    the covariate(s) to the outcome of interest. Depending on the nature of the outcome
    several types of statistical models are available. A review of the basic modeling
    frameworks for longitudinal and event time data is given in Chapters 2 and 3,
    respectively.


    # 1.3.2 Association between Outcomes


    Often it is also of interest to investigate the association structure between
    outcomes. For instance, in the PBC dataset physicians are interested in measuring
    shortly associated the current level of serum bilirubin with the risk for death.
    A similar example occurs in asthma studies, where the risk for an asthma attack
    may be correlated with the levels of air pollution. At first glance, these research
    questions seem similar to the ones posed in Section 1.3.1, with the only difference
    being that the covariate process is now time-dependent. Thus, one could simply
    proceed by postulating suitable models that relate the two outcomes of interest.
    For example, we could formulate a time-dependent Cox model for the hazard for
    death and include the longitudinal CD4 cell count measurements as a time-dependent
    covariate-n-8. Nevertheless, an important feature that we need to carefully consider
    is that in such models the outcome variables play the role of both the response
    and the covariate. To process in this setting we first need to discern the type
    of covariate-outcome process, and in particular whether the covariate-outcome
    is internal (also known as endogenous) or external (also known as exogenous) to
    the response-outcome. Formal definitions of endogeneity are given later in Chapter
    3. However, a more intuitive manner to distinguish between internal and external
    covariates is by understanding the nature of a time-dependent covariate process.
    To put it loosely, internal covariates are generated from the patient herself
    and therefore require the existence of the patient. Revisiting the previous two
    examples, we note that the CD4 cell count and the hazard for death are stochastic
    processes generated by the patient herself, and therefore the CD4 cell count constitutes
    an internal covariate process. On the other hand, air pollution is an external
    covariate to asthma attacks, since the patient has no influence on air pollution.
    When the covariate-outcome is external to the response-outcome, we can'
