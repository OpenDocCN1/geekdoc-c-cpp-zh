    # 5.2 Handling Exogenous Time-Dependent Covariates


    In the previous section we saw several possible formulations of the association
    structure between an endogenous time-dependent covariates and risk for an event.
    However, in some cases it may also be of interest to incorporate into the linear
    predictor of the relative risk add exogenous time-dependent covariates. For example,
    in transplantation studies, we may want to examine the association between a biomarker
    recorded on the patient level and the risk for death, while accounting for the
    time-dependent effect of transplantation. With the standard current value parameterization
    (4.1) for the endogenous covariates, the relative risk model can be easily extended
    to handle exogenous covariates,


    $h_i(t) = h_0(t) \exp{\gamma^top w_i(t) + am_i(t)\},


    where the covariate $w_i(t)$ now contains both baseline and exogenous time-dependent
    covariates. Moreover, the alternative parameterizations of Section 5.1 can be
    considered for the endogenous covariate, and some of those for the exogenous one
    as well, such as, interaction effects with baseline covariates, lagged effects
    and cumulative effects, where for the latter the integral in (5.5) or (5.6) is
    replaced by a sum. The estimation of the joint model with both exogenous and endogenous
    time-dependent covariates proceeds in the same manner as with only endogenous
    covariates. The only practical difference is in the calculation of the integral
    in the definition of the survival function, which for computational reasons,


    ```

    $S_i(t | M_i(t), w_i) = \exp(-\int_0^t h_i(s) ds)$

    ```


    ```

    $= \exp(-\sum_{q=1}^{Q_i} \Omega_{iq}} h_0(s) \exp{\gamma^top w_{iq}(s) + am_i(s)\}
    ds),

    ```


    where $\{\Omega_{iq}, q=1, \dots, Q_i\}$ denote the time intervals during which
    the exogenous time-dependent covariates $w_i(t)$ are assumed constant.


