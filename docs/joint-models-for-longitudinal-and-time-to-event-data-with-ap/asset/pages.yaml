    #  5.7 Joint Models for Categorical Longitudinal Outcomes


    # 5.7.1 The Generalized Linear Mixed Model (GLMM)


    So we have primarily focused on continuous longitudinal responses. However, in
    many cases interest lie in the association between a categorical longitudinal
    outcome and time-to-event. In this context it is evident that the linear mixed
    model (4.5) cannot be used anymore, since it is only applicable for normally distributed
    biomarkers. An alternative framework which is nowadays routinely used for the
    analysis of discrete repeated data is the generalized linear mixed model (Breslow
    and Clayton, 1993). The main reasons for its widespread applicability are that
    it is a straightforward extension of the generalized linear models (McCullagh
    and Nelder, 1989) to multivariate data, and that it is currently possible to fit
    this type of models in a wide range of software packages.


    To define GLMMs, let $y_i(t)$ denote the outcome measure at time $t$ for subject
    $i, i = 1, \dots, n$. We also note that $y_i = \{y_{ij}, j = 1, \dots, n_i\}$
    the $n_i$-dimensional vector of observed responses for the $i$th subject. Conditionally
    on the $q_i$-dimensional random-effects vector $b_i$, assumed to be independently
    drawn from $N(0, D)$, the outcomes $y_i$ are independent with densities from the
    exponential family of distributions


    ```

    $p(y_i | b_i; \varphi) = \exp \left\ \sum_{j=1}^{n_i} y_{ij} w_{ij}(b_i) - c(\{w_{ij}(b_i)\})
    \right] / a(\varphi) - d(y_i, \varphi) , \quad (5.17)$

    ```


    where $w_{ij}(\varphi)$ and $\varphi$ denote the mean and dispersion parameters
    in the exponential family, respectively, and $c(\cdot)$, $d(\cdot)$ and $a(\cdot)$
    are known functions specifying the member of the exponential family. Different
    choices for these functions cover the Binomial, Poisson, Gamma, and normal distributions
    among others. We complete the specification of the model by defining the mean
    of Nelder, $y_i(t)$'
