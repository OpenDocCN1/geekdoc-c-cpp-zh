    before, the joint model is fitted by providing the mixed-effects and Cox models
    as main argument to jointModel(). Since strata() term has been included in coxph(),
    only option "spline-PH-aGH" or "spline-PH-GH" is available for the method argument
    of jointModel(). In addition, to specify that the survival part of the'
