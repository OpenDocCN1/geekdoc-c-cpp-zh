    # ## Longitudinal Data Analysis


    This chapter introduces the linear mixed-effects model for the analysis of continuous
    longitudinal responses that constitutes the first building block of joint models
    for longitudinal and event time data. Special attention is given on the frequently
    encountered problem of missing data. In particular, we present the different types
    of mechanisms describing the association structure between the longitudinal responses
    and the missingness process, and we explain under which circumstances a joint
    modeling analysis of the two outcomes is required.


    # 2.1 Features of Longitudinal Data


