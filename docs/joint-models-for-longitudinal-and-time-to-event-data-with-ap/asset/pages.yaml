    In a similar manner and using the definition of the trapezoidal rule, the sum
    of the twelve integrals in the denominator $[C_{\Delta dyn}^{10}]$ is derived
    as


    ```

    > Denom <- sum(b - a) * (head(Surv.Plcb, -1) + tail(Surv.Plcb, -1)) / 2

    ```


    Analogously, we also derive the sum of the twelve integrals in the numerator of
    $[C_{\Delta dyn}^{10}]$ based on the time-varying AUCs of each of the three models:


    ```

    > Numer MI <- sum(b - a) * (head(AUCs.MI * Surv.Plcb, -1) + tail(AUCs.MI * Surv.Plcb,
    -1)) / 2

