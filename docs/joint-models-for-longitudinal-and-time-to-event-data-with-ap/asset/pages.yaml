  md: '# # Chapter 4


    # # Joint Models for Longitudinal and Time-to-Event Data


    Based on the linear mixed-effects and relative risk models presented in the previous
    two chapters, we introduce here the standard joint model for longitudinal and
    time-to-event data. We discuss maximum likelihood estimation of the model''s parameter,
    including optimization and numerical integration algorithms, inference for the
    regression coefficients and the random effects, and we present a tool for investigating
    the sensitivity of inferences for the longitudinal outcome to the assumptions
    for the dropout process.


    # ## 4.1 The Basic Joint Model


    As we have seen in Section 3.5, the extended Cox model is only appropriate for
    exogenous time-dependent covariates and therefore cannot handle longitudinal biomarkers.
    When primary interest is in the association between such endogenous time-dependent
    covariates and survival, an alternative modeling framework has been introduced
    in the literature, known as the joint modeling framework for longitudinal and
    time-to-event data (Faucett and Thomas, 1996; Wulfsohn and Tsiatis, 1997; Henderson
    et al., 2000; Tsiatis and David-ian, 2004). The motivating idea behind these joint
    models is to couple the survival model, which is of primary interest, with a suitable
    model for the repeated measurements of the endogenous covariate that will account
    for its'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# 52 Joint Models for Longitudinal and Survival Data


    special features, elucidated in Section 3.4. To introduce this modeling framework,
    we will use similar notation in Chapters 2 and 3. In particular, we define by
    $T_i^*$ the true event for the $ith$ subject, $T_i$ the observed event time, defined
    as the minimum of the potential censoring $C_i$ and $T_i^*$, and $\delta_i = I(T_i^*
    \le C_i)$ the event indicator. For the endogenous time-dependent covariate (e.g.,
    a biomarker) we let $y_i(t)$ denote its observed value at time $t$ for the $ith$
    subject. We should note that we do not actually observe $y_i(t)$ for any time
    $t$, but rather only at the very specific $t_{ij}$ at which measurements were
    taken. Thus, the observed longitudinal data consist of the measurements $y_{ij}
    = \{y_i(t_{ij}); j = 1, \dots, n_i\}$.


    # 4.1.1 The Survival Model


    Our aim is to measure the association between the longitudinal marker level and
    the risk for an event, while accounting for the special features of the former.
    To achieve we introduce $m_i(t)$ that denotes the true and unobserved value of
    the longitudinal outcome at time $t$. Note that $m_i(t)$ is different from $y_i(t)$,
    with the latter being contaminated with measurement error value of the longitudinal
    outcome at time $t$. To quantify the strength of the association between $m_i(t)$
    and the risk for an event, a straightforward approach is to postulate a relative
    risk model of the:


    ```

    $h_i(t \mid M_i(t), w_i) = \lim_{dt\to 0} Pr{T_i^* < t+dt \| T_i^* \ge t, M_i(t),
    w_i\}/dt\n= h_0(t) \exp{\gamma^T w_i + am_i(t)}\}, \quad t > 0, \quad (4.1)

    ```


    Where $M_i(t) = m_i(s), 0 \le s \le t$ denotes the history of the observed longitudinal
    process up to time $t$; $h_0(t)$ denotes the baseline function, and $w_i$ is a
    vector of baseline covariates (such as a treatment indicator, history of diseases,
    etc.) with a corresponding vector of regression coefficients $\gamma$. Similarly,
    parameter $\alphaalpha quantifies the effect of the underlying longitudinal outcome
    to the risk for an event. The interpretation of $\gamma$ and $\alpha$ is exactly
    as we have seen in Section 3.5. In particular, $\exp(\gamma_{ij})$ denotes the
