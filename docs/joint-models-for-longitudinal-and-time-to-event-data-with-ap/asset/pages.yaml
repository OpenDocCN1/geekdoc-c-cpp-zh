  md: '# Preface


    Joint models for longitudinal and time-to-event data have become a valuable tool
    in the analysis of follow-up up data. These models are applicable mainly in two
    settings: First, when the focus is on the survival outcome and we wish to account
    for the effect of an endogenous time-dependent covariate measured with error,
    and second, when the focus is on the longitudinal outcome and we wish to correct
    for nonrandom dropout. Due to the capability of joint models to provide valid
    inferences in settings where simpler statistical tools fail to do so, and their
    wide range of applications, the last 25 years have seen many advances in the joint
    modeling field. Even though interest and developments in joint models have been
    widespread, information about them has been equally scattered in articles, presenting
    recent advances in the field, and in book chapters in a few texts dedicated to
    either longitudinal or survival data analysis. However, no single monograph or
    text dedicated to this type of models seems to be available.


    The purpose in writing this book, is to provide an overview of the theory and
    application of joint models for longitudinal and survival data. In the literature
    two main frameworks have been proposed, namely the random effects joint model
    that uses latent variables to capture the associations between the two outcomes
    (Tsiatis and Davidian, 2004), and the marginal structural joint models based on
    G estimators (Robins et al., 1999, 2000). In this book we focus on the former.
    Both subfields of joint modeling, i.e., handling of endogenous time-varying covariates
    and nonrandom dropout, are equally covered and presented in real datasets. Motivated
    by the background and collaborations of the author, these examples come from the
    medical field and in particular from biomarker research. Nevertheless, joint models
    of this'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'type can be employed whenever there is interest in the association between
    a longitudinal and an event outcome, and therefore have numerous applications
    in other fields as well. In addition, several extensions are presented, including
    among others, different types of association structure between the longitudinal
    and survival outcomes, inclusion of stratification factors, incorporation of lagged
    effects, the handling of exogenous time-dependent covariates, and competing risks
    settings. For the longitudinal part, primary focus is given on continuous longitudinal
    outcomes and the use of mixed-effects models.


    All the answers included in the book are implemented in the R software environment
    for statistical computing and graphics, using the freely available package JM
    written by the author. This package fits a wide range of joint models, including
    the extensions mentioned above. However, it does not cover all of the types of
    joint models that have been proposed in the literature, and therefore, some extensions,
    such as joint models for categorical longitudinal markers and multiple longitudinal
    markers are introduced in the text, but without software illustration. The results
    presented in the text were produced using version 1.0-0 of package JM and R 2.15.0.
    The current version of the package can be obtained from the Comprehensive R Archive
    Network (cran-project.org). Because of platform dependencies, the analysis results
    may be expected to vary slightly with different computers or operating systems,
    and further versions of R and the package. All the code used in the text is available
    from the supporting Web site


    ```

    http://jmr.r-forge.r-project.org

    ```


    The author would appreciate being informed of typos, errors and improvements to
    the contents of this book, and may be contacted via electronic mail at


    d.rizopoulos@erasmusmc.nl


    # Prerequisites


    The contents in this book assume familiarity with basic concepts of statistical
    data analysis at the level of an introductory course in statistics, including
    standard maximum likelihood theory, and a strong background in regression analysis.
    Some background knowledge of mixed effects models and survival analysis would
    also be beneficial but is not required. Similarly, with respect to R, the book
    does not assume any prior knowledge, but basic familiarity with the language would
    be helpful.'
  merge: -1
