  md: '# Joint Models for Longitudinal and Survival Data


    We will call rules that are based on a single assessment of the marker, as in
    Example 1, *simple prediction rules*, and rules involving more than one marker
    evaluations, as in Examples 2 and 3, *composite prediction rules*. Since our interest
    here is in utilizing the observed levels $Y_i(t)$ up to time $t$ to predict events
    in the medically relevant interval $(t, t+\Delta t)$, the sensitivity and specificity
    are defined as:


    ```

    $TP_i^{\Delta t}(c) = Pr\{P_i^y(t, k, c) \mid T_i^* > t, T_i^* \in (t, t+\Delta
    t); \theta^y\};$

    ```


    and


    ```

    $1 - FP_i^{\Delta t}(c) = Pr\{P_i^y(t, k, c) \mid T_i^* \le t, T_i^* > t+\Delta
    t; \theta^y\};$

    ```


    According to the categorization of Heagerty and Zheng (2005) presented in Section
    7.4.2, the above specifications correspond to cumulative sensitivity and dynamic
    specificity, respectively. In addition, note that these accuracy measures are
    not only time-dependent but also depend on the length of the medically relevant
    interval $\Delta t$. This means that for the different models may exhibit different
    discrimination power for different $\Delta t$. As before, the overall discrimination
    capability of the longitudinal marker for all possible thresholds $c \in \mathbb{R}_y$
    can be assessed using the corresponding ROC curve


    ```

    $ROC^{\Delta t}(p) = TP^{\Delta t}\{[FP^{\Delta t}]^{-1}(p)\}^{-1}(p),\$

    ```


    where $p$ is in $[0, 1]$ and $[FP^{\Delta t}]^{-1}(p) = inf_c\{c : ROC^{\Delta
    t}(c) \le p\}$, and the area under the ROC curve:


    ```

    $AUC^{\Delta t} = \int_0^1 ROC^{\Delta t}(p) \ dp.$

    ```


    # 7.4.4 Discrimination Indices


    An important feature of all the accuracy measures for survival data we have presented
    so far is that they describe how a marker (baseline or timeependent) can discriminate
    between patients at a specific followup time $t$. Therefore, at different time
    points the marker may exhibit different levels of discrimination, and thus a relevant
    question is how we can summarize the discriminative capability of the marker over
    the whole follow-period. To evaluate the overall performance of baseline markers,
    Harrell et al. (1982) have proposed a concordance index based on a modification
    of the Kendall-Goodman-Kruskal-Somers type correlation coefficient (Goodman and
    Kruskal, 1979). This can be seen as an extension of the AUC (7.13) in the binary
    context with a time-dependent disease status. Namely, for a random pair of subjects
    $\{i, j\}$ whose true event times can be ordered such that subject $i$ experienced
    the event before subject $j$, then we are interested in'
  merge: -1
