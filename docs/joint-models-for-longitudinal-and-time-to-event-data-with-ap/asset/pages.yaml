    being larger than the observed duration, and $\xi_q$ denotes the value of the
    hazard as the number of knots increases the flexibility of the baseline hazard
    becomes more flexible. In the limiting case where each interval $[v_{q-1}, v_q]$
    contains only a single true event (assuming no ties), this model is equivalent
    to leaving $h_0(\cdot)$ completely unspecified and estimating using nonparametric
    maximum likelihood. For regression splines model the baseline risk function $\log
    h_0(\cdot)$ is expanded into B-spline basis functions for cubic splines as follows:


