    # 5.7.2 Combining Discrete Repeated Measures with Survival


    Working under the GLMMs framework presented in Section 5.7.1, it is rather straightforward
    to define a joint model for a categorical longitudinal outcome. In particular,
    utilizing the same conditional independence assumptions (4.7) and (4.8), as in
    the case of continuous responses, we can define separate models for the longitudinal
    and event processes, conditional on the random effects bᵢ. In principle, all extensions
    that we have seen so far are directly applicable for categorical markers as well.
    Following the model formulation of Section 5.1 allows for different parameterizations,
