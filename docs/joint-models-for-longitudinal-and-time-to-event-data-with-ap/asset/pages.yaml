  md: "# Joint Models for Longitudinal and Survival Data\n\n# 6.3 Multiple Imputation\
    \ Residuals\n\n# 6.3.1 Fixed Visit Times\n\nTo overcome the problems caused by\
    \ the nonrandom dropout and produce residuals for the longitudinal process that\
    \ can be easily read in diagnostic plots, Rizopoulos et al. (2010) proposed to\
    \ augment the observed data with randomly imputed longitudinal responses under\
    \ the complete data model, corresponding to the longitudinal outcomes that would\
    \ have been observed had the patients not dropped out. Using these augmented longitudinal\
    \ responses, residuals are then calculated for the complete data, and a multiple\
    \ imputation approach is used to properly account for the uncertainty in the imputed\
    \ values due to missing (Gelman et al., 2005).\n\nTo present this idea, we will\
    \ recall the notation of Section 4.6, and denote by $y_i^o=\\{y_i(t_{ij}) : t_{ij},\
    \ j=1,\\dots,n_i\\}$ the observed part of the longitudinal response vector that\
    \ contains all longitudinal measurements of the $i$th subject and by $y_i^m=\\\
    {y_i(t_{ij}) : t_{ij} \\ge T_i; j=1,\\dots,n_i^m\\}$ the missing part that contains\
    \ the longitudinal measurements that would have been taken until the end of the\
    \ study, the event had not occurred. We also assume that the joint model has been\
    \ fitted to the dataset at hand, and that we have obtained the maximum likelihood\
    \ estimates $\\hat{\theta}$ and an estimate of their asymptotic covariance matrix\
    \ $\\hat{v}(\\hat{\theta})$. Moreover, that longitudinal measurements are planned\
    \ to be taken at a set of preset time points $t_1,\\dots,t_{max}$ and that, for\
    \ the $i$th subject, measurements are available up to the last prefixed time earlier\
    \ than $T_i$. To put ideas forward, we adopt a Bayesian formulation of the joint\
    \ model, since multiple imputation has Bayesian grounds (Little and Rubin, 2002,\
    \ Chapter 10). In particular, the multiple imputation approach is based on repeated\
    \ sampling from the posterior distribution of the parameters, averaged over the\
    \ posterior distribution of $y_i^m$. Under the joint model (4.9) and the dropout\
    \ mechanism (4.20), the density for this distribution can be expressed as\n\n\
    ```\n$p(y_i^m \\mid y_i^o, T_i, \\delta_i) = \\int p(y_i^m \\mid y_i^o, T_i, \\\
    delta_i, \\theta) p(\\theta \\mid y_i^o, T_i, \\delta_i) d\\theta. \\quad (6.7)$\n\
    ```\n\nThe first part of the integrand in (6.7) can be derived from (4.20) taking\
    \ into account the conditional independence assumptions (4.7) and (4.8), i.e.,\n\
    \n```\n$$\\begin{aligned} p(y_i^m \\mid y_i^o, T_i, \\delta_i) &= \\int p(y_i^m\
    \ \\mid b_i, y_i^o, T_i, \\delta_i, \\theta) p(b_i \\mid y_i^o, T_i, \\delta_i)\
    \ db_i \\ &= \\int p(y_i^m \\mid b_i, \\theta) p(b_i \\mid y_i^o, T_i, \\delta_i)\
    \ db_i. \\end{aligned} \\quad (6.8)$\n```\n\nFor the second part, which is the\
    \ posterior distribution of the parameters given the observed data, we use arguments\
    \ of standard asymptotic Bayesian theory (Cox and Hinkley, 1974, Section 10.6),\
    \ and assume that the sample"
