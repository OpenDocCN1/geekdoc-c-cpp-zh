    # 5.1.2 Lagged Effects


    In some cases the typical assumption that the current value of the time-dependent
    covariates affects the current risk for an event may lead to medically illogical
    conclusions. For example, this has been observed by Cavendish et al. (1992) in
    a study on patients with coronary artery disease noted that the current smoking
    status decreased the risk for death (although not statistically significantly).
    The reason behind this result was that most of those who died were smokers, but
    many had stopped smoking at the last follow-up before their death. Thus, many
    of the patients who had just quit smoking, whereas some of the patients who were
    still alive were still smoking, leading to the surprising result.


    One approach to tackle such situations is to use time-lagged covariates. In particular,
    we use the following formulation of the relative risk model:


    ```

    h_i(t) = h_0(t)\exp[\gamma^T w_i + am_i\max(t-c, 0)], (5.3)

    ```


    which postulates that the risk at time t depends on the true value of the longitudinal
    marker at time t-c, where c specifies the time lag of interest. Lagged effects
    are easily incorporated in the specification of the joint model in R using the
    lag argument of function jointModel(). As an illustration, we fit two points joint
    to the Liver Cirrhosis dataset. For the longitudinal part and in order to allow
    for a flexible specification of the subject-specific longitudinal trajectories,
    we assume a linear mixed model with a natural cubic spline for time, with different
    average profiles per treatment group. In addition, to capture sudden changes in
    the prothrombin index in the very early part of follow-up in each treatment group,
    we also include a separate'
