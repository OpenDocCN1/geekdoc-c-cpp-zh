    ```

    > Numer MII <- sum(b - a) * (head(AUCs.MII * Surv.Plcb, -1) + tail(AUCs.MII *
    Surv.Plcb, -1)) / 2

    ```


    ```

    > Numer MIII <- sum(b - a) * (head(AUCs.MIII * Surv.Plcb, -1) + tail(AUCs.MIII
    * Surv.Plcb, -1)) / 2

    ```


    Finally, the dynamic discrimination indices are simply obtained by calculating
    the corresponding ratios:


    ```

    > Numer MI / Denom Cdyn Model (I)

    [1] 0.7209312

    > Numer II / Denom Cdyn Model (II)

    [1] 0.6824211

    > Numer MIII / Denom Cdyn Model (III)

    [1] 0.7293451

    ```


    Comparing the values of the three indices that summarize the discrimination capability
    over the ten year follow-up period, we observe that the increased accuracy Model
    (III) showed at $t=4$ over the other models is diminished. In particular, Models
    (I) and (III) offer practically the same level of discrimination, which is bit
    better than the one offered by Model (II). This implies that, for the patients
    under study, the current value of the prothrombin index $m_i(t)$ seems to play
    a more prominent role with respect to discrimination than the slope of the true
    trajectory $m_i''(t)$.'
