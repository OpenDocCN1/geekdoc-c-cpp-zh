    excess events (i.e., to reveal subjects that poorly fit by the model) and for
    evaluating whether the appropriate functional form for a covariate interest has
    been used in the model.


    An alternative type of residuals for survival models, related to the marginal
    residuals, the Cox-Snell residuals (Cox and Snell, 1968). For each subject, these
    are calculated as the value of the estimated cumulative risk function evaluated
    at the observed event $T_i$, that is,


    ```

    $r_i^{T} = \int_{T_0}^{T_i} h_0(s \mid \mathcal{M}_i(s); \tilde{\theta}) ds\n\nr_i^{cs}
    = \int_{T_0}^{T_i} \hat{h}_0(s) \exp{\{\hat{\Gamma} w_i + \hat{m}_i(s)\} ds, \quad
    (6.6)$

    ```


    and thus $r_i^{cs} = N_i(T_i) - r_i^{m}(T_i)$. According to the probability integral
    transform, when the assumed model fits the data we will check that the probability
    of failure after time $t$, i.e., $S(t) = \text{Pr}(T_i > t)$ will have a uniform
    distribution in $[0, 1]$, and therefore the cumulative hazard, defined as $\mathcal{H}(t)
    = -\log S(t)$ will have a unit exponential distribution. This identity implies
    that we can check the overall goodness-of-fit of our relative submodel by checking
    the Cox-Snell residuals $r^{cs}$ are uniformly distributed. However, a complexity
    in the practical use of these residuals is that they are evaluated at the observed
    event $T_i$, and thus $T_i$ is censored, $r_i^{cs}$ will be censored. Hence, in
    order to check the fit of the model, while accounting for the fact that $r_i^{cs}$
    is actually a censored sample from a unit exponential distribution, we compare
    the survival function of the unit exponential distribution, $S_{exp}(t) = \exp(-t)$,
    with the Kaplan-Meier estimate of the survival function $r_i^{cs}$.


    We illustrate the use of the martingale and Cox-Snell residuals in R by continuing
    the residuals for the joint model fitted to the AIDS dataset, presented in Section
    6.1.1, and validate the fit of the survival part. Similar to the calculation of
    residuals for the longitudinal process, both types of residuals for the survival
    model are extracted using the `\texttt{residuals}()` generic function. We start
    by examining the chosen functional form for the time-dependent marker. Namely,
    in the relative risk submodel defined in the previous section, we have assumed
    that the current value of the marker is associated with the risk for data, that
    is,


    ```

    $h_i(t) = h_0(t) \exp{\{\gamma dD_i + \alpha m_i(t)\}}$

    ```


    However, as we have seen in Section 5.1, there are several alternative parameterizations
    that can be used to describe the relationship between the risk for an event and
    the marker, which may be more appropriate. As we have seen in that section, these
    parameterizations can be, in general, formulated as


    ```

    $h_i(t) = h_0(t) \exp{\{\gamma dD_i + \alpha f\{m_i(t)\}}$

    ```'
