    systematic trend that was clearly seen in the loess curve based on the observed

    data alone. This is a strong indication that this systematic trend was primarily

    due to dropout and not model misfit.


    # 6.4 Random-Effects Distribution


    The last component of the joint model for which we have made distributional

    assumptions are the random effects. As we have already seen, in mixed models,

    in general, the standard choice is to assume that the random effects are

    normally distributed with mean zero and covariance matrix D, even though,

    tmany times, this choice is not actually made on computational grounds. The

    main problem in checking the appropriateness of the normal distribution is

    that the random effects are latent quantities that do not lend themselves to

    straightforward construction of residuals, i.e., observed quantity minus expected/fitted
    quantity. Nonetheless, in the standard mixed models literature,

    it has been that linear mixed-effects models are relatively robust to

    misspecification of this distribution (Verbeke and Lesaffre, 1997). However,

    in generalized linear mixed models there is more ambiguity regarding this

    topic, with some authors reporting sensitivity of the derived inferences to

    the distribution of the random effects (Heagerty and Kurland, 2001); Agresti

    et al., 2004; Litière et al., 2007, 2008), and some others reporting robustness

    (Neuhaus et al., 1992, 1994, 2011).


    In joint models and for two reasons, there has been even more

    concern regarding how much a potential misspecification of the random-effects

    distribution may influence the derived inferences. First, random effects have

    a more prominent role in joint models because they are used to capture both

    t correlations between the repeated measurements in the longitudinal outcome

    to to build the association between the longitudinal and time processes.

    Second, as we have already explained in Section 6.2, the nonparametric dropout

    cused by the occurrence of events complicates matters because in the missing

    data literature it is known that inferences in random dropout settings can

    be highly sensitive to modeling assumptions (Copas and Li, 1997; Molenbergs

    et al., 2008).


    These features motivated Song et al. (2002) to propose a flexible model

    for this distribution based on the class of smooth densities studied by Gallant

    and Nychka (1987) and Tsiatis and Davidian (2001) to propose a semarametric estimating
    equations approach that provides valid inferences without

    requiring them to specify the random-effects distribution. However, simulation
    findings

    of these authors suggested that parameter estimates and standard errors

    were rather robust to misspecification. This feature has been later theoretically

    cally corroborated by Rizopoulos et al. (2008) and Huang et al. (2009), who

    showed, as the number of repeated measurements for subject $n_4$ increases,'
  merge: -1
