    marginal Wald tests for all regression coefficients are performed, whereas when
    fitted joint models are supplied, the function performs the corresponding LRT.
    In the latter case, the user is primarily responsible to provide nested joint
    models in order for the LRT to be valid (i.e., the code does minimal checking
    to validate this). Examples using this function can be found in Sections 4.4.1
    and 5.1.


    Function plot() produces diagnostic plots for the longitudinal and survival process.
    This includes, among others, the scatterplot of subject-specific residuals versus
    the subject-specific fitted values, and the QQ-plot of the subject-specific residuals
    for the longitudinal outcome, and the fitted marginal survival function for the
    time-to-event. Examples using this function can be found in Sections 6.1.1 and
    5.3.


    Function predict() produces subject-specific and marginal predictions for the
    longitudinal outcome, along with confidence or prediction confidence intervals.
    Subject-specific predictions are produced conditionally on the fact that the subject
    was still alive up to a specific time point. Examples using this function can
    be found in Sections 4.4.2, 7.2, and 7.3.


    Function logLik() extracts the log-likelihood value of the fitted model, including
    as an attribute the number of parameters, and function AIC() can be used to compute
    the Akaike''s and Bayesian information criteria.


    # C.2 Additional Functions


    Function survfitJM() produces subject-specific predictions (along with associated
    confidence intervals) of conditional survival probabilities. The estimated probabilities
    and confidence intervals can be depicted by the corresponding plot() method. Examples
    using this function can be found in Sections 7.1.3 and 7.3.


    Function rocJM() produces estimates, on a joint model, of time-dependent sensitivity
    and specificity, and the corresponding areas under the ROC for investigating the
    discriminative capability of the longitudinal outcome in distinguishing patients
    who will or will not within a prescribed time interval. The corresponding plot()
    method produce the plots of the ROC curves. Examples using this function can be
    found in Section 7.4.6.


    Function Wald.strata() performs a Wald test for stratified joint models testing
    the null hypothesis of no differences between the baseline hazard functions in
    different strata. An example using this function can be found in Section 5.3.'
