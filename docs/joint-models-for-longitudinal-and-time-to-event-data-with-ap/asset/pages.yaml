    Endogenous covariates, on the other hand typically arise as time-dependent measurements
    taken on the subjects under study. These include biomarkers and clinical parameters,
    such as the serum bilirubin levels for patients with primary biliary cirrhosis,
    CD4 cell counts for HIV-infected patients, the thrombin index for patient with
    liver cirrhosis, and aortic gradient level for patients with aortic stenosis (see
    Section 1.2). There are several important features that complicate statistical
    analysis with such covariates. The first important characteristic of endogenous
    covariates is that they typically require the survival of the subject for their
    existence. Thus, when failure is defined as the death of the subject, their path
    carry direct information about the failure time. More specifically, provided that
    $y_i(t-ds)$ as $ds \to 0$ exists, the survival function satisfies


    ```

    $S_i(t | Y_i(t)) = Pr(T_i^* > t | Y_i(t)) = 1. \quad (3.10)$

