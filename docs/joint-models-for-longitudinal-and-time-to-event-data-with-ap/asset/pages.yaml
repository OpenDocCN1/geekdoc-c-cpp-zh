    $t < T_i^*$, but then plays the role of a case when $t = T_i^*$. Here sensitivity
    measures the expected fraction of subjects with a marker level exceeding the threshold
    $c$ among the subpopulation of individuals who have the event at $t_i$, while
    specificity measures the fraction of subjects with a marker level less or equal
    to $c$ among those who survive time $t$.


    An important feature of all the above definitions is that they are time-dependent,
    meaning that the capability of the marker to discriminate between cases and controls
    changes as time progresses. After selecting definitions for the time-dependent
    sensitivity and specificity, ROC curves and the areas under these curves can be
    computed in the same manner as in the binary context. These measures will also
    be time-varying and reflect how the accuracy of the marker evolves during follow-up.


    # 7.4.3 Prediction Rules for Longitudinal Markers


    Following Rizopoulos (2011) and Zheng and Heagerty (2007), we extend now the framework
    of the time-dependent accuracy measures of the previous cases to longitudinal
    markers. It has been previously noted, an inherent characteristic of the studies
    that require a joint modeling approach to answer the scientific questions of interest
    is their dynamic nature. Namely, as longitudinal information is collected for
    a subject, we can continuously update the predictions of her survival probabilities.
    This taking into account, it is of medical relevance to distinguish patients that
    are about to experience the event within a time after their last measurement from
    patients that are going to surpass this time without an event. In setting a useful
    property of the longitudinal marker would be to successfully discriminate between
    these patients. In particular, as we assume that we have collected a set of longitudinal
    measurements $Y_i(s) : 0 \leq s \leq t$ up to time point $t$ for subject $i$.
    We are interested in events occurring in the relevant time frame $(t, t+\Delta
    t]$ within which the physician can take an action (e.g., initiate or change treatment)
    to improve the survival chance of this patient. Using an appropriate function
    of the marker history $Y_i(t)$, we can define a prediction rule to discriminate
    between patients of high and low risk for an event. For instance, for PBC patients
    we consider values of the log serum bilirubin larger than a specific threshold
    as predictive for death. Since we are in a longitudinal context, we have the flexibility
    of determining which values of the longitudinal history $Y_i(t)$ of the patient
    will contribute to the specification of the prediction rule. To allow full generality
    we consider a vector of threshold values $(t, k, c) \geq c_s$, based on which
    we define


    ```

    $$\mathcal{P}_i^*(t, k, c) = \{y_i(s) \geq c_s; k \leq s \leq t\}$

    ```


    as a ‘success’, i.e., the marker indicates that the event will occur, and


    ```

    $$\mathcal{P}_i^*(t, k, c) = \mathbb{R}^{k(t)} \setminus \{y_i(s) \geq c_s; k
    \leq s \leq t\}$

    ```'
