    \ estimates $\\theta_{-h} = (\\beta, \\sigma, \\gamma, \\alpha)$ that are based\
    \ on the profile score vector,\n\n```\n$S(\\theta_{-h}, \\dot{h}_0(\\theta_{-h}))\
    \ = -\\frac{\\partial}{\\partial\\theta_{-h}}} l_p(\\theta_{-h}, \\dot{h}_0(\\\
    theta_{-h}))$,\n```\n\nwill be greatly underestimated. To overcome this problem,\
    \ use Bootstrapping (Efron and Tibshirani, 1994) to estimate standard errors when\
    \ an unspecified baseline risk function is used. However, it is evident that such\
