  md: '# Joint Models for Longitudinal and Time-to-Event Data


    calculation of the log-likelihood and the score vector. This feature combined
    with the requirement for numerical optimization makes the fitting of joint models
    a computationally intensive task.


    From the two integrals involved in the specification of a joint model, the one
    with respect to the random effects is the main computational bottleneck. In particular,
    the integral in the definition of the survival function is always a unidimensional
    one, and it can be relatively efficiently approximated using the 7-point or 15-point
    Gauss-Kronrod rule (Press et al., 2007). However, the integral with respect to
    the random effects becomes computationally demanding to approximate as its dimensionality
    increases. Standard numerical integration techniques to evaluate such multidimensional
    integrals include Gaussian quadrature rules and Monte Carlo sampling, have been
    routinely utilized in fitting joint models in the literature (Wolfson and Tsiatis,
    1997; Henderson et al., 2000; Song et al., 2002). Furthermore, Rizopoulos et al.
    (2009) and Ye et al. (2008a) have discussed the use of Laplace approximations
    for joint quadrature and Monte Carlo, in settings where a high-dimensional random-effects
    vector is posted (e.g., to capture nonlinearities as explained in Section 4.1).
    Nonetheless, all of these approaches remain computationally demanding and constitute
    the main reason why joint models have not yet found their rightful place in the
    toolbox of modern applied statistics.


    An alternative approach to the computational burden to some degree has been proposed
    by Rizopoulos (2012a). The idea behind this approach is to first the mixed-effects
    model for the longitudinal outcome and extract information regarding the location
    and scale of the posterior distribution of the random effects given the longitudinal
    responses for each subject. This information is used to appropriately rescale
    the subject-specific integrands in the definitions of the log-likelihood and score
    vector of the joint model. To motivate this approach, we first introduce the standard
    and adaptive Gauss-Hermite rules for the calculation of the score vector of a
    joint model. Under the standard Gauss-Hermite rule, and for any form of the $A(\cdot)$
    function of the random effects, the integral in the definition of the score vector
    is approximated by a weighted sum of integrand evaluations at prescribed abscissas:


    ```

    $E\{A(\theta, b_i) | T_i, \delta_i, y_i; \theta\} = \int A(\theta, b_i) p(b_i
    | T_i, \delta_i, y_i; \theta) \db_i$$

    \approx 2^{q_b/2} \sum_{t_1\cdotst_q}^K \pi_t A(\theta, \sqrt{b_t}) p(b_t)\sqrt{b_t}
    | T_i, \delta_i, y_i; \theta) \exp(||b_t||^2),$$

    ```


    where $\sum$ is used as shorthand for $\sum_{t_1=1}\cdots\sum_{t_q=K}$ with $K$
    denoting the number of quadrature points, and $b_i^T = (b_{t_1}, \dots, b_{t_q})$
    are the abscissas with corresponding weights $\pi_t$. The location of the abscissas
    and the weights are designed to provide an exact solution to the integral if the
    integrand can be expressed in'
