  md: "# Longitudinal Data Analysis\n\n21\n\n(2.3), i.e.:\n\n```\n$$\\text{var}(\\\
    hat{\\beta}) = \\left(\\sum_{i=1}^{n} X_i^top \\hat{Q}_i X_i\\right) \\left(\\\
    sum_{i=1}^{n} X_i^top \\hat{Q}_i \\text{var}(y_i) Q_i X_i\\right) \\left(\\sum_{i=1}^{n}\
    \ X_i^top \\hat{Q}_i X_i\\right)^{-1} (2.4)$\n```\n\n```\n$$\\left(\\sum_{i=1}^{n}\
    \ X_i^top \\hat{Q}_i X_i\\right)^{-1} (2.5)$\n```\n\nwhere $\\hat{Q}_i = \\hat{V}_i^{-1}$,\
    \ and $\\hat{V}_i$ denotes either the REML or ML estimate of the covariance matrix\
    \ $V_i$. The simplification from the first to the second line requires that the\
    \ model is correctly specified and $\\text{var}(y_i) = \\hat{V}_i$. If we would\
    \ like to protect inferences for $\\beta$ from a potential misspecification of\
    \ the covariance structure of the model, we can use instead the so-called sandwich\
    \ or robust estimator for $\\text{var}(\\hat{\beta})$ (White, 1982). This is obtained\
    \ by replacing in (2.4) the empirical estimator for the variance of $y_i$:\n\n\
    ```\n$$\\hat{var}(y_i) = (y_i - X\\hat{\\beta})(y_i - X\\hat{\\beta})^\\top$\n\
    ```\n\nStandard errors for the sandwich estimator will be consistent, as long\
    \ as the mean structure $X\\beta$ of the model is correctly specified, but they\
    \ will be less efficient than standard errors based on (2.5) when $V_i$ is correctly\
    \ specified. Standard errors for the estimates of the unique parameters in $V_i$\
    \ are obtained from the inverse of the correlation block of the Fisher information\
    \ matrix, i.e.,\n\n```\n$$\\hat{var}(\\hat{\\theta}_{b,\\sigma}) = \\left(E -\
    \ \\sum_{i=1}^{n} \\frac{\\partial^2 \\ell(\\theta)}{\\partial \\theta_{b,\\sigma}\\\
    partial \\theta_{b,\\sigma}} \\big|_{\\theta=\\hat{\\theta}}\\right)^{-1}$\n```\n\
    \n# 2.2.2 Implementation in R\n\nR has extensive capabilities for mixed modeling,\
    \ with several available packages that can fit different types of mixed-effects\
    \ models. For linear mixed-effects in practice, the two main packages are **nlme**\
    \ (Pinheiro et al., 2012; Pinheiro and Bates, 2000) and **lme4** (Bates et al.,\
    \ 2011). The former can be used only for continuous data, but also fit models\
    \ with more complex error structures (i.e., correlated and/or heteroscedastic\
    \ error terms), whereas the latter fits models for both continuous and categorical\
    \ responses, but it only accounts for the correlation in the repeated measurements\
    \ of the subjects using the random effects. In this book we will fit linear mixed-effects\
    \ models using function `lme()` from package **nlme** because package **JM** that\
    \ will be used later to fit join models is based on the output of this function.\n\
    \n¹¹For more information on mixed models for categorical responses, the reader\
    \ is referred to Section 5.7.1."
