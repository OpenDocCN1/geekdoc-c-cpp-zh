  md: '# Statistics


    In longitudinal studies it is often of interest to investigate how a marker is
    repeatedly measured in time is associated with a time to an event of interest,
    e.g., prostate cancer studies where longitudinal PSA level measurements are collected
    in conjunction with the time-to-recurrence Joint Models for Longitudinal and Time-to-Event
    Data: With Applications in R provides a full treatment of random effects models
    for longitudinal and time-to-event outcomes that can be utilized to analyze such
    data. The content is primarily explanatory, focusing on applications of joint
    modeling, but sufficient mathematical details are provided to facilitate understanding
    of the key features of these models.


    # Features


    +   * Provides a complete treatment of joint models for longitudinal and time-to-event
    data

    * Introduces various extensions of the standard joint model, including several
    parameterizations for the association structure and the handling of competing
    risks

    * Covers various diagnostic tools based on residuals to assess the assumptions
    behind a joint model

    * Discusses dynamic predictions for the survival and longitudinal outcomes, and
    discrimination concepts for longitudinal markers

    * Emphasizes applications so readers understand the type of research questions
    best answered with joint models


    All illustrations forward can be implemented in the R programming language via
    the freely available package JM written by the author.


    # About the Author


    Dimitris Rizopoulos is an Assistant Professor at the Department of Biostatistics
    of the Erasmus University Medical Center in the Netherlands. Dr. Rizopoulos received
    his M.Sc. in Statistics in 2003 from the Athens University of Economics and Business,
    and a Ph.D. in Biostatistics in 2008 from the Katholieke Universiteit Leuven.


    Dr. Rizopoulos wrote his dissertation, as well as a number of methodological articles
    on various aspects of joint models for longitudinal and time-to-event data. He
    currently serves as an Associate Editor for Biometrics and Biostatistics, and
    has been a guest editor for a special issue in joint modeling techniques in Statistical
    Methods in Medical Research.


