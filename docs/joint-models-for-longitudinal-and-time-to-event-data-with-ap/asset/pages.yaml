    \nu > 0\$


    which formalizes the idea that there is a higher chance for a patient to experience
    the event if she shows an absolute increase in her marker levels of $\nu$ units,
    or a relative increase prediction rule, as as,


    $$\mathcal{P}_a^\alpha(t, k, c) = \{y_i(t-1) \geq c\} \cap \{y_i(t) \geq (1 +
    \nu)c\}, \nu > 0\$


    which analogously states that there is a higher chance for a patient to experience
    the event if if she shows an increase in her marker levels of a magnitude of $(100
    \times \nu)\%.'
