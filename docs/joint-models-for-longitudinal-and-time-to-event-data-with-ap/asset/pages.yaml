    how well a longitudinal marker can discriminate between patients with low and
    high risk of having the event.


    # 7.4.1 Discrimination Measures for Binary Outcomes


    To introduce the basic concepts behind discrimination measures, we will first
    consider the simple binary response setting. In particular, $d_i$ denote the status
    indicator for subject $i$, that takes values 1 or 0 depending on whether or not
    the subject experienced the event of interest. Let also $y_i$ denote a scalar
    marker measured at baseline that is believed to be strongly associated with the
    probability of disease. Our aim is to utilize the subjects who have greater chance
    of being ''diseased''. To achieve this we construct an appropriate prediction
    rule that classifies subjects $i$ as diseased when their observed marker exceeds
    a specific threshold, i.e., $y_i > c$. Based on this, we can now quantify the
    performance of the marker using the probabilities of correct classification on
    the disease status. In particular, the probability that the marker correctly classifies
    a subject as diseased is called sensitivity (also known as the true positive rate):


    > $TP(c) = Pr(y_i > c \mid d_i = 1),$


    whereas the probability that the marker correctly classifies a subject as non-diseased
    is called:


    > $1 - FP(c) = Pr(y_i \leq c \mid d_i = 0),$


    where $FP(c) = Pr(y_i > c \mid d_i = 0)$ denotes the false positive rate. Note
    that these probabilities measure the predictive accuracy of all possible prediction
    rules $\{y_i > c, c \in \mathbb{R}\}$. To describe the overall discrimination
    capability of the marker we compute the sensitivity and specificity for all possible
    prediction rules $\{y_i > c, c \in \mathbb{R}\}$, where $\mathbb{R}_y \subseteq
    \mathbb{R}$ denotes the sample space of the marker, and $\mathbb{R}$ is the set
    of real numbers. This gives rise to the ROC curve, which is the plot of the true
    positive rate (sensitivity) against the false positive rate ($1 - specificity$)
    for varying $c$, and is formally defined as


    where $p$ is in $[0, 1]$, and $FP^{-1}(p) = \inf\{c : FP(c) \leq p\}$. A generic
    example of an ROC curve is presented in Figure 7.9. The left panel displays boxplots
    of the marker in the diseased and nondiseased groups, and the right corresponding
    ROC curve. The dashed line in the left panel corresponds to the rule $y_i > 35$,
    and the dashed lines in the right panel annotate the performance of this rule
    in terms of sensitivity and $1 - specificity$. The higher the ROC is in the unit
    quadrant, the more accurate the predictions rules are.


