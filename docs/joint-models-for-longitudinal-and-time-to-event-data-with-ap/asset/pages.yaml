    **TABLE 2.1:** Examples of missing data patterns in a hypothetical longitudinal
    study with five planned measurements; ''x'' denotes an observed measurement and
    ''?'' a missing longitudinal response


    | | Visits | | | | |

    |---|---|---|---|---||

    | | 1 | 2 | 3 | 4 | 5 |

    | 1 | x | x | x | x | x |

    | 2 | x | x | ? | x | ? |

    | 3 | ? | x | x | x | x |

    | 4 | ? | x | ? | x | ? |


    the case that some subjects miss some of their planned measurements for a variety
    of reasons. Depending on the features of the missing data patterns we can distinguish
    two types of missingness, namely monotone and non-monotone missingness. Monotone
    patterns of missingness cover the case of *attrition* or *dropout* when a subject
    is withdrawn from the study before its intended completion, and *late entry* when
    a subject does not provide some of her initial response measurements, but appears
    later and stays in the study until completion. On the other hand, non-monotone
    missingness, also known as *intermittent missingness*, is a more general type
    that covers cases in which, for example, the response of a subject is missing
    at one follow-up time, she comes back at the next one, but then can be missing
    again at later time points. An illustrative example of the different missing data
    patterns is given in Table 2.1, where Subject 1 is a completer, Subject 2 dropped
    out at visit four, Subject 3 did not provide the first measurement, and Subject
    4 was only present at visits two and four.


    The potential for missing data poses several challenges in the design of longitudinal
    studies and the analysis of data from these studies. The first and most obvious
    implication is the loss of efficiency, in the sense that the average longitudinal
    evolutions are less precisely estimated than they would have been when all data
    were available. This important consequence requires more individuals to achieve
    the same levels of power in detecting important effects. The reduction in precision
    is directly related to the amount of missing data and also influenced by the chosen
    method of analysis. In addition, missingness results in unbalanced datasets over
    time because not all subjects have the same number of measurements at a common
    set of occasions. This creates complications for methods of analysis that require
    balanced data, but it does not pose any concern for the linear mixed-effect model
    introduced earlier. Finally, under certain circumstances and if improperly handled,
    missing data can introduce bias and thereby lead to misleading inferences. It
    is this last factor that poses the greatest concern in the analysis of incomplete
    longitudinal'
