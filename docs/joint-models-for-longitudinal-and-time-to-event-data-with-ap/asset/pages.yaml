  md: "# Prediction and Accuracy in Joint Models\n\nin the expected value of longitudinal\
    \ outcome at $u > t$ given observed responses up to time point $\\mathcal{Y}_i(t)\
    \ = \\{y_i(s), 0 \\le s < t\\}$, that is,\n\n```\n$\\omega_i(u | t) = E\\{y_i(u)\
    \ | T_i^* > t, \\mathcal{Y}_i(t), \\mathcal{D}_n; \\theta^i\\}, \\quad u > t.\
    \ \\quad (7.7)$\n```\n\nSimilar to the conditional survival probabilities (7.1),\
    \ these predictions are dynamically updated in time as extra information is recorded\
    \ for that subject. That is, the prediction $\\omega_i(u | t)$ for $y_i(u)$ that\
    \ is based on the information that we have available up to time $t$, can be updated\
    \ at $t'$ with $t < t'$, to produce the new prediction $\\omega_i(u | t')$ that\
    \ uses the additional information up to the latter point.\n\nFor the estimation\
    \ of $\\omega_i(u | t)$ we can utilize an analogous procedure to the one followed\
    \ for the estimation of $\\pi_i(u | t)$ in Section 7.1.2. More specifically, in\
    \ order to account for the fact that we do not know the true parameter values\
    \ $\theta^*$, we proceed again under an asymptotic Bayesian formulation of the\
    \ joint model, and calculate the expectation of $\\omega_i(u | t)$ with respect\
    \ to the posterior distribution of the parameters $\\{\theta | \\mathcal{D}_n\\\
    }$\n\n```\n$E\\{y_i(u) | T_i^* > t, \\mathcal{Y}_i(t), \\mathcal{D}_n\\}$\n```\n\
    \n```\n$= E\\{y_i(u) | T_i^* > t, \\mathcal{Y}_i(t); \\ p(\\theta | \\mathcal{D}_n)\\\
    }. \\quad (7.8)$\n```\n\nThe first part of the integrand can be simplified by\
    \ exploiting the conditional independence assumptions (4.7) and (4.8) as follows:\n\
    \n```\n$E\\{y_i(u) | T_i^* > t, \\mathcal{Y}_i(t)\\}$\\n = E\\{y_i(u) | T_i^*\
    \ > t, \\mathcal{Y}_i(t); \\ p(b_i | T_i^* > t) \\ db_i\\n = E\\{x_i^t(u)\\beta\
    \ + z_i^t(u)b_i | p(b_i | T_i^* > t, \\mathcal{Y}_i(t)) \\ db_i\\n = x_i^t(u)\\\
    beta + z_i^t(u)b_i^{(t)}, \\quad (7.9)$\n```\n\nwhere\n\n```\n$\\hat{b}_i^{(t)}\
    \ = \\int p(b_i | T_i^* > t, \\mathcal{Y}_i(t)); \\ db_i.$\n```\n\nUnder these\
    \ derivations a straightforward estimator of $\\omega_i(u | t)$ is obtained by\
    \ simply replacing $\theta$ with $\\hat{\theta}$, and calculating the mean of\
    \ the posterior distribution $p(b_i | T_i^* > t, \\mathcal{Y}_i(t))$. In the same\
    \ spirit, a estimator is derived instead of the mean $\\hat{b}_i^{(t)}$ of the\
    \ posterior distribution we use its mode $\tilde{b}_i^{(t)} = \\arg \\max_{b}\
    \ \\log p(b | T_i^* > t, \\mathcal{Y}_i(t));$ i.e.,\n\n```\n$\\hat{\\omega}_i(u\
    \ | t) = x_i^t(u)\\beta + z_i^t(u)\\hat{b}_i^{(t)} + O(n_i^{-1}). \\quad (7.10)$\n\
    ```"
