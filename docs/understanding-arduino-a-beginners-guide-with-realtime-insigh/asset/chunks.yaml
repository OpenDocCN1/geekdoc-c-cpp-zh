    # 第二章：工程专业学生使用的不同 Arduino 开发板


    ![不同 Arduino 开发板...](img/Image00003.jpg)


    ## Arduino 开发板（类型）

    Arduino 开发板已成为设计不同项目的快速途径，在各个工程领域中发挥了影响力。它们有时被用作某些嵌入式工程师项目的收尾工具。这些设计取决于所使用的 Arduino
    类型和型号，其范围可以从复杂的复合科学仪器到简单的家用仪器不等。


    Arduino 用于各种不同应用的能力得到了增强，所有的开发板都基于开源。市场上的 Arduino 开发板有不同的类型和型号，既有共同特征，也有独特的功能，这些通常取决于它们所处的特定项目。常用的
    Arduino 开发板类型包括：


    ### Arduino Leonardo 开发板

    在 Arduino 的最早开发产品中，Leonardo 板是其中之一。在这块板上使用程序库更加容易，因为可以通过 `USB` 直接连接。`USB` 内置在微控制器中，使其成为所有开发板中最廉价且易于使用的之一。由于这一特性，Leonardo
    板可以轻松地连接到电脑键盘、鼠标、智能设备等。该板完全依赖于时钟速度为 `16 MHz` 的 `ATmega32u4` 微控制器。此板配备了 2.5 Kb
    SRAM 内存，同时位于 32 Kb 的闪存内存上。


    ### Arduino Uno (R3)

    在寻找最流行的开发板时，人们会想到 Arduino Uno，据报道它被不同职业的人使用。这块板有 14 个数字输入/输出 (`I/O`) 引脚，其中 6 个引脚作为“脉冲宽度调制”
    (`PWM`) 输出。在该板上找到的其他特征包括 `USB` 端口、重置按钮、电源接口和 6 个模拟输入引脚。通过维持微控制器，所有功能都可以实现。可以使用
    `USB` 线将此板连接到你的电脑。该板带有 `ATmega328` 处理器，时钟速度为 `16 MHz`。SRAM 内存为 2 KB，闪存为 32 KB。


    ### RedBoard Arduino 开发板

    RedBoard Arduino 开发板利用 `Arduino IDE`。随后可以使用 Mini-B `USB` 线进行编程。它可以轻松地配合 Windows
    8，而无需修改你的任何安全设置。RedBoard Arduino 开发板可以被轻松控制。在成功创建后，它是最易用的板之一。用电脑或其他仿真器打开板电源后，只需按照菜单进行选择即可。


    ### LilyPad Arduino 开发板

    这块板是可穿戴的，用于电子纺织品技术。其设计专门针对纺织品，而且开发板是可以清洗的。可以用线线将其缝在衣服上。此板上的所有东西如传感器电路、电源和 `I/O`
    都是专门为此目的而设计的。此板还包含一个 `Arduino` 引导程序，带有 `2V` 到 `5V` 的可变电源，位于 `ATMEGA328` 微控制器上。


    ### Arduino Mega (R3)

    Arduino Mega 运行在 `ATmega2560` 处理器上，其数字 `I/O` 引脚有 54 个。在这些引脚中，4 个引脚用于 `UART` 硬件的串口，16
    个引脚用于模拟输入，14 个引脚作为 `PWM` 输出。这些板上的其他组件还包括电源接口、`USB` 连接、ICSP 插针、`RESET` 引脚和 `16
    MHz` 晶振振荡器。


    ### Arduino Shields（扩展板）

    为了连接到其他类型的 Arduino 开发板，使用了 Arduino Shields。它们是预构建的电路板。这些 Arduino 扩展板取决于使用类型。某些包括
    `Proto Shield`、`Ethernet Shield`、`Wireless Shield` 和 `GSM Shield`。`Arduino Shield`
    和 Arduino 开发板的连接方式是：Arduino 开发板放置在 `Arduino Shield` 下方。这为便于集成留出了空间，因为板最终会连接以控制
    `LCD` 和显示器。


    ### Arduino Micro 开发板

    顾如名，这是一种设计非常小的特殊 Arduino 开发板。微控制器运行在名为 `ATmega32U4` 的处理器上。此板总共有 20 个引脚，其中 12 个用于模拟
    `I/O`，7 个用于 `PWM`。此板在 Arduino Micro 板上自带了微-USB 连接。板上的其他特征还包括：ICSP 插针、`16 MHz`
    晶振振荡器。Arduino micro 通常被称为 Leonardo 的缩减版，因为它很小且外观与 Arduino Leonardo 板相似。


    ### Arduino Due 开发板

    Arduino 系列中第一块设计并开发用于 ARM 微控制器的板是 Arduino Due 板。ARM 内核是 32 位，有 54 个数字 `I/O` 引脚，其中
    12 个是模拟引脚。它带有两个不同类型的端口（编程端口和 `USB` 端口）；编程端口作为 `USB` 线微端的接口使用。


    ### Arduino 蓝牙开发板

    这一个之所以被称为蓝牙板，因为它通过蓝牙无线连接进行编程。Arduino BT 板基于 `ATmega168` 微控制器型号。此板的显著特征是螺钉端子、`16
    MHz` 晶振振荡器、重置按钮、6 个模拟引脚和 16 个数字引脚。


    ### Arduino Esplora 开发板

    如果你计划拥有易连接的执行器和传感器，那么 Arduino Esplora 板是为你专门设计的。此板与其他类型的 Arduino 开发板不同，因为它嵌入了麦克风、加速度计、温度传感器、滑块、摇杆和按钮。Arduino
    Esplora 板还带有输入输出连接。


    ## 哪些 Arduino 开发板在家里很有用？

    几种类型的 Arduino 开发板在各种家庭任务中都非常有用。然而，Arduino 处理的任务将决定哪种板最合适，但通常使用的板包括 `Arduino Uno`、`Arduino
    Mega`、`Arduino Pro` 和 `Arduino Mini`。任务范围从定时、自动门锁到开关灯甚至操作智能手机。第三章


    ![USB 通信...](img/Image0004.jpg)


    ## 如何将你的 Arduino 连接到电脑

    在你必须选择适用于特定功能的 Arduino 开发板类型后，接下来是通过电脑将一组指令或代码加载到开发板。Arduino 如何管理给定任务取决于加载到它的指令。然而，加载到
    Arduino 板的任何指令将被执行。你的 Arduino 必须连接到电脑以启用加载。要在 Windows 上建立必要的连接，需要以下物品：


    *   Arduino 开发板

    *   Arduino 软件

    *   `USB` 线（A 和 B）


    1. 首先下载与电脑兼容的软件。

    2. 完成后，解压到 `D:/Arduino`。

    3. 然后，通过将 `USB` 线的一端连接到电脑，另一端连接到 Arduino 板，电脑与板之间的连接就准备好了。

    4. 当 Windows 提示驱动程序时，可以手动安装（位于 `D:/Arduino/Arduino-0022/drivers`）。

    5. 随后可以在此处找到 Arduino 环境：`D:/Arduino/arduino-0022/arduino.exe`。


