  trans: "\n\n由于 Arduino Mega Server 设置简单，许多用户可以为它连接容量高达 32GB 的 SD 卡。因此，不同的网络内容和文件可以从\
    \ Web 服务器安全地保存到此张 SD 卡上。Arduino Mega Server 还允许与 MajorDoMo 集成。MajorDoMo 平台就像一个自动化家居系统。通过使用\
    \ Arduino 实现这一点，你获得了发送数据、分析数据以及发送任何所需状态的机会。同时还可以实现跨网络的命令控制和数据存储。Arduino Mega Server\
    \ 一直被认为用作“串联模式”。这意味着 MajorDoMo 服务器上的信息可以在 Arduino Mega Server 中完美运行。虽然 MajorDoMo\
    \ 并非为串联模式而设计，但它也可以独立工作。\n\nArduino Mega Server 是构建在 8 位处理器能力的基础上。这是它本质上具有多功能以及许多其他独特特性的主要原因。此外，使用你的\
    \ Arduino mega server 时可以托管多个网站。在不关闭控制器或拔出内存的情况下，你也可以更新内容。使用 Arduino Mega Server，可以对许多网页进行修改以调整你的电脑屏幕。这让你在以浏览互联网为目的时，能够获得兴奋的体验。\n\
    \n# 第五章：Arduino 的最佳编程语言\n\n## Arduino 使用的编程语言\nArduino 使用一种编程语言，大多数时候被称为 Arduino\
    \ 编程语言或简单称为 Arduino 语言。Arduino 为用户提供了若干集成库选择和一个编程编辑器。因此，将这些程序编译并加载到板器中变得非常简单。\n\
    \n根据用户的描述，Arduino 认为是用简化的 C/C++ 编程语言编写的，他们通常将其作为可下载的在线工具使用。由于这些程序的简单性，它们通常被称为“sketch”（草图）。任何用\
    \ Arduino 语言编写的文件或文本也称为 sketches。应使用 `.ino` 作为文件扩展名，以便你将 sketches 保存并加载到你的 Arduino\
    \ 板板上。\n\n以下是 Arduino 编程语言的核心特性：\n\n-   **函数 (Functions)**：这些函数让你对你的 Arduino 板板有完全的控制。常见的编程技巧，如分析字符或执行任何数学运算，都是通过这些函数实现的。`setup`\
    \ 函数或 `loop` 函数是 Arduino 编程语言 sketch。每当你的 Arduino 上电或重置时，都会执行 `setup`。然后使用 `loop`\
    \ 函数来关闭电源和复位按钮。Arduino 语言中不存在主函数。在处理它时其他有用的函数包括：\n    - **数字输入和输出 (I/O)**：有 `digitalRead`，其参数是引脚号；`digitalWrite`\
    \ 提供高或低电数字输出引脚值；`pinMode` 将其输入和输出设置为引脚；`pulseIn` 从数字信号中从低到高再从高到低再次读取脉冲，`shiftIn`\
    \ 逐位读取字节，`shiftOut` 逐位写入字节等。\n    - **模拟输入和输出 (I/O)**：它们包括 `analogRead`，它使用模拟引脚读取数值，`analogReference`\
    \ 使用模拟输入来配置输入的数值范围，`analogWrite` 将模拟值写入引脚等。\n    - **时间函数 (Time Function)**：这些包括\
    \ `delay`，它可以暂停或延迟一个指定为参数的几毫秒的程序；`delayMicroseconds`，这可以暂停一个指定为参数的几微秒的程序等。\n \
    \   - **数学函数 (Math Function)**：这些包括 `abs`，它指定数字的绝对值，`constrain` 将数字限制在指定的范围内，`cos`\
    \ 表示角的余弦，`sq` 表示数字的平方，`pow` 表示数字的特定特定次方的值等。\n    - **常量和变量 (Constant and Variables)**：这些是\
    \ Arduino 值，与 C++ 编程中使用的非常相似。它们主要用于类型转换。它们允许在 Arduino 生态系统中进行方便的数据传输。\n    - **结构\
    \ (Structure)**：这是 Arduino 编程语言的最后部分。在这里，可以找到像操作符之类的微小代码元素。这使得 Arduino 在最终执行任何编写的代码时具有巨大优势。\n\
    \n你还可以使用 Arduino 编程语言导入外部库。这些库包含了已经写好的代码。这让你工作变得轻松；否则，你可以编写自己的代码，或直接从网上下载你需要的代码。有时可以使用\
    \ C 库。这对于 Arduino 语言来说非常独特。Arduino IDE 中提供的库管理器允许你安装此类语言库。\n\n一些可以在线下载的 Arduino\
    \ 语言有：\n-   **ArduBlock**：许多初学者发现这种编程语言特别有用。与其输入代码，ArduBlock 允许你构建自己的代码。它允许你为代码选择函数。它对于视觉化学习者来说特别好。\n\
    -   **Snap4Arduino**：和 ArduBlock 一样，这种编程语言也支持视觉化。它主要以拖放的方式使用。虽然它与 ArduBlock 非常相似，但它是专门为缺乏\
    \ Arduino 编程语言基础知识的用户设计的。要安装这种语言，你需要 `StandardFirmata`，它是预安装在你的 Arduino 中的。\n\
    -   **C#**：这使得 Arduino 与电脑之间的信息共享变得简单。这种编程语言的使用允许你用另一种语言编码，该语言与 Arduino 作为 sketch\
    \ 使用的语言完全不同。`CmdMesseger` 在这方面特别有帮助。这个消息器可以在 Microsoft Visual Studio 或任何你可以获得的其他第三方替代品上良好运行。C#\
    \ 语言然后在你的电脑和 Arduino 之间创建一个平滑的通信链接。\n-   **Python**：虽然基于 Python 语言的代码不能用于 Arduino。但是，通过使用设备上的串口输入可以使用这种语言。这你可以通过下载\
    \ `pySerial` 实现。由于其直观性，它经常作为其他高级编程语言的基础。\n\nArduino 软件（IDE）是增强的通用编程语言。该 IDE 是构建在\
    \ wiring 和 processing IDE 之上的。该软件的在线版本更受用户青睐，被称为 Arduino Web 编辑器。这成为使用 Arduino\
    \ 编码时的一个极佳选择。这让你能够通过互联网随时随地将数据直接存储在云端。Arduino 软件的在线版本更受欢迎，因为它不需要像离线版本那样任何更新。然而，离线版本仍然供其他用户下载并使用。使用\
    \ IDE 进行 Arduino 编程语言提供了更好的通信，因为 IDE 兼容多种操作系统。\n\n"
- fmt: '

    - Open Arduino website (https://www.arduino.cc/en/Main/Software) on your web browser.

    - Click on the link to download and go to the download page.

    - Select the "I Agree" button on the License agreement for the Arduino.

    - Click on the `Windows` link on the download page, this will download the Arduino
    software for Windows.

    - Locate the just downloaded file on your computer, then, extract the zipped file.

    - Copy this to a favourite location on your computer.

    - Then, connect the computer with the Arduino by attaching your Arduino board
    to the computer.

    - Commence Windows device Manager by clicking on the Windows Start menu button.

    - Right-click the menu of "Computer" and select "properties" from the lists of
    the drop-down menus.

    - Click on the link of "Device Manager".

    - After this, the Device Manager will show "Arduino".

    - Update the driver software by right-clicking on the "Arduino".

    - A dialogue box will show, choose "Browse my computer for driver software" from
    the drop-down options.


    After this, select the "Browse" button. The downloaded Arduino folder now has
    a `Driver` folder, Choose this Drivers folder. After this has been chosen, you
    can now click "Next". A dialogue box will come up, choose "Install this driver
    software anyway". After a few minutes, the installation of the driver will be
    completed. You will notice that another dialogue box will come up, just note the
    port that has been used to configure the Arduino. After this, you can set-up your
    Arduino software. To do this:


    - Go to the folder that has just been downloaded.

    - The Arduino software can now be opened by double-clicking on it.

    - Be sure that you have chosen the right Arduino board and if not, change from
    the option as necessary.

    - Be sure also that the serial port that has been chosen is the right one, if
    not, change as necessary.


    After you must have followed all these procedures, what is left is to test the
    installation whether it is working or not. You can see if the installation is
    good by loading the sketch into the Arduino. To do this, select the "Blink" sketch
    and choose the button for Arduino Upload (The LED that is on the board of the
    Arduino will flash to indicate loaded sketch). You may want to run the sketch
    to ascertain that the Arduino software and driver has been successfully installed.


    ### Which Arduino IDE version to Choose


    The Arduino software undergoes periodic updates to improve productivity and to
    sometime fix some observed bugs, hence, there have been frequent modifications
    to the version of Arduino IDE that have been released. These modifications are
    necessary to meet continuous users'' needs.


    The Arduino IDE version `1.0.5` is the first-ever released Arduino IDE, and the
    oldest used in the first generation of Arduino programming. This particular version
    `1.0.5` and other subsequently released versions such as versions `1.8.11`, `1.8.10`,
    `1.8.9`, `1.8.8`, `1.0.5`, `1.0.4`, `1.0.3`, `1.0.4`, `0023`, `0022`, `0021` `0020`
    etc are now obsolete.


    The currently active released versions are version `1.8.12` and version `1.8.13`.
    The version `1.8.13` is the most recent version of the Arduino IDE. The version
    `1.8.13` has many improved updates; hence, the best version that has been released
    so far. Recent updates for this version were released with support mainly for
    Windows operating systems (e.g. `2000`, `XP`, `7` and `Vista`). It was developed
    by Genericom and equipped with 90.20 MB total file capacity. Other notable features
    of this Arduino IDE include the ability to share information with any other user
    working on an Arduino based project, ability to alter schematics and internal
    layout when necessary.


    ### Arduino IDE Online


    Using the Arduino IDE online or the Arduino web editor is another way of doing
    programming on the Arduino. Using this, you can access tutorials, configure boards
    and most importantly write codes directly on the web as one of the features of
    Arduino create. This is especially brilliant feature enjoyed by users with constant
    and good internet access.


    This comes with the benefit of having on the go access to the Arduino facilities
    without necessarily need to download the Arduino software. Thus, storing your
    sketches on the cloud and having easy access to them at your convenient time and
    location. To use these online facilities on the Arduino IDE, one needs:


    - Install the Arduino create plugin from `https://create.arduino.cc/getting-started`
    to allow connection to your board.

    - Log in to your Arduino account by clicking on the Arduino Web editor (You equally
    create a new account if you do not have an account before).

    '
