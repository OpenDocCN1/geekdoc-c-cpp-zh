  trans: '

    * 使用来自门户网站的 Javascript 来控制硬件

    * 使用简单的 HTML 读取开关状态

    * 使用 HTML 读取传感器值


    ### 要求

    如果你计划使用你的 Arduino 访问互联网，将需要以下物品：


    * 一个 Arduino Mega 服务器（例如 Arduino Mega2560 或 Arduino UNO）

    * 速度为 10/100MB 的有线网络连接

    * 一个以太网扩展板 (Ethernet Shield)


    以太网扩展板的功能是通过 Arduino 作为连接源连接到互联网。扩展板可以通过引脚连接到你的 Arduino。然后将网太线连接到扩展板上。执行此操作时需要的其他硬件包括：


    * 网太线

    * 按钮

    * 9V 适配器

    * Wi-Fi 路由器

    * 跳线线

    * 10K 电阻

    * 面包板


    ### 功能

    为了实现各种优化功能，这些工具被用于诸如从网络接收和发送特定命令、搜索任何可用网络、实时时钟、智能家居系统集成、电压和电流控制，以及传感器的维护和温度测量。


    此外，你还可以根据需要添加个人模块。这是因为 Arduino Mega 服务器可以独特地编译模块、检测已编译模块，并将它们与尚未编译的模块分开。它还提供了灵活性，可以直接从互联网禁用或启用任何已编译的模块。


    在与 Arduino Mega 服务器集成的少数功能中，有一个可以监控 Arduino 输入和输出电压的电气模块。该电气模块同样可以监控电流。它组装在开关板上，可以方便地调节耗电量。追踪人员是该模块可以执行的另一个独特功能。


    作为网络示波器是另一个附加功能，该示波器以动态信号或示波图的形式显示网页内的实时网络流量。此外，还有一个屏幕保护程序模块专门显示面板上的信息。这让你能够选择与你相关的信息，同时过滤掉任何其他信息。通过实现高效的频率计，可以使用
    Arduino Mega 服务器 防止系统故障。此还有一个用于 3D 系统状态的 216 块指示器，它让你拥有了俯瞰整个系统结构的权限。


    ### 设置步骤

    要将你的 Arduino 作为 Web 服务器，你必须执行以下操作：


    * 为 Arduino 使用以太网配置

    * 规定 IP 地址

    * 提供你正在使用的 MAC 地址

    * 将你的 Arduino 连接到可用的互联网服务（你可以使用 Wi-Fi 路由器为此操作）

    * 提供运行 Arduino 作为 Web 服务器所需的代码

    * 使用路由器将你的电脑连接到 Arduino

    '
- fmt: "\nDue to the ease of setting up the Arduino Mega Server, many of its users\
    \ can connect up to 32Gb SD card to it. Thus, different web content and file can\
    \ be safely saved on this SD card from the web server. The Arduino Mega Server\
    \ also allows integration with MajorDoMo. The MajorDoMo platform behaves like\
    \ an automated home system. By doing it with the Arduino, it avails you the opportunity\
    \ to send data, analyse it and also any required status can be sent. Command control\
    \ from over the network and store data can also be obtained. The Arduino Mega\
    \ Server has always been termed to be used as a \"tandem mode\". This implies\
    \ that the information on the MajorDoMo server can work perfectly in the Arduino\
    \ Mega Server. The MajorDoMo is not purposed for the tandem mode, it can, however,\
    \ work independently.\n\nThe Arduino Mega Server is built on 8-bit processor capacity.\
    \ This is a major reason why it is multifunctional in nature and many other unique\
    \ features. Also, hosting multiple sites is possible when using your Arduino mega\
    \ server. Without turning off your controller or pulling out the memory card,\
    \ you can also update contents. Using the Arduino Mega Server, modification of\
    \ many web pages can be achieved to adjust the screen of your computer. This allows\
    \ you to get exciting experience when information is your purpose of browsing\
    \ the internet.\n\n# CHAPTER FIVE: The Best Programming Languages for Arduino\n\
    \n## Programming Languages that Arduino Use\nArduino uses a programming language\
    \ which is most of the time referred to as the Arduino programming language or\
    \ simply the Arduino language. The Arduino avail its users with several choices\
    \ of integrated libraries and a programming editor. Thus, compiling and loading\
    \ of these programs into the board becomes very easy.\n\nThe Arduino is supposedly\
    \ written in simplified C/C++ programming language as described by its users who\
    \ usually use it as a downloadable online tool. They are often referred to as\
    \ sketches due to the simplicity of these programs. Any files or texts that have\
    \ been written in the Arduino language are also called sketches. The extension\
    \ `.ino` should be used as a file extension to allow you save and load sketches\
    \ to your Arduino board.\n\nThe following are the core feature of Arduino programming\
    \ language:\n\n- **Functions**: These gives you total control of your Arduino\
    \ board. Common programming tricks such as analysing characters or executing any\
    \ mathematical operation are performed using these functions. The function `setup`\
    \ or `loop` function is sketch of the Arduino programming language. Every time\
    \ your Arduino is powered up or reset, the `setup` is used for execution. The\
    \ function `loop` is then used to power off and rest the button. The main function\
    \ does not exist in the Arduino language. Other functions useful when handling\
    \ it include:\n    - **Digital Input and Output (I/O)**: There are `digitalRead`\
    \ which its parameter is a pin number, `digitalWrite` which gives a digital output\
    \ pin value that may be high or low, `pinMode` which its input and output are\
    \ set as a pin, `pulseIn` reads pulse from a digital signal from low to high and\
    \ back from high to low again, `shiftIn` reads byte bit by bit, `shiftOut` writes\
    \ byte bit by bit among others.\n    - **Analog Input and Output (I/O)**: They\
    \ include `analogRead` which uses an analog pin to read values, `analogReference`\
    \ which uses the analog input to configure value range for inputs, `analogWrite`\
    \ writes an analog value to a pin etc.\n    - **Time Function**: These include\
    \ `delay` which can pause or delay a program that has been specified as a parameter\
    \ for few milliseconds, `delayMicroseconds` this can pause a program that has\
    \ been specified as a parameter for a few microseconds etc.\n    - **Math Function**:\
    \ These include `abs` which specify the absolute value of a number, `constrain`\
    \ this to limit a number to be within a specified range, `cos` which indicates\
    \ an angle's cosine, `sq` indicates a number's square, `pow` which means the value\
    \ of a number which has been raised to a specific power etc.\n    - **Constant\
    \ and Variables**: These are Arduino values, very similar to those used in C++\
    \ programming. These are mostly used in the conversion of type. They enable easy\
    \ data transfer within the Arduino ecosystem.\n    - **Structure**: This is the\
    \ last part of the Arduino programming language. Here, small code elements like\
    \ operators and others could be found. This gives the Arduino a major edge in\
    \ the ultimate execution of any written code.\n\nYou can also import external\
    \ libraries using the Arduino programming language. These libraries contain already\
    \ written codes. This avails you the ease of working; else, you may write your\
    \ own code or download your required code directly from the internet. The C libraries\
    \ may be used some times. This is very unique to the Arduino language. The Library\
    \ Manager available on the Arduino ID allows you to install such libraries of\
    \ languages.\n\nSome of the online downloadable Arduino languages are:\n- **ArduBlock**:\
    \ Many of the beginners find this programming language particularly useful. Instead\
    \ of typing a code, the ArduBlock allows you to construct your own code. It enables\
    \ you to select functions to your codes. It is especially good for visual learners.\n\
    - **Snap4Arduino**: just like the ArduBlock, this programming language also supports\
    \ visual. It is mostly used in a drag and drop way. Although it is very similar\
    \ to the ArduBlock, it is specifically designed for users who lack basic knowledge\
    \ of the Arduino programming language. To install this language, you will need\
    \ `StandardFirmata` which comes installed on your Arduino.\n- **C#**: This makes\
    \ information sharing with your computer on the Arduino a lot easier. The usage\
    \ of this programming language, allows you to code in another language that is\
    \ entirely different from the one used as a sketch by your Arduino. The `CmdMesseger`\
    \ will particularly be of help doing this. This messenger can run well on Microsoft\
    \ Visual Studio or any other third-party alternative you can lay hands on. The\
    \ C# language then creates a smooth communication link between your computer and\
    \ Arduino.\n- **Python**: Although, codes built upon the python programming language\
    \ cannot be used in the Arduino. However, communicate in this language is made\
    \ possible by using the serial input on your device. This you can do by downloading\
    \ the `pySerial`. This often serves as the basis of some other advanced programming\
    \ languages due to its intuitive in nature.\n\nThe Arduino software (the IDE)\
    \ enhanced general programming language of Arduino. This IDE is built upon both\
    \ the wiring and processing IDEs found in the Arduino environment. The online\
    \ version of this software, however, has a preference for most users, which is\
    \ called the Arduino Web editor. This becomes a great choice, especially when\
    \ coding using the Arduino. This gives you room to have your data directly stored\
    \ into clouds which avail you easy access to it any time and anywhere via the\
    \ internet. The online version of the Arduino software is more referred because\
    \ it does not require any further update, unlike the offline version. However,\
    \ the offline version can always be downloaded and used by other users who prefer\
    \ it. Working with the Arduino programming language using the IDE provides better\
    \ communication since the IDE is compatible with many operating systems such as\
    \ Windows, Linux and MacOS.\n\n# CHAPTER SIX: The Arduino Integrated Development\
    \ Environment\n\n## The Arduino IDE\nThe Arduino IDE is a form of code or program\
    \ editor that is compatible with various platforms such as Linux, Windows or MacOS.\
    \ It is a simplified form of C/C++ programming language of C/C++. This IDE act\
    \ as a medium in which codes or programs are written and uploaded to the Arduino\
    \ boards. The software comes with various other tools such as toolbar with buttons,\
    \ code writing text editor etc. The software is also part of an open-source and\
    \ is used on all Arduino boards.\n\nAs discussed in the previous chapter, sketches\
    \ are a set of programs that have been written using the Arduino software. The\
    \ text editor is used to write these sketches. The toolbar buttons can be used\
    \ to check and load a program. It can also be used for the opening of the serial\
    \ monitor and creating, opening and saving of sketches.\n\n## Downloading and\
    \ Installing the Arduino IDE\nIf your Arduino is ready to do any project of your\
    \ choice, then, the thing you need to do is to install the Arduino IDE software.\
    \ To do this, firstly download the software from the Arduino official website.\
    \ When you are done with the download, then you can run any program using this\
    \ Arduino IDE. To do this;\n"
