    登录成功后，你会发现在线 `Arduino IDE` 环境与 Arduino 软件版本非常相似，因为你始终在连接互联网的设备上编写代码。你只需点击“new
    sketch”（新建项目）按钮旁边的导入按钮即可轻松上传新文件。然后，你就可以准备运行自己的代码了。


    在在线 `Arduino IDE` 中，第一列允许你浏览多个选项，如 `sketchbook`（项目）、`examples`（示例）、`libraries`（库）、`serial
    monitor`（串口视器）和 `help`（帮助）。第二列将看到所选项目菜单中的其他选项，而第三列则是进行实际编程的地方。


    要上传你自己的库，只需进入“Libraries”（库）然后点击“Library Manager”（库管理器）。通过它，计算机存储的任何库都可以轻松上传。如果你在使用在线
    `Arduino IDE` 时需要任何帮助或遇到挑战，请使用“Help”（帮助）按钮获取核心指南。


    使用“Preference”（首选项）标签页查看在线 `Arduino IDE` 的可用空间。此标签在编程过程中也能提供帮助，因为它提供了自定义在线 `Arduino
    IDE` 外观的选项，例如颜色主题或字体大小。代码区域是在线 `Arduino IDE` 中最常用的功能。你在这里为你的 Arduino 板编写、验证和上传代码。**


    # 第七章


    ![Arduino Led Dice | Arduino projects, Cool arduino projects, Arduino led](img/Image00008.jpg)


    ## 你可以尝试的一些 Arduino 项目


    使用 Arduino 板可以管理许多项目，从控制 LED 灯等简单任务到像使用 Arduino 自动化大多数家庭设备等复杂且具有技术性的项目。以下列出了你可以使用
    Arduino 动手的众多项目：


    - **Arduino Mega 象棋**：这为国际象棋爱好者提供了一个个人数字棋盘。除了你的 Arduino 之外，你还需要一台 3D 打印机和 `TFT
    LCD` 触摸屏来享受你的数字象棋。这允许你在设计这个数字棋盘时根据自己的需求进行必要的调整。

    - **带有控制器的机械臂**：`Arduino UNO` 板允许你对机器人进行完全控制，它是专为这类目的而设计的。你需要一个功能可以通过 3D 打印机增强的机械臂。

    - **制作乐器**：许多爱好者使用 Arduino 板制作了乐器。`Arduino Uno` 也可以用于此。该项目还需要 `Pi supply flick
    charge`。项目完成后，你只需要点击它，就能看到你的手势被转换为音乐。

    - **RFID 读卡器安全访问**：射频识别可用于安全目的。这也可以使用 `Adafruit NFC card` 实现，它也被用于安全访问。

    - **小型天气显示系统**：如果你想拥有自己的微型天气显示系统，Arduino 板将帮助你实现。天气显示系统被编程为以摄氏度和华氏度单位显示环境当前温度。对于一个冒险的初学者来说，这是一个非常有趣的项目。需要一个
    `OLED` 图形显示器来天气信息。

    - **为你的门制作指纹扫描仪**：这个项目允许你构建一个检测你的指纹并允许进入门的系统。门只有在指纹提示时才会打开。

    - **制作电脑控制面板**：通过控制面板可以的操作包括更改显示偏好、控制音、启动应用程序等。你的 Arduino 板是这个项目的骨干，你可以通过 `USB
    controllers` 控制电脑的其他多个部分。

    - **机器人汽车**：你可以使用连接 `DC motors` 的 Arduino 构建机器人汽车。如果你想要一个视觉良好的机器人，使用 3D 打印制作汽车部件是最佳选择。在进行此项目时，你还将学习高级电机控制的基础知识。

    - **追踪运动的电动摄像头**：对于你的家庭监控，这个项目是一个更好的替代方案。你的家庭监控摄像头可能无法拍摄某些盲角的视频。有了这个项目，你可以确保家园的安全，因为摄像头将始终跟随它感到的任何移动方向。

    - **水质控制系统**：水质传感器可以与 `Arduino UNO` 结合使用，为你创建一个很好的水质控制系统，特别是当你关注水卫生时。

    - **超声波距离查找**：这个超声波距离查找是另一个使用 `Arduino Uno` 结合 `sonic ranging module` 和 `LCD readout`
    构建的精彩项目。它用于计算与物体之间的距离。它通过接收器检测从物体反射的声波来工作，接收到的数据随后用于给出该物体的近似距离。

    - **高速摄影**：通过这个项目，现在可以使用 Arduino 板拍摄飞翔鸟类或落水流等快速移动物体的慢动作照片。在这个项目中，Arduino 板配合正确的闪光灯使用。如果你喜欢摄影，这对你来说是一个特别好的工具，因为它能让你产出出色的制作内容。

    - **GPS 追踪器**：通过 Arduino 板，你可以轻松设计智能 `GPS tracker`。这个追踪器在追踪某些物品（甚至是你的车）的位置时非常有帮助。该项目需要你的
    Arduino、`GPS module`、`wires`、`OLED display` 等。

    - **闹钟收音机**：这个 Arduino 项目让你的设备具备双重功能，既是闹钟又是收音系统。这个项目将为你提供设定所需闹钟时间并同时显示时间。

    - **植物浇水系统**：这个项目的巧妙之处在于，与其他 Arduino 项目相比，它可以在几小时内完成。通过正确的代码、`moisture sensor`（湿度传感器）和
    `layout`（布局），根据你的需求构建自动浇水系统。无论植物生长如何，系统都会如期运行。

    - **逆器**：这个项目让人们惊讶，Arduino 可以作为逆器的形式。与普通的逆器相比，Arduino 的通常更便宜。构建很简单，你只需要获取电池并配置
    Arduino 作为逆器。

    - **对讲机**：Arduino 结合一些电子元件可以用来制作对讲机。这允许与任何人进行通信。在这个项目中，通信媒介是蓝牙。

    - **示波器**：你的电脑和 Arduino 板可以作为示波器使用。Arduino 板主要设计为便携式。放置示波器电路后，可以达到频率。这是由于 Arduino
    板自带模拟/数字转换通过 `USB` 直接发送到你的电脑。


    # 第八章


    ![Arduino Tutorial | How to solve if you have trouble uploading to Arduino](img/Image00009.jpg)


    ## 排除


    尽管 Arduino 通常很容易使用，但某些用户仍然觉得操作有点困难。这种问题通常可以通过对设备进行简单调整来解决。下面我们查看了在使用 Arduino 时可能遇到的最常见问题以及如何轻松修复它们。


    ### 串口视器问题


    有时你可能想要使用串口视器。它的作用是通过串口发送某些数据。此外，当你开始查看串口视器时可能会出现一些奇怪的情况（有时什么都看不到）。使用相同的波特率可以解决这个问题。


    ### 电脑/IDE 未被板识别


    Arduino 板无法识别电脑或 IDE 是设置时最常见的问题。这由两点引起：


    1. **使用 USB 线**：你使用的 USB 线可能与 Arduino 不兼容。因为某些 USB 线是为手机充电而非数据传输设计的。通常建议使用支持数据传输的
    USB 线，这将使为设备供电和编程变得简单。

    2. **板驱动**：虽然驱动通常由设备自动检测，从而使安装简单，但有时可能无法自动识别。在这种情况下，你需要手动安装驱动。这些驱动取决于你使用的 Arduino
    板。

    3. **缺少库/头文件**：某些从网上复制并粘贴到 Arduino IDE 的代码没有安装必要的库。这通常会提示错误消息。通过检查电脑上的库管理器可以轻松修复。


    ### 无法上传代码


    这可能是由于以下原因：


    1. **未使用正确的板设置**：在为 Arduino 板时，如果未使用该板正确的 Arduino IDE 设置，你将无法上传任何代码。然而，当设置正确时，代码将顺利上传。要修复这个问题，你需要进入
    Arduino IDE 环境，然后进入“Tool”菜单查找正在使用的板类型。如果你在这里找不到板类型，直接进入“board manager”将正在使用的板类型添加到列表中。

    2. **代码错误**：当代码包含错误时，Arduino IDE 会持续提醒你。这通常显示在 IDE 底部的黑框中。可以通过发布正确的代码来修复。否则，你只需在
    IDE 设置中开启详细输出（verbose output）选项。开启此选项将在上传代码前为你提供很好的建议，并在上传选择的任何代码时引导你。


    # 常见问题


    ## 常见问题


    对某些需要答案的事情仍然不清楚吗？下面我们尽可能对关于 Arduino 的常见问题提供合适的答案。


    1. **Arduino IDE 和 Arduino 网页编辑器（在线）不同吗？**这两个平台——Arduino IDE 和 Arduino 网页编辑器主要功能相同，即为你提供一个编写代码的环境。然而，Arduino
    IDE 需要在使用前下载到你的设备上，而 Arduino 网页编辑器允许你在无需下载任何 Arduino 软件的情况下在线完成操作。

    2. **如果我决定使用 Arduino 网页编辑器，可以使用哪种板？** 所有类型和型号的 Arduino 板默认都有 Arduino 网页编辑器功能。

    3. **如何给 Arduino 充电？** 不同类型的 Arduino 板有不同的电源要求供选择。例如，7-12V 电源适配器或 5V USB 连接可为
    Arduino Uno Rev3 供电。

    4. **从哪里可以获得 Arduino？** Amazon 在线商店提供。

    5. **如何将 LCD 连接到 Arduino？** 输入/输出引脚是 Arduino 连接到 LCD 的接口。使用 `Liquid Crystals`
    库控制连接的 LCD 屏幕。要使用此库，请在库管理器中查找并安装。

    6. **Arduino 可以控制许多舵服电机吗？**事实上，该板通常很容易支持许多舵服电机。


