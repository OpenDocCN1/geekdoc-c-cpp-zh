    # 建立 Arduino 与电脑的连接


    ## Arduino 方便连接所需的工具

    在 `Arduino` 板上成功安装你的运行代码后，你考虑的下一个问题是如何执行某个特定的项目。`Arduino` 可以处理多个项目，例如飞行无人机、移动汽车、点亮
    `LED` 灯或让简单的机器人移动去锁门（稍后将讨论一些你可以用 `Arduino` 尝试的项目）。


    为了让你执行其中任何一个项目，必须在你的 `Arduino` 板上运行一个特定的程序或一组指令（如上文讨论的如何将你的 `Arduino` 连接到电脑）。这些代码对于分配给特定
    `Arduino` 执行的每个功能来说都是独特的。


    然而，当你确定这些工作都已完成后，下一步是将 `Arduino` 的其他所有组件部分小心地连接到你想让它管理的设备上。这通常是使用一些简单的工具或仪器完成的。对于任何成功的
    `Arduino` 项目，都需要其中的一些工具：


    - **剥线器 (Wire Strippers)**：这些是像钳一样的简单工具。它们通常是手持的，用于去除任何电线的绝缘层。它们也可以用于切开电线的任何末端。这些末端通常连接到另一个剥开的线的末端。对于
    `Arduino` 项目，此工具用于创建从你的 `Arduino` 到你正在操作的设备之间的连接。这允许交换特定项目主要功能的必要信息。

    - **精密螺丝刀套装 (Precision Screw Driver Set)**：这些螺丝刀通常由大多数技术人员或爱好者使用。它们具有不同的槽口以适应各种类型的螺丝。在处理微小或小型螺丝工作时，通常需要精密螺丝刀，因为某些
    `Arduino` 板本质上非常小、复杂且困难。这样，这些螺丝刀可以牢固地夹住螺丝，同时扭动你正在的项目中使用的可用小部件。

    - **尖嘴钳 (Needle-nose Pliers)**：尖嘴钳有几个名称。流行的包括鸟嘴钳、尖头钳、夹头钳和圆头钳。它兼具夹持和切割的双重功能，特别适合在处理
    `Arduino` 项目时可能看到的几种复杂电线。这些工具主要用于剪断、弯曲或重新定位你 `Arduino` 项目中的任何电线，以确保连接紧密，从而保证 `Arduino`
    输出你所需的最佳功能。这是因为它们可以到达普通钳子无法工作的非常狭窄的位置。

    - **平口剪 (Flush Cutters)**：此工具的主要目的是剪断你的电线。平口剪可以使电线切切得整齐、平整且非常光滑。使用平口剪应与你想要切割的任何线保持垂直位置。当你使用平口剪时，你的
    `Arduino` 项目一定会看起来整洁且完美。

    - **数字万用表 (Digital Multimeter)**：主要上，万用表测量通过你电路的电量。这通常以伏特 (`V`)、安培 (`A`) 和欧姆 (`Ω`)
    。该工具将以很好的精度测量这些参数。使用数字万用表有助于查看通过你设备的电流、电压或电阻值，以便在需要时进行任何必要的调整。

    - **细直镊子 (Fine Tip Straight Tweezers)**：此工具用于拾起进入你项目的任何不碎片或材料。它有两个端，一个是尖端，主要用于镊取用途，而另一个端是取物端。

    - **吸锡器 (Solder Sucker)**：这是一种俗称为吸锡泵的热焊工具。它专门用于移除你电路中之前焊接过的部分。这可能是为了该部分的维修、更换或故障排除。

    - **电烙 (Soldering Iron)**：电烙是一种用于使你项目中的各种电线光滑的工具。这确保了电荷在项目的整个电路中正确流动。它通过加热和熔化接触点的焊锡来工作。需要建立连接的节点使用电烙胶合在一起。

    - **Panavise Jr**：另一个用于 `Arduino` 项目的必备工具是 `Panavise Jr`。在连接许多设备时，使用它可以固定项目的任何部分，这非常有帮助。可以使用此工具固定
    `Arduino` 板或电路的其他组件。这样做可以让你更方便地在项目上执行你想做的任何事情，因为此工具可以根据意向扭转方向，提供舒适感并让你的项目更容易操作。


    ## 项目最终完成前的准备工作

    在用 `Arduino` 板连接其他设备和电路时，必须遵循某些预防措施，以避免错误连接的复杂性，并避免碰到当前项目不需要板的其他部分，这可能会损坏整个板。


    一旦为特定任务或功能编写并了所需的代码加载到你的 `Arduino` 中，剩下的工作就是使用上述某些工具将 `Arduino` 上的所需端口或引脚与它工作的设备连接起来。


    完成后，你将确认所有必要的连接是否已准确完成。首先，确保加载了项目的正确代码。确保所有必要的工具和/或设备已正确安排，以防止连接中的错误。这已成为一个关键步骤，因为任何不当的连接都会影响整个项目。

    '
