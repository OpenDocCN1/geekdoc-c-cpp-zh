    * Use Javascripts from web portals to control hardware

    * Use simple HTML to read a switch state

    * Use HTML to read a sensor''s value


    ### Requirements

    You will need the followings things if you are planning to use your Arduino to
    browse the internet:


    * An Arduino Mega Server (e.g. Arduino Mega2560 or Arduino UNO)

    * A wired LAN connection with a speed of 10/100MB

    * An Ethernet Shield


    The Ethernet Shield functions primarily to connect to the internet using the Arduino
    as the source of connection. The shield can be connected to your Arduino through
    the head pins. Ethernet cable is then connected to the shield. Other hardware
    needed when doing this include:


    * Ethernet cable

    * Pushbutton

    * 9 V adaptor

    * Wi-Fi router

    * Jumper wires

    * 10 K resistors

    * Breadboard


    ### Functionality

    In other to perform various optimal functions, these tools are used such as receiving
    and sending of certain commands from the network, searching for any available
    network, real-time clock, integration with smart home systems, voltage and current
    control, and maintenance of sensors and measurement of temperature.


    Aside from this, your personal modules can be added as you desire. This is because
    the Arduino Mega Server can distinctively compile modules, detect compiled modules,
    and separate them from not yet compiled modules. It also avails you the flexibility
    to disable or enable any module that has been compiled straight from the internet.


    Among the few things that have been integrated with the Arduino Mega server is
    an electric module that can monitor the input and output voltage of the Arduino.
    This electric module can likewise monitor the current. It is assembled on the
    switchboard and can conveniently regulate the amount of electricity consumed.
    The ability to track the presence of people is another unique function that can
    be performed by this module.


    Acting as network oscilloscope is another additional feature, this oscilloscope
    display real-time network traffic within your web in the form of dynamic signals
    or oscillogram. Also available is a screensaver module which especially displays
    information on panels. This enables you to choose the information that is relevant
    to you while getting rid of any other. System failure can be forestall using the
    Arduino Mega Server by implementing a highly efficient frequency meter. There
    is also a 216 block indicator useful for 3D system status, this offers you the
    privilege to look over the entire structure of the system.


    ### Setup Steps

    To use your Arduino as a web server, you must do the following things:


    * Use the Ethernet configuration for the Arduino

    * Stipulate the address of the IP

    * Give the Address of the MAC you are using

    * Connect your Arduino to the available internet service (you can use a Wi-Fi
    router for this)

    * Give the code required to run Arduino as a web server

    * Connect your computer to the Arduino using a router

    '
