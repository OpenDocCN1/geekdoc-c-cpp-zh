    ![](img/Image00000.jpg)


    # 了解 ARDUINO

    初学者指南：实时见解与学习 Arduino 编程的技巧

    作者：John C. Richards


    ## 目录

    - [为什么使用 Arduino 具有优势]

    - [Arduino 板卡（类型）]

    - [如何将你的 Arduino 连接到电脑]

    - [Arduino Mega 服务器]

    - [Arduino 使用的编程语言]

    - [Arduino 集成开发环境]

    - [你可以尝试的一些 Arduino 项目]

    - [Arduino 故障排除]

    - [常见问题 (FAQs)]

    - [结论]


    ## 引言


    ### 什么是 Arduino？

    Arduino 是一种可编程的多用途电子平台，其硬件和软件均设计用于开源环境中运行。Arduino 项目始于意大利的伊里亚交互设计学院（Ivrea Interaction
    Design Institute），源于对快速且易于使用的原型设备的需求。


    Arduino 组负责制造和设计单板微控制器和微控制器套件，这些设备能够构建各种数字设备。Arduino 板上的输入和输出引脚可以与其他各种扩展模块进行接口，这为该设备提供了原型制作能力。


    对于人口中非技术导向的人群来说，电子和编程听起来可能很复杂，但无需担心，因为 Arduino 最初开发时就特别考虑了电子和编程方面完全零正式知识的人士。然而，即使在今天，使用这种不可或缺的小型设备也不需要电子和编程方面的特殊技能。因此，从爱好者、艺术家、设计师、黑客、新手、游戏玩家到技术专家，任何人都可以可以使用各种
    Arduino 架构来满足其个人需求。


    作为微型计算机，Arduino 主要由硬件和软件部分组成，其硬件遵循 `CC-BY-SA` 许可，软件则遵循 GNU 较小通用公共许可证（`LGPL`）。因此，只要遵循开源许可规定，它就赋予了第三方公司制造和分发
    Arduino 板卡及软件的权利。


    Arduino 板卡构建了不同的串口通信接口，可以连接到电脑，以便使用简化的 Arduino 集成开发环境（`IDE`）以及命令行工具在板卡上进行轻松编程。


    随着时间推移的不断进步和演变，Arduino 板卡已成为解决和管理各种难度难度日常任务的有用工具。这实际上归功于它将自己的设计与更传统的 8 位板卡区分开来。直到今天，Arduino
    板卡仍被用于 3D 打印、云计算、嵌入式环境、物联网应用和可穿戴设备等顶级创新技术。


    现在 Arduino 可以帮助我们管理和控制大多数复杂的日常任务，如 LED、电机、互联网、扬声器、自动锁、摄像头、无人机、GPS 设备、智能手机等，因为它设计时具有与这些设备交互的能力。


    对于任何对创建交互环境或设备感兴趣的人来说，好消息是，Arduino 项目正是为此目的而设计的，让你探索自己的世界。你可能会感兴趣的是，创造的内容没有限制，从制作个性化的加热垫、取暖毯到拥有你自己的占卜机。只要你能梦想，你就能用
    Arduino 板卡创造出来，几乎任何东西都可以被创造。


    大多数 Arduino 板卡通常基于 Atmel 8 位 AVR 微控制器。相比之下，最近的一些板卡使用更高配置构建。它们可以通过编程连接的实现方式以及与其他外部电路的集成方式（取决于闪存类型和数量、引脚、功能，以及是否存在单排、双排引脚或母头插座）来区分区分。


    ## 为什么 Arduino 流行？

    Arduino 项目在全球范围内的用户和非用户中一直获得持续的赞誉。这种流行归功于每个 Arduino 板卡自带的几个独特因素和独特特征。以下原因是大多数用户选择坚持使用
    Arduino 设备的众多原因之一。


    - **安装简单**：Arduino 的设计具有允许非常容易的安装过程的特性。这是因为 Arduino 板卡自带 USB 端口。有了这个独特的端口，安装 Arduino
    软件会变得简单得多。

    - **易于使用**：Arduino 受许多新手的青睐，因为它可以与其他设备配合使用，而不需要任何特殊的编程技能，且不需要以代码形式向板卡传达任何新指令集。此外，使用
    Arduino 执行许多简单活动不需要外部硬件。

    - **简单的编程语言**：尽管人们仍然需要对设备进行编程以执行特定功能，但 Arduino `IDE` 是用简化的 `C++` 编程语言编写的。这种语言是最易学习的语言之一，使得设备操作变得非常简单。

    - **获取成本相对较低**：由于 Arduino 项目是一个开源平台，这使得它们的软件免费且硬件相对廉价。因此，许多用户感到非常舒适和荣幸，将他们的编码和编程知识贡献给基于
    Arduino 的项目，以增强可访问性。

    - **良好的备份**：事实上，大多数设备型号的程序加载是从个人电脑上完成的。这是通过使用标准的 `API` 实现的，它被称为“Arduino 语言”。因此，Arduino
    设备作为几乎所有电子设备的备份系统发挥着巨大的作用。

    - **可更换的处理器**：尽管板卡尺寸很小，但如果检测到板载处理器故障，Arduino 为快速、方便更换处理器留了空间。这使得 Arduino 板卡在考虑易于维护和部件更换时成为理想选择。

    - **通信速度**：在现代技术中，速度是选择设备时考虑的一个主要因素。这是许多用户喜欢 Arduino 的主要原因，因为它的板卡以速度闻名。在与个人电脑进行快速通信方面，Arduino
    是领先的。这是为了确保 Arduino 与任何电脑之间信息的流畅交换。


    如果你想用 Arduino 一些简单项目，但不确定如何或从哪里获取，Arduino 官方网站始终提供产品，其他授权的电子商店也有。


    ## 第一章

    ![使用 Arduino 的优缺点](img/Image00002.jpg)


    ### 为什么使用 Arduino 具有优势

    Arduino 具有许多出色的特性，使其成为许多用户（特别是通常将其视为控制大多数电子设备工具的初学者）的首选。以下是使用 Arduino 的优点之一：


    - **启动加载器使得程序加载**：硬件编程器可以方便地在 Arduino 设备上加载程序，而无需将其烧接到另一个存储设备中。这是通过板载启动加载器实现的，它将程序转入电路中。

    - **成本较低**：与其他类似的设备相比，Arduino 的创建是为了让所有人都能负担得起。从 50 美元以上，可以在市场上购买大多数开发板。花费大约 30
    美元即可以 30 美元的价格购买 Arduino，在价格方面没有任何妥协。


