  trans: '


    ## Arduino 特性


    - **IDE**: Arduino 自带了自定义的 `IDE`，支持在 Windows、Linux 或 Mac 系统上运行。这完全是因为它是作为开源工具制造的，并具有耐用且支持良好的后端。这使得在其平台上移植变得更加容易。此外，它更容易检测并修复错误。

    - **强大的 IDE 社区**: 许多 Arduino 用户都是志愿者开发者，他们无私地工作，贡献力量以增强和改进其 `IDE` 的质量。Arduino
    的质量标准和价格优势可能是这一现象的主要原因。

    - **简单的设计**: Arduino 的设计简单且紧凑，与之前开发的许多设计复杂的类似板不同。在这些复杂的板卡上，`LEDs`、`buttons`、`LCD`
    和其他多个多功能结构被集成在一起。这导致与 Arduino 相比，板卡变得非常笨重。


    Arduino 采用了非常简单且谦逊的结构。这是因为它支持多种 `Arduino shields`（范围从 `Wi-Fi` 到 `LCD` 不等），这些扩展就像
    Arduino 的附加组件，用户可以根据希望让其执行的任务来决定是否使用。


    - **Arduino 库执行多种功能**: Arduino 库经过配置可以执行多项任务。这些任务范围从执行复杂功能到执行简单任务不等，例如解析 `GPS`
    或向 `SD cards` 写入数据，控制 `pins` 或对 `buttons` 进行去抖处理。

    - **Arduino 并非任何芯片制造商的产品**: 许多芯片制造商主要感兴趣的是让他们的产品具有独特性。因此，他们制造带有自定义部件的 `Chips`，以与其他类似的芯片制造商区分开来。


    然而，Arduino 并不是任何芯片制造商的产品。因此，它在设计上刻意与其他微控制器保持相似性。这意味着任何微控制器能做到的事情，在 Arduino 上也能实现。

    - **传感器**: Arduino 是一个很好的数字传感器，因为它配备了模拟数字输入。这使得 Arduino 能够使用传感器提供的数据测量温度、压力和光强度。在这种情况下，市场上几乎所有的可用传感器都可以。

    - **Arduino 轻量且可在裸机上运行**: 虽然 Arduino 拥有先进且智能的代码编译器，但它可以直接在裸机（bare metal）上运行。尽管具有复杂的功能，它仍然快速、轻量且体积小。代码与
    `HEX` 一起提供，可以批量用于为新芯片编程，而像 `BASIC` 或 `.NET` 那样需要解释。


    ## Arduino 的缺陷


    - **分辨率低**: 如果需要更高的处理能力或工作内存来处理设备不断增加的负载，Arduino 可能不是一个非常好的选择。因为 Arduino 微控制器只有
    `10 bit` 的分辨率。因此，它无法处理复合和高级功能。

    - **无调试器**: 用户可能无法在 Arduino 上检查脚本，因为它没有内置调试器。因此，检测和纠正编码过程中可能发生的任何错误变得有些困难，因为要追踪自己的操作和进度几乎是不可能的。

    - **程序执行受限**: Arduino 同时只能执行一个程序和一项任务。如果你希望你的设备能够多任务处理，这可能会让你感到格外沮丧。因此，Arduino
    的使用被限制在微设备和单任务上，因此在 Arduino 上无法进行多任务处理。

    - **缺乏 AVR 微控制器知识**: 由于需要对 `AVR microcontroller` 有平均水平的知识和理解，使用 Arduino 的学者可能会发现难以适应。特别是，这可能会影响设备的整体效率。

    - **编程语言**: Arduino 主要使用 `C` 和 `C++` 编程语言开发。然而，这些编程语言是为有经验的人准备的，而不仅仅是初学者。

    - **内存限制**: Arduino 永远无法取代电脑。Arduino 只有 `2 Kb` 的 `RAM` 和 `3 Kb` 的闪存。因此，在上面可以执行或存储的内容始终受到限制。

    - **不是全能板**: 虽然 Arduino 可以用于管理其他设备，并作为 PC 配件使用，但它无法对通用功能进行充分优化，因为它不是一个全能设备。

    - **代码分段**: 由于 Arduino 使用的 `IDE`，它并不支持良好的项目环境。这阻碍了轻松学习，并且没有为其他文件留出空间。大多数用户做的只是从网上复制粘贴代码，而并不理解自己在做什么。

    - **5V 的使用**: Arduino 的许多板子仍然配备了旧的 `5V`，而不是在考虑速度和精度时表现更好的 `3.3V`。这是过时的，旧的 `5V`
    芯片速度慢且电压低。

    - **Arduino 的误用**: 因为许多用户缺乏对其如何工作原理的深度知识，他们将其视为几乎可以解决任何问题的简易修复工具。因此，这些 Arduino
    用户将其用于这种不值一提的任务。

    - **抽象的 API**: Arduino 的 API 是延迟的。因此，它阻止了应用程序多个层之间的正常交互。因此，涉及的组件之间几乎没有进行数据传输。

    - **端口操作**: 大多数用户并没有直接操作 `pins`，而是简单地在设备上进行端口操作。这主要是由于缺乏对所用语言的基础知识。大多数用户并不知道 Arduino
    内部有可以处理的 `C` 等效代码。


    '
- fmt: '

    # CHAPTER TWO: Different types of Arduino Boards Used By Engineering Students


    ![Different types of Arduino Boards...](Image00003.jpg)


    ## Arduino Boards (Types)

    Arduino boards have gained influence in various engineering fields as quick ways
    to design different projects. It is sometimes used as a finishing tool in some
    embedded engineers projects. These designs vary, depending on the type and model
    of Arduino used, can range from a composite scientific instrument to a simple
    household instrument.


    The Arduino ability to be used for various different applications has been enhanced,
    all of its boards are based on open-source. Arduino boards on the market come
    in different types and models with common features as well as distinctive functions,
    these are usually based on the specific project they are used for. Some of the
    available types of Arduino boards are:


    ### Arduino Leonardo Board

    Among the first developments of Ardun boards, Leonardo board came as one. Usage
    of program libraries is easier on this board because it can be directly connected
    using `USB`. The `USB` comes in-built with the microcontroller, which makes it
    one of the cheapest and easy to use among all the boards. Leonardo boards are
    easy to connect with the computer keyboard, mouse, smart devices etc, as a result
    of this feature. The board is fully dependent on `ATmega32u4` microcontroller
    with a “clock speed” of `16 MHz`. This board is equipped with 2.5 Kb SRAM memory
    while it sits on a 32 Kb flash memory.


    ### Arduino Uno (R3)

    When looking for board among the most popular, the Ardunio Uno comes to mind,
    it is reportedly used by people of diverse professions. This board has 14 pins
    digital input/output (`I/O`), with six pins being used as a “pulse width modulation”
    (`PWM`) output. Other features one can find on this board are a `USB` port, a
    reset button, a power jack and 6 pins analog input. By upholding the microcontroller,
    all of these will be accessible. This board can be attached to your PC using a
    `USB` cable. The board come with `ATmega328` processor, a clock speed of `16 MHz`.
    The SRAM memory is 2 KB while the flash memory is 32 KB.


    ### RedBoard Ardunio Board

    The RedBoard Arduino board make use of the `Arduino IDE`. Which can be subsequently
    programmed by using a Mini-B `USB` cable. This easily goes well with Windows 8
    without the need to alter any of your security settings. The RedBoard Arduino
    board can be easily controlled. It is one of the easiest to use after it must
    have been successfully created. After powering the board on with your PC or other
    emulators, just follow the menu and select.


    ### LilyPad Arduino Board

    This board is wearable, and can be in e-textile technology. The design is for
    textiles in particular, and the board is also washable. It can be sewed into clothes
    with tread. Everything on this board like the sensor circuits, power and `I/O`
    are specifically designed to serve this purpose. This board also consists of an
    `Arduino` bootloader with variable `2V` to `5V` power supply sitting on `ATMEGA328`
    microcontroller.


    ### Arduino Mega (R3)

    The Arduino Mega operates on an `ATmega2560` processor and its digital `I/O` pins
    are 54. out of these 15 pins, 4 pins are used for the serial port of the `UART`
    hardware, 16 pins for analog inputs and 14 pins as the output for `PWM`. Some
    other components on these boards are a power jack, connection for `USB`, ICSP
    header, `RESET` pin and the `16 MHz` crystal oscillator.


    ### Arduino Shields

    To connect to other types of Arduino boards, Arduino Shields are used. They are
    pre-built circuit boards. These Ardunio shields vary depending on the type of
    usage. Some of which include `Proto Shield`, `Ethernet Shield`, `Wireless Shield`
    and `GSM Shield`. The `Arduino Shield` and Arduino boards are so connected in
    a way that the Arduino board is placed under the `Arduino Shield`. This makes
    room for easy integration as the board is eventually connected to control the
    `LCD` and monitor.


    ### Arduino Micro Boards

    As the name implies, this is a special type of Arduino board with a very small
    design. The microcontroller operates on a processor dubbed `ATmega32U4`. There
    are a total of 20 pins on this board of which 12 are used for analog `I/O` and
    7 for `PWM`. This board has its micro-USB connection onboard the Arduino Micro
    board. Other features present on the board include; ICSP header, a `16 MHz` crystal
    oscillator. Arduino micro commonly refers to as a shrunk form of the Leonardo
    because it is small and resembles the Arduino Leonardo boards.


    ### Arduino Due Board

    The first board on Arduino series designed and developed to use the ARM microcontroller
    is Arduino Due board. The ARM core is 32-bit and 54 digital `I/O` pins where 12
    are analog pins. This comes with two different types of ports onboard (the programming
    port and the `USB` port); the programming port functions as the interface for
    the micro side of the `USB` cable.


    ### Arduino Bluetooth Board

    This has been purportedly dubbed Bluetooth board because it is programmed through
    Bluetooth wireless connection. Arduino BT boards are based on the `ATmega168`
    microcontrollers model. Notable features of this board are screw terminals, `16
    MHz` crystal oscillator, reset button, 6 analog pins and 16 digital pins.


    ### Arduino Esplora Board

    Planning to have actuators and sensors that interface easily, then the Arduino
    Esplora board is designed specifically for you. This board is different from other
    types of Arduino boards as it is embedded with microphone, accelerometer, temperature
    sensor, slider, joystick and buttons. The Arduino Esplora board also come with
    the input and output connections.


    ## What Arduino Boards can be useful in the House?

    Several types of Arduino boards can become very useful at home for various kinds
    of task. However, the task Arduino will handle will suggest which type of board
    suit the purpose, but generally, the most commonly used household boards includes
    `Arduino Uno`, `Arduino Mega`, `Arduino Pro` and `Arduino Mini`. This is determined
    majorly by type of task to perform at home ranges from scheduling upcoming, automated
    door lock and switching on or off the lights to even operating your smartphones.
    CHAPTER THREE


    ![USB communication...](Image00004.jpg)


    ## How to Connect your Arduino to a Computer

    After you must have made your selection of the type of Arduino board you need
    for your specific function. What follows is to try and load a set of instructions
    or codes into the Arduino board via a computer. How your Arduino manage a given
    task is determined by the instructions loaded in it. These set of instructions
    or programs are, however, very specific to the function to be performed. Nevertheless,
    any instructions loaded into the Arduino board is what will get executed. Your
    Arduino must be connected to a computer to enable code loading. In other to establish
    the necessary connection on Windows, the following are the needed things:


    *   The Arduino board

    *   The Arduino software

    *   The `USB` cable (A and B)

    *   Your computer


    1. Start by downloading the required software to make your computer compatible
    with your Arduino.

    2. Once you are done with it, unzip it into `D:/Arduino`.

    3. Then, the connection between your computer and Arduino board is ready to be
    established by connecting one end of the `USB` cable to your computer and the
    other end your Arduino board.

    4. When your computer''s Windows prompt for the driver, it can be installed manually
    (location is `D:/Arduino/Arduino-0022/drivers`).

    5. The Arduino software environment can then be located `D:/Arduino/arduino-0022/arduino.exe`.

    6. After this, you choose the type of Arduino board you are using by doing the
    following:


    *   Go to `Tools`

    *   Select `Board`

    *   Then, choose the type of Arduino board from the drop-down lists.

    '
