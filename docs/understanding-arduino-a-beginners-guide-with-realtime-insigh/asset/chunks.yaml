  raw: '*   IDE : Arduino comes with its own custom IDE which supports operation on
    Windows, Linux or Macs. This is due solely to the fact that it is manufactured
    as an open-source tool and with durable and well-supported backend. This makes
    porting better on it. Aside from this, it is easier to detect bugs and fix them.


    *   Strong IDE Community :  Many users of the Arduino are volunteer developers
    working selflessly to make their contribution to enhance and improve the quality
    of its IDE. The quality standard and affordability of the Arduino may be the major
    reason for this.


    *   Simple Design : Arduino comes with a simple and compact design, unlike many
    previously developed similar board with a complex design. In this complex boards,
    several multifaceted structures like LEDs, buttons, LCD and other segments comes
    onboard with it. This results in bulky boards as compared to Arduino.


    Arduino has been created with a very simple and modest structure. This is because
    several Arduino shields (ranging from Wi-Fi to LCD) are supported that act just
    like use as add-ons to Arduino which users may decide to use or not to depending
    on the task they wish it to perform.


    *   Arduino Libraries Perform Several Functions : The Arduino libraries have been
    configured to perform multiple tasks. These tasks can range from performing a
    complex function to just carrying out a simple task such as parsing GPS or writing
    to SD cards to twiddle pins or debounce buttons.


    *   Arduino is not a Product of any Chip Maker : Many Chip makers are mostly interested
    in making their products to be unique. Thus, they manufacture Chips with custom
    parts that will distinguish them from other similar chips manufacturers.


    However, Arduino is not a product of any Chip maker. Hence it has been intentionally
    designed to share similarities with other microcontrollers. Implying that whatever
    any microcontroller can do can also be achieved on the Arduino.


    *   Sensors : Arduino is a good digital sensor because it is equipped with an
    analog-to-digital input. This enables Arduino to measure temperature, pressure
    and light intensity using data provided by the sensor. In this case, nearly all
    available sensors in the market can be used.


    *   Arduino is light and runs on a Metal : Although Arduino has a sophisticated
    and intelligent code compiler yet it can be run straight on bare metal. Even with
    its complex functionalities, it is fast, very light and small. The codes come
    along with the HEX which may be used in bulks to program fresh chips, unlike BASIC
    or .NET, that needs to be interpreted.


    Flaws of Arduino


    *   Small Resolution: Arduino may not be a very good option if higher processing
    power or working memory is needed to handle an increase in the load of the device.
    Because the Arduino microcontroller just has a 10 bit of resolution. Hence it
    will not be able to handle compound and advanced functions.


    *   No Debugger : One may not be able to check scripts on Arduino because debugger
    does not come in-built with it. Hence, detecting and correcting any error that
    might have occurred when coding becomes a little difficult since it is almost
    impossible to track one''s operations and progress.


    *   Limited Program Execution : Arduino can only execute a single program and
    one task at the same time. If you like your device to multi-task, this may get
    you particularly frustrating. Therefore, Arduino usage has been limited to micro-equipment
    and single task, hence, multi-task is impossible on the Arduino.


    *   No Knowledge of AVR Microcontroller : Since an average knowledge and understanding
    of the AVR microcontroller is required, a beginner who uses Arduino may find it
    uneasy about getting along with. In particular, this may affect the overall efficiency
    in operating the device.


    *   Its Programming Language : The C and C++ programming languages are what Arduino
    is mainly developed in. However, these programming languages are meant to be understood
    by experienced programmers and not just some beginners.


    *   Small RAM and Memory : Arduino can never take the place of your PC. Arduino
    comes with just 2 Kb of RAM and 3 Kb of flash memory. Therefore, there is always
    a limitation to what can be done or stored on it.


    *   It is not an all fix Board : Although, the Arduino can be used to manage various
    other devices and likewise be used as PC accessory, it also comes with the inability
    to adequately be optimised for general function since it is not a fix-all device.


    *   No Partitioning of Code : Because of the IDE used in Ardunio, a good project
    environment is not supported on it. This discourages easy learning and creates
    no room for other files. What most of the users do is just go online copy and
    paste codes with very little understanding of what they are doing.


    *   Usage of 5V : Arduino still has many of its boards equipped with the old 5V
    instead of the 3.3V which offers the best when speed and accuracy are considered.
    This is outdated, and the older chips on 5V are slower and too low.


    *   Misuse of Arduino : Because many of its users lack in-depth knowledge on how
    it works and they take it as an easy fix tool to almost anything that comes to
    their minds. Hence, these users of Arduino use it for such an unworthy task.


    *   Abstracted API : Arduino APIs are latent. Hence, it prevents normal interaction
    between several layers of the applications. Therefore, little or no data transfer
    between the components involved is carried out.


    *   Port Manipulation: Most users, instead of manipulating the pins, they easily
    do port manipulation on the device. This is mainly due to the lack of basic knowledge
    of the programming language in use. Unknown to most users that within the Arduino,
    there is C equivalent that can be doused. Thus, it serves as a demerit to Arduino.'
