  trans: '


    - 在您的网络浏览器中打开 Arduino 网站 (https://www.arduino.cc/en/Main/Software)。

    - 点击链接下载并进入下载页面。

    - 在 Arduino 许可协议上点击“同意”按钮。

    - 点击下载页面上的 `Windows` 链接，这将下载适用于 Windows 的 Arduino 软件。

    - 在您的电脑上找到刚下载的文件，然后解压缩压缩包。

    - 将其复制到电脑上的常用位置。

    - 然后，通过将 Arduino 板板连接到电脑来连接电脑与 Arduino。

    - 点击 Windows 开始菜单按钮启动 Windows 设备管理器。

    - 右键点击“此电脑”菜单，并在下拉菜单列表中选择“属性”。

    - 点击“设备管理器”链接。

    - 此后，设备管理器将显示“Arduino”。

    - 右键点击“Arduino”以更新驱动程序软件。

    - 将弹出一个对话框，从下拉选项中选择“浏览我的电脑以查找驱动程序”。


    在此之后，选择“浏览”按钮。已下载的 Arduino 文件夹中现在有一个 `Driver` 文件夹，选择此 `Drivers` 文件夹。选择好后，您就可以点击“下一步”。会弹出一个对话框，选择“仍安装此驱动程序”。几分钟后，驱动程序的安装将完成。您会注意到另一个对话框弹出，只需记下用于配置
    Arduino 的端口。之后，您可以设置您的 Arduino 软件。操作方法如下：


    - 进入刚下载的文件夹。

    - 现在可以通过双击该文件来打开 Arduino 软件。

    - 确保您已选择正确的 Arduino 板板，如果没有，请根据需要更改选项。

    - 同时确保所选择的串口是正确的，如果不是，请根据需要进行更改。


    在完成所有这些程序后，剩下的就是测试安装是否正常。您可以通过将程序（sketch）加载到 Arduino 来查看安装是否良好。为此，选择“Blink”程序并点击
    Arduino 上传按钮（Arduino 板板上的 LED 将闪烁以指示已加载程序）。您可能希望运行程序以确认 Arduino 软件和驱动程序已成功安装。


    ### 选择哪个版本的 Arduino IDE


    Arduino 软件会定期更新以提高效率，并有时修复某些已知错误，因此，发布的 Arduino IDE 版本经常发生。这些修改对于满足持续用户的需求是必要的。


    Arduino IDE 版本 `1.0.5` 是首次发布的 Arduino IDE，也是第一代 Arduino 编程中最旧使用的版本。此版本 `1.0.5`
    以及其他后续发布的版本如版本 `1.8.11`、`1.8.10`、`1.8.9`、`1.8.8`、`1.0.5`、`1.0.4`、`1.0.3`、`1.0.4`、`0023`、`0022`、`0021`
    `0020` 等现在已经过时。


    目前活跃的版本是版本 `1.8.12` 和版本 `1.8.13`。`1.8.13` 版本是 Arduino IDE 的最新版本。`1.8.13` 版本有很多改进，因此是目前为止发布的最佳版本。该版本的最新更新主要支持
    Windows 操作系统（例如 `2000`、`XP`、`7` 和 `Vista`）。它由 Genericom 开发，总文件容量为 90.20 MB。该 Arduino
    IDE 的其他显著功能包括与任何进行 Arduino 项目的用户共享信息，以及需要时更改原理图和内部布局的能力。


    ### Arduino 在线 IDE


    使用在线 Arduino IDE 或 Arduino 网页编辑器是进行 Arduino 编程另一种方式。通过这种方式，您可以访问教程、配置板板，最重要的是作为
    Arduino Create 的功能之一直接在网页上编写代码。对于拥有持续且良好网络连接的用户来说，这是一个非常出色的功能。


    这样做的好处是可以随时访问 Arduino 功能，而不一定需要下载 Arduino 软件。因此，可以将程序存储在云端，并在方便的时间和地点轻松访问。要使用
    Arduino IDE 的这些在线功能，需要：


    - 从 `https://create.arduino.cc/getting-started` 安装 Arduino Create 插件以便连接您的板板。

    - 点击 Arduino 网页编辑器登录您的 Arduino 账户（如果您之前没有账户，也可以创建一个新账户）。


    '
- fmt: '

    After a successful login, you will observe that the online `Arduino IDE` environment
    resemblance with the Arduino software version since you always code from a compatible
    internet-connected device. You can easily upload a new file with just a click
    on the import button right beside the "new sketch" button. Then, you are ready
    to run your own code.


    On the online `Arduino IDE`, the first column allows you to browse through several
    options like `sketchbook`, `examples`, `libraries`, `serial monitor`, and `help`.
    On the second column, you will see other options from the menu of any chosen item
    while the third column is where proper programming is done.


    To upload your own libraries, just go to "Libraries" then click on the "Library
    Manager". With this, any library stored on your computer can easily be uploaded.
    The "Help" if you need any help or face any challenge while using the `Arduino
    IDE` online, use the "Help" button to get the essential guide.


    Use the "Preference" tab to view available storage space on your online `Arduino
    IDE`. This tab also helps you during programming by providing you with the options
    to customise the appearance of your online `Arduino IDE`, such as the colour theme
    or text size. The code area is the most used feature of the online `Arduino IDE`.
    This is where you will write, verify and upload your codes on your Arduino board.


    # CHAPTER SEVEN


    ![Arduino Led Dice | Arduino projects, Cool arduino projects, Arduino led](Image00008.jpg)


    ## Some of the Arduino Projects that You can Attempt


    Several projects can be managed with the Arduino board ranging from such simple
    task as controlling LED lights to a more complex and technical project like using
    the Arduino to automate most of your household devices. Few among many projects
    you can lay your hands on using the Arduino is listed below:


    - **Arduino Mega Chess**: This gives Chess lovers access to a personal digital
    chessboard. In addition to your Arduino, you will need a 3D printer and `TFT LCD`
    touchscreen to enjoy your digital Chess. This allows you to apply the necessary
    adjustment to suit your desire when designing this digital chessboard.

    - **Robot Arm that has Controller**: The `Arduino UNO` board permits you to have
    total control over your robot, which is specially designed for this type of purpose.
    You will need a robot-arm whose function can be enhanced with the 3D printer.

    - **Making Musical Instruments**: Musical instruments have been made by many hobbyists
    using the Arduino board. The `Arduino Uno` can also be used in this regard. The
    `Pi supply flick charge` will also be needed for this project. After the project
    has been completed, all you need to do is, tap on it to see your hand waves being
    converted to music.

    - **The RFID Reader Security Access**: Radio frequency identification may be used
    for security purposes. This can be performed using an `Adafruit NFC card` also,
    which is being used for security access.

    - **Small Weather Display System**: If you think of having your own miniature
    weather display system, the Arduino board will help you achieve this. The weather
    display system is to be programmed to display the current temperatures in the
    environment both in Celcius and Fahrenheit units. This is really an interesting
    project for an adventurous beginner. An `OLED` graphic display is required to
    view the weather information.

    - **Make a Fingerprint Scanner for your Door**: This project allows you to construct
    a scanning system that detects your fingerprint and then gives you access through
    the door. The door will only give way at the prompt of your fingerprint alone.

    - **Make the Control Panel of a Computer**: Things you can do with the control
    panel include changing screen preference, controlling the volume, launching of
    app etc. Your Arduino board is the backbone of this project, you can control the
    several other parts of your computer using the `USB controllers`.

    - **Robotic Car**: You can build a robotic car using the Arduino in connection
    with `DC motors`. If you want a robot with good visual, using 3D printing for
    the components of the car is the best choice. You will also get to learn the rudiments
    of advanced motor control as you do this project.

    - **Motorised Camera that follows Motion**: For your home security camera, this
    project becomes a better alternative. Your home security camera may be unable
    to take videos of some blind spot. With this project, you are sure of a secured
    home since the camera will always follow the direction of any movement it senses.

    - **Quality Control System for Water**: The water quality sensors can be used
    in combination with the `Arduino UNO` to make a great water quality control system
    for you, especially if water hygiene is your concern.

    - **Ultrasonic Distance Finder**: This ultrasonic distance finder is another awesome
    project that can be built using the `Arduino Uno` in combination with a `sonic
    ranging module` and `LCD readout`. It is used to calculate distance from an object.
    This work by detecting sonic waves reflected off an object on its receiver, the
    data received as a result of this is then used to give an approximate distance
    to the said object.

    - **High-speed set of Photography**: With this project, slow-motion shots of a
    fast-moving object such as flying birds or falling water can now be taken with
    the Arduino board. In this project, the Arduino board is used with the right flash.
    If you are into photography, this is especially a good tool for you as it enables
    you to produce great production contents.

    - **GPS Tracker**: With the Arduino board, you can easily design a smart `GPS
    tracker`. This tracker becomes helpful when tracking the position of some things,
    even your car. In combination with your Arduino, a `GPS module`, `wires`, `OLED
    display` etc are needed for this project.

    - **Alarm-clock Radio**: This Arduino project equips your device with the ability
    to perform a dual function, as an alarm and as well as a radio system. This project
    will avail you the choice of setting the alarm for the desired time while having
    the time displayed.

    - **Plant Watering System**: The beauty in this project is that it can be assembled
    within a few hours compared to some other Arduino projects. With the choice of
    correct source code, `moisture sensor` and `layout component`, this automated
    plant watering system can be built according to your specification to suit your
    desire. The location where the potted plant may be growing does not matter, the
    system will just deliver as expected.

    - **Inverter**: This particular project got people amazed that the Arduino can
    serve as a form of substitute to the conventional inverter. An inverter made from
    Arduino is usually cheaper when compared with average inverter. This is simple
    to build, all you need to do is get your battery, and then configure your Arduino
    to function as inverter.

    - **Walkie-Talkie**: Arduino, in combination with some necessary electronic components,
    can be used to create Walkie-Talkie. This allows to easily communicate with any
    other person. The medium of communication in this project is Bluetooth.

    - **Oscilloscope**: Your computer and Arduino board can be used as act as oscilloscope.
    The Arduino board is designed primarily as portable. After the oscilloscope circuit
    has been put in place, frequency up to can be reached on it. This is made possible
    as a result of inbuilt analog/digital converter that comes along Arduino board.
    The signals from this converter are sent directly to your computer via `USB`.


    # CHAPTER EIGHT


    ![Arduino Tutorial 3 | How to solve if you have trouble uploading to Arduino](Image00009.jpg)


    ## Troubleshooting Issues with Arduino


    Although the Arduino is in general very easy to use, some users, however, still
    find it little bit hard to operate. This type of setback can usually be fixed
    with simple adjustment on the device. Below, we have looked at most common issues
    you may across when using Arduino, especially for first user, and how you can
    easily fix them.


    ### Issues with Serial Monitor


    Sometimes you may desire to use serial monitor. What this does is that it enables
    to send some data through serial port. In addition to this, it has over time Problems
    arise when you begin to see some strange things (at times may not even see anything
    all) when you view serial monitor. This usually occur when the right setting is
    not used. Using the same baud rate can fix this problem.


    ### Computer/IDE not Recogn by the Board


    The Arduino board not being able to recognise the computer or IDE is the most
    common issue encountered on the setup. This can arise as a result of two things:


    1. **Using USB Cable**: The USB cable you are using may not be compatible with
    the Arduino. This is because some USB cables are meant for charging smartphones
    instead of data transfer. It is generally advisable to use a USB cable that supports
    data transfer. This will make powering and programming your device very easy.

    2. **Board Drivers**: Although board drivers are normally detected automatically
    by your device, thus it makes automatic installation easy. However, the drivers
    may not be automatically recognised at times. In this case, there is need to install
    the drivers by yourself. These drivers come in different flavor depending the
    kind of Arduino board you are using.

    3. **Libraries/Header files missing**: There are cases where some of the codes
    copied from online and pasted on the Arduino IDE may not have necessary libraries
    already installed on your device. This often prompts an error message. This can
    easily be fixed by checking the Library Manager on your computer.


    ### Inability to Upload a Code


    This may be experienced as a result of:


    1. **Not using the Correct Settings for your Board**: When you are programming
    Arduino board, and the right settings for the Arduino IDE on that board are not
    used, there is a tendency you will not be able to upload any code to your Arduino.
    However, when the correct setting is in place, the code will smoothly upload.
    To fix this issue, you need to go to your Arduino IDE environment, then go to
    "Tool menus" to look for the type of board you are using. If you are unable to
    find the board type here, then go directly to "board manager" to add the type
    of board you are using to list.

    2. **Incorrect Code**: The Arduino IDE will continue to alert you whenever your
    code contains an error. This will usually show at the bottom of the IDE in a black
    box. This can be fixed by issuing the correct code. Otherwise, you can simply
    turn on the verbose output option in your IDE settings. Turning this on will offer
    you a great suggestion as writing your code before you upload and guide you when
    uploading any code of your choice.


    # FAQs


    ## FAQs


    Still not clear about some certain things you need answers to? Below, we have
    tried as much as possible to give the most suitable answers to some frequently
    asked questions concerning the Arduino.


    1. **Is the Arduino IDE different from the Arduino Web Editor (Online)?**: These
    two platforms, the Arduino IDE and the Arduino web editor primarily do the same
    thing which is providing you with an environment to write your code. However,
    the Arduino IDE needs to be downloaded on your device before you can use it, the
    Arduino web editor, on the other hand, allows you to do the same thing online
    without the need for you to download any Arduino software.

    2. **Which Board can I use if I decide to use the Arduino Web Editor?**: All types
    and models of Arduino boards have the Arduino web editor feature by default.

    3. **How do you power an Arduino?**: Different types of Arduino board come with
    different power requirement you can choose from. For instance, a 7-12V power adapter
    or a 5V USB connection can be used to power an Arduino Uno Rev3.

    4. **From where can I get the Arduino?**: Arduino is available on Amazon online
    store.

    5. **How can I connect an LCD with an Arduino?**: The input/output pins are the
    interfaces through which the Arduino can be connected to an LCD. The `Liquid Crystals`
    library is used to control the connected LCD screen. To use this library, look
    for it in the library manager and install it.

    6. **Can Arduino control many Servo Motors?**: In fact, the board is usually easy
    to support to support many Servo Motors.

