    # UNDERSTANDING ARDUINO

    A Beginner''s Guide With Realtime Insights And Tricks To Learn Arduino Programming

    By. John C. Richards


    ## Table of Contents

    - [Why is it Advantageous to Use Arduino]

    - [Arduino Boards (Types)]

    - [How to Connect your Arduino to a Computer]

    - [The Arduino Mega Server]

    - [Programming Languages that Arduino Use]

    - [The Arduino Integrated Development Environment]

    - [Some of the Arduino Projects that You can Attempt]

    - [Troubleshooting Issues with Arduino]

    - [FAQs]

    - [CONCLUSION]


    ## INTRODUCTION


    ### What is Arduino?

    Arduino is a programmable multi-purpose electronic platform with its hardware
    and software designed to run in an open-source environment. The Arduino project
    started at Ivrea Interaction Design Institute in Italy, born out of the need to
    have a fast and easy to use prototyping device.


    The Arduino group is incharge of manufacturing and designing the single-board
    microcontrollers and microcontroller kits capable of building up various digital
    devices. The presence of input and output pins that can be interfaced with various
    other expansions on Arduino boards provides prototyping ability for this device.


    To the non-technically oriented segments of our population, electronics and programming
    may sound complicated but no cause for alarm because Arduino was initially developed
    particularly for people with zero formal knowledge in electronics and programming
    in mind. However, even in this present age, the use of this indispensable gadget
    does not require special skills in electronics and programming. Thus, anyone from
    hobbyist, artists, designers, hackers, newbies, gamers, to technical experts can
    use various architectures of Arduino that uniquely suit their individual purposes.


    Arduino as a micro computer mainly comprises of hardware and software parts, where
    its hardware come under a `CC-BY-SA` license, and the software has the license
    of the GNU Lesser General Public License (`LGPL`). Hence, it gives third-party
    companies the privilege to manufacture and distribute Arduino boards and software
    as long as the open-source licensing rights are followed.


    The Arduino boards are built with different serial communications interfaces that
    can be connected to a computer to make programming easy on the board using a simplified
    Arduino integrated development environment (`IDE`), as well as a command-line
    tool.


    Arduino board has become a useful tool to solve and manage day-to-day tasks at
    various level of difficulty as a result of constant advancement and evolution
    it has passed through over time. This is due in fact to how it has distinguished
    its designs from the more traditional 8-bit boards. The Arduino board has till
    this day been used for top-notch innovative technologies such as 3D printing,
    Cloud computing, embedded environment, IoT applications and wearable device.


    Now Arduino can help us manage and control most of our complex daily tasks such
    as LEDs, Motors, the internet, speakers, automated locks, cameras, drones, GPS
    units, our smartphones since it is designed with the ability to interact with
    them and many more.


    For anyone passionate about creating an interactive environment or gadget, the
    good news is that the Arduino projects are designed for this purpose for you to
    exploit your world. It may interest you that there is no limitation to what can
    be created, from building a personalised heating pad hand-warming blankets to
    having your own fortune-telling machine. If you can dream it you can create it
    with Arduino boards, virtually anything can be created.


    Most of the Arduino boards are typically based on Atmel 8-bit AVR microcontroller.
    In contrast, few recent boards are built using higher configuration. They can
    be distinguished by how connection for programming is carried out and the incorporation
    into other external circuits with type and amount of flash memory, pins, and features,
    present or absent of single roll, double roll pins or female headers.


    ## Why is Arduino Popular?

    The Arduino projects generally gain constant admiration in the global space among
    its users and non-users alike. This popularity can be credited to several distinctive
    factors and unique features that come with each Arduino boards. The following
    reasons are some among the numerous reasons why most users choose to stick with
    Arduino devices.


    - **Easy Installation**: Arduino is built with features that allow very easy installation
    process. This is made possible because the Arduino boards come with USB port onboard.
    It becomes a lot easier to install Arduino software with this unique port.

    - **The Ease of Use**: The Arduino is preferred by many newbies since it can be
    picked and used with other devices that do not require any special skill in programming,
    and no new set of instructions in the form of code can be passed onto the board.
    Also, no external hardware is required to perform many simple activities with
    Arduino.

    - **Simple Programming Language**: Even though one needs to still programme the
    device to carry out a particular function, the Arduino `IDE` is written in a simplified
    `C++` programming language. This programming language is one of the easiest which
    makes the device a lot simple to work with.

    - **Relatively Cheaper Access**: Since Arduino projects is an open-source platform,
    this made their software free and relatively cheap hardware. Thus, many of its
    users feel very comfortable and honored to contribute their knowledge of coding
    and programming to Arduino-based projects to enhance better accessibility.

    - **Good Back-up**: As a matter of fact, programme loading from personal computers
    are done on most models of this device. This is achieved by using the standard
    `API`, which is referred to as the "Arduino language". Hence, Arduino devices
    serve a great purpose as a system of back up for almost all electronics equipment.

    - **Replaceable Processor**: As small as the boards are in sizes, Arduino creates
    room for easy and quick replacement of its onboard processor if it is detected
    to be faulty. This makes Arduino boards preferred options when considering easy
    maintenance and part replacement.

    - **Speed of Communication**: In modern technology, speed is a major factor to
    consider when making choices of devices. This is the main reason many users like
    Arduino because its boards are known for their speed. Arduino has the floor when
    it comes to fast communication speed with a personal computer. This is to ensure
    a smooth exchange of information between Arduino and any PC.


    Suppose you wish to try out some simple projects with the Arduino and you are
    not sure of how or where to get it, the Arduino official company website always
    has the products available and from other authorised electronics outlets.


    ## CHAPTER ONE

    ![Pros And Cons Of Using Arduino](Image00002.jpg)


    ### Why is it Advantageous to Use Arduino

    Arduino comes with several great features which make it a preferred choice by
    many users, most especially beginners who usually view it as a tool that can be
    employed to control most of the electronic devices. These among others are the
    merits of using Arduino;


    - **Boot loader makes loading programs**: Hardware programmers can conveniently
    load programs directly on Arduino devices without the need to burn it on another
    storage device. This is made possible by the boot loader onboard which dumps programs
    on the circuit.

    - **Cheaper Cost**: Arduino was created to be affordable by all comparative with
    other similar devices. From $50 upwards, one can get most of the development boards
    in the market. With about $30, Arduino can be bought $30 without any compromise
    as far as pricing is concerned.

