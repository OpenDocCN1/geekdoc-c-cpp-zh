    Example: `int arr[2][3][4][5];` This could represent 2 groups, each containing
    3 sets of 3D arrays with 4 rows and 5 columns each.


    Higher-Dimensional Arrays


    Concept: Arrays can theoretically have any number of dimensions, but in practice,
    arrays with more than three or four dimensions are rare. They are used in highly
    specialized applications like certain scientific computations or complex data
    models.


    Usage Complexity: As the number of dimensions increases, the complexity of managing
    and understanding the array also increases. High-dimensional arrays can be challenging
