    Chapter 14: Network Programming in C


    # Basics of Network Programming


    Network programming in C is an essential aspect of creating applications that
    communicate across networks. This encompasses the development of both client and
    server applications that can send and receive data over the Internet or other
    networks.


    # Introduction to Network Programming


    Role in Software Development:


    Network programming is key to developing software that can interact over a network,
    including web servers, chat applications, distributed systems, and more.


    Socket Programming:


    The cornerstone of network programming in C is socket programming. Sockets provide
    the communication mechanism between two computers using TCP or UDP.


    Cross-Platform Considerations:


    While the core concepts of network programming are consistent across platforms,
    certain implementations can vary between UNIX/Linux and Windows systems.


    # Networking Concepts


    IP Addresses:


    These are unique identifiers assigned to each machine on a network. In IPv4, it’s
    a 32-bit number, and in IPv6, it’s a 128-bit number.


    Ports:


    A port is a numerical value used to differentiate applications/services on a single
    machine. For example, HTTP typically uses port 80.


    TCP/IP Model:


    The Transmission Control Protocol/Internet Protocol (TCP/IP) model is the foundational
    framework for data transmission over the network. TCP is used for connection-oriented
    transmissions, ensuring data integrity, while UDP is used for connectionless transmissions,
    allowing faster but less reliable communication.


    Client-Server Architecture:


    A common pattern where "server" software provides services to "client" software.
    Clients initiate requests to servers, and servers respond to those requests.


    Example: A Simple TCP Server and Client in C


    A basic example of a TCP server and client in C will illustrate how these components
    interact:


    TCP Server:


    #include <stdio.h>


    #include <sys/socket.h>


    #include <netinet/in.h>


    #include <string.h>


    int main() {


        int server_fd, new_socket;


        struct sockaddr_in address;


        int opt = 1;


        int addrlen = sizeof(address);


        // Creating socket file descriptor


        server_fd = socket(AF_INET, SOCK_STREAM, 0);


        // Forcefully attaching socket to the port 8080


        setsockopt(server_fd, SOL_SOCKET, SO_REUSEADDR | SO_REUSEPORT, &opt, sizeof(opt));


        address.sin_family = AF_INET;


        address.sin_addr.s_addr = INADDR_ANY;


        address.sin_port = htons(8080);


        // Bind the socket to the network address and port


        bind(server_fd, (struct sockaddr *)&address, sizeof(address));


        // Listen for connections


        listen(server_fd, 3);


        // Accept a connection


        new_socket = accept(server_fd, (struct sockaddr *)&address, (socklen_t*)&addrlen);


        // Interaction with client...


        return 0;


    }


    TCP Client:


    #include <stdio.h>


    #include <sys/socket.h>


    #include <netinet/in.h>


    #include <string.h>


    #include <arpa/inet.h>


    int main() {


        int sock = 0;


        struct sockaddr_in serv_addr;


        // Creating the socket


        sock = socket(AF_INET, SOCK_STREAM, 0);


        serv_addr.sin_family = AF_INET;


        serv_addr.sin_port = htons(8080);


        // Convert IPv4 and IPv6 addresses from text to binary form


        inet_pton(AF_INET, "127.0.0.1", &serv_addr.sin_addr);


        // Connect to the server


        connect(sock, (struct sockaddr *)&serv_addr, sizeof(serv_addr));


        // Send and receive data


    ...


        char *hello = "Hello from client";


        send(sock, hello, strlen(hello), 0);


        printf("Hello message sent\n");


        char buffer[1024] = {0};


        read(sock, buffer, 1024);


        printf("Server: %s\n", buffer);


        return 0;


    }


    In these examples:


    TCP Server:


    - Creates a socket and binds it to a port (8080 in this case).


    - Listens for connections and accepts a client connection.


    - Once a client is connected, it can read from and write to the client.


    TCP Client:


    - Creates a socket and connects to the server (in this case, `127.0.0.1` on port
    8080).


    - Sends a message to the server and waits for a response.


    Network programming in C is a fundamental skill for developing a wide range of
    applications that require communication over networks. Understanding the basics
    of networking, including IP addresses, ports, TCP/IP model, and client-server
    architecture, is crucial. The ability to implement both server and client applications
    using sockets forms the core of network programming in C. This knowledge is essential
    for building everything from simple network utilities to complex distributed systems.


    # Socket Programming in C


    # Understanding Sockets


    In network programming, a socket acts as an endpoint for sending and receiving
    data across a network. It''s a fundamental concept in creating network applications
    in C, bridging the gap between network communication and programming.


    # Creating Sockets


    Socket Creation:


    - The `socket()` function is used to create a socket, specifying the communication
    domain, type, and protocol.


    - The communication domain (`AF_INET` for IPv4, `AF_INET6` for IPv6) specifies
    the network protocol.


    - The socket type (`SOCK_STREAM` for TCP, `SOCK_DGRAM` for UDP) dictates the communication
    semantics.


    - The protocol argument is usually set to 0, allowing the OS to choose the appropriate
    protocol (TCP for `SOCK_STREAM`, UDP for `SOCK_DGRAM`).


    Socket Descriptor:


    The function returns a socket descriptor, a handle that is used for further socket
    operations like binding, listening, connecting, sending, and receiving data.


    Example: Creating a Socket


    Here''s a basic example of creating a TCP socket:


    #include <sys/types.h>


    #include <sys/socket.h>


    int main() {


        int sockfd;


        sockfd = socket(AF_INET, SOCK_STREAM, 0);


        if (sockfd < 0) {


            perror("Error creating socket");


            return -1;


        }


        // Additional socket operations...


        return 0;


    }


    # Connecting Sockets


    Server-Side Operations:


    - Binding: The `bind()` function associates the socket with a specific IP address
    and port number.


    - Listening: The `listen()` function enables the socket to listen for incoming
    connections.


    - Accepting: The `accept()` function is used to accept an incoming connection.


    Client-Side Operations:


    Connecting: The `connect()` function is used by the client to establish a connection
    with the server.


    Example: Server and Client Connection


    Server Side:


    int server_fd;


    struct sockaddr_in address;


    int opt = 1;


    int addrlen = sizeof(address);


    // Creating socket file descriptor


    server_fd = socket(AF_INET, SOCK_STREAM, 0);


    // Forcefully attaching socket to the port


    setsockopt(server_fd, SOL_SOCKET, SO_REUSEADDR | SO_REUSEPORT, &opt, sizeof(opt));


    address.sin_family = AF_INET;


    address.sin_addr.s_addr = INADDR_ANY;


    address.sin_port = htons(PORT);


    // Bind the socket to the network address and port


    bind(server_fd, (struct sockaddr *)&address, sizeof(address));


    // Listen for connections


    listen(server_fd, 3);


    // Accept a connection


    int new_socket = accept(server_fd, (struct sockaddr *)&address, (socklen_t*)&addrlen);


    Client Side:


    int sock = 0;


    struct sockaddr_in serv_addr;


    // Creating the socket


    sock = socket(AF_INET, SOCK_STREAM, 0);


    serv_addr.sin_family = AF_INET;


    serv_addr.sin_port = htons(PORT);


    // Convert IPv4 and IPv6 addresses from text to binary form


    inet_pton(AF_INET, "127.0.0.1", &serv_addr.sin_addr);


    // Connect to the server


    connect(sock, (struct sockaddr *)&serv_addr, sizeof(serv_addr));


    Socket programming is integral to network communication in C. Understanding how
    to create and manage sockets, as well as perform operations like binding, listening,
    connecting, and accepting connections, is key to developing network applications.
    This fundamental knowledge lays the groundwork for building sophisticated client-server
    applications in the C programming language.


    # Creating Client-Server Applications


    Client-server architecture is a common pattern in network programming where the
    server provides services and the client consumes them. In C, this involves setting
    up sockets for communication, listening, and connecting to these sockets.


    # Building a Simple Server


    Setting Up a Listening Socket:


    The server sets up a socket that listens for incoming client requests. This involves
    creating a socket, binding it to an address and a port, and then listening for
    connections.


    Accepting Connections:


    The server uses `accept()` to accept incoming connections from clients. This call
    typically blocks until a client connects.


    Handling Client Requests:


    Once a connection is established, the server can read from or write to the socket
    to communicate with the client.


    Example: Basic Server Setup


    #include <stdio.h>


    #include <sys/socket.h>


    #include <netinet/in.h>


    #include <string.h>


    #define PORT 8080


    int main() {


        int server_fd, new_socket;


        struct sockaddr_in address;


        int opt = 1;


        int addrlen = sizeof(address);


        server_fd = socket(AF_INET, SOCK_STREAM, 0);


        setsockopt(server_fd, SOL_SOCKET, SO_REUSEADDR | SO_REUSEPORT, &opt, sizeof(opt));


        address.sin_family = AF_INET;


        address.sin_addr.s_addr = INADDR_ANY;


        address.sin_port = htons(PORT);


        bind(server_fd, (struct sockaddr *)&address, sizeof(address));


        listen(server_fd, 3);


        new_socket = accept(server_fd, (struct sockaddr *)&address, (socklen_t*)&addrlen);


        // Handle client requests...


        return 0;


    }


