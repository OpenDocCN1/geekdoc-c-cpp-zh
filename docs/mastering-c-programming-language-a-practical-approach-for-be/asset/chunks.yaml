    n\");\n    BFS(graph, 0);\n    return 0;\n}\n```\n\nIn this `main` function, we\
    \ create and manipulate a binary tree and a graph. We perform an in-order traversal\
    \ of the binary tree and a BFS traversal of the graph starting from vertex 0.\n\
    \nThis example demonstrates basic operations on binary trees and graphs, two fundamental\
    \ data structures in computer science. In practice, these structures and their\
    \ operations can become much more complex, especially in real-world applications.\n\
    \n# Advanced Data Structures\n\n## Hash Tables\n\nHash tables are a highly efficient\
    \ data structure for storing and retrieving data. They work on the principle of\
    \ key-value pairing and use a hash function to compute an index where values are\
    \ stored.\n\n### Key-Value Pair\nIn a hash table, data is stored as key-value\
    \ pairs. The key is used to compute the storage index using a hash function.\n\
    \n### Hash Function\nA hash function takes a key and computes an index in the\
    \ array (or bucket) where the value should be stored or retrieved. A good hash\
    \ function distributes keys uniformly across the buckets, minimizing collisions.\n\
    \n### Handling Collisions\nCollisions occur when different keys hash to the same\
    \ index. They are typically handled by techniques like chaining (using linked\
    \ lists at each index) or open addressing (finding another index).\n\n### Efficiency\n\
    When implemented well, hash tables provide very fast retrieval, close to `O(1)`\
    \ time complexity for search, insert, and delete.\n\n### Use Cases\nHash tables\
    \ are widely used in database indexing, caching, and any scenario where rapid\
    \ lookup is essential.\n\n## Heaps\n\nHeaps are specialized tree-based data structures\
    \ that satisfy the heap property. They are widely used in implementing priority\
    \ queues, heap sort, and efficient algorithms.\n\n### Heap Property\nIn a max\
    \ heap, for every node `i` other than the root, the value of `i` is less or equal\
    \ to the value of its parent. Min heaps are the opposite.\n\n### Binary Heap\n\
    Binary heaps are commonly used and are complete trees. They can be efficiently\
    \ represented using arrays. In an array, if the parent is at index `p`, the left\
    \ child is at `2p + 1` and the right child is at `2p + 2`.\n\n### Basic Operations\n\
    - **Insertion**: Insert new elements at the end then `heapify` the tree to maintain\
    \ the heap property.\n- **Deletion/Extract Max**: Remove the root and replace\
    \ it with the last element in the heap, followed by heapifying the tree.\n- **Heapify**:\
    \ Process of rearranging the heap to maintain the heap property.\n\n### Heap Sort\n\
    Heaps can be used to implement an efficient algorithm known as heap sort. It involves\
    \ building a heap from the input data and repeatedly extracting the maximum (or\
    \ minimum) element and rebuilding the heap.\n\n### Priority Queues\nPriority queues,\
    \ where elements are processed based on their priority, are efficiently implemented\
    \ using heaps.\n\n### Efficiency\nHeaps provide `O(log n)` time complexity for\
    \ insertions, and `O(n log n)` for heap sort. Both hash tables and heaps are powerful\
    \ data structures that offer efficient solutions for specific problems. Hash tables\
    \ excel in scenarios requiring rapid access to data, while heaps are ideal for\
    \ tasks that need to manage data in a specific sorted order. Mastery of these\
    \ data structures is essential for solving complex problems and optimizing the\
    \ performance of algorithms.\n\n## Hash Examples\n\n### 1. Hash Table and Hash\
    \ Function\n```c\n#define TABLE_SIZE 100\ntypedef struct node {\n    int key;\n\
    \    int value;\n    struct node *next;\n} node;\n\ntypedef struct hashtable {\n\
    \    node *array[TABLE_SIZE];\n} hashtable;\n\nint hashFunction(int key) {\n \
    \   return key % TABLE_SIZE;\n}\n```\n\n### 2. Inserting a Key-Value Pair\n```c\n\
    void insert(hashtable *ht, int key, int value) {\n    int index = hashFunction(key);\n\
    \    node *newNode = (node*) malloc(sizeof(node));\n    newNode->key = key;\n\
    \    newNode->value = value;\n    newNode->next = ht->array[index];\n    ht->array[index]\
    \ = newNode;\n}\n```\n\n### 3. Searching for a Value by Key\n```c\nint search(hashtable\
    \ *ht, int key) {\n    int index = hashFunction(key);\n    node *list = ht->array[index];\n\
    \    while (list) {\n        if (list->key == key) {\n            return list->value;\n\
    \        }\n        list = list->next;\n    }\n    return -1; // Not found\n}\n\
    ```\n\n## Heaps Examples\n\n### 1. Heap Structure\n```c\n#define MAX_SIZE 100\n\
    typedef struct {\n    int items[MAX_SIZE];\n    int size;\n} Heap;\n```\n\n###\
    \ 2. Inserting an Element\n```c\nvoid heapifyUp(Heap *heap, int index) {\n   \
    \ int parentIndex = (index - 1) / 2;\n    if (heap->items[parentIndex] < heap->items[index])\
    \ {\n        // Swap\n        int temp = heap->items[parentIndex];\n        heap->items[parentIndex]\
    \ = heap->items[index];\n        heap->items[index] = temp;\n        heapifyUp(heap,\
    \ parentIndex);\n    }\n}\n\nvoid insertHeap(Heap *heap, int value) {\n    heap->items[heap->size]\
    \ = value;\n    heapifyUp(heap, heap->size);\n    heap->size++;\n}\n```\n\n###\
    \ 3. Removing the Max (Root of the Heap)\n```c\nvoid heapifyDown(Heap *heap, int\
    \ index) {\n    int leftChildIndex = 2 * index + 1;\n    int rightChildIndex =\
    \ 2 * index + 2;\n    int largest = index;\n\n    if (leftChildIndex < heap->size\
    \ && heap->items[leftChildIndex] > heap->items[largest]) {\n        largest =\
    \ leftChildIndex;\n    }\n    if (rightChildIndex < heap->size && heap->items[rightChildIndex]\
    \ > heap->items[largest]) {\n        largest = rightChildIndex;\n    }\n    if\
    \ (largest != index) {\n        // Swap\n        int temp = heap->items[index];\n\
    \        heap->items[index] = heap->items[largest];\n        heap->items[largest]\
    \ = temp;\n        heapifyDown(heap, largest);\n    }\n}\n\nint removeMax(Heap\
    \ *heap) {\n    int maxItem = heap->items[0];\n    heap->items[0] = heap->items[--heap->size];\n\
    \    heapifyDown(heap, 0);\n    return maxItem;\n}\n```\n\nIn these examples,\
    \ for hash tables, we used a simple array of linked lists to handle collisions,\
    \ and for heaps, we used an array-based representation, which is efficient and\
    \ common for binary heaps. These implementations serve as basic examples and can\
    \ be expanded for more complex scenarios and improved performance.\n\n# Summary\n\
    \nThis chapter provided an overview of various data structures used in C programming,\
    \ their implementation, and applications. Understanding these structures is key\
    \ to developing efficient algorithms and managing complex data.\n\n# Exercises\n\
    \n1. Implement a singly linked list and perform basic operations like insertion\
    \ and deletion.\n2. Create a stack and perform push and pop operations.\n3. Write\
    \ a program to represent a graph using an adjacency list and perform a depth-first\
    \ search.\n"
