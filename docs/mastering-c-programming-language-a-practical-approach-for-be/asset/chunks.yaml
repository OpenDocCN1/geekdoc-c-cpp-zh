    Chapter 3: Control Structures in C


    # Introduction to Control Structures


    # What Are Control Structures? 


    Control structures are the building blocks of programming that guide the flow
    of execution. In C, they are used to make decisions, repeat actions, and manage
    the program''s execution path. Effective use of control structures is crucial
    for creating dynamic and responsive programs.


    # Types of Control Structures 


    C offers several types of control structures, broadly categorized into:


    Sequential: The default mode, executing code line by line.


    Selection: Used for decision-making, including `if`, `else`, `else-if`, and `switch`
    statements.


    Iteration: For repeating actions, using loops like `for`, `while`, and `do-while`.


    # Conditional Statements (`if`, `else`)


    # Using the `if` Statement 


    As discussed in chapter 2, the `if` statement evaluates a condition and, if true,
    executes the associated block of code. It''s the simplest form of decision-making
    in C.


    int number = 10;


    if (number > 0) {


        printf("The number is positive.\n");


    }


    Here, the program checks if `number` is greater than 0 and prints a message if
    true.


    # The `else` and `else if` Ladder 


    As discussed in chapter 2 , an `else` statement executes when the `if` condition
    is false. The `else if` allows for multiple conditions to be tested in sequence.


    if (number > 0) {


        printf("Positive\n");


    } else if (number < 0) {


        printf("Negative\n");


    } else {


        printf("Zero\n");


    }


    This code classifies `number` as positive, negative, or zero.


    # Nested `if` Statements


    Nested `if` statements provide a way to check for multiple conditions within a
    branc


    if (number != 0) {


        if (number > 0) {


            printf("Positive\n");


        } else {


            printf("Negative\n");


        }


    } else {


        printf("Zero\n");


    }


    The example demonstrates nested `if` statements to further categorize the number.


    # Switch Case


    As introduced in the previous chapter, the `switch` statement allows for multi-way
    branching using a single variable''s value. It''s more streamlined than multiple
    `if-else` statements for certain scenarios.


    switch (number) {


        case 1:


            printf("One\n");


            break;


        case 2:


            printf("Two\n");


            break;


        default:


            printf("Other\n");


    }


    Here, different cases are executed based on the value of `number`.


    # Loops (for, while, do-while)


    # The `for` Loop


    The `for` loop is ideal when the number of iterations is known. It consists of
    initialization, condition, and increment/decrement expression.


    for (int i = 1; i <= 5; i++) {


        printf("%d\n", i);


    }


    This loop prints numbers from 1 to 5.


    # The `while` Loop


    A `while` loop is used when the number of iterations isn''t known beforehand.
    It checks the condition before each iteration.


    int i = 1;


    while (i <= 5) {


        printf("%d\n", i);


        i++;


    }


    This loop also prints numbers from 1 to 5, but using a `while` loop.


    # The `do-while` Loop


    The `do-while` loop ensures the loop''s body is executed at least once, as the
    condition is checked after the loop''s execution.


    int i = 1;


    do {


        printf("%d\n", i);


        i++;


    } while (i <= 5);


    Even if `i` is initially greater than 5, the loop body will execute once.


    # Break and Continue


    # Using `break`


    The `break` statement immediately exits a loop or switch case. It''s useful for
    terminating the loop in response to a specific condition.


    for (int i = 1; i <= 5; i++) {


        if (i == 3) break;


        printf("%d\n", i);


    }


    This loop stops executing when `i` becomes 3.


    # Using `continue`


    The `continue` statement skips the current iteration and proceeds to the next
    iteration of the loop.


    for (int i = 1; i <= 5; i++) {


        if (i == 3) continue;


        printf("%d\n", i);


    }


    Here, the loop skips the number 3 and continues with the next iteration.


    # Nested Loops


    Nested loops involve placing one loop inside another. They are often used for
    multi-dimensional data structures, like arrays or matrices.


    for (int i = 1; i <= 3; i++) {


        for (int j = 1; j <= 3; j++) {


            printf("%d %d\n", i, j);


        }


    }


    This example generates pairs of numbers, iterating through each combination of
    `i` and `j`.


    # Alternative to Traditional `If-Else` Statements.


    # Ternary Operator


    The ternary operator in C, denoted as `? :`, is a concise way to perform a conditional
    check within a single line. It takes three operands: a condition, a result for
    when the condition is true, and a result for when it''s false. The syntax is `condition
    ? expression1 : expression2`. If the condition is true, `expression1` is executed;
    otherwise, `expression2` is executed.


    Here''s a simple example of using the ternary operator in C:


    #include <stdio.h>


    int main() {


        int a = 5, b = 10;


        // Using the ternary operator to find the maximum of a and b


        int max = (a > b) ? a : b;


        printf("The greater number is %d\n", max);


        return 0;


    }


    In this example, the ternary operator is used to compare `a` and `b`. It checks
    the condition `a > b`, and if true, `a` is assigned to `max`. Otherwise, `b` is
    assigned to `max`. The program then prints out the greater of the two numbers.
    This is a practical way to demonstrate the use of the ternary operator for a simple
    condition-based assignment.


    # Summary


    In this chapter, we delved into control structures, an essential part of programming
    in C. Understanding these structures enables you to create programs with complex
    logic and behaviors. We covered conditional statements for decision-making, loops
    for repetitive tasks, and learned how to effectively manage the flow of a program.


    # Exercises


    1\. Write a program that uses nested `if` statements to check if a number is positive,
    even, and greater than 10.


    2\. Use a `for` loop to create a program that prints the first 10 Fibonacci sequence
    numbers.


    3\. Create a program that uses nested loops to display a 5x5 grid of asterisks.


    This chapter provides a thorough understanding of control structures, crucial
    for crafting effective C programs. As we progress, these concepts will form the
    foundation for more advanced programming techniques.


    Chapter 4: Functions in C


    # Introduction to Functions


    # What are Functions?


    In programming, functions are self-contained blocks of code that perform a specific
    task. They are fundamental in structuring and organizing C programs, allowing
    for code to be broken down into manageable, reusable parts.


    # Benefits of Using Functions 


    Functions offer several advantages:


    Modularity: Breaking down complex processes into smaller sections.


    Reusability: Enabling code to be reused across different parts of a program or
    in different programs.


    Improved Readability: Making the code more organized and readable.


    # Defining Functions


    # Basic Structure of a Function 


    A function in C typically consists of a return type, a function name, parameters
    (if any), and a body enclosed in braces. Here''s the basic syntax:


    returnType functionName(parameter1, parameter2, ...) {


        // function body


        // return statement (if returnType is not void)


    }


    # Writing Your First Function 


    Let''s write a simple function that adds two numbers:


    int add(int num1, int num2) {


        return num1 + num2;


    }


    This function, named `add`, takes two integer parameters and returns their sum.


    # Function Arguments and Return Types


    # Passing Arguments to Functions 


    Arguments can be passed to functions by value or by reference. In C, the default
    is pass-by-value, where a copy of the argument is passed.


    int result = add(5, 10); // Passing values 5 and 10


    # Return Types and Values 


    Functions can return values of various types, or `void` if no value is returned.
    The `return` statement is used to return a value from a function.


    return result;


