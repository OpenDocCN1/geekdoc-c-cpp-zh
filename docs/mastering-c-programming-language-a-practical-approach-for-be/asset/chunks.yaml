  trans: "\n\n```c\n    // 对于无向图，同样从 dest 到 src 添加一条边\n    graph->adjLists[dest][src]\
    \ = 1;\n}\n```\n\n在此函数中，我们更新了邻接列表以反映 `src`（源节点）和 `dest`（目标节点）之间的连接。由于这是针对无向图的，我们在两个方向上都添加了边。\n\
    \n# 使用函数\n\n现在，让我们看看如何在简单的示例中使用这些函数。\n\n## 主函数\n\n```c\nint main() {\n    // 二叉树的示例用法\n\
    \    TreeNode* root = NULL;\n    root = insert(root, 10);\n    insert(root, 5);\n\
    \    insert(root, 15);\n    insert(root, 7);\n    printf(\"In-Order Traversal\
    \ of Binary Tree: \");\n    inOrderTraversal(root);\n    printf(\"\\n\");\n\n\
    \    // 图的示例用法\n    Graph* graph = createGraph(5);\n    addEdge(graph, 0, 1);\n\
    \    addEdge(graph, 0, 4);\n    addEdge(graph, 1, 2);\n    addEdge(graph, 1, 3);\n\
    \    addEdge(graph, 1, 4);\n    addEdge(graph, 2, 3);\n    addEdge(graph, 3, 4);\n\
    \    printf(\"BFS Traversal starting from vertex 0:\\n\");\n    BFS(graph, 0);\n\
    \    return 0;\n}\n```\n\n在这个 `main` 函数中，我们创建并操作了一个二叉树和一个图。我们对二叉树进行了中序遍历，并从顶点\
    \ 0 开始对图进行了广度优先 own（BFS）。\n\n这个示例演示了二叉树和图的基本操作，这是计算机科学中两种基础数据结构。在实践中，这些结构及其操作可能会变得复杂得多，特别是在实际应用中。\n\
    \n# 高级数据结构\n\n## 哈希表\n\n哈希表是一种存储和检索数据的高效数据结构。它们基于键值对原理工作，并使用哈希函数来计算存储值的索引。\n\n\
    ### 键值对\n在哈希表中，数据以键值对的形式存储。键用于通过哈希函数计算存储索引。\n\n### 哈希函数\n哈希函数接收一个键，并在数组（或桶）中计算应存储或检索该值的索引。一个良好的哈希函数会将键均匀地分布在各个桶中，从而尽地减少冲突。\n\
    \n### 冲突处理\n当不同的键哈希到相同的索引时，就会发生冲突。通常通过链链法（在每个索引处使用链表）或开放寻址法（寻找另一个索引）等技术处理。\n\n\
    ### 效率\n如果实现良好，哈希表提供了非常快的检索速度，搜索、插入和删除的时间复杂度接近 `O(1)`。\n\n### 用例\n哈希表广泛应用于数据库索引、缓存以及任何对快速查找至关重要的场景。\n\
    \n## 堆\n\n堆是特殊的基于树的数据结构，满足堆的属性。它们被广泛用于实现优先级队列、堆排序和高效算法。\n\n### 堆属性\n在最大堆中，对于除根节点以外的每个节点\
    \ `i`，`i` 的值小于或等于其父节点的值。最小堆则相反。\n\n### 二叉堆\n二叉堆是常用的二堆类型，它们是完全树。它们可以使用数组高效地表示。在数组中，如果父节点位于索引\
    \ `p`，则左孩子位于 `2p + 1`，右孩子位于 `2p + 2`。\n\n### 基本操作\n- **插入**：将新元素插入到末尾，然后对树进行 `heapify`\
    \ 以维护堆属性。\n- **删除/提取最大值**：移除根节点并用堆中的最后一个元素替换，然后对树进行堆化。\n- **堆化 (Heapify)**：重新排列堆以维护堆属性的过程。\n\
    \n### 堆排序\n堆可以实现名为堆排序的高效算法。它涉及从输入数据构建堆，并反复提取最大（或最小）元素并重建堆。\n\n### 优先级队列\n优先级队列根据元素的优先级来处理元素，可以使用堆高效实现。\n\
    \n### 效率\n堆提供的插入提供 `O(log n)` 的时间复杂度，堆排序提供 `O(n log n)` 的复杂度。哈希表和堆都是强大的数据结构，为特定问题提供了高效的解决方案。哈希表在需要快速访问数据的场景中表现出色，而堆则是需要按特定排序顺序管理数据的理想选择。掌握这些数据结构对于解决复杂问题和优化算法性能至关重要。\n\
    \n## 哈希示例\n\n### 1. 哈希表与哈希函数\n```c\n#define TABLE_SIZE 100\ntypedef struct node\
    \ {\n    int key;\n    int value;\n    struct node *next;\n} node;\n\ntypedef\
    \ struct hashtable {\n    node *array[TABLE_SIZE];\n} hashtable;\n\nint hashFunction(int\
    \ key) {\n    return key % TABLE_SIZE;\n}\n```\n\n### 2. 插入键值对\n```c\nvoid insert(hashtable\
    \ *ht, int key, int value) {\n    int index = hashFunction(key);\n    node *newNode\
    \ = (node*) malloc(sizeof(node));\n    newNode->key = key;\n    newNode->value\
    \ = value;\n    newNode->next = ht->array[index];\n    ht->array[index] = newNode;\n\
    }\n```\n\n### 3. 通过键查找值\n```c\nint search(hashtable *ht, int key) {\n    int index\
    \ = hashFunction(key);\n    node *list = ht->array[index];\n    while (list) {\n\
    \        if (list->key == key) {\n            return list->value;\n        }\n\
    \        list = list->next;\n    }\n    return -1;\n}\n```\n\n## 堆示例\n\n### 1.\
    \ 堆结构\n```c\n#define MAX_SIZE 100\ntypedef struct {\n    int items[MAX_SIZE];\n\
    \    int size;\n} Heap;\n```\n\n### 2. 插入元素\n```c\nvoid heapifyUp(Heap *heap,\
    \ int index) {\n    int parentIndex = (index - 1) / 2;\n    if (index > 0 && heap->items[parentIndex]\
    \ < heap->items[index]) {\n        int temp = heap->items[parentIndex];\n    \
    \    heap->items[parentIndex] = heap->items[index];\n        heap->items[index]\
    \ = temp;\n        heapifyUp(heap, parentIndex);\n    }\n}\n\nvoid insertHeap(Heap\
    \ *heap, int value) {\n    heap->items[heap->size] = value;\n    heapifyUp(heap,\
    \ heap->size);\n    heap->size++;\n}\n```\n\n### 3. 删除最大值（堆顶）\n```c\nvoid heapifyDown(Heap\
    \ *heap, int index) {\n    int leftChildIndex = 2 * index + 1;\n    int rightChildIndex\
    \ = 2 * index + 2;\n    int largest = index;\n\n    if (leftChildIndex < heap->size\
    \ && heap->items[leftChildIndex] > heap->items[largest]) {\n        largest =\
    \ leftChildIndex;\n    }\n    if (rightChildIndex < heap->size && heap->items[rightChildIndex]\
    \ > heap->items[largest]) {\n        largest = rightChildIndex;\n    }\n    if\
    \ (largest != index) {\n        int temp = heap->items[index];\n        heap->items[index]\
    \ = heap->items[largest];\n        heap->items[largest] = temp;\n        heapifyDown(heap,\
    \ largest);\n    }\n}\n\nint removeMax(Heap *heap) {\n    int maxItem = heap->items[0];\n\
    \    heap->items[0] = heap->items[--heap->size];\n    heapifyDown(heap, 0);\n\
    \    return maxItem;\n}\n```\n\n"
- fmt: "\nData structures form the backbone of effective algorithm development and\
    \ data management in C programming. With a solid understanding of these structures,\
    \ you can tackle complex programming challenges. Next, we'll move on to \"File\
    \ Handling in C.\"\n\n# Chapter 8: File Handling in C\n\nFile handling is a crucial\
    \ component of C programming, enabling programs to read from and write to files.\
    \ This capability is essential for many applications, especially those that need\
    \ to store or retrieve data persistently.\n\n## Basics of File Handling\n\nFile\
    \ handling in C involves several key operations, such as opening, reading, writing,\
    \ and closing files. It's essential for storing or retrieving data, whether in\
    \ a human-readable format (like text files) or in a machine-readable format (like\
    \ binary files).\n\n## Types of Files\n\nC supports two primary types of files:\n\
    \n1. **Text Files**:\n   - Store data in a format that is readable by humans.\n\
    \   - Commonly used for logs, configuration files, and text data.\n   - Easier\
    \ to debug and understand.\n\n2. **Binary Files**:\n   - Store data in a binary\
    \ format, directly readable by the machine.\n   - More efficient in terms of space\
    \ and read/write speed.\n   - Suitable for images, executable files, or custom\
    \ file formats.\n\n## Reading and Writing Files\n\n### Opening and Closing Files\n\
    \nFiles in C are accessed using file pointers. The `fopen` function is used to\
    \ open a file, and `fclose` is used to close it.\n\n```c\nFILE *file = fopen(\"\
    example.txt\", \"r\"); // Open a file for reading\nfclose(file); // Close the\
    \ file\n```\n\n### Reading from Files\n\nFunctions like `fscanf` and `fgets` are\
    \ used to read formatted data and strings from files, respectively.\n\n```c\n\
    char buffer[100];\nfile = fopen(\"example.txt\", \"r\");\nif (fgets(buffer, 100,\
    \ file) != NULL) {\n    printf(\"%s\", buffer); // Print the read string\n}\n\
    fclose(file);\n```\n\n### Writing to Files\n\nTo write data to files, functions\
    \ like `fprintf` and `fputs` are commonly used.\n\n```c\nfile = fopen(\"example.txt\"\
    , \"w\");\nfprintf(file, \"Hello, World!\\n\"); // Writing to a file\nfclose(file);\n\
    ```\n\n### Error Handling in File Operations\n\nAlways check the return values\
    \ of file operations to ensure success.\n\n```c\nif (file == NULL) {\n    perror(\"\
    Error opening file\");\n    return -1;\n}\n```\n\n## Advanced File Operations\
    \ and Modes\n\n### File Pointers and Seeking\n\nFunctions like `fseek`, `ftell`,\
    \ and `rewind` are used to move the file pointer around within a file.\n\n```c\n\
    file = fopen(\"example.txt\", \"r\");\nfseek(file, 0, SEEK_END); // Move to the\
    \ end of the file\nlong size = ftell(file); // Get the size of the file\nrewind(file);\
    \ // Move back to the start\nfclose(file);\n```\n\n### Reading and Writing Random\
    \ Access Files\n\nRandom access in files allows reading or writing data at any\
    \ position, which is particularly useful for binary files.\n\n### Modifying Existing\
    \ Files\n\nTo modify a file without erasing its contents, open it in a mode that\
    \ allows both reading and writing, such as \"r+\".\n\n```c\nfile = fopen(\"example.txt\"\
    , \"r+\");\nfputs(\"New content\", file);\nfclose(file);\n```\n\n### Working with\
    \ Binary Files\n\nBinary files are handled using `fread` and `fwrite` for reading\
    \ and writing binary data.\n\n```c\nchar binBuffer[1024];\nfile = fopen(\"example.bin\"\
    , \"rb\");\nfread(binBuffer, sizeof(binBuffer), 1, file); // Read binary data\n\
    fwrite(binBuffer, sizeof(binBuffer), 1, file); // Write binary data\nfclose(file);\n\
    ```\n\nFile handling in C is a versatile tool that allows for direct interaction\
    \ with the file system, enabling a wide range of applications from data storage\
    \ to processing binary data. Understanding these concepts and techniques is crucial\
    \ for any programmer working with C.\n\n# Advanced File Handling Techniques\n\n\
    Advanced file handling techniques in C, like file buffering and file locking,\
    \ are essential for enhancing performance and ensuring data integrity, especially\
    \ in complex applications or those involving concurrent access to files.\n\n##\
    \ File Buffering and Performance\n\nFile buffering is a technique used to improve\
    \ the efficiency of file operations. It involves storing data temporarily in a\
    \ buffer before reading or writing to a file. This can significantly enhance performance\
    \ by reducing the number of direct read/write operations to the file system.\n\
    \n**Buffered I/O:**\nStandard I/O functions in C, such as `fscanf`, `fprintf`,\
    \ `fgets`, and `fputs`, automatically use buffering. These functions store data\
    \ in a buffer and only perform file operations when the buffer is filled up, reducing\
    \ the number of I/O calls.\n\n**Controlling Buffering:**\nThe `setbuf` and `setvbuf`\
    \ functions allow you to control buffering for file streams. You can disable buffering\
    \ (set the buffer to `NULL`), set a specific size for the buffer, or change the\
    \ buffering mode (full buffering, line buffering, or no buffering).\n\n```c\n\
    FILE *file = fopen(\"example.txt\", \"r\");\nchar buffer[1024];\nsetvbuf(file,\
    \ buffer, _IOFBF, sizeof(buffer)); // Full buffering with a specific buffer size\n\
    // ... file operations ...\nfclose(file);\n```\n\n### File Locking\n\nFile locking\
    \ is crucial in multi-user or multi-process environments to prevent data corruption\
    \ or inconsistencies. While C standard does not provide direct support, often\
    \ the interaction with the underlying operating system's capabilities is necessary\
    \ for more advanced control, such as file locking.\n\n**Advisory Locking:**\n\
    Most operating systems offer advisory locking. Note that file locking behavior\
    \ can vary between different operating systems.\n\n**Using `fcntl` for File Locking:**\n\
    `fcntl` can set read (shared) or write (exclusive) locks on a file.\n\n```c\n\
    #include <fcntl.h>\n#include <unistd.h>\n\nvoid lockFile(int fd) {\n    struct\
    \ flock fl;\n    fl.l_type = F_WRLCK; // Write (exclusive)\n    fl.l_whence =\
    \ SEEK_SET;\n    fl.l_start = 0;\n    fl.l_len = 0; // Lock entire file\n    fl.l_pid\
    \ = getpid();\n    fcntl(fd, F_SETLKW, &fl); // Apply lock\n}\n\nvoid unlockFile(int\
    \ fd) {\n    struct flock fl;\n    fl.l_type = F_UNLCK; // Remove lock\n    fl.l_whence\
    \ = SEEK_SET;\n    fl.l_start = 0;\n    fl.l_len = 0;\n    fl.l_pid = getpid();\n\
    \    fcntl(fd, F_SETLK, &fl); // Remove the lock\n}\n```\n\n## Practical Examples\n\
    \n### Real-World Applications\nPractical applications include creating log files,\
    \ reading configuration files, processing binary data, and more.\n\n## Summary\n\
    This chapter covered the essential aspects of file handling in C. Understanding\
    \ these concepts is key to building applications that require persistent data\
    \ storage and retrieval.\n\n## Exercises\n\n1. Write a program to copy the contents\
    \ from one text file to another.\n2. Create a simple program that reads and displays\
    \ the contents of a binary file.\n3. Implement a log writer that appends messages\
    \ to a log file with timestamps.\n"
