    Chapter 7: Data Structures in C


    # Introduction to Data Structures


    # Data structures are an essential concept in computer science and programming.
    They are specialized formats for organizing and storing data in such a way that
    it can be accessed and modified efficiently. The choice of an appropriate data
    structure can significantly affect the efficiency of an algorithm and is key to
    handling and managing large amounts of data effectively.


    # What are Data Structures?


    # Data structures provide a means to manage large amounts of data efficiently,
    for uses such as large databases and internet indexing services. They are critical
    for designing efficient algorithms and are used in virtually every program or
    software system.


    # Importance:


    # 1\. Efficient data structures reduce complexity and increase the speed of computation.


    # 2\. They are vital for various applications, from operating systems to database
    systems, and in the implementation of various algorithms.


    # Types of Data Structures in C


    # Data structures in C are typically categorized based on their characteristics
    and the way they organize data. The main categories are:


    1\. Linear Data Structures:


    # In linear data structures, data elements are arranged in a sequential manner.


    # Examples:


    # Arrays: Fixed-size data structure that can hold elements of the same data type.
    It''s a static data structure where the size is determined at compile time.


    # Linked Lists: Consists of nodes where each node contains data and a reference
    (or pointer) to the next node in the list. It''s a dynamic data structure with
    variable size.


    # Stacks: Follows a LIFO (Last In First Out) principle. It allows operations at
    one end only.


    # Queues: Operates on FIFO (First In First Out) principle, allowing insertions
    at one end (rear) and deletions at the other end (front).


    2\. Non-Linear Data Structures:


    In non-linear data structures, data elements are not arranged sequentially.


    # Examples:


    # Trees: A hierarchical data structure with a set of nodes connected by edges.
    A special node called the root and the others are divided into sub-trees.


    # Graphs: Consists of a finite set of vertices (or nodes) and a set of edges connecting
    these vertices.


    3\. Static Data Structures:


    # The size and structure of static data structures remain constant during the
    execution of the program.


    # Example: Arrays.


    4\. Dynamic Data Structures:


    The size and structure of dynamic data structures can change during the execution
    of a program.


    # Example: Linked lists.


    # Structs and Unions


    # Using Structs


    Structures, or structs, are one of the key features in C programming that enable
    the creation of complex data types. They allow you to group different data types
    together under a single unit, making it easier to handle related data.


    Structs are defined using the `struct` keyword, followed by the struct''s name
    and a block of members.


    Example:


    struct Student {


    char name[100];


    int age;


    float grade;


    };


    Creating Struct Instances:


    Once a struct is defined, you can create variables (instances) of that struct.


    Example:


    struct Student student1;


    Accessing Members:


    You can access the members of a struct using the dot operator.


    Example:


    strcpy(student1.name, "John Doe");


    student1.age = 20;


    student1.grade = 3.5;


    # Nested Structures


    Structures can contain other structures as members, allowing you to create more
    complex and hierarchical data types.


    Example:


    struct DateOfBirth {


    int day;


    int month;


    int year;


    };


    struct Student {


    char name[100];


    struct DateOfBirth dob;


    };


    Accessing Nested Members:


    Access members of a nested struct using a combination of dot operators.


    Example:


    struct Student student1;


    student1.dob.day = 15;


    student1.dob.month = 6;


    student1.dob.year = 1995;


    # Unions


    Unions in C are similar to structs in that they group different data types together,
    but they differ significantly in how they handle memory. Unions are defined using
    the `union` keyword. All members of a union share the same memory location.


    Example:


    union Data {


    int intVal;


    float floatVal;


    char strVal[20];


    };


    Memory Sharing:


    In a union, only one member can be used at a time, as they occupy the same memory
    space.


    The size of the union is the size of its largest member.


    Using Unions:


    Unions are useful in situations where a variable may need to store different types
    of data at different times, but never simultaneously, thus conserving memory.


    Example:


    union Data data;


    data.intVal = 5; // Now data stores an integer


    data.floatVal = 3.14; // Now data stores a float, overwriting the integer


    # Linked Lists


    # Introduction to Linked Lists 


    Linked lists are dynamic data structures consisting of nodes, where each node
    contains data and a reference to the next node.


    # Implementing a Linked List 


    A simple linked list can be implemented as:


    struct Node {


        int data;


        struct Node *next;


    };


    # Operations on Linked Lists 


    Unlike arrays, linked lists are dynamic and can easily grow or shrink in size.
    Common operations on linked lists include insertion, deletion, searching, and
    traversal. These operations primarily involve manipulating the pointers in each
    node.


    Insertion


    At the Beginning: Adding a new node at the beginning of the list is a straightforward
    operation. Update the new node''s next pointer to point to the current head of
    the list, and then update the head pointer to the new node.


    void insertAtBeginning(Node head, int newData) {


          Node *newNode = (Node *)malloc(sizeof(Node));


          newNode->data = newData;


          newNode->next = *head;


          *head = newNode;


      }


    At the End: To add a node at the end, traverse the list to the last node and update
    its next pointer to the new node.


    void insertAtEnd(Node *head, int newData) {


          Node *newNode = (Node *)malloc(sizeof(Node));


          newNode->data = newData;


          newNode->next = NULL;


          if (head == NULL) {


              head = newNode;


              return;


          }


          Node *last = head;


          while (last->next != NULL) {


              last = last->next;


          }


          last->next = newNode;


      }


    At a Specific Position: To insert a node at a specific position, traverse to the
    node after which you want to insert and adjust the pointers accordingly.


    Deletion


    By Key: To delete a node with a specific key, locate the node, keep track of its
    previous node, and adjust the previous node''s next pointer to skip the node to
    be deleted.


    void deleteNodeByKey(Node head, int key) {


          Node *temp = *head, *prev;


          if (temp != NULL && temp->data == key) {


              *head = temp->next;


              free(temp);


              return;


          }


          while (temp != NULL && temp->data != key) {


              prev = temp;


              temp = temp->next;


          }


          if (temp == NULL) return;


          prev->next = temp->next;


          free(temp);


      }


    Searching


    Search for an Element: Traversing the list until the desired element is found
    or the end of the list is reached.


    bool search(Node *head, int key) {


          Node *current = head;


          while (current != NULL) {


              if (current->data == key)


                  return true;


              current = current->next;


          }


          return false;


      }


    Traversal


    Displaying the List: Iterate through the list and print the data of each node.


    void printList(Node *node) {


          while (node != NULL) {


              printf(" %d ", node->data);


              node = node->next;


          }


      }


    # Considerations and Best Practices


    Memory Management: Always ensure proper memory management. When nodes are removed,
    free the memory to prevent leaks.'
