  raw: 'For more details on compound assignment, the `+=` is one of the compound assignment
    operators. It adds the right operand to the left operand and then assigns the
    result to the left operand. For example, `a += b` is equivalent to `a = a + b`.
    This operator simplifies and shortens code that performs an addition followed
    by an assignment. For instance, if `a` is 5 and `b` is 3, after executing `a +=
    b`, the value of `a` will be 8\. Compound assignment operators like `+=` make
    the code more concise and often easier to read.


    # Operator Precedence and Associativity 


    In C programming, operator precedence and associativity are key concepts for understanding
    how expressions are evaluated. Operator precedence determines the order in which
    different operations are performed in an expression, with some operations being
    executed before others. For instance, multiplication and division have higher
    precedence than addition and subtraction.


    Associativity defines the order in which operators of the same precedence level
    are evaluated. It can be either left-to-right or right-to-left. For example, in
    an expression with several multiplication operations (which have left-to-right
    associativity), the operations are evaluated from left to right. Understanding
    these concepts is crucial for writing expressions that are correctly and efficiently
    executed by the C program.


    # Expressions and Statements


    An expression is a combination of variables, literals, operators, and function
    calls that are evaluated to produce a value. A statement, on the other hand, is
    an instruction that the C program executes. It could be a simple action like assigning
    a value or a control statement like an `if` statement.


    Example:


    int sum = 10 + 15; // 10 + 15 is an expression


    # Input/Output in C


    # Standard Input/Output


    C provides standard library functions for input and output. The most commonly
    used are `printf` for output and `scanf` for input. These functions are defined
    in the `stdio.h` header file.


    Example:


    printf("Hello, World!\n");


    scanf("%d", &age);


    # Formatted Input/Output


    `printf` and `scanf` use format specifiers to define the type of data to be inputted
    or outputted.


    Here''s a concise summary of common format specifiers in C with examples:


    `%d` or `%i`: For signed integers. Example: `printf("%d", 5);`


    `%u`: Unsigned integer. Example: `printf("%u", 150u);`


    `%f`: Floating-point. Example: `printf("%f", 3.14);`


    `%lf`: Double. Example: `printf("%lf", 3.1415);`


    `%c`: Character. Example: `printf("%c", ''A'');`


    `%s`: String. Example: `printf("%s", "Hello");`


    `%x` or `%X`: Hexadecimal. Example: `printf("%x", 255);`


    `%o`: Octal. Example: `printf("%o", 100);`


    `%p`: Pointer address. Example: `printf("%p", &var);`


    `%e` or `%E`: Scientific notation. Example: `printf("%e", 220.5);`


    `%g` or `%G`: Shortest representation of `%f` and `%e`. Example: `printf("%g",
    100.0);`


    These specifiers are fundamental for formatted input and output operations in
    C programming.


    In addition to the common format specifiers, C programming includes a few other
    specifiers that are less frequently used but can be very useful in certain contexts:


    `%lld` and `%llu`: Used for `long long int` and `unsigned long long int` types
    respectively. Similar to `%ll`, these are for handling very large integer values.


    `%zx`: For size_t type (often used in memory allocation and size calculations),
    outputs as an unsigned hexadecimal integer.


    `%td`: For `ptrdiff_t` type (used to store the difference between pointers), outputs
    as a signed decimal integer.


    These specifiers cater to specific data types and scenarios, extending the versatility
    of the formatted input/output functions in C.


    Example:


    printf("Age: %d, Grade: %c", age, grade);


    This example uses %d for integers and %c for characters.


    To add leading zeros to floating-point numbers or doubles in C programming, you
    would use a format specifier with a specific width and the ''0'' flag. For example,
    `%07.2f` would format a floating-point number to have a total width of 7 characters,
    including the decimal point, padding it with zeros if necessary, and displaying
    two digits after the decimal point. This ensures that the printed number is always
    7 characters long, with leading zeros added as needed. For example, `printf("%07.2f",
    3.14);` would output `0003.14`.


    Here are more examples of formatting floating-point numbers and doubles with leading
    zeros in C:


    1\. Float with Width and Precision:


    Specifier: `%08.3f`


    Usage: `printf("%08.3f", 123.456);`


    Output: `0123.456` (Total 8 characters wide including 3 after the decimal)


    2\. Double with Leading Zeros:


    Specifier: `%010.4lf`


    Usage: `printf("%010.4lf", 45.6789);`


    Output: `0045.6789` (Total 10 characters wide with 4 after the decimal)


    These specifiers pad the output with zeros to meet a specified total width, ensuring
    a consistent look, particularly useful in aligning numbers in tabulated data.


    In C programming, the `%` symbol is primarily used as a format specifier in formatted
    input/output functions like `printf` and `scanf`. It indicates that what follows
    is a format directive, which specifies how to format the corresponding argument.
    For example, `%d` formats an integer, `%f` a floating-point number, etc. Additionally,
    `%` is also used as the modulus operator in arithmetic expressions, where it calculates
    the remainder of the division of two integers. For instance, `a % b` yields the
    remainder of `a` divided by `b`.


    # Handling Errors in Input/Output 


    It''s important to handle potential errors in I/O operations, such as invalid
    input or a failure to open a file. Checking the return values of I/O functions
    can help identify and manage these errors.


    Example:


    if (scanf("%d", &age) != 1) {


        printf("Error reading age.\n");


    }


    This checks if scanf successfully read an integer.


    # Decision Making and Branching


    # `if` Statement


    The `if` statement is used for conditional execution of code. It evaluates an
    expression and executes the following block of code only if the expression is
    true.


    Example:


    if (age >= 18) {


        printf("You are an adult.\n");


    }


    This code checks if age is 18 or older.


    # `if-else` and Nested `if` 


    The `if-else` structure allows for an alternate path of execution if the `if`
    condition is false. Nested `if` statements are `if` or `if-else` statements inside
    another `if` or `if-else` block, used for multiple levels of decision-making.


    Example:


    if (age < 13) {


        printf("Child\n");


    }


    else if (age < 20) {


        printf("Teenager\n");


    }


    else {


        printf("Adult\n");


    }


    This if-else ladder categorizes a person based on age.


    # `switch` Statement


    The `switch` statement provides a way of executing different parts of code based
    on the value of an expression. It''s often used as an alternative to lengthy `if-else-if`
    ladders.


    Example:


    switch (grade) {


        case ''A'':


            printf("Excellent\n");


            break;


        case ''B'':


            printf("Good\n");


            break;


        default:


            printf("Average\n");


    }


    This switch statement provides responses based on the grade.


    # Summary


    This chapter has laid the foundation for your understanding of the basic components
    of the C language. We’ve covered the essential syntax, variables, data types,
    operators, I/O, and decision-making structures. Mastery of these concepts is crucial
    as they form the building blocks for more advanced programming in C.


    # Exercises


    1\. Write a program to calculate the area of a circle, taking the radius as input.


    2\. Write a program that declares variables of different data types and prints
    them.


    3\. Create a calculator that asks for two numbers and an operator, then performs
    the calculation.


    4\. Experiment with different operators and write a program that demonstrates
    the use of `if-else` and `switch` statements.


    5\. Write a program using if-else statements that checks whether a number entered
    by the user is even or odd.'
