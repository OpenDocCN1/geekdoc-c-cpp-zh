    # Advanced Data Structures


    # Hash Tables


    Hash tables are a highly efficient data structure for storing and retrieving data.
    They work on the principle of key-value pairing and use a hash function to compute
    an index where values are stored.


    Key-Value Pair:


    In a hash table, data is stored as key-value pairs. The key is used to compute
    the storage index using a hash function.


    Hash Function:


    A hash function takes a key and computes an index in the array (or bucket) where
    the value should be stored or retrieved.


    A good hash function distributes keys uniformly across the buckets, minimizing
    collisions.


    Handling Collisions:


    Collisions occur when different keys hash to the same index. They are typically
    handled by techniques like chaining (using linked lists at each index) or open
    addressing (finding another index in the table).


    Efficiency:


    When implemented well, hash tables provide very fast data retrieval, close to
    O(1) time complexity for search, insert, and delete operations.


    Use Cases:


    Hash tables are widely used in database indexing, caching, and any scenario where
    rapid data lookup is essential.


    # Heaps


    Heaps are specialized tree-based data structures that satisfy the heap property.
    They are widely used in implementing priority queues, heap sort, and for efficient
    graph algorithms.


    Heap Property:


    In a max heap, for every node `i` other than the root, the value of `i` is less
    than or equal to the value of its parent. Min heaps are the opposite.


    Binary Heap:


    Binary heaps are commonly used and are complete binary trees. They can be efficiently
    represented using arrays. In an array representation, if the parent is at index
    `p`, the left child is at `2p + 1` and the right child is at `2p + 2`.


    Basic Operations:


    Insertion: Insert new elements at the end and then "heapify" the tree to maintain
    the heap property.


    Deletion/Extract Max or Min: Remove the root element and replace it with the last
    element in the heap, followed by heapifying the tree.


    Heapify: Process of rearranging the heap to maintain the heap property.


    Heap Sort:


    Heaps can be used to implement an efficient sorting algorithm known as heap sort.
    It involves building a heap from the input data and then repeatedly extracting
    the maximum (or minimum) element and rebuilding the heap.


    Priority Queues:


    Priority queues, where elements are processed based on their priority, are efficiently
    implemented using heaps.


    Efficiency:


    Heaps provide O(log n) time complexity for insertions and deletions, and O(n log
    n) for heap sort.


    Both hash tables and heaps are powerful data structures that offer efficient solutions
    for specific problems. Hash tables excel in scenarios requiring rapid access to
    data elements, while heaps are ideal for tasks that need to manage data in a specific
    sorted order efficiently. Mastery of these data structures is essential for solving
    complex computational problems and optimizing the performance of algorithms.


    Hash Examples


    1\. Hash Table Structure and Hash Function:


    #define TABLE_SIZE 100


       typedef struct node {


           int key;


           int value;


           struct node *next;


       } node;


       typedef struct hashtable {


           node *array[TABLE_SIZE];


       } hashtable;


       int hashFunction(int key) {


           return key % TABLE_SIZE;


       }


    2\. Inserting a Key-Value Pair:


    void insert(hashtable *ht, int key, int value) {


           int index = hashFunction(key);


           node *newNode = (node*) malloc(sizeof(node));


           newNode->key = key;


           newNode->value = value;


           newNode->next = ht->array[index];


           ht->array[index] = newNode;


       }


    3\. Searching for a Value by Key:


    int search(hashtable *ht, int key) {


           int index = hashFunction(key);


           node *list = ht->array[index];


           while (list) {


               if (list->key == key) {


                   return list->value;


               }


               list = list->next;


           }


           return -1; // Not found


       }


    Heaps Examples


    1\. Heap Structure:


    #define MAX_SIZE 100


       typedef struct {


           int items[MAX_SIZE];


           int size;


       } Heap;


    2\. Inserting an Element:


    void heapifyUp(Heap *heap, int index) {


           int parentIndex = (index - 1) / 2;


           if (heap->items[parentIndex] < heap->items[index]) {


               // Swap


               int temp = heap->items[parentIndex];


               heap->items[parentIndex] = heap->items[index];


               heap->items[index] = temp;


               heapifyUp(heap, parentIndex);


           }


       }


       void insertHeap(Heap *heap, int value) {


           heap->items[heap->size] = value;


           heapifyUp(heap, heap->size);


           heap->size++;


       }


    3\. Removing the Max Element (Root of the Heap):


    void heapifyDown(Heap *heap, int index) {


           int leftChildIndex = 2 * index + 1;


           int rightChildIndex = 2 * index + 2;


           int largestIndex = index;


           if (leftChildIndex < heap->size && heap->items[leftChildIndex] > heap->items[largestIndex])
    {


               largestIndex = leftChildIndex;


           }


           if (rightChildIndex < heap->size && heap->items[rightChildIndex] > heap->items[largestIndex])
    {


               largestIndex = rightChildIndex;


           }


           if (largestIndex != index) {


               // Swap


               int temp = heap->items[index];


               heap->items[index] = heap->items[largestIndex];


               heap->items[largestIndex] = temp;


               heapifyDown(heap, largestIndex);


           }


       }


       int removeMax(Heap *heap) {


           int maxItem = heap->items[0];


           heap->items[0] = heap->items[--heap->size];


           heapifyDown(heap, 0);


           return maxItem;


       }


    In these examples, for hash tables, we used a simple array of linked lists to
    handle collisions, and for heaps, we used an array-based representation, which
    is efficient and common for binary heaps. These implementations serve as basic
    examples and can be expanded for more complex scenarios and improved performance.


    # Summary


    This chapter provided an overview of various data structures used in C programming,
    their implementation, and applications. Understanding these structures is key
    to developing efficient algorithms and managing complex data.


