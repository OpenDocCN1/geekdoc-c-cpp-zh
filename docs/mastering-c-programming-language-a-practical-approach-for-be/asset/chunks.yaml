  trans: "\n完成本节后，你已经具备了编写简单且有效的 C 程序的能力。在进入后续章节学习更复杂的话之前，理解这些基础知识是关键。\n\n# 第 3 章：C\
    \ 语言控制结构\n\n## 控制结构简介\n\n### 什么是控制结构？\n\n控制结构是编程的基石，用于引导执行流。在 C 中，它们被用于决策、重复操作以及管理程序的执行路径。有效使用控制结构对于创建动态且响应迅速的程序至关重要。\n\
    \n### 控制结构的类型\n\nC 提供了几种类型的控制结构，大致分类为：\n\n ** **顺序**：默认模式，按行执行代码。\n- **选择**：用于决策判断，包括\
    \ `if`、`else`、`else-if` 和 `switch` 语句。\n- **循环**：用于重复操作，使用 `for`、`while` 和 `do-while`\
    \ 循环。\n\n## 条件语句 (if, else)\n\n### 使用 `if` 语句\n\n如第 2 章所述，`if` 语句评估一个条件，如果为真，则执行相关的代码块。它是\
    \ C 语言中最简单的决策形式。\n\n```\nint number = 10;\n\nif (number > 0) {\n    printf(\"\
    The number is positive.\\n\");\n}\n```\n\n在这里，程序检查 `number` 是否大于 0，如果为真则打印消息。\n\
    \n### `else` 和 `else if` 阶梯\n\n如第 2 章所述，当 `if` 条件为假时，会执行 `else` 语句。`else if` 允许按顺序测试多个条件。\n\
    \n```c\nif (number > 0) {\n    printf(\"Positive\\n\");\n} else if (number < 0)\
