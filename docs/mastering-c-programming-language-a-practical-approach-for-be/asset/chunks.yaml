    # String Operations


    In C programming, dealing with strings involves several common operations such
    as concatenation, comparison, and finding the length of a string. The C standard
    library `<string.h>` provides a variety of functions to perform these operations
    efficiently and safely.


    Concatenation


    Function: `strcat()`


    Description: Appends the content of one string to the end of another.


    Usage:


    char str1[20] = "Hello, ";


      char str2[] = "World!";


      strcat(str1, str2);  // str1 now contains "Hello, World!"


    Comparison


    Function: `strcmp()`


    Description: Compares two strings.


    Usage:


    char str1[] = "Hello";


      char str2[] = "World";


      int result = strcmp(str1, str2);


      if(result == 0) {


          printf("Strings are equal.\n");


      } else {


          printf("Strings are not equal.\n");


      }


    `strcmp()` returns 0 if the strings are equal, a negative value if the first non-matching
    character in `str1` is less than that in `str2`, and a positive value otherwise.


    Finding Length


    Function: `strlen()`


    Description: Returns the length of the string, excluding the null character.


    Usage:


    char str[] = "Hello";


      int length = strlen(str);  // length will be 5


    # Other Common String Operations


    1.​Copying Strings: `strcpy()`


    Copies one string to another.


    Example: `strcpy(dest, source);`


    2.​Comparing Strings Case-Insensitive: `strcasecmp()` or `stricmp()`


    Compares two strings, ignoring the case.


    3.​Substring Search: `strstr()`


    Finds the first occurrence of a substring in a string.


    Example: `char *sub = strstr(str, "sub");`


    4.​Character Search: `strchr()` and `strrchr()`


    `strchr()` finds the first occurrence of a character in a string.


    `strrchr()` finds the last occurrence of a character in a string.


    5.​Splitting Strings: `strtok()`


    Breaks a string into a series of tokens based on a delimiter.


    # Best Practices


    When working with these functions, it''s important to ensure that:


    1\. Buffer Size: The destination buffer in operations like `strcat()` and `strcpy()`
    must be large enough to hold the resulting string, including the null terminator,
    to prevent buffer overflows.


    2\. Immutable String Literals: Attempting to modify string literals (e.g., using
    `strcat()` or `strcpy()` on a string literal) results in undefined behavior since
    they are stored in read-only memory.


    3\. Null-Termination: Ensure that strings are properly null-terminated before
    using these functions, as they rely on the null character to determine the end
    of a string.


    Utilizing these functions effectively allows for robust and efficient string handling
    in C programming, essential for data processing, user input, and communication
    between systems.


    # String Functions


    In C, the `string.h` library offers a suite of functions for performing various
    string operations. These functions provide essential capabilities for manipulating
    strings, including copying, concatenation, length measurement, and comparison
    as shown in the string operations above. Understanding and using these functions
    correctly is crucial for effective string handling in C programming.


    # `strcat()` - String Concatenation


    Description: Appends the content of one string to the end of another.


    Prototype: `char *strcat(char *dest, const char *src);`


    Usage:


    char str1[20] = "Hello";


      char str2[] = " World";


      strcat(str1, str2);  // str1 now contains "Hello World"


    Note: The destination string (`str1` in this case) must have enough space to accommodate
    the concatenated result.


    # `strlen()` - String Length


    Description: Returns the length of a string, excluding the null terminator.


    Prototype: `size_t strlen(const char *str);`


    Usage:


    char str[] = "Hello";


      int len = strlen(str);  // len will be 5


    # `strcmp()` - String Comparison


    Description: Compares two strings.


    Prototype: `int strcmp(const char *str1, const char *str2);`


    Usage:


    char str1[] = "Hello";


      char str2[] = "World";


      int result = strcmp(str1, str2);


      if (result == 0) {


          // Strings are equal


      } else {


          // Strings are not equal


      }


    Note: `strcmp()` returns 0 if the strings are equal, a negative value if `str1`
    is less than `str2`, and a positive value if `str1` is greater than `str2`.


    # Introduction to Pointers


    # Basic Concept of Pointers


    Pointers are a fundamental and powerful feature in C programming. They allow for
    direct memory access and manipulation, making them essential for efficient and
    effective programming in C. Understanding pointers is crucial for tasks like dynamic
    memory allocation, implementing data structures, and interacting with hardware.


    # What is a Pointer?


    A pointer is a variable that stores the memory address of another variable. Rather
    than holding a data value like a standard variable, a pointer holds the address
    where a value is stored.


    # Declaring Pointers


    To declare a pointer, you use the asterisk symbol `*` along with the data type
    of the variable it points to. For example:


    int *ptr;  // Pointer to an integer


    char *cptr; // Pointer to a character


    # Initializing Pointers


    A pointer is typically assigned the address of a variable using the address-of
    operator `&`. For instance:


    int var = 10;


    int *ptr = &var;  // ptr now holds the address of var


    # Dereferencing Pointers


    Dereferencing a pointer means accessing the value at the memory address stored
    in the pointer. This is done using the dereference operator `*` (same symbol as
    used in declaration but serves a different purpose). For example:


    int var = 10;


    int *ptr = &var;


    int value = *ptr;  // Dereferencing ptr gives the value of var, which is 10


    # Pointer Arithmetic


    Pointers support arithmetic operations like addition and subtraction. These operations
    are based on the data type of the pointer. For example, incrementing an `int *`
    pointer will increase it by the size of an `int`.


    # Uses of Pointers


    1\. Dynamic Memory Allocation: Using pointers with functions like `malloc()` and
    `free()` to manage memory dynamically.


    2\. Array Manipulation: Arrays and pointers are closely related in C, and pointers
    can be used to iterate through an array.


    3\. Passing Arguments by Reference: Pointers allow functions to modify the actual
    data passed to them, not just a copy.


    4\. Implementing Data Structures: Essential for creating complex data structures
    like linked lists, trees, and graphs.


    # Pointers and Null


    A pointer that doesn''t point to a valid memory location is often set to `NULL`,
    a special value indicating it''s not pointing anywhere.


    # Caution with Pointers


    Pointers need to be used carefully, as incorrect usage can lead to problems like
    memory leaks, accessing invalid memory locations (dangling pointers), or overwriting
    important data (buffer overruns).


    Understanding pointers is crucial for a deeper understanding of how C handles
    memory, which can lead to more efficient and powerful programming. They are one
    of the features that give C its reputation for being a highly efficient, though
    sometimes challenging, language to master.


    # Pointers and Arrays


    In C programming, the relationship between pointers and arrays is intrinsic and
    often a source of confusion for beginners. However, understanding this relationship
    is crucial for effective manipulation of arrays and memory.


    # Array Name as a Pointer


    The name of an array in C is, in most contexts, a pointer to the first element
    of the array. This means that the array name can be used much like a pointer variable.


    For example, if you have an array `int arr[5];`, the name `arr` can be used as
    a pointer to the first element of the array, i.e., `arr` is equivalent to `&arr[0]`.


    # Pointer Arithmetic


    Pointer arithmetic allows you to traverse an array using pointers. Since the array
    name acts as a pointer to its first element, you can perform arithmetic operations
    to move the pointer across the array elements.


    1\. Incrementing a Pointer: If `ptr` is a pointer to an array element, `ptr +
    1` points to the next element.'
