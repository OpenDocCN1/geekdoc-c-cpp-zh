    # Signal Handling


    In UNIX/Linux systems, signals are a mechanism to notify processes about various
    events, such as external interrupts, illegal memory access, or even inter-process
    communications. Proper handling of signals is crucial in writing robust and responsive
    system-level applications in C.


    # Basics of Signals


    # What are Signals?


    Signals are notifications sent to a process by the OS or other processes to indicate
    that a specific event has occurred.


    Common Signals:


    -         `SIGINT`: Interrupt signal typically sent by pressing Ctrl+C.


    -         `SIGTERM`: Request to terminate a process gracefully.


    -         `SIGKILL`: Forcefully kill a process.


    -         `SIGSEGV`: Indicates a segmentation fault.


    # Example: Signal Handling in C


    Handling signals involves specifying a function that should be executed when a
    specific signal is received. Here''s a simple example:


    #include <signal.h>


    #include <stdio.h>


    #include <unistd.h>


    void signalHandler(int sig) {


        printf("Signal received: %d\n", sig);


        // Additional logic for handling specific signals


    }


    int main() {


        // Associate the signalHandler function with SIGINT


        signal(SIGINT, signalHandler);


        // Infinite loop to keep the program running to receive signals


        while(1) {


            sleep(1);


        }


        return 0;


    }


    In this code:


    - `signal(SIGINT, signalHandler)` sets up a custom function (`signalHandler`)
    to handle the `SIGINT` signal.


    - When `SIGINT` (usually triggered by Ctrl+C) is received, `signalHandler` is
    invoked, printing a message.


    # Advanced Signal Handling


    sigaction:


    The `sigaction` system call provides more control over signal handling than `signal`.


    It allows specifying additional options for how signals should be handled.


    Handling Multiple Signals:


    A program can set up handlers for multiple signals, each potentially triggering
    different functions or actions.


    Signal Blocking and Masking:


    Signals can be blocked or masked temporarily, useful in situations where a signal
    should not interrupt a critical section of code.


    # Best Practices in Signal Handling


    Minimal Work in Handlers:


    Signal handlers should do minimal work, often just setting a flag or variable.
    Extensive processing in signal handlers can lead to complexity and issues.


    Reentrancy:


    Signal handlers should be reentrant, meaning they can be interrupted and re-invoked
    without adverse effects.


    Avoid Undefined Behavior:


    Certain functions are not safe to call in signal handlers (e.g., non-reentrant
    functions like `malloc` or I/O functions). Using them can lead to undefined behavior.


    Signal handling is a critical aspect of system programming in C, providing a means
    to respond to asynchronous events like user interrupts or system errors. Effective
    use of signal handling mechanisms enhances the robustness and responsiveness of
    applications, particularly in a UNIX/Linux environment. Mastery of signal concepts
    and proper handling techniques is vital for developing sophisticated system-level
    applications.


    # Network Programming Basics


    Network programming is a crucial aspect of system programming that involves writing
    software for communication over computer networks. At the core of network programming
    in C is the concept of sockets, which serve as endpoints for sending and receiving
    data.


    # Understanding Sockets


    # What is a Socket?


    In the context of networking, a socket is an endpoint for sending and receiving
    data across a network. It is essentially a communication channel and can be used
    for communication between processes on the same machine or on different machines.


    TCP and UDP Sockets:


    Sockets can use either the TCP (Transmission Control Protocol) or UDP (User Datagram
    Protocol), depending on the requirements of the application. TCP is reliable and
    connection-oriented, making it suitable for applications where data integrity
    is crucial. UDP is connectionless and suitable for applications that require speed
    over reliability.


    Example: Basic TCP Socket


    Here’s a basic example of using TCP sockets in C to connect to a server and send
    a simple HTTP GET request:


    #include <stdio.h>


    #include <sys/socket.h>


    #include <netinet/in.h>


    #include <arpa/inet.h>


    #include <string.h>


    #include <unistd.h>


    int main() {


        int socket_desc = socket(AF_INET, SOCK_STREAM, 0);


        if (socket_desc == -1) {


            perror("Could not create socket");


            return -1;


        }


        struct sockaddr_in server;


        server.sin_addr.s_addr = inet_addr("192.168.0.1");


        server.sin_family = AF_INET;


        server.sin_port = htons(80);


        if (connect(socket_desc, (struct sockaddr *)&server, sizeof(server)) < 0)
    {


            perror("Connection failed");


            return -1;


        }


        printf("Connected\n");


        char *message = "GET / HTTP/1.1\r\n\r\n";


        if (send(socket_desc, message, strlen(message), 0) < 0) {


            perror("Send failed");


            return -1;


        }


        printf("Data Sent\n");


        close(socket_desc);


        return 0;


    }


    In this example:


    - A socket is created using `socket()`.


    - The server’s address is specified in a `sockaddr_in` struct.


    - The `connect()` function establishes a connection to the server.


    - An HTTP GET request is sent using `send()`.


    - Finally, the socket is closed with `close()`.


    # Best Practices and Advanced Concepts


    Error Handling:


    Always check the return values of socket functions and handle errors appropriately.


    Asynchronous Operations:


    For scalable network programs, consider using non-blocking sockets or I/O multiplexing
    (e.g., `select()` or `poll()`).


    Security Considerations:


    Implement security measures such as SSL/TLS for data encryption, especially in
    client-server applications.


    Resource Management:


    Ensure proper management of resources like sockets to prevent leaks.


