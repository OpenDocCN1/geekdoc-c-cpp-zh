    关于复合赋值的更多详细信息，`+=` 是复合赋值运算符之一。它将右操作数加到左操作数上，然后将结果赋值给左操作数。例如，`a += b` 等同于 `a =
    a + b`。该运算符简化并缩短了执行加法后赋值的代码。例如，如果 `a` 是 5，`b` 是 3，执行 `a += b` 后，`a` 的值将变为 8。像
    `+=` 这样的复合赋值运算符使代码更加简洁，通常更容易阅读。


    # 运算符优先级和结合性


    在 C 语言中，运算符优先级和结合性是理解表达式如何评估的关键概念。运算符优先级决定了表达式中执行不同操作的顺序，某些操作会在其他操作之前执行。例如，乘法和除法的优先级高于加法和减法。


    结合性定义了相同优先级水平运算符的求值顺序。它可以是从左到右，也可以是从右到左。例如，在一个包含多个乘法操作（具有从左到右的结合性）的表达式中，操作是从左到右求值的。理解这些概念对于编写能被
    C 程序正确且高效执行的表达式至关重要。


    # 表达式和语句


    表达式是变量、字面量、运算符和函数调用的组合，通过求值产生一个值。另一方面，语句是 C 程序执行的指令。它可以是一个简单的操作（如赋值值），也可以是一个像
    `if` 语句这样的控制语句。


    示例：


    ```

    int sum = 10 + 15; // 10 + 15 是一个表达式

    ```


    # C 语言中的输入/输出


    ## 标准输入/输出


    C 提供了输入输出的标准库函数。最常用用于输出的 `printf` 和用于输入的 `scanf`。这些函数定义在 `stdio.h` 头文件中。


    示例：


    ```c

    printf("Hello, World!\n");

    scanf("%d", &age);

    ```


    ## 格式化输入/输出


    `printf` 和 `scanf` 使用格式说明符来定义输入或输出的数据类型。


    以下是 C 中常用格式说明符的简要总结及示例：


    - `%d` 或 `%i`：用于有符号整数。示例：`printf("%d", 5);`

    - `%u`：无符号整数。示例：`printf("%u", 150u);`

    - `%f`：浮点数。示例：`printf("%f", 3.14);`

    - `%lf`：双精度。示例：`printf("%lf", 3.1415);`

    - `%c`：字符。示例：`printf("%c", ''A'');`

    - `%s`：字符串。示例：`printf("%s", "Hello");`

    - `%x` 或 `%X`：十六进制。示例：`printf("%x", 255);`

    - `%o`：八进制。示例：`printf("%o", 100);`

    - `%p`：指针地址。示例：`printf("%p", &var);`

    - `%e` 或 `%E`：科学计数法。示例：`printf("%e", 220.5);`

    - `%g` 或 `%G`：`%f` 和 `%e` 的最短表示法。示例：`printf("%g", 100.0);`


    这些说明符是 C 语言中格式化输入输出操作的基础。


    除了常用的格式说明符，C 语言编程还包含几个较少用但在特定场景非常有用的说明符：


    - `%lld` 和 `%llu`：分别用于 `long long int` 和 `unsigned long long int` 类型。与 `%ll` 类似，这些用于处理非常大的整数值。

    - `%zx`：用于 `size_t` 类型（通常用于内存分配和大小计算），输出为无符号十六进制整数。

    - `%td`：用于 `ptrdiff_t` 类型。

