    \nUsage:\n\n```c\nchar str1[] = \"Hello\";\nchar str2[] = \"World\";\nint result\
    \ = strcmp(str1, str2);\nif (result == 0) {\n    // Strings are equal\n} else\
    \ {\n    // Strings are not equal\n}\n```\n\nNote: `strcmp()` returns 0 if the\
    \ strings are equal, a negative value if `str1` is less than `str2`, and a positive\
    \ value if `str1` is greater than `str2`.\n\n# Introduction to Pointers\n\n##\
