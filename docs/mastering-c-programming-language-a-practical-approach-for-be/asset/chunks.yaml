- fmt: "\nC has evolved significantly over the years. The ANSI C standard, established\
    \ in 1989, and the subsequent ISO standard, ensured the widespread adoption and\
    \ portability of C. Subsequent versions, like `C99`, `C11`, and `C18`, introduced\
    \ various enhancements, adapting C to the changing landscape of computing.\n\n\
    # Setting Up the Development Environment\n\n## Choosing a Compiler\nA compiler\
    \ is essential for translating your C code into executable programs. Popular C\
    \ compilers include `GCC` (GNU Compiler Collection) and `Clang`. `GCC` is known\
    \ for its wide usage and support across different platforms, while `Clang` is\
    \ praised for its excellent error messages and fast compilation.\n\n## Installation\
    \ Guide\nSetting up a C development environment varies by platform:\n- Windows:\
    \ Install `MinGW` or `Cygwin`, which provide `GCC`.\n- Linux: Most Linux distributions\
    \ come with `GCC` pre-installed. If not, it can be installed via the package manager.\n\
    - macOS: Install `Xcode Command Line Tools`, which includes `GCC`.\n\n## Integrated\
    \ Development Environments (IDEs)\nIDEs like `Code::Blocks`, `Eclipse CDT`, and\
    \ `Visual Studio` offer an integrated environment for writing, debugging, and\
    \ testing your C programs. They provide features like syntax highlighting, code\
    \ completion, and project management, making the development process more efficient.\n\
    \n# Your First C Program\n\n## Structure of a C Program\nA typical C program consists\
    \ of function definitions, with the `main()` function being the entry point. It\
    \ also includes header files, which contain declarations of functions and macros.\n\
    \n## \"Hello, World!\" Program\nLet’s write your first C program:\n\n```\n#include\
    \ <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\\n\");\n    return 0;\n\
    }\n```\nThis program prints “Hello, World!” to the console.\n\n## Compilation\
    \ and Execution\nTo compile and run this program:\n1. Save the code in a file\
    \ named `hello.c`.\n2. Use the `GCC` compiler: `gcc hello.c -o hello`.\n3. Run\
    \ the program: `./hello`.\n\n## Understanding Program Output\nThe `printf` function\
    \ in this program sends the text “Hello, World!” to the console, followed by a\
    \ new line.\n\n# Basic Programming Concepts\n\n## Understanding Syntax and Semantics\n\
    Syntax refers to the rules of how symbols are combined to form a valid program.\
    \ Semantics, on the other hand, is about the meaning of these symbols. A syntactically\
    \ correct program may not be semantically correct.\n\n## Variables and Basic Data\
    \ Types\nVariables are used to store data. Basic data types in C include `int`\
    \ for integers, `float` and `double` for floating-point numbers, and `char` for\
    \ characters.\n\n## Simple Input/Output\n`printf` and `scanf` are fundamental\
    \ functions for output and input. `printf` is used for displaying output, while\
    \ `scanf` is used for reading input from the user.\n\n# Summary\nThis chapter\
    \ laid the groundwork for your journey in C programming. We've explored the basics\
    \ of programming, the history of C, and how to set up a development environment.\
    \ You've also written and executed your first C program.\n\n# Exercises\n1. Write\
    \ a program that prints your favorite quote to the console.\n2. Modify the \"\
    Hello, World!\" program to include your name in the output.\n3. Experiment with\
    \ different data types (`int`, `float`, `char`) by declaring variables and printing\
    \ them using `printf`.\n\n# Chapter 2: Basics of C Language\n\n## Syntax and Structure\n\
    \n### Understanding C Syntax\nC syntax is the set of rules that defines how a\
    \ C program is written and interpreted. Key aspects include the use of semicolons\
    \ (`;`) to terminate statements, curly braces (`{}`) to define blocks of code,\
    \ and preprocessor directives (like `#include`) for including header files.\n\n\
    ### Program Structure\nA typical C program is structured into functions, with\
    \ the `main()` function being the entry point. Functions contain statements that\
    \ define the program's behavior. Comments, marked by `//` for single-line or `/*\
    \ ... */` for multi-line, are used to annotate and explain the code, not affecting\
    \ the program's execution.\n\nExample:\n```\n#include <stdio.h>\n\nint main()\
    \ {\n    // code goes here\n    return 0;\n}\n```\nThis snippet shows the basic\
    \ structure of a C program with the standard `main()` function.\n\n## Variables\
    \ and Data Types\n\n### Introduction to Variables\nVariables are fundamental in\
    \ C programming. They are named storage locations in memory, used to hold data\
    \ that can vary during program execution. Each variable in C has a specific type,\
    \ which determines the size and layout of the variable's memory.\n\n### Data Types\
    \ in C\nC provides several basic data types:\n- Integers (`int`): For whole numbers.\n\
    - Floating-Point Numbers (`float`, `double`): For decimal numbers.\n- Characters\
    \ (`char`): For individual characters.\n\nThe memory size of basic data types\
    \ in C can vary depending on the system and compiler. However, typical sizes are:\n\
    - Integers (`int`): Usually 4 bytes (32 bits), but this can vary between systems.\n\
    - Floating-Point Numbers:\n  - `float`: Typically 4 bytes (32 bits).\n  - `double`:\
    \ Usually 8 bytes (64 bits).\n- Characters (`char`): Generally 1 byte (8 bits).\n\
    \nIt's important to note that these sizes are not fixed and can differ based on\
    \ the architecture and compiler used. For exact sizes on a specific system, the\
    \ `sizeof` operator in C can be used to determine the size of each data type.\n\
    \nExample:\n```c\nint age = 30;\nfloat weight = 65.5;\nchar grade = 'A';\n```\n\
    These lines declare variables of different data types.\n\n### Constants and Literals\n\
    Constants are variables whose values cannot be changed once defined. Literals\
    \ are fixed values assigned to these constants or used directly in expressions.\
    \ For example, `5`, `3.14`, and `'a'` are literals representing an integer, a\
    \ floating-point number, and a character, respectively.\n\nExample:\n```c\nconst\
    \ int MAX_AGE = 100;\n```\nThis line declares a constant `MAX_AGE`.\n\n### Type\
    \ Modifiers\nType modifiers are used to alter the properties of basic data types\
    \ allowing for a greater range of values or different usages. Key type modifiers\
    \ include:\n1. `short`: Modifies integer types to have a smaller range, typically\
    \ used for smaller integers.\n2. `long`: Extends integer types to have a larger\
    \ range, often used for larger numbers. For instance, `long int` allows for larger\
    \ integer values than a regular `int`.\n3. `signed` and `unsigned`: `signed` (which\
    \ is the default) allows integers to be both positive and negative, while `unsigned`\
    \ restricts integers to non-negative values. For example, an `unsigned char` can\
    \ store values from 0 to 255, whereas a `signed char` typically stores values\
    \ from -128 to 127.\n\nExample:\n```c\nlong int distance = 150000L;\n```\nHere,\
    \ `long int` is used to store larger integer values.\n\n# Operators and Expressions\n\
    \n## Basic Operators\nIn C programming, operators are special symbols used for\
    \ specific operations. They can be categorized as follows:\n1. Arithmetic Operators:\
    \ Used for basic mathematical operations. These include `+` for addition, `-`\
    \ for subtraction, `*` for multiplication, `/` for division, and `%` for modulus\
    \ (remainder after division).\n2. Relational Operators: Employed to compare values.\
    \ This category includes `==` (equal to), `!=` (not equal to), `<` (less than),\
    \ `>` (greater than), `<=` (less than or equal to), and `>=` (greater than or\
    \ equal to).\n3. Logical Operators: Used for logical operations, particularly\
    \ in control flow. These are `&&` (logical AND), `||` (logical OR), and `!` (logical\
    \ NOT).\n4. Assignment Operators: Involved in assigning values to variables. Standard\
    \ assignment is done using `=`, while compound assignments include `+=`, `-=`,\
    \ `*=`, and `/=`, which combine arithmetic operations with assignment.\n"
  raw: 'C has evolved significantly over the years. The ANSI C standard, established
    in 1989, and the subsequent ISO standard, ensured the widespread adoption and
    portability of C. Subsequent versions, like C99, C11, and C18, introduced various
    enhancements, adapting C to the changing landscape of computing.


    # Setting Up the Development Environment


    # Choosing a Compiler


    A compiler is essential for translating your C code into executable programs.
    Popular C compilers include GCC (GNU Compiler Collection) and Clang. GCC is known
    for its wide usage and support across different platforms, while Clang is praised
    for its excellent error messages and fast compilation.


    # Installation Guide


    Setting up a C development environment varies by platform:


    -  Windows: Install MinGW or Cygwin, which provide GCC.


    -  Linux: Most Linux distributions come with GCC pre-installed. If not, it can
    be installed via the package manager.


    -  macOS: Install Xcode Command Line Tools, which includes GCC.


    # Integrated Development Environments (IDEs) 


    IDEs like Code::Blocks, Eclipse CDT, and Visual Studio offer an integrated environment
    for writing, debugging, and testing your C programs. They provide features like
    syntax highlighting, code completion, and project management, making the development
    process more efficient.


    # Your First C Program


    # Structure of a C Program 


    A typical C program consists of function definitions, with the `main()` function
    being the entry point. It also includes header files, which contain declarations
    of functions and macros.


    # "Hello, World!" Program


    Let’s write your first C program:


    #include <stdio.h>


    int main() {


        printf("Hello, World!\n");


        return 0;


    }


    This program prints “Hello, World!” to the console.


    # Compilation and Execution


    To compile and run this program:


    1\. Save the code in a file named `hello.c`.


    2\. Use the GCC compiler: `gcc hello.c -o hello`.


    3\. Run the program: `./hello`.


    # Understanding Program Output


    The `printf` function in this program sends the text “Hello, World!” to the console,
    followed by a new line.


    # Basic Programming Concepts


    # Understanding Syntax and Semantics 


    Syntax refers to the rules of how symbols are combined to form a valid program.
    Semantics, on the other hand, is about the meaning of these symbols. A syntactically
    correct program may not be semantically correct.


    # Variables and Basic Data Types 


    Variables are used to store data. Basic data types in C include `int` for integers,
    `float` and `double` for floating-point numbers, and `char` for characters.


    # Simple Input/Output


    `printf` and `scanf` are fundamental functions for output and input. `printf`
    is used for displaying output, while `scanf` is used for reading input from the
    user.


    # Summary


    This chapter laid the groundwork for your journey in C programming. We''ve explored
    the basics of programming, the history of C, and how to set up a development environment.
    You''ve also written and executed your first C program.


    # Exercises


    1\. Write a program that prints your favorite quote to the console.


    2\. Modify the "Hello, World!" program to include your name in the output.


    3\. Experiment with different data types (`int`, `float`, `char`) by declaring
    variables and printing them using `printf`.


    Chapter 2: Basics of C Language


    # Syntax and Structure


    # Understanding C Syntax


    C syntax is the set of rules that defines how a C program is written and interpreted.
    Key aspects include the use of semicolons (`;`) to terminate statements, curly
    braces (`{}`) to define blocks of code, and preprocessor directives (like `#include`)
    for including header files.


    # Program Structure


    A typical C program is structured into functions, with the `main()` function being
    the entry point. Functions contain statements that define the program''s behavior.
    Comments, marked by `//` for single-line or `/* ... */` for multi-line, are used
    to annotate and explain the code, not affecting the program''s execution.


    Example:


    #include <stdio.h>


    int main() {


        // code goes here


        return 0;


    }


    This snippet shows the basic structure of a C program with the standard main()
    function.


    # Variables and Data Types


    # Introduction to Variables


    Variables are fundamental in C programming. They are named storage locations in
    memory, used to hold data that can vary during program execution. Each variable
    in C has a specific type, which determines the size and layout of the variable''s
    memory.


    # Data Types in C 


    C provides several basic data types:


    -  Integers (`int`): For whole numbers.


    -  Floating-Point Numbers (`float`, `double`): For decimal numbers.


    -  Characters (`char`): For individual characters.


    The memory size of basic data types in C can vary depending on the system and
    compiler. However, typical sizes are:


    -  Integers (`int`): Usually 4 bytes (32 bits), but this can vary between systems.


    -  Floating-Point Numbers:


    -  `float`: Typically 4 bytes (32 bits).


    -  `double`: Usually 8 bytes (64 bits).


    -  Characters (`char`): Generally 1 byte (8 bits).


    It''s important to note that these sizes are not fixed and can differ based on
    the architecture and compiler used. For exact sizes on a specific system, the
    `sizeof` operator in C can be used to determine the size of each data type.


    Example:


    int age = 30;


    float weight = 65.5;


    char grade = ''A'';


    These lines declare variables of different data types.


    # Constants and Literals


    Constants are variables whose values cannot be changed once defined. Literals
    are fixed values assigned to these constants or used directly in expressions.
    For example, `5`, `3.14`, and `''a''` are literals representing an integer, a
    floating-point number, and a character, respectively.


    Example:


    const int MAX_AGE = 100;


    This line declares a constant MAX_AGE.


    # Type Modifiers


    Type modifiers are used to alter the properties of basic data types allowing for
    a greater range of values or different usages. Key type modifiers include:


    1\. `short`: Modifies integer types to have a smaller range, typically used for
    smaller integers.


    2\. `long`: Extends integer types to have a larger range, often used for larger
    numbers. For instance, `long int` allows for larger integer values than a regular
    `int`.


    3\. `signed` and `unsigned`: `signed` (which is the default) allows integers to
    be both positive and negative, while `unsigned` restricts integers to non-negative
    values only. For example, an `unsigned char` can store values from 0 to 255, whereas
    a `signed char` typically stores values from -128 to 127.


    Example:


    long int distance = 150000L;


    Here, long int is used to store larger integer values.


    # Operators and Expressions


    # Basic Operators


    In C programming, operators are special symbols used for specific operations.
    They can be categorized as follows:


    1\. Arithmetic Operators: Used for basic mathematical operations. These include
    `+` for addition, `-` for subtraction, `*` for multiplication, `/` for division,
    and `%` for modulus (remainder after division).


    2\. Relational Operators: Employed to compare values. This category includes `==`
    (equal to), `!=` (not equal to), `<` (less than), `>` (greater than), `<=` (less
    than or equal to), and `>=` (greater than or equal to).


    3\. Logical Operators: Used for logical operations, particularly in control flow.
    These are `&&` (logical AND), `||` (logical OR), and `!` (logical NOT).


    4\. Assignment Operators: Involved in assigning values to variables. Standard
    assignment is done using `=`, while compound assignments include `+=`, `-=`, `*=`,
    and `/=`, which combine arithmetic operations with assignment.'
