    \n### 为什么要使用函数指针？\n\n- **灵活性**：函数指针允许函数的动态执行，并可以在运行时从不同的函数实现中进行选择。\n- **回调函数**：它们被广泛用于实现回调，在此时一个函数需要作为参数传递给另一个函数。\n\
    - **接口实现**：在 C 中创建类似接口的结构非常有用，用于实现各种模式。\n\n### 基本语法与用法\n\n1. **声明函数指针**：函数指针的声明需要与它将指向的签名匹配。\n\
    `int (*funcPtr)(int, int);`\n这声明了 `funcPtr` 是一个接受两个整数参数并返回整数的指针。\n\n2. **将函数赋值给指针**：将函数赋值给指针是通过使用函数名完成的，函数名可以认为是函数的地址。\n\
    `funcPtr = &myFunction;` // 或者 `funcPtr = myFunction;`\n\n3. **通过指针调用函数**：可以像指针本身一样调用函数。\n\
    `int result = funcPtr(5, 3);`\n\n使用函数指针\n\n以下是如何定义、赋值和使用函数指针：\n\n```c\nvoid greet()\
