    be used as a pointer to its first element. This means that an array name, in most
    contexts, is effectively a pointer.


    Consider an array `int numbers[5];` - here, `numbers` can be thought of as a pointer
    to the first element of the array, `numbers[0]`.


    int arr[5] = {1, 2, 3, 4, 5};


    int *arrPtr = arr; // Pointer to the first element of arr


    # Accessing Array Elements with Pointers


    Because an array name acts as a pointer to its first element, you can use pointer
    arithmetic to traverse the array. This is an alternative to accessing elements
    using the array index.


    int numbers[5] = {10, 20, 30, 40, 50};


    int *ptr = numbers;  // ptr now points to numbers[0]


    for(int i = 0; i < 5; i++) {


        printf("Element %d: %d\n", i, *(ptr + i));


    }


    In this example, `*(ptr + i)` is used to access the i-th element of the array.
    This expression increases the pointer by `i` elements from the start and then
    dereferences it to get the value.


    # Pointers and Multidimensional Arrays


    When dealing with multidimensional arrays, pointers can become a bit more complex.
    For a two-dimensional array, a pointer to an array of pointers is often used.
    Each of these pointers then points to a different row of the array.


    int matrix[2][3] = {{1, 2, 3}, {4, 5, 6}};


    int (*ptr)[3] = matrix;


    for(int i = 0; i < 2; i++) {


        for(int j = 0; j < 3; j++) {


            printf("%d ", ptr[i][j]);


        }


        printf("\n");


    }


    Here, `ptr` is a pointer to an array of three integers. It points to the first
    element of `matrix`, which itself is an array of three integers.


    # Relationship with Strings


    In C, strings are essentially arrays of characters, terminated by a null character
    (`''\0''`). Therefore, a character pointer can be used to manipulate strings.


    char str[] = "Hello, World!";


    char *ptr = str;


    printf("First character: %c\n", *ptr); // Prints ''H''


    # Best Practices and Common Pitfalls


    Pointer Arithmetic: Be cautious with pointer arithmetic. It’s easy to inadvertently
    move the pointer outside the bounds of the array, leading to undefined behavior.


    Const Correctness: If you are using pointers to read array elements without modifying
    them, consider using `const` to prevent accidental modification of the array elements.


    Memory Allocation: For dynamic arrays, pointers are essential. However, remember
    to free the allocated memory to avoid memory leaks.


    Understanding the relationship between pointers and arrays is crucial for anyone
    looking to master C programming. This relationship underscores much of C''s approach
    to memory and data representation, making it a foundational concept in the language.


    # Pointer to Pointer (Double Pointer) 


    In C programming, a pointer to a pointer, often referred to as a double pointer,
    is a powerful concept that extends the basic idea of pointers. A double pointer
    is essentially a pointer that stores the address of another pointer, thus creating
    a level of indirection.


    # Understanding Double Pointers


    A double pointer is declared using two asterisks (e.g., `int **ptr`). This signifies
    that `ptr` is not just a pointer to an `int`, but a pointer to a pointer to an
    `int`.


    Consider the following example:


    int value = 5;


    int *ptr = &value;


    int **doublePtr = &ptr;


    Here, `ptr` is a pointer holding the address of `value`, and `doublePtr` is a
    double pointer holding the address of `ptr`.


    # Using Double Pointers


    Double pointers are commonly used in various scenarios, such as:


    1\. Dynamic Memory Allocation for Multidimensional Arrays:


    Double pointers are particularly useful when dealing with dynamically allocated
    multidimensional arrays.


    They allow for the creation of an array of pointers, each pointing to a different
    array, thus effectively creating a two-dimensional array.


    2\. Passing a Pointer to a Function:


    When you want a function to modify the address stored in a pointer variable, a
    double pointer is used. This is because passing a single pointer to a function
    will only allow you to modify the value pointed to by the pointer, not the address
    stored in the pointer variable.


    Example: Dynamic Allocation for a 2D Array


    Here''s an example demonstrating the use of double pointers for dynamically creating
    a two-dimensional array:


    int rows = 2;


    int cols = 3;


    int **array = (int **)malloc(rows * sizeof(int *));


    for(int i = 0; i < rows; i++) {


        array[i] = (int *)malloc(cols * sizeof(int));


    }


    // Assign values and print the array


    for (int i = 0; i < rows; i++) {


        for (int j = 0; j < cols; j++) {


            array[i][j] = i + j; // Assign a value


            printf("%d ", array[i][j]);


        }


        printf("\n");


    }


    // Free the allocated memory


    for (int i = 0; i < rows; i++) {


        free(array[i]);


    }


    free(array);


    In this example, `array` is a double pointer used to allocate memory for a 2D
    array. Each `malloc` call allocates memory for one row of the array, and `array[i][j]`
    is used to access and assign values to the elements.


    # Best Practices


    Initializing Double Pointers: Always initialize double pointers. Uninitialized
    pointers can lead to undefined behavior.


    Memory Management: Be diligent about memory management. Each `malloc` should have
    a corresponding `free` to avoid memory leaks.


    Null Checks: Always perform null checks after dynamic memory allocation to ensure
    that the memory allocation was successful.


    Double pointers are a nuanced aspect of pointer usage in C. They provide a level
    of indirection that is useful in several advanced scenarios, particularly those
    involving dynamic memory allocation and manipulation of complex data structures.
    Understanding and using double pointers effectively can greatly enhance the flexibility
    and efficiency of C programs.


    # Dynamic Memory Allocation


    # Introduction to Dynamic Memory Allocation 


    Dynamic memory allocation is a pivotal concept in C programming, offering the
    flexibility to allocate memory at runtime. This is especially crucial in scenarios
    where the size of the memory needed is not known during compile time. In C, this
    dynamic allocation is achieved through a set of standard library functions that
    operate on pointers, allowing for effective management of memory throughout the
    lifecycle of a program.


    # `malloc`, `calloc`, `realloc`, and `free`


    The C standard library provides four primary functions for dynamic memory management:
    `malloc`, `calloc`, `realloc`, and `free`. Each serves a distinct purpose in the
    process of memory allocation and deallocation.


    1\. `malloc` (Memory Allocation):


    `malloc` stands for memory allocation. It allocates a specified amount of memory
    and returns a pointer to the beginning of the block. The memory allocated by `malloc`
    is not initialized, meaning it contains garbage values.


    Syntax: `void *malloc(size_t size);`


    int *ptr = (int *)malloc(10 * sizeof(int)); // Allocates memory for 10 integers


    2\. `calloc` (Contiguous Allocation):


    `calloc` is similar to `malloc` but with two key differences: it takes two parameters
    and it initializes the allocated memory. The function allocates memory for an
    array of elements, each of a specified size, and initializes all bytes in the
    allocated storage to zero.


    Syntax: `void *calloc(size_t num, size_t size);`


    int *ptr = (int *)calloc(10, sizeof(int)); // Allocates and initializes memory
    for 10 integers


    3\. `realloc` (Re-Allocation):


    `realloc` is used to change the size of the memory block previously allocated
    with `malloc` or `calloc`. It allows you to expand or reduce the size of the allocated
    memory block. If the memory cannot be resized, `realloc` may allocate new memory,
    copy the old contents, and free the old block.


    Syntax: `void *realloc(void *ptr, size_t newSize);`


    ptr = (int *)realloc(ptr, 15 * sizeof(int)); // Resizes the memory block to hold
    15 integers


    4\. `free` (Memory Deallocation):'
