    \ 语句允许使用单个变量的值进行多路分支。在某些场景下，它比多个 `if-else` 语句更简洁。\n\n```c\nswitch (number) {\n\
    \    case 1:\n        printf(\"One\\n\");\n        break;\n    case 2:\n     \
    \   printf(\"Two\\n\");\n        break;\n    default:\n        printf(\"Other\\\
    n\");\n}\n```\n\n在这里，根据 `number` 的值执行不同的分支。\n\n## 循环 (for, while, do-while)\n\n\
    ### `for` 循环\n\n当迭代次数已知时，`for` 循环是最理想的。它由初始化、条件和增减表达式组成。\n\n```c\nfor (int i =\
    \ 1; i <= 5; i++) {\n    printf(\"%d\\n\", i);\n}\n```\n\n该循环打印从 1 到 5 的数字。\n\n\
    ### `while` 循环\n\n当预未知迭代次数时，使用 `while` 循环。它在每次迭代之前检查条件。\n\n```c\nint i = 1;\n\
    while (i <= 5) {\n    printf(\"%d\\n\", i);\n    i++;\n}\n```\n\n该循环也打印从 1 到 5\
    \ 的数字，但使用的是 `while` 循环。\n\n### `do-while` 循环\n\n`do-while` 循环确保循环体至少执行一次，因为条件是在循环执行后检查的。\n\
    \n```c\nint i = 1;\ndo {\n    printf(\"%d\\n\", i);\n    i++;\n} while (i <= 5);\n\
    ```\n\n即使 `i` 初始大于 5，循环体也会执行一次。\n\n## Break 和 Continue\n\n### 使用 `break`\n\n`break`\
    \ 语句会立即退出循环或 `switch` 分支。它用于根据特定条件终止循环。\n\n```c\nfor (int i = 1; i <= 5; i++)\
    \ {\n    if (i == 3) break;\n    printf(\"%d\\n\", i);\n}\n```\n\n该循环在 `i` 变为\
    \ 3 时停止执行。\n\n### 使用 `continue`\n\n`continue` 语句会跳过当前迭代并进入下一次迭代。\n\n```c\nfor\
    \ (int i = 1; i <= 5; i++) {\n    if (i == 3) continue;\n    printf(\"%d\\n\"\
    , i);\n}\n```\n\n### 嵌套循环\n\n嵌套循环涉及将一个循环放在另一个循环内部。它们通常用于矩阵或网格。\n\n```c\nfor (int\
    \ i = 1; i <= 5; i++) {\n    for (int j = 1; j <= 5; j++) {\n        printf(\"\
    %d %d\\n\", i, j);\n    }\n}\n```\n\n### If-Else 的替代方案：三元运算符\n\n三元运算符是处理 `if-else`\
    \ 逻辑的简洁方式。它使用语法 `条件 ? 1 : expression2`。\n\n```\nint max = (a > b) ? a : b;\n```\n\
    \n## 总结\n\n在本章中，我们深入研究了构建 C 程序的控制结构。涵盖了用于决策的条件语句、用于重复任务的循环，并学习了如何有效地管理程序流。\n\n\
    ## 练习\n\n1. 编写一个程序，使用 `if` 语句检查数字是否为正、偶数或大于 10。\n2. 使用 `for` 循环创建前 10 个斐波那契数字。\n\
    3. 创建一个使用嵌套循环显示 5x5 星号矩阵的程序。\n\n# 第 4 章：C 语言中的函数\n\n## 函数简介\n\n### 什么是函数？\n\n\
    在编程中，函数是执行特定任务的独立代码块。它们是构建 C 程序的基础，允许将代码拆分为可管理的部分。\n\n### 使用函数的好处\n\n ** **模块化**：将复杂过程拆分为更小的部分。\n\
    - **可重用性**：允许在程序的不同部分或不同程序之间重复代码。\n- **提高可读性**：使代码更有组织。\n\n## 定义函数\n\n### 函数的基本结构\n\
    \nC 函数通常由返回类型、函数名、参数（如果有）以及大括号内的体组成。语法如下：\n\n```\nreturnType functionName(parameter1,\
    \ parameter2, ...) {\n    // 函数体\n    // return 语句（如果 returnType 不是 void）\n}\n\
    ```\n\n### 编写你的第一个函数\n\n让我们写一个简单的相两个数字的函数：\n\n```c\nint add(int num1, int num2)\
    \ {\n    return num1 + num2;\n}\n```\n\n该函数名为 `add`，接收两个整数参数并返回它们的和。\n\n## 函数参数和返回类型\n\
    \n### 向函数传递参数\n\n参数可以通过值传递或引用传递给函数。在 C 中，默认是值传递，即传递参数的副本。\n\n```c\nint result\
    \ = add(5, 10);\n```\n\n### 返回类型和值\n\n函数可以返回各种类型，如果不返回值则使用 `void`。`return` 语句用于从函数返回值。\n\
    \n```c\nreturn result;\n```\n\n## 递归\n\n### 递归概念\n"
- fmt: "\nRecursion is a fundamental concept in programming where a function calls\
    \ itself. It's an effective strategy for solving problems that can be broken down\
    \ into smaller, similar subproblems. In recursion, each time the function calls\
    \ itself, it works on a smaller piece of the problem, eventually reaching a base\
    \ case that stops further recursive calls. This concept is particularly useful\
    \ for tasks like traversing data structures (like trees or graphs), implementing\
    \ algorithms like `quicksort` or `mergesort`, and solving problems where an iterative\
    \ approach is less intuitive or efficient. Recursion requires careful handling\
    \ to avoid infinite recursion and ensure that each recursive call moves closer\
    \ to a base case.\n\nHere's an example of recursion: a function to calculate the\
    \ factorial of a number. The factorial of a number `n` is the product of all positive\
    \ integers less than or equal to `n`. It's commonly denoted as `n!`.\n\n```c\n\
    #include <stdio.h>\n\n// Recursive function to calculate factorial\n\nunsigned\
    \ long long factorial(int n) {\n    if (n == 0) { // Base case\n        return\
    \ 1;\n    } else {\n        return n * factorial(n - 1); // Recursive call\n \
    \   }\n}\n\nint main() {\n    int number = 5;\n    printf(\"Factorial of %d is\
    \ %llu\\n\", number, factorial(number));\n    return 0;\n}\n```\n\nIn this example,\
    \ `factorial` is a recursive function. When it's called with a non-zero argument,\
    \ it calls itself with `n - 1`. Each call reduces `n` until it reaches the base\
    \ case (`n == 0`), at which point the function returns 1. The stack of recursive\
    \ calls then unwinds, multiplying the numbers together to get the final result.\n\
    \n## Recursive vs Iterative Solutions\n\nRecursive and iterative solutions are\
    \ two approaches for solving problems in programming, each with its own advantages\
    \ and disadvantages:\n\n1. **Recursive Solutions**:\n   - **Concept**: Involves\
    \ a function calling itself to solve smaller instances of the same problem.\n\
    \   - **Use Case**: Ideal for problems naturally expressed in terms of smaller\
    \ subproblems, such as tree traversals, factorial calculation, Fibonacci sequence,\
    \ etc.\n   - **Pros**: Often more readable and easier to write; maps well to problems\
    \ with a natural recursive structure.\n   - **Cons**: Can be less efficient due\
    \ to function call overhead; risks stack overflow for deep recursion; sometimes\
    \ harder to debug.\n\n2. **Iterative Solutions**:\n   - **Concept**: Uses loops\
    \ to repeat operations, avoiding function calls.\n   - **Use Case**: Suitable\
    \ for straightforward problems that require repetitive tasks, like iterating through\
    \ arrays, accumulating sums, etc.\n   - **Pros**: Generally more efficient in\
    \ terms of memory and speed; easier to understand for simple repetitive tasks;\
    \ avoids stack overflow issues.\n   - **Cons**: Can be more complex to write for\
    \ problems that naturally fit a recursive approach; code may become less readable.\n\
    \n### Example - Factorial Calculation:\n\nRecursive:\n```c\nint factorial(int\
    \ n) {\n    if (n <= 1) return 1;\n    return n * factorial(n - 1);\n}\n```\n\n\
    Iterative:\n```c\nint factorial(int n) {\n    int result = 1;\n    for(int i =\
    \ 2; i <= n; i++) {\n        result *= i;\n    }\n    return result;\n}\n```\n\
    \nChoosing between recursion and iteration depends on the specific problem, performance\
    \ considerations, and personal or stylistic preferences.\n\n## Common Pitfalls\
    \ in Recursion\n\nKey issues in recursion include infinite recursion (lack of\
    \ proper termination condition) and excessive memory usage. It's crucial to have\
    \ a base case that ends the recursive calls.\n\n## Scope and Lifetime of Variables\n\
    \n### Local vs Global Variables\n\nIn C programming, the distinction between local\
    \ and global variables is crucial for understanding variable scope and lifetime:\n\
    \n#### Local Variables:\n- Declared within a function.\n- Accessible only within\
    \ the function where they are declared.\n- Lifetime is limited to the function's\
    \ execution.\n\n#### Global Variables:\n- Declared outside of all functions, typically\
    \ at the top of the program file.\n- Accessible from any part of the program.\n\
    - Lifetime spans the entire runtime of the program.\n\nProperly managing local\
    \ and global variables is essential for writing well-structured and maintainable\
    \ code. Global variables offer program-wide access but can lead to issues with\
    \ code manageability and conflicts, while local variables help in maintaining\
    \ a function’s self-contained behavior, enhancing modularity and reducing potential\
    \ side effects.\n\nHere are examples demonstrating local and global variables\
    \ in C:\n\n#### 1. Local Variable Example:\nIn this example, `localVar` is a local\
    \ variable in the `add` function.\n\n```c\nint add(int a, int b) {\n    int localVar\
    \ = a + b; // Local variable\n    return localVar;\n}\n\nint main() {\n    int\
    \ result = add(5, 3);\n    printf(\"Result is: %d\\n\", result);\n    return 0;\n\
    }\n```\n*(Note: The original text had fragmented logic for the local variable\
    \ example; it has been cleaned for clarity while preserving the core logic.)*\n\
    \n#### 2. Global Variable Example:\nIn this example, `globalVar` is a global variable.\
    \ It is accessible in both `increment` and `main` functions.\n\n```c\nint globalVar\
    \ = 10; // Global variable\n\nvoid increment() {\n    globalVar += 5;\n}\n\nint\
    \ main() {\n    printf(\"Before: %d\\n\", globalVar);\n    increment();\n    printf(\"\
    After: %d\\n\", globalVar);\n    return 0;\n}\n```\n\n### Static Variables\n\n\
    Static variables in C programming have a unique property: they retain their value\
    \ between function calls. This contrasts with local variables, which are reinitialized\
    \ every time a function is called. Static variables are often used to preserve\
    \ state information across multiple calls or to count the number of times a function\
    \ is executed. They are declared with the `static` keyword and their scope is\
    \ limited to the block where they are defined, yet their lifetime extends throughout\
    \ the program execution.\n\nHere is a basic example:\n\n```c\nvoid countFunctionCalls()\
    \ {\n    static int count = 0; // Static variable\n    count++;\n    printf(\"\
    Function called %d times\\n\", count);\n}\n\nint main() {\n    for (int i = 0;\
    \ i < 5; i++) {\n        countFunctionCalls(); // Each call increments 'count'\n\
    \    }\n    return 0;\n}\n```\nIn this example, each time `countFunctionCalls()`\
    \ is called, the `count` variable retains its value and is incremented, demonstrating\
    \ the persistent nature of static variables.\n\n## Advanced Function Topics\n\n\
    ### Function Pointers\n\nFunction pointers in C are variables that store the address\
    \ of a function. They enable the dynamic calling of functions and are particularly\
    \ useful in scenarios like implementing callback functions, where a function needs\
    \ to be passed as an argument to another function, or in creating function tables\
    \ for dynamic dispatch. A function pointer is declared by specifying the return\
    \ type and parameter types of the function it points to. They add a layer of flexibility\
    \ to C programming by allowing functions to be treated similarly to other variables.\n\
    \nHere's an example demonstrating the use of function pointers in C:\n\n```c\n\
    #include <stdio.h>\n\nvoid greetMorning() {\n    printf(\"Good morning!\\n\");\n\
    }\n\nvoid greetEvening() {\n    printf(\"Good evening!\\n\");\n}\n\nint main()\
    \ {\n    // Declare a function pointer and assign it to greetMorning\n    void\
    \ (*greetFunction)() = greetMorning;\n    greetFunction(); // Calls greetMorning\n\
    \n    // Reassign the function pointer to greetEvening\n    greetFunction = greetEvening;\n\
    \    greetFunction(); // Calls greetEvening\n\n    return 0;\n}\n```\n"
