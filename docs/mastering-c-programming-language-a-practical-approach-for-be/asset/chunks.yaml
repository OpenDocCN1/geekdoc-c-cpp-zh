    \n这段代码将 `number` 分类为正、负或零。\n\n### 嵌套 `if` 语句\n\n嵌套 `if` 语句提供了一种在分支内检查多个条件的方法。\n\
    \n```c\nif (number != 0) {\n    if (number > 0) {\n        printf(\"Positive\\\
    n\");\n    } else {\n        printf(\"Negative\\n\");\n    }\n} else {\n    printf(\"\
