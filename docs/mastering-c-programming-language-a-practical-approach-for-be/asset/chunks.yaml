    # Low-Level File Handling


    System Calls for File Operations:


    Unlike standard I/O library functions, system calls provide direct interaction
    with the file system, offering more control and efficiency in certain scenarios. 
    They are particularly useful for operations where standard library functions do
    not offer the needed flexibility or performance.


    Advantages:


    - More control over file attributes like permissions.


    - Better performance in scenarios where buffering by standard I/O functions is
    not advantageous.


    - Essential for implementing utilities that interact with the file system at a
    lower level.


    Example: File Manipulation with System Calls


    The following example demonstrates basic file manipulation using system calls
    in C:


    #include <fcntl.h>


    #include <unistd.h>


    #include <stdio.h>


    int main() {


        int fd = open("testfile.txt", O_CREAT | O_WRONLY, 0777);


        if (fd < 0) {


            perror("open");


            return -1;


        }


        const char *text = "Hello, World!";


        ssize_t bytes_written = write(fd, text, 13);


        if (bytes_written < 0) {


            perror("write");


            close(fd);


            return -1;


        }


        close(fd);


        return 0;


    }


    In this code:


    - `open` is used to create (`O_CREAT`) and open (`O_WRONLY`) a file named "testfile.txt"
    with permissions set to 0777.


    - `write` writes the string "Hello, World!" to the file.


    - `close` closes the file descriptor, ensuring that resources are released.


    # Understanding File Descriptors


    File Descriptors:


    A file descriptor is a non-negative integer used to access a file or a device.
    System calls like `open`, `read`, `write`, and `close` use file descriptors to
    perform operations on files. They are an abstraction for representing files and
    devices, making it easier to perform generic operations regardless of the underlying
    file or device type.


