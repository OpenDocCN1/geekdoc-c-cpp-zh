    # Non-Blocking I/O and Multiplexing


    Non-Blocking I/O:


    Non-blocking I/O allows a program to issue an I/O operation and continue its execution
    without waiting for the operation to complete.  This is useful in scenarios where
    a program needs to handle other tasks while waiting for network operations, enhancing
    overall application responsiveness.


    I/O Multiplexing:


    I/O multiplexing lets a single process or thread monitor multiple file descriptors
    (sockets) for readability, writability, or errors.  The `select()` and `poll()`
    system calls are commonly used for this purpose. They allow a program to "wait"
    on multiple sockets, waking up when one or more of the sockets become ready for
    some class of I/O operation.


    Example of `select()`:


    fd_set readfds;


        int max_sd;


        struct timeval tv;


        FD_ZERO(&readfds);      // Clear the socket set


        FD_SET(sockfd, &readfds); // Add sockfd to the set


        max_sd = sockfd;


        // Set timeout for select (optional)


        tv.tv_sec = 5;


        tv.tv_usec = 0;


        // Wait for an activity on the socket, timeout is NULL, so wait indefinitely


        select(max_sd + 1, &readfds, NULL, NULL, &tv);


        // Check if sockfd is ready to be read


    # Network Security Basics


    Encryption:


    Encryption is crucial for securing data transmitted over a network. It involves
    encoding data in such a way that only authorized parties can access it. Techniques
    like TLS/SSL are used to encrypt data sent over a network connection.


    Secure Sockets Layer (SSL):


    SSL and its successor, TLS (Transport Layer Security), are protocols for establishing
    authenticated and encrypted links between networked computers. In C, libraries
    like OpenSSL provide tools for implementing SSL/TLS in network applications, enabling
    secure data transmission.


    Implementing SSL with Sockets:


    To secure a socket connection with SSL, a SSL context and an SSL object are created
    and associated with the socket. Data sent over this socket is then encrypted,
    and data received is decrypted using SSL methods.


