    1\. Singly Linked List with Insertion and Deletion:


    #include <stdio.h>


       #include <stdlib.h>


       typedef struct Node {


           int data;


           struct Node* next;


       } Node;


       Node* createNode(int data) {


           Node* newNode = malloc(sizeof(Node));


           if (!newNode) return NULL;


           newNode->data = data;


           newNode->next = NULL;


           return newNode;


       }


       void insertAtHead(Node head, int data) {


           Node* newNode = createNode(data);


           newNode->next = *head;


           *head = newNode;


       }


       void deleteNode(Node head, int key) {


           Node *temp = *head, *prev = NULL;


           if (temp != NULL && temp->data == key) {


               *head = temp->next;


               free(temp);


               return;


           }


           while (temp != NULL && temp->data != key) {


               prev = temp;


               temp = temp->next;


           }


           if (temp == NULL) return;


           prev->next = temp->next;


           free(temp);


       }


       // Additional functions like displayList(), insertAtTail() can also be added.


    2\. Stack Implementation with Push and Pop:


    #include <stdio.h>


       #include <stdlib.h>


       typedef struct Stack {


           int top;


           unsigned capacity;


           int* array;


       } Stack;


       Stack* createStack(unsigned capacity) {


           Stack* stack = (Stack*)malloc(sizeof(Stack));


           stack->capacity = capacity;


           stack->top = -1;


           stack->array = (int*)malloc(stack->capacity * sizeof(int));


           return stack;


       }


       void push(Stack* stack, int item) {


           if (stack->top == stack->capacity - 1) return;


           stack->array[++stack->top] = item;


       }


       int pop(Stack* stack) {


           if (stack->top == -1) return INT_MIN;


           return stack->array[stack->top--];


       }


       // Additional functions for isEmpty(), peek(), etc., can be added.


