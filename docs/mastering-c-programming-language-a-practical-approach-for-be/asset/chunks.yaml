    # Stacks and Queues


    # Understanding Stacks


    A stack is a fundamental linear data structure that follows the Last In, First
    Out (LIFO) principle. It''s akin to a stack of plates where you can only take
    the top plate off the stack and add a new plate to the top.


    Key Operations:


    Push: Adds an element to the top of the stack.


    Pop: Removes and returns the element from the top of the stack.


    Stack Characteristics:


    Stacks are dynamic, meaning they can grow and shrink as needed.


    The last element added is the first one to be removed, hence LIFO.


    # Basic Stack Operations


    1\. Push Operation:


    Checks if the stack is full (stack overflow).


    Places an element on the top of the stack.


    void push(int element, int stack[], int *top, int maxSize) {


           if (*top == maxSize - 1) {


               printf("Stack Overflow\n");


           } else {


               stack[++(*top)] = element;


           }


       }


    2\. Pop Operation:


    Checks if the stack is empty (stack underflow).


    Removes and returns the top element of the stack.


    int pop(int stack[], int *top) {


           if (*top == -1) {


               printf("Stack Underflow\n");


               return -1;


           } else {


               return stack[(*top)--];


           }


       }


    # Understanding Queues


    A queue is another basic linear data structure that operates on the First In,
    First Out (FIFO) principle. It''s similar to a line of people waiting where the
    first person in the line is the first to be served.


    Key Operations:


    Enqueue: Adds an element to the rear of the queue.


    Dequeue: Removes and returns the element from the front of the queue.


    Queue Characteristics:


    Queues are dynamic data structures that can grow as needed.


    The first element added is the first to be removed, hence FIFO.


    # Basic Queue Operations


    Enqueue Operation:


    Checks if the queue is full.


    Adds an element to the rear of the queue.


    void enqueue(int element, int queue[], int *rear, int maxSize) {


           if (*rear == maxSize - 1) {


               printf("Queue Overflow\n");


           } else {


               queue[++(*rear)] = element;


           }


       }


    Dequeue Operation:


    Checks if the queue is empty.


    Removes and returns the front element of the queue.


    int dequeue(int queue[], int *front, int rear) {


           if (*front > rear) {


               printf("Queue Underflow\n");


               return -1;


           } else {


               return queue[(*front)++];


           }


       }


    # Trees and Graphs


    # Introduction to Trees


    Trees are one of the most versatile and commonly used data structures in computer
    science. They are hierarchical structures consisting of nodes, with each node
    having a value and a list of references to other nodes (children).


    Characteristics of Trees:


    1\. Root: The top node in a tree.


    2\. Parent and Child Nodes: Every node (except the root) has one parent and zero
    or more children.


    3\. Leaves: Nodes without children.


    4\. Depth and Height: Depth is the distance to the root, while height is the distance
    to the deepest leaf.


    Types of Trees:


    Binary Trees: Each node has at most two children.


    Balanced Trees: Trees where the depth of all leaves is nearly the same.


    # Tree Operations


    Insertion:


    The process of adding a new node. In binary trees, this often involves maintaining
    certain properties (like in BSTs).


    Deletion:


    Removing a node. In complex trees, this might require reorganizing the tree to
    preserve its properties.


    Traversal:


    In-Order (LNR): Traverse left subtree, visit the node, traverse right subtree.
    Used to get elements in ascending order in BSTs.


    Pre-Order (NLR): Visit the node, traverse left subtree, then right subtree. Used
    to create a copy of the tree.


    Post-Order (LRN): Traverse left subtree, then right subtree, and visit the node
    last. Used to delete the tree.


    # Introduction to Graphs


    Graphs are a set of connected nodes (vertices) where the connections (edges) can
    be directed or undirected. They are used to represent various complex and interconnected
    structures.


    Characteristics of Graphs:


    Nodes (Vertices): The entities in a graph.


    Edges: The connections between nodes. Can be directed (one-way) or undirected
    (two-way).


    Weighted Graphs: Graphs where edges have weights, representing the cost or distance
    of the connection.


    Types of Graphs:


    Directed vs. Undirected: In directed graphs, edges have a direction. In undirected
    graphs, they don''t.


    Cyclic vs. Acyclic: Cyclic graphs contain cycles, while acyclic graphs do not.


    # Graph Representations and Operations


    Representations:


    Adjacency Matrix: A 2D array representing connections between nodes. Space-intensive
    for sparse graphs.


    Adjacency List: A list of lists where each list represents a node and its connected
    nodes. More space-efficient for sparse graphs.


    Operations:


    Traversal:


    Breadth-First Search (BFS): Visits all neighbors at the present depth before moving
    to nodes at the next depth level.


    Depth-First Search (DFS): Explores as far as possible along each branch before
    backtracking.


    Pathfinding Algorithms: Like Dijkstra''s for finding the shortest path in weighted
    graphs.


    Example: Binary Tree Operations


    Binary Tree Structure


    typedef struct TreeNode {


        int value;


        struct TreeNode *left;


        struct TreeNode *right;


    } TreeNode;


    TreeNode* createNode(int value) {


        TreeNode* newNode = (TreeNode*)malloc(sizeof(TreeNode));


        newNode->value = value;


        newNode->left = NULL;


        newNode->right = NULL;


        return newNode;


    }


    Insertion


    TreeNode* insert(TreeNode* root, int value) {


        if (root == NULL) {


            return createNode(value);


        }


        if (value < root->value) {


            root->left = insert(root->left, value);


        } else if (value > root->value) {


            root->right = insert(root->right, value);


        }


        return root;


    }


    In-Order Traversal


    void inOrderTraversal(TreeNode* root) {


        if (root != NULL) {


            inOrderTraversal(root->left);


            printf("%d ", root->value);


            inOrderTraversal(root->right);


        }


    }


    Example: Graph Representations and BFS


    Graph Representation Using Adjacency List


    #define MAX_NODES 100


    typedef struct Graph {


        int numVertices;


        int* adjLists[MAX_NODES];


    } Graph;


    Graph* createGraph(int vertices) {


        Graph* graph = (Graph*)malloc(sizeof(Graph));


        graph->numVertices = vertices;


        for (int i = 0; i < vertices; i++) {


            graph->adjLists[i] = (int*)malloc(vertices * sizeof(int));


            for (int j = 0; j < vertices; j++) {


                graph->adjLists[i][j] = 0;


            }


        }


        return graph;


    }


    Breadth-First Search (BFS)


    void BFS(Graph* graph, int startVertex) {


        int visited[MAX_NODES] = {0};


        int queue[MAX_NODES], front = 0, rear = -1;


        visited[startVertex] = 1;


        queue[++rear] = startVertex;


        while (front <= rear) {


            int currentVertex = queue[front++];


            printf("Visited %d\n", currentVertex);


            for (int i = 0; i < graph->numVertices; i++) {


                if (graph->adjLists[currentVertex][i] && !visited[i]) {


                    queue[++rear] = i;


            for (int i = 0; i < graph->numVertices; i++) {


                if (graph->adjLists[currentVertex][i] && !visited[i]) {


                    queue[++rear] = i;


                    visited[i] = 1;


                }


            }


        }


    }


    This BFS function explores the graph level by level, starting from the `startVertex`.
    It marks each visited vertex to avoid revisiting and uses a queue to keep track
    of vertices to be explored next.


