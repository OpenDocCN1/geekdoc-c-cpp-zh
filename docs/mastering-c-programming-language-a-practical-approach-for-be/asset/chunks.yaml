    #        return 0;


    #    }


    # In these examples, `localVar` is confined to the `add` function, while `globalVar`
    is accessible and modifiable across the entire program.


    # Static Variables


    Static variables in C programming have a unique property: they retain their value
    between function calls and are initialized only once. This behavior contrasts
    with local variables, which are reinitialized every time a function is called.
    Static variables are often used to preserve state information across multiple
    function calls or to count the number of times a function is executed. They are
    declared with the `static` keyword and their scope is limited to the block where
    they are defined, yet their lifetime extends throughout the program execution.


    Here''s a basic example:


    void countFunctionCalls() {


        static int count = 0; // Static variable


        count++;


        printf("Function called %d times\n", count);


    }


    int main() {


        for (int i = 0; i < 5; i++) {


            countFunctionCalls(); // Each call will increment ''count''


        }


        return 0;


    }


    In this example, each time `countFunctionCalls()` is called, the `count` variable
    retains its value and is incremented, demonstrating the persistent nature of static
    variables.


    # Advanced Function Topics


    # Function Pointers


    Function pointers in C are variables that store the address of a function. They
    enable the dynamic calling of functions and are particularly useful in scenarios
    like implementing callback functions, where a function needs to be passed as an
    argument to another function, or in creating function tables for dynamic dispatch.
    A function pointer is declared by specifying the return type and parameter types
    of the function it points to. They add a layer of flexibility to C programming
    by allowing functions to be treated similarly to other variables.


    Here''s an example demonstrating the use of function pointers in C:


    #include <stdio.h>


    void greetMorning() {


        printf("Good morning!\n");


    }


    void greetEvening() {


        printf("Good evening!\n");


    }


    int main() {


        // Declare a function pointer and assign it to greetMorning


        void (*greetFunction)() = greetMorning;


        greetFunction(); // Calls greetMorning


        // Reassign the function pointer to greetEvening


        greetFunction = greetEvening;


        greetFunction(); // Calls greetEvening


        return 0;


    }'
