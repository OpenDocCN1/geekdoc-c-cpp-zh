  md: '# 2 Introduction Effective STL


    # Defining, Using, and Extending the STL


    There is no official definition of “the STL,” and different people mean different
    things when they use the term. In this book, “the STL” means the parts of C++’s
    Standard Library that work with iterators. That includes the standard containers
    (including string), function objects, and algorithms. It excludes the standard
    containers adapters (stack, queue, and priority_queue) as well as the containers
    bitset and valarray, because they lack iterator support. It does not include arrays,
    either. True, arrays support iterators in the form of pointers, but arrays are
    part of the C++ language, not the library.


    Technically, my definition of the STL excludes extensions of the standard C++
    library, notably hashed containers, singly linked lists, ropes, and a variety
    of nonstandard function objects. Even so, an effective STL programmer needs to
    be aware of such extensions, so I mention where they appropriate. Indeed, Item
    25 is devoted to an overview of nonstandard hashed containers. They are not in
    the STL now, but something similar to them are almost certain to make it into
