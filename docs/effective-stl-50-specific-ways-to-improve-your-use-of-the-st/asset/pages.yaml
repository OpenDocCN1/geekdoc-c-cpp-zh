  md: '# The Guidelines in Effective STL


    The guidelines that make up the 50 Items in this book are based on the insights
    and advice of the world''s most experienced STL programmers. These guidelines
    summarize what you should always do — or almost always avoid doing — to get the
    most out of the Standard Template Library. At the same time, they''re just guidelines.
    Under some conditions, it makes sense to violate them. For example, the title
    of Item 7 tells you to invoke delete on new pointers in a container before the
    container is destroyed, but the text of that Item makes clear that this applies
    only when the objects pointed to by those pointers should go away when the container
    does. This is often the case, but it''s not universally true. Similarly, the title
    of Item 35 be-sees you to use STL algorithms to perform simple case-insensitive
    string comparisons, but you''ll be better off using a function that''s not only
    outside the STL, but the text of Item points out that in some cases, you''ll find
    that''s not even part of standard C++


    Only you know enough about the software you''re writing, the environment in which
    it will run, and the context in which it''s being created to determine whether
    it''s reasonable to violate the guidelines. Most of the time, it won''t be, and
    the discussions that accompany each Item explain why. In a few cases, it will.
    Slavish devotion to the guidelines is appropriate, but neither is caval disregard.
    Before venturing off on your own, you should make sure you have a good reason.'
