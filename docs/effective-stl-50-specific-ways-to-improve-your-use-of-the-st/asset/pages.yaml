  md: '# 6 Introduction Effective STL


    behind the complexity guarantees can be confusing if you haven''t been formally
    introduced to the jargon of computer science. Here''s a quick primer on the complexity
    terms I use in this book. Each refers to how long it takes to do something as
    a function of n, the number of elements in a container or range.


    +   - An operation that runs in constant time has performance that is unaffected
    by changes in n. For example, inserting an element into a list is a constant-time
    operation. Regardless of whether the list has one element or one million, the
    insertion takes about the same amount of time.

    - Don''t take the "constant time" too literally. It doesn''t mean that the amount
    of time it takes to do something is literally constant, it just means it''s unaffected
    by n. For example, two STL platforms might take dramatically different amounts
    of time to perform the same "constant-time" operation. This could happen if one
    library has a more sophisticated implementation than another or if one compiler
    performs substantially more aggressive optimization.

    - A variant of time complexity is amortized constant time. Operations that run
    in amortized time are usually constant-time operations, but occasionally they
    take time that depends on n. Amortized time operations typically run in constant
    time.

    - An operation that runs in logarithmic time needs more to run as n gets larger,
    but the time grows at a rate proportional to the logarithm of n. For example,
    an operation on a million items would be expected to take only three times as
    long as a hundred items because log n = 3 log n. Most search operations on associative
    containers (e.g., set:find) are logarithmic-time operations.

    - The time needed to perform an operation that runs in linear time increases at
    a rate proportional to increases in n. The standard algorithm count runs in linear
    time, it has to look at every element of the range it gives. If the range triples
    in size, it has to do three times as much work, and we''d expect it to take about
    three times as long to do it.


    As a general rule, a constant-time operation runs faster than one logarithmic
    time, and a logarithmic-time operation runs faster than one performance is linear.
    This is always true when n gets big enough, but for relatively small values of
    n, it''s sometimes possible for an operation with a worse theoretical complexity
    to outperform an operation with a better theoretical complexity. If you''d like
    to know about STL complexity guarantees, turn to Josutti'' The C++ Standard Library
    [3].'
