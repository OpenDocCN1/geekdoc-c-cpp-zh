    ```


    Now all the characters in inputFile are copied as quickly as you''d like.


    Alas, you might discover that they aren''t copied as quickly as you''d like. The
    operator<>() functions on which istream_iterators perform formatted input, and
    that means they have to undertake a fair amount of work on your behalf each time
    you call them. They have to create and destroy objects (special istream objects
    like operator<>>), they have to perform setup and cleanup actions for each call
    or have to check stream flags that might affect their behavior (e.g., skips),
    they have to perform comprehensive checking for read errors, and if they encounter
    a problem, they have to check determine whether an exception should be thrown.
    Those are all important activities if you''re performing formatted input, but
    if all you want to do is grab the next character from the input stream, it''s
    overkill.


