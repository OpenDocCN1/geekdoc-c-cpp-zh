    I remarked earlier that operator[] is designed to facilitate "add or update" functionality,
    and we now understand that when an "add" is performed, insert is more efficient
    than operator[]. The situation is reversed when we do an update, i.e., when an
    equivalent key (see Item 19) is already in the map. To see why that is the case,
    look at our options:


    ```

    m[k] = v; // use operator[]

    // to update k

    // to value to v

    ```


    ```

    m.insert(IntWidgetMap::value_type(k, v)).second = v; // use insert to

    // update k''s

    // to value to v

    ```


    The syntax alone is probably enough to convince you to favor operator[], but we''re
    focusing on efficiency here, so we''ll overlook that.


    The call to insert requires an argument of type IntWidgetMap::value_type (i.e.,
    pair<int, Widget>), so when we call insert, we must construct and destruct an
    object of that. That costs us a pair constructor and destructor. In, turn, entails
    a Widget construction and destruction, because pair<int, Widget> itself contains
    a Widget object. operator[] uses no pair object, so it constructs and destructs
    no pair and no Widget.


    Efficiency considerations lead us to conclude that insert is preferable to operator[]
    when adding an element to a map, and both efficiency and aesthetics dictate operator[]
    is preferable when updating the value of an element''s already in the map.


    It would be nice if the STL provided a function that offered the best of both
    worlds, i.e., efficient add-or-update functionality in a syntactically attractive
    package. For example, it''s not hard to envision a calling interface such as this:


    ```

    iterator affectedPair = efficientAddOrUpdate(m, k, v); // if k is not in map,
    efficiently

    // add pair(k, v) to m; otherwise

    // efficiently update to v the value

    // associated with k. Return an

    // iterator to the added or

    // modified pair

    ```


    There''s no function like this in the STL, but as the code below demonstrates,
    its not terribly hard to write yourself. The comments summarize what''s going
    on, and the paragraphs that follow provide some additional explanation.'
