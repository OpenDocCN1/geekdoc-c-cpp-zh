    for allocating (and deallocating) memory, but an allocator''s client bears weird
    resemblance to that of operator new, operator new[], or even malloc. Finally (and
    perhaps not remarkable), most of the standard containers never ask their allocator
    for memory. The end result is that allocators are weird, we are weird.


