  md: '# Programming with the STL


    # Item 48: Always #include the proper headers.


    Among the minor frustrations of STL programming is that it is easy to create software
    that compiles on one platform, yet requires additional #include directives on
    others. This annoyance stems from the fact that the Standard for C++ (unlike the
    Standard for C) fails to dictate what standard headers must or be #included by
    other standard headers. Given such flexibility, different implementers have chosen
    to do different things.


    To give you some idea of what this means in practice, I sat down one day with
    STL platforms (let''s call them A, B, C, D, and E), I spent a little time throwing
    you programs at them to see which standard headers I omit and still told me which
    #include other headers. This is what I found:


    +   * With A and C, <vector> #includes <string>.


    +   * With C, <algorithm> #includes <string>.


    +   * With C and D, <iostream> #includes <iterator>.


    +   * With D and E, <string> #includes <string> and <vector>.


    +   * With all five implementations, <set> #includes <functional>.


    Except for the case of <set> #includeinde <functional>, I didn''t find a way to
    get a program with a missing header past implementation B. According to Murphy''s
    Law, then, you will always develop under a platform like A, B, C, D, or E you
    will always be portant under a platform like E, when the pressure for the port
    is greatest and the time to accomplish it is naturally.


    But don''t blame your compilers or library implementations for your porting woes.
    It''s your fault if you''re missing headers. Any time you refer to elements of
    namespace std, you are responsible for having #included the appropriate headers.
    If you omit them, your code might compile anywhere, but you will still be missing
    necessary headers, and other STL platforms may just reject your code.


    To help you remember what''s required when, here''s a quick summary of what''s
    in each standard STL-related headers:


    +   * Almost all the containers are declared in headers of the same name, i.e.,
    vector is declared in <vector>, list is declared in <list>, etc. The exceptions
    are <set> and <map>. <set> declares both set and multiset, and <map> declares
    both map and multimap.'
