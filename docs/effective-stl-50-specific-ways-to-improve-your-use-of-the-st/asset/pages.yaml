  md: '# 24 Item 5 Containers


    time operation. You''d like to design list so it always knows how many elements
    it contains.


    At the same time, you know that of all the standard containers, only list offers
    the ability to splice elements from one place to another without copying any data.
    You reason that many clients will choose splice specifically because it offers
    high-efficiency splicing. They know that splicing a range from one to another
    can be accomplished in constant time, and you know that they know it, so you certainly
    want to meet their expectations that splice is a constant-time member function.


    This puts you in a quandary. If size is to be a constant-time operation, each
    list member function must update the sizes of the lists on which it operates.
    That includes splice. But the only way for the range of splice to update the sizes
    of the lists it modifies is to count the number of elements being spliced, and
    doing that would prevent it from achieving the constant-time performance you want
    for it. If you eliminate the requirement that the range of splice update the sizes
    of the lists it modifies be constant-time, and then size becomes a linear-time
    operation. In general, it will have to traverse its entire data structure to see
    how many elements it contains. No matter how you look at it, something — the range
    of splice — has to give. One or the other can be a constant-time operation, but
    not.


    Different list implementations resolve this conflict in different ways, depending
    on whether their authors choose to maximize the efficiency of size or the range
    of splice. If you happen to be using list implementation where a constant-time
    range form of splice was given higher priority than a constant-time size, you''ll
    be better off calling empty than size, because empty is always a constant-time
    operation. Even if you''re not using such an implementation, you might find yourself
    using such an implementation in the future. For example, you might port your code
    to a different platform where a different implementation of the STL is available,
    or you might just decide to switch to a different implementation for your current
    platform.


    No matter what happens, you can''t go wrong if you call empty instead of checking
    if size() == 0. So call empty whenever you need to know whether a container has
    zero elements.


