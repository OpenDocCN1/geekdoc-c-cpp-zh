    member functions reject reverse_iterators, insisting instead on iterators. To
    perform insertions or erasures, you must convert reverse_iterators into iterator
    base, then use the iterators to get the job done.


    So let''s suppose you want to insert a new element v at the position indicated
    by ri. In particular, let''s assume you want to insert the value 99. Bearing in
    mind that ri is part of a traversal from right to left in the picture above and
    insertion takes place front of the element indicated by the iterator used to specify
    the insertion position, we''d expect the 99 to end up in front of the 3 with respect
    to a reverse traversal. After the insertion, then, v would look like this:


    | 1 | 2 | 3 | 99 | 4 | 5 |


    Of course, we can''t use ri to indicate where to insert something, because it''s
    not an iterator. We must use it instead. As noted above, when ri points to 3,
    i (which is ri.base()) points to 4. That''s exactly where i needs to point for
    an insertion if the inserted value is ended up where it would have been able to
    use ri to specify the insertion location. Conclusion?


    +   - To emulate insertion at a position specified by a reverse_iterator ri, insert
    at the position ri.base() instead. For purposes of insertion, ri and ri.base()
    are equivalent, and ri.base() is truly the iterator corresponding to ri.


    Let us now consider erasing an element. Look again at the relationship between
    ri and i in the original vector (i.e., prior to the insertion of 99):


    ![](img/3b23ad9b34a0bddf8423c8f9e03830da_142_0.png)


    | 1 | 2 | 3 | 4 | 5 |


    If we want to erase the element pointed to by ri, we can''t just use i, because
    i doesn''t point to the same element as ri. Instead, we must erase the element
    preceding i. Hence,


    +   - To emulate erasure at a position specified by a reverse_iterator ri, erase
    at the position preceding ri.base() instead. For purposes of erasure, ri and ri.base()
    are not equivalent, and ri.base() is not the iterator corresponding to ri.'
