  md: "# 80 Item 18 vector string\n\nBut it won't compile. It won't. because vector<bool>\
    \ is a pseudo-container that contains not actual bools, a packed representation\
    \ of bools that is designed to save space. In a typical implementation, each \"\
    bool\" vector occupies a single bit, and an eight-bit byte holds bools. Internally,\
    \ vector<bool> uses the moral equivalent of bitfields to represent the bools it\
    \ pretends to be holding.\n\nLike bools, bitfields represent only two possible\
    \ values, but bitfields masquerading as bools. You may create a pointer to a real\
    \ bool, but pointers to individual bools are forbidden.\n\nReferences to individual\
    \ bits are forbidden, too, and this posed a problem for the design of vector<bool>'s\
    \ interface, because the return type of vector<T>::operator[] is supposed to be\
    \ T&. That wouldn't be a problem if vector<bool>::operator[] really held bools,\
    \ because it doesn't, vector would need somehow to reference to a bit, and there's\
    \ no such thing.\n\nTo deal with this, vector<bool>::operator[] returns an object\
    \ that acts like a reference to a bit, so a-called proxy object. (You don't need\
    \ to understand proxy objects to the STL, they're a C++ technique worth knowing\
    \ about. For information about them, consult Item 30 of More Effective C++ as\
    \ well as the \"Proxy\" chapter in Gamma et al.'s Design Patterns [6]. Stripped\
    \ down to the bare essentials, vector<bool> looks like:\n\n```\ntemplate <typename\
    \ Allocator>\nvector<bool, Allocator> {\n    class reference { ... }; // class\
    \ to generate proxies for references to individual bits\n    reference operator[](size_type\
    \ n); // operator[] returns a proxy\n    ... \n};\n```\n\nNow it's clear why this\
    \ code won't compile:\n\n```\nvector<bool> v;\nbool *pb = &v[0]; // error! the\
