  md: '# Locales and Case-Insensitive String Comparisons


    Item 35 explains how to use mismatch and lexicographical_compare to implement
    case-insensitive string comparisons, but it also points out that a truly general
    solution to the problem must take locales into account. This book is about the
    STL, not internationalization, so I have next to nothing to say about locales.
    Matt Austen, author of Generic Programming and the STL [4], addressed the locale
    aspects of case-insensitive string in a column in the May 2000 C++ Report [111].
    In the interest of telling the whole story on this important topic, I am pleased
    to reprint his column here, and I am grateful to Matt and 101communications for
    granting me permission to do so.


    # ## How Do Case-Insensitive String Comparison

    ### by Matt Austen


    If you''ve ever written a program that uses strings (and who hasn''t?), chances
    you''ve sometimes needed to treat two strings that differ only by case if they
    were identical. That is, you needed comparisons — equality, less than, substring
    matches, sorting — to disregard case. And, one of the most frequently asked questions
    about the Standard C++ Library is how to make strings insensitive. This question
    has been answered many times. Many of the answers are wrong.


    First of all, let''s dispose of the idea that you were looking for a way to write
    a case-insensitive string class. Yes, it''s technically possible, more or less.
    The Standard Library type std::string is really just an alias for the template
    std::basic_string<char,char::traits<char>, std::allocator<char>>. It uses the
    traits parameter for all comparisons, so by providing a traits parameter with
    equality and less than redefined appropriately, you can instantiate basic_string
    in such a way so that the < and == operators are case insensitive. You can do
    it, but it isn''t the trouble.'
