  md: '# Containers


    Sure, the STL has iterators, algorithms, and function objects, but for most C++
    programmers, it''s the containers that stand out. More powerful and flexible than
    arrays, they grow (and often shrink) dynamically, manage their own memory, keep
    track of how many objects they hold, bound the algorithmic complexity of the operations
    they support, and, much more. Their popularity is easy to understand. They''re
    simply better than their competition, regardless of whether competition comes
    from containers in other libraries or is a container type you wrote yourself.
    STL containers aren''t just good. They''re really good.


    This chapter is devoted to guidelines applicable to all the STL containers. Later
    chapters focus on specific container types. The topics addressed here include
    selecting the appropriate container given the constraints you face; avoiding the
    delusion that code written for one container type is likely to work with other
    container types; significance of copying operations for objects in containers;
    difficulties when pointers or auto_ptrs are stored in containers; the ins and
    outs of erasing: what you can and cannot accomplish with custom allocators; tips
    on how to maximize efficiency; and considerations for using containers in a threaded
    environment.


    That''s a lot to cover, but don''t worry. The Items break it down into bite-sized
    chunks, and along the way, you''re almost sure to pick up several ideas you can
    apply to your code now.


    # Item 1: Choose your containers with care.


    You know that C++ puts a variety of containers at your disposal, but do you realize
    just how varied that variety is? To make sure you haven''t overlooked any of your
    options, here''s a quick review.


    +   - The standard STL sequence containers, vector, string, deque, and list.'
