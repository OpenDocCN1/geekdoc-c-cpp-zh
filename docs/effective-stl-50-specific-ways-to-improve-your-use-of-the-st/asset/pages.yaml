  md: '# Item 22: Avoid in-place key modification in set and multiset.


    The motivation for this Item is easy to understand. Like all the associative containers,
    set and multiset keep their elements in sorted order, and the proper behavior
    of these containers is dependent on their remaining sorted. If you change the
    value of an element in an associative container (e.g., change a 10 to 1000), the
    new value might not be in the correct location, and that would break the sorted
    of the container. Simple, right?


    It''s especially simple for map and multimap, because programs that attempt to
    change the value of a key in these containers won''t compile:


    ```

