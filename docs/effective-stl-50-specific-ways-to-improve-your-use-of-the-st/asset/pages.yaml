    # Item 12: Have realistic expectations about the thread safety of STL containers.


    The world of standard C++ is rather sheltered and old-fashioned. In this rarefied
    world, all executables are statically linked. Neither memory-mapped files nor
    shared memory exist. There are no window systems, no networks, no databases, no
    other processes. Being the case, you should not be surprised to learn that the
    Standard says not a word about threading. The first expectation you should have
    about the thread safety of the STL, then, is that it will vary from implementation.


    Of course, multithreaded programs are common, so most STL vendors strive to make
    their implementations well in a multithreaded environment. Even when they do a
    good job, much of the burden remains on your shoulders, and it''s important to
    understand why. There''s so much STL vendors can do to ease your multithreading
    pain, and you need to know what it is.


    The gold standard in support for multithreading in STL containers (and the aspiration
    of most vendors) has been defined by SGI and is published at their STL Web Site
    [21]. In essence, it says that the most you can hope for from an implementation
    is the following.


    +   **Multiple readers are safe.** Multiple threads may simultaneously read the
    contents of a single container, and this will work correctly. Naturally, there
    must not be any writers acting on the container during the reads.


    +   **Multiple writers to different containers are safe.** Multiple threads may
    simultaneously write to different containers.


    That''s all, and let me make clear that this is what you can hope for, not what
    you can expect. Some implementations offer these guarantees, but some do not.'
