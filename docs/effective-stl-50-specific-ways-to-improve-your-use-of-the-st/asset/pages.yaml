  md: '# 4 Iterators


    At first glance, iterators appear straightforward. Look more closely, however,
    and you''ll notice that the standard STL containers offer four different iterator
    types: iterator, const_iterator, reverse_iterator, and const_reverse_iterator.
    From there it''s only a matter of time until you note that of these four types,
    only one is accepted by containers in certain forms of insert and erase. That''s
    when the questions begin. Why four iterator types? What is the relationship among
    them? Are they interchangeable? Can the different types be mixed in calls to algorithms
    and STL utility functions? How do these types relate to containers and their member
    functions?


    This chapter answers these questions, and it introduces an iterator type that
    deserves more notice than it usually gets: istambuf_iterator. If you use the STL,
    but you''re unhappy with the performance of istream_iterators when reading character
    streams, istambuf_iterator could be the tool you''re looking for.


    Item 26: Prefer iterator to const_iterator, reverse_iterator, and const_reverse_iterator.


    As you know, every standard container offers four types of iterator. For a container<T>,
    the type iterator acts like a T*, while const_iterator acts like a T*; which you
    may also see as a const T*; they mean the same thing. Incrementing an iterator
    or a const_iterator moves you to the next element in the container in a traversal
    starting at the front of the container and proceeding to the back. reverse_iterator
    and const_reverse_iterator also act like T* and const T*, respectively, except
    that incrementing these iterator types moves you to the next element in the container
    in a traversal from back to front.


    Let me show you two things. First, take a look at some signatures for insert and
    erase in vector<T>:'
