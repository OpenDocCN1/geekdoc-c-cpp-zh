    The standard associative containers are typically implemented as balanced binary
    trees. A balanced binary tree is a data structure that is optimized for a mix
    of insertions, erasures, and lookups. That is, it''s designed for applications
    that do some insertions, then some lookups, then maybe more insertions, then some
    erasures, then more lookups, etc. The key characteristic of this sequence of events
    is that the insertions, erasures, and lookups are all mixed up. In general, there''s
    no way to predict what the next operation on the tree will be.


    Many applications use their data structures in a less chaotic manner. Their use
    of data structures falls into three distinct phases, which can be summarized like
    this:


    +   Setup. Create a new data structure by inserting lots of elements into it.
    During this phase, almost all operations are insertions and erasures. Lookups
    are rare or nonexistent.


    +   Lookup. Consult the data structure to find specific pieces of information.
    During this phase, almost all operations are lookups. Insertions and erasures
    are rare or nonexistent. There are so many lookups, the performance of this phase
    makes the performance of the other phases incidental.


    +   Reorganize. Modify the contents of the data structure, perhaps by erasing
    all the current data and inserting new data in its place. Behaviorally, this phase
    is equivalent to phase 1. Once this phase is completed, the application returns
    to phase 2.


