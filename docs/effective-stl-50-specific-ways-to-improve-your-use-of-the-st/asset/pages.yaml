  md: '# 5 Algorithms


    I noted at the beginning of Chapter 1 that containers get the lion''s share of
    the STL acclaim. In a sense, that''s understandable. The containers are remarkable
    accomplishments, and they make life easier for legions of C++ programmers on a
    daily basis. Still, the STL algorithms are significant in their own right, equally
    capable of lightening a developer''s burden. In fact, given that there are over
    100 algorithms, it''s easy to argue that they offer more finely honed tool than
    the containers (a mere eight strong) could ever hope to match. Perhaps their number
    is part of the problem. Making sense of eight distinct container types is surely
    less work than remembering 70 algorithm names and trying to keep track of what
    each does.


    I have two primary goals in this chapter. First, I want to introduce you to some
    lesser-known algorithms by showing you they can make your life easier. Rest assured
    that I''m not going to punish you with lists of names to memorize. The algorithms
    I show you are in this chapter because they solve common problems, like performing
    case-sensitive string comparisons, efficiently the n most desirable objects in
    a container, summarizing the characteristics of all the objects in a range, and
    implementing the behavior of copy_if (an algorithm from the original HP STL that
    was dropped during standardization).


    My second goal is to show you how to avoid usage problems with the algorithms.
    You can''t remove, for example, its cousins remove if and unique unless you understand
    exactly these algorithms do (or do not). This is especially true when the range
    from which you''re removing something holds pointers. Similarly, a number of algorithms
    work only with sorted ranges, so you need to understand which they are and why
    they impose that constraint. Finally, one of the most common algorithm-related
    mistakes involves asking an algorithm to write its results to a place that doesn''t
    exist, so I explain how this absurdity can come about and how to ensure you''re
    not afflicted.'
