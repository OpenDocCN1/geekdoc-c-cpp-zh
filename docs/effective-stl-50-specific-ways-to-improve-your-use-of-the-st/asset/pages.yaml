    # A Workaround for MSVC4–5


    Look again at the code examples that fail to compile with the STL that accompanies
    MSVC4-6:


    ```

    vector<Widget> vw(begin, end); // rejected by MSVC4-6

    // STL implementation

    ```


    ```

    list<Widget> lw;

    lw.assign(vw.rbegin(), vw.rend()); //also rejected

    ```


    ```

    SpecialContainer<Widget> scw;

    ...

    sc.insert(scw.end(), lw.begin(), lw.end()); // ditto

    ```


    These calls look rather different, but they all fail for the same reason: missing
    member function templates in the STL implementation. There''s a single case for
    all of them: use copy and an insert iterator (see Item 30) instead. Here, for
    example, are the workarounds for the examples above:


    ```

    istream<Widget> begin(cin, end);

    vector<Widget> vw;

    copy(begin, end, back_inser(vw)); // default-construct vw

    // then the copy

    // Widgets in cin into it

    ```


    ```

    list<Widget> lw;

    lw.clear();

    copy(vw.begin(), vw.rend(), back_inser(lw)); // eliminate lw''s old

    // Widgets: copy over

    // vw''s Widgets (in

    // reverse order

    ```


    ```

    SpecialContainer<Widget> scw;

    ...

    copy(lw.begin(), lw.end(),

    inser(scw, scw.end())); // copy lw Widgets to

    // the end of sc

    ```


    I encourage you to use these copy-based workarounds with the library that ships
    with MSVC4-5, but beware! Don''t fall into the trap of coming comfortable with
    the workarounds, you forget that they are workarounds. Item 5 explains, using
    the copy algorithm is almost always inferior to using a range member function,
    so as soon as you have a chance to upgrade your STL platform to one that supports
    member function templates, stop using copy in places where range member functions
    are the proper approach.'
