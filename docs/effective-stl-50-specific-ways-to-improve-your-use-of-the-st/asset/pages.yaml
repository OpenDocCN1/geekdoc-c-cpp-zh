  md: '# 3

    Associative Containers


    Somewhat like the polychromatic horse in The Wizard of Oz movie, the associative
    containers are creatures of a different color. True, they share many characteristics
    with the sequence containers, but they differ in a number of fundamental ways.
    For example, they automatically keep themselves sorted; they view their contents
    through the lens of equivalence instead of equality; sets and multimaps generally
    ignore duplicate entries; and maps reject half of each object they contain. Yes,
    the associative containers are containers, but if you exclude my liking vectors
    and strings to Kansas, we are definitely not in Kansas any more.


    In the Items that follow, I explain the critical notion of equivalence, describe
    an important custom comparison functions for associative containers of pointers,
    discuss the official and practical sides of key constness, and offer advice on
    improving the efficiency of associative containers.


    At the end of the chapter, I examine the STL''s lack of containers based on hash
    tables, and I survey two common (nonstandard) implementations. Though the STL
    proper doesn''t offer hash tables, you need not write your own or do without.
    High-quality implementations are readily available.


    # Item 19: Understand the difference between equality and equivalence.


    The STL is awash in comparisons of objects to see if they have the same value.
    For example, when you ask to locate the first object in a range with a particular
    value, find has to be able to compare two objects to see if the value of one is
    the same as the value of the other. Similarly, when you attempt to insert a new
    element into a set, set::insert has to be able to determine whether that element''s
    value is already in the set.'
