  md: '# 7 Programming with the STL


    It''s traditional to summarize the STL as consisting of containers, iterators,
    algorithms, and function objects, but programming with the STL is much more than
    that. Programming with the STL is knowing when to use loops, when to use algorithms,
    and when to use member functions. It''s knowing when find equal_range, knowing
    when lower_bound is preferable to find, and knowing find beats equal_range. It''s
    knowing how to improve algorithm performance by substituting functors for functions
    that do the same thing. It''s knowing how to avoid unacceptable or incomprehensible
    code. It''s knowing how to read compiler error messages that run to thousands
    of characters. And it''s knowing about Internet resources for STL documentation,
    STL extensions, even complete STL implementations.


    Yes, programming with the STL involves knowing many things. This chapter gives
    you much of the knowledge you need.


    # Item 43: Prefer algorithm calls to hand-written loops.


    Every algorithm takes at least one pair of iterators that specify a range of objects
    over to do something, min_element finds the smallest value in the range, for example,
    while accumulate summarizes information about the range as a whole (see Item 37)
    and partition separates all the elements of a range into those that do not satisfy
    some criterion (see Item 31). For algorithms to do their work, they must examine
    every object in the range(s) they are passed, and do this in the way you''d expect;
    they loop from the beginning of the range(s) to the end. Some algorithms, such
    as find and find_if, may return before they complete the traversal, but even these
    algorithms internally contain a loop. After all, even find and find_if must look
    every element of a range before they can conclude that what they are looking for
    is not present.'
