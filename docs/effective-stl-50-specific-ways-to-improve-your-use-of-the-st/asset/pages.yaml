  md: '# 138 Item 31 Algorithms


    +   - If you need to perform a full sort on a vector, string, deque, or array,
    you can use sort or stable_sort.


    +   - If you have a vector, string, deque, or array and you need to put only the
    top n elements in order, partial_sort is available.


    +   - If you have a vector, string, deque, or array and you need to identify the
    element at position n you need to identify the top n elements without putting
    them in order, nth_element is at your beck and call.


    +   - If you need to separate the elements of a standard sequence container or
    an array into those that do not satisfy some criteria, you''re probably looking
    for partition or stable_partition.


    +   - If your data is a list, you can use partition and stable_partition directly,
    and you can use list::sort in place of sort and stable_sort. If you need the effects
    offered by partial_sort or nth_element, you''ll have to approach the task indirectly,
    and there are a number of options, as I sketched above.


    In addition, you can keep things sorted at all by storing your data in a standard
    associative container. You might also consider the non-STL container priority_queue,
    which also keeps its elements ordered all the time. (priority_queue is traditionally
    considered part of the STL, and as I noted in the Introduction, my definition
    of "the STL" containers support iterators, and priority_queue doesn''t do iterators.)


    “But what performance?”, you wonder. Excellent question. Broadly speaking, algorithms
    that do more work take longer to do it, and algorithms that must sort stably take
    longer than algorithms that ignore stability. We can order the algorithms we''ve
    discussed in this item as follows, with algorithms that tend to use fewer resources
    (time and space) listed before that require more:


    +   1. partition

    2. stable_partition

    3. nth_element

    4. partial_sort

    5. sort

    6. stable_sort


    My advice on choosing the sorting algorithms is to make your selection based on
    what you need to accomplish, not on performance considerations. If you choose
    an algorithm that only does what you need to do (e.g., a partition instead of
    a full sort), you''re likely to end up with code that''s not only the clearest
    expression of what you want to do, it''s also the most efficient way to accomplish
    it using the STL.'
