    be able to get away with using it in a large program, but you''ll have a maintenance
    problem: maybe you can prove that no other module calls setlocale, but can you
    prove that no module in next year''s version of the program will call setlocale?


    There''s no good solution to this problem in C. The C library has a global locale,
    and that''s a solution in C++.


    # Locales in C++


    A locale in the C++ Standard Library isn''t global data buried deep within the
    library implementation. It''s an object of type std::locale, and you can create
    and pass it to functions just like any other object. You can create a locale object
    that represents the usual locale, for example, by writing


    ```

    std::locale L = std::locale::classic();

    ```


    or you can create a German locale by writing


    ```

    std::locale L("de");

    ```


