    of why they are better choices, briefly, because they''re faster and they behave
    more naturally. Fortunately, the member functions usually have the same names
    as the corresponding algorithms, so where the foregoing discussion recommends
    you choose algorithms find, equal_range, lower_bound, or upper_bound, you simply
    select the same-named member functions when searching associative containers.
    binary_search calls for a different strategy, because there is no member function
    analogue to this. To test for the existence of a value in a set or map, use count
    in its idiomatic role as a test for membership:


    ```

    set<Widget> s; // create set, put data into

    ...

    Widget w; // w still holds the value to search for

    if (s.count(w)) { // a value equivalent to w exists

    } else {

    // no such value exists

    }

    ```


    To test for the existence of a value in a multiset or multimap, find is generally
    superior to count, because find can stop once it''s found a single object with
    the desired value, while count, in the worst case, must examine every object in
    the container. (This isn''t a problem when working with sets and maps, because
    sets don''t allow duplicate values and maps don''t allow duplicate keys.)


    However, count''s role for counting things in associative containers is secure.
    In particular, it''s a better choice than calling equal_range and applying distance
    to the resulting iterators. For one thing, it''s clearer: count means "count."
    For another, it''s easier; there''s no need to create a pair and pass its components
    to distance. For a third, it''s probably a little faster.'
