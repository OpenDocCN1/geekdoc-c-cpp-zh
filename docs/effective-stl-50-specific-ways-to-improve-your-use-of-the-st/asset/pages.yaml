    \ templates.\n\nFor example, here's the Dinkumware hash_set declaration (again,\
    \ tweaked for presentation):\n\n```\ntemplate<typename T, typename CompareFunction>\n\
    class hash_compare;\n\ntemplate<typename T,\nHashingInfo = hash_compare<T, less<T>>,\n\
    typename Allocator = allocator<T>>\nclass hash_set;\n```\n\nThe interesting part\
    \ of this interface design is the use of HashingInfo. The container's hashing\
    \ and comparison functions are stored there, but the HashingInfo type also holds\
    \ enums controlling the minimum number of buckets and maximum allowable ratio\
    \ of elements to buckets. When this ratio is exceeded, the number of buckets in\
    \ the table is increased, and some elements are rehashed. (SGI provides member\
    \ functions that afford similar control over the number of table buckets and,\
    \ hence, the ratio of elements to buckets.)\n\nAfter some tweaks for presentation,\
    \ hash_compare (the default value for HashingInfo) looks more or less like this:\n\
    \n```\ntemplate<typename T, typename CompareFunction = less<T>>\nclass hash_compare\
    \ {\npublic:\nnenum {\n    bucket_size = 4, // max ratio of elements to buckets\n\
