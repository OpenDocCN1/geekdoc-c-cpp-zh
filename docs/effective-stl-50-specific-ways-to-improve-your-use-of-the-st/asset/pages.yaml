    # Item 39: Make predicates pure functions.


    I hate to do this to you, but we have to start with a short vocabulary lesson.


    +   A predicate is a function that returns bool (or something can be implicitly
    converted to bool). Predicates are widely used in the STL. The comparison functions
    for the standard associative containers are predicates, and predicate functions
    are commonly passed as parameters to algorithms like find_if and the various sorting
    algorithms. (For an overview of the sorting algorithms, turn Item 31.)


    +   A pure function is a function whose return value depends only on its parameters.
    If f is a pure function and x and y are objects, the return value of f(x,y) can
    change only if the value of x or y changes.


    In C++, all data consulted by pure functions are either passed as parameters or
    are constant for the life of the function. (Naturally, such constant data should
    be declared const.) If a pure function consulted data that might change between
    calls, invoking the function at different times with the same parameters might
    yield different results, and that would be contrary to the definition of a pure
    function.


    That should be enough to make it clear what it means to make predicates pure functions.
    All I have to do now is convince you that the advice is well voided. To help me
    do that, I hope you will forgive me for burdening you with one more term.


    +   A predicate class is a class whose operator() function returns true or false
    (or something that can be implicitly converted to true or false). As you might
    expect, any place the STL expects a predicate, it will accept either a real predicate
    or an object of a predicate class.


