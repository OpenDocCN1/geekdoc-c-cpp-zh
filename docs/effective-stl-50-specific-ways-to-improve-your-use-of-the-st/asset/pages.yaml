  md: '# Remarks on Microsoft’s STL Platforms


    In the opening pages of this book, I introduced the term STL platform to refer
    to the combination of a particular compiler and a particular implementation of
    the Standard Template Library. If you are using version 6 or earlier of a Microsoft
    Visual C++ compiler (i.e., a compiler that ships with version 6 or earlier of
    Microsoft’s Visual Studio), the distinction between a compiler and a library is
    particularly important, because the compiler is sometimes more capable than the
    accompanying STL implementation suggests. In this appendix, I describe important
    shortcoming of older Microsoft STL platforms and I offer workarounds that can
    significantly improve your STL experience.


    The information that follows is for developers using Microsoft Visual C++ (MSVC)
    versions 4-6. If you''re using Visual C++ .NET, your STL platform doesn''t have
    the problems described below, and you may ignore this appendix.


    # Member Function Templates in the STL


    Suppose you have two vectors of Widgets and you''d like to copy the Widgets in
    one vector to the end of another. That''s easy. Just use vector''s range insert
    function (see Item 5):


    ```

    vector<Widget> vw1, vw2;

    ...

    vw1.insert(vw1.end(), vw2.begin(), vw2.end()); // append to vw1 a copy

    // of the Widgets in vw2

    ```


    If you have a vector and a deque, you do the same same thing:


    ```

    vector<Widget> vw;

    deque<Widget> dw;

    ...

    vw.insert(vw.end(), dw.begin(), dw.end()); // append to vw a copy

    // of the Widgets in dw

    ```'
