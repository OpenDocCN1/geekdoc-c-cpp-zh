    # An Additional Workaround for MSVC6


    You can use the MSVC4-5 workaround with MSVC6, too, but for MSVC6 there is another
    option. The compilers that are part of MSVC4-5 offer no meaningful support for
    member function templates, so that the STL implementation lacks them immature.
    The situation is different with MSVC6, because MSVC6''s compiler does support
    member function templates. It thus becomes reasonable to consider replacing the
    STL that ships with MSVC6 with an implementation that provides the member function
    templates the Standard prefers.


    Item 50 explains that both SGI and STLport offer freely downloadable STL implementations,
    and both of them count the MSVC6 compiler as one with which they will work. You
    can also purchase the latest MSVC-compatible STL implementation from Dinkummer.
    Each has advantages and disadvantages.


    SGI''s and STLport''s implementations are free, and I suspect you know what means
    regards official for the software: there isn''t any. Furthermore, because SGI
    and STLport design their libraries to work with a variety of compilers, you will
    probably have to manually configure them to get the most out of MSVC6. In particular,
    you may have to explicitly enable support for member function templates, working
    with many compilers as they do, SGI and/or STLport may not enable by default.
    You may also have to worry about linking with other MSVC6 libraries (especially
    DLLs), things like making sure you use the appropriate builds for threading and
    debugging, etc.


    If kind of thing scares you, or if you''ve been known to grumble that you can''t
    afford free software, you may want to look into Dinkummer''s replacement library
    for MSVC6. It''s designed to drop-in compatible with the native MSVC6 STL and
    to maximize MSVC6''s adherence to the Standard as an STL platform. Since Dinkummer
    authored the STL that ships with MSVC6, there''s a decent chance their latest
    STL implementation really is a drop-in replacement. To learn more about Dinkummer
    STL implementations, visit the company''s website: http://www.dinkummer.com/.


    Regardless of whether you choose SGI, STLport''s, or Dinkummer''s implementation
    as an STL replacement, you''ll do more than gain an STL with member function templates.
    You''ll also bypass conformance problems in other areas of the library, such as
    failing to declare push_back. Furthermore, you''ll gain access to useful STL extensions,
    including hashed counters (see Item 25) and singly linked lists (slists).'
