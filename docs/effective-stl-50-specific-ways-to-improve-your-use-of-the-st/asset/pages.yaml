  md: '# Containers Item 1 13


    In a moment, we''ll examine some of the important container-related issues, but
    first I need to introduce a way of categorizing the STL containers that isn''t
    confused as it should be. That is the distinction between contiguous-memory containers
    and node-based containers.


    Contiguous-memory containers (also known as array-based containers) store their
    elements in one or more (dynamically allocated) chunks of memory, each chunk holding
    more than one container element. If a new element is inserted or an existing element
    is erased, other elements in the same memory chunk have to be shifted up or down
    to make room for the new element or to fill the space formerly occupied by the
    erased element. This kind of movement affects both performance (see Items 5 and
    14) and exception safety (as we will see soon). The standard contiguous-memory
    containers are vector, string, and deque. The nonstandard rope is also a contiguous-memory
    container.


    Node-based containers store only a single element per chunk of (dynamically allocated)
    memory. Insertion or erasure of a container element affects only pointers to nodes,
    not the contents of the nodes themselves. Containers representing linked lists,
    such as list and set, are node-based as are the standard associative containers
    (They''re typically implemented as balanced trees). The nonstandard hashed containers
    use varying node-based implementations, as you''ll see in Item 25.


    With this terminology out of the way, we''re ready to sketch some of the questions
    most relevant when choosing among containers. In this discussion, I omit consideration
    of non-STL like containers (e.g., arrays, bitsets, etc.), because this is, after
    all, a book on the STL.


    +   - Do you need to be able to insert a new element at an arbitrary position
    in the container? If so, you need a sequence container; associative containers
    won''t.


    +   - Do you care how elements are ordered in the container? If not, a hashed
    container becomes a viable choice. Otherwise, you''ll want to avoid hashed containers.


    +   - Must the container be part of standard C++? If so, that eliminates hashed
    containers, slist, and rope.


    +   - What category of iterators do you require? If they must be random access
    iterators, you''re technically limited to vector, deque, and string, but you''d
    probably want to consider rope, too. (See Item 50'
