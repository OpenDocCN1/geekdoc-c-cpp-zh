    only vector supports that (see Item 16). You can''t instantiate your container
    with bool the type of objects to be stored, because Item 18 vector<bool doesn''t
    behave like a vector, and it never actually stores bool. You can''t assume list''s
    constant time insertions and erasures, because vector and deque take linear time
    to perform these operations.


    When all is said and done, you''re left with a "generalized sequence container"
    where you can''t reserve, capacity, operator[], push_front, pop_front, splice,
    or any algorithm requiring random access iterators; a container where every call
    to insert and erase takes linear time and invalidates all iterators, pointers,
    and references; and a container incompatible with C bool cannot be stored. That
    is really the kind of container you want to use in your applications? I suspect
    not.


    If you rein in your ambition and decide you''re willing to drop support for list,
    still give up reserve, capacity, push_front, and pop_front; you still must assume
    that all calls to insert and erase take linear time and invalidate everything;
