  md: '# 112 Item 25 Associative Containers


    If you like hash tables, however, take heart. You need not do without or roll
    your own. STL-compatible hashed associative containers are available from multiple
    sources, and they even have de facto standard names: hash_set, hash_multiset,
    hash_map, and hash_multimap.


    Behind these common names, different implementations, er. differ. They differ
    in their interfaces, their capabilities, their underlying data structures, and
    the relative efficiency of the operations they support. It''s still possible to
    write reasonably portable code using hash tables, but it''s not as easy as it
    would have been the hashed containers were standardized. (Now you know which standards
    are important.)


    Of the several available implementations for hashed containers, the two most common
    are SGI (see Item 50) and Dinkumware (Appendix B), so in what I follow, I restrict
    myself to the designs of the hashed containers from these vendors. STLport (again,
    see Item 50) also offers hashed containers, but the STLport hashed containers
    are based on those by SGI. For purposes of this item, assume that whatever I write
    about SGI hashed containers applies to the STLport hashed containers, too.


    Hashed containers are associative containers, so it should not surprise you, like
    all associative containers, they need to know the type of objects stored in the
    container, the comparison function for such objects, and the allocator for these
    objects. In addition, hashed containers require specification of a hashing function.
    That suggests the following declaration for hashed containers:


    ```

    template<typename T,

    type HashFunction,

    type CompareFunction,

    type Allocator = allocator<T>

    class hash_container;

    ```


    This is quite close to the SGI declaration for hashed containers. The primary
    difference is that SGI provides default types for HashFunction and CompareFunction.
    The SGI declaration for hash_set looks like this (I''ve tweaked it a bit for presentation
    purposes):


    ```

    template<typename T,

    type HashFunction = hash<T>,

    type CompareFunction = equal_to<T>,

    type Allocator = allocator<T>

    class hash_set;

    ```


    A noteworthy aspect of the SGI design is the use of equal_to as the default comparison
    function. This is a departure from the conventions of the standard associative
    containers, where the default comparison function is less. This design decision
    signifies more than a simple'
