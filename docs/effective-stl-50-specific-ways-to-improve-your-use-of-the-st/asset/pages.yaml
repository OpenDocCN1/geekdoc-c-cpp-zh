    makes the case for preferring member functions pretty iron-clad.


    Let us move on to list member functions that have the same names as STL algorithms.
    Here the story is almost completely about efficiency. Each of the algorithms that
    list specializes (remove, remove_if, unique, sort, and reverse) copies objects;
    they simply manipulate the pointers connecting list nodes. The algorithmic complexity
    of the algorithms and the member functions is the same, but, under the assumption
    that the manipulating pointers is less expensive than copying objects, list''s
    versions of these functions should offer better performance.


    It''s important to be aware that the list member functions often behave differently
    from their algorithm counterparts. As Item 32 explains, calls to the algorithms
    remove, remove_if, and unique must be followed by calls to erase if you really
    want to eliminate objects from a container, list''s remove, remove_if, and unique
    honestly get rid of elements; no subsequent call to erase is necessary.


    A significant difference between the sort algorithm and list''s sort function
    is that the former cannot be applied to lists. Being only bidirectional iterators,
    list''s iterators cannot be passed to sort. A gulf also exists between the behavior
