    # Item 46: Consider function objects instead of functions as algorithm parameters.


    One of the complaints about programming in high-level languages is that as the
    level of abstraction gets higher, the efficiency of the generated code gets lower.
    In fact, Alexander Stepanov (the inventor of the STL) once produced a small benchmark
    suite to measure the "abstraction penalty" of C++ vis-à-vis C. Among other things,
    the results of benchmark revealed that it''s nearly universal for the code generated
    for manipulating a container containing double to be less efficient than the corresponding
    code for manipulating a double directly. It may come thus as a surprise to learn
