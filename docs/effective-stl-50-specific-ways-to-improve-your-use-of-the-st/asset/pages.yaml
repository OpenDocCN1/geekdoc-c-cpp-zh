    its source ranges, but list:merge always modifies the lists it works on.


    So there you have it. When faced with a choice between an STL algorithm or a container
    member function with the same name, you should prefer the member function. It''s
    almost certain to be more efficient, and it''s likely to be better integrated
    with the container''s usual behavior, too.


