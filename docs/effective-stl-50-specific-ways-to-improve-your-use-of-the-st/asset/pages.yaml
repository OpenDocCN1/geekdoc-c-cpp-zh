  md: '# Algorithms Item 31 135


    As you see, the call to nth_element is essentially identical to the call to partial_sort.
    The only difference in their effect is that partial_sort sorts the elements in
    positions 1-20, while nth_element doesn''t. Both algorithms, however, move the
    20 highest-quality Widgets to the front of the vector.


    That gives rise to an important question. What do these algorithms do when there
    are elements with the same level of quality? Suppose, for example, there are 12
    elements with a quality rating of 1 (the best possible) and 15 elements with a
    quality rating of 2 (the next best). In that case, choosing the 20 best Widgets
    involves the 12 with a rating of 1 and 8 of the 15 with a rating of 2. How should
    partial_sort and nth_element decide which of the 15 to put in the top 20? For
    that matter, how should sort figure out which order to put elements in when multiple
    elements have equivalent values?


    partial_sort and nth_element order elements with equivalent values any way they
    want, and you can''t control this aspect of their behavior. (See Item 19 for what
    it means for two values to be equivalent.) In our example, when faced with the
    need to choose Widgets with a quality rating of 2 to put into the last 8 spots
    in the vector''s top 20, they''d choose whichever they wanted. If you ask for
    the 20 best Widgets and some Widgets are equally good, you''re in no position
    to complain as long as the 20 you get back are as good as the ones you didn''t.


    For a full sort, you have slightly more control. Some sorting algorithms are stable.
    In a stable sort, if two elements in a range have equivalent values, their relative
    positions are unchanged after sorting. Hence, if Widget A precedes Widget B in
    the (unsorted) vector and both have the same quality rating, a stable sorting
    algorithm will guarantee that after the vector is sorted, Widget A precedes Widget
    B. An algorithm that is not stable would not make this guarantee.


    partial_sort is not stable. Neither is nth_element, too, fails to offer stability,
    but there is an algorithm, stable_sort, that does what its name suggests. If you
    need stability when you sort, you''ll want to use stable_sort. The STL does not
    contain stable versions of partial_sort or nth_element.


    Speaking of nth_element, this curiously named algorithm is remarkably versatile.
    In addition to letting you the n elements of a range, it can also be used to find
    the median value in a range or to find the value at a particular percentile:'
