    Admittedly, the above error message isn''t clear as it might be, and it''s unfortunate
    that the reported file and line correspond to the location of the internal STL
    assertion instead of the line transforming, but this is still a lot better than
    running past the call to transform, trying to figure out why your data structures
    are corrupt. With STLport''s debug mode, all you need to do is fire up your debugger
    and walk the stack back into the code you wrote, then determine what you did wrong.
    Finding the offending source line is generally not a problem.


    STLport''s debug mode detects a variety of common errors, including passing invalid
    ranges to algorithms, attempting to read from an empty container, using an iterator
    from one container to a second container''s member function, etc. It accomplishes
    this magic by having iterators and their containers track one another. Given two
    iterators, it''s possible to check to see if they come from the same container,
    and when a container is modified, it''s possible to invalidate the appropriate
    set of iterators.


    Because STLport uses special iterator implementations in debug mode, iterators
    for vector and string are class objects instead of raw pointers. Hence, using
    STLport and compiling in debug mode is a good way to make sure nobody is getting
    sloppy about the difference between pointers and iterators for these container
    types. That may be reason enough to give STLport''s debug mode a try.


