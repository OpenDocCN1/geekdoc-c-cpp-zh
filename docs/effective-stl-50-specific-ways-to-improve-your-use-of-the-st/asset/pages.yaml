    a reason for that: in-place key modification is impossible for map and multimap
    (unless you use a cast), but it might be possible for set and multiset. For objects
    of type set<T> or multiset<T>, the type of the elements stored in the container
    is simply T, not const T. Hence, the elements in a set or multiset may be changed
    whenever you want. No cast is required. (Actually, things aren''t quite straightforward,
    but we''ll come to that entirely. There''s no reason to get ahead of ourselves.
