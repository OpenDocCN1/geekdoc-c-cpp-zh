    The main culprit is the different rules for invalidation of iterators, pointers,
    and references that apply to different sequence containers. To write code that
    will work correctly with vector, deque, and list, you must assume that any operation
    invalidating iterators, pointers, or references in any of those containers invalidates
    them in the container you''re using. Thus, you must assume that every insert invalidates
    everything, because deque:insert invalidates all iterators and, lacking the ability
    to call capacity, vector:insert must be assumed to invalidate all pointers and
    references.(Item 1 explains that deque is unique in sometimes invalidating its
    iterators without invalidating its pointers and references.) Similar reasoning
    leads to the conclusion that, unless you''re erasing the last element of a container,
    calls to erase must be assumed to invalidate everything.


