    \ implementers can use pointer-based traversals, because only they know the size\
    \ of the internal arrays and how to move from one to the next. Some STLs algorithm\
    \ implementations that take their deque's internal structures into account, and\
    \ such implementations have been known to clock in more than 20% faster than the\
    \ \"normal\" implementations of the algorithms.\n\nThe point is not that STL implementations\
    \ are optimized for deques (or any other specific container type), but that implementers\
    \ know more about their implementations than you do, and they can take advantage\
    \ of this knowledge in algorithm implementations. If you shun algorithm calls\
    \ in favor of your loops, you get the opportunity to benefit from any implementation-specific\
    \ optimizations they may have provided.\n\nThe second efficiency argument is that\
    \ all but the most trivial STL algorithms use computer science algorithms that\
    \ are more sophisticated — sometimes much more sophisticated — than anything the\
