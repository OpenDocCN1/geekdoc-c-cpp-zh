    case insensitive, that still wouldn''t help you when you need to use nonmember
    generic algorithms like std::search and std::find_end. Don''t bother with member
    functions like what you need. It wouldn''t help if you decided, for reasons of
    efficiency, to change from a container of basic_string objects to a string table.


    A solution, one that fits more naturally into the design of the Standard Library,
    is to ask for case-insensitive comparison when that''s what you need. Don''t bother
    with member functions like string::find_first_of and string::find; all of them
    duplicate functionality that''s already there in nonmember generic algorithms.
    The generic algorithms, meanwhile, are flexible enough to accommodate case-insensitive
    strings. If you need to sort a collection of strings in case-insensitive order,
    for example, you all have to provide the appropriate comparison function:


