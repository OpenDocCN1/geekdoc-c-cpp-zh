    # Item 2: Beware the illusion of container-independent code.


    The STL is based on generalization. Arrays are generalized into containers and
    parameterized on the types of objects they contain. Functions are generalized
    into algorithms and parameterized on the types of iterators they use. Pointers
    are generalized into iterators and parameterized on the type of objects they point
    to.


    That''s the beginning. Individual container types are generalized into sequence
    and associative containers, and similar containers are given similar similarity.
    Standard contiguous-memory containers (see Item 1) offer random-access iterators,
    while standard node-based containers (again, see Item 1) provide bidirectional
    iterators. Sequence containers support push_front and push_back, while associative
    containers don''t. Associative containers offer logarithmic-time lower_bound,
