  md: '# # Acknowledgments


    I had an enormous amount of help during the roughly two years it took me to make
    some sense of the STL, create a training course on, and write this book. Of all
    my sources of assistance, two were particularly important. The first is Mark Rodgers.
    Mark generously volunteered to review my training materials and I learned more
    about the STL from him than from anybody else. He also acted as a technical reviewer
    for this book, again providing observations and insights that improved virtually
    every Item.


    The other outstanding source of information was several C++-related Usenet newsgroups


    My understanding of the STL was shaped by a variety of publications, the most
    important of which are listed in the Bibliography. I learned heavily from Josutthi’
    The C++ Standard Library [3].


    This book is fundamentally a summary of insights and observations made by others,
    though a few of the ideas are my own. I tried to keep track of where I learned
    what, but the task is hopeless, because a typical Item contains information gained
    from many sources over a long period of time. What follows is incomplete, but
    it''s the best I can do. Please note that my goal is to summarize what I first
    learned of an idea or technique, not where the idea or technique was originally
    developed or who came with it.


    In Item 1, my observation that node-based containers offer better support for
    transactional semantics is based on 5.11.2 of Josutthi’ The C++ Standard Library
    [3]. Item 2 includes an example from Mark Rodgers on how typedefs help when allocator
    types are changed.'
