    That''s a panoply of options, and it''s matched in richness by the range of considerations
    that go into choosing them. Unfortunately, most discussions of STL take a fairly
    narrow view of the world of containers, ignoring many issues relevant to selecting
    the one that is most appropriate. Even the Standard gets into this act, offering
    the following guidance for choosing among vector, deque, and list:


    vector, list, and deque offer the programmer different complexity trade-offs and
    should be used accordingly. vector is the type of sequence that should be used
    by default. list should be used when there are frequent insertions and deletions
    from the middle of the sequence. deque is the data structure of choice when most
    insertions and deletions take place at the beginning or the end of the sequence.


    If your primary concern is algorithmic complexity, I suppose this constitutes
    reasonable advice, but there is much more to be concerned with.'
