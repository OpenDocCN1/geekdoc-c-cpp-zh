  md: '# Item 4: Call empty instead of checking size() against zero.


    For any container c, writing

    if (c.size() == 0) ...

    is essentially equivalent to writing

    if (c.empty()) ...


    That being the case, you might wonder why one construct should be preferred to
    the other, in view of the fact that empty is typically implemented as an inline
    function that simply returns whether size returns 0.


    You should prefer the construct using empty, and the reason is simple: empty is
    a constant-time operation for all standard containers, but for some list implementations,
    size may take linear time.


