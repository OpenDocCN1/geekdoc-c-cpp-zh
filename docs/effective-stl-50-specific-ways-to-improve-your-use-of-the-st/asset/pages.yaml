  md: '# Introduction


    You''re already familiar with the STL. You know how to create containers, iterate
    over their contents, add and remove elements, and apply common algorithms, such
    as find and sort. But you''re not satisfied. You can''t shake the sensation that
    the STL offers more than you''re taking advantage of. Tasks that should be simple
    demand more time or memory Procedures that should be efficient leak resources
    or behave erratically than you''re willing to give them. Yes, you know how to
    use the STL, but you''re not sure you''re using it effectively.


    I write this book for you.


    In Effective STL, I explain how to combine STL components to take full advantage
    of the library''s design. Such information allows you to develop simple, straightforward
    solutions to simple, straightforward problems, and it also helps you design elegant
    approaches to more complicated problems. I describe common STL usage errors, and
    I show how to avoid them. That helps you dodge resource leaks, code that won''t
    port, and behavior that is undefined. I discuss ways to optimize your code, so
    you can make the STL perform like the last, sleek machine it is intended to be.


    The information in this book will make you a better STL programmer. It will make
    you a more productive programmer. And it will make you a happier programmer. Using
    the STL is fun, but using it effectively is outrageous fun, the kind of fun when
    you have to drag you from the keyboard, because you just can''t believe the good
    time you''re having. Even a glance at the STL reveals that it is a wondrous library,
    but the coolness runs broader and deeper than you probably imagine. One of my
    primary goals in this book is to convey to you just how amazing the library is,
    because in the nearly 30 years I''ve been programming, I''ve never seen anything
    like the STL. You probably haven''t either.'
  merge: -1
