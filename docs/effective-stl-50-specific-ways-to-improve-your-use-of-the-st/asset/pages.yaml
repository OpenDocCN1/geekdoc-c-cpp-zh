    in the Standard Library, like std::basic_istream and std::basic_ostream, are templated
    on character type and traits just like std::basic_string is. (Again, std::ostream
    is an alias for std::basic_ostream<char, char_traits>). The traits parameters
    have to match. If you''re using std::basic_string<char, my_traits_class> for your
    strings, you''ll have to use std::basic_ostream<char, my_traits_class> for your
    stream output. You won''t be able to use ordinary stream objects like cin and
    cout.


