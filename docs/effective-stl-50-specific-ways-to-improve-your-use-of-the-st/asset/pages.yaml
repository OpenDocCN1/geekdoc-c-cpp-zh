    \ see Item 41 for info\n    mem_fun_ref(&Widget::redraw)); // on mem_fun_ref\n\
    ```\n\nFor many C++ programmers, writing the loop is more natural than calling\
    \ the algorithm, and reading it makes sense of mem_fun_ref and the taking of Widget::redraw\
    \ address. Yet this Item argues that the algorithm call is preferable. This Item\
    \ argues that an algorithm is usually preferable to any hand-written loop. Why?\n\
    \nThere are three reasons:\n\n+   * **Efficiency:** Algorithms are often more\
    \ efficient than the loops programmers produce.\n\n+   * **Correctness:** Writing\
    \ loops are more subject to errors than calling algorithms.\n\n+   * **Maintainability:**\
    \ Algorithm often calls yield code that is clearer and more straightforward than\
    \ the corresponding explicit loops.\n\nThe remainder of this Item lays out the\
    \ case for algorithms.\n\nFrom an efficiency perspective, algorithms can beat\
    \ explicit loops in three ways, two major, one minor. The minor way involves the\
    \ elimination of redundant computations. Look again at the loop we just saw:\n\
    \n```\nfor (list<Widget>::iterator i = lw.begin(); i!=lw.end(); ++i) {\n    i->redraw();\n\
    }\n```"
