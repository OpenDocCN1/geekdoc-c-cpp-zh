    # Item 10: Be aware of allocator conventions and restrictions.


    Allocators were originally developed as an abstraction for memory models that
    would allow library developers to ignore the distinction between near and far
    pointers in 16-bit operating systems (i.e., DOS and its pernicious spawn), that
    effort failed. Allocators were also designed to facilitate the development of
    memory managers that are full-fledged objects, but it turned out that approach
    led to efficiency degradations in some parts of the STL. To avoid the efficiency
    hits, the C++ Standardization Committee added wording to the Standard that emacated
    allocators as objects, yet simultaneously expressed the hope that they would suffer
    no loss of potency from the operation.


