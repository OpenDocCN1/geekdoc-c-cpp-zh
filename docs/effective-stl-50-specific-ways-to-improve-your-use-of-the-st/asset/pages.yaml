    Alas, one programmer''s optimization is another''s pessimism, and if you use reference-counted
    strings in a multithreaded environment, you may find that the time saved by avoiding
    allocations and copying is dwarfed by the time spent behind-the-scenes concurrency
    control. (For details, consult Sutter''s article, "Optimizations That Aren''t
    (In a Multithreaded World)" [20.1]). If you use reference-counted strings in a
    multithreaded environment, then, it makes sense to keep an eye out for performance
    problems arising from their support for thread safety.


    To determine whether you are using a reference-counting implementation for string,
    it''s often easiest to consult the documentation for your library. Because reference
    counting is considered an optimization, vendors generally tell it as a feature.
    An alternative is to look at the source code for your libraries'' implementations
    of string. I don''t generally recommend trying to figure things out from library
    source code, but sometimes it is if you choose this approach, remember that string
    is a typedef for basic_string<char> (and w is a typedef for basic_string<wchar_t>),
    so what you really want to look at is the template basic_string. The easiest thing
    to check is probably the class''s copy constructor. Look to see if it increments
    a reference count somewhere. If it does, string is reference counted. If it doesn''t,
    either string is not reference counted or you misread it. Ahem.


    If the string implementations available to you are reference counted and you are
    running in a multithreaded environment where you''ve determined that string''s
    reference counting support is a performance problem, you have at least three reasonable
    choices, none of which involves abandoning the STL. First, check to see if your
    library implementation is that one makes possible to disable reference counting,
    often by changing the value of a preprocessor variable. This won''t be portable,
    of course, the amount of work involved, it''s worth investigating. Second, find
    or develop an alternative string implementation (or partial implementation) that
    doesn''t use reference counting. Third, consider using a vector<char> instead
    of a string. vector implementations are not allowed to be reference counted, so
    multithreading performance issues fail to arise. Of course, you forgo string''s
    fancy member functions if you switch to vector<char>, but most of that functionality
    is available through STL algorithms anyway, so you''re not so much giving up functionality
    as you are trading one syntax for another.'
