  md: '# Item 44: Prefer functions to algorithms with the same names.


    Some containers have member functions with the same names as STL algorithms. The
    associative containers offer find, lower_bound, upper_bound, and equal_range,
    while list offers remove_if, unique, sort, merge, and reverse. Most of the time,
    you''ll want to use the member functions instead of the algorithms. There are
    two reasons for this. First, the member functions are faster. Second, they integrate
    better with the containers (especially the associative containers) than do the
    algorithms. That''s because algorithms and member functions that share the same
    name typically do not exactly the same thing.


    We''ll begin with an examination of the associative containers. Suppose you have
    a set<int> holding a million values and you would like to find the first occurrence
    of the value 727, if there is one. Here are the two most obvious ways to perform
    the search:


    ```

    set<int> s;

    // create set, put

    // 1,000,000 values

    // into it

    ...

    set<int>::iterator i = s.find(727);

    // use find member

    if (i != s.end()) {

    // function

    set<int>::iterator i = find(s.begin(), s.end(), 727);

    // use find algorithm

    if (i != s.end()) ...

    ```


    The member function runs in logarithmic time, so, regardless of whether 727 is
    in the set, set::find will perform no more than about 40 comparisons looking for
    it, and usually it will require only about 20. In contrast, the find algorithm
    runs in linear time, so it will have to perform 1,000,000 comparisons if 727 is
    not in the set. Even if 727 is in the set, the find algorithm will perform, on
    average, 500,000 comparisons to locate it. The efficiency score is


    | Member find: About 40 (worst case) to about 20 (average case) |

    | Algorithm find: | 1,000,000 (worst case) to 500,000 (average case) |


    As golf, the low score wins, and as you can see, this matchup is not much of a
    contest.


    I have to be a little cage about the number of comparisons required by member
    find, because it''s partially dependent on the implementation used by the associative
    containers. Most implementations use red-black trees, a form of balanced tree
    that may be out of balance up to a factor of two. In such implementations, the
    maximum number of comparisons needed to search a set of a million values is 38,
    but for the vast majority of searches, no more than 22 comparisons are'
