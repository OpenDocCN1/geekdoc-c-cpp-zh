  md: '# Locales and Case-Insensitive String Comparisons


    Locales in C++ are divided into facets, each of which handles a different aspect
    of internationalization, and the function:use_facet extracts a specific facet
    from a local object.¹ The type facet handles character classification, including
    case conversion. Finally, if c1 and c2 are of type char, this fragment will compare
    them in a case-insensitive manner that is appropriate to the locale L.


    ```

    const std::type<char>& ct = std::use_facet<std::type<char>>(L);

    bool result = ct.toupper(c1) < ct.toupper(c2);

    ```


    There''s also a special abbreviation: you can write


    ```

    std::toupper(c, L),

    ```


    if (c is of type char means the same as


    ```

    std::use_facet<std::type<char>>(L).toupper(c).

    ```


    It''s worth minimizing the number of times you call use_facet, though, because
    it can be fairly expensive.


    Just as lexicographical comparison isn''t appropriate for all applications, so-by-character
    case conversion isn''t always appropriate.(In German, the lowercase letter “ß”
    corresponds to the uppercase sequence “SS”.) Unfortunately, character-by-character
    case conversion is all we''ve got. Neither the C nor the C++ standard library
    provides any form of case conversion that works with anything more than one character
    at a time. If this restriction is unacceptable for your purposes, then you are
    outside the scope of the standard library.


    # A digression: another facet


    If you''re already familiar with locales in C++, you might have thought of another
    way to perform string comparisons: The collate facet exists precisely to encapsulate
    details of sorting, and it has a member function with an interface like that of
    the C library function strcmp. There''s even a convenience feature: if L is a
    locale object, you can compare strings strings writing L(x, y) instead of going
    through the null of calling use_facet and invoking a locale member function.


    The “classic” locale has a collate facet that performs lexicographical comparison,
    but like just string’s operator–does, but others perform


    > ¹ use_facet is a function template where template parameter appears only in
    the return type, not in any of the arguments. Calling it uses a language feature
    explicit type argument specification, and some C++ compilers don''t support that
    feature yet. If you''re using a compiler that doesn''t support it, your library
    implementor may have provided a workaround so that you can call use_facet some
