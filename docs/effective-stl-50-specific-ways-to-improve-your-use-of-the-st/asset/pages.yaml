    m.begin()->first = 10; // error map keys can''t be changed

    mimap<int, string> mm;


    mm.begin()->first = 20; // error multimap keys can''t

    // be changed

    ```


    That''s because the elements in an object of type map<K, V> or multimap<K, V>
    are of pair<const K, V>. Because the value of the key is const, it can''t be changed.
    (Well, you can probably change it if you use a const_cast, as we''ll see below.
    Believe it or not, sometimes that''s what you want to do.)


