    If all this makes sound like the STL is copy-crazy, think again. Yes, the STL
    makes lots of copies, but it''s generally designed to avoid copying objects unnecessarily.
    In fact, it''s generally designed to avoid creating objects unnecessarily. Contrast
    this with the behavior of C and C++''s built-in array, which rarely


