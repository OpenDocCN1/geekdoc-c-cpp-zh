  md: '# # Preface


    It came without ribbons! It came without tags!

    It came without packages, boxes or bags!


    > > Dr. Seuss. How the Grinch Stole Christmas!, Random House, 1957


    I first wrote about the Standard Template Library in 1995, when I concluded the
    final item of More Effective C++ with a brief STL overview. I should have known
    better. Shortly thereafter, I began being when I wrote Effective STL.


    I resisted the idea for several years. At first, I wasn''t familiar enough with
    the STL to offer advice on it, but as time went on and my experience with it grew,
    this concern gave way to other reservations. There was never any question that
    the library represented a breakthrough in efficient and extensible design, but
    when it came to using the STL there were practical problems I couldn''t overlook.
    Porting all but the simplest STL programs was a challenge, not only because library
    implementations varied, but also because template support in the underlying compilers
    ranging from good to awful. STL tutorials were hard to come by, so learning “the
    way of programming” was difficult, and once that was overcome, finding comprehensible
    and accurate reference documentation was a challenge. Perhaps daunting, the smallest
    STL usage error often led to a blizzard of compiler diagnostics, each thousands
    of characters long, most referring to classes, functions, or templates not mentioned
    in the offending source code, almost all incomprehensible. Though I had great
    admiration for the STL and for the people behind it, I felt uncomfortable recommending
    it to practicing programmers. I wasn''t sure it was possible to use the STL effectively.


    Then I began to notice something that took me by surprise. Despite the portability
    problems, despite the dismal documentation, despite the compiler diagnostics resembling
    transmission line noise, many of'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# xii Preface Effective STL


    my consulting clients were using the STL anyway. Furthermore, they weren''t just
    playing with it, they were using it in production code! That was a revelation,
    I knew that the STL featured an elegant design, but any library for which programmers
    were willing to endure portability headaches, poor documentation, and incomprehensible
    messages had a lot more going for just good design. For an increasingly large
    number of professional programmers, I realized, even a bad implementation of the
    STL was preferable to no implementation at all.


    Furthermore, I knew that the situation regarding the STL would only get better.
    Libraries and compilers would grow more conformant with the Standard (they have),
    better documentation would become available (as has — consult the bibliography
    by page 225), and compiler diagnostics would improve (the most part, we were still
    waiting, Item 49 offers suggestions for how to cope while we wait). I then decided
    to chip in and do my part for the STL movement. This book is the result: 50 specific
    ways to improve your use of C++’s Standard Template Library.


    My original plan was to write the book in the second half of 1999, and with that
    in mind, I put together an outline. But then I changed. I suspended work on the
    book and developed an introductory course which I taught several times to groups
    of programmers. About a year later, I returned to the book, significantly revising
    the outline based on my experiences with the training course. In the same way
    that my Effective C++ has been successful by being grounded in the problems faced
    by real programmers, it''s my that Effective STL similarly addresses the aspects
    of STL programming — the aspects most important to professional developers.


    I am always on the lookout for ways to improve my understanding of C++. If you
    have suggestions for new guidelines for STL programming or if you have comments
    on the guidelines in this book, please let me know. In addition, it is my continuing
    goal to make this book as accurate as possible, so for each error that is reported
    to me — be it technical, grammatical, typographical, or otherwise — I will, in
    future prints, gladly add to the acknowledgments the name of the first person
    to bring that error to attention. Send your suggested guidelines, your comments,
    and your to estl@arista.com.


    I maintain a list of changes to this book since its first printing, including
    bug-fixes, clarifications, and technical updates. The list is available at the
    Effective STL Errata web site, http://www.arista.com/BookErrata/stl-errata.html.'
