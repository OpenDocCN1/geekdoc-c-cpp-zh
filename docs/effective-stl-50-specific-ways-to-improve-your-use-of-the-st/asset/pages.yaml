    +   - vector, string, deque, and list are known as the standard sequence containers.
    The standard associative containers are set, multiset, map, and multimap.


    +   - Iterators are divided into five categories, based on the operations they
    support. Very briefly, input iterators are read-only iterators where each iterated
    location may be read only once. Output iterators are write-only iterators where
    each iterated location may be written only once. Input and output iterators are
    modeled on reading and writing output streams (e.g., files). It''s surprising
    that the most common manifestations of input and output iterators are istream_iterators
    and ostream_iterators, respectively.


    Forward iterators have the capabilities of both input and output iterators, but
    they can read or write a single location repeatedly. They don''t support operator-,
    so they can move forward with any degree of efficiency. All standard STL containers
    support iterators that are more powerful than forward iterators, but as you will
    see in Item 25, design for hashed containers yield forward iterators. Containers
    for singly linked lists (considered in Item 50) also offer forward iterators.


    Bidirectional iterators are just like forward iterators, except they can go back
    as easily as they go forward. The standard associative containers offer all bidirectional
    iterators. So does list.


    Random access iterators do everything bidirectional iterators do, but they also
    offer ''iterator arithmetic'', i.e., the ability to jump forward or backward in
    a single step. vector, string, and deque provide random access iterators. Pointers
    into arrays act as random access iterators for the arrays.


    +   - Any class that overloads the call operator (i.e., operator()) is a functor.
    Objects created from such classes are known as function objects or functors. Most
    places in the STL that work with function objects work equally with real functions,
    so I often use the term ''function objects'' to mean both C++ functions as well
    as true function objects.


    +   - The functors bind1 and bind2 are known as binders.


