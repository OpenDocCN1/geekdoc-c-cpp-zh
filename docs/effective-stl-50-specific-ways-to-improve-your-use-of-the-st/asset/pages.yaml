    assume that''s not a problem. Instead, let''s focus on this question: how many
    elements are in list1 after the splice? Clearly, list1 after the splice has many
    elements as it did before the splice plus many elements were spliced into it.
    But how many elements were spliced into it? As many as in the range defined by
    find(list2.begin(), list2.end(), 5) and find(list2.rbegin(), list2.rend(), 10).base().
    Okay, how many is that? Without traversing the range and counting them, there''s
    no way to know. And therein lies the problem.


