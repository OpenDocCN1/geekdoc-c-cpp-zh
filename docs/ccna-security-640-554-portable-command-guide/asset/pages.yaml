    and run the .exe file. The installation consists of accepting a license agreement
    and selecting the installation folder.


    The host PC requires the following minimal settings:


    +   - Internet Explorer 6.0 or later

    +   - Java Runtime Environment Version 1.6.0_11 or later

    +   - Adobe Flash Player Version 10 or later, with Debug set to No

    +   - Memory 1GB DRAM, 2GB recommended

    +   - Screen resolution 1024 x 768


    **NOTE:** When the installation is complete, you have the option to run CCP for
    the first time. To successfully connect to an ISR using CCP, your router must
    have a supporting configuration.


    # Connecting to an ISR Using CCP


    Follow these steps to connect to an ISR from a Windows host using CCP. The following
    assumes that the router still has the default factory configuration.


