- pgno: 215
  md: '| OSI layer | Underlying technology |

    |---|---|

    | • Layer 2 VPN (legacy protocols such as Frame Relay or ATM)<br>• Layer 2 VPN
    (Multiprotocol Label Switching [MPLS] VPN)<br>• Layer 3 VPN (IP Security [IPsec]
    and Multiprotocol Label Switching [MPLS] Layer 3 VPN)<br>• Layer 7 VPN (Secure
    Sockets Layer [SSL] VPN) | • IPsec VPN<br>• SSL VPN<br>• MPLS VPN<br>• Other Layer
    2 technologies such as Frame Relay or ATM<br>• Hybrid VPNs combining multiple
    technologies |


    **NOTE:** This book focuses on site-to-site IPsec VPNs using Cisco IOS Integrated
    Services Routers (ISR) and on remote-access SSL VPNs using the Adaptive Security
    Appliance (ASA).


    # VPN Deployment Modes


    | VPN deployment mode | Description |

    |---|---|

    | **Site-to-site VPNs** | • Connects entire networks to each other.<br>• VPN hosts
    do not require VPN client software.<br>• VPNs send and receive normal TCP/IP traffic
    through a VPN “gateway” such as a Cisco ISR or an ASA.<br>• The VPN gateway is
    responsible for encapsulating and encrypting outbound traffic over the Internet
    to a peer VPN gateway.<br>• Upon receipt, the peer VPN gateway decrypts the content
    and relays the packet toward the target host inside its private network. |

    | **Remote-access VPNs** | • VPN securely connects telecommuters, mobile users,
    and external consumer-to-business over the Internet.<br>• Hosts may require a
    preinstalled VPN client (for example, Cisco VPN Client or Cisco AnyConnect) to
    access the target site using Hypertext Transfer Protocol Secure (HTTPS).<br>•
    The client encapsulates and encrypts that traffic and sends it over the Internet
    to the target VPN gateway.<br>• The VPN gateway behaves as it does for site-to-site
    VPNs. |


    **NOTE:** VPNs implement cryptographic protocols to secure the VPN network traffic.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Cryptology = Cryptography + Cryptanalysis


    Cryptology is the science of creating and breaking secret codes. It consists of
    the following:


    | Term | Definition |

    |---|---|

    | **Cryptography** | ▪ The science of creating secret codes to ensure confidentiality<br>▪
    Involves encryption and hashing, which provides authentication/integrity |

    | **Cryptanalysis** | ▪ The science of breaking (cracking) secret codes |


    # Historical Cryptographic Ciphers


    Cryptography uses ciphers to secure data. A cipher is an algorithm for performing
    encryption and decryption using a series of well-defined steps that are followed
    as a procedure. Ciphers are commonly classified as transposition or substitution
    based.


    In transposition-based ciphers, characters are “permuted” or rearranged. A simple
    example is encrypting HELLO by reversing the letters to produce OLLEH. Other examples
    include the Scytale, Rail Fence, and Grilles ciphers.


    > **NOTE:** Some modern algorithms, such as the Data Encryption Standard (DES)
    and the Triple Data Encryption Standard (3DES), still use transposition as part
    of the algorithm.


    Substitution ciphers include the following:


    | Type | Characteristics / Examples |

    |---|---|

    | **Substitution (monoalphabetic)** | ▪ Substitute one character for another (for
    example, A=C, B=D, C=E).<br>▪ Examples: Caesar cipher, Affine cipher, Atbash cipher.
    |

    | **Polyalphabetic** | ▪ Based on substitution, using multiple substitution alphabets.<br>▪
    Examples: Vigenère cipher, Autokey cipher. |

    | **One-time pads** | ▪ A substitution cipher that combines the text letter with
    a special key material character.<br>▪ For example, the Vernam cipher key must
    be random, as long as the data can only be used once.<br>▪ Key distribution is
    challenging because the source and destination must have the same key.<br>▪ One-time
    pads are no longer practical, but the concept still applies in modern encryption
    algorithms such as DES and AES. |


    > **NOTE:** Another type of substitution ciphers is the polygraphic cipher (for
    example, Playfair cipher).'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Modern Substitution Ciphers


    Modern substitution ciphers are categorized by the process they follow to encrypt
    text:


    | Type | Description |

    |---|---|

    | **Block ciphers** | - Referred to as “block-by-block cipher” because it operates
    on large blocks of digits with a fixed, unvarying transformation.<br>- Padding
    is used to keep the data size a multiple of the block size.<br>- The ciphertext
    is generally longer than the plaintext.<br>- The block size varies by algorithm.
    (DES has 8 bytes.)<br>- Examples: DES, 3DES, AES, Twofish. |

    | **Stream ciphers** | - Referred to as “bit-by-bit cipher,” in which each plaintext
    digit is encrypted one at a time with the corresponding digit of the key stream,
    to give a digit of the cipher-text stream.<br>- Stream ciphers operate on smaller
    units of plaintext (bits).<br>- The size of the message does not typically change.<br>-
    The transformation of smaller plaintext units varies depending on encryption requirements.<br>-
    Examples: RC4, SEAL. |


    # Encryption Algorithms


    Encryption is the process of disguising a message in such a way as to hide its
    original contents. Plaintext (that is, the readable message) is converted to ciphertext
    (the unreadable, “disguised” message).


    Encryption provides confidentiality because only authorized entities can read
    the original message.


    > **NOTE:** Historically, confidentiality was provided by the secrecy of the algorithm
    (method) used. Secrecy in modern encryption lies in the secrecy of the key used,
    not in the algorithm.


    Encryption can provide confidentiality at various OSI layers, such as the following:


    +   - Encrypt data link layer data using proprietary link-encrypting devices.

    +   - Encrypt network layer data using protocols such as those in the IPsec protocol
    suite.

    +   - Encrypt session layer data using protocols such as SSL or Transport Layer
    Security (TLS).

    +   - Encrypt application layer data, such as secure email, secure database sessions
    (Oracle SQL*Net), and secure messaging (Lotus Notes sessions).'
  merge: -1
  img_proc: true
- pgno: 218
  md: '**NOTE:** Both IPsec and SSL are used to set up a VPN. An IPsec VPN is an application
    independent and requires a specialized IP stack on the end system or in the packet
    path that includes IPsec. An SSL-based VPN supports only web-based applications,
    but the SSL software is included with all Internet browsers.


    # Cryptanalysis


    Cryptanalysis is the practice of breaking codes to obtain the meaning of encrypted
    data. One of the following methods may be used to decrypt ciphertext:


    | Method | Description |

    |---|---|

    | **Brute-force attack** | - Attacker tries every possible key with the decryption
    algorithm knowing that eventually one of the keys will work.<br>- All encryption
    algorithms are vulnerable to this attack.<br>- On average, a brute-force attack
    succeeds about 50 percent of the way through the keyspace (the set of all possible
    keys).<br>- Choose a keyspace large enough so that it takes too much time (and
    money) to accomplish a brute-force attack. |

    | **Ciphertext-only attack** | - Attacker obtains several ciphertext messages.<br>-
    Attacker uses statistical analysis to deduce the key used to encrypt the messages.<br>-
    These kinds of attacks are no longer practical today because modern algorithms
    are resistant to statistical analysis. |

    | **Known-plaintext attack** | - Attacker observes several ciphertext messages
    and also knows something about the plaintext underlying that ciphertext.<br>-
    Attacker uses a brute-force attack to try keys until decryption with the correct
    key produces a meaningful result.<br>- Modern algorithms with enormous keyspaces
    make it unlikely for this attack to succeed. |

    | **Chosen-plaintext attack** | - Attacker chooses the data and observes the ciphertext
    output.<br>- A chosen-plaintext attack is more powerful than a known-plaintext
    attack because the attacker gets to choose the plaintext blocks to encrypt, allowing
    the attacker to choose plaintext that might yield more information about the key.<br>-
    This attack might not be very practical because it is often difficult or impossible
    to capture both the ciphertext and plaintext. |'
  merge: -1
  img_proc: true
- pgno: 219
  md: '| Attack | Details |

    |---|---|

    | **Chosen-ciphertext attack** | ▪ Attacker chooses the ciphertext and observes
    the cleartext output.<br>▪ This attack might not be very practical because it
    is often difficult or impossible to capture both the ciphertext and plaintext.
    |

    | **Man-in-the-middle attack** | ▪ Attacker knows a portion of the plaintext and
    the corresponding ciphertext.<br>▪ The plaintext is encrypted with every possible
    key, and the results are stored.<br>▪ The ciphertext is then decrypted by using
    every key until one of the results matches one of the stored values. |


    # ## Cryptographic Processes in VPNs


    Cryptography provides key services to VPN technologies and solutions:


    | Service | Description |

    |---|---|

    | **Confidentiality** | The assurance that no one can read a particular piece
    of data except the receiver explicitly intended |

    | **Integrity** | The assurance that data has not been altered in transit, intentionally
    or unintentionally |

    | **Authentication** | The assurance the other entity is who he, she, or it claims
    to be |

    | **Key management** | The generation, exchange, storage, safeguarding, use, vetting,
    and replacement of keys |


    VPN services use a combination of cryptographic technologies and algorithms to
    accomplish their goals. For example, in site-to-site VPNs, IP packets use the
    following:


    +   - Symmetric encryption algorithms to encrypt the payload, with keys negotiated
    by key management protocols

    +   - Asymmetric encryption algorithms to create digital signatures and authenticate
    the VPN peers

    +   - Hashing functions to provide checksum-type integrity checks


    **NOTE:** This combination of algorithms and cryptographic methods negotiates
    the security settings to accomplish confidentiality, integrity, and authentication.'
  merge: -1
  img_proc: true
