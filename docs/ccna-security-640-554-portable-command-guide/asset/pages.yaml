    # ## Cisco Configuration Professional


    The preferred way to configure an ISR using a GUI is with the Windows-based CCP
    application. CCP is installed locally on a PC and provides rich configuration
    capabilities to configure security features for data and voice.


    **NOTE:** Only CCP configuration options are explored throughout the remainder
    of this portable command guide.


    # ## Configuring an ISR for CCP Support


    A router must be configured to support a CCP connection. An ISR with default factory
    settings is configured to do so.


    If an ISR no longer has the factory default configuration, you must initially
    configure the following to support a CCP session:


    | Command | Description |

    |---|---|

    | Router(config)#username name privilege 15 secret password | Creates a local
    user database username and password |

    | Router(config)#hostname hostname | Sets the hostname of the router |

    | Router(config)#interface interface number | Moves to interface configuration
    mode |

    | Router(config-if)#ip address ip-address subnet-mask | Sets the IP address and
    mask |

    | Router(config-if)#no shutdown | Enables the interface, although optional since
    the interface was already enabled |

    | Router(config-if)#exit | Returns to global configuration mode |

    | Router(config)#ip http server | Enables the HTTP service on the router |

    | Router(config)#ip http secure-server | Enables HTTPS service on the router if
    the router IOS image supports crypto |

    | Router(config)#ip http authentication local | Enables HTTP authentication using
    the local database |'
  merge: -1
  img_proc: true
- pgno: 64
  md: '| Command | Description |

    |---|---|

