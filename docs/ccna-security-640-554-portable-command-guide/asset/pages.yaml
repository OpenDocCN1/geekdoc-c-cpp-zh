  md: '| Topic | Description |

    |---|---|

    | **Buffer** | Messages are stored in the router memory but lost when it is rebooted
    or the buffer is full. Use the `show logging` command to view logging messages.
    |

    | **Syslog** | Very useful message logging facility, which sends log messages
    to servers. The server provides a central long-term log storage capability for
    all networking devices. |

    | **SNMP server** | Specific router events can be trapped and forwarded to an
    external SNMP server. |


    > **NOTE:** To reduce the CPU load, disable logging to the console using the `no
    logging console` and instead send logging information to the local log buffer.


    > **NOTE:** When telnetting to a router, use the `terminal monitor` command to
    view log messages.


    Router log messages typically contain time stamps, log messages, severity levels,
    and message text. Cisco router log messages fall into one of eight levels.


    | Level | Name | Description |

    |---:|---|---|

    | 0 | `LOG_EMERG` | Emergencies, such when the router is unusable |

    | 1 | `LOG_ALERT` | A condition that should be corrected immediately, such as
    a corrupted system database |

    | 2 | `LOG_CRIT` | Critical conditions, such as hard device errors |

    | 3 | `LOG_ERR` | Errors such as invalid memory size |

    | 4 | `LOG_WARNING` | Warning messages, such as the operation failed |

    | 5 | `LOG_NOTICE` | Conditions that are normal but important |

    | 6 | `LOG_INFO` | Informational messages, such as when a packet is denied |

    | 7 | `LOG_DEBUG` | Messages that contain information normally of use only when
    debugging a program |


    Syslog requires a syslog server and a syslog client:


    | Command | Description |

    |---|---|

    | `Router(config)#service timestamps` | Enable time stamps on debug and logging
    messages. |

    | `Router(config)#logging host [ip-address \| hostname]` | Identify the syslog
    server address or hostname. |

    | `Router(config)#logging trap level` | Limit messages logged to the syslog servers
    based on severity. Default is 0–6. |'
  merge: -1
  img_proc: true
