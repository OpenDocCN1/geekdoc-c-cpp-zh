- pgno: 327
  md: '# # AAA Access Control


    You can configure Cisco ASA to authenticate using the following:


    | | |

    |---|---|

    | **Local user database** | • Local authentication, authorization, and accounting
    (AAA) stores usernames and passwords locally on the ASA and users authenticate
    against the local database.<br>• Ideal for small networks that do not need a dedicated
    AAA server. |

    | **Server-based authentication** | • Server-based AAA authentication is a much
    more scalable method than local AAA authentication.<br>• It uses an external database
    server resource leveraging RADIUS or TACACS+ protocols. |


    **NOTE:** Both methods are commonly used to provide a fallback mechanism.


    # ## Local AAA Authentication


    ```

    ```

    ciscoasa(config)# username name password    Create a local user account.

    password [privilege priv-level]

    ```

    ```


    **NOTE:** To erase a user from the local database, use the clear config username
    [name] command.


    **NOTE:** To view all user accounts, use the show running-conf username command.


    Enable AAA authentication for the privilege EXEC mode, HTTP, SSH, or Telnet access:


    | | |

    |---|---|

    | `ciscoasa(config)# aaa authentication enable console LOCAL` | Enable AAA authentication
    for the privileged EXEC mode using the local database. |

    | `ciscoasa(config)# aaa authentication http console LOCAL` | Enable AAA authentication
    for HTTP access using the local database. |

    | `ciscoasa(config)# aaa authentication ssh console LOCAL` | Enable AAA authentication
    for SSH access using the local database. |

    | `ciscoasa(config)# aaa authentication telnet console LOCAL` | Enable AAA authentication
    for Telnet access using the local database. |'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# ## Server-Based AAA Authentication


    Server-based AAA authentication is a much more scalable solution that uses an
    external database server resource leveraging RADIUS or TACACS+ protocols.


    Server-based AAA authentication lets you do the following:


    +   - Create a TACACS+ or RADIUS AAA server group.

    +   - Add a AAA server and parameters to the AAA server group.

    +   - Configure server-based AAA authentication.


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# aaa-server server-tag protocol {tacacs+ \| radius}` | Create
    a TACACS+ or RADIUS AAA server group. **NOTE:** Other protocols include `http-form`,
    `kerberos`, `ldap`, `ntp`, and `sdi`. All are beyond the scope of this chapter.
    |

    | `ciscoasa(config-aaa-server-group)# aaa-server server-tag (interface-name) host
    {server-ip \| name} [key]` | Identify a AAA server and parameters to be part of
    the AAA server group. |

    | `ciscoasa(config)# aaa authentication {enable \| http \| ssh \| telnet} console
    server-tag [LOCAL]` | Enable server-based AAA authentication. |


    > **NOTE:** To erase all AAA server configurations, use the `clear config aaa-server`
    command.


    > **NOTE:** To view all user accounts, use the `show running-config aaa-server`
    command.


    # ## Configuring AAA Server-Based Authentication Example Using the CLI


    Figure 21-18 shows the network topology for the server-based AAA authentication
    example.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_328_0.png)


    **Figure 21-18** Server-Based AAA Authentication Topology'
  merge: -1
  img_proc: true
- pgno: 329
  md: '| Command | Description |

    |---|---|

    | `ASA-1(config)# username admin`<br>`password cisco123 privilege 15` | Create
    a local user account for fallback purposes. |

    | `ASA-1(config)# aaa-server`<br>`TACACS-SVR protocol tacacs+` | Create a AAA
    server group using the TACACS+ protocol. |

    | `ASA-1(config-aaa-server)#`<br>`host 192.168.1.5 cisco123` | Identify a server
    and password key. |

    | `ASA-1(config-aaa-server)# exit` | Return to global configuration mode. |

    | `ASA-1(config)# aaa authentication`<br>`enable console TACACS-SVR LOCAL` | Enable
    privilege EXEC to use server-based AAA authentication with the local database
    for fallback. |

    | `ASA-1(config)# aaa authentication`<br>`http console TACACS-SVR LOCAL` | Enable
    HTTP to use server-based AAA authentication with the local database for fallback.
    |

    | `ASA-1(config)# aaa authentication`<br>`ssh console TACACS-SVR LOCAL` | Enable
    SSH to use server-based AAA authentication with the local database for fallback.
    |

    | `ASA-1(config)# aaa authentication`<br>`telnet console TACACS-SVR LOCAL` | Enable
    Telnet to use server-based AAA authentication with the local database for fallback.
    |


    # Configuring AAA Server-Based Authentication Example Using ASDM


    For fallback reasons, create a local user account. Choose Configurations > Device
