- pgno: 17
  md: '# ## About the Author


    Bob Vachon is a professor in the Computer Systems Technology program at Cambrian
    College in Sudbury, Ontario, Canada, where he teaches networking infrastructure
    courses. He has worked and taught in the computer networking and information technology
    field since 1984. He has collaborated on various CCNA, CCNA Security, and CCNP
    projects for the Cisco Networking Academy as team lead, lead author, and subject
    matter expert. He enjoys playing the guitar and being outdoors, either working
    in his gardens or white-water canoe tripping.


    # ## About the Technical Reviewer


    Jim Lorenz is an instructor and a senior training developer for the Cisco Networking
    Academy Program. He holds a bachelor’s degree in computer information systems
    and has over 20 years of experience in networking and IT. Jim has developed course
    materials, including content, labs, and textbooks for the CCNA and CCNP curricula.
    Most recently he coordinated lab development for the CCNA Security course.


    # ## Dedications


    This book is dedicated to my students. Thanks for reminding me why I do this stuff.
    I also dedicate this book to my beautiful wife Judy and daughters Lee-Anne, Joelle,
    and Brigitte who, without their support and encouragement, I would not have been
    involved in this project.


    # ## Acknowledgments


    I would like to start off with a big thanks to my friend Scott Empson for involving
    me with this project. Your *Portable Command Guide* series was a great idea and
    kudos to you for making it happen.


    Thanks to the team at Cisco Press. Thank you Mary Beth for believing in me and
    to Drew and Mandie for making sure I get things done right and on time. Also thanks
    to my friend Jim for keeping me in check.


    Special thanks to my Cisco Networking Academy family. A big thanks to Jeremy and
    Rob for involving me in these very cool projects. You guys keep me young.


    Finally, a great big thanks to the folks at Cambrian College for letting me have
    fun and do what I love to do...teach!'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Command Syntax Conventions


    The conventions used to present command syntax in this book are the same conventions
    used in the *IOS Command Reference*. The *Command Reference* describes these conventions
    as follows:


    +   - **Boldface** indicates commands and keywords that are entered literally
    as shown. In actual configuration examples and output (not general command syntax),
    boldface indicates commands that are manually input by the user (such as a show
    command).

    +   - *Italics* indicate arguments for which you supply actual values.

    +   - Vertical bars (|) separate alternative, mutually exclusive elements.

    +   - Square brackets [ ] indicate optional elements.

    +   - Braces { } indicate a required choice.

    +   - Braces within brackets [ { } ] indicate a required choice within an optional
    element.


    # Introduction


    Welcome to CCNA Security! Scott Empson had an idea to provide a summary of his
    engineering journal in a portable quick reference guide. The result is the *Portable
    Command Guide* series. These small books have proven to be very valuable for anyone
    studying for Cisco certification or as a handy quick reference resource for anyone
    tasked with managing Cisco infrastructure devices.


    The *CCNA Security: Portable Command Guide* covers the security commands and GUI
    steps needed to pass the 640-554 IINS (Implementing Cisco IOS Network Security)
    certification exam. The guide begins by summarizing the required fundamental security
    concepts. It then provides the CLI commands and the Cisco Configuration Professional
    GUI screenshots required to acquire an ISR. Examples are included to help demonstrate
    the security-related configuration.


    The last section of the book focuses on securing a network using an Adaptive Security
    Appliance (ASA). It provides the CLI commands and the ASA Security Device Manager
    (ASDM) GUI screenshots required to secure an ASA 5505. Again, examples are included
    to help demonstrate the security-related configuration.


    I hope that you learn as much from reading this guide as I did when I wrote it.'
  merge: -1
  img_proc: true
