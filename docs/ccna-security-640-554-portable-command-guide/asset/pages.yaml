- pgno: 190
  md: 'This chapter covers the following topics:


    # IDS and IPS Fundamentals


    +   - Types of IDS and IPS Sensors

    +   - Types of Signatures

    +   - Types of Alarms


    # Intrusion Prevention Technologies


    +   - IPS Attack Responses

    +   - IPS Anti-Evasion Techniques

    +   - Managing Signatures

    +   - Cisco IOS IPS Signature Files

    +   - Implementing Alarms in Signatures

    +   - IOS IPS Severity Levels

    +   - Event Monitoring and Management

    +   - IPS Recommended Practices


    # Configuring IOS IPS


    +   - Creating an IOS IPS Rule and Specifying the IPS Signature File Location

    +   - Tuning Signatures per Category

    +   - Configuring IOS IPS Example

    +   - Configuring IOS IPS Using CCP Example

    +   - Signature Tuning Using CCP


    # IDS and IPS Fundamentals


    An intrusion detection system (IDS) sensor captures packets in real time, processes
    them, and can respond to threats, but it works on copies of data traffic to detect
    suspicious activity by using signatures. An IDS allows malicious traffic to pass
    before it can respond.'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'An intrusion prevention system (IPS) sensor works in line in the data stream
    to provide protection from malicious attacks in real time. An IPS responds immediately
    and does not allow malicious traffic to pass.


    **NOTE:** This chapter focuses on IPS.


    # ## Types of IPS Sensors


    IPS sensors can be deployed as follows:


    | Type | Description |

    |---|---|

    | **IPS 4200 Sensor** | As a dedicated IPS appliance available in multiple form
    factors |

    | **Network modules** | As a network module installed in an Integrated Services
    Router (ISR), an Adaptive Security Appliance (ASA), or a high-end Catalyst switch
    |

    | **Cisco IOS IPS** | Integrated in the IOS of an ISR and some Layer 3 switches
    |


    # ## Types of Signatures


    IDS and IPS technologies use signatures to detect the following general patterns
    of misuse:


    | Type | Description |

    |---|---|

    | **Atomic pattern** | An attempt is made to access a specific port on a specific
    host, and malicious content is contained in a single packet. |

    | **Composite pattern** | A sequence of operations that are distributed across
    multiple hosts over an arbitrary period (event horizon). |


    # ## Types of Alarms


    Attacks can generate the following four types of alarms:


    | Type | Description |

    |---|---|

    | **True positive** | Occurs when an IDS or IPS signature is correctly fired and
    an alarm is generated when offending traffic is detected |

    | **True negative** | Occurs when the sensor does not fire an alarm when it captures
    and analyzes network traffic that is normal |

    | **False positive** | Alarm that is triggered by normal traffic or a benign action
    |

    | **False negative** | Occurs when an alarm is not triggered when offending traffic
    is detected |


    **NOTE:** True positives and true negatives are expected IDS and IPS alarms.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '**CAUTION:** False positives must be tuned; false negatives must be corrected.


    # Intrusion Prevention Technologies


    Multiple detection technologies are typically used to provide an effective intrusion
    detection architecture:


    | Detection technology | Description |

    |---|---|

    | **Signature-based IPS** | ▪ Signatures are a set of rules installed on an IPS
    sensor.<br>▪ As sensors scan network packets, they use signatures to detect known
    attacks and respond with predefined actions.<br>▪ Sensors can modify existing
    signatures and define new ones. |

    | **Policy-based IPS** | ▪ Policies are created and configured on the IPS sensor
    based on the network security policy.<br>▪ Any traffic that is detected outside
    the policy will generate an alarm and/or will be dropped. |

    | **Anomaly-based IPS (profile-based detection)** | ▪ Sensors generally look for
    network traffic that deviates from the norm.<br>▪ Statistical baselining is when
    normal behavior is defined based on traffic patterns, traffic and protocol mix,
    traffic volumes, and other criteria.<br>▪ Protocol anomaly baselining focuses
    on traffic that deviates from protocol standards. |

    | **Reputation-based IPS** | ▪ Technique uses reputation analysis for various
    traffic descriptors, such as IP addresses, URLs, Domain Name System (DNS) domains,
    and others.<br>▪ This usually translates into reputation filters that round up
    a signature-based system by filtering known malicious sources, destinations, or
    application components.<br>▪ The approach generally requires communication between
    the sensor and the source of the reputation information.<br>▪ Sources can be local
    to the device, enterprise knowledge, and even global knowledge. |


    **NOTE:** There are advantages and disadvantages to each intrusion detection technique.
    It is recommended to strike a balance between these methods and combine them to
    improve the accuracy, sensitivity, relevancy, and precision of your IPS.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# IPS Attack Responses


    When an IPS sensor detects malicious activity, it can choose from any or all of
    the following actions:


    | Action | Description |

    |---|---|

    | **Deny attacker inline** | Action terminates the current packet and future packets
    from the attacker address for a specified period. |

    | **Deny connection inline** | The sensor maintains a list of the attackers currently
    being denied by the system, and these entries can be manually removed from the
    list or wait for the sliding timer to expire. |

    | **Deny packet inline** | Action terminates the current packet and future packets
    on this TCP flow. |

    | **Log attacker packets** | Action starts IP logging on packets that contain
    the attacker address and sends an alert to the Event Store, even if the Produce
    Alert action is not selected. |

    | **Log pair packets** | Action starts IP logging on packets that contain the
    attacker and victim address pair and sends an alert to the Event Store, even if
    the Produce Alert action is not selected. |

    | **Log victim packets** | Action starts IP logging on packets that contain the
    victim address and sends an alert to the Event Store, even if the Produce Alert
    action is not selected. |

    | **Produce alert** | Action writes the event to the Event Store as an alert.
    |

    | **Produce verbose alert** | Action includes an encoded dump of the offending
    packet in the alert and is written to the Event Store. |

    | **Request block connection** | Action sends a request to a blocking device to
    block this connection. |

    | **Request block host** | Action sends a request to a blocking device to block
    this attacker host. |

    | **Request SNMP trap** | Action sends a Simple Network Management Protocol (SNMP)
    notification and an alert to the Event Store, even if the Produce Alert action
    is not selected. |

    | **Reset TCP connection** | Action sends TCP resets to hijack and terminate the
    TCP flow. |


    **NOTE:** You can use the reset TCP connection action with deny packet and deny
    connection actions. However, deny packet and deny flow actions do not automatically
    cause TCP reset actions to occur.


    **NOTE:** Cisco IOS IPS does not support all of these actions.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# IPS Anti-Evasion Techniques


    Attackers use multiple IPS evasion techniques to allow them to deploy exploits
    using a stealth approach that often renders IPS sensors unable to detect and prevent
    intrusion.


    | Evasion Method | Evasion Description | Anti-Evasion Feature |

    |---|---|---|

    | Traffic fragmentation | Attacker fragments malicious traffic, hoping to avoid
    detection or filtering by confusing the network IPS sensor reassembly methods,
    bypassing the network IPS sensor if it does not perform any reassembly at all,
    or reordering split data if the network IPS sensor does not correctly order it
    in the reassembly process. | Complete session reassembly in string and service
    engines |

    | Traffic substitution and insertion | Attacker substitutes payload data with
    other data in a different format but with the same meaning. | Data normalization
    (de-obfuscation) in service engines |

    | Protocol-level misinterpretation | Attacker causes the IPS sensor to misinterpret
    the end-to-end meaning of network protocols. Consequently, the sensor either ignores
    traffic that should not be ignored or vice versa. | IP Time to Live (TTL) analysis;
    TCP checksum validation |

    | Timing attacks | Attacker evades detection of correlating signatures by performing
    their actions more slowly, to not exceed the event horizon. | Increase configurable
    intervals or use third-party for correlation |

    | Encryption and tunneling | Attacker has already established a secure session
    with the target network or host. The sensor captures the encrypted data but is
    unable to decrypt it and cannot perform meaningful analysis. | Generic routing
    encryption (GRE) tunnel inspection |

    | IPS resource exhaustion | Attacker uses specialized tools to create a tremendous
    number of alarms that consume the resources of the IPS device and prevent attacks
    from being logged. | Smart dynamic event summarization |


    **NOTE:** The mitigation techniques vary depending on the IPS sensor.


    # Managing Signatures


    Cisco IPS relies on signature micro-engines to support IPS signatures. All the
    signatures in a signature micro-engine are scanned in parallel, which increases
    efficiency and results in higher throughput. Each signature micro-engine does
    the following:


    +   - Categorizes a group of signatures with a set of acceptable ranges or sets
    of values

    +   - Uses router memory to compile, load, and merge signatures'
  merge: -1
  img_proc: true
- pgno: 195
  md: '| Signature Micro-Engine | Description |

    |---|---|

    | ATOMIC-IP Engine | Signatures that examine simple packets, such as Internet
    Control Message Protocol (ICMP) and User Datagram Protocol (UDP). The ATOMIC engine
    does not store persistent protocol-based state data across packets; instead, it
    can trigger a signature from the analysis of the header (Layers 3 and 4) of a
    single packet. |

    | Service Engines | Signatures that examine the many services that are attacked.
    |

    | STRING Engines | STRING engines are generic pattern-matching inspection engines
    for ICMP, TCP, and UDP protocol packets. They use a regular expression engine
    that can combine multiple patterns into a single pattern-matching table, allowing
    for a single search through the data. |

    | MULTI-STRING Engine | Inspects Layer 4 protocol packets in a flexible pattern-matching
    manner. |

    | Other | Internal engine to handle miscellaneous signatures. |


    # ## Cisco IOS IPS Signature Files


    The Cisco IOS IPS signature files must be downloaded from Cisco.com (CCO login
    required). Two versions of signature files are available, and the file required
    depends on whether IPS is configured using the command-line interface (CLI) or
    using Cisco Configuration Professional (CCP). Specifically, if configuring IPS
    using


    +   - CLI: Download IOS-Sxxx-CLI.pkg (xxx = signature version number).

    +   - CCP: Download sigv5-SDM-Sxxx.zip.


    You must also download the realm-cisco.pub.key.txt file because it must be used
    to generate an RSA crypto key and load the public signature on the router for
    signature decryption.


    # ## Implementing Alarms in Signatures


    Consider the following when implementing signatures:


    +   - The level assigned to the signature determines the alarm severity level.

    +   - The alarm severity levels are informational, low, medium, and high.

    +   - Make the severity level of the signature the same as the severity level
    of the alarm.

    +   - Tune your signatures to recognize intrusion patterns out of character with
    your network traffic patterns.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# IOS IPS Severity Levels


    | Severity | Description |

    |---|---|

    | **Informational** | Activity that triggers the signature is not considered an
    immediate threat, but the information that is provided is useful information.
    |

    | **Low** | Abnormal network activity is detected that could be perceived as malicious,
    but an immediate threat is not likely. |

    | **Medium** | Abnormal network activity is detected that could be perceived as
    malicious, and an immediate threat is likely. |

    | **High** | Attacks that are used to gain access or cause a denial-of-service
    (DoS) attack are detected, and an immediate threat is extremely likely. |


    # Event Monitoring and Management


    Consider the following when implementing event monitoring and management:


    +   - The two key functions of event monitoring and management are to provide
    real-time event monitoring and management and for analysis based on archived information
    (reporting).

    +   - Multiple protocols are available for alarm generation, including Security
    Device Event Exchange (SDEE), syslog, and SNMP.

    +   - Event monitoring and management can be hosted on a single server or on separate
    servers for larger deployments.

    +   - Archiving is important for forensics and compliance.

    +   - A hierarchical approach of local, enterprise, and global event management
    is recommended.


    **NOTE:** SDEE is an application-level communication protocol that is used to
    exchange IPS messages between IPS clients and IPS servers. SDEE is always running,
    but it does not receive and process events from IPS unless SDEE notification is
    enabled. If SDEE notification is not enabled and a client sends a request, SDEE
    responds with a fault response message, indicating that notification is not enabled.


    | Topic | Description |

    |---|---|

    | **Local correlation** | Device-level correlation is accomplished with products
    such as CCP, IPS Device Manager, or IPS Manager Express. |

    | **Enterprise intelligence** | Gathered using Cisco Security Manager (CSM). Third-party
    Security Information and Event Management (SIEM) systems (for example, ArcSight,
    netForensics, Splunk) can be used for more specialized event management and forensics
    capabilities. |

    | **Global intelligence** | Global security intelligence correlation is the responsibility
    of the Cisco Security Intelligence Operations (SIO), cloud-based service that
    connects global threat information, reputation-based services, and sophisticated
    analysis to Cisco network security devices to provide stronger protection with
    faster response times. |'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'For event management, you can use the SDEE protocol and a syslog-based approach
    to send Cisco IOS IPS alerts. The sensor generates an alarm when an enabled signature
    is triggered. Alarms are stored on the sensor. A host can pull the alarms from
    the sensor using SDEE. Pulling alarms from a sensor allows multiple hosts to subscribe
    to the event “feed” to allow a host or hosts to subscribe to an as-needed basis.


    # ## IPS Recommended Practices


    +   - Use a combination of detection technologies.

    +   - Take advantage of multiple form factors to deploy a distributed and cost-effective
    IPS architecture.

    +   - Plan the IPS architecture carefully, using a “places in the network” approach,
    and considering the different levels of risk for the different assets you are
    trying to protect.

    +   - Enable anti-evasion techniques.

    +   - Take advantage of local, enterprise, and global correlation.

    +   - Use a risk-based approach to improve accuracy and simplify management.

    +   - When deploying a large number of sensors, automatically update signature
    packs instead of manually upgrading every sensor.

    +   - Place the signature packs on a dedicated FTP server within the management
    network.

    +   - Tune the IPS architecture on a regular basis.


    **NOTE:** IPS capabilities vary depending on the IPS form factor. Refer to the
    proper documentation for each IPS sensor product for specific platform details.


    # ## Configuring IOS IPS


    To configure basic IPS using IOS CLI, complete these steps:


    +   1. Create an IOS IPS configuration directory in flash.

    +   2. Copy the Cisco IOS IPS signature package to flash.

    +   3. Configure an IOS IPS crypto key.

    +   4. Create an IPS rule and specify the location of the IPS signature file.

    +   5. Enable SDEE and logging event notification.

    +   6. Modify signature categories.

    +   7. Assign the IPS rule to an interface.


    **NOTE:** Download the latest signature package (IOS-Sxxx-CLI.pkg) and crypto
    file (realm-cisco.pub.key.txt), the latter of which contains the public key from
    Cisco.com (CCO login is required).'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Create an IOS IPS directory in flash:


    | Command | Description |

    |---|---|

    | `Router#mkdir flash:dir-name` | Create a directory in flash. |

    | **NOTE:** You could specify other locations. | |


    Copy the Cisco IOS IPS signature package to flash using one of the following methods:


    | Command | Description |

    |---|---|

    | `Router#copy ftp://username:password@server/IOS-Sxxx-CLI.pkg flash:dir-name
    idconf` | Copy from an FTP server to the directory in flash. |

    | `Router#copy tftp://tftp-server/IOS-Sxxx-CLI.pkg flash:dir-name idconf` | Copy
    from a TFTP server to the directory in flash. |

    | `Router#copy usbflash0:/IOS-Sxxx-CLI.pkg flash:dir-name idconf` | Copy from
    the USB drive to the directory in flash. |


    **NOTE:** Add the `idconf` parameter at the end to initiate the compiling process
    after the copy is complete.


    **NOTE:** The preceding list shows only common examples. Other methods are available.


    To create the RSA crypto key, copy and paste the following:


    +   - Open the realm-cisco-pub.key.txt text file and select the entire contents.

    +   - Copy the text and paste it in global configuration mode.


    **NOTE:** The router executes all the commands from the text file and creates
    the RSA key. Use the `show running-config | section crypto key pubkey-chain rsa`
    command to verify the configuration.


    # Creating an IOS IPS Rule and Specifying the IPS Signature File Location


    | Command | Description |

    |---|---|

    | `Router(config)#ip ips name ips-name [list acl]` | Create an IPS rule name.
    |

    |  | `list acl` is optional and specifies an extended or standard ACL to filter
    the traffic that will be scanned. All traffic that is permitted by the ACL is
    subject to inspection by the IPS. Traffic that is denied by the ACL is not inspected
    by the IPS. |'
  merge: -1
  img_proc: true
- pgno: 199
  md: '| Command | Description |

    |---|---|

    | `Router(config)#ip ips config location flash:dir-name` | Specify the IPS signature
    file location. The IPS signature file location is used to restore the IPS configuration
    in cases such as router reboots or IPS becoming disabled or reenabled. Files,
    such as signature definitions, signature-type definitions, and signature category
    information, are written in Extensible Markup Language (XML) format, compressed,
    and saved to the specified IPS signature location. |


    **NOTE:** The IPS does not load the signatures until the rule is applied to an
    interface.


    Enable SDEE and logging event notification:


    | Command | Description |

    |---|---|

    | `Router(config)#ip http server` | Enable the HTTP server (required). |

    | `Router(config)#ip ips notify sdee` | Enable IPS SDEE event notification. |

    | `Router(config)#ip ips notify log` | Enable logging. |


    # ## Tuning Signatures per Category


    Router memory and resource constraints prevent a router from loading all Cisco
    IOS IPS signatures. Therefore, only load a selected set of signatures that are
    defined by the categories.


    **TIP:** The larger the number of signatures, the larger the amount of memory
    consumed. Therefore, retire signatures that are irrelevant to your network to
    save router memory.


    All signatures are pregrouped into categories; the categories are hierarchical.
    An individual signature can belong to more than one category. Top-level categories
    help to define general types of signatures.


    **TIP:** Because the categories are applied in a top-down order, you should first
    retire all signatures, followed by unretiring specific categories.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '| Command | Description |

    |---|---|

    | `Router(config)#ip ips signature-category` | Enter IPS category configuration
    mode to tune Cisco IOS IPS signature parameters on the basis of a signature category.
    |

    | `Router(config-ips-category)#category {all \| ios_ips {basic \| advanced}}`
    | Specify the signature category to change, and enter IPS category action mode.<br><br>**NOTE:**
    Many other categories and sub-categories exist (for example, attack, dos, ddos,
    email, p2p). For a list of supported top-level categories, use the router CLI
    help (`?`).<br><br>**NOTE:** IOS IPS processes category commands in the order
    listed in the configuration. |

    | `Router(config-ips-category-action)#retired {false \| true}` | Specify whether
    a signature or signature category definition should be saved in the router memory.<br><br>`false`
    retires all signatures within a given category.<br><br>`true` retires all signatures
    within a given category.<br><br>**NOTE:** Retired signatures are not scanned by
    Cisco IOS IPS and therefore do not fire alarms.<br><br>**NOTE:** To return to
    the default action, use the `no retired` command. |

    | `Router(config-ips-category-action)#event-action action` | Change router actions
    for a specified signature category.<br><br>Actions include the following:<br><br>-
    `deny-attacker-inline`<br>- `deny-connection-inline`<br>- `deny-packet-inline`<br>-
    `produce-alert`<br>- `reset-tcp-connection`<br><br>**NOTE:** Event actions associated
    with a category can be entered separately or on a single line.<br><br>**NOTE:**
    To verify the event-action configuration, use the `show ip ips signatures` command.
    |'
  merge: -1
  img_proc: true
- pgno: 201
  md: '| Command | Description |

    |---|---|

    | `Router(config-ips-category-action)#alert-severity {high \| medium \| low \|
    informational}` | (Optional) Change the alert severity rating for a given signature
    or signature category. **NOTE:** To return to the default action, use the `no
    alert-severity` command. |

    | `Router(config-ips-category-action)#fidelity-rating rating` | (Optional) Changes
    the signature fidelity rating for a signature given category. |

    | `Router(config-ips-category)#exit` | Return to IPS category mode. |

    | `Router(config-ips-category)#exit`<br>`Do you want to accept these changes?
    [confirm]` | After signature-based changes are complete, you are prompted to confirm
    whether or not the changes are acceptable.<br><br>Confirming the changes instructs
    IOS IPS to compile the changes for the signature and modify memory structures
    to reflect the change and save the changes to the IPS location specified. |


    **CAUTION:** Do not unretire the all category because it contains all the signatures
    in a signature release. The IOS IPS cannot compile and use all the signatures
    at one time; if it were to do so, it would run out of memory.


    **NOTE:** Use the `show ip ips` command to display IPS configuration information.
    Use the `show ip ips signature-category {config}` command to display IPS signature
    parameters by signature category.


    Apply the IPS rule to a desired interface and specify the direction:


    | Command | Description |

    |---|---|

    | `Router(config-if)#ip ips ips-name {in \| out}` | Apply the IPS rule to an interface.
    The router loads the signatures and builds the signature engines when IPS is applied
    to the first interface:<br><br>`in` inspects only incoming traffic.<br><br>`out`
    inspects only outgoing traffic.<br><br>**NOTE:** The command can be repeated to
    configure incoming and outgoing traffic. |


    **NOTE:** The router prompt disappears while the signatures are loading and the
    signature engines are building. It reappears after these tasks are complete.


    **NOTE:** Building the signature engine can take several minutes depending on
    the router platform and how many signatures are being loaded. It is recommended
    that you enable logging messages so you can monitor the engine building status.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '**NOTE:** The process creates six files in the IPS directory: `router-sigdef-default.xml`,
    which contains all the category default signature definitions; `router-sigdef.xml`,
    which contains signature definitions that have been changed from the default;
    `router-sigdef-type.xml`, which is a file that has all the signature parameter
    definitions; `router-sigdef-category.xml`, which has all the signature category
    information, such as category ios_ips basic and advanced; `router-sigdef-seap.xml`,
    which contains changes made to the default Signature Event Action Processor (SEAP)
    parameters; and `router-seap-typedef.xml`, which contains all of the SEAP parameter
    definitions.


    (Maintenance) To periodically update the signature package after the IPS has been
    configured, use this command:


    `Router#copy url idconf`  Load a signature package to the identified IPS directory.


    `url` specifies the location from which the router loads the signature file (for
    example, FTP, TFTP, USB, rcp).


    **NOTE:** Use the `clear ip ips configuration` to remove all IPS configuration
    entries and release dynamic resources. Use the `clear ip ips statistics` command
    to reset statistics on packets analyzed and alarms sent.


    **NOTE:** Configure automatic signature updates using the `ip ips auto-update`
    command. Updates can be configured to run on the basis of a preset time.


    # Configuring IOS IPS Example


    +   1. Create an IOS IPS configuration directory called **IPS-DIR** in flash.

    +   2. Copy the Cisco IOS IPS signature package from a USB drive to flash.

    +   3. Configure an IOS IPS crypto key.

    +   4. Create an IPS rule called **MY-IPS** and specify the location of the IPS
    file.

    +   5. Enable SDEE event notification.

    +   6. Retire all the signature category and then unretire the **ios-basic** and
    the **ids_evasion** categories. Change the **ids_evasion** default event notification.

    +   7. Assign the IPS rule to inspect inbound traffic on the Fast Ethernet 0/0
    interface.


    Figure 13-1 shows the network topology for the IOS IPS example.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_202_0.png)


    **Figure 13-1**  Network Topology for the IOS IPS Example'
