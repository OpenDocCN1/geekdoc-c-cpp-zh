- pgno: 97
  md: '# # Authenticating Administrative Access


    # ## Local Authentication


    Administrative access to console, vty, and AUX lines and to HTTP access can be
    authenticated locally using the following:


    | Method | Description |

    |---|---|

    | **Line passwords** | Easy to implement using the password and login commands,
    but this is the least-secure method and very vulnerable to brute-force attacks.
    There is also loss of accountability because the password can be shared. |

    | **Local authentication** | Implemented to improve security because the user
    must now provide a username and password, which are compared to entries in the
    local device database. |

    | **Self-contained AAA (local AAA)** | This method is similar to local authentication
    but can provide backup methods of authentication. |


    > **NOTE**  Authenticating locally is not very scalable.


    # ## Server-Based Authentication


    A more scalable method is to use a server-based solution using one of the following
    methods:


    | Method | Description |

    |---|---|

    | **Cisco Secure Access Control Server (ACS) for Windows Server** | The AAA services
    on the router contact an external Cisco Secure ACS Windows Server for user and
    administrator authentication. |

    | **Cisco Secure Access Control System** | The Cisco ACS 5.2 software runs either
    on a dedicated Cisco 1121 Secure Access Control System (CSACS-1121) appliance,
    or on a VMware server. |

    | **Cisco Identity Services Engine (ISE)** | A dedicated appliance that consolidates
    features of Cisco ACS and Network Admission Control (NAC) to provide AAA, profiling,
    posture, and guest management. It is a component of the Cisco TrustSec solution
    and Cisco SecureX Architecture. |'
  merge: -1
  img_proc: true
- pgno: 98
  md: "# Authentication, Authorization, and Accounting Framework\n\nAuthentication,\
    \ authorization, and accounting (AAA) is a standards-based framework that you\
    \ can implement to control who is permitted to access a network (authenticate),\
    \ what they can do while they are there (authorize), and audit what actions they\
    \ performed while accessing the network (accounting).\n\n# Local AAA Authentication\n\
    \nThe following are the general steps to configure a Cisco router to support local\
    \ AAA authentication:\n\n+   1. Add usernames and passwords to the local router\
    \ database.\n+   2. Enable AAA globally on the router using the `aaa new-model`\
    \ command.\n+   3. Configure authentication policies using the `aaa authentication`\
    \ command and specified method lists.\n+   4. (Optional) Configure authorization\
    \ policies using the `aaa authorization` command and specified method lists.\n\
    +   5. (Optional) Configure accounting policies using the `aaa accounting` command\
    \ and specified method lists.\n+   6. Confirm and troubleshoot the AAA configuration.\n\
    \n> **NOTE** Other variations of the `aaa authentication` command include `aaa\
    \ authentication ppp`, `aaa authentication enable`, and `aaa authentication dot1x`.\n\
    \n> **NOTE** Other configurable parameters include `aaa authentication banner`,\
    \ `aaa authentication username-prompt`, `aaa authentication password-prompt`,\
    \ and `aaa authentication fail-message`.\n\n```\n```text\nRouter(config)#username\
    \                  | Add a username and password to the local\n username privilege\
    \ level              | security database.\n secret password\nRouter(config)#aaa\
    \ new-model             | Enable AAA.\n```\n```"
  merge: -1
  img_proc: true
