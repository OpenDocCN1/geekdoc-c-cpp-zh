- pgno: 263
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_263_0.png)


    **Figure 17-16**  VPN Troubleshooting Window


    Enter an IP address on the destination network and click **Continue**.


    Eventually, CCP reports on the VPN status. If successful, a message appears indicating
    that the VPN tunnel is up. Otherwise, an error message appears. Troubleshoot as
    necessary.


    **TIP:** If an error is generated, compare each peer''s running configuration.


    # Monitoring Established IPsec VPN Connections Using CCP


    CCP monitoring is streamlined by using the VPN Status option shown in Figure 17-17.


    Choose **Monitor > Security > VPN Status**.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_264_0.png)


    **Figure 17-17**  VPN Status Screen


    This window displays a tree of VPN connections that are possible on the router,
    including all types of VPNs (remote access, site to site, and others).


    **NOTE:**  Site-to-site tunnels are displayed as IPsec tunnels.


    This group displays statistics about each IPsec VPN that is configured on the
    router. Each row in the table represents one IPsec VPN. This window showcases
    the Monitoring Tunnel and Test Tunnel options, which are essential to the troubleshooting
    process.


    **TIP:**  You have to click Update to refresh the IPsec tunnel table and display
    the most current data from the router.'
