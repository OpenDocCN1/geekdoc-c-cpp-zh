- pgno: 234
  md: '# Encapsulating IPsec Packets


    There are two main IPsec framework protocols:


    | Protocol | Description |

    |---|---|

    | **Authentication Header (AH)** | • AH provides data authentication and integrity.<br>•
    However, it does not provide confidentiality.<br>• AH provides integrity and authentication
    of the payload using either HMAC-MD5 or HMAC-SHA-1.<br>• AH is IP protocol 51.
    |

    | **Encapsulating Security Payload (ESP)** | • ESP provides confidentiality by
    encrypting the payload using DES, 3DES, or AES.<br>• ESP can also provide integrity
    and authentication of the payload using either HMAC-MD5 or HMAC-SHA-1.<br>• ESP
    can also enforce antireplay protection by requiring that a receiving host set
    the replay bit in the header to indicate that the packet has been seen.<br>• ESP
    is IP protocol number 50. |


    **NOTE:** This chapter focuses on ESP, along with other important IPsec protocols.


    # Transport Versus Tunnel Mode


    ESP and AH can be used in two different modes:


    | Mode | Description |

    |---|---|

    | **Transport mode** | • Security is provided only for the transport layer and
    above.<br>• Transport mode protects the payload of the packet but leaves the original
    IP address in the clear.<br>• ESP transport mode is used between hosts. |

    | **Tunnel mode** | • Tunnel mode provides security for the complete IP packet.<br>•
    The original packet is encrypted and then encapsulated in another IP packet.<br>•
    ESP tunnel mode is used between a host and a security gateway or between two security
    gateways. |


    **NOTE:** The focus in this book is on tunnel mode.'
  merge: -1
  img_proc: true
