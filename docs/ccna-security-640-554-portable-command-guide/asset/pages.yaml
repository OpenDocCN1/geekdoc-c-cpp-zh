- pgno: 28
  md: 'Reconnaissance attacks typically involve the unauthorized discovery and mapping
    of systems, services, or vulnerabilities using the following:


    | Method | Description |

    |---|---|

    | **Internet information queries** | Uses readily available Internet tools such
    as WHOIS, which is widely used for querying databases that store the registered
    users or assignees of an Internet resource. |

    | **Ping sweeps** | Method is used to discover a range of live IP addresses. |

    | **Port scanners** | An application program designed to probe a target host for
    open ports and identify vulnerable services to exploit. |

    | **Packet sniffers** | An application program that can intercept, log, and analyze
    traffic flowing over a network (also referred to as a packet analyzer, network
    analyzer, or protocol analyzer). |


    # Access Attacks


    The goal of access attacks is to discover usernames and passwords to access various
    resources. The following are common methods to conduct an access attack:


    | Attack | Description |

    |---|---|

    | **Blended threats** | Blended threats are attack mechanisms that combine the
    characteristics of viruses, worms, Trojan horses, spyware, and others. If the
    threat is successfully initiated, the access attack attempts to gather user information.
    |

    | **Phishing** | Phishing attacks masquerade as a trustworthy entity to get unsuspecting
    users to provide sensitive information (and are usually used for identity theft).
    The attacks are usually carried out using email, instant messaging, or phone contact.
    The message usually directs users to enter details at the hacker’s website. Spear
    phishing is when a phishing attack is directed at a specific user. |

    | **Pharming** | Pharming is an attack aimed at redirecting the traffic of a website
    to another website. Such attacks are usually conducted by exploiting a vulnerable
    Domain Name System (DNS) server. |

    | **Man-in-the-middle attacks** | In a man-in-the-middle attack, a hacker positions
    himself between a user and the destination. The actual implementation can be carried
    out in a variety of ways, including using network packet sniffers or altering
    routing and transport protocols. This type of attack is used for session hijacking,
    theft of information, sniffing and analyzing network traffic, corrupting data
    flows, propagating bogus network information, and for DoS attacks. |

    | **IP and MAC address spoofing** | In IP address spoofing attacks, a hacker forges
    IP packets with trusted IP source addresses. MAC address spoofing similarly forges
    trusted host MAC addresses on a LAN. The attacks are commonly used to create a
    man-in-the-middle situation. |

    | **Trust exploitation** | Trust exploitation refers to when a hacker has compromised
    a target and that host is trusted by another host (new target). |'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Password Cracking


    Hackers can capture passwords using Trojan horse programs, key loggers, or packet
    sniffers. In addition, they can attempt to crack passwords using the following
    methods:


    | | |

    |---|---|

    | **Word lists** | Programs use word lists; phrases; or other combinations of
    letters, numbers, and symbols that are often used as passwords. Programs enter
    word after word at high speed until they find a match. |

    | **Brute force** | This approach relies on power and repetition, comparing every
    possible combination and permutation of characters until it finds a match. It
    eventually cracks any password, but it may be very time-consuming. |

    | **Hybrid cracking** | Some password crackers mix a combination of techniques
    and are highly effective against poorly constructed passwords. |


    # Denial-of-Service Attacks


    DoS attacks send extremely large numbers of requests over a network or the Internet.
    These excessive requests cause the target device to run suboptimally. Consequently,
    the attacked device becomes unavailable for legitimate access and use. By executing
    exploits or combinations of exploits, DoS attacks slow or crash applications and
    processes.


    Types of attacks to compromise availability include the following:


    | | |

    |---|---|

    | **Botnets** | Describes a collection of compromised systems running worms, Trojan
    horses, or backdoors under a common command and control infrastructure. The originator
    of a botnet controls the group of computers remotely. |

    | **Denial of service (DoS)** | A DoS attack sends an extremely large number of
    requests over a network or the Internet to a server or edge device with the intent
    to overwhelm the target, making it unavailable for legitimate access and use.
    This is the most publicized form of attack and among the most difficult to eliminate.
    |

    | **Distributed DoS (DDoS)** | A DDoS attack enlists a network of botnets that
    contains a remotely controlled agent, or zombie, attack program. A master control
    mechanism provides direction and control. When the zombies receive instructions
    from the master agent, they each begin generating malicious traffic that is aimed
    at the victim. |

    | **Other attacks** | Other attacks to compromise availability include TCP synchronization
    (SYN) floods, ICMP floods, cutting electrical power, or sabotaging the computer
    environment. |'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# # Principles of Secure Network Design


    Guidelines to secure a network infrastructure include the following:


    | Principle | Description |

    |---|---|

    | **Defense in depth** | Architecture uses a layered approach to create security
    domains and separate them by different types of security controls. |

    | **Compartmentalization** | Architecture segments the network where different
    assets with different values are in different security domains, be it physical
    or logical. Granular trust relationships between compartments would mitigate attacks
    that try to gain a foothold in lower-security domains to exploit high-value assets
    in higher-security domains. |

    | **Least privilege** | Principle applies a need-to-know approach to trust relationships
    between security domains. This results in restrictive policies, where access to
    and from a security domain is allowed only for the required users, applications,
    or network traffic. Everything else is denied by default. |

    | **Weakest link** | Architecture uses a layered approach to security, with weaker
    or less-protected assets residing in separated security domains. Humans are often
    considered to be the weakest link in information security architectures. |

    | **Separation and rotation of duties** | Concept of developing systems where
    more than one individual is required to complete a certain task to mitigate fraud
    and error. This applies to information security controls, and it applies to both
    technical controls and human procedures to manage those controls. |

    | **Mediated access** | Principle is based on centralizing security controls to
    protect groups of assets or security domains such as using firewalls, proxies,
    and other security controls to act on behalf of the assets they are designed to
    protect, and mediate the trust relationships between security domains. |

    | **Accountability and traceability** | Architecture should provide mechanisms
    to track the activity of users, attackers, and even security administrators. It
    should include provisions for accountability and non-repudiation. This principle
    translates into specific functions, such as security audits, event management
    and monitoring, forensics, and others. |


    # ## Defense in Depth


    Defense in depth provides a layered security approach by using multiple security
    mechanisms. The security mechanisms should complement each other but not depend
    on each other. The use of this approach can eliminate single points of failure
    and augment weak links in the system to provide stronger protection with multiple
    layers.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Recommendations for a defense-in-depth strategy include the following:


    | Principle | Description |

    |---|---|

    | **Defend in multiple places** | Threat vectors can occur from various locations.
    Therefore, an organization must deploy protection mechanisms at multiple locations
    to resist all classes of attacks. Includes defending the networks and infrastructure,
    enclave boundaries, and the computing environment. |

    | **Build layered defenses** | All products have inherent weaknesses. Therefore,
    an effective countermeasure is to deploy multiple defense mechanisms between the
    adversary and the target. |

    | **Use robust components** | Specify the security robustness based on the value
    of the asset to be protected. For instance, deploy stronger mechanisms at the
    network boundaries than at the user desktop. |

    | **Employ robust key management** | Deploy robust encryption key management and
    public key infrastructures that are highly resistant to attack. |

    | **Deploy intrusion detection/prevention systems (IDSs/IPSs)** | Deploy infrastructures
    to detect and prevent intrusions and to analyze and correlate the results and
    react accordingly. |'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# CHAPTER 2

    # Implementing Security Policies Using a Lifecycle Approach


    The chapter covers the following topics:


    # Risk Analysis


    +   - Quantitative Risk Analysis Formula

    +   - Quantitative Risk Analysis Example

    +   - Regulatory Compliance


    # Security Policy


    +   - Standards, Guidelines, and Procedures

    +   - Security Policy Audience Responsibilities

    +   - Security Awareness


    # Secure Network Lifecycle Management


    +   - Models and Frameworks

    +   - Assessing and Monitoring the Network Security Posture

    +   - Testing the Security Architecture


    # Incident Response


    +   - Incident Response Phases

    +   - Computer Crime Investigation

    +   - Collection of Evidence and Forensics

    +   - Law Enforcement and Liability

    +   - Ethics


    # Disaster-Recovery and Business-Continuity Planning


    # Risk Analysis


    Risk needs to be framed, assessed, monitored, and responded to. Risk, compliance,
    and security policies are major components of security architectures. The primary
    purpose of risk analysis is to quantify the impact of an individual potential
    threat.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'There are two types of risk analysis:


    | Type | Description |

    |---|---|

    | **Quantitative risk analysis** | Uses a mathematical model using an estimated
    value for an asset multiplied by the likelihood of a threat being realized. Quantitative
    risk analysis provides an actual monetary figure of expected losses, which is
    then used to estimate an annual cost. The resulting numbers can also be used to
    justify proposed countermeasures. |

    | **Qualitative risk analysis** | Uses a scenario model. Can be performed in a
    shorter period of time and with less data. Qualitative risk assessments are descriptive
    versus measurable. Qualitative risk assessments may precede a quantitative risk
    analysis. |


    # Quantitative Risk Analysis Formula


    Risk management is based on its building blocks of assets and vulnerabilities,
    threats, and countermeasures. Quantitative analysis relies on specific formulas
    to determine the value of the risk decision variables. Figure 2-1 displays the
    quantitative risk analysis formula.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_33_0.png)


    **Figure 2-1**  Quantitative Risk Analysis Formula


    Quantitative risk analysis terms include the following:


    | Term | Description |

    |---|---|

    | **Asset value (AV)** | This estimated value includes the purchase price, the
    cost of deployment, and the cost of maintenance. |

    | **Exposure factor (EF)** | This estimates the degree of destruction that may
    occur. It is represented as a percentage that a realized threat could have on
    an asset. |

    | **Single loss expectancy (SLE)** | This calculation represents the expected
    loss from a single occurrence of the threat. The SLE is defined as the AV × EF.
    |'
  merge: -1
  img_proc: true
- pgno: 34
  md: '| Term | Description |

    |---|---|

    | **Annualized rate of occurrence (ARO)** | This is the estimated frequency that
    a threat is expected to occur. It is the number of times that one may reasonably
    expect the risk to occur during one year. This estimate is very difficult and
    is usually based on past experience. |

    | **Annualized loss expectancy (ALE)** | This is the expected financial loss that
    an individual threat may cause. The ALE is a monetary value derived from the formula
    SLE x ARO. This number is used to justify the least-cost security measures. |


    # Quantitative Risk Analysis Example


    An administrator of a data center must provide a projection for a flood disaster.
    Assume that the overall value of a data center is $10,000,000 (AV). It is estimated
    that 60% (EF) of the data center would be destroyed in the event of a flood (risk):


    +   - SLE = AV x EF

    +   - SLE = $10,000,000 x 60% = $6,000,000


    The SLE assigns a monetary value for a single occurrence. It represents the organization’s
    potential loss amount if a specific threat exploits a vulnerability.


    The ALE is the total amount of money that the organization will lose in 1 year
    if nothing is done to mitigate the fault. It is often used to justify the lowest-cost
    security measure. If the likelihood of a flood occurring is estimated at once
    in 100 years (1/100), the ARO equals 1%:


    +   - ALE = SLE x ARO

    +   - ALE = $6,000,000 x 1% = $60,000


    The ALE provides a value that the organization can work with to budget the cost
    to establish controls or safeguards to prevent this type of damage.


    # Regulatory Compliance


    The current regulatory landscape is broader and more international. Compliance
    regulations define not only the scope and parameters for the risk and security
    architectures of an organization, but also the liability for those who do not
    comply.


    The following are compliance regulations, their geographic scope, and which organizations
    a regulation applies to:


    | Regulation | Geographic Boundary | Description |

    |---|---|---|

    | DMCA | U.S. | The Digital Millennium Copyright Act (DMCA) protects against copyright
    infringement. It heightens the penalties for copyright infringement on the Internet.
    |'
  merge: -1
  img_proc: true
- pgno: 35
  md: '| Regulation | Geographic Boundary | Description |

    |---|---|---|

    | FISMA | U.S. | The Federal Information Security Management Act (FISMA) of 2002
    requires that the U.S. government federal agencies, service organizations, and
    affiliated parties be subject to yearly cyber security audits. |

    | GLB | U.S. | The Gramm-Leach-Bliley (GLB) Act (also known as the Financial Services
    Modernization Act of 1999) applies mostly to banks, investment companies, and
    insurance agencies and governs the collection, disclosure, and protection of consumer
    information. |

    | HIPAA | U.S. | The Health Insurance Portability and Accountability Act (HIPAA)
    of 2000 includes a set of national standards for healthcare transactions that
    provide assurances that the electronic transfer of confidential patient information
    will be as safe as, or safer than, paper-based patient records. |

    | SOX | U.S. | The Sarbanes-Oxley (SOX) Act of 2002 governs the accounting and
    reporting practices of publicly traded companies in the United States. It was
    created in response to accounting scandals, including those affecting Enron, Tyco
    International, Peregrine Systems, and WorldCom. |

    | PIPEDA | Canada | The Personal Information Protection and Electronic Documents
    Act governs how private-sector organizations collect, use, and disclose personal
    information in the course of commercial business. |

    | NERC | North America | The North American Electric Reliability Corporation (NERC),
    a nonprofit corporation that seeks to ensure the reliability of the North American
    bulk electric power system, applies to users, owners, and operators in that system.
    |

    | EU Data Protection Directive | European Union | This act contains eight "data
    protection principles" that specify how personal data is securely collected, maintained,
    and disposed of. It applies to all organizations operating in the 27 member countries.
    |

    | Safe Harbour Act | European Union | It prohibits European firms from transferring
    personal data to overseas jurisdictions with weaker privacy laws. |

    | Basel II | Global | An international standard with which banking regulators
    must comply. It requires them to put aside enough capital to guard against risk.
    It applies to all internationally active banks with assets of more than $250 billion.
    |'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Security Policy


    A security policy is a set of objectives for the company, rules of behavior for
    users and administrators, and requirements for system and management that collectively
    ensure the security of network and computer systems in an organization.


    It is a “living document,” meaning that the document is never finished and is
    continuously updated as technology and employee requirements change. One document
    will not likely meet the needs of the entire audience of a large organization.


    The audience of the security policy should be employees, contractors, suppliers,
    or customers who have access to your network.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_36_0.png)


    Figure 2-2 displays a common corporate policy structure for most organizations:


    |  |  |

    |---|---|

    | Governing policy | It details the company’s overall security policy philosophy.
    It defines information security concepts at a high level, describes why they are
    important, and details the organization’s stand. It supports the technical and
    end-user policies. |

    | Technical policies | Security staff creates technical policies to implement
    the security requirements outlined in the governing policy. These policies describe
    what the security staff does but do not dictate how the security staff performs
    its functions. |

    | End-user policies | Documents contain security policies important to end users.
    |


    Technical policies can be categorized as follows:


    |  |  |

    |---|---|

    | General policies | Define the use of equipment, computing services, and security
    guidelines. May include an acceptable use policy (AUP), account access policy,
    password policy, acquisition policy, audit policy, and information sensitivity
    policy. |

    | Remote-access policies | Defines the standards for connecting to the organization
    network from an external host or network. Typically include a virtual private
    network (VPN) security policy. |

    | Network policies | Define standards to secure all wired and wireless networks
    data ports. May also include general network access policies and policies to access
    routers, switches, servers, and extranets. |'
  merge: -1
  img_proc: true
- pgno: 37
  md: '<table>

    <tr><td>Email policies</td><td>Define standards to protect the email infrastructure
    of the organization. May also include an automatic forwarding of email policy
    and spam policy.</td></tr>

    <tr><td>Other policies</td><td>Other categories may include telephony policies,
    application use policies, and wireless policies.</td></tr>

    </table>


    # ## Standards, Guidelines, and Procedures


    Security policies establish a framework within which to work, but they are usually
    too general to be of much use to individuals responsible for implementing these
    policies.


    Therefore, more detailed documents exist, including the following:


    <table>

    <tr><td>Standards</td><td>Allow IT staff to be consistent by specifying the use
    of technologies. They are usually mandatory and help provide consistency, uniformity,
    and efficiency.</td></tr>

    <tr><td>Guidelines</td><td>These are best practices that provide a list of suggestions
    on how things can be done better. They are similar to standards, but are more
    flexible and are not usually mandatory.</td></tr>

    <tr><td>Procedures</td><td>Documents include the details of implementation, usually
    with step-by-step instructions and graphics.</td></tr>

    </table>


    Figure 2-3 provides a hierarchical view of the information security policy framework.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_37_0.png)


    Figure 2-3 Information Security Policy Framework'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Security Policy Audience Responsibilities


    Key individuals in an organization responsible for the security policy are as
    follows:


    | Audience | Responsibility |

    |---|---|

    | Senior management (CEO) | Is ultimately responsible for the security policy
    |

    | Senior security IT management (CSO, CIO, CISO) | Are responsible for the security
    policy |

    | Senior security IT staff | Have input on the security policy and possibly draft
    sections of the security policy. |

    | Security IT staff | Are responsible for implementing the security policy |

    | End-users | Are responsible for complying with the security policy |


    # Security Awareness


    An effective computer security awareness and training program requires proper
    planning, implementation, maintenance, and periodic evaluation. In general, a
    computer security awareness and training program should encompass the following
    seven steps:


    +   1. Identify program scope, goals, and objectives.

    +   2. Identify training staff.

    +   3. Identify target audiences.

    +   4. Motivate management and employees.

    +   5. Administer the program.

    +   6. Maintain the program.

    +   7. Evaluate the program.


    # Secure Network Lifecycle Management


    The lifecycle approach may also help you understand the framing of information
    security.'
  merge: -1
