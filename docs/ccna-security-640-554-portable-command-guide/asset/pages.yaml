    # ASA Command-Line Interface


    The Adaptive Security Appliance (ASA) command-line interface (CLI) is a proprietary
    OS that has a similar look and feel to the router IOS. Like a Cisco IOS router,
    the ASA recognizes the following:


    +   - Abbreviation of commands and keywords

    +   - Using the Tab key to complete a partial command

    +   - Using the help key (?) after a command to view additional syntax'
