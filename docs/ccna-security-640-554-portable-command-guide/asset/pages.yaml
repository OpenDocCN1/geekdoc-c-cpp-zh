  md: "# CHAPTER 9\n# Securing the Data Plane in IPv6 Environments\n\nThis chapter\
    \ covers the following topics:\n\n+   **Overview of IPv6**\n+   - Comparison Between\
    \ IPv4 and IPv6\n+   - The IPv6 Header\n+   - ICMPv6\n+   - Stateless Autoconfiguration\n\
    +   - IPv4-to-IPv6 Transition Solutions\n+   - IPv6 Routing Solutions\n+   \n\
    +   **IPv6 Threats**\n+   - IPv6 Vulnerabilities\n+   \n+   **IPv6 Security Strategy**\n\
    +   - Configuring Ingress Filtering\n+   - Secure Transition Mechanisms\n+   -\
    \ Future Security Enhancements\n\n# ## Overview of IPv6\n\nComparison Between\
    \ IPv4 and IPv6\n\n| IP Service | IPv4 | IPv6 |\n|---|---|---|\n| IP header |\
    \ Consists of a 20-byte field containing multiple fields. | Consists of a 40-byte\
    \ field containing fewer fields, making it simpler, and provides better routing\
    \ efficiency. |\n| Addressing range | Requires a 32-bit dotted-decimal address\
    \ to provide 4.3 x 10^9 (4.3 billion) addresses. | Requires a 128-bit hexadecimal\
    \ address to provide 3.4 x 10^28 addresses with multiple scopes. |\n| Address\
    \ types | Includes unicast, multicast, and broadcast addresses. | Includes unicast,\
    \ multicast, and anycast addresses. No broadcast addresses means that it is not\
    \ susceptible to broadcast storms. |"
  merge: -1
