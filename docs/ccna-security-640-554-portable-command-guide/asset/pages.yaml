    # Peer Authentication Methods


    | Method | Description |

    |---|---|

    | **Pre-shared keys (PSK)** | ▪ Peers authenticate each other by comparing preconfigured
    secret keys.<br>▪ The PSK is combined with other information to create the authentication
    key. |

    | **RSA signatures** | ▪ Peers authenticate each other using digital certificates.<br>▪
    The sending peer creates an encrypted hash using their private key, attaches it
    to a message, and forwards it.<br>▪ The remote peer decrypts the hash using the
    public key and compares it with a recomputed hash. |

    | **RSA encrypted nonces** | ▪ Peers authenticate each other using RSA-generated
    random numbers (called nonces).<br>▪ Public keys must be manually copied to each
    peer as part of the configuration process.<br>▪ This method is the least popular.
    |

    | **Elliptical Curve Digital Signature Algorithm (ECDSA)** | ▪ ECDSA is the method
    used for the Digital Signature Standard (DSS).<br>▪ ECDSA improves the communication
    efficiency:<br>&nbsp;&nbsp;▪ It is quicker than similar-strength RSA operations.<br>&nbsp;&nbsp;▪
    It is smaller than RSA signatures. |


