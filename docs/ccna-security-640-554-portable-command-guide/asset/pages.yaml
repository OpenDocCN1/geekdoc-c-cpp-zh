- pgno: 247
  md: '> **NOTE:** Changes to transform sets are not applied to existing SAs but are
    used in subsequent negotiations to establish new SAs. To force the settings sooner,
    clear all or part of the SA database by using the `clear crypto sa` command.


    > **NOTE:** Use the `show crypto ipsec transform-set` command to verify the IPsec
    settings.


    Create the crypto map specifics:


    | Command | Description |

    |---|---|

    | `Router(config)#crypto map map-name sequence-number ipsec-isakmp` | Define the
    site-to-site IPsec VPN crypto map settings. |


    > **NOTE:** Other options are available, but the focus of this chapter is on IPsec
    and ISAKMP crypto map definitions.


    Configurable site-to-site VPN crypto map parameters include the following:


    +   - Identify the remote peers.

    +   - Identify the transform set to use.

    +   - Identify interesting traffic.


    > **NOTE:** Other options can be configured, but these are typical for site-to-site
    VPNs.


    Configure crypto map specifics:


    | Command | Description |

    |---|---|

    | `Router(config-crypto-map)# description description` | Add the description to
    the crypto map. |

    | `Router(config-crypto-map)#set peer peer-ip` | Specify an IPsec peer. **NOTE:**
    You can identify multiple peers using separate commands. |

    | `Router(config-crypto-map)#set transform-set transform-name1 [transform-name2
    ... transform-name6]` | Specify which transform sets can be used with the crypto
    map entry. **NOTE:** You can identify up to six transform sets in one command.
    |

    | `Router(config-crypto-map)#match address crypto-acl` | Assign an extended access
    list to a crypto map entry that will be used by IPsec to determine which traffic
    should be protected by crypto and which traffic does not need crypto protection.
    **NOTE:** Traffic that is permitted by the access list will be protected. Traffic
    that is denied by the access list will not be protected in the context of the
    corresponding crypto map entry. |'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Identify interesting traffic using an extended access control list (ACL). The
    ACL identifies when source traffic going to a destination network should enable
    the VPN tunnel. The extended ACL can be numbered or named.


    > **NOTE:** The extended ACLs between peers should be reciprocal (for example,
    on Peer-A, source-A to destination-B and on Peer-B, source-B to destination-A).


    Apply the crypto map to an interface:


    | Command | Description |

    |---|---|

    | `Router(config)#interface type number` | Specify the interface type and number.
    |

    | `Router(config-if)#crypto map crypto-map-name` | Apply a previously defined
    crypto map set to an interface. |


    # Verifying the VPN Tunnel


    To verify the site-to-site VPN configuration, use the following commands.


    To verify IKE phase status, use these commands:


    | Command | Description |

    |---|---|

    | `Router#show crypto isakmp policy` | Display configured IKE policies. |

    | `Router#show crypto isakmp sa (active)` | Display the status of the IKE phase
    1 SAs. |


    > **NOTE:** The `show crypto isakmp sa` command displays the state and status
    of Phase 1. A state of QM_IDLE is considered normal for an established Phase 1
    tunnel.


    To verify IKE Phase 2 status, use these commands:


    | Command | Description |

    |---|---|

    | `Router#show crypto isakmp transform-set` | Display configured IPsec transform
    sets. |

    | `Router#show crypto map` | Display configured crypto maps. |

    | `Router#show crypto ipsec sa` | Display established IPsec tunnels. |


    To test a tunnel, complete these steps:


    +   1. Clear the IPsec SAs using the `clear crypto sa` command.

    +   2. Issue the `show crypto ipsec sa` command to verify that the counters have
    been cleared.

    +   3. Create interesting traffic using an extended ping such as `ping destination-network-ip
    source source-network-ip`.

    +   4. Issue the `show crypto ipsec sa` command to verify that the counters have
    increased.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Configuring a Site-to-Site IPsec VPN Using IOS Example


    This example establishes a site-to-site VPN between R1 and R3, protecting traffic
    that travels between the two LAN segments. A strong cipher suite is required,
    using PSKs, AES 128-bit, and SHA.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_249_0.png)


    Figure 17-1  Network Topology for Site-to-Site IPsec VPN Example


    Create IKE policy 1 and configure the required Phase 1 parameters:


    | Command | Description |

    |---|---|

    | `R1(config)#crypto isakmp policy 1` | Define the IKE policy settings. |

    | `R1(config-isakmp)#authentication pre-share` | Set the authentication method
    for the IKE policy. |

    | `R1(config-isakmp)#encr aes 128` | Set the encryption algorithm for the IKE
    policy. |

    | `R1(config-isakmp)#hash sha` | Set the hashing algorithm for the IKE policy.
    |

    | `R1(config-isakmp)#group 5` | Set the DH group to use for the IKE policy. |

    | `R1(config-isakmp)#lifetime 86400` | Set the IKE SA expiration timer to 24 hours.
    |

    | `R1(config-isakmp)#exit` | Return to global configuration mode. |


    Specify the PSK and identify the peer address (or hostname):


    ```

    R1(config)#crypto isakmp key cisco123 address 209.165.202.129    Set the PSK for
    the R3 peer.

    ```'
  merge: -1
  img_proc: true
