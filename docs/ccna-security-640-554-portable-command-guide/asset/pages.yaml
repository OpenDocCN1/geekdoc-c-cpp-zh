- pgno: 338
  md: 'This chapter covers the following topics:


    +   - **Remote-Access VPNs**

    +     - Types of Remote-Access VPNs

    +   - **ASA SSL VPNs**

    +     - Client-Based SSL VPN Example Using ASDM

    +     - Clientless SSL VPN Example Using ASDM


    # ## Remote-Access VPNs


    Enterprise users are requesting support for their mobile devices, including smart
    phones, tablets, notebooks, and a broader range of laptop manufacturers and operating
    systems.


    This shift has created a challenge for IT security. The solution is the use of
    Secure Sockets Layer (SSL) virtual private networks (VPNs) to secure access for
    all users, regardless of the endpoint from which they establish a connection.


    Both Cisco Integrated Services Routers (ISR) and Adaptive Security Appliances
    (ASA) provide IPsec and SSL VPN capabilities. However, an ASA can support up to
    10,000 concurrent sessions per device. The ASA is usually the choice when supporting
    a large remote networking deployment.


    # ## Types of Remote-Access VPNs


    The ASA supports three types of remote-access VPNs:


    | Type | Description |

    |---|---|

    | Clientless SSL VPN | Clientless SSL VPN remote access (using a web browser).<br><br>•
    Browser-based VPN, which lets users establish a secure, remote-access VPN tunnel
    to the ASA.<br>• After authentication, users access a portal page and can access
    specific supported internal resources. |'
  merge: -1
  img_proc: true
- pgno: 339
  md: '|  |  |

    |---|---|

    | **Client-based SSL or IPsec VPN** | - SSL or IPsec (IKEv2) VPN remote access
    (using Cisco AnyConnect Client).<br>- Provides full-tunnel SSL VPN connection
    but requires a VPN client, such as the Cisco AnyConnect VPN client to be installed
    on the host.<br>- The AnyConnect client can be manually preinstalled on the host
    or downloaded on-demand to a host via a browser.<br>- After authentication, the
    user’s PC is assigned an internal IP address and can access network resources
    as though they were on the local network. |

    | **IPsec (IKEv1) VPN** | - IPsec (IKEv1) VPN remote access (using Cisco VPN client).
    |


    # ## ASA SSL VPN


    ASA SSL VPNs can be configured using the following:


    +   - ASDM VPN Assistant

    +   - ASDM VPN Wizard


    To open the ASDM VPN Assistant, choose **Configurations > Remote-Access VPN >
    Introduction**, as shown in Figure 22-1.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_339_0.png)


    Figure 22-1  ASDM VPN Assistant Screen


    Alternatively, start the VPN Wizard using the menu bar: **Wizards > VPN Wizards
    > AnyConnect VPN Wizard** (see Figure 22-2).'
  merge: -1
  img_proc: true
- pgno: 340
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_340_0.png)


