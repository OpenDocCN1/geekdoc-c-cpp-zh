  md: '# Network Monitoring


    Network monitoring includes using syslog and Simple Network Management Protocol
    (SNMP) features. Regardless, all devices can be synchronized using NTP.


    # Configuring a Network Time Protocol Master Clock


    Time synchronization between devices is critical. Devices should be synchronized
    with a public time server on the Internet or with an internal time source.


    You can configure a router to be an NTP master clock source when other sources
    are not available.


    | Command | Description |

    |---|---|

    | `Router(config)#ntp master stratum` | Configure the router to be the NTP master.
    |

    |  | The stratum number is optional and is the number of hops away from an authoritative
    time source, such as an atomic clock. |

    | `Router(config)#ntp authenticate` | Enable NTP authentication. |

    | `Router(config)#ntp authentication-key key-number md5 key-value` | Define the
    NTP key and password and encrypt it using MD5. |

    | `Router(config)#ntp trusted-key key-number` | Identify the trusted key on the
    master. |

    |  | To synchronize, an NTP client must provide the correct trusted key and password.
    |


    # Configuring an NTP Client


    | Command | Description |

    |---|---|

    | `Client(config)#ntp server ntp-server-address` | Enable Router to be the master
    clock to which peers will synchronize. |

    | `Client(config)#ntp authentication-key key-number md5 key-value` | Define the
    NTP key and password and encrypt it using MD5. |

    | `Client(config)#ntp trusted-key key-number` | Identify the trusted key on the
    master. |


    **NOTE:** Other NTP-related commands are also available.


    # Configuring an NTP Master and Client Example


    The following example configures R1 to be the master NTP clock:


    | Command | Description |

    |---|---|

    | `R1#clock set 9:00:00 july 1 2012` | Set the local device clock. |

    | `R1(config)#ntp master 1` | Enable R1 to be the master clock to which clients
    will synchronize. |'
  merge: -1
  img_proc: true
- pgno: 87
  md: '| Command | Description |

    |---|---|

    | `R1(config)#ntp authentication-key 1 md5 cisco123` | Specify the NTP password
    and encrypt it using MD5. In this example, a peer router must authenticate with
    the password cisco123. |

    | `R1(config)#ntp trusted-key 51` | Identify the trusted key on the master. A
    peer must also provide the correct trusted key in its NTP packets. |

    | `R1(config)#ntp authenticate` | Enable NTP authentication. |


    The following example configures R3 to be the NTP client:


    | Command | Description |

    |---|---|

    | `R3(config)#ntp server 10.1.1.1` | Enable R1 to be the master clock with which
    peers will synchronize. |

    | `R3(config)#ntp authentication-key 1 md5 cisco123` | Specify the NTP password
    and encrypt it using MD5. In this example, a peer router must authenticate with
    the password cisco123. |

    | `R3(config)#ntp trusted-key 51` | Identify the trusted key on the master. A
    peer must also provide the correct trusted key in its NTP packets. |


    > **NOTE:** It may take up to 2 minutes for the device clock to synchronize with
    the NTP master.


    You can verify the clock settings using the `show clock`, `show ntp associations`,
    and `show ntp status` commands.


    # Configuring an NTP Client Using CCP Example


    In this example, the time is set on R1 and it is configured as the NTP master
    via the CLI. Then R1 is specified, using CCP, as the NTP server to NTP client
    router R3.


    > **NOTE:** You must use the CLI to configure a router as an NTP master. CCP can
    be used only to configure an NTP client.


    To configure R3 to be an NTP client, choose **Configure > Router > Time > NTP
    and SNTP**, and then click **Add**. The Add NTP Server Detail window opens (see
    Figure 6-9).'
  merge: -1
