  md: '# Implementing Role-Based Access Control on Cisco Routers


    # Configuring Privilege Levels


    | Command | Description |

    |---|---|

    | `Router(config)#privilege mode {level level command \| reset command}` | Assign
    commands to a custom privilege level between level 2 and 14.<br><br>There are
    16 privilege levels. Level 0 is entry level, level 1 is for user EXEC access,
    and level 15 is privileged EXEC mode. Levels 2–14 are customizable. |

    | `Router(config)#enable secret level level password` | Assign a password to the
    custom privilege level. |

    | `Router>enable level` | Enter a custom privilege level. |


    **NOTE:** Use the `show privilege` command to display the current privilege level.


    # Configuring Privilege Levels Example


    | Command | Description |

    |---|---|

    | `R1(config)#privilege exec level 5 ping` | Add the ping command to level 5.
    |

    | `R1(config)#privilege exec level 5 reload` | Add the reload command to level
    5. |

    | `R1(config)#enable secret level 5`<br>`cisco12345` | Configure an enable password
    to enter level 5. |

    | `R1>enable 5`<br>`Password:` | The user logs in with privilege level 5.<br><br>Along
    with the regular user EXEC commands, the level 5 user also has the ping and reload
    available. |

    | `R1#show privilege`<br>`Current privilege level is 5` | Verify the privilege
    level. |


    # Configuring RBAC via the CLI


    | Command | Description |

    |---|---|

    | `Router(config)#aaa new-model` | Enable AAA. AAA must be configured before you
    can enable a view. |

    | `Router#enable view`<br>`Password:` | Enter root view. Required to configure
    and alter views. Use the enable password when prompted. |'
  merge: -1
