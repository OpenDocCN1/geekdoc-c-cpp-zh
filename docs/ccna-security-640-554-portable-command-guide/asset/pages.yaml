- pgno: 226
  md: 'This chapter covers the following topics:


    # Asymmetric Encryption


    +   - Public Key Confidentiality and Authentication

    +   - RSA Functions


    # Public Key Infrastructure


    +   - PKI Terminology

    +   - PKI Standards

    +   - PKI Topologies

    +   - PKI Characteristics


    # Asymmetric Encryption


    Asymmetric algorithms are based on complex mathematical formulas, and therefore
    computation takes more time than symmetric algorithms.


    Examples of public key encryption algorithms are the Rivest, Shamir, and Adleman
    (RSA) algorithm; Digital Signature Algorithm (DSA); Diffie-Hellman (D-H); ElGamal;
    and elliptic curve cryptography (ECC).


    # Public Key Confidentiality and Authentication


    Asymmetric algorithms use a public key and a private key. Both keys are capable
    of encryption. However, the complementary matched key is required for decryption.


    For example, if a public key encrypts the data, the matching private key decrypts
    the data. The opposite is also true. If a private key encrypts the data, the corresponding
    public key decrypts the data.


    Asymmetric cryptography is used to accomplish confidentiality and authentication.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '| Public Key Confidentiality | Confidentiality = Public Key (Encrypt) + Private
    Key (Decrypt) |

    |---|---|

    |  | ▪ The public key is used to encrypt; the corresponding private key is used
    to decrypt.<br>▪ Because the private key is only present on one system, confidentiality
    is achieved in communicating with that system.<br>▪ This scenario is often used
    for key exchange. |

    | Public Key Authentication | Authentication = Private Key (Encrypt) + Public
    Key (Decrypt) |

    |  | ▪ The private key is used to encrypt; the corresponding public key is used
    to decrypt.<br>▪ Because the private key is only present on one system, authentication
    is assured when its public key decrypts the message. |


    # RSA Functions


    RSA is one of the most common asymmetric algorithms because it is easy to implement.
    It is very flexible because it has a variable key length that allows speed to
    be traded for the security of the algorithm if necessary. An RSA key is usually
    512–2048 bits long. The security of RSA is based on the difficulty of factoring
    very large numbers, which is breaking large numbers into multiplicative factors.
    RSA is substantially slower than Digital Encryption Standard (DES) and is typically
    used only to protect small amounts of data within the context of confidentiality.


    RSA is mainly used for two services:


    +   - To ensure confidentiality of data by performing encryption, usually for
    small amounts of data such as session keys

    +   - To perform authentication of data or nonrepudiation of data, or both, by
    generating digital signatures


    # Public Key Infrastructure


    A public key infrastructure (PKI) ensures confidentiality, integrity, and authentication
    in an enterprise and is based on the fundamentals of asymmetric encryption. PKI
    solutions are based on digital certificates and a trusted third-party trust model.


    PKI uses the power of private and public keys, digital signatures, and trust models
    that are derived from asymmetric encryption. PKI provides services that include
    identity management, software code signing, encrypted file systems, email, virtual
    private networks (VPNs), and others.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'The PKI is a set of technical, organizational, and legal components. Those
    components are needed to establish a system that enables large-scale use of public
    key cryptography to provide authenticity, confidentiality, integrity, and nonrepudiation
    services.


    # PKI Terminology


    | Term | Definition |

    |---|---|

    | **Public key infrastructure (PKI)** | A service framework needed to support
    large-scale public key-based technologies. |

    | **Certificates** | Electronic document that binds a name of a user or organization
    to a public key certificate (digital certificate).<br><br>Digital certificates
    are digitally signed by a CA.<br><br>The certificate can be used to verify that
    a public key belongs to an individual or an organization. |

    | **Certificate authority (CA)** | A certificate authority (that is, a trusted
    third party) binds public keys with respective user identities.<br><br>It digitally
    signs and publishes the public keys associated with an organization.<br><br>Commercial
    CAs (for example, VeriSign) charge for services and are trusted by most web browsers.<br><br>Some
    service providers provide public CAs and do not charge for services.<br><br>CAs
    can also be implemented by an organization or a government for its users. |

    | **Registration authority (RA)** | PKI servers that help CAs by performing key
    management tasks and therefore offloading the CA.<br><br>They are like proxies
    of the CA.<br><br>They minimize CA exposure to the network. |


    **NOTE:** Certificates are commonly used at the application layer for Secure Sockets
    Layer (SSL), Transport Layer Security (TLS), Secure MIME (S/MIME), and Pretty
    Good Privacy (PGP). Cisco devices can use certificates for the initial key exchange
    (IKE) in IPsec VPNs and in 802.1x authentication using Extensible Authentication
    Protocol-TLS (EAP-TLS).


    # PKI Standards


    PKI requires interoperability with other technologies from different PKI vendors.
    The Internet Engineering Task Force (IETF) has formed the PKIX Working Group that
    is dedicated to promoting and standardizing PKI for the Internet.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Solutions include the following


    | Term | Description |

    |---|---|

    | X.509 | • A well-known ITU-T standard that defines basic PKI standard formats
    for public key certificates and certificate revocation lists (CRL).<br>• X.509
    Version 3 (X.509v3) defines the digital certificate format that is used extensively
    in SSL website authentication, email agents, and IPsec VPNs for initial key exchange.
    |

    | Public-Key Cryptography Standards (PKCS) | • RSA standards that define formats
    for the secure exchange of data, including the following:<br>• PKCS #1: RSA Cryptography
    Standard<br>• PKCS #3: DH Key Agreement Standard<br>• PKCS #7: Cryptographic Message
    Syntax Standard<br>• PKCS #8: Private-Key Information Syntax Standard<br>• PKCS
    #10: Certification Request Syntax Standard<br>• PKCS #12: Personal Information
    Exchange Syntax Standard<br>• PKCS #13: Elliptic Curve Cryptography Standard<br>•
    PKCS #15: Cryptographic Token Information Format Standard |


    # PKI Topologies


    | Topology | Description |

    |---|---|

    | Simple (single-root) PKI | • Issues all the certificates to the end users.<br>•
    The benefit in such a setup is simplicity.<br>• VPNs that are managed by a single
    organization often use this topology. |

    | Hierarchical CA topology | • Involves multiple hierarchical CAs within an organization.<br>•
    CAs can issue certificates to end users and to subordinate RAs, which in turn
    issue their certificates to end users or other CAs.<br>• The main benefits are
    increased scalability and manageability.<br>• Trust decisions can now be hierarchically
    distributed to smaller branches. |

    | Cross-certified CAs | • Involves multiple flat, single-root CAs that establish
    trust relationships horizontally by cross-certifying their own CA certificates.
    |'
