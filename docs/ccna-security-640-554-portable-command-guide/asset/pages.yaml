    routers (Cisco 815-1812) are DHCP clients and attempt to obtain IP addressing
    automatically from an upstream device.


    +   1. Connect the PC to the Fast Ethernet 0/0 (or Gigabit Ethernet) 0/0 interface.

    +   2. Configure the PC IP address 10.10.10.2/29 on the host.

    +   3. Launch the preinstalled CCP application by choosing the Windows Start >'
