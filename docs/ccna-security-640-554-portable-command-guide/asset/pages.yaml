- pgno: 93
  md: '# Configuring SNMP


    SNMP enables network administrators to manage network performance, find and solve
    network problems, and plan for network growth. SNMP is used to capture (trap)
    log information, but can also be configured to get information as needed and to
    send configuration changes to a device.


    **NOTE:** Three versions of SNMP are available: SNMPv1 (legacy), SNMPv2, and SNMPv3.
    SNMPv3 is the most secure. Use SNMPv2 only if SNMPv3 is not supported.


    **NOTE:** To send SNMP messages to an SNMP server, SNMPv1 and SNMPv2 use read-only
    community strings to authenticate with a server. To authenticate configuration
    changes from an SNMP server, SNMP uses read-write community strings.


    **TIP:** Change the default names of the read-only and read-write community strings.


    # Configuring SNMP Using CCP


    To enable syslog logging using CCP, choose **Configure > Router > SNMP**. The
    SNMP informational screen will display, as shown in Figure 6-15.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_93_0.png)


    Figure 6-15  SNMP Information Screen'
