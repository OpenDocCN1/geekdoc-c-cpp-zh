  md: 'To edit a rule, highlight an existing rule and click **Edit** to open the Edit
    Access Rule dialog shown in Figure 21-12.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_320_0.png)


    **Figure 21-12**  Edit Access Rule Dialog


    A useful feature in the Access Rules screen is the Diagram option. Clicking Diagram
    in the Access Rules screen opens a graphical representation of the highlighted
    policy, as shown in Figure 21-13.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_320_1.png)


    **Figure 21-13**  Access Rules Diagram


    # ## ASA NAT Services


    Like IOS routers, the ASA supports the following Network Address Translation (NAT)
    and Port Address Translation (PAT) deployment methods:


    | NAT method | Description |

    |---|---|

    | **Inside NAT** | Typical NAT deployment method where the ASA translates the
    internal host address to a global address.<br><br>▪ The ASA restores return traffic
    to the original inside IP address. |

    | **Outside NAT** | Deployment method used where traffic from a lower-security
    interface is destined for a higher-security interface.<br><br>▪ This method may
    be useful to allow a host on the outside to appear as one from a known internal
    IP address. |

    | **Bidirectional NAT** | Both inside NAT and outside NAT are used together. |'
  merge: -1
  img_proc: true
