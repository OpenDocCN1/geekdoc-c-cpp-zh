- pgno: 315
  md: "ACLs on a security appliance can be used for the following:\n\n| Category |\
    \ Description |\n| --- | --- |\n| Through-traffic packet filtering | • Traffic\
    \ is passing through the appliance from one interface to another interface.<br>•\
    \ The configuration requires an ACL to be defined and then applied to an interface.\
    \ |\n| To-the-box traffic packet filtering | • Traffic (for example, Telnet, or\
    \ SSH, Simple Network Management Protocol [SNMP]) is destined for the appliance.<br>•\
    \ It filters traffic destined to the ASA management plane.<br>• It is completed\
    \ in one step but requires an additional set of rules to implement access control.<br>•\
    \ Also known as a management access rule. |\n\n# ACL Syntax\n\nYou can use many\
    \ options with ACLs. However, for most needs, a more useful and condensed version\
    \ of the syntax is as follows:\n\n```\n    ciscoasa(config)# access-list id extended\
    \ {deny | permit} protocol\n    {source_addr source_mask} | any | host src_host\
    \ |\n    interface src_if_name\n    {operator port [port]}\n    {dest_addr dest_mask}\
    \ | any | host dst_host |\n    interface dst_if_name\n    {operator port [port]}\n\
    ```\n\n> > **NOTE:** The `interface` keyword is used for to-the-box filtering.\n\
    > >\n> > **NOTE:** Explanation of all ACL syntax is beyond the scope of this chapter.\n\
    \n> > **NOTE:** Use the `help access-list` command to view complete syntax information.\n\
    \n> > **NOTE:** To verify ACLs, use the `show access-list` and `show running-config\
    \ access-list` commands.\n\n> > **NOTE:** To erase a configured ACL, use the `clear\
    \ configure access-list id` command.\n\nAfter you configure an ACL to identify\
    \ traffic allowed or denied by the ASA, the next step is to apply the ACL to an\
    \ interface in either the inbound or the outbound direction."
  merge: -1
  img_proc: true
- pgno: 316
  md: "Apply the ACL as follows:\n\n```\n    ciscoasa(config-if)# access-group acl-id\n\
    \    [ in | out ] interface interface-name\n    [per-user-override | control-plane]\n\
    ```\n\nApplies the ACL to the interface.\n\n**NOTE:** The control-plane keyword\
    \ is used for to-the-box filtering.\n\n**NOTE:** To allow connectivity between\
    \ interfaces with the same security levels, the same-security-traffic permit inter-interface\
    \ global configuration command is required.\n\n**NOTE:** To enable traffic to\
    \ enter and exit the same interface, such as when encrypted traffic enters an\
    \ interface and is then routed out the same interface unencrypted, use the same-security-traffic\
    \ permit intra-interface global configuration command.\n\n# ## Configuring ACLs\
    \ Example Using the CLI\n\nPC-A and PC-B are external hosts that require access\
    \ to the two internal servers. Each server provides web and email services.\n\n\
    Figure 21-9 shows the network topology for the ACL example.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_316_0.png)\n\
    \nFigure 21-9 ACL Topology Example"
  merge: -1
  img_proc: true
- pgno: 317
  md: '|  |  |

    | --- | --- |

    | ASA-1(config)# access-list ACL-IN remark Permit PC-A -> Server A for HTTP /
    SMTP | Enter a remark. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.1 host
    209.165.202.131 eq http | Permit PC-A HTTP access to SVR-1. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.1 host
    209.165.202.131 eq smtp | Permit PC-A email access to SVR-1. |

    | ASA-1(config)# access-list ACL-IN remark Permit PC-A -> Server B for HTTP /
    SMTP | Enter a remark. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.1 host
    209.165.202.132 eq http | Permit PC-A HTTP access to SVR-2. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.1 host
    209.165.202.132 eq smtp | Permit PC-A email access to SVR-2. |

    | ASA-1(config)# access-list ACL-IN remark Permit PC-B -> Server A for HTTP /
    SMTP | Enter a remark. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.2 host
    209.165.202.131 eq http | Permit PC-B HTTP access to SVR-1. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.2 host
    209.165.202.131 eq smtp | Permit PC-B email access to SVR-1. |

    | ASA-1(config)# access-list ACL-IN remark Permit PC-B -> Server B for HTTP /
    SMTP | Enter a remark. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.2 host
    209.165.202.132 eq http | Permit PC-B HTTP access to SVR-2. |

    | ASA-1(config)# access-list ACL-IN extended permit tcp host 209.165.201.2 host
    209.165.202.132 eq smtp | Permit PC-B email access to SVR-2. |

    | ASA-1(config)# access-list ACL-IN extended deny ip any any log | Configure the
    implicit deny statement to log all failures. |

    | ASA-1(config)# access-group ACL-IN in interface outside | Apply the ACL to all
    incoming traffic on the outside interface. |'
