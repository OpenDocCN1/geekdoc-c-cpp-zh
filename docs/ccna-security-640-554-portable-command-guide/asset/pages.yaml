- pgno: 149
  md: '# Cisco Security Intelligence Operations


    Global correlation can be accomplished using the Cisco Security Intelligence Operations
    (SIO) Center, which baselines the current global state of threats such as malware
    outbreaks, current vulnerabilities, and zero-day attacks. It provides the network
    system with valuable information to detect, prevent, and react to threats by correlating
    threat information from the SensorBase. It then feeds this information to enforcement
    elements for live threat prevention.'
