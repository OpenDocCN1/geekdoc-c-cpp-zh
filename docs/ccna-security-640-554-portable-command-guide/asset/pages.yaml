    +   - Testing and Monitoring IPsec VPNs

    +   - Monitoring Established IPsec VPN Connections Using CCP


    # Site-to-Site IPsec VPNs


    Organizations of all kinds often deploy site-to-site virtual private networks
    (VPNs) when implementing a corporate network across public and private networks.
    Internet-based VPN environments and Multiprotocol Label Switching (MPLS) VPN environments
    benefit from the flexibility of deployment and standards-based implementation
    of cryptographic mechanisms.


    The choice of device terminating VPNs becomes a key factor in implementing site-to-site
    VPNs. Organizations benefit from leveraging their existing network elements and
    using an integrated approach to VPN deployments. This lesson highlights the use
    of Cisco IOS routers as site-to-site VPN termination points in IP Security (IPsec)
    environments.


    # IPsec VPN Negotiation Steps


    IPsec VPN negotiation can be broken down into five steps, including Phase 1 and
    Phase 2 of Internet Key Exchange (IKE):


    +   1. An IPsec tunnel is initiated when a host sends "interesting" traffic to
    a destination host. Traffic is considered interesting when it travels between
    the IPsec peers and meets the criteria that are defined in the crypto ACL.'
  merge: -1
  img_proc: true
- pgno: 243
  md: "+   2. The interesting traffic initiates IKE Phase 1 between the peer routers.\
    \ The IPsec peers negotiate the established IKE security association (SA) policy.\
    \ Once the peers are authenticated, a secure tunnel is created by using Internet\
    \ Security Association and Key Management Protocol (ISAKMP).\n+   \n+   3. The\
    \ peers then proceed to IKE Phase 2. The IPsec peers use the authenticated and\
    \ secure tunnel to negotiate IPsec SA transforms. The negotiation of the shared\
    \ policy determines how the IPsec tunnel is established.\n+   \n+   4. The IPsec\
    \ tunnel is created, and data is transferred between the IPsec peers based on\
    \ the IPsec parameters that are configured in the IPsec transform sets.\n+   \n\
    +   5. The IPsec tunnel terminates when the IPsec SAs are deleted or when their\
    \ lifetime expires.\n\n# Planning an IPsec VPN\n\nWhen planning to deploy a site-to-site\
    \ IPsec VPN, remember the following:\n\n|  |  |\n|---|---|\n| **Verify connectivity\
    \ between peers** | Ensure that IP protocols 50 (ESP) and 51 (AH) and UDP port\
    \ 500 (ISAKMP) traffic are permitted and not blocked by an access control list\
    \ (ACL). |\n| **Define interesting traffic.** | Define which traffic will trigger\
    \ a VPN session (interesting traffic) and which traffic will travel outside the\
    \ tunnel (non-interesting traffic). |\n| **Determine the cipher suite requirements.**\
    \ | Choose a cipher that suits the network security policy of the organization.\
    \ |\n| **Manage monitoring, troubleshooting, and change.** | Consider all three\
    \ areas in the planning process. |\n\nInteresting traffic is defined by crypto\
    \ ACLs in site-to-site IPsec VPN configurations.\nCrypto ACLs perform these functions:\n\
    \n|  |  |\n|---|---|\n| **Outbound** | Selects outbound traffic that IPsec should\
    \ protect. Traffic that is not selected is sent in plaintext. |\n| **Inbound**\
    \ | If you want, you can create inbound ACLs to filter and discard traffic that\
    \ should have been protected by IPsec. |\n\n**NOTE:** Traffic matching a permit\
    \ action in the ACL is protected and sent through the VPN. Traffic matching a\
    \ deny action in the ACL is sent outside the VPN in cleartext."
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Cipher Suite Options


    The following compares weaker options to stronger options:


    | Parameter | Weakest | Strongest |

    |---|---|---|

    | Encryption algorithm | Digital Encryption Standard (DES) | Advanced Encryption
    Standard (AES) |

    | Hash algorithm | Message digest algorithm 5 (MD5) | Secure Hash Algorithm 2
    (SHA-2) |

    | Authentication method | Pre-shared key (PSK) | Rivest, Shamir, Adelman (RSA)
    Signature |

    | Key exchange | Diffie-Hellman (DH) group 1 | DH group 5 |

    | IKE SA lifetime | 86,400 seconds | < 86,400 seconds |


    # Configuring IOS Site-to-Site VPNs


    To configure a site-to-site VPN using the IOS command-line interface (CLI), complete
    the following steps:


    +   1. Create an IKE policy and configure the required Phase 1 parameters.

    +   2. Specify the PSK and identify the peer address (or hostname).

    +   3. Create the IPsec policy required for Phase 2.

    +   4. Create the crypto map and configure crypto map specifics.

    +   5. Identify interesting traffic using an extended ACL.

    +   6. Apply the crypto map to an interface.

    +   7. Verify the tunnel.


    > **NOTE:** Some of these steps can be done out of order.


    Create an IKE policy.


    ```

    Router(config)#crypto isakmp policy priority


    Define an IKE policy to specify the parameters to be used during IKE negotiation
    to create the IKE SA.


    *priority* uniquely identifies the IKE policy and assigns a priority to the policy.
    Use an integer from 1 to 10,000, with 1 being the highest priority and 10,000
    the lowest.

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: '**NOTE:** You can configure multiple IKE policies. When the IKE negotiation
    begins, it tries to find a common policy configured on both peers, starting with
    the highest-priority policies as specified on the remote peer.


    **NOTE:** Use the `show crypto isakmp policy` command to verify the IKE settings.


    Configurable IKE parameters include the following:


    +   - Authentication (default = RSA signatures)

    +   - Encryption (default = 56-bit DES)

    +   - Hash (default = SHA-1)

    +   - DH group (default = 768-bit DH)

    +   - IKE SA lifetime (default = 86400 seconds [1 day])


    Configure IKE policy Phase 1 parameters:


    <table>

    <thead>

    <tr>

    <th>Command</th>

    <th>Description</th>

    </tr>

    </thead>

    <tbody>

    <tr>

    <td><code>Router(config-isakmp)# authentication {pre-share | rsa-encr | rsa-sig}</code></td>

    <td>Set the authentication method for the IKE policy.</td>

    </tr>

    <tr>

    <td><code>Router(config-isakmp)#encryption {des | 3des | aes | aes-bit}</code></td>

    <td>Set the encryption algorithm for the IKE policy.<br><strong>NOTE:</strong>
    Encryption options may vary depending on IOS image.</td>

    </tr>

    <tr>

    <td><code>Router(config-isakmp)#hash {md5 | sha}</code></td>

    <td>Set the hashing algorithm for the IKE policy.</td>

    </tr>

    <tr>

    <td><code>Router(config-isakmp)#group {1 | 2 | 5}</code></td>

    <td>Set the DH group to use for the IKE policy.</td>

    </tr>

    <tr>

    <td><code>Router(config-isakmp)#lifetime seconds</code></td>

    <td>Configure the maximum amount of time an IKE SA can exist before it expires.
    Time values are from 60 to 86400 seconds (1 minute to 24 hours).</td>

    </tr>

    </tbody>

    </table>


    **NOTE:** If a parameter is not configured, the default value will be used for
    that parameter.'
  merge: -1
  img_proc: true
