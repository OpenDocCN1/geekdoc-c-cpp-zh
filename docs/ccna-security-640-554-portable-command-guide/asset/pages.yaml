- pgno: 318
  md: '# Configuring ACLs with Object Groups Example Using the CLI


    | Command | Description |

    |---|---|

    | `ASA-1(config)# object-group protocol TCP` | Create a protocol object group
    called **TCP**. |

    | `ASA-1(config-protocol)# protocol-object tcp` | Match all TCP traffic. |

    | `ASA-1(config-protocol)# exit` | Return to global configuration. |

    | `ASA-1(config)# object-group network Internet-Hosts` | Create a network object
    group called **Internet-Hosts**. |

    | `ASA-1(config-network)# network-object host 209.165.201.1` | Identify a network
    host (**PC-A**). |

    | `ASA-1(config-network)# network-object host 209.165.201.2` | Identify a network
    host (**PC-B**). |

    | `ASA-1(config-network)# exit` | Return to global configuration. |

    | `ASA-1(config)# object-group network Internal-Servers` | Create a network object
    group called **Internal-Servers**. |

    | `ASA-1(config-network)# network-object host 209.165.202.133` | Identify a server
    host (**SVR-1**). |

    | `ASA-1(config-network)# network-object host 209.165.202.132` | Identify a server
    host (**SVR-2**). |

    | `ASA-1(config-network)# exit` | Return to global configuration. |

    | `ASA-1(config)# object-group service HTTP-SMTP tcp` | Create a service object
    group called **HTTP-SMTP**. |

    | `ASA-1(config-service)# port-object eq smtp` | Identify Layer 4 services (**SMTP**).
    |

    | `ASA-1(config-service)# port-object eq www` | Identify Layer 4 services (**HTTP**).
    |

    | `ASA-1(config-service)# exit` | Return to global configuration. |

    | `ASA-1(config)# access-list ACL-IN remark Only permit PC-A / PC-B -> servers`
    | Enter an ACL remark. |

    | `ASA-1(config)# access-list ACL-IN extended permit object-group TCP object-group
    Internet-Hosts object-group Internal-Servers object-group HTTP-SMTP` | Permit
    the Internet-Hosts object services identified in TCP when going to the Internal-Servers
    object for services identified in HTTP-SMTP. |

    | `ASA-1(config)# access-list ACL-IN extended deny ip any any log` | Configure
    the implicit deny statement to log all failures. |

    | `ASA-1(config)# access-group ACL-IN in interface outside` | Apply the ACL to
    all incoming traffic on the outside interface. |'
  merge: -1
  img_proc: true
