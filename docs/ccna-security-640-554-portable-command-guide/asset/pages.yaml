- pgno: 333
  md: 'Cisco MPF uses these three configuration objects to define modular, object-oriented,
    hierarchical policies, as illustrated in Figure 21-26.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_333_0.png)


    **Figure 21-26**  Modular Policy Framework


    **NOTE:** Although the MPF syntax is similar to the IOS Cisco Modular QoS CLI
    (MQC) syntax and Cisco Common Classification Policy Language (C3PL) syntax, the
    configurable parameters differ. For instance, the ASA provides more configurable
    actions and support for Layer 5–7 inspections.


    To configure MPF on an ASA, you must complete four steps:


    +   1. Optionally configure extended ACLs to identify specific granular traffic.

    +   2. Configure the class map to identify traffic.

    +   3. Configure a policy map to apply actions to those class maps.

    +   4. Configure a service policy to attach the policy map to an interface.


    # Class Maps, Policy Maps, and Service Policies


    Create a class map to identify specific Layer 3/4 traffic:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# class-map class-map-name` | Create a Layer 3 or 4 class map
    and enter class-map configuration mode. |'
  merge: -1
  img_proc: true
- pgno: 334
  md: '| | |

    |---|---|

    | `ciscoasa (config)# class-map type management class-map-name` | Create a Layer
    3 or 4 class map for the-to box traffic and enter class-map configuration mode.<br><br>**NOTE:**
    Two other variations of the com-mand include the class-map type inspect command,
    which is used to define special actions for application inspection traffic, and
    the class-map type regex command to use with regular expressions (for example,
    to match specific URLs). Both are beyond the scope of this chapter. |


    **NOTE:** The names class-default and any name that begins with _internal or _default
    are reserved.


    Define the traffic to include in the class by matching one of the following characteristics:


    | | |

    |---|---|

    | `ciscoasa (config-cmap)# match any` | Match all traffic to which you want to
    apply actions. |


    | | |

    |---|---|

    | `ciscoasa (config-cmap)# match access-list acl-id` | Match packets specified
    by an extended ACL.<br><br>**NOTE:** Other match keywords include dscp, flow,
    port, precedence, rtp, and tunnel-group. All are beyond the scope of this chapter.
    |


    **NOTE:** The description keyword could be used to document the class map.


    **NOTE:** Unless otherwise specified, include only one match command in the class
    map.


    **NOTE:** To display information about the class map configuration, use the show
    running-config class-map command


    **NOTE:** To remove all class maps, use the clear configure class-map com-mand.'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'Create a policy map to assign actions to traffic configured in Layer 3/4 class
    maps:


    | Command | Description |

    | --- | --- |

    | `ciscoasa(config)# policy-map`<br>`p-map-name` | Specify a name for this policy
    map (up to 40 characters in length).<br><br>**NOTE:** Another variation of the
    command is `policy-map type inspect p-map-name` command. The command is beyond
    the scope of this chapter. |


    Identify the class map:


    | Command | Description |

    | --- | --- |

    | `ciscoasa(config-pmap)# class`<br>`class-map-name` | Assign a class map to a
    policy map where you can assign actions to the class map traffic and enter config
    policy map class mode.<br><br>**NOTE:** The class name `class-default` is a reserved
    name. |


    **NOTE:** The `description` keyword could be used to document the policy map.


    Assign one of the following actions:


    | Command | Description |

    | --- | --- |

    | `ciscoasa(config-pmap-c)# set connection` | Configure connection parameters.
    |

    | `ciscoasa(config-pmap-c)# police {input &#124; output} rate-bps` | Rate-limit
    traffic for this class. |

    | `ciscoasa(config-pmap-c)# inspect protocol` | Configure protocol inspection
    services.<br><br>**NOTE:** There are many different protocol keywords, including
    `dns`, `ftp`, `http`, `icmp`, `ipv6`, and more. All are beyond the scope of this
    chapter. |


    **NOTE:** Other configurable policy map actions that are beyond the scope of this
    chapter include `priority`, `service-policy`, `shape`, `ips`, `flow-export`, and
    more.


    The service policy enables the policy map globally on all interfaces or on a specific
    interface:


    | Command | Description |

    | --- | --- |

    | `ciscoasa(config)# service-policy`<br>`p-map-name {global &#124; interface intf}`
    | Enable a set of policies globally or apply them on an interface. |'
  merge: -1
  img_proc: true
