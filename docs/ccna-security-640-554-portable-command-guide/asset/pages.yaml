- pgno: 310
  md: '**NOTE:** To verify, use the show running-config object command.


    **NOTE:** You cannot remove an object group or make an object group empty if it
    is used in a command.


    # Network, Protocol, ICMP, and Service Object Groups


    Use the following commands to create a network object group:


    <table><tr><td><code>ciscoasa(config)# object-group<br>network group-name</code></td><td>Create
    or edit a network object group and enter network object group configuration mode.</td></tr></table>


    Use the following commands to identify specific hosts or network object groups:


    <table><tr><td><code>ciscoasa(config-network-object-group)#<br>network-object
    host ip-addr</code></td><td>Assign an IP address to the named object.</td></tr><tr><td><code>ciscoasa(config-network-object-group)#<br>group-object
    group-name</code></td><td>Assign an object group to the named object.<br><br><strong>NOTE:</strong>
    This allows for logical grouping of the same type of objects and construction
    of hierarchical object groups for structured configuration.</td></tr></table>


    **NOTE:** Multiple hosts, networks, and objects can be added to a network object
    group.


    **NOTE:** A network object group cannot be used to implement NAT. A network object
    is required to implement NAT.


    A protocol-based object group combines IP protocols into one object.


    Use the following commands to create a protocol object group:


    <table><tr><td><code>ciscoasa(config)# object-group<br>protocol group-name</code></td><td>Create
    or edit a protocol object group and enter protocol object group configuration
    mode.</td></tr></table>'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Use one of the following commands to identify a protocol or other protocol
    object groups:


    | Command | Description |

    |---|---|

    | `ciscoasa(config-protocol-object-group)# protocol-object protocol` | Define
    the protocols in the group. **NOTE:** The `protocol` parameter is the IP protocol
    numeric identifier (1 through 254) or a keyword identifier (for example, `icmp`,
    `tcp`, `udp`, or `ip` to include all IP protocols). |

    | `ciscoasa(config-protocol-object-group)# group-object group-name` | Assign an
    object group to the named object. |


    Use the following commands to create an ICMP object group:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# object-group icmp-type group-name` | Create or edit an ICMP
    object group and enter ICMP type object group configuration mode. |


    Use one of the following commands to identify a protocol or other protocol object
    groups:


    | Command | Description |

    |---|---|

    | `ciscoasa(config-icmp-object-group)# icmp-object icmp-type` | Define the ICMP
    types in the group. Enter the command for each type. |

    | `ciscoasa(config-icmp-object-group)# group-object group-name` | Assign an object
    group to the named object. |


    A service-based object group is used to group TCP, UDP, or TCP and UDP ports into
    an object. The ASA enables the creation of a service object group that can contain
    a mix of TCP services; UDP services; ICMP-type services; and any protocol such
    as Encapsulation Security Protocol (ESP), generic routing encapsulation (GRE),
    and TCP.


    Use the following commands to create a service object group:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# object-group service group-name` | Create or edit a service
    group object and enter service object group configuration mode. |


    Use one of the following commands to identify a protocol or other protocol object
    groups:


    | Command | Description |

    |---|---|

    | `ciscoasa(config-service-object-group)# port-object eq service` | Add a port
    object to a service object group. Specify the decimal number or name of a TCP
    or UDP port for a service object. |

    | `ciscoasa(config-service-object-group)# group-object group-name` | Assign an
    object group to the named object. |'
