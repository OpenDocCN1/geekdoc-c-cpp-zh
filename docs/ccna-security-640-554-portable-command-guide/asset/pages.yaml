- pgno: 254
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_254_0.png)


    Figure 17-5  IKE Proposals Window


    This window lists the default IKE policy and all other IKE policies configured.
    The local router uses the IKE policies that are listed in this window to negotiate
    authentication with the remote router.


    > **NOTE:** The peer devices must both use the same policy.


    From this window, you can add or edit an IKE policy.


    > **NOTE:** The CCP default policy is read-only and cannot be edited.


    To add an IKE policy that is not included in this list, click Add.


    > **NOTE:** Adding a new policy creates a new line with a higher priority number
    in the IKE policy list.


    The Add IKE Policy dialog opens, as shown in Figure 17-6.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_255_0.png)


    **Figure 17-6** Add IKE Policy Dialog


    The Add IKE Policy dialog appears as shown on the left of Figure 17-6. The priority
    can be altered and the cipher suite can be defined. You can also define the key
    lifetime.


    After the new IKE policy has been configured, as shown in the right of Figure
    17-6, click OK, and the revised IKE Proposals window now displays the new policy,
    as shown in Figure 17-7.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_255_1.png)


    **Figure 17-7** Revised IKE Proposals Window


    Click Next to continue.


    The Transform Set window opens, as shown in Figure 17-8.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_256_0.png)


    **Figure 17-8 Transform Set Window**


    The next step is to define the transform sets, which identify the cipher suite
    for IPsec Phase 2. A transform describes a particular security protocol with its
    corresponding algorithm that the peers agree to use for protecting a particular
    data flow.


    CCP displays the default transform set and any additional transform sets that
    have been configured on this router.


    **NOTE:** The CCP default policy is read-only and cannot be edited.


    **NOTE:** Not all routers support all transform sets (encryption types). Unsupported
    transform sets will not appear in the screen.


    **NOTE:** Not all IOS images support all the transform sets that CCP supports.
    Transform sets unsupported by the IOS image will not appear in the screen.


    A list of all configured transform sets is available in the Select Transform Set
    drop-down menu. Choosing one enables you to view the settings and add entries
    to the transform set. Clicking Add creates the transform set in the Add Transform
    Set window. You can also edit nondefault transform sets.


    To add an IPsec transform set that is not included in this list, click Add.


    The Add Transform Set dialog opens, as shown in Figure 17-9.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_257_0.png)


    **Figure 17-9**  Add Transform Set Dialog


    **NOTE:** The types of ESP encryption available depend on the router. Depending
    on the type of router you are configuring, one or more of these encryption types
    might not be available.


    The Add Transform Set dialog appears as shown on the left of Figure 17-9. You
    must name the transform set (no spaces) and select ESP encryption and integrity
    algorithms.


    **NOTE:** Clicking the **Show Advanced >>** button enables you to select AH, transport,
    or tunnel mode (tunnel is the default) and compression.


    After the new transform set has been configured, as shown on the right of Figure
    17-9, click **OK**, and the revised Transform Set window now displays the new
    policy, as shown in Figure 17-10.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_257_1.png)


    **Figure 17-10**  Revised Transform Set Window'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Click Next to continue.


    The Traffic to Protect window opens.


    From this window, you define interesting traffic that this VPN protects.


    The VPN can protect traffic between


    +   - Specified subnets

    +   - Traffic that is specified in an IPsec rule


    > **NOTE:** An IPsec rule provides more granularity because you can specify multiple
    subnets and hosts.


    Figure 17-11 shows a revised Traffic to Protect window.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_258_0.png)


    **Figure 17-11**  Revised Traffic to Protect Window


    Click Next to continue.


    The summary of the configuration displays, enabling you to review and accept the
    configuration.


    You can review the configuration in this window and use the Back button to make
    changes if you want, or you can click Finish to complete the wizard.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '**NOTE:** A testing option is available by checking the **Test VPN Connection
    After Configuring** check box. The results of the test are shown in another window.


    Use the **Back** button to edit a selected choice. Otherwise, click on **Finish**.


    CCP then displays the CLI configuration commands. Click **Deliver** to commit
    the configuration changes.


    Once the commands are delivered, you return to the VPN screen with the Edit Site
    to Site VPN tab selected, as shown in Figure 17-12.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_259_0.png)


    Figure 17-12 Revised VPN Screen


    You can verify the VPN configuration with the Edit Site Site VPN option. Use this
    window to manage the VPN connections to remote systems.


    The Status column shows the status of the connection, which is indicated by the
    intuitive icons.


    You can also create, edit, and delete VPN connections and reset existing connections.


    The Generate Mirror and Test Tunnel buttons are also available in this window.
    Site-to-site VPNs require both sides to be configured with matching policies.
    Usually, the same process that is configured by the wizard has to be replicated
    on the other peer.


    **NOTE:** Click Test Tunnel after each peer has been configured.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Generating a Mirror Configuration Using CCP


    To generate a mirror configuration that you can use as a template for the other
    peer, click the **Generate Mirror** button. The resulting configuration provides
    identical IPSec policy names, IKE policies, and transform sets.


    To generate a template configuration for the peer VPN router, choose **Configure
    > Security > VPN > Site-to-Site VPN > Edit Site-to-Site VPN**.


    Select the VPN connection that you want to use as a template, and click **Generate
    Mirror**.


    CCP displays the Generate Mirror dialog shown in Figure 17-13.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_260_0.png)


    **Figure 17-13**  Generate Mirror Dialog


    **CAUTION:** Do not apply the mirror configuration to the peer device without
    editing! This configuration is a template that requires additional manual configuration.
    Use it only as a starting point to build the configuration for the VPN peer.


    The suggested configuration for the identified peer device appears on the Generate
    Mirror dialog.


    Click Save to display the Windows Save File dialog, and save the file as a text
    file.


    Open the resulting text file using a text editor such as Notepad and make any
    needed changes to the template configuration. Figure 17-14 highlights sections
    of a sample configuration that should be verified or altered.'
  merge: -1
  img_proc: true
- pgno: 261
  md: "![](img/0d9540c65a85f4cb1c32cee46038d8ab_261_0.png)\n\nThe mirror configuration\
    \ should only be used as a guide when configuring the peer. The following configuration\
    \ MUST NOT be directly applied to the peer device.\n\n```\n```text\ncrypto isakmp\
    \ policy 2\n authentication pre-share\n encr aes 128\n hash sha\n group 5\n lifetime\
    \ 86400\n exit\ncrypto isakmp policy 1\n authentication pre-share\n encr 3des\n\
    \ hash sha\n group 2\n lifetime 86400\n exit\ncrypto isakmp key cisco123 address\
    \ 209.165.200.225\ncrypto ipsec transform-set R1-R3-Transform-Set\n esp-sha-hmac\
    \ esp-aes 128\n mode tunnel\n exit\nip access-list extended SDM_1\n remark CCF-ACL\
    \ Category=4\n remark IPSEC Rule\n permit ip 192.168.0.0 0.0.0.255 192.168.1.0\
    \ 0.0.0.255\n exit\ncrypto map SDM_MAP 1 ipsec-isakmp\n description Apply the\
    \ crypto map on the peer router's interface\n  having IP address 209.165.200.129\
    \ that connects to this router.\n set transform-set R1-R3-Transform-Set\n set\
    \ peer 209.165.200.225\n match address SDM_1\n exit\n```\n```\n\n**Figure 17-14**\
    \  Generated Text File in Notepad\n\n> **NOTE:** The mirror configuration does\
    \ not apply the crypto map to the peer interface. Therefore, the `crypto map <crypto-map-name>`\
    \ command must be configured on the peer VPN interface.\n\nFinally, copy and paste\
    \ the edited configuration to the remote peer global configuration. The VPN tunnel\
    \ should now be tested.\n\n# Testing and Monitoring IPsec VPNs\n\nNavigate to\
    \ Configure > Security > VPN > Site-to-Site VPN > Edit Site-to-Site VPN to open\
    \ the VPN screen shown in Figure 17-14.\n\nClick the Test Tunnel button, and then\
    \ click Start. CCP generates interesting traffic and enables the VPN tunnel. CCP\
    \ displays status messages indicating the results of the test, as shown in Figure\
    \ 17-15."
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_262_0.png)


    Figure 17-15  VPN Troubleshooting Window


    **TIP:** Click Details to see detailed results.


    When prompted to enable debugging, click Yes.


    This opens another VPN Troubleshooting window, as shown in Figure 17-16.'
  merge: -1
