  md: '```

    switch(config)#storm-control

    {[broadcast | multicast | unicast]

    [level {level | level-low} | bps bps

    [bps-low] | pps pps [pps-low]] |

    [action {shutdown | trap}]}

    ```


    Enable storm control on Layer 2 ports and EtherChannels to monitor the rate of
    received traffic. Broadcast, multicast, and unicast traffic can be monitored.


    `level {level | level-low}` specifies the rising and falling suppression levels
    as a percentage (to two decimal places) of total bandwidth of the port.


    `level bps {bps [bps-low]}` specifies the rising and falling levels in bits per
    seconds.


    `level pps {pps [pps-low]}` specifies the rising and falling levels in packets
    per second.


    The action taken can be


    +   - **shutdown:** Disables the port during the storm

    +   - **trap:** Sends an SNMP trap during a storm


    **NOTE:** By default, unicast, broadcast, and multicast storm control are disabled
    on the switch interfaces; that is, the suppression level is 100 percent.


    # Configuring Storm Control Example


    This example shows how to enable broadcast address storm control on a port to
    a level of 25 percent. When the broadcast traffic exceeds 25 percent of the total
    available bandwidth, the switch drops all broadcast traffic until the end of the
    traffic storm control interval:


    ```

    S1(config-if)#storm-control

    broadcast level 25

    ```


    Enable storm control on Layer 2 interfaces to monitor the rate of received traffic.


