- pgno: 143
  md: '# ## IPv6 Vulnerabilities


    New vulnerabilities for IPv6 include the following:


    | Vulnerability | Details |

    |---|---|

    | **Reliance on multicast and ICMPv6** | • Multicasting facilitates reconnaissance.
    (For example, FF02::1 is all hosts, FF02::2 is all routers.)<br>• ICMPv6 is a
    vehicle for autoconfiguration, subject to spoofing and multiple exploits. |

    | **Header extensions** | • Hosts process routing headers (RHs), which can be
    exploited (for example, routing header for source routing and reconnaissance).<br>•
    There already exist RH-based amplification attacks. |

    | **Tunneling** | • Encapsulating IPv6 over IPv4 bypasses firewalls and other
    inspection systems not ready for IPv6.<br>• Most IPv4/IPv6 transition mechanisms
    have no authentication built in.<br>• Dual stack is typically automatically enabled
    on hosts. |

    | **DoS amplification attacks** | • Routing loops are created to consume resources
    or amplify the packets that are sent to a victim such as when an attacker creates
    a feedback loop between two routers by spoofing a packet with the RH containing
    multiple A to B statements.<br>• NDP can be used to amplify a network scan by
    sending NS messages to all the hosts in the LAN segment, using the FF02 multicast
    address. |

    | **Pivoting attacks** | • Connects multiple previously mentioned techniques.
    |


    # ## IPv6 Security Strategy


    IPv6 is mostly IPv4 with larger addresses, and no significant difference exists
    between IPv4 and IPv6 with respect to security. In some cases, IPv6 is slightly
    more secure, and in other cases IPv6 is slightly less secure. Security techniques
    and devices do exist to enforce a security policy for the IPv6 traffic and should
    be used.


    The lack of IPv6 training for network and security staff is probably the biggest
    threat for operation.


    # ### Configuring Ingress Filtering


    | Filter | Description |

    |---|---|

    | **Deny bogon addresses** | Filter bogon addresses because they are commonly
    found as the source addresses of distributed DoS (DDoS) attacks. The term *bogon
    addresses* refers to traffic with a source IP address from a reserved IP address
    space, and it should be filtered by an Internet service provider. |

    | **MAC address table attack** | Filter multicast packets at your perimeter based
    on their scope. |'
  merge: -1
  img_proc: true
- pgno: 144
  md: '| Security measure | Description |

    |---|---|

    | **Filter incoming traffic** | Only receive packets that have a destination address
    within your allocated block from an Internet service provider and multicast group
    address or link-local address for NDP. |

    | **Filter ICMPv6 messages** | Granularly filter ICMPv6 messages at the perimeter.
    (Remember, ICMPv6 is needed for protocol operations such as NDP.) |

    | **Drop packets with unknown extension headers** | Drop RH0 packets and unknown
    extension headers at the perimeter and throughout the interior of the network.
    |


    # Secure Transition Mechanisms


    | Security measure | Description |

    |---|---|

    | **Secure dual stack** | Prefer dual stack as the transition mechanism, but secure
    IPv4 and IPv6 equally. |

    | **Implement IPsec VPN tunnels** | When tunnels are used to send sensitive traffic
    over a public network, they should be secured by adding IPsec authentication and
    confidentiality that can prevent both the injection/sniffing attacks and unauthorized
    access. |

    | **Do not allow tunnels through perimeter unless required** | Terminate tunnels
    at the edge and do not permit host-to-host tunnels. |


    # Future Security Enhancements


    Consider current and future security enhancements:


    | Security enhancement | Description |

    |---|---|

    | **Secure Neighbor Discovery (SeND)** | Combines NDP with crypto features. The
    SeND protocol enhances NDP with address ownership proof, message protection, and
    router authorization. |

    | **RA-Guard** | RA-Guard blocks router advertisement and router redirect ICMP
    packets from Layer 2 ports. |


    > **NOTE:** IPv6 security will now be included in other chapters.'
