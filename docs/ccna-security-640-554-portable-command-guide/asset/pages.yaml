- pgno: 276
  md: '# # CHAPTER 19

    ## Introduction to ASDM


    This chapter covers the following topics:


    # ### Adaptive Security Device Manager


    +   - Accessing ASDM

    +   - Factory Default Settings

    +   - Resetting the ASA 5505 to Factory Default Settings

    +   - Erasing the Factory Default Settings

    +   - Setup Initialization Wizard


    # ### Installing and Running ASDM


    +   - Running ASDM


    # ### ASDM Wizards


    +   - The Startup Wizard

    +   - VPN Wizards

    +   - Advanced Wizards


    # ## Adaptive Security Device Manager


    Cisco Adaptive Security Device Manager (ASDM) is a Java-based GUI tool that facilitates
    the setup, configuration, monitoring, and troubleshooting of Cisco Adaptive Security
    Appliances (ASA).


    **NOTE:** ASDM is now preloaded in flash memory on any ASA Versions 7.0 and later.


    ASDM can be


    +   - Run from a browser as a Java Web Start application that is dynamically down-loaded
    from the ASA flash, allowing an administrator to configure and monitor that ASA
    device

    +   - Downloaded from flash and installed locally on a host as an application,
    allowing an administrator to use ASDM to configure and manage multiple ASA devices'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# ## Accessing ASDM


    ASDM access requires connecting to a management interface that has some minimal
    configurations to communicate over the network.


    The management interface depends on the model of the ASA:


    +   - On an ASA 5505, the management switch port can be any port, except for Ethernet
    0/0.

    +   - On an ASA 5510 and later, the management interface is Management 0/0. However,
    another Fast Ethernet interface can also be used.


    The minimal configuration can be provided on an ASA 5505 using any of the following
    methods:


    | Method | Configuration |

    |---|---|

    | **Restore factory default settings** | - The ASA can be reset to provide a basic
    configuration that is sufficient for a small office/home office (SOHO) deployment.<br>-
    The configuration includes two preconfigured VLAN networks, Dynamic Host Configuration
    Protocol (DHCP), and Network Address Translation (NAT) services. |

    | **Setup Initialization Wizard** | - The ASA interactively guides an administrator
    to configure the basic security settings to access ASDM.<br>- Additional HTTP
    settings must be configured to access the ASDM. |

    | **CLI configuration** | - Configure all parameters using the command-line interface
    (CLI). |


    **NOTE:** The next chapter covers the CLI configuration method.


    # ## Factory Default Settings


    The ASA 5505 with a Base license ships with the following default factory settings:


    +   - A default hostname of ciscoasa.

    +   - Console or enable passwords, which are blank.

    +   - An inside VLAN 1 interface that includes the Ethernet 0/1 through 0/7 switch
    ports. The VLAN 1 IP address and mask are 192.168.1.1 and 255.255.255.0.

    +   - An outside VLAN 2 interface that includes the Ethernet 0/0 switch port.
    VLAN 2 derives its IP address from the ISP using DHCP.

    +   - The default route that is derived from DHCP.

    +   - All inside IP addresses to be translated when accessing the outside using
    interface Port Address Translation (PAT).

    +   - The HTTP server to support ASDM access.

    +   - An internal DHCP server to provide addresses between 192.168.1.5 and 192.168.1.36
    for hosts that connect to a VLAN 1 interface.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '**NOTE:** You can change these settings manually using the CLI or interactively
    using either the CLI Setup Initialization Wizard or using the ASDM Startup Wizard.


    **NOTE:** The Reset button on the ASA 5505 is disabled and inoperable by default.


    # Resetting the ASA 5505 to Factory Default Settings


    You can restore the ASA to its factory default configuration by using the following:


    | Command | Description |

    |---|---|

    | `ciscoasa#config t` | Enter global configuration mode. |

    | `ciscoasa(config)#config`<br>`factory-default` | Reset the ASA to its factory
    default settings.<br><br>**NOTE:** A warning appears stating that the boot system
    configuration (startup configuration) will be cleared.<br><br>**NOTE:** The ASA
    loads a default configuration into the running configuration. |

    | `ciscoasa(config)#reload`<br>`save-config noconfirm` | Save the configuration
    and then reload the ASA without asking for confirmation. |


    # Erasing the Factory Default Settings


    | Command | Description |

    |---|---|

    | `ciscoasa#write erase` | Erase the startup-configuration file. |

    | `ciscoasa(config)#reload`<br>`noconfirm` | Reload the ASA without confirmation.
    |


    # Setup Initialization Wizard


    When the default factory settings are erased and an ASA is reloaded, the ASA Setup
    Initialization Wizard prompts will eventually appear asking **Pre-configure firewall
    now through interactive prompts [yes]?**


    Answering no cancels the Setup Initialization Wizard, and the ASA displays its
    default prompt. In this case, you must manually configure the ASA via the CLI.


    Pressing **Enter** accepts the default (**yes**), and the ASA will interactively
    guide an administrator to configure basic ASA features, including the following:


    +   - Firewall mode

    +   - Enable password

    +   - Enable password recovery

    +   - Time and date settings

    +   - Inside IP address and mask

    +   - ASA device name

    +   - Domain name'
  merge: -1
  img_proc: true
- pgno: 279
  md: '**NOTE:** The security appliance displays the default values in brackets (`[
    ]`) before prompting the user to accept or change them. To accept the default
    input, press **Enter**.


    When the interactive portion of the Setup Initialization Wizard completes, the
    security appliance displays the summary of the new configuration and prompts the
    user to save or reject the settings:


    +   - Answering **yes** saves the configuration and displays the configured hostname
    prompt.

    +   - Answering **no** restarts the Setup Initialization Wizard. Any changes previously
    made become the new default settings, enabling an administrator to correct a misconfigured
    setting.


    The Setup Initialization Wizard provides most of the settings for ASDM. However,
    the HTTP service must be enabled.


    To allow access to ASDM, enable HTTPS connections from any host on the inside
    network:


    | Command | Description |

    |---|---|

    | `ciscoasa# http server enable` | Enable HTTP services. |

    | `ciscoasa(config)# ip http ip-address network-mask interface-name` | Identify
    a host or hosts that can access the ASA HTTP server using ASDM. |


    **NOTE:** To remove and disable the ASA HTTP server service, use the global configuration
    command `clear configure http`.


    # Installing and Running ASDM


    The ASDM interface can be accessed from any workstation with an IP address included
    in the HTTP trusted network list.


    **TIP:** Before attempting to establish a secure ASDM connection to the ASA, verify
    that IP connectivity exists between the workstation and the Cisco ASA.


    With a factory default configuration


    +   - A host on the 192.168.1.0/24 network can connect to the ASA default management
    IP address of 192.168.1.1 using ASDM.

    +   - The host must establish a connection through a browser to the inside interface
    IP address using the HTTPS protocol.


    A security certificate window may appear. Depending on the browser settings, select
    **Yes** or click on **Continue to This Website** to continue to the ASDM launcher
    window.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'The ASDM launcher appears, as shown in Figure 19-1.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_280_0.png)


    **Figure 19-1**  Cisco ASDM Launcher Screen


    The ASDM launcher window provides three choices:


    | Option | Description |

    |---|---|

    | **Install ASDM Launcher and Run ASDM** | • Install ASDM as an application on
    the Windows host.<br>• The advantage is that the application can be used to manage
    several ASDM devices.<br>• An Internet browser will no longer be required to start
    ASDM. |

    | **Run ASDM** | • Run ASDM as a Java Web Start application.<br>• The advantage
    is that the ASDM is not locally installed.<br>• An Internet browser is required
    to establish a connection. |

    | **Run Startup Wizard** | • Run the ASDM Startup Wizard.<br>• Similar to the
    Setup Initialization Wizard, it provides step-by-step windows to help initially
    configure the ASA. |


    **NOTE:** The recommended choice is to install ASDM locally on the host. For security
    reasons, you might want to simply run ASDM.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Running ASDM


    Selecting the Run ASDM option opens an ASDM authentication window.


    If you are starting ASDM for the first time after running a Startup Wizard, leave
    the fields empty. If Secure Shell (SSH) has been configured, a local database
    username and password should be used.


    When authentication is successful, the ASDM Home page appears, as shown in Figure
    19-2.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_281_0.png)


    **Figure 19-2 — ASDM Home Page**


    The Cisco ASDM Home page is updated every 10 seconds and provides a quick view
    of the operational status of the ASA. The ASDM GUI includes the following elements:


    | Element | Description |

    |---|---|

    | **Menu bar** | Provides quick access to files, tools, wizards, and help. |

    | **Toolbar** | Provides easy navigation of Cisco ASDM. |

    |  | From the toolbar, an administrator can access the Home, Configuration, and
    Monitoring views and can save, refresh, navigate between views, and access Help.
    |

    | **Device List button** | Opens a dockable page that lists other ASA devices.
    |

    |  | Use this page to switch to another device running the same version of ASDM.
    |

    |  | When managing only one ASA device, the Device List page is hidden and must
    be opened using the Device List button. |'
  merge: -1
  img_proc: true
- pgno: 282
  md: '| Label | Description |

    |---|---|

    | Status bar | Displays the time, connection status, user, memory status, running
    configuration status, privilege level, and SSL status at the bottom of the application
    window. |


    The Home page also displays two to four tabs:


    | Tab | Description |

    |---|---|

    | Device Dashboard | (Default) Provides a view of important information about
    the ASA, such as the status of interfaces, the OS version, licensing information,
    and performance-related information. |

    | Firewall Dashboard | (Default) Provides security-related information about traffic
    that passes through the ASA, such as connection statistics, dropped packets, and
    scan and syn attack detection. |

    | Intrusion Prevention | Appears only if an Intrusion Prevention System (IPS)
    module or card is installed.<br><br>The additional tab displays status information
    about the IPS software. |

    | Content Security | Appears only if a Content Security and Control Services Module
    (CSC-SSM) is installed in the ASA.<br><br>The Content Security tab displays status
    information about the CSC-SSM software. |


    The Configuration and Monitoring views also feature a dockable navigation pane
    that you can maximize, restore, or make float so that it can be moved, hidden,
    or closed. The navigation pane of the Configuration view displays the following
    tabs:


    +   - Device Setup

    +   - Firewall

    +   - Remote-Access VPN

    +   - Site-to-Site VPN

    +   - Device Management


    The navigation pane of the Monitoring view displays the following tabs:


    +   - Interfaces

    +   - VPN

    +   - Routing

    +   - Properties

    +   - Logging


    **NOTE:** The options listed in the navigation pane will vary depending on the
    view and tab that is selected.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# ASDM Wizards


    Cisco ASDM offers several wizards to help simplify the configuration of the appliance:


    +   - Startup Wizard

    +   - Virtual private network (VPN) wizards

    +   - Advanced wizards


    # The Startup Wizard


    The Startup Wizard guides the administrator through the initial configuration
    of the ASA and helps to define basic settings.


    Choose either **Wizards > Startup Wizard** or **Configuration > Device Setup >
    Startup Wizard** to open the configuration startup wizard screen (see Figure 19-3).


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_283_0.png)


    **Figure 19-3**  Configuration Startup Wizard Screen


    After the Startup Wizard page appears, click the **Launch Startup Wizard** button.


    > **NOTE:** The actual number of steps in the wizard may vary depending on the
    specific ASA model and modules installed. However, most ASA models can be configured
    in a nine-step process.


    After the Startup Wizard has been launched, follow these steps:


    +   1. The Starting Point window (also referred to as the Welcome window) is displayed
    and provides a choice to Modify an Existing Configuration or to Reset the Configuration
    to Factory Defaults.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   2. In the Basic Configuration window, complete the basic ASA management
    configuration consisting of a hostname, domain name, and privileged EXEC password.
    Optionally, this step also allows the administrator to deploy the ASA for a remote
    worker.

    +   3. In the Interface Selection window, create the VLAN switch interfaces. This
    and other VLAN-related steps are specific to the ASA 5505 model. The Startup Wizard
    for the ASA 5510 and later models provides steps to configure the Fast Ethernet
    routed interfaces as needed without the need for VLANs.

    +   4. In the Switch Port Allocation window, map the physical Layer 2 switch ports
    to the logically named VLANs in the previous step. By default, all switch ports
    are assigned to VLAN 1 (inside).

    +   5. In the Interface IP Address Configuration window, identify the inside and
    outside IP addresses for the defined VLANs. Note that these addresses could also
    be created using DHCP or PPPoE.

    +   6. The DHCP window allows the administrator to enable the DHCP service for
    inside hosts. All DHCP-related options are defined in this window.

    +   7. The Address Translation (NAT/PAT) window allows the administrator to enable
    PAT or NAT.

    +   8. In the Administrative Access window, specify which host or hosts are allowed
    to access the ASA using HTTPS/ASDM, SSH, or Telnet.

    +   9. The final window is the Startup Wizard Summary. Review the proposed configuration.
    You can make changes by clicking the Back button or save by clicking the Finish
    button.


    # VPN Wizards


    The various VPN wizards enable an administrator to configure basic site-to-site
    and remote-access VPN connections and assign either pre-shared keys or digital
    certificates for authentication.


    To launch a VPN wizard from the menu bar, click **Wizards** and choose **VPN Wizards**,
    as shown in Figure 19-4.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_284_0.png)


    **Figure 19-4** Available VPN Wizards


    To complement the wizards, ASDM also provides the ASDM Assistant. To view the
    remote-access ASDM Assistant, choose **Configurations > Remote Access VPN > Introduction**,
    as shown in Figure 19-5.'
  merge: -1
  img_proc: true
