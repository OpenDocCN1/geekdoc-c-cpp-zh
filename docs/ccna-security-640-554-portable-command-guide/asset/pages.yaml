- pgno: 105
  md: '# Server-Based AAA Authentication


    Maintaining a local authentication database for each Cisco device in a large network
    is not feasible. Large networks require a AAA server-based solution. Routers communicate
    with AAA servers, which can be installed on a Windows server or on dedicated appliances
    such as the Cisco 1121 Secure Access Control System (ACS) or the Cisco Identity
    Services Engine (ISE).


    When users connect to a router, they are prompted for a username and password.
    The router passes the credentials to the Cisco Secure ACS (server or engine).
    The Cisco Secure ACS authenticates the user.


    # TACACS+ Versus RADIUS


    Routers communicate with AAA servers using either TACACS+ or RADIUS protocols
    to implement AAA functions:


    |  | TACACS+ | RADIUS |

    |---|---|---|

    | **Standard** | Cisco proprietary | RFCs 2865, 2866, 2867, and 2868 |

    | **Transport protocol** | TCP port 49 | UDP ports 1645 or 1812 for authentication
    and UDP ports 1646 or 1813 for accounting |

    | **Confidentiality** | Encrypts the entire body of the packet, but leaves a standard
    TCP header | Encrypts only the password in the Access-Request packet from the
    client to the server |

    | **Functionality** | Uses the AAA architecture separating authentication, authorization,
    and accounting | Combines authentication and authorization |

    | **Customization** | Provides authorization of router commands on a per-user/group
    basis | Can pass a privilege level down to the router, which can then be used
    locally for command authorization |

    | **Accounting** | Captures limited information | Captures more detailed information
    |

    | **Deployment** | Common in Cisco deployments and where multiprotocol support
    is required | Popular in VoIP installations and to support 802.1x |


    **NOTE:** Depending on the solution chosen, the configuration commands differ
    slightly.


    **NOTE:** RADIUS will eventually be replaced by DIAMETER.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The following are the general steps to configure a Cisco router to support
    server-based authentication:


    +   1. Configure the AAA servers and groups.

    +   2. Enable AAA globally on the router.

    +   3. Configure authentication policies using the `aaa authentication` command
    and specified method lists.

    +   4. (Optional) Configure authorization policies using the `aaa authorization`
    command and specified method lists.

    +   5. (Optional) Configure accounting policies using the `aaa accounting` command
    and specified method lists.

    +   6. Confirm and troubleshoot the AAA configuration.


    # Configuring Server-Based AAA Authentication


    The first step of configuring server-based authentication is to configure AAA
    server objects:


    | Command | Description |

    |---|---|

    | `R1(config)#tacacs-server host`<br>`{host-name \| host-ip-address}`<br>`[key
    string] [port [integer]]`<br>`[single-connection] [timeout [seconds]]` | Specify
    a TACACS+ host. Key, port number, single-connection, and time-out are all optional.<br><br>**NOTE:**
    The encryption key can be configured separately using the `tacacs-server key`
    command.<br><br>**TIP:** When connecting to Cisco Secure ACS, use the single-connection
    keyword. It is more efficient because it allows the server to handle a higher
    number of TACACS operations. The time-out specifies the amount of time that the
    router waits for the server to reply before retransmitting. Default is 5 seconds.
    |

    | `R1(config)#radius-server host`<br>`{host-name \| host-ip-address}`<br>`[auth-port
    port-number] [acct-port port-number] [key password]` | Specify a RADIUS host.
    Port numbers and key are optional.<br><br>**NOTE:** If auth-port and acct-port
    are not specified, the default value of auth-port is 1645 and the default value
    of acct-port is 1646.<br><br>**NOTE:** You can configure the encryption key separately
    using the `radius-server key` command. |'
  merge: -1
  img_proc: true
- pgno: 107
  md: "Optionally, servers can be grouped together. This feature enables you to select\
    \ a subset of the configured server hosts and use them for a particular service:\n\
    \n| Command | Description |\n|---|---|\n| `Router(config)#aaa group server radius\
    \ group-name` | Group existing RADIUS server hosts and use them for a particular\
    \ service. |\n| `Router(config-sg-radius)#server ip-address {auth-port port-number}\
    \ {acct-port port-number}` | Configure the IP address of the RADIUS server for\
    \ the group server. |\n| `Router(config)#aaa group server tacacs+ group-name`\
    \ | Group existing TACACS+ server hosts and use them for a particular service.\
    \ |\n| `Router(config-sg-tacacs+)#server server-ip` | Configure the IP address\
    \ of the TACACS+ server for the group server. **NOTE:** You can use this command\
    \ repeatedly to add multiple servers to a group. |\n\nFinally, configure the login\
    \ authentication method list to use the identified servers:\n\n| Command | Description\
    \ |\n|---|---|\n| `Router(config)#aaa authentication login [default \\| list-name]\
    \ {method1 method2 ...}` | Defines the default login authentication method to\
    \ use when accessing lines. Server-based methods choices include the following:\n\
    \n- `group radius`\n- `group tacacs+`\n- `group group-name`\n\n**NOTE:** It is\
    \ recommended to add the local router database as a fallback method, in case communication\
    \ to the AAA server fails. |\n\n# Configuring Server-Based AAA Authentication\
    \ Example\n\nThe first step of configuring AAA servers is to configure AAA server\
    \ objects:\n\n| Command | Description |\n|---|---|\n| `R1(config)#username ADMIN`\
    \  \n  `privilege 15 secret cisco123` | Create an entry in the local database.\
    \ |\n| `R1(config)#aaa new-model` | Enable AAA. |\n| `R1(config)#radius-server\
    \ host 192.168.1.101 auth-port 1812 acct-port 1813 key cisco123` | Specify a RADIUS\
    \ server and use UDP port numbers 1812 and 1813 and key cisco123. |"
