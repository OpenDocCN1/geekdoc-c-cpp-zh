- pgno: 68
  md: '# Toolbar Configure Options


    Click Configure on the toolbar to display the following options:


    | Option | Description |

    |---|---|

    | **Interface Management** | Includes the Cisco CCP Connection Wizard that guides
    you through LAN and WAN configurations |

    | **Router** | Contains features such as date/time, router access, DHCP, DNS,
    static routing, RIP, OSPF, EIGRP routing, AAA, ACL, Object Groups, router properties,
    NAT, QoS, and router provisioning |

    | **Security** | Contains security-related features, including security audit
    and One-Step Router Lockdown features, VPN services, firewall services, intrusion
    prevention system (IPS), and security management |


    # Toolbar Monitor Options


    Click Monitor on the toolbar to display the following options:


    | Option | Description |

    |---|---|

    | **Router** | Displays various monitoring options, including interface status,
    logging, QoS status, and performance routing status. |

    | **Security** | Displays various monitoring options, including firewall, VPN,
    IPS, NAC, and 802.1x status. |

    | **Traffic Monitoring** | Monitoring options include link usage, link throughput,
    and traffic volume. |


    # Using CCP to Configure IOS Device-Hardening Features


    # CCP Security Audit


    Use the Security Audit Wizard to test a router configuration to determine whether
    any potential security problems exist in the configuration. The wizard also displays
    a screen that lets you determine which of those security problems you want to
    fix. Once determined, the Security Audit Wizard makes the necessary changes to
    the router configuration to fix those problems.


    To perform the security audit, follow these steps:


    +   1. On the toolbar, navigate to **Configure > Security > Security Audit** (see
    Figure 5-6).'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_69_0.png)


    Figure 5-6  Security Audit Screen


    +   2. Click **Perform Security Audit**. The Welcome page of the Security Audit
    Wizard opens.

    +   3. Click **Next**. The Security Audit Interface Configuration page appears.

    +   4. Select the **inside (trusted)** and **outside (untrusted)** interfaces
    and click **Next**.

    +   5. The Security Audit Wizard tests the router configuration against Cisco
    recommended best practices to determine whether possible security problems exist.
    A report screen appears and lists the test results. If you want to save this report
    to a file, click **Save Report**. Otherwise, click **Close**.

    +   6. The Security Audit Wizard now lists each security problem identified and
    provides the option to fix. As well, each problem is hyperlink to an explanation.
    Select which problems to fix and click **Next**.

    +   7. The Summary screen now displays which services will be altered. Click **Finish**.

    +   8. Finally, the Deliver Configuration to Device window lists the commands
    that will be sent to the router. Click **Deliver** to apply the changes.


    # ## CCP One-Step Lockdown


    The One-Step Lockdown option tests your router configuration against Cisco-recommended
    best practices to determine whether possible security problems exist, and it automatically
    makes necessary configuration changes to correct problems it finds. Changes are
    made automatically and without prompting the user to select components to fix.'
  merge: -1
