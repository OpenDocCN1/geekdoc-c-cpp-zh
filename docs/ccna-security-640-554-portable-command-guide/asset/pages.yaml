- pgno: 222
  md: '**NOTE:** Notice the comparatively short symmetric key lengths. However, do
    not directly compare the key length of asymmetric and symmetric algorithms; the
    underlying design of the two algorithm families differs greatly.


    **NOTE:** An 80-bit symmetric key is considered equal to a 1024-bit key using
    the RSA algorithm. A 112-bit symmetric key is considered equal to a 2048-bit key
    using the RSA algorithm. A 128-bit symmetric key is considered equal to a 3072-bit
    key using the RSA algorithm.


    # Cryptographic Hashes


    Cryptographic hashes are based on one-way functions that are used for integrity
    assurance. They hash arbitrary data into a fixed-length digest known as a fingerprint.


    **NOTE:** Hashing alone does not add security to the message. It only prevents
    the message from being changed accidentally, such as by a communication error.


    # Well-Known Hashing Algorithms


    | Algorithm | Description |

    |---|---|

    | **Message digest algorithm 5 (MD5)** | Popular, ubiquitous hashing algorithm<br>Collision-resistant
    one-way function, which means that two messages with the same hash are very unlikely
    to occur<br>128-bit message digest |

    | **Secure Hash Algorithm 1 (SHA-1)** | Although slower than MD5, it is the stronger
    algorithm.<br>160-bit message digest |

    | **Secure Hash Algorithm 2 (SHA-2)** | Available as SHA-224, SHA-256, SHA-384,
    and SHA-512<br>Should be used rather than SHA-1<br>Adopted by U.S. federal government
    as a secure hash standard |


    # Hash-Based Message Authentication Codes


    Hash-based Message Authentication Codes (HMAC) use existing hash functions and
    add a secret key as input to the hash function to provide integrity assurance
    and authentication. Only parties who have access to that secret key can compute
    the digest of an HMAC function.


    **NOTE:** HMACs defeat man-in-the-middle attacks.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Cisco technologies use two well-known HMAC functions:


    +   - Keyed MD5, based on the MD5 hashing algorithm

    +   - Keyed SHA-1, based on the SHA-1 hashing algorithm


    Cisco products use hashing for entity authentication, data integrity, and data
    authenticity purposes, such as the following:


    +   - IPsec gateways and clients use MD5 and SHA-1 in HMAC mode to provide packet
    integrity and authenticity.

    +   - Cisco IOS images use MD5 to verify the integrity of downloaded images and
    router passwords.

    +   - Cisco routers use hashing with secret keys to add authentication to routing
    protocols.


    # Digital Signatures


    Digital signatures are commonly used in the following situations:


    +   - To provide a unique proof of the data source, which can only be generated
    by a single party, such as with contract signing in e-commerce environments

    +   - To authenticate a user by using the private key of that user and the signature
    it generates

    +   - To prove the authenticity and integrity of public key infrastructure (PKI)
    certificates

    +   - To provide a secure time stamp, such as with a central trusted time source


    Digital signatures provide three basic security services in secure communications:


    | | |

    |---|---|

    | Authenticity of digitally signed data | Digital signatures authenticate a source,
    proving that a certain party has seen and has signed the data in question. |

    | Integrity of digitally signed data | Digital signatures guarantee that the data
    has not changed from the time it was signed. |

    | Nonrepudiation of the transaction | The recipient can take the data to a third
    party, and the third party accepts the digital signature as a proof that this
    data exchange did take place. The signing party cannot repudiate that it has signed
    the data. |'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'To achieve these goals, digital signatures have the following properties:


    |  |  |

    |---|---|

    | The signature is authentic. | The signature convinces the recipient of the document
    that the signer signed the document. |

    | The signature is not forgeable. | The signature is proof that the signer, and
    no one else, signed the document. |

    | The signature is not reusable. | The signature is a part of the document and
    cannot be moved to a different document. |

    | The signature is unalterable. | After a document is signed, it cannot be altered.
    |

    | The signature cannot be repudiated. | The signature and the document are physical
    things. Signers cannot claim later that they did not sign it. |


    **NOTE:** The next chapter covers digital signatures.'
  merge: -1
  img_proc: true
