  md: 'A disaster-recovery plan is part of business-continuity planning and requires
    extensive planning. The goal is to define objectives for the recovery of host
    computing systems that run the applications that support the business processes.
    Terms associated with business continuity include the following:


    | Term | Description |

    | --- | --- |

    | Maximum tolerable downtime (MTD) | Total amount of time the system owner or
    authorizing official is willing to accept for an outage or disruption. |

    | Recovery time objective (RTO) | RTO defines the maximum amount of time that
    a system resource can remain unavailable before there is an unacceptable impact
    on other system resources, supported mission, or business processes. |

    | Recovery point objective (RPO) | The point in time, prior to a disruption or
    system outage, to which mission or business process data can be recovered after
    an outage. |'
  merge: -1
