    in Figure 21-16. Complete the public pool object.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_325_1.png)


    *Figure 21-16 — Add Network Object Dialog*'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'Next, create the Dynamic NAT network object.


    Click **Add > Network Object** a second time, and click the drop-down NAT arrows
    to display the configurable NAT parameters.


    Then do the following:


    +   - Enter the NAT network object name.

    +   - Identify the inside network address and subnet mask.

    +   - Check the **Add Automatic Address Translation Rules** box.

    +   - Identify the type of NAT as Dynamic (other options include Dynamic PAT and
