  md: 'Create a network object to identify the pool of public IP addresses.


    |  |  |

    |---|---|

    | `ciscoasa(config)# object network public-pool-obj` | Create a network object
    and enter network object configuration mode. |

    | `ciscoasa(config-network-object)# {host ip_addr \| subnet net_addr net_mask
    \| range ip_addr_1 ip_addr_2}` | Identify the public IP pool of IP addresses using
    a host address, a subnet, or a range of addresses. |


    Create the network object that identifies the inside hosts and enable Dynamic
    NAT:


    |  |  |

    |---|---|

    | `ciscoasa(config)# object network nat-object-name` | Create a network object
    and enter network object configuration mode. |

    | `ciscoasa(config-network-object)# {subnet net_addr net_mask \| range ip_addr_1
    ip_addr_2}` | Identify the inside IP pool of IP addresses using a subnet or a
    range of addresses. |

    | `ciscoasa(config)# nat (real-ifc, mapped-ifc) dynamic public-pool-object` |
    Enable NAT to dynamically translate traffic from real-ifc to mapped-ifc using
    the public-pool network object.<br><br>**NOTE:** The parentheses and comma (,)
    are required. |


    Dynamic PAT only requires one network object to be configured.


    Create a network object that identifies the inside hosts and enable Dynamic NAT:


    |  |  |

    |---|---|

    | `ciscoasa(config)# object network pat-obj-name` | Create a network object and
    enter network object configuration mode. |

    | `ciscoasa(config-network-object)# {subnet net_addr net_mask \| range ip_addr_1
    ip_addr_2}` | Identify the inside IP pool of IP addresses using a subnet or a
    range of addresses. |'
  merge: -1
  img_proc: true
- pgno: 323
  md: '| Command | Description |

    |---|---|

    | `ciscoasa(config)# nat (real-ifc,mapped-ifc) dynamic {interface \| ip-address}`
    | Enable NAT to dynamically overload the outside interface IP address or overload
    a specified IP address.<br><br>**NOTE:** The parentheses and comma (,) are required.<br><br>**NOTE:**
    PAT could also be configured to overload a public pool of address if configured
    with the `pat-pool mapped-obj` parameter. |


    Static NAT maps an inside IP address to an outside public address such as to provide
    access to web servers by outside hosts. Static NAT requires one network object
    and an ACL to permit outside hosts access to the internal IP address.


    Create a static NAT network object:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# object network static-nat-obj-name` | Create a network object
    and enter network object configuration mode. |

    | `ciscoasa(config-network-object)# host ip_addr` | Identify the inside host IP
    address. |

    | `ciscoasa(config)# nat (real-ifc,mapped-ifc) static mapped-ip-addr` | Enable
    NAT to statically map an inside address to an outside address.<br><br>**NOTE:**
    The parentheses and comma (,) are required. |

    | `ciscoasa(config)# access-list acl-id extended permit ip any host inside_host`
    | Create an extended ACL to permit outside users access to the internal IP address.
    |

    | `ciscoasa(config-if)# access-group acl-id interface outside` | Apply the ACL
    to allow incoming static NAT traffic. |


    **NOTE:** Use the `show run object` command to display the network object, and
    use the `show run nat` command to display the NAT running configuration.


    # Configuring Dynamic and Static NAT Example Using the CLI


    Translate inside users to a public pool and permit outside users access to SVR-1.
    Figure 21-14 shows the network topology for the NAT example.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '![](img/0d9540c65a85f4cb1c32cee46038d8ab_324_0.png)


    # Figure 21-14  NAT Topology Example


    | ASA-1 命令 | 说明 |

    |---|---|

    | `ASA-1(config)# object network NAT-POOL` | Create the public pool network object.
    |

    | `ASA-1(config-network-object)# range 209.165.200.240 209.165.200.246` | Assign
    the outside public pool IP addresses. |

    | `ASA-1(config-network-object)# exit` | Return to global configuration mode.
    |

    | `ASA-1(config)# object network NAT` | Create the Dynamic NAT object. |

    | `ASA-1(config-network-object)# subnet 192.168.1.0 255.255.255.0` | Identify
    the inside hosts to translate from. |

    | `ASA-1(config-network-object)# nat (inside,outside) dynamic NAT-POOL` | Dynamically
    translate traffic inside users to the NAT-POOL network object. |

    | `ASA-1(config)# object network DMZ-NAT` | Create the static NAT network object.
    |

    | `ASA-1(config-network-object)# host 192.168.2.3` | Identify the inside SVR-1
    IP address. |

    | `ASA-1(config-network-object)# nat (dmz,outside) static 209.200.165.227` | Statically
    map the public IP address to the identified SVR-1 address. |

    | `ASA-1(config-network-object)# exit` | Return to global configuration mode.
    |

    | `ASA-1(config)# access-list PCB->SVR1 permit ip any host 192.168.2.3` | Create
    an ACL permitting outside users to access the inside SVR-1 server. |

    | `ASA-1(config)# access-group PCB->SVR1 in interface outside` | Apply the ACL
    to the outside interface. |'
  merge: -1
  img_proc: true
- pgno: 325
  md: '**NOTE:** Unlike IOS ACLs, the ASA ACL permit statement must permit access
    to the internal private demilitarized zone (DMZ) address. External hosts access
    the server using its public static NAT address, and the ASA translates it to the
    internal host IP address and applies the ACL.


    # ## Configuring Dynamic NAT Example Using ASDM


    To configure Dynamic NAT in ASDM, first configure the public pool network object.
    Choose **Configurations > Firewall > Objects > Network Objects/Groups** to open
    the Network Objects/Groups screen, as shown in Figure 21-15.


