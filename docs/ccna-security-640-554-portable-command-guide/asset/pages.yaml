- pgno: 371
  md: "# CCNA Security\nPortable Command Guide\n\n+   - Access all CCNA Security commands:\
    \ use as a quick, offline resource for research and solutions\n+   - Logical how-to-topics\
    \ groupings provide one-stop research\n+   - Great for review before CCNA Security\
    \ certification exams\n+   - Compact size makes it easy to carry with you, wherever\
    \ you go\n+   - “Create Your Own Journal” section with blank, lined pages allows\
    \ you to personalize the book for your needs\n+   - “What Do You Want to Do?”\
    \ chart inside front cover helps you to quickly reference specific tasks\n\nPreparing\
    \ for the latest CCNA® Security exam? Here are all the CCNA Security commands\
    \ you need in one condensed, portable resource. Filled with valuable, easy-to-access\
    \ information, the CCNA Security Portable Command Guide is portable enough for\
    \ you to use wherever you’re in the server room or the equipment closet.\n\nCompletely\
    \ updated to reflect the new CCNA Security 640-554 exam, this quick reference\
    \ summarizes relevant Cisco IOS® software commands, keywords, command arguments,\
    \ and associated prompts, and offers tips and examples for applying these commands\
    \ to real-world security challenges. Throughout, configuration examples provide\
    \ an even deeper understanding of how to use IOS to protect networks.\n\n+   Topics\
    \ covered include\n+   \n+   - Networking security fundamentals: concepts, policies,\
    \ strategies, and more\n+   - Securing network infrastructure: network foundations,\
    \ CCP, management plane and access, and data planes (IPv6/IPv4)\n+   - Secure\
    \ connectivity: VPNs, cryptography, IPsec, and more\n+   - Threat control and\
    \ containment: strategies, ACL threat mitigation, zone-based firewalls, and Cisco\
    \ IOS IPS\n+   - Securing networks with ASA: SDM, basic and advanced settings,\
    \ and ASA SSL VPNs\n\n> _This book is part of the Cisco Press® Certification Self-Study\
    \ Product Family, which offers readers a self-paced study routine for Cisco certification\
    \ exams. Titles in the Cisco Press Certification Self-Study Product Family are\
    \ part of a recommended learning program from Cisco that includes simulation and\
    \ hands-on training from authorized Cisco Learning Partners and self-study products\
    \ from Cisco Press._\n\nBob Vachon is a professor at Cambrian College. He has\
    \ held CCNP certification since 2002 and has collaborated on many Cisco Networking\
    \ Academy courses. He was the lead author for the Academy’s CCNA Security v1.1\
    \ curriculum that aligns to the Cisco IOS Network Security (IINS) certification\
    \ exam (640-554).\n\n**Category:** Cisco Press—Cisco Certification\n\n**Covers:**\
    \ CCNA Security Exam (640-554)\n\nCCNA Security\n\n$29.99 USA / $33.99 CANADA\n\
    \nISBN-13: 978-1-58720-448-7\nISBN-10: 1-58720-448-7\n\nciscopress.com\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_371_0.png)"
  merge: -1
  img_proc: true
