    # Spanning Tree Protocol Attacks


    Redundant Layer 2 topologies eliminate single points of failure, but they are
    more susceptible to broadcast storms, topology flap, and MAC address table instability
    problems.


    Spanning Tree Protocol (STP) is a Layer 2 protocol that provides a loop-free redundant
    network topology by placing certain ports in the blocking state. A hacker could
    manipulate STP to conduct an attack by changing the topology of a network (for
    example, by connecting a rogue switch in an attempt to take over as the root and
    have all traffic for the immediate switched domain flow through it).


    > **NOTE:** Configure the STP enhancement features PortFast, BPDU guard, and root
    guard features to mitigate STP manipulation attacks.


    # STP Enhancement Features


    | Feature | Description |

    |---|---|

    | **PortFast** | ▪ Feature minimizes the time an access port must wait for spanning
    tree to converge.<br>▪ The Layer 2 access port immediately transitions from the
    blocking to the forwarding state, bypassing the listening and learning states.<br>▪
    It should be enabled on user-facing access ports. |'
  merge: -1
  img_proc: true
- pgno: 129
  md: '| Feature | Description |

    |---|---|

    | **BPDU guard** | • Feature protects the switched network from the potential
    problems caused by the receipt of bridge protocol data units (BPDUs) on user-facing
    ports.<br>• If a BPDU is received, the port transitions to error-disabled mode
    and blocks all traffic.<br>• The port must be reset manually and therefore provides
    a secure response to invalid configurations.<br>• It should be enabled on user-facing
    access ports to prevent rogue switch installations. |

    | **Root guard** | • Feature enforces the placement of root bridges and limits
    the switch ports out of which the root bridge may be negotiated.<br>• If an incoming
    BPDU advertises a lower bridge ID than the current bridge, the port transitions
    to a root-inconsistent state (blocked).<br>• The port recovers as soon as the
    offending BPDUs cease.<br>• It should be configured on user-facing ports and switch
    ports that connect to switches (but which should not be the root bridge). |


    **NOTE:** Another STP enhancement is the BPDU filter feature, which stops the
    sending and receiving of BPDUs on a port. However, you should not configure this
    if BPDU guard is enabled.


    **NOTE:** BPDU guard and root guard are similar, but their impact is different.
    BPDU guard disables the port, and it must be enabled manually. Root guard disables
    the port but recovers once the offending device ceases to send superior BPDUs.


    # Configuring STP Enhancement Features


    You can enable PortFast globally or individually on an access port:


    | Command | Description |

    |---|---|

    | `Switch(config)#spanning-tree portfast default` | Globally enable the PortFast
    feature on all ports.<br><br>**NOTE:** You must explicitly disable PortFast on
    switched ports leading to switches because they may create Layer 2 loops. |

    | `Switch(config-if)#spanning-tree portfast` | Enable PortFast on the specified
    port. |


    **NOTE:** Use the `show running-config [interface interface-id]` command to verify
    that PortFast is enabled.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'You can enable BPDU guard globally or individually on an access port:


    | Command | Description |

    |---|---|

    | `Switch(config)#spanning-tree portfast bpduguard default` | Globally enable
    BPDU guard on all PortFast-enabled ports |

    | `Switch(config-if)#spanning-tree bpduguard enable` | Enable BPDU guard on the
    specified port |


    **NOTE:** Use the `show spanning-tree summary` and the `show spanning-tree summary
    totals` commands to display STP state information.


    You can enable root guard on either an access port or a switch port that connects
    to another switch (but which should never be the root bridge).


    | Command | Description |

    |---|---|

    | `Switch(config-if)#spanning-tree guard root` | Enable root guard on the specified
    port |


    **NOTE:** To verify, use the `show spanning-tree inconsistentports` command.


    You can also configure a switch to autorecover BPDU guard error-disabled ports
    after a specified amount of time:


    | Command | Description |

    |---|---|

    | `Switch(config)#errdisable recovery cause bpduguard` | Enable the timer to recover
    from the BPDU guard error-disabled state |


    **NOTE:** Use the `show errdisable recovery` command to display the error-disabled
    recovery timer information.


