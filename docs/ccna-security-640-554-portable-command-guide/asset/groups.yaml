    Cisco Configuration Professional (CCP) is a Windows-based GUI application that
    is used to easily and reliably deploy, manage, and monitor Cisco Integrated Services
    Router (ISR) and ISR-G2 routers without requiring knowledge of the Cisco IOS command-line
    interface (CLI).'
