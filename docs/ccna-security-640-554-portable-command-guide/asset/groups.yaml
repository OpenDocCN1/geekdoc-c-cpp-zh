    # Site-to-Site IPsec VPNs


    Organizations of all kinds often deploy site-to-site virtual private networks
    (VPNs) when implementing a corporate network across public and private networks.
    Internet-based VPN environments and Multiprotocol Label Switching (MPLS) VPN environments
    benefit from the flexibility of deployment and standards-based implementation
    of cryptographic mechanisms.


    The choice of device terminating VPNs becomes a key factor in implementing site-to-site
    VPNs. Organizations benefit from leveraging their existing network elements and
    using an integrated approach to VPN deployments. This lesson highlights the use
    of Cisco IOS routers as site-to-site VPN termination points in IP Security (IPsec)
    environments.


    # IPsec VPN Negotiation Steps


    IPsec VPN negotiation can be broken down into five steps, including Phase 1 and
    Phase 2 of Internet Key Exchange (IKE):


    +   1. An IPsec tunnel is initiated when a host sends "interesting" traffic to
    a destination host. Traffic is considered interesting when it travels between
    the IPsec peers and meets the criteria that are defined in the crypto ACL.'
