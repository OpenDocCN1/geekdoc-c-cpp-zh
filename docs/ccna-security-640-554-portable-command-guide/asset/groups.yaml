    # MAC Address Attacks


    | Attack | Description |

    |---|---|

    | **MAC address table attack** | Enables an attacker to sniff frames by overwhelming
    a switch MAC address table with fake addresses. Once full, the switch floods all
    unknown unicast frames. The attacker can then capture all traffic or spoof one
    of the learned MAC addresses. |

    | **MAC address spoofing** | Attacker spoofs another interface MAC address and
    sends a gratuitous Address Resolution Protocol (ARP) request to the target switch
    in an attempt to make it forward frames back to the attacker host. |


    **NOTE:** Configure port security to mitigate MAC address attacks.


    # Configuring Port Security


    To configure port security on an access port, follow these steps:


    +   1. Configure an interface as an access port.

    +   2. Enable port security on the port.


    | Command | Explanation |

    |---|---|

    | `Switch(config-if)#switchport mode access` | A required step, this sets the
    interface to access mode (as opposed to trunk mode). **NOTE:** A port cannot be
    secured while in the default dynamic auto mode. |

    | `Switch(config-if)#switchport port-security` | Enable port security and assign
    the current MAC address to the port. Port-security defaults include the following:
    - Only one MAC address can be assigned. - Port violation action is shut down.
    **NOTE:** Defaults can be altered if required. |'
