    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_158_0.png)


    **Figure 11-4** Associate with an Interface Window


    Select the interface, specify the direction, and click **OK** to return to the
    Add a Rule dialog.


    **NOTE:** If another rule is already associated with the interface, an information
    box appears. Either cancel the operation or continue by appending the rule entries
    to the rule that is already applied to the interface.


    Review the rule, and when done, click **OK**


    CCP displays the command-line interface (CLI) configuration commands. Click **Deliver**
    to commit the configuration changes.


    The Access Rules information screen displays the newly created rule.


    **NOTE:** Multiple rules can appear in this screen. Select the rule to view the
    specifics associated to it.


    **NOTE:** To view log entries, click Monitor > Security > Firewall Status.'
