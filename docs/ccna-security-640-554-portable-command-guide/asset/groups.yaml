    \ | - The ASA 5505 can be used by telecommuters and home users to connect to a\
    \ centralized location using a VPN |\n\n### ASA 5505 Configuration Options\n\n\
    ASA devices can be configured and managed using either the\n\n- Command-line interface\
    \ (CLI) required for initial ASA deployment and maintenance\n- Adaptive Security\
    \ Device Manager (ASDM) GUI\n\n> **NOTE:** ASDM simplifies the deployment and\
    \ maintenance of an ASA.\n\n## CHAPTER 19: Introduction to ASDM\n\nThis chapter\
    \ covers the following topics:\n\n- **Adaptive Security Device Manager**\n  -\
    \ Accessing ASDM\n  - Factory Default Settings\n  - Resetting the ASA 5505 to\
    \ Factory Default Settings\n  - Erasing the Factory Default Settings\n  - Setup\
    \ Initialization Wizard\n- **Installing and Running ASDM**\n  - Running ASDM\n\
    - **ASDM Wizards**\n  - The Startup Wizard\n  - VPN Wizards\n  - Advanced Wizards\n\
    \n### Adaptive Security Device Manager\n\nCisco Adaptive Security Device Manager\
    \ (ASDM) is a Java-based GUI tool that facilitates the setup, configuration, monitoring,\
    \ and troubleshooting of Cisco Adaptive Security Appliances (ASA).\n\n**NOTE:**\
    \ ASDM is now preloaded in flash memory on any ASA versions 7.0 and later.\n\n\
    ASDM can be\n\n- Run from a browser as a Java Web Start application that is dynamically\
    \ downloaded from the ASA flash, allowing an administrator to configure and monitor\
    \ that ASA device\n- Downloaded from flash and installed locally on a host as\
    \ an application, allowing an administrator to use ASDM to configure and manage\
    \ multiple ASA devices\n\n### Accessing ASDM\n\nASDM access requires connecting\
    \ to a management interface that has some minimal configurations to communicate\
    \ over the network.\n\nThe management interface depends on the model of the ASA:\n\
    \n- On an ASA 5505, the management switch port can be any port, except for Ethernet\
    \ 0/0.\n- On an ASA 5510 and later, the management interface is Management 0/0.\
    \ However, another Fast Ethernet interface can also be used.\n\nThe minimal configuration\
    \ can be provided on an ASA 5505 using any of the following methods:\n\n| Method\
    \ | Configuration |\n|---|---|\n| **Restore factory default settings** | - The\
    \ ASA can be reset to provide a basic configuration that is sufficient for a small\
    \ office/home office (SOHO) deployment.<br>- The configuration includes two preconfigured\
    \ VLAN networks, Dynamic Host Configuration Protocol (DHCP), and Network Address\
    \ Translation (NAT) services. |\n| **Setup Initialization Wizard** | - The ASA\
    \ interactively guides an administrator to configure the basic security settings\
    \ to access ASDM.<br>- Additional HTTP settings must be configured to access the\
    \ ASDM. |\n| **CLI configuration** | - Configure all parameters using the command-line\
    \ interface (CLI). |\n\n**NOTE:** The next chapter covers the CLI configuration\
    \ method.\n\n### Factory Default Settings\n\nThe ASA 5505 with a Base license\
    \ ships with the following default factory settings:\n\n- A default hostname of\
    \ ciscoasa.\n- Console or enable passwords, which are blank.\n- An inside VLAN\
    \ 1 interface that includes the Ethernet 0/1 through 0/7 switch ports. The VLAN\
    \ 1 IP address and mask are 192.168.1.1 and 255.255.255.0.\n- An outside VLAN\
    \ 2 interface that includes the Ethernet 0/0 switch port. VLAN 2 derives its IP\
    \ address from the ISP using DHCP.\n- The default route that is derived from DHCP.\n\
    - All inside IP addresses to be translated when accessing the outside using interface\
    \ Port Address Translation (PAT).\n- The HTTP server to support ASDM access.\n\
    - An internal DHCP server to provide addresses between 192.168.1.5 and 192.168.1.36\
    \ for hosts that connect to a VLAN 1 interface.\n\n**NOTE:** You can change these\
    \ settings manually using the CLI or interactively using either the CLI Setup\
    \ Initialization Wizard or using the ASDM Startup Wizard.\n\n**NOTE:** The Reset\
    \ button on the ASA 5505 is disabled and inoperable by default.\n\n### Resetting\
    \ the ASA 5505 to Factory Default Settings\n\nYou can restore the ASA to its factory\
    \ default configuration by using the following:\n\n| Command | Description |\n\
    |---|---|\n| `ciscoasa# config t` | Enter global configuration mode. |\n| `ciscoasa(config)#\
    \ config factory-default` | Reset the ASA to its factory default settings.<br><br>**NOTE:**\
    \ A warning appears stating that the boot system configuration (startup configuration)\
    \ will be cleared.<br><br>**NOTE:** The ASA loads a default configuration into\
    \ the running configuration. |\n| `ciscoasa(config)# reload save-config noconfirm`\
    \ | Save the configuration and then reload the ASA without asking for confirmation.\
    \ |\n\n### Erasing the Factory Default Settings\n\n| Command | Description |\n\
    |---|---|\n| `ciscoasa# write erase` | Erase the startup-configuration file. |\n\
    | `ciscoasa(config)# reload noconfirm` | Reload the ASA without confirmation.\
    \ |\n\n### Setup Initialization Wizard\n\nWhen the default factory settings are\
    \ erased and an ASA is reloaded, the ASA Setup Initialization Wizard prompts will\
    \ eventually appear asking **Pre-configure firewall now through interactive prompts\
    \ [yes]?**\n\nAnswering no cancels the Setup Initialization Wizard, and the ASA\
    \ displays its default prompt. In this case, you must manually configure the ASA\
    \ via the CLI.\n\nPressing **Enter** accepts the default (**yes**), and the ASA\
    \ will interactively guide an administrator to configure basic ASA features, including\
    \ the following:\n\n- Firewall mode\n- Enable password\n- Enable password recovery\n\
    - Time and date settings\n- Inside IP address and mask\n- ASA device name\n- Domain\
    \ name\n\n**NOTE:** The security appliance displays the default values in brackets\
    \ (`[ ]`) before prompting the user to accept or change them. To accept the default\
    \ input, press **Enter**.\n\nWhen the interactive portion of the Setup Initialization\
    \ Wizard completes, the security appliance displays the summary of the new configuration\
    \ and prompts the user to save or reject the settings:\n\n- Answering **yes**\
    \ saves the configuration and displays the configured hostname prompt.\n- Answering\
    \ **no** restarts the Setup Initialization Wizard. Any changes previously made\
    \ become the new default settings, enabling an administrator to correct a misconfigured\
    \ setting.\n\nThe Setup Initialization Wizard provides most of the settings for\
    \ ASDM. However, the HTTP service must be enabled.\n\nTo allow access to ASDM,\
    \ enable HTTPS connections from any host on the inside network:\n\n| Command |\
    \ Description |\n|---|---|\n| `ciscoasa(config)# http server enable` | Enable\
    \ HTTP services. |\n| `ciscoasa(config)# http ip-address network-mask interface-name`\
    \ | Identify a host or hosts that can access the ASA HTTP server using ASDM. |\n\
    \n**NOTE:** To remove and disable the ASA HTTP server service, use the global\
    \ configuration command `clear configure http`.\n\n### Installing and Running\
    \ ASDM\n\nThe ASDM interface can be accessed from any workstation with an IP address\
    \ included in the HTTP trusted network list.\n\n**TIP:** Before attempting to\
    \ establish a secure ASDM connection to the ASA, verify that IP connectivity exists\
    \ between the workstation and the Cisco ASA.\n\nWith a factory default configuration\n\
    \n- A host on the 192.168.1.0/24 network can connect to the ASA default management\
    \ IP address of 192.168.1.1 using ASDM.\n- The host must establish a connection\
    \ through a browser to the inside interface IP address using the HTTPS protocol.\n\
    \nA security certificate window may appear. Depending on the browser settings,\
    \ select **Yes** or click on **Continue to This Website** to continue to the ASDM\
    \ launcher window.\n"
  mdcn: "\n### ASA 5505 端口配置\n\nASA 5510 及更高型号设备具有第 3 层路由接口。接口通过分配 IP 地址、接口名称和安全级别来启用。\n\
    \nASA 5505 的配置方式与更高型号不同，因为它没有任何第 3 层接口。它附带一个集成的八端口第 2 层快速以太网交换机。每个端口单独分配给特定 VLAN。所有第\
    \ 3 层参数（即 IP 地址、接口名称和安全级别）都必须为 VLAN 接口配置，该接口也称为交换机虚拟接口 (SVI)。同一 VLAN 上的交换机端口可以使用硬件交换相互通信。\n\
    \n### ASA 5505 部署场景\n\nASA 5505 通常用作边缘安全设备，将小型企业连接到 ISP 以访问 Internet。它可以按如下方式部署：\n\
    \n|  |  |\n|---|---|\n| **小型分支机构部署** | - ASA 5505 可部署为具有 2 个安全区域：<br>&nbsp;&nbsp;-\
    \ 用于内部主机的 VLAN 1，安全级别为 100<br>&nbsp;&nbsp;- 用于 Internet 连接的 VLAN 2，安全级别为 0 |\n\
    | **小型企业部署** | - ASA 5505 可部署为具有 3 个安全区域：<br>&nbsp;&nbsp;- VLAN 1 用于连接工作站的内部网络<br>&nbsp;&nbsp;-\
    \ VLAN 2 用于连接到 Internet 的外部网络<br>&nbsp;&nbsp;- VLAN 3 用于连接到公司 Web 服务器的 DMZ |\n\
    | **企业部署** | - 远程办公人员和家庭用户可以使用 ASA 5505 通过 VPN 连接到集中位置 |\n\n### ASA 5505 配置选项\n\
    \nASA 设备可以使用以下任一方式配置和管理：\n\n- 初始 ASA 部署和维护所需的命令行界面 (CLI)\n- 自适应安全设备管理器 (ASDM)\
    \ GUI\n\n> **注意：** ASDM 简化了 ASA 的部署和维护。\n\n## 第 19 章：ASDM 简介\n\n本章涵盖以下主题：\n\n\
    - **自适应安全设备管理器**\n  - 访问 ASDM\n  - 出厂默认设置\n  - 将 ASA 5505 重置为出厂默认设置\n  - 擦除出厂默认设置\n\
    \  - 设置初始化向导\n- **安装和运行 ASDM**\n  - 运行 ASDM\n- **ASDM 向导**\n  - 启动向导\n  - VPN\
    \ 向导\n  - 高级向导\n\n### 自适应安全设备管理器\n\nCisco 自适应安全设备管理器 (ASDM) 是一款基于 Java 的 GUI 工具，可帮助完成\
    \ Cisco 自适应安全设备 (ASA) 的设置、配置、监控和故障排除。\n\n**注意：** 现在，任何 7.0 及更高版本的 ASA 的闪存中都预加载了\
    \ ASDM。\n\nASDM 可以：\n\n- 从浏览器作为 Java Web Start 应用程序运行，该应用程序从 ASA 闪存动态下载，允许管理员配置和监控该\
    \ ASA 设备\n- 从闪存下载并作为应用程序本地安装到主机上，允许管理员使用 ASDM 配置和管理多台 ASA 设备\n\n### 访问 ASDM\n\n\
    访问 ASDM 需要连接到具有一些最低配置以便通过网络进行通信的管理接口。\n\n管理接口取决于 ASA 的型号：\n\n- 在 ASA 5505 上，管理交换机端口可以是除\
    \ Ethernet 0/0 之外的任何端口。\n- 在 ASA 5510 及更高型号上，管理接口是 Management 0/0。但是，也可以使用另一个快速以太网接口。\n\
    \n可以使用以下任一方法在 ASA 5505 上提供最低配置：\n\n| 方法 | 配置 |\n|---|---|\n| **恢复出厂默认设置** | -\
    \ 可以重置 ASA，以提供足以用于小型办公室/家庭办公室 (SOHO) 部署的基本配置。<br>- 该配置包括两个预配置的 VLAN 网络、动态主机配置协议\
    \ (DHCP) 和网络地址转换 (NAT) 服务。 |\n| **设置初始化向导** | - ASA 以交互方式引导管理员配置基本安全设置以访问 ASDM。<br>-\
    \ 必须配置额外的 HTTP 设置才能访问 ASDM。 |\n| **CLI 配置** | - 使用命令行界面 (CLI) 配置所有参数。 |\n\n**注意：**\
    \ 下一章介绍 CLI 配置方法。\n\n### 出厂默认设置\n\n配备 Base 许可证的 ASA 5505 出厂时附带以下默认出厂设置：\n\n- 默认主机名为\
    \ ciscoasa。\n- 控制台密码或启用密码为空。\n- 内部 VLAN 1 接口包含 Ethernet 0/1 至 0/7 交换机端口。VLAN 1\
    \ 的 IP 地址和掩码分别为 192.168.1.1 和 255.255.255.0。\n- 外部 VLAN 2 接口包含 Ethernet 0/0 交换机端口。VLAN\
    \ 2 使用 DHCP 从 ISP 获取其 IP 地址。\n- 从 DHCP 获取的默认路由。\n- 使用接口端口地址转换 (PAT) 访问外部时，转换所有内部\
    \ IP 地址。\n- 支持 ASDM 访问的 HTTP 服务器。\n- 内部 DHCP 服务器为连接到 VLAN 1 接口的主机提供 192.168.1.5\
    \ 至 192.168.1.36 之间的地址。\n\n**注意：** 你可以使用 CLI 手动更改这些设置，也可以通过 CLI 设置初始化向导或 ASDM\
    \ 启动向导以交互方式更改这些设置。\n\n**注意：** 默认情况下，ASA 5505 上的 Reset 按钮被禁用且不可操作。\n\n### 将 ASA\
    \ 5505 重置为出厂默认设置\n\n可以使用以下命令将 ASA 恢复为出厂默认配置：\n\n| 命令 | 描述 |\n|---|---|\n| `ciscoasa#\
    \ config t` | 进入全局配置模式。 |\n| `ciscoasa(config)# config factory-default` | 将 ASA\
    \ 重置为出厂默认设置。<br><br>**注意：** 将出现一条警告，指出引导系统配置（启动配置）将被清除。<br><br>**注意：** ASA 会将默认配置加载到运行配置中。\
    \ |\n| `ciscoasa(config)# reload save-config noconfirm` | 保存配置，然后重新加载 ASA，无需请求确认。\
    \ |\n\n### 擦除出厂默认设置\n\n| 命令 | 描述 |\n|---|---|\n| `ciscoasa# write erase` | 擦除启动配置文件。\
    \ |\n| `ciscoasa(config)# reload noconfirm` | 重新加载 ASA，无需确认。 |\n\n### 设置初始化向导\n\
    \n当出厂默认设置被擦除并重新加载 ASA 时，最终会出现 ASA 设置初始化向导提示，询问 **是否现在通过交互式提示预配置防火墙 [yes]？**\n\n\
    回答 no 会取消设置初始化向导，ASA 将显示其默认提示符。在这种情况下，必须通过 CLI 手动配置 ASA。\n\n按 **Enter** 接受默认值\
    \ (**yes**)，ASA 将以交互方式引导管理员配置基本 ASA 功能，包括以下内容：\n\n- 防火墙模式\n- 启用密码\n- 启用密码恢复\n\
    - 时间和日期设置\n- 内部 IP 地址和掩码\n- ASA 设备名称\n- 域名\n\n**注意：** 安全设备会在提示用户接受或更改默认值之前，在方括号\
    \ (`[ ]`) 中显示默认值。要接受默认输入，请按 **Enter**。\n\n当设置初始化向导的交互部分完成后，安全设备会显示新配置的摘要，并提示用户保存或拒绝这些设置：\n\
    \n- 回答 **yes** 会保存配置并显示已配置的主机名提示符。\n- 回答 **no** 会重新启动设置初始化向导。之前所做的任何更改都会成为新的默认设置，使管理员能够更正配置错误的设置。\n\
    \n设置初始化向导提供了 ASDM 的大多数设置。但是，必须启用 HTTP 服务。\n\n要允许访问 ASDM，请启用来自内部网络中任何主机的 HTTPS\
    \ 连接：\n\n| 命令 | 描述 |\n|---|---|\n| `ciscoasa(config)# http server enable` | 启用\
    \ HTTP 服务。 |\n| `ciscoasa(config)# http ip-address network-mask interface-name`\
    \ | 标识可以使用 ASDM 访问 ASA HTTP 服务器的一台或多台主机。 |\n\n**注意：** 要移除并禁用 ASA HTTP 服务器服务，请使用全局配置命令\
    \ `clear configure http`。\n\n### 安装和运行 ASDM\n\n任何 IP 地址包含在 HTTP 可信网络列表中的工作站都可以访问\
    \ ASDM 界面。\n\n**提示：** 在尝试与 ASA 建立安全的 ASDM 连接之前，请验证工作站与 Cisco ASA 之间是否存在 IP 连通性。\n\
    \n使用出厂默认配置时\n\n- 192.168.1.0/24 网络上的主机可以使用 ASDM 连接到 ASA 的默认管理 IP 地址 192.168.1.1。\n\
    - 该主机必须使用 HTTPS 协议通过浏览器连接到内部接口 IP 地址。\n\n可能会出现安全证书窗口。根据浏览器设置，选择 **是** 或单击 **继续访问此网站**\
    \ 以继续进入 ASDM 启动器窗口。\n\n"
