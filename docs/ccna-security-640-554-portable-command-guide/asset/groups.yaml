    \ and an Identity Store\n  - Configuring Access Service to Process Requests\n\
    \  - Creating Identity and Authorization Policies\n\n### Authenticating Administrative\
    \ Access\n\n#### Local Authentication\n\nAdministrative access to console, vty,\
    \ and AUX lines and to HTTP access can be authenticated locally using the following:\n\
    \n| Method | Description |\n|---|---|\n| **Line passwords** | Easy to implement\
    \ using the password and login commands, but this is the least-secure method and\
    \ very vulnerable to brute-force attacks. There is also loss of accountability\
    \ because the password can be shared. |\n| **Local authentication** | Implemented\
    \ to improve security because the user must now provide a username and password,\
    \ which are compared to entries in the local device database. |\n| **Self-contained\
    \ AAA (local AAA)** | This method is similar to local authentication but can provide\
    \ backup methods of authentication. |\n\n> **NOTE:** Authenticating locally is\
    \ not very scalable.\n\n#### Server-Based Authentication\n\nA more scalable method\
    \ is to use a server-based solution using one of the following methods:\n\n| Method\
    \ | Description |\n|---|---|\n| **Cisco Secure Access Control Server (ACS) for\
    \ Windows Server** | The AAA services on the router contact an external Cisco\
    \ Secure ACS Windows Server for user and administrator authentication. |\n| **Cisco\
    \ Secure Access Control System** | The Cisco ACS 5.2 software runs either on a\
    \ dedicated Cisco 1121 Secure Access Control System (CSACS-1121) appliance, or\
    \ on a VMware server. |\n| **Cisco Identity Services Engine (ISE)** | A dedicated\
    \ appliance that consolidates features of Cisco ACS and Network Admission Control\
    \ (NAC) to provide AAA, profiling, posture, and guest management. It is a component\
    \ of the Cisco TrustSec solution and Cisco SecureX Architecture. |\n"
