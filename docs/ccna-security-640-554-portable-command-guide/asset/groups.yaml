    ## 恢复启动集文件


    在路由器遭到篡改（通过 NVRAM 擦除或磁盘格式化）后，要从安全归档恢复主启动集，必须完成四个步骤。


    以下示例演示了如何将启动集文件恢复到 IOS 损坏并引导至 ROMMON 模式的 ISR 的过程。


    | 命令 | 说明 |

    |---|---|

    | <pre>Router#reload<br>Proceed with reload? [confirm]<br>rommon 1 > dir flash:</pre>
    | 重新加载路由器。按 **Enter** 继续。<br><br>进入 ROMMON 模式并显示启动集文件。 |

    | <pre>rommon 2 > boot c1841-advipservicesk9-mz.124-20.T1.bin</pre> | 使用所列映像引导路由器。
    |

    | <pre>Router(config)#secure boot-config restore flash:runcfg-20120701-090211.ar</pre>
    | 将安全配置恢复到 flash 中找到的归档。 |


    ## 在 Cisco 路由器上实施基于角色的访问控制


    ### 配置特权级别


    | 命令 | 说明 |

    |---|---|

    | `Router(config)#privilege mode {level level command \| reset command}` | 将命令分配到
    2 到 14 之间的自定义特权级别。<br><br>共有 16 个特权级别。级别 0 是入口级别，级别 1 用于用户 EXEC 访问，级别 15 是特权 EXEC
    模式。级别 2–14 可自定义。 |

    | `Router(config)#enable secret level level password` | 为自定义特权级别分配密码。 |

    | `Router>enable level` | 进入自定义特权级别。 |


    **注意：** 使用 `show privilege` 命令显示当前特权级别。


    ### 配置特权级别示例


    | 命令 | 说明 |

    |---|---|

    | `R1(config)#privilege exec level 5 ping` | 将 ping 命令添加到级别 5。 |

