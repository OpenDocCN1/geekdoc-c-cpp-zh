    \n要执行安全审计，请按照以下步骤操作：\n\n- 1. 在工具栏上，导航到 **配置 > 安全 > 安全审计**（见图 5-6）。\n\n  ![](img/0d9540c65a85f4cb1c32cee46038d8ab_69_0.png)\n\
    \n  图 5-6 安全审计屏幕\n\n- 2. 单击 **执行安全审计**。安全审计向导的欢迎页面打开。\n- 3. 单击 **下一步**。将出现安全审计接口配置页面。\n\
    - 4. 选择 **内部（可信）** 和 **外部（不可信）** 接口，然后单击 **下一步**。\n- 5. 安全审计向导会根据 Cisco 推荐的最佳实践测试路由器配置，以确定是否存在可能的安全问题。将出现报告屏幕并列出测试结果。如果要将此报告保存到文件，请单击\
