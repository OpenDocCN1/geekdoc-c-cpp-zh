    |---|---|

    | **Trojan horses** | These are applications written to look like something else
    such as a free screensaver, free virus checker, and so on. When a Trojan horse
    is downloaded and opened, it attacks the end-user computer from within. Trojan
    horses may be created to initiate specific types of attacks, including the following:
    |


    +   - Remote access

    +   - Data sending (key logging)

    +   - Destructive

    +   - Security software disabler

    +   - Denial of service


    # Anatomy of a Worm


    Upon successful exploitation, the worm copies itself from the attacking host to
    the newly exploited system and the cycle begins again.


    Most worms have the following three components:


    | Component | Description |

    |---|---|

    | **Enabling vulnerability** | A worm installs itself using an exploit mechanism
    (email attachment, executable file, Trojan horse) on a vulnerable system. |

    | **Propagation mechanism** | After gaining access to a device, the worm replicates
    itself and locates new targets. It spreads without human intervention and scans
    for other hosts to infect. |

    | **Payload** | Any malicious code that results in some action. Most often, this
    is used to create a back door to the infected host. |


    # Mitigating Malware and Worms


    The primary means of mitigating malware is antivirus software. Antivirus software
    helps prevent hosts from getting infected and spreading malicious code. It requires
    much more time (and money) to clean up infected computers than it does to purchase
    antivirus software and maintain antivirus definition updates.


    Worms are more network based than viruses and are more likely to have infected
    several systems within an organization. The security staff response to a worm
    infection usually involves the following four phases:


    | Phase | Description |

    |---|---|

    | **Containment** | The goal is to limit the spread of infection and requires
    segmentation of the infected devices to prevent infected hosts from targeting
    other uninfected systems. Containment requires using incoming and outgoing access
    control lists (ACLs) on routers and firewalls at control points within the network.
    |

    | **Inoculation** | The goal is to deprive the worm of any available targets.
    Therefore, all uninfected systems are patched with the appropriate vendor patch.
    The inoculation phase often runs parallel to or subsequent to the containment
    phase. |'
