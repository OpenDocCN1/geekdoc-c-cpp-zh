    \n![](img/0d9540c65a85f4cb1c32cee46038d8ab_259_0.png)\n\n图17-12 修改后的VPN屏幕\n\n\
    您可以使用“编辑站点到站点VPN”选项验证VPN配置。使用此窗口管理到远程系统的VPN连接。\n\n“状态”列显示连接状态，由直观图标指示。\n\n您还可以创建、编辑和删除VPN连接，并重置现有连接。\n\
