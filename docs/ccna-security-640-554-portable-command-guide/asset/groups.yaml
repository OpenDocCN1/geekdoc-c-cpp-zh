  mdcn: "\n\n## 使用 ASDM 配置 DHCP 服务器示例\n\n要启用 DHCP 服务器服务，请选择 **配置 > 设备管理 > DHCP > DHCP\
    \ 服务器**。ASDM 将打开 DHCP 服务器屏幕（见图 21-2）。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_306_0.png)\n\
    \n**图 21-2** DHCP 服务器屏幕\n\n在此窗口中，您可以修改常规 DHCP 设置。\n\n要为内部用户启用 DHCP 服务，请单击内部接口，并单击**编辑**按钮。ASDM\
    \ 随后将打开“编辑 DHCP 服务器”对话框，如图 21-3 所示。\n\n**注意：** 每次更改后，请务必单击**应用**按钮。\n\n## ASA\
    \ 对象和对象组\n\n对象使配置的维护更加容易。当某个对象被修改时，该更改将自动应用于所有使用该指定对象的规则。对象用于网络地址转换（NAT）、访问列表，并可嵌套到其他对象组中。\n\
    \nASA 支持以下内容：\n\n| 类别 | 描述 |\n|---|---|\n| **对象** | - 对象用于标识 IP 地址/掩码或协议（和端口）。<br>-\
    \ 对象可在多个配置中重复使用。<br>- ASA 支持网络对象和服务对象。<br>- 对象使用 <code>object {network &#124;\
    \ service} object-name</code> 命令创建。 |\n| **对象组** | - 对象组用于将对象分组。<br>- 对象可以附加到多个对象组，或从多个对象组中分离。<br>-\
    \ 您可以使用 <code>object-group {network &#124; protocol &#124; icmp-type} group-name</code>\
    \ 命令创建网络、协议和 Internet 控制消息协议（ICMP）类型的对象组。<br>- 您还可以使用 <code>object-group service\
    \ group-name [tcp &#124; udp &#124; tcp-udp]</code> 创建服务对象组。 |\n\n### 网络对象和服务对象\n\
    \n网络对象包含单个 IP 地址/掩码对，可通过主机、子网或地址范围进行标识。\n\n使用以下命令创建或编辑网络对象：\n\n| 命令 | 描述 |\n|---|---|\n\
    | <code>ciscoasa(config)# object network object-name</code> | 创建或编辑网络对象，并进入网络对象配置模式。\
    \ |\n| <code>ciscoasa(config-network-object)# {host ip_addr &#124; subnet net_addr\
    \ net_mask &#124; range ip_addr_1 ip_addr_2}</code> | 将 IP 地址分配给指定名称的对象。您可以配置主机地址、子网或地址范围。\
    \ |\n\n**注意：** 使用这三条命令中的任意一条的 `no` 形式即可移除网络对象。\n\n**注意：** 网络对象中只能有一条语句。输入第二个 IP\
    \ 地址/掩码对将替换现有配置语句。\n\n**注意：** 要验证配置，请使用 `show running-config object` 命令。\n\n**注意：**\
    \ 如果对象组在命令中使用，则无法将其移除或置空。\n\n### 网络、协议、ICMP 和服务对象组\n\n使用以下命令创建网络对象组：\n\n| 命令 |\
    \ 描述 |\n|---|---|\n| <code>ciscoasa(config)# object-group network group-name</code>\
    \ | 创建或编辑网络对象组，并进入网络对象组配置模式。 |\n\n使用以下命令标识特定主机或网络对象组：\n\n| 命令 | 描述 |\n|---|---|\n\
    | <code>ciscoasa(config-network-object-group)# network-object host ip-addr</code>\
    \ | 将 IP 地址分配给指定名称的对象。 |\n| <code>ciscoasa(config-network-object-group)# group-object\
    \ group-name</code> | 将对象组分配给指定名称的对象。<br><br>**注意：** 这允许对相同类型的对象进行逻辑分组，并构建分层对象组以实现结构化配置。\
    \ |\n\n**注意：** 可以在网络对象组中添加多个主机、网络和对象。\n\n**注意：** 网络对象组不能用于实现 NAT。实现 NAT 需要网络对象。\n\
    \n基于协议的对象组将 IP 协议组合到一个对象中。\n\n使用以下命令创建协议对象组：\n\n| 命令 | 描述 |\n|---|---|\n| <code>ciscoasa(config)#\
    \ object-group protocol group-name</code> | 创建或编辑协议对象组，并进入协议对象组配置模式。 |\n\n使用以下命令之一来标识协议或其他协议对象组：\n\
    \n| 命令 | 描述 |\n|---|---|\n| <code>ciscoasa(config-protocol-object-group)# protocol-object\
    \ protocol</code> | 定义组中的协议。**注意：** `protocol` 参数是 IP 协议数字标识符（1 到 254）或关键字标识符（例如，包括所有\
    \ IP 协议的 `icmp`、`tcp`、`udp` 或 `ip`）。 |\n| <code>ciscoasa(config-protocol-object-group)#\
    \ group-object group-name</code> | 将对象组分配给指定名称的对象。 |\n\n使用以下命令创建 ICMP 对象组：\n\n\
    | 命令 | 描述 |\n|---|---|\n| <code>ciscoasa(config)# object-group icmp-type group-name</code>\
    \ | 创建或编辑 ICMP 对象组，并进入 ICMP 类型对象组配置模式。 |\n\n使用以下命令之一来标识 ICMP 类型或其他 ICMP 对象组：\n\
    \n| 命令 | 描述 |\n|---|---|\n| <code>ciscoasa(config-icmp-object-group)# icmp-object\
    \ icmp-type</code> | 定义组中的 ICMP 类型。对每种类型输入该命令。 |\n| <code>ciscoasa(config-icmp-object-group)#\
    \ group-object group-name</code> | 将对象组分配给指定名称的对象。 |\n\n基于服务的对象组用于将 TCP、UDP 或\
    \ TCP 和 UDP 端口组合到一个对象中。ASA 支持创建可包含 TCP 服务、UDP 服务、ICMP 类型服务以及任何协议（如封装安全协议（ESP）、通用路由封装（GRE）和\
    \ TCP）混合组成的服务对象组。\n\n使用以下命令创建服务对象组：\n\n| 命令 | 描述 |\n|---|---|\n| <code>ciscoasa(config)#\
    \ object-group service group-name</code> | 创建或编辑服务组对象，并进入服务对象组配置模式。 |\n\n使用以下命令之一来标识服务或其他服务对象组：\n\
    \n| 命令 | 描述 |\n|---|---|\n| <code>ciscoasa(config-service-object-group)# port-object\
    \ eq service</code> | 向服务对象组添加端口对象。为服务对象指定 TCP 或 UDP 端口的十进制数字或名称。 |\n| <code>ciscoasa(config-service-object-group)#\
    \ group-object group-name</code> | 将对象组分配给指定名称的对象。 |\n\n安全设备上的 ACL 可用于以下场景：\n\n\
    | 类别 | 描述 |\n|---|---|\n| 穿越流量数据包过滤 | - 流量正在从设备的一个接口穿过到另一个接口。<br>- 配置要求先定义 ACL，然后将其应用于接口。\
    \ |\n| 到设备的数据包过滤 | - 流量（例如 Telnet、SSH、简单网络管理协议 [SNMP]）的目标是设备。<br>- 它过滤发往 ASA 管理平面的流量。<br>-\
    \ 它一步即可完成，但需要一组额外的规则来实现访问控制。<br>- 也称为管理访问规则。 |\n\n## ACL 语法\n\n您可以将许多选项用于 ACL。然而，对于大多数需求，一个更有用且更简明的语法版本如下：\n\
    \n```\n    ciscoasa(config)# access-list id extended {deny | permit} protocol\n\
    \    {source_addr source_mask} | any | host src_host |\n    interface src_if_name\n\
    \    {operator port [port]}\n    {dest_addr dest_mask} | any | host dst_host |\n\
    \    interface dst_if_name\n    {operator port [port]}\n```\n\n**注意：** `interface`\
    \ 关键字用于“到设备”过滤。\n\n**注意：** 所有 ACL 语法的解释超出了本章的范围。\n\n**注意：** 使用 `help access-list`\
