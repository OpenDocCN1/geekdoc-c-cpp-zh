    **NOTE:** Assume that the ASA startup configuration file has been erased and the
    device has been reloaded.


    Enter privileged EXEC and then global configuration mode:


    | Command | Description |

    |---|---|

    | `Pre-configure firewall now through interactive prompts (yes)? no` | At the
    Setup Initialization Wizard prompt, enter **no** to exit the wizard. |

    | `ciscoasa> enable`<br>`Password:` | Enter privileged EXEC mode. When prompted
