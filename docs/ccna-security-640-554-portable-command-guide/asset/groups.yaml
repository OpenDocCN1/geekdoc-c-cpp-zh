    # ## Configuring a Site-to-Site IPsec VPN Using CCP Example


    You can use CCP wizards to simplify the process of configuring the site-to-site
    VPN.


    Launch the Site-to-Site Wizard for R1 and choose Configure > Security > VPN >
    Site-to-Site VPN to display the VPN screen (see Figure 17-2).


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_251_0.png)


    Figure 17-2 VPN Screen


    From this screen, you can create a site-to-site VPN or edit a VPN configuration.


    The Create Site to Site VPN tab includes two types of wizard:


    | Create a Site to Site VPN | This option enables you to create a VPN network
    connecting two routers. |

    | Create a Secure GRE Tunnel (GRE-over-IPsec) | This option enables you to configure
    a generic routing encapsulation (GRE) protocol tunnel between your router and
    a peer device. |


    Select Create a Site to Site VPN and click the Launch the Selected Task button.


    The wizard displays the window shown in Figure 17-3.'
