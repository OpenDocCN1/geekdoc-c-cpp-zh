    - *斜体*表示需要你提供实际值的参数。\n- 竖线（|）分隔备选且互斥的元素。\n- 方括号[ ]表示可选元素。\n- 花括号{ }表示必需的选择。\n\
    - 方括号内的花括号[ { } ]表示可选元素中的必需选择。\n\n## 引言\n\n欢迎阅读CCNA Security！Scott Empson有一个想法：以便携式快速参考指南的形式提供他的工程日志摘要。成果就是*便携命令指南*系列。事实证明，这些小书对于任何备考Cisco认证的人，或任何负责管理Cisco基础设施设备并需要便捷快速参考资源的人，都非常有价值。\n\
