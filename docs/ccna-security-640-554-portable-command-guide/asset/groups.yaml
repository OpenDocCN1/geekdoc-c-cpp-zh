    # Threats


    The time from knowledge of a vulnerability to the release of an exploit has decreased.
    Some exploits are designed to have global impact within minutes. Some exploits
    are also persistent and are difficult to eradicate.


    # Trends in Information Security Threats


    | Trend | Description |

    |---|---|

    | **Motivation** | The attack motivation is no longer for fame and notoriety.
    Motivation now includes insidious reasons such as for political and financial
    reasons aimed at economic espionage and money-making activities. |

    | **Targeted** | Attacks are now targeted with mutating and stealth features.
    |

    | **Application layer** | Threats are consistently focusing on the application
    layer such as known web vulnerabilities and looking for new web programming errors.
    |

    | **Social engineering** | Users are the weakest link, and social engineering
    sites are a huge source of information. Increasingly, attackers are not only trying
    to steal an identity, but also trying to assume the identity of the user. |

    | **Borderless** | Attackers are also targeting mobile platforms because data
    is in more places. You must now protect the device, protect the network, and protect
    the cloud. |'
  - '[PAGE 147]


    # Threat Control Guidelines


    General threat control guidelines include the following:


    +   - Policies and processes must change from a reactive process to a formal proactive
    process.

    +   - Mitigation technologies must be able to react to attacks with little or
    no human intervention.

    +   - End users must be made aware of threats and involved in mitigating them.


    # Threat Control Design Guidelines


    |  |  |

    | --- | --- |

    | **Formalize the process** | • Use a layered security approach.<br>• Consider
    risk management concepts.<br>• Apply policies for both the outside and inside
    networks.<br>• Maintain logging and monitoring functions. |

    | **Distributed security intelligence** | • Sensors should be embedded in network
    elements, operating systems, and applications.<br>• The network of sensors needs
    to be integrated and provide relevant and actionable dynamic security information.<br>•
    To provide a greater threat coverage, accuracy, and proactive protection, sensors
    in the field feed a central location that distributes the information to other
    sensors. |

    | **Security intelligence analysis** | • Security intelligence management (that
    is, event management and incident management) requires a central approach to analysis
    and correlation.<br>• Include correlation with third parties and external sources.<br>•
    This analysis should result in relevant threat information that should be automatically
    distributed to security devices and controls in a timely manner. |

    | **Incident response** | • Incident response should be automated and dynamic,
    providing the end user the means to respond and mitigate. |

    | **Application layer visibility** | • Application layer inspection is critical.<br>•
    Authenticate users and devices.<br>• Monitor and filter application data.<br>•
    Provide detailed logging. |'
