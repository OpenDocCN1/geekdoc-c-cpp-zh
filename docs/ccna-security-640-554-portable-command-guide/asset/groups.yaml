    # ## Standards, Guidelines, and Procedures


    Security policies establish a framework within which to work, but they are usually
    too general to be of much use to individuals responsible for implementing these
    policies.


    Therefore, more detailed documents exist, including the following:


    <table>

    <tr><td>Standards</td><td>Allow IT staff to be consistent by specifying the use
    of technologies. They are usually mandatory and help provide consistency, uniformity,
    and efficiency.</td></tr>

    <tr><td>Guidelines</td><td>These are best practices that provide a list of suggestions
    on how things can be done better. They are similar to standards, but are more
    flexible and are not usually mandatory.</td></tr>

    <tr><td>Procedures</td><td>Documents include the details of implementation, usually
    with step-by-step instructions and graphics.</td></tr>

    </table>


