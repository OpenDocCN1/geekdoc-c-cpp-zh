    \ 该命令的另外两种变体包括`class-map type inspect`命令（用于为应用检查流量定义特殊操作）和`class-map type regex`命令（与正则表达式一起使用，例如匹配特定的URL）。两者都不在本章的讨论范围内。\
    \ |\n\n**注意：** 名称class-default以及任何以_internal或_default开头的名称均为保留名称。\n\n通过匹配以下特征之一，定义要包含在类中的流量：\n\
    \n| 命令 | 描述 |\n|---|---|\n| `ciscoasa(config-cmap)# match any` | 匹配所有要对其应用操作的流量。\
    \ |\n| `ciscoasa(config-cmap)# match access-list acl-id` | 匹配由扩展ACL指定的数据包。<br><br>**注意：**\
    \ 其他匹配关键字包括dscp、flow、port、precedence、rtp和tunnel-group。这些都不在本章的讨论范围内。 |\n\n**注意：**\
    \ 可以使用description关键字为类映射添加说明。\n\n**注意：** 除非另有指定，否则在类映射中只能包含一条match命令。\n\n**注意：**\
    \ 要显示有关类映射配置的信息，请使用 show running-config class-map 命令。\n\n**注意：** 要删除所有类映射，请使用\
    \ clear configure class-map 命令。\n\n创建策略映射，以便为第3/4层类映射中配置的流量分配操作：\n\n| 命令 | 描述\
    \ |\n| --- | --- |\n| `ciscoasa(config)# policy-map`<br>`p-map-name` | 为此策略映射指定名称（长度最多40个字符）。<br><br>**注意：**\
    \ 该命令的另一种变体是`policy-map type inspect p-map-name`命令。该命令不在本章的讨论范围内。 |\n\n标识类映射：\n\
    \n| 命令 | 描述 |\n| --- | --- |\n| `ciscoasa(config-pmap)# class`<br>`class-map-name`\
    \ | 将类映射分配给策略映射，在该策略映射中可以为类映射流量分配操作，并进入配置策略映射类模式。<br><br>**注意：** 类名`class-default`是保留名称。\
    \ |\n\n**注意：** 可以使用`description`关键字为策略映射添加说明。\n\n分配以下操作之一：\n\n| 命令 | 描述 |\n| ---\
    \ | --- |\n| `ciscoasa(config-pmap-c)# set connection` | 配置连接参数。 |\n| `ciscoasa(config-pmap-c)#\
    \ police {input \\| output} rate-bps` | 对该类流量进行速率限制。 |\n| `ciscoasa(config-pmap-c)#\
    \ inspect protocol` | 配置协议检查服务。<br><br>**注意：** 有许多不同的协议关键字，包括`dns`、`ftp`、`http`、`icmp`、`ipv6`等。这些都不在本章的讨论范围内。\
    \ |\n\n**注意：** 其他可配置的策略映射操作（不在本章范围内）包括`priority`、`service-policy`、`shape`、`ips`、`flow-export`等。\n\
    \n服务策略可在所有接口上全局启用策略映射，也可在特定接口上启用：\n\n| 命令 | 描述 |\n| --- | --- |\n| `ciscoasa(config)#\
    \ service-policy`<br>`p-map-name {global \\| interface intf}` | 全局启用一组策略，或将其应用于某个接口。\
    \ |\n\n本章涵盖以下主题：\n\n- **远程访问VPN**\n  - 远程访问VPN的类型\n- **ASA SSL VPN**\n  - 使用ASDM的基于客户端的SSL\
    \ VPN示例\n  - 使用ASDM的无客户端SSL VPN示例\n\n## 远程访问VPN\n\n企业用户要求为他们的移动设备提供支持，包括智能手机、平板电脑、笔记本电脑，以及更广泛的笔记本电脑制造商和操作系统。\n\
    \n这种转变给IT安全带来了挑战。解决方案是使用安全套接字层（SSL）虚拟专用网络（VPN）来保护所有用户的安全访问，无论他们从哪个端点建立连接。\n\n\
    Cisco集成多业务路由器（ISR）和自适应安全设备（ASA）都提供IPsec和SSL VPN功能。但是，每台ASA最多可支持10,000个并发会话。在支持大型远程网络部署时，ASA通常是首选。\n\
