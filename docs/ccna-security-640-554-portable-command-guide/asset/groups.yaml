  mdcn: '

    ## IPv6 漏洞


    IPv6 的新漏洞包括以下内容：


    | 漏洞 | 详细信息 |

    |---|---|

    | **依赖组播和 ICMPv6** | • 组播便于侦察。（例如，FF02::1 表示所有主机，FF02::2 表示所有路由器。）<br>• ICMPv6
    是自动配置的载体，容易受到欺骗和多种攻击利用。 |

    | **报头扩展** | • 主机会处理路由报头（RH），这些报头可能被利用（例如，用于源路由和侦察的路由报头）。<br>• 目前已存在基于 RH 的放大攻击。
    |

    | **隧道** | • 将 IPv6 封装在 IPv4 之上会绕过防火墙和其他尚未准备好处理 IPv6 的检查系统。<br>• 大多数 IPv4/IPv6
    过渡机制没有内置身份验证。<br>• 双栈通常在主机上自动启用。 |

    | **DoS 放大攻击** | • 创建路由环路以消耗资源或放大发送给受害者的数据包，例如，攻击者通过伪造一个包含多条 A 到 B 语句的 RH 数据包，在两台路由器之间制造反馈环路。<br>•
    NDP 可用于放大网络扫描：使用 FF02 组播地址向局域网段中的所有主机发送 NS 消息。 |

    | **跳板攻击** | • 将前述多种技术连接起来。 |


    ## IPv6 安全策略


    IPv6 基本上是地址更大的 IPv4，在安全性方面，IPv4 和 IPv6 之间没有显著差异。在某些情况下，IPv6 略为更安全；在其他情况下，IPv6
    略为不安全。确实存在用于为 IPv6 流量实施安全策略的安全技术和设备，并且应当使用它们。


    网络和安全人员缺乏 IPv6 培训，这可能是运营中最大的威胁。


    ### 配置入口过滤


    | 过滤器 | 描述 |

    |---|---|

    | **拒绝 bogon 地址** | 过滤 bogon 地址，因为它们通常被发现是分布式 DoS（DDoS）攻击的源地址。术语 *bogon 地址* 指源
    IP 地址来自保留 IP 地址空间的流量，应由互联网服务提供商进行过滤。 |

    | **MAC 地址表攻击** | 根据作用域在外围过滤组播数据包。 |


    | 安全措施 | 描述 |

    |---|---|

    | **过滤传入流量** | 仅接收目的地址位于你从互联网服务提供商处分配的地址块内的数据包，以及目的地址为用于 NDP 的组播组地址或链路本地地址的数据包。
    |

    | **过滤 ICMPv6 消息** | 在外围对 ICMPv6 消息进行细粒度过滤。（请记住，NDP 等协议操作需要 ICMPv6。） |

    | **丢弃带有未知扩展报头的数据包** | 在外围以及整个网络内部丢弃 RH0 数据包和未知扩展报头。 |


    ### 保护过渡机制


    | 安全措施 | 描述 |

    |---|---|

    | **保护双栈** | 优先将双栈作为过渡机制，但应同等保护 IPv4 和 IPv6。 |

    | **实施 IPsec VPN 隧道** | 当使用隧道在公共网络上发送敏感流量时，应通过添加 IPsec 身份验证和机密性来保护隧道，这可以防止注入/嗅探攻击以及未经授权的访问。
    |

    | **除非有要求，否则不允许隧道穿过外围** | 在网络边缘终止隧道，不允许主机到主机隧道。 |


    ### 未来安全增强


    考虑当前和未来的安全增强措施：


    | 安全增强 | 描述 |

    |---|---|

    | **安全邻居发现（SeND）** | 将 NDP 与加密功能相结合。SeND 协议通过地址所有权证明、消息保护和路由器授权来增强 NDP。 |

    | **RA-Guard** | RA-Guard 阻止来自第 2 层端口的路由器通告和路由器重定向 ICMP 数据包。 |


    > **注意：** IPv6 安全现在将纳入其他章节。


    本章涵盖以下主题：


    ## 威胁


    - 信息安全威胁的趋势


    ## 威胁控制指南


    - 威胁控制设计指南


    ## 集成威胁控制策略


    - Cisco 安全智能运营


    ## 威胁


    从了解漏洞到发布利用程序的时间已经缩短。一些利用程序旨在几分钟内产生全球影响。一些利用程序还具有持久性，难以根除。


    ### 信息安全威胁的趋势


    | 趋势 | 描述 |

    |---|---|

    | **动机** | 攻击动机不再是为了出名和恶名。如今的动机包括阴险的原因，例如出于政治和财务目的，旨在进行经济间谍活动和牟利活动。 |

    | **针对性** | 攻击如今具有针对性，并带有变异和隐蔽特征。 |

    | **应用层** | 威胁持续聚焦于应用层，例如已知的 Web 漏洞，并寻找新的 Web 编程错误。 |

    | **社会工程** | 用户是最薄弱的环节，社会工程网站是巨大的信息来源。攻击者越来越多地不仅试图窃取身份，还试图冒用用户身份。 |

    | **无边界** | 攻击者还以移动平台为目标，因为数据分布在更多地方。你现在必须保护设备、保护网络并保护云。 |


    ## 威胁控制指南


    一般威胁控制指南包括以下内容：


    - 策略和流程必须从被动流程转变为正式主动流程。

    - 缓解技术必须能够在很少或没有人工干预的情况下对攻击做出反应。

    - 必须让最终用户意识到威胁，并让他们参与缓解威胁。


    ### 威胁控制设计指南


    |  |  |

    | --- | --- |

    | **将流程正规化** | • 使用分层安全方法。<br>• 考虑风险管理概念。<br>• 对外部网络和内部网络都应用策略。<br>• 维护日志记录和监控功能。
    |

    | **分布式安全智能** | • 传感器应嵌入网络元件、操作系统和应用程序中。<br>• 传感器网络需要集成，并提供相关且可操作的动态安全信息。<br>•
    为了提供更广泛的威胁覆盖范围、准确性和主动保护，现场传感器将信息馈送到一个中央位置，该位置再将信息分发到其他传感器。 |

    | **安全智能分析** | • 安全智能管理（即事件管理和事件处置管理）需要采用集中式方法进行分析和关联。<br>• 包括与第三方和外部来源的关联。<br>•
    这种分析应产生相关威胁信息，并应及时自动分发到安全设备和控制措施。 |

    | **事件响应** | • 事件响应应自动化且动态化，为最终用户提供响应和缓解的手段。 |

    | **应用层可见性** | • 应用层检查至关重要。<br>• 对用户和设备进行身份验证。<br>• 监控和过滤应用数据。<br>• 提供详细日志记录。
    |


    ## 集成威胁控制策略


    |  |  |

    | --- | --- |

    | **应用感知** | 实施应用检查机制，例如以下机制：<br>• 应用检查与控制（AIC）<br>• 模块化策略框架（MPF）<br>• 基于网络的应用程序识别（NBAR）<br>•
    灵活数据包匹配（FPM） |

    | **应用专用网关** | 实施面向特定应用流量检查和分析的网关，包括以下内容：<br>• Cisco IronPort Web 和电子邮件安全设备<br>•
    ScanSafe Web 安全技术 |

    | **集成威胁控制与遏制** | 使用集成部署选项，提供检测、缓解和响应威胁的多维方法，包括以下内容：<br>• 集成多业务路由器（ISR）<br>• Cisco
    自适应安全设备（ASA）<br>• 入侵防御系统（IPS）传感器 |

    | **Cisco 安全设备** | 提供多种形态的防火墙服务，包括以下内容：<br>• Cisco IOS 路由器<br>• Cisco ASA<br>•
    添加到 Catalyst 6500 交换机的网络模块 |

    | **Cisco IPS** | 提供多种形态的威胁控制机制，包括以下内容：<br>• Cisco IOS IPS（有限版本）<br>• 专用设备（Cisco
    4200）<br>• Cisco ASA 5500 系列、ISR G2 和添加到 Catalyst 6500 的网络模块 |

    | **安全管理** | 使用以下安全管理工具提供全面的事件管理方法：<br>• Cisco Configuration Professional（CCP）<br>•
    Cisco IPS Device Manager（IDM）<br>• Cisco Security Manager（CSM） |

    '
