    > **NOTE:** The focus of this chapter will be on ZFW.


    # Cisco IOS Zone-Based Policy Firewall


    A ZFW assigns interfaces to zones. An inspection policy is applied to traffic
    moving between the zones using the Cisco Common Classification Policy Language
    (C3PL). Zones establish the security borders where traffic is subjected to policy
    restrictions as it crosses to another region of your network.


    > **NOTE:** The C3PL structure is similar to the modular quality of service (QoS)
    CLI (MQC) structure.


    # Cisco Common Classification Policy Language


    To create firewall policies, complete the following tasks:


    | Task | Specifics |

    |---|---|

    | **Define match criteria (class map).** | Contains multiple match statements
    to filter traffic based on an access group (ACL), Layer 4 protocol (for example,
    TCP, UDP, and ICMP), Layer 7 protocol (HTTP, SMTP, FTP), or another nested class
    map. |

    | **Associate actions to the match criteria (policy map).** | Contains class maps
    that are evaluated in order of configuration and assigned actions of inspect,
    permit, drop, or drop and log. All unclassified traffic matches the default class,
    known as class-default, with a default action to drop traffic. |

    | **Attach the policy map to a zone pair (service policy).** | Identify the source
    and destination zone pair and assign a service policy to it. |


    # ZFW Design Considerations


    +   - The default policy between zones is to deny all.

    +   - Interfaces belonging to the same zone permit access between them.

    +   - A zone pair permits a unidirectional firewall policy between a source and
    destination zone.

    +   - An interface can be assigned to one zone only.

    +   - An interface pair can be assigned only one policy.

    +   - A self zone is a system-defined zone that does not have any interfaces as
    members and applies to traffic destined to the router or traffic that is generated
    by the router.'
  - '[PAGE 176]


    # Default Policies, Traffic Flows, and Zone Interaction


    The following rules govern interface behavior for the traffic moving between zone
    member interfaces:


    +   - A zone must be configured before you can assign interfaces to the zone.

    +   - You can assign an interface to only one security zone.

    +   - Traffic is implicitly allowed to flow by default among interfaces that are
    members of the same zone.

    +   - To permit traffic to and from a zone member interface, a policy allowing
    or inspecting traffic must be configured between that zone and any other zone.

    +   - Traffic cannot flow between a zone member interface and any interface that
    is not a zone member. You can apply **pass**, **inspect**, and **drop** actions
    only between two zones.

    +   - Interfaces that have not been assigned to a zone function as classical router
    ports and might still use classical stateful inspection (CBAC) configuration.

    +   - If you do not want an interface to be part of the ZFW, assign it to a “pass
    all” policy between it and any other target zone.


    **NOTE:** All active interfaces should be a member of a zone.


    The following rules govern interface behavior when the self zone (that is, to/from
    the router) is involved in the traffic flow:


    +   - All traffic to and from a given interface is implicitly blocked when the
    interface is assigned to a zone, except traffic to or from other interfaces in
    the same zone and traffic to any interface on the router.

    +   - All the IP interfaces on the router are automatically made part of the self
    zone when a ZFW is configured. The self zone is the only exception to the default
    deny-all policy. All traffic to any router interface is allowed until traffic
    is explicitly denied.

    +   - The only exception to the deny-by-default approach is the traffic to and
    from the router itself. This traffic is permitted by default. You can configure
    an explicit policy to restrict such traffic.


    **NOTE:** Interface ACLs are still relevant and are applied before a ZFW when
    they are applied inbound. Interface ACLs are applied after a ZFW when they are
    applied outbound.


    # Configuring an IOS ZFW


    To configure basic interzone policies using the IOS command-line interface (CLI),
    follow these steps:


    +   1. Create security zones.

    +   2. Create a Layer 3/4 or Layer 7 class map and match traffic.'
  - '[PAGE 177]


    +   3. Create the policy map, identify the class map, and associate an action.

    +   4. Identify zone pairs and assign a service policy.

    +   5. Assign interfaces to zones.


    > **NOTE:** LAN and WAN configurations must be completed before configuring the
    ZFW.


    # Create the security zones:


    | Command | Description |

    |---|---|

    | `Router(config)#zone security zone-name` | Create a security zone. |


    # Create a Layer 3 and Layer 4 inspection type class map:


    | Command | Description |

    |---|---|

    | `Router(config)#class-map type inspect {match-any \| match-all} class-map-name`
    | Creates a Layer 3 and Layer 4 inspect type class map. |

    | `Router(config-cmap)#match access-group {access-group \| name access-group-name}`
    | Configure the match criteria on the basis of a preconfigured ACL. |

    | `Router(config-cmap)#match protocol protocol` | Configure the match criteria
    on the basis of a specified protocol. |

    | `Router(config-cmap)#match service {any \| text-chat}` | Configure the match
    criteria for any supported instant messenger protocol. |

    | `Router(config-cmap)#match class-map class-map-name` | Nest traffic classes
    within one another. |


    > **NOTE:** You can also use the description command to document the zone.


    # (Optionally) Create a Layer 7 inspect type class map:


    | Command | Description |

    |---|---|

    | `Router(config)#class-map type inspect protocol-name {match-any \| match-all}
    class-map-name` | Create a Layer 7 (application-specific) inspect type class map.
    **NOTE:** Command parameters will vary depending on the protocol. |

    | `Router(config-cmap)#match protocol-parameters` | **NOTE:** The match parameters
    will vary depending on the protocol. |'
