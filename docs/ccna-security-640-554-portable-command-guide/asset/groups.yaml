    # # Planning a Secure Management and Reporting Strategy


    Small networks are relatively easy to manage and monitor. However, device management
    and monitoring can be challenging on a large network, especially considering the
    number of infrastructure devices generating syslog data.


    You must decide whether the network management data flows over an in-band (over
    the production network) or out-of-band (over a separate network) network.


    Consider the following in-band management guidelines:


    +   - Typically appropriate for smaller networks.

    +   - Network information flows over a production network.

    +   - Apply only to devices that need to be managed or monitored.

    +   - Use secure protocols such as IPsec, Secure Shell (SSH), or Secure Sockets
    Layer (SSL) when possible.

    +   - Decide whether the management channel needs to be open at all times.


    Consider the following out-of-band (OOB) management guidelines:


    +   - Typically implemented in larger networks.

    +   - Network information does not flow over the production network.

    +   - Provides the highest level of security.

    +   - Eliminates the risk of passing unsecure management protocols over the production
    network.


    **NOTE:** Regardless of which network management method you choose, you must secure
    the management plane.


    **NOTE:** You can implement both in-band and OOB simultaneously.


    # ## Securing the Management Plane


    Securing the management plane includes the following:


    +   - Enforcing a secure password policy

    +   - Securing console, vty, and auxiliary lines

    +   - Securing and archiving configurations

    +   - Enabling logging to record changes in real time, on demand, and scheduled
    reports

    +   - Using Network Time Protocol (NTP) to keep clocks synchronized because it
    can identify the order in which a specified attack occurred'
  - '[PAGE 74]


    +   - Choosing appropriate logging levels for each device while ensuring that
    the right data is being captured

    +   - Implementing a change management policy


    **NOTE:** The focus of this chapter is on securing the management plane.


    # Securing Passwords


    Keep the following in mind when enforcing a password policy:


    +   - Change passwords often.

    +   - Include alphanumeric characters, uppercase and lowercase characters, symbols,
    and spaces.

    +   - Password-leading spaces are ignored; all spaces after the first character
    are not ignored.

    +   - Do not use dictionary words.

    +   - Encrypt all passwords.

    +   - Passwords should have a minimum of 10 characters.


    | Command | Description |

    |---|---|

    | `Router(config)#service password-encryption` | Encrypt all plaintext passwords
    to level 7. |

    | `Router(config)#security passwords min-length length` | Enforce a minimum password
    length for all new passwords. Existing passwords are not affected. Length can
    be from 1 to 16. Ten characters or more are recommended. |

    | `Router(config)#enable secret password` | Encrypt the privileged EXEC mode (enable)
    password using message digest 5 (MD5) algorithm. |


    # Securing the Console Line and Disabling the Auxiliary Line


    | Command | Description |

    |---|---|

    | `Router(config)#username name privilege level secret password` | Create a local
    user database entry and encrypt the password. **TIP:** Always create the local
    user database accounts before enabling authentication. |

    | `Router(config)#line console 0`<br>`Router(config-line)#login local` | Enter
    line console config mode. Authenticate using the local database. This method is
    stronger than using the password and login combination because it requires a username.
    |'
