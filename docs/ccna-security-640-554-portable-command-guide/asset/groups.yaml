  - '[PAGE 113]


    # AAA Authorization


    Authorization policies set parameters that restrict administrative EXEC access
    to the routers or user access to the network.


    **NOTE** Authorization and accounting rules follow a similar approach using method
    lists to define the location of the authorization permissions and the accounting
    logs.


    ```

    Router(config)#aaa authorization {exec

    | network | commands level | default |

    list-name} {method1 [method2 ...]}

    ```


    Defines the authorization policy to use when accessing lines.


    +   - **exec** is used to authorize whether the user is allowed to run an EXEC
    shell.

    +   - **network** is used to authorize network-related service requests, such
    as PPP.

    +   - **command** is used to implement authorization for all commands for a specific
    privilege level.


    # Configuring AAA Authorization Example


    ```

    R1(config)#aaa authorization

    exec default group tacacs+

    ```


    EXEC command authorization will be provided by the TACACS+ server.


    # Configuring AAA Authorization Using CCP


