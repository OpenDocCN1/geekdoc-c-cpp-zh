    # Historical Cryptographic Ciphers


    Cryptography uses ciphers to secure data. A cipher is an algorithm for performing
    encryption and decryption using a series of well-defined steps that are followed
    as a procedure. Ciphers are commonly classified as transposition or substitution
    based.


    In transposition-based ciphers, characters are “permuted” or rearranged. A simple
    example is encrypting HELLO by reversing the letters to produce OLLEH. Other examples
    include the Scytale, Rail Fence, and Grilles ciphers.


    > **NOTE:** Some modern algorithms, such as the Data Encryption Standard (DES)
    and the Triple Data Encryption Standard (3DES), still use transposition as part
    of the algorithm.


    Substitution ciphers include the following:


    | Type | Characteristics / Examples |

    |---|---|

    | **Substitution (monoalphabetic)** | ▪ Substitute one character for another (for
    example, A=C, B=D, C=E).<br>▪ Examples: Caesar cipher, Affine cipher, Atbash cipher.
    |

    | **Polyalphabetic** | ▪ Based on substitution, using multiple substitution alphabets.<br>▪
    Examples: Vigenère cipher, Autokey cipher. |

    | **One-time pads** | ▪ A substitution cipher that combines the text letter with
    a special key material character.<br>▪ For example, the Vernam cipher key must
    be random, as long as the data can only be used once.<br>▪ Key distribution is
    challenging because the source and destination must have the same key.<br>▪ One-time
    pads are no longer practical, but the concept still applies in modern encryption
    algorithms such as DES and AES. |


    > **NOTE:** Another type of substitution ciphers is the polygraphic cipher (for
    example, Playfair cipher).'
