  mdcn: "\n| 组件 | 描述 |\n|---|---|\n| **无边界互联网** | 通过由企业和云提供商管理的第2层至第7层扫描引擎实现。扫描引擎承担防火墙、入侵检测/防御系统（IDS/IPS）、网络代理和Web网关的角色。\
    \ |\n| **无边界数据中心** | 在现有基础设施组件之上叠加虚拟化组件，为云提供安全解决方案。 |\n| **策略管理层** | 安全策略在中央位置进行管理，然后基于特定于上下文的变量在整个网络中强制执行。它提供以下功能：<br><br>▪\
    \ 访问策略（谁、什么、何时、何地以及如何）<br>▪ 动态遏制策略<br>▪ 本地和外部策略 |\n\n## 无边界安全产品\n\n无边界网络架构中的安全架构方法产生了多个不同的Cisco产品、技术和解决方案类别：\n\
    \n- SecureX与上下文感知安全\n- 威胁控制与遏制\n- 云安全与数据丢失防护\n- 通过VPN实现的安全连接\n- 安全管理\n\n## Cisco\
    \ SecureX 架构与上下文感知安全\n\n为了应对当今无边界网络环境不断变化的安全需求，Cisco开发了SecureX架构。这是一种新的上下文感知安全架构，在整个分布式网络中强制执行安全策略，而不仅仅是在数据流中的单一点。\n\
    \n该架构首先奠定了坚实的网络技术基础，确保网络基础设施不会以任何方式受到损害。它以设备、模块或云服务的形式在顶层构建安全执行元素。该架构能够处理各种设备，从传统的企业PC或Mac，一直到下一代移动设备，如iPad、Android或Cisco\
    \ Cius。借助Cisco AnyConnect，通过将这些众多设备在最优点连接到安全基础设施并无缝附加，从而在网络中强制执行安全。\n\n3. TrustSec还可以通过使用MACSec提供数据机密性。例如，如果策略要求保护数据安全，Cisco\
    \ TrustSec会理解该策略并动态加密用户数据。\n\n## Cisco AnyConnect\n\nCisco AnyConnect通过使用SSL或IP安全（IPSec）虚拟专用网络（VPN）保护基于PC或智能手机平台的移动员工，为最终用户提供更无缝、始终在线、始终受保护的体验，同时使IT管理员能够通过基于云或混合Web安全来强制执行策略并阻止恶意软件。\n\
    \nCisco AnyConnect提供以下功能：\n\n- 无论设备类型如何，均提供设备支持（例如PC、笔记本电脑、智能手机、平板电脑或PDA）\n- 通过在一个客户端应用程序中组合多种安全控件，提供多功能安全性\n\
    - 通过提供始终在线的智能连接，实现无缝体验和性能，保持一致体验\n\n## Cisco 安全智能运营\n\nCisco安全智能运营（SIO）是一个安全智能中心，它为当前全球威胁状况设定基线，并为网络提供有价值的信息，以检测、预防和响应威胁。它通过关联来自SensorBase的威胁信息来充当早期预警系统，并由威胁运营中心进行分析。然后，这些信息被提供给Cisco自适应安全设备（ASA）、集成服务路由器（ISR）和IPS设备等执行设备，用于实时威胁防御。\n\
    \n## 威胁控制与遏制\n\nCisco威胁控制与遏制解决方案可规范网络访问、隔离受感染系统、防止入侵并保护关键业务资产。该解决方案可在恶意流量影响业务之前将其阻止。\n\
    \n威胁防御产品包括以下内容：\n\n| 产品 | 描述 |\n|---|---|\n| Cisco ASA | 自适应安全设备提供经过验证的防火墙服务以及VPN和IPS技术的集成。\
    \ |\n| Cisco ISR | 集成服务路由器使用基于区域的策略防火墙（ZPF）、IOS IPS和VPN技术提供网络安全控制。 |\n| Cisco\
    \ IPS | 通过专用设备提供入侵防御，或集成到ASA和ISR设备中。这些IPS传感器支持多种IPS技术，包括基于签名、基于异常、基于策略和基于信誉的技术。\
    \ |\n\n## 云安全与数据丢失防护\n\n许多现代网络设计现在都融入了云计算，这增加了网络安全的复杂性。云计算中的威胁包括以下内容：\n\n- 滥用云计算\n\
    - 帐户或服务劫持\n- 云中的数据丢失\n- 不安全的接口和应用程序编程接口（API）\n- 恶意内部人员\n\n管理员最终要对存储在其无法控制的网络上的数据负责，因此还必须考虑云环境若未得到妥善保护可能产生的后果。\n\
    \n现在必须在云中保护以下两项传统关键服务：\n\n| 服务 | 描述 |\n|---|---|\n| 保护Web访问 | Cisco ScanSafe Web\
    \ Security是一种基于云的解决方案，它分析每个Web请求，以根据定义的安全策略确定内容是恶意的、不适当的还是可接受的。 |\n|  | Cisco\
    \ IronPort Web Security集成了Web使用控制、数据安全以及信誉和恶意软件过滤。它应用Cisco SIO和全球威胁技术，通过分层安全技术对抗复杂的基于Web的威胁，并支持内置管理以提供威胁相关活动的可见性。\
    \ |\n| 保护电子邮件访问 | Cisco IronPort Email Security提供垃圾邮件防护、数据丢失防护、病毒防御和电子邮件加密。它还有助于最大限度地减少停机时间，简化企业电子邮件系统管理，同时提供对邮件系统操作的洞察。\
    \ |\n\n### 通过VPN实现安全连接\n\n有两种基于VPN的解决方案可实现安全连接：\n\n| 解决方案 | 描述 |\n|---|---|\n\
    | **用于远程访问的安全通信** | 通过在远程主机和中心站点之间建立SSL或IPSec VPN隧道，提供对企业网络和应用程序的安全可定制访问 |\n|\
    \ **用于站点到站点的安全通信** | 在两个或多个站点之间提供安全的站点到站点IPSec VPN访问 |\n\n### 安全管理\n\nCisco网络管理系统有助于自动化、简化和集成网络，以降低运营成本；提高生产力；并实现可用性、响应性、弹性和安全性等关键功能。\n\
    \n可用于安全管理的工具层次结构如下：\n\n| 工具 | 描述 |\n|---|---|\n| **设备管理器** | Web界面工具，简化单台设备的配置和监控。\
    \ |\n| **Cisco Configuration Professional (CCP)** | 基于GUI的ISR设备管理工具。它简化了LAN/WAN接口、路由、防火墙设置、IPS、VPN和统一通信的配置、监控和故障排除。\
    \ |\n| **Cisco ASA Security Device Manager (ASDM)** | 基于GUI的ASA设备管理工具，提供与CCP中类似的功能。\
    \ |\n| **Cisco Security Manager** | 一种企业级应用程序解决方案，用于配置和管理数千个防火墙、路由器、交换机、IPS传感器和其他安全解决方案。通过智能的基于策略的管理技术提供可扩展性，简化管理。\
    \ |\n\n本章涵盖以下主题：\n\n- **针对网络基础设施的威胁**\n- **Cisco网络基础保护框架**\n- **控制平面安全**\n  -\
    \ 控制平面监管\n- **管理平面安全**\n  - 基于角色的访问控制\n  - 安全管理和报告\n- **数据平面安全**\n  - ACL\n  -\
    \ 反欺骗\n  - 第2层数据平面保护\n\n## 针对网络基础设施的威胁\n\n针对网络基础设施的常见漏洞和威胁包括以下内容：\n\n| 类别 | 项目\
    \ |\n|---|---|\n| **漏洞** | 设计错误<br>协议弱点<br>软件漏洞<br>设备配置错误 |\n| **威胁** | 信任利用<br>登录、身份验证和密码攻击<br>路由协议漏洞利用<br>欺骗<br>拒绝服务（DoS）<br>机密性和完整性攻击\
    \ |\n\n"
