  - '[PAGE 154]


    # Configuring a Numbered Extended ACL Example


    Figure 11-1 displays the network topology for the numbered extended ACL example.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_154_0.png)


    **Figure 11-1** Network Topology for Numbered Extended ACL Example


    | Command | Description |

    |---|---|

    | `R1(config)#access-list 100` | Define extended ACL 100. |

    | `R1(config)#access-list 100 remark Basic anti-spoofing ACL` | Document the purpose
    of the ACL. |

    | `R1(config)#access-list 100 deny ip 209.165.200.224 0.0.0.31 any` | Deny incoming
    traffic with the source address the same as the internal subnet. |

    | `R1(config)#access-list 100 permit ip any host 209.165.200.254 eq 80` | Permit
    HTTP web traffic to reach the server. |

    | `R1(config)#interface serial 0/0/0` | Enter interface configuration mode for
    the serial interface. |

    | `R1(config-if)#ip access-group 100 in` | Apply ACL 100 incoming on the outside
    serial interface. |


    # Filtering with Named Extended ACLs


    | Command | Description |

    |---|---|

    | `Router(config)#ip access-list extended {access-list-number \| access-list-name}`
    | Define a named ACL. The command can also be used to edit a numbered ACL. |

    | `Router(config-ext-nacl)#permit protocol source source-wildcard [operator port]
    destination destination-wildcard [operator port] [established] [log]` | Define
    the permit statement. |

    | `Router(config-ext-nacl)#deny protocol source source-wildcard [operator port]
    destination destination-wildcard [operator port] [log]` | Define the deny statement.
    **NOTE** Parameters will vary depending on the ACL protocol being configured.
    |

    | `Router(config)#interface type number` | Specify the interface type and number
    and enter interface configuration mode. |

    | `Router(config-if)#ip access-group access-list-name {in \| out}` | Apply the
    specified ACL to the interface. |'
  - '[PAGE 155]


    # ## Configuring a Named Extended ACL Example


    | Command | Description |

    | --- | --- |

    | `R1(config)#ip access-list extended ACL-IN` | Define an extended ACL named ACL-IN.
    |

    | `R1(config-ext-nacl)#remark Basic anti-spoofing ACL` | Document the ACL. |

    | `R1(config-ext-nacl)#permit ip 209.165.200.224 0.0.0.31 any eq 80` | Permit
    HTTP web traffic to reach the server. |

    | `R1(config-ext-nacl)#permit ip any host 209.165.200.254` | Permit traffic to
    reach the server. |

    | `R1(config-ext-nacl)#interface serial 0/0/0` | Apply ACL-IN to the serial interface.
    |

    | `R1(config-if)#ip access-group ACL-IN in` | Apply the ACL incoming on the outside
    interface. |


    **NOTE:** To verify the ACLs, use the show access-lists, show ip access-lists,
    and show ip interfaces commands.


    **TIP:** Append the log keyword at the end of an ACE to generate a system message
    (106100) every time a flow meets the ACE criteria. Display the number of hits
    using the show access-lists or show ip access-lists command.


    # ## Configuring an Extended ACL Using CCP Example


    In Cisco Configuration Professional (CCP), rules define how the router will respond
    to a particular kind of traffic. There are various types of rules, such as access
    rules, Network Address Translation (NAT) rules, IPsec rules, default rules, external
    rules, and rules with syntax that CCP does not support, called unsupported rules.
    ACLs are used to help define and enforce rules.


    ACLs can be used to classify traffic. This chapter focuses on ACLs applied to
    interfaces for filtering purposes.


    Use the ACL Editor screen to create, edit, or delete rules.


    Choose Configure > Router > ACL > ACL Editor to display the ACL Editor screen
    shown in Figure 11-2.'
  - '[PAGE 156]


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_156_0.png)


    **Figure 11-2** ACL Editor Screen


    The ACL Editor is most commonly used to define the traffic that you want to permit
    or deny entry to your LAN or exit from your LAN. The upper portion of the screen
    lists the access rules that have been configured on this router. The lower portion
    of the window lists the rule entries associated with the selected rule. A rule
    entry consists of criteria that incoming or outgoing traffic is compared against
    and the action to take on traffic matching the criteria. If traffic does not match
    the criteria of any of the entries in this box, it is dropped.


    To add a new access rule, click *Add*.


    The Add a Rule dialog appears, as shown on the left side in Figure 11-3.'
