    # # Building a Security Strategy for Borderless Networks


    The chapter covers the following topics:


    +   - **Cisco Borderless Network Architecture**

    +       - Borderless Security Products

    +   - **Cisco SecureX Architecture and Context-Aware Security**

    +       - Cisco TrustSec

    +       - TrustSec Confidentiality

    +       - Cisco AnyConnect

    +       - Cisco Security Intelligence Operations

    +   - **Threat Control and Containment**

    +   - **Cloud Security and Data-Loss Prevention**

    +   - **Secure Connectivity Through VPNs**

    +   - **Security Management**


    # ## Cisco Borderless Network Architecture


    Traditional approaches to network security used well-defined borders to protect
    inside networks from outside threats and malware. Employees used corporate computers
    secured with antivirus and personal firewalls. Perimeter-based networks were protected
    using network-scanning devices (firewalls, web proxies, and email gateways).


    Today, network borders are dissolving as users want to access to resources from
    any locations, on any type of endpoint devices, using various connectivity methods.
    Cisco has addressed this with the Borderless Network Architecture, which integrates
    the following components:


    | | |

    |---|---|

    | **Borderless end zone** | The zone offers deployment flexibility and strong
    security services in multiple dimensions as users connect to the network. End-user
    access is based on the security posture of the connecting endpoint using the Cisco
    AnyConnect SSL VPN Client. Infrastructure protection is provided using firewalls,
    intrusion prevention systems (IPSs), web security, and email security. |'
