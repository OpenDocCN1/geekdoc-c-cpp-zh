    The Authentication Methods window opens, as shown in Figure 22-9.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_343_1.png)


    Figure 22-9  Authentication Methods Window


    You can add the location of the AAA authentication server.


    Click **New** to enter the location of the AAA server. If a server is not identified,
    the local database is used.


    To add a new user, enter the username and password and then click **Add**.


    Click **Next** to continue.


    The Client Address Assignment window opens, as shown in Figure 22-10.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_344_0.png)


    **Figure 22-10**  Client Address Assignment Window


    Create a new pool of private inside addresses that the remote users will be assigned
    once authenticated.


    The IP address pool configuration is required for successful client-based SSL
    VPN connectivity. Without an available IP address pool, the connection to the
    security appliance will fail.


    You can choose a preconfigured IP address pool from the Address Pool drop-down
    menu. Otherwise, click **New** to create a new one.


    Click **Next** to continue and display the Network Name Resolution Servers window,
    as shown in Figure 22-11.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_345_0.png)


    Figure 22-11  Network Name Resolution Servers Window


    Enter the Domain Name System (DNS)-related information.


    Click Next to continue.


    The NAT Exempt window opens, as shown in Figure 22-12.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_345_1.png)


    Figure 22-12  NAT Exempt Window


    If Network Address Translation (NAT) is configured on the ASA, a NAT exemption
    rule must be created for the configured IP address pool. Like IPSec, SSL client
    address pools must be exempt from the NAT process because NAT translation occurs
    before encryption functions.


    Check the **Exempt VPN Traffic from Network Address Translation** check box, and
    then click **Next**.


    Click **Next** and an information screen on how to launch AnyConnect will open.


    Click **Next** again and the VPN Wizard displays a summary of the configured selection,
    as shown in Figure 22-13.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_346_0.png)


    **Figure 22-13**  Summary of the Client Images


    Review the information displayed. If correct, click **Finish**. Otherwise, click
    **Back** and correct the misconfiguration.


    The configuration is then committed to the ASA, and the AnyConnect Connection
    Profiles screen opens, as in Figure 22-14.


    Use the VPN Wizard by choosing **Wizards > VPN Wizards > Clientless SSL VPN Wizard**.
    The Clientless SSL VPN Connection window opens, as shown in Figure 22-15. Click
    **Next** to continue.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_348_0.png)


    Figure 22-15  Clientless SSL VPN Connection Introduction Window


    The SSL VPN Interface window appears, as shown in Figure 22-16.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_348_1.png)


    Figure 22-16  SSL VPN Interface Window


    Configure a connection profile name for the connection and identify the interface
    to which outside users will connect.


    > **NOTE:** By default, the ASA uses a self-signed certificate to send to the
    client for authentication. Optionally, you may configure the ASA to use a third-party
    certificate to connect clients.


    > **NOTE:** The SSL VPN interface screen provides links in the information section.
    These links identify the URLs that need to be used for the SSL VPN service access
    (login) and for Cisco ASDM access (to access the Cisco ASDM software download).


    Click Next to continue and display the User Authentication window, as shown in
    Figure 22-17.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_349_0.png)


    Figure 22-17 User Authentication Window


    Identify how remote users will authenticate. You can configure authentication
    using a AAA server by checking the radio button. Click New to enter the location
    of the AAA server.


    Alternatively, the local database can be used. To add a new user, enter the username
    and password and then click Add.


    Once complete, click Next to continue and open the Group Policy window, as shown
    in Figure 22-18.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_350_0.png)


    **Figure 22-18**  Group Policy Window


    Identify a group policy that will be associated with the authenticated remote
    user.


    **NOTE:** If you are configuring a new policy, the policy name cannot contain
    any spaces.


    By default, the created user group policy inherits its settings from the DfltGrpPolicy.


    **NOTE:** You may modify these settings after the wizard has been completed by
    navigating to the **Configuration > Remote Access VPN > Clientless SSL VPN Access
    > Group Policies**.


    Click Next to continue.


    The Bookmark List window appears, as shown in Figure 22-19. A bookmark list is
    a set of URLs that is configured to be used in the clientless SSL VPN web portal.
    If bookmarks are already listed, use the Bookmark List drop-down menu, choose
    the bookmark you want, and click Next to continue with the SSL VPN Wizard.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_351_0.png)


    **Figure 22-19**  Bookmark List Window


    To add bookmarks, click **Manage** and then **Add** to open the Add Bookmark List
    dialog shown in Figure 22-20.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_351_1.png)


    **Figure 22-20**  Add Bookmark List Dialog


    Click **Add** again to open the Add Bookmark dialog shown in Figure 22-21.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_352_0.png)


    Figure 22-21  Add Bookmark Dialog


    Add the bookmark and URL and keep clicking OK until you return to the Bookmark
    List window.


    Click Next to continue. The Summary screen will open.


    Review the information displayed. If correct, click Finish. Otherwise, click Back
    and correct the misconfiguration.


    The configuration is then committed to the ASA, and the AnyConnect Connection
    Profiles screen opens.


    To verify the configuration, open (from a remote host) a Web browser and enter
    the login URL for the SSL VPN into the Address field.


    The ASA SSL VPN web page will open listing the various bookmarks previously assigned
    to the profile.


    > **NOTE:** The browser URL must use Hypertext Transfer Protocol Secure (HTTPS)
    to connect to the SSL VPN.


