    \ **下一步**。\n- 7. 摘要屏幕现在显示将更改哪些服务。单击 **完成**。\n- 8. 最后，将配置下发到设备窗口列出将发送到路由器的命令。单击\
    \ **下发** 以应用更改。\n\n### CCP 一键锁定\n\n一键锁定选项根据 Cisco 推荐的最佳实践测试路由器配置，以确定是否存在可能的安全问题，并自动进行必要的配置更改以纠正发现的问题。更改会自动进行，不会提示用户选择要修复的组件。\n\
    \n本章涵盖以下主题：\n\n- **规划安全管理与报告策略**\n- **保护管理平面**\n  - 保护密码\n  - 保护控制台线路并禁用辅助线路\n\
    \  - 使用 SSH 保护 VTY 访问\n  - 使用 SSH 保护 VTY 访问示例\n  - 使用 CCP 通过 SSH 保护 VTY 访问示例\n\
    \  - 保护配置文件和 IOS 文件\n  - 恢复启动集文件\n- **在 Cisco 路由器上实施基于角色的访问控制**\n  - 配置权限级别\n\
    \  - 配置权限级别示例\n  - 通过 CLI 配置 RBAC\n  - 配置 RBAC CLI 示例\n  - 配置超级视图\n  - 配置超级视图示例\n\
    \  - 使用 CCP 配置 RBAC 示例\n- **网络监控**\n  - 配置网络时间协议主时钟\n  - 配置 NTP 客户端\n  - 配置 NTP\
    \ 主时钟和客户端示例\n  - 使用 CCP 配置 NTP 客户端示例\n  - 配置 Syslog\n  - 配置 Syslog 示例\n  - 使用\
    \ CCP 配置 Syslog 示例\n  - 配置 SNMP\n  - 使用 CCP 配置 SNMP 示例\n\n## 规划安全管理与报告策略\n\n小型网络相对容易管理和监控。但是，在大型网络上，设备管理和监控可能颇具挑战性，尤其是考虑到生成\
    \ syslog 数据的基础设施设备数量。\n\n您必须决定网络管理数据是通过带内（通过生产网络）还是带外（通过单独网络）网络传输。\n\n考虑以下带内管理准则：\n\
    \n- 通常适用于较小的网络。\n- 网络信息通过生产网络传输。\n- 仅适用于需要管理或监控的设备。\n- 尽可能使用 IPsec、安全外壳 (SSH)\
    \ 或安全套接字层 (SSL) 等安全协议。\n- 确定管理通道是否需要始终保持开放。\n\n考虑以下带外 (OOB) 管理准则：\n\n- 通常在较大型网络中实施。\n\
    - 网络信息不通过生产网络传输。\n- 提供最高级别的安全性。\n- 消除在生产网络上传输不安全管理协议的风险。\n\n**注意：** 无论选择哪种网络管理方法，都必须保护管理平面。\n\
    \n**注意：** 可以同时实施带内和带外管理。\n\n## 保护管理平面\n\n保护管理平面包括以下内容：\n\n- 实施安全的密码策略\n- 保护控制台、vty\
    \ 和辅助线路\n- 保护和归档配置\n- 启用日志记录，以实时、按需和按计划报告记录更改\n- 使用网络时间协议 (NTP) 保持时钟同步，因为它可以识别特定攻击发生的顺序\n\
    - 为每台设备选择适当的日志记录级别，同时确保捕获正确的数据\n- 实施变更管理策略\n\n**注意：** 本章重点介绍保护管理平面。\n\n### 保护密码\n\
    \n实施密码策略时，请牢记以下事项：\n\n- 经常更改密码。\n- 包含字母数字字符、大写和小写字符、符号和空格。\n- 密码中的前导空格会被忽略；第一个字符之后的所有空格不会被忽略。\n\
    - 不要使用字典单词。\n- 加密所有密码。\n- 密码应至少包含 10 个字符。\n\n| 命令 | 描述 |\n|---|---|\n| `Router(config)#service\
    \ password-encryption` | 将所有明文密码加密为类型 7。 |\n| `Router(config)#security passwords\
    \ min-length length` | 对所有新密码强制实施最小密码长度。现有密码不受影响。长度可以是 1 到 16。建议使用十个或更多字符。 |\n\
    | `Router(config)#enable secret password` | 使用消息摘要 5 (MD5) 算法加密特权 EXEC 模式（enable）密码。\
    \ |\n\n### 保护控制台线路并禁用辅助线路\n\n| 命令 | 描述 |\n|---|---|\n| `Router(config)#username\
    \ name privilege level secret password` | 创建本地用户数据库条目并加密密码。**提示：** 在启用身份验证之前，请始终创建本地用户数据库账户。\
    \ |\n| `Router(config)#line console 0`<br>`Router(config-line)#login local` |\
    \ 进入线路控制台配置模式。使用本地数据库进行身份验证。此方法比使用密码和登录组合更强大，因为它需要用户名。 |\n\n"
