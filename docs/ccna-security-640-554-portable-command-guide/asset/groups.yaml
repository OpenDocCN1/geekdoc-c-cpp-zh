    # Quantitative Risk Analysis Formula


    Risk management is based on its building blocks of assets and vulnerabilities,
    threats, and countermeasures. Quantitative analysis relies on specific formulas
    to determine the value of the risk decision variables. Figure 2-1 displays the
    quantitative risk analysis formula.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_33_0.png)


    **Figure 2-1**  Quantitative Risk Analysis Formula


    Quantitative risk analysis terms include the following:


    | Term | Description |

    |---|---|

    | **Asset value (AV)** | This estimated value includes the purchase price, the
    cost of deployment, and the cost of maintenance. |

    | **Exposure factor (EF)** | This estimates the degree of destruction that may
    occur. It is represented as a percentage that a realized threat could have on
    an asset. |

    | **Single loss expectancy (SLE)** | This calculation represents the expected
    loss from a single occurrence of the threat. The SLE is defined as the AV × EF.
    |'
  - '[PAGE 34]


    | Term | Description |

    |---|---|

    | **Annualized rate of occurrence (ARO)** | This is the estimated frequency that
    a threat is expected to occur. It is the number of times that one may reasonably
    expect the risk to occur during one year. This estimate is very difficult and
    is usually based on past experience. |

    | **Annualized loss expectancy (ALE)** | This is the expected financial loss that
    an individual threat may cause. The ALE is a monetary value derived from the formula
    SLE x ARO. This number is used to justify the least-cost security measures. |


    # Quantitative Risk Analysis Example


    An administrator of a data center must provide a projection for a flood disaster.
    Assume that the overall value of a data center is $10,000,000 (AV). It is estimated
    that 60% (EF) of the data center would be destroyed in the event of a flood (risk):


    +   - SLE = AV x EF

    +   - SLE = $10,000,000 x 60% = $6,000,000


    The SLE assigns a monetary value for a single occurrence. It represents the organization’s
    potential loss amount if a specific threat exploits a vulnerability.


    The ALE is the total amount of money that the organization will lose in 1 year
    if nothing is done to mitigate the fault. It is often used to justify the lowest-cost
    security measure. If the likelihood of a flood occurring is estimated at once
    in 100 years (1/100), the ARO equals 1%:


    +   - ALE = SLE x ARO

    +   - ALE = $6,000,000 x 1% = $60,000


    The ALE provides a value that the organization can work with to budget the cost
    to establish controls or safeguards to prevent this type of damage.


