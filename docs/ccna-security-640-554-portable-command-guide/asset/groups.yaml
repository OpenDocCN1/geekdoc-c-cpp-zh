    \ PAT 或 NAT。\n\n8. 在管理访问窗口中，指定允许哪些主机使用 HTTPS/ASDM、SSH 或 Telnet 访问 ASA。\n\n9. 最后一个窗口是启动向导摘要。查看建议的配置。您可以单击“上一步”按钮进行更改，或单击“完成”按钮保存。\n\
    \n### VPN 向导\n\n各种 VPN 向导使管理员能够配置基本的站点到站点和远程访问 VPN 连接，并分配预共享密钥或数字证书进行身份验证。\n\n\
    要从菜单栏启动 VPN 向导，请单击 **向导** 并选择 **VPN 向导**，如图 19-4 所示。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_284_0.png)\n\
    \n**图 19-4**  可用的 VPN 向导\n\n为补充这些向导，ASDM 还提供 ASDM 助手。要查看远程访问 ASDM 助手，请选择 **配置\
    \ > 远程访问 VPN > 简介**，如图 19-5 所示。\n\n本章涵盖以下主题：\n\n- ASA 命令行界面\n  - IOS 与 ASA OS\
    \ 之间的差异\n- 配置基本设置\n  - 配置基本管理设置\n  - 启用主密码\n- 配置接口\n  - 配置内部和外部 SVI\n  - 将二层端口分配到\
    \ VLAN\n  - 配置第三个 SVI\n- 配置管理平面\n  - 启用 Telnet、SSH 和 HTTPS 访问\n  - 配置时间服务\n- 配置控制平面\n\
    \  - 配置默认路由\n- 基本设置示例\n  - 使用 CLI 配置基本设置示例\n  - 使用 ASDM 配置基本设置示例\n\n## ASA 命令行界面\n\
    \n自适应安全设备 (ASA) 命令行界面 (CLI) 是一种专有操作系统，其外观和操作方式与路由器 IOS 类似。与 Cisco IOS 路由器一样，ASA\
    \ 识别以下内容：\n\n- 命令和关键字的缩写\n- 使用 Tab 键补全部分命令\n- 在命令后使用帮助键 (?) 查看其他语法\n"
