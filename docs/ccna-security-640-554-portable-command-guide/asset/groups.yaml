    **NOTE:** The process creates six files in the IPS directory: `router-sigdef-default.xml`,
    which contains all the category default signature definitions; `router-sigdef.xml`,
    which contains signature definitions that have been changed from the default;
    `router-sigdef-type.xml`, which is a file that has all the signature parameter
    definitions; `router-sigdef-category.xml`, which has all the signature category
    information, such as category ios_ips basic and advanced; `router-sigdef-seap.xml`,
    which contains changes made to the default Signature Event Action Processor (SEAP)
    parameters; and `router-seap-typedef.xml`, which contains all of the SEAP parameter
    definitions.


