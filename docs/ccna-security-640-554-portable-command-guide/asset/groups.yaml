    | Rule type | Description |

    |---|---|

    | **Rules based on direction control** | Determines the direction in which particular
    service requests may be initiated and allowed to flow through the firewall. |

    | **Rules based on user control** | Controls access to a service according to
    which user is attempting to access it. This feature is usually applied to users
    inside the firewall perimeter (local users). It may also be applied to incoming
    traffic from external users. The latter requires some form of secure authentication
    technology, such as that provided in IP Security (IPSec). |

    | **Rules based on behavior control** | Controls how particular services are used.
    For example, the firewall may filter email to eliminate spam, or it may enable
    external access to only a portion of the information on a local web server. |


    **NOTE:** Firewall rule design usually follows a hybrid approach, combining all
    these criteria and following a least-privileges approach.


    # Firewall Rule Design Guidelines


    When creating firewall rules, use the following guidelines:


    +   - Use a restrictive approach for all interfaces and all directions of traffic
    to permit the required traffic flows and deny everything else.

    +   - Be paranoid and assume that malicious traffic could come from any security
    domain, even the most trusted ones.

    +   - Balance access control, performance, and rule maintenance. Specific and
    granular rules provide more control but also result in longer rule sets and increased
    change management and maintenance challenges.

    +   - Exercise care with the use of “any” keywords matching sources, destinations,
    and ports because they may allow unwanted traffic.

    +   - For a given access requirement, more specific rules should be at the top,
    and more generic rules should be at the bottom. The top-down processing order
    demands this approach to prevent shadow rules when creating exceptions to a given
    access policy.

    +   - Filtering impossible packets is a common practice. An example is antispoofing
    rules that are aimed at blocking private IPv4 address spaces in the source address
    of inbound Internet packets.

    +   - Auditing and change management are crucial. Obsolete rules tend to clutter
    the rule set and cause breaches to the access policy.


    # Cisco IOS Firewall Evolution


    Firewall technology has evolved as follows:


    +   - Packet filtering using ACLs

    +   - Context-Based Access Control (CBAC) (also referred to as Classic Firewall)

    +   - Cisco IOS Zone-Based Policy Firewall (ZFW)'
