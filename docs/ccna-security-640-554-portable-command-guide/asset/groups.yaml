    # # Basic Security Concepts


    # ## Assets, Vulnerabilities, Threats, and Countermeasures


    Four terms are associated with security management:


    | Term | Definition |

    |---|---|

    | Asset | Anything of value to an organization that must be protected |

    | Vulnerability | A weakness in a system or its design that could be exploited
    by a threat |

    | Threat | A potential danger to information or network functionality |

    | Countermeasure | A protection that mitigates a potential threat or risk |


    # ## Confidentiality, Integrity, and Availability


    To provide adequate protection of network assets, three things must be guaranteed:


    | Principle | Definition |

    |---|---|

    | Confidentiality | Only authorized users can view sensitive information. |

    | Integrity | Only authorized users can change sensitive information. It can also
    guarantee the authenticity of data. |

    | Availability (system and data) | Authorized users must have uninterrupted access
    to important resources and data. |


    # ## Data Classification Criteria


    Factors when classifying data include the following:


    | Factor | Description |

    |---|---|

    | Value | The number one criterion and is based on the cost to acquire, develop,
    and replace. |

    | Age | The importance of data usually decreases with time. |

    | Useful life | The amount of time in which data is considered valuable and must
    be kept classified. |

    | Personal association | Data that involves personal information of users and
    employees. |


    # ## Data Classification Levels


    Data classification terms commonly used by government and military include the
    following.


    | Classification | Definition |

    |---|---|

    | Unclassified | Data that has little or no confidentiality, integrity, or availability
    requirements, and therefore little effort is made to secure it. |

    | Sensitive but unclassified (SBU) | Data that could prove embarrassing if it
    is revealed, but no great security breach would occur. |

    | Confidential | Data must be kept secure. |'
  - '[PAGE 22]


    | Classification | Description |

    |---|---|

    | **Secret** | Data for which significant effort is made to keep it secure. Few
    individuals have access to this data. |

    | **Top secret** | Data for which great effort and sometimes considerable cost
    is made to guarantee its secrecy. Few individuals on a need-to-know condition
    have access to top-secret data. |


    Data classification terms commonly used by the public sector include the following:


    | Classification | Description |

    |---|---|

    | **Public** | Data that is available publicly, such as on websites, publications,
    and brochures |

    | **Sensitive** | Data that is similar to SBU data and that might cause some embarrassment
    if revealed |

    | **Private** | Data that is important to an organization and an effort is made
    to maintain the secrecy and accuracy of this data |

    | **Confidential** | Data that companies make the greatest effort to keep secure,
    such as trade secrets, employee data, and customer information |


    # Classification Roles


    Roles related to data include the following:


    | Role | Description |

    |---|---|

    | **Owner** | Person responsible for the information |

    | **Custodian** | Person in charge of performing day-to-day data maintenance,
    including securing and backing up the data |

    | **User** | Person using the data in accordance to established procedures |


    # Threat Classification


    Three categories of threat classification exist:


    | Category | Description |

    |---|---|

    | **Administrative** | Policy and procedure based, including change/configuration
    control, security training, audits, and tests |

    | **Technical** | Controls that involve hardware and software |

    | **Physical** | Controls for protecting the physical infrastructure |


    # Preventive, Detective, and Corrective Controls


    Incident and exposure management entails the following five categories:


    | Category | Description |

    |---|---|

    | **Preventive** | Preventing the threat from coming in contact with a vulnerability,
    such as using a firewall, physical locks, and a security policy |

    | **Detective** | Identifying that a threat has entered the network or system
    using system logs, intrusion prevention systems (IPSs), and surveillance cameras
    |'
  - '[PAGE 23]


    |  |  |

    |---|---|

    | Corrective | Determining the underlying cause of a security breach and then
    mitigating the effects of the threat being manifested, such as updating virus
    or IPS signatures |

    | Recovery | Putting a system back into production after an incident |

    | Deterrent | Discouraging security violations |


    # ## Risk Avoidance, Transfer, and Retention


    Countermeasures to managing risk can be categorized as follows:


    |  |  |

    |---|---|

    | Risk avoidance | Avoid activity that could carry risk. |

    | Risk reduction | Involves reducing the severity of the loss or the likelihood
    of the loss from occurring. |

    | Risk sharing or transfer | Involves sharing the burden of loss or the benefit
    of gain with another party. |

    | Risk retention or acceptance | Involves accepting the loss, or benefit of gain,
    from a risk when it occurs. |


    # ## Drivers for Network Security


    Key factors to consider when designing a secure network include the following:


    +   - Business needs

    +   - Risk analysis

    +   - Security policy

    +   - Industry best practices

    +   - Security operations


    # ## Evolution of Threats


    Threats have evolved in the following manner over the years:


    |  |  |

    |---|---|

    | First generation (early 1990s) | Threats took days to propagate and targeted
    individual computers and networks using macro viruses, email viruses, spam, denial-of-service
    (DoS) attacks, and limited hacking. |

    | Second generation (early 2000s) | Threats were propagated in hours and targeted
    multiple networks using network DoS, blended threats (worm + virus + Trojan horses),
    turbo worms, and widespread hacking. |

    | Third generation (late 2000s) | Threats took minutes to propagate and targeted
    regional networks using infrastructure hacking, Adobe Flash compromises, distributed
    DoS (DDoS), and worms and viruses with damaging payloads. |'
