    ## IDS and IPS Fundamentals


    An intrusion detection system (IDS) sensor captures packets in real time, processes
    them, and can respond to threats, but it works on copies of data traffic to detect
    suspicious activity by using signatures. An IDS allows malicious traffic to pass
    before it can respond.


    An intrusion prevention system (IPS) sensor works in line in the data stream to
    provide protection from malicious attacks in real time. An IPS responds immediately
    and does not allow malicious traffic to pass.


    **NOTE:** This chapter focuses on IPS.


    ### Types of IPS Sensors


    IPS sensors can be deployed as follows:


    | Type | Description |

    | --- | --- |

    | **IPS 4200 Sensor** | As a dedicated IPS appliance available in multiple form
    factors |

    | **Network modules** | As a network module installed in an Integrated Services
    Router (ISR), an Adaptive Security Appliance (ASA), or a high-end Catalyst switch
    |

    | **Cisco IOS IPS** | Integrated in the IOS of an ISR and some Layer 3 switches
    |


    ### Types of Signatures


    IDS and IPS technologies use signatures to detect the following general patterns
    of misuse:


    | Type | Description |

    | --- | --- |

    | **Atomic pattern** | An attempt is made to access a specific port on a specific
    host, and malicious content is contained in a single packet. |

    | **Composite pattern** | A sequence of operations that are distributed across
    multiple hosts over an arbitrary period (event horizon). |


    ### Types of Alarms


    Attacks can generate the following four types of alarms:


    | Type | Description |

    | --- | --- |

    | **True positive** | Occurs when an IDS or IPS signature is correctly fired and
    an alarm is generated when offending traffic is detected |

    | **True negative** | Occurs when the sensor does not fire an alarm when it captures
    and analyzes network traffic that is normal |

    | **False positive** | Alarm that is triggered by normal traffic or a benign action
    |

    | **False negative** | Occurs when an alarm is not triggered when offending traffic
    is detected |


    **NOTE:** True positives and true negatives are expected IDS and IPS alarms.


    **CAUTION:** False positives must be tuned; false negatives must be corrected.


    ## Intrusion Prevention Technologies


    Multiple detection technologies are typically used to provide an effective intrusion
    detection architecture:


    | Detection technology | Description |

    | --- | --- |

    | **Signature-based IPS** | ▪ Signatures are a set of rules installed on an IPS
    sensor.<br>▪ As sensors scan network packets, they use signatures to detect known
    attacks and respond with predefined actions.<br>▪ Sensors can modify existing
    signatures and define new ones. |

    | **Policy-based IPS** | ▪ Policies are created and configured on the IPS sensor
    based on the network security policy.<br>▪ Any traffic that is detected outside
    the policy will generate an alarm and/or will be dropped. |

    | **Anomaly-based IPS (profile-based detection)** | ▪ Sensors generally look for
    network traffic that deviates from the norm.<br>▪ Statistical baselining is when
    normal behavior is defined based on traffic patterns, traffic and protocol mix,
    traffic volumes, and other criteria.<br>▪ Protocol anomaly baselining focuses
    on traffic that deviates from protocol standards. |

    | **Reputation-based IPS** | ▪ Technique uses reputation analysis for various
    traffic descriptors, such as IP addresses, URLs, Domain Name System (DNS) domains,
    and others.<br>▪ This usually translates into reputation filters that round up
    a signature-based system by filtering known malicious sources, destinations, or
    application components.<br>▪ The approach generally requires communication between
    the sensor and the source of the reputation information.<br>▪ Sources can be local
    to the device, enterprise knowledge, and even global knowledge. |


    **NOTE:** There are advantages and disadvantages to each intrusion detection technique.
    It is recommended to strike a balance between these methods and combine them to
    improve the accuracy, sensitivity, relevancy, and precision of your IPS.


    ### IPS Attack Responses


    When an IPS sensor detects malicious activity, it can choose from any or all of
    the following actions:


    | Action | Description |

    | --- | --- |

    | **Deny attacker inline** | Action terminates the current packet and future packets
    from the attacker address for a specified period. |

    | **Deny connection inline** | The sensor maintains a list of the attackers currently
    being denied by the system, and these entries can be manually removed from the
    list or wait for the sliding timer to expire. |

    | **Deny packet inline** | Action terminates the current packet and future packets
    on this TCP flow. |

    | **Log attacker packets** | Action starts IP logging on packets that contain
    the attacker address and sends an alert to the Event Store, even if the Produce
    Alert action is not selected. |

    | **Log pair packets** | Action starts IP logging on packets that contain the
    attacker and victim address pair and sends an alert to the Event Store, even if
    the Produce Alert action is not selected. |

    | **Log victim packets** | Action starts IP logging on packets that contain the
    victim address and sends an alert to the Event Store, even if the Produce Alert
    action is not selected. |

    | **Produce alert** | Action writes the event to the Event Store as an alert.
    |

    | **Produce verbose alert** | Action includes an encoded dump of the offending
    packet in the alert and is written to the Event Store. |

    | **Request block connection** | Action sends a request to a blocking device to
    block this connection. |

    | **Request block host** | Action sends a request to a blocking device to block
    this attacker host. |

    | **Request SNMP trap** | Action sends a Simple Network Management Protocol (SNMP)
    notification and an alert to the Event Store, even if the Produce Alert action
    is not selected. |

    | **Reset TCP connection** | Action sends TCP resets to hijack and terminate the
    TCP flow. |


    **NOTE:** You can use the reset TCP connection action with deny packet and deny
    connection actions. However, deny packet and deny flow actions do not automatically
    cause TCP reset actions to occur.


    **NOTE:** Cisco IOS IPS does not support all of these actions.

