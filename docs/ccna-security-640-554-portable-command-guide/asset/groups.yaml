    \n2. 在基本配置窗口中，完成由主机名、域名和特权 EXEC 密码组成的 ASA 基本管理配置。可选地，此步骤还允许管理员为远程工作人员部署 ASA。\n\
    \n3. 在接口选择窗口中，创建 VLAN 交换机接口。此步骤和其他与 VLAN 相关的步骤特定于 ASA 5505 型号。ASA 5510 及更高型号的启动向导提供根据需要配置快速以太网路由接口的步骤，无需\
