  - '[PAGE 28]


    Reconnaissance attacks typically involve the unauthorized discovery and mapping
    of systems, services, or vulnerabilities using the following:


    | Method | Description |

    |---|---|

    | **Internet information queries** | Uses readily available Internet tools such
    as WHOIS, which is widely used for querying databases that store the registered
    users or assignees of an Internet resource. |

    | **Ping sweeps** | Method is used to discover a range of live IP addresses. |

    | **Port scanners** | An application program designed to probe a target host for
    open ports and identify vulnerable services to exploit. |

    | **Packet sniffers** | An application program that can intercept, log, and analyze
    traffic flowing over a network (also referred to as a packet analyzer, network
    analyzer, or protocol analyzer). |


    # Access Attacks


    The goal of access attacks is to discover usernames and passwords to access various
    resources. The following are common methods to conduct an access attack:


    | Attack | Description |

    |---|---|

    | **Blended threats** | Blended threats are attack mechanisms that combine the
    characteristics of viruses, worms, Trojan horses, spyware, and others. If the
    threat is successfully initiated, the access attack attempts to gather user information.
    |

    | **Phishing** | Phishing attacks masquerade as a trustworthy entity to get unsuspecting
    users to provide sensitive information (and are usually used for identity theft).
    The attacks are usually carried out using email, instant messaging, or phone contact.
    The message usually directs users to enter details at the hacker’s website. Spear
    phishing is when a phishing attack is directed at a specific user. |

    | **Pharming** | Pharming is an attack aimed at redirecting the traffic of a website
    to another website. Such attacks are usually conducted by exploiting a vulnerable
    Domain Name System (DNS) server. |

    | **Man-in-the-middle attacks** | In a man-in-the-middle attack, a hacker positions
    himself between a user and the destination. The actual implementation can be carried
    out in a variety of ways, including using network packet sniffers or altering
    routing and transport protocols. This type of attack is used for session hijacking,
    theft of information, sniffing and analyzing network traffic, corrupting data
    flows, propagating bogus network information, and for DoS attacks. |

    | **IP and MAC address spoofing** | In IP address spoofing attacks, a hacker forges
    IP packets with trusted IP source addresses. MAC address spoofing similarly forges
    trusted host MAC addresses on a LAN. The attacks are commonly used to create a
    man-in-the-middle situation. |

    | **Trust exploitation** | Trust exploitation refers to when a hacker has compromised
    a target and that host is trusted by another host (new target). |'
  - '[PAGE 29]


    # Password Cracking


    Hackers can capture passwords using Trojan horse programs, key loggers, or packet
    sniffers. In addition, they can attempt to crack passwords using the following
    methods:


    | | |

    |---|---|

    | **Word lists** | Programs use word lists; phrases; or other combinations of
    letters, numbers, and symbols that are often used as passwords. Programs enter
    word after word at high speed until they find a match. |

    | **Brute force** | This approach relies on power and repetition, comparing every
    possible combination and permutation of characters until it finds a match. It
    eventually cracks any password, but it may be very time-consuming. |

    | **Hybrid cracking** | Some password crackers mix a combination of techniques
    and are highly effective against poorly constructed passwords. |


    # Denial-of-Service Attacks


    DoS attacks send extremely large numbers of requests over a network or the Internet.
    These excessive requests cause the target device to run suboptimally. Consequently,
    the attacked device becomes unavailable for legitimate access and use. By executing
    exploits or combinations of exploits, DoS attacks slow or crash applications and
    processes.


    Types of attacks to compromise availability include the following:


    | | |

    |---|---|

    | **Botnets** | Describes a collection of compromised systems running worms, Trojan
    horses, or backdoors under a common command and control infrastructure. The originator
    of a botnet controls the group of computers remotely. |

    | **Denial of service (DoS)** | A DoS attack sends an extremely large number of
    requests over a network or the Internet to a server or edge device with the intent
    to overwhelm the target, making it unavailable for legitimate access and use.
    This is the most publicized form of attack and among the most difficult to eliminate.
    |

    | **Distributed DoS (DDoS)** | A DDoS attack enlists a network of botnets that
    contains a remotely controlled agent, or zombie, attack program. A master control
    mechanism provides direction and control. When the zombies receive instructions
    from the master agent, they each begin generating malicious traffic that is aimed
    at the victim. |

    | **Other attacks** | Other attacks to compromise availability include TCP synchronization
    (SYN) floods, ICMP floods, cutting electrical power, or sabotaging the computer
    environment. |'
  - '[PAGE 30]


    # # Principles of Secure Network Design


    Guidelines to secure a network infrastructure include the following:


    | Principle | Description |

    |---|---|

    | **Defense in depth** | Architecture uses a layered approach to create security
    domains and separate them by different types of security controls. |

    | **Compartmentalization** | Architecture segments the network where different
    assets with different values are in different security domains, be it physical
    or logical. Granular trust relationships between compartments would mitigate attacks
    that try to gain a foothold in lower-security domains to exploit high-value assets
    in higher-security domains. |

    | **Least privilege** | Principle applies a need-to-know approach to trust relationships
    between security domains. This results in restrictive policies, where access to
    and from a security domain is allowed only for the required users, applications,
    or network traffic. Everything else is denied by default. |

    | **Weakest link** | Architecture uses a layered approach to security, with weaker
    or less-protected assets residing in separated security domains. Humans are often
    considered to be the weakest link in information security architectures. |

    | **Separation and rotation of duties** | Concept of developing systems where
    more than one individual is required to complete a certain task to mitigate fraud
    and error. This applies to information security controls, and it applies to both
    technical controls and human procedures to manage those controls. |

    | **Mediated access** | Principle is based on centralizing security controls to
    protect groups of assets or security domains such as using firewalls, proxies,
    and other security controls to act on behalf of the assets they are designed to
    protect, and mediate the trust relationships between security domains. |

    | **Accountability and traceability** | Architecture should provide mechanisms
    to track the activity of users, attackers, and even security administrators. It
    should include provisions for accountability and non-repudiation. This principle
    translates into specific functions, such as security audits, event management
    and monitoring, forensics, and others. |


    # ## Defense in Depth


    Defense in depth provides a layered security approach by using multiple security
    mechanisms. The security mechanisms should complement each other but not depend
    on each other. The use of this approach can eliminate single points of failure
    and augment weak links in the system to provide stronger protection with multiple
    layers.'
  - '[PAGE 31]


    Recommendations for a defense-in-depth strategy include the following:


    | Principle | Description |

    |---|---|

    | **Defend in multiple places** | Threat vectors can occur from various locations.
    Therefore, an organization must deploy protection mechanisms at multiple locations
    to resist all classes of attacks. Includes defending the networks and infrastructure,
    enclave boundaries, and the computing environment. |

    | **Build layered defenses** | All products have inherent weaknesses. Therefore,
    an effective countermeasure is to deploy multiple defense mechanisms between the
    adversary and the target. |

    | **Use robust components** | Specify the security robustness based on the value
    of the asset to be protected. For instance, deploy stronger mechanisms at the
    network boundaries than at the user desktop. |

    | **Employ robust key management** | Deploy robust encryption key management and
    public key infrastructures that are highly resistant to attack. |

    | **Deploy intrusion detection/prevention systems (IDSs/IPSs)** | Deploy infrastructures
    to detect and prevent intrusions and to analyze and correlate the results and
    react accordingly. |'
