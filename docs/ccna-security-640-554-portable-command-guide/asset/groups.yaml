    \ 欺骗 DTP 消息\n\n攻击者发送欺骗的动态中继协议（DTP）消息，试图与交换机建立中继链路。如果成功，攻击者可以发送带有目标 VLAN 标记的流量，并让交换机将数据包传送到目的地。\n\
    \n![](img/0d9540c65a85f4cb1c32cee46038d8ab_134_0.png)\n\n- 在所有中继链路上：\n  - 启用中继。\n\
    \  - 禁用 DTP。\n  - 使用唯一的本征 VLAN。\n- 在所有未使用的端口上：\n  - 禁用中继。\n  - 将所有未使用的端口分配到专用\
    \ VLAN。\n  - 禁用该端口。\n- 在接入端口上：\n  - 禁用中继。\n\n图 8-3 缓解 VLAN 攻击示例的网络拓扑\n\n| 命令 |\
    \ 描述 |\n| :--- | :--- |\n| `S3(config)#interface range Fa0/1 - 2` | 配置两个中继端口 Fa0/1\
    \ 和 Fa0/2。 |\n| `S3(config-if-range)#switchport mode trunk` | 显式启用中继。 |\n| `S3(config-if-range)#switchport\
    \ nonegotiate` | 禁用 DTP。 |\n| `S3(config-if-range)#switchport trunk native vlan\
    \ 88` | 将本征 VLAN 分配给 VLAN 88。VLAN 88 不用于任何其他流量。 |\n| `S3(config-if-range)#interface\
    \ Fa0/3` | 切换到接口 Fa0/3。 |\n| `S3(config-if)#switchport mode access` | 禁用中继。 |\n\
    | `S3(config)#interface range Fa0/4 - 24` | 配置所有其他未使用的端口。 |\n| `S3(config-if-range)#switchport\
    \ mode access` | 禁用所有未使用端口上的中继。 |\n| `S3(config-if-range)#shutdown` | 禁用所有未使用的端口。\
    \ |\n\n## 高级第 2 层安全功能\n\n其他交换机安全功能包括：\n\n- 访问控制列表（ACL）和私有 VLAN\n- Cisco 集成安全功能\n\
    - 安全管理平面安全功能\n\n> **注意：** 这些功能的配置超出了本书的范围。\n\n"
