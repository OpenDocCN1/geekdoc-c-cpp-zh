  mdcn: "\n\n为了实现这些目标，数字签名具有以下特性：\n\n|  |  |\n|---|---|\n| 签名是真实的。 | 签名让文档的接收者确信签名者确实签署了该文档。\
    \ |\n| 签名是不可伪造的。 | 签名证明是签名者本人（而非其他人）签署了该文档。 |\n| 签名是不可重复使用的。 | 签名是文档的一部分，不能移至其他文档。\
    \ |\n| 签名是不可更改的。 | 文档一经签署，便无法更改。 |\n| 签名是不可否认的。 | 签名和文档是物理实体。签名者事后无法声称自己没有签署过。\
    \ |\n\n**注意：** 下一章将介绍数字签名。\n\n本章涵盖以下主题：\n\n- 非对称加密\n  - 公钥机密性与认证\n  - RSA 函数\n\
    - 公钥基础设施\n  - PKI 术语\n  - PKI 标准\n  - PKI 拓扑\n  - PKI 特性\n\n## 非对称加密\n\n非对称算法基于复杂的数学公式，因此计算所需时间比对称算法更长。\n\
    \n公钥加密算法的例子包括 Rivest、Shamir 和 Adleman（RSA）算法、数字签名算法（DSA）、Diffie-Hellman（D-H）、ElGamal\
    \ 以及椭圆曲线密码学（ECC）。\n\n### 公钥机密性与认证\n\n非对称算法使用公钥和私钥。两个密钥都能用于加密，但解密时必须使用与之匹配的对应密钥。\n\
    \n例如，若用公钥加密数据，则需用对应的私钥解密。反之亦然：若用私钥加密数据，则需用对应的公钥解密。\n\n非对称密码学用于实现机密性和认证。\n\n| \
    \ |  |\n|---|---|\n| 公钥机密性 | 机密性 = 公钥（加密）+ 私钥（解密） |\n|  | • 使用公钥加密，使用对应的私钥解密。<br>•\
    \ 由于私钥仅存在于一个系统上，在与该系统通信时即可实现机密性。<br>• 此场景常用于密钥交换。 |\n| 公钥认证 | 认证 = 私钥（加密）+ 公钥（解密）\
    \ |\n|  | • 使用私钥加密，使用对应的公钥解密。<br>• 由于私钥仅存在于一个系统上，当其公钥成功解密消息时，即可确认身份。 |\n\n###\
    \ RSA 函数\n\nRSA 是最常用的非对称算法之一，因为它易于实现，并且非常灵活——其密钥长度可变，必要时可以用速度换取算法的安全性。RSA 密钥通常为\
    \ 512–2048 位。RSA 的安全性基于对大整数进行因式分解（即将大数分解为多个乘法因子）的难度。RSA 的速度明显慢于数据加密标准（DES），通常仅用于在机密性场景下保护少量数据。\n\
    \nRSA 主要用于两种服务：\n\n- 通过执行加密来确保数据的机密性，通常用于保护会话密钥等少量数据。\n- 通过生成数字签名来对数据进行认证或实现数据的不可否认性，或两者兼而有之。\n\
    \n## 公钥基础设施\n\n公钥基础设施（PKI）基于非对称加密的基本原理，确保企业环境中的机密性、完整性和认证。PKI 解决方案基于数字证书和可信第三方信任模型。\n\
    \nPKI 利用非对称加密衍生的私钥与公钥、数字签名和信任模型。PKI 提供的服务包括身份管理、软件代码签名、加密文件系统、电子邮件、虚拟专用网络（VPN）等。\n\
    \nPKI 是一组技术、组织和法律组件的集合。建立该系统需要这些组件，以支持大规模使用公钥密码学，从而提供真实性、机密性、完整性和不可否认性服务。\n\n\
    ### PKI 术语\n\n| 术语 | 定义 |\n|---|---|\n| **公钥基础设施（PKI）** | 支持大规模基于公钥技术所需的服务框架。\
    \ |\n| **证书** | 将用户或组织的名称绑定到公钥证书（数字证书）的电子文档。<br><br>数字证书由 CA 进行数字签名。<br><br>证书可用于验证某个公钥是否属于某个个人或组织。\
    \ |\n| **证书颁发机构（CA）** | 证书颁发机构（即可信第三方）将公钥与相应的用户身份绑定。<br><br>它对与组织关联的公钥进行数字签名并发布。<br><br>商业\
    \ CA（例如 VeriSign）会收取服务费用，并受到大多数 Web 浏览器的信任。<br><br>某些服务提供商提供公共 CA 且不收取服务费用。<br><br>组织或政府也可以为其用户部署\
    \ CA。 |\n| **注册机构（RA）** | 帮助 CA 执行密钥管理任务从而分担 CA 负载的 PKI 服务器。<br><br>它们类似于 CA 的代理。<br><br>它们最大限度地减少了\
    \ CA 在网络中的暴露。 |\n\n**注意：** 证书通常在应用层用于安全套接字层（SSL）、传输层安全性（TLS）、安全多用途 Internet 邮件扩展（S/MIME）和良好隐私（PGP）。Cisco\
    \ 设备可在 IPsec VPN 的初始密钥交换（IKE）以及使用可扩展认证协议-TLS（EAP-TLS）的 802.1x 认证中使用证书。\n\n###\
