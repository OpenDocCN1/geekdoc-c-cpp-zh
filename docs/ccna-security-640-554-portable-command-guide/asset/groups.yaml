    # ### ASA 5505 Port Configuration


    The ASA 5510 devices or later have Layer 3 routed interfaces. The interfaces are
    enabled by assigning an IP address, interface name, and security level.


    The ASA 5505 is configured differently than higher models because it does not
    have any Layer 3 interfaces. It comes with an integrated eight-port Layer 2 Fast
    Ethernet switch. Each port is individually assigned to a specific VLAN. All Layer
    3 parameters (that is, IP address, interface name, and security level) must be
    configured for the VLAN interface also known as a switch virtual interface (SVI).
    Switch ports on the same VLAN can communicate with each other using hardware switching.


    # ### ASA 5505 Deployment Scenarios


    The ASA 5505 is commonly used as an edge security device that connects a small
    business to an ISP to access the Internet. It can be deployed as follows:


    |  |  |

    |---|---|

    | **Small branch deployment** | • The ASA 5505 can be deployed with 2 security
    zones:<br>&nbsp;&nbsp;• VLAN 1 with security level 100 for inside hosts<br>&nbsp;&nbsp;•
    VLAN 2 with security level 0 for the Internet connection |

    | **Small business deployment** | • The ASA 5505 can be deployed with 3 security
    zones:<br>&nbsp;&nbsp;• VLAN 1 for the inside network connecting workstations<br>&nbsp;&nbsp;•
    VLAN 2 for the outside network connecting to the Internet<br>&nbsp;&nbsp;• VLAN
    3 for the DMZ connecting to a company web servers |

    | **Enterprise deployment** | • The ASA 5505 can be used by telecommuters and
    home users to connect to a centralized location using a VPN |


    # ### ASA 5505 Configuration Options


    ASA devices can be configured and managed using either the


    +   - Command-line interface (CLI) required for initial ASA deployment and maintenance

    +   - Adaptive Security Device Manager (ASDM) GUI


    > **NOTE:** ASDM simplifies the deployment and maintenance of an ASA.'
