    \n![](img/0d9540c65a85f4cb1c32cee46038d8ab_255_1.png)\n\n**图17-7** 修改后的IKE提议窗口\n\
    \n单击“下一步”继续。\n\n“转换集”窗口打开，如图17-8所示。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_256_0.png)\n\
    \n**图17-8 转换集窗口**\n\n下一步是定义转换集，它标识IPsec阶段2的密码套件。转换描述一种特定的安全协议及其相应算法，对等体同意使用它们来保护特定数据流。\n\
