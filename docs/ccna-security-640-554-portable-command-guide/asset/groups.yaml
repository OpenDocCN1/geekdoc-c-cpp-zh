    \ |\n| **第 2 层安全功能** | Cisco Catalyst 交换机具有集成功能，有助于保护第 2 层基础设施。 |\n\n### ACL\n\
    \nACL 以多种方式用于保护数据平面，包括以下方式：\n\n| 功能 | 描述 |\n| --- | --- |\n| **阻止不需要的流量或用户** |\
    \ ACL 可以过滤接口上的入站或出站数据包，基于源地址、目的地址或用户认证来控制访问。 |\n| **降低 DoS 攻击的机会** | ACL 可用于指定主机、网络或用户的流量是否可以访问网络。还可以配置\
    \ TCP 拦截功能，以防止服务器被连接请求淹没。 |\n| **缓解欺骗攻击** | ACL 使安全从业人员能够实施推荐的做法来缓解欺骗攻击。 |\n|\
    \ **提供带宽控制** | 慢速链路上的 ACL 可以防止过多流量。 |\n| **对流量进行分类以保护其他平面** | ACL 可以应用于 vty 线路（管理平面）。ACL\
    \ 可以控制发送、接收或重分发的路由更新（控制平面）。 |\n\n### 反欺骗\n\n实施 IETF 最佳当前实践 38（BCP38）和 RFC 2827\
    \ 入口流量过滤会使无效源 IP 地址的使用失效，迫使攻击从有效且可达到的 IP 地址发起，这些地址可以追溯到攻击发起者。\n\n诸如单播反向路径转发（uRPF）等功能可用于补充反欺骗策略。\n\
