  - '[PAGE 140]


    Like the IPv4 Protocol field, the IPv6 Next Header identifies the extension header
    and is not of fixed length. It can contain additional information such as a hop-by-hop
    list of destinations, routing header (RH), IPsec information, and more. All extension
    headers are daisy-chained, each header pointing to the next header until they
    reach the transport layer data. This arrangement allows an IPv6 packet to be customized
    with features and functionality (for example, TCP, UDP, ICMPv6).


    > **NOTE** Attackers can use these extension headers for malicious purposes.


    # ICMPv6


    Internet Control Message Protocol (ICMP) has a greater role in IPv6.


    | ICMP Message Type | ICMPv4 | ICMPv6 |

    |---|---|---|

    | Connectivity checks | ✓ | ✓ |

    | Information/error messaging | ✓ | ✓ |

    | Fragmentation needed notification | ✓ | ✓ |

    | Address assignment |  | ✓ |

    | Address resolution |  | ✓ |

    | Router discovery |  | ✓ |

    | Multicast group management |  | ✓ |

    | Mobile IPv6 support |  | ✓ |


    ICMPv6 is used for neighbor and router discovery.


    | ICMPv6 Message | Type | Description |

    |---|---:|---|

    | Neighbor solicitation (NS) | 135 | Similar to the IPv4 Address Resolution Protocol
    (ARP), it is sent by a host to determine the link-layer address of a neighbor.<br><br>Used
    to verify that a neighbor is still reachable.<br><br>An NS is also used for duplicate
    address detection (DAD). |

    | Neighbor advertisement (NA) | 136 | A response to an NS message.<br><br>A node
    may also send unsolicited an NA to announce a link-layer address change. |

    | Router advertisement (RA) | 134 | RAs contain prefixes that are used for address
    configuration including a hop limit value, maximum transmission unit (MTU) value,
    and so on.<br><br>RAs are sent either periodically or in response to an RS message.
    |

    | Router solicitation (RS) | 133 | When a host is booting, it sends out an RS
    requesting routers to immediately generate an RA rather than wait for their next
    scheduled time. |'
  - '[PAGE 141]


    > **NOTE:** Attackers may manipulate ICMPv6 for malicious purposes.


    # ## Stateless Autoconfiguration


    Stateless autoconfiguration enables plug-and-play configuration of an IPv6 device
    without the use of a server. It uses the Neighbor Discovery Protocol (NDP), which
    is based on ICMP version 6 (ICMPv6) protocol messaging. NDP uses the ICMPv6 RS
    and RA messages.


    > **NOTE:** NDP replaces ARP and suffers from the same lack of authentication
    as ARP and DHCP on IPv4 networks.


    # ## IPv4-to-IPv6 Transition Solutions


    Many transition mechanisms enable smooth integration of IPv4 and IPv6. Other mechanisms
    that allow IPv4 nodes to communicate with IPv6 nodes are available. All these
    mechanisms are applied to different situations.


    The three most common techniques to transition from IPv4 to IPv6 are as follows:


    +   | Technique | Description |

    +   |---|---|

    +   | **Dual stack** | A host is configured with an IPv4 and IPv6 network address.
    As a result, the node and its corresponding routers have two protocol stacks.
    |

    +   | **Tunneling** | **Manual IPv6-over-IPv4 tunneling** is an integration method
    in which an IPv6 packet is encapsulated within the IPv4 protocol. This method
    requires dual-stack routers. |

    +   |  | **Dynamic 6to4 tunneling** is a method that automatically establishes
    the connection of IPv6 islands through an IPv4 network. |

    +   |  | **Intra-Site Automatic Tunnel Addressing Protocol (ISATAP) tunneling**
    is an automatically virtual tunneling mechanism that uses the underlying IPv4
    network as a data link layer for IPv6. |

    +   |  | **Teredo tunneling** is an IPv6 transition technology that provides host-to-host
    automatic tunneling instead of gateway tunneling. |

    +   | **Proxying and translation (NAT-PT)** | This translation mechanism sits
    between an IPv6 network and an IPv4 network. The job of the translator is to translate
    IPv6 packets into IPv4 packets and vice versa. |


    # ## IPv6 Routing Solutions


    IPv6 supports static routes, Routing Information Protocol next generation (RIPng),
    Open Shortest Path First Version 3 (OSPFv3) Protocol, Intermediate System-to-Intermediate
    System Protocol (IS-IS) for IPv6, Multiprotocol Border Gateway Protocol Version
    4 (MP-BGP4), and Enhanced Interior Gateway Routing Protocol (EIGRP) for IPv6.
    You must configure the ipv6 unicast-routing before an IPv6-capable routing protocol
    or an IPv6 static route will work.'
