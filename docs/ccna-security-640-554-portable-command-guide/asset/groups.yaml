  - "[PAGE 315]\n\nACLs on a security appliance can be used for the following:\n\n\
    | Category | Description |\n| --- | --- |\n| Through-traffic packet filtering\
    \ | • Traffic is passing through the appliance from one interface to another interface.<br>•\
    \ The configuration requires an ACL to be defined and then applied to an interface.\
    \ |\n| To-the-box traffic packet filtering | • Traffic (for example, Telnet, or\
    \ SSH, Simple Network Management Protocol [SNMP]) is destined for the appliance.<br>•\
    \ It filters traffic destined to the ASA management plane.<br>• It is completed\
    \ in one step but requires an additional set of rules to implement access control.<br>•\
    \ Also known as a management access rule. |\n\n# ACL Syntax\n\nYou can use many\
    \ options with ACLs. However, for most needs, a more useful and condensed version\
    \ of the syntax is as follows:\n\n```\n    ciscoasa(config)# access-list id extended\
    \ {deny | permit} protocol\n    {source_addr source_mask} | any | host src_host\
    \ |\n    interface src_if_name\n    {operator port [port]}\n    {dest_addr dest_mask}\
    \ | any | host dst_host |\n    interface dst_if_name\n    {operator port [port]}\n\
    ```\n\n> > **NOTE:** The `interface` keyword is used for to-the-box filtering.\n\
    > >\n> > **NOTE:** Explanation of all ACL syntax is beyond the scope of this chapter.\n\
    \n> > **NOTE:** Use the `help access-list` command to view complete syntax information.\n\
    \n> > **NOTE:** To verify ACLs, use the `show access-list` and `show running-config\
    \ access-list` commands.\n\n> > **NOTE:** To erase a configured ACL, use the `clear\
    \ configure access-list id` command.\n\nAfter you configure an ACL to identify\
    \ traffic allowed or denied by the ASA, the next step is to apply the ACL to an\
    \ interface in either the inbound or the outbound direction."
  md: "\n## Configuring DHCP Server Example Using ASDM\n\nTo enable DHCP server services,\
