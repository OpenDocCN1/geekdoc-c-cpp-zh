    ## 封装 IPsec 数据包


    IPsec 框架有两个主要协议：


    | 协议 | 描述 |

    |---|---|

    | **认证头（AH）** | • AH 提供数据认证和完整性。<br>• 但是，它不提供机密性。<br>• AH 使用 HMAC-MD5 或 HMAC-SHA-1
    对负载提供完整性和认证。<br>• AH 是 IP 协议 51。 |

    | **封装安全负载（ESP）** | • ESP 使用 DES、3DES 或 AES 加密负载来提供机密性。<br>• ESP 还可以使用 HMAC-MD5
    或 HMAC-SHA-1 对负载提供完整性和认证。<br>• ESP 还可以通过要求接收主机在报头中设置重放位以指示该数据包已被查看，来强制执行反重放保护。<br>•
    ESP 是 IP 协议号 50。 |


    **注意：** 本章重点介绍 ESP 以及其他重要的 IPsec 协议。


    ## 传输模式与隧道模式


    ESP 和 AH 可用于两种不同的模式：


    | 模式 | 描述 |

    |---|---|

    | **传输模式** | • 仅为传输层及以上层提供安全性。<br>• 传输模式保护数据包的负载，但保留原始 IP 地址为明文。<br>• ESP 传输模式用于主机之间。
    |

    | **隧道模式** | • 隧道模式为整个 IP 数据包提供安全性。<br>• 原始数据包被加密，然后封装在另一个 IP 数据包中。<br>• ESP 隧道模式用于主机与安全网关之间，或两个安全网关之间。
    |


    **注意：** 本书重点介绍隧道模式。


    | 算法 | 描述 |

    |---|---|

    | **HMAC-安全哈希算法 2（HMAC-SHA-2）** | ▪ SHA-2 HMAC 算法是最强算法。<br>▪ SHA-2 系列基于 SHA-1，并增加了
    SHA-256 位哈希算法和 SHA-384 位哈希算法。 |


    ## 对等体认证方法


    | 方法 | 描述 |

    |---|---|

    | **预共享密钥（PSK）** | ▪ 对等体通过比较预配置的密钥来相互认证。<br>▪ PSK 与其他信息结合以创建认证密钥。 |

    | **RSA 签名** | ▪ 对等体使用数字证书相互认证。<br>▪ 发送方对等体使用其私钥创建加密哈希，将其附加到消息中并转发。<br>▪ 远程对等体使用公钥解密哈希，并与重新计算的哈希进行比较。
    |

    | **RSA 加密随机数** | ▪ 对等体使用 RSA 生成的随机数（称为 nonce）相互认证。<br>▪ 作为配置过程的一部分，必须将公钥手动复制到每个对等体。<br>▪
    此方法最不常用。 |

    | **椭圆曲线数字签名算法（ECDSA）** | ▪ ECDSA 是数字签名标准（DSS）使用的方法。<br>▪ ECDSA 提高了通信效率：<br>&nbsp;&nbsp;▪
    它比类似强度的 RSA 运算更快。<br>&nbsp;&nbsp;▪ 它比 RSA 签名更小。 |


    ## 密钥交换算法


    加密算法需要对称共享密钥来执行加密和解密。这些算法在 IKE 内用于建立会话密钥。Cisco IOS 软件中提供以下公钥交换方法：


    ## IKE 协商阶段


    要建立 IPsec VPN 隧道，IKEv1 和 IKEv2 都需要两个协商阶段。


    | | |

    |---|---|

    | **IKE 阶段 1** | • 目标是建立 IKE SA。<br>• 该阶段可以在*主模式*或*激进模式*下完成。<br>• 两个 IPsec 对等体执行
    SA 的初始协商。<br>• SA 协商是双向的；可以使用相同的加密密钥发送和接收数据。 |

    | **IKE 阶段 2** | • 目标是建立 IPsec SA。<br>• 该阶段也称为*快速模式*。<br>• SA 由 IKE 进程 Internet
    安全关联和密钥管理协议（ISAKMP）协商。<br>• 在此阶段，IPsec 使用的 SA 是单向的，因此每个数据流都需要单独的密钥交换。 |


    ### IKEv1 阶段 1（主模式和激进模式）


    IKEv1 阶段 1 的基本目的是协商 IKE 策略集、认证对等体，并在对等体之间建立安全通道。


    IKEv1 阶段 1 以主模式或激进模式运行：


    | | |

    |---|---|

    | **主模式** | • 协商在对等体之间交换六条消息。<br>• 这些交换定义了哪些加密和认证协议是可接受的、密钥应保持激活多长时间，以及是否应强制执行完美前向保密（PFS）。
    |

    | **激进模式** | • 协商在对等体之间交换三条消息。<br>• 发起方传递 SA 所需的全部数据。<br>• 响应方在下一个数据包中发送提议、密钥材料和
    ID，并认证会话。<br>• 发起方通过认证会话进行回复。 |


    **注意：** 主模式保护对等体的身份，而激进模式不保护。使用主模式还是激进模式是在性能和安全之间进行权衡。


    本章涵盖以下主题：


    ## 站点到站点 IPsec VPN


    - IPsec VPN 协商步骤

    - 规划 IPsec VPN

    - 密码套件选项


    ## 配置 IOS 站点到站点 VPN


    - 验证 VPN 隧道

    - 使用 IOS 示例配置站点到站点 IPsec VPN

    - 使用 CCP 示例配置站点到站点 IPsec VPN

    - 使用 CCP 生成镜像配置

    - 测试和监控 IPsec VPN

    - 使用 CCP 监控已建立的 IPsec VPN 连接


    ## 站点到站点 IPsec VPN


    各类组织在跨越公共和私有网络实施企业网络时，通常都会部署站点到站点虚拟专用网络（VPN）。基于 Internet 的 VPN 环境和多协议标签交换（MPLS）VPN
    环境受益于部署的灵活性和基于标准的密码机制实现。


    终止 VPN 的设备选择成为实施站点到站点 VPN 的关键因素。组织可以通过利用现有网络元素和采用集成方法进行 VPN 部署而受益。本课重点介绍在 IP 安全（IPsec）环境中使用
    Cisco IOS 路由器作为站点到站点 VPN 终止点。


    ### IPsec VPN 协商步骤


    IPsec VPN 协商可分为五个步骤，包括 Internet 密钥交换（IKE）的阶段 1 和阶段 2：


    - 1. 当主机向目标主机发送“感兴趣”流量时，IPsec 隧道即被发起。当流量在 IPsec 对等体之间传输并满足加密 ACL 中定义的标准时，该流量被视为感兴趣流量。

    - 2. 感兴趣流量发起对等路由器之间的 IKE 阶段 1。IPsec 对等体协商已建立的 IKE 安全关联（SA）策略。一旦对等体通过认证，就会使用 Internet
    安全关联和密钥管理协议（ISAKMP）创建安全隧道。

    - 3. 然后对等体进入 IKE 阶段 2。IPsec 对等体使用经过认证的安全隧道协商 IPsec SA 转换。共享策略的协商决定 IPsec 隧道的建立方式。

    - 4. IPsec 隧道创建后，数据根据 IPsec 转换集中配置的 IPsec 参数在对等体之间传输。

    - 5. 当 IPsec SA 被删除或其生存期到期时，IPsec 隧道终止。


    ### 规划 IPsec VPN


    在规划部署站点到站点 IPsec VPN 时，请记住以下事项：


    | | |

    |---|---|

    | **验证对等体之间的连通性** | 确保 IP 协议 50（ESP）和 51（AH）以及 UDP 端口 500（ISAKMP）流量被允许，且不被访问控制列表（ACL）阻止。
    |

    | **定义感兴趣流量** | 定义哪些流量将触发 VPN 会话（感兴趣流量），哪些流量将在隧道外传输（非感兴趣流量）。 |

    | **确定密码套件要求** | 选择适合组织网络安全策略的密码。 |

    | **管理监控、故障排除和变更** | 在规划过程中考虑这三个方面。 |


    感兴趣流量由站点到站点 IPsec VPN 配置中的加密 ACL 定义。

    加密 ACL 执行以下功能：


    | | |

    |---|---|

    | **出站** | 选择 IPsec 应保护的出站流量。未被选择的流量以明文发送。 |

    | **入站** | 如果需要，可以创建入站 ACL 来过滤和丢弃本应由 IPsec 保护的流量。 |


    **注意：** 与 ACL 中允许（permit）操作匹配的流量受到保护并通过 VPN 发送。与 ACL 中拒绝（deny）操作匹配的流量以明文形式在 VPN
    之外发送。


    '
