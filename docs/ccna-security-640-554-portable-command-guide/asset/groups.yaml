    to a root-inconsistent state (blocked).<br>• The port recovers as soon as the
    offending BPDUs cease.<br>• It should be configured on user-facing ports and switch
    ports that connect to switches (but which should not be the root bridge). |


    **NOTE:** Another STP enhancement is the BPDU filter feature, which stops the
    sending and receiving of BPDUs on a port. However, you should not configure this
    if BPDU guard is enabled.


    **NOTE:** BPDU guard and root guard are similar, but their impact is different.
    BPDU guard disables the port, and it must be enabled manually. Root guard disables
    the port but recovers once the offending device ceases to send superior BPDUs.


    # Configuring STP Enhancement Features


    You can enable PortFast globally or individually on an access port:


    | Command | Description |

