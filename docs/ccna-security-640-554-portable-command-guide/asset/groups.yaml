    To configure basic interzone policies using CCP, follow these steps:


    - 1. Start the Basic Firewall Wizard.

    - 2. Select trusted and untrusted interfaces.

    - 3. Review and verify resulting policies.

    - 4. (Optional) Enable logging.

    - 5. View firewall status and activity.

    - 6. (Optional) Modify basic policy objects.


    **NOTE:** LAN and WAN configurations must be completed before using the Firewall
    Wizard.


    Use the Basic Firewall Wizard to configure a basic firewall. Choose **Configure
    > Security > Firewall > Firewall > Create Firewall > Basic Firewall** to open
    the Basic Firewall Wizard. Figure 12-2 shows the Basic Firewall Wizard screen.


