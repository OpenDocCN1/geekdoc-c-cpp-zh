  - '[PAGE 48]


    3. TrustSec can also provide data confidentiality by using MACSec. For example,
    if a policy requires that data should be secured, Cisco TrustSec understands this
    policy and dynamically encrypts the user data.


    # Cisco AnyConnect


    Cisco AnyConnect protects mobile employees on PC-based or smartphone platforms
    using an SSL or IP Security (IPSec) virtual private network (VPN) to deliver a
    more seamless, always-on, and always-protected experience to end users, while
    enabling IT administrators to enforce policies and block malware with cloud-based
    or hybrid web security.


    Cisco AnyConnect provides the following:


    +   - Device support regardless of device type (for example, PC, laptop, smart
    phone, tablet, or PDA)

    +   - Multifunctional security by combining multiple security controls in one
    client application

    +   - Consistent experience by providing an always-on intelligent connection for
    seamless experience and performance


    # Cisco Security Intelligence Operations


    Cisco Security Intelligence Operations (SIO) is a security intelligence center
    that baselines the current global state of threats and provides the network with
    valuable information to detect, prevent, and react to threats. It operates as
    an early-warning system by correlating threat information from the SensorBase,
    analyzed by the Threat Operations Center. This information is then provided to
    enforcement devices such as Cisco Adaptive Security Appliance (ASA), Integrated
    Services Router (ISR), and IPS device for real-time threat prevention.


    # Threat Control and Containment


    The Cisco threat control and containment solution regulates network access, isolates
    infected systems, prevents intrusions, and protects critical business assets.
    This solution counteracts malicious traffic before it affects a business.


    Threat prevention products include the following:


    | Product | Description |

    |---|---|

    | Cisco ASAs | The Adaptive Security Appliance devices provide proven firewall
    services and integration of VPN and IPS technologies. |

    | Cisco ISRs | Integrated Services Routers provide network security controls using
    zone-based policy firewall (ZPF), IOS IPS, and VPN technologies. |

    | Cisco IPS | Intrusion prevention is provided using dedicated appliances or is
    integrated into ASA and ISR devices. These IPS sensors support a variety of IPS
    technologies, including signature-based, anomaly-based, policy-based, and reputation-based
    techniques. |'
  - '[PAGE 49]


    # Cloud Security and Data-Loss Prevention


    Adding to the complexity of securing a network is the fact that many modern network
    designs now incorporate cloud computing. Threats in cloud computing include the
    following:


    +   - Abuse of cloud computing

    +   - Account or service hijacking

    +   - Data loss in the cloud

    +   - Unsecure interfaces and application programming interfaces (APIs)

    +   - Malicious insiders


    Administrators, because they are ultimately responsible for data residing on networks
    over which they have no control, must also consider the consequences if the cloud
    environment is not properly secured.


    Two following traditional key services must now be secured in the cloud:


    | Service | Description |

    |---|---|

    | Securing web access | Cisco ScanSafe Web Security is a cloud-based solution
    that analyzes every web request to determine whether content is malicious, inappropriate,
    or acceptable based on the defined security policy. |

    |  | Cisco IronPort Web Security integrates web-usage controls, data security,
    and reputation and malware filtering. It applies Cisco SIO and global threat technology,
    combats sophisticated web-based threats with layered security technology, and
    supports built-in management for visibility of threat-related activity. |

    | Securing email access | Cisco IronPort Email Security provides spam protection,
    data-loss prevention, virus defense, and email encryption. It also helps minimize
    downtime, and simplifies corporate email system administration while offering
    insight into mail system operation. |'
  - '[PAGE 50]


    # ## Secure Connectivity Through VPNs


    There are two VPN-based solutions to implement secure connectivity:


    | Solution | Description |

    |---|---|

    | **Secure communications for remote access** | Provides secure customizable access
    to corporate networks and applications by establishing an SSL or IPSec VPN tunnel
    between the remote host and central site |

    | **Secure communications for site-to-site** | Provides secure site-to-site IPSec
    VPN access between two or more sites |


    # ## Security Management


    Cisco network management systems help automate, simplify, and integrate a network
    to reduce operational costs; improve productivity; and achieve critical functions
    such as availability, responsiveness, resilience, and security.


    The hierarchy of tools available for security management is as follows:


    | Tool | Description |

    |---|---|

    | **Device managers** | Web interface tool that simplifies the configuration and
    monitoring of a single device. |

    | **Cisco Configuration Professional (CCP)** | A GUI-based device management tool
    for ISRs. It simplifies the configuration, monitoring, and troubleshooting of
    LAN/WAN interfaces, routing, firewall settings, IPS, VPN, and unified communications.
    |

    | **Cisco ASA Security Device Manager (ASDM)** | A GUI-based device management
    tool for ASAs that provides the similar features found in CCP. |

    | **Cisco Security Manager** | An enterprise-level application solution to configure
    and manage thousands of firewalls, routers, switches, IPS sensors, and other security
    solutions. Scalability is provided using intelligent policy-based management techniques
    that simplify administration. |'
