    It provides the following:<br><br>▪ Access policy (who, what, when, where, and
    how)<br>▪ Dynamic containment policy<br>▪ Policy for on and off premise |


    # Borderless Security Products


    The architectural approach to security found in the Borderless Network Architecture
    results in distinct categories of Cisco products, technologies, and solutions:


    +   - SecureX and context-aware security

    +   - Threat control and containment

    +   - Cloud security and data-loss prevention

    +   - Secure connectivity through VPNs

    +   - Security management


    # Cisco SecureX Architecture and Context-Aware Security


    To respond to the evolving security needs of today''s borderless network environments,
    Cisco developed the SecureX architecture. It is a new context-aware security architecture
    that enforces security policies across the entire distributed network, not just
    at a single point in the data stream.


    The architecture starts with a solid network technology foundation that ensures
    the network infrastructure is not compromised in any way. It has security enforcement
    elements in the form of appliances, modules, or cloud services built on top. This
    architecture can deal with the full spectrum of devices, ranging from the traditional
    corporate PC or Mac, all the way to next-generation mobile devices such as iPads,
    Androids, or Cisco Cius. With Cisco AnyConnect, security is enforced in the network
    by tethering these myriad devices into the security infrastructure at the most
    optimal point and attaching seamlessly.'
