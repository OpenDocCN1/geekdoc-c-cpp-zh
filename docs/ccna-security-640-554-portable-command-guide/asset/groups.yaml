    but the SSL software is included with all Internet browsers.


    # Cryptanalysis


    Cryptanalysis is the practice of breaking codes to obtain the meaning of encrypted
    data. One of the following methods may be used to decrypt ciphertext:


    | Method | Description |

    |---|---|

    | **Brute-force attack** | - Attacker tries every possible key with the decryption
    algorithm knowing that eventually one of the keys will work.<br>- All encryption
    algorithms are vulnerable to this attack.<br>- On average, a brute-force attack
    succeeds about 50 percent of the way through the keyspace (the set of all possible
    keys).<br>- Choose a keyspace large enough so that it takes too much time (and
    money) to accomplish a brute-force attack. |

    | **Ciphertext-only attack** | - Attacker obtains several ciphertext messages.<br>-
    Attacker uses statistical analysis to deduce the key used to encrypt the messages.<br>-
    These kinds of attacks are no longer practical today because modern algorithms
    are resistant to statistical analysis. |

    | **Known-plaintext attack** | - Attacker observes several ciphertext messages
    and also knows something about the plaintext underlying that ciphertext.<br>-
    Attacker uses a brute-force attack to try keys until decryption with the correct
    key produces a meaningful result.<br>- Modern algorithms with enormous keyspaces
    make it unlikely for this attack to succeed. |

    | **Chosen-plaintext attack** | - Attacker chooses the data and observes the ciphertext
    output.<br>- A chosen-plaintext attack is more powerful than a known-plaintext
    attack because the attacker gets to choose the plaintext blocks to encrypt, allowing
    the attacker to choose plaintext that might yield more information about the key.<br>-
    This attack might not be very practical because it is often difficult or impossible
    to capture both the ciphertext and plaintext. |'
