    CoPP 旨在防止不必要的流量压垮路由处理器。CoPP 功能将控制平面视为一个独立实体，具有自己的入站（输入）和出站（输出）端口。由于 CoPP 功能将控制平面视为独立实体，因此可以建立一组规则并将其与控制平面的入站和出站端口相关联。\n\
    \nCoPP 包含以下功能：\n\n| 功能 | 描述 |\n| --- | --- |\n| **CoPP** | 控制平面管制允许用户配置 QoS 过滤器，以管理控制平面数据包的流量。这可以保护控制平面免受侦察和\
