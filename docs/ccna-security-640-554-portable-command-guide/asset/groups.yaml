    Total VPN Peers                   : 25         perpetual

    Shared License                    : Disabled   perpetual

    AnyConnect for Mobile             : Disabled   perpetual

    AnyConnect for Cisco VPN Phone    : Disabled   perpetual

    Advanced Endpoint Assessment      : Disabled   perpetual

    UC Phone Proxy Sessions           : 2          perpetual

    Total UC Proxy Sessions           : 2          perpetual

    Botnet Traffic Filter             : Disabled   perpetual

    Intercompany Media Engine         : Disabled   perpetual


    This platform has a Base license.


    Serial Number: TMX15364077

    Running Permanent Activation Key: 0x970bc671 0x305cf569 0x70d21158

    0x6ec2c9 0x8a003afb

    Configuration register is 0x41 (will be 0x1 at next reload)

    Configuration last modified by enable_15 at 10:03:12.749 UTC Fri Sep 23

    2011

    ciscoasa#

    ```


    **NOTE:** Additional optional licenses (for example, AnyConnect Premium license)
    or time-based (for example, Botnet Traffic Filter license) can be purchased.


    **NOTE:** Preinstalled licenses combined with additional licenses create a permanent
    license that needs to be activated using the activation-key command. The product
    activation key is purchased from a Cisco account representative.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_271_0.png)


    **Figure 18-2** ASA 5505 Back Panel


    The back panel features of the ASA 5505 are numbered in Figure 18-2 as follows:


    | No. | Feature | Description |

    |---|---|---|

    | 1 | **Power connector** | Requires a 48 VDC adapter. |

    | 2 | **SSC slot** | Can add IPS features using the Cisco Advanced Inspection
    and Prevention Security Services Card (AIP-SSC). |

    | 3 | **Console port** | To initially configure the appliance. |

    | 4 | **Lock slot** | To physically secure the appliance. |

    | 5 | **Reset button** | The Reset button is disabled by default. |

    | 6 | **USB ports** | A total of three USB ports can be used to enable additional
    services and capabilities (two USB ports on the back and one on the front). |

    | 7–8 | **Eight-port Fast Ethernet switch** | Each port can be grouped to create
    up to three separate VLANs (or zones) to support network segmentation and security.
    Ports 6 and 7 are Power over Ethernet (PoE) ports. |


    ## ASA 5510 Front and Back Panel


    The ASA 5510 supports 300-Mbps throughput and 9,000 firewall connections per second
    capacity, making it very suitable for most office requirements. Cisco ASA 5510,
    5520, 5540, and 5550 are all one-rack units (1RUs). Each of these has an expansion
    slot for security-services modules (SSMs). The front panel of the ASA 5510 features
    Power, Status, Active, VPN, and Flash LEDs. The ASA 5510 front panel and back
    panel are highlighted in Figure 18-3.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_272_0.png)


    **Figure 18-3** ASA 5510 Front and Back Panel


    The back panel features of the ASA 5510 are numbered in Figure 18-3 as follows:


    | No. | Feature | Description |

    |---|---|---|

    | 1 | **SSM** | The SSM can be used to add the following:<br>• 4-Port Gigabit
    Ethernet Security Services Module (4GE SSM)<br>• Advanced Inspection and Prevention
    Security Services Module (AIP-SSM)<br>• Series Content Security and Control Security
    Services Module (CSC-SSM) |

    | 2 | **USB ports** | Two USB ports can be used to enable additional services
    and capabilities. |

    | 3 | **OOB management interface** | A dedicated Fast Ethernet out-of-band (OOB)
    management interface. |

    | 4 | **Four Fast Ethernet interfaces** | By default, interfaces Fa0/0 through
    Fa0/2 are enabled, but Fa0/3 is disabled.<br><br>The OOB interface could also
    be used as a fifth Fast Ethernet port (ASA software must support). |

    | 5 | **Flash card slot** | Provides storage for system images and configuration
    files. |

    | 6 | **LED indicators** | Power, Status, Active, VPN, and Flash LED indicators.
    |

    | 7 | **Management ports** | A console port for the initial configuration.<br><br>An
    auxiliary port could be used for OOB management. |


    ## ASA Security Levels


    The building blocks of ASA security are assigning interfaces to security levels
    to distinguish between inside (trusted) and outside (untrusted) networks:


    - Security levels define the level of trustworthiness of an interface.

    - The higher the level, the more trusted the interface.

