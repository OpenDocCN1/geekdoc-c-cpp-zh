    # Configuring IOS Site-to-Site VPNs


    To configure a site-to-site VPN using the IOS command-line interface (CLI), complete
    the following steps:


    +   1. Create an IKE policy and configure the required Phase 1 parameters.

    +   2. Specify the PSK and identify the peer address (or hostname).

    +   3. Create the IPsec policy required for Phase 2.

    +   4. Create the crypto map and configure crypto map specifics.

    +   5. Identify interesting traffic using an extended ACL.

    +   6. Apply the crypto map to an interface.

    +   7. Verify the tunnel.


    > **NOTE:** Some of these steps can be done out of order.


    Create an IKE policy.


    ```

    Router(config)#crypto isakmp policy priority


    Define an IKE policy to specify the parameters to be used during IKE negotiation
    to create the IKE SA.


    *priority* uniquely identifies the IKE policy and assigns a priority to the policy.
    Use an integer from 1 to 10,000, with 1 being the highest priority and 10,000
    the lowest.

    ```'
