    \ 身份验证后，用户访问门户页面，并可以访问特定的受支持内部资源。 |\n| **基于客户端的SSL或IPsec VPN** | - SSL或IPsec（IKEv2）VPN远程访问（使用Cisco\
    \ AnyConnect客户端）。<br>- 提供全隧道SSL VPN连接，但需要在主机上安装VPN客户端，例如Cisco AnyConnect VPN客户端。<br>-\
    \ AnyConnect客户端可以手动预装在主机上，也可以通过浏览器按需下载到主机。<br>- 身份验证后，用户的PC会被分配一个内部IP地址，并可以像在本地网络上一样访问网络资源。\
    \ |\n| **IPsec（IKEv1）VPN** | - IPsec（IKEv1）VPN远程访问（使用Cisco VPN客户端）。 |\n\n## ASA\
    \ SSL VPN\n\nASA SSL VPN可以通过以下方式配置：\n\n- ASDM VPN助手\n- ASDM VPN向导\n\n要打开ASDM VPN助手，请选择**配置\
    \ > 远程访问VPN > 简介**，如图22-1所示。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_339_0.png)\n\
    \n图22-1  ASDM VPN助手界面\n\n另外，也可以使用菜单栏启动VPN向导：**向导 > VPN向导 > AnyConnect VPN向导**（见图22-2）。\n\
    \n"
