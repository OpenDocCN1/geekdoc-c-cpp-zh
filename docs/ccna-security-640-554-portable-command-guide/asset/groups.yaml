    # ## Models and Frameworks


    The following frameworks and models are alternatives to the lifecycle approach
    and provide similar security architecture guidance:


    |  |  |

    |---|---|

    | Control Objectives for Information and Related Technology (COBIT) | Includes
    best practices from a consensus of experts that focus on IT controls and IT metrics,
    which is useful for IT governance and audits. These good practices help optimize
    IT-enabled investments, ensure service delivery, and provide a measure against
    which to judge when things do go wrong. |

    | ISO 27000 Standards | Includes a comprehensive set of controls comprising best
    practices in information security. It is also a certified and globally recognized
    information security standard that focuses on risk identification, assessment,
    and management. |

    | Information Technology Infrastructure Library (ITIL) | Includes a set of eight
    practice guidebooks covering most aspects of IT service management. |

    | National Institute of Standards and Technology (NIST) | The NIST 800 series
    provides detailed documents on how to secure a networked infrastructure. It is
    also available for free and is used for FISMA. |


    # ## Assessing and Monitoring the Network Security Posture


    The security posture should be assessed at multiple points of the lifecycle. By
    assessing all aspects of the networked business environment, it is possible to
    determine the ability of the organization to detect, defend against, and respond
    to network attacks.


    Key assessment activities include the following:


    |  |  |

    |---|---|

    | Security posture assessment | Consists of a thorough assessment of the network
    devices, servers, desktops, and databases. Analyzes the effectiveness of the network
    security against recognized industry best practices to identify the relative strengths
    and weaknesses of the environment and document specific vulnerabilities that could
    threaten the business. |

    | Internal assessment | Consists of a controlled network attack on internal systems,
    applications, and network devices and is used to identify steps that are needed
    to prevent intentional attacks or unintentional mistakes from trusted insiders
    to effectively secure valuable information assets. |

    | External assessment | The goal is to quantify the security risk that is associated
    with Internet-connected systems. |

    | Wireless assessment | Tests the wireless network within the organization and
    identifies risks and exposures that are associated with a wireless deployment.
    |'
