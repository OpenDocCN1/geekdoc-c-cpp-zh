    **注意：** 假设 ASA 启动配置文件已被擦除，并且设备已重新加载。


    进入特权 EXEC 模式，然后进入全局配置模式：


    | 命令 | 描述 |

    |---|---|

    | `Pre-configure firewall now through interactive prompts (yes)? no` | 在安装初始化向导提示符下，输入
    **no** 退出向导。 |

    | `ciscoasa> enable`<br>`Password:` | 进入特权 EXEC 模式。当提示输入密码时，按 Enter 键。<br><br>**注意：**
    默认情况下没有启用密码。<br><br>**注意：** 如果 ASA 设备使用默认出厂设置启动，则密码为 **cisco**。 |

    | `ciscoasa# configure terminal` | 进入 ASA 全局配置模式。 |


    **注意：** 首次进入全局配置模式时，会出现一条提示您启用 Smart Call Home 功能的消息。该功能可在部分 Cisco 设备上提供主动诊断和实时警报。


    ## 配置基本管理设置


    配置主机名、域名和特权 EXEC 密码：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# hostname ASA-hostname` | 配置 ASA 主机名。 |

    | `ciscoasa(config)# domain-name`<br>`ASA-domain-name` | 配置域名。 |

    | `ciscoasa(config)# enable password`<br>`password` | 配置特权 EXEC 模式密码。<br><br>**注意：**
    没有 secret 选项。 |


    ## 启用主密码短语


    必须配置并启用主密码短语以加密所有用户密码：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# key config-key password-encryption [new-passphrase (old-passphrase)]`
    | 创建或更改现有的主密码短语。 |

    | | **注意：** 密码短语长度必须为 8 到 128 个字符，除退格键和双引号外的所有字符均可接受。 |

    | | **注意：** 如果命令中未包含新密码短语，ASA 将提示输入。 |

    | | **注意：** 要更改密码短语，必须先输入旧密码短语。 |


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# password encryption aes` | 启用密码加密。 |


    **注意：** 要确定密码加密是否已启用，请使用 `show password encryption` 命令。


    **注意：** 在配置 Telnet、SSH、HTTPS 和静态路由之前，必须先配置接口。


    ## 配置接口


    在 ASA 5510 及更高版本上，路由以太网接口直接配置 IP 配置，与集成服务路由器（ISR）非常相似。但是，ASA 5505 具有集成的八端口二层交换机，因此
    IP 配置通过以下方式完成：


    -   通过分配接口名称、安全级别和 IP 地址来配置内部和外部 SVI

    -   将二层端口分配给内部和外部 SVI VLAN

    -   （可选）如果需要，配置第三个 SVI


    ### 配置内部和外部 SVI


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# interface vlan vlan-id` | 创建 SVI。 |

    | `ciscoasa(config-if)# nameif {inside \| outside \| name}` | 为 SVI 接口分配名称。**注意：**
    使用名称 inside 会自动分配安全级别 100。**注意：** 使用名称 outside 会自动分配安全级别 0。 |

    | `ciscoasa(config-if)# security-level level` | 分配或更改 SVI 安全级别。**注意：** 所有 SVI
    都必须分配安全级别值。**注意：** 内部和外部接口会自动分配安全级别。 |

    | `ciscoasa(config-if)# ip address ip-address netmask` | 为 SVI 分配 IP 地址和掩码。**注意：**
    如果 ASA 配置为动态主机配置协议（DHCP）客户端或以太网点对点协议（PPPoE）客户端，它也可以获取其 IP 和默认路由。 |


    > **注意：** 默认情况下，SVI 处于活动状态，不需要 `no shutdown` 命令。


    ### 将二层端口分配到 VLAN


    必须将二层端口分配到 VLAN。


    > **注意：** 默认情况下，所有端口都是 VLAN 1 的成员。


    因此，要更改默认 VLAN 分配，必须使用以下命令配置二层端口：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# interface interface/number` | 指定一个二层物理端口。 |

    | `ciscoasa(config-if)# switchport access vlan vlan-id` | 将端口的 VLAN 分配从默认的 VLAN
    1 更改。 |

    | `ciscoasa(config-if)# no shutdown` | 启用物理端口。 |


    > **注意：** 二层端口必须启用，因此需要 `no shutdown` 命令。


    **注意：** 要验证 VLAN 设置，请使用 `show switch vlan` 命令。要验证接口设置，请使用 `show interface` 或 `show
    int ip brief` 命令。


    **注意：** ASA 快速以太网接口指定为 Ethernet x/x（例如，E0/0）。


    ### 配置第三个 SVI


    具有 Security Plus 许可证的 ASA 5505 自动支持创建额外的 VLAN 以创建其他区域，例如非军事区（DMZ）区域。但是，具有 Base
    许可证的 ASA 5505 仅支持第三个受限 SVI，该 SVI 被限制为不能主动联系另一个指定 VLAN。


    在具有 Base 许可证的 ASA 5505 上使用以下命令配置第三个 VLAN SVI：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# interface interface/number` | 指定一个二层物理端口。 |

    | `ciscoasa(config-if)# no forward interface vlan vlan-id` | 限制该接口主动联系另一个 VLAN。
    |


    > **注意：** `vlan-id` 参数指定此 VLAN 接口不能主动发起流量的 VLAN ID。


    > **注意：** 必须在接口命名之前配置此命令。


    > **注意：** 在配置内部和外部 VLAN 接口后，在第三个 SVI 上配置此命令。


    ## 配置管理平面


    ### 启用 Telnet、SSH 和 HTTPS 访问


    可以将 ASA 配置为接受来自内部网络上单个主机或主机范围的 Telnet 连接。使用以下命令启用 Telnet 服务：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# passwd password` | 配置 Telnet / SSH 密码。 |

    | `ciscoasa(config)# telnet ip-address subnet-mask interface-name` | 指定哪些内部主机可以
    Telnet 到哪个 ASA 接口。 |

    | `ciscoasa(config)# telnet timeout minutes` | 更改默认的 5 分钟 EXEC 超时时间。 |


    或者，可以将 Telnet 配置为使用认证、授权和计费（AAA）认证：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# username name password`<br>`password` | 创建本地数据库条目。 |

    | `ciscoasa(config)# aaa authentication`<br>`telnet console LOCAL` | 配置 Telnet
    以参考本地数据库进行认证。 |


    也支持安全外壳（SSH），但需要启用 AAA 认证。使用以下命令启用 SSH 支持：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# aaa authentication`<br>`ssh console LOCAL` | 配置 SSH 以参考本地数据库进行认证。
    |

    | | **注意：** `LOCAL` 关键字区分大小写，并且是预定义的服务器标签。 |

    | `ciscoasa(config)# crypto key`<br>`generate rsa modulus modulus` | 生成 SSH 加密所需的
    RSA 密钥。 |

    | | **注意：** 有效的模数值包括 512、768、1024 和 2048。建议使用较高的模数值。 |

    | `ciscoasa(config)# ssh ip-address`<br>`subnet-mask interface-name` | 指定哪些内部主机可以
    SSH 到哪个 ASA 接口。 |

    | `ciscoasa(config)# ssh timeout minutes` | 更改默认的 5 分钟 EXEC 超时时间。 |


    **注意：** 要验证 SSH 配置，请使用 `show ssh` 命令。


    在 ASA 上启用 HTTPS 服务：


    | 命令 | 描述 |

    |---|---|

    | `ciscoasa(config)# http server`<br>`enable` | 启用 ASA HTTP 服务器。 |

    | `ciscoasa(config)# http ip-address`<br>`network-mask interface-name` | 指定可以使用
    ASDM 访问 ASA HTTP 服务器的主机。 |


    **注意：** 要移除并禁用 ASA HTTP 服务器服务，请使用 `clear configure http` 全局配置命令。


