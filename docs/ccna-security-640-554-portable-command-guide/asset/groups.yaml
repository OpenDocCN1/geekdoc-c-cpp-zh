    Figure 12-3  Basic Firewall Configuration Wizard Window


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_183_0.png)


    **Figure 12-5** Basic Firewall Security Configuration Window


    | Security Level | Description |

    |---|---|

    | **High Security** | Option provides the highest level of security and makes
    the router:<br><br>- Drop instant messaging and peer-to-peer traffic<br>- Inspect
    HTTP and email traffic and drops noncompliant traffic<br>- Permits TCP and UDP
    return traffic initiated by inside users |

    | **Medium Security** | Option tracks the use of applications on the network and
    the router:<br><br>- Identifies instant messaging and peer-to-peer traffic<br>-
    Inspects HTTP traffic and email traffic for protocol compliance<br>- Permits TCP
    and UDP return traffic initiated by inside users |

    | **Low Security** | Option provides the lowest level of security and makes the
    router:<br><br>- Permit TCP and UDP return traffic initiated by inside users |


