    \nCisco MPF使用这三个配置对象来定义模块化、面向对象、分层的策略，如图21-26所示。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_333_0.png)\n\
    \n**图21-26**  模块化策略框架\n\n**注意：** 尽管MPF语法类似于IOS Cisco模块化QoS CLI（MQC）语法和Cisco通用分类策略语言（C3PL）语法，但可配置参数有所不同。例如，ASA提供了更多可配置的操作，并支持第5-7层检查。\n\
    \n要在ASA上配置MPF，必须完成以下四个步骤：\n\n1. 可选地配置扩展ACL，以识别特定的细粒度流量。\n2. 配置类映射以识别流量。\n3. 配置策略映射以对这些类映射应用操作。\n\
    4. 配置服务策略以将策略映射附加到接口。\n\n## 类映射、策略映射和服务策略\n\n创建类映射以识别特定的第3/4层流量：\n\n| 命令 | 描述\
    \ |\n|---|---|\n| `ciscoasa(config)# class-map class-map-name` | 创建第3层或第4层类映射，并进入类映射配置模式。\
