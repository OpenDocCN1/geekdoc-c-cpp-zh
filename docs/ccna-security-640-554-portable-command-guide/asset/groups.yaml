    # Security Policy Audience Responsibilities


    Key individuals in an organization responsible for the security policy are as
    follows:


    | Audience | Responsibility |

    |---|---|

    | Senior management (CEO) | Is ultimately responsible for the security policy
    |

    | Senior security IT management (CSO, CIO, CISO) | Are responsible for the security
    policy |

    | Senior security IT staff | Have input on the security policy and possibly draft
    sections of the security policy. |

    | Security IT staff | Are responsible for implementing the security policy |

    | End-users | Are responsible for complying with the security policy |


    # Security Awareness


    An effective computer security awareness and training program requires proper
    planning, implementation, maintenance, and periodic evaluation. In general, a
    computer security awareness and training program should encompass the following
    seven steps:


    +   1. Identify program scope, goals, and objectives.

    +   2. Identify training staff.

    +   3. Identify target audiences.

    +   4. Motivate management and employees.

    +   5. Administer the program.

    +   6. Maintain the program.

    +   7. Evaluate the program.


    # Secure Network Lifecycle Management


    The lifecycle approach may also help you understand the framing of information
    security.'
