  mdcn: "\n## Cisco 安全情报运营\n\n全局关联可通过 Cisco 安全情报运营（SIO）中心实现，该中心会为恶意软件爆发、当前漏洞和零日攻击等威胁的当前全球状态建立基线。它通过关联来自\
    \ SensorBase 的威胁信息，为网络系统提供有价值的信息，以检测、阻止和响应威胁。然后，它将这些信息提供给执行组件，用于实时威胁防御。\n\n##\
    \ 配置 ACL 以缓解威胁\n\n本章涵盖以下主题：\n\n- **访问控制列表**\n  - 使用 ACL 缓解威胁\n  - ACL 设计指南\n \
    \ - ACL 操作\n- **配置 ACL**\n  - ACL 配置指南\n  - 使用编号扩展 ACL 进行过滤\n  - 配置编号扩展 ACL 示例\n\
    \  - 使用命名扩展 ACL 进行过滤\n  - 配置命名扩展 ACL 示例\n  - 使用 CCP 配置扩展 ACL 示例\n- **使用对象组增强 ACL\
    \ 保护**\n  - 网络对象组\n  - 服务对象组\n  - 在扩展 ACL 中使用对象组\n  - 在 ACL 中配置对象组示例\n  - 使用 CCP\
    \ 在 ACL 中配置对象组示例\n- **IPv6 中的 ACL**\n  - 使用 ACL 缓解 IPv6 攻击\n  - IPv6 ACL 隐式条目\n\
    \  - 使用 IPv6 ACL 进行过滤\n  - 配置 IPv6 ACL 示例\n\n### 访问控制列表\n\n访问控制列表（ACL）为路由器和防火墙提供数据包过滤，以保护内部网络免受外部世界影响，并过滤离开内部网络的流量。\n\
    \nACL 在两个方向上工作：\n\n| ACL 方向 | 描述 |\n|---|---|\n| **入站 ACL** | 传入数据包在路由到出站接口之前进行处理。\
    \ |\n| **出站 ACL** | 传入数据包被路由到出站接口，然后通过出站 ACL 进行处理。 |\n\n**注意：** 入站 ACL 通常更高效，因为它们不会对拒绝的数据包执行路由查找。只有允许的数据包才会进行路由处理。\n\
    \n路由器支持两种类型的 ACL：\n\n| ACL 类型 | 规则 |\n|---|---|\n| **标准 ACL** | - 仅根据源地址过滤 IP\
    \ 数据包。<br>- ACL 可以编号或命名。<br>- 有效编号范围包括 1–99 和 1300–1999。 |\n| **扩展 ACL** | - 根据协议、源地址和目的地址、源\
    \ UDP 和 TCP 端口以及目的 UDP 和 TCP 端口，以及 ICMP 和 Internet 组管理协议（IGMP）消息类型过滤 IP 数据包。<br>-\
    \ ACL 可以编号或命名。<br>- 有效编号范围包括 100–199 和 2000–2699。 |\n\n**注意：** 编号 ACL 使用 `access-list`\
    \ 全局配置命令配置。可以使用 `ip access-list` 命令编辑编号 ACL。新的 ACL 条目会追加到 ACL 末尾。\n\n标准和扩展 ACL\
    \ 可以命名。命名 ACL 很有用，因为它们提供了关于 ACL 用途的提示。名称可以是字母数字，但必须以字母字符开头。此外，名称不能包含空格或标点符号。\n\
    \n**注意：** 命名 ACL 使用 `ip access-list` 全局配置命令配置。\n\n**提示：** 使用大写字母可使命名 ACL 在配置中更醒目。\n\
    \n**提示：** 可以使用 `ip access-list` 命令编辑编号 ACL 和命名 ACL。\n\n### 配置编号扩展 ACL 示例\n\n图\
    \ 11-1 显示了编号扩展 ACL 示例的网络拓扑。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_154_0.png)\n\
    \n**图 11-1** 编号扩展 ACL 示例的网络拓扑\n\n| 命令 | 描述 |\n|---|---|\n| `R1(config)#access-list\
    \ 100` | 定义扩展 ACL 100。 |\n| `R1(config)#access-list 100 remark Basic anti-spoofing\
    \ ACL` | 记录 ACL 的用途。 |\n| `R1(config)#access-list 100 deny ip 209.165.200.224\
    \ 0.0.0.31 any` | 拒绝源地址与内部子网相同的传入流量。 |\n| `R1(config)#access-list 100 permit tcp\
    \ any host 209.165.200.254 eq 80` | 允许 HTTP Web 流量到达服务器。 |\n| `R1(config)#interface\
    \ serial 0/0/0` | 进入串行接口的接口配置模式。 |\n| `R1(config-if)#ip access-group 100 in` |\
    \ 在外部串行接口上以入站方向应用 ACL 100。 |\n\n### 使用命名扩展 ACL 进行过滤\n\n| 命令 | 描述 |\n|---|---|\n\
    | `Router(config)#ip access-list extended {access-list-number \\| access-list-name}`\
    \ | 定义命名 ACL。该命令也可用于编辑编号 ACL。 |\n| `Router(config-ext-nacl)#permit protocol source\
    \ source-wildcard [operator port] destination destination-wildcard [operator port]\
    \ [established] [log]` | 定义 permit 语句。 |\n| `Router(config-ext-nacl)#deny protocol\
    \ source source-wildcard [operator port] destination destination-wildcard [operator\
    \ port] [log]` | 定义 deny 语句。**注意** 参数将因所配置的 ACL 协议而异。 |\n| `Router(config)#interface\
    \ type number` | 指定接口类型和编号，并进入接口配置模式。 |\n| `Router(config-if)#ip access-group\
    \ access-list-name {in \\| out}` | 将指定的 ACL 应用到接口。 |\n\n### 配置命名扩展 ACL 示例\n\n\
    | 命令 | 描述 |\n|---|---|\n| `R1(config)#ip access-list extended ACL-IN` | 定义名为 ACL-IN\
    \ 的扩展 ACL。 |\n| `R1(config-ext-nacl)#remark Basic anti-spoofing ACL` | 记录 ACL。\
    \ |\n| `R1(config-ext-nacl)#deny ip 209.165.200.224 0.0.0.31 any` | 拒绝源地址与内部子网相同的传入流量。\
    \ |\n| `R1(config-ext-nacl)#permit tcp any host 209.165.200.254 eq 80` | 允许 HTTP\
    \ Web 流量到达服务器。 |\n| `R1(config-ext-nacl)#permit ip any host 209.165.200.254` |\
    \ 允许流量到达服务器。 |\n| `R1(config)#interface serial 0/0/0` | 将 ACL-IN 应用到串行接口。 |\n\
    | `R1(config-if)#ip access-group ACL-IN in` | 在外部接口上以入站方向应用该 ACL。 |\n\n**注意：**\
    \ 要验证 ACL，请使用 show access-lists、show ip access-lists 和 show ip interfaces 命令。\n\
    \n**提示：** 在 ACE 末尾追加 log 关键字，以便每次流满足 ACE 条件时生成系统消息（106100）。使用 show access-lists\
    \ 或 show ip access-lists 命令显示命中次数。\n\n### 使用 CCP 配置扩展 ACL 示例\n\n在 Cisco Configuration\
    \ Professional（CCP）中，规则定义路由器如何响应特定类型的流量。规则有多种类型，例如访问规则、网络地址转换（NAT）规则、IPsec 规则、默认规则、外部规则，以及语法不受\
    \ CCP 支持的规则（称为不受支持的规则）。ACL 用于帮助定义和执行规则。\n\nACL 可用于对流量进行分类。本章重点介绍应用于接口以进行过滤的 ACL。\n\
    \n使用 ACL 编辑器屏幕创建、编辑或删除规则。\n\n选择 Configure > Router > ACL > ACL Editor 以显示图 11-2\
    \ 所示的 ACL 编辑器屏幕。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_156_0.png)\n\n**图\
    \ 11-2** ACL 编辑器屏幕\n\nACL 编辑器最常用于定义你希望允许或拒绝进入 LAN 或离开 LAN 的流量。屏幕上半部分列出已在此路由器上配置的访问规则。窗口下半部分列出与所选规则关联的规则条目。规则条目由用于比较传入或传出流量的条件以及针对匹配该条件的流量所采取的操作组成。如果流量不匹配此框中任何条目的条件，则会被丢弃。\n\
    \n要添加新的访问规则，请点击 *添加*。\n\n将出现“添加规则”对话框，如图 11-3 左侧所示。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_158_0.png)\n\
    \n**图 11-4** “与接口关联”窗口\n\n选择接口，指定方向，然后点击 **确定** 返回“添加规则”对话框。\n\n**注意：** 如果另一个规则已与该接口关联，则会出现信息框。可以取消操作，或者继续操作，将规则条目追加到已应用于该接口的规则中。\n\
    \n检查该规则，完成后点击 **确定**。\n\nCCP 显示命令行界面（CLI）配置命令。点击 **交付** 以提交配置更改。\n\n“访问规则”信息屏幕显示新创建的规则。\n\
    \n**注意：** 此屏幕中可显示多个规则。选择规则以查看与其关联的具体信息。\n\n**注意：** 要查看日志条目，请点击 Monitor > Security\
    \ > Firewall Status。\n"
