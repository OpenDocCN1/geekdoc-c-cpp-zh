  mdcn: "\n\n## ACL与专用VLAN\n\n| 特性 | 描述 |\n|---|---|\n| **用于二层端口的基于端口的ACL** | 可以在单个交换机端口上应用安全策略。\
    \ |\n| **专用VLAN** | 专用VLAN通过在二层隔离流量，将广播网段转变为类似非广播多路访问的网段，从而限制同一网段中主机之间的流量。 |\n\
    | **专用VLAN边缘** | 专用VLAN边缘在交换机端口之间提供安全性和隔离，有助于确保用户无法窥探其他用户的流量。 |\n\n## 思科集成安全特性\n\
    \n思科集成安全特性是易于使用的工具，可有效防止可能造成破坏的二层安全威胁。特性包括前面介绍的端口安全和DHCP侦听、动态ARP检测以及IP源防护。\n\n\
    | 特性 | 描述 |\n|---|---|\n| **DHCP侦听** | 防止恶意用户伪造动态主机配置协议（DHCP）服务器并发送虚假地址。其他主要安全特性使用此功能来防止多种其他攻击，例如ARP欺骗。\
    \ |\n| **动态ARP检测** | 动态ARP检测（DAI）通过防止恶意用户利用ARP协议的不安全特性，帮助确保用户完整性。 |\n| **IP源防护**\
    \ | IP源防护可防止恶意用户伪造或接管其他用户的IP地址。它通过在客户端的IP与MAC地址、端口和VLAN之间创建绑定表来实现。 |\n\n## 保护交换机管理平面\n\
    \n正如思科路由器上的管理平面受到保护一样，二层交换管理平面也必须受到保护。可以使用许多相同的工具来保护Catalyst交换机上的管理平面。\n\n保护管理平面的工具包括（但不限于）以下内容：\n\
    \n|  |  |\n|---|---|\n| 安全管理协议 | SSH和SNMPv3通过在SSH和SNMP会话期间加密管理员流量来提供网络安全。 |\n\
    | SPAN支持 | 交换端口分析器（SPAN）端口上的双向数据支持使思科入侵检测系统（IDS）能够在检测到入侵者时采取行动。 |\n| AAA | TACACS+和RADIUS认证有助于实现对交换机的集中控制，并限制未授权用户更改配置。\
    \ |\n| RBAC | 借助基于角色的访问控制（RBAC），控制台访问的多级安全可防止未授权用户更改交换机配置。 |\n| MAC地址通知 | MAC地址通知允许管理员获知用户加入或离开网络的通知。\
    \ |\n| 多域认证 | 此功能允许IP电话和PC在同一交换机端口上进行认证，同时将它们置于相应的语音和数据VLAN中。 |\n\n## 第9章：保护IPv6环境中的数据平面\n\
    \n本章涵盖以下主题：\n\n- **IPv6概述**\n  - IPv4与IPv6的比较\n  - IPv6报头\n  - ICMPv6\n  - 无状态自动配置\n\
    \  - IPv4到IPv6过渡解决方案\n  - IPv6路由解决方案\n- **IPv6威胁**\n  - IPv6漏洞\n- **IPv6安全策略**\n\
    \  - 配置入口过滤\n  - 安全过渡机制\n  - 未来安全增强\n\n### IPv6概述\n\nIPv4与IPv6的比较\n\n| IP服务 |\
    \ IPv4 | IPv6 |\n|---|---|---|\n| IP报头 | 由包含多个字段的20字节字段组成。 | 由包含较少字段的40字节字段组成，因而更简单，并提供更好的路由效率。\
    \ |\n| 地址范围 | 需要32位点分十进制地址来提供4.3×10^9（43亿）个地址。 | 需要128位十六进制地址来提供具有多个作用域的3.4×10^28个地址。\
    \ |\n| 地址类型 | 包括单播、组播和广播地址。 | 包括单播、组播和任播地址。没有广播地址意味着不易受广播风暴影响。 |\n\n与IPv4协议字段类似，IPv6下一报头标识扩展报头，且长度不固定。它可以包含附加信息，例如逐跳目的地列表、路由报头（RH）、IPsec信息等。所有扩展报头以菊花链方式串联，每个报头指向下一个报头，直到到达传输层数据。这种安排允许为IPv6数据包定制特性和功能（例如TCP、UDP、ICMPv6）。\n\
    \n> **注意** 攻击者可能将这些扩展报头用于恶意目的。\n\n### ICMPv6\n\n互联网控制消息协议（ICMP）在IPv6中发挥更大作用。\n\
    \n| ICMP消息类型 | ICMPv4 | ICMPv6 |\n|---|---|---|\n| 连通性检查 | ✓ | ✓ |\n| 信息/错误消息传递\
    \ | ✓ | ✓ |\n| 需要分片的通知 | ✓ | ✓ |\n| 地址分配 |  | ✓ |\n| 地址解析 |  | ✓ |\n| 路由器发现 |\
    \  | ✓ |\n| 组播组管理 |  | ✓ |\n| 移动IPv6支持 |  | ✓ |\n\nICMPv6用于邻居发现和路由器发现。\n\n| ICMPv6消息\
    \ | 类型 | 描述 |\n|---|---:|---|\n| 邻居请求（NS） | 135 | 与IPv4地址解析协议（ARP）类似，由主机发送以确定邻居的链路层地址。<br><br>用于验证邻居仍然可达。<br><br>NS还用于重复地址检测（DAD）。\
    \ |\n| 邻居通告（NA） | 136 | 对NS消息的响应。<br><br>节点还可以发送未经请求的NA，以通告链路层地址变更。 |\n| 路由器通告（RA）\
    \ | 134 | RA包含用于地址配置的前缀，包括跳数限制值、最大传输单元（MTU）值等。<br><br>RA定期发送，或响应RS消息发送。 |\n| 路由器请求（RS）\
    \ | 133 | 当主机启动时，它会发送RS，请求路由器立即生成RA，而不是等待其下一个计划时间。 |\n\n> **注意：** 攻击者可能操纵ICMPv6用于恶意目的。\n\
    \n### 无状态自动配置\n\n无状态自动配置支持无需使用服务器即可对IPv6设备进行即插即用配置。它使用邻居发现协议（NDP），该协议基于ICMP第6版（ICMPv6）协议消息传递。NDP使用ICMPv6\
    \ RS和RA消息。\n\n> **注意：** NDP取代ARP，并且与IPv4网络上的ARP和DHCP一样，存在缺乏认证的问题。\n\n### IPv4到IPv6过渡解决方案\n\
    \n许多过渡机制可实现IPv4和IPv6的平滑集成。还提供其他允许IPv4节点与IPv6节点通信的机制。所有这些机制适用于不同情况。\n\n从IPv4过渡到IPv6的三种最常见技术如下：\n\
    \n| 技术 | 描述 |\n|---|---|\n| **双栈** | 主机配置有IPv4和IPv6网络地址。因此，该节点及其相应路由器具有两个协议栈。\
    \ |\n| **隧道** | **手动IPv6-over-IPv4隧道**是一种集成方法，其中IPv6数据包封装在IPv4协议内。此方法需要双栈路由器。<br><br>**动态6to4隧道**是一种通过IPv4网络自动建立IPv6孤岛连接的方法。<br><br>**站点内自动隧道寻址协议（ISATAP）隧道**是一种自动虚拟隧道机制，使用底层IPv4网络作为IPv6的数据链路层。<br><br>**Teredo隧道**是一种IPv6过渡技术，提供主机到主机的自动隧道，而不是网关隧道。\
    \ |\n| **代理与转换（NAT-PT）** | 此转换机制位于IPv6网络和IPv4网络之间。转换器的工作是将IPv6数据包转换为IPv4数据包，反之亦然。\
    \ |\n\n### IPv6路由解决方案\n\nIPv6支持静态路由、下一代路由信息协议（RIPng）、开放最短路径优先第3版（OSPFv3）协议、用于IPv6的中间系统到中间系统协议（IS-IS）、多协议边界网关协议第4版（MP-BGP4）以及用于IPv6的增强型内部网关路由协议（EIGRP）。必须先配置\
    \ ipv6 unicast-routing，支持IPv6的路由协议或IPv6静态路由才能正常工作。\n\n"
