    \n| Command | Description |\n| --- | --- |\n| `ciscoasa(config-pmap)# class`<br>`class-map-name`\
    \ | Assign a class map to a policy map where you can assign actions to the class\
    \ map traffic and enter config policy map class mode.<br><br>**NOTE:** The class\
    \ name `class-default` is a reserved name. |\n\n**NOTE:** The `description` keyword\
    \ could be used to document the policy map.\n\nAssign one of the following actions:\n\
    \n| Command | Description |\n| --- | --- |\n| `ciscoasa(config-pmap-c)# set connection`\
    \ | Configure connection parameters. |\n| `ciscoasa(config-pmap-c)# police {input\
    \ \\| output} rate-bps` | Rate-limit traffic for this class. |\n| `ciscoasa(config-pmap-c)#\
    \ inspect protocol` | Configure protocol inspection services.<br><br>**NOTE:**\
    \ There are many different protocol keywords, including `dns`, `ftp`, `http`,\
    \ `icmp`, `ipv6`, and more. All are beyond the scope of this chapter. |\n\n**NOTE:**\
    \ Other configurable policy map actions that are beyond the scope of this chapter\
    \ include `priority`, `service-policy`, `shape`, `ips`, `flow-export`, and more.\n\
    \nThe service policy enables the policy map globally on all interfaces or on a\
    \ specific interface:\n\n| Command | Description |\n| --- | --- |\n| `ciscoasa(config)#\
    \ service-policy`<br>`p-map-name {global \\| interface intf}` | Enable a set of\
    \ policies globally or apply them on an interface. |\n\nThis chapter covers the\
    \ following topics:\n\n- **Remote-Access VPNs**\n  - Types of Remote-Access VPNs\n\
    - **ASA SSL VPNs**\n  - Client-Based SSL VPN Example Using ASDM\n  - Clientless\
    \ SSL VPN Example Using ASDM\n\n## Remote-Access VPNs\n\nEnterprise users are\
    \ requesting support for their mobile devices, including smart phones, tablets,\
    \ notebooks, and a broader range of laptop manufacturers and operating systems.\n\
    \nThis shift has created a challenge for IT security. The solution is the use\
    \ of Secure Sockets Layer (SSL) virtual private networks (VPNs) to secure access\
    \ for all users, regardless of the endpoint from which they establish a connection.\n\
    \nBoth Cisco Integrated Services Routers (ISR) and Adaptive Security Appliances\
    \ (ASA) provide IPsec and SSL VPN capabilities. However, an ASA can support up\
    \ to 10,000 concurrent sessions per device. The ASA is usually the choice when\
    \ supporting a large remote networking deployment.\n\n### Types of Remote-Access\
    \ VPNs\n\nThe ASA supports three types of remote-access VPNs:\n\n| Type | Description\
    \ |\n|---|---|\n| Clientless SSL VPN | Clientless SSL VPN remote access (using\
    \ a web browser).<br><br>• Browser-based VPN, which lets users establish a secure,\
    \ remote-access VPN tunnel to the ASA.<br>• After authentication, users access\
    \ a portal page and can access specific supported internal resources. |\n| **Client-based\
    \ SSL or IPsec VPN** | - SSL or IPsec (IKEv2) VPN remote access (using Cisco AnyConnect\
    \ Client).<br>- Provides full-tunnel SSL VPN connection but requires a VPN client,\
    \ such as the Cisco AnyConnect VPN client to be installed on the host.<br>- The\
    \ AnyConnect client can be manually preinstalled on the host or downloaded on-demand\
    \ to a host via a browser.<br>- After authentication, the user’s PC is assigned\
    \ an internal IP address and can access network resources as though they were\
    \ on the local network. |\n| **IPsec (IKEv1) VPN** | - IPsec (IKEv1) VPN remote\
    \ access (using Cisco VPN client). |\n\n## ASA SSL VPN\n\nASA SSL VPNs can be\
    \ configured using the following:\n\n- ASDM VPN Assistant\n- ASDM VPN Wizard\n\
    \nTo open the ASDM VPN Assistant, choose **Configurations > Remote-Access VPN\
    \ > Introduction**, as shown in Figure 22-1.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_339_0.png)\n\
    \nFigure 22-1  ASDM VPN Assistant Screen\n\nAlternatively, start the VPN Wizard\
    \ using the menu bar: **Wizards > VPN Wizards > AnyConnect VPN Wizard** (see Figure\
    \ 22-2).\n"
