    ## 使用 CCP 调整签名


    IPS 签名调整有助于管理资源。签名可以退役或取消退役，也可以启用或禁用。为此，请选择 **编辑 IPS > 签名**，并突出显示该签名。然后，根据需要单击
    **启用**、**禁用**、**退役** 或 **取消退役**。


    要更改与签名关联的操作，请突出显示该签名，右键单击，选择 **操作**，然后选择或取消选择要与此签名关联的操作。


    > **注意：** 如果签名在“已启用”旁边的列中出现黄色图标，表示已对该签名进行更改，但尚未应用。


    | OSI 层 | 底层技术 |

    |---|---|

    | • 第 2 层 VPN（传统协议，如帧中继或 ATM）<br>• 第 2 层 VPN（多协议标签交换 [MPLS] VPN）<br>• 第 3 层 VPN（IP
    安全 [IPsec] 和多协议标签交换 [MPLS] 第 3 层 VPN）<br>• 第 7 层 VPN（安全套接层 [SSL] VPN） | • IPsec
    VPN<br>• SSL VPN<br>• MPLS VPN<br>• 其他第 2 层技术，如帧中继或 ATM<br>• 结合多种技术的混合 VPN |


    **注意：** 本书重点介绍使用 Cisco IOS 集成服务路由器 (ISR) 的站点到站点 IPsec VPN，以及使用自适应安全设备 (ASA) 的远程访问
    SSL VPN。


    ## VPN 部署模式


    | VPN 部署模式 | 描述 |

    |---|---|

    | **站点到站点 VPN** | • 将整个网络相互连接。<br>• VPN 主机不需要 VPN 客户端软件。<br>• VPN 通过 VPN“网关”（例如
    Cisco ISR 或 ASA）发送和接收正常的 TCP/IP 流量。<br>• VPN 网关负责通过 Internet 将出站流量封装并加密到对端 VPN
    网关。<br>• 收到后，对端 VPN 网关解密内容，并将数据包转发到其专用网络内的目标主机。 |

    | **远程访问 VPN** | • VPN 通过 Internet 安全地连接远程办公人员、移动用户和外部消费者到企业。<br>• 主机可能需要预安装的
    VPN 客户端（例如 Cisco VPN Client 或 Cisco AnyConnect），才能使用超文本传输安全协议 (HTTPS) 访问目标站点。<br>•
    客户端会封装并加密该流量，然后通过 Internet 将其发送到目标 VPN 网关。<br>• VPN 网关的行为与站点到站点 VPN 相同。 |


    **注意：** VPN 实施加密协议以保护 VPN 网络流量。


    ## 密码学 = 密码编码学 + 密码分析学


    密码学是创建和破解秘密代码的科学。它包括以下内容：


    | 术语 | 定义 |

    |---|---|

    | **密码编码学** | ▪ 创建秘密代码以确保机密性的科学<br>▪ 涉及加密和哈希，可提供身份验证/完整性 |

    | **密码分析学** | ▪ 破解秘密代码的科学 |


    ## 历史上的密码算法


    密码编码学使用密码算法来保护数据。密码算法是执行加密和解密的算法，由一系列定义明确的步骤组成，并按过程执行。密码算法通常分为基于换位或基于替换的类型。


    在基于换位的密码中，字符被“置换”或重新排列。一个简单的例子是通过反转字母来加密 HELLO，得到 OLLEH。其他示例包括 Scytale、Rail Fence
    和 Grilles 密码。


    > **注意：** 一些现代算法，例如数据加密标准 (DES) 和三重数据加密标准 (3DES)，仍将换位作为算法的一部分。


    替换密码包括以下内容：


    | 类型 | 特征/示例 |

    |---|---|

    | **替换（单表替换）** | ▪ 将一个字符替换为另一个字符（例如，A=C、B=D、C=E）。<br>▪ 示例：Caesar 密码、Affine 密码、Atbash
    密码。 |

    | **多表替换** | ▪ 基于替换，使用多个替换字母表。<br>▪ 示例：Vigenère 密码、Autokey 密码。 |

    | **一次性密码本** | ▪ 一种替换密码，将文本字母与特殊密钥材料字符组合。<br>▪ 例如，Vernam 密码的密钥必须是随机的，且数据只能使用一次。<br>▪
    密钥分发具有挑战性，因为源和目标必须拥有相同的密钥。<br>▪ 一次性密码本已不再实用，但其概念仍应用于 DES 和 AES 等现代加密算法中。 |


