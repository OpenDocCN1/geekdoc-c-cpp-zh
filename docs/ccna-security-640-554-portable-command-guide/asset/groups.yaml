    ## Restoring Bootset Files


    To restore a primary bootset from a secure archive after the router has been tampered
    with (by an NVRAM erase or a disk format), you must complete four steps.


    The following example walks through the process of restoring bootset files to
    an ISR with a corrupt IOS that boots to ROMMON mode.


    | Command | Description |

    |---|---|

    | <pre>Router#reload<br>Proceed with reload? [confirm]<br>rommon 1 > dir flash:</pre>
    | Reload the router. Press **Enter** to continue.<br><br>Enter ROMMON mode and
    display the bootset files. |

    | <pre>rommon 2 > boot c1841-advipservicesk9-mz.124-20.T1.bin</pre> | Boot the
    router using the listed image. |

    | <pre>Router(config)#secure boot-config restore flash:runcfg-20120701-090211.ar</pre>
    | Restore the secure configuration to the archive found in flash. |


