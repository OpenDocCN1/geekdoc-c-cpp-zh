    \ Configuration Professional GUI截图。书中包含示例，以帮助演示安全相关配置。\n\n本书最后一节重点介绍使用自适应安全设备（ASA）保护网络。它提供保护ASA\
    \ 5505所需的CLI命令和自适应安全设备管理器（ASDM）GUI截图。同样，书中包含示例，以帮助演示安全相关配置。\n\n我希望你从阅读本指南中学到的东西，能像我在编写它时学到的一样多。\n"
