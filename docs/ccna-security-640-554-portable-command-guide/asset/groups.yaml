  md: "\n## Authentication, Authorization, and Accounting Framework\n\nAuthentication,\
    \ authorization, and accounting (AAA) is a standards-based framework that you\
    \ can implement to control who is permitted to access a network (authenticate),\
    \ what they can do while they are there (authorize), and audit what actions they\
    \ performed while accessing the network (accounting).\n\n### Local AAA Authentication\n\
    \nThe following are the general steps to configure a Cisco router to support local\
    \ AAA authentication:\n\n- 1. Add usernames and passwords to the local router\
    \ database.\n- 2. Enable AAA globally on the router using the `aaa new-model`\
    \ command.\n- 3. Configure authentication policies using the `aaa authentication`\
    \ command and specified method lists.\n- 4. (Optional) Configure authorization\
    \ policies using the `aaa authorization` command and specified method lists.\n\
    - 5. (Optional) Configure accounting policies using the `aaa accounting` command\
    \ and specified method lists.\n- 6. Confirm and troubleshoot the AAA configuration.\n\
    \n> **NOTE** Other variations of the `aaa authentication` command include `aaa\
    \ authentication ppp`, `aaa authentication enable`, and `aaa authentication dot1x`.\n\
    \n> **NOTE** Other configurable parameters include `aaa authentication banner`,\
    \ `aaa authentication username-prompt`, `aaa authentication password-prompt`,\
    \ and `aaa authentication fail-message`.\n\n```text\nRouter(config)#username \
    \                 | Add a username and password to the local\n username privilege\
    \ level              | security database.\n secret password\nRouter(config)#aaa\
    \ new-model             | Enable AAA.\n```\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_101_0.png)\n\
    \nFigure 7-1  AAA Summary Screen\n\nClick Enable AAA.\n\nThe Enable AAA dialog\
    \ box appears, as shown in Figure 7-2.\n\nClicking Yes enables AAA and automatically\
    \ configures local authentication on the console line. It also configures the\
    \ vty lines for local authentication, authorization to use the EXEC shell, and\
    \ accepts the privilege level of the user (if configured).\n\n> **NOTE** Clicking\
    \ **No** does not enable AAA.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_101_1.png)\n\
    \nFigure 7-2  Enable AAA Dialog Box\n\n### Server-Based AAA Authentication\n\n\
    Maintaining a local authentication database for each Cisco device in a large network\
    \ is not feasible. Large networks require a AAA server-based solution. Routers\
    \ communicate with AAA servers, which can be installed on a Windows server or\
    \ on dedicated appliances such as the Cisco 1121 Secure Access Control System\
    \ (ACS) or the Cisco Identity Services Engine (ISE).\n\nWhen users connect to\
    \ a router, they are prompted for a username and password. The router passes the\
    \ credentials to the Cisco Secure ACS (server or engine). The Cisco Secure ACS\
    \ authenticates the user.\n\n### TACACS+ Versus RADIUS\n\nRouters communicate\
    \ with AAA servers using either TACACS+ or RADIUS protocols to implement AAA functions:\n\
    \n|  | TACACS+ | RADIUS |\n|---|---|---|\n| **Standard** | Cisco proprietary |\
    \ RFCs 2865, 2866, 2867, and 2868 |\n| **Transport protocol** | TCP port 49 |\
    \ UDP ports 1645 or 1812 for authentication and UDP ports 1646 or 1813 for accounting\
    \ |\n| **Confidentiality** | Encrypts the entire body of the packet, but leaves\
    \ a standard TCP header | Encrypts only the password in the Access-Request packet\
    \ from the client to the server |\n| **Functionality** | Uses the AAA architecture\
    \ separating authentication, authorization, and accounting | Combines authentication\
    \ and authorization |\n| **Customization** | Provides authorization of router\
    \ commands on a per-user/group basis | Can pass a privilege level down to the\
    \ router, which can then be used locally for command authorization |\n| **Accounting**\
    \ | Captures limited information | Captures more detailed information |\n| **Deployment**\
    \ | Common in Cisco deployments and where multiprotocol support is required |\
    \ Popular in VoIP installations and to support 802.1x |\n\n**NOTE:** Depending\
    \ on the solution chosen, the configuration commands differ slightly.\n\n**NOTE:**\
    \ RADIUS will eventually be replaced by DIAMETER.\n\nThe following are the general\
    \ steps to configure a Cisco router to support server-based authentication:\n\n\
    - 1. Configure the AAA servers and groups.\n- 2. Enable AAA globally on the router.\n\
    - 3. Configure authentication policies using the `aaa authentication` command\
    \ and specified method lists.\n- 4. (Optional) Configure authorization policies\
    \ using the `aaa authorization` command and specified method lists.\n- 5. (Optional)\
    \ Configure accounting policies using the `aaa accounting` command and specified\
    \ method lists.\n- 6. Confirm and troubleshoot the AAA configuration.\n\n### Configuring\
    \ Server-Based AAA Authentication\n\nThe first step of configuring server-based\
    \ authentication is to configure AAA server objects:\n\n| Command | Description\
    \ |\n|---|---|\n| `R1(config)#tacacs-server host`<br>`{host-name \\| host-ip-address}`<br>`[key\
    \ string] [port [integer]]`<br>`[single-connection] [timeout [seconds]]` | Specify\
    \ a TACACS+ host. Key, port number, single-connection, and time-out are all optional.<br><br>**NOTE:**\
    \ The encryption key can be configured separately using the `tacacs-server key`\
    \ command.<br><br>**TIP:** When connecting to Cisco Secure ACS, use the single-connection\
    \ keyword. It is more efficient because it allows the server to handle a higher\
    \ number of TACACS operations. The time-out specifies the amount of time that\
    \ the router waits for the server to reply before retransmitting. Default is 5\
    \ seconds. |\n| `R1(config)#radius-server host`<br>`{host-name \\| host-ip-address}`<br>`[auth-port\
    \ port-number] [acct-port port-number] [key password]` | Specify a RADIUS host.\
    \ Port numbers and key are optional.<br><br>**NOTE:** If auth-port and acct-port\
    \ are not specified, the default value of auth-port is 1645 and the default value\
    \ of acct-port is 1646.<br><br>**NOTE:** You can configure the encryption key\
    \ separately using the `radius-server key` command. |\n\nOptionally, servers can\
    \ be grouped together. This feature enables you to select a subset of the configured\
    \ server hosts and use them for a particular service:\n\n| Command | Description\
    \ |\n|---|---|\n| `Router(config)#aaa group server radius group-name` | Group\
    \ existing RADIUS server hosts and use them for a particular service. |\n| `Router(config-sg-radius)#server\
    \ ip-address {auth-port port-number} {acct-port port-number}` | Configure the\
    \ IP address of the RADIUS server for the group server. |\n| `Router(config)#aaa\
    \ group server tacacs+ group-name` | Group existing TACACS+ server hosts and use\
    \ them for a particular service. |\n| `Router(config-sg-tacacs+)#server server-ip`\
    \ | Configure the IP address of the TACACS+ server for the group server. **NOTE:**\
    \ You can use this command repeatedly to add multiple servers to a group. |\n\n\
    Finally, configure the login authentication method list to use the identified\
    \ servers:\n\n| Command | Description |\n|---|---|\n| `Router(config)#aaa authentication\
    \ login [default \\| list-name] {method1 method2 ...}` | Defines the default login\
    \ authentication method to use when accessing lines. Server-based methods choices\
    \ include the following:<br><br>- `group radius`<br>- `group tacacs+`<br>- `group\
    \ group-name`<br><br>**NOTE:** It is recommended to add the local router database\
    \ as a fallback method, in case communication to the AAA server fails. |\n\n###\
    \ Configuring Server-Based AAA Authentication Example\n\nThe first step of configuring\
    \ AAA servers is to configure AAA server objects:\n\n| Command | Description |\n\
    |---|---|\n| `R1(config)#username ADMIN`<br>`privilege 15 secret cisco123` | Create\
    \ an entry in the local database. |\n| `R1(config)#aaa new-model` | Enable AAA.\
    \ |\n| `R1(config)#radius-server host 192.168.1.101 auth-port 1812 acct-port 1813\
    \ key cisco123` | Specify a RADIUS server and use UDP port numbers 1812 and 1813\
    \ and key cisco123. |\n"
  mdcn: "\n\n## 认证、授权与计费框架\n\n认证、授权与计费（AAA）是一种基于标准的框架，您可以实施该框架来控制允许谁访问网络（认证）、他们在网络上可以执行哪些操作（授权），以及审计他们在访问网络期间执行了哪些操作（计费）。\n\
    \n### 本地 AAA 认证\n\n以下是配置 Cisco 路由器以支持本地 AAA 认证的一般步骤：\n\n- 1. 在本地路由器数据库中添加用户名和密码。\n\
    - 2. 使用 `aaa new-model` 命令在路由器上全局启用 AAA。\n- 3. 使用 `aaa authentication` 命令和指定的方法列表配置认证策略。\n\
    - 4.（可选）使用 `aaa authorization` 命令和指定的方法列表配置授权策略。\n- 5.（可选）使用 `aaa accounting`\
    \ 命令和指定的方法列表配置计费策略。\n- 6. 确认并排查 AAA 配置问题。\n\n> **注意** `aaa authentication` 命令的其他变体包括\
    \ `aaa authentication ppp`、`aaa authentication enable` 和 `aaa authentication dot1x`。\n\
    \n> **注意** 其他可配置参数包括 `aaa authentication banner`、`aaa authentication username-prompt`、`aaa\
    \ authentication password-prompt` 和 `aaa authentication fail-message`。\n\n```text\n\
    Router(config)#username                  | Add a username and password to the\
    \ local\n username privilege level              | security database.\n secret\
    \ password\nRouter(config)#aaa new-model             | Enable AAA.\n```\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_101_0.png)\n\
    \n图 7-1  AAA 摘要界面\n\n单击“启用 AAA”。\n\n“启用 AAA”对话框出现，如图 7-2 所示。\n\n单击“是”将启用 AAA，并自动在\
    \ console 线路上配置本地认证。它还会为 vty 线路配置本地认证、使用 EXEC shell 的授权，并接受用户的特权级别（如果已配置）。\n\n\
    > **注意** 单击**否**不会启用 AAA。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_101_1.png)\n\
    \n图 7-2  “启用 AAA”对话框\n\n### 基于服务器的 AAA 认证\n\n在大型网络中为每台 Cisco 设备维护本地认证数据库并不可行。大型网络需要基于\
    \ AAA 服务器的解决方案。路由器与 AAA 服务器通信，这些服务器可以安装在 Windows 服务器或专用设备上，例如 Cisco 1121 安全访问控制系统（ACS）或\
    \ Cisco 身份服务引擎（ISE）。\n\n当用户连接到路由器时，系统会提示他们输入用户名和密码。路由器将凭据传递给 Cisco Secure ACS（服务器或引擎）。Cisco\
    \ Secure ACS 对用户进行认证。\n\n### TACACS+ 与 RADIUS 对比\n\n路由器使用 TACACS+ 或 RADIUS 协议与\
    \ AAA 服务器通信，以实现 AAA 功能：\n\n|  | TACACS+ | RADIUS |\n|---|---|---|\n| **标准** |\
    \ Cisco 专有 | RFC 2865、2866、2867 和 2868 |\n| **传输协议** | TCP 端口 49 | UDP 端口 1645\
    \ 或 1812 用于认证，UDP 端口 1646 或 1813 用于计费 |\n| **机密性** | 加密整个数据包主体，但保留标准 TCP 报头 |\
    \ 仅加密从客户端到服务器的 Access-Request 数据包中的密码 |\n| **功能** | 使用 AAA 架构，将认证、授权和计费分离 | 将认证和授权合并\
    \ |\n| **定制性** | 基于用户/组提供路由器命令的授权 | 可以将特权级别传递到路由器，供路由器本地用于命令授权 |\n| **计费** | 捕获的信息有限\
    \ | 捕获更详细的信息 |\n| **部署** | 常见于 Cisco 部署以及需要多协议支持的环境 | 在 VoIP 安装和支持 802.1x 的环境中很受欢迎\
    \ |\n\n**注意：** 根据所选解决方案的不同，配置命令会略有差异。\n\n**注意：** RADIUS 最终将被 DIAMETER 取代。\n\n\
    以下是配置 Cisco 路由器以支持基于服务器的认证的一般步骤：\n\n- 1. 配置 AAA 服务器和服务器组。\n- 2. 在路由器上全局启用 AAA。\n\
    - 3. 使用 `aaa authentication` 命令和指定的方法列表配置认证策略。\n- 4.（可选）使用 `aaa authorization`\
    \ 命令和指定的方法列表配置授权策略。\n- 5.（可选）使用 `aaa accounting` 命令和指定的方法列表配置计费策略。\n- 6. 确认并排查\
    \ AAA 配置问题。\n\n### 配置基于服务器的 AAA 认证\n\n配置基于服务器的认证的第一步是配置 AAA 服务器对象：\n\n| 命令 | 描述\
    \ |\n|---|---|\n| `R1(config)#tacacs-server host`<br>`{host-name \\| host-ip-address}`<br>`[key\
    \ string] [port [integer]]`<br>`[single-connection] [timeout [seconds]]` | 指定\
    \ TACACS+ 主机。密钥、端口号、single-connection 和超时均为可选。<br><br>**注意：** 加密密钥可以使用 `tacacs-server\
    \ key` 命令单独配置。<br><br>**提示：** 连接到 Cisco Secure ACS 时，请使用 single-connection 关键字。这更高效，因为它允许服务器处理更多数量的\
    \ TACACS 操作。超时指定了路由器在重新传输前等待服务器回复的时间。默认值为 5 秒。 |\n| `R1(config)#radius-server\
    \ host`<br>`{host-name \\| host-ip-address}`<br>`[auth-port port-number] [acct-port\
    \ port-number] [key password]` | 指定 RADIUS 主机。端口号和密钥是可选的。<br><br>**注意：** 如果未指定\
    \ auth-port 和 acct-port，则 auth-port 的默认值为 1645，acct-port 的默认值为 1646。<br><br>**注意：**\
    \ 您可以使用 `radius-server key` 命令单独配置加密密钥。 |\n\n可选地，可以将服务器分组。此功能允许您选择已配置服务器主机的一个子集，并将其用于特定服务：\n\
    \n| 命令 | 描述 |\n|---|---|\n| `Router(config)#aaa group server radius group-name`\
    \ | 将现有 RADIUS 服务器主机分组，并将它们用于特定服务。 |\n| `Router(config-sg-radius)#server ip-address\
    \ {auth-port port-number} {acct-port port-number}` | 为组服务器配置 RADIUS 服务器的 IP 地址。\
    \ |\n| `Router(config)#aaa group server tacacs+ group-name` | 将现有 TACACS+ 服务器主机分组，并将它们用于特定服务。\
    \ |\n| `Router(config-sg-tacacs+)#server server-ip` | 为组服务器配置 TACACS+ 服务器的 IP\
    \ 地址。**注意：** 您可以重复使用此命令将多台服务器添加到组中。 |\n\n最后，配置登录认证方法列表以使用已标识的服务器：\n\n| 命令 | 描述\
    \ |\n|---|---|\n| `Router(config)#aaa authentication login [default \\| list-name]\
    \ {method1 method2 ...}` | 定义访问线路时要使用的默认登录认证方法。基于服务器的可选方法包括：<br><br>- `group radius`<br>-\
    \ `group tacacs+`<br>- `group group-name`<br><br>**注意：** 建议将本地路由器数据库添加为备用方法，以防与\
    \ AAA 服务器的通信失败。 |\n\n### 配置基于服务器的 AAA 认证示例\n\n配置 AAA 服务器的第一步是配置 AAA 服务器对象：\n\n\
    | 命令 | 描述 |\n|---|---|\n| `R1(config)#username ADMIN`<br>`privilege 15 secret\
    \ cisco123` | 在本地数据库中创建一个条目。 |\n| `R1(config)#aaa new-model` | 启用 AAA。 |\n| `R1(config)#radius-server\
    \ host 192.168.1.101 auth-port 1812 acct-port 1813 key cisco123` | 指定一台 RADIUS\
    \ 服务器，并使用 UDP 端口号 1812 和 1813 以及密钥 cisco123。 |\n\n"
