    # Security Policy


    A security policy is a set of objectives for the company, rules of behavior for
    users and administrators, and requirements for system and management that collectively
    ensure the security of network and computer systems in an organization.


    It is a “living document,” meaning that the document is never finished and is
    continuously updated as technology and employee requirements change. One document
    will not likely meet the needs of the entire audience of a large organization.


    The audience of the security policy should be employees, contractors, suppliers,
    or customers who have access to your network.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_36_0.png)


    Figure 2-2 displays a common corporate policy structure for most organizations:


    |  |  |

    |---|---|

    | Governing policy | It details the company’s overall security policy philosophy.
    It defines information security concepts at a high level, describes why they are
    important, and details the organization’s stand. It supports the technical and
    end-user policies. |

    | Technical policies | Security staff creates technical policies to implement
    the security requirements outlined in the governing policy. These policies describe
    what the security staff does but do not dictate how the security staff performs
    its functions. |

    | End-user policies | Documents contain security policies important to end users.
    |


    Technical policies can be categorized as follows:


    |  |  |

    |---|---|

    | General policies | Define the use of equipment, computing services, and security
    guidelines. May include an acceptable use policy (AUP), account access policy,
    password policy, acquisition policy, audit policy, and information sensitivity
    policy. |

    | Remote-access policies | Defines the standards for connecting to the organization
    network from an external host or network. Typically include a virtual private
    network (VPN) security policy. |

    | Network policies | Define standards to secure all wired and wireless networks
    data ports. May also include general network access policies and policies to access
    routers, switches, servers, and extranets. |'
