    | `R1(config-cmap)#match protocol smtp` | Match SMTP services. |

    | `R1(config-cmap)#match protocol ftp` | Match FTP services. |

    | `R1(config-cmap)#exit` | Return to global configuration mode. |

    | `R1(config)#policy-map type inspect MY-POLICY` | Create a service policy called
    MY-POLICY. |

    | `R1(config-pmap)#class type inspect TRAFFIC` | Identify the class map TRAFFIC.
    |

    | `R1(config-pmap-c)#inspect` | Inspect all traffic. |

    | `R1(config-pmap-c)#exit` | Return to policy-map configuration mode. |

    | `R1(config-pmap)#exit` | Return to global configuration mode. |

    | `R1(config)#zone-pair security IN-TO-OUT source PRIVATE destination INTERNET`
    | Create a zone pair identifying the source (PRIVATE) and destination (INTERNET)
    zones. |

    | `Router(config-sec-zone-pair)#service-policy type inspect MY-POLICY` | Assign
    the service policy MY-POLICY for all traffic travelling from the source to the
    destination. |

    | `R1(config-sec-zone-pair)#exit` | Return to global configuration mode. |

    | `R1(config)#int fa0/0` | Enter interface Fa0/0 configuration mode. |

    | `R1(config-if)#zone-member security INTERNET` | Assign the interface to be a
    member of the INTERNET zone. |

    | `R1(config-if)#exit` | Return to global configuration mode. |

    | `R1(config)#int fa0/1` | Enter interface Fa0/1 configuration mode. |

    | `R1(config-if)#zone-member security PRIVATE` | Assign the interface to be a
    member of the PRIVATE zone. |


    **NOTE:** Use the `show zone security` and the `show zone-pair security` commands
    to verify the configuration.


    **NOTE:** The preceding example was based on a fairly simple security policy.
    You can use Cisco Configuration Professional (CCP) to create more comprehensive
    security policies.


