    \ |\n| **授权操作** | 限制任何特定用户、组或服务所允许的操作和视图。 |\n| **安全管理访问和报告** | 记录并说明所有访问。记录谁访问了设备、发生了什么以及何时发生。\
    \ |\n| **确保数据机密性** | 保护本地存储的敏感数据不被查看或复制。使用具有强认证的管理协议，以减轻旨在暴露密码和设备配置的机密性攻击。 |\n\
    | **提供法律通知** | 显示与法律顾问共同制定的法律声明。 |\n\n### 基于角色的访问控制\n\nRBAC 根据用户的角色限制用户访问。角色是为工作或任务职能而创建的，并被分配对特定资产的访问权限。然后将用户分配到角色，并获取为该角色定义的权限。\n\
    \n在 Cisco IOS 中，基于角色的 CLI 访问功能为路由器管理访问实现了 RBAC。该功能创建不同的“视图”，这些视图定义了接受哪些命令以及哪些配置信息可见。为了实现可扩展性，用户、权限和角色通常在一个中央存储库服务器中创建和维护。这使得访问控制策略可供使用它的多个设备使用。\n\
