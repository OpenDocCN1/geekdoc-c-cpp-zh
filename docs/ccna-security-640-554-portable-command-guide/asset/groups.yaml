    \ When telnetting to a router, use the `terminal monitor` command to view log\
    \ messages.\n\nRouter log messages typically contain time stamps, log messages,\
    \ severity levels, and message text. Cisco router log messages fall into one of\
    \ eight levels.\n\n| Level | Name | Description |\n|---:|---|---|\n| 0 | `LOG_EMERG`\
    \ | Emergencies, such as when the router is unusable |\n| 1 | `LOG_ALERT` | A\
    \ condition that should be corrected immediately, such as a corrupted system database\
    \ |\n| 2 | `LOG_CRIT` | Critical conditions, such as hard device errors |\n| 3\
    \ | `LOG_ERR` | Errors such as invalid memory size |\n| 4 | `LOG_WARNING` | Warning\
    \ messages, such as the operation failed |\n| 5 | `LOG_NOTICE` | Conditions that\
    \ are normal but important |\n| 6 | `LOG_INFO` | Informational messages, such\
    \ as when a packet is denied |\n| 7 | `LOG_DEBUG` | Messages that contain information\
    \ normally of use only when debugging a program |\n\nSyslog requires a syslog\
    \ server and a syslog client:\n\n| Command | Description |\n|---|---|\n| `Router(config)#service\
    \ timestamps` | Enable time stamps on debug and logging messages. |\n| `Router(config)#logging\
    \ host [ip-address \\| hostname]` | Identify the syslog server address or hostname.\
    \ |\n| `Router(config)#logging trap level` | Limit messages logged to the syslog\
    \ servers based on severity. Default is 0–6. |\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_91_0.png)\n\
    \nFigure 6-11  Logging Information Screen\n\nTo enable syslog logging and add\
    \ a syslog server, click **Edit**.\n\nThe Logging dialog appears, as shown in\
    \ Figure 6-12. Enter the syslog server information. You can enable a logging buffer\
    \ and configure it separately.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_91_1.png)\n\
    \nFigure 6-12  Logging Dialog\n\nIn this example, informational (level 6) messages\
    \ will be forwarded to a syslog server located at IP address 192.168.1.100. As\
    \ well, debugging (level 7) messages will be sent to the router memory buffer.\n\
    \nAfter configuring these settings, click **OK**.\n\nCCP displays the CLI configuration\
    \ commands. Click **Deliver** to commit the configuration changes.\n\nCCP now\
    \ displays the syslog settings, as shown in Figure 6-13.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_92_0.png)\n\
    \n**Figure 6-13** Revised Syslog Information Screen\n\n> **NOTE:** Use the `show\
    \ logging` command to view logging settings and logging information sent to the\
    \ memory buffer.\n\nTo monitor logging information with CCP, choose **Monitor\
    \ > Router > Logging**, as shown in Figure 6-14. You can choose the logging information\
    \ to view from the drop-down list.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_92_1.png)\n\
    \n**Figure 6-14** Monitoring Syslog Screen\n\n## Configuring SNMP\n\nSNMP enables\
    \ network administrators to manage network performance, find and solve network\
    \ problems, and plan for network growth. SNMP is used to capture (trap) log information,\
    \ but can also be configured to get information as needed and to send configuration\
    \ changes to a device.\n\n> **NOTE:** Three versions of SNMP are available: SNMPv1\
    \ (legacy), SNMPv2, and SNMPv3. SNMPv3 is the most secure. Use SNMPv2 only if\
    \ SNMPv3 is not supported.\n\n> **NOTE:** To send SNMP messages to an SNMP server,\
    \ SNMPv1 and SNMPv2 use read-only community strings to authenticate with a server.\
    \ To authenticate configuration changes from an SNMP server, SNMP uses read-write\
    \ community strings.\n\n> **TIP:** Change the default names of the read-only and\
    \ read-write community strings.\n\n### Configuring SNMP Using CCP\n\nTo enable\
    \ SNMP using CCP, choose **Configure > Router > SNMP**. The SNMP informational\
    \ screen will display, as shown in Figure 6-15.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_93_0.png)\n\
    \nFigure 6-15  SNMP Information Screen\n\nTo configure the settings and enable\
    \ SNMP, click **Edit**.\n\nThe SNMP Properties dialog appears, as shown in Figure\
    \ 6-16. Enter the SNMP server information. You can enable the logging buffer and\
    \ configure it separately.\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_94_0.png)\n\
    \n**Figure 6-16**  SNMP Properties Dialog\n\nAfter configuring these settings,\
    \ click **OK**. CCP displays the CLI configuration commands shown in Figure 6-17.\n\
    \nClick **Deliver** to commit the configuration changes.\n\n## Chapter 7: Securing\
    \ Management Access with AAA\n\nThis chapter covers the following topics:\n\n\
    - Authenticating Administrative Access\n  - Local Authentication\n  - Server-Based\
    \ Authentication\n  - Authentication, Authorization, and Accounting Framework\n\
    - Local AAA Authentication\n  - Configuring Local AAA Authentication Example\n\
    \  - Configuring Local AAA Authentication Using CCP Example\n- Server-Based AAA\
    \ Authentication\n  - TACACS+ Versus RADIUS\n  - Configuring Server-Based AAA\
    \ Authentication\n  - Configuring Server-Based AAA Authentication Example\n  -\
    \ Configuring Server-Based AAA Authentication Using CCP Example\n- AAA Authorization\n\
    \  - Configuring AAA Authorization Example\n  - Configuring AAA Authorization\
