    | `ciscoasa# configure terminal` | Enter ASA global configuration mode. |


    **NOTE:** The first time global configuration mode is accessed, a message prompting
    you to enable the Smart Call Home feature appears. This feature offers proactive
    diagnostics and real-time alerts on select Cisco devices.


    ## Configuring Basic Management Settings


    Configure hostname, domain name, and privileged EXEC password:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# hostname ASA-hostname` | Configure the ASA hostname. |

    | `ciscoasa(config)# domain-name`<br>`ASA-domain-name` | Configure a domain name.
    |

    | `ciscoasa(config)# enable password`<br>`password` | Configure the privileged
    EXEC mode password.<br><br>**NOTE:** There is no secret option. |


    ## Enabling the Master Passphrase


    The master passphrase must be configured and enabled to encrypt all user passwords:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# key config-key password-encryption [new-passphrase (old-passphrase)]`
    | Create or change an existing master passphrase. |

    | | **NOTE:** The passphrase must be 8 to 128 characters in length, and all characters
    except a backspace and double quote are accepted. |

    | | **NOTE:** If a new passphrase is not included in the command, the ASA prompts
    for it. |

    | | **NOTE:** To change the passphrase, you must first enter the old passphrase.
    |


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# password encryption aes` | Enable password encryption. |


    **NOTE:** To determine whether password encryption is enabled, use the `show password
    encryption` command.


    **NOTE:** Interfaces must be configured before Telnet, SSH, HTTPS, and static
    routes are configured.


    ## Configuring Interfaces


    On ASA 5510 and later, routed Ethernet interfaces are directly configured with
    IP configurations, much like an Integrated Services Router (ISR). However, the
    ASA 5505 has an integrated eight-port Layer 2 switch, and therefore IP configurations
    are accomplished by


    - Configuring the inside and outside SVIs by assigning interface name, security
    level, and IP address

    - Assigning Layer 2 ports to the inside and outside SVI VLANs

    - (Optional) Configuring a third SVI if required


    ### Configuring the Inside and Outside SVIs


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# interface vlan vlan-id` | Create an SVI. |

    | `ciscoasa(config-if)# nameif {inside \| outside \| name}` | Assign a name to
    the SVI interface. **NOTE:** Using the name inside automatically assigns a security
    level of 100. **NOTE:** Using the name outside automatically assigns a security
    level of 0. |

    | `ciscoasa(config-if)# security-level level` | Assign or change the SVI security
    level. **NOTE:** All SVIs must be assigned a security level value. **NOTE:** Security
    levels are automatically assigned for inside and outside interfaces. |

    | `ciscoasa(config-if)# ip address ip-address netmask` | Assign an IP address
    and mask to the SVI. **NOTE:** The ASA could also obtain its IPs and default route
    if it is configured as a Dynamic Host Configuration Protocol (DHCP) client or
    PPP over Ethernet (PPPoE) client. |


    > **NOTE:** By default, an SVI is active and does not require the `no shutdown`
    command.


    ### Assigning Layer 2 Ports to VLANs


    The Layer 2 ports must be assigned to a VLAN.


    > **NOTE:** By default, all ports are members of VLAN 1.


    Therefore, to change the default VLAN assignment, you must configure the Layer
    2 port with the following commands:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# interface interface/number` | Specify a Layer 2 physical
    port. |

    | `ciscoasa(config-if)# switchport access vlan vlan-id` | Change the VLAN assignment
    of the port from the default of VLAN 1. |

    | `ciscoasa(config-if)# no shutdown` | Enable physical port. |


    > **NOTE:** The Layer 2 port must be enabled and therefore requires the `no shutdown`
    command.


    **NOTE:** To verify VLAN settings, use the `show switch vlan` command. To verify
    interface settings, use the `show interface` or `show int ip brief` command.


    **NOTE:** ASA Fast Ethernet interfaces are designated as Ethernet x/x (for example,
    E0/0).


    ### Configuring a Third SVI


    An ASA 5505 with the Security Plus license automatically supports the creation
    of additional VLANs to create other zones such as a demilitarized zone (DMZ) zone.
    However, an ASA 5505 with a Base license only supports a third, restricted SVI
    that is limited from initiating contact to another specified VLAN.


    Use the following to configure a third VLAN SVI on an ASA 5505 with a Base license:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# interface interface/number` | Specify a Layer 2 physical
    port. |

    | `ciscoasa(config-if)# no forward interface vlan vlan-id` | Limit the interface
    from initiating contact to another VLAN. |


    > **NOTE:** The `vlan-id` argument specifies the VLAN ID to which this VLAN interface
    cannot initiate traffic.


    > **NOTE:** You must configure this command before the interface is named.


    > **NOTE:** Configure this command on the third SVI after the inside and outside
    VLAN interfaces have been configured.


    ## Configuring the Management Plane


    ### Enabling Telnet, SSH, and HTTPS Access


    The ASA can be configured to accept Telnet connections from a single host or a
    range of hosts on the inside network. Use the following commands to enable the
    Telnet service:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# passwd password` | Configure the Telnet / SSH password. |

    | `ciscoasa(config)# telnet ip-address subnet-mask interface-name` | Identify
    which inside hosts can telnet to which ASA interface. |

    | `ciscoasa(config)# telnet timeout minutes` | Alters the default EXEC timeout
    of 5 minutes. |


    Alternatively, Telnet can be configured to use authentication, authorization,
    and accounting (AAA) authentication:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# username name password`<br>`password` | Create a local database
    entry. |

    | `ciscoasa(config)# aaa authentication`<br>`telnet console LOCAL` | Configure
    Telnet to refer to the local database for authentication. |


    Secure Shell (SSH) is also supported, but it requires AAA authentication to be
    enabled. Use the following commands to enable SSH support:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# aaa authentication`<br>`ssh console LOCAL` | Configure SSH
    to refer to the local database for authentication. |

    | | **NOTE:** The `LOCAL` keyword is case sensitive and is a predefined server
    tag. |

    | `ciscoasa(config)# crypto key`<br>`generate rsa modulus modulus` | Generates
    the RSA key required for SSH encryption. |

    | | **NOTE:** Valid modulus values include 512, 768, 1024, and 2048. Higher modulus
    values are recommended. |

    | `ciscoasa(config)# ssh ip-address`<br>`subnet-mask interface-name` | Identify
    which inside hosts can SSH to which ASA interface. |

    | `ciscoasa(config)# ssh timeout minutes` | Alters the default EXEC timeout of
    5 minutes. |


    **NOTE:** To verify the SSH configuration, use the `show ssh` command.


    Enable HTTPS services on the ASA:


    | Command | Description |

    |---|---|

    | `ciscoasa(config)# http server`<br>`enable` | Enable the ASA HTTP server. |

    | `ciscoasa(config)# http ip-address`<br>`network-mask interface-name` | Identify
    a host or hosts that can access the ASA HTTP server using ASDM. |


    **NOTE:** To remove and disable the ASA HTTP server service, use the `clear configure
    http` global configuration command.

