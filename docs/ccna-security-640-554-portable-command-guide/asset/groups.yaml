    a TACACS+ or RADIUS AAA server group. **NOTE:** Other protocols include `http-form`,
    `kerberos`, `ldap`, `ntp`, and `sdi`. All are beyond the scope of this chapter.
    |

    | `ciscoasa(config-aaa-server-group)# aaa-server server-tag (interface-name) host
    {server-ip \| name} [key]` | Identify a AAA server and parameters to be part of
    the AAA server group. |

    | `ciscoasa(config)# aaa authentication {enable \| http \| ssh \| telnet} console
    server-tag [LOCAL]` | Enable server-based AAA authentication. |


    > **NOTE:** To erase all AAA server configurations, use the `clear config aaa-server`
    command.


    > **NOTE:** To view all user accounts, use the `show running-config aaa-server`
    command.


    ### Configuring AAA Server-Based Authentication Example Using the CLI


    Figure 21-18 shows the network topology for the server-based AAA authentication
    example.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_328_0.png)


