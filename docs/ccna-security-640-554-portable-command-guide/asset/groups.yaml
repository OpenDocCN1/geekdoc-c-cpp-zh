    ### 按类别调整签名


    路由器的内存和资源限制使其无法加载所有 Cisco IOS IPS 签名。因此，仅加载由类别定义的选定签名集。


    **提示：** 签名数量越多，消耗的内存就越多。因此，停用与您的网络无关的签名以节省路由器内存。


    所有签名均预先分组到类别中；类别具有层级结构。单个签名可以属于多个类别。顶级类别有助于定义常规签名类型。


    **提示：** 由于类别按自上而下的顺序应用，您应先停用所有签名，然后再重新启用特定类别。


    | 命令 | 描述 |

    |---|---|

    | `Router(config)#ip ips signature-category` | 进入 IPS 类别配置模式，以基于签名类别调整 Cisco IOS
    IPS 签名参数。 |

    | `Router(config-ips-category)#category {all \| ios_ips {basic \| advanced}}`
    | 指定要更改的签名类别，并进入 IPS 类别操作模式。<br><br>**注意：** 还存在许多其他类别和子类别（例如 attack、dos、ddos、email、p2p）。有关受支持的顶级类别列表，请使用路由器
    CLI 帮助（`?`）。<br><br>**注意：** IOS IPS 按配置中列出的顺序处理类别命令。 |

    | `Router(config-ips-category-action)#retired {false \| true}` | 指定是否应将签名或签名类别定义保存在路由器内存中。<br><br>`false`
    重新启用给定类别中的所有签名。<br><br>`true` 停用给定类别中的所有签名。<br><br>**注意：** 已停用的签名不会被 Cisco IOS
    IPS 扫描，因此不会触发警报。<br><br>**注意：** 要恢复默认操作，请使用 `no retired` 命令。 |

    | `Router(config-ips-category-action)#event-action action` | 更改指定签名类别的路由器操作。<br><br>操作包括以下各项：<br><br>-
    `deny-attacker-inline`<br>- `deny-connection-inline`<br>- `deny-packet-inline`<br>-
    `produce-alert`<br>- `reset-tcp-connection`<br><br>**注意：** 与类别关联的事件操作可以单独输入，也可以在同一行输入。<br><br>**注意：**
    要验证事件操作配置，请使用 `show ip ips signatures` 命令。 |

    | `Router(config-ips-category-action)#alert-severity {high \| medium \| low \|
    informational}` | （可选）更改给定签名或签名类别的警报严重级别。**注意：** 要恢复默认操作，请使用 `no alert-severity`
    命令。 |

    | `Router(config-ips-category-action)#fidelity-rating rating` | （可选）更改给定签名类别的签名保真度评级。
    |

    | `Router(config-ips-category)#exit` | 返回 IPS 类别模式。 |

    | `Router(config-ips-category)#exit`<br>`Do you want to accept these changes?
    [confirm]` | 基于签名的更改完成后，系统会提示您确认更改是否可接受。<br><br>确认更改后，IOS IPS 将编译针对签名的更改，修改内存结构以反映更改，并将更改保存到指定的
    IPS 位置。 |


    **警告：** 请勿重新启用 all 类别，因为它包含某个签名版本中的所有签名。IOS IPS 无法一次编译和使用所有签名；如果这样做，将耗尽内存。


    **注意：** 使用 `show ip ips` 命令显示 IPS 配置信息。使用 `show ip ips signature-category {config}`
    命令按签名类别显示 IPS 签名参数。


    将 IPS 规则应用到所需接口并指定方向：


    | 命令 | 描述 |

    |---|---|

    | `Router(config-if)#ip ips ips-name {in \| out}` | 将 IPS 规则应用到接口。当 IPS 应用到第一个接口时，路由器会加载签名并构建签名引擎：<br><br>`in`
    仅检查传入流量。<br><br>`out` 仅检查传出流量。<br><br>**注意：** 可以重复该命令以配置传入和传出流量。 |


    **注意：** 在加载签名和构建签名引擎期间，路由器提示符会消失。这些任务完成后，提示符会重新出现。


