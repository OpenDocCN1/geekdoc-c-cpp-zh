    To configure Cisco Secure ACS for device administration, follow these steps:


    1. Add a router as a AAA client.

    2. Configure identity groups and an identity store.

    3. Configure access service to process requests.

    4. Create identity and authorization policies.


    ## Adding a Router as a AAA Client


    To add a router as a AAA client, navigate to the Network Resources option on the
    menu on the left and click the Network Device Groups branch.


    Figure 7-19 displays an example of adding a switch to a group using the Add Network
    Devices as AAA Clients screen.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_118_0.png)


    **Figure 7-19**  Add Router as a AAA Client


    ## Configuring Identity Groups and an Identity Store


    In this example, users and groups are stored in the Cisco Secure ACS database.
    To view, add, edit, or delete users, choose **Users and Identity Stores > Internal
    Identity Store > Users**.


    Figure 7-20 shows an example of the Internal Users screen.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_119_0.png)


    **Figure 7-20**  Internal Users Screen


    Selecting a user and clicking **Edit** opens the Edit a User Account screen (see
    Figure 7-21), which displays the specific fields associated with a user.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_119_1.png)


    **Figure 7-21**  Edit a User Account Screen


    ## Configuring Access Service to Process Requests


    Policies consist mainly of rules that determine the action of the policy. You
    create access services to define authentication and authorization policies for
    requests. A global service selection policy contains rules that determine which
    access service processes an incoming request.


    - Selectively use Simple Network Management Protocol (SNMP) and treat community
    strings like root passwords.

    - Use Cisco Discovery Protocol only where necessary—it is useful with IP phones.


    ## MAC Address Attacks


    | Attack | Description |

    |---|---|

    | **MAC address table attack** | Enables an attacker to sniff frames by overwhelming
    a switch MAC address table with fake addresses. Once full, the switch floods all
    unknown unicast frames. The attacker can then capture all traffic or spoof one
    of the learned MAC addresses. |

    | **MAC address spoofing** | Attacker spoofs another interface MAC address and
    sends a gratuitous Address Resolution Protocol (ARP) request to the target switch
    in an attempt to make it forward frames back to the attacker host. |


    **NOTE:** Configure port security to mitigate MAC address attacks.


    ## Configuring Port Security


    To configure port security on an access port, follow these steps:


    1. Configure an interface as an access port.

    2. Enable port security on the port.


    | Command | Explanation |

    |---|---|

    | `Switch(config-if)#switchport mode access` | A required step, this sets the
    interface to access mode (as opposed to trunk mode). **NOTE:** A port cannot be
    secured while in the default dynamic auto mode. |

    | `Switch(config-if)#switchport port-security` | Enable port security and assign
    the current MAC address to the port. Port-security defaults include the following:<br>-
    Only one MAC address can be assigned.<br>- Port violation action is shut down.<br>**NOTE:**
    Defaults can be altered if required. |


    **NOTE:** Use the `show port-security` command to view security settings and status
    and the `show port-security [interface-id] address` command to display all secure
    MAC addresses configured on all switch interfaces.


    When a port violation occurs, such as the maximum number of MAC addresses connected
    is exceeded, error log messages such as `%PM-4-ERR_DISABLE` and `%PORT_SECURITY-2-PSECURE_VIOLATION`
    are generated and the port status is changed from secure-up to secure-shutdown.
    When a port is error-disabled, it is effectively shut down, and no traffic is
    sent or received on the port. The port is error-disabled and must be manually
    reset by the network administrator using a shutdown and no shutdown sequence.
    This should be done after the offending host has been removed; otherwise, the
    violation will be triggered again.


    ## Fine-Tuning Port Security


    If required, you can alter the default maximum number of secure MAC addresses
    and the port violation action:


    | Command | Description |

    |---|---|

    | `Switch(config-if)#switchport port-security maximum value` | Set the maximum
    number of secure MAC addresses for the interface.<br><br>The default is 1, but
    the range is 1 to 132.<br><br>**NOTE:** Configure a maximum value of 2 or 3 when
    connecting an IP phone and host to a switch port. |

    | `Switch(config-if)#switchport port-security violation {protect \| restrict \|
    shutdown \| shutdown vlan}` | Configure the port action when the number of MAC
    addresses exceeds the defined maximum. Default is shutdown.<br><br>`shutdown`
    disables the port and generates syslog and SNMP messages.<br><br>`restrict` drops
    violating traffic and generates syslog and SNMP messages, while traffic from allowed
    MAC addresses is permitted to pass normally.<br><br>`protect` drops violating
    traffic, while traffic from allowed MAC addresses is permitted to pass normally.<br><br>`shutdown
    vlan` drops violating traffic for the offending VLAN instead of shutting down
    the entire port. |


    **TIP:** Configure shutdown rather than restrict or protect.


    **NOTE:** Instead of manually resetting an error-disabled port using the shutdown
    and no shutdown sequence, you can implement a dynamic port auto-recovery solution.


    ## Configuring Optional Port Security Settings


    Optionally, you can configure the following port security settings:


    - Statically assign the secure MAC addresses to the port and enable the switch
    to dynamically learn the secure MAC addresses and add them to the running configuration.

    - Enable the switch to automatically recover an error-disabled port after a specified
    amount of time.

    - Enable address aging (if required).


    MAC addresses can be explicitly assigned to the port manually or learned dynamically:


    | Command | Description |

    |---|---|

    | `Switch(config-if)#switchport port-security mac-address mac-address` | Manually
    assign the MAC addresses connecting to the port. Repeat the command for each secure
    MAC address. |

    | `Switch(config-if)#switchport port-security mac-address sticky` | Enable the
    switch to dynamically learn the connected MAC addresses until the maximum is reached.
    Learned MAC addresses are added to the running configuration. |


    **NOTE:** Manually entering each secure MAC address is not a scalable solution.


    You can also configure a switch to autorecover error-disabled ports after a specified
    amount of time:


    | Command | Description |

    |---|---|

    | `Switch(config)#errdisable recovery cause psecure-violation` | Enable dynamic
    error recovery of an error-disabled port. Default is 300 seconds. |

    | `Switch(config)#errdisable recovery interval seconds` | Specify how long a port
    will remain disabled before it is reenabled. **TIP:** Disconnect the offending
    host; otherwise, the port will remain disabled, and the violation counter will
    be incremented. |


    **NOTE:** Use the show errdisable recovery command to display the error-disabled
    recovery timer information.


    By default, when port security is enabled, the first address is added indefinitely
    as port aging is disabled. If required, you can enable port aging, making the
    switch periodically refresh the address:


    | Command | Description |

    |---|---|

    | `Switch(config-if)#switchport port-security aging {static \| time minutes \|
    type {absolute \| inactivity}}` | **Remove secure MAC addresses** on a secure
    port without manually deleting the existing address in the startup-config.<br><br>**absolute**
    (default) removes the address after the specified time. Existing addresses are
    refreshed or new addresses are added.<br><br>**inactivity** removes the address
    only if they are inactive for the specified time. |


    **NOTE:** You should configure aging only if required. Use the `no switchport
    port-security aging` interface configuration command to disable aging.


    ## Configuring Port Security Example


    Figure 8-1 shows the topology for the configuring port security example.


    ![](img/0d9540c65a85f4cb1c32cee46038d8ab_127_0.png)


    **Figure 8-1**  Network Topology for the Configuring Port Security Example


    | Command | Description |

    |---|---|

    | `S3(config)#interface fa0/3` | Enter interface configuration mode. |

    | `S3(config-if)#switchport mode access` | Configure the port as an access port.
    |

    | `S3(config-if)#switchport port-security` | Enable port security allowing only
    one MAC address on the port. |

    | `S3(config-if)#switchport port-security maximum 2` | Change the maximum number
    of MAC addresses to 2. |

