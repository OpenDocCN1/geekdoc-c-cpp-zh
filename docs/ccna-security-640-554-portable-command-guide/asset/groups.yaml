    # ## Application Menu Options


    The Application menu options include the following:


    | Option | Description |

    |---|---|

    | **Manage Community** | Create a new community or choose an existing community.
    |

    | **Setup New Device** | Start the New Device Setup Wizard to configure basic
    settings. |

    | **Create User Profile** | Start the User Profile Creation Wizard to configure
    role-based access control (RBAC) and restrict user features. |

    | **Import User Profile** | Import previously created user profiles. |

    | **Options** | Set user preferences. |

    | **Template** | Create, edit, or apply a configuration template. |

    | **Work Offline** | Use CCP without being connected to a device. |


    # ## Toolbar Menu Options


    The toolbar provides the following options:


    | Option | Description |

    |---|---|

    | **Home** | Displays a summary view of the Community View page, allowing you
    to add, edit, and discover devices and to view the discovery and router status
    of each device. |

    | **Configure** | Displays the features in the left navigation pane that can be
    configured on the selected device. |

    | **Monitor** | Displays the router and security features in the left navigation
    pane that you can monitor for a chosen device. |

    | **Manage Community** | Opens the Manage Community dialog box where you can add
    a new community or edit an existing community. A device must be in a community
    before it can be configured. Up to 10 devices can be discovered within the community.
    |

    | **Refresh** | Rediscovers the selected device in the Select Community Member
    drop-down menu or rediscovers and reloads the current feature. |

    | **Help** | Provides help content and is equivalent to the Menu Bar **Help >
    Help Contents** option. |'
