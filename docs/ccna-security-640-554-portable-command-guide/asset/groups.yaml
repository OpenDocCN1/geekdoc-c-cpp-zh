    \ |\n| 指南 | 这些是提供一系列关于如何更好地完成任务建议的最佳实践。它们与标准类似，但更为灵活，通常不是强制性的。 |\n| 程序 | 文档包括实施细节，通常包含分步说明和图形。\
    \ |\n\n图2-3提供了信息安全策略框架的分层视图。\n\n![](img/0d9540c65a85f4cb1c32cee46038d8ab_37_0.png)\n\
    \n图2-3 信息安全策略框架\n\n### 安全策略受众职责\n\n组织中负责安全策略的关键人员如下：\n\n| 受众 | 职责 |\n| --- | ---\
    \ |\n| 高级管理层（CEO） | 最终对安全策略负责 |\n| 高级安全IT管理层（CSO、CIO、CISO） | 负责安全策略 |\n| 高级安全IT人员\
    \ | 对安全策略提供意见，并可能起草安全策略的部分章节。 |\n| 安全IT人员 | 负责实施安全策略 |\n| 最终用户 | 负责遵守安全策略 |\n\n\
    ### 安全意识\n\n有效的计算机安全意识和培训计划需要适当的规划、实施、维护和定期评估。一般来说，计算机安全意识和培训计划应包含以下七个步骤：\n\n\
    1. 确定计划范围、目标和目的。\n2. 确定培训人员。\n3. 确定目标受众。\n4. 激励管理层和员工。\n5. 管理计划。\n6. 维护计划。\n7.\
    \ 评估计划。\n\n### 安全网络生命周期管理\n\n生命周期方法也可能帮助您理解信息安全的框架。\n\n### 模型与框架\n\n以下框架和模型是生命周期方法的替代方案，并提供类似的安全架构指导：\n\
    \n| 模型/框架 | 描述 |\n| --- | --- |\n| 信息及相关技术控制目标（COBIT） | 包含来自专家共识的最佳实践，重点关注IT控制和IT指标，对IT治理和审计非常有用。这些良好实践有助于优化IT投资，确保服务交付，并在出现问题时有衡量标准。\
    \ |\n| ISO 27000标准 | 包含一套全面的控制措施，涵盖信息安全最佳实践。它也是一个经过认证且全球认可的信息安全标准，重点关注风险识别、评估和管理。\
    \ |\n| 信息技术基础设施库（ITIL） | 包含一套八本实践指南，涵盖IT服务管理的大部分方面。 |\n| 美国国家标准与技术研究院（NIST） |\
    \ NIST 800系列提供了关于如何保护网络基础设施安全的详细文档。它也是免费提供的，并用于FISMA。 |\n\n### 评估和监控网络安全态势\n\n\
    安全态势应在生命周期的多个节点进行评估。通过评估网络化业务环境的各个方面，可以确定组织检测、防御和响应网络攻击的能力。\n\n关键评估活动包括以下内容：\n\
    \n| 评估活动 | 描述 |\n| --- | --- |\n| 安全态势评估 | 包括对网络设备、服务器、桌面和数据库的全面评估。对照公认的行业最佳实践分析网络安全有效性，以识别环境的相对优势和弱点，并记录可能威胁业务的具体漏洞。\
    \ |\n| 内部评估 | 包括对内部系统、应用程序和网络设备进行受控网络攻击，用于确定所需采取的步骤，以防止来自可信内部人员的故意攻击或无意错误，从而有效保护有价值的信息资产。\
    \ |\n| 外部评估 | 目标是量化与互联网连接系统相关的安全风险。 |\n| 无线评估 | 测试组织内的无线网络，并识别与无线部署相关的风险和暴露点。\
    \ |\n\n## 保险精品汇\n\n保险精品汇为您提供全方位、多层次的保险产品与服务，涵盖健康、意外、养老、教育、财产等多个领域，满足不同人生阶段的需求。我们与多家知名保险公司合作，精选优质产品，让您投保更简单、理赔更省心。\n\
    \n### 热门产品\n\n- 重疾险·健康保：覆盖百种重疾，确诊即赔，安心治疗。\n- 百万医疗险：高额住院医疗保障，自费药、进口药均可报销。\n- 意外伤害险：全年守护，意外医疗、伤残、身故多重保障。\n\
    - 少儿教育金：为孩子储备教育资金，成长路上后顾无忧。\n- 养老年金险：稳定领取至终身，晚年生活品质有保障。\n\n### 投保流程\n\n1. 在线选择心仪产品\n\
    2. 填写投保信息并确认保障内容\n3. 完成在线支付\n4. 电子保单即时发送至邮箱\n5. 享受专业客服与理赔协助\n\n### 为什么选择我们\n\n\
    | 优势 | 说明 |\n| --- | --- |\n| 产品丰富 | 覆盖健康、意外、养老、教育等全品类 |\n| 价格透明 | 官方直售，无中间差价\
    \ |\n| 智能推荐 | 根据需求定制个性化保险方案 |\n| 极速理赔 | 在线报案，全程跟踪，快速到账 |\n\n> 守护每一位客户的美好生活，是我们不变的初心。\n\
    \n灾难恢复计划是业务连续性规划的一部分，需要广泛的规划。其目标是定义恢复承载支持业务流程应用程序的主机计算系统的目标。与业务连续性相关的术语包括以下内容：\n\
    \n| 术语 | 描述 |\n| --- | --- |\n| 最大可容忍停机时间（MTD） | 系统所有者或授权官员愿意接受的停机或中断的总时间。 |\n\
    | 恢复时间目标（RTO） | RTO定义了系统资源在对其他系统资源、支持的任务或业务流程产生不可接受影响之前，可以保持不可用的最长时间。 |\n| 恢复点目标（RPO）\
    \ | 在中断或系统停机之前的时间点，停机后可以恢复任务或业务流程数据到该时间点。 |\n\n## 第3章：构建无边界网络安全策略\n\n本章涵盖以下主题：\n\
    \n- **思科无边界网络架构**\n  - 无边界安全产品\n- **Cisco SecureX架构与情境感知安全**\n  - Cisco TrustSec\n\
    \  - TrustSec机密性\n  - Cisco AnyConnect\n  - 思科安全智能运营\n- **威胁控制与遏制**\n- **云安全与数据丢失防护**\n\
    - **通过VPN实现安全连接**\n- **安全管理**\n\n### 思科无边界网络架构\n\n传统的网络安全方法使用明确的边界来保护内部网络免受外部威胁和恶意软件的攻击。员工使用装有防病毒软件和个人防火墙的公司计算机。基于外围的网络使用网络扫描设备（防火墙、Web代理和电子邮件网关）进行保护。\n\
    \n如今，网络边界正在消失，因为用户希望从任何地点、使用任何类型的终端设备、通过各种连接方式访问资源。思科通过无边界网络架构解决了这一问题，该架构集成了以下组件：\n\
    \n| 组件 | 描述 |\n| --- | --- |\n| **无边界终端区** | 该区域在用户连接到网络时提供部署灵活性和多维度的强大安全服务。最终用户访问基于使用Cisco\
    \ AnyConnect SSL VPN客户端的连接终端的安全态势。通过防火墙、入侵防御系统（IPS）、Web安全和电子邮件安全提供基础设施保护。 |\n\n"
