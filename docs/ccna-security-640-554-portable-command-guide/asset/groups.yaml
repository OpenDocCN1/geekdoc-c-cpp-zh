    option to add or change zones, zone pairs, and C3PL objects (class maps, policy
    maps, and policy assignments).


    To monitor the firewall status, choose Monitor > Security > Firewall > Firewall
    Status, as shown in Figure 12-8.


    From this screen, you can verify the firewall configuration and view how many
    connection attempts have been denied and the log entries, including the time and
    the reason for the log entry.


