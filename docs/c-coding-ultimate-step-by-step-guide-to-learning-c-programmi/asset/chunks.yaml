    \ It’s used like this:\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n#ifdef DEBUG\n\
    \nputs(\"DEBUG!\");\n\n#endif\n\n}\n\nThis code will only run if the code is flagged\
    \ as debug mode. This can be very useful for a programmer.\n\n#if, #else and #elif\
    \ work exactly the same as if statements but are used to check the macro with\
    \ arithmetic expressions rather that checking for its existence.\n\n## Error Handling\n\
    \nError handling is a very important section, because a programmer needs to make\
    \ sure his program is prepared to deal with expected and unexpected errors. C\
    \ does not provide direct support for error handling but allows access to some\
    \ low level functions. Most functions will return -1 or NULL if there is an error\
    \ and set the errno error code, errno is a global variable that holds the last\
    \ returned error code.\n\nYou will need to include the <errno.h> header file to\
    \ use these error handling functions.\n\n#include  <errno.h>\n\nThere are a few\
    \ functions that allow you to use an understand error codes.\n\nperror()\n\nFunction\
    \ displays the string you pass and attaches to the end the textual representation\
    \ of the error code stored in errno.\n\nstrerror()\n\nReturns the pointer to the\
    \ textual representation of the errno value. This can be used to save the error\
    \ feedback.\n\nstderr file stream\n\nstderr is used to output an error to the\
    \ console.\n\nUsage is below:\n\n#include  <stdio.h>\n\n#include  <errno.h>\n\n\
