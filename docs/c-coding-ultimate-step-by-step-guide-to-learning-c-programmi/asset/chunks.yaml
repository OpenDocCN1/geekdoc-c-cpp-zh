    # Chapter 1


    # Introduction and Installation


    ## History of C


    C is a general-purposed computer programming language, that first appeared as
    a concept in 1972\. The lead developer of C was Dennis Ritchie. The origin of
    C is closely related to the creation of the Unix OS.


    In this tutorial, we will go through the very basics of C right up to the intermediate
    level sections. The tutorials is designed to appeal to the first-time learners
    of a programming language.


    ## Running C on Windows


    Running C on Windows can be done with Visual Studio 2015\. Visual Studio can be
    downloaded directly from Microsoft, through the installation process C++ needs
    to be selected as language. The menu should look like this:


    ![](images/00001.jpeg)


    After you select ‘Visual C++’ fully install the program.


    You should loads Visual Studio up and go to FILE -> New Project, you’ll be met
    by a Window like so:


    ![](images/00002.jpeg)


    Select ‘Win32 Console Application’ and click “Ok”


    A few menus will now appear, follow them through with the highlighted sections.
    (The highlighted tix-boxes need to be unchecked):


    ![](images/00003.jpeg)  ![](images/00004.jpeg)


    When the program template loads up you should notice you have not been provided
    with a C environment but a C++ one, you need to convert it to C:


    Go to the “Solution explorer” and it will open the “Solution Explorer” Menu


    ![](images/00005.jpeg) ![](images/00006.jpeg)


    Right click on the .cpp file and click “Properties”


    ![](images/00007.jpeg)


    A menu will appear, expand the C/C++ menu, go to “Advanced”, loop for the “Compile
    As” section and select from the drop down menu “Compile as C Code (/TC)”


    ![](images/00008.jpeg)


    The code is now ready to run! When the code you want to compile is reader click
    the green arrow on the top menu to run your console application.


    ## Running C on Linux


    Developing basic code on Linux is relatively easy first you’ll need the ‘gcc’
    compiler, if you don’t have it installed run:


    apt-get install gcc-5


    The next stage is to create your program, open up a text pad program (Leafpad
    in this case) use this basic program for testing purposes:


    #import <stdio.h>


    int main()


    {


        printf("Hello, World!\n");


        return 0;


    }


    Save this file with the .c extension.


    To compile and use the program you’ll use gcc like so:


    gcc -o <OutputProgramName> <C_FileName>


    Where;


    OutputProgtamName is the name of the executable you want


    C_FileName is the name of your C file


    To run the program just type the executables name followed by “./”


    ./<OutputProgramName>


    ## Running C on Mac


    Running C on a Mac is relatively easy, open up the terminal and run


    clang --version


    Clang is a compiler built by Apple and with deal with all the aspects of translating
    code into machine code (1’s and 0’s)


    Start your notepad, write down your C code use this to start:


    #import <stdio.h>


    int main()


    {


        printf("Hello, World!\n");


        return 0;


    }


    Save this code with the .c extension.


    Open up a terminal in the folder where you saved you .c file, and type


    make <filename>.c


    Where filename is the name of the file you just saved. To run the code just run
    it like so:


    ./<filename>.c


    ## Running C online


    One of my favourite online IDE is [https://www.codechef.com/ide](https://www.codechef.com/ide)  it
    provides a clear clean place to produce code.


    ![](images/00009.jpeg)


    ## Prerequisites


    Throughout this tutorial you will see code snippets dotted around. There’s a few
    points that need explaining so you can get the most out of this tutorial:


    Comments


    Comments in code are signified by a “//” and the green  colour, these are ignored
    by the computer and commenting is an important part of keeping computer code readable
    and easy to maintain. Starting coders tend to discard commenting and regret it
    later, don’t be that programmer.


    Basic structure


    There is also a required basic structure of a C programme, the structure is below:


    #include  <stdio.h>


    int main()


    {


    //Code goes here


    }


    This is the structure to make your C programs run, don’t worry we’ll learn what
    it all means.


    # Chapter 2


    # Building Blocks


    ## Variables and Types


    The basis of a program is data, in the form of numbers and characters. The storing,
    manipulation and output of this data gives functionality. Variables hold this
    data, think of it as a box used to store a single item.


    C is a heavily typed language where each variable must have a defined type. A
    type is an identifying keyword that defines what the variable can hold. The first
    type we will come across is the integer, this can hold real numbers (numbers without
    a decimal place), an integer is defined below:


    int integerName = 3;


    - int is the defined type keyword, we will learn about the difference possibilities
    later.


    - “integerName” is the ID for the variable, this can be anything you want to call
    it, this is used to allow a variable to have a meaningful name, the variable could
    be defined as “int pineapple = 3;”, but it’s good practise to make them relevant.
    However, there are a few exception to this as a variable cannot be a single digit
    i.e. ‘4’ or cannot contain special characters (!”£$%^&*) etc.'
