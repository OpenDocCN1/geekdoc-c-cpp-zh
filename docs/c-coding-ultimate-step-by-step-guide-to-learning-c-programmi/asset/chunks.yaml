    ## Functions


    Functions are the building blocks of a program, they allow the reuse of code,
    the ability to keep it readable and stops the programmer repeating code. Repeating
    code is heavily advised against because bugs will be repeated multiple times and
    changes to code also need repeating. Functions give a centralised controlled area
    that deals with the distinct roles of the program.


    A method has two elements, parameters:(the items passed into the function) and
    the return type (the variable being returned) these are both optional and you
    can have a function with neither.


    A function must be defined above its call, like so;


    //Function definition


    void Print_Smile()


    {


    printf(":)\n");


    }


    int main()


    {


    //Method call


    Print_Smile();


    return 0;


    }


    And this way round would be incorrect:


    int main()


    {


    //Method call [ERROR HERE]


    Print_Smile();


    return 0;


    }


    //Function definition


    void Print_Smile()


    {


    printf(":)\n");


    }


    Function Parameters


    Sometimes it might be useful to pass data into a program, there are two types
    of parameter passing, by reference and by value. Passing by reference is what
    it sounds like, it passes a direct reference to a variable not a copy, so any
    changes to that passed variable effect it back in the calling function. Passing
    by value is the passing of a copy of that variable, so any changes to that variable
    do not effect that passed variable.


    Passing by reference is not directly supported by C, but the effect is possible
    when dealing with pointers (We will talk about this in the advanced section)


    *   Passing by reference means changes to the parameter effects the passed variable


    *   Passing by value means changes to parameter does not effect the passed variable


    For the time being passing by value is done below;


    void Add(int  num1, int  num2)


    {


    //Adds values together


    int newValue = num1 + num2;


    //Prints result


    printf("The result is: %d", newValue);


    }


    int main()


    {


    //Method call


    Add(10, 4);


    return 0;


    }


    Output:


    > The result is: 14


    In this case the function has two integer parameters that it takes both in and
    prints the result. Don’t look to deep into the printf statement, we’ll go into
    why “%d” is used and how to use printf later.


    Below is another example but this time a string is used a parameter:


    void PrintStr(char  printData[])


    {


    printf(printData);


    printf("\n");


    }


    “char printData[]” is the parameter variable and allows data to be used in that
    function, in this case it’s printing out the char string. The method call looks
    like this:


    PrintStr("Flying Squirrel");


    This is an incredibly useful feature that allows us to make general purpose code
    and change its function output by what is put in as a parameter.


    Returning values


    Returning allows us to return data from a method, this lets us do computation
    within a function and get the function to automatically return the result. Let’s
    take the one of the previous examples and adapt it so it returns the result instead
    of printing it:


    int Add(int  num1, int  num2)


    {


    //Adds values together


    int newValue = num1 + num2;


    //Returned keyword


    return newValue;


    }


    int main()


    {


    //Method call


    int storeResult = Add(10, 4);


    return 0;


    }


    The areas that changed have been highlighted. When a value is to be returned,
    the “return” keyword is used, after this line has run it returns to the line where
    the method was called so any code under the return will not run.


    The returned result is then stored in ‘storeResult’ to be used later. Returning
    can happen with any variable type. I’ll show you an example below that checks
    if the number is an even value (Using the modulus operator talked about above
    that finds the remainder of a division):


     _Bool EvenNumber(int  value)


    {


    if (value % 2 == 0)


    {


    //Return true


    return 1;


    }


    return 0;


    }


    int main()


    {


    if (EvenNumber(2))


    {


    printf("Even number!");


    }


    if (EvenNumber(5))


    {


    printf("Even number!");


    }


    return 0;


    }


    Output:


    >Even number!


    This program uses the return variable form the method EvenNumber() as a conditional
    for the if-statement and if it’s true it will print “Even number!”. As you can
    see from the output the first one prints but the second does not.


    ## Recursion


    Recursion is a difficult concept and will only be lightly touched on here and
    its real-world uses and functionality explained in the advanced section.


    Recursion is a definition of a functions commands involving a reference to itself,
    yes very confusing I know, but I use some examples to explain.


    const  int maxLoops = 5;


    void Sequence(int  previous, int  now, size_t  loopCount)


    {


    //Works out next value


    int next = previous + now;


    //Prints new value


    printf("New value: %d\n", next);


    //Increments counts


    loopCount++;


    //Stopping condition to make sure infinite looping doesn''t occur


    if (loopCount < maxLoops)


    {


    //Recursive call


    Sequence(now, next, loopCount);


    }


    }


    int main()


    {


    Sequence(1, 1, 0);


    }


    Output:


    >New value: 2


    >New value: 3


    >New value: 5


    >New value: 8


    >New value: 13


    There’re a few things to note, the lack of iteration loops, recursion in its essence
    causes looping. The second thing to not if the if statement labelled ‘stopping
    condition’, if recursive set-ups don’t have conditions that stop them looping
    they will loop forever, so this is a crucial element for using recursion effectively.
    If you don’t fully understand yet, don’t worry we will go into more detail later
    in the advanced section of the tutorial. 


    ## Arrays


    Arrays have been mentioned previously, it is a data structure that holds a set
    number of variables next to each other in memory. The array will be given a type,
    for example ‘int’. Arrays are used to quickly define lots of variables and keep
    relevant variables together. An array is defined below:


    A static size, with the size in the square brackets:


    int lotsOfNumber[20];


    Or you can define values at the definition, Note: a size does not need to be defined
    because it’s automatically determined by the number of values you specify:


    int lotsOfNumbers[] = {1,3,4};


    *   Arrays start at 0, so the first index has an identifying value of 0, the second
    is 1 and so on. This means when accessing values, you need to remember it is always
    one less than the number of values it contains


    You can access an index like so:


    int var = lotsOfNumbers[0];


    This will grab the first index of the array and place it in ‘var’.


    Arrays are very useful to access the tightly related data very quickly, you can
    use a for-loop to loop through the indexes and use them according. An example
    is below:


    int lotsOfNumbers[] = { 1, 3, 4, 10};


    for (int x = 0; x < 4; x++)


    {


    printf("%d\n", lotsOfNumbers[x]);


    }


    Output:


    > 1


    > 3


    > 4


    > 10


    In C you cannot get the length directly and need to work it out, this can be done
    simply using the sizeof() keyword, this returns the size of the elements in the
    brackets, so for example on a 64bit machine a int should be represented using
    4bytes so sizeof will return 4\. The length of an array can be worked out as so:


    int arrayLength = sizeof(lotsOfNumbers) / sizeof(lotsOfNumbers[0]);


    This takes the entire size of the array, and divides it by the first element and
    the division gives how many indices the array holds.


    Multi-dimensional arrays


