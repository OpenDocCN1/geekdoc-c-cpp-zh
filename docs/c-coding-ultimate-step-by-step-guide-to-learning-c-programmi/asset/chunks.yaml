    \n{\n\nfclose(file);\n\n}\n\nreturn 0;\n\n}\n\nAbove is usage of some of the error\
    \ handling examples. Go over and understand it error handling is very important.\n\
    \nBelow is another example of preventing the classic divide by zero error:\n\n\
    #include  <stdio.h>\n\n#include  <errno.h>\n\nextern  int  errno;\n\nint divide(int\
