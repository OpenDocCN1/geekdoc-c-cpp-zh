    \n{\n\n//If valid returns even\n\nreturn  x / y;\n\n}\n\n}\n\nint main()\n\n{\n\
    \nint returnCode = divide(0, 2);\n\n}\n\n## Type casting\n\nVariables has defined\
    \ types, but there are situations where you’ll need to convert from one type to\
    \ another. Very commonly would be the conversion between integer to a float or\
    \ double\n\nThe general format is like so:\n\n(type)varToCast\n\nThis can be used\
    \ like so:\n\nint main()\n\n{\n\nint integer = 3;\n\nfloat decimal = 1.5f;\n\n\
