    that represents the number of elements that array is holding. There is a special
    variable type used to hold count variables, it’s called size_t and it is an unsigned
    integer value (Meaning it cannot become negative) used to hold values for a count.


    An example of an array being passed as a parameter is below:


    void Print_SingleDimenArray(size_t  length, int  ageArray[])


    {


    //Length is used to dynamically determine the for loop length


    for (int i = 0; i < length; i++)


