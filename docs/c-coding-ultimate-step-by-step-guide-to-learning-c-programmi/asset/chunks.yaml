    \ of a string\n\nint len = strlen(temp);\n\n//Dynamic allocation of memory\n\n\
    char* perfectSizeWord;\n\n//Allocates memory!\n\nperfectSizeWord = calloc(len,\
    \ sizeof(char));\n\n//This command would not work, it takes the memory location\
    \ of temp and just copies it so when\n\n//this function goes out of scope so does\
