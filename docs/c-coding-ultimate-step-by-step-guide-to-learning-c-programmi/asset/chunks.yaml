  trans: "\n向文件写入有两种方法：`fprintf()` 和 `fputs()`（类似于控制台打印命令 `printf()` 和 `puts()`）。它们唯一的区别在于\
    \ `fprintf()` 允许你使用像 `%s` 这样的格式化标识符，而 `fputs()` 则不允许。这意味着 `fputs()` 不需要检查格式，直接打印原始字符串，因此速度更快。`fputs()`\
    \ 还会自动在其给定的字符字符串末尾添加换行符 `\\n`，就像 `puts()`一样。下面的示例展示了如何打开、写入和关闭文件：\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n// 创建文件指针\nFILE* ptr;\n// 打开文件\nptr = fopen(\"C:/C_IO/example.txt\"\
    , \"w+\");\n\n// 写入文件\nfprintf(ptr, \"fprint()\\n\");\nfputs(\"fputs()\\n\", ptr);\n\
    \n// 关闭文件\nfclose(ptr);\n}\n```\n\n它直接在 C 盘的 `C_IO` 目录下创建一个文件（在运行程序之前请创建该目录）。它使用\
    \ `w+` 模式，因此每次运行程序时，文件中的数据都会被覆盖。\n\n你也可以仅使用 `fprintf()` 保存值，如下所示：\n\n```c\nfprintf(ptr,\
    \ \"%d\\n\", value);\n```\n\n* 打开文件 `fopen()`\n* 向文件写入\n    * `fprintf()`\n  \
    \  * `fputs()`\n* 关闭文件 `fclose()`\n\n## 练习\n\n- 编写一个程序保存加法函数的输出，将其保存到你之前在 C 盘（或你的主硬盘）上的\
    \ `C_IO` 目录，并命名为“addSave.txt”，使用 10 和 25 以及你的值。\n\n### 答案\n\n类似这样的即可，不需要完全一样，实现方式总有许多方法。\n\
    \n```c\n#include <stdio.h>\n\nint add(int num1, int num2)\n{\nreturn num1 + num2;\n\
    }\n\nint main()\n{\n// 获取要保存的值\nint saveValue = add(10, 25);\n// 创建文件指针\nFILE*\
    \ ptr;\n// 打开文件\nptr = fopen(\"C:/C_IO/addSave.txt\", \"w+\");\n\n// 写入文件 – 这就是\
    \ printf 的工作原理，只是没有格式化字符串\nfprintf(ptr, \"%d\\n\", saveValue);\n\n// 关闭文件\nfclose(ptr);\n\
    }\n```\n\n## 递归进阶\n\n我们在教程的基础部分提到过递归，再次强调，它是函数任务对自身的定义。正如所承诺的，下面进一步解释了几个递归的示例：\n\
    \n```c\nint factorial(int x)\n{\nint r;\n// 停止条件\nif (x == 1)\n{\n// 有结论所以停止循环\n\
    return 1;\n}\nelse\n{\n// 递归定义\nreturn r = x * factorial(x - 1);\n}\n}\n\nint\
    \ main()\n{\nputs(\"请输入一个数字: \");\n// 读取用户输入\nint a, b;\nscanf(\"%d\", &a);\n\
    // 开始执行\nb = factorial(a);\nprintf(\"阶乘是: %d\", b);\n}\n```\n\n这是一个世界著名的递归示例，用于计算数字的阶乘（3\
    \ 的阶乘是 3x2x1）。它通过上面的递归返回语句工作，通过设置一个不包含递归定义的返回语句来停止，即当 `x = 1` 时，函数直接返回 1，这意味着栈可以回溯并找到答案。下面是流程图：\n\
    \n![](img/00010.jpeg)\n\n## 第 3 章练习\n\n1. 指针变量持有什么内容？\n2. 使用什么运算符来表示指针？\n3. “++”对一个占\
    \ 4 字节的 `int` 类型指针会做什么？\n4. 在程序的生命周期内，静态变量被初始化多少次？\n5. 将变量定义为 `register` 时会发生什么？\n\
    6. 用于向文件写入两个两个函数是什么？\n7. `fopen()` 的 `w+` 模式的作用是什么？\n8. 在什么情况下下面的代码会执行？假设指针是一个整数指针\n\
    ```c\nif(pointer)\n{\n\n}\n```\n9. `&` 称为什么？它有什么作用？\n10. 当你将数组作为参数传递时，还需要传递它的什么？\n\
    \n# 第 4 章\n\n## 自定义结构体\n\n编程语言的可定制性允许它们承担任何角色，程序员可以操作和构建用于存储和处理数据的结构体。\n\n###\
    \ 结构体\n\n我们遇到的第一个用户定义对象是“结构体”，它允许自定义存储数据，定义如下：\n\n```c\nstruct Structure-Name\n\
    {\n// 语句\n};\n```\n\n其中语句是结构体持有的变量。结构体允许以有意义的方式自定义数据，与数组类似，区别在于数组存储许多相同类型的变量，而结构体可以存储多种类型，甚至是其他结构。\n\
    \n下面是一个真实的示例：\n\n```c\nstruct Person\n{\nint age;\nchar firstName[15];\nchar lastName[15];\n\
