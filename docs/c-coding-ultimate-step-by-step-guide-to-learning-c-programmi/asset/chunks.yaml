    \ to discard commenting and regret it later, don’t be that programmer.\n\nBasic\
    \ structure\nThere is also a required basic structure of a C programme, the structure\
    \ is below:\n\n```c\n#include <stdio.h>\n\nint main() {\n\n//Code goes here\n\n\
    }\n```\n\nThis is the structure to make your C programs run, don’t worry we’ll\
    \ learn what it all means\n\n# Chapter 2\n# Building Blocks\n## Variables and\
