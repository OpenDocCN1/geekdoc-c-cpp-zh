    //Size comparason\n\nprintf(\"Size of temp var:%d\\n\", sizeof(temp));\n\nprintf(\"\
    Size of new perfect var:%d\\n\", sizeof(perfectSizeWord));\n\nreturn perfectSizeWord;\n\
    \n}\n\nint main()\n\n{\n\n//Gets returned variables\n\nchar* word = getInput();\n\
    \n//Prints\n\nprintf(\"The word is:%s\\n\", word);\n\n//Delets memory\n\nfree(word);\n\
    \n}\n\nThe program above is large, take your time and look through. Try and implement\
