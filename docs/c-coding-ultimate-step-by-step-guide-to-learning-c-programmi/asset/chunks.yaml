    * 自动变量

    * 静态变量

    * 寄存器变量

    * 外部变量


    ### 自动变量


    我们目前为止定义的每个变量都是自动变量，它们在函数调用时创建，并在函数退出时自动销毁。这些变量也被称为局部变量。


