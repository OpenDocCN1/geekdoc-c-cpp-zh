    \n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello World\");\n   \
    \ return 0;\n}\n```\n\n## Running C on Mac\nRunning C on Mac is relatively easy\
    \ open up the terminal and run\n\n```bash\nclang --version\n```\n\nStart your\
    \ notepad, write down your:\n\n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"\
    Hello World\");\n    return 0;\n}\n```\n\n## Running C online\nOne of my favourite\
    \ online IDE is [https://www.codechef.com/ide](https://www.codechef.com/ide) it\
    \ provides a clear clean place to produce code.\n\n![](images/0009.jpeg)\n\n##\
