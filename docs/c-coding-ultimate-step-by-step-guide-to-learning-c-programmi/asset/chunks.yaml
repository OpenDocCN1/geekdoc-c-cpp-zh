  trans: "\n\n- `== 3;` 是赋值部分，将 `3` 的值置于整数框中以供以后使用。它也以分号结尾，分号用于表示一行的结束。\n\n该变量现在可以在程序的有效区域使用，例如：\n\
    \n```c\nint newInteger = integerName\n```\n\n之前定义的 `integerName` 的值 (``3`) 现在将被放入\
    \ `newInteger` 变量中，它们现在的值都将是 `3`。`integerName` 的值没有改变，因为它只是被复制并放置在 `newInteger`\
    \ 中。\n\n### 字符串 (String)\n\n`String` 是另一个重要的变量，这种变量类型用于存储一系列字符，一个例子可以是单词“batman”，该单词由存储在\
    \ `String` 变量中的字符组成。它是一个字符数组（稍后会更详细介绍数组），但实际上它是将单词的单个字符在内存中相邻存储在一起的。`\\n` 是一个代表换行的特殊字符。\n\
    \n```c\nchar word[] = \"dog\\n\";\n```\n\n// 并且它可以像这样使用并打印：\n\n```c\nprintf(word);\n\
    ```\n\n### 布尔值 (Boolean)\n\n布尔值用作表达式，其值只能是 `true (1)` 或 `false (0)`，用于表示某些状态或标记某些事件，它们还可以持有条件表达式的结果（稍后会更详细介绍条件表达式）。当我们学习条件语句时，这些将变得更有意义。\n\
    \n```c\n_Bool falseIsDetected = 0; // 假\n_Bool trueIsDetected = 1; // 真\n```\n\
    \n### 浮点数/双精度浮点数 (Float/Double)\n\n浮点变量是用浮点精度数学创建的小数值，其工作原理的技术元素超出了本教程的范围，但可以通过互联网上的资源轻松解释，只需搜索“floating\
    \ point precision”（浮点精度）。浮点数通过提供小数精度允许数值具有更高的精度。你可以通过在值的末尾加上 `f` 来指定一个 `float`\
    \ 值。\n\n```c\nfloat decimalValue = 3.0f;\n```\n\n### 空 (Void)\n\n这种数据类型是特殊的，用于指定没有可用值。这听起来违背直觉，但我们稍后来看它的用途。\n\
    \n### 注意的关键词/术语\n\n- `const` – 此关键字将变量变为只读，意味着它的值在初始化后无法更改。该关键字用法如下：\n\n```c\n\
    const float pi = 3.14f;\n```\n\n- 全局变量 (Global variable) – 这是一个描述在主函数之外定义变量的术语。例如\
    \ `int friendCount` 是全局变量，而 `int currentMonth` 则不是。注意它们定义的位置：\n\n```c\n// 全局\n\
    int friendCount = 0;\n\nint main()\n{\n// 非全局\nint currentMonth = 5;\n}\n```\n\
    \n这意味着全局变量可以在程序的任何位置使用，但如果使用不当可能会是危险的。一种正确的使用方法是与上述的 `const` 关键字结合使用，这意味着函数只能引用该值而不能更改它。\n\
    \n### 总结 (Recap)\n\n*   `int`: 存储整数\n*   `float / double`: 存储小数\n*   `void`: 指定没有类型\n\
    *   `boolean`: 存储真或假\n*   `string`: 组成单词或句子的字符数组\n*   `global`: 可以在任何地方访问的变量\n\
    *   `const`: 变量初始化后其值无法更改\n\n### 算术运算 (Arithmetic operations)\n\n| 符号 | 使用 |\n\
    | :--- | :--- |\n| `+` | `int result = 1 + 2;` |\n| `-` | `int result = 1 – 2;`\
    \ |\n| `/` | `float result = 1 / 2;` (因为有小数，它存储在 float 中) |\n| `*` | `Int result\
    \ = 1 * 2;` |\n| `%` | 取模运算符返回除法的余数 `int remain = 4 % 2;` |\n\n### 条件语句 (Conditionals)\n\
    \n以有意义的方式将值与其他值比较是条件语句的基础，下面是值比较的列表。\n\n| 名称 | 符号 | 详情 |\n| :--- | :--- | :---\
    \ |\n| 大于 | `>` | 如果左侧大于右侧，则返回真 |\n| 大于等于 | `>=` | 如果左侧大于等于右侧，则返回真 |\n| 小于 | `<`\
    \ | 如果左侧小于右侧，则返回真 |\n| 小于等于 | `<=` | 如果左侧小于等于左侧（此处原文有误，应为右侧），则返回真 |\n| 等于 | `==`\
    \ | 双等号用于比较两侧的值是否等价，如果相等则返回真 |\n| 不等于 | `!=` | 如果两个值不相等，则返回真 |\n\n上面的条件语句列表可以在特定情况下控制程序的执行流。\n\
    \n#### If 语句 (If statement)\n\n在某些情况下，你需要在某个条件成立时执行某些操作，这就是 `If` 语句的作用，也是条件语句介入的地方。\n\
    \n```c\nif (Condition)\n{\n // 如果 Condition 为真，代码将在此运行\n}\n// 如果条件为假，If 语句被忽略，程序将跳转到这里\n\
    ```\n\n一个真实世界的示例：\n\n```c\nint compare = 10;\n\nif (compare > 5)\n{\n //printf()\
    \ 将打印括号中的字符串\n}\n```\n\n"
- fmt: "\n- `||` (Double Bar): Used to string two conditions together and will only\
    \ return true if one of the conditions are true.\n\n## Switch-Case\n\nSwitch cases\
    \ are used to test a variable for equality with a constant expression without\
    \ the need for multiple `if`-statements. One use for this structure is check users\
    \ input string. Below is the basic structure of the switch case:\n\n```c\n//Switch-Case\n\
    switch (expression)\n{\n    //Case statement\n    case constant-expression:\n\
    \        break; //Break isn't needed\n    //Any number of case statements\n  \
    \  default:\n        break;\n}\n```\n\nThe `switch` starts off with an `expression`,\
    \ this is the variable that is to be compared to the `constant-expressions`, these\
    \ constants are the literal values of the variable such as `1` or `Z`. Breaks\
    \ are optional but without them the code will `flow-down` into other statements.\
    \ There is an example below using a switch-case statement, the user inputs a character\
    \ if the `char` is `N` or `Y`, ‘No’ and ‘Yes’ is output respectively but there’s\
    \ a default case that applies for all situations, this needs to be at the end.\n\
    \n```c\nchar character;\n//Reads in user input (Explained in more detail later)\n\
    scanf(\"%s\", &character);\n\n//Switch-Case\nswitch (character)\n{\n    case 'N':\n\
    \        printf(\"NO\\n\");\n        break;\n    case 'Y':\n        printf(\"\
    YES\\n\");\n        break;\n    default:\n        printf(\"Do not understand!\\\
    n\");\n        break;\n}\n```\n\nIf there is no `break` statement a `flow-down`\
    \ will occur, below is an example just like above but without the `break` statements\
    \ and we’ll what the output is like:\n\n```c\nchar character;\n//Reads in user\
    \ input (Explained in more detail later)\nscanf(\"%s\", &character);\n\n//Switch-Case\n\
    switch (character)\n{\n    case 'N':\n        printf(\"NO\\n\");\n    case 'Y':\n\
    \        printf(\"YES\\n\");\n    default:\n        printf(\"Do not understand!\\\
    n\");\n}\n```\n\nIf `N` is the user input the Output will be:\n>NO\n>YES\n>Do\
    \ not understand!\n\nThis is because when one case statement is triggered it will\
    \ continue down until a `break` statement is found to stop running the case body\
    \ code.\n\n## Iteration\n\nIteration means looping, and looping quickly gives\
    \ programs the ability to perform lots of similar operations very quickly, there’re\
    \ two types of iteration: `for loops` and `while loops/do-while loop`.\n\n###\
    \ For Loop\n\nThe `for` loop is given an end value and loops up until that value,\
    \ while keeping track of what loop number it’s currently on, here is an example\
    \ below:\n\n```c\nfor(int x = 0; x > 10; x++)\n{\n    printf(\"Looped!\");\n}\n\
    ```\n\nEach part of the `for`-loop has a role:\n\n- **Declaration section**: This\
    \ is the Declaration section to define the loop counter variable, this defines\
    \ the start point of the counter.\n- **Conditional section**: This section is\
    \ called the Conditional and it contains a conditional statement that is checked\
    \ at the end of the loop to see if the `if`-statement should continue looping,\
    \ so in this case the loop should continue looping if `x > 10`, if this condition\
    \ becomes false the loop will not continue.\n- **Increment section**: The blue\
    \ statement is the Increment section where the loop counter is incremented (increased\
    \ in value), the `x++` is shorthand for `x = x + 1`. This can also be `x--`, if\
    \ there was a case requiring the counter to decrease.\n\n- Declaration section\
    \ defines the loop counter.\n- Conditional section continues the loop if true.\n\
    - Increment section is where the loop counter is incremented.\n\n### Conditional\
    \ Loops\n\nConditional loops work like the `for` loop but don’t have a loop counter\
    \ and will only loop while a condition is True. This means you can create an infinite\
    \ loop, like so:\n\n```c\nwhile (TrueCondition)\n{\n    printf(\"This will not\
    \ stop looping\");\n}\n```\n\n**Note**: An infinite loop is normally constructed\
    \ using a naked `for-loop`:\n\n```c\nfor(;;)\n{\n    printf(\"This will also never\
    \ stop looping\");\n}\n```\nThis loop will never end and your program will get\
    \ stuck within the loop.\n\nThe example below shows if the condition is false\
    \ the program will never reach the code within the brackets:\n\n```c\nwhile (FalseCondition)\n\
    {\n    printf(\"This code will never run\");\n}\n```\n\nTo use this loop effectively\
    \ you can use it with a conditional statement (like the `if` statement) or you\
    \ can use it with a `bool` variable, examples are below:\n\n```c\nint count =\
    \ 0;\nwhile (count > 10)\n{\n    printf(\"loop\");\n    //Remember this, it’s\
    \ the same as “count = count + 1;\n    count++;\n}\n```\n\nAs it says above you\
    \ can also use a `while` loop directly with a Boolean variable:\n\n```c\nint count\
    \ = 0;\n_Bool keepLooping = 1; //Bool is true (1) is true\nwhile (keepLooping)\n\
    {\n    printf(\"loop\\n\");\n    //Remember this, it’s the same as “count = count\
    \ + 1;”\n    count++;\n    if(count == 3)\n    {\n        keepLooping = 0; //keepLooping\
    \ is now false, and the loop will stop\n    }\n}\n```\n\n### Do-While\n\nThe `do-while`\
    \ loop is very similar to the `while` loop but it executes the body at least once\
    \ before checking the condition.\n\n```c\n#include <stdio.h>\n\nint main()\n{\n\
    \    int count = 0;\n    _Bool correct = 1;\n\n    do\n    {\n        printf(\"\
    Please enter the letter: \");\n        char z;\n        scanf(\"%s\", &z);\n\n\
    \        if (z != 'z')\n        {\n            printf(\"Incorrect!\\n\");\n  \
    \          correct = 0;\n        }\n        else\n        {\n            printf(\"\
    Correct!\\n\");\n        }\n    } while (correct);\n\n    return 0;\n}\n```\n\n\
    ## Loop Keywords\n\nSometimes there are situations where you want to prematurely\
    \ stop the entire loop or a single iteration, this is where loop keywords come\
    \ into use.\n\nBreak: Will stop the entire loop, this can be useful if an answer\
    \ has been found and the rest of the iterations would be pointless.\n\n```c\n\
    for (int x = 0; x < 5; x++)\n{\n    if (x == 3)\n    {\n        break;\n    }\n\
    \    printf(\"Loop value: %d\", x);\n}\n```\n\nNow if the code is changed to not\
    \ include the `break`:\n\n```c\nfor (int x = 0; x < 5; x++)\n{\n    printf(\"\
    Loop value: %d\", x);\n}\n```\n\nContinue: If we use the code from above but replace\
    \ it for a `continue` the code will look like so:\n\n```c\nfor (int x = 0; x <\
    \ 5; x++)\n{\n    if (x == 3)\n    {\n        continue;\n    }\n    printf(\"\
    Loop value: %d\", x);\n}\n```\nThis shows that when `x = 3` the `continue` is\
    \ executed and the loop is skipped and so the `printf` statement is also skipped.\n\
    \n## Nested Loops\n\nYou can also place loops within loops to perform specific\
    \ roles, in the example we are using `for-loops` but this can also be done with\
    \ the `while/do` loop.\n\nThe example is printing out a 2D grid, the nested `for`-loop\
    \ gives another dimension:\n\n```c\n//Prints a 5x5 grid\nfor (int y = 0; y < 5;\
    \ y++)\n{\n    for (int x = 0; x < 5; x++)\n    {\n        //Prints an element\
    \ of the row\n        printf(\"X \");\n    }\n}\n```\n"
  raw: "*   || (Double Bar)Used to string two conditions together and will only return\
    \ true if one of the conditions are true\n\nSwitch-Case\n\nSwitch cases are used\
    \ to test a variable for equality with a constant expression without the need\
    \ for multiple if-statements. One use for this structure is check users input\
    \ string. Below is the basic structure of the switch case:\n\n//Switch-Case\n\n\
    switch (expression)\n\n{\n\n//Case statement\n\ncase constant-expression:\n\n\
    break; //Break isn't needed\n\n//Any number of case statements\n\n// |\n\n// |\n\
    \n//\\ /\n\n// .\n\ndefault:\n\nbreak;\n\n}\n\nThe switch starts off with an ‘expression’,\
    \ this is the variable that is to be compared to the ‘constant-expressions’, these\
    \ constants are the literal values of the variable such as ‘1’ or ‘Z’. Breaks\
    \ are optional but without them the code will ‘flow-down’ into other statements.\
    \ There is an example below using a switch-case statement, the user inputs a character\
    \ if the char is N or Y, ‘No’ and ‘Yes’ is output respectively but there’s a default\
    \ case that applies for all situations, this needs to be at the end.\n\nchar character;\n\
    \n//Reads in user input (Explained in more detail later)\n\nscanf(\"%s\", &character);\n\
    \n//Switch-Case\n\nswitch (character)\n\n{\n\ncase  'N':\n\nprintf(\"NO\\n\");\n\
    \nbreak;\n\ncase  'Y':\n\nprintf(\"YES\\n\");\n\nbreak;\n\ndefault:\n\nprintf(\"\
    Do not understand!\\n\");\n\nbreak;\n\n}\n\nIf there is no break statement a ‘flow-down’\
    \ will occur, below is an example just like above but without the break statements\
    \ and we’ll what the output is like:\n\nchar character;\n\n//Reads in user input\
    \ (Explained in more detail later)\n\nscanf(\"%s\", &character);\n\n//Switch-Case\n\
    \nswitch (character)\n\n{\n\ncase  'N':\n\nprintf(\"NO\\n\");\n\ncase  'Y':\n\n\
    printf(\"YES\\n\");\n\ndefault:\n\nprintf(\"Do not understand!\\n\");\n\n}\n\n\
    If ‘N’ is the user input the Output will be:\n\n>NO\n\n>YES\n\n>Do not understand!\n\
    \nThis is because when one case statement is triggered it will continue down until\
    \ a break statement is found to stop running the case body code.\n\n## Iteration\n\
    \nIteration means looping, and looping quickly gives programs the ability to perform\
    \ lots of similar operations very quickly, there’re two types of iteration: ‘for\
    \ loops’ and ‘while loops/do-while loop’\n\nFor Loop\n\nThe for loop is given\
    \ an end value and loops up until that value, while keeping track of what loop\
    \ number it’s currently on, here is an example below:\n\nfor(int x = 0; x > 10;\
    \ x++)\n\n{\n\n    printf(“Looped!”);\n\n}\n\nfor(int x = 0; x > 10; x++)\n\n\
    Each part of the for-loop has a role\n\nRed\n\nThis is the Declaration section\
    \ to define the loop counter variable, this defines the start point of the counter\n\
    \nGreen\n\nThis section is called the Conditional and it contains a conditional\
    \ statement that is checked at the end of the loop to see if the if-statement\
    \ should continue looping, so in this case the loop should continue looping if\
    \ x > 10, if this condition becomes false the loop will not continue.\n\nBlue\n\
    \nThe blue statement is the Increment section where the loop counter is incremented\
    \ (increased in value), the x++ is shorthand for x = x + 1 . This can also be\
    \ x--, if there was a case requiring the counter to decrease.\n\n*   Declaration\
    \ section defines the loop counter\n\n*   Conditional section continues the loop\
    \ if true\n\n*   Increment section is where the loop counter is incremented\n\n\
    Conditional Loops\n\nConditional loops work like the for loop but don’t have a\
    \ loop counter and will only loop while a condition is True. This means you can\
    \ create an infinite loop, like so:\n\nwhile (TrueCondition)\n\n{\n\n     printf(“This\
    \ will not stop looping”);\n\n}\n\nNote:\n\nAn infinite loop is normally constructed\
    \ using a naked for-loop:\n\nfor(;;)\n\n{\n\n     printf(“This will also never\
    \ stop looping”);\n\n}\n\nThis loop will never end and your program will get stuck\
    \ within the loop.\n\nThe example below shows if the condition is false the program\
    \ will never reach the code within the brackets\n\nwhile (FalseCondition)\n\n\
    {\n\n     printf(“This code will never run”);\n\n}\n\nTo use this loop effectively\
    \ you can use it with a conditional statement (like the if statement) or you can\
    \ use it with a bool variable, examples are below\n\nint count = 0;\n\nwhile (count\
    \ > 10)\n\n{\n\n     printf(“loop”);\n\n //Remember this, it’s the same as “count\
    \ = count + 1;”\n\n     count++;\n\n}\n\nAs it says above you can also use a while\
    \ loop directly with a Boolean variable:\n\nint count = 0;\n\n_Bool keepLooping\
    \ = 1; //Bool is true (1) is true\n\nwhile (keepLooping)\n\n{\n\n     printf(“loop\\\
    n”);\n\n //Remember this, it’s the same as “count = count + 1;”\n\n     count++;\n\
    \n     if(count == 3)\n\n     {\n\nkeepLooping = 0; //keepLooping is now false,\
    \ and the loop will stop\n\n     }\n\n}\n\nThis is very similar to how a for loop\
    \ operates, but it is important to understand the different uses for a while loop.\n\
    \nNote:\n\nThe section in the brackets of the while loop is checking if that condition\
    \ is true, you can also write it like so:\n\nwhile(!stopLooping) {}\n\nThis is\
    \ effectively saying, keep looping while stopLooping is “not true”, the “!” is\
    \ symbol means “not”.\n\nDo-While\n\nA Do-While loop is almost exactly the same\
    \ as While loop but with one small difference, it checks if the condition is true\
    \ after executing the code in the body of the loop, a while loop checks the if\
    \ the condition is true before executing the body. The code snippet below shows\
    \ this difference:\n\n_Bool falseCondition = 0;\n\nwhile(falseCondition)\n\n{\n\
    \n    printf(“While Loop\\n”);\n\n}\n\ndo\n\n{\n\n    printf(“Do Loop\\n”);\n\n\
    } while(falseCondition)\n\nOutput:\n\n> Do Loop\n\nBecause even though the Boolean\
    \ is false, the Do loop executed a single time because the check was at the end\
    \ of the body.\n\nUsing a Do-Loop\n\nA real-world example of a do-loop cool be\
    \ checking for user input, it prints out and asks for input if all is okay there\
    \ is no need for looping if not it will loop. An example looking for the user\
    \ to enter a ‘z’ is below\n\n#include  <stdio.h>\n\nint main()\n\n{\n\n//Will\
    \ loop if this is false\n\n_Bool correct = 1;\n\ndo\n\n{\n\nprintf(\"Please enter\
    \ the letter 'z': \");\n\n//Takes in user input\n\nchar z;\n\nscanf(\"%s\", &z);\n\
    \n//Checks if answer is correct\n\nif (z != 'z')\n\n{\n\n//Incorrect\n\ncorrect\
    \ = 0;\n\nprintf(\"Incorrect!\\n\");\n\n}\n\nelse\n\n{\n\n//Correct\n\ncorrect\
    \ = 1;\n\n}\n\n} while (!correct);\n\n//If the user has completed the task\n\n\
    printf(\"Correct!\");\n\n}\n\nLoop control keywords\n\nSometimes there are situations\
    \ where you want to prematurely stop the entire loop or a single iteration (loop),\
    \ this is where loop control keywords come into use.\n\nYou have either a break\
    \ or continue keyword:\n\nbreak – Will stop the entire loop, this can be useful\
    \ if an answer has been found and the rest of the planned iterations would be\
    \ pointless.\n\nfor (int x = 0; x < 5; x++)\n\n{\n\nif (x == 3)\n\n{\n\nbreak;\n\
    \n}\n\n//The technicalities of this statement will be explained later\n\nprintf(\"\
    Loop value: %d\", x);\n\n}\n\nOutput:\n\n> Loop value: 0\n\n> Loop value: 1\n\n\
    > Loop value: 2\n\nNow if the code is changed to not include the break:\n\nfor\
    \ (int x = 0; x < 5; x++)\n\n{\n\n//The technicals of this statement will be explained\
    \ later\n\nprintf(\"Loop value: %d\", x);\n\n}\n\nOutput:\n\n> Loop value: 0\n\
    \n> Loop value: 1\n\n> Loop value: 2\n\n> Loop value: 3\n\n> Loop value: 4\n\n\
    Continue – If we use the code from above but replace it for a continue the code\
    \ will look like so:\n\nfor (int x = 0; x < 5; x++)\n\n{\n\nif (x == 3)\n\n{\n\
    \ncontinue;\n\n}\n\n//The technicals of this statement will be explained later\n\
    \nprintf(\"Loop value: %d\", x);\n\n}\n\nThe output it like so:\n\nOutput:\n\n\
    > Loop value: 0\n\n> Loop value: 1\n\n> Loop value: 2\n\n> Loop value: 4\n\nThis\
    \ shows that when x = 3  the continue is executed and the loop is skipped and\
    \ so is the printf statement is also skipped so there is no “Loop value: 3”\n\n\
    Nested loops\n\nYou can also place loops within loops to perform specific roles,\
    \ in the example we are using for-loops but this can also be done with the while/do\
    \ loop.\n\nThe example is printing out a 2D grid, the nested for-loop gives another\
    \ dimension:\n\n//Prints a 5x5 grid\n\nfor (int y = 0; y < 5; y++)\n\n{\n\nfor\
    \ (int x = 0; x < 5; x++)\n\n{\n\n//Prints an element of the row\n\nprintf(\"\
    X \");\n\n}"
