    \n> 4\n\nWhat happens is any decimal values are truncated (removed) and the remainder\
    \ is added to the integer value.\n\nYou can also upgrade a value, this example\
    \ shows when a integer is upgraded to a float:\n\nint main()\n\n{\n\nint integer\
    \ = 3;\n\nfloat decimal = 1.5;\n\n//Explicit casting\n\nfloat result = decimal\
    \ + (float)integer;\n\nprintf(\"%f\\n\", result);\n\n//Implicit casting\n\nfloat\
    \ result = decimal + integer;\n\nprintf(\"%f\\n\", result);\n\n}\n\nThis can be\
    \ done either implicitly or explicitly. Implicit is when the complier automatically\
    \ converts the variable and explicitly is when you use the casting operator. It\
    \ is however very good practice to specify a cast wherever it is necessary.\n\n\
    ## Memory management\n\nC allows programmers to dynamically manage memory. This\
    \ functionality is provided by:\n\n#include  <stdlib.h>\n\nMemory management requires\
    \ the use of a few functions\n\n*   void *calloc(int num, int size);\n\n    *\
    \   This function allocates an array (size specified by num) and the size of each\
    \ allocated specified by size\n\n*   void free(void *address);\n\n    *   This\
    \ function releases memory, the location is specified by address.\n\n*   void\
    \ *malloc(int num);\n\n    *   This function works like calloc but leaves the\
    \ locations uninitialized.\n\n*   void *realloc(void *address, int newsize)\n\n\
    \    *   This function re-allocates memory to the size specified in newsize\n\n\
    Below is an example of using malloc or calloc to allocate memory for a string:\n\
    \n#include  <stdio.h>\n\n#include  <stdlib.h>\n\n#define  WORD_SIZE 20\n\nint\
    \ main()\n\n{\n\nchar* word;\n\n//Allocates memory\n\nword = malloc(WORD_SIZE\
    \ * sizeof(char));\n\n//or\n\nword = calloc(WORD_SIZE, sizeof(char));\n\n//Copies\
    \ values over\n\nstrcpy(word, \"Hello nice to meet you!\");\n\n//Printing\n\n\
    printf(\"The string is: \\\"%s\\\"\", word);\n\n//Deletes memory\n\nfree(word);\n\
