    \ 函数指针\n    - 存储类分类\n    - 文件 I/O\n    - 练习\n    - 递归进\n    - 第 3 章练习\n- 第 4 章\n\
    \    - 自定义结构\n    - 结构\n    - Typedef\n    - 枚举\n    - 练习\n    - 联合体\n    - 可变长度参数列表\n\
    \    - 练习\n    - 第 4 章练习\n- 第 5 章\n    - 高级特性\n    - 头文件\n    - 预处理器指令\n    -\
    \ 错误处理\n    - 类型转换\n    - 内存管理\n    - 练习\n    - 第 5 章练习\n\n# 第 1 章\n# 介绍与安装\n\n\
    ## C 语言的历史\nC 是一种通用计算机语言，首次于 1972 年作为一个概念出现。C 的首席开发者是丹尼斯·里奇（Dennis Ritchie）。C\
    \ 的起源与 Unix 操作系统的创建密切相关。\n\n在本教程中，我们将从 C 的最基础知识一直到中级水平。本教程旨在吸引首次学习编程语言的读者。\n\n\
    ## 在 Windows 上运行 C\n在 Windows 上运行 C 可以通过 Visual Studio 2015 实现。可以直接从微软下载 Visual\
    \ Studio，在安装过程中需要选择 C++ 作为语言。菜单应该如下所示：\n\n![](img/00001.jpeg)\n\n在选择 `Visual C++`\
    \ 后完全安装程序。\n\n您应该启动 Visual Studio 并进入 `FILE -> New Project`，您将看到一个如下的窗口：\n\n![](img/00002.jpeg)\n\
    \n选择 `Win32 Console Application` 并点击 `Ok`\n\n现在会显示几个菜单，请跟随高亮部分进行操作。（高亮的选框需要取消勾选）：\n\
    \n![](img/00003.jpeg) ![](img/00004.jpeg)\n\n当程序模板加载后，您应该注意到并没有为您提供 C 环境，而是 C++\
    \ 环境，您需要将其转换为 C：\n\n进入 `Solution explorer`（解决方案管理器），将打开 `Solution Explorer` 菜单\n\
    \n![](img/00005.jpeg) ![](img/00006.jpeg)\n\n右键点击 `.cpp` 文件并点击 `Properties`（属性）\n\
    \n![](img/00007.jpeg)\n\n将出现一个菜单，展开 `C/C++ menu`，进入 `Advanced`，找到 `Compile As`\
    \ 部分并从下拉菜单中选择 `Compile as C Code (/TC)`\n\n![](img/00008.jpeg)\n\n代码现在已准备好运行了！当您想要编译的代码就绪后，点击顶部菜单上的绿色箭头运行您的控制台应用程序。\n\
    \n## 在 Linux 上运行 C\n在 Linux 上开发基础代码相对容易，首先您需要 `gcc` 编译器，如果没有安装，请运行：\n\n```bash\n\
    apt-get install gcc-5\n```\n\n下一阶段是创建您的程序，打开一个文本编辑器（在此例中为 Leafpad），使用此基础程序进行测试：\n\
    \n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello World\");\n   \
    \ return 0;\n}\n```\n\n## 在 Mac 上运行 C\n在 Mac 上运行 C 相对容易，打开终端并运行\n\n```bash\nclang\
    \ --version\n```\n\n启动您的记事本，输入：\n\n```c\n#include <stdio.h>\n\nint main() {\n\
    \    printf(\"Hello World\");\n    return 0;\n}\n```\n\n## 在线运行 C\n我喜欢的在线 IDE\
    \ 之一是 [`www.codechef.com/ide`](https://www.codechef.com/ide)，它提供了一个清晰整洁的代码环境。\n\
    \n![](img/0009.jpeg)\n\n## 前提条件\n在整个教程中，您会看到散落在各代码片段。有些点需要解释，以便您充分利用本教程：\n\n注释\n\
    代码中的注释由 `//` 标识，计算机会忽略这些内容，注释是保持代码可读性和易于维护的重要部分。初学者往往会忽略注释并在以后后悔，不要成为那种程序员。\n\n\
    基础结构\nC 程序还有一个基本的结构结构，结构如下：\n\n```c\n#include <stdio.h>\n\nint main() {\n\n//代码写在这里\n\
    \n}\n```\n\n# 第 2 章\n# 基础单元\n## 变量与类型\n程序的基础是数据，以数字和字符的形式存在。数据的存储、处理和输出赋予了程序功能。变量持有这些数据，将其想象用于存储单个元素的盒子。\n\
    \nC 是一种强类型语言，每个变量必须有一个定义的类型。类型是定义变量可以包含内容的标识符。我们遇到的第一个类型是整数，它可以存储实数（不带小数点的数字），整数定义如下：\n\
    \n```c\nint integerName = 3;\n```\n\n- `int` 是定义的类型关键字，我们稍后会学习不同的可能性。\n\n- `integerName`\
    \ 是变量的标识，可以是任何您想调用的名称，这允许变量具有有意义的名字，变量可以定义为 `int pineapple = 3;`，但使其相关是良好的习惯。然而，这里也有例外，变量名不能是单个数字（例如\
    \ `4`）或不能包含特殊字符（`!”£$%^&*)`）等。\n\n"
- fmt: "\n- `= 3;` Is the assignment section, where the values of `3` is placed in\
    \ the integer box for use later. This also ends with a semi colon, this is used\
    \ to signify the end of a line.\n\nThis variable can now be used in valid areas\
    \ of the program, like so:\n\n```c\nint newInteger = integerName\n```\n\nThe value\
    \ of `integerName` defined earlier (`3`) will now be placed in the `newInteger`\
    \ variable and they will now both have the value of `3`. The value of `integerName`\
    \ doesn’t change as it is just being copied and placed into `newInteger`.\n\n\
    ### String\n\nThe `String` is another crucial variable, this variable type is\
    \ used to store a series of characters, an example could be the word “batman”,\
    \ the word is composed of characters that are stored in the `String` variable.\
    \ It’s an array of characters (More on arrays later), but effectively it’s the\
    \ single characters of the word stored next to each other in memory. The `\\n`\
    \ is a special character that stands for a newline.\n\n```c\nchar word[] = \"\
    dog\\n\";\n```\n\n//And it can be used and printed it like so:\n\n```c\nprintf(word);\n\
    ```\n\n### Boolean\n\nBooleans are used as expressions, their values can only\
    \ be `true (1)` or `false (0)` and are used to signify certain states or flag\
    \ certain events, they can also hold the result for a conditional expression (More\
    \ on conditional expressions later). These will make more sense when we go thought\
    \ conditional statements.\n\n```c\n_Bool falseIsDetected = 0; //False\n_Bool trueIsDetected\
    \ = 1; //True\n```\n\n### Float/Double\n\nFloating point variables are decimal\
    \ values created with float point precision math, the technical elements of how\
    \ this works are outside of the scope of this tutorial but can easily be explained\
    \ through resources on the internet, just search “floating point precision”. Floats\
    \ allows for a higher level of accuracy of a value by providing decimal precision.\
    \ You can specify a `float` value by putting an `f` and the end of the value.\n\
    \n```c\nfloat decimalValue = 3.0f;\n```\n\n### Void\n\nThis data type is special\
    \ and is used to specify no value is available. This sounds counter intuitive,\
    \ but we’ll see where this is used later.\n\n### Notable keywords/terms\n\n- `const`\
    \ – This keyword turns the variable read-only, meaning it’s value cannot be changed\
    \ after it is initialised. The keyword is used like so:\n\n```c\nconst float pi\
    \ = 3.14f;\n```\n\n- Global variable – This is a term describing a variable definition\
    \ outside the main function. For example, the `int friendCount` is a global variable\
    \ and the `int currentMonth` is not. Note the positions they’re defined:\n\n```c\n\
    //Global\nint friendCount = 0;\n\nint main()\n{\n//Not Global\nint currentMonth\
    \ = 5;\n}\n```\n\nThis means the global variable can be used in any location in\
    \ the program and can be dangerous if not used correctly. One correct way it to\
    \ use it in conjunction with the `const` keyword above, this means functions can\
    \ only reference the value and not change it.\n\n### Recap\n\n*   `int`: Holds\
    \ real numbers\n*   `float / double`: Hold decimal numbers\n*   `void`: Specifies\
    \ there is not type\n*   `boolean`: Holds either true or false\n*   `string`:\
    \ An array of characters making up a word or sentence\n*   `global`: A variable\
    \ that can be accessed anywhere\n*   `const`: After a variable has been initialised\
    \ its value cannot be changed\n\n### Arithmetic operations\n\n| Symbol | Use |\n\
    | :--- | :--- |\n| `+` | `int result = 1 + 2;` |\n| `-` | `int result = 1 – 2;`\
    \ |\n| `/` | `float result = 1 / 2;` (This is stored in a float because of the\
    \ decimal) |\n| `*` | `Int result = 1 * 2;` |\n| `%` | Modulus operator returns\
    \ the remainder of a division `int remain = 4 % 2;` |\n\n### Conditionals\n\n\
    Comparing values to other values in a meaningful way is fundamental for conditional\
    \ statements, below is a list of comparisons of values.\n\n| Name | Symbol | Detail\
    \ |\n| :--- | :--- | :--- |\n| Greater than | `>` | Returns true if left-hand\
    \ side is larger than the right |\n| Greater than or equal than | `>=` | Returns\
    \ true if the left-hand side is larger or equal to the right |\n| Less than |\
    \ `<` | Returns true if the left-hand side is smaller than the right side |\n\
    | Less than or equal than | `<=` | Returns true if the left-hand side is smaller\
    \ or equal to the left side |\n| Equal | `==` | A double equal sign is used to\
    \ compare if the value of either side is equivalent and returns true if equivalent\
    \ |\n| Not Equal | `!=` | Returns true if the two values are not equivalent |\n\
    \nThe list of conditionals above can be used in certain circumstances to control\
    \ the flow of the program.\n\n#### If statement\n\nThere are situations where\
    \ you need something to happen if a certain condition is the case, this is the\
    \ role of the `If` statement and where conditional statements come into the mix.\n\
    \n```c\nif (Condition)\n{\n //Code will run here if Condition is True\n}\n//If\
    \ the condition is false, the If statement is ignored and the program jumps here\n\
    ```\n\nA real-world example:\n\n```c\nint compare = 10;\n\nif (compare > 5)\n\
    {\n //printf() will print the string in the brackets\n     printf(\"Code here\
    \ will run!\");\n}\n```\n\nOutput:\n`> Code here will run!`\n\nThese allow a programmer\
    \ to control the flow of the program and choose situations to happen when a possibility\
    \ is true, we’ll go onto more examples later.\n\n#### Else Statement\n\n`Else`s\
    \ are optional but these can be added to the end of an if-statement and will only\
    \ run if the if-statement condition is false\n\n```c\nif (Condition)\n{\n //Code\
    \ will run here if Condition is True\n}\nelse\n{\n //Code will run here if Condition\
    \ is false\n}\n```\n\nElse statements can also become an else/if statement where\
    \ the condition is is, look like this:\n\n```c\nif (Condition1)\n{\n //Code will\
    \ here if Condition1 is\n\n}\nelse (Condition2)\n{\n //Code will run here if Condition1\
    \ is False and Condition2 is True\n}\n```\n\n#### Else chain\n\nIf any conditions\
    \ along the chain are true, the ones below are not. I’ll demonstrate this below:\n\
    \n```c\nint main()\n{\n_Bool false = 0;\n_Bool true = 1;\n\nif (false)\n{\nprintf(\"\
    Condition 1\");\n}\nelse if (true) //This condition is true!\n{\nprintf(\"Condition\
    \ 2\");\n}\nelse if (true) //Ignored due to previous statement being true\n{\n\
    printf(\"Condition 3\");\n}\nelse if (true) //Also ignored due to condition 2\
    \ being true\n{\nprintf(\"Condition 4\");\n}\n}\n```\n\nOutput\n`> Condition 2`\n\
    \n#### Exercise\n\nCreate a program that prints out if a value is bigger or smaller\
    \ than another, use this skeleton program to get started. So in this case it should\
    \ print “Value 1 is larger” (Note: Use `printf()` for printing\n\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n//Values you change\nint value1 = 10;\nint value2\
    \ = 5;\n\n//PUT CODE HERE\n}\n```\n\n#### Solution\n\nThis solution could be something\
    \ like this:\n\n```c\n#include <stdio.h>\n\nint main()\n{\n//Values you change\n\
    int value1 = 10;\nint value2 = 10;\n\nif (value1 == value2)\n{\nprintf(\"Values\
    \ are equal!\");\n}\nelse if (value1 > value2)\n{\nprintf(\"Value 1 is bigger!\"\
    );\n}\nelse\n{\nprintf(\"Value 2 is bigger!\");\n}\n}\n```\n\nJust change the\
    \ values of `value1` and `value2` before you run the program to test it.\n\n###\
    \ Using multiple conditions\n\nYou can use more than one condition in a single\
    \ statement, there’re two ways of doing this AND signified by `&&` and OR signified\
    \ by `||` (Double vertical bar).\n\nAND checks if both conditions are true before\
    \ triggering the body of the statement\n\n```c\nif (Condition1 && Condition2)\n\
    {\n //Code will run here if Condition1 AND Condition2 are True\n}\n```\n\nOR checks\
    \ if one of the conditions are true before triggering the body of the statement\n\
    \n```c\nif (Condition1 || Condition2)\n{\n //Code will run here if Condition1\
    \ OR Condition2 are True (Works if both are true)\n}\n```\n"
