    \ for file\n\nfile = fopen(\"youWillNotFindMe.txt\", \"rb\");\n\n//If the file\
    \ returned an error\n\nif (file == NULL)\n\n{\n\n//Grabs error code\n\nerrnum\
    \ = errno;\n\n//Prints error code\n\nfprintf(stderr, \"Value of errno: %d\\n\"\
    , errno);\n\n//Returns string provided + : and Error code message\n\nperror(\"\
    Error printed by perror\");\n\n//Grabs the error text\n\nchar* errorMsg[] = {\
