  trans: "\n再次回到计算器示例，头文件可以像下面这样是一个函数列表，然后可以包含它以允许使用这些函数。\n\n## 预处理器指令\n\n预处理用于给编译器提供某种指令，你已经遇到过几次指令了，比如\
    \ `#include` 指令，它告诉编译器包含某个头文件。\n\n下面是处理器指令的列表，我们将介绍它们是如何工作的：\n\n| 指令 | 描述 |\n\
    | :--- | :--- |\n| `#define` | 用于定义宏 |\n| `#include` | 从另一个文件中插入特定的头文件。 |\n| `#undef`\
    \ | 移除 `#define` 的效果 |\n| `#ifdef` | 如果此宏已定义，则返回真。 |\n| `#ifndef` | 如果此宏未定义定义，则返回真。\
    \ |\n| `#if` | 测试编译时条件是否为真。 |\n| `#else` | `#if` 的替代方案。 |\n| `#elif` | 一个语句中的\
    \ `#else` 和 `#if`。 |\n| `#endif` | 结束预处理器条件判断。 |\n\n### #define 和 #undef\n\n这些命令用于使用全局值来增加可读性，例如：\n\
    \n`#define LOOP_NUMBER 2;`\n\n可以像这样定义并使用：\n\n```c\nfor (int i = 0; i < LOOP_NUMBER;\
    \ i++)\n{\n    //循环代码\n}\n```\n\n该 for 循环将循环两次，但你不能像普通变量那样更改它的值，它在程序生命周期内是常量，除非使用\
    \ `#undef`，它会取消定义设置的值。\n\n`#undef` 通常用于重写内置指令，你可以在那里取消定义一个值，然后设置一个你选择的值。\n\n###\
    \ #ifdef 和 #if\n\n如果宏已定义，`#ifdef` 和 `#ifndef` 分别返回真和假，这种最常见的用法是检查是否设置了 `-DDEBUG`\
    \ 标志，并在 DEBUG 模式下运行在完成的程序中没有用处的代码。它的用法如下：\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n#ifdef DEBUG\n    puts(\"DEBUG!\");\n#endif\n}\n```\n\n这段代码只有在代码标记为调试模式时才会运行。这对于程序员来说非常有用。\n\
    \n`#if`、`#else` 和 `#elif` 的工作方式与 if 语句完全相同，但它们用于使用算术表达式检查宏，而不是检查其是否存在。\n\n## 错误处理\n\
    \n错误处理是一个非常重要的部分，因为程序员需要确保他的程序准备好处理预期和意外的错误。C 不对错误处理提供直接支持，但允许访问某些底层函数。如果发生错误，大多数函数将返回\
    \ `-1` 或 `NULL` 并设置 `errno` 错误代码，`errno` 是存储最后一个返回错误代码的全局变量。\n\n你需要包含 `<errno.h>`\
    \ 头文件来使用这些错误处理函数。\n\n```c\n#include <errno.h>\n```\n\n有几个函数允许你理解错误代码。\n\n`perror()`\n\
    函数显示你传递的字符串，并在末尾附加 `errno` 中存储的错误代码的文本表示。\n\n`strerror()`\n返回指向 `errno` 值文本表示的指针。这可以保存错误反馈。\n\
    \n`stderr` 文件流\n`stderr` 用于将错误输出到控制台。\n\n用法如下：\n\n```c\n#include <stdio.h>\n#include\
    \ <errno.h>\n\nextern int errno;\n\nint main() {\n    FILE * file;\n    int errnum;\n\
    \    // 查找文件\n    file = fopen(\"youWillNotFindMe.txt\", \"rb\");\n    // 如果文件返回错误\n\
    \    if (file == NULL)\n    {\n        // 获取错误代码\n        errnum = errno;\n  \
    \      // 打印错误代码\n        fprintf(stderr, \"Value of errno: %d\\n\", errno);\n\
    \        // 返回提供的字符串 + : 和错误代码消息\n        perror(\"Error printed by perror\");\n\
    \        // 获取错误文本\n        char* errorMsg[] = { strerror() };\n        printf(\"\
    Error msg test print: %s\", *errorMsg);\n    }\n    else\n    {\n        fclose(file);\n\
    \    }\n    return 0;\n}\n```\n\n上面是一些错误处理示例的用法。回顾并理解错误处理非常重要。\n\n下面是防止经典的除零错误的另一个示例：\n\
    \n```c\n#include <stdio.h>\n#include <errno.h>\n\nextern int errno;\n\nint divide(int\
    \ x, int y)\n{\n    if (y == 0)\n    {\n        // 打印错误\n        fprintf(stderr,\
    \ \"Diving by zero error..!\");\n        // 返回错误代码\n        return -1;\n    }\n\
    \    else\n    {\n        // 如果有效则返回结果\n        return x / y;\n    }\n}\n\nint\
    \ main()\n{\n    int returnCode = divide(0, 2);\n}\n```\n\n## 类型转换\n\n变量有定义的类型，但在某些情况下，你需要将一种类型转换为另一种类型。非常常见的是整数到浮点数或双浮点数的转换\n\
    \n一般格式如下：\n\n`(type)varToCast`\n\n可以这样使用：\n\n```c\nint main()\n{\n    int integer\
    \ = 3;\n    float decimal = 1.5f;\n    int result = (int)decimal + integer;\n\
    \    printf(\"%d\", result);\n}\n```\n\n输出\n\n```c\nint main()\n{\n    int integer\
    \ = 3;\n    float decimal = 1.5f;\n    int result = (int)decimal + integer;\n\
    \    printf(\"%d\", result);\n}\n```\n\n这种值被截断，你也可以升级一个值，类型转换的用法如下：\n\n```c\n\
    int main()\n{\n    int integer = 3;\n    float decimal = 1.5f;\n    int result\
    \ = (int)decimal + integer;\n    printf(\"%d\", result);\n}\n```\n\n这可以用于将一种类型转换为另一种类型转换的用法如下：\n\
    \n```c\nint main()\n{\n    int integer = 3;\n    float decimal = 1.5f;\n    int\
    \ result = (int)decimal + integer;\n    printf(\"%d\", result);\n}\n```\n\n内存管理\n\
    \nC 允许程序员动态管理。这种功能由：\n\n`#include <stdlib.h>`\n\n`malloc(size)` - 分配内存但留未初始化。\n\
    `calloc(num, size)` - 分配内存并初始化为零。\n`realloc(address, size)` - 重新分配内存大小。\n`free(address)`\
    \ - 释放内存。\n\n下面是使用 malloc 或 calloc 为字符串分配内存的示例：\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\n#define WORD_SIZE 20\n\nint main()\n{\n    char* word;\n\
    \    // 分配内存\n    word = malloc(WORD_SIZE * sizeof(char));\n    // 或者\n    word\
    \ = calloc(WORD_SIZE, sizeof(char));\n    // 复制值\n    strcpy(word, \"Hello nice\
    \ to meet you!\");\n    // 打印\n    printf(\"The string is:%s\\n\", word);\n  \
    \  // 删除内存\n    free(word);\n}\n```\n\n可以用于执行复杂的操作，比如获取用户输入并存储在数组中：\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n\n#define WORD_SIZE 20\n\nchar* getInput()\n\
    {\n    // 将被删除\n    char temp[50];\n    // 用户输入\n    printf(\"Please enter your\
    \ first name: \");\n    scanf(\"%s\", temp);\n    puts(\"\");\n\n    // strlen()\
    \ 找到字符串长度\n    int len = strlen(temp);\n\n    // 动态分配内存\n    char* perfectSizeWord;\n\
    \    // 分配内存！\n    perfectSizeWord = calloc(len, sizeof(char));\n\n    // 此命令不起，它获取\
    \ temp 的内存位置并直接复制它，所以\n    // 此函数超出作用域，perfectSizeWord 也是\n    ///perfectSizeWord\
    \ = temp\n\n    // 正确地复制值\n    for (int i = 0; i < len; i++)\n    {\n        perfectSizeWord[i]\
    \ = temp[i];\n    }\n\n    // 尺寸比较\n    printf(\"Size of temp var:%d\\n\", sizeof(temp));\n\
    \    printf(\"Size of new perfect var:%d\\n\", sizeof(perfectSizeWord));\n\n \
    \   return perfectSizeWord;\n}\n\nint main()\n{\n    // 获取返回变量\n    char* word\
    \ = getInput();\n    // 打印\n    printf(\"The word is:%s\\n\", word);\n    // 删除内存\n\
    \    free(word);\n}\n```\n\n## 练习\n\n使用上面的错误处理技术来处理 malloc 或 calloc 分配内存时的错误。要模拟错误，只需在动态内存分配后让\
    \ `word = NULL;`。\n\n使用下面的程序框架来帮助：\n\n```c\n#include <stdio.h>\n#include <errno.h>\n\
    \nint main()\n{\n    char* word;\n    // 分配内存\n    word = malloc(20 * sizeof(char));\n\
    \    // 错误模拟\n    word = NULL;\n}\n```\n"
