  trans: "\n```c\nenum Condition\n{\n  Working,\n  NotWorking,\n  Finished,\n  Unknown\n\
    };\n```\n\n这定义了一个名为 `Condition` 的枚举，其中每个可能的类型都被定义为可能的状态。你可以像这样创建并使用枚举：\n\n```c\n\
    #include <stdio.h>\n\nenum Condition\n{\n  Working,\n  NotWorking,\n  Finished,\n\
    \  Unknown\n};\n\nint main()\n{\n  // 创建\n  enum Condition programCondition;\n\
    \  // 赋值\n  programCondition = Working;\n\n  // 比较\n  if (programCondition ==\
    \ Working)\n  {\n    puts(\"All is good!\");\n  }\n}\n```\n\n这个程序展示了如何创建一个枚举、如何给它赋值以及如何比较它的值。\n\
    \n枚举最常用的用法类似于布尔值，但带有额外的上下文和特性。与布尔值的二元性质相比，它提高了可读性并增加了额外的状态。枚举非常适合跟踪具有有限定义值的数据，例如当前月份或星期几。\n\
    \n## 练习\n\n创建一个处理星期几的枚举，并打印出分配的任何一天（提示：switch-case 对于检查当前日期非常有用)。\n\n### 解决方案\n\
    \n如下所示：\n\n```c\n#include <stdio.h>\n\nenum WeekDay\n{\n  Monday,\n  Tuesday,\n\
    \  Wednesday,\n  Thursday,\n  Friday\n};\n\nenum Condition currentDay;\n\nint\
    \ main()\n{\n  currentDay = Friday;\n  switch (currentDay)\n  {\n    case Monday:\n\
    \      puts(\"It's Monday!\");\n    case Tuesday:\n      puts(\"It's Tuesday!\"\
    );\n      break;\n    case Wednesday:\n      puts(\"It's Wednesday!\");\n    \
    \  break;\n    case Thursday:\n      puts(\"It's Thursday!\");\n      break;\n\
    \    case Friday:\n      puts(\"It's Friday!\");\n      break;\n  }\n}\n```\n\n\
    ## 联合体 (Unions)\n\n联合体是一种特殊的数据类型，允许程序员在同一个内存位置存储不同的数据类型。你可以定义一个具有许多数据成员的联合体，但一次只有一个变量可以持有值。这是将同一内存位置用于不同用途的一种有效方法。\n\
    \n联合体的结构如下：\n\n```c\nunion Name\n{\n  // 变量\n  int i;\n  int y;\n  char word[20];\n\
    \  _Bool alive;\n};\n```\n\n并且可以创建多个副本，就像你可以创建结构体或枚举的版本一样。这样做如下：\n\n```c\nunion\
    \ Name t1;\n```\n\n联合体的大小与最大的变量一样大，而不是所有值的总和，这提供了一种与结构体相比的逐个存储变量的有效方法。比较两者，上面的联合体大小为\
    \ 20 字节，而具有完全相同变量的结构体将是 32 字节。如果在更大规模上使用，这将减少大量的空间。\n\n使用成员访问运算符 `.` 访问联合体中的变量，其使用方法如下：\n\
    \n```c\nunion Name example;\n\nexample.i = 10;\nprintf(\"i before assigned another\
    \ variable a value: %d\\n\", example.i);\nexample.y = 25;\nprintf(\"i after assigned\
    \ another variable a value: %d\\n\", example.i);\nprintf(\"y value for reference:\
    \ %d\\n\", example.y);\nstrcpy(example.word, \"Hello!\");\nprintf(\"i after assigned\
    \ a string a value: %d\\n\", example.i);\nprintf(\"y after assigned a string a\
    \ value: %d\\n\", example.y);\nprintf(\"String variable: %s\", example.word);\n\
    ```\n\n输出\n\n>i before assigned another variable a value: 10\n>i after assigned\
    \ another variable a value: 25\n>y value for reference: 25\n>i after assigned\
    \ a string a value: 1819043144\n>y after assigned a string a value: 1819043144\n\
    >String variable: Hello!\n\n正如你所见，改变一个值会影响所有其他变量，这是联合体如果没有正确使用的缺点，需要非常仔细地管理，以防止由于变量改变而导致错误。\n\
    \n## 可变参数列表 (Variable argument lists)\n\n你可能会遇到一个需要许多参数的问题，这就是可变参数用用场的地方，因为它允许传递动态数量的变量作为参数。\n\
    \n注意：\n\n这需要包含一个新的头文件：\n\n```c\n#include <stdarg.h>\n```\n\n在使用可变参数时添加此项。\n\n\
    你这样设计该方法：\n\n```c\nvoid function(int noOfVariables, ...)\n```\n\n...其中始终有一个变量定义变量的数量，后面是这些变量。额外的变量被分配给一个名为\
    \ `va_list` 的东西，这些列表通过这些函数进行操作：\n\n`va_start(va_list valist, int numberOfVaribles);`\n\
    \n`va_start` 实际上获取额外的变量并将它们放入 `va_list` 中。\n\n`va_arg(valist, type);`\n\n`va_arg`\
    \ 获取下一个变量并返回它，它不知道当前的整数是否是最后一个，因此程序设置需要确保它不会发生溢出。\n\n`va_end(valist);`\n\n`va_end`\
    \ 简单地清理 `va_list` 的内存。\n\n下面是一个找到最大值的示例：\n\n```c\n#include <stdio.h>\n#include\
    \ <stdarg.h>\n\nint max(int n, ...)\n{\n  int largest = 0;\n  // 创建分配\n  va_list\
    \ valist;\n  va_start(valist, n);\n  // 遍历列表\n  for (int i = 0; i < n; i++)\n\
    \  {\n    // 获取下一个 arg\n    int arg = va_arg(valist, int);\n    if (arg > largest)\
    \ largest = arg;\n  }\n  va_end(valist);\n  return largest;\n}\n```\n*(注：`max`\
    \ 函数的原始文本非常碎片/损坏。我根据提供的代码片段重构了逻辑，同时保留了核心结构。)*\n"
- fmt: "\nOnce again, the calculator example returns, a header could be a list of\
    \ functions like this that could then be included to allow the use of these functions.\n\
    \n## Pre-Processor Directives\n\nPre-processing are used to give the compiler\
    \ a type of command, you come across a command quite a few times already is the\
    \ ``#include` directive that tells the compiler to include a certain header file.\n\
    \nBelow is a list of the processor directives, we will go through how they all\
    \ work:\n\n| Directive | Description |\n| :--- | :--- |\n| `#define` | Used to\
    \ define a macro |\n| `#include` | Inserts a particular header from another file.\
    \ |\n| `#undef` | Removes the effect of `#define` |\n| `#ifdef` | Returns true\
    \ if this macro is defined. |\n| `#ifndef` | Returns true if this macro is not\
    \ defined. |\n| `#if` | Tests if a compile time condition is true. |\n| `#else`\
    \ | The alternative for `#if`. |\n| `#elif` | `#else` and `#if` in one statement.\
    \ |\n| `#endif` | Ends pre-processor conditional. |\n\n### #define and #undef\n\
    \nThese commands are used when global values are used to increase readability,\
    \ for example:\n\n`#define LOOP_NUMBER 2;`\n\nCould be defined and used like so:\n\
    \n```c\nfor (int i = 0; i < LOOP_NUMBER; i++)\n{\n    //Loop code\n}\n```\n\n\
    And the for loop will loop twice, but you cannot change the value like you would\
    \ with a normal variable, it’s constant through the life of the program unless\
    \ `#undef` is used that will undefine the value set.\n\n`#undef` is normally used\
    \ to overwrite build in directives where you would undefine a value and then set\
    \ a value of your choosing.\n\n### #ifdef and #if\n\n`#ifdef` and `#ifndef` will\
    \ return true and false respectively if a macro is defined, this most common use\
    \ for this is checking if the `-DDEBUG` flag has been set and running code in\
    \ DEBUG mode that has no use in the finished program. It’s used like this:\n\n\
    ```c\n#include <stdio.h>\n\nint main()\n{\n#ifdef DEBUG\n    puts(\"DEBUG!\");\n\
    #endif\n}\n```\n\nThis code will only run if the code is flagged as debug mode.\
    \ This can be very useful for a programmer.\n\n`#if`, `#else` and `#elif` work\
    \ exactly the same as if statements but are used to check the macro with arithmetic\
    \ expressions rather than checking for its existence.\n\n## Error Handling\n\n\
    Error handling is a very important section, because a programmer needs to make\
    \ sure his program is prepared to deal with expected and unexpected errors. C\
    \ does not provide direct support for error handling but allows access to some\
    \ low level functions. Most functions will return `-1` or `NULL` if there is an\
    \ error and set the `errno` error code, `errno` is a global variable that holds\
    \ the last returned error code.\n\nYou will need to include the `<errno.h>` header\
    \ file to use these error handling functions.\n\n```c\n#include <errno.h>\n```\n\
    \nThere are a few functions that allow you to use an understand error codes.\n\
    \n`perror()`\nFunction displays the string you pass and attaches to the end the\
    \ textual representation of the error code stored in `errno`.\n\n`strerror()`\n\
    Returns the pointer to the textual representation of the `errno` value. This can\
    \ be used to save the error feedback.\n\n`stderr` file stream\n`stderr` is used\
    \ to output an error to the console.\n\nUsage is below:\n\n```c\n#include <stdio.h>\n\
    #include <errno.h>\n\nextern int errno;\n\nint main() {\n    FILE * file;\n  \
    \  int errnum;\n    //Looks for file\n    file = fopen(\"youWillNotFindMe.txt\"\
    , \"rb\");\n    //If the file returned an error\n    if (file == NULL)\n    {\n\
    \        //Grabs error code\n        errnum = errno;\n        //Prints error code\n\
    \        fprintf(stderr, \"Value of errno: %d\\n\", errno);\n        //Returns\
    \ string provided + : and Error code message\n        perror(\"Error printed by\
    \ perror\");\n        //Grabs the error text\n        char* errorMsg[] = { strerror()\
    \ };\n        printf(\"Error msg test print: %s\", *errorMsg);\n    }\n    else\n\
    \    {\n        fclose(file);\n    }\n    return 0;\n}\n```\n\nAbove is usage\
    \ of some of the error handling examples. Go over and understand it error handling\
    \ is very important.\n\nBelow is another example of preventing the classic divide\
    \ by zero error:\n\n```c\n#include <stdio.h>\n#include <errno.h>\n\nextern int\
    \ errno;\n\nint divide(int x, int y)\n{\n    if (y == 0)\n    {\n        //Prints\
    \ error\n        fprintf(stderr, \"Diving by zero error..!\");\n        //Returns\
    \ error code\n        return -1;\n    }\n    else\n    {\n        //If valid returns\
    \ even\n        return x / y;\n    }\n}\n\nint main()\n{\n    int returnCode =\
    \ divide(0, 2);\n}\n```\n\n## Type casting\n\nVariables has defined types, but\
    \ there are situations where you’ll need to convert from one type to another.\
    \ Very commonly would be the conversion between integer to a float or double\n\
    \nThe general format is like so:\n\n`(type)varToCast`\n\nThis can be used like\
    \ so:\n\n```c\nint main()\n{\n    int integer = 3;\n    float decimal = 1.5f;\n\
    \    int result = (int)decimal + integer;\n    printf(\"%d\\n\", result);\n}\n\
    ```\n\nOutput\n`> 4`\n\nWhat happens is any decimal values are truncated (removed)\
    \ and the remainder is added to the integer value.\n\nYou can also upgrade a value,\
    \ this example shows when a integer is upgraded to a float:\n\n```c\nint main()\n\
    {\n    int integer = 3;\n    float decimal = 1.5;\n    //Explicit casting\n  \
    \  float result = decimal + (float)integer;\n}\n```\n\n## Memory management\n\n\
    C allows programmers to dynamically manage. This functionality is provided by:\n\
    \n`#include <stdlib.h>`\n\n`malloc(size)` - Allocates memory but leaves it uninitialized.\n\
    `calloc(num, size)` - Allocates memory and initializes it to zero.\n`realloc(address,\
    \ newsize)` - re-allocates memory to a new size.\n`free(address)` - releases memory.\n\
    \nBelow is an example of using malloc or calloc to allocate memory for string:\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\n#define WORD_SIZE 20\n\nint\
    \ main()\n{\n    char* word;\n    //Allocates memory\n    word = malloc(WORD_SIZE\
    \ * sizeof(char));\n    //or\n    word = calloc(WORD_SIZE, sizeof(char));\n  \
    \  //Copies values over\n    strcpy(word, \"Hello nice to meet you!\");\n    //Printing\n\
    \    printf(\"The string is:%s\\n\", word);\n    //Deletes memory\n    free(word);\n\
    }\n```\n\nThis can be used to do quite complex things, like take in user input\
    \ and store it in an array:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \n#define WORD_SIZE 20\n\nchar* getInput()\n{\n    //Will be deleted\n    char\
