    ```


    ### 静态变量


    `static` 用于当你希望变量在离开作用域时不被销毁时，该变量将一直持续到程序结束。静态变量在整个程序的生命周期内只创建一次。


    ```c

    void tick()

    {

    static int count = 0;

    count++;

    printf("The count is now: %d\n", count);

    }


    int main()

    {

    tick();

    tick();

    }

    ```


    输出


    >The count is now: 1

    >The count is now: 2

    >The count is now: 3


