- fmt: "\n```c\nenum Condition\n{\n  Working,\n  NotWorking,\n  Finished,\n  Unknown\n\
    };\n```\n\nThis defines an enum called `Condition` where each of the possible\
    \ types are defined as possible states. You create and use an enum like this:\n\
    \n```c\n#include <stdio.h>\n\nenum Condition\n{\n  Working,\n  NotWorking,\n \
    \ Finished,\n  Unknown\n};\n\nint main()\n{\n  //Created\n  enum Condition programCondition;\n\
    \  //Assigned a value\n  programCondition = Working;\n\n  //Comparison\n  if (programCondition\
    \ == Working)\n  {\n    puts(\"All is good!\");\n  }\n}\n```\n\nIn this program\
    \ is shows how you can create an enum, how you can assign it a value and how you\
    \ can compare it’s value.\n\nEnums are most commonly used like boolean with extra\
    \ context and features. It improves readability and adds extra states opposed\
    \ to the binary nature of booleans values. Enums are very good at keeping track\
    \ of data with limited well-defined values, like the current month or the day\
    \ of the week.\n\n## Exercise\n\nCreate an enum that deals with the days of the\
    \ week and prints out whatever day has been assigned (Hint: A switch-case is very\
    \ useful for checking current day)\n\n### Solution\n\nSomething like this:\n\n\
    ```c\n#include <stdio.h>\n\nenum WeekDay\n{\n  Monday,\n  Tuesday,\n  Wednesday,\n\
    \  Thursday,\n  Friday\n};\n\nenum Condition currentDay;\n\nint main()\n{\n  currentDay\
    \ = Friday;\n  switch (currentDay)\n  {\n    case Monday:\n      puts(\"It's Monday!\"\
    );\n    case Tuesday:\n      puts(\"It's Tuesday!\");\n      break;\n    case\
    \ Wednesday:\n      puts(\"It's Wednesday!\");\n      break;\n    case Thursday:\n\
    \      puts(\"It's Thursday!\");\n      break;\n    case Friday:\n      puts(\"\
    It's Friday!\");\n      break;\n  }\n}\n```\n\n## Unions\n\nUnions are a special\
    \ data type that allow the programmer to store different data types in the same\
    \ memory location. You can define a unions with many data members, but only one\
    \ variable can hold a value at one time. These are an efficient way of using the\
    \ same memory location for different uses.\n\nThe structure of a union is like\
    \ so:\n\n```c\nunion Name\n{\n  //Variables\n  int i;\n  int y;\n  char word[20];\n\
    \  _Bool alive;\n};\n```\n\nAnd multiple copies can be created much like how you\
    \ can make versions of a structure or an enum. This is done like this:\n\n```c\n\
    union Name t1;\n```\n\nThis size of the unions is as large as the largest variable,\
    \ not as big as all the values together giving an efficient way to store variables\
    \ one at a time opposed to a structure. Comparing the two the union above is 20\
    \ bytes in size, a structure with exactly the same variables would be 32 bytes.\
    \ This would amount to a big space reduction if used on a much larger scale.\n\
    \nThe variables in a union are accessed using the member access operator `.` and\
    \ used like this:\n\n```c\nunion Name example;\n\nexample.i = 10;\nprintf(\"i\
    \ before assigned another variable a value: %d\\n\", example.i);\nexample.y =\
    \ 25;\nprintf(\"i after assigned another variable a value: %d\\n\", example.i);\n\
    printf(\"y value for reference: %d\\n\", example.y);\nstrcpy(example.word, \"\
    Hello!\");\nprintf(\"i after assigned a string a value: %d\\n\", example.i);\n\
    printf(\"y after assigned a string a value: %d\\n\", example.y);\nprintf(\"String\
    \ variable: %s\", example.word);\n```\n\nOutput\n\n>i before assigned another\
