    \ Person p1;\n```\n\n这就像定义一个新变量，下面的示例显示两个新创建的人包含相互独立的值。\n\n*(注：由于提供的原始文本存在大量重复和乱码，上述内容已根据核心逻辑进行了整理和翻译)*\n\
