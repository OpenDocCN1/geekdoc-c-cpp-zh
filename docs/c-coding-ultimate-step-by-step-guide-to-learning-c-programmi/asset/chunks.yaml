    This defines an enum called Condition where each of the possible types are defined
    as possible states. You create and use an enum like this:


    #include  <stdio.h>


    enum  Condition


    {


    Working,


    NotWorking,


    Finished,


    Unknown


    };


    int main()


    {


    //Created


    enum  Condition programCondition;


    //Assigned a value


    programCondition = Working;


    //Comparison


    if (programCondition == Working)


    {


    puts("All is good!");


    }


    }


    In this program is shows how you can create an enum, how you can assign it a value
    and how you can compare it’s value.


    Enums are most commonly used like boolean with extra context and features. It
    improves readability and adds extra states opposed to the binary nature of booleans
    values. Enums are very good at keeping track of data with limited well-defined
    values, like the current month or the day of the week.


    ## Exercise


    Create an enum that deals with the days of the week and prints out whatever day
    has been assigned (Hint: A switch-case is very useful for checking current day)


    Solution


    Something like this:


    #include  <stdio.h>


    enum  WeekDay


    {


    Monday,


    Tuesday,


    Wednesday,


    Thursday,


    Friday


    };


    enum  Condition currentDay;


    int main()


    {


    currentDay = Friday;


    switch (currentDay)


    {


    case  Monday:


    puts("It''s Monday!");


    case  Tuesday:


    puts("It''s Tuesday!");


    break;


    case  Wednesday:


    puts("It''s Wednesday!");


    break;


    case  Thursday:


    puts("It''s Thursday!");


    break;


    case  Friday:


    puts("It''s Friday!");


    break;


    }


    }


    ## Unions


    Unions are a special data type that allow the programmer to store different data
    types in the same memory location. You can define a unions with many data members,
    but only one variable can hold a value at one time. These are an efficient way
    of using the same memory location for different uses.


    The structure of a union is like so:


    union  Name


    {


    //Variables


    int i;


    int y;


    char word[20];


    _Bool alive;


    };


    And multiple copies can be created much like how you can make versions of a structure
    or an enum. This is done like this:


    union  Name t1;


    This size of the unions is as large as the largest variable, not as big as all
    the values together giving an efficient way to store variables one at a time opposed
    to a structure. Comparing the two the union above is 20 bytes in size, a structure
    with exactly the same variables would be 32 bytes. This would amount to a big
    space reduction if used on a much larger scale.


    The variables in a union are accessed using the member access operator (.) and
    used like this:


    union  Name example;


    example.i = 10;


    printf("i before assigned another variable a value: %d\n", example.i);


    example.y = 25;


    printf("i after assigned another variable a value: %d\n", example.i);


    printf("y value for reference: %d\n", example.y);


    strcpy(example.word, "Hello!");


    printf("i after assigned a string a value: %d\n", example.i);


    printf("y after assigned a string a value: %d\n", example.y);


    printf("String variable: %s", example.word);


    Output


    >i before assigned another variable a value: 10


    >i after assigned another variable a value: 25


    >y value for reference: 25


    >i after assigned a string a value: 1819043144


    >y after assigned a string a value: 1819043144


    >String variable: Hello!


    As you can see changing one value effects every other variable, this is the downfall
    of unions if not used correctly and need to managed very carefully so errors do
    not occur due to changing variables.


    ## Variable argument lists


    You might stumble upon a problem that might require a function with many parameters,
    this is where variable arguments comes it because it allows a dynamic amount of
    variables passed as a parameters.


    Note:


    A new included is required for this:


    #include  <stdarg.h>


    Add this when using variable arguments.


    You design the method like so:


    void function(int  noOfVariables, ...)


    ..


    ..


    Where there is always one variable defining the number of variables followed by
    the variables. The extra variables are assigned to something called a va_list,
    these lists are manipulated with these functions:


    va_start(va_list valist, int numberOfVaribles);


    va_start effectively takes the extra variables and places them in the va_list


    va_arg(valist, type);


    va_arg takes the next variable and returns it, it doesn’t know if the current
    integer is the last so the program setup needs to set up to make sure it doesn’t
    overflow.


    va_end(valist);


    va_end simply cleans up the memory for the va_list.


    Below is an example that finds the largest value:


    #include  <stdio.h>


    #include  <stdarg.h>


    int max(int  n, ...)


    {


    int largest = 0;


    //Creates an assigns


    va_list valist;


    va_start(valist, n);


    //loops through variable list


    for (int i = 0; i < n; i++)


    {


    //Grabs the next arg


    int nextVar = va_arg(valist, int);


    //Compares size of values || The first value is assigned to be the largest value


    if (nextVar > largest || i == 0)


    {


    largest = nextVar;


    }


    }


    //Frees up memory


    va_end(valist);


    return largest;


    }


    int main() {


    printf("Largest: %d\n", max(6, -2,3,4,5,66,10));


    printf("Largest: %d\n", max(3, 7, 2, 1));


    }


    Output


    > Largest: 66


    > Largest: 7


    This program shows how the dynamic nature of the variable list can be very useful.


    ## Exercise


    Create a program using variable lists that returns the averages (product of all
    numbers/how many numbers) of int variables provided.


    Create a method called ‘average’ that returns a float, this will be your variable
    function. And don’t forget to include:


    #include  <stdarg.h>


    Solution


    Something like this:


    #include  <stdio.h>


    #include  <stdarg.h>


    double average(int  n, ...)


    {


    double total = 0.0;


    //Creates variable list


    va_list vaList;


    va_start(vaList, n);


    //Grabs each variable


    for (int i = 0; i < n; i++)


    {


    //Same as: "total = total + va_arg(vaList, int);"


    total += va_arg(vaList, int);


    }


    //Clean up!


    va_end(vaList);


    double avg = total / n;


    return avg;


    }


    int main()


    {


    //%f for a float


    printf("Average: %f\n", average(4, 1,2,77,4534));


    }


    This is very similar to the max value example above, it has the va_start, va_arg
    and va_end.


