    ### 3. 对系统资源的控制


    C/C++ 的特征之一是它们几乎可以与系统资源（如内存、CPU 和硬件外设）交互。这种控制能力允许开发者针对特定的硬件配置优化其应用、调整性能，并访问高级语言中可能无法提供的低级功能。无论你是在构建一个面向平台的视频编辑工具，还是实时数据处理应用，C/C++
