    is full of such theoretical limitations, although by Rice''s theorem all interesting
    questions about program properties are undecidable (so compilers and many other
    tools that deal with programs in any form run into such limits). In practice a
    combination of interactive and automatic analysis and perseverance can handle
    all programs designed to thwart reverse engineering, using encryption and decrypting
    code just prior to use, and moving code around memory.


    # ##2.3.2 Lost Information


    All text-based identifiers, such as variable names, label names, and macros are
    removed by the assembly process. They may still be present in generated object
    files, for use by debuggers and relocating linkers, but the direct connection
    is lost and re-establishing that connection requires more than a mere dis. These
    identifiers, in addition to comments in the source file, help to make the code
    more readable to a human, and can also shed clues on the purpose of the code.
    Without these comments and identifiers, it is harder to understand the purpose
    of the source code, and it can be difficult to determine the algorithm being used
    by that code. When you combine this problem with the possibility that the code
    you are trying to read may, in reality, be data (as outlined above), then it can
    be ever harder to determine what is going on.


    # ##2.4 Deilers


    Akin to Disassembly, Decompilers take the process further and actually try to
    reproduce the code in a high level language. Frequently, this high level language
    is C, because C is simple and primitive enough to facilitate the decompilation
    process. Decomposition has its drawbacks, lots of data and readability constructs
    are lost during the original compilation process, and cannot be reproduced. Since
    the science of decompilation is still young, and results are ''good'' but not
    ''great'', this page will limit itself to a listing of decompilers, and a general
    (but brief) discussion of the possibilities of decompilation.


    # ##2.4.1 Decompiler: Is It Possible?


    w:decompiler In the face of optimizing compilers, it is not uncommon to be asked
    ''Is decompression even possible?'' To some degree, it is usually. Make no mistake,
    however: an optimizing compiler results in the retrievable loss of information.
    An example is in-lining, a subroutine call is removed and the actual code is in
    its place. A further optimization will combine that code with its surroundings,
    places where the original subroutine is called are not even similar. An optimizer
    that reverses that process is comparable to an artificial intelligence program
    that recreates a poem in a different language. So perfectly operational decompilers
    are a long way off. At most, current Decompilers can be used simply an aid for
    the reverse engineering process leaving lots of arduous work.


