    # # 13 Branches


    # ## 13.1 Branching


    Computer science professors tell their students to avoid jumps and **goto** instructions,
    to avoid the proverbial ''spaghetti code.'' Unfortunately, assembly only has jump
    instructions to control program flow. This chapter will explore the subject that
    many people avoid the plague, and will attempt to show how the spaghetti of assembly
    can be translated into the more familiar control structures of high-level language.
    Specifically, this chapter will focus on **If-Then-Else** and **Switch** branching
    instructions.


    # ## 13.2 If-Then


    Let''s consider a generic **if** statement in pseudo-code followed by its equivalent
    form using jumps:'
  - "[PAGE 99]\n\n# Branches\n\n![](img/9b6491f497eec80c9bc0146581237790_99_0.png)\n\
    \nif (condition) then do_action; if not\n(condition) then goto end; do_action;\n\
    end:\n\nFigure 10\n\nWhat does this code do? In English, the code checks the condition\
    \ and performs a jump\nonly if it is false. With that in mind, let's compare some\
    \ actual C code and its Assembly\ntranslation:\n\n```\nif(\n  mov eax, $x\n{\n\
    \  cmp eax, 0\n  jne end\n  mov eax, 1\n}\nend:\nx++\n  inc eax\n  mov $x, eax\n\
    ```\n\nNote that when we translate to assembly, we need negate the condition of\
    \ the jump\nbecause--like we said above--we only jump if the condition is false.\
    \ To recreate the high-level\ncode, simply negate the condition once again."
  - "[PAGE 100]\n\nNegating a comparison may be tricky if you're not paying attention.\
    \ Here are the correct\ndual forms:\n\n| Instruction | Meaning |\n|---|-|\n| JNE\
    \ | Jump if not equal |\n| JE | Jump if equal |\n| JG | Jump if greater |\n| JLE\
    \ | Jump if less than or equal |\n| JL | Jump if less |\n| JGE | Jump if greater\
    \ or equal |\n\nAnd here are some examples.\n\n```\nmov eax, $x         //move\
    \ into eax\ncmp eax, $y          //compare eax with y\njg end             //jump\
    \ if greater than\ninc eax\nmove $x, eax        //increment x\nend:\n```\n\nIs\
    \ produced by these statements:\n\n```\nif (x < y) {\n    x++;\n}\n```\n\nAs you\
    \ can see, x is incremented only if it is **less than or equal to** y. Thus, if\
    \ it is greater\ny than, it will not be incremented in the assembler code. Similarly,\
    \ the C code\n\n```\nif (x < y) {\n    x++;\n}\n```\n\nproduces this assembler\
    \ code:\n\n```\nmov eax, $x         //move into eax\ncmp eax, $y          //compare\
    \ eax with y\njge end             //jump if greater than or equal\nto\ninc eax\n\
