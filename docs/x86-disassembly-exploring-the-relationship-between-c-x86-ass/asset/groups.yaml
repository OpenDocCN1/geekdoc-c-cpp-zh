    # Microsoft Windows


    2000 (NT 5.0), Windows XP (NT 5.1), Windows Server 2003 (NT 5.2), Windows Vista
    (NT 6.0) 以及 Windows 7 (NT 6.1)。


    Microsoft XBOX 和 XBOX 360 也运行一种 NT 的变体，该变体是从 Windows 2000 分叉出来的。大多数微软操作系统产品以某种形式基于
    NT。


    # 4.3 虚拟内存


    32 位 WinNT 允许最大 4Gb 的虚拟内存空间，被划分为默认为 4096 字节的“页”（pages）。系统或任何应用程序未使用的页可以写入硬盘上一个称为“分页文件”（paging
    file）的特殊区域。使用分页文件可能会提高某些系统的性能，尽管机械硬盘（HDD）的 I/O 高延迟实际上在某些情况下会降低性能。


    # 4.4 系统架构


    Windows 架构是高度分层的。程序员发出的函数调用在实际执行任何操作之前，可能会被重定向 3 次或更多。从用户态应用程序调用 Win32 函数会有不可忽视的代价。然而，其优势同样不可忽视：在
    Windows 系统更高层级编写的代码更容易编写。涉及初始化多个数据结构和调用多个子函数的复杂操作可以通过调用单个高层函数来完成。


    Win32 API 调用 3 个模块：KERNEL、USER 和 GDI。KERNEL 函数层叠在 NTDLL 之上，大多数对 KERNEL 的调用只是简单地重定向到
    NTDLL 调用。USER 和 GDI 均基于 Win32K（一个内核态模块，负责 Windows 的“外观和感受”），尽管 USER 也会调用 GDI 中更原始的函数。这者以及
    NTDLL 都提供了指向 Windows NT 内核 NTOSRNL（见下后文）的接口。


    NTOSRNL 也部分层叠在 HAL（硬件抽象层）之上，但本文将不再考虑这种交互。这种分层设计的目的是为了让处理器的变体问题（如资源的位置）与内核本身分离离开。因此，略有不同的系统配置只需要不同的
    HAL 模块，而不是一个完全不同的内核。


    # 4.5 系统调用和中断


    在过滤了不同层的子程序后，大多数 API 调用都需要与操作系统的部分进行交互。服务通过“软件中断”提供，传统上通过 `int 0x2e` 指令实现。这会将执行控制切换到
    NT 执行内核/内核，在该处处理请求。需要指出，内核态下使用的栈与用户态栈不同。这在内核和用户之间提供了一层额外的保护。一旦函数完成，控制权将返回给用户应用程序。


    Intel 和 AMD 都提供了一组额外的指令以允许快速系统调用，Intel 的 `SYSENTER` 指令和 AMD 的 `SYSCALL` 指令。


    # 4.6 Win32 API


    WinNT 和 Win9x 系统都利用 Win32 API。然而，WinNT 版本的 API 有更多功能和安全结构，以及对 Unicode 支持。大多数 Win32
    API 可以分解为 3 个独立的组件，每个组件执行一个单独的任务。


    # 4.6.1 kernel32.dll


    Kernel32.dll 是 KERNEL 子系统的所在地，是实现非图形化函数的地方。堆堆 API、虚拟内存 API、文件 I/O API、线程 API、系统对象管理器以及其他系统服务。kernel32.dll
    的大部分功能在 ntdll.dll 中实现，但属于未文档的函数。微软倾向于发布 kernel32 的文档并保证这些 API 将保持不变，而其他库中的大部分工作则不进行记录。


    # 4.6.2 gdi32.dll


    gdi32.dll 是实现 GDI 系统的库，在此处执行原始图形操作。GDI 将大部分调用重定向到 WIN32K，但它确实包含一个 GDI 对象的管理器，例如笔、画刷和设备上下文。GDI
    对象管理器和 KERNEL 对象管理器是完全分离的。


    # 4.6.3 user32.dll


    USER 子系统位于 user32.dll 库文件中。该子系统控制 USER 对象的创建和操作，这些是常见的屏幕项目，如窗口、菜单、光标等……USER 设置要绘制的对象，但将通过调用
    GDI（GDI 反而会调用 WIN32K）或有时直接调用 WIN32K 执行实际绘制。USER 利用 GDI 对象管理器。


    # 4.7 原生 API


    原生 API（此处称为 NTDLL 子系统）是一系列未文档的 API 函数调用，处理 KERNEL 执行的大部分工作。微软也不保证在不同版本之间原生 API
    会保持不变，微软开发者会修改软件。这带来了原生 API 调用可能在没有警告的情况下被删除或更改的风险，从而破坏利用它的软件。


    # 4.7.1 ntdll.dll


    NTDLL 子系统位于 ntdll.dll。该库包含许多 API 函数调用，所有调用都遵循特定的命名方案。每个函数都有一个前缀：Ldr, Nt, Zw, Csr
    等，所有具有特定前缀的函数都遵循所有特定的规则。


    “官方”的原生 API 通常限于前缀为 Nt 或 Zw 的函数。


    - Ldr：代表 Load Library（加载库）

    - Nt：代表 Native（原生）

    - Zw：代表 Windows

    - Csr：代表 Client Server Runtime（客户端服务器运行时）

    - Dbg：代表 Debug（调试）

    - Rtl：代表 Runtime（运行时）

    - Memory Management：代表内存管理

    - Thread：代表线程管理

    - Object：代表对象管理

    - System：代表系统管理

    - DLL：代表 DLL

    - Kernel：代表内核

    - User：代表用户

    - GDI：代表 Graphics Interface（图形设备接口）

    - HAL：代表 Hardware Abstraction Layer（硬件抽象层）

    - NTOSRNL：代表 NT System Loader（NT 系统加载器）


    # 4.7.2 用户态与内核态


    许多原生 API 函数在内核态导出。需要注意的是，在 Win32 和 Win64 之间，许多调用的格式是相同的，除了指针的大小以及特定的 64 位地址空间的其他数据类型。


    # 4.8 ntoskrnl.exe


    该模块是 Windows “执行内核”，它位于更底层的 NTOSRNL 之上。它负责维护操作系统的状态。


    # 4.9 Win32K.sys


    该模块是位于执行内核之上的“Win32内核”。WIN32K 负责窗口的“外观和感受”。此代码部分自 Win9x 版本以来一直保持基本不变。该模块负责将 USER
    和 GDI 的 API 调用转换为显示器上看到的图像。


    # 4.10 Win64 API


    随着 64 位处理器的出现，64 位软件成为必须。因此，创建了 Win64 API 以利用新硬件。需要注意的是，在 Win32 和 Win64 之间，许多函数的格式是相同的，除了指针的大小和其他数据类型。


    # 4.10.1 差异


    微软发布了新的 Windows 操作系统，命名为“Windows Vista”。Vista 可能以开发代号“Longhorn”更为人。微软声称 Vista
    是头开始编写的，因此可以假设 Vista 的 API 和系统架构与之前的 Windows 版本存在本质差异。Windows Vista 于 2007 年 1
    月 30 日发布。


    # 4.12 Windows CE/Mobile 等版本


    Windows CE 是微软小型设备的产品。它与桌面系统使用相同的 Win32 API，尽管架构略有不同。


    # 4.13 “不可执行内存”


    最近的 Windows 服务补丁尝试实现一种被称为“不可执行内存”的系统，某些页面可以被标记为“不可执行”。该系统的目的是通过不允许控制流通过攻击者在内存缓冲区中插入的代码来防止一些常见的安全漏洞。


    '
