    \ A2 E0 D6 62 63 E0\n000000C0 00 00 00 00 00 50 45 4C 01 03 00\n```\n\nPE 头部仅包含一个签名，其值为\
    \ 'PE'，该签名表示：a) 这是一个合法的 PE 文件，且 b) 本章将不考虑字节序，并假设所有 PE 文件均为“小端序”（little endian）格式。\n\
    \nPE 头部定义了可执行文件中节（section）的数量。每个节的定义长度为 40 字节。以下是程序的一个十六进制片段：\n\n```\n00000000\
    \ 74 65 78 74 00 00 00 00 00 00 00 0000\n00000010 64 61 74 61 00 00 00 00 00 00\
    \ 00 0000\n00000020 72 65 73 73 00 00 00 00 00 00 00 0000\n```\n\n节的结构定义如下：\n\n\
    | 偏移 | 长度 | 节名称 / 描述 |\n| :--- | :--- | :--- |\n| 0x00 | 8 字节 | 节名称 - 在上述示例中名称为\
    \ |\n| 0x08 | 4 字节 | 节加载到内存后的大小 |\n| 0x0C | 4 字节 | 节加载到的相对虚拟地址 (RVA) |\n| 0x10\
    \ | 4 字节 | 节在磁盘上的物理大小 |\n| 0x14 | 4 字节 | 节在磁盘上的物理位置（从磁盘开始） |\n| 0x18 | 12 字节 |\
    \ 预留（通常为 0），用于对象格式 |\n| 0x24 | 4 字节 | 节标志位 |\n\n常见的节有：\n\n- .text/code/TEXT -\
    \ 包含可执行代码（机器指令）\n- .bss/TEXTBSS - 如果启增量链接（Incremental Linking）则存在\n- .data/idata/DATA\
    \ - 包含已初始化的数据\n- .bss/BSS - 包含未初始化的数据\n\n## 5.5.3 COFF 头部\n\nCOFF 头部同时存在于 COFF\
    \ 对象文件（链接前）和 PE 文件中。COFF 头部包含对执行有用的信息，以及一些对对象文件更有用的信息。以下是以 C 结构体形式的 COFF 头部：\n\
    \n```c\nstruct COFFHeader {\n  short Machine;\n  short NumberOfSections;\n  long\
    \ Timestamp;\n  long PointerToSymbolTable;\n  long NumberOfSymbols;\n  short SizeOptionalHeader;\n\
    \  short Characteristics;\n};\n```\n\n## 5.5.4 PE 可选头部\n\n“PE 可选头部”（PE Optional\
    \ Header）本身并不是“可选”的，因为它在可执行文件中是必须的，而在 COFF 中不是。可选头部包含许多可以用于分析文件结构并获取其有用信息的内容。PE\
    \ 可选头部直接位于 COFF 头部之后，某些来源将这两个头部视为同一个结构的一部分。为了方便，这里将它们分开了。以下是以 C 数据结构形式的 PE 可选头部：\n\
    \n```c\nstruct PEOptionalHeader {\n\tshort signature; // 十进制数字 9054.\n\tchar MajorLinkVersion;\n\
    \tchar MinorLinkVersion;\n\tlong SizeOfCode;\n\tlong SizeOfInitializedData;\n\t\
    long SizeOfUninitializedData;\n\tlong AddressEntryPoint; // 代码入口点的 RVA\n\tlong\
    \ SizeOfBase;\n\tlong BaseBase;\n\tlong ImageBase;\n\tlong SectionAlignment;\n\
    \tshort FileAlignment;\n\tshort MajorOSVersion;\n\tshort MinorOSVersion;\n\tshort\
    \ MajorImageVersion;\n\tshort MinorImageVersion;\n\tshort MajorSubsystemVersion;\n\
    \tshort MinorSubsystemVersion;\n\tlong Reserved;\n\tlong SizeOfImage;\n\tlong\
    \ SizeOfHeaders;\n\tlong Checksum;\n\tshort Subsystem;\n\tshort DLLCharacteristics;\n\
    \tlong SizeOfStackReserve;\n\tlong SizeOfStackCommit;\n\tlong SizeOfHeapReserve;\n\
    \tlong SizeOfHeapCommit;\n\tlong LoaderFlags;\n\tlong NumberOfRvaAndSizes;\n\t\
    DataDirectory[16]; // 可以包含任意数量的元素，匹配 NumberOfRvaAndSizes。\n}\n\n// 然而，始终为 16\n\
    struct data_directory {\n  long VirtualAddress;\n  long Size;\n}\n```\n\n一些重要的信息字段：\n\
    \n- MajorLinkerVersion, MinorLinkerVersion: 创建 PE 文件的链接器版本，格式为 x.y。\n- AddressEntryPoint:\
    \ 可执行文件入口点的 RVA。这非常重要。\n- SizeOfCode: .text 节的大小。\n- SizeOfInitializedData: 已初始化数据的大小。\n\
    - BaseOfCode: .text 节的 RVA。\n- BaseOfData: .data 节的 RVA。\n- ImageBase: 模块加载到内存中的首选位置。\n\
    - Checksum: 校验和，用于验证文件的有效性，Microsoft 提供。\n- Subsystem: 子系统类型：\n  - 1 = native\n\
    \  - 2 = Windows\n  - 5 = OS\n  - 7 = POSIX\n- DataDirectory: 可能最有趣的成员，以下是 Data目录的内容：\n\
    \  - IMAGE_DIRECTORY (0): 导出\n  - IMAGE_DIRECTORY (1): 导入\n  - IMAGE_DIRECTORY\
    \ (2): 资源\n  - IMAGE_DIRECTORY (11): 绑定导入\n\n## 5.6.1 节标志\n\n节标志是一个 32 位字段（每个位代表一个特定含义）。以下是\
    \ NT.h 中定义的常量：\n\n```c\n#define IMAGE_SCN_TYPE_NO_PAD 0x00000008 // 预留\n#define\
    \ IMAGE_SCN_CNT_CODE 0x00000020 // 节\n#define IMAGE_SCN_CNT_INITIALIZED_DATA 0x00000040\
    \ // 已初始化数据\n#define IMAGE_SCN_CNT_UNINITIAL_DATA 0x00000080 // 未初始化数据\n#define\
    \ IMAGE_SCN_NNK_OTHER 0x00000100 // 预留\n#define IMAGE_SCN_DATA 0x00000200 // 节信息\n\
    #define IMAGE_SCN_NNK_REMOVE 0x00000800 // 节将成为镜像\n#define IMAGE_SCN_NNK_COAT\
    \ 0x00001000 // 节\n#define IMAGE_SCN_NO_SPEC 0x00004000 // 异常处理位\n#define IMAGE_SCN_GREL\
    \ 0x00008000 // 节内容可以访问\n#define IMAGE_SCN_MEM_FDATA 0x00020000\n#define IMAGE_SCN_MEM_PURGE\
    \ 0x00040000\n#define IMAGE_SCN_MEM_LOCKED 0x00080000\n#define IMAGE_SCN_MEM_PRELOAD\
    \ 0x00100000\n#define IMAGE_SCN_ALIGN_1_BYTES 0x00200000\n#define IMAGE_SCN_ALIGN_2_BYTES\
    \ 0x00400000\n#define IMAGE_SCN_ALIGN_4_BYTES 0x00800000\n#define IMAGE_SCN_ALIGN_8_BYTES\
    \ 0x01000000 // 如果未指定其他对齐值\n#define IMAGE_SCN_ALIGN_16_BYTES 0x02000000\n#define\
    \ IMAGE_SCN_ALIGN_64_BYTES 0x04000000\n#define IMAGE_SCN_ALIGN_128_BYTES 0x08000000\n\
    #define IMAGE_SCN_ALIGN_256_BYTES 0x10000000\n#define IMAGE_SCN_ALIGN_512_BYTES\
    \ 0x20000000\n#define IMAGE_SCN_ALIGN_1024_BYTES 0x40000000\n#define IMAGE_SCN_ALIGN_2048_BYTES\
    \ 0x80000000 // (注：此处原文可能可能有误，2048通常对应 0xC0000000)\n#define IMAGE_SCN_ALIGN_4096_BYTES\
    \ 0xD0000000\n#define IMAGE_SCN_ALIGN_MASK 0xE0000000\n#define IMAGE_SCN_NRE_RELOC\
    \ 0xF0000000 // 节结束重定位\n#define IMAGE_SCN_MEM_DISCARDABLE 0x20000000 // 节可以被丢弃\n\
    #define IMAGE_SCN_MEM_NOT_CACHE 0x40000000 // 节不可缓存\n#define IMAGE_SCN_MEM_NOT_PAGED\
    \ 0x80000000 // 节不可分页\n#define IMAGE_SCN_MEM_SHARED 0x10000000 // 节可共享\n#define\
    \ IMAGE_SCN_MEM_EXECUTE 0x20000000 // 节可执行\n#define IMAGE_SCN_MEM_READ 0x40000000\
    \ // 节可读\n#define IMAGE_SCN_MEM_WRITE 0x80000000 // 节可写\n```\n\n"
