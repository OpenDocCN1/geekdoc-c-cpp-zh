    dec eax\n:_Label_2\nmov ecx, [ebp + 12]\ncmp ecx, 0\nje _Label_3\ninc eax\n:_Label_3\n\
    ```\n\nLooking through, we see cmp statements. The first cmp statement compares\
    \ ecx to zero. If ecx is not zero, we go to _Label_1, decrement eax, and then\
    \ fall through to _Label_2. If ecx is zero, we increment eax, and go directly\
    \ to _Label_2. Writing out some pseudocode, we have the following result for the\
    \ first section:\n\n```\nif(ecx does equal 0) goto _label_1\neax++;\ngoto _label_2\n\
    :_label_1\neax--;\n:_label_2\n```\n\nSince, _Label_2 occurs at the end of this\
    \ structure, we can rename it to something more descriptive, like 'End_of_Branch_1',\
    \ or 'Branch_1_End'. The first comparison tests ecx against 0, and jumps on not-equal.\
    \ We can reverse the conditional, and say that _Label_1 is an else block:\n\n\
    ```\nif(ecx == 0); ecx is param1\n{\n    eax++;\n}\nelse\n{\n    eax--;\n}\n```\n\
    \nSo we can rename _Label_1 to something else descriptive, as 'Else_1'. The rest\
    \ of the code block, after Branch_1_End (_Label_2) is as follows:\n\n```\nmov\
    \ ecx, [ebp + 12]\ncmp ecx, 0\njne _Label_3\ninc eax\n:_Label_3\n```\n\nWe can\
    \ see immediately that _Label_3 is the end of the branch structure, so we can\
    \ immediately call it 'Branch_2_End', or something else. Here, we are again comparing\
    \ ecx to 0, and if it is not equal, we jump to the end of the block. If it is\
    \ equal to zero, however, we increment eax, and fall out the bottom of the branch.\
    \ We can see that there is no else block in this branch structure, so we don't\
    \ need to invert the condition. We can write an if statement directly:\n\n```\n\
    if(ecx == 0); ecx is param2 here\n{\n    eax++;\n}\n```\n\n## 14.3 Example: Convert\
    \ To C\n\nWrite the equivalent C code for this function. Assume all parameters\
    \ and return values are unsigned values.\n\n```\npush ebp\nmov ebp, esp\nmov eax,\
    \ 0\nmov ecx, [ebp + 8]\ncmp ecx, 0\njne _Label_1\ninc eax\njne _Label_2\n:_Label_1\n\
    dec eax\n:_Label_2\nmov ecx, [ebp + 12]\ncmp ecx, 0\njne _Label_3\ninc eax\n:_Label_3\n\
    mov esp, ebp\npop ebp\nret\n```\n\nStarting with the C function prototype from\
    \ answer 1, and the conditional blocks in answer 2, we can put together a pseudo-code\
    \ function, without variable declarations, or a return value:\n\n```\nunsigned\
    \ int __CDECL MyFunction(unsigned int param1, unsigned int param2)\n{\n    if(param1\
    \ == 0)\n    {\n        eax++;\n    }\n    else\n    {\n        eax--;\n    }\n\
    \    if(param2 == 0)\n    {\n        eax++;\n    }\n```\n\nNow, we just need to\
    \ create a variable to store the value from eax, which we will call 'a', and we\
    \ will declare as a **register** type:\n\n```\nunsigned int CDECL MyFunction(unsigned\
    \ int param1, unsigned int param2)\n{\n    register unsigned int a = 0;\n    if(param1\
    \ == 0)\n    {\n        a++;\n    }\n    else\n    {\n        a--;\n    }\n  \
    \  if(param2 == 0)\n    {\n        a++;\n    }\n    return a;\n}\n```\n\nGranted,\
    \ this function isn't a particularly useful function, but at least we know what\
    \ it does.\n\n# 15 Loops\n\n## 15.1 Loops\n\nTo complete repetitive tasks, programmers\
    \ often implement loops. There are many sorts of loops, but they can all be boiled\
    \ down to a few similar formats in assembly code. This chapter will discuss loops,\
    \ how to identify them, and how to 'decompile' them back into high-level representations.\n\
    \n## 15.2 Do-While Loops\n\nIt seems counterintuitive that this section will consider\
    \ Do-While loops first, considering that they might be the least used of all the\
    \ variations in practice. However, there is method to our madness, so read on.\n\
    \nConsider the following generic Do-While loop:\n\n![](img/9b6491f497eec80c9bc0146581237790_115_0.png)\n\
    \n```c\ndo{\n  action;\n} while(condition);\n```\n\nFigure 12\n\nWhat does this\
    \ loop do? The loop body simply executes, the condition is tested at the end of\
    \ the loop, and the loop jumps back to the beginning of the loop if the condition\
    \ is satisfied. Unlike if statements, Do-While conditions are not reversed.\n\n\
    Let us now take a look at the following C code:\n\n```c\ndo{\n  x++;\n} while(x\
    \ != 10);\n```\n\n```assembly\nmov $x, eax\nbeginning:\ninc eax\ncmp eax, 0x0A\
    \ ;0xA = 10\njne beginning\nmov $x, eax\n```\n\n## 15.3 While Loops\n\nWhile loops\
    \ look almost as simple as a Do-While loop, but in reality they aren't as simple\
    \ at all. Let's examine a generic while-loop:\n\n```\nwhile(x)\n{\n  // loop body\n\
    }\n```\n\nWhat does this loop do? First, the loop checks to make sure that x is\
    \ true. If x is not true, the loop is skipped. The body is then executed, by another\
    \ check: if x is still true? Looking through, we see cmp statements. The first\
    \ cmp statement compares ecx to zero. If ecx is not zero, we go to _Label_1, decrement\
    \ eax, and then fall through to _Label_2. If ecx is zero, we increment eax, and\
    \ go directly to _Label_2. Writing out some pseudocode, we have the following\
    \ result for the first section:\n\n```\nif(ecx does equal 0) goto _label_1\neax++;\n\
    goto _label_2\n:_label_1\neax--;\n:_label_2\n```\n\nSince, _Label_2 occurs at\
    \ the end of this structure, we can rename it to something more descriptive, like\
    \ 'End_of_Branch_1', or 'Branch_1_End'. The first comparison tests ecx against\
    \ 0, and jumps on not-equal. We can reverse the conditional, and say that _Label_1\
    \ is an else block:\n\n```\nif(ecx == 0); ecx is param1\n{\n    eax++;\n}\nelse\n\
    {\n    eax--;\n}\n```\n\nSo we can rename _Label_1 to something else descriptive,\
    \ as 'Else_1'. The rest of the code block, after Branch_1_End (_Label_2) is as\
    \ follows:\n\n```\nmov ecx, [ebp + 12]\ncmp ecx, 0\njne _Label_3\ninc eax\n:_Label_3\n\
    ```\n\nWe can see immediately that _Label_3 is the end of the branch structure,\
    \ so we can immediately call it 'Branch_2_End', or something else. Here, we are\
    \ again comparing ecx to 0, and if it is not equal, we jump to the end of the\
    \ block. If it is equal to zero, however, we increment eax, and fall out the bottom\
    \ of the branch. We can see that there is no else block in this branch structure,\
    \ so we don't need to invert the condition. We can write an if statement directly:\n\
    \n```\nif(ecx == 0); ecx is param2 here\n{\n    eax++;\n}\n```\n\n## 15.4 For\
    \ Loops\n\nWhat is a For-Loop? In essence, it's a While-Loop with an initial state,\
    \ a condition, and an iterative instruction. For instance, the following generic\
    \ For-Loop:\n\n![](img/9b6491f497eec80c9bc0146581237790_117_0.png)\n\nFigure 13\n\
    \ngets translated into the following pseudocode while-loop:\n\n```\ninitialization;\n\
    while(condition)\n{\n  action;\n  increment;\n}\n```\n\nWhich in turn gets translated\
    \ into the following Do-While Loop:\n\n```\ninitialization;\nif(condition)\n{\n\
    \    do\n        action;\n        increment;\n} while(condition);\n```\n\nNote\
    \ that often in for() loops you assign an initial constant value in A (for example\
    \ x = 0), and then compare that value with another constant in B (for example\
    \ x < 10). Most optimizing compilers will be able to notice that the first time\
    \ x IS less than 10, and therefore there is no need for the initial if(B) statement.\
    \ In such cases, the compiler will simply generate the following sequence:\n\n\
    ```\ninitialization;\ndo{\n    action\n    increment\n} while(condition);\n```\n\
    \n## 15.5 Other Loop Types\n\nC has only Do-While, While, and For Loops, but some\
    \ other languages may very well implement their own types. Also, a good C-Programmer\
    \ could easily *home brew* a new type of loop using a series of good macros, so\
    \ they bear some consideration:\n\n### 15.5.1 Do-Until Loop\n\nA common Do-Until\
    \ Loop will take the following form:\n\n```\ndo\n{\n    //loop body\n} until(x);\n\
    ```\n\nwhich essentially becomes the following Do-While loop:\n\n```\ndo\n{\n\
    \    //loop body\n} while(!x);\n```\n"
