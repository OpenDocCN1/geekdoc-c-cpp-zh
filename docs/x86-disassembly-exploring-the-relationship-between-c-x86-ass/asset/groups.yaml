  - '[PAGE 127]


    # Variables


    +   2. Signed variables use signed branch instructions as jge and jl. Unsigned
    variables use unsigned branch instructions as jae, jb.


    The difference between signed and unsigned instructions is the conditions under
    which the various flags for greater-than or less-than (overflow) flags are set.
    The integer result values are exactly the same for signed and unsigned data.


    # 17.6 Floating-Point Values


    Floating point values to be 32-bit data values (for float) or 64-bit data values
    (for double). These values are distinguished from ordinary integer-valued variables
    because they are used with floating-point instructions. Floating instructions
    typically start with the letter f. For instance, fadd, fcmp, and similar instructions
    are used with floating point values. In particular note are the float instruction
    and variants. These instructions take integer-valued variable and convert it into
    a floating point variable.


    We will discuss floating point variables in more detail in a later chapter.


    # 17.7 Global Variables


    Global variables do not have a limit scope lexical variables inside inside function
    body. Since the notion of lexical scope in nature, they are typically not found
    on the stack. Global variables are not lexical in nature tend to exist in the
    program as a hard-coded memory address, which never changes throughout program
    execution. This could exist in the DATA segment of the executable, or anywhere
    else a hard-coded memory address can be used to store data.


    In C, global variables are defined outside the body of any function. There is
    no "global" keyword. Any variable which is not defined inside a function is global.
    In C however, a variable which is not defined inside a function is only global
    to the particular source code file in which it is defined. For example, we have
    two files Foo.c and Bar.c, and a global variable MyGlobalVar:


    | Foo.c | Bar.c |

    |---|---|

    | int MyGlobalVar; | int GetVar(void) |

    | int GetVar(void) | { |

    | //right! | //wrong! |

    | return MyGlobalVar; | return MyGlobalVar; |

    | | |


    In the example above, the variable MyGlobalVar is visible the file Foo.c, but
    is not visible inside the file Bar.c. To make MyGlobalVar visible inside all project
    files, we need to use the extern keyword, which we will discuss below.'
  - "[PAGE 128]\n\n# 17.7.1 \"static\" Variables\n\nThe C programming language uses\
    \ a special keyword 'static' to define variables which are local to the function\
    \ (they cannot be referenced from outside the function) but they maintain their\
    \ values across function calls. Unlike ordinary lexical variables which are created\
    \ on the stack when the function is entered and destroyed when the function returns,\
    \ static variables are created once and are never destroyed.\n\n```\nint myFunction(void)\
    \ {\n    static int x;\n}\n```\n\nStatic variables in C are global variables,\
    \ except the compiler takes precautions to prevent the variable from being accessed\
    \ outside of the parent's function. Like global variables, static variables are\
    \ referenced using a hardcoded memory address, not a location on the stack like\
    \ ordinary variables. Unlike globals, static variables are only used inside a\
    \ single function. There is no difference between a global variable which is only\
    \ used in a single function, and a static variable inside that same function.\
    \ However, it's good programming practice to limit the number of global variables,\
    \ so when disassembling, you should prefer interpreting these variables as static\
    \ instead of global.\n\n# 17.7.2 \"extern\" Variables\n\nThe extern keyword is\
    \ used by a C compiler to indicate that a particular variable is global to the\
    \ entire project, not just to a single source code file. Besides this distinction,\
    \ and the slightly larger lexical scope of extern variables, they should be treated\
    \ like ordinary global variables.\n\nIn static libraries, variables marked as\
    \ being extern might be available for use with programs which are linked to the\
    \ library.\n\n# 17.7.3 Global Variables Summary\n\nHere is a table to summarize\
    \ points about global variables:\n\n| How it's referenced | Lexical scope | Notes\
    \ |\n|---|---|--|\n| static variables | Hard-coded memory address, only in one\
    \ function | One function only | In disassembly, indistinguishable from global\
    \ variables except that it's only used in one function. A global variable is only\
    \ static if it's never used in another function. |"
  - '[PAGE 129]


    # Variables


    | Global variables | Hard-coded memory address, only in one file | One source
    code only | Global variables are only used in a single file. This can help you
    when disassembling to get a rough estimate for how the original source code was
    arranged |

    | extern variables | Hard-coded memory address, in the entire project | The entire
    project | Extern variables are available for use in all functions of a project,
    and in programs linked to the project (external libraries, for example). |


    When disassembling, a hard-coded memory address should be considered to be an
    ordinary global variable unless you can determine from the scope of the variable
    that it is static or extern.


    # 17.8 Constants


    Variables qualified with the const keyword (in C) are frequently stored in the
    .data section of the executable. Constant values can be distinguished because
    they are initialized at the beginning of the program, and are never modified by
    the program itself. For these reasons, some compilers may choose to store constant
    variables (especially strings) in the .text section of the executable, allowing
    the sharing of these variables across multiple instances of the same process.
    This creates a big problem for the reverser, who has to decide whether the code
    he''s looking at is part of a constant variable or part of a subroutine.


    # 17.9 Volatile memory


    In C and C++, variables can be declared ''volatile'', which tells the compiler
    that the memory location can be accessed from external or concurrent processes,
    and that the compiler should not perform any optimizations on the variable. For
    instance, if multiple threads were all accessing and modifying a single global
    value, it would be bad to store that in a register sometimes, and flush to memory
    infrequently. In general, Volatile memory must be flushed to memory after every
    calculation, to ensure that the most current version of the data is in memory
    when other processes come to look for it.'
