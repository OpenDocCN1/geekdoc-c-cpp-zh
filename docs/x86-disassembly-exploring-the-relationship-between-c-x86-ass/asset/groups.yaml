    \ an unqualified loop with a condition that is always true. For instance, the\
    \ following pseudo-code:\n\n```\ndofever\n{\n  //loop body\n}\n```\n\nwill become\
    \ the following while-loop:\n\n```\nwhile(1)\n{\n  //loop body\n}\n```\n\nWhich\
    \ can actually be reduced to a simple unconditional jump statement:\n\n```\nbeginning:\n\
    \  ;loop body\njmp beginning\n```\n\nNotice that some non-optimizing compilers\
    \ will produce nonsensical code for:\n\n```\nmov ax, 1\ncmp ax, 1\nje label\n\
    beginning:\n  ;loop body\ncmp ax, 1\nje beginning\nloopend:\n```\n\nNotice that\
    \ a lot of the comparisons here are not needed since the condition is a constant.\n\
