  - "[PAGE 47]\n\n# 5.5.1 MS-DOS header\n\nOpen any Win32 binary executable in a hex\
    \ editor, and note what you see: The first 2 letters are always the letters 'MZ'.\
    \ To some, the first few bytes in a file determine the type of file are called\
    \ the 'magic number,' although this book will not use that term, because there\
    \ is no rule that states the 'magic number' needs to be a single number. Instead,\
    \ we will use the term 'File ID Tag', or simply File ID. Sometimes this is also\
    \ known as File Signature.\n\nAfter the File ID, the hex editor will show several\
    \ bytes of random-looking symbols, whitespace, the human-readable \"This program\
    \ cannot run in DOS mode\".\n\nWhat is this?\n\n```\n00000000 4D 5A 90 00 03 00\
    \ 00 00 04 00 00 FF FF 00 00 MZ\n00000010 48 00 00 00 00 00 00 40 00 00 00 00\
    \ 00 00 @\n00000020 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00\n00000030\
    \ 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00\n00000040 0E 1F 8A 0E 0B 04\
    \ 09 21 28 01  1C 24 21 54 68 L!h\n00000050 69 73 20 70 70 6F 67 72 61 6D 6D 21\
    \ 63 66 6F is program\n00000060 74 20 62 75 20 72 75 6E 24 65 6E 64 6F 73 20 20\
    \ be run in DOS\n00000070 6D 6F 74 65 2E 0D 0D 0A 24 00 00 00 00 00 00 00 mode.\\\
    $\n00000080 26 63 85 62 A2 E0 D6 62 A2 E0 D6 62 A2 E0 D6 & . b . b . b . b\n00000090\
    \ 14 F1 RR FF 8B 6D 64 6F 7F 7B 7A 64 6A 64 66 76 74 . o . h s\n```\n\n# Hex List\
    \ of an MS-DOS file header\n\nWhat you are looking at is the MS-DOS header of\
    \ the Win32 PE file. To ensure either backwards compatibility, or by graceful\
    \ decline of new file types, Microsoft has engineered a series of DOS instructions\
    \ into the head of each PE file. When a 32-bit Windows file runs in a 16-bit environment,\
    \ the program will terminate immediately with the error message: \"This program\
    \ cannot run in DOS mode\".\n\nThe DOS header is also known by some the EXE header.\
    \ Here is the DOS header presented as a C data structure:\n\n```\nstruct DOS_Header\
    \ {\n  char signature[2] = \"MZ\";\n  short latype;\n  short blocks;\n  short\
    \ nreloc;\n  short dsize;\n  short minalloc;\n  short maxalloc;\n  void *ea;\n\
    \  void *sp;\n  void *checksum;\n  void *id;\n  void *cs;\n  short relics;\n \
    \ short overlay;\n  short reserved[4];\n  short om_id;\n  short om_info;\n  short\
    \ reserved2[10];\n  long _efanew\n}\n```"
  md: "\n## 4.14 COM and Related Technologies\n\nCOM, and a whole of technologies\
    \ that are related to COM or are actually COM with a fancy name, is another factor\
    \ to consider when reversing Windows binaries. DCOM, COM+, ActiveX, OLE, MTS,\
    \ and Windows DNA are all names for the same subject, so that they may be considered\
    \ under the same heading. In short, COM is a method to export Object-Oriented\
    \ Classes in a uniform, cross-platform and cross-language manner. In essence,\
    \ COM is .NET, version 0 beta. Using COM, components written in many languages\
    \ can export, import, instantiate, and destroy objects in another file, so often\
    \ a DLL. DLL provides cross-platform (to some extent) and cross-language facilities,\
    \ each COM object is compiled to a native binary, rather than an immediate format\
    \ such as Java or .Net. As such, COM does not require a virtual machine to execute\
    \ such objects.\n\nThis book will tell you some examples of COM, and the reversals\
    \ associated with them, although the subject is very broad, and may elude the\
    \ scope of this book (or least the early sections of it). The discussion may be\
    \ part of an \"Advanced Topic\" found in later sections of this book.\n\nDue to\
    \ the way COM works, the methods and data structures exported by a COM component\
    \ are difficult to perceive by simply inspecting the executable file. Matters\
    \ are made worse if the programmer has used a library such as ATL to simplify\
    \ their programming experience. Unfortunately, for a reverse engineer, this reduces\
    \ the contents of an executable into a \"Sea of bits\", with points and data structures\
    \ everywhere.\n\n## 4.15 Remote Procedure Calls (RPC)\n\nRPC is a generic term\
    \ referring to techniques that allow a program running on one machine to make\
    \ calls that actually execute on another machine. Typically, this is done by marshalling\
    \ all of the data needed for the procedure including any state stored on the first\
    \ machine, and building it into a single data structure, which is then transmitted\
    \ over some communications to another machine. This second machine then performs\
    \ the requested action, and returns a data packet containing any and potentially\
    \ changed state information to the originating machine.\n\nIn Windows NT, RPC\
    \ is typically handled by two libraries that are similarly named, one generates\
    \ RPC requests and accepts RPC returns, as requested by a user-mode program, and\
    \ one responds to RPC requests and returns results via RPC. A classic example\
    \ is the print spooler, which consists of two pieces: the RPC stub spools.dll,\
    \ and the spooler provider spools.exe. In most cases, which are stand-alone, it\
    \ would seem that the two modules communicating by means of RPC is overkill; why\
    \ not simply roll them into a single routine? In networking, though, this makes\
    \ sense, the RPC service provider can be resident physically on a distant machine,\
    \ with the remote printer, and the local machine can control the printer on the\
    \ remote machine in exactly the same way that it controls printers on the local\
    \ machine.\n\n> 3 http://en.wikipedia.org/wiki/Active_Template_Library\n\n## 5\
    \ Windows Executable Files\n\n### 5.1 MS-DOS RAM COM Files\n\nCOM files are loaded\
    \ into RAM exactly as they appear: no change is made at all from the harddisk\
