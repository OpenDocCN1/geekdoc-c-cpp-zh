    模块化调试器 (MDB) 是一种用于 Solaris 操作系统环境的新型通用型调试工具。它的主要特点是其可扩展性。Solaris 模块化调试器描述了如何使用
    MDB 调试复杂的软件系统，特别强调了调试 Solaris 内核以及相关设备驱动和模块的可用设施。它还包含了对 MDB 语言语法、调试器功能以及 MDB 模块编程
    API 的完整参考和讨论。


    ## 3.1.4 调试技术


    ### 设置断点


    正如之前在反汇编器章节中提到的，一个输出“Hello, World!”的 6 行 C 程序会变成大量的汇编代码。大多数人都不希望通过筛选整个这堆乱码来寻找他们想要的信息。仅仅通过翻阅代码来寻找所需信息可能耗费大量。作为替代方案，可以选择设置断点，以便在程序运行到代码中的给定点时将其停止。


    例如，假设在你的程序中，在某个特定事件之后经常遇到崩溃：在关闭消息框之后立即。你对所有 `MessageBoxA` 的调用都设置了断点。你带有断点运行程序，它会停下来并准备调用
    `MessageBoxA`。此后逐行执行代码（称为*单步执行* *stepping*）并观察程序堆栈，你发现在调用后不久发生了缓冲区溢出。


