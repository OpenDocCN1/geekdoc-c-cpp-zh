    \ a location pointed to by (argc * 4 + $L818). What is $L818?\n\n## 13.4.3 The\
    \ Switch Table\n\n```\n$L818:\nDD\t$L806\nDD\t$L807\nDD\t$L808\nDD\t$L809\n```\n\
    \n$L818 is a pointer, in the code section, to a list of other pointers. These\
    \ pointers are all 32-bit values (DWORD). Let's look back at our jump:\n\n```\n\
    jmp DWORD PTR L818[edx*4]\n```\n\n## Ternary Operator\n\nIn this jump, $L818 isnt\
    \ the offset, it's the base, edx*4 is the offset. As we said earlier, edx contains\
    \ the value (argc - 1). If argc == 1, we jump to [$L818 + 0] which is $L806. If\
    \ argc == 2, we jump to [$L818 + 4] which is $L807. A look at labels $L806, $L807,\
    \ $L808, and $L809 shows exactly what we expect: the case statements from the\
    \ original code, each of the case statements calls \"MyFunction\", then breaks,\
    \ and jumps to the end of the switch.\n\n## 13.5 Ternary Operator\n\nAgain, the\
    \ best way to learn is by doing. We will go through a mini example to explain\
    \ the ternary operator. Consider the following C code:\n\n```\nint main(int argc,\
    \ char **argv)\n{\n    return (argc > 1) ? 5 : (0);\n}\n```\n\ncl.exe produces\
    \ the following assembly:\n\n```\n_argc = 0              ; size = 4\n_argv = 1\
    \             ; size = 4\n_main\n    PROC NEAR\n; C:\\documents\\andrew\\test2.c\n\
    \    Line 2\n    push                ebp\n    mov                 eax, esp\n \
    \   Line 3\n    xor                 eax, eax\n    cmp                 DWORD PTR\
    \ [ebp], 1\n    setle              al\n    and                 eax, 5\n    Line\
    \ 4\n    pop                 ebp\n    ret\n    ret                 0\n_main  \
    \              ENDP\n```\n\nLine 2 sets up a stack frame, and line 4 is a standard\
    \ exit sequence. There are no local variables is where we want to look. The instruction\
    \ \"xor eax, eax\" simply sets eax to 0. For more information on that line, see\
    \ the chapter on intuitive instructions!. The function tests the condition of\
    \ the ternary operator. The cmp instruction is a set of x86 functions that works\
    \ like a conditional move: it gets the value if argc < 1. Isn't the exact opposite\
    \ of what we wanted? In this case, let's look at what happens when argc == 0:\
    \ al gets the value 1. al is decremented (al = eax), and eax is logically anded\
    \ with 5. 5 & 0 = 0. When argc == 2 (greater than 1), the function doesn't do\
    \ anything, and eax still is zero. eax then decremented, which means eax == -1.\
    \ What is -1?\n\nIn x86 processors, negative numbers are stored in two's complement\
    \ format. For instance, let's look at the following C code:\n\n## Branches\n\n\
    ```\nBYTE x;\nx = -1;\n```\n\nAt the end of this C code, x will have the value\
    \ 1111111: all ones!\n\nWhen argc is greater than 1, let sets al to zero. Decrementing\
    \ this value sets every bit in eax to a 1. Now, when we perform the logic and\
    \ function we get:\n\n```\n...11111111\n&.0000101    ;101 is 5 in binary\n----------------\n\
    .00000101\n```\n\neax gets the value 5. In this case, its a roundabout method\
    \ of doing it, but as a reverser, for reference, here is the GCC assembly output\
    \ of the same ternary operator from above:\n\n```\n_main:\npushl  ebp\nmovl  \
    \ %esp,ebp\nsubl   $0,%eax\nxorl   eax,eax\nandl   $-16,%eax\ncall   _malloc\n\
    call   __main\nxorl   %edx,edx\nmovel   eax,edi\ncmpl   $2(%ebp)\nsetge  dl\n\
    leal   (edx,%edx,4),eax\nleave\nret\n```\n\nNotice that GCC produces slightly\
    \ different code than cl.exe produces. However, the stack frame is set by us line\
    \ numbers, or other hints in the code. The ternary operator line occurs after\
    \ the instruction 'call __main'. Let's highlight that section here:\n\n```\nxorl\
    \ %edx,edx\ncmpl $2,(ebp)\nsetge dl\nleal (edx,%edx,4),eax\n```\n\nAgain, xor\
    \ is used to set edx to zero. argc is tested against 2 (instead of 1), and dl\
    \ is set if argc is greater than or equal. If dl gets to 1, the leal instruction\
    \ directly thereafter will move the value of 5 into eax (because lea (edx,%edx,4)\
    \ means edx + edx * 4, i.e. edx * 5).\n"
