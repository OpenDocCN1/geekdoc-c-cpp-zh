    Intel, AT&T, or (occasionally) HLA syntax. Examples in this book will use Intel
    and AT&T syntax interchangeably. We will typically not use HLA syntax for code
    examples, but that may change in the future.


    ### 2.2 x86 Disassemblers


    Here we are going to list some commonly available disassembler tools. Notice that
    there are professional disassemblers (which cost money for a license) and there
    are freeware/shareware disassemblers. Each disassembler will have different features,
    so it is up to you as the reader to determine which tools you prefer to use.


    #### 2.2.1 Commercial Disassemblers


    ##### IDA Pro


    is a professional disassembler that is expensive, extremely powerful, and has
    a slew of features. The downside to IDA Pro is that it costs $515 for single-user.
    Freeware versions do exist; see below.


    - http://www.hex-rays.com/idapro/

    - http://en.wikipedia.org/Disassembler


    ##### Hopper Disassembler


    is a reverse engineering tool for the Mac, that lets you disassemble, decompile
    and debug 32/64bit executables.


    #### 2.2.2 Commercial Freeway/Shareware Windows Disassemblers


    ##### OllyDbg


    OllyDbg is one of the most popular disassemblers recently. It has a large community
    and a wide variety of plugins available. It emphasizes binary code analysis. Supports
    x86 instructions.


    - http://www.ollydbg.de/ (official website)

    - http://www.openrc.org/downloads/browse/OllyDbg_Plugins (plugins)


    #### 2.2.3 Free Windows Disassemblers


    ##### Objconv


    A command line disassembler supporting 16, 32, and 64 bit x86 code. Latest instruction
    set (SSE4, AVX, XOP, FMA, etc.), several object file formats, several assembly
    syntax dialects. Windows, Linux, Mac. Intelligent analysis.


    - http://www.agner.org/optimize/#objconv


    ##### IDA 3.7


    A DOS GUI tool that very much like IDA Pro, but is considerably more limited.
    It can disassemble code for the Z80, 6502, Intel 8051, Intel i860, and PDP-11
    processors, as well as x86 instructions up to the 486.

