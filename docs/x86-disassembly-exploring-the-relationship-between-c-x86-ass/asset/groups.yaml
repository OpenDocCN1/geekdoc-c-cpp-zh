  - "[PAGE 176]\n\nxchg exchanges the contents of two registers, a register or a memory\
    \ address. A noteworthypoint is the fact that xchg operates faster than a move\
    \ instruction. For this reason, xchg will be used to move a value from a source\
    \ to a destination, when the value in the source no longer needs to be saved.\n\
    \nAs an example, consider this code:\n\n```\nmov ebx, eax\nmov eax, 0\n```\n\n\
    Here, the value in eax is stored in ebx, and then eax is loaded with the value\
    \ zero. We can perform the same operation, but using xchg and xor instead:\n\n\
    ```\nxchg eax, ebx\nxor eax, eax\n```\n\nIt may surprise you to learn that the\
    \ second code example operates significantly faster than the first one does.\n\
    \n# 25.5 Obfuscators\n\nThere are a number of tools on the market that will automate\
    \ the process of code obfuscation. These products will use a number of transformations\
    \ to turn a code snippet into a less-readable format, although it will not affect\
    \ the program flow itself (although the transformations may increase code size\
    \ or execution time).\n\n# 25.6 Code Transformations\n\nCode transformations are\
    \ a way of reordering code that it performs exactly the same task but becomes\
    \ more difficult to trace and disassemble. We can best demonstrate this technique\
    \ by example. Let's say that we have 2 functions, FunctionA and FunctionB. Both\
    \ of these two functions are comprised of 3 separate parts, which are performed\
    \ in order. We can break this down as such:\n\n```\nFunctionA()\n{\n    FuncPart1();\n\
    \    FuncPart2();\n    FuncPart3();\n}\n```\n\n```\nFunctionB()\n{\n    FuncPart1();\n\
    \    FuncPart2();\n    FuncPart3();\n}\n```\n\nAnd we have our main program, that\
    \ executes the two functions:\n\n```\nmain()\n{\n```"
