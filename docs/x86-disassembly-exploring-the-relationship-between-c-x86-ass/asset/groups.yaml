    Intel 编译器由 Intel 提供的，用于优化 x86 代码。它支持多种汇编语言，并可以输出 Intel 或 AT&T 语法。书中的示例将交叉使用 Intel
    和 AT&T 语法，但以后可能会改变。


    ### 1.7.4 Metrowks CodeWarrior


    该编译器通常用于 MacOS 和嵌入系统。如果你对电子产品进行逆向工程，可能会遇到 Metrowks 生成的代码。


    ### 1.7.5 Green Hills Software


    该编译器通常用于嵌入式系统。如果你对电子产品进行逆向工程，可能会遇到 Green Hills 生成的代码。


    ## 2 反汇编器与反编译器


    ### 2.1 什么是反汇编器？


    反汇编器：本质上说，**反汇编器**是汇编器的相反。汇编器将汇编语言转换为二进制机器码，反汇编器反转这一过程，从二进制机器码还原汇编代码。由于大多数汇编语言与机器码是一一对应的，反汇编过程相对直接。当然，反汇编也有自己的问题和陷阱，将在本文介绍。许多反汇编器支持输出
    Intel、AT&T 或偶尔的 HLA 语法。书中示例将使用 Intel 和 AT&T 语法。


