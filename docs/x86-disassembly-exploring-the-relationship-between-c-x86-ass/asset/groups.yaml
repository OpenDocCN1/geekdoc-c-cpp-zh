  mdcn: "\n\n## 4.14 COM 及相关技术\n\n在逆向 Windows 二进制文件时，COM 以及与 COM 相关或实际上带有华丽名称的 COM\
    \ 技术是另一个需要考虑的因素。DCOM、COM+、ActiveX、OLE、MTS 和 Windows DNA 都是同一个主题的不同名称，因此它们可以被归为一类。简而言之，COM\
    \ 是一种以统一、跨平台和跨语言的方式导出面向对象类的方法。本质上，COM 是 0 beta 版 .NET。通过 COM，用多种语言编写的组件可以在另一个文件（通常是\
    \ DLL）中导出、导入、实例化和销毁对象。DLL 提供了（某种程度上的）跨平台和跨语言的功能，每个 COM 对象都被编译为原生二进制文件，而不是像 Java\
    \ 或 .Net 那样的中间格式。因此，COM 不需要虚拟机来执行这些此类对象。\n\n此本书将向你介绍一些 COM 的示例以及与之相关的逆向工程，尽管这个主题非常广泛，可能超出本书的范围（或至少超出本书的前几个章节）。相关讨论可能是本书后续章节中“高级主题”的一部分。\n\
    \n由于 COM 的工作机制，仅仅通过检查可执行文件很难察觉 COM 组件导出的方法和数据结构。如果程序员使用了 ATL 等库来简化编程体验，情况会变得糟糕。遗憾的是，对于逆向工程师来说，这会将可执行文件的内容简化为“比特海洋”，到处都是点和数据结构。\n\
    \n## 4.15 远程过程调用 (RPC)\n\nRPC 是一个通用术语，指运行在一台机器上的程序调用实际在另一台机器上执行的技术。通常，这是通过对过程所需的所有数据（包括存储在第一台机器上的任何状态）进行封，，并构建成单个数据结构，然后通过某些通信传输到另一台机器来实现。第二台机器执行请求的操作，并返回一个包含任何以及可能更改的状态信息的数据包给源机器。\n\
    \n在 Windows NT 中，RPC 通常由两个名称类似的库处理：一个根据用户态程序的请求生成 RPC 请求并接受 RPC 返回，另一个响应 RPC 请求并通过\
    \ RPC 返回结果。一个经典的例子是打印后台程序（print spooler），它由两个部分组成：RPC 存根 `spools.dll` 和后台程序提供程序\
    \ `spools.exe`。在大多数情况下，由于这两个模块是独立的，通过 RPC 进行通信似乎是多此一举；为什么不简单地将它们合并为一个例程呢？但在网络中，这是合理的，RPC\
    \ 服务提供程序可以物理上留在带有远程打印机的远程机器上，本地机器可以完全按照控制本地打印机的方式控制远程机器上的打印机。\n\n> 3 http://en.wikipedia.org/wiki/Active_Template_Library\n\
    \n## 5 Windows 可执行文件\n\n### 5.1 MS-DOS RAM COM 文件\n\nCOM 文件完全按照其在磁盘上的样子被加载到 RAM\
    \ 中：从硬盘镜像到 RAM 完全没有进行任何更改。这归功于早期 x86 系列的 20 位内存模型。这需要设置两个 16 位寄存器，将 1MB+64K 的内存空间划分为\
    \ 65536 个“段”，并指定其中一个段的偏移量。段寄存器由 DOS 设置，COM 文件预期遵守此设置且永远更改段寄存器。然而，偏移量寄存器是自由的，并且（对于\
    \ COM 文件）的作用与 32 位寄存器相同。缺点是，由于偏移量寄存器，COM 文件被限制为使用 64K 的 RAM。这种方法的优点是，DOS 不需要额外的内存来加载和运行\
    \ COM 文件：只需加载文件，设置段寄存器，然后跳转到该处。（程序可以通过仅提供跳转偏移量来执行“近”跳转。）\n\nCOM 文件在偏移量 $100$ 处加载到\
    \ RAM。此之前的空间将用于与 DOS 之间传递数据（例如，调用程序的命令行内容）。\n\n注意，根据定义，COM 文件不能是 32 位的。Windows\
    \ 通过特殊的 CPU 模式提供对 COM 文件的支持。\n\n> 注意，MS-DOS COM 文件（command 文件的缩写）与组件对象模型文件不同，后者是一种面向对象的库技术。\n\
    \n### 5.2 MS-DOS EXE 文件\n\nMS-DOS 编译器能够规避 64k 内存限制的一种方法是引入内存模型。其基本概念是巧妙地设置 x86\
    \ CPU 中不同的段寄存器（CS, DS, ES, SS），使其指向相同或不同的段，从而允许不同程度的内存访问。典型的内存模型有：\n\n- **tiny**（微型）：所有内存访问均为\
    \ 16 位的（从不重载任何段寄存器）。生成 .COM 文件而不是 .EXE 文件。\n- **small**（小内存）：所有内存访问均为 16 位的（从不重载任何段寄存器）。\n\
    - **compact**（紧凑）：对数据段的访问重载 CS 寄存器，允许 32 位代码。数据访问不重载 DS、ES、SS 寄存器，允许 16 位数据。\n\
    - **medium**（中内存）：对数据段的访问重载 DS、ES、SS 寄存器，允许 32 位数据。代码访问不重载 CS 寄存器，允许 16 位代码。\n\
    - **large**（大内存）：代码和数据访问均使用段寄存器（CS 用于代码，DS, ES, SS 用于数据），允许 32 位代码和 32 位数据。\n\
    - **huge**（巨大内存）：与 large 模型相同，但通过编译器生成的额外运算允许访问大于 64k 的数组。查看 COM 文件时，必须判断使用了哪种内存模型。\n\
    \n### 5.3 PE 文件\n\nPE（Portable Executable）文件是 Windows NT、95 和 Win32 的标准二进制格式。Win32\
    \ SDK 中的 `wnt.h` 声明了 PE 文件中使用的各种结构体和变量。PE 文件被拆分为若干个节。\n\n### 5.4 相对虚拟地址 (RVA)\n\
    \n在 Windows 环境中，可执行模块可以加载到内存的任何位置。为了允许程序加载到内存的随机位置，PE 文件采用了一种称为 RVA（相对虚拟地址）的技术。这假设模块在内存中的加载位置是未知的。因此，PE\
    \ 文件将内存中的位置描述为相对于基地址的偏移量。当内存中的位置未知时，该问题的解决方法描述在“重定位”（Relocations）中。反汇编模块得到的地址将与调试器中看到的地址匹配。\n\
    \n### 5.5 文件格式\n\nPE 可执行文件格式包含若干个头部，排列如下：\n\n| DOS header |\n| PE Signature |\n\
    | COFF Header |\n| Optional Header |\n| Section Table |\n\n### 5.5.1 DOS header\n\
    \n用十六编辑器打开任何 Win32 二进制执行文件，注意你看到的：前两个字母总是“MZ”。对于某些人来说，文件的前几个字节被称为“魔数”（magic number），但本书不会使用该术语，因为没有规定“魔数”必须是一个数字。相反，我们将使用“File\
    \ ID”或简单的 File ID。这也称为 Signature。在 File ID 之后，十六编辑器将显示几个看起来随机的字节以及人类可读的“This program\
    \ cannot run in DOS mode”。这是什么？\n\n```\n00000000 4D 5A 90 00 03 00 00 00 04 00\
    \ 00 FF FF 00 00 MZ\n00000010 48 00 00 00 00 00 00 40 00 00 00 00 00 00 @\n00000020\
    \ 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00\n00000030 00 00 00 00 00 00 00\
    \ 00 00 00 00 00 00 00 00\n00000040 0E 1F 8A 0E 0B 04 09 21 28 01 1C 24 21 54\
    \ 68 L!h\n00000050 69 73 20 70 70 6F 67 72 61 6D 6D 21 63 66 6F is program\n00000060\
    \ 74 20 62 75 20 72 75 6E 24 65 6E 64 6F 73 20 20 be run in DOS\n00000070 6D 6F\
    \ 74 65 2E 0D 0D 0A 24 00 00 00 00 00 00 00 mode.\\$\n00000080 26 63 85 62 A2\
    \ E0 D6 62 A2 E0 D6 62 A2 E0 D6 & . b . b . b . b\n00000090 14 F1 RR FF 8B 6D\
    \ 64 6F 7F 7B 7A 64 6A 64 66 76 74 . o . h s\n```\n\nMS-DOS 文件头十六进制列表\n\n你正在看到的是\
    \ Win32 PE 文件的 DOS header。为了确保向后兼容性或通过优雅地拒绝新文件类型，微软在每个 PE 文件的头部设计了一系列 DOS 指令。当\
    \ 32 位的 Windows 文件运行在 16 位环境中时，程序将立即终止并显示错误信息：“This program cannot run in DOS\
    \ mode”。\n\nDOS header 也被某些人称为 EXE header。以下是以 C 数据结构形式表示的 DOS header：\n\n```\n\
    struct DOS_Header {\n  char signature[2] = \"MZ\";\n  short latype;\n  short blocks;\n\
    \  short nreloc;\n  short dsize;\n  short minalloc;\n  short maxalloc;\n  void\
    \ *ea;\n  void *sp;\n  void *checksum;\n  void *id;\n  void *cs;\n  short relics;\n\
    \  short overlay;\n  short reserved[4];\n  short om_id;\n  short om_info;\n  short\
    \ reserved2[10];\n  long _efanew\n}\n```\n\n"
