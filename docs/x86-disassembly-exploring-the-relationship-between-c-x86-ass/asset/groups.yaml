    \ ESP：http://blogs.msdn.com/larryosterman/archive/2007/03/12/fpo.aspx)] 这意味着无法可靠地使用\
    \ `esp` 的值来确定（适当的偏移）特定变量的位置。为了解决这个问题，许多编译器使用相对于 `ebp` 寄存器的负偏移量来访问局部变量。这允许我们假设使用相同的偏移量始终访问相同的变量（或参数）。由于这个原因，`ebp`\
    \ 寄存器被称为**帧指针**（frame pointer），或 FP。\n\n### 9.3 退出序列（Exit Sequence）\n\n退出序列必须顺序撤销入口序列执行的操作：\n\
    \n1. 移除局部变量，恢复到旧值。\n2. 恢复 `ebp` 的旧值。\n3. 返回到调用者。\n\n### 9.4 非标准帧（Non-Standard\
    \ Frames）\n\n某些函数按照上述方法设置了标准的栈帧，但开头有一行无意义的指令：\n\n```\nmov edi, edi;```\n\n这条指令被汇编成\
    \ 2 个字节，为未来的补丁提供占位符。整体来看，这样的函数可能如下：\n\n```\nnop\nnop\nnop\nnop\n\nFUNCTION: <--\
    \ 这是 call 指令使用的入口点\n```\n\n#### 9.4.1 使用未初始化的寄存器\n\n编译器经常会遇到没有设置栈帧的子程序。在查看它时，需要考虑以下几点：\n\
    \n#### 9.4.2 \"static\" 函数\n\n在 C 中，函数可以使用 `static` 关键字声明。`static` 关键字导致函数具有局部作用域，这意味着它可能被外部函数访问。当优化编译器看到一个静态函数时：\n\
    \n```c\nstatic void MyFunction4();\n```\n\n#### 9.4.3 热补丁序言（Hot Patch Prologue）\n\
    \n如果需要通过重新加载应用程序（在内核补丁中为重启）来替换此类函数，可以通过插入跳转到替换函数的指令来实现。短跳转（可以跳转 +/-127 字节）需要 2\
    \ 个字节的存储空间——正是 `mov edi, edi` 占位符提供的空间。跳转到任何内存位置（在这种情况下到我们的替换函数）需要 5 个字节。这些由函数之前的\
    \ 5 个无操作字节提供。如果一个被补丁的函数调用它，它会先回跳 5 个字节，然后长跳转到替换函数。补丁后，内存可能如下：\n\n```\nLABEL:\n\
    mp REPLACEMENT_FUNCTION;-- 5 个 NOP 被替换为 jmp\n\nFUNCTION:\njmp short LABEL; <--\
    \ mov edi 已替换为\n向后跳转\npush ebp\nmov ebp,                与之前相同的标准栈帧设置\n```\n\n\
    ### 9.5 局部静态变量（Local Static Variables）\n\n局部静态变量不能创建在栈上，因为变量的值在函数调用之间会被保留。我们将在后面的章节讨论局部静态变量和其他类型的变量。\n\
    \n"
