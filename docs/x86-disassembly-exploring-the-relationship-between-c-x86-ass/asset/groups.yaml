    Here are a few general remarks regarding THISCALL name-mangled functions:\n\n\
    - They are recognizable on sight because of their complexity when compared to\
    \ CDECL, FASTCALL, and STDCALL function declarations.\n- They sometimes include\
    \ the name of function class's.\n- They almost always include the number and type\
    \ of the arguments, so that overloaded functions can be differentiated by the\
    \ arguments passed to it.\n\nHere is an example of a C++ class and function declaration:\n\
    \n3 http://en.wikipedia.org/wiki/Name%20mangling\n\n```\nclass MyClass {\n  MyFunction(int\
    \ a);\n}\n\nMyClass::MyFunction(int a)\n```\n\nAnd here is the resultant mangled\
    \ name:\n\n```\n?Function@MyClass@@QAEHNZ\n```\n\n## 11.4.3 Extern \"C\"\n\nIn\
    \ a C++ source file, functions placed in an extern \"C\" block are guaranteed\
    \ not to be mangled. This is done when libraries are written in C++, and the functions\
    \ need to be exported without mangling. Even though the program is written in\
    \ C++ and compiled with a C++ compiler, some of the functions might therefore\
    \ not be mangled and will use one of the ordinary C calling conventions (typically\
    \ CDECL).\n\n## 11.5 Note on Name Decorations\n\nWe've been discussing name decorations\
    \ in this chapter, but the fact is that in pure disassembled code there are no\
    \ names whatsoever, especially names with fancy decorations. The assembly stage\
    \ removes all these readable identifiers, and replaces them with the binary locations\
    \ instead. Function names really only appear in two places:\n\n- 1. Listing files\
    \ produced during compilation\n- 2. In export tables, if functions are exported\n\
    \nWhen disassembling machine code, there will be no function names and no name\
