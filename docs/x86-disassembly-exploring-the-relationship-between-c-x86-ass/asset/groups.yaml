    \ were free and served (for COM files) the same purpose as a 32-bit register.\
    \ The downside is that with offset registers, COM files were limited to using\
    \ 64K of RAM. The good thing about this approach, is that no extra memory is needed\
    \ by DOS to load and run a COM file: just load the file, set the segment register,\
    \ and jump to it. (The programs could perform 'near' jumps by just giving an offset\
    \ to jump to.)\n\nCOM files are loaded into RAM at offset $100. The space before\
    \ that would be used for passing data to and from DOS (for example, the contents\
    \ of the command line used to invoke the program).\n\nNote that COM files, by\
