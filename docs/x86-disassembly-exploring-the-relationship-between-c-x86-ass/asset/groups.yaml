    \ \"1.0\" 加载到浮点栈的顶部。\n\n## 23 代码优化\n\n### 23.1 代码优化\n\n优化编译器可能是世界上最复杂、最强大且最有趣的程序之一。本章将讨论优化，尽管本章不会包含常见优化的表格。\n\
    \n### 23.2 优化的阶段\n\n编译器可以在两个时间执行优化：第一次是在中间表示阶段，第二次是在代码生成阶段。\n\n### 23.2.1 中间表示优化\n\
    \n在处理中间表示时，编译器可以执行各种优化，通常基于数据流分析技术。例如，考虑以下代码段：\n\n```\nx = 5;\nif(x != 5)\n{\n\
    \  //循环体\n}\n```\n\n优化编译器可能会注意到，在 'if (x != 5)' 这一点上，x 的值始终是常量 '5'。这允许用 '5' 替换\
    \ x，导致 '5 != 5'。然后编译器注意到结果表达式完全对常量进行操作，因此值可以在编译时计算而不是在运行时，从而将条件优化为 'if (false)'。最后，编译器看到\
    \ if 的体永远不会被执行，因此可以省略整个 if 结构。\n\n考虑相反的情况：\n\n```\nx = 5;\nif(x == 5)\n{\n  //循环体\n\
    }\n```\n\n在这种情况下，优化编译器会注意到 IF 条件始终为真，因此它甚至不会费力编写测试 x 的代码。\n\n### 23.2.2 控制流优化\n\
    \n另一组可以在中间或代码生成级别执行的优化是控制流优化。这些优化中的大部分涉及消除无用分支。考虑以下代码：\n\n```\nif (A)\n{\n   \
    \ if (B)\n    {\n        C;\n    } else\n{\n        D;\n    }\n} else\n{\n   \
    \ E;\n}\nend_A;\n```\n\n在代码中，简单的编译器会生成从 C 块到 end_B，然后从 end_B 跳到 end_A（以获取 E 语句）。显然，跳转是低效的，因此优化编译器将直接从块块跳转到\
    \ end_A。\n\n遗憾的是，这会让代码变得更加混乱，并防止恢复原始代码。对于复杂的函数，可能必须考虑仅由 if()-goto; 序列组成的代码，而无法识别高级语句如\
    \ if-else 或循环。\n\n识别高级语句结构的过程被称为“代码结构化”。\n\n### 23.2.3 代码生成优化\n\n一旦编译器过滤了代码中所有的逻辑低效之处，代码生成器就会接管。通常代码生成器会将较慢的机器指令替换为更快的机器指令。\n\
