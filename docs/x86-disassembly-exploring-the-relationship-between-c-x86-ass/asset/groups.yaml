    \ will not include a table of common optimizations.\n\n### 23.2 Stages of Optimizations\n\
    \nThere are two times when a compiler can perform optimizations: first, in the\
    \ intermediate representation, and second, during the code generation.\n\n###\
    \ 23.2.1 Intermediate Representation Optimizations\n\nWhile in the intermediate\
    \ representation, a compiler can perform various optimizations, often based on\
    \ dataflow analysis techniques. For example, consider the following code fragment:\n\
    \n```\nx = 5;\nif(x != 5)\n{\n  //loop body\n}\n```\n\nAn optimizing compiler\
    \ might notice that at the point of 'if (x != 5)', the value of x is always the\
    \ constant '5'. This allows substituting '5' for x resulting in '5 != 5'. Then\
    \ the compiler notices that the resulting expression operates entirely on constants,\
    \ so the value can be calculated instead of at run time, optimizing the conditional\
    \ to 'if (false)'. Finally the compiler sees that the body of the if will never\
    \ be executed, so it can omit the entire body of the if conditional altogether.\n\
    \nConsider the reverse case:\n\n```\nx = 5;\nif(x == 5)\n{\n  //loop body\n}\n\
    ```\n\nIn this case, the optimizing compiler would notice that the IF conditional\
    \ will always be true, and it won't even bother writing code to test x.\n\n###\
    \ 23.2.2 Control Flow Optimizations\n\nAnother set of optimization which can be\
    \ performed either at the intermediate or the code generation level are control\
    \ flow optimizations. Most of these optimizations deal with the elimination of\
    \ useless branches. Consider the following code:\n\n```\nif (A)\n{\n    if (B)\n\
    \    {\n        C;\n    } else\n{\n        D;\n    }\n} else\n{\n    E;\n}\nend_A;\n\
    ```\n\nIn this code, a simplistic compiler would generate a jump from the C block\
    \ to end_B, and then another jump from end_B to end_A (to get the E statements).\
    \ Clearly jumping to a jump is inefficient, so optimizing compilers will generate\
    \ a direct jump from block C to end_A.\n\nThis unfortunately will make the code\
    \ more confused and will prevent a nice recovery of the original code. For complex\
    \ functions, it's possible that one will have to consider the code made of only\
    \ if()-goto; sequences, without being able to identify higher level statements\
    \ like if-else or loops.\n\nThe process of identifying high level statement hierarchies\
    \ is called 'code structuring'.\n\n### 23.2.3 Code Generation Optimizations\n\n\
    Once the compiler has sifted through all the logical inefficiencies in your code,\
    \ the code generator takes over. Often the code generator will replace certain\
    \ slow machine instructions with faster machine instructions.\n\nFor instance,\
    \ the instruction:\n\n```\nbeginning:\n...\nloopnz beginning\n```\n\noperates\
    \ much slower than the equivalent instruction set:\n\n```\nbeginning:\n...\ndec\
    \ ecz\njne beginning\n```\n\n147\n\nSo then would a compiler ever use a loopxx\
    \ instruction? The answer is that most optimizing compilers never use loopxx,\
    \ and therefore as a it makes more sense to use the following instruction:\n\n\
    ```\nmov eax, 0\n```\n\nWhat about the instruction:\n\n```\nxor eax\n```\n\n147\n\
    \n```\nmov eax,0\n```\n"
