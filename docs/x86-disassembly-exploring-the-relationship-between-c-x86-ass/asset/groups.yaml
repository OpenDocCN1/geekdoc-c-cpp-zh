  - "[PAGE 72]\n\n# # 9 Functions and Stack Frames\n\n# ## 9.1 Functions and Stack\
    \ Frames\n\nTo allow for many unknowns in the execution environment, functions\
    \ are frequently set up with a 'stack frame' to allow access to both function\
    \ parameters, and automatic function variables. The idea behind a stack frame\
    \ is that each subroutine can act independently of its location on the stack,\
    \ and each subroutine can act as if it is the top of the stack.\n\nWhen a function\
    \ is called, a new stack frame is created at the current esp location. A stack\
    \ frame acts like a partition on the stack. All items from previous functions\
    \ are higher up on the stack, Each current function has the remainder of the stack,\
    \ from the stack frame until the end of the stack page. The current function always\
    \ has access to the 'top' of the stack, and so functions do not need to take account\
    \ of the memory usage of other functions or programs.\n\n# ## 9.2 Standard Entry\
    \ Sequence\n\n| This code example uses MASM Syntax |\n\nFor many compilers, the\
    \ standard function entry sequence is the following piece of code (X is the total\
    \ size, in bytes, of all automatic variables used in function):\n\n```\npush ebp\n\
    mov ebp, esp\nsub esp, X\n```\n\nFor example, here is a C function code fragment\
    \ and the resulting assembly instructions:\n\n```\nvoid MyFunction() {\n    int\
    \ a, b, c;\n}\n\nMyFunction:\n    push ebp          ; save the value of ebp\n\
    \    mov ebp, esp      ; ebp now points to the top of the stack\n    sub esp,\
    \ 12       ; space allocated on the stack for the local variables\n```\n\nThis\
    \ means local variables can be accessed by referencing ebp. Consider the following\
    \ C code fragment and corresponding assembly code:\n\n```\na = 10;\n```"
