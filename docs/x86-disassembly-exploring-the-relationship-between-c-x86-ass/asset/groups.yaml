    C 编译器直接将 C 和 C++ 源代码编译为机器码。而 GCC 则是将 C 和 C++ 转换为汇编语言，然后使用汇编器将其转换为相应的机器码。从反汇编器的角度来看，它发现无法精确地还原出最初创建可执行文件时所使用的
    C 或 C++ 代码。然而，可以创建出与原代码编译结果完全相同、或者执行相同任务的代码。


    C 语言语句与汇编语言之间并不是一一对应的关系。请考虑以下语句通常会编译成相同的汇编代码：


    ```

    *arrayA = arrayB[x];

    *arrayA = arrayB[x];

    arrayA[0] = arrayB[x];


    arrayA(0) = arrayB[x];

    ```


    此外，考虑以下循环是如何执行相同任务的，并且它们可能会产生相似甚至相同的汇编代码：


    ```

    for(;;) { ... }

    while(i) { ... }

    do { ... } while(i);

    ```


    ## 1.7 常见的 C/C++ 编译器


    本节的目的是列出用于生产级软件开发的最常用的 C 和 C++ 编译器。世界上有很多 C 编译器，但逆向工程人员不需要考虑所有情况，特别是在查看专业软件时。本页将讨论每个编译器的优缺点（下载站点或成本信息），还将讨论如何从每种编译器生成汇编列表文件。


    ### 1.7.1 微软 C 编译器


    微软 C 编译器由微软作为 Windows Server 2003 SDK 的一部分免费提供。它与 MS Visual Studio 中使用的编译器和库是同一个，但不带华丽的
    IDE。MS C 编译器拥有非常出色的优化引擎。它可以编译 C 和 C++，并可以选择将 C++ 代码编译为 MSIL（.NET 字节码）。


    微软的编译器仅支持 Windows 系统以及与 Intel 兼容的 16/32/64 位架构。


    > http://en.wikibooks.org/wiki/C%2B%2B%20Programming%2FProgramming%20Languages%2FC%2B%2B%2B%2BCode%2F%2FCompiler


