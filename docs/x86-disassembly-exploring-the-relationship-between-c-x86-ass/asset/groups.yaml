    ddd


    The Data Display Debugger. It''s another front-end to gdb. This provides graphical
    representations of data structures. For example, a linked list will look just
    like a textbook illustration.


    strace, ltrace, and xtrace


    Lets you run a program while watching the actions it performs. With strace, you
    get a log of all the system calls being made. With ltrace, you get a log of all
    the library calls being made. With xtrace, you get a log of some of the function
    calls made.


    valgrind


    Executes a program under emulation, performing analysis according to one of the
    many plug-in modules as desired. You can write your plug-in module as desired.
    Newer versions of valgrind also support OS X.


    # NLKD


    A kernel debugger.


