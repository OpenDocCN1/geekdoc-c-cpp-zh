    \ 0x00200008 处有一个值为 3 的整数，代表 'c'。\n\n然而，编译器通常需要将变量分离为字（2 字节）倍数的组，即字符数组；某些未使用位可能会填充变量以满足此大小要求。如图\
    \ 2 所示。\n\nA:\n\n```cpp\nclass ABC123{\npublic:\n    int a;\n    char b[3];\n\
    \    double c;\n\n    ABC123():a(1),c(3) { strcpy(b,\"02\"); };};\n```\n\nB:\n\
