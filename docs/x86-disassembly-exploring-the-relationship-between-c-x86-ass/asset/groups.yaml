  md: "\n# Structures\n\nSince most times an array is accessed through a computed\
    \ index, not through a constant, the compiler will likely use the following to\
    \ access an element of the array:\n\n```\nmov [ebx + eax], 0x00\n```\n\nIf the\
    \ array holds elements larger than 1 byte (for char), the index will need to be\
    \ multiplied by the size of the element, yielding code similar to the following:\n\
    \n```\nmov [ebx + eax * 4], 0x01223344  # access to an array of DWORDs,\ne.g.\
    \   arr[i] = 0x01223344\n...\n                                     # access to\
    \ an array of structs,\nmul eax, 20\neach 20 bytes long\nlea edi, [ebx + eax]\
    \                  # e.g.      ptr = &arr[i]\n```\n\nThis pattern can be used\
    \ to distinguish between accesses to arrays and accesses to structure data members.\n\
    \n## 19.3 Structures\n\nAll C programmers are going to be familiar with the following\
    \ syntax:\n\n```\nstruct MyStruct{\n    int FirstVar;\n    double SecondVar;\n\
    \    unsigned short int ThirdVar;\n}\n```\n\nIt's called a structure (Pascal programmers\
    \ may know a similar concept as a 'record').\n\nStructures may be very big or\
    \ very small, and they may be quite small... fields are often 4-byte aligned (not\
    \ sequential), and each element in a structure has its own offset. It therefore\
    \ makes no sense to reference a structure element by a variable offset from the\
    \ base.\n\nTake a look at the following structure definition:\n\n```\nstruct MyStruct2{\n\
    \    long value1;\n    short value2;\n    long value3;\n}\n```\n\nAssuming the\
    \ pointer to the base of this structure is loaded into ebx, we can access members\
    \ in one of two schemes:\n\n# Data Structures\n\n| :data is 32-bit aligned | :data\
    \ is \"packed\" |\n| :--- | :--- |\n| [ebx + 0] | :value1 |\n| [ebx + 4] | :value2\
    \ |\n| [ebx + 8] | :value3 |\n\nThe first argument is the most common, but it\
    \ clearly leaves an entire memory word (2 bytes) at offset +6, which is not used\
    \ at all. Compilers occasionally allow the programmer to manually specify the\
    \ offset of each data member, but this isn't always the case. The second example\
    \ also has the benefit that the reverser can easily identify that each data member\
    \ in the structure is a different size.\n\nConsider now the following function:\n\
    \n```\n:MyFunction\npush ebp\nmov ebp, esp\nlea ecx, ss:[ebp + 8]\nmov [ecx +\
    \ 0], ecx\nmov [ecx + 4], 0x0000000A\nmov esp, ebp\npop ebp\nret\n```\n\nThe function\
    \ clearly takes a pointer to a data structure as its first argument. Also, how\
    \ can we tell if this is an array or a structure? To answer your question, we\
    \ need to remember one important distinction between structures and arrays: the\
    \ elements in an array are all of the same type, the elements in a structure do\
    \ not need to be the same type. Given that rule, it is clear that one of the elements\
    \ in this structure is a pointer (it points to the base of the structure itself!)\
    \ and the other two fields are loaded with the hex value 0x9A (16 in decimal),\
    \ which is certainly not a valid pointer on any system I have ever used. We can\
    \ then partially recreate the structure and the function code:\n\n```\nstruct\
    \ MyStruct {\nlong value1;\nvoid value2;\nlong value3;\n}\n\nvoid MyFunction2(struct\
    \ MyStruct *ptr) {\nptr->value1 = 10;\nptr->value2 = ptr;\nptr->value3 = 10;\n\
    }\n```\n\nAs a quick aside note, notice that this function doesn't load anything\
    \ into eax, and therefore it doesn't return a value.\n\n## 19.4 Advanced Structures\n\
    \nLets say we have the following situation in a function:\n\n```\n:MyFunction1\n\
    push ebp\nmov esp, esp\nmov esi, [ebp + 8]\nlea ecx, [esi + 8]\n```\n\nwhat is\
    \ happening here? First, esi is loaded with the value of the function's first\
    \ parameter (ebp + 8). Then, ecx is loaded with a pointer to the offset +8 from\
    \ esi. It looks like we have 2 pointers accessing the same data structure!\n\n\
    The function in question could easily be one of the 2 prototypes:\n\n```\nstruct\
    \ MyStruct1\n{\nDWORD value1;\nDWORD value2;\nstruct MySubStruct1\n{\n...\n}\n\
    \nstruct MyStruct2\n{\nDWORD value1;\nDWORD value2;\nDWORD array[LENGTH];\n...\n\
    ```\n\none pointer from another pointer in a structure often means a complex data\
    \ structure. There are far too many combinations of structures and arrays, however,\
    \ so this wikibook spend too much time on this subject.\n\n## 19.5 Identifying\
    \ Structures and Arrays\n\nArray elements and structure are both accessed as offsets\
    \ from the array/structure pointer. When disassembling, how do we tell these data\
    \ structures apart? Here are some pointers:\n\n- 1. Array elements are not to\
    \ be accessed individually. Array elements are typically accessed using a variable\
    \ offset\n- 2. Arrays are frequently accessed in a loop. Because arrays typically\
    \ hold a series of similar data items, the best way to access them all is a loop.\
    \ Specifically, for(x = 0; x < length_of_array; x++) style loops are often used\
    \ to access arrays, although there could be others.\n- 3. All the elements in\
    \ an array have the same data type.\n- 4. Struct fields are typically accessed\
    \ using constant offsets.\n- 5. Struct fields are typically not accessed in order,\
    \ and are also not using loops.\n- 6. Struct fields are not typically all the\
    \ same data type or width.\n\n## 19.6 Linked Lists and Binary Trees\n\nTwo common\
    \ structures used when programming are linked lists and binary trees. These two\
    \ structures in turn can be made more complicated in a number of ways. Shown in\
    \ the images below are examples of a linked list structure and a binary tree.\
    \ (img/9b6491f47eec80c9bc0123790141_0.png) Figure 1\n\nEach node in a linked list\
    \ or a binary tree contains some amount of data, and a pointer (pointers) to other\
    \ nodes. Consider the following asm code:\n\n```\nloop_top:\ncmp [ebp + 0], 10\n\
    je loop_end\nmov ebp, [ebp + 4]\njmp loop_top\nloop_end:\n```\n\nAt each loop\
    \ iteration, a data value at [ebp + 0] is compared with 10. If the two are equal,\
    \ the loop is ended. however, the pointer in ebp is updated with a pointer at\
    \ an offset from ebp, and the loop is continued. This is a classic linked-list\
    \ search technique. This is analogous to the following C code:\n\n```\nstruct\
    \ node\n{\nint data;\nstruct node *next;\n};\n\nstruct node *x;\n\nwhile(x->data\
    \ != 10)\n{\n x = x->next;\n}\n```\n\nBinary trees are the same, except two different\
    \ pointers used (the right and left branch).\n\n## 20 Objects and Classes\n\n\
