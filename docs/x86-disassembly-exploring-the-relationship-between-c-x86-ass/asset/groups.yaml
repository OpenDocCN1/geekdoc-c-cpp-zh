    \ ForwarderChain member of the import descriptor. The value of \"ForwarderChain\"\
    \ is an\n\n50\n"
  mdcn: "\n\n## 5.7 导入与导出 - 模块间的链接\n\n### 5.7.1 什么是链接？\n\n每当开发者编写程序时，通常预期已经实现了许多子程序和函数，这避免了作者编写更多代码或处理复杂数据结构的烦恼。相反，编码员只需要对子程序声明一次调用，然后由链接器决定接下来的操作。\n\
    \n链接有两种类型，可以使用：静态链接和动态链接。这种预编译代码可以插入到最终的可执行文件中以实现功能，为程序员节省大量时间。相比之下，动态链接允许子程序保留在不同的文件（或模块）中，由操作系统在运行时加载。这被称为“动态链接库”，或\
    \ DLL ，它是包含一组可以导出的函数或值的模块。这与可执行文件不同，可执行文件是从库导入内容来实现其功能。从这里开始，“模块”（module）是指任何\
    \ PE 格式的文件，而“库”（Library）是指任何导出和导入函数及值的模块。\n\n- 动态链接具有以下优点：\n- 如果有多个可执行文件链接到该库模块，它可以节省空间\n\
    - 允许立即更新程序，而无需为所有应用程序提供新的可执行文件\n- 可以通过将库的代码映射到多个进程来节省内存空间\n- 增加了实现的抽象性。可以修改实现操作的方法，而无需重新编写应用程序。这对于操作系统的向后兼容非常有用。\n\
    \n本节讨论了如何使用 PE 文件格式实现这一点。此时需要注意的一个重要点是，模块之间可以导入或导出任何内容，包括变量以及子程序。\n\n### 5.7.2\
    \ 加载\n\n动态链接模块的缺点是在运行时，初始化可执行文件的软件必须将这些模块链接在一起。由于各种原因，在这里你声明“此动态库中的函数将始终存在于内存中”。如果内存地址无效或库已更新，该函数将不再存在那里，尝试使用它的应用程序将会崩溃。相反，每个模块（库或可执行文件）必须声明向其他模块导出哪些函数或值，以及它希望从其他模块导入什么。\n\
    \n如上所述，模块不能声明它期望函数或值位于内存的哪个位置。相反，它声明在自己的内存中哪个位置找到它想要导入的值的指针。这允许模块访问内存中出现的任何导入值，无论它出现在何处。\n\
    \n## 5.8 导出\n\n导出是一个模块中的用于与其他模块共享的函数和值。这是通过使用“导出目录”（Export Directory）实现的，该目录用于翻译导出名称（或“序数”，见下文）以及查找代码或数据的内存位置。导出目录的起始由资源目录中的\
    \ IMAGE_DIRECTORY_ENTRY 条目标识。所有导出数据必须存在于同一个节中。该目录由以下结构引导：\n\n```struct\nstruct\
    \ IMAGE_EXPORT_DIRECTORY {\n    long Characteristics;\n    long TimeStamp;\n \
    \   short MajorVersion;\n    short MinorVersion;\n    long Name;\n    long Base;\n\
    \    long NumberOfFunctions;\n    long *AddressOfFunctions;\n    long *AddressOfNames;\n\
    \    long *AddressOfOrdinals;\n}\n```\n\n`Characteristics` 值通常未使用，TimeStamp 描述导出生成的时间，`MajorVersion`\
    \ 和 `MinorVersion` 描述目录的版本细节，但它们的性质未定义。这些值对实际导出本身几乎没有或没有影响。`Name` 值是一个指向零终止 ASCII\
    \ 字符串的 RVA，即该库名称或模块的名称。\n\n### 名称与序数\n\n每个导出都有名称和“序数”（一种索引）。实际的导出通过 `AddressOfFunctions`\
    \ 描述，它是一个指向 RVA 数组的 RVA，每个 RVA 指向要导出的函数或值。该数组的大小由 `NumberOfFunctions` 值决定。这些函数每个都有一个序数。`Base`\
    \ 值用作第一个导出的序数，数组中的下一个 RVA 是 `Base+1`，依此类推。\n\n`AddressOfFunctions` 中的每个条目通过名称识别，通过\
    \ RVA `AddressOfNames` 找到。`AddressOfNames` 指向的数据是一个 RVA 数组，每个 RVA 指向一个零终止 ASCII\
    \ 字符串，每个字符串都是导出的名称。还有一个由 `AddressName` 中的 RVA 指向的第二个数组。（注：原文此处存在大量重复的占位符文本，已按逻辑处理）\n\
    \n## 转发 (Forwarding)\n\n（原文此处存在大量重复的占位符文本，已按逻辑处理）\n\n## 5.9 导入\n\n### 5.9.1 导入\n\
    \n## Windows 可执行文件\n\n（原文此处存在大量重复的占位符文本，已按逻辑处理）\n\n### 5.9.2 运行时导入\n\n在运行时使用上述导入目录，加载器找到相应的模块，将其加载到内存中，寻找正确的导出。然而，为了使用该导出，必须在导入模块的某处存储指针。这就是为什么有两个并行的数组\
    \ `OriginalThunk` 和 `FirstThunk`，用于识别 `IMAGE_BY_NAME` 结构。一旦解析了导入值，其指针将存储在 `FirstThunk`\
    \ 数组中。随后它可以在运行时用于访问值。\n\n### 5.9.3 绑定导入\n\nPE 格式还支持一种被称为“绑定”（binding）的特殊功能。在加载和解析导入地址的过程中可能会非常耗时，在某些情况下需要避免。如果开发者非常确定某个库不会被更新或更改，那么导入值在内存中的地址在每次加载应用程序时都不会改变。因此，可以在运行时计算导入并存储在\
    \ `FirstThunk` 数组中，允许加载器跳过解析导入——导入被绑定到某个特定的内存位置。然而，如果模块之间的版本号过期，或者导入的库需要重定位，加载器将假设绑定地址是无效的并解析导入。\n\
    \n模块导入目录条目的 `Timestamp` 成员控制绑定；如果设置为 0，则导入不绑定。如果是非零，则绑定到另一个模块。然而，导入表中的 `Timestamp`\
    \ 必须与模块头中的 `Timestamp` 匹配，否则绑定值将被加载器丢弃。\n\n## 转发与绑定\n\n如果绑定的库/模块将其导出转发到另一个模块，绑定可能会成为问题。在这些情况下，非转发的导入可以绑定，但被转发的值必须被识别，以便加载器可以解析它们。这是通过导入描述符的\
    \ `ForwarderChain` 成员实现的。`ForwarderChain` 的值是一个\n\n50\n\n"
