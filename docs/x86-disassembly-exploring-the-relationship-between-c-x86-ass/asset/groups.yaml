    # # 3 Analysis Tools


    # ## 3.1 Debuggers


    debugger¹ Debuggers are programs that allow the user to execute a compiled program
    one step at a time. You can see what instructions are executed in which order,
    and which sections of the program are treated as code and which are treated as
    data. Debuggers often allow you to analyze the program while it is running, helping
    you get a better picture of what it is doing.


    Advanced debuggers often contain at least a rudimentary disassembler, often times
    hex editing and reassembly features. Debuggers often allow the user to set breakpoints
    on instructions, function calls, and even memory locations.


    A breakpoint is an instruction to the debugger that allows program execution to
    be halted when a certain condition is met. For instance, when a program accesses
    a certain variable, or calls a certain API function, the debugger can pause program
    execution.


    # ### 3.1.1 Windows Debuggers


    w:SoftICE


    SoftICE


    De facto standard for Windows debugging. SoftICE can be used for local kernel
    debugging, which is a feature that is very rare, and very valuable. SoftICE was
    taken off the market in April 2006.


    w:WinDbg


    WinDbg


    WinDbg is a free piece of software from Microsoft that can be used for user-mode
    debugging, or even remote kernel-mode debugging. WinDbg is not the same as the
    better-known Visual Studio Debugger, but comes with a nifty GUI nonetheless. Available
    in 32 and 64-bit versions.


    http://www.microsoft.com/whc/devtools/debugging/installx86.mspx


    IDA Pro


    The multi-processor, multi-OS, interactive disassembler by DataRescue.


    +   1 http://en.wikipedia.org/wiki/debugger

    2 http://en.wikipedia.org/wiki/SoftICE

    3 http://en.wikipedia.org/wiki/WinDbg'
