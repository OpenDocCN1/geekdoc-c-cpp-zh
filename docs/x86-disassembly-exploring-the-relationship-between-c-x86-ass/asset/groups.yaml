    \ afterwards tests the value of eax to ensure that it is a nonzero. because eax\
    \ will always be nonzero (eax = 1) at this point, the conditional jump can be\
    \ removed along with the 'mov' and the 'test'.\n\nThe assembly is actually checking\
    \ whether 1 equals 1. Another fact is, that the C code for an infinite FOR loop:\n\
    \n```\nfor( ; ; )\n{\n...\n```\n\n## 24.3 Example: Trace Variables\n\nHere are\
