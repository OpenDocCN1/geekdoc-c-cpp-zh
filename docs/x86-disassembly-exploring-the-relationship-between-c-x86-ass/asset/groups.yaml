  mdcn: "\n\n# 结构\n\n由于大多数情况下数组是通过计算出的索引而非常量来访问的，编译器可能会使用以下方式来访问数组元素：\n\n```\nmov\
    \ [ebx + eax], 0x00\n```\n\n如果数组存储的元素大于 1 字节（例如 char），则索引需要乘以元素的大小，从而产生类似于下方的代码：\n\
    \n```\nmov [ebx + eax * 4], 0x01223344  # 访问 DWORD 数组，\ne.g.   arr[i] = 0x01223344\n\
    ...\n                                     # 访问结构体数组，\nmul eax, 20\n每个长度 20 字节\n\
    lea edi, [ebx + eax]                  # e.g.      ptr = &arr[i]\n```\n\n这种模式可以用于区分数组访问和结构体数据成员的访问。\n\
    \n## 19.3 结构\n\n所有的 C 语言程序员都会熟悉以下语法：\n\n```\nstruct MyStruct{\n    int FirstVar;\n\
    \    double SecondVar;\n    unsigned short int ThirdVar;\n}\n```\n\n它被称为结构体（Pascal\
    \ 程序员可能熟悉类似的概念，称为“record”）。\n\n结构体可能很大，也可以很小，而且……字段通常是 4 字节对齐的（不是连续的），结构体中的每个元素都有自己的偏移量。因此，通过相对于基的变量偏移来引用结构体元素是没有意义的。\n\
    \n看看下面的结构体定义：\n\n```\nstruct MyStruct2{\n    long value1;\n    short value2;\n\
    \    long value3;\n}\n```\n\n假设指向此结构体基的指针加载到 ebx 中，我们可以通过两种方案之一访问成员：\n\n# 数据结构\n\
    \n| 数据是 32 位对齐 | 数据是“紧凑的” |\n| :--- | :--- |\n| [ebx + 0] | :value1 |\n| [ebx\
    \ + 4] | :value2 |\n| [ebx + 8] | :value3 |\n\n第一个参数是最常见的，但它显然在偏移量 +6 处留了一个整个内存字（2\
    \ 字节），该部分完全没有被使用。编译器偶尔允许程序员手动指定每个数据成员的偏移量，但并不总是如此。第二个示例的优点在于，逆向工程师可以轻松识别出结构体中的每个数据成员的大小是不同的。\n\
    \n现在考虑以下函数：\n\n```\n:MyFunction\npush ebp\nmov ebp, esp\nlea ecx, ss:[ebp + 8]\n\
    mov [ecx + 0], ecx\nmov [ecx + 4], 0x0000000A\nmov esp, ebp\npop ebp\nret\n```\n\
    \n该函数显然将一个数据结构体的指针作为第一个参数。此外，我们如何判断它是数组还是结构体呢？为了回答这个问题，我们需要记住结构体和数组的一个重要区别：数组中的元素都是相同类型，而结构体中的元素不需要是相同类型。根据这条规则，很明显该结构体中的一个元素是指针（它指向结构体自身的基），而另外两个字段加载了十六进制值\
    \ 0x9A（十进制为 16），这在我用过的任何系统上绝对不是一个有效的指针。我们可以部分重建结构体和函数代码：\n\n```\nstruct MyStruct\
    \ {\nlong value1;\nvoid value2;\nlong value3;\n}\n\nvoid MyFunction2(struct MyStruct\
    \ *ptr) {\nptr->value1 = 10;\nptr->value2 = ptr;\nptr->value3 = 10;\n}\n```\n\n\
    顺便提一下，注意此函数没有将任何内容加载到 eax 中，因此它没有返回值。\n\n## 19.4 高级结构\n\n假设我们在函数中遇到以下情况：\n\n```\n\
    :MyFunction1\npush ebp\nmov esp, esp\nmov esi, [ebp + 8]\nlea ecx, [esi + 8]\n\
    ```\n\n这里发生了什么？首先，esi 加载了函数第一个参数的值（ebp + 8）。然后，ecx 加载了指向 esi 偏移量 +8 处的指针。看起来我们有两个指针在访问同一个数据结构！\n\
    \n该函数很可能是以下 2 种原型之一：\n\n```\nstruct MyStruct1\n{\nDWORD value1;\nDWORD value2;\n\
    struct MySubStruct1\n{\n...\n}\n\nstruct MyStruct2\n{\nDWORD value1;\nDWORD value2;\n\
    DWORD array[LENGTH];\n...\n```\n\n结构体中的指针指向另一个指针通常意味着复杂的数据结构。然而，结构体和数组的组合太多了，所以这本电子书不会在这个主题上花费太多时间。\n\
    \n## 19.5 识别结构和数组\n\n数组元素和结构体都是通过相对于数组/结构体指针的偏移来访问的。在反汇编时，我们如何区分这些数据结构？这里是一些提示：\n\
    \n- 1. 数组元素不被逐个访问。数组元素通常使用变量偏移量进行访问。\n- 2. 数组经常在循环中被访问。因为数组通常包含一系列相似的数据项，访问它们的所有最佳方法是循环。具体而言，for(x\
    \ = 0; x < length_of_array; x++) 风格的循环常用于访问数组，尽管也可以其他方式。\n- 3. 数组中的所有元素具有相同类型。\n\
    - 4. 结构体字段通常使用常量偏移量访问。\n- 5. 结构体字段通常不是顺序访问的，也不使用循环。\n- 6. 结构体字段通常不是相同类型或宽度。\n\n\
    ## 19.6 链表和二叉树\n\n编程时常用的两种常用结构是链表和二叉树。这两种结构反过来可以通过许多方式变得复杂。图中所示是链表结构和二叉树的示例（img/9b641f47ec80cbc0123790141_0.png）。\n\
    \n链表或二叉树中的每个节点包含一些数据和一个指向其他节点的指针。考虑以下汇编代码：\n\n```asm\nloop_top:\ncmp [ebp + 0],\
    \ 10\nje loop_end\nmov ebp, [ebp + 4]\njmp loop_top\nloop_end:\n```\n\n在每次循环中，将\
    \ [ebp + 0] 处的值与 10 进行比较。如果相等，循环结束。否则，ebp 被更新为偏移量处的指针，循环继续。这是一种经典的链表搜索技术。这类似于下面的\
    \ C 代码：\n\n```c\nstruct node\n{\nint data;\nstruct node *next;\n};\n\nstruct node\
    \ *x;\n\nwhile(x->data != 10)\n{\n x = x->next;\n}\n```\n\n二叉树也一样，使用了两个不同的指针（左分支和右分支）。\n\
    \n## 20 对象和类\n\n### 20.1 对象对象\n\n面向对象（OO）编程提供了一个新的单元：本章将直接处理 C++ 的汇编类。\n\n###\
    \ 20.2 类\n\n一个基础类可以拆分为两个部分：变量和方法。非静态变量被放入对象中，而方法像其他函数一样被编译和调用。当你开始添加继承和多态时，情况会变得复杂。\n\
    \n### 20.2.1 变量\n\n类中定义的所有静态变量在整个应用程序期间位于内存的静态区域。当构造函数被调用时，变量被放入名为“对象”的数据结构中，见图\
    \ 1。\n\nA:\n\n```cpp\nclass ABC123 {\npublic:\n    int a, b, c;\n    ABC123():a(1),\
    \ b(2), c(3) {};\n};\n```\n\nB:\n\n| | | |\n| :--- | :--- | :--- |\n| 0x00200000\
    \ | dd | 1 ;int a ; offset = abc123 |\n| 0x00200004 | dd | 2 ; int b |\n| 0x00200008\
