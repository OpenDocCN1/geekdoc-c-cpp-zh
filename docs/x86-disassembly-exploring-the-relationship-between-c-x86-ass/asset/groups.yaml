  mdcn: "\n\n## 9 函数与栈帧（Stack Frames）\n\n为了适应执行环境中的许多不确定性，函数通常会设置一个“栈帧”（stack frame），以便访问函数参数和自动局部变量。栈帧的核心思想是：每个子程序都可以独立于其在栈上的位置运行，并且每个子程序都可以表现得就像它位于栈顶端一样。\n\
    \n当函数被调用时，会在当前的 `esp` 位置创建一个新的栈帧。栈帧的作用就像栈上的一个分区。之前函数的所有项都在栈的高处，每个当前函数拥有栈的剩余部分（从栈帧到栈页的结束）。当前函数始终可以访问栈的“顶部”，因此函数不需要考虑其他函数或程序的内存使用情况。\n\
    \n### 9.2 标准入口序列（Standard Entry Sequence）\n\n| 此代码示例使用了 MASM 语法 | \n\n对于许多编译器来说，标准的函数入口序列是以下代码（X\
    \ 是函数中使用的所有自动变量的总大小，以字节为单位）：\n\n```\npush ebp\nmov ebp, esp\nsub esp, X\n```\n\
    \n例如，这里有一个 C 函数片段以及生成的汇编指令：\n\n```c\nvoid MyFunction() {\n    int a, b, c;\n}\n\
    \nMyFunction:\n    push ebp          ; 保存 ebp 的值\n    mov ebp, esp      ; ebp\
    \ 现在指向栈顶\n    sub esp, 12       ; 在栈上为局部变量分配空间\n```\n\n这意味着可以通过引用 `ebp` 来访问局部变量。考虑以下\
    \ C 代码片段和对应的汇编代码：\n\n```c\na = 10;\n```\n\n```c\nb = 5;\nc = 2;\n```\n\n```\n\
    mov [ebp] -4, 10;    ; 变量 a 的位置\nmov [ebp] -8, 5;     ; b 的位置\nmov [ebp] -12,\
    \ 2    ; c 的位置\n```\n\n这些看起来都很好，但 `ebp` 的作用是什么？为什么要保存 `ebp` 的旧值并将其推栈，只为了通过下一条指令改变\
    \ `esp` 的值？答案是*函数参数*。\n\n考虑以下函数声明：\n\n```c\nvoid MyFunction2(int x, int y, int\
    \ z)\n{\n    ...\n}\n```\n\n它产生以下汇编代码：\n\n```\n_MyFunction2:\npush ebp\nmov ebp,\
    \ esp\nsub esp, 0      ; 没有局部变量，大多数编译器会跳过此行\n```\n\n这完全符合预。。那么，`ebp` 究竟做了什么，函数参数存储在哪里？答案在调用函数时就能找到。\n\
    \n考虑以下函数调用：\n\n`MyFunction2(10, 5, 2);`\n\n这将创建以下汇编代码（使用从右到左的调用约定 CDECL，后文会解释）：\n\
    \n```\npush 2\npush 5\npush 10\ncall _MyFunction2\n```\n\n**注意：** 记住 x86 的 `call`\
    \ 指令基本上等同于\n\n```\npush ebp + 2    ; 返回地址 + 两个条指令的大小\njmp _MyFunction2\n```\n\n\
    事实证明，函数参数都在栈上！因此，当我们把栈指针（`esp`）的值移动到 `ebp` 时，我们让 `ebp` 直接指向函数参数。当函数推入和弹出值时，`ebp`\
    \ 不受 `esp` 的影响。记住推入（push）操作基本上是这样的：\n\n```\nsub esp, 4      ; 为新的栈项“分配”空间\nmov\
    \ [esp], X    ; 放入新栈项的值 X\n```\n\n这意味着返回地址以及 `ebp` 的旧值被放在栈上。因此，`[ebp]` 指向 `ebp`\
    \ 旧值的位置，`[ebp + 4]` 指向返回地址，`[ebp + 8]` 指向第一个函数参数。以下是此时栈的（粗略表示）：\n\n| | |\n|---|---||\n\
    | 2 | [ebp + 16] (第3个函数参数) |\n| 5 | [ebp + 12] (第2个参数) |\n| 10 | [ebp - 8] (第1个参数)\
    \ |\n| RA | [ebp + 4] (返回地址) |\n| FP | [ebp] (旧 ebp 值) |\n| | [ebp - 4] (局部变量列表)|\n\
    \n栈指针在当前函数的执行期间可能会发生变化。这种情况发生在：\n\n- * 参数被传递到另一个函数中；\n- 使用了伪函数 `alloca()`。\n\n\
