    local variables are created and used in a very similar, if not the exact same,
    manner as global values. In fact, as far as the reverser is concerned, they are
    usually interchangeable. Remember, the only real difference between static variables
    and global variables is the idea of ''scope'', which is only used by the compiler.


    # 17.5 Signed and Unsigned Variables


    Integer formatted variables, such as int, char, short and long may be declared
    or unsigned variables in the C source code. There are two differences in how variables
    are treated:


    +   - Signed variables use instructions such as add, sub. Unsigned variables use
