    \ imported values will not change each time the application is loaded. So, the\
    \ import can be computed and stored in the FirstThunk array before runtime, allowing\
    \ the loader to skip resolving the imports - the imports are 'bound' to a particular\
    \ memory location. However, if the versions numbers between modules do out of\
    \ date, or the imported library needs to be relocated, the loader will assume\
    \ the bound addresses are invalid, and resolve the imports.\n\nThe Timestamp member\
    \ of the import directory entry for a module controls binding; if it is set to\
    \ zero, the import is not bound. If it is non-zero, then it is bound to another\
    \ module. However, the Timestamp in the import table must match the Timestamp\
    \ in the module's Header, otherwise the bound values will be discarded by the\
    \ loader.\n\n## Forwarding and binding\n\nBinding can of course be a problem if\
    \ the bound library / module forwards its exports to another module. In these\
