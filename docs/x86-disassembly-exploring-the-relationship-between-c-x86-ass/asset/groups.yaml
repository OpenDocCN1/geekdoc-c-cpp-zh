    # # 25 Code Obfuscation


    # ## 25.1 Code Obfuscation


    **Code Obfuscation** is the act of making the assembly code or machine code of
    a program more difficult to disassemble or decompile. The term ''obfuscation''
    is typically used to suggest a deliberate attempt to add difficulty, but many
    other practices will cause code to be obfuscated without being the intention.
    Software vendors may attempt to obfuscate or even encrypt code to prevent reverse
    engineering efforts. There are many different types of obfuscations. Notice that
    many code optimizations (discussed in the previous chapter) have the side-effect
    of making code more difficult to read, and therefore optimizations act as obfuscations.


    # ## 25.2 What is Code Obfuscation?


    There are many things that obfuscation could be:


    +   - Encrypted code that is decrypted prior to runtime.

    - Compressed code that is decompressed prior to runtime.

    - Executables that contain Encrypted sections, and a simple decryptor.

    - Code instructions that are put in a hard-to-read order.

    - Code instructions which are used in a non-obvious way.


    This chapter will try to examine some common methods of obfuscating code, but
    will not necessarily delve into methods to break the obfuscation.


    # ## 25.3 Interleaving


    Optimizing Compilers will engage in a process called **interleaving** to try and
    maximize parallelism in pipined processors. This technique is based on two premises:


    +   - 1. That certain instructions can be executed out of order and maintain the
    correct output

    - 2. That processors can perform certain pairs of tasks simultaneously.


    # ### 25.3.1 x86 NetBurst Architecture


    The Intel **NetBurst Architecture** divides an x86 processor into 2 distinct parts:
    the supporting hardware, and the primitive core processor. The primitive core
    of a processor'
  - '[PAGE 173]


    contains the ability to perform some calculations blindly fast, but not the instructions
    that you or I am familiar with. The processor converts the code instructions into
    a form called “micro-ops” that are then handled by the primitive core processor.


    The processor can also be broken into into4 components, or modules, each of which
    is capable of performing tasks. Since each module can operate separately, up to
    4 separate tasks can be handled *simultaneously* by the processor core, so long
    as those tasks can be performed by each of the 4 modules:


    # Port0


    Double-speed integer arithmetic, floating point load, memory store


    # Port1


    Double-speed integer arithmetic, floating point arithmetic arithmetic


    # Port2


    memory read


    # Port3


    memory write (writes to address bus)


    So for instance, the processor can simultaneously perform 2 integer arithmetic
    instructions in both Port0 and Port1, a compiler will frequently go to great lengths
    to put arithmetic instructions close to each other. If the timing is just right,
    up to 4 arithmetic instructions can be executed in a single instruction period.


    Notice how writing to memory is particularly slow (requiring the address to be
    written by Port3, and the data itself to be written by Port0). Floating point
    numbers need to be loaded to the FPU before they can be operated on, so a floating
    point load and a floating point arithmetic instruction cannot operate on a single
    value in a single instruction cycle. Therefore, it is not uncommon to see floating
    point values loaded, integer values are manipulated, and then the floating point
    value being operated on.


    # 25.4 Non-Intuitive Instructions


    Optimizing compilers frequently use instructions that are not intuitive. Some
    instructions can perform tasks for which they were not designed, typically as
    a side effect. Sometimes, one instruction can perform a task more quickly than
    other specialized instructions


    The only way to know that instruction is faster is to consult the processor documentation.
    However, knowing some of the most common substitutions is very useful to the reverser.


    Here are some examples. The code in the first box operates more quickly than the
    one in the second, but performs exactly the same tasks.


    # Example 1


    Fast'
  - '[PAGE 174]


    ```

    xor eax, eax

    ```


    Slow


    ```

    mov eax, 0

    ```


    # Example 2


    Fast


    ```

    shl eax, 3

    ```


    Slow


    ```

    mul eax, 8

    ```


    Sometimes such transformations could be made to make the analysis more difficult:


    # Example 3


    Fast


    ```

    push $next_instr

    jmp $some_function

    $next_instr:...

    ```


    Slow


    ```

    call $some_function

    ```


    # Example 4


    Fast


    ```

    pop eax

    jmp eax

    ```


    Slow


    ```

    retn

    ```


    # 25.4.1 Common Instruction Substitutions


    lea


    The instruction has the following form:


    ```

    lea dest, (XS):[reg1 + reg2 * x]

    ```


    Where XS is a segment register (SS, DS, CS, etc.), reg1 is the base address, reg2
    is a variable offset, and x is a multiplicative scaling factor. What lea does,
    essentially, is load the memory address being pointed to in the second argument,
    into the first argument. Look at the following example:'
  - '[PAGE 175]


    # Code Obfuscation


    ```

    mov eax, 1

    lea ecx, [eax + 4]

    ```


    Now, what is the value of ecx? The answer is that ecx has the value of (eax +
    4), which is 5. In essence, lea is used to addition and multiplication of a register
    and a constant that is a byte or less (-128 to +127).


    Now, consider:


    ```

    mov eax, 1

    lea ecx, [eax*2]

    ```


    Now, ecx equals 3.


    The difference is that lea is quick (because it only adds a register and a small
    constant), whereas the add and mul instructions are more versatile, slower. lea
    is used for arithmetic in this fashion very frequently, even when compilers are
    not actively optimizing the code.


    ```

    xor

    ```


    The xor instruction performs the bitwise-exclusive-or operation on two operands.
    Consider the following example:


    ```

    mov al, eax

    xor al, al

    ```


    What does this do? Lets''s look at the binary:


    ```

    10100110 ;10100110 = 0xAA

    xor 10100110

    ----------

    00000000

    ```


    The answer is that "xor eax, eax" sets the register to 0. More importantly, however,
    is that it sets eax faster (and the generated code instruction is smaller) than
    an equivalent "mov eax, 0".


    ```

    mov edi, edi

    ```


    On a 64-bit x86 system, this instruction clears the high 32-bits of the rdi register.


    ```

    shl, shr

    ```


    left-shifting, in binary arithmetic, is equivalent to multiplying the operand
    by 2. Right-shifting is also equivalent to division by 2, although the lowest
    bit is dropped. In general, left-shifting by N spaces multiplies the operand by
    2^N, and right-shifting by N spaces is the same as dividing by 2^N. One important
    fact is that resulting number is an integer with no fractional part present. For
    example:


    ```

    mov al, 31 ; 00011111

    shr al, 1 ; 00001111 = 15, not 15.5

    ```


    ```

    xchg

    ```


