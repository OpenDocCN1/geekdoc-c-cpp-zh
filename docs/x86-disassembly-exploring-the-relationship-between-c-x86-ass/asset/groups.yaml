    \ of the function is altered; the division of m and n to produce r is performed\
    \ in this function twice: once at the beginning of the function to initialize,\
    \ and once at the end of the loop. the value of r is tested twice, in the same\
    \ places. The compiler is very liberal with how it assigns storage in the function,\
    \ and readily discards values that are not needed.\n\n## 24.2 Example: Manual\
    \ Optimization\n\nThe following lines of assembly code are not optimized, but\
