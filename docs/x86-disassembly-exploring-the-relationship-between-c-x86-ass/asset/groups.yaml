    # 19.5 Identifying Structures and Arrays


    Array elements and structure are both accessed as offsets from the array/structure
    pointer. When disassembling, how do we tell these data structures apart? Here
    are some pointers:


    +   1. Array elements are not to be accessed individually. Array elements are
    typically accessed using a variable offset

    2. Arrays are frequently accessed in a loop. Because arrays typically hold a series
    of similar data items, the best way to access them all is a loop. Specifically,
    for(x = 0; x < length_of_array; x++) style loops are often used to access arrays,
    although there could be others.

    3. All the elements in an array have the same data type.

    4. Struct fields are typically accessed using constant offsets.

    5. Struct fields are typically not accessed in order, and are also not accessed
    using loops.

    6. Struct fields are not typically all the same data type, or the same data width'
  - "[PAGE 141]\n\n# 19.6 Linked Lists and Binary Trees\n\nTwo common structures used\
    \ when programming are linked lists and binary trees. These two structures in\
    \ turn can be made more complicated in a number of ways. Shown in the images below\
    \ are examples of a linked list structure and a binary tree structure.\n\n![](img/9b6491f497eec80c9bc0146581237790_141_0.png)\n\
    \nFigure 14\n\nFigure 15\n\nEach node in a linked list or a binary tree contains\
    \ some amount of data, and a pointer (pointers) to other nodes. Consider the following\
    \ asm code example:\n\n```\nloop_top:\ncmp [ebp + 0], 10\nje loop_end\nmov ebp,\
    \ [ebp + 4]\njmp loop_top\nloop_end:\n```\n\nAt each loop iteration, a data value\
    \ at [ebp + 0] is compared with the value 10. If the two are equal, the loop is\
    \ ended. If the two are not equal, however, the pointer in ebp is updated with\
    \ a pointer at an offset from ebp, and the loop is continued. This is a classic\
    \ linked-loop search technique. This is analogous to the following C code:\n\n\
    ```\nstruct node\n{\nint data;\nstruct node *next;\n};\n\nstruct node *x;\n\n\
