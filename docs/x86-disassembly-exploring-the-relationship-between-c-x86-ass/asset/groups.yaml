    \ whatever you would like to call it). We will lay out a simple class definition,\
    \ that contains a data value at +8. Offset +8 is the only data value accessed,\
    \ so we don't know what the first 8 bytes of data looks like, but we will just\
    \ assume (for our purposes) that our class looks like this:\n\n```\nclass MyClass\n\
    {\n    int value1;\n    int value2;\n    int value3; //offset +8\n\n}\n```\n\n\
    We will then create our function, which I will call *GetValue(). We know that\
    \ the data value being accessed is located at [ecx+8] (which we have defined above\
    \ to be 'value3'). Also, we know that the data is being read into a 4-byte register\
    \ (eax) and is not truncated. We can assume, therefore, that value3 is a 4-byte\
    \ data value. We can use the this pointer as the pointer value stored in ecx,\
    \ and we can take the element that is at offset +8 from that pointer (value3):\n\
    \n```\nMyClass::GetValue()\n{\nreturn this->value3;\n}\n```\n\nThe **this** pointer\
    \ is not necessary here, but i use it anyway to illustrate the fact that the variable\
    \ was accessed as an offset from the **this** pointer.\n\n**Note:** Remember,\
    \ we don't know what the first 8 bytes actually look like in our class, we only\
    \ have a single accessor method, that only accesses a single data value at offset\
    \ +8. The class could also have looked like this:\n\n```\nclass MyClass /*Alternate\
    \ Definition*/\n{\n    byte byte1;\n    byte byte2;\n    short short1;\n    long\
    \ value2;\n    long value3;\n    ...\n}\n```\n\nOr, any other combinations of\
    \ 8 bytes.\n\n## 18.2 Example: Identify C++ Code\n\nCan you tell what the original\
    \ C++ source code looks like, in general, for the following setter method?\n\n\
    ```\npush ebp\nmov ebp, esp\ncmp [ebp + 8], 0\nje error\nmov eax, [ebp + 8]\n\
    mov [ecx + 0], eax\nmov eax, 1\njmp end\n:error:\nmov eax, 0\nend:\nmov esp, ebp\n\
    pop ebp\nret\n```\n\nThis code looks a little complicated, but don't panic! We\
    \ will walk through it slowly.\nThe first two lines of code set up the stack frame:\n\
    \n```\npush ebp\nmov ebp, esp\n```\n\nThe next two lines of code compare the value\
    \ of [ebp+8] (which we know to be the first parameter) to zero. If [ebp+8] is\
    \ zero, the function jumps to the label 'error'. We will see that the label 'error'\
    \ sets eax to 0, and returns. We Haven't seen it before, but this looks conspicuously\
    \ like an if statement. If the parameter is zero, return 'error'.\n\nIf, on the\
    \ other hand, the parameter is not zero, we move the value into eax, and then\
    \ move the value into [ecax+0], which we know as the first data field in MyClass.\
    \ We also see, from this code, that this first data field must be 4 bytes long\
    \ (because we are using eax). After we move eax into [ecax+0], we set eax to 1\
    \ and jump to the end of the function.\n\nIf we use the MyClass definition as\
    \ in question 1, above, we can get the following code for our function, `SetValue(int\
    \ val)`\n\n```\nint MyClass::SetValue(int val)\n{\n  if(val == 0) return 0;\n\
    \  this->value = val;\n  return 1;\n}\n```\n\nNotice that since we are returning\
    \ a 0 on failure, and a 1 on success, the function looks like it has a bool return\
    \ value. However, the return value is 4 bytes wide (eax is used), but the size\
    \ of a bool is implementation-specific, so we can't be sure. The bool is usually\
    \ defined to have a size of 1 byte, but it is often stored the same way as an\
    \ int.\n\n## 19 Data Structures\n\n### 19.1 Data Structures\n\nFew programs can\
    \ work by using simple memory storage; most need to utilize complex data objects,\
    \ including **pointers, arrays, structures**, and other complicated types. This\
    \ chapter will talk about about how compilers implement complex data objects,\
    \ and how the reverser can identify these objects.\n\n### 19.2 Arrays\n\nArrays\
    \ are simply a storage scheme for multiple data objects of the same type. Data\
    \ objects are stored sequentially, often as an offset from a pointer to the beginning\
    \ of the array. Consider the following C code:\n\n```\nx = array[25];\n```\n\n\
    Which is identical to the following asm code:\n\n```\nmov ebx, $array\nmov eax,\
    \ [ebx + 25]\nmov $x, eax\n```\n\nNow, consider the following example:\n\n```\n\
    int MyFunction()\n{\n  int array[20];\n  ...\n}\n```\n\nThis (roughly) translates\
    \ into the following asm-code:\n\n```\n:MyFunction!\npush ebp\nmov esp, esp\n\
    sub esp, 80 ;the array is created on the stack\nlea eax, [esp + 0]\npointer to\
    \ the array is saved in the array\n```\n\nThe entire array is created on the stack,\
    \ and the pointer to the array is saved in the variable. An optimizing compiler\
    \ might just want to offset from esp instead, so you will need to be careful.\n\
    \nLikewise, consider the following example:\n\n```\nvoid MyFunction()\n{\n  char\
    \ buffer[4];\n  ...\n}\n```\n\nThis will translate into the following asm-code:\n\
    \n```\n:_Function2\npush ebp\nmov ebp, esp\nsub esp, 4\nlea buffer, [esp + 0]\n\
    ```\n\nWhich looks harmless enough. But, if a program inadvertently accesses buffer[4]?\
    \ what about buffer[5]? what about buffer[8]? This is the makings of a buffer\
    \ vulnerability, and (might) will be discussed in a later section. However, this\
    \ section won't talk about security issues, and instead focus on data structures.\n\
    \n#### 19.2.1 Spoting an Array on the Stack\n\nTo spot an array on the stack,\
    \ look for large amounts of local storage allocated on the stack ('sub esp, 1000',\
    \ for example), and look for large portions of that data being accessed by an\
    \ offset from a different register from esp. For instance:\n\n```\n:_Function3\n\
    push ebp\nmov ebp, esp\nsub esp, 256\nlea ebx, [esp + 0x00]\nmov [ebx + 0], 0x00\n\
    ```\n\nis a good sign of an array being created on the stack. Granted, an optimizing\
    \ compiler might just want to offset from esp instead, so you will need to be\
    \ careful.\n\n#### 19.2.2 Spoting an Array in Memory\n\nArrays in memory, such\
    \ as global arrays, or arrays which have initial data (remember, initialized data\
    \ is created in the .data section in memory) and will be accessed as offsets from\
    \ a hardcoded address in memory:\n\n```\n:_Function4\npush ebp\nmov ebp, esp\n\
    mov esi, 0x77651004\nmov ebx, 0x00000000\nmov [esi + ebx], 0x00\n```\n"
  mdcn: "\n通过反汇编列表并不总是能够确定给定变量是否为 `volatile` 变量。然而，如果频繁从内存访问该变量，其值在内存中不断更新（特别是当有空寄存器可用时），该变量可能是\
    \ `volatile` 的良好提示。\n\n## 17.10 简单访问器方法 (Accessor Methods)\n\n访问器方法是源自面向对象理论和实践的工具。在最简单的形式下，访问器方法是不接收参数（或可能仅接收偏移量）并返回变量值的函数。访问器（Accessor）和\
    \ `Setter` 方法是限制访问某些变量的方法。获取变量值的唯一标准方法是使用访问器。\n\n访问器可以防止一些简单的问题，例如数组越界索引和使用未初始化的数据。通常，访问器方法包含很少或没有错误检查。\n\
    \n这里是一个示例：\n\n```\npush ebp\nmov ebp, esp\nmov ecx, [ebp + 8] ;THISCALL函数，通过ecx传递\"\
    this\"指针\nmov esp, ebp\npop ret\n```\n\n由于访问器方法非常简单，它们经过了高度优化（它们通常不需要栈帧），有时甚至会被编译器内联。\n\
    \n## 17.11 简单 Setter 方法（操作器方法）\n\n`Setter` 方法是访问器方法的对立面，提供了一种修改给定变量值的统一方法。`Setter`\
    \ 方法通常将要设置给变量的值作为参数，尽管某些方法（初始化器） 地将变量设置为预定义的值。`Setter` 方法通常在设置之前对变量进行边界检查和错误检查，并很大程度上\
    \ a) 不返回值，或 b) 返回一个简单的布尔值来判断成功。\n\n这里是一个示例：\n\n```\npush ebp\nmov ebp, esp\nmov\
    \ eax, [ebp + 8], 0\nje error\nmov eax, [ebp + 8]\nmov [ecx + 0], eax\nmov eax,\
    \ 1\njmp error\n:error:\nmov eax, 0\n:end\nmov esp, ebp\npop ebp\nret\n```\n\n\
    ## 18 变量示例\n\n### 18.1 示例：识别 C++ 代码\n\n对于下面的访问器方法，你能够看出原始的 C++ 源代码大概是什么样的吗？\n\n\
    ```\npush ebp\nmov ebp, esp\nmov eax, [ecx + 8]; ;THSCALL函数，通过ecx传递\"this\"指针\n\
    mov esp, ebp\npop ebp\nret\n```\n\n我们不知道类的名称，因此我们将使用一个通用名称 `MyClass`（或任何你喜欢的名称）。我们将列出一个简单的类定义，它在\
    \ `+8` 处有一个数据值。偏移 `+8` 是唯一被访问的数据值，因此我们不知道前 8 字节的数据是什么样的，但（为了我们的目的）我们假设该类如下所示：\n\
    \n```\nclass MyClass\n{\n    int value1;\n    int value2;\n    int value3; //偏移量\
    \ +8\n\n}\n```\n\n然后我们将创建函数，我将将其命名为 *GetValue()*。我们知道被访问的数据值位于 `[ecx+8]`（我们在上面定义它为\
    \ `value3`）。此外，我们知道数据被读取到一个 4 字节的寄存器（eax）中且没有被截断。因此，我们可以假设 `value3` 是一个 4 字节的数据值。我们可以将\
    \ `this` 指针作为存储在 `ecx` 中的指针值，并获取该指针偏移 `+8` 处的元素（`value3`）：\n\n```\nMyClass::GetValue()\n\
    {\nreturn this->value3;\n}\n```\n\n这里 **this** 指针并不是必须的，但我仍然使用它来说明该变量是作为相对于 **this**\
    \ 指针的偏移量被访问的。\n\n**注意：** 记住，我们不知道类中前 8 字节实际是什么样的，我们只有一个访问器方法，它只访问偏移 `+8` 处的单一数据值。该类也可能像这样：\n\
    \n```\nclass MyClass /* 另一种定义*/\n{\n    byte byte1;\n    byte byte2;\n    short\
    \ short1;\n    long value2;\n    long value3;\n    ...\n}\n```\n\n或者任何其他 8 字节的组合。\n\
    \n### 18.2 示例：识别 C++ 代码\n\n对于下面的 `setter` 方法，你能够看出原始的 C++ 源代码大概是什么样的吗？\n\n```\n\
    push ebp\nmov ebp, esp\ncmp [ebp + 8], 0\nje error\nmov eax, [ebp + 8]\nmov [ecx\
    \ + 0], eax\nmov eax, 1\njmp end\n:error:\nmov eax, 0\nend:\nmov esp, ebp\npop\
    \ ebp\nret\n```\n\n这段代码看起来有点复杂，但不要恐慌！我们将缓慢地分析。\n前两行代码设置了栈帧：\n\n```\npush ebp\n\
    mov ebp, esp\n```\n\n接下来两行代码将 `[ebp+8]` 的值（我们知道它是第一个参数）与零进行比较。如果 `[ebp+8]` 为 0，函数跳转到标签\
    \ `error`。我们将看到 `error` 标签将 `eax` 设置为 0 并返回。我们之前没见过，但这看起来非常像一个 `if` 语句。如果参数为 0，返回\
    \ 'error'。\n\n相反，如果参数不为 0，我们将值移动到 `eax`，然后将其移动到 `[ecx + 0]`，我们知道这是 `MyClass` 中的第一个数据字段。从这段代码中还可以看到，由于我们使用了\
    \ `eax`，这个第一个数据字段必须是 4 字节长。\n\n如果我们使用如问题 1 所示的 `MyClass` 定义，可以得到如下函数 `SetValue(int\
    \ val)`：\n\n```\nint MyClass::SetValue(int val)\n{\n  if(val == 0) return 0;\n\
    \  this->value = val;\n  return 1;\n}\n```\n\n注意，由于失败时返回 0，成功时返回 1，函数看起来有一个 `bool`\
    \ 返回。然而，返回值是 4 字节（使用了 `eax`），所以无法确定。`bool` 通常被定义为 1 字节，但存储方式与 `int` 。\n\n## 19\
    \ 数据结构\n\n### 19.1 数据结构\n\n很少程序通过简单的内存存储工作；大多数需要利用复杂对象，包括**指针、数组、结构**和其他类型。本章将介绍编译器如何实现复杂对象，以及如何识别这些对象。\n\
    \n### 19.2 数组\n\n内存中的数组（例如全局数组，或具有初始数据的数组（记住，初始化数据创建在内存的 `.data` 段中））将作为内存中硬编码地址的偏移量被访问：\n\
    \n考虑以下 C 代码：\n\n```\nx = array[25];\n```\n\n这与以下汇编代码相同：\n\n```\nmov ebx, array\n\
    mov eax, [ebx + 25]\nmov x, eax\n```\n\n现在考虑以下示例：\n\n```\nint MyFunction()\n{\n\
    \  int array[20];\n  ...\n}\n```\n\n这（大致）翻译为以下汇编代码：\n\n```\n:MyFunction!\npush\
    \ ebp\nmov esp, esp\nsub esp, 80 ;数组在栈上创建\nlea eax, [esp + 0]\n数组的指针保存在数组中\n```\n\
    \n等待，让我们重新对齐提供的碎片化 OCR 逻辑：\n\n现在考虑以下示例：\n\n```\nint MyFunction()\n{\n  int array[20];\n\
    \  ...\n}\n```\n\n这（大致）翻译为以下汇编代码：\n\n```\n:MyFunction!\npush ebp\nmov esp, esp\n\
    sub esp, 80 ;数组在栈上创建\nlea eax, [esp + 0]\n数组的指针保存在数组中\n```\n\n实际上，查看 OCR，文本是跨页碎片化的。让我们重构逻辑流：\n\
    \n“现在考虑以下示例：\n\n```\nint MyFunction()\n{\n  int array[20];\n  ...\n}\n```\n\n\
    这（大致）翻译为以下汇编代码：\n\n```\n:MyFunction!\npush ebp\nmov esp, esp\nsub esp, 80 ;数组在栈上创建\n\
    lea eax, [esp + 0]\n数组的指针保存在数组中\n```\n\n整个数组在栈上创建，并且数组的指针保存在变量中。优化后的编译器可能只想从 `esp`\
    \ 进行偏移，因此你将需要小心。\n\n同样，考虑以下示例：\n\n```\nvoid MyFunction()\n{\n  char buffer[4];\n\
    \  ...\n}\n```\n\n这将翻译为以下汇编代码：\n\n```\n:_Function2\npush ebp\nmov ebp, esp\nsub\
    \ esp, 4\nlea buffer, [esp + 0]\n```\n\n这看起来足够无害。但如果程序无意访问了 `buffer[4]` 呢？`buffer[5]`\
    \ 呢？`buffer[8]` 呢？这是缓冲区溢出漏洞的成因，可能会在稍后的章节中讨论。然而，本节将不会讨论安全问题，而是重点关注数据结构。\n\n####\
    \ 19.2.1 识别栈上的数组\n\n要识别栈上的数组，请寻找在栈上分配的大量本地存储（例如 `sub esp, 1000`），并寻找该数据的大部分通过相对于\
    \ `esp` 不同寄存器的偏移量被访问。例如：\n\n```\n:_Function3\npush ebp\nmov ebp, esp\nsub esp,\
    \ 256\nlea ebx, [esp + 0x00]\nmov [ebx + 0], 0x00\n```\n\n这是栈上创建数组的良好迹象。当然，优化后的编译器可能只想从\
    \ `esp` 进行偏移，因此你将需要小心。\n\n#### 19.2.2 识别内存中的数组\n\n内存中的数组（例如全局数组，或具有初始数据的数组（记住，初始化数据创建在内存的\
    \ `.data` 段中））将作为内存中硬编码地址的偏移量被访问：\n\n```\n:_Function4\npush ebp\nmov ebp, esp\n\
    mov esi, 0x77651004\nmov ebx, 0x00000000\nmov [esi + ebx], 0x00\n```\n"
