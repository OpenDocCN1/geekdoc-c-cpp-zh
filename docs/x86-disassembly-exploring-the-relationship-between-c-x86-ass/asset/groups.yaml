    # 8 The Stack


    # 8.1 The Stack


    ![](img/9b6491f497eec80c9bc0146581237790_68_0.png)


    Generally speaking, a stack is a data structure that stores data values contiguously
    in memory. Unlike an array, however, you access (read or write) data only at the
    ''top'' of the stack. To read from the stack is said ''to pop'' and to write to
    the stack is said ''to push''. A stack is also known as a LIFO queue (Last In
    First Out) since values are popped from the stack in the reverse order they are
    pushed onto it (think of how you pile up plates on a table). Popped data disappears
    from the stack.


    All x86 architectures use a stack as a temporary storage area in RAM that allows
    the processor to quickly store and retrieve data in memory. The current top of
    the stack is pointed to by the esp register. The stack ''grows'' downward, from
    high to low memory addresses, so values recently pushed onto the stack are located
    in memory addresses above the esp pointer. No register specifically points to
    the bottom of the stack, although most'
  - '[PAGE 69]


    operating systems monitor the stack bounds to detect both ''underflow'' (popping
    an empty

    stack) and ''overflow'' (pushing too much information on the stack) conditions.


    When a value is popped off the stack, the value remains sitting in memory until
    overwritten.

    However, you should never rely on the content of memory addresses below esp, because

    other functions may overwrite these values without your knowledge.


    Users of Windows ME, 98, 95, 3.1 (and earlier) may fondly remember the infamous
    ''Blue

    Screen of Death'' -- that was sometimes caused by a stack overflow exception.
    This occurs

    when too much data is written to the stack, and the stack ''grows'' beyond its
    limits. Modern

    operating systems use better bounds-checking and error recovery to reduce the
    occurrence

    of stack overflows, and to maintain system stability after one has occurred.


    # 8.2 Push and Pop


    The following lines of ASM code are basically equivalent:


    push eax | sub esp, 4

    mov DWORD PTR SS:[esp], eax


    pop eax | mov eax, DWORD PTR SS:[esp]

    add esp, 4


    but the single command actually performs much faster than the alternative. It
    can be

    visualized that the stack grows from right to left, and esp decreases as the stack
    grows in

    size.


