    # 2.6.1 jump tables and other calculated jumps


    8-bit CPUs, calculated jumps are often implemented by pushing a calculated ''return''
    address to the stack, then jumping to that address using the ''return'' instruction.
    For example, the RTS Trick⁵ uses this technique to implement jump tables (w:branch
    table⁶).


    # 2.6.2 parameters after the call instruction


    Instead of picking up their parameters off the stack or out of some fixed global
    address, subroutines provide in the addresses of memory that follow the instruction
    called that subroutine. Subroutines that use this technique adjust the return
    address to skip over the constant data, then return to an address many bytes after
    the ''call'' instruction. One of the most famous programs that used this technique
    is the ''Sweet 16'' virtual machine.


    The technique may make disassembling more difficult.


