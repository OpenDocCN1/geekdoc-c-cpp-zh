    \n# 15 循环\n\n## 15.1 循环\n\n为了完成重复任务，程序员经常实现循环。循环有很多种类，但它们都可以简化为几种类似的汇编格式。本章将讨论循环、如何识别它们以及如何将其反编译回高级表示。\n\
