    _Question:

    push ebp

    mov ebp, esp

    sub esp, 4

    mov eax, [ebp + 8]

    mul 2

    mov [esp + 0], eax

    mov eax, [ebp + 12]

    mov edx, [esp + 0]

    add eax, edx

    mov esp, ebp

    pop ebp

    ret

    ```


    The function above takes 2 4-byte parameters, accessed by offsets +8 and +12 from
    ebp. The function also has 1 variable created on the stack, accessed by offset
    +0 from esp. The function is nearly identical to this C code:


    ```

    int Question(int x, int y)

    {

    int z;

    z = x * 2;

    return y + z;

    }

    ```'
