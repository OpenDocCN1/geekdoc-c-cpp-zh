    ## 2.6 8 位 CPU 代码的反汇编


    大多数 CPU 都是 8 位 CPU。⁴


    通常当子程序结束时，它会立即返回执行 ''call'' 指令之后的下一个地址。


    然而，汇编语言程序员偶尔使用几种不同的技术来调整返回地址，使反汇编变得更加困难：


    - 跳转表 (jump tables)，

    - 计算跳转 (calculated jumps)，以及，

    - call 指令后的参数。


    + 4 Jim Turley. "The Two Percent Solution" {http://www.eetimes.com/discussion/other/4024488/The-Two-Percent-Solution}.
    2002.


    ### 2.6.1 跳转表和其他计算跳转


    对于 8 位 CPU，计算跳转通常通过将一个计算出的“返回”地址推入栈中，然后使用 ''return'' 指令跳转到该地址来实现。例如，RTS Trick⁵
    使用这种技术来实现跳转表 (w:branch table⁶)。


    ### 2.6.2 call 指令后的参数


    子程序不是从栈中或某些固定全局地址获取它们的参数，而是在调用该子程序的指令之后的内存地址处提供这些地址。使用这种技术的子程序会调整返回地址以跳过常量数据，然后返回到
    ''call'' 指令后许多字节处的地址。使用这种技术的最著名的程序之一是 ''Sweet 16'' 虚拟机。


    这种技术可能会使反汇编变得更加困难。


    ## 2.7 32 位 CPU 代码的反汇编


    大多数 32 位 CPU 使用 ARM 指令集⁷⁸⁹。


    典型的 ARM 汇编代码是一系列子程序，字面量常量散落在子程序之间。子程序的标准序言（prolog）和结尾（epilog¹⁰）很容易识别。


