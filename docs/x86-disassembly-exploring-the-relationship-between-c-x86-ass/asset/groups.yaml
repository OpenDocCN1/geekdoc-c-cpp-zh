    is equivalent to the halting problem. As a consequence, it is not possible to
    write a disassembler that will correctly separate code and data for all possible
    input programs. Reverse engineering is full of such theoretical limitations, although
    by Rice''s theorem all interesting questions about program properties are undecidable
    (so compilers and many other tools that deal with programs in any form run into
    such limits). In practice a combination of interactive and automatic analysis
    and perseverance can handle all programs designed to thwart reverse engineering,
    using encryption and decrypting just prior to use, and moving code around memory.


    ### 2.3.2 Lost Information


    All text-based identifiers, such as variable names, label names, and macros are
    removed by the assembly process. They may still be present in generated object
    files, for use by debuggers and linkers, but the direct connection is lost. Without
    these comments and identifiers, it is harder to understand the purpose of the
    source code, and it can be difficult to determine the algorithm used by that code.

