  mdcn: "\n1. 在函数体中，`ret` 指令有一个（可选的）参数，用于指示函数返回时从栈中弹出多少字节。\n2. STDCALL 函数以前导的下划线进行名称修饰，随后跟上\
    \ `@`，然后是传递到栈上的参数数量（字节数）。在 32 位对齐机器上，此数字将是 4 的倍数。\n\n## 11.3.3 FASTCALL\n\nFASTCALL\
    \ 调用约定在所有编译器中并不完全标准，因此应该应谨慎使用。在 FASTCALL 中，前 2 或 3 个 32 位（或更小）参数通过寄存器传递，最常用的寄存器是\
    \ `edx`、`eax` 和 `ecx`。额外的参数或大于 4 字节的参数通过栈传递，通常按照从右到左的顺序（类似于 CDECL）。如果需要，调用函数通常负责清理栈。\n\
    \n由于存在歧义性，建议仅在对速度至关重要且只有 1、2 或 32 位参数的情况下使用 FASTCALL。\n\n以下 C 函数：\n\n```\n_fastcall\
    \ int MyFunction3(int a, int b)\n{\nreturn a + b;\n}\n```\n\n以及以下 C 调用：\n\n```\n\
    x = MyFunction3(2, 3);\n```\n\n将分别为被调用函数和调用函数产生以下汇编代码片段：\n\n```\n@MyFunction3\n\
    push ebp\nmov eax, esp ;许多编译器即使在使用时不也会创建一个栈帧\nadd eax, edx ;a 在 eax 中，b 在 edx\
    \ 中\npop ebp\nret\n```\n\n以及\n\n```\n;the calling function\nmov eax, 2\nmov edx,\
    \ 3\ncall @MyFunction3\n```\n\nFASTCALL 的名称修饰在函数名前面加上一个 `@`，并在函数名后跟上 `@x`，其中 `x`\
    \ 是传递给函数的参数数量（字节数）。\n\n许多编译器仍然为 FASTCALL 函数生成栈帧，特别是在 FASTCALL 函数本身调用另一个子程序的情况下。然而，如果\
    \ FASTCALL 函数不需要栈帧，优化型编译器可以自由省略它。\n\n## 11.4 C++ 调用约定\n\nC++ 要求类的非静态方法必须通过类的实例来调用。因此，它使用标准的调用约定来确保将对象的指针传递给函数：THISCALL。\n\
    \n## 11.4.1 THISCALL\n\n在 THISCALL 中，指向类对象的指针通过 `ecx` 传递，参数在栈上按从右到左顺序传递，返回值通过\
    \ `eax` 传递。\n\n例如，C++ 指令：\n\n```\nMyObj.MyMethod(a, b, c);\n```\n\n将形成以下汇编代码：\n\
    \n```\nmov ecx, MyObj\npush c\npush b\npush a\ncall _MyMethod\n```\n\n至少，如果不是**名称修饰（name\
    \ mangling）**，*它看起来就像*上面的汇编代码。\n\n## 11.4.2 名称修饰 (Name Mangling)\n\n什么是名称修饰？由于函数重载固有的复杂性，C++\
    \ 函数的名称修饰程度以至于人们经常将该过程称为“名称修饰”。遗憾的是，由于标准没有强制规定约定，C++ 编译器可以自由以不同的方式进行名称修饰。此外，异常处理等其他问题也没有标准化。\n\
    \n由于每个编译器的名称修饰方式都不同，本书将不会花费太多时间讨论算法的细节。请注意，在许多情况下，可以通过检查名称修饰格式的细节来确定是由哪个编译器创建的可执行文件。然而，我们在书中不会深入讨论这个主题。\n\
    \n以下是关于 THISCALL 名称修饰函数的几般备注：\n\n- 与 CDECL、FASTCALL 和 STDCALL 函数声明相比，由于其复杂性一眼就能识别。\n\
    - 它们有时包含函数类的名称。\n- 它们几乎总是包含参数的数量和类型，以便可以通过传递的参数来区分重载函数。\n\n这里是一个 C++ 类和函数声明的示例：\n\
    \n3 http://en.wikipedia.org/wiki/Name%20mangling\n\n```\nclass MyClass {\n  MyFunction(int\
    \ a);\n}\n\nMyClass::MyFunction(int a)\n```\n\n这里是生成的修饰名：\n\n```\n?Function@MyClass@@QAEHNZ\n\
    ```\n\n## 11.4.3 Extern \"C\"\n\n在 C++ 源文件中，放置在 `extern \"C\"` 块中的函数保证不会被修饰。这在用\
    \ C++ 编写库且需要在不进行修饰的情况下导出函数时使用。尽管程序是用 C++ 编写并用 C++ 编译器编译的，但某些函数可能不会被修饰，并将使用普通的\
    \ C 调用约定（通常是 CDECL）。\n\n## 11.5 关于名称修饰的说明\n\n在本章中我们讨论了名称修饰，但事实是，在纯反汇编代码中没有任何名称，特别是带有花哨修饰的名称。汇编阶段会移除所有这些可读标识符，并代之替换为二进制位置。函数名称实际上只出现在两个地方：\n\
    \n- 1. 编译期间产生的列表文件\n- 2. 在导出表中（如果函数被导出）\n\n在反汇编机器码时，将没有函数名，也没有名称修饰可以检查。\n\n（注：原文后续部分存在大量重复内容，此处已按要求停止重复输出相同文本。）\n"
