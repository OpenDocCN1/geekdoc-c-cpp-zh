    ## 3.1.3 Debuggers for Other Systems


    The Unix debugger on systems derived from AT&T Unix. It is often part of an optional
    development toolkit package which comes at an extra price. It uses an interactive
    command line interface.


    An enhanced debugger on Tru64 Unix systems from HP (originally Digital Equipment
    Corporation) that handles advanced functionality like threads better than dbx.


    An advanced tool on Solaris that provides functions like profiling and many others
    on the entire system, including the kernel.


    The Modular Debugger (MDB) is a new general purpose debugging tool for the Solaris
    Operating Environment. Its primary feature is its extensibility. The Solaris Modular
    Debugger describes how to use MDB to debug complex software systems, with a particular
    emphasis on the facilities available for debugging the Solaris kernel and associated
    device drivers and modules. It also includes a complete reference for and discussion
    of the MDB language syntax, debugger features, and MDB Module Programming API.


    ## 3.1.4 Debugger Techniques


    ### Setting Breakpoints


    As previously mentioned in the section in disassemblers, a 6-line C program doing
    something as outputting "Hello, World!" turns into massive amounts of assembly
    code. Most people don''t want to sift through the entire mess to find out the
    information they want. It can be time consuming just to find the information desires
    by just looking through the code. As an alternative, one can choose to set breakpoints
    to halt the program once it has reached a given point within the program''s code.


    For instance, let''s say that in your program you consistently experience crashes
    after one particular event: immediately after closing a message box. You set breakpoints
    on all calls to MessageBoxA. You run your program with the breakpoints, and it
    stops, ready to call MessageBoxA. Executing each line one-by-one thereafter (referred
    to as *stepping*) through the code, and watching the program stack, you see that
    a buffer overflow occurs soon after the call.


