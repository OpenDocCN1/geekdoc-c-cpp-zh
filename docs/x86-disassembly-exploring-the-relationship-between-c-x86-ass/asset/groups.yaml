    mov ebp, esp

    lea ecx, ss:[ebp + 8]

    mov [ecx + 0], ecx

    mov [ecx + 4], 0x0000000A

    mov esp, ebp

    pop ebp

    ret


    ```


    The function clearly takes a pointer to a data structure as its first argument.
    Also, each, how can we tell if this is an array or a structure? To answer your
    question, we need to remember one important distinction between structures and
    arrays: the elements in an array are all of the same type, the elements in a structure
    do not need to be the same type. Given that rule, it is clear that one of the
