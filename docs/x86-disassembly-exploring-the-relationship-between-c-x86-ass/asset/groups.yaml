    \n## 17.3 .bss 和 .data 段\n\n`.bss` 和 `.data` 段都包含可以改变的值。通常，源中初始化为非零值的变量分配在 `.data`\
    \ 段。未初始化或初始化为零值的变量可以分配到 `.bss` 段。由于所有 `.bss` 变量都保证位于程序的开头，因此链接器不需要在二进制文件中分配空间。因此，无论大小如何，`.bss`\
    \ 段都不会占用二进制文件空间。\n\n## 17.4 静态局部变量\n\n局部静态会在函数调用之间保持其值，因此不能像局部变量那样创建在栈上。静态变量是如何创建的？来看一个简单的示例：\n\
    \n```c\nvoid MyFunction(int a)\n{\n    static int x = 0;\n    printf(\"my number:\
    \ %d\\n\", x);\n    printf(\"%d\\n\", a);\n}\n```\n\n使用 `cl.exe` 编译库会得到以下代码：\n\
    \n```\n.bss                SEGMENT\n7x071??MyFunction@@089 DD 0IH DUP    MyFunction::2::z\n\
    .BSS                ENDS\n.DATA               SEGMENT\n$05796              DB\
    \             ,my number: %d\n$05797              DB             ,Xd, Xd0, OAH,\
    \ OOH\n.DATA               ENDS\nPUBLIC             _MyFunction\nEXTRN       \
    \        _printf:NEAR   /Dat\n; Function compile flags: /Dat\n               \
    \     SEGMENT\n.TEXT\n_$a = 8                             ;size = 4\n_MyFunction\
    \ PROC NEAR\n; Line 4\n    push               ebp\n    mov                ebp,\
    \ esp\n; Line 6\n    push               OFFSET:$SG796\n    call              \
    \ _printf\n    add                esp, 4\n; Line 7\n    push               eax,\
    \ DWORD PTR ??MyFunction@@089\n    push\nmov                ecx, DWORD PTR _a{ebp}\n\
    \    push\npush\npush\n    push               OFFSET:$SG797\n    call        \
    \       _printf\n    add                esp, 12             ;000000cH\n; Line\
    \ 8\n    pop                ebp\n    ret                0\n_MyFunction ENDP\n\
    .TEXT               ENDS\n```\n\n"
