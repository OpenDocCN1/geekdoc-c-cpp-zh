  mdcn: "\n\n# 有符号与无符号变量\n\n通常在 wikibook 中发布汇编列表时，大部分代码乱码会被丢弃以提高可读性，在本例中，这些“乱码”包含了我们正在寻找的答案。显而易，此函数创建了一个标准的栈帧，并且没有在栈上创建局部变量。为了保证完整性，我们将一步步为营，通过逻辑推导得出结论。\n\
    \n在第 7 行的代码中，有一个对 `_printf` 的调用。printf 是标准的 libc 函数，因此可以假设它采用 cdecl 调用约定。在调用 `_printf`\
    \ 之前，有三个参数被推入栈中：\n\n- DWORD PTR ?_=0717?MyFunction@@0@9\n- DWORD PTR _$[ebp]\n\
    - OFFSET FLAT=$SG797\n\n第二个参数 `_a$[ebp]` 在此汇编指令中部分定义：\n\n```\n_a$ = 8\n```\n\n\
    因此，`_a$[ebp]` 是位于 eb 偏移 +8 处的变量，或者说是函数的第一个变量。OFFSET FLAT=$SG797 同样在汇编列表中声明如下：\n\
    \n```\nSG797              DB      ,Xd, ?4a, OaH, 08\n7?=0717?MyFunction@@0@99\
    \ DD 01H DUP (?)\nENDS\n```\n\n如果你有 ASCII 表，你会发现 0aH = 0xA = '\\n'。OFFSET FLAT=$SG797\
    \ 是我们打印语句的格式字符串。我们的最后一个选项是看起来很神秘的 \"?x@71?MyFunction@@0@9\"，它在接下来的汇编代码段中定义：\n\n\
    这表明微软 C 编译器在 .bss 段创建了静态变量。这对于所有编译器可能并非如此，但原理是一样的：局部变量的创建和使用方式与全局值非常相似，甚至完全相同。事实上，对于逆向工程工程师来说，它们通常是互换的。请记住，静态变量和全局变量之间唯一的区别在于“作用域”的概念，而作用域仅供编译器使用。\n\
    \n# 17.5 有符号与无符号变量\n\n整数格式变量（如 `int`、`char`、`short` 和 `long`）在 C 源代码中可以声明为有符号或无符号变量。变量的处理方式上有两区别：\n\
    \n- 有符号变量使用 `add`、`sub` 等指令。无符号变量使用无符号算术指令，如 `addi`、`subi`。\n- 有符号变量使用有符号分支指令，如\
    \ `jge` 和 `jl`。无符号变量使用无符号分支指令，如 `jae`、`jb`。\n\n有符号和无符号指令之间的区别在于设置大于或小于（溢出）标志位的条件。对于有符号和无符号数据，整数结果值完全相同。\n\
    \n# 17.6 浮点值\n\n浮点值可以是 32 位数据值（对于 `float`）或 64 位数据值（对于 `double`）。这些值与普通的整数值变量的区别在于，它们与浮点指令配合使用。浮点指令通常以字母\
    \ f 开头。例如，`fadd`、`fcmp` 和类似的指令用于浮点值。特别需要注意的是 `float` 指令及其变体。这些指令接收一个整数值变量并将其转换为浮点变量。\n\
    \n我们将在后面的章节中更详细地讨论浮点变量。\n\n# 17.7 全局变量\n\n全局变量在函数体内部没有限制作用域的变量。由于词法作用域的本质，它们通常不在栈上。全局变量在本质上不是词法的，它们以硬编码内存地址的形式存在程序中，该地址在程序执行过程中永远不变。这可能存在于可执行文件的\
    \ DATA 段，或任何其他可以使用硬编码内存地址存储数据的地方。\n\n在 C 中，全局变量定义在任何函数体之外。没有“global”关键字。任何未在函数内部定义的变量都是全局变量。但在\
    \ C 中，未在函数内部定义的变量仅对于其被定义的特定源文件是全局的。例如，我们有两个文件 Foo.c 和 Bar.c，以及一个全局变量 `MyGlobalVar`：\n\
    \n| Foo.c | Bar.c |\n|---|---|\n| int MyGlobalVar; | int GetVar(void) |\n| int\
    \ GetVar(void) | { |\n| //正确！ | //错误！ |\n| return MyGlobalVar; | return MyGlobalVar;\
    \ |\n| | |\n\n在上面的示例中，变量 `MyGlobalVar` 在 Foo.c 文件可见，但在 Bar.c 文件内部不可见。为了让 `MyGlobalVar`\
    \ 在所有项目文件中可见，我们需要使用 `extern` 关键字，我们将在下文中讨论。\n\n# 17.7.1 \"static\" 变量\n\nC 编程语言使用特殊关键字\
    \ `static` 来定义函数局部变量（它们无法从函数外部引用），但它们在跨函数调用时保持其值。与普通的词法变量（在进入函数时在栈上创建并在退出时销毁）不同，静态变量在函数调用间保持有效。\n\
    \n```\nint myFunction(void) {\n    static int x;\n}\n```\n\n静态变量是全局的。局部变量的创建和使用方式与全局值非常相似，即使不是完全相同。事实上，对于逆向工程工程师来说，它们通常是互换的。请记住，静态变量和全局变量之间唯一的区别在于“作用域”的概念，而作用域仅供编译器使用。在汇编时，我们应将其视为全局变量。\n\
    \n# 17.7.2 \"extern\" 变量\n\n`extern` 关键字用于编译器来指示特定变量对于整个项目是全局的，而不只是单个源文件。除了这种区别以及全局变量略大的作用域外，它们应该被视为普通的全局变量。\n\
    \n在静态库中，标记为 `extern` 的变量可能供链接到库的程序使用。\n\n# 17.7.3 全局变量总结\n\n以下是关于全局变量总结表格：\n\n\
    | 引用方式 | 作用域 | 备注 |\n|---|---|---|\n| 静态变量 | 硬编码内存地址，仅限函数 | 单个函数 | 在汇编时，除了仅在单个函数中使用外，与全局变量无法区分。如果全局变量不在其他函数中使用，它是静态的。\
    \ |\n| 全局变量 | 硬编码内存地址，仅限文件 | 单个文件 | 全局变量仅在单个文件中使用。这有助于你在汇编时估计原始代码的安排。 |\n| extern\
    \ 变量 | 硬编码内存地址，整个项目 | 整个项目 | extern 变量适用于项目的所有函数，以及链接到项目的程序（例如外部库）。 |\n\n在汇编时，除非你能从变量的作用域确定它是静态或外部的，否则硬编码内存地址应被视为全局变量。\n\
    \n# 17.8 常量\n\n用 `const` 关键字修饰的变量通常存储在可执行文件的 .data 段中。常量值可以通过它们在程序开始时初始化且从不被程序修改来区分。由于这些原因，某些编译器可能会将常量变量（特别是字符串）存储在可执行文件的\
    \ .text 段，允许在同一进程的多个实例之间共享这些变量。这为逆向工程师带来了大问题，他们必须判断看到的代码是常量变量的一部分还是子程序的一部分。\n\n\
    # 17.9 volatile内存\n\n在 C 和 C++ 中，变量可以声明为 `volatile`，这告诉编译器内存位置可以被外部或并发进程访问，并且编译器不应对该变量执行任何优化。例如，如果多个线程都在访问和修改同一个全局值，有时将其存储在寄存器中是不好的，应该经常刷新到内存。通常，volatile\
    \ 内存在每次计算后都必须刷新到内存，以确保当其他进程来查找时，内存中是最新版本的数据。\n\n"
