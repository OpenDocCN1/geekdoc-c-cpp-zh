    # 11 Calling Conventions


    # 11.1 Calling Conventions


    w:Calling convention¹ Calling conventions are a standardized method for functions
    to be implemented and called by the machine. A calling convention specifies the
    method that a compiler sets up to access a subroutine. In theory, code from any
    compiler can be interfaced together, so long as the functions all have the same
    calling conventions. In practice however, this is not always the case.


    Calling conventions specify how arguments are passed to a function, how return
    values are passed back out of a function, how the function manages the stack and
    its stack frame. In short, how a function call in C or C++ is converted into assembly.
    Needless to say, why is it’s so important to specify certain standard methods.
    If these standard conventions did not exist, it would be nearly impossible for
    programs created using different compilers to communicate and interact with one
    another.


    There are three major calling conventions that are used with the C language: STDCALL,
    CDECL, and FASTCALL. In addition, there is another calling convention typically
    used with C++: THISCALL. There are other calling conventions as well, including
    PASCAL and FORTRAN conventions, among others. We will not consider those conventions
    in this book.


    # 11.2 Notes on Terminology


    There are a few terms that we are going to be using in this chapter, which are
    mostly common sense, but are worthy of stating directly:


    Passing arguments


    *passing arguments* is a way of saying that the calling function is writing data
    in the place where the called function will look for them. Arguments are passed
    before the call instruction is executed.


    Right-to-Left and Left-to-Right


    These describe the manner that arguments are passed to the subroutine, in terms
    of the High-level code. For instance, the following C function call:


    ```

    MyFunction(a, b);

    ```


    > 1 http://en.wikipedia.org/wiki/Calling%20convention'
