    # 9.4 Non-Standard Stack Frames


    Frequently, reversers will come across a subroutine that doesn''t set up a standard
    stack frame. Here are some things to consider when looking at a subroutine that
    does not start with a standard sequence:


    # 9.4.1 Using Uninitialized Registers


    When a subroutine starts using data in an uninitialized register, that means that
    the subroutine expects external functions to put data into that register before
    it gets called. Some conventions pass arguments in registers, but sometimes a
    compiler will not use a standard calling convention.


    # 9.4.2 "static" Functions


    In C, functions may optionally be declared with the static keyword, as such:


    ```

    static void MyFunction4();

    ```


    The static keyword causes a function to have only local scope, meaning it may
    not be accessed by any external functions (it is strictly internal to the given
    code file). When an optimizing compiler sees a static function that is only referenced
    by calls (no references through function pointers), it ''knows'' that external
    functions cannot possibly interface with the static function (the compiler controls
    all access to the function), so the compiler doesn''t bother making it.


    # 9.4.3 Hot Patch Prologue


    Some Windows functions set up a regular stack frame as explained above, but start
    out with the apparently non-sensical line


    ```

    mov edi, edi;

    ```


    This instruction is assembled into 2 bytes which serve as a placeholder for future
    function patches. Taken as a whole such function might look like this:


    ```

    nop      ; each nop is 1 byte long

    nop

    nop

    nop

    nop


    FUNCTION:      <-- This is the function entry point as used by

    call instructions

    ```'
  - '[PAGE 76]


    ```

    mov edi, edi      ; mov edi,edi is 2 bytes long

    push ebp           ; regular stack frame setup

    mov ebp,

    ```


    If such a function needs to be replaced by reloading the application (or restarting
    the machine in kernel patches) it can be achieved by inserting a jump to the replacement
    function. A short jump (which can jump +/- 127 bytes) requires 2 bytes of storage
    space - just amount the ''mov edi,edi'' placeholder provides. A jump to any memory
    location, in this case to our replacement function, requires 5 bytes. These are
    provided by the 5 no-operation bytes just preceding the function. If a function
    patched calls it will first jump back by 5 bytes and then do a long jump to the
    replacement function. After the patch the memory might look like this


    ```

    LABEL:

    mp REPLACEMENT_FUNCTION ;-- 5 NOPs replaced by jmp


    FUNCTION:

    jmp short LABEL      ;-- mov edi has been replaced by

    jump backwards

    push ebp

    mov ebp,               ; regular stack frame setup as before

    ```


    The reason for using a 2-byte mov instruction at the beginning instead of putting
    5 nops there directly, is to prevent corruption during the patching process. There
    would be a risk with replacing 5 individual instructions if the instruction pointer
    is currently pointing at any one of them. Using a single mov instruction as placeholder
    on the other hand guarantees that the patching can be completed as an atomic transaction.


    # 9.5 Local Static Variables


    Local static variables cannot be created on the stack, since the value of the
    variable is preserved across function calls. We''ll discuss local static variables
    and other types of variables in a later chapter.'
