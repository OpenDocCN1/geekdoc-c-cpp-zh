  md: "\n## 24.7 Example: Duff's Device\n\nWhat does the following C code function\
    \ do? Is it useful? Why or why not?\n\n```c\nvoid MyFunction(int *arrayA, int\
    \ *arrayB, int cnt)\n{\n    switch(cnt % 6)\n    {\n        while(cnt != 0)\n\
    \        {\n            case 0:\n                arrayA[cnt] = arrayB[cnt];\n\
    \            case 5:\n                arrayA[cnt] = arrayB[cnt];\n           \
    \ case 4:\n                arrayA[cnt] = arrayB[cnt];\n            case 3:\n \
    \               arrayA[cnt] = arrayB[cnt];\n            case 2:\n            \
    \    arrayA[cnt] = arrayB[cnt];\n            case 1:\n                arrayA[cnt]\
    \ = arrayB[cnt];\n        }\n    }\n}\n```\n\nDuff's device¹ this piece of code\
    \ is known as a **Duff's device** or 'Duff's machine'. It is used to partially\
    \ unwind a loop for efficiency. Notice the strange way that the `while()` is nested\
    \ inside the `switch` statement? Two arrays of integers are passed to the function,\
    \ and at each iteration of the while loop, 6 consecutive elements are copied from\
    \ **arrayB** to **arrayA**. The switch statement, since it is outside the while\
    \ loop, only occurs at the beginning of the function. The modulo is made of the\
    \ variable `cnt` with respect to 6. If cnt is not evenly divisible by 6, the modulo\
    \ statement is going to start the loop somewhere in the middle of the rotation,\
    \ thus preventing the loop from causing a buffer overflow without having to test\
    \ the count after each iteration.\n\nDuff's Device is considered one of the more\
    \ efficient general-purpose methods for copying strings, arrays, or data streams.\n\
    \n## 25 Code Obfuscation\n\n### 25.1 Code Obfuscation\n\n**Code Obfuscation**\
    \ is the act of making the assembly code or machine code of a program more difficult\
    \ to disassemble or decompile. The term 'obfuscation' is typically used to suggest\
    \ a deliberate attempt to add difficulty, but many other practices will cause\
    \ code to be obfuscated without being the intention. Software vendors may attempt\
    \ to obfuscate or even encrypt code to prevent reverse engineering efforts. There\
    \ are many different types of obfuscations. Notice that many code optimizations\
    \ (discussed in the previous chapter) have the side-effect of making code more\
    \ difficult to read, and therefore optimizations act as obfuscations.\n\n### 25.2\
    \ What is Code Obfuscation?\n\nThere are many things that obfuscation could be:\n\
    \n- Encrypted code that is decrypted prior to runtime.\n- Compressed code that\
    \ is decompressed prior to runtime.\n- Executables that contain Encrypted sections,\
    \ and a simple decryptor.\n- Code instructions that are put in a hard-to-read\
    \ order.\n- Code instructions which are used in a non-obvious way.\n\nThis chapter\
    \ will try to examine some common methods of obfuscating code, but will not necessarily\
    \ delve into methods to break the obfuscation.\n\n### 25.3 Interleaving\n\nOptimizing\
    \ Compilers will engage in a process called **interleaving** to try and maximize\
    \ parallelism in pipelined processors. This technique is based on two premises:\n\
    \n- 1. That certain instructions can be executed out of order and maintain the\
    \ correct output\n- 2. That processors can perform certain pairs of tasks simultaneously.\n\
    \n### 25.3.1 x86 NetBurst Architecture\n\nThe Intel **NetBurst Architecture**\
    \ divides an x86 processor into 2 distinct parts: the supporting hardware, and\
    \ the primitive core processor. The primitive core of a processor contains the\
    \ ability to perform some calculations blindly fast, but not the instructions\
    \ that you or I am familiar with. The processor converts the code instructions\
    \ into a form called “micro-ops” that are then handled by the primitive core processor.\n\
    \nThe processor can also be broken into 4 components, or modules, each of which\
    \ is capable of performing tasks. Since each module can operate separately, up\
    \ to 4 separate tasks can be handled *simultaneously* by the processor core, so\
    \ long as those tasks can be performed by each of the 4 modules:\n\n| Port | Description\
    \ |\n| :--- | :--- |\n| Port0 | Double-speed integer arithmetic, floating point\
    \ load, memory store |\n| Port1 | Double-speed integer arithmetic, floating point\
    \ arithmetic |\n| Port2 | memory read |\n| Port3 | memory write (writes to address\
    \ bus) |\n\nSo for instance, the processor can simultaneously perform 2 integer\
    \ arithmetic instructions in both Port0 and Port1, a compiler will frequently\
    \ go to great lengths to put arithmetic instructions close to each other. If the\
    \ timing is just right, up to 4 arithmetic instructions can be executed in a single\
    \ instruction period.\n\nNotice how writing to memory is particularly slow (requiring\
    \ the address to be written by Port3, and the data itself to be written by Port0).\
    \ Floating point numbers need to be loaded to the FPU before they can be operated\
    \ on, so a floating point load and a floating point arithmetic instruction cannot\
    \ operate on a single value in a single instruction cycle. Therefore, it is not\
    \ uncommon to see floating point values loaded, integer values are manipulated,\
    \ and then the floating point value being operated on.\n\n## 25.4 Non-Intuitive\
    \ Instructions\n\nOptimizing compilers frequently use instructions that are not\
    \ intuitive. Some instructions can perform tasks for which they were not designed,\
    \ typically as a side effect. Sometimes, one instruction can perform a task more\
    \ quickly than other specialized instructions\n\nThe only way to know that instruction\
    \ is faster is to consult the processor documentation. However, knowing some of\
    \ the most common substitutions is very useful to the reverser.\n\nHere are some\
    \ examples. The code in the first box operates more quickly than the one in the\
    \ second, but performs exactly the same tasks.\n\n#### Example 1\n\nFast\n```assembly\n\
    xor eax, eax\n```\nSlow\n```assembly\nmov eax, 0\n```\n\n#### Example 2\n\nFast\n\
    ```assembly\nshl eax, 3\n```\nSlow\n```assembly\nmul eax, 8\n```\n\nSometimes\
    \ such transformations could be made to make the analysis more difficult:\n\n\
    #### Example 3\n\nFast\n```assembly\npush $next_instr\njmp $some_function\n$next_instr:...\n\
    ```\nSlow\n```assembly\ncall $some_function\n```\n\n#### Example 4\n\nFast\n```assembly\n\
    pop eax\njmp eax\n```\nSlow\n```assembly\nretn\n```\n\n### 25.4.1 Common Instruction\
    \ Substitutions\n\nlea\n\nThe instruction has the following form:\n\n```assembly\n\
    lea dest, (XS):[reg1 + reg2 * x]\n```\n\nWhere XS is a segment register (SS, DS,\
    \ CS, etc.), reg1 is the base address, reg2 is a variable offset, and x is a multiplicative\
    \ scaling factor.\n"
  mdcn: "\n\n## 24.7 示例：Duff 设备 (Duff's Device)\n\n以下 C 代码函数的作用是什么？它有用吗？为什么有用或者为什么没用？\n\
    \n```c\nvoid MyFunction(int *arrayA, int *arrayB, int cnt)\n{\n    switch(cnt\
    \ % 6)\n    {\n        while(cnt != 0)\n        {\n            case 0:\n     \
    \           arrayA[cnt] = arrayB[cnt];\n            case 5:\n                arrayA[cnt]\
    \ = arrayB[cnt];\n            case 4:\n                arrayA[cnt] = arrayB[cnt];\n\
    \            case 3:\n                arrayA[cnt] = arrayB[cnt];\n           \
    \ case 2:\n                arrayA[cnt] = arrayB[cnt];\n            case 1:\n \
    \               arrayA[cnt] = arrayB[cnt];\n        }\n    }\n}\n```\n\nDuff 设备¹这段代码被称为\
    \ **Duff 设备**或“Duff 机器”。它用于部分展开循环以提高效率。注意 `while()` 嵌套在 `switch` 语句中的奇特方式。函数传入了两个整数数组，在\
    \ `while` 循环的每次迭代中，6 个连续元素会从 **arrayB** 复制到 **arrayA**。由于 `switch` 语句位于 `while`\
    \ 循环之外，它只会在函数开始时执行。取模是对变量 `cnt` 与 6 进行。如果 `cnt`不能被 6 整除，取模语句将从旋转的中间启动循环，从而防止循环导致缓冲区溢出，而无需在每次迭代后都测试计数。\n\
    \nDuff 设备被认为是复制字符串、数组或数据流最高效的通用方法之一。\n\n## 25 代码混淆\n\n### 25.1 代码混淆\n\n**代码混淆**是指使程序的汇编代码或机器代码变得更难反汇编或反编译的行为。“混淆”一词通常用于暗示一种为了增加难度而刻意的尝试，但许多其他做法也会在非主意的情况下导致代码被混淆。软件供应商可能会尝试混淆甚至加密代码，以防止逆向工程。混淆有许多不同的类型。请注意，许多代码优化（在上章中讨论过）具有使代码更难以阅读的副作用，因此优化也充当了混淆。\n\
    \n### 25.2 什么是代码混淆？\n\n混淆可以是许多形式：\n\n- 在运行前进行解密的加密代码。\n- 在运行前进行解压缩的压缩代码。\n- 包含加密段和简单解密器的可执行文件。\n\
    - 以难以阅读的顺序排列的代码指令。\n- 以非明显方式使用的代码指令。\n\n本章尝试研究一些常见的代码混淆方法，但不一定深入探讨破解混淆的方法。\n\n\
    ### 25.3 交织 (Interleaving)\n\n优化编译器会参与一种名为**交织**的过程，以试图最大化流水线处理器器中的并行性。这种技术基于两个前提：\n\
    \n- 1. 某些指令可以乱序执行并保持正确的输出\n- 2. 处理器可以同时执行某些任务对\n\n### 25.3.1 x86 NetBurst 架构\n\
    \nIntel **NetBurst 架构** 将 x86 处理器分为两个部分：支持硬件和原始核心处理器。处理器的原始核心具有盲速计算的能力，但不包含我们熟悉的指令。处理器将代码指令转换为称为“微操作”（micro-ops）的形式，然后由原始核心处理器处理。\n\
    \n处理器还可以被分为 4 个组件或模块，每个模块都能够执行任务。由于每个模块都可以独立运行，只要这些任务可以由 4 个模块中的每一个执行，处理器核心就可以*同时*处理多达\
    \ 4 个独立任务：\n\n| 端口 (Port) | 描述 |\n| :--- | :--- |\n| Port0 | 双速整数算术、浮点加载、内存存储\
    \ |\n| Port1 | 双速整数算术、浮点算术 |\n| Port2 | 内存读取 |\n| Port3 | 内存写入（写入地址总线） |\n\n例如，处理器可以在\
    \ Port0 和 Port1 中同时执行 2 条整数算术指令，编译器会经常尽力将算术指令放在一起。如果时机恰好，在一个指令周期内可以执行最多 4 条算术指令。\n\
    \n注意写入内存的速度特别慢（需要由 Port3 写入地址，而数据本身由 Port0 写入）。浮点数在操作之前需要加载到 FPU 中，因此浮点加载指令和浮点算术指令无法在单个指令周期内对单个值进行操作。因此，看到加载浮点值、处理整数值、然后对浮点值进行操作并不罕见。\n\
    \n## 25.4 非直观指令\n\n优化编译器经常使用不直观的指令。某些指令可以执行并非为其设计的任务，通常作为副作用实现。有时，一条指令执行任务的速度比其他专用指令更快。\n\
    \n了解某指令更快更快的方法是咨询处理器文档。然而，了解一些最常见的替换方案对于逆向人员非常有帮助。\n\n以下是一些示例。第一个框中的代码运行速度比第二个框中的快，但执行的任务完全相同。\n\
    \n#### 示例 1\n\n快\n```assembly\nxor eax, eax\n```\n慢\n```assembly\nmov eax, 0\n\
    ```\n\n#### 示例 2\n\n快\n```assembly\nshl eax, 3\n```\n慢\n```assembly\nmul eax,\
    \ 8\n```\n\n有时可以进行这种转换来增加分析难度：\n\n#### 示例 3\n\n快\n```assembly\npush $next_instr\n\
    jmp $some_function\n$next_instr:...\n```\n慢\n```assembly\ncall $some_function\n\
    ```\n\n#### 示例 4\n\n快\n```assembly\npop eax\njmp eax\n```\n慢\n```assembly\nretn\n\
    ```\n\n### 25.4.1 常见指令替换\n\nlea\n\n指令的格式如下：\n\n```assembly\nlea dest, (XS):[reg1\
    \ + reg2 * x]\n```\n\n其中 XS 是段寄存器（SS, DS, CS 等），reg1 是基址地址，reg2 是变量偏移量，x 是乘法比例因子。\n\
    \n"
