    在书中，`cl.exe` 常用于生成 C 源代码的汇编列表文件。若要自己生成汇编列表文件，请使用语法：


    ```

    cl.exe /Fa*assembly file name <C source file>

    ```


    `/Fa*` 关是一个命令行选项，告诉编译器生成汇编列表文件。

    例如，以下命令行：


    ```

    cl.exe /Faest.asm Test.c

    ```


    将从 C 源文件 ''Test.c'' 生成名为 ''Test.asm'' 的汇编列表文件。注意，`/Fa` 关与输出文件名之间没有空格。


