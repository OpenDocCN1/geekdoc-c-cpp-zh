    \ Line 7\nmov eax, DWORD PTR _m$[esp-4]\npush esi\nmov esi, DWORD PTR _n$[esp]\n\
    cdq\nidiv esi\nmov ecx, edx\n```\n\n```asm\n; Line 8\ntest ecx, ecx\nje SHORT\
    \ $L563\n$L547:\n; Line 12\nmov eax, esi\ncdq\nidiv ecx\n; Line 13\nmov esi, ecx\n\
    mov eax, edx\ntest ecx, ecx\njne SHORT $L547\n$L563:\n; Line 10\nmov eax, esi\n\
    pop esi\n; Line 15\nret 0\n_EuclidGCD ENDP\n_TEXT ENDS\n```\n\nAltering the conditions\
    \ to maintain the same structure gives us:\n\n```c\nint EuclidGCD(int m, int n)\n\
    {\n    int q, r;\n    while(1)\n    {\n        r = m % n;\n        if(r != 0)\n\
    \            do {\n                m = n;\n                r = m % r;\n      \
    \          n = r;\n            }while(r != 0);\n    }\n    return n;\n}\n```\n\
    \nIt is up to the reader to compile this new 'optimized' code, and determine if\
    \ there is any performance increase. Try compiling this new code without optimizations\
    \ first, and then compare the assembly listings to the previous ones.\n\n## 24.5\
    \ Example: Instruction Pairings\n\nQ\nWhy does the dec/jne move faster than the\
    \ equivalent looppnz?\n\nA\nThe dec/jnz pair up in the different modules of the\
    \ netburst pipeline, so they can be executed simultaneously. With that off the\
    \ fact that the dec and jnz both require few cycles to execute, while the looppnz\
    \ (and all the loop instructions, for that matter) instruction takes more cycles\
    \ to complete. loop instructions are rarely seen out by good compilers.\n\n##\
    \ 24.6 Example: Avoiding Branches\n\nBelow is an assembly version of the expression\
    \ ? d : 0. There is no branching in the code, how does it work?\n\n```asm\n; ecx\
    \ = c and eds = d\n; eax will contain c ? d : 0 (eax = d if c is not zero, otherwise\
    \ eax\n; = 0)\nneg ecx\nsbb eax, eax\nand eax, edx\nret\n```\n\nThis is an example\
    \ of using various arithmetic instructions to avoid branching. The neg instruction\
    \ sets the carry flag if c is not zero; otherwise, it clears the carry flag. The\
    \ next line depends on this. If the carry flag is set, sbb results in eax = eax\
    \ - eax - 1 = 0xffffffff. Otherwise, eax = 0. Finally, performing and on this\
    \ result ensures that if ecx was not zero in the first place, eax will contain\
    \ edx, and zero otherwise.\n"
