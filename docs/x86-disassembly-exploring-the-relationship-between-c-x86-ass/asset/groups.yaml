    # 6 Linux


    # 6.1 Linux


    The **GNU/Linux operating system** is open source, but at the same time there
    is so much that constitutes ''GNU/Linux'' that it can be difficult to stay on
    top of all aspects of the system. Here we will attempt to boil down some of the
    most important concepts of the GNU/Linux Operating System, especially from a reverser''s
    standpoint


    # 6.2 System Architecture


    w:Linux¹


    The concept of ''GNU/Linux'' is mostly a collection of a large number of software
    components that are based off the Linux kernel. GNU/Linux is itself broken into
    a number of variants called ''distros'' which share some similarities, but may
    also have distinct peculiarities. In a general sense, all GNU/Linux distros are
    based on a variant of the Linux kernel. Since each user can edit and recompile
    their own kernel at will, and since some distros may make certain edits to their
    kernels, it is hard to proclaim any one version of any kernel as the ''standard''.
    Linux kernels are generally based off the philosophy that system configuration
    details should be stored in aptly-named, human-readable (and therefore human-editable)
    configuration files.


    The Linux kernel implements much of the core API, but certainly not all of it.
    Much API code is stored in external modules (although users have the option of
    compiling all these modules together into a "Monolithic Kernel")


    On top of the kernel generally runs one or more shells. Bash is one of the more
    popular shells, but many users prefer other shells, especially for different tasks.


    Beyond the shell, Linux distros frequently offer a GUI (although many distros
    do not have a GUI at all, usually for performance reasons).


