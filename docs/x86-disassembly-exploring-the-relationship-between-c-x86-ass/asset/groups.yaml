    }\n```\n\nNow, we can rearrange these snippets to a form that is much more complicated\
    \ (in assembly):\n\n```\nmain:\n  jmp FAP1\n  FBP3: call FuncBP3\n  jmp end\n\
    \  FBP1: call FuncBP1\n  jmp FBP2\n  FAP2: call FuncAP2\n  jmp FAP5\n  FBP2: call\
    \ FuncBP2\n  jmp FBP3\n  FAP1: call FuncAP1\n  jmp FAP2\n  FAP3: call FuncAP3\n\
    \  jmp FBP1\nend:\n```\n\nAs you can see, this is much harder to read, although\
    \ it perfectly preserves the program flow of the original code. This code is much\
    \ harder for a human to read, although it isn't hard at all for an automated debugging\
    \ tool (such as IDA Pro) to read.\n\n## 25.7 Opaque Predicate\n\nAn Opaque Predicate\
    \ is a predicate inside the code, that cannot be evaluated during static analysis.\
    \ This forces the attacker to perform a dynamic analysis to understand the result\
    \ of the type. Typically this is related to a branch instruction that is used\
    \ to prevent in static analysis the understanding which code path is taken.\n\n\
    ## 25.8 Code Encryption\n\nCode can be encrypted, just like any other type of\
    \ data, except that code can also work to encrypt and decrypt itself. Encrypted\
    \ programs cannot be directly disassembled. However, such a program can also not\
    \ be run directly because the encrypted opcodes cannot be interpreted properly\
    \ by the CPU. For this reason, an encrypted program must contain some method for\
    \ decrypting itself prior to operation.\n\nThe most basic method is to include\
    \ a small stub program that decrypts the remainder of the executable, and then\
    \ passes control to the decrypted routines.\n\n### 25.8.1 Disassembling Encrypted\
    \ Code\n\nTo disassemble an encrypted executable, you must first determine how\
    \ the code is being decrypted. Code can be decrypted in one of two primary ways:\n\
    \n- 1. All at once. The entire code portion is decrypted in a single pass, and\
    \ left decrypted during execution. Using a debugger, allow the decryption routine\
    \ to run completely, and then dump the decrypted code into a file for further\
    \ analysis.\n- 2. By Block. The code is encrypted in separate blocks, where each\
    \ block may have a separate encryption key. Blocks may be decrypted before use,\
    \ and re-encrypted again after use. Using a debugger, you can attempt to capture\
    \ all the decryption keys and then use those keys to decrypt the entire program\
    \ at once later, or you can wait for the blocks to be decrypted, and then dump\
    \ the blocks individually to a separate file for analysis.\n\n## 26 Debugger Detectors\n\
    \n### 26.1 Detecting Debuggers\n\nIt may come as a surprise that a running program\
    \ can actually detect the presence of an attached user-mode debugger. Also, there\
    \ are methods available to detect kernel-mode debuggers, although the methods\
    \ used depend in large part on which debugger is used.\n\n### 26.2 IsDebuggerPresent\n\
    \nThe Win32 API contains a function IsDebuggerPresent, which returns a boolean\
    \ if a debugger is attached. It may come as a surprise that a running program\
    \ can actually detect the presence of an attached user-mode debugger. \n\n```\n\
    if (IsDebuggerPresent()) {\n    TerminateProcess();\n}\n```\n\n### 26.3 PEB\n\n\
    The Process Environment Block (PEB) stores the IsDebuggerPresent flag. To access\
    \ it, the following code:\n\n```\nmov eax, fs:[30h]\nmov eax, [eax+2]\ntest eax,\
    \ eax\n```\n\n### 26.4 Time\n\nDebuggers can slow down execution. By measuring\
    \ the time elapsed between two points in code, a program can detect if it is being\
    \ debugged.\n\n### 26.5 SoftICE\n\nSoftICE is a kernel debugger. There are methods\
    \ to detect it, such as checking for specific registry keys.\n\n### 26.6 OllyDbg\n\
    \nOllyDbg is a popular debugger. There are many techniques to detect it, such\
    \ as checking for its breakpoints or specific artifacts.\n"
  mdcn: "\nxchg 交换两个寄存器、寄存器或内存地址的内容。值得注意的一点是，xchg 的运行速度比 move 指令快。因此，当源中的值不再需要保存时，可以使用\
    \ xchg 将值从源地址移动到目的地。\n\n例如，考虑以下代码：\n\n```\nmov ebx, eax\nmov eax, 0\n```\n\n在这里，eax\
    \ 中的值被存储在 ebx 中，然后向 eax 加载零值。我们可以使用 xchg 和 xor 来执行相同的操作：\n\n```\nxchg eax, ebx\n\
    xor eax, eax\n```\n\n你可能会惊讶地发现，第二个代码示例的运行速度明显比第一个快得多。\n\n## 25.5 混淆器 (Obfuscators)\n\
    \n市上有许多工具可以自动化代码混淆过程。这些产品将使用多种转换将代码段转换为可读性较低的格式，尽管这不会影响程序流本身（转换可能会增加代码大小或执行时间）。\n\
    \n## 25.6 代码变换\n\n代码变换是一种重新排列代码的方法，使其执行完全相同的任务，但变得更难以跟踪和反汇编。我们可以通过示例最好地演示这种技术。假设我们有两个函数，FunctionA\
    \ 和 FunctionB。这两个函数都由 3 个独立部分组成，并顺序执行。我们可以将其拆解如下：\n\n```\nFunctionA()\n{\n   \
    \ FuncPart1();\n    FuncPart2();\n    FuncPart3();\n}\n```\n\n```\nFunctionB()\n\
    {\n    FuncPart1();\n    FuncPart2();\n    FuncPart3();\n}\n```\n\n我们有一个主程序，它执行这两个函数：\n\
    \n```\nmain()\n{\n    FunctionA();\n    FunctionB();\n}\n```\n\n现在，我们可以将这些片段重新排列为复杂得多的形式（汇编）：\n\
    \n```\nmain:\n  jmp FAP1\n  FBP3: call FuncBP3\n  jmp end\n  FBP1: call FuncBP1\n\
    \  jmp FBP2\n  FAP2: call FuncAP2\n  jmp FAP5\n  FBP2: call FuncBP2\n  jmp FBP3\n\
    \  FAP1: call FuncAP1\n  jmp FAP2\n  FAP3: call FuncAP3\n  jmp FBP1\nend:\n```\n\
    \n如你所见，这难读得多，尽管它完美地保留了原始代码的程序流。这段代码对于人类来说很难阅读，但对于自动化调试工具（如 IDA Pro）来说一点也不难。\n\n\
    ## 25.7 不透明谓词 (Opaque Predicate)\n\n不透明谓词是代码中的一种判断，在静态分析期间无法进行求。这迫使攻击者进行动态分析以理解判断的结果。通常这与分支指令有关，用于防止静态分析理解程序执行了哪条代码路径。\n\
    \n## 25.8 代码加密\n\n代码可以加密，就像任何其他类型的数据一样，但代码还可以加密并解密自身。加密的程序无法直接反汇编。然而，此类程序无法直接运行，因为\
    \ CPU 无法正确解释加密的操作码。因此，加密程序在运行之前必须包含某种解密自身的方法。\n\n最基础的方法包含一个小的根程序（stub），解密可执行文件的剩余部分，然后将控制权交给解密后的程序。\n\
    \n### 25.8.1 反汇编加密代码\n\n要反汇编加密的可执行文件，你必须先确定代码是如何解密的。代码可以通过两种主要方式之一解密：\n\n- 1.\
    \ 一次解密。整个代码部分在一次通过中解密，并在执行期间保持解密状态。使用调试器允许解密程序完全运行，然后将解密后的代码导出到文件中进行进一步分析。\n-\
    \ 2. 分块解密。代码被加密在不同的块中，每个块可能有不同的加密密钥。块在使用前解密，在使用后重新加密。使用调试器，你可以尝试捕获所有解密密钥，然后使用这些密钥一次性解密整个程序，或者等待块解密，然后将每个块单独导出到单独的文件进行分析。\n\
    \n## 26 调试器检测器\n\n### 26.1 检测调试器\n\n你可能会感到惊讶，运行中的程序实际上可以检测到已附加的用户态调试器的存在。此外，还有方法可以检测内核态调试器，尽管使用的方法在很大程度上取决于使用哪个调试器。\n\
    \n### 26.2 IsDebuggerPresent\n\nWin32 API 包含一个 IsDebuggerPresent 函数，如果附加了调试器，它将返回一个布尔值。你可能会感到惊讶，运行中的程序实际上可以检测到已附加的用户态调试器的存在。\n\
    \n```\nif (IsDebuggerPresent()) {\n    TerminateProcess();\n}\n```\n\n### 26.3\
    \ PEB\n\n进程环境块（PEB）存储了 IsDebuggerPresent 标记。要访问它，可以使用代码：\n\n```\nmov eax, fs:[30h]\n\
    mov eax, [eax+2]\ntest eax, eax\n```\n\n### 26.4 时间\n\n调试器会减慢执行。通过测量代码中两点之间经过的时间，程序可以检测自己是否正在被调试。\n\
    \n### 26.5 SoftICE\n\nSoftICE 是一个内核调试器。有很多方法可以检测它，例如检查特定的注册表项。\n\n### 26.6 OllyDbg\n\
    \nOllyDbg 是一个流行的调试器。有很多技术可以检测它，例如检查它的断点或特定的产物。\n"
