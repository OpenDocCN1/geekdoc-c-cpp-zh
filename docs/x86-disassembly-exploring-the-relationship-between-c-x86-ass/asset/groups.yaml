  - "[PAGE 89]\n\nOn an entry of function, esp points to the return address pushed\
    \ on the stack by the call instruction (that is, previous contents of EIP). Any\
    \ argument in stack of higher address then EIP is pushed before the call is made;\
    \ in this example, the first argument is at offset +4 from esp (EIP is 4 bytes),\
    \ plus 4 more bytes before the EBP is pushed on the stack. Thus, at line 5, esp\
    \ saves to the frame pointer ebp, and arguments are located at addresses ESP+8\
    \ (x) and ESP+12 (y).\n\nFor CDECL, caller pushes arguments into stack in left\
    \ order. Because ret 0 is used, it is the caller who cleans up the stack.\n\n\
    As point of interest, note how lea is used in this function to simultaneously\
    \ perform the multiplication (ecx * 2), and the addition of that quantity to eax.\
    \ Unintuitive instructions like this will be explored further in the chapter of\
    \ unintuitive instructions.\n\n# 12.1.2 FASTCALL\n\n```\nint MyFunction(int x,\
    \ int y)\n{\n    return (x * 2) + (y * 3);\n}\n```\n\nbecomes:\n\n```\nPUBLIC\
    \                  MyFunction@S\nSEGMENT\n_y = -0                 ; size = 4\n\
    _x = -4                 ; size = 4\n@MyFunction@S PROC NEAR\n    _x = ecx\n  \
    \  _y = edx\n; Line 4\n    push                    ebp\n    mov              \
    \       ebp, esp\n    sub                     esp, 8\n    mov                \
    \     _y$[ebp], edx\n    mov                     _x$[ebp], ecx\n; Line 5\n   \
    \ mov                     ax, _y$[ebp]\nimul                   eax\n    mov  \
    \                   ecx, _x$[ebp]\nlea                     ax, [ecx+ecx*2]\n;\
    \ Line 6\n    mov                     esp, ebp\n    pop                     ebp\n\
    \    ret                     0\n@MyFunction@S ENDP\n_TEXT\nEND\n```\n\nThis function\
    \ was compiled with optimizations turned off. Here we see arguments are saved\
    \ in stack then fetched from stack, rather than used directly. This is because\
    \ the compiler wants a consistent way to use all arguments via stack access, not\
    \ only one compiler likes like that.\n\nChapter 25 on page 167"
