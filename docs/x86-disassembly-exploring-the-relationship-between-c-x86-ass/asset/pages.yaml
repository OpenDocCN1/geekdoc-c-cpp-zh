- pgno: 124
  md: '# #17 Variables


    # ##17.1 Variables


    We''ve already seen some mechanisms to create local storage on the stack. This
    chapter will talk about other variables, ''register'', and **global variables,
    static variables**, variables labeled **const**, **register**, and **volatile**.
    It will also consider some general techniques concerning variables, including
    accessor and setter methods (to borrow from OO terminology). This section may
    talk about memory breakpoints in a debugger to track memory I/O on a variable.


    # ##17.2 How to Spot a Variable


    Variables come in 2 distinct favors: those that are created on the stack (local
    variables), and those that are accessed via a hardcoded memory address (global
    variables). Any memory that is accessed via a hardcoded address is usually a global
    variable. Variables that are accessed as an offset from esp, or ebp are frequently
    local variables.


    # ###Hardcoded address


    Anything hardcoded is a value that is stored-as-is in the binary, and is not changed
    at runtime. For instance, the value 0x2054 is hardcoded, whereas the current value
    of variable X is not hard-coded and may change at runtime.


    Example of a hardcoded address:


    ```

    mov eax, [0x77651010]

    ```


    OR:


    ```

    mov eax, 0x77651010

    mov eax, [ecx]

    ```


    Example of a non-hardcoded (softcoded?) address:


    ```

    mov eax, [esp + 4]

    add eax, ebx

    mov eax, [ecx]

    ```


    In the last example, the value of ecx is calculated at run-time, whereas in the
    first 2 examples, the value is the same every time. RVAs are considered hard-coded
    addresses, even though the loader needs to "fix them up" to point to the correct
    locations.'
  merge: -1
  img_proc: true
- pgno: 125
  md: "# 17.3 .BSS and .DATA sections\n\nBoth .bss and .data sections contain values\
    \ which can change at run-time (variables). Typically, variables initialized to\
    \ a non-zero value in the source are allocated in the .data section (e.g. 'int\
    \ a = 10;'); Variables that are not initialized, or initialized with a zero value,\
    \ can be allocated to the .bss section (e.g. 'int arr[10];'). Because all values\
    \ of .bss variables are guaranteed to be at the start of the program, there is\
    \ no need for the linker to allocate space in the binary file. Therefore, bss\
    \ sections do not take space in the binary file, regardless of their size.\n\n\
    # 17.4 \"Static\" Local Variables\n\nLocal labeled static maintain their value\
    \ across function calls, and therefore cannot be created on the stack like other\
    \ local variables. How are static variables created? Let's take a simple example\
    \ function:\n\n```\nvoid MyFunction(int a)\n{\n    static int x = 0;\n    printf(\"\
    my number: %d\\n\", x);\n    printf(\"%d\\n\", a, x);\n}\n```\n\nCompiling to\
    \ a library with cl.exe gives us the following code:\n\n```\n.bss            \
    \    SEGMENT\n7x071??MyFunction@@089 DD 01IH DUP (?)    ;MyFunction::2::z\n.BSS\
    \                ENDS\n.DATA               SEGMENT\n$05796              DB   \
    \          ,my number: OOH\n$05797              DB             ,Xd, Xd0, OAH,\
    \ OOH\n.DATA               ENDS\nPUBLIC             _MyFunction\nEXTRN       \
    \        _printf:NEAR   /Dat\n; Function compile flags: /Dat\n               \
    \     SEGMENT\n.TEXT\n_$a = 8                             ;size = 4\n_MyFunction\
    \ PROC NEAR\n; Line 4\n    push               ebp\n    mov                ebp,\
    \ esp\n; Line 6\n    push               OFFSET:$SG796\n    call              \
    \ _printf\n    add                esp, 4\n; Line 7\n    push               eax,\
    \ DWORD PTR ??MyFunction@@089\n    push\nmov                ecx, DWORD PTR _a{ebp}\n\
    \    push\npush\npush\npush               OFFSET:$SG797\n    call            \
    \   _printf\n    add                esp, 12             ;0000000cH\n; Line 8\n\
    \    pop                ebp\n    ret                0\n_MyFunction ENDP\n.TEXT\
    \               ENDS\n```\n\n120"
  merge: -1
  img_proc: true
