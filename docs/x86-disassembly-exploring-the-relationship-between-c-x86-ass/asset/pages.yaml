  md: "# # 19 Data Structures\n\n# ## 19.1 Data Structures\n\nFew programs can work\
    \ by using simple memory storage; most need to utilize complex data objects, including\
    \ **pointers, arrays, structures**, and other complicated types. This chapter\
    \ will talk about about how compilers implement complex data objects, and how\
    \ the reverser can identify these objects.\n\n# ## 19.2 Arrays\n\nArrays are simply\
    \ a storage scheme for multiple data objects of the same type. Data objects are\
    \ stored sequentially, often as an offset from a pointer to the beginning of the\
    \ array. Consider the following C code:\n\n```\nx = array[25];\n```\n\nWhich is\
    \ identical to the following asm code:\n\n```\nmov ebx, $array\nmov eax, [ebx\
    \ + 25]\nmov $x, eax\n```\n\nNow, consider the following example:\n\n```\nint\
    \ MyFunction()\n{\n  int array[20];\n  ...\n```\n\nThis (roughly) translates into\
    \ the following asm pseudo-code:\n\n```\n:MyFunction!\npush ebp\nmov esp, esp\n\
    sub esp, 80 ;the whole array is created on the stack!!!\nlea eax, [esp + 0] ;pointer\
    \ to the array is saved in the array\n...\n```\n\nThe entire array is created\
    \ on the stack, and the pointer to the bottom of the array is stored in the variable\
    \ 'array'. An optimizing compiler could ignore the last instruction, and simply\
    \ refer to the array via a +0 offset from esp (in this example), but we will do\
    \ things verbely.\n\nLikewise, consider the following example:"
