- pgno: 116
  md: "# 15.3 While Loops\n\nWhile loops look almost as simple as a Do-While loop,\
    \ but in reality they aren't as simple at all. Let's examine a generic while-loop:\n\
    \n```\nwhile(x)\n{\n  // loop body\n}\n```\n\nWhat does this loop do? First, the\
    \ loop checks to make sure that x is true. If x is not true, the loop is skipped.\
    \ The body is then executed, by another check: if x is still true? If x is true,\
    \ execution jumps back to the top of the loop, and execution continues. Keep in\
    \ mind that there needs be a jump to the bottom of the loop (get back up to the\
    \ top), but it makes no sense to jump back to the top, reset the condition, and\
    \ then jump to the bottom of the loop if the condition is found to be false. The\
    \ while-loop then, performs the following steps:\n\n+   1. check the condition;\
    \ if it is false, go to the end\n2. perform the loop body\n3. check the condition,\
    \ if it is true, jump to 2.\n4. if the condition is not true, full-through the\
    \ end of the loop.\n\nHere is a while-loop in C code:\n\n```\nwhile(x <= 10)\n\
    {\n  x++;\n}\n```\n\nAnd then there is that same loop translated into assembly:\n\
    \n```\nmov eax, %x\ncmp eax, 0xA\njg end\nbeginning:\ninc eax\ncmp eax, 0xA\n\
    jile beginning\nend:\n```\n\nIf we translate that assembly code back into C, we\
    \ would get the following code:\n\n```\nif(x <= 10) //remember: in If statements,\
    \ we reverse the condition\nfrom the asm\n{\n  do\n    x++;\n  } while(x <= 10)\n\
    }\n```\n\nSee why we covered the Do-While loop first? Because the While-loop becomes\
    \ a Do-While when it gets assembled."
  merge: -1
  img_proc: true
- pgno: 117
  md: "# 15.4 For Loops\n\nWhat is a For-Loop? In essence, it's a While-Loop with\
    \ an initial state, a condition, and an iterative instruction. For instance, the\
    \ following generic For-Loop:\n\n![](img/9b6491f497eec80c9bc0146581237790_117_0.png)\n\
    \nFigure 13\n\ngets translated into the following pseudocode while-loop:\n\n```\n\
    initialization;\nwhile(condition)\n{\n  action;\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "increment;\n}\nWhich in turn gets translated into the following Do-While Loop:\n\
    \n```\ninitialization;\nif(condition)\n{\ndo\n    action;\n    increment;\n} while(condition);\n\
    ```\n\nNote that often in for() loops you assign an initial constant value in\
    \ A (for example x = 0), and then compare that value with another constant in\
    \ B (for example x < 10). Most optimizing compilers will be able to notice that\
    \ the first time x IS less than 10, and therefore there is no need for the initial\
    \ if(B) statement. In such cases, the compiler will simply generate the following\
    \ sequence:\n\n```\ninitialization;\ndo{\n    action\n    increment;\n} while(condition);\n\
    ```\n\nrendering the code indistinguishable from while() loop.\n\n# 15.5 Other\
    \ Loop Types\n\nC has only Do-While, While, and For Loops, but some other languages\
    \ may very well implement their own types. Also, a good C-Programmer could easily\
    \ *home brew* a new type of loop using a series of good macros, so they bear some\
    \ consideration:\n\n# 15.5.1 Do-Until Loop\n\nA common Do-Until Loop will take\
    \ the following form:\n\n```\ndo\n{\n    //loop body\n} until(x);\n```\n\nwhich\
    \ essentially becomes the following Do-While loop:\n\n```\ndo\n{\n    //loop body\n\
    } while(!x);\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: "# 15.5.2 Until Loop\n\nLike the Do-Until loop, the standard Until-Loop looks\
    \ like the following:\n\n```\nuntil(x)\n{\n  //loop body\n}\n```\n\nwhich (likewise)\
    \ gets translated to the following While-Loop:\n\n```\nwhile(!x)\n{\n  //loop\
    \ body\n}\n```\n\n# 15.5.3 Do-Forever Loop\n\nA Do-Forever loop is simply an unqualified\
    \ loop with a condition that is always true. For instance, the following pseudo-code:\n\
    \n```\ndofever\n{\n  //loop body\n}\n```\n\nwill become the following while-loop:\n\
    \n```\nwhile(1)\n{\n  //loop body\n}\n```\n\nWhich can actually be reduced to\
    \ a simple unconditional jump statement:\n\n```\nbeginning:\n  ;loop body\njmp\
    \ beginning\n```\n\nNotice that some non-optimizing compilers will produce nonsensical\
    \ code for:\n\n```\nmov ax, 1\ncmp ax, 1\nje label\nbeginning:\n  ;loop body\n\
    cmp ax, 1\nje beginning\nloopend:\n```\n\nNotice that a lot of the comparisons\
    \ here are not needed since the condition is a constant.\nMost compilers will\
    \ optimize cases like this."
