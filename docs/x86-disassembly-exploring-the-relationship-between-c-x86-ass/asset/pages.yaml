- pgno: 176
  md: "xchg exchanges the contents of two registers, a register or a memory address.\
    \ A noteworthypoint is the fact that xchg operates faster than a move instruction.\
    \ For this reason, xchg will be used to move a value from a source to a destination,\
    \ when the value in the source no longer needs to be saved.\n\nAs an example,\
    \ consider this code:\n\n```\nmov ebx, eax\nmov eax, 0\n```\n\nHere, the value\
    \ in eax is stored in ebx, and then eax is loaded with the value zero. We can\
    \ perform the same operation, but using xchg and xor instead:\n\n```\nxchg eax,\
    \ ebx\nxor eax, eax\n```\n\nIt may surprise you to learn that the second code\
    \ example operates significantly faster than the first one does.\n\n# 25.5 Obfuscators\n\
    \nThere are a number of tools on the market that will automate the process of\
    \ code obfuscation. These products will use a number of transformations to turn\
    \ a code snippet into a less-readable format, although it will not affect the\
    \ program flow itself (although the transformations may increase code size or\
    \ execution time).\n\n# 25.6 Code Transformations\n\nCode transformations are\
    \ a way of reordering code that it performs exactly the same task but becomes\
    \ more difficult to trace and disassemble. We can best demonstrate this technique\
    \ by example. Let's say that we have 2 functions, FunctionA and FunctionB. Both\
    \ of these two functions are comprised of 3 separate parts, which are performed\
    \ in order. We can break this down as such:\n\n```\nFunctionA()\n{\n    FuncPart1();\n\
    \    FuncPart2();\n    FuncPart3();\n}\n```\n\n```\nFunctionB()\n{\n    FuncPart1();\n\
    \    FuncPart2();\n    FuncPart3();\n}\n```\n\nAnd we have our main program, that\
    \ executes the two functions:\n\n```\nmain()\n{\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\nFunctionA();\nFunctionB();\n```\n\nNow, we can rearrange these snippets\
    \ to a form that is much more complicated (in assembly):\n\n```\nmain:\n  jmp\
    \ FAP1\n  FBP3: call FuncBP3\n  jmp end\n  FBP1: call FuncBP1\n  jmp FBP2\n  FAP2:\
    \ call FuncAP2\n  jmp FAP5\n  FBP2: call FuncBP2\n  jmp FBP3\n  FAP1: call FuncAP1\n\
    \  jmp FAP2\n  FAP3: call FuncAP3\n  jmp FBP1\nend:\n```\n\nAs you can see, this\
    \ is much harder to read, although it perfectly preserves the program flow of\
    \ the original code. This code is much harder for a human to read, although it\
    \ isn\\u20t hard at all for an automated debugging tool (such as IDA Pro) to read.\n\
    \n# 25.7 Opaque Predicate\n\nAn Opaque Predicate is a predicate inside the code,\
    \ that cannot be evaluated during static analysis. This forces the attacker to\
    \ perform a dynamic analysis to understand the result of the type. Typically this\
    \ is related to a branch instruction that is used to prevent in static analysis\
    \ the understanding which code path is taken.\n\n# 25.8 Code Encryption\n\nCode\
    \ can be encrypted, just like any other type of data, except that code can also\
    \ work to encrypt and decrypt itself. Encrypted programs cannot be directly disassembled.\
    \ However, such a program can also not be run directly because the encrypted opcodes\
    \ cannot be interpreted properly by the CPU. For this reason, an encrypted program\
    \ must contain some method for decrypting itself prior to operation.\n\nThe most\
    \ basic method is to include a small stub program that decrypts the remainder\
    \ of the executable, and then passes control to the decrypted routines.\n\n# 25.8.1\
    \ Disassembling Encrypted Code\n\nTo disassemble an encrypted executable, you\
    \ must first determine how the code is being decrypted. Code can be decrypted\
    \ in one of two primary ways:"
  merge: -1
  img_proc: true
- pgno: 178
  md: '+   1. All at once. The entire code portion is decrypted in a single pass,
    and left decrypted during execution. Using a debugger, allow the decryption routine
    to run completely, and then dump the decrypted code into a file for further analysis.

    2. By Block. The code is encrypted in separate blocks, where each block may have
    a separate encryption key. Blocks may be decrypted before use, and re-encrypted
    again after use. Using a debugger, you can attempt to capture all the decryption
    keys and then use those keys to decrypt the entire program at once later, or you
    can wait for the blocks to be decrypted, and then dump the blocks individually
    to a separate file for analysis.'
  merge: -1
  img_proc: true
