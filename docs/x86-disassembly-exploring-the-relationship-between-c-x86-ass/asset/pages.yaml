  md: '# Signed and Unsigned Variables


    Normally when assembly lists are posted in wikibook, most of the code gibberish
    is discarded to aid readability, in this instance, "gibberish" contains the answer
    we are looking for. As can be clearly seen, this function creates a standard stack
    frame, and it doesn''t create local variables on the stack. In the interests of
    being complete, we will take baby-by-steps, and work to the conclusion logically.


    In the code for Line 7, there is a call to `_printf`. Printf is a standard libc
    function, and it therefore be assumed to be cdecl calling convention. Three arguments
    are pushed onto the stack before `_printf` is called:


    +   - DWORD PTR ?=0717?MyFunction@@0@9

    - DWORD PTR _$[ebp]

    - OFFSET FLAT=$SG797


    The second one, `_a$[ebp]` is partially defined in this assembly instruction:


    ```

    _a$ = 8

    ```


    And therefore `_a$[ebp]` is the variable located at +8 from eb, or the first variable
    to the function. OFFSET FLAT=$SG797 likewise is declared in the assembly listing
    as such:


    ```

    SG797              DB      ,Xd, ?4a, OaH, 08

    7?=0717?MyFunction@@0@99 DD 01H DUP (?)

    ENDS

    ```


    If you have your ASCII table then you will notice that 0aH = 0xA = ''\n''. OFFSET
    FLAT=$SG797 is the format string to our print statement. Our last option is then
    the mysterious-looking "?x@71?MyFunction@@0@9", which is defined in the following
    assembly code section:


    This shows that the Microsoft C compiler creates static variables in the .bss
    section. This might not be the case for all compilers, but the lesson is the same:
    local variables are created and used in a very similar, if not the exact same,
    manner as global values. In fact, as far as the reverser is concerned, they are
    usually interchangeable. Remember, the only real difference between static variables
    and global variables is the idea of ''scope'', which is only used by the compiler.


    # 17.5 Signed and Unsigned Variables


    Integer formatted variables, such as int, char, short and long may be declared
    or unsigned variables in the C source code. There are two differences in how variables
    are treated:


    +   - Signed variables use instructions such as add, sub. Unsigned variables use
    unsigned arithmetic instructions such as addi, subi.'
