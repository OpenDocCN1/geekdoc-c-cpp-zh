- pgno: 8
  md: '# # Assemblers and Compilers


    # ## 1.1 Assemblers


    Assemblers¹ are significantly simpler than compilers, and are often implemented
    to simply translate the assembly code to binary code via one-to-one correspondence.
    Assemblers rarely optimize beyond choosing the shortest form of an instruction
    or filling delay slots.


    Because assembly is just a simple process, disassembly can often be as just as
    simple. Assembly instructions and machine code words have a one-to-one correspondence,
    so each machine code word will exactly map to one assembly instruction. disassembly
    has some difficulties which cannot be accounted for using simple code-word lookups.
    We will introduce assemblers here, and talk about disassembly later.


    # ## 1.2 Assembler Concepts


    Assemblers, on a most basic level, translate assembly instructions into machine
    code a one to one correspondence. They can also translate variable names into
    hard-coded memory addresses and labels in their relative code addresses.


    Assemblers, in general, do not perform code optimization. The machine code that
    comes out of an assembler is equivalent to the assembly instructions that go into
    the assembler. Some assemblers have high-level capabilities in the form of Macros.


    Some information about the program is lost during the assembly process. First
    and foremost, program data is stored in the raw binary format as the machine code
    instructions. This means that it can be difficult to determine which parts of
    the program are actually instructions. Notice that you can disassemble raw data,
    but the resultant assembly code will be nonsensical. Second, textual information
    from the assembly source code file, such as variable names, labels and comments
    are all destroyed during assembly. When you disassemble the code, the instructions
    will be the same, but all the other helpful information will be lost. The code
    will be accurate, but more difficult to read.


    Compilers, as we will see later, cause even more information to be lost, and decompiling
    is often so difficult and convoluted as to become nearly impossible to do accurately.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Assemblers and Compilers


    # 1.3 Intel Syntax Assemblers


    Because of the pervasiveness of Intel-based IA-32 microprocessors in the home
    PC market, the majority of assembly work done (and the majority of assembly work
    considered in this wikbook) is x86-based. Many of these assemblers (or new versions
    of them) can handle amd64/x86_64/EMT64 code well, although this wikbook will focus
    primarily on 32 bit (x86/IA-32) code examples.


    # 1.3.1 MASM


    MASM is Microsoft''s assembler, an abbreviation for ''Macro Assembler.'' However,
    many people use it as an acronym for ''Microsoft Assembler,'' and the difference
    isn''t a problem at all. MASM has a powerful macro feature, and is capable of
    writing very low-level syntax, and pseudo-high-level code with its macro feature.
    MASM 6.15 is currently available as a free-download from Microsoft, and MASM 7.xx
    is currently available as part of the Microsoft platform DDK.


    +   * MASM uses Intel Syntax.

    * MASM is used by Microsoft to implement some low-level portions of its Windows
    Operating systems.

    * MASM, contrary to popular belief, has been in constant development since 1980,
    and is upgraded on a needs-basis.

    * MASM has always been made compatible by Microsoft to the current platform, and
    executable file types.

    * MASM currently supports all Intel instruction sets, including SSE2.


    Many users love MASM, but many still dislike the fact that it isn''t portable
    to other systems.


    # 1.3.2 TASM


    TASM, Borland''s ''Turbo Assembler,'' is a functional assembler from Borland that
    integrates seamlessly with Borland''s other software development tools. Current
    release version is 5.0. TASM syntax is very similar to MASM, although it has an
    ''IDEAL'' mode that many users prefer. TASM is not free.


    # 1.3.3 NASM


    NAS, the ''Net Assembler,'' is a free, portable, and retargetable assembler that
    works on both Windows and Linux. It supports a variety of Windows and Linux executable
    file formats, and outputs pure binary. NASM is not as ''mature'' as either MASM
    or TASM, but is:


    +   * more portable than MASM

    * cheaper than TASM

    * strives to be very user-friendly'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'NASM comes with its own disassembler, and supports 64-bit (x86-64/x64/AMD64/Intel)
    CPUs.


    NASM is released under the LGPL.


    # 1.3.4 FASM


    FASM, the ''Flat Assembler'' is an open source assembler that supports x86, and
    IA-64 Intel architectures.


    # 1.4 (x86) AT&T Syntax Assemblers


    AT&T syntax for x86 microprocessor assembly code is not as common as Intel-syntax,
    the GNU Assembler (GAS) uses it, and it is the *de facto* assembly standard on
    Unix and Unix-like operating systems.


    # 1.4.1 GAS


    The GNU Assembler (GAS)² is the default back-end of the GNU Compiler Collection
    (GCC) suite. As such, GAS is as portable and retargetable as GCC. However, GAS
    uses AT&T syntax for its instructions as default, which some users find less readable
    than Intel syntax. Newer versions of gas can be switched to Intel syntax with
    the directive .intel_syntax noprefix.


    GAS is developed specifically to be used as the GCC backend. Because GCC always
    feels syntactically correct code, GAS has minimal error checking.


    GAS is available as part of the GCC package or the GNU binutils package, http://www.gnu.org/software/binutils/


    # 1.5 Other Assemblers


    # 1.5.1 HLA


    HLA³, short for ''High Level Assembler'' is a project spearheaded by Randall Hyde
    to create an assembler with high-level syntax. HLA works as a front-end to other
    compilers such as FASM (the default), MASM, NASM, and GAS. HLA supports ''common''
    assembly language instructions, but also implements several of higher-level constructs
    such as loops, if-then-else branching, and functions. HLA comes complete with
    a comprehensive standard library.


    Since HLA works as a front-end to another assembler, the programmer must have
    another assembler installed to assemble programs with HLA. HLA code output therefore,
    is as good


