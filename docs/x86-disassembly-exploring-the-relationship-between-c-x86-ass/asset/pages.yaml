  md: "1. In the function body, the ret instruction has an (optional) argument that\
    \ indicates\nhhow many bytes to pop off the stack when the function returns.\n\
    2. STDCALL functions are name-decorated with a leading underscore, followed by\
    \ @,\\and then the number (bytes) of arguments passed on the stack. This number\
    \ will\nbe a multiple of 4, on a 32-bit aligned machine.\n\n# 11.3.3 FASTCALL\n\
    \nThe FASTCALL calling convention is not completely standard across all compilers,\
    \ so it\nshould be used with caution. In FASTCALL, the first 2 or 3 32-bit (or\
    \ smaller) arguments\nare passed in registers, with the most commonly used registers\
    \ being edx, eax, and ecx.\nAdditional arguments, or arguments larger than 4-bytes\
    \ are passed on the stack, often in\nRight-to-Left order (similar to DCECL). The\
    \ calling function frequently is responsible\nfor cleaning the stack, if needed.\n\
    \nBecause of the ambiguities, it is recommended that FASTCALL be used only in\
    \ situations\n 1, 2, or 32-bit arguments, where speed is essential.\n\nThe following\
    \ C function:\n\n```\n_fastcall int MyFunction3(int a, int b)\n{\nreturn a + b;\n\
    }\n```\n\nand the following C call:\n\n```\nx = MyFunction3(2, 3);\n```\n\nWill\
    \ produce this following assembly code fragments for the called, and the calling\
    \ functions,\nrespectively:\n\n```\n@MyFunction3\npush ebp\nmov eax, esp ;many\
    \ compilers create a stack frame even if it isn', t\nused\nadd eax, edx ;a is\
    \ in eax, b is in edx\npop ebp\nret\n```\n\nand\n\n```\n;the calling function\n\
    mov eax, 2\nmov edx, 3\ncall @MyFunction3\n```\n\nThe name decoration for FASTCALL\
    \ prepends an @ to the function name, and follows\nt function name with @x, where\
    \ x is the number (bytes) of arguments passed to the\nfunction.\n\nMany compilers\
    \ still produce a stack frame for FASTCALL functions, especially in situations\n\
