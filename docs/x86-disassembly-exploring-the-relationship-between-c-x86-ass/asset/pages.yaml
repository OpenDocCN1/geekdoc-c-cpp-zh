    \ 3\n                                ENDS\nTEXT            _\nx$ = 8         \
    \                            ; size = 8\ny$ = 16                             \
    \        ; size = 8\nz$ = 24                                     ; size = 4\n\
    @MyFunction2020 PROC NEAR\n; Line 7\n    mov             ebp, ebp\n; Line 8\n\
    \    fld             QWORD PTR y$[ebp]\n    fadd            QWORD PTR _[__real83ff000000000000]\n\
    \    fld             QWORD PTR _[__real8400000000000000]\n    fmul           \
    \ QWORD PTR ST(1)\n    fld             QWORD PTR _[ebp]\n    fadd            QWORD\
    \ PTR _[__real8480000000000000]\n    fmul            ST(1), ST(0)\n; Line 9\n\
    \    pop             ebp\n    set             20                             \
    \ ; 0000014H\n@MyFunction2020 END\nTEXT            ENDS\n```\n\nWe can see that\
    \ this function takes 20 bytes of worth, because the @20 decoration at the end\
    \ of the function name. This makes sense, because the function is taking **double**\
