  md: "Negating a comparison may be tricky if you're not paying attention. Here are\
    \ the correct\ndual forms:\n\n| Instruction | Meaning |\n|---|-|\n| JNE | Jump\
    \ if not equal |\n| JE | Jump if equal |\n| JG | Jump if greater |\n| JLE | Jump\
    \ if less than or equal |\n| JL | Jump if less |\n| JGE | Jump if greater or equal\
    \ |\n\nAnd here are some examples.\n\n```\nmov eax, $x         //move into eax\n\
    cmp eax, $y          //compare eax with y\njg end             //jump if greater\
    \ than\ninc eax\nmove $x, eax        //increment x\nend:\n```\n\nIs produced by\
    \ these statements:\n\n```\nif (x < y) {\n    x++;\n}\n```\n\nAs you can see,\
    \ x is incremented only if it is **less than or equal to** y. Thus, if it is greater\n\
    y than, it will not be incremented in the assembler code. Similarly, the C code\n\
    \n```\nif (x < y) {\n    x++;\n}\n```\n\nproduces this assembler code:\n\n```\n\
    mov eax, $x         //move into eax\ncmp eax, $y          //compare eax with y\n\
    jge end             //jump if greater than or equal\nto\ninc eax\nmove $x, eax\
    \        //increment x\nend:\n```\n\nX is incremented in the C code only if it\
    \ is **less than** y, so the assembler now jumps if\nit's greater than or equal\
    \ to y. This kind of takes practice, so we will try to include\nlots of examples\
    \ in this section.\n\n# ## 13.3 If-Then-Else\n\nLet us now look at a more complicated\
    \ case: the **If-Then-Else** instruction."
