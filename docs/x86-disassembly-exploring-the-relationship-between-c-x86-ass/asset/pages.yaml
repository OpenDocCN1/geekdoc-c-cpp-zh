  md: '# 11.4 C++ Calling Convention


    C++ requires that non-static methods of a class be called by an instance of the
    class. Therefore it uses its standard calling convention to ensure that pointers
    to the object are passed to the function: THISCALL.


    # 11.4.1 THISCALL


    In THISCALL, the pointer to the class object is passed in ccx, the arguments are
    passed Right-to-Left on the stack, and the return value is passed in eax.


    For instance, the C++ instruction:


    ```

    MyObj.MyMethod(a, b, c);

    ```


    Would form the following asm code:


    ```

    mov ecx, MyObj

    push c

    push b

    push a

    call _MyMethod

    ```


    At least, *it would look like* the assembly code above if it weren''t for **name
    mangling**


    # 11.4.2 Name Mangling


    w:Name mangling? Because of the complexities inherent in function overloading,
    C++ are nearly name-decorated to the point that people often refer to the process
    as ''Name Mangling.'' Unfortunately C++ compilers are free to do the name-mangling
    differently since the standard does not enforce a convention. Additionally, other
    issues such as exception handling are also not standardized.


    Since every compiler does the name-mangling differently, this book will not spend
    too much time discussing the specifics of the algorithm. Notice that in many cases,
    it''s possible to determine which compiler created the executable by examining
    the specifics of the name-mangling format. We will not cover this topic in much
    depth in this book, however.


    Here are a few general remarks regarding THISCALL name-mangled functions:


    +   * They are recognizable on sight because of their complexity when compared
    to CDECL, FASTCALL, and STDCALL function declarations

    * They sometimes include the name of function class''s.

    * They almost always include the number and type of the arguments, so that overloaded
    functions can be differentiated by the arguments passed to it.


    Here is an example of a C++ class and function declaration:


    ```

    3 http://en.wikipedia.org/wiki/Name%20mangling

