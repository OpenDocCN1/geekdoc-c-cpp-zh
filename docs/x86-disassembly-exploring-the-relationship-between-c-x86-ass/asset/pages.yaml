  md: "# Float to Int Conversions\n\n```\n.long 1073741824\n.align 8 0\nLC1:\n.long\
    \ 1074266112\n.global def @MyFunction320:\n.cli 2; .type 32; .endef\n@MyFunction320:\n\
    \    ebp\n    pushl\n    mov %esp, %ebp\n    sub $16, %esp\n    fld 8(%ebp)\n\
    \    fstpl -8(%ebp)\n    fld 16(%ebp)\n    fstpl -16(%ebp)\n    fld -8(%ebp)\n\
    \    faddp %xst, %x1\n    fld -16(%ebp)\n    LC0:\n    faddp %xst, %x1\nfmul\n\
    \    fld 24(%ebp)\nLC10:\n    faddp %xst, %x1\nfmul\n    faddp %xst, %x1\nleave\n\
    ret $20\n```\n\nHere we can also see, after all the opening nonsense, that [eb\
    \ - 8] (originally [eb + 8]) is value x, and that [eb - 24] (originally [eb -\
    \ 24]) is value z. These parameters are therefore passed right-to-left. Also,\
    \ we can deduce from the final fmul instruction that the result is passed in ST0.\
    \ Again, the STDCALL function cleans its own stack, as we would expect.\n\n# 21.2.4\
    \ Conclusions\n\nFloating point values are passed as parameters on the stack,\
    \ and are passed on the FPU stack as results. Floating point values do not get\
    \ put into the general-purpose integer registers (eax, ebx, ebx, etc.), so STDCALL\
    \ functions that only have floating point parameters collapse into STDCALL instead.\
    \ **double** values are 8-bytes wide, and therefore will take up 8-bytes on the\
    \ stack. **float** values however, are only 4-bytes wide.\n\n# 21.3 Float to Int\
    \ Conversions\n\n# 21.4 FPU Compares and Jumps"
