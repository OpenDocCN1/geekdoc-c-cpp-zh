    \ change during the execution of the current function. In this happens when:\n\
    \n+   * parameters are passed into another function;\n* the pseudo-function `alloca()`\
    \ is used.\n\n[FIXME: When parameters are passed into another function the esp\
    \ changing is not an issue. When the function returns the esp will be back to\
    \ its old value. Why does ebp help there. This needs better explanation. (The\
    \ real explanation is, ESP is not really needed: http://blogs.msdn.com/larryosterman/archive/2007/03/12/fpo.aspx)\
    \ This means that the value of esp cannot be reliably used to determine (the appropriate\
    \ offset) the memory location of a specific variable. To solve this, many compilers\
    \ access local variables using negative offsets from the ebp registers. This allows\
    \ us to assume that the same offset is always used to access the same variable\
    \ (or parameter). For this reason, the ebp register is called the **frame pointer**,\
    \ or FP.\n\n# 9.3 Standard Exit Sequence\n\nThe Standard Exit Sequence must undo\
    \ the things that the Standard Entry Sequence does. For this, the Standard Exit\
    \ Sequence must perform the following tasks, in the following order:\n\n+   1.\
    \ Remove space for local variables, reverting esp to its old value.\n2. Restore\
    \ the old value of ebp to its old value, which is on top of the stack.\n3. Return\
    \ to the calling function with a `ret` command.\n\nAs an example, the following\
    \ C code:\n\n```\nvoid myFunction3(int x, int y, int z) {\n    int a, int b, int\
    \ c;\n    ...\n    return;\n}\n```\n\nWill create the following assembly code:\n\
    \n```\n_MyFunction3:\npush ebp\nmov ebp, esp\nsub esp, 12 ; sizeof(a) + sizeof(b)\
    \ + sizeof(c)\nz = [ebp + 8], y = [ebp + 12], z = [ebp + 16]\na = [ebp - 4] =\
    \ {ebp - 8}, b = [ebp - 8], c = [esp - 4}\n```"
