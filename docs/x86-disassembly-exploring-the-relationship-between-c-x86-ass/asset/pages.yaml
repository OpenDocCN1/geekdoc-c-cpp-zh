    **Figure 6** An ELF file has two views: the program header shows the segments
    used at run-time, while the section header lists the set of sections of the binary.


    Each ELF file is made up of one ELF header, followed by file data. The file data
    can include:


    +   - Program header table, describing zero or more sections

    - Section header table, describing zero or more sections

    - Data referred to entries in the program or section header table


    The segments contain information that is necessary for runtime execution of the
    file, while sections contain important data for linking and relocation. Each byte
    in the file is taken by no more than one section at a time, but there can be orphan
    bytes, which are not covered by a section. In the normal case of a Unix executable
    one or more sections are enclosed in one segment.


