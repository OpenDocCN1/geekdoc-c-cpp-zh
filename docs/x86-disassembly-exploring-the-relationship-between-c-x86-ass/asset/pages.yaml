- pgno: 53
  md: '# 5.7 Imports and Exports - Linking to other modules


    # 5.7.1 What is linking?


    Whenever a developer writes a program, there are expected to be implemented already,
    are a number of subroutines and functions which are saving the writer hassle of
    having to write more code or work with complex data structures. Instead, the coder
    only need declare one call to the subroutine, and the linker will decide what
    happens next.


    There are two types of linking that can be used: static and dynamic. This precompiled
    code can be inserted into the final executable to implement a function, saving
    the programmer lot of time. In contrast, dynamic linking allows subroutine to
    reside in a different file (or module), which is loaded at runtime by the operating
    system. This is also known as a "Dynamically linked library", or DLL library is
    a module containing a set of functions or values that can be exported. This is
    different from the executable, which imports from libraries to do what it wants.
    From here on, "module" means any of PE format, and a "Library" is any module which
    exports and imports functions and values.


    +   Dynamically linking has the following benefits:

    - It saves space, if more than one executable links to the library module

    - Allows instant updating of routines, without providing new executables for all
    applications

    - Can save space in memory by mapping the code of the library into more than one
    process

    - Increases abstraction of implementation. The method by which an action is achieved
    can be modified without reprogramming of applications. This is extremely useful
    for backward compatibility with operating systems.


    This section discusses how this is achieved using the PE file format. An important
    point to note at this point is that anything can be imported or exported between
    modules, including variables as well as subroutines.


    # 5.7.2 Loading


    The downside of dynamically linking modules together is that, at runtime, the
    software which initialising an executable must link these modules together. For
    various reasons here you cannot declare that "The function in this dynamic library
    will always exist in memory". If memory address is unavailable or the library
    is updated, the function will no longer exist there, and the application trying
    to use it will break. Instead, each module (library or executable) must declare
    what functions or values it exports to other modules, and what it wishes to import
    from other modules.


    As said above, a module cannot declare where in memory it expects a function or
    value to be. Instead, it declared where in its own memory it expects to find a
    pointer to the value it wishes to import. This permits the module to address any
    imported value, wherever it turns up in memory.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# 5.8 Exports\n\nExports are functions and values in one module to be shared\
    \ with other modules. This is done through the use of the \"Export Directory\"\
    , which is used to translate the name of an export (or \"Ordinal\", see below),\
    \ and a location in memory where the code or data can be found. The start of the\
    \ export directory is identified by the IMAGE_DIRECTORY_ENTRY entry of the resource\
    \ directory. All export data must exist in the same section. The directory is\
    \ headed by the following structure:\n\n```\nstruct IMAGE_EXPORT_DIRECTORY {\n\
    \    long Characteristics;\n    long TimeStamp;\n    short MajorVersion;\n   \
    \ short MinorVersion;\n    long Name;\n    long Base;\n    long NumberOfFunctions;\n\
    \    long *AddressOfFunctions;\n    long *AddressOfNames;\n    long *AddressOfOrdinals;\n\
    }\n```\n\nThe 'Characteristics' value is generally unused, TimeStamp describes\
    \ the time the export was generated, MajorVersion and MinorVersion describe the\
    \ version details of the directory, but their nature is undefined. These values\
    \ have little or no impact on the actual exports themselves. The 'Name' value\
    \ is an RVA to a zero terminated ASCII string, the name of this library name,\
    \ or module.\n\n# Names and Ordinals\n\nEach export has both a name and an 'ordinal'\
    \ (a kind of index). The actual exports themselves are described through AddressOfFunctions,\
    \ which is an RVA to an array of RVAs, each pointing to a function or value to\
    \ be exported. The size of this array is in the value NumberOfFunctions. Each\
    \ of these functions has an ordinal. The 'Base' value is used as the ordinal of\
    \ the first export, and the next RVA in the array is Base+1, and so.\n\nEach entry\
    \ in AddressOfFunctions is identified by a name, found through the RVA AddressOfNames.\
    \ The data where AddressOfNames points to an array of RVAs, each RVA points to\
    \ a zero terminated ASCII string, each being the name of an export. There is also\
    \ a second array, pointed to by the RVA in AddressNameOrdinals. This is also of\
    \ size NumberOfNames, but each value is a 16 bit word, each being an ordinal.\
    \ These two arrays are parallel and are used to get an export value from AddressOfFunctions.\
    \ To find an export by name, search the AddressOfNames array for the correct string\
    \ and then take the corresponding ordinal from the AddressNameOrdinals array.\
    \ This ordinal is then used to get an index to a value in AddressOfFunctions."
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Windows Executable Files


    # Forwarding


    As well as being to export functions and values in a module, the export directory

    can forward to another library. This allows more flexibility when re-organising

    libraries: perhaps some functionality has branched into another module. If so,
    an export

    be forwarded to that library, instead of messy reorganising inside the original
    module.


    Forwarding is achieved by making an RVA in the AddressOfFunctions array point
    into

    t section which contains the export directory, something that normal exports should

    dot do. At that location, there should be a zero terminated ASCII string of format

    `LibraryName.ExportName` for the appropriate place to forward this to.


    # 5.9 Imports


    The other half of dynamic linking is importing functions and values into an executable
    or

    other module. Before runtime, compilers and linkers do not know where in memory
    a value

    needs to be imported could exist. The import table solves this by creating an
    array of

    pointers at runtime, each one pointing to the memory location of an imported value.
    In this way,

    ray of pointers exists inside the module at a defined RVA location. In this way,
    the\linker can use addresses of the module to access values out of.


    # 5.9.1 The Import directory


    The start of the import directory is pointed to by both the IMAGE_DIRECTORY_

    ENTRY_IAT and IMAGE_DIRECTORY_ENTRY_IMPORT entries of the resource di-

    rectory (the reason for this is uncertain). At that location, there is an array
    of IMAGE_\IMPORTDESCRIPTORS structures. Each of these identify a library or module
    that has

    a value we need to import. The array continues until an entry where all the values
    are

    The structure is as follows:


    ```

    struct IMAGE_IMPORT_DESCRIPTOR {

    long *OriginalFirstThunk;

    long TimeStamp;

    long ForwarderChain;

    long Name;

    long *FirstThunk;

    }

    ```


