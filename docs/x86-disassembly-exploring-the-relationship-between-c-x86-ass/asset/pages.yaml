    \ %eax\naddl    %eax, %eax\naddl    %edx, %eax\nleal    (%eax,%ebp), %eax\nleave\n\
    ret\n```\n\nNotice that the same name decoration is used as in cleve. The astute\
    \ observer will already have realized that GCC uses the same trick as cleve, the\
