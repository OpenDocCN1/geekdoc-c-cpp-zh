- pgno: 66
  md: '# #7 Linux Executable Files


    # ##7.1 a.out Files


    a.out is a very simple format consisting of a header (at offset 0) which contains
    the size of 3 executable sections (code, data, bss), plus pointers to additional
    information such as relocations (for .o files), symbols and symbols'' strings.
    The actual sections contents follows the header. Offsets of different sections
    are computed from the size of the previous section.


    # ###7.1.1 ELF Format


    # ##7.2 ELF Files


    w:Executable and Linkable Format$^1$


    The **ELF file format** (short for Executable and Linking Format) was developed
    by Unix System Laboratories to be a successor to previous file formats such as
    COFF and a.out. In many respects, the ELF format is more powerful and versatile
    than previous formats, and has widely become the standard on Linux, Solaris, IRIX,
    and FreeBSD (although the FreeBSD-derived Mac OS X uses the Mach-O format instead).
    ELF has also been adopted by OpenVMS for Titanium and BeOs for x86.


    Historically, Linux has not always used ELF; Red Hat Linux 4 was the first time
    that distribution used ELF; previous versions used the a.out format.


    ELF Objects are broken down into different segments and/or sections. These can
    be located using the ELF header found at the first byte of. The ELF header provides
    the location for both the program header and the section header. Using these data
    structures the rest of ELF objects contents can be found, this includes .text
    and .data segments which contain code and data respectively.


    The GNU readelf utility, from the binutils package, is a common tool for parsing
    ELF objects.


    > $1 http://en.wikipedia.org/wiki/Executable%20and%20Linkable%20Format$'
