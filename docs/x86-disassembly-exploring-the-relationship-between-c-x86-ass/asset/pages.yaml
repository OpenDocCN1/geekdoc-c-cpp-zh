  md: "# Structures\n\nSince most times an array is accessed through a computed index,\
    \ not through a constant, the compiler will likely use the following to access\
    \ an element of the array:\n\n```\nmov [ebx + eax], 0x00\n```\n\nIf the array\
    \ holds elements larger than 1 byte (for char), the index will need to be multiplied\
    \ by the size of the element, yielding code similar to the following:\n\n```\n\
