- pgno: 180
  md: "# # 26 Debugger Detectors\n\n# ## 26.1 Detecting Debuggers\n\nIt may come as\
    \ a surprise that a running program can actually detect the presence of an attached\
    \ user-mode debugger. Also, there are methods available to detect kernel-mode\
    \ debuggers, although the methods used depend in large part on which debugger\
    \ is trying to be detected.\n\nThis subject is peripheral to the narrative of\
    \ this book, and the section should be considered an optional one for readers.\n\
    \n# ## 26.2 IsDebuggerPresent API\n\nThe Win32 API contains a function 'IsDebuggerPresent',\
    \ which will return a boolean true if the program is being debugged. The following\
    \ code snippet will detail a general usage of this function:\n\n```\nif (IsDebuggerPresent())\n\
    {\n    TerminateProcess(GetCurrentProcess(), 1);\n```\n\nOf course, it is easy\
    \ to spot uses of the IsDebuggerPresent() function in the disassembledsembled\
    \ code, and a skilled reverser will simply patch the code to remove this line.\
    \ For OllyDBG, there are many plugins available which hide the debugger from this\
    \ and many other APIs.\n\n# ## 26.3 PEB Debugger Check\n\nThe Process Environment\
    \ Block stores the value that IsDebuggerPresent queries to determine its return\
    \ value. To avoid suspicion, some programmers access the value directly from the\
    \ PEB instead of calling the API function. The following code snippet shows how\
    \ to access the value:\n\n```\nmov eax, fs:[30h]\nmov eax, byte [eax+2]\ntest\
    \ eax, eax\nje @DebuggerDetected\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 26.4 Timeouts


    Debuggers can put break points in the code, and can therefore stop program execution.
    A program can detect this, by monitoring the system clock. If too much time has
    elapsed between instructions, it can be determined that the program is stopped
    and analyzed (although this is not always the case). If a program is taking too
    much time, the program can terminate.


    Notice on preemptive multithreading systems, such as modern Windows or Linux systems
    will switch away from your program to run other programs. This is called thread
    switching. If the system has many threads to run, or if some threads are hogging
    processor time, your program may detect a long delay and falsely determine that
    the program is being debugged.


    # 26.5 Detecting SoftICE


    SoftICE is a kernel debugger, and as such, it can''t be detected as easily as
    a user-mode debugger can be. The IsDebuggerPresent API function will not detect
    the presence of SoftICE.


    To detect SoftICE, there are a number of techniques that can be used:


    +   1. Search for the SoftICE install directory. If SoftICE is installed, the
    user is probably a hacker or a reverser.

    2. Detect the presence of int 1. SoftICE uses interrupt 1 to debug, so if interrupt
    1 is installed, SoftICE is running.


    # 26.6 Detecting OllyDbg


    OllyDbg is a popular 32-bit userm debugger. Unfortunately, the last few releases,
    including the last version (v1.10) contain a vulnerability in the handling of
    the Win32 API function OutputDbgString(). http://www.securityfocus.com/bid/10742
    A program trying to prevent his program from being debugged by OllyDbg could exploit
    this vulnerability in order to make the debugger crash. The author has never released
    a fix, however there are unofficial versions and plugins available to protect
    OllyDbg from being exploited using this vulnerability.


    ```

    http://en.wikipedia.org/wiki/SoftICE

    ```'
  merge: -1
  img_proc: true
