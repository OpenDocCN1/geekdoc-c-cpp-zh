    \ requires the address of main or inner object to be figured out at runtime.\n\
    \nTake Figure 6 into consideration. How does the application know to call D::one\
    \ or C::one? The answer is that the compiler uses a convention in which to order\
    \ variables and method pointers inside the object that when they're referenced,\
    \ the offsets are the same for any object that has inherited its methods and variables.\n\
    \n```\n* obj[2];\nobj[0] = new C();\n[1] = new D();\n\nfor(int i=0; i<2; i++)\n\
    obj[i]->one();\n```\n\nFigure 6: A small C++ polymorphic loop that calls a function,\
    \ one. The classes C and D both inherit an abstract class, A. The class A, for\
    \ this code to work, must have a virtual method with the name, \"one.\"*\n\nThe\
    \ abstract class A acts as a blueprint for the compiler, defining an expected\
    \ structure for any class in A and every virtual method defined in A will have\
    \ the exact same offset for any of its children. Figure 7 details a possible inheritance\
    \ scheme as well as its storage in memory. Notice how the offset to C::one is\
    \ the same as D::one, and the offset to C's copy of A::a is the same as D's copy.\
    \ In this, our polymorphic loop can just iterate through the array of pointers\
    \ and know exactly where to find each method.\n\nA:\n\n```\nclass A{\npublic:\n\
