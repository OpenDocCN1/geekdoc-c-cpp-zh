- pgno: 59
  md: '# Windows Executable Files


    DLLs may be loaded in one of two ways, a) at load-time, b) by calling the LoadModule()
    Win32 API function.


    # 5.13.1 Function Exports


    Functions are exported from a DLL file using the following syntax:


    ```

    __declspec(dllexport) void myFunction()...

    ```


    * The *declspec* keyword here is not a C language standard, but is implemented
    by many compilers to extend, compiler-specific options for functions and variables.
    Microsoft C Compiler and GCC versions that run on windows allow for the __declspec
    keyword, and the dllexport option.


    Functions may also be exported from regular .exe files, and exe files with exported
    functions may be called dynamically in a similar manner to .dll files. This is
    a rare occurrence, however.


    # 5.13.2 Identifying DLL Exports


    There are several ways to determine which functions are exported by a DLL. The
    method that this book will use (often implicitly) is to **dumpbin** in the following
    manner:


    ```

    dumpbin /EXPORTS <dll file>

    ```


    This will post a list of the function exports, along with their ordinal and RVA
    to the console.


    # 5.13.3 Function Imports


    In a similar manner to function exports, a program may import a function from
    an external DLL file. The dll file will load into the process memory when the
    program is started, and the function will be used like a local function. DLL imports
    need to be prototyped in the following manner, for the compiler and linker to
    recognize that the function is coming from an external library:


    ```

    __declspec(dllimport) void myFunction();

    ```


    # 5.13.4 Identifying DLL Imports


    If is often useful to determine which functions are imported from external libraries
    when examining a program. To list import files to the console, use **dumpbin**
    in the following manner:


    ```

    dumpbin /IMPORTS <dll file>

    ```'
