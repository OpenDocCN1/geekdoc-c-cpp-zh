  md: "# Data Structures\n\n```\nvoid MyFunction()\n{\n  char buffer[4];\n  ...\n\
    ```\n\nThis will translate into the following asm pseudo-code:\n\n```\n:_Function2\n\
    push ebp\nmov ebp, esp\nsub esp, 4\nlea $buffer, [esp + 0]\n```\n\nWhich looks\
    \ harmless enough. But, if a program inadvertently accesses buffer[4]? what about\
    \ buffer[5]? what about buffer[8]? This is the makings of a buffer overflow vulnerability,\
    \ and (might) will be discussed in a later section. However, this section won't\
    \ talk about security issues, and instead will focus on data structures.\n\n#\
    \ 19.2.1 Spoting an Array on the Stack\n\nTo spot an array on the stack, look\
    \ for large amounts of local storage allocated on the stack ('sub esp, 1000',\
    \ for example), and look for large portions of that data being accessed by an\
    \ offset from a different register from esp. For instance:\n\n```\n:_Function3\n\
    push ebp\nmov ebp, esp\nsub esp, 256\nlea ebx, [esp + 0x00]\nmov [ebx + 0], 0x00\n\
    ```\n\nis a good sign of an array being created on the stack. Granted, an optimizing\
    \ compiler might just want to offset from esp instead, so you will need to be\
    \ careful.\n\n# 19.2.2 Spoting an Array in Memory\n\nArrays in memory, such as\
    \ global arrays, or arrays which have initial data (remember, initialized data\
    \ is created in the .data section in memory) and will be accessed as offsets from\
    \ a hardcoded address in memory:\n\n```\n:_Function4\npush ebp\nmov ebp, esp\n\
    mov esi, 0x77651004\nmov ebx, 0x00000000\nmov [esi + ebx], 0x00\n```\n\nIt needs\
    \ to be kept in mind that structures and classes might be accessed in a similar\
    \ manner, so the reverser needs to remember that all the data objects in an array\
    \ are of the same type, that they are sequential, and will often be handled in\
    \ a loop of some sort. Also, that this might be the most important part), each\
    \ elements in an array may be accessed by a variable offset from the base.\n\n\
