  md: "# # 21 Floating Point Numbers\n\n# ## 21.1 Floating Point Numbers\n\nThis page\
    \ will talk about how floating point numbers are used in assembly language constructs.\
    \ This page will not talk about new constructs, it will not explain what the FPU\
    \ instructions do, how floating point numbers are stored or manipulated, or the\
    \ differences in floating-point-data representations. However, this page will\
    \ demonstrate briefly how floating-point numbers are used in code and data structures\
    \ that we have already considered.\nThe x86 architecture does not have any registers\
    \ for floating point numbers, but it does have a stack for them. The floating\
    \ point stack is built directly into the processor, and has access speeds similar\
    \ to those of ordinary registers. Notice that the FPU stack is not the same as\
    \ the regular system stack.\n\n# ## 21.2 Calling Conventions\n\nWith the addition\
    \ of the floating-point stack, there is an entirely new dimension for passing\
    \ parameters and returning values. We will examine our calling conventions here,\
    \ and how they are affected by the presence of floating-point numbers. These are\
    \ the functions that we will be assembling, using both GCC, and clex:\n\n```\n\
    __cdecl double myFunction1(double x, double y, float z)\n{\n    return (x * 1.0)\
    \ * (y + 2.0) * (z + 3.0);\n}\n\nfastcall double myFunction2(double x, double\
    \ y, float z)\n{\n    return (x * 1.0) * (y + 2.0) * (z + 3.0);\n}\n\nstdcall\
    \ double myFunction3(double x, double y, float z)\n{\n    return (x * 1.0) * (y\
    \ + 2.0) * (z + 3.0);\n}\n```\n\nlex does not use these directives, to create\
    \ these functions, 3 different files need to be created, compiled with the /Gd,\
    \ /Gr, and /Gz options, respectively."
