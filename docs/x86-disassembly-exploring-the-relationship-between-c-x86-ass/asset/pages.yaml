- pgno: 170
  md: "# 24.7 Example: Duff's Device\n\nWhat does the following C code function do?\
    \ Is it useful? Why or why not?\n\n```\nvoid MyFunction(int *arrayA, int *arrayB,\
    \ int cnt)\n{\n    switch(cnt % 6)\n{\n        while(cnt != 0)\n        {\n  \
    \          case 0:\n                arrayA[cnt] = arrayB[cnt];\n            case\
    \ 5:\n                arrayA[cnt] = arrayB[cnt];\n            case 4:\n      \
    \          arrayA[cnt] = arrayB[cnt];\n            case 3:\n                arrayA[cnt]\
    \ = arrayB[cnt];\n            case 2:\n                arrayA[cnt] = arrayB[cnt];\n\
    \            case 1:\n                arrayA[cnt] = arrayB[cnt];\n        }\n\
    \    }\n}\n```\n\nDuff's device¹ This piece of code is known as a **Duff's device**\
    \ or 'Duff's machine'. It is used to partially unwind a loop for efficiency. Notice\
    \ the strange way that the `while()` is nested inside the `switch` statement?\
    \ Two arrays of integers are passed to the function, and at each iteration of\
    \ the while loop, 6 consecutive elements are copied from **arrayB** to **arrayA**.\
    \ The switch statement, since it is outside the while loop, only occurs at the\
    \ beginning of the function. The modulo is made of the variable `cnt` with respect\
    \ to 6. If cnt is not evenly divisible by 6, the modulo statement is going to\
    \ start the loop somewhere in the middle of the rotation, thus preventing the\
    \ loop from causing a buffer overflow without having to test the count after each\
    \ iteration.\n\nDuff's Device is considered one of the more efficient general-purpose\
    \ methods for copying strings, arrays, or data streams."
  merge: -1
  img_proc: true
