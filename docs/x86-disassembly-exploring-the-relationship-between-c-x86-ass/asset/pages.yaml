- pgno: 44
  md: '# 5 Windows Executable Files


    # 5.1 MS-DOS RAM COM Files


    COM files are loaded into RAM exactly as they appear: no change is made at all
    from the harddisk image to RAM. This is possible due to the 20-bit memory model
    of the early x86 line. Two 16-bit registers would have to be set, dividing the
    1MB+64K memory space into 65536 ''segments'' and one specifying an offset from
    that. The segment register would be set by DOS and the COM file would be expected
    to respect this setting and not ever change the segment registers. The offset
    registers, however, were free and served (for COM files) the same purpose as a
    32-bit register. The downside is that with offset registers, COM files were limited
    to using 64K of RAM. The good thing about this approach, is that no extra memory
    is needed by DOS to load and run a COM file: just load the file, set the segment
    register, and jump to it. (The programs could perform ''near'' jumps by just giving
    an offset to jump to.)


    COM files are loaded into RAM at offset $100. The space before that would be used
    for passing data to and from DOS (for example, the contents of the command line
    used to invoke the program).


    Note that COM files, by definition, cannot be 32-bit. Windows provides support
    for COM files via a special CPU mode.


    > Notice that MS-DOS COM files (short for ''command'' files) are not the same
    as Component-Object Model files, which are an object-oriented library technology.


    # 5.2 MS-DOS EXE Files


    One way MS-DOS compilers got around the 64k memory limitation was with the introduction
    of memory models. The basic concept is to cleverly set different segment registers
    in the x86 CPU (CS, DS, ES, SS) to point to the same or different segments, allowing
    varying degrees of access to memory. Typical memory models were:


    tiny


    All memory access is 16-bit (never reload any segment register). Produces a .COM
    file instead of .EXE file.


    small'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Windows Executable Files


    All memory access is 16-bit (never reload any segment register).


    # compact


    accesses to the data segment reload the CS register, allowing 32-bit of code.
    Data accesses don''t reload the DS, ES, SS registers, allowing 16-bit of data.


    # medium


    accesses to the data segment reload the DS, ES, SS register, allowing 32-bit of
    data. Code accesses don''t reload the CS register, allowing 16-bit of code.


    # large


    both code and data accesses use the segment registers (CS for code, DS, ES, SS
    for data), allowing 32-bit of code and 32-bit of data.


    # huge


    same as the large model, with additional arithmetic being generated by the compiler
    to allow access to arrays larger than 64k.


    When looking at a COM file, one has to decide which memory model was used to build
    that file.


    # 5.3 PE Files


    A Portable Executable (PE) file is the standard binary format for an Executable
    or DLL under Windows NT, Windows 95, and Win32. The Win32 SDK contains a file,
    wint.h, which declares various structures and variables used in the PE files.
    Some functions for manipulating PE files are also included in imagehelp.dll. PE
    files are broken down into various sections which can be examined.


    # 5.4 Relative Virtual Addressing (RVA)


    In a Windows environment, executable modules can be loaded at any point in memory,
    and are expected to run without problem. To allow multiple programs to be loaded
    at seemingly random locations in memory, PE files have adopted a tool called RVA:
    Relative Virtual Addresses. RVA assumes the "base address" of where a module is
    loaded into memory is not known at compile time. So, PE files describe the location
    of data in memory as an offset from the base address, whatever that may be in
    memory.


    Some processor require the code to directly identify where some data is. This
    is not possible when the location of the module in memory is not known at compile
    time. The solution to this problem is described in the section on "Relocations".


    It is important to remember that the addresses obtained from a disassembly of
    a module will not always match to the addresses seen in a debugger as the program
    is running.'
  merge: -1
  img_proc: true
