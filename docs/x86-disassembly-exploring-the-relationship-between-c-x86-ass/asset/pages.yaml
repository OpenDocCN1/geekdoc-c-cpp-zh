  md: '# Data Structures


    | :data is 32-bit aligned | :data is "packed" |

    | [ebx + 0] | :value1 |

    | [ebx + 4] | :value2 |

    | [ebx + 8] | :value3 |


    The first argument is the most common, but it clearly leaves an entire memory
    word (2 bytes) at offset +6, which is not used at all. Compilers occasionally
    allow the programmer to manually specify the offset of each data member, but this
    isn''t always the case. The second example also has the benefit that the reverser
    can easily identify that each data member in the structure is a different size.


    Consider now the following function:


    ```

    :MyFunction

    push ebp

    mov ebp, esp

    lea ecx, ss:[ebp + 8]

    mov [ecx + 0], ecx

    mov [ecx + 4], 0x0000000A

    mov esp, ebp

    pop ebp

    ret


    ```


    The function clearly takes a pointer to a data structure as its first argument.
    Also, each, how can we tell if this is an array or a structure? To answer your
    question, we need to remember one important distinction between structures and
    arrays: the elements in an array are all of the same type, the elements in a structure
    do not need to be the same type. Given that rule, it is clear that one of the
    elements in this structure is a pointer (it points to the base of the structure
    itself!) and the other two fields are loaded with the hex value 0x9A (16 in decimal),
    which is certainly not a valid pointer on any system I have ever used. We can
    then partially recreate the structure and the function code:


    ```

    struct MyStruct {

    long value1;

    void value2;

    long value3;

    }


    void MyFunction2(struct MyStruct *ptr) {

    ptr->value1 = 10;

    ptr->value2 = ptr;

    ptr->value3 = 10;

    }


    ```


    As a quick aside note, notice that this function doesn''t load anything into eax,
