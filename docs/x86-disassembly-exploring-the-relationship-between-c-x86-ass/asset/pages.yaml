  md: "```\ninc ebx\ncmp ebx, 100\njne _Label_1\nmov esp,ebp\npop ebp\nret 4\n```\n\
    \nStarting with the function prototype above, and the description of what this\
    \ function does, we can start to write the code for this function. We know that\
    \ this function initializes ebx, eax, and ecx before the loop. However, we can\
    \ see that ecx is being used as a simple intermediate storage location, receiving\
    \ successive values from the array, and then being added to ecx.\n\nWe will create\
    \ two unsigned integer values, a (for eax) and b (for ebx). We will define both\
    \ a and b with the register qualifier, so that we can instruct the compiler not\
    \ to create space for them on the stack. For each loop iteration, we are adding\
    \ the value of the array, at location eax to the running sum, eax. Converting\
    \ this to our a and b variables, and using C syntax, we see:\n\n```\na = a + array[b];\n\
    ```\n\nThe loop could be either a for loop, or a while loop. We see that the loop\
    \ control variable, b, is initialized to 0 before the loop, and is incremented\
    \ by 1 each loop iteration. The loop tests b against 100, after it gets incremented,\
    \ so we know that b never equals 100 inside the loop body. Using these simple\
    \ facts, we will write the loop in 3 different ways:\n\nFirst, with a while loop:\n\
    \n```\nunsigned int STDCALL MyFunction(unsigned int *array)\n{\n    register unsigned\
    \ int b = 0;\n    register unsigned int a = 0;\n    while(b != 100)\n    {\n \
    \       a = a + array[b];\n        b++;\n    }\n    return a;\n}\n```\n\nOr, with\
    \ a for loop:"
