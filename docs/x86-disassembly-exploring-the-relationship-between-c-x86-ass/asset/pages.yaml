- pgno: 38
  md: '# # 4 Microsoft Windows


    # ## 4.1 Microsoft Windows


    w:Windows¹

    The Windows operating system is a popular target for reverses for one simple reason:
    the OS itself (market share, known weaknesses), and most applications for it,
    are not Open Source or free. Most software on a Windows machine doesn''t come
    bundled with its source code, and most pieces have inadequate, or non-existent
    documentation. Occasionally, the only way to know precisely what a piece of software
    does (or for that matter, to determine whether a given piece of software is malicious
    or legitimate) is to reverse it, and examine the results.


    # ## 4.2 Windows Versions


    Operating systems can be easily divided into 2 categories: Win9x, and WinNT.


    # ### 4.2.1 Windows 9x


    The Win9x kernel was originally written to span the 16bit - 32bit divide. Operating
    Systems based on the 9x kernel are: Windows 95, Windows 98, and Windows ME. Win9x
    Series operating systems are known to be prone to bugs and system instability.
    The actual OS itself was a 32 bit extension of MS-DOS, its predecessor. An important
    issue with the 9x line is that they are all based around the ASCII format for
    storing strings, rather than Unicode.

    Development on the Win9x kernel ended with the release of Windows ME.


    # ### 4.2.2 Windows NT


    The WinNT kernel series was originally written as enterprise-level server and
    network software. WinNT stresses stability and security far more than Win9x kernels
    did (although it can be debated whether stress was good enough). It also handles
    all string operations internally in Unicode, giving more flexibility when using
    different languages. Operating Systems based on the WinNT kernel are: Windows
    NT (versions 3.1, 3.5, 3.51 and 4.0).


    > ¹ http://en.wikipedia.org/wiki/Windows'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Microsoft Windows


    2000 (NT 5.0), Windows XP (NT 5.1), Windows Server 2003 (NT 5.2), Windows

    Vista (NT 6.0), and Windows 7 (NT 6.1).


    The Microsoft XBOX and XBOX 360 also run a variant of NT, forked from Windows

    2000. Most future Microsoft operating system products are based on NT in some
    shape or

    form.


    # 4.3 Virtual Memory


    32 bit WinNT allows for a maximum of 4Gb of virtual memory space, divided into
    ‘pages''

    that are 4096 bytes by default. Pages not in use by the system or any of the

    applications may be written to a special section on the harddisk known as the
    ‘paging file.’

    Use of the paging file may increase performance on some systems, although high
    latency for

    I/O to the HDD can actually reduce performance in some instances.


    # 4.4 System Architecture


    The Windows architecture is heavily layered. Function calls that a programmer
    makes

    be redirected 3 times or before any action is actually performed. There is an

    unignorable penalty for calling Win32 functions from a user-mode application.
    However, the

    uside is equally unignorable: code written in higher levels of the Windows system
    is

    easier to write. Complex operations that involve initializing multiple data structures
    and

    calling multiple sub-functions can be performed by calling a single higher-level
    function.


    The Win32 API calls 3 modules: KERNEL, USER, and GDI KERNEL functions are layered
    on top

    of NTDLL, and most calls to KERNEL are simply redirected into NTDLL calls.

    USER and GDI are both based on Win32K (a kernel-mode module, responsible for

    the Windows ‘look and feel’), although USER also makes calls to the more-primitive

    functions in GDI. This and NTDLL both provide an interface to the Windows NT kernel,

    NTOSRNL (see further).


    NTOSRNL is also partially layered on HAL (Hardware Abstraction Layer), but this

    interaction will not be considered in this. The purpose of this layering is to
    allow

    processor variant issues (such as location of resources) to be separate from the
    actual

    kernel itself. A slightly different system configuration thus requires just a
    different HAL

    module, rather than a completely different kernel.


    # 4.5 System calls and interrupts


    After filtering different layers of subroutines, most API calls require interaction
    with

    part of the operating system. Services are provided via ‘software interrupts’,
    the traditionally

    through the ‘int 0x2e’ instruction. This switches control of execution to the
    NT executive /

    kernel, where the request is handled. It should be pointed out that the stack
    used in

    kernel mode is different from the user mode stack. This provides an added layer
    of protection'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'between kernel user. Once the function completes, control is returned back
    to the user application.


    Both Intel and AMD provide an extra set of instructions to allow faster system
    calls, the ''SYSENTER'' instruction from Intel and the SYSCALL instruction from
    AMD.


    # 4.6 Win32 API


    Both WinNT and Win9x systems utilize the Win32 API. However, the WinNT version
    of the API has more functionality and security constructs, as well as Unicode
    support. Most of the Win32 API can be broken down into 3 separate components,
    each performing a separate task.


    # 4.6.1 kernel32.dll


    Kernel32.dll, home of the KERNEL subsystem, is where non-graphical functions are
    implemented. The Heap API, the Virtual Memory API, File I/O API, the Thread API,
    the System Object Manager, and other system services. Most of the functionality
    of kernel32.dll is implemented in ntdll.dll, but undocumented functions. Microsoft
    prefers to publish documentation for kernel32 and guarantee that these APIs will
    remain unchanged, and then most of the work in other libraries, which are then
    not documented.


    # 4.6.2 gdi32.dll


    gdi32.dll is the library that implements the GDI system, where primitive graphical
    operations are performed. GDI diverts most of its calls into WIN32K, but it does
    contain a manager for GDI objects, such as pens, brushes and device contexts.
    The GDI object manager and the KERNEL object manager are completely separate.


    # 4.6.3 user32.dll


    The USER subsystem is located in the user32.dll library file. This subsystem controls
    the creation and manipulation of USER objects, which are common screen items such
    as windows, menus, cursors... USER set up the objects to be drawn, but will perform
    the actual drawing by calling on GDI (which in turn will make calls to WIN32K)
    or sometimes calling WIN32K directly. USER utilizes the GDI Object Manager.


    # 4.7 Native API


    The native API, hereby referred to as the NTDLL subsystem, is a series of undocumented
    API function calls that handle most of the work performed by KERNEL. Microsoft
    also does not guarantee that the native API will remain the same between different
    versions,'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Microsoft Developers modify the software. This gives the risk of native API
    calls being removed or changed without warning, breaking software that utilizes
    it.


    #  4.7.1 ntdll.dll


    The NTDLL subsystem is located in ntdll.dll. This library contains many API function
    calls, all which follow a particular naming scheme. Each function has a prefix:
    Ldr, Nt, Zw, Csr, etc., and all of the functions that have a particular prefix
    follow all particular rules.


    The ''official'' native API is usually limited to functions whose prefix is Nt
    or Zw. These calls are in fact in user-mode: the Export entries map to the same
    address in memory. However, in kernel-mode, the Zw system call stubs set the previous
    mode to kernel-mode, ensuring that certain validation routines are not performed.
    The origin of the prefix ''Zw'' is unknown;


    In actual implementation, the system call stubs merely load two registers with
    values required to describe a native API call, and then execute a software interrupt
    (or the system interrupt).


    Most of the others are obscure, but the known ones are:


    +   - Rtl stands for ''Run Time Library'', calls, which help functionality at
    runtime (such as RtlAllocateHeap)

    - Csr is for ''Client Server Runtime'', which represents the interface to the
    win32 subsystem located in csr.exe

    - Dbg functions are present to enable debugging routines and operations

    - Ldr provides the ability to load, manipulate and retrieve data from DLLs and
    other module resources


    #  4.7.2 User Mode Versus Kernel Mode


    Many functions, especially Run-time Library routines, are shared between ntdll.dll
    and ntoskrnl.exe. Native API functions, as well as other kernel-mode functions
    exported from the kernel are useful for driver writers. As such, Microsoft provides
    documentation on many of the native API functions with the Microsoft Server 2003
    Platform DDK. The DDK (Driver Development Kit) is available as a free download.


    #  4.8 ntoskrnl.exe


    This module is the Windows NT "Executive", providing all the functionality required
    by the native API, as well as the kernel itself, which is responsible for maintaining
    the machine state. By default, all interrupts and kernel calls are channeled through
    ntoskrnl in some way, making it the most important program in Windows itself.
    Many of its functions are exported (all of which with various prefixes, a like
    NTDLL) for use by device drivers.


    2 Chapter 5.8 on page 49'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 4.9 Win32K.sys


    This module is the "Win32 Kernel" that sits on top of the lower-level, more primitive
    NTOSKRNL. WIN32K is responsible for the "look and feel" of windows, and many portions
    of this code have remained largely unchanged since the Win9x versions. This module
    provides many of the specific instructions that cause USER and GDI to act the
    way they do. It''s responsible for translating the API calls from the USER and
    GDI libraries into the pictures you see on the monitor.


    # 4.10 Win64 API


    With the advent of 64-bit processors, 64-bit software is a necessity. As a result,
    the Win64 API was created to utilize the new hardware. It is important to note
    that the format of many of the function calls are identical in Win32 and Win64,
    except for the size of pointers, and other data types that are specific to 64-bit
    address space.


    # 4.10.1 Differences


    Microsoft has released a new version of its Windows operation system, named "Windows
    Vista." Vista may be better known by its development code-name "Longhorn." Microsoft
    claims that Vista has been written largely from the ground up, and therefore it
    can be assumed that there are fundamental differences between the Vista API and
    system architecture, and the APIs and architectures of previous Windows versions.
    Windows Vista was released January 30th, 2007.


    # 4.12 Windows CE/Mobile, and other versions


    Windows CE is the Microsoft offering on small devices. It largely uses the same
    Win32 API as the desktop systems, although it has a slightly different architecture.
    Some examples in this book may consider WinCE.


    # 4.13 "Non-Executable Memory"


    Recent windows of service packs have attempted to implement a system known as
    "Non-executable memory" where certain pages can be marked as "non-executable".
    The purpose of this system is to prevent some of the most common security holes
    by not allowing control to pass code inserted into a memory buffer by an attacker.
    For instance, a shellcode loaded into an overflowed text buffer cannot be executed,
    stopping the attack in its tracks. The effectiveness of this mechanism is yet
    to be seen, however.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 4.14 COM and Related Technologies


    COM, and a whole of technologies that are related to COM or are actually COM with
    a fancy name, is another factor to consider when reversing Windows binaries. DCOM,
    COM+, ActiveX, OLE, MTS, and Windows DNA are all names for the same subject, so
    that they may be considered under the same heading. In short, COM is a method
    to export Object-Oriented Classes in a uniform, cross-platform and cross-language
    manner. In essence, COM is .NET, version 0 beta. Using COM, components written
    in many languages can export, import, instantiate, and destroy objects in another
    file, so often a DLL. DLL provides cross-platform (to some extent) and cross-language
    facilities, each COM object is compiled to a native binary, rather than an immediate
    format such as Java or .Net. As such, COM does not require a virtual machine to
    execute such objects.


    This book will tell you some examples of COM, and the reversals associated with
    them, although the subject is very broad, and may elude the scope of this book
    (or least the early sections of it). The discussion may be part of an "Advanced
    Topic" found in later sections of this book.


    Due to the way COM works, the methods and data structures exported by a COM component
    are difficult to perceive by simply inspecting the executable file. Matters are
    made worse if the programmer has used a library such as ATL³ to simplify their
    programming experience. Unfortunately, for a reverse engineer, this reduces the
    contents of an executable into a "Sea of bits", with points and data structures
    everywhere.


    # 4.15 Remote Procedure Calls (RPC)


    RPC is a generic term referring to techniques that allow a program running on
    one machine to make calls that actually execute on another machine. Typically,
    this is done by marshall all of the data needed for the procedure including any
    state stored on the first machine, and building it into a single data structure,
    which is then transmitted over some communications to another machine. This second
    machine then performs the requested action, and returns a data packet containing
    any and potentially changed state information to the originating machine.


    In Windows NT, RPC is typically handled by two libraries that are similarly named,
    one generates RPC requests and accepts RPC returns, as requested by a user-mode
    program, and one responds to RPC requests and returns results via RPC. A classic
    example is the print spooler, which consists of two pieces: the RPC stub spools.dll,
    and the spooler provider spools.exe. In most cases, which are stand-alone, it
    would seem that the two modules communicating by means of RPC is overkill; why
    not simply roll them into a single routine? In networking, though, this makes
    sense, the RPC service provider can be resident physically on a distant machine,
    with the remote printer, and the local machine can control the printer on the
    remote machine in exactly the same way that it controls printers on the local
    machine.


    > 3 http://en.wikipedia.org/wiki/Active_Template_Library'
