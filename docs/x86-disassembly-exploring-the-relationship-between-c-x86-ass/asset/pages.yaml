  md: "# Calling Conventions\n\n```\nST1 := ST1 + ST0\nFPU POP ST0\n```\n\nMultiplies\
    \ ST(1) and ST(0) and stores the result in ST(1). Then, ST(0) is marked empty\
    \ and stack pointer is incremented. Thus, contents of ST(1) are on the top of\
    \ the stack. So the top 2 values are multiplied together, and the result is stored\
    \ on top of the stack. Therefore, in our instruction above, `fimpul ST(1), ST(0)*`,\
    \ which is also the last instruction of the function, we can see that the last\
    \ result is stored in ST0. Therefore, floating point parameters are passed on\
    \ the regular stack, but floating point results are passed on the FPU stack.\n\
    \nOne final note is that MyFunction cleans its own stack, as referenced by the\
    \ **ret 20** command at the end. Because none of the parameters were passed in\
    \ registers, this function appears to be exactly what we would expect a STDCALL\
    \ function would look like: parameters passed on stack from right-to-left, and\
    \ the function cleans its own stack. We will see below that this is actually a\
    \ certain assumption.\n\nFor comparison, here is the GCC list:\n\n```\nLC1:\n\
    \  .long\n  .long\n  .align 8 0 1073741824\n\nLC2:\n  .long\n  .long 0 1074266112\n\
    .global MyFunction\n  .def MyFunction;    .scl 2;    .type 32;    .endf\n  MyFunction:\n\
    \    push\n    movl %esp,%eb\n    subl $16,,(eb)\n    fld\n    -8(%eb)\n    fstpl\n\
    \    fld\n    -16(%eb)\n    fstpl\n    -8(%eb)\n    fld\n    fadd\n    %st, xst(1)\n\
    \    fld\n    -16(%eb)\n    LC1\n    fadd\n    %st, xst(1)\n    %st, xst(1)\n\
    \    fmul\n    24(%eb)\n    fld\n    LC2\n    fadd\n    %st, xst(1)\n    fmul\n\
    \    %st, xst(1)\n    leave\n    ret\n    .align 8\n```\n\nThis is a very difficult\
    \ listing, so we will step through it (albeit quickly). 16 bytes of extra space\
    \ is allocated on the stack. Then, using a combination of fld and fstpl instructions,\
    \ the first 2 parameters are moved from offsets +8 and +16, to offsets -8 and\
    \ -16 from ebp. Seems like a waste of time, but remember, optimizations are off.\
    \ **fld1** loads the floating point value"
