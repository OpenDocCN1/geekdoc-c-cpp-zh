  md: "# Calling Conventions\n\nNotice that fmulup is the last instruction performed\
    \ again, as in CDECL example. We can infer then, without investigating too deeply,\
    \ that the result is passed to the top of the floating-point stack.\n\nNotice\
    \ also that x (offset [ebp + 8]), y (offset [ebp + 16]) and z (offset [ebp + 24])\
    \ are pushed in reverse order: z is first, x is last. This means floating point\
    \ parameters are passed in right-to-left order, on the stack. This is exactly\
    \ the same as CDECL code, although only because we are using floating-point values.\n\
    \nHere is the Gcc assembly for MyFunction2:\n\n```\n.align 8\nLC5:\n  .long 0\n\
    \  .long 1073741824\n  .align 8\nLC6:\n  .long 0\n  .long 10742666112\n  .glob\
    \ @MyFunction2020;\n  .def _2; .type 32; .endf\n@MyFunction2020:\n  pushl %ebp\n\
    \  movl %esp, %ebp\n  subl $16, %esp\n  fstpl -8(%ebp)\n  fld 16(%ebp)\n  fstpl\
    \ -10(%ebp)\n  fld\n  faddp %xst, %xat(1)\n  fld -6(%ebp)\n  LC5:\n  faddp %xst,\
    \ %xat(1)\n  fmulp\n  fld 24(%ebp)\n  LC6:\n  faddp %xst, %xat(1)\n  fmulp\n \
    \ leave\n  ret $20\n```\n\nThis is a tricky piece of code, but luckily we don't\
    \ need to read it very close to find what we are looking for. First off, notice\
    \ that no other registers are accessed besides ebp. Again, GCC passes all floating\
    \ point values (the 32-bit float, z) on the stack. Also, the floating point value\
    \ is passed on the top of the floating point stack.\n\nWe can see that GCC is\
    \ something strange at the beginning, taking the values from the stack [ebp +\
    \ 8] and [ebp + 16], and moving them to locations [ebp - 8] and [ebp - 16]. Immediately\
    \ after being moved, these values are loaded onto the floating point stack and\
    \ arithmetic is performed. z isn't loaded till later, and isn't ever moved to\
    \ [ebp - 24], despite the pattern.\n\nLC5 and LC6 are constant values, that most\
    \ likely represent floating point values (because the numbers themselves, 1073741824\
    \ and 10742666112 not make any sense in the context of our example functions.\
    \ Notice that both LC5 and LC6 contain two .long data items, for a total of 8\
    \ bytes of storage? They are therefore most definitely double values."
