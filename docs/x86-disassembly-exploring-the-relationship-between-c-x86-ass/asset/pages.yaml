    \ (the caller) which passes the arguments and\ncall the called function. After\
    \ the called function has returned, some calling conventions\nhave one more instruction\
    \ in the call sequence to clean the stack.\n\n# 11.3 Standard C Calling Conventions\n\
    \nThe C language, by default, uses the CDECL calling convention, but most compilers\
    \ allow\nthe programmer to specify another convention by a specifier keyword.\
    \ These keywords\n**are not** part of the ISO-ANSI C standard, so you should always\
    \ check with your compiler\ndocumentation about implementation specifications.\n\
    \nIf a calling convention other than CDECL is to used, or if CDECL is not the\
    \ default for\nyour compiler, and you want to manually use it, you must specify\
    \ the calling convention\nkeyword in the function declaration itself, and in any\
    \ prototypes for the function. This is\nimportant because both the calling function\
    \ and the called function need to know the calling\nconvention.\n\n# 11.3.1 CDECL\n\
    \nIn the CDECL calling convention the following holds:\n\n+   - Arguments are\
