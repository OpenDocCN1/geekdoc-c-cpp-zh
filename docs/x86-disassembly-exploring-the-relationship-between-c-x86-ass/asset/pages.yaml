- pgno: 158
  md: "# # 23 Code Optimization\n\n# ## 23.1 Code Optimization\n\nAn optimizing compiler\
    \ is perhaps one of the most complicated, powerful, and most interesting programs\
    \ in existence. This chapter will talk about optimizations, although this chapter\
    \ will not include a table of common optimizations.\n\n# ## 23.2 Stages of Optimizations\n\
    \nThere are two times when a compiler can perform optimizations: first, in the\
    \ intermediate representation, and second, during the code generation.\n\n# ###\
    \ 23.2.1 Intermediate Representation Optimizations\n\nWhile in the intermediate\
    \ representation, a compiler can perform various optimizations, often based on\
    \ dataflow analysis techniques. For example, consider the following code fragment:\n\
    \n```\nx = 5;\nif(x != 5)\n{\n  //loop body\n}\n```\n\nAn optimizing compiler\
    \ might notice that at the point of 'if (x != 5)', the value of x is always the\
    \ constant '5'. This allows substituting '5' for x resulting in '5 != 5'. Then\
    \ the compiler notices that the resulting expression operates entirely on constants,\
    \ so the value can be calculated instead of at run time, optimizing the conditional\
    \ to 'if (false)'. Finally the compiler sees that the body of the if will never\
    \ be executed, so it can omit the entire body of the if conditional altogether.\n\
    \nConsider the reverse case:\n\n```\nx = 5;\nif(x == 5)\n{\n  //loop body\n}\n\
    ```\n\nIn this case, the optimizing compiler would notice that the IF conditional\
    \ will always be true, and it won't even bother writing code to test x."
  merge: -1
  img_proc: true
- pgno: 159
  md: "# Code Optimization\n\n# 23.2.2 Control Flow Optimizations\n\nAnother set of\
    \ optimization which can be performed either at the intermediate or the code generation\
    \ level are control flow optimizations. Most of these optimizations deal with\
    \ the elimination of useless branches. Consider the following code:\n\n```\nif\
    \ (A)\n{\n    if (B)\n    {\n        C;\n    } else\n{\n        D;\n    }\n} else\n\
    {\n    E;\n}\nend_A;\n```\n\nIn this code, a simplistic compiler would generate\
    \ a jump from the C block to end_B, and then another jump from end_B to end_A\
    \ (to get the E statements). Clearly jumping to a jump is inefficient, so optimizing\
    \ compilers will generate a direct jump from block C to end_A.\n\nThis unfortunately\
    \ will make the code more confused and will prevent a nice recovery of the original\
    \ code. For complex functions, it's possible that one will have to consider the\
    \ code made of only if()-goto; sequences, without being able to identify higher\
    \ level statements like if-else or loops.\n\nThe process of identifying high level\
    \ statement hierarchies is called 'code structuring'.\n\n# 23.2.3 Code Generation\
    \ Optimizations\n\nOnce the compiler has sifted through all the logical inefficiencies\
    \ in your code, the code generator takes over. Often the code generator will replace\
    \ certain slow machine instructions with faster machine instructions.\n\nFor instance,\
    \ the instruction:\n\n```\nbeginning:\n...\nloopnz beginning\n```\n\noperates\
    \ much slower than the equivalent instruction set:\n\n```\nbeginning:\n...\ndec\
    \ ecz\njne beginning\n```\n\n147"
  merge: -1
  img_proc: true
- pgno: 160
  md: "So then would a compiler ever use a loopxx instruction? The answer is that\
    \ most optimizing compilers never use a loopxx instruction, and therefore as a\
    \ reverser, you will probably never see one used in real code.\n\nWhat about the\
    \ instruction:\n\n```\nmov eax, 0\n```\n\nThe mov instruction is relatively quick,\
    \ but a faster part of the processor is the arithmetic unit. Therefore, it makes\
    \ more sense to use the following instruction:\n\n```\nxor eax, eax\n```\n\nbecause\
    \ xor operates in few processor cycles (and saves a byte or two at the same time),\
    \ and is faster than a 'mov eax, 0'. The only drawback of a xor instruction is\
    \ that it changes the processor flags, so it cannot be used between a comparison\
    \ instruction and the corresponding conditional jump.\n\n# 23.3 Loop Unwinding\n\
    \nWhen a loop needs to run for a small, but definite number of iterations, it\
    \ is often better to unwind the loop in order to reduce the number of jump instructions\
    \ performed, and in many cases prevent the processor's branch predictor from failing.\
    \ Consider the C loop, which calls the function MyFunction() five times:\n\n```\n\
    for(x = 0; x < 5; x++) {\n  MyFunction();\n}\n```\n\nConverting to assembly, we\
    \ see that this becomes, roughly:\n\n```\nmov eax, 0\nloop_top:\ncmp eax, 5\\\
    jnge loop_end\ncall MyFunction\ninc eax\njmp loop_top\n```\n\nEach loop iteration\
    \ requires the following operations to be performed:\n\n+   1. Compare the value\
    \ in eax (the variable 'x') to 5, and jump to the end if greater than equal\n\
    2. Increment eax\n3. Jump back to the top of the loop.\n\nNotice that we remove\
    \ these instructions if we manually repeat the call to MyFunction():\n\n```\n\
    call MyFunction\ncall MyFunction\ncall MyFunction\n```"
  merge: -1
  img_proc: true
