    \ 04000000000000000r ; 2\n            END\nCONST       CDMAT\n            SEGMENT\n\
    CONST---real8400800000000000dg 04008000000000000r ; 3\n            END\n     \
    \       SEGMENT\n            .TEXT\n            _x         = 8               \
    \                  : size = 8\n            _y         = 8                    \
    \             : size = 8\n            _z         = 24                        \
    \      : size = 4\n            .MyFunction3#20 PROC NEAR\n            : Line 12\n\
    \                push       ebp\n                mov        ebp, esp\n       \
    \         fld        QWORD PTR,_z[ebp]\n                fadd       QWORD PTR,___real83ff000000000000\n\
    \                fld        QWORD PTR,_y[ebp]\n                fadd       QWORD\
    \ PTR,___real8400000000000000\n                stp        ST(0),ST(0)\n      \
    \          fld        QWORD PTR,_z[ebp]\n                fadd       QWORD PTR,___real8400800000000000\n\
    \                stp        ST(0),ST(0)\n            : Line 14\n             \
    \   pop        ebp\n                ret        20                            \
    \  : 0000004b\n            .MyFunction3#20 END\n            .TEXT\n          \
    \  END\n```\n\nx is the highest on the stack, and z is the lowest, therefore these\
    \ parameters are passed from right-to-left. We can tell that x is the smallest\
    \ offset (offset + 8), while z is the largest offset (offset + 24). We also see\
    \ as the final fimult instruction that the return value is on the FPU stack. This\
    \ function also cleans the stack as needed, by the call ret. It cleans 20 bytes\
    \ off the stack which is, incidentally, the total amount that we passed to begin\
    \ with. We can also notice that the implementation of this function works exactly\
    \ like the FASTCALL version of this function. This is true because FASTCALL only\
    \ passes DWORD-sized parameters in registers, and floating point numbers do not\
    \ qualify. This means that our assumption above was correct.\n\nHere is the GCC\
