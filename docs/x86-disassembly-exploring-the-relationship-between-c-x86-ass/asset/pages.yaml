    This function loops through an array of 4 byte integer values, pointed to by esi,
    and adds each entry. It returns the sum in eax. The only parameter (located in
    [ebp+8]) is a pointer to an array of integer values. The comparison between ebx
    and 100 indicates that the input array has 100 entries in it. The pointer offset
    [esi + ebx * 4] shows that each entry in the array is 4 bytes wide.


