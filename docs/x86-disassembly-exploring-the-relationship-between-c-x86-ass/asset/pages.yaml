- pgno: 13
  md: '# Assemblers and Compilers


    The Microsoft C compiler is cl.exe and the linker is link.exe


    # Listing Files


    In thisibook, cl.exe is frequently used to produce assembly listing files of C
    source code. To produce an assembly listing file yourself, use the syntax:


    ```

    cl.exe /Fa*assembly file name <C source file>

    ```


    The /Fa* switch is the command-line option that tells the compiler to produce
    an assembly listing file.

    For example, the following command line:


    ```

    cl.exe /Faest.asm Test.c

    ```


    would produce an assembly listing file named ''Test.asm'' from the C source file
    ''Test.c''. Notice that there is no space between the /Fa switch and the name
    of the output file.


    # 1.7.2 GNU C Compiler


    The GNU C compiler is part of the GNU Compiler Collection (GCC) suite. This compiler
    is available for most systems and it is free software. Many people use it exclusively
    so that they can support many platforms with one compiler to deal with. The GNU
    GCC is the facto standard compiler for Linux and Unix systems. It is retargetable,
    allowing for many input languages (C, C++, Obj-C, Ada, Fortran, etc...), and supporting
    multiple target OSES and architectures. It optimizes well, but has a non-aggressive
    IA-32 code generation engine.


    The GCC frontend program is ''gcc'' (''gcc.exe'' on Windows) and the associated
    linker is ''ld'' (''ld.exe'' on Windows).


    # Listing Files


    To produce an assembly listing file in GCC, use the following command line syntax:


    ```

    gcc.exe -S <sourcefile>.c

    ```


    For example, the following commandline:


    ```

    gcc.exe -S test.c

    ```


    will produce an assembly listing file named ''test.s''. Assembly listing files
    generated by GCC will be in GAS format. On x86 you can select the syntax with
