    ```\n\n# ## 11.4.3 Extern \"C\"\n\nIn a C++ source file, functions placed in an\
    \ extern \"C\" block are guaranteed not to be mangled. This is done when libraries\
    \ are written in C++, and the functions need to be exported without mangling.\
    \ Even though the program is written in C++ and compiled with a C++ compiler,\
    \ some of the functions might therefore not be mangled and will use one of the\
    \ ordinary C calling conventions (typically CDECL).\n\n# ## 11.5 Note on Name\
    \ Decorations\n\nWe've been discussing name decorations in this chapter, but the\
    \ fact is that in pure disassembled code there are no names whatsoever, especially\
    \ names with fancy decorations. The assembly stage removes all these readable\
    \ identifiers, and replaces them with the binary locations instead. Function names\
    \ really only appear in two places:\n\n+   1. Listing files produced during compilation\n\
    2. In export tables, if functions are exported\n\nWhen disassembling machine code,\
    \ there will be no function names and no name decorations to examine. For this\
    \ reason, you need to pay more attention to the way parameters are passed, the\
    \ stack is cleaned, and other similar details.\n\nWhile we've covered optimizations,\
    \ it suffices to say that optimizing compilers make a mess out of these details.\
    \ Functions which are not exported do not need to maintain standard interfaces,\
    \ and if it is determined that a particular function does not need to follow a\
    \ standard convention, some of the details will be optimized away. In these cases,\
    \ it can be difficult to determine what calling conventions were used (if any),\
    \ and it is even difficult to determine where a function begins and ends. This\
    \ book cannot account for all possibilities, so we try to show as much information\
    \ as possible, with the knowledge that much of the information provided here will\
    \ not be available in a true disassembly situation."
