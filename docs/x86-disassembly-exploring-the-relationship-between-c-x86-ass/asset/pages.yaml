    \ %edx\nmovl    %edx, %eax\nadd    %eax, %eax\nadd    %edx, %eax\nleal    (%eax),\
    \ %eax\n```\n\nthe value at +12 from ebp is moved into edx. edx is then moved\
    \ into eax. eax is then added to itself (eax * 2), and is added back to edx (edx\
    \ + eax). remember that eax = 2 * edx, so the result is eax * 3. This is clearly\
    \ the y parameter, which is furthest on the stack, and was the first passed. CDECL\
    \ then on GCC is implemented by passing arguments on the stack in right-to-left\
    \ order, as same as cleve.\n\n# 12.2.2 FALLCAST\n\n```\n.global %MyFunction1@\n\
    .def\t.scl\t2; .type\t32; .endef\n%MyFunction1@:\npushl    %ebp\nmovl    %esp,\
