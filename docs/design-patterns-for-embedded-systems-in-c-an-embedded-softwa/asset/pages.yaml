    Once selected, the next step is to instantiate the pattern, and as part of that,
    to make decisions about how to best implement the pattern. Instantiation is a
    matter of replacing the formal parameters of the pattern with elements from your
    original model. In this case, formal parameter Concrete Subject will be replaced
    by the TMDQueue and the formal parameter Concrete Observer will be replaced by
    the clients WaveformDisplay, HistogramDisplay, QRDetector, and ArrhythmiaDetector.
    The resulting design model is shown in Figure 2-11. In this diagram you can see
    the original environmental control elements, the pattern, and elements of the
    super class


    The relations, attributes, and operations of the Abstract Subject are inherited
    by the TMDQueue class while the features of the Abstract Observer are inherited
    by the various clients of the TMDQueue. Inheritance can be implemented in C in
    many ways, as such:


    +   * Copying from the super class implementation into the subclass implementation

    * Using a "mix-in"; that is, delegate requests from an instance of the subclass
    to instance of the super class

    * Implementing a virtual function table, as discussed in Chapter 1


