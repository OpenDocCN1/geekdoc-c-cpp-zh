  md: '# UML Notation 427


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_447_0.png)


    Figure A-2 More Class Diagram notations


    # ### 1.1.1.2 Relations


    # #### 1.1.1.2.1 Association


    The specification of a navigable connection among classes. It may be unidirectional
    or bidirectional. Each end of the association is called an association role end
    and has a *multiplicity*: The multiplicity is the number of instances of the target
    class that participates in the interaction. “1” is the most common multiplicity
    and “*” means “zero or more”.


    An association is most commonly implemented as a pointer or collection of pointers.


    # #### 1.1.1.2.2 Link


    A link is an instance of an association; that is, a link exists when the pointer
    is populated with the address of the instance; if the pointer is NULL, the link
    doesn’t exist.


    # #### 1.1.1.2.3 Generalization


    Generalization is an is-a-specialized-kind-of of relation with the arrow pointing
    to the more general class. The super- (more general) class’s features, including
    attributes, operations, and relations, are all inherited by the sub- (more specific)
    class.'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# 428 Appendix A


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_448_0.png)


    Figure A-3 Structured class notation


    # 1.1.1.2.4 Realization


    Realization is the relation between an interface and a class that implements the
    services specified by an interface.


    # 1.1.1.2.5 Aggregation


    Aggregation is a weak form of a whole-part association between two classes where
    the diamond indicates the “whole” end. It is weak in the sense that this relation
    does not imply creation and destruction responsibilities on the part of the whole.


    # 1.1.1.2.6 Composition


    Composition is a strong form of a whole-part association between two classes;
    again, the (now filled) diamond is at the end of the whole. It is strong in the
    sense that the whole is responsible for both the creation and destruction of the
    part instance.


    # 1.1.1.2.7 Dependency


    This is a general relationship not otherwise denoted. It is common to add a stereotype
    (such as «Usage») to indicate what kind of dependency you want. The «Usage» dependency
    is common'
