    Figure 2-1: Harmony/ERT timescales


    Mechanistic design optimizes at the level of the collaboration, where a collaboration
    is a collection of simpler elements (types, functions, variables, and classes)
    interacting to achieve a single use case or system capability. Each system has
    usually as few as half a dozen to as many as several dozen capabilities; as such,
    the scope of mechanistic design is an order of magnitude smaller than architectural
    concerns.


    Detailed design limits itself to the smallest level of concern – the insides of
    functions, variables, types, and classes. This level of design is perhaps the
    most common focus of by developers often have the least impact on overall system
    performance.


    At any level of focus, the basic workflow for design is provided by Figure 2-4.
    Because these steps will form the basis of how we use design patterns, let’s discuss
    each of them in turn.


    # 2.1.1.1 Construct the Initial Model


    This step is crucial but often omitted in the developer’s haste to optimize. The
    step means before optimization is considered, a working model and code base is
    created. By “working” I mean not only that it compiles and runs, but also that
    it is robust and functionally correct. I also mean that it is debugged and unit-tested
    for functional correctness. It may be tested for performance to determine whether
    optimization is required that is optional at this point.'
