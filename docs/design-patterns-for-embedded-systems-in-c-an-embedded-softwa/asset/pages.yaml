    # 1.2.5 Finite State Machines


    A finite state machine (FSM) is a machine specified by a finite set of conditions
    of existence (called "states") and a likewise finite set of transitions among
    the states triggered by events. An FSM differs from an activity diagram or flow
    chart in that the transitions are triggered by events (primarily) rather than
    being triggered when the work in the previous state is complete. Statecharts are
    primarily used to model the behavior of reactive elements, such as classes and
    use cases, that wait in a state until an event of interest occurs. At that point,
    the event is processed, actions are performed, and the element transitions to
    a new state.


    Actions, as the execution of a primitive C statement or the invocation of an operation,
    may be specified to be executed when a state is entered, or when a transition
    occurs. The order of execution of actions is exits of the predecessor state, followed
    by the transition actions, followed by the entry actions of the subsequent state.


    The UML use statecharts as their formal FSM representation, which are significantly
    more expressive and scalable than “classical” Mealy-Moore FMS. UML state machines,
    based on Dr. David Harel''s statechart semantics and notation, have a number of
    extensions beyond Mealy-Moore state machines:


    +   - Nested states for specifying hierarchical state membership

    - AND-states for specifying logical independence and concurrency

    - Pseudostates for annotating commonly-needed dynamic semantics


    Figure 1-3 shows some of the basic elements of the stateSupervisor class previously
    shown in Figure 1-1. It includes basic OR-states and transitions, as well as a
    few less-elementary concepts, including nested states and conditional and initial
    pseudostates.'
