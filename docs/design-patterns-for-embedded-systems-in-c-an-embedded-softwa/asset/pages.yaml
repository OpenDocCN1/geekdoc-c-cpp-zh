  md: '# About the Author


    Bruce Powel Douglass was raised by wolves in the Oregon wilderness. He taught
    himself to read at age 3 and learned calculus before age 12. He dropped out of
    school when he was 14 and traveled around the U.S. for years before entering the
    University of Oregon as a mathematics major. He eventually received his M.S. in
    exercise physiology from the University of Oregon and his Ph.D. in neurophysiology
    from the USD Medical School, where he developed a branch of mathematics called
    autocorrelative factor analysis for studying information processing in multicellular
    biological neural systems.


    Bruce has worked as a software developer in real-time systems for over 30 years
