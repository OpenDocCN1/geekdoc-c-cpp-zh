  md: '# Embedded Programming with The Harmony™ for Embedded RealTime Process 47


    # 2.1.5 Using Design Patterns in Development

    By this point, you should have a reasonably good understanding of what a pattern
    is and how it is organized. You should also have at least a vague grasp of the
    Harmony/ERT process and our view of where design fits into the overall scheme
    of things. Earlier in this chapter, you got a grounding in what we mean by the
    term architecture and the five views of architecture. At this point, you are already
    ready to read the patterns in this book and apply them to your applications development.
    But first, let''s briefly discuss how we might use patterns in our daily work
    lives.


    # 2.1.5.1 Pattern Hatching – Locating the Right Patterns

    You''re facing a design problem. How do you find the patterns that can be applied
    to solve your particular design issues? We recommend a multistep approach, as
    shown in Figure 2-5.


    +   1. Familiarize yourself with the patterns

    First, before your design, familiarize yourself with the patterns literature.
    There are a number of books, papers, and websites devoted to patterns in application
    domains. Some of those patterns are given here and others are given in the references.
    Once you have increased your vocabulary to include patterns likely to be relevant
    to your application domain, you have more intellectual ammunition to face your
    design challenges.

    2. Identify design criteria

    in parallel with reading about potential design alternatives, you must identify
    design criteria. There are many (often conflicting) optimizations you can make
    to your system. This step identifies the design optimizations that are important
    for this particular system in its operational and development contexts.

    3. Rank design criteria

    Not all optimizations are equally important. For this reason, the design criteria
    must be ranked to enable good tradeoff decisions to be made.

    4. Identify potential design alternatives

    This step finds patterns that optimize the design criteria of importance at a
    cost that seems reasonable. While it is possible to add a single pattern at a
    time in this way and repeat the workflow, it is also common to consider a set
    of compatible patterns together as a single design alternative.

    5. Evaluate the design alternatives

    Using the trade study approach suggested earlier, this step compares the design
    alternatives (consisting of one or more design patterns) against each other on
    the basis of their effectiveness against the design criteria, weighted with the
    relative importance of each.


