  md: '# 4.1 Basic Concurrency Concepts


    Patterns in this chapter

    Cyclic Executive Pattern – Schedule threads in an infinite loop

    Static Priority Pattern – Schedule threads by priority

    Critical Region Pattern – Protect resources by disabling task switching

    Guarded Call Pattern – Protect resources through mutex semaphores

    Queuing Pattern – Serialize access through queuing messages

    Rendezvous Pattern – Coordinate complex task synchronization

    Simultaneous Locking Pattern – Avoid deadlock by locking resources

    Ordered Locking Pattern – Avoid deadlock by locking resources only in specific
    orders


    Most embedded systems need to perform several activities simultaneously. The key
    to do is that through the definition and management of the concurrency model of
    the system. In this section, I will provide an overview of the basic terms and
    concepts of concurrency to support the understanding and usage of the design patterns
    that come later in this chapter.

    The most important terms to understand are given in the sidebar.


    +   * Action Sequence: a series of actions, possibly with decision branch points,
    in which the order of execution is fully determined

    * Arrival Pattern: how the event begins a concurrency unit arrives; it may be
    periodic or aperiodic

    * Blocking: severe priority inversion

    * Blocking time: the length of time a high-priority task is prevented from running
    because a lower-priority task requires a resource

    * Concurrency: the simultaneous execution of action sequences

    * Concurrency unit: a set of actions executed sequentially in the same thread
    of execution. Also known as a task or thread

    * Criticality: the importance of the completion of an action sequence

    * Deadline: a point in time at which the completion of an action or action sequence
    becomes incorrect or irrelevant

    * Deadlock: a situation in which multiple clients are simultaneously waiting on
    the same conditions but the conditions cannot, in principle, be satisfied'
