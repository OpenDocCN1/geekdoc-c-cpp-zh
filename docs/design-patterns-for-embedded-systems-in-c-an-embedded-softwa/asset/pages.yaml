    There are a number of ways commonly used to implement AND-states. The first, and
    least desirable, is to flatten the state space. This is problematic, as was pointed
    out in Figure 5-6 because of state explosion—you must compute the cross product
    of the state spaces and that’s very ugly and difficult to read and understand
    because of the sheer of resulting states. It does work, however, and in simple
    cases it might be easiest.


    A more common solution is to decompose the object owning AND-states into a set
    of different objects that communicate. This the Decomposed AND-State Pattern discussed
    below. It is also possible to elaborate one of the previous patterns we’ve presented
    into managing multiple AND-states in the event receptors. There are other solutions
    as well, and these are the most common.


    # 5.8 Decomposed AND-State Pattern


    This pattern extends the State Pattern to implement AND-states. It does so by
    creating a collaboration of different objects, each of which is allocated one
    of the AND-states.'
