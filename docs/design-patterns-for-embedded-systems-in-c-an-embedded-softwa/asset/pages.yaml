    # Patterns in this chapter


    One''s Complement Pattern – Adds a bitwise inverted copy of primitive data elements
    to identify when data is corrupted in vivo


    CRC Pattern – Adds a cyclic redundancy check to identify when bits of the data
    have been corrupted in vivo


    Smart Data Pattern – Adds behavior to the data to ensure that the data’s preconditions
    are adhered to


    Channel Pattern – Arranges the processing of sensory data as a series of transformational
    steps to provide a unit of large-scale redundancy


    Protected Single Channel Pattern – Elaborates the channel pattern by adding data
    and processing validation checks at various points within the single channel


    Dual Channel Pattern – Creates multiple channels to aid in the identification
    of errors and failures, and optionally, allows continuation of service in the
    presence of such fault


    # 6.1 A Little Bit About Safety and Reliability


    Reliability is a measure of the “up-time” or “availability” of a system – specifically,
    it is the probability that a computation will successfully complete before the
    system fails. Put another way, it is a stochastic measure of the probability that
    the system can deliver a service. It is normally estimated with Mean Time Between
    Failure (MTBF) or a probability of successful service delivery (e.g., 0.9999).
    Reliability analysis is normally managed within Fault Tree and Effect Analysis
    (FMEA) as shown in Figure 6.1.


    Safety is distinct from reliability. A safe system is one that does not incur
    much risk to persons or equipment. A hazard is an event or condition that leads
    to an accident or mishap – a loss of some kind, such as injury or death. The risk
    associated with a hazard is the product of the severity of the hazard and its
    likelihood.


    Hazards arise in five fundamental ways:


    +   - Release of energy

    - Release of toxins

    - Interference of life support functions

    - Supplying misleading information to safety personnel or control systems

    - Failure to alarm when hazardous conditions arise'
