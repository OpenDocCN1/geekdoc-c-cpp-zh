    State machines are an extremely powerful means by which the behavior of a complex,
    embedded system can be controlled and orchestrated. As mentioned, it will be the
    subject of this and the next chapters.


    Lastly, the fourth type of behavior is a combination of the previous two, known
    as piece-wise continuous behavior (see Figure 5.3). In PC behavior, within a state,
    continuous (and, for that matter, simple) the behaviors that occur are of the
    same kind, but between states, different kinds of behaviors occur. A simple example
    of this is using different sets of differential equations depending on the state
    of the system.


    # ## 5.2 Basic State Machine Concepts


    A Finite State Machine (FSM) is a directed graph composed of three primary elements:
    states, transitions, and actions. A state is a condition of a system or element
    (usually a class in an object-oriented system). Looking back to, the element is
    the microwave oven (or at least the collection of elements involved in cooking)
    and the states are the conditions of that system – Off, Ready, Microwaving, DoorOpen,
    and Paused. Normal names for states are verbs, adverbs, and verb phrases.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_281_0.png)


    Figure 5-3: Piece-wise continuous behavior'
