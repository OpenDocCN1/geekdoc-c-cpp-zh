    # ### 3.8.4.3 OpportunisticPoller


    This element has the poll() function that scans the attached devices for data
    and device state and passes this information on the appropriate client for each.
    The difference between the OpportunisticPoller and the PeriodicPoller is that
    the latter has timer initialization and shut-down functionality in addition to
    polling for the data.


