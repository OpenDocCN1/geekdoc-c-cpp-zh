  md: "# 192 Chapter 4\n\n# 4.5.4.3 Semaphore\n\nThe Semaphore is a mutual exclusion\
    \ semaphore class that serializes access to a GuardedResource. The guarded functions\
    \ of the GuardedResource invoke the lock() of the Semaphore whenever they are\
    \ called and release() once the service is complete. Other client threads attempt\
    \ to invoke a service when its associated Semaphore is locked until the Semaphore\
    \ is unlocked. The blocking is performed when the Semaphore signals the StaticPriorityScheduler\
    \ that a call attempt was made by the currently active thread. The mutexID identifies\
    \ Mutex is blocking the task. This element is usually provided by the RTOS. This\
    \ is the same element that appears in the Static Priority Pattern earlier in this\
    \ chapter.\n\n# 4.5.4.4 StaticPriorityScheduler\n\nThis object orchestrates the\
    \ execution of multiple threads based on their priority. In this pattern, we are\
    \ focusing on the responsibility (not shown) of this element to block a task if\
    \ it attempts to lock an already-locked Semaphore and unlock all tasks blocked\
    \ on the mutexID when this lock is released. This element is usually provided\
    \ by the RTOS. Note this is the same element that appears in the Static Priority\
    \ Pattern earlier in this chapter.\n\n# 4.5.5 Consequences\n\nThis pattern provides\
    \ a timely access to a resource and at the same time prevents simultaneous accesses\
    \ that can result in data corruption and system misbehavior. If the resource is\
    \ not locked, then access proceeds without delay. If the resource is currently\
    \ locked, then the caller must wait until the lock is released. Naïve use can\
    \ result in unbounded priority inversion in the manner described in Figure 4-5.\
    \ See Section 4.5.7 Related Patterns for a discussion of an RTOS-supported solution.\n\
    \n# 4.5.6 Implementation Strategies\n\nThe tricky part of implementing the pattern\
    \ lies in the implementation of the Mutex. Usually, the RTOS will provide a Semaphore\
    \ instance, accessible through operations such as:\n\n+   - OSemaphore OS_create_semaphore()\n\
    \  creates a semaphore and returns a pointer to it.\n- void OS_destroy_semaphore(OSSemaphore*)\n\
    \  destroys the semaphore pointed at.\n- void OS_lock_semaphore(OSSemaphore*)\n\
    \  locks the relevant semaphore. If called with an unlocked OSemaphore, it becomes\
    \ locked. If already locked, then it blocks the current task with its internally-stored\
    \ mutexID. The scheduler must store the task data including the continuation entry\
    \ point and stack."
