    # 2.1.1.5 Apply Design Patterns and Technologies


    This step refers to the application of the selected design alternative. In design
    pattern terms, this is known as pattern instantiation. As we will see, this is
    primarily a matter of replacing the formal pattern patterns with the relevant
    elements from the working analysis model.


    # 2.1.1.6 Validate Design Solution


    The validation step ensures the solution works and checks two different facets
    of the solution. First, it ensures that the functionality of the system continues
    to be correct; that is, adding in the design solution didn''t break the running
    model and code. Secondly, since we selected the design patterns to optimize the
    system, we must ensure that we''ve achieved our optimization goals. This means
    that we will rerun the previous functional and unit tests and also add quality
    of service tests to measure performance, memory usage, or whatever measures are
    appropriate to verify our design criteria are met.


    # 2.1.2 What Is a Design Pattern?


    A design pattern is "a generalized solution to a commonly occurring problem."
    To be a pattern, the problem must recur often enough to be useful generalizable
    and the solution must be general enough to be applied in a wide set of application
    domains. If it applies to a single application domain, then it is probably an
    analysis pattern. Analysis patterns define ways for organizing problem-specific
    models and code for a particular application domain.


    Remember that analysis is driven by what the system must do while design is driven
    by how well the system must achieve its requirements. A design pattern is a way
    of organizing a design that improves the optimality of a design with respect to
    one or a small set of design criteria


    A design pattern always has a focused purpose – which is to take one or a small
    set of these QoS properties and optimize them at the expense of the others. Each
    pattern optimizes some aspect of a system at the cost of deoptimizing some others.
    These constitute a pros and cons.


    A good design is composed of a set of design patterns applied to a piece of functional
    software and incurs an acceptable cost in doing so. That is, a good design optimizes
    the important design criteria at a cost that we are willing to pay. Note that
    a design always encompasses several different design patterns, so'
