    # 3.5.4.2 AbstractSubject Interface


    The AbstractSubject is the data server in this pattern. Relevant to this pattern
    it provides three services. The subscribe(acceptPtr) service adds the pointer
    to the accept function to the notification list. Its return value is zero if the
    accept is successful or non-zero if not. The unsubscribe(acceptPtr) function removes
    the accept function from the notification list, again returning zero if successful.
    Finally, the notify() function walks the notification list to notify the subscribed
    clients. This is done by invoking the function pointed to by each handler.


    The AbstractSubject also contains a link to the Datum to be passed as well as
    a list of NotificationHandles. In the representation here, the NotificationHandle
    is implemented as an array of pointers, but it can also be a linked list or other
    data structure. Similarly, the Datum can be on the heap, stack, or static as appropriate.


    # 3.5.4.3 ConcreteClient


    The ConcreteClient is a concrete realization of the AbstractClient interface.
    That is, it provides an acceptPtr(Datum) function as well as other functionality
    not relevant to the pattern per se.


    # 3.5.4.4 ConcreteSubject


    The ConcreteSubject is a concrete realization of the AbstractSubject interface.
    It provides implementation of the functions but also means to acquire and manage
    the'
