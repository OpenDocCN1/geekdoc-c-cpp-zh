  md: '# 232 Chapter 4


    between Task 1 between locking R1 and R2. The following description refers to
    the named points in Figure 4-22.


    +   A. At this point, Task 2 runs.

    B. Task 2 locks R1 and is just about to lock R2.

    C. Task 1 runs. Since it is higher priority than Task 2, it preempts Task 2.

    D. Task 1 locks R2.

    E. Task 1 now attempts to lock R1, however, R1 is currently locked by Task 2.
    If Task 1 blocks all Task 2 to run, Task 2 must block as soon as it tries to lock
    R1. The system is in deadlock.


    It is enough to break any of the four required conditions for deadlock (below)
    conditions to ensure that deadlock cannot appear. The simultaneous locking, ordered
    locking, and critical region patterns avoid all problems of deadlock. For example,
    had Task 2 enabled a critical region (i.e., disallowed task switching) before
    it locked R1, then Task 1 would not have been able to preempt before it locked
    R2. If both tasks locked the resources in the same order, deadlock would have
    been prevented. If Task 2 locks resources at the same time, there would be no
    problem. Deadlock is easy to prevent, but you must take careful steps to do.


    Leaving aside the common problems of software errors, deadlocks require four conditions
    to be true:


    +   1. mutual exclusion of resources

    2. some resources are locked while others are allowed

    3. preemption while resources are locked is allowed

    4. a circular waiting condition exists


    Deadlock can be avoided by breaking any of these four conditions. Using the Critical
    Region Pattern, for example, breaks rules #1 and #3. The Queuing Pattern, because
    it uses asynchronous messaging avoids #1 (other than the lock on the queue access
    itself). This chapter finishes up with two other patterns that avoid deadlock.


    # 4.8 Simultaneous Locking Pattern


    The Simultaneous Locking Pattern is a pattern solely concerned with deadlock avoidance.
    It achieves this by locking condition #2 (holding resources while waiting for
    others). The pattern works in an all-or-none fashion. Either all needed resources
    are locked at once or none are locked.


    # 4.8.1 Abstract


    Deadlock can be solved by breaking any of the four required conditions. This pattern
    prevents the condition of holding some resources by requesting others by allocating
    them all at once.'
