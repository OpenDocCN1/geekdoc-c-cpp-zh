    \n# ### 3.7 Interrupt Pattern\n\nThe physical world is fundamentally concurrent\
    \ and asynchronous; it’\\u019s nonlinear too, that’s a different story. Things\
    \ when they happen and if your embedded system isn’t paying attention, those occurrences\
    \ may be lost. Interrupt handlers (a.k.a. Interrupt Service Routines, or ISRs)\
    \ are a useful way to be notified when an event of interest occurs if your embedded\
    \ system is off doing other processing.\n\n# ### 3.7.1 Abstract\n\nThe Interrupt\
    \ Pattern is a way of structuring the system to respond appropriately to incoming\
    \ events. It does require some processor- compiler-specific services for most\
    \ embedded compilers, and even some operating systems provide services for just\
    \ this purpose. Once initialized, an interrupt will pause its normal processing,\
    \ handle the incoming event, and then return the system to its original computations.\n\
    \n# ### 3.7.2 Problem\n\nIn many systems, events have levels of urgency¹⁴. Most\
    \ embedded systems have at least events with a high urgency that must be handled\
    \ even when the system is busy doing\n\n> ¹⁴ Urgency is a measure of the rapidity\
    \ with which an event must be handled, usually expressed as the nearness of a\
    \ deadline. This topic will be discussed in more detail in Chapter 4."
