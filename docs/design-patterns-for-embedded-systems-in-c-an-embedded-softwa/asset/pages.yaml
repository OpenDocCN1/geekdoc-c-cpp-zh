  md: '# Chapter 3


    to access the device, such as an RS232 serial port or an Ethernet connection,
    then this data type and its access method will be more complex. In any event,
    the public functions provided by the Hardware Proxy completely hide the proxy
    connects to the actual device. This variable is not directly accessible by the
    client.


    # initialize()


    This public function enables and initializes the device prior to first use. It
    is common for this function to have no parameters but in some cases it may need
    values provided by the client.


    # marshal()


    This private function takes parameters from other functions and performs any required
    encryption, compression, or bit-packing required to send the data to the device.
    This ensures the peculiarities of the device interface are hidden from the client.
    Data in the format required by the actual device are known as "marshaled data"
    or are said to be in "native format." Data that are in a form is easily manipulated
    by software are said to be "unmarshaled" or in "presentation format." This function
    is not accessible by the client since native format is hidden from the clients.


    # mutate()


    This public function writes data values to the device. This function always has
    one or more input parameters. It usually calls `marshal()` operation prior to
    writing the value to the device.


    # unmarshal()


    This private function performs any necessary unpacking, decryption, and decompression
    of the data retrieved from the device prior to returning them to the client in
    presentation format. This ensures that the peculiarities of the device interface
    are hidden from the client. This function is not accessible by the client.


    # 3.2.4.3 Proxy Client


    The proxy client "knows about" the Hardware Proxy and invokes its services to
    access the hardware device.


    # 3.2.5 Consequences


    The pattern is extremely common and provides all the benefits of encapsulation
    of the hardware interface and encoding details. It provides flexibility for the
    actual hardware interface to change radically with absolutely no changes in the
    clients. This is because the hardware details are all encapsulated within the
    Hardware Proxy. This means that the proxy clients are usually unaware of the native
    format of the data and manipulate them only in presentation format.'
