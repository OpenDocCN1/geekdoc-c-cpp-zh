    # 6.4.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 6.4.1 ErrorCodeType


    The ErrorCodeType is an enumeration of possible error codes. This can be, and
    is often, done with ints but clarify the intention and usage of the codes more
    clearly.


    # 6.4.2 ErrorManager


    The ErrorManager class handles the errors identified within the SubRange; the
    actions are system-, context-, and error-specific.


    # 6.4.3 ServerClass


    This role in the pattern is an element that uses the SmartDataType.


    # 6.4.4 SmartDataType


    One of the disadvantages of data structures is that while they have preconditions
    and rules for proper usage, they have no intrinsic behavior to enforce the conditions
    and rules. This class binds together the data (of type PrimitiveType) with operations
    that ensure they stay in range.


    This class provides a variety of functions. The SmartDataType_Init() function
    takes five parameters — the me pointer to the instance data, the initial value
    set, the low and high values validating the data subarray, and the address of
    the ErrorManager. If the entire range of the primitive type is valid, you can
    simply use the primitive type or use the low and high values to the min and max
    for the type (such as SHRT_MIN and SHRT_MAX, or INT_MIN and INT_MAX declared in
    <limits.h>, for example). To create a new instance on the heap, use SmartDataType_Create(),
    which takes three parameters — the value, the low boundary, and the high boundary
    and returns a pointer to the newly created instance.


    SmartDataTypes can be assigned to each other with the SmartDataType_setValue()
    and SmartDataType_getValue() functions and compared with the boundary with the
    SmartDataType_cmp() function and without be independently set with the SmartDataType_setPrimitive()
    and SmartDataType_getPrimitive() functions. The low and high boundaries can be
    set independently.


    # 6.4.5 Consequences


    The downside for using smart types is the performance overhead for executing the
    operations. The upside is that data is self-protecting and provide automatic checking
    when data are set. It is also possible for the programmers to avoid using the
    functions'
