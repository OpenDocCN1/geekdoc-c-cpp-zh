    the ISR into the interrupt vector table while the removeInterruptHandler() restores
    the original vector. The startPolling() initializes the timer. The stopPolling()
    stops the timer but leaves the vector in the interrupt vector table.


    # 3.8.4.5 PollDataClient


    This element is the client for data and state information from one or more of
    the devices. In some cases, there may be a single client for the data from all
    devices, but in general each device has its own client.


    # 3.8.4.6 PollTimer


    The PollTimer element represents a timer and the services associated with it.
    The startTimer() method installs the handleTimerInterrupt() service routine in
    the interrupt vector table and creates a timer with the pollTime attribute. Once
    the timer is started, it will set the timer so that its ISR handleTimerInterrupt()
    will be invoked, which first resets the timer count and calls the poll() function.


    # 3.8.5 Consequences


    Polling is simpler than the setup and use of the Interrupt Service Routines, although
    periodic polling is usually implemented with an ISR tied to a poll timer.


    Polling can check many different devices at the same time for status changes but
    is usually less timely than interrupts. For this, care must be taken that if there
    are deadlines associated with the data or signals that the poll time plus the
    response time is always less than the deadlines involved. If data arrive faster
    than the poll time, then data will be lost. This is not a problem in many applications
    but is fatal (sometimes less so) in others.


    # 3.8.6 Implementation Strategies


    The simplest implementation is to insert the hardware check in the middle of a
    main processing loop that executes as long as the system operates. This is called
    "symmetric opportunistic polling" because it operates the same way as all time,
    even when the length of the processing loops can vary widely. Asymmetric opportunistic
    polling refers to the practice of placing checks for new data at convenient but
    unrelated points throughout the processing. This approach allows for better tuning
    (if you need to be more responsive, add checks) but has a larger impact on the
    primary flow and is harder to maintain.


    Periodic polling is polling that takes place with a regular time interval (as
    the period) with a bounded variation (known as the jitter). To achieve this regularity,
    the checks for new data are initiated by a timer to an interrupt. This periodic
    variant of the Polling Pattern is simply a special case of the Interrupt Pattern.'
