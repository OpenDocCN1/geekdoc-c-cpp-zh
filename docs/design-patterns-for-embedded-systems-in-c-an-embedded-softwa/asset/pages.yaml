  md: '# 5.9 OK, What Have We Learned?


    This chapter presents a number of patterns for the implementation of state machines.
    Each of these implementation patterns offers benefits and costs, so which you
    depends upon what you are trying to optimize. The Single Event Recceptor Pattern
    uses a single event receptor and implements the state behavior internally as a
    large switch-case statement. It requires the creation of a type associated with
    the event to pass to the receiver. In contrast, the Multiple Event Receptor Pattern
    uses separate event handlers for each event so that the event type is not explicitly
    represented. This makes the interface to the client slightly richer. The State
    Table Pattern scales up to large state spaces and provides performance that is
    independent of the size of the state space – good for large state spaces. However,
    it takes more set-up time than the other approaches and may waste memory for sparse
    state spaces. The State Pattern creates separate objects for each state. The implementation
    is less complex than for the State Table Pattern and distributes the complexity
    of the state machine across several objects. The Decomposed And-State Pattern
    provides a straightforward way of implementing AND-states but requires the use
    of polymorphism.'
