  md: 'you see that there are 10. Further, in this light, it is possible to go from
    any of these states to any other. The figure shows one source state going to all
    other states (Red_Steady) and one target state receiving transitions from all
    other states (Off); you can imagine the rat''s nest that would result from actually
    drawing all transition paths.


    You can see that to consider all aspects of the independent aspects, you must
    multiply the independent spaces together, resulting in a possibly enormous set
    of states (imagine now adding a third independent aspect, brightness – low, medium,
    and high – into the mix). This problem is so common it has a name – state explosion.
    UML state machines have a solution to the state explosion problem – AND-states.


    AND-states are special independent states that are always nested inside other
    states. The special rule for AND-states is that the element must be in exactly
    one of each active AND-state at each level of abstraction. In the case of the
    light, we''ll have one AND-state for color and another for display rate. You can
    see that this simplifies the problem so that we have no problem representing the
    transitions in the state machine even though we couldn''t before (and maintain
    any semblance of readability). This is shown in Figure 5-7. The dashed line in
    the middle of the On state is an AND-line and separates the two AND-states.


