  md: '# 6.6.5 Implementation Strategies


    In general, the benefits are providing a clear means for identifying faults and,
    depending on the pattern, providing redundant channels to continue to provide
    services or to go to a “fault-safe state.” The drawbacks of using the pattern
    are the extra memory (both code and data), processing time, and hardware required,
    depending on the specific usage of the channel.


    As mentioned, the pattern may be implemented with true generalization, but it
    is more common in C to think of the AbstractDataTransformation as a placeholder
    for some particular ConcreteDataTransform class; the links are from different
    subtypes of ConcreteDataTransform classes that perform some special step in the
    overall data transformation function.


    Data are passed through one of two primary strategies. The simplest is to acquire
    a datum and pass it the series of transformations and to the actuator before acquiring
    the next. In higher bandwidth applications multiple instances of the data may
    be present in the channel at the same time, one instance per transform, with the
    data passed from one transform to the next at the same time as all the other data
    instances.


    In addition, the data checks may be put “in place” in some of the transformation
    steps rather than implement them as a separate class. That is, in fact, the specialization
    of this pattern from the more generic Channel Pattern.


    # 6.6.6 Related Patterns


    This pattern provides medium- to large-scale redundancy. It is one of many patterns
    based on the Channel Pattern discussed earlier in this chapter. In my Real-Time
    Design Patterns: Robust Scalable Architecture for Real-Time Systems (Addison-Wesley,
    2002).


    The transformation checks can themselves be based on patterns such as the One’s
    Complement and CRC patterns discussed earlier.


    # 6.6.7 Example


    In Figure 6-12, I purposely chose a situation that demanded a bit more creative
    application of the pattern. This is a heating system with sensor sets for multiple
    rooms, each having sensors for fan speed, temperature, and thermostat settings.
    The example isn''t laid out exactly as the pattern, I indicated that pattern role
    each class plays by adding a stereotype¹⁰ to each.


    > 10 A stereotype is “a special kind of” marking that appears inside « marks.
    In this case, the stereotypes are the names of the pattern roles.'
