  md: '# 6.6.3 Pattern Structure


    The pattern, shown in Figure 6-11, is a simple elaboration of the Channel Pattern
    (see Figure 6-8). All we''ve added here are some checks on some of the transformation
    steps. In fact, these checks need not be implemented in separate classes, but
    can be implemented internal to the ConcreteTransformations themselves. These checks
    can be any kind of checks, as:


    +   - Range checking (are data in the required range?)

    - Reasonableness checks (are data in the expected range for the given situation?)

    - Consistency checks (is the value consistent with other data being computed at
    the same time?)

    - Backwards transformational checks (we can reconstruct the input values from
    the output values?)

    - Data validity checks, such as we’ve seen before with the One’s Complement and
    CRC Patterns


    and so on.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_423_0.png)


    Figure 6-11: Protected Single Channel Pattern'
