  md: '# 248 Chapter 4


    # 4.9.6 Implementation Strategies


    The implementation of the pattern requires the addition of a resourceID to each
    OrderedResource and logic in the ResourceList to ensure that the resourceID is
    larger than any currently locked resourceID. In addition, a list of locked resourceIDs
    must be maintained so that as OrderedResources are released, additional ones can
    be locked appropriately.


    The most common implementation for the ResourceList is as an array of integers
    representing the resourceIDs in the order in which they are locked.


    # 4.9.7 Related Patterns


    This pattern is specifically designed to remove the possibilities of deadlocks.
    The Simultaneous Locking Pattern also does this, although through the different
    mechanism of preventing condition 2 (some resources are locked while others are
    requested). The Critical Region Pattern also removes the possibility of deadlock
    by preventing condition 3 (preemption while resources are locked is allowed).
    The Cyclic Execution Pattern avoids deadlock by preventing condition 1 (mutual
    exclusion locking of resources).


    # 4.9.8 Example


    The example in Figure 4-30 shows an application of the Ordered Locking Pattern.
    In this (simplified) example three sensors hold related, but distinct information;
    AttitudeSensor has information about the attitude (roll, pitch, and yaw) of the
    aircraft, PositionSensor has information about where the aircraft is in the airspace
    (latitude, longitude, and altitude), and the VelocitySensor has information about
    how fast the aircraft is moving in three dimensions.


    The example has two different clients. The KinematicModelClient needs to get time-coherent
    information about the state of the aircraft for the purpose of precise and detailed
    control of actuators and engines. The RoutePlanningClient needs the same information
    to determine updates to the route depending on fuel usage, threat assessments,
    mission criticality, and so on.


    Let’s say, for the purpose of this discussion that for both the clients it is
    crucial to get data in the same interval. A way to do that is to lock all the
    resources, gather and manipulate the data, and then release all the resources.
    If the KinematicModel locks them in the order 1) PositionSensor, 2) VelocitySensor,
    and 3) AttitudeSensor but the RoutePlanningClient (done by a different subcontractor)
    locks them in the reverse order, there is an opportunity for deadlock. Ergo, we’ve
    added the dyadic form of the pattern to specifically prevent'
