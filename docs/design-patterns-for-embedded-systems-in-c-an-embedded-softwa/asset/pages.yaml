    # 6.8 Summary


    This chapter has presented a number of different patterns that can be used to
    improve the safety and reliability of a design executing in its operational context.
    The first few patterns were small in scope (often referred to as “design idioms”
    instead of “design patterns”). The One’s Complement Pattern replicated primitive
    data to identify run-time corruption – a problem common to harsh environments
    including medical operating rooms, industrial factory settings,'
