  md: '# 3.6.1 Abstract


    Push buttons, toggle switches, and electromechanical relays are input devices
    for digital systems that share a common problem – metal connections make contact,
    the metal deforms or "bounces", producing intermittent connections during switch
    open or closure. Since happens very slowly (order of milliseconds) compared to
    the response speed of embedded systems such as button presses, switch movement,
    and activating or deactivating relays. results in multiple electronic signals
    to the control system. This pattern addresses this concern by reducing the multiple
    signals into a single by waiting a period of time after the initial signal and
    then checking the state.


    # 3.6.2 Problem


    Many input devices for embedded systems use metal-on-metal contact to indicate
    events of interest, such as button presses, switch movement, and activating or
    deactivating relays. As the metal moves into contact, physical deformation occurs
    resulting in an intermittent bouncing until the vibrations dampen down. This results
    in an intermediate contact profile such as shown in Figure 3-10.


    # 3.6.3 Pattern Structure


    The basic solution is to accept the initial event, wait for the vibrations to
    dampen out, and then sample the data source for its state. See Figure 3-11 for
    the pattern structure.


    # 3.6.4 Collaboration Roles


    This section describes the roles for this pattern.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_143_0.png)'
