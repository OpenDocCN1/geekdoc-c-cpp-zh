  md: 'Another advantage of this pattern is that with a small change in implementation,
    it is possible to share state objects among multiple instances of the Context
    class – for example, if the system has multiple sensors all typed by the same
    class. This makes it very lightweight in terms of memory usage in those cases.


    # 5.6.6 Implementation Strategies


    This pattern is straightforward in C++ but rather more complex in C because it
    uses inheritance and polymorphism. In the implementation shown here, polymorphism
    is implemented with a combination of two techniques. First, all the state classes
    implement the same event handling interface; as each state elements implement
    an event handler for all events if the event is discarded. The event handlers
    return a 1 if the event was handled and 0 if the event was discarded. This is
    necessary because the Context needs to know if it should execute the entry actions
    of the state.


    The StateActionSet then provided the polymorphic dispatch of the functions by
    providing a set of pointers for the event handlers and exit handlers. Each state
    class implemented the event handlers appropriately and put a pointer in the StateActionSet
    instance. The Context class uses the currentState variable as the index to dereference
    the pointer to the state that is “current,” and further dereferences the StateActionSet
    to invoke the appropriate handler.


    Two implementation variants occur around whether to create all the state objects
    at once and simply switch among them based on the currentState variable of the
    Context, or to dynamically create and destroy the instances of the different state.
    In general, if the system changes state only infrequently, memory can be saved
    by only creating the state as it is needed and destroying it when the Context
    is no longer in that state. If the state changes are frequent, this approach will
    likely impose a significant performance penalty, at the cost of some additional
    memory, it is best to keep all the state instances in memory.


    An interesting property of the pattern is that the state objects have no context
    other than the Context pointer. This means that the state objects can be shared
    by multiple instances of the Context class. This might occur if, for example,
    the system has many sensor instances all typed by the same Context class. In this
    case the State Pattern can implement state objects, resulting in significant memory
    savings. To decontextualize the state classes, remove the class’s Context pointer
    and add a Context pointer (that’s the Context’s me pointer) to each event handler
    list (and also to the entry and exit actions). When this is done, each state class
    is completely independent of its Context.


