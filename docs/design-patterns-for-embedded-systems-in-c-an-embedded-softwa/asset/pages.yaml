    # # 6.1.1 Safety and Reliability Faults


    Accidents can occur either because the system contains errors or because some
    aspect of the system fails. An error is a systematic fault and may be due to incorrect
    requirements, poor design or poor implementation. An error is always present in
    the system even though it may not be visible. When an error is visible, it is
    said to manifest. Failures are different in that they occur at some point in time
    and result in a failed state. That is, the system worked properly before becoming
    changed, such as a metal rod breaking in the drive train of your car (persistent
    failure) or a bit flipped in your car''s engine control computer that is repaired
    (volatile failure). A fault is either an error or a failure.


    I this distinction between the different kinds of faults because the kinds of
    mitigation behavior for the two kinds are different. Specifically, failures can
    be addressed by homogeneous redundancy — multiple replicas of the processing channel
    (case of software elements). If you assume the system is safe if it remains in
    the case of a single point failure, then having an identical backup channel can
    address such a failure. However, if the fault is an error, then all identical
    copies of the channel will exhibit the same fault. In this case, you must have
    heterogeneous redundancy (also known as n-way programming) — multiple channels
    that provide the service using different code and/or designs-in order to continue
    functioning.


    Faults have relations to various elements in your system. Behavior around faults
    may be specified in requirements. An element can be the source of the fault. Another
    element may be the identifier of the fault. Yet another element may mitigate or
    extenu the fault.'
