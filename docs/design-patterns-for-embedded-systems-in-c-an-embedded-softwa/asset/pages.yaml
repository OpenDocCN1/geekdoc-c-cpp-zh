  md: '# Chapter 4


    # 4.9.4 Collaboration Roles


    This describes the roles for this pattern.


    # 4.9.4.1 Mutex


    The Mutex is used by two other pattern elements: OrderedResource and ResourceList.
    Of course, this means each of these elements will use different instances of the
    Mutex class. As with the other patterns in this chapter, the Mutex class provides
    two basic services. The lock() function locks the resource (if currently unlocked)
    or blocks the caller (if already locked). The release() function removes the lock
    and allows all blocked callers to continue.


    # 4.9.4.2 OrderedResource


    OrderedResource is really the heart of the pattern. It has a resourceID attribute.
    This is a unique ID associated with each resource instance and, along with the
    ResourceList, this class enforces the ordered rule lock:


    > A resource may only be locked if its resourceID is greater than the largest
    resourceID of locked resource.


    OrderedResource may have different kinds of functions. The first kind, monadic
    functions, internally lock the mutex, perform their magic, unlock the Mutex, and
    return. The magic inside the function may call functions of other resources, hence
    the need to use the ResourceList to prevent possible deadlocks. Figure 4-27 shows
    the flow of control for such monadicAccessFunction.


    The other kind of access function is dyadic, so because it requires a pair of
    calls to manage the lock on the resource. That is, before a dyadic access function
    is called, the ResourceClient should first lockDyadic() and after the ResourceClient
    is done with the resource, it should call releaseDyadic(). By of the ordered enforcement,
    the ResourceClient can hold any number of resources in the locked state while
    it performs its work without fear of deadlock. However, the Mutex must lock them
    in order of their resourceIDs or errors will be returned and access will be denied.
    Figure 4-28 shows the flowchart for locking the resource and Figure 4-29 shows
    the flowchart for its release.


    An interesting question arises as to how to assign the resourceIDs. In many ways,
    the best approach is to assign them at design time so that the constructor OrderedResource_Init()
    initializes the value. This approach requires design-time analysis to ensure that
    the resourceIDs are unique but also provides an opportunity to use a priori information
    to identify an optimal assignment of resourceIDs depending on the usage patterns
    of the various resources. Design-time analysis may discover resourceID assignments
    that lessen blocking by deadlock prevention mechanisms (that is, if we assign
    the resourceIDs in this order, we minimize the occurrence of resource lock rejection
    due to potential deadlocking).'
