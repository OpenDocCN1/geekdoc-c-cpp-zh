  md: '182 Chapter 4


    # Task Coordination Patterns


    To be honest, when tasks are truly independent, the concurrency design is pretty
    simple. The problem is that independence is not the normal condition for concurrent
    threads. In virtually all embedded systems, tasks are "mostly independent"¹³.
    The four patterns of this section include the Critical Region, Guard Call, Queuing,
    and Rendezvous Patterns. The first three of these are used to serialize access
    to shared resources as well and so could have been reasonably placed in that section
    of this chapter.


    # 4.4 Critical Region Pattern


    The critical region pattern is the simplest pattern for task coordination around.
    It consists of disabling task switching in a region where it is important that
    the current task executes without being preempted. This can be because it is accessing
    a resource that cannot be simultaneously accessed safely, or because it is crucial
    that the task executes for a portion of time without interruption.


    # 4.4.1 Abstract


    In a preemptive multitasking environment (like the Static Priority Pattern, above),
    there may be periods of time during which a task must not be interrupted or preempted.
    The Critical Region Pattern address these intervals by disabling task switching
    or by enabling interrupts (the Interrupt Pattern, above). This provides uninterrupted
    execution by the current task. Once beyond the critical region, the task must
    reenable task switching (or interrupts) or the system will fail.


    # 4.4.2 Problem


    There are two primary circumstances under which a task should not be interrupted
    or preempted. First, it may be accessing a resource may not be safely accessed
    by multiple clients simultaneously. Secondly, the task may be performing actions
    that must be completed within a short period of time or that must be performed
    in a specific order. This pattern allows the active task to execute without any
    potential interference from other tasks.


    # 4.4.3 Pattern Structure


    Figure 4-12 shows how structurally simple this pattern is. In a common variant,
    the protected element is a resource and not a task; this is shown in Figure 4-13.
    In either case,


    > ¹³ In the same sense that Miracle Max reports that Wesley is "mostly dead" (Goldman,
    W., 1973. Princess Bride: S, Morgenstern''s Classic Tale of Love and High Adventure.
    Harcourt).'
