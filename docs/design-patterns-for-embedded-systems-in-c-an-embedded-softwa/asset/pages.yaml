    make different transitions terminate on any given state). The exit actions are
    taken whenever the state is left, regardless of which path is taken. Reactions
    ("internal transitions") are taken when the element is in the specified state
    and the triggering occurs; in this case, the actions are taken but the state is
    not exited. Contrast the PredecessorState response to the event react1 with the
    transition taken with event2. In both cases, the element ends up in the same state
    (PredecessorState), but in the former case, only the actions rAction() and rAction2()
    are executed. In the latter case, the actions (in this case exitAction()) are
    taken, then the transitions occur (in this case tAction2()), and finally the entry
    actions are taken (in this case entry1() and entry2()).


    Transitions are shown as directed arrows. They are normally initiated by the element
    receiving a triggering event. Transitions have syntactic fields with special characters
    delimiting them. The first field is the name of the event type that causes this
    transition to be taken (provided, of course, the element is in the predecessor
    state when event occurs). The second field is the guard. The guard is a Boolean
    condition (without side effects); if the event occurs AND the guard evaluates
    to true, then the transition is taken. If the event occurs and the guard is false,
    then the transition is "quietly discarded" and no actions are taken, including
    the exit actions of the predecessor state. This means that, if present, must be
    evaluated before any actions are executed. The guard, when present, is delimited
    by square brackets. Lastly, there may be a list of actions that are executed when
    the transition is taken. The action list is preceded by a slash.


    There is a special kind of transition, known as the initial transition or "default
    pseudostate" if you want to fancy the starting state and actions when the element
    is created. This transition may not have a triggering event.


    There is a special state, known as the final pseudostate, that indicates the element
    no longer accepts events. Usually, this means that the element is about to be
    deleted. The icon for the final state is a filled circle within an unfilled circle.
    In Figure 5-4, the pseudostate is entered when the element is in the SubsequentState
    and the element receives the done event.


    # 5.2.1 OR-States


    In simple state machines, an element must always be in exactly one of its states,
    no more and no less. For this reason, such states are called OR-states. UML state
    machines extend the notion of OR-states by adding the notion of nesting within
    states. Nested states add a level of abstraction'
