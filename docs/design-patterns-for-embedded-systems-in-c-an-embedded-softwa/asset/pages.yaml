    Figure 5-15: Multiple event receptor state machine context


    # ### 5.4.3 Pattern Structure


    The context for the state machine implementation is shown in Figure 5-15. You
    can see that the TokenizerMultiReceptor has an event receiver for each event passed
    to the state machine plus additional functions representing the entry and exit
    actions of each state. In addition, the figure explicitly shows the enumerated
    types used for the state and substates (as mentioned, it is also common to simply
    use integer values). The event type need not to be explicitly represented because
    the client implicitly indicates it by invoking the appropriate event receptor.


    # ### 5.4.4 Collaboration Roles


    This section describes the roles for this pattern.


    # ### 5.4.4.1 Mutex


    The mutex ensures the deterministic run-to-completion semantics of transitions
    by preventing other clients from interrupting the state machine execution of an
    action sequence. This is'
