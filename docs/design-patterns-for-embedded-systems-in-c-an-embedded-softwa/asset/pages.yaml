    Figure 3-3 Hardware Adapter Pattern


    # 3.3.4.3 Hardware Interface to Client


    This interface represents the set of services and parameter lists that the client
    expects the Hardware Proxy to provide. As an interface, it is a collection of
    service specifications and has no implementation. The implementation in this case
    is provided by the Hardware Adapter Class.


    # 3.3.4.4 Hardware Device


    This element is described in the Hardware Proxy Pattern. See Section 3.2.4.1.


    # 3.3.4.5 Hardware Proxy


    This element is described in the Hardware Proxy Pattern. See Section 3.2.4.2.


    # 3.3.5 Consequences


    The use of this pattern allows various Hardware Proxies and their related hardware
    devices to be used as-is in different applications, while at the same time allowing
    existing applications to use different hardware devices without change. The key
    is that the adapter provides the connective glue to match the Hardware Proxy to
    the application. This means that it will be'
