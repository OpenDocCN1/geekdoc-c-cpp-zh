  md: '# 420 Chapter 6


    # 6.7.7.5 Monitor-Actuator Pattern


    Description

    This pattern uses two extremely heterogeneous channels. The first, just as in
    the Sanity Check Pattern, is the actuator channel. This channel provides the system
    service. The second channel monitors the physical result of the actuation channel
    using one or more independent sensors. The concept of the pattern is that if the
    actuator channel has a fault and performs incorrectly, the monitoring channel
    identifies it and can command the system to a fault-safe state. If the monitoring
    channel has a fault, then the actuation channel is still behaving correctly. This
    pattern assumes there is a fault-safe state and that the sensor(s) used by the
    monitoring channel are not used by the actuation channel.


    The primary differences between the Monitor-Actuator Pattern and the Sanity Check
    Pattern are:


    +   1. The Sanity Check Pattern is a low-fidelity check on the output of the computation
    of the actuation channel; this does not require an independent sensor.

    2. The Monitor-Actuator is a high-fidelity check on the physical result of the
    actuator channel and therefore requires an independent sensor.


    Consequences


    This is a medium-weight pattern. It requires some additional recurring cost because
    of the additional sensor(s) and processing capability for the monitoring channel.
    The extra monitoring channel requires a modest amount of additional design work
    as well. As mentioned, this channel provides single-point fault safety for systems
    in which there is a fault-safe state.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_440_0.png)'
