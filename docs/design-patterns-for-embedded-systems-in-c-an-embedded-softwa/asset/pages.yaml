    \nTasks can communicate in two fundamental ways. Synchronous communications are\
    \ like a phone call – both parties are engaged at the same time and invoke services\
    \ and exchange data immediately. The sender \"sends and waits\" for a response.\
    \ Synchronous communication is usually implemented via function calls. Asynchronous\
    \ communication is like a postcard. The sender of the message \"sends and forgets.\"\
    \ At some later, the receiver gets and processes the message or data. The message\
    \ processing is less timely than the sender need wait until the receiver is ready.\n\
    \nFor tasks to execute concurrently, they must run on different CPUs or within\
    \ a multicore CPU. Within a given CPU core, multiple tasks are running using pseudoconcurrency\
    \ in which only one task executes at any instant, but the processor gives the\
    \ appearance of concurrency by switching among the ready tasks. There are many\
    \ different policies that can be used to select which task to run, some of which\
    \ will be provided as patterns in this chapter.\n\nThe basic structure of tasks\
    \ depends a bit on the scheduling pattern that will invoke them. A task for a\
    \ cyclic execution is simply sequential code that returns when it is done. A task\
    \ that runs in a cooperative multitasking environment runs in a loop but contains\
    \ points at which voluntarily releases control back to the scheduler to allow\
