    \ Listing 5-13:TokenizerMultiReceptor.c\n\n# 5.5 State Table Pattern\n\nThe State\
    \ Table Pattern is a create pattern for large, flat (i.e., without nesting or\
    \ AND-states) state machines. It gives good performance (O(constant)) in use although\
    \ it requires more initialization time before it becomes available. They are relatively\
    \ easy to extend to more states but don't handle nesting very easily.\n\n# 5.5.1\
    \ Abstract\n\nThe State Table Pattern uses a two-dimensional array to hold the\
    \ state transition information. This is usually constructed as a x event table;\
