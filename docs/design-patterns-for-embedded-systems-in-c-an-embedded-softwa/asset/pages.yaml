  md: '# Chapter 4


    # 4.4.4.3 TaskWithSharedResource


    This element stands for the set of all tasks that may want to access the shared
    resource (hence the ''*'' multiplicity on the directed association). These tasks
    have no knowledge about the method for protecting the resource, since it is encapsulated
    within the resource.


    # 4.4.5 Consequences


    This pattern enforces the critical region policies and can be used to turn off
    the scheduled task switches, or more draconically, disable interrupts all together.
    Care must be taken to reenable task switching when the element is out of its critical
    region. Additionally, the use of this pattern can affect the timing of other tasks.
    Critical regions are usually short in duration for this reason. There is no problem
    of unbounded priority inversion because all task switching is disabled during
    the critical region.


    Care must be taken when nesting calls to functions with their own critical regions.
    If such a function is called within the critical region of another, the next function
    will reenable task switching and end the critical region of the caller function.


    # 4.4.6 Implementation Strategies


    This pattern is usually implemented either by using scheduler-provided services
    such as OS_disable_task_switching() and OS_enable_task_switching() (or something
    similar) or by introducing assembly language instructions to disable or enable
    interrupt processing at the hardware level.


    # 4.4.7 Related Patterns


    This pattern is only appropriate when multiple tasks can access the same resource
    or services or when tasks could interrupt time-critical processing of the current
    task. For this reason, it is not appropriate with the Cyclic Executive Pattern,
    but is often used with the Static Priority Pattern.


    # 4.4.8 Example


    The example in Figure 14-14 shows a single CRRobotArmManager with a function moveRobotArm
    that has a critical region during the actual movement of the arm.


    In either case, the critical region is encapsulated entirely with the moveRobotArm()
    and motorZero() services, as can be seen in Code Listing 14-16 and Code Listing
    14-17.'
