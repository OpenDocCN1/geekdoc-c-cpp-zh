    # 3.5.4.5 Datum


    This element is a stand-in-for the data of interest to the clients and subjects.
    It may be a simple

    primitive type such as an int or may be a complex struct.


    # 3.5.4.6 NotificationHandle


    The NotificationHandle is a representation of a means to invoke a client’s accept

    (Datum) function. By far, the most common implementation is a function pointer,
    but other

    implementations can be used as well.


    # 3.5.5 Consequences


    The Observer pattern simplifies the process of distributing data to a set of clients
    who

    may not be known at design-time, and dynamically managing lists of interested
    clients

    ing runtime. This pattern maintains the fundamental client-server relation while

    providing run-time flexibility through its subscription mechanism. Compute efficiency
    is

    maintained because clients are only updated when appropriate; the most common
    policy is

    that the clients are updated when the data change, but any appropriate policy
    can be

    nimplemented.


    # 3.5.6 Implementation Strategies


    The only complex aspects of this pattern are the implementation of the notification
    handle and

    the management of the notification handle list. The notification handle itself
    is almost always a

    function callback, that is a pointer to a function with the right signature. Of
    course, this

    signature varies with the data being returned, but it also depends on the implementation
    of the

    software “classes” as discussed in Chapter 1. Using the struct approach with the
    me pointers,

    this will be the first parameter of the accept function. If you don’t use the
    approach but write a\more traditional C, then the realization of the ConcreteClients
    is manual but you

    won’t have to include the me pointer in the accept function parameter list. In
    the example

    in this section, we shall use the former approach.


    The easiest approach for the notification list is to declare an array big enough
    to hold all

    potential clients. This wastes memory in highly dynamic systems with many potential
    clients.

    an alternative is to construct the system as a linked list; that is, add another
    variable to each

    notification handle which is a pointer to the next one. Obviously, the last element
    in the list has

    a NULL next pointer value.'
