    Figure 6-8: Channel Pattern


    association. Put another way, the AbstractDataTransform has a link to the next
    processing step in the chain or to the output device driver, but not both.


    # 6.5.4.2 ActuatorDeviceDriver


    This class uses the computed output values to drive one or more actuators, such
    as a motor, light, or heating unit.


    # 6.5.4.3 ConcreteDataTransform


    This class performs a mathematical transformation on the incoming data value (from
    either the sensor or a previous ConcreteDataTransform) and produces an output
    (sent to the next ConcreteDataTransform in the sequence or the ActuatorDeviceDriver).
    In simple cases, there may be only a single ConcreteDataTransform class, but in
    more complex situations there may be dozens.


    # 6.5.4.4 SensorDeviceDriver


    This class acquires physical data from one or more sensors to put into the channel
    for processing.


    # 6.5.5 Consequences


    The channel in this simple form provides only a little value. Its true value lies
    in the use of multiple instances of the channel. There are a number of different
    ways to combine the channels, as well as the data transformations, to address
    safety and reliability concerns.


    In general, the benefits are providing a clear means for identifying faults and,
    depending on the pattern, providing redundant channels to continue to provide
    services or to go to a'
