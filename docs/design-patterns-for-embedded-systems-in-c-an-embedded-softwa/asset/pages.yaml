  md: '# Design Patterns for Accessing Hardware


    other processing. The Polling Pattern, discussed elsewhere in this chapter, looks
    for events of interest when it is convenient for the system. While this has the
    advantage that processing can proceed uninterrupted, it has the disadvantage that
    high urgency and high frequency events may not be handled in a timely fashion,
    or may be missed altogether. Interrupt Pattern addresses this problem by immediately
    pausing the current processing, handling the incoming event, and returning to
    the original computation.


    # 3.7.3 Pattern Structure


    Figure 3-13 shows the basic structure of the pattern. Because it is important
    to ensure that the interrupt handlers are parameterless, I’ve used the «File»
    stereotype to indicate that this pattern isn’t using the class-structured approach
    with the me pointer.


    # 3.7.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 3.7.4.1 InterruptHandler


    The InterruptHandler is the only element that has behavior in the pattern. It
    has functions to install or destroy an interrupt vector and the interrupt service
    routines themselves.


    The install() function takes the interrupt number as an incoming parameter. When
    run, it copies the existing vector into the vector table and replaces it with
    the address of the appropriate interrupt service routine. The deinstall() function
    does the reverse, restoring the original vector.


