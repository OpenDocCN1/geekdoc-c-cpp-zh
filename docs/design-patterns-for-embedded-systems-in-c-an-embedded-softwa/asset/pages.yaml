    This can, however, have a negative impact on run-time performance. It may sometimes
    be more time efficient for the clients to know the encoding details and manipulate
    the data in their native format. However, this degrades the maintainability of
    the system because now the clients need to be modified the hardware interface
    or encoding change.


    # 3.2.6 Implementation Strategies


    As discussed in Chapter 1, classes may be implemented in different ways in C ranging
    from simple files to using struct to store class attributes, by using virtual
    functions that support true polymorphism. All of these approaches can be used
    to implement this very simple pattern.


    Usually, a Hardware Proxy supports all features of a specific device and a different
    Proxy is used for each separate device, but this isn''t an absolute rule. Separation
    into different devices means that the devices can follow independent maintenance
    paths and is very flexible for the future.


    In general, it is preferable to have the bit-encoding, encryption, and data compression
    of the actual hardware away from the application software. However, it is possible
    to implement the pattern without the marshal() and unmarshal() functions by making
    the native format visible to the clients.


    # 3.2.7 Related Patterns


    The simple implementation of this pattern doesn''t implement anything for thread
    safety. It can be combined with the Critical Region, Guarded Cell, or Queuing
    patterns to provide thread safety. For deadlock avoidance, it can be combined
    with the Ordered Locking or Simultaneous patterns.


    # 3.2.8 Example


    The example, shown in Figure 3-2, is of a system with a motor with a memory-mapped
    interface. The interface is 16 bits wide and is detailed in the figure comment.
    In addition to the motor proxy, there are two clients in the example. The first
    of these is a motor controller that makes high-level decisions about what to do
    with the motor direction, speed, and how to handle errors. The motor display client
    is concerned with providing user feedback of the speed, direction, and status
    of the motor. Most of the action, of course, is in the Hardware Proxy per se.


    The intention of the motor proxy is to provide the services to access the hardware
    in a hardware interface-independent fashion so that the two clients won''t worry
    about — or even aware of


    > 8 It may not be in high-security applications however. In those cases, it may
    be necessary to always have the data stored in encrypted formats to make it more
    difficult to violate data security protocols.'
