    Figure 4-5: Unbounded blocking


    In this example, only tasks A and Z use the resource. Task Y is the second-lowest
    priority task running every 80 ms for a period of 100 ms, while Task X is the
    third-lowest priority task with a period of 500 ms with an execution time of 80
    ms. What happens to schedulability now?


    The worst case is the following: Task Z runs and locks the resource and then A
    runs, preempts until it needs to access R, and then blocks. At this point Task
    Z runs, but immediately Task Z preempts Y. Since it is a higher priority, it preempts
    Z. As such, task X becomes ready to run and preempts Y. This A is blocked by three
    tasks. The resource will not become available for 190 ms (10+100+80), and Task
    A misses its deadline. This is called *unbounded priority inversion* and is a
    critical problem with many embedded systems design.


    There are many design solutions, such as using critical regions and variants of
    the priority inheritance pattern, that solve this problem. These patterns will
    be discussed later in this chapter.


    # 4.1.1 Identifying Tasks


    The entire previous discussion of what is a task and what task properties are
    the crucial question of how to identify a good set of tasks for your particular
    embedded system. Generally speaking, tasks have independent action sequences that
    interact with others only at specific points of interactions. However, selecting
    a task involves more than this because we create task sets to optimize performance
    and responsiveness. We could, in principle, run every object (or function, if
    you prefer) in a separate task thread or we can run all in a single task thread.
    If maintenance is the primary concern, then independence should be the primary
    task identification strategy. If schedulability is the primary concern, then the
    recurrence properties (e.g., the task period) should guide your choice. Table
    4-1 shows common strategies for task identification⁴.


    In practice, the task you select will use a combination of several of the strategies
    from Table 4-1.


    > ⁴Borrowed (with permission) from the author’s book *Real-Time Agility: The Harmony/ESW
    Method for Real-Time and Embedded Systems Development* (Addison-Wesley, 2009).'
