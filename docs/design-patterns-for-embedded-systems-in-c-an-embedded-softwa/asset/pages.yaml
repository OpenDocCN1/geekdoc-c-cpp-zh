  md: '# 156 Chapter 4


    The different ways to schedule the tasks have both benefits and costs. Cyclic
    executives are very simple; the scheduler consists of an infinite loop that executes
    the tasks one after the other. While simple, it isn''t flexible and can have poor
    response to incoming events since an event processed by a task must wait until
    task is within the cycle. In addition, task executions must be short if other
    tasks are going to run in a timely fashion. A variant known as time-triggered
    cyclic executive starts the cycle at a time boundary; if it completes the cycle
    before the next time, sleeps until the start of the next epoch. A cooperative
    round-robin scheduler is basically a cyclic executive in which the tasks don''t
    run to completion but instead run to specific points at which they release control
    back to the scheduling loop. This approach allows long tasks to run while still
    permitting others to make progress in their processing.


    While simple, there are a number of problems with cyclic executives and round-robin
    schedulers. First, they are not responsive to urgent events; the task that processes
    the event simply runs in its sequence. Secondly, they are not flexible they don''t
    scale to large numbers of tasks. Lastly, a single misbehaving task stops the entire
    system from execution. These kinds of schedulers are well-suited to very simple
    systems or systems that are highly critical (since simple systems are easier to
    prove correct and certify than complex ones).


    The primary kind of scheduling is preemptive scheduling. In preemptive scheduling,
    a scheduler stops the currently executing task when it decides to so and runs
    the next task. The criterion for preempting a task and the selection of the next
    task in sequence depends on the particular scheduling policy.


    At the high level, in a preemptive scheduler have four significant states. A task
    is said to be waiting when the conditions for it to run are not currently in focus.
    When the conditions required for a task are true, then the task is said to be
    ready to run. When the scheduler initiates the task, the task is said to be running.
    A task is ready to run but is being prevented because another task uses a necessary
    resource, the task is said to be blocked.


    A time-slicing scheduler (also known as time-driven multitasking executive or
    TDME) operates on a fairness doctrine; that is, every task gets an equal opportunity
    to execute. The tasks are preempted after they run for a specific period of time.
    TDME schedulers are tuned by adjusting the duration of the time slices; too long
    and the other tasks don''t run often enough to do their jobs, too short and too
    high a percentage of time is spent switching the task context.


    The most common scheduling pattern for larger embedded systems is priority-based
    scheduling. In this approach, each task is assigned a priority, a scalar value
    that will be used to determine which task, from the set of ready to run tasks,
    will be selected for execution.'
