    # 5.5.5 Consequences


    This pattern has excellent execution performance that is independent of the size
    of the state space (i.e., the number of cells in the state table). This is because
    it is directly indexed with a combination of the current stateID and the incoming
    eType. On the other hand, the initialization of the table, while not particularly,
    is involved, since the fields for StateTableEntry must be initialized separately
    in the init() function. This means that the initialization of this pattern is
    much slower than the other patterns, with the only exception of the State Pattern,
    discussed in the next section. Thus, this implementation pattern is a good choice
    for circumstances where the start-up time of the system is relatively unimportant
    but the state space is potentially large.


    The State Table Pattern is also easier to extend than the other patterns since
    extension is mostly a matter of adding new elements to the state table and defining
    the StateTableEntries for the relevant transitions.


    It should be noted that this pattern will waste memory if the state space is sparse,
    that is, when many of the cells are vacant, because the table allocates StateTableEntries
    for all cells. This can be addressed by storing pointers to StateTableEntries
    rather than the elements themselves if memory is tight.


    This pattern, as presented, supports only state machines. However, it can be mixed
    with the elements of the asynchronous version of the State Single Receiver Pattern
    with suitable enhancement of the TokenizerStateTable class with a task processing
    loop to pull events from the queue), and can likewise handle asynchronous events.


    # 5.5.6 Implementation Strategies


    Normally, the table is implemented as a two-dimensional array of StateTableEntries.
    This can waste memory if the table is sparsely populated — memory can be saved
    by implementing the table as a two-dimensional array of pointers to StateTableEntries
    instead (at the cost of an additional pointer dereference during execution).


    # 5.5.7 Related Patterns


    This pattern employs the Mutex of the Guarded Call Pattern (see Chapter 4). It
    can also use a critical region within the eventDispatch() function but would not
    permit higher'
