    RMS makes a number of assumptions about the tasks but is reasonably robust in
    the presence of violations of these assumptions:


    +   * tasks are periodic

    * task deadlines occur at the end of the period

    * tasks are infinitely preemptable


    As to the first assumption, if tasks are not periodic, then they can occur at
    a maximum rate (that is, with a minimum time between task invocations). This value
    can be used instead of the period to determine the priority.


    For the second assumption, it sometimes happens that the deadline is less than
    the period. In this case, simply use the deadline ($D_i$) instead of period ($T_i$)
    to assign the priority.


    The last assumption is that a currently running task can be preempted as soon
    as a higher priority task becomes ready to run. This isn''t true if the currently
    running task is in a critical region (a period of time in which task switching
    is disabled – see the Critical Pattern later in this chapter). However, if the
    critical regions are short, this is usually not a problem. Such situations can
    be analyzed by treating the duration of the longest critical region of all other
    tasks as the worst case blocking time for the task under analysis.


