    When you use semaphores to lock a resource, it can happen that a lower priority
    task locks a resource and is then preempted by a higher priority task that needs
    resource. The high-priority task must block to allow the latter task to run and
    release the resource. This is known as priority inversion because, contrary to
    normal priority scheduling rules, the lower priority task is running even though
    there is a higher priority task to run to.


    Note that priority inversion cannot be avoided in multitasking preemptive schedule
    that includes the use of semaphores to guard resources. That''isnt necessarily
    bad. What is almost bad is unbounded priority inversion. Consider Figure 4-4.
