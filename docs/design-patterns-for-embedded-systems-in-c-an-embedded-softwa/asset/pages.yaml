  md: '# 46 Chapter 2


    The consequences are important because we always make tradeoffs when we select
    one pattern over another. We must understand the pros and cons of the pattern
    to apply it effectively. The pros and cons are usually caught in terms of improvement
    or degradation of some design properties, as well as a possible elaboration of
    problem contexts in which these consequences apply.


    # 2.1.4 How to Read Design Patterns in This Book


    The patterns of this book are organized in the same fashion to improve the usability
    of the patterns. Each pattern is provided in the following format:


    +   - Abstract

    The abstract gives a brief description of the pattern use or justification. This
    means as an overview of the problem, solution, and consequences.

    - Problem

    The problem section gives a statement of the problem context and the qualities
    of service addressed by the pattern.

    - Pattern structure

    This section provides a structural UML diagram of the pattern showing the important
    elements of the pattern. These are the places into which you will substitute your
    specific application elements to instantiate the pattern. Relations among elements
    of the pattern are shown as well.

    - Consequences

    The consequences section describe the tradeoffs made when the pattern is used.

    - Implementation strategies and source code

    This section discusses issues around the implementation of the pattern on different
    computing platforms or in different source level languages.

    - Example

    Each pattern is shown in an example, illustrating how the pattern is applied in
    some particular case. This usually involves the presentation of a UML structural
    diagram showing particular application elements fulfilling the pattern collaboration
    roles and relevant code snippets showing the pattern implementation.


    Each pattern in this book is shown using both generic, standard UML, and C source
    code. The UML graphical notation provides a higher-level overview of the pattern,
    but if you don''t find this helpful, you can skip directly to the source code.
    If you''re interested, Appendix A gives a UML notational summary. For a more detailed
    understanding of the UML itself, see Real-Time UML 3rd Edition''.'
