- img_proc: true
  md: '# 2 Chapter 1


    aircraft, and wide-area networks composed of hundreds of powerful computer systems
    for battlefield management in $C^{4}$ISR (Command, Control, Communications, Computers,
    Intelligence, Surveillance, and Reconnaissance) systems. Many embedded systems
    have disks, human interface, and barely any memory but the scope of the embedded
    systems is broader than simple devices.


    Embedded systems are everywhere:


    +   - In the medical field, embedded systems include implantable devices (e.g.,
    cardiac pacemakers, defibrillators, and insulin pumps), monitoring equipment (e.g.,
    ECG/EKG monitors, blood gas monitors, blood pressure monitors, EMG monitors),
    imaging systems (e.g., CT, SPECT, PET, TEM, and x-ray imagers), and therapy delivery
    devices (e.g., patient ventilator, vaporizers, and infusion pumps).

    - In the telecom market, there are devices ranging from cell phones, switching
    systems, routers, mediums, and satellites.

    - In automotive environments, embedded systems optimize engine combustion, manage
    power delivery in transmissions, monitor sensor data, control anti-lock braking,
    providing security, and offer infotainment such as CD and DVD players, and GPS
    routing in some locations, they can offer radar and laser detection and even active
    radar and laser countermeasures.

    - In the office, embedded systems manage phones, printers, copies, machines, lights,
    digital projectors, security systems, and fire detection and suppression systems.

    - In the home, examples include ovens, televisions, radios, washing machines,
    and even some vacuum cleaners.


    Embedded systems already control, augment, monitor, and manage virtually every
    high-tech device we have from televisions to trains to factory automation, and
    whatever is on the rise.


    An important subset of embedded systems are real-time systems. Many people have
    the mistaken impression that “real time” mean “real fast” but that is not true.
    A real-time system is one in which timeliness constraints must be satisfied for
    system correctness. A common, if simplistic, categorization of real-time systems
    is into two groups. “Hard” real-time systems are one in which timeliness constraints
    are modeled as deadlines. “Soft” real-time systems are those that are not “hard”;
    that is, some other (usually stochastic) measure deadlines to determine timeliness.
    This may include average throughput, average execution time, maximum burst length,
    or some other measure. All systems may be modeled as hard real-time systems, but
    this often results in “over-designing” the system to be faster or have more available
    resources than is necessary, raising the recurring cost (approximately “manufacturing
    cost”) of the system.


    Although, as the saying, “Hard real-time systems are hard. Soft real-time systems
    are harder.”


    > 1 Although, as the saying, “Hard real-time systems are hard. Soft real-time
    systems are harder.”'
