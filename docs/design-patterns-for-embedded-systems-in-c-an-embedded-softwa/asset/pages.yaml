    # ## 5.8.1 Abstract


    The Decomposed AND-State Pattern takes an object that owns a state machine and
    decomposes it into a set of objects that interact. The main object owns the overarching
    state machine and other objects own individual AND-states.


    # ## 5.8.2 Problem


    This pattern addresses the problem of implementing state machines that contain
    orthogonal regions (AND-states) in a way that preserves the AND-state design.


    # ## 5.8.3 Pattern Structure


    Figure 5-23 shows the structure of the pattern. Instead of a singular class that
    implements the state machine, the state problem is decomposed into a collaboration
    of objects that relate to the Context.


    # ## 5.8.4 Collaboration Roles


    This section describes the pattern roles.


    # ### 5.8.4.1 AbstractAndStateClass


    This class is an abstraction of the various concrete AND-state classes. It provides
    an event handler for each event received by the Context and a link back to the
    Context for execution of actions and manipulation of variables within the Context.
    In this implementation, it is a nominal class, not usually represented but it
    shows what is inherited by the subclasses.


    # ### 5.8.4.2 ActionSet


    This class contains a set of pointers, one per event. It is owned by the Abstract-StateClass
    and implemented by the ConcreteAndStateClass. In the initializer of the latter
    class, the function pointers are set to point to the functions that implement
    the actions within that state.


    # ### 5.8.4.3 AndStateList


    This class maintains a list of orthogonal regions (containing all the nested states
    within an AND-state) for a given composite. There is an entry for every state;
    if the list is empty, then that state has no nested AND-states. If it is not empty,
    the list entry contains a list of the orthogonal regions of AND-states; each region
    is represented by a ConcreteAndStateClass and it implements all the nested states
    within that region.


    Consider the example state machine in Figure 5-20. STATE_N in this case is 1.
    The 0-th state is the Off state; this state has no nested AND-states so this list
    entry is empty. The 1st state is the On state; this state has two nested orthogonal
    regions, Color and Rate. Thus the'
