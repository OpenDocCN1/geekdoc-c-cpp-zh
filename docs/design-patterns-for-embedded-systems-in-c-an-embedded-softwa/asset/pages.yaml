    7. Verify design functionality


    The collaboration of software elements worked before applying the design patterns.
    This task ensures that it still does. Because the application of design patterns
    usually requires some (possibly small) amount of refactoring, some unit tests
    may require updates. If the pattern application has broken the functionality,
    the software must be repaired so that it passes its functional unit tests.


    8. Verify design goals are met


    Once the design functionality is verified, we must also ensure that the optimization
    goals of the design decisions result in the right tradeoffs. If we''ve optimized
    the code for memory usage, the usage should be measured as the software runs.
    If we''ve optimized worst-case execution time, then that time should be measured.


    # 2.1.5.2 Pattern Mining – Rolling Your Own Patterns


    Creating your own pattern is useful, especially when you have a depth of experience
    to understand the optimization issues in a particular area, and sufficient breadth
    to understand the general properties of the solutions enough to abstract them
    into a generalized solution. We call this pattern mining (see Figure 2-6). Pattern
    mining isn''t so much a matter of invention as it is


