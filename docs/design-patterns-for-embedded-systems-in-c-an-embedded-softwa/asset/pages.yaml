  md: '# Appendix A


    Environment Lifeline

    This is a special lifeline that stands for “everything else.” It provides a notational
    shorthand for

    elements omitted from the diagram.


    # Message


    A representation of an interaction between two instances. It may be synchronous
    (as in a

    function call) or asynchronous (as in an asynchronous event exchange). A message
    is shown as a

    directed line that may be either horizontal or downwards sloping.


    # Synchronous Message


    A synchronous event (function call) is shown with a solid arrowhead. It is most
    commonly

    draw as a horizontal line.


    # Asynchronous Message


    An asynchronous message (event reception) is shown with an open arrowhead. It
    is commonly

    (but not required) to draw it as a downward sloping line.


    # Condition Mark


    This is a hexagon that contains a textual condition that is true at that point
    in the sequence, such

    as as the value of a variable or the current state in a state machine.


    # Comment


    It may be anchored to one or more elements on the diagram or may be unanchored.


    # 1.3 State Diagram


    A State Diagram is a directed graph consisting of states (rounded rectangles)
    and transitions

    (arrowed lines). It defines the order of action execution for its owner class.


    # 1.3.1 Semantic Elements


    # 1.3.1.1 State


    A state is a condition of an instance of a class. A state may contain entry actions,
    exit actions,

    and internal transitions. It is drawn as a rounded rectangle.


    # 1.3.2 Nested State


    States may contain lower level, nested states. For example, while the DOOR_IS_OPEN
    state

    true, it might be in DOOR_OPENING, DOOR_CLOSING, or DOOR_WAITING_OPEN

    nested state. Nested states are drawn graphically including the nested state inside
    a

    composite state.'
  merge: -1
