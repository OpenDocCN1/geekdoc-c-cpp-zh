  md: '# Design Patterns for Accessing Hardware 125


    debouncing time, the state is different then the event must been real, so it sends
    the appropriate message to the ApplicationClient. The old state of the button
    is stored in its variable oldValue; this variable is updated whenever there is
    a detected change of state of the device.


    # 3.6.4.4 DebouncingTimer


    This timer provides a nonempty wait via its delay() service. This is often done
    with an OS call but might be done with specialty timer hardware as well.


    # 3.6.5 Consequences


    This pattern is not necessary for hardware that debounces before announcing events.
    In my experience, however, it often falls on the software to perform this task.
    This is a simple pattern that performs the debouncing so that the application
    may only concern itself with true events resulting from a change in device state.


    # 3.6.6 Implementation Strategies


    It is common for the device to use an interrupt vector to contact its client.
    Indeed, it is common for BouncingDevice to be entirely implemented in hardware
    so that when the event occurs, a hardware interrupt is created, and the device
    state must be verified by reading a memory location or port address. When the
    event interface is an interrupt, the address of the DeviceClient::receive() operation
    must be installed in the proper location in the interrupt vector table when the
    DeviceClient is initiated, and the address must be removed if the DeviceClient
    is deactivated. Care must be taken to ensure that the eventReceive operation has
    no parameters (not even hidden ones!) so that the Return from Interrupt instruction
    will work properly. If the hidden parameter is used because static operations
    are class-wide and not instance-wide the operation static will ensure there is
    no hidden parameter because instance data and so don''t require a me pointer.


    If the interrupt vector table is not used, this pattern can be mixed with the
    Observer Pattern to distribute the event signal to multiple clients, if desired.


    The DebouncingTimer may use special timer hardware such as a programmable 555
    timer. If the RTOS (Real-Time Operating System) timer is used, care must be taken
    with the time resolution. Windows, for example, has a standard timer resolution
    between 10 and 25 milliseconds. You can only get a delay time as a multiple of
    the basic timer resolution so if you want a 45 ms delay, you will have to use
    the closest timer resolution that is greater or equal to your desired time. For
    debouncing applications, this is usually fine but your needs may vary with your
    specific hardware and application.


    If you don''t mind fully occupying your embedded processor while you for the debounce
    timeout, it is a simple matter, as shown in Code Listing 3-17.'
