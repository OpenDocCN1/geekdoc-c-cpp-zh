    # ## Code Listing 4: Polymorphism the hard day\n\n### 1.2.4 Subclassing\nSubclassing\
    \ (known as generalization in the Unified Modeling Language [UML] or inheritance)\
    \ basic rule is that the specialized class inherits the features of the more general\
    \ class. That is, all features of the more general class (also known as the base\
    \ or parent class) are also features of the specialized class (also known as the\
    \ derived or child class), but the latter is allowed to both specialize and extend\
    \ the general class.\n\nOne of the key advantages of subclassing is the ability\
    \ to reuse design and code. If I design a class for a specific context and want\
    \ to reuse it in a different context, I can just design and code the specifications\
    \ and extensions without touching the base class. Furthermore, in usage, I can\
    \ write algorithms that manipulate an instance of a type, without regard to which\
    \ subclass it might be, when that is appropriate and modify the behavior to be\
    \ semantically correct with subclass that is necessary.\n\nBy “specialize,” I\
    \ mean that the specialized class can redefine operations provided by the base\
    \ class. Because a subclass is a specialized form of a base class, any operations\
    \ that make sense for an instance of the base class should also make sense with\
    \ an instance of the derived class. However, it often happens that the implementation\
    \ of that operation must be slightly different. For example, if I write the code\
    \ for queueing data from a sensor, it is to have operations as insert(int value),\
    \ remove(), getSize(), and so on. If I create a kind of queue that can store large\
    \ amounts of data out to a storage device such as a flash drive, those operations\
    \ still make sense but their implementation will be different. Note that specialization\
    \ refers exclusively to changing the implementation of operations and not at all\
    \ to the redefinition of data."
