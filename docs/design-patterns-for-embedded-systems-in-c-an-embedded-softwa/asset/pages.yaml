    # 1.3 What Did We Learn?


    This chapter discussed the special characteristics of embedded systems – working
    within tight design constraints while meeting functional and quality-of-service
    constraints. To do this, embedded developers use tools from the embedded tool
    chain to develop on a more powerful host computer while targeting an often smaller
    and less capable target environment. Target environments run the gamut from small-bit
    processors with a few kilobytes of memory to networked collections of 64-bit systems.
    At the small scale, many systems are too tightly constrained in memory, performance,
    or cost to permit the use of a commercial RTOS, while at the large scale, the
    systems may include a heterogeneous set of operating systems, middleware, and
    databases. Often, embedded software must be developed simultaneously with the
    hardware, making it difficult to test and debug since the target environments
    may not exist when the software is being developed.


    By far, the most common language for developing embedded systems is C. C has the
    advantages of high availability of compilers for a wide range of target processors
    and a well-deserved reputation for run-time efficiency. Nevertheless, the pressures
    to add capabilities while reducing costs mean that embedded developers must be
    continually looking for ways to improve their designs, and their ability to design
    efficiently. Structured methods organize the software into parallel taxonomies,
    one for data and the other for behavior. Object-oriented methods combine the two
    to improve cohesion for inherently tightly-coupled elements and encapsulation
    of content when loose coupling is appropriate. While C is not an object-oriented
    language, it can be (and has used) to develop object-based and object-oriented
    embedded systems.


    The next chapter will discuss the role of process and developer workflows in development.
    These workflows will determine when and where developers employ design and design
    patterns in the course of creation of embedded software. It will go on to define
    what design patterns are, how they will be discussed and organized within this
    book, and how they can be applied into your designs.


    13 Douglass, B.P., 2004. Real-Time UML: Advances in the UML for Real-Time Systems,
    thrd ed. Addison-Wesley.


    14 Douglass, B.P., 1999. Doing Hard Time: Developing Real-Time Systems with UML,
    Objects, Frameworks, and Patterns. Addison-Wesley.'
