    # 6.6 Protected Single Channel Pattern


    The Protected Single Channel Pattern is a simple elaboration of the Channel pattern
    in which data checks are added at one or more `ConcreteDataTransformations`. It
    provides light-weight redundancy but typically cannot continue to provide service
    if a fault is discovered.


    # 6.6.1 Abstract


    The Protected Single Channel Pattern uses a single channel to handle the processing
    of sensory data up to including actuation based on that data. Safety and reliability
    are enhanced through the addition of checks at key points in the channel, which
    may require some additional hardware. Because there is only a single channel,
    this pattern will not be able to continue to function in the presence of persistent
    faults, but it may be able to handle transient faults.


    # 6.6.2 Problem


    Redundancy is expensive, not only in terms of development effort but also in terms
    of replicated hardware. In some cases, fully redundant channels may not be necessary.
    For example, if there is a fault-safe state (a state known to always be safe),
    the system must only be able to detect a fault and enter that state. This lowers
    the reliability of the system, but it may still meet the user needs.'
