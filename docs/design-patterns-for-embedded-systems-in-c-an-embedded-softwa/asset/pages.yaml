    # 6.4.6 Implementation Strategies


    The key implementation strategy is to create a struct with a set of defined operations,
    and then only use those operations to access the values. The pattern can be extended
    to include an enumerated type of the units with numbers with units, such as currency
    (e.g., euro and dollar), mass (as pounds, kilograms), and distance (such as inches,
    feet, yards, fathoms, miles, and even meters). This is a useful extension when
    dealing with data from different clients that may require conversion. The conversion
    functions can be built into the class so you both set and get the values in a
    specified unit.


    # 6.4.7 Related Patterns


    The idea of building smart types is extended pointers to the Smart Pointer Pattern.


    # 6.4.8 Example


    Figure 6-7 shows a simple medical example of using smart data types. The ServerClass
    role from the pattern is fulfilled by the PatientDataClass in the figure. It has
    three SmartInt variables (weight, age, and heart rate) and two SmartColor variables
    (foreground color and background color). The use of an enumerated type ColorType
    to show how the pattern can be used for types other than built-in types.


    Code Listing 6-7 gives the basic types for use example:


    ```

    #ifndef SmartDataExample_H

    #define SmartDataExample_H


    struct AlarmManager;

    struct PatientDataClass;

    struct SmartColor;

    struct SmartDataClient;

    struct SmartInt;


    typedef enum ErrorCode {

    NO_ERRORS,

    BELOW_RANGE,

    ABOVE_RANGE,

    INCONSISTENT_VALUE,

    ILLEGAL_USE_OF_NULL_PTR,

    INDEX_OUT_OF_RANGE

    } ErrorCodeType;

    ```'
