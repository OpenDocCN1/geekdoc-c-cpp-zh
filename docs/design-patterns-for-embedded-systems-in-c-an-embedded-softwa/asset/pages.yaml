  md: '# 98 Chapter 3


    easier, less error-prone, and faster to change hardware devices for an application
    or to reuse an existing hardware device in a new application.


    The cost of using the pattern is that it adds a level of indirection and therefore
    decreases runtime performance slightly.


    # 3.3.6 Implementation Strategies


    The classic *Design Patterns* book by Gamma, et. al., identifies two forms for
    the pattern. The object adapter form is as shown in Figure 3-3. In this form,
    the adapter subclasses along one interface and delegates to the other element
    (although we realization in this case rather than inheritance). In the *class*
    adapter form, the Hardware Adapter subclasses from both interfaces and reimplements
    the client services in terms of the proxy that it inherits. This requires a more
    elaborate implementation of classes than we have been using so far in this book
    it requires the creation of a virtual function table to implement true polymorphism
    (see Section 1.2.3). The tradeoffs for the two implementations are subtle different.
    The class adapter form is a bit more readable but requires a more complex implementation
    in C.


    # 3.3.7 Related Patterns


    The Hardware Adapter extends the Hardware Proxy Pattern. The latter pattern encapsulates
    hardware interface detail but does not translate requests into radically ones.
    The Hardware Adapter Pattern adds a level of indirection between the client and
    the Hardware Proxy. This allows the clients to be unchanged in the application
    while at the same permitting reuse of existing Hardware Proxies that may also
    have been created for other systems. The implementation of the Hardware Proxy
    and the Hardware Adapter can be merged, but that undermines the reusability of
    the Hardware Proxy.


    # 3.3.8 Example


    The example is shown graphically in Figure 3-4. This example shows a system that
    tracks oxygen concentration and oxygen flow rates, as might be found in a medical
    ventilator. Two clients are shown. The *Gas Mixer* client uses these data for
    the closed loop control of gas delivery. Both are implemented to use the interface
    as shown in the `i02Sensor` The two services the clients expect to see are `gimme02Conc()`,
    which returns an integer in the range of 0–100, and `gimme02Flow()`, which returns
    an integer type with units of c/min.


    > ⁹ Gamma, E., Helm, R., Johnson, R., Vlissides, J., 1995. Design Patterns: Elements
    of Reusable Object-Oriented Software. Addison-Wesley.'
