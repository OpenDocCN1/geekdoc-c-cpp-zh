    So which AND-state processes the event first? The upper one? The one you drew
    first? The one that appears in the code? *It doesn''t matter.* That''s the point.


    Note that this raises the spectre of race conditions, as discussed in Chapter
    4. For example, consider the state machine in Figure 5-21. It contains a race
    condition. The *e1* event is handled in two AND-states; each of which has an action
    manipulating the variable *x*. If the upper ANDstate processes its event first⁶,
    the resulting value of *x* is 33. If the lower processes first, the answer is
    40.


    Don''t do that!⁷


    If you need to force a specific order of event execution, you can use a simple
    pattern called event propagation. If you want to force the upper AND-state to
    execute first, create a different event for the second transition and generate
    that event in an action of the first transition. This pattern, applied to the
    previous figure, is shown in Figure 5-22, where the GEN


