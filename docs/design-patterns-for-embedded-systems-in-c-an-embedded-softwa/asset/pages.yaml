    # 3.1 Basic Hardware Access Concepts


    Probably the most distinguishing property of embedded systems is that they must
    access hardware directly. The whole point of an embedded system is that the software
    is embedded in a “smart device” that provides some specific kind of service, and
    that requires accessing. Broadly, software-accessible hardware can be categorized
    into four kinds – infrastructure, communications, sensors, and actuators.


    Infrastructure hardware refers to the computing infrastructure and devices on
    which the software is executing. This includes not only the CPU and memory, but
    also storage devices, timers, input devices (such as keyboards, knobs, and buttons),
    output devices (printers, displays, and lights), ports, and interrupts. Most of
    this hardware is not particularly specific and may be located on the motherboard,
    on daughterboards with high-speed access connections, or as other boards sharing
    a common backplane.


    Communications hardware refers to hardware used to facilitate communication between
    computing devices, such as standard (nonembedded) computers, other embedded systems,'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# 82 Chapter 3


    sensors, and actuators. Usually this means wired or wireless communications subsystems
    such as RS-232, RS-485, Ethernet, USB, 802.11x, or some other facility. In embedded
    systems, DMA (Direct Memory Access) and multiprocessed memory is sometimes used
    as well for purpose, somewhat blurring the distinction between infrastructure
    and communications hardware.


    Lastly, we have devices that monitor or manipulate the physical universe – these
    are the sensors and actuators. We use electronic, mechanical, or chemical means
    for monitoring the status of physical phenomena, such as the rate of a heart beat,
    position of an aircraft, the mass of an object, or the concentration of a chemical.
    Actuators, on the other hand, change the physical state of some real-world event.
    Typical actuators are motors, heaters, generators, pumps, and switches.


    All of these kinds of hardware are usually initialized, tested or configured –
    tasks normally performed by the embedded software either on start-up or during
    execution, or. All of these hardware elements are managed by the embedded software,
    provide commands or data to the software, or receive commands or data from the
    software.


    This chapter will assume that you have enough hardware background to understand
    the hardware terms used in this book as bus, CPU, RAM, EPROM, EEPROM, and Flash.
    If you want to know more, there are many excellent books on the topic, including
    books by Simon¹, Michael Barr and Anthony Massa², Michael Pont³, and Jack Gansle⁴.
    Instead, we will focus on common ways to develop embedded C applications to solve
    problems that commonly arise with the management and manipulation of such hardware
    elements. Hardware-related concepts that we will talk briefly are bit fields,
    ports, and interrupts.


    It is exceedingly common to have hardware that uses bits to specify commands to
    the hardware or to return data. A bit field is a continuous block of bits (one
    or more) within an addressable memory element (e.g., a byte or word) that together
    has some semantic meaning to the hardware device. For example, an 8-bit byte might
    be mapped to a hardware device into four different fields:


    ```

    0 0 0000 00

    ```


    The bits represent the following information to or from the memory-mapped hardware
    device:


    | Bit Range | Access | Name | Description |

    |---|---|---|---||

    | 0 | Write only | Enable bit | 0 = disable device, 1 = enable device |

    | 1 | Read only | Error status | 0 = no error, 1 = error present |

    | 2–5 | Write only | Motor speed | Range 0000 = no speed to 1111 (16d) top speed
    |

    | 6–7 | Write only | LED color | 00 (0d) = OFF 01 (1d) = GREEN 10 (2d) = YELLOW
    11 (3d) = RED |


    > ¹ Simon, D., 1999. An Embedded Software Primer. Addison-Wesley.

    ² Barr, M, A., 2007. Programming Embedded Systems with C and GNU Development Tools.
    O’Reilly.

    ³ Pont, M., 2002. Embedded C. Addison-Wesley.

    ⁴ Ganssle, J., 2007. Embedded Systems: World Class Designs. Newnes.'
