    LDRATM™, or VectorCAST™

    - Commercial hardware integrated tools – this includes tools as logic analyzers,
    in-circuit emulators, JTAG-compliant tools, and ROM emulators


    Of the various kinds of tests, performance tests are usually the most difficult
    to adequately perform. This is because of the common methods for executing test
