    # 5.3 Single Event Receptor Pattern


    Single event receptor state machines (henceforth known as SERMs) can be used for
    both synchronous and asynchronous events.


    # 5.3.1 Abstract


    The Single Event Receptor Pattern relies on a single event receptor to provide
    the interface between the clients and the state machine. Internally, this single
    event receptor must accept an event data type that not only identifies event has
    occurred but also any data that accompanies the event. This pattern may be used
    in synchronous state machines – receiving events directly from the clients – or
    asynchronous, via an intermediate event queue.


    # 5.3.2 Problem


    This pattern addresses the problem of providing simple implementation of a state
    machine that applies to both synchronous and asynchronous event delivery.


    # 5.3.3 Pattern Structure


    This pattern can be used in two ways – for either asynchronous or synchronous
    state machines. The asynchronous version content for this pattern is shown in
    Figure 5-13. In this case, it should be noted that at the end of the TSREventqueue_post()
    function, the OS function postSignal() is called. The code for the post() function
    is given in Code Listing 5-4. On the machine side, the asynchronous version of
    the state machine class has a task loop that waits for the signal, indicating
    that an event has been queued, and then iterates over all queued events. That
    code is shown in Code Listing 5-5.


    The synchronous version of the pattern is shown in Figure 5-14. The most notable
    differences between the two is the absence of the event queue and the class that
    owns the state machine TokenizeSyncSingleReceptor has an association to a mutex
    to ensure run-to-completion semantics for the state actions. Note that the state
    machine has many operations but the only one called by the client is TokenizerSyncSingleReceptor_eventDispatch().
    Internally, this function will determine which event is being passed and process
    the incoming event.'
