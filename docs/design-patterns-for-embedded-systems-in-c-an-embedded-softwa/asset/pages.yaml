    # 4.5.7 Related Patterns


    The Guarded Call Pattern is used with Static Priority or other preemptive multitasking
    environments. It is less draconian policy that is enforced by the Critical Region
    Pattern (above) because it does not interfere with the execution of higher priority
    tasks that don''t need access to the resource. It is more responsive than the
    Queuing Pattern (below) because it doesn''t need to wait for the resource’s thread
    to become active to check for the request.


    There is one very important class of variants of this pattern that solves the
    problem of unbounded priority inversion that uses a concept of priority inheritance.
    The basic idea is that each resource has an addition attribute (variable) known
    as its priority ceiling, which is equal to the priority of the highest-priority
    task that can access the resource. The underlying problem with naive implementation
    of the Guarded Call Pattern is that intermediate priority tasks that don''t need
    the resource can preempt the low-priority task that currently owns the resource
    needed by the blocked high-priority task. There can be any number of such intermediate-priority
    tasks, leading to chained blocking of the high priority task. The priority inheritance
    solution is to elevate the priority of the low-priority task as soon as the high-priority
    task attempts to lock the resource owned by the low-priority task. This can be
    done by creating a semaphore that implements the priority inversion. This is the
    approach taken, for example, by VxWorks™ from Wind River, which implements a set
    of mutex semaphore functions as:


    ```

    SEM_ID semM;

    mM = semCreate(...);

    semTake(semM, FLAG);

    semGive(semM);

    ```


    Values for FLAG include WAIT_FOREVER, and important to this discussion – SEM_INVERSION_SAFE.
    When the latter flag value is used, VxWorks’ mutex semaphores implement priority
    inheritance.


    In Figure 4-5, if the locking mutex is implemented in this way, the following
    sequence of events holds:


    +   1. Task Z runs and locks Resource R at its nominal priority of 100.

    2. Task A runs at priority 1, and attempts to lock the mutex guarding R and blocks.
    At this point, the priority of Task Z is elevated to that of Task A (i.e., priority
    1).'
