    # 6.7.7.4 Sanity-Check Pattern


    Description


    This pattern variant uses two heterogeneous channels; one is the primary actuation
    channel and the second is a lightweight channel that checks on the output using
    lower fidelity computations and hardware. If the primary channel has a fault that
    can be detected by the lower fidelity checking channel, then the system enters
    its fault-safe state.


    Consequences


    This pattern has a low recurring cost and a medium design cost since it requires
    additional design work but lower fidelity redundancy. It cannot continue in the
    presence of a single fault.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_439_1.png)'
