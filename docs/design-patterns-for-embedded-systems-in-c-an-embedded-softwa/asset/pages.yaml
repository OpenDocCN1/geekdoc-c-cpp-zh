    However, this pattern has an advantage over the Critical Region Pattern by allowing
    higher priority tasks to run if they don''t need any of the locked resources.


    # 4.8.2 Problem


    The problem of deadlock is a serious enough one in highly reliable computing that
    many systems design in specific mechanisms to detect it or avoid it. As previously
    discussed, deadlock occurs when a task is waiting on a condition that can, in
    principle, be satisfied. There are four conditions that must be true for deadlock
    to occur, and it is sufficient to deny the existence of any one of these. The
    Simultaneous Locking Pattern breaks condition #2, not allowing any task to lock
    resources while waiting for other resources.


