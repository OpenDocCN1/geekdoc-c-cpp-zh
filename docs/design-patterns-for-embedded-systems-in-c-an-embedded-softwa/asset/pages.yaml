    # 4.3.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 4.3.4.1 AbstractStaticThread


    The AbstractStaticThread class is an abstract (i.e., noninstantiable) super class
    for Concrete Thread. Abstract Thread associates with the Scheduler; executes the
    run() function of the thread to the thread. The AbstractStaticThread specifies
    the interface to be realized by the ConcreteThread.


    # 4.3.4.2 ConcreteThread


    The ConcreteThread is an “active” class that serves as a container and thread
    context for a set of “semantic” objects that do the real work of the system. ConcreteThread
    provides a straightforward means of attaching these semantic objects into the
    concurrency architecture. ConcreteThread represents the threads in the application
    software.


    # 4.3.4.3 Mutex


    The Mutex is a mutual exclusion class that serializes access to a SharedResource.
    The guarded functions of the SharedResource invoke the lock() function of the
    Mutex whenever they are called and release() once the service is complete. Other
    clients that attempt to invoke a service when their associated Mutex is locked
    become blocked until the Mutex is unlocked. The blocking is performed when the
    Mutex semaphoreap signals the StaticPriorityScheduler that a call was made by
    the currently active thread. The mutexID identifies which Mutex is blocking the
    task. This element is usually provided by the RTOS.


    # 4.3.4.4 PriorityQueue


    The PriorityQueue is a queue of StaticTaskControlBlock pointers organized by the
    pattern. The priority uses two instances of PriorityQueue. The first is the ready
    queue. When a task becomes ready, a pointer to its StaticTaskControlBlock is inserted
    into the queue in order of its priority. If the priority of the task is higher
    than the currently running task (or so when the current task terminates), then
    the task is removed from the ready queue and run. The other PriorityQueue is the
    blocked queue; this queue holds the set of tasks currently blocked because they
    tried to access SharedResources protected by a Mutex. This element is usually
    provided by the RTOS.


    # 4.3.4.5 SharedResource


    A SharedResource is a class whose instances are shared by one or more ConcreteThreads.
    For the system to operate properly in all cases, all shared resources must either
    be reentrant (meaning corruption from simultaneous access cannot occur) or they
    must be protected via access serialization. Protection via mutual exclusion semaphores
    is discussed in the Guarded Call Pattern later in this chapter.'
