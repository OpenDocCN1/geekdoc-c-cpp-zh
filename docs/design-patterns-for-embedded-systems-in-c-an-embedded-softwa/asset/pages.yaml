  md: '# 86 Chapter 3


    mapped, or may be mapped via a serial connection, bus, network, or wireless link.
    The proxy publishes services that allow values to be read from and written to
    the device, as well as initialize, configure, and shut down the device as appropriate.
    The proxy provides an encoding and connection-independent interface for clients
    and promotes easy modification should the nature of the device interface or connection
    change.


    # 3.2.2 Problem


    Every client accesses a hardware device directly, problems due hardware changes
    are exacerbated. If the bit encoding, memory address, or connection technologies
    change, then every client must be tracked down and modified. By providing a proxy
    to sit between the clients and the actual hardware, the impact of hardware changes
    is greatly limited, easing such modifications. For easiest maintenance, the clients
    should be unaware of bit encoding, encryption, and compression used by the device;
    these details should be managed by the Hardware Proxy with internal private functions.


    # 3.2.3 Pattern Structure


    The pattern structure is quite simple as can be seen in Figure 3-1. There may
    be many clients but a single Hardware Proxy per device being controlled. The proxy
    contains public functions and private, encapsulated functions and data. The device
    is represented as a void* in the figure, but it should be appropriately typed
    for the device.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_106_0.png)


