  md: '# 406 Chapter 6


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_426_0.png)


    Figure-12: Single Channel example


    I further modified the pattern by making the first ConcreteDataTransform pull
    the data from its SensorDeviceDrivers (the thermometer and heat fan) associated
    with each room. The next transform, ComputeRequiredHeatFlow, not only gets the
    actual heat flow from the previous transform but reads each room''s thermostat
    to get the desired temperature and computes the desired output heat flow from
    the furnace. The difference between actual and desired temperatures results in
    a desired heat flow. This is passed on to CalculateFurnaceParams, which computes
    the necessary gas flow, furnace blower speed, and commands the FurnaceController.


    In safety, there are several checks in this single channel. The thermometers are
    checked for actual temperature, and if the temperature is out of bounds, this
    leads to emergency restart of the furnace (if below 0° F) or shutting down the
    furnace (if over 130° F)¹¹. The actual heat flow and (computed) desired heat flow
    are checked to ensure that they don''t exceed 14,000 BTUs. If this limit is exceeded,
    the furnace is shut down.


    ¹¹ That''s -18° C and 54° C for metric-speaking types.'
