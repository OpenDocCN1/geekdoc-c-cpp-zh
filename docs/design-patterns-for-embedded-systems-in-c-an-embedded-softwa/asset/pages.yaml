    # 1.1.1.2.8 Type


    A type is just – a data type without the richness of a class to add behavior.
    It can be an enumerated type (enum), structured type (struct), array, typedef,
    or even a #define.


    # 1.2 Sequence Diagram


    A Sequence Diagram shows a particular sequence of messages exchanged between a
    set of instances. The instances are shown as vertical lines known as lifelines.
    Messages are shown as horizontal or downward slanted lines. Time flows (more or
    less) down the page. In addition, condition marks can be used to show state or
    the current value of attributes during the sequence.


    # 1.2.1 Semantic Elements


    Lifeline


    A lifeline represents the usage of an instance. At the top of the lifeline, it
    is common to both name the instance and identify the type of class of the instance.'
