- img_proc: true
  md: 'Inheritance Pattern, to limit priority inversion to a single level. The last
    pattern in this group, the Queuing Pattern, serializes access to a resource by
    putting the requests in a queue and the resource removes them from the queue in
    a first-in-first-out (FIFO) order. The Queuing is conceptually very simple but
    can lead to delays in response to a request made of the resource.


    The last two patterns – the Simultaneous Locking and the Ordered Locking Patterns
    – concerned themselves with deadlock prevention. Deadlock is a very real problem
    that occurs when there are conditions waited for that can never actually occur,
    and this happens far more often than most people would suspect. Four conditions
    are required for deadlock to occur and deadlock can be eliminated by violating
    any of these four conditions. The Simultaneous Locking Pattern violates the requirement
    of holding one resource while requesting others through the simple expedient of
    locking all resource it needs at once. The Ordered Locking Pattern breaks another
    requirement of deadlocks, that a circular waiting condition occurs; by ensuring
    that all clients locking the resource in the same order, circular waiting (and
    deadlock) can be eliminated.'
