  md: '# 10 Chapter 1


    An object is an instance of a class. This makes an object equivalent to, but more
    powerful than, a variable in a structured language because the object provides
    both the values held in its attributes and the operations that manipulate them.


    A structured language is a language that directly supports structured programming.
    In the context of this book, C is clearly a structured language. C is by far the
    prevalent language for creating embedded systems and C is an inherently "structured"
    language. It has all the earmarks – functions, variables, and so forth. However,
    an interesting question arises: can object-oriented programming be done in a structured
    language, such as C? And even if it can be done?


    I am reminded of a similar discussion back when the most programming languages
    were assembly languages. Was it possible to write structured programs in assembly
    code? After all, assembly languages do not provide language features intrinsically.
    As it happens, the answer is "Yes!" It is not only profitable to write structured
    assembly language programs. It requires some discipline on the part of the programmer
    and decisions about the mapping of assembly language instructions to structured
    concepts (such as passing parameters on the stack), but it is easy enough to do.


    The is true of object-oriented programming in structured languages such as C.
    In this book, we take a primary object-based perspective in the programming (object-oriented
    without subclassing) I believe there are benefits to doing so. However, the creation
    of object-based or object-oriented programs in C is pretty straightforward. Let''s
    discuss the important aspects of object-oriented programming and how to implement
    those concepts in C.


    # 1.2.1 Classes


    A class is really nothing more than a C struct, but what is special about it that
    it contains two kinds of features: data (attributes) and behavioral (operations).


    The simplest way to implement classes is to use the file as the encapsulating
    boundary; public variables and functions can be made visible in the header file,
    while the implementation file holds the function bodies and private variables
    and functions. Multiple files can be linked with <Usage> dependencies to support
    the call tree, as in Figure 1-1. In this case, a "class" is represented as a pair
    of files and its implementation uses some features (variables or functions) of
    the Display class (file), in this case, the displayMsg() function.


    A somewhat more flexible approach uses structs within the file to represent the
    classes. The operations of class are defined as functions located within the same
    file as the struct. To make sure that the function has access to the correct object
    data, we need to pass in a me pointer.'
