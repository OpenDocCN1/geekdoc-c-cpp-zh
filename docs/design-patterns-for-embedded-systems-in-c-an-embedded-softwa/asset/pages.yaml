    # 4.2.1 Abstract


    The Cyclic Executive Pattern is used primarily in two situations. For, very small
    embedded applications, it allows multiple tasks to run pseudoconcurrently without
    the overhead of a complex scheduler or RTOS. Secondly, in high-safety relevant
    systems, the Cyclic Executive is easy to certify, hence its prevalence in avionics
    and flight management systems. The scheduler is a simple loop that calls all of
    the tasks in sequence. Each task is a simple function invoked by the scheduler
    that runs to completion and then returns.


    # 4.2.2 Problem


    Many embedded systems are tiny applications that have extremely tight memory and
    time constraints and cannot possibly host even scaled-down microkernel RTOS. The
    Cyclic Executive Pattern provides a low-resource means to accomplish this goal.


