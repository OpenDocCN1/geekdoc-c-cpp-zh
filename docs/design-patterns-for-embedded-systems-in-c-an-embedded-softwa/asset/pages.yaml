    # 5.6 State Pattern


    This, perhaps poorly named, pattern comes from Design Patterns: Elements of Reusable
    Oriented Software by Gamma, et. al.. It provides an implementation strategy that
    can be optimized either for data memory at the expense of run-time performance
    or vice versa. It is applicable for sparse and dense state alike and has relatively
    low initial set-up costs. However, it makes heavy use of dynamic memory. It is
    simple to implement in C++ because of its use of polymorphism and therefore somewhat
    complex in C.


    # 5.6.1 Abstract


    The State Pattern implements a state machine through the creation of state objects,
    one per state. The class owning the state machine, known as the Context, maintains
    a list of objects with an internal variable that identifies which of these is
    the current state. All event receptors are paired to the currently active state
    object.


    # 5.6.2 Problem


    This pattern provides a means for implementing state machines that simplifies
    the masterful class by creating a set of objects, each of which implements the
    behavior of a single state. It makes the states explicit, rather easy to modify,
    and enables the extension of the state space by adding new states as needed.


    # 5.6.3 Pattern Structure


    Figure 5-18 shows the structure for the pattern for the parsing example. Note
    that the states are all implemented as different classes, and each of these classes
    provides a function for the events (even if the implementation is empty). The
    Context passes the control off to the current state (implemented as the currentState
    index into the stateList array). Because the actions are almost always implemented
    in terms of manipulating variables and invoking functions of the Context, each
    state class requires a pointer back to the Context. In a fashion similar to the
    State Table Pattern, the pattern is made much easier if you flatten the state
    machine (i.e., eliminate nesting).'
