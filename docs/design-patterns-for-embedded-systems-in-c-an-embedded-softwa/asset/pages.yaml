  md: '# Design Patterns for Embedding Concurrency and Resource Management 191


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_211_0.png)


    functions, calls are made to lock and release the resource. The scheduler supports
    blocking by placing a task on the blocked queue when it invokes a locked semaphore
    and unblocks when that semaphore is released. The scheduler must implement the
    semaphore `lock()` function as a critical region to eliminate the possibility
    of race conditions.


    Figure 4-15: Guarded Call Pattern


    # 4.5.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 4.5.4.1 GuardedResource


    The `GuardedResource` is a shared resource that employs mutex functions to enforce
    mutual exclusion of access to its methods. Inside the relevant state, prior to
    the access of the resource per xe, a call is made to the `lock()` function of
    the associated `Semaphore` instance. if the Semaphore is in the unlocked state,
    then it becomes locked; if it is in the locked state, the Semaphore signals the
    `StaticPriorityScheduler` to block the currently running task. It is important
    that the relevant functions of a specific resource instance must share the same
    instance of the `Semaphore` class. This ensures that they are protected together
    as a unit from simultaneous access by multiple `PreemptiveTasks`.


    # 4.5.4.2 PreemptiveTask


    The `PreemptiveTask` represents an «active» class that is run via a preemptive
    multitasking scheduler. It accesses the `GuardedResource` by invoking the latter’s
    functions, which in turn are protected by the `Semaphore`.


