    # 4.1.3 Real-Time Operating Systems


    In many embedded systems, a real-time operating system (RTOS⁸) provides a set
    of services to the application system including:


    +   * task services as the creation, scheduling, and destruction of tasks

    * event services such as pending on an event, posting, and event and management
    of event queues

    * creation, destruction, and usage of mutexes services

    * time services, such as delay for a specified period of time, and the creation
    and destruction of timer services

    * file system services

    * network input/output services


    This is no surprise — these services are offered by most desktop operating systems
    as well. RTOSs are in a different number of ways. First and foremost, they are
    embeddable; they are designed to be built into ROM, Flash, or some nonvolatile
    memory. They may execute from memory or copy themselves into volatile memory via
    a boot loader. Secondly, they are tuned to be both fast and predictable⁹. Thirdly,
    they are usually designed to be scalable; they are often designed using the Microkernel
    Architecture Pattern¹⁰ and that enables the memory image of the RTOS to include
    only those services that the system need and for which it is willing to allocate
    space.


    4-7 shows a typical structure for an RTOS. An RTOS must be specialized for the
    target hardware. This is done via a hardware abstraction layer that RTOS vendors
    refer to the Board Support Package (BSP). Above this are kernel services such
    as memory, task, and timer services. Optionally, file services and network services
    may be added or removed as needed by the application. The various applications
    and their tasks run atop the RTOS, invoking the RTOS services via an application
    programming interface (API) as necessary.


    It is now fairly common to embed such RTOS, but it wasn’t so long ago that the
    application software had to provide these services. Indeed, many embedded systems
    running in


