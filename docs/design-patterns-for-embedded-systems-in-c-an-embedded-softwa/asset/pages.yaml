  md: "# Embedded Programming with The Harmony™ for Embedded RealTime Process 45\n\
    \neach alternative in our study must also examine how well the patterns work together,\
    \ in addition to how each works in isolation.\n\nAs mentioned previously, patterns\
    \ may be applied at the different levels of design abstraction. Architectural\
    \ patterns have systemic scope and apply mostly to only one of the five key views\
    \ of architecture. At the next level down in design abstraction, mechanistic design\
    \ patterns apply to individual collaborations, optimizing the same criteria, but\
    \ in a narrower focus. Detailed design patterns – often referred to as design\
    \ idioms – optimize the primitive elements of the software.\n\n# 2.1.3 Basic Structure\
    \ of Design Patterns\n\nAccording to Gamma, et. al.;; a pattern has four important\
    \ aspects:\n\n+   * Name\n  The name provides a “handle” or means to reference\
    \ the pattern.\n* Purpose\n  The purpose provides the problem context and the\
    \ QoS aspects the pattern seeks to optimize. The pattern identifies the kinds\
    \ of problem contexts where the pattern might be particularly appropriate.\n*\
    \ Solution\n  The solution is the pattern itself.\n* Consequences\n  The consequences\
    \ are the set of pros and cons of the use of the pattern.\n\nThe pattern name\
    \ brings us two things. First, it allows us to reference the pattern in a clear,\
    \ unambiguous way, with the details present, but unstated. Secondly, it gives\
    \ us a more abstract vocabulary to speak about our designs. The statement “The\
    \ system uses a Homogeneous Channel redundant architecture with Cyclic Executive\
    \ Concurrency distributed across a set of processors with a Proxy Pattern” has\
    \ lot of information about the overall structure of the system because we can\
    \ discuss the architecture in these patterns.\n\nThe purpose of the pattern identifies\
    \ the essential problem contexts required for the pattern to be applicable and\
    \ what design criteria the pattern is attempting to optimize. This section specifies\
    \ under which situations the pattern is appropriate and under which situations\
    \ it should be avoided.\n\nThe solution, of course, specifies the structure and\
    \ behavior of the pattern itself. It identifies the elements of the pattern and\
    \ their roles in the context of the pattern. This pattern solution is integrated\
    \ into your design in a process known as pattern instantiation.\n\n> Gamma, E.,\
    \ Helm, R., Johnson, R., Vlissides, J.M., 1995. Design Patterns: Elements of Reusable\
    \ Object-Oriented Software. Addison-Wesley."
