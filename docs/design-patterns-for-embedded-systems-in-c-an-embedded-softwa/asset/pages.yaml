    Code Listing 8 shows the header file for the class. You can see some important
    aspects of the definition of the class. First, note that the base class is retained
    in the subclass as an attribute named queue. This brings in the operations and
    attributes from the base class within the subclass. Secondly, note that the operations
    defined for the base class are replicated member function pointers in the subclass.
    Each such virtual function can then either directly invoked with the request or
    deal with the rest to the original function on the Queue class (still held within
    its virtual functions). Lastly, note that the aggregate outputQueue is also an
    attribute of the subclass. The "normal" (one represented by the base class) is
    where new data gets inserted. The other one (represented by the aggregated outputQueue)
    is where the data comes from a re-move

