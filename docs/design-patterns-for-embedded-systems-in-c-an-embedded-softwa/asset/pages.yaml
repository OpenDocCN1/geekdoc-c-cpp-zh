  md: 'An operating system (OS) provides a set of system and platform execution services
    for the application developer, especially around the management and use of target
    system resources. These resources include memory, concurrency units (processes,
    tasks, or threads), event queues, interrupts, hardware, and application programs.
    Most OSs do not provide any guarantees about timeliness, and may invoke unpredictable
    delays due to internal processing, memory management, or garbage collection at
    unforeseen times. This unpredictability, and the fact that most desktop OSs are
    huge (compared to available memory), makes them unsuitable for real-time and embedded
    environments that are constrained in both time and resources.


    A real-time operating system (RTOS) is a multitasking operating system intended
    for real-time and embedded applications. RTOSs are generally written to provide
    services with good efficiency and performance, but usually the predictability
    of the performance is more important than the maximum throughput. In addition,
    RTOSs are smaller and less capable than desktop OSs. RTOSs do not guarantee real-time
    performance but they provide an application environment so that appropriate applications
    can achieve real-time performance.


    RTOSs run applications and tasks using one of three basic design schemes. Event-driven
    systems handle events as they arise and schedule tasks to handle the processing.
    Most such systems use task priority as a quantitative means to determine which
    task will run if multiple tasks are to run. Task priorities are often static (i.e.,
    specified at design time with rate-monotonic scheduling) but are dynamic, varying
    the current operating conditions (such as earliest deadline scheduling). The other
    approaches to task scheduling implement a “fairness doctrine” either by giving
    all tasks a periodic slice in which to run (time-based schemes, as round robin
    scheduling) or by running the task cyclically (sequence-based schemes, as cyclic
    executive scheduling).


    Twenty years ago, most development houses specializing in real-time systems wrote
    their own proprietary RTOSs but the RTOS market has undergone a consolidation,
    enabling houses to spend a greater percentage of their development efforts on
    their in-house specialties by buying a commercial RTOS instead.


    Some of the challenges of using RTOSs include the fact that while there are big
    players, such as Wind River (maker of VxWorks™) and Green Hills Software (maker
    of Integrity™), there are literally hundreds of RTOSs in use today, and each has
    its own Program Interface (API). Further, although RTOSs have a smaller footprint
    and timeliness impact than their desktop brethren, that is not the same as having
    no impact. Many embedded systems run'
