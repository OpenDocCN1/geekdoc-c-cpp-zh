  md: '# Design Patterns for Accessing Hardware 85


    There are a couple of problems with bit fields in C. First, bit ordering is compiler-
    and processor-dependent. Further, the compiler may ignore byte padding rules,
    meaning that it may not map onto a memory mapped device as you expect. For example,
    the GNU C compiler returns size of status in Code Listing 3-2 to be 4 bytes though
    the size of an unsigned char is only 1 byte.


    Even worse, most CPUs must write a byte or word at a time, but bit fields may
    be written in an atomic step, leading to thread safety issues if separate mutexes
    are used for different fields.


    Another problem with using bit fields is that it is impossible to cast between
    a scalar and a user-defined struct. Thus, the following is disallowed⁵:


    ```

    Unsigned char f;

    f = 0xF0;

    status = (statusBits)f;

    ```


    Let''s turn our attention to a number of design patterns that have proven themselves
    useful for the manipulation of hardware. The Hardware Proxy Pattern, discussed
    next, is an archetypal pattern for the abstraction of hardware for the purpose
    of encapsulating details that are likely to change from the usage of the information
    provided to or by hardware. The Hardware Adapter Pattern extends the Hardware
    Proxy Pattern to provide the ability to support different hardware interfaces.
    The Mediator Pattern supports coordination of multiple hardware devices to achieve
    a system level. The Observer Pattern is a way of distributing sensed data to the
    software elements that need it. The Debouncing and Interrupt Patterns are simple
    reusable approaches to interface with hardware devices. The Timer Interrupt Pattern
    extends the Interrupt timer to provide accurate timing for embedded systems.


    # 3.2 Hardware Proxy Pattern


    The Hardware Proxy Pattern creates a software element responsible for access to
    a piece of hardware and encapsulation of hardware compression and coding implementation.


    # 3.2.1 Abstract


    The Hardware Proxy Pattern uses a class (or struct) to encapsulate all access
    to a hardware device, regardless of its physical interface. The hardware may be
    memory, port, or interrupt


