    # ### 3.4.3 Pattern Structure


    The Mediator Pattern uses a mediator class to coordinate the actions of a set
    of collaborating devices to achieve the desired overall effect. The Mediator class
    coordinates the control of the set of multiple Specific Collaborators (their number
    is indicated by the ''**'' on the association between the Mediator and the Specific
    Collaborator in Figure 3-5). Each Specific Collaborator must be able to contact
    the Mediator when an event of interest occurs.


    # ### 3.4.4 Collaboration Roles


    This section describes the roles for this pattern.


    # ### 3.4.4.1 Collaborator Interface


    The Collaborator Interface is a specification of a set of services common to all
    Specific Collaborators that may be invoked by the Mediator. For example, it is
    common to have reset(), shutdown, initialize() style operations for all the hardware
    devices to facilitate them all to a known initial, recovery/or shutdown state.
    Each of the common services must be implemented in each Specific Collaborator
    (although, of course, the implementation will usually be unique to each collaborator).
    If there are no common to own Collaborators, then this interface may be omitted.


    # ### 3.4.4.2 Mediator


    The Mediator class coordinates the Specific Collaborators in the pattern. It has
    a link to each Specific Collaborator so that it can send messages to it. In addition,
    each Specific Collaborator must be able to send the Mediator messages when events
    of interest occur. The Mediator'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# 102 Chapter 3


    provides the coordination logic that would otherwise require Specific Collaborators
    to coordinate among themselves.


    # 3.4.4.3 Specific Collaborator


    The Specific Collaborator represents one device and so may be a device driver
    or Hardware Proxy. It receives command messages from the Mediator and also sends
    messages to the Mediator when events of interest occur.


    # 3.4.5 Consequences


    This pattern creates a mediator that coordinates the set of collaborating actuators
    without requiring direct coupling of those devices. This greatly simplifies the
    overall design by minimizing the points of coupling and encapsulating the coordination
    within a single element. Whenever the Collaborator would be directly contacted
    any Collaborator, instead it notifies the Mediator who can decide how to respond
    as a collective whole.


    Since many embedded systems must react with high time fidelity, delays between
    the actions may result in undesirable or undesirable effects. It is important
    that the mediator class react within those constraints. This is of a particular
    concern when there is two-way collaboration between the actuators and the mediator.


    # 3.4.6 Implementation Strategies


    The Mediator must be able to link to each Specific Collaborator. This can be done
    with an array of pointers (the above implementation strategy), a separate pointer
    for each Collaborator, or a combination of the two. A common rule of thumb is
    that if Specific Collaborators are indistinguishable in terms of their use other
    than their position in the list (e.g., they provide a common interface), then
    an array of pointers is best. If the Specific Collaborators serve different purposes,
    then use a link for each Specific Collaborator. The example in 3.4.8 shows the
    use of both an and any of specific pointers.


    It is even possible to have grouped sets of different Specific Collaborators in
    which each class within a group provides a common interface.


    # 3.4.7 Related Patterns


    This pattern is similar to the Strategy Pattern from the classic Design Patterns
    book¹¹⁰ and the architectural Rendervous Pattern from my Real-Time Design Patterns
    book¹¹¹. In this case we are focusing on its use for detailed hardware coordination.


    > ¹⁰ Gamma, E., Helm, R., Johnson, R., Vlissides, J., 1995. Design Patterns: Elements
    of Reusable Object-Oriented Software. Addison-Wesley.


    > ¹¹ Douglass, B.P., 2003. Real-Time Design Patterns: Robust Scalable Architecture
    for Real-Time Systems. Addison-Wesley.'
