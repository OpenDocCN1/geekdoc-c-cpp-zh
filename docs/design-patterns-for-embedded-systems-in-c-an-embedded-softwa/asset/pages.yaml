    You''ll notice that this gives us lists of lists of states. This is often implemented
    with arrays because the sizes of these lists are known at design time. If you
    need to further nest AND-states, you can add additional levels of lists, with
    appropriate behavior at each level.


    # 5.8.4.4 ConcreteAndStateClass


    This represents one of the AND-state classes. Each design will contain one such
    class, with its own implementation of event receptors, for each AND-state. In
    the basic pattern, each-and-state class will use the Multiple Event Receptor Pattern,
    but other approaches are possible.


    # 5.8.4.5 ConcreteAndStateType


    Each AND-state has its unique set of nested states; this type is an enumerated
    list of them. One such type will exist for each ConcreteAndStateClass. This class
    is not visible to the clients of the Context.


    # 5.8.4.6 Context


    The Context is the ultimate owner of the state machine. It has the variables and
    functions that are manipulated by the ConcreteAndStateClasses. This presents a
    set of events to its clients (alternatively, the Single Event Receptor Pattern
    or other state pattern can be mixed in as well). The basic rules of state change
    are enforced:


    +   * If the state being entered has no nested AND-states, it executes normally
    as in the Multiple Event Receptor Pattern.

    * If the state being entered has nested AND-states, then its entry action is performed
    prior to the entry actions of the nested AND-states.

    * If the composite state having AND-states is unchanged (that is, the event transition
    is local within the current composite state), then the event is delegated to its
    set of AND-state classes for handling, including the execution of the actions.

    * If the composite state is left, the exit actions of the composite state execute
    after the exit actions of its nested AND-states.


    # 5.8.5 Consequences


    This pattern provides extensible mechanisms for managing state machines that contain
    ANDstates. Each class is relatively simple because of the delegation of responsibilities
    for state management — the Context manages the high level states, and the ConcreteAndStateClasses
    manage the AND-states.


    On the other hand, this pattern requires the management of lists, of lists which
    will normally be managed as lists of pointers. This level of indirection, can
    be the source of obscure mistakes if not carefully managed.


    # 5.8.6 Implementation Strategies


    As mentioned in the previous section, the common implementation of the lists is
    arrays of pointers to arrays of pointers.'
