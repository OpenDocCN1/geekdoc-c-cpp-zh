    ![](img/34c40aaecb0a254d07ecd1896a5cd148_383_0.png)


    Figure 6-2: One''s Complement Pattern


    # 6.2.5 Consequences


    This pattern uses twice the memory for storage of critical data; in addition,
    there is some performance hit on both data storage and retrieval. On the plus
    side, the pattern can identify errors by EMI or due to stuck or shortened memory
    or address bits.


    # 6.2.6 Implementation Strategies


    This pattern is very easy to implement in C. For primitive types, the ~ operator
    computes the bit inversion. For structured types, you must iterate over the primitive
    parts of the data (see the example below).


    # 6.2.7 Related Patterns


    This pattern provides a very reliable way to identify faults that affect a single
    memory location. For very large data structures, the memory impact of complete
    data replication may be too large; in such cases, the Cyclic Redundancy Check
    (CRC) Pattern provides a reasonably reliable alternative.


    # 6.2.8 Example


    Figure 6-3 shows a simple application of this pattern. OwnShipAttitude stores
    the attitude (orientation, as specified in its attributes roll, pitch, and yaw)
    using the One’s Complement Pattern. When the getAttitude() function is called,
    it reinverts the inverted copy and'
