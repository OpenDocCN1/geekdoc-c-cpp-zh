  md: '# 4.6.6 Implementation Strategies


    The simplest implementation of a queue is as an array of message elements. This
    has the advantage of simplicity but lacks the flexibility of a linked list.


    Queues are fairly simple to implement but there are many possible variants. Sometimes
    some messages are more urgent than others and should be processed before waiting
    for lower priority messages. The MessageQueue can be modified to implement priority
    by adding multiple buffers (one for each priority) or by inserting the element
    in the queue on the basis of the message priority (although this can increase
    the time necessary for an element insertion and deletion). In this case, the message
    should have a priority attribute to enable the MessageQueue to properly insert
    and remove the element.


    In complex systems, it may not be feasible to predict an optimal queue size. In
    such cases, extensible queues can be implemented. When the MessageQueue is full,
    more memory is allocated. A linked list implementation of the MessageQueue is
    more appropriate for an extensible queue. It may be difficult to determine under
    what circumstances it is appropriate to shrink the queue and reuse unused memory.


    It sometimes happens that the potential number of elements exceeds memory capacity.
    In this case, a cached queue can be created; in such, there are essentially three
    storage locations: a local memory newest data buffer, a local memory oldest data
    buffer, and a file that holds data of intermediate age. When the new data buffer
    becomes full, it is emitted to the file system. The local old data buffer is removed
    from the disk (or copied from the new data buffer if the file is empty). This
    allows storage of potentially huge volumes of data, but making the cache data
    can be time intensive.


    # 4.6.7 Related Patterns


    The Queuing Pattern serializes access to data by queuing data or commands, allowing
    the recipient to handle one at a time. It does this asynchronously, so the time
    between the sending of the message and its processing is decoupled. This may not
    meet the performance needs of the system. The Guarded Call Pattern also serializes
    access but does so synchronously, so that data and command transfers generally
    have closer together in time. However, the Guarded Call Pattern can lead to unbounded
    priority inversion if not used carefully. In addition, if the receiver is not
    ready to receive the message from the sender, the sender must block or take another
    action.


