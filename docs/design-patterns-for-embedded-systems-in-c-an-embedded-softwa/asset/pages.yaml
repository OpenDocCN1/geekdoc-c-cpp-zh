    #  6.7.4.4 Channel


    This class is the container for the instances of the others. It is important in
    this context because it provides a “unit of redundancy.” It provides two services
    of itself—`enable()` and `disable()`.


    #  6.7.4.5 ConcreteDataTransform


    This class performs a mathematical transformation on the incoming data value (from
    either the sensor or a ConcreteDataTransform) and produces an output (sent to
    the next `ConcreteDataTransform` in the sequence or the `ActuatorDeviceDriver`).
    In simple cases, there may be only a single `ConcreteDataTransform` class, but
    in more complex situations there may be dozens.


    Certain of these classes form checkpoints – points in the transformation chain
    at which the validity of the transformations will be checked. For those cases,
    the optional link to the specific `ConcreteTransformChecker` will be implemented.'
