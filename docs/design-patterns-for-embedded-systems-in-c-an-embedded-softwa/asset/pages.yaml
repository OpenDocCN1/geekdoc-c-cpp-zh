    # 4.8.5 Consequences


    The Simultaneous Locking Pattern prevents deadlock by removing required condition
    #2 – some resources are locked while others are requested – none of them. However,
    the pattern removes the possibility of deadlock, it may increase the delay of
    the execution of other tasks. This delay may occur even in situations where there
    is no actual resource conflict. The problem is far more pronounced for resources
    that are widely shared than for resources that are shared more narrowly. In addition,
    the pattern does not address priority inversion and in fact may make it worse,
    unless some priority inversion bounding pattern is deployed, such as the Guarded
    Call Pattern with priority inheritance. The general case for the pattern, shown
    in Figure 4-24, requires developer discipline that they must avoid using the direct
    links to the MultasteredResources until they have successfully been given a lock.
    In large projects, this discipline can be ignored resulting in subtle and hard-to-identify
    errors. The simplified model, shown in Figure 4-24, doesn''t have this problem
    because the ResourceMasterSimplified publishes the resource access methods.


    Of this pattern only applies when deadlock is a possibility, such as when multiple
    resources are shared with at least two in at least three threads.


    # 4.8.6 Implementation Strategies


    The implementation of this pattern should pose no difficulties other than the
    need to use, in the general case, a mutex semaphore that supports a tryLock()
    operation, and the need to ensure that the precondition of access (successful
    locking of the MultasteredResource) is achieved before accessing the resource
    directly.


    # 4.8.7 Related Patterns


    Deadlock can be prevented by avoiding any of the four conditions. The Critical
    Regions Pattern avoids by breaking condition #1 – mutual exclusion locking of
    resources. The Ordered Locking Pattern, described later in this chapter, prevents
    deadlock by breaking condition #4 – circular waiting condition.


