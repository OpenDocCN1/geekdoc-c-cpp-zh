  md: '# 36 Chapter 2


    # 2.1 Basic Elements of the Harmony Process


    Let''s turn our attention to the basic questions of how we, as embedded software
    developers, perform design. While I don''t want to belabor process in this book,
    we perform design activities by following (formal or informal) workflows. To understand
    how to design, we must have at least a basic agreement as to the workflow.


    # 2.1.1 A Quick Overview of the Development Workflow


    I am the author of the Harmony™ for Embedded RealTime (Harmony/ERT¹) process from
    IBM Rational². This process consists of a set of best practices for the development
    of real-time and embedded software, and is in use by many different embedded vertical
    markets, from medical to consumer electronics. It is an agile, model-based approach
    to software development that emphasizes continuous throughout throughout development,
    test-driven development, and use of design patterns.


    Harmony™ for Embedded RealTime process is an incremental process, similar in some
    ways to Scrum³. The Harmony/ERT process focuses on the overall timeline and milestones,
    as shown in Figure 2-1. The macrocycle focuses on the production of a single validated
    increment (a.k.a. a build or prototype). The nanocycle timeframe is in the range
    of minutes to hours and concentrates on continual execution, debug, and unit test
    of the software.


    The microcycle, which iterated many times during the course of a typical period,
    is broken into several short phases, as we can see in Figure 2-2. These phases
    are relevant and briefly described in Table 2-1, where we can see a couple of
    key points. First, design is something that occurs only after we have correctly
    functioning software from the Object Analysis (or “Software Analysis”) if you
    prefer phase. Secondly, design focuses on optimizing what design patterns – the
    theme of this book – do; they optimize software. Design patterns are not about
    getting the software to work correctly; they are about getting the software to
    work optimally.


    As you can see from Table 2-1, the Harmony/ERT process uses three levels of design.
    Architectural design looks at design decisions that optimize the system overall.
    Architectural design is divided into five key views that have the greatest impact
    on the structure and behavior of the software (Figure 2-3). Each of these key
    architectural views is described in Table 2-2.


    +   1 Formerly known as Harmony for Embedded Software (Harmony/ESW). Don''t ask;
    I didn''t change the name this time.

    2 See www-01.ibm.com/software/awdtools/rmc/ for information on tools and process
    content.

    3 See www.scrumalliance.org/.'
