  md: '# 66 Chapter 2


    # 2.1.6 Observer Pattern


    Abstract


    The observer pattern addresses the concern of dynamically adding and removing
    clients of data or services, as well as optimizing the processing associated with
    updating those clients in a timely way.


    +   - Problem

    This pattern maintains the class client-server architecture in which the clients
    know about a server that has either data or services of interest, but that knowledge
    is one. In spite of this, the responsibility for updating the clients in an efficient
    and timely way is given to the server. In addition, because the server maintains
    a list of interested clients, it notifies all clients when it is appropriate to
    do so, such as periodically or when the data changes. Clients can be dynamically
    added to or removed from the system as it runs, without requiring the server to
    have any knowledge of the clients (other than the location of an operation of
    the correct signature).


    +   - Pattern structure

    This pattern defines the following roles:

    - Abstract Observer

    This element has a one-way association (link) to the Abstract Subject so that
    it can request to be added to the list of interested clients (a process known
    as subscribing) or removed from the list (known as unsubscribing). It provides
    an operation with a specific signature to be invoked by the subject when appropriate.

    - Abstract Subject

    This element will serve as the base class for the server in the client-server
    architecture; it has information or services needed by the Abstract Observer.
    It provides operations to add remove clients (subscribe and unsubscribe, respectively)
    and can notify all currently subscribed clients when appropriate. Most common
    strategies for notification are either periodically or when the data changes.
    This creates a new notification handle for each subscribed client, forming a list
    of notification handles. While this list can be managed in any number of ways,
    in this case it is handled as a linked list. Notification of the clients is simply
    a matter of “walking the list” and invoking the update operation for each Abstract
    Observer currently subscribed.

    - Notification handle

    This element provides a dynamic callback link for the Abstract Subject to the
    Abstract Observer; specifically, it has, as a data element, a pointer to the update
    operation of the server. It also has a link to the next element in the list which
    is NULL at the end of the list.

    - Concrete Observer (formal parameter)

    This element is the subclass of the Abstract Observer; it inherits the link to
    the Abstract Subject and provides a (nonimplemented) update operation that will
    be invoked by the Concrete Subject.'
