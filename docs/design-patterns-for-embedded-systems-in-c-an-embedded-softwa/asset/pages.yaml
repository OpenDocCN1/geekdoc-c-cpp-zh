    \nThe Ordered Locking Pattern is another way to ensure that deadlock cannot occur,\
    \ this by preventing condition 4 (circular waiting) from occurring. It does this\
    \ by ordering the resources and requiring that they are always locked by a client\
    \ in that specified order. If this is religiously enforced, then no circular waiting\
    \ condition can ever occur.\n\n# 4.9.1 Abstract\n\nThe Ordered Locking Pattern\
    \ eliminates deadlock by ordering resources and enforcing a policy in which resources\
    \ are allocated only in a specific order. For monadic (that is, functions that\
    \ can be used independently of others) operations, the client can invoke them\
    \ without special consideration and the called function will lock and release\
    \ the resource internally. For holding locks over the long term – accessing dyadic\
    \ (that is, functions that require the caller to explicitly lock and unlock them)\
    \ functions – the client must explicitly lock and release the resources, rather\
    \ than doing it implicitly by merely invoking a service on a resource. This means\
    \ that the potential for neglecting to unlock the resource exists."
