    # 5.2.2 AND-States


    Sometimes state machines are complex in the sense that they have independent (or
    at least so) aspects. Consider the state machine for a light that has two independent
    aspects; color (Off, Red, Yellow, and Green) and display style (Off, Steady, Flashing
    Slowly, and Flashing Quickly). How many states of this light are there? If you
    look at Figure 5-6,


