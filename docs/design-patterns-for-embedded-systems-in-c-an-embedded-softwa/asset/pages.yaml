    # 3.9 So, What Did We Learn?


    In this chapter, we''ve looked at a number of patterns useful for manipulating
    hardware. The Hardware Proxy Pattern focuses on encapsulation of hardware-specific
    details while the Hardware Adapter Pattern provides a straightforward way to adapt
    different but similar devices for the needs of the system. Many times, interactions
    of hardware are necessary for proper system functions, a benefit of the Mediator
    Pattern. The Observer Pattern supports dynamic addition and removal of clients
    for hardware data, such as sensors.


    The last three patterns provide different means for interfacing with hardware.
    The Debouncing Pattern handles the common problem of hardware that produces intermittent
    contact during open and closure of metal contact switches. The Interrupt Pattern
    supports the highly timely response to events of interest. The Polling Pattern
    repeatedly polls the hardware for new sensor data and device state information.


    These are basic patterns in the sense that they address all low-level concerns
    about interfacing with hardware. The more difficult design issues have to do with
    transforming the commands and data within the system to achieve the system goals.
    The next chapter provides patterns that deal with concurrent execution, from basic
    concepts to scheduling execution, avoiding race conditions and deadlock, and synchronizing
    tasks when necessary.


    Chapter 5 deals with finite state machines – their implementation and usage; while
    in Chapter 6 we look at safety and reliability.'
