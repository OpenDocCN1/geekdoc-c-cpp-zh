    # 5.1 Oh Behave!


    Behavior can be defined as a change in condition or over time. It is often a response
    to an external event or, but autonomous systems decide for themselves and how
    to behave. I like to further characterize behavior into four basic kinds¹. Simple
    behavior is behavior independent of any history of the object or system. For example,
    computing cos returns the same result regardless of what value is computed. Similarly
    computing the maximum of two values is self-contained in the sense that it doesn''t
    rely on history of the system. Continuous behavior, on the other hand, does rely
    upon the history of the object or system. For example, a moving average filter
    computes an output that depends only on current data but also on the history of
    the data (see Equation 5-1).


    $f_j = \frac{d_j + d_{j-1} + d_{j-2} + d_{j-3}}{4}$


    # Equation 5-1: Moving average digital filter


    Similarly, a Proportional Integral-Differential (PID) control loop uses feedback
    to update its output, as we see in Figure 5-1. In both cases, the output depends
    not only on current information


    > ¹ See my previous book Real-Time UML Third Edition: Advances in the UML for
    Real-Time Systems (Addison-Wesley, 2004) for more detailed information. We won''t
    deal with all of the rich semantics available in UML state machines in this book.'
