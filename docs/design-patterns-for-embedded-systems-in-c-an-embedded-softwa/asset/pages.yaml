    R. Task Z is the lower priority task, with a period of 1000 ms and needing 50
    ms to execute, 10 ms of it locks resource R. Note that in this example, the deadline
    for each task occurs at the start of the next period.


    If schedulability of tasks is a concern (and almost always should be), you should
    examine the effect of blocking on schedulability. In the case of Figure 4-4, what
    is the case? When Task Z has barely locked R and Task A runs. In this case the
