  md: '# Design Patterns for Embedding Concurrency and Resource Management 153


    +   * Execution time: the length of time required for an action or action sequence

    * Interrival time: the time between task initiation for an aperiodic task

    * Jitter:: variation around the period of a periodic task

    * Multitasking Preemptive Scheduling: a scheduling schema in which the highest
    priority task ready to run will do, preempting any lower priority tasks that are
    currently running

    * Period: the interval between periodic task invocations

    * Priority: a numeric value used to determine which task, a set of ready-to-run
    tasks, will execute preferentially

    * Priority inversion: when a lower priority task is running even though a higher
    priority task is ready to run. Also known as blocking

    * Pseudoconcurrency: execution of multiple tasks by executing a single task at
    a time and switching between tasks according to some scheduling policy

    * Race condition: a computational situation in which the result depends upon the
    order of execution of actions, but that order is not inherently knowable

    * Real-Time Action: an action for which timeliness is an aspect of correctness

    * Scheduleability: a task is said to be schedulable if all of its tasks are timely

    * Synchronization Pattern: how tasks manage synchronization at specific points
    in their respective action sequences

    * Synchronization Point: a specific action in a sequence at which the task will
    wait until other tasks reach corresponding synchronization points

    * Task: see concurrency unit

    * Thread: see concurrency unit

    * Timeliness: the ability of a task to predictably complete prior to its deadline,
    or to meet its time-related performance requirements

    * Urgency: the nearness of an action sequence''s deadline

    * Worst Case Execution Time: the longest time an action sequence execution can
    take


    Figure 4-1 shows the relationship between actions, action sequences, and tasks''.
    Each task (also known as a concurrency unit) consists of a set of actions performed
    in a specific sequence. These action sequences are executed independently from
    the others. This means that within a task, the order of action execution is fully
    known; in case of Task 1 in the first, Action A, then Action B, then Action C
    or Action D, then Action E and so on. What is not known is the order of action
    execution between tasks. Which executes Action A? Action Z? Action Beta? The answer
    is you don''t know and you don''t care — if you care, concurrency was a poor choice.


    > Many people draw a distinction between task, thread, and process. However, these
    are the same concept at different scopes of concern. In this book, we will use
    these terms interchangeably.'
