    # 6.6.4 Collaboration Roles


    This describes the roles for this pattern.


    # 6.6.4.1 AbstractDataTransform


    This class is a placeholder for one of several possible ConcreteDataTransforms.
    In an object-oriented language or implementation, true generalization can be used
    but in C, it is more common to use this as a nominal concept to get the intent
    rather than drive the implementation. It has two optional associations. One is
    to itself – that, the transformation in the list. The other is to the output ActuationDeviceDriver
    – this is in one of the former association. Another way, the AbstractDataTransform
    has a link to the next processing in the chain or to the output device driver,
    not both.


    This class also has an optional link to AbstractTransformChecker for points in
    the transformation chain where TransformChecking is appropriate.


    # 6.6.4.2 AbstractTransformDeviceChecker


    This is a placeholder for an element that can check on the validity of the processing
    or data in its current state.


    # 6.6.4.3 ActuatorDeviceDriver


    This class uses the computed output values to drive one or more actuators, such
    as a motor, light, or heating unit.


    # 6.6.4.4 ConcreteDataTransform


    This class performs a mathematical transformation on the incoming data value (from
    either the sensor or a previous ConcreteDataTransform) and produces an output
    (sent to the next ConcreteDataTransform in the sequence or the ActuatorDeviceDriver).
    In simple cases, there may be only a single ConcreteDataTransform class, but in
    more complex situations there be dozens.


    Certain of these classes form checkpoints – points in the transformation chain
    at which the validity of the transformations will be checked. For those cases,
    the optional link to the specific ConcreteTransformChecker will be implemented.


    # 6.6.4.5 ConcreteTransformChecker


    This is a specific transformation checking class that checks the transformation
    at a single point in the chain.


    # 6.6.4.6 SensorDeviceDriver


    This class acquires physical data from one or more sensors to put into the channel
    for processing.


    > 9 Common implementation is a pointer, set to NULL if the link isn’t active.'
