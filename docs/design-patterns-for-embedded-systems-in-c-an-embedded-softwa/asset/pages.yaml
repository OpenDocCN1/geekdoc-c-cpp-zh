  md: '# 6.7.8 Example


    The example shown in Figure 6-18 is a heterogeneous dual channel pattern for a
    train speed control system. One channel uses a light shining on the inside of
    a train wheel. By knowing the circumference of the wheel and by measuring the
    frequency of the mark appearance (measured by the optical sensor), one can compute
    the speed of the train. These data are then filtered, validated, and used to compute
    a desired engine output. This engine output is checked for reasonableness and,
    if acceptable, then sent to the engine. This is the OpticalWheelSpeedChannel shown
    in Figure 6-19.


    The other channel uses a GPS to determine train speed. This channel receives ephemeris
    data from some set of (at least three) satellites and using the time sent (comparing
    it to the time within the system), it computes the distance to the satellite.
    Through a process 3D triangulation, the train''s position can be calculated. This
    location is validated and then used to compute the speed by looking at the rate
    of change of positions. This speed is validated and, if valid, used to compute
    the desired engine output to maintain current speed. This is the GPSSpeedChannel
    shown in Figure 6-20.


    In either channel, if data are identified as invalid, the channel does not command
    the engine speed. Because there is another channel to take over the task of determining
    desired engine output, the system can continue to operate even if a single point
    fault results in a channel shutting down. Further, because this is an extremely
    heterogeneous design, an error in one channel will not be replicated in the other.
    This design provides protection against both random and systematic faults.


    There is nothing profound about the code that is produced to implement this example
    beyond what has been described earlier in this chapter. The interesting part is
    how the channels are


