  md: '# What Is Embedded Programming? 3


    Even though all systems may be modeled as hard real-time systems, in actual fact,
    most are not. If the response is occasionally delayed or even an entire input
    is missed, systems will continue to function properly. The primary reason for
    modeling real-time systems as “hard” is because it eases the assurance of the
    system’s timeliness through mathematical analysis.


    # 1.1.1 Embedded Design Constraints


    From the inside, one of the most striking characteristics of embedded systems
    is severity of their constraints. Unlike writing software for a general-purpose
    computer, an embedded system is usually shipped already integrated with all the
    hardware it needs. The hardware platform is not usually user-extensible, so resources
    such as memory, power, cooling, or computing power contribute to the per-unit
    cost (known as recurring cost). To maintain profitability, there is almost tremendous
    pressure on the developer to minimize the use of such hardware resources. This
    means that embedded systems often require additional optimization efforts far
    beyond required for desktop applications.


    Beyond the need to minimize hardware, performance concerns are all critical to
    the success of a system. There are many aspects to performance, and different
    systems value these aspects differently. In some systems, throughput is a critical
    criterion. Throughput is normally measured in terms of the number of transactions,
    samples, connections, or messages that can be processed per unit time. In other
    systems, handling each as quickly as possible is more important, a quality known
    as responsiveness, usually captured as a worst case execution time. Other systems
    value predictability of performance over maximum throughput or responsiveness.
    Predictability is usually measured as occurring within a range or being drawn
    from a probability density function.


    Reliability, robustness, and safety are other kinds of constraints levied on embedded
    systems. The reliability of a system is a (stochastic) measure of the likelihood
    that the system will deliver the correct functionality. Robustness refers to the
    ability of a system to deliver services properly when its preconditions (such
    as operating or input data) are violated. Safety denotes the level of risk of
    a system, that is, the likelihood that using the system will result in an accident
    or loss. These concerns often require additional hardware and software measures
    to maintain the operation of the system within acceptable limits. For example,
    embedded systems have a power on self-test (POST) as well as a periodic or continuous
    built-in test (BIT).


    Collectively, these constraints on the system are known as the qualities of services
    (QoS) provided by the system. In addition to the various QoS constraints, to reducing
    cost, it is common to create custom hardware that requires specialized driver
    software.'
