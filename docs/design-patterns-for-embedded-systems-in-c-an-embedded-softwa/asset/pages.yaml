    \ MessageQueue and invokes either the insert() or\nremove() functions to access\
    \ the data here there.\n\n# 4.6.5 Consequences\n\nThe Queuing Pattern provides\
    \ good serialization of access to the data as they are passed\nam tasks. The use\
    \ of mutex ensures that the MessageQueue itself isn't corrupted by\nsimultaneous\
    \ access to the MessageQueue's services. The reception of the data is less timely\n\
    t the Guarded Call Pattern since the Queuing Pattern implements asynchronous\n\
    communication.\n\nThe number of elements held by the queue can be quite large;\
    \ this is useful as the products of\nt elements run in a \"bursty\" fashion, allowing\
