    # 1.2 OO or Structured – It’s Your Choice


    Structured programming is a disciplined form of software development that emphasizes
    two separate and distinct aspects.


    On one hand, functions or procedures form the foundation of behavioral programming:
    a procedure is a collection of primitive actions with a single entry point that
    performs a coherence behavioral goal; a function is simply a procedure that returns
    a value. Procedures can be broken down into all calls by one procedure invoking
    another, permitting algorithmic decomposition. Procedures are usually synchronously
    invoked (i.e., called) by adding additional means, asynchronous invocations can
    invoked as well.


    The other side of structured programming is the notion of data structuring. All
    third-generation languages have the notion of building complex data structures
    from more primitive elements, ultimately basing them on the basic types provided
    by the computer language. These may be homogeneous collections, such as arrays,
    or heterogeneous ones, with C structs


    Object-oriented programming is based on an orthogonal paradigm. Rather than two
    separate taxonomies, object-oriented programming has a single one based on the
    notion of a class. A class combines together both data (stored in attributes)
    and procedures (known as operations) that operate on that data, because they tend
    to be inherently tightly bound away.'
