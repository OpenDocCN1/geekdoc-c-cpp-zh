  md: '# Safety & Reliability Patterns 423


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_443_0.png)


    Figure 6-20: Details of GPS Speed Channel


    and space. The CRC Pattern is useful in protecting larger volumes of data. The
    Smart Data Pattern adds behavior to data (that is, creates classes) to ensure
    that the data''s preconditions and constraints are met.


    The other patterns in this chapter have a larger scope. The fundamental pattern
    for the rest of the chapter is the Channel Pattern, in which the processing of
    sensory data into actionable commands is set up as a series of data transform
    steps. This pattern is elaborated into the Protected Single Channel Pattern in
    which checks are added at various steps to validate the processing within the
    channel. The Dual Channel Pattern adds two channels so that if one fails, the
    other can continue providing the required service.'
