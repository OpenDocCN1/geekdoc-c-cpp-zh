    6.7.4.6 ConcreteTransformChecker

    This is a specific transformation checking class that checks the transformation
    at a single point

    in the chain.


    6.7.4.7 SensorDeviceDriver

    This class acquires physical data from one or more sensors to put into the channel
    for

    processing.


    6.7.5 Consequences

    This pattern addresses safety- or reliability-related faults by replicating the
    channel; this usually

    requires replication of some amount of hardware as well, giving it a rather high
    recurring

    (production) cost. If the channels are identical, then all replicants contain
    the same errors and so

    will manifest the error under the same circumstances.


    6.7.6 Implementation Strategies

    The large-scale implementation strategies are commonly identified as different
    subpatterns

    of one. These are discussed in the next section. In addition, the management of
    the

    two channels can be implemented differently. Both channels can run simultaneously
    and

    checked against each other — if the outputs differ over some threshold, the system

    transitions to a fault-safe state. Alternatively, one channel can run until a
    fault is detected

    then the other channel can be enabled, allowing continuation of services in the
    presence of

    the fault.


    6.7.7 Related Patterns

    There are a number of variants on this pattern. Each gives a different cost/benefit
    ratio.


    6.7.7.1 Homogeneous Redundancy Pattern

    Description

    This variant uses identical designs and implementations for the different channels.
    It

    can effectively address single-point faults – provided that the faults are isolated
    within a

    single channel. The system can continue functionality in the presence of a failure
    within a

    channel.


    Consequences

    This variant has a relatively high recurring cost (cost per shipped item) but
    a relatively

    low design cost (since each channel must only be designed once). Typically sensors
    and

    actuators are replicated to provide fault isolation, and often processors, memory,
    and other

    hardware must be replicated.'
