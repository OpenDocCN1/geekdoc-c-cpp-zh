    # 1.1 What’s Special About Embedded Systems?


    This book focuses solely on embedded systems development. In doing so, it is drawing
    a distinction between “embedded” systems and “others.” Before we get into the
    depth of the discussion, we need to understand what this difference is so that
    we can appreciate what we forebodes with respect to the patterns and technologies
    we will use to develop embedded systems.


    I define an embedded system as “a computerized system dedicated to performing
    a set of real-world functions, rather than providing a generalized computing environment.”
    Clearly, this is a broad categorization that includes 8-bit computers embedded
    in cardiac pacemakers, linked 32-bit computers controlling avionics, communications,
    fuel control for'
