    | Interrupt Handler | Use a single event type to raise an interrupt | Simple to
    implement for handling a small set of incoming event types; highly efficient in
    terms of handling urgent events quickly | Doesn''t scale to many events; interrupt
    handles must be very short and atomic; possible to drop events; difficult to share
    data with other tasks |

    | Event Source | Group all events from a single source so as to be handled by
    one task | Simple threading model | Doesn''t scale to many events well; suboptimal
    performance |

    | Related Information | Group all processing of information (usually around a
    resource) in a task | Useful for "background" low-urgency processing | Same as
    Event Source |

    | Independent Processing | Identify different sequences of actions as there is
    no dependency between the difference sequences | Leads to simple task model |
    May result in too many or too few threads for optimality; doesn''t address sharing
    of resources or synchronization |

    | Interface Device | A kind of event source | Useful for handling device (e.g.,
    bus) interfaces | Same as Event Source |

    | Recurrence Properties | Group together events of similar recurrence such as
    period, minimum interval time, or deadline | Best for schedulability; can lead
    to optimal scheduling in terms of timely response | More complex |

    | Safety Assurance | Group special safety and reliability assurance behaviors
    together (e.g., watchdogs) | Good way to add on safety and reliability processing
    for safety-critical and high-reliability systems | Suboptimal performance |


