    # Code Listing 4-17: CRRobotArmManager.c\n\n| A little bit about semaphores |\n\
    | Edsger Dijkstra invented the concept of a semaphore for the coordination of\
    \ tasks wanting to share resources. The most common implementation is a counting\
    \ semaphore which allows, at most n tasks, to use a resource and blocks additional\
    \ tasks they attempt to access the resource until one of the tasks that has successfully\
    \ locked (said to own the semaphore) unlocks the resource. n is said to be the\
    \ capacity of the semaphore. A binary semaphore is a counting semaphore for n=1.\
    \ A mutual exclusion (mutex) semaphore is a binary semaphore with some extra properties,\
    \ which are OS dependent. Binary semaphores are used for both mutual exclusion\
    \ and event notification, while mutexes are used only to enforce mutual exclusion.\n\
    Semaphore are initialized with n when they are created, something like\nsemaPtr\
    \ = OS_create_semaphore(int n);\nwhich initializes an internal counter to n. \n\
    The semaphore offers two other services, lock() and release() (which, Dutch, Dijkstra\
    \ called P (for Prola or \"test\") and V (for Verhoog or \"increase\")). lock()\
    \ works by decrementing the counter by 1. If the counter has decremented to 0\
    \ or less, then the thread calling lock() is blocked by the scheduler. The release()\
    \ function increments the semaphore counter, so that there are threads waiting\
    \ on it, one of them will unblock and run (it, is call to lock()) returns. Note\
    \ that you can't test to see if a lock() will block or not before the thread calls\
    \ it; it will either succeed immediately or block the thread (and hopefully) be\
    \ released later. Put another way, there is usually no way to know if there are\
    \ threads waiting on before you call lock(). However, some RTOS have a trylock()\
    \ function that locks the resource is available or returns an error code if not.\n\
    void lock(Semaphore* s) {\ndo {\n    wait();\n} while (s->count <= 0);\n    -s->count;\
    \ /* this operation must be implemented as a critical region */\n|\n\n> Or it\
    \ could be P for \"Piraat\" (pirate). No one seems to know for sure."
