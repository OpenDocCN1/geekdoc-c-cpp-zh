    # 4.3.4.6 Stack


    Each AbstractThread has a Stack for return addresses and passed parameters. This
    is normally only explicit at the assembly language level within the application
    thread, but is an important part of the scheduling infrastructure. This element
    is usually provided by the RTOS.


    # 4.3.4.7 StaticPriorityScheduler


    This class operates the execution of multiple threads based on their priority
    according to a simple rule: always run the highest priority ready. When the «active»
    object is created, it (or its creator) calls the createThread() operation to create
    a thread for the «active» object. Whenever this thread is executed by the StaticPriorityScheduler,
    it calls the StartAddr (except when the thread has been blocked or preempted,
    in which case it calls the EntryPoint address). This element is usually provided
    by the RTOS.


    # 4.3.4.8 StaticTaskControlBlock


    The StaticTaskControlBlock contains the scheduling information for its corresponding
    AbstractThread object. This includes the priority of the thread, the default start
    address and the current entry address, if it was preempted or blocked prior to
    completion. The StaticPriorityScheduler maintains a StaticTaskControlBlock object
    for each existing AbstractThread. This element is usually provided by the RTOS.


    # 4.3.5 Consequences


    As previously mentioned, the Static Priority runs well with potentially large
    numbers of tasks and provides responsiveness to incoming events. Typically the
    tasks exist in waiting for initiation most of the time and become active only
    when an initiating event (such as the elapse of their period) occurs. Priority
    is only an issue when there is more than one task ready to run; in this case the
    highest priority task will be run preferentially.


    It is common to use blocking to serialize access to resources. While this is highly
    effective, naive implementation can lead to unbounded priority inversion in the
    manner described in the first section of this chapter. See the section on resource
    sharing patterns in this chapter for patterns to address this concern.


