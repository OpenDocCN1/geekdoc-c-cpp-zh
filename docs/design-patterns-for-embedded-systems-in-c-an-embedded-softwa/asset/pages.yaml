  md: '# Design Patterns for Embedding Concurrency and Resource Management 235


    # 4.8.4.3 Mutex


    This element is a normal mutex semaphore as used in previous patterns; it offers
    lock() and release() functions that work in the way standard for a mutex semaphore.


    # 4.8.4.4 QueryMutex


    This element is a normal mutex semaphore except that it also provides a tryLock()
    function for the general pattern case. This function works like the normal lock()
    function except that it returns with an error code the lock fails rather than
    blocking the current thread. In the specialized form of the pattern (in which
    a single resource is owned by a single ResourceMaster), then the tryLock() function
    isn''t needed.


    # 4.8.4.5 ResourceClient


    This element is a client that wants to access a set of resources at all to avoid
    potential deadlock. Although it has direct access (via its MultimasteredResource
    link) to the clients, it doesn''t access them until it has successfully received
    a lock on the ResourceMaster. This requires discipline on the part of the developers
    of the ResourceClients to ensure they never attempt to access any client services
    without first getting a lock, and once the client is done with the resources,
    it frees the ResourceMaster.


    # 4.8.4.6 ResourceMaster


    The ResourceMaster controls the lock of the entire set of resources. It is used
    in the general case of the pattern and must return a lock if and only if it can
    lock all the resources. While it can be implemented with mutexes solely on the
    parts (instances of ResourceMaster) because it may be blocked multiple times when
    it attempts to lock the set of individual MultimasteredResources, it may have
    unacceptable execution times in practice. A solution, implemented here, is to
    use the tryLock() function of the mutex to test. If the tryLock() calls for the
    entire set of MultimasteredResources to succeed, then the ResourceMaster itself
    is locked and the ResourceClient is allowed to use its link to the MultimasteredResources,
    then the ResourceMaster unlocks all of the MultimasteredResources it locked (before
    it found one where it failed), and returns with an error code to the ResourceClient.


    # 4.8.4.7 ResourceMasterSimplified


    The Simplified Locking Pattern doesn''t require the additional developer discipline
    required for the general case. The ResourceClient no longer has direct links to
    the MasterResources per se; instead, the ResourceMasterSimplified republishes
    all the services of its MasteredResources and delegates the functions directly
    to them. All of the functions share the same mutex.'
