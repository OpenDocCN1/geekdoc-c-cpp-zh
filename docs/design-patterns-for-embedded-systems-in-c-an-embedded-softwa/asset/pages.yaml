  md: '# 262 Chapter 5


    A transition is a path from state to another, usually initiated by an event of
    interest; it connects a predecessor state with a subsequent state when the element
    is in the state and receives the triggering event. Events of interest in Figure
    5-2 include the powerOn, timedCook, doorOpen, cancel, pause, resume, and tm (timeout)
    events. If an event occurs while the element is in a state that does not respond
    to that particular event, the event is "quietly discarded" with no effect – that
    is, state machines only make affirmative statements "When I am in this state or
    I''ll do this" not negative statements ("If I''m not in this state or if it doesn''t
    happen, I''ll do that\). Events not explicitly handled in a state are discarded
    should they occur when the element is in that state.


    The actual behaviors executed by the element are represented in actions. Actions
    may be associated with an entry state, exit from a state, a transition per se,
    or what is called an "internal transition" (we will get into this in more detail).
    Actions are specified in an action language, which will be for us C. Actions on
    Figure 5-2 initialize(), emitMicrowaves(), and timeCook=currentTime().


    Figure 5-4 shows the basic syntax for UML state machines. The rounded rectangles
    represent the states of the machine. The element remains in a state until a transition
    causes it to change state. Within a state, three annotations may be entry. Entry
    actions are the elements executed when the state is entered regardless of which
    transition was taken (it is possible to


