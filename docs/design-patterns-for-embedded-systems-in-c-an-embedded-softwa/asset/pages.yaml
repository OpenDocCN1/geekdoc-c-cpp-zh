  md: '# 312 Chapter 5


    to the appropriate event handler functions of the state class. In this way, polymorphism
    is addressed to support general event handling regardless of which is the current
    state.


    The actions of each state class normally a manipulation of the values owned by
    the Context. For this reason, each state class has an association (pointer) back
    to the Context to access those values. An alternative implementation, discussed
    later, is to pass the Context''s me pointer to each the state classes context-free.


    # 5.6.4.6 StateActionSet


    This class is key to implementing the required polymorphism. Each state class
    owns its own instance of this class in a variable aSet. Each event handler (and
    the entry and exit actions) have a pointer that will be dereferenced to the event
    handler for the current state. In this case, the handlers are either of type ActionPtr0
    (no parameters other than the pointer) or ActionPtr1 (one parameter like the me
    pointer). To implement events with other parameter lists, new action pointers
    must be created.


    This class has no behavior other than an initializer that sets all pointers to
    NULL initially. It is expected that the owner of each instance of the StateActionSet
    will set the function pointers to access the correct functions.


    # 5.6.4.7 TSTATYPE


    TSTATE is an enumerated type of the high state machine. Note that the nested state
    is flattened by removing nest. This greatly simplifies the state pattern implementation.
    The enumerated values for this type are:


    +   * NULL_STATE

    * NONNUMBER_STATE

    * GN_PROCESSINGWHOLEPART_STATE

    * GN_PROCESSINGFRACTIONALPART_STATE


    Where the GW_ prefix is a reminder that the last two states were nested states
    of the GotNumber state.


    # 5.6.5 Consequences


    This pattern localizes the behavior specific to a state to a single object, simplifying
    and encapsulating state-specific behavior. This means new states can be added
    by adding a new state class. New events are more work to add, since they must
    be at least added to the StateActionSet and usually to each state class as well.
    The State Pattern makes the transitions explicit by providing an event handler
    for each incoming event in each state class.


    This pattern uses more memory than a state table but simplifies the implementation
    by distributing the complexity among the various state objects.'
