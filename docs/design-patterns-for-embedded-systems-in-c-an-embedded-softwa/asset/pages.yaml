    # 5.2.4 Synchronous versus Asynchronous?


    A synchronous event is activated by a call to an operation on the target state
    machine and the caller waits (blocked) until the state machine completes its response
    to the event. In contrast, an asynchronous event is sent via a send-and-forth
    mechanism by the sender and the sender may continue on regardless of the actions
    of the target state machine.


    The state machine itself doesn''t care how the event arrives, but must handle
    the event in either case. This means to avoid race conditions, synchronous state
    machines must block callers (using the Guard Call or Critical Region Patterns
    of the previous chapter) and asynchronous state machines must use queuing to store
    their events until they can be handled. While a state machine can handle both
    synchronous and asynchronous events, a given state machine usually handles one
    or the other but not both to eliminate potential race conditions.


    We really want to be able to have the system respond in the same way to the sequence
    of events; such a system is to have deterministic semantics. There are couple
    of conditions under which determinism is threatened with which any good implementation
    of a state machine must deal.


    What should happen, for example, if a state machine is in the middle of executing
    an action and an incoming event occurs? Should the state machine stop immediately
    and handle the event? The answer, of course, is no. The state machine must be
    idle and waiting for events before handling a new one. Mealy-Moore state machines
    “handle” this by assuming that actions take zero time, a proposition that is not
    only false but also completes timing analysis. The UML has a different answer
    – run-to-completion semantics. That is, actions may take time, but any pending
    events must wait until the state machine has completed the entire exit action-transition
    action-entry action sequence. The problem is simplified if asynchronous events
    are used, since the delivery mechanism for the event can be triggered when the
    state machine enters a state. For synchronous events, the action sequence must
    block any attempt to invoke an event receiver until the action executions are
    complete.


    Let’s consider the basic elements of both synchronous and asynchronous state machines.


    For a synchronous state machine, the owning element of the state machine will
    provide one or more event handler functions. The most obvious way to handle the
    deterministic semantics problem is to lock the semaphore when the event receiver
    is called and unlock it when the event returns.'
