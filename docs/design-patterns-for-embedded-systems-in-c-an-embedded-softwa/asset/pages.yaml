  md: '# Design Patterns for Embedding Concurrency and Resource Management 227


    +   - void synchronize(void)

    This function is called when a task wants to synchronize. If the criteria are
    not met, the task is blocked in some way (see Implementation Strategies, below).
    This is commonly done either through the use of the Observer Pattern (see Chapter
    2) or the Guarded Call Pattern.


    The complexity of this class resides primarily in the synchronize() function;
    this evaluates the synchronization preconditions to see if they are met. These
    conditions may be internal (such as the Thread Barrier variant of the pattern
    used for the example) or external, or any combination of the two.


    It is important to note that the Rendezvous object itself doesn''t normally identify
    the threads as they rendezvous; as far as the Rendezvous object is concerned the
    threads are anonymous. If they are not, as when the strategy allows for tasks
    to rendezvous in a specific order, then the synchronize() function can accept
    that information in the form of one or more parameters.


    # 4.7.4.2 Semaphore


    This is a normal counting semaphore. The semaphore provides the following operations:


    +   - Semaphore* create_semaphore(void)

    - destroy_semaphore(Semaphore*)

    - lock_semaphore(Semaphore*)

    - release_semaphore(Semaphore*)


    # 4.7.4.3 SynchronizingThread


    This element represents a thread that uses the Rendezvous object for synchronization.
    It will run until its synchronization point and then call synchronize() function.


    There are a number of ways to implement the pattern that result in minor changes
    to the parameters and return types for the pattern elements.


    # 4.7.5 Consequences


    In this pattern, two or more tasks can be synchronized by any arbitrarily complex
    strategy that can be encoded in the Rendezvous class. The pattern itself is simple
    and flexible and lends itself to specialization and adaptation.


    The pattern is most appropriate when the tasks must halt at their synchronization
    point; that is, the pattern implements a blocking rendezvous. If a nonblocking
    rendezvous is desired, then this pattern can be mixed with a Queuing Pattern or
    the Observer Pattern with callbacks to a notify() function within the SynchronizingThread.'
