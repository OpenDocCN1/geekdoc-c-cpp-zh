    \ 3-10: RobotArmManager.c\n\n# 3.5 Observer Pattern\n\nThe Observer Pattern is\
    \ one of the most common patterns around. When present, it provides a means for\
    \ objects to “listen” in others while requiring no modifications whatsoever to\
    \ the data servers. In the embedded domain, this means sensor data can be easily\
    \ shared to elements that may not exist when the sensor probes are written.\n\n\
    # 3.5.1 Abstract\n\nThe Observer Pattern (also known as the “Publish-Subscribe\
    \ Pattern”) provides notification to a set of interested clients that relevant\
    \ data have changed. It does this without having any a priori knowledge about\
    \ its clients. Instead, the clients simply offer a subscription function that\
    \ allows clients to dynamically add (or remove) themselves to the notification\
    \ list. The data server can then enforce whatever notification policy it desires.\
    \ Most commonly, data are sent whenever new data arrive, but clients can be updated\
    \ periodically,"
