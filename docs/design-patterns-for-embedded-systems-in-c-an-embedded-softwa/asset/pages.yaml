    # 4.7.1 Abstract


    A precondition is something that is specified to be true prior to an action or
    activity. A precondition is a type of constraint that is usually generative, it
    can be used to generate code either to force the precondition to be true or check
    that a precondition is true.


    The Rendezvous Pattern is concerned with modeling the preconditions for synchronization
    or rendezvous threads as a specific object with all thread functions. It is a
    general pattern and easy to ensure that arbitrarily complex sets of preconditions
    can be met at runtime. The basic behavioral model is that all threads become ready
    to rendezvous, it registers with the Rendezvous class, and then blocks until the
    Rendezvous'
