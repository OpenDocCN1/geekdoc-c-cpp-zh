  md: '# 6.4.2 Problem


    The most common idiom for error checking of data ranges in C is for functions
    that have no other return value: return a 0 value for function success and a -1
    value for failure and return errno to an error code.


    The problem is, of course, the most common way to “handle” the return values is
    to ignore them, resulting in difficult-to-debug systems. Some people put error
    checking into the system during development but remove such checks in the final
    release. I would argue that the time when you really want to know the altitude
    determination program in your aircraft isn’t producing the right value is when
    you are in the flying aircraft.


    The problem this pattern addresses is to build functions and data types that essentially
    themselves and provide error detection methods that cannot be ignored.


    # 6.4.3 Pattern Structure


    As mentioned above, this pattern falls into the idiomatic (tiny pattern) range
    rather than a collaboration pattern. The key concepts of the pattern are to 1)
    build self-checking types whenever possible; 2) check incoming parameter values
    for appropriate range checking; and 3) check consistency and reasonableness among
    one or a set of parameters. Figure 6-6 shows the structure of the pattern.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_401_0.png)


    Figure 6-6: Smart Data Pattern'
