    Figure 4-17: Queuing Pattern


    # 4.6.3 Pattern Structure


    The Queuing Pattern structure is shown in Figure 4-17. The QUEUE_SIZE declaration
    determines the maximum number of elements that the queue can retain. Care must
    be taken to ensure that this is large enough to handle the worst-case situation
    for your system usage, while not being so large as to waste memory.


    # 4.6.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 4.6.4.1 Message


    The Message class is an abstraction of a message of relevance between QTasks.
    It can be anything from a simple data value to an elaborate datagram structure
    as used in TCP/IP messaging.


    # 4.6.4.2 MessageQueue


    The MessageQueue is the storage of information being exchanged between QTasks.
    The MessageQueue can store up to a maximum of QUEUE_SIZE elements. The MessageQueue
    provides the following methods:


    +   - int MessageQueue_getNextIndex(MessageQueue* me, int index)

    - A private (static) function that uses modulo arithmetic to compute the next
    valid value.'
