    \ c\n\n# 6.4 Smart Data Pattern\n\nOne of the biggest problems I see with embedded\
    \ C code in actual application is that functions all have preconditions for their\
    \ proper execution but these functions don't explicitly check that those preconditions\
    \ are actually satisfied. This falls under the heading of what is commonly known\
    \ as “defensive design”– a development paradigm in which we design proactive run-time\
    \ defenses in place to detect problems. The Smart Data Pattern codifies that paradigm\
    \ for scalar data elements.\n\n# 6.4.1 Abstract\n\nOne of the reasons that languages\
    \ like Ada are considered “safer” than C is that they have run-time checking.\
    \ These checks include array index checking, definition of subtypes and subranges\
    \ (such as defining a subtype Color to not only limited to a set of colors that\
    \ generate errors if range is exceeded), and parameter range checks. Indeed the\
    \ C++ language is not inherently “safe” by this standard, because data structures\
    \ may be bound together with operations that provide run-time checking, it can\
    \ be made “safe” by intention not by default. This pattern, although landing more\
    \ within the accepted range of “idiom” rather than “pattern,” addresses those\
    \ concerns by creating C classes that explicitly perform these checks.\n\n> Using\
    \ the term loosely and not the precise sense defined in this chapter."
