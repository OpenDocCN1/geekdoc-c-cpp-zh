  md: '# 112 Chapter 3


    or with a minimum or maximum frequency. This reduces the computational burden
    on the clients to ensure that they have timely data.


    # 3.5.2 Problem


    In a naive situation, each client can request data periodically from a data server
    in case the data have changed, which is wasteful of compute and communication
    resources as the clients generally cannot know when data are available. If the
    data server pushes the data out, then it must know all of its clients are, breaking
    the basic rule of client-server relations¹³ requiring changes to the server to
    add new clients.


    The Observer Pattern addresses this concern by adding subscription and un services
    to the data server. A client can dynamically add itself to the notification list
    without a priori knowledge of the client on the part of the server. On the server
    side, the server can enforce the appropriate update policy to the notification
    of its interested clients. In addition, the pattern allows dynamic modification
    of subscriber lists and adds a great degree of flexibility to the software.


    # 3.5.3 Pattern Structure


    Figure 3-8 shows the basic structure of the pattern. The AbstractSubject is the
    data server plush to maintain a list of interested subscribers. A client adds
    itself to the notification list by passing a pointer to an accept(Datum) function
    and removes itself by calling unsubscribe with the same pointer. When the AbstractSubject
    decides to notify its clients, the notify(f) function works through the client,
    calling the pointed-to-function and passing the relevant data. The AbstractClient
    provides the accept(Datum) function to receive and process the incoming data.


    # 3.5.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 3.5.4.1 AbstractClient Interface


    The AbstractClient associates with the AbstractSubject so that it can invoke the
    latter''s various services. It contains an accept(Datum) function to be called
    when the AbstractClient subscribes as well as whenever the AbstractSubject thinks
    it is appropriate to send data. The AbstractClient is abstract in the sense that
    it specifies the functions, it does not provide any implementation. It is realized
    by a set of ConcreteClients that provide implementation that does with the received
    data.


    In addition to the accept(Datum) function, the AbstractClient associates with
    the data. This is normally realized with a pointer but it can also be a stack,
    global, or static variable.


    > ¹³ That is, the clients know about the server but the server doesn''t know who
    its clients are.'
