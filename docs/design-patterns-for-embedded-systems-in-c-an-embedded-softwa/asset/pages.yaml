    \nAnother common pattern for getting sensor data or signals from hardware is to\
    \ check periodically, a pattern known as polling. Polling is useful when the data\
    \ or signals are not urgent that they cannot wait until the next polling period\
    \ to be received or when the hardware isn't capable of generating interrupts when\
    \ data or signals become available.\n\n# 3.8.1 Abstract\n\nThe Polling Pattern\
    \ is the simplest way to check for new data or signals from the hardware. Polling\
    \ can be periodic or opportunistic; periodic polling uses a timer to indicate\
    \ when the hardware should be sampled whereas opportunistic polling is done when\
    \ it is convenient for the system, such as between major system functions or at\
    \ point in a repeated execution cycle. Opportunistic polling is, by definition,\
    \ less regular but has less impact on the timeliness of other activities in which\
    \ the system may be engaged.\n\n# 3.8.2 Problem\n\nThe Polling Pattern addresses\
    \ the concern of getting new sensor data or hardware signals into the system as\
    \ it runs when data or events are not highly urgent and the time between data\
    \ sampling can be guaranteed to be fast enough.\n\n# 3.8.3 Pattern Structure\n\
    \nThis pattern comes in two flavors. Figure 3-17 shows the pattern structure for\
    \ opportunistic polling while Figure 3-18 shows the pattern for periodic polling.\
    \ The difference is that in the former pattern the applicationFunction will embed\
    \ calls to poll() when convenient, and in the latter, a timer is created to start\
    \ polling.\n\n# 3.8.4 Collaboration Roles\n\nThis section describes the roles\
    \ for both variants of this pattern."
