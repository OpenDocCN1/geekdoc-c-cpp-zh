- img_proc: true
  md: '# 1.3.1.3 Composite State


    A state that contains nested states. These may be OR-states (as in Figure A-5
    and Figure A-6) or AND-states (as in Figure A-7).


    # 1.3.1.4 OR-State


    A set of states at a given level of abstraction; the semantics of state machines
    are that at a given level of abstraction, the state machine must be in exactly
    one of its OR-States. In Figure A-5, state_0 and state_1 are OR-states; similarly,
    NestedState1 and NestedState2 are OR-states.


    # 1.3.1.5 AND-State


    AND-states are orthogonal regions within a composite state with the semantics
    that the instance must be in exactly one AND-state in each orthogonal region.
    AND-states are indicated with a dashed line in the composite state. While it is
    theoretically possible to implement AND-states in separate threads, this is almost
    never done. If an event is shared between AND-states, each AND-state must be allowed
    to independently act on it or reject it, but the order of execution of the transitions
    triggered by the same event is not known in principle. This leads to the possibility
    of race conditions.


    If you look at Figure A-7, the transition from state_0 to state_1 is triggered
    by the event1. In this case, the instance enters both states UpperState and LowerState3;
    the instance is in both states at the same time. AND-states are most commonly
    used to model independent properties of an instance.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_451_0.png)'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# 432 Appendix A


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_452_0.png)


    Note also in the figure the transition from state_1 to state_0 triggered by the
    event evGoBack. In this case, it doesn''t matter which combination of nested states
    is currently true; as long as the instance is in state_1, the transition is valid.
    However, in the event from nested LowerState3 to state_2, triggered by event10,
    which nested state in ANDStateRegion1 is true doesn''t matter, the instance must
    be currently in LowerState3 state for that transition to be taken. If it is not,
    then the event is discarded.


    # 1.3.1.6 Transition


    A transition is a representation of a response to an event while the instance
    is in a specified state. It typically has an event signature consisting of an
    event trigger, guard, and list of actions, specified using the following syntax:


    ```

    event trigger ''['' guard condition '']'' / ''/'' action list

    ```


    All of the fields in the event are optional. A transition is shown on a state
    machine as an arrowed line coming from a predecessor state and terminating on
    a subsequent state.


    If the event-trigger is omitted, the transition ''fires'' as soon the predecessor
    state is entered, that is, as soon as the entry actions of the predecessor state
    complete. See Figure A-7 for an example.'
  merge: -1
  pgno: 452
- img_proc: true
  md: '# 1.3.1.7 Action


    An action is a primitive behavior performed under some circumstance in a state
    machine. This is most often one of the following:


    +   - A function call, for example foo(x)

    - A direct primitive action, such as x += 10

    - The generation of an event sent to the current instance or another instance
    known to the current instance; a common way to indicate this is with a GEN(event)
    macro

    - A list of actions


    Actions are separated from the rest of the event signature with a slash (''/'').


    # 1.3.1.8 Entry Action


    An entry action is an action performed whenever a state is entered regardless
    of which transition is taken.


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_453_0.png)'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# Appendix A


    # ### 1.3.1.9 Exit Action


    An exit action is an action performed whenever a state is left, regardless of
    which transition is taken.


    # ### 1.3.1.10 Transition Action


    A transition action is an action performed only when a specific transition is
    taken.


    # ### 1.3.1.11 Internal Transition


    An internal transition is when an action is performed when an event occurs but
    a state transition is not taken (that is, the exit and entry actions are not performed).


    # ### 1.3.1.12 Event


    An event is a specification of an event of interest that is received by the instance.
    It may be received synchronously or asynchronously. It may carry parameters, just
    like a function call. The syntax used here that the event carries data put into
    a `struct params`. This struct must be dereferenced to access the data. For example,
    in Figure A-6, the `evTerminate` event carries a data element code. The actions
    in the state machine access the parameter by dereferencing the `params struct`.


    Events may trigger a transition or an internal transition; if they do not, events
    are quietly discarded with no actions taken.


    An event is consumed by the state machine; that is, once the state machine has
    completed its processing step for the current event, it is destroyed. If the newly
    assumed state has an event triggered by the same event, the event must occur again
    for this transition to be taken.


    # ### 1.3.1.13 Trigger


    The trigger is the specification of an event. This may be asynchronous (which
    requires event queuing), synchronous (usually indicated with a `tm(duration)`
    or `after (duration)` syntax), or when a state is changed.


    # ### 1.3.1.14 Guard


    A guard is an (optional) Boolean expression. If the guard evaluates to `TRUE`,
    then the transition is taken; if it evaluates to `FALSE`, the event is discarded
    and the transition is not taken.


    # ### 1.3.1.15 Default Transition


    The default transition indicates that at a level of abstraction, which, among
    a set of states, is entered first by default. It is shown as a transition with
    no event trigger or guard (although it may have actions) terminating on a state,
    but beginning on one.


    # ### 1.3.1.16 Pseudostate


    A pseudostate is a perhaps poorly-named annotation of special semantics. The UML
    defines many pseudostates. In this limited description, pseudostates include the
    default transition, conditional, fork, join, and terminal pseudostates.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# UML Notation 435


    # 1.3.1.17 Conditional Pseudostate


    The conditional pseudostate indicates multiple potential outgoing transitions
    initiated by a single event with the proviso that only one such path will actually
    be taken. The different paths are selected on the basis of guards; that is, each
    transition segment will have a guard that will be evaluated to TRUE or FALSE.
    If multiple transition segment guards evaluate to TRUE, then any one of the true
    paths can be taken. If no guards evaluate to true then the event is discarded
    and no transition is taken. A special guard “else” is provided; if present, this
    transition path will be taken only if all the other transition segments are rejected.


    # 1.3.1.18 Fork


    When entering a composite state with nested AND-states, a fork can be used to
    specify nondefault states to enter, as in Figure A-7. The event event2 triggers
    the transition from state_4 to state_1, but specifically enters nested AND-states
    UpperState2 and LowerState, bypassing the default states of UpperState and LowerState3.


    # 1.3.1.19 Join


    When leaving a composite state with nested AND-states, a join can be used to state
    the precondition that the transition should only be taken if the specific set
    of states (one AND-state) is true when the event occurs. See Figure A-7.


    # 1.3.1.20 Terminal Pseudostate


    The terminal pseudostate is a special indicator that means the instance no longer
    accepts events, usually because the instance is about to be destroyed.'
