  md: '# 362 Chapter 6


    # 6.2 One''s Complement Pattern


    The One''s Complement Pattern is useful to detect when memory is corrupted by
    outside

    influences or hardware faults.


    # 6.2.1 Abstract


    The One''s Complement Pattern provides a detailed design pattern for the identification

    of single or multiple bit corruption. This can occur due to EMI (Electromagnetic

    interference), heat, hardware faults, software faults, or other causes. The pattern

    works storing critical data twice — once in normal form and once in one''s complement

    (bit-wise inverted) form. When the data are read, the one''s complement form is
    reinverted and

    then compared to the value of the normal form. If the values match, then that
    value is

    returned, otherwise error processing ensues.


    # 6.2.2 Problem


    This pattern addresses the problem that variables may be corrupted by a variety
    of causes

    as environmental factors (e.g., EMI, heat, radiation), hardware faults (e.g.,
    power fluctuation,

    memory cell faults, address line shorts), or software faults (other software erroneously
    mod-

    ifying memory). This pattern addresses the problem of identifying data corruption
    for small sets

    of critical data values.


    # 6.2.3 Pattern Structure


    The basic pattern structure is shown in Figure 6-2. Since this is a detailed design
    pattern, then

    scope is primarily within a single class.


    # 6.2.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 6.2.4.1 DataClient


    The DataClient is an element that sets or retrieves the value of the datum.


    # 6.2.4.2 OnesCompProtectedDataElement


    The OnesCompProtectedDataElement is the class that combines the storage of the
    data

    services that can detect bit-level data corruption. This class stores the values
    of the data

    tice; once in regular form and as a bit-wise complement. When data are retrieved,

    inverted data are reinverted and compared to the value stored normally. If the
    values match, that

    value is returned; if not, the class provides a function to handle the error.
    The actual behavior of

    of error handler is system- and context-specific.'
