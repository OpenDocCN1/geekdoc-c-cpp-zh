    # 6.7.2 Problem


    This pattern provides protection against single-point faults (either failures
    or both failures

    errors, depending on the specific subpattern selected). Depending on pattern,
    the system

    detect a fault in one channel by comparing it to the other and then transition
    to the fault-

    safe state OR may use other methods to detect the fault in one channel and switch
    to the other

    when a fault occurs.


    # 6.7.3 Pattern Structure


    Figure 6-13 shows the basic structure for the pattern.


    Figure 6-14 shows the detailed internal structure within the pattern. It is almost
    exactly

    what appears in the Protected Single Channel Pattern, with the exception of association

    from the `ConcreteTransformChecker` to the current and alternative channel.

    Note that the `itsChannel` association to the current channel that owns the

    `ConcreteTransformChecker` instance while the `itsOtherChannel` points to the
    alter-

    ative channel. This allows the checker to disable the current channel and enable
    the alternative

    channel.


    # 6.7.4 Collaboration Roles


    This section describes the roles for this pattern. Note that the roles are internal
    to the pattern

    can be seen in the previous section on the Protected Single Channel Pattern.


    # 6.7.4.1 AbstractTransform


    This class is a placeholder for one of several possible `ConcreteDataTransforms`.
    In an

    object-oriented language or implementation, true generalization can be used in
    C, it is more

    common to use this as a conceptual notion to get the intent than drive the implementa-

    t. It has two optional$^{12}$ associations. One is to itself — that is, the next
    transformation in the

    list. The other is to output `ActuationDeviceDriver` – this is in lieu of the
    other

    association. Another way, the `AbstractDataTransform` has a link to the next processing

    step in the chain or to the output driver, but not both.


    This class also an optional link to `AbstractTransformChecker` for points in the
    transfor-

    mation where checking is appropriate.


    # 6.7.4.2 AbstractTransformChecker


    This is a placeholder for an element that can check on the validity of the processing
    or data in

    its current state.


    > $12}$ Common implementation is a pointer, set to NULL if the link isn''t active.'
