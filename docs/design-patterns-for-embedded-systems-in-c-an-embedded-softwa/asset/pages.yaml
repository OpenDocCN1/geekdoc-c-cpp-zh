    # 5.6.4.2 ActionPtr


    This type is a pointer to a function that takes 1 parameter of type char in addition
    to the obligatory me object pointer and returns an int. The value of the return
    is 0 (event discarded) or 1 (event handled).


    # 5.6.4.3 Context


    The Context is the class that owns the state machine and has the data manipulated
    by the actions. It implements a stateList as an array of pointers to the state
    classes and a currentState variable that indicates which of the current states
    is active. While the structure of the state classes is all the same (in terms
    of the struct), the elements of the stateList array can be typed as pointers to
    one of them.


    The Context provides a set of event handlers similar to the Multiple Event Receptor
    Pattern. The implementation of each event handler delegates the event handling
    to the current state object, which is free to act on, or discard the event as
    appropriate. If it handles the event, the state object will update the Context''s
    currentState variable; once the event handler returns (and if it handled the event),
    the Context will execute the entry actions of the new state.


    During initialization, the Context creates each of the state objects, puts it
    in the stateList, and then enters the initial state.


    # 5.6.4.4 Mutex


    The Mutex ensures the deterministic run-to-completion semantics of transitions
    by preventing other clients from interrupting the state machine execution of an
    action sequence. This is accomplished by locking the semaphore before the event
    is processed and releasing it once the transition processing is complete.


    # 5.6.4.5 State Classes


    The state classes implement one of the states of the Context and implement all
    of the event handlers. The event handlers return 1 if they handled the event and
    0 if they discarded the event. If it handles the event, the event handler is expected
    to execute the exit actions of the current state, then the transition actions,
    and finally the Context''s currentState to the new state. The entry actions of
    the new state will be executed by the Context after the return of the state object''s
    event handler. The state classes are:


    +   - NoNumberState


    +   - GN_ProcessingFractionState


    +   - GN_ProcessingWholeState


    Each event handler may have additional helper functions invoked by its event handlers,
    particularly for the transition actions, in addition to the entry and exit actions.


    Each state object has an instance of the StateActionSet class that implements
    function pointers to each of the event handlers. During the state object''s initialization,
    these function pointers are set'
