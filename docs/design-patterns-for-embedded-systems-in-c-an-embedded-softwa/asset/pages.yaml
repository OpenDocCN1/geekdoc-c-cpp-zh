    \ 4-30: FlightDataDisplay.c\n\n# 4.6 Queuing Pattern\n\nThe Queuing Pattern is\
    \ the most common implementation of task asynchronous communication. It provides\
    \ a simple means of communication between tasks that are uncoupled in time. The\
    \ Queuing Pattern accomplishes this communication by storing messages in a queue,\
    \ a nominally first-in-first-out data structure. The sender deposits a message\
    \ in the queue and some later time, the receiver withdraws the message from the\
    \ queue. It also provides a simple means of serializing access to a shared resource.\
    \ The access messages are queued and handled at a later time and this avoids the\
    \ mutual exclusion problem common to shared resources.\n\n# 4.6.1 Abstract\n\n\
    The Queuing Pattern uses asynchronous communications, implemented via queued messages,\
    \ to synchronize and share information among tasks. This approach has the advantage\
    \ of simplicity and do not experience mutual exclusion problems because no resource\
    \ is shared by reference. Any information shared among tasks is passed by value\
    \ to the separate thread. While this limits the complexity of the collaboration\
    \ among the tasks, this approach in its pure form is immune to the standard resource\
    \ contention problems that plague concurrent systems that share information passed\
    \ by reference. In passed value, a copy of the information is made and sent to\
    \ the receiving thread for processing. The receiving fully owns the data it receives\
    \ and may modify them freely without concern for corrupting data due to multiple\
    \ writers or sharing them among a writer and multiple readers. A downside of the\
    \ pattern is that the message isn't processed immediately after the sender posts\
    \ it; the queue waits until the receiver task runs and can process the waiting\
    \ messages.\n\n# 4.6.2 Problem\n\nIn multithreaded systems, tasks must synchronize\
    \ and share information with others. Two primary things must be accomplished.\
    \ First, the tasks must synchronize to permit sharing of the information. Secondly,\
    \ the information must be shared in a way that there is no chance of corruption\
    \ or race conditions. This pattern addresses such task interaction."
