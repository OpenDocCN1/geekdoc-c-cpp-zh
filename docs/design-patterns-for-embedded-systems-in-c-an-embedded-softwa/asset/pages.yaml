    In general, a MultimasteredResource can be a part of any number of different sets
    of resources, where a separate instance of ResourceMaster manages one set. The
    potential sharing of resources across multiple ResourceMasters complicates the
    situation. When this flexibility is not needed, the situation simplifies to that
    shown in Figure 4-24. While the difference may not appear to be great, it removes
    the Mutex and the requirement for a tryLock() function on it is algorithmically
    much simpler.


    # 4.8.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 4.8.4.1 MasteredResource


    This class is an element of the Simplified Simultaneous Locking Pattern. It represents
    a shared resource that is owned by a single instance of ResourceMasterSimplified.
    If it can be determined that MasteredResource can be uniquely assigned to a set
    controlled by a single instance of ResourceMasterSimplified, life is much simpler;
    in this case the resource does not need its own Mutex because it will execute
    under the auspices of the Mutex of the ResourceMasterSimplified. If the resource
    must be shared in multiple resource groups, then it becomes a MultimasteredResource,
    which is part of the more general pattern.


    # 4.8.4.2 MultimasteredResource


    This class is an element of the general Simultaneous Locking Pattern. It is managed
    by multiple ResourceMasters, then it requires its own mutex (via its like itsPartMutex).
    The Mutex it uses must provide the tryLock() function so that it can be determined
    by the ResourceMaster whether all the attempted locks will succeed or fail.'
