    # 1.1.6 Debugging and Testing


    The Prussian generation von Clausewitz wrote “Everything in war is very simple,
    but the simplest thing is very difficult¹⁰.” He might have well said it about
    software!


    The simplest thing that is very difficult about software isn’t writing the software
    – it’s writing the right software with the right functionality. The state of the
    art in developing defect-free software is an agile practice known as test-driven
    development (TDD). In TDD, the unit tests for a piece of software are written
    simultaneously with, or even slightly before, the software will verify. All commonly,
    unit testing is skipped entirely or performed too late to have any beneficial
    effect on the software.


    There are many kinds of unit tests that can be applied to software in general
    and embedded software in particular. These include:


    +   - Functional – tests the behavior or functionality of a system or system element

    - Quality of Service – tests the “performance” of a system or system element,
    against its performance requirements

    - Precondition tests – tests that the behavior of the system or system element
    is correct in the case that the preconditions invariants are met and in the case
    that the preconditions invariants are violated

    - Range – tests values within a data range

    - Statistical – tests values within a range by selecting them stochastically from
    a probability density function (PDF)

    - Boundary – tests just at the edges of, just inside, and just outside a data
    range

    - Coverage – tests that all execution paths are executed during a test suite

    - Stress – tests data that exceeds the expected bandwidth of a system or system
    element

    - Volume – also known as “load testing” – tests the system with large amounts
    of data that meet or exceed its design load

    - Fault Seeding – tests in which a fault is intentionally introduced to the system
    to ensure the system handles it properly

    - Regression tests – normally a subset of previously passed tests to ensure that
    modification to a system did not introduce errors into previously correctly functioning
    systems


    In a desktop system, unit testing software with test cases that explore all of
    these concerns are rare (and difficult) enough. When you embedded software on
    a less-accessible


