    # 2.1.5.4 An Example: The Observer Pattern


    Let''s consider a simple example. Figure 2-8 shows a system that contains an ECG
    module source pipes data into a queue for consumption by number of different clients.
    The data include both a time marker (of type long) and the dataValue, a measurement
    of the potential difference between the selected ECG lead pair. The queue is known
    as a “leaky queue” in that data are never explicitly removed from the circular
    buffer, but are overwritten by the buffer inserts wraparound to the start of the
    queue.


    The source code for a simple implementation of the elements is straightforward.
    ECGPkh.h header file defines the queue size and the boolean type.


