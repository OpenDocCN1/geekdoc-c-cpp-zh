  md: '# 418 Chapter 6


    # 6.7.7.2 Heterogeneous Redundancy Pattern


    Description


    This pattern uses dual channels of different designs or different implementations
    to address both random and systematic faults. The system can continue to deliver
    services in the presence of a fault, provided that the fault is properly isolated
    within a single channel. Typically, sensors and actuators are replicated to provide
    fault isolation, and often processors, memory, and other hardware must be replicated
    as well as providing multiple (different) implementations of the same software
    functionality.


    Consequences


    This pattern has a relatively high recurring cost (cost per shipped item) and
    a relatively high design cost (since each channel must be designed). Typically,
    sensors and actuators are replicated to provide fault isolation, and often processors,
    memory, and other hardware must be replicated in addition to the software functionality.
    Note that this pattern variant addresses both random and systematic faults, although
    Nancy Leveson notes that there is some correlation between errors in diverse implementations¹³


    # 6.7.7.3 Triple Modular Redundancy (TMR) Pattern


    Description


    This pattern uses three channels of identical designs to address both faults.
    The theory of use is that if there is a single-point fault then one of the channels
    will disagree with the other two and the outlier is discarded. The voting mechanism
    (the ChannelArbiter) is designed to "fail on" at least one channel (it doesn''t
    matter which) will result in an output if the voting mechanism fails. The system
    can continue to deliver services in the presence of a fault, provided that the
    fault is properly isolated within a single channel. Typically, sensors and actuators
    are replicated to provide fault isolation, and often processors, memory, and other
    hardware must be replicated as well as providing multiple (different) implementations
    of the same software functionality.


    Consequences


    This pattern has a very high recurring cost because the channel must be replicated
    three times. If all the channels have the same design (most common), then the
    design cost is relatively low; the only additional cost is the ChannelArbiter
    used to reject the outlier output. If the channels are of different designs, then
    the cost of this pattern variant is very high since each channel must be designed
    three times. This is a very common pattern in avionics.'
