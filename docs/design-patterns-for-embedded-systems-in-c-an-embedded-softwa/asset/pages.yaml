  md: '# 6 Chapter 1


    on small 8-bit processors with only a few kilobytes of memory – too little for
    a standard RTOS. Many RTOSs support a scalable set of services (based on the Microkernel
    Architecture Pattern)⁵ by degree of fidelity that scalability may not meet the
    needs of a tightly-constrained application.


    Some systems having too few resources to support both an RTOS and the actual application
    software opt to go bareback—that is, function without a commercial or proprietary
    RTOS at all. This means that the application code itself must replicate any RTOS
    services or functionality needed by the application. With the drop in hardware
    costs, systems formerly done with 8-bit processors have moved up to 16- and 32-bit
    processors. This is needed to add the additional complexity of behavior required
    in modern embedded devices and is enabled by the lower recurring costs of parts
    and manufacturing.


    For very simple embedded systems, there may be no explicit operating system functionality
    at all. The application may be a set of interrupt handlers that communicate via
    a shared resource scheme such as queuing or shared memory. Alternatively, a simple
    task implementation of a cyclic executive might suffice. Somewhat more complex
    systems may introduce operating system features such as task or management as
    they need.


    From one point of view, an operating system is an integrated set of design patterns
    that provides certain kinds of services and resources to applications. Chapter
    3 in this book discusses patterns for accessing hardware resources, such as timers
    and memory while Chapter 4 focuses on ways of managing concurrency in your embedded
    system.


    # 1.1.4 Embedded Middleware


    Middleware is software that connects components together in some way. Middleware
    is a term dates back to the 1968 NATO Software Engineering Conference⁶ Like operating
    systems, there is commercial support for middleware, but in small systems it may
    be developed as part of the application software. The most common middlewares
    for real-time and embedded systems include Common Object Request Broker Architecture
    (CORBA) and many variants, and the Data Distribution Service (DDS). Both these
    middleware architectures are based on standards published by the Object Management
    Group (OMG)⁷. In case of CORBA, there are many specialized variant standards from
    which to include Real-Time CORBA, Embedded CORBA, and Minimum CORBA.


    As you might guess, middleware is appropriate for larger-scale embedded applications
    – those consisting of multiple software components or applications that may be
