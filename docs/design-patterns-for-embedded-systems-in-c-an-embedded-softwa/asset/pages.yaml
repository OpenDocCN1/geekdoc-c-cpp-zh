    # 5.3.5 Consequences


    This pattern provides a straightforward state machine implementation easily adapted
    to either synchronous or asynchronous state machine event passing. The fact that
    all the state logic is encapsulated within a single event receiver limits the
    scalability of the approach.


    # 5.3.6 Implementation Strategies


    It should be noted that one way of implementing this pattern is by simply taking
    a Multiple Event Receiver Pattern and adding a single publicly available receiver
    (to be invoked by clients) that calls the multiple event receivers already. You''ll
    still need to create the abstract event type to be passed into the single event
    receiver. This is one way to take a synchronous state machine done using pattern
    and enabling it to be used in an asynchronous way — add an event queue, a polling
    mechanism to look for new events, a single event receiver and you can use it without
    modification.


    A more common implementation of the Single Event Receiver Pattern is to encode
    all the logic in a big switch-case statement within the single event receiver.


    # 5.3.7 Related Patterns


    The synchronous version of the pattern uses the Guarded Call Pattern (see Chapter
    4) to ensure deterministic run-completion of transitions while the asynchronous
    version uses the Queuing Pattern. The Critical Region Pattern can be used instead
    for either synchronous or asynchronous machines to ensure the run-to-completion
    semantics.


