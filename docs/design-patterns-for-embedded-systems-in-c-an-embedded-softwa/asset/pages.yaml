  md: '# Safety and Reliability Patterns 397


    “fault-safe state.” The drawbacks of using the pattern are the extra memory (both
    code and data), processing time, and hardware required, depending on the specific
    usage of the channel.


    # 6.5.6 Implementation Strategies


    As mentioned, the pattern may be implemented with true generalization but it is
    more common in C to think of the AbstractDataTransformation as a placeholder for
    some particular ConcreteDataTransform class; the links are from different types
    of ConcreteDataTransform classes that perform some special step in the overall
    transformation function.


    Data are processed using one of two primary strategies. The simplest is to acquire
    a datum and pass it through the series of transformations and out to the actuator
    acquiring the next. In higher bandwidth applications multiple instances of the
    data may be present in the channel at the same time, one instance per transform,
    with data passed from one transform to the next at the same time as all the other
    data instances.


    # 6.5.7 Related Patterns


    This pattern provides medium- to large-scale redundancy. It is the basis for many
    other patterns including the Protected-Channel Pattern and Homogeneous Redundancy
    Pattern discussed later in this chapter. Other patterns include Triple Modular
    Redundancy (TMR) Pattern, in which three channels run in parallel and vote on
    the outcome, and the Sanity Check Pattern in which a primary channel is checked
    for readiness by a lighter-weight secondary channel. A number of such patterns
    are discussed in Real-Time Design Patterns: Robust Scalable Architecture for Real-Time
    Systems (Addison-Wesley, 2002).


    # 6.5.8 Example


    I will provide a relatively simple example of the use of the pattern. The classes
    shown in Figure 6-9 implement a simple electromyography biofeedback device. It
    works by measuring the voltage across two electrodes placed on the skin over a
    muscle. As muscle tension changes, the voltage potential between the electrodes
    changes. This is gathered (as an int) by the SensorDriver. It is converted into
    a frequency by the first data transformation class; this is done by taking a set
    of samples and computing the frequency of those data. This results in a computed
    frequency that is then filtered with a moving average filter; this is a filter
    that smoothes out rapid frequency changes by averaging the change over several
    (frequency) data samples sequentially in time. Lastly, the filtered frequency
    is converted into a pleasing color (specified via RGB values) and this color is
    sent to the light device driver.'
