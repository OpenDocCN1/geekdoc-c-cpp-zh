  md: '# 64 Chapter 2


    it is time to pull the data from the queue and do their work. In this case, the
    TMDQueue is the server of the data for the clients, and the WaveformDisplay, HistogramDisplay,
    QRSDetector, and ArrythmiaDetector are the clients.


    We have a functioning model (with functioning code) for the system. Let''s now
    think about how we''d like to optimize the system. In this case, we''d optimize
    execution time because we''d free to use up processors for other work. In addition,
    we''d like to optimize maintainability of the system, limiting the number of places
    we''d like to make changes to the system when it needs to be updated. We''d also
    like to free to dynamically (at run-time) vary the number of clients without wasting
    extra memory by allocating a potentially large array of pointers (per client)
    that might never be used. So our design criteria (with scaled criticality weights):
    1) execution efficiency (weight=7), 2) maintainability (weight=5), 3) flexibility
    to add new clients at run-time (weight=4), and 4) memory efficiency at the larger
    scale (weight=7). Let''s consider three alternative strategies (design patterns).


    First, we have the current client-server approach:


    +   1. Execution efficiency


    This solution is not particularly optimal the clients need to check frequently
    if there are new data, even if there are not. On a scale of 0 to 10, let''s call
    that a 3. This is the primary weakness of the approach.


    +   2. Maintainability


    In a classic client-server architecture, the clients know about the servers (so
    they can invoke the services) but the servers don''t know about the clients. That
    limitation on knowledge makes the system more maintainable because knowledge is
    encapsulated in one place. It earns a score of 7 here.


    +   3. Run-time flexibility


    In this context flexibility primarily translates to the ability to create new
    clients and easily link them into the server. Since we can adapt it to handle
    these concerns, it earns an 8 on this criterion.


    +   4. Memory usage


    In this criterion, each client must maintain its position in the list, which requires
    additional memory in each client. Therefore, the classic client-server approach
    only rates a 5 on this criterion.


    The second alternative approach is to create a "push" implementation in which
    responsibility for notifying the clients is given to the TMDQueue. To implement
    this, the direction of the associations in Figure 2-8 must be reversed, and the
    TMDQueue must explicitly know all of its clients to notify them when data become
    available. The client list would probably be maintained as a list of pointers
    to clients.'
