- img_proc: true
  md: '# 6.3.5 Consequences


    With a little bit of memory used by the CRC data table and a relatively small
    amount of computation time to compute the polynomial, this pattern provides good
    detection of single (and small number of) bit errors. It is often used in communications
    messaging because such connections to be extremely unreliable. In addition, it
    can be used for in-memory error detection for harsh EMI environments or for mission-critical
    data. It is excellent for large data sets with relatively few bit errors.


    # 6.3.6 Implementation Strategies


    As mentioned, the table-driven algorithm is almost always used because it provides
    good performance with only a minor memory space penalty. If memory is tight, the
    polynomial can be computed algorithmically but this has a significant impact on
    run-time performance.


    # 6.3.7 Related Patterns


    The One’s Complement replicates the data in a bit-inverted form, and so is useful
    for small data sets. This pattern is better for large data sets because it has
    a smaller memory impact.


    # 6.3.8 Example


    Figure 6-5 shows a medical application of this pattern. In this case, several
    clients set or get patient data, which is defined by the PatientDataType. The
    PatientData class provides functions to set and get the data, protecting them
    via calls to the CRCCal. A single CRC protects the entire patient data set.


    The code in Listing 6-3 is adapted from free software by Jack Klein, and released
    under the GNU Public License Agreement². It computes a CRC-16 but other polynomial
    bit-lengths are available for use.


    ```

