    ![](img/34c40aaecb0a254d07ecd1896a5cd148_348_0.png)


    Figure 5-20: AND-state machine used for example case


    The semantics of AND-states is that they are “logically concurrent.” This means
    that in some sense they execute simultaneously, but what does that mean in a world
    of run-to-completion semantics? If two AND-states process different events, then
    AND-states are more of a (significant) notational convenience. Simultaneity only
    has importance when the same event is processed within two AND-states. In that
    case, what is the meaning of concurrency? In this context, it means that the semantics
    of the system are not dependent upon which AND-state activates the event. It also
    implies that when each active AND-state must receive, in some sense, its own copy
    of the event sent to the state machine, and is free to act on it or discard it
    as appropriate. What cannot rely on which AND-state will act on the event first?
    We need to ensure that they execute in a particular order, or perhaps AND-states
    were not the appropriate mechanism to employ.


    A naive but overly heavyweight approach would be to spawn threads for the different
    state machines. While this can be made to work, in practice I have never seen
    AND-states implemented in this fashion, and for good reason. The logical concurrency
    reality only requires:


    > The UML has no notion of event or transition priority. Events are always handled
    in order of their arrival.'
