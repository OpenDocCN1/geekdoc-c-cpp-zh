  md: '# 290 Chapter 5


    5.4.4.5 TSUBSTATE

    TSUBSTATE is an enumerated type of the nested states. In this case, there are
    only two levels.


    # 5.4.5 Consequences


    This pattern simplifies the implementation by dividing the state logic into a
    set of event receptors. Each of which provides a switch-case statement to implement
    the appropriate behavior dependent on states. The pattern is almost exclusively
    to synchronous state machines because the event queues do not, generally, parse
    the internal content of the data they manage, and do not know which receptor to
    call, if there is more than one.


    # 5.4.6 Implementation Strategies


    The primary variation points for the implementation of this pattern are to use
    If-then statements instead of switch-case statements and to use raw integers for
    state variables rather than enumerated types.


    # 5.4.7 Related Patterns


    This pattern uses the Guarded Call Pattern (see Chapter 4) to ensure deterministic
    run-completion of transitions. It is also possible to use the Critical Region
    Pattern to simply disable task switching or even disable interrupts instead. The
    single event receptor provides a similar approach that can be easily adapted for
    asynchronous event processing.


    # 5.4.8 Example


    The implementation of the sample state machine with this pattern is shown in the
    following code lists. Code Listing 5-11 shows the enumerated types and the definition
    of the digit() function. The two code listings provide the header and implementation
    files for the TokenizeMultiReceptor class. Note that this class defines functions
    for entry and exit of each state when empty. You may choose to omit the one if
    desired. The init() function operates as a constructor and puts the object into
    its starting state and invokes the relevant action.


