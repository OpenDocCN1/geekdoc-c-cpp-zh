  md: '# 6.5 Channel Pattern


    The Channel Pattern is a larger-scale pattern than the previous patterns we''ve
    discussed. The Channel Pattern is used to support medium- to large-scale redundancy
    to help identify when run-time faults occur and possibly (depending on how it''s
    used) continue to provide services in the presence of such a fault.


    # 6.5.1 Abstract


    A channel is an architectural structure that contains software (and possibly hardware
    as well) that performs end-to-end processing; that is, it processes data from
    raw acquisition, through a series of data processing steps, to physical actuation
    in the real world. The advantage of a channel is that it provides an independent,
    self-contained unit of functionality that can be replicated in different ways
    to address different safety and reliability concerns.


    # 6.5.2 Problem


    This pattern provides a basic element of large-scale redundancy that can be used
    in different ways to address safety and reliability concerns.


    # 6.5.3 Pattern Structure


    The basic structure of the pattern is shown in Figure 6-8. The generalization
    shown in the figure can be not only for implementations without true inheritance
    in C. The basic idea is that the software objects are arranged through a series
    of links so that data are acquired and processed through a series of data transformational
    steps until it results in an output that controls one or more actuators. The data
    types may change (for example, a double result in an int output to the actuator)
    or they may remain the same throughout the processing.


    # 6.5.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 6.5.4.1 AbstractDataTransform


    This class is a placeholder for one of several ConcreteDataTransforms. In an object-oriented
    language or implementation, true generalization can be used in C, but it is common
    to use this as a notions concept to give the intent rather than the implementation.
    It has two optional associations. One is to itself — that is, the next transformation
    in the list. The other is to the output ActuationDeviceDriver — this is in lieu
    of the former'
