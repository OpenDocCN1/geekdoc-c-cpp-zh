    class method called an event handler executes the relevant part of the state machine,
    returning control to the sender only when the event processing is complete. “triggered
    operations” don’t have a standard method body; their method body is the action
    line on the state machine.


    Events may have parameters— typed values accepted by the state machine which may
    then be used in the guard and actions in the processing of the event. The statechart
    specifies the formal parameter list, while the object that sends the event must
    provide the necessary parameters to bind to the formal parameter list. We will
    use a slightly peculiar syntax for passing events. We will create a struct named
    params for every event with e. If an e has x and y, to use this in a guard, for
    example, you would dereference the params struct to specify that x must be greater
    than 0 and y must be less or equal to 10 for the transition to be taken would
    like:


    ```

    e[params]->x>0 && params->y<=10

    ```


    Time events are almost always relative to the entry to a state. A common way to
    name such an event (and what we will use here) is “tm(interval),” where “interval”
    is the time parameter for the timeout event. If the timeout occurs before another
    specified event, then the transition triggered by the timeout event will be taken;
    if another event is sent to the object prior to the triggering of the timeout,
    then the time is discarded; if the state is reentered, the timeout interval is
    started over from the beginning.


    If a transition does not provide a named event trigger, then this is activated
    by the “completion” or “null” event. This event occurs either as the state is
    entered (which includes the execution of entry actions for the state) or when
    the state activities complete.


    A guard is a Boolean expression contained within square brackets that follows
    the event trigger. The guard should return only TRUE and not have side effects.
    If a guard is specified for a transition and the event trigger (if any) occurs,
    then the transition will be taken and only if the guard evaluates to TRUE. If
    the guard evaluates to FALSE, then the triggering event is quietly discarded and
    no actions are executed.


    The action list for the transition is executed if only if the transition is taken;
    that is, the named event is received by the object while it is in the predecessor
    state and the guard, if any, evaluates to TRUE. The entire set of exit actions–transition
    actions–entry actions is executed in that order and is executed using run-to-completion
    semantics. Figure 1-3 shows actions on a number of different transitions as we
    enter into of the state:


