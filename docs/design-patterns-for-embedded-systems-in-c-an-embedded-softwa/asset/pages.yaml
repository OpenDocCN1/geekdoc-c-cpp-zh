  md: '# Safety and Reliability Patterns 361


    I believe that there is no such as “safe software” because it is the composite
    system – the electronics, mechanical, and software aspects working together in
    their operational environment – that is safe or unsafe. Hardware faults can be
    mitigated with software and vice versa. The system as a whole is safe or unsafe.
    Similarly, the reliability of a system is a function of all its constituent parts,
    since other parts can be designed to continue to provide normally by failed parts.
    There is extensive literature on how to assess safety and reliability and how
    to construct safe and reliable systems, but a detailed description of those topics
    is beyond the scope of this book. More information can be found in my *Real-Time
    UML Workshop for Embedded Systems* or my *Real-Time Agility* books¹ as well as
    many other sources.


    # 6.1.2 Achieving Safety and Reliability


    In general, all safety-critical systems and high-reliability systems must contain
    and properly manage redundancy to achieve their safety and reliability requirements.
    How these elements are managed depending on the particular mix of safety and reliability
    concerns. This redundancy can be “redundancy-in-the-large” (architectural redundancy)
    or “redundancy-in-the-small” (detailed redundancy). In this chapter we will consider
    a few patterns of both varieties. More safety-related architectural patterns can
    be found in my *Real-Time Design Patterns*².


    And now, let''s get to the patterns. First we’ll start with some detailed design-level
    patterns, which some people call *idioms*.


    ¹ Douglass, B.P., 2009. *Real-Time UML Workshop for Embedded Systems*. Elsevier.
    Douglass, B.P., 2009. Real-Time Agility. Addison-Wesley.

    ² Douglass, B.P., 2002. *Real-Time Design Patterns: Robust Scalable Architecture
    for Real-Time Systems*. Addison-Wesley.

    ³ In general, safety and reliability are opposing concerns when there is a fault-safe
    state and they are cooperating concerns when there is not.'
