    # 4.2.6 Consequences


    As mentioned, the primary benefit of this pattern is its simplicity. It''s pretty
    difficult to get the scheduler run. On the other hand, the pattern is demonstrably
    responsive to high-urgency events and makes the pattern inappropriate for applications
    that have high responsiveness requirements. Another benefit of the pattern is
    that it is very lightweight in terms of required resources and is so appropriate
    for very small memory devices.


    A downside of using the pattern is that the interaction of threads is made more
    challenging than other patterns. If an output of one task is needed, the data
    must be retained in global memory or a shared resource until that task runs (See
    the Task Coordination Patterns section later in this chapter). On the other hand,
    because of the lack of preemption, unbounded blocking is not a concern. Deadlock
    can only occur because of a mistake – a single misbehaving task (i.e., one that
    never returns to control the cyclic executive) shuts the entire system down. In
    a preemptive scheduling system, unless the misbehaving task has turned off task
    switching, other tasks will continue to function even if one fails.


    # 4.2.7 Implementation Strategies


    The implementation of this pattern is almost trivially simple. In most cases,
    the Cyclic Executive may be the application''s `main()` function and related global
    data. In other cases, it will be invoked from `main()`.


    # 4.2.8 Related Patterns


    Because the pattern''s responsiveness is demonstrably suboptimal, it is often
    augmented with some interrupt service routines (see the Interrupt Pattern in Chapter
    3) for high urgency events. Another use for the Interrupt Pattern with the Cyclic
    Executive Pattern is to implement the time-triggered cyclic executive, although
    the Polling Pattern (also from Chapter 3) may be used to poll the timer as well.


    The Cyclic Executive Pattern does not address sharing between tasks. The Cyclic
    Executive defines global data structures that can be used for this purpose but
    it is possible to mix other patterns for this purpose (see the Task Coordination
    patterns section in this chapter). Because there is no preemption, global data
    do not require access serialization of this pattern.


