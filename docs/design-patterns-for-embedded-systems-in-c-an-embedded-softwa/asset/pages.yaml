  md: '# APPENDIX A


    # UML Notation


    The UML is a rich and expressive language. The purpose of this appendix is to
    help you understand the most important notations of the language. For more detailed
    understanding of the richness of the UML language, the reader is referred to any
    of a number of books exploring the UML language in detail, as my own Real-Time
    UML: Advances in the UML for Real-Time Systems (Addison-Wesley, 2004).


    In the context of this book, UML was used to graphically depict both the structure
    and the behavior of the patterns. Three of the set of diagrams of the UML used
    in this book are discussed here: the Class Diagram, the Sequence Diagram, and
    the State Diagram. The UML provides a number of other diagrammatic types (not
    discussed here) and even for the diagrams discussed, there are other lesser-used
    features that are not discussed in appendix.


    # 1.1 Class Diagram


    The Class Diagram is for showing system structure. It does this by showing Classes
    (specifications of software elements), Objects (instances of classes), and relations
    of various kinds. The UML is quite flexible about the amount of detail shown on
    a diagram.


    # 1.1.1 Semantic Elements


    This section describes the elements on the Class Diagram.


    # 1.1.1.1 Nodal Elements


    A class is a representation of an element that combines data elements (called
    attributes) with functions that act on them (called operations). Classes are normally
    implemented as structs containing the attributes.


    # 1.1.1.1.2 Instance


    An instance is a creation of a new variable of the type that defines the classes.


    # 1.1.1.1.3 Interface


    An interface is a specification of a set of services (operations and/or event
    receptions) that a class must implement. An interface has no implementation and
    no attributes; it cannot be'
