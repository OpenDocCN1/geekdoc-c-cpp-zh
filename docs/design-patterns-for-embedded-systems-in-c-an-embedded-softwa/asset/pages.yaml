    ![](img/34c40aaecb0a254d07ecd1896a5cd148_446_0.png)


    instantiated. An interface is depicted with the same kind of box as a class, so
    it is visually distinguished with the «Interface> stereotype.


    1.1.1.1.4 Attribute


    A variable held within a class.


    1.1.1.1.5 Operation


    A function held within a class that typically manipulates the class attributes.
    In this book, the common implementation style of an operation is to use the notation
    <Class Name>_<Operation Name>, such as Sensor_Class_getData(). The first parameter
    passed to the class is a pointer to the instance of the class.


    1.1.1.1.6 Event Reception


    A special kind of operation that is invoked asynchronously and causes transitions
    to take place on the state machine associated with the class.


