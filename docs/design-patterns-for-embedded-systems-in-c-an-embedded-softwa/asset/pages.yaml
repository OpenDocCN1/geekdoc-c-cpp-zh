    discovery – seeing that this solution in some context is similar to another solution
    in another context and abstracting away the specifics of the solutions. Keep in
    mind that to be a useful pattern, it must occur in different contexts and perform
    a useful optimization of one or more design criteria.


    # 2.1.5.3 Pattern Instantiation – Applying Patterns in Your Designs


    Pattern instantiation is the opposite of pattern mining. It is applying the pattern
    to a particular collaboration to gain the benefits of the pattern (see Figure
    2-7). Patterns are normally applied to a collaboration of software elements, such
    as classes, types, functions, and/or variables. As mentioned previously, a collaboration
    is a set of software elements (at some scope these may be small low-level functions
    or classes, while at others may be large-grain assemblies such as subsystems and
    components). The purpose is to organize, and possibly elaborate, this already
    existing collaboration with the selected pattern.


    The application or instantiation of a pattern in your design is a matter of identifying
    the elements in your collaboration that fulfill the pattern parameter roles. For
    some of the patterns you may create the role as a super class from which subclass
    to instantiate that pattern. For other patterns, you may simply replace the pattern
    element with one from your application


