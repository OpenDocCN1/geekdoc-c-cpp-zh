  md: '# 3.2.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 3.2.4.1 Hardware Device


    This element represents the actual hardware. As such, you will not write C code
    for this element, but it is present just to aid with understanding the design.
    The association shown between the Hardware Device and the Hardware Proxy is realized
    via a software-addressable hardware interface, such as a port address, memory
    address, or interrupt.


    # 3.2.42 Hardware Proxy


    This is the primary class (or function) in the system. It has both data and functions
    that are customized to the device at hand, although each one has an initialize(),
    configure(), and disable() function. The other public functions provide access
    to values from the device or set values sent to the device. Although the pattern
    structure has a single access() and mutate() function, it is common to have several
    such functions, each bearing the name of the value being read or set.


    The key features⁷ of the class include:


    access()


    This public function returns a particular value from the device. In most cases,
    the class will contain a separate function for each separately-identifiable piece
    of information desired from the device. This operation usually calls the unmarshal()
    function prior to returning the retrieved values to the client.


    configure()


    This public function provides a means by which the device may be configured. Although
    in the general pattern no parameter list can be provided, this function almost
    always takes a list of parameters that specify the proper operating state of the
    device.


    disable()


    This public function provides a means by which the device may be safely turned
    off or disabled. It may or not have parameters depending on the device characteristics.


    deviceAddr


    This private variable provides low-level direct access to the hardware. In the
    pattern it shown as a void* but it may be a memory mapped integer (int*) or primitive
    type, a port-mapped device port number, or some other location identified. If
    more complex means are used


    > By the term feature, I am referring primarily to data elements (attributes or
    variables), operations and functions, states, and event receptions.'
