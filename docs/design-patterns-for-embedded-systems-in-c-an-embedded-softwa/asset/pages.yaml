  md: '# 194 Chapter 4


    +   3. Task Y becomes ready to run. With a normal naïve mutex, it would run and
    preempt Task Z. However, its priority (99) is less than the priority at which
    Task Z is running it remains on the Task Ready queue.

    4. Task Z completes its use of the Resource R and unlocks it. At this point, the
    priority of Task Z is demoted to its nominal priority (100).

    5. Task A unblocks and now uses the resource and completes within its deadline.

    6. Task Y now, being the highest ready task, runs.

    7. Task Y completes, and finally, Task Z is allowed to complete its execution.


    You can see in this simple example how priority prevented the unbounded priority
    inheritance inversion that a normal counting semaphore would allow.


