    **Figure 4-13:** Critical Region Pattern with Resource


    within the relevant services, task switching must be disabled before the critical
    region begins and reenabled before the service ends. Note unlike the Guarded Call
    Pattern, the scheduler is not involved in the critical region begin/end process
    other to provide services to disable/enable task switching. If the scheduler does
    not provide such services, then the critical region can be controlled with the
    user of the C `asm` directive to turn on or off interrupt processing at the hardware
    level.


    # ### 4.4.4 Collaboration Roles


    This section describes the roles for this pattern.


    # #### 4.4.4.1 CRSharedResource


    This element is used in the variant of the Critical Resource Pattern that disables
    task switching to prevent simultaneous access to the resource. In the case of
    the pattern, the protected resource is the `value` attribute. Note that all the
    relevant services must implement the critical region to protect the resource.
    In this case, it means that both the `setValue()` and `getValue()` functions must
    separately implement the critical region.


    # #### 4.4.4.2 TaskWithCriticalRegion


    This element is used when the task wants to disable task switching for reasons
    unrelated to sharing resources (usually related to timing). The `criticalService()`
    disables and enables task switching or interrupts during its critical region(s).'
