  md: '# 368 Chapter 6


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_388_0.png)


    Figure 6-4: CRC Pattern


    # 6.3.3 Pattern Structure


    The CRC Pattern structure is shown in Figure 6-4. The CRCProtectedData class uses
    a generic computeCRC() function to calculate the CRC over its data. While data
    are shown as an array, it can be any contiguous block of data.


    # 6.3.4 Collaboration Roles


    This section describes the roles for this pattern.


    # 6.3.4.1 computeCRCData Function


    This is a general function for the computation of a CRC of a specific polynomial
    bit-length. Common bit lengths include 12, 16, and 32. In practice, this is usually
    implemented with a table-driven algorithm for computational efficiency.


    # 6.3.4.2 CRCProtectedData


    This is the class that owns and protects the data. When data are stored, the CRC
    is calculated. When data are read, the CRC is recalculated and compared to the
    stored CRC; if the CRC differs, then the errorHandler() is called, otherwise the
    retrieved data is returned to the client.


    # 6.3.4.3 DataClient


    The DataClient is the element that stores and/or retrieves data from the CRCProtectedData
    class.


    # 6.3.4.4 DataType


    The is the base type of the data structure owned by the CRCProtectedDataClass.
    This might be a primitive type, such as int or double, or it may be a complex
    data type such as an array or struct.'
