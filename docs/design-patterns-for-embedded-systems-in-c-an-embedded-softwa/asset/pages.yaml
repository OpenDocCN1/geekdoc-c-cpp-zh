    \n# 5.4 Multiple Event Receiver Pattern\n\nMultiple event receiver finite state\
    \ machines (MERSMs) are generally only used for synchro-nous state machines because\
    \ the client is aware of the set of events that it might want to send to the server\
    \ state machine. In this pattern, there is a single event receiver for each event\
    \ sent from the client.\n\n# 5.4.1 Abstract\n\nThe MERS approach for state machine\
    \ implementation is probably the most common implementation pattern for synchronous\
    \ state machines. It is usually the simplest because event receiver itself concerns\
    \ only with the handling of a single event and the execution of the associated\
    \ actions.\n\n# 5.4.2 Problem\n\nThis pattern addresses the problem of providing\
    \ a simple robust implementation for synchro-nous state machines."
