  md: '# 16 Chapter 1


    Specialization can be easily done with the switch-case statement approach mentioned
    in the previous section, but it is much more versatile if function pointers are
    used. Then the designer can simply write the specialized functions and create
    a new constructor that points to the new functions instead of the old. That is,
    subclasses can override the operations by inserting pointers to different functions
    that provide specialized behaviors. The downside is that function pointers are
    a bit tricky and pointers are the leading cause of programmer-induced defects
    in C programs.


    By “extend,” I mean that the child class will have new features, such as new attributes
    or operations. In the case of the data queue, this means that I can add new attributes
    such as the name of the file used to store cached data to the flash drive as well
    as new operations as flush and load() operations for writing out to the in-memory
    buffer or reading data from the flash drive into the in-memory buffer, respectively.
    The UML class diagram in Figure 1-2 shows both the Queue and CachedQueue classes.
    To simplify the problem, assume the queue is never misused (so we don''t have
    to handle under and overflow conditions) and we want to store a maximum of 100
    integers in the queue.


    The CachedQueue is conceptually straightforward. If there is room in the insert
    buffer, then insert the data as the normal queue. If you fill up the internal
    buffer, then the insert() will call flush() to write the buffer out of disk, the
    internal buffer will be reset. For removing data, it is only slightly more complicated.
    The internal buffer is empty, remove the load() function to read the oldest data
    off the disk.


    # Reading the UML Class diagram


    The class diagram shown has a number of classic UML class diagram features. The
    boxes represent the classes while the lines represent relations between the classes.
    The class box is (optionally) divided into three segments. The upper-most segment
    holds the name of the class. The middle segment lists the attributes (data members),
    along with their types. The bottom-most segment shows the operations within the
    class.


    Two relations are shown in the figure. With the closed arrowhead is the generalization
    relation; the line points to the more base class. The other line is known as composition.
    This composition is relation that implies strong ownership, and responsibility
    for creation and destruction of the instance at the other end of the relation.
    The open arrowhead depicts navigation (the owner has a pointer to this part in
    case, but not the other way around). The name near the arrowhead is the name of
    the pointer within the CachedQueue class. The number near the arrowhead is the
    multiplicity – the number of instances to play the role (in this case, a single
    instance is needed).


    > ¹¹ If you''re feeling a little anxious, free to elaborate the example to handle
    under flow and overflow as well use C preprocessor macros to change the type and
    number of elements for the data being queued. Don''t worry – I’ll wait until you''re
    done.'
