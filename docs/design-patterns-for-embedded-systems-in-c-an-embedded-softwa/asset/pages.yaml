  md: '# 124 Chapter 3


    ![](img/34c40aaecb0a254d07ecd1896a5cd148_144_0.png)


    Figure 3-11 Debouncing Pattern


    # 3.6.4.1 ApplicationClient


    This element is the ultimate recipient of the debounced event. Its operation eventReceive()
    is only activated when the event is real (i.e., results in a changed device state.


    # 3.6.4.2 BouncingDevice


    The BouncingDevice represents the hardware for the device itself. The most common
    implementation of this device is completely in hardware; in the case, the sendEvent()
    operation is simply an activation of an interrupt in the interrupt vector table
    of the embedded processor and the getState operation is implemented via a read
    of a memory location or IO port. DeviceState is normally a bivariate attribute,
    ON or OFF.


    # 3.6.4.3 Debouncer


    The Debouncer is the software element that processes the incoming event, debounces
    it, and makes sure that it represents an actual device state change. Its eventReceive()
    function is activated by the sendEvent() service of the BouncingDevice. In turn,
    it sets the delay timer (disabling interrupts from the device if necessary) and
    then checks the device state. If, after the'
