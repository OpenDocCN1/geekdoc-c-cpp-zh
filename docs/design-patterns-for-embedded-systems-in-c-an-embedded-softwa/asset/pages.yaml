    \n# 6.3 CRC Pattern\n\nThe Cyclic Redundancy Check (CRC) Pattern calculates a\
    \ fixed-size-error-detection code based on a cyclic polynomial that can detect\
    \ corruption in data sets far larger than the size of the code.\n\n# 6.3.1 Abstract\n\
    \nThe CRC Pattern computes a fixed-binary code, called a CRC value, on your data\
    \ to detect whether or not they have been corrupted. This code is stored in addition\
    \ to the data values and is set when data are updated and when chroma are read.\n\
    \nA detailed explanation of the mathematics is beyond the scope of this book but\
    \ CRCs are common and useful in practice. CRCs are characterized by the bit-length\
    \ of the polynomials used to compute them. While algorithmic computation can be\
    \ complex and time consuming, table-driven algorithms are quite time efficient.\
    \ CRCs provide good detection of single and multiple errors for arbitrary length\
    \ data fields and are so good for large data structures.\n\n# 6.3.2 Problem\n\n\
    This pattern addresses the problem that variables may be corrupted by a variety\
    \ of causes such as environmental factors (e.g., EMI, heat, radiation), hardware\
    \ faults (e.g., power fluctuation, memory cell faults, address line shorts), or\
    \ software faults (other software erroneously modifying). This pattern addresses\
    \ the problem of data corruption in large data sets.\n\n> See for example, “A\
    \ Painless Guide to CRC Error Detection Algorithms” at http://www.ross.net/download/crc_v3.txt\
    \ for more information."
