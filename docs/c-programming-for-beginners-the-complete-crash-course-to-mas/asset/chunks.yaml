    关于 struct 和类之间差异的完整列表，请访问以下页面：[`msdn.microsoft.com/en-us/library/saxz13w4.aspx`](https://msdn.microsoft.com/en-us/library/saxz13w4.aspx)


    # 第 11 章：常见错误以及如何避免它们


    本指南花费了一些时间来梳理为了使用 C 语言编写代码而需要的所有不同部分。在学习这种语言时，有许多不同的方面需要牢记，但当我们成功将它们整合在一起时，我们会发现可以在这段时间内创建出出色的代码和程序。尽管许多现代编程语言的设计是为了让初学者更容易编程，但一旦你开始，仍然会出现很多挑战。


    初学者在这一过程中必须记住的一点是，他必须通过练习并从自己的错误以及编码过程中出现的一些问题中学习。即使是短暂的休息通常也对你有帮助，并确保你在之后的过程中不会感到疲竭或遇到困难。


    需要避免的一些错误是：练习不足。本指南中有大量的代码、建议和需要学习的内容，但如果你不打开 C 编译器并尝试其中的一些内容，你永远无法获得让它们运行起来所需的技能。因此，我们拥有的第一条规则是：多玩一玩代码，并尽可能多地练习。对于我们想要在任何编程学习中探索和学习的每个新主题，我们越早开始动手实践并玩代码，就能越快学到一些概念。你不能只是走花水读读信息就指望记住并在程序中使用代码。你必须拆解代码并观察它是如何运行的。现在你会发现，运用这个技巧最好的方法就是简单的打开编译器并开始编码。从本指南中选取几个示例并进行少量实验。只需将它们放入编译器开始就是朝着正确方向的一步，并为我们提供练习。然后你可以通过工作和搜索来获得正确的结果。


    忽视基础


    虽然有时觉得基础知识太简单而难以上手，你可能觉得应该不加思考地直接运行它们，但花时间学习它们本身仍然很重要，因为它们在工作中非常重要。我们越能掌握这些基础知识，我们开始掌握之后出现的某些高级内容就越容易。那些试图潜入编程然后匆忙跳过介绍部分、不在基础知识上花费足够时间的人，在需要转向后来的高级材料时将陷入困。因此，在我们错过这里需要的一些初始活动并跳过所有重要的基础知识之前，请确保你已经学习了基础知识以及我们可以用它们做什么，然后开始编程，打开编译器并开始编码。虽然这是一种方法，但有时尝试不同的方法并思考而不是一直打字，将是帮助我们完成任务的技巧。


    我不是在写这些


    想要开始编程、打开编译器并开始编码是很正常的。带支笔和一张纸来写代码会很有帮助。计算领域有许多高级知识，使用它有很多益处。但有时学习新事物的最好方法是将其写下来并在那里操作。无论你选择使用草稿纸、笔记本、黑板还是其他选项，手动编写所有代码都会花费更多时间。你所尝试写的每一行代码都要求更加仔细、精确，甚至投入。你在编写代码时也无法像在计算机上那样检查代码，这迫使你投入更多。这种方法在需要做事情时会花费更多时间且非常耗时。但它将是帮助我们进步并成为更好开发者的绝佳方法。如果你计划在大学或新工作中中使用它，能够写下你使用的代码并将其用于你的需求将对你的成功至关重要，你也会发现。你投入到写代码的时间和练习越多，你就能越好地理解它以及用它做什么。这迫使开发者慢下来并专注于代码的作用。


    不寻求帮助


    当我们第一次这样开始编码时，很有可能对运行方式有很棒的想法，并可以将其作为发现自己错误的方法，并学习哪些有效，哪些无效。在我们想要的工作中产生最大的误解之一是，我们假设编码时完全不需要任何帮助。虽然自己用任何语言（即使是
    C）开始编码很有趣，但我们必须面对现实，并记住当我们拥有正确的相互反馈和导师帮助我们时，我们会学得更快、更高效。


