  trans: '


    所有的程序都需要一个起点，一个指示程序执行开始位置的地方。在 C# 中，与其他语言一样，起点是 `Main()` 函数；该函数也有它自有的代码块。作为此项功能的一部分，我们通常会将应用程序的主代码放在这里，尽管也可以包含更多的功能、方法和类。函数的各个部分特性可以在本书的第
    5 章中找到。


    现在是时候创建我们的第一个应用程序了。我们将按照所示所示修改函数代码。当我们在 `Main()` 内部添加指令时，必须注意它是在放置点之后立即发生的。


    ### 应用程序编译


    一旦写完程序，我们就可以编译之前学的内容；这将生成一个程序集，并在执行后供运行时使用。


    要编译应用程序，我们必须选择 `Build` 菜单，然后选择 `Build Solution`，或直接按 `F6` 键。编译器将开始运行，我们将在状态栏看到解决方案已成功编译。


    ### 运行应用程序


    编译成功后，我们就可以运行程序并查看它的工作原理。为此，我们有两个选择：带调试启动和不调试执行。在 Express 版本中只有带调试执行，但我们可以使用 `CTRL
    + F5` 使用非调试执行，或者通过 `tools` 菜单添加它。


    调试器是一个帮助我们修复运行时错误以及逻辑错误的程序。最好使用不带调试器的执行，仅在需要时才使用带调试的执行。现在我们将运行应用程序；为此此，请按 `CTRL
    + F5` 键。


    当程序执行时，会出现一个我们称为控制台的窗口，显示程序的执行情况。通过这种方式，我们可以读取我们在示例中放置的消息。


    由于这是一本 C# 编程的入门书籍，我们将在控制台上运行所有程序。当你理解了核心概念后，就可以学习在 C# 中编写形状、表单和图形界面。这种编程并不困难，但需要对面向对象编程有基本的理解。


    ### 如何检测程序中的错误？


    有时我们会写错程序；在这种情况下，应用程序无法编译或执行；如果发生这种情况，我们必须更改错误之处。


    让我们故意写一个错误，以便观察编译器的行为。


    在程序中，我们将 ''Console'' 改为 ''Consoli'' 并更改了 ''namespace'' 和 ''HelloWorld'' 的顺序，这会导致错误；现在我们可以尝试再次编译查看会发生什么。


    ![Image](img/image-7.jpeg)


    正如我们所知，用户界面底部出现的窗口是编译器用于通信的；我们看到出现了一个带有错误列表的窗口。我们将在下一书中学习如何使用它；目前，我们只需要知道列表中的第一个问题总是必要的，而且我们可以通过双击它直接进入错误。


    类视图 (Class view)


    现在检查类视图。在此视图中，我们可以获取有关正在创建的解决方案的信息，但与解决方案管理器（Solution Explorer）不同，信息是按逻辑排列的。


    通过此视图，我们可以快速找到解决方案的命名空间以及它们包含的类；如果我们需要，还可以查看每个类中的方法。此视图不仅允许我们观察逻辑信息，还赋予我们快速导航代码的能力。


    社区版（Community edition）没有预配置选项，因此需要在 `View` 菜单中添加命令。


    要查看类视图，我们必须进入 `View` 菜单并选择 `Class View`，或直接按 `Ctrl + W, C`，UI 中就会出现一个窗口。


    ![Image](img/image-8.jpeg)


    类视图窗口分为两个部分；顶部部分显示元素的逻辑和层级关系，底部部分显示组成特定类的方法。


    ![Image](img/image-9.jpeg)


    在底部我们找到了设计；它将包含必要的引用和 `HelloWorld` 命名空间。如果有更多，它们会在我们打开 `HelloWorld` 命名空间并找到被占用的类时出现。在这种情况下，我们只有一个
    `Program` 类；如果我们选择它，将在底部看到在内部声明的项。在我们的示例中，我们有 `Main()` 方法。


    如果此时我们双击任何一个项，将自动跳转到定义它的代码中。由于我们的程序非常小，我们可能看不到它的用处，但在具有数千行的程序中，这种导航能力是极好的。


    编译器菜单配置 (Compiler menu configuration)


    要向菜单添加所需的选项，需要遵循一系列非常简单的步骤。首先，进入 `Tools` 菜单并选择 `Customize`。将弹出一个对话框，我们需要选择 `Commands`；在此部分，我们可以选择想要从中添加命令的菜单，例如
    `View` 菜单。


    ![Image](img/image-10.jpeg)


    显示当前的命令（注：原文为 current commands are displayed），点击我们想要插入新命令的区域并按 `Add` 按钮。这将弹出一个新对话框，显示分类后我们可以添加的所有可能的命令。在类别中选择
    View，在命令中选择 Class，该命令就是允许我们拥有类的那个。`Start Debugging` 命令位于 Debugging 类别。


    ![Image](img/image1.jpeg)


    到此为止，我们已经拥有理解 .NET 需要的最重要的基本概念。我们将从下一章开始，学习编程和 C# 语言。C# 主函数


    C# 是一种全新的、面向对象的编程语言，允许开发者基于 .NET 平台快速编写各种应用程序。.NET 提供了一系列工具和服务，最大化地促进了计算和通信领域的开发和使用。凭借
    C# 卓越的面向对象设计，它是构建各种组件的理想解决方案——无论是高层业务应用还是系统级应用程序。C# 语言的特性主要体现在以下方面：


    - 设计应用程序。

    - 自定义 Windows 库。

    - 应用程序设计。

    - 为智能设备设计应用程序。

    - 设计 .NET Web 应用程序。

    - 设计 .NET Web 服务。

    - 设计 .NET 移动 Web 应用程序。

    - 自定义 Web 库。


    .NET 是基于 C# 开发的控制和标记。在中间语言领域，C# 是最亲和的语言，它具有 C 和 Java 的主要特征、强大的函数库以及方便的模板，是当今的理想语言之一。


    # C# 几乎结合了今天的高级语言的优点，并具有以下主要特征。


    *简洁的语法*


    C# 语言像 Java 语言一样使用统一的运算符，消除了 C++ 中复杂的表达式和伪关键字，并以最简单、最常见的形式描述。


    *卓越的面向对象设计*


    C# 语言是以面向对象为核心进行设计的，因此它拥有面向对象语言应该的所有特征，即封装、继承和多态。


    C# 仅允许单继承，这意味着一个类不会有多个基类，从而避免了类型定义中的混淆。在 C# 中，每个类型都是对象，因此没有全局函数、全局变量和全局常量的概念。所有的常量、变量、属性、方法、索引、事件等必须封装在类中，这增加了代码的可读性并减少了命名冲突的可能性。


    *与网络的密切集成*


