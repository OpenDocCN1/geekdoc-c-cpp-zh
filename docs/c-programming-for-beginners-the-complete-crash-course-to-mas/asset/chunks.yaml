  trans: "\n`while` 语句与上一节中提到的条件判断语句相似，它也是根据条件判断来决定是否在 `{}` 上执行执行语句。区别在于，`while` 语句会多次评估条件。只要条件为真，`{}`\
    \ 中的语句就会一直执行，直到条件为假且 `while` 循环终止。\n\n`while` 语句具有以下语法结构：\n\n```\nwhile (cyclic\
    \ condition) \n{\n    // follow the instructions\n    …\n}\n```\n\n在上述语法结构中，`{}`\
    \ 中的执行语句被称为循环体，循环体是否执行取决于循环条件。当循环条件为真时，将执行循环体。当循环体执行完毕后，它将继续评估循环的状态。如果条件仍然为真，它将继续执行，直到循环条件为假，整个循环过程才会完成。\n\
    \n然后使用 `case`（此处应为循环）如示例所示打印自然数 1 到 4。\n\n### 示例程序\nProgram11.cs\n```csharp\n\
    public class Program11\n{\n    public static void \n    {\n        // Here you\
    \ need to enter your logic\n        int firstSample = 1; // define a variable\
    \ 'firstSample' with an initial value of 1\n        while (firstSample <= 4) //\
    \ cyclic condition\n        {\n            Console.WriteLine(\"firstSample =\"\
    \ + firstSample);\n            // If condition is true, print FirstSample. \n\
    \            firstSample++; // firstSample for self-incrementing\n        }\n\
    \        Console.ReadKey();\n    }\n}\n```\n\n运行结果将显示在计算机屏幕上。例如，起始值 `x` 为 1，如果循环条件\
    \ `x <= 4` 为真，则循环将重复执行，打印 `x` 的值且 `x` 会自动增加。因此，打印结果中的 `x` 值分别为 1、2、3 和 4。示例中第\
    \ 9 行的代码用于在每次循环更改变量 `x` 的值，从而最终实现改变循环条件的目标。如果没有那行代码，整个循环将变成死循环且不会结束。\n\n### Do-while\
    \ 语句\n`do-while` 语句的功能与 `while` 语句相似。两者的区别在于，语句必须先评估循环条件，然后根据循环的结果决定是否执行 `{}`\
    \ 中的代码。相比之下，`do-while` 语句在评估循环条件之前必须执行一次 `{}` 中的代码。\n\n它的语法如下：\n\n```\ndo\n{\n\
    \    // follow the instructions…\n} while (cyclic condition);\n```\n\n在上述语法中，关键字\
    \ `do` 之后 `{}` 中的执行语句是循环体。`do-while` 语句将循环条件放在循环体之后。这意味着循环将无条件地执行一次，然后根据循环条件决定是否继续执行。\n\
    \n然后使用 `do-while` 语句重写示例，如下方的 Program12.cs 所示：\n\n```csharp\nclass classicprogram\n\
    {\n    public static void\n    {\n        // We usually enter options here\n \
    \       int secondInstance = 1; // define a variable 'secondInstance' with a starting\
    \ value of 1 to\n        do\n        {\n            Console.WriteLine(\"first\
    \ instance =\" + secondInstance); // write the value of the \"first\"\n      \
    \      secondInstance++; // increase the value of \"priority\" by itself\n   \
    \     } while (secondInstance <= 4); // cyclic conditions\n        Console.Scan();\n\
    \    }\n}\n```\n\n运行结果将显示在计算机屏幕上。上述示例具有相同的结果，说明 `do-while` 循环和 `while` 循环可以实现相同的功能。然而，两者在程序运行过程中存在差异。如果在循环语句开始时不满足循环条件，`while`\
    \ 循环体将不会执行一次，但 `do-while` 循环体仍会执行一次。如果此示例中的循环条件 `x <= 4` 更改为 `x < 1`，示例 2-12 将打印\
    \ `x = 1`，而示例 2-11 则不输出任何。\n\n### For 语句\n上一节解释了 `while` 循环和 `do-while` 循环。程序开发中经常使用的另一种类型的循环语句是\
    \ `for` 语句，它通常用于循环次数已知的情况，其语法格式如下：\n\n```\nfor (initialization expression, circulation\
    \ conditions, operation expression)\n{\n    // follow the instructions…\n}\n```\n\
    \n在上述语法中，`for` 关键字后的字符包含三个部分：初始化表达式、循环条件和操作表达式。在语句之间，`{}` 中的执行语句是循环体。然后，初始化表达式、循环条件、操作表达式和循环体分别由\
    \ 1 表示。\n\n```\nfor (int i = 1; i <= 4; i++)\n{\n}\n```\n\n然后如示例所示对自然数 1 到 4 求和。Program13.cs\
    \ 示例：\n\n```csharp\nclass classicprogram\n{\n    public static void\n    {\n \
    \       // We usually enter options here\n        int secondInstance = 1; // define\
    \ a variable 'secondInstance' with a starting value of 1 to\n        for (int\
    \ first = 1; first <= 4; first++) // the first will change from 1 to 4\n     \
    \   {\n            sum += first; // realize the accumulation of the sum own\n\
    \        }\n    }\n}\n```\n\n例如，变量 `i` 的初始值为 1，如果评估 `i <= 4` 为真，则将执行循环累加 `+= I`。当表达式完成后，将执行操作表达式\
    \ `i++`，i` 的值变为 2。然后继续评估条件并启动下次循环，直到 `i = 5` 且条件 `i <= 4` 为假，退出循环，执行 `for` 循环后的代码，并打印\
    \ \"sum = 10\"。\n\n# 第 6 章：类\n\n在 C# 编程语言中，每个组件都与类和对象相关，它们代表了基本的面向对象概念。类类似于原型，用户从原型创建对象。类代表一个具有其所有成员、属性和功能的唯一实体。\n\
    \n### 类\n类代表了任何面向对象软件中唯一的编程组件。类由访问修饰符、`class` 关键字和唯一名称定义。某些类可以包含许多元素，如字段、属性和方法。类的默认访问修饰符是\
    \ `internal`。这意味着如果没有指定访问修饰符，该类将被视为 `internal`。类的示例类的所示：\n\n![Image](img/image-15.jpeg)\n\
    \n该类有其访问修饰符 `public`，包含 `class` 关键字；有一个唯一名称 `TShirt`。在此类内部定义了许多成员。有一个 `private`\
    \ 字段 `color`、一个 `public` 属性 `color`、一个定义的构造函数（带一个参数）以及一个 `public` 方法 `About`。\n"
- fmt: '

    Apart from the regular classes, there is one special type of class - the abstract
    class. An abstract class is a special type of class in which an object cannot
    be instantiated. Abstract classes are most commonly used to define a base class
    in a hierarchy, and are also known as incomplete class. Abstract classes typically
    represent a base class. It is designed to contain derived classes that implement
    abstract definitions. In abstract classes, there may as well be abstract methods
    or non-abstract methods. Abstract methods, as well as any element that is marked
    abstract, must be implemented in the derived class. Classes that are marked with
    the keyword abstract are intended to provide a prototype for derived classes.
    An abstract class can have a constructor implemented.


    ![Image image-16)


    In the given example, we have one abstract class named `Animal`. There is only
    one member in this class and that is the abstract `void Sound()`. Making a method
    abstract means that any class derived from that class such as the `Animal` class
    in this case, must have its implementation overridden. Below the abstract class,
    there are two classes that are "normal" classes. Both classes override the implementation
    of the `Sound()` method in the `Animal` class. This is because both `Elephant`
    and `Pig` classes inherit from `Animal`. Inheritance will be explained in detail
    in the next chapter, but for now the symbol next to `Elephant` and `Pig` means
    that they inherit from `Animal`. In this case, it means that they must have their
    implementation of the abstract method from the base class. In the `Main` method
    of the `Program` class, there is a declaration of a variable of type `Animal`
    named `animal`.


    That there is no instance of `Animal` class as this is not possible and the reason
    is that `Animal` is abstract class - so can''t be created. On the next line, the
    program creates an instance of the `Elephant` object in variable `animal`. This
    is allowed because `Animal` is the base class of the `Elephant` class. It is followed
    by the call to the `Sound()` method from the variable `animal`. Also, since the
    `animal` instance is of `Elephant`, this call executes the `Sound()` method of
    the `Elephant` class. The next thing is to instantiate the `Pig` object and assign
    it to the same `animal` variable. This ends up calling `Sound()` method again
    from the `animal` object. This time, the `Sound()` implementation from the `Pig`
    class was used.


    ![Image image-17)


    ### Object


    Objects in C# represent real entities in the system, with all their characteristics
    and class-type functions. They are somewhere in memory and have a reference to
    it. Each time the `new` keyword is used, an object in memory is created. Objects
    must be of class type. Each class written in the C# language derives from `System.Object`
    (inheritance will be explained in later chapters). It means that there is a built-in
    `Object` class in C#, and any object of any type derives from that class. Each
    created object, in addition to its own functionalities, also has methods that
    are available from its parent class, Object. The methods are: `Equals`, `ToString`,
    `Finalize`, and `HashCode`. This can be checked on an example:


    ![Image image-18)


    This example uses the `TShirt` class shown in the previous example in the Class
    section. An object of the `TShirt` class type is created in the `Main` method.
    This object is referenced by the `tshirt` variable. In the second line you can
    see the available methods and properties that can be performed on the `tshirt`
    object. In addition to the `Color` property and `About` method, which are part
    of the `TShirt` class, there are also four methods from the parent class of `Object`
    (`Equals`, `HashCode`, `GetType`, `ToString`).


    ### Interface


    Another important part of object-oriented programming is the interface. The interface
    represents multiple declarations of functions. A class can implement one or more
    interfaces but can only inherit from one class or abstract class. This is another
    feature of C# programming - it does not support multiple inheritance. Classes
    that implement interface must contain complete definition of all members. There
    is no access modifier in interface, as all members are `public`. If a class needs
    to implement interface members, that means the members must be public so that
    they can be implemented by other classes. An interface is an object component
    that has declarations. If you try to insert implementations into interface you
    will get an error. Interface can contain properties and methods - anything implementation
    can have. It cannot have fields and a constructor because it is not a class and
    cannot be created. When implementing an interface, the class must implement all
    members. As mentioned, inheritance is not supported in C#, but it can be achieved
    through an interface as a class can implement multiple interfaces. Example: interface
    can contain properties and methods - anything implementation can have.


    ![Image image-19)


    Here we have one interface defined. It has three properties inside. The class
    that will implement this interface must have a definition of all these interface
    elements.


