  trans: '


    一个 `AC` 开发者可以轻松理解 Visual Basic `.NET` 开发者的代码，他们都可以使用自己最擅长的语言进行编程。这是因为所有使用 `.NET`
    的语言都共享 `.NET` 库，因此无论我们使用什么语言进行编程，我们都可以在任何语言中识别出它。接下来，我们将学习 `.NET` 的不同组件：公共语言运行时
    (`CLR`)、程序集（Assembly）和公共中间语言 (`CIL`)。


    ## CLR


    我们将学习的第一个组件是公共语言运行时，也称为 `CLR`。它是所有语言通用的可执行程序。该程序负责读取编译器生成的代码并启动执行。无论程序是用 C#、Visual
    Basic `.NET` 还是其他 `.NET` 语言编写的，`CLR` 都会读取并执行它。


    ### installation


    当我们写了一个用 `.NET` 编写的程序并编译它时，会生成一个程序集。该程序包包含了编译程序中的 `CIL`，还包含了程序中使用的所有类型的信息。


    ## CIL


    `.NET` 程序不会直接编译成机器汇编代码；而是编译成名为 `CIL` 的中间语言。这种语言由运行时读取并执行。使用 `CIL` 和运行时为 `.NET`
    提供了极大的活性和跨平台能力。


    `.NET` 框架共享公共语言或 `CLS` 规范。这些规范是你想要使用的每种语言为了与运行时协作而必须满足的指南。其中一个优势是，如果我们的代码符合 `CLS`
    标准，我们就可以与其他语言具有互操作性，例如，我们可以在 C# 中创建一个库，Visual Basic `.NET` 开发者可以毫无问题地使用它。


    这些指南的亮点之一是 `CTS` 或公共类型系统。在编程语言中，当我们想要写入信息时，它会被放入变量中，变量将根据要写入的信息具有类型，例如，一个类型可以是整数，另一个类型用于写入小数，另一个用于写入短语或单词。问题是每种语言存储信息的方式不同。某些语言使用
    16 位内存存储整数，而另一些使用 32 位内存；甚至像 C 和 C++ 这样的语言没有存储字符串或短语的类型。


    为了解决这个问题，`.NET` 框架通过 `CTS` 定义了类型在它们环境中如何运行。任何与 `.NET` 的语言都必须使用 `CTS` 中指定的类型。现在我们已经了基本概念，并可以看到它们是如何结合在一起的。


    ## 如何创建 .NET 应用程序


    我们可以使用编程语言创建 `.NET` 应用程序。为此，我们将使用 C#；通过这种编程语言，我们可以创建程序的源代码（告诉程序应该做什么的指令）。


    当我们完成源代码的编写后，我们必须使用编译器。编译器获取源代码并为我们创建一个程序集。该程序集将具有我们代码等效的内容，但是用 `CIL` 编写的，这导致了
    `.NET` 的另一个优势——编译器针对我们将使用该程序的平台对代码进行优化，这意味着同一个程序可以针对设备、普通 PC 或服务器进行优化，而无需对其进行任何更改。`.NET`
    框架可以运行在多个平台上，而不仅仅是 Windows。这意味着我们可以在特定平台上进行开发，如果另一个平台有运行时，我们的程序就可以毫无问题地运行。在 Windows
    上开发的 `.NET` 程序只要有适当的运行时就可以运行。


    当我们想要运行程序时，运行时读取程序集并为我们创建环境。运行时从程序集中开始读取 `CIL` 指令，并在读取的过程中将其编译为供运行该程序的计算机处理器执行的代码；这被称为
    JIT 或即时编译。这就是程序执行的方式，并且这一切对用户来说都是透明的。JIT 编译器也称为 JIT。它是运行时的一部分，如果程序需要它已经编译的代码，它的效率非常高，从而提高了用户的性能。


    对于运行程序，`.NET` 框架提供了内存管理和垃圾回收服务。在 C 和 C++ 等托管语言中，开发者负责内存管理。在大型程序中，这是一项复杂的任务，可能会导致执行期间出现错误。坦率地说，像
    C# 这样的托管语言让程序员不再负责内存使用。垃圾回收器负责在对象不再使用时移除不再需要的对象，它收集并删除对象。这释放了内存和资源。垃圾回收器自动为我们工作，并帮助消除
    Win32 需要的所有内存和资源管理。在某些特殊情况下，例如文件、数据库或网络连接，我们必须明确指示何时销毁资源。


    # 第 10 章：ENUM 和 struct


    ### Calculation


    枚举（代表枚举类型）是一种特殊的数据类型，允许开发者为一组整数常量提供有意义的名称。


    要声明一个枚举，我们使用 `enum` 关键字后跟枚举名称。枚举元素包含在大括号中，并用逗号分隔。下例所示：


    ```calculation of the days of the week

    {

    Sun, Mon, Tue, Wed, Thu, Fri, Sat

    }

    ```


    注意，我们不在最后一个元素后面加分号。


    在声明 `DaysOfWeek` 枚举后，我们可以如下所示声明并初始化变量 `DaysOfWeek`：


    `DaysOfWeek myDaysOfWeek = DaysOfWeek.Mon;`


    变量名是 `myDaysOfWeek`。如果我们写 `Console.WriteLine(myDaysOfWeek);`，我们将得到 `Mon`。


    默认情况下，枚举中的每个成员都被分配从零开始的整数。这意味着在示例中 `Sun` 被分配为 0，`Mon` 分为 1，以此类推。由于枚举项是整数，我们可以将它们强制转换为
    `int`。例如 `Console.WriteLine((int)myDaysOfWeek);` 给了我们 1。如果你想分配一组不同的整数，可以这样做：


    ```enumenum DaysOfWeek

    {

    Sun = 5, Mon = 10, Tue, Wed, Fri, Sat

    }

    ```


    因为字节的范围是 0 到 255。


    使用枚举有两个主要原因。第一个是提高代码的可读性。`myDays = Mon;` 比 `myDays = 1;` 更明显。第二个原因是变量可以取的值的限制。如果我们有一个存储星期几的变量，我们可能会无意地给它赋值为
    10。通过使用枚举可以防止这种情况，因为我们只能向变量分配预定义的枚举项。


