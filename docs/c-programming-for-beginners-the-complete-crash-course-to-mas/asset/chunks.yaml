  trans: '


    当我们使用 `C#` 时，我们会发现从视觉上看，它为我们提供了一个高级代码编辑器以及一些更方便的 UI 设计器、一个集成调试器以及其他工具，这些工具将确保基于该语言开发我们的应用程序变得更容易。


    `C#` 的酷之处在于，它不仅表达能力很强，能够帮助我们处理许多复杂的代码，而且非常易于学习且简单。`C#` 语法中的大括号看起来很熟悉，特别是如果你过去用过
    `Java`、`C++` 和 `C` 的话。擅于这些语言的开发者会发现，由于相似性，学习 `C#` 不会花费长时间。


    `C#` 很有用，因为它能够简化 `C++` 中出现的某些问题，并为我们提供一些高级功能，包括可空值类型、委托、枚举、lambda 表达式和直接内存访问。这些功能在
    `Java` 等语言中都是不可用的。


    此外，你会发现 `C#` 语言支持一些泛型方法和类型，这有助于我们让类型更安全、更高效。它包含了若干迭代器，使集合类的实现者能够定义自定义的迭代行为，供客户端代码轻松使用。


    由于这种语言属于面向对象的范畴，它能够处理许多该范畴的主题和选项，我们稍后将详细探索这些，包括多态、继承和封装。我们使用的所有方法和变量都包含这些类定义中。一个类可以直接继承一个父类，但可以配置实现任意数量的接口。


    该语言中的方法可以掩盖随机定义。在使用 `C#` 工作时，其结构类似于轻量级类。这意味着它是一个分配类型，可以加载并实现接口，但不能帮助我们支持继承。


    除了我们刚刚看到的一些基本原则外，你会发现 `C#` 通过一些构造使得创建软件组件变得更容易，这些构造包括：


    - 它可以使用 `delegates`（委托）传递并封装我们的一些方法签名。这些将开启所需的某些类型安全事件通知。

    - `Properties`（属性）可以作为私有成员变量的访问器。

    - `Attributes`（特性）有助于在程序运行时提供关于不同类型的声明性元数据。

    - `LINQ` 代表集成语言查询。这非常有用，因为无论我们处理的是什么数据源，它都能为我们提供内置的查询能力。


    当我们开始使用 `C#` 并使其满足我们的某些需求时，我们可以看到许多优势。它是一种面向对象的语言，易于组织和将内容整合在一起；当我们可以使用正确的 IDE
    以及我们即将讨论的 `.NET` 平台时，我们能够用它来构建所需的健壮程序，而没有其他类似语言中功能缺失的复杂性。


    # IDE C#


    在详细介绍如何编码以及我们用 `C#` 做什么之前，我们需要更好地理解什么是 `IDE` 以及为什么它是我想要进行的任何编码中如此重要的部分。首先，`IDE`
    是一个集成开发环境，即我们可以用来辅助应用程序开发的程序。通常情况下，它是一个图形用户界面，旨在让任何开发者更轻松地创建应用程序。很多时候，它们会有更多所需的工具。大多数常用功能，如查看数据、版本控制甚至调试，将帮助开发者完成工作，而无需在工作的不同应用程序之间切换。这有助于最大化生产力，因为我们可以为相关组件提供相似的界面，并缩短学习新语言所需。此外，取决于你选择的
    `IDE` 类型，它可能只支持一种语言，而在其他时候它可以支持多种语言。


    `IDE` 背后的概念是从当时并不实用的命令式软件演变而来的。一些现代 `IDEs` 更多地用于视觉编程语境，而其中的应用程序将通过移动代码编程构建块来快速高效地开发。这些代码可以根据你希望从过程中获得的结果来进行编译或解释。花时间选择一个良好的
    `IDE` 是重要的，在我们使用它时，有一些需要考虑的因素。例如，需要花时间查看语言支持、操作系统需求和成本。有时我们想使用的 `IDE` 是免费的，但有时它们是有限制的。目前有一些可用的支持
    `C#` 的良好 `IDE`。进行一些研究并了解它们是如何工作的，以及哪些具有你想要的特性以获得最佳结果是关重要的。当你能做到这一点时，编写你想要的代码将变得容易得多。


    ## 如何在 Linux 和 Mac 上使用 C#


    尽管 `C#` 被认为是一种 Windows 语言，但我们可以在 Linux 和 Mac 计算机上运行并使用它工作。我们可能需要采取一些额外的步骤，并且 Windows
    中使用的某些功能将会消失，但在其他操作系统上使用此选项时，我们仍然会看到许多优势。


    对于 Linux 上的 `IDE Mono`（它是 Mono 项目的一部分），它应该正是你在 Linux PC 上开发 `C#` 代码所需的。最简单的安装方法是使用专为
    Ubuntu 开发的 Mono 包。有时建议使用 `WinForms` 工具包，但这个工具可能并不高效也不易于使用。


    我们也可以让这种语言在 Mac 上运行。第一步是下载 `IDE`，`Visual Studio Code` 通常是这里的最佳选择，因为它在 Mac 上运行良好，在提供你所需功能的同时仍保持简单易用。只需访问
    Visual Studio 网站，然后点击按钮下载到你的 Mac。这应该以 zip 文件的格式下载你需要的内容。一旦设置好，你就可以解压文件并将其拖到 Applications（应用程序）文件夹。你应该从那里下载它。下一步是检查并下载
    `C#` 扩展。你可以进入 `Visual Studio Code` 并打开运行此功能所需的扩展。现在当你通过这个过程时，你会发现扩展视图（Extensions
    view）顶部有一个搜索栏。在这里输入 "C#"。你需要的是来自 Microsoft 的那个，所以务必点击它。点击安装即可完成。


    然而，请记住，这个过程是因为 `C#` 是为了在 Windows 上运行得最好而开发的。因此，如果你使用 Windows，这种语言可能更容易使用，你在编码中寻找的所有功能和特性可能就在它们该放置的位置。


    这并不意味着你完全不能在 Mac 上运行它。它意味着你需要采取一些额外的步骤来设置，并且执行你想做的某些事情可能没有那么简单。


