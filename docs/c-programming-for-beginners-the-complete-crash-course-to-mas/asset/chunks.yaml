  trans: "\n在 C# 中，复杂的 Web 及其他网络编程更像处理本地对象，这简化了大规模和深层次的分布式开发。C# 内置的组件可以方便地支持 Web，并可以被互联网上运行在任何操作系统上的任何语言调用。\n\
    \n### 安全性与错误处理\n\n语言安全性和错误处理能力是衡量一种语言是否完美的重要基础。C# 可以消除许多常见的软件开发缺陷，并提供全面的安全性性能，包括类型安全。\n\
    \n默认情况下，从互联网和局域网下载的代码无法访问任何本地文件和资源。C# 不允许未初始化的变量，并提供了方便的溢出检查和检查等功能。内存管理中的垃圾回收机制极大减轻了开发者的内存管理负担。\n\
    \n### 处理技术版本\n\nC# 具有内置的版本控制功能，例如支持特性重载和异常（例外）、特性支持等，以便方便地开发和更新复杂软件。\n\n### 灵活性与兼容性\n\
    \n在托管状态下，C# 不能使用指针，而是使用 `Delegate` 来模拟指针函数。如果你需要在类或类方法中使用指针，只需要将内容声明为 `unsafe`。此外，虽然\
    \ C# 不支持多类继承，但可以通过接口继承来实现。\n\n兼容性意味着 C# 允许与必须传递指针类型参数的 C/C++ 类型 API 进行互操作，并实现了\
    \ C# 组件与其他语言组件之间的互操作。\n\n### 业务流程与软件实现之间更好的对应\n\n如果一家公司的业务计划要付诸实践，抽象的业务流程与实际软件实现之间必须存在密切的关系。这在大多数语言中是非常的。\n\
    \nC# 允许定义扩展的元数据。这些元数据可以应用于任何对象。项目生成器可以定义特定领域的属性并将其应用于任何语言元素，例如类和接口。\n\n简而言之，C#\
    \ 是一种现代的面向对象的语言，允许开发者基于 Microsoft .NET 平台快速方便地创建解决方案。该框架允许 C# 组件轻松转换为 XML Web\
    \ 服务，以便于任何平台上的应用程序都能通过互联网调用它们。C# 提高了开发者的生产力。同时，它试图消除导致严重后果的编程错误。C# 让 C/C++ 开发者能够在快速扩展网络的同时，仍然保持开发者所需的强度和灵活性。\n\
    \n因此，我们通过各种示例对 C# 的意义和用途进行了简要介绍。在本书的下一章中，我们将讨论构建信息完善的 C# 窗口应用程序所需的 C# 开发环境。请继续阅读以了解更多信息。\n\
    \n# 第 2 章：数据类型\n\n在编程中，数据类型是指用于声明特定数据变量或函数的结构。变量的类型决定了它所占内存的大小以及它使用存储其中的位模式的方式。数据的主要分类如下：\n\
    \n基础类型：这些是数字，由以下两种类型组成：(a) 整数和 (b) 浮点。\n\n计算类型：这些是数值类型，用于描述必须在整个系统中分配的变量。\n\n\
    Void 类型：`void` 关键字表示无法分配任何值。\n\n派生类型：包含 (a) 数组、(b) 指针、(c) 结构和 (e) 函数。\n\n数组和结构数据也被称为聚合。函数的类型决定了函数将返回什么类型的值。我们将涵盖基础数据。\n\
    \n### 整数类型\n\n以下是此类类别中出现的数据类型列表。为了参考，还给出了它们占用的空间及其范围。\n\n`char`: 分配内存：1 字节，范围：-128\
    \ 到 127 或 0 到 255\n`signed char`: 分配内存：1 字节，范围：-128 到 127\n`unsigned char`: 分配内存：1\
    \ 字节，范围：0 到 255\n`int`: 分配内存：2 或 4 字节，范围：-32768 到 32767 或 -2147483648 到 2147483647\n\
    `short`: 分配内存：2 字节，范围：-32768 到 32767\n`unsigned short`: 分配内存：2 字节，范围：0 到 65535\n\
    `unsigned int`: 分配内存：2 或 4 字节，范围：0 到 65535 或 0 到 4,294,967,295\n`long`: 分配内存：4\
    \ 字节，范围：-2,147,483,648 到 2,147,483,647\n`unsigned long`: 分配内存：4 字节，范围：0 到 4,294,967,295\n\
    \n你可以使用 `sizeof` 运算符来获取变量或类型的精确大小。`sizeof(<type>)` 声明返回以字节字节的数据或变量的大小。以下是一个说明下文概念的示例：\n\
    \n```c\n#include <limits.h>\n#include <stdio.h>\nint main () {\n    printf(\"\
    char type (size in bytes):%d \\n\", sizeof(char));\n    return 0;\n}\n```\n在编译并执行此代码后，你需要得到以下输出：char\
    \ type (size in bytes): 1\n\n### 浮点数据类型\n\n以下是此类类别中出现的数据类型列表。同时还规定了它们占用的磁盘空间、范围和精度值供参考。\n\
    \nfloat: 分配内存：4 字节，范围从 1.2e-38 到 3.4e+38，精度：6 位小数\ndouble: 分配内存：8 字节，范围：2.3e-308\
    \ 到 1.7e+308，精度：15 位小数\nlong double: 分配内存：10 字节，范围：3.4e-4932 到 1.1e+4932，精度：19\
    \ 位小数\n\n以下将帮助找到以字节计算的精确分配内存。\n\n```c\n#include <float.h>\n#include <stdio.h>\n\
    int main () {\n    printf(\"allocated memory for float:%d \\n\", sizeof(float));\n\
    \    printf(\"precision:%d \\n\", FLT_DIG); \n    printf(\"maximum range:%e \\\
    n\", FLT_MAX);\n    printf(\"minimum range:%e \\n\", FLT_MIN);\n    return 0;\n\
    }\n```\n在编译并执行此代码后，你需要得到以下输出：allocated memory for float: 4, precision: 6, maximum\
    \ range: 3.402823e+38, minimum range: -3.402823e-38\n\n### Void 类型\n\n`void` 数据类型表示没有可用值。它用于以下三种情况之一：\n\
    \n函数的返回类型。你一定已经注意过 `void` 作为返回类型的使用。如果没有，你很快就会看到。`void` 数据类型意味着函数不返回任何内容。\n\n\
    函数参数。有许多函数不验证任何参数。没有参数的函数可以被认为是无效的。\n\n```c\nvoid print (int);\nint print (void);\n\
    ```\n"
- fmt: "\nA variable is simply a name assigned to a memory area. Our programs are\
    \ capable of manipulating this storage area. Each C variable is associated with\
    \ a type that specifies the amount of memory allocated to that variable. It also\
    \ determines the kind of operation that can be applied to the variable. For example,\
    \ you cannot multiply string variables.\n\n## Variable Declaration\n\nWC in variable\
    \ declaration use the following syntax:\n\n```\n<data_type> <variable_list>;\n\
    ```\n\nThe `Data_type` in the syntax above must be a valid C data type such as\
    \ `int`, `String`, `float`, etc. `VariableList` can be multiple variable names\
    \ separated by commas.\n\nThe following are examples of valid variable declarations:\
    \ `int a, b, c;` `mark c, d;` `float x, salary;` `double y;`\n\nA variable can\
    \ be initialized during its declaration. For example: `int x = 40;`\n\n## Variable\
    \ Initialization\n\nVariable initialization refers to the process of assigning\
    \ a value to a variable. It is done with an equal sign followed by a constant\
    \ expression. Here is the general syntax for initialization: `variable_name =\
    \ value;`. As we mentioned earlier, variables can be initialized during their\
    \ declaration. Here are some more examples:\n\n```c\nint x = 1, y = 6; /* x and\
    \ y initialization. */\nbyte f = 22; /* initializes f. */\ndouble pi = 3.14159;\
    \ /* declare a approximation of pi. */\nchar a = 'a'; /* the variable a has the\
    \ value 'a'. */\n```\n\nVariable initialization should be done correctly; otherwise,\
    \ the program may produce unexpected results.\n\nFor example: \n```csharp\nusing\
    \ System;\nnamespace VariableDeclaration {\n    class MyProgram {\n        static\
    \ void Main (string [] args) {\n            short x; int y; double with; /* actual\
    \ initialization of variables */\n            x = 5; y = 10; z = x + y; \n   \
    \         Console.WriteLine (\"x = {0}, y = {1}, z = {2}\", x, y, z); \n     \
    \       Console.ReadLine (); \n        }\n    }\n}\n```\n\nThe code returns the\
    \ following:\n`x = 5, y = 10, z = 15`\n\n## Retrieving User Input\n\nThe `Console`\
    \ class of the `System` namespace has a method called `ReadLine()` that allows\
    \ us to get input from the user. User input is read and stored in a variable.\
    \ The following example shows how to use this method:\n\n```csharp\nusing System;\n\
    namespace UserInputApp {\n    class MyProgram {\n        static void Main (string\
    \ [] args) {\n            name = \"Santa\"; string name = \"Samuel\"; \n     \
    \       Console.WriteLine (\"Your first name is:\" + firstname + \"\" + lastname);\
    \ \n            Console.WriteLine (\"Please enter and various first Name:\");\n\
    \            FirstName = Console.ReadLine ();\n            Console.WriteLine (\"\
    Your new name is:\" + firstName + \"\" + lastName); \n            Console.ReadLine\
    \ ();\n        }\n    }\n}\n```\n\nWhen prompted to enter a new value for the\
    \ first, do so and your name has changed.\n\n## Operators\n\nOperators are symbols\
    \ that instruct the compiler to perform logical or arithmetic manipulation. C\
    \ has a variety of operators. Let's discuss them.\n\n### Arithmetic Operators\n\
    \nThey are used to perform various arithmetic operations. They can be used as\
    \ shown in the example below:\n\n```csharp\nusing System;\nnamespace ArithmeticOperatorsApp\
    \ {\n    class MyProgram {\n        static void Main (string [] args) {\n    \
    \        int x = 3; int y = 10; int with;\n            z = x + y; Console.WriteLine\
    \ (\"1 - {0}\", z);\n            z -= y; Console.WriteLine (\"2 - {0}\", z);\n\
    \            z = x * y; Console.WriteLine (\"3 - {0}\", z);\n            z = x\
    \ / y; Console.WriteLine (\"4 - {0}\", z);\n            z = x % y; Console.WriteLine\
    \ (\"5 - {0}\", z);\n            z = x ++; Console.WriteLine (\"6 - {0}\", z);\n\
    \            z = x; Console.WriteLine (\"7 - {0}\", z); \n            Console.ReadLine\
    \ ();\n        }\n    }\n}\n```\n\nMost of the above operators are well known,\
    \ except for a few of them. `++` is an increment operator and increments the value\
    \ of the variable by 1 for each iteration. `-=` is an increment operator and decreases\
    \ the value of the variable by 1 after each iteration. `%` is known as the modulus\
    \ operator and returns the remainder after division. The code returns the output\
    \ below:\n\n![Image](images/image-12.jpeg)\n\n### Logical Operators\n\nC also\
    \ has many logical operators. Let's discuss them briefly:\n\n- Logical AND (`&&`):\
    \ condition is true if both operands are nonzero.\n- Logical OR (`||`): condition\
    \ is true if any operand is nonzero.\n- Logical NOT (`!`): the operator reverses\
    \ the logical state of the operand. If the condition is true, this operator will\
    \ change it.\n\nThe following example shows how to use the above operators:\n\n\
    ```csharp\nusing System;\nnamespace LogicalOperatorsApplication {\n    class MyProgram\
    \ {\n        static void Main (string [] args) {\n            bool x = true; bool\
    \ y = true;\n            if (x && y) {\n                Console.WriteLine (\"\
    1: The condition is true\");\n            }\n            if (x || y) {\n     \
    \           Console.WriteLine (\"2; The condition is true\");\n            }\n\
    \            /* let's change x and y values */\n            x = false; y = true;\n\
    \            if (x && y) {\n                Console.WriteLine (\"3: The condition\
    \ is true\");\n            } else {\n                Console.WriteLine (\"3: The\
    \ condition is not true\");\n            }\n            if (! (x && y)) {\n  \
    \              Console.WriteLine (\"4: The condition is true\");\n           \
    \ }\n            Console.ReadLine ();\n        }\n    }\n}\n```\n\nThe code returns\
    \ the following output:\n![Image](images/image-13.jpeg)\n\n### Assignment Operators\n\
    \nC assignment operators can be used as shown in the following example:\n\n```csharp\n\
    class MyProgram {\n    static void Main (string [] args) {\n        int x = 3;\
    \ int with; z = x; Console.WriteLine (\"1: value of z = {0}\", z);\n        z\
    \ += x; Console.WriteLine (\"2: + = {0}\", z);\n        z -= x; Console.WriteLine\
    \ (\"3: - = {0}\", z);\n        z *= x; Console.WriteLine (\"4: * = {0}\", z);\n\
    \        z /= x; Console.WriteLine (\"5: / = {0}\", z);\n        z = 100; z %=\
    \ x; Console.WriteLine (\"6: % = {0}\", z);\n        z <<= 2; Console.WriteLine\
    \ (\"7: << = {0}\", z);\n        z >>= 2; Console.WriteLine (\"8: >> = {0}\",\
    \ z);\n        z &= 2; Console.WriteLine (\"9: & = {0}\", z);\n        z ^= 2;\
    \ Console.WriteLine (\"10: ^ = {0}\", z);\n        z |= 2; Console.WriteLine (\"\
    11 | = {0}\", z);\n        Console.ReadLine ();\n    }\n}\n```\n\nThe code returns\
    \ the following result:\n![Image](images/image-14.jpeg)\n\n## Chapter 4: Sequence\
    \ and List\n\n`List<T>` is the collection class that is commonly used in all collection\
    \ classes. It is a type whose main feature is index accessibility of the element.\
    \ As mentioned earlier, the List class is part of the `System.Collections.Generic`.\
    \ `List` is a class that provides many methods for manipulating the list and items.\
    \ Some of them are searching, sorting, etc. It is used to create collections of\
    \ many different types. It can be a collection of integers, strings, and more.\
    \ For reference types, `List` allows `null` as an element. It is also possible\
    \ to insert duplicate values in any List collection. This class can use both ordering\
    \ and equality comparison. Arrays are similar to lists, but lists can resize dynamically,\
    \ but arrays cannot.\n\n### String\n\nThe `string` data type in C is a type that\
    \ represents text and works with text variables. This is an array of characters.\
    \ Declaring a data type of string is done using the string keyword. When a string\
    \ keyword is used, it means it refers to the `System.String` class (the classes\
    \ will be explained later in this book). There are many extension methods that\
    \ can be used for some string variables. Some of the most popular are `Concat`-that\
    \ is, concatenating two strings, `Contains`-determines whether a string contains\
    \ a given string from a parameter as the passed value, `Equals`-which determines\
    \ whether two strings have the same value, and so on. The default string type\
    \ is an empty string.\n\n## Chapter 5: Syntax\n\nLoop structure statement\n\n\
    In real life, we often say the same thing over and over again. For example, when\
    \ you scratch your eyes in the fourth round of eye exercises, you will repeat\
    \ the eye scraping act. When you play table tennis, you repeat the swing and so\
    \ on. There is an instruction in C that can execute the same block of code multiple\
    \ times, which is called a circular instruction. Loop statements fall into three\
    \ types: the `while` statement, the `do...while` statement, and the `for` statement.\n"
