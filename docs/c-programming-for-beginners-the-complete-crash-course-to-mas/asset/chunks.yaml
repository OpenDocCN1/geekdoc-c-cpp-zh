- fmt: "\nFor each person, we create a `PersonalInformation` object to properly instantiate\
    \ the `Person` object. Each `PersonalInformation` object has a `firstName`, `lastName`,\
    \ and a `personalID` passed to its instance. This way, we created a slightly more\
    \ complex object that contains another class object within it. Ok, we're ready\
    \ to go.\n\nThe manager asks us to find each name of an employee who is considered\
    \ senior and has an ID card less than one hundred and fifty. Based on the previous\
    \ example, we decided that the senior is a `Person` with a `Salary` over three\
    \ thousand (3000). We are doing something similar to the previous example, but\
    \ this time the `Person` class has changed. It does not have the same structure\
    \ as the previous example. Therefore, we first need to analyze the class structure\
    \ and then create the solution.\n\nThe first step is to filter out the `Person`\
    \ objects from the list of people who have a `salary` greater than 3000. Next,\
    \ we need to get the `PersonalInformation` object from each `Person` object to\
    \ find the names of all seniors. Then when `PersonalInformation` objects are collected,\
    \ we have to filter them and take only those with `personalID` that are less than\
    \ 150. When this task is done we can finally select the `firstName` property of\
    \ all seniors, make a list from it, iterate through that list and print the `firstName`\
    \ values. All this is done in a low-complexity LINQ query, from which we create\
    \ a list variable `seniorsLT150`.\n\nThe first `Where` method creates an `IEnumerable`\
    \ seniors list. The `Select` method then takes the `PersonalInformation` objects\
    \ from the seniors list and creates an `IEnumerable` list of `PersonalInformation`\
    \ objects for seniors. The second `Where` method works with `PersonalInformation`\
    \ objects from the previously created `IEnumerable` list and we will filter `PersonalInformation`\
    \ an object that has a `personalID` less than 150. We then execute a `Select`\
    \ method that collects the value of the `firstName` property for each Senior `PersonalInformation`\
    \ object that has a `personalID` less than 150. Finally, we execute the method's\
    \ `ToList()` method over the final `IEnumerable` we created and the product trailing\
    \ is a list of strings containing the first name of each senior with a personal\
    \ identifier less than 150. The only senior who will meet these criteria is Mike\
    \ Dean, and his name will be printed on the standard output. The console output\
    \ of the program is below:\n\n![Image](images/image-29.jpeg)\n\n# Chapter 8: Decision-making\
    \ program\n\n## Decision-making\n\nNot all problems are solved linearly, sometimes\
    \ it is necessary to make a decision or take certain actions when a condition\
    \ is true and others when not. Suppose our problem is keeping the temperature\
    \ of a bucket of water. For this we can add hot or cold water. In this problem,\
    \ we would have to decide what water to add. Likewise, there are many problems\
    \ that we need to know how to solve. C is easy to achieve because the language\
    \ provides us with various tools to deal with it. We will have to use expressions\
    \ that will be needed. In this cases, we will use conditional expressions and\
    \ logic expressions that will be needed depending on the result of this situation.\
    \ Let's start by getting to know expressions we need.\n\n### Making decisions\n\
    \nWhile in C, we need to spend some time working with control statements or conditional\
    \ statements. These will be the kinds of codes that can take input from the user,\
    \ compare it to the conditions set in the code, and then make decisions based\
    \ on both. There will be times when you type out and you want to make this program\
    \ handle decisions by itself. You can choose to write it so that there are conditions\
    \ to find in the code and then the code can respond based on user input. The good\
    \ news is that there are few options from which you can pick conditional statements.\
    \ Each of them will work in a different way depending on what you hope to get\
    \ from the program and how you want it to respond to different input. By going\
    \ through the different options, you'll better able to see how each of them works\
    \ and why it's great to pick along the way. Let's look at some conditional statements\
    \ available in C.\n\n#### If statement\n\nThe first kind of conditional statement\
    \ we want to look at is the `if` statement. Of all conditional statements we will\
    \ review, this is going to be the most basic. It omits some of the features we'll\
    \ see in statements but it helps us learn more about conditional statements and\
    \ can be useful in some situations so it's important to learn. When you deal with\
    \ this `if` statement, you will find that when you run it, the code will only\
    \ respond to us if the user provides us with input that complies with the conditions\
    \ set in the code. When that happens, the code will be able to execute and usually\
    \ some sort of message will appear, depending on what the developer puts in the\
    \ code. Sometimes you'll set it up to do something else well. However, if a user\
    \ goes through enters data that does not match the conditions we have set, nothing\
    \ will appear on the screen. This can cause problems, so the `if` statement might\
    \ not be used as often as some of the other options. The good news with all of\
    \ this is that even as a beginner you will find that these statements are easy\
    \ to set up and work with. Let's look at encoding below to see how we can create\
    \ one of these `if` statements in C for our own purposes:\n\n```c\nif (x > 0)\n\
    {\n    Console.Write(\"The value is positive.\");\n}\n```\n\nIn the example mentioned\
    \ above, some things have to happen. If the value entered by the user is greater\
    \ than zero, then the program is set to print \"Value is positive\". However,\
    \ if the expression is false or the input is less than zero, the program ignores\
    \ all the statement that comes after the console. Write and I will go further.\n\
    \n#### If Else statement\n\nAs we can tell fairly quickly, when working with `if`\
    \ statements, there will be many occasions where those `if` statements will not\
    \ be able to help us get done the way we want. You don't want to set codes that\
    \ aren't enough to handle the job you want. It's never a good idea to create code\
    \ where the user can insert something and then the program just exits or hangs.\
    \ And here we take a look at a new conditional statement known as `if-else` statement.\n\
    \nThe `if-else` statement will be fun to work with as it adds a lot of power to\
    \ the code we do and write, while also allowing us to add more than one option\
    \ and handle almost anything the user adds.\n"
