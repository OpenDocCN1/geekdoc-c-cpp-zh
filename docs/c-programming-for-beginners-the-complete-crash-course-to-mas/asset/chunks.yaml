  trans: '

    除了普通类之外，还有一种特殊的类 - **抽象类**。抽象类是一种特殊的类，无法对其进行实例化。抽象类最常用于定义层次结构中的基类，也被称为不完全类。抽象类通常表示一个基类，其设计用于包含实现抽象定义的派生类。在抽象类中，可以有抽象方法，也可以有非抽象方法。抽象方法以及任何标记为
    `abstract` 的元素都必须在派生类中实现。标记有 `abstract` 关键字的类旨在为派生类提供原型。抽象类可以实现一个构造函数。


    ![Image image-16)


    在给出的示例中，我们有一个名为 `Animal` 的抽象类。该类中只有一个成员，即抽象方法 `void Sound()`。将一个方法设为抽象意味着任何派生自该类的类（在本例中为
    `Animal` 类）都必须重写其实现。在抽象类下面，有两个被称为“普通”的类。这两个类都重写了 `Animal` 类中 `Sound()` 方法的实现。这是因为
    `Elephant` 和 `Pig` 类都继承自 `Animal`。继承将在下一章详细解释，但目前 `Elephant` 和 `Pig` 旁边的符号意味着它们继承自
    `Animal`。在这种情况下，意味着它们必须拥有来自基类的抽象方法的实现。在 `Program` 类的 `Main` 方法中，声明了一个类型为 `Animal`
    的名为 `animal` 的变量。


    没有 `Animal` 类的实例，因为这是可能的，原因是 `Animal` 是抽象类 - 所以无法创建。在下一行，程序在变量 `animal` 中创建了一个
    `Elephant` 对象的实例。这是允许的，因为 `Animal` 是 `Elephant` 类的基类。随后通过变量 `animal` 调用了 `Sound()`
    方法。此外，由于 `animal` 实例是 `Elephant` 类型，此调用执行了 `Elephant` 类的 `Sound()` 方法。下一步是实例化
    `Pig` 对象并将其赋值给同一个 `animal` 变量。这导致再次从 `animal` 对象调用 `Sound()` 方法。这次使用了来自 `Pig`
    类的 `Sound` 实现。


    ![Image image-17)


    ### 对象


    C# 中的对象代表系统中的真实实体，具有所有的特性和类类型函数。它们存在于内存中的某处，并对内存有引用。每当使用 `new` 关键字时，内存中就会创建一个对象。对象必须是类类型。用
    C# 语言编写的每个类都继承自 `System.Object`（继承将在后面的章节中解释）。这意味着 C# 中有一个内置的 `Object` 类，任何类型的对象都继承自该类。每个创建的对象除了具有自己的功能外，还具有其父类
    `Object` 可用的方法。这些方法是：`Equals`、`ToString`、`Finalize` 和 `HashCode`。可以通过一个示例来检查：


    ![Image image-18)


    此示例使用了之前在“类”节中所示 `TShirt` 类。在 `Main` 方法中创建了一个 `TShirt` 类类型的对象。该对象由变量 `tshirt`
    引用。在第二行中，你可以看到在 `tshirt` 对象上可以执行的可用方法和属性。除了属于 `TShirt` 部分的 `Color` 属性和 `About`
    方法外，还存在来自父类 `Object` 的四个方法（`Equals`、`HashCode`、`GetType`、`ToString`）。


    ### 接口


    面向对象编程的另一个重要部分是**接口**。接口表示函数的多个声明。一个类可以实现一个或多个接口，但只能继承一个类或抽象类。这是 C# 编程的另一个特性 -
    它不支持多继承。实现接口的类必须包含所有成员的完整定义。接口中没有访问修饰符，因为所有成员都是 `public`。如果一个类需要实现接口成员，这意味着这些成员必须是公共的，以便它们被其他类实现。接口是一个具有声明的对象组件。如果你尝试向接口中插入实现，将得到错误。接口可以包含属性和方法
    - 即实现可以有的任何内容。它不能拥有字段和构造函数，因为它不是类且无法创建。实现接口时，类必须实现所有成员。如所述，C# 不支持继承，但可以通过接口实现，因为类可以实现多个接口。示例：接口可以包含属性和方法
    - 实现可以有的任何内容。


    ![Image image-19)


    在这里我们定义了一个接口。它内部三个属性。实现此接口的类必须具有所有这些接口元素的定义。


    ![Image image-20)


    程序包含一个类，即 `Person`。该类实现了声明的 `IPerson` 接口。该类有两个私有字符串字段，分别为 `_firstName` 和 `_lastName`。它还有一个构造函数，向其中分配这些字段值。此外，该类对三个
    `IPerson` 接口成员有定义 - `IsRunning`、`IsStanding` 和 `IsSitting` 属性。编译器接受这一点，因为没有错误。但如果我们从
    `Person` 类中移除这三个属性中的任一个一个，编译器将抛出错误：


    ![Image image-21)


    此时，我们注释了 `Person` 类中的 `IsRunning` 属性。编译器报告错误，指出 `Person` 类没有实现此属性，且程序无法编译。然后我们取消该属性的注释，回到程序的正确状态。让我们创建一个带有内置
    `Main` 方法的 `Program` 类。在那里，我们将创建一个 `Person` 类的实例并运行程序以检查是否一切都运行正常。


