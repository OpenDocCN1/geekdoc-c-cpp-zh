  trans: "\n对于每一个人，我们都创建一个 `PersonalInformation` 对象来正确地实例化 `Person` 对象。每个 `PersonalInformation`\
    \ 对象都包含一个传递给其实例的 `firstName`、`lastName` 和 `personalID`。通过这种方式，我们创建了一个稍微复杂的对象，它内部包含了另一个类对象。好了，我们准备好了。\n\
    \n经理要求我们找到所有被认为是资深员工且 ID 卡号小于 150 的员工姓名。根据之前的示例，我们决定资深员工是指 `Salary` 超过 3000 (3000)\
    \ 的 `Person`。我们正在执行与上一个示例类似的操作，但这次 `Person` 类发生了变化。它的结构与之前的示例不同。因此，我们首先需要分析类结构，然后创建解决方案。\n\
    \n第一步是从人员列表中筛选出 `salary` 大于 3000 的 `Person` 对象。接下来，我们需要从每个 `Person` 对象中获取 `PersonalInformation`\
    \ 对象，以找到所有资深人员的姓名。然后，当收集了 `PersonalInformation` 对象后，我们必须对它们进行过滤，只保留 `personalID`\
    \ 小于 150 的对象。完成这项任务后，我们最终可以选择所有资深人员的 `firstName` 属性，基于其创建一个列表，遍历该列表并打印 `firstName`\
    \ 值。这一切都是通过一个低复杂度的 LINQ 查询完成的，我们通过该查询创建了一个列表变量 `seniorsLT150`。\n\n第一个 `Where`\
    \ 方法创建了一个 `IEnumerable` seniors 列表。然后，`Select` 方法从 seniors 列表中获取 `PersonalInformation`\
    \ 对象，并创建一个包含资深人员 `PersonalInformation` 对象的 `IEnumerable` 列表。第二个 `Where` 方法作用于之前创建的\
    \ `IEnumerable` 列表中的 `PersonalInformation` 对象，我们将过滤出 `personalID` 小于 150 的 `PersonalInformation`\
    \ 对象。然后我们执行 `Select` 方法，收集每个 `personalID` 小于 150 的资深人员 `PersonalInformation` 对象的\
    \ `firstName` 属性值。最后，我们在创建的最终 `IEnumerable` 上执行方法的 `ToList()` 方法，其结果是一个包含每个个人标识符小于\
    \ 150 的资深人员姓名的字符串列表。唯一符合这些标准的资深人员是 Mike Dean，他的名字将打印在标准输出上。该程序的控制台输出如下：\n\n![Image](img/image-29.jpeg)\n\
    \n# 第 8 章：决策程序\n\n## 决策\n\n并不是所有问题都是线性解决的，有时在条件为真时需要做出决策或采取某些动作，而在其他时候则不需要。假设我们的问题是保持桶水的温度。为此我们可以添加热水或冷水。在这个问题中，我们必须决定添加什么水。同样，有很多问题我们需要知道如何解决。C\
    \ 语言很容易实现，因为语言为我们提供了各种工具来处理。我们将不得不使用所需的表达式。在这些情况下，我们将根据这种情况的结果使用所需的条件表达式和逻辑表达式。让我们从了解我们需要的表达式开始。\n\
    \n### 做出决策\n\n在 C 中，我们需要花费一些时间处理控制语句或条件语句。这些代码可以从用户获取输入，将其与代码中设置的条件进行比较，然后根据两者做出决策。有时你输入了内容，并希望这个程序能自己处理决策。你可以选择编写代码，使得代码中可以找到条件，然后代码可以根据用户输入做出响应。好消息是，有几种条件语句供你选择。每种语句的工作方式都不同，取决于你希望从程序中得到什么以及你希望它如何对不同的输入做出响应。通过学习不同的选项，你将更好地理解每种语句的工作原理，以及为什么在过程中进行选择是很有意义。让我们看看\
    \ C 中可用的条件语句。\n\n#### If 语句\n\n我们想要查看的第一种条件语句是 `if` 语句。在我们将审查的所有条件语句中，这是最基础的。它省略了一些我们在其他语句中看到的特性，但它帮助我们学习更多关于条件语句的知识，并在某些情况下有用，因此学习它是重要的。当你处理这个\
    \ `if` 语句时，你会发现当运行它时，只有当用户提供的输入符合代码设置的条件时，代码才会对我们响应。当这种情况发生时，代码将执行，通常会显示某种消息，取决于开发者在代码中编写了什么。有时你也会设置它来执行其他操作。然而，如果用户输入了不符合我们设置的条件的数据，屏幕上什么都不会出现。这可能会导致问题，因此\
    \ `if` 语句可能不像其他某些选项那样被频繁使用。这一切的好消息是，即使是初学者，也会发现这些语句也很很容易设置和使用。让我们看看下面的编码，看看我们如何为了自己的目的在\
    \ C 中创建一个这样的 `if` 语句：\n\n```c\nif (x > 0)\n{\n    Console.Write(\"The value is\
    \ positive.\");\n}\n```\n\n在上述示例中，某些事情必须发生。如果用户输入的值大于零，则程序设置为打印“Value is positive”。然而，如果表达式为假或输入小于零，程序将忽略\
    \ `Console.Write` 之后的所有语句。我将进一步详细说明。\n\n#### If Else 语句\n\n我们可以很快地发现，在处理 `if`\
    \ 语句时，会有很多情况这些 `if` 语句无法帮助我们按照想要的方式完成任务。你不想编写不足以处理你想要的工作的代码。创建一个让用户可以插入内容然后程序直接退出或挂起的代码绝不是一个好主意。在这里我们来看一种名为\
    \ `if-else` 语句的新条件语句。\n\n`if-else` 语句处理起来会很有趣，因为它为我们编写的代码增加了许多功能，同时允许我们添加多个选项并处理用户添加的几乎任何内容。\n"
- fmt: "\nTo get to the bottom of it, we need to look at the `if-else` statement syntax\
    \ to better understand how this will work in C#. A good syntax example for this\
    \ would be below:\n\n```csharp\nIf (logical expression)\n{\n    // Instructions\
    \ you want to run if the result is true\n}\nElse\n{\n    // Instructions you want\
    \ to run if the result is false;\n}\n```\n\nAs you can see in this case, the `if-else`\
    \ statement will provide a lot more power. This is the basic option with an `if-else`\
    \ statement, but you can add more lines to make it more efficient. For these `if-else`\
    \ statements, if the answer is false, your code will go to the next section of\
    \ the statement to see if this is true. If there are more than two options, it\
    \ will traverse the `if-else` statement until the answer is true, then it will\
    \ go through and display the message that appears.\n\nNow that we've taken the\
    \ time to talk about it, it's time to take a look at an example of how this will\
    \ work so that you can use it in your codes:\n\n```csharp\nIf (x > 0)\n{\n   \
    \ Console.Write (\"This value will be positive.\");\n}\nElse\n{\n    Console.Write\
    \ (\"The value is less than or equal to zero.\")\n}\n```\n\nYou will find that\
    \ when we work with the example above, the `else` clause will be valid, or at\
    \ least hidden, until the `logical expression` is false. It's there when the process\
    \ needs an `else` statement. But if we end up with a true value, the first statement\
    \ will be the next statement, so we won't need an `else` statement at all.\n\n\
    ### What is the nested conditional statement\n\nEvery time we review some of the\
    \ new codes that ship with C#, you should find that it is easier to work with\
    \ two statements that we had above, or you can combine them to create a nested\
    \ conditional for some codes as well. In the case of a nested conditional statement,\
    \ we'll take one of the above types of conditional statements and put it inside\
    \ another. The purpose of this is to add more complexity to the work we want to\
    \ see with coding, and can really give us a chain of conditions when we need them.\n\
    \nThe most important thing we need to focus on when it comes to handling nested\
    \ conditional statements is that if there is any error writing the statements\
    \ it will cause an error on the whole thing and it may take some time to fix.\
    \ This makes them a bit difficult to handle and work along the way, so be careful.\n\
    \nHowever, the cool thing about them, and something that will make them quite\
    \ attractive, is that they allow us to add as many or as many levels as we would\
    \ like. Even with that in mind, most experts in the language recommend that nested\
    \ sentences stay at three levels or less so that they don't become too much of\
    \ a mess along the way. If you go over the third level while working on these\
    \ statements, you may end up with something that is unruly and does not behave\
    \ the way you want or may not even work. As a beginner, stick to three levels\
    \ and move on as you get better with coding. There are many codes you can write\
    \ that will be based on these conditional statements. They help to fortify the\
    \ code and ensure that we are able to handle some of the input our users give\
    \ us, even if we are unable to guess in advance what response the user will add\
    \ to the program. They may base our input on any terms we set and will ensure\
    \ that the program behaves in the manner that we prefer. This makes it much easier\
    \ for us to see the results and make sure that the program works the way we want.\n\
    \n# Chapter 9: The Network\n\n## .NET Framework\n\nPrograms written under this\
    \ kind of framework will be able to run in the software environment, not the hardware\
    \ environment known as `CLR` or Common Language Runtime. The `CLR` will be an\
    \ application virtual machine that will help us provide variety of services including\
    \ security, exception handling, and memory management. For this reason, code written\
    \ with this framework will be managed code. Both `CLR` and `BCL` we talked about\
    \ build the .NET framework.\n\nFirst, `BCL` will be valid. It provides us with\
    \ part the user interface, data access, application development, algorithms, network\
    \ communication and much more. Developers can create software by bundling source\
    \ with .NET platform and other available libraries. It is a framework that has\
    \ been designed to work with most of the new applications we want to create on\
    \ the Windows platform. Additionally, Microsoft intends to create an IDE dedicated\
    \ to .NET software known as Visual Studio. There are many things we can work when\
    \ it comes to the .NET framework. Some methods have been developed to work not\
    \ only on Windows but also other operating systems including Linux and Mac. And\
    \ it can help us work with different languages, especially C#, being portable,\
    \ efficient and good at managing the memory when writing codes.\n\nTo be able\
    \ to program effectively in C#, you need little theoretical knowledge related\
    \ to the so-called .NET framework. This is why .NET framework is integral part\
    \ of this book. Before we get more involved with the .NET platform, it is important\
    \ to know that it is integral part of .NET technology. The job of a runtime is\
    \ essentially to execute code developed in the appropriate programming language.\
    \ However, in the past, you had to provide a separate runtime library (runtime\
    \ library) for each programming language - and part also for each version - in\
    \ order to execute the appropriate programs. For example, C++ `MSVCRT.DLL`, and\
    \ in Visual Basic 6, `MSVBVM60.DLL`. The concepts of the delivered runtimes have\
    \ been and are fundamentally different today. Multiple language support provides\
    \ key benefits of the .NET framework:\n\n- Only one framework is needed.\n- Different\
    \ (and very different) programming languages can be used, depending on your level\
    \ of knowledge and personal preferences.\n- There is exactly one runtime environment\
    \ for all programming languages.\n\nFurther conclusions can be drawn from these\
    \ advantages:\n\n- **Inter-linguistic integration**: Cross-language exception\
    \ handling (exception handling refers to how a program should respond when events\
    \ that are not generally expected, such as errors, occur).\n- **More security**:\
    \ (you can control security down to the method level)\n- **Simplified versioning**:\
    \ (several versions may exist side by side)\n\nBecause the .NET framework provides\
    \ a multilingual runtime, it ensures interaction and optimal collaboration between\
    \ the components of different programming languages. You already know that .NET\
    \ framework is part of .NET technology and what it has to do. The .NET framework\
    \ again consists of three components:\n\n1. Common Language Runtime - multilingual\
    \ runtime\n2. Libraries (Learn about classes and libraries later)\n3. ASP.NET\
    \ - server applications for the World Wide Web\n\nWe will discuss these three\
    \ elements in detail in this book. The common language runtime and libraries will\
    \ appear repeatedly throughout the book, as will `ASP.NET` in the context of web\
    \ services. Two components - the common language runtime and libraries of the\
    \ .NET framework are also referred to as the base framework.\n\n## Discover .NET\n\
    \nThe .NET framework is the solution to all the problems associated with application\
    \ development, giving great benefits not only to developers, but also to the development\
    \ process. First of all .NET allows us to work with existing code; we can use\
    \ COM components, and even in a situation where we need to use the Windows API.\
    \ Once .NET is ready, it is much easier to install on the client machine because\
    \ it has strong cross-language integration.\n"
