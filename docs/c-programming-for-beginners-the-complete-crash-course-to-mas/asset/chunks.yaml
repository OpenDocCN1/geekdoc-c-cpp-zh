  trans: "\nC# 有多种编译器选项可以让初学者的学习变得更加轻松顺畅；对于本书，我们将使用 Visual Studio 2010 附带的 C# 4.0\
    \ 版本。不过，也可以使用较新或较旧的版本。大多数示例都可以无问题地编译并运行。\n\n如果我们无法获得 Visual Studio 2019 的专业版，社区版（Community\
    \ edition，以前称为 Express 版）是一个更好的选择。该版本是免费的，可以直接从网上下载；您只需要完成一份简短调查即可。要免费下载 C# Studio\
    \ 编译器（社区版），您可以访问门户网站。下载编译器后我们就可以进行安装；此任务与安装任何其他程序非常相似，但不要忘记在 30 天内进行注册。\n\n安装完成后，您可以通过\
    \ Windows 菜单中选择该程序来运行。您将看到一个显示应用程序界面的窗口。界面分为两个部分：左侧是一个名为“打开最近”（Open Recent）的搜索栏，通过输入关键词我们可以找到最新项目或解决方案的链接。在页右侧，我们将看到“创建新项目”、“打开文件夹”、“打开项目或解决方案”以及标题为“克隆”（Clone）或“检查代码”（Check\
    \ Code）的存储库选项。我们也可以在界面的相同部分接收使用 C# 进行开发的公告和新闻，但在浏览不同页面时会有不同的区域。这些编辑区域允许我们编辑程序代码、编辑用户界面和其他资源。\n\
    \n编辑程序代码是一项非常简单的活动，如果我们知道如何使用 Microsoft Word 或记事本等任何类型的文字处理器，就不必担心，然后就可以编辑程序代码。其他编辑器也非常易用，但我们不需要它们来遵循书中的示例。\n\
    \n在右侧我们有一个名为“解决方案管理器”（Solution Explorer）的窗口，在同一区域还有其他窗口，提供有关我们正在开发的项目的信息。我们将在本书稍后的部分看到其中一些窗口显示的详细信息。\n\
    \n![Image](img/image.jpeg)\n\n在底部我们找到了另一个窗口；在该区域通常有编译器用于与我们通信的部分。例如，我们将看到一个指示程序存在错误的窗口；在窗口顶部我们将看到菜单和工具栏。如果由于某种原因关闭了源代码编辑器或它没有在我们的\
    \ UI 中显示，找到它的最简单方法是使用解决方案管理器。只需导航到代表您的源代码的文档并双击它，源代码编辑器窗口就会出现。\n\n如何创建我们的第一个应用程序\n\
    \n为了更好地理解 C# Visual Studio Express，最好创建并处理您的第一个项目。我们将创建一个小型程序，它将在控制台中向我们发送消息，然后我们将添加更多元素，以便探索不同的\
    \ UI。在 Visual Studio 2019 中创建新项目有几种主要方法。第一种简单地点击 Visual Studio 主界面右下角的“新项目”（New\
    \ Project）。然后在搜索框中输入并选择“应用程序 (.NET)”，然后点击“下一步”（Next），所示。\n\n![Image](img/image-1.jpeg)\n\
    \n然后配置您的新项目名称和位置，并点击“创建”。一旦设置，Visual Studio 会立即为您创建一个新项目。或者，要创建一个项目，我们可以选择“文件”（File）菜单，然后我们需要点击下方所示的“新项目”选项，通过这样我们将看到一个显示相关选项的对话框。\n\
    \n![Image](img/image-2.jpeg)\n\n对话框的右部分列出了我们可以创建的不同类型的项目；对于此示例，我们必须选择由控制台应用程序（console\
    \ application）指示的项目并点击“下一步”。注意：如果由于某种原因关闭了源代码编辑器或它没有在我们的 UI 中显示，找到它的最简单方法是使用解决方案管理器。只需导航到代表您的源代码的文档并双击它，源代码编辑器窗口就会出现。\n\
    \n![Image](img/image-3.jpeg)\n\n在左侧我们将编写项目名称，在这种情况下为 MyProject。我们创建的每个新项目将有一个名称；然后只需点击“创建”按钮。\n\
    \n![Image](img/image-4.jpeg)\n\n几秒钟内，C# Express 就为我们创建一个项目。Visual Studio 和社区版使用解决方案（solutions）和项目（projects），一个解决方案可以包含多个项目，例如，Office\
    \ 有 Word、Excel 和 PowerPoint 等不同产品。Office 是解决方案，每个产品是一个项目。项目可以是一个独立的程序或库，并包含一个或多个文档，这些文档可以是源代码和额外资源。\n\
    \n![Image](img/image-5.jpeg)\n\n我们可以看到我们的 UI 发生了一些变化，窗口已经在向我们显示信息，我们还可以看到程序的骨架显示在编辑框中。\n\
    \n![Image](img/image-6.jpeg)\n\n解决方案管理器以逻辑方式向我们展示有关解决方案的信息，如果我们观察它，它像一小树。在底部，我们找到了一个解决方案；解决方案中的每个项目都将是一个分支，每个项目反也有它自己的划分。在我们的情况下，我们看到了三个元素；其中两个项是文件夹；在其中一个保留项目属性，在另一个中保留引用（我们不会使用这些）。第四个是代表源代码的文档。我们使用的程序扩展名是\
    \ `.cs`。\n\n在编辑区域，我们需要理解命名空间（namespace）的概念：它是相关代码的分组。使用命名空间有助于避免命名冲突，因为只要在不同的命名空间中，你就可以同名的类。例如，你可以在一个命名空间拥有名为\
    \ `Customer` 的类，在另一个命名空间拥有另一个名为 `Customer` 的类。用于定义命名空间的关键字是 `namespace`。\n\n```csharp\n\
    namespace MyProject\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n\n        }\n    }\n}\n```\n"
- fmt: "\nAll programs need a starting point, a place that indicates where the program\
    \ execution begins. In C#, like in other languages, the starting point is the\
    \ `Main()` function; this function also has its own code block. As part of this\
    \ feature, we will usually put the main code of our application, although it is\
    \ possible to have more features or methods and classes. The parts and characteristics\
    \ of the functions can be found in Chapter 5 of this book.\n\nNow it's time to\
    \ create our first app. We are going to modify the function code as shown below.\
    \ When we add an instruction inside `Main()`, we must notice that it happens immediately\
    \ after placing the point.\n\n### Application compilation\n\nOnce we are done\
    \ writing our program, we can compile what we learned earlier; this will generate\
    \ an assembly that will then be used by the runtime after execution.\n\nTo compile\
    \ the application, we have to select the `Build` menu and then `Build Solution`\
    \ or simply press the `F6` key. The compiler will start running and we will see\
    \ in the status bar that our solution has compiled successfully.\n\n### To run\
    \ the application\n\nOnce the compilation is successful, we can run our program\
    \ and see how it works. For this we have two options: start with debugging and\
    \ execute without debugging. In the Express version there is only the debug execution,\
    \ but we can use the non-debugging execution with `CTRL + F5` or add it via the\
    \ `tools` menu.\n\nA debugger is a program that helps us fix runtime errors as\
    \ well as logical errors. It's best to use execution without a debugger and only\
    \ use execution with debugging when you need it. Now we will run our application;\
    \ to do this, press the `CTRL + F5` keys.\n\nWhen the program is executing, a\
    \ window we call the console appears and shows the execution of the program. In\
    \ this way, we can read the message we put in our example.\n\nSince this is an\
    \ introductory book on C# programming, we will be running all the programs on\
    \ the console. When you understand the main concepts, you can learn to program\
    \ shapes, forms, and graphical interfaces in C#. This type of programming is not\
    \ difficult, but requires a basic understanding of object-oriented programming.\n\
    \n### How to detect errors in the program?\n\nSometimes we can mis-write the program;\
    \ in this case, the application cannot be compiled or executed; if that happens,\
    \ we have to change what is wrong.\n\nLet's deliberately write the bug so we can\
    \ see how the compiler behaves.\n\nIn the program we changed 'Console' to 'Consoli'\
    \ and changed the order of 'namespace' 'HelloWorld', it will cause an error; now\
    \ we can try to compile again and see what happens.\n\n![Image](images/image-7.jpeg)\n\
    \nAs we already know, the window that appears at the bottom of our user interface\
    \ is used by the compiler for communication; we see that a window with a list\
    \ of errors appears. We will learn how to use it in the next book; for now, we\
    \ just need to know that it is always necessary to solve the first problem in\
    \ the list, and that we can go directly to the error by double-clicking on it.\n\
    \n Class view\n\nNow let's check the class view. In this view, we can get information\
    \ about the solution we are creating, but unlike Solution Explorer, the information\
    \ is arranged logically.\n\nWith this view, we can quickly find the namespaces\
    \ of our solution and the classes they contain; if we want, we can see the methods\
    \ that are in each class. This view not only allows us to observe logical information,\
    \ but also gives us the ability to quickly navigate our code.\n\nThere is no preconfigured\
    \ option in Community edition, so it is necessary to add a command to the `View`\
    \ menu.\n\nTo view the class view we have to go to the `View` menu and then select\
    \ `Class View` or by simply pressing `Ctrl + W, C` a window will appear in our\
    \ UI.\n\n![Image](images/image-8.jpeg)\n\nThe class view window is divided into\
    \ two sections; the top section shows the logical and hierarchical relationship\
    \ of the elements, while the bottom section shows the methods that make up a particular\
    \ class.\n\n![Image](images/image-9.jpeg)\n\nAt the base of the we find the design;\
    \ will contain the necessary references and `HelloWorld` namespaces. If we had\
    \ more, they would appear when we open the `HelloWorld` namespace we find occupied\
    \ classes. In this case, we only have the `Program` class; if we choose it, we\
    \ will see the items that are declared inside at the bottom. In our example, we\
    \ have `Main()` method.\n\nIf at this point we double-click any of the, we will\
    \ automatically go to the code in which it is defined. Since our program is very\
    \ small, we may not see the benefits of it but in programs with thousands of lines,\
    \ the ability to navigate is great.\n\n Compiler menu configuration\n\nTo add\
    \ the options we need to the menu, need to follow a series of very simple steps.\
    \ First, go to the `Tools` menu and select `Customize`. A dialog will appear which\
    \ we need to select `Commands`; in this section, we can select the menu which\
    \ we want to add the command, for example, the `View` menu.\n\n![Image](images/image-10.jpeg)\n\
    \nThe current commands are displayed, click the area we want to insert a new command\
    \ and press the `Add` button. This will bring up a new dialog that shows all the\
    \ possible commands we can add classified. In categories we choose View, and in\
    \ commands Class, this command is the one that allows us to have class. The `Start\
    \ Debugging` command is located in the Debugging category.\n\n![Image](images/image1.jpeg)\n\
    \nUp to this point, we have the most important basic concepts needed to understand\
    \ .NET. We'll start with the next chapter by learning programming and the C# language.\
    \ C# main functions\n\nC# is a new, object-oriented programming language that\
    \ enables developers to quickly write various applications based on the .NET platform.\
    \ .NET provides a range of tools and services that maximize the development and\
    \ use of fields of computing and communication. With an excellent object-oriented\
    \ design in C#, it is an ideal solution for building a variety of components -\
    \ whether it's a high-level business or system-level application. The features\
    \ of the C# language are mainly manifested in the following aspects:\n\n- Designing\
    \ applications.\n- Customize the Windows Library.\n- Application Design.\n- Designing\
    \ applications for smart devices.\n- Designing .NET Web Application.\n- Designing\
    \ .NET Web Service.\n- Designing .NET Mobile Web Application.\n- Customize the\
    \ web control library.\n\n.NET is a control and markup developed based on C#.\
    \ In the field of intermediate language, C# is the most affinity language that\
    \ has the main features of C and Java, a powerful library of functions, and a\
    \ convenient template, and is one of the ideal languages nowadays.\n\n# C# almost\
    \ combines the advantages of today's high-level languages and has the following\
    \ main features.\n\n* Concise grammar*\n\nThe C# language, like the Java language,\
    \ uses unified operators, eliminates complex expressions and pseudo-keywords in\
    \ C++, and makes it described in the simplest and most common form.\n\n* Excellent\
    \ object-oriented design*\n\nThe C# language is designed with the idea of object-orientation,\
    \ so it has all the features that an object-oriented language should have, namely\
    \ encapsulation, inheritance, and polymorphism.\n\nC# only allows single inheritance,\
    \ which means that a class does not have multiple base classes, thus avoiding\
    \ confusion in the type definition. In C#, each type is an object, so there are\
    \ no concepts such as global function, global variable, and global constant. All\
    \ constants, variables, attributes, methods, indexes, events etc. must be encapsulated\
    \ in classes, which makes the code more readable and reduces the possibility of\
    \ name conflicts.\n\n* Close integration with the network*\n"
