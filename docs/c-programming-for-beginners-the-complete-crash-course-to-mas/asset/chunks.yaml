    Language-integrated query, better known as LINQ, represents query syntax in the
    C# programming language and is used to get and filter a variety of object sources.
    LINQ creates a single query interface for different kinds of objects and variables.
    This query syntax is integrated with the C# programming language as well as Visual
    Basic. For a better understanding, we will give an example that will explain it
    in more detail. Therefore, you have `SQL` as your structured query language. `SQL`
    is used to retrieve and save some data in the database. It is a language designed
    to work closely with the database.


    In the same way as `SQL`, LINQ is used to retrieve and filter various data sources
    such as collections, datasets, and so on. LINQ can be used in many ways; is used
    to query collections of objects, ADO.NET datasets, XML documents, Entity Framework
    datasets, SQL Database direct, and different data sources by realization practical
    interface. LINQ is like a bridge between some data and variables in a program.
    Each LINQ query returns the objects as a result. This is good because it allows
    an object-oriented approach to the dataset. When using LINQ, you do not need to
    worry about conversion this configurations With data down items. LINQ provides
    a way to query data from anywhere it comes from. Supports compile-time syntax
    checking so that if you make a mistake while encoding LINQ the compiler will inform
    you immediately.


    LINQ allows you to query any collection such as `List`, `Array`, `IEnumerable`
    classes, etc.


    We now turn to the examples:


    ![Image](images/image-23.jpeg)


    In this example, we have one class named `Car`. There are three properties in
    the `Car` class which are `TrunkCapacity`, `IsAutomatic`, and `IsTurboCharged`.
    Each property represents a read-only property and their initial state is set in
    the constructor of the `Car` class. The constructor takes three parameters and
    assigns their values to the properties listed above. In the `Main` method, we
    create a list of `Car` objects. The list of `Car` objects is populated in the
    declaration part, creating five `Car` objects with different values for the `TrunkCapacity`,
    `IsAutomatic`, and `IsTurboCharged` properties. Then we would filter the list
    and only take cars with automatic transmission. This will be done with a LINQ
    query. We create an object named `carsThatAreAutomatic` and filter it car list
    from LINQ. We then execute the `Where` LINQ extension method to get the objects
    we need. How it''s working? In the `Where` method, we declare an iterative variable
    that will be used to filter the conditions.


    The variable in this example is `s`. So what the filter does now is for each `s`
    object in the car list, it will give us an object whose `s.IsAutomatic` property
    is true. This in turn will create a filtered `IEnumerable` list. To make this
    list of explicit type objects, we''ll apply a simple `ToList()` method on the
    filtered `IEnumerable` list. This will create a `List<Car>` object and assign
    it to `carsThatAreAutomatic`. Now we have the data we need. Finally, we will go
    through the newly created collection of `Car` objects and print the messages to
    the console. For each object on the list we will print "car with capacity {specified
    capacity} is automatic". We know this because we filtered the cars and only took
    those that have automatic.


    ![Image](images/image-24.jpeg)


    As you can see, there are two cars with automatic gearbox and their capacity is
    100 and 300 respectively. You can check this at the beginning of car list creation
    as the first and third cars are true for the `IsAutomatic` property passed in
    the object. Another example can be seen below:


    ![Image](images/image-25.jpeg)


    In this example, we have class named `Person`. This class has properties which
    are `Salary`, `FirstName`, and `LastName`. Each `Person` class represents an employee
    with basic information. Object properties are assigned in the constructor. The
    `Main` method creates a list with objects of `Person` class. We added five `Person`
    objects, each with a different salary amount, name. The manager wants to filter
    out everyone who has salary greater than 3000 and these people will be marked
    as `seniors`. We''ll do this with a LINQ query. As in the previous example, we
    filter people using the `Where` extension method. In this method, we declare that
    we only want `Person` objects that have salary greater than 3000. After the download
    is complete, the `ToList()` method transforms the filtered `IEnumerable` list
    to the list of `Person` objects. Now we have the item this is a list of `Person`
    types which only includes people who have salary greater than 3000. This variable
    is called `seniors`. Now the manager asks him to demand the total amount of seniors''
    salaries. Next, we''ll do this by creating a seniors salary list, then sum all
    of these values into one variable and write it to the standard output. Creating
    the `seniorsSalaries` list will be performed using the `Select` LINQ extension
    method. The `Select` method is used when there is needed to obtain only specific
    property values from a collection of objects. In this case, we need the value
    of `Salary` from each of the properties on the seniors list. The `Select` method
