    An `AC` developer can easily understand the Visual Basic `.NET` developer code,
    and they both can program in the language they are most comfortable with. This
    is because all languages that use `.NET` share `.NET` libraries, so it doesn''t
    matter what language we are programming in, we can recognize it in any language.
    Next, we will learn about the different components of `.NET`: Common Language
    Runtime (`CLR`), Assembly, and Common Intermediate Language (`CIL`).


    ## CLR


    The first component we''ll learn about is the common language runtime, also known
    as the `CLR`. It is an executable program common to all languages. This program
    is responsible for reading the code generated by the compiler and starts its execution.
    It doesn''t matter whether the program is written in C##, Visual Basic `.NET`,
    or some other `.NET` language, the `CLR` reads it and executes it.


    ### installation


    When we have a program written in `.NET` and compile it, an assembler is generated.
    The kit includes the `CIL` in the compiled program, as well as information about
    all types that are used in the program.


    ## CIL


    `.NET` programs are not compiled directly into machine assembly code; instead
    they are compiled into an intermediate language known as `CIL`. This language
    is read and executed by the runtime. The use of `CIL` and the runtime provides
    `.NET` with great flexibility and cross-platform capability.


    The `.NET` framework shares common language or `CLS` specifications. These specifications
    are the guidelines that each language you want to use must meet in order to work
    with the runtime. One advantage is that if our code is `CLS` compliant, we can
    have interoperability with other languages, for example we can create a library
    in C# and a Visual Basic `.NET` developer can use it without any problem.


    One of the highlights of these guidelines is the `CTS` or Common Type System.
    In programming languages, when we want to write information, it is put into a
    variable, the variable will have a type depending on the information to be written,
    e.g. a type can be an integer, another type to write a decimal number and another
    to write a phrase or a word. The problem is that each language stores information
    differently. Some languages store integers with 16-bit memory and others with
    32-bit memory; even some languages like C and C++ don''t have a type to hold strings
    or phrases.


    To solve this problem, the `.NET` Framework defines through the `CTS` how types
    will operate in their environment. Any language that works with the `.NET` must
    use the types specified in the `CTS`. Now that we know the basic concepts and
    can see how it all comes together.


    ## How to create a .NET application


    We can create a `.NET` application using a programming language. For this, it
    will be C#; with this programming language we can create the program''s source
    code (instructions that tell the program what to do).


    When we are done with our source code, we have to use the compiler. The compiler
    takes the source code and creates an assembler for us. This assembly will have
    the equivalent of our code but written in `CIL`, which leads to another advantage
    of `.NET` - the compiler optimizes our code for the platform on which we will
    use the program which means that the same program can be optimized for device,
    ordinary PC or server without making any changes to it. The `.NET` framework can
    run on platforms, not just Windows. This means that we can develop on a particular
    platform and if the other platform has a runtime, our program will run without
    problem. A `.NET` program developed on Windows can run as long as it has an appropriate
    runtime.


    When we want to call program, the runtime reads assembly and creates the environment
    for us. The runtime starts reading `CIL` instructions from assembly and compiles
    them as it reads them for the processor of the computer running the program; this
    is known as JIT or just-in-time compilation. This is how the program proceeds
    in execution and all happens transparently for the user. The JIT compiler is also
    known JIT. This is part of the runtime and is very efficient if program requires
    any code it has already compiled, thus improving performance for the user.


    For running programs, the `.NET` framework provides memory management and garbage
    collection services. In managed languages such as C and C++, the developer is
    responsible for memory management. In large programs, this can be a complex task
    that can lead to errors during execution. Frankly, managed languages like C# have
    programmers no longer responsible for memory usage. The garbage collector is responsible
    for removing all objects that are no longer needed when the object is no longer
    used, it collects and deletes it. This frees up memory and resources. Garbage
    Collector works automatically for us and helps eliminate all memory and resource
    management that was necessary for `Win32`. In some special cases, such as files,
    databases or network connections, managed resources we must clearly indicate when
    to destroy them.


    # Chapter 10: ENUM and struct


    ### Calculation


    An enumeration (which stands for an enumerated type) is a special data type that
    allows developers to supply meaningful names for a set of integer constants.


    To declare an enum, we use the `enum` keyword followed by the enum name. The enumeration
    elements are enclosed in braces and separated by commas. An example is shown below:


    ```calculation of the days of the week

    {

    Sun, Mon, Tue, Wed, Thu, Fri, Sat

    }

    ```


    Note that we don''t put the semicolon at the end of the last element.


    After declaring the `DaysOfWeek` enumeration, we can declare and initialize the
    variable `DaysOfWeek` as follows:


    `DaysOfWeek myDaysOfWeek = DaysOfWeek.Mon;`


    The variable name is `myDaysOfWeek`. If we write `Console.WriteLine(myDaysOfWeek);`
    we''ll get, `Mon`


    By default, each member in the enumeration is assigned an integer starting from
    zero. This means that in example `Sun` is assigned 0, `Mon` is 1, and so on. Since
    the enumeration items are integers, we can cast them to `int`. For example `Console.WriteLine((int)myDays);`
    gives us 1. If you want to assign a different set of integers you can do as follows


    ```enumenum DaysOfWeek

    {

    Sun = 5, Mon = 10, Tue, Wed, Fri, Sat

    }

    ```


    because the range of byte is 0 to 255.


    There are two main reasons for using enumerations. The first is to improve the
    readability of the code. `myDays = Mon;` is more obvious than `myDays = 1;`. The
    second reason is the limitation of the value that the variable can take. If we
    have a variable that holds the days of the week, we can accidentally assign it
    the value 10. This can be prevented by using an enumeration, because we can only
    assign predefined enumeration items to the variable.

