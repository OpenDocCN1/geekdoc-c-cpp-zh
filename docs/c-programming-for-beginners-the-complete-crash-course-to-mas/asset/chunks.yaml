    # 介绍


    欢迎学习 C# 编程，感谢你选择本书！


    无论你是经验丰富的程序员还是完全的新手，这本书的编写都是为了帮助你快速学习 C# 编程。


    读完本书后，你应该能够毫无问题地编写自己的 C# 程序。事实上，我们将在书末的项目中一起编写一个简单的薪资管理软件。准备好起飞了吗？


    大多数人害怕学习新的编码语言。他们知道这会为他们使用电脑开启许多大门，但他们担心纯编程本身对他们来说太难学习和掌握。如果你不花时间学习新的编程语言，整个编程过程可能会变得非常困难。但在寻找一种可以帮助你编写几乎任何你想要的代码语言时，是时候看看
    C# 编程语言了。本书将带你了解使用 C# 编码语言的基础知识，让你能够开始使用它。


    ### C# 的特殊之处


    在涉及到编码语言时，你可能首先想要了解的是为什么 C# 如此特别，以及为什么你甚至想要学习这种特定的编程语言。有很多不同的编码语言可以选择，它们的工作方式也不相同，但你会发现使用
    C# 有许多优势，我们将在本指南中涵盖其中一些。即使你只是初学者，这也是一种非常棒的编程语言，它将让你设计许多自己的程序。虽然在你想开始学习编程时有很多选择，但没有哪一种能像
    C# 好。用 C# 代替其他编程语言的一些优势包括：


    #### 可以使用大型库


    作为初学者，代码中有很多部分是不容易学习的。你会在边学边用，但你可以配合 C# 使用的库是一项巨大的资源，对你非常有帮助。你可以不费吹灰地使用它，甚至可以进行修改使其按你想要的方式运行。


    #### 自动删除函数


    当你使用其他语言时，你必须检查并删除项目。这会花费时间，如果你漏掉了一些，就会很困难。使用 C# 会完成这一切让事情变得简单。


    #### 易于学习


    C# 被广泛认为最容易学习的编程语言之一。虽然某些部分比其他部分复杂，但它们并不难，随着你的学习你会熟悉它们。


    #### 兼容 Windows 及其他


    这种编程语言最初是为了在 Windows 上运行而创建，但只要你安装了 `.NET`，它在 Mac 和 Linux 等操作系统上也运行良好。


    #### 它与 .NET 工作


    你会发现 C# 与 `.NET`get，这使其在其他系统中可用。


    # 第 1 章：C# 的解剖


    ## C# 简介


    欢迎学习 C# 编程，感谢你选择本书！无论你是经验丰富的程序员还是完全的新手，这本书的编写都是为了帮助你快速学习 C# 编程。读完本书后，你应该能够毫无问题地编写自己的
    C# 程序。事实上，我们将在书末的项目中一起编写一个简单的薪资管理软件。准备好起飞了吗？


    大多数人害怕学习新的编码语言。他们知道这会为他们使用电脑开启许多大门，但他们担心纯粹编程本身对他们来说太难学习和掌握。如果你不花时间学习新的编程语言，整个编程过程可能会变得非常困难。但在寻找一种可以帮助你编写几乎任何你想要的代码语言时，是时候看看
    C# 编程语言了。本书将带你了解使用 C# 编码语言的基础知识，让你能够开始使用它。


    ### C# 的特殊之处


    在涉及到编码语言时，你可能首先想要了解的是为什么 C# 如此特别，以及你甚至想要学习这种特定的编程语言。有很多不同的编码语言可以选择，它们的工作方式也不相同，但你会发现使用
    C# 有许多优势，我们将在本指南中涵盖其中一些。即使你只是初学者，这也是一种非常棒的编程语言，它将让你设计许多自己的程序。虽然在你想开始学习编程时有很多选择，但没有哪一种能像
    C# 好。用 C# 代替其他编程语言的一些优势包括：


    #### 可以使用大型库


    作为初学者，代码中有很多部分是不容易学习的。你会在边学边用，但你可以配合 C# 使用的库是一项巨大的资源，对你非常有帮助。你可以不费吹灰地使用它，甚至可以进行修改使其按你想要的方式运行。


    #### 自动删除函数


    当你使用其他语言时，你必须检查并删除项目。这会花费时间，如果你漏掉了一些，就会很困难。使用 C# 会完成这一切让事情变得简单。


    #### 易于学习


    C# 被广泛认为最容易学习的编程语言之一。虽然某些部分比其他部分复杂，但它们并不难，随着你的学习你会熟悉它们。


    #### 兼容 Windows 及其他


    这种编程语言最初是为了在 Windows 上运行而创建的，但只要你安装了 `.NET`，它在 Mac 和 Linux 等操作系统上也运行良好。


    #### 它与 .NET 工作


    你会发现 C# 与 `.NET` 工作，这使其在其他系统中可用。


