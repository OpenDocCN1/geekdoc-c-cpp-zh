  trans: "\n变量来说来说分配给内存区域的名称。我们的程序能够操作这个存储区域。每个 C 变量都关联到一个类型，该类型指定了分配给该变量的内存量。它决定了可以应用于变量的操作类型。例如，你不能相乘字符串变量。\n\
    \n## 变量声明\n\n在变量声明中使用以下语法：\n\n```\n<data_type> <variable_list>;\n```\n\n上述语法中的\
    \ `Data_type` 必须是有效的 C 数据类型，例如 `int`、`String`、`float` 等。`VariableList` 可以是多个用逗号分隔的变量名。\n\
    \n以下是有效的变量声明示例：`int a, b, c;` `mark c, d;` `float x, salary;` `double y;`\n\n\
    变量可以在声明时进行初始化。例如：`int x = 40;`\n\n## 变量初始化\n\n变量初始化是指给变量赋值的过程。它是通过一个等号后跟一个常量表达式来实现。这里是初始化的通用语法：`variable_name\
    \ = value;`。正如我们之前提到的，变量可以在声明期间初始化。这里是更多示例：\n\n```c\nint x = 1, y = 6; /* x 和\
    \ y 初始化。 */\nbyte f = 22; /* 初始化 f。 */\ndouble pi = 3.14159; /* 声明 pi 的近似值。 */\n\
    char a = 'a'; /* 变量 a 的值为 'a'。 */\n```\n\n变量初始化应该正确完成；否则程序可能会产生意外的结果。\n\n例如： \n\
    ```csharp\nusing System;\nnamespace VariableDeclaration {\n    class MyProgram\
    \ {\n        static void Main (string [] args) {\n            short x; int y;\
    \ double with; /* 变量的实际初始化 */\n            x = 5; y = 10; z = x + y; \n      \
    \      Console.WriteLine (\"x = {0}, y = {1}, z = {2}\", x, y, z); \n        \
    \    Console.ReadLine (); \n        }\n    }\n}\n```\n\n代码返回如下：\n`x = 5, y = 10,\
    \ z = 15`\n\n## 获取用户输入\n\n`System` 命名空间下的 `Console` 类有一个名为 `ReadLine()` 的方法，允许我们从用户处获取输入。用户输入被读取并存储在变量中。下面的示例展示了如何使用此方法：\n\
    \n```csharp\nusing System;\nnamespace UserInputApp {\n    class MyProgram {\n\
    \        static void Main (string [] args) {\n            name = \"Santa\"; string\
    \ name = \"Samuel\"; \n            Console.WriteLine (\"Your first name is:\"\
    \ + firstname + \"\" + lastname); \n            Console.WriteLine (\"Please enter\
    \ and various first Name:\");\n            FirstName = Console.ReadLine ();\n\
    \            Console.WriteLine (\"Your new name is:\" + firstName + \"\" + lastName);\
    \ \n            Console.ReadLine ();\n        }\n    }\n}\n```\n\n当提示输入第一个新值时，执行操作你的名字就改变了。\n\
    \n## 运算符\n\n运算符是指示编译器执行逻辑或算术操作的符号。C 有多种运算符。让我们来讨论它们。\n\n### 算术运算符\n\n它们用于执行各种算术操作。它们可以像下面的示例所示：\n\
    \n```csharp\nusing System;\nnamespace ArithmeticOperatorsApp {\n    class MyProgram\
    \ {\n        static void Main (string [] args) {\n            int x = 3; int y\
    \ = 10; int with;\n            z = x + y; Console.WriteLine (\"1 - {0}\", z);\n\
    \            z -= y; Console.WriteLine (\"2 - {0}\", z);\n            z = x *\
    \ y; Console.WriteLine (\"3 - {0}\", z);\n            z = x / y; Console.WriteLine\
    \ (\"4 - {0}\", z);\n            z = x % y; Console.WriteLine (\"5 - {0}\", z);\n\
    \            z = x ++; Console.WriteLine (\"6 - {0}\", z);\n            z = x;\
    \ Console.WriteLine (\"7 - {0}\", z); \n            Console.ReadLine ();\n   \
    \     }\n    }\n}\n```\n\n上述大多数运算符都是广为人知的，除了其中几个。`++` 是递增运算符，每次迭代都会将变量的值加 1。`-=`\
    \ 是递减运算符，每次迭代后都会将变量的值减 1。`%` 被称为模运算符，返回除法后的余数。代码返回下面的输出：\n\n![Image](img/image-12.jpeg)\n\
    \n### 逻辑运算符\n\nC 也有许多逻辑运算符。让我们简要讨论一下它们：\n\n- 逻辑与 (`&&`)：如果两个操作数都不零，则条件为真。\n- 逻辑或\
    \ (`||`))：如果任何一个操作数非零，则条件为真。\n- 逻辑非 (`!`)：该运算符反转操作数的逻辑状态。如果条件为真，此运算符将改变它。\n\n\
    下面的示例展示了如何使用上述运算符：\n\n```csharp\nusing System;\nnamespace LogicalOperatorsApplication\
    \ {\n    class MyProgram {\n        static void Main (string [] args) {\n    \
    \        bool x = true; bool y = true;\n            if (x && y) {\n          \
    \      Console.WriteLine (\"1: The condition is true\");\n            }\n    \
    \        if (x || y) {\n                Console.WriteLine (\"2; The condition\
    \ is true\");\n            }\n            /* 改变 x 和 y 的值 */\n            x = false;\
    \ y = true;\n            if (x && y) {\n                Console.WriteLine (\"\
    3: The condition is true\");\n            } else {\n                Console.WriteLine\
    \ (\"3: The condition is not true\");\n            }\n            if (! (x &&\
    \ y)) {\n                Console.WriteLine (\"4: The condition is true\");\n \
    \           }\n            Console.ReadLine ();\n        }\n    }\n}\n```\n\n\
    代码返回以下输出：\n![Image](img/image-13.jpeg)\n\n### 赋值运算符\n\nC 赋值运算符可以像下面的示例所示：\n\n\
    ```csharp\nclass MyProgram {\n    static void Main (string [] args) {\n      \
    \  int x = 3; int with; z = x; Console.WriteLine (\"1: value of z = {0}\", z);\n\
    \        z += x; Console.WriteLine (\"2: + = {0}\", z);\n        z -= x; Console.WriteLine\
    \ (\"3: - = {0}\", z);\n        z *= x; Console.WriteLine (\"4: * = {0}\", z);\n\
    \        z /= x; Console.WriteLine (\"5: / = {0}\", z);\n        z = 100; z %=\
    \ x; Console.WriteLine (\"6: % = {0}\", z);\n        z <<= 2; Console.WriteLine\
    \ (\"7: << = {0}\", z);\n        z >>= 2; Console.WriteLine (\"8: >> = {0}\",\
    \ z);\n        z &= 2; Console.WriteLine (\"9: & = {0}\", z);\n        z ^= 2;\
    \ Console.WriteLine (\"10: ^ = {0}\", z);\n        z |= 2; Console.WriteLine (\"\
    11: | = {0}\", z);\n        Console.ReadLine ();\n    }\n}\n```\n\n## 第 4 章：序列与列表\n\
    \n`List<T>` 是一个常用的集合类，其主要特点是可以通过索引访问元素。正如前面提到的，List 属于 `System.Collections.Generic`。List\
    \ 提供了许多操作列表的方法，其中一些是搜索、排序等。它可以用于创建不同类型的集合。可以是整数、字符串等。对于引用类型，List 允许将 `null` 作为元素。也可以在\
    \ List 集合中插入重复值。该类可以同时使用排序和相等比较。数组与列表相似，但列表可以动态调整大小。\n\n### 字符串\n\nC 中的 `string`\
    \ 类型是一种表示文本并处理文本变量的类型。这是一个字符数组。声明字符串数据类型使用 string 关键字来完成。当使用 string 关键字时，意味着它指向\
    \ `System.String` 类。许多扩展方法可以用于某些字符串变量。其中最流行的包括 `Concat`——即连接两个字符串，`Contains`——确定字符串是否包含作为参数传递的给定字符串，`Equals`——确定两个字符串是否具有相同的值等。默认字符串类型是空字符串。\n\
    \n## 第 5 章：语法\n\n循环结构语句\n\n在现实生活中，我们经常重复说同样的话。例如，在眼操运动的第四轮揉眼睛时，你会重复揉眼睛的动作。当你打乒乓球时，你会重复挥拍动作等等。C\
    \ 语言有一种指令可以多次执行同一块代码，被称为循环指令。循环语句分为三种类型：`while` 语句、`do...while` 语句和 `for` 语句。\n\
    \n"
- fmt: "\nThe `while` statement is somewhat similar to the conditional judgment statement\
    \ mentioned in the section above which determines whether to execute an execution\
    \ statement on `{}` according to conditional judgment. The difference is that\
    \ the `while` statement will evaluate the conditions multiple times. As long as\
    \ the conditions are true, the statements in `{}` will be executed until the conditions\
    \ are true and the `while` loop terminates.\n\nThe `while` statement has the following\
    \ syntax:\n\n```\nwhile (cyclic condition) \n{\n    // follow the instructions\n\
    \    …\n}\n```\n\nIn the above syntax structure, the execution statement in `{}`\
    \ is called the loop body, and whether the body of the loop is executed depends\
    \ on the loop condition. When the loop condition is true, the body of the loop\
    \ will be executed. When the loop body finishes executing, it continues to evaluate\
    \ the state of the loop. If the condition is still true, it will continue to execute\
    \ and the entire loop process will not complete until the loop condition is false.\n\
    \nThen the `case` is used to print the natural numbers 1 through 4 as shown in\
    \ the example below.\n\n### Example Program\nProgram11.cs\n```csharp\npublic class\
    \ Program11\n{\n    public static void \n    {\n        // Here you need to enter\
    \ your logic\n        int firstSample = 1; // define a variable 'firstSample'\
    \ with an initial value of 1\n        while (firstSample <= 4) // cyclic condition\n\
    \        {\n            Console.WriteLine(\"firstSample =\" + firstSample);\n\
    \            // If condition is true, print FirstSample. \n            firstSample++;\
    \ // firstSample for self-incrementing\n        }\n        Console.ReadKey();\n\
    \    }\n}\n```\n\nThe results of the run are displayed on the computer screen.\
    \ For example, the start value `x` is 1, and if the loop condition `x <= 4` is\
    \ true, the loop will be executed repeatedly, and the value of `x` will be printed\
    \ and `x` will automatically increase. Therefore, the `x` values in the printed\
    \ results are 1, 2, 3, and 4 respectively. That code in line 9 of the example\
    \ is used to change the value of variable `x` in each loop to ultimately achieve\
    \ the goal of changing the loop condition. Without that line, the whole loop will\
    \ become an infinite loop and will end.\n\n### Do-while statement\nThe function\
    \ of `do-while` statement is similar to the `while` statement. The difference\
    \ between the two is that the statement must first evaluate the loop condition\
    \ and then decide whether to execute the code in `{}` according to the result\
    \ of the loop. In contrast, the `do-while` statement must execute the code in\
    \ `{}` once before evaluating the loop condition.\n\nIts syntax is as follows:\n\
    \n```\ndo\n{\n    // follow the instructions…\n} while (cyclic condition);\n```\n\
    \nIn the above syntax, the execution statement in `{}` after the keyword `do`\
    \ is the body of the loop. The `do-while` statement places the loop condition\
    \ after the loop body. This means that the loop will execute unconditionally once\
    \ and then decide whether to continue execution according to the loop's conditions.\n\
    \nThen use `do-while` statement to rewrite the example as shown in the following\
    \ Program12.cs example:\n\n```csharp\nclass classicprogram\n{\n    public static\
    \ void\n    {\n        // We usually enter options here\n        int secondInstance\
    \ = 1; // define a variable 'secondInstance' with a starting value of 1 to\n \
    \       do\n        {\n            Console.WriteLine(\"first instance =\" + secondInstance);\
    \ // write the value of the \"first\"\n            secondInstance++; // increase\
    \ the value of \"priority\" by itself\n        } while (secondInstance <= 4);\
    \ // cyclic conditions\n        Console.Scan();\n    }\n}\n```\n\nThe results\
    \ of the run will be displayed on the computer screen. The above examples have\
    \ the same results, which shows that a `do-while` loop and a `while` loop can\
    \ achieve the same function. However, there are differences between the two instructions\
    \ in the process of running the program. If the loop condition is not satisfied\
    \ at the beginning of the loop statement, the body of the `while` loop will not\
    \ be executed once, but the body of the `do-while` loop will still be executed\
    \ once. If the cyclic condition `x <= 4` in this example changes to `x < 1`, Example\
    \ 2-12 prints `x = 1`, and Example 2-11 prints nothing.\n\n### For statement\n\
    `while` loop and `do-while` loop were explained in the previous section. Another\
    \ type of loop statement is often used in program development, i.e. the `for`\
    \ statement, which is typically used when the number of loops is known and its\
    \ syntax format is as follows.\n\n```\nfor (initialization expression, circulation\
    \ conditions, operation expression)\n{\n    // follow the instructions…\n}\n```\n\
    \nIn the above syntax, the character after the `for` keyword contains three parts:\
    \ an initialization expression, loop condition, and an operation expression. Between\
    \ statements, the execution statement in `{}` is the body of the loop. Then, the\
    \ initialization expression, the loop condition, operation expression and the\
    \ body of the loop are represented by 1 respectively.\n\n```\nfor (int i = 1;\
    \ i <= 4; i++)\n{\n}\n```\n\nThenThen sum the natural numbers 1 through 4 as shown\
    \ in the example below. Program13.cs example:\n\n```csharp\nclass classicprogram\n\
    {\n    public static void\n    {\n        // We usually enter options here\n \
    \       int secondInstance = 1; // define a variable 'secondInstance' with a starting\
    \ value of 1 to\n        for (int first = 1; first <= 4; first++) // the first\
    \ will change from 1 to 4\n        {\n            sum += first; // realize the\
    \ accumulation of the sum own        }\n    }\n}\n```\n\nFor example, the initial\
    \ value of variable `i` is 1, and if the evaluation `i <= 4` is true, the sum\
    \ of the loops `+= I` will be performed. When the expression is complete, the\
    \ operation expression `i++` will be executed and the value of `i` will be 2.\
    \ Then continue evaluating the condition and starting the next loop until `i =\
    \ 5` and condition `i <= 4` is false, exit the loop, execute code after the `for`\
    \ loop, and print \"sum = 10\".\n\n# Chapter 6: Classes\n\nIn the C C# programming\
    \ language, each component is associated with classes and objects that represent\
    \ basic object-oriented programming concepts. A class is something like a prototype\
