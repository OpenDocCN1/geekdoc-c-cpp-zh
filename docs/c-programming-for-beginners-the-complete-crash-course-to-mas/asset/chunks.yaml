  trans: "\n为了彻底理解这个问题，我们需要查看 `if-else` 语句的语法，以便更好地理解它在 C# 中如何工作。下面是一个很好的语法示例：\n\n\
    ```csharp\nIf (logical expression)\n{\n    // 如果结果为真，则运行这些指令\n}\nElse\n{\n   \
    \ // 如果结果为假，则运行这些指令；\n}\n```\n\n如你所见，在这种情况下，`if-else` 语句提供了更大的功能。这是 `if-else`\
    \ 语句的基本选项，但你可以添加更多行来提高其有效性。对于这些 `if-else` 语句，如果答案为假，你的代码将跳转到语句的下一个部分来检查是否为真。如果选项超过两个，它将一直遍历\
    \ `if-else` 语句，直到答案为真，然后它将执行并显示出现的消息。\n\n既然我们已经花时间讨论了它，现在是时候看看它是如何工作的示例了，这样你就可以代码中使用它：\n\
    \n```csharp\nIf (x > 0)\n{\n    Console.Write (\"This value will be positive.\"\
    );\n}\nElse\n{\n    Console.Write (\"The value is less than or equal to zero.\"\
    )\n}\n```\n\n你会发现，当我们处理上述示例时，在 `logical expression` 为假之前，`else` 子句是有效的，或者至少是隐藏的。当过程需要\
    \ `else` 语句时，它就在那里。但如果我们最终得到一个真值，第一个语句将是下一个语句，因此我们完全不需要 `else` 语句。\n\n### 什么是嵌套条件语句\n\
    \n每当我们回顾 C# 随附的一些新代码时，你应该发现使用我们上面提到的两个语句会更简单，或者你也可以将它们组合起来为某些代码创建嵌套条件。在嵌套条件语句的情况下，我们将采用上述类型条件语句之一并将其放入另一个语句中。此目的是增加我们想要看到的编码工作的复杂性，并在我们需要时确实能为我们提供一系列条件。\n\
    \n在处理嵌套条件语句时，我们需要关注的重点是，如果编写语句出现任何错误，将导致整个部分出错，并且可能需要一些时间来修复。这使得它们在处理和操作过程中变得有些困难，所以要小心。\n\
    \n然而，它们酷酷之处，以及让它们非常有吸引力的地方在于，它们允许我们添加任意数量的层级。尽管如此，该语言的大多数专家仍建议嵌套语句保持在三层或以下，以免它们在处理过程中变得过于混乱。如果你在处理这些语句时超过了第三层，你可能会得到一个不受控且不按照你想要的方式运行的结果，甚至可能无法运行。作为初学者，请坚持三层，并随着编码技巧的熟练而不断进步。你可以编写许多基于这些条件语句的代码。它们有助于加固代码，并确保我们能够处理用户提供我们的某些输入，即使我们无法预测用户将向程序添加什么响应。他们可能会根据我们设置的任何术语对输入进行处理，并确保程序以我们倾向的方式运行。这使得我们更容易看到结果并确保程序按照我们想要的方式工作。\n\
    \n# 第 9 章：网络\n\n## .NET Framework\n\n在类框架下编写的程序能够在软件环境中运行，而不是名为 `CLR`（或公共语言运行时）的硬件环境中运行。`CLR`\
    \ 是一个应用程序虚拟机，将帮助我们提供各种服务，包括安全、异常处理和内存管理。由于这个原因，用此框架编写的代码是托管代码。我们讨论过的 `CLR` 和 `BCL`\
    \ 共同构建了 .NET framework。\n\n首先，`BCL` 是有效的。它为我们提供了部分用户界面、数据访问、应用开发、算法、网络通信等内容。开发者可以通过将源代码与\
    \ .NET 平台和其他可用库打包来创建软件。这是一个旨在与我们在 Windows 平台上想要创建的大多数新应用程序协同工作的框架。此外，微软还打算创建一个专用于\
    \ .NET 软件的 IDE，称为 Visual Studio。在 .NET framework 方面，有很多工作可以做。某些方法的开发不仅可以在 Windows\
    \ 上运行，还可以在 Linux 和 Mac 等其他操作系统上运行。而且它可以帮助我们使用不同的语言，特别是 C#，在编写代码时具有可移植性、高效性并擅于管理内存。\n\
    \n为了能够在 C# 中有效编程，你需要的关于所谓 .NET framework 的理论知识很少。这就是为什么 .NET framework 是此书不可或缺的一部分。在我们更深入参与\
    \ .NET 平台之前，重要的是它是 .NET 技术不可或缺的一部分。运行时（runtime）的工作本质上是执行用适当编程语言开发的代码。然而在过去，你必须为每种编程语言提供单独运行时库（runtime\
    \ library）——每个版本也一个——以便执行相应的程序。例如，C++ 的 `MSVCRT.DLL`，以及 Visual Basic 6 中的 `MSVBVM60.DLL`。交付的运行时的概念在过去和现在从根本上是不同的。多语言支持提供了\
    \ .NET framework 的关键优势：\n\n- 只需要一个框架。\n- 根据你的知识水平和个人偏好，可以使用不同的（且非常不同的）编程语言。\n\
    - 对于所有编程语言，恰有一个运行时环境。\n\n从这些优势中可以得出进一步的结论：\n\n- **跨语言集成**：跨语言异常处理（异常处理是指程序在发生通常不预料的事件（如错误）时应如何响应）。\n\
    - **更高的安全性**：（你可以将安全性控制到方法级）\n- **简化的版本控制**：（多个版本可以并存存在）\n\n由于 .NET framework\
    \ 提供了多语言运行环境，它确保了不同编程语言组件之间的相互作用和最佳协作。你已经知道 .NET framework 是 .NET 技术的一部分以及它的作用。.NET\
    \ framework 再次由三个部分组成：\n\n1. 通用语言运行时 (Common Language Runtime) - 多语言运行时\n2. 库\
    \ (Libraries)(稍后学习类和库)\n3. ASP.NET - 用于万维网的服务器应用程序\n\n我们将在书中详细讨论这三个元素。通用语言运行时和库将在书中反复出现，在网络服务的背景下的\
    \ `ASP.NET` 也是如此。.NET framework 的两个组件——通用语言运行时和库也被称为基础框架 (base framework)。\n\n\
    ## 发现 .NET\n\n.NET framework 是所有与应用程序开发相关问题的解决方案，不仅为开发者带来了巨大的利益，对开发过程也是如此。首先 .NET\
    \ 允许我们处理现有代码；我们可以使用 COM 组件，甚至在需要使用 Windows API 的情况下。一旦 .NET 准备就绪，在客户端机器上安装变得简单得多，因为它具有强大的跨语言集成能力。\n"
