  trans: '


    无论你是在线寻求帮助，还是能够找到可以面对面向你提供建议的人，都永远不要害怕向别人寻求帮助。


    现在所有更高级的程序员都曾处于过你现在的境地。大多数开发者都会非常乐意有有机会重写他们的代码，并且非常愿意帮助你解决你遇到困难的代码。


    当然，我们必须对此谨慎，不要在整个过程中以任何方式滥用这一点。要遵循的最好规则是：不要花费超过 20 分钟的时间寻找某人帮助你理解你的代码。


    而且，在寻求帮助之前，你应该至少花 20 分钟时间尝试弄清楚它是如何工作的，以及你可以做些什么。


    ### 不要休息


    会有这样的时候：你正在编写想用 C# 实现的代码，然后被困在了某个问题上。你花了一些时间处理，但只让情况变得更糟。你不断钻研、不断钻研，实际上让问题变得更严重，或者根本找不到问题，挫败感也不断增加。


    你想解决问题并继续编写代码，但你只是变得越来越愤怒，代码也变得越来越混乱。当这种情况发生时（这可能发生在任何人身上），我们需要花时间休息一下。这可能是我们在处理
    C# 和我们的某些代码时最不希望考虑的事情，但它能让我们从问题中解脱出来呼吸新鲜空气，或者至少暂时做些别的事。通常，当你休息一下再回来处理时，你会发现起初看起来无法解决的问题其实非常容易修复。当在这个过程中投入了这么多精力和精力后，没有人想要放弃，但从长远来看，这可以减少挫败感，并确保你能迅速修复代码。


    ### 忽略 C# 社区


    当我们开始编写 C# 及其他语言的代码时，会发现酷的事情之一是：沿途中有一个由不同开发者组成的大型社区，他们随时准备帮助你。这些社区包含许多经历过整个过程各个阶段的开发者。有些是初学者，有些已经入行很久了，而有些则更高级。


    这对你来说是一个极好的消息，因为它让我们能够不断进步并学习很多东西。我们可以向社区中的人们提问。我们可以找到许多需要的代码来帮助我们开发不同的程序并学习新知识。通过在过程中提出很多问题，我们能够与他人讨论编程语言并结识优秀的人。提前确保你真的能找到一个适合自己的社区是一个好主意。网上有无数这样的社区，我们只需要确保找到最适合我们的一个。当你的代码出现问题，或者当你想学习某些不能良好运行的内容来帮助你编写代码时，这是一个极佳的参考去处。


    ### 未能使用提供的示例代码


    虽然本指南花了一些时间通过代码示例向你展示所有不同类型的编码应该是如何工作的，但仅通过查看代码来获取更深入的知识是不够的。为了建立真正的理解，你需要花时间运行和捣弄代码，看看它能做什么。你能在代码上花费的时间越长，你的方法就越好。


    当你添加说明和注释等内容时，你所处理的示例代码是以读者易理解的方式封装的。但你会发现，有时从零开始重建是困难的。阅读并不等同于理解，亲自经历编写代码并运行它的过程将帮助你理解。


