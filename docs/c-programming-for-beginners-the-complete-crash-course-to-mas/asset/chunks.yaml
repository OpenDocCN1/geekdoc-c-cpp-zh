    # Introduction


    Welcome to C# programming, and thank you so much for choosing this book!


    Whether you are an experienced programmer or a complete newbie, this book is written
    to help you learn C# programming quickly.


    By the end of the book, you should have no problem writing your own C# programs.
    In fact, we''re going to code the simple payroll software together as part of
    the project at the end of the book. Ready to take off?


    Most people are afraid of learning a new coding language. They know it would open
    many doors to what they could do with their computers, but they worry that coding
    alone is too hard for them to learn to work with. If you don''t take the time
    to learn a new programming language, the entire programming process can be difficult.
    But when it comes to finding a good language to help you write almost any code
    you want, it''s time to take a look at the C# programming language. This book
    takes you through some of the basics of using the C# coding language so you can
    start using it yourself.


    ### What''s special about C#


    The first thing you may want to take a look when it comes to a coding language
    is to understand why C# is so special and why you would even like to learn to
    use that particular programming language. There are many different coding languages
    to choose from, and they all work differently, but you''ll find there are tons
    of benefits to using C#, and we''ll cover some of them in this guide. Even if
    you are beginners only, this is a great programming language to work with and
    will allow you to design lots of your own programs. While there are a lot of different
    options available if you want to get started with coding, none of them are as
    good as C#. Some of the benefits of using C# in place of other programming languages
    include:


    #### Can use a large library


    As a beginner, you have many parts of the code that won''t be easy to learn. You''ll
    learn them on the fly, but the library that you can use with C# is a great resource
    that will be of great help to you. You can use it without much effort and can
    even make changes to make it work the way you want.


    #### Automatically removes functions


    When you work with other languages, you will have to review and delete items.
    It will take time and can be difficult if you miss some. Using C# will do all
    of this to make things easier.


    #### Easy to learn


    C# is widely regarded as one of the easiest programming languages you can learn.
    While there are some parts that are more complicated than others, it''s not that
    hard and you''ll recognize them as you continue.


    #### Compatible with Windows and other


    This programming language was originally created to run on Windows but it also
    works well on other operating systems like Mac and Linux, as long as you have
    `.NET` installed.


    #### It works with .NET


    You will find that C# works with `.NET` which makes it available for other systems.


