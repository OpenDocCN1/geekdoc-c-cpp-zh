  trans: '


    语言集成查询（俗称 LINQ）代表了 C# 编程语言中的查询语法，用于获取和过滤各种对象源。LINQ 为不同类型的对象和变量创建了单一查询接口。这种查询语法与
    C# 编程语言以及 Visual Basic 集成。为了更好地理解，我们将提供一个示例来详细解释它。因此，你有 `SQL` 作为你的结构化查询语言。`SQL`
    用于在数据库中检索和保存数据。它是一种设计为与数据库紧密工作的语言。


    与 `SQL` 类似，LINQ 用于检索和过滤各种数据源，如集合、数据集等。LINQ 有多种使用方式；通过实现实际接口查询对象集合、ADO.NET 数据集、XML
    文档、Entity Framework 数据集、SQL 数据库以及不同的数据源。LINQ 就像程序中数据和变量之间的桥梁。每个 LINQ 查询都返回对象作为结果。这很好，因为允许对数据集使用面向对象的方法。使用
    LINQ 时，你不需要担心将这些配置与数据项转换。LINQ 提供了一种从任何来源查询数据的方法。它支持编译时语法检查，因此如果你在编码 LINQ 时出错，编译器会立即通知你。


    LINQ 允许你查询任何集合，如 `List`、`Array`、`IEnumerable` 类等。


    现在来看示例：


    ![Image](img/image-23.jpeg)


    在这个示例中，我们有一个名为 `Car` 的类。`Car` 类中有三个属性：`TrunkCapacity`、`IsAutomatic` 和 `IsTurboCharged`。每个属性代表一个只读属性，它们的初始状态在
    `Car` 类的构造函数中设置。构造函数接受三个参数并将它们的值分配给上述属性。在 `Main` 方法中，我们创建了一个 `Car` 对象列表。该列表在声明部分被填充，创建了五个
    `TrunkCapacity`、`IsAutomatic` 和 `IsTurboCharged` 属性值不同的 `Car` 对象。然后我们将过滤列表，只保留自动挡箱的汽车。这将通过
    LINQ 查询完成。我们创建一个名为 `carsThatAreAutomatic` 的对象，并从 LINQ 过滤汽车列表。然后我们执行 `Where` LINQ
    扩展方法来获取我们需要的对象。它是如何工作的？在 `Where` 方法中，我们声明了一个迭代变量，用于过滤条件。


    此示例中的变量是 `s`。现在过滤器的作用是：对于汽车列表中的每个 `s` 对象，它将返回一个 `s.IsAutomatic` 属性为 true 的对象。这反过来创建一个过滤后的
    `IEnumerable` 列表。为了使此列表具有显式类型，我们将在过滤后的 `IEnumerable` 列表上应用简单的 `ToList()` 方法。这将创建一个
    `List<Car>` 对象并将其分配给 `carsThatAreAutomatic`。现在我们拥有了需要的数据。最后，我们将遍历新创建的 `Car` 对象集合，并将消息打印到控制台。对于列表上的每个对象，我们将打印“容量为
    {specified capacity} 的汽车是自动挡”。我们之所以知道这一点是因为我们过滤了汽车并只取了那些具有自动挡的汽车。


    ![Image](img/image-24.jpeg)


    如你所示，有两辆自动变速箱汽车，它们的容量分别为 100 和 300。你可以在创建汽车列表之初检查这一点，因为第一辆和第三辆汽车传递的对象中 `IsAutomatic`
    属性为 true。另一个示例见下所示：


    ![Image](img/image-25.jpeg)


    在这个示例中，我们有一个名为 `Person` 的类。该类拥有属性 `Salary`、`FirstName` 和 `LastName`。每个 `Person`
    类代表一个带有基本信息的员工。对象属性在构造函数中分配。`Main` 方法创建了一个带有 `Person` 类对象的列表。我们添加了五个 `Person`
    对象，每个都有不同的工资金额和姓名。经理想要过滤出所有工资大于 3000 的人，这些人将被标记为 `seniors`（资深人员）。我们将通过 LINQ 查询来实现此。与上一个示例一样，我们使用
    `Where` 扩展方法过滤人员。在此方法中，我们声明我们只需要工资大于 3000 的 `Person` 对象。下载完成后，`ToList()` 方法将过滤后的
    `IEnumerable` 列表转换为 `Person` 对象列表。现在我们有了该项，这是一个 `Person` 类型的列表，仅包含工资大于 3000 的人员。该变量被称为
    `seniors`。现在经理要求他计算资深人员工资的总额。接下来，我们将通过创建一个资深人员工资列表，然后将所有这些值加到一个变量中，并将其写入标准输出。创建
    `seniorsSalaries` 列表将使用 `Select` LINQ 扩展方法。当需要从对象集合中获取特定属性值时，使用 `Select` 方法。在这种情况下，我们需要资深人员列表中每个属性的
    `Salary` 值。`Select` 方法执行后续操作：对于资深列表中的每个对象 `x`，获取 `x.Salary`。这创建了一个可枚举值列表。执行 `ToList()`
    方法后，我们成功创建一个包含资深人员工资元素的 `List<int>` 对象。然后我们创建了一个变量来存储所有资深人员工资的总和——`seniorSalariesSum`
    变量。此之后，我们还有一条语句将完成工作。`ForEach` 方法在 `seniorsSalaries` 列表上执行，它将收集并汇总所有工资到一个变量 `SalariesSum`
    中。最后，程序将结果写入标准输出——`seniorSalaries`：


    ![Image](img/image-26.jpeg)


    执行 `Where` 方法后，接着执行 `Select`。这将给你完全相同的结果。为了让你理解，这个长语句被拆分成了几个短语句。让我们用最后一个示例结束这个
    LINQ 章节：


    ![Image](img/image-27.jpeg)


    如你所示，有两辆自动变速箱汽车，它们的容量分别为 100 和 300。你可以在创建汽车列表之初检查这一点，因为第一辆和第三辆汽车传递的对象中 `IsAutomatic`
    属性为 true。


    ![Image](img/image-28.jpeg)


