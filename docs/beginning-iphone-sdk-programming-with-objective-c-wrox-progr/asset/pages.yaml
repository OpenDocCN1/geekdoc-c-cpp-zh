  md: "It's interesting to note that the setOrientation: method described in the previous\
    \ section cannot be used to change the orientation of the View during loading\
    \ time:\n\n```\n//---does not work during View loading time--\n[[UIDevice currentDevice]\
    \ setOrientation:UIInterfaceOrientationLandscapeLeft];\n```\n\nLikewise, setting\
    \ the orientation of the status bar does not work during runtime (after the View\
    \ has loaded):\n\n```\n//---does not work during run time--\n[UIApplication sharedApplication].statusBarOrientation\
    \ = \nUIInterfaceOrientationLandscapeLeft;\n```\n\n> NOTE The orientation to which\
    \ you are changing must first of all be specified in the shouldAutorotateToInterfaceOrientation:\
    \ event. This can also be specified in the info.plist file for the application\
    \ by setting the InitialInterfaceOrientation key to the desired orientation.\n\
    \n# SUMMARY\n\nIn this chapter, you have seen how changes in screen orientations\
    \ are handled by the various events in the view controller class. Proper handling\
    \ of screen orientations will make your application more useable and improve the\
    \ user experience.\n\n# EXERCISES\n\n+   1. Suppose you want your application\
    \ to only support the landscape right and landscape left orientation. How should\
    \ you modify your code?\n+   \n+   2. What is the difference between the frame\
    \ and center property of a view?"
