    When you release the mouse button, a list appears from which you can select the
    correct outlet. When defining your outlets (in the Identity Inspector window,
    or in code), remember that you can specify the type of view your outlet is referring
    to. When you release the mouse button, Interface Builder lists only the outlets
    that match the type of view you have selected. For example, if you defined myOutlet1
    as UIButton and you Control-click and drag the File''s Owner item to the Text
    Field view on the View window, the myOutlet1 will not appear in the list of outlets.


    For connecting actions, Control-click and drag the view to the File''s Owner item
    in the .xib window (see Figure C-16).'
