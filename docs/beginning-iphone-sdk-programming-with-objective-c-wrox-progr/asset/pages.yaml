  md: "```\n#import <Foundation/Foundation.h>\n@class AnotherClass;\n\n@interface\
    \ SomeClass : NSObject {\n    AnotherClass *anotherClass;\n    float rate;\n \
    \   NSString *name;\n}\n\n-(void) doSomething;\n-(void) doSomething:(NSString\
    \ *) str;\n-(void) doSomething:(NSString *) str withAnotherPara:(float) value;\n\
    +(void) alsoDoSomething;\n\n- (id)initWithName:(NSString *) n;\n- (id)initWithName:(NSString\
    \ *) n andRate:(float) r;\n\n@property float rate;\n@property (retain, nonatomic)\
    \ NSString *name;\n\n@end\n```\n\nThe preceding example contains two additional\
    \ initializers: initWithName: and initWithName:andRate:. You can provide the implementations\
    \ for the two initializers as follows:\n\n```\n#import \"SomeClass.h\"\n@implementation\
    \ SomeClass\n@synthesize rate, name;\n\n- (id)initWithName:(NSString *) n\n{\n\
    \    return [self initWithName:n andRate:0.0f];\n}\n\n- (id)initWithName:(NSString\
    \ *) n andRate:(float) r\n{\n    if (self = [super init]) {\n        self.name\
    \ = n;\n        self.rate = r;\n    }\n    return self;\n}\n\n-(void) doSomething\
    \ {\n}\n\n-(void) doSomething:(NSString *) str {\n}\n\n-(void) doSomething:(NSString\
    \ *) str withAnotherPara:(float) value {\n}\n\n+(void) alsoDoSomething {\n}\n\n\
    @end\n```"
