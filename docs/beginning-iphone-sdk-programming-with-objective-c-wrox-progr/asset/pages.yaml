    \nFIGURE 12-1\n\n5. In the DatabasesViewController.h file, declare a variable\
    \ of type sqlite3 as well as a method named filePath (see the code in bold):\n\
    \n```\n#import <UIKit/UIKit.h>\n#import \"sqlite3.h\"\n\n@interface DatabasesViewController\
    \ : UIViewController {\n    sqlite3 *db;\n}\n\n-(NSString *) filePath;\n\n@end\n\
    ```\n\n6. In the DatabasesViewController.m file, define the filePath method as\
