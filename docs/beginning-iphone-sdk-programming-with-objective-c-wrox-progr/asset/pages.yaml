- pgno: 199
  md: "# Adding a View Controller Programmatically\n\nBesides adding a View Controller\
    \ and views using Interface Builder, a commonly used technique is to programmatically\
    \ create the views during runtime. This provides a lot of flexibility, especially\
    \ when you are writing games for which the UI of the application is constantly\
    \ changing.\n\nIn the following Try It Out, you learn how you can create a View\
    \ using an instance of the UIViewController class and then programmatically add\
    \ views to it.\n\n# TRY IT OUT   Adding a View Controller Programmatically\n\n\
    +   1. Using the same project, right-click the Classes group in Xcode and add\
    \ a new file. Select the UIViewController subclass item and name it MySecondViewController.\
    \ Xcode should now look like Figure 7-12.\n+   \n+   2. In the WinBasedAppAppDelegate.h\
    \ file, add the following code that appears in bold:\n\n```\n#import \"WinBasedAppAppDelegate.h\"\
    \n#import \"MyViewController.h\"\n\n#import \"MySecondViewController.h\"\n\n@implementation\
    \ WinBasedAppAppDelegate\n\n@synthesize window;\n@synthesize myViewController;\n\
    \n//---create an instance of the second view controller---\nMySecondViewController\
    \ *mySecondViewController;\n\n- (void)applicationDidFinishLaunching:(UIApplication\
    \ **)application {\n\n    //---instantiate the second view controller---\n   \
    \ mySecondViewController = [[MySecondViewController alloc]\n                 \
    \             initWithNibName:nil\n                              bundle:nil];\n\
    \n    //---add the view from the second view controller---\n    [window addSubview:mySecondViewController.view];\n\
    \n    //---comment this out so that it doesn't load the myViewController---\n\
    \    //[window addSubview:myViewController.view];\n    [window makeKeyAndVisible];\n\
    }\n\n- (void)dealloc {\n    [mySecondViewController release];\n}\n```\n\n![](img/16991b58db5894715c4a443315e06a22_199_0.png)"
