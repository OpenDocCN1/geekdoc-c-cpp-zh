  md: "To know the order of the various views already added, you can use the following\
    \ code segment to print the value of the tag property for each view:\n\n```\n\
    [self.view addSubview:label];\n[self.view addSubview:button];\n[self.view exchangeSubviewAtIndex:1\
    \ withSubviewAtIndex:0];\n\nfor (int i=0; i<[self.view.subviews count]; ++i) {\n\
    \    UIView *view = [self.view.subviews objectAtIndex:i];\n    NSLog(@\"%@\",\
    \ [NSString stringWithFormat:@\"%d\", view.tag]);\n}\n```\n\nThe following method\
    \ recursively prints out all the views contained in a UIView object:\n\n```\n\
    -(void) printViews: (UIView *) view {\n    if ([view.subviews count] > 0) {\n\
    \        for (int i=0; i<[view.subviews count]; ++i) {\n            UIView *v\
    \ = [view.subviews objectAtIndex:i];\n            NSLog(@\"View index: %d Tag:\
    \ %d\", i, v.tag);\n            [self printViews:v];\n        }\n    } else\n\
    \        return;\n}\n```\n\nTo remove a view from the current view hierarchy,\
    \ use the removeFromSuperview method of the view you want to remove. For example,\
    \ the following statement removes the label view:\n\n```\n[label removeFromSuperview];\n\
    ```\n\n# SWITCHING VIEWS\n\nWhen you create a View-based Application project in\
    \ Xcode, you get a project with a single view with a corresponding View Controller.\
    \ This is what you see when you edit the .xib file in Interface Builder. However,\
    \ sometimes you may need more than one view. For example, you may get the user\
    \ to enter some information in one view and then based on the information that\
    \ user entered, switch to another view for some actions.\n\nThe following Try\
