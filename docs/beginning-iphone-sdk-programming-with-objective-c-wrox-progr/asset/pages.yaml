  md: '> NOTE The modalTransitionStyle property is available only in the iPhone SDK
    3.0. If you try to run your application using an older version of the SDK, it
    will not work.


    The default transitioning is the horizontal flip, in which the main view flips
    horizontally (see Figure 9-6) to reveal the FlipsideView.


    Besides flipping horizontally, you can also flip the view vertically or make it
    dissolve slowly. These features are controlled by the following constants (shown
    in bold):


    ```

    ```

    //---flip vertically---

    controller.modalTransitionStyle =

    UIModalTransitionStyleCoverVertical;


    //---dissolves slowly to reveal another view--

    controller.modalTransitionStyle =

    UIModalTransitionStyleCrossDissolve;

    ```

    ```


    As an exercise, you should try modifying the transition styles to see for yourself
    how they differ.


