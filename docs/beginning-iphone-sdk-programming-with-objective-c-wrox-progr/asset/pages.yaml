  md: '# 16


    # Accessing Built-in Applications


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   ► How to send emails from within your application

    +   ► How to invoke Safari from within your application

    +   ► How to invoke the Phone from within your application

    +   ► How to send SMS messages from within your application

    +   ► How to access the camera and Photo Library

    +   ► How to access the Contacts application

    +   ► How to add and remove contact information from the Contacts application


    The iPhone comes with a number of built-in applications that make it one of the
    most popular mobile devices of all time. Some of these applications are Contacts,
    Mail, Phone, Safari, SMS, and Calendar. These applications perform most of the
    tasks you would expect of a mobile phone. As an iPhone developer, you can also
    programmatically invoke these applications from within your application using
    the various APIs provided by the iPhone SDK.


    In this chapter, you learn how to invoke some of the built-in applications that
    come bundled with iPhone as well as how to interact with them from within your
    iPhone application.


    # SENDING EMAILS


    Sending emails is one of the many tasks performed by iPhone users. Sending emails
    on the iPhone is accomplished using the built-in Mail application, which is a
    rich HTML mail client that supports POP3, IMAP, Exchange email systems, and most
    web-based emails such as Yahoo! and Gmail.'
  merge: -1
  img_proc: true
- pgno: 385
  md: "There are times where you need to send an email in your iPhone application.\
    \ A good example is embedding a feedback button in your application that users\
    \ can click to send feedback to you directly. You have two ways to send emails\
    \ programmatically:\n\n+   - Build your own email client and implement all the\
    \ necessary protocols necessary to communicate with an email server\n+   - Invoke\
    \ the built-in Mail application and ask it to send the email for you\n\nUnless\
    \ you are well versed in network communications and familiar with all the email\
    \ protocols, your most logical choice is to go for option two — invoke the Mail\
    \ application to do the job. The following Try It Out shows you how (you need\
    \ to download the code files indicated here to work through this example).\n\n\
    # TRY IT OUT Sending Emails Using the Mail Application\n\nCodefile [Emails.zip]\
    \ is available for download at Wrox.com\n\n+   1. Using Xcode, create a View-based\
    \ Application project and name it Emails.\n+   2. Double-click the EmailViewController.xib\
    \ file to edit it in Interface Builder.\n+   3. Populate the View window with\
    \ the following views (see Figure 16-1):\n+      - Label\n+      - TextField\n\
    +      - Button\n+   4. Insert the following statements in bold into the EmailsViewController.h\
    \ file:\n\n```\n#import <UIKit/UIKit.h>\n\n@interface EmailsViewController : UIViewController\
    \ {\n    IBOutlet UITextField *to;\n    IBOutlet UITextField *subject;\n    IBOutlet\
    \ UITextField *body;\n}\n\n@property (nonatomic, retain) UITextField *to;\n@property\
    \ (nonatomic, retain) UITextField *subject;\n```\n\n![](img/16991b58db5894715c4a443315e06a22_385_0.png)\n\
    \nFIGURE 16-1"
  merge: -1
  img_proc: true
- pgno: 386
  md: "```\n@property (nonatomic, retain) UITextField *body;\n\n- (IBAction) btnSend:\
    \ (id) sender;\n\n@end\n```\n\n5. Back in Interface Builder, Control-click and\
    \ drag the File's Owner item to each of the three TextField views and select to,\
    \ subject, and body, respectively.\n\n6. Control-click and drag the Button view\
    \ to the File's Owner item and select btnSend:.\n\n7. Insert the following code\
    \ in bold into the EmailsViewController.m file:\n\n```\n#import \"EmailsViewController.h\"\
    \n\n@implementation EmailsViewController\n@synthesize to, subject, body;\n\n-\
    \ (void) sendEmailTo:(NSString *) toStr\nwithSubject: (NSString *) subjectStr\n\
    withBody: (NSString *) bodyStr {\n\n    NSString *emailString = [[NSString alloc]\n\
    \    initWithFormat:@\"mailto:%@?subject=%@&body=%@\",\n    [toStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding],\n\
    \    [subjectStr\n    stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding],\n\
    \    [bodyStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding]];\n\
    \n    [[UIApplication sharedApplication] openURL:[NSURL URLWithString:emailString]];\n\
    \n    [emailString release];\n}\n\n- (IBAction) btnSend: (id) sender{\n    [self\
    \ sendEmailTo:to.text withSubject:subject.text withBody:body.text];\n}\n\n- (void)dealloc\
    \ {\n    [to release];\n    [subject release];\n    [body release];\n    [super\
    \ dealloc];\n}\n```\n\n8. Press Command-R to test the application on a real iPhone.\
    \ Figure 16-2 shows the application in action. After you have filled in the TextField\
    \ views with the necessary information, click the Send button to invoke the Mail\
    \ application and fill it with all the information you have typed in your application.\
    \ Clicking the Send button in Mail sends the email."
