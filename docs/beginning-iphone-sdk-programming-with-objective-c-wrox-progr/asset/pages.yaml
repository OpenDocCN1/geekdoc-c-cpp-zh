    # Utility Applications


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - How to develop a Utility Application using the template provided by the
    SDK

    +   - Understand how to flip views in a Utility Application

    +   - How to apply different transition styles when flipping views

    +   - How to add additional views to a Utility application


    The previous two chapters have demonstrated quite a few types of applications
    you can build using the iPhone SDK: View-Based applications, Navigation-Based
    applications, and Tab Bar applications. Another type of application that is prevalent
    in the iPhone is *Utility Applications*. A Utility Application is an application
    that performs simple tasks requiring minimum user inputs. The Weather and Stocks
    applications that come with your iPhone are two great examples of utility applications.
    Figure 9-1 shows the Weather application showing the weather of a particular city.
    When you touch the small i icon located at the bottom-right corner of the screen,
    the screen flips to another screen. The flipping of views is one of the characteristics
    of a Utility Application.'
