    FIGURE C-12


    # OUTLETS AND ACTIONS


    Outlets and actions are fundamental mechanisms in iPhone programming through which
    your code can connect to the views in your user interface (UI). When you use outlets,
    your code can programmatically reference the views on your UI, with actions serving
    as event handlers that handle the various events fired by the various views.


    Although you can write code to connect actions and outlets, Interface Builder
    simplifies the process by allowing you to connect outlets and actions using the
    drag-and-drop technique.


    # Creating Outlets and Actions


    To create an action, you can click the plus sign (+) button that appears in the
    Class Actions section of the Identity Inspector window (see left side of Figure
    C-13). Remember to include the colon (:) character at the end of the action name.
    This character allows the action to have an input parameter of type id, like this:


    ```

    - (IBAction) myAction:(id) sender;

    ```'
  merge: -1
  img_proc: true
- pgno: 477
  md: '![](img/16991b58db5894715c4a443315e06a22_477_0.png)


    # FIGURE C-13


    Be sure to note that in Figure C-13 both the outlet and action are listed under
    the HelloWorldViewController.xib header. This is because the outlet and action
    are defined within Interface Builder.


    Likewise, click the plus sign (+) button in the Class Outlets section of the Identity
    Inspector window to create an outlet. It is always good to specify the type for
    the outlet that you are defining. Using the preceding sample, if you want the
    outlet to connect to a UITextField view, you should specify the type of myOutlet1
    as UITextField rather than id.


    After the outlet and action are created using Interface Builder, you still need
    to define them in the .h file, like this:


    ```

    #import <UIKit/UIKit.h>


    @interface HelloWorldViewController : UIViewController {


    IBOutlet UITextField *myOutlet1;


    }


    -(IBAction) myAction1:(id) sender;


    @end

    ```


    > NOTE Whether you are in Xcode or Interface Builder, be sure to save the file
    after you have modified it.'
