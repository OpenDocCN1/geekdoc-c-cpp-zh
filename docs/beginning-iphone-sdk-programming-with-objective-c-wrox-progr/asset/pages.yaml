    FIGURE 11-1


    The main page of the Settings application displays the preferences of system applications
    as well as third-party applications. Tapping any setting brings you to another
    page, where you can configure the preferences of an application.


    In this chapter, you learn how to incorporate application preferences into your
    application and modify them programmatically during runtime.


    # CREATING APPLICATION PREFERENCES


    Creating application preferences for your iPhone application is a pretty straightforward
    process. The process involves adding a resource called the Settings Bundle to
    your project, configuring a property list file, and then deploying your application.
    When your application is deployed, the application preferences are automatically
    created for you in the Settings application.


    The following Try It Out shows how to add application preferences to your iPhone
    application project in Xcode.'
