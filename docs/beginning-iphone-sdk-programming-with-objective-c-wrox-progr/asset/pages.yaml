- pgno: 478
  md: 'Going back to the Identity Inspector window in Interface Builder, observe again
    that both the outlet and action are now listed under the `HelloWorldViewController.h`
    header (see Figure C-14). If you now try to click the plus sign (+) button again,
    the outlet or action will be listed under the `HelloWorldViewController.xib` header
    until you define them in the `.h` file.


    ![](img/16991b58db5894715c4a443315e06a22_478_0.png)


    FIGURE C-14


    > NOTE Outlets and actions defined in the `.h` file cannot be deleted in the Identity
    Inspector window by clicking the minus sign (–) button.


    Actually, a much simpler way is to define the outlets and actions directly in
    the `.h` files of your view controllers first. That saves you the trouble of defining
    them in the Identity Inspector window of the Interface Builder.


    Alternately, if you do not want to manually type in the declaration of the outlets
    and actions in your View Controller class, you can create the outlets and actions
    in the Identity Inspector window, select the File’s Owner item, and then choose
    File ▸ Write Class Files. Doing so causes Interface Builder to generate the code
    for the outlets and actions that you have added in the Identity Inspector window.
    When you use this option, Interface Builder first asks whether you want to replace
    or merge with the View Controller files (if they are already present). Replacing
    the files will cause the existing files to be replaced — and all the changes you
    have made to the file will be gone. Hence, this is not the recommended option.
    Merging the files will allow you to select the segments of code that you want
    to merge into your existing files. This is the safer option.'
  merge: -1
