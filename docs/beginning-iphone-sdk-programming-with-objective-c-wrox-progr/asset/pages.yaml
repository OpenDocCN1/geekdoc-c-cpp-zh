- pgno: 490
  md: "# Methods\n\nMethods are functions that are defined in a class. Objective-C\
    \ supports two types of methods — instance methods and class methods.\n\nInstance\
    \ methods can be called only using an instance of the class. Instance methods\
    \ are prefixed with the minus sign (-) character.\n\nClass methods can be invoked\
    \ directly using the class name and do not need an instance of the class in order\
    \ to work. Class methods are prefixed with the plus sign (+) character.\n\n> **NOTE**\
    \ In some programming languages, such as C# and Java, class methods are known\
    \ as static methods.\n\nThe following code sample shows SomeClass with three instance\
    \ methods and one class method declared:\n\n```\n```objc\n#import <Foundation/Foundation.h>\n\
    @class AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n\
    \    float rate;\n    NSString *name;\n}\n\n//---instance methods---\n-(void)\
    \ doSomething;\n-(void) doSomething:(NSString *) str;\n-(void) doSomething:(NSString\
    \ *) str withAnotherPara:(float) value;\n\n//---class method---\n+(void) alsoDoSomething;\n\
    \n@end\n```\n```\n\nThe following shows the implementation of the methods that\
    \ were declared in the header file:\n\n```\n```objc\n#import \"SomeClass.h\"\n\
    \n@implementation SomeClass\n\n-(void) doSomething {\n    //---implementation\
    \ here---\n}\n-(void) doSomething:(NSString *) str {\n    //---implementation\
    \ here---\n}\n-(void) doSomething:(NSString *) str withAnotherPara:(float) value\
    \ {\n    //---implementation here---\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 491
  md: "```\n```objc\n+(void) alsoDoSomething {\n    //---implementation here---\n\
    }\n@end\n```\n```\n\nTo invoke the three instance methods, you first need to create\
    \ an instance of the class and then call them using the instance created:\n\n\
    ```\n```objc\nSomeClass *someClass = [SomeClass alloc];\n[someClass doSomething];\n\
    [someClass doSomething:@\"some text\"];\n[someClass doSomething:@\"some text\"\
    \ withAnotherPara:9.0f];\n```\n```\n\nClass methods can be called directly using\
    \ the class name, as the following shows:\n\n```\n```objc\n[SomeClass alsoDoSomething];\n\
    ```\n```\n\nIn general, you create instance methods when you need to perform some\
    \ actions that are related to the particular instance of the class (that is, the\
    \ object). For example, suppose you defined a class that represents the information\
    \ of an employee. You may expose an instance method that allows you to calculate\
    \ the overtime wage of an employee. In this case, you use an instance method because\
    \ the calculation involves data specific to a particular employee object.\n\n\
    Class methods, on the other hand, are commonly used for defining helper methods.\
    \ For example, you might have a class method called GetOvertimeRate: that returns\
    \ the rates for working overtime. As all employees get the same rate for working\
    \ overtime (assuming this is the case for your company), then there is no need\
    \ to create instance methods and thus a class method will suffice.\n\nThe next\
    \ section shows how to call methods with a varying number of parameters.\n\n#\
    \ Message Sending (Calling Methods)\n\n> NOTE For the ease of understanding, I\
    \ use the more conventional term of \"calling a method\" to refer to Objective-C's\
    \ message sending mechanism."
  merge: -1
  img_proc: true
- pgno: 492
  md: "![](img/16991b58db5894715c4a443315e06a22_492_0.png)\n\n# FIGURE D-1\n\nUsing\
    \ the example from the previous section, the doSomething method has no parameter:\n\
    \n```\n-(void) doSomething {\n    //---implementation here---\n}\n```\n\nTherefore,\
    \ you can call it like this:\n\n```\n[someClass doSomething];\n```\n\nIf a method\
    \ has one or more inputs, you call it using the following syntax:\n\n```\n[object\
    \ method:input1];          //---one input---\n[object method:input1 andSecondInput:input2];\
    \  //---two inputs---\n```\n\nThe interesting thing about Objective-C is the way\
    \ you call a method with multiple inputs. Using the earlier example:\n\n```\n\
    -(void) doSomething:(NSString *) str withAnotherPara:(float) value {\n    //---implementation\
    \ here---\n}\n```\n\nThe name of the preceding method is doSomething:withAnotherPara:.\n\
    \nIt is important to note the names of methods and to differentiate those that\
    \ have parameters from those that do not. For example, doSomething refers to a\
    \ method with no parameter, whereas doSomething: refers to a method with one parameter,\
    \ and doSomething:withAnotherPara: refers to a method with two parameters. The\
    \ presence or absence of colons in a method name dictates which method is invoked\
    \ during runtime. This is important when passing method names as arguments, particularly\
    \ when using the @selector (discussed in the Selectors section) notation to pass\
    \ them to a delegate or notification event.\n\nMethod calls can also be nested,\
    \ as the following example shows:\n\n```\nNSString *str = [[NSString alloc] initWithString:@\"\
    Hello World\"];\n```\n\nHere, you first call the alloc class method of the NSString\
    \ class and then call the initWithString: method of the returning result from\
    \ the alloc method, which is of type id, a generic C type that Objective-C uses\
    \ for an arbitrary object.\n\nIn general, you should not nest more than three\
    \ levels because anything more than that makes the code difficult to read."
  merge: -1
  img_proc: true
- pgno: 493
  md: "# Properties\n\nProperties allow you to expose your fields in your class so\
    \ that you can control how values are set or returned. In the earlier example\
    \ (in the Access Privileges section), you saw that you can directly access the\
    \ fields of a class using the --> operator. However, this is not the ideal way\
    \ and you should ideally expose your fields as properties.\n\nPrior to Objective-C\
    \ 2.0, programmers had to declare methods to make the fields accessible to other\
    \ classes, like this:\n\n```\n```objc\n#import <Foundation/Foundation.h>\n@class\
    \ AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n\
    \    float rate;\n    NSString *name;\n}\n\n//---expose the rate field---\n-(float)\
    \ rate;                         //---get the value of rate---\n-(void) setRate:(float)\
    \ value;         //---set the value of rate\n\n//---expose the name field---\n\
    -(NSString *) name;                     //---get the value of name---\n-(void)\
    \ setName:(NSString *) value;    //---set the value of name---\n\n@end\n```\n\
    ```\n\nThese methods are known as getters and setters (or sometimes better known\
    \ as accessors and mutators). The implementation of these methods may look like\
    \ this:\n\n```\n```objc\n#import \"SomeClass.h\"\n\n@implementation SomeClass\n\
    \n-(float) rate {\n    return rate;\n}\n\n-(void) setRate:(float) value {\n  \
    \  rate = value;\n}\n\n-(NSString *) name {\n    return name;\n}\n\n-(void) setName:(NSString\
    \ *) value {\n    [value retain];\n    [name release];\n    name = value;\n}\n\
    \n@end\n```\n```"
  merge: -1
  img_proc: true
