  md: "# How It Works\n\nFirst, to use the CLLocationManager class, you need to implement\
    \ the CLLocationManagerDelegate protocol in your View Controller class:\n\n```\n\
    @interface GPSViewController : UIViewController\n<CLLocationManagerDelegate> {\n\
    }\n```\n\nWhen the View is loaded, you first create an instance of the CLLocationManager\
    \ class:\n\n```\n- (void) viewDidLoad {\n    lm = [[CLLocationManager alloc] init];\n\
    \    if ([lm locationServicesEnabled]) {\n        lm.delegate = self;\n      \
    \  lm.desiredAccuracy = kCLLocationAccuracyBest;\n        lm.distanceFilter =\
    \ 1000.0f;\n        [lm startUpdatingLocation];\n    }\n}\n```\n\nBefore you proceed\
    \ to use the object, you check to see whether the user has enabled Location Services\
    \ on the device. If it is enabled, you then proceed to specify the desired accuracy\
    \ using the desiredAccuracy property. You can use the following constants to specify\
    \ the accuracy that you want:\n\n+   > kCLLocationAccuracyBest\n+   > kCLLocationAccuracyNearestTenMeters\n\
    +   > kCLLocationAccuracyHundredMeters\n+   > kCLLocationAccuracyKilometer\n+\
    \   > kCLLocationAccuracyThreeKilometers\n\nWhile you can specify the best accuracy\
    \ that you want, the actual accuracy is not guaranteed. Also, specifying a location\
    \ with greater accuracy takes a significant amount of time and your device's battery\
    \ power.\n\nThe distanceFilter property allows you to specify the distance a device\
    \ must move laterally before an update is generated. The unit for this property\
    \ is in meters, relative to its last position. If you want to be notified of all\
    \ movements, use the kCLDistanceFilterNone constant. Finally, you start the Location\
    \ Manager using the startUpdatingLocation method.\n\nTo obtain location information,\
    \ you need to handle two events:\n\n+   > locationManager:didUpdateToLocation:fromLocation:\n\
    +   > locationManager:didFailWithError:\n\n![](img/16991b58db5894715c4a443315e06a22_424_0.png)"
