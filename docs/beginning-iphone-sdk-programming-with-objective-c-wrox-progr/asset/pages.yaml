  md: "On the desktop, the content of the iPhone Simulator is stored in the ~/Library/Application\
    \ Support/iPhone Simulator/User/ folder.\n\n> NOTE The ~(tilde) represents the\
    \ current user's directory. Specifically, the preceding directory is equivalent\
    \ to:\n> \n> /Users/<username>/Library/Application Support/iPhone Simulator/User/.\n\
    \nWithin this folder are five Subfolders:\n\n+   - Applications\n+   - Library\n\
    +   - Media\n+   - Root\n+   - tmp\n\nThe Applications folder is the folder that\
    \ contains all your installed applications (see Figure 13-1). Within the Applications\
    \ folder are several folders with long filenames. These filenames are generated\
    \ by Xcode to uniquely identify each of your applications. Within each application's\
    \ folder, you can find your application's executable file (the .app file, which\
    \ includes all embedded resources), together with a few other folders, such as\
    \ Documents, Library, and tmp. On the iPhone, all applications run within their\
    \ own sandboxed environment — that is, an application can access only the files\
    \ stored within its own folder; it cannot access the folders of other applications.\n\
    \n![](img/16991b58db5894715c4a443315e06a22_331_0.png)\n\nFIGURE 13-1"
