  md: '![](img/16991b58db5894715c4a443315e06a22_514_0.png)


    # FIGURE E-2


    In the Keychain Access application, choose Keychain Access ⌘ Certificate Assistant
    and select Request a Certificate From a Certificate Authority (see Figure E-3).


    ![](img/16991b58db5894715c4a443315e06a22_514_1.png)


    # FIGURE E-3


    In the Certificate Assistant window (see Figure E-4), enter your email address,
    select the Saved to Disk radio button, and select the Let Me Specify Key Pair
    Information check box. Click Continue.'
