- pgno: 298
  md: "Examine the Root.plist file in more detail. Take, for example, Item 3. Observe\
    \ that it has four keys under it: Type, Title, Key, and DefaultValue. The Type\
    \ key specifies the type of information it is going to store. In this case, it\
    \ is a PSToggleSwitchSpecifier, which means it will be represented visually as\
    \ an ON/OFF switch. The Title key specifies the text that will be shown for this\
    \ item (Item 3). The Key key is the identifier that uniquely identifies this key\
    \ so that you can programmatically retrieve the value of this item in your application.\
    \ Finally, the DefaultValue key specifies the default value of this item. In this\
    \ case, it is checked, indicating that the value is ON.\n\nIn the next Try It\
    \ Out, you modify the Root.plist file so that you can use it to store some user's\
    \ credentials. This is very useful in cases where you are writing an application\
    \ that requires users to log in to a server. When the user uses your application\
    \ for the first time, he will supply his login credentials, such as username and\
    \ password. Your application can then store the credentials in the application\
    \ preferences so that the next time the user uses your application, the application\
    \ can automatically retrieve the credentials without asking the user to supply\
    \ them.\n\n# TRY IT OUT Modifying the Application Preferences\n\n+   1. Back in\
    \ Xcode, select the Root.plist file and remove all four items under the PreferenceSpecifiers\
    \ key. You do so by selecting individual items under the PreferenceSpecifiers\
    \ key and then pressing the Delete key.\n+   \n+   2. To add a new item under\
    \ the PreferenceSpecifiers key, select the PreferenceSpecifiers key and press\
    \ the Add Child button (see Figure 11-6).\n\n> NOTE The Add Child button looks\
    \ basically like a square with three horizontal bars inside it.\n\n![](img/16991b58db5894715c4a443315e06a22_298_0.png)\n\
    \nFIGURE 11-6\n\n3. A new item is added for you. To add additional items, click\
