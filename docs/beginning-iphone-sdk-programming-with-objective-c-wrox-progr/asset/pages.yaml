  md: "# ANIMATING THE SWITCHING OF VIEWS\n\nThe switching of Views that you have\
    \ just seen in the previous section happens instantaneously — the two Views change\
    \ immediately without any visual cues. One of the key selling points of the iPhone\
    \ is its animation capabilities. Therefore for the switching of views, you can\
    \ make the display a little more interesting by performing some simple animations,\
    \ such as flipping one View to reveal another. Here is how to do that.\n\n# TRY\
    \ IT OUT Animating the Transitions\n\n1. Using the same project, add the following\
    \ code that appears in bold to the MySecondViewController.m file:\n\n```\n- (IBAction)\
    \ buttonClicked: (id) sender{\n    myViewController = [[MyViewController alloc]\n\
    \        initWithNibName:@\"MyView\" bundle:nil];\n    [UIView beginAnimations:@\"\
    flipping view\" context:nil];\n    [UIView setAnimationDuration:1];\n    [UIView\
    \ setAnimationCurve:UIViewAnimationCurveEaseInOut];\n    [UIView setAnimationTransition:\
    \ UIViewAnimationTransitionFlipFromLeft\n        forView:self.view cache:YES];\n\
