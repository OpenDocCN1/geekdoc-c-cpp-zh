  md: 'Take note that for code generated by Interface Builder, the outlets will not
    be exposed as properties. You must manually add the code to expose the properties
    using the `@property` keyword and the `@synthesize` keyword to generate the getters
    and setters for the properties.


    > **NOTE** In general, it is always easier to define the outlets and actions manually
    rather than have Interface Builder do it for you.


    # Connecting Outlets and Actions


    To connect the outlets and actions to the views, you have two options, both which
    are discussed in the following sections.


    # Method 1


    For connecting outlets, Control-click and drag the File''s Owner item to the view
    to which you want to connect (see Figure C-15).


