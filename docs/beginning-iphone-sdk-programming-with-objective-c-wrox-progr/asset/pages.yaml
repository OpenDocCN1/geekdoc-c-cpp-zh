  md: "![](img/16991b58db5894715c4a443315e06a22_124_0.png)\n\n# *How It Works*\n\n\
    When the View is loaded, you first wire it up so that when the user taps one of\
    \ its buttons, it triggers a method. In this case, the method is `segmentChanged:`.\n\
    \n```\n```objective-c\n[segmentedControl addTarget:self action:@selector(segmentChanged:)\n\
    \          forControlEvents:UIControlEventValueChanged];\n```\n```\n\nIn the `segmentChanged:`\
    \ method, you determine which button was clicked (via the `selectedSegmentIndex`\
    \ property of the segmented control) and show and hide the relevant views:\n\n\
    ```\n```objective-c\n- (IBAction) segmentChanged: (id) sender {\n    NSInteger\
    \ selectedSegment = segmentControl.selectedSegmentIndex;\n    if (selectedSegment\
    \ == 0) {\n        //---toggle the correct view to be visible---\n        [self.view1\
    \ setHidden:NO];\n        [self.view2 setHidden:YES];\n    }\n    else {\n   \
    \     //---toggle the correct view to be visible---\n        [self.view1 setHidden:YES];\n\
    \        [self.view2 setHidden:NO];\n    }\n}\n```\n```"
