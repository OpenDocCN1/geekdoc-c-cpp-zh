- pgno: 209
  md: 'The setAnimationTransition: method applies a transition type to be applied
    to a view during the animation duration.


    ```

    [UIView setAnimationTransition: UIViewAnimationTransitionFlipFromLeft forView:self.view
    cache:YES];

    ```


    The cache: parameter specifies whether the iPhone should cache the image of the
    view and use it during the transition. Caching the image speeds up the animation
    process. The following constants can be used for the animation transition:


    +   - UIViewAnimationTransitionNone — no transition

    +   - UIViewAnimationTransitionFlipFromLeft — flips a view around a vertical axis
    from left to right

    +   - UIViewAnimationTransitionFlipFromRight — flips a view around a vertical
    axis from right to left

    +   - UIViewAnimationTransitionCurlUp — curls a view up from the bottom

    +   - UIViewAnimationTransitionCurlDown — curls a view down from the top


    To end the animation, call the commitAnimations: method:


    ```

    [UIView commitAnimations];

    ```


    The animation performed on the MyViewController is similar to that of the MySecondViewController,
    except that the view to animate must be set to self.view.superview:


    ```

    [UIView setAnimationTransition: UIViewAnimationTransitionFlipFromRight forView:self.view.superview
    cache:YES];

    ```


    # SUMMARY


    In this chapter, you had your first experience with Window-based Application projects.
    The Window-based Application template is a good starting point for you to really
    understand the nuts and bolts of the UI of an iPhone application. You also learned
    how to switch between two views and apply animations to the transition process.
    In the next chapter, you learn the next type of application template supported
    by the iPhone SDK: Tab Bar applications. A Tab Bar application is another type
    of multiview application that you can build, except that all the groundwork has
    already been done for you to make your life easy.


    # EXERCISES


    +   1. Write the code snippet that allows you to create a View Controller programmatically.

    +   2. Write the code snippet that creates a view dynamically during runtime.

    +   3. Write the code snippet that wires up an event of a view with an event handler.'
