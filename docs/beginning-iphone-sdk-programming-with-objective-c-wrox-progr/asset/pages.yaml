- pgno: 460
  md: "# DEBUGGING YOUR APPLICATIONS\n\nDebugging your iPhone applications is an essential\
    \ part of your development journey. Xcode includes debugger utilities that help\
    \ you trace and examine your code as you execute your application. The following\
    \ sections show some of the tips and tricks that you can employ when developing\
    \ your iPhone applications.\n\n# Error\n\nWhen you try to run your application,\
    \ Xcode first tries to build the project before it can deploy the application\
    \ onto the real device or Simulator. Any syntax errors that Xcode detects are\
    \ immediately highlighted in red. Figure B-10 shows Xcode highlighting a syntax\
    \ error. The error with the code block is the missing brace symbol (() for the\
    \ {[UIAlertView alloc] statement:\n\n```\nUIAlertView *alert = [UIAlertView alloc]\n\
    \    initWithTitle:@\"Hello World!\"\n    message:@\"Hello, my World\"\n    delegate:self\n\
    \    cancelButtonTitle:@\"OK\"\n    otherButtonTitles:nil];\n```\n\n![](img/16991b58db5894715c4a443315e06a22_460_0.png)\n\
    \nFIGURE B-10"
  merge: -1
  img_proc: true
