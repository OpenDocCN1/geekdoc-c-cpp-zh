- pgno: 33
  md: '# OBTAINING THE IPHONE SDK


    To develop for the iPhone or iPod Touch, you first need to sign up as a Registered
    iPhone Developer at http://developer.apple.com/iphone/program/start/register/.
    The registration is free and provides you with access to the iPhone SDK and other
    resources that are useful for getting started.


    After signing up, you can download the iPhone SDK (see Figure 1-1).


    ![](img/16991b58db5894715c4a443315e06a22_33_0.png)


    FIGURE 1-1


    Before you install the iPhone SDK, make sure you satisfy the following system
    requirements:


    +   - Only Intel Macs are supported, so if you have another processor type (such
    as the older G4 or G5 Macs), you''re out of luck.

    +   - You have updated your system with the latest Mac OS X release.


    An iPhone/iPod Touch device is highly recommended, though not strictly necessary.
    To test your application, you can use the included iPhone Simulator. However,
    if you want to test certain hardware features like the camera, accelerometer,
    and such, you would need to use a real device.


    When the SDK is downloaded, proceed with installing it (see Figure 1-2). You will
    be asked to accept a few licensing agreements and then select the destination
    folder in which to install the SDK.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/16991b58db5894715c4a443315e06a22_34_0.png)


    FIGURE 1-2


    If you have selected the default settings during the installation phase, after
    the installation you should be able to find the various tools installed in the
    `/Developer/Applications` folder (see Figure 1-3).


    ![](img/16991b58db5894715c4a443315e06a22_34_1.png)


    FIGURE 1-3


    # COMPONENTS OF THE IPHONE SDK


    The iPhone SDK includes a suite of development tools to help you develop applications
    for your iPhone and iPod Touch. It includes:


    +   - Xcode — the Integrated Development Environment (IDE) that allows you to
    manage, edit, and debug your projects.

    +   - Dashcode — the Integrated Development Environment (IDE) that allows you
    to develop web-based iPhone applications and Dashboard Widgets. Dashcode is beyond
    the scope of this book.'
  merge: -1
  img_proc: true
