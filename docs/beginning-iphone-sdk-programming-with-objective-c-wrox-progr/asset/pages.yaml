- pgno: 521
  md: 'You can download the generated Provisioning Profile onto your Mac by clicking
    the Download Now button (see Figure E-14). Next, click Continue.


    ![](img/16991b58db5894715c4a443315e06a22_521_0.png)


    FIGURE E-14


    Drag and drop the downloaded Provisioning Profile (which, by default, is saved
    in the Downloads folder of your Mac) onto Xcode (located in the Dock). Doing so
    installs the Provisioning Profile onto your connected iPhone or iPod Touch. Click
    Continue (see Figure E-15).'
  merge: -1
  img_proc: true
- pgno: 522
  md: <!-- no content -->
  merge: -1
