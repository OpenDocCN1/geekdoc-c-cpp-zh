    10. Press Command-R to test the application on the iPhone Simulator. You should
    now see the tennis ball animating on the screen (see Figure 15-5). To vary the
    speed of the animation, move the slider. Moving the slider to the right slows
    down the animation; moving it to the left speeds it up.


    # How It Works


    When the view is loaded, the first thing you do is get the radius of the tennis
    ball, which in this case is half the width of the image:


    ```

    ballRadius = imageView.frame.size.width/2;

    ```


    This value will be used during the animation to check whether the tennis ball
    has touched the edges of the screen.


    To set the slider to show its value, you use the setShowValue: method:


    ```

    [slider setShowValue:YES];

    ```


    ![](img/16991b58db5894715c4a443315e06a22_373_0.png)


    FIGURE 15-5


    > NOTE Note that the setShowValue: method is undocumented and hence the compiler
    will sound a warning.


    You also initialize the position variable:


    ```

    position = CGPointMake(12.0,4.0);

    ```


    The position variable is used to specify how much the image must move every time
    the timer fires. The preceding code tells it to move 12 pixels horizontally and
    4 pixels vertically.


    You next call the scheduledTimerWithTimeInterval:target:selector:userInfo:repeats:
    class method of the NSTimer class to create a new instance of the NSTimer object:


    ```

    timer = [NSTimer scheduledTimerWithTimeInterval:slider.value

    target:self

    selector:@selector(onTimer)

    userInfo:nil

    repeats:YES];

    ```'
