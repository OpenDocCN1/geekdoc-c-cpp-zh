  md: "# How It Works\n\nLike the previous section where you use the UIImagePickerController\
    \ class to choose a photo from the Photo Library, you can also access the contacts\
    \ stored in the Contacts application on your iPhone using the ABPeoplePickerNavigationController\
    \ class. Before you use the ABPeoplePickerNavigationController class, you need\
    \ to add the AddressBook and AddressBookUI frameworks to your project. Like the\
    \ UIImagePickerController class, you need to conform to a specific protocol, specifically,\
    \ the ABPeoplePickerNavigationControllerDelegate protocol. In essence, after you\
    \ have selected a contact from the Contacts application, the following methods\
    \ may be invoked:\n\n+   - peoplePickerNavigationController:shouldContinueAfterSelectingPerson:\n\
    +   - peoplePickerNavigationController:shouldContinueAfterSelectingPerson:property:identifier:\n\
    +   - peoplePickerNavigationControllerDidCancel:\n\nThe peoplePickerNavigationControllerDidCancel:\
    \ method is fired when the you tap on the Cancel button when selecting a contact\
    \ from the Contacts application.\n\nWhen you tap on a contact, the peoplePickerNavigationController:shouldContinueAfterSelectingPerson:\
    \ method is fired. The details of the selected contact are encapsulated in the\
    \ shouldContinueAfterSelectingPerson: parameter, of type ABRecordRef.\n\nIn this\
    \ example, you extracted the various properties of the contact and display it\
    \ using the AlertView class:\n\n```\n//---get the First Name---\nNSString *str\
    \ = (NSString *)ABRecordCopyValue(person,\n    kABPersonFirstNameProperty);\n\
    str = [str stringByAppendingString:@\"\\n\"];\n\n//---get the Last Name---\nstr\
    \ = (NSString *)ABRecordCopyValue(\n    person, kABPersonLastNameProperty);\n\
    str = [str stringByAppendingString:@\"\\n\"];\n\n//---get the Emails---\nABMultiValueRef\
    \ emailInfo = ABRecordCopyValue(person, kABPersonEmailProperty);\n\n//---iterate\
    \ through the emails---\nfor (NSUInteger i=0; i < ABMultiValueGetCount(emailInfo);\
    \ i++) {\n    str = [str stringByAppendingString:\n        (NSString *)ABMultiValueCopyValueAtIndex(emailInfo,\
    \ i)];\n    str = [str stringByAppendingString:@\"\\n\"];\n}\n\n//---display the\
    \ details---\nUIAlertView *alert = [[UIAlertView alloc] initWithTitle:@\"Selected\
    \ Contact\"\n                                 message:str delegate:self\n    \
    \                             cancelButtonTitle:@\"OK\"\n                    \
    \             otherButtonTitles:nil];\n[alert show];\n[alert release];\n```"
