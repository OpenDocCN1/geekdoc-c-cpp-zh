- pgno: 462
  md: '```

    cancelButtonTitle:@"OK"

    otherButtonTitles:nil];


    [alert show];

    [alert release];

    [super viewDidLoad];

    }

    ```


    Can you spot the error? Syntactically, the preceding statements have no problem.
    However, one of the parameters appears with the wrong capitalization. It turns
    out that initwithTitle: must be spelled as initWithTitle:. When you compile the
    program, Xcode will not flag the preceding code as an error; instead, it will
    issue you with a warning message displayed in yellow (see Figure B-12).


    ![](img/16991b58db5894715c4a443315e06a22_462_0.png)


    FIGURE B-12


    When you see a warning message in Xcode, pay special attention to it and check
    that the method name is spelled correctly, including the capitalization. Failing
    to do so may result in a runtime exception. Figure B-13 shows the runtime exception
    message that Xcode displays when a runtime exception occurs.


    ![](img/16991b58db5894715c4a443315e06a22_462_1.png)


    FIGURE B-13'
