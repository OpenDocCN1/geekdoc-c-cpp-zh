- pgno: 489
  md: "# Access Privileges\n\nBy default, the access privilege of all fields is @protected.\
    \ However, the access privilege can also be @public or @private. The following\
    \ list shows the various access privileges:\n\n+   - @private — visible only to\
    \ the class that declares it\n+   - @public — visible to all classes\n+   - @protected\
    \ — visible only to the class that declares it as well as to inheriting classes\n\
    \nUsing the example shown in the previous section, if you now try to access the\
    \ fields in SomeClass from another class, such as in AnotherClass, you will not\
    \ be able to see them:\n\n```\nSomeClass *someClass = [SomeClass alloc];\nsomeClass->rate\
    \ = 5;      //---rate is declared protected---\nsomeClass->name = @\"Wei-Meng\
    \ Lee\";  //---name is declared protected---\n```\n\n> **NOTE** Observe that to\
    \ access the fields in a class directly, you use the -> operator.\n\nTo make the\
    \ rate and name visible outside the class, modify the SomeClass.h file by adding\
    \ the @public compiler directive:\n\n```\n#import <Foundation/Foundation.h>\n\
    @class AnotherClass;\n\n@interface SomeClass : NSObject {\n    AnotherClass *anotherClass;\n\
    \    @public\n        float rate;\n    @public\n        NSString *name;\n}\n@end\n\
    ```\n\nThe following two statements would now be valid:\n\n```\nsomeClass->rate\
    \ = 5;      //---rate is declared protected---\nsomeClass->name = @\"Wei-Meng\
    \ Lee\";  //---name is declared protected---\n```\n\nAlthough you can access the\
    \ fields directly, doing so goes against the design principles of object-oriented\
    \ programming's rule of encapsulation. A better way is to encapsulate the two\
    \ fields you want to expose in properties. Refer to the “Properties” section later\
    \ in this appendix."
