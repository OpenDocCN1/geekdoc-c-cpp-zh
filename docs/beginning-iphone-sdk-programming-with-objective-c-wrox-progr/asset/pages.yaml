  md: 'decided that major culprits in hurting battery life and performance are background
    applications. On other platforms (such as Windows Mobile), when an application
    goes out of view (because of an incoming call, for example), the application remains
    in memory, and each background application retained in memory continues to takes
    its toll on the device''s performance and battery life.


    Apple''s solution to this problem is simple: Disallow applications to run in the
    background. Although this is an effective solution, it has irked a lot of developers.
    Many useful applications require background operation to function correctly. For
    example, a chatting application needs to be running to receive messages from other
    users. To overcome this limitation, Apple has developed its Push Notification
    Service, which feeds applications with data even when they are not running. This
    service was released with iPhone 3.0. Using push technology, a device is constantly
    connected to Apple''s server through an IP connection. When a device needs attention,
    a notification is sent from Apple''s server to the device, thereby alerting the
    specific application that needs to service that notification.


    > NOTE Push notification is beyond the scope of this book. For more information,
    visit Apple''s iPhone Dev Center at http://developer.apple.com/iphone/index.action.


    # Restrictions on Calling Third-Party Applications


    Another restriction that Apple places on iPhone developers is that you are not
    allowed to call third-party applications from within your application. In addition,
    you can''t run interpreted code from within your application. A good example involves
    writing a Web browser application for the iPhone. Because Web applications typically
    use JavaScript for client-side interactivity, this restriction by Apple means
    that you can''t run JavaScript code from within your application.


    # SUMMARY


    This chapter offered a quick tour of the tools used for iPhone application development.
    You also learned some of the characteristics of iPhone, such as the one-application
    limit and inability to call third-party applications. In the next chapter, you
    develop your first iPhone application, and you will soon be on your way to iPhone
    nirvana!'
  merge: -1
  img_proc: true
