- pgno: 497
  md: "Note that in the initWithName:andRate: initializer implementation, you first\
    \ call the init initializer of the super (base) class so that its base class is\
    \ properly initialized, which is necessary before you can initialize the current\
    \ class:\n\n```\n- (id)initWithName:(NSString *) n andRate:(float) r\n{\n    if\
    \ (self = [super init]) {\n        //...\n        //...\n    }\n    return self;\n\
    }\n```\n\nThe rule for defining an initializer is simple: If a class is initialized\
    \ properly, it should return a reference to self (hence the id type). If it fails,\
    \ it should return nil.\n\nFor the initWithName: initializer implementation, notice\
    \ that it calls the initWithName:andRate: initializer:\n\n```\n- (id)initWithName:(NSString\
    \ *) n\n{\n    return [self initWithName:n andRate:0.0f];\n}\n```\n\nIn general,\
    \ if you have multiple initializers, each with different parameters, you should\
    \ chain them by ensuring that they all call a single initializer that performs\
    \ the call to the super class's init initializer. In Objective-C, the initializer\
    \ that performs the call to the super class's init initializer is called the designated\
    \ initializer.\n\n> NOTE As a general guide, the designated initializer should\
    \ be the one with the greatest number of parameters.\n\nTo use the initializers,\
    \ you can now call them during instantiation time:\n\n```\nSomeClass *sc1 = [[SomeClass\
    \ alloc] initWithName:@\"Wei-Meng Lee\" andRate:35];\nSomeClass *sc2 = [[SomeClass\
    \ alloc] initWithName:@\"Wei-Meng Lee\"];\n```\n\n# MEMORY MANAGEMENT\n\nMemory\
    \ management in Objective-C programming (especially for iPhone) is a very important\
    \ topic that every iPhone developer needs to be aware of. As do all other popular\
    \ languages, Objective-C supports garbage collection, which helps to remove unused\
    \ objects when they go out of scope and hence releases memory that can be reused.\
    \ However, because of the severe overhead involved in implementing garbage collection,\
    \ the iPhone does not support garbage collection. This leaves you, the developer,\
    \ to manually allocate and de-allocate the memory of objects when they are no\
    \ longer needed. This section discusses the various aspects of memory management\
    \ on the iPhone."
  merge: -1
  img_proc: true
- pgno: 498
  md: '# Reference Counting


    To help you allocate and de-allocate memory for objects, the iPhone OS uses a
    scheme known as reference counting to keep track of objects to determine whether
    they are still needed or can be disposed of. Reference counting basically uses
    a counter for each object, and as each object is created, the count increases
    by 1. When an object is released, the count decreases by 1. When the count reaches
    0, the memory associated with the object is reclaimed by the OS.


    In Objective-C, a few important keywords are associated with memory management.
    The following sections take a look at each of them.


    # alloc


    The alloc keyword allocates memory for an object that you are creating. You have
    seen it in almost all exercises in this book. An example is as follows:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    ```


    In this example, you are creating an NSString object and instantiating it with
    a default string. When the object is created, the reference count of that object
    is 1. Because you are the one creating it, the object belongs to you, and it is
    your responsibility to release the memory when you are done with it.


    NOTE See the "release" section for information on how to release an object.


    So how do you know when an object is owned, and by whom? Consider the following
    example:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    ```


    In this example, you use the alloc keyword for str, so you own str. Therefore,
    you need to release it when you no longer need it. However, str2 is simply pointing
    to str, so you do not own str2, meaning that you need not release str2 when you
    are done using it.


    # new


    Besides using the alloc keyword to allocate memory for an object, you can also
    use the new keyword, like this:


    ```

    NSString *str = [NSString new];

    ```


    The new keyword is functionally equivalent to


    ```

    NSString *str = [[NSString alloc] init];

    ```'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# retain


    The retain keyword increases the reference count of an object by 1. Consider the
    previous example:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    ```


    In that example, you do not own str2 because you do not use the alloc keyword
    on the object. When str is released, the str2 will no longer be valid.


    > NOTE How do you release str2, then? Well, it is autoreleased. See the "Convenience
    Method and Autorelease" section for more information.


    If you want to make sure that str2 is available even if str is released, you need
    to use the retain keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    NSString *str2 = str;

    [str2 retain];

    [str release];

    ```


    In the preceding case, the reference count for str is now 2. When you release
    str, str2 will still be valid. When you are done with str2, you need to release
    it manually.


    > NOTE As a general rule, if you own an object (using alloc or retain), you need
    to release it.


    # release


    When you are done with an object, you need to manually release it by using the
    release keyword:


    ```

    NSString *str = [[NSString alloc] initWithString:@"Hello"];

    //...do what you want with the object...

    [str release];

    ```


    When you use the release keyword on an object, it causes the reference count of
    that object to decrease by 1. When the reference count reaches 0, the memory used
    by the object is released.'
  merge: -1
  img_proc: true
- pgno: 500
  md: "One important aspect to keep in mind when using the release keyword is that\
    \ you cannot release an object that is not owned by you. For example, consider\
    \ the example used in the previous section:\n\n```\nNSString *str = [[NSString\
    \ alloc] initWithString:@\"Hello\"];\nNSString *str2 = str;\n[str release];\n\
    [str2 release];  //---this is not OK as you do not own str2---\n```\n\nAttempting\
    \ to release str2 will result in a runtime error because you cannot release an\
    \ object not owned by you. However, if you use the retain keyword to gain ownership\
    \ of an object, you do need to use the release keyword:\n\n```\nNSString *str\
    \ = [[NSString alloc] initWithString:@\"Hello\"];\nNSString *str2 = str;\n[str2\
    \ retain];\n[str release];\n[str2 release];  //---this is now OK as you now own\
    \ str2---\n```\n\nRecall earlier that in the section on properties, you defined\
    \ the setName: method, where you set the value of the name field:\n\n```\n-(void)\
    \ setName:(NSString *) value {\n    [value retain];\n    [name release];\n   \
    \ name = value;\n}\n```\n\nNotice that you first had to retain the value object,\
    \ followed by releasing the name object and then finally assigning the value object\
    \ to name. Why do you need to do that as opposed to the following?\n\n```\n-(void)\
    \ setName:(NSString *) value {\n    name = value;\n}\n```\n\nWell, if you were\
    \ using garbage collection, the preceding statement would be valid. However, because\
    \ iPhone OS does not support garbage collection, the preceding statement will\
    \ cause the original object referenced by the name object to be lost, thereby\
    \ causing a memory leak. To prevent that leak, you first retain the value object\
    \ to indicate that you wish to gain ownership of it; then you release the original\
    \ object referenced by name. Finally, assign value to name:\n\n```\n[value retain];\n\
    [name release];\nname = value;\n```"
  merge: -1
  img_proc: true
- pgno: 501
  md: '# UNDERSTANDING REFERENCE COUNTING USING AN ANALOGY


    When you think of memory management using reference counting, it is always good
    to use a real-life analogy to put things into perspective.


    Image a room in the library that you can reserve for studying purposes. Initially,
    the room is empty and hence the lights are off. When you reserve the room, the
    librarian increases a counter to indicate the number of persons using the room.
    This is similar to creating an object using the `alloc` keyword.


    When you leave the room, the librarian decreases the counter, and if the counter
    is now 0, this means that the room is no longer being used and the lights can
    thus be switched off. This is similar to using the `release` keyword to release
    an object.


    There may be times where you have booked the room and are the only one in the
    room (hence, the counter is 1) until a friend of yours comes along. He may simply
    come and visit you and therefore doesn''t register with the librarian. Hence,
    the counter does not increase. Because he is just visiting you and hasn''t booked
    the room, he has no rights to decide whether the lights should be switched off.
    This is similar to assigning an object to another variable without using the `alloc`
    keyword. In this case, if you leave the room (release), the lights will be switched
    off and your friend will have to leave.


    Consider another situation in which you are using the room and another person
    also booked the room and shares it with you. In this case, the counter is now
    2. If you leave the room, the counter goes down to 1, but the lights are still
    on because another person is in the room. This situation is similar when you create
    an object and assign it to another variable that uses the `retain` keyword. In
    such a situation, the object is released only when both objects release it.


    # Convenience Method and Autorelease


    So far, you learned that all objects created using the `alloc` or `new` keywords
    are owned by you.


    Consider the following case:


    ```

    NSString *str = [NSString stringWithFormat:@"%d", 4];

    ```


    In this statement, do you own the str object? The answer is no, you don''t. This
    is because the object is created using one of the convenience methods — static
    methods that are used for allocating and initializing objects directly. In the
    preceding case, you create an object but you do not own it. Because you do not
    own it, you cannot release it manually. In fact, objects created using this method
    are known as autorelease objects. All autorelease objects are temporary objects
    and are added to an autorelease pool. When the current method exits, all the objects
    contained within it are released. Autorelease objects are useful for cases in
    which you simply want to use some temporary variables and do not want to burden
    yourself with allocations and de-allocations.'
  merge: -1
  img_proc: true
