- pgno: 516
  md: '![](img/16991b58db5894715c4a443315e06a22_516_0.png)


    FIGURE E-6


    # LOGGING IN TO THE IPHONE DEVELOPER PROGRAM PORTAL


    After you have generated the Certificate Signing Request, you need to log in to
    Apple''s iPhone Dev Center (see Figure E-7). Click the iPhone Developer Program
    Portal link on the right of the page. Remember, you need to pay $99 to have access
    to this page.


    > **WARNING** Be sure to register early because the approval process takes a while
    — from a few hours to a few days.


    ![](img/16991b58db5894715c4a443315e06a22_516_1.png)


    FIGURE E-7'
  merge: -1
  img_proc: true
- pgno: 517
  md: 'On the iPhone Developer Program Portal page, click the Launch Assistant button
    (see Figure E-8) to walk you through the process of provisioning your iPhone and
    generating the development certificate.


    ![](img/16991b58db5894715c4a443315e06a22_517_0.png)


    FIGURE E-8


    You should see the welcome page. Click Continue.


    First, you are asked to create an App ID (see Figure E-9). An App ID is a series
    of characters used to uniquely identify an application (or applications) on your
    iPhone. Enter a friendly name to describe this App ID (to be generated by Apple).
    Click Continue.'
