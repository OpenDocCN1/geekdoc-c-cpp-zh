- pgno: 463
  md: 'When a runtime exception occurs, the best way to troubleshoot the error is
    to open the Debugger Console window by pressing Shift-Command-R. The Debugger
    Console window displays all the debugging information that is printed when Xcode
    debugs your application. This window usually contains the clue that helps you
    determine exactly what went wrong behind the scenes. Figure B-14 shows the content
    of the Debugger Console window when the exception occurs. To find out the cause
    of the crash, scroll to the bottom of the window and look for the section displayed
    in bold. In this case, note the reason stated. It is quite obvious that the problem
    is with the *UIAlertView* object.


    ![](img/16991b58db5894715c4a443315e06a22_463_0.png)


    FIGURE B-14


    # Setting Breakpoints


    Setting breakpoints in your code is a very handy tool to use to debug your application.
    Breakpoints allow you to execute your code line by line and examine the values
    of variables so that they perform as expected.


    In Xcode, you set a breakpoint by clicking the left column of the code editor
    (see Figure B-15).


    ![](img/16991b58db5894715c4a443315e06a22_463_1.png)


    FIGURE B-15'
