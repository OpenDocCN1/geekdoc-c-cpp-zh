  md: '# Grouping Views Using the Segmented Control


    A segmented control is a horizontal view that contains a series of buttons. Using
    a segmented control, users can tap any one of the buttons contained within it.
    Doing so deselects the button that was previously selected.


    The following Try It Out shows how to use the segmented control to group several
    views together. It also shows how you can use this control to select a particular
    group of views.


    # TRY IT OUT  Using a Segmented Control


    Codefile [UsingViews2.zip] available for download at Wrox.com


    +   1. Using Xcode, create a new View-based Application project and name it `UsingViews2`.

    +   2. Double-click the `UsingViews2ViewController.xib` file to edit it using
    Interface Builder.

    +   3. Add the following views to the View window (see Figure 4-12):

    +      - Segmented Control

    +      - View

    +      - Label (make sure it is embedded within View)

    +   4. Add another View (from the Library) onto the View window and then add a
    Label view to it (see Figure 4-13). Be careful when you position the second view
    — make sure that the second view is not contained within the first view. This
    is because when you use the mouse and drag the second View over the first, Interface
    Builder will think that you are trying to make the second View a child of the
    first View. To prevent this from happening, use the cursor to move the second
    View over the first,


    ![](img/16991b58db5894715c4a443315e06a22_121_0.png)'
