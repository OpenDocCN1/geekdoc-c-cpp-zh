- pgno: 166
  md: "# How It Works\n\nThis example demonstrates the various ways in which you can\
    \ detect the presence of a keyboard and how the view involved can be relocated\
    \ so that it is not covered by the keyboard.\n\nFirst, you declare three private\
    \ variables:\n\n```\n//---size of keyboard---\nCGRect keyboardBounds;\n\n//---size\
    \ of application screen---\nCGRect applicationFrame;\n\n//---original size of\
    \ ScrollView---\nCGSize scrollViewOriginalSize;\n```\n\nThe keyboardBounds is\
    \ used to store the size of the keyboard (in particular, to obtain the height\
    \ of the keyboard). Although you can always hard-code the height of the keyboard\
    \ to be 216, I don't recommend doing so because the size of the keyboard may change\
    \ at a later time. A better practice is to dynamically obtain the size of the\
    \ keyboard during runtime.\n\nThe applicationFrame is used to store the size of\
    \ the screen. As with obtaining the size of the keyboard, it is always better\
    \ to obtain this figure dynamically during runtime.\n\nThe scrollViewOriginalSize\
    \ is used to save the original size of the ScrollView view. Doing so allows you\
    \ to restore the ScrollView to its original size after the user is done with the\
    \ editing (at which time all the views need to be moved back to their original\
    \ positions).\n\nWhen the View is loaded, you first save the size of the ScrollView\
    \ view as well as obtain the size of the screen:\n\n```\n-(void) viewDidLoad {\n\
    \    scrollViewOriginalSize = scrollView.contentSize;\n    applicationFrame =\
    \ [[UIScreen mainScreen] applicationFrame];\n    [super viewDidLoad];\n}\n```\n\
    \nIn the viewWillAppear: event (this method is invoked before the View appears\
    \ on-screen), you register for the two notifications — UIKeyboardWillShowNotification\
    \ and UIKeyboardWillHideNotification. When the keyboard appears (UIKeyboardWillShowNotification),\
    \ the keyboardWillShow: method is invoked. When the keyboard disappears, the keyboardWillHide:\
    \ method is invoked.\n\n```\n-(void) viewWillAppear:(BOOL)animated\n{\n    //---registers\
    \ the notifications for keyboard---\n    [[NSNotificationCenter defaultCenter]\n\
    \    addObserver:self\n    selector:@selector(keyboardWillShow:)\n    name:UIKeyboardWillShowNotification\n\
    \    object:self.view.window];\n\n    [[NSNotificationCenter defaultCenter]\n\
    \    addObserver:self\n```"
  merge: -1
  img_proc: true
