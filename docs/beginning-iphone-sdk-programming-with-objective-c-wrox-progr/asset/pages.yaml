    \ by Wei-Meng Lee on 3/30/09.\n// Copyright __MyCompanyName__ 2009. All rights\
    \ reserved.\n//\n\n#import <UIKit/UIKit.h>\n\n@interface HelloWorldViewController\
    \ : UIViewController {\n}\n\n//---declaration for the btnClicked: action---\n\
    -(IBAction) btnClicked:(id)sender;\n\n@end\n```\n\nIn the HelloWorldViewController.m\
    \ file, add the code that provides the implementation for the btnClicked: action:\n\
    \n```\n-(void)dealloc {\n    [super dealloc];\n}\n\n//---implementation for the\
    \ btnClicked: action---\n-(IBAction) btnClicked:(id)sender {\n    //---display\
    \ an alert view---\n    UIAlertView *alert = [[UIAlertView alloc]\n        initWithTitle:@\"\
    Hello World!\"\n        message:@\"iPhone, here I come!\"\n        delegate:self\n\
    \        cancelButtonTitle:@\"OK\"\n        otherButtonTitles:nil, nil];\n\n \
    \   [alert show];\n    [alert release];\n}\n\n@end\n```\n\nThe preceding code\
    \ displays an alert containing the sentence \"iPhone, here I come!\"\n\nThat’s\
    \ it! Go back to Xcode and run the application again. This time, when you tap\
    \ the button view, an alert view displays (see Figure 2-23).\n\n![](img/16991b58db5894715c4a443315e06a22_66_0.png)"
