  md: '# ACKNOWLEDGMENTS


    **WRITING A BOOK IS A HUGE COMMITMENT,** and writing a book on iPhone programming
    is an even larger commitment. Now that this book is finally done, I would like
    to take this chance to thank the many people who made this a reality.


    First, I want to thank Scott Meyers, who had faith in me when he signed me up
    for this book. I hope I have not disappointed him. Thank you, Scott!


    Next, a huge thanks to Ami Sullivan, my editor, who is the real hero who got this
    book done. During the writing process, I was very involved in running iPhone courses
    and when I was off course in the writing road, Ami pulled me up and gently gave
    me a nudge. She was firm in having me adhere to the strict deadlines, but was
    very understanding when things slipped. I deeply appreciate her patience with
    me, for without her, this book would not be in your hands now. For that, please
    accept my sincere thanks, Ami!


    Last, but not least, I want to thank my parents, and my wife, Sze Wa, for all
    the support they have give me. They have selflessly adjusted their schedules to
    accommodate my busy schedule when I was working on this book. My wife has also
    stayed up with me on numerous nights as I was furiously working to meet the deadlines,
    and for this I would like to say this to her and my parents: “I love you all!”
    Finally, to our lovely dog, Ookii, thanks for staying by my side, even though
    you may not understand why I was always pounding on my keyboard!'
  merge: -1
