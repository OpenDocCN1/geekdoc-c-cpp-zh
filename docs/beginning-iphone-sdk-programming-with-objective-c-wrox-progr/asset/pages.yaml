- pgno: 294
  md: '# TRY IT OUT Adding Application Preferences


    +   1. Using Xcode, create a new Utility Application project and name it `ApplicationSettings`.

    +   2. Right-click the project name in Xcode and add a new file. Select the Resources
    template category and click Settings Bundle (see Figure 11-2). Click Next.


    ![](img/16991b58db5894715c4a443315e06a22_294_0.png)


    FIGURE 11-2


    +   3. When asked to name the file, use the default name of `Settings.bundle`
    and click Finish.

    +   4. The `Settings.bundle` item should now be part of your project (see Figure
    11-3). Click it and view the content of the `Root.plist` file using the default
    Property List editor.'
