- pgno: 526
  md: 'Press Command-R to run the application. You are prompted for permission to
    access the certificate saved in your keychain. Click Allow (or Always Allow) to
    proceed with the signing (see Figure E-23).


    ![](img/16991b58db5894715c4a443315e06a22_526_0.png)


    # FIGURE E-23


    Your application will now be deployed to the device. You can see its progress
    in the Summary tab of the Organizer application (see Figure E-24).


    ![](img/16991b58db5894715c4a443315e06a22_526_1.png)


    # FIGURE E-24'
  merge: -1
  img_proc: true
- pgno: 527
  md: 'After the application is deployed onto your device, it will be launched automatically.
    You can capture screenshots of your device by clicking the Screenshot tab of the
    Organizer application (see Figure E-25).


    ![](img/16991b58db5894715c4a443315e06a22_527_0.png)


    FIGURE E-25


    # SUMMARY


    In this appendix, you have seen the various steps required to deploy your application
    to your iPhone or iPod Touch. Although the number of steps may seem intimidating,
    it is actually quite a straightforward process. The iPhone Developer program allows
    you to provision up to 100 devices for testing purposes. After a device is provisioned,
    you can use the development certificate to deploy your applications onto it.'
