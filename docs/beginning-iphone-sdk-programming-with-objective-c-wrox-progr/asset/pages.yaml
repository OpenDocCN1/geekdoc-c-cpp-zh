    \ method to save the values.\n\nA particular challenge for the Flipside view is\
    \ that the existing value for the favorite color must be displayed in a Picker\
    \ view; therefore, during the viewDidLoad: method, you need to load the values\
    \ of the preferences settings and then determine the index of the Picker view\
    \ to display the correct color. You do this via the indexOfObject: method of the\
    \ NSMutableArray class:\n\n```\n//---find the index of the array for the color\
    \ saved---\nfavoriteColorSelected = [[NSString alloc] initWithString:\n    [defaults\
    \ objectForKey:@\"color\"]];\nint selIndex = [colors indexOfObject:favoriteColorSelected];\n\
    \n//---display the saved color in the Picker view---\n[favoriteColor selectRow:selIndex\
    \ inComponent:0 animated:YES];\n```\n\nFIGURE 11-20"
