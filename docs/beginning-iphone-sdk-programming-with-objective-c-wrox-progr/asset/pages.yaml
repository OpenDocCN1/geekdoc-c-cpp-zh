  md: '# ERRATA


    We make every effort to ensure that there are no errors in the text or in the
    code. However, no one is perfect, and mistakes do occur. If you find an error
    in one of our books, such as a spelling mistake or faulty piece of code, we would
    be very grateful for your feedback. By sending in errata, you may save another
    reader hours of frustration and at the same time help us provide even higher-quality
    information.


    To find the errata page for this book, go to www.wrox.com and locate the title
    using the Search box or one of the title lists. Then, on the book details page,
    click the Book Errata link. On this page, you can view all errata that has been
    submitted for this book and posted by Wrox editors. A complete book list including
    links to each book''s errata is also available at www.wrox.com/misc-pages/booklist.shtml.


    If you don''t spot "your" error on the Book Errata page, go to www.wrox.com/contact/techsupport.shtml
    and complete the form there to send us the error you have found. We''ll check
    the information and, if appropriate, post a message to the book''s errata page
    and fix the problem in subsequent editions of the book.


    # P2P.WROX.COM


    For author and peer discussion, join the P2P forums at p2p.wrox.com. The forums
    are a Web-based system for you to post messages relating to Wrox books and related
    technologies and interact with other readers and technology users. The forums
    offer a subscription feature to e-mail you topics of interest of your choosing
    when new posts are made to the forums. Wrox authors, editors, other industry experts,
    and your fellow readers are present on these forums.


    At http://p2p.wrox.com, you will find a number of different forums that will help
    you not only as you read this book but also as you develop your own applications.
    To join the forums, just follow these steps:


    +   1. Go to p2p.wrox.com and click the Register link.

    +   2. Read the terms of use and click Agree.

    +   3. Complete the required information to join as well as any optional information
    you want to provide and click Submit.

    +   4. You will receive an e-mail with information describing how to verify your
    account and complete the joining process.


    > **NOTE** You can read messages in the forums without joining P2P, but to post
    your own messages, you must join.'
  merge: -1
