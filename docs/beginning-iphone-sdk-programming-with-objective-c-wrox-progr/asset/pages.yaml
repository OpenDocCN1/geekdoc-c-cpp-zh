- pgno: 176
  md: "> NOTE Here is one easy way to differentiate between UIInterfaceOrientationLandscapeLeft\
    \ and UIInterfaceOrientationLandscapeRight. Just remember that UIInterfaceOrientationLandscapeLeft\
    \ refers to the Home button positioned on the left and UIInterfaceOrientationLandscapeRight\
    \ refers to the Home button positioned on the right.\n\n# Different Types of Screen\
    \ Orientations\n\nSo far, you have seen a few constants related to screen orientations:\n\
    UIInterfaceOrientationPortrait,\nUIInterfaceOrientationLandscapeLeft, and\nUIInterfaceOrientationLandscapeRight.\
    \ You have a total of four constants to use for specifying screen orientations:\n\
    \n+   - UIInterfaceOrientationPortrait — displays the screen in portrait mode\n\
    +   - UIInterfaceOrientationPortraitUpsideDown — displays the screen in portrait\
    \ mode but with the Home button at the top of the screen\n+   - UIInterfaceOrientationLandscapeLeft\
    \ — displays the screen in landscape mode with the Home button on the left\n+\
    \   - UIInterfaceOrientationLandscapeRight — displays the screen in landscape\
    \ mode with the Home button on the right\n\n![](img/16991b58db5894715c4a443315e06a22_176_0.png)\n\
    \nOf the four modes, it is usually not recommended to use the UIInterfaceOrientationPortraitUpsideDown\
    \ mode because it could easily disorient your users (see Figure 6-5).\n\nIf your\
    \ application supports multiple screen orientations, you should override the shouldAutorotateToInterfaceOrientation:\
    \ method and then use the || (logical OR) operator to specify all the orientations\
    \ it supports, like this:\n\n```\n- (BOOL)shouldAutorotateToInterfaceOrientation:\n\
    \    (UIInterfaceOrientation)interfaceOrientation {\n\n    return (interfaceOrientation\
    \ == UIInterfaceOrientationPortrait ||\n            interfaceOrientation == UIInterfaceOrientationLandscapeRight);\n\
    }\n```\n\nThe preceding code snippet enables your application to support both\
    \ the portrait and landscape-right modes."
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Handling Rotations\n\nThe iPhone SDK view controller exposes several events\
    \ that you can handle during the rotation of the screen. The ability to handle\
    \ events fired during rotation is important because it allows you to reposition\
    \ the views on the View, or you can stop media playback while the screen is rotating.\
    \ The events that you can handle are:\n\n+   willAnimateFirstHalfOfRotationToInterfaceOrientation:\n\
    +   willAnimateSecondHalfOfRotationFromInterfaceOrientation:\n+   willRotateToInterfaceOrientation:\n\
    +   willAnimateRotationToInterfaceOrientation:\n\nThe following sections take\
    \ a more detailed look at each of these events.\n\n# willAnimateFirstHalfOfRotationToInterfaceOrientation:\n\
    \nFirst, the willAnimateFirstHalfOfRotationToInterfaceOrientation: event is fired\
    \ just before the rotation of the View starts. The method looks like this:\n\n\
    ```\n- (void)willAnimateFirstHalfOfRotationToInterfaceOrientation:\n(UIInterfaceOrientation)\
    \ toInterfaceOrientation\n duration: (NSTimeInterval) duration {\n}\n```\n\nThe\
    \ toInterfaceOrientation parameter indicates the orientation that the View is\
    \ changing to, and the duration parameter indicates the duration of the first\
    \ half of the rotation, in seconds.\n\nIn this event, you can insert your code\
    \ to perform tasks that you want to perform before the rotation starts, such as\
    \ pausing media playback, pausing animations, and so on.\n\n# willAnimateSecondHalfOfRotationFromInterfaceOrientation:\n\
    \nThe willAnimateSecondHalfOfRotationFromInterfaceOrientation: event is fired\
    \ when the rotation is halfway through (see Figure 6-6). The method looks like\
    \ this:\n\n```\n- (void)willAnimateSecondHalfOfRotationFromInterfaceOrientation:\n\
    (UIInterfaceOrientation) fromInterfaceOrientation\n duration: (NSTimeInterval)\
    \ duration {\n}\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "![](img/16991b58db5894715c4a443315e06a22_178_0.png)\n\nFIGURE 6-6\n\nThe fromInterfaceOrientation\
    \ parameter indicates the orientation that it is changing from, whereas the duration\
    \ parameter indicates the duration of the second half of the rotation, in seconds.\n\
    \nIn this event, you typically perform tasks when the rotation is halfway done,\
    \ such as repositioning the views on the View, resuming media playback, and so\
    \ on.\n\n# willRotateToInterfaceOrientation:\n\nThe previous two events are fired\
    \ consecutively — first the willAnimateFirstHalfOfRotationToInterfaceOrientation:\
    \ is fired, followed by the willAnimateSecondHalfOfRotationFromInterfaceOrientation\
    \ event. If you do not need two separate events for handling rotation, you can\
    \ use the simpler willRotateToInterfaceOrientation: event.\n\nThe willRotateToInterfaceOrientation:\
    \ event is fired before the orientation starts. In contrast to the previous two\
    \ events, this is a one-step process. Note that if you handle this event, the\
    \ willAnimateFirstHalfOfRotationToInterfaceOrientation: and willAnimateSecondHalfOfRotationFromInterfaceOrientation:\
    \ events will not be fired anymore.\n\nThe method looks like this:\n\n```\n- (void)willRotateToInterfaceOrientation:\n\
    (UIInterfaceOrientation) toInterfaceOrientation\n duration: (NSTimeInterval) duration\
    \ {\n\n}\n```\n\nThe toInterfaceOrientation parameter indicates the orientation\
    \ that it is changing to, and the duration parameter indicates the duration of\
    \ the rotation, in seconds."
  merge: -1
  img_proc: true
