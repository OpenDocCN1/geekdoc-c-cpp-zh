    # Using the Table View


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - How to manually add a Table view to a View, and wire the data source and
    delegate to your View Controller

    +   - How to handle the various events in the table view to populate it with items

    +   - How to handle the various events in the Table view so that users can select
    the items contained within it

    +   - How to display text and images in the rows of the table view

    +   - How to display the items from a property list in a table view

    +   - How to group the items in a table view into sections

    +   - How to add indexing to the table view

    +   - How to add search capabilities to the table view

    +   - How to add disclosures and checkmarks to rows in the table view


    One of the most commonly used views in iPhone applications is the Table view.
    The Table view is used to display lists of items from which users can select,
    or they can tap it to display more information. Figure 10-1 shows a Table view
    in action in the Settings Application.


    In Chapter 8, you had your first taste of the Table view when you developed a
    Navigation-based Application project. That chapter didn''t fully dive into how
    the Table view works, and a lot of details were purposely left out. The Table
    view is such an important topic that it deserves a chapter on its own.'
