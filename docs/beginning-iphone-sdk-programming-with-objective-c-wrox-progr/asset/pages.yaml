- pgno: 110
  md: "# How It Works\n\nTo use UIAlertView, you first instantiate it and initialize\
    \ it with the various arguments:\n\n```\nUIAlertView *alert = [[UIAlertView alloc]\
    \ initWithTitle:@\"Hello\"\nmessage:@\"This is an alert view\"\ndelegate:self\n\
    cancelButtonTitle:@\"OK\"\notherButtonTitles:nil];\n```\n\nThe first parameter\
    \ is the title of the alert view, which you set to \"Hello\". The second is the\
    \ message, which you set to \"This is an alert view\". The third is the delegate,\
    \ which you need to set to an object that will handle the events fired by the\
    \ UIAlertView object. In this case, you set it to self, which means that the event\
    \ handler will be implemented in the current class, that is, the View Controller.\
    \ The cancelButtonTitle parameter displays a button to dismiss your alert view.\
    \ Last, the otherButtonTitles parameter allows you to display additional buttons\
    \ if needed. If no additional buttons are needed, simply set this to nil.\n\n\
    To show the alert view modally, use the show method:\n\n```\n[alert show];\n```\n\
    \nFor simple use of the alert view, you don't really need to handle the events\
    \ fired by it. Tapping the OK button (as set in the cancelButtonTitle parameter)\
    \ simply dismisses the alert view.\n\nIf you want more than one button, you need\
    \ to set the otherButtonTitles parameter, like this:\n\n```\nUIAlertView *alert\
    \ = [[UIAlertView alloc] initWithTitle:@\"Hello\"\nmessage:@\"This is an alert\
    \ view\"\ndelegate:self\ncancelButtonTitle:@\"OK\"\notherButtonTitles:@\"Option\
    \ 1\", @\"Option 2\", nil];\n```\n\nNote that you need to end the otherButtonTitles\
    \ parameter with a nil or a runtime error will occur.\n\nNow that you have three\
    \ buttons, you need to be able to know which button the user pressed —in particular,\
    \ whether Option 1 or Option 2 was pressed. To do so, you need to handle the event\
    \ raised by the UIAlertView class. You do so by ensuring that your View Controller\
    \ conforms to the UIAlertViewDelegate protocol:\n\n```\n@interface UsingViewsViewController\
    \ : UIViewController <UIAlertViewDelegate> {\n    //...\n}\n```\n\nThe UIAlertViewDelegate\
    \ protocol contains several methods associated with the alert view. To know which\
    \ button the user tapped, you need to implement the alertView:clickedButtonAtIndex:\
    \ method:\n\n```\n- (void)alertView:(UIAlertView *)alertView clickedButtonAtIndex:\n\
    (NSInteger)buttonIndex {\n    NSLog([NSString stringWithFormat:@\"%d\", buttonIndex]);\n\
    }\n```\n\nThe index of the button clicked will be passed in via the clickedButtonAtIndex:\
    \ parameter."
  merge: -1
  img_proc: true
- pgno: 111
  md: "> **NOTE** Refer to Appendix D for a discussion of the concept of protocols\
    \ in Objective-C.\n\n# Using the Action Sheet\n\nAlthough the Alert view can display\
    \ multiple buttons, its primary use is still as a tool to alert users when something\
    \ happens. If you need to display a message with multiple choices for the user\
    \ to select, you should use an action sheet rather than the Alert view. An *action\
    \ sheet* displays a collection of buttons among which the user can select one.\
    \ It always emerges from the bottom of the screen and is anchored to the sides\
    \ of the screen, giving the cue to the user that the action sheet's details are\
    \ connected to the current application. A good example of the use of an action\
    \ sheet is when you tap on the \"+\" button in Safari. Tapping on the \"+\" button\
    \ displays an action sheet where you add a bookmark, add the current page to the\
    \ Home Screen, or mail the link of the current page. The following Try It Out\
    \ puts you to work with an action sheet.\n\n# TRY IT OUT Using an Action Sheet\n\
    \n+   1. Using the same project created in the previous section, modify the `viewDidLoad`\
    \ method (in the `UsingViewsViewController.m` file) as follows:\n+   ```objc\n\
    +   - (void)viewDidLoad {\n+   \n+       UIActionSheet *action = [[UIActionSheet\
    \ alloc]\n+           initWithTitle:@\"Title of Action Sheet\"\n+           delegate:self\n\
