  md: '![](img/16991b58db5894715c4a443315e06a22_52_0.png)


    # Write Your First Hello World! Application


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - Create a new iPhone project

    +   - Build your first iPhone application using Xcode

    +   - Design the user interface (UI) of your iPhone application using Interface
    Builder

    +   - Write some simple code to allow the application to rotate its content based
    on the orientation of the device.

    +   - Add an icon to your iPhone application


    Now that you have set up all the tools and SDK, you are ready to start developing
    for the iPhone and iPod Touch! For programming books, it is customary to start
    the chapter by showing you how to develop a “Hello World!” application. This approach
    allows you to use the various tools very quickly without getting bogged down in
    the details. It also provides you with instant gratification: You see for yourself
    that things really work, which can be a morale booster that inspires you to learn
    more.


