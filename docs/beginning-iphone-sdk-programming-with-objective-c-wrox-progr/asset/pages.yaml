- pgno: 212
  md: '# 8


    # Tab Bar and Navigation Applications


    # WHAT YOU WILL LEARN IN THIS CHAPTER


    +   - How to create Tab Bar applications

    +   - How to display Tab Bar applications in different orientations

    +   - How to create navigation-based applications

    +   - How to navigate from one View window to another in a navigation-based application


    The previous chapter demonstrated how to create a multiview application by using
    multiple view controllers. In fact, multiview applications are so common that
    the iPhone has a special category of application named after it: Tab Bar applications.
    A Tab Bar application consists of a Tab Bar commonly located at the bottom of
    the screen. Within the Tab Bar are Tab Bar items, which when touched display a
    particular view. One good example of a Tab Bar application is the Phone application
    in iPhone (see Figure 8-1). The Phone application contains five Tab Bar items:
    Favorites, Recents, Contacts, Keypad, and Voicemail. For example, when you touch
    the Favorites item, you see a list of editable favorite contacts. Touching the
    Contacts item displays the entire list of contacts stored on your iPhone.


    ![](img/16991b58db5894715c4a443315e06a22_212_0.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'In addition to Tab Bar applications, a type of application commonly found on
    the iPhone is the navigation-based application. A navigation-based application
    contains a UI that allows users to drill into a hierarchy of items. It has a navigation
    bar at the top of the screen showing the item that is currently pushed into a
    stack. Figure 8-2 shows a good example of a navigation-based application — Settings.


    ![](img/16991b58db5894715c4a443315e06a22_213_0.png)


    FIGURE 8-2


    In the Settings application, you can drill down into the settings of an application
    by selecting the item and navigating to another screen. When you want to go back
    to the previous screen, you simply touch the little button at the top-left corner
    of the screen to navigate back.


    Hence, this chapter teaches you how to create these two types of applications
    using the templates provided by the iPhone SDK.


    # TAB BAR APPLICATIONS


    Up until this point, you have seen the use of two types of application templates
    provided by the iPhone SDK: View-based Application and Window-based Application.
    The View-based Application template is the easiest to get started while the Window-based
    Application template provides the skeleton of an iPhone application and lets you
    create everything by yourself.'
