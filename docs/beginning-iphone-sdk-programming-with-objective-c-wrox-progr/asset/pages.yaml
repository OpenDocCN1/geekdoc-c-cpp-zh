- pgno: 104
  md: '# WHAT YOU HAVE LEARNED IN THIS CHAPTER


    | TOPIC | KEY CONCEPTS |

    |---|---|

    | Delegate files | The delegate files contain code that is typically executed
    during the loading/unloading of the application. |

    | View Controllers | View Controllers manage views as well as perform navigation
    and memory management. |

    | Action | An action is a method that can handle events raised by views (for example,
    when a button is clicked, etc.) in the View window. |

    | Outlet | An outlet allows your code to programmatically reference a view on
    the View window. |

    | Adding outlet using code | Use the `IBOutlet` keyword:


    `IBOutlet UITextField *nameTextField;` |

    | Adding action using code | Use the `IBAction` keyword:


    `- (IBAction)btnClicked:(id)sender;` |

    | Connecting actions | To link actions, you always drag from the view in the View
    window onto the File''s Owner item. |

    | Connection outlets | To link outlets, you always drag from the File''s Owner
    item onto the required view in the View window. |'
