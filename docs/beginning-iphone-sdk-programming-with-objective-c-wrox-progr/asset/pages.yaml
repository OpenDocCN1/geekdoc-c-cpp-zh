    +   - Image Picker

    +   - Controllers


    The iPhone SDK consists of the following frameworks shown in Table 1-1, grouped
    by functionalities.


    > NOTE A framework is a software library that provides specific functionalities.


    # TABLE 1-1: The Frameworks in the iPhone SDK


    | FRAMEWORK NAME | DESCRIPTION |

    |---|---|

    | AddressBook.framework | Provides access to the centralized database for storing
    a user''s contacts. |

    | AddressBookUI.framework | Provides the UI to display the contacts stored in
    the Address Book database. |

    | AudioToolbox.framework | Provides low-level C APIs for audio recording and playback,
    as well as managing the audio hardware. |

    | AudioUnit.framework | Provides the interface for iPhone OS-supplied audio processing
    plug-ins in your application. |

    | AVFoundation.framework | Provides low-level C APIs for audio recording and playback,
    as well as for managing the audio hardware. |

    | CFNetwork.framework | Provides access to network services and configurations,
    such as HTTP, FTP, and Bonjour services. |

    | CoreAudio.framework | Declares data types and constants used by other Core Audio
    interfaces. |

    | CoreData.framework | Provides a generalized solution for object graph management
    in your application. |

    | CoreFoundation.framework | Provides abstraction for common data types, Unicode
    strings, XML, URL resource, and so on. |

    | CoreGraphics.framework | Provides C-based APIs for 2D rendering; based on the
    Quartz drawing engine. |'
  merge: -1
