- pgno: 412
  md: "![](img/16991b58db5894715c4a443315e06a22_412_0.png)\n\nFIGURE 17-3\n\n# How\
    \ It Works\n\nTo use the accelerometer in your iPhone or iPod Touch, you need\
    \ to the implement the UIAccelerometerDelegate protocol in your delegate (such\
    \ as the View Controller):\n\n```\n@interface AccelerometerViewController : UIViewController\n\
    <UIAccelerometerDelegate> {\n```\n\nWhen the view is loaded, you first obtain\
    \ a single instance of the UIAccelerometer class using the sharedAccelerometer\
    \ method. You then specify the delegate of the instance and the update interval\
    \ in which you want to obtain accelerometer data:\n\n```\n- (void)viewDidLoad\
    \ {\n    UIAccelerometer *acc = [UIAccelerometer sharedAccelerometer];\n    acc.delegate\
    \ = self;\n    acc.updateInterval = 1.0f/60.0f;\n    [super viewDidLoad];\n}\n\
    ```\n\nThe updateInterval property specifies the interval in seconds — that is,\
    \ the number of seconds between updates. In the preceding case, you indicate that\
    \ you want the accelerometer data to be updated 60 times a second."
  merge: -1
  img_proc: true
- pgno: 413
  md: "The UIAccelerometerDelegate protocol defines a single method that you need\
    \ to implement in order to obtain accelerometer data: `accelerometer:didAccelerate:`.\
    \ In your case, you extract the values of the three axes and display them on the\
    \ three Label views:\n\n```\n```objc\n- (void)accelerometer:(UIAccelerometer *)\
    \ acc\ndidAccelerate:(UIAcceleration *)acceleration {\n    NSString *str = [[NSString\
    \ alloc] initWithFormat:@\"%g\", acceleration.x];\n    labelX.text = str;\n  \
    \  str = [[NSString alloc] initWithFormat:@\"%g\", acceleration.y];\n    labelY.text\
    \ = str;\n    str = [[NSString alloc] initWithFormat:@\"%g\", acceleration.z];\n\
    \    labelZ.text = str;\n    [str release];\n}\n```\n```\n\n# DETECTING SHAKES\
    \ IN IPHONE OS2 AND EARLIER\n\nIn iPhone OS 3.0, Apple provides the Shake API\
    \ (discussed in the next section), which is a set of methods that allows you to\
    \ detect shakes to the device. However, how do you detect shakes in iPhone OS\
    \ 2.0 and earlier?\n\nThe answer is actually very simple. You can add some code\
    \ in the `accelerometer:didAccelerate:` event, like this:\n\n```\n```objc\n#import\
    \ \"AccelerometerViewController.h\"\n#define kAccelerationThreshold 2.2\n//...\n\
    //...\n\n- (void)accelerometer:(UIAccelerometer *) acc\n    didAccelerate:(UIAcceleration\
    \ *)acceleration {\n    if (fabsf(acceleration.x) > kAccelerationThreshold)\n\
    \    {\n        NSLog(@\"Shake detected\");\n    }\n}\n```\n```\n\nThe `fabsf()`\
    \ function returns the absolute value of a floating-point number. In this case,\
    \ if the X-axis value registers an absolute value of more than 2.2, it is deemed\
    \ that the user is shaking the device."
  merge: -1
  img_proc: true
