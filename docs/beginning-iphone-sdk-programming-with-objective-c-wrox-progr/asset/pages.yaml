    \ How It Works\n\nTo load the Web view with a URL, you first instantiate an NSURL\
    \ object with a URL via the URLWithString method:\n\n```\n```objc\nNSURL *url\
    \ = [NSURL URLWithString:@\"http://www.apple.com\"];\n```\n```\n\nYou then create\
    \ an NSURLRequest object by passing the NSURL object to its requestWithURL: method:\n\
    \n```\n```objc\nNSURLRequest *req = [NSURLRequest requestWithURL:url];\n```\n\
