- pgno: 523
  md: 'Back in the iPhone Developer Program Portal, you are now ready to download
    and install the Development Certificate onto your iPhone or iPod Touch. Click
    the Download Now button (see Figure E-17) to download the Development Certificate
    to your Mac. Click Continue.


    ![](img/16991b58db5894715c4a443315e06a22_523_0.png)


    FIGURE E-17


    In the Downloads folder of your Mac, double-click the developer_identity.cer file
    that you have just downloaded to install it into a keychain on your Mac. When
    prompted (see Figure E-18), click OK.


    Back in the iPhone Developer Program Portal, it will now show you how to verify
    that the certificate has been installed properly in the Keychain Access application
    (see Figure E-19). Click Continue.


    ![](img/16991b58db5894715c4a443315e06a22_523_1.png)


    FIGURE E-18'
  merge: -1
  img_proc: true
- pgno: 524
  md: '![](img/16991b58db5894715c4a443315e06a22_524_0.png)


    FIGURE E-19


    In the Keychain Access application, select the login keychain and look for the
    certificate named iPhone Developer: your name (see Figure E-20). If you can see
    it, your certificate is installed correctly.


    ![](img/16991b58db5894715c4a443315e06a22_524_1.png)


    FIGURE E-20'
  merge: -1
