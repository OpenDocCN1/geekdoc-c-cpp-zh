- pgno: 91
  md: "The nameTextField is an IBOutlet instance member of type UITextField. A good\
    \ practice in iPhone programming is to expose the member variable as a property\
    \ using the @property identifier:\n\n```\n```objective-c\n#import <UIKit/UIKit.h>\n\
    \n@interface BasicUIViewController : UIViewController {\n    IBOutlet UITextField\
    \ *nameTextField;\n}\n\n@property (nonatomic, retain) UITextField *nameTextField;\n\
    \n- (IBAction)btnClicked:(id)sender;\n@end\n```\n```\n\n> **NOTE** The IBOutlet\
    \ tag can also be added to the @property identifier. This syntax is common in\
    \ the Apple documentation:\n> \n> ```objective-c\n> @property (nonatomic, retain)\
    \ IBOutlet UITextField *nameTextField;\n> ```\n\n> **NOTE** For the use of the\
    \ nonatomic and retain identifiers, refer to Appendix D, where you can find an\
    \ introduction to Objective-C. Also, the @synthesize keyword, discussed shortly,\
    \ is explained in more detail there as well.\n\nWhen the outlet is now exposed\
    \ as a property, you need to define the getters and setters for the property.\
    \ A quick and easy way is to use the @synthesize keyword in the BasicUIViewController.m\
    \ file, like this:\n\n```\n```objective-c\n#import \"BasicUIViewController.h\"\
    \n\n@implementation BasicUIViewController\n\n@synthesize nameTextField;\n```\n\
    ```\n\n# Coding the Action\n\nAs shown earlier, you connected the Touch Up Inside\
    \ event of the Round Rect Button view with the btnClick: action defined in the\
    \ View Controller. To implement the btnClick: method, code the following in the\
    \ BasicUIViewController.m file:\n\n```\n```objective-c\n#import \"BasicUIViewController.h\"\
    \n\n@implementation BasicUIViewController\n\n@synthesize nameTextField;\n```\n\
    ```"
  merge: -1
