- pgno: 387
  md: '> **NOTE** Remember, this example only works on a real device. Testing it on
    the iPhone Simulator will not work. Appendix D discusses how to prepare your iPhone
    for testing.


    ![](img/16991b58db5894715c4a443315e06a22_387_0.png)


    FIGURE 16-2


    # How It Works


    The magic of invoking the Mail application lies in the string that you create
    in the sendMailTo:withSubject:withBody: method that you have defined:


    ```

    NSString *emailString = [[NSString alloc]

    initWithFormat:@"mailto:%@?to=%@&subject=%@&body=%@",

    [toStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding],

    [subjectStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding],

    [bodyStr stringByAddingPercentEscapesUsingEncoding:NSASCIIStringEncoding]];

    ```


    Basically, this is a URL string with the mailto: protocol indicated. The various
    parameters, such as to, subject, and body, are inserted into the string. Note
    that you use the stringByAddingPercentEscapesUsingEncoding: method of the NSString
    class to encode with various parameters with the correct percent escapes so that
    the end result is a valid URL string.


    To invoke the Mail application, simply call the sharedApplication method to return
    the singleton application instance and then use the openURL: method to invoke
    the Mail application:


    ```

    [[UIApplication sharedApplication] openURL:[NSURL URLWithString:emailString]];

    [emailString release];

    ```'
