    # Implementing the Pinch Gesture


    Now that you know the technique for detecting multi-touches in your application,
    you can write some cool applications that make use of multi-touches. A cool example
    would be to implement the famous iPhone pinch gesture that differentiates it from
    the competition.


    Using the pinch gesture, you place two fingers on the screen and pinch by moving
    the two fingers closer to each other. This often translates to a zoom-out action
    when applying this gesture to, say, a photo that you are viewing, or to a Web
    page in Mobile Safari. When you move the two fingers apart, you zoom in on a photo
    or Web page.


    To use the pinch gesture on an image, you actually need to enlarge the image first.
    This is because the image can only be resized if its display mode is set to UIViewContentModeScaleAspectFit.
    Hence, in this case, you need to single-tap on the image (which actually sets
    the image mode to UIViewContentModeScaleAspectFit) before you can try the pinching
    effect.


    In the following Try It Out, you learn how to implement the pinch gesture to zoom
    the image in and out in the image view.'
  merge: -1
  img_proc: true
