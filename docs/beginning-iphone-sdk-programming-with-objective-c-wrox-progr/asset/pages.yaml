- pgno: 40
  md: '> **NOTE** *For a more detailed look at how you can test your application on
    a real device, refer to Appendix E.*


    # Uninstalling Applications from the iPhone Simulator


    The user domain of the iPhone OS file system for the iPhone Simulator is stored
    in the `~/Library/Application Support/iPhone Simulator/User/` folder.


    > **NOTE** *The `~/Library/Application Support/iPhone Simulator/User/` folder
    is also known as the `<iPhoneUserDomain>`.*


    All third-party applications are stored in the `<iPhoneUserDomain>/Applications/`
    folder. When an application is deployed onto the iPhone Simulator, an icon is
    created on the Home screen (shown on the left in Figure 1-9) and a file and a
    folder are created within the `Applications` folder (shown on the right in Figure
    1-9).


    ![](img/16991b58db5894715c4a443315e06a22_40_0.png)


    FIGURE 1-9


    To uninstall (delete) an application, execute the following steps:


    +   1. Click and hold the icon of the application in the Home screen until all
    the icons start wriggling. Observe that all the icons now have an "x" button displayed
    on their top left corners.

    +   2. Click the x button (see Figure 1-10) next to the icon of the application
    you want to uninstall.

    +   3. An alert window appears asking if you are sure you want to delete the icon.
    Click Delete to confirm the deletion.


    ![](img/16991b58db5894715c4a443315e06a22_40_1.png)


    FIGURE 1-10'
  merge: -1
  img_proc: true
- pgno: 41
  md: '> **WARNING** When the application is uninstalled, the corresponding file and
    folder in the Applications folder are deleted automatically.


    To reset the iPhone Simulator to its original state, the easiest way is to select
    the iPhone Simulator ⌥ Reset Content and Settings menu item.


    # Interface Builder


    Interface Builder is a visual tool that allows you to design your user interfaces
    for your iPhone applications. Using Interface Builder, you drag and drop views
    on windows and then connect the various views with outlets and actions so that
    they can programmatically interact with your code.


    > **NOTE** Outlets and actions are discussed in more detail in Chapter 3.


    Figure 1-11 shows the various windows in Interface Builder.


    ![](img/16991b58db5894715c4a443315e06a22_41_0.png)


    FIGURE 1-11


    Appendix C discusses Interface Builder in more detail.'
  merge: -1
