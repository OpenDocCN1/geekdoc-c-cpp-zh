- pgno: 418
  md: "![](img/16991b58db5894715c4a443315e06a22_418_0.png)\n\n# FIGURE 17-8\n\n+ \
    \  16. Tap the TextField view to make the keyboard appear. Choose Hardware ▸ Shake\
    \ Gesture to simulate shaking the device again. Observe the values printed in\
    \ the Debugger Console window.\n+   \n+   17. Close the keyboard by tapping the\
    \ return key on the keyboard. Simulate shaking the simulator again and observe\
    \ the output on the Debugger Console.\n\n# How It Works\n\nYou need to be aware\
    \ that the three events used for monitoring shakes are fired only when there is\
    \ a first responder in your View. Hence, the first thing you do when your View\
    \ appears is to set it to become the first responder (in the ShakeViewController.m\
    \ file):\n\n```\n- (void) viewDidAppear:(BOOL)animated\n{\n    [self.view becomeFirstResponder];\n\
    \    [super viewDidAppear:animated];\n}\n```"
  merge: -1
  img_proc: true
- pgno: 419
  md: "However, by default, the View cannot be a first responder, so you need to create\
    \ a UIView subclass (ShakeView.m) so that you can override the default canBecomeFirstResponder\
    \ method to return a YES:\n\n```\n- (BOOL)canBecomeFirstResponder {\n    return\
    \ YES;\n}\n```\n\nDoing so allows your View to become a first responder. By default,\
    \ Interface Builder wires your View with the UIView base class (with which you\
    \ need not do anything most of the time). You now need to tell Interface Builder\
    \ to use the newly created ShakeView subclass.\n\nNext, you handle the three events\
    \ in the ShakeViewController.m file:\n\n```\n- (void)motionBegan:(UIEventSubtype)motion\
    \ withEvent:(UIEvent *)event {\n    if (event.subtype == UIEventSubtypeMotionShake\
    \ ) {\n        NSLog(@\"motionBegan:\");\n    }\n}\n```\n\n```\n- (void)motionCancelled:(UIEventSubtype)motion\
    \ withEvent:(UIEvent *)event {\n    if (event.subtype == UIEventSubtypeMotionShake\
    \ ) {\n        NSLog(@\"motionCancelled:\");\n    }\n}\n```\n\n```\n- (void)motionEnded:(UIEventSubtype)motion\
    \ withEvent:(UIEvent *)event {\n    if (event.subtype == UIEventSubtypeMotionShake\
    \ ) {\n        NSLog(@\"motionEnded:\");\n    }\n}\n```\n\nFor each event, you\
    \ first check that the motion is indeed a shake; then print a debugging statement\
    \ in the Debugger Console.\n\nIn the doneEditing: method (which is fired when\
    \ the user dismisses the keyboard by tapping the Return key), you make the View\
    \ the first responder:\n\n```\n- (IBAction) doneEditing: (id) sender {\n    //---when\
    \ keyboard is hidden, make the view the first responder\n    // else the Shake\
    \ API will not work--\n    [self.view becomeFirstResponder];\n}\n```\n\nIf you\
    \ don't do this, the three motion-sensing events are not fired. The key point\
    \ to remember is that something has to be the first responder.\n\nThe motionBegan:\
    \ event is fired when the OS suspects that the device is being shaken. If eventually\
    \ the OS determines that the action is not a shake, the motionCancelled: event\
    \ is fired. When the OS finally determines that the action is a shake action,\
    \ the motionEnded: event is fired."
