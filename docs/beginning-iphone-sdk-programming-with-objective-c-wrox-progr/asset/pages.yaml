- pgno: 486
  md: "In a typical View Controller class, the class inherits from the UIViewController\
    \ class, such as in the following:\n\n```\n@interface HelloWorldViewController\
    \ : UIViewController {\n}\n```\n\n# @implementation\n\nTo implement a class declared\
    \ in the header file, you use the @implementation compiler directive, like this:\n\
    \n```\n#import \"SomeClass.h\"\n\n@implementation SomeClass\n\n@end\n```\n\nThis\
    \ is done in a separate file from the header file. In Objective-C, you define\
    \ your class in an .m file. Note that the class definition ends with the @end\
    \ compiler directive.\n\n> NOTE As mentioned earlier, you can also put your declaration\
    \ inside an .m file. Hence, in your .m file you would then have both the @interface\
    \ and @implementation directives.\n\n# @class\n\nIf your class references another\
    \ class defined in another file, you need to import the header file of that file\
    \ before you can use it. Consider the following example where you have defined\
    \ two classes — SomeClass and AnotherClass. If you are using an instance of the\
    \ AnotherClass from within SomeClass, you need to import the AnotherClass.h file,\
    \ as in the following code snippet:\n\n```\n//---SomeClass.h---\n#import <Foundation/Foundation.h>\n\
    #import \"AnotherClass.h\"\n\n@interface SomeClass : NSObject {\n    //---an object\
    \ from AnotherClass---\n    AnotherClass *anotherClass;\n}\n@end\n\n//---AnotherClass.h---\n\
    #import <Foundation/Foundation.h>\n```"
  merge: -1
  img_proc: true
- pgno: 487
  md: "```\n#import \"SomeClass.h\"\n\n@interface AnotherClass : NSObject {\n}\n\n\
    @end\n```\n\nHowever, if within AnotherClass you want to create an instance of\
    \ SomeClass, you will not be able to simply import SomeClass.h in AnotherClass,\
    \ like this:\n\n```\n//---SomeClass.h---\n#import <Foundation/Foundation.h>\n\
    #import \"AnotherClass.h\"\n\n@interface SomeClass : NSObject {\n    AnotherClass\
    \ *anotherClass;\n}\n\n@end\n\n//---AnotherClass.h---\n#import <Foundation/Foundation.h>\n\
    #import \"SomeClass.h\" //---cannot simply import here---\n\n@interface AnotherClass\
    \ : NSObject {\n    SomeClass *someClass;  //---using an instance of SomeClass---\n\
    }\n\n@end\n```\n\nDoing so results in circular inclusion. To prevent that, Objective-C\
    \ uses the @class compiler directive as a forward declaration to inform the compiler\
    \ that the class you specified is a valid class. You usually use the @class compiler\
    \ directive in the header file, and in the implementation file you can use the\
    \ @import compiler directive to tell the compiler more about the content of the\
    \ class that you are using.\n\nUsing the @class compiler directive, the program\
    \ now looks like this:\n\n```\n//---SomeClass.h---\n#import <Foundation/Foundation.h>\n\
    @class AnotherClass; //---forward declaration---\n\n@interface SomeClass : NSObject\
    \ {\n    AnotherClass *anotherClass;\n}\n\n@end\n\n//---AnotherClass.h---\n#import\
    \ <Foundation/Foundation.h>\n```"
  merge: -1
  img_proc: true
