    \n3. Navigate to /Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator<version>.sdk/usr/lib\
    \ and select the file named libsqlite3.dylib.\n\n> NOTE <version> represents the\
    \ version of the iPhone SDK you are using. For example, if the version you are\
    \ using is 3.1, the path is /Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator3.1.sdk/usr/lib.\n\
