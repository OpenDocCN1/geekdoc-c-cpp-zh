  md: "# Invoking Safari\n\nIf you want to invoke the Safari Web browser on your iPhone,\
    \ you can also make use of a URL string and then use the openURL: method of the\
    \ application instance, like this:\n\n```\n[[UIApplication sharedApplication]\n\
    \    openURL:[NSURL URLWithString: @\"http://www.apple\n.com\"]];\n```\n\nThe\
    \ preceding code snippet invokes Safari to open the www.apple.com page (see Figure\
    \ 16-3).\n\n# Invoking the Phone\n\nTo make a phone call using the iPhone's dialer,\
    \ use the following URL string:\n\n```\n[[UIApplication sharedApplication]\n \
    \   openURL:[NSURL URLWithString:@\"tel:1234567890*\"]];\n```\n\nThe preceding\
    \ statement invokes the dialer of the iPhone using the phone number specified.\n\
    \n> NOTE Note that the preceding statement works only for iPhone and not iPod\
    \ Touch because the iPod Touch does not have phone capabilities. Also, you would\
    \ need to a real device to test this out; the code does not have an effect on\
    \ the iPhone Simulator. Appendix E discusses how to prepare your iPhone for testing.\n\
    \n![](img/16991b58db5894715c4a443315e06a22_388_0.png)\n\n# Invoking SMS\n\nYou\
    \ can also use a URL string to send SMS messages using the SMS application:\n\n\
    ```\n[[UIApplication sharedApplication]\n    openURL:[NSURL URLWithString:\n \
    \   @\"sms:96924065*\"]];\n```\n\nThe preceding statement invokes the SMS application\
    \ (see Figure 16-4).\n\n![](img/16991b58db5894715c4a443315e06a22_388_1.png)"
