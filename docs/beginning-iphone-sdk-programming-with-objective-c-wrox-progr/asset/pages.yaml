  md: "If the device is held upright and moved to the right quickly, the value of\
    \ the X-axis will increase from 0 to a positive value. If it is moved to the left\
    \ quickly, the value of the X-axis will decrease from 0 to a negative value. If\
    \ the device is moved upward quickly, the value of the Y-axis will increase from\
    \ -1.0 to a larger value. If the device is moved downward quickly, the value of\
    \ the Y-axis will decrease from -1.0 to a smaller value.\n\nIf the device is lying\
    \ flat on a table and then dropped, the value of the Z-axis will decrease from\
    \ -1.0 to a smaller number. If it is moved upward, the value of the Z-axis will\
    \ increase from -1.0 to a bigger number.\n\n> NOTE The accelerometer used on the\
    \ iPhone and iPod Touch gives a maximum reading of about +/- 2.3G with a resolution\
    \ of about 0.018 g.\n\nIn the following Try it Out, you learn how to programmatically\
    \ access the data returned by the accelerometer. Obtaining the accelerometer data\
    \ allows you to build very interesting applications, such as a spirit level, as\
    \ well as games that depend on motion detection.\n\n# TRY IT OUT Accessing the\
    \ Accelerometer Data\n\nCodefile [Accelerometer.zip] available for download at\
    \ Wrox.com\n\n+   1. Using Xcode, create a new View-based Application project\
    \ and name it Accelerometer.\n+   2. Double-click the AccelerometerViewController.xib\
    \ file to edit it in Interface Builder.\n+   3. Populate the View window with\
    \ the six Label views, as shown in Figure 17-2.\n+   4. In the AccelerometerViewController.h\
    \ file, add the following statements that appear in bold:\n\n```\n#import <UIKit/UIKit.h>\n\
    \n@interface AccelerometerViewController : UIViewController <UIAccelerometerDelegate>\
    \ {\n    IBOutlet UILabel *labelX;\n    IBOutlet UILabel *labelY;\n    IBOutlet\
    \ UILabel *labelZ;\n}\n@property (nonatomic, retain) UILabel *labelX;\n@property\
    \ (nonatomic, retain) UILabel *labelY;\n@property (nonatomic, retain) UILabel\
    \ *labelZ;\n\n@end\n```\n\n![](img/16991b58db5894715c4a443315e06a22_410_0.png)"
  merge: -1
