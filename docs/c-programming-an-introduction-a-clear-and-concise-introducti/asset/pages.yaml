  md: "# Classes Defined\n\nWhen we create a class in C++, we create two distinct\
    \ parts – the data members (also just called members) which define the attributes\
    \ of a class, and the methods (implemented as functions), which describe the behavior\
    \ of the class.\n\nMembers and methods are defined in two distinct sections of\
    \ a class, either the public section of the private section. Members and methods\
    \ which are defined in the public section of a class are visible to all other\
    \ objects in a program. Members and methods which are defined in the private section\
    \ of a class are visible only to the class itself, and not other objects interacting\
    \ with the class. This will all make more sense when we examine a few examples.\n\
    \nClass definitions are placed in the global area, in the same place where you\
    \ define functions. A class definition begins with the keyword class and a class\
    \ name, followed by a block, which is where the member and method definitions\
    \ are placed. For example, to create a Name class we start the definition like\
    \ this:\n\n```\n```cpp\nclass Name\n{\n    // member and method definitions go\
    \ here\n};\n```\n```\n\nNotice that the closing brace of the block is followed\
    \ by a semicolon. The definitions of new types must always end with a semicolon\
    \ in C++.\n\nThe next step in defining a class is to determine the members for\
    \ the class. Sticking with our Name example, the members of a name can include\
    \ the first name, the middle name, and the last name. We could also include things\
    \ like nicknames, suffixes (Jr., Sr. etc.), but to keep things simple we'll limit\
    \ a name to the first, middle, and last names.\n\nAfter we determine the members\
    \ of the class, we have to decide if"
