  md: '# Chapter 1


    # Getting Started With Visual C++


    C++ is a compiled programming language. What does that mean? It means that the
    programs you write in C++ are translated by the compiler into machine language
    and then executed. You don''t have to understand the compilation process to begin
    learning how to program in C++. However, you do need to understand the steps your
    program has to go through from conception to execution. That is what we will be
    discussing in the chapter.


    # Downloading and Installing Visual C++ Express


    Microsoft provides a free version of C++ for non-commercial purposes, Visual C++
    Express (Visual C++). The current version is titled Visual C++ 2010 Express but
    we will leave out the year since the program is updated very often. You can find
    it at this url:


    http://www.microsoft.com/express/Downloads/#2010-Visual-CPP


    Installing Visual C++ is an automatic process. You should not experience any problems
    with either the download or the installation, especially if you choose the defaults
    during installation. If you have any problems with the download or the installation,
    you can view a video on downloading and installing Visual C++ Express. You can
    find it at this url:


    http://www.techbookspress.com/cpp


    Visual C++ programs are organized as projects. From the opening window, you select
    New Project to start a new program. So click New Project.'
  merge: -1
  img_proc: true
