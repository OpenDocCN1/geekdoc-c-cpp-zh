  md: 'examine each character in the string and compare it with the list of vowels.
    We can use a for loop to control our movement through the string.


    To write this program, we need to use a couple of string functions we haven''t
    seen before. The first of these is the substr() function. Called the “substring
    function,” this function returns a substring from a string. The arguments to the
    function are the character position you want to start the substring, and the number
    of characters you want for the substring. Here''s an example:


    ```

    ```cpp

    string word = "Hello";


    cout << word.substr(1,3);  // returns "ell"

    ```

    ```


    The characters in a string are numbered beginning at position 0. So, the letter
    “H” in “Hello” is at position 0. The “e” is at position 1. So, if we write word.substr(1,3),
    we are saying we want to return 3 characters from the word starting at position
    1.


    The second string function we need for this example is the compare() function.
    The usual relational operators don''t work with strings in C++, so we have to
    use some other means of making comparisons between strings. The compare() function
    takes a string as an argument and compares it to the string object the function
    is called from. The function returns either 0, 1, or -1, depending on the value
    of the string argument. For example, if we write:


    ```

    ```cpp

    string fruit = "banana";


    cout << word.compare("apple");

    ```

    ```


    the value 1 is returned because “banana” is greater than “apple”. If we compare
    “pear” to the variable fruit we get the value -1, because “apple” is less than
    “pear.” If we compare “banana” to “banana” we get 0, since they are equal.


    Now we can write the algorithm for the vowel-counting program.'
