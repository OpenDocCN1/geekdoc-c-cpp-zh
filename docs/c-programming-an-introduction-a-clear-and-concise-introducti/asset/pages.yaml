  md: '# Chapter 3


    # Arithmetic Operators and Expressions


    A C++ program is a collection of statements that perform some task. When we write
    statements to perform arithmetic in C++, we have to create expressions that perform
    arithmetic with the use of arithmetic operators that tell the compiler what arithmetic
