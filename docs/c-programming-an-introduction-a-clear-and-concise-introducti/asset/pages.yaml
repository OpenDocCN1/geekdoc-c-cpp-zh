    \ at 2% annual interest for 10 years. What will the value of that investment be\
    \ at the end of that period?\n\nThe algorithm for solving this problem involves\
    \ multiplying the principal by the rate and adding that value back to the principal\
    \ 10 times. We can use a for loop to solve this problem. Here is the code:\n\n\
    ```\n```cpp\n// ForLoop.cpp : main project file.\n\n#include \"stdafx.h\"\nusing\
    \ namespace System;\n\n#include <iostream>\nusing namespace std;\n\nint main(array<System::String\
    \ ^> ^args)\n{\n    double rate = 1.02;\n    double principal = 10000;\n    for\
