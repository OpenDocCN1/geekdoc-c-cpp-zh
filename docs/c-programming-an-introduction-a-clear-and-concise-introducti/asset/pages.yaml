  md: '# # Constants in C++


    A special type of variable is the *constant*. A constant is a variable whose value
    cannot change during the life of the program. Constants help make programs easier
    to read and debug and should be used when appropriate.


    A constant is declared as follows:


    ```

    ```cpp

    const double pi = 3.14159;

    ```

    ```


    This declaration looks very similar to the declaration for a regular variable.
    The only difference is the use of the keyword const before the data type.


    Whenever you have a value that you will use in several places in a program, consider
    encoding the value as a constant rather than continually typing the literal value.
    This way, if you have to use the value in several places in your program and the
    value changes, you only have to make the change one time, where the constant is
    declared, rather than in all the places the value is used. We will see many examples
    of constants in the example programs coming up later.


    # # Exercises


    +   1. Create variable declaration statements for the following data:

    +       a. Your name

    +       b. Your monthly income

    +       c. Your gpa'
