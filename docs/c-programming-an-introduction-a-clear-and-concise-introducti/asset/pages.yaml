- pgno: 21
  md: 'Variable names that consist of more than one word can either use an underscore
    to separate the words, or you can combine the two words into one and capitalize
    the first letter of the second word. This style of variable naming is called “camel
    casing” and is a very popular style of naming variables, not the least of which
    because it is easier to capitalize a letter than it is to type the underscore
    character. Camel casing is, however, just a style convention and you are not required
    to use it. You should, though, pick a particular style and be consistent in using
    it.


    Here are some examples of illegal variable names:


    +   - first name

    +   - inum

    +   - while


    The first illegal variable contains a space; the second example begins with a
    digit; the third example is a C++ reserved word.


    Variable names should always be meaningful so that the name identifies the nature
    of the data stored in it. A meaningful variable name is hoursWorked; a meaningless
    variable name is hw.


    To declare a variable, you first write the data type for the variable followed
    by the variable name. Here are some examples:


    ```

    ```

    int hoursWorked;

    bool endOfData;

    string lastName;

    ```

    ```


    Each of these lines is a separate statement, as noted by the semicolon at the
    end of the line. All statements in C++ are ended with a semicolon. These particular
    statements are called declaration statements. There will be much more discussion
    of statements as we learn about C++.


    A second kind of declaration involves giving the variable an initial'
