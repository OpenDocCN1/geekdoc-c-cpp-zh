- pgno: 139
  md: '# Chapter 11


    # Classes and Object-Oriented Programming


    The programs we write in C++ are simulations of our interactions with objects
    that exist in our world. A payroll program, for example, simulates how the company
    work for pays its employees for the work they do. Each of the pieces of a payroll
    program represent an object. For example, an employee has a time sheet, or time
    card, that stores the number of hours he or she works in a pay period. An employee
    also has a salary or hourly wage which represents the rate at which they get paid.


    In object-oriented programming, we write programs that create objects that mirror
    the objects we are trying to simulate. In C++, an object is defined by a class.
    A class includes both a definition of an object''s properties or attributes, and
    a description of the object''s behaviors. For example, when describing an automobile,
    we describe what the automobile looks like and how it behaves or performs. We
    can do the same thing in C++ by creating and using classes and objects.


    Besides defining attributes and behaviors of objects, classes also define how
    objects interact with each other. Generally, objects interact by sending messages
    to each other. Using the automobile analogy again, if a Person object wants an
    Automobile object to go, the Person sends the Automobile a “step on the gas pedal”
    message. The ability to send and receive messages is defined as part of an object''s
    behaviors.


    Another distinctive feature of classes is the ability to show or hide the attributes
    and behaviors that make up the class. Any attribute or behavior can be exposed
    to other objects or they can be hidden so that no other object has access to the
    attribute or behavior. This feature is called encapsulation and is one of the
    reasons object-oriented programming has proven to be so successful.


    In practice, you can consider a class to be a user-defined type. Being able to
    extend the types a programming language can work with is a crucial feature of
    a programming language.'
  merge: -1
  img_proc: true
