    \ = 100;\n    srand(time(NULL));\n    for(int i = 0; i < size; ++i)\n        nums[i]\
    \ = rand() % 100 + 1;\n    for(int i = 0; i < size; ++i)\n        cout << nums[i]\
    \ << \" \";\n    Console::ReadKey();\n    return 0;\n}\n```\n```\n\nAccessing\
    \ arrays using pointer notation instead of subscripts is usually more efficient.\
    \ However, pointer notation is sometimes harder to read and is mostly avoided\
    \ except in those circumstances when efficiency is particularly necessary.\n\n\
    Another situation when pointer notation is sometimes used is when large data structures,\
    \ such as vectors, are used as function arguments. Passing a large data structure\
    \ as a pointer or a reference is more efficient than passing it by value for the\
    \ obvious reason that the compiler has to make a copy of the data structure when\
    \ passing by value, while if passing by pointer or reference the compiler merely\
    \ passes a memory address to the function."
