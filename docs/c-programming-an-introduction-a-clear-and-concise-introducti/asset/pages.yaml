    # ## Creating an Abstract Data Type


    When developing a class, the first thing you need to do before writing any code
    is think through the design of the class. You can do this by asking yourself a
    few questions – what data is going to be stored in the class? What operations
    need to be performed on the data? It is not a bad idea to write this information
    down before you start programming.


    A class that is sketched out before programming starts is called an *abstract
    data type*, or *ADT* for short. An ADT will include information such as the name
    of the class, a list of the members of the class and what data they are storing,
    and a list of methods of the class and what operation they perform.


    If we want to design an ADT for a List class, we have to first decide what we
    want the class to do. Of course, we want the class to store a collection of items
    (the list). We want to be able to add items to the list, display the items in
    the list, erase the list and start over, and show the number of items in the list.
    There are more things we can do with a list but these operations are enough for
    this example. (For example, removing items from a list and sorting the list into
    alphabetical order involve advanced C++ techniques we don’t have room to discuss
    in this book.)


    We also need to decide what data we will store in the class. Since we are building
    a List class, we need something that will store a collection of data, such as
    a vector. Another piece of data that might be useful is the number of items in
    the list, or the count.


    An ADT for the List class lists out each member and method of the ADT and describes
    either what data is stored in the member, or what operation the method is supposed
    to perform. Here is an ADT for the List class:


    ADT Name: List

    ADT Purpose: store related items'
