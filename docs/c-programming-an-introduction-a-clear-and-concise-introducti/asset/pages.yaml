- pgno: 204
  md: '# ## An Inheritance Example – Vehicles


    The Vehicle class contains information about vehicles. We''ll limit our discussion
    of vehicles to vehicles with wheels. So what are some of the attributes and behaviors
    of wheeled vehicles? First, they have wheels. Most, but not all, wheeled vehicles
    have a steering mechanism. Most have an engine and a braking system, though again
    not all do, and most have some type of seating arrangement. Vehicles have the
    ability to move, as well as to stop, and to turn.


    Now we can start thinking about derived classes from the base class Vehicle. The
    automobile is derived from the Vehicle class, as is the truck, the bus, and the
    train, just to mention a few. Each of these has features in common with all vehicles,
    but each also have features distinctly their own.


    Inheritance works by first defining the attributes and behaviors that define all
    instances of the base class, and then deriving classes from the base class that
    differ from the base class in some way. You could also say that derived classes
    can exhibit more specific features of the base class. A wheeled vehicle just has
    wheels; a car has four wheels and a motor cycle has two wheels (except for those
    that have three).


    The advantage to using inheritance is that when we build a derived class from
    a base class, we can choose to use the features of the base class in our derived
    class as is, or we can modify them in some way. We don''t have to completely start
    over with a definition just because the derived class differs in some manner from
    the base class. This can save us a lot of programming and debugging time, since
    once a method is written and debugged in the base class, we can use it as-is in
    the derived class and feel confident that the method works as expected.'
  merge: -1
  img_proc: true
