  md: "# *for Loops*\n\nThe second construct used for repetition is the for loop.\
    \ The for loop is primarily used in situations where you want to iterate over\
    \ a set of statements a set number of times, as opposed to a while loop, which\
    \ is used primarily when you want to iterate over a set of statements until a\
    \ specific condition occurs.\n\n# Working With for Loops\n\nThe general form of\
    \ the for loop looks like this:\n\n```\nfor(control-var declaration; condition;\
    \ control-variable modification)\n{\n    statement1;\n    statement2;\n    statementn;\n\
    }\n```\n\nA concrete example will explain how the for loop works. Here’s a simple\
    \ program that displays the numbers 1 through 10:\n\n```\n// ForLoop.cpp : main\
    \ project file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include\
    \ <iostream>\nusing namespace std;\n```"
