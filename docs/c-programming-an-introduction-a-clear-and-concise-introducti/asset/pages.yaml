    \ determines if a student passes or fails a test, based on the letter grade (A,\
    \ B, C, and D grades are all passing; only F is a failing grade):\n\n```\n```cpp\n\
    // Switch.cpp : main project file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\
    \n#include <iostream>\nusing namespace std;\n\nint main(array<System::String ^>\
    \ ^args)\n{\n        char letterGrade;\n        cout << \"Enter your letter grade:\
    \ \";\n        cin >> letterGrade;\n        switch (letterGrade)\n        {\n\
    \        case 'A':\n        case 'B':\n        case 'C':\n        case 'D':\n\
    \                cout << \"You passed the test!\" << endl;\n                break;\n\
    \        case 'F':\n                cout << \"Sorry, you failed the test.\"\n\
    \                     << endl;\n                break;\n        default:\n   \
    \             cout << \"Enter a valid letter grade.\"\n                     <<\
