- pgno: 66
  md: "The statements inside the block are called the loop body.\n\nThere are two\
    \ necessary ingredients of a while loop: 1) a condition to be tested; and 2) a\
    \ statement that causes the condition to eventually become false. The second condition\
    \ is important because if the condition controlling the loop never becomes false,\
    \ the loop will run forever (or at least until the computer runs out of resources).\
    \ This situation is called an *infinite loop*.\n\nLet’s look at two simple examples\
    \ of while loops. The first example displays the phrase “Hello, World!” ten times.\
    \ Here is the code:\n\n```\n```cpp\nint number = 1;\n\nwhile (number <= 10)\n\
    {\n    cout << \"Hello, World!\" << endl;\n    ++number;\n}\n```\n```\n\nThis\
    \ example is trivial, but it points out the important components necessary for\
    \ a successful while loop. The variable number is called the loop-control variable.\
    \ The value of this variable controls the iterations of the loop. Generally, the\
    \ loop-control variable is assigned a value outside of the loop. Then the loop-control\
    \ variable is tested in the condition. Because we want to display “Hello, World!”\
    \ ten times, the value of number must be less than or equal to 10 for each iteration\
    \ of the loop. It is initialized to 1 so that the condition will be true and the\
    \ loop body entered.\n\nAfter the variable is initialized, the while loop condition\
    \ is tested. Since the value of number currently is 1, and 1 is less than or equal\
    \ to 10, the condition is true and the loop body is entered. The phrase “Hello,\
    \ World!” is displayed to the console and in the last line, the value of number\
    \ is incremented to 2.\n\nAt this point, the program moves back to the loop condition,\
    \ which is tested again. Since 2 is less than equal to 10, the condition is true\
    \ and"
