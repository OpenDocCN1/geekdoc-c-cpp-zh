  md: "When the user enters an A, B, C, or D, the compiler lets control fall through\
    \ the case clauses until an executable statement is encountered. That statement\
    \ is executed, and control falls out of the switch statement due to the break\
    \ statement. If the user enters a F, only the last case clause is true, so its\
    \ statement is executed and control falls out of the switch statement. If the\
    \ grade is anything other than A, B, C, D, or F, the default clause is executed.\n\
    \nHere's one more example that doesn't involve test grades. This program analyzes\
