  md: '| 5 | Data item |

    |---|---|

    | 6 | Data item |

    | 7 | Data item |

    | 8 | Data item |

    | 9 | Data item |


    One special quality of the vector is that a vector will automatically grow to
    accommodate new items added to the vector. This ability differentiates the vector
    from the array, which is similar to a vector but doesn''t have the ability to
    grow automatically.


    # ### Creating Vectors


    Vectors are declared in a special way. Here is the general form for a vector declaration:


    ```

    ```cpp

    vector<data type> vector-name(number of items, default-value);

    ```

    ```


    Before you can use vectors in your C++ programs, you have to provide a preprocessor
    directive importing the vector class into your program. Add this line to your
    other preprocessor directives:


    ```

    ```cpp

    #include <vector>

    ```

    ```


    A vector declaration begins with the keyword vector. Next comes the data type
    of the elements being stored in the vector. The data type is enclosed in the less-than
    sign and the greater-than sign, often called angle brackets for this use. You
    can optionally provide the number of items you initially want to store in the
    vector as an argument within parentheses. You can also optionally provide a default
    value for the vector elements Here are some examples of vector declarations:'
