    \ be worth: $\"\n         << principal << endl;\n    Console::ReadKey();\n   \
    \ return 0;\n}\n```\n```\n\nLet's look at an example that doesn't involve numbers.\
    \ If we want to encrypt a sentence using a simple encryption algorithm, we might\
    \ want to know how many vowels are in a sentence. To do this we have to"
