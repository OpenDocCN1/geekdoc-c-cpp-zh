  md: '# Getting Input With cin


    The most common way to getting data into our programs is by entering it from the
    keyboard. C++ considers the keyboard to be the standard input device and has an
    object defined for the keyboard - cin. The operator used to get data from cin
    is the ("get from") operator. The general form for getting input from the keyboard
    is:


    ```

    cin >> identifier;

    ```


    where identifier is usually a variable. Here is a simple example of how cin is
    used to get data from the keyboard:


    ```

    int number;

    cout << "Enter a number: ";

    cin >> number;

    ```


    In this example, after the prompt, the user enters an integer value from the keyboard
    and the value is stored in the variable number. The data type of the identifier
    determines what is stored by the >> operator. If the value entered is an integer,
    then the value is stored in the variable as entered. If the value entered is a
    floating-point value, however, then just the whole number is stored. So if the
    value 3.14159 is entered in the example above, the value 3 is stored in number.


    You can enter more than one value in a single cin statement by separating variables
    with the >> operator. The following code fragment demonstrates how this works:'
  merge: -1
