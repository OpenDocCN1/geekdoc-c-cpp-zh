- pgno: 30
  md: '```

    ```c

    var1 = 1;

    var2 = 0;

    // var1 gets the value 2 and var2 gets the value 1

    var2 = var1++;

    ```

    ```


    See what happened? When we put the ++ operator behind the variable and use it
    in an assignment statement, the assignment operation is performed first and then
    the increment operation is performed. This is a subtle effect of the ++ operator,
    but one that can cause a lot of extra debugging time if you don''t understand
    how the operator works.


    Decrementing the value of a variable is performed with the -- operator. This operator
    is used the same way as the ++ operator:


    ```

    ```c

    int var1, var2;

    var1 = 2;

    --var1; // var1 now has the value 1

    var1--; // var1 now has the value 0

    var1 = 2;

    // var1 and var2 get the value 1

    var2 = --var1;

    // var2 gets the value 1 and var1 gets the value 0

    var2 = var1--;

    ```

    ```


    The increment and decrement operators provide handy shortcuts when adjusting variable
    values by 1, but be careful how you use them in more complex assignment statements.'
