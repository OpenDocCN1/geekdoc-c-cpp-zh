    ```


    # **Adding Elements to a Vector**


    The most common way to add elements to a vector is with the class method push_back().
    This method places its argument in the next open position in the vector. The following
    example demonstrates how a new vector is created and is populated with two data
    items:


    ```

    ```cpp

    vector<string> names;

    names.push_back("Raymond");

    names.push_back("Jennifer");

    ```

    ```


    The vector looks like this:


    | | |

    |---|---|

    | 0 | Raymond |

    | 1 | Jennifer |


    Every new data item added with push_back() is placed directly after the previously
    added data item.'
