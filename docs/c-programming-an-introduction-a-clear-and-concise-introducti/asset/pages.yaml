    # Nested for Loops


    There are many programming problems where the data is structured in a table format.
    For example, if an instructor wants to compute the average grade for each student
    in his or her class, the data will be structured something like this:


    |  | Test 1 | Test 2 | Test 3 | Test 4 |

    |---|---:|---:|---:|---:|

    | Student 1 | 84 | 78 | 93 | 98 |

    | Student 2 | 78 | 82 | 84 | 89 |

    | Student 3 | 93 | 89 | 98 | 100 |


    The program will start with the first student, moving across the columns creating
    a sum from each grade, then dividing by the number of grades to display the average,
    and then moving to the next student. This program will need two for loops, an
    outer for loop to move from student to student, and an inner for loop to move
    across the columns of grades. Two for loops working in this manner are called
    nested for loops.


    We can''t use nested for loops to solve the problem above yet because we haven''t
    learned how to store data in arrays yet (we will get to arrays very soon). However,
    we can demonstrate how to use nested for loops for a simpler problem – displaying
    multiplication tables.


    First, let''s look at the layout for the multiplication table for 1 x 1 through
    5 x 5:'
