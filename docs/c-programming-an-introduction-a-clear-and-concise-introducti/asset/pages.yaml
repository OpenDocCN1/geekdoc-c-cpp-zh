  md: "# Chapter 7\n\n# Repetition\n\nDecision-making via if statements is the first\
    \ of the really powerful programming constructs needed to write useful programs.\
    \ The second programming construct we need is repetition. Humans are bad at doing\
    \ things over and over again; we get bored and tired and eventually start making\
    \ mistakes. Computers, however, never get tired or bored and can perform the same\
    \ tasks hours on end without every making even the slightest mistake. In this\
    \ section we'll study how to perform repetition in C++, also called looping, using\
    \ the while loop statement.\n\n# The while Loop\n\nOne means of performing repetition\
    \ in C++ is using the while loop. The while loop examines a condition, much like\
    \ an if statement does, executing a set of statements repeated while the condition\
    \ is true. The process of executing statements multiple times is called *iteration*.\n\
    \nThe general form of the while loop looks like this:\n\n```\nwhile (condition)\n\
    {\n    statement₁;\n    statement₂;\n    statementₙ;\n}\n```"
