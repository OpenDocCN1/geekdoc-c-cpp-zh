    # Reading Data From Files


    There are two major types of while loops in most C++ programs – counter-controlled
    loops and sentinel-controlled loops. The examples discussed above were both counter-controlled
    loops because the loop''s condition was based on reaching a certain count, either
    in iterations of the loop in the “Hello, World!” example, or on reaching a certain
    number in the compute the sum example.


    Sentinel-controlled loops, on the other hand, are controlled by a specific situation,
    such as reaching a particular value, or when a resource runs out, such as reaching
    the end of a file. This value is called a sentinel value and sentinel-controlled
    loops stop when this sentinel value is obtained.


    A classic example of a sentinel-controlled loop is a loop that reads the contents
    of a text file. Reading data files are usually controlled by sentinel values because
    we don''t know when we are going to reach the end of the file. A specific value
    can''t be entered, such as the number of lines to read, unless we know in advance
    how many lines are in the file, and this is rarely the case. We''ll discuss how
    to develop sentinel-controlled loops by reading the contents of a text file.'
