  md: '# # Logical Operators


    More complex comparisons require the programmer to sometimes combine two or more
    relational expressions. These types of comparisons are called logical expressions
    and are performed with the logical operators. The logical operators are:


    +   - && And

    +   - || Or

    +   - ! Not


    Here is one example of how the && logical operator is used with two relational
    expressions (assuming we have declared the variables workerType and hoursWorked):


    ```

    ((workerType == "hourly") && (hoursWorked > 40))

    ```


    Notice that both expressions must be surrounded by parentheses both individually
    and as a group.


    && logical expressions return true if all the relational expressions are true
    and they return false if either or both of the relational expressions is false.
    We can summarize this behavior with a truth table:


    | Rel Exp 1 | Rel Exp 2 | Result |

    |---|---|---|

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'Here is an example of an `||` logical expression:


    ```

    ```text

    ((hoursWorked < 41) || (workerType == "salary"))

    ```

    ```


    In an `||` logical expression, the expression is true if either of the relational
    expressions is true, and is false only if both relational expressions are false.
    Here is the truth table for `||` expressions:


    | Rel Exp 1 | Rel Exp 2 | Result |

    |---|---|---|

    | True | True | True |

    | True | False | True |

    | False | True | True |

    | False | False | False |


    The final logical operator is the `!` (not) operator. This operator is a unary
    operator and negates the value of a boolean expression. For example:


    ```

    ```text

    ! (2 == 2) // false

    ! (3 < 2) // true

    ```

    ```


    We will not use the `!` operator often in this text. In fact, we''ll only use
    it when working with text files, as you''ll see later in the book.'
