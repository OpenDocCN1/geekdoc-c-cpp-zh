- pgno: 11
  md: '# Introduction to C++ Programming


    C++ is one of the most popular programming languages in use in industry today.
    According to the TIOBE Programming Community Index, which can be accessed at this
    url:


    http://www.tiobe.com/index.php/content/paperinfo/tpci/index.html


    at the time of writing C++ is the third most popular programming language, after
    Java and C++''s little brother, C. C++ is a general-purpose, multi-paradigm programming
    language, which just means that you can do many different types of programming
    in C++. You can write procedural programs, object-oriented programs, and generic
    programs in C++, and you can conceivably use all three paradigms in one program.


    C++ is also considered to be a relatively hard computer programming language to
    use. The language has a wide range of features and many programmers only use a
    small portion of those features on a regular basis. Trying to learn the whole
    language at once is nearly impossible.


    The goal of this book is to introduce you to just a small subset of the huge number
    of features found in C++, but include the main constructs and features you need
    to start writing useful C++ programs right away. You will learn how to write simple
    procedural programs to solve arithmetic problems; you will learn some techniques
    for manipulating textual data (strings); you will learn how to use decision constructs
    (branching) in your programs in order to selectively execute code; you will learn
    how to use repetition (loops) in your programs to repeatedly execute code over
    and over again; you will learn how to compose functions that enables you to modularize
    your programs; you will learn how to build data structures such as vectors and
    arrays so that you can store related data values in memory; you will learn how
    to process text files in order to work with real world data; and finally you will
    learn how to write object-oriented programs so that you can extend'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'the C++ language with your own data types and also learn how to write programs
    that use objects to more accurately model the problems you are trying to solve.


    One of the major features that separates this book from all the other books on
    C++ programming is the fact that we do not try to overwhelm you with facts and
    features. Each new programming construct and concept is presented clearly and
    concisely, showing you only those features you need to know to get you started
    programming in C++. When you finish this book you will not be an expert in the
    minutiae of C++, but you will be able to write useful programs in C++ and have
    a great foundation for learning those advanced features that are most important
    to you.


    Finally, the only way you can learn how to program in C++ is to actually write
    C++ programs. To do that you need a C++ compiler. We choose to use the Microsoft
    Visual C++ Express compiler for the examples in this book. This compiler can be
    downloaded for free from Microsoft and contains everything you will need for this
    book and, for that matter, for more advanced C++ programming.


    If you choose to use another C++ compiler, the only code you might have to change
    will be in the #include statements at the beginning of your programs. If you have
    trouble making these changes, please contact the author for help.


    You will get the best use of this book if you run all the programs, make changes
    to them, run them again, and don''t be afraid to experiment. Once you''ve finished
    a chapter, don''t move on to the next chapter until you''ve worked as many of
    the exercises as you have time to work. You can only learn to program by programming.'
  merge: -1
  img_proc: true
