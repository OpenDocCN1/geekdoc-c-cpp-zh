    | 9 | Data item |


    The first element of an array is stored in position 0. The position is called
    the index. An index is referenced in C++ code using subscript notation, just as
    we used with vectors. If the array above is named numbers, then to access the
    first element we would write:


    ```

    numbers[0]

    ```


    Because arrays always start at position 0, the number of items in an array is
    always one larger than the last position of the array, also called the *upper-bound*.


    # Declaring One-Dimensional Arrays


    Arrays must be declared just like variables are declared. The general form of
    an array declaration is:


    ```

    data-type array-name[ number of elements];

    ```


    After an array declaration is made, the compiler reserves a contiguous block of
    memory for the array elements, thus the number of elements specified in the declaration
    must be greater than 0. Here is an example:


    ```

    string names[10];

    ```


    This declaration tells the compiler to reserve space in contiguous'
