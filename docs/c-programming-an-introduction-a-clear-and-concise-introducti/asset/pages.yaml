  md: "```\n```cpp\nint main(array<System::String ^> ^args)\n{\n    for(int i = 1;\
    \ i <= 10; ++i)\n    {\n        cout << i << \" \";\n    }\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n```\n\nThe output from this program is:\n\n```\n12345678910\n\
    ```\n\nThe first thing that happens is the loop control variable, i, is declared\
    \ and initialized to 1. Next, the condition is tested. The condition for this\
    \ loop says to iterate through the loop while the value of i is less than or equal\
    \ to 10. Since i was just initialized to 1, the condition is true and the loop\
    \ body is entered.\n\nAs with a while loop, the loop body of a for loop is a block.\
    \ The body for this particular loop just has one statement, so the value of i\
    \ is written to the console. Since this is the first and last statement in the\
    \ loop body, the loop control modification step occurs next, with the value of\
    \ i being incremented by 1.\n\nNow the value of i is 2 and the condition is tested\
    \ again. The condition is true so the value of i, 2, is written to the console\
    \ and i is incremented by 1 again. The for loop continues in this fashion until\
    \ the value of i is incremented to 11. Then the condition is tested, the result\
    \ is false, since 11 is not less than or equal to 10, and the loop body is exited."
