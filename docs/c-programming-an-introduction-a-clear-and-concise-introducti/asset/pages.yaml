    One of the reasons we use object-oriented programming in C++ is because we want
    to create our own data types. In the previous chapter we discussed how to build
    a List data type by creating a class that exhibited the attributes and behaviors
    of a class. Another reason to use object-oriented programming is to be able to
    build hierarchies of data types that build off of each other. This is called *inheritance*.


    Another way we can use object-oriented programming is to create classes that contain
    other classes. This is called *composition*. For example, a College class can
    consist of Faculty classes, Student classes, and Staff classes. This chapter discusses
    how to build more useful classes using inheritance and composition.


    # Inheritance


    A class can inherits the members and methods of another class. A class that inherits
    members and methods is called a derived class. A class that is inherited from
    is called a base class.


    Inheritance is used to describe *is-a* relationships between objects. In other
    words, a bear is a mammal; a trout is a fish; a novel is a book. These relationships
    tend to be described in a hierarchical manner. A concrete example will help explain
    how inheritance works in the abstract.'
