    # ## Composition


    Inheritance is the reuse of the code from a base class in a derived class. *Composition*
    is the use of other classes in the definition of a class. Composition is used
    to describe *has-a* relationships. A line has a point (well, two points to be
    exact); a circle has a radius; a car has an engine. These are all examples of
    an object that is composed of other objects.


    Many programming problems that seem to lend themselves to a inheritance solution
    are actually better solved by using composition. Inheritance, especially when
    involving long chains of derived class, is notoriously hard to get correct.'
