    ```\n\n以改变该表达式的值。\n\n现在让我们看一个在完整 C++ 程序中使用算术表达式的示例。在这个示例中，我们将把 5 个测试成绩赋给 5 个变量，并计算平均成绩。程序如下：\n\
    \n```cpp\n// Chapter3.cpp : main project file.\n\n#include \"stdafx.h\"\nusing\
