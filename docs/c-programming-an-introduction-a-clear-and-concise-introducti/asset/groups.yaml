    \n```cpp\nint grade1, grade2, grade3, grade4, grade5,\n    sumOfGrades, numOfGrades;\n\
    ```\n\n初始化本程序所需的整型变量：5 个用于成绩的变量、一个用于存储成绩总和的变量，以及一个用于存储成绩数量的变量，计算平均分时需要用到它。\n\n\
    下一行：\n\n```cpp\ndouble average = 0.0;\n```\n\n声明并初始化我们用来存储平均分的变量。平均分很可能是浮点值，因此我们需要使用浮点数据类型。\n\
    \n以下几行给成绩变量和存储成绩数量的变量赋值：\n\n```cpp\ngrade1 = 84;\ngrade2 = 89;\ngrade3 = 77;\n\
