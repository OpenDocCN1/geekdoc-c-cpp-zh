  mdcn: "\n```cpp\nvoid addFive(int &num)\n{\n    num += 5;\n}\n```\n\n有些程序员建议将与符号放在数据类型旁边，而不是参数旁边，但编译器两种风格都能接受。\n\
    \n只有当没有其他方法可以完成特定任务时，才应该按引用传递参数。例如，上面的 addFive() 函数完全可以用一个值参数来编写，向调用程序返回参数加 5\
    \ 的结果，这样，作为参数传入的变量就可以被赋值为函数的返回值。或者用更清晰的代码来表示：\n\n```cpp\nint addFive(int num)\n\
    {\n    return num += 5;\n}\n\n// in calling program\nint number = 0;\nnumber =\
    \ addFive(number);\n```\n\n然而，有些情况下只有按引用传递参数才行，swap() 函数就是其中之一。我们必须使用引用参数来编写该函数的主要原因在于，一个返回值的函数只能返回一个值，而\
    \ swap() 函数要处理的是两个值。\n\n话不多说，让我们重写 swap 函数，使其能正确工作：\n\n```cpp\nvoid swap(string\
    \ &word1, string &word2)\n{\n    string temp = word1;\n    word1 = word2;\n  \
    \  word2 = temp;\n}\n```\n\n现在 word1 和 word2 是按引用传递的，因此当函数改变这些变量的值时，它实际上是在调用程序中以及函数内真正地改变它们。下面是完整的程序：\n\
    \n```cpp\n// Swap.cpp : main project file.\n\n#include \"stdafx.h\"\n\nusing namespace\
    \ System;\n\n#include <iostream>\n#include <string>\nusing namespace std;\n\n\
    void swap(string &word1, string &word2)\n{\n    string temp = word1;\n    word1\
    \ = word2;\n    word2 = temp;\n}\n\nint main(array<System::String ^> ^args)\n\
    {\n    string word1, word2;\n    word1 = \"banana\";\n    word2 = \"apple\";\n\
    \    cout << word1 << \" \" << word2 << endl;\n    swap(word1, word2);\n    cout\
    \ << word1 << \" \" << word2 << endl;\n    Console::ReadKey();\n    return 0;\n\
    }\n```\n\n输出如下：\n\n```\nbanana apple\napple banana\n```\n\n存储在各个内存地址中的值现在已经被交换，因此\
    \ word1 存储的是 \"apple\" 而 word2 存储的是 \"banana\"。\n\n## 变量作用域\n\n变量的作用域指的是变量的可访问性。变量在何处以及如何可访问，取决于变量在何处声明。最好通过示例来解释变量作用域的工作方式。请看下面这个简单的程序片段：\n\
    \n```cpp\nint main()\n{\n    int number1;\n    number1 = 23;\n    int number2\
    \ = number1 * 13;\n    return 0;\n}\n```\n\n变量 number1 的作用域是 main() 函数。main()\
    \ 函数块内的任何代码都可以访问 number1 的值。接下来再看一个更长的代码片段：\n\n```cpp\nint changeNumber(int number)\n\
    {\n    return number *= 3;\n}\n\nint main()\n{\n    int number = 3;\n    cout\
    \ << changeNumber(number);\n    cout << number;\n    return 0;\n}\n```\n\n参数 number\
    \ 被称为 changeNumber() 函数的局部变量。这意味着该变量只能被函数定义内的代码访问，并且一旦函数停止执行，它的值就会从内存中完全移除。\n\n\
    为了演示这一点，让我们重写上面的程序来展示局部作用域是如何工作的。完整程序如下：\n\n```cpp\n// ScopeExample.cpp : main\
    \ project file.\n\n#include \"stdafx.h\"\n\nusing namespace System;\n#include\
    \ <iostream>\nusing namespace std;\n\nint changeNumber(int number)\n{\n    number\
    \ *= 3;\n    cout << \"The value of number in the changeNumber()\"\n         <<\
    \ \" function is: \" << number << endl;\n```\n\n## 作用域级别\n\n上面的示例说明了 C++ 程序中可用的作用域级别之一。这些作用域级别包括：\n\
    \n- *全局*\n- *局部*\n- *块*\n\n在函数（无论是 main 函数还是用户自定义函数）内声明的变量具有局部作用域。该变量及其值可被定义该函数的块内的任何代码访问。其他函数中的代码无法访问该变量。\n\
    \n## 全局作用域\n\n如果变量定义在 C++ 程序的全局区域中，则该变量具有全局作用域。这个区域是定义函数的区域，包括 main() 函数上方和下方的区域。在此区域中定义的变量称为*全局变量*，可以被程序中的任何代码访问。\n\
    \n让我们看一个关于全局变量如何工作的简单示例：\n\n```cpp\n// GlobalScope.cpp : main project file.\n\n\
    #include \"stdafx.h\"\nusing namespace System;\n\n#include <iostream>\nusing namespace\
    \ std;\n\nint number = 1; // global variable\n\nint changeNumber()\n{\n    number\
    \ += 5;\n    return number;\n}\n\nint main(array<System::String ^> ^args)\n{\n\
    \    cout << \"The value of number is: \" << number\n         << endl;\n    number\
    \ = changeNumber();\n    cout << \"Now the value of number is: \"\n         <<\
    \ number << endl;\n    Console::ReadKey();\n    return 0;\n}\n```\n\n变量 number\
    \ 是一个全局变量。即使该变量没有作为参数传递给 changeNumber() 函数，该函数也可以访问 number 的值。同样，尽管 number 没有在\
    \ main() 函数中声明，main() 函数也可以访问 number 的值。\n\n如上所述，全局变量可以被程序中定义的任何代码访问。因此你可能会认为，应该将所有变量都声明为全局变量，以便于使用。然而，这是错误的想法。在程序中使用全局变量会带来很多问题。这些问题包括：\n\
