    \ C++ 从文件中读取数据。\n\n### 使用文件和流\n\n对 C++ 来说，文件是一个字符（字节）序列，文件末尾由一个特殊的文件结束标记来标识。与控制台输入和输出类似，C++\
    \ 将文件与一个流关联起来，该流用于与文件通信。想要读写文件的源文件必须包含头文件 fstream。\n\n通常，在 C++ 中可以处理两种类型的文件：**二进制**文件和**文本**文件。二进制文件也称为*随机存取文件*，在存储空间上比文本文件更高效，但编程难度稍大。文本文件也称为*顺序访问文件*，或简称*顺序文件*，效率较低，但更易于编程，并且可以用标准文本编辑器编辑。本章我们将只处理文本文件。\n\
    \n### 创建文本文件\n\n大多数读者已经知道文本文件是什么样子。你可能已经用记事本或其他文本编辑器创建过文本文件。我们不是从键盘输入文件文本，而是要编写一个\
