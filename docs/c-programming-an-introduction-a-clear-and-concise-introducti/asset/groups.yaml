  md: "\n```cpp\nnumber3 = number1 + number2;\ncout << \"The sum is \" << number3\
    \ << endl;\nConsole::ReadKey();\nreturn 0;\n}\n```\n\nThis program causes a similar\
    \ error message to be displayed:\n\n```text\n1>------ Build started: Project:\
    \ ErrorHandling, Configuration: Debug Win32 ------\n1>  ErrorHandling.cpp\n1>ErrorHandling.cpp(14):\
    \ error C2065: 'number3': undeclared identifier\n1>ErrorHandling.cpp(15): error\
    \ C2065: 'number3': undeclared identifier\n========== Build: 0 succeeded, 1 failed,\
    \ 0 up-to-date, 0 skipped ==========\n```\n\nThis time, though, the error message\
    \ is not the result of leaving out a library but because the program forgot to\
    \ declare the variable number3. Notice that the error message lists both times\
    \ the variable was used as errors and not just the first occurrence.\n\nThere\
    \ are more possible syntax errors you can make, of course, but the errors we've\
    \ just discussed are three of the more common errors you are likely to make. By\
    \ discussing what the error messages look like, and how to read them, you should\
    \ now at least be somewhat less intimidated by the new error messages you will\
    \ encounter in the future.\n\n## Logic Errors\n\nOnce your program compiles and\
    \ runs, any errors that occur will have to be what are called *logic errors*,\
    \ or errors in the logic of the program. Logic errors are much harder to find\
    \ than syntax errors because a computer program only does what the programmer\
    \ tells it to do, and nothing more. A program can't decipher what the programmer\
    \ meant to do with the code he or she writes; it can only execute the statements\
    \ as it comes across them.\n\nLogic errors come in all shapes and sizes, so we\
    \ can only just give you a couple of examples to demonstrate how logic errors\
    \ differ from syntax errors. The following program displays the last element of\
    \ an array of numbers:\n\n```cpp\n// ErrorHandling.cpp : main project file.\n\n\
    #include \"stdafx.h\"\nusing namespace System;\n\n#include <iostream>\nusing namespace\
    \ std;\n\nint main(array<System::String ^> ^args)\n{\n    const int size = 10;\n\
    \    int numbers[size];\n    for(int i = 0; i < size; ++i)\n        numbers[i]\
    \ = i + 1;\n    cout << \"The last item in the array is: \"\n         << numbers[size]\
    \ << endl;\n    Console::ReadKey();\n    return 0;\n}\n```\n\nCan you spot the\
    \ error? If not, what do you think the output should be? Now, run the program\
    \ to see what the output actually is:\n\nThe last item in the array is -1231954775\n\
    \nBut you thought the last item should be 10.\n\nIf you look carefully at the\
    \ code, you'll see that the constant size was used in the cout statement and the\
    \ value of size is 10. However, the upper bound of the array is 9, so the subscript\
    \ that should have been used to display the last array element is size - 1.\n\n\
    This is an example of a logic error. The program runs correctly but doesn't give\
    \ the expected output. Usually, the only way to find a logic error is to review\
    \ your code and look carefully for where you might have gone wrong with your programming.\n\
    \nHere's another example: You have to write a program to find the maximum value\
    \ in a set of numbers stored in a file. In the line where the variable to store\
    \ the maximum value is declared, you initialize its value to 0. You run the program\
    \ and it reports that the maximum value is 0. Huh? After scratching your head\
    \ for awhile, you go look at the data file and see that all the numbers in the\
    \ file are negative numbers. Clearly, no value ever passed the test (currentValue\
    \ > max), when max is equal to 0, so 0 is the maximum value according to the logic\
    \ of your program.\n\nFinding errors of this type can be as much of an art as\
