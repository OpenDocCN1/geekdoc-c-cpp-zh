    );\n```\n\n注意，路径字符串中每个目录名前面都有两个反斜杠。如果不这样做，C++ 会尝试将单个反斜杠解释为特殊字符，例如表示制表符的“\\t”。使用两个反斜杠可确保编译器不会将文件路径字符串的某些部分解释为特殊字符。\n\
