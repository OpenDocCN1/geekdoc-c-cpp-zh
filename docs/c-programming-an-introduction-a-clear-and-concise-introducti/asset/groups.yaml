    # ## Composite Assignment Operators


    There will also be plenty of situations when you need to adjust the value of a
    variable by more than 1, such as when counting by 5:


    ```

    ```cpp

    count = count + 5;

    ```

    ```


    To make it easier to write these types of statement, C++ provides a set of composite
    assignment operators. These operators are: +=, -=, *=, /=, and %=. They work like
    this:


    ```

    ```cpp

    int var1 = 0;

    var1 += 5;  // var1 has the value 5

    var1 *= 2;  // var1 now has the value 10;

    var1 /= 2;  // var1 has the value 5

    var1 %= 5;

    // var1 now has the value 0 since 5 / 5 leaves

    // remainder of 0

    ```

    ```


    Using these operators instead of more complete statements provides the programmer
    with a convenient shortcut and should be used when possible to make your programs
