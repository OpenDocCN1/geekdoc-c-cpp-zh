  mdcn: "\n\n## 复合赋值运算符\n\n也会有很多情况需要将变量的值调整超过 1，例如以 5 为单位计数：\n\n```cpp\ncount = count\
    \ + 5;\n```\n\n为了更轻松地编写这类语句，C++ 提供了一组复合赋值运算符。这些运算符是：+=、-=、*=、/= 和 %=。它们的工作方式如下：\n\
