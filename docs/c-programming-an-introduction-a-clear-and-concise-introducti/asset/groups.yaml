    cout << \"Enter a number: \";\ncin >> number;\n```\n\n在此示例中，提示信息显示后，用户从键盘输入一个整数值，该值被存储在变量\
    \ number 中。标识符的数据类型决定了 >> 运算符存储的内容。如果输入的值是整数，则该值将按输入时的形式存储在变量中。但是，如果输入的值是浮点值，则只存储其整数部分。因此，如果在上述示例中输入值\
    \ 3.14159，则数字 3 会被存储在 number 中。\n\n你可以在一条 cin 语句中通过 >> 运算符分隔变量，从而输入多个值。以下代码片段演示了其工作原理：\n\
    \n```cpp\nint number1, number2, sum;\ncout << \"Enter two numbers: \";\ncin >>\
