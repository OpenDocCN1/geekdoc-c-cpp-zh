    # Getting Input With cin


    The most common way to getting data into our programs is by entering it from the
    keyboard. C++ considers the keyboard to be the standard input device and has an
    object defined for the keyboard - cin. The operator used to get data from cin
    is the ("get from") operator. The general form for getting input from the keyboard
    is:


    ```

    cin >> identifier;

    ```


    where identifier is usually a variable. Here is a simple example of how cin is
    used to get data from the keyboard:


    ```

    int number;

    cout << "Enter a number: ";

    cin >> number;

    ```


    In this example, after the prompt, the user enters an integer value from the keyboard
    and the value is stored in the variable number. The data type of the identifier
    determines what is stored by the >> operator. If the value entered is an integer,
    then the value is stored in the variable as entered. If the value entered is a
    floating-point value, however, then just the whole number is stored. So if the
    value 3.14159 is entered in the example above, the value 3 is stored in number.


    You can enter more than one value in a single cin statement by separating variables
    with the >> operator. The following code fragment demonstrates how this works:'
  - '[PAGE 43]


    ```

    ```cpp

    int number1, number2, sum;

    cout << "Enter two numbers: ";

    cin >> number1 >> number2;

    sum = number1 + number2;

    cout << sum << endl;

    ```

    ```


    The program runs like this:


    ```

    Enter two numbers: 2 3

    5

    ```


    The first number entered is stored in number1 and the second number entered is
    stored in number2. Obviously, you must put a space between the two input values.


    String values can be entered the same way. Here is an example:


    If the user enters "Mary", the program outputs:


    ```

    Hello, Mary

    ```


    But if the user enters "Mary Smith", the program outputs:


    ```

    Hello, Mary

    ```


    What happened? Remember, the space between the two input values separates the
    input into distinct values. Since there wasn''t a variable to hold “Smith”, the
    program just ignored it. To read a whole line into a variable, you need to use
    the getline() function. Here is an example of how the function works:'
  - '[PAGE 44]


    ```

    ```cpp

    string name;

    cout << "Enter your name: ";

    getline(cin, name);

    cout << "Hello, " << name;

    ```

    ```


    Now when the user enters “Mary Smith”, the program outputs:


    Hello, Mary Smith


    You can enter as long of a string as you want and the variable will expand to
    hold the string automatically.


    # More on Output With cout


    We''ve seen several examples of how to use cout to display data on the console.
    Most of the examples we''ve seen have been of the form: cout << expression, but
    there are many more ways we can use cout to display data. We can combine data
    types like this:


    ```

    ```cpp

    cout << "Pi has the value ";

    cout << 3.14159;

    ```

    ```


    These are output on the same line – Pi has the value 3.14159 – because we didn’t
    specify a newline. There is no reason, though, to use cout twice here when we
    could have combined the two statements into one (here we also use a variable for
    the value 3.14159) by stringing << operators together:'
