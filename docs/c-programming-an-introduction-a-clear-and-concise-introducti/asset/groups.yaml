    \ For example, equal(\"hello\", \"hello\") returns true but equal(\"hello\", \"\
    Hello\") returns false.\n\n## Chapter 15: Inheritance and Composition\n\nOne of\
    \ the reasons we use object-oriented programming in C++ is because we want to\
