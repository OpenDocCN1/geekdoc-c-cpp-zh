    myFile.open("example.txt");

    ```


    When the file is open, we''re ready to read its contents. This requires a while
    loop that will run until there is no more data in the file. This is an example
    of a sentinel-controlled loop and the sentinel we use for reading data is a true/false
    value given by the fstream function eof(). This function returns false while there
    is more data in the file to read and returns true when there is no more data.
    Here is the code:


    ```

    while (!myFile.eof())

    {


    ```


    Note that we use the ! (not) operator here because the eof() function returns
    false when there is data to read so we have to negate that false value in order
    for the loop to continue running.


    The first line in the body of the loop reads a line of text and stores it in a
    variable:


    ```

    getline(myFile, line);

    ```


    The next and last line displays the text read from the file:


    ```

    cout << line << endl;

    }

