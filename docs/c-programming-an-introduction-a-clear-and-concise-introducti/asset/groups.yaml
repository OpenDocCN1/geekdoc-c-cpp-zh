    \ 对象发送数据一样，将数据发送到文件对象。下面是一个示例：\n\n```cpp\noutFile << 85;\n```\n\n字符 8 和 5 会写入文件的前两个位置，因为它们是首先写入文件的字符。如果我们再写一条类似的语句：\n\
