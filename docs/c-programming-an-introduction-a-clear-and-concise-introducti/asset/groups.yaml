    \ 文件。\n\n除了这些之外，函数还有其他优点，但当你开始学习 C++ 编程时，这些应该是对你最有意义的。\n\n## void 函数\n\n一个 *void\
    \ 函数* 是不返回值的函数。这种类型的函数有时被称为 *子例程* 或 *子过程*。void 函数与有返回值函数相似，因为它们定义在有返回值函数所定义的相同空间中，它们可以有参数，并且有函数体。void\
    \ 函数只是不返回值。因此你可能会问——如果它们不返回值，那它们有什么用？\n\n这里有一个例子。你正在编写一个程序，它需要在报告的每一页开头打印一个标题，比如只打印准备报告的人的姓名和日期。代码行可能如下所示：\n\
    \n```\ncout << \"\\t\" << \"Mary Smith\" << endl;\n\ncout << \"\\t\" << date <<\
    \ endl;\n```\n\n因为这个代码片段必须在多个地方使用，所以它应该放在一个函数中。然而，它不返回任何数据，只是向控制台写出两行内容，因此它必须放在一个\
    \ void 函数中。\n\nvoid 函数的定义方式与有返回值函数类似。以下是上述示例的定义：\n\n```cpp\nvoid printHeading(string\
