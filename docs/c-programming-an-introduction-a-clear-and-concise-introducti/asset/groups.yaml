    \nNow we can start thinking about derived classes from the base class Vehicle.\
    \ The automobile is derived from the Vehicle class, as is the truck, the bus,\
    \ and the train, just to mention a few. Each of these has features in common with\
    \ all vehicles, but each also have features distinctly their own.\n\nInheritance\
    \ works by first defining the attributes and behaviors that define all instances\
    \ of the base class, and then deriving classes from the base class that differ\
