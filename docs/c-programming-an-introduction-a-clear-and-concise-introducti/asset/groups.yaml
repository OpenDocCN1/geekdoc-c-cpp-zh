    \ = grade1 + grade2 + grade3 + grade4\n             + grade5;\n```\n\n将所有成绩变量相加，并把总和存入\
    \ sumOfGrades 变量。\n\n接下来，我们通过用成绩总和除以成绩数量来计算平均分：\n\n```cpp\naverage = sumOfGrades\
    \ / numOfGrades;\n```\n\n最后，我们通过显示所得平均分来结束程序：\n\n```cpp\ncout << \"The average\
    \ is: \" << average << endl;\n```\n\n不过，严格来说，程序真正的结束是这一行：\n\n```cpp\nreturn 0;\n\
    ```\n\n### 更多关于 C++ 运算符和变量的内容\n\n在 C++ 编程中，给变量赋值这一操作非常频繁，因此有一组运算符专门用于执行该操作。我们将要考察的第一组运算符用于将变量的值递增或递减\
    \ 1。\n\n### 递增与递减\n\n在所有编程中，最常见的语句之一大致如下：\n\n```cpp\ncount = count + 1;\n```\n\
    \n有无数种情形需要将变量的值增加 1。为便于执行此操作，C++ 提供了一个专门将变量增加 1 的运算符，即 ++ 运算符。\n\n++ 运算符的用法如下：\n\
    \n```cpp\nint count = 0;\n++count; // the value of count goes from 0 to 1\n```\n\
    \n你也可以将运算符放在变量之后，如下所示：\n\n```cpp\ncount++;\n```\n\n一个合乎逻辑的问题是：把 ++ 运算符放在变量之前或之后有什么区别？当变量在语句中单独存在时，没有区别。然而，如果变量用于更复杂的语句中，就可能产生很大差别。下面是一个演示这种差别的示例：\n\
    \n```cpp\nint var1, var2;\nvar1 = 1;\n// var1 gets the value 2 and var2 gets the\
    \ value 2\nvar2 = ++var1;\n```\n\n```cpp\nvar1 = 1;\nvar2 = 0;\n// var1 gets the\
    \ value 2 and var2 gets the value 1\nvar2 = var1++;\n```\n\n看到发生了什么吗？当我们将 ++ 运算符放在变量之后，并在赋值语句中使用它时，会先执行赋值操作，然后执行递增操作。这是\
    \ ++ 运算符的一个微妙影响，但如果你不理解该运算符的工作方式，它可能会耗费大量额外的调试时间。\n\n递减变量的值使用 -- 运算符。该运算符的用法与\
    \ ++ 运算符相同：\n\n```cpp\nint var1, var2;\nvar1 = 2;\n--var1; // var1 now has the\
    \ value 1\nvar1--; // var1 now has the value 0\nvar1 = 2;\n// var1 and var2 get\
    \ the value 1\nvar2 = --var1;\n// var2 gets the value 1 and var1 gets the value\
    \ 0\nvar2 = var1--;\n```\n\n递增和递减运算符在将变量值调整 1 时提供了便捷的快捷方式，但在更复杂的赋值语句中使用它们时要小心。\n"
