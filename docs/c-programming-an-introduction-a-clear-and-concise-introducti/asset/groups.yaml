    \n```cpp\n// EmployeeClass.cpp : main project file.\n\n#include \"stdafx.h\"\n\
    using namespace System;\n\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\n\nclass Employee\n{\nprivate:\n        string empName;\n        double\
    \ pay;\n\npublic:\n        Employee(string name, double payRate)\n        {\n\
    \                empName = name;\n                pay = payRate;\n        }\n\n\
    \        string getName()\n        {\n            return empName;\n        }\n\
    \n        double getPay()\n        {\n            return pay;\n        }\n\n \
    \       double grossPay(int hours)\n        {\n            return pay * hours;\n\
    \        }\n};\n\nint main(array<System::String ^> ^args)\n{\n    Employee emp1(\"\
    Mary Smith\", 15.0);\n    cout << \"Employee name: \" << emp1.getName() << endl;\n\
    \    cout << \"Pay rate: \" << emp1.getPay() << endl;\n    cout << \"Gross pay:\
    \ \" << emp1.grossPay(40) << endl;\n    Console::ReadKey();\n    return 0;\n}\n\
    ```\n\nThe output from this program is:\n\n```\nEmployee name: Mary Smith\nPay\
    \ rate: 15\nGross pay: 600\n```\n\nNow we're ready to derive the Manager class\
    \ from the Employee class. When we derive a class from a base class, we want to\
    \ implement just the different members and methods that occur in the derived class\
    \ and reuse the members and methods of the base class that are shared with the\
    \ derived class. This means that we want to continue to use the data members from\
    \ the Employee class in the Manager class and add any attribute that is different,\
    \ such as the fact that managers are usually salaried employees rather than hourly\
    \ employees. We can add this fact to the Manager class by including a boolean\
    \ variable, isSalaried, and then adjusting the grossPay() method to return either\
    \ the pay rate if the object is a manager or the pay rate multiplied by the hours\
    \ worked if the object is a regular employee.\n\nWe're almost ready to implement\
    \ the Manager class, but there is one major problem. The data members of the Employee\
    \ class are private members, meaning that their values are only accessible within\
    \ the class definition. There is an access modifier we can use for base classes\
    \ so that the members and methods of the class are accessible to a derived class:\
    \ protected. This access modifier allows derived classes to access members and\
    \ methods of a base class but does not allow access by any other code, such as\
    \ a test program.\n\nOnce we've made the members and methods of the base class,\
    \ we have to tell the compiler that the derived class is inheriting members and\
    \ methods from a base class. To do this, include a reference to the base class\
    \ by writing a colon followed by the keyword public and the base class name on\
    \ the same line as the first line of the derived class definition, like this:\n\
    \n```cpp\nclass Manager : public Employee\n```\n\nNow we're ready to redefine\
    \ the Employee class and define the Manager class. Here is the complete program:\n\
    \n```cpp\n// EmployeeClass.cpp : main project file.\n\n#include \"stdafx.h\"\n\
    using namespace System;\n\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\n\nclass Employee\n{\nprotected:\n    string empName;\n    double pay;\n\
    \npublic:\n    Employee(string name, double payRate)\n    {\n        empName =\
    \ name;\n        pay = payRate;\n    }\n\n    string getName()\n    {\n      \
    \  return empName;\n    }\n\n    double getPay()\n    {\n        return pay;\n\
    \    }\n\n    double grossPay(int hours)\n    {\n        return pay * hours;\n\
    \    }\n};\n\nclass Manager : public Employee\n{\nprotected:\n    bool salaried;\n\
    \npublic:\n    Manager(string name, double payRate,\n            bool isSalaried)\n\
    \        : Employee(name, payRate)\n    {\n        salaried = isSalaried;\n  \
    \  }\n\n    bool getSalaried()\n    {\n        return salaried;\n    }\n\n   \
    \ double grossPay(double hours)\n    {\n        if (salaried)\n            return\
    \ pay;\n        else\n            return Employee::grossPay(hours);\n    }\n};\n\
    \nint main(array<System::String ^> ^args)\n{\n    Employee emp1(\"Mary Smith\"\
    , 15.0);\n    cout << \"Employee name: \" << emp1.getName()\n         << endl;\n\
    \    cout << \"Pay rate: \" << emp1.getPay() << endl;\n    cout << \"Gross pay:\
    \ \" << emp1.grossPay(40)\n         << endl;\n    Manager emp2(\"Liz Warren\"\
    , 1500, true);\n    cout << \"Employee name: \" << emp2.getName()\n         <<\
    \ endl;\n    cout << \"Pay rate: \" << emp2.getPay() << endl;\n    cout << \"\
    Gross pay: \" << emp2.grossPay(40)\n         << endl;\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\nThe first change we made was changing the access modifier\
    \ of the Employee class data members from private to protected. Here is that section\
    \ of code:\n\n```cpp\nclass Employee\n{\nprotected:\n    string empName;\n   \
    \ double pay;\n```\n\nThis change had to be made in order for the data members\
    \ of the Employee class to be accessible by the Manager class. Because of this\
    \ we don't have to re-declare the data members from the Employee class in the\
    \ Manager class.\n\nThe constructor for the Manager class also takes advantage\
    \ of inheritance by using the member assignments from the Employee class definition\
    \ for the employee name and the employee pay. Let's focus just on the constructor\
    \ to see how it works:\n\n```cpp\nManager(string name, double payRate,\n     \
    \   bool isSalaried)\n    : Employee(name, payRate)\n{\n    salaried = isSalaried;\n\
    }\n```\n\nThe parameter list for the constructor includes parameters for all the\
    \ data members. After the list, though, there is a colon followed by a call to\
    \ the base class constructor for the Employee class. Think of this like a function\
    \ call. At this point in the code, the compiler transfers control to the code\
    \ defined for the Employee class constructor. This is a classic example of code\
    \ reuse and one of the most important features of inheritance. There is no reason\
    \ to include the statements:\n\n```\nempName = name;\npay = payRate;\n```\n\n\
    since we've already written them in the base class.\n\nThe rest of the constructor\
    \ body assigns the last parameter to the new data member of the Manager class,\
    \ the boolean data member salaried.\n\nThe other piece of code that requires explanation\
    \ is the grossPay() method. Here is the definition again:\n\n```cpp\ndouble grossPay(double\
    \ hours)\n{\n    if (salaried)\n        return pay;\n    else\n        return\
    \ Employee::grossPay(hours);\n}\n```\n\nThis method first checks to see if the\
    \ employee is being paid a salary by testing the salaried variable. If so, the\
    \ method just returns the value in pay. If the employee is not salaried, the method\
    \ computes the gross pay. Since we already performed this computation in the Employee\
    \ class, there is no reason to repeat it in the Manager class. Instead, we just\
    \ use that method directly from the Employee class by calling it like this:\n\n\
    `Employee::grossPay(hours)`\n\nIf we had just written:\n\n`grossPay(hours)`\n\n\
    the compiler would get confused and call the same method again, leading to a never-ending\
    \ recursive call that would eventually crash the program. This example demonstrates\
    \ how using inheritance in C++ can help reduce the amount of code you have to\
    \ write, leading to code that is easier to use and easier to debug.\n\n### Composition\n\
    \nInheritance is the reuse of the code from a base class in a derived class. *Composition*\
    \ is the use of other classes in the definition of a class. Composition is used\
    \ to describe *has-a* relationships. A line has a point (well, two points to be\
    \ exact); a circle has a radius; a car has an engine. These are all examples of\
    \ an object that is composed of other objects.\n\nMany programming problems that\
    \ seem to lend themselves to an inheritance solution are actually better solved\
    \ by using composition. Inheritance, especially when involving long chains of\
    \ derived classes, is notoriously hard to get correct.\n"
  mdcn: "\n## 代码中的继承示例\n\n为了演示 C++ 中继承的工作原理，我们将开发一组类，模拟公司中不同类型员工之间的关系。\n\n出于演示目的，我们将定义公司中的三种员工类型——普通员工、主管和经理。我们将让\
    \ Employee 类作为基类，Supervisor 类和 Manager 类将作为派生类。\n\n首先，让我们定义 Employee 类。为了避免事情变得过于复杂，我们将所有类定义在同一个程序中。我们不提倡在“真实世界”的程序中这样做，但如果所有类定义都在同一个地方，会让我们的讨论更容易理解。\n\
    \n以下是对 Employee 类进行定义以及测试该实现的测试程序的初步尝试：\n\n```cpp\n// EmployeeClass.cpp : main\
    \ project file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include\
    \ <iostream>\n#include <string>\nusing namespace std;\n\nclass Employee\n{\nprivate:\n\
    \        string empName;\n        double pay;\n\npublic:\n        Employee(string\
    \ name, double payRate)\n        {\n                empName = name;\n        \
    \        pay = payRate;\n        }\n\n        string getName()\n        {\n  \
    \          return empName;\n        }\n\n        double getPay()\n        {\n\
    \            return pay;\n        }\n\n        double grossPay(int hours)\n  \
    \      {\n            return pay * hours;\n        }\n};\n\nint main(array<System::String\
    \ ^> ^args)\n{\n    Employee emp1(\"Mary Smith\", 15.0);\n    cout << \"Employee\
    \ name: \" << emp1.getName() << endl;\n    cout << \"Pay rate: \" << emp1.getPay()\
    \ << endl;\n    cout << \"Gross pay: \" << emp1.grossPay(40) << endl;\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\n该程序的输出是：\n\n```\nEmployee name: Mary Smith\nPay rate:\
    \ 15\nGross pay: 600\n```\n\n现在我们可以从 Employee 类派生 Manager 类了。当我们从基类派生一个类时，我们只想实现派生类中出现的不同成员和方法，并复用基类中与派生类共享的成员和方法。这意味着我们希望继续在\
    \ Manager 类中使用 Employee 类的数据成员，并添加任何不同的属性，例如经理通常是领薪员工而不是计时员工这一事实。我们可以通过包含一个布尔变量\
    \ isSalaried 将此事实添加到 Manager 类中，然后调整 grossPay() 方法：如果对象是经理，则返回薪金；如果对象是普通员工，则返回薪金乘以工作小时数。\n\
    \n我们几乎准备好实现 Manager 类了，但有一个主要问题。Employee 类的数据成员是私有成员，这意味着它们的值只能在类定义内部访问。我们可以为基类使用一种访问修饰符，使类的成员和方法可被派生类访问：protected。这种访问修饰符允许派生类访问基类的成员和方法，但不允许任何其他代码（例如测试程序）访问。\n\
    \n一旦我们将基类的成员和方法设为受保护，就必须告诉编译器派生类正在从基类继承成员和方法。为此，在派生类定义的第一行同一行中，写一个冒号，后跟关键字 public\
    \ 和基类名称，以包含对基类的引用，如下所示：\n\n```cpp\nclass Manager : public Employee\n```\n\n现在我们可以重新定义\
    \ Employee 类并定义 Manager 类了。以下是完整程序：\n\n```cpp\n// EmployeeClass.cpp : main project\
    \ file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include <iostream>\n\
    #include <string>\nusing namespace std;\n\nclass Employee\n{\nprotected:\n   \
    \ string empName;\n    double pay;\n\npublic:\n    Employee(string name, double\
    \ payRate)\n    {\n        empName = name;\n        pay = payRate;\n    }\n\n\
    \    string getName()\n    {\n        return empName;\n    }\n\n    double getPay()\n\
    \    {\n        return pay;\n    }\n\n    double grossPay(int hours)\n    {\n\
    \        return pay * hours;\n    }\n};\n\nclass Manager : public Employee\n{\n\
    protected:\n    bool salaried;\n\npublic:\n    Manager(string name, double payRate,\n\
    \            bool isSalaried)\n        : Employee(name, payRate)\n    {\n    \
    \    salaried = isSalaried;\n    }\n\n    bool getSalaried()\n    {\n        return\
    \ salaried;\n    }\n\n    double grossPay(double hours)\n    {\n        if (salaried)\n\
    \            return pay;\n        else\n            return Employee::grossPay(hours);\n\
    \    }\n};\n\nint main(array<System::String ^> ^args)\n{\n    Employee emp1(\"\
    Mary Smith\", 15.0);\n    cout << \"Employee name: \" << emp1.getName()\n    \
    \     << endl;\n    cout << \"Pay rate: \" << emp1.getPay() << endl;\n    cout\
    \ << \"Gross pay: \" << emp1.grossPay(40)\n         << endl;\n    Manager emp2(\"\
    Liz Warren\", 1500, true);\n    cout << \"Employee name: \" << emp2.getName()\n\
    \         << endl;\n    cout << \"Pay rate: \" << emp2.getPay() << endl;\n   \
    \ cout << \"Gross pay: \" << emp2.grossPay(40)\n         << endl;\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\n我们做的第一个更改是将 Employee 类数据成员的访问修饰符从 private 改为 protected。以下是该部分代码：\n\
    \n```cpp\nclass Employee\n{\nprotected:\n    string empName;\n    double pay;\n\
    ```\n\n必须进行此更改，以便 Manager 类可以访问 Employee 类的数据成员。因此，我们不必在 Manager 类中重新声明 Employee\
    \ 类的数据成员。\n\nManager 类的构造函数也利用了继承，它使用 Employee 类定义中的成员赋值来设置员工姓名和员工薪金。让我们只关注构造函数，看看它是如何工作的：\n\
    \n```cpp\nManager(string name, double payRate,\n        bool isSalaried)\n   \
    \ : Employee(name, payRate)\n{\n    salaried = isSalaried;\n}\n```\n\n构造函数的参数列表包括所有数据成员的参数。然而，在列表之后，有一个冒号，后跟对\
    \ Employee 类基类构造函数的调用。可以把它看作函数调用。在代码中的这一点，编译器将控制权转移到为 Employee 类构造函数定义的代码。这是代码复用的经典示例，也是继承最重要的特性之一。没有理由包含以下语句：\n\
    \n```\nempName = name;\npay = payRate;\n```\n\n因为我们已经在基类中编写了它们。\n\n构造函数体的其余部分将最后一个参数赋给\
    \ Manager 类的新数据成员，即布尔数据成员 salaried。\n\n另一段需要解释的代码是 grossPay() 方法。以下是其定义：\n\n```cpp\n\
    double grossPay(double hours)\n{\n    if (salaried)\n        return pay;\n   \
    \ else\n        return Employee::grossPay(hours);\n}\n```\n\n此方法首先通过测试 salaried\
    \ 变量来检查员工是否领取薪金。如果是，该方法只返回 pay 中的值。如果员工不领薪金，则该方法计算总工资。由于我们已经在 Employee 类中执行了此计算，因此没有理由在\
    \ Manager 类中重复它。相反，我们只需像这样调用 Employee 类中的该方法：\n\n`Employee::grossPay(hours)`\n\
    \n如果我们只写：\n\n`grossPay(hours)`\n\n编译器会感到困惑并再次调用同一个方法，导致永无止境的递归调用，最终使程序崩溃。此示例演示了在\
    \ C++ 中使用继承如何帮助减少必须编写的代码量，从而使代码更易于使用和调试。\n\n### 组合\n\n继承是在派生类中复用基类的代码。*组合* 是在一个类的定义中使用其他类。组合用于描述\
    \ *“有一个”* 关系。一条线有一个点（准确地说，是两个点）；一个圆有一个半径；一辆汽车有一个发动机。这些都是一个对象由其他对象组成的例子。\n\n许多看似适合用继承解决的编程问题，实际上用组合解决更好。继承，尤其是涉及长链派生类时，众所周知很难正确实现。\n"
