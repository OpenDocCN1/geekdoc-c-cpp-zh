    # Chapter 14


    # Pointers


    Pointers are an often misunderstood feature of the C++ language. The Java programming
    language was created at least partially as an antidote to the problems caused
    by pointers. There are, though, situations when pointers are useful. Pointers
    can be used like references to pass variables by reference to a function. Some
    advanced data structures must be implemented with pointers, though there are alternatives
    to pointer-based data structures. This chapter will introduce you to how pointers
    work and why you sometimes need them.


    # Pointers Defined


    We can define pointers very simply. A pointer is a variable that contains the
    address of another variable. When we access the value of a pointer, a memory address
    is returned. A pointer is declared by placing an asterisk before the pointer variable
    name, like this:


    ```

    int *pointerVariable;

    ```


    When we want to assign an address to a pointer variable, we use the reference
    operator (&) before the variable whose address we want to assign to a pointer
    variable. For example:


    ```

    int num = 100;

    int *ptrNum;

    ptrNum = &num;

    ```'
