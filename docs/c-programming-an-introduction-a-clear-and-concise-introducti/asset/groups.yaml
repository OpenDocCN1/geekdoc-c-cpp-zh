    \ 和 bob 都是回文。\n- 3. 编写一个程序，将 10 个随机成绩存储到数组中。显示所有大于 80 的成绩。\n- 4. 编写一个程序，将一年中的月份存储到数组中，提示用户输入月份编号，然后显示与该编号对应的月份。例如，1-一月、2-二月、3-三月，等等。\n\
