    \ for each test. To do this, we want to add together all the tests in the first\
    \ column and then compute the average, followed by the tests in the second column,\
    \ and so on. To do this, all we have to do is have the outer loop process the\
    \ columns and the inner loop process the rows. The rest of the program looks just\
    \ like it did when we were averaging the student's test grades.\n\nHere is the\
    \ program above modified to compute test averages also:\n\n```cpp\n// Array2D.cpp\
    \ : main project file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(array<System::String ^> ^args)\n\
    {\n    const int rows = 5;\n    const int cols = 5;\n    int total = 0;\n    double\
    \ average = 0.0;\n    int grades[rows][cols] = {{75, 82, 84, 79, 91},\n      \
    \                        {85, 81, 94, 96, 89},\n                             \
    \ {92, 91, 94, 89, 90},\n                              {74, 72, 81, 78, 80},\n\
    \                              {84, 82, 82, 83, 81}};\n    for(int r = 0; r <\
    \ rows; ++r) {\n        cout << \"Student \" << r+1 << \": \";\n        for(int\
    \ c = 0; c < cols; c++) {\n            cout << grades[r][c] << \" \";\n      \
    \      total += grades[r][c];\n        }\n        average = total / cols;\n  \
    \      cout << \"Average: \" << average << endl;\n        total = 0;\n       \
    \ average = 0.0;\n    }\n    cout << endl << \"Test Averages: \" << endl;\n  \
    \  total = 0;\n    average = 0.0;\n    for(int c = 0; c < cols; ++c) {\n     \
    \   cout << \"Test \" << c+1 << \": \";\n        for(int r = 0; r < rows; ++r)\
    \ {\n            cout << grades[r][c] << \" \";\n            total += grades[r][c];\n\
    \        }\n        average = total / rows;\n        cout << \"Average: \" <<\
    \ average << endl;\n        total = 0;\n        average = 0.0;\n    }\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\nThe output from the column-order portion of this program\
    \ is:\n\n```text\nTest Averages:\nTest 1: 75 85 92 74 84 Average: 82\nTest 2:\
    \ 82 81 91 72 82 Average: 81\nTest 3: 84 94 94 81 82 Average: 87\nTest 4: 79 96\
    \ 89 78 83 Average: 85\nTest 5: 91 89 90 80 81 Average: 86\n```\n\n### Exercises\n\
    \n- 1. Write a program that reads 10 words from a file, stores them in an array,\
    \ and displays a histogram of the length of the words.\n- 2. Write a program that\
    \ stores a series of characters in an array. Determine if the characters make\
    \ a palindrome, which is a word that is spelled the same forwards and backwards.\
    \ For example, racecar and bob are palindromes.\n- 3. Write a program that stores\
    \ 10 random grades in an array. Display all the grades that are greater than 80.\n\
    - 4. Write a program that stores the months of the year in an array, prompts the\
    \ user to enter a month number, and then displays the month that corresponds to\
    \ that number. For example, 1-January, 2-February, 3-March, etc.\n- 5. The table\
    \ below lists the number of students enrolled in certain courses at different\
    \ campuses. Write a program that places this data into a two-dimensional array\
    \ and displays the total number of students enrolled at courses at each campus\
    \ and displays the total number of students taking each course.\n\n  |  | Course\
    \ 1 | Course 2 | Course 3 |\n  |---|---|---:|---:|---:|\n  | Campus 1 | 23 | 34\
    \ | 15 |\n  | Campus 2 | 12 | 21 | 19 |\n  | Campus 3 | 14 | 19 | 23 |\n\n## Chapter\
    \ 11\n\n### Classes and Object-Oriented Programming\n\nThe programs we write in\
    \ C++ are simulations of our interactions with objects that exist in our world.\
    \ A payroll program, for example, simulates how the company works and pays its\
    \ employees for the work they do. Each of the pieces of a payroll program represent\
    \ an object. For example, an employee has a time sheet, or time card, that stores\
    \ the number of hours he or she works in a pay period. An employee also has a\
    \ salary or hourly wage which represents the rate at which they get paid.\n\n\
    In object-oriented programming, we write programs that create objects that mirror\
    \ the objects we are trying to simulate. In C++, an object is defined by a class.\
    \ A class includes both a definition of an object's properties or attributes,\
    \ and a description of the object's behaviors. For example, when describing an\
    \ automobile, we describe what the automobile looks like and how it behaves or\
    \ performs. We can do the same thing in C++ by creating and using classes and\
    \ objects.\n\nBesides defining attributes and behaviors of objects, classes also\
    \ define how objects interact with each other. Generally, objects interact by\
    \ sending messages to each other. Using the automobile analogy again, if a Person\
    \ object wants an Automobile object to go, the Person sends the Automobile a “step\
    \ on the gas pedal” message. The ability to send and receive messages is defined\
    \ as part of an object's behaviors.\n\nAnother distinctive feature of classes\
    \ is the ability to show or hide the attributes and behaviors that make up the\
    \ class. Any attribute or behavior can be exposed to other objects or they can\
    \ be hidden so that no other object has access to the attribute or behavior. This\
    \ feature is called encapsulation and is one of the reasons object-oriented programming\
    \ has proven to be so successful.\n\nIn practice, you can consider a class to\
    \ be a user-defined type. Being able to extend the types a programming language\
    \ can work with is a crucial feature of a programming language.\n"
