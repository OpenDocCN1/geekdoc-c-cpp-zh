    \ << date << endl;\n}\n```\n\n由于 void 函数不返回值，因此它不能像有返回值函数那样在那么多地方被调用。大多数 void\
    \ 函数都作为完整语句编写（调用），如下所示：\n\n```cpp\nstring date;\ncout << \"Enter the date for\
    \ the heading: \";\ncin >> date;\nprintHeading(date);\n```\n\n## 按值传递与按引用传递\n\n\
    void 函数的另一个用途是同时修改两个变量的值。计算机编程中一个常见操作是交换两个变量的值，例如在排序操作中。例如，如果我们需要将两个 `string`\
    \ 变量按字母顺序排序，可以调用一个 void 函数来执行交换。以下是 `swap` 函数的代码，以及调用该函数的代码：\n\n```cpp\n// Swap.cpp\
