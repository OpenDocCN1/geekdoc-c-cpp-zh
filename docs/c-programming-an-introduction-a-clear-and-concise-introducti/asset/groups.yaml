    \n我们会得到这样的数据：\n\n```\n0018ECF8\n```\n\n这是一个内存地址。每次执行该语句时，这个值都会变化。\n\n如果我们想查看存储在这个内存地址上的值，也就是我们存储在\
    \ num 变量中的值，就必须解引用该指针变量，如下所示：\n\n```\ncout << *ptrNum;\n```\n\n下面这个完整程序说明了我们到目前为止讨论的内容：\n\
    \n```cpp\n// pointerExample1.cpp : main project file.\n\n#include \"stdafx.h\"\
