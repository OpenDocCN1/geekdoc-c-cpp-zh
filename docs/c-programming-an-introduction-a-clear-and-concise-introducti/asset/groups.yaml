    \ *ptrNum;\n        ptrNum = &num;\n        cout << \"The memory address of num:\
    \ \"\n             << ptrNum << endl;\n        cout << \"The value stored in num:\
    \ \"\n             << *ptrNum << endl;\n        Console::ReadKey();\n        return\
    \ 0;\n}\n```\n\n该程序的输出是：\n\nnum 的内存地址是：001CEF98  \nnum 中存储的值是：100\n\n### 指针与按引用传递\n\
    \n由于指针指向变量的内存地址，因此可以用指针将参数按引用传递给函数。\n\n本书前面已经看到，如何使用引用来创建一个 swap 函数，该函数交换作为参数传给函数的两个变量的值。下面是那个程序：\n\
    \n```cpp\n// Swap.cpp : main project file.\n\n#include \"stdafx.h\"\nusing namespace\
    \ System;\n\n#include <iostream>\n#include <string>\nusing namespace std;\n\n\
    void swap(string &word1, string &word2)\n{\n    string temp = word1;\n    word1\
    \ = word2;\n    word2 = temp;\n}\n```\n\n```cpp\nint main(array<System::String\
    \ ^> ^args)\n{\n    string word1, word2;\n    word1 = \"banana\";\n    word2 =\
    \ \"apple\";\n    cout << word1 << \" \" << word2 << endl;\n    swap(word1, word2);\n\
    \    cout << word1 << \" \" << word2 << endl;\n    Console::ReadKey();\n    return\
    \ 0;\n}\n```\n\n要用指针代替引用，我们只需在 swap 函数的参数列表中将引用运算符（&）换成指针运算符（*），并在函数体代码中使用指针引用，如下所示：\n\
    \n```cpp\nvoid swap(string *word1, string *word2)\n{\n    string temp;\n    temp\
    \ = *word1;\n    *word1 = *word2;\n    *word2 = temp;\n}\n```\n\n运行该程序会得到输出：\n\
    \n```text\nbanana apple\napple banana\n```\n\n下面是使用指针而不是引用重写 swap 函数后的完整程序：\n\n"
