    \ number2 中。显然，两个输入值之间必须有一个空格。\n\n字符串值也可以用同样的方式输入。下面是一个示例：\n\n如果用户输入“Mary”，程序输出：\n\
    \n```text\nHello, Mary\n```\n\n但如果用户输入“Mary Smith”，程序输出：\n\n```text\nHello, Mary\n\
