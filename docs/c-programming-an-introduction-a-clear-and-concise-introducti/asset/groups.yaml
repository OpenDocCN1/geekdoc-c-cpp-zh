    # Working With Text Files


    To read data from a text file, we need to use some special functions and objects
    that are part of an external library, the fstream library. This library, called
    the “file stream” library, allows us to open text files as a stream, much like
    we use the iostream library to work with the console and the keyboard.


    The first step is to include a preprocessor directive for the fstream library:


    ```

    #include <fstream>

    ```


    This directive is placed in the same group as the iostream library directive.


    The next step is to create a file object that represents the file we want to read.
    Because we are reading data from a file, the data type for the file object is
    ifstream. If we were writing data to a file, we would use the ofstream (output)
    data type. The line of code to create a file object is:


    ```

    ifstream myFile;

    ```


    We also need a string variable to store the data as its read:


    ```

    string line;

    ```


    Then we need to associate our file object with a physical file. We do this with
    the open() function, passing in the complete path to our file as the argument
    to the function. The function is called directly from the file object, like this:'
