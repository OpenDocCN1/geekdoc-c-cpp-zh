    \ cout 来显示数据。我们可以像这样组合数据类型：\n\n```cpp\ncout << \"Pi has the value \";\ncout <<\
    \ 3.14159;\n```\n\n这两条语句输出在同一行——Pi 的值为 3.14159——因为我们没有指定换行。不过，这里没有理由使用两次 cout，因为我们可以通过将\
    \ << 运算符串联起来，把两条语句合并成一条（这里我们还使用了一个变量来存储值 3.14159）：\n\n请注意，即使 \\n 是一个字符，也要用双引号将其括起来。我们也可以使用单引号来编写该语句：\n\
    \n```cpp\ncout << \"Hello, World!\" << '\\n';\n```\n\n## 练习\n\n- 1. 编写一个程序，要求用户输入其全名，然后显示“你好，name！你今天怎么样？”，其中\
    \ name 是用户输入的名字。\n- 2. 编写一个程序，要求用户输入两个数字，然后以如下形式显示两个数字的和、差、积和商（用户输入 4 和 2）：\n\
    \    - 4 加 2 等于 6\n    - 4 减 2 等于 2\n    - 4 乘以 2 等于 8\n    - 4 除以 2 等于 2\n\n\
    ## 第 6 章：决策\n\n到目前为止，我们讨论的 C++ 程序都是按顺序方式运行的，从程序的第一行开始，逐行执行到程序的最后一行。对于非常简单的问题，顺序解决方案可能就足够了，但对于更复杂的问题，我们需要能够在程序中做出决策，决定程序中的哪些行应该执行，哪些行应该跳过。\n\
    \n例如，公司的工资程序必须决定：如果员工只工作了常规工时，就按正常工资支付；如果员工工作了超过常规工时，就按加班工资支付。另一个例子是提示用户输入用户名和密码的程序。该程序必须判断输入的用户名和密码是否与可接受的用户名和密码列表匹配，从而决定允许用户进入系统还是将其拒之门外。诸如此类的决策都是使用某种形式的\
    \ if 语句做出的。但是，在研究如何使用 if 语句之前，我们必须先讨论如何在 C++ 中使用*关系*和*逻辑*表达式来比较值。\n\n### 关系表达式\n\
    \nC++ 程序通过比较两个或多个数据值来做出决策。例如，为了确定员工是否应获得加班工资，程序会将员工工作的小时数与享受加班工资所需的最低小时数（通常为 40\
    \ 小时）进行比较。这种比较是通过使用一个或多个关系运算符的关系表达式来完成的。\n\n"
