    \ C++ 编写过程式程序、面向对象程序和泛型程序，并且可以想象在一个程序中使用所有三种范式。\n\nC++ 也被认为是相对较难使用的计算机编程语言。该语言具有广泛的功能，许多程序员经常只使用其中的一小部分功能。试图一次性学会整个语言几乎是不可能的。\n\
    \n本书的目标是向你介绍 C++ 中大量功能的一小部分，但包括你立即开始编写有用的 C++ 程序所需的主要构造和功能。你将学习如何编写简单的过程式程序来解决算术问题；你将学习一些操作文本数据（字符串）的技术；你将学习如何在程序中使用决策结构（分支）来有选择地执行代码；你将学习如何在程序中使用重复（循环）来一遍又一遍地重复执行代码；你将学习如何组合函数，使你的程序模块化；你将学习如何构建诸如向量和数组之类的数据结构，以便将相关的数据值存储在内存中；你将学习如何处理文本文件，以便处理现实世界中的数据；最后，你将学习如何编写面向对象程序，以便用自己的数据类型扩展\
    \ C++ 语言，并学习如何编写使用对象来更准确地建模你试图解决的问题的程序。\n\n本书与所有其他 C++ 编程书籍相比的主要特点之一是，我们不会试图用事实和功能淹没你。每个新的编程构造和概念都被清晰简洁地呈现，只向你展示开始用\
    \ C++ 编程所需了解的那些功能。当你完成本书时，你不会成为 C++ 细节方面的专家，但你将能够用 C++ 编写有用的程序，并为学习那些对你最重要的高级功能打下良好的基础。\n\
    \n最后，学习 C++ 编程的唯一方法就是实际编写 C++ 程序。要做到这一点，你需要一个 C++ 编译器。本书中的示例我们选择使用 Microsoft Visual\
    \ C++ Express 编译器。该编译器可以从 Microsoft 免费下载，包含你学习本书所需的一切，就此而言，也包含更高级的 C++ 编程所需的一切。\n\
    \n如果你选择使用其他 C++ 编译器，你可能需要更改的唯一代码是程序开头的 #include 语句。如果你在进行这些更改时遇到问题，请联系作者寻求帮助。\n\
    \n如果你运行所有程序、对它们进行更改、再次运行它们，并且不怕尝试，你将最大程度地利用本书。完成一章后，在你有时间完成尽可能多的练习之前，不要继续下一章。你只能通过编程来学习编程。\n\
    \n## 第 1 章\n\n### Visual C++ 入门\n\nC++ 是一种编译型编程语言。这意味着什么？这意味着你用 C++ 编写的程序会被编译器翻译成机器语言，然后执行。你不必理解编译过程就可以开始学习\
    \ C++ 编程。但是，你确实需要理解程序从构思到执行所必须经历的步骤。这就是我们将在本章中讨论的内容。\n\n### 下载并安装 Visual C++ Express\n\
    \nMicrosoft 提供用于非商业用途的免费 C++ 版本，即 Visual C++ Express（Visual C++）。当前版本名为 Visual\
