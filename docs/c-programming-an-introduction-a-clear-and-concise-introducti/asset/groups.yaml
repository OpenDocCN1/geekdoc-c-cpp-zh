    \    Console::ReadKey();\n    return 0;\n}\n```\n\n这个程序中你之前没见过的唯一代码是这一行：\n\n```cpp\n\
    total = numGrades = 0;\n```\n\n与所有其他语句一样，要对其求值，请从右向左进行，因此值 0 被赋给 numGrades，而 numGrades\
    \ 的值（现在为 0）被赋给 total。像这样的快捷语句如果使程序难以阅读，并不总是一个好主意。不过，这个特定语句足够简单，任何有一点编程知识的人都能理解它在做什么。\n\
    \n## 向文本文件追加数据\n\n假设你有一个包含成绩的数据文件，内容如下：\n\n```text\n85\n77\n75\n71\n89\n91\n84\n\
    ```\n\n后来，你又参加了几次考试，想把这些成绩添加到文件中，以便更新平均分。最简单的方法是打开数据文件并将数据追加到文件中。\n\nC++ 提供了一种通过指定希望处理文件的模式来打开文件以实现该目的的方法。向文件追加数据的模式用常量\
    \ `ios::app` 指定。该模式是 open() 方法的一个可选参数。因此，如果我们想打开 grades.txt 文件以向其追加数据，就编写以下语句：\n\
    \n```cpp\nofstream outFile(\"c:\\\\data\\\\grades.txt\", ios::app);\n```\n\n现在，任何写入文件的新数据都将写在已写入文件的最后一个数据值之后。\n\
    \n下面是一个让我们向 grades.txt 文件添加更多数据的程序：\n\n```cpp\n// AppendFile.cpp : main project\
    \ file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include <iostream>\n\
    #include <fstream>\nusing namespace std;\n\nint main(array<System::String ^> ^args)\n\
    {\n    ofstream outFile(\"c:\\\\data\\\\grades.txt\",\n        ios::app);\n  \
    \  outFile << endl; // next grade on new line\n    int grade = 0;\n    cout <<\
    \ \"Enter a grade (-1 to quit): \";\n    cin >> grade;\n    while (grade > -1)\n\
    \    {\n        outFile << grade << endl;\n        cout << \"Enter a grade (-1\
    \ to quit): \";\n        cin >> grade;\n    }\n    outFile.close();\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\n你会注意到，在提示用户输入新成绩之前，我们向文件写入了一个换行符。这是因为当文件以追加方式打开时，内部文件指针指向文件中已写入的最后一个成绩之后的位置，并且仍在同一行。换句话说，如果文件中的最后一个成绩是\n\
    \n```text\n84\n```\n\n那么在追加第一个成绩之后，文件最后一行的内容将如下所示（假设 92 是追加到文件中的第一个成绩）：\n\n```text\n\
    8492\n```\n\n我们的文件结构设置为每行一个成绩，因此我们需要在添加任何新成绩之前向文件写入一个换行符，这样当 92 写入文件时，它会写在 84\
    \ 之后的下一行。\n\n## 关于文件模式的简要说明\n\n在上一节中，我们使用了文件模式 `ios::app`，以指定要打开的文件应以追加方式打开。如果我们没有使用该文件模式，open()\
    \ 方法就会认为我们想要开始一个新文件，编译器会在向文件写入任何新数据之前清空 grades.txt 文件的内容。显然，你必须非常小心文件的打开方式，尤其是在为输出而打开文件时。\n\
    \n"
