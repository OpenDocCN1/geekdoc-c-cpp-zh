    \ cout。我们可以通过声明一个 ofstream 类型的标识符来为文件创建自己的对象，ofstream 代表“输出流”。我们要创建的文件被视为输出文件。\n\
    \n创建文件对象不仅仅涉及声明该对象。我们还必须指定文件名。为此，我们要给出文件的完整路径，除非文件与程序位于同一目录中。不过这种情况并不常见，因此通常将完整路径作为参数给出。例如，如果我们想把成绩文件存储在根目录下的\
