    \n安装 Visual C++ 是一个自动过程。你下载或安装时应该不会遇到任何问题，特别是如果你在安装过程中选择默认设置。如果你在下载或安装时遇到任何问题，可以观看有关下载和安装\
    \ Visual C++ Express 的视频。你可以在以下网址找到它：\n\nhttp://www.techbookspress.com/cpp\n\n\
    Visual C++ 程序以项目形式组织。从打开窗口中选择“新建项目”以开始新程序。因此，单击“新建项目”。\n\n该窗口列出了你可以创建的不同类型的项目。本书中我们只使用\
    \ CLR 控制台应用程序，因此请确保该选择被突出显示。然后向下移动到窗口底部“名称”文本框所在的位置。\n\nVisual C++ Express 将使用你为项目指定的名称来存储项目的文件。例如，如果我们将项目命名为\
    \ Example，那么一个具有该名称的文件夹将放置在“名称”文本框下方文本框中显示的“位置”路径中。你可以为项目使用任何名称，但一定要使用有意义的名称，以便你以后可以回到某个项目继续处理它。我们现在要编写一个简单的“Hello,\
    \ world!”程序，因此输入“HelloWorld”作为项目名称。你输入的名称也会添加到“位置”下方的“解决方案名称”文本框中。我们将在后续文章中进一步讨论这个框。按“确定”，你的项目就会打开。\n\
    \n这是你将用来编写 C++ 程序的主窗口。左侧面板列出构成项目的所有文件。我们将在后续文章中进一步讨论这个窗格。右侧面板是代码编辑器，你将在其中输入 C++\
    \ 代码。你会注意到已经编写了一些代码。现在，删除以“Console::WriteLine(…”开头的那一行。然后，在读到“using namespace\
    \ System;”的那一行下方添加一个空行，并在空行下方写入以下两行：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n```\n\n然后，在读到“return 0;”的那一行上方，添加以下代码行：\n\n```cpp\ncout << \"Hello, World!\"\
    \ << endl;\n```\n\n最后一个词是“end ell”，不是“end 1”，但许多初学 C++ 的程序员会把“ell”误认为“1”，这会导致下一个要打印的内容从新的一行开始。换句话说，它强制编译器执行换行命令。\n\
    \n现在，代码编辑器窗口中的代码应该如下所示：\n\n```cpp\n#include \"stdafx.h\"\nusing namespace System;\n\
    \n#include <iostream>\nusing namespace std;\n\nint main(array<System::String ^>\
    \ ^args)\n{\n    cout << \"Hello, World!\" << endl;\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\n当你的代码看起来像这样时，按工具栏中的绿色箭头运行程序，尽管工具提示显示“开始调试”。这实际上是同一回事。系统会询问你是否要重新生成项目。对此问题回答“是”。然后你应该会看到一个控制台窗口，其中显示短语“Hello,\
    \ World!”。按任意键关闭窗口。\n\n如果这一切都正确运行，恭喜你编写了第一个 C++ 程序。如果没有正确运行，请回顾上面列出的步骤，看看你哪里做错了。\n\
    \n### “Hello, World!”程序如何工作\n\n让我们逐行检查 Hello, World! 程序，以基本了解发生了什么。第一行是：\n\n```cpp\n\
    #include \"stdafx.h\"\n```\n\n这一行称为预处理器指令，用于让编译器知道将指定文件的内容视为包含在程序的其他源代码中。文件 stdafx.h\
    \ 称为头文件，用于存储任何 C++ 程序都可以使用的可重用源代码。头文件的使用允许我们仅在需要时通过头文件调用额外功能，从而使主语言尽可能简短简洁。我们将讨论头文件\n"
