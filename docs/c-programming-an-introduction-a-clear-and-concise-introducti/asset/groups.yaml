    \ | Display | 将列表写成字符串 |\n| 4 | Count | 列表中项的数量 |\n\nADT 描述中可能仍会遗漏一些细节，例如我们究竟如何实现排序方法，但把这些信息写下来的过程会通过将注意力集中在我们知道希望类完成的事情上，帮助我们实际编写类。你会注意到，当需要数据类型时，就提供了一种数据类型。例如，vector\
    \ 将存储字符串，而 numItems 成员将存储整数。\n\n### 为 List 类开发代码\n\n现在我们可以直接从 List 类的 ADT 转到编写该类的头文件。如下所示：\n\
