    - **函数使程序更易于维护**——如果你发现函数中有错误，只需在一个地方（函数定义）修正该错误。如果有多个代码片段存在相同错误，你很可能至少会在某一处漏掉它，或者需要更长时间才能找到该错误的所有实例。\n\
