    \ Debug Win32 ------\n1>ErrorHandling.cpp\n1>ErrorHandling.cpp(8): error C2065:\
    \ 'cout' : undeclared identifier\n1>ErrorHandling.cpp(8): error C2065: 'endl'\
    \ : undeclared identifier\n=========== Build: 0 succeeded, 1 failed, 0 up-to-date,\
    \ 0 skipped ===========\n```\n\nThis error message is a little less useful than\
