  md: "\n## A Composition Example: The Employee Class\n\nThere are many attributes\
    \ that define an employee, such as his or her name, their age, their sex, their\
    \ hiring date, etc. Some of these attributes can exist on their own as classes,\
    \ such as the name and the hiring date. In this section we'll build an Employee\
    \ class that is composed of objects of a Name class and a Date class.\n\nWe already\
    \ defined a Name class so we can just use a simplified version of that class here.\
    \ We'll list it again when we display all the code for the employee class. We\
    \ don't have a Date class, however, so let's define it now.\n\nThe members of\
    \ a Date class will definitely include the day, the month, and the year. There\
    \ are many other possibilities but we'll limit our definition to those three members.\n\
    \nThe methods of a Date class we'll define here include just one constructor and\
    \ a method for displaying a date in mm/dd/yyyy format. There are also many other\
    \ methods we could include, but these two will be enough to demonstrate how the\
    \ class can be used in a class composition example.\n\nHere is the code for the\
    \ Date class:\n\n```cpp\nclass Date\n{\nprivate:\n    int month, day, year;\n\n\
    public:\n    Date()\n    {\n        month = 0;\n        day = 0;\n        year\
    \ = 0;\n    }\n\n    Date(int m, int d, int y)\n    {\n        month = m;\n  \
    \      day = d;\n        year = y;\n    }\n\n    void setDate(int m, int d, int\
    \ y)\n    {\n        month = m;\n        day = d;\n        year = y;\n    }\n\n\
    \    string getDate()\n    {\n        stringstream dt;\n        dt << month <<\
    \ \"/\" << day << \"/\" << year;\n        return dt.str();\n    }\n};\n```\n\n\
    The getDate() method above requires some explanation. The C++ language does not\
    \ do a good job combining strings and integers. The easy way to write the getDate()\
    \ function is:\n\n```cpp\nreturn month + \"/\" + day + \"/\" + year;\n```\n\n\
    But this method won’t compile. The easiest solution is to use a special data type,\
    \ stringstream, which allows you to assign a stream of data to a variable just\
    \ as you write a stream of data to the console. You can then write the stream\
    \ containing the month, day, and year with slashes to the variable and then display\
    \ the value of the stringstream variable as a string.\n\nNow we’re ready to build\
    \ the Employee class using the Date class and the Name class. Here is the code:\n\
    \n```cpp\nclass Employee\n{\nprivate:\n    Name empName;\n    Date hireDate;\n\
    \npublic:\n    Employee(string first, string middle,\n             string last,\
    \ int m, int d, int y)\n    {\n        empName.setName(first, middle, last);\n\
    \        hireDate.setDate(m, d, y);\n    }\n\n    string getEmployee()\n    {\n\
    \        return empName.getName() + \"\\n\" +\n               hireDate.getDate()\
    \ + \"\\n\";\n    }\n};\n```\n\nThe data members consist of two objects – a Name\
    \ object and a Date object. The constructor has to call the setName and setDate\
    \ methods respectively to put data into the two data members since there is no\
    \ way to call the constructors at this point. The getEmployee() method simply\
    \ calls the respective get methods for the Name and Date objects, along with newline\
    \ characters to make the output easier to read.\n\nMany of the problems you will\
    \ run into in object-oriented programming can be solved more easily and more efficiently\
    \ using composition instead of inheritance. Composition takes advantage of code\
    \ reuse in much the same way inheritance does, but won’t lead to confusing, inefficient,\
    \ and potentially incorrect code in the same way inheritance can. Many more problems\
    \ also lend themselves to a compositional solution rather than a solution using\
    \ inheritance.\n\n## Exercises\n\n- 1. Design a DateBook class that consists of\
    \ the classes Name and Date. Write a program to test the class. Be sure to create\
    \ a full set of constructors and get and set methods.\n- 2. Create a DateTime\
    \ class that combines a Date class and a Time class so that if the time moves\
    \ from 23:59 to 00:00, the corresponding day increments by 1. Be sure to include\
    \ constructor and get and set methods.\n\n## Appendix A\n\n### Errors and Error\
    \ Messages\n\nIt is inevitable that you will have errors in your programs. It\
    \ is especially true that beginning C++ programmers will have many errors in their\
    \ programs, but it is equally true that expert C++ programmers experience errors\
    \ in their code every day. Programming is just too complex for a programmer to\
    \ not expect to have to deal with errors. In this appendix we discuss a few of\
    \ the common errors you will come up against as you start learning C++. More importantly,\
    \ we discuss how to interpret the error messages you will receive when the compiler\
    \ finds errors in your code.\n\n#### Syntax Errors\n\nThe most common errors you\
    \ will make as you first start learning C++ programming are *syntax errors*. A\
    \ syntax error means that you didn't form a C++ statement correctly. An example\
    \ of a common syntax error is leaving a semicolon off the end of a statement.\
    \ Here is a C++ program with a semicolon left off one of the statements:\n\n```cpp\n\
    // ErrorHandling.cpp : main project file.\n\n#include \"stdafx.h\"\nusing namespace\
    \ System;\n\n#include <iostream>\nusing namespace std;\n\nint main(array<System::String\
    \ ^> ^args)\n{\n    cout << \"Hello, World!\" << endl\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\nWhen you run this program, you first get a pop-up box\
    \ with this message: \"There were build errors. Would you like to continue and\
    \ run the last successful build?\" You should answer \"No\" to this question.\n\
    \nNow look at the bottom of Visual C++ Express, in the Output window. You will\
    \ see the following message:\n\n```text\n1>------ Build started: Project: ErrorHandling.cpp,\
    \ Configuration: Debug Win32 ------\n1>ErrorHandling.cpp\n1>ErrorHandling.cpp(12):\
    \ error C2143: Syntax error: missing ';' before System::Console::ReadKey\n======\
    \ Build: 0 succeeded, 1 failed, 0 up-to-date, 0 skipped ======\n```\n\nThe Output\
    \ message tells you very clearly that you have a missing semicolon and it also\
    \ gives you the line where the compiler finally decided an error had occurred.\
    \ It couldn't tell you the error was on line 11 because it had to wait to spot\
    \ the following code on line 12 to be sure that the semicolon really needed to\
    \ be placed at the end of line 11. However, Console::ReadKey() can't follow cout\
    \ << \"Hello, World!\" << endl without there being a semicolon after the endl,\
    \ so the error was reported.\n\nAnother common syntax error is to mistype the\
    \ name of a variable. The following program demonstrates what happens when you\
    \ type a variable name incorrectly:\n\n```cpp\n// ErrorHandling.cpp : main project\
    \ file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include <iostream>\n\
    using namespace std;\n\nint main(array<System::String ^> ^args)\n{\n    int number1,\
    \ number2, number3;\n    number1 = 12;\n    number2 = 23;\n    numbre3 = number1\
    \ + number2;\n    cout << \"The sum is: \" << number3 << endl;\n    Console::ReadKey();\n\
    \    return 0;\n}\n```\n\nYou can see where the variable number3 was mistyped\
    \ on line 14. The resulting error message is:\n\n```text\n1>------ Build started:\
    \ Project: ErrorHandling, Configuration: Debug Win32 ------\n1>ErrorHandling.cpp\n\
    1>ErrorHandling.cpp(14): error C2065: 'numbre3': undeclared identifier\n1>------\
    \ Build: 0 succeeded, 1 failed, 0 up-to-date, 0 skipped ------\n```\n\nThis error\
    \ message is more user-friendly, as it reports exactly which line the typo occurred\
    \ on and what the typo was. All you have to do is go back to the program and fix\
    \ the mistake.\n\nAnother common syntax error is one of omission — leaving out\
    \ a library from the preprocessor directives. The program below forgets to include\
