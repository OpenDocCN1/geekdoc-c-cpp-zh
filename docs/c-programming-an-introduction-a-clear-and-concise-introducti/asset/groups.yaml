    # Chapter 8


    Vectors


    The data types we have discussed so far are useful for storing single items. A
    variable for storing a name can store only one name; a variable for storing a
    number can store only one number. Often we need the ability to store multiple
    values using the same variable name. One solution for this problem is the vector.
    A vector allows us to store multiple items of the same data type under one name.
    This data structure can be viewed as a list, such as a list of grades or a list
    of names.


    # What is a Vector?


    As we mentioned above, a vector can be viewed as a list of data items of the same
    data type. Each item in the list is specified by an index position in the list.
    The first item added to a vector is placed in index position 0, the next item
    is placed at index position 1, the next item is placed at index position 2, and
    so on.


    Graphically, a vector looks like this (the first column is the index and the vector
    was declared to initially have 10 elements):


    | Index | Element |

    |---:|---|

    | 0 | Data item |

    | 1 | Data item |

    | 2 | Date item |

    | 3 | Data item |

    | 4 | Data item |'
