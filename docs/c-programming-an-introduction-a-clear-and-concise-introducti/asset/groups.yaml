    \n首先，我们需要确定变量的数据类型。测试成绩都是整数，因此测试成绩变量将声明为整数。测试成绩的总数也是整数，因此也是整数，但我们希望将其声明为常量，以演示常量的用法。测试成绩的总和也将声明为整数变量。不过，平均值可以是浮点值，因此我们需要将该变量声明为\
    \ double。\n\n以下是声明变量的语句：\n\n```cpp\nint grade1, grade2, grade3, grade4, grade5,\
