    \nC++ 的主要控制流结构包括用于决策的 if 语句、用于重复的 while 和 for 循环，以及用于将代码块视为一个单元的函数。在本章中，我们将考察一些也会修改程序控制流的结构——用于以另一种方式做出决策的\
    \ switch 语句，以及用于以另一种方式执行重复的 do-while 循环。\n\n### switch 语句\n\n*switch* 语句提供了一种替代\
    \ if 语句的方式，用于根据条件决定执行哪一组语句。对于许多决策而言，switch 语句通常被认为不如 if 语句灵活，因为 switch 语句中测试的条件必须是一个求值为整数值的表达式。在实践中，这意味着要使用\
    \ switch 语句，程序必须要求决策基于 int 或 char 类型的表达式。然而，在合适的情况下，switch 语句可能比 if 语句更容易创建、修改和阅读。\n\
    \n#### 编写 switch 语句\n\nswitch 语句的一般形式为：\n\n```cpp\nswitch (expression)\n{\n  \
    \  case const-expr:\n        set of statements;\n        break;\n    case const-expr:\n\
    \        set of statements;\n        break;\n    ...\n    default:\n        set\
    \ of statements;\n}\n```\n\n如上所述，被测试的表达式必须是整型，通常是整数或字符。分支到一组语句发生在 switch 语句的 case\
    \ 子句部分。case 子句中的常量表达式（const-expr）会与开头的表达式进行比较。如果比较为真，则执行该子句内的一组语句，然后由于 break 语句，控制权会转移到\
    \ switch 语句之外。如果比较为假，控制会落到下一个 case 子句。如果没有执行任何 case 子句，并且存在 default 子句，则执行 default\
    \ 子句内的语句。\n\n一些示例可能会消除你对 switch 语句工作方式的任何误解。在第一个示例中，输入一个字母等级，并显示该字母等级可能的数值范围：\n\
    \n```cpp\n// Switch.cpp : main project file.\n\n#include \"stdafx.h\"\nusing namespace\
    \ System;\n\n#include <iostream>\nusing namespace std;\n\nint main(array<System::String\
    \ ^> ^args)\n{\n    char letterGrade;\n    cout << \"Enter your letter grade:\
    \ \";\n    cin >> letterGrade;\n    switch (letterGrade)\n    {\n        case\
    \ 'A':\n            cout << \"A grade is in the range of 90-100.\"\n         \
    \        << endl;\n            break;\n        case 'B':\n            cout <<\
    \ \"B grade is in the range of 80-89.\"\n                 << endl;\n         \
    \   break;\n        case 'C':\n            cout << \"C grade is in the range of\
    \ 70-79.\"\n                 << endl;\n            break;\n        case 'D':\n\
    \            cout << \"D grade is in the range of 60-69.\"\n                 <<\
