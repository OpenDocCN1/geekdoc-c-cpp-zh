    \n  |  | 课程 1 | 课程 2 | 课程 3 |\n  |---|---|---:|---:|---:|\n  | 校区 1 | 23 | 34\
    \ | 15 |\n  | 校区 2 | 12 | 21 | 19 |\n  | 校区 3 | 14 | 19 | 23 |\n\n## 第 11 章\n\n\
    ### 类与面向对象编程\n\n我们在 C++ 中编写的程序，是对我们与世界中所存在对象进行交互的模拟。例如，薪资程序模拟公司如何运作，以及如何为员工所做的工作支付报酬。薪资程序的每个组成部分都代表一个对象。例如，员工有一张工时表，或称考勤卡，用来存储他或她在某个薪资周期内工作的小时数。员工还有薪水或时薪，这代表他们的薪酬标准。\n\
    \n在面向对象编程中，我们编写的程序所创建的对象，映射了我们试图模拟的对象。在 C++ 中，对象由类定义。类既包含对象属性或特性的定义，也包含对象行为的描述。例如，在描述一辆汽车时，我们会描述汽车的外观以及它如何运行或表现。在\
    \ C++ 中，我们可以通过创建和使用类与对象来做同样的事情。\n\n除了定义对象的属性和行为之外，类还定义对象之间如何交互。通常，对象通过相互发送消息来交互。再次使用汽车的类比，如果一个\
    \ Person 对象想让一个 Automobile 对象行驶，Person 会向 Automobile 发送一条“踩油门踏板”消息。发送和接收消息的能力被定义为对象行为的一部分。\n\
    \n类的另一个显著特征是能够显示或隐藏构成类的属性和行为。任何属性或行为都可以暴露给其他对象，也可以隐藏起来，使其他对象无法访问该属性或行为。这一特性称为封装，也是面向对象编程被证明如此成功的原因之一。\n\
    \n在实践中，可以把类视为一种用户定义类型。能够扩展编程语言可处理的类型，是编程语言的一项关键特性。\n\n"
