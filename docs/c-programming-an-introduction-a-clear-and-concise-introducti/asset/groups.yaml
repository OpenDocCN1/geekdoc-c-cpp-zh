  mdcn: "\n```cpp\nnumber3 = number1 + number2;\ncout << \"The sum is \" << number3\
    \ << endl;\nConsole::ReadKey();\nreturn 0;\n}\n```\n\n该程序会导致显示一条类似的错误消息：\n\n```text\n\
    1>------ Build started: Project: ErrorHandling, Configuration: Debug Win32 ------\n\
    1>  ErrorHandling.cpp\n1>ErrorHandling.cpp(14): error C2065: 'number3': undeclared\
    \ identifier\n1>ErrorHandling.cpp(15): error C2065: 'number3': undeclared identifier\n\
    ========== Build: 0 succeeded, 1 failed, 0 up-to-date, 0 skipped ==========\n\
    ```\n\n不过，这次错误消息并不是因为漏掉了某个库，而是因为程序忘记声明变量 number3。注意，错误消息中变量被使用的两处都被列为错误，而不仅仅是第一次出现的位置。\n\
    \n当然，你可能还会犯其他语法错误，但我们刚才讨论的错误是你可能遇到的三种较为常见的错误。通过讨论错误消息的样子以及如何解读它们，你现在至少应该不会像以前那样被未来可能遇到的新错误消息吓到了。\n\
    \n## 逻辑错误\n\n一旦程序能够编译并运行，出现的任何错误都可以称为*逻辑错误*，即程序逻辑中的错误。逻辑错误比语法错误难找得多，因为计算机程序只会执行程序员告诉它做的事情，而不会多做任何事。程序无法理解程序员在编写代码时想要做什么，它只能依次执行遇到的语句。\n\
    \n逻辑错误形形色色，我们只能举几个例子来说明逻辑错误与语法错误有何不同。下面的程序显示了数字数组中最后一个元素：\n\n```cpp\n// ErrorHandling.cpp\
    \ : main project file.\n\n#include \"stdafx.h\"\nusing namespace System;\n\n#include\
    \ <iostream>\nusing namespace std;\n\nint main(array<System::String ^> ^args)\n\
    {\n    const int size = 10;\n    int numbers[size];\n    for(int i = 0; i < size;\
    \ ++i)\n        numbers[i] = i + 1;\n    cout << \"The last item in the array\
    \ is: \"\n         << numbers[size] << endl;\n    Console::ReadKey();\n    return\
    \ 0;\n}\n```\n\n你能找出错误吗？如果找不到，你觉得输出应该是什么？现在，运行程序看看实际输出是什么：\n\nThe last item in\
    \ the array is -1231954775\n\n但你可能认为最后一项应该是 10。\n\n如果仔细查看代码，会发现 cout 语句中使用了常量\
    \ size，而 size 的值为 10。然而，数组的上界是 9，因此用于显示最后一个数组元素的下标应该是 size - 1。\n\n这就是逻辑错误的一个例子。程序运行正确，但输出不符合预期。通常，找到逻辑错误的唯一方法是审查代码，仔细查找编程中可能出错的地方。\n\
    \n再举一个例子：你需要编写一个程序来查找文件中存储的一组数字的最大值。在声明用于存储最大值的变量的那一行，你将其初始化为 0。运行程序后，它报告最大值为\
    \ 0。嗯？你挠了一会儿头，然后去查看数据文件，发现文件中的所有数字都是负数。显然，当 max 等于 0 时，没有任何值能通过测试 (currentValue\
    \ > max)，因此按照程序的逻辑，0 就是最大值。\n\n查找这类错误既是一门科学，也是一门艺术。你必须仔细地逐行检查程序，并且必须透彻理解程序所处理的数据。经验是查找错误的最佳老师。你拥有的经验越多，你就能做得越好。只要你继续编写程序，你就会从错误中积累经验。\n\
