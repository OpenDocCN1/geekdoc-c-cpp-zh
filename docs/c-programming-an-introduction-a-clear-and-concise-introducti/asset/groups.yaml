  - '[PAGE 17]


    ```

    cout << "Hello, World! << endl;

    ```


    In this line we''re saying that we want the phrase “Hello, World!” to be displayed
    to the standard output device, which is by default the console, and is defined
    as the cout object. The << operator, called the “put to” operator, specifies that
    the data that follows it is to be “put to” the standard output device. In simple
    terms, this line will cause the phrase “Hello, World!” to be displayed in a command
    prompt window. We’ve already discussed what endl does. Each piece of C++ code
    that ends in a semicolon is called a *statement*. Think of statements in C++ like
    sentences in English. The compiler checks for correct grammar in a C++ program
    by analyzing the statements you write.


    The next line:


    ```

    Console::ReadKey();

    ```


    uses another object that represents standard output, Console, and calls a method
    or function, ReadKey(), to leave the command prompt window open until the user
    presses any key. If we don''t use this line, the command prompt window will disappear
    as soon as “Hello, World!” is written to it.


    Next we see:


    ```

