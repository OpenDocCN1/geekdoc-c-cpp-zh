    \n这些运算符随后用于构成算术表达式。以下是一些示例：\n\n```\n23 + 2\n100 - 17\n43.2 * 3.14159\n2300 / 12\n\
    12 % 2\n```\n\n你也可以使用这些运算符构成更复杂的算术表达式：\n\n```\n12 + 2 * 3 + 4 / 2\n```\n\n当编写这样的表达式时，C++\
