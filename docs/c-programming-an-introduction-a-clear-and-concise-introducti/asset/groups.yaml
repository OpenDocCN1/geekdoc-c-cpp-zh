    \ are different for functions and for class methods, which are really just functions\
    \ defined inside classes. Two"
  md: "\n## Classes Defined\n\nWhen we create a class in C++, we create two distinct\
    \ parts – the data members (also just called members) which define the attributes\
    \ of a class, and the methods (implemented as functions), which describe the behavior\
    \ of the class.\n\nMembers and methods are defined in two distinct sections of\
    \ a class, either the public section or the private section. Members and methods\
    \ which are defined in the public section of a class are visible to all other\
    \ objects in a program. Members and methods which are defined in the private section\
    \ of a class are visible only to the class itself, and not other objects interacting\
    \ with the class. This will all make more sense when we examine a few examples.\n\
    \nClass definitions are placed in the global area, in the same place where you\
    \ define functions. A class definition begins with the keyword class and a class\
    \ name, followed by a block, which is where the member and method definitions\
    \ are placed. For example, to create a Name class we start the definition like\
    \ this:\n\n```cpp\nclass Name\n{\n    // member and method definitions go here\n\
    };\n```\n\nNotice that the closing brace of the block is followed by a semicolon.\
    \ The definitions of new types must always end with a semicolon in C++.\n\nThe\
    \ next step in defining a class is to determine the members for the class. Sticking\
    \ with our Name example, the members of a name can include the first name, the\
    \ middle name, and the last name. We could also include things like nicknames,\
    \ suffixes (Jr., Sr. etc.), but to keep things simple we'll limit a name to the\
    \ first, middle, and last names.\n\nAfter we determine the members of the class,\
    \ we have to decide if the members are going to be placed in the public section\
    \ or the private section. A common rule when defining a class is to make the members\
    \ private and use public methods to access and modify their values.\n\nThe keywords\
    \ public and private are called *access modifiers*. They determine the access\
    \ level for a member or a method. A method or member that is declared as public\
    \ can be accessed by any code in a program. A method or member that has been declared\
    \ as private can only be accessed within the class definition and not by any code\
    \ that uses the class.\n\nLet’s extend our definition of the Name class by including\
    \ declarations for the members:\n\n```cpp\nclass Name\n{\n    private:\n    string\
    \ first, middle, last;\n};\n```\n\nAs you can see, the private section of a class\
    \ is marked by the keyword private and a colon. Everything declared and defined\
    \ below it is considered private to the class.\n\nWe now need to define a method\
    \ by which we can place data into the class. This method definitely needs to be\
    \ made public so that the program using the class can access the method. The method\
    \ is called setName and here is its definition within the full class definition:\n\
    \n```cpp\nclass Name\n{\n    private:\n    string first, middle, last;\n\n   \
    \ public:\n\n    void setName(string firstName, string middleName,\n         \
    \        string lastName)\n    {\n        first = firstName;\n        middle =\
    \ middleName;\n        last = lastName;\n    }\n};\n```\n\nWe’re almost ready\
    \ to take our class out for a test drive, but first we need a method that allows\
    \ us to display a name. We'll call this method getName() and place it in the public\
    \ section as well:\n\n```cpp\nclass Name\n{\n    private:\n    string first, middle,\
    \ last;\n\n    public:\n\n    void setName(string firstName, string middleName,\n\
    \                 string lastName)\n    {\n        first = firstName;\n      \
    \  middle = middleName;\n        last = lastName;\n    }\n\n    string getName()\n\
    \    {\n        return first + \" \" + middle + \" \" + last;\n    }\n};\n```\n\
    \nNow we can use the class in a program. First, we need to declare a Name object:\n\
    \n```cpp\nName aName;\n```\n\naName is declared as a Name object. It is important\
    \ to understand the distinction between a class and an object. A class defines\
    \ a data type and an object is an instance of that type.\n\nAfter creating an\
    \ object of Name type, we need to put data into the object. We can do that with\
    \ the setName() method:\n\n```cpp\naName.setName(\"John\", \"Quincy\", \"Adams\"\
    );\n```\n\nWe can then display the name using the getName() method. This method\
    \ returns each member as one concatenated string, with spaces between the first\
    \ and middle names.\n\nRather than show just another piece of the program, here\
    \ is the complete program, including the Name class definition:\n\n```cpp\n//\
    \ NameClass.cpp : main project file.\n\n#include \"stdafx.h\"\nusing namespace\
    \ System;\n\n#include <iostream>\n#include <string>\nusing namespace std;\n\n\
    class Name\n{\n    private:\n    string first, middle, last;\n\n    public:\n\n\
    \    void setName(string firstName, string middleName,\n                 string\
    \ lastName)\n    {\n        first = firstName;\n        middle = middleName;\n\
    \        last = lastName;\n    }\n\n    string getName()\n    {\n        return\
    \ first + \" \" + middle + \" \" + last;\n    }\n};\n\nint main(array<System::String\
    \ ^> ^args)\n{\n    Name aName;\n    aName.setName(\"John\", \"Quincy\", \"Adams\"\
    );\n    cout << aName.getName() << endl;\n    Console::ReadKey();\n    return\
    \ 0;\n}\n```\n\nThe output from this program is:\n\nJohn Quincy Adams\n\n## Using\
    \ Constructor Methods to Create Class Objects\n\nOne of the design goals when\
    \ creating a class is to make the class as flexible as possible. This means providing\
    \ different alternatives for accomplishing tasks using the class. One example\
    \ of providing flexibility in a class is having several ways of entering data\
    \ into an object.\n\nEarlier we discussed one way of entering data using the setName()\
    \ method. There will also be times when you want to enter the data for an object\
    \ when you are declaring the object. To do this, you need a special type of method\
    \ called a constructor.\n\nA constructor method for the Name class works exactly\
    \ like the setName() method, in that it will have arguments for each of the members\
    \ and the body of the method will assign the arguments of the method to the corresponding\
    \ member. A major difference between a standard class method and a constructor\
    \ method is that the constructor method has the same name as the class. For example,\
    \ here is one possible definition of a constructor for the Name class:\n\n```cpp\n\
    Name(string firstName, string middleName,\n      string lastName)\n{\n    first\
    \ = firstName;\n    middle = middleName;\n    last = lastName;\n}\n```\n\nWith\
    \ this definition of the constructor, we can create a new object like this:\n\n\
    ```cpp\nName yourName(\"Gene\", \"Ray\", \"Williams\");\n```\n\nThis makes working\
    \ with classes more flexible because we're allowing the user of the class to declare\
    \ an object with data just as it can be done with variables.\n\nThere is one problem,\
    \ though. C++ won't let us use this constructor method until we create a second\
    \ constructor method, known as a *default constructor*. A default constructor\
    \ is a method with no arguments that assigns default values to the members of\
    \ a class. The Visual C++ compiler will not allow a constructor method to be defined\
    \ if there is not a default constructor method also defined. Before we defined\
    \ our first constructor, the compiler let us run the program because if no constructor\
    \ is provided, the compiler provides its own default constructor. However, once\
    \ we define a constructor, we also have to provide a definition for a default\
    \ constructor as well.\n\nSo, before we can use the constructor above, we have\
    \ to define a default constructor. Here it is:\n\n```cpp\nName()\n{\n    first\
    \ = \"\";\n    middle = \"\";\n    last = \"\";\n}\n```\n\nOne thing you may have\
    \ noticed by now is that we now have two constructor methods with the same name.\
    \ You learned early in this book that C++ doesn't allow two identifiers to be\
    \ the same within the same scope, such as when you try to declare a second variable\
    \ in main() that has the same name as an already declared variable.\n\nThe rules\
    \ for unique names are different for functions and for class methods, which are\
    \ really just functions defined inside classes. Two\n"
  mdcn: "\n## 类的定义\n\n当我们在 C++ 中创建类时，会创建两个不同的部分——数据成员（也简称为成员），用于定义类的属性；以及方法（以函数形式实现），用于描述类的行为。\n\
    \n成员和方法在类的两个不同部分中定义，即公有部分或私有部分。在类的公有部分中定义的成员和方法对程序中的所有其他对象可见。在类的私有部分中定义的成员和方法仅对该类自身可见，而与该类交互的其他对象不可见。当我们查看几个示例后，这一切就会更加清楚。\n\
    \n类定义放在全局区域中，也就是定义函数所在的同一位置。类定义以关键字 class 和类名开头，后面跟着一个块，成员和方法的定义就放在这个块中。例如，要创建一个\
    \ Name 类，我们像这样开始定义：\n\n```cpp\nclass Name\n{\n    // member and method definitions\
    \ go here\n};\n```\n\n注意，块的右花括号后面跟有一个分号。在 C++ 中，新类型的定义必须始终以分号结尾。\n\n定义类的下一步是确定该类的成员。继续以\
    \ Name 示例为例，姓名的成员可以包括名、中间名和姓。我们也可以包括昵称、后缀（Jr.、Sr. 等）之类的内容，但为简单起见，我们将姓名限制为名、中间名和姓。\n\
    \n确定类的成员后，我们必须决定这些成员要放在公有部分还是私有部分。定义类时的一条常见规则是：将成员设为私有，并使用公有方法来访问和修改它们的值。\n\n\
    关键字 public 和 private 称为*访问修饰符*。它们决定成员或方法的访问级别。声明为 public 的方法或成员可以被程序中的任何代码访问。声明为\
    \ private 的方法或成员只能在类定义内部访问，而不能被使用该类的任何代码访问。\n\n让我们通过包含成员声明来扩展 Name 类的定义：\n\n```cpp\n\
    class Name\n{\n    private:\n    string first, middle, last;\n};\n```\n\n如你所见，类的私有部分由关键字\
    \ private 和冒号标记。在其下方声明和定义的所有内容都被视为该类的私有内容。\n\n现在我们需要定义一个方法，通过它把数据放入类中。这个方法肯定需要设为公有，以便使用该类的程序能够访问该方法。该方法名为\
    \ setName，以下是它在完整类定义中的定义：\n\n```cpp\nclass Name\n{\n    private:\n    string first,\
    \ middle, last;\n\n    public:\n\n    void setName(string firstName, string middleName,\n\
    \                 string lastName)\n    {\n        first = firstName;\n      \
    \  middle = middleName;\n        last = lastName;\n    }\n};\n```\n\n我们几乎可以让这个类进行试用测试了，但首先需要一个能显示姓名的方法。我们将这个方法称为\
    \ getName()，并同样把它放在公有部分：\n\n```cpp\nclass Name\n{\n    private:\n    string first,\
    \ middle, last;\n\n    public:\n\n    void setName(string firstName, string middleName,\n\
    \                 string lastName)\n    {\n        first = firstName;\n      \
    \  middle = middleName;\n        last = lastName;\n    }\n\n    string getName()\n\
    \    {\n        return first + \" \" + middle + \" \" + last;\n    }\n};\n```\n\
    \n现在可以在程序中使用这个类了。首先，我们需要声明一个 Name 对象：\n\n```cpp\nName aName;\n```\n\naName 被声明为一个\
    \ Name 对象。理解类与对象之间的区别很重要。类定义一种数据类型，而对象是该类型的一个实例。\n\n创建 Name 类型的对象后，我们需要把数据放入该对象。可以使用\
    \ setName() 方法来完成：\n\n```cpp\naName.setName(\"John\", \"Quincy\", \"Adams\");\n\
    ```\n\n然后可以使用 getName() 方法显示姓名。该方法将每个成员作为一个拼接后的字符串返回，并在名和中间名之间留有空格。\n\n这里不再只展示程序的另一个片段，而是给出完整程序，其中包括\
    \ Name 类定义：\n\n```cpp\n// NameClass.cpp : main project file.\n\n#include \"stdafx.h\"\
    \nusing namespace System;\n\n#include <iostream>\n#include <string>\nusing namespace\
    \ std;\n\nclass Name\n{\n    private:\n    string first, middle, last;\n\n   \
    \ public:\n\n    void setName(string firstName, string middleName,\n         \
    \        string lastName)\n    {\n        first = firstName;\n        middle =\
    \ middleName;\n        last = lastName;\n    }\n\n    string getName()\n    {\n\
    \        return first + \" \" + middle + \" \" + last;\n    }\n};\n\nint main(array<System::String\
    \ ^> ^args)\n{\n    Name aName;\n    aName.setName(\"John\", \"Quincy\", \"Adams\"\
    );\n    cout << aName.getName() << endl;\n    Console::ReadKey();\n    return\
    \ 0;\n}\n```\n\n该程序的输出为：\n\nJohn Quincy Adams\n\n## 使用构造函数创建类对象\n\n创建类时的设计目标之一是让类尽可能灵活。这意味着为使用该类完成任务提供不同的可选方式。为类提供灵活性的一个例子是，让一个对象可以通过多种方式输入数据。\n\
    \n前面我们讨论了使用 setName() 方法输入数据的一种方式。有时你还希望在声明对象时就为对象输入数据。为此，你需要一种特殊类型的方法，称为构造函数。\n\
    \nName 类的构造函数方法与 setName() 方法的工作方式完全相同：它将为每个成员提供参数，方法体将把方法的参数赋给对应的成员。标准类方法与构造函数方法的一个主要区别是，构造函数方法与类同名。例如，下面是\
    \ Name 类构造函数的一种可能定义：\n\n```cpp\nName(string firstName, string middleName,\n  \
    \    string lastName)\n{\n    first = firstName;\n    middle = middleName;\n \
    \   last = lastName;\n}\n```\n\n有了这个构造函数定义，我们可以像这样创建一个新对象：\n\n```cpp\nName yourName(\"\
    Gene\", \"Ray\", \"Williams\");\n```\n\n这使类的使用更加灵活，因为我们允许类的使用者像声明变量时那样，在声明对象时一并提供数据。\n\
    \n不过，有一个问题。C++ 不允许我们使用这个构造函数方法，除非我们再创建一个构造函数方法，称为*默认构造函数*。默认构造函数是没有参数的方法，它为类的成员分配默认值。如果未同时定义默认构造函数方法，Visual\
    \ C++ 编译器将不允许定义构造函数方法。在我们定义第一个构造函数之前，编译器允许我们运行程序，因为如果没有提供构造函数，编译器会提供自己的默认构造函数。然而，一旦我们定义了构造函数，也就必须为默认构造函数提供定义。\n\
    \n因此，在使用上面的构造函数之前，我们必须定义一个默认构造函数。如下所示：\n\n```cpp\nName()\n{\n    first = \"\"\
    ;\n    middle = \"\";\n    last = \"\";\n}\n```\n\n你可能已经注意到一件事：我们现在有两个同名构造函数方法。你在本书前面已经了解到，C++\
    \ 不允许同一作用域内有两个相同标识符，例如当你试图在 main() 中声明第二个变量，而该变量与已声明的变量同名时。\n\n函数和类方法（实际上只是在类内部定义的函数）的唯一名称规则不同。两个\n"
