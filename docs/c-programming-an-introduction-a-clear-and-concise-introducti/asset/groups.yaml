  mdcn: "\n关系运算符有：\n\n- `==` 等于\n- `!=` 不等于\n- `>` 大于\n- `<` 小于\n- `>=` 大于或等于\n- `<=`\
    \ 小于或等于\n\n这些运算符是*二元*运算符，因此它们需要在运算符两侧都有操作数。这些操作数可以是任何表达式，包括字面值。关系运算符与两个操作数的组合称为*关系表达式*。\n\
    \n关系表达式总是求值为一个布尔值，要么是 true，要么是 false。以下是一些关系表达式的示例：\n\n```cpp\n(2 == 2) // true\n\
    (50 >= 50) // true\n(34 <= 272) // true\n(9 != 9) // false\n(\"Ronald\" == \"\
    ronald\")\n// false because \"R\" is not equal to \"r\"\n(\"baboon\" > \"ape\"\
    )\n// true because \"b\" is greater than \"a\"\n```\n\n当然，变量和字面值一样可以用于关系表达式。注意，在\
    \ C++ 中关系表达式必须写在括号内。有些其他语言（例如 Visual Basic）没有这个要求。\n\n## 逻辑运算符\n\n更复杂的比较有时需要程序员组合两个或多个关系表达式。这类比较被称为逻辑表达式，并通过逻辑运算符执行。逻辑运算符有：\n\
    \n- `&&` 与\n- `||` 或\n- `!` 非\n\n下面是一个示例，说明如何将 `&&` 逻辑运算符与两个关系表达式一起使用（假设我们已经声明了变量\
    \ `workerType` 和 `hoursWorked`）：\n\n```cpp\n((workerType == \"hourly\") && (hoursWorked\
    \ > 40))\n```\n\n请注意，两个表达式必须分别用括号括起来，并且整个组合也要用括号括起来。\n\n如果所有关系表达式都为真，`&&` 逻辑表达式返回\
    \ true；如果其中任何一个或两个关系表达式为假，则返回 false。我们可以用真值表总结这种行为：\n\n| 关系表达式 1 | 关系表达式 2 | 结果\
    \ |\n|---|---|---|\n| 真 | 真 | 真 |\n| 真 | 假 | 假 |\n| 假 | 真 | 假 |\n| 假 | 假 | 假 |\n\
    \n下面是一个 `||` 逻辑表达式的示例：\n\n```cpp\n((hoursWorked < 41) || (workerType == \"salary\"\
    ))\n```\n\n在 `||` 逻辑表达式中，如果任一关系表达式为真，则表达式为真；仅当两个关系表达式都为假时，表达式才为假。以下是 `||` 表达式的真值表：\n\
    \n| 关系表达式 1 | 关系表达式 2 | 结果 |\n|---|---|---|\n| 真 | 真 | 真 |\n| 真 | 假 | 真 |\n| 假\
    \ | 真 | 真 |\n| 假 | 假 | 假 |\n\n最后一个逻辑运算符是 `!`（非）运算符。该运算符是单目运算符，对布尔表达式的值取反。例如：\n\
    \n```cpp\n! (2 == 2) // false\n! (3 < 2) // true\n```\n\n在本书中，我们不会经常使用 `!` 运算符。事实上，我们只会在处理文本文件时使用它，你将在本书后面看到。\n\
    \n## 使用 *if* 语句做出决策\n\n在解决涉及决策的编程问题时，仅使用关系表达式和逻辑表达式是不够的；必须有某种方式根据关系和/或逻辑表达式的结果来控制哪些语句被执行。C++\
    \ 中用于做出决策的一个工具是 *if* 语句。\n\n### *if-else* 语句\n\n*if* 语句最简单的形式是 *if-else* 语句。该语句用于根据条件（可以是关系表达式或逻辑表达式）的值执行一组语句或另一组语句。\n\
    \n*if-else* 语句的一般形式如下：\n\n```cpp\nif (condition)\n    statement1\nelse\n    statement2\n\
    ```\n\n*if-else* 语句的工作方式如下：如果条件为真，则执行 statement₁，否则执行 statement₂。让我们看一个 C++ 示例：\n\
    \n```cpp\nint hoursWorked;\ncout << \"Enter the number of hours worked: \";\n\
    cin >> hoursWorked;\n```\n\n```cpp\ndouble rate = 25.00;\ndouble pay;\nif (hoursWorked\
    \ > 40)\n    pay = (40 * rate) + ((hoursWorked - 40) * (rate\n        * 1.5));\n\
    else\n    pay = (hoursWorked * rate);\n```\n\n存储在 `pay` 中的值取决于用户为 `hoursWorked`\
    \ 变量输入的内容。如果用户输入的数值大于 40，则 `pay` 的值由条件正下方的语句设置。如果用户输入的工作小时数为 40 或更少，则 `pay` 的值由\
    \ `else` 下方的语句设置。\n\n你会注意到，在上面的示例中，如果条件为真，只执行一条语句；如果条件为假，也只执行一条语句。如果你使用花括号将多条语句放在一个块中，那么\
    \ if-else 语句的每种可能结果并不限于只执行一条语句。此版本 if-else 语句的一般形式如下：\n\n```cpp\nif (condition)\n\
    {\n    statement₁;\n    statement₂;\n    statementₙ;\n}\nelse\n{\n    statement₁;\n\
    \    statement₂;\n    statementₙ;\n}\n```\n\n使用这种 if-else 形式时，当条件为真时执行第一个语句块，当条件为假时执行第二个语句块。让我们看一个示例：\n\
    \n```cpp\nint grade, bonus;\nbool passFail;\ncout << \"Enter your grade: \";\n\
    cin >> grade;\nif (grade >= 70)\n{\n    passFail = true;\n    bonus += 5;\n}\n\
    else\n    passFail = false;\n```\n\n在上面的示例中，及格分数（70 分或以上）会将布尔变量设置为 true，并给予 5\
    \ 分奖励。不及格分数只会将布尔变量设置为 false。\n\n为了节省一点空间，你经常会看到 if-else 语句中的语句块将左花括号与条件写在同一行，例如：\n\
    \n```cpp\nif (grade >= 70) {\n    passFail = true;\n    bonus += 5;\n}\n```\n\n\
    这样开始一个语句块是一种风格约定，你可以根据需要遵循，但无论选择哪种风格，你都应该保持一致，并始终使用相同的风格。\n\nif 语句可以放在另一个 if 语句内部。这称为嵌套\
    \ if 语句。下面是一个示例：\n\n```cpp\nint num1, num2, num3;\ncout << \"Enter three numbers:\
    \ \";\ncin >> num1 >> num2 >> num3;\nif (num1 > num2)\n    if (num1 > num3)\n\
    \        cout << \"The largest number is \" << num1\n             << endl;\n```\n\
    \n如果第一个条件为真，则执行嵌套在第一个 if 语句内部的第二个 if 语句。\n\n当你想要将 else 语句与嵌套的 if 语句一起使用时，else\
    \ 语句总是与最近的 if 语句配对。例如：\n\n```cpp\nif (guess != number)\n    if (guess < number)\n\
    \        high = guess - 1;\n    else\n        high = guess + 1;\n```\n\n如果你希望\
    \ else 与第一个 if 语句结合，可以在嵌套的 if 语句周围使用花括号，如下所示：\n\n```cpp\nif (guess != number)\
    \ {\n    if (guess < number)\n        low = guess + 1;\n    else\n        high\
    \ = guess + 1;\n}\nelse\n    if (guess > number)\n        high = guess - 1;\n\
    ```\n\n在编写嵌套 if 语句时，缩进有助于表明你的意图，但使用花括号将确保编译器按照程序员预期的方式执行代码。\n\n### if-else if\
    \ 语句\n\n你会如何使用 if 语句为数字考试成绩分配相应的字母等级？一种方法是编写一系列独立的 if 语句，如下所示：\n\n```cpp\nint\
    \ numGrade;\n\nstring letterGrade;\n\ncout << \"Enter the numerical score: \"\
    ;\n\ncin >> numGrade;\n\nif (numGrade >= 90)\n    letterGrade = \"A\";\n\nif (numGrade\
    \ >= 80)\n    letterGrade = \"B\";\n\nif (numGrade >= 70)\n    letterGrade = \"\
    C\";\n\nif (numGrade >= 60)\n    letterGrade = \"D\";\n\nif (numGrade < 60)\n\
    \    letterGrade = \"F\";\n```\n\n该程序解决了问题，但造成了不必要的计算。如果用户输入数字 86，程序会将 `letterGrade`\
    \ 赋值为 `\"B\"`，但随后会继续向下测试每个剩余 if 语句中的 `numGrade`。我们更希望发生的情况是，一旦程序将字母等级赋值给变量，程序就不应该再对\
    \ `numGrade` 执行任何测试，而是继续执行下一个任务。\n\n这个问题的解决方案是使用 if 语句的另一种变体——if-else if 语句。if-else\
    \ if 语句的一般形式如下：\n\n```cpp\nif (condition)\n    statement;\nelse if (condition)\n\
    ```\n"
