  md: '# 8.- Description of the part of the program


    . Comments


    We can put comments to indicate the name of the program, its operation, what entrances
    and exits will have, etc.


    ```

    /* firstprogram.c */

    ```


    . Preprocessing


    ```

    #include "pch.h"

    #include <iostream>

    ```


    These lines tell the compiler where to find the definition of functions not defined
    in this module.


    Pch.h is the so-called precompiled header and is a precompiled version of the
    external definitions and is used to make the compilation process faster.


    . Function main


    ```

    int main ()

    ```


    Every program in C must include the main function that is the entry point for
    our program.


    . Keywords


    Our C program will contain a series of reserved keywords of the language that
    can not be used as names of other variables or functions.


    . External functions printf and arguments


    The printf function is an external function defined in the iostream module and
    added'
