- pgno: 13
  md: '# 5.- Interpreted and compiled languages


    Any program written on a computer must be translated into the machine language.


    The machine language is a language that depends on the type of CPU and the manufacturer
    and there are numerous versions.


    As the machine language is very complicated and variable depending on the platform
    there are some languages (more similar to English) that indicate the sequence
    of steps to follow (program). These languages are called source code languages
    and are those used to define the programs of a computer.


    Once code in source language, we must pass it through a translator that translates
    it into machine language, which is what the computer really knows.


    There are three types of translations depending on how the machine language is
    generated from the source code.


    # Interpreted languages


    The translator reads the source program line by line, translates it and the computer
    executes it.


    With this option the development of a program is faster at the time of writing
    but has the disadvantage that more errors occur and these are more difficult to
    correct.


    Examples of these types of languages are JavaScript or PHP.


    # Compiled languages


    After editing the program, this is translated in its entirety (compilation).


    At this moment, the syntactic errors that can occur due to the structure of the'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'program are shown to the operator.


    With this option, the development slows down because each time the program is
    changed, it must be compiled, while the treatment of errors is simpler and easier
    to debug.


    Compiled language examples are C, C ++


    # Mixed languages


    These are languages that are compiled into an intermediate language and then interpreted
    into machine language.


    They have the same advantages as the compiled languages but are more portable
    and can be run on machines with different operating systems.


    Examples C # or Java'
