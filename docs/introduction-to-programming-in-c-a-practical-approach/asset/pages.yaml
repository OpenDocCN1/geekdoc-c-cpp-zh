- pgno: 30
  md: '# 17.- Logical comparisons


    In our programs we will have to make decisions about choosing between several
    options, decide which code to execute depending on a comparison between values.


    For this the C language provides us with several sentences to choose the execution
    of some instructions or others depending on evaluations .


    # The if statement


    Used to evaluate expressions and if it is true to execute the next block of instructions.


    E.g.\nSuppose we have to write on the screen if your age is less than or greater
    than 20.


    ```

    int age\n\nage = 26;\nif (age <20)\n    printf ("age less than 20 ...");\n\nif
    (age >= 20)\n    printf ("older age 20 ...");

    ```


    # The if - else statement


    Same as the if statement but if the expression to evaluate is missing, the elseblock
    is executed


    Eg.\n\nAnother way to code the previous example is with the if-else statement'
  merge: -1
  img_proc: true
