  md: "A function can be defined in the form\n\n# Return name (parameters)\n\n**Return**\
    \ is the value that will return the function and can be a data type (int, float\
    \ ...) or **void** that is used to indicate that no value returns.\n\n**Name**\
    \ is the identifier of the function\n\n**Parameters** is a separate list with\
    \ commas of variables that we will pass to the function.\n\nEg.\nfloat CalculateVat\
    \ (float price, float vat)\n\n# Parameter by value\n\nThe most common way to pass\
    \ parameters to a function is to pass them by value.\n\nConstants or variables\
    \ are passed that will not change value in the execution of the function.\n\n\
    ```\nfloat CalculateVAT (float price, float vat)\n{\n    return price * vat/100;\n\
    }\n\nint main()\n{\n    float vat;\n\n    vat = CalculateVAT(1000, 21);\n}\n```\n\
    \n# Parameters by reference\n\nIf we want a parameter of a function to be modified\
    \ within the function and return the modified value, the parameter can be used\
    \ by reference."
