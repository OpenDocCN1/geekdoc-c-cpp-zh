- pgno: 16
  md: '# Phase 2. Editing the program


    Once we know what to do, we have to think about how to translate that functionality
    into our chosen programming language, in this case C.


    Then we will write our program in C in the editor of VIusual Studio.


    You can edit the program with simple text editors such as Notepad but integrated
    environments have multiple advantages such as indentation (which allows us to
    better visualize our program) or associate colors to different functionalities
    (to see at a glance the key words, types of data, etc)


    # Phase 3. Compilation


    Once the program has been edited, we compile it and see if syntactic errors occur.


    Syntactic errors occur because the compiler does not understand some line that
    we have introduced in the source language.


    The compiler is responsible for translating the source code in C in machine language.


    # Phase 4. Linking


    If our project consists of several files or modules, in the linking process, external
    references are grouped and resolved.


    If our program uses external functionalities of the compiler or the operating
    system at this time, references to external sources are added.


    After the linking process, an executable file (.exe in Windows) is produced.


    # Phase 5. Execution'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'In this phase we can execute the executable program and see if the results
    match what we expected.


    If we detect any error we must return to the edition and make the necessary changes.


    In this phase, runtime errors may occur due to the fact that some variable takes
    a value outside its limits or errors in the logic of the program.


    # Phase 6. Debugging


    In case of errors in runtime or the expected functionality is not done correctly,
    we can debug the program in our programming environment.


    Some useful tools are


    +   . the option to execute the program step by step

    +   . tell the program to stop the execution in a line of the given code.

    +   . display of the value of the variables in real time.


    # Phase 7. Testing and maintenance


    The program must be tested in all possible cases, in case of detecting failures
    we must go again to the editing phase


    Once the program is working correctly it goes to the Exploitation phase where
    it is executed in its real environment (pej on the client''s computer that requested
    the program)


    Then the program enters its maintenance phase, where the client will ask us for
    new features or modify the program because some functionality is not to his liking.'
  merge: -1
  img_proc: true
