  md: "# 22.- Arrays\n\nAn array is a fixed number of elements of the same type.\n\
    \nEg.\nInstead of defining 10 variables of the same type, an array of 10 numbers\
    \ can be used.\n\nWe can define 5 numbers with\nint n1, n2, n3, n4, n5;\n\nor\
    \ with an array\nint n [5];\n\nin this case the array dimension is 5 elements\
    \ and we can access from position 0 to 4 with n [0], n [1], n [2], n [3] and n\
    \ [4]\n\n# Example\n\nMake the arithmetic mean of the numbers from 100 to 200\n\
