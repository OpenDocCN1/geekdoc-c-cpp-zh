  mdcn: "\n\n# C语言编程入门\n\n![](img/e9a40527283d17f2243dedbe472072cc_0_0.png)\n\n实用方法\n\
    \n恩里克·维森特\n\n# 编程入门\nC语言编程\n\n![](img/e9a40527283d17f2243dedbe472072cc_1_0.png)\n\
    \n实用方法\n\n# C语言编程入门。\n\n# 实用方法。\n\n# 恩里克·维森特\n\n# 目录\n\n- C语言编程入门。实用方法。\n- 1.-\
    \ 介绍\n- 2.- C语言\n- 4.- 你的第一个C程序\n- 6.- 程序编写阶段。Hello World\n- 8.- 程序部分的说明\n- 9.-\
    \ 练习\n- 10.- 变量和变量类型\n- 11.- 基本概念……内存、位和字节\n- 12.- 变量。整数和实数\n- 13.- 数学运算\n- 14.-\
    \ 类型转换\n- 15.- 示例。含增值税的价格计算\n- 16.- 做出决策\n- 17.- 逻辑比较\n- 18.- 关系运算符和逻辑运算符\n- 19.-\
    \ 选择选项\n- 20.- 示例：基本计算器\n- 21.- 高级主题。循环\n- 22.- 数组\n- 23.- 文本字符串\n- 24.- 学生练习\n\
    - 25.- 变量和指针\n- 26.- 动态内存\n- 27.- 结构化编程\n- 28.- 数据结构\n- 关于作者\n\n## 1.- 介绍\n\n\
    你好，我是恩里克·维森特，我将向你介绍课程“**编程入门。实用方法**”。\n\n本课程面向那些想要进入令人兴奋的编程世界的计算机爱好者。\n\n不建议具有高知识水平的计算机科学家学习本课程，因为所讲解的概念属于入门级。\n\
    \n课程结束时，学生将了解如何学习使用 C 这样的语言编程，C 是一种通用且可移植的语言，将来有助于他们使用 C++、C# 或 Java 等其他语言编程。\n\
    \n他们还将掌握必要概念，以理解什么是计算机程序、开发程序时可能遇到哪些困难以及如何解决这些困难。\n\n本课程基于示例和练习，我们将一步一步地引导你进入编程世界。\n\
    \n### 示例和练习\n\n感兴趣的学生可以获取课程示例和额外练习，还可以使用代码 lq5hhp 注册加入 Google Classroom 课堂 https://classroom.google.com/。\n\
    \n注册后，我们可以继续学习更高级的主题，并就课程中涉及的主题提出问题或咨询。\n\n如果完成课程的学生能写下评论，给出他们的意见和对课程的评价，我将不胜感激。\n\
    \n**你可以通过博客关注我们** [https://evginformatica.blogspot.com](https://evginformatica.blogspot.com)，在那里你将找到免费课程、教程以及即将推出的\
    \ Udemy 课程折扣。\n\n## 2.- C语言\n\nC 是开始进入编程世界的理想语言。\n\n它是一种紧凑且非常可移植的语言，因为当今许多平台（Windows、Linux、Mac……）都有\
    \ C 编译器。C语言广泛应用于商业世界中实际程序的编程，是开始职业生涯的良好起点。\n\n一旦学会了这种语言，它就可以作为学习其他语言（如 C++、C#\
    \ 或 Java）的基础，这些语言具有面向对象的哲学。\n\n## 3.- 下载和安装开发环境\n\n在简要介绍之后，我们将介绍整个课程中使用的编程环境。\n\
    \n我们需要从互联网下载工具 **Microsoft Visual Studio Community 2017**。\n\n我们在 Google 中搜索 Visual\
    \ Studio 2017 并下载 Community 版本。\n\n这个开发环境有几个版本：免费版、专业版和企业版。\n\n差异在于其用途。\n\n如果我们打算开始编程，可以使用\
    \ Community 版本；如果我们打算在工作中使用该工具，则建议使用专业版，因为它提供更多组件和工作工具。\n\n企业版主要用于团队工作，并允许多个程序员之间共享代码。\n\
    \nVisual Studio 是一个基于项目的开发工具，项目可以使用不同的语言。\n\n为了能够执行我们的示例，我们将安装适用于控制台的 C/C++ 包。\n\
    \n安装 Visual Studio 后，我们必须创建一个名为 courseC 的“Windows 控制台应用程序”项目，放在 c:\\ 文件夹中。\n\n\
    开发环境提供了许多选项：创建项目、编译、调试、执行……我们将在整个课程中看到所有这些。\n\n注意：\n如果你使用 Windows 以外的操作系统，可以尝试在\
    \ https://repl.it 上运行示例，你可以在那里用多种语言进行测试，包括 C 语言。\n\n## 4.- 你的第一个C程序\n\n在本节中，我们将讨论机器语言、源语言以及如何在两者之间进行转换等概念。\n\
    \n我们将学习制作计算机程序必须遵循的不同阶段，然后我们将制作第一个程序。\n\n## 5.- 解释型语言和编译型语言\n\n计算机上编写的任何程序都必须翻译成机器语言。\n\
    \n机器语言是一种依赖于 CPU 类型和制造商的语言，并且有许多版本。\n\n由于机器语言非常复杂且随平台变化，因此有一些（更类似于英语的）语言，用于指示要遵循的步骤序列（程序）。这些语言被称为源代码语言，用于定义计算机程序。\n\
    \n一旦代码以源语言形式存在，我们必须通过翻译器将其翻译成机器语言，这才是计算机真正理解的语言。\n\n根据从源代码生成机器语言的方式，有三种类型的翻译。\n\
    \n### 解释型语言\n\n翻译器逐行读取源程序，进行翻译，然后由计算机执行。\n\n使用这种方式，程序在编写时开发速度更快，但缺点是更容易出错，而且这些错误更难纠正。\n\
    \n这类语言的示例有 JavaScript 或 PHP。\n\n### 编译型语言\n\n编辑程序后，将其整体翻译（编译）。\n\n此时，由于程序结构可能产生的语法错误会显示给操作者。\n\
    \n使用这种方式，开发速度会减慢，因为每次修改程序后都必须编译，但错误处理更简单，更容易调试。\n\n编译型语言的示例有 C、C++。\n\n### 混合型语言\n\
    \n这些语言先被编译成中间语言，然后再解释成机器语言。\n\n它们具有编译型语言的相同优点，但更可移植，可以在不同操作系统的机器上运行。\n\n示例：C#\
    \ 或 Java。\n\n## 6.- 程序编写阶段。Hello World\n\n现在我们将用 C 语言编写第一个程序。\n\n打开 VisualStudio，转到“文件\
    \ - 打开项目 - courseC”。\n\n复制以下代码片段：\n\n```\n/* firstprogram.c */\n\n#include \"\
    pch.h\"\n#include <stdio.h>\n\nint main ()\n{\n    printf (\"Hello world! \\n\"\
    );\n}\n```\n\n执行该程序，我们将看到一个显示文本 Hello World ... 的屏幕。\n\n我们将遵循的编写程序阶段如下：\n\n###\
    \ 阶段1：定义要解决的问题并编写算法（要遵循的步骤）\n\n在这个阶段，我们必须明确定义我们想要程序做什么，它将接收哪些输入，以及将产生哪些输出。\n\n\
    我们还必须用自然语言（西班牙语、英语……）说明程序应遵循哪些步骤来实现既定目标。\n\n这些要遵循的步骤就是我们所说的程序算法。\n\n"
