    \n### The `while` loop\n\nUsed to repeat an action while a condition is met (example\
    \ `loopwhile.c`).\n\nE.g., display the numbers from 1 to 10:\n\n```c\n/* loopwhile\
    \ */\n\n#include <stdio.h>\n\nint main(void)\n{\n    int i;\n\n    i = 1;\n  \
    \  while (i <= 10)\n    {\n        printf(\"\\nNumber%d\", i);\n        i = i\
    \ + 1;\n    }\n\n    return 0;\n}\n```\n\nThe `while` loop is similar to the `for`\
    \ loop but is usually used when the condition does not depend on a counter but\
    \ on an expression that is recalculated within the loop.\n\n## 22.- Arrays\n\n\
    An array is a fixed number of elements of the same type.\n\nE.g., instead of defining\
