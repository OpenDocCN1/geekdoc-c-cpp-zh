    \        printf(\"\\n\\nOperation not allowed ... \\n\");\n            break;\n\
    \    }\n\n    return 0;\n}\n```\n\n## 21.- Advanced topics. Loops\n\nIn this section\
    \ we will see how to implement repetitions in our code.\n\nWe will define what\
    \ arrays are and finally we will treat text strings.\n\n### Loops\n\nSometimes\
    \ we are faced with the situation of having to repeat an action a number of times\
    \ or until a condition is met.\n\nIn C the repetition of a series of actions is\
    \ called a loop and can be of several types.\n\n### The `for` loop\n\nIt is used\
    \ to repeat an action a number of times (example `loopfor.c`).\n\nE.g., show on\
