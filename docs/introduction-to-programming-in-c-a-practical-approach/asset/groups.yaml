    # 6.1.2 立方根


    知识点一 立方根的概念及性质


    一般地，如果一个数的立方等于$a$，那么这个数叫做$a$的立方根或三次方根。


    即：如果$x^3=a$，那么$x$叫做$a$的立方根。


    求一个数的立方根的运算，叫做开立方。


    开立方与立方互为逆运算。


    | 数的名称 | 正数 | 负数 | 0 |

    | --- | --- | --- | --- |

    | 平方根 | 有两个互为相反数 | 没有平方根 | 0 |

    | 立方根 | 有一个，是正数 | 有一个，是负数 | 0 |


    说明：任何数都有立方根，且只有一个立方根。


    知识点二 立方根的表示方法


    一个数$a$的立方根，用符号“$\sqrt[3]{a}$”表示，读作“三次根号$a$”，其中$a$是被开方数，3是根指数。'
