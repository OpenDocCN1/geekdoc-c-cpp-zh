    I am 20 years old.\");\n    else\n    if (age == 30)\n        printf(\"I am 30\
    \ years old.\");\n    else\n    if (age == 40)\n        printf(\"I am 40 years\
    \ old.\");\n    else\n        printf(\"Age indeterminate ...\");\n\n    /* select\
    \ options with switch */\n    printf(\"\\nAge with switch ... \\n\");\n    switch\
    \ (age)\n    {\n        case 20:\n            printf(\"I am 20 years old.\");\n\
    \            break;\n        case 30:\n            printf(\"I am 30 years old.\"\
    );\n            break;\n        case 40:\n            printf(\"I am 40 years old.\"\
    );\n            break;\n        default:\n            printf(\"Indeterminate age\
    \ ....\");\n    }\n\n    return 0;\n}\n```\n\n## 20.- Example: Basic calculator\n\
    \n### Problem definition\n\nWrite a basic calculator.\nThe user will enter the\
    \ operation in the form `x op y`\nand the computer will show the result of the\
    \ operation.\n\nE.g. `10.2 + 5.5`, `20.8 - 2.5`.\n\n### Definition of the algorithm\n\
    \n- We must define two variables, `number1` and `number2`, and the operation to\
