    # 26.- Dynamic memory


    In C we can reserve memory dynamically at run time.


    In practice there are two types of memory: static memory managed by the compiler
    and dynamic memory managed by the programmer.


    When defining variables, the compiler assigns them the necessary space depending
    on the type of the variable.


    Depending on the scope where the variable is defined, the compiler allocates memory
    in the stack for local variables and function parameters.


    For global variables, the compiler allocates the memory of the variables in a
    separate data segment.


    The programmer can allocate memory dynamically at run time with the malloc function
    to which the number of bytes of the memory to be reserved is passed.


    The reserved memory is created in a data segment HEAP used only for dynamic memory.


    The malloc function returns a pointer to the reserved memory area.


    E.g.


    ```

    int *p = (int *) malloc (200);

    ```


    The malloc function reserves 200 bytes of memory and returns an untyped pointer
    to the reserved zone.


    An explicit casting is done to indicate that there are integers in the memory
    area.


    The pointer p points to the reserved area with malloc.'
  - '[PAGE 50]


    The dynamic allocation of memory will allow us to manage quantities of data at
    the moment the program is executed and not at the moment of compilation.


    In the previous example, if the size of an integer is 2 bytes, memory will be
    reserved for 100 integers.


    The previous case can also be defined in the form


    ```

    int *p = (int *) malloc (100 * sizeof (int));

    ```


    It should be noted that the memory reserved with malloc is controlled by the programmer,
    not the compiler, and it is he who must release it when he does not use it.


    The free function must be used to free the dynamically allocated memory.


    E.g.


    ```

    free (p);

    ```'
