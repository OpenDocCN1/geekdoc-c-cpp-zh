    \ `strlen(cad);`\n- Compare strings.\n"
  mdcn: "\n\n## 17.- 逻辑比较\n\n在我们的程序中，我们需要对在几个选项之间进行选择做出决策，根据值之间的比较决定执行哪段代码。\n\n为此，C\
