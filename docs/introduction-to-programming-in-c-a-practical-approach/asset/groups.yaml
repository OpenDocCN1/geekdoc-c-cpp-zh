    \ of the operation and display it on the screen.\n\n```c\n/* calculator */\n\n\
    #include \"pch.h\"\n#include <stdio.h>\n\nint main(void)\n{\n    // operands\n\
    \    float number1 = 0.0;\n    float number2 = 0.0;\n\n    /* operation +, -,\
    \ *, / */\n    char operation = 0;\n\n    printf(\"\\nEnter the operation ...\
    \ \\n\");\n    scanf_s(\"%f\", &number1);\n    scanf_s(\"%c\", &operation, 1);\n\
