  mdcn: "\n\n## Phase 2. 编辑程序\n\n一旦我们知道要做什么，就必须思考如何将该功能翻译成我们选择的编程语言，在本例中为 C。\n\n然后我们将在\
    \ Visual Studio 的编辑器中用 C 编写程序。\n\n你可以用简单的文本编辑器如记事本编辑程序，但集成环境具有多重优势，例如缩进（让我们能更好地可视化程序）或为不同功能关联颜色（以便一目了然地看到关键字、数据类型等）\n\
    \n## Phase 3. 编译\n\n程序编辑完成后，我们对其进行编译并查看是否出现语法错误。\n\n语法错误发生是因为编译器无法理解我们在源语言中引入的某行代码。\n\
    \n编译器负责将 C 源代码翻译成机器语言。\n\n## Phase 4. 链接\n\n如果我们的项目由多个文件或模块组成，在链接过程中，外部引用会被分组并解析。\n\
    \n如果我们的程序此时使用了编译器或操作系统的外部功能，则会添加对外部源的引用。\n\n链接过程完成后，会生成一个可执行文件（Windows 下为 .exe）。\n\
    \n## Phase 5. 执行\n\n在此阶段我们可以执行可执行程序并查看结果是否符合预期。\n\n如果我们检测到任何错误，必须返回编辑阶段并做出必要的更改。\n\
    \n在此阶段，可能出现运行时错误，因为某些变量取值超出其限制或程序逻辑存在错误。\n\n## Phase 6. 调试\n\n如果运行时出现错误或预期功能未正确实现，我们可以在编程环境中调试程序。\n\
    \n一些有用的工具是\n\n- 逐步执行程序的选项\n- 告诉程序在给定代码的行处停止执行。\n- 实时显示变量的值。\n\n## Phase 7. 测试和维护\n\
    \n程序必须在所有可能的情况下进行测试，如果发现故障，我们必须再次回到编辑阶段\n\n一旦程序正确运行，它就进入 Exploitation 阶段，在其真实环境中执行（例如在请求程序的客户计算机上）\n\
    \n然后程序进入其维护阶段，客户会要求我们添加新功能或修改程序，因为某些功能不符合他的喜好。\n\n## 7.- 修改程序、注释和错误控制\n\n我们将修改第一个程序并查看其效果，编译、链接和执行。\n\
    \n我们可以用 /* */ 或 // 为程序添加注释\n\n注释中写的所有内容都将被编译器忽略。\n\n建议对程序进行注释，以便更好地跟踪和后续维护代码。\n\
    \n我们可以为第一个示例添加注释。\n\n现在我们去掉 printf 末尾的分号并编译。\n\n如果我们的程序在编译时有语法错误，IDE 会向我们显示，以便我们可以解决它们。\n\
    \n在所有错误得到解决之前，程序无法运行。\n\n## 8.- 程序部分的描述\n\n- 注释\n\n我们可以添加注释来指明程序的名称、其操作、将有哪些输入和输出等。\n\
    \n```\n/* firstprogram.c */\n```\n\n- 预处理\n\n```\n#include \"pch.h\"\n#include\
    \ <iostream>\n```\n\n这些行告诉编译器在何处查找未在此模块中定义的功能的定义。\n\nPch.h 是所谓的预编译头，是外部定义的预编译版本，用于使编译过程更快。\n\
    \n- 函数 main\n\n```\nint main ()\n```\n\n每个 C 程序都必须包含 main 函数，它是我们程序的入口点。\n\n-\
    \ 关键字\n\n我们的 C 程序将包含语言的一系列保留关键字，不能用作其他变量或函数的名称。\n\n- 外部函数 printf 和参数\n\nprintf\
    \ 函数是 iostream 模块中定义的外部函数并添加\n\n## 11.- 基本概念 .. 内存 位和字节\n\n程序及其使用的数据都存储在计算机的内存中。\n\
    \n计算机的内存是一系列用于存储 0 值或 1 值的“盒子”。这些“盒子”就是位，是计算机可以存储的最小信息单元。\n\n为了提高内存访问效率，这些位可以每\
    \ 8 个一组形成一个字节。\n\n计算机的内存以字节的倍数表示\n\n1 千字节（或 1KB）为 1,024 字节。\n1 兆字节（或 1MB）为 1,024\
    \ 千字节，即 1,048,576 字节。\n1 千兆字节（或 1GB）为 1,024 兆字节，即 1,073,741,824 字节\n\n## 12.-\
    \ 变量。 整数和实数\n\n### 变量\n\n变量是 1 个或多个字节的内存区域，与其关联一个名称，以便在程序中引用它。\n\n### 整数变量\n\n\
    是存储没有小数的整数的变量。\n变量的类型为 **int**\n\n整数例如为 -10、5、23000\n\n### 示例\n\n```\n/* using\
    \ integers */\n#include <stdio.h>\n\nint main (void)\n{\n    /* declare the variable\
    \ age as of integer type */\n    int age ;\n\n    /* assignment of an integer\
    \ value to the variable */\n    age = 35;\n\n    /* show age by screen */\n  \
    \  printf (\"My age is% d.\", age);\n    return 0;\n}\n```\n\n### 变量名\n\n我们可以给变量起的名字是数字和字母的组合。\n\
    \n变量不能以数字开头\n\n例如 Var1、age、name551nteger\n\n### 字符变量\n\n是存储字符的变量\n字符变量的类型为 **char**\n\
    \n例如\ncar = 'A';\n\n### 实数变量\n\n这些是可以存储带小数点的数字的变量。\n小数点用 . 表示（不是用 ,，如西班牙语）\n实数变量的类型为\
    \ **float**\n\n例如 2.9 34.89\n\n### 示例\n\n```\n/* using real */\n#include <stdio.h>\n\
    \nint main (void)\n{\n        /* declare variable as an integer value */\n   \
    \     float myvariable;\n\n        /* assignment of a real value to the variable\
    \ */\n        myvariable = 12.75;\n\n        /* display the variable by screen\
    \ */\n        printf (\"My variable is% f.\", myvariable);\n        return 0;\n\
    }\n```\n\n## 13.- 数学运算\n\n### 赋值\n\n要给变量赋值，我们可以使用\n\n```\nvariable = value;\n\
    ```\n\n### 运算 +, -, *, /\n\n例如\n\n```\nsum = var1 + var2;\nsubtraction = value\
    \ - 10;\nproduct = 20 * 22;\ndivision = 12.2/2.5;\n```\n\n## 14.- 类型转换\n\n###\
    \ 隐式转换\n\n如果算术表达式中存在实数，则会被转换为实数值\n\n例如\n```\nfloat vreal;\nint ventera;\n\nventera\
    \ = 5;\nvreal = ventera * 10.5;\n```\n\n### 显式转换\n\n有时为了代码清晰，我们可以强制从一种类型转换为另一种类型\n\
