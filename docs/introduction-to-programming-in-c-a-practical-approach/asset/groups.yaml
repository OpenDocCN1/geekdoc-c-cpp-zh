    \    printf(\"you are a teenager ...\");\n}\nif (!(age > 18))\n{\n    printf(\"\
    you are a minor ...\");\n}\n```\n\n## 19.- Selecting options\n\nIf we are considering\
    \ selecting an option of several possible, we can do it in two ways:\n\n- with\
    \ `if`-`else` blocks\n- with `switch`\n\nE.g., to show on screen if you are 20,\
    \ 30 or 40 years old.\n\n```c\n/* options */\n#include <stdio.h>\n\nint main(void)\n\
    {\n    /* declare variables */\n    int age;\n\n    /* assignment of an integer\
