    );\n}\n```\n\n## 19.- 选择选项\n\n如果我们考虑从多个可能选项中选择一个选项，我们可以以两种方式进行：\n\n- 使用 `if`-`else`\
    \ 块\n- 使用 `switch`\n\n例如，要在屏幕上显示你是否 20、30 或 40 岁。\n\n```c\n/* options */\n#include\
    \ <stdio.h>\n\nint main(void)\n{\n    /* declare variables */\n    int age;\n\n\
    \    /* assignment of an integer value to the variable */\n    age = 35;\n\n \
    \   /* select options with if-else */\n    printf(\"Age with if-else ... \\n\"\
    );\n    if (age == 20)\n        printf(\"I am 20 years old.\");\n    else\n  \
    \  if (age == 30)\n        printf(\"I am 30 years old.\");\n    else\n    if (age\
    \ == 40)\n        printf(\"I am 40 years old.\");\n    else\n        printf(\"\
    Age indeterminate ...\");\n\n    /* select options with switch */\n    printf(\"\
    \\nAge with switch ... \\n\");\n    switch (age)\n    {\n        case 20:\n  \
    \          printf(\"I am 20 years old.\");\n            break;\n        case 30:\n\
    \            printf(\"I am 30 years old.\");\n            break;\n        case\
    \ 40:\n            printf(\"I am 40 years old.\");\n            break;\n     \
    \   default:\n            printf(\"Indeterminate age ....\");\n    }\n\n    return\
    \ 0;\n}\n```\n\n## 20.- 示例：基础计算器\n\n### 问题定义\n\n编写一个基础计算器。\n用户将以 `x op y` 的形式输入运算\n\
    计算机将显示运算结果。\n\n例如 `10.2 + 5.5`，`20.8 - 2.5`。\n\n### 算法定义\n\n- 我们必须定义两个变量，`number1`\
    \ 和 `number2`，以及要执行的运算（`+`、`-`、`*`、 `/`）。\n- 用户将被要求以 `x op y` 格式输入数字和运算。\n- 程序将计算运算结果并在屏幕上显示。\n\
    \n```c\n/* calculator */\n\n#include \"pch.h\"\n#include <stdio.h>\n\nint main(void)\n\
    {\n    // operands\n    float number1 = 0.0;\n    float number2 = 0.0;\n\n   \
    \ /* operation +, -, *, / */\n    char operation = 0;\n\n    printf(\"\\nEnter\
    \ the operation ... \\n\");\n    scanf_s(\"%f\", &number1);\n    scanf_s(\"%c\"\
    , &operation, 1);\n    scanf_s(\"%f\", &number2);\n\n    /* calculate the result\
    \ */\n    switch (operation)\n    {\n        case '+':\n            printf(\"\
    Result: %f \\n\", number1 + number2);\n            break;\n\n        case '-':\n\
    \            printf(\"Result: %f \\n\", number1 - number2);\n            break;\n\
    \n        case '*':\n            printf(\"Result: %f \\n\", number1 * number2);\n\
    \            break;\n\n        case '/':\n            if (number2 == 0)\n    \
    \            printf(\"Division by zero. \\n\");\n            else\n          \
    \      printf(\"Result: %f \\n\", number1 / number2);\n            break;\n\n\
    \        default:\n            printf(\"\\n\\nOperation not allowed ... \\n\"\
    );\n            break;\n    }\n\n    return 0;\n}\n```\n\n## 21.- 高级主题。循环\n\n\
    在本节中，我们将了解如何在代码中实现重复。\n\n我们将定义什么是数组，最后我们将处理文本字符串。\n\n### 循环\n\n有时我们面临需要重复执行某项操作若干次或直到满足某个条件的情况。\n\
    \n在 C 中，一系列操作的重复称为循环，可以有多种类型。\n\n### `for` 循环\n\n用于重复执行某项操作若干次（示例 `loopfor.c`）。\n\
    \n例如，在屏幕上显示 1 到 10 的数字：\n\n```c\n/* loopfor */\n\n#include <stdio.h>\n\nint main(void)\n\
    {\n    int i;\n\n    for (i = 1; i <= 10; i = i + 1)\n    {\n        printf(\"\
    \\nNumber%d\", i);\n    }\n\n    return 0;\n}\n```\n\n`for` 循环将执行块内的句子 10 次。首先计数器\
    \ `i` 初始化为 1；如果条件 `i <= 10` 为真，则执行块并增加计数器；如果不为真，则跟随下一条指令。\n\n### `while` 循环\n\n\
    用于在满足条件时重复执行某项操作（示例 `loopwhile.c`）。\n\n例如，显示 1 到 10 的数字：\n\n```c\n/* loopwhile\
    \ */\n\n#include <stdio.h>\n\nint main(void)\n{\n    int i;\n\n    i = 1;\n  \
    \  while (i <= 10)\n    {\n        printf(\"\\nNumber%d\", i);\n        i = i\
    \ + 1;\n    }\n\n    return 0;\n}\n```\n\n`while` 循环与 `for` 循环类似，但通常在条件不依赖于计数器而依赖于在循环内重新计算的表达式时使用。\n\
    \n## 22.- 数组\n\n数组是相同类型的固定数量的元素。\n\n例如，而不是定义 10 个相同类型的变量，可以使用一个包含 10 个数字的数组。\n\
    \n我们可以用以下方式定义 5 个数字：\n\n```c\nint n1, n2, n3, n4, n5;\n```\n\n或用数组：\n\n```c\n\
    int n[5];\n```\n\n在这种情况下，数组维度为 5 个元素，我们可以从位置 0 到 4 访问，分别是 `n[0]`、`n[1]`、`n[2]`、`n[3]`\
    \ 和 `n[4]`。\n\n### 示例\n\n计算 100 到 200 的数字的算术平均值：\n\n```c\n/* arrays */\n/* calculate\
    \ the arithmetic mean of the numbers from 100 to 200 */\n\n#include <stdio.h>\n\
    \nint main(void)\n{\n    int i;\n    int numbers[200];\n    float sum;\n    float\
    \ mean;\n\n    /* fill array data */\n    for (i = 1; i <= 100; i = i + 1)\n \
    \   {\n        numbers[i] = 100 + i;\n    }\n\n    /* calculate the sum of all\
    \ the numbers */\n    sum = 0;\n    for (i = 1; i <= 100; i = i + 1)\n    {\n\
    \        sum = sum + numbers[i];\n    }\n\n    /* calculate arithmetic mean */\n\
    \    mean = sum / 100;\n\n    printf(\"\\nThe mean of the numbers from 100 to\
    \ 200 is: %f \\n\", mean);\n\n    return 0;\n}\n```\n\n首先我们定义要使用的变量。然后用 100 到\
    \ 200 的数字填充数组。在下一个循环中，对 100 到 200 的数字求和。计算平均值并在屏幕上显示。\n\n如果我们查看数组 `numbers` 的定义，我们会看到它的维度为\
    \ 200，而实际上只使用了 100 个。通常会将维度设得比实际使用的大，因为在 C 中不检查数组的限制，典型的错误是尝试使用超出范围的索引，这会导致不可预期的效果。\n\
    \n## 23.- 文本字符串\n\n字符串是一系列字符。\n\nC 中的文本字符串由字符数组表示。\n\n字符串字面量是双引号之间的字符序列。\n\n例如，`\"\
    this is a phrase.\"`\n\n### 字符串声明\n\n```c\nchar cad[20];\n```\n\n### 字符串初始化\n\n\
    ```c\nchar cad[] = \"this is a phrase\";\n```\n\n在这种情况下，数组 `cad` 的维度为 17，每个字母一个字符，最后一个字符为\
    \ 0 以指示字符串的结束。\n\n### 字符串操作\n\n有一个用于字符串处理的库：\n\n```c\n#include <string.h>\n```\n\
    \n- 连接两个字符串：`strcat(cad1, cad2);`\n  - 它将 `cad2` 复制到 `cad1` 的末尾。\n  - 注意 `cad1`\
    \ 的大小。\n- 字符串的字符数：`strlen(cad);`\n- 比较字符串。\n\n"
