    # 1.- Presentation


    Hello, I''m Enrique Vicente and I''m going to introduce you to the course "**Introduction
    to programming. A practical approach**".


    This course is aimed to computer enthusiasts who want to enter the exciting world
    of programming.


    This course is not recommended to computer scientists with a high level of knowledge
    because the concepts explained are introductory.


    Students at the end of the course will have a vision of how to learn to program
    in a language such as C, a versatile and portable language that will help them
    in the future to program in other languages such as C ++, C # or Java.


    They will also have the necessary concepts to understand what a computer program
    is and what difficulties they may encounter when developing a program and how
    to solve them.


    This course is based on examples and exercises that we will follow step by step
    to guide you in the world of programming.


    # Examples and exercises


    Students who are interested can obtain the course examples and additional exercises
    can sign up to the class Google Classroom https://classroom.google.com/ with the
    code lq5hhp


    Sign up and we can continue with more advanced topics, ask questions or consultations
    on the topics covered in the course.


    I would appreciate that the students who have finished the course to write a review
    giving their opinion and assessment of the course.'
  - '[PAGE 8]


    **You can follow us on the blog** [https://evginformatica.blogspot.com](https://evginformatica.blogspot.com)
    where you will find free courses, tutorials and discounts on upcoming Udemy courses.'
  - '[PAGE 9]


    # 2.- The C language


    C is the ideal language to begin in the world of programming.


    It is a compact and very portable language since there are C compilers for many
    of the platforms of nowadays (Windows, Linux, Mac ...) The C language is used
    on many areas of programming real applications in the business world and is a
    good start to start professionally.


    Once this language is learned, it can serve as a basis for learning other languages
    such as C ++, C # or Java with an object orientation philosophy.'
  - '[PAGE 10]


    # 3.- Downloading and installation of the development environment


    Once this short introduction is done, we will present the programming environment
    that we will use throughout the course.


    We will need to download from the internet the tool **Microsoft Visual Studio
    Community 2017**.


    We search in Google Visual Studio 2017 and download the Community version


    This development environment has several versions: one free, professional and
    business.


    The differences lie in the use that will be give.


    If we are going to start programming, we can do it with the Community version,
    if we are going to use the tool at work, the professional version is recommended
    since it provides more components and work tools.


    The business version is mainly for team work and allows code sharing among several
    programmers.


    Visual Studio is a development tool based on projects that can be in different
    languages.


    To be able to execute our examples we will install the C/C ++ package for console


    Once Visual Studio is installed, we must create project "Windows console application"
    called courseC in the folder c:\


    The development environment offer many options, create projects, compile debug
    execute, .. we will see all that throughout the course.'
