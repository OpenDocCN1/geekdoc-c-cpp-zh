  md: '# Simply Programming C# and Visual Basic . . .


    10773 There are several variables/objects you can define that

    10774 have this “sub-variable” or property capability. One

    10775 such variable is an array. The word properties is not

    10776 used with the Array control. Instead, the term

    10777 “element” is used.


    10778

    10779 Compared to defining and using classes and class

    10780 properties or structs, arrays are much less complicated

    10781 and easier to use. They are not as flexible as classes

    10782 and are limited, in most cases, having every

    10783 property defined as holding the same type of variable

    10784 i.e. strings or integers within a particular array. Arrays

    10785 are not directly visible to the user. Arrays

    10786 information storage devices.


    10787

    10788 Visualize an array as a bookshelf . . . Each sub-

    10789 variable or “Item(s)” or “elements,” as they are

    10790 termed, is a storage compartment. Think of them as

    10791 “Rows” if you like. Each Item (element) is given an

    10792 “Index” . . . 0, 1, 2, 3, 4 etc. I can “Add” Items

    10793 (elements) to each compartment (Row). I can “Add” a

    10794 string variable, for example, if I created the array as

    10795 “string” array or number, if I created an “Integer"

    10796 array. All values must be of the same variable type,

    10797 strings in this case. But, I can only add as many

    10798 “Items or elements” as I created “DIM” the array to

    10799 hold.


    10800

    10801 This code creates an array that holds five (5)

    10802 items(elements) . . . 0 to 4.


    # 10803

    10804 VB Array Code


    10805'
