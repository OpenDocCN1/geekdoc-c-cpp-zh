    9325


    9326 Tables are organized into groups of “Rows”


    9327 containing “Columns/Cells”, where the “values” are


    9328 stored.


    9329


    9330 Each “Row” contains one complete set of data


    9331 items(“Cells”) describing “ONE” item, a customer


    9332 in our case.


    9333


    9334 This is usually referred to as one “Record”.


    9335


    9336 There might be more detailed information about this


    9337 particular item in yet another “related” table. In this


    9338 exercise we will restrict our activities to one (1)


    9339 table . . . “Customers”.


    9340


    9341 A relationship is defined by using “Dot Notation”


    9342 i.e.


    9343


    9344 table1.Mfg -and- table2.Mfg” are variables that


    9345 contain the same information, BUT, in different


    9346 tables.


    9347


    9348 That is how a relationship is defined . . . literally


    9349 much like we use regular variables. Hence the term


    9350 you will see very often, “Relational Database”.


    9351


    9352 Usually in one database, multiple “tables” are


    9353 “related”. That means they have at least one data item


    9354 that contains the same information as the some of the


    9355 other tables.


