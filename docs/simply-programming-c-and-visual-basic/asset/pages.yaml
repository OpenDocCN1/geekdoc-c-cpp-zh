  md: 'When you’re ready we’ll move on.


    Some, in fact, most databases have multiple “tables”.nThey are *Related* but contain
    different sets of information. For example, we could build another table that
    has specific, detailed information needed on “only” some occasions, but "related"
    to a *specific* automobile.


    When I look into a detailed, related table, I have to know what automobile I’m
    interested in to make sense from the data.


    This means the detailed table must contain some of the information included in
    the first table i.e. Mfg and Model year etc. Or, a unique denifier like a VIN
    number. That unique identifier might be a Primary Key in the “Master Table” -or-
    Base Table, when it is used in the “Child or Related Table it is referred to as
    the Foreign Key”.


    For example I might want to look up the warranty information on a specific car.


    The info I choose from the first table for this purpose is called a *Primary Key*.
    When I include that same data in the second table it is called a “Foreign Key”.


    When the *two sets* of data items chosen are *equal in both tables* . . I have
    defined a “Relationship” for the two tables.'
