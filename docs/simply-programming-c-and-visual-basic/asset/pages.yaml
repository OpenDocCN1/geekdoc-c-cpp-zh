    2759 repeatedly, test for a condition that we specify and

    2760 stop when the condition is satisfied.


    2761

    2762 X is a control variable. It’s value increases by 1

    2763 (X++), in this case, each time the loop executes.

    2764 On every loop we check to see if X has reached a

    2765 certain limit we specify if(X==8){do something}.

    2766 When X reaches we ask the program

    2767 to “Break;” or end the loop and this event handler

    2768 returns the last value of X reached during the loop. X

    2769 is an integer, we convert it to a string, add

    2770 (concatenate) it with a liter string specified with

    2771 quotation marks and send the

    2772 entire string to the TextBox’s text property.


    2773

