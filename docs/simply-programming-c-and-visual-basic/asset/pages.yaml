    443 Another example is where the Word processor spreads

    444 (wraps) text over more than one visible line. The

    445 Microsoft Visual Studio (MVS) editor expects a

    446 special “Line Continuation” character when code is

    447 spread over more than one line. These differences and

    448 others can cause compiler errors!!!


