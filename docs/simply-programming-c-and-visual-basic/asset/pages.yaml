  md: '9357 This allows for “Normalized” data structuring.


    9358 “Normalized” means minimal duplication of data


    9359 in multiple tables and the data is accessed only


    9360 when needed by “relating” the tables when making


    9361 “queries” or reports.


    9362


    9363 Related, normalized database tables improve system


    9364 performance enormously. The required computer


    9365 processing time is kept as low as possible by


    9366 “only” the data needed for any given user


    9367 request (“Query”).


    9368


    9369 With very large commercial applications, this is a


    9370 major issue. Millions of requests per day are


    9371 processed. For example, stock market database users


    9372 make millions and millions of requests (queries) per


    9373 each minute or even per second. Auto parts companies


    9374 are another example and there are thousands more.


    9375


    9376 In the “Base” -or- “Master” table, at times the


    9377 terminology uses the words “Master” and “Slave”,


    9378 The related (relatable) information is called a


    9379 “Primary Key”.


    9380


    9381 A “Primary Key” is unique in each table per data item


    9382 (Record) and no other record can have the same


    9383 Primary Key.


    9384


    9385 But, variables in the related tables contain the same


    9386 information (although the variable “names” could be


    9387 different).


    9388'
