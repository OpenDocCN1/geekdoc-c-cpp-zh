  md: 'Run your program again. The text from the first textbox has been modified a
    little before putting a copy into the second textbox.


    If you have an error . . . you know the story. Review!!!!


    What we did was repeat the things we did before, but after copying the text into
    the second box we appended it to the end of a second string, then placed it into
    the second Box. You can also say that we “concatenated” the two strings.


    This is deceptively simple, but very powerful. You’ll use it a lot. When working
    with strings remember that spaces are characters too whether they are visible
    or not.


    Strings in commercial applications can be thousands of characters long. Strings
    are a very important part of the Microsoft.network architecture. There are many
    tools (methods) for working with strings. It is worthwhile for us to spend a little
    more effort and time on this and understand a few of them before going forward.


    For example . . . suppose for some reason we decide we want everything we do with
    should be in lower case letters. There is a tool (method) for that. Strings like
    controls are objects. As you know, Objects have properties and they also have
    “Methods”.'
