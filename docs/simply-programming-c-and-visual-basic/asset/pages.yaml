- img_proc: true
  md: '847 In days gone by . . . Programming used a Top-Down

    848 model, Code was written to do certain things one at a

    849 time and produce the expected results.


    851 Todays programming model is different . . . It is

    852 called “Event Driven Programming”. This means

    853 that the code written executes to a certain point,

    854 displays a screen or form of some sort and then waits

    855 for the user to do something. Usually this means

    856 typing in some information or clicking a button or

    857 touching an Icon on the screen.


    859 When the user does this . . . the program responds

    860 by deciding what “EVENT” took place and

    861 executing the block of coded instructions for that

    862 event. That particular block of code is called an event

    863 handler. We will soon see how that code looks and

    864 write some of our own code (Event Handler).


    866 All of the events we will deal with are pre-defined

    867 events. Our job will be to provide the instructions to

    868 be executed when the event occurs.

    869 A few examples of events are . . . Click, Double

    870 Click, Mouse Over, Mouse ButtonDown. Mouse

    871 ButtonUP, Selection Changed and so on.


    873 To write event handlers (Code), we need a place to

    874 store our code. That place is inside the files created

    875 automatically for us by MVS when we created our

    876 project. Let’s take a closer look.'
