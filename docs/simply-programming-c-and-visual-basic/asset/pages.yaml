  md: 'Naming things is an important issue. Use names that are truly descriptive of
    the job you are doing and the tools used in the project.


    Develop this habit now and it will pay large dividends as we go along. Re-naming
    items later is possible, but it is a headache you don''t need. Avoid being fast
    for the sake of immediate ease . . . it''s similar to packing moving boxes without
    labeling the boxes contents. Faster, but painful later. Sometimes I even include
    the page number where the code was discussed for reference.


    By now, you have noticed that we are going to click on a lot of menus and options
    as we go along. For simplicity and for less typing I will begin to use this format;<Menu>
