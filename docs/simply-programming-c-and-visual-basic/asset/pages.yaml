  md: '# Simply Programming C# and Visual Basic…


    When we''re done you will have a firm grasp of the fundamentals. You will be able
    to write your own programs that work and accomplish meaningful tasks and results.
    You won''t know all there is to know about programming or C# or Visual Basic.
    You never will. I won''t either.


    My objective is to equip you with enough knowledge to go on and learn as much
    advanced programming as you want after getting the fundamentals down. learned
    on my own . . . with a little help from time to time. So can you!!!!


    The art of programming is pretty straight-forward, but deceptively demanding.


    Take a task and break it down to the most minute level of detail possible then
    make one small step at time. Check your work, revise it until you are satisfied
    and it works correctly, every time. That''s programming.


    Pick a time when you can concentrate on this project and try to limit yourself
    to no more than 2 hours per session. Don''t do this when you are sleepy, very
    tired, angry or otherwise distracted.


    It''s ok to stop mid-way through a project and come back later. Your sub- conscious
    mind will solve many issues for you when you are away from the keyboard. Give
    it a chance.'
