    7145 Remember that we said “controls” are “objects"

    7146 The next step was that Objects can have collections

    7147 of other objects. Each “Child” object of the

    7148 “parent” object is a member of a collection, a list

    7149 of the child objects owned by the “parent” object.

    7150

    7151 Each child object is assigned an

    7152 “index”, a number defining it’s position within the

    7153 collection. The “INDEX” is the key to saving, re-

    7154 loading and manipulating the child objects and

    7155 their properties.

    7156


    7157 Read the preceeding 2 paragraphs several times

    7158 until it becomes clear to what the concept of

    7159 parent, child and index means.

    7160

    7161 Once you get that idea firmly within your grasp the

    7162 rest is easy, just more of what you’ve already learned.

    7163 You will see very soon that the visible text

    7164 information shown to a user is important to the user,

    7165 but not to our program’s code.

