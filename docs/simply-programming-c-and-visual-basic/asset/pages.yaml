  md: '# Simply Programming C# and Visual Basic ...


    ![](img/a3c83d8cba71ab82fe2f1c28dd8b56f5_280_0.png)


    # Screen 12


    Above is the SQL Management Studio screen with our query typed in and executed,
    with the resulting output. Two records met our “WHERE” “AND” criteria.


    Our C# commands (in our database access program) will pass the SQL statements
    to the SQL database in a string format, which is how C# is able to accept the
    statements as “NOT” being formatted as part of the normal C# program code.


    You can close MVS for a while if you like. We’ll use SQL Management Studio Express
