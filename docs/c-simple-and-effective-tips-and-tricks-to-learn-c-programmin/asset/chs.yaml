- "# C++：高效学习 C++ 编程的简单技巧与秘籍\n\n\n\n![](img/rsrc2Y3.jpg)\n\n\n\n# 引言\n本书的主要目的是尽可能地解释\
  \ C++ 的基本概念。然而，为了避免让读者被极其困难的概念困扰，本书仅介绍非常基础的概念。通过这种方式，本书旨在为读者提供良好的学习体验，并希望他们为中高级水平的学习建立坚实的基础。书的第一章将从语言本身的基础开始，重点介绍其特性，讨论面向对象编程等。在本章之后，读者将拥有学习函数、类、对象、变量、类型和转换等内容的背景知识。然而，建议读者放慢阅读速度，因为开头可能有些困难。通过学习起始章节中的基础概念，并在互联网上查找你不理解的术语，你很可能会成功。\n\
  \n# 第 1 章：C++ 基础\n在本章中，我们将介绍面向对象编程语言 C++ 的非常基础。了解一种编程语言的特性对于用户在编码时整合新信息非常重要。因此，我们只介绍非常重要且常用的\
  \ C++ 特性。此外，本章将介绍创建 C++ 程序所绝对必要的各种步骤。为了在概述这些步骤时避免显得单调，我们将使用结合了这些步骤中所突出信息的示例，允许读者回溯他们所学的内容。最后，本章的主要目标是让读者熟悉标准\
  \ C++ 程序的根本布局。在本章中，我们将讨论三个主要话题：\n\n1.  C++ 的基本特性。\n2.  面向对象编程讨论。\n3.  C++ 的翻译与创建。\n\
  \n\n\n\n\n## C++ 的基本特性\n\n需要理解，C++ 并不是一种纯关注面向对象编程的编程语言。C++ 衍生于“C”编程语言，是一种混合型语言。虽然\
  \ C++ 在某些方面与原始的“C”编程语言不同，但它仍然保留了“C”编程语言中存在的大部分功能。换句话说，C++ 语言也支持 `C` 编程语言的典型特性，例如：\n\
  \n* 可以通用通的模块化程序。\n* 高效的机器编程能力。\n* 用 C++ 编写的程序可以很容易移植到其他平台。\n\n正如 C++ 拥有 `C` 编程语言的所有重要特性一样，用\
  \ `C` 编程语言编写的大部分代码也可以在 C++ 源代码中复用。C++ 编程语言的另一个重要特性是它将 `C` 面向对象编程的概念强化到了自身之中。例如，下面列出了一些面向对象编程的概念：\n\
  \n* 数据抽象：在编程时创建类来定义对象。\n* 数据封装：获取对对象数据受控的访问路径。\n* 继承：创建派自其他类的类（类甚至可以派生自多个派生类）。\n\
  * 多态：使用一套指令集，使其在程序代码执行期间能够展现出不同类型的效果。\n\nC++ 语言具有 `C` 编程语言的面向对象特性以及来自其他编程语言的各种元素。例如，模板和异常处理等编程元素在高效实现程序方面提供了不可思议的功能。不仅如此，这些特定元素在为编程工作提供便利的同时，还确保了你对程序有更清晰的理解。\n\
  \n### 面向对象编程\n\n在本节中，我们将讨论并构建传统的过程化编程与面向对象编程之间的对比。\n\n### 传统的过程化编程\n\n传统过程化编程的核心概念基于将要处理的数据与相应的子程序和过程（也称为数据和函数）分离。这显著影响了程序处理数据的方法，例如：\n\
  \n* 程序员的首要任务是确保在数据使用之前，已用适当且合适的值对其进行初始化。此外，程序员还必须确保在需要时可以将数据和适当的值传递给函数。\n* 代表数据的函数是特定的。由于由于，如果数据的表示方式发生变化（例如，数据以记录的形式表示且该记录被延长），那么表示该数据的函数也必须进行相应的修改。\n\
  \n由于这些特性，限制了程序的生产力并阻碍了对低维护需求的支持。此外，上述传统过程化编程的特性使得程序更容易产生错误。\n\n### 面向对象编程\n\n在面向对象编程中，重点不再是强调数据和函数的元素，而是主要关注对象本身。换句话说，程序员关注程序中突出程序本身主要目的的元素。例如，在面向对象编程中，一个为处理和维护银行账户而创建的程序将包含数据对象，如利率、余额、贷方和贷方计算、转账等。用面向对象编程构建的程序将包含与程序中每个账户对应的对象。每个对象都代表了对程序账户管理基本功能至关重要的属性和能力。\n\
  \n在面向对象编程中，属性和能力分别对应数据和函数，然后这些元素在程序中组合在一起。这是通过使用 `classes` 实现的。基于面向对象编程的程序中的 `class`\
  \ 将通过直接定义对象的属性和能力来定义对象类型。对象之间还可以通过消息相互通信。通过这种方式，对象还可以激活另一个对象的能力，这在便于构建程序的同时还具有多重优势。\n\
  \n#### 面向对象编程的优势\n\n在软件开发方面，面向对象编程提供了若干优势，使其比传统的过程化编程更实用。由于传统的过程化编程缺乏某些方面，导致它不太被程序员使用。其中一些优势列在下方：\n\
  \n* 更不容易产生错误：根据相应数据定义的对象可以控制对该数据的访问尝试。换句话说，对象可以拒绝对其数据进行易错误的访问尝试。\n* 易于复用：已创建的对象能够自我维护。由于对象的这种特性，使得它们更容易作为构建块非常方便地用在其他程序中。\n\
  * 低维护需求：根据情况，对象能够修改其内部数据的表示方式，而不需要修改应用程序。这使得它比传统的过程化编程更具实用。\n\n## 翻译和创建 C++ 程序\n\
  \n开发一个 C++ 程序比你想象的要简单。在本节中，我们将讨论如何翻译一个 C++ 程序并创建一个简单的 C++ 程序。\n\n### 翻译 C++ 程序\n\
  \n接下来的图描述了 C++ 翻译的过程。\n![](img/rsrc2Y4.jpg)\n\n在翻译 C++ 程序时，三个主要步骤对于创建和翻译过程非常重要。这些步骤概述如下所示：\n\
  \n1. 使用文本编辑器将 C++ 程序的源代码保存到文本文件中。包含程序源代码的文件被称为源文件。对于短期项目，使用一个源文件是可以接受的。然而，对于大型编程项目，建议将程序的源代码存储在多个源文件中，以便方便地单独编辑和翻译。这种方法被称为模块化编程。\n\
  \n2. 使用 `compiler` 翻译程序。程序员向 `compiler` 输入包含他想要翻译的程序源代码的源文件。如果编译过程没有遇到任何错误，则输出将是一个包含机器码的对象文件。这种对象文件被称为模块。\n\
  \n3. 使用 `linker` 将不同的模块组合到对象文件中，以创建可执行文件。通过 `linker` 添加到对象文件的模块包含了预先编译好的程序函数，或者包含了来自标准库的函数。\n\
  \n\n\n\n创建源文件时，注意应用于源文件名的扩展名至关重要。通常，应用于源文件的扩展名类型取决于创建该源文件的编译器。最常用的文件扩展名是 `.cpp`\
  \ 和 `.cc`。\n\n在某些情况下，源文件在编译之前可能需要一个扩展名文件。这些文件被称为头文件（header files）。如果源文件有相应的头文件可用，那么在编译之前，必须将头文件的内容复制到源文件中。头文件包含了源文件的重要数据，例如定义类型、声明变量和函数。头文件可能有扩展名，也可能没有。如果它有扩展名，那么通常是\
  \ `.h` 文件扩展名。\n\n为了执行之前提到的步骤和任务，程序使用被称为“编译器”的软件。如今流行的编译器通常还会提供一个 IDE（集成开发环境），以便能够立即开始编程。\n\
  \n### 创建一个简单的 C++ 程序\n\n现在我们将创建一个标准且简单的 C++ 程序。之后，我们将讨论该程序中所使用的编码元素。\n\n以下是该 C++\
  \ 程序的代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n   \
  \ cout << \"Have a good day!\" << endl;\n    return 0;\n}\n```\n\n该程序的输出是一个文本：“Have\
  \ a good day!”。\n\n在我们深入理解该程序的核心元素之前，这里有一个展示了程序结构安排的视觉化表示，以建立基础理解。\n\n![](img/rsrc2Y5.jpg)\n\
  \n为了简单起见，我们可以说，一个基础 C++ 程序的主要部分是对象及其相应的“成员函数和全局函数”。这些对象和函数不属于任何类。除了完成其设计目的的任务外，函数还具有调用其他函数的能力。经验丰富的程序员可以选择自己创建一个函数，也可以使用\
  \ C++ 标准库中已提供的函数。对于初学者，建议只使用标准库中的预建函数，因为创建个性化的函数可能会导致代码出现难以解决的复杂性。然而，每个程序员都必须创建创建自己的全局函数\
  \ `main()`。该函数是程序代码的主要组件之一。\n\n上述演示的 C++ 程序包含了任何 C++ 程序中两个最关键的元素，即 `main()` 函数和输出字符串（作为程序输出显示的消息）。\n\
  \n如果你查看代码块的第一行，你会看到一个哈号符号‘#’。这告诉计算机该行代码是用于预处理步骤的。你可以将预处理器视为一个初步阶段，在此阶段尚未创建对象，代码为程序中后续指令做准备。例如，如果你想让预处理器将一个文件复制到源文件代码中定义的位置，你可以使用\
  \ `#` 符号来实现。这在下面也有演示：\n\n```cpp\n#include <filename>\n```\n\n通过这种方式，我们可以将头文件包含到源代码中。这样做，程序将能够访问头文件中的数据。在上述的\
  \ C++ 程序中，我们可以在第一行就看到名为 `iostream` 的头文件已通过这种方法包含在源代码中。该文件包含的数据对应于定义输入和输出流的约定。换句话说，程序中的信息被视为数据流。\n\
  \n程序中的第二行代码引用了一个名为 `std` 的命名空间（namespace），它包含了 C++ 中的预定义名称。要访问此命名空间的内容，我们在定义命名空间之前使用\
  \ `using` 关键字。\n\n程序本身的执行从执行由 `main()` 函数定义的指令开始。因此，每个 C++ 程序都需要有一个 `main()` 函数来执行一组指令。然而，尽管\
  \ `main()` 函数是一个全局函数，使其与其他函数不同，但使用该函数实现代码的结构与 C++ 中任何其他典型函数完全相同。\n\n在上述演示的 C++ 程序中，`main()`\
  \ 函数包含两个语句：\n\n1. `cout << \"Have a good day!\" << endl;`\n2. `return 0;`\n\n\n\n\
  \n第一条语句包含两个重要部分：`cout` 和 `endl`。`cout` 取自 C++ 标准命名空间，代表“控制台输出”。`cout` 被用于指定一个对象，该对象负责输出语句中定义的文本字符串。此外，`<<`\
  \ 符号代表程序中的数据流。这些符号告诉程序，字符串中的字符应该流向输出流。最后，`endl` 表示该语句已结束并生成一个换行符。\n\n第二条语句停止了 `main()`\
  \ 函数的执行，在这种情况下，就是程序本身的执行。这是通过返回一个值 `0` 实现的，`0` 是给调用程序的退出代码。在强调程序已成功终止时，始终建议使用退出代码\
  \ `0`。\n\n### 创建一个具有多个函数的 C++ 程序\n\n现在我们已经了解了基础 C++ 程序是如何运行的，以及哪些核心元素构成了一个简单的程序，让我们继续理解一个使用多个函数而非单个程序的。下面展示了这样一个\
  \ C++ 程序示例，请注意，该程序还包含注释，这些是程序员留下的笔记，详细说明了特定行代码的作用。注释写在两个反斜杠 `//` 之后，编译器不会将其视为可执行代码并忽略它。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nvoid line(), message(); //\
  \ Prototypes\nint main(){\n    cout << \"Hey! The program starts in main().\"<<\
  \ << endl;\n    line();\n    message();\n    line();\n    cout << \"At the end of\
  \ main().\" << endl;\n    return 0;\n}\nvoid line() { // To draw a line.\n    cout\
  \ << \"--------------------------------\" << endl;\n}\nvoid message() { // To display\
  \ a message.\n    cout << \"In function message().\" << endl;\n}\n```\n\n现在让我们运行这个程序并查看输出。\n\
  Hey! The program starts in main().\n--------------------------------\nIn function\
  \ message().\n--------------------------------\nAt the end of main().\n\n通过这个示例，我们可以更深入地理解\
  \ C++ 程序的结构。请注意，与之前显示的只有一个函数的简单程序不同，这个 C++ 程序具有多个函数。然而，C++ 并不限制用户按照定义的顺序来定义函数。换句话说，在编写\
  \ C++ 程序时，你可以按照选择的任何顺序定义函数。例如，你可以先定义 `message()` 函数，然后是 `line()` 函数，最后是 `main()`\
  \ 函数，或者按照你喜欢的其他顺序。\n\n然而，建议先定义 `main()` 函数。这是因为该函数本质上控制着程序的流程。为了理解这一点，我们需要看看 `main()`\
  \ 函数主要做了什么。它将尚未定义的函数调用到它们被使用的程序中。`main()` 函数通过向编译器提供函数原型来实现此点。函数原型包含了编译器帮助 `main()`\
  \ 函数完成其工作所需的所有必要信息。\n\n此外，如果你观察这个程序，会发现一些跟在 `//` 符号后面的句子。这些是字符串，程序将它们解释为注释。在处理涉及成千上万行代码的大项目时，注释是非常用的。通过使用注释，程序员本质上可以留下提醒，说明某行代码或整个代码块的作用，从而更容易进行调试，或让访问代码的其他用户理解其结构。此外，注释还让程序员在日后修改代码更加容易。因此，养成这种习惯的程序员通常可以在未来分担许多繁重的工作负载。\n\
  \n# 第 2 章：C++ 中使用的基本数据类型、常量和变量\n\n在任何编程语言中，熟悉通用的常量和变量都是非常重要的。在像 C++ 这样更面向对象的编程语言中，学习至少包含在\
  \ C++ 程序中的常用数据类型和对象的基础知识变得更加重要。因此，本章将重点介绍上述元素，旨在为读者提供未来理解和创建更复杂、更有效的 C++ 程序所需的所有基础知识。\n\
  \n## 基本数据类型\n\n在本节中，我们将讨论 C++ 程序中的“类型”指的是什么，并理解 C++ 编程语言中提供的各种基本数据类型。\n\n在编程中，我们必须考虑不同类型的数据，程序可以使用这些数据来执行任务或解决问题。此外，计算机的工作并不仅依靠单一的数据处理方法。为了利用计算机通过各种方法处理和保存数据的能力，我们需要知道处理的是什么类型的数据，或者弄清楚输入我们\
  \ C++ 程序的数据类型。\n\n通常，C++ 中有四类主要数据类型。这四类数据类型是：\n\n* 布尔值\n* 字符\n* 整数\n* 浮点值\n\n每种数据类型都需要采用不同的方法，以便计算机处理它们所携带的信息。这就是为什么识别程序中的数据类型非常重要。数据类型的目的详述如下：\n\
  \n* 数据的内部表示\n* 需要分配的内存值\n\n\n\n例如，让我们考虑一个想要存储为数据的整数。数字 `-1024` 只需要 2 字节或 4 字节的内存作为存储空间。换句话说，如果我们想存储这样的整数，我们需要分配\
  \ 2 或 4 字节。要访问这些数据，我们需要访问存储这些数据的内存部分，为了做到这一点，我们只需要读取对应的字节数即可。此外，我们访问此数据类型的程序还必须将内存中表示数据的字节序列解释为带有负号的整数。\n\
  \n这里是一张表示 C++ 原生识别的基本数据类型的图表。![](img/rsrc2Y6.jpg)这些是基本数据类型，作为向量（vectors）、指针和类等其他数据类型的基础。C++\
  \ 编译器对这些基本数据类型有原生支持。因此，这些数据类型通常被称为“内置类型”（built-in types）。现在我们开始逐一讨论每类数据类型。\n\n###\
  \ ‘bool’ 数据类型\n通过逻辑门（如与门或或门）进行逻辑比较或关联获得的值被称为布尔值（Boolean value），并称为 `bool` 数据类型。该值的特征是它可以处于逻辑状态之一：`true`（真）或\
  \ `false`（假）。这些逻辑表示的内部值为：“真”对应数值 1，“假”对应数值 0。\n\n### 字符数据类型\n字符数据类型用于保存字符代码。更具体地说，在编程中，每个字符代码由一个整数表示。例如，与字符代码“A”相关的整数是“65”。多年来，为了便于数字化，开发了许多字符集，但不同的字符集代表不同的字符。每当字符显示在计算机屏幕上时，处理器会翻译字符代码并显示相应的字符。\n\
  \n尽管编程中有许多字符集，但 C++ 语言并不限制用户使用特定的集合。然而，美国信息交换标准（更常用的 `ASCII` 代码）是首选。这是一个 7 位字符集，因此它具有\
  \ 32 个可打印字符。\n\n在 C++ 中，字符数据类型有两个主要容器：`char` 类型和 `wchar_t` 类型。这两个类型的主要区别在于它们分配字符代码的存储。`char`\
  \ 类型使用 8 位（或 1 字节）存储，适用于 ANSI 等扩展字符集。同时，`wchar_t` 类型使用 16 位（或 2 字节）存储来分配字符代码，使其适用于\
  \ Unicode 字符。这也是为什么 `wchar_t` 类型被称为“宽字符”（wide character）。\n\n### 整数数据类型\n有三种整数类型用于表示整数数据。这些类型根据它们可以表示的值范围而不同：\n\
  \n1. `int` 和 `unsigned int`\n2. `short` 和 `unsigned short`\n3. `long` 和 `unsigned\
  \ long`\n\n下表强调了每种整数数据类型的属性和规格（存储空间和支持范围）。\n\n| 类型 | 大小 | 数值范围 |\n| :--- | :---\
  \ | :--- |\n| Char | 1 字节 | -128 到 +127 或 0 到 255 |\n| Unsigned char | 1 字节 | 0\
  \ 到 255 |\n| Signed char | 1 字节 | -128 到 +127 |\n| Int | 2 字节或 4 字节 | -32768 到 +32767\
  \ 或 -2147483648 到 +2147483647 |\n| Unsigned int | 2 字节或 4 字节 | 0 到 65535 或 0 到 4294967295\
  \ |\n| Short | 2 字节 | -32768 到 +32767 |\n| Unsigned short | 2 字节 | 0 到 65535 |\n\
  | Long | 4 字节 | -2147483648 到 +2147483647 |\n| Unsigned long | 4 字节 | 0 到 4294967295\
  \ |\n\n`int` 类型像是一种自适应和自调整的整数类型。它适应于所使用的计算机寄存器。例如，如果在 16 位系统上使用 `int` 类型，那么它的规格与\
  \ `short` 类型相同。同样，如果在一个 32 位系统上使用 `int` 类型，那么它的规格与 `long` 类型相同。\n\n你可能还注意到一种不属于整数类型家族的数据类型。这是\
  \ `char` 类型，它属于字符数据类型。`char` 类型包含在此表中的之所以是因为 C++ 像评估普通整数一样评估字符代码。因此，程序员可以对存储在 `char`\
  \ 和 `wchar_t` 类型中的变量进行计算，就像对待存储在 `int` 类型中的变量一样。然而，重要的是，`char` 类型的存储容量只有一个字节。因此，取决于\
  \ C++ 编译器如何解释它（作为有符号或无符号），你可以使用的取值范围分别仅为 -128 到 +127 以及 0 到 255。相反，`wchar_t` 类型是扩展整数类型，而\
  \ `char` 类型是简单整数类型且通常定义为 `unsigned short`。\n\n现在让我们讨论整数类型中的有符号和无符号修饰符。有符号整数将最高位作为整数值符号的表示。相反，无符号整数不具有表示符号的最高位，因此无符号整数可以表示的值发生了变化。然而，有符号和无符号整数类型存储值所需的内存是相同的。通常，`char`\
  \ 类型被编译器解释为“有符号”，因此修饰符导致了三种整数类型：`char`、`signed char` 和 `unsigned char`。\n\n用户可以利用名为\
  \ `climits` 的头文件，它定义了整数常量，例如：\n\n* `CHAR_MIN`、`CHAR_MAX`、`INT_MIN`、`INT_MAX`\n\n\
  正如名称所示，这些常量代表对应整数类型的最小值和最大值。为了更好地理解整数类型，让我们在 C++ 程序中实现此头文件并输出 int 和 unsigned int\
  \ 的。\n\n```cpp\n#include <iostream>\n#include <climits> // Definition of INT_MIN,\
  \ ...\nusing namespace std;\nint main(){\n    cout << \"Range of types int and unsigned\
  \ int\"<< endl << endl;\n    cout << \"Type ​ ​ \\ ​ Minimum ​ ​ \\ ​ Maximum\"\
  << endl;\n    cout << \"-----------------------------\" << endl;\n    cout << \"\
  int              \" << INT_MIN << \"            \" << INT_MAX << endl;\n    cout\
  \ << \"unsigned int          \" << \"   0              \" << UINT_MAX << endl;\n\
  \    return 0;\n}\n```\n\n### 浮点数据类型\n浮点数据指的是那些带有小数点的小数部分的数字。与整数不同，浮点值需要根据预设的精度进行存储。这与数学上处理小数的方式一致，即低位会被忽略或舍入。根据预设的精度，有三种浮点类型，列举如下：\n\
  \n1. `float` : 对应简单精度预设\n2. `double` : 对应双精度预设\n3. `long double` : 对应高精度预设\n\n\n\
  \n现在让我们来讨论并澄清浮点数中的“精度”（Accuracy）这一概念。在数值表示中，一个值在小数点位后的数字越多，它的精度就越高。换句话说，高精度意味着浮点值在小数点位后有更多的数字。同样，低精度意味着浮点值在小数点位后的数字较少。例如，与浮点数\
  \ `22.123` 相比，浮点数 `22.123456` 具有更高的精度。\n\n现在我们必须理解程序员是如何利用这个“精度”概念的。当我们有一个精确到六位小数的数字时，只要它与原始数字相比至少在某一个小数位上不同，我们就可以将相同的值存储为独立的、可区分的数字。然而，如果我们试图在一个\
  \ 6 位精度的浮点类型中，将一个精确到五位小数的数字与另一个精确到四位小数的相同数字作为独立数字存储，这种约定并不总是成立。明确的是，无法保证 `22.12345`\
  \ 和 `22.1234` 这两个数字在精度提高到 6 位小数时会有不同的小数位。\n\n当你的程序对于表示由特定设备或系统严格支持的精度的浮点数至关重要时，建议首先参考名为\
  \ `cfloat` 的头文件中定义的值。\n\n结论，数据的数学表示主要由两种数据类型处理。根据该值的算术性质（整数或带有小数的数字），它可以存储在整数类型或浮点类型中。下面列出了所有相应的类型。\n\
  \n### 整数数据类型 (Integral Data Types)\n- `bool`\n- `char`, `signed char`, `unsigned\
  \ char`, `wchar_t`\n- `short`, `unsigned short`\n- `int`, `unsigned int`\n- `long`,\
  \ `unsigned long`\n\n### 浮点数据类型 (Floating-Point Data Types)\n- `float`\n- `double`\n\
  - `long double`\n\n电气电子工程师学会（也称为 IEEE）为计算机编程领域提供了一种用于表示浮点类型的通用格式。下表简要讨论了这种格式表示法。\n\
  \n| 类型 | 内存 | 取值范围 | 最小正值 | 十进制精度 |\n| :--- | :--- | :--- | :--- | :--- |\n| Float\
  \ | 4 字节 | –3.4E+38 | 1.2E—38 | 6 位 |\n| Double | 8 字节 | –1.7E+308 | 2.3E—308 |\
  \ 15 位 |\n| long double | 10 字节 | –1.1E+4932 | 3.4E—4932 | 19 位 |\n\n在接下来的章节中，我们将简要讨论\
  \ `sizeof` 运算符，并根据它们所表示对象的性质对数据类型进行分类。\n\n### ‘sizeof’ 运算符\n当我们需要确认存储某种类型对象所需的内存时，我们只需使用\
  \ `sizeof` 运算符来实现这一目的。例如，如果我们像下面使用该运算符：\n\n```\nsizeof (name of the object)\n```\n\
  程序将告诉我们存储该对象所需的内存。换句话说，` `sizeof`提供了对象的内存需求，而 `name` 参数定义了对象本身或其相应的类型。例如，通过向上述参数输入正确的数据，比如\
  \ `sizeof(int)`。如果你记得 `int` 类型本身会根据系统进行调整，那么你也能理解为什么 `sizeof` 运算符会根据系统给出不同的值（它可能是\
  \ 2 或 4）。同样，如果我们将此运算符用于浮点类型，即 `sizeof(float)`，那么我们将得到一个 4 的值，代表存储该对象所需的内存。\n\n###\
  \ 分类\n根据对象的性质，我们可以将三种基本数据类型中的两种（整数类型和浮点类型）分类为算术数据类型，因为可以使用算术运算符对这些类型的变量进行算术计算。\n\
  \n到目前为止，我们讨论了表示值的对象并对其进行了相应的分类。然而，还有一些不表示任何值的对象，例如函数。为了对此类表达式分类，我们只需通过 `void` 类型表示它们。换句话说，`void`\
  \ 类型包含了那些不表示任何值的表达式。因此，一个典型的函数调用可以用 `void` 类型表示。\n\n### 基本常量 (The Fundamental Constants)\n\
  常量也被称为“字面量（literal）”。在编程过程中我们一直都会处理常量，即使你不知道它们。例如，我们刚刚学习了布尔数据类型。一个布尔值可以是 1 或 0，即\
  \ True（真）或 False（假）。这里的关键字 `True` 和 `False` 都是布尔常量。同样，每一个数字、字符甚至字符串（字符序列）都是“常量”。\n\
  \n常量与数据类型直接相关。常量的最基本目的是表示值，而值反过来代表类型。因此，取决于常量如何被使用，我们可以相应地定义值的类型。根据上面的讨论，我们可以得出\
  \ C++ 中有四种基本常量。这些常量是：\n\n1. 布尔常量\n2. 数字常量\n3. 字符常量\n4. 字符串常量\n\n我们现在分别讨论每种基本常量。\n\
  \n#### 1. 布尔常量\n布尔常量是表示逻辑状态的常量。`True` 和 `False` 都是布尔常量。它们通常用于 `bool` 类型变量。\n\n####\
  \ 2. 数字常量\n十进制、八进制或十六进制数字被称为整数常量。让我们简要讨论这些数字以及如何区分它们。\n\n- 十进制常量属于十进制系统（基数为 10）。十进制数字不以\
  \ 0 开头。例如，10、120。\n- 八进制常量属于八进制系统（基数为 8）。八进制数字总是以 0 开头。例如，088、0245 都是八进制数。\n- 十六进制常量属于十六进制系统（基数为\
  \ 16）。十六进制数字总是以一对字符开头的。这对字符可以是“0x”或“0X”。例如，0x24A 和 0X2b4F 都是十六进制数。字母表示大于 9 的数字（例如，A\
  \ 代表 10，B 代表 11，F 代表 15）。十六进制数字没有强制的大小写限制。\n\n通常，整数常量被分配给 `int` 类型。然而，如果常量值太大 `int`\
  \ 类型无法处理，则将使用适合处理该值的类型。无论如何，了解整数类型的排序是重要的：\n\n1. `int`\n2. `long`\n3. `unsigned\
  \ long`\n\n为了为整数常量指定 `long` 或 `unsigned long` 类型，我们只需给数字加上类型的第一个字母。例如，如果我们将数字 15\
  \ 赋值给 `long` 类型，则只需添加 `L` 或 `l`。同样，如果我们我们将相同的数字赋值给 `unsigned long` 类型，则将使用 `UL`\
  \ 或 `ul` 字母。对于给 `unsigned int` 类型分配数字，我们只需要使用字母 `U` 或 `u`。演示如下：\n\n`15L` 和 `15l`\
  \ 对应于 `long` 类型\n`15U` 和 `15u` 对应于 `unsigned int` 类型\n`15UL` 和 `15ul` 对应于 `unsigned\
  \ long` 类型\n\n所有整数常量的详细示例已在表中所示。\n\n| 十进制 | 八进制 | 十六进制 | 类型 |\n| :--- | :--- | :---\
  \ | :--- |\n| 16 | 020 | 0x10 | int |\n| 255 | 0377 | OXff | int |\n\n\n\n\n\n|\
  \ 32767 | 077777 | 0x7FFF | int |\n| 32768U | 0100000U | 0x8000U | unsigned int\
  \ |\n| 100000 | 0303240 | 0x186A0 | int (32-bit)long (16-bit) |\n| 10L | 012L |\
  \ 0xAL | long |\n| 27UL | 033UL | 0x1bUL | unsigned long |\n| 2147483648 | 020000000000\
  \ | 0x80000000 | unsigned long |\n\n从上表可以看出，可以看到每个值是如何以不同的方式表示的。这里是一个结合了我们目前为止讨论的整常量概念的程序示例：\n\
  \n```cpp\n// 显示十六进制整数字面量和\n// 十进制整数字面量。\n#include <iostream>\nusing namespace std;\n\
  int main(){\n    // cout 输出整数为十进制整数：\n    cout << \"Value of 0xFF = \" << 0xFF <<\
  \ \" decimal\" << endl;               // 输出: 255 decimal\n    // 操符 hex 将输出更改为十六进制\n\
  \    // 格式（dec 变为十进制格式）：\n    cout << \"Value of 27 = \" << hex << 27 <<\" hexadecimal\"\
  << << endl;     // 输出: 1b hexadecimal\n    return 0;\n}\n```\n\n### 浮点数常量\n\n浮点值包含两个元素：一个整数元素和一个分数元素。数字数部分通过小数点与整数部分分开。这就是为什么尽管浮点值通常以十进制形式表示，但它们也可以通过指数计数法表示。例如，一个精确到小数点后一位的典型浮点数可以如下所示表示：`20.7`。\n\
  \n同样，如果我们有一个数字 `1.5*10-2`，我们不需要以其十进制形式输入，也可以简单地将其存储为指数形式，即 `1.8E-2`。用于存储这些对象的算术类型默认是\
  \ `double` 类型。然而，也可以在值后面添加 `F` 或 `f` 来手动将常量指定为 `float` 类型。同样，也可以通过添加 `L` 或 `l` 将其赋值给\
  \ `long double` 类型。\n\n下表显示了浮点常量以不同方式表示的几个示例。\n\n| 7.19 | 16. | 0.55 |\n| 0.719E1\
  \ | 16.0 | .55 |\n| 0.0719e2 | .16E+2 | 5.5e-1 |\n| 719.0E-2 | 16e0 | 55E-2 |\n\n\
  ### 字符常量\n\n在单引号内的字符被识别为字符常量。字符常量通常分配给 `char` 类型。每个字符都有一个表示字符本身的数值代码。例如，在 ASCII\
  \ 码中，字符 ‘A’ 用数字 `65` 表示。下表详细介绍了几个字符常量及其在 ASCII 码中的十进制值。\n\n| 字符常量 | 字符 | ASCII 码十进制值\
  \ |\n| :--- | :--- | :--- |\n| ‘A’ | 大写字母 A | 65 |\n| ‘a’ | 小写字母 a | 97 |\n| ‘ ’\
  \ | 空格 | 32 |\n| ‘.’ | 点 | 46 |\n| ‘0’ | 数字 0 | 48 |\n| ‘\\0’ | 终止空字符 | 0 |\n\n\
  ### 字符串常量\n\n我们对字符串常量已经很熟悉了，因为在第一章讨论 C++ 程序中 `cout` 流的文本输出时已经处理过它们。无论如何，你应该记住，包含在双引号内的字符序列（如句子或短语）被视为字符串常量。例如，“Press\
  \ the Accept button to proceed!”就是一个字符串常量。\n\n需要注意的是，当字符串序列在内部存储时，双引号是不包含在内的。相反，在字符串序列末尾会放置一个终止空字符\
  \ `\\0`，表示该序列已结束。因此，除了存储单个字符所需的字节外，字符串序列还会使用另一个字节来存储终止空字符。这就是为什么字符串常量占用的内存比其通常需求多一个字节。下图描绘了字符串序列“Hello!”的这种内部表示。\n\
  \n![](img/rsrc2Y7.jpg)\n\n### 转义序列\n\n在讨论编程字符时，另一个需要考虑的方面是那些非图形或不显示在屏幕上但具有用途的字符。例如，看看你的键盘，检查那些按下时会在文字处理器中显示字符的按钮。一旦你开始思考，就会注意到某些字符在按下时不会在屏幕上显示任何字符，例如‘Tab’键、“Shift”键等。这些非图形字符被称为“转义序列”，其效果取决于其使用的设备。例如，Tab\
  \ 转义序列 `\\t` 取决于预定义的默认宽度设置，通常是八个空格。\n\n此外，注意每个转义序列的字符开头都有一个反斜杠。下表详细介绍了几个转义序列及其十进制值和影响。\n\
  \n| 字符 | 定义 | ASCII 码十进制值 |\n| :--- | :--- | :--- |\n| \\a | 警告 (BEL) | 7 |\n| \\\
  b | 退格 (BS) | 8 |\n| \\t | 水平制表符 (HT) | 9 |\n| \\n | 换行符 (LF) | 10 |\n| \\v | 垂直制表符\
  \ (VT) | 11 |\n| \\f | 换页符 (FF) | 12 |\n| \\r | 回车符 (CR) | 13 |\n| \\” | \" (双引号)\
  \ | 34 |\n| \\’ | ' (单引号) | 39 |\n| \\? | ? (问号) | 63 |\n| \\\\ | \\ (反斜杠) | 92\
  \ |\n| \\0 | 字符串终止字符 | 0 |\n| \\ooo (最多 3 位八进制数字) | 字符的数值 | ooo (八进制) |\n| \\xhh\
  \ (十六进制数字) | 字符的数值 | hh (十六进制) |\n\n\n\n\n八进制和十六进制转义序列允许用户以不同的方式表示字符代码。例如，如果你想表达字母‘A’，可以将它的十进制值转换为八进制值，然后使用八进制转义序列来表示它。在\
  \ ASCII 码中，你需要使用十进制值 `65`；然而，如果你没有使用 ASCII 字符集，那么你可以简单地使用 `\\101` 来表示相同的字母。同样，如果你想在十六进制转义序列中表示字母‘A’，则必须使用\
  \ `\\x41`。虽然转义序列可以这样使用，但它们主要用于表示那些不可打印的字符。例如，如果你想代表作为打印机控制序列的字符‘ESC’，可以使用转义序列来表示（八进制为\
  \ `\\33`，十六进制为 `\\x1b`）。\n\n## 基础变量\n变量通常被称为“对象”，特别是当它们是类的一部分时。变量在编程中非常重要，因为它们充当数据（数字、字符、甚至是整个序列）的容器。此外，通过使用变量，程序可以轻松地处理数据。在本节中，我们将讨论关于变量的所有基础概念。\n\
  \n### 定义变量\n变量是一个空容器，在定义之前，它对程序来说是抽象的。通过定义变量，我们的意思是通过向其分配内存，将数据存储在这个抽象容器中，使其对程序具有意义。因此，在某种意义上，我们指定了数据类型并预留了内存，这些内将在变量初始化后被变量使用。一旦定义了变量，可以将其视为一个重定向工具。当用户引用此变量时，程序会自动从其分配的内存空间中获取与该变量相关的数据，以便程序进行处理。通过这种方式，我们可以轻松地对与变量相关的数据执行操作。变量的标准定义有需要遵循的正确语法。该语法是：`typ\
  \ name1 [name2 ...];`。通过观察这一语法，我们可以看到参数 `typ` 实际上是指变量的类型。`name1` 仅仅是程序员指定的变量名。一旦定义，每当我们想在程序的任何部分指定该变量，都使用这个特定的名称。在这一语法中，我们还可以看到一个方括号，其中包含另一个名为\
  \ `name2` 的变量。方括号告诉程序，内部提到的变量并不是完全必要的，如果程序有需要，可以忽略这部分。这意味着我们可以一次性定义并存储多个变量。下面的程序演示了我们如何实际定义变量：\n\
  \n```\nchar c;\nint i, counter;\ndouble x, y, size;\n```\n\n另一个需要注意的重要点是变量可以通过两种方式定义。它们可以在程序的函数内部定义，也可以在程序的函数外部定义。例如，在程序的任何部分，只要不是在函数内部即可。然而，在函数内部或外部定义变量分别具有某些影响。这些影响列如下：\n\
  \n1. 在函数外部定义的变量在程序中具有全局属性。这意味着程序的所有函数都可以使用这个变量。\n2. 在函数内部定义的变量在程序中具有局部属性。这意味着该变量只能由最初定义它的函数使用，而不能由程序的任何其他函数使用。\n\
  \n局部变量可以在函数中任何允许出现语句的地方定义。\n\n### 初始化\n变量的初始化本质上是指为上述变量赋值。当变量正在被定义时，它也会同时初始化。一旦变量被定义，我们只需在定义语法之后立即给它分配一个值来初始化它。变量可以使用两种方法之一进行初始化：\n\
  \n*   在定义变量后，紧接其后放一个等号（`=`）并输入所需的值。例如：\n```\nchar k = 'a';\n```\n*   在定义变量后，紧接用圆括号包裹变量的值。例如：\n\
  ```\nchar k(a);\n```\n同样的 `float x(1.112);`。\n\n未初始化的全局变量具有默认值‘0’。然而，这不适用于局部变量，因为未初始化的局部变量会被分配一个未定义的值。这里有一个包含了我们为止讨论的概念的程序示例：\n\
  \n```cpp\n// 变量的定义和使用\n#include <iostream>\nusing namespace std;\n\nint gVar1; //\
  \ 全局变量\nint gVar2 = 2; // 显式初始化\n\nint main() {\n    char ch('A'); // 正在初始化的变量\n\
  \    // 或者：char ch = 'A';\n    cout << \"Value of gVar1: \" << gVar1 << endl;\n\
  \    cout << \"Value of gVar2: \" << gVar2 << endl;\n    cout << \"Character in\
  \ ch: \" << ch << endl;\n    int sum, number = 3; // 有和无初始化的局部变量\n    sum = number\
  \ + 5;\n    cout << \"Value of sum: \" << sum << endl;\n    return 0;\n}\n```\n\n\
  执行此程序后，计算机将显示如下所示的结果：\nValue of gVar1: 0\nValue of gVar2: 2\nCharacter in ch: A\n\
  Value of sum: 8\n\n## 常量与易变对象\n在本节中，我们将讨论编程中两个重要的关键字，它们会严重影响对象的属性。这些关键字是：\n\n* \
  \  `const`（用于常量对象）\n*   `volatile`（用于易变对象）\n\n\n\n\n\n### 常量对象\n假设我们已经有一个特定类型的对象可供。我们可以通过使用\
  \ `const` 关键字代替其类型来更改对象的属性。这样做将创建一个完全新的、专门被标记为“只读”的对象。正如我们在日常与计算机交互时所了解的，只读文件只能被访问，而不能被用户修改。常量对象也是如此。由于它的属性已经变成了只读的（换句话说，对象本身已经变成了常量），当程序尝试修改该对象时，会使程序无能为力。因此，一个常量对象一旦定义并初始化，之后就不能再修改。由于这种特性，程序员必须在定义常量对象的同时对其进行初始化；否则，它将是一个被赋予默认值的只读对象。\n\
  \n下面展示了一个定义并初始化常量对象的示例：\n```cpp\nconst double pi = 3.1415947;\n```\n\n通过创建这样的对象，程序在任何情况下都无法修改该对象的值。即使我们在程序中引入了这样的语句：\n\
  ```cpp\npi = pi + 2.0;     // invalid\n```\n程序的结果只会返回一条错误信息。\n\n### volatile 对象\n\
  volatile 对象（易变对象）是常量对象的对立面。然而，volatile 对象在程序中很少使用。使用 `volatile` 关键字创建的对象，其属性不仅允许其所在的程序修改对象，还允许其他程序和外部事件修改对象。外部事件通常通过中断或硬件时钟触发，例如：\n\
  ```cpp\nvolatile unsigned long clock_ticks;\n```\n\n通过这种方式，即使程序没有直接修改该变量的值，硬件时钟也一定会修改。因此，程序必须假设该变量的值自上次访问以来已经发生了变化。为了这个目的，编译器会构建一种机器码，允许它扫描并访问变量的当前值，而不是输出它初始化时所在的值。\n\
  \n另一个有趣的点是，我们可以在同一个变量上同时使用 `const` 和 `volatile` 关键字。例如，如果我们使用这些关键字，那么结果变量的属性不能被程序本身修改。尽管如此，它仍然被外部事件（如硬件时钟）修改。这一概念的实现如下所示：\n\
  ```cpp\nvolatile const unsigned time_to_live;\n```\n\n# 第 3 章：C++ 中的函数与类\n在本章中，我们将探索\
  \ C++ 编程领域迈出另一个重要一步。本章建立在第一章 C++ 程序中简要讨论或展示的一些基础之上。函数和类是程序不可或缺的组成部分，掌握使用它们可以确保程序员的技能拥有坚实的基础。\n\
  \n在本章中，我们将学习如何在程序中声明函数以及如何在程序中调用函数。此外，读者还将被指导如何在 C++ 中正确使用标准类，以及头文件和属于 string 类的字符串对象。\n\
  \n在进入描述在程序中声明函数基础的理论细节和讨论之前，让我们先看一个演示并从中建立概念。下所示的原型描述了一个已声明的典型函数的结构：\n![](img/rsrc2Y8.jpg)\n\
  \n如果我们分析这个函数，就可以看到该语句为 C++ 编译器提供了以下信息：\n\n* 要使用的函数名称为 `func`\n* 我们正在通过两个参数调用这个特定的函数。这两个参数都是类型参数，第一个是\
  \ `int`，第二个是 `double`\n* 函数将返回的类型应该是 `long` 类型。\n\n下表列出了 C++ 中可用的最常见且标准的数学函数。\n\n\
  | 函数 | 描述 |\n| :--- | :--- |\n| `double sin (double);` | //正弦 |\n| `double cos (double);`\
  \ | //余弦 |\n| `double tan (double);` | //正切 |\n| `double atan (double);` | //反正正切\
  \ |\n| `double cosh (double);` | //双曲余弦 |\n| `double sqrt (double);` | //平方根 |\n\
  | `double pow (double, double);` | //幂 |\n| `double exp (double);` | //指数函数 |\n\
  | `double log (double);` | //自然对数 |\n| `double log10 (double);` | //十进制对数 |\n\n\
  ## 函数声明\n在编写程序时，编译器就像执行你所写的指令集的主角。按照这个类比，如果我们告诉编译器一个它不认识的函数，它将无法执行该函数。因此，程序员需要为变量和对象声明函数和名称（关键字除外）；否则，编译器将仅仅返回错误信息。这就是为什么在使用这些函数之前，声明函数是非常重要的。通常，你定义函数或变量的地方也是声明它们的地方。然而，并不是所有函数都需要定义后才能声明。例如，如果你想要使用的函数已经在库中定义了，那么你只需要声明该函数，而无需在程序中再次定义它。\n\
  \n和变量一样，函数具有名称和类型。返回值的类型定义了它应该返回的类型。换句话说，如果一个函数应该返回 `long` 类型的值，那么该函数的类型也是‘long’。同样，参数的类型也需要正确指定，以便函数正常工作。换句话说，为了声明函数，我们需要向编译器提供以下信息：\n\
  \n* 函数的名称和类型\n* 每个参数的类型\n\n\n\n\n这样的结构构成了一个函数原型。下面展示了一个函数定义的示例：\n\n```cpp\nint toupper(int);\n\
  double pow(double, double);\n```\n\n以下语句告诉编译器，函数的名称为 `toupper()`，其类型为 `int`。由于它是一个\
  \ `int` 类型的函数，它返回的值也将是 `int` 类型。参数的类型也是 `int`，因此该函数期望一个 `int` 类型的输入参数。\n\n同样地，第二个函数的名称是\
  \ `pow()`，其类型为 `double`。它有两个参数，且两个都是 `double` 类型，这意味着当调用此函数时，需要向它传递两个上述类型的 `double`\
  \ 参数。我们也可以在这类函数原型后面跟上名称，但编译器会将这些名称视为注释。\n\n现在，让我们来讨论另一种情况，即函数已经在我们程序包含的头文件中声明了。例如，如下函数原型所示：\n\
  ```cpp\nint toupper(int c);\ndouble pow(double base, double exponent);\n```\n对于编译器来说，这与之前演示的函数原型是一样的。如果该函数已经在头文件中声明（该头文件在最初通过\
  \ `#include` 指令添加到程序中），我们就可以立即使用该函数而无需再次声明。例如，如果我们包含了 C++ 数学库 `cmath`，那么我们就可以立即使用标准数学函数。下面的程序演示了包含此库以立即使用数学函数：\n\
  \n```cpp\n// 使用标准函数 pow()\n// 计算次方\n#include <iostream>        // cout 的声明\n#include\
  \ <cmath>           // pow() 的原型，因此：\n// double pow( double, double);\nusing namespace\
  \ std;\nint main(){\n    double x = 2.5, y;\n    // 通过原型，编译器会生成\n    // 正确的调用或错误信息！\n\
  \    // 计算 x 的 3 次：\n    y = pow(\"x\", 3.0);      // 错误！字符串不是数字\n    y = pow(x\
  \ + 3.0);      // 错误！只有一个参数\n    y = pow(x, 3.0);       // 确！\n    y = pow(x, 3);\
  \         // OK！编译器将\n    // int 值 3 转换为 double。\n    cout << \"2.5 raised to 3\
  \ yields: \"<< << y << endl;\n    // 使用 pow() 计算是可能的：\n    cout << \"2 + (5 raised\
  \ to the power 2.5) yields: \"<< << 2.0 + pow(5.0, x) << endl;\n    return 0;\n\
  }\n```\n该程序的输出将是：\n2.5 raised to power 3 yields: 15.625\n2 + (5 raised to the power\
  \ 2.5) yields: 57.9017\n\n### 函数调用\n\n函数调用是利用函数的属性和结果，并将其传递给上述调用该函数的变量。例如：\n```cpp\n\
  y = pow( x, 2.0);\n```\n在这个示例中，变量 `y` 正在调用 `pow()` 函数。函数的结果是 $x²$，然后这个指数幂被赋值给调用\
  \ `pow()` 函数的变量 `y`。简单来说，函数调用代表一个值。由于我们只是在表示一个值，我们也可以在函数调用中使用一些其他数学运算法，如加法、减法和乘法等。例如，我们可以对双精度值的函数调用进行加法计算，如下所示：\n\
  ```cpp\ncout << 2.0 + pow( 5.0, x);\n```\n在此条语句中，`2.0` 的值与 `pow()` 函数返回的值相加。之后，`cout`\
  \ 参数将此结果作为语句的最终输出显示。\n\n需要记住，尽管任何类型的表达式（无论是常量还是数学表达式）都可以作为参数传递给函数，但我们必须确保传递的参数是函数期望的类型。换句话说，所传递的参数类型应该与函数最初定义时指定的类型一致。\n\
  \n为了确保参数的类型确实正确，编译器会参考函数原型来双重检查输入参数中指定的类型。在编译器识别出函数原型中最初定义的类型与输入的参数类型相匹配的情况下，编译器会尝试将其转换为所需的类型。但这并不总是可能的，因此类型转换只有在可行时才能发生。这在之前显示的程序代码中已经证明：\n\
  ```cpp\ny = pow( x, 3); // 也是 OK！\n```\n注意，编译器期望的是 `double` 类型的值而不是 `int` 类型的值（`3`）。由于参数的类型与函数原型不匹配，编译器执行了\
  \ `int` 到 `double` 的类型转换。然而，如果输入的参数数量多于或少于函数原型指定的数量，或者编译器无法执行类型转换，它将简单地返回错误信息。此时，你可以轻松地指出错误来源并在程序开发阶段修复它，从而避免处理运行时错误。\n\
  \n在接下来的示例中：\n```cpp\nfloat x = pow(3.0 + 4.7); // 错误！\n```\n编译器识别出使用的参数数量不符合函数原型的结构。此外，函数的返回值为\
  \ `double` 类型，无法赋值给 `float` 类型，因此这种情况下编译器将直接生成错误。\n\n### 无返回值的函数\n\n在大多数情况下，函数调用的目的是为了将其返回给调用该函数的变量。然而，我们也可以创建一个执行任务但不一定向调用它的变量返回任何值的函数。对于此类目的，我们对函数使用\
  \ `void` 类型。\n\n为了演示无返回值的函数调用，让我们先查看下面的语句：\n```cpp\nvoid srand( unsigned int seed\
  \ );\n```\n在这个示例，我们看到使用 `srand()` 来生成随机数。该函数通过初始化一个产生输出随机数的算法来实现这一点。由于该函数不返回具体的值，我们将其分配为\
  \ `void` 类型。函数的参数显示我们正在使用 `unsigned int` 值，该值将被传递给函数使用。该值作为函数将产生的随机数的种子，使其能够生成一系列随机数。\n\
  \n现在我们已经讨论了不返回值的函数，让我们讨论一个不期望参数的函数。如果我们定义函数时没有指定任何参数，那么程序员必须将此函数原型声明为 `void`。或者，我们也可以在括号中留空参数空间。如下所示：\n\
  ```cpp\nint rand( void ); // 或 int rand();\n```\n\n\n\n\n- 包含程序中所声明函数和宏的头文件应该始终包含在程序源代码的开头。否则，编译器在执行程序本身中的函数时将无法引用函数原型。\n\
  - 无法通过单个 `#include` 指令包含多个头文件。如果我们想向程序中添加多个头文件，则必须使用单独的 `#include` 指令来实现，如框所示。\n\
  - 在使用 `#include` 指令进行声明时，头文件的名称应书写正确（注意大小写以及任何标点符号）。头文件的名称可以包含在尖括号 `<>` 中，也可以包含在双引号\
  \ `\"\"` 中，如图所示。\n\n### 查找头文件\n\n通常，每当你包含一个头文件时，它会自动存储在文件文件目录中的一个单独文件夹中。添加到程序中的头文件所存储的目录被称为\
  \ `include`。如果你想对头文件进行更改，或者想手动访问它以用于另一个项目，那么你首先需要参考你将其包含到当前项目的方法。如果你使用尖括号 `<>` 包含头文件，那么它将位于\
  \ `include` 目录中。然而，由于大多数使用 C++ 的程序员都会创建自己的头文件，他们通常将其存储在项目所在的同一个文件夹中。在这些头文件不在 `include`\
  \ 目录的情况下，你将使用双引号 `\"\"` 将其添加到源代码文件中。同样，如果头文件是使用双引号包含在程序源代码中的，那么你需要在项目文件夹本身中查找该头文件。\n\
  \n### 头文件中的标准类定义\n\n到目前，我们知道头文件包含了重要的数据，例如函数原型，这可以帮助程序员高效地编写函数。然而，头文件并不是单维的。它还可以存储其他重要的编程数据，例如我们将在本节中讨论的、已经定义的标准类。程序员可以在头文件中包含对象并定义类，并像使用函数原型一样在程序中使用它们。因此，头文件中定义的任何类和对象，程序都可以访问并使用这些数据来执行任务。\n\
  \n```cpp#include <iostream>\nusing namespace std;\n```\n\n在这个示例中，你可以看到两条语句。我们只关注第一条语句，即在程序中包含\
  \ `istream` 和 `ostream` 类。通过添加包含这些类的头文件，程序变得能够使用 `cin` 和 `cout` 流。这是因为 `cin` 是属于\
  \ `istream` 类的对象，同样，`cout` 是属于 `ostream` 类的对象。\n\n### 使用标准头文件\n\n下表强调了一些包含标准 C++\
  \ 库的头文件。\n\n| algorithm | ios | map | stack |\n| :--- | :--- | :--- | :--- |\n|\
  \ bitset | iosfwd | memory | stdexcept |\n| iomanip | locale | ssstream | vector\
  \ |\n| complex | iostream | new | streambuf |\n| functional | list | set | valarray\
  \ |\n| dequeue | istream | numeric | string |\n| fstream | limits | queue | utility\
  \ |\n| exception | iterator | ostream | typeinfo |\n\n由于 C++ 可以使用标准 C 使用的大部分库，这里是包含\
  \ C 标准库的头文件列表。\n\n| assert.h | limits.h | stdarg.h | time.h |\n| :--- | :--- | :---\
  \ | :--- |\n| ctype.h | locale.h | stddef.h | wchar.h |\n| errno.h | math.h | stdio.h\
  \ | wctype.h |\n| float.h | setjmp.h | stdlib.h | ios646.h |\n| signal.h | string.h\
  \ | | |\n\n\n\n\n乍看之下，我们可以看到两个表格中显示的头文件有一个关键区别，那就是包含了 `.h` 扩展名。这是因为在 C 语言中，头文件是用\
  \ `.h` 扩展名标识的。然而，C++ 头文件并非如此，因为它们的声明都包含在各自的命名空间 `std` 中。但是，重要的是向程序指定你将在全局范围内使用 `std`\
  \ 命名空间来引用标识符。否则，如果不使用 `using` 指令，编译器将无法识别 `cin` 和 `cout` 流。\n\n在这种情况下，编译器无法识别 `cin`\
  \ 和 `cout` 流。\n\n```cpp\n#include <iostream>\n#include <string>\nusing namespace\
  \ std;\n```\n\n通过添加 `using namespace std` 指令，程序现在可以轻松地识别和使用 `cin` 和 `cout` 流，而无需任何额外的语法。请注意，此演示还添加了\
  \ `string` 头文件。这将允许程序在 C++ 中轻松地执行字符串操作任务。\n\n## C 编程语言头文件\n\nC++ 编程语言已经采用并整合了 C\
  \ 编程语言的所有标准库，使得 C++ 程序可以使用它们。因此，头文件也不例外。最初为 C 编程语言标准化的头文件也被 C++ 编程语言所采用。例如，我们可以通过下所示的语句在\
  \ C++ 中使用 C 语言的标准数学库：\n\n```cpp\n#include <math.h>\n```\n\n虽然我们可以使用标准 C 库，但有一个可能会导致严重问题的复杂情况。当使用\
  \ C 头文件时，该文件中声明的标识符将变为全局可见。这在大型编程项目中可能会导致复杂性。为了解决这个问题，我们在 C++ 中简单地在 C 头文件之外额外使用另一个头文件。这个额外的头文件在\
  \ `std` 命名空间中声明了这些标识符，从而解决了标识符冲突的问题。例如，如果我们在 C++ 中使用 `math.h` 库，我们将配合另一个名为 `cmath`\
  \ 的头文件。这个 `cmath` 库包含了 `math.h` 库声明的所有数据，但区别在于 `cmath` 中的标识符已经在 `std` 命名空间中声明。下面演示了：\n\
  \n```cpp\n#include <cmath>\nusing namespace std;\n```\n\n在讨论头文件时，需要澄清的一个重要点是，`string`\
  \ 头文件与 `string.h` 或 `cstring` 提供的功能不同。`string` 头文件只定义了 `string` 类，而 `string.h` 或\
  \ `cstring` 头文件声明了 C 编程语言中用于处理字符串数据的函数和变量。简单来说，`string.h` 和 `cstring` 头文件允许用户访问\
  \ C 字符串库的功能，而 `string` 头文件的唯一目的是定义 `string` 类。\n\n这里是一个展示在 C++ 程序中使用两个头文件（即 `iostream`\
  \ 和 `string`）的示例：\n\n```cpp\n// 使用字符串。\n#include <iostream>      // cin, cout 的声明\n\
  #include <string>         // class string 类的声明\nusing namespace std;\n\nint main(){\n\
  \    // 定义了四个字符串：\n    string prompt(\"What is your name: \"),name,            \
  \   // 一个空行\n    line(40, '-'),                      // 包含 40 个 '-'的字符串\n    total\
  \ = \"Hello \";                   // 是可以的！\n    cout << prompt;                \
  \     // 请求输入。\n    getline( cin, name);                // 在行内输入名字\n    total =\
  \ total + name;               // 拼接并赋值字符串。\n    cout << line << endl;          \
  \      // 输出 line 和 name\n    cout << total << endl;\n    cout << \" Your name is\
  \ \"             // 输出长度\n    << name.length() << \" characters long!\" << endl;\n\
  \    cout << line << endl;\n    return 0;\n}\n```\n\n此示例使用 `cout` 和 `<<` 语句打印字符串。该程序要求用户输入名字，然后继续显示其输入的名字以及该名字中包含的字符数。\n\
  \nWhat is your name: Zoldyck Killua\n---------------------------------------\nHello\
  \ Zoldyck Killua\nYour name is 13 characters long!\n---------------------------------------\n\
  \n## 在 C++ 中使用类\n\n从上面的示例可以看出，它将 `string` 类整合到了其核心功能中。在 C++ 标准库中，预先定义了多个类。这些类对于\
  \ C++ 程序的基础至关重要。它们包括流类（`iostream`）以及有效地帮助程序表示字符串和产生错误的条件的类。\n\n尽管有许多可用的类，但每个类就表示其属性和能力的各自类型而言都是唯一的。虽然每个类都是唯一的，但无论它们是预定义类还是程序员自定义设计的类，它们的属性和能力仍然受两个主要方面的影响：\n\
  \n- 类的数据成员负责定义其对应类的属性。\n- 类的方法（属于类的函数。这些函数与类的成员协作以执行操作）定义了类的能力。类的方法通常也称为成员函数。\n\n\
  \n\n\n### 创建类对象\n\n对象是被赋值为类类型本身的变量。例如，如果我们为字符串类创建一个对象，那么该变量将附带字符串类型。这在下方的示例中已经得到了证明：\n\
  \n```cpp\nstring s(\"I am an object of the string class\");\n```\n\n每当创建一个对象时，系统都会为其数据成员分配内存，并用其对应的值进行初始化。在上面的示例中，你可以看到变量\
  \ `s` 的类型是字符串类。\n\n`Object`（对象）也被称为其所代表的相应类的实例（instance）。以上面的语句为例，对象 `s` 也可以被称为字符串类的一个实例。该对象后面跟着一个字符串常量（I\
  \ am an object of the string class），并最终以这种方式被定义和初始化。\n\n### 调用方法\n\n在类中，所有被定义为“public”（公有）的方法都可以通过该特定类的对象进行调用。我们绝不能将调用公共方法与调用全局函数混淆。尽管两者在某些方面具有基本相似之处，但仍有一个方面是方法与函数之间主要的区别因素。这一方面在于，与全局函数可以被其所在程序中的多个语句使用不同，公共方法一次只能为一个特定的对象被调用。方法和对象的典型设置如下所示：\n\
  \n```cpp\ns.length(); // object.method();\n```\n\n在这一语句中，`length()` 是对象 `s` 的方法。该方法的主要目的是提供有关字符串中字符总数的信息。这在上一节所示的程序中已经证明。我们看到，不是使用\
  \ `s` 对象，而是使用对象名配合 `length()` 方法。\n\n## 全局函数与类\n\n全局定义的函数也可以被某些类使用。类使用的全局函数主要为该类的对象执行某些操作，这些对象是作为参数传递给函数的。例如，考虑以下语句，它包含一个全局函数\
  \ `getline()`。它被与对象 `s` 使用（该对象作为参数传递给函数）：\n\n```cpp\ngetline(cin, s);\n```\n\n全局函数执行一个操作，将一行键盘输入存储为字符串。通过这种方式，通过按下回车键，`\\\
  n` 转义字符将创建一个换行符，但行本身不会被存储在字符串中。\n\n# 第 4 章：基本类型的运算符\n\n在本章中，我们将介绍对于基本数据类型进行计算和选择至关重要的运算符。运算符与函数相似，但它们的语法完全不同。运算符是执行特定操作（如算术运算、比较运算和逻辑运算等）的工具。我们将讨论基础编程中使用的一些基础运算符。\n\
  \n## 二元算术运算符\n\n为了使程序能够处理数据输入，需要定义处理过程所需的操作。选择性操作的执行取决于所处理的数据类型，例如数字的加、乘或比较。然而，对字符串进行乘法是不符合逻辑的。\n\
  \n下一节将讨论用于算术处理的重要运算符，包括一元运算符二元运算符。一元运算符使用一个操作数，而二元运算符指定两个。这是一个演示典型二元运算符和操作数的图。\n\
  \n![](img/rsrc2YA.jpg)\n\n为了进一步澄清概念，下面列出了基本二元运算符的表格：\n\n| 运算符 | 意义 |\n| :--- | :---\
  \ |\n| + | 加法 |\n| - | 减法 |\n| * | 乘法 |\n| / | 除法 |\n| % | 取余 |\n\n这是一个演示二元运算符使用的程序：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main(){\n    double x,\
  \ y;\n    cout << \"\\nEnter two floating-point values: \";\n    cin >> x >> y;\n\
  \    cout << \"The average of the two numbers is: \"<< (x + y)/2.0 << endl;\n  \
  \  return 0;\n}\n```\n\n执行此程序时，我们将得到以下结果：\n`Enter two floating-point values: 4.75\
  \ 12.3456`\n`The average of the two numbers is: 8.5478`\n\n系统可以在算术运算符的帮助下进行计算。\n\
  \n*   如果使用整数操作数进行除法，将产生整数结果。例如，`7/2` 的计算结果将是 `3`。此外，一个或多个浮点数操作数将产生浮点数形式的结果。例如，如果计算\
  \ `7.0/2`，精确结果将是 `3.5`。\n*   整数操作数是唯一可以使用取余除法的类型，取余法用于返回整数除法的余数，例如 `7%2` 将产生结果 `1`。\n\
  \n## 表达式\n\n简单表达式仅由一个常量、变量或函数调用组成，但当它们被用运算符的操作数时，就形成了复杂的表达式。因此，一个表达式通常是运算符和操作数的组合。\n\
  \n在使用时，除了具有 `void` 类型的外，所有表达式都会返回结果。操作数定义了算术计算中的表达式。\n\n示例：\n```cpp\nint a(4);\n\
  double x(7.9);\na * 512      // 类型 int\n1.0 + sin(x)  // 类型 double\nx – 3      \
  \  // 类型 double，因为其中一个操作数的类型是 double\n```\n\n如果表达式使用正确，它也可以作为另一个表达式的操作数。\n示例：\n\
  ```cpp\n2 + 7 * 3    // 2 加上 21\n```\n\n在求表达式时，遵循数学上的先乘后加规则。因此，`*`、`/` 和 `%` 运算符的优先级高于\
  \ `+` 和 `-`。在上面的示例中，首先执行 `7*3` 的计算，然后加上二。另一方面，可以通过为先执行的计算插入括号来改变优先级顺序。\n\n示例：\n\
  ```cpp\n(2 + 7) * 3 // 9 乘以 3\n```\n\n## 一元算术运算符\n\n一元算术运算符总共有四种：\n\n*   一元符号运算符\
  \ `+`\n*   一元符号运算符 `–`\n*   递增运算符 `++`\n*   递减运算符 `--`\n\n\n\n\n然而，并不是所有的一元算术运算符都具有相同的优先级。算术运算符的优先级如下表所示：![](img/rsrc2YB.jpg)\n\
  \n算术运算符的前缀表示法和后缀表示法的影响在以下示例程序中已得到演示：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint main(){\n    int i(2), j(8);\n    cout << i++ << endl;          // 输出:\
  \ 2\n    cout << i << endl;            // 输出: 3\n    cout << j-- << endl;      \
  \    // 输出: 8\n    cout << --j << endl;          // 输出: 6\n    return 0;\n}\n```\n\
  \n## 一元符号运算符\n符号运算符 `+` 没有实际用处，因为它只是按原样返回操作数的值。相反，符号运算符 `–` 在反转操作数符号后返回操作数的值。\n\
  示例：`int n = -5; cout << -n; // 输出: 5`\n\n## 增和和减运算符\n增运算符用于将操作数的值增加 1。由于这个原因，它不能与常量一起使用。增运算符可以以前缀表示法或后缀表示法的形式使用。以变量\
  \ `i`，后缀表示写为 `i++`，前缀表示写为 `++i`，两者都执行 `i=i+1` 的功能。结果是 `i` 的值增加了一。\n\n尽管执行相同的操作，但后缀\
  \ `++` 和前缀 `++` 的工作方式不同。通过观察两个表达式中的值，它们之间的区别变得显而易见。当使用 `++i` 时，意味着 `i` 的值在应用之前已经增加了。相反，在\
  \ `i++` 中，保留了原始值 `i`。\n`++i` 是先增加 `i` 的值，然后进行应用。`i++` 是先应用 `i` 的原始值，然后进行增加。\n虽然这在简单表达式中可能并不明显，但在复杂表达式中会产生显著差异。因此，在处理复杂表达式时，必须注意后缀表达式和前缀表达式之间的区别。\n\
  \n减运算符 `--` 通过通过减少 1 来改变给定变量或操作数的值。前缀和后缀表示法也可以应用于此运算符，其功能与增标记相同，只是执行操作 `i=i-1`。\n\
  \n### 优先级\n当需要评估多个运算符时，它们的顺序由运算符优先级决定，然后对运算符和操作数进行相应的分组。如果研究相反的表格，可以看到运算符 `++` 具有最高优先级，而\
  \ “/” 的优先级高于 “-”。\n示例：`( val++ ) – ( 7.0/2.0 )`\n结果为 `1.5`，请记住 `val` 是稍后增加的。\n\n\
  如果任何两个或多个运算符具有相同的优先级，表达式的评估由表格的第三列决定。\n示例：`3 * 5 % 2` 等于 `(3 * 5) % 2`。\n\n## 赋值\n\
  我们将某个值赋给表达式或变量的过程被称为赋值。在详细讨论赋值主题之前，让我们先看看它们如何在实际的 C++ 程序中使用的：\n\n```cpp\n// 复合赋值演示\n\
  #include <iostream>\n#include <iomanip>\nusing namespace std;\nint main(){\n   \
  \ float x, y;\n    cout << \"\\n 请输入初始值：\";cin >> x;\n    cout << \"\\n 请输入增量值：\"\
  ;cin >> y;\n    x += y;\n    cout << \"\\n 现在是乘法！\";\n    cout << \"\\n 请输入一个因子：\"\
  ;cin >> y;\n    x *= y;\n    cout << \"\\n 最后是除法。\";\n    cout << \"\\n 请提供一个除数：\"\
  ;cin >> y;\n    x /= y;\n    cout << \"\\n 这是 \"<< << \"你当前的幸运数字： // 小数点后没有\n  \
  \  // 位数：\n    << fixed << setprecision(0)\n    << x << endl;\n    return 0;\n}\n\
  ```\n\n### 简单赋值\n在给表达式赋值变量值，简单赋值使用写为 `=` 的赋值运算符。值位于赋值运算符 `=` 的右侧，而被赋值的变量在左侧。\n示例：`z\
  \ = 7.5;`, `y = z;`, `x = 2.0 + 4.2 * z;`\n如示例所示，变量在左侧表示为 “x”，“y” 和 “z”；给它们的值在右侧。在评估顺序上，赋值运算符的优先级较低。在最后一个示例中可以看出，右侧的表达式首先被计算，计算产生的结果被赋值给左侧的变量。\n\
  \n赋值运算符本身可以被视为表达式，而该表达式的值就是赋值给变量的值。\n示例：`sin ( x = 2.5 );` 如示例所示，`2.5` 的值首先赋值给变量\
  \ “x”，然后作为参数传递给函数。\n\n如果使用多个赋值运算符，可以从右到左评估它们。\n示例：`i = j = 9;`\n该示例中表达式的评估从右侧开始，即值\
  \ `9` 首先赋值给 “j”，然后赋值给 “i。”\n\n### 复合赋值\n除了简单赋值，另一种运算符是复合赋值。它用于同时执行算术操作和赋值。\n示例：`i\
  \ += 3;` 等于 `i = i + 3;`\n`i *= j + 2;` 等于 `i = i * (j+2);`\n复合赋值的优先级与赋值运算符相似，设置为较低。因此，复合赋值被放在括号中，这在第二个示例中所示。\n\
  \n二元算术运算符和位运算符用于组合复合赋值，如 `+=`、`-=`、`*=`、`/=` 和 `%=`。在评估复杂操作时，赋值运算符或增(++)/减(--)会显著修改变量。这种修改被称为副作用，通常会导致错误。因此，应尽可能避免使用副作用，以防影响程序的可读性。\n\
  \n## 关系运算符\n下表显示了 C++ 中可用的所有关系运算符。\n\n| 运算符 | 意义 |\n| :--- | :--- |\n| `<` | 小于\
  \ |\n| `<=` | 小于等于 |\n| `>` | 大于 |\n| `>=` | 大于等于 |\n| `==` | 等于 |\n| `!=` | 不等于\
  \ |\n\n像一元运算符一样，关系运算符之间也有不同的优先级。这在下表中得到了突出：这里是使用关系运算符进行比较目的的简短示例：\n\n| 比较 | 结果 |\n\
  | :--- | :--- |\n| `4 >= 5` | False |\n| `1.5 > 2.3` | False |\n| `2.9 > 2.2` |\
  \ True |\n| `2 * 10 != 18` | True |\n\n\n\n\n\n## 比较的结果\n\n比较运算符是 `bool` 类型的表达式，用于比较两个值。该值可以是“true”（真），意味着比较是正确的；也可以是“false”（假），意味着比较是不正确的。\n\
  \n示例：`length == circuit` // 假或真\n\n在给定的示例中，如果 `length` 和 `circuit` 的数值相同，则比较是正确的，该比较表达式的值即为“true”。相反，如果\
  \ `length` 和 `circuit` 的值不同，则赋值给该表达式的值将是“false”。\n\n在比较两个单独字符时，必须仔细选择字符集，因为字符是根据它们的字符编码进行比较的。\n\
  \n示例：`‘A’ < ‘a’` // 真，因为 `65 < 97`\n\n在示例中，使用了 ASCII 码，因此结果为真。\n\n### 关系运算符的优先级\n\
  \n按照求值顺序，关系运算符的优先级大约处于中间位置。它低于算术运算符，但高于赋值运算符。\n\n示例：`bool flag = index < max – 1;`\n\
  \n如示例所示，算术表达式 `max - 1` 先被求值。然后将结果与 `index` 进行比较，最后将值赋值给 `flag` 变量。\n\n示例：`int result;\
  \ result = length + 1 == limit;`\n\n在这种情况下，操作 `length + 1` 在其他表达式之前执行，然后与 `limit`\
  \ 变量进行比较。该关系操作的结果随后被赋值给 `result` 变量。由于结果类型为 `int` 类型，最终结果的值是数值，而不是真或假。因此，如果结果为假，则赋值为\
  \ `0`；如果结果为真，则赋值为 `1`。\n\n执行使赋值运算符具有优先级、而其他操作随其后的操作是非常常见的。这通过将赋值表达式括在括号中来实现。\n\n\
  示例：`( result = length + 1 ) == limit`\n\n在这种情况下，`length + 1` 的值首先赋值给 `result` 变量，之后再与\
  \ `limit` 进行比较。\n\n## 逻辑运算符\n\n在详细讨论逻辑运算符之前，这里有逻辑运算符的真表以及展示逻辑表达式的示例。这对于建立背景知识是必要的。\n\
  \n![](img/rsrc2YD.jpg) (真表)!\n![](img/rsrc2YE.jpg)\n\n布尔运算符 AND `&&`、OR `||` 和 NOT\
  \ `!` 都是逻辑运算符的一部分。这些运算符的主要用途是创建复合条件，并在依赖用户设置的多个条件的同时执行程序的条件执行。与关系表达式类似，逻辑表达式也会被检查是否正确或错误，然后给最终结果分配一个真或假之间的位值。\n\
  \n### 操作数与求值顺序\n\n布尔类型运算符通常使用 `bool` 类型的操作数。然而，也会使用算术类型的操作数以及任何可以转换为 `bool` 类型的操作数。因此，如果使用的操作数值为\
  \ `0`，则它会被转换为 `false`。如果它的值任何非 `0`，则被视为真。\n\nOR 运算符 `||` 如果至少有一个操作数为真，则产生的关系结果为真。如果两者都为假，则结果也将为假。\n\
  \n示例：`( length < 0.2 ) || ( length > 9.8 )`\n\n如果 `length` 的值小于 `0.2` 或大于 `9.8`，则上述\
  \ OR 表达式的值为真。\n\nAND 运算符 `&&` 表达式中的值只有在两个操作数都为真时才会返回真，否则结果将为假。\n\n示例：`( index <\
  \ max ) && ( cin >> number)`\n\n在上面的表达式中，如果 `index` 证明小于 `max` 且 `number` 输入成功，那么运算符产生的结果将为真。相反，如果\
  \ `index` 不小于 `max`，则程序将不会读取或输入 `number`。逻辑运算符 AND `&&` 以及 OR `||` 具有固定的求值顺序。\n\n\
  C++ 从左到右开始求值，并忽略不必要的操作数，例如当在求值左侧操作数时确定结果时，右侧的操作数将不会被求值。\n\n逻辑运算符 `!` 是 NOT 运算符，它只作用于位于右侧的操作数。它检查操作数的值，如果真，则会被\
  \ NOT 运算符反转，并返回布尔值假。同样地，如果变量 `flag` 的值为假或 `0`，则它将返回真。因此，NOT 运算符通过返回其求值的变量 `flag`\
  \ 的相反值来工作。\n\n### 布尔运算符的优先级\n\n在考虑求值顺序时，AND 运算符 `&&` 的优先级高于 OR 运算符 `||`。这两个逻辑运算符的优先级都高于赋值运算符，但低于之前的其他运算符。\n\
  \nNOT 运算符 `!` 作为一元运算符，在求值顺序中具有更高的优先级。\n\n# 第 5 章：控制程序的流程\n\n在程序中，我们需要控制数据和信息的流。如果一个程序只有一个连续方向的数据流，即数据流方向于程序结构的方向，那么生成的程序就是局限且单维的。为了增加程序的功能和能力，我们需要控制流程。可以使用\
  \ `if`、`if-else`、`switch`、`while`、`do-while`、`for`、`break`、`continue`、`goto` 和 `return`\
  \ 等语句来控制。\n\n### ‘While’ 语句\n\n控制流。这里是 `while` 语句的结构图。\n\n![](img/rsrc2Y.jpg)\n\n\
  同样，让我们首先观察 `while` 语句的结构。\n\n```cpp\n// average.cpp\n// Computing the average\n\
  #include <iostream>\nusing namespace std;\n\nint main(){\n    int x, count = 0;\n\
  \    float sum = 0.0;\n    cout << \"Please enter some integers:\\n\";\n    while(\
  \ cin >> x ){\n        sum += x;\n        ++count;\n    }\n    cout << \"The average\
  \ of: \" << sum / count << endl;\n    return 0;\n}\n```\n\n`while` 语句的语法是：\n```\n\
  while (表达式)\n    语句\n```\n\n`while` 语句在执行循环体之前验证表达式是否为真。相反，`do-while` 语句在语句执行后才评估控制表达式。\n\
  \n### ‘For’ 语句\n\n就像前面的部分一样，让我们首先查看并理解 `for` 语句的结构图，看看它在程序中是如何实现的。\n\n![](img/rsrc2YG.jpg)\n\
  \n```cpp\n// Euro1.cpp\n#include <iostream>\n#include <iomanip>\nusing namespace\
  \ std;\n\nint main(){\n    double rate = 1.15; // 汇率\n    cout << fixed << setprecision(2);\n\
  \    cout << \"\\t \\tDollar\\n\";\n    for( int euro = 1; euro <= 5; ++euro)\n\
  \        cout << \"\\t \" << euro << \"\\t \" << euro*rate << endl;\n    return\
  \ 0;\n}\n```\n\n该程序的输出为：\n```\nEuro\tDollar\n1\t1.15\n2\t2.30\n3\t3.45\n4\t4.60\n\
  5\t5.75\n```\n\n### 初始化与重新初始化\n\n```cpp\nint count = 1; // 初始化\nwhile( count <=\
  \ 10) // 控制\n{\n    cout << count << endl; // 表达式\n    ++count; // 重新初始化\n}\n```\n\
  \n控制语句重复的表达式或元素通常放在循环头部。你在上面的示例中已经看到了这一点，它可以被视为一个 `for` 语句。\n\n```cpp\nint count;\n\
  for ( count = 1; count <= 10; ++count)\n    cout << count << \". loop\" << endl\n\
  ```\n\n\n\n\n\n- 如果 `expression 2` 的返回值为 false 或 0，则循环终止。\n- 如果 `expression 2` 的返回值为\
  \ true，则执行循环体。\n\n\n\n当表达式 `3` 重新初始化语句并返回 `expression 2` 再次验证值时，循环将重复。放在 `expression\
  \ 1` 中的循环计数器只能在循环内部使用，不能在循环结束后使用。\n\n示例：`for ( int i = 0; i < 10; cout << i++ );`\n\
  \n给出的示例表明，某些循环甚至可以空语句，因为所有必要的语句都位于循环头。虽然这种方法可行，但这种循环体的可读性明显不如那些在空语句中单独占一行的循环体。\n\
  \n```cpp\n// EuroDoll.cpp\n// 输出汇率表：欧元和美国美元\n#include <iostream>\n#include <iomanip>\n\
  using namespace std;\nint main(){\n    long euro, maxEuro;             // 欧元金额\n\
  \    double rate;                     // 汇率 欧元 <-> $\ncout << \"\\n* * * TABLE OF\
  \ EXCHANGE \"<< \" Euro – US-$ * * *\\n\\n\";\n\ncout << \"\\nPlease give the rate\
  \ of exchange: \"\" one Euro in US-$: \";cin >> rate;\ncout << \"\\nPlease enter\
  \ the maximum euro: \";cin >> maxEuro;\n\n// --- 输出表格 ---\n// 列标题：\ncout << '\\\
  n'<< setw(12) << \"Euro\" << setw(20) << \"US-$\"<< \"\\t\\tRate: \" << rate <<\
  \ endl;\n// 格式化 US-$:\ncout << fixed << setprecision(2) << endl;\nlong lower, upper,\
  \               // 下限和上限\nstep;                            // 步长\n// 外层循环决定实际的\n\
  // 下限和步长：\nfor( lower=1, step=1; lower <= maxEuro;step*= 10, lower = 2*step)\n//\
  \ 内层循环输出一个“块”:\nfor( euro = lower, upper = step*10;euro <= upper && euro <= maxEuro;\
  \ euro+=step)\n    cout << setw(12) << euro<< setw(20) << euro*rate << endl;\nreturn\
  \ 0;\n}\n```\n\n在 `for statement` 中，表达式 `1`、`2` 和 `3` 中的任何一个都可以很容易省略。例外是循环中必须至少有两个分号。因此，根据这一声明，for\
  \ 语句的最短形式将写为：\n\n示例：`for ( ; ; )`\n\n在这个示例中，控制表达式是 `expression 2` 必须缺失的条件。因此，在这种情况下，值始终返回为真，循环变成无限循环。\n\
  \n示例：`for ( ; expression ; )`\n\n这种 for 语句表达式的行为方式与 while 语句相同；只要控制表达式被验证为真，循环就会继续。\n\
  \n### 逗号运算符\n\n逗号运算符用于分隔两个表达式，这些表达式被包含在只需要一个语句的代码中。例如在 `for statement` 的循环头中被用作初始化器的多个变量。逗号运算符具有以下语法：\n\
  \n语法：`expression1, expression2 [, expression3 ...]`\n\n表达式集从左到右求值，当它们必须为了单个值进行求值时，只考虑最右边的表达式。\n\
  \n示例：\n```cpp\n    int x, i, limit;\nFor ( i=0, limit=8; i < limit; i += 2)\nx =\
  \ i * i, cout << setw (10) << x;\n```\n\n逗号运算符分隔了上述示例中的不同计算。`i` 和 `limit` 的赋值由逗号分隔，随后是\
  \ `x` 值的计算和输出，都在同一个语句中。\n\n逗号运算符的优先级在顺序是最低的，甚至低于赋值运算符。因此，不需要像上面那样使用括号。\n\n包含逗号的语句中的最后一个表达式决定了逗号运算符的类型和值。\n\
  \n示例：`x = (a = 3, b = 5, a * b);`\n\n从左开始的表达式首先被求值，然后将 `a * b` 的值赋值给 `x`。\n\n###\
  \ `do-while` 语句\n\ndo-while 的结构如下：\n\n![](img/rsrc2YH.jpg)\n\n程序中控制流的 do-while 语句的实际实现所示：\n\
  \n```cpp\n// tone.cpp\n#include <iostream>\nusing namespace std;\nconst long delay\
  \ = 10000000L;\nint main(){\n    int tic;\n    cout << \"\\nHow often should the\
  \ tone be output? \";cin >> tic;\n    do{\n        for( long i = 0; i < delay; ++i\
  \ );\n        cout << \"Now the tone!\\a\" << endl;\n    }while( --tic > 0 );\n\
  \    cout << \"End of the acoustic interlude!\\n\";\n    return 0;\n}\n```\n\n在\
  \ do-while 语句中，循环至少执行一次，控制表达式在循环之后评估。因此，此迭代语句是由它的尾部控制的，而不是另外两个由其头部控制的语句。\n\n语法：`do\
  \ statement while ( expression);`\n\ndo-while 在循环体执行一次后评估控制表达式，如果表达式的值返回为真，则重复循环；同时，为假的结果将终止循环。\n\
  \n### 嵌套循环\n\n嵌套循环意味着将不同的循环嵌套在循环体内部，即循环中的循环。根据 ANSI 标准，C++ 最多允许 256 层嵌套。示例程序给出了由用户确定的输出。给定程序有两个循环，一个嵌套在另一个内部。每当外层循环（do-while\
  \ 语句）重复时，在执行内层循环（for 语句）的过程中会发生中断。在内层循环中，`i` 的值从 0 增加到 `delay`。该程序的输出是由于输出控制字符（ASCII\
  \ 7）生成的文本。该控制字符表征为 `\\a`。do-while 语句在输入为 0 或负数时也会输出。\n\n### `If-Else` 语句的选择\n\n\
  if-else 语句的结构图如下：\n\n![](img/rsrc2J.jpg)\n\n同样，if-else 语句的实现如下所示：\n\n```cpp\n//\
  \ if_else.cpp\n// 展示 if-else 语句的使用\n#include <iostream>\nusing namespace std;\n\
  int main(){\n    float x, y, min;\n    cout << \"Enter different numbers:\\n\";\n\
  \    if( cin >> x && cin >> y)  // 如果输入\n    {\n        if( x < y ) // 较小的\n   \
  \         min = x;\n        else\n            min = y;\n        cout <<nThe number\
  \ is: \" << min << endl;\n    }\n    else\n        cout << \"\\nInput!\" << endl;\n\
  \    return 0;\n}\n```\n\nif-else 语句用于根据满足的两个语句之间进行选择。\n\n语法：`if ( expression )\
  \ statement1 else statement2`\n\n首先评估表达式以验证条件是否满足。结果返回真或假。如果为真，则执行 `statement1`，并且在存在\
  \ else 分支的情况下终止；如果为假，则忽略 `statement1` 并执行 `statement2`。然而，如果没有 `else` 语句且为假，则跳转到\
  \ if-else 语句之后。\n\n#### 嵌套 if-else 语句\n\n考虑到程序中使用多个 if-else 语句的情况，多个 if-else 语句可以相互嵌套。某些\
  \ `if statements` 没有关联 `else` 分支。因此，`else` 分支与最近的没有 else 的 if 语句关联。\n\n示例：\n```cpp\n\
  if ( n > 0 )\n    if ( n%2 == 1 )\n        cout << \" Positive odd number \";\n\
  else\n    cout << \"Positive even number\";\n```\n\n从示例可见，else 分支与缩进的第二个 if 语句关联。如果需要重新定义\
  \ else 分支并将其与另一个 if 语句关联，则使用代码块。\n\n示例：\n```cpp\nif ( n > 0 ){ \n    if ( n%2 ==\
  \ 1 )\n        cout << \" Positive odd number \\n\";\n}\nelse\n    cout << \" Negative\
  \ number or zero\\n\";\n```\n\n#### 在 if 语句中定义变量\n\n变量可以在 if 语句中定义并用于初始化。如果变量被转换为\
  \ `bool` 类型并返回真值，那么 if 语句中的表达式也为真。\n\n示例：`if ( int x = func ( ) ){ . . }`\n\n示例中的变量\
  \ `x` 由函数 `func()` 的结果初始化。对于除 0 以外的任何值，块中的语句都会求值并执行。一旦程序离开 if 语句，变量 `x` 不再被使用。\n\
  \n### Else-If 链\n\nelse-if 语句的结构实现如下：\n\n![](img/rsrc2YK.jpg)\n\n示例程序中的 else-if\
  \ 语句实现：\n\n```cpp\n// speed.cpp\n// 输出超速的罚款\n#include <iostream>\nusing namespace\
  \ std;\nint main(){\n    float limit, speed, toofast;\n    cout << \"\\nSpeed limit:\
  \ \";cin >> limit;\n    cout << \"\\nSpeed: \";cin >> speed;\n    if( (toofast =\
  \ speed – limit ) < 10)\n        cout << \"You were lucky!\" << endl;\n    else\
  \ if( toofast < 20)\n        cout << \"Fine payable: 40,-. Dollars\" << endl;\n\
  \    else if( toofast < 30)\n        cout << \"Fine payable: 80,-. Dollars\" <<\
  \ endl;\n    else\n        cout << \"Hand over your driver's license!\" << endl;\n\
  \    return 0;\n}\n```\n\n#### 布局与程序流\n\n如果程序有多个选项可以选择，可以借助 else-if 链选择性地执行，这些链是嵌入的一系列\
  \ if-else 语句。这些链的布局如下：\n\n```\nif ( expression1 )\nstatement1\nelse if ( expression2\
  \ )\nstatement2\n...\nelse if ( expression(n) )\nstatement(n)\n[ else statement\
  \ (n+1)]\n```\n\n在执行 else-if 链期间，从第一个（expression1）开始的表达式按照顺序逐一求值。验证第一个表达式，是真还是假。如果为真，则执行其后的语句，并且链终止；但如果为假，则评估下一个表达式。如果没有任何表达式返回为真，则执行与最后一个\
  \ if 语句关联的 else 分支。\n\n#### 条件运算符\n\n条件运算符 `(?:)` 可以作为 if-else 语句的简洁替代方案。这种选择机制基于语句中的两个给定值之一根据关联条件的值被选择输出。\n\
  \n语法：`expression ? expression1 : expression2`\n\n条件表达式的值将是 `expression1` 或 `expression2`。首先评估表达式或给定的条件。如果结果返回为真，则选择并评估\
  \ `expression1`；但如果结果为假，则选择 `expression2` 进行评估。\n\n示例：`z = ( a >= 0 ) ? a : -a;`\n\
  \n\n\n给定表达式中的变量 `z` 将赋值为 `a` 的绝对值。第一个条件是，如果 `a` 的值为正数（例如 `12`），则变量 `z` 被赋值为数字 `12`。但如果是一个负数（例如\
  \ `-8`），则 `z` 的值将是 `8`。从条件表达式得到的值存储在变量 `z` 中，因此，它可以被视为下所示的 if-else 语句：\n\n```cpp\n\
  if ( a > 0 )\n    z = a;\nelse\n    z = -a;\n```\n\n### 优先级\nC 语言中唯一使用三个操作数的运算符是条件运算符。第一个示例中可见括号可以删除，因为条件运算符的优先级高于赋值运算符和逗号运算符，但低于其他运算符。条件语句求值的结果可以直接使用，而无需赋值。这可以通过下面的示例理解，该示例的条件是\
  \ `x` 应该大于 `y`。如果 `x` 是一个较大的值，则显示 `x` 的值作为输出。否则，将打印 `y` 的值。对于复杂的表达式，最好使用一个变量来接收条件表达式的值，这样可以提高程序的可读性。\n\
  \n### “Switch”语句\n程序中 switch 语句的结构实现如下：\n\n![](img/rsrc2YN.jpg)\n\n下面展示了一个演示 switch\
  \ 语句和表达式实现的示例程序：\n\n```cpp\n// 评估给定的输入。\nint command = menu();           // 函数 menu()\
  \ 读取命令。\nswitch( command )              // 评估 command。\n    case 'a':\n    case\
  \ 'A':\n        action1();      // 执行第 1 个动作。\n        break;\n    case 'b':\n \
  \   case 'B':\n        action2();      // 执行第 2 个动作。\n        break;\n    default:\n\
  \        cout << '\\a' << flush; // 蜂鸣提示\n}                                   //\
  \ 无效输入\n```\n\n就像 else-if 链顺序评估多个语句一样，switch 语句也会在许多备选项之间进行选择。区别在于它将开头给出的表达式与所有其他常量或语句进行比较。\n\
  \n```cpp\nswitch ( expression ){\n{\n    case const1: [ statement ][ break; ]\n\
  \    case const2: [ statement ][ break; ]\n    ...\n    [ default : statement ]\n\
  }\n```\n\n在实现 switch 语句之前，必须考虑需要评估的表达式以及与之比较的常量是否都是整型类型（例如布尔值或字符常量）。然后，表达式求值的结果将与\
  \ case 标签中编写的 `const1`、`const2` 等进行比较。这些常量中的每一个都必须是不同的。\n\n当结果值在多个 case 常量中找到匹配时，程序将移动到选定的\
  \ case 标签并继续向下执行。完成此步骤后，就不再需要 case 标签。\n\n通过在每个常量语句之后放置 `break` 语句，可以防止在 switch\
  \ 语句实现后对 case 标签进行不必要的执行。这使得程序无条件地离开语句。\n\n如果表达式结果值与任何常量都不匹配，程序将跳转到 `default` 标签，该标签不一定是最后一个标签。如果需要向\
  \ switch 语句添加额外的 case 标签，可以将它们放在 `default` 标签之后。如果没有定义 `default` 标签，则什么都不会发生，程序将继续执行下一个运算符。\n\
  \n### switch 语句与 else-if 链的区别\n在通用性和实用性方面，else-if 链优于 switch 语句，因为可以使用 else-if 链编写每种选择。else-if\
  \ 链的缺点是表达式的整型值需要不断与几个可能的值进行比较。因此，对于这种情况，最好使用 switch 语句。对比给定示例中 else-if 链和 switch\
  \ 语句的可读性，很明显 switch 语句更容易阅读，因此在可能的地方都应该使用。\n\n# 第 6 章：算术数据类型转换\n在编程中，存在彼此不同的算术类型是非常常见的。正如类型不同一样，众所易见，我们无法对属于两种不同算术类型的输入执行数学操作。在处理此类类型时，我们需要将其中一种转换为与另一种相同的类型。在本章中，我们将学习所有关于算术类型转换的约定和规则。\n\
  \n然而，在阅读本章时要注意，因为你会经常发现自己正在处理不同的数据类型（特别是算术类型）。在这种情况下，知道如何处理它们非常重要。此外，数据类型转换是 C++\
  \ 编程中一项非常重要且基础的技能。这是因为大型编程项目通常涉及来自不同源的海量数据流，并且交织在一起。这意味着这种复杂程序的输入和输出在被不同的类、对象和函数使用和重用时，开始形成它们自己的生态系统。因此，在程序中传输的此类数据并不总是正确的类型。这就是为什么实现数据类型转换对于允许程序高效运行至关重要。\n\
  \n在本章中，我们将主要学习隐式类型转换，并在章末尾简要讨论一些类型转换。\n\n### 隐式类型转换\n在进入主要讨论之前，我们需要设定背景。下面所示的几幅图分别突出了提升（promotion）和\
  \ int 类型：\n\n![](img/rsrc2YP.jpg)(整数提升)\n![](img/rsrc2YR.jpg)(int 类型层次)\n\n在许多 C++\
  \ 程序中，我们偶尔会看到包含不同算术类型的单一表达式。同一个表达式中混合的算术类型意味着对应运算符的操作数属于表达式中高亮显示的不同类型。程序在尝试执行相应操作时之所以没有引起错误，是因为由于编译器自动执行了隐式类型转换。\n\
  \n在隐式类型转换中，首先考虑需要执行的操作的要求。这意味着我们首先检查操作所需的类型。所确定的类型是正在进行类型转换的两个类型之间的共同点。一旦决定了可以执行操作的共同类型，两个操作数的值都将被分配该类型。\n\
  \n隐式类型转换的一个通用规则是，较小类型是被进行转换的类型。较小类型通常转换为两个操作数中较大的类型。然而，有一个运算符不受此规则限制，该运算符就是赋值运算符。我们将在章的后续章节中详细讨论赋值运算符。\n\
  \n#### 整数提升\n在这种转换类型中，重点是在原始类型转换为 int 类型时保留其值。例如，包含 True 或 False 值的 bool 类型在通过整数提升转换时，其值将变为“1\
  \ 代表 True”和“0 代表 False”。这样，原始值在进入 int 类型时得到了保留。此外，整数提升类型转换是在以下表达式上执行的：\n\n\n\n\n\
  *   `bool`, `short`, `signed char` 和 `unsigned char`。包含这些类型的表达式会被转换为 `int` 类型。\n\
  *   如果一个表达式是 `unsigned short` 类型，那么只有当它的值大于 `unsigned short` 时，才会被转换为 `int` 类型。如果\
  \ `int` 不大于 `unsigned short` 类型，则它将像其他情况一样转换为 `unsigned int`。\n\n简而言之，C++ 在涉及计算的运算中始终会优先考虑\
  \ `int` 类型的值。例如，假设我们正在比较一个 `char` 变量 `f` 和值‘b’，这些值在执行诸如 `c < 'a'` 的计算之前，会先被转换为 `int`\
  \ 类型。\n\n## 常见的算术类型转换\n\n在某些情况下，即使在执行整数提升类型转换后，操作操作数的算术类型仍然不同，此时我们需要使用 `int` 类型层级执行隐式类型转换。突出显示这种隐式类型转换的图表之前已经过，这里回顾一下层级类型转换的含义。![](img/rsrc2YR.jpg)\n\
  \n在整数提升之后，进一步使用类型层级进行隐式类型转换时，我们主要将两个操作数转换为层级中位置最高的类型。当执行这两种隐式类型转换（整数提升和类型层级）时，它们被统称为“常规算术类型转换”。例如，仔细评估下面所示的类型转换：\n\
  \n```cpp\nshort size(512); double res, x = 1.5;\nres = size / 10 * x; // short ->\
  \ int -> double\n```\n\n在这个示例中，我们正在执行两个数学操作，即除法和乘法。变量 `size` 的原始类型是 `short`。在执行\
  \ `size/10` 中的除法操作之前，`size` 变量的类型从 `short` 提升为 `int`。一旦我们该操作的结果（结果为 50），该结果的类型通过层级隐式类型转换进一步转换为\
  \ `double` 类型。只有当结果的类型转换为 `double` 后，才能与 `x` 执行乘法操作。这是因为 `x` 的值是 `double` 类型，而整数除法产生的值是\
  \ `int` 类型。\n\n通常，“常规算术类型转换”最常用于条件运算符（如 `(?:)`）和所有的二元运算。然而，常规算术类型转换的唯一条件是对应的操作数应该是算术类型。现在让我们来讨论少数可以应用常规算术类型转换的案例。\n\
  \n### 1. 有符号整数的转换\n\n众所周知，整数可以指正数也可以指负数，因此我们需要处理有符号整数转换的两种状态。下面的图准确地演示并详述了正数的转换。![](img/rsrc2YS.jpg)\n\
  \n对于负数（整数）的转换，例如 `-10`，我们首先需要计算这个二进制数的位模式，然后生成一个对应的二进制补码。这一过程在下方所示：![](img/rsrc2YT.jpg)\n\
  \n需要注意的是，如果类型是 `unsigned`，那么负数值的解释可能会发生变化。在接下来的章节中，我们将讨论相对于特定类型的不同类型转换的程序。\n\n###\
  \ 2. 无符号类型转换为更大的整数类型\n\n为了将 `unsigned` 类型转换为更大的整数类型，我们需要执行一个被称为“零扩展（Zero extension）”的过程。在零扩展中，我们获取想要转换的数字并计算其位模式。一旦计算出位模式，我们只需扩展该位模式以匹配其所转换的类型。这是通过简单地在位模式的左侧添加零来实现的。换句话说，零扩展过程涉及通过向数字的位模式添加零来将其扩展，使其尺寸匹配目标类型。例如：`unsigned\
  \ char` 转 `int` 或 `unsigned int`。\n\n### 3. 有符号类型转换为更大的整数类型\n\n首先，我们讨论新类型也是 `signed`\
  \ 的情况。为了表示有符号整数，我们需要生成对应数字的二进制补码。为了在这种情况下保留数字的原始值，我们需要执行一个被称为“符号扩展（Sign extension）”的过程。在符号扩展过程中，通过从左侧填充符号位来扩展整数的原始位模式。例如：`char`\
  \ 转 `int`，`short` 转 `long`。\n\n通过这种方式，位模式被被扩展以匹配目标类型的长度。这一过程在之前的图中也描述过。\n\n现在让我们讨论新类型为\
  \ `unsigned` 的场景。在处理此类整数时，负数的原始值无法被保留或保持。然而，如果我们想要转换的数字的类型具有相同位位模式，那么位模式将被保留，因为不需要进行位模式扩展。但即使位模式被保留，也不意味着它将以相同的方式被解释。在这种情况下，符号位将变得无关紧要，即它将失去重要性。因此，如果类型转换目标比原始类型长，则执行符号扩展以生成一个新的位模式，然后该位模式被解释为无符号。例如：`char`\
  \ 转 `unsigned int`，`long` 转 `unsigned long`。\n\n### 4. 整数类型转换为浮点类型\n\n在这种类型转换中，数字的原始值被保留，同时转换为带有指数的浮点数。然而，在某些情况下，原始数字在转换过程中可能会被舍入。这在将\
  \ `long` 或 `unsigned long` 类型的值转换为 `float` 类型时显而易见。例如：`int` 转 `double`，`unsigned\
  \ long` 转 `float`。\n\n### 5. 浮点类型转换为更大的浮点类型\n\n\n\n\n核心过程保持不变；我们只是将 `float` 类型转换为\
  \ `double` 类型，或将 `double` 类型转换为更大的类型，例如 `long double` 类型，如下所示。在此类转换过程中，数字的原始值会被保留。\n\
  \n## 使用赋值运算符的隐式类型转换\n\n即使我们不熟悉赋值运算符，每个人在探索编程时也遇到过这些运算符。我们在本书中所示的 `C++` 程序中甚至用过赋值运算符。赋值运算符允许你为变量分配一个值。在编程中，该工具有几种简写形式和操作数，但最常见的是等号（`=`）。\n\
  \n在本节中，我们将讨论如何在赋值过程中进行隐式类型转换。你可能会发现很有趣，在赋值过程中，算术类型也会参与其中。从某种意义上说，编译器充当了媒介的角色，平衡赋值操作数的左右两侧。换句话说，赋值运算符右侧的值类型会被调整，以匹配赋值运算符左侧的值类型。\n\
  \n然而，并不是所有的赋值都像 `x = 2` 那么简单。赋值还可能包含多个语句（包括许多计算操作等）和复杂的结构。此类赋值被称为“复合赋值”。因此，在复合赋值中，处理过程是首先使用常规算术类型转换处理所需的计算。一旦处理完毕，就会执行类型转换。\n\
  \n无论如何，程序员在赋值的类型转换中极有可能遇到以下两种特殊场景。它们列在下方：\n\n1. 在赋值中，如果变量的类型被认为高于或大于它应该被赋值的值的类型，则该值的类型必须被提升（promote）以匹配变量的类型。对于这类转换，我们遵循“常规算术类型转换”（Usual\
  \ Arithmetic Types Conversion）过程中定义的规则。例如：\n\n```cpp\nint i = 100;\nlong lg = i\
  \ + 50; // int 类型的结果转换为 long\n```\n\n2. 在赋值中，如果值的类型被认为高于或大于它被赋值到的变量的类型，那么我们不是提升变量的类型，而是必须相应地降低（demote）值的类型。根据具体情况，以下步骤涵盖了赋值期间此类转换中大多数遇到的情况：\n\
  \n   - 对于将整数类型转换为较小类型，我们必须考虑符号和无符号整类型转换的两种不同情况。首先，将 `int` 类型转换为较小类型时，只需从位模式中删除最高位字节（字节）。如果生成的类型也是无符号的，则生成的位模式将被解释为无符号。如果生成的类型是有符号的，则位模式将简单地解释为“符号”。然而，只有当新类型能够表示该数值时，数字的原始值才会保留。该过程的示例所示：\n\
  \n```cpp\nlong lg = 0x654321; short st;\nst = lg; // 0x4321 被赋值给 st。\n```\n\n  \
  \ 然而，如果我们是将无符号类型转换为符号类型，那么原始位模式保持不变，该位模式将简单地解释为“符号”。例如：\n\n```cpp\nint i = –2; unsigned\
  \ int ui = 2;\ni = i * ui; // 首先将 i 中包含的值转换为 unsigned int（保留位模式）并乘以 2（溢出！）。\n  \
  \         // 在赋值位模式时，结果再次被解释为 int 值，\n           // 即在 i 中存储了 –4。\n```\n\n   - 对于将将浮点类型转换为整数类型，我们只需要移除浮点数值的小数部分。例如，如果我们想转换浮点数\
  \ `2.9`，则只需移除 `.9` 部分并舍入原始数字。舍入可以通过如果浮点数是正数则给其加上 `0.5`，如果是负数则减去 `0.5` 来完成。因此，在例例的情况下，通过移除小数部分，我们得到了整数\
  \ `2`。然而，在舍入后（`2.9 + 0.5`），浮点值被转换为整数 `3`。然而，这种类型转换的结果有时可能是不可预测的，特别是当生成的 `int` 类型结果值对于该类型本身来说太大或太小时。这在将负浮点类型值转换为\
  \ `unsigned int` 类型时显而易见。例如：\n\n```cpp\ndouble db = –4.567; int i; unsigned int\
  \ ui;\ni = db;      // 赋值 –4。\ni = db - 0.5; // 赋值 –5\nui = db;     // –4 与 ui 不兼容。\n\
  ```\n\n   - 我们现在将讨论程序员想要将属于浮点类型的值转换为较小类型的情况。在这种类型转换中，可能会有两种结果。一种是，如果浮点数值对应于该目标类型的指定范围，则该数字的原始值将被保留，代价是牺牲数字的准确性。另一方面，如果浮点数在目标类型的范围之外（即该值太大以至于该类型无法表示），那么最终结果将是不可预测的。浮点类型转换为较小类型的转换示例所示：\n\
  \n\n\n\n\n```cpp\ndouble d = 1.23456789012345;\nfloat f;\nf = d; // 1.234568 is\
  \ assigned to f.\n```\n\n## 其他类型转换\n\n到目前为止，我们主要讨论了隐式类型转换，虽然它们在基础 C++ 编程中更为常见，但还有其他类型的转换也值得讨论。在本节中，我们将讨论函数调用中的隐式类型转换，以及一种我们目前还没有讨论过的新类型转换：`显式类型转换`。\n\
  \n## 在函数调用中使用隐式类型转换\n\n我们已经在本书的第二章中讨论过函数调用，如果你对本节中关于函数调用的内容不理解，请参阅介绍该概念的主题。\n\n\
  函数调用中的隐式类型转换工作原理与赋值中的隐式类型转换处理非常相似。这是因为在函数调用中，传递给函数的参数算术类型被转换为函数原型中指定的类型。通过这种方式，原型函数的参数得到了遵循和保留。例如：\n\
  \n```cpp\nvoid func( short, double); // Prototype\nint size = 1000; // . .\nfunc(\
  \ size, 68); // Call\n```\n\n在这个示例中，你可以看到 `func()` 函数有两个参数，其参数已经在开头的函数原型中定义。这些参数本应该是\
  \ `short` 和 `double` 类型。然而，在实际函数调用中，你可以看到使用的参数都是 `int` 类型。在这种情况下，将通过隐式类型转换将 `int`\
  \ 值 `size` 转换为 `double` 类型，并将整数 `68` 转换为 `double` 类型值。注意，当发生特定示例发生隐式类型转换时，编译器会发出警告。此警告的主要目的是提醒用户，由于从\
  \ `int` 类型转换为 `short` 类型，存在数据丢失的可能。为了避免此类警告，我们可以选择执行显式类型转换。\n\n## 显式类型转换\n\n顾如名，在此类型转换中，我们利用强制转换符\
  \ `(type)` 的功能显式地转换表达式类型。换句话说，我们使用强制转换符来执行显式类型转换。其语法所示：\n\n`(type) expression`\n\
  \n根据此语法，我们直接将赋值给表达式的值转换为指定的类型。因此，显式类型转换也常被称为“强制转换”（casting），该运算符也是以这一过程命名的。\n\n\
  由于强制转换符 `(type)` 本质上是一个一元运算符，它的优先级高于 C++ 中传统的算术运算符。让我们通过一个例子来理解显式类型转换。\n\n```cpp\n\
  int a = 1, b = 4;\ndouble x;\nx = (double)a/b;\n```\n\n在这个示例中，我们可以看到赋值给变量 `a` 的值已显式地从\
  \ `int` 类型转换为 `double` 类型。另一个变量没有执行显式类型转换，是因为它的类型将由编译器通过隐式类型转换自动转换为匹配 `double` 类型。在执行隐式类型转换后，编译器将执行浮点除法操作，得到的精确结果为\
  \ `0.25`。该值最终通过赋值运算符赋值给变量 `x`。注意，如果我们在此示例中不执行强制转换，那么程序将执行一个简单的整数除法操作，它得到的结果将是 `0`，这显然是错误的。\n\
  \n本节讨论的用于显式类型转换的强制转换符是通用的。在 C++ 中，还有其他可用运算符（例如 `dynamic_cast<>`）可以用于显式类型转换，但那些仅用于特定情况。\n\
  \n# 第 7 章：C++ 中引用和指针的使用\n\n在本章中，我们将学习引用和指针，它们在编程中作为参数的使用，以及函数返回的值。关于引用和指针的讨论将主要关注通过引用传递和只读访问参数。\n\
  \n## 定义引用\n\n内存中特定位置已存在的变量或对象被赋予另一个名称或别名，这就是它的引用。因此，可以使用原始名称或引用来访问该变量。为对象定义引用并不意味着它会在程序中占用额外的内存。定义的引用将与其所引用的对象一起执行操作。\n\
  \n引用的一种特殊用途是它们作为参数，处理函数的结果并返回其值。\n\n引用用取地址符号 `&` 表示，`T&` 是类型 `T` 的引用。\n\n示例：\n```cpp\n\
  float x = 10.7;\nfloat & rx = x; // or: float & rx = x;\n```\n\n这里清楚地显示 `rx` 被用作变量\
  \ `x` 的另一种表达方式，这种引用被称为“float 引用”。\n\n示例：\n```cpp\n--rx; // 等于 --x;\n```\n\n在上面的示例中，详细说明了涉及\
  \ `rx` 的操作也将影响变量 `x`。用于表示引用的字符 `&` 仅与声明有关，与地址运算符不同。地址运算符用于求值并返回任何对象的地址。如果它与引用结合使用，则最终返回对象的地址。\n\
  \n示例：\n```cpp\n&rx\n```\n\n在定义对象的引用时，必须在声明之前对其初始化，且不能在后期进行修改。\n\n## 只读引用\n\n如果为常量变量定义引用，应该使用\
  \ `const` 关键字，以避免通过引用对对象的修改。然而，非常量对象也可以有常量引用。\n\n示例：\n```cpp\nint a;\nconst int\
  \ & cref = a;\n```\n引用 `cref` 是只读标识符，提供了对前例变量 `a` 的只读访问。与普通引用相比，只读标识符可以通过常量初始化。\n\
  \n示例：\n`const double& pi = 3.1415927;` 常量占用内存，因此编译器生成的临时对象会被引用。\n\n## 作为参数的引用\n\n\
  内存中特定位置已存在的变量或对象被赋予另一个名称或别名，这就是它的引用。因此，可以使用原始名称或引用来访问该变量。为对象定义引用并不意味着它会在程序中占用额外的内存。定义的引用将与其引用的对象一起执行操作。引用的一种特殊用途是它们作为参数，处理函数的结果并返回其值。\n\
  \n## 作为返回值的引用\n\n当函数的返回类型使用引用时，函数调用将代表一个对象并作为一个对象作用。\n\n示例：\n```cpp\nstring& message()\
  \ {\n    static string str = \" Today only cuts \";\n    return str;\n}\n```\n\n\
  上面的函数中，返回的是 `static string`，它不是函数中的普通变量。将其声明为这样是一个严重错误，因为字符串在程序离开相应的函数后会被销。因此，重要的是在离开函数后，返回值所引用的对象不能被销。\n\
  \n## 调用引用类型函数\n\n函数 `message()` 被定义为表示 `string` 引用的类型，因此调用 `message()` 代表一个 `string`\
  \ 类型对象。函数 `message()` 的一些有效语句有：\n\n```cpp\nmessage() = \"Let's go to the beer garden!\"\
  ;\nmessage() += \" Cheers!\";\ncout << \"Length: \" << message().length();\n```\n\
  \n其他引用类型运算符\n\n简单的赋值运算符 `=` 和复合赋值运算符 `+=` 和 `*=` 也被用作引用类型运算符，位于左侧的操作接收返回的引用值。考虑以下表达式：\n\
  \n`a = b` 或 `a += b`\n\n变量 `a` 被视为对象，表达式表示该对象 `a`。这对于运算符引用的类类型对象也是可能的，例如在标准类 `string`\
  \ 中定义赋值运算符 `=` 和 `+=` 的示例。\n\n示例：\n```cpp\nstring name ( \"Johnny \" );\nname +=\
  \ \"Depp\"; // 对 name 的引用\n```\n\n可以将此表达式作为参数传递给引用传递函数，因为它是表示对象的类型。\n\n## 定义指针\n\
  \n```cpp\n// pointer1.cpp\n// 打印变量的值和地址。\n// --------------------------------------------------\n\
  #include <iostream>\nusing namespace std;\nint var, *ptr; // 变量 var 和 ptr 定义\nint\
  \ main() {\n    // ...\n}\n```\n\n## 指针\n\n```cpp\n// pointer1.cpp\n// 打印变量的值和地址。\n\
  // --------------------------------------------------\n#include <iostream>\nusing\
  \ namespace std;\nint var, *ptr; // 变量 var 和 ptr 定义\nint main() {\n    var = 10;\n\
  \    ptr = &var;\n    cout << \"Value of var: \" << endl;\n    cout << \"Address\
  \ of var: \" << endl;\n    cout << \"Value via ptr: \" << endl;\n    return 0;\n\
  }\n```\n\n\n\n\n\n- 每个指针变量所占据的内存空间不取决于它所引用的对象的类型，且它们是相同的，因为指针只存储每个对象的地址。在 32 位计算机上，指针变量通常占用四个字节。\n\
  - 程序中使用逻辑地址，这些地址在系统的帮助下被分配到物理地址。通过这种方式，存储管理可以变得高效，并且当前未使用的内存块会被交换到硬盘上。\n- 当 C++\
  \ 中的有效地址显示值为 0 时，它表示存在一个错误，因为没有地址的值为 0。在标准头文件中，指针使用符号常量 `NULL` 代替 0，这些指针被称为 `NULL`\
  \ 指针`。\n\n## 使用指针访问对象\n\n当一个变量指向一个对象时，我们可以通过星号（间接操作符）来访问该对象。但我们不应该将变量和对象彼此混淆。`ptr`\
  \ 是变量，而 `*ptr` 是对象。\n\n示例：\n```cpp\nlong a = 10, b;     // 定义 a, b\n*ptr;      \
  \         // 还有指针 ptr。\nptr = &a;           // 让 ptr 指向 a。\nb = *ptr;\n```\n在上面的示例中，我们可以看到\
  \ `ptr` 指向变量 `a`。另外，注意在开始时，`a` 的值被赋值给另一个变量 `b`。因此，最后我们也可以用变量 `a` 替换变量 `b`，因为它们都代表相同的内容，即对象\
  \ `a`。\n\n`long *ptr;`\n上面的表达式意味着 `ptr` 是 `long*` 类型，这是一个指向 long 类型的指针。同样，也可以说 `*ptr`\
  \ 是 long 类型。\n\n## 左值 (L-values)\n\nC++ 中的左值（L-value）是指定内存位置以标识对象的表达式类型。左值源于赋值操作符，并出现在编译错误信息中。因此，赋值运算符\
  \ `=` 的左侧操作数始终指定一个存储在内存中的地址是非常重要的。\n\n除了左值以外的、无法被赋值的表达式只出现在赋值运算符 `=` 的右侧，并称为右值（R-values）。在语句中，变量是左值，而常量和如\
  \ `x+1` 等表达式是右值。左值也会通过间接操作符作为结果返回。考虑指针变量 `p`，那么 `p` 和 `*p` 都是左值，因为 `*p` 是变量 `p`\
  \ 所指向的对象。\n\n## 指针作为参数\n\n接下来的程序演示了指针作为参数的实现。![](img/rsrc2YX.jpg)\n\n## 对象作为参数\n\
  \n当调用一个函数并将一个对象作为参数传递给所需的函数时，可能发生的情况如下：\n\n- 函数参数与传递给它的参数对象类型相同。因此，被调用的函数接收的是对象的副本（按值传递）。\n\
  - 函数参数是一个引用，这意味着该参数是参数的别名。被调用的函数随后操作由调用函数传递给它的对象（按引用传递）。\n\n在按值传递中，显而易见的是接收参数的函数无法操作它，但在使用“按引用传递”时这是可能的。另一方面，与引用传递相关的第三种情况是将指针传递给所需的函数。\n\
  \n## 指针作为参数\n\n当函数参数被声明为指针变量时，可以以这种方式声明函数，将地址作为参数传递给函数。例如，通过语句：\n\n```cpp\nlong\
  \ func( int *iPtr ){// 函数体}\n```\n参数 `iPtr` 被声明为 int 指针，因此 int 值的地址可以作为参数传递给函数 `func()`。只有当函数知道该对象的内存地址时，才能通过间接操作符访问并操作该对象。\n\
  \n示例程序中显示的 `swap()` 函数用于交换调用函数中变量 `x` 和 `y` 提供的值。变量的地址 `&x` 和 `&y` 已经作为参数传递给函数，这使得函数能够访问并操作这些变量。\n\
  \n`swap` 函数包含两个参数 `p1` 和 `p2`，它们被声明为 float 指针。这些指针通过给定的语句用变量 `x` 或 `y` 的地址进行初始化：\n\
  `swap(&x, &y);`\n\n通过操作表达式 `*p1` 和 `*p2`，该函数可以访问调用函数中可用的变量 `x` 和 `y`。这样，它们的值就可以进行交换。\n\
  \n\n\n\n\n# 第 8 章：C++ 文件输入与输出基础\n\n在本书的前几章中，我们简要讨论了 `iostream` 库（也称为输入输出库），它的特点是顺序文件访问流类。在本章中，我们将基于这一基础概念继续讨论，并对其进行更详细、更深入的探索。理解文件流在编程中非常重要，因为它们是练习可移植文件处理技术的门径。此外，文件操作是构建\
  \ C++ 程序的最基础任务之一。正如函数、类、对象和变量共同构成了程序的基本结构一样，文件流也提供了一种将数据从程序内部存储到外部存储设备的结构化表示。这是一个非常重要的过程，因为程序主要将其数据存储在易性系统内存中。因此，当我们关闭程序时，这种易性存储器中的数据会立即丢失。这就是为什么我们需要某些技术不仅将数据从程序输出到持久性存储，还能将数据输入程序中。\n\
  \n## 文件的基本概念\n\n在讨论文件流之前，我们必须首先理解文件操作和文件位置的概念。\n\n### 文件操作\n正如单个字符或整个字符串可以作为输出显示在屏幕上一样，字符也可以写入文本文件并表示这些数据。现在，我们来聊聊记录（Record）。记录是一个指代包含逻辑单元数据的文件的统术语。通常，记录存储在文件中。这是通过\
  \ `write` 操作实现的，该操作处理了虚拟地将指定记录存储到指定文件的过程。如果文件已存在记录，`write` 操作将更新已存在的记录，或者简单地在原有记录旁边向文件添加一条新记录。当我们想要访问存储在文件中记录的内容时，我们发出了一个\
  \ `read` 命令，该命令获取记录的内容并将其复制到程序定义的数据结构中。\n\n同样，对象也可以存储在系统的持久性存储中，而不是易性存储器中。然而，这个过程与存储和读取记录文件并不相同，因为我们需要的不仅仅是存储对象本身的内部数据。在存储对象时，我们需要确保在发出\
  \ `read` 命令时，对象及其数据能够被准确地重建。为了这个目的，我们不仅需要存储对象的类型信息，还需要存储对其他对象的引用。\n\n必须记住的是，所有的外部存储设备（例如硬盘）都具有基于块的存储结构。这种基于块的存储特性意味着数据是以块为形式存储在设备中的，且这些块的大小始终是\
  \ 512 字节的倍数。高效且简单的文件管理指的是将你需要存储的数据传输到主内存的临时存储中，这被称为“文件缓冲区（file buffer）”。这里是该概念的视觉表示图![](img/rsrc2YY.jpg)\n\
  \n### 文件位置\n在 C++ 程序中，文件被解释为一个巨大的字节数组。记住这一点，该文件的结构化元素完全由程序员负责处理。文件结构为程序员提供了多少灵活性，取决于他如何构建文件本身。\n\
  \n在文件中，有许多由字节表示的字符。文件中的每个字节都持有一个特定的位置。例如，文件的第一个字节被分配位置 0，下一个字节被分配位置 1，依此类推。由于文件具有的这种特性，出现了一个非常重要的术语，即所谓的“当前文件位置（current\
  \ file position）”。这指的是分配给下一个要从文件中写入或读取的字节的位置。因此，每当向文件添加新字节时，当前文件位置就会根据 1 的值正向移动（增加）。\n\
  \n在顺序访问中，情况略有不同。众所知道，“顺序（sequential）”一词意味着“按顺序或遵循顺序”，写入或读取文件的数据是以固定且定义的顺序完成的。换句话说，程序员可以读取或写入数据有一个定义的序列，并且无法偏离这个序列。因此，如果你对文件执行第一次\
  \ `read` 操作，程序将从文件的最开始处读取。这意味着，如果你想访问位于文件中的某个特定信息，你将必须经过整个序列，即从开始一直向下滚动文件内容，直到找到你正在寻找的内容。在写操作方面，与读操作相比，它们拥有更大的自由度，因为它们可以轻松地创建新文件、覆盖现有文件或向现有文件添加新数据。\n\
  \n相比之下，随机文件访问（random file access）意味着我们可以访问或读取文件的任何部分，而不需要在任何时候遵循序列。这允许对文件内容进行瞬时访问。便捷访问文件的概念指的是这种随机访问技术，程序员可以根据需要自由指定当前文件位置。\n\
  \n### 文件流类\n在 C++ 中，有几个为了文件管理目的而标准化的类。这些类通常“文件流类（file stream classes）”，为程序提供了方便的文件处理功能。这里有一个突出了一些最常用的文件流类及其相互之间关系的流程图![](img/rsrc2YZ.jpg)\n\
  \n尽管作为程序员，你需要考虑文件管理类并正确地实现它们，但在编程过程中，你不需要担心文件管理中的缓冲区管理甚至是系统特定的细节。\n\n在 C++ 中，主要的流流类已经标准化，允许程序员具有开发可移植\
  \ C++ 程序的自由和能力。这里的可移植不是像笔记本电脑或智能手机那样便于携带。编程中的可移植意味着特定的程序可以轻松地移植到其他平台，如 Windows 或\
  \ Unix。因此，标准化的文件流类让程序员更容易开发可以移植到其他平台的程序。只需要对每个使用的平台进行简单的重新编译。\n\n## 属于 iostream\
  \ 库的文件流类\n\n如果你参考上一节中显示的文件流类层级关系图，我们可以看到这一族类有一些被称为“基类（base classes）”。基类是从其他类派生出来的类。换句话说，我们可以通过将基类记忆为可以创建其他类的“父类”来理解它们；但是，“基类”是正式的编程术语。我们在本书演示的程序中使用了一些这些基类。以下是哪个类派生自哪个父类的说明：\n\
  \n* `istream` 是 `ifstream` 类的基类。换句话说，`ifstream` 类派生自 `istream` 类。`ifstream` 类的目的是允许文件读取操作。\n\
  * `ostream` 是 `ofstream` 类的基类。换句话说，`ofstream` 类是从 `ostream` 类创建的，其目的是支持文件的写入操作。\n\
  \n\n\n\n\n-   `iostream` 类是 `fstream` 的父类。换句话说，`fstream` 类是基于 `iostream` 类创建的，其目的是支持文件的读取和写入等操作。\n\
  \n因此，作为文件流类一部分的对象被称为“文件流（file stream）”。标准文件流类定义在一个名为 `fstream` 的头文件中，为了在程序中使用这些类，我们必须使用\
  \ `#include` 指令将该头文件添加到程序中。\n\n## 文件流类的功能\n每当我们从基类创建一个文件流类时，新派生的派生类也会继承其父类的所有功能。通过这种方式，方法、操作符，甚至针对\
  \ `cin` 和 `cout` 的操纵符等类功能对变得可用。因此，每个文件流类都具有以下功能特性：\n\n-   专门针对单个字符和数据块的非格式化读/写操作方法。\n\
  -   用于对文件进行格式化读/写操作的操作符（`<<` 和 `>>`）。\n-   为格式化字符序列定义的方法和操纵符。\n-   定义用于状态查询等任务的方法。\n\
  \n## 通过 C++ 程序创建文件\n让我们来看一个演示创建文件流的程序，然后对其进行拆解并理解这一概念的基础。\n\n```cpp\n// showfile.cpp\n\
  // 读取一个文本文件并分页输出，\n// 即每页 20 行。\n// 调用：showfile filename\n// ----------------------------------------------------\n\
  #include <iostream>\n#include <fstream>\nusing namespace std;\nint main( int argc,\
  \ char *argv[]){\n    if( argc != 2 )                             // 是否声明了文件？\n\
  \    {\n        cerr << \"Use: showfile filename\" << endl;\n        return 1;\n\
  \    }\n    ifstream file( argv[1]);                    // 创建文件流并打开以读取。\n    if(\
  \ !file )                                 // 获取状态。\n    {\n        cerr << \"An\
  \ error occurred when opening the file \"<< argv[1] << endl;\n        return 2;\n\
  \    }\n    char line[80];\n    int cnt = 0;\n    while( file.getline( line, 80))\
  \            // 复制文件\n    {\n        cout << line << endl;              // 输出。\n\
  \        if( ++cnt == 20){\n            cnt = 0;\n            cout << \"\\n\\t ----\
  \ <return> to continue ---- \" << endl;\n            cin.sync(); cin.get();\n  \
  \      }\n    }\n    if( !file.eof() ) // 是否发生文件结束？\n    {\n        cerr << \"Error\
  \ reading the file \"<< argv[1] << endl;\n        return 3;\n    }\n    return 0;\n\
  }\n```\n\n## 打开文件\n在程序中继续操作文件之前，我们首先需要打开并访问它。要打开一个文件，我们需要执行两个基本操作：\n\n-   说明文件的名称以及其在系统持久性存储中所在的目录或路径。\n\
  -   定义一个与我们想要打开的文件对应的文件访问模式。\n\n如果我们想要打开的文件没有显式说明目录或路径，这意味着该文件应该位于程序的当前目录下。文件访问模式指定了授予用户对该文件的读取和写入权限。这意味着，如果文件访问模式定义为只读，那么我们只能访问文件的内容，而不能修改它。当程序终止时，所有与其关联的打开文件也会被关闭。\n\
  \n## 定义文件流\n当我们创建文件流时，也可以同时打开文件。这样做的话，我们只需要指定文件的特定名称。本节开头演示的程序使用默认值来定义文件访问模式。\n\n\
  ```cpp\nifstream myfile(\"test.fle\");\n```\n\n在这一语句中，由于我们没有为文件 `test.file` 指定任何特定的目录或路径，这告诉程序文件必须位于相同目录。文件通过\
  \ `ifstream` 类的构造函数打开以执行读取操作。一旦在程序中打开了文件，当前文件位置将指定在文件的开头。\n\n此外请注意，如果你指定了只写文件模式访问，那么实际文件甚至不需要在系统中存在。如果对于只写访问模式没有与文件名对应的文件，则程序将创建一个具有此指定名称的新文件。\n\
  \n```cpp\nofstream myfile(\"new.fle\");\n```\n\n（注：由于原文中存在大量重复的示例段落，根据“不要重复输出原文”的原则，此处仅保留核心逻辑翻译，后续重复的说明已合并精简处理。）\n\
  \n## 打开文件时的模式\n在本节中，我们将讨论可以与构造函数以及 `open()` 方法一起使用的打开模式。但在研究这个概念之前，让我们先理解打开模式的不同标志。下面显示了打开模式标志及其对应功能的表格：\n\
  \n| 标志 | 功能 |\n| :--- | :--- |\n| `ios::in` | 打开现有文件进行输入 |\n| `ios::out` | 打开文件进行输出。如果未与\
  \ `ios::in` 或 `ios::app` `ios::ate` 标志之一组合，此标志意味着 `ios::trunc` |\n| `ios::app` |\
  \ 在文件末尾打开文件进行输出 |\n| `ios::trunc` | 将现有文件截断为零长度 |\n| `ios::ate` | 打开立即跳转到末尾。如果没有此标志，打开后的起始位置始终在文件开头\
  \ |\n| `ios::binary` | 以二进制模式执行输入输出。 |\n\n（标志解释引用自 Ulla Kirch-Prinz 和 Peter Prinz\
  \ 的《A Complete Guide To Programming in C++》）。重要的是，上述所有标志已定义在 `ios` 基类中（它是其他文件流类的父类）。此外，所有这些文件流类都是\
  \ `ios::openmode` 类型。\n\n### 打开文件的默认设置\n每当我们打开一个文件时，文件流类构造函数和 `open()` 方法使用的默认值是：\n\
  \n| 类 | 标志 |\n| :--- | :--- |\n| `ifstream` | `ios::in` |\n| `ofstream` | `ios::out\
  \ \\| ios::trunc` |\n| `fstream` | `ios::in \\| ios::out` |\n\n\n\n\n\n如果你想在不使用构造函数和\
  \ `open()` 方法分配默认值的情况下打开文件，那么我们需要向程序提供两个要素：文件名和打开模式。对于以只写访问模式打开目录中已存在的文件且不删除原始文件来说，这是绝对的必要要求。\n\
  \n### 理解打开模式标志位（Open Mode Flags）\n\n我们可以向 `fstream` 流类的构造函数以及 `open()` 方法传递文件名之外，额外传递一个打开模式参数。这是因为文件的打开模式取决于标志位（flags）。\n\
  \n在编程中，标志位由单个位表示。如果标志位被标记，则其值为‘1’；如果标志位未被标记，则其值为‘0’。\n\n标志位中的另一个重要元素是位运算符 `|`。该运算符通常用于组合不同的标志位。然而，在所有情况下都应该说明\
  \ `ios::in` 或 `ios::out` 这两个标志位之一。这是因为如果在打开程序时标记了 `ios::in` 标志位，它告诉系统文件已存在，反之亦然。如果我们在打开文件时不使用\
  \ `ios::in` 标志位，当该文件在目录中不存在时，程序将创建该文件。\n\n在以下语句中：\n```\nfstream addresses(\"Address.fle\"\
  , ios::out | ios::app);\n```\n我们正在打开一个名为“Address.fle”的文件，如果它在目录中不存在，则会被创建。根据该语句中使用的标志位和文件流类，该文件是以在文件末尾进行写入的操作打开的。在每次写入操作完成后，文件会自动增长。\n\
  \n此外还有一种更新模式，允许我们打开文件并将数据追加到现有内容中，或更新现有数据，这通常用于随机文件访问模式。这是通过使用 `fstream` 类的默认模式\
  \ `(ios::in | ios::out)` 实现的，它允许用户打开一个已存在的文件进行读和写操作。\n\n### 错误处理\n\n在打开文件时遇到错误是一个常见现象。这可能是由于多种原因导致的，最常见的原因是你没有访问该文件所需的权限，或者文件根本不存在。为了处理可能发生的任何错误，我们实现了一个标志位\
  \ `failbit` 来监控操作状态。该标志位来自基类 `ios`，如果发生了错误，该标志位就会被标记。查询标志位也非常简单。我们可以使用 `fail()`\
  \ 方法直接查询标志位，或者通过使用 `if` 条件判断来间接查询文件流的状态。例如：\n\n```\nif( !myfile)             //\
  \ 或: if( myfile.fail())\n```\n当读或写操作发生错误时，`failbit` 标志位也会被标记。然而，并不是每个错误都意味着严重故障或某种问题。例如，如果程序遇到读取错误，这可能意味着程序已经读取了文件的所有内容，没有剩余可读的内容了。在这种情况下，我们通过使用文件结束方法（实际上称为\
  \ `eof()`）来正确识别读取错误的性质。我们可以通过像下面所示的方法查询 `eof` 位，将此类正常读取错误与其他类型的阻碍读取的错误区分开来：\n\n\
  ```\nif( myfile.eof())       // 是否到达文件末尾？\n```\n\n### 关闭文件\n\n建议每当我们完成文件操作或结束了文件处理任务时，必须始终关闭文件。这种做法的有效性得到了广泛支持，主要原因有两点：\n\
  \n- 如果程序没有正常终止，程序打开的文件可能会导致数据丢失。\n- 程序无法同时打开大量文件；同时打开的文件数量是有限制的。因此，我们应该正确关闭未在使用的文件，以避免程序中出现任何错误。\n\
  \n\n\n\n一个正常终止的程序会自动关闭与其关联的任何打开的文件。然而，在某些情况下，程序并没有正常终止。为了避免这些不可预见的情况，在文件不再被使用时直接关闭它们是非常重要的。这里有一个演示了目前为止讨论的概念的程序：\n\
  \n```cpp\n// fcopy1.cpp : 拷贝文件。\n// 调用: fcopy1 源 [ 目标 ]\n// ----------------------------------------------------\n\
  #include <iostream>\n#include <fstream>\nusing namespace std;\n\ninline void openerror(\
  \ const char *file){\n    cerr << \"Error on opening the file \" << file << endl;\n\
  \    exit(1); // 结束程序并                                     // 所有已打开的文件。\n\nvoid\
  \ copy( istream& is, ostream& os); // 原型\n\nint main(int argc, char *argv[]){\n\
  \    if( argc < 2 || argc > 3){\n        cerr << \"Call: fcopy1 source [ destination\
  \ ]\"<< << endl;\n        return 1; // 或: exit(1);\n    }\n    ifstream infile(argv[1]);\
  \ // 打开第一个文件\n    if( !infile.is_open())openerror( argv[1]);\n    if( argc == 2)\
  \ // 只有一个源文件。\n        copy( infile, cout);\n    else // 源和目标\n    {\n        ofstream\
  \ outfile(argv[2]); // 打开第二个文件\n        if( !outfile.is_open() )openerror( argv[2]);\n\
  \        copy( infile, outfile);\n        outfile.close(); // 没有必要。\n    }\n   \
  \ infile.close(); // 没有必要。\n    return 0;\n}\n\nvoid copy( istream& is, ostream&\
  \ os) // 将其拷贝到 os.{\n    char c;\n    while( is.get(c) )os.put(c); // 或: os << c\
  \ ;\n}\n```\n\n### `close()` 和 `is_open()` 方法\n注意，在演示的程序中使用的每个文件流类都定义了一个类型为 `void`\
