  trans: "\n核心过程保持不变；我们只是将 `float` 类型转换为 `double` 类型，或将 `double` 类型转换为更大的类型，例如 `long\
    \ double` 类型，如下所示。在此类转换过程中，数字的原始值会被保留。\n\n## 使用赋值运算符的隐式类型转换\n\n即使我们不熟悉赋值运算符，每个人在探索编程时也遇到过这些运算符。我们在本书中所示的\
    \ `C++` 程序中甚至用过赋值运算符。赋值运算符允许你为变量分配一个值。在编程中，该工具有几种简写形式和操作数，但最常见的是等号（`=`）。\n\n在本节中，我们将讨论如何在赋值过程中进行隐式类型转换。你可能会发现很有趣，在赋值过程中，算术类型也会参与其中。从某种意义上说，编译器充当了媒介的角色，平衡赋值操作数的左右两侧。换句话说，赋值运算符右侧的值类型会被调整，以匹配赋值运算符左侧的值类型。\n\
    \n然而，并不是所有的赋值都像 `x = 2` 那么简单。赋值还可能包含多个语句（包括许多计算操作等）和复杂的结构。此类赋值被称为“复合赋值”。因此，在复合赋值中，处理过程是首先使用常规算术类型转换处理所需的计算。一旦处理完毕，就会执行类型转换。\n\
    \n无论如何，程序员在赋值的类型转换中极有可能遇到以下两种特殊场景。它们列在下方：\n\n1. 在赋值中，如果变量的类型被认为高于或大于它应该被赋值的值的类型，则该值的类型必须被提升（promote）以匹配变量的类型。对于这类转换，我们遵循“常规算术类型转换”（Usual\
    \ Arithmetic Types Conversion）过程中定义的规则。例如：\n\n```cpp\nint i = 100;\nlong lg =\
    \ i + 50; // int 类型的结果转换为 long\n```\n\n2. 在赋值中，如果值的类型被认为高于或大于它被赋值到的变量的类型，那么我们不是提升变量的类型，而是必须相应地降低（demote）值的类型。根据具体情况，以下步骤涵盖了赋值期间此类转换中大多数遇到的情况：\n\
    \n   - 对于将整数类型转换为较小类型，我们必须考虑符号和无符号整类型转换的两种不同情况。首先，将 `int` 类型转换为较小类型时，只需从位模式中删除最高位字节（字节）。如果生成的类型也是无符号的，则生成的位模式将被解释为无符号。如果生成的类型是有符号的，则位模式将简单地解释为“符号”。然而，只有当新类型能够表示该数值时，数字的原始值才会保留。该过程的示例所示：\n\
    \n```cpp\nlong lg = 0x654321; short st;\nst = lg; // 0x4321 被赋值给 st。\n```\n\n\
    \   然而，如果我们是将无符号类型转换为符号类型，那么原始位模式保持不变，该位模式将简单地解释为“符号”。例如：\n\n```cpp\nint i = –2;\
    \ unsigned int ui = 2;\ni = i * ui; // 首先将 i 中包含的值转换为 unsigned int（保留位模式）并乘以 2（溢出！）。\n\
    \           // 在赋值位模式时，结果再次被解释为 int 值，\n           // 即在 i 中存储了 –4。\n```\n\n \
    \  - 对于将将浮点类型转换为整数类型，我们只需要移除浮点数值的小数部分。例如，如果我们想转换浮点数 `2.9`，则只需移除 `.9` 部分并舍入原始数字。舍入可以通过如果浮点数是正数则给其加上\
    \ `0.5`，如果是负数则减去 `0.5` 来完成。因此，在例例的情况下，通过移除小数部分，我们得到了整数 `2`。然而，在舍入后（`2.9 + 0.5`），浮点值被转换为整数\
    \ `3`。然而，这种类型转换的结果有时可能是不可预测的，特别是当生成的 `int` 类型结果值对于该类型本身来说太大或太小时。这在将负浮点类型值转换为 `unsigned\
    \ int` 类型时显而易见。例如：\n\n```cpp\ndouble db = –4.567; int i; unsigned int ui;\ni =\
    \ db;      // 赋值 –4。\ni = db - 0.5; // 赋值 –5\nui = db;     // –4 与 ui 不兼容。\n```\n\
    \n   - 我们现在将讨论程序员想要将属于浮点类型的值转换为较小类型的情况。在这种类型转换中，可能会有两种结果。一种是，如果浮点数值对应于该目标类型的指定范围，则该数字的原始值将被保留，代价是牺牲数字的准确性。另一方面，如果浮点数在目标类型的范围之外（即该值太大以至于该类型无法表示），那么最终结果将是不可预测的。浮点类型转换为较小类型的转换示例所示：\n\
    \n"
- fmt: "\n```cpp\ndouble d = 1.23456789012345;\nfloat f;\nf = d; // 1.234568 is assigned\
    \ to f.\n```\n\n## Other Type Conversions\n\nUntil now, we have chiefly discussed\
    \ implicit type conversions, and while their use is more prevalent for fundamental\
    \ C++ programming, there are other types of conversions as well that are worth\
    \ discussing. In this section, we will talk about implicit type conversions in\
    \ terms of function calls and a new type of conversion, which we haven’t discussed\
    \ up till now, `Explicit type conversion`.\n\n## Using Implicit Type Conversions\
    \ in Function Calls\n\nWe have already discussed function calls in the 2nd chapter\
    \ of this book, if there is something that you do not understand in this section\
    \ about function calls, please refer to the topic that addresses this concept.\n\
    \nImplicit type conversion in a function call actually works pretty similarly\
    \ to how implicit type conversions in assignments are processed. This is because,\
    \ in function calls, the arithmetic types of the arguments being passed to the\
    \ function are converted into the types specified in the function prototype. In\
    \ this way, the parameters of the prototype function are followed and retained.\
    \ For example:\n\n```cpp\nvoid func( short, double); // Prototype\nint size =\
    \ 1000; // . .\nfunc( size, 68); // Call\n```\n\nIn this example, you can see\
    \ that the `func()` function has two arguments whose parameters have already been\
    \ defined in the function prototype at the beginning. These arguments are supposed\
    \ to be of `short` and `double` types. However, in the actual function call, you\
    \ can see that the arguments being used are both `int` types. In such cases, implicit\
    \ type conversion is performed to convert the `int` value `size` to a `double`\
    \ type, and the integer `68` is converted to a `double` type value. Note that\
    \ when an implicit type conversion takes place for this specific example, the\
    \ compiler will issue a warning. The main purpose of this warning is to remind\
    \ the user that since the `int` type is being converted to a `short` type, there\
    \ are chances for data loss. To avoid such warnings, we have the option of performing\
    \ an explicit type conversion.\n\n## Explicit Type Conversion\n\nJust as the name\
    \ suggests, in this type of conversion, we explicitly convert the expression types\
    \ by leveraging the functionality of the cast operator `(type)`. In other words,\
    \ we use the cast operator to perform an explicit type conversion. The syntax\
    \ for this has been shown below:\n\n`(type) expression`\n\nAccording to this syntax,\
    \ we are directly converting the value assigned to the expression to a specified\
    \ type. As such, explicit type conversion is also commonly referred to as ‘casting,’\
    \ even the operator is named after this process.\n\nSince the cast operator `(type)`\
    \ is, by nature, a unary operator, it holds a higher level of precedence than\
    \ the traditional arithmetic operators in C++. Let’s understand explicit type\
    \ conversions with the help of an example.\n\n```cpp\nint a = 1, b = 4;\ndouble\
    \ x;\nx = (double)a/b;\n```\n\nIn this example, we can see that the value assigned\
    \ to the variable `a` has been explicitly converted from an `int` type to a `double`\
    \ type. Explicit type conversion wasn’t performed on the other variable because\
    \ it’s type would automatically be converted to match the `double` type by the\
    \ compiler through implicit type conversion. After the implicit type conversion\
    \ is performed, the floating-point division operation is then carried out by the\
    \ compiler, and the exact result obtained is `0.25`. This value is finally assigned\
    \ to the `x` variable by using the assignment operator. Note that if we did not\
    \ perform casting in this example, then the program would have performed a simple\
    \ integer division operation, and the result it would have given would be `0`,\
    \ which is obviously incorrect.\n\nThe cast operator discussed in this section\
    \ for explicit type conversion is for general purposes. In C++, there are other\
    \ operators (for example, `dynamic_cast<>`) available as well that can be used\
    \ for explicit type conversion, but those are used for specific cases only.\n\n\
    ## Chapter 7: The Use of References and Pointers in C++\n\nIn this chapter, we\
    \ will learn about references and pointers, their use as parameters as well as\
    \ the values returned by functions in programming. The discussion of references\
    \ and pointers will mainly focus on passing by references and read-only access\
    \ arguments.\n\n## Defining References\n\nA variable or object that already exists\
    \ in a specific location in the memory is given another name or alias, which is\
    \ its reference. This variable can thus be accessed by using its original name\
    \ or reference. Defining a reference for an object does not mean that it’ll occupy\
    \ extra memory in the program. The defined references execute operations along\
    \ with the object to which it refers.\n\nA particular use of references is that\
    \ they are used as parameters which process the result of functions and return\
    \ their values.\n\nReferences are denoted by the ampersand symbol `&`, and `T&`\
    \ would be the reference to type `T`.\n\nExample:\n```cpp\nfloat x = 10.7;\nfloat\
    \ & rx = x; // or: float & rx = x;\n```\n\nHere it is clearly shown that `rx`\
    \ is used as another way to express the variable `x`, and this type of reference\
    \ is called the “reference to float.”\n\nExample:\n```cpp\n--rx; // equivalent\
    \ to --x;\n```\n\nIn the above example, it is elaborated that the operations involved\
    \ with `rx` will also affect the variable `x`. The ampersand character `&` used\
    \ for indicating references is related only to declarations and is not the same\
    \ as the address operator. The address operator is used to evaluate and return\
    \ the address of any object. If it is used as a combination with the reference,\
    \ it ends up returning the address of the object.\n\nExample:\n```cpp\n&rx\n```\n\
    \nWhen defining the reference for an object, it must be initialized before the\
    \ declaration and cannot be modified at a later stage.\n\n## Read-only references\n\
    \nIf a constant variable is to be defined for a reference, a `const` keyword should\
    \ be used so that the modification of the object by the reference can be avoided.\
    \ However, a non-constant object can also have a constant reference.\n\nExample:\n\
    ```cpp\nint a;\nconst int & cref = a;\n```\nThe reference `cref` is a read-only\
    \ identifier that gives read-only access to a variable such as `a` in the preceding\
    \ example. Compared to normal references, read-only identifier can be initialized\
    \ by a constant.\n\nExample:\n`const double& pi = 3.1415927;` The constants do\
    \ not occupy the memory, and hence, temporary objects generated by the compilers\
    \ are referenced.\n\n## References as Parameters\n\nA variable or object that\
    \ already exists in a specific location in the memory is given another name or\
    \ alias, which is its reference. This variable can thus be accessed by using its\
    \ original name or reference. Defining a reference for an object does not mean\
    \ that it’ll occupy extra memory in the program. The defined references execute\
    \ operations along with the object to which it refers. A particular use of references\
    \ is that they are used as parameters which process the result of functions and\
    \ return their values.\n\n## References as Return Values\n\nWhen a function’s\
    \ return type is used as a reference, the function call will represent an object\
    \ and will act as an object as well.\n\nExample:\n```cpp\nstring& message() {\n\
    \    static string str = \" Today only cuts \";\n    return str;\n}\n```\n\nIn\
    \ the function above, the reference is returned to a `static string`, which is\
    \ not a normal variable present in the function. It would be a critical error\
    \ to declare it as such because the string would be destroyed after the program\
    \ leaves the corresponding function. Thus, it is important to keep in mind that\
    \ after leaving a function, the object in which the return value references must\
    \ not be destroyed.\n\n## Calling a Reference Type Function\n\nThe function `message()`\
    \ is defined as the type that implies a reference to `string`, and so `string`\
    \ type object is represented by the calling `message()`. Some valid statements\
    \ with the function `message()` are:\n\n```cpp\nmessage() = \"Let's go to the\
    \ beer garden!\";\nmessage() += \" Cheers!\";\ncout << \"Length: \" << message().length();\n\
    ```\n\nJudging by the example, the object which is referenced by the function\
    \ call has the first new value assigned to it. After a new string is appended,\
    \ the string is then written as an output in the third statement. By defining\
    \ the function type as a read-only reference, the modification of the object that\
    \ is referenced can be prevented.\n\nExample:\n`const string& message();` // Read-only!\n\
    \nWhen the operators are overloaded, the type of reference chosen is the return\
    \ type. An appropriately chosen function carries out the operations an operator\
    \ executes when working with a user-defined type. Although overloading operators\
    \ will not be discussed here, some examples of standard class operators will be\
    \ provided.\n\n## Expressions with Reference Types\n\nExample: Operator `<<` of\
    \ class `ostream`\n\n```cpp\ncout << \"Good morning\" << '!';\n```\n\nAll the\
    \ expressions found in C++ are of a specific type, and if the expression is not\
    \ `void`, they can give out a value as well. Expressions also belong to the reference\
    \ types.\n\n## Stream Class Shift Operators\n\nSome operators can return the reference\
    \ value to an object such as the `<<` operator, which is used for stream input\
    \ and the `>>` operator, which is specific to stream output.\n\nExample:\n`cout\
    \ << \" Good morning \"`\n\nIn this expression, the `void` types are not used,\
    \ but instead, it is a reference to the object `cout` and represents that object.\
    \ Hence, the `<<` operator can be used on the expression repetitively.\n\n`cout\
    \ << \"Good morning\" << '!'` This statement or expression is equal to:\n`(cout\
    \ << \" Good morning \") << '!'`\n\nBy order of precedence, the expressions involving\
    \ `<<` operators are composed of the left. Similarly to the `<<` operator, the\
    \ stream `cin` is represented by the expression `cin >> variable` and can also\
    \ be used repeatedly.\n\nExample:\n```cpp\nint a;\ndouble x;\ncin >> a >> x; //\
    \ (cin >> a) >> x;\n```\n\n## Other Reference Type Operators\n\nThe simple assignment\
    \ operator `=` and compound assignments like `+=` and `*=` are also used as reference\
    \ type operators and the operand located on their left side receives the returned\
    \ reference value. Consider the following expression:\n\n`a = b` or `a += b`\n\
    \nThe variable `a` will be taken as the object and expression represent this object\
    \ `a.` This can also be possible for the objects of a class type that is referred\
    \ by an operator. But the available operators are specified by class definitions,\
    \ such as the example where assignment operators `=` and `+=` are defined in standard\
    \ class `string`.\n\nExample:\n```cpp\nstring name ( \"Johnny \" );\nname += \"\
    Depp\"; // Reference to name\n```\n\nIt is possible to pass this expression as\
    \ an argument to a function calling by reference because it is the type that represents\
    \ an object.\n\n## Defining Pointers\n\n```cpp\n// pointer1.cpp\n// Prints the\
    \ values and addresses of variables.\n// --------------------------------------------------\n\
    #include <iostream>\nusing namespace std;\nint var, *ptr; // Definition of variables\
    \ var and ptr\nint main() {\n    // ...\n}\n```\n\n## Pointers\n\n```cpp\n// pointer1.cpp\n\
    // Prints the values and addresses of variables.\n// --------------------------------------------------\n\
    #include <iostream>\nusing namespace std;\nint var, *ptr; // Definition of variables\
    \ var and ptr\nint main() {\n    var = 10;\n    ptr = &var;\n    cout << \"Value\
    \ of var: \" << var << endl;\n    cout << \"Address of var: \" << ptr << endl;\n\
    \    cout << \"Value via ptr: \" << *ptr << endl;\n    return 0;\n}\n```\n\n```cpp\n\
    // pointer1.cpp\n// Prints the values and addresses of variables.\n// --------------------------------------------------\n\
    #include <iostream>\nusing namespace std;\nint var, *ptr; // Definition of variables\
    \ var and ptr\nint main() {\n    var = 10;\n    ptr = &var;\n    cout << \"Value\
    \ of var: \" << var << endl;\n    cout << \"Address of var: \" << ptr << endl;\n\
    \    cout << \"Value via ptr: \" << *ptr << endl;\n    return 0;\n}\n```\n\n(Wait,\
    \ the source text for the pointer section was fragmented/repeated. I will re-format\
    \ the provided text in the prompt specifically.)\n\n```cpp\n// pointer1.cpp\n\
    // Prints the values and addresses of variables.\n// --------------------------------------------------\n\
    #include <iostream>\nusing namespace std;\nint var, *ptr; // Definition of variables\
    \ var and ptr\nint main() {\n    var = 10;\n    ptr = &var;\n    cout << \"Value\
    \ of var: \" << var << endl;\n    cout << \"Address of var: \" << ptr << endl;\n\
    \    cout << \"Value via ptr: \" << *ptr << endl;\n    return 0;\n}\n```\n\n*Self-correction:\
