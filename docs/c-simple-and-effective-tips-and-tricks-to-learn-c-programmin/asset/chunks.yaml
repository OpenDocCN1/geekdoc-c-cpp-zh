    - 每个指针变量所占据的内存空间不取决于它所引用的对象的类型，且它们是相同的，因为指针只存储每个对象的地址。在 32 位计算机上，指针变量通常占用四个字节。

    - 程序中使用逻辑地址，这些地址在系统的帮助下被分配到物理地址。通过这种方式，存储管理可以变得高效，并且当前未使用的内存块会被交换到硬盘上。

    - 当 C++ 中的有效地址显示值为 0 时，它表示存在一个错误，因为没有地址的值为 0。在标准头文件中，指针使用符号常量 `NULL` 代替 0，这些指针被称为
    `NULL` 指针`。


    ## 使用指针访问对象


    当一个变量指向一个对象时，我们可以通过星号（间接操作符）来访问该对象。但我们不应该将变量和对象彼此混淆。`ptr` 是变量，而 `*ptr` 是对象。


    示例：

    ```cpp

    long a = 10, b;     // 定义 a, b

    *ptr;               // 还有指针 ptr。

    ptr = &a;           // 让 ptr 指向 a。

    b = *ptr;

    ```

    在上面的示例中，我们可以看到 `ptr` 指向变量 `a`。另外，注意在开始时，`a` 的值被赋值给另一个变量 `b`。因此，最后我们也可以用变量 `a`
    替换变量 `b`，因为它们都代表相同的内容，即对象 `a`。


    `long *ptr;`

    上面的表达式意味着 `ptr` 是 `long*` 类型，这是一个指向 long 类型的指针。同样，也可以说 `*ptr` 是 long 类型。


    ## 左值 (L-values)


    C++ 中的左值（L-value）是指定内存位置以标识对象的表达式类型。左值源于赋值操作符，并出现在编译错误信息中。因此，赋值运算符 `=` 的左侧操作数始终指定一个存储在内存中的地址是非常重要的。


    除了左值以外的、无法被赋值的表达式只出现在赋值运算符 `=` 的右侧，并称为右值（R-values）。在语句中，变量是左值，而常量和如 `x+1` 等表达式是右值。左值也会通过间接操作符作为结果返回。考虑指针变量
    `p`，那么 `p` 和 `*p` 都是左值，因为 `*p` 是变量 `p` 所指向的对象。


    ## 指针作为参数


    接下来的程序演示了指针作为参数的实现。![](img/rsrc2YX.jpg)


    ## 对象作为参数


    当调用一个函数并将一个对象作为参数传递给所需的函数时，可能发生的情况如下：


    - 函数参数与传递给它的参数对象类型相同。因此，被调用的函数接收的是对象的副本（按值传递）。

    - 函数参数是一个引用，这意味着该参数是参数的别名。被调用的函数随后操作由调用函数传递给它的对象（按引用传递）。


    在按值传递中，显而易见的是接收参数的函数无法操作它，但在使用“按引用传递”时这是可能的。另一方面，与引用传递相关的第三种情况是将指针传递给所需的函数。


    ## 指针作为参数


    当函数参数被声明为指针变量时，可以以这种方式声明函数，将地址作为参数传递给函数。例如，通过语句：


    ```cpp

    long func( int *iPtr ){// 函数体}

    ```

    参数 `iPtr` 被声明为 int 指针，因此 int 值的地址可以作为参数传递给函数 `func()`。只有当函数知道该对象的内存地址时，才能通过间接操作符访问并操作该对象。


    示例程序中显示的 `swap()` 函数用于交换调用函数中变量 `x` 和 `y` 提供的值。变量的地址 `&x` 和 `&y` 已经作为参数传递给函数，这使得函数能够访问并操作这些变量。


    `swap` 函数包含两个参数 `p1` 和 `p2`，它们被声明为 float 指针。这些指针通过给定的语句用变量 `x` 或 `y` 的地址进行初始化：

    `swap(&x, &y);`


    通过操作表达式 `*p1` 和 `*p2`，该函数可以访问调用函数中可用的变量 `x` 和 `y`。这样，它们的值就可以进行交换。


