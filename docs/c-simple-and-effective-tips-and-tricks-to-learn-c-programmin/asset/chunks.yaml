    \    }\n    ifstream file( argv[1]);                    // Create a file stream//\
    \ and open for reading.\n    if( !file )                                 // Get\
    \ status.\n    {\n        cerr << \"An error occurred when opening the file \"\
    << argv[1] << endl;\n        return 2;\n    }\n    char line[80];\n    int cnt\
